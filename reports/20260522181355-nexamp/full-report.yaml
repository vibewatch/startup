      - number: '4.3'
        title: Cost structure and capital intensity
        blocks:
          - type: paragraph
            body: >-
              Nexamp's public evidence points to a cost structure dominated by project construction, subscriber
              acquisition, billing administration, and ongoing asset operations rather than pure software gross margin.
              DOE's PV benchmark framework is the closest public analog for the underlying build economics because it
              evaluates commercial and utility-scale systems, breaks overnight capex into eight categories, and analyzes
              O&M over system life. Berkeley Lab's Tracking the Sun dataset provides the broader distributed-solar
              backdrop on installed prices and financing, although it only covers projects up to 5 MW-AC; larger
              projects must be treated as utility-scale. In other words, public benchmarks can bracket Nexamp's cost
              envelope, but cannot reveal its realized project returns.

              The customer side is only somewhat clearer. NREL's subscriber-value work indicates that most
              community-solar subscribers save money on a net present value basis, which helps explain why Nexamp can
              market a 10%-15% discount without an upfront payment requirement. But those same public sources also
              highlight why the model is capital intensive: subscriber acquisition is not free, LMI acquisition is
              costlier, and storage remains a limited share of the historical community-solar base. Nexamp's own guide
              says the company manages projects from construction through operation, reinforcing that the company
              carries development and operating complexity across the full life cycle even if the public record never
              discloses project-level EBITDA, gross margin, or asset-level IRR.
            claimRefs:
              - CI012
              - CI021
