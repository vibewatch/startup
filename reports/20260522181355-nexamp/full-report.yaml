      - number: '3.3'
        title: Pricing, Packaging, Distribution Power, and Switching Costs
        blocks:
          - type: paragraph
            body: >-
              Public packaging is converging faster than public scale. EnergySage's provider comparison, CUB's Illinois
              chart, and multiple operator pages all point to a category where bill-credit discounts usually sit around
              10% to 20%, cancellation fees are often absent, and notice periods are often short enough that
              community-solar switching costs are meaningful but not crushing. In that context, customer-experience
              details matter disproportionately. Arcadia's single-bill and cancel-anytime pitch, Solar Landscape's
              consolidated-billing Illinois offer, Summit Ridge's one-month move termination, and Clearway's
              guaranteed-savings framing are all attempts to narrow the psychological and administrative gap between
              community solar and staying with the utility. Rooftop solar is still the higher-upside substitute for
              customers with a suitable roof, but SolarReviews' 2026 utility guide shows why many buyers still hesitate:
              utility fees remain, buyback rules can disappoint, interconnection adds time, and system-size rules
              constrain design. Nexamp therefore competes on a battlefield where price alone is not enough. The better
              winner is the firm that makes enrollment, billing, utility coordination, and local project availability
              feel more predictable than both peers and the status quo.
