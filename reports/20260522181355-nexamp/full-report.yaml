  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Priceability starts with capital access, but stops at the equity layer
        blocks:
          - type: paragraph
            body: >-
              Nexamp's public record is strong on financing momentum and weak on equity transparency. In the last two
              years the company has disclosed a $520 million corporate raise, a $340 million refinancing for an
              operating portfolio, a $350 million Macquarie construction facility plus separate Nomura development
              capital, and a 2026 preferred-stock Form D sized at just under $180 million. That pattern matters because
              it shows lenders and private capital providers still treating Nexamp as a financeable platform rather than
              a stranded project developer. It does not, however, solve the core valuation problem for a new investor.
              The same public record still omits the pieces that determine whether a fresh equity check buys attractive
              upside or just funds a layered capital stack above which common-equity returns are capped. There is no
              public GAAP revenue, no disclosed EBITDA or cash balance, no published debt-covenant package, and no
              public liquidation waterfall for the newer preferred equity. The investment conclusion from the public
              record is therefore asymmetric. Nexamp can plausibly claim platform status because institutional money
              keeps showing up, but the company cannot yet claim a public-market-like valuation standard because the
              data needed to size downside and upside at the common-equity layer remains private.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV046
