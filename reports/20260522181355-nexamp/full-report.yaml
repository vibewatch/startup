      - number: '3.2'
        title: Peer Profiles, Scale Signals, and Strategic Positioning
        blocks:
          - type: paragraph
            body: >-
              On public evidence, Nexamp faces multiple direct or near-direct peers with credible scale. Summit Ridge
              combines subscriber-facing community-solar products with more than 2 GW operating or under development and
              a recent $305 million financing package for Illinois and Maryland. Clearway competes from a large
              renewable parent and emphasizes roofless solar, guaranteed savings, and low customer friction. Arcadia is
              different in kind: it leads with 2 GW-plus of community-solar capacity under management, more than 223,000
              subscribers, and software-led acquisition and billing services, which makes it especially dangerous as a
              distribution and customer-experience competitor. Dimension and Pivot look closest to Nexamp on
              capital-and-development ambition. Dimension disclosed more than 1 GW executed, 3.5 GW under development,
              35,000-plus customers, and a $650 million financing package, while Pivot pairs nearly 1,900 projects and
              more than 4 GW of total solar development with a 500 MWac Microsoft framework and other portfolio
              financings. Solar Landscape is the clearest category-blurring entrant: it attacks the market through
              commercial rooftops, real-estate owner relationships, and a financing structure built for fast distributed
              deployment rather than through the classic greenfield community-solar playbook.
