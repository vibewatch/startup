  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct, Adjacent, Substitute, and Status-Quo Landscape
        blocks:
          - type: paragraph
            body: >-
              Nexamp's competitive set is easiest to understand by class rather than by a single one-to-one rival. The
              nearest direct peers are other community-solar developers and operators that control project origination,
              financing, asset execution, and at least part of subscriber management. Public evidence places Summit
              Ridge, Clearway, Dimension, Pivot, and Solar Landscape in that orbit, even though each leans on a
              different channel or site strategy. Arcadia matters, but more as an adjacent platform than as a
              mirror-image developer: its public pitch is national subscriber management, turnkey services for
              developers, and friction reduction for customers rather than proprietary land or rooftop control. Buyers
              also compare Nexamp against substitutes and the status quo, not just against peers. Rooftop or
              internal-build solar can offer more ownership upside for customers with suitable roofs and capital, while
              default utility service remains the easiest path because it preserves one familiar bill and avoids
              contract switching. The competitive question is therefore not just who else sells community solar. It is
              who can win the same customer job with the lowest friction and the most durable local execution.
            claimRefs:
