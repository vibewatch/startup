      - number: '7.2'
        title: Operational, billing, and customer-service risk
        blocks:
          - type: paragraph
            body: >-
              Nexamp's public record shows that operational risk is not confined to building solar assets; it also sits
              in the data,

              billing, and support layers that connect projects to subscribers. The company's own terms show how much
              the customer

              experience can depend on flawless credential access, timely utility bill retrieval, successful autopay,
              and clean

              handoffs between Nexamp and the utility. That makes billing friction more than a cosmetic issue. BBB's
              complaint volume,

              Trustpilot's mixed-but-positive March 2026 snapshot, and Nexamp's own One Bill caveats together suggest a
              real pattern:

              many customers do save money and like the service, but a meaningful subset still encounters billing,
              collections, or

              support pain. Interconnection timing adds another operational channel. Illinois program pages show
              waitlist pressure and

              developer caps, while Canary reported Ameren's one-at-a-time studies as a threat to projects trying to
              preserve federal

              tax-credit eligibility. In other words, Nexamp's operating risk comes from process dependence across
              utilities,

              subscriber billing, and queue management, not from a single factory or product defect.
