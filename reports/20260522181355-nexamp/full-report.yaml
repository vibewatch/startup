  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio and user jobs
        blocks:
          - type: paragraph
            body: >-
              Nexamp's product is not a single app or a single financing wrapper. The public product surface spans a
              consumer community-solar subscription, commercial power-purchase agreements, landowner hosting, standalone
              owner-services support, energy storage, solar development, and the Developer Accelerator Program for
              third-party developers. The strongest common thread across those offers is vertical integration: Nexamp
              presents itself as the party that can finance, engineer, construct, own, operate, and then manage the
              customer or partner relationship instead of handing off responsibility at a narrow project milestone.


              That matters for diligence because the company appears to differentiate less on a consumer-facing software
              SKU than on operating breadth. The business menu and Solar Development page both describe a platform that
              joins asset acquisition, clean-energy deployment, asset management, customer acquisition, and utility
              coordination. The Developer Accelerator Program extends the same operating model outward by offering
              financing, pricing tools, trackers, and shared data rooms to external developers. In other words, Nexamp's
              publicly visible product architecture is a service-and-asset stack with software embedded inside it, not
              software sold by itself.
