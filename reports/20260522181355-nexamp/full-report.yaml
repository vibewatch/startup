      - number: '4.4'
        title: Capital adequacy and financing dependence
        blocks:
          - type: paragraph
            body: >-
              The clearest financial evidence for Nexamp is not operating performance; it is financing activity. In
              April 2025, Nexamp closed a $340 million private-placement debt refinancing with PGIM Private Capital
              covering 39 solar farms in seven states, representing 150 MW of solar and 37 MWh of storage. The disclosed
              $107 million PPC shelf facility is especially important because it signals an explicit follow-on capital
              channel for future projects over the next three years. Separate 2025 disclosures then added another layer
              of capital support: Macquarie announced a $350 million long-term financing facility for Nexamp's
              utility-scale expansion, and Renewables Now reported that Nomura also provided undisclosed development
              capital for earlier-stage projects.

              The 2026 Form D is the latest balance-sheet signal. Nexamp filed an exempt offering for up to $179,997,174
              of Series 1E2 Preferred Stock, with a first sale dated February 27, 2026. Put together, the public capital
              stack now shows project debt, infrastructure financing, and preferred equity all within roughly a 14-month
              window. That is consistent with a business that owns and develops significant solar assets and still needs
              outside capital to fund growth. What the public record does not show is the other side of the ledger:
              current unrestricted cash, monthly burn, debt covenants, recourse structure, or true liquidity headroom
              after committed capex.
