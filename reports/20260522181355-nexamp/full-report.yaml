      - number: '4.5'
        title: Adverse exposure, public gaps, and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Nexamp's main adverse financial signal in the current record is not subscriber dissatisfaction; it is
              project-cost uncertainty. In its August 2025 complaint to the New York PSC, Nexamp said National Grid
              sought $3,615,637 of additional interconnection costs across 14 projects, a 52% increase versus prior
              amounts, and warned of about $9.2 million of expected additional invoices across 29 development projects
              plus another estimated $10 million of uncertain exposure across 12 more. The PSC's notice restated
              Nexamp's allegation that National Grid failed to provide cost estimates in good faith or justify the
              increased reconciliation invoices. For a company scaling in community solar, that kind of surprise cost
              inflation can erode project returns and tighten liquidity even when the company has fresh financing.

              Broader policy risk compounds the problem. CBRE's 2026 market update flags near-term tax-credit
              construction deadlines, Illinois capacity exhaustion in the ABP program, and Maryland's move from NEM 1.0
              to lower-compensation NEM 2.0. Wood Mackenzie still describes a competitive but maturing market in which
              cumulative installations have passed 10 GWdc, yet 2025 installations fell 25% from 2024. The conclusion is
              therefore mixed: Nexamp appears well financed enough to keep building, but public evidence is still
              insufficient to underwrite revenue quality, margin durability, or runway. The financial thesis is
              investable only with private revenue, margin, covenant, and cash data.
            claimRefs:
