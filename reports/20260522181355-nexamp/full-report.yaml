      - number: '7.4'
        title: Residual exposure, mitigations, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The strongest public mitigants are real but incomplete. Nexamp is not operating in a vacuum: New York's
              SIR process,

              state program managers, utility tariff filings, and active policy working groups create channels for
              reform; the company

              has recently raised fresh debt and equity capital; and customer-review surfaces are mixed rather than
              uniformly

              negative. Even so, the residual verdict remains cautious because the visible mitigants do not yet close
              the most

              investment-relevant questions. Public sources still do not quantify top-customer concentration, supplier
              concentration

              by spend or MW, covenant headroom, cash runway, project-level returns, or a detailed security-control
              posture. That is

              why the cleanest kill criteria are measurable operational and financing events rather than vibes: more
              surprise

              interconnection invoices, growing complaint backlogs, financing or supplier slippage, or management's
              inability to

              produce concentration and economics data in diligence. If those triggers appear, the risk story would
              shift from

              manageable complexity to thesis impairment.
