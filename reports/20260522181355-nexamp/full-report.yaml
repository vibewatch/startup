  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Nexamp should not be analyzed against a vague “all solar” TAM. The core market in this chapter is
              state-enabled community solar: off-site, distribution-connected projects whose bill credits flow to
              multiple customers and are monetized through subscription management, anchor-tenant demand, and recurring
              utility-bill savings. DOE materials define the product around shared benefits flowing to households,
              businesses, nonprofits, and other customer classes rather than around single-site ownership. That matters
              because the relevant substitute set is not only other solar developers. The real alternatives include
              staying on default utility supply, installing rooftop solar when the site allows it, signing a different
              shared-solar subscription, or pursuing a separate onsite commercial project. Nexamp's strongest fit is
              where customers want savings and clean-energy participation but cannot or will not install rooftop solar
              themselves. The company's own customer materials reinforce this: the offer is no-upfront-cost bill-credit
              savings with separate invoicing, not a hardware sale. This makes the market boundary narrower than the
              total solar market but wider than just low-income residential subscriptions, because public-sector
              anchors, small businesses, and other non-residential accounts can stabilize project economics.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM022
              - CM023
              - CM036
