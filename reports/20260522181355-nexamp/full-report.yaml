            body: >-
              Nexamp's public leadership picture is strongest at the executive level and weakest at detailed governance.
              The leadership page identifies Zaid Ashai as chairman and CEO, Will Thompson as co-founder and senior vice
              president of asset-management services, and an operating bench that includes Kamran Idrees in legal, Peter
