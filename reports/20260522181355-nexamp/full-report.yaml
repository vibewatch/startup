      - number: '5.2'
        title: Customer workflow, billing rails, and service operations
        blocks:
          - type: paragraph
            body: >-
              The clearest public workflow is the community-solar subscription journey. Nexamp's consumer page says
              households sign up, provide utility-account details, wait for assignment to a farm, and then begin
              receiving bill credits on the utility side of the relationship. The company positions the offer as simple
              because there are no rooftop panels or upfront costs, but the actual operating flow is more involved:
              utility credits post one way, the subscription charge is paid through Nexamp, and the customer experience
              changes again if the user enrolls in paperless billing, Autopay, or One Bill.


              Nexamp's help-center and legal materials make the service layer more concrete. Customers manage billing
              preferences through the portal, Autopay only begins once the account is current, and paperless billing
              becomes the default after the first invoice when an email address is on file. One Bill goes further by
              requiring utility credentials and authorizing Nexamp to retrieve utility bills and facilitate payment on
              the customer's behalf. This is a meaningful operational convenience, but it also means the product depends
              on utility timing, customer credential accuracy, and exception handling when people move, disable Autopay,
              or receive no invoice in a given cycle.
