      - number: '8.3'
        title: A range is possible, but only as a discipline tool rather than a price target
        blocks:
          - type: paragraph
            body: >-
              Given that dispersion, the right public-only output is not a precise mark but an underwriting discipline.
              The base conclusion is that Nexamp deserves to trade above distressed public solar stubs because it is
              still raising capital and appears relevant to a community-solar market that has crossed 10 GW nationally.
              It also deserves to trade below the strongest platform references because the company is materially less
              transparent than Altus or a fully reported contracted-power issuer. That logic supports a wide
              enterprise-value band rather than an equity value per share. The bear case treats Nexamp as an opaque,
              policy-exposed project roll-up whose preferred and debt layers absorb much of the upside. The base case
              assumes private diligence confirms stable asset-level cash yields and manageable seniority but still not
              enough disclosure to justify a full platform premium. The bull case requires audited proof that Nexamp can
              convert capital access into durable cash generation and that the capital stack is clean enough for a new
              investor to share in that upside. Because those proof points are not public today, the recommendation is
              research-more, not buy. The range is useful as a ceiling on what to pay, not as evidence that a hidden
              price is already fair.
