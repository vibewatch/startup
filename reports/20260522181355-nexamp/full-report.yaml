      - number: '7.3'
        title: Partner, capital, and execution dependence
        blocks:
          - type: paragraph
            body: >-
              Nexamp's model is capital intensive and counterparties matter. Public financing disclosures show the
              company leaning on

              multiple layers of outside capital at once: PGIM-backed refinancing for operating assets, Macquarie
              construction capital

              for utility-scale projects, Nomura development capital for earlier-stage work, and a 2026 preferred-equity
              Form D. That

              is not a sign of distress on its own, but it does mean growth is financing-conditioned. Supplier and
              execution

              dependence are visible too. Heliene's investor deck calls Nexamp its largest customer and shareholder,
              which suggests a

              strategically aligned relationship but also a two-way concentration risk if manufacturing ramp, delivery
              timing, or

              domestic-content assumptions slip. Nexamp's own leadership and careers pages, plus Built In listings,
              reinforce the

              same conclusion from a different angle: the company still needs significant specialized capacity in
              interconnection,

              OT/SCADA reliability, collections, auditing, and scheduling. Comparably's weak leadership score is not
              decisive on its

              own, but it increases the burden of proof on bench depth and execution discipline.
