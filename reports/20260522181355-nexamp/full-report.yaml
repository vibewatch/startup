      - number: '6.3'
        title: Durability, satisfaction, and retention visibility
        blocks:
          - type: paragraph
            body: >-
              Durability evidence is directionally positive but incomplete. The best public retention-style proof is
              Albany Medical Center's five-plus-year partnership, which Nexamp says is still compounding savings and has
              even encouraged other hospitals in the system to adopt community solar. Trustpilot's March 2026 snapshot
              also suggests broad satisfaction at the household level, with 693 reviews and a 4.4/5 rating, and many
              excerpts praising easy signup, clear explanations, and real savings. But those positives sit next to a
              consistent friction theme: public reviews and third-party explainers repeatedly describe confusion around
              the two-bill model, the timing gap between utility credits and Nexamp invoices, and occasional slow
              customer-service resolution. Official pages help explain why the model can feel unintuitive, because
              savings are framed annually, credits can roll over seasonally, and business customers may have different
              billing setups such as consolidated billing. What is still missing is hard durability data: no public NRR,
              GRR, churn, renewal, or cohort disclosures were found for either household subscribers or anchor
              customers.
