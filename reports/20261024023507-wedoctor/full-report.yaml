          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI013
      - number: '4.2'
        title: Cost structure and operating leverage
        blocks:
          - type: paragraph
            body: >-
              Public disclosures provide operating proxies rather than complete unit economics. Health Advances reported
              that 2020 sales and marketing expense rose 56% to $74 million, while consultation volume reached 18
              million, up 38%; neither metric supplies CAC, payback, paid conversion, or contribution margin. Delivery
              is also operationally intensive: older evidence placed the network above 2,700 hospitals, and a Tai'an
              chronic-care deployment linked 23 outpatient pharmacies while serving more than 200,000 patients. Longport
              reported a decline in average monthly medical expense for diabetic patients in the Tianjin model from RMB
              1,643 to RMB 1,255, a 23.6% reduction. That outcome is relevant to value-based economics, but it is not
              WeDoctor gross profit. Against this backdrop, the reported first-half 2024 adjusted net loss of about RMB
              128 million, roughly half the prior-year level, indicates movement toward operating leverage without
              proving positive cash generation.
            claimRefs:
              - CI006
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI015
      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The retained evidence establishes financing intent, not capital adequacy. Late-2024 reporting said
              WeDoctor expected a Hong Kong IPO to raise US$400 million to US$500 million, while the filed application
              did not disclose a committed fundraising size or timetable. Reported uses included expanding partnerships,
              advancing AI, improving service quality and management efficiency, and funding working capital. Those
              plans imply continuing investment needs, but proceeds from an uncompleted offering are not cash available.
              Execution risk is material because WeDoctor's 2021 listing attempt was disrupted during the regulatory
              crackdown that particularly affected businesses handling sensitive medical data. The financial verdict is
              therefore conditional: revenue growth, mix shift, and loss compression are constructive, but underwriting
              requires audited segment statements, payer and member cohorts, gross-margin bridges, receivables aging,
              cash and debt schedules, and a reconciled runway. Until those inputs are supplied, neither liquidity nor
              durable contribution economics can be established.
            claimRefs:
              - CI004
              - CI006
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing is planned, not secured
            body: >-
              The reported US$400 million to US$500 million IPO target is a prospective funding event, not evidence of
              cash on hand or runway; the prior failed listing attempt makes timing and execution explicit underwriting
              risks.
            calloutType: risk
            claimRefs:
              - CI014
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and user workflow
        blocks:
          - type: paragraph
            body: >-
              WeDoctor's product is best understood as a regional health-service operating system rather than a
              standalone telemedicine application. The public description combines health-management membership
              services, cloud pharmacy, value-added services, digital consultations, follow-up visits, medication
              dispensing, and offline medical centers. The Health Community model links residents and patients to
              hospitals, primary-care institutions, doctors, insurers, and local health administrators. In the
              documented Tianjin model, service starts with prevention or risk assessment, moves through diagnosis and
              treatment, and continues into chronic-care management and health follow-up. The product therefore depends
              on coordinated local supply and payment mechanisms, not only on an app or model endpoint.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE006
              - CE010
      - number: '5.2'
        title: Architecture and AI operating model
        blocks:
          - type: paragraph
            body: >-
              The evidence describes a layered architecture with a regional digital-health cloud or platform, integrated
              institutional and pharmacy workflows, and AI agents embedded in clinical and administrative work. Public
              descriptions name AI doctor, AI pharmacist, AI health manager, and AI intelligent-control agents, while
              another account adds WeDoctor Mini and an AI General Hospital as the coordinating layer. The
              company-linked reporting also describes de-identified clinical records and medical conversations as
              training inputs, but the public materials do not disclose model cards, evaluation protocols beyond a cited
              benchmark, latency, uptime, or integration APIs. The architecture is therefore specific enough to identify
              operating dependencies, but not sufficiently documented to underwrite technical scalability or safety
              independently.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE007
      - number: '5.3'
        title: Maturity, deployment, and differentiation
        blocks:
          - type: paragraph
            body: >-
              WeDoctor has evidence of deployment beyond a pilot concept: an academic case describes the transition from
              appointment registration to Internet hospitals and digital-health communities, a prospectus summary
              reports a long-running Tianjin Health Community, and 2026 coverage describes expansion into additional
              city programs. The strongest product differentiation is the combination of local operating integration,
              health-management payment design, and clinical data feedback rather than a generic chatbot. The medical
              large model is reported as first on the CMB-Exam benchmark with an average score of 91.71, and three
              WeDoctor models are reported as having passed a national algorithm-registration batch. Those are
              meaningful maturity signals, but they remain partly company-linked or media-reported and do not establish
              general clinical accuracy.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Trust, safety, and implementation risks
        blocks:
          - type: paragraph
            body: >-
              Health data, algorithm governance, and local implementation are central product risks. The public evidence
              indicates that WeDoctor operates in a regulated environment and has reported algorithm registrations, but
              the assigned pool does not provide a usable primary text for the cited Personal Information Protection
              Law, nor a public security or status page. The GitHub organization page states that it has no public
              repositories and no public members, which limits external inspection of developer activity rather than
              proving that no private engineering capability exists. City expansion also creates dependency on
              government, hospital, insurance, data-governance, and pharmacy counterparties. Diligence should therefore
              test access controls, de-identification, incident response, validation by disease and subgroup, rollback
              procedures, service-level performance, and the economics of each city deployment.
            claimRefs:
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is operational as well as technical
            body: >-
              The strongest evidence points to a city-level care and payment operating model that embeds AI in a broader
              regional workflow; a generic model benchmark alone would not explain the product's defensibility.
            calloutType: strength
            claimRefs:
              - CE002
              - CE009
              - CE010
          - type: callout
            title: Public technical assurance is incomplete
            body: >-
              Public sources identify model, data, and algorithm-registration claims, but the assigned evidence does not
              provide independent clinical validation, security controls, reliability history, or a public engineering
              surface.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer segments
        blocks:
          - type: paragraph
            body: >-
              WeDoctor serves a multi-sided customer system rather than a single software buyer. Government and
              medical-insurance authorities are strategic counterparties in regional Health Community deployments;
              medical institutions and pharmacies are operating participants; and members are the people receiving
              coordinated care. The 2025 prospectus coverage describes health-management membership services as a
              regional system integrating medical institutions and online/offline care, while the 2022 partner program
              describes regional partners and local governments as the expansion channel. This structure creates
              strategic value through coordination, but it also means procurement, implementation, and payment depend on
              public-sector and provider relationships. The sources identify use cases and participating institutions,
              yet do not disclose contract length, renewal terms, or revenue by customer type. Named logos or
              participating facilities should therefore be read as deployment evidence, not proof of recurring
              retention.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
      - number: '6.2'
        title: Adoption and operating evidence
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption evidence is deployment-specific. A Tai'an government report described an online
              chronic-disease hospital connected to 23 outpatient pharmacies and serving more than 200,000
              chronic-disease patients in the city. A 2025 prospectus summary reported approximately 900,000 members
              receiving multi-disease and diabetes services in Tianjin as of June 30, 2024, while a later industry
              article reported more than 1.666 million Tianjin users and described five cities joining the Health
              Service Community model from 2025. These figures are not directly comparable: they use different dates,
              geographies, definitions, and issuers. WeDoctor also reported a 107.4% first-half 2024 revenue increase,
              but revenue is not a customer count or active usage metric. The evidence shows expansion and reach, not a
              verified cohort-level trajectory.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Named deployments, expansion, and durability gaps
        blocks:
          - type: paragraph
            body: >-
              Named deployments provide better proof than an undifferentiated logo list. Tai'an is tied to a
              chronic-disease hospital, pharmacies, prescriptions, insurance payments, and delivery; Tianjin is tied to
              multi-disease management across primary institutions and hospitals; and the 2022 partner program documents
              a shift from direct operation toward joint regional expansion. The commercial model appears capable of
              embedding in local workflows, but the available sources are largely company-related, public-sector
              descriptions, or media summaries. They do not disclose churn, gross retention, net retention, renewal
              cohorts, customer-level gross margin, or the share of revenue from the largest city or payer. Independent
              reports also connect WeDoctor's earlier IPO disruption to scrutiny of businesses handling sensitive
              medical data, reinforcing data-governance and procurement risk. The core diligence question is therefore
              durability: whether deployments remain funded and clinically used after launch, and whether partner-led
              expansion preserves service quality and economics.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU009
              - CU010
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs: []
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Adoption is real but not yet durable by disclosure
            body: >-
              Named deployments and reported member counts demonstrate operating reach, but no assigned source discloses
              retention, churn, renewal, or customer-level concentration. Treat expansion as a positive adoption signal
              with an unresolved durability risk.
            calloutType: insight
            claimRefs:
              - CU005
              - CU006
              - CU012
          - type: callout
            title: Public-sector and partner dependence
            body: >-
              The customer model depends on regional authorities, providers, and local partners. Procurement cycles,
              payment-policy changes, and uneven partner execution could affect deployment timing and service quality.
            calloutType: risk
            claimRefs:
              - CU002
              - CU009
              - CU011
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >
              WeDoctor operates at the intersection of medical services, software regulation, artificial intelligence,
              insurance reimbursement, and sensitive health data. ICLG identifies separate oversight roles for the NHC,
              NMPA, NHSA, CAC, and other agencies, and says health information is sensitive personal information under
              the PIPL. It also describes lifecycle obligations for AI medical devices, cross-border data formalities,
              and the need for online care to remain affiliated with licensed physical hospitals. These are sector
              rules, not evidence that WeDoctor has breached them; they establish a broad compliance surface whose
              controls must be tested. The IRMA case describes regulatory legitimacy and local-government collaboration
              as important to WeDoctor's historical growth, so approvals and public relationships are enabling
              dependencies as well as safeguards. The diligence priority is a product-by-product inventory of licenses,
              algorithm filings, intended uses, data flows, validation, and material regulatory correspondence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR012
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR009
              - CR012
              - CR015
      - number: '7.2'
        title: Operating, quality, and security exposure
        blocks:
          - type: paragraph
            body: >
              The operating surface is unusually distributed. Prospectus-based reporting says WeDoctor connected about
              11,500 medical institutions and 318,000 physicians, while older HBS analysis describes technology shared
              among hospitals, clinics, governments, and businesses. That reach creates leverage, but it also creates
              more handoffs where identity, access, record reconciliation, service quality, and incident response can
              fail. VCBeat reports a strong medical benchmark score and very large training or operating datasets, yet a
              benchmark of knowledge and consultation capability is not prospective proof of patient safety, fairness,
              drift control, or real-world error rates. No successful assigned source provides current uptime, breach
              history, penetration testing, adverse-event data, or human-override rates. The investment case therefore
              requires direct evidence of controls rather than treating data volume, algorithm filings, or benchmark
              leadership as substitutes for clinical and security assurance.
            claimRefs:
              - CR010
              - CR011
              - CR014
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR010
              - CR011
              - CR012
              - CR014
              - CR015
              - CR016
      - number: '7.3'
        title: Model, financing, and dependency exposure
        blocks:
          - type: paragraph
            body: >
              Commercial concentration is visible in the reported mix. VCBeat, citing prospectus data, says
              health-management membership services supplied RMB 1.032 billion, or 56.8% of continuing-operations
              revenue, in the first half of 2024. A later 36Kr report says first-half 2025 total revenue reached RMB
              3.08 billion and membership-service revenue reached RMB 2.389 billion, while describing Tianjin as the
              performance "ballast stone." These reports indicate momentum but also make city execution, capitation
              economics, payer oversight, and renewal quality central risks. Financially, reported adjusted accounting
              loss narrowed to RMB 128 million in the first half of 2024; that is not cash burn or proof of liquidity.
              The IPO filing's stated working-capital use and an earlier listing disruption support a financing-timing
              risk, but not a claim of current insolvency. Expansion must be tested city by city rather than inferred
              from Tianjin.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Mitigations, monitoring, and thesis-break criteria
        blocks:
          - type: paragraph
            body: >
              Mitigation maturity cannot be rated as strong from the assigned public evidence. The legal framework is
              identifiable, historical government collaboration is documented, and reported losses improved, but the
              company-specific control evidence needed to reduce residual risk is absent. Before investment, monitoring
              should cover license and filing status, material regulatory inquiries, model changes, adverse clinical
              events, security incidents, uptime, claim denials, city-level member renewal, provider participation,
              reimbursement terms, adjusted loss, cash, and runway. Thesis-break events should include suspension of a
              material medical license; a material privacy, security, or patient-safety incident; inability to validate
              high-risk AI workflows; loss of a material public payer or provider network; repeated failure of newer
              cities to meet contracted utilization or renewal thresholds; or financing terms that leave disclosed
              working-capital needs unresolved. These are diligence triggers, not predictions that an event has
              occurred.
            claimRefs:
              - CR001
              - CR003
              - CR007
              - CR008
              - CR012
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR007
              - CR009
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-conviction exposure
            body: >-
              Sensitive health data, clinical AI, and multi-party care delivery create correlated compliance and
              operating exposure; reported scale increases the need for direct control evidence.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR014
              - CR015
          - type: callout
            title: Evidence boundary
            body: >-
              The assigned sources do not establish whether a breach, outage, enforcement action, failed deployment, or
              material litigation has occurred; no absence claim is made.
            calloutType: assumption
            claimRefs:
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investment case is built on a business model that links health-management membership revenue to
              regional care delivery rather than relying only on transaction volume. A prospectus-based account reports
              continuing-operations revenue of RMB 1.818 billion in the first half of 2024, up 107.4% year on year, and
              says health-management membership services contributed RMB 1.032 billion, or 56.8% of
              continuing-operations revenue. The same account describes a network of approximately 11,500 medical
              institutions and 318,000 physicians, while the Tianjin model is reported to cover 266 community health
              centers and more than 2,000 stations and clinics. These are meaningful scale and distribution signals, but
              they are not a substitute for audited segment margins, cohort retention, cash conversion, or a verified
              equity price.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV012
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV013
      - number: '8.2'
        title: Price discipline and financing context
        blocks:
          - type: paragraph
            body: >-
              Public financing evidence is incomplete and should constrain rather than inflate the recommendation.
              TMTPost reported that WeDoctor was considering a Hong Kong listing intended to raise $400 million to $500
              million and that earlier listing plans had been derailed by a regulatory crackdown affecting firms
              handling sensitive medical data. That is financing context, not a completed round, an equity valuation, or
              cash available to existing holders. The assigned sources also include a live Alibaba Health market-data
              page with reported EV/revenue of 1.17 as of July 31, 2026; this is a public comparable, not a WeDoctor
              mark. A defensible entry decision therefore requires the prospectus, cap table, preference stack,
              primary/secondary price, dilution terms, and use-of-proceeds disclosures.
            claimRefs:
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV010
              - CV015
      - number: '8.3'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              Scenario framing should be driven by observable milestones rather than a false point estimate. The bull
              case requires repeatable city deployments, continued membership growth, evidence that value-based payment
              converts into durable gross profit, and a clean listing or financing process. The base case assumes the
              Tianjin proof point remains real but replication is slower and public disclosure remains incomplete; in
              that case, the company may deserve continued diligence rather than an immediate buy. The bear case is
              triggered by regulatory delay, weak renewal or concentration outside Tianjin, inability to convert
              reported healthcare outcomes into cash earnings, or a down-round caused by liquidity needs. Market reports
              describe strong digital-health growth but also identify patient confidence and trust as constraints, so
              market expansion alone cannot close the valuation gap.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV008
              - CV015
      - number: '8.4'
        title: Decision, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The current decision is research-more, with high risk and medium confidence, because the operating thesis
              is better evidenced than the price thesis. The evidence supports a potentially differentiated platform:
              WeDoctor's medical large model ranked first on the cited CMB evaluation, its AI applications are embedded
              in health-community workflows, and the company has reported improvements in selected Tianjin
              chronic-disease indicators. Yet the same evidence is predominantly company-linked or trade coverage, while
              the independent pool does not disclose a current WeDoctor valuation, audited profitability, net retention,
              or preference overhang. Before investment, diligence should obtain the latest filing and cap table,
              reconcile continuing operations with cash flow, test city-level renewal and payer economics, and verify
              governance, data-security, and AI-model controls. Exit readiness is therefore conditional on a completed
              listing or a transaction with transparent terms, not merely on reported IPO intent.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Principal valuation risk
            body: >-
              The assigned evidence establishes operating signals but not a current investable price; a precise
              valuation conclusion would overstate the record.
            calloutType: risk
            claimRefs:
              - CV005
              - CV015
