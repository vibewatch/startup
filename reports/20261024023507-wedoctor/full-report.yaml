        title: Leadership, capital, and disclosed scale
        blocks:
          - type: paragraph
            body: >-
              Jerry Liao is the only named operating leader consistently identified across the assigned evidence, making
              leadership depth and succession planning open questions rather than established strengths. Capital figures
              must remain separated by metric and vintage: Tracxn reports $894 million of total funding through May
              2018, while South China Morning Post reported a $5.5 billion private valuation after fundraising in 2018.
              Neither figure establishes current cash availability or entry valuation. Operating disclosures are more
              recent: continuing-operations revenue reached RMB 1.818 billion in the first half of 2024, while adjusted
              loss was RMB 127.9 million. Revenue is not ARR, and adjusted accounting loss is not cash burn. Public
              sources name several investors, but not their current ownership, preferences, board rights, or liquidity
              needs.
