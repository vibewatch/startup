chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              WeDoctor was founded in 2010 by Jerry Liao and his team and is headquartered in Hangzhou. Recent coverage
              of the company's listing materials describes two core businesses: AI-powered healthcare services and a
              digital healthcare platform. That positioning is broader than a consumer appointment marketplace because
              it includes regional health-management operations, institutional connectivity, online services, and owned
              physical hospitals. Reporting also dates WeDoctor's Tianjin Health Service Community cooperation to 2020,
              providing a multi-year operating history before the newer city pilots. The breadth creates several
              potential revenue surfaces, but it also raises the diligence burden around which legal entities own the
              contracts, technology, licenses, and patient-data responsibilities in each city.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs: []
