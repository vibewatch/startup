        title: Milestones and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The evidence shows a progression from internet healthcare infrastructure to regional health-management
              operations. WeDoctor established what IPO coverage calls China's first internet hospital in 2015 and began
              its Tianjin Health Service Community cooperation in 2020. The latest retained listing coverage reports
              approximately 11,500 connected medical institutions, around 318,000 physicians, six physical hospitals,
              and approximately 900,000 Tianjin members as of June 2024. A later 36Kr article describes 2026 pilots or
