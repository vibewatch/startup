              audited city-level economics. WeDoctor submitted another Hong Kong listing application on December 31,
              2024 after a 2021 attempt was disrupted amid regulatory pressure on companies handling sensitive medical
              data. The filing is therefore evidence of renewed liquidity intent, not a completed financing or proof
              that regulatory and disclosure risks have cleared.
