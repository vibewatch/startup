  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The addressable market should not be treated as all healthcare spending. This chapter defines the relevant
              market as digitally enabled healthcare delivery and management in China: online consultation and
              follow-up, internet-hospital infrastructure, health-management membership, cloud pharmacy and related
              digital tools sold to providers, payers, and public-sector health systems. It excludes conventional
              inpatient care, non-digital drug dispensing, and general insurance premiums except where a digital
              workflow or management contract captures value. The boundary matters because published estimates use
              different populations and units. ResearchAndMarkets describes China online healthcare as including online
              pharmacy, digital healthcare infrastructure, online enterprise service, online consultation, online
              consumer healthcare and other categories, while Market Research Future uses digital-health technology,
              component, application and end-user lenses. The resulting TAM is a directional ceiling, not a WeDoctor
              revenue forecast.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM005
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM011
