  - id: FR001
    title: Residual-risk heatmap
    type: matrix
    summary: >-
      Impact is highest where regulated data, clinical AI, public-payer economics, and financing depend on controls or
      disclosures not present in the assigned public evidence.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation evidence
      rows:
        - label: Sensitive-data compliance
          values:
            - Medium
            - Critical
            - Framework clear; company controls unverified
        - label: Clinical-AI safety
          values:
            - Medium
            - Critical
            - Filings and benchmark reported; validation gap
        - label: City and provider execution
          values:
            - Medium
            - High
            - Tianjin evidence; cross-city cohorts missing
        - label: Payer and membership concentration
          values:
            - Medium
            - High
            - Reported scale; contracts and renewal gaps
        - label: Provider-network reliability
          values:
            - Medium
            - High
            - Large network reported; uptime and quality gaps
        - label: Financing and IPO timing
          values:
            - Medium
            - High
            - Loss improved; cash and runway undisclosed
    approximationNotes: >-
      Ordinal labels are source-anchored analytical judgments; they are not probabilities, loss estimates, or
      independently verified control scores.
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR007
      - CR009
      - CR013
      - CR014
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Scale and differentiated care economics support diligence, while missing price and downside evidence keeps the
      recommendation at research-more.
    data:
      nodes:
        - id: scale
          label: Reported scale and growth
          detail: RMB 1.818bn H1 2024 continuing-operations revenue; 107.4% YoY growth
        - id: model
          label: Value-based model
          detail: Health-management membership and capitation model
        - id: proof
          label: Tianjin proof point
          detail: Regional consortium and reported chronic-care outcomes
        - id: price
          label: Price evidence gap
          detail: No current WeDoctor equity valuation or cap table in assigned pool
        - id: downside
          label: Downside tests
          detail: Regulatory delay, renewal weakness, dilution, liquidity
        - id: decision
          label: Research-more
          detail: Re-underwrite after primary pricing and audited economics
    claimRefs:
      - CV001
      - CV005
      - CV008
      - CV015
