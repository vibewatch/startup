              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM011
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.2'
        title: Buyer, payer and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is multi-sided. Individuals and families are users and may pay through memberships or
              transactions; employers and insurers can sponsor benefits; hospitals and primary-care institutions are
              operating users; and government health and medical-insurance authorities can be budget owners or
              contracting counterparts. The VCBeat report says the company serves consumers while empowering healthcare
              providers, payers and supply-chain participants, and describes a capitation and value-based payment model
              in which revenue is tied to member health-management effectiveness. That structure makes procurement and
              implementation, rather than app downloads alone, the critical adoption path: a city or payer sponsor must
              authorize the model, institutions must connect workflows, clinicians must use it, and members must renew.
              The 36Kr article reports expansion of the Health Service Community from Tianjin into Fuzhou, Hangzhou,
              Wenzhou, Yinchuan and Hainan, but its company-aligned framing does not independently establish
              repeatability or unit economics.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: Growth drivers, constraints and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Structural drivers include ageing, chronic-disease management, demand for remote access, AI-enabled
              workflows and public policy support. The 2024 ResearchAndMarkets summary explicitly identifies ageing,
              internet penetration, health expenditure, chronic-disease management, insurance and membership products,
              health awareness and government support as growth drivers, while also naming lack of motivation and lack
              of patient confidence as challenges. The State Council Information Office source confirms that national
              healthcare security planning is a policy topic, but it does not prove that a specific platform will win
              budgets. Market Research Future reports a much larger 2025–2035 digital-health forecast than the narrower
              online-healthcare estimate, illustrating scope risk rather than corroborating a single TAM. The market
              case is therefore attractive but execution-sensitive: trust, privacy, reimbursement rules, integration
              cost, city concentration and renewal quality can delay adoption and compress valuation. Public evidence
              does not isolate WeDoctor’s SAM, city-level contribution margins, membership renewal, or standalone cloud
              profitability.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The investable wedge is narrower than the headline TAM
            body: >-
              The most decision-relevant market is digitally delivered, reimbursed or contracted health management and
              infrastructure, not total Chinese healthcare spending. Valuation should therefore be tested against
              contracted city expansion, payer economics and renewal evidence.
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM012
          - type: callout
            title: Published market estimates are not directly comparable
            body: >-
              Forecasts span online healthcare and the broader digital-health ecosystem, with different categories,
              geographies, currencies and periods. They support demand direction but cannot be combined into a single
              precise TAM.
            calloutType: risk
            claimRefs:
              - CM002
              - CM003
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and job-to-be-done
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than teleconsultation. WeDoctor's public descriptions span online
              consultation, appointment reservation, cloud diagnosis, chronic-disease management, pharmacy, insurance
              integration, physical hospitals, and regional health-community operations. That creates at least five
              competitor classes: integrated digital-health platforms, e-pharmacy and telemedicine incumbents,
              professional-health networks, regional public-sector or hospital consortia, and the status quo of
              fragmented offline care. SetterVC lists Ping An Good Doctor, JD Health, AliHealth, and DXY as illustrative
              competitors, while the DXY profile demonstrates that a professional-user network can address a different
              workflow from WeDoctor's patient-and-provider coordination. The practical buying decision is therefore
              whether a customer needs consumer access, medication fulfillment, professional workflow, or a city-level
              operating system. Internal build and incumbent hospital procurement remain substitutes when a buyer
              controls the relevant data, providers, and reimbursement path.
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP008
      - number: '3.2'
        title: Competitor profiles and strategic direction
        blocks:
          - type: paragraph
            body: >-
              WeDoctor's public differentiation is not simply an AI feature. The January 2025 prospectus account
              describes a Digital Health Community using capitation and value-based payment, with health-management
              membership services, cloud pharmacy, and value-added services in the AI-powered medical-services segment.
              The same account says WeDoctor connects approximately 11,500 medical institutions and around 318,000
              physicians, and operates six physical hospitals, but these are reported company or prospectus figures
              rather than independently audited competitor benchmarks. VCBeat describes the later AI-hospital direction
              as a move from an internet hospital to a digital health community and then an AI-driven hospital. DXY, by
              contrast, is profiled as a broad consumer and professional information, education, networking, and
              health-product platform. JD Health supplies a public-market reference point for an e-pharmacy and
              telehealth incumbent, while Ping An and AliHealth bring insurance or large-platform distribution
              advantages. Direct scale comparisons should remain qualified because the sources use different
              populations, periods, and disclosure standards.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.3'
        title: Capability, pricing, and distribution trade-offs
        blocks:
          - type: paragraph
            body: >-
              Buyer trade-offs are clearest at the workflow level. WeDoctor's regional model can integrate medical
              institutions, primary care, insurance, and pharmacy services, but it likely requires policy alignment,
              local implementation, and a long operating cycle. Its cancer-triage launch describes a database with over
              one million tags, an intelligent symptom analysis system, and online multidisciplinary consultation; those
              features support a coordination proposition rather than proving superior clinical outcomes. Competitor
              public pages describe service categories, but no assigned source provides comparable list prices, realized
              prices, discounts, take rates, or contract terms across WeDoctor, Ping An Good Doctor, JD Health,
              AliHealth, and DXY. Pricing is therefore an explicit unknown, not a basis for a rank. A buyer choosing
              WeDoctor may value integrated regional execution; a buyer prioritizing immediate consumer reach or
              pharmacy logistics may prefer a scaled platform incumbent.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP013
              - CP017
      - number: '3.4'
        title: Moat durability, switching costs, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The potential moat is operational and institutional as much as technical. The prospectus account says
              WeDoctor's Tianjin model had operated for more than four years and describes coordination across medical
              institutions, health insurance, and pharmaceuticals; a 2023 VCBeat account reports 266 primary
              institutions in Tianjin and more than 1.68 million health records as of December 2022. These
              relationships, workflows, and local data integration can raise switching costs once embedded. They do not
              eliminate displacement risk: city contracts can be re-procured, large platforms can bundle telehealth and
              pharmacy, and hospital or government teams can build narrower systems internally. The strongest adverse
              signal in the pool is comparative rather than a direct failure report: DXY's large professional network
              shows that distribution and trusted workflow ownership can sit outside WeDoctor's model. The moat is
              durable only if outcomes, reimbursement savings, implementation speed, and renewal quality remain
              demonstrably better than alternatives.
            claimRefs:
              - CP014
              - CP015
              - CP016
              - CP017
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP007
              - CP008
              - CP009
              - CP014
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is a system, not a single feature
            body: >-
              WeDoctor's strongest disclosed distinction is the combination of AI-enabled care workflows with city-level
              health-community operations and value-based payment, a harder-to-copy bundle than a standalone
              consultation interface.
            calloutType: strength
            claimRefs:
              - CP005
              - CP010
              - CP014
          - type: callout
            title: Pricing and renewal evidence remain open
            body: >-
              Assigned sources do not disclose comparable realized pricing, contract economics, or multi-city renewal
              rates; the competitive conclusion should therefore remain directional rather than a precise share or
              margin claim.
            calloutType: risk
            claimRefs:
              - CP013
              - CP017
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture and quality
        blocks:
          - type: paragraph
            body: >-
              WeDoctor's central monetization mechanism is no longer adequately described as online consultations alone.
              Reporting derived from its prospectus describes capitation and value-based payment for regional
              health-management membership, supplemented by cloud pharmacy, value-added care, digital medical services,
              offline medical centers, and corporate memberships. Continuing-operations revenue increased from RMB 962
              million in 2021 to RMB 1.368 billion in 2022 and RMB 1.863 billion in 2023; first-half 2024 revenue was
              RMB 1.818 billion, up 107.4% year on year. Membership services supplied RMB 1.032 billion, or 56.8%, of
              that first-half total. A later article reported RMB 3.08 billion of first-half 2025 revenue and RMB 2.389
              billion from membership services, but those figures remain media-reported rather than independently
              audited here. The mix supports a potentially more contractual revenue thesis, while contract duration,
              renewal, payer concentration, collection timing, and revenue recognition remain open.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI007
              - CI008
          - type: table
            tableRef: TI001
            claimRefs:
