  - id: TP002
    title: Feature and capability matrix
    columns: [Buying criterion, WeDoctor, Ping An Good Doctor or JD Health, DXY, Evidence interpretation]
    rows:
      - [Consumer consultations and appointments, "Reported online consultations, appointment scheduling, follow-up visits, and medication dispensing", "SetterVC describes telemedicine and online consultation; JD Health source provides market data but not a feature-by-feature disclosure", "TMTPost describes online consultations and health education", "Comparable category coverage exists; service quality and utilization are unknown"]
      - [Regional chronic-care and health-community operations, "Capitation/value-based Health Community model and Tianjin operating evidence", "No assigned source establishes an equivalent city-level operating model", "No assigned source establishes an equivalent city-level operating model", "Potential WeDoctor differentiation, but expansion and renewal need evidence"]
      - [Pharmacy and medication workflow, "Cloud pharmacy aligns formularies and supports grassroots medication supply", "Ping An and JD Health are described as e-pharmacy or drug-delivery platforms", "Health-product e-commerce is described, but comparable pharmacy operations are not established", "Distribution overlap is clear; formulary integration and economics are not comparable"]
      - [AI-enabled clinical workflow, "AI triage, symptom analysis, multidisciplinary consultation, and AI hospital claims are described", "Assigned sources do not provide comparable model filings, validation, or deployment detail", "Assigned source describes professional tools but not equivalent clinical AI deployment", "Capability claims require independent clinical validation and outcome data"]
    notes: "Cells state only what the assigned sources support. Missing comparable disclosures are shown as unknown rather than inferred parity or inferiority."
    claimRefs: [CP005, CP006, CP009, CP010, CP011, CP012]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Company or alternative, Public price or contract model, Included capabilities, Discount or realized-price evidence, Competitive implication]
    rows:
      - [WeDoctor, "Not disclosed in assigned sources", "Digital medical services, health-management membership services, cloud pharmacy, value-added services, and regional Health Community operations", "Not disclosed", "Cannot underwrite price advantage or margin superiority"]
      - [Ping An Good Doctor, "Not disclosed in assigned sources", "Telemedicine, online consultation, e-pharmacy, and health management", "Not disclosed", "Potential consumer and insurance-distribution substitute; price comparison unavailable"]
      - [JD Health, "Not disclosed in assigned sources", "Teleconsultation, digital pharmacy, chronic-disease management, and wellness programs", "Not disclosed", "Potential scale and logistics substitute; market capitalization is not a price proxy"]
      - [DXY, "Not disclosed in assigned sources", "Health education, online consultation, health-product e-commerce, professional tools, and continuing education", "Not disclosed", "Professional-network distribution may substitute for selected workflows, but contract economics are unknown"]
    notes: "All price, discount, take-rate, and contract fields are unavailable in the assigned evidence. These nulls are diligence gaps, not zero prices or evidence of free service."
    claimRefs: [CP008, CP009, CP013, CP017]
