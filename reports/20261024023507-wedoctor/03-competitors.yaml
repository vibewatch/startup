        - {label: Ping An Good Doctor, x: 2, y: 3, note: "Telemedicine, online consultation, e-pharmacy, and health management disclosed"}
        - {label: JD Health, x: 2, y: 3, note: "Teleconsultation, digital pharmacy, chronic-disease management, and wellness disclosed"}
        - {label: DXY, x: 1, y: 3, note: "Consumer health plus professional network, education, and tools disclosed"}
        - {label: AliHealth, x: 2, y: 3, note: "Telemedicine, electronic prescriptions, and drug delivery disclosed"}
        - {label: "Internal build", x: 3, y: 2, note: "Potential substitute when a buyer controls data, providers, and reimbursement"}
    claimRefs: [CP005, CP007, CP008, CP009, CP014, CP016]
    approximationNotes: "Scores are analyst-authored ordinal comparisons from the cited public descriptions, not reported market measurements; unavailable dimensions were not treated as zero."
