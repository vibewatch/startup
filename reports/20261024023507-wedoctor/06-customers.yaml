schemaVersion: "report-v2"
artifact: customers
slug: wedoctor
runDate: 2026-10-24
company:
  name: WeDoctor
chapter:
  number: 6
  title: Customers
  summary: WeDoctor's customer model spans governments and medical institutions that procure regional health infrastructure, health-insurance-linked members, and enterprise or individual users. Public evidence supports named deployments and substantial usage, but does not establish retention, contract durability, or customer-level revenue concentration.
sections:
  - id: customer-segments
    title: Buyer, user, and payer segments
    body: >-
      WeDoctor serves a multi-sided customer system rather than a single software buyer. Government and medical-insurance authorities are strategic counterparties in regional Health Community deployments; medical institutions and pharmacies are operating participants; and members are the people receiving coordinated care. The 2025 prospectus coverage describes health-management membership services as a regional system integrating medical institutions and online/offline care, while the 2022 partner program describes regional partners and local governments as the expansion channel. This structure creates strategic value through coordination, but it also means procurement, implementation, and payment depend on public-sector and provider relationships. The sources identify use cases and participating institutions, yet do not disclose contract length, renewal terms, or revenue by customer type. Named logos or participating facilities should therefore be read as deployment evidence, not proof of recurring retention.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption and operating evidence
    body: >-
      The strongest adoption evidence is deployment-specific. A Tai'an government report described an online chronic-disease hospital connected to 23 outpatient pharmacies and serving more than 200,000 chronic-disease patients in the city. A 2025 prospectus summary reported approximately 900,000 members receiving multi-disease and diabetes services in Tianjin as of June 30, 2024, while a later industry article reported more than 1.666 million Tianjin users and described five cities joining the Health Service Community model from 2025. These figures are not directly comparable: they use different dates, geographies, definitions, and issuers. WeDoctor also reported a 107.4% first-half 2024 revenue increase, but revenue is not a customer count or active usage metric. The evidence shows expansion and reach, not a verified cohort-level trajectory.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
  - id: named-proof-and-durability
    title: Named deployments, expansion, and durability gaps
    body: >-
      Named deployments provide better proof than an undifferentiated logo list. Tai'an is tied to a chronic-disease hospital, pharmacies, prescriptions, insurance payments, and delivery; Tianjin is tied to multi-disease management across primary institutions and hospitals; and the 2022 partner program documents a shift from direct operation toward joint regional expansion. The commercial model appears capable of embedding in local workflows, but the available sources are largely company-related, public-sector descriptions, or media summaries. They do not disclose churn, gross retention, net retention, renewal cohorts, customer-level gross margin, or the share of revenue from the largest city or payer. Independent reports also connect WeDoctor's earlier IPO disruption to scrutiny of businesses handling sensitive medical data, reinforcing data-governance and procurement risk. The core diligence question is therefore durability: whether deployments remain funded and clinically used after launch, and whether partner-led expansion preserves service quality and economics.
    claimRefs: [CU009, CU010, CU011, CU012, CU015]
    tableRefs: [TU003]
    figureRefs: [FU001]
