callouts:
  - calloutType: insight
    title: Adoption is real but not yet durable by disclosure
    body: Named deployments and reported member counts demonstrate operating reach, but no assigned source discloses retention, churn, renewal, or customer-level concentration. Treat expansion as a positive adoption signal with an unresolved durability risk.
    claimRefs: [CU005, CU006, CU012]
  - calloutType: risk
    title: Public-sector and partner dependence
    body: The customer model depends on regional authorities, providers, and local partners. Procurement cycles, payment-policy changes, and uneven partner execution could affect deployment timing and service quality.
    claimRefs: [CU002, CU009, CU011, CU015]
