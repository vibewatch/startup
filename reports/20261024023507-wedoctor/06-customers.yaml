    enumerationScope:
      coverage: partial
      basis: "Named public deployments and partner model documented in assigned sources through 2026-10-24; not a full customer census."
    notes: "Rows are a partial evidence set, not an exhaustive customer list; source evidence is shown in each row and the associated atomic claims."
    claimRefs: [CU005, CU006, CU009, CU010, CU011]
