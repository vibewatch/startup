company:
  name: WeDoctor
chapter:
  number: 1
  title: Company Overview
  summary: WeDoctor is a Hangzhou-based digital-health company that has expanded from internet-hospital infrastructure into AI-enabled healthcare services, regional health-management operations, and digital healthcare platforms. Period-specific revenue and network disclosures show meaningful scale, but current valuation, ownership, leadership depth, headcount, and liquidity remain material diligence gaps.
sections:
  - id: identity-and-business-model
    title: Identity and operating model
    body: >-
      WeDoctor was founded in 2010 by Jerry Liao and his team and is headquartered in
      Hangzhou. Recent coverage of the company's listing materials describes two core
      businesses: AI-powered healthcare services and a digital healthcare platform.
      That positioning is broader than a consumer appointment marketplace because it
      includes regional health-management operations, institutional connectivity,
      online services, and owned physical hospitals. Reporting also dates WeDoctor's
      Tianjin Health Service Community cooperation to 2020, providing a multi-year
      operating history before the newer city pilots. The breadth creates several
      potential revenue surfaces, but it also raises the diligence burden around which
      legal entities own the contracts, technology, licenses, and patient-data
      responsibilities in each city.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-capital-and-scale
    title: Leadership, capital, and disclosed scale
    body: >-
      Jerry Liao is the only named operating leader consistently identified across the
      assigned evidence, making leadership depth and succession planning open
      questions rather than established strengths. Capital figures must remain
      separated by metric and vintage: Tracxn reports $894 million of total funding
      through May 2018, while South China Morning Post reported a $5.5 billion private
      valuation after fundraising in 2018. Neither figure establishes current cash
      availability or entry valuation. Operating disclosures are more recent:
      continuing-operations revenue reached RMB 1.818 billion in the first half of
      2024, while adjusted loss was RMB 127.9 million. Revenue is not ARR, and adjusted
      accounting loss is not cash burn. Public sources name several investors, but not
      their current ownership, preferences, board rights, or liquidity needs.
    claimRefs: [CO001, CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO002, TO003]
  - id: milestones-and-diligence-implications
    title: Milestones and diligence implications
    body: >-
      The evidence shows a progression from internet healthcare infrastructure to
      regional health-management operations. WeDoctor established what IPO coverage
      calls China's first internet hospital in 2015 and began its Tianjin Health
      Service Community cooperation in 2020. The latest retained listing coverage
      reports approximately 11,500 connected medical institutions, around 318,000
      physicians, six physical hospitals, and approximately 900,000 Tianjin members
      as of June 2024. A later 36Kr article describes 2026 pilots or platform
      construction in Yinchuan, Wenzhou, and Fuzhou, but this promotional account does
      not provide audited city-level economics. WeDoctor submitted another Hong Kong
      listing application on December 31, 2024 after a 2021 attempt was disrupted amid
      regulatory pressure on companies handling sensitive medical data. The filing is
      therefore evidence of renewed liquidity intent, not a completed financing or
      proof that regulatory and disclosure risks have cleared.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
