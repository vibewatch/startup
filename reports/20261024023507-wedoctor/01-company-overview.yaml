callouts:
  - calloutType: strength
    title: Scaled regional operating model
    body: The Health Community model has a multi-year Tianjin operating history and is presented as a regional care and payment system rather than only a software product.
    claimRefs: [CO003, CO010, CO011]
  - calloutType: risk
    title: Disclosure and regulatory overhang
    body: A renewed IPO application does not resolve the prior regulatory disruption, incomplete ownership disclosure, or the gap between reported operating metrics and independently verifiable current economics.
    claimRefs: [CO008, CO009, CO014, CO015]
  - calloutType: recommendation
    title: Verify before underwriting
    body: Underwriting should prioritize the current cap table, Tianjin concentration and renewal economics, active network utilization, employee depth, and reconciliation of member and revenue figures across periods.
    claimRefs: [CO007, CO008, CO013, CO015]
