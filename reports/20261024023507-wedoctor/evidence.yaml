evidenceGaps:
  - type: stale
    severity: material
    topic: members
    missingEvidence: A current active-member count with a stable definition, geography, payer, and reporting period.
    whyItMatters: >-
      The June 2024 Tianjin figure cannot establish current adoption, retention, geographic concentration, or revenue
      quality.
    diligencePath: >-
      Request audited member cohorts, active-member definitions, city-level counts, retention, and payer contract
      schedules.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current cap table, board composition, executive roster, employee count, preference rights, and debt or credit
      facilities.
    whyItMatters: >-
      A founder-led private company with a renewed IPO path may have material control, dilution, and key-person risks
      that public summaries do not reveal.
    diligencePath: >-
      Obtain the latest prospectus, capitalization table, shareholder agreement, board minutes, and organization chart
      under NDA.
    relatedQuestionRefs:
      - QO002
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: stale
    severity: material
    topic: valuation
    missingEvidence: A current financing or independent valuation dated near the 2026 report run.
    whyItMatters: The retained $5.5 billion valuation is a 2018 historical mark and cannot support current entry economics.
    diligencePath: Request the latest preferred-share transaction, 409A or equivalent valuation, and IPO pricing range if available.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: adverse
    missingEvidence: >-
      Independent reporting or regulatory records on current litigation, sanctions, outages, privacy incidents, and
      leadership departures.
    whyItMatters: The chapter's adverse evidence is historical regulatory context; current adverse exposure remains under-tested.
    diligencePath: Search current court, regulator, exchange, and enforcement records and reconcile them with management disclosure.
    relatedQuestionRefs:
      - QO007
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: A source-complete chronology of partnerships, product launches, financing events, and leadership changes.
    whyItMatters: The timeline is adequate for orientation but not a complete corporate-history record.
    diligencePath: Obtain the latest prospectus, company announcements, and dated regulatory filings and build an event ledger.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: sizing
    missingEvidence: >-
      A public, independently auditable source that maps WeDoctor's eligible city, payer and membership revenue pool
      into SAM and SOM.
    whyItMatters: >-
      Headline digital-health forecasts span incompatible scopes and cannot establish the portion that WeDoctor can
      monetize.
    diligencePath: >-
      Request management's city-by-city eligible-member, contract-value and serviceable-institution model, reconcile it
      to audited revenue and disclose exclusions.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: Membership renewal, gross margin, contract duration, payer mix and city-level contribution data.
    whyItMatters: Adoption can look large while economic retention and budget ownership remain unproven.
    diligencePath: >-
      Obtain cohort retention, renewal, utilization, claims-cost and contribution-margin schedules by city and payer for
      at least three annual cohorts.
    relatedQuestionRefs:
      - QM004
      - QM007
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: market-size
    missingEvidence: A harmonized methodology explaining the different online-healthcare and digital-health forecast denominators.
    whyItMatters: The reported forecasts differ by order of magnitude and could mislead valuation if presented as corroboration.
    diligencePath: >-
      Obtain each publisher's category definitions, currency basis, geography, base year and inclusion rules, then
      normalize only comparable series.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable list and realized pricing, discounts, contract duration, take rates, and contribution economics for
      WeDoctor and named alternatives.
    whyItMatters: >-
      Without a like-for-like price and unit-economics basis, capability differences cannot be translated into buyer
      ROI, margin durability, or competitive share.
    diligencePath: Obtain current customer contracts, pricing schedules, renewal cohorts, and competitor procurement benchmarks.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: renewal-quality
    missingEvidence: Independent multi-city evidence on Health Community renewals, outcomes, and implementation cost outside Tianjin.
    whyItMatters: >-
      The moat depends on repeatable regional deployment, not only a single-city operating history or company-reported
      expansion.
    diligencePath: >-
      Interview government, hospital, payer, and member references in newer deployments and reconcile renewal and
      outcome data.
    relatedQuestionRefs:
      - QP006
      - QP007
  - type: missing-source
    severity: material
    topic: clinical-validation
    missingEvidence: >-
      Independent validation of WeDoctor AI triage, assistant, pharmacy, and health-manager performance against
      incumbent workflows.
    whyItMatters: Feature breadth and model claims do not establish clinical safety, superior outcomes, or durable switching costs.
    diligencePath: >-
      Request validation protocols, error rates, prospective studies, audit trails, and regulatory or hospital
      governance records.
    relatedQuestionRefs:
      - QP003
      - QP004
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash, restricted cash, monthly burn, runway, debt, covenants, guarantees, and committed financing.
    whyItMatters: >-
      A prospective IPO does not establish liquidity, downside time, or the amount and timing of financing still
      required.
    diligencePath: >-
      Request audited statements, bank confirmations, the debt schedule, monthly management cash flow, and
      board-approved runway scenarios under NDA.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Segment gross margin, fully loaded service cost, CAC, payback, renewal cohorts, utilization, and contribution
      margin.
    whyItMatters: >-
      Reported revenue growth and accounting loss compression do not establish scalable unit economics or cash
      generation.
    diligencePath: >-
      Reconcile payer and member cohorts to recognized revenue, collections, direct labor, medical and pharmacy costs,
      sales spend, churn, and contribution profit.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: concentration-and-recognition
    missingEvidence: City, payer, member, and product concentration plus revenue-recognition and receivables policies.
    whyItMatters: A membership-heavy mix may still be concentrated, slow-collecting, or exposed to contract and utilization risk.
    diligencePath: >-
      Obtain audited segment notes, top-payer schedules, city cohorts, contract samples, receivables aging, and
      gross-to-net reconciliations.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: technical-assurance
    missingEvidence: >-
      Independent model cards, prospective clinical validation, subgroup performance, safety monitoring, and production
      error metrics for the medical AI agents.
    whyItMatters: >-
      Benchmark rank and reported deployments do not establish safe performance in real clinical workflows or explain
      accountability when an agent is wrong.
    diligencePath: >-
      Request model cards, validation protocols, incident logs, human-review policies, and current production quality
      dashboards by disease and city.
    relatedQuestionRefs:
      - QE006
      - QE007
      - QE009
    relatedTableRefs:
      - TE001
      - TE003
  - type: access-blocked
    severity: material
    topic: privacy-security
    missingEvidence: >-
      A usable primary source for the applicable personal-information and health-data controls, plus WeDoctor's own
      security, privacy, and compliance documentation.
    whyItMatters: >-
      The product processes sensitive health information and depends on data sharing across institutions and
      local-government programs.
    diligencePath: >-
      Obtain current privacy notices, data-processing agreements, access-control design, de-identification tests,
      penetration-test summaries, and breach-response procedures.
