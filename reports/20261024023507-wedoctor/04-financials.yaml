    title: Pricing and monetization evidence
    columns: [Model, Contract or unit, Public realized price, Discount or unknown, Underwriting ask]
    rows:
      - [Health-management membership, "Per-capita and value-based payment", "Not disclosed", "Contract term, risk corridor, renewal, and collection timing unknown", "Sample payer contracts and reconcile covered members to invoices and cash"]
      - [Cloud pharmacy, "Medication supply through regional platform", "Not disclosed", "Gross-to-net presentation, procurement spread, rebates, and fulfillment cost unknown", "Provide pharmacy P&L, take rate, inventory ownership, and working-capital cycle"]
      - [Digital and offline medical services, "Consultation or episode-based service", "Not disclosed", "Paid conversion, clinician share, channel fee, and refund rate unknown", "Provide list and realized prices by channel with volume and contribution margin"]
      - [Corporate memberships, "Employer package", "Not disclosed", "Seat or member basis, discounting, utilization, and renewal unknown", "Provide contract cohort, annual contract value, renewal, and concentration"]
    notes: "The assigned evidence describes monetization mechanisms but contains no current public price list or realized-pricing schedule; 'not disclosed' is not a zero value."
    claimRefs: [CI001, CI002]
  - id: TI003
    title: Unit economics and capital inputs
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Adjusted net loss, "About RMB 128m in H1 2024; roughly half the prior-year level", High, "Directional operating-leverage signal, but not cash burn", "Reconcile adjusted to statutory loss and operating cash flow"]
      - [Sales and marketing, "$74m in 2020; up 56%", Medium, "Historical acquisition-spend proxy without cohort output", "Provide current spend, acquired members, channel mix, CAC, and payback"]
      - [Consultation activity, "18m in 2020; up 38%", Medium, "Scale proxy without paid conversion or revenue denominator", "Provide current paid consultations, revenue per consultation, and clinician cost"]
      - [Diabetic member medical expense, "RMB 1,643 to RMB 1,255 monthly; down 23.6%", Medium, "Potential value-based outcome, not WeDoctor margin", "Validate cohort, denominator, period, claims methodology, and savings-sharing terms"]
      - [Gross margin, "Not disclosed", Low, "Separates scalable platform revenue from care-delivery intensity", "Provide segment gross profit and cost-allocation policy"]
      - ["Cash, burn, and runway", "Not disclosed", Low, "Determines financing dependency and downside time", "Provide bank confirmations, monthly cash flow, restricted cash, and board runway case"]
      - [Debt and working capital, "Not disclosed; IPO use included working capital", Low, "Tests receivables, covenants, and funding needs", "Provide debt schedule, guarantees, receivables aging, payables, and inventory"]
    notes: "Reported values are historical public proxies; unavailable fields are evidence gaps, and accounting loss must not be read as cash burn."
    claimRefs: [CI006, CI009, CI010, CI011, CI012, CI013, CI015]
