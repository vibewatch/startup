artifact: financials
slug: wedoctor
runDate: 2026-10-24
company:
  name: WeDoctor
chapter:
  number: 4
  title: Financials
  summary: WeDoctor's reported revenue mix has shifted toward health-management membership under capitation and value-based payment, with continuing-operations revenue reaching RMB 1.818 billion in the first half of 2024 and membership services contributing 56.8%. Reported loss compression is encouraging, but the assigned public evidence does not disclose gross margin, current cash, burn, runway, debt, realized pricing, or renewal economics.
sections:
  - id: revenue-architecture
    title: Revenue architecture and quality
    body: >-
      WeDoctor's central monetization mechanism is no longer adequately described as
      online consultations alone. Reporting derived from its prospectus describes
      capitation and value-based payment for regional health-management membership,
      supplemented by cloud pharmacy, value-added care, digital medical services,
      offline medical centers, and corporate memberships. Continuing-operations revenue
      increased from RMB 962 million in 2021 to RMB 1.368 billion in 2022 and RMB 1.863
      billion in 2023; first-half 2024 revenue was RMB 1.818 billion, up 107.4% year on
      year. Membership services supplied RMB 1.032 billion, or 56.8%, of that first-half
      total. A later article reported RMB 3.08 billion of first-half 2025 revenue and
      RMB 2.389 billion from membership services, but those figures remain
      media-reported rather than independently audited here. The mix supports a
      potentially more contractual revenue thesis, while contract duration, renewal,
      payer concentration, collection timing, and revenue recognition remain open.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI007, CI008]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: operating-economics
    title: Cost structure and operating leverage
    body: >-
      Public disclosures provide operating proxies rather than complete unit economics.
      Health Advances reported that 2020 sales and marketing expense rose 56% to
      $74 million, while consultation volume reached 18 million, up 38%; neither metric
      supplies CAC, payback, paid conversion, or contribution margin. Delivery is also
      operationally intensive: older evidence placed the network above 2,700 hospitals,
      and a Tai'an chronic-care deployment linked 23 outpatient pharmacies while serving
      more than 200,000 patients. Longport reported a decline in average monthly medical
      expense for diabetic patients in the Tianjin model from RMB 1,643 to RMB 1,255,
      a 23.6% reduction. That outcome is relevant to value-based economics, but it is not
      WeDoctor gross profit. Against this backdrop, the reported first-half 2024 adjusted
      net loss of about RMB 128 million, roughly half the prior-year level, indicates
      movement toward operating leverage without proving positive cash generation.
    claimRefs: [CI006, CI009, CI010, CI011, CI012, CI013]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and underwriting verdict
    body: >-
      The retained evidence establishes financing intent, not capital adequacy. Late-2024
      reporting said WeDoctor expected a Hong Kong IPO to raise US$400 million to
      US$500 million, while the filed application did not disclose a committed
      fundraising size or timetable. Reported uses included expanding partnerships,
      advancing AI, improving service quality and management efficiency, and funding
      working capital. Those plans imply continuing investment needs, but proceeds from
      an uncompleted offering are not cash available. Execution risk is material because
      WeDoctor's 2021 listing attempt was disrupted during the regulatory crackdown that
      particularly affected businesses handling sensitive medical data. The financial
      verdict is therefore conditional: revenue growth, mix shift, and loss compression
      are constructive, but underwriting requires audited segment statements, payer and
      member cohorts, gross-margin bridges, receivables aging, cash and debt schedules,
      and a reconciled runway. Until those inputs are supplied, neither liquidity nor
      durable contribution economics can be established.
    claimRefs: [CI004, CI006, CI014, CI015, CI016]
callouts:
  - calloutType: risk
    title: Financing is planned, not secured
    body: >-
      The reported US$400 million to US$500 million IPO target is a prospective funding
      event, not evidence of cash on hand or runway; the prior failed listing attempt
      makes timing and execution explicit underwriting risks.
    claimRefs: [CI014, CI016]
