      - [Cloud Pharmacy, "Primary and higher-level medical institutions; members", "Operating component of Health Community model", "Formulary alignment across care levels and grassroots supply assurance", "Need fill-rate, dispensing, subsidy, and unit-economics data"]
      - [Digital healthcare platform, "Patients; physicians; corporate members", "Operating platform with online and offline services", "Appointments, consultations, follow-ups, medication dispensing, and physical hospitals", "Need uptime, utilization, integration, and service-quality metrics"]
      - [Medical large model and agents, "Doctors; pharmacists; health managers; patients", "Deployed in reported AI hospitals and health communities; maturity independently unverified", "Domain data, clinical pathways, and agent workflow integration", "Need model cards, prospective validation, safety monitoring, and audit logs"]
    notes: "Public descriptions mix company or prospectus claims with third-party case material; maturity labels indicate reported deployment, not independently verified production quality."
    claimRefs: [CE001, CE002, CE005, CE006, CE009]
  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow, Company solution, Measurable benefit, Limitation]
    rows:
      - [Find appropriate care, "Patients navigate hospitals and primary care", "Online appointment, consultation, follow-up, and referral services", "Improves access and connects online with offline care", "No assigned source provides current conversion or wait-time data"]
      - [Manage chronic disease, "Periodic visits and fragmented follow-up", "AI health manager plus human health manager and local care network", "Reported full-lifecycle management and online warning with offline intervention", "Reported outcomes are not independently audited in the pool"]
      - [Obtain medicines, "Patients use fragmented hospital and pharmacy channels", "Cloud pharmacy aligns formularies across institution levels", "Reported grassroots medication-supply assurance", "Need availability, delivery, substitution, and economics by city"]
      - [Coordinate regional care, "Hospitals, primary institutions, doctors, and payers operate across silos", "Health Community platform and AI agents coordinate prevention through management", "Reported 2H2C operating loop and city-level deployment", "Replication depends on local policy, data, staffing, and counterparties"]
    notes: "Benefits are described qualitatively unless the source reports a specific metric; null or unverified metrics should be requested before underwriting."
    claimRefs: [CE002, CE003, CE006, CE010]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - [Regional digital-health platform, "Connects institutions, physicians, patients, and payers", "Local government, hospitals, insurers, identity and data interfaces", "Implementation and interoperability vary by city"]
      - [Clinical and operational data layer, "Supports model training, health management, and workflow feedback", "De-identification, data rights, data quality, and clinical provenance", "Privacy, leakage, bias, and undocumented retention controls"]
      - [AI agent layer, "Assists diagnosis, medication, health management, and intelligent control", "Validated models, human review, monitoring, and escalation", "Clinical error, automation bias, and unclear accountability"]
      - [Cloud pharmacy and service layer, "Supports formularies, medication supply, and value-added care", "Pharmacy and hospital networks; regional procurement and payment", "Supply disruption, substitution quality, and margin pressure"]
    notes: "This is an evidence-based operating abstraction, not a disclosed software bill of materials or API architecture; public materials do not establish deployment topology or service-level objectives."
    claimRefs: [CE004, CE005, CE006, CE007, CE014]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: WeDoctor's reported product stack links regional institutions and payment workflows to clinical data and AI-assisted services.
    data:
      items:
        - label: Local health authorities
          detail: Policy, payer, and implementation coordination
        - label: Hospitals and primary-care institutions
          detail: Clinical capacity and referral network
        - label: Digital health cloud
          detail: Online and offline workflow coordination
        - label: Clinical and service data
          detail: Reported de-identified records, conversations, and diagnosis data
        - label: AI doctor and AI pharmacist
          detail: Reported clinical and medication support
        - label: AI health manager and intelligent control
          detail: Reported chronic-care management and compliance support
    approximationNotes: "Layer order represents operating dependency, not a disclosed technical deployment topology or a performance ranking."
    claimRefs: [CE005, CE006, CE007]
callouts:
  - calloutType: strength
    title: Differentiation is operational as well as technical
    body: The strongest evidence points to a city-level care and payment operating model that embeds AI in a broader regional workflow; a generic model benchmark alone would not explain the product's defensibility.
    claimRefs: [CE002, CE009, CE010]
  - calloutType: risk
    title: Public technical assurance is incomplete
    body: Public sources identify model, data, and algorithm-registration claims, but the assigned evidence does not provide independent clinical validation, security controls, reliability history, or a public engineering surface.
    claimRefs: [CE012, CE013, CE014, CE015]
