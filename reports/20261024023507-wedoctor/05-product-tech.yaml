company:
  name: WeDoctor
chapter:
  number: 5
  title: Product & Technology
  summary: WeDoctor combines a regional health-service operating model with online care, cloud pharmacy, and medical-AI agents. Public evidence supports a maturing, city-level operating architecture, but independent evidence for reliability, security controls, and production model performance remains limited.
sections:
  - id: product-and-user-workflow
    title: Product and user workflow
    body: WeDoctor's product is best understood as a regional health-service operating system rather than a standalone telemedicine application. The public description combines health-management membership services, cloud pharmacy, value-added services, digital consultations, follow-up visits, medication dispensing, and offline medical centers. The Health Community model links residents and patients to hospitals, primary-care institutions, doctors, insurers, and local health administrators. In the documented Tianjin model, service starts with prevention or risk assessment, moves through diagnosis and treatment, and continues into chronic-care management and health follow-up. The product therefore depends on coordinated local supply and payment mechanisms, not only on an app or model endpoint.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-ai
    title: Architecture and AI operating model
    body: The evidence describes a layered architecture with a regional digital-health cloud or platform, integrated institutional and pharmacy workflows, and AI agents embedded in clinical and administrative work. Public descriptions name AI doctor, AI pharmacist, AI health manager, and AI intelligent-control agents, while another account adds WeDoctor Mini and an AI General Hospital as the coordinating layer. The company-linked reporting also describes de-identified clinical records and medical conversations as training inputs, but the public materials do not disclose model cards, evaluation protocols beyond a cited benchmark, latency, uptime, or integration APIs. The architecture is therefore specific enough to identify operating dependencies, but not sufficiently documented to underwrite technical scalability or safety independently.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-deployment-and-differentiation
    title: Maturity, deployment, and differentiation
    body: "WeDoctor has evidence of deployment beyond a pilot concept: an academic case describes the transition from appointment registration to Internet hospitals and digital-health communities, a prospectus summary reports a long-running Tianjin Health Community, and 2026 coverage describes expansion into additional city programs. The strongest product differentiation is the combination of local operating integration, health-management payment design, and clinical data feedback rather than a generic chatbot. The medical large model is reported as first on the CMB-Exam benchmark with an average score of 91.71, and three WeDoctor models are reported as having passed a national algorithm-registration batch. Those are meaningful maturity signals, but they remain partly company-linked or media-reported and do not establish general clinical accuracy."
    claimRefs: [CE009, CE010, CE011, CE012]
  - id: trust-safety-and-gaps
    title: Trust, safety, and implementation risks
    body: Health data, algorithm governance, and local implementation are central product risks. The public evidence indicates that WeDoctor operates in a regulated environment and has reported algorithm registrations, but the assigned pool does not provide a usable primary text for the cited Personal Information Protection Law, nor a public security or status page. The GitHub organization page states that it has no public repositories and no public members, which limits external inspection of developer activity rather than proving that no private engineering capability exists. City expansion also creates dependency on government, hospital, insurance, data-governance, and pharmacy counterparties. Diligence should therefore test access controls, de-identification, incident response, validation by disease and subgroup, rollback procedures, service-level performance, and the economics of each city deployment.
    claimRefs: [CE013, CE014, CE015]
    callouts: []
tables:
