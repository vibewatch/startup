    title: Residual-risk heatmap
    type: matrix
    summary: Impact is highest where regulated data, clinical AI, public-payer economics, and financing depend on controls or disclosures not present in the assigned public evidence.
    data:
      columns: [Likelihood, Impact, "Mitigation evidence"]
      rows:
        - label: "Sensitive-data compliance"
          values: [Medium, Critical, "Framework clear; company controls unverified"]
        - label: "Clinical-AI safety"
          values: [Medium, Critical, "Filings and benchmark reported; validation gap"]
        - label: "City and provider execution"
          values: [Medium, High, "Tianjin evidence; cross-city cohorts missing"]
        - label: "Payer and membership concentration"
          values: [Medium, High, "Reported scale; contracts and renewal gaps"]
        - label: "Provider-network reliability"
          values: [Medium, High, "Large network reported; uptime and quality gaps"]
        - label: "Financing and IPO timing"
          values: [Medium, High, "Loss improved; cash and runway undisclosed"]
    approximationNotes: "Ordinal labels are source-anchored analytical judgments; they are not probabilities, loss estimates, or independently verified control scores."
    claimRefs: [CR001, CR003, CR005, CR007, CR009, CR013, CR014, CR016]
callouts:
  - calloutType: risk
    title: Highest-conviction exposure
    body: Sensitive health data, clinical AI, and multi-party care delivery create correlated compliance and operating exposure; reported scale increases the need for direct control evidence.
    claimRefs: [CR001, CR002, CR010, CR014, CR015]
  - calloutType: assumption
    title: Evidence boundary
    body: The assigned sources do not establish whether a breach, outage, enforcement action, failed deployment, or material litigation has occurred; no absence claim is made.
    claimRefs: [CR016]
