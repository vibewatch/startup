company:
  name: WeDoctor
chapter:
  number: 7
  title: Risks
  summary: WeDoctor's highest-evidence risks are cumulative health-data and clinical-AI compliance, concentration in the Health Community membership model, and dependence on public-sector and provider execution. Public sources describe substantial scale and improving losses, but do not establish current security, clinical-validation, city-renewal, liquidity, or incident evidence.
sections:
  - id: regulatory-and-legal
    title: Regulatory and legal exposure
    body: |
      WeDoctor operates at the intersection of medical services, software regulation, artificial intelligence, insurance reimbursement, and sensitive health data. ICLG identifies separate oversight roles for the NHC, NMPA, NHSA, CAC, and other agencies, and says health information is sensitive personal information under the PIPL. It also describes lifecycle obligations for AI medical devices, cross-border data formalities, and the need for online care to remain affiliated with licensed physical hospitals. These are sector rules, not evidence that WeDoctor has breached them; they establish a broad compliance surface whose controls must be tested. The IRMA case describes regulatory legitimacy and local-government collaboration as important to WeDoctor's historical growth, so approvals and public relationships are enabling dependencies as well as safeguards. The diligence priority is a product-by-product inventory of licenses, algorithm filings, intended uses, data flows, validation, and material regulatory correspondence.
    claimRefs: [CR001, CR002, CR003, CR004, CR012, CR015]
    tableRefs: [TR001]
  - id: operating-quality-and-security
    title: Operating, quality, and security exposure
    body: |
      The operating surface is unusually distributed. Prospectus-based reporting says WeDoctor connected about 11,500 medical institutions and 318,000 physicians, while older HBS analysis describes technology shared among hospitals, clinics, governments, and businesses. That reach creates leverage, but it also creates more handoffs where identity, access, record reconciliation, service quality, and incident response can fail. VCBeat reports a strong medical benchmark score and very large training or operating datasets, yet a benchmark of knowledge and consultation capability is not prospective proof of patient safety, fairness, drift control, or real-world error rates. No successful assigned source provides current uptime, breach history, penetration testing, adverse-event data, or human-override rates. The investment case therefore requires direct evidence of controls rather than treating data volume, algorithm filings, or benchmark leadership as substitutes for clinical and security assurance.
    claimRefs: [CR010, CR011, CR014, CR016]
    tableRefs: [TR002]
  - id: model-financing-and-dependencies
    title: Model, financing, and dependency exposure
    body: |
      Commercial concentration is visible in the reported mix. VCBeat, citing prospectus data, says health-management membership services supplied RMB 1.032 billion, or 56.8% of continuing-operations revenue, in the first half of 2024. A later 36Kr report says first-half 2025 total revenue reached RMB 3.08 billion and membership-service revenue reached RMB 2.389 billion, while describing Tianjin as the performance "ballast stone." These reports indicate momentum but also make city execution, capitation economics, payer oversight, and renewal quality central risks. Financially, reported adjusted accounting loss narrowed to RMB 128 million in the first half of 2024; that is not cash burn or proof of liquidity. The IPO filing's stated working-capital use and an earlier listing disruption support a financing-timing risk, but not a claim of current insolvency. Expansion must be tested city by city rather than inferred from Tianjin.
    claimRefs: [CR005, CR006, CR007, CR008, CR009, CR013]
    tableRefs: [TR003]
  - id: mitigations-and-kill-criteria
    title: Mitigations, monitoring, and thesis-break criteria
    body: |
      Mitigation maturity cannot be rated as strong from the assigned public evidence. The legal framework is identifiable, historical government collaboration is documented, and reported losses improved, but the company-specific control evidence needed to reduce residual risk is absent. Before investment, monitoring should cover license and filing status, material regulatory inquiries, model changes, adverse clinical events, security incidents, uptime, claim denials, city-level member renewal, provider participation, reimbursement terms, adjusted loss, cash, and runway. Thesis-break events should include suspension of a material medical license; a material privacy, security, or patient-safety incident; inability to validate high-risk AI workflows; loss of a material public payer or provider network; repeated failure of newer cities to meet contracted utilization or renewal thresholds; or financing terms that leave disclosed working-capital needs unresolved. These are diligence triggers, not predictions that an event has occurred.
    claimRefs: [CR001, CR003, CR007, CR008, CR012, CR014, CR015, CR016]
    figureRefs: [FR001]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Risk, Jurisdiction, Status, Likelihood, Severity, Mitigation evidence, Residual exposure, Diligence path]
    rows:
      - ["Sensitive health-data processing and cross-border transfer", China, "PIPL/DSL/CSL and transfer formalities apply; company implementation not evidenced", Medium, Critical, "Sector framework is clear; WeDoctor controls not provided", High, "Obtain the data map, controller/processor roles, consent records, PIAs, transfer mechanism, and audit exceptions."]
      - ["AI medical-device and algorithm lifecycle compliance", China, "NMPA and CAC requirements depend on intended use and service design", Medium, Critical, "Reported algorithm filings do not establish full product approval or monitoring", High, "Reconcile every AI feature to intended use, classification, registration, validation, change control, and post-market monitoring."]
      - ["Internet-hospital and online-care licensing", China, "Online care must remain tied to licensed medical institutions and permitted workflows", Medium, High, "Historical regulatory legitimacy is documented; current license inventory is unavailable", Medium-high, "Review licenses, responsible institutions, practitioner credentials, and initial-versus-follow-up consultation controls by city."]
      - ["Public-payer supervision and platform liability", China, "Capitation, reimbursement, claims supervision, and service quality create overlapping accountability", Medium, High, "Public collaboration is documented; contract and audit evidence is unavailable", Medium-high, "Inspect payer contracts, audit findings, claims controls, quality obligations, and allocation of clinical liability."]
    notes: "Partial public-source register as of 2026-10-24; likelihood, severity, mitigation maturity, and residual exposure are analytical ratings, not disclosed probabilities."
    enumerationScope:
      coverage: partial
      basis: "Material China regulatory exposures identifiable from the assigned legal, case-study, and independent-news evidence."
    claimRefs: [CR001, CR002, CR003, CR004, CR009, CR012, CR015]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Unsafe or inconsistent AI-assisted clinical output", Medium, Critical, Partial, High, "No prospective safety, real-world error, override, or adverse-event evidence in the assigned pool."]
      - ["Health-data breach, excessive access, or improper sharing", Medium, Critical, Unknown, High, "No current incident register, penetration test, access review, or breach-response evidence in the assigned pool."]
      - ["Service outage or record fragmentation across institutions", Medium, High, Unknown, High, "No uptime, recovery-time, data-reconciliation, or downtime-impact metrics in the assigned pool."]
      - ["Provider-quality variation during city expansion", Medium, High, Partial, Medium-high, "No comparable complaint, clinical-quality, provider-renewal, or city-cohort dataset outside Tianjin."]
    notes: "Scale and benchmark evidence come from independent publishers relaying company or prospectus information; missing incident evidence is a gap, not proof that incidents did not occur."
    claimRefs: [CR003, CR004, CR010, CR011, CR012, CR014, CR015, CR016]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["City-level authorization and payment", "Municipal health and medical-insurance authorities", "Enable Health Community deployment and capitation economics", "High for each city launch", "Policy, budget, audit, or reimbursement change delays rollout or weakens economics", High, "City-specific contracts, audit rights, payment reconciliation, and staged performance gates", High]
      - ["Provider network", "Hospitals, clinics, physicians, and pharmacies", "Deliver care, referrals, prescriptions, and records", "Broad network with local execution reliance", "Participation, quality, integration, or credentialing falls below contract", High, "Institution-level service, quality, access, complaint, and renewal monitoring", Medium-high]
      - ["Membership-services model", "Public payers, members, and health managers", "Supplied a majority of reported first-half 2024 continuing-operations revenue", "Material revenue-mix concentration", "Renewal, utilization, outcomes, or capitation reconciliation underperforms", High, "Disclose city cohorts, renewal, unit economics, claims outcomes, and concentration limits", High]
      - ["Capital-market access", "Hong Kong listing process, sponsor, and investors", "Fund expansion, technology, service quality, and working capital", "Material but not quantified by current liquidity evidence", "Listing delay or adverse terms leave working-capital needs unresolved", High, "Maintain a board-approved liquidity plan, financing contingencies, and minimum-runway covenant", High]
    notes: "Concentration and residual-exposure ratings are analytical; reported revenue is not ARR, adjusted accounting loss is not cash burn, and proposed IPO proceeds are not cash available."
    claimRefs: [CR005, CR006, CR007, CR008, CR009, CR010, CR011, CR012, CR013]
