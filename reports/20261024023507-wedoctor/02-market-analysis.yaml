    claimRefs: [CM002, CM003, CM011, CM012, CM014]
  - id: TM003
    title: Segment, buyer and adoption map
    columns: [Segment, Buyer, User, Payer or budget owner, Workflow, Adoption trigger]
    rows:
      - [Health-management membership, "Individuals, employers, insurers", Members and care teams, "Member, employer or insurer", "Enrollment, monitoring, follow-up, escalation", "Chronic-care need and measurable outcomes"]
      - [Internet hospital, "Hospitals and health authorities", "Patients and clinicians", "Patient, hospital or local program", "Consultation, referral, follow-up and prescription", "Access bottleneck and remote-care policy"]
      - [Cloud pharmacy, "Hospitals, primary-care institutions and governments", "Pharmacists and clinicians", "Local health system or payer", "Formulary alignment, prescription routing, fulfillment", "Drug availability and medical-insurance integration"]
      - [Digital health community, "Local government and medical-insurance authorities", "Hospitals, primary care, members and administrators", "Government or payer contract", "Regional coordination, capitation/value-based management", "Policy reform mandate plus implementation capacity"]
    notes: "Roles are analytical; a single participant can occupy more than one role. Public sources do not disclose contract prices, renewal rates or city-level contribution margins."
    claimRefs: [CM005, CM006, CM007, CM008]
