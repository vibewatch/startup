company:
  name: WeDoctor
chapter:
  number: 8
  title: Valuation
  summary: WeDoctor has evidence of rapid growth in AI-powered healthcare services and a differentiated capitation/value-based model, but the assigned evidence does not establish a current equity valuation, capitalization, or investor entry price. The appropriate stance is research-more until price, preference, dilution, and audited economics are disclosed.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      The investment case is built on a business model that links health-management
      membership revenue to regional care delivery rather than relying only on
      transaction volume. A prospectus-based account reports continuing-operations
      revenue of RMB 1.818 billion in the first half of 2024, up 107.4% year on
      year, and says health-management membership services contributed RMB 1.032
      billion, or 56.8% of continuing-operations revenue. The same account describes
      a network of approximately 11,500 medical institutions and 318,000 physicians,
      while the Tianjin model is reported to cover 266 community health centers and
      more than 2,000 stations and clinics. These are meaningful scale and
      distribution signals, but they are not a substitute for audited segment
      margins, cohort retention, cash conversion, or a verified equity price.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001, TV002]
  - id: price-discipline
    title: Price discipline and financing context
    body: >-
      Public financing evidence is incomplete and should constrain rather than
      inflate the recommendation. TMTPost reported that WeDoctor was considering
      a Hong Kong listing intended to raise $400 million to $500 million and that
      earlier listing plans had been derailed by a regulatory crackdown affecting
      firms handling sensitive medical data. That is financing context, not a
      completed round, an equity valuation, or cash available to existing holders.
      The assigned sources also include a live Alibaba Health market-data page with
      reported EV/revenue of 1.17 as of July 31, 2026; this is a public comparable,
      not a WeDoctor mark. A defensible entry decision therefore requires the prospectus,
      cap table, preference stack, primary/secondary price, dilution terms, and
      use-of-proceeds disclosures.
    claimRefs: [CV005, CV006, CV007]
    tableRefs: [TV003]
  - id: scenarios
    title: Bull, base, and bear scenarios
    body: >-
      Scenario framing should be driven by observable milestones rather than a
      false point estimate. The bull case requires repeatable city deployments,
      continued membership growth, evidence that value-based payment converts into
      durable gross profit, and a clean listing or financing process. The base case
      assumes the Tianjin proof point remains real but replication is slower and
      public disclosure remains incomplete; in that case, the company may deserve
      continued diligence rather than an immediate buy. The bear case is triggered
      by regulatory delay, weak renewal or concentration outside Tianjin, inability
      to convert reported healthcare outcomes into cash earnings, or a down-round
      caused by liquidity needs. Market reports describe strong digital-health
      growth but also identify patient confidence and trust as constraints, so
      market expansion alone cannot close the valuation gap.
    claimRefs: [CV008, CV009, CV010, CV011]
    figureRefs: [FV001]
  - id: decision-and-diligence
    title: Decision, exit readiness, and diligence asks
    body: >-
      The current decision is research-more, with high risk and medium confidence,
      because the operating thesis is better evidenced than the price thesis. The
      evidence supports a potentially differentiated platform: WeDoctor's medical
      large model ranked first on the cited CMB evaluation, its AI applications
      are embedded in health-community workflows, and the company has reported
      improvements in selected Tianjin chronic-disease indicators. Yet the same
      evidence is predominantly company-linked or trade coverage, while the
      independent pool does not disclose a current WeDoctor valuation, audited
      profitability, net retention, or preference overhang. Before investment,
      diligence should obtain the latest filing and cap table, reconcile continuing
      operations with cash flow, test city-level renewal and payer economics, and
      verify governance, data-security, and AI-model controls. Exit readiness is
      therefore conditional on a completed listing or a transaction with transparent
      terms, not merely on reported IPO intent.
    claimRefs: [CV012, CV013, CV014, CV015, CV016]
    callouts:
      - calloutType: recommendation
        title: Recommendation
        body: Research-more until a current primary valuation, capitalization, dilution, and audited cash-economics package is available.
        claimRefs: [CV005, CV012, CV015]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Current view, Decision implication]
    rows:
      - [Recommendation, research-more, Do not underwrite an entry price from operating metrics alone]
      - [Confidence, medium, Operating evidence is more developed than price evidence]
      - [Risk rating, high, "Require regulatory, disclosure, and liquidity diligence"]
      - [Valuation stance, unknown, Obtain current primary valuation and preference terms]
    notes: "Assessment synthesizes assigned sources; unknown valuation means no current WeDoctor equity price was established, not zero value."
    claimRefs: [CV005, CV012, CV015]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Evidence signal, What would change the view]
    rows:
      - [Recurring health-management model can scale, "RMB 1.032bn H1 2024 membership revenue; 56.8% of continuing-operations revenue", "Audited retention, margin, and cash conversion by city"]
      - [Tianjin is a meaningful proof point, "266 community centers and more than 2,000 stations and clinics reported", "Independent replication and payer renewal evidence outside Tianjin"]
      - [AI may improve operating leverage, "One health manager reportedly overseeing about 2,000 individuals with AI assistance", "Audited cost-to-serve and outcomes-linked economics"]
      - [Financing access is not assured, "Reported $400m-$500m IPO target; earlier plans were derailed", "Filed prospectus, completed transaction, and transparent cap table"]
    notes: "Rows combine reported company/prospectus claims with explicit diligence tests; no row should be read as independently audited valuation evidence."
    claimRefs: [CV001, CV003, CV005, CV006, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Multi-city HSC replication; membership growth persists; listing completes with transparent terms", "Potential re-rating if recurring revenue converts to audited margin and cash flow", "Regulatory, execution, and disclosure risk", "Low-to-medium"]
      - [Base, "Tianjin remains the main proof point; expansion and disclosure improve gradually", "Research-more until a price can be compared with normalized cash economics", "City concentration and uncertain margins", "Most supportable today"]
      - [Bear, "IPO delay or down-round; weak renewals; reported outcomes do not convert to earnings", "Capital loss or dilution risk dominates; no buy case", "Regulatory, liquidity, governance, and commercialization failure", "Material downside"]
      - [Upside trigger, "Filed prospectus supplies valuation, cap table, audited segment economics, and use of proceeds", "Re-underwrite entry price and dilution explicitly", "Terms may remain preference-heavy", "Observable trigger"]
      - [Downside trigger, "Regulatory intervention, liquidity stress, or adverse renewal evidence", "Reduce exposure or decline participation", "Multiple compression and financing dependence", "Observable trigger"]
    notes: "Scenario logic is qualitative because the assigned pool contains no current WeDoctor valuation, audited margin, or cap-table inputs; no numeric return is invented."
    claimRefs: [CV005, CV008, CV009, CV010, CV015]
