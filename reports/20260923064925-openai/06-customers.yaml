  title: Customers
  summary: OpenAI’s customer base now spans consumers, business seats, and workflow-heavy enterprise accounts, with repeat
    usage and seat expansion doing most of the explanatory work.
sections:
- id: segments
  title: Customer segments and buyer motion
  body: 'The current customer motion spans consumers, individual workers, business seats, and large enterprise deployments.
    Buyers often differ from users: IT or function leaders approve the spend, workers use the product, and admins govern access.
    The strongest public evidence is not just seat count but repeated use, internal GPTs, and department-level workflow integration.
    The best way to read this is as a land-and-expand motion that starts with familiarity and ends with departmental deployment.
    That pattern makes the customer base look broader than a simple consumer app install base. That also creates a broader
    multi-seat growth story. That also creates a broader multi-seat growth story.'
  claimRefs:
  - CU001
  - CU002
  - CU006
  - CU007
  tableRefs:
  - TU001
- id: roi-and-verticals
  title: ROI and vertical adoption
  body: OpenAI’s own enterprise report says workers save 40–60 minutes per day on average and that 75% of surveyed users report
    faster or higher-quality output. The same report and the company’s vertical case studies point to finance, healthcare,
    manufacturing, technology, and professional services as the clearest adoption leaders. This is the classic pattern for
    a platform moving from experimentation into repeatable operating usage. Partner-led case studies show that the company
    is also moving into complex enterprise buying processes where procurement and change management matter. The practical
    question is whether those gains persist once the novelty wears off. The company still needs longer-run proof of that pattern.
    The company still needs longer-run proof of that pattern.
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU009
  tableRefs:
  - TU002
- id: durability-and-gaps
  title: Durability, concentration, and gaps
  body: 'The customer story is strong, but not complete. OpenAI still does not publish NRR, churn, contract length, or top-account
    concentration in a reconcilable way. That leaves an important diligence gap: the business appears durable because users
    keep coming back, but the public record does not yet quantify how concentrated or sticky that durability really is. Those
    missing metrics are exactly what would separate a fast-growing product from a truly durable enterprise platform. Without
    those numbers, the market still has to infer quality from usage and seat growth alone. That is the remaining diligence
    gap for the customer thesis. That is the remaining diligence gap for the customer thesis.'
  claimRefs:
  - CU008
  - CU009
  - CU010
  figureRefs:
  - FU001
  tableRefs:
  - TU003
