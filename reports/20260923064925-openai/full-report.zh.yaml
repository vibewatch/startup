figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: OpenAI 的公开轨迹从非营利机构起步，演进为使命受控的公共利益公司（PBC），进而完成 $852B 巨额融资；在此期间，业务中断事故与企业端增长始终并存。
    data:
      items:
        - date: '2015'
          label: 非营利机构成立
          detail: 确立通过 AGI 造福人类的使命宗旨。
          tone: positive
        - date: '2019'
          label: 设立营利性子公司
          detail: 搭建商业化运营载体。
          tone: neutral
        - date: '2022-11-30'
          label: 推出 ChatGPT
          detail: 迎来规模爆发的公众拐点。
          tone: positive
        - date: '2024-10-02'
          label: 估值 $157B 的 $6.6B 融资轮
          detail: 私募估值大幅重估。
          tone: positive
        - date: '2025-10-28'
          label: 资本结构重组完成
          detail: 确立基金会控制权与 PBC 公司架构。
          tone: neutral
        - date: '2026-03-31'
          label: 估值 $852B 的 $122B 融资轮
          detail: 资本体量迈入极端量级。
          tone: positive
        - date: 2026-09
          label: 发布企业级 AI 报告
          detail: 覆盖 1M+ 家企业客户与 7M+ 个工作席位。
          tone: positive
        - date: 2026-09
          label: 服务运行历史记录
          detail: 反复出现的事故记录仍清晰可见。
          tone: warning
