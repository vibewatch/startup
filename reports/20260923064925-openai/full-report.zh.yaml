      - number: '1.3'
        title: 资本基础与里程碑时间线
        blocks:
          - type: paragraph
            body: >-
              OpenAI 最新披露的资本运作是 2026 年 3 月以 $852 billion 估值完成的 $122 billion 融资。公司还表示当前月收入已达 $2
              billion。因此，公开的里程碑记录已不再是一段创业叙事，而是一部由持续融资、产品发布、治理调整与服务故障构成的演进纪实。尽调面临的核心悬念不是公司是否有体量，而是这一体量究竟已有多少具备持久性，又有多少仍依赖于高度集中的资本与基础设施支撑。当前的财务全貌因而融合了公开估值、战略伙伴敞口以及股权结构表中悬而未决的经济利益。正是由于这种结合，即便未公开全部股权细节，投资者图谱也格外关键。当前的财务全貌因而融合了公开估值、战略伙伴敞口以及股权结构表中悬而未决的经济利益。正是由于这种结合，即便未公开全部股权细节，投资者图谱也格外关键。相关纪实如今不仅包含产品上线，还包括资本重组、融资进展以及服务中断，这些都在影响公众叙事。这是理解股权稀释、控制权分配以及该估值实际含金量的恰当切入点。
