      - number: '3.3'
        title: 护城河持久度与被替代风险
        blocks:
          - type: paragraph
            body: >-
              护城河因而正从单一的模型能力转向工作流集成、治理体系与产品广度。OpenAI 越是深度捆绑对话、智能体、API
              调用以及感知代码仓库的工具链，就越能降低客户单独替换某一层组件的可能。反向风险则是同质化：若竞争对手追平模型层能力并保持工作流层开放，OpenAI
              或将面临价格战压力，而非通吃全局的赢家通吃局面。只有当工作流层保持高黏性、且客户不再把 OpenAI 视为可随时替换的模型 API 时，护城河才守得住。一旦调用迁移至周边操作界面，OpenAI
              虽仍能吸引眼球，却将丧失部分定价权。
