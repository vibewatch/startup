  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入规模与利润率全貌
        blocks:
          - type: paragraph
            body: >-
              公开数据呈现的景象令人瞩目：OpenAI 称其单月收入达 $2 billion，而 Sacra 估计其年化收入接近 $40 billion，2026 年第二季度收入为 $6.7
              billion。同一家第三方机构的分析指出，企业端业务如今贡献了超过一半的收入，且毛利率在 33%
              左右，这使公司看起来更像一个体量庞大、仍在扩张的基础设施平台，而非成熟的软件企业。这一业务结构意义重大，因为公司同时在消费端行为与企业工作流深度两个维度推进商业化变现，而非依赖单一渠道。这是一个强劲的规模扩张故事，但尚不具备成熟软件巨头的成本结构。
