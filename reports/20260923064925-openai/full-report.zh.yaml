chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与组织架构
        blocks:
          - type: paragraph
            body: >-
              OpenAI 将自身定位为 AI 研发与部署公司，其使命是确保通用人工智能造福全人类。在风投支持的初创企业中，这种组织架构极为罕见：非营利实体 OpenAI Foundation 控制着 OpenAI Group
              PBC；设立营利实体旨在推进使命，同时撬动规模扩张与资本募集。该双重架构是本报告后续所有尽调问题的核心锚点。这种独特性足以重塑采购方、合作伙伴或投资方对控制权、知情权及使命偏离风险的评估逻辑。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
      - number: '1.2'
        title: 领导层、治理架构与业务规模
        blocks:
          - type: paragraph
            body: >-
              董事会与高管层权力依然高度集中。Sam Altman 仍是核心的对外公众高管；基金会任命的董事会成员由少数资深运营者、投资人及安全与治理专家组成。公司公开可见的规模十分庞大：OpenAI 称其周活跃用户数超过
              10 亿、企业客户超过 100 万家、ChatGPT 工作场所席位数突破 700
              万。如此体量足以支撑赛道龙头逻辑，但也意味着哪怕轻微的执行失误，如今都会演变成企业级和大众级的重大事件。公开披露的投资者阵容同样十分广泛，涵盖 Microsoft、SoftBank、Amazon 以及
              NVIDIA，这既让公司资金实力异常雄厚，也使其极度依赖少数战略合作关系。公开披露的投资者阵容同样十分广泛，涵盖 Microsoft、SoftBank、Amazon 以及
              NVIDIA，这既让公司资金实力异常雄厚，也使其极度依赖少数战略合作关系。这也意味着外部尽调必须聚焦集中度风险，毕竟少数几个人依然在战略、融资与信任维度上承担着过大的责任。
