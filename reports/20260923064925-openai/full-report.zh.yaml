      - number: '8.2'
        title: 增长与现金消耗博弈
        blocks:
          - type: paragraph
            body: >-
              Sacra 的测算显示，其年化收入达 $40 billion，毛利率约 33%，且 2026 年资金消耗仍可能高达 $27 billion，2027 年消耗可能达 $63
              billion。这足以撑起庞大的增长叙事，但尚未足以支撑起成熟软件企业的高纯度估值倍数。换言之，该估值既在为未来的利润率扩张买单，也是在赌其对依然高资本密集的商业模式的落地执行。真正该问的并非体量是否存在，而是体量扩张的步伐能否快到跑赢推理开支、技术支持重负以及融资拖累。一旦这些增长曲线发生背离，即便收入持续走高，估值倍数也会遭遇挤压。
            claimRefs:
              - CV002
              - CV005
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
      - number: '8.3'
        title: IPO 路径与尽调推导
        blocks:
          - type: paragraph
            body: >-
              舆论叙事已然全面转向 IPO 框架。FT 和 Tech Insider
              均认为公开上市已在运作推进，融资结构中如今引入了更多战略参与方和更宽广的流动性退出方案。这虽然降低了资金链断裂风险，却并未消除核心的尽调疑虑：优先股堆叠（preference
              stack）究竟如何构成、资金消耗中有多少属于刚性兑付承诺，以及公司多快能将庞大体量转化为自由现金流？即便在运营数据尚未彻底理顺之前，融资故事仍能讲通，这也是治理条款、抽屉协议（side
              letters）和优先权利在此时格外关键的原因。正是这些具体条款，决定了上行红利究竟能有多少真正落入普通股股东囊中。
            claimRefs:
              - CV003
              - CV006
              - CV007
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
