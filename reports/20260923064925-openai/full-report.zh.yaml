            body: >-
              在 $852 billion
              的高估值下，市场必须相信收入增速、产品广度以及平台锁定效应足以跑赢高昂的算力成本。公开数据虽能撑起高溢价的成长叙事，却尚未展示出清晰的利润率逻辑。这也是为何即便最新收入体量有所放大，估值立场依旧维持“偏高”：公司增速或许快到足以支撑其当前规模，但仍需证明这种规模能够沉淀为持久的自由现金流。鉴于公开市场可比标的稀缺，最有效的估值推导依据仍是烧钱纪律、毛利演进轨迹以及
              IPO 叙事的可信度。当前的估值倍数依然建立在这样一个假设之上：即便盈利拐点尚不清晰，市场也愿意提前为未来的选择权支付高昂溢价。
            claimRefs:
