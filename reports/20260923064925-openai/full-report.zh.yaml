  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              OpenAI 的对手早已不仅是其他模型厂商。公司现有产品矩阵已延伸至代码仓库工作流、编程智能体及内部工作流自动化，直接对上了 GitHub
              这类操作界面、企业自研方案，以及由企业团队拼装的模块化工具链。核心威胁并非某一个具体对手，而是客户可能在多家模型厂商之间多栖采购（multi-home），同时牢牢把控自己的工作流界面。这导致了这样一种市场格局：客户跨供应商采购模型，却把工作流界面留在别处。正因如此，分发能力与客户留存率成了远比单次模型基准跑分发布更为关键的命题。
            claimRefs:
              - CP001
              - CP003
              - CP007
              - CP010
      - number: '3.2'
        title: 捆绑优势与分发能力
        blocks:
          - type: paragraph
            body: >-
              Codex 扭转了竞争叙事，因为它并非通用的聊天机器人。它是一款能够并行处理任务、融入 CLI 与 ChatGPT
              工作流的工作流智能体，且紧贴代码审查、代码重构与拉取请求（PR）环节。这让分发渠道成了护城河的第一关键变量：OpenAI 必须卡位工程师现有的工作场景，尤其是
              GitHub、终端以及企业自动化界面。实际操作中，开发者面对同一款模型可以选择不同的操作界面，这正是竞争格局的关键变数。因此，公司的护城河不仅关乎智力水平，更是一场关于触达点卡位的较量。
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP006
              - CP008
