  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户客群与采购动线
        blocks:
          - type: paragraph
            body: >-
              目前的获客动线横跨个人消费者、个体职场人、企业席位以及大型企业级部署。采购决策者与实际使用者往往不同：IT
              或业务条线主管负责审批开支，一线员工使用产品，系统管理员负责权限管控。最有说服力的公开证据不仅是席位总数，更是高频复用、内部 GPTs
              构建以及部门级的工作流集成。理解这一现象的最佳视角是“先落地后扩张”（land-and-expand）策略：始于熟练上手，终于部门级规模部署。这种模式让客户盘子看起来远比单纯的个人应用安装量要宽广得多。这也构筑了更具想象力的多席位增长叙事。这也构筑了更具想象力的多席位增长叙事。
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU006
              - CU007
      - number: '6.2'
        title: 投资回报率（ROI）与垂直行业渗透
        blocks:
          - type: paragraph
            body: >-
              OpenAI 自己的企业报告称，员工平均每天可节省 40–60 分钟，75%
              的受访用户反映产出速度加快或质量提高。该报告与公司的垂直行业案例研究均显示，金融、医疗健康、制造业、技术以及专业服务是最明显的应用领跑者。这是平台从探索试验走向可复制日常运营的典型路径。合作伙伴主导的案例研究指出，公司正逐步打入采购流程繁琐、变革管理严苛的复杂企业级采购流程。核心考验在于，一旦新鲜感褪去，此类效率收益能否持续。公司依然需要更长周期的实践来验证这种模式。公司依然需要更长周期的实践来验证这种模式。
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU001
      - number: '6.3'
        title: 业务持久性、集中度与信息缺口
        blocks:
          - type: paragraph
            body: >-
              客户维度的叙事虽然强劲，但并不完整。OpenAI
              至今仍未以可勾稽的方式公开净留存率（NRR）、流失率、合同期限或头部客户集中度。这就留下了关键的尽调缺口：由于用户持续回访，业务看似具备持久性，但公开数据尚未量化这种持久性究竟集中度如何、黏性究竟有多强。这些缺失的指标，恰恰是将一款高增长产品与真正持久的企业级平台区分开来的试金石。缺乏这些数据，市场只能单纯凭使用量和席位增长推断业务质量。这正是客户投资逻辑中遗留的尽调缺口。这正是客户投资逻辑中遗留的尽调缺口。
            claimRefs:
              - CU008
              - CU009
              - CU010
