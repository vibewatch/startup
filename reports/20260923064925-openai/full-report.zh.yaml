  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值观察框架
        blocks:
          - type: paragraph
            body: >-
              最新公开估值为 $852 billion，公司自己也表示单月收入已达到 $2
              billion。两项数据叠加，核心问题直指：极速膨胀的体量能否转化为持久的经营杠杆。市场目前愿意将其视作定义赛道的标杆平台出资支持，但高估值仍需消化巨额资金消耗、沉重的资本承诺，以及未来伴随信息披露增多必然面临的上市折价。尽调的关键要害在于：市场当下定价买入的是远期平台图景，而非眼下的现金造血能力。这固然保留了上行空间，但只要增长或利润率指标出现任何闪失，估值就会面临快速重估。
            claimRefs:
              - CV001
              - CV004
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
