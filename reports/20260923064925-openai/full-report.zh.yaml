  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              所涉市场绝非一个单薄的 TAM 标题数字。衡量 OpenAI 的实际业务边界，关键在于能够替代搜索、软件工具、分析以及部分服务人力的各项开支——横跨个人助理、企业工作流自动化与开发者/API
              基础设施。公司自身披露的资料显示，该市场由高频重复工作流驱动，而非偶发查询工具；替代品涵盖内部自研、其他模型厂商以及现有企业级软件体系。该边界还囊括了各类相邻工具，原因在于采购方在同一个决策会议上，会将
              OpenAI 与传统软件、自研方案以及其他 AI 平台放在一起比对。正因如此，这一品类正在不断突破旧有的聊天机器人标签。
            claimRefs:
              - CM001
              - CM007
              - CM012
              - CM013
      - number: '2.2'
        title: 规模测算视角与受证据约束的普及节奏
        blocks:
          - type: paragraph
            body: >-
              OpenAI 当前的商业化底盘已经足够大，足以支持基于公司内部数据自上而下测算市场规模。企业报告与融资公告披露，公司拥有超过 100 万家企业客户、700 万个工作场所席位、逾 9 亿周活跃用户，以及每月 $2
              billion 的收入运行水平。相比单一的 TAM 数字，更具实操价值的尽调视角是多维观察框架：个人端规模、企业级席位与开发者/API
              调用量，共同指向一个商业化变现面积仍在扩大的品类。因此，更准确的理解方式是分层普及体系，而非固守单一市场规模数字。这种视角更契合一家能在获客后不断加深使用黏性的公司，同时也解释了为何收入——而非仅仅是使用量——才是反映市场体量最清晰的现实指标。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM008
