        title: 附图与附表
        blocks:
          - type: callout
            title: 唯有强悍的执行力才能支撑当前估值
            body: 只要收入持续复合增长且烧钱速度明显收敛，OpenAI 就能自证其激进的估值水平；否则该估值倍数将显得愈发偏高。
