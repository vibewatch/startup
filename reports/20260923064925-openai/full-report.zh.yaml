        title: 附图与附表
        blocks:
          - type: callout
            title: 认知熟稔度是实打实的获客抓手
            body: 大众对 ChatGPT 的熟稔度似乎减少了企业内部的推广阻力，不仅缩短了企业销售周期，也助推了更快的席位扩容。
            calloutType: insight
            claimRefs:
              - CU006
              - CU010
