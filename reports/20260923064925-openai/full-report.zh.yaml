      - number: '7.3'
        title: 治理结构与法律风险
        blocks:
          - type: paragraph
            body: >-
              OpenAI 的治理叙事依然非同寻常，而这种特殊架构屡次招致公众的放大审视。公司由非营利组织控制的公共利益公司（PBC）形态、围绕该架构旷日持久的法律与使命纷争，以及与 IPO
              相关的法律评议，均说明治理风险绝非细枝末节，而是核心投资逻辑不可分割的一部分。面向未来的上市企业，这类架构可能引发信披摩擦、利益相关方关系紧绷，并引来投资方与监管机构的双重审视。这让治理风险超越了单纯的新闻标题范畴，演变为制约融资步伐与战略落地的经营层面的硬约束。在庞大业务体量下，该问题已具备重大实质影响。
            claimRefs:
              - CR006
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
      - number: '7.4'
        title: 附图与附表
        blocks:
          - type: callout
            title: 最新前沿版本放大上行潜力的同时引来更严密审视
            body: Astra 与 Daybreak 证明了 OpenAI 在努力推进安全运营化落地，但也使其网络安全与治理敞口暴露得更加清晰。
