      - number: '2.3'
        title: 采购方、驱动因素与制约条件
        blocks:
          - type: paragraph
            body: >-
              最早的采购方并非零散的个人消费者，而是拥有明确预算负责人、深受工作流痛点困扰、且具备足够业务量来承担集成成本的在职员工与组织。OpenAI
              自己的企业报告强调了生产力提升、使用频率增加，以及技术、医疗健康、制造业、金融和专业服务等领域更高的渗透强度。关键制约因素在于治理、集成与信任。随着这些瓶颈逐步缓解，市场正从前期的摸索尝试扩展至嵌入式工作流基础设施。采购方看重的是节约的时间、治理保障，以及
              AI 能否深度嵌入内部可复用的工作流，而非仅当作新鲜玩具。换言之，买单方买的是工作流成果，而非模型演示。
