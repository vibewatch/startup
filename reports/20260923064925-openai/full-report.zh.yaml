            body: >-
              关键症结在于烧钱速度。公开分析预计 2026 年现金消耗约 $27 billion，2027 年消耗约 $63 billion，也就是说，该业务仍需巨额持续资本注入才能跟上自身的需求曲线。OpenAI 拥有的
              $4.7 billion 循环信贷额度虽有助益，但并未改变公司高度依赖外部融资的根本事实。2026 年 3
              月的融资轮次还将股权结构表扩展至具备算力协同效应的战略投资方，进一步坐实了“金融运作与基础设施建设密不可分”的观点。正因如此，流动性纪律和战略投资方的重要性绝不亚于显眼的估值数字。融资组合的设计因而与经营计划同等关键。
