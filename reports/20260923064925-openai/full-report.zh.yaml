            title: 公开数据仍遗漏了持久性指标
            body: 缺少 NRR、流失率以及集中度数据，市场看得到高增长，却尚未能完全为客户留存质量合理定价。
            calloutType: risk
            claimRefs:
              - CU008
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 可靠性与客户体验风险
        blocks:
          - type: paragraph
            body: >-
              OpenAI
              自身的状态监控历史记录显示，ChatGPT、API、登录及特定模型服务曾多次发生事故，外部评价渠道也依然充斥着大量不满情绪。一家已蜕变为日常工作基础设施的公司，哪怕只有轻微的宕机率或技术支持滞后，都会成为阻碍企业级客户采纳的绊脚石。即便确切的事故次数尚未公开，各大评测网站和用户论坛中仍能看到更广泛的投诉。尽调的核心关注点不仅在于故障是否发生，更在于这些事故是否已波及那些将
              OpenAI 深度嵌入日常工作、无法容忍长时间服务中断的客户。这不仅是产品运维问题，更直接关乎收入留存。
            claimRefs:
              - CR003
              - CR004
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR009
      - number: '7.2'
        title: 网络安全风险与访问控制
        blocks:
          - type: paragraph
            body: >-
              《Path to Astra》一文明确提出了网络安全风险，指出 Astra 已达到关键的网络安全门槛，而 Daybreak 则增加了分级访问控制。这固然是走向成熟的标志，但 OpenAI
              如今操盘的是一款既强大又脆弱的产品：各类管控虽降低了滥用风险，却可能拖慢正常工作节奏，或在合规工作流中引发误报。实际运作中，每当用户尝试执行敏感任务或涉及网络安全的关联流程时，OpenAI
              都必须在安全性与易用性之间权衡取舍。真正的挑战在于：如何在抑制滥用的同时，不让产品成为正常用户频繁遭遇干扰的源头。
            claimRefs:
              - CR001
