chapter:
  number: 8
  title: Valuation
  summary: 'OpenAI’s valuation is now driven by a binary question: can a $40B annualized-revenue company with heavy compute
    burn and a likely IPO path convert scale into durable free cash flow fast enough to justify an $852B mark?'
sections:
- id: valuation-lens
  title: Valuation lens
  body: The latest public valuation is $852 billion, and the company itself says it is generating $2 billion in revenue per
    month. That combination puts the question squarely on whether rapid scale can become durable operating leverage. The market
    is currently willing to finance the company as a category-defining platform, but the valuation still has to absorb burn,
    capital commitments, and the eventual public-listing discount that comes with more disclosure. The key diligence issue
    is that the market is pricing a future platform, not today's cash generation. That keeps upside open, but it also means
    the valuation can re-rate quickly if growth or margin signals slip.
  claimRefs:
  - CV001
  - CV004
  - CV008
  tableRefs:
  - TV001
  - TV002
- id: growth-vs-burn
  title: Growth versus burn
  body: Sacra’s estimates point to $40 billion in annualized revenue, roughly 33% gross margin, and burn that could still
    be $27 billion in 2026 and $63 billion in 2027. That is enough to support a very large growth narrative, but not yet enough
    to support a clean mature-software multiple. In other words, the valuation is buying both future margin expansion and
    execution on a still-capital-intensive business model. The right question is not whether scale exists, but whether scale
    arrives fast enough to outrun inference spend, support burden, and financing drag. If those curves diverge, the multiple
    compresses even if revenue keeps rising.
  claimRefs:
  - CV002
  - CV005
  - CV009
  figureRefs:
  - FV001
- id: ipo-and-due-diligence
  title: IPO path and diligence read-through
  body: 'The public narrative has already shifted to an IPO frame. The FT and Tech Insider both treat a public listing as
    live, and the financing stack now includes more strategic participants and broader liquidity options. That lowers funding
    risk, but it does not remove the core diligence questions: what exactly is the preference stack, how much of the burn
    is structurally committed, and how fast can the company translate scale into free cash flow? The financing story may still
    work even before the operating story is clean, which is why governance, side letters, and preference rights matter so
    much here. Those terms determine how much of the upside actually reaches common holders.'
  claimRefs:
  - CV003
  - CV006
  - CV007
  tableRefs:
  - TV003
