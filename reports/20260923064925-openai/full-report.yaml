  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not a single TAM headline. For OpenAI, the practical boundary is the spend on
              consumer assistants, enterprise workflow automation, and developer/API infrastructure that can replace
              search, software tooling, analysis, and some service labor. The company’s own materials show that this is
              a market for repeat workflows, not one-off queries, and the substitutes include in-house build, other
              model providers, and existing enterprise software stacks. This boundary also captures adjacent tools,
              because buyers compare OpenAI against legacy software, in-house builds, and other AI platforms at the same
              decision table. That is why the category keeps stretching beyond the old chatbot label.
            claimRefs:
              - CM001
              - CM007
              - CM012
              - CM013
      - number: '2.2'
        title: Sizing lens and evidence-constrained adoption
        blocks:
          - type: paragraph
            body: >-
              OpenAI’s current monetized base is already large enough to justify a top-down sizing lens from inside the
              company. The enterprise report and funding announcement show more than 1 million business customers, 7
              million workplace seats, 900 million-plus weekly users, and $2 billion in monthly revenue. Rather than a
              single TAM figure, the more useful diligence view is a multi-lens picture: consumer scale, enterprise
              seats, and developer/API usage all point to a category that is still expanding its monetizable surface
              area. The right interpretation is therefore a layered adoption stack, not a single-market number. That is
              a better fit for a company whose usage can deepen after a sale. It also explains why revenue, not just
              usage, is the cleanest current proxy for market size.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM008
