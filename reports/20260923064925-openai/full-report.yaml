      - number: '7.2'
        title: Cyber risk and access controls
        blocks:
          - type: paragraph
            body: >-
              The Path to Astra post makes cyber risk explicit by saying Astra meets a critical cybersecurity threshold,
              while Daybreak adds scoped access controls. That is a sign of maturity, but it also means OpenAI is now
              managing a product that can be both powerful and brittle: the controls reduce misuse risk, yet they can
              slow legitimate work or trigger false positives in legitimate workflows. In practice, that means OpenAI is
              balancing safety against usability every time a sensitive task or cyber-adjacent workflow is attempted.
              The challenge is to reduce misuse without turning the product into a constant source of interruptions for
              legitimate users.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR009
      - number: '7.3'
        title: Governance and legal risk
        blocks:
          - type: paragraph
            body: >-
              OpenAI’s governance story remains unusual, and that unusual structure invites recurring public scrutiny.
              The company’s nonprofit-controlled PBC form, the long-running legal and mission disputes around its
              structure, and the IPO-related legal commentary all mean that governance risk is not a side issue. It is
              part of the core investment case. For a future public company, that kind of structure can create
              disclosure friction, stakeholder tension, and extra scrutiny from investors and regulators alike. That
              makes governance more than a headline risk; it becomes an operating constraint on financing and strategy.
              That makes the issue material at scale.
            claimRefs:
              - CR006
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The newest frontier releases increase both upside and scrutiny
            body: >-
              Astra and Daybreak are proof that OpenAI is trying to operationalize safety, but they also make the
              company’s cyber and governance exposure more explicit.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR005
          - type: callout
            title: Reliability is now a business risk, not a product annoyance
            body: >-
              Once enterprise workflows depend on OpenAI, incident rates and support quality affect revenue retention,
              not just user satisfaction.
            calloutType: insight
            claimRefs:
              - CR003
              - CR004
              - CR009
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation lens
        blocks:
          - type: paragraph
            body: >-
              The latest public valuation is $852 billion, and the company itself says it is generating $2 billion in
              revenue per month. That combination puts the question squarely on whether rapid scale can become durable
              operating leverage. The market is currently willing to finance the company as a category-defining
              platform, but the valuation still has to absorb burn, capital commitments, and the eventual public-listing
              discount that comes with more disclosure. The key diligence issue is that the market is pricing a future
              platform, not today's cash generation. That keeps upside open, but it also means the valuation can re-rate
              quickly if growth or margin signals slip.
            claimRefs:
              - CV001
              - CV004
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV005
              - CV009
      - number: '8.2'
        title: Growth versus burn
        blocks:
          - type: paragraph
            body: >-
              Sacra’s estimates point to $40 billion in annualized revenue, roughly 33% gross margin, and burn that
              could still be $27 billion in 2026 and $63 billion in 2027. That is enough to support a very large growth
              narrative, but not yet enough to support a clean mature-software multiple. In other words, the valuation
              is buying both future margin expansion and execution on a still-capital-intensive business model. The
              right question is not whether scale exists, but whether scale arrives fast enough to outrun inference
              spend, support burden, and financing drag. If those curves diverge, the multiple compresses even if
              revenue keeps rising.
            claimRefs:
              - CV002
              - CV005
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
      - number: '8.3'
        title: IPO path and diligence read-through
        blocks:
          - type: paragraph
            body: >-
              The public narrative has already shifted to an IPO frame. The FT and Tech Insider both treat a public
              listing as live, and the financing stack now includes more strategic participants and broader liquidity
              options. That lowers funding risk, but it does not remove the core diligence questions: what exactly is
              the preference stack, how much of the burn is structurally committed, and how fast can the company
              translate scale into free cash flow? The financing story may still work even before the operating story is
              clean, which is why governance, side letters, and preference rights matter so much here. Those terms
              determine how much of the upside actually reaches common holders.
            claimRefs:
              - CV003
              - CV006
              - CV007
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The valuation is supportable only with strong execution
            body: >-
              OpenAI can justify an aggressive mark if revenue keeps compounding and burn bends down; otherwise the
              multiple will look increasingly stretched.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV005
              - CV008
          - type: callout
            title: IPO readiness is not the same as IPO quality
            body: >-
              A public listing may happen because the company is huge and financeable, not because the economics are yet
              fully mature.
            calloutType: risk
            claimRefs:
              - CV003
              - CV006
              - CV007
