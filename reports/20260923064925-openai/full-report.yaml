          - type: paragraph
            body: >-
              The current public picture is striking: OpenAI says it generates $2 billion per month, while Sacra
              estimates annualized revenue near $40 billion and Q2 2026 revenue at $6.7 billion. The same third-party
              analysis says enterprise is now more than half of revenue and that gross margin is around 33%, which makes
