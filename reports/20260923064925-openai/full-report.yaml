  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Current product stack
        blocks:
          - type: paragraph
            body: >-
              OpenAI now sells across chat, coding, enterprise workflows, vertical use cases, and security/access
              controls. That breadth matters because the company is no longer a pure model vendor; it is a product
              platform that wraps the model layer with workflow, governance, and deployment surfaces. The stack is now
              broad enough that a buyer can evaluate OpenAI as a platform rather than a single model endpoint. It also
              now includes controls, vertical packaging, and distribution mechanics that matter to buyers. That platform
              framing is now central to how customers evaluate the company. Buyers now compare the bundle against
              broader enterprise platforms.
            claimRefs:
              - CE001
              - CE007
              - CE008
      - number: '5.2'
        title: Codex and workflow integration
        blocks:
          - type: paragraph
            body: >-
              Codex is the clearest example of the platform shift. OpenAI describes it as a cloud software-engineering
              agent that can work on many tasks in parallel, and the surrounding ecosystem increasingly treats it as a
              workflow product rather than a narrow coding assistant. That makes GitHub-like surfaces and
              repository-aware tooling part of the competitive context. That matters because engineering teams buy tools
              that fit their repository and review habits, not just tools with strong benchmarks. The external ecosystem
              is already teaching teams how to use it, which is a strong adoption signal. It also helps explain why
              workflow proximity can matter more than benchmark bragging rights. That is a meaningful shift in how the
              product gets evaluated.
