chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and structure
        blocks:
          - type: paragraph
            body: >-
              OpenAI describes itself as an AI research and deployment company whose mission is to ensure that
              artificial general intelligence benefits all of humanity. The present structure is unusual for a
              venture-backed startup: the nonprofit OpenAI Foundation controls OpenAI Group PBC, and the for-profit arm
              is intended to advance the mission while still supporting scale and capital formation. That dual structure
              is the anchor for every later diligence question in this report. That is unusual enough to change how a
              buyer, partner, or investor should think about control, information rights, and mission drift.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
      - number: '1.2'
        title: Leadership, governance, and scale
        blocks:
          - type: paragraph
            body: >-
              The board and senior leadership remain highly concentrated. Sam Altman remains the central public
              executive; the Foundation-appointed board includes a small group of experienced operators, investors, and
              safety/governance specialists. Publicly visible scale is now extraordinary: OpenAI says it reaches more
              than 1 billion weekly active users, more than 1 million business customers, and more than 7 million
              ChatGPT workplace seats. That scale is real enough to support a category-leader thesis, but it also means
              even small execution mistakes are now enterprise- and consumer-grade events. The disclosed investor base
              is also broad, spanning Microsoft, SoftBank, Amazon, and NVIDIA, which makes the company both unusually
              well-capitalized and unusually dependent on a small set of strategic relationships. The disclosed investor
              base is also broad, spanning Microsoft, SoftBank, Amazon, and NVIDIA, which makes the company both
              unusually well-capitalized and unusually dependent on a small set of strategic relationships. It also
              means external diligence needs to focus on concentration risk, because a few people still carry outsized
              responsibility for strategy, financing, and trust.
