        title: Safety, access, and deployment controls
        blocks:
          - type: paragraph
            body: >-
              The company’s newest frontier capabilities come with new guardrails. Astra is explicitly framed as a
              critical cybersecurity-capability model, and Daybreak now lets admins scope access by project or user. The
              product direction is therefore toward more controllable enterprise deployment, even if that means more
