      - number: '4.2'
        title: Burn, liquidity, and financing stack
        blocks:
          - type: paragraph
            body: >-
              The problem is burn. Public analysis places 2026 cash burn around $27 billion and 2027 burn around $63
              billion, which means the business still needs enormous ongoing capital to keep pace with its own demand
              curve. OpenAI’s $4.7 billion revolver helps, but it does not change the core fact that the company remains
              financing-intensive. The March 2026 round also broadened the cap table to strategic investors with compute
              relevance, which reinforces the view that finance and infrastructure are now inseparable. This is why
              liquidity discipline and strategic investors matter as much as the headline valuation. The financing stack
              therefore matters as much as the operating plan.
