        title: Buyers, drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The earliest buyers are not random consumers; they are workers and organizations with clear budget owners,
              workflow pain, and enough volume to justify integration. OpenAI’s own enterprise report emphasizes
              productivity gains, more frequent use, and higher adoption intensity in technology, healthcare,
              manufacturing, finance, and professional services. The key constraints are governance, integration, and
              trust. As those constraints ease, the market expands from experimentation toward embedded workflow
              infrastructure. The buyers care about time saved, governance, and whether AI can be embedded in repeatable
              internal workflows rather than treated as a novelty. In other words, the buyer is paying for a workflow
              outcome, not a model demo.
