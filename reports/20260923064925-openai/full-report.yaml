  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set and substitutes
        blocks:
          - type: paragraph
            body: >-
              OpenAI no longer competes only with other model vendors. The company’s current product stack crosses into
              repository workflows, coding agents, and internal workflow automation, which puts it up against
              GitHub-like surfaces, in-house builds, and modular toolchains that can be stitched together by enterprise
              teams. The main threat is not one rival; it is the possibility that customers multi-home across model
              vendors while keeping control of their workflow surfaces. The result is a market where customers can
              multi-home across vendors while keeping the workflow surface in a different place. That makes distribution
              and retention the more important questions than any single benchmark release.
            claimRefs:
              - CP001
              - CP003
              - CP007
              - CP010
      - number: '3.2'
        title: Bundle power and distribution
        blocks:
          - type: paragraph
            body: >-
              Codex changes the story because it is not a generic chatbot. It is a workflow agent that runs tasks in
              parallel, fits into CLI and ChatGPT flows, and can sit close to code review, refactoring, and pull-request
              behavior. That makes distribution a first-order moat variable: OpenAI needs to be present in the places
              where engineers already work, especially GitHub, terminal, and enterprise automation surfaces. In
              practice, that means a developer can choose the same model but different operating surfaces, which is the
              key competitive twist. The company’s advantage is therefore partly a placement problem, not only an
              intelligence problem.
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP006
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP007
              - CP009
          - type: table
            tableRef: TP002
