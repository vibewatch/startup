      - number: '4.3'
        title: Valuation read-through
        blocks:
          - type: paragraph
            body: >-
              At $852 billion, the valuation asks the market to believe that revenue growth, product breadth, and
              platform lock-in will outrun the economics of compute. The public data supports a premium growth
              narrative, but not yet a clean margin story. That is why the valuation stance remains stretched even with
              the latest revenue expansion: the company may be growing fast enough to justify scale, but it still has to
              prove that scale can translate into durable free cash flow. Public comparables are scarce, so the best
              read-through comes from burn discipline, margin trajectory, and the credibility of the IPO story. The
              current multiple still assumes the market will pay for optionality long before the profit line is obvious.
            claimRefs:
