      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat is therefore moving from model quality alone to workflow integration, governance, and product
              breadth. The more OpenAI bundles chat, agents, API usage, and repository-aware tooling, the more it can
              reduce the likelihood that customers swap only one layer at a time. The counter-risk is commoditization:
              if competitors match the model layer and keep the workflow layer open, OpenAI may face price pressure
              rather than winner-take-all economics. The moat will hold only if the workflow layer stays sticky and
              customers do not treat OpenAI as a swappable model API. If usage migrates to adjacent surfaces, OpenAI
              will still win attention but lose some pricing power.
            claimRefs:
              - CP005
