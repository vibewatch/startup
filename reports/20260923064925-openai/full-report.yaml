  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Reliability and customer experience risk
        blocks:
          - type: paragraph
            body: >-
              OpenAI’s own status history shows repeated incidents across ChatGPT, the API, login, and model-specific
              services, and external review surfaces still show meaningful dissatisfaction. For a company that is now
              infrastructure for work, even modest outage rates or support failures can become enterprise adoption
              blockers. The broader complaint surface is visible in review sites and user forums, even if exact incident
              counts remain unpublished. The important diligence issue is not simply whether incidents happen, but
              whether those incidents now affect customers who are embedding OpenAI into daily work and cannot tolerate
              long outages. It is now a revenue-retention question as much as a product-ops question.
            claimRefs:
              - CR003
