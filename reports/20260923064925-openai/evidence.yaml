  - type: private-evidence-only
    severity: material
    topic: economics
    missingEvidence: Audited segment revenue, gross margin, burn, and cash balance are not publicly disclosed in a reconcilable way.
    whyItMatters: The valuation must be underwritten without full operating economics.
    diligencePath: Obtain a data room view or audited management accounts.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: ownership
    missingEvidence: A fully reconciled cap table, side-letter stack, and preference terms.
    whyItMatters: The 2026 financing stack changes downside allocation and future dilution.
    diligencePath: Review financing documents and shareholder consents.
    relatedQuestionRefs:
      - QO003
  - type: enumeration-incomplete
    severity: minor
    topic: locations
