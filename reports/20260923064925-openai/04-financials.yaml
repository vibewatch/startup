  title: Financials
  summary: OpenAI now combines extraordinary revenue scale with equally extraordinary burn, keeping the valuation debate tied
    to capital intensity, margin expansion, and the eventual IPO path.
sections:
- id: revenue-and-margin
  title: Revenue scale and margin profile
  body: 'The current public picture is striking: OpenAI says it generates $2 billion per month, while Sacra estimates annualized
    revenue near $40 billion and Q2 2026 revenue at $6.7 billion. The same third-party analysis says enterprise is now more
    than half of revenue and that gross margin is around 33%, which makes the company look more like a very large, still-scaling
    infrastructure platform than a mature software business. The mix matters because the company is monetizing both consumer
    behavior and enterprise workflow depth rather than a single channel. It is a strong scale story, but it still lacks the
    cost structure of a mature software franchise.'
  claimRefs:
  - CI002
  - CI003
  - CI004
  - CI008
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: burn-and-liquidity
  title: Burn, liquidity, and financing stack
  body: The problem is burn. Public analysis places 2026 cash burn around $27 billion and 2027 burn around $63 billion, which
    means the business still needs enormous ongoing capital to keep pace with its own demand curve. OpenAI’s $4.7 billion
    revolver helps, but it does not change the core fact that the company remains financing-intensive. The March 2026 round
    also broadened the cap table to strategic investors with compute relevance, which reinforces the view that finance and
    infrastructure are now inseparable. This is why liquidity discipline and strategic investors matter as much as the headline
    valuation. The financing stack therefore matters as much as the operating plan.
  claimRefs:
  - CI005
  - CI006
  - CI007
  - CI010
  tableRefs:
  - TI002
  - TI003
- id: valuation-read-through
  title: Valuation read-through
  body: 'At $852 billion, the valuation asks the market to believe that revenue growth, product breadth, and platform lock-in
    will outrun the economics of compute. The public data supports a premium growth narrative, but not yet a clean margin
    story. That is why the valuation stance remains stretched even with the latest revenue expansion: the company may be growing
    fast enough to justify scale, but it still has to prove that scale can translate into durable free cash flow. Public comparables
    are scarce, so the best read-through comes from burn discipline, margin trajectory, and the credibility of the IPO story.
    The current multiple still assumes the market will pay for optionality long before the profit line is obvious.'
  claimRefs:
  - CI001
  - CI009
  - CI011
  - CI010
  tableRefs:
  - TI004
