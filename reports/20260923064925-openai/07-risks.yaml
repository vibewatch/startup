company:
  name: OpenAI
chapter:
  number: 7
  title: Risks
  summary: OpenAI’s risk profile is dominated by reliability, cyber-safety controls, and governance/legal complexity, with
    the newest frontier-capability releases making those issues more visible rather than less.
sections:
- id: reliability
  title: Reliability and customer experience risk
  body: OpenAI’s own status history shows repeated incidents across ChatGPT, the API, login, and model-specific services,
    and external review surfaces still show meaningful dissatisfaction. For a company that is now infrastructure for work,
    even modest outage rates or support failures can become enterprise adoption blockers. The broader complaint surface is
    visible in review sites and user forums, even if exact incident counts remain unpublished. The important diligence issue
    is not simply whether incidents happen, but whether those incidents now affect customers who are embedding OpenAI into
    daily work and cannot tolerate long outages. It is now a revenue-retention question as much as a product-ops question.
  claimRefs:
  - CR003
  - CR004
  - CR009
  tableRefs:
  - TR001
- id: cyber-and-controls
  title: Cyber risk and access controls
  body: 'The Path to Astra post makes cyber risk explicit by saying Astra meets a critical cybersecurity threshold, while
    Daybreak adds scoped access controls. That is a sign of maturity, but it also means OpenAI is now managing a product that
    can be both powerful and brittle: the controls reduce misuse risk, yet they can slow legitimate work or trigger false
    positives in legitimate workflows. In practice, that means OpenAI is balancing safety against usability every time a sensitive
    task or cyber-adjacent workflow is attempted. The challenge is to reduce misuse without turning the product into a constant
    source of interruptions for legitimate users.'
  claimRefs:
  - CR001
  - CR002
  - CR005
  - CR007
  - CR008
  figureRefs:
  - FR001
  tableRefs:
  - TR002
- id: governance
  title: Governance and legal risk
  body: OpenAI’s governance story remains unusual, and that unusual structure invites recurring public scrutiny. The company’s
    nonprofit-controlled PBC form, the long-running legal and mission disputes around its structure, and the IPO-related legal
    commentary all mean that governance risk is not a side issue. It is part of the core investment case. For a future public
    company, that kind of structure can create disclosure friction, stakeholder tension, and extra scrutiny from investors
    and regulators alike. That makes governance more than a headline risk; it becomes an operating constraint on financing
    and strategy. That makes the issue material at scale.
  claimRefs:
  - CR006
  tableRefs:
  - TR003
