chapter:
  number: 1
  title: Company Overview
  summary: OpenAI remains a foundation-controlled frontier AI platform with exceptional public scale, but the latest valuation,
    revenue, and product momentum continue to outrun full private-company disclosure.
sections:
- id: identity-and-structure
  title: Identity, mission, and structure
  body: 'OpenAI describes itself as an AI research and deployment company whose mission is to ensure that artificial general
    intelligence benefits all of humanity. The present structure is unusual for a venture-backed startup: the nonprofit OpenAI
    Foundation controls OpenAI Group PBC, and the for-profit arm is intended to advance the mission while still supporting
    scale and capital formation. That dual structure is the anchor for every later diligence question in this report. That
    is unusual enough to change how a buyer, partner, or investor should think about control, information rights, and mission
    drift.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
- id: leadership-and-scale
  title: Leadership, governance, and scale
  body: 'The board and senior leadership remain highly concentrated. Sam Altman remains the central public executive; the
    Foundation-appointed board includes a small group of experienced operators, investors, and safety/governance specialists.
    Publicly visible scale is now extraordinary: OpenAI says it reaches more than 1 billion weekly active users, more than
    1 million business customers, and more than 7 million ChatGPT workplace seats. That scale is real enough to support a
    category-leader thesis, but it also means even small execution mistakes are now enterprise- and consumer-grade events.
    The disclosed investor base is also broad, spanning Microsoft, SoftBank, Amazon, and NVIDIA, which makes the company both
    unusually well-capitalized and unusually dependent on a small set of strategic relationships. The disclosed investor base
    is also broad, spanning Microsoft, SoftBank, Amazon, and NVIDIA, which makes the company both unusually well-capitalized
    and unusually dependent on a small set of strategic relationships. It also means external diligence needs to focus on
    concentration risk, because a few people still carry outsized responsibility for strategy, financing, and trust.'
  claimRefs:
  - CO006
  - CO008
  - CO009
  - CO010
  - CO013
  tableRefs:
  - TO001
  - TO002
- id: capital-and-milestones
  title: Capital base and milestone chronology
  body: OpenAI’s latest disclosed capital event is the March 2026 $122 billion round at an $852 billion valuation. The company
    also says it is now generating $2 billion in monthly revenue. The public milestone record is therefore no longer just
    a founding story; it is a chronology of recurring fundraising, product launches, governance resets, and service incidents.
    The open question for diligence is not whether the company has scale, but how much of that scale is already durable versus
    still dependent on a narrow capital and infrastructure stack. The current finance picture therefore combines public valuation,
    strategic partner exposure, and unresolved economics in the cap stack. That combination is exactly why the investor map
    matters even though the full ownership details are not public. The current finance picture therefore combines public valuation,
    strategic partner exposure, and unresolved economics in the cap stack. That combination is exactly why the investor map
    matters even though the full ownership details are not public. The relevant chronology now includes not only product launches
    but also recapitalization, financing, and service incidents, all of which affect the public narrative. That is the right
    lens for understanding dilution, control, and the practical meaning of the valuation.
  claimRefs:
  - CO007
  - CO011
  - CO012
  - CO014
