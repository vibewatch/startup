evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Public board composition, committee structure, and promoter shareholding after the September 2025 round.
    whyItMatters: IPO readiness and control rights cannot be assessed cleanly without governance visibility.
    diligencePath: Request the latest cap table, board observer rights, and a current board list from management.
    relatedQuestionRefs:
      - QO022
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
      - TO004
  - type: conflicting-data
    severity: material
    topic: fy25-profitability
    missingEvidence: >-
      A reconciled management bridge between RoC-based FY25 PAT of about Rs 220 crore and ratings-linked reporting of Rs
      492 crore PAT.
    whyItMatters: Investors need a single filing-grade earnings definition before underwriting IPO valuation.
    diligencePath: >-
      Obtain audited consolidated FY25 statements and management commentary reconciling statutory, adjusted, and
      ratings-package numbers.
    relatedQuestionRefs:
      - QO014
  - type: private-evidence-only
    severity: minor
    topic: exports
    missingEvidence: Subsidiary-level revenue split and export contribution by region.
    whyItMatters: International optionality is mentioned publicly but not quantified.
    diligencePath: Ask for Singapore subsidiary revenue, export gross margin, and receivable aging by geography.
    relatedQuestionRefs:
      - QO024
  - type: conflicting-data
    severity: material
    topic: tam
    missingEvidence: >-
      A category-level construction-materials procurement baseline that strips out land, labour, and finance while
      matching Infra.Market’s portfolio.
    whyItMatters: A cleaner SAM is necessary to translate macro demand into valuation-relevant penetration math.
    diligencePath: >-
      Build a bottom-up model by concrete, steel, walling, tiles, paints, electricals, and retail channels using
      industry shipment data.
    relatedQuestionRefs:
      - QM023
  - type: stale
    severity: minor
    topic: policy-continuity
    missingEvidence: A refreshed post-budget view on how much housing and infra outlays are likely to persist through FY27-FY28.
    whyItMatters: Policy durability affects the downside case for demand-sensitive categories.
    diligencePath: Add post-budget government documents and broker sector notes in the next refresh.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: minor
    topic: digital-penetration
    missingEvidence: A high-quality public estimate for digital share of Indian building-materials procurement.
    whyItMatters: Digitization rate shapes upside on organized-platform penetration.
    diligencePath: >-
      Interview industry associations and large suppliers, then triangulate with logistics and procurement-software
      vendors.
    relatedQuestionRefs:
      - QM019
      - QM025
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Public, apples-to-apples pricing and gross-margin comparison across Infra.Market and peers.
    whyItMatters: >-
      Competitive durability depends on whether service and brand control translate into superior economics, not just
      higher revenue.
    diligencePath: >-
      Request category-level gross margins, customer acquisition cost by channel, and win-loss analysis against key
      rivals.
    relatedQuestionRefs:
      - QP023
      - QP025
  - type: private-evidence-only
    severity: minor
    topic: customer-overlap
    missingEvidence: Named account overlap and renewal dynamics between Infra.Market and peers.
    whyItMatters: Revenue scale does not reveal whether the same buyers actively multi-home across platforms.
    diligencePath: Conduct channel checks with developers, contractors, and dealers in top cities.
    relatedQuestionRefs:
      - QP020
      - QP024
  - type: conflicting-data
    severity: material
    topic: fy25-profit
    missingEvidence: >-
      A management-certified reconciliation of the Rs 220 crore and Rs 492 crore FY25 PAT figures appearing in public
      sources.
    whyItMatters: The earnings base drives multiples, leverage tolerance, and IPO credibility.
    diligencePath: >-
      Request audited consolidated FY25 statements plus a bridge from statutory PAT to any ratings-package or adjusted
      EBITDA presentation.
    relatedQuestionRefs:
      - QI014
      - QI025
  - type: private-evidence-only
    severity: material
    topic: debt-maturity
    missingEvidence: Debt schedule by lender, currency, maturity, collateral, and covenant package.
    whyItMatters: Refinancing risk is already a public concern and could dominate IPO proceeds usage.
    diligencePath: Obtain loan agreements and treasury materials from management.
    relatedQuestionRefs:
      - QI021
      - QI024
  - type: missing-source
    severity: minor
    topic: segment-margins
    missingEvidence: Category-level gross margin and working-capital days by business line.
    whyItMatters: Topline growth alone does not reveal whether the model is getting structurally better or worse.
    diligencePath: Request segment P&L by structural, finishing, lifestyle, and allied services.
    relatedQuestionRefs:
      - QI023
  - type: missing-source
    severity: material
    topic: technology-kpis
    missingEvidence: Quantified KPIs for forecast accuracy, on-time delivery, returns, defect rates, and plant utilization.
    whyItMatters: >-
      Operational technology is central to the thesis, but public sources provide process descriptions without
      performance statistics.
    diligencePath: Request monthly SLA dashboards, OTIF performance, and quality-claim trends by category.
    relatedQuestionRefs:
      - QE023
      - QE025
  - type: private-evidence-only
    severity: minor
    topic: product-roadmap
    missingEvidence: Formal roadmap for future categories, developer tools, or platform modules.
    whyItMatters: It is unclear which adjacencies are strategic priorities versus opportunistic sprawl.
    diligencePath: Ask management for a 24-month roadmap and investment plan by category.
    relatedQuestionRefs:
      - QE024
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Top-customer concentration, segment-level DSO, and renewal or repeat-order statistics.
    whyItMatters: Customer quality depends on both account stickiness and collection quality.
    diligencePath: Request top-20 customer concentration, receivable aging by segment, and repeat-order data from management.
    relatedQuestionRefs:
      - QU023
      - QU025
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: minor
    topic: unit-economics-by-channel
    missingEvidence: Contribution margin and working-capital profile for B2B direct accounts versus B2R channel sales.
    whyItMatters: The channel mix may carry very different economics despite similar revenue optics.
    diligencePath: Review channel P&L and DSO / inventory turns by channel.
    relatedQuestionRefs:
      - QU024
  - type: missing-source
    severity: material
    topic: debt-terms
    missingEvidence: Current debt schedule, covenant terms, and refinancing plan.
    whyItMatters: The largest visible public risk is leverage and rollover dependence.
    diligencePath: Obtain lender presentations, debt agreements, and board materials on treasury strategy.
    relatedQuestionRefs:
      - QR023
      - QR025
      - QR030
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: sla-data
    missingEvidence: Category-level OTIF, defect-rate, and return metrics.
    whyItMatters: Execution risk is central to the moat and cannot be judged from marketing language alone.
    diligencePath: Review internal operations dashboards and claims data.
    relatedQuestionRefs:
      - QR024
  - type: missing-source
    severity: material
    topic: audited-earnings
    missingEvidence: Audited FY25 earnings package with PAT, EBITDA, CFO, and segment reconciliation.
    whyItMatters: Valuation confidence remains limited without a clean earnings base.
    diligencePath: Wait for or request audited statements and management adjustments schedule.
    relatedQuestionRefs:
      - QV023
      - QV025
      - QV030
    relatedTableRefs:
      - TV004
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Debt terms, preference stack, and final IPO use-of-proceeds framework.
