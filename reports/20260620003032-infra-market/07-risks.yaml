- id: operating-and-market-risk
  title: Operating, Commodity, and Customer Risk
  body: 'Infra.Market’s operating model exposes it to a broad set of real-economy risks. Construction-cost guides show continued labour and metals pressure, while Tata nexarc’s 2026 analysis reminds investors that project cash cycles are slow even when demand is strong. Those conditions matter because Infra.Market is not only a catalog seller; it is also a logistics, quality, and working-capital manager. Payment delays, commodity spikes, or execution failures can therefore hit both growth and cash conversion at once. Public category breadth also introduces quality and service-complexity risk: a failure in one category can damage trust across the full project relationship. This is the tradeoff embedded in the company’s strategy. Physical execution density creates moat, but it also means the downside is more operationally contagious than it would be in a lighter marketplace model.'
  claimRefs:
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
  tableRefs:
  - TR002
  - TR003
  figureRefs:
  - FR002
- id: competition-and-policy-risk
  title: Competition, Policy, and Reputation Risk
  body: Competition and policy risk sit behind the operating story. OfBusiness, Moglix, and Zetwerk each pressure Infra.Market from a different direction, while public-sector and housing demand still depend in part on policy continuity and macro confidence. The company also carries historical reputational baggage from tax-raid coverage in 2022, which may or may not be economically material today but remains part of the public narrative. Market reports support long-term construction demand, yet they do not protect Infra.Market from a cyclical slowdown or a capex pause. If macro conditions soften while debt remains elevated, the company could face a compressed IPO window with weaker negotiating leverage. This makes risk assessment less about one catastrophic issue and more about how leverage, working capital, competition, and narrative quality could transmit into one another.
  claimRefs:
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  tableRefs:
  - TR004
  figureRefs: []
- id: mitigation-and-kill-criteria
  title: Mitigation and Kill Criteria
  body: 'Infra.Market is not uninvestable because of these risks, but the company does need clear mitigation evidence. The highest-priority asks are simple: audited FY25 statements, a debt-maturity and covenant schedule, proof that receivables are stabilizing, and evidence that the company can keep category breadth without losing service quality. The competitive side also needs proof that margin and cash conversion can hold even if rivals with stronger credit products or lighter models pressure pricing. Investors should therefore set explicit kill criteria rather than treating risk as a generic discount rate input. If refinancing remains dependent on rolling debt, if PAT and cash-flow disclosures remain inconsistent, or if a future filing shows concentrated customer exposure without margin protection, the thesis should tighten quickly. The risk committee should also track whether external ratings, confidential-filing market conditions, and cost-inflation commentary are stabilizing or worsening
    through the IPO window. Those indicators are not perfect, but they are useful early-warning signals. A disciplined investor should therefore watch external rating actions, inflation-sensitive cost commentary, and the shape of the eventual public filing as a combined dashboard rather than as isolated headlines. Together these indicators can show whether risk is compounding or being absorbed before listing. That monitoring discipline should be non-negotiable for any investor.'
  claimRefs:
