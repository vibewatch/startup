chapter:
  number: 7
  title: Risks
  summary: 'Infra.Market’s biggest risks are interconnected: debt and refinancing pressure, long construction-sector cash cycles, cost inflation, category-sprawl execution burden, and an IPO process that still lacks final public disclosure. None of these risks is fatal in isolation, but together they can transmit into valuation, timing, and narrative credibility if the company does not show cleaner cash conversion and disclosure quality.'
sections:
- id: balance-sheet-and-ipo-risk
  title: Balance Sheet and IPO Execution Risk
  body: 'The most immediate risk heading into any public listing is financial, not demand-side. Ratings-linked reporting already put leverage, refinancing dependence, and negative operating cash flow into the public domain. Later debt financing and a Morning Context critique reinforce the concern that Infra.Market’s balance sheet may have been stretched to preserve growth and IPO optionality. On top of that sits process risk: India’s confidential pre-filing route gives flexibility, but it also means external investors still do not have the final public document set needed to reconcile valuation, debt, and governance. The practical result is that IPO execution risk is two-layered. First, the company must clear its own debt and disclosure issues. Second, it must do so while market conditions still support a sizeable issue from a capital-intensive B2B platform rather than from an asset-light software or fintech story.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
