- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Area
  - Required mitigation
  - Kill trigger
  rows:
  - - Debt and liquidity
    - Audited debt ladder plus credible deleveraging path
    - Refinancing still depends on rolling short-dated debt
  - - Profitability quality
    - PAT / EBITDA / CFO reconciliation
    - Filing shows weaker earnings quality than public bull case
  - - Customer working capital
    - Receivables aging and collection improvement
    - Top accounts prove materially cash-destructive
  - - Operational execution
    - OTIF and defect-rate evidence by category
    - Growth masks deteriorating service quality
  - - IPO process
    - Clearer use-of-proceeds and pricing discipline
    - Listing window narrows while leverage remains elevated
  notes: Kill criteria are deliberately practical so the chapter can feed an investment committee rather than just a narrative memo.
