  - FU002
  - FU003
- id: retention-expansion-and-risk
  title: Retention, Expansion, and Customer Risk
  body: 'The strongest argument for customer retention is embedded in the company’s category logic. If Infra.Market wins early structural supply on a project and performs well on OTIF, quality, and pricing, it can expand into later-stage categories without paying new acquisition cost for every product line. That is a meaningful retention and expansion engine even without public SaaS-style NRR disclosure. But the model has equally visible risk. Construction payment cycles are long, verification-heavy, and often retention-based, which pushes timing risk down the chain to suppliers. Tata nexarc’s 2026 EPC payment-cycle analysis provides a relevant industry lens: cash can remain stuck for 45 to 90 days or more, and retention or approval friction can meaningfully strain liquidity even on profitable contracts. For Infra.Market, that means customer growth cannot be evaluated independently from receivable quality and credit discipline. The same enterprise customers that create scale can also create
    working-capital pressure if payment behavior weakens.'
  claimRefs:
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  tableRefs:
  - TU004
  - TU005
  figureRefs: []
- id: customer-judgment
  title: Customer Judgment
  body: Infra.Market appears to have a real and diversified customer presence across enterprise and channel segments, with credible evidence of project-scale adoption and brand-led retail extension. The main positive is that customer acquisition seems tied to a practical project need — consolidated sourcing and reliable delivery — rather than to novelty. The main negative is that the public record does not disclose concentration, repeat-purchase cohorts, or category penetration by customer type, so outside investors cannot yet tell whether the largest logos are profitable anchors or working-capital traps. Until a public filing or a management data room resolves that ambiguity, the right judgment is that customer demand is clearly real, customer expansion logic is plausible, but customer quality is still only partially observable from public evidence. The next level of proof has to come from customer economics, not just customer logos. A public filing or data room should clarify which segments
    repeat most often, which ones pay most slowly, and whether cross-category expansion actually increases margin quality.
  claimRefs:
  - CU028
  - CU029
  - CU030
  - CU031
  - CU032
  - CU033
  - CU034
  - CU035
  - CU036
