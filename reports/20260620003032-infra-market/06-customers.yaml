company:
  name: Infra.Market
chapter:
  number: 6
  title: Customers
  summary: Infra.Market has credible customer traction across enterprise and channel segments, with public evidence of more than 7,000 projects, 10,000-plus daily deliveries, and named institutional buyers such as Tata Projects, L&T, and Vedanta. The customer thesis is attractive because it is rooted in project-stage wallet-share expansion, but the quality of that demand remains only partly observable until investors see concentration, repeat-order, and receivable-aging data.
sections:
- id: customer-segments-and-routes
  title: Customer Segments and Routes to Market
  body: 'Infra.Market’s customer base is best understood as a layered set of enterprise and channel relationships rather than a single buyer persona. Official materials identify contractors, developers, retailers, infrastructure players, industrial customers, dealers, sub-dealers, and distributors across the B2B and B2R mix. Public management commentary adds a useful revenue lens: infrastructure and industrial clients make up the largest visible share, followed by commercial and residential projects, with dealers contributing a meaningful third bucket. The strategic value of that mix is diversification across project types and ticket sizes. Large project accounts drive volume and credibility, while the dealer network expands reach into smaller projects and replacement demand. For diligence, the important nuance is that these customer groups behave differently on payment terms, service expectations, and product breadth. Infra.Market’s operating model has to satisfy both direct project execution
    and channel ROI, which makes customer quality a function of service design as much as headline customer count.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: proof-points-and-adoption
  title: Customer Proof Points and Adoption Signals
  body: Public customer proof is better on categories and project scale than on named account economics. BusinessWorld and Foundamental cite more than 7,000 projects, 10,000-plus daily deliveries, and a category strategy that starts with concrete before broadening across the same project. Earlier Inc42 debt coverage named customers such as Tata Projects, Larsen & Toubro, and Vedanta, which is useful because it shows the company has sold into large, credibility-rich counterparties. At the same time, the public record stops short of customer-concentration disclosure, renewal rates, or contract-value durability. The result is enough evidence to believe that Infra.Market has real enterprise demand and channel adoption, but not enough to cleanly separate flagship logos from a long-tail account base or to quantify how sticky the biggest relationships are. Customer quality is therefore credible but not yet filing-grade transparent.
  claimRefs:
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
