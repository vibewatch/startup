  - TV002
  figureRefs:
  - FV001
- id: comparable-framework
  title: Comparable Company Framework
  body: Comparable analysis is useful but imperfect because Infra.Market sits between several public and private archetypes. OfBusiness is the most obvious size-and-model comp on the private side, though its stronger financing engine may justify a premium. Moglix is smaller by revenue but still valued in a similar multi-billion-dollar band, showing how investors value organized procurement platforms even when margins are thin. Zetwerk adds a manufacturing-heavy comparator that is useful for scale and IPO framing but less exact on category mix. IndiaMART is helpful for public-market discipline because it demonstrates what a much lighter B2B commerce model can look like in valuation terms. BuildSupply is too small to drive valuation directly, but its existence reminds investors that not all construction procurement stories deserve scale-platform multiples. The implication is that Infra.Market should trade on a blended comp set, with heavier weight on private B2B procurement and lighter weight
    on public listing models.
  claimRefs:
  - CV010
  - CV011
  - CV012
  - CV013
  - CV014
  - CV015
  - CV016
  - CV017
  - CV018
  tableRefs:
