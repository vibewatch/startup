  - TV004
  - TV007
  figureRefs:
  - FV002
- id: bull-base-bear
  title: Bull, Base, and Bear Cases
  body: 'The bull case is straightforward: Infra.Market has already reached more than $2 billion of annual revenue, remains publicly profitable under the RoC-based view, and owns a differentiated category-and-execution moat in a structurally attractive market. If public investors focus on scale, category breadth, and the possibility of deleveraging through IPO proceeds, a valuation near the latest private mark can be defended. The base case is more balanced: the company deserves respect for scale but should trade with caution because margins are thinner than revenue implies and disclosure is still incomplete. The bear case rests on leverage, cash conversion, and narrative quality. If investors decide that debt-funded growth, conflicting FY25 profitability figures, and a capital-intensive operating model deserve a discount to private pricing, the public market could clear below the $2.8 billion benchmark despite strong revenue. In short, the debate is not about whether Infra.Market is real;
    it is about whether it is worth a premium multiple before the balance sheet is fully de-risked.'
  claimRefs:
  - CV019
  - CV020
  - CV021
  - CV022
  - CV023
  - CV024
  - CV025
  - CV026
  - CV027
  tableRefs:
  - TV005
  figureRefs:
  - FV003
- id: valuation-judgment
  title: Valuation Judgment
  body: On the evidence currently available, “fair” is the cleanest valuation stance. Infra.Market has enough revenue scale and operational differentiation to justify a serious private-market benchmark, but not enough public disclosure quality to justify an aggressive premium to the last private round. The company is not a fragile early-stage story, yet it also should not be valued like an asset-light software or listings business. The right discipline is therefore to treat $2.8 billion as a ceiling that must be re-earned through cleaner cash conversion, debt transparency, and filing-grade earnings reconciliation. If those arrive, upside exists because the market backdrop is strong and the category position is meaningful. If they do not, the downside is not that the business disappears, but that it lists at a more cautious multiple and spends its first public years proving that scale can coexist with clean cash economics.
  claimRefs:
  - CV028
  - CV029
