company:
  name: Infra.Market
chapter:
  number: 8
  title: Valuation
  summary: Infra.Market’s latest clear private anchor is a $2.8 billion valuation, repeated across two 2025 pre-IPO rounds. That anchor is supported by real revenue scale and category breadth, but it is capped by debt, cash-conversion concerns, and conflicting public profit disclosures; the most defensible current stance is therefore fair, with medium confidence and a strong preference for disciplined price discovery once audited filing materials arrive.
sections:
- id: valuation-starting-point
  title: Valuation Starting Point
  body: 'The most defensible starting point for valuation is the company’s last clearly reported private pricing: the January 2025 pre-IPO round at a $2.8 billion valuation, later repeated in the September 2025 follow-on round. That flat valuation is informative. It suggests that investors were still willing to fund Infra.Market at scale, but not willing to re-rate it higher before public-market disclosure and debt clarity improved. Public IPO-size reporting ranges from roughly Rs 2,500 crore to Rs 5,000 crore, which is not itself a valuation statement but does show that the company is positioning for a substantial listing. The right use of the private mark is therefore as an anchor, not as proof that the public market will accept the same price. Investors need to ask whether FY25 scale, margins, and balance-sheet risk justify at least holding that private benchmark, or whether the debt and cash-flow narrative should pull the public valuation below it.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
  - CV009
  tableRefs:
