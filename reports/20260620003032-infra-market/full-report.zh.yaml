      - number: '1.4'
        title: 财务背景与负面信号
        blocks:
          - type: paragraph
            body: >-
              Infra.Market 的概览在收入规模上有吸引力，但资产负债表和负面历史问题没那么干净。基于 RoC 的 FY25 报道指向 Rs 18,472 crore 总收入和约 Rs 220 crore
              PAT，意味着公司仍盈利，但尽管规模继续扩大，利润率承压。与此同时，公开记录内部并不完全一致：一篇与评级挂钩的 Economic Times 报道提到更高的 FY25 EBITDA 和 PAT
              数字，还提到负经营现金流和规模不小的再融资义务。这种错位不会推翻核心命题，但意味着投资者应等最终公开发行文件出炉，再把任何一条 FY25
              利润线当作定论。负面历史也重要。早前所得税突袭和通融入账指控仍留在公开记录中，2026 年 IPO 前报道又强调债务累积和应收账款拉长的担忧。因此，公司进入 IPO
              尽调时，是一个大型、可信、运营上重要的平台，但还不是毫无摩擦、已达申报级别的故事。
