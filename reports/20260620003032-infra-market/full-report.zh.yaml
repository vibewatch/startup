        title: 收入模式与业务组合
        blocks:
          - type: paragraph
            body: >-
              Infra.Market 变现的是一个多品类实体商务模型，而不是单一抽佣市场。FY25
              报道显示四个大桶：结构产品仍是最大收入贡献方，其次是饰面产品、生活方式产品，以及设备、化学品和建筑关联活动等配套服务。这种组合重要，因为它说明公司不依赖某一个 SKU
              家族；但也意味着各分部的毛利率和营运资本特征很可能差异很大。公开管理层表述强化了一点：商业模式设计为先通过混凝土进入项目早期，再随着项目推进扩大支出份额。财务后果是，评估 Infra.Market
              的收入时，应把它看成打包项目收入，而不只是彼此独立的品类销售。不过，投资者仍缺少品类层面的毛利披露，无法判断后期品类是否比早期切入的结构产品具备结构性更好的经济画像。
