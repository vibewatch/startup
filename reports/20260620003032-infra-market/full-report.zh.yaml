    title: Infra.Market 公司快照逻辑
    type: flow
    layout: standard
    summary: 需求聚合、制造控制、品牌和分销如何在当前运营模型中接合。
    data:
      nodes:
        - label: 来自开发商、承包商和经销商的项目需求
