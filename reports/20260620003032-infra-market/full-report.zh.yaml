      - number: '8.3'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              牛市情景很直接：Infra.Market 年收入已经超过 $2 billion，按基于 RoC
              的口径仍公开盈利，并且在一个结构性有吸引力的市场里，拥有差异化的品类与执行护城河。若公开市场投资人看重规模、品类宽度，以及用 IPO
              募资降杠杆的可能性，接近最新私募估值的定价可以被辩护。基准情景更均衡：公司规模值得尊重，但利润率比收入暗示的更薄，披露仍不完整，定价应保持谨慎。熊市情景落在杠杆、现金转化和叙事质量上。若投资人认为债务驱动增长、FY25
              盈利数字冲突，以及重资产运营模式都应相对私募定价打折，即便收入强劲，公开市场也可能低于 $2.8 billion 基准成交。简言之，争论点不是 Infra.Market
              是否真实，而是在资产负债表完全去风险之前，它是否配得上溢价倍数。
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
