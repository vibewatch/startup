      - number: '1.3'
        title: 资本结构、融资历史与 IPO 路径
        blocks:
          - type: paragraph
            body: >-
              公开来源显示，Infra.Market 的估值阶梯清晰，资本结构也越来越复杂。公司从 2021 年 $20 million Series B，走到 $100 million 独角兽轮，再到 $125
              million、$2.5 billion 估值的一轮，随后在 2025 年 1 月以 $2.8 billion 估值完成 IPO 前融资。2025 年 9 月又有一轮约 Rs 730 crore 或 $83
              million 的私募跟投，估值持平，说明公司在公开发行定价前更重视流动性和 promoter 分类，而不是继续推高估值。债务也变得更重要：Entrackr 报道 Mars Growth Capital 提供了
              $150 million 融资安排，后续报道又提到进一步债务融资和杠杆更高的 IPO 前画像。公开报道一致认为 Infra.Market 已秘密提交 IPO，但目标规模从评级报道中的约 Rs 2,500
              crore，到递交报道中的 Rs 5,000 crore 不等，因此投资者应把公开 IPO 规模视为移动区间，而非定数。
