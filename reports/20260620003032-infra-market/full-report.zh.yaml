  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合与品类重叠
        blocks:
          - type: paragraph
            body: >-
              Infra.Market 所处领域拥挤但并不均匀。最直接的重叠来自触达建筑关联品类的采购平台，但竞争集合还包括更宽的 B2B 商务、制造市场和以信息列示为主的模式。OfBusiness
              是最直接的大规模对手，因为它把供应链执行、深度材料敞口和融资层叠在一起。Moglix 更多重叠在工业采购和 MRO；Zetwerk 则在建筑采购与制造、项目执行交汇处重叠。IndiaMART
              运营上不同，因为其公开市场模式更偏信息列示和线索生成，但它仍是估值和市场进入的参照。BuildSupply
              规模小得多，也更原生于工作流，因此更适合作为小众产品参照，而不是规模同行。结果是，Infra.Market 的独特主张并非没有对手，而是把品类宽度、制造控制和直达工地的项目排序整合进一个平台。
            claimRefs:
