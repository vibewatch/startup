      - number: '2.4'
        title: 约束、成本通胀与尽调边界
        blocks:
          - type: paragraph
            body: >-
              市场有吸引力，但绝不顺滑。建材采购受制于付款周期长、工地执行不均、商品价格波动和劳动力成本通胀。CNBC-TV18
              和其他成本指南持续显示，金属、劳动力和其他投入品类会推高建筑成本，这既影响需求时点，也影响供应商利润率。即便项目管线健康，买家关心 OTIF
              交付、质量控制和营运资本纪律，并不亚于报价聚合。这让该市场在结构上比软件式 B2B 商务更难做。由此带来的尽调含义很重要：除非运营者能反复证明自己把复杂性转化为可防守的利润率和现金生成能力，否则巨大的头部 TAM
              不能自动支撑高倍数。Infra.Market
              的市场背景因此有吸引力，但投资者仍需要公司层面的执行证据，才能把背景转化为估值结论。最后一个市场提醒是，自上而下的行业报告常常把公共基础设施支出、私人房地产开发和材料采购混在一起。尽调中的实际问题不是印度有没有庞大的建筑经济——显然有——而是其中有多少支出能被
              Infra.Market 已经搭起运营密度的组织化、多品类供应商服务。做估值时这个区别很关键，因为为 Infra.Market 这类公司创造可防守经济性的，是组织化执行，而不是头部宏观支出。
