              报表、债务到期和契约时间表、应收账款正在稳定的证明，以及公司能在不丢服务质量的前提下维持品类宽度的证据。竞争侧也需要证明，即便拥有更强信贷产品或更轻模式的对手压低价格，利润率和现金转换仍能守住。因此，投资者应设定明确否决标准，而不是把风险当成通用折现率输入。如果再融资仍依赖滚动债务，如果
              PAT 和现金流披露仍不一致，或者未来申报文件显示客户敞口集中且缺少利润率保护，投资命题就应迅速收紧。风险委员会还应跟踪外部评级、秘密申报窗口的市场条件和成本通胀评论，在 IPO
              窗口内是在稳定还是恶化。这些指标并不完美，但能作为有用的早期预警信号。有纪律的投资者应把外部评级行动、受通胀影响的成本评论和最终公开申报文件形态放在一个组合仪表盘里看，而不是当成彼此孤立的标题。合在一起，这些指标能显示风险是在复合，还是在上市前被吸收。这种监控纪律应是任何投资者的底线要求。
