            body: >-
              今天最可信的财务判断是：Infra.Market 是一家已有规模、仍盈利的公司，公开数字足以支撑 IPO 准备，但若没有管理层材料，还不足以支撑申报级承销案例。正面因素真实存在：强劲收入增长、品类宽度、RoC
              口径下 PAT 为正，以及反复获得资本。负面因素同样真实：利润压缩、财务和运费成本上升、债务驱动的 IPO 前定位、公众对 FY25 PAT
              存在分歧，以及外部报道点名经营现金流为负和再融资需求。这意味着公司应被视为基本可融资，但尚未充分去风险。更高层次的确信需要经审计 FY25 合并报表、债务到期梯形图、渠道和品类毛利拆分，以及法定利润、调整后
              EBITDA 和市场上流传的任何评级材料数字之间的对账。这种不确定性在尽调中可管理，但前提是投资者把下一组文件当成对账练习，而不是营销更新。强规模与真实财务摩擦并存，是核心事实形态。
