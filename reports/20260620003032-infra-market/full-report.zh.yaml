              可比分析有用，但不能机械套用：Infra.Market 夹在几个上市与未上市样本之间。未上市公司里，OfBusiness 是规模和模式最直接的可比对象，不过它的融资引擎更强，可能支撑更高溢价。Moglix
              收入更小，但估值仍在相近的数十亿美元区间，说明即便利润率偏薄，投资人也愿意给有组织的采购平台定价。Zetwerk 提供了一个偏制造业的参照，适合判断规模和 IPO 叙事，但品类结构没那么贴近。IndiaMART
              有助于校准公开市场纪律，因为它展示了轻得多的 B2B 商业模式在估值上会是什么样子。BuildSupply
              规模太小，不能直接牵引估值，但它提醒投资人，并非所有建筑采购故事都配得上规模平台倍数。结论是，Infra.Market 应该用混合可比组定价，权重更多放在未上市 B2B 采购平台，较少放在公开上市模型。
