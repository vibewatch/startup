        blocks:
          - type: paragraph
            body: >-
              走向任何公开上市时，最直接的风险不是需求侧，而是财务。与评级挂钩的报道已经把杠杆、再融资依赖和负经营现金流放进公共领域。后续债务融资和 Morning Context
              的批评进一步强化了一个担忧：Infra.Market 的资产负债表可能已被拉伸，以保住增长和 IPO
              选择权。在这之上还有流程风险：印度的秘密预提交路径提供灵活性，但也意味着外部投资者还拿不到最终公开文件组，无法对账估值、债务和治理。实际结果是，IPO
              执行风险有两层。第一，公司必须清理自身债务和披露问题。第二，它还必须在市场条件仍能支持一个资本密集型 B2B 平台大规模发行时完成，而不是面对一个更偏好资产轻软件或金融科技故事的窗口。
