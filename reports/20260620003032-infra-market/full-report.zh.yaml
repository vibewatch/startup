      - number: '5.4'
        title: 产品技术判断
        blocks:
          - type: paragraph
            body: >-
              整体看，Infra.Market
              的产品技术栈比「市场」这个标签更强。证据支持一套真实的实体商务操作系统：在关键处控制制造，在失败成本高的环节建立质量流程，用项目和物流跟踪保证执行，并通过足够的品牌开发，在公司嵌入后提高切换摩擦。主要限制是，这仍是一条运营护城河，不是拥有明显网络效应或高利润率许可经济的软件护城河。因此，产品故事支持正面的尽调判断，但重要限定是，每增加一个新类别，都会增加执行复杂度。投资者应把产品边缘看成累积运营经验和受控供应，而不是一个可以轻松扩张的单一专有平台。关键尽调要求不是公司有没有技术——显然有——而是这些系统是否可衡量地改善
              OTIF、退货率、缺陷率和工厂利用率。公开来源方向上强，数量上薄。这个框架应让投资者聚焦执行证据、服务质量和运营学习曲线，而不是期待产品栈带来软件式利润率扩张。公开市场投资者还应追问，这些系统是否足够可迁移、可衡量、有纪律，能在不压垮运营团队的情况下扩张。
