      - number: '3.4'
        title: 竞争结论
        blocks:
          - type: paragraph
            body: >-
              最清晰的竞争框架是：Infra.Market 既不是纯市场，也不是纯制造商。它在不同维度上与每个对手竞争：相对 OfBusiness 是融资深度，相对 Moglix 是工业宽度，相对 Zetwerk
              是执行规模，相对 IndiaMART 是发现经济性，相对 BuildSupply 是工作流工具。这意味着公司不必在每个指标上击败所有同行，才能创造价值。它需要主导一个具体
              job-to-be-done：成为真实项目中有组织、可信、多品类的供应商，把采购、质量和交付一起解决。投资者因此应少用理论功能清单来对标
              Infra.Market，多看它的品类组合和运营密度是否能重复带来钱包份额提升。如果利润率、现金转换和客户留存恶化，更宽的同行集合会同时给买家和资本市场提供大量替代选择。保持纪律的另一个原因是，几家同行可能在相近窗口冲刺公开市场。若如此，投资者比较现金转换、债务容忍度和品类经济性时，会比比较叙事本身更苛刻。
