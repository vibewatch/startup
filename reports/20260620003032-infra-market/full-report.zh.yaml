    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、规模与运营模式
        blocks:
          - type: paragraph
            body: >-
              进入尽调时，Infra.Market
              已不是一个狭义采购市场，而是一个具备规模、由技术支撑的建材平台。公司官方材料称，平台服务完整施工生命周期，覆盖结构产品、饰面产品、生活方式产品和配套服务。公司表示，自己已搭起全国性实体骨架：22 个邦的
              283-plus 制造设施、B2B 和 B2R 双渠道市场路径，以及 17,256 个零售触点。管理层访谈解释，早期聚合模式让公司暴露在履约和质量缺口中，之后 Infra.Market
              转向后向整合和受控制造。这段运营演进很关键，因为它框定了核心投资命题：Infra.Market 想在每个项目里拿到更多钱包份额，靠的是掌控质量、交付、品牌和交叉销售，而不只是撮合买方需求与第三方卖家。
