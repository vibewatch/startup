        title: 买家、细分市场与采用路径
        blocks:
          - type: paragraph
            body: >-
              公司的买家地图比简单的承包商—供应商市场更分层。公开材料显示，开发商、基础设施 EPC 公司、工业客户和承包商构成直接企业 B2B 渠道，经销商、次级经销商和其他零售触点构成 B2R
              渠道。管理层表述一致认为，采用楔子从项目生命周期早期的混凝土和结构品类开始，随着施工推进，再扩展到墙体、管道、瓷砖、涂料、家电和室内产品。这一点重要，因为经济故事靠的不是某个品类赢得绝对市场份额，而是
              Infra.Market 一旦进入项目后持续提高钱包份额。换句话说，市场结构奖励的是能协调多次采购节点、保证质量、缩短客户物流负担的供应商。
