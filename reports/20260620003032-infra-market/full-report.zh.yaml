      - number: '3.2'
        title: 同行规模、收入与估值
        blocks:
          - type: paragraph
            body: >-
              公开收入数据显示，Infra.Market 属于印度已有规模的 B2B 采购梯队，而不是创业公司小众赛道。FY25 约 Rs 18,472 crore 的收入让它低于 OfBusiness，但高于 Moglix
              和 Zetwerk 近期 FY25 收入，也远高于 BuildSupply 披露的小得多的规模。OfBusiness 似乎拿到该梯队最高的私人估值，背后是更宽的品类覆盖和更嵌入的融资层。Moglix
              收入更小，但仍处在同一个宽泛的数十亿美元估值带，说明市场有时会奖励资产更轻的工业采购模式。Zetwerk 让图景更复杂，因为它制造属性更重，收入路径也更嘈杂，但它仍是规模和 IPO
              雄心的有效基准。IndiaMART 作为运营模式更轻的上市公司，则提醒投资者：并非所有 B2B 商务收入都应按同一个倍数定价。
