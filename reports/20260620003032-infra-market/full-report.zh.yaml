      - number: '3.3'
        title: 能力宽度与护城河比较
        blocks:
          - type: paragraph
            body: >-
              Infra.Market 最强的竞争差异点，是把采购与受控制造、品牌矩阵开发和项目阶段交叉销售组合起来。这不同于 OfBusiness 的强信贷驱动运营模式，也不同于更偏工业和 MRO 的
              Moglix，更不同于靠轻市场架构扩张的 IndiaMART。Zetwerk 的护城河是制造编排和生产执行，而不是建材钱包份额。实际含义是：当客户重视 OTIF
              交付、品类打包和质量控制，超过单一品类最低单项报价时，Infra.Market 会赢。反面是，如果资本强度、营运资本需求或品类蔓延开始稀释管理层聚焦，这条护城河会更难守。竞争耐久度因此取决于
              Infra.Market 能否持续把混凝土驱动的入口转化成多品类收入，同时不让杠杆和服务复杂度压垮模型。
