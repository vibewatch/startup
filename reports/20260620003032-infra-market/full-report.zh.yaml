      - number: '2.3'
        title: 增长驱动因素
        blocks:
          - type: paragraph
            body: >-
              市场案例的支撑面很直接。PMAY-Urban 等公共住房政策、持续的基础设施雄心，以及印度相对强劲的宏观前景，都为核心建材创造结构性需求。IBEF、World Bank 和 IMF
              的框架都指向一个庞大且仍在扩张的建成环境经济，World Steel 数据也支持印度已经在大规模消耗材料。Colliers 和 Cushman
              等专业服务机构的展望强化了这一点：开发商和机构资本仍在关注商业和住宅建设，而不只是公共工程。这种组合对 Infra.Market
              重要，因为需求分散在公共基础设施、私人房地产、工业和零售翻新之间。因此，公司押注的不是单一狭窄政策交易，而是与一组广泛的资本开支和城市化潮流同向，这些潮流在未来十年仍应有用。
