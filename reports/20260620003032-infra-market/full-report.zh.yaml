      - number: '8.4'
        title: 估值判断
        blocks:
          - type: paragraph
            body: >-
              基于目前证据，「公允」是最干净的估值立场。Infra.Market
              的收入规模和运营差异化足以支撑一个严肃的私募市场基准，但公开披露质量还不足以支撑相对上一轮私募估值的激进溢价。公司不是脆弱的早期故事，但也不该按轻资产软件或信息撮合业务估值。因此，正确纪律是把 $2.8
              billion
              视为上限；公司必须靠更干净的现金转化、更透明的债务，以及达到申报级别的盈利调节来重新挣回这个上限。若这些条件兑现，市场背景强、品类位置有意义，上行空间存在。若没有兑现，下行并不是业务消失，而是公司以更谨慎的倍数上市，并在上市后最初几年证明：规模可以与干净的现金经济性并存。
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
