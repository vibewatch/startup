  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算视角
        blocks:
          - type: paragraph
            body: >-
              Infra.Market
              的市场不应被定义成印度全部建筑支出。真正的竞技场，是材料和关联产品在项目中流动的采购与分销层，从早期结构施工一直到饰面和零售驱动的翻新。这个区别很重要，因为第三方市场研究会给印度建筑、基础设施和房地产发布很大的数字，但分母并不相同。IBEF
              的房地产框架、基础设施政策摘要，以及 Mordor、GlobalData、IMARC、NextMSC 的分析报告，都支持机会很大这个判断，但都不应被当作 Infra.Market 精确的一行
              TAM。更有决策价值的看法是：Infra.Market 面向一个庞大、组织化不足、运营复杂的采购市场；其品类足够宽，能支撑数十亿美元收入，但若要估出可用于申报的 SOM，仍需按品类、渠道和地理做细致自下而上工作。
