companyProfile:
  summary: >-
    Infra.Market 是一家总部位于 Thane/Mumbai 的建材平台，2016 年成立。公司从需求聚合型创业公司，长成垂直整合、多品牌的 B2B 和 B2R 供应商。其公开足迹包括遍布 22 个邦的 283-plus
    制造设施、17,256 个零售触点，品类覆盖混凝土、钢材、瓷砖、涂料、管道、家电和家装服务。公开财务报道显示，公司收入规模强、仍保持盈利，但杠杆上升、评级承压，且 FY25 利润披露在秘密提交 IPO 前仍未完全对齐。
