              砌块、木板和管道开始，再延伸到瓷砖、卫浴、涂料、家电和室内产品。支撑这个范围的架构，是自有设施、独家第三方工厂、收购品牌，以及用于需求规划、物流和项目跟踪的内部运营系统的混合体。公司的品类栈有战略意义，因为它让
