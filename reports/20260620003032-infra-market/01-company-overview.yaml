- id: financial-and-adverse-context
  title: Financial Context and Adverse Signals
  body: 'Infra.Market’s overview is attractive on topline scale but less clean on balance-sheet and adverse-history questions. RoC-based FY25 reporting points to Rs 18,472 crore of gross revenue and about Rs 220 crore of PAT, implying the company remains profitable but with margin pressure despite continued scale. At the same time, the public record is not fully internally consistent: a ratings-linked Economic Times report referenced higher FY25 EBITDA and PAT figures, plus negative operating cash flow and sizeable refinancing obligations. That mismatch does not negate the core thesis, but it does mean investors should wait for the eventual public offer documents before treating any one FY25 profit line as definitive. Adverse history also matters. An earlier income-tax raid and accommodation-entry allegations remain visible in the public record, and pre-IPO reporting in 2026 highlighted concern about debt build-up and stretched receivables. The company therefore enters IPO diligence as a
    large, credible, and operationally important platform, but not yet a frictionless filing-grade story.'
  claimRefs:
