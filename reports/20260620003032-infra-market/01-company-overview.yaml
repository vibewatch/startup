- id: founders-brands-footprint
  title: Founders, Brands, and Distribution Footprint
  body: The public record is strongest on Infra.Market’s founders, brand architecture, and physical network, and weakest on formal governance detail before the public filing becomes available. Public news coverage consistently attributes the 2016 founding to Souvik Sengupta and Aaditya Sharda, while company and partner surfaces emphasise a “house of brands” strategy spanning RDC, Shalimar Paints, Inicio, IVAS, Ultrafine, Equiphunt, and other labels. That brand stack is strategically important because it shows Infra.Market is no longer only a construction-materials aggregator; it is also a brand owner and manufacturing coordinator across categories that enter different moments of the same project. Management commentary further supports a project-led cross-sell model, with thousands of projects, more than 10,000 daily deliveries, and a concrete-first land-and-expand motion designed to widen share of spend from each customer. What is still not public is the board structure, promoter economics
    after the 2025 capital raises, and the exact decision rights around newly acquired or controlled brands.
  claimRefs:
