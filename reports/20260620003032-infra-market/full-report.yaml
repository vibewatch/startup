            body: >-
              Financial diligence gets harder once debt enters the story. Infra.Market used repeated equity rounds to
              scale, then added large debt facilities as it approached IPO. Entrackr reported a $150 million Mars Growth
              Capital facility in 2025, while later ET coverage referenced additional debt funding and a ratings package
              that highlighted refinancing dependence. According to that ET report, India Ratings downgraded Hella Infra
              Market to BBB+/Negative, flagged roughly Rs 1,600 crore of FY26 repayment obligations, and pointed to
              stretched receivables and negative operating cash flow. Publicly, the company argued that the agency had
              underweighted improving financials, equity infusions, and upcoming liquidity events. Investors can fairly
              read this in two ways: the bull case says debt was an efficient bridge to IPO; the bear case says leverage
              has started to outrun the public company narrative. Without audited filing statements and debt schedules,
