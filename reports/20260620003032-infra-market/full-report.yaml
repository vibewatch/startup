            body: >-
              The public record is strongest on Infra.Market’s founders, brand architecture, and physical network, and
              weakest on formal governance detail before the public filing becomes available. Public news coverage
              consistently attributes the 2016 founding to Souvik Sengupta and Aaditya Sharda, while company and partner
              surfaces emphasise a “house of brands” strategy spanning RDC, Shalimar Paints, Inicio, IVAS, Ultrafine,
              Equiphunt, and other labels. That brand stack is strategically important because it shows Infra.Market is
