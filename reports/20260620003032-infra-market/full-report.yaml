  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Business Mix
        blocks:
          - type: paragraph
            body: >-
              Infra.Market monetizes a multi-category physical-commerce model rather than a single take-rate
              marketplace. FY25 reporting shows four broad buckets: structural products remained the largest revenue
              contributor, followed by finishing products, lifestyle products, and allied services such as equipment,
              chemicals, and construction-linked activity. That mix matters because it demonstrates that the company is
              not dependent on one SKU family, but it also means gross margin and working-capital characteristics likely
              differ meaningfully across segments. Public management commentary reinforces that the business model is
              designed to enter a project early through concrete and then widen share of spend as the project
              progresses. The financial consequence is that Infra.Market’s topline should be evaluated as bundled
              project revenue, not just as independent category sales. Investors, however, still lack the category-level
              gross-margin disclosure that would show whether later-stage categories deliver a structurally better
              economic profile than early-entry structural products.
