  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Infra.Market’s market should not be defined as all Indian construction spend. The relevant arena is the
              procurement and distribution layer for materials and related products that move through a project from
              early structural work to finishing and retail-led refurbishment. That distinction matters because
              third-party market studies publish very large numbers for Indian construction, infrastructure, and real
              estate, but they use different denominators. IBEF’s real-estate framing, infrastructure policy summaries,
              and analyst reports from Mordor, GlobalData, IMARC, and NextMSC all support a very large opportunity, yet
              none should be treated as a precise one-line TAM for Infra.Market. A more decision-useful view is that
              Infra.Market addresses a large, under-organized, operationally complex procurement market whose categories
              are broad enough to sustain multi-billion-dollar revenue, while still requiring careful bottom-up work to
              estimate a filing-grade SOM by category, channel, and geography.
