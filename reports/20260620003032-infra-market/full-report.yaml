  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Balance Sheet and IPO Execution Risk
        blocks:
          - type: paragraph
            body: >-
              The most immediate risk heading into any public listing is financial, not demand-side. Ratings-linked
              reporting already put leverage, refinancing dependence, and negative operating cash flow into the public
              domain. Later debt financing and a Morning Context critique reinforce the concern that Infra.Market’s
              balance sheet may have been stretched to preserve growth and IPO optionality. On top of that sits process
              risk: India’s confidential pre-filing route gives flexibility, but it also means external investors still
              do not have the final public document set needed to reconcile valuation, debt, and governance. The
              practical result is that IPO execution risk is two-layered. First, the company must clear its own debt and
              disclosure issues. Second, it must do so while market conditions still support a sizeable issue from a
              capital-intensive B2B platform rather than from an asset-light software or fintech story.
