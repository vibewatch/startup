      - number: '7.4'
        title: Mitigation and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Infra.Market is not uninvestable because of these risks, but the company does need clear mitigation
              evidence. The highest-priority asks are simple: audited FY25 statements, a debt-maturity and covenant
              schedule, proof that receivables are stabilizing, and evidence that the company can keep category breadth
              without losing service quality. The competitive side also needs proof that margin and cash conversion can
              hold even if rivals with stronger credit products or lighter models pressure pricing. Investors should
              therefore set explicit kill criteria rather than treating risk as a generic discount rate input. If
              refinancing remains dependent on rolling debt, if PAT and cash-flow disclosures remain inconsistent, or if
              a future filing shows concentrated customer exposure without margin protection, the thesis should tighten
              quickly. The risk committee should also track whether external ratings, confidential-filing market
              conditions, and cost-inflation commentary are stabilizing or worsening through the IPO window. Those
              indicators are not perfect, but they are useful early-warning signals. A disciplined investor should
              therefore watch external rating actions, inflation-sensitive cost commentary, and the shape of the
              eventual public filing as a combined dashboard rather than as isolated headlines. Together these
              indicators can show whether risk is compounding or being absorbed before listing. That monitoring
              discipline should be non-negotiable for any investor.
