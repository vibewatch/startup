      - number: '2.4'
        title: Constraints, Cost Inflation, and Diligence Limits
        blocks:
          - type: paragraph
            body: >-
              The market is attractive but far from frictionless. Construction-materials procurement is constrained by
              long payment cycles, uneven site execution, commodity volatility, and labour-cost inflation. CNBC-TV18 and
              other cost guides continue to show that metals, labour, and other input categories can push construction
              costs higher, which matters both for demand timing and for supplier margins. Even when project pipelines
              are healthy, buyers care about OTIF delivery, quality control, and working-capital discipline as much as
              they care about quote aggregation. That makes this market structurally more demanding than software-like
              B2B commerce. The resulting diligence implication is important: a large headline TAM does not
              automatically justify premium multiples unless the operator can repeatedly prove that it converts
              complexity into defensible margin and cash generation. Infra.Market’s market backdrop is therefore
              attractive, but investors still need company-level execution evidence to turn that backdrop into a
              valuation conclusion. A final market caution is that top-down industry reports often blur public
              infrastructure spending, private real-estate development, and materials procurement. For diligence, the
              practical question is not whether India has a large construction economy — it clearly does — but how much
              of that spend is addressable by organized, multi-category suppliers with the operational density
              Infra.Market has built. This distinction matters in valuation work because organized execution, not
              headline macro spend, is what creates defensible economics for a company like Infra.Market.
            claimRefs:
              - CM016
              - CM017
              - CM029
              - CM031
              - CM033
              - CM034
              - CM035
              - CM036
