      - number: '1.3'
        title: Capitalization, Funding History, and IPO Path
        blocks:
          - type: paragraph
            body: >-
              Public sources show a clear valuation ladder and an increasingly complicated capital structure. The
              company moved from a $20 million Series B in 2021 to a $100 million unicorn round, then to a $125 million
              round at a $2.5 billion valuation, and later to a January 2025 pre-IPO round at a $2.8 billion valuation.
              A follow-on September 2025 private round of roughly Rs 730 crore or $83 million occurred at the same
              valuation, implying that the company prioritised liquidity and promoter classification ahead of pricing
              the public issue rather than trying to push the valuation higher. Debt also became more material: Entrackr
              reported a $150 million Mars Growth Capital facility, while later reporting referenced further debt
              financing and a more leveraged pre-IPO profile. Public coverage agrees that Infra.Market confidentially
              filed for an IPO, but the targeted size ranges from roughly Rs 2,500 crore in ratings-linked coverage to
              Rs 5,000 crore in filing coverage, so investors should treat the public IPO size as a moving range rather
              than a settled figure.
