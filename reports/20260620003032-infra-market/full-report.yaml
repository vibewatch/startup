      - number: '4.4'
        title: Financial Judgment and Open Items
        blocks:
          - type: paragraph
            body: >-
              The most credible financial judgment today is that Infra.Market is a scaled, still-profitable business
              whose public numbers are good enough to support IPO preparation but not yet clean enough to support a
              filing-grade underwriting case without management materials. The positives are real: strong revenue
              growth, category breadth, positive PAT under the RoC-based view, and repeated access to capital. The
              negatives are equally real: profit compression, rising finance and freight cost, debt-fueled pre-IPO
              positioning, public disagreement over FY25 PAT, and external reporting that calls out negative cash flow
              from operations and refinancing needs. This means the company should be treated as fundamentally
              financeable but not yet de-risked. The next level of conviction requires audited consolidated FY25
              statements, a debt-maturity ladder, channel and category gross-margin splits, and a reconciliation between
              statutory profit, adjusted EBITDA, and any ratings-pack figures circulating in the market. That
              uncertainty is manageable in diligence, but only if investors treat the next document set as a
              reconciliation exercise rather than as a marketing update. The existence of both strong scale and real
              financial friction is the core fact pattern.
