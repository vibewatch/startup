  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Set and Category Overlap
        blocks:
          - type: paragraph
            body: >-
              Infra.Market competes in a crowded but uneven field. The closest direct overlap comes from procurement
              platforms that touch construction-linked categories, but the competitive set also includes broader B2B
              commerce, manufacturing-marketplace, and listing-led models. OfBusiness is the most direct large-scale
              rival because it combines supply-chain execution with deep materials exposure and a financing overlay.
              Moglix overlaps more in industrial procurement and MRO, while Zetwerk overlaps where construction
              procurement meets manufacturing and project execution. IndiaMART is operationally different because its
              public-market model is more listing- and lead-generation-centric, yet it still matters as a valuation and
              go-to-market comparator. BuildSupply is much smaller and more workflow-native, which makes it useful as a
              niche product comparator rather than a scale peer. The result is a competitive landscape where
              Infra.Market’s unique proposition is not that it has no rivals, but that it integrates category breadth,
              manufacturing control, and direct-to-site project sequencing in a single platform.
            claimRefs:
