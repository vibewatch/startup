      - number: '8.3'
        title: Bull, Base, and Bear Cases
        blocks:
          - type: paragraph
            body: >-
              The bull case is straightforward: Infra.Market has already reached more than $2 billion of annual revenue,
              remains publicly profitable under the RoC-based view, and owns a differentiated category-and-execution
              moat in a structurally attractive market. If public investors focus on scale, category breadth, and the
              possibility of deleveraging through IPO proceeds, a valuation near the latest private mark can be
              defended. The base case is more balanced: the company deserves respect for scale but should trade with
              caution because margins are thinner than revenue implies and disclosure is still incomplete. The bear case
              rests on leverage, cash conversion, and narrative quality. If investors decide that debt-funded growth,
              conflicting FY25 profitability figures, and a capital-intensive operating model deserve a discount to
              private pricing, the public market could clear below the $2.8 billion benchmark despite strong revenue. In
              short, the debate is not about whether Infra.Market is real; it is about whether it is worth a premium
              multiple before the balance sheet is fully de-risked.
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
