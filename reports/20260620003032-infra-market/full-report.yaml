      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Private marks should not be treated as public-market proof
            body: >-
              The flat $2.8B valuation is an anchor, not a guarantee, especially when debt and disclosure quality remain
              open questions.
            calloutType: risk
