  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Scale, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Infra.Market enters diligence as a scaled, technology-enabled building materials platform rather than a
              narrow procurement marketplace. Official company materials describe a platform that serves the full
              construction lifecycle across structural products, finishing products, lifestyle products, and allied
              services. The company says it has already built a national physical backbone of 283-plus manufacturing
              facilities across 22 states, a two-channel B2B and B2R route to market, and 17,256 retail touchpoints.
              Management interviews explain that the early aggregator model exposed the company to fulfillment and
              quality gaps, after which Infra.Market shifted toward backward integration and controlled manufacturing.
              That operating evolution matters because it frames the central investment thesis: Infra.Market is trying
              to capture more wallet share inside each project by owning quality, delivery, brand, and cross-sell rather
              than by merely matching buyer demand with third-party sellers.
