      - number: '2.3'
        title: Growth Drivers
        blocks:
          - type: paragraph
            body: >-
              The supportive side of the market case is straightforward. Public housing policy through PMAY-Urban,
              sustained infrastructure ambition, and India’s relatively strong macro outlook all create structural
              demand for core construction materials. IBEF, World Bank, and IMF framing all point to a large and
              still-expanding built-environment economy, while World Steel data supports the idea that India already
              consumes materials at scale. Professional-services outlooks from Colliers and Cushman reinforce that
              developers and institutional capital continue to monitor commercial and residential buildout, not merely
              public works. For Infra.Market, this mix matters because it distributes demand across public
              infrastructure, private real estate, industrials, and retail renovation. The company is therefore not
              underwriting a single narrow policy trade; it is aligning with a broad set of capital-expenditure and
              urbanisation currents that should remain relevant through the next decade.
