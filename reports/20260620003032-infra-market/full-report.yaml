companyProfile:
  summary: >-
    Infra.Market is a Thane/Mumbai-based construction materials platform founded in 2016 that has grown from a
    demand-aggregation startup into a vertically integrated, multi-brand B2B and B2R supplier. Its public footprint
    includes 283-plus manufacturing facilities across 22 states, 17,256 retail touchpoints, and category coverage
    ranging from concrete and steel to tiles, paints, plumbing, appliances, and home-improvement services. Public
    financial reporting shows strong revenue scale and continued profitability, but also rising leverage, ratings
    pressure, and unresolved differences in FY25 profit disclosure ahead of a confidentially filed IPO.
