              - CV024
              - CV025
              - CV028
              - CV029
      - number: '8.4'
        title: Valuation Judgment
        blocks:
          - type: paragraph
            body: >-
              On the evidence currently available, “fair” is the cleanest valuation stance. Infra.Market has enough
              revenue scale and operational differentiation to justify a serious private-market benchmark, but not
              enough public disclosure quality to justify an aggressive premium to the last private round. The company
              is not a fragile early-stage story, yet it also should not be valued like an asset-light software or
              listings business. The right discipline is therefore to treat $2.8 billion as a ceiling that must be
              re-earned through cleaner cash conversion, debt transparency, and filing-grade earnings reconciliation. If
              those arrive, upside exists because the market backdrop is strong and the category position is meaningful.
              If they do not, the downside is not that the business disappears, but that it lists at a more cautious
              multiple and spends its first public years proving that scale can coexist with clean cash economics.
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
