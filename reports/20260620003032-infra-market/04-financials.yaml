  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: fy25-profit
    missingEvidence: A management-certified reconciliation of the Rs 220 crore and Rs 492 crore FY25 PAT figures appearing in public sources.
    whyItMatters: The earnings base drives multiples, leverage tolerance, and IPO credibility.
    diligencePath: Request audited consolidated FY25 statements plus a bridge from statutory PAT to any ratings-package or adjusted EBITDA presentation.
    relatedQuestionRefs:
    - QI014
    - QI025
  - type: private-evidence-only
    severity: material
    topic: debt-maturity
    missingEvidence: Debt schedule by lender, currency, maturity, collateral, and covenant package.
    whyItMatters: Refinancing risk is already a public concern and could dominate IPO proceeds usage.
    diligencePath: Obtain loan agreements and treasury materials from management.
    relatedQuestionRefs:
    - QI021
    - QI024
  - type: missing-source
    severity: minor
    topic: segment-margins
    missingEvidence: Category-level gross margin and working-capital days by business line.
    whyItMatters: Topline growth alone does not reveal whether the model is getting structurally better or worse.
    diligencePath: Request segment P&L by structural, finishing, lifestyle, and allied services.
    relatedQuestionRefs:
    - QI023
