- id: TM001
  title: Market definition table
  columns:
  - Spend bucket
  - Included for Infra.Market?
  - Why / why not
  - Implication
  rows:
  - - Structural materials (concrete, AAC, steel, pipes)
    - 'Yes'
    - Directly sold by Infra.Market through B2B channels
    - Core revenue pool
  - - Finishing materials (tiles, paints, wood, bathware)
    - 'Yes'
    - Official catalog and brand surfaces show large exposure
    - Cross-sell and wallet-share expansion
  - - Lifestyle / interiors / appliances
    - 'Yes'
    - IVAS and related brands extend the project-lifecycle reach
    - Higher-ticket retail and interior upside
  - - Land cost and project finance
    - 'No'
    - Not part of materials procurement
    - Exclude from TAM to avoid inflation
  - - Pure labour cost
    - Mostly no
    - Affects project budgets but is not a sold product category
    - Treat as market friction, not revenue pool
  notes: This table separates the relevant procurement market from broader construction spend that would overstate TAM for a materials platform.
