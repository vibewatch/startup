- id: TM002
  title: TAM / SAM / SOM sizing lenses
  columns:
  - Lens
  - Value / range
  - Source set
  - How to use it
  rows:
  - - Broad Indian construction market
    - High hundreds of billions to more than $1T over coming years
    - Mordor, GlobalData, IMARC, NextMSC
    - Directional macro ceiling only
  - - Real-estate development economy
    - ~$1T by 2030 in IBEF framing
    - IBEF real estate
    - Supports downstream materials demand
  - - Infrastructure investment engine
    - Very large multi-year public capex pool
    - IBEF infrastructure, PMAY, macro sources
    - Shows policy-backed demand
  - - Digitizable multi-category procurement pool
    - Smaller than total construction spend but still very large
    - Inferred from official category map and sector reports
    - Best practical SAM lens for Infra.Market
  - - Current Infra.Market penetration
    - Small share even at Rs 18,472 crore FY25 revenue
    - Company FY25 reporting plus macro data
    - Reinforces long runway
  notes: Absolute numbers differ across sources because coverage boundaries vary; the tighter SAM and SOM lenses must be bottom-up rather than top-down.
