- id: TM004
  title: Growth drivers and constraints
  columns:
  - Factor
  - Direction
  - Evidence
  - Why it matters
  rows:
  - - PMAY and urban housing
    - Positive
    - PMAY-Urban and IBEF real-estate materials
    - Supports steady demand for core categories
  - - Infrastructure capex
    - Positive
    - IBEF infrastructure and company commentary
    - Benefits structural products and early project entry
  - - Strong macro growth
    - Positive
    - IMF and World Bank India outlooks
    - Improves baseline private and public capex confidence
  - - Commodity and labour inflation
    - Negative
    - CNBC-TV18 cost coverage and JLL guide
    - Can delay projects or compress supplier margins
  - - Fragmented logistics / quality enforcement
    - Mixed
    - Company and market commentary
    - Creates need for organized platforms but raises execution burden
  - - Working-capital intensity
    - Negative
    - Inferred from market structure and cost guides
    - Makes cash conversion as important as revenue growth
  notes: Market attractiveness is pulled upward by demand and downward by cost and execution friction.
