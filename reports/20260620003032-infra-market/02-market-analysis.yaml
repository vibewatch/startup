chapter:
  number: 2
  title: Market Analysis
  summary: Infra.Market operates inside a very large Indian construction and building-materials economy whose demand is supported by housing, infrastructure, and urbanisation, but whose exact top-down size varies materially across source methodologies. The attractive part of the market case is demand breadth; the hard part is that adoption and margins are constrained by logistics, quality assurance, working capital, and cost inflation rather than by awareness alone.
sections:
- id: market-boundary-and-sizing
  title: Market Boundary and Sizing Lenses
  body: Infra.Market’s market should not be defined as all Indian construction spend. The relevant arena is the procurement and distribution layer for materials and related products that move through a project from early structural work to finishing and retail-led refurbishment. That distinction matters because third-party market studies publish very large numbers for Indian construction, infrastructure, and real estate, but they use different denominators. IBEF’s real-estate framing, infrastructure policy summaries, and analyst reports from Mordor, GlobalData, IMARC, and NextMSC all support a very large opportunity, yet none should be treated as a precise one-line TAM for Infra.Market. A more decision-useful view is that Infra.Market addresses a large, under-organized, operationally complex procurement market whose categories are broad enough to sustain multi-billion-dollar revenue, while still requiring careful bottom-up work to estimate a filing-grade SOM by category, channel, and geography.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM007
  - CM020
  - CM023
