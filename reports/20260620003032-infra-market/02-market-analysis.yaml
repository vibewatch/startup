- id: buyers-segments-and-adoption
  title: Buyers, Segments, and Adoption Path
  body: The company’s buyer map is more layered than a simple contractor-supplier marketplace. Public materials show a direct corporate B2B channel for developers, infrastructure EPC firms, industrial customers, and contractors, alongside a B2R channel for dealers, sub-dealers, and other retail touchpoints. Management commentary is consistent that the adoption wedge starts with concrete and structural categories early in the project lifecycle, then broadens into walling, plumbing, tiles, paints, appliances, and interiors as construction progresses. That is important because the economic story depends less on one category winning on absolute market share and more on Infra.Market increasing wallet share inside a project once it is already present. In effect, the market structure rewards a supplier that can coordinate multiple procurement moments, assure quality, and shorten the customer’s logistics burden.
  claimRefs:
  - CM008
  - CM009
  - CM010
