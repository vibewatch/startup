- id: peer-scale-and-financials
  title: Peer Scale, Revenue, and Valuation
  body: Public revenue data show that Infra.Market belongs in India’s scaled B2B procurement cohort rather than in a startup niche. FY25 revenue around Rs 18,472 crore places it below OfBusiness but above Moglix and recent Zetwerk FY25 revenue, while still well above BuildSupply’s much smaller disclosed scale. OfBusiness appears to command the highest private valuation in the cohort, supported by broader category spread and a more embedded financing layer. Moglix is smaller on revenue but still valued in the same broad multi-billion-dollar band, which highlights how the market sometimes rewards asset-light industrial procurement models. Zetwerk complicates the picture because it is more manufacturing-heavy and its revenue path is noisier, but it remains a relevant benchmark for scale and IPO ambition. IndiaMART, as a public company with a lighter operational model, provides a reminder that not all B2B commerce revenue should be valued on the same multiple.
  claimRefs:
  - CP010
  - CP011
  - CP012
  - CP013
  - CP014
  - CP015
