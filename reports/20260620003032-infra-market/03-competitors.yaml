  - FP003
- id: competitive-conclusion
  title: Competitive Conclusion
  body: 'The cleanest way to frame competition is that Infra.Market is neither a pure marketplace nor a pure manufacturer. It competes against each rival on a different dimension: financing depth versus OfBusiness, industrial breadth versus Moglix, execution scale versus Zetwerk, discovery economics versus IndiaMART, and workflow tooling versus BuildSupply. That means the company does not need to beat every peer on every metric to create value. It needs to dominate a specific job-to-be-done: becoming the organized, trusted, multi-category supplier for real-world projects that need procurement, quality, and delivery solved together. Investors should therefore benchmark Infra.Market less on theoretical feature lists and more on whether its category bundle and operating density create repeatable wallet-share gains. If margins, cash conversion, and customer retention deteriorate, the wider peer set offers plenty of alternatives to buyers and capital markets alike. Another reason to stay disciplined
    is that several peers are likely to approach public markets within a similar window. If that happens, investors will compare cash conversion, debt tolerance, and category economics more harshly than they compare narrative alone.'
