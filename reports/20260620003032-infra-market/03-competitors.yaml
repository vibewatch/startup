- id: capability-and-moat-comparison
  title: Capability Breadth and Moat Comparison
  body: Infra.Market’s strongest competitive differentiator is that it combines procurement with controlled manufacturing, house-of-brands development, and project-stage cross-sell. That is a different moat from OfBusiness, which has a powerful credit-led operating model; from Moglix, which is more industrial and MRO focused; and from IndiaMART, which scales through a much lighter marketplace architecture. Zetwerk’s moat is manufacturing orchestration and production execution rather than construction-materials wallet share. The practical implication is that Infra.Market wins when customers value OTIF delivery, category bundling, and quality control more than they value the lowest standalone quote in a single category. The flip side is that this moat is harder to defend if capital intensity, working-capital needs, or category sprawl start to dilute management focus. Competitive durability therefore rests on whether Infra.Market can keep converting concrete-led access into multi-category revenue
    without letting leverage and service complexity overwhelm the model.
  claimRefs:
  - CP020
  - CP021
  - CP022
  - CP023
  - CP024
  - CP025
  - CP026
  - CP027
  - CP028
  - CP029
