  topStrengths:
    - 已打入全球前十大投行和 350+ 家头部机构，证明它在一个历来抗拒技术改造的资产类别中确有产品市场契合。
    - 公司称 ARR 连续多年约 100% 增长；若得到验证，9fin 将跻身机构 fintech 里增长最快的企业 SaaS 平台。
    - CPP Investments 既是现有日常使用客户，又参与 Series C，这是对平台质量和粘性的极强背书。
    - $145 trillion 全球债务资本市场数字化，以及 AI 嵌入机构工作流，构成结构性顺风，给平台核心产品带来持久需求。
    - 2026 年 4 月 APAC 发布，加上新的 AI Chat 和 Research Grid 产品，延伸了地域和产品扩张路径，且没有偏离核心 B2B 数据模型。
  topRisks:
    - 经审计收入、ARR、NRR、毛利率或烧钱速度都没有公开数据，财务核保只能依赖 NDA 级披露。
    - Bloomberg AskB 和 AlphaSense（目前 $600M ARR、估值 $7.5B）正激进切入信贷市场工作流，形成两侧替代威胁。
    - $250M+ 累计融资带来的未知优先权悬挂，加上没有盈利指引，引入重大稀释和瀑布分配不确定性。
    - 估值隐含 7–20x ARR（区间宽，因 ARR 未披露），只有拿到确认收入数据后才能精确判断。
  unresolvedGaps:
    - 经审计的 FY2024 和 FY2025 ARR、收入运行率、毛利率、NRR 和烧钱现金跑道。
    - 详细 Series C 股权结构条款，包括清算优先权、完全摊薄股数，以及任何债务或老股成分。
    - 已确认 NRR 指标，用来验证公司“行业领先留存”的说法。
    - APAC 和 private credit 扩张的 ARR 贡献与单位经济性清晰度。
