callouts:
  - calloutType: risk
    title: "AI Copyright Litigation Is a Sector-Defining Risk"
    body: "The $1.5B Bartz v. Anthropic settlement in 2025 and the acceleration of AI training-data copyright lawsuits in 2026 have established material financial exposure benchmarks for AI companies that trained on copyrighted content without explicit licensing. 9fin's AI models process debt documents, loan agreements, and editorial content from numerous publishers. The status of 9fin's data licensing agreements for AI training purposes is undisclosed and represents a diligence blocker before any capital commitment."
    claimRefs:
      - CR010
      - CR011
      - CR043

  - calloutType: strength
    title: "Security Posture Is Well Above Peer Average"
    body: "SOC 2 Type II certification audited against AICPA Trust Service Principles and NIST standards, combined with annual CREST-accredited penetration testing, places 9fin's security posture meaningfully above the average for a Series C company. This provides institutional clients with independent verification of controls, reducing procurement friction and satisfying the FCA's third-party AI governance expectations. No public security incidents have been identified in reviewed sources."
    claimRefs:
      - CR017
      - CR018
      - CR019
      - CR044

  - calloutType: assumption
    title: "9fin Is Not a Directly Regulated Financial Services Firm"
    body: "9fin Limited is not authorized by the FCA under FSMA 2000 and does not hold a financial services license in the UK, EU, or US. Its regulatory exposure arises indirectly through obligations that flow to vendors from its regulated institutional clients. This assumption significantly moderates the headline regulatory risk rating, but investors should confirm that no planned product features (such as execution algorithms or investment advice functionality) would trigger direct regulatory authorization requirements."
    claimRefs:
      - CR004
      - CR013

  - calloutType: recommendation
    title: "Require NDA Financial Disclosure Before Capital Commitment"
    body: "The diligence gap from the absence of audited 2024 accounts and undisclosed burn rate, gross margin, and AI model accuracy benchmarks means no underwriting judgment can be made from public data alone. Investment conviction should be conditioned on NDA access to: (1) ARR by geography and asset class, (2) gross margin decomposed by editorial vs. technology costs, (3) burn rate and cash runway, (4) AI model error rate data, and (5) AI training data licensing documentation."
    claimRefs:
      - CR033
      - CR038

  - calloutType: risk
    title: "Key Person Dependency Is Unmitigated at the Co-Founder Level"
    body: "The departure of either co-founder within 18 months of the Series C would likely trigger investor concern, create leadership uncertainty, and potentially affect institutional client confidence in a market where trust in the editorial and analytical team is part of the product value. No publicly documented succession plan or leadership bench at the co-founder level has been identified. This risk is common at this stage but should be addressed in diligence."
    claimRefs:
      - CR036
      - CR039

