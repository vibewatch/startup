  - id: operational-technical-risks
    title: Operational and Technical Risk
    body: |
      9fin's security posture is above the median for a Series C enterprise SaaS company. The platform holds SOC 2 Type II certification audited against AICPA Trust Service Principles and NIST standards, with annual penetration testing by CREST-accredited security firms. Encryption in transit and at rest, identity and access management integrated with enterprise identity providers, and least-privilege AI chat retention (180-day default) are all documented on the public security page. No public data breaches, service outages, or material data quality incidents have been reported in sources reviewed during this research.

      However, the operational risk that is hardest to mitigate is AI model reliability. 9fin's platform extracts covenant terms, pricing data, and deal structures from unstructured debt documents — a task where even a small error rate has outsized consequences. A credit professional acting on a hallucinated covenant threshold or an incorrectly extracted loan term in a multi-hundred-million-dollar transaction creates a liability scenario that no contractual limitation of liability in the Terms of Service can fully eliminate from a reputational perspective. The 2026 ORX Operational Risk Horizon study, drawing on 47 major financial institutions, ranks advancing cybercrime, technology disruption, supply chain risk, and data governance as the four top emerging operational risks — all directly applicable to 9fin's architecture.

      The aggregation of data from over 2,000 sources, as documented in 9fin's platform descriptions, creates a data provenance governance challenge. Each source has different licensing terms, update frequencies, and error rates. The IQ-EQ 2026 compliance analysis warns that firms embedding third-party AI tools must strengthen data integrity measures and prevent misuse; this applies symmetrically to 9fin as a consumer of third-party data and as a producer of AI-derived analysis for clients.

      9fin's acquisition of Bond Radar (approximately March 2025) added over 20 years of historical debt market data but also introduced data reconciliation complexity. Two distinct data infrastructures operating under separate legal entities (Bond Radar Ltd and 9fin Limited) create the possibility of data consistency errors between legacy Bond Radar data and 9fin's native data pipelines, particularly during the integration period.
