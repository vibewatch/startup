  title: "Risks"
  summary: "9fin's most material risks are competitive displacement by Bloomberg and LSEG, US market execution failure, AI/IP copyright exposure, and financial model risk arising from its capital-intensive editorial and AI infrastructure. Regulatory exposure is structurally low—9fin is not FCA-authorized as a financial services firm—but EU AI Act and UK DORA obligations flowing through institutional clients create indirect compliance responsibilities. Security posture is above-average with SOC 2 Type II certification and CREST-accredited penetration testing, though AI model reliability and data provenance governance remain unresolved diligence questions that require NDA-level access to close."

sections:
  - id: risk-landscape-overview
    title: Risk Landscape Overview
    body: |
      9fin's risk profile reflects the combination of a capital-intensive enterprise SaaS build-out, a competitive market dominated by entrenched incumbents, and a structural dependence on continued equity financing before the business reaches free cash flow. The severity-ranked risk hierarchy places competitive and execution risk at the apex, followed by financial model risk, AI/legal exposure, and operational risk; regulatory risk is structurally lower than its headline suggests because 9fin is not a directly regulated financial services firm.

      The top five risks by combined likelihood and residual impact are: (1) competitive displacement by Bloomberg, LSEG, or a well-funded challenger deploying comparable AI on superior data infrastructure; (2) US market execution failure — inability to convert the Series C expansion mandate into a durable US revenue base within the 24–36 month window the funding provides; (3) financial model risk — capital intensity exceeding growth, leading to down-round risk or inability to raise follow-on financing; (4) AI/IP copyright litigation exposure from training on debt documents and editorial content without confirmed licensing; and (5) key person and talent risk concentrated in the co-founding team and senior editorial staff.

      Risk interdependencies are significant and compound each other. A sustained Bloomberg AskB AI launch that wins institutional mandates simultaneously triggers customer churn, reduces contract renewal leverage, increases CAC for US expansion, and compresses the valuation implied by the next fundraise — all from a single competitive event. Similarly, any breach in AI model output quality (covenant errors, hallucinated bond terms) could trigger client attrition, reputational damage, and regulatory attention from the FCA's principles-based AI oversight framework, in a chain that begins as an operational issue and ends as a valuation event.

      The risk heatmap (FR001) and risk transmission map (FR002) below summarize the severity distribution and propagation pathways. The mitigations, monitoring indicators, and kill criteria developed in the final section anchor each risk to a concrete diligence ask or thesis-break trigger.
