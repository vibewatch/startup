  - id: regulatory-legal-risks
    title: Regulatory and Legal Risk
    body: |
      9fin is not authorized by the FCA as a financial services firm under FSMA 2000 and does not hold any financial services license in the UK, US, or EU. As a technology and data vendor supplying information tools to regulated institutions, 9fin sits outside the direct regulatory perimeter — but this does not make it risk-free. The FCA's 2026 AI approach document makes clear that regulated institutions are expected to evidence robust governance of third-party AI and data tools; this flows responsibility for transparency, bias mitigation, and resilience documentation upstream to vendors like 9fin. Institutional clients subject to the FCA's Consumer Duty, SMCR, and operational resilience frameworks increasingly demand SOC 2 Type II reports, DPAs, and incident response commitments from data vendors.

      The Bank of England's PS7/26 (March 2026) policy on operational incident and third-party reporting creates a specific indirect obligation: 9fin's institutional banking clients must notify regulators of material third-party arrangements and incidents. An outage or data error at 9fin that affects client workflows is a reportable event under PS7/26, imposing reputational and relationship risk even without direct enforcement. FINRA's 2026 regulatory oversight report identifies vendor concentration among third-party data providers as a systemic risk, expecting member firms to assess and document their exposure to critical vendor disruptions.

      The EU AI Act (compliance dates from August 2024 through 2026) classifies AI tools used for credit risk assessment and financial decision-making as high-risk AI systems requiring risk management documentation, training data quality governance, human oversight provisions, and transparency obligations. While 9fin operates primarily under UK jurisdiction post-Brexit, EU-based institutional clients accessing the platform from EU member states create material compliance obligations under both the AI Act and GDPR. The ICO's UK GDPR guidance establishes UK-specific data protection by design obligations for all entities processing personal data of UK data subjects.

      AI/IP copyright litigation is the legal risk with the most uncertain severity. Industry experts and litigation surveys confirm that 2026 has seen acceleration in AI training data copyright lawsuits. The Bartz v. Anthropic $1.5B settlement and ongoing litigation against major AI companies establishes financial exposure benchmarks. 9fin's AI models, trained on debt instruments, covenant agreements, loan documents, and editorial content, may face similar claims if data licensing is not confirmed. 9fin's four-entity legal structure (9fin Limited UK, 9fin Inc. US, Bond Radar Ltd UK, Bond Radar Asia HK) also creates cross-jurisdictional tax, labor, and regulatory compliance complexity as the business scales.
