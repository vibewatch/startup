      - number: '3.4'
        title: Switching Costs, Lock-In, and Multi-Homing Dynamics
        blocks:
          - type: paragraph
            body: >
              Bloomberg's dominant lock-in mechanism is the combination of workflow habituation, proprietary IB
              messaging, multi-year enterprise licensing, and trading infrastructure integration that takes an estimated
              6–12 months to migrate. Credit teams report that switching from Bloomberg requires not only retraining but
              also rebuilding custom analytics and alerts built on Bloomberg data structures. This is the primary reason
              9fin does not seek to replace Bloomberg head-on but instead supplements it, targeting incremental
              analytical workflows and research productivity gains on top of the existing terminal subscription.


              9fin's own switching costs compound over time through two mechanisms. First, once a credit team
              standardizes leveraged finance research and covenant analytics workflows around 9fin's data architecture,
              migrating requires rebuilding custom filters, deal history lookups, and alert logic from scratch on a
              competing platform. Second, 9fin's more than 20-year historical dataset is the reference corpus for trend
              analysis across market cycles; a competitor without comparable depth cannot serve as a drop-in substitute.
              The multi-homing pattern—Bloomberg for trading and real-time pricing, 9fin for analytical,
              deal-monitoring, and covenant workflows—is widely observed among institutional buyers. This multi-homing
              dynamic limits 9fin's upside pricing power but substantially reduces head-on churn risk from Bloomberg
              directly.


              Distribution power varies sharply across the landscape. Bloomberg and S&P Global deploy global enterprise
              sales forces embedded within client organizations, benefiting from master data agreements with
              bulge-bracket banks. Octus, with PE backing and more than 800 employees, also operates a scaled enterprise
              sales motion. Network-driven benchmarks compound this advantage: the more institutions contribute deal
              data to a platform, the more authoritative its market statistics become, reinforcing entrenchment. New
              greenfield private credit funds and newly formed credit desks without legacy terminal infrastructure face
              lower switching costs and represent a disproportionate share of 9fin's net-new customer opportunity.
            claimRefs:
              - CP029
