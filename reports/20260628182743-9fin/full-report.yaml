  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >
              9fin generates revenue through an enterprise B2B SaaS subscription model directed at institutional
              participants in global debt capital markets. The platform bundles three interlocking value layers —
              AI-powered research tools, proprietary data and analytics, and an editorial news operation staffed by
              credit journalists and legal analysts — all delivered under a single institutional subscription. This
              bundled architecture departs from the point-solution pricing common among legacy financial data vendors
              and is designed to make the platform the sole workflow environment for credit professionals, from deal
              origination through portfolio monitoring.


              Institutional subscribers include the top-ten global investment banks, leading asset managers, law firms,
              hedge funds, and advisory firms. As of the March 2026 Series C announcement, 9fin reported 350+
              institutions on platform. The company does not publish per-seat or per-module pricing; all commercial
              terms are negotiated directly with the sales team, consistent with enterprise SaaS conventions for this
              customer segment where average contract values typically exceed $100,000 annually.


              The revenue model has two distinguishable tiers in practice. Primary subscribers pay enterprise
              institutional contracts for broad platform access across all asset classes — leveraged finance, high-yield
              bonds, CLOs, private credit, distressed debt, and asset-backed finance. Secondary expansion revenue arises
              from seat additions within existing institutional clients, geographic region extensions, and upsell to
              premium AI product tiers such as AI Chat and the Research Grid launched alongside the Series C deployment.
              CPP Investments' dual role as customer and investor illustrates the expansion dynamic: a major
              institutional client that validated the product financially before committing equity.


              The revenue model's quality rests on high switching costs (proprietary covenant databases, workflow
              integrations), editorial content exclusivity, and long contract durations typical of institutional data
              subscriptions. The absence of a free tier and the requirement for direct sales engagement confirm the
              platform is aimed exclusively at enterprise institutional buyers, not retail or small-team segments. Key
              diligence questions around ACV, contract duration, and the mix between base subscription and expansion
              revenue remain unanswered without NDA access.
