      - number: '5.2'
        title: Platform Architecture & Operating Model
        blocks:
          - type: paragraph
            body: >
              9fin is built as a cloud-native, AI-native platform. The technical architecture layers data ingestion and
              normalisation at the base, AI and analytics processing in the middle, and editorial content and
              user-facing applications at the top. Data sources include public filings, PDFs, offering documents, news
              feeds, emails, and Bond Radar's historical issuance data. The platform processes these through NLP and AI
              pipelines that extract, classify, and structure covenant terms, financial metrics, deal timelines, and
              credit signals.

              The AI engine is built on a combination of proprietary and third-party large language models fine-tuned
              and calibrated for debt capital markets use cases. CEO Steven Hunter has stated that the winners in AI
              will be defined by "the quality of the intelligence those models are built on," positioning 9fin's
              proprietary data and editorial network as the core moat. CPO Moisés García confirmed that all AI outputs
              are grounded in 9fin's proprietary debt market data and linked back to original source material. This
              citation architecture — where every AI-generated answer traces to an underlying document or data point —
              is a deliberate design choice to maintain auditability and enterprise-grade trust. The in-house editorial
              team of credit, distressed, and legal analysts shapes and calibrates model outputs to ensure quality,
              context, and consistency.

              The Bond Radar acquisition (March 2025) extended the platform's data layer with 20 years of historical
              issuance data for high-yield, leveraged loans, investment grade, and emerging markets. Bond Radar content
              was fully integrated into the 9fin.com platform by early Q1 2026, with clients accessing all datasets
              through a single unified login. Operationally, 9fin runs a hybrid editorial and technology model: the
              platform automates data extraction and analysis while an in-house team of market journalists and legal
              specialists provides editorial coverage that feeds both human readers and AI calibration.
            claimRefs:
