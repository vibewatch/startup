      - number: '7.6'
        title: Mitigations, Kill Criteria, and Diligence Asks
        blocks:
          - type: paragraph
            body: >
              The most actionable thesis-break triggers for 9fin are measurable, bounded, and observable through a
              combination of market data and NDA-level disclosure. The primary kill criteria are: (1) Bloomberg or LSEG
              achieving material penetration of 9fin's top-20 institutional clients with a directly comparable AI
              product within 18 months; (2) US ARR failing to reach 30% of total ARR within 24 months of the Series C
              close; (3) NDA review revealing gross margin below 55%, indicating the editorial cost structure is
              consuming the SaaS economics thesis; and (4) a material AI accuracy incident — confirmed covenant error or
              hallucinated deal term that causes a client financial loss — triggering a contract termination cascade.


              Ongoing monitoring indicators should include: (1) Bloomberg Terminal subscription trends and AskB adoption
              metrics (tracked via Bloomberg press releases and analyst surveys); (2) 9fin's Companies House filing of
              2024 statutory accounts, due September 2026 — the first independently audited financial baseline; (3)
              9fin's US office headcount and US-based client announcements; (4) any FCA or ICO enforcement action
              against financial data vendors for AI model reliability or data protection; and (5) the pace of AI
              copyright litigation settlements, which establishes the licensing liability benchmark.


              Diligence asks in priority order: (a) NDA review of ARR by geography, asset class, and cohort vintage; (b)
              gross margin and burn rate with editorial/AI cost decomposition; (c) AI model accuracy benchmarks and
              incident report history; (d) data licensing agreements confirming the right to train AI models on sourced
              content; (e) confirmation of cloud provider and AI API dependencies with contractual SLA details; (f) Bond
              Radar integration milestone status and data reconciliation completion certificate; and (g) details of any
              ongoing or threatened litigation or regulatory inquiry.
