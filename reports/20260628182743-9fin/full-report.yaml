  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              9fin operates in a multi-segment DCM intelligence market where institutional buyers routinely multi-home
              across platforms serving different workflow layers. The competitive field divides into at least six
              distinct categories: (1) full-suite terminal incumbents—Bloomberg Terminal and LSEG Workspace—that anchor
              institutional desks with broad multi-asset data and deep workflow integration; (2) credit-specialist
              intelligence providers—Octus Intelligence (formerly Reorg Research) and Debtwire/ION Analytics—targeting
              structured credit, distressed, and leveraged finance professionals with narrow, deep coverage; (3)
              AI-native broad research platforms—AlphaSense, now at a $7.5 billion valuation and $600 million ARR—whose
              document corpus and workflow automation tools overlap 9fin on research productivity, albeit without
              credit-market depth; (4) institutional data and analytics providers such as S&P Global Leveraged
              Commentary & Data (LCD) that hold authoritative loan and high-yield deal databases; (5) internal build
              alternatives—Excel-based models, VBA macros, and junior analyst teams that remain the de-facto substitute
              for many mid-market credit shops; and (6) emerging generalist AI tools from OpenAI, Anthropic, and similar
              that increasingly offer generic document analysis without domain-specific training.


              The incumbent tier is characterized by high switching costs, multi-year enterprise contracts, and deep
              distribution through global sales forces. Bloomberg's estimated $25,000–$32,000 per user per year price
              point is not primarily competed on cost but on workflow integration and communication network effects.
              LSEG Workspace, the successor to Refinitiv Eikon, targets multi-asset global teams and has announced
              AI-driven LLM products transforming live financial data into actionable insights. Neither Bloomberg nor
              LSEG has built the deep, covenant-level credit specialization to match 9fin or Octus.


              The specialist tier—Octus and Debtwire—mirrors 9fin's buyer targets most closely. Octus launched CreditAI
              in March 2026, a compliance-ready generative AI platform trained on private data rooms, credit agreements,
              and non-public issuer financials. Debtwire, as part of ION Analytics, is positioned primarily as a
              news-and-alerts product. S&P Global LCD provides authoritative historical deal databases used by virtually
              every leveraged-finance professional, but competes primarily on data breadth rather than workflow
              automation or AI document analysis. The status quo—internal analyst teams and Excel workflows—remains the
              largest de-facto alternative for smaller credit shops and teams with tighter budgets.
