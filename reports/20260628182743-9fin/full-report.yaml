          - type: callout
            title: 'Severe Opacity: No Audited Financials, No Disclosed Revenue'
            body: >-
              9fin does not publish ARR, gross margin, NRR, burn rate, CAC, or ACV figures. The 2024 statutory accounts
              at Companies House are not yet filed (due September 2026), meaning no independently audited financial
              baseline exists from which to verify growth claims, assess unit economics, or determine capital adequacy
              independently. This level of disclosure opacity is consistent with private company norms but represents a
              material underwriting blocker. The $1.3B valuation and the 100% ARR growth narrative are currently
