      - number: '3.2'
        title: Incumbent and Direct Competitor Profiles
        blocks:
          - type: paragraph
            body: >
              Bloomberg Terminal is the universal credit-market baseline. Its estimated $25,000–$32,000 annual seat
              price reflects decades of workflow entrenchment, proprietary IB messaging, and real-time data across every
              asset class. Bloomberg's competitive response to AI-native challengers has been AskB, an agentic AI system
              that coordinates multiple AI agents across more than 800 research providers embedded within the
              Terminal—covering bond analytics, portfolio risk, and credit research screens. AskB is not a standalone
              product but an AI layer bolted onto the existing terminal workflow. Bloomberg's advantage is breadth and
              institutional trust; its disadvantage is the absence of deep, document-level credit specialization.
              Bloomberg's global enterprise sales force—embedded at every major global bank—creates a defensive
              distribution moat that 9fin cannot replicate organically.


              Octus Intelligence (founded 2013, formerly Reorg Research) is 9fin's most direct specialist competitor.
              With approximately $441 million in total funding and a PE-backed profile, Octus serves buy-side firms,
              investment banks, law firms, and advisory firms globally. In March 2026, Octus launched CreditAI—described
              as the first compliance-ready generative AI for credit—combining public and proprietary data room
              documents, loan agreements, and private issuer financials in an auditable, source-verified environment.
              Octus CEO Kent Collier explicitly stated that "generic AI models are a risk for anyone advising a borrower
              or lender," positioning CreditAI as categorically superior to general-purpose LLMs. Octus also acquired
              Sky Road research management to unify credit intelligence, analytics, compliance, and portfolio technology
              in a single stack.


              Debtwire, operating under ION Analytics Group, targets leveraged finance professionals with news-first
              coverage and predictive analytics, recording coverage of $1.73 trillion in LevFin issuance across US and
              European markets in 2025. AlphaSense raised $350 million at a $7.5 billion valuation in June 2026,
              surpassing $600 million in ARR driven by 73% year-over-year growth; its 500-million-document corpus and
              generative workflow agents compete with 9fin for the analyst-automation use case, but lack credit-market
              depth. S&P Global LCD and its March 2026 partnership with Cambridge Associates and Mercer to launch
              standardized private credit performance datasets demonstrate how established data incumbents are actively
              encroaching on 9fin's private-credit opportunity.
