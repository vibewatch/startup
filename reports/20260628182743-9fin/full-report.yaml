              At $1.3B valuation on an estimated $65M–$183M ARR base, 9fin's implied revenue multiple of 7x–20x is
              within the range for capital markets infrastructure SaaS (Finro median 18.3x) but the wide range itself is
              the problem: the valuation can only be assessed precisely if ARR is confirmed. With $250M+ total raised
              and no disclosed profitability timeline, equity dilution risk is meaningful. Each successive round at high
              multiples dilutes earlier investors and founders; should ARR growth slow or market conditions tighten, a
