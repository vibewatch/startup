      - number: '5.3'
        title: Deployment, Integration & Roadmap
        blocks:
          - type: paragraph
            body: >
              9fin is deployed as a Software-as-a-Service platform accessed via web browser. The company provides APIs
              enabling enterprise clients to feed real-time and historical credit data, documents, and analytics into
              their internal systems, dashboards, or quantitative models. API documentation is not publicly available;
              access is gated to enterprise clients through institutional agreements and is not accompanied by a public
              developer programme or sandbox.

              The June 2026 AI tools launch introduced AI Chat and Research Grid as the two primary AI-native workflow
              modules. AI Chat allows users to query 9fin's proprietary dataset using natural language and receive
              cited, traceable answers to complex credit questions. Research Grid enables structured company comparisons
              at scale using pre-defined analyst frameworks or user-defined queries. Both tools are generally available
              as of the runDate.

              The product roadmap beyond the June 2026 AI launch targets credit-specific AI agents — autonomous software
              agents that proactively monitor the market and clients' portfolios, draft analyses and alerts for emerging
              risks and deals, and allow professionals to focus on judgment rather than data assembly. CPO García
              described this as building agents that "proactively monitor, draft and alert, so clients can focus on
              applying judgment rather than assembling inputs." Support and reliability commitments are not publicly
              disclosed; no formal SLA for platform uptime has been published, though the SOC 2 Type II certification
              implies operational availability controls.
