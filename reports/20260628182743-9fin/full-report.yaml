      - number: '1.3'
        title: Funding History & Investors
        blocks:
          - type: paragraph
            body: >
              9fin has raised over $250 million in total funding across multiple rounds since 2016. Pre-Series A funding
              from Fly Ventures, Seedcamp, and AI Seed Fund, along with angel investors including Paul Forster
              (co-founder of Indeed) and Alan Morgan (co-founder of MMC Ventures), brought total pre-Series A funding to
              over £10 million. This early backing reflected conviction in the market opportunity well before AI-powered
              financial data became a widely-recognised category.


              In October 2021, 9fin closed an £8 million Series A led by Redalpine (a Swiss VC) with participation from
              Fly Ventures, Ilavska Vuillermoz Capital, and angel investors; Aleksandra Laska of Redalpine joined the
              board. Fourteen months later, in December 2022, the company raised a $23 million Series A+ led by US-based
              Spark Capital (with Alex Finkelstein joining the board), bringing total funding to approximately $37
              million. The fresh capital was used to open a New York office and grow the US team to more than 70 people.
              Since 2021 9fin had more than doubled its client base, tripled its team, and quadrupled ARR.


              In December 2024, Highland Europe led a $50 million Series B round with participation from existing
              investors Spark Capital, Redalpine, Seedcamp, 500 Startups, and Ilavska Vuillermoz Capital; Fergal Mullen
              of Highland Europe joined the board. The Series B coincided with 9fin being named among the top-20
              fastest-growing software companies in the UK by the Sunday Times Tech 100.


              The March 2026 Series C, led by HarbourVest Partners at a $1.3 billion valuation, raised $170 million and
              brought total funding to more than $250 million. Canada Pension Plan Investment Board (CPP Investments)
              participated for the first time as an investor after already being a client—a notable proof point for the
              platform's institutional value. The proceeds are directed at accelerating US expansion and deepening AI
              product development. No public debt or credit facility has been disclosed. 9fin's revenue remains private
              beyond the Companies House filing of £7.2 million turnover for year ended December 2023.
