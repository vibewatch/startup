  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product & Service Definition
        blocks:
          - type: paragraph
            body: >
              9fin delivers a unified intelligence platform for credit professionals operating in the global debt
              capital markets. The platform consolidates news, structured data, analytics, and AI-powered workflows
              across all major debt asset classes — high-yield bonds, leveraged loans, distressed debt, collateralised
              loan obligations (CLOs), private credit, asset-based finance (ABF), and investment grade debt. Customers
              interact with 9fin through a web-based interface providing a single, connected workflow that replaces the
              fragmented, multi-tool approach historically used by credit teams.

              The product is positioned as a system of intelligence rather than a data terminal. Unlike traditional
              financial data platforms that primarily aggregate raw price and reference data, 9fin combines real-time
              editorial coverage from in-house journalists, lawyers, and analysts with proprietary structured data and
              AI tools that synthesize these inputs into actionable outputs. The platform covers the full credit
              workflow from deal origination and primary market monitoring through to secondary trading, portfolio
              monitoring, and restructuring or distressed analysis. The company's platform page describes the value
              proposition as helping credit teams "save time, win business, and stay ahead of the market" by bringing
              data, documents, and news into one place built for how credit actually works.

              User roles served include credit analysts, portfolio managers, investment bankers, leveraged finance
              lawyers, and restructuring advisors. Institutional buyer segments span top-tier investment banks, buy-side
              asset managers, hedge funds, private credit funds, and law firms. As of mid-2026, 9fin reported 350+
              institutional clients and 350+ employees; the about page describes 80% of trading desks and all top-10
              global investment banks among its clients. Geographic coverage as of the runDate spans North America,
              Europe, Latin America (since September 2025), and Asia-Pacific (since April 2026).
