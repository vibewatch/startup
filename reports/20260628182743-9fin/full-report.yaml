            body: >-
              9fin has publicly reported multiple consecutive years of approximately 100% annual ARR growth,
              corroborated by independent coverage of both the Series B and Series C funding contexts. While unaudited,
              the consistency of the claim across investors (who are presumably conducting their own due diligence) and
              the conversion of CPP Investments from customer to investor provide circumstantial validation. If
              confirmed by audited accounts, a sustained 100% growth rate at an estimated $65M–$183M ARR base would
              represent exceptional performance for a company in the capital markets data sector.
