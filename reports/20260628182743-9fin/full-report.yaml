      - number: '5.5'
        title: Trust, Security, Privacy & Compliance
        blocks:
          - type: paragraph
            body: >
              Enterprise trust and regulatory compliance are central to 9fin's product positioning. The company achieved
              SOC 2 Type I, Type II, and SOC 3 attestations in October 2025, with the Type II audit finding no
              exceptions — demonstrating operational effectiveness of security controls over an extended audit period.
              Regular third-party audits and vulnerability testing are standard practice. Clients operating under strict
              data residency and regulatory requirements are supported by a zero data retention policy for AI model
              inputs: client data does not train the underlying AI models.

              As a UK-incorporated company (9FIN LIMITED, Companies House number 10451957) with operations serving
              European and US institutions, 9fin is subject to GDPR (EU/UK) and relevant financial data handling
              regulations. The platform does not hold or process client trading positions or confidential portfolio
              data; it provides intelligence to inform decisions rather than execute them, which limits direct
              regulatory exposure compared with systems that process client assets or orders.

              Key compliance limitations include the absence of a publicly disclosed uptime SLA, limited public
              information on data lineage and rights for third-party data integrated through Bond Radar, and dependence
              on third-party LLM providers whose data handling practices introduce supply-chain risk. User reviews note
              that AI extraction is not always perfectly accurate, requiring manual validation in some cases — a risk
              that increases as clients place greater reliance on automated credit outputs.
