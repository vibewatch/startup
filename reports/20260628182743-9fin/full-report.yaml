      - number: '6.4'
        title: Retention, Durability, and Customer Satisfaction
        blocks:
          - type: paragraph
            body: >
              9fin claims "industry-leading retention" in its March 2026 Series C press release, but has not disclosed
              NRR, GRR, annual churn rate, cohort data, or average contract duration. This gap means the retention
              narrative cannot be independently verified from public sources and represents the single most important
              underwriting question for long-term revenue quality. The structural argument for high retention is strong:
              9fin serves institutional clients with high switching costs embedded in workflow integration, proprietary
              covenant databases, editorial content exclusivity, and multi-year enterprise subscription contracts.
              Software purchased by large institutional clients for mission-critical workflows tends to exhibit churn
              rates at the low end of the enterprise SaaS distribution — industry benchmarks for infrastructure SaaS
              (the closest comparable) show monthly churn of 1.8%, compared to 3.5% for the B2B SaaS median.


              User-generated evidence offers a partial quality signal. G2 users rate 9fin 4/5 stars as of 2026, citing
              workflow efficiency, speed advantage over legacy media, and modern interface as key strengths. Critical G2
              reviews note coverage limitations relative to Bloomberg and the need for occasional manual AI verification
              — adverse feedback consistent with a platform at a scaling inflection point. FeaturedCustomers reports 24
              testimonials and a 4.8/5 star rating from 500 reference ratings. No documented cases of a major named
              client publicly churning from 9fin have been identified in publicly available sources. The CPP Investments
              and IK Partners reference cases both describe continued platform use over multiple periods, providing
              limited but positive durability signals. NRR, GRR, and cohort data require NDA-level financial disclosure
              to verify the "industry-leading" claim.
