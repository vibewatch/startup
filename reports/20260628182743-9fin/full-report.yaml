      - number: '8.4'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: |
              9fin's exit readiness is promising but not yet proven. The platform's penetration of all
              top-10 global investment banks, multi-geography footprint (London, New York, Hong Kong, Belfast),
              and growing US coverage make it an attractive acquisition target for any of the major terminal
              providers (LSEG, Bloomberg, S&P Global), large PE-backed data consolidators, or capital markets
              infrastructure platforms seeking AI-native DCM capabilities. The Bond Radar acquisition demonstrates
              9fin management's ability to integrate and monetise adjacencies, improving strategic optionality.

              HarbourVest's 40-plus years as a private markets firm and their thesis of backing "next generation
              market leaders" suggests an expectation of a 5–7 year hold with a PE-to-IPO or strategic exit
              path. The average PE holding period of approximately 7 years (per Bain 2026) aligns with 9fin's
              2026 position: a 2031–2033 exit window would require sustained growth through 2028–2029, at
              which point an IPO market or strategic buyer should be available for a platform at $300M+ ARR.

              The most material diligence gap is audited financial data. Companies House shows that FY2024
              statutory accounts have not been filed as of June 2026 — this is normal for companies with a
              December year-end, as filing deadlines permit up to nine months post-year-end. However, it means
              the only independently verifiable revenue data is from FY2023 or earlier. Any investor commitment
              prior to FY2024 account filing must therefore rely entirely on NDA data room materials and
              management representations. This is not unusual for late-stage private rounds but is a meaningful
              risk factor in establishing high-confidence conviction. The thesis-break and kill trigger table
              defines the specific events that would require a reassessment of the recommendation, and the
              final diligence table specifies the six information requests that would upgrade conviction from
              medium to high.
            claimRefs:
