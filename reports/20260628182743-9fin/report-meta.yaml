companyProfile:
  summary: >-
    9fin is a private AI-native intelligence platform for the global debt capital markets, founded in London
    in 2016 by Steven Hunter (CEO) and Hussam El-Sheikh (CTO). The platform centralises news, proprietary
    structured data, analytics, and AI-powered workflows for credit professionals across high-yield bonds,
    leveraged loans, distressed debt, CLOs, private credit, and investment-grade markets. As of March 2026,
    9fin achieved unicorn status following a $170 million Series C at a $1.3 billion post-money valuation,
    bringing total capital raised to over $250 million. The company serves 350+ leading institutions,
    including all top-10 global investment banks, and had approximately 400 employees as of April 2026.
    Financial disclosure is limited: no audited revenue, ARR, or margin data is publicly available.
