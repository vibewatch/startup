  topStrengths:
    - Proven penetration of all top-10 global investment banks and 350+ leading institutions
      confirms genuine product-market fit in a historically technology-resistant asset class.
    - Company-reported multiple consecutive years of approximately 100% ARR growth, if verified,
      would place 9fin among the fastest-growing enterprise SaaS platforms in institutional fintech.
    - CPP Investments participating in the Series C as an existing daily-use client is an
      exceptionally strong endorsement of platform quality and stickiness.
    - Structural macro tailwinds — digitisation of the $145 trillion global debt capital markets
      and AI embedment in institutional workflows — create durable demand for the platform's core offering.
    - APAC launch in April 2026 and new AI Chat and Research Grid products extend geographic and
      product expansion vectors without pivoting from the core B2B data model.
  topRisks:
    - No audited revenue, ARR, NRR, gross margin, or burn rate data is publicly available,
      making financial underwriting conditional on NDA-level disclosure.
    - Bloomberg AskB and AlphaSense (now $600M ARR at $7.5B valuation) are expanding aggressively
      into credit-market workflows, threatening displacement on two flanks.
    - Unknown preference overhang from $250M+ raised and absence of profitability guidance
      introduce material dilution and waterfall uncertainty.
    - Valuation at implied 7–20x ARR (wide range due to undisclosed ARR) can only be
      assessed precisely with confirmed revenue figures.
  unresolvedGaps:
