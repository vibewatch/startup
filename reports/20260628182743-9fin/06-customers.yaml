  - id: "adoption-trajectory"
    title: "Adoption Trajectory"
    body: >
      9fin's adoption trajectory shows steady institutional deepening anchored to reported client
      count growth and ARR expansion. The company disclosed 300+ leading institutions as of the March
      2026 Series C announcement, rising to 350+ per the mid-2026 about page — implying an approximate
      50-institution increase within roughly three months and consistent with a trajectory from
      approximately 200 clients in late 2024. The US expansion is the primary growth vector described
      in investor communications, with multiple sources confirming the US business grew faster than
      the overall platform in the Series C period. APAC represents a new adoption surface opened
      in April 2026, with initial offices in Hong Kong and teams being built in Singapore and India.
      Latin America is already operational following a 2024-2025 expansion.


      The platform-level adoption signal of "80% of trading desks" and "all top-10 investment banks"
      represents penetration of the most institutionally critical client category in the debt capital
      markets. Multiple consecutive years of 100% ARR growth is a company-claimed figure that has not
      been independently verified or audited, but is corroborated indirectly by the scale and
      composition of Series C investor participation. The company's reference to "faster expansion in
      the United States" than the overall platform implies at least some US cohorts are growing
      faster than legacy European accounts, though no data is provided for absolute or relative
      US ARR. Milbank's independent publishing of 9fin league table rankings is a secondary adoption
      proof: it demonstrates that major law firms are actively participating in 9fin's benchmarking
      framework, implying operationally embedded usage that extends beyond passive platform access.
    claimRefs:
