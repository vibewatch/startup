callouts:
  - calloutType: "strength"
    title: "All Top-10 Investment Banks Confirmed"
    body: >
      9fin's penetration of all top-10 global investment banks and approximately 80% of trading desks
      is one of the strongest customer proof points available for a pre-IPO fintech at this stage.
      In enterprise B2B SaaS, displacing legacy workflows at the world's largest financial institutions
      requires passing compliance, security, and procurement reviews that function as a high bar for
      competitive entry. This penetration level provides both high switching-cost moat and strong
      reference validation for the remaining addressable market.
    claimRefs:
      - CU003
      - CU005

  - calloutType: "risk"
    title: "Industry-Leading Retention Is Unverified"
    body: >
      9fin's claim of "industry-leading retention" cannot be independently assessed without NRR, GRR,
      or cohort data. The structural retention argument is credible given high switching costs and
      institutional clients, but the absence of audited financial disclosure means there is no basis
      to underwrite the retention narrative quantitatively. A single large-client loss or a downgrade
      in a key account relationship could create material ARR impact given the probable revenue
      concentration in a small number of top-tier bank and asset manager accounts.
    claimRefs:
      - CU011
      - CU032

  - calloutType: "recommendation"
    title: "Priority NDA-Level Diligence on Retention and Concentration"
    body: >
      The two highest-priority diligence requests for this chapter are: (1) NRR and GRR by cohort
      vintage and segment for at least three fiscal years, and (2) the top-10 client revenue
      concentration ratio. These two data points determine whether the ARR growth trajectory is durable
      or dependent on continuous new-logo acquisition to replace undisclosed churn. Resolution of these
      gaps changes the investment thesis materially.
    claimRefs:
      - CU011
      - CU032

