  - id: "named-customer-proof"
    title: "Named Customer Proof and Evidence Quality"
    body: >
      9fin has publicly confirmed a small but high-profile roster of named clients that collectively
      provide the strongest publicly verifiable proof of institutional adoption. KKR, Apollo Global
      Management, BNP Paribas, and Kirkland & Ellis are named explicitly in 9fin's April 2026 APAC
      launch press release and independently confirmed by multiple news outlets, establishing
      production-level deployment at marquee institutions across buy-side, sell-side, and legal
      verticals. CPP Investments stands out as a particularly strong reference: the Canadian pension
      fund was already a 9fin client before participating as an investor in the $170 million Series C
      in March 2026, an arrangement that HarbourVest and the company both described as a "testament
      to the platform's value." This dual customer-investor relationship carries high evidentiary
      weight because it implies the client's internal fiduciary evaluation independently validated
      product value prior to financial commitment.


      Two published customer case studies provide the most granular named evidence. IK Partners, a
      European mid-market private equity firm managing over €20 billion, switched from a patchwork
      of legacy data sources to 9fin for real-time debt market intelligence spanning syndicated and
      private credit. A separate published case study features an anonymised leading European
      alternative credit specialist (hedge fund/private credit manager) whose VP of investor relations
      and investment director cited 9fin for superior breadth and timeliness in private credit, high
      yield, and CLO market tracking. Third-party validation arrives from Milbank LLP, which was
      ranked number one lender counsel in 9fin's inaugural H1 2025 Private Credit Law Firm League
      Tables across the US and Europe — a ranking Milbank independently announced on its website,
      confirming deep client usage of 9fin's proprietary league-table infrastructure. FeaturedCustomers
      aggregates 24 testimonials and reports a 4.8/5 star rating across 500 reference ratings for 9fin.
    claimRefs:
