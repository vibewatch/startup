chapter:
  number: 6
  title: "Customers"
  summary: >
    9fin serves 350+ leading financial institutions as of mid-2026, including all top-10 global investment
    banks, 80% of trading desks, and named clients such as KKR, Apollo Global Management, BNP Paribas,
    Kirkland & Ellis, CPP Investments, and IK Partners. The company claims multiple years of 100% ARR
    growth and industry-leading retention, but NRR, GRR, and cohort data are not publicly disclosed,
    limiting independent verification of durability. Concentration risk and customer revenue distribution
    are also undisclosed, representing the primary underwriting gap for this chapter.

sections:
  - id: "customer-segmentation"
    title: "Customer Segmentation"
    body: >
      9fin's customer base spans five principal institutional segments within the global debt capital
      markets ecosystem. Investment banks — including all top-10 global institutions — represent the
      highest-value segment by revenue and strategic penetration, using 9fin for deal origination
      screening, sales and trading risk monitoring, and restructuring process support. Buy-side
      participants, comprising asset managers and hedge funds collectively managing over $17 trillion
      in AUM, form the second major segment, leveraging the platform for portfolio rebalancing,
      relative-value analysis, and AI-powered research automation. Law firms constitute a distinct
      and high-profile vertical: 9fin penetrates top-tier leveraged finance law practices through
      covenant analysis, precedent search, and documentation intelligence. Private credit funds and
      advisory/restructuring firms complete the primary segment picture, using the platform to monitor
      opaque private credit markets where public information is most fragmented.


      Geographically, the platform's footprint spans Europe (the core revenue market), North America
      (the fastest-growing region per 9fin's own statements), Latin America (expanded in 2024-2025),
      and Asia-Pacific (formally launched April 2026 with coverage of 1,800+ issuers and 16,000
      instruments). A CEEMEA expansion is announced as the next phase. 9fin's enterprise-only model —
      no free tier, direct sales only, institutional contracts — implies average contract values well
      above $100,000, concentrating the customer base in large regulated entities with multi-year
      procurement cycles. The company does not publicly disclose the revenue split across segments
      or the share of revenue from its top clients.
    claimRefs:
      - CU001
      - CU003
