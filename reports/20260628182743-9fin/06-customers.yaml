      - TU004
    figureRefs:
      - FU004

  - id: "expansion-concentration"
    title: "Expansion and Concentration Risk"
    body: >
      9fin's land-and-expand motion operates through three documented pathways: seat addition within
      existing institutional clients, geographic region extensions as the platform enters new markets
      (Latin America, APAC, and planned CEEMEA), and premium AI tier upsells such as AI Chat and
      Research Grid launched alongside the Series C deployment in June 2026. The seat-expansion
      pathway is particularly natural for institutional clients where initial deployments cover one
      desk or product line and subsequent renewals add coverage areas. CPP Investments' progression
      from client to investor signals deep platform commitment and likely broad internal deployment.
      IK Partners' transition from fragmented legacy sources to 9fin for all debt market intelligence
      illustrates how initial deployment can expand into primary workflow dependency.


      Concentration risk is the primary undisclosed structural concern. 9fin does not publicly report
      the revenue share from its top 1, 5, or 10 clients. Given that all top-10 global investment
      banks are confirmed clients, and that banks typically represent the highest ACV institutional
      subscriber category, it is plausible — though unverified — that a small number of bank
      relationships contribute a disproportionate share of ARR. The company's "80% of trading desks"
      claim implies very high penetration among the most sophisticated institutional buyers, which
      reduces the risk of acquiring new mega-clients but increases the renewal risk of existing
      concentrations. Procurement friction is structurally high in regulated financial institutions
      due to multi-stakeholder security reviews, compliance approvals, and budget cycles. This
      friction cuts both ways: it increases the cost of winning new clients but also raises the
      switching cost for existing ones. The absence of any disclosed procurement failure, client
      loss, or public complaint reinforces the retention narrative but does not substitute for
      audited retention metrics.
    claimRefs:
      - CU032
      - CU033
      - CU034
      - CU006
      - CU013
      - CU031
      - CU039
