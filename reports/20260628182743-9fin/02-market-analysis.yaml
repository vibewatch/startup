  - id: "market-sizing-tam-sam-som"
    title: "Market Sizing: TAM, SAM, and Constrained Lenses"
    body: >
      Three sizing lenses are needed to frame 9fin's opportunity without relying on a single broad estimate.

      The broadest lens — the underlying debt asset class — positions context for the intelligence
      opportunity but is not a software revenue market in itself. The OECD Global Debt Report 2026
      documents combined sovereign and corporate bond markets of $109 trillion, while EMDE sovereign
      bonds add $12.1 trillion. Total global debt (all sectors including loans and private debt) reached
      $353 trillion as reported by the Institute of International Finance. The BIS tracks $34.3 trillion
      in international debt securities outstanding as of Q1 2026. Global gross borrowing is projected at
      $29 trillion in 2026, a 17% increase over 2024, reflecting both sovereign refinancing needs and
      corporate AI-driven capex programmes. 9 major technology hyperscalers alone raised $122 billion
      from bond markets in 2025. This first lens validates the scale of the underlying activity but cannot
      directly translate to software revenue.

      The second lens is the financial analytics software market. Mordor Intelligence values the global
      financial analytics market at $13.87 billion in 2026 and projects 11.05% CAGR through 2031 to
      $23.42 billion. The AI-powered fixed income analytics sub-segment is estimated by QY Research at
      $6.3 billion in 2025, reaching $7-8 billion by 2026 and approximately $13.7 billion by 2032 at
      12-13% CAGR. Opimas estimates total capital markets technology spending at $163 billion in 2023,
      growing to $244 billion by 2028 at 8% per year, with vendor-provided external software at
      approximately $48 billion. 9fin's SAM is a DCM-specific subset of the financial analytics market
      — not the full $13.87 billion — since only a fraction of financial analytics spend targets
      credit/debt workflows. An estimated SAM of $3-8 billion for DCM-specific intelligence software
      is defensible but lacks direct third-party validation.

      The third lens — the specific leveraged finance and private credit sub-markets 9fin most directly
      serves — provides the clearest growth signal. ION Analytics / Debtwire reported combined US and
      European leveraged finance issuance (high-yield bonds and leveraged loans) at USD 1.73 trillion in
      2025, the second-highest annual level on record. US high-yield bond issuance exceeded $325 billion
      (17% year-on-year), while European HY reached €141 billion (an all-time record). US leveraged
      loans outstanding stood at $1.55 trillion. Private credit AUM surpassed $2 trillion globally in
      2025 and is projected to reach $3.4 trillion by 2030 according to PwC and Preqin. CLO issuance
      is projected at $150-230 billion in 2026, with private credit CLOs accounting for approximately
      20% of that total. This sub-market activity level directly determines the number of transactions,
      deals, and credits 9fin's platform must track — the more activity, the higher the information need.

      The SOM (serviceable obtainable market) is not calculable from public data. 9fin reported 350+
      institutional clients in mid-2026 and multiple consecutive years of 100% ARR growth, with ARR
      undisclosed. A rough floor estimate at average annual contract values of $50,000-$200,000
      per institution yields $17.5-70 million ARR for 350 clients — a highly uncertain range that
      would represent 0.1%-0.5% of the $13.87 billion SAM proxy market.
