chapter:
  number: 2
  title: "Market Analysis"
  summary: >
    9fin targets the global debt capital markets (DCM), a $109 trillion-plus outstanding asset class spanning
    leveraged finance, private credit, CLOs, distressed debt, investment grade, and asset-backed finance. Its
    addressable software market — DCM-focused intelligence and analytics — sits within a $13.87 billion global
    financial analytics market growing at 11% CAGR through 2031. Six buyer segments drive adoption: bulge-bracket
    investment banks, regional banks, credit hedge funds, fixed income asset managers, law firms, and private
    credit funds. Growth is propelled by converging loan/bond/private credit markets, AI adoption, and
    record-level leveraged finance and private credit activity; the primary constraint is Bloomberg's
    deeply embedded, high-switching-cost incumbency in institutional workflows.

sections:
  - id: "market-boundary-and-definition"
    title: "Market Boundary and Definition"
    body: >
      9fin defines its market as the global debt capital markets (DCM): the universe of professional
      institutions that originate, trade, invest in, or advise on debt instruments. This spans leveraged
      finance (high-yield bonds and leveraged loans), private credit (direct lending, business development
      companies, and unitranche), collateralised loan obligations (CLOs), distressed debt and restructuring,
      investment grade bonds, and asset-backed finance (ABF). The $145 trillion figure cited by 9fin in its
      Series C announcement refers to the broadest definition of the global debt universe; the OECD's
      Global Debt Report 2026 measured combined sovereign and corporate bond markets at $109 trillion
      outstanding, with $36.4 trillion in corporate bonds and $23.1 trillion in syndicated loans. The
      difference in scale reflects scope: 9fin's framing includes private/unlisted debt, loans, and
      instruments outside the OECD bond-market perimeter.

      Within this universe, 9fin's product perimeter covers information and workflow intelligence —
      news, structured data, analytics, covenant review, new issue calendars, and AI-powered research —
      rather than trade execution, clearing, or settlement infrastructure. The immediate substitute for
      9fin is the Bloomberg Terminal, which provides broad fixed-income data and messaging but lacks
      DCM-specialist depth; adjacent substitutes include Debtwire, Reorg Research, LCD (S&P Global),
      Fitch Solutions, and Acuris. Status-quo alternatives include manual processes: analysts collating
      data from PDFs, emails, data rooms, and pitchbooks, which 9fin CEO Steven Hunter describes as
      methods dating to the 1980s despite the market's $145 trillion scale. Excluded from 9fin's boundary
      are: equity markets, retail/consumer lending, foreign exchange and derivatives, and general-purpose
      enterprise analytics platforms (e.g., Tableau, Salesforce).

      The ongoing convergence of traditionally separate segments — banks and private credit funds now
      compete for the same large-cap loans, and broadly syndicated and private-credit CLO collateral
      increasingly blends — expands 9fin's addressable boundary over time. Latin American and APAC
      coverage, launched in 2025 and April 2026 respectively, add geographic scope. The resulting
      boundary is wide but coherent: any institution with a professional role in originating, investing
      in, or advising on non-equity debt instruments at institutional scale.
