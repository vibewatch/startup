      whyItMatters: "Without a precise SAM estimate, it is not possible to objectively assess 9fin's penetration rate, growth ceiling, or path to a specific valuation multiple. The $3-8B range is too wide to anchor investment valuation."
      diligencePath: "Commission a bespoke market study from Celent, Opimas, or Coalition Greenwich specifically focused on DCM intelligence/workflow software spend per institution type."
      relatedQuestionRefs: [QM027]

    - type: private-evidence-only
      severity: material
      topic: "9fin ARR and ACV"
      missingEvidence: "9fin's actual ARR, net revenue retention rate, and average contract value by buyer segment type are not publicly disclosed."
      whyItMatters: "Without ARR data, the SOM cannot be calculated; without ACV data, buyer segment economics and upsell ceiling cannot be quantified. Valuation at $1.3 billion on undisclosed ARR makes SaaS multiples unverifiable from public sources."
      diligencePath: "Request ARR, NRR, and ACV breakdown by buyer segment (investment banks vs. hedge funds vs. asset managers vs. law firms) in due diligence data room."
      relatedQuestionRefs: [QM009]

    - type: conflicting-data
      severity: minor
      topic: "TAM estimate conflict"
      missingEvidence: "Reconciliation of 9fin's $145T DCM figure with OECD's $109T combined bond market measurement, including which instruments account for the $36T difference."
      whyItMatters: "The TAM framing in investor materials is $145T but independent verification supports $109T for bond markets alone; the remaining $36T difference likely includes private debt, loans, and non-OECD instruments, but this has not been confirmed."
      diligencePath: "Request from 9fin the methodology behind the $145T figure, including which instrument categories, geographies, and data sources are included; cross-check with BIS/SIFMA/LSTA data."
      relatedQuestionRefs: [QM011, QM015]

    - type: enumeration-incomplete
      severity: minor
      topic: "Bloomberg switching cost constraint"
      missingEvidence: "Quantified data on what proportion of institutions have actually reduced Bloomberg spend after adopting 9fin, and what share-of-wallet 9fin captures relative to Bloomberg per institution."
