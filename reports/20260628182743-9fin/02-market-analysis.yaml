  - id: "buyer-user-payer-segmentation"
    title: "Buyer, User, and Payer Segmentation"
    body: >
      9fin's buyer universe decomposes into six institutional segments, each with distinct workflows,
      budget owners, and adoption paths. The segments are not exclusive — many large institutions
      operate across multiple roles simultaneously (e.g., a global bank is both an originator and
      an investor).

      Investment banks are the segment with the broadest current penetration: 9fin serves all top-10
      global investment banks and 80% of trading desks, per its own homepage. Bulge-bracket DCM and
      leveraged finance teams use 9fin primarily for deal monitoring, mandate intelligence, new issue
      calendar tracking, and competitor coverage. The budget owner is typically the DCM or leveraged
      finance group head; procurement involves a technology/data vendor review. Adoption is triggered
      by the need for speed — in a market where information asymmetry translates directly to winning
      mandates, faster access to accurate intelligence is a differentiated revenue enabler.

      Credit-focused hedge funds are the most analytically demanding segment: they require granular
      covenant review, real-time distressed alert coverage, restructuring intelligence, and CLO
      analytics to generate alpha. For these institutions, 9fin competes most directly with Reorg
      Research and Debtwire. The portfolio manager and head of research are the budget owners; the
      adoption driver is an information edge over peers.

      Fixed income asset managers use 9fin for credit research scale — replacing or augmenting the
      junior analyst function for initial screening, news monitoring, and document review. With
      AI-powered tools now capable of doing "weeks of research in minutes" (per 9fin's own
      description), the ROI case for this segment is strong, particularly in funds managing $10 billion+
      in AUM where research capacity is the binding constraint.

      Law firms are an underappreciated but strategically valuable segment. Restructuring and leveraged
      finance practices use 9fin for covenant analysis, creditor group intelligence, and deal origination
      support. CPP Investments — a 9fin client before becoming an investor in the Series C — exemplifies
      the asset manager/investor crossover. Law firms were explicitly named as key adopters in 9fin's
      public communications.

      Private credit funds represent the fastest-growing adoption frontier. As private credit AUM
      surpassed $2 trillion globally and competition for deals intensifies, 9fin's proprietary pipeline
      intelligence and convergence across BSL and private credit markets provides a differentiated
      sourcing capability. CLO managers — a sub-segment of both private credit and asset management —
      use the platform for new issue tracking and portfolio surveillance.

      Across all segments, the buyer (institution that contracts with 9fin), user (analyst/PM who
      operates the platform daily), and payer (budget holder who approves the spend) are typically
      three distinct roles. This three-party dynamic lengthens the enterprise sales cycle but, once
      established, drives strong retention because the platform becomes embedded in daily workflow.
