callouts:
  - calloutType: "insight"
    title: "Market Convergence Creates a Wider Boundary Than Any Single Sub-Market Implies"
    body: >
      9fin's effective TAM is not fixed by any one DCM sub-market. The convergence of broadly
      syndicated loans, private credit, and high-yield bonds into a single institutional intelligence
      need — and 9fin's 2025-2026 expansion into LatAm, APAC, private credit, ABF, and investment
      grade — means the market boundary is actively widening. Any sizing estimate based only on the
      leveraged finance market or only on the financial analytics market understates the total
      opportunity as convergence continues.
    claimRefs:
      - CM029
      - CM008
      - CM009

  - calloutType: "risk"
    title: "Bloomberg Incumbency Is a Structural Adoption Constraint, Not Just a Pricing Hurdle"
    body: >
      Bloomberg's DCM market position is not primarily a price problem but a network problem: its
      messaging infrastructure (IB Chat) is embedded in deal communication workflows, and leaving
      Bloomberg means ceding access to a counterparty communication network used by the entire market.
      9fin's strategy of entering as an additive tool (not a replacement) limits the short-term
      budget displacement it can achieve per institution and constrains net revenue expansion relative
      to a pure replacement scenario.
    claimRefs:
      - CM036
      - CM037

  - calloutType: "assumption"
    title: "9fin's SAM Cannot Be Directly Measured from Public Data"
    body: >
      No authoritative third-party estimate isolates the DCM-specific intelligence and analytics
      software market as a distinct sub-segment. The $13.87 billion Mordor Intelligence financial
      analytics figure covers all financial analytics (BFSI), and the $48 billion Opimas external
      software number covers all capital markets technology. 9fin's true SAM — DCM professional
      intelligence tools — is estimated at $3-8 billion but this is analyst synthesis without a
      dedicated primary study. This gap is the primary sizing diligence ask.
    claimRefs:
      - CM039
      - CM040

