company:
  name: "9fin"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >
    9fin is an AI-native intelligence platform for global debt capital markets, offering unified data,
    analytics, news, and AI-powered workflows through a single SaaS subscription product covering
    high-yield bonds, leveraged loans, distressed debt, CLOs, private credit, asset-based finance,
    and investment grade debt. The platform achieved SOC 2 Type I and II attestations in October 2025
    and launched AI Chat and Research Grid in June 2026, deepening workflow automation across covenant
    analysis, document intelligence, and credit research. The Bond Radar acquisition (March 2025) added
    20 years of IG/EM issuance history and geographic coverage expanded into Latin America (September 2025)
    and APAC (April 2026). Key technical risks include dependency on third-party LLM providers, AI
    extraction accuracy gaps noted by users, and restricted API access limiting developer ecosystem growth.

sections:
  - id: "product-service-definition"
    title: "Product & Service Definition"
    body: >
      9fin delivers a unified intelligence platform for credit professionals operating in the global debt
      capital markets. The platform consolidates news, structured data, analytics, and AI-powered workflows
      across all major debt asset classes — high-yield bonds, leveraged loans, distressed debt, collateralised
      loan obligations (CLOs), private credit, asset-based finance (ABF), and investment grade debt.
      Customers interact with 9fin through a web-based interface providing a single, connected workflow
      that replaces the fragmented, multi-tool approach historically used by credit teams.

      The product is positioned as a system of intelligence rather than a data terminal. Unlike traditional
      financial data platforms that primarily aggregate raw price and reference data, 9fin combines real-time
      editorial coverage from in-house journalists, lawyers, and analysts with proprietary structured data
      and AI tools that synthesize these inputs into actionable outputs. The platform covers the full
      credit workflow from deal origination and primary market monitoring through to secondary trading,
      portfolio monitoring, and restructuring or distressed analysis. The company's platform page describes
      the value proposition as helping credit teams "save time, win business, and stay ahead of the market"
      by bringing data, documents, and news into one place built for how credit actually works.

      User roles served include credit analysts, portfolio managers, investment bankers, leveraged finance
      lawyers, and restructuring advisors. Institutional buyer segments span top-tier investment banks,
      buy-side asset managers, hedge funds, private credit funds, and law firms. As of mid-2026, 9fin
      reported 350+ institutional clients and 350+ employees; the about page describes 80% of trading desks
      and all top-10 global investment banks among its clients. Geographic coverage as of the runDate spans
      North America, Europe, Latin America (since September 2025), and Asia-Pacific (since April 2026).
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006]
    tableRefs: [TE001, TE002]
    figureRefs: [FE002]

  - id: "architecture-operating-model"
    title: "Platform Architecture & Operating Model"
    body: >
      9fin is built as a cloud-native, AI-native platform. The technical architecture layers data ingestion
      and normalisation at the base, AI and analytics processing in the middle, and editorial content and
      user-facing applications at the top. Data sources include public filings, PDFs, offering documents,
      news feeds, emails, and Bond Radar's historical issuance data. The platform processes these through
      NLP and AI pipelines that extract, classify, and structure covenant terms, financial metrics, deal
      timelines, and credit signals.

      The AI engine is built on a combination of proprietary and third-party large language models fine-tuned
      and calibrated for debt capital markets use cases. CEO Steven Hunter has stated that the winners in AI
      will be defined by "the quality of the intelligence those models are built on," positioning 9fin's
      proprietary data and editorial network as the core moat. CPO Moisés García confirmed that all AI
      outputs are grounded in 9fin's proprietary debt market data and linked back to original source
      material. This citation architecture — where every AI-generated answer traces to an underlying
      document or data point — is a deliberate design choice to maintain auditability and enterprise-grade
      trust. The in-house editorial team of credit, distressed, and legal analysts shapes and calibrates
      model outputs to ensure quality, context, and consistency.

      The Bond Radar acquisition (March 2025) extended the platform's data layer with 20 years of historical
      issuance data for high-yield, leveraged loans, investment grade, and emerging markets. Bond Radar
      content was fully integrated into the 9fin.com platform by early Q1 2026, with clients accessing
      all datasets through a single unified login. Operationally, 9fin runs a hybrid editorial and technology
      model: the platform automates data extraction and analysis while an in-house team of market journalists
      and legal specialists provides editorial coverage that feeds both human readers and AI calibration.
    claimRefs: [CE007, CE008, CE009, CE010, CE011, CE012, CE013, CE014]
    tableRefs: [TE003]
    figureRefs: [FE001, FE003]

  - id: "deployment-integration-roadmap"
    title: "Deployment, Integration & Roadmap"
    body: >
      9fin is deployed as a Software-as-a-Service platform accessed via web browser. The company provides
      APIs enabling enterprise clients to feed real-time and historical credit data, documents, and analytics
      into their internal systems, dashboards, or quantitative models. API documentation is not publicly
      available; access is gated to enterprise clients through institutional agreements and is not accompanied
      by a public developer programme or sandbox.

      The June 2026 AI tools launch introduced AI Chat and Research Grid as the two primary AI-native
      workflow modules. AI Chat allows users to query 9fin's proprietary dataset using natural language
      and receive cited, traceable answers to complex credit questions. Research Grid enables structured
      company comparisons at scale using pre-defined analyst frameworks or user-defined queries. Both tools
      are generally available as of the runDate.

      The product roadmap beyond the June 2026 AI launch targets credit-specific AI agents — autonomous
      software agents that proactively monitor the market and clients' portfolios, draft analyses and
      alerts for emerging risks and deals, and allow professionals to focus on judgment rather than data
      assembly. CPO García described this as building agents that "proactively monitor, draft and alert,
      so clients can focus on applying judgment rather than assembling inputs." Support and reliability
      commitments are not publicly disclosed; no formal SLA for platform uptime has been published,
      though the SOC 2 Type II certification implies operational availability controls.
    claimRefs: [CE015, CE016, CE017, CE019, CE020, CE021]
    tableRefs: [TE005]

  - id: "differentiation-data-moat"
    title: "Competitive Differentiation & Data Moat"
    body: >
      9fin's primary competitive differentiator is the combination of proprietary credit-market data,
      human editorial expertise, and AI systems purpose-built for debt capital markets. This differs from
      Bloomberg Terminal, which provides broad multi-asset coverage but limited specialist covenant analysis
      automation. It differs from Debtwire/Covenant Review (ION Analytics), which offers deep lawyer-led
      legal analysis but lacks a fully AI-native unified platform. AlphaSense provides general AI search
      across financial documents but is not purpose-built for debt workflows.

      The data moat has three components: first, 20+ years of historical deal data, bond and loan terms,
      and covenant packages accumulated organically and deepened through the Bond Radar acquisition;
      second, a proprietary editorial network of credit journalists and legal analysts who generate
      exclusive market intelligence that cannot easily be replicated by pure technology players; and third,
      network effects from serving all top-10 global investment banks and 350+ institutions, which reinforces
      data coverage and benchmarking breadth.

      9fin's AI tools are differentiated by their grounding in verified proprietary data and their
      transparency — every output cites its underlying source. Third-party reviewer and user feedback
      in 2026 describes the platform as a major time-saver for manual credit tasks, while independent
      analysts characterise 9fin as a signal that "credit is becoming an AI-native category," positioning
      the company as infrastructure rather than just a tool. Coverage limitations relative to Bloomberg
      in niche and private instruments, and limited developer API access, remain structural constraints.
    claimRefs: [CE022, CE023, CE024, CE025, CE026, CE027, CE028]
    figureRefs: [FE004]

  - id: "trust-security-compliance"
    title: "Trust, Security, Privacy & Compliance"
    body: >
      Enterprise trust and regulatory compliance are central to 9fin's product positioning. The company
      achieved SOC 2 Type I, Type II, and SOC 3 attestations in October 2025, with the Type II audit
      finding no exceptions — demonstrating operational effectiveness of security controls over an extended
      audit period. Regular third-party audits and vulnerability testing are standard practice. Clients
      operating under strict data residency and regulatory requirements are supported by a zero data
      retention policy for AI model inputs: client data does not train the underlying AI models.

      As a UK-incorporated company (9FIN LIMITED, Companies House number 10451957) with operations serving
      European and US institutions, 9fin is subject to GDPR (EU/UK) and relevant financial data handling
      regulations. The platform does not hold or process client trading positions or confidential portfolio
      data; it provides intelligence to inform decisions rather than execute them, which limits direct
      regulatory exposure compared with systems that process client assets or orders.

      Key compliance limitations include the absence of a publicly disclosed uptime SLA, limited public
      information on data lineage and rights for third-party data integrated through Bond Radar, and
      dependence on third-party LLM providers whose data handling practices introduce supply-chain risk.
      User reviews note that AI extraction is not always perfectly accurate, requiring manual validation
      in some cases — a risk that increases as clients place greater reliance on automated credit outputs.
    claimRefs: [CE029, CE030, CE031, CE032, CE033, CE034, CE035]
    tableRefs: [TE004]

