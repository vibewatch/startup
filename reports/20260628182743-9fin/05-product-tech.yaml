callouts:
  - calloutType: "strength"
    title: "AI-Native Architecture with Verified Data Grounding"
    body: >
      9fin's AI tools are differentiated by their grounding in a proprietary, human-calibrated corpus
      of credit market data. Every AI output cites its underlying source, providing the transparency
      and auditability that enterprise financial institutions require. This design — where editorial
      expertise shapes AI accuracy — creates a structural barrier that pure LLM-based entrants cannot
      easily replicate without decades of credit-specific data and specialist human talent.
    claimRefs: [CE007, CE008, CE009, CE022, CE024]

  - calloutType: "risk"
    title: "Third-Party LLM Dependency and AI Accuracy Limitations"
    body: >
      9fin's AI engine relies on third-party large language model providers, creating dependency risk
      if providers change pricing, access terms, or data handling policies. Independent user reviews
      note that AI data extraction is not always perfectly accurate, requiring manual validation in some
      use cases — a risk that could erode enterprise trust as clients increase reliance on automated
      credit outputs in high-stakes investment decisions.
    claimRefs: [CE010, CE026, CE034, CE035]

  - calloutType: "risk"
    title: "Closed API and Coverage Gaps Constrain Ecosystem Reach"
    body: >
      9fin's API is gated to enterprise clients with no public documentation, limiting the developer
      ecosystem that could build on the platform and create additional distribution. Coverage limitations
      relative to Bloomberg Terminal in niche, private, and non-standard instruments represent a
      retention risk for larger multi-asset teams who maintain Bloomberg as a primary system of record.
    claimRefs: [CE019, CE025, CE027, CE028]

