callouts:
  - calloutType: "strength"
    title: "Proprietary Data Corpus Is 9fin's Deepest Moat"
    body: "The combination of 20-plus years of credit deal history, AI models trained on domain-specific documents, and human editorial oversight creates a data-and-model corpus that would take any new entrant years to replicate. This asset is not just the data itself but the structured extraction of 100-plus covenant data points per loan that makes the database analytically useful—not merely large."
    claimRefs:
      - CP021
      - CP022
      - CP030

  - calloutType: "risk"
    title: "Octus CreditAI Is the Sharpest Competitive Threat to 9fin's AI Lead"
    body: "Octus's March 2026 CreditAI launch targets the exact workflow—covenant and credit agreement analysis—where 9fin claims its primary differentiation. With over 10,000 domain-tuned prompts, PE-backed capital, and existing relationships at the same law firms and credit funds, Octus has both the technical architecture and the distribution to compress 9fin's current AI lead within one to two product cycles."
