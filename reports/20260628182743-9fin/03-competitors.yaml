  - calloutType: "insight"
    title: "Multi-Homing Is a Double-Edged Dynamic for 9fin"
    body: "The near-universal practice of retaining Bloomberg while adding specialist platforms means 9fin faces limited head-on displacement risk from Bloomberg but also cannot charge full-platform pricing. Multi-homing caps 9fin's pricing power at the incremental value it delivers above Bloomberg for analytical workflows, which means its competitive strategy must focus on depth and efficiency gains rather than cost substitution."
    claimRefs:
      - CP029
      - CP032
      - CP034

  - calloutType: "recommendation"
    title: "Benchmark 9fin's AI Accuracy Against Octus and Bloomberg Before Extending Moat Premium"
    body: "Investors should request an independent covenant-analysis accuracy benchmark comparing 9fin, Octus CreditAI, and Bloomberg AskB on a representative set of complex credit agreement test cases. Until such a benchmark exists, the AI moat claim rests on company assertions rather than third-party verification—a material diligence gap given that Octus is now also claiming domain-superior AI capabilities."
