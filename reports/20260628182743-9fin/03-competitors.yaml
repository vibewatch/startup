  - id: "capability-pricing-gtm-comparison"
    title: "Capability, Pricing, and GTM Comparison"
    body: |
      9fin's most defensible capability is AI-powered covenant and document analysis covering more than 100 data points per loan, combined with over 20 years of proprietary debt deal history. This asset base is difficult to replicate because it requires systematic collection of credit agreement filings, proprietary editorial enrichment by journalists and legal specialists, and AI model training over years of iteration. 9fin's AI Chat and Research Grid tools, launched in 2026, enable users to perform cited, structured Q&A against covenants, financials, and legal documents—reducing research time from hours to minutes for workflows that previously required manual document review. The platform reports serving nearly 200 of the largest credit market participants including investment banks, asset managers, private equity firms, and law firms.

      On pricing, 9fin has not published list rates but positions itself below Bloomberg's $25,000–$32,000 per seat, targeting modern SaaS-style contracts at the firm and module level. Octus Intelligence and S&P Global LCD operate in a similar $20,000–$80,000 enterprise range depending on user count and data scope; AlphaSense offers five enterprise pricing tiers from $10,000 to $100,000 per user per year. The pricing landscape means 9fin's value proposition must justify incremental spend above Bloomberg rather than displace it outright for most large institutional buyers.

      GTM differences are significant. Bloomberg, LSEG, S&P Global, and Octus deploy large enterprise sales forces and benefit from established procurement relationships at major banks. 9fin operates a leaner, digitally-led sales motion supplemented by product-qualified leads through free-tier access, creating a cost advantage but a distribution risk at large global financial institutions. S&P Global's March 2026 expansion into private credit performance datasets—alongside its existing iLEVEL workflow for loan administration—illustrates how incumbents are systematically extending into segments 9fin targets for growth.
