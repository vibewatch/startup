  - id: TV002
    title: "Investment Thesis and Anti-Thesis"
    columns:
      - Dimension
      - Investment Thesis
      - Anti-Thesis
      - What Would Change the View
    rows:
      - - Market
        - DCM is the $145T largest asset class; intelligence tools are structurally underinvested
        - Market is niche and Bloomberg's 90%+ terminal penetration makes displacement unlikely at scale
        - Demonstrated sequential share gains vs Bloomberg measured by new client wins at Tier 1 banks
      - - Product
        - AI-native platform trained on 20+ years of proprietary debt data; covenant analysis moat
        - Bloomberg AskB and AlphaSense credit expansion replicate AI layer at scale with superior distribution
        - Bloomberg fails to match 9fin's covenant analysis depth in head-to-head client benchmarks
      - - Customers
        - 350+ FIs including all top-10 global banks; CPP Investments as client-investor is rare signal
        - Client base concentrated in early adopters; expansion within accounts and into second-tier banks unproven at scale
        - Disclosed NRR above 115% and successful penetration of 20+ second-tier bank clients in US
      - - Financials
        - Multiple consecutive years of 100% ARR growth with industry-leading retention
        - ARR is company-claimed and unaudited; FY2024 accounts not yet filed; burn rate undisclosed
        - Filed FY2024 statutory accounts or NDA disclosure confirming ARR figure and NRR above 110%
      - - Competition
        - Octus is narrower; 9fin offers broader coverage across DCM segments with deeper AI tooling
        - AlphaSense at $600M ARR and $7.5B valuation is entering credit markets with massive funding advantage
        - 9fin ARR growth stays above 80% despite AlphaSense's credit expansion through 2027
      - - Valuation
        - $1.3B aligns with 7–20x ARR; defensible vs AlphaSense 12.5x and premium to public data comps
        - Private round at premium to public comps; illiquid; preference overhang unknown; down-round risk if growth misses
        - Disclosed ARR supports 15–18x multiple at current valuation; credible path to $2B+ exit within 5 years
    notes: >-
      Thesis and anti-thesis rows are analyst judgments synthesising evidence from all eight chapters.
      "What would change the view" column defines objective, observable conditions, not forecasts.
