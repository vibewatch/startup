  - id: TV006
    title: "Final Diligence Asks"
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - "Owner / Diligence Path"
    rows:
      - - Audited ARR and Revenue
        - FY2024 audited ARR figure, year-on-year growth rate, and revenue recognition policy
        - Without it the 100% ARR growth claim is unverifiable and valuation multiples cannot be benchmarked
        - "NDA data room or await Companies House FY2024 statutory accounts (expected Q3–Q4 2026)"
      - - NRR and GRR
        - Net revenue retention and gross revenue retention metrics by cohort and geography
        - These are the most critical SaaS health indicators; absence prevents underwriting at high confidence
        - NDA data room; request management KPI dashboard with cohort-level retention
      - - Burn Rate and Runway
        - Monthly cash burn, projected operational runway from $170M Series C, and profitability timeline
        - At unknown burn rate the $170M could represent 18 months or 5 years; fundamentally changes risk profile
        - "NDA; request CFO operating model and board-approved financial plan"
      - - Cap Table and Preference Stack
        - Full capitalisation table with preference amounts, liquidation waterfall, and anti-dilution provisions
        - Preference overhang determines whether common investors participate in any exit below a threshold value
        - "Request from management; Companies House SH01 (April 2026) provides partial share allotment data"
      - - US ARR Contribution
        - US vs EMEA vs APAC ARR split, US-specific growth rate, and pipeline by segment
        - US is the declared primary growth market; without US ARR the growth durability thesis cannot be evaluated
        - NDA; request by-geography revenue disclosure and US sales pipeline report
      - - AI Model IP and Training Data Provenance
        - Legal status of AI training data, copyright position, licensing agreements, and litigation exposure
        - AI copyright litigation risk is the highest unresolved IP risk; model provenance may affect enterprise procurement
        - Legal NDA; IP due diligence brief; review training data licensing documentation and legal counsel opinion
    notes: >-
      Diligence asks are ranked by materiality to the investment decision. Items 1–3 are investment
      prerequisites; items 4–6 are risk-calibration requirements for conviction. All items require NDA execution.
