  - id: TV005
    title: "Thesis-Break and Kill Trigger Table"
    columns:
      - Trigger
      - "Threshold / Event"
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Bloomberg AskB wins flagship bank clients
        - Loss of two or more top-10 global bank subscribers to Bloomberg's native AI offering
        - Removes premium pricing power; signals Bloomberg can bundle AI at institutional scale; destroys DCM specialist moat thesis
        - Immediate re-evaluation; downgrade recommendation to Avoid; pause any capital commitment
      - - ARR growth falls below 50% YoY
        - Company or leaked evidence shows YoY ARR growth below 50% for two consecutive quarters
        - Breaks multi-year 100% ARR growth narrative; signals market saturation or structural churn; multiple compresses sharply
        - Mark valuation down 30–50%; require audited ARR and NRR disclosure before any re-engagement
      - - AlphaSense penetrates credit-specialist workflows at scale
        - AlphaSense surpasses 200 dedicated credit-specialist clients with a covenant/DCM product line
        - Closes AI-native specialist moat at 9x the current ARR scale and $7.5B of capital; intensifies pricing pressure
        - Re-assess differentiation; evaluate multi-homing risk; assess whether 9fin retains pricing premium
      - - Filed FY2024 accounts show operating losses materially above $40M
        - Companies House FY2024 statutory accounts reveal operating losses exceeding prior growth-stage benchmarks
        - Implies runway is shorter than $170M capital suggests; raises viability risk and ability to sustain US expansion
        - Trigger NDA access immediately; reassess burn trajectory and Series D timeline
      - - Down round at next financing event
        - Series D or secondary transaction completes below $1.3B post-money valuation
        - Signals growth disappointment and market repricing; preference overhang accelerates; LP confidence erodes
        - Pause engagement; require independent financial audit and credible path to profitability before re-entry
    notes: >-
      Thresholds are analyst-calibrated indicators based on available peer data and growth benchmarks.
      Transmission logic is qualitative; actual impact would depend on timing, magnitude, and management response.
