callouts:
  - calloutType: recommendation
    title: "Track: Compelling Platform, Evidence Gaps Prevent Buy"
    body: >-
      9fin's AI-native debt intelligence platform demonstrates characteristics of a premium category
      winner: proprietary data moat, top-10 bank penetration, company-claimed 100% ARR growth, and
      one of the strongest independent endorsements available — a sophisticated institutional investor
      using the platform and investing in the company. However, the absence of audited financials,
      undisclosed NRR, and unknown burn rate are material underwriting gaps that prevent a buy
      recommendation. Track and request NDA access. Upgrade to Buy conditional on NDA-level financial
      disclosure confirming ARR, NRR above 110%, and burn runway exceeding 30 months from Series C close.
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV037
      - CV042

  - calloutType: risk
    title: "Valuation Premium Requires Sustained Execution"
    body: >-
      At $1.3B, 9fin trades at an estimated 7–20x ARR, with the fair-value range of 15–18x implying
      an ARR of $72–87M. If ARR growth decelerates below 50% YoY or Bloomberg successfully deploys
      AskB for leveraged finance workflows at scale, the multiple must compress and the valuation
      faces a down-round risk. A 50% multiple compression — consistent with 2022–2023 SaaS selloff
      precedent — would place 9fin at $650M. Investors considering entry above $1.3B should require
      audited ARR confirmation first.
    claimRefs:
      - CV001
      - CV021
      - CV032
      - CV035
      - CV043

  - calloutType: strength
    title: "CPP Investments' Client-to-Investor Journey Is a Rare Signal"
    body: >-
      CPP Investments, the pension fund for millions of Canadians, was a paying 9fin client before
      joining the Series C as an investor. This is one of the strongest independent endorsements
      in the report: a fiduciarily constrained institutional investor running daily investment decisions
      on the platform chose to put its own capital behind the company. HarbourVest, with 40-plus years
      and over $150B in managed assets, led the round with a stated thesis of backing next-generation
      market infrastructure. These two investors represent signal quality that is qualitatively above
      the typical venture round.
    claimRefs:
      - CV006
      - CV007
      - CV025

