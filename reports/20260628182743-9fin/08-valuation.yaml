  - id: scenario-analysis
    title: "Scenario Analysis: Bull, Base, and Bear Cases"
    body: |
      The bull case rests on 9fin sustaining its 100% ARR growth trajectory, capturing meaningful share
      of the US leveraged finance market, and achieving a strategic exit — via IPO or acquisition by a
      terminal provider or large PE-backed data infrastructure platform — at 15–20x ARR by 2028–2030.
      This implies a $4B–$8B exit valuation and a 3–6x return from the $1.3B Series C mark. The
      AlphaSense comparator ($7.5B at $600M ARR, 12.5x) shows this is achievable if 9fin can scale
      to $300–500M ARR with comparable retention. The probability signal is CPP's client-investor
      position and HarbourVest's institutional mandate.

      The base case assumes ARR growth decelerates to 60–80% by 2027 as the US market matures and
      Bloomberg multi-homing becomes the norm. 9fin reaches profitability by 2028 at $100–150M ARR,
      raises a Series D at $2–3B, and exits via M&A or IPO by 2030 at $2B–$3.5B valuation. This
      provides a 1.5–2.7x return from the current mark — modest for the risk profile but consistent
      with mission-critical B2B SaaS infrastructure outcomes.

      The bear case is triggered by Bloomberg AskB successfully bundling AI-native covenant analysis
      for its top institutional clients, causing 9fin to lose two or more top-10 bank subscribers.
      Combined with an undisclosed burn rate that proves higher than growth-stage efficiency implies,
      the bear case results in a down round at $700M–$900M in 2027 and a constrained exit below the
      $1.3B entry mark. Historical precedent for SaaS multiple compression (the 2022–2023 SaaS selloff
      that 9fin itself tracked analytically) shows that high-growth premium multiples can compress by
      50–70% within 12 months if growth narratives disappoint. 9fin's own research on software sector
      distress makes the bear case risks especially credible.

      Bain's 2026 PE Report confirms that megadeal exit conditions are improving, but EY's Q1 2026
      analysis notes a 12% decline in deal value driven by recalibration of software valuations amid
      AI disruption — a sector-level headwind that applies to any late-stage, unproven-profitability
      AI-native SaaS company seeking a near-term exit.
