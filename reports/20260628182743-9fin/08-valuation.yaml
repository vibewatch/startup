chapter:
  number: 8
  title: Valuation
  summary: >-
    9fin's $1.3 billion Series C valuation in March 2026 is defensible relative to private AI intelligence peers and
    public financial data benchmarks, but lacks the audited revenue evidence needed to support a buy recommendation.
    At an implied 7–20x ARR multiple — depending on the true ARR figure — the price is fair versus AlphaSense's
    12.5x and premium to FactSet's 3.6x. The recommendation is Track with medium confidence and high risk; the
    primary upgrade condition is NDA-level financial disclosure confirming the 100% ARR growth claim and NRR metrics.

sections:
  - id: investment-thesis
    title: "Investment Thesis and Recommendation"
    body: |
      9fin occupies a structurally compelling position at the intersection of two durable macro tailwinds:
      the digitisation of the $145 trillion global debt capital markets and the embedding of AI into
      institutional financial workflows. The platform has achieved what few enterprise SaaS companies
      accomplish — penetration of all top-10 global investment banks alongside growing adoption among
      private credit funds, law firms, and asset managers. Company-reported consecutive years of 100%
      ARR growth and industry-leading retention suggest genuine product-market fit, not promotional ARR
      inflation. The addition of CPP Investments as a client-turned-investor in the Series C is an
      exceptionally strong endorsement: a sophisticated institutional investor managing retirement
      savings for millions of Canadians put trust-fund capital behind a tool it already used daily.

      The anti-thesis centres on evidence gaps and competitive risks. 9fin has not filed FY2024 statutory
      accounts at Companies House, making its ARR and retention claims entirely unverified by any independent
      source. The $170M Series C itself is well-documented, but what the money buys — in terms of
      addressable ARR, burn rate, and preference stack — remains opaque. Bloomberg's AskB roadmap and
      AlphaSense's expansion into credit workflows (now at $600M ARR and $7.5B valuation) create tangible
      displacement risk on two flanks. Without audited financials the valuation cannot be stress-tested
      from the bottom up; investment judgment must therefore remain cautious and conditional.

      The recommendation is Track. 9fin has the platform quality, institutional credibility, and growth
      narrative to justify continued monitoring and engagement, but insufficient public evidence to commit
      capital. The valuation is assessed as fair relative to the peer set — not attractive, not stretched.
      Risk is rated high owing to financial opacity, competitive intensity, and unknown preference overhang.
      Confidence is medium: the thesis is coherent and the investor signals are strong, but a material
      underwriting gap remains. An upgrade to Buy is conditional on NDA access confirming audited ARR,
      NRR ≥ 110%, and burn runway exceeding 30 months from the Series C close.
