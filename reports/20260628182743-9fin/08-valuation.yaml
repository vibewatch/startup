  - id: valuation-and-comps
    title: "Valuation Context and Comparable Analysis"
    body: |
      9fin's $1.3 billion Series C valuation implies an estimated ARR multiple of 7–20x depending on the
      undisclosed true ARR figure. At the high-growth end of the intelligence SaaS market, AlphaSense
      commands the most direct comparison: $600M ARR (Q1 2026) at $7.5B valuation equals approximately
      12.5x ARR, achieved with 73% YoY ARR growth. 9fin's company-claimed 100% ARR growth materially
      exceeds AlphaSense's, which would theoretically justify a higher multiple if growth is verified.
      However, AlphaSense is 9-10x larger in ARR scale and the $7.5B valuation is therefore 5.8x 9fin's —
      an appropriate premium for scale and evidence quality.

      Public financial data comparables trade at much lower multiples: FactSet at approximately 3.5x
      revenue on $2.4B ARR and 5-7% growth, MSCI at approximately 9x revenue on $3.1B revenue with
      stronger 10-14% growth and 53-57% operating margins. The Clearwater Analytics take-private
      (Permira and Warburg Pincus at $8.4B in December 2025) is the clearest recent M&A comp, representing
      roughly 24x estimated revenue for mission-critical institutional fintech SaaS — the highest multiple
      in the comparable set and evidence that strategic acquirers and large PE sponsors assign premium
      prices to AI-enhanced, embedded institutional workflows.

      The Damodaran January 2026 dataset places the Information Services sector median EV/Sales at 2.21x,
      while Eqvista's 2026 analysis shows Software (System & Application) at 11.41x and Financial Services
      (Non-bank & Insurance) at 18.91x. 9fin's implied multiple of 7–20x is consistent with the premium
      software and fintech bands, sitting above slow-growth public data companies but below the peak
      premium for demonstrably high-retention, high-growth SaaS at scale. If 9fin's true ARR is $65–72M
      (consistent with 18–20x multiples at scale), the valuation is fully supported by the comp set.
      If ARR is lower, the multiple expands into less supported territory and the valuation is stretched.

      No public evidence of dilution or preference overhang exists; Companies House SH01 (April 2026)
      records the share allotment but not the economics. Entry discipline is constrained by this opacity.
