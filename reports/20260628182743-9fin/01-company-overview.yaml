  - calloutType: "risk"
    title: "Sustained Operating Losses and Limited Financial Transparency"
    body: >
      9fin reported an operating loss of £10.4 million on £7.2 million of turnover for the year ended
      December 2023—a loss-to-revenue ratio above 1.4×. While this is common for high-growth SaaS companies
      investing in US expansion, it represents significant cash burn relative to revenue at that stage.
      The company has raised $250M+ to fund growth but remains private with no public financial disclosures
      beyond the 2023 statutory accounts. There are no filed 2024 or 2025 accounts at Companies House as of
      the run date, leaving a material gap in financial visibility for due diligence.
    claimRefs:
      - CO028
      - CO029
      - CO025

  - calloutType: "risk"
    title: "Key-Person Concentration in Co-Founder Roles"
    body: >
      Steven Hunter (CEO) and Hussam El-Sheikh (CTO) hold both the executive decision-making and the
      institutional knowledge of the product and market. The company's culture, fundraising relationships,
      and technology roadmap are closely tied to their personal networks and expertise. No public succession
      plan or deputy leadership structure has been disclosed. At the current growth stage, the departure
      of either founder would represent a significant diligence red flag.
    claimRefs:
      - CO010
      - CO011
      - CO044

  - calloutType: "insight"
    title: "Competitive Moat via Proprietary Data, Not AI Models Alone"
    body: >
      9fin's differentiation is less about the AI models it uses than the proprietary decade-long debt market
      dataset it has assembled—deepened by the Bond Radar acquisition. As CEO Hunter stated: "The winners
      won't be defined by the models they use, they'll be defined by the quality of the intelligence those
      models are built on." This data moat makes replication costly for incumbents and new entrants alike.
    claimRefs:
      - CO035
      - CO036
      - CO040
      - CO043

