  - id: "founders-and-leadership"
    title: "Founders & Leadership"
    body: >
      9fin was co-founded by two University of Bristol alumni with complementary expertise spanning debt capital
      markets and financial technology. Steven Hunter (CEO) graduated with a first-class honours degree in Law
      in 2013, then spent two years at J.P. Morgan's London Leveraged Finance team before moving to Babson
      Capital Management (now Barings), where he covered the European high-yield bond and leveraged loan market.
      Hussam El-Sheikh (CTO) holds an MEng in Aerospace Engineering and joined Deutsche Bank as a graduate analyst,
      progressing to Associate Vice President in Prime Finance, Equities and Derivatives Technology. Both founders
      experienced first-hand the pain of working with opaque, slow, and fragmented data in credit markets—the
      direct motivation for building 9fin.


      The wider executive team has grown as the company scaled. Moisés García joined as Chief Product Officer
      and led the June 2026 launches of AI Chat and Research Grid. The company had approximately 400 employees
      as of April 2026, with Hunter indicating plans to grow headcount "meaningfully" with a focus on AI,
      product, and engineering. Accounts filed at Companies House show 9fin operates an employee share option
      scheme with a four-year vesting programme.


      The board of directors includes both co-founders (Hunter as director from October 2016; El-Sheikh from
      November 2016), alongside Alex Finkelstein (General Partner, Spark Capital, joined November 2022 following
      the Series A+), and Fergal Mullen (partner, Highland Europe, joined December 2024 following the Series B).
      LDC Nominee Secretary Limited was appointed as company secretary in July 2025. Former board members
      include Aleksandra Laska of Redalpine (resigned February 2024), who played a key governance role from
      the Series A, and Marie Jae-Hee Wennergren of Fly Ventures, who participated during the seed and Series A
      phases. Gabriel Matuschka and Harald Nieder also served as directors during early stages.


      Key-person risk is material: Steven Hunter leads client relationships, US expansion, and external
      positioning while Huss El-Sheikh leads all engineering and technology development. Both founders remain
      in active executive roles as of mid-2026. No public succession plan has been disclosed. The departure of
      either founder would represent a significant risk to the company's product-led and founder-driven culture.
