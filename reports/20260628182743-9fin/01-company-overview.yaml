    body: >
      Both co-founders bring direct, senior-level debt market experience—Hunter from J.P. Morgan Leveraged
      Finance and Babson Capital, El-Sheikh from Deutsche Bank technology. This insider knowledge shaped the
      product from day one and earned early adoption among the top-10 investment banks. 9fin claims multiple
      consecutive years of 100% ARR growth, UK statutory accounts confirm 124% revenue growth in 2023, and
      the Series C was backed by CPP Investments which was already a client—an unusually strong product
      validation signal.
