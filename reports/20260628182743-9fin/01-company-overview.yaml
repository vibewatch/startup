  - id: "milestones-and-growth"
    title: "Milestones & Growth Trajectory"
    body: >
      9fin's growth from 2016 to mid-2026 tracks from a European-focused leveraged finance analytics startup
      to a global AI-native platform with unicorn status. At founding in 2016, the product targeted the
      European high-yield and leveraged loan market. By late 2020, coverage had expanded to distressed debt,
      CLOs, and private credit, and a client base of 40+ firms had been established during the pandemic period.


      The October 2021 Series A enabled the opening of a New York office; by December 2022 the client count
      had passed 60 customers, with nine of the top-10 investment banks on the platform. UK tech media
      recognised 9fin as one of the Sunday Times Tech 100 top-20 fastest-growing software companies. The
      company's UK statutory accounts for year ended December 2023 show turnover of £7.2 million, up 124%
      year-over-year, with an operating loss of £10.4 million—reflecting accelerated investment in headcount,
      product, and US expansion that outpaced revenue at that stage.


      In March 2025, 9fin acquired Bond Radar, a London-based intelligence and data provider for the
      international bond and loan markets with twenty years of historical data. The acquisition expanded
      9fin's coverage into investment grade debt and emerging markets and added more than 1,800 issuers and
      16,000 instruments with issuance history dating to 2003. Three months later the $50 million Series B
      funds supported continued headcount growth.


      9fin formally launched its Asia-Pacific platform in April 2026, initially from a Hong Kong base, with
      CEEMEA announced as the next expansion target. In June 2026, the company launched AI Chat and Research
      Grid, AI-powered tools that automate credit research and company-comparison workflows using its
      proprietary decade-long dataset. By mid-2026, headcount stood at approximately 400, the client base
      at 350+, and the company had delivered multiple consecutive years of 100% ARR growth per company
      statements. Exact ARR figures remain private.
