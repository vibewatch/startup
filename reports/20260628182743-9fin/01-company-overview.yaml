  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "financials"
      missingEvidence: >
        9fin's revenue, ARR, gross margin, and operating loss for years ended December 2024 and December 2025;
        no statutory accounts for those years are yet available at Companies House as of the run date.
      whyItMatters: >
        Without 2024 and 2025 financials, it is impossible to assess whether the 100%+ ARR growth claims
        are still holding post-Series B, whether the operating loss is narrowing with scale, or what the
        current cash burn and runway profile looks like.
      diligencePath: >
        Request audited management accounts and ARR waterfall (new ARR, expansion ARR, churned ARR) from
        the company under NDA; check Companies House filing for 2024 accounts after the September 2026
        due date; cross-reference with employee headcount growth from LinkedIn data.
      relatedQuestionRefs:
        - QO016
        - QO017
        - QO018
        - QO019
        - QO020
      relatedTableRefs:
        - TO004

    - type: "private-evidence-only"
      severity: "material"
      topic: "funding"
      missingEvidence: >
        Exact financial terms of the Bond Radar acquisition (March 2025) — purchase price, payment structure
        (cash, equity, earnout), and post-acquisition integration costs. Also, ownership percentages and
        precise investment amounts for early rounds in the investor map are not publicly disclosed.
      whyItMatters: >
        The acquisition could have consumed a material portion of the Series B proceeds or required additional
        financing; understanding the purchase price is relevant to assessing capital efficiency and whether
        the acquisition has been value-additive. Undisclosed ownership stakes in the stakeholder map limit
        governance analysis.
      diligencePath: >
        Request acquisition terms from management; check Companies House filings for any related financing
        documents; review Bond Radar's last publicly available accounts for a rough revenue/EBITDA baseline.
        Request a full cap table to populate ownership percentages in the investor map.
      relatedQuestionRefs:
        - QO022
      relatedTableRefs:
        - TO003

    - type: "private-evidence-only"
      severity: "minor"
      topic: "governance"
      missingEvidence: >
        Full executive team composition including CFO, COO, and other C-suite roles beyond the co-founders
        and CPO; no direct public source confirming the CFO or COO as of mid-2026.
      whyItMatters: >
        Governance quality, succession planning, and functional coverage of the executive team are relevant
        to assessing leadership risk beyond co-founder key-person dependence.
      diligencePath: >
        Review LinkedIn profiles and company press releases for C-suite announcements; request a full
        org-chart from the company in due diligence.
      relatedQuestionRefs:
        - QO007
      relatedTableRefs:
        - TO002

