chapter:
  number: 1
  title: "Company Overview"
  summary: >
    9fin is an AI-native intelligence platform for global debt capital markets, founded in London in 2016
    by former J.P. Morgan banker Steven Hunter (CEO) and former Deutsche Bank engineer Hussam El-Sheikh (CTO).
    As of March 2026 the company reached unicorn status with a $170 million Series C at a $1.3 billion valuation,
    bringing total capital raised to over $250 million. The platform serves 350+ leading financial institutions—
    including all top-10 global investment banks—across leveraged finance, private credit, distressed debt,
    CLOs, and investment grade markets in North America, Europe, Latin America, and Asia-Pacific.

sections:
  - id: "identity-and-business-model"
    title: "Identity & Business Model"
    body: >
      9fin, registered as 9FIN LIMITED (Companies House number 10451957), is an AI-native intelligence platform
      for the global debt capital markets. The company was co-founded in London in 2016 by Steven Hunter and
      Hussam "Huss" El-Sheikh out of frustration with the opaque, fragmented, and manual processes that
      characterised the world's largest asset class. At $145 trillion in outstanding debt, the global debt
      capital markets dwarf equity markets but have historically received far less technological investment;
      credit professionals were still analysing data using methods dating to the 1980s.


      9fin's core product is a single unified platform that centralises news, proprietary structured data,
      analytics, and AI-powered workflows, enabling credit professionals to identify, analyse, and act on
      opportunities faster than legacy systems. The platform covers high-yield bonds, leveraged loans, distressed
      debt, collateralised loan obligations (CLOs), private credit, asset-backed finance (ABF), and investment
      grade debt. Geographically, coverage spans North America, Europe, Latin America, and Asia-Pacific following
      the April 2026 APAC launch. Named clients include KKR, Apollo Global Management, BNP Paribas, and
      Kirkland & Ellis. The company's ultimate stated goal is to become the number-one global provider of AI,
      data, and analytics for the debt capital markets within this decade.


      The business model is B2B SaaS subscription-based, with revenue derived from institutional access licences
      sold to investment banks, asset managers, hedge funds, law firms, and private credit funds. 9fin's homepage
      reports 300+ leading firms, 80% of trading desks, all top-10 investment banks, and $17 trillion+ combined
      AUM among its clients. By mid-2026, the official about page listed 350+ institutional clients and 350+
      employees. The company reached unicorn status in March 2026 following its $170 million Series C at a
      $1.3 billion valuation.
