  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 9fin 机构客户旅程中的客户细分、采用触点和扩张循环
    data:
      nodes:
        - id: n1
          label: 发现
          description: 信贷专业人士通过同行推荐、销售触达、会议活动，或 9fin 抢发影响市场新闻后的媒体覆盖接触到 9fin
        - id: n2
          label: 评估 / 演示
          description: 直接企业销售流程；机构试用访问；采购团队完成安全和合规审查
        - id: n3
          label: 采购
          description: 多方审批、合规签核、安全评估和合同谈判；大型机构销售周期通常为 3-9 个月
        - id: n4
          label: 入职
          description: 交易台级部署；工作流集成；数据流配置；为分析师和银行家培训
        - id: n5
          label: 活跃使用 / 核心价值
          description: 日常工作流：实时交易监控、契约条款分析、AI Chat、Research Grid、投资组合提醒；相比传统媒体快 30-60 分钟
        - id: n6
          label: 扩张
          description: 向相邻交易台增配席位；扩展地理区域（如美国到 APAC）；向上销售高端 AI 层；PE/PC 机构投资者关系团队采用
    approximationNotes: 旅程阶段依据 9fin 产品文档、案例研究和新闻报道推断。销售周期长度是企业金融数据 SaaS 的基准估算；9fin 未披露周期数据。
