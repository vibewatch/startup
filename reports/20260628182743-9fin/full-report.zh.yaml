      - number: '4.5'
        title: 图表材料
        blocks:
          - type: callout
            title: 多年报告 ARR 增长 100%
            body: >-
              9fin 公开报告连续多年 ARR 年增速约 100%，并得到 Series B 与 Series C 融资背景中独立报道的佐证。虽然未经审计，但这一说法在投资人之间保持一致（投资人理应自行尽调），加上 CPP
              Investments 从客户转为投资人，提供了间接验证。若经审计账目确认，在估算 $65M–$183M ARR 基础上持续 100% 增长，将是资本市场数据行业中的异常优秀表现。
