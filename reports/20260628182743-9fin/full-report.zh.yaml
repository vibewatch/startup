      - number: '6.3'
        title: 采用轨迹
        blocks:
          - type: paragraph
            body: >
              9fin 的采用轨迹显示，机构渗透持续加深，并由报告客户数增长和 ARR 扩张支撑。公司在 2026 年 3 月 Series C 公告中披露 300+ 家头部机构；到 2026 年中关于页面升至
              350+，意味着约三个月内增加约 50 家机构，也与 2024 年末约 200 家客户的轨迹一致。投资人沟通中，美国扩张被描述为主要增长向量；多方来源确认，Series C 期间美国业务增长快于整个平台。APAC
              是 2026 年 4 月打开的新采用面，初始办公室设在香港，并在新加坡和印度组建团队。拉丁美洲在 2024–2025 年扩张后已投入运营。


              “80% 的交易台”和“全部前十大投行”这两个平台级采用信号，代表其已渗透债务资本市场中最具机构关键性的客户类别。连续多年 100% ARR 增长是公司声称的数据，尚未独立验证或审计，但 Series C
              投资人参与规模和构成提供了间接佐证。公司提到“美国扩张快于”整个平台，意味着至少部分美国 cohort 增长快于传统欧洲账户，但没有提供美国 ARR 的绝对值或相对数据。Milbank 独立发布 9fin
              排名表排名，是第二层采用证明：它显示大型律所正主动参与 9fin 的基准框架，意味着使用已经嵌入运营，而不只是被动访问平台。
