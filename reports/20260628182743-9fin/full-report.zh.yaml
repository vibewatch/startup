      - number: '3.2'
        title: 既有巨头与直接竞争对手画像
        blocks:
          - type: paragraph
            body: >
              Bloomberg Terminal 是信用市场的通用基线。其估计 $25,000–$32,000 的年度席位价格，反映数十年工作流固化、专有 IB 消息系统，以及覆盖所有资产类别的实时数据。面对 AI
              原生挑战者，Bloomberg 的竞争回应是 AskB：一个智能体式 AI 系统，协调 Terminal 内嵌的 800 多家研究提供商上的多个 AI 智能体，覆盖债券分析、组合风险和信用研究屏幕。AskB
              不是独立产品，而是加在既有终端工作流上的 AI 层。Bloomberg 的优势是广度和机构信任；劣势是缺少深度、文档级信用专长。Bloomberg 的全球企业销售团队嵌入每家主要全球银行，形成 9fin
              无法有机复制的防御性分发护城河。


              Octus Intelligence（成立于 2013 年，原 Reorg Research）是 9fin 最直接的专业竞争对手。Octus 累计融资约 $441 million，具备 PE
              支持背景，全球客户包括买方机构、投资银行、律师事务所和顾问公司。2026 年 3 月，Octus 推出 CreditAI，被描述为首个面向信用的合规就绪生成式
              AI，结合公开和专有数据室文档、贷款协议和私人发行人财务数据，运行在可审计、来源可验证的环境中。Octus CEO Kent Collier 明确表示，「通用 AI
              模型会给任何为借款人或贷款人提供建议的人带来风险」，把 CreditAI 定位为显著优于通用 LLM。Octus 还收购 Sky Road research
              management，将信用情报、分析、合规和组合技术统一到单一栈中。


              Debtwire 隶属于 ION Analytics Group，面向杠杆金融专业人士，提供新闻优先的覆盖和预测分析，记录了 2025 年美国和欧洲市场 $1.73 trillion LevFin
              发行。AlphaSense 于 2026 年 6 月以 $7.5 billion 估值融资 $350 million，ARR 超过 $600 million，同比增长 73%；其 5
              亿文档语料和生成式工作流智能体在分析师自动化用例上与 9fin 竞争，但缺少信用市场深度。S&P Global LCD 与 Cambridge Associates、Mercer 于 2026 年 3
              月合作推出标准化私人信贷表现数据集，显示成熟数据巨头正主动侵入 9fin 的私人信贷机会。
