  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品与服务定义
        blocks:
          - type: paragraph
            body: >
              9fin 为全球债务资本市场中的信用专业人士提供统一情报平台。平台覆盖主要债务资产类别，把新闻、结构化数据、分析和 AI
              驱动的工作流整合在一起，包括高收益债、杠杆贷款、不良债务、贷款抵押债券（CLO）、私人信用、资产支持融资（ABF）和投资级债务。客户通过网页界面使用
              9fin，获得一个单一、连通的工作流，替代信用团队过去碎片化、多工具并用的做法。

              产品定位不是数据终端，而是情报系统。传统金融数据平台主要聚合原始价格和参考数据；9fin 则把内部记者、律师和分析师的实时编辑报道，与专有结构化数据和 AI
              工具结合，把输入合成为可行动的输出。平台覆盖完整信用工作流，从交易发起、一级市场监控，到二级交易、组合监控，以及重组或不良分析。公司平台页将价值主张描述为，把数据、文件和新闻放进一个按信用实际工作方式搭建的地方，帮助信用团队“节省时间、赢得业务、领先市场”。

              服务的用户角色包括信用分析师、投资组合经理、投资银行家、杠杆融资律师和重组顾问。机构买家分布在头部投行、买方资产管理公司、对冲基金、私人信用基金和律师事务所。截至 2026 年中，9fin 报告 350+
              家机构客户和 350+ 名员工；关于页面称客户包括 80% 的交易台和全球前十大投行全部。按 runDate，公司地理覆盖北美、欧洲、拉丁美洲（自 2025 年 9 月起）和亚太（自 2026 年 4 月起）。
