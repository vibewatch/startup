  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >
              9fin 靠面向全球债务资本市场机构参与者的企业级 B2B SaaS 订阅模式赚钱。平台把三层互相咬合的价值打包进同一份机构订阅：AI
              驱动的研究工具、专有数据与分析，以及由信用记者和法律分析师组成的编辑新闻团队。 这种打包架构不同于传统金融数据供应商常见的单点产品定价，目标是把平台做成信用专业人士从交易发起到组合监控的唯一工作环境。


              机构订阅客户包括全球前十大投行、头部资产管理公司、律师事务所、对冲基金和顾问公司。截至 2026 年 3 月 Series C 公告，9fin 称平台上已有 350+
              家机构。公司不披露按席位或按模块的价格；所有商业条款都由销售团队直接谈判，符合该客户群的企业级 SaaS 惯例——这类合同的年均合同价值通常超过 $100,000。


              实际上，收入模型可分为两层。主订阅客户为覆盖全平台、全资产类别的访问权限支付企业机构合同费用，资产类别包括杠杆融资、高收益债、CLO、私人信用、不良债务和资产支持融资。第二层扩张收入来自既有机构客户增加席位、扩展地理区域，以及向
              AI Chat、Research Grid 等高阶 AI 产品层级追加购买；这些产品随 Series C 部署同步推出。CPP Investments
              同时是客户和投资人，说明扩张逻辑已经跑通：大型机构客户先从财务角度验证产品，再投入股权资本。


              收入质量依托高切换成本（专有契约数据库、工作流集成）、编辑内容独占性，以及机构数据订阅常见的长合同周期。没有免费层、必须直接接触销售，也确认平台只面向企业级机构买家，而非零售或小团队。围绕
              ACV、合同期限、基础订阅与扩张收入占比的关键尽调问题，在没有 NDA 访问权限时仍无答案。
