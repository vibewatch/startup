      - number: '3.4'
        title: 切换成本、锁定与多平台并用动态
        blocks:
          - type: paragraph
            body: >
              Bloomberg 的主导锁定机制，是工作流习惯、专有 IB 消息系统、多年企业许可和交易基础设施集成的组合，迁移估计需要 6–12 个月。信用团队反馈，从 Bloomberg 切换不仅要重新培训，还要重建基于
              Bloomberg 数据结构的自定义分析和预警。这是 9fin 不寻求正面替代 Bloomberg，而是补充 Bloomberg 的首要原因：它瞄准既有终端订阅之上的增量分析工作流和研究生产力提升。


              9fin 自身的切换成本会通过两种机制随时间累积。第一，信用团队一旦围绕 9fin 的数据架构标准化杠杆金融研究和契约分析工作流，迁移到竞品就需要从零重建自定义筛选器、交易历史查询和预警逻辑。第二，9fin 超过
              20 年的历史数据集，是跨市场周期趋势分析的参照语料；没有类似深度的竞争对手无法成为即插即用替代品。机构买方广泛采用多平台并用模式——Bloomberg 用于交易和实时定价，9fin
              用于分析、交易监控和契约工作流。这一模式限制了 9fin 的上行定价权，但也大幅降低了来自 Bloomberg 的正面流失风险。


              分发能力在竞争格局中差异很大。Bloomberg 和 S&P Global 部署嵌入客户组织的全球企业销售团队，并受益于与大型投行的主数据协议。Octus 有 PE 支持、员工超过 800
              人，也运营规模化企业销售动作。网络驱动的基准数据会放大这种优势：向平台贡献交易数据的机构越多，平台市场统计越权威，固化越强。没有传统终端基础设施的新设私人信贷基金和新组建信用交易台，切换成本更低，在 9fin
              净新增客户机会中占比更高。
