      - - 领域专家 + AI 混合模型（人工编辑覆盖）
        - 通用 LLM（OpenAI、Anthropic、Google）正以快速下降的边际成本把文档阅读商品化
        - 中
        - 用真实信贷协议分析任务对比 9fin 与前沿 LLM 的准确率、合规护栏和输出可审计性；评估银行内部 AI 自研项目
      - - 大型银行和律所的分销
        - Bloomberg 和 Octus 拥有更大的企业销售团队和既有采购关系；S&P Global 正扩大私募信贷覆盖
        - 高
        - 对比 9fin 与 Octus 在全球前 10 大银行同类用户角色中的渗透率；评估 9fin 能否打进现有供应商采购周期
      - - 监管信任与数据准确性标准
        - 契约分析或交易条款若出现重大数据错误，可能引发客户流失、声誉受损或潜在责任
        - 高
