      - number: '6.5'
        title: 扩张与集中度风险
        blocks:
          - type: paragraph
            body: >
              9fin 的先落地再扩张动作通过三条已记录路径推进：既有机构客户内部增加席位；平台进入新市场后扩展地理区域（拉丁美洲、APAC 和计划中的 CEEMEA）；以及追加购买 AI Chat、Research Grid
              等高阶 AI 层级，这些产品随 2026 年 6 月 Series C 部署推出。席位扩张对机构客户尤其自然，因为初始部署通常覆盖一个交易台或产品线，后续续约再增加覆盖范围。CPP Investments
              从客户走向投资人，显示其对平台投入很深，内部部署也很可能较广。IK Partners 从碎片化传统来源切换到 9fin，用其覆盖全部债务市场情报，说明初始部署可扩展为主要工作流依赖。


              集中度风险是首要未披露结构性担忧。9fin 不公开报告前 1、5 或 10 大客户的收入占比。鉴于全球前十大投行均已确认是客户，而银行通常是 ACV 最高的机构订阅类别，少数银行关系贡献不成比例 ARR
              的可能性存在——但未经验证。公司“80%
              的交易台”说法意味着在最成熟机构买家中的渗透率很高，这降低了获取新超大客户的风险，但增加了现有集中账户的续约风险。受监管金融机构的采购摩擦结构性较高，原因是多利益相关方安全审查、合规批准和预算周期。摩擦有两面：它提高赢得新客户的成本，也抬高现有客户的切换成本。未披露任何采购失败、客户流失或公开投诉，强化了留存叙事，但不能替代经审计留存指标。
            claimRefs:
              - CU032
              - CU033
              - CU034
              - CU006
              - CU013
