      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 市场融合让边界宽于任何单一子市场
            body: >
              9fin 的有效 TAM 不由任何一个 DCM 子市场固定。广泛银团贷款、私人信贷和高收益债正在融合成单一机构情报需求；9fin 又在 2025-2026 年扩至 LatAm、APAC、私人信贷、ABF
              和投资级，市场边界正在主动变宽。任何只基于杠杆金融市场或只基于金融分析市场的规模估算，都会在融合继续时低估总机会。
            calloutType: insight
            claimRefs:
              - CM029
              - CM008
              - CM009
          - type: callout
            title: Bloomberg 既有地位是结构性采用约束，不只是价格障碍
            body: >
              Bloomberg 在 DCM 的市场地位主要不是价格问题，而是网络问题：其消息基础设施（IB Chat）嵌入交易沟通工作流，离开 Bloomberg 就等于放弃整个市场都在使用的交易对手沟通网络。9fin
              作为增量工具（而非替代品）进入的策略，限制了它短期内每家机构可撬动的预算替代，并让净收入扩张弱于纯替代场景。
            calloutType: risk
            claimRefs:
              - CM036
              - CM037
          - type: callout
            title: 9fin 的 SAM 无法用公开数据直接测量
            body: >
              没有权威第三方估算把 DCM 专项情报与分析软件市场单独拆成一个子细分。Mordor Intelligence 的 $13.87 billion 金融分析数字覆盖全部金融分析（BFSI），Opimas 的 $48
              billion 外部软件数字覆盖全部资本市场技术。9fin 的真实 SAM——DCM 专业情报工具——估计为 $3-8 billion，但这是分析师综合判断，不是专门一手研究。这个缺口是市场规模尽调中的首要问题。
            calloutType: assumption
            claimRefs:
