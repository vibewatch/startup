  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与建议
        blocks:
          - type: paragraph
            body: >
              9fin 站在两个长期宏观顺风的交汇处，结构位置很有吸引力：$145 trillion 全球债务资本市场的数字化，以及 AI 嵌入机构金融工作流。平台已经做到少数企业 SaaS 公司才能做到的事——打入全球前
              10 大投资银行，同时在私人信贷基金、律所和资产管理人中扩大采用。公司披露连续多年 ARR 增长 100%，留存也处于行业领先水平，指向真实的产品市场契合，而不是促销式 ARR 膨胀。CPP
              Investments 作为客户转投资人加入 Series C，是极强背书：这是一家为数百万加拿大人管理退休储蓄的成熟机构投资人，它把信托基金资本投向了一款自己每天都在用的工具。


              反论点集中在证据缺口和竞争风险。9fin 尚未在 Companies House 提交 FY2024 法定账目，因此其 ARR 和留存声明完全没有独立来源验证。$170M Series C
              本身证据充分，但这笔钱买到什么——可寻址 ARR、burn rate、preference stack——仍不透明。Bloomberg 的 AskB 路线图，以及 AlphaSense 向信用工作流扩张（现有
              $600M ARR、估值 $7.5B），在两翼形成切实替代风险。没有经审计财务，估值无法自下而上做压力测试；投资判断因此必须保持审慎和有条件。


              建议为跟踪。9fin 具备值得持续监测和接触的平台质量、机构可信度和增长叙事，但公开证据不足以支持投入资本。相对可比公司，估值被评为公允——不便宜，也不算过度拉伸。鉴于财务不透明、竞争强度高、preference
              overhang 未知，风险评级为高。信心为中：论点自洽，投资人信号强，但仍有重大承销缺口。若 NDA 访问确认经审计 ARR、NRR ≥ 110%，且 Series C 后 burn runway 超过 30
              个月，可上调至买入。
