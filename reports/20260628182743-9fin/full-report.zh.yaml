  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              9fin 所处的是多细分 DCM 情报市场，机构买方通常会在服务不同工作流层的多个平台之间多平台并用。竞争场可至少分成六类：（1）全套终端既有巨头——Bloomberg Terminal 和 LSEG
              Workspace——凭广泛多资产数据和深度工作流集成锚定机构交易台；（2）信用专业情报提供商——Octus Intelligence（原 Reorg Research）和 Debtwire/ION
              Analytics——以窄而深的覆盖服务结构化信用、不良债务和杠杆金融专业人士；（3）AI 原生广谱研究平台——AlphaSense，如今估值 $7.5 billion、ARR $600
              million——其文档语料和工作流自动化工具在研究生产力上与 9fin 重叠，但缺少信用市场深度；（4）S&P Global Leveraged Commentary &
              Data（LCD）等机构数据和分析提供商，掌握权威贷款和高收益交易数据库；（5）内部自建替代方案——Excel 模型、VBA
              宏和初级分析师团队，仍是许多中型信用机构的事实替代品；（6）OpenAI、Anthropic 等新兴通用 AI 工具，越来越能提供通用文档分析，但缺少领域专项训练。


              既有巨头层的特点是切换成本高、多年企业合同，以及全球销售团队带来的深度分发。Bloomberg 估计每用户每年 $25,000–$32,000，竞争核心不是成本，而是工作流集成和沟通网络效应。LSEG
              Workspace 是 Refinitiv Eikon 的继任者，面向多资产全球团队，并宣布推出 AI 驱动 LLM 产品，把实时金融数据转化为可行动洞察。Bloomberg 和 LSEG 都尚未建立可匹配
              9fin 或 Octus 的深度契约级信用专长。


              专业层——Octus 和 Debtwire——最接近 9fin 的买方目标。Octus 于 2026 年 3 月推出 CreditAI，这是一款合规就绪的生成式 AI
              平台，基于私有数据室、信用协议和非公开发行人财务数据训练。Debtwire 隶属于 ION Analytics，主要定位是新闻和预警产品。S&P Global LCD
              提供权威历史交易数据库，几乎所有杠杆金融专业人士都会使用，但竞争点主要是数据广度，而不是工作流自动化或 AI 文档分析。现状——内部分析师团队和 Excel
              工作流——仍是预算更紧的小型信用机构和团队的最大事实替代方案。
