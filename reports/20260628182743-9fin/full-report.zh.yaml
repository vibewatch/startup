      - number: '8.3'
        title: 情景分析：牛市、基准与熊市
        blocks:
          - type: paragraph
            body: >
              牛市情景建立在几个前提上：9fin 维持 100% ARR 增长轨迹，在美国杠杆融资市场拿到有意义份额，并在 2028–2030 年以 15–20x ARR 完成战略退出——路径可以是
              IPO，也可以被终端提供商或大型 PE 支持的数据基础设施平台收购。该情景意味着 $4B–$8B 退出估值，相对 $1.3B Series C 标记产生 3–6x 回报。AlphaSense 可比对象（$600M
              ARR、$7.5B 估值、12.5x）说明，只要 9fin 能以相近留存扩至 $300–500M ARR，这一结果可以实现。概率信号来自 CPP 的客户投资人身份和 HarbourVest 的机构授权。


              基准情景假设，随着美国市场成熟、Bloomberg multi-homing 成为常态，ARR 增长到 2027 年放缓至 60–80%。9fin 到 2028 年在 $100–150M ARR 规模实现盈利，以
              $2–3B 估值融资 Series D，并在 2030 年前通过 M&A 或 IPO 以 $2B–$3.5B 估值退出。相对当前标记，该情景提供 1.5–2.7x 回报——按风险画像看并不高，但符合关键任务型
              B2B SaaS 基础设施的结果。


              熊市情景由 Bloomberg AskB 成功把 AI 原生契约分析打包给其头部机构客户触发，导致 9fin 失去两个或更多前 10 大银行订阅客户。再叠加未披露 burn rate
              被证明高于成长阶段效率所允许的水平，熊市情景会导致 2027 年以 $700M–$900M 估值 down round，并在低于 $1.3B 入场标记的位置受限退出。SaaS
              倍数压缩的历史先例（2022–2023 年 SaaS 抛售，9fin 自己也做过分析跟踪）显示，一旦增长叙事落空，高增长溢价倍数可在 12 个月内压缩 50–70%。9fin
              自身对软件行业困境的研究，让熊市情景风险尤其可信。


              Bain 2026 年 PE Report 确认，大型交易退出条件正在改善；但 EY 2026 年 Q1 分析指出，AI 扰动下软件估值重校准推动交易价值下降
              12%——这是行业层面逆风，适用于任何寻求近期退出、处于后期且盈利能力尚未被证明的 AI 原生 SaaS 公司。
