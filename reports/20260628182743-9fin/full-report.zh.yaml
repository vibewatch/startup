  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 按严重性排序的风险热力图，根据可能性和影响的组合放置 9fin 关键风险。竞争和执行风险集中在高影响区域；在当前缓释措施下，运营和监管风险影响为中高，可能性较低。
