      - number: '8.4'
        title: 退出就绪度与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              9fin 的退出就绪度有希望，但尚未被证明。平台已经打入全球前 10 大投资银行，覆盖伦敦、纽约、香港、贝尔法斯特多地，美国覆盖也在增长；因此，对主要终端提供商（LSEG、Bloomberg、S&P
              Global）、大型 PE 支持的数据整合方，或希望获得 AI 原生 DCM 能力的资本市场基础设施平台来说，它都是有吸引力的收购目标。Bond Radar 收购证明 9fin
              管理层有能力整合并变现相邻业务，提升了战略可选性。


              HarbourVest 作为私募市场公司已有 40-plus 年历史，其“支持下一代市场领导者”的论点，暗示其预期持有 5–7 年，退出路径可能是 PE-to-IPO 或战略退出。Bain 2026
              年数据显示，平均 PE 持有期约 7 年，这与 9fin 的 2026 年位置相匹配：2031–2033 年退出窗口要求公司在 2028–2029 年继续增长；届时，若平台达到 $300M+ ARR，IPO
              市场或战略买家应可承接。


              最重大的尽调缺口是经审计财务数据。Companies House 显示，截至 2026 年 6 月，FY2024 法定账目尚未提交——对 12 月年结的公司而言这很正常，因为申报截止日允许年结后最多 9
              个月。但这也意味着，唯一可被独立验证的收入数据来自 FY2023 或更早。FY2024 账目提交前，任何投资人承诺都必须完全依赖 NDA data room
              材料和管理层陈述。这对后期私募轮并不罕见，但在建立高信心判断时是有意义的风险因素。thesis-break 和 kill trigger
              表定义了需要重新评估建议的具体事件，最终尽调表列出了可把信心从中提升至高的六项信息请求。
