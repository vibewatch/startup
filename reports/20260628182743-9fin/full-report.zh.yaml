            - 强 — 律师主导；AI 辅助程度在提高
        - label: 投资级 / EM 覆盖
          values:
            - 中等 — Bond Radar 集成于 2026 年 Q1 完成
            - 强 — 广泛覆盖全球多资产
            - 中等 — Debtwire 强在杠杆融资和困境领域
        - label: 私募信贷覆盖
          values:
            - 中等 — 在增长；已与 PCOC 数据集成
            - 有限 — 主要聚焦公开市场
            - 中等 — Debtwire 有部分私募信贷覆盖
        - label: 开发者 / API 接入
          values:
