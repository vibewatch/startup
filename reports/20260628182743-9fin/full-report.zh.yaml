  - id: TV005
    title: 论点失效与止损触发表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - Bloomberg AskB 赢下旗舰银行客户
        - 两家或以上全球前 10 大银行订户流失到 Bloomberg 原生 AI 产品
        - 高端定价权被拿掉；说明 Bloomberg 能在机构规模上打包 AI；DCM 专家护城河论点被击穿
        - 立即重评；建议下调至规避；暂停任何资本承诺
      - - ARR 同比增长跌破 50%
        - 公司或泄露证据显示 ARR 同比增速连续两个季度低于 50%
        - 多年 ARR 增长 100% 的叙事被打破；指向市场饱和或结构性流失；估值倍数急剧压缩
        - 估值下调 30–50%；再次接触前要求披露经审计 ARR 和 NRR
      - - AlphaSense 大规模打入信用专家工作流
        - AlphaSense 的契约 / DCM 产品线拥有超过 200 家专门信用专家客户
        - 以当前 ARR 规模 9 倍和 $7.5B 资本，封堵 AI 原生专家护城河；定价压力加剧
        - 重评差异化；评估多平台并用风险；评估 9fin 能否守住定价溢价
      - - 已提交 FY2024 账目显示经营亏损显著高于 $40M
        - Companies House FY2024 法定账目披露的经营亏损超过此前成长期基准
        - 跑道短于 $170M 资本所暗示的水平；抬高生存风险，也削弱维持美国扩张的能力
        - 立即触发 NDA 访问；重新评估烧钱轨迹和 Series D 时间表
      - - 下一次融资事件为下轮估值
        - Series D 或二级交易以低于 $1.3B 投后估值完成
        - 指向增长不及预期和市场重估；优先权悬置加速；LP 信心受损
        - 暂停接触；重新进入前要求独立财务审计和可信盈利路径
    notes: 阈值是分析师基于可用同业数据和增长基准校准的指标。传导逻辑为定性判断；实际影响取决于时点、幅度和管理层回应。
    claimRefs:
