      - number: '6.4'
        title: 留存、耐久性与客户满意度
        blocks:
          - type: paragraph
            body: >
              9fin 在 2026 年 3 月 Series C 新闻稿中声称拥有“行业领先留存”，但未披露 NRR、GRR、年度流失率、cohort
              数据或平均合同期限。这个缺口意味着留存叙事无法从公开来源独立验证，也是长期收入质量最重要的承销问题。支持高留存的结构性论点很强：9fin
              服务机构客户，切换成本嵌入工作流集成、专有契约数据库、编辑内容独占性和多年期企业订阅合同。大型机构客户为关键任务工作流购买的软件，流失率往往处于企业 SaaS 分布低端；基础设施
              SaaS（最接近可比对象）行业基准显示月流失率 1.8%，B2B SaaS 中位数为 3.5%。


              用户生成证据提供了部分质量信号。截至 2026 年，G2 用户给 9fin 评 4/5 星，称工作流效率、相对传统媒体的速度优势和现代化界面是关键强项。G2 负面评论提到相较 Bloomberg
              的覆盖限制，以及偶尔需要人工核验 AI——这些反向反馈符合平台处于规模化拐点时的状态。FeaturedCustomers 报告 24 条推荐，以及来自 500 条参考评分的 4.8/5
              星。公开来源中尚未发现具名大型客户公开从 9fin 流失的记录。CPP Investments 和 IK Partners
              两个参考案例都描述了跨多个期间的持续使用，提供有限但正向的耐久性信号。要验证“行业领先”说法，仍需要 NDA 级别的 NRR、GRR 和 cohort 数据披露。
