      - number: '1.3'
        title: 融资历史与投资方
        blocks:
          - type: paragraph
            body: >
              自 2016 年以来，9fin 多轮累计融资超过 $250 million。Series A 前，Fly Ventures、Seedcamp、AI Seed Fund，以及 Paul Forster（Indeed
              联合创始人）、Alan Morgan（MMC Ventures 联合创始人）等天使投资人出资，使 Series A 前累计融资超过 £10 million。这笔早期资金体现了投资人对市场机会的判断，当时 AI
              驱动金融数据尚未成为被广泛认可的类别。


              2021 年 10 月，9fin 完成 £8 million Series A，由瑞士 VC Redalpine 领投，Fly Ventures、Ilavska Vuillermoz Capital
              和天使投资人参投；Redalpine 的 Aleksandra Laska 加入董事会。14 个月后，2022 年 12 月，公司完成 $23 million Series A+，由美国 Spark
              Capital 领投（Alex Finkelstein 加入董事会），累计融资增至约 $37 million。新资金用于开设纽约办公室，并把美国团队扩至 70 多人。自 2021 年以来，9fin
              客户数翻逾一倍，团队规模增至三倍，ARR 增至四倍。


              2024 年 12 月，Highland Europe 领投 $50 million Series B，既有投资方 Spark Capital、Redalpine、Seedcamp、500 Startups 和
              Ilavska Vuillermoz Capital 参投；Highland Europe 的 Fergal Mullen 加入董事会。Series B 同期，9fin 入选 Sunday Times Tech
              100 英国增长最快软件公司前 20 名。


              2026 年 3 月 Series C 由 HarbourVest Partners 领投，估值 $1.3 billion，融资 $170 million，累计融资超过 $250 million。Canada
              Pension Plan Investment Board（CPP Investments）首次作为投资方参投，而此前已是客户——这是平台机构价值的一个重要验证点。资金将用于加速美国扩张并深化 AI
              产品开发。公司未披露公开债务或信贷额度。除截至 2023 年 12 月财年的 Companies House 文件披露 £7.2 million 营业额外，9fin 收入仍未公开。
