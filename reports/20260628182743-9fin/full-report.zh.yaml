    title: 估值敏感性：不同倍数下支撑 $1.3B 估值所需的隐含 ARR
    type: bar
    layout: standard
    summary: 在每个 ARR 倍数下，本图展示 9fin 需要达到何种 ARR 水平，才能支撑其 $1.3B Series C 估值。倍数越低，所需 ARR 越高；倍数越高（符合高端 AI 情报 SaaS），所需 ARR 越低。
    data:
      items:
        - label: 7x ARR（熊市底部）
          value: 186
        - label: 10x ARR
          value: 130
        - label: 13x ARR
          value: 100
        - label: 15x ARR
          value: 87
        - label: 18x ARR（SaaS 中位数）
          value: 72
        - label: 20x ARR（高增长溢价）
          value: 65
    approximationNotes: >-
      数值按 $1,300M 除以各倍数计算。ARR 倍数参考 AlphaSense（12.5x）、FactSet（3.6x 收入）和 Eqvista/Damodaran 行业基准校准。9fin 实际 ARR
      未披露；如果估值合理，隐含基础 ARR 为 65–72M。
