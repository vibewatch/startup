            body: >-
              9fin 不公布 ARR、毛利率、NRR、烧钱率、CAC 或 ACV。Companies House 的 2024 年法定账目尚未提交（2026 年 9
              月到期），因此没有独立审计财务基线可用于验证增长主张、评估单位经济或独立判断资本充足性。这种披露不透明符合私营公司常态，但构成实质承销阻塞。$1.3B 估值和 100% ARR
              增长叙事，目前都无法从外部来源验证。
