      - number: '4.2'
        title: 单位经济、成本结构与毛利率
        blocks:
          - type: paragraph
            body: >
              9fin 尚未公开披露毛利率、CAC、回本期或 LTV:CAC 比率。公司成本结构由三部分组成：内容与编辑运营（内部信用记者、法律分析师和数据编辑）、AI
              与数据基础设施（模型训练、数据摄取管线、云托管），以及用于获取企业合同的销售和营销费用。2024 年 12 月至 2026 年 3 月，员工数增长 67%+，三项成本都在同步扩张。


              如果是纯 SaaS 交付的数据平台，企业分析公司的毛利率基准通常在 70–80%+。但 9fin
              内嵌编辑团队，带来反复发生、难以完全规模化的人力成本，毛利率会低于纯软件基准。公司把编辑团队描述为信用记者、律师和分析师；这是一套差异化机制，也是一项结构性成本，让 9fin
              区别于轻资产数据聚合商。这项内容成本到底能否靠溢价定价收回，还是被视为提升营销和销售效率的投入，公开数据无法回答。


              单员工收入这个代理指标可做粗略校准：按估算 400–900 名员工、ARR $65M–$183M 计算，隐含单员工收入为
              $72,000–$458,000。区间很宽，反映分子（ARR）和分母（员工数）都不确定；它同时覆盖精简高毛利数据业务和成本更高、编辑密集型业务两种分布。同阶段企业级 SaaS 数据公司通常把单员工收入目标设在
              $150,000–$250,000。


              约 2025 年 3 月完成的 Bond Radar 收购，为公司增加了二十多年历史交易和工具数据。专有数据集护城河因此加深，但 2025 年也很可能新增了集成和数据工程成本。整体看，9fin
              是一家毛利潜力结构上健康的企业数据平台，可能在 65–80%，但要拆解具体利润率仍需要经审计财务披露。企业级 SaaS 在 Series A-C 阶段的 CAC 回本期基准中位数为 28 个月；9fin
              面向受监管机构、依赖关系型销售的画像，与 18–36 个月回本期相符，但公司没有披露具体数字。
