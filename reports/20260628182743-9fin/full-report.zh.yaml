      - number: '3.5'
        title: 护城河耐久性与反向证据
        blocks:
          - type: paragraph
            body: >
              9fin 公开阐述的护城河由四项复合资产构成：专有的 20 年债务交易数据集、基于领域专项语料训练的 AI
              模型、提供准确性保障的人类编辑和法律覆盖，以及更多机构贡献交易数据后形成的网络驱动基准。然而，几项反向发现削弱了这一论点的耐久性。


              最关键的是，Octus Intelligence 于 2026 年 3 月推出 CreditAI，直接复制了 9fin 在契约分析上的差异化。Octus CEO Kent Collier
              表示，其智能体式契约分析模型「运行十多个智能体，基于 10,000 多条精细调优提示词工作」，针对的正是 9fin 定位为主要护城河的工作流——信用协议分析。CreditAI 不是通用 LLM
              包装层，而是由累计融资 $441 million 的竞争对手打造的专项竞争产品。含义是：随着 Octus 大规模部署 CreditAI，9fin 当前在 AI 契约分析上的领先可能在 12–24
              个月内被显著侵蚀。


              Bloomberg 的 AskB 计划说明，终端既有巨头正在大举投入 AI 驱动信用分析，而不是放弃这一细分。虽然 Bloomberg 的 AI 层目前不如 9fin 或 Octus
              那样信用专项化，但它的分发优势意味着，只要 Bloomberg 信用分析能力小幅改善，就可能减少大型全球银行对 9fin 的增量采用。S&P Global 通过 iLEVEL 和 2026 年 3
              月数据集合作扩张私人信贷分析，也显示成熟巨头正在系统性侵入 9fin 的增长细分。


              Wall Street Prep 对金融数据平台的分析指出，小型金融科技挑战者「尚未真正威胁到 Big Four」既有提供商——这也是适用于 9fin 分发位置的结构性警示。大型投资银行也在探索内部自建契约分析
              AI，边际上可能减少第三方平台需求。AlphaSense 走到 $600 million ARR 和 $7.5 billion 估值，验证了 AI
              原生金融数据论点，也说明分析师自动化细分竞争正在加剧。现状——内部分析师团队和 Excel 模型——仍是 9fin
              工作流的最大事实替代品；任何高于边际价值的涨价，都可能把买方推回内部自建，而不是转向另一家商业平台。
