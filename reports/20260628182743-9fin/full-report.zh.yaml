      - number: '7.3'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >
              9fin 的安全态势高于 Series C 企业级 SaaS 公司的中位数。平台持有 SOC 2 Type II 认证，审计依据 AICPA Trust Service Principles 和 NIST
              标准，并由 CREST 认证安全公司每年进行渗透测试。传输和静态加密、与企业身份提供商集成的身份和访问管理、最小权限 AI 聊天留存（默认 180
              天），都记录在公开安全页面上。本研究审阅来源中，未发现公开数据泄露、服务中断或重大数据质量事故。


              但最难缓释的运营风险是 AI 模型可靠性。9fin
              平台从非结构化债务文件中抽取契约条款、定价数据和交易结构；这类任务中，即使很小的错误率也会带来巨大后果。信用专业人士若依据虚构的契约阈值，或在数亿美元交易中依据错误抽取的贷款条款行动，就会形成责任场景；从声誉角度看，Terms
              of Service 中的责任限制无法完全消除这一风险。2026 年 ORX Operational Risk Horizon 研究基于 47
              家大型金融机构，将不断升级的网络犯罪、技术中断、供应链风险和数据治理列为四大新兴运营风险——它们都直接适用于 9fin 的架构。


              9fin 平台描述记录了来自 2,000 多个来源的数据聚合，这带来数据来源治理挑战。每个来源的授权条款、更新频率和错误率都不同。IQ-EQ 2026 年合规分析警告，嵌入第三方 AI
              工具的公司必须强化数据完整性措施并防止误用；这同样适用于 9fin，因为它既是第三方数据的使用者，也是面向客户的 AI 衍生分析生产者。


              9fin 收购 Bond Radar（约 2025 年 3 月）增加了 20 多年历史债务市场数据，但也引入数据对账复杂性。两个独立数据基础设施分别运行在不同法律实体（Bond Radar Ltd 和 9fin
              Limited）之下，特别是在整合期，可能导致旧版 Bond Radar 数据与 9fin 原生数据管线之间出现一致性错误。
            claimRefs:
