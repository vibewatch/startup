      - number: '3.3'
        title: 能力、定价与商业化对比
        blocks:
          - type: paragraph
            body: >
              9fin 最有防御力的能力，是覆盖每笔贷款 100 多个数据点的 AI 驱动契约和文档分析，并叠加超过 20
              年的专有债务交易历史。这个资产基础很难复制，因为它要求系统性收集信用协议文件、由记者和法律专家做专有编辑增强，并在多年迭代中训练 AI 模型。9fin 于 2026 年推出的 AI Chat 和 Research
              Grid，让用户能围绕契约、财务和法律文档做带引用的结构化问答，把过去需要手工审阅文档、耗时数小时的工作流压缩到几分钟。平台报告服务近 200
              家最大的信用市场参与者，包括投资银行、资产管理公司、私募股权公司和律师事务所。


              定价方面，9fin 未公布标价，但定位低于 Bloomberg 每席 $25,000–$32,000，以公司和模块层面的现代 SaaS 合同为目标。Octus Intelligence 和 S&P Global
              LCD 处在类似的 $20,000–$80,000 企业区间，取决于用户数量和数据范围；AlphaSense 提供五档企业定价，每用户每年 $10,000 到
              $100,000。这样的定价格局意味着，对多数大型机构买方而言，9fin 的价值主张必须证明在 Bloomberg 之上增加支出的合理性，而不是直接替代 Bloomberg。


              商业化差异显著。Bloomberg、LSEG、S&P Global 和 Octus 部署大型企业销售团队，并受益于在大银行中的既有采购关系。9fin
              的销售动作更精简、偏数字化，并通过免费层访问获取产品合格线索，由此形成成本优势，但在大型全球金融机构中也有分发风险。S&P Global 2026 年 3 月扩张至私人信贷表现数据集，并叠加既有 iLEVEL
              贷款管理工作流，说明既有巨头正在系统性延伸到 9fin 的目标增长细分。
