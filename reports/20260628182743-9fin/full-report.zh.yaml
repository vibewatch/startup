      - number: '5.3'
        title: 部署、集成与路线图
        blocks:
          - type: paragraph
            body: >
              9fin 以 Software-as-a-Service 平台形式部署，用户通过网页浏览器访问。公司提供 API，让企业客户把实时和历史信用数据、文件与分析接入内部系统、仪表盘或量化模型。API
              文档不公开；访问权限通过机构协议向企业客户开放，不配套公开开发者计划或沙盒。

              2026 年 6 月 AI 工具发布中，AI Chat 和 Research Grid 成为两个核心 AI 原生工作流模块。AI Chat 允许用户用自然语言查询 9fin
              的专有数据集，并获得带引用、可追溯的复杂信用问题答案。Research Grid 让用户可基于预设分析师框架或自定义查询，大规模进行结构化公司比较。截至 runDate，两款工具均已全面可用。

              2026 年 6 月 AI 发布之后，产品路线图瞄准信用专用 AI agents——自主软件代理将主动监控市场和客户组合，为新出现的风险与交易起草分析和提醒，让专业人士把时间放在判断上，而不是数据拼装上。CPO
              García 将其描述为构建能够“主动监控、起草并提醒，让客户专注于运用判断，而非拼装输入”的 agents。支持和可靠性承诺未公开披露；公司未发布正式平台可用性 SLA，但 SOC 2 Type II
              认证意味着存在运营可用性控制。
