      - number: '7.6'
        title: 缓释措施、否决标准与尽调问题
        blocks:
          - type: paragraph
            body: >
              对 9fin 最可操作的 thesis-break 触发点是可衡量、有边界、且能通过市场数据和 NDA 级披露观察到的。主要否决标准包括：（1）Bloomberg 或 LSEG 在 18 个月内用直接可比的 AI
              产品实质渗透 9fin 前 20 大机构客户；（2）Series C 交割后 24 个月内，美国 ARR 未达到总 ARR 的 30%；（3）NDA 审查显示毛利率低于 55%，说明编辑成本结构正在吃掉 SaaS
              经济性假设；（4）重大 AI 准确性事故——经确认的契约错误或虚构交易条款导致客户财务损失——引发合同终止连锁反应。


              持续监测指标应包括：（1）Bloomberg Terminal 订阅趋势和 AskB 采用指标（通过 Bloomberg 新闻稿和分析师调查跟踪）；（2）9fin 于 Companies House 提交的
              2024 年法定账目，截止日期为 2026 年 9 月——这将是首个独立审计的财务基线；（3）9fin 美国办公室员工数和美国客户公告；（4）FCA 或 ICO 针对金融数据供应商 AI
              模型可靠性或数据保护采取的任何执法行动；（5）AI 版权诉讼和解的节奏，它会确立许可责任基准。


              尽调问题按优先级排序：（a）在 NDA 下审查按地域、资产类别和 cohort vintage 拆分的 ARR；（b）毛利率和 burn rate，并拆分编辑 / AI 成本；（c）AI
              模型准确性基准和事故报告历史；（d）数据许可协议，确认其有权使用来源内容训练 AI 模型；（e）确认云服务商和 AI API 依赖，并提供合同 SLA 细节；（f）Bond Radar
              整合里程碑状态和数据对账完成证明；（g）任何正在进行或受到威胁的诉讼或监管问询细节。
