chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              9fin 注册名为 9FIN LIMITED（Companies House 编号 10451957），是一家面向全球债务资本市场的 AI 原生情报平台。Steven Hunter 和
              Hussam「Huss」El-Sheikh 2016 年在伦敦共同创办公司，起点是对全球最大资产类别中不透明、碎片化、手工化流程的不满。全球未偿债务达 $145
              trillion，债务资本市场规模远超股票市场，却长期少有技术投入；信用专业人士仍在用可追溯到 1980 年代的方法分析数据。


              9fin 的核心产品是一套统一平台，把新闻、专有结构化数据、分析和 AI
              驱动工作流集中起来，帮助信用专业人士比传统系统更快发现、分析并执行机会。平台覆盖高收益债、杠杆贷款、不良债务、抵押贷款债券（CLO）、私人信贷、资产支持融资（ABF）和投资级债务。2026 年 4
              月亚太平台上线后，地域覆盖延伸至北美、欧洲、拉美和亚太。具名客户包括 KKR、Apollo Global Management、BNP Paribas 和 Kirkland &
              Ellis。公司公开目标是在本十年内成为债务资本市场 AI、数据和分析的全球第一提供商。


              商业模式是 B2B SaaS 订阅，收入来自向投资银行、资产管理公司、对冲基金、律师事务所和私人信贷基金出售机构访问许可。9fin 官网称客户包括 300+ 家头部公司、80% 的交易台、全部全球前 10
              大投资银行，客户合计 AUM 超过 $17 trillion。到 2026 年中，官方关于页面列出 350+ 家机构客户和 350+ 名员工。2026 年 3 月，公司完成 $170 million Series
              C，估值 $1.3 billion，进入独角兽行列。
