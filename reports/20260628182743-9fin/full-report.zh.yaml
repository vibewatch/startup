              几乎所有机构都保留 Bloomberg，同时增加专业平台，这意味着 9fin 面临的 Bloomberg 正面替代风险有限，但也无法收取完整平台定价。多平台并用把 9fin 的定价权限制在它相对
              Bloomberg 为分析工作流提供的增量价值上，因此其竞争策略必须聚焦深度和效率提升，而不是成本替代。
