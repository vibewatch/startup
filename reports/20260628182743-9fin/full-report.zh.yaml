          - type: callout
            title: Octus CreditAI 是 9fin AI 领先地位最尖锐的竞争威胁
            body: >-
              Octus 2026 年 3 月推出 CreditAI，瞄准的正是 9fin 声称具备主要差异化的工作流——契约和信用协议分析。凭借 10,000 多个领域调优提示词、PE
              支持资本，以及在同一批律师事务所和信用基金中的既有关系，Octus 既有技术架构，也有分发能力，可能在一到两个产品周期内压缩 9fin 当前的 AI 领先。
