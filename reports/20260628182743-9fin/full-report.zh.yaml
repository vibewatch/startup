  - id: TV006
    title: 最终尽调要求
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计 ARR 和收入
        - FY2024 经审计 ARR 数字、同比增长率和收入确认政策
        - 没有这些，100% ARR 增长说法无法核验，估值倍数也无法对标
        - NDA 数据室，或等待 Companies House FY2024 法定账目（预计 2026 年 Q3–Q4）
      - - NRR 和 GRR
        - 按 cohort 和地区拆分的净收入留存与总收入留存指标
        - 这是最关键的 SaaS 健康指标；缺失会阻止高置信度承保
        - NDA 数据室；要求管理层提供 cohort 级留存 KPI 看板
      - - 烧钱率和跑道
        - 月度现金消耗、$170M Series C 带来的预计运营跑道，以及盈利时间表
        - 烧钱率未知时，$170M 可能代表 18 个月，也可能代表 5 年；风险画像会根本改变
        - NDA；要求 CFO 运营模型和董事会批准的财务计划
      - - 股权结构和优先权堆栈
        - 完整资本结构表，包括优先权金额、清算瀑布和反稀释条款
        - 优先权悬置决定普通股投资者能否在低于某个阈值的退出中参与分配
        - 向管理层索取；Companies House SH01（2026 年 4 月）提供部分股份配发数据
      - - 美国 ARR 贡献
        - 美国、EMEA、APAC 的 ARR 拆分，美国特定增长率，以及按分部划分的 pipeline
        - 美国是公司声明的首要增长市场；没有美国 ARR，增长耐久性论点无法评估
        - NDA；要求披露按地区划分的收入和美国销售 pipeline 报告
      - - AI 模型 IP 和训练数据来源
        - AI 训练数据的法律状态、版权立场、授权协议和诉讼暴露
        - AI 版权诉讼风险是最高的未解决 IP 风险；模型来源可能影响企业采购
        - 法务 NDA；IP 尽调简报；审阅训练数据授权文件和法律顾问意见
    notes: 尽调要求按对投资决策的重要性排序。第 1–3 项是投资前置条件；第 4–6 项是形成确信所需的风险校准要求。所有项目都需要签署 NDA。
    claimRefs:
      - CV004
      - CV021
      - CV026
      - CV037
      - CV038
      - CV042
