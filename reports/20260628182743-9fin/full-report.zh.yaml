      - number: '5.2'
        title: 平台架构与运营模式
        blocks:
          - type: paragraph
            body: >
              9fin 是云原生、AI 原生平台。技术架构底层负责数据摄取与标准化，中间层做 AI 和分析处理，顶层提供编辑内容和用户应用。数据源包括公开申报、PDF、发行文件、新闻源、邮件，以及 Bond Radar
              的历史发行数据。平台通过 NLP 和 AI 管线处理这些来源，抽取、分类并结构化契约条款、财务指标、交易时间线和信用信号。

              AI 引擎结合专有和第三方大语言模型，并针对债务资本市场用例做微调和校准。CEO Steven Hunter 称，AI 赢家将由“这些模型所建立在其上的情报质量”定义，把 9fin
              的专有数据和编辑网络定位为核心护城河。CPO Moisés García 确认，所有 AI 输出都以 9fin 的专有债务市场数据为基础，并回链至原始来源材料。这套引用架构让每个 AI
              生成答案都能追溯到底层文件或数据点，是维持可审计性和企业级信任的有意设计。内部信用、不良和法律分析编辑团队负责塑造并校准模型输出，确保质量、语境和一致性。

              Bond Radar 收购（2025 年 3 月）把平台数据层扩展到 20 年高收益、杠杆贷款、投资级和新兴市场历史发行数据。到 2026 年一季度初，Bond Radar 内容已完全整合进 9fin.com
              平台，客户通过单一统一登录访问全部数据集。运营上，9fin 采用编辑与技术混合模式：平台自动化数据抽取和分析，内部市场记者与法律专家团队提供编辑报道，同时服务人类读者并校准 AI。
