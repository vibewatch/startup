      - number: '5.5'
        title: 信任、安全、隐私与合规
        blocks:
          - type: paragraph
            body: >
              企业信任和监管合规是 9fin 产品定位的核心。公司于 2025 年 10 月获得 SOC 2 Type I、Type II 和 SOC 3 鉴证，其中 Type II
              审计未发现例外，证明安全控制在较长审计期间内有效运作。定期第三方审计和漏洞测试是标准做法。对于受严格数据驻留和监管要求约束的客户，9fin 以 AI 模型输入零数据留存政策支持：客户数据不会训练底层 AI 模型。

              作为一家英国注册公司（9FIN LIMITED，Companies House 编号 10451957），且业务服务欧洲和美国机构，9fin 受
              GDPR（EU/UK）及相关金融数据处理法规约束。平台不持有或处理客户交易头寸或保密组合数据；它提供情报以支持决策，而非执行决策，因此相比处理客户资产或订单的系统，直接监管暴露较低。

              关键合规限制包括：未公开披露 uptime SLA；对于通过 Bond Radar 整合的第三方数据，数据谱系和权利信息公开有限；依赖第三方 LLM 提供商，其数据处理实践引入供应链风险。用户评论指出，AI
              抽取并非总是完全准确，某些情况下需要人工验证；随着客户更依赖自动化信用输出，这一风险会放大。
