      - number: '4.4'
        title: 财务结论与尽调缺口
        blocks:
          - type: paragraph
            body: >
              9fin 的财务画像有吸引力：公司连续多年报告 ARR 增长 100%，$170M Series C
              后资产负债表资金充足，收入模型具备高切换成本、企业订阅、机构锁定等结构特征；如果增长数据得到验证，单位经济应当健康。但 2024 年经审计法定账目缺失（2026 年 9 月到期）、ARR、毛利率、NRR、烧钱率和
              CAC 均未公开披露，再加上持续依赖股权融资，仅凭公开信息还无法支撑承销判断。


              原则上，收入质量论点很强：来自受监管机构客户、且切换成本高的订阅收入天然黏性强；“行业领先留存”虽未验证，但方向上符合客户画像。问题在于，报告的 100% ARR
              增长究竟来自可持续市场扩张，还是部分来自小基数和激进销售投入。7x–20x ARR 的隐含估值倍数落在资本市场基础设施 SaaS 的行业常态内（Finro 2025 数据库 EV/Revenue 中位数约
              18x），但区间很宽，说明 ARR 不确定性是首要承销变量。


              业务资本强度偏高：以估算 $65M–$183M ARR 为基础，公司已融资 $250M，高于纯数据平台常见水平，反映编辑运营、AI
              基础设施和全球销售组织需要复合投入。公司未公开承诺转正自由现金流路径。公司以现金流转正为目标，但未披露时间表。按优先级排序，尽调阻塞项为：（1）经审计 ARR 与毛利率披露；（2）按 cohort 划分的
              NRR/GRR；（3）Series C 后烧钱率和现金头寸；（4）按细分市场划分的 CAC；（5）按客户类型划分的 ACV 区间。
