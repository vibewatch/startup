      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              9fin 并未依据 FSMA 2000 获得 FCA 金融服务公司授权，也未在英国、美国或欧盟持有任何金融服务牌照。作为向受监管机构提供信息工具的技术和数据供应商，9fin
              位于直接监管边界之外——但这并不意味着没有风险。FCA 2026 年 AI 方法文件明确指出，受监管机构需要证明其对第三方 AI 和数据工具具备稳健治理；透明度、偏差缓释和韧性文件要求由此向上游流动到 9fin
              这类供应商。受 FCA Consumer Duty、SMCR 和运营韧性框架约束的机构客户，越来越要求数据供应商提供 SOC 2 Type II 报告、DPA 和事故响应承诺。


              Bank of England 的 PS7/26（2026 年 3 月）运营事故与第三方报告政策，创造了一个具体间接义务：9fin 的机构银行客户必须就重大第三方安排和事故通知监管机构。若 9fin
              宕机或数据错误影响客户工作流，即使没有直接执法，也会成为 PS7/26 下的可报告事件，带来声誉和客户关系风险。FINRA 2026
              年监管监督报告将第三方数据提供商的供应商集中列为系统性风险，要求会员公司评估并记录对关键供应商中断的暴露。


              EU AI Act（合规日期从 2024 年 8 月延伸至 2026 年）将用于信用风险评估和金融决策的 AI 工具归类为高风险 AI 系统，要求风险管理文件、训练数据质量治理、人工监督安排和透明度义务。虽然
              Brexit 后 9fin 主要处于英国司法辖区，欧盟成员国中的机构客户访问平台，会在 AI Act 和 GDPR 下产生实质合规义务。ICO 的 UK GDPR
              指南确立了英国特定的数据保护设计义务，适用于所有处理英国数据主体个人数据的实体。


              AI / IP 版权诉讼是严重程度最不确定的法律风险。行业专家和诉讼调查确认，2026 年 AI 训练数据版权诉讼加速。Bartz v. Anthropic $1.5B 和解，以及针对大型 AI
              公司的持续诉讼，建立了财务暴露基准。若数据授权未确认，9fin 用债务工具、契约协议、贷款文件和编辑内容训练的 AI 模型可能面临类似索赔。9fin 的四实体法律结构（9fin Limited UK、9fin
              Inc. US、Bond Radar Ltd UK、Bond Radar Asia HK）也会在业务扩张中带来跨司法辖区税务、劳工和监管合规复杂性。
