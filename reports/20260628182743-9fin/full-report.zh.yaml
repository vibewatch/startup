            body: >
              9fin 公开确认了一组规模不大但知名度高的具名客户名单，共同构成最强的公开可验证机构采用证据。KKR、Apollo Global Management、BNP Paribas 和 Kirkland &
              Ellis 在 9fin 2026 年 4 月 APAC 发布新闻稿中被明确点名，并由多家新闻机构独立确认，说明平台已在买方、卖方和法律垂直领域的标杆机构中生产级部署。CPP Investments
              是尤其强的参考案例：这家加拿大养老金基金在 2026 年 3 月参与 $170 million Series C 前已是 9fin 客户，HarbourVest
              和公司均称该安排“证明了平台价值”。这种客户兼投资人的双重关系证据权重很高，因为它意味着客户内部的受托评估在财务承诺前已独立验证产品价值。


              两个已发布客户案例提供了最细颗粒度的具名证据。管理超过 €20 billion 的欧洲中型私募股权公司 IK Partners，从一套拼凑的传统数据源切换到
              9fin，用于覆盖银团和私人信用的实时债务市场情报。另一篇已发布案例写到一家匿名头部欧洲另类信用专家（对冲基金 / 私人信用管理人），其投资者关系副总裁和投资总监称，9fin 在私人信用、高收益和 CLO
              市场跟踪中具备更好的覆盖宽度和及时性。第三方验证来自 Milbank LLP：该所位列 9fin 首届 H1 2025 Private Credit Law Firm League Tables
              美国和欧洲贷款人法律顾问第一名，Milbank 在官网独立发布这一排名，确认其深度使用 9fin 专有排名表基础设施。FeaturedCustomers 汇总 24 条推荐，并报告 9fin 在 500
              条参考评分中获得 4.8/5 星。
