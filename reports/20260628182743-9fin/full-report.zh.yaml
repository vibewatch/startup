      - number: '6.6'
        title: 图表材料
        blocks:
          - type: callout
            title: 前十大投行全部确认
            body: >
              9fin 渗透全球前十大投行全部和约 80% 交易台，是这个阶段 pre-IPO 金融科技公司可获得的最强客户证明之一。在企业级 B2B SaaS
              中，替换全球最大金融机构的传统工作流，必须通过合规、安全和采购审查，这些审查本身就是很高的竞争进入门槛。这一渗透水平既提供高切换成本护城河，也为剩余可服务市场提供强参考验证。
            calloutType: strength
            claimRefs:
              - CU003
              - CU005
          - type: callout
            title: 行业领先留存尚未验证
            body: >
              没有 NRR、GRR 或 cohort 数据，就无法独立评估 9fin
              的“行业领先留存”说法。鉴于高切换成本和机构客户，结构性留存论点可信；但缺少经审计财务披露，无法用量化方式承销留存叙事。考虑到收入很可能集中在少数头部银行和资产管理账户，一旦失去单一大客户，或关键账户关系降级，就可能对
              ARR 造成实质影响。
            calloutType: risk
            claimRefs:
              - CU011
              - CU032
          - type: callout
            title: 留存与集中度的优先 NDA 级尽调
            body: >
              本章最高优先级的两项尽调请求是：（1）至少三个财年、按 cohort 年份和细分市场划分的 NRR 与 GRR；（2）前十大客户收入集中度。这两个数据点决定 ARR
              增长轨迹是可持续，还是依赖持续获取新客户来抵消未披露流失。补齐这些缺口会实质改变投资判断。
            calloutType: recommendation
            claimRefs:
              - CU011
              - CU032
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险图景概览
        blocks:
          - type: paragraph
            body: >
              9fin 的风险画像由几项因素共同塑造：资本密集型企业 SaaS
              建设、由根深蒂固在位者主导的竞争市场，以及业务达到自由现金流前对持续股权融资的结构性依赖。按严重程度排序，风险层级顶部是竞争与执行风险，其后是财务模型风险、AI /
              法律暴露和运营风险；监管风险低于标题看上去的严重程度，因为 9fin 不是直接受监管的金融服务公司。


              按发生可能性和剩余影响综合衡量，前五大风险是：（1）Bloomberg、LSEG 或资金充足的挑战者在更优数据基础设施上部署可比 AI，造成竞争替代；（2）美国市场执行失败——无法在融资提供的 24–36
              个月窗口内，把 Series C 扩张任务转化为可持续美国收入基础；（3）财务模型风险——资本强度超过增长，导致 down round
              风险或无法获得后续融资；（4）在未确认授权的情况下，用债务文件和编辑内容训练模型带来的 AI / IP 版权诉讼暴露；（5）关键人物和人才风险集中在联合创始团队与资深编辑人员。


              风险之间高度联动，并会互相放大。若 Bloomberg AskB AI 持续上线并赢得机构订单，会同时触发客户流失、削弱合同续约议价力、提高美国扩张
              CAC，并压缩下一轮融资隐含估值——单一竞争事件即可引发连锁反应。同样，任何 AI 模型输出质量破口（契约错误、虚构债券条款）都可能引发客户流失、声誉损害，以及 FCA 原则型 AI
              监管框架下的监管关注；这条链条从运营问题开始，最终演变为估值事件。


              下方风险热力图（FR001）和风险传导图（FR002）总结了严重程度分布和传播路径。最终章节提出的缓释措施、监测指标和终止标准，将每项风险锚定到具体尽调请求或推翻投资论点的触发器。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR034
          - type: figure
            figureRef: FR001
