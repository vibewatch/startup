        title: 展示项
        blocks:
          - type: callout
            title: 专有数据语料是 9fin 最深的护城河
            body: >-
              20 多年信用交易历史、基于领域专项文档训练的 AI 模型，以及人工编辑监督结合在一起，形成任何新进入者都需要多年才能复制的数据和模型语料。这项资产不只是数据本身，还包括每笔贷款 100
              多个契约数据点的结构化抽取，正是它让数据库具备分析价值，而不只是规模大。
            calloutType: strength
