        title: 市场规模：TAM、SAM 与约束视角
        blocks:
          - type: paragraph
            body: >
              评估 9fin 的机会需要三种规模视角，不能只依赖一个宽泛估算。

              第一种、也是最宽的视角，是底层债务资产类别。它为情报机会提供背景，但本身不是软件收入市场。OECD Global Debt Report 2026 记录主权和公司债券市场合计 $109 trillion，EMDE
              主权债券另有 $12.1 trillion。Institute of International Finance 报告，全球总债务（包括贷款和私人债务在内的所有部门）达到 $353 trillion。BIS
              跟踪的国际债务证券未偿规模截至 2026 年 Q1 为 $34.3 trillion。2026 年全球总借款预计为 $29 trillion，较 2024 年增长 17%，反映主权再融资需求和企业 AI
              驱动资本开支计划。仅 9 家大型科技超大规模云厂商就在 2025 年从债券市场融资 $122 billion。第一种视角验证了底层活动规模，但不能直接换算为软件收入。

              第二种视角是金融分析软件市场。Mordor Intelligence 估算 2026 年全球金融分析市场为 $13.87 billion，并预计到 2031 年以 11.05% CAGR 增至 $23.42
              billion。QY Research 估计 AI 驱动固定收益分析子领域 2025 年为 $6.3 billion，2026 年达到 $7-8 billion，到 2032 年以 12-13% CAGR 增至约
              $13.7 billion。Opimas 估算 2023 年资本市场技术总支出为 $163 billion，到 2028 年以每年 8% 增至 $244 billion，其中供应商提供的外部软件约 $48
              billion。9fin 的 SAM 是金融分析市场中 DCM 专项子集，而不是完整的 $13.87 billion，因为只有一部分金融分析支出指向信用 / 债务工作流。DCM 专项情报软件 SAM 估计为
              $3-8 billion 是可辩护的，但缺少直接第三方验证。

              第三种视角是 9fin 最直接服务的具体细分市场：杠杆金融和私人信贷。这一视角给出最清晰的增长信号。ION Analytics / Debtwire 报告，2025
              年美国和欧洲杠杆金融发行（高收益债和杠杆贷款）合计 USD 1.73 trillion，为有记录以来第二高年度水平。美国高收益债发行超过 $325 billion（同比 17%），欧洲 HY 达到 €141
              billion（历史新高）。美国未偿杠杆贷款为 $1.55 trillion。PwC 和 Preqin 数据显示，2025 年全球私人信贷 AUM 超过 $2 trillion，并预计到 2030 年达到
              $3.4 trillion。2026 年 CLO 发行预计为 $150-230 billion，私人信贷 CLO 约占总量 20%。这些细分市场活动水平直接决定 9fin 平台必须跟踪的交易、deal
              和信用数量——活动越多，信息需求越高。

              SOM（可获得服务市场）无法用公开数据计算。9fin 报告 2026 年中有 350+ 家机构客户，ARR 连续多年增长 100%，但 ARR 未披露。若按每家机构平均年度合同价值
              $50,000-$200,000 粗略估算，350 家客户对应 $17.5-70 million ARR——这是高度不确定的区间，相当于 $13.87 billion SAM 代理市场的 0.1%-0.5%。
