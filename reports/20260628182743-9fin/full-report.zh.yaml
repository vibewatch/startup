      - number: '1.2'
        title: 创始人与领导层
        blocks:
          - type: paragraph
            body: >
              9fin 由两名 University of Bristol 校友共同创办，两人的经验互补，横跨债务资本市场和金融科技。Steven Hunter（CEO）2013 年以一等荣誉法学学位毕业，随后在 J.P.
              Morgan 伦敦 Leveraged Finance 团队工作两年，再加入 Babson Capital Management（现 Barings），覆盖欧洲高收益债和杠杆贷款市场。Hussam
              El-Sheikh（CTO）持有航空航天工程 MEng，毕业后加入 Deutsche Bank 任分析师，后升至 Prime Finance、Equities and Derivatives Technology
              副总裁。两位创始人都亲身经历过信用市场数据不透明、速度慢、碎片化的痛点，这直接催生了 9fin。


              公司扩张后，高管团队也随之扩容。Moisés García 加入担任 Chief Product Officer，并主导 2026 年 6 月 AI Chat 和 Research Grid 上线。截至 2026
              年 4 月，公司约有 400 名员工；Hunter 表示计划「显著」扩员，重点投向 AI、产品和工程。Companies House 文件显示，9fin 运营员工股票期权计划，归属期为四年。


              董事会成员包括两位联合创始人（Hunter 自 2016 年 10 月起任董事；El-Sheikh 自 2016 年 11 月起任董事），以及 Alex Finkelstein（Spark Capital
              General Partner，2022 年 11 月 Series A+ 后加入）和 Fergal Mullen（Highland Europe 合伙人，2024 年 12 月 Series B
              后加入）。LDC Nominee Secretary Limited 于 2025 年 7 月获任公司秘书。前董事包括 Redalpine 的 Aleksandra Laska（2024 年 2 月离任），她自
              Series A 起承担关键治理角色；以及 Fly Ventures 的 Marie Jae-Hee Wennergren，她参与了种子轮和 Series A 阶段。Gabriel Matuschka 和
              Harald Nieder 也曾在早期担任董事。


              关键人风险实质存在：Steven Hunter 负责客户关系、美国扩张和外部定位，Huss El-Sheikh 负责全部工程和技术开发。截至 2026
              年中，两位创始人仍在一线担任高管。公司未披露公开接班计划。任一创始人离开，都会对公司由产品牵引、创始人驱动的文化构成重大风险。
