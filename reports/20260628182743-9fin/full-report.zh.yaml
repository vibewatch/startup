      - number: '8.2'
        title: 估值背景与可比分析
        blocks:
          - type: paragraph
            body: >
              9fin 的 $1.3 billion Series C 估值，对应估算 ARR 倍数为 7–20x，取决于未披露的真实 ARR。高增长 intelligence SaaS 市场中，AlphaSense
              是最直接的可比对象：Q1 2026 ARR 为 $600M，估值 $7.5B，约等于 12.5x ARR，且 ARR 同比增长 73%。9fin 公司声称的 ARR 增长 100% 显著高于
              AlphaSense；若增长得到验证，理论上可支撑更高倍数。但 AlphaSense 的 ARR 规模是 9fin 的 9-10x，$7.5B 估值则是 9fin 的 5.8x——这是规模和证据质量应得的溢价。


              上市金融数据可比公司交易倍数低得多：FactSet 在 $2.4B ARR、5-7% 增长下约为 3.5x 收入；MSCI 在 $3.1B 收入、更强的 10-14% 增长和 53-57% 经营利润率下约为 9x
              收入。Clearwater Analytics 私有化交易（Permira 和 Warburg Pincus 于 2025 年 12 月以 $8.4B 收购）是近期最清晰的 M&A 可比，约为估算收入的
              24x，代表关键任务型机构 fintech SaaS 在可比组中的最高倍数，也证明战略收购方和大型 PE 赞助方愿意为 AI 增强、深嵌机构工作流支付高价。


              Damodaran 2026 年 1 月数据集显示，Information Services 行业 EV/Sales 中位数为 2.21x；Eqvista 2026 年分析显示，Software（System &
              Application）为 11.41x，Financial Services（Non-bank & Insurance）为 18.91x。9fin 隐含 7–20x 倍数，符合高端软件和 fintech
              区间：高于低增长上市数据公司，但低于规模化、留存高、增长高的 SaaS 峰值溢价。若 9fin 真实 ARR 为 $65–72M（与规模化 18–20x 倍数一致），可比组足以支撑估值。若 ARR
              更低，倍数会扩张到支撑更弱的区间，估值则被拉伸。


              未发现公开证据显示稀释或 preference overhang；Companies House SH01（2026 年 4 月）记录了股份配发，但未披露经济条款。入场纪律受这种不透明约束。
