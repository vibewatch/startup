      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 跟踪：平台有吸引力，但证据缺口阻止买入
            body: >-
              9fin 的 AI 原生债务情报平台展现出高溢价品类赢家的特征：专有数据护城河、打入前 10 大银行、公司声称 ARR 增长
              100%，以及最强的独立背书之一——一家成熟机构投资人既使用该平台，又投资该公司。但缺少经审计财务、NRR 未披露、burn rate 未知，都是重大承销缺口，阻止买入建议。建议跟踪并要求 NDA 访问。若
              NDA 级财务披露确认 ARR、NRR 高于 110%，且 Series C 后 burn runway 超过 30 个月，可上调至买入。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV037
              - CV042
          - type: callout
            title: 估值溢价要求持续执行
            body: >-
              9fin 估值 $1.3B，对应估算 7–20x ARR；公允价值区间 15–18x 暗示 ARR 为 $72–87M。若 ARR 增长同比放缓至 50% 以下，或 Bloomberg
              成功大规模部署用于杠杆融资工作流的 AskB，倍数必须压缩，估值面临 down-round 风险。若倍数压缩 50%——与 2022–2023 年 SaaS 抛售先例一致——9fin 估值将落至
              $650M。考虑以高于 $1.3B 入场的投资人，应先要求经审计 ARR 确认。
            calloutType: risk
            claimRefs:
              - CV001
              - CV021
              - CV032
              - CV035
              - CV043
          - type: callout
            title: CPP Investments 从客户到投资人的路径是罕见信号
            body: >-
              CPP Investments 是服务数百万加拿大人的养老金基金，在作为投资人加入 Series C 前已是 9fin
              付费客户。这是本报告中最强的独立背书之一：一家受信义责任约束的机构投资人，每天用该平台做投资决策，随后选择把自有资本投给这家公司。HarbourVest 拥有 40-plus 年历史和超过 $150B
              管理资产，领投该轮时明确提出支持下一代市场基础设施的论点。这两家投资人的信号质量，在定性上高于典型风险投资轮。
            calloutType: strength
            claimRefs:
              - CV006
              - CV007
              - CV025
