      - number: '1.4'
        title: 里程碑与增长轨迹
        blocks:
          - type: paragraph
            body: >
              从 2016 年到 2026 年中，9fin 从聚焦欧洲的杠杆金融分析初创公司，成长为一家全球 AI 原生平台并成为独角兽。2016 年创立时，产品瞄准欧洲高收益和杠杆贷款市场。到 2020
              年末，覆盖已扩至不良债务、CLO 和私人信贷，并在疫情期间建立了 40+ 家客户基础。


              2021 年 10 月 Series A 支撑公司开设纽约办公室；到 2022 年 12 月，客户数超过 60 家，前 10 大投资银行中有 9 家使用平台。英国科技媒体将 9fin 评为 Sunday
              Times Tech 100 增长最快软件公司前 20 名之一。公司截至 2023 年 12 月财年的英国法定账目显示，营业额 £7.2 million，同比增长 124%，经营亏损 £10.4
              million——反映当时公司在员工、产品和美国扩张上加速投入，投入速度超过收入增长。


              2025 年 3 月，9fin 收购 Bond Radar。后者总部位于伦敦，为国际债券和贷款市场提供情报与数据，拥有 20 年历史数据。该收购把 9fin 覆盖扩至投资级债务和新兴市场，并增加 1,800
              多个发行人和 16,000 只工具，发行历史可追溯至 2003 年。三个月后，$50 million Series B 资金继续支持员工扩张。


              9fin 于 2026 年 4 月正式推出亚太平台，初期以香港为基地，并宣布 CEEMEA 为下一个扩张目标。2026 年 6 月，公司推出 AI Chat 和 Research Grid，这两款 AI
              工具基于公司专有的十年数据集，自动化信用研究和公司比较工作流。到 2026 年中，员工约 400 人，客户 350+ 家；公司称 ARR 已连续多年实现 100% 增长。确切 ARR 数字仍未公开。
