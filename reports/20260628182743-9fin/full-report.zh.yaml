  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              9fin 将自身市场定义为全球债务资本市场（DCM）：发起、交易、投资或顾问债务工具的专业机构集合。范围覆盖杠杆金融（高收益债和杠杆贷款）、私人信贷（直接贷款、业务发展公司和
              unitranche）、抵押贷款债券（CLO）、不良债务与重组、投资级债券和资产支持融资（ABF）。9fin 在 Series C 公告中引用的 $145 trillion 指全球债务资产的最宽口径；OECD
              Global Debt Report 2026 测算主权与公司债券市场合计未偿规模为 $109 trillion，其中公司债券 $36.4 trillion，银团贷款 $23.1
              trillion。规模差异来自口径：9fin 的框架纳入私人 / 非上市债务、贷款，以及 OECD 债券市场边界之外的工具。

              在这一大市场中，9fin 的产品边界覆盖信息和工作流情报——新闻、结构化数据、分析、契约审查、新发行日历和 AI 驱动研究——而不是交易执行、清算或结算基础设施。9fin 的直接替代品是 Bloomberg
              Terminal，后者提供广泛固定收益数据和消息系统，但缺少 DCM 专业深度；相邻替代品包括 Debtwire、Reorg Research、LCD（S&P Global）、Fitch Solutions 和
              Acuris。现状替代方案是手工流程：分析师从 PDF、邮件、数据室和推介材料中汇总数据。9fin CEO Steven Hunter 形容这些方法可追溯至 1980 年代，尽管市场规模已达 $145
              trillion。9fin 边界之外包括：股票市场、零售 / 消费贷款、外汇和衍生品，以及通用企业分析平台（如 Tableau、Salesforce）。

              过去彼此分离的细分市场正在融合——银行和私人信贷基金如今争夺同一批大盘贷款，广泛银团和私人信贷 CLO 抵押品也越来越混合——这会随时间扩大 9fin 的可服务边界。2025 年上线的拉美覆盖和 2026 年 4
              月上线的亚太覆盖增加了地域范围。最终边界宽但一致：任何在机构规模非股权债务工具的发起、投资或顾问中承担专业角色的机构。
