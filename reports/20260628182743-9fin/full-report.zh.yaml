  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层
        blocks:
          - type: paragraph
            body: >
              9fin 的客户群覆盖全球债务资本市场生态中的五类主要机构。投行——包括全球前十大机构全部——按收入和战略渗透看价值最高，使用 9fin
              做交易发起筛选、销售与交易风险监控，以及重组流程支持。买方参与者包括合计管理超过 $17 trillion AUM 的资产管理公司和对冲基金，是第二大主要客群，借助平台做组合再平衡、相对价值分析和 AI
              驱动的研究自动化。律师事务所构成一个独立且高可见度的垂直领域：9fin 通过契约分析、先例搜索和文件智能切入头部杠杆融资法律业务。私人信用基金和顾问 /
              重组公司补足主要客群图景，它们用平台监控信息最碎片化的不透明私人信用市场。


              地理上，平台足迹覆盖欧洲（核心收入市场）、北美（按 9fin 自身说法为增长最快地区）、拉丁美洲（2024–2025 年扩张）和亚太（2026 年 4 月正式上线，覆盖 1,800+ 发行人和 16,000
              支工具）。CEEMEA 扩张已宣布为下一阶段。9fin 只做企业客户——无免费层、仅直销、机构合同——意味着平均合同价值远高于
              $100,000，客户集中在采购周期多年的大型受监管实体。公司不公开披露各细分市场收入拆分，也不披露头部客户收入占比。
