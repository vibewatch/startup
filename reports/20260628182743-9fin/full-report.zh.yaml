            body: >-
              按 $1.3B 估值和估算 $65M–$183M ARR 计算，9fin 隐含收入倍数为 7x–20x，处于资本市场基础设施 SaaS 区间内（Finro 中位数 18.3x）；但区间本身就是问题：只有确认
              ARR，才能精确评估估值。公司累计融资 $250M+，且未披露盈利时间表，股权稀释风险不低。每一轮高倍数融资都会稀释早期投资人和创始人；若 ARR
              增长放缓或市场环境收紧，估值重置很可能发生。Briefglance 的分析明确质疑，在未验证财务表现的情况下，$1.3B 赌注能否维持。
