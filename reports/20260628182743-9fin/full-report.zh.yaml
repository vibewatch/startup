      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              9fin 的买方范围可拆成六类机构，每类都有不同工作流、预算归属和采用路径。这些分层并不互斥——许多大型机构同时扮演多种角色（例如全球银行既是发起方，也是投资方）。

              投资银行是当前渗透最广的细分：按 9fin 官网说法，公司服务全部全球前 10 大投资银行和 80% 的交易台。大型 DCM 和杠杆金融团队主要用 9fin 做交易监控、mandate
              情报、新发行日历跟踪和竞对覆盖。预算所有者通常是 DCM 或杠杆金融团队负责人；采购会涉及技术 / 数据供应商评审。采用触发点是速度——在信息不对称会直接转化为赢得 mandate
              的市场里，更快获得准确信报就是差异化收入工具。

              信用型对冲基金是分析要求最高的细分：它们需要颗粒度契约审查、实时不良债务预警覆盖、重组情报和 CLO 分析来创造 alpha。对这些机构而言，9fin 最直接的对手是 Reorg Research 和
              Debtwire。预算所有者是投资组合经理和研究主管；采用驱动因素是相对同行的信息优势。

              固定收益资产管理公司用 9fin 放大信用研究能力——替代或增强初级分析师在初筛、新闻监控和文档审查中的作用。9fin 自称 AI 工具现在能在「几分钟内完成数周研究」，因此这一细分的 ROI
              逻辑很强，尤其是管理 $10 billion+ AUM 的基金，研究产能往往是瓶颈。

              律师事务所被低估，但具备战略价值。重组和杠杆金融业务用 9fin 做契约分析、债权人团体情报和交易来源支持。CPP Investments 在成为 Series C 投资方前就是 9fin
              客户，体现了资产管理公司 / 投资方的交叉。9fin 在公开沟通中明确把律师事务所列为关键采用者。

              私人信贷基金是增长最快的采用前沿。全球私人信贷 AUM 超过 $2 trillion，交易竞争加剧后，9fin 的专有交易管线情报，以及 BSL 与私人信贷市场融合，提供了差异化交易获源能力。CLO
              管理人——同时属于私人信贷和资产管理的子细分——用平台跟踪新发行并监控组合。

              所有细分中，买方（与 9fin 签约的机构）、用户（日常操作平台的分析师 /
              PM）和付款方（批准支出的预算持有人）通常是三个不同角色。这种三方结构拉长企业销售周期，但一旦建立关系，平台嵌入日常工作流后会带来强留存。
