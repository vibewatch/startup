  - id: financial-verdict
    title: Financial Verdict and Diligence Gaps
    body: |
      9fin's financial profile presents a compelling growth narrative supported by multiple consecutive years of reported 100% ARR growth, a well-funded balance sheet following the $170M Series C, and a revenue model with structural characteristics — high switching costs, enterprise subscriptions, institutional lock-in — that should support healthy unit economics if the growth data is verified. However, the absence of audited statutory accounts for 2024 (due September 2026), the lack of any public disclosure of ARR, gross margin, NRR, burn rate, or CAC, and the concentrated reliance on continued equity financing together mean that no underwriting judgment is yet supportable from public information alone.

      The revenue quality argument is strong in principle: subscription revenue from regulated institutional clients with high switching costs is inherently sticky, and the claim of industry-leading retention, while unverified, is directionally consistent with the customer profile. The concern is whether reported 100% ARR growth reflects durable market expansion or is partly an artifact of a small base and aggressive sales investment. The implied valuation multiple of 7x–20x ARR is within sector norms for capital markets infrastructure SaaS (median ~18x EV/Revenue per Finro's 2025 database), but the wide range signals that ARR uncertainty is the primary underwriting variable.

      The capital intensity of the business — $250M raised against an estimated $65M–$183M ARR base — is above the level typical for pure data platforms and reflects the compound investment required by editorial operations, AI infrastructure, and a global sales organisation. Path to positive free cash flow is not publicly committed. The company targets positive cash flow but no timetable has been disclosed. Diligence blockers, in priority order: (1) audited ARR and gross margin disclosure; (2) NRR/GRR by cohort; (3) burn rate and cash position post-Series C; (4) CAC by segment; (5) ACV range by customer type.
