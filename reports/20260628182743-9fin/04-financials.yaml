callouts:
  - calloutType: strength
    title: "Multiple Years of Reported 100% ARR Growth"
    body: "9fin has publicly reported multiple consecutive years of approximately 100% annual ARR growth, corroborated by independent coverage of both the Series B and Series C funding contexts. While unaudited, the consistency of the claim across investors (who are presumably conducting their own due diligence) and the conversion of CPP Investments from customer to investor provide circumstantial validation. If confirmed by audited accounts, a sustained 100% growth rate at an estimated $65M–$183M ARR base would represent exceptional performance for a company in the capital markets data sector."
    claimRefs:
      - CI006
      - CI029
      - CI022

  - calloutType: risk
    title: "Severe Opacity: No Audited Financials, No Disclosed Revenue"
    body: "9fin does not publish ARR, gross margin, NRR, burn rate, CAC, or ACV figures. The 2024 statutory accounts at Companies House are not yet filed (due September 2026), meaning no independently audited financial baseline exists from which to verify growth claims, assess unit economics, or determine capital adequacy independently. This level of disclosure opacity is consistent with private company norms but represents a material underwriting blocker. The $1.3B valuation and the 100% ARR growth narrative are currently unverifiable from external sources."
