  - id: capital-adequacy
    title: Capital Adequacy and Financing Dependency
    body: |
      9fin has raised more than $250M in total since inception in 2016, with the March 2026 Series C of $170M the largest single tranche. The round was led by HarbourVest Partners, with CPP Investments joining as a new institutional equity partner alongside existing investors Highland Europe, Spark Capital, Redalpine, and Seedcamp. The Series C capped a roughly fifteen-month fundraising trajectory that included the December 2024 Series B of €47.5M (~$50M), itself led by Highland Europe.

      Post-Series C, the company's cash position is not publicly disclosed, but the raise provides a substantial capital cushion. At a median enterprise SaaS burn multiple of 1.5x–2.0x net new ARR and 400–900 employees, monthly cash burn is likely in the range of $2M–$7M, implying runway of approximately 24–72 months depending on actual headcount, compensation levels, and revenue growth trajectory. The company has identified three primary uses of proceeds: expanding AI capabilities within the platform, growing its proprietary dataset, and accelerating US market expansion — all investments that grow the cost base before generating revenue, which reinforces financing dependency in the near term.

      No debt obligations, credit facilities, or project-finance arrangements are visible in Companies House filings reviewed during this research. The most recent Companies House filings for 9fin Limited (company number 10451957) are corporate actions related to the Series C — a share class designation change on 20 June 2026 and a statement of capital following share allotment on 4 June 2026. The 2024 statutory accounts are due by 30 September 2026 and had not yet been filed at the time of this research, meaning no independently audited baseline exists from which to assess revenue, margin, or leverage.

      The valuation doubling from approximately $650M (implied mid-2024) to $1.3B (March 2026) reflects investor confidence in the growth narrative but also concentrates financing risk. Should operating performance or market conditions deteriorate, a down-round or reduced ability to raise would create material dilution for existing shareholders and potentially constrain the US expansion programme. At $250M+ total raised, 9fin's cumulative capital relative to estimated ARR of $65M–$183M implies a capital-intensity multiple of 1.4x–3.8x, at the higher end of the range for capital markets software businesses and warranting scrutiny of the path to free cash flow.
