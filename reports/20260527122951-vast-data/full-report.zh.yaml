        - 先测算下行情景。
      - - 估值立场
        - 昂贵
        - 本轮估值意味着约 60x 官方 CARR、约 50x Reuters 式 ARR 预测，以及约 15x 激进外部 ARR 估计
        - 当前价格已经计入成功，但公开证据尚未充分证明。
      - - 目标回报 / 持有 / 退出
        - 新资金要实现 2x 总回报需要约 $60B，3x 总回报需要约 $90B；现有持有人可为 IPO 可选性继续持有
        - 对照当前公开可比公司倍数，回报门槛很难站住
        - 新买方需要估值重置，或强得多的证据。
    notes: 本表明确对价格敏感。回报门槛按 $30B 本轮估值做算术推导，未调整未来稀释或融资条款。
