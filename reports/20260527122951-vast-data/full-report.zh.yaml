      - number: '5.2'
        title: 架构与运行模型
        blocks:
          - type: paragraph
            body: >-
              架构重心是 DASE，也就是 VAST 的解耦式 shared-everything 模型。公开技术文档描述，无状态计算节点处理协议和软件服务，持久数据和系统状态则放在 NVMe
              支撑的存储机箱里，从而让性能和容量可以独立扩展。这一点重要，因为平台叙事要求所有协议看到同一个底层数据平面：DataStore 暴露文件和对象接口，DataBase 增加表格和查询服务，Event Broker
              把平台延伸到 Kafka 式流式场景，而块访问现在正通过 NVMe/TCP 加入。架构也被表述为部署灵活。较早参考架构仍展示经典 CBox 和 DBox 布局；Supermicro 和 Cisco
              的当前伙伴材料则展示打包方案，在保留 VAST 软件抽象的同时，适配 OEM 硬件和 AI 工厂参考设计。净读数是，VAST
              产品不是一堆松散独立产品；它是一个分层软件平台，其价值取决于共享数据平面能否在多种访问方式和节点拓扑下真正保持一致。
