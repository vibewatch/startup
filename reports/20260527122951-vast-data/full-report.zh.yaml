      - number: '2.4'
        title: 增长驱动、采纳约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              需求驱动真实且多层。IDC 的存储预测、VAST 自己的 AI 工厂叙事和参考架构都指向同一主题：AI 生产工作负载越多，就需要更多共享数据基础设施、更多全闪需求，并且更在意 time-to-token 和
              GPU 利用率。Deloitte 显示企业 AI 活动正在从试点走向生产；Cloudera 将 2026 年描述为从实验转向运营智能编排。NetApp 和 Pure
              也强调，既有厂商已经在把同一需求货币化：企业数据需要为 AI 做好准备、可访问。换句话说，VAST 卖的是一个真实品类，不是纯理论市场。但约束同样重要。Gartner 称企业仍对 ROI 敏感，并且在当前 AI
              周期里往往偏好既有供应商。Informatica 和 Deloitte 都显示，治理、数据质量和技能缺口正在拖慢扩张。Electronic Design 和 SNIA
              把存储视为一阶设计约束，因为它影响性能、功耗、散热和部署风险；Avnet 则显示 SSD 和 DRAM 紧张可能把成本推高，并把供应风险延长到 2027 年。INFUSE
              又补上一层买方信任问题：信息更多，不一定带来更强购买信心。这组因素意味着，VAST
              估值不能假设采纳毫无摩擦。最大的未解尽调问题是公司特定问题，而不是全市场问题：定价、客户数、工作负载组合、试用到生产的转化率，以及广义 AI 资本开支浪潮到底有多少落到 VAST 服务的共享数据层。
