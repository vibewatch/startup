  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 状态
      - 当前价值
      - 收入锚点
      - 隐含倍数 / 里程碑
      - 参考价值
      - 局限
    rows:
      - - Pure Storage / Everpure
