              最强的公开利润率信号指向软件主导的成本结构，尽管 VAST 卖入的是硬件很重的市场。2022 和 2023 年公司披露称业务建立在软件毛利率之上，后来又提到接近 90%
              毛利率和正现金流。架构和商业模式在这里很重要：Gemini 切开硬件和软件经济性；白皮书称 Cisco、SuperMicro 等 OEM 可以销售标准服务器 VAST 集群；Cisco 现在也把平台放上
              GPL。这些因素意味着，部分库存、制造和资产负债表营运资本负担可能落在 OEM 伙伴，而不是 VAST 自己身上。同时，Polaris 等捆绑功能和 Amplify
