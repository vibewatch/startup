  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 投资逻辑
      - 反向逻辑
      - 什么会改变判断
    rows:
      - - 市场
        - AI 基础设施需求真实，VAST 正处在大型建设周期里。
        - 如果泡沫叙事占上风，或利用率不及预期，AI 资本开支倍数可能急剧压缩。
        - 用客户续约证明需求持久，并在 AI 支出走弱时仍保持韧性增长。
      - - 产品
        - 统一的 AI Operating System 可以支撑相对传统存储厂商的溢价。
        - 如果产品广度不能转化为可变现的经常性收入，这个溢价就不值得投。
        - 披露模块级变现和附加率。
      - - 客户
        - 标杆客户和伙伴支撑战略相关性。
        - 公开资料没有量化集中度，因此一两家大型新型云厂商可能主导经济性。
        - 分享头部客户 ARR 和续约时间表。
      - - 财务
        - 官方信号显示 CARR 超过 $500M、订单额超过 $4B，并声称利润率 / 现金流为正。
        - 即便如此，距离支撑当前价格所需的约 $2B ARR 估计，仍有很大缺口。
        - 以审计形式打通订单额、CARR、ARR 和确认收入。
      - - 竞争
        - 如果 VAST 真是 AI 基础设施平台，而不是存储盒子公司，就应高于 NetApp 和 Pure 交易。
        - 除非高端 ARR 估计成立，否则即便是高溢价公开可比公司，交易倍数也远低于 VAST 隐含倍数。
        - 在大得多的规模上，证明软件式耐久性和利润率质量。
      - - 融资 / 治理
        - Fidelity 独立估值标记支撑估值确有上台阶。
        - 老股占比较高的结构和未披露的优先条款削弱价格信心。
        - 提供新股 / 老股拆分和完整股权结构瀑布。
    notes: 每一行都把真实利好与相应投资测算反对点配对。只有满足「什么会改变判断」这一列，本章建议才会上调。
    claimRefs:
      - CV018
      - CV024
      - CV027
      - CV030
      - CV035
      - CV036
      - CV037
      - CV048
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
