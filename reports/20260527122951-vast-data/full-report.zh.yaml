      - number: '3.3'
        title: 定价透明度、切换摩擦与分销力量
        blocks:
          - type: paragraph
            body: >-
              定价可见性是语料中最清楚的结构性差异之一。AWS、Azure 和 Google
              都为文件或对象服务发布明确或可由计算器驱动的用量结构；专业存储厂商大多仍把买方导向销售、演示或谈判式订阅结构。这不意味着超大规模云原生替代方案在每个真实工作负载里都更便宜，但它确实降低采购摩擦，也更容易在既有云合约里比较。Pure
              和 NetApp 又用 STaaS 模型包装平台，进一步缩小差距，而不是只卖资本开支型设备。VAST 的切换成本仍然存在，因为 PB 级数据集、调优过的 AI
              流水线和运营熟悉度都很粘。但证据说明，这些成本不像垄断式锁定那样硬：买方可以在云对象、托管文件系统、编排层和开源层之间多栖，几个替代方案还明确销售反锁定或可移植叙事。分销进一步放大这一点。上市既有厂商和超大规模云厂商已经掌握大量账户控制权，WEKA
              和 Hammerspace 还在投入扩张销售或合作伙伴。因此，VAST 要保持差异化，不能只靠速度宣称；当买方把它和云账单便利性、既有厂商账户杠杆放在一起比较时，产品、迁移路径和商业模式都必须继续站得住。
