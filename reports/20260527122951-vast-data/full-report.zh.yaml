  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域与替代方案
        blocks:
          - type: paragraph
            body: >-
              VAST 不宜被笼统归为普通 AI 基础设施公司。它自己的定位和白皮书把公司放在原始存储介质与上层 AI
              应用软件之间的共享数据层：一个统一平台，覆盖文件、对象、块、表格、向量和流式数据，并能从同一控制平面服务训练、推理、分析和 HPC
              工作负载。因此，核心市场边界包括高性能共享存储、元数据与向量检索、全局命名空间与治理，以及让这些数据服务在本地、云和边缘环境保持可用的软件。它不包括 GPU 计算、网络互联、通用应用软件或大块通用 IT
              服务支出。实际竞争框架因此窄于整体 AI 基础设施，但宽于传统 NAS 阵列。VAST
              自己的方案页面延伸到分析、合规、备份、容器和数据湖仓等相邻用例；白皮书则描述用一个以数据为中心的平台取代分散的对象存储、分析集群和编排层。现状替代方案仍包括既有全闪阵列、横向扩展
              NAS、对象存储，以及由分散存储、数据库和编排工具拼出的多产品栈。市场定义很关键：如果把更宽的 AI 基础设施口径当 TAM，会高估 VAST 能现实捕获的支出池；如果只用经典外部存储类别，又会低估 VAST
              想卖的软件和编排层。
