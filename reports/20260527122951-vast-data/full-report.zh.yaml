        - 6.4-8.0
        - 相对本轮价格大幅减记
        - 收入桥接失败、客户集中或 IPO 窗口关闭会触发。
    notes: 情景数值是估计股权价值区间，不是谈判后的条款清单结果。刻意使用宽区间，因为公开记录不支持精确到点。
