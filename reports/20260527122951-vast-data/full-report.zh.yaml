  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图、同业类别与替代路径
        blocks:
          - type: paragraph
            body: >-
              VAST 的竞争场远不止“其他闪存阵列公司”。Coldago 的 2025 文件存储图谱和 StorageNewsletter 的方法总结，把 VAST 放在企业存储和高性能存储重叠框架中，与
              Pure、NetApp、IBM、DDN、Qumulo、Hammerspace、WEKA 并列。因此，直接同业是 AI 优先的文件 /
              对象或高性能数据平台厂商，而不只是外形相似的设备厂商。下一圈是既有上市存储厂商。Pure 和 NetApp 现在在宽产品组合上销售用量导向的商业模式；IBM 仍把 Storage Scale 定位为软件定义
              AI/HPC 和混合数据平台。相邻圈层也重要：Hammerspace 和 Qumulo 主打编排、全局命名空间和混合云流动性，这会让买方降低 VAST 权重，即便不复制 DASE 架构。替代方案不是理论。AWS
              FSx for Lustre、S3、Azure Managed Lustre 和 Google Filestore 提供按用量计费、原生账单和既有云合约。内部自建和维持现状也持续存在，因为 Ceph 和
              MinIO 可以统一关键存储语义，而不把更多筹码交给单一专有厂商。结果是，VAST 同时面对直接产品竞争、既有厂商捆绑、编排替代、超大规模云原生替代，以及开源反锁定叙事。
