          label: 受监管工作负载
          detail: 金融、医疗和政府邻近用例。
      edges:
        - from: vast
          to: nvidia
          label: 加速数据栈
        - from: vast
          to: cisco
          label: 渠道和采购
        - from: vast
          to: oems
          label: 经验证硬件
        - from: vast
          to: coreweave
          label: 旗舰云收入
        - from: vast
          to: sds
          label: 以色列主权云
        - from: vast
          to: rules
          label: 数据和交易合规
        - from: cisco
          to: regulated
          label: 企业用例
        - from: rules
          to: regulated
          label: 审批负担
        - from: coreweave
          to: nvidia
          label: GPU 密集型工作负载
        - from: oems
          to: nvidia
          label: 服务器集成
    approximationNotes: 这张依赖图是敞口图，不是完整伙伴名单；它突出证据支持下风险传导最强的节点。
    claimRefs:
      - CR007
      - CR011
      - CR013
      - CR014
      - CR017
      - CR027
      - CR028
      - CR031
      - CR041
      - CR045
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 推荐判断基于真实产品和需求证明；这些证据还要跨过未解的收入桥，最后接受昂贵价格测试。
    data:
      nodes:
        - id: proof
          label: AI OS 和客户证明
          detail: VAST 在 AI 数据基础设施中似乎具有战略重要性。
        - id: financial
          label: CARR > $500M + FCF 为正
          detail: 官方证据显示的是质量，而不只是热度。
        - id: bridge
          label: 收入定义缺口
          detail: 公开证据从 $500M+ 承诺 ARR 延伸到第三方约 $2B ARR 口径。
        - id: comps
          label: 公开可比公司区间
          detail: Pure 约 7.7x，NetApp 约 4.1x，CoreWeave 约 10.9x。
        - id: decision
          label: $30B 下观察 / 继续研究
          detail: 新资金应等到证据更扎实或价格更好再进场。
      edges:
        - from: proof
          to: financial
          label: 支撑公司质量判断
        - from: financial
          to: bridge
          label: 仍不是完整估值桥
        - from: bridge
          to: comps
          label: 价格必须过公开市场锚点
        - from: comps
          to: decision
          label: 当前价格只有乐观情景能撑住
    approximationNotes: 这条流程是分析框架，不是机械模型。它说明推荐结论如何来自证据质量和价格支撑，而不是解释 VAST 产品在技术上如何运作。
    claimRefs:
      - CV007
      - CV014
      - CV024
      - CV027
      - CV030
      - CV044
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 估值争论最敏感的变量，是收入定义清晰度和公开市场倍数选择；客户集中度和倍数压缩是主要负向抵消。
    data:
      items:
        - label: 从 $0.5B 到 $2.0B 的收入桥
          value: 15
          detail: 相对官方 CARR 下限，带来最大的上行摆动。
        - label: 相对 Pure / NetApp 的溢价倍数
          value: 8
          detail: 如果 AI 平台溢价站得住，估值可显著增加。
        - label: 客户集中度 / 续约折价
          value: -6
          detail: 客户群集中会很快拉低公允价值。
        - label: AI 倍数压缩 / 退出窗口风险
          value: -5
          detail: 泡沫退潮对后期私募定价伤害最快。
    approximationNotes: 数值是相对十几 B 美元中段基准情景的方向性十亿美元级增减，用来标出哪些假设最关键，而不是给出精确 DCF。
    claimRefs:
      - CV019
      - CV021
      - CV024
      - CV027
      - CV030
      - CV038
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 情景区间显示，公开证据支持的基准情景低于本轮价格；从 $30B 入场，新资金回报门槛很高。
    data:
      items:
        - label: 悲观情景估值（USD B）
          low: 6.4
          high: 8
          detail: 用公开存储公司风格倍数，套用约 $0.8B 可持续经常性收入。
        - label: 基准情景估值（USD B）
          low: 13
          high: 21
          detail: 以约 $1.3-$1.5B 标准化经常性收入能力，套用溢价公开可比公司区间。
        - label: 乐观情景估值（USD B）
          low: 28
          high: 36
          detail: 高端 ARR 估计值加持续 AI 基础设施溢价。
        - label: 新资金 2x/3x 退出门槛（USD B）
          low: 60
          high: 90
          detail: 新资金以 $30B 入场时，稀释前所需退出价值。
    approximationNotes: 情景区间是估算股权价值。回报门槛行只是基于本轮价格的算术，用来说明为什么估值纪律重要。
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV051
      - CV052
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 供 IC 使用的记分卡显示：市场和产品证明很强，证据质量居中，而当前入场价格下估值支撑偏弱。
    data:
      items:
        - label: 市场需求
          value: 9
          detail: AI 基础设施需求显然真实。
        - label: 产品 / 护城河
          value: 8
          detail: 统一 AI OS 定位看起来有差异化。
        - label: 客户证明
          value: 8
          detail: 公开客户标识和合作伙伴背书异常强。
        - label: 经济性证明
          value: 7
          detail: 利润率和自由现金流为正的说法有帮助，但指标定义不完整。
        - label: 披露质量
          value: 4
          detail: 收入桥、股权结构表和集中度仍未公开。
        - label: 估值支撑
          value: 3
          detail: 公开证据还不能高置信度撑住 $30B 价格。
        - label: 整体可投性
          value: 5
          detail: 好公司，但这个价格下新资金入场条件不佳。
    approximationNotes: 分数是 0-10 分委员会式启发判断，用来概括证据质量和价格支撑，不是加权算法。
    claimRefs:
      - CV035
      - CV036
      - CV044
      - CV045
      - CV047
      - CV049
