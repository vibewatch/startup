        - Q1'26 收入年化 ~$8.3B
        - ~10.9x EV / 年化收入
        - 最接近的上市 AI 基础设施高溢价参考
        - 杠杆很高、耗电重；不能直接做完全可比公司。
      - - Lambda
        - 私募轮次
        - $480M Series D 轮；Reuters 报道估值 ~$2.5B
        - 公开收入未披露
        - 仅作里程碑参考
        - 说明投资人愿意为 AI 云容量支付高价
        - 目前没有收入或利润率披露。
      - - Crusoe
