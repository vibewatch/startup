    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、阶段与产品范围
        blocks:
          - type: paragraph
            body: >-
              VAST Data 是一家 2016 年创立的私营 AI 基础设施公司，如今它把自己定位为面向数据密集型应用的 “AI Operating
              System”，而不是单点存储厂商。留存来源中的公司主线方向一致：VAST
              称自己把存储、数据库和计算统一到一个数据平台里；独立报道则把同一转型描述为三阶段，先从面向闪存的存储起步，再进入数据库服务，最后走向更宽的 AI 操作系统编排。产品材料把 VAST DataStore
              描述为通用数据存储，既去掉传统存储分层，又能从 TB 扩到 EB；Supermicro 的合作伙伴材料则把该平台放在企业 AI 和 GPU 云部署的数据管理层。总部披露不如产品范围清楚。2023–2026
              年官方新闻材料交替使用 “No-Headquarters” 或 “Remote-First Company”，同时把公告锚定在纽约市；Reuters
              描述的报道又称公司总部位于纽约。因此，后续章节最稳妥的事实底座是：VAST 是一家远程优先、以纽约为锚点的私营公司，商业界面面向美国，后续地点报道也显示其在以色列有运营根基。
