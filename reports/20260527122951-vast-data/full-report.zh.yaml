      - number: '2.2'
        title: 规模测算口径与方法冲突
        blocks:
          - type: paragraph
            body: >-
              公共市场数据支撑多种可辩护口径，而不是一个干净 TAM。窄口径下，IDC 的外部 OEM 企业存储预测到 2026 年约 $37.7 billion，并明确绑定品牌存储系统，其中全闪阵列受益于 AI
              和分析需求。Fortune Business Insights 将 AI 驱动存储置于 2026 年 $44.94 billion，这是更宽口径，包含为 AI
              工作负载优化的存储架构，并区分文件型与对象型方法。Research and Markets 与 Coherent Market Insights 都把广义 AI 基础设施放在 2026 年约 $90
              billion，但这些报告打包了远多于存储的内容，横跨产品、功能、技术、部署模式和终端用户。Gartner 的 $1.366 trillion AI 基础设施数字更宽，只能作为 VAST
              品类周围总生态资本开支有多大的背景。估值时，正确结论不是某一个数字对、其他都错。更准确的是，VAST
              位于几个嵌套支出池里，每家发布机构选择了不同边界。最可防守的公开框架，是一个受证据约束的核心口径：下沿由企业外部存储限定，上沿由 AI 驱动存储类别限定；更宽的 AI 基础设施数字只作为相邻市场，而不是
              TAM。公开来源还没有披露足够的 VAST 定价、客户或赢单率数据，无法拆出干净的 SAM 或 SOM；因此，应保留互相矛盾的估算和方法限制，而不是把它们平均掉。
