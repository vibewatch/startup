      - number: '4.4'
        title: 公开牵引力与资本充足性
        blocks:
          - type: paragraph
            body: >-
              对一家私营基础设施公司来说，公开牵引力异常强，但资本充足性仍只能通过不完整披露来读。官方来源显示，从 2023 年底 $200 million ARR，到上一财年退出时超过 $500 million 承诺
              ARR，再加上 $4 billion 累计订单额、经营利润率和自由现金流为正，形成了一条阶梯。独立媒体把画面拉得更远：Reuters 相关报道谈到 $600 million ARR；Calcalist/TNW
              谈到包含非承诺组成部分在内、最高约 $2 billion 的类 ARR 收入。这个差距不只是噪音；它告诉投资人，VAST 公开引用的收入指标用了不同定义。资本充足性方面，2026 年 Series F 对公司估值
              $30 billion，总交易规模约 $1 billion，但公开报道显示，名义数字中很大一部分是老股交易。Fidelity 的 SEC
