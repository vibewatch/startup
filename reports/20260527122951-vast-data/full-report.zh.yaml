      - number: '1.3'
        title: 融资历史、估值与公开规模指标
        blocks:
          - type: paragraph
            body: >-
              VAST 的融资曲线即使放在 AI 基础设施里也异常陡峭。公司从 2021 年 5 月 $83 million Series D、估值 $3.7 billion，走到 2023 年 12 月 $118
              million Series E、估值 $9.1 billion，再到 2026 年 4 月约 $1 billion Series F 交易、估值 $30 billion。Series F
              的意义不只在价格，还有三点。第一，轮次同时包含新股和老股，因此部分资金是在兑现既有持有人，而不只是给资产负债表补弹药。第二，财团现在既有 Drive Capital、Access
              Industries、Fidelity、NEA 等财务投资人，也有 NVIDIA 作为战略参与方。第三，公司把估值上跳和罕见强的自称经营指标绑在一起：累计订单额超过 $4 billion、上一年承诺 ARR 超过
              $500 million、经营利润率和自由现金流为正。这些信号有力，但仍不能替代经审计财务报表。公开规模披露并不均衡。2023 年末来源支持员工超过 700 人，并在美国、以色列和伦敦设有办公室；2026
              年精确员工数、客户数以及任何债务或信贷工具，在留存来源包中仍没有支撑。
