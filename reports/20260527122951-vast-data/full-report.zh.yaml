            body: >-
              同一组证明采用的公开证据，也把风险磨得更尖。CoreWeave 同时是 VAST 最好的公开扩张案例，也是最清楚的集中度警示：一份披露的伙伴关联协议就值 $1.17 billion，第三方报道还称 VAST
              支撑了 CoreWeave 交付给 Meta、OpenAI 和 Microsoft 的工作负载。VAST 公开材料也把采用放在 NVIDIA、Supermicro、HPE、Lambda 和 Core42
              等伙伴框架下，说明伙伴主导的分销对获客和部署在结构上重要。公开来源没给出的东西同样关键：没有留存披露显示当前总客户数、渠道组合、销售周期长度、伙伴抽成率、队列留存或头部客户收入占比。用户指定的
              BMW、Nasdaq、Goldman Sachs 和 Dell 也有揭示性。留存的 NVIDIA 关于 BMW 和 Nasdaq 的页面证明了相邻 AI 基础设施可信度，但没有提到 VAST。Sacra 只能证明
              Goldman Sachs 和 Dell Technologies Capital
              是投资人，而非付费客户。因此，本章可以支撑真实采用、真实扩张和真实伙伴杠杆，但无法为每个头部客户标识补上直接证据，也无法给出承销级客户耐久性所需的集中度数学。
