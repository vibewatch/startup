            body: >-
              VAST 的公开 GTM 证据指向高接触企业销售，平均落地规模异常大，扩张动态强。2021 年公司称初始投入平均约 $1 million，扩张平均 328%；FY22 又称 NRR 超过
              300%。更近期第三方报道显示，前 100 个新客户平均支出超过 $1.2 million，合约期限常为 5 到 7 年。这些都是企业收入耐久性的强代理指标，尤其是叠加 Cisco GPL
              入口，以及云伙伴把公司带进 AI 基础设施预算。公司似乎也受益于巨型灯塔账户：仅 CoreWeave 就签下 $1.17 billion 协议，多家媒体还提到 xAI 和其他 AI 云客户。公开记录没有披露
              CAC、CAC 回本周期、平均销售周期或伙伴抽成。因此，本章可以认为 VAST 很可能具备高效的先落地再扩张动态，但不能把这些需求信号换算成闭环销售效率模型。
