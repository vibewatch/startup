      - number: '7.2'
        title: 法律、监管、隐私与主权风险
        blocks:
          - type: paragraph
            body: >-
              最清楚的实时法律阴影来自 Red Stapler 链条。NetApp 起诉前 CTO Jonsi Stefansson，指称其滥用商业秘密，事项与 VAST
              收购的初创公司有关；佛罗里达起诉虽被驳回且不影响再诉，但驳回依据是审判地问题，NetApp 已上诉。这意味着 VAST
              尚未面对已证实的责任事件，但事件也没有彻底熄火。另一个层面是，公开法律面显示，公司通过网站和云栈处理联系人、设备和候选人数据，同时借 Cisco 的医疗和金融服务参考设计更深进入监管行业。因此，2025
              年大宗数据制度和更广泛的美国隐私执法，对 VAST 的相关性高于一家简单存储供应商。以色列又加一层。VAST 公开绑定一个以色列主权 AI
              云，并运营以特拉维夫为中心的大型研发足迹；以色列法律评论则强调出口管制、两用技术和 IIA 补助限制，这些都可能影响融资、IP 转让和退出。公开证据足以把这些列为真实法律和监管风险，但文档审查前还无法关闭。
