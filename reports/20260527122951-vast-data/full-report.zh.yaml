      - - DDN
        - 直接 AI 性能同业
        - 私营公司披露的规模主张包括 10 家领先汽车公司中的 8 家、10 家头部银行 / 证券公司中的 7 家
        - AI 工厂、主权 AI、超大规模云、受监管和 HPC 比重高的客户
        - 数据智能平台，以 Infinia 和其他 AI 导向产品覆盖推理、主权 AI 和横向扩展工作负载
        - 最强势的一些主张来自公司自述，保留证据中没有更新公开定价或资本结构
      - - IBM Storage
        - 上市既有厂商 / 软件定义替代方案
        - 全球上市既有厂商；Storage Scale System 6000 获 NVIDIA 认证，强调高吞吐
        - 希望用既有 IBM 关系采购软件定义 AI/HPC 数据服务的受监管企业
        - Storage Scale 加 Scale System，销售文件 / 对象统一、内容感知智能和 GPU 就绪性能
        - IBM 更广的产品组合可能拖慢清晰的纯 AI 叙事，定价仍以报价为主
      - - Hammerspace
        - 相邻编排挑战者
        - $100M 融资，估值 $500M+；TechCrunch 称 Meta 和 DoD 是客户
        - 希望获得数据本地性、编排和混合云迁移能力的 GPU 密集环境
        - Tier 0 本地 NVMe 架构，加全局命名空间和策略驱动放置
        - 分销规模小于既有厂商，其最激进的 VAST 批评来自竞争对手
      - - Qumulo
        - 相邻混合云挑战者
        - 私营公司；保留页面强调 NPS、EB 级云规模和托管 Azure 路径，而非更新融资信息
        - 文件密集型企业和云工作负载，需要全局命名空间和托管云选项
        - 现代文件 / 对象平台，提供 Cloud Data Fabric、Azure Native 托管服务和混合云部署路径
        - 规模、融资和已实现定价的可见度低于上市既有厂商
      - - 云厂商原生替代方案
        - 替代方案 / 现状延伸
        - 既有云合同和公开用量计费结构
        - 已锚定 AWS、Azure 或 Google Cloud 的团队
        - 托管文件系统和对象服务，具备透明用量计费和原生采购通道
        - 数据迁移、闲置容量成本和性能调优，仍可能让云端“廉价”存储在实际中变贵
      - - 自建 / 开源
        - 替代方案 / 反锁定路径
        - 没有供应商股权价值；经济性转向硬件、人力和运维
        - 愿意自己承担存储工程和集成的平台团队
        - Ceph 和 MinIO 展示了统一或 EB 级语义，不需要专有供应商锁定
        - 运维负担、调优复杂度和更慢的见效时间抬高执行风险
