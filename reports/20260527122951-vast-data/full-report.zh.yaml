            body: >-
              财务读数有利，但还不能完全支撑最终投资判断。正面看，VAST 同时具备软件式利润率信号、多年合约证据、非常大的平均承诺额、正自由现金流说法，以及 AI
              云客户带来的异常需求。和多数后期基础设施创业公司公开披露相比，这是更强的收入质量画像。谨慎点在于，几个最重要输入仍是私有信息：客户集中度、实际现金余额和现金跑道、CAC
              与回本周期、实际定价、债务义务，以及订单额、CARR 和任何更宽 ARR 或收入口径之间的桥接。大型 AI
              云账户也会引入集中度和续约时点风险，因为它们能如此剧烈地撬动业绩。因此，正确投资判断不是否定商业模式，而是把公开记录能支撑的内容，与仍需要公司披露的内容切开。VAST
              的财务强度足以值得严肃尽调，但证据集仍不足以完成可签署交易级别的财务模型。
