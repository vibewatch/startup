        title: 里程碑、合作伙伴与不利背景
        blocks:
          - type: paragraph
            body: >-
              里程碑记录解释了为什么后续章节不应只把 VAST 当作存储厂商。2016 年创立后，公司第一阶段先打下高性能存储基础，随后在其上叠加数据库和计算功能；到 2026
              年，发布重点已经转向控制平面和智能体计算能力，而不只是贴近硬件的软件。合作伙伴图谱同样是主线。VAST 的客户和渠道足迹穿过 AI 云、OEM 和战略技术伙伴，具名关系包括 CoreWeave、Google
