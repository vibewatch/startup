  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与投资含义
        blocks:
          - type: paragraph
            body: >-
              VAST 不是丑闻，也不是明显产品失败案例；风险主要是公开披露尚未跟上，而 AI 基础设施估值处在周期高位，承销需要承担不确定性。公司确实有真实证明点：它完成了 $30 billion Series
              F，称累计预订额超过 $4 billion、承诺 ARR 超过 $500 million，拿下 $1.17 billion CoreWeave 合作，并已通过经过验证的 NVIDIA、Cisco 和
              Supermicro 架构出货。但同一组事实也构成最主要的剩余风险栈。第一是估值重置风险，因为价格假设 AI 建设能持久延续，且私人指标会继续被市场接受。第二是 Nvidia、Cisco、OEM 硬件和少数头部
              AI 云客户之间的集中度风险。第三是执行宽度，VAST 正从存储拉伸到完整 AI 操作系统和云控制平面。第四是围绕 Red Stapler
              和新数据规则的法律及合规暴露。第五是以色列相关的连续性和人才暴露。投资含义：这笔交易仍可尽调，但前提是法律来源、集中度和合规证据从开放式风险变成有边界的风险。
