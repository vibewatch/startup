      - number: '2.3'
        title: 买方、用户、付款方与采纳路径
        blocks:
          - type: paragraph
            body: >-
              买方图谱取决于细分场景，但模式一致：技术倡导者来自基础设施、数据平台、HPC 或 AI 工程团队；预算批准和风险审查则上移到 CIO、采购、财务和更大的购买委员会。市场报告和厂商参考架构解释了原因。Fortune
              的终端用户切分把企业、CSP、电信和政府列为不同需求池。Coherent 对敏感行业本地部署的偏向，加上 VAST 自己的企业 AI 工厂框架，说明对需要控制、治理和数据本地性的买方来说，受监管企业、公共部门或
              HPC 用户仍然重要。在这些账户里，存储管理员、ML 平台团队或科研计算负责人可能指定架构，但他们很少单独购买。IDC 称采购、财务和营收运营职能已经成为核心决策者；Forrester 称典型复杂采购现在涉及
              13 个内部利益相关方和 9 个外部影响者。这种治理很重的采购流程也解释了采纳路径。试用和可引用案例重要，因为买方必须先证明业务价值，才会扩容。Forrester 称超过 60% 买方会试用，超过 $10
              million 的买方中 78% 会试用。Supermicro 和 VAST 卖的是从设计到部署的一站式路径；VAST
              的参考架构则强调从小规模起步，随需求扩展。因此，实际漏斗是问题发现、架构验证、价值证明、首个生产集群，再到更多工作负载或站点的横向铺开。公开仍缺的是 VAST 账户穿过这条漏斗的真实转化率。
            claimRefs:
              - CM016
