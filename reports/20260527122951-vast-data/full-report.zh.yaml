  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价与确认问题
        blocks:
          - type: paragraph
            body: >-
              VAST 的货币化最好描述为通过企业和伙伴渠道销售的基础设施软件，而不是纯自助式存储产品。公司营销的是统一 AI Operating System，组合存储、数据库和计算；较早公司材料明确称 Gemini
              是一种软件消费模型，把硬件和软件经济性拆开。公开商业页面强调联系销售和演示，而不是自助定价。因此，证据足以识别收入机制，但不足以直接观察实际价格表或折扣行为。Cisco 的 Global Price List
              提供了一条已验证的伙伴采购路径；Polaris 免费包含在内，则说明至少部分控制平面被捆进平台。CoreWeave 协议证明 VAST
              能拿下非常大的伙伴相关承诺，但公开记录仍没有打通订单额、承诺经常性收入，以及任何用量或系统交付组成部分如何进入同一套收入定义。
