  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 按客户工作流理解产品范围
        blocks:
          - type: paragraph
            body: >-
              VAST 把平台卖成 AI Operating System，而不是单一存储 SKU。按客户工作流看，留存记录显示买方想把数据路径多个阶段压到同一个共享底座上：通过文件、对象、流式或 Kubernetes
              接口摄取数据；通过 DataBase 编目和查询；在 DataEngine 中触发事件驱动处理；借助 DataSpace 让同一份数据跨站点可见，而不是复制到不同数据孤岛。AI
              参考架构明确说明，公司想用一个闪存原生平台覆盖数据捕获、整理、模型训练、模型服务、审计日志和 RAG 式检索。Kubernetes 材料把这一点落到运维操作层：同一集群既可以暴露为 NFS，也可以暴露为 CSI
              配置的持久卷。因此，工作流价值主张不只是速度，而是减少数据移动、避免分散的存储 / 数据库 / 流式栈，并给基础设施团队一个控制模型。
