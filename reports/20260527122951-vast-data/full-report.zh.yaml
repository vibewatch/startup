    rows:
      - - Universal Storage / DataStore
        - 存储架构师、AI 基础设施团队、平台运维
        - 成熟核心；在 2026 年 AI OS 重新叙事之前就已反复记录
        - 以 NFS、SMB 和 S3 暴露的共享文件和对象数据平面，底层元素相同
        - 一条写入路径可通过多种协议呈现，而不是形成割裂孤岛
        - 需要按工作负载给出当前公开基准测试和参考部署细节，而不只是架构主张。
      - - VAST DataBase
        - 数据工程师、分析团队、RAG 管道负责人
        - 已记录模块；在 2024-2026 年叙事中显著扩展
        - 绑定目录、下推、SQL 分析和数据溯源工作负载的 ACID 表格引擎
        - 把结构化查询接到存储非结构化数据的同一平台上
        - 需要针对最新 GPU 加速数据库路径的公开 GA 文档和客户引用。
      - - VAST DataEngine
        - 管道构建者、平台工程师、AI 应用团队
        - 可见，但公开文档深度仍不如存储核心
        - 面向函数、触发器、管道、主题和计算资源的事件驱动处理环境
        - 把平台从被动存储变成执行平面
        - 需要更多 DataEngine 工作负载的公开生产案例和运营 SLO。
      - - DataSpace / Polaris 控制层
        - 多站点运营方、云团队、治理负责人
        - DataSpace 有文档；Polaris 更新，更多来自公告
        - 面向分布式 VAST 环境的全局命名空间和混合控制编排
        - 让混合和多站点运营成为产品叙事的一部分，而不是外部覆盖层
        - Polaris 需要公开管理文档、客户引用和 GA 状态清晰度。
      - - AI OS 加速器（CNode-X、PolicyEngine、TuningEngine）
        - 企业 AI 平台团队、智能体 AI 构建者
        - 2026 年发布阶段的能力面；文档深度尚不如平台核心
        - GPU 加速计算路径、内联策略执行和闭环模型调优
        - 把 VAST 从存储推向全栈 AI 工作流控制与加速
        - 需要证明客户生产使用、实际可用性和支持边界。
      - - 开发者 / 运维工具
        - SRE、自动化团队、Kubernetes 运维方
        - 活跃且公开
        - CSI 驱动、Helm chart、Python SDK、Go 客户端、Terraform provider 和 DataEngine CLI
        - 降低集成摩擦，并给产品一个可见的实践者界面
        - 除仓库存在和活跃度外，还需要使用遥测或下载 / 安装证据。
