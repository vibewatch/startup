          detail: 企业通过 NFS、SMB、S3、Kubernetes，或更新的流式和块接口落地数据。
        - id: unify
          label: 在共享数据平面统一
          detail: DataStore 和目录让文件、对象及近表语义保持可见，避免副本蔓延。
        - id: query
