  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议取决于价格，不是公司质量判决
        blocks:
          - type: paragraph
            body: >-
              VAST Data 更像真实品类领导者，而不是纯炒作资产。作为一家私营存储与数据平台，公司把 AI 基础设施相关性、头部客户、快速增长和正面利润率信号组合得异常强。问题不在业务是否重要；问题在于，新资金以 $30
              billion 估值入场，是否还能仅凭公开证据赚到有吸引力的回报。在官方披露的超过 $500 million 承诺 ARR 下限上，本轮价格隐含约 60x。即使用较早 Reuters 式的 $600
              million ARR 预测，也仍约 50x。只有最激进的外部估计——约 $2 billion ARR——才把入场价格拉低到约
              15x，但相对上市存储可比公司仍偏贵。因此，建议对价格和证据都敏感：新资金应观察或继续研究；只有成本基础显著更低时才持有；不要把强公司和合理入场价混为一谈。
