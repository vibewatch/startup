  - id: TV005
    title: 投资逻辑失效与终止触发条件表
    columns:
      - 触发条件
      - 阈值
      - 为什么会打破投资逻辑
      - 行动含义
    rows:
      - - 收入桥接失效
        - 经审计 ARR 或经常性收入明显低于 ~$1.5B
        - 当前轮价格成立的前提是规模远高于官方 $500M CARR 下限
        - 停止交易，或重新定价。
      - - 客户集中度过高
        - 前一两大客户主导经常性收入或即将续约的收入
        - 如果需求面窄且不稳定，晚期溢价倍数应被压缩
        - 提高下行情景权重，或退出。
      - - AI 倍数压缩
        - 上市 AI 基础设施可比公司估值向传统存储区间下修
        - VAST 已按溢价倍数定价
        - 价格重置前避免新进入。
      - - IPO 准备停滞
        - 虽然定价已接近上市公司高溢价水平，但没有投行、内控或报告路线图
        - 持有期拉长，估值支撑同步走弱
        - 按更长久期私有资产处理，或拒绝。
      - - 优先股悬顶超预期
        - Series F 清算瀑布或反稀释条款大幅压低普通股价值
        - 名义估值不再对应投资人经济收益
        - 从股权结构表重建回报模型，而不是从名义估值出发。
    notes: 终止触发条件故意设得具体、以交易为导向。它们关注的是会推翻当前定价的情形， 而不是只会拖慢增长的情形。
    claimRefs:
      - CV036
      - CV038
      - CV046
      - CV048
      - CV049
  - id: TV006
    title: 最终尽调索取清单表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 收入桥接
        - 按年度和头部客户拆分的预订额 → CARR → ARR → 确认收入勾稽
        - 这是公允价值里最大的摆动因素
        - 财务尽调 / CFO 材料包。
      - - 新股与老股占比
        - 已签署融资摘要，列明准确新增现金和卖方流动性
        - 决定稀释幅度，也决定现金跑道实际改善多少
        - 法务 + 投资者关系尽调。
      - - 股权结构表 / 优先权
        - Series F 条款清单、清算瀑布和完全稀释后持股
        - 名义估值可能高估普通股价值
        - 法务尽调 / 董事会材料。
      - - 客户集中度
        - 前 20 大 ARR、续约日期、利润率画像和超大规模云厂商敞口
        - 集中度可能迅速压垮乐观情景
        - 商业尽调 / 收入运营导出。
      - - IPO 准备度
        - 内控、审计状态、董事会构成和投行准备里程碑
        - IPO 是最站得住的退出路径，但尚未正式启动
        - CEO/CFO 尽调 + 治理审查。
    notes: 这些问题最能快速改变建议。没有这些证据，公开记录足以让人认可公司， 但不足以支撑以 $30 billion 估值新进场。
