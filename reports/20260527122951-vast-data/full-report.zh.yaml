        - id: stage-evaluation
          label: 技术评估 / 共同设计
          actor: 基础设施和工程团队
          description: 买方评估 VAST 是否适合多协议访问、GPU 就绪吞吐、租户隔离或实时媒体运营。NHL 和 SKT 都描述了这一阶段的紧密工程协作。
          channels:
            - POC
            - 架构工作坊
            - 合作伙伴验证
