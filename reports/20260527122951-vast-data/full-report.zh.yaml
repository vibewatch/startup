      - number: '1.2'
        title: 创始人、领导层与治理信号
        blocks:
          - type: paragraph
            body: >-
              Renen Hallak 是留存记录中最清晰的领导连续性锚点。无论官方融资稿、产品定位还是媒体采访，他都以创始人兼 CEO 身份出现，因此也是后续尽调最重要、可复用的身份锚点。Jeff Denworth
              也被直接证实为联合创始人，并且仍是公司和第三方材料中可见的产品发言人，尤其围绕从统一数据平台走向完整 AI 操作系统的演进。财务负责人现在也变得关键：Amy Shapero 是 VAST 首任 CFO，此前担任
              Shopify CFO；CRN 和 Reuters 报道都把她与 IPO 准备度联系起来。这个组合说明公司治理栈在向公开市场纪律成熟，尽管公司尚未启动正式 IPO 流程。云业务领导层的信号更复杂。Jonsi
              Stefansson 通过 Red Stapler 人才收购加入，并在 Polaris 发布时被 VAST 公开引用，但同一高管仍牵连 NetApp 诉讼风险。公开治理披露比融资披露更薄：留存来源确认
              Fidelity 有董事会观察员角色，但没有给出清晰、最新的完整董事会名单；这是需要延续的尽调缺口，不是编造治理细节的理由。
