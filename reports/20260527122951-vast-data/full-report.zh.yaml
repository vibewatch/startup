        - 公开收入未披露
        - 仅作里程碑参考
        - 垂直整合 AI 基础设施的大额融资
        - 估值没有配套公开的经常性收入细节。
      - - Together AI
        - 私募轮次
        - $305M Series B 轮，估值 $3.3B
        - 公开收入未披露
        - 仅作里程碑参考
        - 另一个云 / AI 平台估值标尺
        - 模型组合和财务画像与存储基础设施不可比。
    notes: >-
      上市公司行使用 runDate 市场数据；CoreWeave 收入以 2026 年 Q1 年化，仅用于方向性比较； 私募行只是里程碑参考，因为当前收入未公开披露。这里列的是最相关、可观测可比对象的一部分， 并非穷尽晚期 AI
      基础设施公司。
    enumerationScope:
