        - 未留存关于 CSI 采用的大规模部署公开指标。
      - - 在同一数据平面上跑实时分析和向量检索
        - 查询引擎和向量系统往往位于存储旁边，而非嵌在存储内部
        - DataBase 加 GPU 加速 SQL，以及 CNode-X 上基于 cuVS 的向量检索
        - 2026 年材料声称查询时间 / 成本更低，检索加速
        - 最强数字来自公司发布的基准测试主张，不是独立测试。
      - - 在不新增独立 SAN 或 Kafka 资产的情况下加入块和流式能力
        - 企业把块工作负载或事件流留在分离孤岛上
        - 在共同平台上提供 NVMe/TCP 块能力和 Event Broker / Kafka 兼容摄取
