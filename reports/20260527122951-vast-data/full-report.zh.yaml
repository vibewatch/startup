          modules:
            - NFS / SMB / S3
            - SQL / 表访问
            - CSI / Kubernetes
            - REST API / Swagger
            - NVMe/TCP 块
        - label: 共享数据服务平面
          detail: 一个底层平台对外提供 DataStore、目录、快照、克隆、复制、QoS 以及流式 / 事件服务。
          modules:
            - DataStore / Universal Storage
            - 目录元数据
            - 快照 / 克隆 / 复制 / QoS
            - Event Broker / Kafka 兼容摄取
            - 通过合作伙伴支持 WORM 的目标模式
        - label: 数据库与计算平面
          detail: 结构化查询和事件驱动执行建立在同一数据底座上，而不是另起一套栈。
          modules:
            - VAST DataBase
            - DataEngine
            - 函数 / 触发器 / 管道 / 主题
            - 向量检索 / RAG 服务
        - label: 全局控制与命名空间平面
          detail: DataSpace 和 Polaris 将产品从集群服务延展到分布式编排和策略管理。
