            - Polaris 控制平面
            - VMS GUI / CLI
            - PolicyEngine / TuningEngine
        - label: DASE 基础设施平面
          detail: CNodes/CBoxes/CNode-X 和 DNodes/DBoxes 仍是基础；OEM 和 NVIDIA 变体更多改变封装，而非核心抽象。
          modules:
