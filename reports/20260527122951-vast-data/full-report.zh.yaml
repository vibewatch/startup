              公开记录中的财务模型风险不是现金即将吃紧，而是估值脆弱性和集中度脆弱性。VAST
              的融资能力显然很强，但本轮结构混合新股和老股，所以头条规模夸大了新增经营现金。与此同时，最强的规模指标仍是公司口径，未公开勾稽。这一点重要，因为宏观背景已不再一边倒支持。Gartner 仍预测 2026 年 AI
              基础设施支出巨大，但也称该行业处在幻灭低谷，且既有厂商会捕获大量企业 AI 需求。Goldman 把建设争论定义为对假设敏感，而非板上钉钉。两件事可以同时成立：支出可以增长，而市场对高溢价私营估值的容忍度下降。对
              VAST 来说，下行情景不只是收入增长放慢；它还包括增长放慢叠加 Dell 等既有厂商更强竞争，以及 VAST 填上披露缺口前公开市场倍数先重置。
