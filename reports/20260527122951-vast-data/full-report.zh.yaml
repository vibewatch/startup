  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 公开定位中，VAST 如何把数据从摄取一路承载到查询、事件处理和受治理的 AI 使用。
    data:
      nodes:
        - id: ingest
