companyProfile:
  summary: >-
    VAST Data 是一家 2016 年创立的私营 AI 基础设施公司，已经从高性能全闪存储平台扩展为它现在所称的 AI Operating System。该平台在 DASE 架构下组合
    DataStore、DataBase、DataEngine 和 DataSpace，为企业、新云厂商和主权 AI 工作负载统一存储、数据库与计算。公开证据支撑了有意义的规模：VAST 披露累计订单额超过 $4
    billion，上一财年退出时承诺 ARR 超过 $500 million，并且在 2026 年 Series F 前已经实现经营利润率和自由现金流为正。公司目前私募估值为 $30 billion，客户、OEM 和 NVIDIA
    相关部署都给出强生态验证，但它对客户集中度、精确收入定义和完全稀释经济条款的公开披露仍然有限。
