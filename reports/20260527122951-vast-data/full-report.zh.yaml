              加固设备，记录了联邦采购导向，并说明产品列入 DoDIN Approved Products List。该指南还列出具体控制面：基于 HTTPS 的 VMS 管理、CLI 访问、包含 CSI
              专用权限的预定义角色、与 Active Directory、LDAP 和 NIS 的身份集成，以及配置 SSO 和 MFA 前所需的可信 TLS 前提。AI
              参考架构又补充了更宽的设计主张：零信任、RBAC、ABAC、加密、审计、网络隔离和租户特定密钥管理。Commvault 的集成指南通过记录 VAST 支撑的云库工作流上的 WORM
