  headline: VAST Data 确实像 AI 基础设施里的赢家：规模真实、生态验证强，数据平台技术也有差异化；但当前 $30 billion 估值仍需先做收入质量、客户集中度和股权结构条款的私下尽调，新资金才有把握承销。
