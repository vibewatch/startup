chapter:
  number: 6
  title: Customers
  summary: VAST has unusually rich public customer proof for a private infrastructure company, with named deployments spanning AI clouds, telecom sovereign AI, media, healthcare, research, and financial services. The strongest production-grade evidence comes from CoreWeave, the NHL, SK Telecom, Invitae, and PacBio, while durability proof remains indirect through historical expansion, long-lived deployments, and review sentiment rather than current GRR/NRR/churn disclosure. The same evidence that proves expansion also exposes concentration and partner-dependence risk, especially around CoreWeave and ecosystem-led routes to market.
sections:
- id: customer-segmentation-and-buyer-map
  title: Customer segmentation and buyer / user / payer map
  body: The public record supports a broad but not fully enumerated VAST customer base. Official customer-proof pages and roster disclosures show VAST reaching AI-cloud operators, telecom sovereign-AI builders, financial-services institutions, healthcare and life-sciences teams, government research bodies, and media organizations. The visible buyer-user-payer pattern is segment specific rather than uniform. In media, the NHL frames the purchase around production and archive workflows run by media-operations teams for downstream editors, producers, broadcasters, and eventually AI-assisted content discovery. In sovereign AI and AI-cloud contexts, the technical operator is a platform or infrastructure team, but the platform is procured so enterprise, research, and public-sector tenants can consume GPU and data services. In healthcare, genomics, and quant trading, the end users are researchers, scientists, and quants, while central infrastructure budgets fund the platform. That means VAST is
    not selling to a single universal persona; it is selling a deep infrastructure layer whose commercial sponsor is usually central IT or platform engineering, while the economic justification comes from higher-level data teams and business workflows.
