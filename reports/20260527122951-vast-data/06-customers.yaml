  evidenceGaps:
  - type: missing-source
    severity: material
    topic: customer-count
    missingEvidence: Current total paying-customer count, segment mix by customer type, and any 2026 denominator behind the named-logo roster.
    whyItMatters: Without a denominator, investors cannot judge how representative the public logo set is or whether growth is broad-based versus concentrated.
    diligencePath: Request a current customer-base bridge showing count, ARR/bookings share, and segment split across enterprise, public sector, AI cloud, and partner-routed accounts.
    relatedQuestionRefs:
    - QU013
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Current GRR, NRR, churn, renewal, and cohort-retention data by major segment or top-account cohort.
    whyItMatters: Historical expansion and named repeat usage are encouraging, but they do not replace current cohort-level durability metrics needed for underwriting recurring revenue quality.
    diligencePath: Request cohort retention tables, current NRR/GRR bridge, renewal calendar, and churn analysis for top accounts and partner-routed customers.
    relatedQuestionRefs:
    - QU014
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: minor
    topic: nasdaq-bmw-proof
    missingEvidence: Direct VAST-linked customer proof for Nasdaq and BMW, including production status, deployment scope, and customer-side testimony if those logos are truly referenceable.
    whyItMatters: Adjacent ecosystem references can inflate perceived customer proof if they are mistaken for direct VAST deployments.
    diligencePath: Request a curated reference pack clarifying which marquee names are direct paying customers, indirect ecosystem beneficiaries, investors, or merely adjacent partner references.
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU003
    - TU005
  - type: private-evidence-only
    severity: material
    topic: channel-mix-and-concentration
    missingEvidence: Top-customer revenue or bookings concentration, partner-sourced mix, sales-cycle data, partner take-rates, and public discounting or procurement friction metrics.
    whyItMatters: Public expansion proof is strong, but investors still cannot quantify whether VAST owns the customer relationship directly or is economically dependent on a small set of AI-cloud and ecosystem channels.
    diligencePath: Request top-10 customer concentration by ARR/bookings, partner-sourced pipeline and bookings share, average contract term, procurement blockers, and partner economics.
    relatedQuestionRefs:
    - QU023
    - QU025
    relatedTableRefs:
    - TU005
