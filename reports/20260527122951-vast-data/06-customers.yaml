callouts:
- calloutType: strength
  title: The best VAST customer proof is operational, not just logo-based
  body: NHL, SK Telecom, CoreWeave, Invitae, and PacBio all provide stronger-than-logo evidence because the retained sources describe deployment scope, measured outcomes, or explicit production maturity. That is more persuasive than a generic customer wall for a private infrastructure company.
  claimRefs:
  - CU006
  - CU009
  - CU012
  - CU015
  - CU025
  - CU026
  - CU042
- calloutType: risk
  title: CoreWeave is both the strongest proof point and the clearest concentration warning
  body: A single disclosed $1.17 billion agreement is extraordinary adoption proof, but it also means the public record overweights one partner-linked AI-cloud relationship. Underwriting customer durability without top-customer concentration data would be aggressive.
  claimRefs:
  - CU015
  - CU016
  - CU018
  - CU019
  - CU044
- calloutType: risk
  title: Public durability evidence is encouraging but incomplete
  body: VAST can point to historical expansion, long-lived deployments, and positive review sentiment, yet the retained public set still lacks current GRR, NRR, churn, renewal, top-customer share, and channel-mix disclosure. Those are closing-grade diligence asks, not cosmetic gaps.
