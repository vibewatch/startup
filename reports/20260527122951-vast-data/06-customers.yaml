- id: production-adoption-and-named-proof
  title: Production adoption trajectory and named customer proof
  body: 'The strongest proof is where VAST or the customer describes a live deployment with scope, chronology, or measurable outcomes. The NHL relationship is the clearest long-duration example: VAST says the league first adopted the platform about six years ago, moved more than 20 PB of archive content onto it, extended the footprint to all 32 arenas plus headquarters, and in 2026 successfully piloted a portable node for outdoor events that securely replicated more than 2 TB of footage. SK Telecom provides the clearest sovereign-AI and telco example, with VAST integrated into Petasus AI Cloud so GPU environments can be provisioned in about 5–10 minutes and scaled across a 1,000-Blackwell-GPU stack. CoreWeave is the highest-stakes AI-cloud example: VAST announced a $1.17 billion commercial agreement in late 2025, and both official and third-party sources describe VAST as a key data foundation inside CoreWeave’s cloud. Beyond those flagship cases, the retained set includes quantified healthcare
    outcomes from Invitae and PacBio and title-level case pages across HSBC, CACEIS, Jump Trading, HHS, LLNL, and Chan Zuckerberg Initiative, which together show real vertical spread even when not every page has the same evidentiary depth.'
