- id: durability-expansion-and-satisfaction-signals
  title: Retention, repeat usage, and satisfaction signals
  body: 'Durability is supportable, but only indirectly. VAST’s own 2021 Series D release remains the cleanest historical expansion datapoint: average initial customer investment of about $1 million, average net-revenue expansion of 328%, and several customers already above $10 million of spend. More recent public proof shows continued repeat usage and expansion in named accounts rather than disclosed portfolio-wide retention metrics. The NHL relationship expanded from archive modernization into real-time arena-to-headquarters workflows and then into a 2026 outdoor-event pilot. CoreWeave evolved from an existing partnership into a disclosed $1.17 billion agreement. PacBio explicitly says it added another 2 PB to its VAST cluster with no issues, and Invitae cites 6x faster data access plus 30x IOPS improvement. Independent satisfaction evidence is directionally positive but thin: FeaturedCustomers aggregates a large body of testimonials and reference ratings, while PeerSpot reports 5.0/5
    and 100% willingness to recommend from a small sample. The caution is that no retained source discloses current GRR, NRR, churn, cohort renewal, or top-customer share, so the public durability case is positive but incomplete.'
  claimRefs:
