figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Typical VAST customer path from problem recognition through technical codesign, production rollout, and later expansion into adjacent workflows.
  data:
    items:
    - id: stage-awareness
      label: Problem recognition
      actor: Platform leader, research IT owner, or media-operations sponsor
      description: The prospect hits a data bottleneck such as media transfer latency, sovereign GPU provisioning delays, AI-cloud data throughput limits, or genomics/HPC storage sprawl.
      channels:
      - Direct enterprise sales
      - Partner ecosystem
      - Customer references
    - id: stage-evaluation
      label: Technical evaluation / codesign
      actor: Infrastructure and engineering teams
      description: The buyer evaluates VAST for multiprotocol access, GPU-ready throughput, tenant isolation, or real-time media operations. NHL and SKT both describe close engineering collaboration at this stage.
      channels:
      - POC
      - Architecture workshop
      - Partner validation
    - id: stage-production
      label: Production deployment
      actor: Operations teams and end-user stakeholders
      description: The platform goes live in a production setting such as the NHL archive and arenas, SKT sovereign AI cloud, CoreWeave AI cloud, or genomics workflows at Invitae and PacBio.
      channels:
      - Customer success
      - Partner deployment
      - Internal platform ops
    - id: stage-multisite
      label: Multisite or multitenant rollout
      actor: Central platform team
      description: Adoption expands across venues, tenants, data centers, or additional clusters once the initial production workload proves reliable and performant.
      channels:
      - Replication
      - Tenant onboarding
      - Cluster expansion
    - id: stage-expansion
      label: Workflow expansion
      actor: Business owners, researchers, and platform admins
      description: Customers use the same platform for adjacent workflows such as AI tagging, inference, broader tenant services, or higher-throughput genomics and research use cases.
      channels:
      - AI/ML extension
      - Additional capacity
      - New use-case modules
  claimRefs:
  - CU004
  - CU006
  - CU011
  - CU015
  - CU043
