  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: governance-transparency
    missingEvidence: A current, source-backed full board roster plus committee or observer structure.
    whyItMatters: Later diligence on control, governance quality, and investor influence is weak without
      a current board map.
    diligencePath: Request a board list from management or obtain a recent financing deck, cap table summary,
      or legal close memo that names directors and observers.
    relatedQuestionRefs:
    - QO009
    - QO025
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: material
    topic: debt-and-leverage
    missingEvidence: Any supportable disclosure of debt, credit facilities, or other leverage tied specifically
      to VAST Data.
    whyItMatters: A company at this valuation can look less durable if liquidity includes hidden leverage
      or vendor financing not visible in public equity-round reporting.
    diligencePath: Ask management for debt schedules, bank lines, or covenants and cross-check with lender
      announcements or legal filings.
    relatedQuestionRefs:
    - QO015
    - QO025
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: material
    topic: customer-and-headcount-precision
    missingEvidence: A current 2026 employee count, a current office footprint, and an exact paying-customer
      count or cohort breakdown.
    whyItMatters: Scale quality is hard to compare against peers when public disclosures stop at logo
      examples and an older >700 headcount datapoint.
    diligencePath: Request an operating dashboard or HR snapshot and corroborate customer counts by cohort,
      cloud partner, and direct enterprise segment.
    relatedQuestionRefs:
    - QO018
    - QO019
    - QO025
    relatedTableRefs:
    - TO001
    - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map-completeness
    missingEvidence: A full cap-table view showing how much of recent financing was primary capital versus
      liquidity and which investors hold formal control rights.
    whyItMatters: Valuation headline alone does not reveal governance power, preference stack, or the
      true dilution and liquidity profile for existing holders.
    diligencePath: Request the most recent financing term sheet, investor rights agreement summary, and
      cap-table bridge from Series E to Series F.
    relatedQuestionRefs:
    - QO013
    - QO014
    - QO025
    relatedTableRefs:
    - TO003
