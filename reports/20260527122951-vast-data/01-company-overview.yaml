- id: founders-leadership-and-governance
  title: Founders, Leadership, and Governance Signals
  body: 'Renen Hallak is the clearest single point of leadership continuity across the retained record.
    He appears as founder and CEO across official financing releases, product positioning, and press interviews,
    making him the most important reusable identity anchor for later diligence. Jeff Denworth is also
    directly corroborated as a co-founder and remains a visible product spokesperson in both company and
    third-party materials, especially around the evolution from unified data platform to full AI operating
    system. Finance leadership is also now material: Amy Shapero, VAST’s first CFO and formerly Shopify’s
    CFO, is explicitly tied to IPO readiness in both CRN and Reuters-reported coverage. That combination
    suggests a governance stack that is maturing toward public-market discipline even though the company
    has not started a formal IPO process. Cloud leadership adds a more complicated signal. Jonsi Stefansson
    joined via the Red Stapler acqui-hire and was publicly cited by VAST during the Polaris launch, but
    the same executive remains tied to NetApp litigation risk. Public governance disclosure remains thinner
    than funding disclosure: the retained sources confirm a Fidelity board observer role, but they do
    not provide a clean, current full board list, which is a carry-forward diligence gap rather than a
    reason to invent governance detail.'
  claimRefs:
  - CO009
  - CO010
  - CO011
  - CO012
