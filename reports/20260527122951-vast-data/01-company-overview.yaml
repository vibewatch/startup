- id: milestones-partners-and-adverse-context
  title: Milestones, Partnerships, and Adverse Context
  body: The milestone record shows why later chapters should treat VAST as more than a storage vendor.
    After founding in 2016, the company spent its first phase establishing a high-performance storage
    base, then layered database and compute functions on top, and by 2026 was launching control-plane
    and agentic-computing features rather than only hardware-adjacent software. The partner map is also
    central to the story. VAST’s customer and channel footprint runs through AI clouds, OEMs, and strategic
    technology partners, with named relationships across CoreWeave, Google Cloud, Lambda, Core42, Supermicro,
    HPE, Cisco, and NVIDIA-linked deployments. That ecosystem expands reach, but it also creates dependence
    on partner routes and hyperscale AI-capex cycles. The main adverse item worth preserving is the Red
    Stapler/NetApp dispute. VAST was not named as a defendant, and NetApp’s Florida case was dismissed
    on venue grounds, but the episode still introduced reputational and integration risk precisely while
    VAST was raising another mega-round. For ground-truth purposes, the legal issue is not thesis-breaking
    on current evidence; it is a real diligence memory item that should stay live until related Icelandic
    or appeal processes are clearly resolved.
