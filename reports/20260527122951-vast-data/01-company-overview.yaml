callouts:
- calloutType: strength
  title: Series F combined valuation expansion with company-claimed profitability
  body: The April 2026 financing is more credible than a headline valuation alone because management paired
    it with more than $4 billion in cumulative bookings, more than $500 million of prior-year committed
    ARR, and positive operating margin and free cash flow. Those are still unaudited private-company disclosures,
    but they move VAST out of the category of purely speculative AI infrastructure stories.
  claimRefs:
  - CO027
  - CO028
  - CO029
  - CO032
  - CO033
- calloutType: risk
  title: Red Stapler litigation is a live integration overhang
  body: VAST itself is not the defendant, but the Stefansson/Red Stapler episode still matters because
    the acquired team was meant to strengthen cloud strategy while the dispute introduced diligence questions
    about IP provenance, acquisition process, and distraction during fundraising.
  claimRefs:
  - CO012
  - CO045
  - CO046
  - CO047
- calloutType: insight
  title: The company is selling an ecosystem position, not just storage software
  body: Retained sources repeatedly show VAST embedded in OEM, hyperscaler, neocloud, and reseller routes.
    That channel architecture is a strength for scale and reach, but it also means later commercial analysis
    should examine partner concentration and dependency rather than assuming purely direct enterprise
    demand.
  claimRefs:
  - CO015
  - CO039
  - CO040
  - CO041
- calloutType: risk
  title: Current disclosure quality still lags valuation scale
  body: Public sources provide good support for financing rounds, broad customer logos, and company-claimed
    ARR, but they do not cleanly disclose the full board, exact 2026 headcount, exact paying-customer
    count, or any debt profile. Those gaps matter because later chapters otherwise risk over-anchoring
    on headline valuation without enough operating granularity.
  claimRefs:
  - CO013
  - CO049
  - CO050
