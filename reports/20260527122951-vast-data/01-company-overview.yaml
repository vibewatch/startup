company:
  name: VAST Data
chapter:
  number: 1
  title: Company Overview
  summary: VAST Data is a private, 2016-founded AI infrastructure company that now frames itself as an
    AI Operating System rather than a standalone storage vendor. Public financing records show a step-up
    from an $83 million Series D at a $3.7 billion valuation in 2021 to a $118 million Series E at $9.1
    billion in 2023 and a roughly $1 billion Series F transaction at a $30 billion valuation in April
    2026. The company discloses strong but unaudited private-company operating signals — more than $4
    billion in cumulative bookings, more than $500 million in prior-year committed ARR, and positive profitability
    — while still leaving material gaps around exact 2026 headcount, customer count, debt, and full board
    composition.
sections:
- id: identity-stage-and-product
  title: Identity, Stage, and Product Scope
  body: 'VAST Data is a private AI infrastructure company founded in 2016 that now presents itself as
    the “AI Operating System” for data-intensive applications rather than as a point-storage vendor. The
    core company story in retained sources is consistent on direction: VAST says it unifies storage, database,
    and compute in a single data platform, while independent coverage describes the same transition as
    a three-phase move from flash-oriented storage into database services and then into broader AI operating-system
    orchestration. Product materials describe VAST DataStore as a universal data store that removes traditional
    storage tiers and scales from terabytes to exabytes, while partner materials from Supermicro frame
    the platform as the data-management layer for enterprise AI and GPU cloud deployments. Headquarters
    is less cleanly disclosed than product scope. Official 2023–2026 press materials alternately use “No-Headquarters”
    or “Remote-First Company” while anchoring announcements to New York City, and Reuters-described coverage
    calls the company New York-headquartered. For later chapters, the safest ground truth is that VAST
    operates as a remote-first, New York-anchored private company with a US-facing commercial surface
    and Israeli operational roots reflected in later location reporting.'
  claimRefs:
