            body: >-
              VAST's public GTM evidence points to a high-touch enterprise motion with unusually large average land
              sizes and strong expansion dynamics. In 2021 the company said initial investments averaged about $1
              million and expansion averaged 328 percent; in FY22 it said NRR exceeded 300 percent. More recent
              third-party reporting suggests top-100 new customers spend more than $1.2 million on average and that
              contract duration often runs five to seven years. Those are strong proxies for durable enterprise revenue,
              especially when paired with Cisco GPL access and cloud-partner distribution into AI infrastructure
              budgets. The company also appears to benefit from giant lighthouse accounts: CoreWeave alone signed a
              $1.17 billion agreement and multiple outlets reference xAI and other AI-cloud customers. What the public
              record does not disclose is CAC, CAC payback, the average sales cycle, or partner take-rates. So the
              chapter can argue that VAST likely has very efficient land-and-expand dynamics, but it cannot convert
              those demand signals into a closed sales-efficiency model.
