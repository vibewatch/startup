  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The recommendation follows from real product and demand proof flowing into an unresolved revenue bridge and then
      into an expensive price test.
    data:
      nodes:
        - id: proof
          label: AI OS and customer proof
          detail: VAST appears strategically important in AI data infrastructure.
        - id: financial
          label: '> $500M CARR + positive FCF'
          detail: Official evidence shows quality, not just hype.
        - id: bridge
          label: Revenue-definition gap
          detail: Public evidence spans $500M+ committed ARR to ~$2B third-party ARR.
        - id: comps
          label: Public comp band
          detail: Pure ~7.7x, NetApp ~4.1x, CoreWeave ~10.9x.
        - id: decision
          label: Track / research-more at $30B
          detail: Fresh money should wait for better proof or a better price.
      edges:
        - from: proof
          to: financial
          label: supports company-quality case
        - from: financial
          to: bridge
          label: still not a full valuation bridge
        - from: bridge
          to: comps
          label: price must clear public market anchors
        - from: comps
          to: decision
          label: current price only clears in bull case
    approximationNotes: >-
      This flow is analytical rather than mechanistic. It shows how the recommendation is derived from evidence quality
      and price support, not how VAST's product technically works.
    claimRefs:
      - CV007
      - CV014
      - CV024
      - CV027
      - CV030
      - CV044
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      The valuation debate is most sensitive to revenue-definition clarity and public-market multiple selection, with
      concentration and multiple compression acting as the main negative offsets.
    data:
      items:
        - label: Revenue bridge from $0.5B to $2.0B
          value: 15
          detail: Largest upside swing versus the official CARR floor.
        - label: Premium multiple vs. Pure / NetApp
          value: 8
          detail: AI-platform premium can add meaningful value if deserved.
        - label: Customer concentration / renewal haircut
          value: -6
          detail: A concentrated customer base would reduce fair value quickly.
        - label: AI multiple compression / exit-window risk
          value: -5
          detail: Bubble unwinds hurt late-stage private pricing fastest.
    approximationNotes: >-
      Values are directional dollar-billion deltas from a mid-teens base case, designed to show which assumptions matter
      most rather than to present a precise DCF.
    claimRefs:
      - CV019
      - CV021
      - CV024
      - CV027
      - CV030
      - CV038
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Scenario ranges show that public evidence supports a base case below the round and that fresh-money return hurdles
      are demanding from a $30 billion entry.
    data:
      items:
        - label: Bear case valuation (USD B)
          low: 6.4
          high: 8
          detail: Public-storage-style multiple on ~$0.8B durable recurring revenue.
        - label: Base case valuation (USD B)
          low: 13
          high: 21
          detail: Premium public comp band on ~$1.3-$1.5B normalized recurring revenue power.
        - label: Bull case valuation (USD B)
          low: 28
          high: 36
          detail: High-end ARR estimate plus sustained AI-infrastructure premium.
        - label: Fresh-money 2x/3x exit hurdle (USD B)
          low: 60
          high: 90
          detail: Required exit values before dilution for a new $30B entry.
    approximationNotes: >-
      Scenario ranges are estimated equity values. The return hurdle row is pure arithmetic from the round price and is
      shown to highlight why valuation discipline matters.
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV051
      - CV052
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      The IC-ready scorecard is strong on market and product proof, middling on evidence quality, and weak on valuation
      support at the current entry price.
    data:
      items:
        - label: Market demand
          value: 9
          detail: AI infrastructure demand is clearly real.
        - label: Product / moat
          value: 8
          detail: Unified AI OS positioning appears differentiated.
        - label: Customer proof
          value: 8
          detail: Public logos and partner references are unusually strong.
        - label: Economics proof
          value: 7
          detail: Positive margin and free-cash-flow claims help, but metric definitions are incomplete.
        - label: Disclosure quality
          value: 4
          detail: Revenue bridge, cap table, and concentration remain private.
        - label: Valuation support
          value: 3
          detail: Public evidence does not clear the $30B price with high confidence.
        - label: Overall investability
          value: 5
          detail: Good company, weak fresh-money setup at this price.
    approximationNotes: >-
      Scores are committee-style heuristics on a 0-10 scale intended to summarize evidence quality and price support,
      not to present a weighted algorithm.
    claimRefs:
      - CV035
      - CV036
      - CV044
      - CV045
      - CV047
      - CV049
