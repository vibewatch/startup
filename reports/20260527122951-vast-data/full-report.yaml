  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, Peer Classes, and Substitute Paths
        blocks:
          - type: paragraph
            body: >-
              VAST’s competitive field is wider than “other flash array companies.” Coldago’s 2025 file-storage maps and
              StorageNewsletter’s methodology summary place VAST in overlapping enterprise and high-performance storage
              frames with Pure, NetApp, IBM, DDN, Qumulo, Hammerspace, and WEKA. The direct peer set is therefore
              AI-first file/object or high-performance data-platform vendors, not just one vendor with a similar
              appliance shape. The next ring is public-storage incumbents. Pure and NetApp now sell consumption-oriented
              commercial models on top of broad product portfolios, while IBM still positions Storage Scale as a
              software-defined AI/HPC and hybrid-data platform. The adjacent ring matters too: Hammerspace and Qumulo
              push orchestration, global namespace, and hybrid-cloud mobility, which can let a buyer de-emphasize VAST
              even without copying its DASE architecture. Substitutes are real rather than theoretical. AWS FSx for
              Lustre, S3, Azure Managed Lustre, and Google Filestore expose usage-based pricing, native billing, and
              existing cloud contracts. Internal-build and status-quo options also persist because Ceph and MinIO can
              unify key storage semantics without handing more leverage to a single proprietary vendor. The net result
              is a market where VAST sells into direct product rivalry, incumbent bundling, orchestration alternatives,
              hyperscaler-native substitutes, and open-source anti-lock-in narratives at the same time.
