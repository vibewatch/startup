  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and substitutes
        blocks:
          - type: paragraph
            body: >-
              VAST is not best framed as a generic AI-infrastructure company. Its own positioning and white paper place
              it in the shared data layer that sits between raw storage media and higher-level AI application software:
              a unified platform for file, object, block, tabular, vector, and streaming data that can serve training,
              inference, analytics, and HPC workloads from a common control plane. That means the core market boundary
              includes high-performance shared storage, metadata and vector retrieval, global namespace and governance,
              and the software needed to keep those data services available across on-prem, cloud, and edge
              environments. It does not include GPU compute, networking fabric, general-purpose application software, or
              large swaths of generic IT services spend.


              The practical competitive frame is therefore narrower than total AI infrastructure but broader than a
              traditional NAS array. VAST’s own solution pages push into adjacent analytics, compliance, backup,
              container, and data-lakehouse use cases, while the white paper describes replacing separate object stores,
              analytics clusters, and orchestration layers with one data-centric platform. Status-quo substitutes remain
              incumbent all-flash arrays, scale-out NAS, object stores, and multi-product stacks assembled from discrete
              storage, database, and orchestration tools. The market-definition question matters because using a broader
              AI-infrastructure headline as TAM would overstate the spend pool VAST can realistically capture, while
              using only classic external-storage categories understates the software and orchestration layer VAST is
              trying to sell.
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM007
              - CM008
              - CM021
