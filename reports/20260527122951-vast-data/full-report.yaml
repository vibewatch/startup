      - number: '7.3'
        title: Operational, quality, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is less about a publicly documented outage history than about how many critical layers
              VAST does not fully control. The current product story relies on NVIDIA acceleration, Cisco distribution,
              Supermicro reference systems, and broader OEM hardware from vendors that also work with VAST competitors.
              The CoreWeave contract and SDS sovereign-cloud build prove that VAST can win very large deployments, but
              they also show how revenue and roadmap execution can become tied to a handful of capital-intensive
              counterparties whose own GPU budgets, data-center timing, and procurement priorities can shift abruptly.
              Competitive pressure sharpens this problem. Dell is not a partner in the evidence reviewed; it is an
              active rival publicly attacking VAST on power, space, and benchmark framing, while StorageMath has
              criticized one of VAST's optimization claims. That does not prove product weakness, but it does mean VAST
              must keep both technical credibility and partner alignment high while scaling across mission-critical
              environments.
