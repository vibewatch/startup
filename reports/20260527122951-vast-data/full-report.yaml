companyProfile:
  summary: >-
    VAST Data is a private AI infrastructure company founded in 2016 that has expanded from a high-performance all-flash
    storage platform into what it now calls an AI Operating System. The platform combines DataStore, DataBase,
    DataEngine, and DataSpace under the DASE architecture to unify storage, database, and compute for enterprise,
    neocloud, and sovereign-AI workloads. Public evidence supports meaningful scale: VAST disclosed more than $4 billion
    in cumulative bookings, more than $500 million in committed ARR exiting the prior fiscal year, and positive
    operating margin plus free cash flow before its 2026 Series F. The company now sits at a $30 billion private
    valuation, with strong ecosystem validation from customers, OEMs, and NVIDIA-linked deployments, but still provides
    limited public disclosure on concentration, exact revenue definitions, and fully diluted economics.
