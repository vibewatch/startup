            body: >-
              The same public evidence that proves adoption also sharpens risk. CoreWeave is simultaneously VAST’s best
              public expansion case and clearest concentration flag because one disclosed partner-linked agreement is
              worth $1.17 billion, and third-party reporting says VAST underpins workloads CoreWeave delivers to Meta,
              OpenAI, and Microsoft. Public VAST materials also frame adoption through partners such as NVIDIA,
              Supermicro, HPE, Lambda, and Core42, which suggests partner-led distribution matters structurally for
              customer acquisition and deployment. What public sources do not show is equally important: there is no
              retained disclosure of current total customer count, channel mix, sales-cycle length, partner take-rates,
              cohort retention, or top-customer revenue share. The user-specified names BMW, Nasdaq, Goldman Sachs, and
              Dell are also revealing. The retained NVIDIA pages on BMW and Nasdaq prove adjacent AI infrastructure
              credibility, but they do not mention VAST. Sacra supports Goldman Sachs and Dell Technologies Capital as
              investors, not paying customers. So the chapter can support real adoption, real expansion, and real
              partner leverage, but it cannot close the loop on direct proof for every marquee name or on the
