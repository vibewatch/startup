            body: >-
              The financial read-through is favorable but not fully underwriteable. On the positive side, VAST combines
              software-like margin signals, multi-year contract evidence, very large average commitments, positive free
              cash flow claims, and exceptional demand from AI-cloud customers. That is a stronger revenue-quality
              profile than most late-stage infrastructure startups show publicly. The caution is that several of the
              most important inputs remain private: customer concentration, actual cash balance and runway, CAC and
              payback, realized pricing, debt obligations, and a reconciled bridge across bookings, CARR, and any
              broader ARR or revenue constructs. Large AI-cloud accounts also introduce concentration and renewal-timing
              risk precisely because they can move results so dramatically. The right underwriting stance is therefore
              not to dismiss the business model, but to separate what the public record can support from what still
              needs company disclosure. VAST looks financially strong enough to justify serious diligence, yet the
