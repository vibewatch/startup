      - number: '2.4'
        title: Growth drivers, adoption constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Demand drivers are real and multi-layered. IDC’s storage forecast, VAST’s own AI-factory messaging, and
              the reference architecture all point to a common theme: more AI production workloads mean more shared data
              infrastructure, more all-flash demand, and higher sensitivity to time-to-token and GPU utilization.
              Deloitte shows enterprise AI activity moving from pilot to production, while Cloudera describes 2026 as
              the shift from experimentation to operational intelligence orchestration. NetApp and Pure both underline
              that incumbents are already monetizing the same need for AI-ready, accessible enterprise data. In other
              words, VAST is selling into a real category, not a purely theoretical one.


              But the constraints are equally material. Gartner says enterprises remain ROI-sensitive and often prefer
              incumbent providers during the current AI cycle. Informatica and Deloitte both show governance, data
              quality, and skills gaps slowing scale-out. Electronic Design and SNIA treat storage as a first-order
              design constraint because it affects performance, power, cooling, and deployment risk, while Avnet shows
              that SSD and DRAM tightness can push up cost and extend supply risk through 2027. INFUSE adds a
              buyer-trust problem: more information does not necessarily produce more purchase confidence. The
              combination means VAST’s valuation should not assume frictionless adoption. The biggest unresolved
              diligence questions are company-specific rather than market-wide: pricing, customer count, workload mix,
              trial-to-production conversion, and how much of the broad AI capex wave actually lands in the shared data
              layer VAST serves.
