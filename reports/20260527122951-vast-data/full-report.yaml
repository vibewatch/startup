      - number: '8.2'
        title: Financing context, marks, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The financing record is directionally supportive but still incomplete where underwriting matters most.
              March 2026 reporting surfaced the raise early, while the company officially disclosed the closed Series F
              on April 22, 2026. Management confirmed that the roughly $1 billion transaction combined primary and
              secondary capital, and outside reporting suggests that liquidity for early holders may have represented
              around half the headline amount. That matters because a secondary-heavy round is a weaker signal on fresh
              balance-sheet strength than a pure primary raise. Fidelity portfolio filings show an independent mark-up
              in VAST preferred shares from roughly $18.16 per share in August 2024 to roughly $59.22 by February 2026,
              so the valuation step-up did not come from nowhere. But those same sources still do not disclose the exact
              preference stack, dilution, or revenue-definition bridge. Entry discipline therefore has to be simple:
              assume the public record supports a valuation below the round unless diligence proves that recurring
              revenue is much closer to the high-end estimates and that late-stage financing terms are clean.
            claimRefs:
