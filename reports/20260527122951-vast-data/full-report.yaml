      - number: '7.2'
        title: Legal, regulatory, privacy, and sovereignty risk
        blocks:
          - type: paragraph
            body: >-
              The clearest live legal overhang is the Red Stapler chain. NetApp sued former CTO Jonsi Stefansson over
              alleged trade-secret misuse tied to the startup VAST acquired, and although the Florida complaint was
              dismissed without prejudice, the dismissal was venue-based and NetApp appealed. That means VAST is not yet
              facing a proven liability event, but the matter is also not fully extinguished. Separately, the public
              legal surface shows a company that processes contact, device, and candidate data through a website and
              cloud stack while pushing deeper into regulated sectors through Cisco reference designs for healthcare and
              financial-services use cases. That makes the 2025 bulk-data regime and broader U.S. privacy enforcement
              more relevant than they would be for a simple storage vendor. Israel adds another layer. VAST publicly
              tied itself to a sovereign Israeli AI cloud and operates a large Tel Aviv-centered development footprint,
              while Israeli legal commentary highlights export-control, dual-use, and IIA-grant constraints that can
              matter in financings, IP transfers, and exits. Public evidence is enough to rank these as real legal and
              regulatory risks, but not enough to close them without document review.
            claimRefs:
