            body: >-
              The strongest public margin signals point toward a software-led cost structure even though VAST sells into
              a hardware-heavy market. Company disclosures from 2022 and 2023 described the business as built on
              software gross margins and later cited nearly 90 percent gross margin with positive cash flow. The
              architectural and commercial model matters here: Gemini separates hardware and software economics, the
              white paper says OEMs such as Cisco and SuperMicro can sell standard-server VAST clusters, and Cisco now
              carries the platform on its GPL. Those factors imply that some inventory, manufacturing, and balance-sheet
              working-capital burden may sit with OEM partners rather than with VAST itself. At the same time, bundled
              features such as Polaris and installed-base programs such as Amplify mean that support, control-plane
              delivery, and optimization services are embedded in the platform economics but not separately disclosed.
              The result is a favorable-looking gross-margin path with lower apparent capital intensity than a
