  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing, and recognition issues
        blocks:
          - type: paragraph
            body: >-
              VAST's monetization is best described as infrastructure software sold through enterprise and partner
              channels rather than as a pure self-serve storage product. The company markets a unified AI Operating
              System that combines storage, database, and compute, and older company material explicitly says Gemini is
              a software consumption model that disaggregates hardware from software economics. Public commercial pages
              emphasize contact-sales and demo motions, not self-serve pricing. That means there is enough evidence to
              identify the revenue mechanism, but not enough to observe realized price cards or discounting behavior
              directly. Cisco's Global Price List provides one verified partner procurement path, while Polaris being
              included at no extra cost suggests at least part of the control plane is bundled into the platform. The
              CoreWeave agreement demonstrates that VAST can land very large partner-linked commitments, but the public
              record still does not bridge how bookings, committed recurring revenue, and any usage or system-delivery
              components are recognized into a single revenue-definition stack.
