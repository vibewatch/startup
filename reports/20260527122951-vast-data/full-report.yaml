      - number: '8.4'
        title: Exit readiness, thesis-break triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The most supportable exit path is an eventual IPO, but management itself says that VAST has not started a
              formal IPO process or hired bankers yet. That means investors should not model a near-term public exit as
              though it were already underway. The public record also leaves open the questions that most often break
              late-stage deals: what fraction of revenue comes from a handful of hyperscaler or neocloud accounts, how
              repeatable those contracts are, what the post-Series-F cap table looks like, and whether audited reporting
              systems are ready for public-market scrutiny. Those are not cosmetic details at this valuation. If ARR
              definitions fail to reconcile, if customer concentration is high, or if the company remains far from IPO
              readiness despite demanding public-style pricing, the thesis should break immediately. The diligence
              agenda is therefore straightforward: ask for the private metric bridge, the concentration schedule, the
              financing waterfall, and the IPO-readiness roadmap before treating the $30 billion round as investable
              rather than merely impressive.
