      - number: '1.3'
        title: Funding History, Valuation, and Public Scale Metrics
        blocks:
          - type: paragraph
            body: >-
              VAST’s financing arc is unusually steep even by AI-infrastructure standards. The company went from an $83
              million Series D at a $3.7 billion valuation in May 2021 to a $118 million Series E at a $9.1 billion
              valuation in December 2023, and then to a roughly $1 billion Series F transaction at a $30 billion
              valuation in April 2026. The Series F round matters for three reasons beyond price. First, it included
              both primary and secondary capital, so some of the round monetized existing holders rather than simply
              funding balance-sheet growth. Second, the syndicate now blends financial investors such as Drive Capital,
              Access Industries, Fidelity, and NEA with NVIDIA as a strategic participant. Third, the company paired the
              valuation step-up with unusually strong company-claimed operating metrics: more than $4 billion in
              cumulative bookings, more than $500 million in prior-year committed ARR, and positive operating margin and
              free cash flow. Those are powerful signals but still not substitutes for audited financial statements.
              Public scale disclosure is uneven. Late-2023 sources support more-than-700 employees and offices in the
              US, Israel, and London, while 2026 exact headcount, customer count, and any debt or credit instruments
              remain unsupported in the retained source pack.
