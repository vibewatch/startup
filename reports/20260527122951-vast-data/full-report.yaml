      - number: '3.3'
        title: Pricing Transparency, Switching Friction, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              Pricing visibility is one of the clearest structural differences in the corpus. AWS, Azure, and Google all
              publish explicit or calculator-driven usage constructs for file or object services, while specialist
              storage vendors mostly route buyers to sales, demos, or negotiated subscription constructs. That does not
              make hyperscaler-native substitutes cheaper in every real workload, but it does lower procurement friction
              and makes them easier to compare inside an existing cloud contract. Pure and NetApp narrow the gap further
              by wrapping their platforms in STaaS models rather than only capex appliance sales. VAST’s switching costs
              still exist because petabyte-scale datasets, tuned AI pipelines, and operational familiarity are sticky.
              But the evidence suggests those costs are softer than monopoly-style lock-in: buyers can multi-home across
              cloud object, managed filesystems, orchestration layers, and open-source tiers, and several alternatives
              sell explicit anti-lock-in or portability stories. Distribution magnifies the point. Public incumbents and
              hyperscalers already have large account control, while WEKA and Hammerspace are still investing to expand
              sales or partnerships. VAST therefore needs more than speed claims to stay differentiated; it needs the
              product, migration path, and commercial model to remain convincing once buyers compare them against cloud
              billing convenience and incumbent account leverage.
            claimRefs:
