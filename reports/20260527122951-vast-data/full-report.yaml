      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is segment-dependent, but the pattern is consistent: technical champions emerge from
              infrastructure, data-platform, HPC, or AI-engineering teams, while budget approval and risk review move
              upward into CIO, procurement, finance, and broader buying committees. Market reports and vendor reference
              architectures show why. Fortune’s end-user cuts point to enterprises, CSPs, telecom, and government as
              distinct demand pools. Coherent’s on-prem bias for sensitive sectors, plus VAST’s own enterprise
              AI-factory framing, suggests regulated enterprises and public-sector or HPC users remain important for
              buyers that need control, governance, and data locality. In these accounts, storage administrators,
              ML-platform teams, or research-computing leaders may specify the architecture, but they rarely buy alone.
              IDC says procurement, finance, and revenue-operations functions have become central decision-makers, while
              Forrester says the typical complex purchase now involves 13 internal stakeholders and nine external
              influencers.


              That governance-heavy buying process also explains the adoption path. Trials and referenceability matter
              because buyers must prove business value before scaling. Forrester says more than 60% of buyers use a
              trial and 78% of buyers above $10 million do so. Supermicro and VAST sell a turnkey route from design to
              deployment, while VAST’s reference architecture emphasizes starting small and scaling with demand. The
              practical funnel is therefore problem discovery, architecture validation, proof of value, initial
              production cluster, and then broader rollout across more workloads or sites. What is still missing
              publicly is the actual conversion rate through that funnel for VAST accounts.
            claimRefs:
              - CM016
              - CM018
              - CM022
              - CM026
              - CM029
              - CM031
