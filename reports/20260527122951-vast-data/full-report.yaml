      - number: '3.2'
        title: Competitor Profiles and Capability Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              The retained profiles show three distinct ways to attack the same budget. Pure and NetApp compete from the
              incumbent end by combining multiprotocol storage breadth with packaging that looks safer to procurement
              teams already standardizing on public-company vendors. WEKA, DDN, and IBM compete by arguing that AI
              performance, GPU efficiency, or scale-out data services matter more than appliance familiarity.
              Hammerspace and Qumulo instead lean into orchestration and data locality: Hammerspace’s Tier 0 story is
              that local NVMe plus shared access beats external storage bottlenecks, while Qumulo emphasizes global
              namespace, cloud-native deployment modes, and managed Azure routes. VAST’s public story is broader than
              raw storage hardware because it now claims an AI operating system spanning storage, database, and compute.
              That broader story is helpful, but the competitive downside is obvious: once VAST says it is the data and
              execution substrate for agentic AI, it is no longer compared only with filers. It is compared with every
              vendor claiming unified data services, every orchestrator promising data-local execution, and every cloud
              substitute offering transparent metering plus existing contracts. Capability therefore matters on two axes
              at once: the depth of the hot data plane for AI workloads, and the breadth of workflow, namespace,
              deployment, and procurement options around it.
            claimRefs:
