  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk stack and investment implication
        blocks:
          - type: paragraph
            body: >-
              VAST is not a scandal or obvious product-failure case; the risk is mostly underwriting risk at a
              peak-cycle AI infrastructure price before public disclosure catches up. The company does have real proof
              points: it closed a $30 billion Series F, says it has more than $4 billion of cumulative bookings and more
              than $500 million of committed ARR, landed a $1.17 billion CoreWeave partnership, and now ships through
              validated NVIDIA, Cisco, and Supermicro architectures. But those same facts create the top residual stack.
              First is valuation-reset risk, because the price assumes durable AI build-out and continued acceptance of
              private metrics. Second is concentration risk across Nvidia, Cisco, OEM hardware, and a small set of
              marquee AI-cloud customers. Third is execution breadth as VAST stretches from storage into a full AI
              operating system and cloud control plane. Fourth is legal and compliance exposure around Red Stapler and
              new data rules. Fifth is Israel-linked continuity and talent exposure. Investment implication: the deal is
              still diligencable, but only if legal provenance, concentration, and compliance evidence become bounded
              rather than open-ended risks.
