    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Stage, and Product Scope
        blocks:
          - type: paragraph
            body: >-
              VAST Data is a private AI infrastructure company founded in 2016 that now presents itself as the “AI
              Operating System” for data-intensive applications rather than as a point-storage vendor. The core company
              story in retained sources is consistent on direction: VAST says it unifies storage, database, and compute
              in a single data platform, while independent coverage describes the same transition as a three-phase move
              from flash-oriented storage into database services and then into broader AI operating-system
              orchestration. Product materials describe VAST DataStore as a universal data store that removes
              traditional storage tiers and scales from terabytes to exabytes, while partner materials from Supermicro
              frame the platform as the data-management layer for enterprise AI and GPU cloud deployments. Headquarters
              is less cleanly disclosed than product scope. Official 2023–2026 press materials alternately use
              “No-Headquarters” or “Remote-First Company” while anchoring announcements to New York City, and
              Reuters-described coverage calls the company New York-headquartered. For later chapters, the safest ground
              truth is that VAST operates as a remote-first, New York-anchored private company with a US-facing
              commercial surface and Israeli operational roots reflected in later location reporting.
