  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: How VAST's major risks transmit into revenue, margin, financing options, and exit value.
    data:
      nodes:
        - id: valuation
          label: Valuation reset
          detail: Private mark falls faster than disclosure improves.
        - id: concentration
          label: Partner / customer concentration
          detail: CoreWeave, Nvidia, Cisco, and OEM stack matter disproportionately.
        - id: legal
          label: Legal / IP overhang
          detail: Red Stapler provenance and appeal remain live diligence items.
        - id: compliance
          label: Compliance proof gap
          detail: Security and privacy controls are not fully evidenced in public.
        - id: israel
          label: Israel continuity
          detail: Engineering and sovereign-cloud exposure remain partly local.
        - id: execution
          label: Execution breadth
          detail: AI OS and cloud-control-plane ambition widen the operating surface.
        - id: revenue
          label: Revenue quality
          detail: Growth durability depends on concentration and delivery staying intact.
        - id: margin
          label: Gross margin / support load
          detail: Discounting and support burden can rise if execution slips.
        - id: financing
          label: Financing options
          detail: Late-stage access depends on maintaining the growth story.
        - id: exit
          label: Exit valuation
          detail: IPO or next-round outcome absorbs the combined risk stack.
      edges:
        - from: concentration
          to: revenue
          label: renewal and capex timing
        - from: execution
          to: revenue
          label: product delivery
        - from: legal
          to: execution
          label: cloud roadmap friction
        - from: compliance
          to: revenue
          label: regulated-customer friction
        - from: israel
          to: execution
          label: talent and continuity
        - from: revenue
          to: margin
          label: discounting and support mix
        - from: margin
          to: financing
          label: durability signal
        - from: valuation
          to: financing
          label: mark-to-market pressure
        - from: financing
          to: exit
          label: IPO / next-round optionality
        - from: revenue
          to: exit
          label: growth credibility
    approximationNotes: >-
      The DAG is directional rather than mathematical and is meant to show where small upstream shocks become larger
      underwriting problems.
