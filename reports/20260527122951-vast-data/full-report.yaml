        title: Customer segmentation and buyer / user / payer map
        blocks:
          - type: paragraph
            body: >-
              The public record supports a broad but not fully enumerated VAST customer base. Official customer-proof
              pages and roster disclosures show VAST reaching AI-cloud operators, telecom sovereign-AI builders,
              financial-services institutions, healthcare and life-sciences teams, government research bodies, and media
              organizations. The visible buyer-user-payer pattern is segment specific rather than uniform. In media, the
              NHL frames the purchase around production and archive workflows run by media-operations teams for
              downstream editors, producers, broadcasters, and eventually AI-assisted content discovery. In sovereign AI
              and AI-cloud contexts, the technical operator is a platform or infrastructure team, but the platform is
              procured so enterprise, research, and public-sector tenants can consume GPU and data services. In
              healthcare, genomics, and quant trading, the end users are researchers, scientists, and quants, while
              central infrastructure budgets fund the platform. That means VAST is not selling to a single universal
              persona; it is selling a deep infrastructure layer whose commercial sponsor is usually central IT or
              platform engineering, while the economic justification comes from higher-level data teams and business
              workflows.
