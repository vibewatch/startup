        - Adjacent hybrid-cloud challenger
        - >-
          Private; retained pages emphasize NPS, exabyte cloud scale, and managed Azure route rather than refreshed
          funding
        - File-heavy enterprise and cloud workloads needing global namespace and managed cloud options
        - >-
          Modern file/object platform with Cloud Data Fabric, Azure Native managed service, and hybrid-cloud deployment
          paths
        - Scale, funding, and realized pricing remain less visible than for public incumbents
