        - >-
          Data intelligence platform with Infinia and other AI-focused offerings across inference, sovereign AI, and
          scale-out workloads
        - >-
          Some strongest claims are self-authored and public pricing or capital structure is not refreshed in retained
          evidence
      - - IBM Storage
        - Public incumbent / software-defined alternative
        - Global public incumbent; Storage Scale System 6000 is NVIDIA-certified and throughput-heavy
        - Regulated enterprises wanting software-defined AI/HPC data services with existing IBM relationships
        - >-
          Storage Scale plus Scale System sell file/object unification, content-aware intelligence, and GPU-ready
          performance
        - IBM’s broader portfolio can slow sharp AI-only messaging and pricing remains quote-led
      - - Hammerspace
        - Adjacent orchestration challenger
        - $100M round at $500M+ valuation; TechCrunch names Meta and DoD as customers
