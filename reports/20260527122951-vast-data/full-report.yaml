  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              VAST sells the platform as an AI Operating System rather than as a single storage SKU. In customer
              workflow terms, the retained record says the buyer is trying to collapse multiple stages of the data path
              onto one shared substrate: ingest data through file, object, streaming, or Kubernetes interfaces; catalog
              and query it through DataBase; trigger event-driven processing in DataEngine; and keep the same data
              visible across sites through DataSpace rather than copying it into separate silos. The AI reference
              architecture is explicit that the company wants one flash-native platform to cover data capture,
              refinement, model training, model serving, audit logging, and RAG-style retrieval. Kubernetes material
              makes that concrete at operator level, because the same cluster can be exposed either as NFS or as
              CSI-provisioned persistent volumes. The workflow value proposition is therefore not merely speed; it is
              reducing data movement, avoiding separate storage/database/streaming stacks, and presenting one control
              model to infrastructure teams.
