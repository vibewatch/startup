  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - lens
      - thesis
      - anti-thesis
      - what would change the view
    rows:
      - - Market
        - AI infrastructure demand is real and VAST sits in a large buildout cycle.
        - AI-capex multiples can compress sharply if the bubble narrative wins or utilization disappoints.
        - Show durable demand through customer renewals and resilient growth through a weaker AI-spend tape.
      - - Product
        - A unified AI Operating System can justify a premium over legacy storage vendors.
        - The premium is not investable if product breadth does not translate into monetized recurring revenue.
        - Provide module-level monetization and attach-rate disclosure.
      - - Customers
        - Marquee customers and partners support strategic relevance.
        - Public sources do not quantify concentration, so one or two large neoclouds may dominate economics.
        - Share top-customer ARR and renewal schedule.
      - - Financials
        - Official signals show >$500M CARR, >$4B bookings, and positive margin/cash-flow claims.
        - Those facts still leave a wide gap to the ~$2B ARR estimate needed for comfort at this price.
        - Bridge bookings, CARR, ARR, and recognized revenue in audited form.
      - - Competition
        - >-
          VAST should trade above NetApp and Pure if it is truly an AI-infrastructure platform rather than a storage box
          company.
        - Even premium public comps trade well below VAST's implied multiple unless the high-end ARR estimate is right.
        - Prove software-like durability and margin quality at materially larger scale.
      - - Financing / governance
        - Independent Fidelity marks support a real valuation step-up.
        - Secondary-heavy structure and undisclosed preference terms weaken price confidence.
        - Provide primary/secondary split and full cap-table waterfall.
    notes: >-
      Each row pairs a real positive with the corresponding underwriting objection. The chapter recommendation only
      improves if the “what would change the view” column is satisfied.
