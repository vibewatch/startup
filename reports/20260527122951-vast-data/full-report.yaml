  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price-sensitive recommendation, not a company-quality verdict
        blocks:
          - type: paragraph
            body: >-
              VAST Data looks like a real category leader rather than a hype-only asset. The company has an unusually
              strong combination of AI-infrastructure relevance, marquee customers, rapid growth, and positive margin
              signals for a private storage-and-data platform. The problem is not whether the business matters; the
              problem is whether fresh capital at a $30 billion valuation can still earn an attractive return using only
              public evidence. At the official floor of more than $500 million of committed ARR, the round price implies
              roughly 60x. Even the older Reuters-style $600 million ARR projection still implies about 50x. Only the
              most aggressive external estimate of roughly $2 billion of ARR pulls the entry price down to about 15x,
              which is still rich versus public storage peers. That makes the recommendation price-sensitive and
              evidence-sensitive: track or research more for new money, hold only if the basis is materially lower, and
              do not confuse a strong company with a justified entry price.
            claimRefs:
              - CV001
