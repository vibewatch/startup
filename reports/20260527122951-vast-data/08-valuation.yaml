tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - dimension
  - current read
  - evidence basis
  - decision implication
  rows:
  - - Recommendation
    - Track / research-more for fresh capital; hold only for existing low-basis holders
    - Fresh-money underwriting clears only in the bull case while company-quality signals remain strong
    - Do not initiate at the round price without a private diligence package or a better entry point.
  - - Confidence
    - Medium
    - Core financing facts are real, but revenue-definition and preference-stack gaps remain unresolved
    - Treat the call as evidence-sensitive rather than final.
  - - Risk rating
    - High
    - Price requires premium growth assumptions plus continued AI-capex support and clean concentration dynamics
    - Underwrite downside first.
  - - Valuation stance
    - Expensive
    - The round implies ~60x official CARR, ~50x a Reuters-style ARR projection, and ~15x an aggressive external ARR estimate
    - Current price embeds success that public evidence has not fully proven.
  - - Target return / hold / exit
    - New money needs ~$60B for 2x gross or ~$90B for 3x gross; existing holders can hold for IPO optionality
    - Return hurdle is difficult to support versus public comp multiples today
    - Fresh buyers need a price reset or much stronger evidence.
  notes: This table is explicitly price-sensitive. Return hurdles are arithmetic from the $30 billion round valuation and do not adjust for future dilution or financing terms.
  claimRefs:
  - CV019
  - CV020
  - CV021
