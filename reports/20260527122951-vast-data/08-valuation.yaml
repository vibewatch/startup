- id: scenario-and-comparable-view
  title: Scenarios and comparable valuation anchors
  body: Public comparables frame the valuation problem clearly. Everpure, the rebranded Pure Storage, trades around 7.7x EV to trailing revenue; NetApp trades around 4.1x; and CoreWeave, the clearest public AI-infrastructure premium reference, trades around 10.9x EV to annualized first-quarter revenue while carrying much heavier leverage. Private AI infrastructure rounds such as Lambda, Crusoe, and Together AI confirm that investors are paying up for GPU-cloud and AI-platform assets, but none of those milestones close the gap between VAST's official $500 million-plus CARR floor and a $30 billion price. The base case therefore sits below the round, because a mid-point revenue estimate combined with a public AI-infrastructure premium still lands in the low-to-high teens. The bull case reaches the high twenties to mid-thirties only if the roughly $2 billion ARR estimate is directionally right, concentration is manageable, and public markets remain open to premium AI infrastructure multiples.
    The bear case collapses quickly toward public-storage bands if AI spending slows or the revenue bridge fails.
  claimRefs:
