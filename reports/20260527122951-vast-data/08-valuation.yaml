- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - why it breaks thesis
  - action implication
  rows:
  - - Revenue bridge fails
    - Audited ARR or recurring revenue lands well below ~$1.5B
    - The current round price only works if scale is far above the official $500M CARR floor
    - Stop or reprice the deal.
  - - Customer concentration too high
    - Top one or two customers dominate recurring revenue or upcoming renewals
    - Late-stage premium multiples should compress if demand is narrow or lumpy
    - Increase downside weighting or walk away.
  - - AI multiple compression
    - Public AI infrastructure comps derate toward legacy storage bands
    - VAST is already priced for premium multiples
    - Avoid fresh entry until price resets.
  - - IPO readiness stalls
    - No bankers, controls, or reporting roadmap despite premium public-style pricing
    - Holding period extends while valuation support weakens
    - Treat as longer-duration private asset or decline.
  - - Preference overhang surprises
    - Series F waterfall or anti-dilution terms materially reduce common-equity value
    - Headline valuation no longer maps to investor economics
    - Rebuild return model from the cap table, not from the headline valuation.
  notes: Kill triggers are intentionally specific and deal-oriented. They focus on conditions that would invalidate the current pricing rather than conditions that merely slow growth.
  claimRefs:
  - CV036
  - CV038
  - CV046
  - CV048
  - CV049
- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner / diligence path
  rows:
  - - Revenue bridge
    - Bookings-to-CARR-to-ARR-to-recognized-revenue reconciliation by year and by top customer
    - This is the single biggest swing factor in fair value
    - Finance diligence / CFO package.
  - - Primary vs secondary mix
    - Signed financing summary showing exact fresh cash and seller liquidity
    - Determines dilution and how much runway actually improved
    - Legal + investor-relations diligence.
  - - Cap table / preferences
    - Series F term sheet, liquidation waterfall, and fully diluted ownership
    - Headline valuation may overstate common-equity value
    - Legal diligence / board materials.
  - - Customer concentration
    - Top-20 ARR, renewal dates, margin profile, and hyperscaler exposure
    - Concentration can collapse the bull case quickly
    - Commercial diligence / revenue-ops export.
  - - IPO readiness
    - Controls, audit status, board composition, and banker-readiness milestones
    - IPO is the most supportable exit path but not yet formally started
    - CEO/CFO diligence + governance review.
  notes: These are the shortest path to changing the recommendation. Without them, the public record is good enough to admire the company but not to underwrite a fresh $30 billion entry.
  claimRefs:
  - CV037
  - CV039
  - CV048
  - CV049
