  evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-coverage
    missingEvidence: Private AI infrastructure peers rarely disclose current revenue, net debt, or standardized recurring-revenue definitions.
    whyItMatters: The comparable table can anchor valuation directionally, but private-row precision remains weaker than for public comps.
    diligencePath: Request management or bankers' comp deck with current revenue, growth, and margin ranges for late-stage AI infrastructure peers.
    relatedQuestionRefs:
    - QV015
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: primary-secondary-split
    missingEvidence: Exact dollars of primary proceeds, secondary liquidity, and any seller discount mechanics for the Series F.
    whyItMatters: Fresh balance-sheet cash, dilution, and insider-liquidity signaling change how much comfort investors should take from the headline round size.
    diligencePath: Request the signed financing summary, cap-table bridge, and tender-offer allocation schedule.
    relatedQuestionRefs:
    - QV004
  - type: private-evidence-only
    severity: blocking
    topic: revenue-definition-bridge
    missingEvidence: An audited bridge from bookings to CARR to ARR to recognized revenue, including treatment of multi-year licenses and non-recurring system economics.
    whyItMatters: The entire valuation debate turns on whether VAST is a $500-$600 million recurring-revenue business or something much closer to $2 billion.
    diligencePath: Request audited board materials or quality-of-revenue schedules that reconcile each metric by year, by top customer, and by contract type.
    relatedQuestionRefs:
    - QV018
  - type: private-evidence-only
    severity: material
    topic: preference-stack
    missingEvidence: Series F security terms, liquidation preferences, participation rights, anti-dilution mechanics, and fully diluted ownership after the round.
    whyItMatters: A headline valuation can overstate common-equity value if late-stage preference terms are investor-friendly or if dilution is materially higher than public reporting suggests.
    diligencePath: Request the post-round cap table, financing documents, and board-approved waterfall model.
    relatedQuestionRefs:
    - QV019
    - QV028
  - type: private-evidence-only
    severity: material
    topic: concentration-and-renewals
    missingEvidence: Top-customer ARR, renewal dates, contract durations, and revenue concentration tied to hyperscaler or neocloud accounts.
    whyItMatters: If a few AI-cloud customers dominate revenue, then public comp multiples are too generous and the downside case should carry more weight.
    diligencePath: Request a top-20 customer schedule with ARR, billings, gross margin, and renewal timing.
    relatedQuestionRefs:
    - QV021
    - QV028
    - QV029
  - type: missing-source
    severity: material
    topic: ipo-readiness
    missingEvidence: Concrete IPO-readiness milestones such as banker engagement, PCAOB-audited controls, board composition, and reporting-system readiness.
    whyItMatters: An eventual IPO is the most supportable exit path, but the timeline drives holding period, dilution risk, and whether public-market comparables are usable today.
    diligencePath: Request the IPO-readiness workplan, audit status, and board/governance roadmap.
    relatedQuestionRefs:
    - QV022
    - QV023
    - QV028
