- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation range (USD B)
  - implied result vs $30B entry
  - probability signal / triggers
  rows:
  - - Bull
    - Public high-end ARR estimate (~$2B) is directionally right; concentration is manageable; VAST earns a 14x-18x premium multiple into an open IPO market.
    - 28-36
    - Flat to moderately positive for fresh buyers; attractive for low-basis holders
    - Needs private diligence to validate revenue scale and exit readiness.
  - - Base
    - Normalized recurring-revenue power is about $1.3-$1.5B; VAST earns a premium to Pure/NetApp but not a bubble multiple.
    - 13-21
    - Below the current round; fresh entry unattractive
    - Best fit with today's public record.
  - - Bear
    - Durable recurring revenue is closer to $0.8B; AI multiples compress toward public-storage bands; concentration or exit timing worsens.
    - 6.4-8.0
    - Severe markdown from the round price
    - Triggered by failed revenue bridge, customer concentration, or a shut IPO window.
  notes: Scenario values are estimated equity ranges, not negotiated term-sheet outcomes. They purposely use broad bands because the public record does not support point precision.
