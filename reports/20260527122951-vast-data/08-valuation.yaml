- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - status
  - current value
  - revenue anchor
  - implied multiple / milestone
  - relevance
  - limitation
  rows:
  - - Pure Storage / Everpure
    - Public
    - EV ~$28.0B on 2026-05-27
    - TTM revenue ~$3.66B
    - ~7.7x EV/revenue
    - Best listed storage-platform premium comp with good margins and cash
    - Still more mature and less AI-native than VAST.
  - - NetApp
    - Public
    - EV ~$27.1B on 2026-05-27
    - TTM revenue ~$6.70B
    - ~4.1x EV/revenue
    - Useful lower-bound storage incumbent comp
    - Legacy mix and slower growth likely understate AI-platform upside.
  - - CoreWeave
    - Public
    - EV ~$90.7B on 2026-05-27
    - Annualized Q1'26 revenue ~$8.3B
    - ~10.9x EV/annualized revenue
    - Closest public AI-infrastructure premium reference
    - Heavily levered and power-intensive; not a clean apples-to-apples comp.
  - - Lambda
    - Private round
    - $480M Series D; Reuters-valued at ~$2.5B
    - Public revenue undisclosed
    - Milestone reference only
    - Shows investors will pay up for AI cloud capacity
    - No current revenue or margin disclosure.
  - - Crusoe
    - Private round
    - $1.375B Series E at >$10B valuation
    - Public revenue undisclosed
    - Milestone reference only
    - Large capital raise for vertically integrated AI infrastructure
    - Valuation is not paired with public recurring-revenue detail.
  - - Together AI
    - Private round
    - $305M Series B at $3.3B valuation
    - Public revenue undisclosed
    - Milestone reference only
    - Another cloud/AI-platform valuation marker
    - Model mix and financial profile are not storage-infrastructure comparable.
  notes: Public rows use runDate market data; CoreWeave revenue is annualized from Q1 2026 for directional comparison; private rows are milestone references because current revenue is not publicly disclosed. This is a partial enumeration of the most relevant observable comps, not an exhaustive late-stage AI infrastructure universe.
