schemaVersion: report-v2
artifact: valuation
slug: vast-data
runDate: '2026-05-27'
company:
  name: VAST Data
chapter:
  number: 8
  title: Valuation
  summary: VAST Data appears to be a real AI infrastructure winner, but the March-to-April 2026 $30 billion Series F is only publicly defendable if recurring revenue is much closer to the high-end external estimates than to the company's disclosed $500 million-plus CARR floor. Public comps anchor a base case below the round, so fresh capital should stay in track or research-more mode until management provides a private revenue bridge, concentration data, and cap-table terms.
sections:
- id: price-sensitive-recommendation
  title: Price-sensitive recommendation, not a company-quality verdict
  body: 'VAST Data looks like a real category leader rather than a hype-only asset. The company has an unusually strong combination of AI-infrastructure relevance, marquee customers, rapid growth, and positive margin signals for a private storage-and-data platform. The problem is not whether the business matters; the problem is whether fresh capital at a $30 billion valuation can still earn an attractive return using only public evidence. At the official floor of more than $500 million of committed ARR, the round price implies roughly 60x. Even the older Reuters-style $600 million ARR projection still implies about 50x. Only the most aggressive external estimate of roughly $2 billion of ARR pulls the entry price down to about 15x, which is still rich versus public storage peers. That makes the recommendation price-sensitive and evidence-sensitive: track or research more for new money, hold only if the basis is materially lower, and do not confuse a strong company with a justified entry price.'
  claimRefs:
  - CV001
  - CV007
  - CV009
  - CV019
  - CV020
  - CV021
  - CV044
  - CV047
  - CV050
  tableRefs:
