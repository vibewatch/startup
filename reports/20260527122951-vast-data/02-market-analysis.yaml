  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-gap
    missingEvidence: Named VAST customer counts, average contract values, geography mix, and workload mix that would isolate a VAST-specific SAM and SOM.
    whyItMatters: Without VAST pipeline and monetization data, any SAM or SOM used in valuation is an externally bounded estimate rather than a company-specific market capture model.
    diligencePath: Request cohort-level bookings, customer-count, ACV, and deployment mix data from management or board materials and reconcile it to major workload categories.
    relatedQuestionRefs:
    - QM009
    - QM026
    relatedTableRefs:
    - TM002
  - type: access-blocked
    severity: material
    topic: analyst-methodology
    missingEvidence: Underlying Gartner and IDC models that define exact category boundaries, geography assumptions, and component coverage for the published 2026 figures.
    whyItMatters: Public press releases expose the top-line numbers but not the full segmentation logic, making direct comparison between storage-only and infrastructure-wide estimates imperfect.
    diligencePath: Obtain the full Gartner and IDC tracker notes or ask management which analyst frame it uses internally when discussing TAM.
    relatedQuestionRefs:
    - QM004
    - QM005
    - QM008
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: deployment-conversion
    missingEvidence: Public conversion rates from proof-of-concept to production, renewal rates, and deployment timelines for VAST AI-factory accounts.
    whyItMatters: The adoption funnel can be described qualitatively, but sales-cycle length and conversion materially affect revenue timing and the credibility of any near-term SOM estimate.
    diligencePath: Ask for sales-funnel stages, pilot win rates, deployment-to-first-token timing, and renewal expansion metrics by segment.
    relatedQuestionRefs:
    - QM016
    - QM026
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: minor
    topic: methodology-conflict
    missingEvidence: A harmonized third-party benchmark that isolates shared AI storage and data-platform spend without bundling compute, networking, or generic AI software.
    whyItMatters: The public market range is directionally useful, but the spread between $37.7 billion storage and $1.366 trillion infrastructure can be misused if the methodology caveat is ignored.
    diligencePath: Triangulate sell-side or private analyst cuts that explicitly separate shared storage and data services from broader AI infrastructure budgets.
    relatedQuestionRefs:
    - QM007
    - QM008
    relatedTableRefs:
    - TM002
