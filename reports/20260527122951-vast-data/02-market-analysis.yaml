callouts:
- calloutType: insight
  title: VAST Benefits from AI Capex, but Only Through a Narrow Data-Layer Slice
  body: The market is large enough to matter, but the right valuation anchor is not total AI infrastructure. The investable question is whether VAST can own a meaningful share of the shared data layer inside enterprise AI factories and governed hybrid deployments.
  claimRefs:
  - CM019
  - CM020
  - CM021
- calloutType: risk
  title: The Buyer Committee is a Bigger Constraint than the Technical Demo
  body: 2026 research points to procurement, finance, and large buying groups becoming decisive earlier in the cycle. Even technically strong platforms will need ROI proof, trusted references, and smooth PoC-to-production conversion to win large accounts.
  claimRefs:
  - CM028
  - CM029
  - CM031
  - CM032
  - CM033
  - CM045
- calloutType: assumption
  title: Public SAM and SOM Math Remain Incomplete Without Company Data
  body: The public record is good enough to bound the market, but not to isolate VAST pricing, customer count, or conversion rates. Any model that presents a precise VAST SOM should be treated as management-only until underlying cohort data is shown.
  claimRefs:
  - CM020
  - CM030
  - CM046
