- id: sizing-lenses
  title: Sizing lenses and methodology conflict
  body: |-
    Public market data supports a range of defensible lenses, not a single clean TAM. At the narrow end, IDC’s external OEM enterprise storage forecast reaches about $37.7 billion in 2026 and is explicitly tied to branded storage systems, with all-flash arrays benefiting from AI and analytics demand. Fortune Business Insights places AI-powered storage at $44.94 billion in 2026, a broader cut that includes storage architectures optimized for AI workloads and separates file- and object-based approaches. Research and Markets and Coherent Market Insights both put broad AI infrastructure at roughly $90 billion in 2026, but those reports bundle much more than storage, spanning offerings, functions, technologies, deployment models, and end users. Gartner’s $1.366 trillion AI-infrastructure number is broader still and is only useful as context for how much total ecosystem capex can surround VAST’s category.

    For valuation work, the correct conclusion is not that one of these numbers is right and the rest are wrong. The right conclusion is that VAST sits inside several nested spend pools, and each publisher chooses a different boundary. The most defensible public framing is an evidence-constrained core lens bounded by enterprise external storage on the low side and AI-powered-storage categories on the high side, with broader AI-infrastructure figures treated as adjacency rather than TAM. Public sources do not disclose enough VAST-specific pricing, customer, or win-rate data to isolate a clean SAM or SOM, so contradictory estimates and methodology limits should be preserved rather than averaged away.
  claimRefs:
  - CM009
  - CM011
  - CM013
  - CM017
  - CM018
