  rows:
  - - Core served market
    - 'Shared AI data infrastructure: high-performance file, object, block, metadata, vector retrieval, governance, and global namespace services'
    - GPU compute, networking, generic AI software, consulting services
    - CIO / infrastructure or platform budget owner; users are storage, ML, and data-platform teams
    - Direct
  - - AI factory adjacency
    - Integrated storage plus OEM compute bundles, deployment software, reference architectures, and NVIDIA-aligned data services
    - Raw accelerator silicon spend and broad data-center construction
    - Central AI platform or infrastructure sponsor
    - Adjacent / partner-led
  - - Data platform adjacency
    - Lakehouse, analytics, event, compliance, and backup workloads that land-and-expand into the same flash data fabric
    - Generic SaaS analytics seats and non-data application software
    - CDO / data platform leader or security / resilience owner
    - Adjacent
  - - Excluded broad AI infrastructure
    - None beyond the shared data layer
    - Hyperscaler capex, servers, networking, power, cooling, and general AI services
    - Broader enterprise or provider capex pools
    - Too broad for TAM
  - - Status-quo substitutes
    - Incumbent all-flash arrays, scale-out NAS, object stores, and stitched multi-product stacks
    - Not a separate spend pool; these are replacement paths
    - Storage, HPC, and platform operators
    - Compete for same workload
  notes: Boundary logic combines VAST official positioning with public market-report definitions; relevance distinguishes direct spend from adjacency and explicit exclusion.
