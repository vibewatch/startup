- id: TI004
  title: Capital adequacy table
  columns:
  - item
  - current value / status
  - implication
  - diligence ask
  rows:
  - - Series F transaction value
    - Approximately $1B total at $30B valuation
    - Shows deep investor appetite and ample headline financing capacity
    - Provide signed financing documents and total primary cash received by the company.
  - - Primary vs secondary split
    - Officially mixed primary and secondary; outside reporting says >$500M and possibly most was secondary
    - Headline funding likely overstates fresh operating cash
    - Provide exact primary proceeds, secondary proceeds, and seller list.
  - - Use of proceeds
    - Primary proceeds earmarked for global growth and strategic transactions
    - Signals expansion rather than rescue financing
    - Provide budgeted use-of-funds schedule and M&A reserve assumptions.
  - - Profitability / capital dependence
    - Positive operating margin and free cash flow reported; CEO says external capital not required to operate
    - Supports capital adequacy, but still not a substitute for treasury data
    - Provide monthly cash flow statements and current cash balance.
  - - Third-party valuation marks
    - Fidelity N-PORT marks rose from ~$1.08M to ~$3.51M for the same preferred-share basket between 2024 and 2026
    - Independent portfolio marks corroborate valuation uplift
    - Provide latest investor marks and cap-table reconciliation.
  - - Cash / burn / runway
    - Not publicly disclosed
    - Prevents a true downside runway analysis
    - Provide treasury pack and 12/24-month runway scenarios.
  - - Debt / project finance obligations
    - Not publicly disclosed in reviewed sources
    - Cannot rule out hidden covenant or equipment-finance pressure
    - Provide debt schedule, covenant package, and any equipment finance agreements.
  notes: This table focuses on forward capital adequacy rather than round chronology. The central issue is not whether VAST can raise capital; it is how much of the 2026 headline round actually strengthened the balance sheet and what undisclosed obligations still sit beneath the surface.
  claimRefs:
  - CI026
  - CI027
  - CI028
  - CI029
  - CI030
  - CI031
  - CI032
  - CI035
- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact on underwriting
  - exact diligence path
  rows:
  - - Bookings-to-revenue-to-ARR bridge
    - Without a metric-definition bridge, public revenue quality cannot be normalized against peers
    - Request quarterly bridge from bookings to recognized revenue to CARR / ARR, including non-committed revenue.
  - - Current cash balance and runway
    - No true downside liquidity view is possible
    - Request treasury reports and board runway scenarios.
  - - Debt / covenant package
    - Cannot assess hidden financing pressure or equipment-finance obligations
    - Request debt schedule, covenant summary, and legal confirmation of secured debt.
  - - Customer concentration and renewals
    - Large AI-cloud deals could dominate risk and revenue timing
    - Request top-10 customer ARR/bookings and renewal calendar.
  - - CAC, payback, and sales-cycle data
    - Sales efficiency remains qualitative, not model-ready
    - Request funnel conversion, CAC, payback, and sales-cycle metrics by channel.
  - - Realized pricing and discount schedules
    - Public pricing mechanisms cannot be converted into realized ASPs or margin assumptions
    - Request price books, sample order forms, and partner pricing schedules.
  - - Segment gross margins and support / services costs
    - Current margin path cannot be audited by stream
    - Request product-line and channel gross margin bridge plus support-cost allocations.
  notes: These are the minimum missing inputs required to turn a strong public narrative into a real investment-grade financial model. The company looks commercially impressive, but the data room still has to supply the underwriting core.
