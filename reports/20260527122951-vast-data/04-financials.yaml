runDate: '2026-05-27'
company:
  name: VAST Data
chapter:
  number: 4
  title: Financials
  summary: 'VAST Data''s public financial picture is unusually strong for a private infrastructure company: the company said it exited the prior fiscal year with more than $500 million of committed ARR, positive operating margin, positive free cash flow, and $4 billion of cumulative bookings, while third-party reporting points to even higher ARR-like revenue. The 2026 Series F at a $30 billion valuation materially improves capital access, but public underwriting is still blocked by unreconciled revenue definitions, no disclosed cash or runway, no CAC/payback data, and uncertainty over how much of the headline $1 billion round actually reached the balance sheet versus secondary liquidity.'
sections:
- id: revenue-model-pricing
  title: Revenue model, pricing, and recognition issues
  body: VAST's monetization is best described as infrastructure software sold through enterprise and partner channels rather than as a pure self-serve storage product. The company markets a unified AI Operating System that combines storage, database, and compute, and older company material explicitly says Gemini is a software consumption model that disaggregates hardware from software economics. Public commercial pages emphasize contact-sales and demo motions, not self-serve pricing. That means there is enough evidence to identify the revenue mechanism, but not enough to observe realized price cards or discounting behavior directly. Cisco's Global Price List provides one verified partner procurement path, while Polaris being included at no extra cost suggests at least part of the control plane is bundled into the platform. The CoreWeave agreement demonstrates that VAST can land very large partner-linked commitments, but the public record still does not bridge how bookings, committed recurring
    revenue, and any usage or system-delivery components are recognized into a single revenue-definition stack.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI041
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: gtm-sales-efficiency
  title: GTM motion and sales-efficiency proxies
  body: 'VAST''s public GTM evidence points to a high-touch enterprise motion with unusually large average land sizes and strong expansion dynamics. In 2021 the company said initial investments averaged about $1 million and expansion averaged 328 percent; in FY22 it said NRR exceeded 300 percent. More recent third-party reporting suggests top-100 new customers spend more than $1.2 million on average and that contract duration often runs five to seven years. Those are strong proxies for durable enterprise revenue, especially when paired with Cisco GPL access and cloud-partner distribution into AI infrastructure budgets. The company also appears to benefit from giant lighthouse accounts: CoreWeave alone signed a $1.17 billion agreement and multiple outlets reference xAI and other AI-cloud customers. What the public record does not disclose is CAC, CAC payback, the average sales cycle, or partner take-rates. So the chapter can argue that VAST likely has very efficient land-and-expand dynamics,
    but it cannot convert those demand signals into a closed sales-efficiency model.'
  claimRefs:
  - CI006
  - CI007
  - CI008
  - CI017
  - CI018
  - CI024
  - CI025
  - CI033
  figureRefs:
  - FI002
- id: cost-structure-capital-intensity
  title: Cost structure, gross margin drivers, and capital intensity
  body: 'The strongest public margin signals point toward a software-led cost structure even though VAST sells into a hardware-heavy market. Company disclosures from 2022 and 2023 described the business as built on software gross margins and later cited nearly 90 percent gross margin with positive cash flow. The architectural and commercial model matters here: Gemini separates hardware and software economics, the white paper says OEMs such as Cisco and SuperMicro can sell standard-server VAST clusters, and Cisco now carries the platform on its GPL. Those factors imply that some inventory, manufacturing, and balance-sheet working-capital burden may sit with OEM partners rather than with VAST itself. At the same time, bundled features such as Polaris and installed-base programs such as Amplify mean that support, control-plane delivery, and optimization services are embedded in the platform economics but not separately disclosed. The result is a favorable-looking gross-margin path with lower
    apparent capital intensity than a proprietary-array vendor, but one that still lacks a current segment-margin bridge and working-capital disclosure.'
  claimRefs:
  - CI003
  - CI019
  - CI020
  - CI021
  - CI022
  - CI023
  - CI034
  - CI039
