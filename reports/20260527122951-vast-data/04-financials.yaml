- id: traction-capital-adequacy
  title: Public traction and capital adequacy
  body: Public traction is unusually strong for a private infrastructure company, but capital adequacy still has to be read through partial disclosures. Official sources show a staircase from $200 million ARR at the end of 2023 to more than $500 million of committed ARR at the exit of the prior fiscal year, alongside $4 billion of cumulative bookings, positive operating margin, and free cash flow. Independent outlets stretch that picture much further, with Reuters-linked reporting discussing $600 million of ARR and Calcalist/TNW discussing up to roughly $2 billion of ARR-like revenue including non-committed components. That gap is not just noise; it tells investors that VAST's publicly quoted revenue metrics are using different definitions. On capital adequacy, the 2026 Series F valued the company at $30 billion and brought in about $1 billion of total transaction value, but public reporting indicates that a large share of that headline number was secondary liquidity. Fidelity's SEC marks
    independently corroborate the valuation step-up, yet the company still has not publicly disclosed cash on hand, burn, runway, debt, or financing triggers.
  claimRefs:
  - CI010
