callouts:
- calloutType: strength
  title: Revenue quality looks unusually strong for a private infra company
  body: VAST publicly combines long-duration contracts, very large customer commitment sizes, positive free cash flow claims, and software-like margin signals. That is enough to argue quality, even if it is not enough to finish underwriting.
  claimRefs:
  - CI017
  - CI021
  - CI036
- calloutType: risk
  title: The $1B headline round is not the same thing as $1B of fresh cash
  body: Multiple 2026 sources indicate the Series F included substantial secondary liquidity. Until management discloses the exact primary proceeds, investors should not assume the full headline amount improved operating runway.
  claimRefs:
  - CI027
  - CI030
- calloutType: recommendation
  title: Do not underwrite VAST without the private metric bridge
  body: Before taking a hard valuation stance from this chapter, require a private package covering revenue-definition reconciliation, top-customer concentration, current cash and runway, CAC/payback, and any debt or equipment-finance obligations.
  claimRefs:
  - CI031
  - CI032
  - CI033
  - CI037
