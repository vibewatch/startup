  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: recurring-revenue-bridge
    missingEvidence: A management-defined bridge from bookings to recognized revenue to committed ARR and total ARR, with explicit definitions for non-committed revenue and large strategic contracts.
    whyItMatters: The public record ranges from >$500M committed ARR to roughly $2B of ARR-like revenue. Without a definition bridge, underwriting can neither size recurring revenue quality nor compare VAST cleanly to public comps.
    diligencePath: Request quarterly board or CFO materials that reconcile bookings, recognized revenue, committed ARR/CARR, non-committed revenue, deferred revenue, and backlog for FY24-FY26.
    relatedQuestionRefs:
    - QI008
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Cash on hand, monthly burn or cash generation, runway assumptions, and the explicit financing trigger for any next round or IPO timeline.
    whyItMatters: Positive free cash flow claims are encouraging, but they do not substitute for treasury detail. Underwriters still need current cash, base-case runway, and downside runway under slower growth or delayed collections.
    diligencePath: Request treasury reports, monthly cash flow statements, and the board's latest runway scenario deck, including assumptions behind any IPO-readiness plans.
    relatedQuestionRefs:
    - QI016
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: debt-and-covenants
    missingEvidence: Any debt facility, lender covenant, equipment financing, or project-finance obligation summary.
    whyItMatters: A company can be free-cash-flow positive and still face covenant or refinancing risk. Debt and project-finance disclosure is currently absent from the public record we reviewed.
    diligencePath: Request a capitalization table appendix, debt schedule, covenant package, equipment-finance agreements, and a legal letter confirming whether any secured debt exists.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, CAC payback, funnel conversion, sales-cycle duration, and partner take-rate by channel and customer segment.
    whyItMatters: Large ACVs and long contracts suggest attractive economics, but without CAC and cycle data there is no way to judge whether VAST's growth is capital efficient or merely front-loaded by exceptional AI demand.
    diligencePath: Request sales funnel metrics, cohort CAC, quota attainment, pipeline conversion, and partner economics for Cisco/cloud channels.
    relatedQuestionRefs:
    - QI018
    - QI019
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin-bridge
    missingEvidence: Current gross margin by software, services, support, and any system-linked revenue, plus a bridge from gross profit to operating cash flow.
    whyItMatters: Near-90% gross margin was disclosed in 2023, but VAST now sells a broader AI OS through OEM and cloud channels. The current blended margin path could be better or worse depending on support and partner-delivery cost absorption.
    diligencePath: Request segment P&L by product family and channel, plus support and service-delivery cost allocations for FY24-FY26.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer concentration, renewal schedule, backlog composition, and revenue split between hyperscaler/neocloud customers and broader enterprise accounts.
    whyItMatters: Public evidence points to very large AI-cloud deals. Without concentration and renewal detail, investors cannot tell whether VAST's growth is broadly diversified or disproportionately tied to a small number of counterparties.
    diligencePath: Request top-10 customer ARR, bookings, and renewal timing, plus backlog share attributable to CoreWeave, xAI-related deployments, and other AI-cloud accounts.
    relatedQuestionRefs:
    - QI009
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: minor
    topic: realized-pricing
    missingEvidence: Actual price cards, average realized discounts, partner markups, and attach-rate assumptions for bundled software versus OEM systems.
    whyItMatters: The public record supports a pricing mechanism but not actual realized pricing. That limits the ability to benchmark VAST against public storage and infrastructure peers on a like-for-like basis.
    diligencePath: Request current price books, sample order forms, partner pricing schedules, and win/loss discount data by segment.
    relatedQuestionRefs:
    - QI002
    relatedTableRefs:
    - TI002
    - TI005
