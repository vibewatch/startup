            - Polaris control plane
            - VMS GUI / CLI
            - PolicyEngine / TuningEngine
        - label: DASE infrastructure plane
          detail: CNodes/CBoxes/CNode-X and DNodes/DBoxes remain the foundation, with OEM and NVIDIA variants changing packaging more than the core abstraction.
