  - id: architecture-operating-model
    title: Architecture and operating model
    body: >-
      The architectural center of gravity is DASE, VAST's disaggregated shared-everything model. Public technical documents describe stateless compute nodes handling protocol and software services while persistent data and system state sit on NVMe-backed storage enclosures, which allows performance and capacity to scale independently. That matters because the platform pitch depends on all protocols seeing the same underlying data plane: DataStore exposes file and object interfaces, DataBase adds tabular and query services, Event Broker extends the platform toward Kafka-style streaming, and block access is now being added through NVMe/TCP. The architecture is also presented as deployment-flexible. The older reference architecture still shows classic CBox and DBox layouts, while current partner material from Supermicro and Cisco shows packaged solutions that keep VAST's software abstractions but adapt them to OEM hardware and AI-factory reference designs. The net read-through is that VAST's product is not a loose bundle of separate products; it is one layered software platform whose value depends on the shared data plane actually behaving consistently across multiple access methods and node topologies.
