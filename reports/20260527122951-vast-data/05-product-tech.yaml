  - id: TE002
    title: Workflow / use-case table
    columns:
      - user job
      - current workflow / pain
      - VAST solution
      - measurable / public benefit
      - limitation
    rows:
      - - Consolidate AI data ingestion and model-serving data paths
        - Teams copy data across separate archive, training, and inference stacks
        - Single flash-native platform for capture, refinement, model serving, and RAG retrieval
        - Public architecture frames reduced copying and one shared platform across pipeline stages
        - Public corpus is architecture-heavy; customer-specific ROI data is limited here.
      - - Provide persistent storage to Kubernetes workloads
        - Native container storage is host-local or manually provisioned
        - Use VAST as NFS-backed storage or CSI-based dynamic provisioning
        - Official documentation shows both modes and official CSI distribution paths
        - No public broad-scale deployment metrics for CSI adoption were retained.
      - - Run real-time analytics and vector retrieval on the same data plane
        - Query engines and vector systems often sit beside rather than inside storage
        - DataBase plus GPU-accelerated SQL and cuVS-backed vector retrieval on CNode-X
        - 2026 materials claim lower query time/cost and retrieval acceleration
        - The strongest numbers are company-issued benchmark claims, not independent tests.
      - - Add block and streaming without adding a separate SAN or Kafka estate
        - Enterprises keep block workloads or event streams on separate islands
        - NVMe/TCP block plus Event Broker / Kafka-compatible ingest on the common platform
        - Public reports say block inherits snapshots, clones, replication, and QoS
        - Public evidence for production scale of the newest surfaces is still thinner than for file/object core.
      - - Build cyber-resilient backup or governed data-retention workflows
        - Backup platforms often need separate immutable targets and added storage tiers
        - Commvault validates VAST as NFS or S3 target with WORM immutability options
        - Public partner doc supports disk-library and cloud-library usage with immutable copies
        - Validation exists, but this chapter did not retain broader multi-vendor backup references.
    notes: >-
      Benefits are limited to what retained sources support directly. Independent deployment outcome data is strongest for integration existence, not for a broad public ROI benchmark set.
