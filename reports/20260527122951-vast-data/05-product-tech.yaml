  - id: TE003
    title: Technology / operating architecture table
    columns:
      - layer / component
      - role
      - dependency
      - key risk
    rows:
      - - Access protocols and clients
        - Present shared data through NFS, SMB, S3, SQL/table, CSI, and newer NVMe/TCP block interfaces
        - Client compatibility, protocol translation, and stable common metadata semantics
        - Newer block and streaming surfaces may lag the maturity of legacy file/object interfaces.
      - - CNodes / CBoxes / CNode-X
        - Run VAST software services, protocol handling, AI accelerations, and management functions
        - CPU or GPU server supply plus OEM partner packaging from Cisco and Supermicro
        - Accelerated roadmap execution becomes tied to partner hardware and NVIDIA enablement.
      - - DNodes / DBoxes / NVMe fabric
        - Hold persistent metadata and data state while exposing shared access across the cluster
        - NVMe flash economics, fabric design, and data-protection algorithms
        - Hardware topology and flash assumptions remain central to performance and rebuild claims.
      - - DataBase and catalog layer
        - Provide ACID tables, catalog metadata, pushdown, analytics, and provenance support
        - Query-engine integrations, GPU libraries, and consistent object/file metadata capture
        - Public deployment proof is thinner for newest accelerated SQL claims than for architecture diagrams.
      - - DataEngine and Event Broker
        - Run event-driven functions, triggers, pipelines, topics, and streaming workflows
        - Developer tooling, runtime support, and pipeline authoring ergonomics
        - DataEngine is visible publicly, but runtime maturity is harder to underwrite than storage maturity.
      - - DataSpace and Polaris
        - Extend visibility, control, and orchestration across hybrid and multi-site deployments
        - Agent-based fleet management, cloud integrations, and consistent policy propagation
        - Public docs for Polaris still trail the ambition of the launch narrative.
    notes: >-
      This is a qualitative operating-model map, not a packet-level spec. Risk cells focus on where public evidence is thinner than the product claim, especially for the newest layers.
