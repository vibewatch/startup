      layers:
        - label: Access and protocol plane
          detail: File, object, table, Kubernetes, API, and newer block access surfaces meet operators where their workflows already live.
          modules:
            - NFS / SMB / S3
            - SQL / table access
            - CSI / Kubernetes
            - REST API / Swagger
            - NVMe/TCP block
        - label: Shared data-services plane
          detail: One underlying platform exposes DataStore, catalog, snapshots, clones, replication, QoS, and streaming/event services.
          modules:
            - DataStore / Universal Storage
            - Catalog metadata
            - Snapshots / clones / replication / QoS
            - Event Broker / Kafka-compatible ingest
            - WORM-capable target modes via partners
        - label: Database and compute plane
          detail: Structured querying and event-driven execution sit on top of the same data substrate rather than in a separate stack.
          modules:
            - VAST DataBase
            - DataEngine
            - Functions / triggers / pipelines / topics
            - Vector retrieval / RAG services
        - label: Global control and namespace plane
          detail: DataSpace and Polaris extend the product from cluster services toward distributed orchestration and policy management.
