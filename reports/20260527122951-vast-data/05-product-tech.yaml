  - id: deployment-integration-roadmap
    title: Deployment, integration, and roadmap maturity
    body: >-
      VAST has enough public integration surface to look operable in modern infrastructure environments rather than merely demoable. The Juniper validated design exposes concrete cluster topology, VIP rebalancing behavior, GUI and CLI management, and a REST API under the hood. The Kubernetes knowledge-base article plus the CSI repo and Helm documentation show that container platforms are not an afterthought. The GitHub organization, Python SDK, Terraform provider, DataEngine CLI, and Go client together create a public operator toolchain that can be used for provisioning, querying, automation, and pipeline management. The roadmap, however, is moving faster than the deepest public documentation. Block storage and Event Broker were surfaced in 2025, and the 2026 narrative adds Polaris, CNode-X, PolicyEngine, TuningEngine, and open DataEngine blueprints. Those moves expand the buyer story from storage into orchestration and agentic-AI operations, but they also mean the newest layers are backed more by launch materials and commentary than by the kind of mature administrator documentation visible for the core platform and Kubernetes integrations.
