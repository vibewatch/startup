tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - module / asset
      - primary user / buyer
      - public status / maturity
      - what it does
      - differentiation
      - diligence gap
    rows:
      - - Universal Storage / DataStore
        - Storage architects, AI infrastructure teams, platform ops
        - Mature core; repeatedly documented since before the 2026 AI OS reframing
        - Shared file and object data plane presented over NFS, SMB, and S3 with the same underlying elements
        - One write path can be surfaced through multiple protocols rather than isolated silos
        - Need current public benchmark and reference-deployment detail by workload, not just architectural claims.
      - - VAST DataBase
        - Data engineers, analytics teams, RAG pipeline owners
        - Documented module; materially expanded in 2024-2026 messaging
        - ACID tabular engine tied to catalog, pushdown, SQL analytics, and provenance workloads
        - Couples structured querying to the same platform that stores unstructured data
        - Need public GA docs and customer references for the newest GPU-accelerated database paths.
      - - VAST DataEngine
        - Pipeline builders, platform engineers, AI application teams
        - Visible but still earlier than storage core in public documentation depth
        - Event-driven processing environment for functions, triggers, pipelines, topics, and compute resources
        - Turns the platform from passive storage into an execution surface
        - Need more public production examples and operational SLOs for DataEngine workloads.
      - - DataSpace / Polaris control layer
        - Multi-site operators, cloud teams, governance owners
        - DataSpace is documented; Polaris is newer and more announcement-driven
        - Global namespace plus hybrid-control orchestration for distributed VAST environments
        - Makes hybrid and multi-site operation part of the product story rather than an external overlay
        - Need public admin docs, customer references, and GA-state clarity for Polaris.
      - - AI OS accelerators (CNode-X, PolicyEngine, TuningEngine)
        - Enterprise AI platform teams, agentic-AI builders
        - 2026 launch-stage surface; not yet as deeply documented as platform core
        - GPU-accelerated compute path, inline policy enforcement, and closed-loop model tuning
        - Pushes VAST above storage into full-stack AI workflow control and acceleration
        - Need proof of customer production use, actual availability, and support boundaries.
      - - Developer / operator tooling
        - SREs, automation teams, Kubernetes operators
        - Active and public
        - CSI driver, Helm chart, Python SDK, Go client, Terraform provider, and DataEngine CLI
        - Lowers integration friction and gives the product a visible practitioner surface
        - Need usage telemetry or download/install evidence beyond repository existence and activity.
    notes: >-
      Status/maturity reflects depth of retained public evidence rather than internal shipment data. The core storage platform is better documented than the newest AI-OS control and acceleration layers.
