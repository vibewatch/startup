  - id: trust-compliance-and-controls
    title: Trust, compliance, and control posture
    body: >-
      Public trust evidence is real but uneven. The strongest artifacts are not a polished public trust-center package; they are deployment and hardening materials. VAST's Security Configuration Guide says the platform is a STIG-hardened appliance, documents federal procurement orientation, and states the product is listed on the DoDIN Approved Products List. It also lays out concrete control surfaces: HTTPS-based VMS management, CLI access, predefined roles including CSI-specific permissions, identity integration with Active Directory, LDAP, and NIS, and trusted TLS prerequisites before SSO and MFA are configured. The AI reference architecture adds the broader design claim of zero trust, RBAC, ABAC, encryption, auditing, network isolation, and tenant-specific key management. Commvault's integration guide adds cyber-resilience evidence by documenting WORM-mode immutable backup copies on VAST-backed cloud-library workflows. The caution is that this chapter's retained corpus still does not provide a broad public certification catalog, clear SLA or incident-history evidence, or strong public reference proof that the newest Polaris and Policy/Tuning layers are already widely deployed in production.
