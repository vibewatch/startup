summary:
  headline: >-
    VAST Data looks like a genuine AI infrastructure winner with real scale, strong ecosystem proof, and differentiated
    data-platform technology, but the current $30 billion valuation still requires private diligence on revenue quality,
    concentration, and cap-table terms before new money can be underwritten confidently.
