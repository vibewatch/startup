  topStrengths:
    - >-
      Unified AI Operating System / DASE architecture gives VAST a differentiated full-stack data layer rather than a
      commodity array story.
    - >-
      Publicly disclosed traction is unusually strong for a private infrastructure vendor: more than $4B of bookings,
      more than $500M of committed ARR, positive operating margin, positive free cash flow, and a $1.17B CoreWeave
      agreement.
    - >-
      Customer, OEM, and NVIDIA-adjacent ecosystem proof spans AI clouds, telecom, media, healthcare, research, and
      sovereign-AI deployments.
  topRisks:
    - >-
      At $30B, valuation remains expensive versus public storage comps unless true recurring revenue is much closer to
      high-end third-party estimates than to the company’s own disclosed ARR floor.
    - >-
      Public evidence still does not reconcile ARR definitions or disclose top-customer concentration, renewal quality,
      or fully diluted Series F terms.
    - >-
      VAST’s platform expansion increases dependence on NVIDIA, Cisco, OEM hardware partners, and flagship AI-cloud
      accounts such as CoreWeave.
    - >-
      Legal/IP overhang around Red Stapler plus Israel-linked operating continuity and privacy/regulatory exposure
      remain real diligence items.
  unresolvedGaps:
    - Audited bridge among bookings, committed ARR, projected ARR, and any broader ARR-like revenue construct.
    - Top-customer ARR, renewal cohorts, and concentration exposure after the CoreWeave and neocloud buildout.
    - Post-Series-F cap table, liquidation preferences, option-pool impact, and exact primary-versus-secondary split.
    - Current headcount, security/compliance certifications, and independently verifiable reliability/SLA metrics.
