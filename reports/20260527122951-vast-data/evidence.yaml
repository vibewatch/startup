evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: governance-transparency
    missingEvidence: A current, source-backed full board roster plus committee or observer structure.
    whyItMatters: Later diligence on control, governance quality, and investor influence is weak without a current board map.
    diligencePath: >-
      Request a board list from management or obtain a recent financing deck, cap table summary, or legal close memo
      that names directors and observers.
    relatedQuestionRefs:
      - QO009
      - QO025
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: debt-and-leverage
    missingEvidence: Any supportable disclosure of debt, credit facilities, or other leverage tied specifically to VAST Data.
    whyItMatters: >-
      A company at this valuation can look less durable if liquidity includes hidden leverage or vendor financing not
      visible in public equity-round reporting.
    diligencePath: >-
      Ask management for debt schedules, bank lines, or covenants and cross-check with lender announcements or legal
      filings.
    relatedQuestionRefs:
      - QO015
      - QO025
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: customer-and-headcount-precision
    missingEvidence: A current 2026 employee count, a current office footprint, and an exact paying-customer count or cohort breakdown.
    whyItMatters: >-
      Scale quality is hard to compare against peers when public disclosures stop at logo examples and an older >700
      headcount datapoint.
    diligencePath: >-
      Request an operating dashboard or HR snapshot and corroborate customer counts by cohort, cloud partner, and direct
      enterprise segment.
    relatedQuestionRefs:
      - QO018
      - QO019
      - QO025
    relatedTableRefs:
      - TO001
      - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map-completeness
    missingEvidence: >-
      A full cap-table view showing how much of recent financing was primary capital versus liquidity and which
      investors hold formal control rights.
    whyItMatters: >-
      Valuation headline alone does not reveal governance power, preference stack, or the true dilution and liquidity
      profile for existing holders.
    diligencePath: >-
      Request the most recent financing term sheet, investor rights agreement summary, and cap-table bridge from Series
      E to Series F.
    relatedQuestionRefs:
      - QO013
      - QO014
      - QO025
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sam-gap
    missingEvidence: >-
      Named VAST customer counts, average contract values, geography mix, and workload mix that would isolate a
      VAST-specific SAM and SOM.
    whyItMatters: >-
      Without VAST pipeline and monetization data, any SAM or SOM used in valuation is an externally bounded estimate
      rather than a company-specific market capture model.
    diligencePath: >-
      Request cohort-level bookings, customer-count, ACV, and deployment mix data from management or board materials and
      reconcile it to major workload categories.
    relatedQuestionRefs:
      - QM009
      - QM026
    relatedTableRefs:
      - TM002
  - type: access-blocked
    severity: material
    topic: analyst-methodology
    missingEvidence: >-
      Underlying Gartner and IDC models that define exact category boundaries, geography assumptions, and component
      coverage for the published 2026 figures.
    whyItMatters: >-
      Public press releases expose the top-line numbers but not the full segmentation logic, making direct comparison
      between storage-only and infrastructure-wide estimates imperfect.
    diligencePath: >-
      Obtain the full Gartner and IDC tracker notes or ask management which analyst frame it uses internally when
      discussing TAM.
    relatedQuestionRefs:
      - QM004
      - QM005
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: deployment-conversion
    missingEvidence: >-
      Public conversion rates from proof-of-concept to production, renewal rates, and deployment timelines for VAST
      AI-factory accounts.
    whyItMatters: >-
      The adoption funnel can be described qualitatively, but sales-cycle length and conversion materially affect
      revenue timing and the credibility of any near-term SOM estimate.
    diligencePath: >-
      Ask for sales-funnel stages, pilot win rates, deployment-to-first-token timing, and renewal expansion metrics by
      segment.
    relatedQuestionRefs:
      - QM016
      - QM026
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: methodology-conflict
    missingEvidence: >-
      A harmonized third-party benchmark that isolates shared AI storage and data-platform spend without bundling
      compute, networking, or generic AI software.
    whyItMatters: >-
      The public market range is directionally useful, but the spread between $37.7 billion storage and $1.366 trillion
      infrastructure can be misused if the methodology caveat is ignored.
    diligencePath: >-
      Triangulate sell-side or private analyst cuts that explicitly separate shared storage and data services from
      broader AI infrastructure budgets.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: commercial-terms
    missingEvidence: Customer-level contract minima, discounting bands, and committed-capacity terms for VAST and major named peers.
    whyItMatters: >-
      Without realized commercial terms, the pricing table can compare packaging models but not true TCO breakpoints or
      discount pressure.
    diligencePath: >-
      Collect partner quotes, marketplace screenshots, or customer procurement artifacts under NDA and normalize them to
      throughput, capacity, and term.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: migration-friction
    missingEvidence: >-
      Detailed migration case studies or reference calls quantifying re-platform time, application changes, and downtime
      when leaving VAST, WEKA, or DDN.
    whyItMatters: >-
      Switching cost is central to moat durability, but public sources mostly describe product architecture rather than
      real exit friction.
    diligencePath: >-
      Interview reference customers, integrators, and cloud partners that have moved petabyte-scale AI datasets between
      vendors or back to cloud services.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: minor
    topic: compliance-surface
    missingEvidence: >-
      A clean, current public mapping of VAST certifications and regulated-workload attestations versus public
      incumbents and hyperscalers.
    whyItMatters: >-
      The current chapter can infer procurement posture from public-cloud and sovereign-AI signals, but not complete
      certification parity.
    diligencePath: >-
      Fetch vendor trust centers, SOC/ISO attestations, FedRAMP or government procurement pages, and map them side by
      side for regulated buyer workflows.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: recurring-revenue-bridge
    missingEvidence: >-
      A management-defined bridge from bookings to recognized revenue to committed ARR and total ARR, with explicit
      definitions for non-committed revenue and large strategic contracts.
    whyItMatters: >-
      The public record ranges from >$500M committed ARR to roughly $2B of ARR-like revenue. Without a definition
      bridge, underwriting can neither size recurring revenue quality nor compare VAST cleanly to public comps.
    diligencePath: >-
      Request quarterly board or CFO materials that reconcile bookings, recognized revenue, committed ARR/CARR,
      non-committed revenue, deferred revenue, and backlog for FY24-FY26.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: >-
      Cash on hand, monthly burn or cash generation, runway assumptions, and the explicit financing trigger for any next
      round or IPO timeline.
    whyItMatters: >-
      Positive free cash flow claims are encouraging, but they do not substitute for treasury detail. Underwriters still
      need current cash, base-case runway, and downside runway under slower growth or delayed collections.
    diligencePath: >-
      Request treasury reports, monthly cash flow statements, and the board's latest runway scenario deck, including
      assumptions behind any IPO-readiness plans.
    relatedQuestionRefs:
      - QI016
    relatedTableRefs:
      - TI004
  - type: missing-source
    severity: material
    topic: debt-and-covenants
    missingEvidence: Any debt facility, lender covenant, equipment financing, or project-finance obligation summary.
    whyItMatters: >-
      A company can be free-cash-flow positive and still face covenant or refinancing risk. Debt and project-finance
      disclosure is currently absent from the public record we reviewed.
    diligencePath: >-
      Request a capitalization table appendix, debt schedule, covenant package, equipment-finance agreements, and a
      legal letter confirming whether any secured debt exists.
    relatedQuestionRefs:
      - QI017
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, CAC payback, funnel conversion, sales-cycle duration, and partner take-rate by channel and customer segment.
    whyItMatters: >-
      Large ACVs and long contracts suggest attractive economics, but without CAC and cycle data there is no way to
      judge whether VAST's growth is capital efficient or merely front-loaded by exceptional AI demand.
    diligencePath: >-
      Request sales funnel metrics, cohort CAC, quota attainment, pipeline conversion, and partner economics for
      Cisco/cloud channels.
    relatedQuestionRefs:
      - QI018
      - QI019
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin-bridge
    missingEvidence: >-
      Current gross margin by software, services, support, and any system-linked revenue, plus a bridge from gross
      profit to operating cash flow.
    whyItMatters: >-
      Near-90% gross margin was disclosed in 2023, but VAST now sells a broader AI OS through OEM and cloud channels.
      The current blended margin path could be better or worse depending on support and partner-delivery cost
      absorption.
    diligencePath: >-
      Request segment P&L by product family and channel, plus support and service-delivery cost allocations for
      FY24-FY26.
    relatedQuestionRefs:
      - QI021
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-customer concentration, renewal schedule, backlog composition, and revenue split between hyperscaler/neocloud
      customers and broader enterprise accounts.
    whyItMatters: >-
      Public evidence points to very large AI-cloud deals. Without concentration and renewal detail, investors cannot
      tell whether VAST's growth is broadly diversified or disproportionately tied to a small number of counterparties.
    diligencePath: >-
      Request top-10 customer ARR, bookings, and renewal timing, plus backlog share attributable to CoreWeave,
      xAI-related deployments, and other AI-cloud accounts.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI004
      - TI005
