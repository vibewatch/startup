    severity: minor
    topic: realized-pricing
    missingEvidence: >-
      Actual price cards, average realized discounts, partner markups, and attach-rate assumptions for bundled software
      versus OEM systems.
    whyItMatters: >-
      The public record supports a pricing mechanism but not actual realized pricing. That limits the ability to
      benchmark VAST against public storage and infrastructure peers on a like-for-like basis.
