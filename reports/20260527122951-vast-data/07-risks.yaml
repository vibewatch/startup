- id: legal-regulatory-and-sovereignty
  title: Legal, regulatory, privacy, and sovereignty risk
  body: The clearest live legal overhang is the Red Stapler chain. NetApp sued former CTO Jonsi Stefansson
    over alleged trade-secret misuse tied to the startup VAST acquired, and although the Florida complaint
    was dismissed without prejudice, the dismissal was venue-based and NetApp appealed. That means VAST
    is not yet facing a proven liability event, but the matter is also not fully extinguished. Separately,
    the public legal surface shows a company that processes contact, device, and candidate data through
    a website and cloud stack while pushing deeper into regulated sectors through Cisco reference designs
    for healthcare and financial-services use cases. That makes the 2025 bulk-data regime and broader
    U.S. privacy enforcement more relevant than they would be for a simple storage vendor. Israel adds
    another layer. VAST publicly tied itself to a sovereign Israeli AI cloud and operates a large Tel
    Aviv-centered development footprint, while Israeli legal commentary highlights export-control, dual-use,
    and IIA-grant constraints that can matter in financings, IP transfers, and exits. Public evidence
    is enough to rank these as real legal and regulatory risks, but not enough to close them without document
    review.
  claimRefs:
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
  - CR031
  - CR041
  - CR042
  tableRefs:
  - TR001
- id: operational-and-partner-dependencies
  title: Operational, quality, and dependency risk
  body: Operational risk is less about a publicly documented outage history than about how many critical
    layers VAST does not fully control. The current product story relies on NVIDIA acceleration, Cisco
    distribution, Supermicro reference systems, and broader OEM hardware from vendors that also work with
    VAST competitors. The CoreWeave contract and SDS sovereign-cloud build prove that VAST can win very
    large deployments, but they also show how revenue and roadmap execution can become tied to a handful
    of capital-intensive counterparties whose own GPU budgets, data-center timing, and procurement priorities
    can shift abruptly. Competitive pressure sharpens this problem. Dell is not a partner in the evidence
    reviewed; it is an active rival publicly attacking VAST on power, space, and benchmark framing, while
    StorageMath has criticized one of VAST's optimization claims. That does not prove product weakness,
    but it does mean VAST must keep both technical credibility and partner alignment high while scaling
    across mission-critical environments.
