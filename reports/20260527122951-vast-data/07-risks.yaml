- id: people-execution-mitigations-and-kill-criteria
  title: People, execution, mitigations, and kill criteria
  body: 'People risk is meaningful because VAST''s market narrative still runs heavily through founder
    CEO Renen Hallak, while the cloud-control-plane expansion vector depends on the Red Stapler team whose
    arrival is precisely the area touched by the NetApp dispute. There are also classic late-stage private-company
    diligence limits: the public source set still does not provide top-customer concentration, renewal
    schedules, debt, current security certifications, or a clean treasury view. The good news is that
    some mitigations are real. VAST has deep financing access, partner validation from Cisco and Supermicro,
    and credible adoption in large AI environments. The bad news is that those mitigations do not answer
    the most thesis-sensitive questions on their own. Investors should therefore treat several items as
    explicit post-signing monitors rather than vague watchpoints: any new litigation step that drags VAST
    directly into the Red Stapler fight, evidence of customer concentration worse than expected, inability
    to produce current compliance attestations for regulated workloads, or any financing event that implies
    a valuation reset. Those are clearer kill criteria than generic concerns about competition or macro
    noise.'
  claimRefs:
