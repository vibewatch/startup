- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Valuation reset
    - Financing or IPO signal
    - Down-round, structured rescue financing, or IPO pricing materially below recent private marks
    - Pause new capital deployment and re-underwrite on public-comp multiples
  - - Customer concentration
    - Diligence disclosure
    - Top-customer or top-partner share materially exceeds underwriting assumptions, especially around
      CoreWeave
    - Cut position size or require stronger downside protections
  - - Legal / IP overhang
    - Case status
    - VAST is named directly, faces injunction risk, or cannot evidence clean code provenance
    - Treat as thesis-break until legal risk is quantified
  - - Security / compliance gap
    - Certification evidence
    - Company cannot produce current attestation set for regulated workloads inside diligence window
    - Limit underwriting to non-regulated growth case or stop
  - - Partner dependency
    - Roadmap / channel slippage
    - NVIDIA, Cisco, or OEM roadmap slip pushes major deployments by more than one planning cycle
    - Revise growth and margin expectations downward
  - - Israel continuity risk
    - People and operating resilience
    - Meaningful Israel leadership attrition or sovereign-cloud disruption with no fast fallback
    - Reprice execution risk and require continuity plan before closing
  notes: These triggers are designed to be monitorable inside diligence and the first post-close year
    rather than to rely on vague macro sentiment.
