company:
  name: VAST Data
chapter:
  number: 7
  title: Risks
  summary: VAST Data's residual risk is dominated less by a proven product failure than by underwriting
    at a $30 billion valuation before disclosure, concentration, and compliance evidence fully catch up.
    The biggest evidence-backed risks are valuation reset, multi-layer dependency on Nvidia/Cisco/OEMs
    and a handful of AI-cloud customers, execution stretch as VAST expands into a full AI operating system
    and cloud control plane, and legal or regulatory exposure around Red Stapler, privacy rules, and Israel-linked
    operations. Financing scale and partner validation are meaningful mitigants, but the thesis should
    break if concentration, code provenance, or security-compliance proof do not clear quickly in diligence.
sections:
- id: risk-stack-and-underwriting
  title: Ranked risk stack and investment implication
  body: 'VAST is not a scandal or obvious product-failure case; the risk is mostly underwriting risk at
    a peak-cycle AI infrastructure price before public disclosure catches up. The company does have real
    proof points: it closed a $30 billion Series F, says it has more than $4 billion of cumulative bookings
    and more than $500 million of committed ARR, landed a $1.17 billion CoreWeave partnership, and now
    ships through validated NVIDIA, Cisco, and Supermicro architectures. But those same facts create the
    top residual stack. First is valuation-reset risk, because the price assumes durable AI build-out
    and continued acceptance of private metrics. Second is concentration risk across Nvidia, Cisco, OEM
    hardware, and a small set of marquee AI-cloud customers. Third is execution breadth as VAST stretches
    from storage into a full AI operating system and cloud control plane. Fourth is legal and compliance
    exposure around Red Stapler and new data rules. Fifth is Israel-linked continuity and talent exposure.
    Investment implication: the deal is still diligencable, but only if legal provenance, concentration,
    and compliance evidence become bounded rather than open-ended risks.'
