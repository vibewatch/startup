- id: financial-commercial-and-competitive-risk
  title: Financial, commercial, and competitive risk
  body: 'The financial-model risk is not an imminent cash crunch in the public record; it is valuation
    fragility and concentration fragility. VAST''s financing access is clearly strong, but the round structure
    mixed primary and secondary capital, so the headline size exaggerates fresh operating cash. At the
    same time, the strongest scale metrics remain company-claimed rather than publicly reconciled. That
    matters because macro context is no longer uniformly supportive. Gartner still forecasts huge AI infrastructure
    spend in 2026, but it also says the sector is in a trough of disillusionment and that incumbents will
    capture much of enterprise AI demand. Goldman frames the build-out debate as assumption-sensitive,
    not guaranteed. Those two facts can coexist: spend can grow while the market becomes less forgiving
    of premium private valuations. For VAST, that means the downside case is not just slower top-line
    growth; it is slower top-line growth combined with harder competition from Dell and other incumbents
    and a public-market multiple reset before VAST closes its disclosure gap.'
  claimRefs:
