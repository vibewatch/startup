  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-register-coverage
    missingEvidence: A VAST-specific schedule of any Israel Innovation Authority grants, export licenses,
      sovereign-cloud approvals, or customer-required regulatory attestations.
    whyItMatters: Public evidence shows the sector-level rules and VAST's Israel-linked activity, but
      not whether VAST itself carries grant, export, or approval constraints that could affect IP transfer
      or transactions.
    diligencePath: Request legal and finance disclosure on grants, export-control classifications, sovereign-cloud
      commitments, and any government customer approval matrix.
    relatedQuestionRefs:
    - QR014
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: security-attestations
    missingEvidence: Current SOC 2, ISO 27001, penetration-test, incident-response, and customer security
      questionnaire evidence for regulated deployments.
    whyItMatters: Cisco and partner materials push VAST into regulated and mission-critical workloads,
      but the retained public set does not validate the compliance posture that those buyers usually demand.
    diligencePath: Request the latest audit reports, certificate register, customer security pack, and
      any gap-remediation roadmap.
    relatedQuestionRefs:
    - QR015
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: blocking
    topic: customer-concentration
    missingEvidence: Top-customer ARR, bookings, renewal timing, backlog share, and partner-take-rate
      detail, especially around CoreWeave and other AI-cloud accounts.
    whyItMatters: Public sources prove at least one giant disclosed contract and several named AI-cloud
      customers, but they do not show whether VAST is broadly diversified or effectively underwritten
      on a handful of counterparties.
    diligencePath: Request top-10 customer concentration schedules, renewal calendar, backlog composition,
      and a cloud-versus-enterprise revenue split.
    relatedQuestionRefs:
    - QR004
    - QR005
    - QR025
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: treasury-and-debt
    missingEvidence: Cash on hand, runway, debt facilities, covenant terms, and the actual primary-cash
      amount retained after the Series F secondary component.
    whyItMatters: The financing headline is reassuring, but without treasury detail investors cannot tell
      how much real balance-sheet cushion exists if AI demand timing slips or partner concentration worsens.
    diligencePath: Request treasury reports, debt schedules, board cash updates, and a bridge from gross
      transaction value to net new primary capital.
    relatedQuestionRefs:
    - QR003
    - QR025
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: red-stapler-provenance
    missingEvidence: Clean-room evidence, code provenance review, indemnity terms, and post-acquisition
      integration controls for the Red Stapler team and product assets.
    whyItMatters: The complaint is not against VAST today, but VAST acquired the team precisely to expand
      cloud-control-plane capability, so provenance problems would hit an active strategic vector.
    diligencePath: Request acquisition agreement summaries, outside counsel memo, code-audit results,
      and any hold-separate or remediation actions.
    relatedQuestionRefs:
    - QR008
    relatedTableRefs:
    - TR001
    - TR004
  - type: missing-source
    severity: material
    topic: incident-and-sla-history
    missingEvidence: Historical incident log, customer-facing SLA attainment, recall or security-event
      summaries, and postmortem discipline for sovereign or neocloud deployments.
    whyItMatters: The retained public set does not show a recent major outage, but absence of public incident
      reporting is not evidence that operational reliability is already proven at the scale implied by
      current partnerships.
    diligencePath: Request incident reports, uptime metrics, root-cause reviews, and customer escalation
      stats for the last 12-24 months.
    relatedQuestionRefs:
    - QR015
    - QR030
    relatedTableRefs:
    - TR002
