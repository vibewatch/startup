- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence / implication
  - Mitigation / diligence ask
  rows:
  - - AI-first shared data plane
    - WEKA and DDN also sell AI-native performance narratives
    - High
    - Workload overlap is broad across VAST, WEKA, DDN, IBM, and Pure
    - Test win rates by workload class rather than assuming one generalized AI-storage lead
  - - AI Operating System consolidation story
    - Independent analysts say product maturity still lags lakehouse / hyperscaler equivalents
    - High
    - theCUBE treats the AI-OS ambition as ahead of current platform maturity
    - Validate production references for database, vector, and agent-runtime layers, not only storage
  - - Data reduction and efficiency marketing
    - Adverse sources say Flash Reclaim / Amplify claims are overstated and increase lock-in
    - High
    - StorageMath directly attacks VAST’s data-reduction math and lock-in incentives
    - Demand workload-level proofs, not portfolio averages
  - - Hot-data performance and density
    - Hyperscaler and incumbent packaging can still win if “good enough” is cheaper or easier to buy
    - High
    - Cloud substitutes publish pricing while incumbents add STaaS wrappers
    - Benchmark against total workflow cost including idle GPUs and migration, not just raw capacity
  - - Namespace and multi-site control
    - Hammerspace and Qumulo emphasize orchestration and placement more explicitly
    - Medium-High
    - Adjacent challengers can sit beside VAST instead of replacing it outright
    - Check whether VAST can own the control plane, not only the hottest storage tier
  - - Regulated-enterprise credibility
    - Public incumbents and hyperscalers expose broader procurement rails
    - Medium
    - Azure Government procurement language and DDN sovereign-AI messaging make trust a selection axis
    - Map certifications and public-sector buying paths side by side
  - - Installed-base leverage
    - Pure and NetApp can cross-sell into existing accounts
    - High
    - Public incumbents pair broad portfolio coverage with STaaS packaging
    - Quantify displacement inside incumbent-heavy accounts before underwriting expansion
  - - Low switching probability after land
    - Multi-homing and open-source alternatives keep exit paths open
    - Medium-High
    - Ceph, MinIO, cloud filesystems, and orchestration overlays reduce all-or-nothing dependency
    - Interview customers on how much data stays on VAST versus moves to secondary tiers over time
  notes: This register is a judgment layer rather than a benchmark; severity reflects how directly each threat can compress VAST’s differentiation or pricing power.
