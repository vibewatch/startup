  evidenceGaps:
  - type: missing-source
    severity: material
    topic: commercial-terms
    missingEvidence: Customer-level contract minima, discounting bands, and committed-capacity terms for VAST and major named peers.
    whyItMatters: Without realized commercial terms, the pricing table can compare packaging models but not true TCO breakpoints or discount pressure.
    diligencePath: Collect partner quotes, marketplace screenshots, or customer procurement artifacts under NDA and normalize them to throughput, capacity, and term.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: migration-friction
    missingEvidence: Detailed migration case studies or reference calls quantifying re-platform time, application changes, and downtime when leaving VAST, WEKA, or DDN.
    whyItMatters: Switching cost is central to moat durability, but public sources mostly describe product architecture rather than real exit friction.
    diligencePath: Interview reference customers, integrators, and cloud partners that have moved petabyte-scale AI datasets between vendors or back to cloud services.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: compliance-surface
    missingEvidence: A clean, current public mapping of VAST certifications and regulated-workload attestations versus public incumbents and hyperscalers.
    whyItMatters: The current chapter can infer procurement posture from public-cloud and sovereign-AI signals, but not complete certification parity.
    diligencePath: Fetch vendor trust centers, SOC/ISO attestations, FedRAMP or government procurement pages, and map them side by side for regulated buyer workflows.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP002
