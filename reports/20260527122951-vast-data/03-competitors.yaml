company:
  name: VAST Data
chapter:
  number: 3
  title: Competitors
  summary: 'VAST competes in a broad field that includes AI-first performance specialists such as WEKA and DDN, public storage incumbents such as Pure, NetApp, and IBM, orchestration challengers such as Hammerspace and Qumulo, hyperscaler-native file and object substitutes, and open-source internal-build paths such as Ceph and MinIO. The retained evidence says VAST still belongs in the leader set, but its moat is conditional: Pure and NetApp are countering with STaaS packaging and installed-base leverage, Hammerspace attacks VAST on Tier 0 and orchestration, and independent adverse sources question whether VAST’s AI-OS and data-reduction narratives are ahead of current product maturity.'
sections:
- id: landscape
  title: Landscape, Peer Classes, and Substitute Paths
  body: 'VAST’s competitive field is wider than “other flash array companies.” Coldago’s 2025 file-storage maps and StorageNewsletter’s methodology summary place VAST in overlapping enterprise and high-performance storage frames with Pure, NetApp, IBM, DDN, Qumulo, Hammerspace, and WEKA. The direct peer set is therefore AI-first file/object or high-performance data-platform vendors, not just one vendor with a similar appliance shape. The next ring is public-storage incumbents. Pure and NetApp now sell consumption-oriented commercial models on top of broad product portfolios, while IBM still positions Storage Scale as a software-defined AI/HPC and hybrid-data platform. The adjacent ring matters too: Hammerspace and Qumulo push orchestration, global namespace, and hybrid-cloud mobility, which can let a buyer de-emphasize VAST even without copying its DASE architecture. Substitutes are real rather than theoretical. AWS FSx for Lustre, S3, Azure Managed Lustre, and Google Filestore expose usage-based
    pricing, native billing, and existing cloud contracts. Internal-build and status-quo options also persist because Ceph and MinIO can unify key storage semantics without handing more leverage to a single proprietary vendor. The net result is a market where VAST sells into direct product rivalry, incumbent bundling, orchestration alternatives, hyperscaler-native substitutes, and open-source anti-lock-in narratives at the same time.'
