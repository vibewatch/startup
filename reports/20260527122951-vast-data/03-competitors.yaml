  rows:
  - - Pure Storage
    - Public incumbent
    - FY2025 revenue surpassed $3B
    - Enterprises standardizing on file/object and AI data pipelines
    - FlashBlade plus Evergreen//One combine unified file/object storage with as-a-service packaging
    - Incumbent breadth can dilute AI-specific differentiation and pricing remains negotiated
  - - NetApp
    - Public incumbent
    - Public incumbent; retained pages emphasize broad hybrid-cloud portfolio and Keystone STaaS
    - Hybrid-cloud enterprises wanting ONTAP continuity and contract flexibility
    - Unified storage portfolio across on-prem and public cloud with pay-as-you-go Keystone
    - Public list pricing is still limited and product sprawl can weaken a focused AI-performance story
  - - WEKA
    - Direct AI-performance peer
    - $140M Series E at $1.6B valuation; 2026 partner and NVIDIA push
    - AI factories, HPC, and multi-tenant GPU environments
    - Software-defined NeuralMesh architecture focused on AI performance, multi-tenancy, and partner-led AI factories
    - Private-company economics stay partly opaque and broader enterprise distribution is still being built
  - - DDN
    - Direct AI-performance peer
    - Private scale claims include 8/10 leading automotive firms and 7/10 top banking/securities firms
    - AI factories, sovereign AI, hyperscalers, regulated and HPC-heavy accounts
    - Data intelligence platform with Infinia and other AI-focused offerings across inference, sovereign AI, and scale-out workloads
    - Some strongest claims are self-authored and public pricing or capital structure is not refreshed in retained evidence
  - - IBM Storage
    - Public incumbent / software-defined alternative
    - Global public incumbent; Storage Scale System 6000 is NVIDIA-certified and throughput-heavy
    - Regulated enterprises wanting software-defined AI/HPC data services with existing IBM relationships
    - Storage Scale plus Scale System sell file/object unification, content-aware intelligence, and GPU-ready performance
    - IBM’s broader portfolio can slow sharp AI-only messaging and pricing remains quote-led
  - - Hammerspace
    - Adjacent orchestration challenger
    - $100M round at $500M+ valuation; TechCrunch names Meta and DoD as customers
    - GPU-rich environments wanting data locality, orchestration, and hybrid-cloud movement
    - Tier 0 local-NVMe architecture plus global namespace and policy-driven placement
    - Distribution is smaller than incumbents and its most aggressive VAST critiques are competitor-authored
  - - Qumulo
    - Adjacent hybrid-cloud challenger
    - Private; retained pages emphasize NPS, exabyte cloud scale, and managed Azure route rather than refreshed funding
    - File-heavy enterprise and cloud workloads needing global namespace and managed cloud options
    - Modern file/object platform with Cloud Data Fabric, Azure Native managed service, and hybrid-cloud deployment paths
    - Scale, funding, and realized pricing remain less visible than for public incumbents
  - - Hyperscaler-native substitutes
    - Substitute / status-quo extension
    - Existing cloud contracts and published usage constructs
    - Teams already anchored in AWS, Azure, or Google Cloud
    - Managed filesystems and object services with transparent usage billing and native procurement rails
    - Data movement, idle-capacity costs, and performance tuning can still make cloud “cheap” storage expensive in practice
  - - Internal build / open-source
    - Substitute / anti-lock-in path
    - No vendor equity value; economics shift to hardware, labor, and operations
    - Platform teams willing to own storage engineering and integration
    - Ceph and MinIO show unified or exabyte-scale semantics without proprietary vendor lock-in
    - Operational burden, tuning complexity, and slower time-to-value raise execution risk
  notes: Scale/funding cells use only what the retained public corpus exposed; private-company rows preserve when funding, revenue, or pricing remain undisclosed.
