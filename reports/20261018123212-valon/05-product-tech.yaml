    type: stack
    summary: Public evidence suggests ValonOS is organized as a layered servicing platform with customer surfaces, workflow automation, platform services, and shared infrastructure/security controls.
    data:
      layers:
        - label: Customer and operator surfaces
          detail: Homeowner and servicer interfaces that expose servicing workflows and support tasks.
          items:
            - label: Homeowner self-service
              detail: Payments, escrow, insurance, and mortgage assistance surfaces
            - label: End-user dashboards and tools
              detail: Customer-facing features referenced in platform hiring
          outputs:
            - label: Homeowner questions and servicing actions
              detail: Customer interactions processed inside platform controls
        - label: Workflow and AI automation layer
          detail: Structured, programmable workflows that orchestrate servicing processes.
          modules:
            - label: Payments workflow
            - label: Escrow workflow
            - label: Defaults and reporting workflows
            - label: AI agent execution
              detail: Company says agents can act within the system's controls
          outputs:
            - label: Audit-trailed task execution
        - label: Core platform services
          detail: Shared services used across the broader product suite.
          modules:
            - label: System of record
            - label: Notification platform
            - label: Documents platform
            - label: User management
          outputs:
            - label: Unified records, workflows, and task management
        - label: Enterprise deployment layer
          detail: Delivery processes that move customer commitments into live production rollouts.
          modules:
            - label: Customer testing and demo environments
            - label: DeploymentOS
              detail: Internal deployment system mentioned on the about page
          outputs:
            - label: Go-live execution support
        - label: Infrastructure and control plane
          detail: Dedicated platform capabilities supporting scale, security, and engineering productivity.
          modules:
            - label: Compute, storage, and data platforms
            - label: CI/CD and test infrastructure
            - label: Observability and developer tooling
            - label: IAM, logging, and encryption controls
          outputs:
            - label: Secure, scalable multi-tenant operation
        - label: Governance and assurance layer
          detail: Controls and external review processes that support regulated-finance operation.
          modules:
            - label: Security auditors and pentesting partners
            - label: Compliance alignment
              detail: SOC 2, CCPA, NYDFS, and FTC requirements cited in hiring
          outputs:
            - label: Reviewed security posture and policy enforcement
    claimRefs: [CE003, CE004, CE005, CE008, CE010, CE011]
