    columns:
      - Layer / process
      - Public role
      - Evidence
      - Dependency / risk
    rows:
      - ["System of record and workflow state", "Keeps loan history, exceptions, and process context in one platform", "Official materials describe a unified record, workflow, and task-management model", "Correctness requirements are high because mortgage servicing is regulated and operationally stateful"]
      - ["Application and service stack", "Implements user experience and backend business logic", "Company hiring materials name Python, React, Docker, Kubernetes, and GCP; independent coverage also points to Python services on GCP", "Public evidence does not expose architecture diagrams, service boundaries, or data-model detail"]
      - ["Infrastructure and developer platform", "Runs compute, storage, data platforms, CI/CD, test infrastructure, and observability", "Infrastructure leadership hiring explicitly scopes these domains and ties them to rapid platform scale-up", "Execution risk rises with planned 10x scale and limited public SRE/availability metrics"]
      - ["Security and compliance control plane", "Supports tenant security, identity, logging, encryption, and compliance obligations", "Security hiring materials enumerate customer-facing controls and external audit engagement", "Assigned evidence lacks public trust-center, certification, or incident-history artifacts"]
    notes: This table translates public role descriptions into an operating architecture view; where public specifics stop, risks are listed as diligence gaps rather than inferred facts.
    claimRefs: [CE003, CE006, CE007, CE008, CE009, CE010, CE011]
