  evidenceGaps:
    - type: missing-source
      severity: material
      topic: integration-gap
      missingEvidence: Public OpenAPI or equivalent machine-readable contract, versioning policy, and concrete integration implementation guidance for ValonOS.
      whyItMatters: Without machine-readable and versioned integration evidence, diligence cannot reliably estimate external implementation effort or long-term integration maintenance cost.
      diligencePath: Request current API specifications, webhook/event schemas, versioning and deprecation policy, and one recent customer integration architecture pack.
    - type: missing-source
      severity: material
      topic: uptime-and-attestation
      missingEvidence: Public trust-center artifacts, status history, SLA language, or formal security attestations tied to the customer platform.
      whyItMatters: Regulated-finance buyers need proof not only of intended controls but also of operational reliability and independently reviewed security posture.
      diligencePath: Request SOC 2 or equivalent reports, recent pentest summary, status-page history, incident runbooks, and customer-facing security documentation.
    - type: private-evidence-only
      severity: material
      topic: ai-workflows
      missingEvidence: Production metrics for AI-assisted servicing workflows, including override rates, error rates, and workflow-specific service outcomes.
      whyItMatters: The product thesis depends on AI acting inside controlled servicing workflows, but public materials do not quantify how safely or effectively those automations perform at scale.
      diligencePath: Request workflow-level KPI packs for payments, escrow, homeowner support, and exception handling, with pre/post automation comparisons and control-failure escalation data.
