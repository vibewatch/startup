  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: cap-table-and-preferences
      missingEvidence: Current cap table, liquidation preferences, participation rights, insider-secondary terms, and any ratchets or pay-to-play provisions for the 2026 round.
      whyItMatters: These terms determine the effective entry price and downside protection, so the headline post-money valuation is not enough to assess investor economics.
      diligencePath: Request the latest financing documents, cap table, and board-approved security summary in the data room.
      relatedQuestionRefs: [QV006]
    - type: private-evidence-only
      severity: material
      topic: realized-economics
      missingEvidence: Recognized revenue by cohort, ARR-to-revenue conversion, renewal and retention data, software gross margin, implementation services burden, cash burn, and runway.
      whyItMatters: Without these metrics, the investment case cannot distinguish strong bookings optics from durable, efficient software economics.
      diligencePath: Request a monthly KPI pack, cohort bridge, and board reporting on bookings, revenue, gross margin, and liquidity.
      relatedQuestionRefs: [QV003, QV008]
    - type: conflicting-data
      severity: material
