company:
  name: "Valon"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    Valon's highest residual exposures are regulated-servicing outcomes, enterprise
    implementation, and control quality during an AI-enabled scale-up. Public complaint
    counts and one borrower account identify issues to test, but no assigned evidence
    supplies a servicing denominator, independently verified incident rate, customer
    concentration, or cash/runway measure.
sections:
  - id: "risk-ranking"
    title: "Risk ranking and investment implications"
    body: >-
      The most consequential risk is consumer harm from servicing errors because payment,
      escrow, loss-mitigation, and reporting mistakes can combine customer, regulatory, and
      reputational damage. PlainCredit reports 289 CFPB complaints, including 160 in the
      trailing twelve months as of August 14, 2026, and identifies payment-process trouble
      as the largest issue category. Those are raw consumer-filed records rather than
      findings or rates, so they support a high-impact diligence priority but not a failure
      probability. Enterprise migration and AI-control risk rank next: Valon is moving from
      operating its own servicer to deploying ValonOS across large institutions while also
      restricting most new hires' AI use after reported quality problems. Funding improves
      capacity to respond, but a financing round is neither cash currently available nor
      proof that implementations will succeed.
    claimRefs: ["CR003", "CR005", "CR007", "CR008", "CR012", "CR015", "CR016"]
    tableRefs: ["TR001"]
    figureRefs: ["FR001"]
  - id: "regulatory-legal"
    title: "Regulatory and legal exposure"
    body: >-
      Mortgage servicing creates direct exposure to federal and state rules governing
      payment application, loss mitigation, notices of error, credit reporting, escrow,
      foreclosure, privacy, and fair treatment. PlainCredit's profile shows both a growing
      complaint count and a 100% timely-response measure, indicating that intake timeliness
      can coexist with substantive customer disputes. A single JustAnswer account alleges
      that a permanent modification was not applied and that delinquency information
      remained incorrect despite repeated contacts; it is an edited, unverified customer
      narrative and cannot establish a violation. Valon's reposted legal-counsel role says
      the hire would be the third technology-legal team member and would cover commercial,
      AI, data, financial-product, governance, audit, and regulatory work. That breadth is
      evidence of recognized complexity, not evidence that staffing or controls are
      sufficient. Primary regulator records, licenses, examination findings, litigation
      dockets, and sampled response files remain required before underwriting this risk.
    claimRefs: ["CR006", "CR007", "CR008", "CR009", "CR010", "CR011"]
    tableRefs: ["TR002"]
  - id: "operational-controls"
    title: "Operational, quality, and AI-control risk"
    body: >-
      The transition to a software-focused model concentrates execution risk in migrations,
      data integrity, workflow correctness, and change control. Hoodline reports that Valon
      barred most new hires from generative AI until managers judged them able to detect
      errors, after experienced staff reportedly had to repair unchecked output. Engineers
      remained exempt subject to peer review, while finance and human resources reportedly
      lacked comparable guardrails. This is a concrete control response, but also evidence
      that review quality and policy consistency are live operating risks. Carrington says
      the servicing platform uses built-in controls and continuous monitoring, and Valon
      says its records preserve workflow and compliance context. Neither source provides
      independently tested error, uptime, security-incident, model-performance, or migration
      data. Investment approval should therefore depend on control testing, migration
      reconciliations, incident history, and role-specific AI governance rather than policy
      descriptions alone.
    claimRefs: ["CR002", "CR003", "CR004", "CR005", "CR012"]
    tableRefs: ["TR003"]
  - id: "dependencies-and-kill-criteria"
    title: "Partner, financial, and thesis-break triggers"
    body: >-
      Platform scale makes a small number of major servicer deployments strategically
      important. FinTech Global reports Newrez, Carrington, and ServiceMac among institutions
      expected to run ValonOS, but the assigned evidence does not disclose contract terms,
      go-live status by customer, termination rights, implementation economics, or revenue
      concentration. Valon claims more than $200 million of contracted ARR and more than
      $200 billion of mortgages running on ValonOS; these are company figures, not audited
      revenue or independent deployment verification. Multiple outlets report a $150 million
      Series D in October 2026, which supports expansion capacity but does not disclose burn,
      unrestricted cash, runway, or working-capital demands. Thesis-break triggers are a
      material normalized complaint or loss rate, failed migration reconciliations, repeated
      control exceptions without timely remediation, delayed major go-lives, or audited
      contracted ARR and concentration materially weaker than the public claims. Until those
      tests are complete, residual risk remains high enough to require staged underwriting.
    claimRefs: ["CR001", "CR013", "CR014", "CR015", "CR016"]
callouts:
  - calloutType: "recommendation"
    title: "Stage the decision around control and deployment evidence"
    body: >-
      Do not treat funding, contracted ARR, or complaint response speed as substitutes for
      cash availability, live implementation quality, or consumer-outcome evidence. Require
      sampled servicing files, migration reconciliations, control-test results, customer
      concentration, and audited financial data before increasing exposure.
    claimRefs: ["CR007", "CR010", "CR013", "CR014", "CR015", "CR016"]
