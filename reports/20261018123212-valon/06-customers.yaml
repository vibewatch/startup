company:
  name: Valon
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence shows Valon has moved beyond logo marketing into large-servicer
    adoption, with Carrington committing to make ValonOS its core servicing
    platform and Newrez publicly identified as a multi-million-homeowner
    implementation. The proof is strongest on platform adoption and homeowner
    adjunct programs, but materially weaker on retention, renewal, and customer
    concentration disclosures.
sections:
  - id: buyer-segments
    title: Buyer segments shifted from owned servicing to enterprise software
    body: >-
      Valon’s customer story now spans three layers: the legacy servicing book
      it used as an in-house proving ground, enterprise mortgage servicers that
      buy or implement ValonOS, and homeowner-facing partner services that sit
      inside the servicing experience. Valon says it built and operated its own
      servicer to turn payments, escrow, defaults, reporting, and customer
      operations into product decisions before selling that operating business
      to focus on the platform itself. That framing matters because the public
      customer base is no longer primarily end-borrowers paying Valon directly;
      it is large regulated servicers adopting the software, with borrowers
      benefiting through the workflows those servicers expose.
    claimRefs: [CU001, CU004, CU005, CU010, CU014]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Adoption proof is real and increasingly large-scale
    body: >-
      The public record supports a meaningful step-up from internal proof to
      third-party deployment commitments. Forbes reports Valon was servicing
      nearly 600,000 loans by 2025 before it sold the portfolio, while Valon’s
      own current positioning claims $200B+ of mortgages already run on
      ValonOS. The clearest external validation is Carrington: the transaction
      combined an acquisition of roughly 800,000 to 810,000 loans with a
      decision to make ValonOS Carrington’s core servicing platform. Trade
      press also ties Valon to Newrez and ServiceMac, which suggests Valon has
      entered the consideration set for top-tier servicers rather than staying
      confined to its own captive operating environment.
    claimRefs: [CU002, CU003, CU004, CU005, CU006, CU007, CU008, CU013]
    tableRefs: [TU002, TU003]
  - id: durability-and-risk
    title: Durability evidence lags the adoption narrative
    body: >-
      The gap is not whether Valon can name customers; it is whether those
      customers retain, expand, and stay satisfied at scale. Valon’s own site
      cites 90%+ customer satisfaction and $200M+ of contracted ARR in the
      first six months after going to market, but the assigned evidence does
      not disclose GRR, NRR, churn, contract terms, or top-customer revenue
      share. That leaves investors relying on logo and pipeline proof more than
      renewal proof. The adverse signal is also non-trivial: a CFPB-derived
      complaint profile shows mortgage-payment issues dominate complaints and
      complaint volume rose sharply from 2024 to 2025, which increases the need
      to diligence whether platform growth is being accompanied by operational
      reliability and customer support quality.
    claimRefs: [CU011, CU012, CU014, CU015, CU016]
