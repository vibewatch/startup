      - ["AI inside controlled servicing workflows", "Yes; company and financing coverage both center AI agents inside the platform", "No public evidence in assigned pool", "Unknown in assigned pool", "Yes, but typically on a narrower workflow such as customer-service automation"]
      - ["Proof from operating the regulated workflow directly", "Yes; company says it built and ran its own servicer first", "Yes, but through existing operations rather than modern software differentiation", "Potentially yes for the servicer itself", "No equivalent proof shown in the assigned pool"]
      - ["Deployment support for large enterprise migration", "Yes; company frames rollouts as eight- and nine-figure deployments", "Existing baseline already deployed", "Unknown; depends on internal team quality", "Partial; easier on narrow use cases than on core replacement"]
      - ["Public pricing transparency", "Limited; only broad contract-size language is public in assigned evidence", "Unknown", "Unknown", "Unknown in assigned evidence"]
    notes: >-
      "Unknown" means the assigned pool did not provide verifiable public evidence for that cell; it does not imply the capability is absent.
    claimRefs: [CP001, CP002, CP004, CP005, CP009, CP012]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Option
      - Public commercial signal
      - What the assigned evidence shows
      - Unknowns
      - Competitive implication
    rows:
      - ["ValonOS", "Eight- and nine-figure software contracts; Series D capital earmarked for product, deployment, and GTM expansion", "Packaging appears to be enterprise platform replacement plus deployment and adoption support", "No list pricing, discounting, contract term, or module-level packaging", "Competes through enterprise scope and migration credibility rather than transparent self-serve pricing"]
      - ["Point AI overlay", "Vendor choice in the Decagon case rested on deflection rate and customer experience", "Public evidence shows narrow workflow value and faster wedge potential", "No price, contract structure, or breadth of deployment in assigned pool", "Overlay vendors can win budget without requiring a full core migration"]
      - ["Internal build", "No external price list", "Economic tradeoff is control versus time and implementation burden", "No engineering cost, staffing, or maintenance burden disclosed in assigned pool", "Can look cheaper upfront but is hard to underwrite from public evidence"]
      - ["Legacy core + manual workarounds", "No disclosed price in assigned pool", "Economic cost appears in fragmentation, labor intensity, and service-quality issues rather than public list price", "No named vendor pricing or service-level commitments in assigned evidence", "Installed incumbents remain sticky because the alternative's total migration cost is also opaque"]
    notes: This table preserves unknowns instead of inferring pricing from funding or contract-size language; public contract descriptions are not the same thing as realized price or margin.
    claimRefs: [CP004, CP005, CP009, CP012]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: Public evidence places Valon furthest toward broad workflow coverage and operational proof, while the most credible substitutes are partial-overlay or keep-the-core modernization paths.
    data:
      xAxis:
        label: Workflow breadth
        min: 1
        max: 5
        lowLabel: Narrow point workflow
        highLabel: Full servicing operating stack
        description: Ordinal scoring from the assigned evidence only.
        scale: ordinal
      yAxis:
        label: Regulatory and operational proof
        min: 1
        max: 5
        lowLabel: Limited public proof
        highLabel: Operated at production scale
        description: Ordinal scoring from public evidence in the assigned pool only.
        scale: ordinal
      points:
        - label: ValonOS integrated platform
          x: 5
          y: 5
          tone: positive
          detail: Built from operating a servicer first and now sold into major servicers as a system of record plus AI workflow platform.
          claimRefs: [CP002, CP003]
        - label: Legacy core systems
          x: 4
          y: 4
          tone: neutral
          detail: Entrenched baseline with decades of operating proof, but company sources describe fragmented workflows and mainframe-era tooling.
          claimRefs: [CP001, CP012]
        - label: Manual operations and spreadsheets
          x: 1
          y: 3
          tone: risk
          detail: Common substitute because it avoids migration, but it depends on labor-intensive workarounds rather than integrated software.
          claimRefs: [CP001, CP012]
        - label: Internal build on incumbent core
          x: 3
          y: 3
          tone: warning
          detail: Offers local control, but the assigned pool provides no public proof on cost, speed, or implementation success.
          claimRefs: [CP012]
        - label: Point AI overlay vendor
          x: 2
          y: 3
          tone: opportunity
          detail: Narrower scope but credible wedge; Valon's Decagon case shows buyers can solve customer-service pain without immediate full-stack replacement.
          claimRefs: [CP009, CP012]
        - label: Hybrid keep-core plus overlay path
          x: 3
          y: 4
          tone: risk
          detail: Most plausible substitute for risk-averse servicers that want visible automation gains while deferring core migration.
          claimRefs: [CP006, CP009, CP012]
    approximationNotes: Coordinates are ordinal judgments anchored to the assigned public evidence, not source-reported numeric benchmarks.
    claimRefs: [CP002, CP003, CP006, CP009, CP012]
callouts:
  - calloutType: strength
    title: Operating the workflow first is the clearest moat signal
    body: Valon's best-supported differentiator is that it claims to have built and run the servicing workflow before selling the software, which makes its deployment story stronger than a thin feature wedge.
    claimRefs: [CP002, CP003, CP006]
  - calloutType: risk
    title: The likely competitive threat is partial replacement, not pure displacement
    body: The Decagon case shows mortgage servicers can buy narrow AI capability without replacing the system of record, so Valon may win the platform but still cede budget and influence to edge vendors.
    claimRefs: [CP009, CP012]
