  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              可用的市场边界是贷款发放之后的抵押贷款服务：付款、托管、违约、止赎、报告、借款人支持以及审计／合规工作流。Valon
              自己的描述在这里很关键，因为它明确说明平台替代什么；独立报道也强化了同一痛点，而没有把范围扩展到无关的抵押贷款软件类别。现状替代方案是一套老化的服务系统加人工补丁，而不是消费端抵押贷款分发或前端贷款发放工具。这样的框定让市场论点聚焦于受监管运营基础设施：工作流整合、合规逻辑和借款人问题解决速度可以在这里创造企业价值。
            claimRefs:
