      - number: '3.2'
        title: 切换成本、产品组合与分销能力
        blocks:
          - type: paragraph
            body: >-
              Valon 公开可见的主要切入点不是低端价格，而是迁移可信度。公司材料称，它先搭建并运营自己的服务商，再将该业务出售给
              Carrington，如今以这段运营历史向大型服务商销售复杂企业部署。             
              部署岗位说明还将合同描述为八位数和九位数级别的上线项目，由此可见采购周期会很长，需要高管支持，客户承诺后切换成本也很高。相较于窄 AI
              供应商，这种定位对现有系统和人工变通更有优势，因为买方可以在边缘多栖使用，而不必替换核心。Decagon 案例在此很关键：Valon 为客户服务自动化评估了多个供应商，最终依据分流率和客户体验作出选择，也说明
              Valon 自己也可能购买相邻单点方案，而不是对整个技术栈形成全有或全无的垄断。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP008
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP009
              - CP012
      - number: '3.3'
        title: 持久性、信任姿态与替代风险
        blocks:
          - type: paragraph
            body: >-
              护城河论点是：运营验证和工作流广度比一层薄薄的 AI 界面更难复制。HIPTHER 的分析明确认为，竞争考验在于：已在 Valon
              自有服务业务中验证的软件，能否跨服务商运行；其评论还强调，抵押贷款服务自动化仍需要可审计控制、覆盖程序和投诉监控。但同样的信任要求也会带来替代风险。PlainCredit 基于 CFPB
              的摘要标出抵押贷款投诉和付款流程问题；这不能证明存在不当行为，却说明服务质量很快就会成为该品类的竞争变量。如果买方认可 Valon
              是强大的系统记录层，却更愿意为语音、质量保证或文档自动化购买专业覆盖层，公司可能赢得平台，却在边缘失去经济收益。因而本章最大的尽调阻碍并不是抵押贷款服务是否需要现代化，而是当采购、实施和客户服务审查真正展开后，Valon
              能否稳定赢下全栈替换，而不是部分覆盖部署。
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP010
              - CP012
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 先运营工作流是最清晰的护城河信号
            body: Valon 最有证据支持的差异化，在于它声称先搭建并运行服务工作流，再销售软件；相比只有薄功能切入点的产品，这让它的部署叙事更有力度。
            calloutType: strength
            claimRefs:
              - CP002
              - CP003
              - CP006
          - type: callout
            title: 可能的竞争威胁是部分替换，而非纯粹替代
            body: Decagon 案例表明，抵押贷款服务商可以购买窄领域 AI 能力，而不替换系统记录层；因此 Valon 可能赢得平台，却仍把预算和影响力让给边缘供应商。
            calloutType: risk
            claimRefs:
