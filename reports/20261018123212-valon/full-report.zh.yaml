      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Valon 于 2026 年 10 月增加新资本，宣布以 $2.3B 估值完成 $150M D
              轮融资，并称资金将加速产品开发，扩大工程、产品、部署和上市团队招聘。相较于没有融资的​平台扩张，这显然降低了近期融资压力，但没有回答现金余额、月度烧钱、资金续航、债务工具或契约结构等核心投资判断问题。另一个尽调难点是，第三方融资数据库对历史累计融资额存在分歧：Recent
              Funding 记录四轮合计 $343.9M，而 FundedIQ 只记录一轮 $150M。最稳妥的判断是，Valon 近期具备融资渠道，但累计融资历史和当前流动性仍需管理层披露。
