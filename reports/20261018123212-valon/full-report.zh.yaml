  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与替代集合
        blocks:
          - type: paragraph
            body: >-
              指定证据中最清晰的竞争图景是一场品类之争，而不是一份干净的直接竞争者名单。Valon
              一再将抵押贷款服务描述为仍依赖彼此割裂的主机、电子表格、纸张和人工异常处理的行业，因此，现状和内部自建路线与任何现代软件供应商一样，都是有意义的替代方案。这一点很重要，因为服务商无需购买新的系统记录层也能避开
              Valon：它可以继续使用现有栈、增加人力，或在现有核心系统之上部署窄覆盖层。因此，公开证据支持五种实际选择：ValonOS 作为整合式替代方案；旧服务核心加人工变通；在现有系统上自建；单点 AI
              覆盖层；以及保留核心、增加覆盖层的混合方案。来源池不支持的是一份有把握、由来源支撑、包含同类定价和产品细节的直接创业公司竞争矩阵。
