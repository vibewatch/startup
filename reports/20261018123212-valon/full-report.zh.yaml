  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 关键触发因素
    rows:
      - - 乐观
        - 超过 $200M 的签约 ARR 转化为约 $150M–$200M 的高质量经常性收入，大型服务商部署顺利扩张，业务获得公开软件公司的高端倍数。
        - 如果收入实现度接近融资轮的宣传口径，并超过指定可比公司页面显示的公开公司最高 12.2x 倍数，支撑区间约为 $1.8B–$2.4B。
        - 可能，但尚无公开证据证明。
        - 管理层证明收入转化、利润率和续约质量良好。
      - - 基准
        - 最佳公开收入代理指标仍是 Multiples 页面给出的 2025 年估算收入 $86M，市场估值落在披露的公开可比公司 8.5x–12.2x 区间内。
        - 支撑区间约为 $0.7B–$1.1B，当前 $2.3B 的估值因此显得跑在公开基本面支撑之前。
        - 目前最能由公开证据支撑的情景。
        - 尽调弥合估算收入与实际软件经济效益之间的差距。
      - - 悲观
        - 收入转化落后，实施成本高于预期，投诉或诉讼噪音削弱客户采用意愿和退出吸引力。
        - 如果业务最终更接近指定可比公司页面上 nCino 3.9x 的参考倍数等公开软件公司的低端倍数，支撑估值可能降至约 $0.7B 以下。
        - 如果迁移证明失效或服务问题扩大，这一情景可信。
        - 上线延误、投诉趋势恶化或融资轮条款缺乏吸引力。
    notes: 这些区间根据指定公开可比公司倍数、Valon 报出的融资轮估值、Multiples 页面的收入估算和管理层声称的签约 ARR 推导而来，只是方向性敏感性区间。它们不是经审计的公允价值，签约 ARR 也不等于已确认收入。
