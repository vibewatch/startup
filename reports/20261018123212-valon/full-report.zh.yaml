  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与投资含义
        blocks:
          - type: paragraph
            body: >-
              最重要的风险是服务错误造成消费者伤害，因为付款、托管、损失缓解和报告错误可能叠加客户、监管和声誉损害。PlainCredit 报告 289 起 CFPB 投诉，截至 2026 年 8 月 14
              日的过去十二个月中有 160 起，并将付款流程问题列为最大问题类别。这些是消费者自行提交的原始记录，而不是调查结论或比率，因此只能支持高影响尽调优先级，不能支持失败概率。企业迁移和 AI
              控制风险紧随其后：Valon 正从运营自己的服务商转向在大型机构部署 ValonOS，同时在据报道出现质量问题后限制大多数新员工使用
              AI。融资提升了应对能力，但一轮融资既不等于当前可用现金，也不能证明实施会成功。
            claimRefs:
