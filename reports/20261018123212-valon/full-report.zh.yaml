            body: >-
              公开证据支持分层规模化视角，而不是一份干净的自下而上 SAM 或近期 SOM。最宽的一层，Tech Funding News 引用纽约联储数据称美国未偿抵押贷款余额为 $13.1T；Valon 则称服务业务覆盖
              50M 名房主和 $12-13T 贷款。更窄的验证点来自采用和覆盖面：截至 2024 年末，Valon 已服务超过 $65B 抵押贷款；Carrington 披露交易前账簿有超过 998,000
