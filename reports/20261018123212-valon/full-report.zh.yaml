    title: 估值
    sections:
      - number: '8.1'
        title: 当前融资与价格背景
        blocks:
          - type: paragraph
            body: >-
              Valon 有一个真实且当前的融资标记，而不是由传闻驱动的估值故事：公司于 2026 年 10 月 5 日宣布以 $2.3B 估值完成 $150M D
              轮融资，独立报道也重复了这一标题。相同来源包还包含管理层公开提出的最强估值支持理由，即上市六个月内超过 $200M 已签约
              ARR，以及平台覆盖美国每六笔未偿抵押贷款中的一笔。这些是有意义的商业验证点，但仍是部署和合同信号，而不是已披露的确认收入、毛利或现金创造证据。第三方数据库提供了有用背景，却也凸显公开估值支持仍很窄：SetterVC
              警告其公司数据和估值标记可能不完整或过时，而且指定来源没有披露清算优先权、参与条款或其他决定新投资人有效入场价格的结构。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV011
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV009
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: 论点、反论点与价格敏感性
        blocks:
          - type: paragraph
            body: >-
              论点很直接。Valon 似乎在受监管企业软件中做成了少见的事情：先搭建并运营工作流，出售服务部门，再依靠新增长资本和积极招聘，把成型平台带入大型服务商部署。HousingWire 对
              Carrington、ServiceMac 和 Newrez 的报道，比泛泛的金融 AI 叙事更具体地支持客户验证；10 月融资也降低了近期资本压力。反论点同样清楚。指定公开来源仍未展示已实现的 ValonOS
              收入、续约质量、软件毛利率、现金烧钱或资本表优先级；同时，CFPB 关联投诉数量和未解决的抵押贷款服务诉讼仍是可见的不利信号。这使问题变成可投资性问题，而不只是公司质量问题：Valon
              可能正在构建有价值的东西，但公开材料尚未证明 2026 年的标题价格就是合理价格。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV008
              - CV009
              - CV013
              - CV015
              - CV016
      - number: '8.3'
        title: 可比框架与情景敏感性
        blocks:
          - type: paragraph
            body: >-
              指定的唯一直接可比框架来自 Multiples 页面，因此应将其视为方向性参考，而不是完整估值模型。该页面报告 2025 年收入为 $86M，高于 2024 年的 $41M，并列出
              nCino、SoundHound 和 Shenzhen Intellifusion 的公开收入倍数，分别为 3.9 倍、8.5 倍和 12.2 倍。如果这些数字是正确基础，Valon 的 $2.3B 估值对应约
              26.7 倍收入，远高于同页列出的上市公司参考点。唯一明显能把估值拉回当前水平的公开桥梁，是管理层所称超过 2 亿美元的已签约 ARR。即便如此，只有在其中很大一部分 ARR
              转化为持久、高毛利率的确认收入，且市场愿意给出接近公开可比区间顶部的溢价倍数时，发行价才看起来站得住。这个结果可能实现，但当前公开材料没有证明。
            claimRefs:
              - CV003
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 最终判断、尽调问题与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              按今天的公开证据，正确姿态是继续研究，而不是买入。公司拥有足够融资和部署验证，可以继续留在名单上；但已披露经济性和条款清单细节不足，无法有把握地支持以 $2.3B 估值入场。如果管理层证明已签约 ARR
              正以强劲毛利率、干净续约和可控服务负担转化为确认收入，并且 2026
              年融资条款没有造成稀释普通股上行空间的优先股堆叠，判断可以改善。若大型客户迁移延期、投诉量继续上升，或诉讼和服务问题演变成更广泛的运营弱点，判断可能迅速恶化。因此，最低限度的尽调包应包括从合同到确认收入的收入桥接、客户群留存和实施数据、当前现金续航，以及最新轮次完整的优先证券结构。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 融资事件真实，牵引力主张异常强
            body: 有多方印证的 $150M D 轮、超过 $200M 已签约 ARR、美国抵押贷款份额六分之一的主张，以及已点名的大型服务商部署，共同达到“有真实动能的严肃公司”这一门槛。
            calloutType: strength
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
          - type: callout
            title: 公开价格支持仍薄于公开故事支持
            body: 当前估值比其背后的经济性更容易验证。已实现收入、留存、毛利率、烧钱、现金和轮次结构细节仍属私有信息；投诉和诉讼信号也仍未解决。
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV013
              - CV015
          - type: callout
            title: 下一步尽调应是数据室桥接，而不是背书标题价格
            body: 只有在管理层能够把已签约 ARR 桥接到确认收入、展示实施和续约质量，并披露最新轮次优先证券结构时，才应继续推进。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV015
              - CV016
