        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Valon 将自己定位为抵押贷款服务及更广泛受监管金融工作流的 AI 原生操作系统，而非单点解决方案。指定来源中最一致的身份主线，是它作为系统记录层的定位：官方材料称 ValonOS
              统一贷款数据、工作流执行、合规逻辑和资金流转；独立报道也用类似语言，将公司描述为受监管金融的基础设施。这一定位很重要，因为它解释了公司为何先花数年运营持牌服务商，再把软件推向外部市场：Valon
              认为，运营业务为其智能代理积累了所需的本体、控制措施和工作流历史，而 Carrington 交易则把这套运营验证转化为纯 SaaS 战略。
