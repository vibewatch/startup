      - - 反论点：估值支撑仍高度依赖叙事
        - 公开材料没有披露收入质量、烧钱速度、现金或优先权条款，唯一的可比公司页面使用了基于估算的私营公司数据。
        - 用经审计或董事会层面的指标，以及当前股权结构表来增强判断。
      - - 反论点：服务质量噪音可能打击采用和退出
        - 与 CFPB 相关的投诉量和一宗尚未解决的抵押贷款服务案件，显示出可能放缓企业采用或压缩买方意愿的下行信号。
