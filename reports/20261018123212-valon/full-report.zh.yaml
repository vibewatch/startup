        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              公开材料支持一个建设性的收入增长叙事：Valon
              似乎已把原本内部使用的服务技术栈，转化为面向大型企业的软件产品，而且早期已签约规模异常强劲。问题在于，除这个标题级指标外，几乎所有达到投资决策标准的指标仍是私有信息。公开来源没有展示按客户群划分的确认收入、定价机制、软件与服务毛利率、实施转化率、流失率或现金续航。CFPB
              关联投诉数据中还存在不利服务信号，投诉量同比明显上升；这不能证明存在不当行为，但足以要求在把已签约规模等同于持久且高质量收入前，先尽调服务质量和部署执行。
