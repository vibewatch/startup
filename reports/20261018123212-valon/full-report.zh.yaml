          note: 公司报告的签约份额，其中包括尚未完全上线的迁移项目。
          claimRefs:
            - CM008
            - CM009
        - label: 交易完成后 Carrington 的平台范围
          displayValue: ~1.8M
          unit: loans; about $408B UPB
          note: 根据 HousingWire 披露的 998k 笔贷款 / $211B 贷款组合，加上 Valon 800k 笔贷款 / $197B 贷款组合推导。
          claimRefs:
            - CM010
            - CM011
        - label: 历史运营证明点
          displayValue: $65B
          unit: mortgages serviced by Valon in 2024
          note: 来自 HousingWire 对 C 轮融资报道的存量基础证据。
          claimRefs:
            - CM005
        - label: 早期外部变现
          displayValue: $200M+
          unit: contracted ARR in ValonOS's first six months
          note: 来自公司报告的签约收入需求信号，不是市场规模层级。
          claimRefs:
            - CM008
    approximationNotes: 金字塔层级从宽泛的市场底盘排列到更窄的证明点，但混合了余额、家庭、贷款和签约收入；这是一组观察视角，不是转化漏斗或可比单位模型。
    claimRefs:
      - CM002
      - CM005
      - CM007
      - CM008
      - CM010
      - CM011
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 公开证据将 Valon 放在工作流覆盖广度和运营证明最远端；最可信的替代方案则是部分叠加，或保留核心系统的现代化路径。
    data:
      xAxis:
        label: 工作流广度
        min: 1
        max: 5
        lowLabel: Narrow point workflow
        highLabel: Full servicing operating stack
        description: Ordinal scoring from the assigned evidence only.
        scale: ordinal
      yAxis:
        label: 监管与运营证明
        min: 1
        max: 5
        lowLabel: Limited public proof
        highLabel: Operated at production scale
        description: Ordinal scoring from public evidence in the assigned pool only.
        scale: ordinal
      points:
        - label: ValonOS 集成平台
          x: 5
          'y': 5
          tone: positive
          detail: 公司先运营服务商，再将系统卖给大型服务商，形成既是记录系统又是 AI 工作流平台的产品。
          claimRefs:
            - CP002
            - CP003
        - label: 传统核心系统
          x: 4
          'y': 4
          tone: neutral
          detail: 这是拥有数十年运营证明的根深蒂固基线，但公司来源称其工作流碎片化，工具仍处于大型机时代。
          claimRefs:
            - CP001
            - CP012
        - label: 人工运营和电子表格
          x: 1
          'y': 3
          tone: risk
          detail: 这类替代方案常见，因为它能避开迁移；但它依赖劳动密集型变通方案，而不是集成软件。
          claimRefs:
            - CP001
            - CP012
        - label: 基于现有核心系统内部开发
          x: 3
          'y': 3
          tone: warning
          detail: 这种方案提供本地控制，但指定来源池没有公开证据证明其成本、速度或实施成功率。
          claimRefs:
            - CP012
        - label: 单点 AI 叠加供应商
          x: 2
          'y': 3
          tone: opportunity
          detail: 范围更窄，但切入口可信；Valon 的 Decagon 案例显示，买方无需立即替换完整技术栈，也能解决客户服务痛点。
          claimRefs:
            - CP009
            - CP012
        - label: 保留核心系统并叠加的混合路径
          x: 3
          'y': 4
          tone: risk
          detail: 对希望看到自动化收益、又想推迟核心迁移的风险厌恶型服务商而言，这是最可信的替代方案。
          claimRefs:
            - CP006
            - CP009
            - CP012
    approximationNotes: 坐标是基于指定公开证据的序数判断，不是来源报告的数值基准。
    claimRefs:
      - CP002
      - CP003
      - CP006
      - CP009
      - CP012
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开材料描述了一种从工作流走向平台的模式：Valon 先运营服务商，再把这套操作系统产品化，如今通过签约 ARR 变现大型服务商部署，但未披露公开价目表。
    data:
      nodes:
        - id: workflow
          label: 抵押贷款服务工作流
          detail: Valon 试图解决的底层工作流，是传统的抵押贷款服务任务。
        - id: operate
          label: 先运营这套工作流
          detail: Valon 用自有软件搭建并运营了一家持牌服务业务。
        - id: platform
          label: ValonOS 平台
          detail: 该平台统一贷款数据、投资人报告、工作流、合规逻辑和资金流转。
        - id: deploy
          label: 企业服务商部署
          detail: 已点名的机构包括 Newrez、Carrington Mortgage Services 和 ServiceMac。
        - id: scale
          label: 规模代理指标
          detail: 管理层称，在美国尚未偿还的抵押贷款中，每六笔就有一笔已签约使用该平台。
        - id: revenue
          label: 收入信号
          detail: 已披露的商业指标是签约 ARR，六个月内签约金额超过 $200M。
      edges:
        - from: workflow
          to: operate
          label: 通过运营学习
        - from: operate
          to: platform
          label: 产品化
        - from: platform
          to: deploy
          label: 销售给大型服务商
        - from: deploy
          to: scale
          label: 扩大贷款规模
        - from: scale
          to: revenue
          label: 将部署转化为签约 ARR
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI008
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据显示，ValonOS 可能是一套分层的服务平台，由客户与运营界面、工作流自动化、平台服务，以及共享基础设施和安全控制组成。
    data:
      layers:
        - label: 客户与运营界面
          detail: 面向房主和服务商的界面，用于呈现服务工作流并处理支持任务。
          items:
            - label: 房主自助服务
              detail: 付款、托管、保险和抵押贷款援助界面
            - label: 终端用户仪表盘和工具
              detail: 招聘信息中提到的面向客户功能
          outputs:
            - label: Homeowner questions and servicing actions
              detail: Customer interactions processed inside platform controls
        - label: 工作流与 AI 自动化层
          detail: 结构化、可编程的工作流，用于编排服务流程。
          modules:
            - label: 付款工作流
            - label: 托管工作流
            - label: 违约与报告工作流
            - label: AI 代理执行
              detail: 公司称代理可以在系统控制范围内执行操作
          outputs:
            - label: Audit-trailed task execution
        - label: 核心平台服务
          detail: 整个产品套件共用的服务。
          modules:
            - label: 记录系统
            - label: 通知平台
            - label: 文档平台
            - label: 用户管理
          outputs:
            - label: Unified records, workflows, and task management
        - label: 企业部署层
          detail: 将客户承诺转化为生产环境上线的交付流程。
          modules:
            - label: 客户测试和演示环境
            - label: DeploymentOS
              detail: 关于页面提到的内部部署系统
          outputs:
            - label: Go-live execution support
        - label: 基础设施与控制平面
          detail: 支撑规模、安全和工程效率的专用平台能力。
          modules:
            - label: 计算、存储和数据平台
            - label: CI/CD 与测试基础设施
            - label: 可观测性和开发者工具
            - label: IAM、日志和加密控制
          outputs:
            - label: Secure, scalable multi-tenant operation
        - label: 治理与保障层
          detail: 支持受监管金融业务运营的控制措施和外部审查流程。
          modules:
            - label: 安全审计机构和渗透测试合作伙伴
            - label: 合规对齐
              detail: 招聘信息引用 SOC 2、CCPA、NYDFS 和 FTC 要求
          outputs:
            - label: Reviewed security posture and policy enforcement
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE008
      - CE010
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Valon 的客户路径从自有服务商内部的验证场出发，走向企业采用和面向房主的扩展项目。
    data:
      nodes:
        - label: 在自有服务商内部建立证明
          actor: Valon Mortgage
          phase: Proof ground
          tone: neutral
          touchpoints:
            - Nearly 600,000 loans serviced by 2025 before the portfolio sale
            - Historical direct-servicing operation used to validate workflows
        - label: 向大型服务商销售平台
          actor: Mortgage servicing executives and operations teams
          phase: Enterprise sale
          tone: positive
          touchpoints:
            - Valon says $200B+ of mortgages now run on ValonOS
            - Valon says it booked $200M+ of contracted ARR in its first six months on the market
        - label: 拿下旗舰核心平台客户
          actor: Carrington
          phase: Conversion
          tone: positive
          touchpoints:
            - Carrington adopts ValonOS as its core servicing platform
            - Transaction brings roughly 800,000-810,000 loans into the reference base
        - label: 扩展到更多大型服务商
          actor: Newrez and ServiceMac
          phase: Expansion
          tone: positive
          touchpoints:
            - Newrez is expected to transition more than 4 million homeowners in 2027
            - ServiceMac is publicly named as a contracted customer
        - label: 增加面向借款人的服务
          actor: Homeowners
          phase: Experience layer
          tone: opportunity
          touchpoints:
            - Ownwell partnership reports $1.4M+ tax savings across 3,000+ homeowners
            - VIU by HUB partnership adds insurance quotes, renewal alerts, and coverage guidance
        - label: 验证留存和支持质量
          actor: Diligence team
          phase: Risk check
          tone: risk
          touchpoints:
            - No public GRR, NRR, churn, or top-customer share in the assigned evidence
            - CFPB-derived complaint record highlights payment-process issues and rising complaint volume
    claimRefs:
      - CU002
      - CU003
      - CU005
      - CU006
      - CU008
      - CU009
      - CU010
      - CU011
      - CU015
      - CU016
  - id: FR001
    title: 风险热力图：可能性与影响及剩余暴露
    type: matrix
    summary: 定性定位强调影响和控制成熟度；当公开证据缺少分母时，仍保留未量化的可能性。
    data:
      columns:
        - 低或未量化的可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 消费者服务错误
          note: 原始投诉数量缺少贷款分母。
          values:
            - null
            - label: 影响严重；剩余风险高
              tone: negative
              detail: 投诉模式值得逐案测试，但不能据此确立事件率。
            - null
        - label: 企业迁移缺陷
          note: 未指定对账或缺陷率证据。
          values:
            - null
            - label: 影响严重；剩余风险高
              tone: negative
              detail: 大型服务商迁移可能影响数据、付款、合规和 ARR 转化。
            - null
        - label: AI 输出与复核失败
          note: 已报告的政策响应显示正在积极缓解，且此前存在质量问题。
          values:
            - null
            - label: 影响高；剩余风险中高
              tone: warning
              detail: 不同职能的护栏并不相同，公开错误率证据也不可得。
            - null
        - label: 监管变化与法律能力
          note: 广泛的职责范围说明复杂性已被识别，不代表控制措施充分。
          values:
            - null
            - label: 影响高；剩余风险中高
              tone: warning
              detail: 法律覆盖合同、AI、数据、金融产品、治理和审计。
            - null
        - label: 客户与合作伙伴集中度
          note: 已点名的机构是公开信息，但集中度和合同条款并未披露。
          values:
            - label: 影响高；可能性未量化
              tone: warning
              detail: 上线延误或合同变更可能损害规模经济和参考价值。
            - null
            - null
        - label: 资本与现金跑道
          note: 已筹融资不等于可用现金。
          values:
            - label: 影响高；可能性未量化
              tone: warning
              detail: 该轮融资支持扩张，但烧钱速度、现金、跑道和营运资金需求未披露。
            - null
            - null
    approximationNotes: 截至 2026-10-18 的定性分析定位；单元格不代表测量出的概率，未量化的可能性也不等于低可能性。
    claimRefs:
      - CR004
      - CR006
      - CR009
      - CR013
      - CR014
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开判断先从有多方印证的新一轮融资和真实部署信号出发；叠加可比公司敏感性、披露缺口和下行信号后，建议变得更谨慎。
    data:
      nodes:
        - id: round
          label: 新一轮融资
          detail: $150M D 轮融资、$2.3B 估值已获公开信息交叉印证。
        - id: traction
          label: 声称的牵引力
          detail: 管理层称 Valon 在六个月内签下超过 $200M 的签约 ARR。
        - id: deployments
          label: 已点名的部署证明
          detail: Carrington、ServiceMac 和 Newrez 让这一故事比泛泛的 AI 叙事更具体。
        - id: comps
          label: 可比公司敏感性
          detail: 指定的可比公司页面显示，公开公司收入倍数远低于 Valon 隐含的当前倍数。
        - id: disclosure
          label: 缺少经济指标和条款
          detail: 公开来源没有披露实际收入转化、烧钱速度、现金或优先股堆叠。
        - id: downside
          label: 下行信号
          detail: 投诉活动和一宗尚未解决的服务案件，使执行和声誉风险仍然存在。
        - id: decision
          label: 建议
          detail: 继续研究；在尽调补齐缺口前，将当前估值视为昂贵。
      edges:
        - from: round
          to: traction
          label: 确认价格标记
        - from: traction
          to: deployments
          label: 需要客户证明
        - from: deployments
          to: comps
          label: 仍须通过公开估值检验
        - from: comps
          to: disclosure
          label: 需要经济指标桥接
        - from: disclosure
          to: downside
          label: 削弱信心
        - from: downside
          to: decision
          label: 推动谨慎
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV008
      - CV009
      - CV013
      - CV015
      - CV016
