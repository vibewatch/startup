            body: >-
              平台规模意味着少数大型服务商部署具有战略重要性。FinTech Global 报道称，Newrez、Carrington 和 ServiceMac 预计将运行
              ValonOS，但指定证据没有披露合同条款、各客户上线状态、终止权、实施经济性或收入集中度。Valon 声称已有超过 $200M 已签约 ARR、超过 $200B 抵押贷款运行在 ValonOS
              上；这些是公司数字，不是经审计收入或独立部署验证。多家媒体报道 Valon 于 2026 年 10 月完成 $150M D
              轮融资，这支持扩张能力，却没有披露烧钱、非受限现金、资金续航或营运资金需求。论点失效触发器包括标准化投诉或损失率显著恶化、迁移核对失败、控制例外反复出现且未及时修复、主要项目延迟上线，或经审计的已签约 ARR
              和集中度明显弱于公开说法。在这些测试完成前，剩余风险仍高到需要分阶段投资判断。
            claimRefs:
