        title: 采用限制与未解决的尽调缺口
        blocks:
          - type: paragraph
            body: >-
              支持市场论点的同一组证据也限制了它。公开投诉镜像显示，抵押贷款付款流程摩擦是现实的运营痛点，这有助于解释服务商为何需要更好的基础设施；但各镜像对 Valon
              投诉总量的数字存在重大分歧，不应视为精确监管统计。更重要的是，几个关键投资人问题仍未在公开渠道得到回答：Valon 没有按细分披露软件价格、实施成本或公司定义的
              SAM／SOM；最乐观的采用统计是“已签约”，而非完全上线；2024 年公司关于市场扩张的说法只是方向性的，方法透明度不足。市场显然足够大，值得关注，但达到估值级别的规模判断仍需要直接客户和监管证据。
