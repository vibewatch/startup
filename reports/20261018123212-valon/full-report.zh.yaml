        blocks:
          - type: paragraph
            body: >-
              转向软件模式后，执行风险集中在迁移、数据完整性、工作流正确性和变更控制上。Hoodline 报道称，在管理者认为新员工能够识别错误之前，Valon 禁止大多数新员工使用生成式
              AI；据报道，此前有经验员工不得不修复未经检查的输出。工程师可在同行评审约束下豁免，财务和人力资源据报道没有类似护栏。这是具体的控制应对，但也说明评审质量和政策一致性是正在发生的运营风险。Carrington
              称其服务平台使用内置控制和持续监控，Valon
              则称记录保留工作流和合规上下文。两种来源都没有提供独立测试的错误率、正常运行时间、安全事件、模型表现或迁移数据。因此，投资批准应取决于控制测试、迁移核对、事故历史和按岗位划分的 AI 治理，而不能只看政策描述。
