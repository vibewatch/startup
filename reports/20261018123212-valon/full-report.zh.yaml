      - number: '1.3'
        title: 资本、规模与披露质量
        blocks:
          - type: paragraph
            body: >-
              2026 年 10 月融资是本章最干净的已确认数据点：官方和独立来源都指向 $150M D 轮、$2.3B 估值。除此之外，披露质量明显下降。Valon 称，自 ValonOS 上市后的六个月内已签下超过
              $200M 亿美元的已签约 ARR，并称美国每六笔抵押贷款中就有一笔签约使用该平台；但这些仍是公司报告的商业化指标，不是经审计收入或已披露客户数。第三方规模画像也存在明显分歧：Forbes 报道截至 2026 年
              2 月有 469 名员工、融资 $275M，而 FundedIQ 后来只显示 101–250 名员工，并且记录中仅有已披露的 $150M D 轮。更合理的判断是，Valon
              很可能已经具备真实规模，但若要把若干覆盖指标视为已确定的尽调事实，仍需管理层数据室确认。
