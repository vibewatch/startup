      - number: '2.3'
        title: 买方、预算负责人和采用路径
        blocks:
          - type: paragraph
            body: >-
              现有买方证据指向高端市场。公开面试准备材料称，Valon 向大型金融机构、抵押贷款发起方和机构投资者销售复杂企业软件及服务解决方案，销售周期为六至十二个月，并需要安全、监管和技术审查。结合独立报道中的
              Carrington 和 Rithm
              式企业验证，真正的买方似乎不是借款人，而是大型抵押贷款平台内部的高级服务、运营、合规和技术组织。因此，采用取决于高管支持、迁移容忍度，以及愿意用实施风险替换旧系统运营风险的预算负责人。
