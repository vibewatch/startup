  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围之所以广，是因为 Valon 从服务运营内部向外构建
        blocks:
          - type: paragraph
            body: >
              Valon
              的核心产品论断并不是在现有抵押贷款系统上增加一层薄工作流，而是围绕统一操作系统重建服务业务。公司材料称，平台是在运营抵押贷款服务商时开发的：先把付款、托管、违约、报告、审计和客户运营转化为产品要求，再将成型系统商业化，服务第三方服务商。这一源头使其模块图比单一功能供应商通常提供的更广：Valon
              将 ValonOS
              描述为覆盖系统记录、工作流和任务管理的统一平台；当前招聘材料还列出通知、文档和用户管理等常见平台域。因此，产品看起来是为受监管服务工作流打造的可配置运营层，而不仅是面向借款人的应用。剩余尽调缺口在于可移植性：公开材料明确了“靠运营工作来构建”的论点，但对这些模块能否稳定迁移到异构企业服务商环境，外部证据较少。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
