        title: 安全姿态正在被明确建设，但公开运营风险证据好坏参半
        blocks:
          - type: paragraph
            body: >
              Valon 正把产品安全作为一等产品职能来建设，而不是把合规当作后台补丁。当前安全岗位材料描述了一套多租户 SaaS
              平台，明确列出面向客户的身份验证、授权、身份集成、访问控制、审计日志和加密／密钥管理控制，并将这些工作与外部审计师、渗透测试公司及 SOC 2、CCPA、NYDFS 和 FTC
              等框架联系起来。对受监管金融平台而言，这些披露方向积极。需要谨慎的是，公开验证仍落后于控制叙事的广度：指定证据没有公开信任中心、状态历史、正式鉴证或事故复盘资料库。另有与 CFPB
              记录相关的独立投诉画像显示，抵押贷款投诉量不低，且付款流程摩擦是主要问题类别；这不能证明产品失败，但确实提高了对生产服务环境中工作流正确性、支持运营和实施质量的尽调要求。
