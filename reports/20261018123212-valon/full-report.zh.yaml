        title: 变现与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              指定来源没有披露挂牌价格、合同结构、折扣或已实现 ASP，因此公开变现分析只能依赖代理指标，而不能依赖一份干净的 SaaS 定价表。披露得最具体的经济性，是 Valon
              在把平台外部化前搭建的服务业务历史运营指标：公司 About 页面强调 60%+ 运营利润率，以及相较现有服务商每名员工多处理 5 倍贷款；第三方对创始人访谈的总结则称，该历史服务业务的效率约为 3
              倍、运营利润率为 70–80%。这些数据点说明流程杠杆和更好的工作流经济性，但不能替代当前 ValonOS 软件毛利率、部署服务负担、CAC 或回本期。
