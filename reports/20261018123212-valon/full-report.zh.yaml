      - number: '7.2'
        title: 监管与法律风险敞口
        blocks:
          - type: paragraph
            body: >-
              抵押贷款服务直接暴露于联邦和州层面的规则，包括付款处理、损失缓解、错误通知、信用报告、托管、止赎、隐私和公平对待。PlainCredit 的画像同时显示投诉数增长和 100%
              按时响应率，说明受理及时与实质性客户争议可以并存。一条 JustAnswer 账户声称永久性修改没有执行，尽管多次联系，逾期信息仍然不正确；这是经过编辑且未经核实的客户叙述，不能证明违规。Valon
              转发的一则法律顾问岗位信息称，该职位将成为第三名技术法律团队成员，负责商业、AI、数据、金融产品、治理、审计和监管工作。这种广度说明公司认识到复杂性，并不能证明人员或控制措施已经足够。在对这一风险作投资判断前，仍需主要监管机构记录、牌照、检查结论、诉讼案卷和抽样回复文件。
