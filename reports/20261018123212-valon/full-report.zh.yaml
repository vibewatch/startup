companyProfile:
  summary: >-
    Valon 是一家 AI 原生抵押贷款服务软件公司。它先运营受监管的服务商，借此搭建并验证运营模式，随后出售该业务，转而专注于 ValonOS。当前公开记录指向一家真实的企业软件公司：大型服务商正在采用其产品，公司也刚完成 2026
    年融资；但 Valon 仍未完整披露确切客户数、现金与资金续航，或一份可核对的累计融资台账。
