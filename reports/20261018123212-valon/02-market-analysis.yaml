        - Origination software, consumer lead gen, brokerage distribution
        - Large servicers and servicing-platform owners
        - Direct fit with Valon's stated platform scope
      - - Government servicing specialization
        - Ginnie Mae, FHA/VA workflow, agency reporting, loss mitigation
        - Generic mortgage SaaS without government-servicing depth
        - Government-servicing operators and compliance teams
        - Carrington coverage highlights the hardest operational corner
      - - Adjacent home-loan servicing extensions
        - Conventional servicing and HELOC support inside the servicing stack
        - Unrelated personal-finance products
        - Existing servicing operators broadening product mix
        - Public deal coverage shows mixed loan types beyond Ginnie
      - - Longer-term regulated-finance adjacency
        - Other complex, regulated workflows Valon says could share the same system design
        - Immediate proof in non-mortgage verticals
        - Future enterprise buyers in adjacent debt categories
        - Strategically relevant but not yet a proven near-term market
    notes: >-
      Boundary table separates the mortgage-servicing operating system from
      adjacent categories; later adjacency rows are directional, not validated
      revenue pools.
