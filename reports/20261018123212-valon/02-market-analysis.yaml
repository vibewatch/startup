figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Public evidence supports a layered market lens from the full U.S.
      mortgage-servicing substrate down to Valon's live and contracted
      enterprise proof points.
    data:
      items:
        - label: U.S. mortgage-balance base
          displayValue: $13.1T
          unit: outstanding mortgage balances (end of Q2 2026)
          note: Tech Funding News cites the New York Fed for this top-of-funnel market substrate.
          claimRefs:
            - CM007
        - label: Homeowners touched by servicing
          displayValue: 50M
          unit: homeowners; company also cites $12-13T in loans
          note: Company framing of the workflow universe, not a software-spend estimate.
          claimRefs:
            - CM002
        - label: Contracted ValonOS penetration
          displayValue: 1 in 6
          unit: U.S. mortgages under contract
          note: Company-reported contracted share; includes migrations not yet fully live.
          claimRefs:
            - CM008
            - CM009
        - label: Carrington post-deal platform scope
          displayValue: ~1.8M
          unit: loans; about $408B UPB
          note: Derived from HousingWire's 998k-loan/$211B book plus the 800k-loan/$197B Valon portfolio.
          claimRefs:
            - CM010
            - CM011
        - label: Historical operating proof point
          displayValue: $65B
          unit: mortgages serviced by Valon in 2024
          note: Installed-base evidence from HousingWire's Series C coverage.
          claimRefs:
            - CM005
        - label: Early external monetization
          displayValue: $200M+
          unit: contracted ARR in ValonOS's first six months
          note: Demand signal from company-reported contracted revenue, not a market-size layer.
          claimRefs:
            - CM008
    approximationNotes: >-
      Pyramid layers are ordered from broad market substrate toward narrower
      proof points, but they mix balances, households, loans, and contracted
      revenue; the visual is a lens stack, not a conversion funnel or
      comparable-unit model.
    claimRefs:
      - CM002
      - CM005
      - CM007
      - CM008
      - CM010
      - CM011
