chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Valon's public materials and independent coverage define the core market as
    mortgage-servicing infrastructure: a large, regulated workflow set still
    dominated by legacy systems rather than a generic fintech TAM. The strongest
    sizing lenses are not clean TAM/SAM/SOM cuts but a stack of operating
    proxies, from the $13.1 trillion U.S. mortgage-balance base to large
    enterprise adoption proofs such as Carrington's roughly 1.8 million-loan
    combined servicing footprint. Buyer evidence points to large servicers and
    financial institutions with slow, compliance-heavy purchase cycles, while
    complaint data and inconsistent third-party counts show that trust,
    migration execution, and public market transparency remain real constraints.
sections:
  - id: market-boundary
    title: Market boundary and status-quo substitute
    body: >-
      The usable market boundary is mortgage servicing after origination:
      payments, escrow, defaults, foreclosures, reporting, borrower support, and
      audit/compliance workflows. Valon's own description matters here because
      it is specific about what the platform replaces, and independent reporting
      reinforces the same pain pattern rather than broadening the scope into
      unrelated mortgage software categories. The status-quo substitute is a
      stack of aging servicing systems and manual overlays, not consumer
      mortgage distribution or front-end origination tools. That framing keeps
      the market thesis focused on regulated operating infrastructure where
      workflow consolidation, compliance logic, and borrower resolution speed
      create enterprise value.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM016
    tableRefs:
      - TM001
  - id: sizing-lenses
    title: Evidence-constrained sizing lenses
    body: >-
      Public evidence supports a layered sizing view, not a clean bottoms-up
      SAM or near-term SOM. At the broadest layer, Tech Funding News cites the
      New York Fed's $13.1 trillion of outstanding U.S. mortgage balances, and
      Valon frames servicing as touching 50 million homeowners and $12-13
      trillion in loans. The narrower proof points are adoption and footprint
      lenses: Valon had serviced more than $65 billion of mortgages by late
      2024, Carrington disclosed a pre-deal book of more than 998,000 loans and
      $211 billion of UPB, and the Valon transaction adds roughly 800,000 loans
      and $197 billion of UPB. Those figures indicate that even the initial
      beachhead sits inside very large servicing books, but they still do not
      reveal software-spend economics or a public Valon-defined SAM.
    claimRefs:
      - CM002
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
      - CM011
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyer-map
    title: Buyers, budget owners, and adoption path
    body: >-
      The available buyer evidence points up-market. Public interview-prep
      material describes Valon selling complex enterprise software and servicing
      solutions to major financial institutions, mortgage originators, and
      institutional investors, with sales cycles that run six to twelve months
      and require security, regulatory, and technical review. Combined with the
      Carrington and Rithm-style enterprise proofs in independent reporting,
      that suggests the real buyer is not the borrower but the senior servicing,
      operations, compliance, and technology organization inside a large
      mortgage platform. Adoption therefore depends on executive sponsorship,
      migration tolerance, and a budget owner willing to swap legacy operating
      risk for implementation risk.
    claimRefs:
      - CM009
      - CM012
      - CM013
      - CM016
    tableRefs:
      - TM003
  - id: constraints-and-gaps
    title: Adoption constraints and unresolved diligence gaps
    body: >-
      The same evidence that supports the market thesis also limits it. Public
      complaint mirrors suggest mortgage payment-process friction is a real
      operating pain point, which helps explain why servicers need better
      infrastructure, but the mirrors disagree materially on Valon's complaint
      totals and should not be treated as precise regulatory counts. More
      importantly, several key investor questions remain unanswered in public:
      Valon does not disclose software pricing, implementation cost, or a
      company-defined SAM/SOM by segment; the most bullish adoption statistic is
      "under contract" rather than fully live; and the market-expansion claim
      from 2024 is directional rather than methodologically transparent. The
      market is clearly large enough to matter, but valuation-grade sizing still
      needs direct customer and regulatory evidence.
    claimRefs:
      - CM006
      - CM008
      - CM009
      - CM013
      - CM014
      - CM015
