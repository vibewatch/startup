  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Large independent mortgage servicers
        - CEO / COO / head of servicing
        - Servicing operations, compliance, borrower-support teams
        - Servicing P&L and core-tech budget
        - Core system of record for payments, escrow, reporting, and exceptions
        - Operations plus enterprise technology leadership
        - Replace fragmented legacy servicing stack
      - - Government-servicing specialists
        - Head of government servicing
        - FHA/VA/Ginnie servicing and loss-mitigation teams
        - Compliance and servicing operations budget
        - Agency reporting, borrower-assistance, default workflows
        - Senior servicing and compliance executives
        - Rising complexity and manual oversight in government portfolios
      - - Mortgage originators / financial institutions entering servicing
        - Enterprise platform or servicing sponsor
        - Product, implementation, and servicing-transition teams
        - Platform-transformation budget
        - Migration from legacy infrastructure into a unified servicing platform
        - Transformation office or CIO/COO
        - Need to improve scale, auditability, and resolution speed
      - - Institutional investors with servicing exposure
        - Strategic platform partner / asset manager sponsor
        - Oversight teams coordinating with servicers
        - Portfolio-operations budget or sponsored platform spend
        - Oversight of outsourced or partnered servicing operations
        - Senior sponsor working with servicing counterparties
        - Better transparency and operating control across asset-backed books
    notes: >-
      Buyer map is inferred from public enterprise-sales material and named
