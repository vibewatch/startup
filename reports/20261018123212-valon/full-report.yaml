      - number: '5.3'
        title: Security posture is being staffed explicitly, but public operating-risk evidence is mixed
        blocks:
          - type: paragraph
            body: >
              Valon is staffing product security as a first-order product function rather than treating compliance as a
              back-office overlay. Current security-role materials describe a multi-tenant SaaS platform with explicit
              customer-facing controls for authentication, authorization, identity integration, access controls, audit
              logging, and encryption/key management, and they tie that work to external auditors, pentesting firms, and
              frameworks such as SOC 2, CCPA, NYDFS, and FTC expectations. Those disclosures are directionally positive
              for a regulated-finance platform. The caution is that public proof still lags the breadth of the control
              narrative: the assigned evidence set does not include a public trust center, status history, formal
              attestations, or incident-postmortem corpus. Separately, independent complaint-profile data tied to CFPB
              records shows a meaningful volume of mortgage complaints and identifies payment-process friction as the
              leading issue category, which does not prove product failure but does raise the bar for diligence on
              workflow correctness, support operations, and implementation quality in production servicing environments.
            claimRefs:
              - CE010
              - CE011
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The strongest product differentiator is operating-history embedded in the software
            body: >-
              Valon’s materials consistently frame ValonOS as software learned by running a servicer, and the current
              hiring mix suggests the company is investing in platform, infrastructure, and security capabilities around
              that operating core rather than only shipping isolated features.
            calloutType: insight
            claimRefs:
