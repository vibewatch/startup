              - CU003
              - CU005
              - CU006
              - CU008
              - CU009
              - CU010
              - CU011
              - CU015
              - CU016
      - number: '6.2'
        title: Adoption proof is real and increasingly large-scale
        blocks:
          - type: paragraph
            body: >-
              The public record supports a meaningful step-up from internal proof to third-party deployment commitments.
              Forbes reports Valon was servicing nearly 600,000 loans by 2025 before it sold the portfolio, while
              Valon’s own current positioning claims $200B+ of mortgages already run on ValonOS. The clearest external
              validation is Carrington: the transaction combined an acquisition of roughly 800,000 to 810,000 loans with
              a decision to make ValonOS Carrington’s core servicing platform. Trade press also ties Valon to Newrez and
              ServiceMac, which suggests Valon has entered the consideration set for top-tier servicers rather than
              staying confined to its own captive operating environment.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU013
          - type: table
            tableRef: TU002
