      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Valon added fresh capital in October 2026, announcing a $150 million Series D at a $2.3 billion valuation
              and saying the proceeds will accelerate product development and expand engineering, product, deployment,
              and go-to-market hiring. That clearly lowers near-term financing pressure relative to an unfunded platform
              rollout, but it does not answer the core underwriting questions around cash on hand, monthly burn, runway,
              debt facilities, or covenant structure. A further diligence wrinkle is that third-party funding databases
              disagree on total historical capital raised: Recent Funding records four rounds totaling $343.9 million,
              while FundedIQ records only one $150 million round. The safest view is that Valon has recent access to
              capital, but cumulative financing history and present liquidity still need management disclosure.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI012
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The public package supports a constructive top-line demand narrative: Valon appears to have converted a
              historically internal servicing stack into a large-enterprise software offering with unusually strong
              early contracted volume. The underwriting problem is that almost every decision-grade metric below that
              headline remains private. Public sources do not show recognized revenue by cohort, pricing mechanics,
              software versus services gross margin, implementation conversion rates, churn, or cash runway. An adverse
              servicing signal also exists in CFPB-linked complaint data, where complaint volume rose meaningfully year
              over year; that does not prove misconduct, but it does argue for diligence on service quality and
              deployment execution before treating contracted scale as equivalent to durable, high-quality revenue.
            claimRefs:
