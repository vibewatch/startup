      - number: '2.3'
        title: Buyers, budget owners, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The available buyer evidence points up-market. Public interview-prep material describes Valon selling
              complex enterprise software and servicing solutions to major financial institutions, mortgage originators,
              and institutional investors, with sales cycles that run six to twelve months and require security,
              regulatory, and technical review. Combined with the Carrington and Rithm-style enterprise proofs in
              independent reporting, that suggests the real buyer is not the borrower but the senior servicing,
              operations, compliance, and technology organization inside a large mortgage platform. Adoption therefore
              depends on executive sponsorship, migration tolerance, and a budget owner willing to swap legacy operating
              risk for implementation risk.
            claimRefs:
