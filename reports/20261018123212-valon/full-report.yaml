  - id: FR001
    title: 'Risk heatmap: likelihood versus impact and residual exposure'
    type: matrix
    summary: >-
      Qualitative placement emphasizes impact and control maturity while preserving unquantified likelihood where the
      public evidence lacks denominators.
    data:
      columns:
        - Low or unquantified likelihood
        - Medium likelihood
        - High likelihood
      rows:
        - label: Consumer servicing errors
          note: Raw complaint counts lack a loan denominator.
          values:
            - null
            - label: Critical impact; high residual
              tone: negative
              detail: Complaint pattern warrants file-level testing; it does not establish an incident rate.
            - null
        - label: Enterprise migration defects
          note: No reconciliation or defect-rate evidence was assigned.
          values:
            - null
            - label: Critical impact; high residual
              tone: negative
              detail: Large-servicer migrations can affect data, payments, compliance, and ARR conversion.
            - null
        - label: AI output and review failures
          note: Reported policy response shows active mitigation and a prior quality concern.
          values:
            - null
            - label: High impact; medium-high residual
              tone: warning
              detail: Guardrails differ by function and public error-rate evidence is unavailable.
            - null
        - label: Regulatory change and legal capacity
          note: Broad role scope indicates recognized complexity, not control sufficiency.
          values:
            - null
            - label: High impact; medium-high residual
              tone: warning
              detail: Legal coverage spans contracts, AI, data, financial products, governance, and audits.
            - null
        - label: Customer and partner concentration
          note: Named institutions are public, but concentration and contract terms are not.
          values:
            - label: High impact; likelihood unquantified
              tone: warning
              detail: Go-live delays or contract changes could impair scale economics and reference value.
            - null
            - null
        - label: Capital and runway
          note: Funding raised is not cash available.
          values:
            - label: High impact; likelihood unquantified
              tone: warning
              detail: The round supports expansion, but burn, cash, runway, and working-capital needs are undisclosed.
            - null
            - null
    approximationNotes: >-
      Qualitative analytical placement as of 2026-10-18; cells do not represent measured probabilities, and unquantified
      likelihood is not equivalent to low likelihood.
