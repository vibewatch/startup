  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope is broad because Valon built from servicing operations inward
        blocks:
          - type: paragraph
            body: >
              Valon’s core product claim is not that it adds a thin workflow layer to incumbent mortgage systems, but
              that it rebuilt servicing around a unified operating system. Company materials say the platform was
              developed by running a mortgage servicer and turning payments, escrow, defaults, reporting, audits, and
              customer operations into product requirements before commercializing the resulting system for third-party
              servicers. That origin matters because it supports a broader module map than a single-feature vendor would
              typically expose: Valon describes ValonOS as a unified platform spanning system of record, workflows, and
              task management, while current hiring materials also name common platform domains such as notification,
              documents, and user-management services. The product therefore appears to be designed as a configurable
              operating layer for regulated servicing workflows, not only a borrower-facing app. The remaining diligence
              gap is portability: public materials make the “built by operating the work” thesis clear, but they provide
              less external proof on how consistently those modules transfer into heterogeneous enterprise-servicer
              environments.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
