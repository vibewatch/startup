      - number: '3.2'
        title: Switching costs, packaging, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Valon's main publicly visible wedge is not low-end pricing; it is migration credibility. Company-issued
              materials say it built and ran its own servicer, sold that operation to Carrington, and now uses that
              operating history to sell complex enterprise deployments into major servicers. The deployment job posting
              further characterizes the contracts as eight- and nine-figure rollouts, which implies long buying cycles,
              executive sponsorship, and significant switching costs once a customer commits. That positioning is
              stronger against incumbents and manual workarounds than against narrow AI vendors, because buyers can
              multi-home around the edges instead of replacing the core. The Decagon case study is important here: Valon
              evaluated multiple vendors for customer-service automation and chose one based on deflection and customer
              experience, showing that Valon itself can be a buyer of adjacent point solutions rather than an
              all-or-nothing monopoly over the stack.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP008
              - CP009
          - type: table
            tableRef: TP003
