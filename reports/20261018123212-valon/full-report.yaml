      - number: '1.3'
        title: Capital, scale, and disclosure quality
        blocks:
          - type: paragraph
            body: >-
              The October 2026 financing is the cleanest confirmed data point in this chapter: official and independent
              sources all point to a $150 million Series D at a $2.3 billion valuation. Beyond that, the disclosure
              picture gets weaker. Valon says it signed more than $200 million in contracted ARR within six months of
              taking ValonOS to market and that one in six U.S. mortgages is contracted to run on the platform, but
              those remain company-reported commercialization metrics rather than audited revenue or disclosed
              customer-count data. Third-party scale profiles also diverge materially: Forbes reported 469 employees and
              $275 million of funding as of February 2026, while FundedIQ later showed only a 101-250 employee band and
              just the disclosed $150 million Series D on record. The right read is that Valon likely has real scale,
              but several cover metrics still need management-room confirmation before they can be treated as settled
              diligence facts.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO015
      - number: '1.4'
        title: Milestones and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The milestone path in the assigned evidence is directionally coherent even where the exact historical
              funding ledger is thin: the company was founded in 2019, raised private rounds before its 2026 Series D,
              built servicing scale internally, then sold the servicing business to Carrington while keeping the
              operating system. That sequence supports the core narrative that Valon de-risked its product by using it
              inside a regulated operator first. The adverse evidence is not existential, but it is real enough to keep
              in frame. A complaint aggregator built from the CFPB record shows rising mortgage-related complaint volume
              and a concentration around payment-process issues. That does not prove misconduct or normalize for
              servicing volume, yet it does show that customer-friction signals rose at the same time the company was
              scaling its servicing footprint and platform rollout.
