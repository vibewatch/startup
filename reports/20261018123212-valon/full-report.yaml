        title: Public signals indicate a modern cloud architecture plus a dedicated infrastructure roadmap
        blocks:
          - type: paragraph
            body: >
              The most concrete technical signals come from engineering and infrastructure hiring, supplemented by one
              independent engineering guide and an independent developer-surface profile. Company-authored engineering
              materials name Python, React, Docker, Kubernetes, and Google Cloud Platform, while independent reporting
              also characterizes the backend as Python services on GCP handling high-throughput transaction streams.
              Separate infrastructure hiring points to a maturing platform organization that owns compute, storage, data
              platforms, CI/CD, test infrastructure, observability, and developer productivity, which is consistent with
              a system intended to become a core operating platform for major servicers rather than a narrow workflow
              add-on. Independent APIs.io evidence also shows a real external developer surface — documentation, API
              reference, a CLI, and an MCP listing — but it simultaneously notes that create/update ergonomics could not
              be measured because no machine-readable contract was available. That combination suggests meaningful
              product depth and some integration ambition, yet still leaves technical diligence open on API
              completeness, versioning discipline, and implementation burden for enterprise customers.
