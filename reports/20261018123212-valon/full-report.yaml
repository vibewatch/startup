  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public materials describe a workflow-to-platform model in which Valon first operated a servicer, productized that
      operating system, and now monetizes large-servicer deployments through contracted ARR rather than disclosed public
      price cards.
    data:
      nodes:
        - id: workflow
          label: Mortgage-servicing workflows
          detail: Legacy mortgage-servicing tasks are the underlying workflow Valon targets.
        - id: operate
          label: Operate the workflow first
          detail: Valon built and ran a licensed servicing business on its own software.
        - id: platform
          label: ValonOS platform
          detail: The platform unifies loan data, investor reporting, workflows, compliance logic, and money movement.
        - id: deploy
          label: Enterprise servicer deployments
          detail: Named institutions include Newrez, Carrington Mortgage Services, and ServiceMac.
        - id: scale
          label: Scale proxy
          detail: Management says one in six outstanding U.S. mortgages is under contract to run on the platform.
        - id: revenue
          label: Revenue signal
          detail: The disclosed commercial metric is contracted ARR, with more than $200M signed within six months.
