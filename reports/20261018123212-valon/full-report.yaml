          - type: callout
            title: Public integration and reliability proof is thinner than the architecture narrative
            body: >-
              The developer surface is real, but the assigned evidence does not include a public machine-readable
              contract, uptime history, or formal public attestations, while complaint data indicates that
              payment-process friction deserves technical and operational diligence.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer segments shifted from owned servicing to enterprise software
        blocks:
          - type: paragraph
            body: >-
              Valon’s customer story now spans three layers: the legacy servicing book it used as an in-house proving
              ground, enterprise mortgage servicers that buy or implement ValonOS, and homeowner-facing partner services
              that sit inside the servicing experience. Valon says it built and operated its own servicer to turn
              payments, escrow, defaults, reporting, and customer operations into product decisions before selling that
              operating business to focus on the platform itself. That framing matters because the public customer base
              is no longer primarily end-borrowers paying Valon directly; it is large regulated servicers adopting the
              software, with borrowers benefiting through the workflows those servicers expose.
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU010
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU009
              - CU010
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
