chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Valon presents itself as an AI-native operating system for mortgage servicing and broader
              regulated-finance workflows rather than as a point solution. The strongest identity thread across the
              assigned sources is the system-of-record position: official materials describe ValonOS as the layer that
              unifies loan data, workflow execution, compliance logic, and money movement, while independent coverage
              uses similar language to frame the company as infrastructure for regulated finance. That positioning
              matters because it explains why the company spent years operating a licensed servicer before pushing the
              software externally: Valon argues the operating business created the ontology, controls, and workflow
              history its agents now rely on, and the Carrington transaction turned that operating proof into a pure
              SaaS focus.
