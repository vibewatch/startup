  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitute
        blocks:
          - type: paragraph
            body: >-
              The usable market boundary is mortgage servicing after origination: payments, escrow, defaults,
              foreclosures, reporting, borrower support, and audit/compliance workflows. Valon's own description matters
              here because it is specific about what the platform replaces, and independent reporting reinforces the
              same pain pattern rather than broadening the scope into unrelated mortgage software categories. The
              status-quo substitute is a stack of aging servicing systems and manual overlays, not consumer mortgage
              distribution or front-end origination tools. That framing keeps the market thesis focused on regulated
              operating infrastructure where workflow consolidation, compliance logic, and borrower resolution speed
              create enterprise value.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a layered sizing view, not a clean bottoms-up SAM or near-term SOM. At the
              broadest layer, Tech Funding News cites the New York Fed's $13.1 trillion of outstanding U.S. mortgage
              balances, and Valon frames servicing as touching 50 million homeowners and $12-13 trillion in loans. The
              narrower proof points are adoption and footprint lenses: Valon had serviced more than $65 billion of
              mortgages by late 2024, Carrington disclosed a pre-deal book of more than 998,000 loans and $211 billion
              of UPB, and the Valon transaction adds roughly 800,000 loans and $197 billion of UPB. Those figures
              indicate that even the initial beachhead sits inside very large servicing books, but they still do not
              reveal software-spend economics or a public Valon-defined SAM.
            claimRefs:
              - CM002
