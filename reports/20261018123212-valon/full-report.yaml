          deployments expand cleanly, and the business earns a top-end public-software multiple.
        - >-
          Rough support band of about $1.8B-$2.4B if revenue realization approaches the round headline and clears near
          the 12.2x top public multiple shown on the assigned comp page.
        - Possible, but not yet proven by public evidence.
        - Management proves revenue conversion, margins, and clean renewals.
      - - Base
        - >-
          The best public revenue proxy remains the Multiples page's $86M 2025 estimate and the market clears within the
          disclosed 8.5x-12.2x public comp band.
        - >-
          Rough support band of about $0.7B-$1.1B, which leaves the current $2.3B mark looking ahead of public
          fundamental support.
        - Most defensible public-evidence case today.
        - Diligence closes the gap between estimated revenue and realized software economics.
      - - Bear
        - >-
          Revenue conversion lags, implementation proves heavier than expected, and complaint or litigation noise
          weakens customer adoption and exit appetite.
        - >-
          Support can fall below about $0.7B if the business ends up closer to lower-end public software multiples such
          as nCino's 3.9x reference on the assigned comp page.
        - Credible if migration proof breaks or servicing issues broaden.
        - Missed go-lives, worsening complaint trends, or unattractive round terms.
    notes: >-
      These ranges are directional sensitivity bands built from assigned public comp multiples, Valon's quoted round
      valuation, the Multiples page's revenue estimate, and management's contracted-ARR claim. They are not audited fair
      values, and contracted ARR is not the same thing as recognized revenue.
    claimRefs:
      - CV003
      - CV010
      - CV012
      - CV013
      - CV014
      - CV015
