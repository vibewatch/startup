      - number: '2.4'
        title: Adoption constraints and unresolved diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The same evidence that supports the market thesis also limits it. Public complaint mirrors suggest
              mortgage payment-process friction is a real operating pain point, which helps explain why servicers need
              better infrastructure, but the mirrors disagree materially on Valon's complaint totals and should not be
              treated as precise regulatory counts. More importantly, several key investor questions remain unanswered
              in public: Valon does not disclose software pricing, implementation cost, or a company-defined SAM/SOM by
              segment; the most bullish adoption statistic is "under contract" rather than fully live; and the
              market-expansion claim from 2024 is directional rather than methodologically transparent. The market is
              clearly large enough to matter, but valuation-grade sizing still needs direct customer and regulatory
              evidence.
