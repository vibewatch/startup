  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitute set
        blocks:
          - type: paragraph
            body: >-
              The clearest competitive picture in the assigned evidence is a category battle rather than a clean roster
              of named direct peers. Valon repeatedly frames mortgage servicing as an industry still running on
              disconnected mainframes, spreadsheets, paper, and manual exception handling, which makes the status quo
              and internal build routes meaningful substitutes alongside any modern software vendor. That matters
              because a servicer does not need to buy a new system-of-record to avoid Valon; it can keep the incumbent
              stack, add labor, or deploy narrow overlays on top of existing cores. Public evidence in this pool
              therefore supports a landscape with five practical choices: ValonOS as an integrated replacement, legacy
              servicing cores plus manual workarounds, internal build atop incumbent systems, point AI overlays, and a
              hybrid keep-the-core/add-the-overlay approach. What the pool does not support is a confident,
              source-backed matrix of named direct startup rivals with comparable pricing and product detail.
            claimRefs:
