              - CP012
      - number: '3.3'
        title: Durability, trust posture, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat case is that operating proof and workflow breadth are harder to copy than a thin AI interface.
              HIPTHER's analysis explicitly argues that the competitive test is whether software proven inside Valon's
              own servicing operation can work across other servicers, and its commentary emphasizes that automation in
              mortgage servicing still requires auditable controls, override procedures, and complaint monitoring. Those
              same trust requirements also create displacement risk. PlainCredit's CFPB-derived summary flags mortgage
              complaints and payment-process issues, which does not prove wrongdoing but does show how quickly service
              quality becomes a competitive variable in this category. If buyers view Valon as a strong system-of-record
              but prefer to purchase specialized overlays for voice, QA, or document automation, the company could win
              the platform but lose economics at the edge. The chapter's biggest diligence blocker is therefore not
              whether mortgage servicing needs modernization, but whether Valon consistently wins full-stack
              replacements versus partial overlay deployments once procurement, implementation, and customer-service
              scrutiny are applied.
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP010
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Operating the workflow first is the clearest moat signal
            body: >-
              Valon's best-supported differentiator is that it claims to have built and run the servicing workflow
              before selling the software, which makes its deployment story stronger than a thin feature wedge.
            calloutType: strength
            claimRefs:
              - CP002
              - CP003
              - CP006
          - type: callout
            title: The likely competitive threat is partial replacement, not pure displacement
            body: >-
              The Decagon case shows mortgage servicers can buy narrow AI capability without replacing the system of
              record, so Valon may win the platform but still cede budget and influence to edge vendors.
            calloutType: risk
            claimRefs:
              - CP009
              - CP012
