      - CR004
      - CR006
      - CR009
      - CR013
      - CR014
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The public case moves from a corroborated new round and real deployment signals to a more cautious recommendation
      once comparable sensitivity, disclosure gaps, and downside signals are layered in.
    data:
      nodes:
        - id: round
          label: Fresh round
          detail: $150M Series D at a $2.3B valuation is publicly corroborated.
        - id: traction
          label: Claimed traction
          detail: Management says Valon signed >$200M contracted ARR within six months.
        - id: deployments
          label: Named deployment proof
          detail: Carrington, ServiceMac, and Newrez make the story more concrete than a generic AI narrative.
        - id: comps
          label: Comp sensitivity
          detail: The assigned comp page shows public revenue multiples well below Valon's implied current multiple.
        - id: disclosure
          label: Missing economics and terms
          detail: Public sources do not disclose realized revenue conversion, burn, cash, or preference stack.
        - id: downside
          label: Downside signals
          detail: Complaint activity and an unresolved servicing case keep execution and reputation risk live.
        - id: decision
          label: Recommendation
          detail: Research-more; treat the current mark as expensive until diligence closes the gaps.
      edges:
        - from: round
          to: traction
          label: confirms price marker
        - from: traction
          to: deployments
          label: needs customer proof
        - from: deployments
          to: comps
          label: still must clear public valuation tests
        - from: comps
          to: disclosure
          label: requires economic bridge
        - from: disclosure
          to: downside
          label: weakens confidence
        - from: downside
          to: decision
          label: pushes toward caution
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV008
      - CV009
      - CV013
      - CV015
      - CV016
