              - CI006
              - CI007
          - type: callout
            title: Public evidence is valuation-forward, not cash-flow-forward
            body: >-
              The assigned sources show fresh funding and deployment scale, but not cash balance, burn, runway, debt,
              price realization, or software gross margin, so capital adequacy and revenue quality remain
              under-specified.
            calloutType: risk
            claimRefs:
              - CI001
              - CI002
              - CI011
              - CI012
          - type: callout
            title: Management should bridge contracted ARR to realized economics
            body: >-
              Before underwriting, request cohort-level bookings, implementation timing, recognized revenue,
              collections, churn, services burden, gross margin, and liquidity disclosures rather than treating
              contracted scale or valuation as sufficient.
            calloutType: recommendation
            claimRefs:
