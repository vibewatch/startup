              - CU006
              - CU007
              - CU008
              - CU014
      - number: '6.3'
        title: Durability evidence lags the adoption narrative
        blocks:
          - type: paragraph
            body: >-
              The gap is not whether Valon can name customers; it is whether those customers retain, expand, and stay
              satisfied at scale. Valon’s own site cites 90%+ customer satisfaction and $200M+ of contracted ARR in the
              first six months after going to market, but the assigned evidence does not disclose GRR, NRR, churn,
              contract terms, or top-customer revenue share. That leaves investors relying on logo and pipeline proof
              more than renewal proof. The adverse signal is also non-trivial: a CFPB-derived complaint profile shows
              mortgage-payment issues dominate complaints and complaint volume rose sharply from 2024 to 2025, which
              increases the need to diligence whether platform growth is being accompanied by operational reliability
              and customer support quality.
            claimRefs:
              - CU011
              - CU012
              - CU014
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and investment implications
        blocks:
          - type: paragraph
            body: >-
              The most consequential risk is consumer harm from servicing errors because payment, escrow,
              loss-mitigation, and reporting mistakes can combine customer, regulatory, and reputational damage.
              PlainCredit reports 289 CFPB complaints, including 160 in the trailing twelve months as of August 14,
              2026, and identifies payment-process trouble as the largest issue category. Those are raw consumer-filed
              records rather than findings or rates, so they support a high-impact diligence priority but not a failure
              probability. Enterprise migration and AI-control risk rank next: Valon is moving from operating its own
              servicer to deploying ValonOS across large institutions while also restricting most new hires' AI use
              after reported quality problems. Funding improves capacity to respond, but a financing round is neither
              cash currently available nor proof that implementations will succeed.
            claimRefs:
              - CR003
              - CR005
              - CR007
              - CR008
              - CR012
              - CR015
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
