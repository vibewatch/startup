              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR006
              - CR009
              - CR013
              - CR014
              - CR016
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Mortgage servicing creates direct exposure to federal and state rules governing payment application, loss
              mitigation, notices of error, credit reporting, escrow, foreclosure, privacy, and fair treatment.
              PlainCredit's profile shows both a growing complaint count and a 100% timely-response measure, indicating
              that intake timeliness can coexist with substantive customer disputes. A single JustAnswer account alleges
              that a permanent modification was not applied and that delinquency information remained incorrect despite
              repeated contacts; it is an edited, unverified customer narrative and cannot establish a violation.
              Valon's reposted legal-counsel role says the hire would be the third technology-legal team member and
              would cover commercial, AI, data, financial-product, governance, audit, and regulatory work. That breadth
              is evidence of recognized complexity, not evidence that staffing or controls are sufficient. Primary
              regulator records, licenses, examination findings, litigation dockets, and sampled response files remain
              required before underwriting this risk.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR008
              - CR010
              - CR012
      - number: '7.3'
        title: Operational, quality, and AI-control risk
        blocks:
          - type: paragraph
            body: >-
              The transition to a software-focused model concentrates execution risk in migrations, data integrity,
              workflow correctness, and change control. Hoodline reports that Valon barred most new hires from
              generative AI until managers judged them able to detect errors, after experienced staff reportedly had to
              repair unchecked output. Engineers remained exempt subject to peer review, while finance and human
              resources reportedly lacked comparable guardrails. This is a concrete control response, but also evidence
              that review quality and policy consistency are live operating risks. Carrington says the servicing
              platform uses built-in controls and continuous monitoring, and Valon says its records preserve workflow
              and compliance context. Neither source provides independently tested error, uptime, security-incident,
              model-performance, or migration data. Investment approval should therefore depend on control testing,
              migration reconciliations, incident history, and role-specific AI governance rather than policy
              descriptions alone.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Partner, financial, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Platform scale makes a small number of major servicer deployments strategically important. FinTech Global
              reports Newrez, Carrington, and ServiceMac among institutions expected to run ValonOS, but the assigned
              evidence does not disclose contract terms, go-live status by customer, termination rights, implementation
              economics, or revenue concentration. Valon claims more than $200 million of contracted ARR and more than
              $200 billion of mortgages running on ValonOS; these are company figures, not audited revenue or
              independent deployment verification. Multiple outlets report a $150 million Series D in October 2026,
              which supports expansion capacity but does not disclose burn, unrestricted cash, runway, or
              working-capital demands. Thesis-break triggers are a material normalized complaint or loss rate, failed
              migration reconciliations, repeated control exceptions without timely remediation, delayed major go-lives,
              or audited contracted ARR and concentration materially weaker than the public claims. Until those tests
              are complete, residual risk remains high enough to require staged underwriting.
            claimRefs:
              - CR001
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Stage the decision around control and deployment evidence
            body: >-
              Do not treat funding, contracted ARR, or complaint response speed as substitutes for cash availability,
              live implementation quality, or consumer-outcome evidence. Require sampled servicing files, migration
              reconciliations, control-test results, customer concentration, and audited financial data before
              increasing exposure.
            calloutType: recommendation
            claimRefs:
              - CR007
              - CR010
              - CR013
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current financing and price context
        blocks:
          - type: paragraph
            body: >-
              Valon has a real, current financing marker rather than a rumor-driven valuation story: the company
              announced a $150 million Series D on October 5, 2026 at a $2.3 billion valuation, and independent coverage
              repeated the same headline. The same source package also carries the strongest pro-valuation arguments
              management has made publicly, namely more than $200 million of contracted ARR within six months of launch
              and platform coverage reaching one in six outstanding U.S. mortgages. Those are meaningful commercial
              proof points, but they are still deployment and contract signals rather than disclosed recognized revenue,
              gross profit, or cash-generation evidence. Third-party databases add useful context, yet they also
              underline that public valuation support is still narrow: SetterVC warns its company data and valuation
              marks may be incomplete or stale, and none of the assigned sources disclose liquidation preferences,
              participation terms, or other structure that would determine the effective entry price for a new investor.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV011
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV009
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and price sensitivity
        blocks:
          - type: paragraph
            body: >-
              The thesis is straightforward. Valon appears to have done something rare in regulated enterprise software:
              it built and operated the workflow first, sold that servicing arm, and then took the resulting platform
              into large-servicer deployments backed by new growth capital and active hiring. HousingWire's reporting on
              Carrington, ServiceMac, and Newrez makes the customer proof more concrete than a generic AI-in-finance
              narrative, and the October financing lowers near-term capital pressure. The anti-thesis is just as clear.
              The assigned public sources still do not show realized ValonOS revenue, renewal quality, software gross
              margin, cash burn, or cap-table seniority, while adverse signals remain visible in CFPB-linked complaint
              counts and an unresolved mortgage-servicing lawsuit. That combination makes this an investability
              question, not merely a company-quality question: Valon may be building something valuable, but the public
              package does not yet prove that the 2026 headline price is the right one.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV008
              - CV009
              - CV013
              - CV015
              - CV016
      - number: '8.3'
        title: Comparable framing and scenario sensitivity
        blocks:
          - type: paragraph
            body: >-
              The only directly assigned comparable frame comes from the Multiples page, so it should be treated as
              directional rather than as a finished valuation model. That page reports $86 million of 2025 revenue, up
              from $41 million in 2024, and shows public revenue multiples of 3.9x for nCino, 8.5x for SoundHound, and
              12.2x for Shenzhen Intellifusion. If those numbers were the right basis, Valon's $2.3 billion mark implies
              roughly 26.7x revenue, far above the public-company reference points listed on the same page. The only
              obvious public bridge back toward the current mark is management's claim of more than $200 million in
              contracted ARR. Even then, the round price looks supportable only if a large share of that ARR converts
              into durable, high-margin recognized revenue and the market is willing to award a premium multiple near
              the top of the disclosed public comp range. That is possible, but the current public package does not
              prove it.
            claimRefs:
              - CV003
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Final view, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              On today's public evidence, the right stance is research-more, not buy. The company has enough financing
              and deployment proof to stay on the list, but not enough disclosed economics or term-sheet detail to
              underwrite entry at $2.3 billion with confidence. The call can improve if management shows that contracted
              ARR is converting into recognized revenue with strong gross margins, clean renewals, and a manageable
              services burden, and if the 2026 round terms do not create a preference stack that dilutes common upside.
              The call can deteriorate quickly if large customer migrations slip, complaint volumes keep climbing, or
              litigation and servicing issues become evidence of broader operational weakness. The minimum diligence
              pack is therefore a revenue bridge from contracts to recognized revenue, cohort retention and
              implementation data, current cash runway, and the full preferred-security stack for the latest round.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The financing event is real and the traction claims are unusually strong
            body: >-
              A corroborated $150 million Series D, >$200 million of contracted ARR, one-in-six mortgage-share claims,
              and named major-servicer deployments together clear the bar for "serious company with real momentum."
            calloutType: strength
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
          - type: callout
            title: Public support for the price is still thinner than public support for the story
            body: >-
              The current mark is easier to verify than the economics beneath it. Realized revenue, retention, gross
              margin, burn, cash, and round-structure details remain private, while complaint and litigation signals
              remain open.
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV013
              - CV015
          - type: callout
            title: The next diligence step is a data-room bridge, not a headline-price endorsement
            body: >-
              Move forward only if management can bridge contracted ARR to recognized revenue, show implementation and
              renewal quality, and disclose the preferred-security stack for the latest round.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV015
              - CV016
