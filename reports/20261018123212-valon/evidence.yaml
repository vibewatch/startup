evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: disclosure-gap
    missingEvidence: Exact current headcount, exact customer count, and a management-confirmed lifetime funding ledger.
    whyItMatters: These are cover metrics that influence scale, efficiency, and valuation benchmarking.
    diligencePath: Request the latest board deck or financing summary plus a current org and customer KPI sheet.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, ownership concentration, debt facilities, and any secondary-sale history.
    whyItMatters: Governance rights and capital structure affect control, dilution, and downside protection.
    diligencePath: Review the cap table, board minutes summary, and financing documents in the data room.
    relatedQuestionRefs:
      - QO002
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: revenue-quality
    missingEvidence: Audited or management-certified revenue and run-rate data that reconciles with contracted ARR claims.
    whyItMatters: Contracted ARR is not the same as realized revenue, margin, or cash generation.
    diligencePath: Request customer cohort revenue, recognized revenue by period, and implementation-to-billing conversion data.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: sam-gap
    missingEvidence: A public SAM/SOM model split by servicer segment, loan type, and software-spend economics.
    whyItMatters: >-
      Without a segment-level model, valuation depends on broad mortgage-balance proxies and company directional claims
      rather than a transparent serviceable market calculation.
    diligencePath: >-
      Request customer counts by segment, contract value bands, implementation scope, and management's TAM/SAM worksheet
      used in fundraising.
    relatedQuestionRefs:
      - QM003
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing-and-budget-owner
    missingEvidence: Public pricing, implementation-cost ranges, and named internal budget owners for a ValonOS migration.
    whyItMatters: >-
      Buyer segmentation is visible, but budget authority and payback logic are still inferred instead of directly
      evidenced.
    diligencePath: >-
      Review customer procurement documents, implementation SOWs, or executive interviews that identify who signs and
      funds the platform decision.
    relatedQuestionRefs:
      - QM004
  - type: conflicting-data
    severity: minor
    topic: borrower-friction
    missingEvidence: A direct CFPB database extract for Valon complaints using one consistent date cut and issue taxonomy.
    whyItMatters: >-
      Complaint volume helps evaluate trust and migration risk, but the public mirrors disagree enough that the totals
      should not be used as precise diligence inputs.
    diligencePath: >-
      Pull the CFPB complaint database directly, normalize company naming, and reconcile counts to one as-of date before
      relying on trend or issue totals.
    relatedQuestionRefs:
      - QM006
      - QM007
  - type: missing-source
    severity: material
    topic: direct-peer-gap
    missingEvidence: >-
      Public product, customer, and pricing disclosures from named direct peers and incumbent servicing-platform
      vendors.
    whyItMatters: >-
      Without named peer evidence, the chapter can compare solution classes but cannot prove detailed feature parity,
      market share, or win-loss performance against direct rivals.
    diligencePath: >-
      Collect official product pages, pricing disclosures, customer references, and procurement artifacts from named
      direct peers and incumbent servicing-platform vendors, then rebuild the profile and pricing tables with
      source-backed rows.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
      - TP003
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Realized contract pricing, implementation economics, and post-go-live retention or expansion data for Valon
      deployments.
    whyItMatters: >-
      Contract-size language does not reveal whether Valon wins on total cost of ownership, module attach, or long-term
      net revenue retention versus partial-overlay alternatives.
    diligencePath: >-
      Request customer contracts, pricing schedules, implementation SOWs, and internal win-loss notes that compare
      full-platform replacement with narrower overlay purchases.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash balance, monthly burn, runway, debt facilities, warehouse/project-finance obligations, and next-round
      trigger metrics.
    whyItMatters: >-
      Without liquidity and obligation detail, the new funding round cannot be translated into a reliable
      capital-adequacy view.
    diligencePath: Request board or lender reporting that ties cash, burn, and obligations to the post-Series-D operating plan.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: List pricing, implementation fees, contract length, discounting, and realized ASP by cohort for ValonOS.
    whyItMatters: Contracted ARR and loan volume do not reveal unit pricing, payback, or channel economics.
    diligencePath: Review standard order forms and a cohort-level bookings waterfall with realized price and renewal data.
    relatedTableRefs:
      - TI002
  - type: conflicting-data
    severity: material
    topic: cumulative-capital
    missingEvidence: >-
      A reconciled round-by-round financing chronology that explains why public databases disagree on total capital
      raised.
    whyItMatters: >-
      Cumulative financing affects dilution, cash-history interpretation, and how much external capital has already been
      required.
    diligencePath: Reconcile third-party databases against the cap table and signed financing documents.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      A cohort bridge from contracted ARR to recognized revenue, collections, churn, go-live timing, and software versus
      services gross margin.
    whyItMatters: The current public package proves demand interest, but not the durability or quality of revenue conversion.
    diligencePath: Request a cohort revenue bridge and segmented gross-margin reporting for live customers.
    relatedQuestionRefs:
      - QI001
      - QI003
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: integration-gap
    missingEvidence: >-
      Public OpenAPI or equivalent machine-readable contract, versioning policy, and concrete integration implementation
      guidance for ValonOS.
    whyItMatters: >-
      Without machine-readable and versioned integration evidence, diligence cannot reliably estimate external
      implementation effort or long-term integration maintenance cost.
    diligencePath: >-
      Request current API specifications, webhook/event schemas, versioning and deprecation policy, and one recent
      customer integration architecture pack.
  - type: missing-source
    severity: material
    topic: uptime-and-attestation
    missingEvidence: >-
      Public trust-center artifacts, status history, SLA language, or formal security attestations tied to the customer
      platform.
    whyItMatters: >-
      Regulated-finance buyers need proof not only of intended controls but also of operational reliability and
      independently reviewed security posture.
    diligencePath: >-
      Request SOC 2 or equivalent reports, recent pentest summary, status-page history, incident runbooks, and
      customer-facing security documentation.
  - type: private-evidence-only
    severity: material
    topic: ai-workflows
    missingEvidence: >-
      Production metrics for AI-assisted servicing workflows, including override rates, error rates, and
      workflow-specific service outcomes.
    whyItMatters: >-
      The product thesis depends on AI acting inside controlled servicing workflows, but public materials do not
      quantify how safely or effectively those automations perform at scale.
    diligencePath: >-
      Request workflow-level KPI packs for payments, escrow, homeowner support, and exception handling, with pre/post
      automation comparisons and control-failure escalation data.
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-roster
    missingEvidence: >-
      A current account list showing which servicers are contracted, live, in pilot, or still migrating, plus go-live
      dates and portfolio scope.
    whyItMatters: >-
      Public named-customer proof is concentrated in a few flagship logos, so investors cannot tell whether adoption is
      broad or still dependent on a handful of reference accounts.
    diligencePath: >-
      Request the active customer roster, implementation status by account, and a list of deployments that are live
      versus committed but not yet migrated.
    relatedQuestionRefs:
      - QU003
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: retention-durability
    missingEvidence: GRR, NRR, logo churn, renewal rate, contract term, and cohort retention by customer vintage.
    whyItMatters: >-
      Durability is the key missing counterweight to Valon’s strong adoption narrative; without it, commercial quality
      and concentration risk remain underwritten by management claims and logos.
    diligencePath: >-
      Request customer-cohort retention reporting, signed contract duration ranges, renewal history, and churn reasons
      segmented by account size.
    relatedQuestionRefs:
      - QU005
      - QU008
  - type: missing-source
    severity: material
    topic: consumer-complaints
    missingEvidence: >-
      Raw CFPB records linked to a servicing-loan denominator, severity, substantiation, remediation time, recurrence,
      and consumer-loss outcomes.
    whyItMatters: Raw complaint counts cannot establish an incident rate or expected loss without exposure and outcome denominators.
    diligencePath: >-
      Export the CFPB records, reconcile company aliases, obtain monthly loans serviced, sample files, and calculate
      normalized complaint and repeat-issue rates.
    relatedQuestionRefs:
      - QR001
      - QR002
      - QR010
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: legal-capacity
    missingEvidence: >-
      Primary licenses, examination findings, consent orders, litigation dockets, regulatory correspondence, and legal
      workload metrics.
    whyItMatters: >-
      A job description identifies scope but cannot demonstrate compliance status, control effectiveness, or staffing
      sufficiency.
    diligencePath: >-
      Obtain the regulatory inventory and exam history, search primary federal and state dockets, and compare open
      matters with legal staffing and service-level targets.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: partner-dependency
    missingEvidence: >-
      Customer-level contracted ARR, live-versus-contracted status, implementation milestones, termination rights,
      pricing, concentration, and deployment economics.
    whyItMatters: >-
      Named institutions and aggregate contracted ARR do not show conversion, durability, concentration, or
      implementation profitability.
    diligencePath: >-
      Review executed contracts and implementation plans, reconcile ARR to billing and revenue, and obtain customer
      references for each major deployment.
    relatedQuestionRefs:
      - QR006
      - QR009
      - QR010
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: operational-controls
    missingEvidence: >-
      Independent controls reports, migration reconciliations, uptime and incident history, AI error and override rates,
      security events, and remediation aging.
    whyItMatters: >-
      Control descriptions and a workforce policy do not quantify whether regulated workflows operate reliably at
      enterprise scale.
    diligencePath: >-
      Review SOC reports and exceptions, inspect incident and model-risk registers, sample change approvals, and replay
      migration reconciliation and rollback tests.
    relatedQuestionRefs:
      - QR004
      - QR007
      - QR010
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: >-
      Audited unrestricted cash, burn, runway, debt or preference terms, working-capital needs, and implementation cash
      requirements.
    whyItMatters: >-
      Funding raised does not equal cash available, and contracted ARR does not establish collected revenue or
      self-funded growth.
    diligencePath: >-
      Obtain the latest balance sheet, cash-flow statement, cap table, financing documents, ARR bridge, billing
      collections, and a deployment-level cash forecast.
    relatedQuestionRefs:
      - QR008
      - QR010
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-and-preferences
    missingEvidence: >-
      Current cap table, liquidation preferences, participation rights, insider-secondary terms, and any ratchets or
      pay-to-play provisions for the 2026 round.
    whyItMatters: >-
      These terms determine the effective entry price and downside protection, so the headline post-money valuation is
      not enough to assess investor economics.
    diligencePath: Request the latest financing documents, cap table, and board-approved security summary in the data room.
    relatedQuestionRefs:
      - QV006
  - type: private-evidence-only
    severity: material
    topic: realized-economics
    missingEvidence: >-
      Recognized revenue by cohort, ARR-to-revenue conversion, renewal and retention data, software gross margin,
      implementation services burden, cash burn, and runway.
    whyItMatters: >-
      Without these metrics, the investment case cannot distinguish strong bookings optics from durable, efficient
      software economics.
    diligencePath: Request a monthly KPI pack, cohort bridge, and board reporting on bookings, revenue, gross margin, and liquidity.
    relatedQuestionRefs:
      - QV003
      - QV008
  - type: conflicting-data
    severity: material
    topic: funding-history
