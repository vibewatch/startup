      - [Disclosed capital raised, "$150M Series D disclosed; lifetime total unresolved", "2026-10", Medium, "One narrative lists earlier rounds, but third-party databases disagree on cumulative funding."]
      - [Commercial traction, "$200M+ contracted ARR in first six months; 1 in 6 U.S. mortgages under contract to run on ValonOS", "Reported 2026-10", Medium, "Company-reported commercialization metrics rather than audited revenue or disclosed account count."]
