        and profile sources rather than a full cap table or customer ledger.
    claimRefs: [CO004, CO009, CO010, CO011]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The available record shows a 2019 founding, stepwise financing, scale built inside the
      servicing operation, and a 2026 reset around Carrington plus Series D funding.
    data:
      items:
        - date: "2019"
          label: Company founded in New York
          detail: Assigned sources consistently place Valon's founding year in 2019 and its headquarters in New York.
          tone: positive
          claimRefs: [CO005, CO006]
        - date: "2021"
          label: Series A disclosed
          detail: Wowtale reports a $50 million Series A led by a16z as part of the company's early scale-up.
          tone: positive
          claimRefs: [CO009]
        - date: "2021"
          label: Series B disclosed
          detail: Wowtale reports a $43.9 million Series B at a $590 million valuation.
          tone: positive
          claimRefs: [CO009]
        - date: "2024"
          label: Series C disclosed
          detail: Wowtale reports a $100 million Series C that pushed valuation to roughly $1.1-1.15 billion.
          tone: positive
          claimRefs: [CO009]
        - date: "2025"
          label: Operating scale expanded before the SaaS pivot
          detail: Forbes reported that Valon serviced 593,000 mortgage loans in 2025, up from 371,000 the prior year.
          tone: positive
          claimRefs: [CO013]
        - date: "2025"
          label: Complaint volumes rose
          detail: PlainCredit's CFPB aggregation says annual complaint volume moved from 74 in 2024 to 144 in 2025.
          tone: risk
          claimRefs: [CO016]
        - date: "2026-08"
          label: Carrington bought the servicing business
          detail: Official and independent sources say Carrington acquired Valon's servicing business and adopted ValonOS as its core servicing platform.
          tone: neutral
          claimRefs: [CO004]
        - date: "2026-10"
          label: Series D reset the company around software
          detail: October 2026 sources align on a $150 million Series D at a $2.3 billion valuation while Valon says it signed more than $200 million in contracted ARR in its first six months in market.
          tone: positive
          claimRefs: [CO009, CO012]
    claimRefs: [CO004, CO009, CO012, CO013, CO016]
callouts:
  - calloutType: strength
    title: Operating proof came before external platform sales
    body: >-
      Valon's most defensible narrative edge is that it used its own servicing operation to
      build and test the underlying system of record before trying to sell ValonOS to other
      mortgage servicers.
    claimRefs: [CO003, CO004, CO013]
  - calloutType: risk
    title: Scale claims outrun standardized disclosure
    body: >-
      The company clearly has financing momentum and enterprise references, but exact headcount,
      cumulative funding, customer count, and audited revenue quality are still not settled by
      the assigned source set.
    claimRefs: [CO011, CO012, CO015, CO016]
