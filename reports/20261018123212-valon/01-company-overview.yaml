schemaVersion: report-v2
artifact: company-overview
slug: valon
runDate: 2026-10-18
company:
  name: Valon
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Valon has repositioned itself around ValonOS after building and then selling its own
    mortgage-servicing operation, and official plus independent October 2026 coverage aligns
    on a $150 million Series D at a $2.3 billion valuation. The same assigned source set
    supports commercialization momentum but leaves exact headcount, customer count, and
    lifetime funding unresolved because company claims and third-party profiles do not fully
    reconcile.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Valon presents itself as an AI-native operating system for mortgage servicing and broader
      regulated-finance workflows rather than as a point solution. The strongest identity thread
      across the assigned sources is the system-of-record position: official materials describe
      ValonOS as the layer that unifies loan data, workflow execution, compliance logic, and
      money movement, while independent coverage uses similar language to frame the company as
      infrastructure for regulated finance. That positioning matters because it explains why the
      company spent years operating a licensed servicer before pushing the software externally:
      Valon argues the operating business created the ontology, controls, and workflow history
      its agents now rely on, and the Carrington transaction turned that operating proof into a
      pure SaaS focus.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006]
    tableRefs: [TO001]
  - id: leadership-and-stakeholders
    title: Leadership and stakeholder map
    body: >-
      The named leadership record in the assigned pool is still founder-centric. Wowtale links
      Andrew Wang's mortgage thesis to prior work in Goldman Sachs aviation finance and Soros
      Fund Management's private-credit investing, while Linda Du's background spans Google,
      Goldman Sachs, Two Sigma, and Samlyn Capital. The same article says early board member
      Brian McGrath recently moved into a full-time Executive Chair and Head of Engineering role,
      which strengthens technical continuity but also highlights key-person concentration in a
      small disclosed roster. On the stakeholder side, Ribbit and a16z are the clearest capital
      signals, while Carrington, Newrez, and ServiceMac matter because they anchor product
      adoption, referenceability, and potential concentration risk.
    claimRefs: [CO007, CO008, CO010, CO011, CO014]
    tableRefs: [TO002, TO003]
  - id: capital-scale-and-disclosure
    title: Capital, scale, and disclosure quality
    body: >-
      The October 2026 financing is the cleanest confirmed data point in this chapter: official
      and independent sources all point to a $150 million Series D at a $2.3 billion valuation.
      Beyond that, the disclosure picture gets weaker. Valon says it signed more than $200
      million in contracted ARR within six months of taking ValonOS to market and that one in
      six U.S. mortgages is contracted to run on the platform, but those remain company-reported
      commercialization metrics rather than audited revenue or disclosed customer-count data.
      Third-party scale profiles also diverge materially: Forbes reported 469 employees and $275
      million of funding as of February 2026, while FundedIQ later showed only a 101-250
      employee band and just the disclosed $150 million Series D on record. The right read is
      that Valon likely has real scale, but several cover metrics still need management-room
      confirmation before they can be treated as settled diligence facts.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO015]
    calloutRefs: []
  - id: milestones-and-adverse-signals
    title: Milestones and adverse signals
    body: >-
      The milestone path in the assigned evidence is directionally coherent even where the exact
      historical funding ledger is thin: the company was founded in 2019, raised private rounds
      before its 2026 Series D, built servicing scale internally, then sold the servicing
      business to Carrington while keeping the operating system. That sequence supports the core
      narrative that Valon de-risked its product by using it inside a regulated operator first.
      The adverse evidence is not existential, but it is real enough to keep in frame. A
      complaint aggregator built from the CFPB record shows rising mortgage-related complaint
      volume and a concentration around payment-process issues. That does not prove misconduct or
      normalize for servicing volume, yet it does show that customer-friction signals rose at the
      same time the company was scaling its servicing footprint and platform rollout.
    claimRefs: [CO003, CO004, CO013, CO016]
    figureRefs: [FO001]
