companyProfile:
  summary: >-
    Valon is an AI-native mortgage-servicing software company that built and proved its
    operating model by running a regulated servicer before selling that business and
    focusing on ValonOS. The public record now points to a real enterprise software
    business with large-servicer adoption and a fresh 2026 financing, but the company still
    does not fully disclose exact customer count, cash and runway, or a reconciled lifetime
    funding ledger.
