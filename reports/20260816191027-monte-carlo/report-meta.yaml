    - No public NRR, GRR, churn, concentration, or standard contract-term disclosure.
    - No public gross-margin, services-mix, CAC, payback, or burn disclosure.
    - No public evidence showing how much of current demand or revenue comes from the newer AI / agent-trust modules.
