companyProfile:
  summary: >-
    Monte Carlo is a San Francisco-founded infrastructure software company created in 2019 by
    Barr Moses and Lior Gavish to reduce "data downtime" through data observability. Its public
    product surface now spans classic data observability, AI observability, and agent trust,
    aiming to help enterprises monitor, investigate, and improve the reliability of data and
    AI-agent workflows across modern cloud-data stacks.
  foundedDate: '2019-01-01'
  founders:
    - name: Barr Moses
      role: CEO & Co-founder
      background: Public face of Monte Carlo's category creation and current strategic narrative.
      claimRefs: [CO001, CO005]
    - name: Lior Gavish
      role: CTO & Co-founder
      background: Co-founder associated with the technical architecture and product foundation.
      claimRefs: [CO001, CO006]
  foundingLocation: San Francisco, California, USA
  headquarters: San Francisco, California, USA
  productSummary: >-
    A cross-stack observability and trust platform for data pipelines, data products, and
    emerging AI-agent workflows, combining monitoring, lineage-aware troubleshooting, workflow
    routing, integrations, and newer agent-observability capabilities.
  customerFocus: >-
    Large enterprises with complex cloud-data estates, governance needs, and increasing
    dependence on trustworthy analytics or AI-agent outputs.
  businessModel: >-
    Enterprise software subscriptions sold through a sales-led motion, with account expansion
    tied to broader deployment across domains, teams, and trust-critical workflows.
  stage: Late-stage private
  fundingStatus: >-
    Officially disclosed through the January 2022 $135M Series D, which brought stated total
    funding to $236M; secondary databases cite a possible October 2025 Series E at a $1.6B
    valuation, but that later round is not primary-confirmed in the retained source set.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO007, CO014, CE001, CE004, CU001, CI001]
