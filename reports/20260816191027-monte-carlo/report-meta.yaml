  topStrengths:
    - 400+ enterprise customers and multiple named production deployments support real market demand.
    - Monte Carlo has strong official product, integration, and partner evidence across the modern data stack.
    - The company built a genuine category foothold in data observability and has a plausible adjacent wedge into agent trust.
    - Official funding history through Series D and blue-chip investors signal strong historical market validation.
  topRisks:
    - The latest financing context, preference stack, cash runway, and cap-table position remain under-documented publicly.
    - Retention, gross margin, realized pricing, and burn are not publicly disclosed, limiting valuation confidence.
    - Competition from direct peers, open-source workflows, and incumbent platforms can pressure pricing and expansion assumptions.
    - The AI / agent-trust expansion adds upside but also increases execution complexity and category-overlap risk.
  unresolvedGaps:
