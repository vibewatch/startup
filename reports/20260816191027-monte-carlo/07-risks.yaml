    topic: legal-risk
    sourceRefs:
    - SR004
    - SR003
    confidence: medium
    freshness: current
  - id: CR006
    statement: Historical layoffs are an adverse signal that the company has already faced cost-realignment pressure, raising the question of whether future financing conditions could force another reset.
    type: third-party-reported
    topic: financial-risk
    sourceRefs:
    - SR011
    - SR024
    confidence: medium
    freshness: current
  - id: CR007
