      - number: '1.3'
        title: 融资历史、投资人阵容与估值模糊性
        blocks:
          - type: paragraph
            body: >
              保留的官方来源支撑了一条清晰脉络，直到 2022 年 1 月 Series D：$16 million Series A、$25 million Series B、$60 million Series C
              将累计融资推至 $101 million，随后 $135 million Series D 把累计披露融资推至 $236 million。这条官方序列也列出了一组对年轻基础设施公司而言异常强的投资人，包括
              Accel、Redpoint Ventures、GGV Capital、ICONIQ Growth、Salesforce Ventures、IVP 和 GIC。Series D
              之后的估值图景没那么干净。Monte Carlo 自己的 Series D 文章称公司是第一家数据可观测性独角兽，并暗示该轮附近估值跃升至 $1.6 billion；本次抓取的第三方数据库则称 2025 年 10
              月可能有一轮 $135 million Series E，估值同为 $1.6 billion。由于保留的官方来源集没有找到那份 2025 年一手公告，2022
              年之后的资本结构只能视为部分佐证，在任何人按入场条款承销前，仍需要做股权结构表尽调。
