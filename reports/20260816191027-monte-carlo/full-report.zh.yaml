              的公开证据有价值，但不完整。保留的公开披露没有覆盖获客成本（CAC）、回本周期、净留存率（NRR）、总留存率（GRR）、烧钱速度或营运资本，因此承销必须把单位经济模型视为基本未验证。Monte Carlo
              看起来有不错的软件经济性潜力，但晚期私有指标仍未披露，所以融资依赖的不确定性仍然明显。实体和备案记录确认 Monte Carlo
