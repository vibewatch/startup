companyProfile:
  summary: >-
    Monte Carlo 是一家创立于旧金山的基础设施软件公司，由 Barr Moses 和 Lior Gavish 于 2019 年创办，目标是用数据可观测性降低“数据停机”。它当前公开的产品范围覆盖传统数据可观测性、AI
    可观测性和智能体信任，试图帮助企业在现代云数据栈上监控、排查并提升数据与 AI 智能体工作流的可靠性。
