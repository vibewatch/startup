        - 倍数压缩，下行保护变得关键
        - 如果隐藏指标令人失望，该情景就成立
      - - 下行控制视角
        - 谈判条款很重要
        - 优先股堆叠和进入价格塑造回报
        - 必须由尽调牵引
    notes: 公开证据能支撑情景，不能支撑精确概率。
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV013
      - CV015
      - CV016
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象 / 视角
      - 指标
      - 观察到的倍数 / 状态
      - 相关性
      - 局限
    rows:
      - - GetLatka + $1.6B 标示口径
        - ~$81.6M ARR 估算
        - ~19.6x
        - 有助于粗略筛选私有公司
        - 两个输入都来自二手来源
      - - Series D 轮独角兽里程碑
        - 独角兽门槛
        - 高溢价增长型基础设施背景
        - 锚定早期阶段热度
        - 不是当前价格
      - - 数据平台相邻公司
        - 高质量基础设施可比公司
        - 可能享受溢价倍数
        - 品类相邻参照
        - 私有指标不同
      - - 下行尽调视角
        - 经留存 / 毛利率调整后的价值
        - 尽调前未知
        - 最有助于决策的视角
        - 需要私有数据
    notes: 私有指标不完整，因此可比集合只作示意。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV014
      - CV016
    enumerationScope:
      coverage: sample
      basis: >-
        This public-source table is intentionally representative rather than exhaustive because private company
        disclosures are incomplete.
  - id: TV005
    title: 投资逻辑破裂与否决触发表
    columns:
      - 触发项
      - 阈值 / 事件
      - 重要性
      - 行动含义
    rows:
      - - 隐藏的留存弱点
        - NRR / GRR 明显低于溢价预期
        - 击穿扩张逻辑
        - 降价或放弃
      - - 当前股权结构表不理想
        - 优先股堆叠或新股压力过重
        - 损害上行空间
        - 要求更强条款或拒绝
      - - AI 扩张主要停留在叙事
        - 新模块付费采用很少
        - 上行尚未变现
        - 只按核心业务估值
      - - 价格压缩可见
        - 靠大幅折扣赢单 / 留客
        - 护城河弱于预期
        - 重新评估增长和利润率前景
    notes: 否决触发项把定性担忧转成尽调测试。
    claimRefs:
      - CV007
      - CV010
      - CV013
      - CV015
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 路径
    rows:
      - - 当前融资背景
        - 股权结构表、现金跑道、优先股堆叠
        - 决定下行保护
        - 财务尽调
      - - 收入耐久性
        - NRR、GRR、流失、集中度
        - 决定是否配得上溢价倍数
        - CFO / 数据室
      - - 毛利率和烧钱速度
        - 毛利率、服务收入占比、现金消耗
        - 决定自我造血路径
        - 财务尽调
      - - AI 变现
        - 新模块预订额和采用情况
        - 决定当前叙事的上行空间
        - 产品 + 销售尽调
    notes: 背书估值前，至少要拿到这些答案。
    claimRefs:
      - CV013
      - CV015
      - CV016
