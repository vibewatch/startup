chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、品类起点与当前定位
        blocks:
          - type: paragraph
            body: >
              Monte Carlo 于 2019 年创立，要解决 Barr Moses 和 Lior Gavish
              在现代数据团队里反复看到的具体痛点：业务用户在用管道和仪表盘做决策，但这些资产是否健康，往往要等出事后才看得见。保留下来的官方和投资人来源仍把核心问题称为“data downtime”，Monte Carlo
              也继续围绕新鲜度、数据量、表结构、分布和血缘这五根支柱讲数据可观测性。2025 和 2026 年变化的是这套核心方案外面的包装。官网、平台页和智能体可观测性页面现在把 Monte Carlo
              定位成“智能体信任平台”，用于监控、排查并改进生产中的 AI 系统，底层仍靠同一张数据可观测性图谱支撑。尽调时最诚实的看法是：Monte Carlo 已不再只是一个纯粹的数据可观测性厂商；它在借数据质量立足点切入
              AI 可靠性和智能体运营，机会变大了，执行复杂度也随之上升。
