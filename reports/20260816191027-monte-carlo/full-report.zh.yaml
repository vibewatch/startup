      - number: '1.4'
        title: 企业规模、客户证明与公开牵引力信号
        blocks:
          - type: paragraph
            body: >
              Monte Carlo 的公开材料支撑这样的判断：公司确有企业级牵引力，不只是品类热度。官网和关于页面声称拥有 400 多家企业客户、每天解决 1,000 起事件、监控 10 million
              张表；单个客户材料也显示出可识别的生产部署。JetBlue 案例研究报告称，内部 Data NPS 同比提升 16 点，并描述了数千张被主动监控的表。Skyscanner 描述在 30,000 个数据集环境中监控
              350 个业务关键数据集，Fox 的材料则把 Monte Carlo 放进对收入敏感的媒体分析场景。IVP 2022 年投资笔记也强调 logo 留存率达 100%，并列出 JetBlue 和 Fox
              等客户引用。主要提醒是：公司更愿意披露客户覆盖面，而不是客户结构、合同规模或续约经济性。公开证据在 logo 和工作流契合度上很强；至于这些 logo
              是否转化为集中的扩张收入，或在整个安装基础里形成广泛、耐久的留存，证据较弱。
