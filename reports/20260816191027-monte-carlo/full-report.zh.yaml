        - from: detect
          to: investigate
          label: 下一步
        - from: investigate
          to: respond
          label: 下一步
        - from: respond
          to: improve
          label: 下一步
  - id: FE003
    title: 关键依赖图
    type: dag
    layout: standard
    summary: 产品价值取决于合作伙伴平台、集成和工作流采用。
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE009
      - CE012
      - CE014
      - CE034
    data:
      nodes:
        - id: mc
          label: Monte Carlo 核心平台
          detail: 核心可观测性和信任工作流层
        - id: warehouses
          label: 数据平台
          detail: Snowflake、Databricks、数据仓库、目录
        - id: cloud
          label: 云 / 基础设施伙伴
          detail: AWS、Azure 及周边技术栈
        - id: docs
          label: 文档 / 开发者触点
          detail: 合规、GitHub 集成、MCP
        - id: users
          label: 运营用户
          detail: 要释放价值，必须被采用
      edges:
        - from: warehouses
          to: mc
          label: 数据 + 元数据
        - from: cloud
          to: mc
          label: 托管 / 生态
        - from: docs
          to: users
          label: 赋能
        - from: mc
          to: users
          label: 工作流价值
  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    layout: standard
    summary: 可观测性核心看起来比最新的 AI 信任扩展更成熟。
    claimRefs:
      - CE003
      - CE007
      - CE010
      - CE011
      - CE013
      - CE014
      - CE033
    data:
      columns:
        - 客户证明
        - 生态深度
        - 当前成熟度
      rows:
        - label: 数据可观测性核心
          values:
            - label: 高
              tone: positive
            - label: 高
              tone: positive
            - label: 高
              tone: positive
        - label: 工作流 / 事件层
          values:
            - label: 中高
              tone: positive
            - label: 中
              tone: warning
            - label: 中高
              tone: positive
        - label: AI 可观测性
          values:
            - label: 中
              tone: warning
            - label: 中
              tone: warning
            - label: 中
              tone: warning
        - label: 智能体信任 / MCP
          values:
            - label: 中低
              tone: warning
            - label: 中
              tone: warning
            - label: 中低
              tone: warning
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 从信任痛点走向更广平台采用的代表性路径。
    claimRefs:
      - CU001
      - CU003
      - CU007
      - CU011
      - CU012
      - CU036
    data:
      items:
        - id: discover
          label: 识别信任问题
          actor: 数据 / 治理负责人
          description: 数据或报表出错，造成运营痛点，进而触发评估。
          channels:
            - 事件
            - 内部投诉
            - 治理需求
        - id: evaluate
          label: 评估平台
          actor: 数据平台团队
          description: 团队把 Monte Carlo 与替代方案、合作伙伴匹配方案进行比较。
          channels:
            - 产品页面
            - 推荐客户
            - 合作伙伴背书
        - id: deploy
          label: 部署初始监控
          actor: 运营用户
          description: 生产使用先围绕关键管道或领域展开。
          channels:
            - 集成
            - 监控配置
            - 告警工作流
        - id: prove
          label: 证明业务价值
          actor: 利益相关方
          description: 例子包括信任改善或排障提速。
          channels:
            - 案例研究结果
            - 推荐客户访谈
            - 内部 KPI
        - id: expand
          label: 扩大范围
          actor: 更广企业团队
          description: 随时间推移，更多团队、领域和信任工作流被纳入。
          channels:
            - 续约
            - 扩展
            - 合作伙伴联合销售
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 公开证据显示，早期评估强劲，也已部署进复杂客户；最大未知数在于收入深度能否扩展。
    claimRefs:
      - CU002
      - CU003
      - CU007
      - CU012
      - CU013
      - CU035
    data:
      items:
        - label: 存在信任痛点的企业
          value: 100
          displayValue: 100%
          detail: 受数据可靠性问题困扰的大型组织
          tone: neutral
        - label: 具名生产部署
          value: 42
          displayValue: 42%
          detail: 部分标杆客户已有公开证据
          tone: positive
        - label: 可衡量业务结果
          value: 20
          displayValue: 20%
          detail: 只有部分公开客户证明量化影响
          tone: warning
        - label: 公开留存深度
          value: 8
          displayValue: 8%
          detail: 当前公开留存披露极少
          tone: risk
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: standard
    summary: 具名客户证据在生产证明上强，在经济性上弱。
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU010
      - CU034
    data:
      columns:
        - 生产证明
        - 结果具体度
        - 留存可见度
      rows:
        - label: JetBlue
          values:
            - label: 高
              tone: positive
            - label: 高
              tone: positive
            - label: 低
              tone: risk
        - label: Fox
          values:
            - label: 高
              tone: positive
            - label: 中
              tone: warning
            - label: 低
              tone: risk
        - label: Skyscanner
          values:
            - label: 高
              tone: positive
            - label: 中高
              tone: positive
            - label: 低
              tone: risk
        - label: Roche / PagerDuty / Nasdaq
          values:
            - label: 中高
              tone: positive
            - label: 中
              tone: warning
            - label: 低
              tone: risk
  - id: FU004
    title: 留存 / 复购队列
    type: cohort
    layout: standard
    summary: 公开的留存韧性数据大多仍未披露。
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU013
      - CU014
      - CU033
    data:
      columns:
        - 公开披露
        - 推荐客户访谈可见度
        - 管理层数据索取项
      rows:
        - label: NRR
          values:
            - 0
            - 0
            - 0
        - label: GRR
          values:
            - 0
            - 0
            - 0
        - label: 客户流失率
          values:
            - 0
            - 0
            - 0
        - label: 头部客户集中度
          values:
            - 0
            - 0
            - 0
        - label: 平均合同期
          values:
            - 0
            - 0
            - 0
    approximationNotes: 零值表示缺少公开披露，不代表经营表现。
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 剩余风险集中在执行、资本不透明和合作伙伴依赖。
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR007
      - CR013
      - CR040
    data:
      columns:
        - 发生概率
        - 严重性
        - 缓释成熟度
      rows:
        - label: 执行 / UX 风险
          values:
            - label: 高
              tone: warning
            - label: 高
              tone: warning
            - label: 中
              tone: warning
        - label: 合作伙伴依赖
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: warning
            - label: 中
              tone: warning
        - label: 安全 / 隐私事件
          values:
            - label: 中低
              tone: neutral
            - label: 高
              tone: risk
            - label: 中
              tone: warning
        - label: 资本不透明
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: risk
            - label: 低
              tone: risk
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 几个中度风险叠加后，可能更快演变成下行情景。
    claimRefs:
      - CR001
      - CR002
      - CR008
      - CR009
      - CR012
      - CR039
    data:
      nodes:
        - id: product
          label: 产品摩擦
          detail: UX、实施、告警质量
        - id: retention
          label: 客户深度
          detail: 扩展和留存经济性
        - id: pricing
          label: 定价权
          detail: 守住溢价合同的能力
        - id: capital
          label: 资本需求
          detail: 融资紧迫性和杠杆
        - id: valuation
          label: 估值结果
          detail: 价格和下行保护
      edges:
        - from: product
          to: retention
          label: 削弱
        - from: retention
          to: pricing
          label: 压缩
        - from: pricing
          to: capital
          label: 施压
        - from: capital
          to: valuation
          label: 重定价
  - id: FR003
    title: 依赖图
    type: dag
    layout: standard
    summary: Monte Carlo 扩大产品范围的同时，也依赖人才、合作伙伴和融资清晰度。
    claimRefs:
      - CR002
      - CR003
      - CR006
      - CR007
      - CR010
      - CR038
    data:
      nodes:
        - id: ceo
          label: 领导层 / 品类话语权
          detail: 关键人和战略一致性
        - id: partners
          label: 数据栈伙伴
          detail: 集成和分发能力
        - id: customers
          label: 企业客户
          detail: 需要可持续扩展
        - id: capital
          label: 资本规划
          detail: 现金续航和下一轮融资动态
        - id: ai
          label: AI 扩展
          detail: 新范围和执行负担
      edges:
        - from: ceo
          to: ai
          label: 定调
        - from: partners
          to: customers
          label: 赋能
        - from: customers
          to: capital
          label: 支撑
        - from: ai
          to: capital
          label: 要求
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 公司质量与证据缺口如何共同导向有条件推荐。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV011
      - CV012
      - CV013
      - CV040
    data:
      nodes:
        - id: proof
          label: 真实客户 + 产品证明
          detail: 强度足以支持认真跟进
        - id: upside
          label: AI / 智能体信任上行空间
          detail: 有意义，但仍处早期
        - id: gaps
          label: 财务证据缺口
          detail: 留存、利润率、烧钱、股权结构
        - id: price
          label: 价格纪律
          detail: 不要盲目做投资测算
        - id: call
          label: 有条件投资 / 继续研究
          detail: 只有确认性尽调通过后才推进
      edges:
        - from: proof
          to: upside
          label: 下一步
        - from: upside
          to: gaps
          label: 下一步
        - from: gaps
          to: price
          label: 下一步
        - from: price
          to: call
          label: 下一步
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 在选定收入倍数下，若要支撑选定估值点，需要多少隐含 ARR。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV011
      - CV039
    data:
      items:
        - label: $1.6B，20x
          value: 80
        - label: $1.6B，15x
          value: 107
        - label: $1.6B，10x
          value: 160
        - label: $1.2B，15x
          value: 80
        - label: $1.0B，12x
          value: 83
    approximationNotes: 数值为隐含 ARR，单位为百万美元，采用简单的股权价值 / 收入倍数计算。
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 估值区间是示意性的，锚定公开证据质量，而不是精确的 DCF 式预测。
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV013
      - CV016
      - CV038
    data:
      items:
        - label: 悲观
          low: 800
          mid: 950
          high: 1100
        - label: 基准
          low: 1200
          mid: 1450
          high: 1600
        - label: 乐观
          low: 1700
          mid: 2000
          high: 2300
    approximationNotes: 数值为示意性的百万美元数值，只有拿到私有财务数据后才应细化。
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 以 IC 口径汇总当前基于公开证据的判断。
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV011
      - CV013
      - CV015
      - CV016
      - CV037
    data:
      items:
        - label: 市场 / 品类质量
          value: High
          status: positive
        - label: 客户证明
          value: High
          status: positive
        - label: 财务透明度
          value: Low
          status: risk
        - label: 竞争耐久性
          value: Medium
          status: neutral
        - label: 估值支撑
          value: Medium-Low
          status: warning
