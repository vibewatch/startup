  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >
              本章之所以单列市场边界与纳入支出，是因为 Monte Carlo 的公开证据有价值，但不完整。Monte Carlo 所处市场最好定义为数据可观测性向相邻的 AI
              和智能体可观测性扩展，而不是泛化的数据工具桶。纳入支出包括监控、基于数据血缘的事件响应、信任运营，以及新兴 AI 智能体可靠性工作流。排除支出包括核心数仓、ETL 执行、BI
              消费和通用应用监控，除非这些预算延伸到信任工作流。现状替代方案仍是手工 SQL 检查、dbt 测试、BI
              监控和内部事件处理。合在一起，实用尽调结论是：业务有真实强项，但公开材料仍留下价格敏感问题，最终承销前应补上直接管理层尽调。
