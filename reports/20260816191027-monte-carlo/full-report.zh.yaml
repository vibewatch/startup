      - number: '1.5'
        title: 里程碑、战略转向与主要承销问题
        blocks:
          - type: paragraph
            body: >
              从承销角度看，Monte Carlo 的里程碑轨迹有吸引力，但已不再简单。公司从品类开创快速走到蓝筹投资人联盟和广泛企业客户名单，随后借这个基础从传统数据可观测性扩展到智能体信任、AI
              可观测性和智能体运营。Snowflake 合作伙伴奖和当前合作伙伴页面显示，生态系统也跟着公司走进了更宽的叙事。与此同时，披露记录恰好在晚期投资人最希望看清的地方变薄：当前公开证据无法完全对齐 2026
              年员工数、Series D 之后最新一轮融资，或当前盈利能力与烧钱速度。公开评论来源也显示，产品宽度给部分用户带来 UX
              和变更管理摩擦。结果是一家公司清楚赢下了数据可观测性的重要立足点，并且可能在智能体可靠性上有相邻切口；但 AI 扩张背后的 2022 年后股权结构、经济性和执行纪律，仍要继续尽调。
