      - number: '1.2'
        title: 创始人、领导连续性与公司建设背景
        blocks:
          - type: paragraph
            body: >
              创始故事仍然异常重要，因为 Monte Carlo 的公开品类权威仍与 Barr Moses 和 Lior Gavish 本人绑定。IVP 的投资笔记称，Moses
              带来了领导企业数据团队的一线运营痛点；Monte Carlo 自己保留的材料也把 Gavish 作为联合创始人兼 CTO 写入历史记录。历史之所以重要，是因为公司的可信度不仅靠产品功能，也靠品类教育：很多客户购买
              Monte Carlo，似乎不仅是买监控软件，更是买一套帮助数据团队把信任运营化的框架。公司当前的公开足迹仍以 Barr Moses 为 CEO 和主要对外声音，包括 2026 年 Snowflake
              合作伙伴奖公告。集中叙事有利于品类一致性，但也带来典型关键人依赖：如果 AI 时代重新定位停滞，或领导层发生变化，市场可能会检验没有创始人布道加持时 Monte Carlo 品牌还能走多远。
