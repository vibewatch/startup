              与治理和对变现敏感的分析工作流绑在一起，说明它用于业务关键场景，而不是沙盒试验。合在一起，实用尽调结论是：业务有真实强项，但公开材料仍留下价格敏感问题，最终承销前应补上直接管理层尽调。
