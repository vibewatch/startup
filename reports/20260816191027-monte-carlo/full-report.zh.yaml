              等数据可观测性专门厂商，同时也会撞上既有厂商和工作流替代方案。开源和现状替代仍然重要，因为团队可以把 dbt 测试、Great Expectations、自定义 SQL
              监控和运维工具拼起来，而不是购买专用平台。IBM Databand 代表大型既有厂商在企业数据质量和可观测性工作流里的回应。dbt Labs
              是重要的相邻竞争者，因为它掌握转换工作流，可以在不另购可观测性产品的情况下满足部分质量控制需求。合在一起，实用尽调结论是：业务有真实强项，但公开材料仍留下价格敏感问题，最终承销前应补上直接管理层尽调。
