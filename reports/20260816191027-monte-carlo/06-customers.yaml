company:
  name: Monte Carlo
chapter:
  number: 6
  title: Customers
  summary: Monte Carlo has unusually strong public enterprise customer proof for a private infrastructure company, with multiple named production deployments and at least one quantified outcome. The open issue is not whether customers use the platform; it is how durable, concentrated, and economically deep those relationships are.
sections:
- id: base
  title: Customer Segmentation and Who Appears to Pay
  body: |
    Customer Segmentation and Who Appears to Pay matters in this chapter because Monte Carlo's public evidence is useful but incomplete. Monte Carlo's public customer base is enterprise-heavy and spans travel, media, life sciences, software, and financial-data contexts. The company publicly claims more than 400 enterprise customers, but public sources do not break that base down by revenue band, geography, or contract size. The public customer record is strong on reference quality and weaker on concentration, contract length, and renewal economics. The main adverse customer risk is not lack of logos but uncertainty about the depth and economics of those relationships. Together these points support a practical diligence view: the business has real strengths, but the public corpus still leaves price-sensitive questions unresolved and should be supplemented with direct management diligence before final underwriting decisions are made.
  claimRefs:
  - CU001
  - CU002
  - CU010
  - CU013
  tableRefs:
  - TU001
  - TU002
  figureRefs:
  - FU001
- id: proof
  title: Named Customer Proof and Production Quality
  body: |
    Named Customer Proof and Production Quality matters in this chapter because Monte Carlo's public evidence is useful but incomplete. Named customer stories indicate production deployments rather than mere logo usage, especially for JetBlue, Fox, Skyscanner, PagerDuty, and Roche. JetBlue reports a 16-point year-over-year improvement in internal Data NPS after using Monte Carlo, giving a rare quantified customer outcome. Skyscanner describes monitoring 350 critical datasets inside a 30,000-dataset environment, which supports use in large complex estates. Fox materials tie Monte Carlo to governance and monetization-sensitive analytics workflows, indicating business-critical use rather than sandbox experimentation. Together these points support a practical diligence view: the business has real strengths, but the public corpus still leaves price-sensitive questions unresolved and should be supplemented with direct management diligence before final underwriting decisions are made.
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: adoption
  title: Adoption Trajectory and Expansion Logic
  body: |
    Adoption Trajectory and Expansion Logic matters in this chapter because Monte Carlo's public evidence is useful but incomplete. Public customer proof suggests the product lands in data-platform or governance pain points and then expands into broader trust workflows. Partner-led surfaces with Snowflake and Databricks imply that ecosystem credibility helps customer acquisition and deployment. Monte Carlo appears to benefit from land-and-expand dynamics because observability value increases as more teams and domains run through the platform. Together these points support a practical diligence view: the business has real strengths, but the public corpus still leaves price-sensitive questions unresolved and should be supplemented with direct management diligence before final underwriting decisions are made.
  claimRefs:
  - CU007
  - CU011
  - CU012
  tableRefs:
  - TU005
  figureRefs:
  - FU002
- id: retention
  title: Retention, Repeat Usage, and Satisfaction Gaps
  body: |
    Retention, Repeat Usage, and Satisfaction Gaps matters in this chapter because Monte Carlo's public evidence is useful but incomplete. IVP and Series D materials highlighted 100 percent retention at an earlier stage, but retained 2026 public sources do not disclose current NRR, GRR, or churn. Review sources contain positive feedback on time savings and troubleshooting value, but also warnings about cost, UX friction, and noise. The public customer record is strong on reference quality and weaker on concentration, contract length, and renewal economics. The main adverse customer risk is not lack of logos but uncertainty about the depth and economics of those relationships. Together these points support a practical diligence view: the business has real strengths, but the public corpus still leaves price-sensitive questions unresolved and should be supplemented with direct management diligence before final underwriting decisions are made.
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU013
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: judgment
  title: Customer Judgment
  body: |
    Customer Judgment matters in this chapter because Monte Carlo's public evidence is useful but incomplete. The public customer record is strong on reference quality and weaker on concentration, contract length, and renewal economics. Monte Carlo appears to benefit from land-and-expand dynamics because observability value increases as more teams and domains run through the platform. The main adverse customer risk is not lack of logos but uncertainty about the depth and economics of those relationships. Overall, the customer evidence supports real enterprise adoption, but not a complete durability or concentration picture. Together these points support a practical diligence view: the business has real strengths, but the public corpus still leaves price-sensitive questions unresolved and should be supplemented with direct management diligence before final underwriting decisions are made.
  claimRefs:
  - CU010
  - CU012
  - CU013
  - CU014
