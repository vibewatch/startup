evidenceGaps:
  - type: missing-source
    severity: material
    topic: latest-funding / TO003
    missingEvidence: >-
      A primary 2025 financing announcement or filing confirming whether a Series E actually closed and how the cap
      table changed.
    whyItMatters: >-
      Late-stage entry terms, dilution, and preference stack cannot be underwritten cleanly from secondary databases
      alone, and the investor map remains incomplete without this evidence.
    diligencePath: Request board-approved financing chronology, cap table, and signed term sheets for any post-2022 capital raises.
    relatedQuestionRefs:
      - QO021
      - QO025
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount / TO002
    missingEvidence: >-
      A management-certified 2026 employee count by function and geography plus a current executive roster and org
      chart.
    whyItMatters: >-
      Public sources differ by more than 15%, which changes productivity proxies and also limits confidence in
      leadership-coverage assumptions embedded in the founder and leadership table.
    diligencePath: >-
      Ask management for current HRIS export, fully diluted headcount by function, and 2024-2026 monthly hiring /
      attrition history.
    relatedQuestionRefs:
      - QO010
      - QO019
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: milestone coverage / TO004
    missingEvidence: >-
      A complete board-approved chronology covering all leadership, product, partnership, regulatory, and financing
      milestones since founding.
    whyItMatters: >-
      The milestone table is adequate for underwriting context but not exhaustive enough to substitute for a formal
      diligence chronology.
    diligencePath: >-
      Request the company timeline used for board and investor updates, including every major launch, partnership, and
      organizational change.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO004
  - type: missing-data
    severity: material
    topic: neutral TAM source / TM002
    missingEvidence: >-
      A neutral third-party market-size source that isolates data observability and agent-observability spend without
      vendor bias.
    whyItMatters: Valuation underwriting should not depend on vendor-authored category framing alone.
    diligencePath: Request third-party market studies used by management and compare with bottoms-up customer segmentation.
    relatedTableRefs:
      - TM002
  - type: missing-data
    severity: minor
    topic: budget ownership
    missingEvidence: Public evidence showing which executive actually owns observability versus AI reliability budget in recent wins.
    whyItMatters: Mixed ownership can slow adoption even in a healthy category.
    diligencePath: Review recent deal files and speak with buyers across data and AI platform teams.
  - type: missing-data
    severity: material
    topic: realized pricing
    missingEvidence: Public evidence on realized pricing, discounting, and pilot conversion versus direct peers.
    whyItMatters: Pricing power is central to competitive durability.
    diligencePath: Request recent win/loss analyses, price lists, and discount bands by segment.
  - type: missing-data
    severity: minor
    topic: feature parity
    missingEvidence: Neutral product benchmarks testing detection quality and workflow performance across vendors.
    whyItMatters: Vendor-authored capability pages overstate parity and understate operational differences.
    diligencePath: Run a bake-off with common incidents, lineage questions, and alert-routing workflows.
  - type: missing-data
    severity: material
    topic: unit economics
    missingEvidence: CAC, payback, NRR, GRR, gross margin, and services-mix disclosure.
    whyItMatters: These are core fields needed to judge revenue quality and capital efficiency.
    diligencePath: Request the last eight quarters of management reporting by segment and cohort.
    relatedTableRefs:
      - TI003
      - TI005
  - type: missing-source
    severity: material
    topic: current capitalization
    missingEvidence: Primary confirmation of any post-2022 financing plus current cash balance and preference stack.
    whyItMatters: Late-stage entry pricing depends on the real financing context.
    diligencePath: Request cap table, financing docs, cash report, and any venture-debt agreements.
    relatedTableRefs:
      - TI004
  - type: missing-data
    severity: material
    topic: production performance
    missingEvidence: Independent evidence on alert precision, deployment time, and operational performance at scale.
    whyItMatters: Workflow credibility depends on more than marketing claims or happy-path case studies.
    diligencePath: >-
      Run product demo review, architecture walkthrough, and customer reference calls focused on implementation and
      signal quality.
    relatedTableRefs:
      - TE002
      - TE003
  - type: missing-data
    severity: minor
    topic: AI-layer monetization
    missingEvidence: Public evidence showing how much of current demand or revenue comes from AI / agent observability modules.
    whyItMatters: Investors should separate strategic narrative upside from monetized current-state product fit.
    diligencePath: Request bookings and pipeline breakdown for AI products versus legacy observability.
    relatedTableRefs:
      - TE001
      - TE005
  - type: missing-data
    severity: material
    topic: retention and concentration / TU003
    missingEvidence: Current NRR, GRR, churn, contract length, and top-customer concentration metrics.
    whyItMatters: These are core customer-quality metrics needed for a late-stage software underwriting call.
    diligencePath: Request cohort tables, ARR concentration, renewal history, and reference calls across customer maturity bands.
    relatedTableRefs:
      - TU003
      - TU004
      - TU005
  - type: missing-data
    severity: minor
    topic: segment revenue mix
    missingEvidence: Customer-count breakdown by segment, geography, and ARR contribution.
    whyItMatters: A 400+ customer claim can still hide concentration or segment imbalance.
    diligencePath: Pull CRM and finance segmentation reports for the current installed base.
    relatedTableRefs:
      - TU001
  - type: missing-data
    severity: material
    topic: capital and legal diligence
    missingEvidence: Current cap table, runway, negotiated customer paper, and incident history.
    whyItMatters: These are the highest-value unknowns for late-stage downside protection and residual liability.
    diligencePath: Request board materials, financing docs, customer contracts, and trust-package incident logs.
    relatedTableRefs:
      - TR001
      - TR004
      - TR005
  - type: missing-data
    severity: minor
    topic: AI-expansion execution
    missingEvidence: Adoption and monetization data for the new AI / agent-trust product layer.
    whyItMatters: The expansion story adds upside but can also distract the core business if adoption is weak.
    diligencePath: Review pipeline, bookings, reference calls, and engineering allocation for AI-related modules.
    relatedTableRefs:
      - TR002
      - TR005
  - type: missing-data
    severity: material
    topic: price support
    missingEvidence: Current cap table, retention, margin, burn, and AI-module monetization data.
    whyItMatters: Without these fields, the latest private-market price cannot be cleanly endorsed.
    diligencePath: Request full finance room and customer cohort package before setting entry terms.
    relatedTableRefs:
      - TV001
      - TV004
      - TV006
  - type: missing-source
    severity: minor
    topic: primary latest financing proof
    missingEvidence: An official post-2022 financing announcement or direct management confirmation.
    whyItMatters: Secondary valuation narratives can overstate certainty about current price and downside stack.
    diligencePath: Request signed financing docs or management certification of the current capital structure.
    relatedTableRefs:
      - TV004
      - TV006
