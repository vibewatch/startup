  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Direct, Adjacent, Incumbent, and Status-Quo Alternatives'
        blocks:
          - type: paragraph
            body: >
              Landscape: Direct, Adjacent, Incumbent, and Status-Quo Alternatives matters in this chapter because Monte
              Carlo's public evidence is useful but incomplete. Monte Carlo competes directly with data-observability
              specialists such as Bigeye, Metaplane, Soda, and Anomalo while also colliding with incumbent and workflow
              alternatives. Open-source and status-quo substitutes remain material because teams can combine dbt tests,
              Great Expectations, custom SQL monitoring, and ops tooling instead of buying a dedicated platform. IBM
              Databand represents the large-incumbent response inside enterprise data-quality and observability
              workflows. dbt Labs is an important adjacent competitor because it owns transformation workflows and can
              satisfy some quality-control needs without a separate observability purchase. Together these points
              support a practical diligence view: the business has real strengths, but the public corpus still leaves
              price-sensitive questions unresolved and should be supplemented with direct management diligence before
              final underwriting decisions are made.
