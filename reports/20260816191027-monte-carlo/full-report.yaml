      - number: '1.3'
        title: Funding History, Investor Base, and Valuation Ambiguity
        blocks:
          - type: paragraph
            body: >
              Official retained sources support a clean chronology through the January 2022 Series D: $16 million Series
              A, $25 million Series B, $60 million Series C bringing total funding to $101 million, then $135 million
              Series D bringing total disclosed funding to $236 million. That official sequence also names an unusually
              strong investor roster for a young infrastructure company, including Accel, Redpoint Ventures, GGV
              Capital, ICONIQ Growth, Salesforce Ventures, IVP, and GIC. The valuation picture after Series D is less
              clean. Monte Carlo’s own Series D post described the company as the first data observability unicorn and
              implied a $1.6 billion step-up valuation around that round, while secondary databases fetched in this run
              cite a possible October 2025 Series E of $135 million at the same $1.6 billion valuation. Because the
              retained official source set does not surface a corresponding 2025 primary announcement, the capital
              structure after 2022 should be treated as partially corroborated and still in need of cap-table diligence
              before anyone underwrites entry terms.
