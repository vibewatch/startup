              Switching Cost, Multi-Homing, and Moat Durability matters in this chapter because Monte Carlo's public
              evidence is useful but incomplete. Open-source options typically win on upfront cost and flexibility but
              lose on enterprise packaging and managed workflow depth. Incumbents and adjacent platforms can bundle
              portions of the job, raising the risk that Monte Carlo becomes a premium add-on rather than a system of
              record. The market remains multi-homing-friendly because enterprises can mix vendor platforms with dbt
              tests, native controls, and manual process. Monte Carlo's moat is more likely to come from workflow fit,
              trust graph depth, partner access, and expansion into AI trust than from a simple feature checklist.
              Together these points support a practical diligence view: the business has real strengths, but the public
