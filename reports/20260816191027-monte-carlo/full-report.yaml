              monetization. Overall, Monte Carlo is an attractive company that still needs price-sensitive diligence
              before its latest private-market valuation can be endorsed. Together these points support a practical
              diligence view: the business has real strengths, but the public corpus still leaves price-sensitive
              questions unresolved and should be supplemented with direct management diligence before final underwriting
              decisions are made.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
