              Evidence-Constrained Sizing Lenses matters in this chapter because Monte Carlo's public evidence is useful
              but incomplete. Monte Carlo already claims 400-plus customers, which supports a real serviceable market
              rather than a hypothetical category. The market is being pulled forward by rising data dependency inside
              AI systems, where bad upstream data or poor agent context becomes expensive. Complex modern stacks across
              Snowflake, Databricks, and surrounding tools expand the need for cross-platform observability. Public
              sources do not isolate a defensible, neutral TAM for data observability plus agent trust. Together these
