      - number: '1.2'
        title: Founders, Leadership Continuity, and Company-Building Context
        blocks:
          - type: paragraph
            body: >
              The founding story remains unusually important because Monte Carlo’s public category authority is still
              tied to Barr Moses and Lior Gavish personally. IVP’s investment note says Moses brought firsthand
              operating pain from leading enterprise data teams, while Monte Carlo’s own retained materials keep Gavish
              in the historical record as co-founder and CTO. That history matters because the company’s credibility
              still rests on category education as much as product features: many customers appear to buy Monte Carlo
              not only for monitoring software, but for a framework that helps data teams operationalize trust. The
              company’s current public footprint still centers Barr Moses as CEO and principal external voice, including
              in the 2026 Snowflake partner award announcement. That concentration helps with category consistency, but
              it also creates classic key-person dependence: if the AI-era repositioning stalls or leadership changes,
              the market may test whether Monte Carlo’s brand travels as strongly without the founders’ evangelism
              attached.
