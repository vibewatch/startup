  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included Spend
        blocks:
          - type: paragraph
            body: >
              Market Boundary and Included Spend matters in this chapter because Monte Carlo's public evidence is useful
              but incomplete. Monte Carlo operates in a market best defined as data observability expanding into
              adjacent AI and agent observability rather than a generic data-tools bucket. Included spend covers
              monitoring, lineage-aware incident response, trust operations, and emerging AI-agent reliability
              workflows. Excluded spend includes core warehousing, ETL execution, BI consumption, and generic
              application monitoring unless those budgets extend into trust workflows. Status-quo substitutes remain
              manual SQL checks, dbt tests, BI monitoring, and internal incident handling. Together these points support
              a practical diligence view: the business has real strengths, but the public corpus still leaves
              price-sensitive questions unresolved and should be supplemented with direct management diligence before
              final underwriting decisions are made.
