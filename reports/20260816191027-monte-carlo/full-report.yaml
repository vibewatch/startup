companyProfile:
  summary: >-
    Monte Carlo is a San Francisco-founded infrastructure software company created in 2019 by Barr Moses and Lior Gavish
    to reduce "data downtime" through data observability. Its public product surface now spans classic data
    observability, AI observability, and agent trust, aiming to help enterprises monitor, investigate, and improve the
    reliability of data and AI-agent workflows across modern cloud-data stacks.
