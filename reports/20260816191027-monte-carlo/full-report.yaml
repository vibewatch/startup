chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Category Origin, and Current Positioning
        blocks:
          - type: paragraph
            body: >
              Monte Carlo was founded in 2019 to solve a concrete pain point that Barr Moses and Lior Gavish saw
              repeatedly inside modern data teams: business users were making decisions on pipelines and dashboards
              whose health was largely invisible until something broke. The retained official and investor sources still
              frame that core problem as “data downtime,” and Monte Carlo still publishes the five-pillar
              data-observability framing around freshness, volume, schema, distribution, and lineage. What changed in
              2025 and 2026 is the wrapper around that core offer. The homepage, platform pages, and agent-observability
              pages now position Monte Carlo as an “agent trust platform” that monitors, troubleshoots, and improves
              production AI systems while still relying on the same data-observability graph underneath. For diligence
              purposes, the most honest view is that Monte Carlo is no longer just a category-pure data observability
              vendor; it is using its data-quality foothold to expand into AI reliability and agent operations, which
              increases opportunity but also raises execution complexity.
