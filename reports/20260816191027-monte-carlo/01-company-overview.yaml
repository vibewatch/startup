chapter:
  number: 1
  title: Company Overview
  summary: Monte Carlo is a San Francisco-founded data observability pioneer that now markets itself as an agent-trust platform. Official sources cleanly support the 2019 founding, the Series A-D funding arc to $236M raised, 400+ enterprise customers, and strong ecosystem validation, but the retained public evidence remains ambiguous on the widely-circulated 2025 Series E narrative and on exact 2026 headcount.
sections:
- id: identity-and-positioning
  title: Identity, Category Origin, and Current Positioning
  body: |
    Monte Carlo was founded in 2019 to solve a concrete pain point that Barr Moses and Lior Gavish saw repeatedly inside modern data teams: business users were making decisions on pipelines and dashboards whose health was largely invisible until something broke. The retained official and investor sources still frame that core problem as “data downtime,” and Monte Carlo still publishes the five-pillar data-observability framing around freshness, volume, schema, distribution, and lineage. What changed in 2025 and 2026 is the wrapper around that core offer. The homepage, platform pages, and agent-observability pages now position Monte Carlo as an “agent trust platform” that monitors, troubleshoots, and improves production AI systems while still relying on the same data-observability graph underneath. For diligence purposes, the most honest view is that Monte Carlo is no longer just a category-pure data observability vendor; it is using its data-quality foothold to expand into AI reliability and agent operations, which increases opportunity but also raises execution complexity.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO029
  - CO030
  - CO034
  - CO035
  - CO038
  - CO040
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: founders-and-leadership
  title: Founders, Leadership Continuity, and Company-Building Context
  body: |
    The founding story remains unusually important because Monte Carlo’s public category authority is still tied to Barr Moses and Lior Gavish personally. IVP’s investment note says Moses brought firsthand operating pain from leading enterprise data teams, while Monte Carlo’s own retained materials keep Gavish in the historical record as co-founder and CTO. That history matters because the company’s credibility still rests on category education as much as product features: many customers appear to buy Monte Carlo not only for monitoring software, but for a framework that helps data teams operationalize trust. The company’s current public footprint still centers Barr Moses as CEO and principal external voice, including in the 2026 Snowflake partner award announcement. That concentration helps with category consistency, but it also creates classic key-person dependence: if the AI-era repositioning stalls or leadership changes, the market may test whether Monte Carlo’s brand travels as strongly without the founders’ evangelism attached.
  claimRefs:
  - CO001
  - CO005
  - CO006
  - CO028
  - CO036
  - CO039
  tableRefs:
  - TO002
  figureRefs: []
- id: funding-history-and-investor-base
  title: Funding History, Investor Base, and Valuation Ambiguity
  body: |
    Official retained sources support a clean chronology through the January 2022 Series D: $16 million Series A, $25 million Series B, $60 million Series C bringing total funding to $101 million, then $135 million Series D bringing total disclosed funding to $236 million. That official sequence also names an unusually strong investor roster for a young infrastructure company, including Accel, Redpoint Ventures, GGV Capital, ICONIQ Growth, Salesforce Ventures, IVP, and GIC. The valuation picture after Series D is less clean. Monte Carlo’s own Series D post described the company as the first data observability unicorn and implied a $1.6 billion step-up valuation around that round, while secondary databases fetched in this run cite a possible October 2025 Series E of $135 million at the same $1.6 billion valuation. Because the retained official source set does not surface a corresponding 2025 primary announcement, the capital structure after 2022 should be treated as partially corroborated and still in need of cap-table diligence before anyone underwrites entry terms.
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
  - CO022
  - CO023
  - CO024
  - CO039
