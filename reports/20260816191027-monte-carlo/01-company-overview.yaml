- id: scale-customers-and-proof
  title: Enterprise Scale, Customer Proof, and Public Traction Markers
  body: |
    Monte Carlo’s public surface supports the view that the company has real enterprise traction rather than only category buzz. The homepage and about page claim more than 400 enterprise customers, 1,000 incidents resolved daily, and 10 million tables monitored, while individual customer materials show recognizable production deployments. JetBlue’s case study reports a 16-point year-over-year improvement in internal Data NPS and describes several thousand actively monitored tables. Skyscanner describes monitoring 350 business-critical datasets out of a 30,000-dataset environment, and Fox’s materials frame Monte Carlo as part of revenue-sensitive media analytics. IVP’s 2022 investment note also highlighted 100 percent logo retention and customer references including JetBlue and Fox. The main caution is that the company discloses customer breadth much more readily than customer mix, contract size, or renewal economics. The public evidence is strong on logos and workflow fit, weaker on whether those logos translate into concentrated expansion revenue or broad-based, durable retention across the entire installed base.
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO016
  - CO017
  - CO019
  - CO025
  - CO026
  - CO027
  - CO037
  - CO039
