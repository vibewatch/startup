  - FO003
- id: milestones-and-underwriting-questions
  title: Milestones, Strategic Transition, and the Main Underwriting Questions
  body: |
    From an underwriting perspective, Monte Carlo’s milestone pattern is attractive but no longer simple. The company moved quickly from category creation to a blue-chip investor syndicate and a broad enterprise customer list, then used that base to expand from classic data observability into agent trust, AI observability, and agent operations. The Snowflake partner award and current partner pages suggest that the ecosystem has followed the company into that broader narrative. At the same time, the disclosure record has become thinner exactly where a late-stage investor would want it to become clearer: the current public evidence does not fully reconcile 2026 headcount, the latest round after Series D, or current profitability and burn. Public review sources also show that product breadth comes with UX and change-management friction for some users. The result is a company that clearly won an important foothold in data observability and may have an adjacent wedge into agent reliability, but still requires diligence on the post-2022 cap table, economics, and execution discipline behind the AI expansion.
  claimRefs:
  - CO028
  - CO031
  - CO032
  - CO033
  - CO034
  - CO035
  - CO038
  - CO039
