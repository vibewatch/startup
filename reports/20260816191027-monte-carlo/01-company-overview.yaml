  evidenceGaps:
  - type: missing-source
    severity: material
    topic: latest-funding / TO003
    missingEvidence: A primary 2025 financing announcement or filing confirming whether a Series E actually closed and how the cap table changed.
    whyItMatters: Late-stage entry terms, dilution, and preference stack cannot be underwritten cleanly from secondary databases alone, and the investor map remains incomplete without this evidence.
    diligencePath: Request board-approved financing chronology, cap table, and signed term sheets for any post-2022 capital raises.
    relatedQuestionRefs:
    - QO021
    - QO025
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: material
    topic: headcount / TO002
    missingEvidence: A management-certified 2026 employee count by function and geography plus a current executive roster and org chart.
    whyItMatters: Public sources differ by more than 15%, which changes productivity proxies and also limits confidence in leadership-coverage assumptions embedded in the founder and leadership table.
    diligencePath: Ask management for current HRIS export, fully diluted headcount by function, and 2024-2026 monthly hiring / attrition history.
    relatedQuestionRefs:
    - QO010
    - QO019
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: milestone coverage / TO004
    missingEvidence: A complete board-approved chronology covering all leadership, product, partnership, regulatory, and financing milestones since founding.
    whyItMatters: The milestone table is adequate for underwriting context but not exhaustive enough to substitute for a formal diligence chronology.
    diligencePath: Request the company timeline used for board and investor updates, including every major launch, partnership, and organizational change.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO004
