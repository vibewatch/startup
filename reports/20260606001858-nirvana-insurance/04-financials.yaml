  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: gross-margin-disclosure
    missingEvidence: Gross margin, claims-cost burden, and support-labor detail by stream.
    whyItMatters: Without cost buckets, the business could look software-like, carrier-like, or service-heavy, and those are
      radically different underwriting cases.
    diligencePath: Request a gross-profit waterfall with loss ratio, claims ops cost, safety-services cost, and broker acquisition
      cost by line.
    relatedQuestionRefs:
    - QI007
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-and-debt
    missingEvidence: Current cash balance, monthly burn, debt facilities, and any guarantees or lease liabilities.
    whyItMatters: Capital adequacy and next-round timing cannot be underwritten without liquidity and leverage data.
    diligencePath: Request the latest board package or monthly operating report with cash, burn, debt, and covenant schedule.
    relatedQuestionRefs:
    - QI008
    - QI014
    - QI024
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: public-comps-comparability
    missingEvidence: A management bridge from premium volume to recognized revenue and gross profit that makes public comps
      more comparable.
    whyItMatters: Without a bridge, public comps may frame the range of possibilities but cannot validate Nirvana’s actual
      economics.
    diligencePath: Request accounting policy memos and a premium-to-revenue bridge for 2024-2026.
    relatedQuestionRefs:
    - QI021
    - QI022
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: next-round-trigger
    missingEvidence: Board-approved liquidity threshold or growth plan showing when Nirvana would need the next financing
      event.
    whyItMatters: Fresh capital is visible, but the timing of the next raise remains opaque.
    diligencePath: Request the 24-month operating plan and minimum-cash threshold used in board reporting.
    relatedQuestionRefs:
    - QI023
