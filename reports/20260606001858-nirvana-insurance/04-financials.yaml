- id: TI001
  title: Revenue streams table
  columns:
  - stream
  - mechanism
  - unit
  - current value / status
  - quality
  - diligence ask
  rows:
  - - Fleet trucking policies
    - Carrier-backed commercial trucking insurance priced with telematics and safety history
    - Policy premium
    - Live official program; upfront safety discounts and pay-for-miles pricing disclosed
    - Core revenue stream is visible, realized premium yield is not
    - Provide gross written premium, net written premium, and earned premium by fleet cohort.
  - - Non-fleet trucking policies
    - 1-9 power-unit program launched with Ascend workflow support
    - Policy premium
    - Live across 28+ states per Ascend case study
    - Growth path is visible, revenue mix is not
    - Provide policy count, average premium, and bind rate for non-fleet business.
  - - Broker-sourced business
    - Agents and brokers submit applications and receive bindable quotes
    - Policy premium / commission economics
    - Operationally active; sub-10-minute application flow
    - Channel importance is clear but economics are private
    - Provide broker production mix, commission schedule, and average time to bind.
  - - Claims and service layer
    - Claims handling, AI triage, and safety services bundled into the policy relationship
    - Included service value, not publicly standalone revenue
    - Included with policy according to public pages
    - Likely raises stickiness but also delivery cost
    - Break out service expense and any service-fee revenue or ancillary income.
  - - Safety / telematics differentiation
    - Discount and underwriting engine informed by 32B+ miles of data
    - Pricing lever rather than explicit standalone fee
    - Highly visible in product marketing
    - Probably improves conversion and loss selection more than it creates separate revenue
    - Show quote-win, loss-ratio, and retention uplift attributable to telematics features.
  notes: The retained public record supports premium-driven insurance revenue with service and safety tooling bundled into
    the product. Unknown means there is no public evidence for realized economics by stream.
