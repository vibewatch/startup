- id: capital-adequacy-and-financing
  title: Capital adequacy and financing dependency
  body: 'On financing, the public record is strong on fundraising and weak on liquidity. Nirvana has disclosed a $57 million
    Series B, an $80 million Series C, and a $100 million Series D, with Series D press coverage tying the latest round to
    a $1.5 billion valuation and expansion of the AI operating system. The company also says top-tier reinsurers doubled capacity,
    which matters because reinsurance support can expand underwriting headroom even when equity capital is not the whole story.
    But there is still no retained public disclosure of current cash, monthly burn, debt facilities, reserve adequacy, or
    runway. That is where the contrast with public comps becomes useful: Progressive, Assurant, Root, and Lemonade all maintain
    investor or SEC surfaces that publish filings, quarterly results, and other financial artifacts. Nirvana does not. As
    a result, capital adequacy must be inferred from fresh fundraising and partner support, not directly measured from a balance
    sheet.'
