- id: traction-and-unit-economics
  title: Traction proxies and unit-economics read-through
  body: 'The strongest public proof of commercial traction is not GAAP revenue but operational throughput and customer-outcome
    evidence. Series C disclosures say Nirvana had already generated more than $100 million in premiums and analyzed over
    20 billion miles, while Series D materials say the data footprint had grown past 30 billion miles. The Ascend case study
    adds a sales-efficiency proxy by showing the non-fleet launch doubled retail appointments and saved one FTE hire while
    scaling. Claims-research materials also matter financially because they show why fleets might pay attention: 88% of operators
    say claims need major improvement, 94% say technology is extremely useful in claims, and litigation-driven premium pressure
    remains high. But none of those traction signals is the same thing as audited net revenue or gross margin. Public demand
    is visible; public unit economics remain only partially visible.'
