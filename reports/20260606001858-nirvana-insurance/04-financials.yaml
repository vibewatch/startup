- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - current public proxy
  - impact
  - exact diligence path
  rows:
  - - Net revenue by stream
    - Premium volume, channel pages, and traction case studies
    - Cannot judge revenue quality or valuation support
    - Request audited revenue split by fleet, non-fleet, broker, and any service revenue.
  - - Realized pricing and discount capture
    - Upfront-discount and mileage-based pricing language
    - Cannot tell whether discounts improve conversion without erasing margin
    - Request anonymized quote-level pricing and renewal data.
  - - Gross margin and claims-cost burden
    - Claims and safety workflows are visible, cost buckets are not
    - Cannot tell whether the model is software-like or service-heavy
    - Request gross-profit waterfall including claims, safety, and support labor.
  - - Cash, burn, and runway
    - Recent equity rounds and reinsurance capacity only
    - Capital adequacy remains inference rather than measurement
    - Request latest cash, monthly burn, and 24-month plan.
  - - Debt, guarantees, or financing facilities
    - No retained public evidence
    - Hidden leverage could materially change downside risk
    - Request debt schedule, guarantees, and covenant summary.
  - - Concentration, retention, and renewal
    - Success stories and channel case studies only
    - Strong growth may still rest on a narrow customer base
    - Request top-customer concentration, renewal cohorts, and retention by segment.
  notes: Each gap is actionable and directly tied to the final verdict. The chapter supports a directional read, but these
    asks are necessary for underwriting-grade financial diligence.
