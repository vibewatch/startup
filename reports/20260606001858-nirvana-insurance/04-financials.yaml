  - - Series-funded product expansion
    - Not a pricing stream, but funds support monetization expansion
    - Use-of-funds disclosed; revenue impact not quantified
    - Unknown payback on AI and expansion spend
    - Series C / Series D releases
    - Need capital allocation by product line and expected ROI.
