  - - Safety Intelligence Platform
    - Safety manager / dispatcher
    - Live self-serve surface
    - Unifies FMCSA and telematics data, leaderboards, hotspot maps, recommendations
    - No public export/API or uptime documentation found
  - - Agent platform
    - Broker / wholesale or retail agency
    - Live quote-to-bind workflow
    - Application in under 10 minutes with instant indication and bindable quotes
