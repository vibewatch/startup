- id: ai-and-architecture
  title: AI, data stack, and engineering operating model
  body: |-
    Nirvana publishes more architecture evidence than many insurers, but it is concentrated in data science and internal engineering posts rather than customer-facing docs. The underwriting side is supported by a per-customer modeling architecture: the data-science workflows post says Nirvana trains and deploys a new model on each customer's data, then emits vehicle-level and driver-level risk profiles weekly or monthly. The same post names Metaflow for authoring workflows, AWS Step Functions for orchestration, AWS Batch for scheduling, and EC2 as the compute environment after the team moved away from Fargate to improve startup times, GPU support, and cost/performance.

    Two newer AI posts show how that stack is being used. The pricing post says Nirvana evaluates hundreds of risk features, including driving behavior, FMCSA inspections, loss metrics, and driver turnover, and now uses coordinated AI agents to generate and validate feature candidates faster. The claims post shows a parallel AI workflow for claims intake and coverage triage. Internal engineering maturity is also visible in the NirvanaMQ merge-queue writeup, which says the company scaled past 100 developers and processes 7,000+ pull requests per year with Lambda, SQS, and ECS-backed automation. Those sources directly evidence a serious internal software organization; what remains inferred is how much of that stack is shared across every production user-facing service beyond DS and claims intake.
