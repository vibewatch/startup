company:
  name: Nirvana Insurance
chapter:
  number: 5
  title: Product & Technology
  summary: |-
    Nirvana sells telematics-driven commercial trucking insurance in two product motions: fleet policies for 10+ power units and non-fleet policies for 1-9 units, wrapped with active safety tools, an in-house claims experience, and a broker-facing quote-to-bind workflow. Public evidence directly supports the policy workflow, telematics inputs, claims automation, and the data-science infrastructure behind per-customer underwriting models, while exact uptime, external security audits, and full integration catalogs remain undisclosed.
sections:
- id: product-definition
  title: Product definition and commercial workflow
  body: |-
    Nirvana's product is not a standalone software subscription; it is an operating workflow for underwriting and servicing commercial trucking insurance. The public product surface splits cleanly into a Fleet Insurance Program for fleets with 10+ power units and a Non-Fleet Trucking Program for 1-9 power units. In both motions, the customer workflow starts with a broker or insured connecting telematics, sharing loss and FMCSA context, and receiving a quote that promises safer fleets up to 20% upfront discounts and rate stability through the policy term. The fleet program adds pay-as-you-drive billing and more explicit safety tooling, while the non-fleet program emphasizes fixed premiums and predictable endorsement pricing.

    What is directly evidenced is that Nirvana packages insurance, pricing logic, claims servicing, and safety coaching together. The home, fleet, non-fleet, and telematics pages repeatedly tie telematics inputs to upfront discounts, monthly billing transparency, and claims support. TechCrunch's March 2025 coverage independently corroborates that Nirvana uses telematics plus FMCSA data in usage-based commercial auto underwriting for both fleet and non-fleet customers. The product therefore appears to compete less as a generic dashboard and more as a full-stack insurance workflow for trucking operators, brokers, and safety managers.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE013
  - CE036
  tableRefs:
  - TE001
- id: claims-and-safety
  title: Claims, safety, and operational use cases
  body: |-
    The strongest directly evidenced workflows after quote-and-bind are claims handling and proactive safety. Nirvana's claims page promises 24/7 intake by online form, phone, or email, a response within 24 business hours, and weekly updates on open claims. The same page says claims are handled by in-house trucking specialists using telematics and camera evidence. A newer company engineering post makes the operating flow more concrete: first-notice-of-loss emails are parsed by AI into structured case data, attachments are assembled automatically, and a policy engine gives adjusters an initial coverage view before human review.

    Safety is positioned as both product value and underwriting reinforcement. Active Safety is included with the policy, while the Safety Intelligence Platform aggregates FMCSA and telematics data, surfaces personalized recommendations, ranks drivers, maps inspection hot spots, and highlights BASIC categories that are pushing up risk. This makes the product workflow circular rather than linear: telematics helps win the policy, safety tools shape driving behavior during the term, and claims telemetry helps settle losses faster. That integrated loop is well evidenced in official materials even if the exact model-performance metrics behind it are not fully disclosed.
