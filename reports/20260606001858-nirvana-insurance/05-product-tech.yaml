  rows:
  - - Telematics + FMCSA ingestion
    - Feeds pricing, safety, and claims context
    - Official telematics pages and TechCrunch describe telematics plus FMCSA data usage
    - Telematics devices, FMCSA data availability, consented data access
    - Data gaps or hardware disconnects can degrade underwriting quality
  - - Per-customer underwriting models
    - Generates customer-specific risk segmentation and outputs
    - DS workflows post states a new model is trained on each customer dataset
    - Model features, historical loss data, cloud compute, ML governance
    - Model-drift controls are only partially disclosed
  - - Pricing segmentation and AI feature generation
    - Scores hundreds of candidate variables such as driver turnover
    - AI pricing post
    - Internal experimentation stack and data quality
    - External users cannot audit feature importance or fairness controls
  - - Claims intake automation
    - Turns email FNOL into structured case files and initial coverage view
    - AI claims post and claims page
    - Email ingestion, policy engine logic, attachments, adjuster review
    - Coverage triage rules and false-positive/negative rates are not public
  - - Workflow orchestration stack
    - Executes DS pipelines and manages scaling
    - Metaflow, Step Functions, AWS Batch, EC2 disclosed in DS workflows post
    - AWS services and Nirvana infra team
    - Cloud incidents or orchestration failures could impair model refresh cadence
