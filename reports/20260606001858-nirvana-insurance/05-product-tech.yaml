  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: third-party security assurance
    missingEvidence: No public SOC 2, ISO 27001, or equivalent third-party security attestation was found in retained sources.
    whyItMatters: Insurance workflows depend on sensitive telematics, claims, and broker data, so self-attested privacy pages are weaker than current enterprise diligence standards.
    diligencePath: Request the latest security certification package, penetration-test summary, and customer security addendum.
    relatedQuestionRefs:
    - QE023
    - QE024
  - type: missing-source
    severity: material
    topic: reliability and incident visibility
    missingEvidence: Retained sources did not surface a public uptime page, incident archive, or historical SLA dashboard for claims, safety, or quote surfaces.
    whyItMatters: The product promise depends on fast quoting, active monitoring, and claims responsiveness; without reliability evidence it is hard to underwrite operational resilience.
    diligencePath: Request historical uptime, incident postmortems, and service-level reporting for claims and policyholder systems.
    relatedQuestionRefs:
    - QE024
  - type: missing-source
    severity: minor
    topic: integration catalog depth
    missingEvidence: Public materials show telematics usage and a Samsara perk, but not a complete, current catalog of supported telematics, camera, agency, or claims-system integrations.
    whyItMatters: Deployment speed, data continuity, and broker adoption depend on how broad and stable the integration surface really is.
    diligencePath: Request the live telematics and integration support matrix and recent implementation timelines by connector.
    relatedQuestionRefs:
    - QE016
    - QE023
