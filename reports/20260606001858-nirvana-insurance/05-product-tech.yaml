- id: trust-and-risks
  title: Trust, compliance, dependencies, and public gaps
  body: |-
    Trust controls are evidenced mostly through company policies and operating disclosures rather than third-party attestations. Nirvana's privacy promise says telematics data is used to improve pricing, underwriting, claims, and safety, that the company will never sell or trade data, and that it will stop pulling additional data if a prospect does not bind. The responsible disclosure page publishes a bug-bounty-style intake process and good-faith testing rules. The licenses page and fleet page together show a multi-state producer footprint and an admitted/non-admitted distinction in California, while the home and fleet pages say the insurance paper is A-rated and backed by global reinsurers.

    The main diligence gap is what is not surfaced publicly. In retained sources there is no public SOC 2 report, no external security certification, no incident history or uptime page, and no canonical public integration catalog beyond telematics examples, Samsara perks, and broker workflow hints. The dependency model is therefore clear at a high level—carrier paper, reinsurers, telematics hardware and data, FMCSA data, cloud infrastructure, and broker partners—but not fully auditable from public artifacts alone. That gap matters because the product promise rests on data continuity, claims responsiveness, and trust in how telematics is handled.
