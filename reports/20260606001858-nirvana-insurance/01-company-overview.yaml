  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding
    missingEvidence: A cap-table, incorporation filing, or first board consent that fixes the true founding year.
    whyItMatters: Company materials and third-party profiles disagree on whether Nirvana was founded in 2020 or 2021, which affects chronology and company-age benchmarking.
    diligencePath: Request incorporation records, the first financing deck, or legal-entity formation documents from management.
    relatedQuestionRefs:
    - QO002
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster plus any observer, veto, or protective-rights schedule.
    whyItMatters: Public materials show investors and executives but not the actual board composition or governance rights that matter for control and refresh diligence.
    diligencePath: Request the latest board deck cover, stockholders agreement summary, and board-consent schedule.
    relatedQuestionRefs:
    - QO007
    - QO025
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, ARR, loss ratio, and exact customer-count metrics.
    whyItMatters: Cover metrics shape valuation interpretation, but the reviewed public corpus only exposes premiums, discounts, and rough customer or headcount proxies.
    diligencePath: Request monthly premium run-rate, booked revenue, loss-ratio trend, and active-account counts from management.
    relatedQuestionRefs:
    - QO024
  - type: conflicting-data
    severity: minor
    topic: funding
    missingEvidence: A board-approved financing history or cap-table export that reconciles seed, Series A, and total-raised math.
    whyItMatters: Public sources round total funding differently, so a precise total cannot be stated without a canonical capital-history document.
    diligencePath: Ask finance for a financing history table that lists each round amount, closing date, and whether seed capital is included in press tallies.
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: minor
    topic: scale-metrics
    missingEvidence: A current headcount report and a canonical mileage-data disclosure.
    whyItMatters: External profiles and marketing surfaces disagree on employee count and telemetry-mile totals, reducing confidence in exact cover metrics.
    diligencePath: Request an HR headcount snapshot and the latest approved metric sheet for telematics miles analyzed.
    relatedQuestionRefs:
    - QO017
