- id: milestones-and-public-risk-signals
  title: Milestones, customer proof, and public risk signals
  body: 'The most decision-useful public evidence after financing is the density of dated commercial proof in 2025 and 2026. Nirvana’s about page says the company sold its first policy in 2022, and the official site then shows later milestones spanning the 2024 reinsurance-capacity expansion, the 2025 Series C and Series D raises, the win-story hub covering December 2025 through March 2026, and a burst of June 2026 customer-proof pages for GMG Express and TTR Shipping. Those materials show a company still investing in proof-of-market storytelling immediately before this run date. The caution is that much of the proof is company-authored. Independent validation exists but is thinner: FeaturedCustomers surfaces a limited review corpus, while TruckingWay’s March 2026 review explicitly notes the lack of BBB and Trustpilot profiles and also reports a narrower state footprint than the fleet page claims. Combined with the explicit privacy promise and responsible-disclosure policy, the public-risk
    picture is not a scandal narrative; it is a visibility and execution narrative. Nirvana appears operationally active and well funded, but exact public complaint tracking, governance visibility, and several key financial metrics remain thin for a company already valued at unicorn scale.'
