- id: leadership-and-governance
  title: Founders, leadership, and governance visibility
  body: 'Leadership evidence is strongest around the founding trio and current executive front line. Multiple sources identify Rushil Goel as chief executive and co-founder, and both official and independent writeups tie his origin story to running fleet-product work at Samsara, where he saw safe carriers overpaying under stale insurance models. The founding team also publicly includes Abhay Mitra and Alex Carges, with Carges specifically identified as co-founder and chief actuary. Beyond the founders, Nirvana’s about page names Molli Langland, Gary Weber, Jon Hammer, David Fortune, and Katie Morrow, and the split between fleet and non-fleet general-manager roles suggests the company has already built product-line specialization into the organization. What remains notably opaque is governance: investors are visible in financing announcements, but the public corpus does not provide a clean current board roster, voting-rights map, or protective-rights summary. That means key-person dependence
    can be discussed, but hard control analysis still requires management materials.'
  claimRefs:
  - CO004
  - CO005
  - CO006
  - CO007
  - CO023
  - CO048
  - CO049
  tableRefs:
  - TO002
- id: capital-and-cover-metrics
  title: Funding history, valuation marks, and cover metrics
  body: 'Nirvana’s capital history is much better documented than its operating economics. The official timeline shows a $22 million Series A in February 2022, a $57 million Series B in October 2023, an $80 million Series C announced on 2025-03-10, and a $100 million Series D in December 2025. The external record is especially strong for the last two rounds: multiple outlets place the Series C valuation in an approximately $830 million to $850 million range, while Series D coverage converges at $1.5 billion with Valor Equity Partners leading and Lightspeed Venture Partners plus General Catalyst increasing their commitments. Premium scale is also directionally visible, with the Series C materials saying Nirvana had well over $100 million in premiums and was doubling year over year. After that, precision drops off quickly. Public sources disagree on total raised, cite headcount only as rough proxies around 186 to 200, and do not publish revenue, ARR, gross margin, or an audited customer count.
    Those omissions are too important to infer away, so the snapshot table keeps several metrics as gaps rather than pretending precision.'
  claimRefs:
