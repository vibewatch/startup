company:
  name: Nirvana Insurance
chapter:
  number: 1
  title: Company Overview
  summary: Nirvana Insurance is a San Francisco-based, venture-backed commercial trucking insurer that publicly frames itself as an AI-native rebuild of underwriting, pricing, claims, and safety workflows. The evidence clearly supports its founding team, headquarters, Series B/C/D financing path, reinsurance-backed product expansion into both fleet and non-fleet trucking, and a 2025-2026 run of customer and win-story proof; however, exact revenue, ARR, audited customer count, headcount, and even the founding year remain only partially resolved in public materials.
sections:
- id: identity-and-scope
  title: Identity, product scope, and operating footprint
  body: 'Nirvana Insurance consistently presents itself as a private AI-native insurer focused on commercial trucking and adjacent commercial auto workflows rather than as a general horizontal broker. The core proposition is that telematics, claims data, and underwriting models let the company price risk more precisely than legacy one-size-fits-all commercial auto carriers. Public coverage pages support a concrete operating footprint: the fleet program targets carriers with 10 or more power units, the non-fleet program targets 1 to 9 units, the fleet page says the company is active in 28 states with California written on a non-admitted basis, and the non-fleet page says the smaller-fleet product is active in 15 states with Texas non-admitted. San Francisco is the consistent headquarters across company and third-party profiles. The main caveat is chronology drift: official materials say Nirvana was founded in 2021, but CB Insights and Ascend both label it as a 2020 founding, so the company
    age should be treated as a diligence item rather than an uncontested fact.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO008
  - CO009
  - CO010
  - CO011
  - CO041
  - CO042
  - CO046
