- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation logic
  - Gross return view
  - Key risks / probability signal
  rows:
  - - Bull
    - Disclosed premium-to-revenue conversion, durable underwriting quality, broader state reach, and
      continued customer wins.
    - $2.0B-$2.8B implied value with stronger proof of economics and continued growth.
    - ~1.3x-1.9x from Series D entry
    - Needs economic disclosure plus evidence that growth is profitable, not just fast.
  - - Base
    - Nirvana keeps growing, but disclosure remains partial and line conditions stay tough.
    - $1.2B-$1.8B value range, roughly around the current private mark.
    - ~0.8x-1.2x
    - Most likely if growth continues without a major positive disclosure catalyst.
  - - Bear
    - Down-round signal, stubborn line severity, or weak disclosed economics.
    - $0.6B-$1.0B value range.
    - ~0.4x-0.7x
    - Fattened by high-severity market conditions and lack of transparent underwriting proof.
  notes: Scenario values are author estimates anchored on current private marks, public-insurtech comps,
    and disclosed market conditions; they are not company guidance.
