- id: bull-base-bear-scenarios
  title: Bull / base / bear scenarios and valuation logic
  body: >-
    Because Nirvana does not disclose revenue or underwriting metrics, scenario analysis is the only honest
    way to convert the evidence into valuation logic. The bull case assumes Nirvana uses its current premium,
    data, and customer momentum to disclose stronger economics rather than just larger volume. In that
    world, investors would see sustained premium growth, credible retention, loss-ratio outperformance,
    and continued state expansion; a value above $2.0 billion becomes plausible and a Series D investor
    can still earn a modestly attractive gross return.


    The base case is less exciting and, in many ways, more likely. Nirvana continues growing, but the
    current $1.5 billion mark already prices in a meaningful portion of that future success. Without audited
    evidence on margins, loss ratios, and cohort retention, the valuation range clusters near the existing
    round price. A late-stage investor may preserve capital or earn only a modest uplift, but not enough
    to justify a strong buy recommendation.


    The bear case does not require company failure; it only requires that disclosure never catches up,
    that line-wide commercial auto severity stays punishing, or that the next financing round reveals
    weaker economics than the narrative implies. In that world, the company could still be operationally
    solid and yet still be worth materially less than the Series D mark. That is why the valuation stance
    should be treated as stretched rather than clearly expensive or attractive: the mark is defensible
    only if the hidden economics are substantially better than the public evidence currently proves.
  claimRefs:
  - CV011
  - CV012
  - CV031
