- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Nirvana Series C (Mar 2025)
    - Private round
    - $830M-$850M post-money
    - Shows the last clearly reported pre-Series D anchor.
    - Still lacked hard revenue disclosure.
  - - Nirvana Series D (Dec 2025)
    - Private round
    - $1.5B post-money
    - Current entry reference point for diligence.
    - Narrative moved faster than disclosure.
  - - Cover Whale (2025)
    - Commercial-auto insurtech scale
    - $1.3B cumulative premium since 2020; $277M 2025 target; 46 states; ~5,000 agents
    - Closest disclosed telematics commercial-auto scale comp.
    - No public post-money valuation in the free-source set.
  - - Progressive (Jun 2026)
    - Public incumbent
    - $119.04B market cap
    - Ceiling benchmark for scaled public commercial-auto value and breadth.
    - Too diversified and mature to be a direct startup multiple comp.
  - - Assurant (Jun 2026)
    - Public multiline insurer
    - $12.75B market cap
    - Useful mid-scale public insurance disclosure benchmark.
    - Not a trucking pure-play and not a startup multiple comp.
  - - Lemonade (Jun 2026)
    - Public insurtech
    - $3.95B market cap; public revenue and customer disclosure
    - Useful public-insurtech transparency benchmark.
    - Different product mix and consumer orientation.
  - - HDVI / LEEO / Cover Whale product set
    - Private telematics competitors
    - Valuation not publicly disclosed in retained free sources
    - Shows Nirvana is not alone in telematics-first positioning.
    - Lack of public valuations keeps the comp table partial.
  notes: The comp set is intentionally mixed—private rounds, private operating scale, and public market
    caps—because no single perfect public comp exists for Nirvana.
  enumerationScope:
    coverage: partial
    basis: Publicly disclosed private-round marks, public market caps, and disclosed operating scale for
      the most relevant commercial-auto and insurtech comparables; many private valuations remain undisclosed.
