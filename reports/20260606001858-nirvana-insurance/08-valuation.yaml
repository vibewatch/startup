  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: Current gross written premium, net earned premium, recognized revenue, gross margin,
      and loss-ratio vintages.
    whyItMatters: Without core financials, investors cannot tell whether rapid premium growth translates
      into defensible economics or merely headline scale.
    diligencePath: Request a data room package with monthly premium, earned premium, loss ratio, retention,
      and margin by cohort and segment.
    relatedQuestionRefs:
    - QV003
    - QV004
    - QV016
    - QV030
    relatedTableRefs:
    - TV003
    - TV004
    - TV007
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Preference stack, liquidation terms, secondary activity, and reinsurance concentration.
    whyItMatters: Entry price discipline depends on whether the Series D sits above meaningful preferences
      or concentration risks that public reports do not disclose.
    diligencePath: Review the cap table, term sheet economics, and current treaty / fronting concentration
      before any valuation decision.
    relatedQuestionRefs:
    - QV003
    - QV027
    - QV030
    relatedTableRefs:
    - TV001
    - TV006
  - type: missing-source
    severity: material
    topic: independent-customer-proof
    missingEvidence: Neutral retention data, broker references, and independent complaint evidence on
      claims service quality.
    whyItMatters: Customer stories are helpful but mostly company-authored, making it hard to separate
      real service quality from marketing selection.
    diligencePath: Pull renewal, NPS, and claims-cycle outcomes from broker references plus lost-account
      reasons by segment.
    relatedQuestionRefs:
    - QV007
    - QV008
    - QV027
    relatedTableRefs:
    - TV002
    - TV006
  - type: private-evidence-only
    severity: material
    topic: product-expansion
    missingEvidence: Concrete pipeline and economics for expansion beyond current trucking products.
    whyItMatters: Optionality beyond core trucking helps justify the Series D narrative, but public proof
      is still limited.
    diligencePath: Ask for roadmap, product attach rates, state-level contribution margins, and any launch
      metrics outside the current core products.
    relatedQuestionRefs:
    - QV024
    - QV025
    relatedTableRefs:
    - TV002
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set
    missingEvidence: Private-market valuations for HDVI, LEEO / Fairmatic, and other telematics-first
      peers with directly comparable timing and economics.
    whyItMatters: The comparable table is necessarily partial because most peer valuations and unit-economics
      details remain undisclosed on free sources.
    diligencePath: Supplement the public set with paid private-market databases or direct company data
      to tighten the comp range.
    relatedQuestionRefs:
    - QV021
    - QV030
    relatedTableRefs:
    - TV004
