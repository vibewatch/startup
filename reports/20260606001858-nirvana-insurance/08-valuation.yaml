  - CV040
  - CV042
  - CV043
  - CV045
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Core financials
    - Current GWP, earned premium, revenue, gross margin, and burn.
    - These determine whether the Series D mark is being applied to real economics or just premium growth.
    - Management data room / CFO review.
  - - Underwriting quality
    - Cohort loss ratios, reserve development, and severity by state / segment.
    - Commercial-auto severity is the core downside driver in the whole thesis.
    - Actuarial diligence with reinsurer corroboration.
  - - Customer quality
    - Retention, concentration, broker mix, and lost-account reasons.
    - Customer scale matters only if it is sticky and diversified.
    - Revenue operations and broker-reference calls.
  - - Claims proof
    - Cycle times, satisfaction scores, litigation outcomes, and service staffing.
    - Claims execution now outranks price for many fleets.
    - Claims operations review plus customer references.
  - - Capital structure
    - Preference stack, secondary sales, treaty terms, and partner concentration.
    - Entry discipline depends on what sits above and around the Series D.
    - Legal / finance review of term sheets and treaties.
  - - Expansion proof
    - State-footprint reconciliation and non-core product roadmap metrics.
    - Optionality matters only if expansion is real and economic.
    - Regulatory, product, and GTM diligence.
  notes: These asks are prioritized by how quickly they would change the recommendation rather than by
    curiosity value alone.
  claimRefs:
  - CV031
  - CV038
  - CV041
  - CV044
  - CV045
- id: TV007
  title: Public disclosure versus implied valuation support
  columns:
  - Evidence area
  - What is publicly visible
  - What is still missing
  - Implication for price support
  rows:
  - - Round pricing
    - $830M-$850M Series C and $1.5B Series D are both publicly reported.
    - Preference stack and secondary activity.
    - Current mark is observable; downside protection is not.
  - - Top-line momentum
    - $100M+ premiums, doubled premium growth, thousands of carriers.
    - Recognized revenue and earned-premium conversion.
    - Supports momentum, not a clean revenue multiple.
  - - Product proof
    - Telematics pricing, AI claims, safety tooling, and customer stories.
    - Audited attach rates, ROI, and durable claims satisfaction.
    - Shows relevance, not full moat durability.
  - - Underwriting quality
    - Company claims better loss ratios and faster claims.
    - Verified cohort loss ratios and reserve development.
    - Most important unresolved gap in valuation confidence.
  - - Public market context
    - Progressive and Lemonade provide live market-cap anchors.
    - A truly comparable public telematics trucking insurer.
    - Current comp range is directional, not precise.
  notes: This table separates what is genuinely knowable today from what still requires private diligence
    before underwriting the price.
