companyProfile:
  summary: >-
    Nirvana Insurance is a private AI-native commercial insurer focused on trucking and adjacent
    commercial-auto workflows. Public materials place the company in San Francisco, identify
    Rushil Goel, Abhay Mitra, and Alex Carges as the founding team, and show a product built
    around telematics-informed underwriting, claims, and safety tooling for both fleet and
    non-fleet trucking customers. By March 2025 the company said it had surpassed $100 million in
    premiums, and by December 2025 it had raised a $100 million Series D at a reported $1.5
    billion valuation.
  founders:
    - name: Rushil Goel
      role: CEO & Co-Founder
      background: Former Samsara fleet-product leader who built Nirvana around telematics-informed trucking insurance.
      claimRefs: [CO004, CO005]
    - name: Abhay Mitra
      role: Co-Founder & CTO
      background: Technical co-founder publicly listed as part of the founding team on Nirvana's about materials.
      claimRefs: [CO006]
    - name: Alex Carges
      role: Co-Founder & Chief Actuary
      background: Founding actuary publicly identified as chief actuary in company and independent materials.
      claimRefs: [CO006, CO007]
  foundingLocation: San Francisco, CA, USA
  headquarters: San Francisco, CA, USA
  productSummary: >-
    Nirvana sells fleet and non-fleet trucking insurance with telematics-linked pricing, active
    safety services, broker workflow tools, and an in-house claims experience. The product surface
    bundles underwriting, pricing, claims triage, and safety insights rather than offering a
    standalone software subscription.
  customerFocus: >-
    Motor carriers ranging from single-owner operators and small 1-9 power-unit fleets to larger
    trucking fleets, distributed primarily through appointed brokers and agencies.
  businessModel: >-
    Premium-driven commercial insurance model with telematics-based discounts and bundled claims,
    broker, and safety tooling; exact revenue recognition, commission economics, and margin split
    are not publicly disclosed.
  stage: Series D private company
  fundingStatus: >-
    Public sources support a $57 million Series B, an $80 million Series C in March 2025 at about
    $830 million to $850 million post-money, and a $100 million Series D in December 2025 at a
    reported $1.5 billion valuation.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO004, CO005, CO006, CO007, CO021, CO022, CO025, CO027, CE016, CV031]
