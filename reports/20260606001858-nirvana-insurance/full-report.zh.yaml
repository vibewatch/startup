  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客群、买方与 ICP 画像
        blocks:
          - type: paragraph
            body: >-
              Nirvana 的公开客户证据指向一个狭窄且定义清楚的 ICP：机动车承运人，范围从单车主运营者到拥有 500 多辆卡车的车队；它们只通过获任命经纪人或零售代理购买保险。两条产品线——非车队（1–9
              个动力单元）和车队（10+ 个动力单元）——让产品界面能覆盖小承运人，同时把中型车队作为自然甜蜜点；在这个区间，车联网折扣、按客户承保模型和主动安全工具最容易创造可见价值。


              Crunchbase 将客户基础描述为覆盖单车主运营者到 500 多辆卡车车队的「数千家」机动车承运人；这与 Ascend 案例研究确认 28+ 个活跃州、官网成交页面显示 2025 年 12 月至 2026 年
              3 月有 40 到 150 个动力单元的保单交易相一致。TechCrunch 的 Series C 报道独立印证，车队和非车队客户都把车联网和 FMCSA 数据作为核心承保输入。ICP
              还受到车联网要求塑形：TruckingWay 指出，要解锁核心价值主张，车联网硬件实际上是必需的；这意味着最自然的早期买方，是已经运行 ELDs 或行车记录仪的承运人。渠道完全由经纪人中介；TruckingWay
              确认，截至 2026 年 3 月，没有直接数字绑定保单能力。
