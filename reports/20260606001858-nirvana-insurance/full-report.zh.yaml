      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              卡车保险的购买路径比许多软件市场更偏运营。车队运营商、运输高管和安全 / 合规专业人员深度参与评估，因为产品会立即影响现金流、停运时间和理赔结果。Carrier Management
              的调查拆解说得很清楚；同一调查和 Nirvana
              自己的理赔报告主题也显示，理赔执行已经成为供应商选择的核心。买方不只是购买法定保险覆盖；他们在寻找更快的理赔处理、更好的沟通，以及事故发生时能保护运营的工具。这就是车联网和摄像头证据如此重要的原因。调查结果显示，技术在理赔中的感知价值很高；Nirvana
              产品页也把 FMCSA
              集成安全工具、自动化理赔受理和承保分层定位为保险体验的一部分，而不是相邻软件。小车队和车主运营者尤其重要，因为账户宇宙明显偏向这一队列；较大车队则有更正式的安全和理赔流程。两个队列中，付款方可能是车主、CFO
              或车队高管，但用户群通常包括运营和安全负责人，他们最先感受到理赔延误的痛点。
