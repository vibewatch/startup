        - 数据科学主导定价，销售点 / API 分销
        - 不是专门的卡车运输 MGA，也未针对经纪人主导的商用车队优化
      - - Lemonade
        - 相邻 AI 保险公司替代者
        - 上市保险公司，拥有 3.14M 客户和 $258M Q1 2026 收入
        - 消费者财产和意外险、宠物险、人寿险和车险客户
