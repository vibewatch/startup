              护城河是真实的，但更像运营护城河，不是攻不破的壁垒。Nirvana
              可以合理主张一套差异化捆绑：卡车保险覆盖、车联网定价、安全支持、理赔处理和经纪人工作流；保费通胀或诉讼严重度恶化，也会让买方更在意这套全栈价值主张。但同样的市场压力也会吸引更多承保技术、促使在位者更自律，并带来更大压力，要求证明更好的数据确实能带来更好的赔付率。直接同业已经在营销车联网承保；Progressive
              拥有规模和监管肌肉；Root 和 Lemonade 等相邻数据原生保险公司展示了 API
              驱动或销售点渠道可以多快拓宽。内部自建仍是备选方案，但合规、报备、理赔和货物复杂性会让自建慢于购买现成卡车专家。护城河仍显不完整的另一个原因是，公开记录没有经审计的流失、续保或附加率数据，无法把运营宽度转化为经验证的经济耐久度。公开披露也没有展示重复经纪人胜率或账户级迁移成本，而这些数字才能证明工作流嵌入能撑过硬市场重定价周期。主要未解的公开问题是，Nirvana
