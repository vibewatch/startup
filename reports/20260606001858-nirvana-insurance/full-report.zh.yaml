  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              合适的市场边界比「所有商用保险」更窄，但又不止大型车队卡车保险。Nirvana
              明确瞄准卡车车队的商用车风险，包括传统较大车队，以及可使用车联网定价和理赔工作流的相邻小车队或车主运营者账户。这意味着相关支出包括围绕卡车风险的汽车责任险，以及配套理赔、安全和承保服务。它不应把工伤保险、网络保险或一般责任险等无关险种纳入，只因为传统保险公司把这些险种捆在同一个网站上。Progressive
              的商用门户正好让这一区分可见：商用车险与许多无关的小企业险种并列销售，这也说明边界纪律为什么重要。现状替代方案也不止一种。Progressive 这样的在位者提供捆绑商用车险承保能力；Cover Whale 和
              HDVI 等车联网原生进入者则在绑定速度、持续承保或月度保费抵免上竞争。因此，Nirvana
              的市场边界最好定义为以卡车为中心的商用车险，以及相邻小车队商用车险——在这些场景里，安全数据、理赔体验和风险分层确实会改变买方结果。
