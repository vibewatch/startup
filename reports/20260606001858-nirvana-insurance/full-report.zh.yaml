    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围与运营版图
        blocks:
          - type: paragraph
            body: >-
              Nirvana Insurance 一直把自己定位为私有 AI
              原生保险公司，聚焦商用卡车和相邻商用车险流程，而不是横向通用经纪商。核心主张是：车联网数据、理赔数据和承保模型能让公司比传统一刀切的商用车险承运人更精准地给风险定价。公开覆盖页面给出了具体运营版图：车队项目面向拥有
              10 个及以上动力单元的承运人，非车队项目面向 1 到 9 个动力单元；车队页面称公司在 28 个州运营，California 以非准入方式承保；非车队页面称小车队产品在 15 个州运营，Texas
              为非准入。公司和第三方资料都一致把总部放在 San Francisco。主要注意点是时间线漂移：官方材料称 Nirvana 成立于 2021 年，但 CB Insights 和 Ascend 都标为 2020
              年成立，因此公司年龄应作为尽调事项处理，而不是无争议事实。
