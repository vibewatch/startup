      - number: '5.3'
        title: AI、数据栈与工程运营模式
        blocks:
          - type: paragraph
            body: >-
              Nirvana 发布的架构证据比许多保险公司更多，但主要集中在数据科学和内部工程文章，而不是面向客户的文档。承保侧由按客户建模架构支撑：数据科学工作流文章称，Nirvana
              会在每个客户的数据上训练并部署新模型，然后每周或每月输出车辆级和司机级风险画像。同一篇文章点名 Metaflow 用于编写工作流，AWS Step Functions 用于编排，AWS Batch
              用于调度，EC2 作为计算环境；团队从 Fargate 迁出，是为了改善启动时间、GPU 支持和成本 / 性能。


              两篇较新的 AI 文章展示了这套栈的用法。定价文章称，Nirvana 评估数百个风险特征，包括驾驶行为、FMCSA 检查、损失指标和司机流动，并开始用协同 AI
              智能体更快生成和验证特征候选。理赔文章展示了理赔受理和保障分流的平行 AI 工作流。内部工程成熟度也可从 NirvanaMQ merge-queue 文章中看到：公司开发者超过 100 人，每年处理 7,000+
              个 pull requests，并用 Lambda、SQS 和 ECS 支撑自动化。这些来源直接证明了严肃的内部软件组织；仍属推断的是，除 DS 和理赔受理之外，这套栈有多少共享到每个面向用户的生产服务。
