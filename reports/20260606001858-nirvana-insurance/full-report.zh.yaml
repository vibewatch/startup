      - 方向
      - 时点
      - 影响
      - 尽调问题
    rows:
      - - 核爆式判决与社会通胀
        - 现代化承保的驱动因素 / 可负担性的约束
        - 当前
        - 推动车队拿出更好的证据、接受更精细的风险筛选，同时也推高价格、收缩承保胃口
        - 按细分市场核实真实判决敞口和超额层可得性
      - - 保费持续通胀和承保盈利不佳
        - 驱动因素和约束
        - 当前
        - 催生替代方案需求，但也挤压买方预算
        - 检查目标车队队列的续保报价和项目结构
      - - 车联网、行车记录仪和 FMCSA 关联安全数据
        - 驱动因素
        - 当前
        - 支撑差异化定价、辅导、反欺诈和更快理赔
        - 按车队规模衡量安装率和数据共享准备度
      - - AI 承保和 AI 辅助理赔自动化
        - 驱动因素
        - 当前到近期
        - 可以压缩报价和理赔周期，但需要数据和工作流设计获得信任
        - 要求提供已测量的周期缩短幅度和赔付率证据
      - - 按使用量 / 里程挂钩定价
        - 驱动因素
        - 近期
        - 对使用率波动的小中型车队有吸引力
        - 测试客户是否真的更偏好按里程定价，而不是固定保费模型
      - - 司机短缺和经验水平不稳定
        - 约束
        - 当前
        - 可能提高事故风险，拖累承保结果
        - 评估承保如何惩罚高流失率和新手司机组合
      - - 承保容量退出和超额层收紧
        - 约束
        - 当前
        - 让大型车队或亏损记录较差车队面临更硬的市场
        - 收集经纪人证据，判断哪些层最难安排承保
      - - 加州式监管和诉讼复杂性
        - 约束
        - 当前
        - 抬高合规负担，也可能减少愿意承保的保险公司
        - 梳理哪些州在容量和定价上最像加州
      - - EV、ADAS 和维修成本通胀
        - 约束
        - 近期
        - 推高维修损失严重度、网络风险和停工风险
        - 量化不同动力系统混编车队当下如何被定价
    notes: 有几行既是增长驱动因素，也是约束：让车联网原生承保更有吸引力的力量，也让这个险种更难定价、更难安排承保。
