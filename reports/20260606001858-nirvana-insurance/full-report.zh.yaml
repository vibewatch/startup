  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 重要性
      - 什么会改变判断
    rows:
      - - 庞大且碎片化的市场
        - ATA 和 TechCrunch 支持一个规模很大且仍低效的卡车保险机会。
        - 仅有市场规模不够；还需要证明 Nirvana 能把份额增长转成有吸引力的经济性。
      - - 数据和产品深度
        - 20B+ 到 32B+ 车联网里程，加上 AI 理赔和安全工具，支撑起可信的产品逻辑。
        - 若披露的损失率或留存数据证实数据优势可持续，则上调判断。
      - - 投资人质量和需求
        - Series C 和 D 轮都有强投资人支持，并被描述为提前出手的交易。
        - 如果下一轮披露显示利润率或损失率质量偏弱，需求强度的重要性会下降。
      - - 竞争差异化并非独家
        - HDVI、Cover Whale 和 LEEO 也销售车联网优先的商用车险解决方案。
        - 只有 Nirvana 证明经济性或留存显著优于同业，判断才会改善。
      - - 披露缺口是核心反向逻辑
        - 没有公开硬收入、利润率或损失率序列。
        - 公开或私下分享核心财务和承保指标。
      - - 服务验证偏薄
        - 独立投诉和评价的深度仍有限。
        - 经纪人访谈和留存数据可显著提高置信度。
    notes: 正向和反向逻辑都有证据支撑；建议只应随证据组合变化而调整，而不是因为公司故事听起来有吸引力。
    claimRefs:
      - CV008
      - CV009
      - CV015
      - CV022
      - CV025
      - CV031
      - CV039
      - CV040
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值逻辑
      - 毛回报判断
      - 关键风险 / 概率信号
    rows:
      - - 乐观
        - 披露保费到收入的转化、持久承保质量、更广的州覆盖，以及持续赢得客户。
        - 在经济性证据更强且增长延续时，隐含价值为 $2.0B-$2.8B。
        - 相对 Series D 进入价为 ~1.3x-1.9x
        - 需要经济性披露，以及增长有利润、而不只是快的证据。
      - - 基准
        - Nirvana 继续增长，但披露仍不完整，险种环境仍艰难。
        - 价值区间 $1.2B-$1.8B，大致围绕当前私募估值标记。
        - ~0.8x-1.2x
        - 若增长延续但没有重大正面披露催化剂，这是最可能情景。
      - - 悲观
        - 降价轮信号、顽固的险种严重度，或披露的经济性偏弱。
        - 价值区间 $0.6B-$1.0B。
        - ~0.4x-0.7x
        - 高严重度市场环境和缺乏透明承保证据，会抬高该情景概率。
    notes: 情景估值是作者估算，锚定当前私募估值标记、上市 insurtech 可比公司和已披露市场条件；不是公司指引。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV043
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Nirvana Series C (Mar 2025)
        - 私募轮
        - 投后 $830M-$850M
        - 显示 Series D 前最后一个明确报道的锚点。
        - 仍缺少硬收入披露。
      - - Nirvana Series D (Dec 2025)
        - 私募轮
        - 投后 $1.5B
        - 当前尽调的进入参考点。
        - 叙事跑在披露前面。
      - - Cover Whale (2025)
        - 商用车险 insurtech 规模
        - 自 2020 起累计保费 $1.3B；2025 目标 $277M；46 个州；约 5,000 名代理
        - 最接近且已披露的车联网商用车险规模可比对象。
        - 免费来源集合中没有公开投后估值。
      - - Progressive (Jun 2026)
        - 上市在位公司
        - 市值 $119.04B
        - 为成熟上市商用车险价值和业务宽度提供上限基准。
        - 业务过于多元且成熟，不能直接作为创业公司倍数可比对象。
      - - Assurant (Jun 2026)
        - 上市多险种保险公司
        - 市值 $12.75B
        - 有用的中等规模上市保险披露基准。
        - 不是纯卡车保险公司，也不是创业公司倍数可比对象。
      - - Lemonade (Jun 2026)
        - 上市 insurtech
        - 市值 $3.95B；公开收入和客户披露
        - 有用的上市 insurtech 透明度基准。
        - 产品组合和消费者导向不同。
      - - HDVI / LEEO / Cover Whale 产品组合
        - 私营车联网竞争者
        - 保留的免费来源未公开估值
        - 显示 Nirvana 并非唯一主打车联网优先定位的公司。
        - 缺少公开估值让可比表仍不完整。
    notes: 可比集合有意混合了私募轮、私营公司运营规模和公开市值，因为 Nirvana 没有单一完美上市可比对象。
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly disclosed private-round marks, public market caps, and disclosed operating scale for the most relevant
        commercial-auto and insurtech comparables; many private valuations remain undisclosed.
