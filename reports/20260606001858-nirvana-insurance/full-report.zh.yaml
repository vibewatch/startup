  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 数据、理赔和市场赔付严重度一旦失灵，会如何传导到利润率、增长和融资结果。
    data:
      nodes:
        - id: market_severity
          label: 商用车险赔付严重度维持高位
          detail: 赔付率、保费与侵权成本持续不利。
          tone: negative
        - id: pricing_pressure
          label: 定价充足性承压
          detail: 保费增长无法抵消赔付严重度和理赔通胀。
          tone: warning
        - id: claims_failure
          label: 理赔服务交付不足
          detail: 理赔变慢或争议增加，推高流失并加剧经纪人摩擦。
          tone: negative
        - id: data_failure
          label: 车联网数据或证据链失效
          detail: 数据中断或证据薄弱，会伤害定价和免责证明。
          tone: negative
        - id: security_event
          label: 安全 / 隐私事件
          detail: 敏感车队数据遭误用、泄露或被质疑。
          tone: negative
        - id: retention_damage
          label: 留存与分销受损
          detail: 经纪人和车队对服务和控制失去信心。
          tone: negative
        - id: capital_pressure
          label: 资本 / 再保险承压
          detail: 亏损、事件或波动之后，合作伙伴收紧条款。
          tone: negative
        - id: thesis_break
          label: 投资逻辑破裂
          detail: 增长不再足以补偿赔付严重度和控制风险。
          tone: negative
      edges:
        - from: market_severity
          to: pricing_pressure
          label: 赔付严重度挤压承保利润率
        - from: pricing_pressure
          to: capital_pressure
          label: 业绩走弱压迫再保险合约和资本
        - from: claims_failure
          to: retention_damage
          label: 服务失灵推高流失并引发经纪人怀疑
        - from: data_failure
          to: claims_failure
          label: 证据薄弱拖慢理赔和争议解决
        - from: data_failure
          to: pricing_pressure
          label: 输入变差拉低承保质量
        - from: security_event
          to: retention_damage
          label: 泄露或误用损害信任
        - from: security_event
          to: capital_pressure
          label: 事件招致合作伙伴和监管机构更严审视
        - from: retention_damage
          to: thesis_break
          label: 增长和续保经济性走弱
        - from: capital_pressure
          to: thesis_break
          label: 承保容量或定价优势被侵蚀
    claimRefs:
