  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与商业工作流
        blocks:
          - type: paragraph
            body: >-
              Nirvana 的产品不是独立软件订阅，而是一套承保并服务商用卡车保险的运营工作流。公开产品界面清楚分成面向 10+ 个动力单元车队的 Fleet Insurance Program，以及面向 1–9
              个动力单元的 Non-Fleet Trucking Program。两条路径里，客户工作流都从经纪人或被保险人接入车联网数据、共享损失记录和 FMCSA 背景开始，然后收到一份报价，承诺更安全车队可获得最高
              20% 前置折扣，并在保单期内保持费率稳定。车队项目增加按行驶付费计费和更明确的安全工具；非车队项目强调固定保费和可预测的批单定价。


              直接证据显示，Nirvana 把保险、定价逻辑、理赔服务和安全辅导打包在一起。首页、车队页、非车队页和车联网页面反复把车联网输入与前置折扣、月度账单透明度和理赔支持相连。TechCrunch 2025 年 3
              月报道独立印证，Nirvana 在车队和非车队客户的使用量计费商用车险承保中使用车联网数据和 FMCSA 数据。因此，该产品竞争时更不像通用仪表盘，而更像面向卡车运营商、经纪人和安全经理的全栈保险工作流。
