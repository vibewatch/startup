      - number: '2.4'
        title: 增长驱动、车联网动态、理赔成本压力与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动不是抽象数字化，而是受损商用车险市场的硬经济账。保费在涨，综合成本率多年高于 100，ATRI 称责任险保费八年内每英里上涨
              36%，核级或热核级判决继续推高赔付严重度。这些压力让更好的风险分层、主动安全项目和更快理赔解决具备商业吸引力。车联网动态进一步强化这一判断。Nirvana 材料、Carrier Chronicles
              和多份调查页面都显示，摄像头、AI 警报、FMCSA 关联安全数据和理赔证据，正在从可选工具变成预期基础设施。但同样的力量也带来约束。California
              展示了监管强度、社会通胀和保险承运人退出如何压缩可负担承保能力。司机短缺、维修通胀、EV 复杂性和数据共享要求，也会拖慢采用或抬高切换摩擦。最重要的是，公开尽调仍没有给出干净的 TAM 或
              SAM。官方来源告诉我们卡车运输经济庞大、承运人基础分散；市场评论告诉我们这一险种承压；供应商赞助调查告诉我们买方想要更好的理赔和技术。它们尚未给出一个权威、独立的卡车保险保费池，并按车队规模和车联网准备度切分。这个未解决缺口应继续留在章节中，而不是被反推出虚假的确定性。
