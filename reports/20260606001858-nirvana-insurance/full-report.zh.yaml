      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景与估值逻辑
        blocks:
          - type: paragraph
            body: >-
              Nirvana 不披露收入或承保指标，因此情景分析是把证据转成估值逻辑的唯一诚实方法。乐观情景假设 Nirvana
              利用当前保费、数据和客户动能披露更强经济性，而不只是更大规模。在这个世界里，投资人会看到持续保费增长、可信留存、赔付率跑赢和持续州扩张；超过 $2.0B 的价值变得合理，Series D
              投资人仍可能赚到温和但有吸引力的总回报。


              基准情景没那么激动人心，而且在很多方面更可能发生。Nirvana 继续增长，但当前 $1.5B
              作价已经把相当一部分未来成功计入价格。没有关于利润率、赔付率和队列留存的经审计证据，估值区间会聚在现有轮次价格附近。后期投资人可能保住资本，或只赚到温和上行，但不足以支撑强买入建议。


              悲观情景不需要公司失败；只要披露始终追不上，商业车险全行业严重度继续高压，或下一轮融资暴露出弱于叙事暗示的经济性，就足够了。在这个世界里，公司仍可能运营扎实，却仍然显著低于 Series D
              作价。因此，估值姿态应被视为偏高，而不是明确昂贵或有吸引力：只有当隐藏经济性显著好于当前公开证据所能证明的水平时，这个作价才站得住。
            claimRefs:
              - CV011
              - CV012
              - CV031
              - CV033
              - CV034
              - CV035
              - CV036
              - CV043
          - type: table
            tableRef: TV003
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV036
              - CV043
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV036
      - number: '8.4'
        title: 建议、尽调询问事项与投资逻辑失效触发器
        blocks:
          - type: paragraph
            body: >-
              建议是继续研究 / 观察，置信度中等，风险高，估值姿态偏高。公开证据证明 Nirvana
              是一家可信、快速增长的商业车险保险科技公司，拥有复杂数据、强投资人组合和客户牵引力。但公开证据还不能证明当前价格有吸引力。缺失的部分正是投资委员会在 $1.5B
              入场价上形成信念所需要的内容：已赚收入、利润率结构、赔付率序列、客户集中度、留存和资本结构细节。


              建议可以上调，但前提是管理层清掉一组精简的决策关键问题。最低限度，投资人需要队列级经济性、合约细节，以及理赔满意度和承保质量在公司自有营销材料之外具备耐久性的证据。如果这些披露显示 Nirvana
              能把保费增长转化为盈利承保和可重复客户留存，那么回头看当前作价可能公平，甚至略有吸引力。


              在此之前，投资逻辑会被四个可观察条件打穿：一轮持平或下行融资暴露出弱于预期的经济性；安全或理赔服务事件损害经纪人信任；公司在继续融资的同时仍无法展示披露经济性；或者市场严重度高到即便车联网驱动承保也无法显示跑赢行业的结果。这些不是边缘情形，而是当前估值要求投资人忽视的核心下行路径。
