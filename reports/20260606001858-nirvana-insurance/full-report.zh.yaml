      - number: '5.2'
        title: 理赔、安全与运营用例
        blocks:
          - type: paragraph
            body: >-
              报价并绑定保单之后，证据最直接的工作流是理赔处理和主动安全。Nirvana 理赔页面承诺可通过在线表单、电话或电子邮件 24/7 受理，在 24
              个工作小时内响应，并对未结理赔每周更新。同一页面称，理赔由内部卡车专家处理，并使用车联网和摄像头证据。较新的公司工程文章把运营流程讲得更具体：首次损失通知（FNOL）邮件由 AI
              解析为结构化案件数据，附件自动汇总，保单引擎在人工复核前先给理赔员初步保障视图。


              安全既是产品价值，也强化承保。Active Safety 随保单一起提供；Safety Intelligence Platform 汇总 FMCSA
              和车联网数据，浮出个性化建议、司机排名、检查热点地图，并突出推高风险的 BASIC
              类别。这让产品工作流从线性变成闭环：车联网帮助赢得保单，安全工具在保单期内塑造驾驶行为，理赔遥测帮助更快结案。即使背后的精确模型表现指标没有完全披露，这一整合闭环在官方材料中已有充分证据。
