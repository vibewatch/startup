      - number: '6.3'
        title: 留存信号与满意度证据
        blocks:
          - type: paragraph
            body: >-
              直接留存指标——NRR、GRR 或年度流失率——没有公开披露。可用证据由续保轶事、聚合第三方评分，以及 Nirvana 自己发布或赞助的市场研究构成。Five Star 和 Red Stag
              都在成功故事中明确确认续保；月度成交页面显示，到 2026 年 3 月，新业务旁边持续出现续保交易，这与活跃续保管线一致，但不揭示总体留存率。


              Nirvana 的 2025 Claims Experience Report 调查了 100 名车队决策者，发现 88% 认为当前保险公司的理赔流程需要重大改善，51% 把更快理赔解决列为唯一最高诉求，86%
              支持在理赔服务中扩大使用车联网和摄像头数据。同一研究的理赔主题 2 发现，94% 受访者认为技术在理赔中极其有用，82% 自愿使用车内摄像头，77% 使用车联网或行车记录仪影像。理赔主题 4 记录显示，80%
              现在把快速可靠的理赔处理列为首要事项，高于优先考虑成本的 62%；同时 53% 认为摄像头证据应帮助决定赔案和解。Carrier Management 和 Ledger360 对 100
              名车队运营商做的独立调查发现，近四分之一曾因理赔体验不满意而更换保险公司，且 68% 运营 250 辆及以下卡车的车队，正是 Nirvana 最直接瞄准的细分。平均受访者每年申报 9.3
              起理赔，使理赔服务质量成为反复出现的高频触点，而不是罕见事件。


              GMG Express 的安全经理称，每周更新和实时理赔历史完全扭转了前供应商让他「数周处在黑箱中」的体验；TTR Shipping
              确认，过去需要一个月才能拿到的安全数据现在可即时获得。即便没有外部审计，这些也是直接满意度信号。
