  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与披露缺口
        blocks:
          - type: paragraph
            body: >-
              公开证据显示融资动能真实存在。独立报道将 Nirvana 2025 年 3 月 Series C 描述为 $80M、投后估值约 $830M 至 $850M；随后 2025 年 12 月 Series D 为
              $100M、估值 $1.5B。到 Series D 时，Crunchbase 称累计融资超过 $260M，公司保费同比增长翻倍，员工数大约翻到约 200
              人，并服务数千家汽车承运商。这些信号并不轻：它们显示了投资人需求，也显示公司在一个困难保险类别中有运营牵引力。


              但披露层没有跟上估值层。公开来源给出了保费增长、车联网里程和客户数量描述，却仍未披露硬收入、净已赚保费、毛利率、留存或经审计的赔付率序列。这让 Series D
              特别难以用常规后期软件或保险启发式方法承保。没有完整公开细节时，私人作价仍可能方向上合理；但在大约九个月内从 $830M 估值走到
              $1.5B，同时拒绝公布收入或承保质量数据，投资人承保的更多是叙事速度，而不是财务证明。


              因此，正确结论是喜忧参半。Series D 看起来由需求驱动，而不是困境融资；Nirvana
              也明显吸引了高质量投资人。与此同时，融资背景仍对价格敏感：没有经济性披露，投资人无法知道这一轮买到的是有吸引力的可选性，还是过于激进地资本化了未来预期。这个缺口把建议从买入推向继续研究 /
              观察，尽管公司仍有动能。
