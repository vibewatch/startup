  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 以 $1.5B Series D 入场价计算的企业价值和总回报情景区间。
    data:
      items:
        - label: 乐观情景价值（$B）
          low: 2
          mid: 2.4
          high: 2.8
          displayValue: $2.0B-$2.8B
          detail: 需要披露经济性、持续增长，并证明承保质量可以规模化。
          tone: positive
        - label: 基准情景价值（$B）
          low: 1.2
          mid: 1.5
          high: 1.8
          displayValue: $1.2B-$1.8B
          detail: 运营成功延续，但披露仍不完整，上行大多已计入价格。
          tone: neutral
        - label: 悲观情景价值（$B）
          low: 0.6
          mid: 0.8
          high: 1
          displayValue: $0.6B-$1.0B
          detail: 增长放缓、经济性不及预期，或市场赔付严重度迫使估值重置。
          tone: negative
        - label: 乐观情景总 MOIC
          low: 1.3
          mid: 1.6
          high: 1.9
          displayValue: 1.3x-1.9x
          detail: 乐观情景下相对 Series D 入场价的总回报区间。
          tone: positive
        - label: 基准情景总 MOIC
          low: 0.8
          mid: 1
          high: 1.2
          displayValue: 0.8x-1.2x
          detail: 基准情景下保本到小幅上行。
          tone: neutral
        - label: 悲观情景总 MOIC
          low: 0.4
          mid: 0.5
          high: 0.7
          displayValue: 0.4x-0.7x
          detail: 如果下一轮融资或披露周期不及预期，资本会出现显著损失。
          tone: negative
    approximationNotes: 所有区间都是作者估计，锚定公开融资估值、公开市场可比公司和商用车险风险环境；扣除优先权、费用和稀释后，净回报会更低。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
