      - number: '6.2'
        title: 具名客户证明与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              最强客户证据来自五篇公司发布的成功故事，每篇都锚定一个不同用例。Five Star Trucking 是一家覆盖 48 州的整车运输承运人兼完整经纪业务，成立于 1974 年；在第一年被描述为「没有意外」后，它与
              Nirvana 续保——这是一个直接续保信号，与定价可预测性和安全项目参与相连。Red Stag 是 Texas 承运人，拥有 150+ 个动力单元，2023 年 10 月成为客户，并至少续保到第二年。Red
              Stag 的安全副总裁称，Nirvana 的 Safety Intelligence Platform 整合了 FMCSA 和车联网数据，而这些数据以前需要在多个系统中手工处理。TX Load Runners
              是一家拥有 46 辆卡车的 Texas 承运人，通过安全代理链接在三分钟内接入车联网，并专门因为前置数据驱动定价折扣选择 Nirvana——这是它此前评估过的承运人中独有的工作流。TTR Shipping
              之前长期面对安全违规和前任保险方沟通差的问题；切换后，其团队把安全评分提升了 50%，并把 Safety Platform 称为「每日指挥中心」，过去需要一个月才能拿到的数据现在可即时访问。GMG Express
              则是在前供应商反复不调查就关闭理赔后切换；转到 Nirvana 后，其安全经理每周收到理赔更新邮件，并在 Safety Platform 查看完整理赔历史——这与前保险方让他「数周处在黑箱中」形成鲜明对比。


              具名故事之外，FeaturedCustomers 聚合了 9 条客户证言、7 个案例研究和 137 个推荐评分，评分 4.8/5.0。覆盖 2025 年 12 月至 2026 年 3
              月的公司成交页面显示了新业务和续保交易，包括 California 一家 $1.6M、150 单元冷藏承运人（2025 年 12 月）、Iowa 一支 $1.2M、80 单元冷藏车队（2026 年 3 月），以及
              California 一家 $910K、60 单元承运人（2026 年 3 月）；还有 Missouri、Illinois 和 Texas 多个 40–70 个动力单元的小账户。Ascend
              计费平台案例研究称，Nirvana 在扩张非车队项目时让零售预约增加 2x，并省下 1 个 FTE 招聘，暗示代理渠道的新业务速度很快。
