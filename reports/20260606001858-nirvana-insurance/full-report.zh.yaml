      - number: '8.2'
        title: 投资逻辑、反向逻辑与可比框架
        blocks:
          - type: paragraph
            body: >-
              投资逻辑立在三根公开支柱上。第一，Nirvana 面向的市场非常大：TechCrunch 和 ATA 将 2024 年美国卡车货运收入放在约 $900B 至 $906B，ATA
              还说承运商基础高度碎片化，91.5% 的承运商运营 10 辆及以下卡车。第二，Nirvana 有可见的产品和数据证明。公开材料描述了车联网优先定价、AI 支持理赔、主动安全，以及一个从 2025 年 3 月超过
              20B 英里增长到 2025 年 12 月 30B+、又到 2026 年 6 月首页 32B+ 的数据资产。第三，至少有一些客户证据：Nirvana 发布了新的 2026 年 6 月客户故事，并称 TTR
              Shipping 将安全评分提高了 50%。


              反向逻辑同样重要。公开经济性证明仍然薄弱，竞争定位也没有标题暗示的那么独特。HDVI、Cover Whale 和 LEEO 都在营销车联网驱动的定价或安全项目；Cover Whale 已声称覆盖 46 个州、接近
              5,000 名代理、累计保费超过 $1.3B，并把 2025 年毛承保保费目标定为 $277M。与此同时，Progressive 以 50 多年历史和 30 多种保障构成传统巨头的覆盖广度基准；Lemonade
              则展示了当市值能和可见收入、客户指标比较时，上市保险科技公司披露应是什么样。Nirvana 夹在两者之间：比宽泛传统巨头更专注，也可能目标更准，但透明度远低于上市保险科技公司。


              这个可比框架反对虚假的精确。相对 Lemonade $3.95B 市值或 Progressive $119B 市值，Nirvana 的 $1.5B
              作价并不明显荒谬，但任何一个比较都不能说明价格便宜。相反，公开可比组说明 Nirvana 已经在为有意义的未来成功定价；它需要把数据和理赔叙事转化为披露出来的承保质量，才能证明进一步倍数扩张合理。
