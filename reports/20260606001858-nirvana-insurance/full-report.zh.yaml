        - 处理 900,000+ 笔交易，约 5,000 家代理机构，覆盖 46 个州，已处理交易额 $1.4B+
        - 商用车险中的代理、车队和保险公司合作伙伴
        - 18 分钟承保绑定流程、持续承保、司机辅导、API 式保险公司合作
        - 保障宽度聚焦商用车险，实际定价仍不透明
      - - Progressive Commercial
        - 传统替代者
        - '2024 年承保保费数据下的美国 #1 卡车保险公司；50+ 年经验'
        - 卡车司机、车主兼司机、车队和小企业
        - 全国规模、多渠道分销、监管文件支持和广泛保障菜单
        - 公开叙事较少把车联网原生安全工具当作核心销售切入点
