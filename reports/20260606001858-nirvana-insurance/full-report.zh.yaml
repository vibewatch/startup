      - - 非车队卡车保单
        - 通过 Ascend 支持流程销售的保险保费
        - 项目公开可见；实际经济性不公开
        - 公开案例展示的是预约量提升，不是保费收益
        - Ascend 案例研究
        - 需要保单数量、每账户保费，以及各渠道转化率。
      - - 经纪人渠道流程
        - 可绑定报价流程可能靠保险保费和佣金变现
        - 流程公开；佣金经济性不公开
        - 直营与经纪渠道的经济性拆分未知
        - Agents 页面
        - 需要佣金结构，以及经纪渠道对总书面保费的贡献。
      - - 理赔与安全组合
        - 包含在保单价值主张中
        - 未公开单独费率表
        - 定价是否明确覆盖这些服务成本仍未知
        - Claims / Active Safety / AI Claims 页面
        - 需要每笔理赔和每个安全管理账户的单位成本。
