          value: 1.5
        - label: 乐观情景中点（$B）
          value: 2.4
        - label: 基准情景中点（$B）
          value: 1.5
        - label: 悲观情景中点（$B）
          value: 0.8
        - label: 若披露不及预期的隐含减记（$B）
          value: 0.7
    approximationNotes: 乐观、基准和悲观柱形是基于 TV003 与 FV003 区间的分析情景中点，并非公司指引或市场报价。
