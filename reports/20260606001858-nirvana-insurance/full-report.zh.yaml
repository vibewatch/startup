      - number: '4.4'
        title: 财务阻断点与结论
        blocks:
          - type: paragraph
            body: >-
              尽调卡点不是 Nirvana
              是否有真实商业活动。保留来源强烈显示它确实有。卡点在于，尽调团队能否有足够信心把保费规模与净收入、利润率和现金消耗分开，从而支撑下行情景。市场来源指向艰难背景：商用车险保费仍在上升，综合成本率过去十年大部分时间高于
              100%，核级判决继续加重准备金和责任压力。Nirvana
              的公开回答是更好定价、更快理赔、更多安全信号和新资本。这些方向上可能都正确，但不能替代经审计披露。公开记录也没有显示客户集中度、续保耐久度或准备金发展；因此，即便需求判断偏正面，利润率波动的真实下行不确定性仍在。另一个未解点是，据报道的牵引力在扣除理赔和服务成本后，有多少能转化为可持续留存经济性。因此，财务结论是：增长和数据优势具建设性，但在管理层提供现金、债务、集中度和盈利细节之前，仍需谨慎看待收入质量、利润率路径和融资依赖。
