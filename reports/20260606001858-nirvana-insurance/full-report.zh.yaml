  - id: TV005
    title: 投资逻辑破裂和否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 持平或降价融资轮
        - 下一轮定价等于或低于 Series D
        - 证实隐藏经济性弱于预期，并压缩回报测算。
        - 在重新测算经济性前，视为投资逻辑破裂。
      - - 持续披露缺口
        - 管理层在尽调中仍不分享核心收入和损失率数据
        - 即便运营动能存在，也无法完成估值测算。
        - 不按当前价格投入。
      - - 理赔或安全信任事件
        - 重大服务失效、泄露或证据完整性事件公开
        - 损害经纪人信任，削弱续约假设。
        - 升级到红色尽调轨道，并重切估值。
      - - 商用车险严重度维持高位
        - 该险种范围内通胀、侵权成本和保费压力持续，且没有更优承保的抵消证据
        - 降低 Nirvana 结构性跑赢市场的概率。
        - 下调乐观情景概率，并提高折现率。
      - - 代理渠道约束持续
        - 分销仍狭窄，或州扩张停滞
        - 相比标题 TAM，限制高效扩张。
        - 下调增长假设，并要求更多客户集中度数据。
    notes: 每个触发项都可观察，并与估值传导相连，而不只是抽象的公司质量问题。
    claimRefs:
      - CV023
      - CV031
      - CV035
      - CV040
      - CV042
      - CV043
      - CV045
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 核心财务
        - 当前 GWP、已赚保费、收入、毛利率和烧钱速度。
        - 这些决定 Series D 估值标记对应的是真实经济性，还是仅仅保费增长。
        - 管理层资料室 / CFO 审查。
      - - 承保质量
        - 按州 / 细分市场拆分的队列损失率、准备金发展和严重度。
        - 商用车险严重度是整个逻辑里的核心下行驱动。
        - 精算尽调，并由再保险人佐证。
      - - 客户质量
        - 留存、集中度、经纪人组合和客户流失原因。
        - 客户规模只有在粘性强且多元化时才有意义。
        - 收入运营和经纪人访谈。
      - - 理赔证明
        - 周期时间、满意度评分、诉讼结果和服务人员配置。
        - 对许多车队而言，理赔执行现在比价格更重要。
        - 理赔运营审查，加客户访谈。
      - - 资本结构
        - 优先股堆叠、老股交易、合约条款和伙伴集中度。
        - 进入纪律取决于 Series D 之上及周边的安排。
        - 法务 / 财务审查投资条款清单和再保险合约。
      - - 扩张证明
        - 州覆盖口径核对，以及非核心产品路线图指标。
        - 只有扩张真实且具备经济性，期权价值才有意义。
        - 监管、产品和 GTM 尽调。
    notes: 这些索取项按多快会改变建议来排序，而不是只看好奇价值。
    claimRefs:
      - CV031
      - CV038
      - CV041
      - CV044
      - CV045
  - id: TV007
    title: 公开披露与隐含估值支撑
    columns:
      - 证据领域
      - 公开可见内容
      - 仍缺失内容
      - 对价格支撑的含义
    rows:
      - - 轮次定价
        - $830M-$850M 的 Series C 轮和 $1.5B 的 Series D 轮均有公开报道。
        - 优先股堆叠和老股交易活动。
        - 当前估值可观察；下行保护仍不可见。
      - - 保费规模动能
        - $100M+ 保费、保费增长翻倍、数千家运输承运商。
        - 确认收入与已赚保费转化。
        - 能支撑增长动能，但不能给出干净的收入倍数。
      - - 产品验证
        - 车联网定价、AI 理赔、安全工具和客户故事。
        - 经审计的附加率、ROI 和持久的理赔满意度。
        - 说明产品切中需求，但还不能证明护城河耐久。
      - - 承保质量
        - 公司称损失率更好、理赔更快。
        - 经验证的队列损失率和准备金发展情况。
        - 这是估值信心里最重要的未解证据缺口。
      - - 公开市场参照
        - Progressive 和 Lemonade 提供实时市值锚点。
        - 真正可比的上市车联网卡车保险公司。
        - 当前可比区间只能指方向，不能给精确锚点。
    notes: 本表把当下真正可知的信息，与承保价格前仍需私下尽调的信息分开。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV019
      - CV031
      - CV041
      - CV045
      - CV048
