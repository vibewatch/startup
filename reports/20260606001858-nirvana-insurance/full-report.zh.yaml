  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 依据
    rows:
      - - 建议
        - 继续研究 / 观察
        - 动能真实存在，但公开证据尚不足以支持按 $1.5B 标记全力买入。
      - - 置信度
        - 中
        - 融资、客户规模和数据深度可见；收入和承保质量不可见。
      - - 风险评级
        - 高
        - 商用车险严重度、披露缺口和执行依赖让下行风险不小。
      - - 估值立场
        - 偏高
        - 私募估值标记跑在公开披露基础前面。
      - - 决策含义
        - 不要仅凭公开证据完成投资测算
        - 按 Series D 价格投入前，必须拿到财务、损失率和资本结构细节。
    notes: 评估仅反映截至 2026-06-06 的公开证据；它明确对价格和证据敏感，不是泛泛的公司质量评分。
