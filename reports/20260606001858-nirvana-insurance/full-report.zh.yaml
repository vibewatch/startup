  - id: TR005
    title: 缓释措施和否决标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 理赔服务失效
        - 与理赔处理相关的经纪人或被保险人流失
        - 连续两个季度出现与理赔相关的投诉上升或客户流失证据。
        - 暂停乐观估值判断；新资金进入前要求看到服务整改证据。
      - - 大额损失严重度
        - 不利准备金冲击或再保险收缩
        - 任何可见的合约收紧、自留层上升或容量退出。
        - 在审查更新后的资本和合约计划前，视为投资逻辑破裂。
      - - 安全 / 隐私事件
        - 公开泄露或数据滥用事件
        - 涉及车联网、理赔或摄像头数据的重大事件。
        - 升级到红色尽调轨道；重新评估承保和留存假设。
      - - 州覆盖治理漂移
        - 公开州数量仍无法对齐
        - 核心公开材料中的州可用性说法持续不一致。
        - 将治理和合规控制视为弱于管理层说法。
      - - California 扩张不及预期
        - California 亏损经验或代理牵引不及预期
        - California 定价充足性低于计划，或留存代理采用不及预期的证据。
        - 下调增长假设，把 California 视为利润率逆风，而不是催化剂。
      - - 全市场严重度持续
        - 商用车险通胀跑赢车联网收益
        - 保费通胀和侵权严重度持续，但没有更优损失率的抵消证据。
        - 将判断从差异化保险公司，调整为同样暴露在硬市场挤压下的保险公司。
    notes: 触发项用于尽调监控，依赖具体运营或市场事件，而不是直觉。
