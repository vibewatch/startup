  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、在位者、相邻方与替代方案
        blocks:
          - type: paragraph
            body: >-
              Nirvana 并不在一个整齐的同业框里竞争。最接近的直接同业，是车联网优先的商用车险 MGA，它们承诺为卡车风险提供更快报价和更动态的承保，尤其是 HDVI、Cover Whale 和 Fairmatic 的
              Leeo 品牌。Progressive 重要但原因不同：它代表现状在位者，拥有全国规模、广覆盖菜单、报备经验和多渠道分销引擎，许多车队和经纪人已经信任它。Root 和 Lemonade
              是相邻替代方，不是干净的一对一卡车同业，但它们重要，因为它们展示了数据原生保险公司如何从数字直销延伸到销售点和 API 驱动入口。实际购买集合因此包括直接卡车保险科技公司、在位承运人、经纪人 -
              承运人组合，以及内部工作流拼接，而不只是少数风投支持的初创公司。
