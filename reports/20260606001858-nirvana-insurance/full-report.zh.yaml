  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 从市场和证明信号出发，经过披露和风险过滤，最终落到推荐结论。
    data:
      nodes:
        - id: market
          label: 庞大且分散的市场
          detail: ATA 与 TechCrunch 的材料指向一个庞大但仍低效的卡车运输市场。
          tone: positive
        - id: proof
          label: 可见增长与产品证明
          detail: 私募融资轮、车联网里程和客户证据显示真实动能。
          tone: positive
        - id: gap
          label: 披露缺口
          detail: 公开资料没有硬性的收入、利润率或赔付率序列。
          tone: risk
        - id: risk
          label: 商用车险赔付严重度风险
          detail: 全行业保费和侵权压力让下行情景尾部仍然很厚。
          tone: warning
        - id: decision
          label: 建议：继续研究 / 观察
