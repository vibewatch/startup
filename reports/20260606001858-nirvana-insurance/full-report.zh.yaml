      - number: '6.4'
        title: 扩张路径与客户风险
        blocks:
          - type: paragraph
            body: >-
              公开扩张故事方向上正面，但经济性披露薄。Crunchbase 报道，Nirvana 在 2025 年保费同比增长翻倍，员工数也翻倍至约 200。Series D 公告和 PR Newswire
              报道确认，公司继续投资，在美国卡车运输市场同时扩张车队和非车队项目。Ascend 案例显示，非车队项目可以在不按比例增加后台人手的情况下扩张代理分销；这很重要，因为渠道完全由代理中介。


              TruckingWay 是保留缓存中最实质的独立评测；截至 2026 年 3 月，它记录了三个具体限制：覆盖只在 26–27
              个州活跃；报价完全由代理中介，被保险人没有直接数字绑定路径；截至该日期，Trustpilot、Google Reviews、BBB 或 TruckersReport
              论坛条目为零。缺少独立消费者级评价，意味着满意度证据完全依赖公司策划的成功故事和 FeaturedCustomers；后者聚合的是客户推荐证言，而不是匿名购买者评论。Ascend 的「28+ 个州」与
              TruckingWay 的「截至 2026 年初 26–27 个州」之间也存在差异，可能反映 2025
              年末州扩张很快，或只是来源日期错位。客户集中度完全没有被回答：没有公开来源披露保费是广泛分散，还是集中在少数大账户。ATA 和 ATRI 的市场背景显示，可寻址卡车运输市场很大——2024 年美国 72.7%
              的货运由卡车承运，汽车责任险保费八年内每英里上涨 36%——但这个顺风不能替代对队列留存和集中度的直接尽调。
