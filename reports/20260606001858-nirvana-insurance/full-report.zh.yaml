      - number: '2.2'
        title: 多重规模测算镜头：活动量、账户数与保险压力
        blocks:
          - type: paragraph
            body: >-
              单一美元口径的 TAM 会夸大精度，因此更适合用多个镜头测算市场。货运经济口径无疑很大：ATA 称，2024 年卡车按重量承运了全美 72.7% 的货运，并产生估计 $906 billion
              运费支出。但这个口径衡量的是经济吞吐量，不是保险公司收入。账户数口径更有决策价值。ATA 报告称，截至 2025 年 6 月，活跃且拥有牵引车的承运人接近 580,000 家，其中 91.5% 运营 10
              辆及以下卡车，99.3% 运营 100 辆及以下。换句话说，按数量看，账户基础压倒性偏向小车队；而 10 辆以上的较大车队队列，简单估算只有约 49,300
              家承运人。保险压力口径提供了另一层视角：CBIZ、Dominion 和 Trucking Dive 都显示，2024 年和 2025
              年保费压力持续、承保盈利差、硬市场延续。这确认该品类经济上重要，痛点也足以推动切换，但仍没有隔离出干净的卡车车险保费池，或精确识别已准备好采用 AI 原生承保的子集。公开证据支持多个受约束的镜头，而不是假精确的
              TAM/SAM/SOM 堆叠。
