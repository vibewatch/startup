      - number: '5.4'
        title: 信任、合规、依赖与公开缺口
        blocks:
          - type: paragraph
            body: >-
              信任控制主要由公司政策和运营披露证明，而不是第三方认证。Nirvana
              的隐私承诺称，车联网数据用于改善定价、承保、理赔和安全；公司永不出售或交易数据；如果潜在客户没有绑定保单，公司会停止拉取额外数据。负责任披露页面发布了类似漏洞赏金的受理流程和善意测试规则。牌照页和车队页合起来显示多州生产者足迹，以及
              California 的准入 / 非准入区分；首页和车队页称保险载体为 A 级，并由全球再保险方支持。


              主要尽调缺口在于公开材料没有呈现什么。保留来源中，没有公开 SOC 2 报告，没有外部安全认证，没有事故历史或正常运行时间页面，也没有官方公开集成目录；除车联网示例、Samsara
              优惠和经纪人工作流暗示外，无法看到更多。依赖模型因此在高层次上清楚——保险载体、再保险方、车联网硬件和数据、FMCSA
              数据、云基础设施和经纪人伙伴——但仅靠公开材料无法完全审计。这个缺口重要，因为产品承诺建立在数据连续性、理赔响应速度，以及市场对车联网处理方式的信任之上。
