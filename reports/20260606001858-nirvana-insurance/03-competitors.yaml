- id: capability-and-distribution-fit
  title: Capability breadth, distribution fit, and trust posture
  body: 'Nirvana''s public story is stronger on operational breadth than on abstract AI rhetoric. Its retained official surfaces
    show telematics-powered pricing, bundled active-safety tooling, an in-house claims workflow, and broker-facing quote tools,
    which together make the product look more like an operating bundle than a narrow MGA rate sheet. That said, the direct
    peers are not simple websites: HDVI uses telematics throughout the policy lifecycle, Cover Whale continuously underwrites
    every policy and coaches drivers, and Leeo similarly markets smarter underwriting for brokers. Trust posture is also shared
    territory. Nirvana stresses A-rated paper, top-tier reinsurers, and privacy controls; Progressive emphasizes filings compliance,
    optional coverages, and #1 truck-insurer scale; Cover Whale foregrounds A-rated carrier partners. The result is a market
    where most providers can tell a credible trust story, but not all can prove equal workflow depth.'
