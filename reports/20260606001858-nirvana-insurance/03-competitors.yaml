  - - Progressive
    - Traditional truck-insurance coverages and optional add-ons across many vehicle classes
    - Filings, claims handling, coverages, and flexible payment options
    - Public coverages are visible, but quoted premium depends on operation and state rules
    - Incumbent breadth may beat insurtech novelty when buyers prioritize certainty
