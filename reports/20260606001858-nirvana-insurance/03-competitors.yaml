- id: TP001
  title: Competitor profile table
  columns:
  - competitor
  - category
  - scale/funding
  - target segment
  - differentiation
  - limitation
  rows:
  - - Nirvana Insurance
    - Direct telematics-led carrier/MGA hybrid
    - Series D-backed private company; A-rated paper; top-tier reinsurers; 32B+ model miles
    - Fleets, non-fleet truckers, brokers, and safety-conscious operators
    - Carrier-backed trucking coverage combined with claims, broker tooling, and active safety
    - Public realized pricing, retention, and loss-ratio detail remain limited
  - - Fairmatic / Leeo
    - Direct telematics-led MGA peer
    - Private peer; official site stresses broker value and smarter underwriting
    - Commercial-auto brokers and fleets seeking telematics-led pricing
    - Broker-centric commercial-auto MGA built around telematics and risk intelligence
    - Public scale, filings, and pricing detail are thin
  - - HDVI
    - Direct trucking-insurtech peer
    - Growth-stage trucking insurer focused on telematics and lifecycle discounts
    - Safe fleets and trucking operators
    - Telematics throughout policy lifecycle plus monthly premium discounts
    - Less visible breadth outside trucking and fewer public scale markers than incumbents
  - - Cover Whale
    - Direct MGA / platform peer
    - Processed 900,000+ transactions, ~5,000 agencies, 46 states, $1.4B+ transactions processed
    - Agents, fleets, and carrier partners in commercial auto
    - 18-minute bind flow, continuous underwriting, driver coaching, API-style carrier partnerships
    - Coverage breadth is commercial-auto focused and realized pricing is still opaque
  - - Progressive Commercial
    - Incumbent substitute
    - '#1 truck insurer in America on 2024 written-premium data; 50+ years experience'
    - Truckers, owner-operators, fleets, and small businesses
    - National scale, multi-channel distribution, filings support, and broad coverage menu
    - Less public emphasis on telematics-native safety tooling as the core sales wedge
  - - Root
    - Adjacent data-native substitute
    - Public auto insurtech with Q1 2026 results and API-partner language
    - Auto buyers, embedded vehicle-purchase channels, and API partners
    - Data science-led pricing and point-of-sale/API distribution
    - Not a dedicated trucking MGA and not optimized for broker-led commercial fleets
  - - Lemonade
    - Adjacent AI-insurer substitute
    - Public insurer with 3.14M customers and $258M Q1 2026 revenue
    - Consumer P&C, pet, life, and auto customers
    - Highly visible AI-native insurance brand with public growth metrics
    - Consumer-led insurance model is not a direct trucking-specialist substitute
  notes: Scale/funding reflects only retained public evidence. Unknown or thin public disclosure is called out instead of
    inferring actual premium share or contract economics.
