- id: pricing-packaging-and-switching-costs
  title: Pricing visibility, packaging, and switching costs
  body: Public pricing is still thin across the entire peer set. Nirvana discloses headline levers such as up to 20% upfront
    safety discounts, pay-for-miles billing, and rate stability; HDVI markets monthly premium discounts; Cover Whale markets
    fast bind times and safety discounts; Fairmatic/Leeo speaks in terms of smarter underwriting and lower costs. None of
    those retained sources publishes a clean enterprise fee card or realized premium schedule that would let an outsider benchmark
    unit economics with confidence. That opacity pushes competitive diligence toward packaging and workflow lock-in. Nirvana
    likely becomes stickier once a fleet and broker rely on its claims handling, safety platform, and underwriting workflow,
    but multi-homing remains plausible because brokers can still compare carrier or MGA options and the public record does
    not show exclusive economics. Pricing therefore looks negotiable, while operational embed still looks like the more durable
    switching-cost source.
