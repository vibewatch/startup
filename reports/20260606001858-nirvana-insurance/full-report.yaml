    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Nirvana Insurance consistently presents itself as a private AI-native insurer focused on commercial
              trucking and adjacent commercial auto workflows rather than as a general horizontal broker. The core
              proposition is that telematics, claims data, and underwriting models let the company price risk more
              precisely than legacy one-size-fits-all commercial auto carriers. Public coverage pages support a concrete
              operating footprint: the fleet program targets carriers with 10 or more power units, the non-fleet program
              targets 1 to 9 units, the fleet page says the company is active in 28 states with California written on a
              non-admitted basis, and the non-fleet page says the smaller-fleet product is active in 15 states with
              Texas non-admitted. San Francisco is the consistent headquarters across company and third-party profiles.
              The main caveat is chronology drift: official materials say Nirvana was founded in 2021, but CB Insights
              and Ascend both label it as a 2020 founding, so the company age should be treated as a diligence item
              rather than an uncontested fact.
