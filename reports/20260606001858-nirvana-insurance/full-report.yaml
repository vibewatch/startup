  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and disclosure gap
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows real financing momentum. Independent coverage put Nirvana's March 2025 Series C at
              $80 million and roughly $830 million to $850 million post-money, then its December 2025 Series D at $100
              million and a $1.5 billion valuation. By the Series D, Crunchbase said total funding exceeded $260
              million, the company had doubled premium growth year over year, staff had roughly doubled to around 200,
              and Nirvana served thousands of motor carriers. Those are not trivial signals; they show investor demand
              and operating traction in a difficult insurance category.


              But the disclosure stack never caught up to the valuation stack. Public sources provide premium growth,
              telematics miles, and customer-count descriptors, yet they still do not disclose hard revenue, net earned
              premium, gross margin, retention, or audited loss-ratio series. That makes the Series D especially hard to
              underwrite using normal late-stage software or insurance heuristics. A private mark can still be
              directionally reasonable without full public detail, but moving from an $830 million to a $1.5 billion
              valuation in roughly nine months while refusing to publish revenue or underwriting quality data leaves
              investors underwriting narrative velocity more than financial proof.


              The right takeaway is therefore mixed. Series D looks demand-driven rather than distressed, and Nirvana
              has clearly attracted high-quality investors. At the same time, the financing context is still
              price-sensitive: without economic disclosure, investors cannot know whether the round bought attractive
              optionality or simply capitalized future expectations too aggressively. That gap drives the recommendation
              away from buy and toward research-more / track despite the company's momentum.
            claimRefs:
