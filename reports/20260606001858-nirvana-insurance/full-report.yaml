  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, adjacents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Nirvana does not compete inside one neat peer box. The closest direct peers are telematics-first
              commercial-auto MGAs that promise faster quoting and more dynamic underwriting for trucking risk,
              especially HDVI, Cover Whale, and Fairmatic's Leeo brand. Progressive matters for a different reason: it
              represents the status-quo incumbent with national scale, broad coverage menus, filings expertise, and a
              multi-channel distribution engine that many fleets and brokers already trust. Root and Lemonade are
              adjacent substitutes rather than clean like-for-like trucking peers, but they matter because they show how
              data-native insurers can extend from digital direct distribution into point-of-sale and API-led entry
              points. The practical buying set therefore spans direct trucking insurtechs, incumbent carriers,
              broker-carrier combinations, and internal workflow stitching rather than only a handful of venture-backed
              startups.
