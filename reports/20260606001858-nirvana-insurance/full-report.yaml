  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The right market boundary is narrower than “all commercial insurance” but broader than large-fleet
              trucking alone. Nirvana is clearly aimed at commercial auto risk for trucking fleets, including both
              traditional larger fleets and adjacent smaller-fleet or owner-operator accounts that can use
              telematics-linked pricing and claims workflows. That means the relevant spend includes auto liability and
              related claims, safety, and underwriting services wrapped around trucking risk. It does not include
              unrelated lines such as workers’ compensation, cyber, or general liability merely because incumbents
              bundle them on the same website. Progressive’s commercial portal makes that distinction visible:
              commercial auto is sold alongside many unrelated small-business lines, which is exactly why boundary
              discipline matters. Status-quo substitutes also span more than one archetype. Incumbents such as
              Progressive provide bundled commercial-auto capacity, while telematics-native entrants such as Cover Whale
              and HDVI compete on bind speed, continuous underwriting, or monthly premium credits. For Nirvana, the
              market boundary is therefore best defined as trucking-centric commercial auto and adjacent small-fleet
              commercial auto where safety data, claims experience, and risk segmentation actually change buyer
              outcomes.
