      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Small fleets dominate the account universe by count
            body: >-
              ATA’s carrier mix means the addressable account base skews heavily toward 10-or-fewer-truck operators. Any
              market story that only focuses on large fleets will miss most accounts by count, even if premium dollars
              concentrate elsewhere.
            calloutType: insight
            claimRefs:
