  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Core financials
        - Current GWP, earned premium, revenue, gross margin, and burn.
        - These determine whether the Series D mark is being applied to real economics or just premium growth.
        - Management data room / CFO review.
      - - Underwriting quality
        - Cohort loss ratios, reserve development, and severity by state / segment.
        - Commercial-auto severity is the core downside driver in the whole thesis.
        - Actuarial diligence with reinsurer corroboration.
      - - Customer quality
        - Retention, concentration, broker mix, and lost-account reasons.
        - Customer scale matters only if it is sticky and diversified.
        - Revenue operations and broker-reference calls.
      - - Claims proof
        - Cycle times, satisfaction scores, litigation outcomes, and service staffing.
        - Claims execution now outranks price for many fleets.
        - Claims operations review plus customer references.
      - - Capital structure
        - Preference stack, secondary sales, treaty terms, and partner concentration.
        - Entry discipline depends on what sits above and around the Series D.
        - Legal / finance review of term sheets and treaties.
      - - Expansion proof
        - State-footprint reconciliation and non-core product roadmap metrics.
        - Optionality matters only if expansion is real and economic.
        - Regulatory, product, and GTM diligence.
    notes: >-
      These asks are prioritized by how quickly they would change the recommendation rather than by curiosity value
      alone.
