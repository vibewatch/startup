        title: Product definition and commercial workflow
        blocks:
          - type: paragraph
            body: >-
              Nirvana's product is not a standalone software subscription; it is an operating workflow for underwriting
              and servicing commercial trucking insurance. The public product surface splits cleanly into a Fleet
              Insurance Program for fleets with 10+ power units and a Non-Fleet Trucking Program for 1-9 power units. In
              both motions, the customer workflow starts with a broker or insured connecting telematics, sharing loss
              and FMCSA context, and receiving a quote that promises safer fleets up to 20% upfront discounts and rate
              stability through the policy term. The fleet program adds pay-as-you-drive billing and more explicit
              safety tooling, while the non-fleet program emphasizes fixed premiums and predictable endorsement pricing.


              What is directly evidenced is that Nirvana packages insurance, pricing logic, claims servicing, and safety
              coaching together. The home, fleet, non-fleet, and telematics pages repeatedly tie telematics inputs to
              upfront discounts, monthly billing transparency, and claims support. TechCrunch's March 2025 coverage
              independently corroborates that Nirvana uses telematics plus FMCSA data in usage-based commercial auto
              underwriting for both fleet and non-fleet customers. The product therefore appears to compete less as a
              generic dashboard and more as a full-stack insurance workflow for trucking operators, brokers, and safety
              managers.
