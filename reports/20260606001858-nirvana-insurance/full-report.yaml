      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buying path in trucking insurance is more operational than many software markets. Fleet operators,
              transportation executives, and safety/compliance professionals are heavily involved in evaluation because
              the product affects cash flow, downtime, and claims outcomes immediately. Carrier Management’s survey
              breakdown makes that explicit, and the same survey plus Nirvana’s own claims-report themes show that
              claims execution has become central to vendor choice. Buyers are not just shopping for statutory coverage;
              they are shopping for faster claims handling, better communication, and tools that protect operations when
              incidents happen. That is why telematics and camera evidence matter so much. Survey results show very high
              perceived value from technology during claims, and Nirvana’s product pages position FMCSA-integrated
              safety tooling, automated claims intake, and underwriting segmentation as part of the insurance experience
              rather than adjacent software. Small fleets and owner-operators matter especially because the account
              universe skews heavily to that cohort, while larger fleets have more formal safety and claims processes.
              Across both cohorts, the payer may be an owner, CFO, or fleet executive, but the user group typically
              includes operations and safety leaders who feel the pain of delayed claims first.
