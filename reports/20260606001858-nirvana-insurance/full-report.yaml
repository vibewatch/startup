  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Flat or down financing round
        - Next round prices at or below Series D
        - Confirms hidden economics are weaker than expected and compresses return math.
        - Treat as thesis break until economics are re-underwritten.
      - - Persistent disclosure gap
        - Management still will not share core revenue and loss-ratio data in diligence
        - Prevents valuation underwriting despite operating momentum.
        - Do not commit at current price.
      - - Claims or security trust event
        - Material service failure, breach, or evidence-integrity event becomes public
        - Damages broker trust and weakens renewal assumptions.
        - Escalate to red diligence track and recut valuation.
      - - Commercial-auto severity stays elevated
        - >-
          Line-wide inflation, tort costs, and premium pressure continue without offsetting proof of superior
          underwriting
        - Reduces probability that Nirvana outruns the market structurally.
        - Cut bull-case probability and raise discount rate.
      - - Agent-channel constraint persists
        - Distribution remains narrow or state expansion stalls
        - Limits efficient scaling versus headline TAM.
        - Lower growth assumptions and demand more customer-concentration data.
    notes: Each trigger is observable and linked to valuation transmission, not merely to company quality in the abstract.
