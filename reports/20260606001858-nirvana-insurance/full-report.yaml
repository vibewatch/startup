              hours, and weekly updates on open claims. The same page says claims are handled by in-house trucking
              specialists using telematics and camera evidence. A newer company engineering post makes the operating
              flow more concrete: first-notice-of-loss emails are parsed by AI into structured case data, attachments
              are assembled automatically, and a policy engine gives adjusters an initial coverage view before human
              review.


              Safety is positioned as both product value and underwriting reinforcement. Active Safety is included with
              the policy, while the Safety Intelligence Platform aggregates FMCSA and telematics data, surfaces
              personalized recommendations, ranks drivers, maps inspection hot spots, and highlights BASIC categories
              that are pushing up risk. This makes the product workflow circular rather than linear: telematics helps
              win the policy, safety tools shape driving behavior during the term, and claims telemetry helps settle
              losses faster. That integrated loop is well evidenced in official materials even if the exact
              model-performance metrics behind it are not fully disclosed.
