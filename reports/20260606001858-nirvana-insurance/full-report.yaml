        title: Segments, buyers, and ICP profile
        blocks:
          - type: paragraph
            body: >-
              Nirvana's public customer evidence points to a narrow, well-defined ICP: motor carriers ranging from
              single-owner-operators to fleets with more than 500 trucks, purchasing coverage exclusively through
              appointed brokers or retail agents. The two product lines—non-fleet (1-9 power units) and fleet (10+ power
              units)—create a product surface that is inclusive of small carriers while targeting the mid-size fleet as
              the natural sweet spot where telematics discounts, per-customer underwriting models, and active safety
              tools generate the most visible value.


              Crunchbase characterizes the customer base as "thousands" of motor carriers spanning
              single-owner-operators to fleets with more than 500 trucks, which aligns with the Ascend case study
              confirming 28+ active states and the wins pages showing policy transactions from 40 to 150 power units
              between December 2025 and March 2026. TechCrunch's Series C coverage independently corroborates that both
              fleet and non-fleet customers use telematics and FMCSA data as core underwriting inputs. The ICP is
              further shaped by the telematics requirement: TruckingWay notes that telematics hardware is effectively
              required to unlock the core value proposition, meaning the most natural early buyers are carriers already
              running ELDs or dash cams. The channel is entirely broker-mediated; TruckingWay confirms that as of March
              2026 there is no direct digital bind capability.
