            body: >-
              The most decision-useful public evidence after financing is the density of dated commercial proof in 2025
              and 2026. Nirvana’s about page says the company sold its first policy in 2022, and the official site then
              shows later milestones spanning the 2024 reinsurance-capacity expansion, the 2025 Series C and Series D
