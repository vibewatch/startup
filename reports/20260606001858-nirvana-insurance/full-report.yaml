            title: Public TAM precision is weaker than public market rhetoric
            body: >-
              The public corpus supports freight, carrier-count, premium-trend, and telematics-adoption lenses, but it
              does not isolate a clean standalone premium pool for trucking insurance TAM, SAM, or SOM. Treat precise
              TAM claims with skepticism unless backed by broker or carrier data.
            calloutType: risk
            claimRefs:
