  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: Chain from market and proof signals through disclosure and risk filters to the final recommendation.
    data:
      nodes:
        - id: market
          label: Large fragmented market
          detail: ATA and TechCrunch support a large, still-inefficient trucking market.
          tone: positive
        - id: proof
          label: Visible growth and product proof
          detail: Private rounds, telematics miles, and customer proof show real momentum.
          tone: positive
        - id: gap
          label: Disclosure gap
          detail: No hard revenue, margin, or loss-ratio series is public.
          tone: risk
        - id: risk
          label: Commercial-auto severity risk
          detail: Line-wide premium and tort pressure keep downside tails fat.
          tone: warning
        - id: decision
          label: 'Recommendation: Research-more / Track'
          detail: The company may be strong; the current public evidence base is not yet strong enough for a buy.
          tone: neutral
    claimRefs:
      - CV002
      - CV009
      - CV025
      - CV031
      - CV043
      - CV044
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: Illustrative valuation midpoints under milestone-driven scenarios relative to the current $1.5B mark.
    data:
      items:
        - label: Current Series D mark ($B)
          value: 1.5
        - label: Bull midpoint ($B)
          value: 2.4
        - label: Base midpoint ($B)
          value: 1.5
        - label: Bear midpoint ($B)
          value: 0.8
        - label: Implied markdown if disclosure disappoints ($B)
          value: 0.7
    approximationNotes: >-
      Bull, base, and bear bars are analytical scenario midpoints based on the ranges in TV003 and FV003, not company
      guidance or market quotes.
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV044
      - CV046
      - CV047
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Scenario ranges for enterprise value and gross return from the $1.5B Series D entry.
    data:
      items:
        - label: Bull case value ($B)
          low: 2
          mid: 2.4
          high: 2.8
          displayValue: $2.0B-$2.8B
          detail: Requires disclosed economics, continued growth, and proof that underwriting quality scales.
          tone: positive
        - label: Base case value ($B)
          low: 1.2
          mid: 1.5
          high: 1.8
          displayValue: $1.2B-$1.8B
          detail: Operational success continues, but disclosure remains partial and upside is mostly already priced.
          tone: neutral
        - label: Bear case value ($B)
          low: 0.6
          mid: 0.8
          high: 1
          displayValue: $0.6B-$1.0B
          detail: Growth slows, economics disappoint, or market severity forces a valuation reset.
          tone: negative
        - label: Bull gross MOIC
          low: 1.3
          mid: 1.6
          high: 1.9
          displayValue: 1.3x-1.9x
          detail: Gross return range from Series D entry under the bull case.
          tone: positive
        - label: Base gross MOIC
          low: 0.8
          mid: 1
          high: 1.2
          displayValue: 0.8x-1.2x
          detail: Capital preservation to modest upside under the base case.
          tone: neutral
        - label: Bear gross MOIC
          low: 0.4
          mid: 0.5
          high: 0.7
          displayValue: 0.4x-0.7x
          detail: Meaningful capital loss if the next financing or disclosure cycle disappoints.
          tone: negative
    approximationNotes: >-
      All ranges are author estimates anchored on public round marks, public-market comps, and the commercial-auto risk
      environment; net returns would be lower after preferences, fees, and dilution.
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
