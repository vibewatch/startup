      - number: '7.4'
        title: Mitigations, Monitoring, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Nirvana does have visible mitigants. It writes on A-rated paper, has public reinsurance support, offers
              no-mid-term-rate-change pricing, bundles safety tooling into the policy, and positions claims as an
              internally managed competency rather than a bolt-on vendor workflow. Those ingredients can produce real
              durability if the underlying data science and loss controls are as strong as management says. The problem
              is not that the mitigation story is absent; it is that the public evidence base is incomplete exactly
              where investors need hard proof most—loss-ratio persistence, reinsurance treaty detail, and independently
              verified claims outcomes.


              For diligence purposes, the risk register should therefore be monitored through explicit thesis-break
              triggers rather than vague comfort with the narrative. The highest-signal triggers are a material security
              incident, reinsurance or carrier-paper retrenchment, a visible wave of service complaints or broker
              losses, unresolved state-footprint inconsistencies that suggest governance slippage, and any sign that
              California or other expansion geographies are producing worse loss experience than telematics pricing can
              absorb. Market-wide triggers matter too: if premium inflation and tort severity continue to outrun
              telematics-led underwriting gains, even a better operator can see margins compress.


              The practical conclusion is that Nirvana's risk profile is currently manageable but not yet fully
              underwritten. Mitigations are strongest where they are easy to market—discounts, safety coaching, digital
              claims, reinsurance names—and weakest where outside investors need objective proof. Until management
              provides reconciled state-footprint data, control attestations, loss-ratio vintages, and treaty detail,
              the correct posture is to rank the company as a high-execution, high-severity insurer that may still win
              if its data advantage is real but that should be monitored with hard kill criteria, not trust alone.
            claimRefs:
