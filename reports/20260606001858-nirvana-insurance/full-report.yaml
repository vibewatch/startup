          detail: Data outage or weak evidence hurts pricing and exoneration.
          tone: negative
        - id: security_event
          label: Security / privacy incident
          detail: Sensitive fleet data is misused, breached, or challenged.
          tone: negative
        - id: retention_damage
          label: Retention and distribution damage
          detail: Brokers and fleets lose confidence in service and controls.
          tone: negative
        - id: capital_pressure
          label: Capital / reinsurance pressure
          detail: Partners tighten terms after loss, incident, or volatility.
          tone: negative
        - id: thesis_break
          label: Investment thesis break
          detail: Growth no longer compensates for severity and control risk.
          tone: negative
      edges:
        - from: market_severity
          to: pricing_pressure
          label: severity compresses underwriting margin
        - from: pricing_pressure
          to: capital_pressure
          label: weaker performance pressures treaties and capital
        - from: claims_failure
          to: retention_damage
          label: service failures drive churn and broker skepticism
        - from: data_failure
          to: claims_failure
          label: weak evidence slows claims and dispute resolution
        - from: data_failure
          to: pricing_pressure
          label: bad inputs degrade underwriting quality
        - from: security_event
          to: retention_damage
          label: breach or misuse damages trust
        - from: security_event
          to: capital_pressure
          label: incident raises partner and regulator scrutiny
        - from: retention_damage
          to: thesis_break
          label: growth and renewal economics weaken
        - from: capital_pressure
          to: thesis_break
          label: capacity or pricing advantage erodes
