  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Nirvana's center-of-gravity dependencies across capital support, distribution, workflow partners, and data
      ecosystems.
    data:
      nodes:
        - id: nirvana
          label: Nirvana Insurance
          detail: Telematics-first commercial trucking insurer.
          tone: neutral
        - id: reinsurers
          label: Fronting carrier / reinsurers
          detail: A-rated paper and treaty capacity support.
          tone: warning
        - id: agents
          label: Agents / brokers
          detail: Primary quoting and binding route.
          tone: warning
        - id: ascend
          label: Ascend / workflow partners
          detail: Billing and premium-finance workflow support for new programs.
          tone: warning
        - id: telematics
          label: ELD / dashcam / telematics providers
          detail: Primary pricing, coaching, and claims inputs.
          tone: warning
        - id: fmcsa
          label: FMCSA datasets
          detail: BASIC and compliance data used in coaching and risk view.
          tone: warning
        - id: fleets
          label: Fleet and non-fleet customers
          detail: Fragmented customer base from owner-operators to larger fleets.
          tone: neutral
      edges:
        - from: nirvana
