        blocks:
          - type: paragraph
            body: >-
              Nirvana’s capital history is much better documented than its operating economics. The official timeline
              shows a $22 million Series A in February 2022, a $57 million Series B in October 2023, an $80 million
              Series C announced on 2025-03-10, and a $100 million Series D in December 2025. The external record is
              especially strong for the last two rounds: multiple outlets place the Series C valuation in an
              approximately $830 million to $850 million range, while Series D coverage converges at $1.5 billion with
              Valor Equity Partners leading and Lightspeed Venture Partners plus General Catalyst increasing their
              commitments. Premium scale is also directionally visible, with the Series C materials saying Nirvana had
              well over $100 million in premiums and was doubling year over year. After that, precision drops off
              quickly. Public sources disagree on total raised, cite headcount only as rough proxies around 186 to 200,
              and do not publish revenue, ARR, gross margin, or an audited customer count. Those omissions are too
              important to infer away, so the snapshot table keeps several metrics as gaps rather than pretending
              precision.
