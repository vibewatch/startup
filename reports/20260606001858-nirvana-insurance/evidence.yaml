evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding
    missingEvidence: A cap-table, incorporation filing, or first board consent that fixes the true founding year.
    whyItMatters: >-
      Company materials and third-party profiles disagree on whether Nirvana was founded in 2020 or 2021, which affects
      chronology and company-age benchmarking.
    diligencePath: Request incorporation records, the first financing deck, or legal-entity formation documents from management.
    relatedQuestionRefs:
      - QO002
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster plus any observer, veto, or protective-rights schedule.
    whyItMatters: >-
      Public materials show investors and executives but not the actual board composition or governance rights that
      matter for control and refresh diligence.
    diligencePath: Request the latest board deck cover, stockholders agreement summary, and board-consent schedule.
    relatedQuestionRefs:
      - QO007
      - QO025
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, ARR, loss ratio, and exact customer-count metrics.
    whyItMatters: >-
      Cover metrics shape valuation interpretation, but the reviewed public corpus only exposes premiums, discounts, and
      rough customer or headcount proxies.
    diligencePath: Request monthly premium run-rate, booked revenue, loss-ratio trend, and active-account counts from management.
    relatedQuestionRefs:
      - QO024
  - type: conflicting-data
    severity: minor
    topic: funding
    missingEvidence: A board-approved financing history or cap-table export that reconciles seed, Series A, and total-raised math.
    whyItMatters: >-
      Public sources round total funding differently, so a precise total cannot be stated without a canonical
      capital-history document.
    diligencePath: >-
      Ask finance for a financing history table that lists each round amount, closing date, and whether seed capital is
      included in press tallies.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: scale-metrics
    missingEvidence: A current headcount report and a canonical mileage-data disclosure.
    whyItMatters: >-
      External profiles and marketing surfaces disagree on employee count and telemetry-mile totals, reducing confidence
      in exact cover metrics.
    diligencePath: Request an HR headcount snapshot and the latest approved metric sheet for telematics miles analyzed.
    relatedQuestionRefs:
      - QO017
  - type: missing-source
    severity: material
    topic: TAM/SAM/SOM
    missingEvidence: >-
      A credible standalone premium-pool estimate for U.S. commercial trucking insurance split into fleet and non-fleet
      segments.
    whyItMatters: >-
      Public sources show freight activity, carrier counts, and rate pressure, but none cleanly isolate the
      insurance-revenue pool Nirvana is targeting.
    diligencePath: >-
      Request broker market studies, carrier statutory-line data, or actuarial premium pools that isolate commercial
      trucking auto liability and physical damage by fleet size.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: telematics-ready-segmentation
    missingEvidence: >-
      An independent estimate of what share of fleets already have telematics, dashcams, and data-sharing readiness by
      fleet-size cohort.
    whyItMatters: >-
      Adoption timing depends on how many fleets can actually connect data and operationalize usage-based or AI-native
      underwriting, but current evidence is mostly vendor-sponsored.
    diligencePath: >-
      Collect broker surveys, telematics-vendor penetration studies, or carrier submissions that break readiness down by
      fleet size and segment.
    relatedQuestionRefs:
      - QM016
      - QM024
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: minor
    topic: buyer-priorities
    missingEvidence: >-
      An independent multi-carrier buyer survey that replicates the claims-priority and switching results without
      Nirvana sponsorship.
    whyItMatters: >-
      The strongest buyer-preference data in the public set is Nirvana-sponsored, so the direction is useful but the
      magnitude should not be treated as an industry census.
    diligencePath: >-
      Ask brokers, carriers, or trade groups for cross-carrier survey data on renewal drivers, claims switching, and
      telematics adoption.
    relatedQuestionRefs:
      - QM011
      - QM012
      - QM013
  - type: stale
    severity: minor
    topic: regulatory-data
    missingEvidence: >-
      A fresher regulatory source that maps official trucking exposure data directly to insurance pricing or
      availability.
    whyItMatters: >-
      FMCSA and ATA are authoritative on trucks, carriers, and exposure, but they do not directly answer how much
      premium is written or how much capacity is available.
    diligencePath: >-
      Pair official safety and carrier counts with 2026 carrier filings, market-share studies, or brokerage placement
      data in the next refresh.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: status-quo economics
    missingEvidence: >-
      Broker win-loss data showing how often fleets pick incumbent carriers or broker-carrier combinations over Nirvana
      for economic reasons.
    whyItMatters: Without observed win-loss data, the strength of the status-quo substitute remains only partially measurable.
    diligencePath: >-
      Request broker-level pipeline reports or anonymized competitive battlecards covering incumbent-versus-Nirvana
      outcomes.
    relatedQuestionRefs:
      - QP016
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Actual premium schedules, fee cards, or commission splits for Nirvana and named direct peers.
    whyItMatters: Public packaging is visible, but pricing power and apples-to-apples procurement economics are not.
    diligencePath: >-
      Request sample quotes, broker term sheets, or procurement comparisons for matched risks across at least three
      providers.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: likely-entrant timing
    missingEvidence: Explicit commercial-auto expansion roadmaps from adjacent AI-native insurers or telematics vendors.
    whyItMatters: >-
      The entrant-risk direction is plausible, but timing still depends on strategic choices that are not publicly
      committed.
    diligencePath: >-
      Monitor investor calls, product releases, and hiring pages for commercial-auto, fleet, or trucking-specific
      expansion language.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: gross-margin-disclosure
    missingEvidence: Gross margin, claims-cost burden, and support-labor detail by stream.
    whyItMatters: >-
      Without cost buckets, the business could look software-like, carrier-like, or service-heavy, and those are
      radically different underwriting cases.
    diligencePath: >-
      Request a gross-profit waterfall with loss ratio, claims ops cost, safety-services cost, and broker acquisition
      cost by line.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-and-debt
    missingEvidence: Current cash balance, monthly burn, debt facilities, and any guarantees or lease liabilities.
    whyItMatters: Capital adequacy and next-round timing cannot be underwritten without liquidity and leverage data.
    diligencePath: Request the latest board package or monthly operating report with cash, burn, debt, and covenant schedule.
    relatedQuestionRefs:
      - QI008
      - QI014
      - QI024
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: public-comps-comparability
    missingEvidence: >-
      A management bridge from premium volume to recognized revenue and gross profit that makes public comps more
      comparable.
    whyItMatters: >-
      Without a bridge, public comps may frame the range of possibilities but cannot validate Nirvana’s actual
      economics.
    diligencePath: Request accounting policy memos and a premium-to-revenue bridge for 2024-2026.
    relatedQuestionRefs:
      - QI021
      - QI022
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: material
    topic: next-round-trigger
    missingEvidence: Board-approved liquidity threshold or growth plan showing when Nirvana would need the next financing event.
    whyItMatters: Fresh capital is visible, but the timing of the next raise remains opaque.
    diligencePath: Request the 24-month operating plan and minimum-cash threshold used in board reporting.
    relatedQuestionRefs:
      - QI023
  - type: private-evidence-only
    severity: material
    topic: third-party security assurance
    missingEvidence: No public SOC 2, ISO 27001, or equivalent third-party security attestation was found in retained sources.
    whyItMatters: >-
      Insurance workflows depend on sensitive telematics, claims, and broker data, so self-attested privacy pages are
      weaker than current enterprise diligence standards.
    diligencePath: Request the latest security certification package, penetration-test summary, and customer security addendum.
    relatedQuestionRefs:
      - QE023
      - QE024
  - type: missing-source
    severity: material
    topic: reliability and incident visibility
    missingEvidence: >-
      Retained sources did not surface a public uptime page, incident archive, or historical SLA dashboard for claims,
      safety, or quote surfaces.
    whyItMatters: >-
      The product promise depends on fast quoting, active monitoring, and claims responsiveness; without reliability
      evidence it is hard to underwrite operational resilience.
    diligencePath: Request historical uptime, incident postmortems, and service-level reporting for claims and policyholder systems.
    relatedQuestionRefs:
      - QE024
  - type: missing-source
    severity: minor
    topic: integration catalog depth
    missingEvidence: >-
      Public materials show telematics usage and a Samsara perk, but not a complete, current catalog of supported
      telematics, camera, agency, or claims-system integrations.
    whyItMatters: >-
      Deployment speed, data continuity, and broker adoption depend on how broad and stable the integration surface
      really is.
    diligencePath: Request the live telematics and integration support matrix and recent implementation timelines by connector.
    relatedQuestionRefs:
      - QE016
      - QE023
  - type: private-evidence-only
    severity: material
    topic: retention cohorts and churn
    missingEvidence: >-
      No NRR, GRR, annual churn rate, average policy tenure, or cohort retention data was found in any retained public
      source.
    whyItMatters: >-
      Without retention data, it is impossible to determine whether Nirvana's customer book is sticky or experiencing
      elevated cancellation, which matters most when adjacent competitors offer lower prices.
    diligencePath: >-
      Request NRR, GRR, and annual churn by product line (fleet vs non-fleet) and fleet-size band; ask for the three
      most recent cohort snapshots.
    relatedQuestionRefs:
      - QU023
    relatedTableRefs:
      - TU004
  - type: private-evidence-only
    severity: material
    topic: customer concentration
    missingEvidence: No top-account exposure, premium concentration by customer, or contract-length data was found publicly.
    whyItMatters: >-
      Logo breadth (thousands of carriers) does not exclude economic concentration in a small number of large accounts;
      one non-renewal among large fleet clients could disproportionately affect premiums.
    diligencePath: >-
      Request top-10 accounts by annual premium, their renewal history, and any concentration above 5% of total
      premiums.
    relatedQuestionRefs:
      - QU024
    relatedTableRefs:
      - TU005
  - type: missing-source
    severity: material
    topic: independent consumer review depth
    missingEvidence: >-
      As of March-April 2026, no Trustpilot, Google Reviews, BBB, TruckersReport, or Reddit entries were found for
      Nirvana in retained sources.
    whyItMatters: >-
      The absence makes it impossible to triangulate satisfaction evidence from sources that are not company-curated or
      customer-reference-selected.
    diligencePath: >-
      Monitor for emerging independent reviews; request NPS data and any verbatim survey feedback from non-curated
      respondents.
    relatedQuestionRefs:
      - QU018
    relatedTableRefs:
      - TU004
      - TU006
  - type: enumeration-incomplete
    severity: minor
    topic: named customer proof coverage
    missingEvidence: >-
      Only five named success stories and three months of partially anonymized wins pages are retained; the full
      customer list across thousands of motor carriers is not enumerable from public sources.
    whyItMatters: >-
      The named proof covers the most favorable customer experiences; the wins pages cover only a curated monthly
      subset; concentration and representativeness cannot be assessed.
    diligencePath: >-
      Request the current active customer list by segment with premium, state, and tenure; reconcile against wins pages
      and FeaturedCustomers references.
    relatedQuestionRefs:
      - QU012
      - QU024
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: minor
    topic: geographic footprint uncertainty
    missingEvidence: >-
      Two retained sources give different active state counts—Ascend reports 28+ states while TruckingWay puts coverage
      at 26-27 states as of early 2026; no canonical state-by-state map was found in retained public sources.
    whyItMatters: >-
      Geographic gaps limit which motor carriers Nirvana can serve; operators with routes through uncovered states
      cannot use Nirvana for full fleet coverage, and the discrepancy between sources has not been independently
      resolved.
    diligencePath: >-
      Request the current admitted and non-admitted state map by product line and confirm the timeline for pending state
      filings.
    relatedQuestionRefs:
      - QU016
  - type: conflicting-data
    severity: material
    topic: state-footprint
    missingEvidence: >-
      A current admitted-state and agency-appointment map reconciled against the licenses page, partner pages, and
      marketing materials.
    whyItMatters: >-
      State-footprint ambiguity affects underwriting reach, distribution planning, and compliance assumptions in the
      regulatory risk register.
    diligencePath: >-
      Request a carrier-paper and state-appointment schedule from management, then reconcile it against every public
      state-availability claim.
    relatedQuestionRefs:
      - QR004
      - QR021
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: security-controls
    missingEvidence: >-
      Named control attestations, recent penetration-test summaries, incident history, and security architecture details
      for the telematics and claims stack.
    whyItMatters: >-
      Security and privacy are central to Nirvana's model because telematics, camera, and claims data drive pricing and
      operations.
    diligencePath: >-
      Request SOC 2 or equivalent reports, last two external pen-test summaries, and an incident-response runbook tied
      to the claims and pricing stack.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR002
  - type: missing-source
    severity: material
    topic: loss-ratio-proof
    missingEvidence: Audited or reinsurer-verified loss-ratio vintages, loss development, and claims-resolution benchmarks by cohort.
    whyItMatters: >-
      The strongest marketing claims concern better loss ratios and faster claims, but public evidence remains largely
      company-sponsored.
    diligencePath: >-
      Ask for cohort-level loss-ratio and claims-cycle-time data that can be tied to periods before and after telematics
      onboarding.
    relatedQuestionRefs:
      - QR028
      - QR030
    relatedTableRefs:
      - TR002
      - TR005
  - type: private-evidence-only
    severity: material
    topic: reinsurance-terms
    missingEvidence: >-
      Treaty structure, attachment points, carrier-paper arrangements, and any concentration thresholds across
      reinsurers and fronting partners.
    whyItMatters: >-
      Reinsurance support is both a mitigation and a dependency; without treaty detail investors cannot assess capacity
      resilience or renewal risk.
    diligencePath: >-
