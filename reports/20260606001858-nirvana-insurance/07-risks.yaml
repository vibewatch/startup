  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: state-footprint
    missingEvidence: A current admitted-state and agency-appointment map reconciled against the licenses
      page, partner pages, and marketing materials.
    whyItMatters: State-footprint ambiguity affects underwriting reach, distribution planning, and compliance
      assumptions in the regulatory risk register.
    diligencePath: Request a carrier-paper and state-appointment schedule from management, then reconcile
      it against every public state-availability claim.
    relatedQuestionRefs:
    - QR004
    - QR021
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: security-controls
    missingEvidence: Named control attestations, recent penetration-test summaries, incident history,
      and security architecture details for the telematics and claims stack.
    whyItMatters: Security and privacy are central to Nirvana's model because telematics, camera, and
      claims data drive pricing and operations.
    diligencePath: Request SOC 2 or equivalent reports, last two external pen-test summaries, and an incident-response
      runbook tied to the claims and pricing stack.
    relatedQuestionRefs:
    - QR008
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: loss-ratio-proof
    missingEvidence: Audited or reinsurer-verified loss-ratio vintages, loss development, and claims-resolution
      benchmarks by cohort.
    whyItMatters: The strongest marketing claims concern better loss ratios and faster claims, but public
      evidence remains largely company-sponsored.
    diligencePath: Ask for cohort-level loss-ratio and claims-cycle-time data that can be tied to periods
      before and after telematics onboarding.
    relatedQuestionRefs:
    - QR028
    - QR030
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: material
    topic: reinsurance-terms
    missingEvidence: Treaty structure, attachment points, carrier-paper arrangements, and any concentration
      thresholds across reinsurers and fronting partners.
    whyItMatters: Reinsurance support is both a mitigation and a dependency; without treaty detail investors
      cannot assess capacity resilience or renewal risk.
    diligencePath: Review current fronting agreements and reinsurance treaties, including renewal dates,
      concentration, collateral, and termination provisions.
    relatedQuestionRefs:
    - QR003
    - QR026
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: minor
    topic: independent-service-proof
    missingEvidence: A neutral complaint dataset or independently sampled customer references on claims
      service quality.
    whyItMatters: Customer-service risk drives retention and acquisition economics in a segment where
      claims speed outranks price for many fleets.
    diligencePath: Pull broker references, complaint logs, and renewal/lost-account reasons segmented
      by claims experience.
    relatedQuestionRefs:
    - QR010
    - QR022
    relatedTableRefs:
    - TR002
    - TR005
