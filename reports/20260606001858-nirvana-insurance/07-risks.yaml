- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Claims-service failure
    - Broker or insured churn tied to claims handling
    - Two consecutive quarters of rising complaint or lost-account evidence tied to claims.
    - Pause valuation optimism and require service remediation proof before new capital.
  - - Large-loss severity
    - Adverse reserve shock or reinsurance retrenchment
    - Any visible treaty tightening, attachment increase, or capacity withdrawal.
    - Treat as thesis break until updated capital and treaty plan is reviewed.
  - - Security / privacy incident
    - Public breach or data misuse event
    - Material incident involving telematics, claims, or camera data.
    - Escalate to red diligence track; reassess underwriting and retention assumptions.
  - - State-footprint governance drift
    - Public state count remains unreconciled
    - State-availability claims stay inconsistent across core public materials.
    - Treat governance and compliance controls as weaker than management messaging.
  - - California expansion underperforms
    - California loss experience or agency traction disappoints
    - Evidence of worse-than-plan pricing adequacy or retained-agency uptake in California.
    - Reduce growth assumptions and treat California as a margin headwind, not a catalyst.
  - - Market-wide severity persists
    - Commercial auto inflation outruns telematics benefit
    - Premium inflation and tort severity continue without offsetting proof of superior loss ratios.
    - Shift view from differentiated insurer to insurer exposed to the same hard-market squeeze.
  notes: Triggers are designed for diligence monitoring and rely on concrete operating or market events
    rather than intuition.
