callouts:
- calloutType: insight
  title: Small fleets dominate the account universe by count
  body: ATA’s carrier mix means the addressable account base skews heavily toward 10-or-fewer-truck operators. Any market story that only focuses on large fleets will miss most accounts by count, even if premium dollars concentrate elsewhere.
  claimRefs:
  - CM008
  - CM009
  - CM011
  - CM012
- calloutType: risk
  title: Public TAM precision is weaker than public market rhetoric
  body: The public corpus supports freight, carrier-count, premium-trend, and telematics-adoption lenses, but it does not isolate a clean standalone premium pool for trucking insurance TAM, SAM, or SOM. Treat precise TAM claims with skepticism unless backed by broker or carrier data.
  claimRefs:
  - CM006
  - CM008
  - CM017
  - CM073
- calloutType: recommendation
  title: Claims execution has become a buying axis, not a back-office afterthought
  body: Survey evidence repeatedly shows fleets ranking claims speed, transparency, and support above or alongside price. In practice, that means telematics-native insurers are competing on operational outcomes, not just actuarial theory.
  claimRefs:
  - CM049
  - CM052
  - CM053
  - CM055
  - CM056
  - CM057
