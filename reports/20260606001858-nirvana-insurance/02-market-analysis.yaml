  evidenceGaps:
  - type: missing-source
    severity: material
    topic: TAM/SAM/SOM
    missingEvidence: A credible standalone premium-pool estimate for U.S. commercial trucking insurance split into fleet and non-fleet segments.
    whyItMatters: Public sources show freight activity, carrier counts, and rate pressure, but none cleanly isolate the insurance-revenue pool Nirvana is targeting.
    diligencePath: Request broker market studies, carrier statutory-line data, or actuarial premium pools that isolate commercial trucking auto liability and physical damage by fleet size.
    relatedQuestionRefs:
    - QM024
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: telematics-ready-segmentation
    missingEvidence: An independent estimate of what share of fleets already have telematics, dashcams, and data-sharing readiness by fleet-size cohort.
    whyItMatters: Adoption timing depends on how many fleets can actually connect data and operationalize usage-based or AI-native underwriting, but current evidence is mostly vendor-sponsored.
    diligencePath: Collect broker surveys, telematics-vendor penetration studies, or carrier submissions that break readiness down by fleet size and segment.
    relatedQuestionRefs:
    - QM016
    - QM024
    relatedTableRefs:
    - TM002
    - TM003
  - type: private-evidence-only
    severity: minor
    topic: buyer-priorities
    missingEvidence: An independent multi-carrier buyer survey that replicates the claims-priority and switching results without Nirvana sponsorship.
    whyItMatters: The strongest buyer-preference data in the public set is Nirvana-sponsored, so the direction is useful but the magnitude should not be treated as an industry census.
    diligencePath: Ask brokers, carriers, or trade groups for cross-carrier survey data on renewal drivers, claims switching, and telematics adoption.
    relatedQuestionRefs:
    - QM011
    - QM012
    - QM013
  - type: stale
    severity: minor
    topic: regulatory-data
    missingEvidence: A fresher regulatory source that maps official trucking exposure data directly to insurance pricing or availability.
    whyItMatters: FMCSA and ATA are authoritative on trucks, carriers, and exposure, but they do not directly answer how much premium is written or how much capacity is available.
    diligencePath: Pair official safety and carrier counts with 2026 carrier filings, market-share studies, or brokerage placement data in the next refresh.
    relatedQuestionRefs:
    - QM024
    - QM025
    relatedTableRefs:
    - TM002
