tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment/category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Large-fleet trucking insurance
    - Auto liability, physical damage, claims service, safety support for tractor-owning fleets >10 trucks
    - Unrelated small-business lines such as workers’ comp or cyber sold on bundled portals
    - Fleet owner, CFO, risk lead, broker-mediated buyer
    - Core current market for Nirvana’s fleet offer
  - - Small-fleet and owner-operator trucking insurance
    - Commercial auto for fleets at or below roughly 10 trucks, plus usage-based and transparent-billing models
    - General small-business lines not tied to vehicle risk
    - Owner-operator or small-fleet owner
    - Important adjacency by account count
  - - Claims-service and loss-control layer
    - Claims handling, communications, safety coaching, FMCSA-data workflows, and evidence tools embedded in insurance service
    - Standalone software spend not tied to insurance outcomes
    - Ops, safety, claims, and finance stakeholders
    - Critical to switching and retention even when policy forms are similar
  - - Telematics and video-data layer
    - GPS, event, dashcam, and safety data that power pricing and claims decisions
    - Consumer telematics unrelated to commercial fleet operations
    - Fleet owner, safety lead, insurer, and sometimes broker
    - Key enabler of differentiated underwriting, not the insurance premium pool itself
  - - Adjacent commercial auto / light business auto
    - Non-trucking or mixed commercial-auto fleets that still buy telematics-led underwriting and claims workflows
    - Unrelated property or casualty lines
    - Business owner or broker
    - Relevant adjacency because entrants and incumbents already sell into broader commercial-auto categories
  - - Excluded bundled small-business products
    - Workers’ comp, BOP, GL, cyber, and other lines sold alongside commercial auto by incumbents
    - —
    - Small-business buyer
    - Exclude from Nirvana TAM to avoid overstating the market
  notes: This table defines the market before sizing it. The relevant boundary is trucking-centric commercial auto plus closely adjacent small-fleet commercial auto, not every insurance line sold on a commercial portal.
