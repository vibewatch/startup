- id: sizing-lenses
  title: 'Multiple sizing lenses: activity, account counts, and insurance pressure'
  body: 'A single dollar TAM would overstate precision, so the market is better sized through multiple lenses. The freight-economy lens is undeniably large: ATA says trucks moved 72.7% of national freight by weight in 2024 and generated an estimated $906 billion freight bill. But that lens measures economic throughput, not insurer revenue. The account-count lens gives a more decision-useful structure. ATA reports almost 580,000 active tractor-owning carriers as of June 2025, with 91.5% operating 10 or fewer trucks and 99.3% operating 100 or fewer. In other words, the account base is overwhelmingly small-fleet by count, while the larger-fleet cohort above 10 trucks is only about 49,300 carriers by a simple estimate. The insurance-stress lens adds another perspective: CBIZ, Dominion, and Trucking Dive all show ongoing premium pressure, poor underwriting profitability, and continued hard-market behavior in 2024 and 2025. That confirms the category is economically important and painful enough
    to drive switching, but it still does not isolate a clean premium pool for trucking auto insurance or the exact subset ready for AI-native underwriting. Public evidence supports multiple constrained lenses, not a fake-precision TAM/SAM/SOM stack.'
