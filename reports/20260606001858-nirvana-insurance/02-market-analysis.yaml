- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Nuclear verdicts and social inflation
    - Driver for modern underwriting / constraint on affordability
    - Current
    - Push fleets toward better evidence and risk selection while also raising prices and shrinking appetite
    - Verify actual verdict exposure and excess-layer availability by segment
  - - Persistent premium inflation and poor underwriting profitability
    - Driver and constraint
    - Current
    - Creates demand for alternatives but also compresses buyer budgets
    - Check renewal quotes and program structures across target fleet cohorts
  - - Telematics, dashcams, and FMCSA-linked safety data
    - Driver
    - Current
    - Enable differentiated pricing, coaching, fraud defense, and claims speed
    - Measure installation rates and data-sharing readiness by fleet size
  - - AI underwriting and AI-assisted claims automation
    - Driver
    - Current to near term
    - Can compress quote and claims cycle times, but requires trust in data and workflow design
    - Request measured cycle-time improvements and loss-ratio evidence
  - - Usage-based / mileage-linked pricing
    - Driver
    - Near term
    - Appeals to small and mid-sized fleets facing volatile utilization
    - Test whether customers actually prefer mileage-based pricing over fixed premium models
  - - Driver shortages and inconsistent experience levels
    - Constraint
    - Current
    - Can increase accident risk and pressure underwriting results
    - Assess how underwriting penalizes turnover and inexperienced-driver mixes
  - - Capacity withdrawal and tighter excess layers
    - Constraint
    - Current
    - Hardens the market for larger or poorer-loss-history fleets
    - Collect broker evidence on which layers are hardest to place
  - - California-style regulatory and litigation complexity
    - Constraint
    - Current
    - Raises compliance burden and may reduce willing insurers
    - Map which states look most like California on capacity and pricing
  - - EV, ADAS, and repair-cost inflation
    - Constraint
    - Near term
    - Raises repair severity, cyber exposure, and downtime risk
    - Quantify how mixed-powertrain fleets are being priced today
  notes: 'Several rows are both growth drivers and constraints: the same forces that make telematics-native underwriting attractive also make the line harder to price and place.'
