- id: drivers-constraints-and-gaps
  title: Growth drivers, telematics dynamics, claims-cost pressure, and diligence gaps
  body: The strongest growth driver is not abstract digitization; it is the hard economics of a damaged commercial-auto market. Premiums are rising, combined ratios have stayed above 100 for years, ATRI says liability premiums rose 36% per mile over eight years, and nuclear or thermonuclear verdicts continue to widen loss severity. Those pressures make better risk segmentation, proactive safety programs, and faster claims resolution commercially attractive. Telematics dynamics reinforce that case. Nirvana’s materials, Carrier Chronicles, and multiple survey pages all show a market where cameras, AI alerts, FMCSA-linked safety data, and claims evidence are moving from optional tools to expected infrastructure. But the same forces create constraints. California shows how regulatory intensity, social inflation, and carrier exits can shrink affordable capacity. Driver shortages, repair inflation, EV complexity, and data-sharing requirements also slow adoption or raise switching friction. Most
    importantly, public diligence still stops short of a clean TAM or SAM. Official sources tell us the trucking economy is huge and the carrier base is fragmented; market commentaries tell us the line is stressed; and vendor-sponsored surveys tell us buyers want better claims and technology. What they do not yet give us is an authoritative, standalone trucking-insurance premium pool segmented by fleet size and telematics readiness. That unresolved gap should stay visible in the chapter rather than be reverse-engineered into false certainty.
