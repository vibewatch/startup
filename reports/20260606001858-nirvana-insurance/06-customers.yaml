- id: retention-and-satisfaction
  title: Retention signals and satisfaction evidence
  body: |-
    Direct retention metrics—NRR, GRR, or annual churn—are not publicly disclosed. Available evidence consists of renewal anecdotes, an aggregated third-party score, and market research published or sponsored by Nirvana itself. Five Star and Red Stag both confirmed renewals explicitly in their success stories, and the monthly wins pages show renewal transactions alongside new business through March 2026, which is consistent with an active renewal pipeline but does not reveal aggregate retention rates.

    Nirvana's 2025 Claims Experience Report surveyed 100 fleet decision-makers and found that 88% believe their current insurer's claims process needs significant improvement, 51% want faster claims resolution as their single top ask, and 86% support the expanded use of telematics and camera data in claims servicing. Claims Theme 2 from the same study found that 94% of respondents view technology as extremely useful during claims, 82% voluntarily use in-cab cameras, and 77% use telematics or dashcam footage. Claims Theme 4 documented that 80% now rank fast and reliable claims processing as their top priority—above the 62% who prioritize cost—while 53% believe camera evidence should help decide settlements. An independent survey by Carrier Management and Ledger360 of 100 fleet operators found that nearly one in four had switched insurers after unsatisfactory claims experiences, and that 68% operated fleets of 250 or fewer trucks, precisely the segment Nirvana targets most directly. The average respondent filed 9.3 claims per year, making claims service quality a repeated, high-frequency touchpoint rather than a rare event.

    GMG Express's Safety Manager described receiving weekly updates and real-time claim history as a complete reversal from a previous provider who left him "in the dark for weeks"; TTR Shipping confirmed that safety data access that used to take a month is now instant. These are direct satisfaction signals even if not externally audited.
