- id: named-proof
  title: Named customer proof and adoption trajectory
  body: |-
    The strongest customer evidence comes from five company-published success stories, each anchored to a distinct use case. Five Star Trucking is a 48-state truckload carrier and full brokerage, founded in 1974, that renewed with Nirvana after a first year described as having "no surprises"—a direct renewal signal tied to pricing predictability and safety-program engagement. Red Stag, a Texas carrier with 150+ power units, became a customer in October 2023 and renewed for at least a second year. Red Stag's Safety Vice President credited Nirvana's Safety Intelligence Platform with consolidating FMCSA and telematics data that previously required manual effort across separate systems. TX Load Runners, a 46-truck Texas carrier, connected telematics in under three minutes via a secure agent link and selected Nirvana specifically for upfront data-driven pricing discounts—a workflow unique among the carriers it had previously evaluated. TTR Shipping had faced ongoing safety violations and poor communication from a prior insurer; after switching, its team improved its safety score by 50% and described the Safety Platform as its "daily command center," with access to data that previously took a month now available instantly. GMG Express switched after its previous provider repeatedly closed claims without investigation; since moving to Nirvana, its safety manager receives weekly claim update emails and views full claim history in the Safety Platform—contrasting sharply with "weeks in the dark" under the prior insurer.

    Beyond named stories, FeaturedCustomers aggregates 9 testimonials, 7 case studies, and 137 reference ratings at a 4.8/5.0 score. Company wins pages covering December 2025 through March 2026 show new-business and renewal transactions including a $1.6M 150-unit refrigerated carrier in California (December 2025), a $1.2M 80-unit Iowa reefer fleet (March 2026), and a $910K 60-unit California carrier (March 2026), as well as several smaller accounts at 40-70 power units across Missouri, Illinois, and Texas. The Ascend billing-platform case study reports that Nirvana achieved a 2x increase in retail appointments and saved 1 FTE hire while scaling its non-fleet program, suggesting rapid new-business velocity through agency channels.
