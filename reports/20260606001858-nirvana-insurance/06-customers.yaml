  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention cohorts and churn
    missingEvidence: No NRR, GRR, annual churn rate, average policy tenure, or cohort retention data was found in any retained public source.
    whyItMatters: Without retention data, it is impossible to determine whether Nirvana's customer book is sticky or experiencing elevated cancellation, which matters most when adjacent competitors offer lower prices.
    diligencePath: Request NRR, GRR, and annual churn by product line (fleet vs non-fleet) and fleet-size band; ask for the three most recent cohort snapshots.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer concentration
    missingEvidence: No top-account exposure, premium concentration by customer, or contract-length data was found publicly.
    whyItMatters: Logo breadth (thousands of carriers) does not exclude economic concentration in a small number of large accounts; one non-renewal among large fleet clients could disproportionately affect premiums.
    diligencePath: Request top-10 accounts by annual premium, their renewal history, and any concentration above 5% of total premiums.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: independent consumer review depth
    missingEvidence: As of March-April 2026, no Trustpilot, Google Reviews, BBB, TruckersReport, or Reddit entries were found for Nirvana in retained sources.
    whyItMatters: The absence makes it impossible to triangulate satisfaction evidence from sources that are not company-curated or customer-reference-selected.
    diligencePath: Monitor for emerging independent reviews; request NPS data and any verbatim survey feedback from non-curated respondents.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU004
    - TU006
  - type: enumeration-incomplete
    severity: minor
    topic: named customer proof coverage
    missingEvidence: Only five named success stories and three months of partially anonymized wins pages are retained; the full customer list across thousands of motor carriers is not enumerable from public sources.
    whyItMatters: The named proof covers the most favorable customer experiences; the wins pages cover only a curated monthly subset; concentration and representativeness cannot be assessed.
    diligencePath: Request the current active customer list by segment with premium, state, and tenure; reconcile against wins pages and FeaturedCustomers references.
    relatedQuestionRefs:
    - QU012
    - QU024
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: minor
    topic: geographic footprint uncertainty
    missingEvidence: Two retained sources give different active state counts—Ascend reports 28+ states while TruckingWay puts coverage at 26-27 states as of early 2026; no canonical state-by-state map was found in retained public sources.
    whyItMatters: Geographic gaps limit which motor carriers Nirvana can serve; operators with routes through uncovered states cannot use Nirvana for full fleet coverage, and the discrepancy between sources has not been independently resolved.
    diligencePath: Request the current admitted and non-admitted state map by product line and confirm the timeline for pending state filings.
    relatedQuestionRefs:
    - QU016
