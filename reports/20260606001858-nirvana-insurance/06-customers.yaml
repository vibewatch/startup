chapter:
  number: 6
  title: Customers
  summary: |-
    Nirvana's public customer story centers on small-to-mid-size motor carriers—predominantly 40-150 power units—served exclusively through appointed brokers across 26-28 states. Named proof from Five Star (48-state carrier, no surprises at renewal), Red Stag (150+ PU, customer since October 2023, renewed), TX Load Runners (telematics connected in under 3 minutes), TTR Shipping (50% safety score improvement), and GMG Express (superior claims experience) covers the four primary value propositions Nirvana markets. A FeaturedCustomers aggregate score of 4.8/5.0 across 137 ratings, Crunchbase's characterization of "thousands" of motor carriers, and wins pages showing new business and renewals through March 2026 support meaningful scale. An adverse review from TruckingWay flags zero independent consumer reviews as of March 2026 and coverage limited to 26-27 states. No NRR, GRR, churn, or customer-concentration data was found in any retained public source.
sections:
- id: segments-and-buyers
  title: Segments, buyers, and ICP profile
  body: |-
    Nirvana's public customer evidence points to a narrow, well-defined ICP: motor carriers ranging from single-owner-operators to fleets with more than 500 trucks, purchasing coverage exclusively through appointed brokers or retail agents. The two product lines—non-fleet (1-9 power units) and fleet (10+ power units)—create a product surface that is inclusive of small carriers while targeting the mid-size fleet as the natural sweet spot where telematics discounts, per-customer underwriting models, and active safety tools generate the most visible value.

    Crunchbase characterizes the customer base as "thousands" of motor carriers spanning single-owner-operators to fleets with more than 500 trucks, which aligns with the Ascend case study confirming 28+ active states and the wins pages showing policy transactions from 40 to 150 power units between December 2025 and March 2026. TechCrunch's Series C coverage independently corroborates that both fleet and non-fleet customers use telematics and FMCSA data as core underwriting inputs. The ICP is further shaped by the telematics requirement: TruckingWay notes that telematics hardware is effectively required to unlock the core value proposition, meaning the most natural early buyers are carriers already running ELDs or dash cams. The channel is entirely broker-mediated; TruckingWay confirms that as of March 2026 there is no direct digital bind capability.
