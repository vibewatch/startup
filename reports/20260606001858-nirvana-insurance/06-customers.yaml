- id: TU005
  title: Expansion path and concentration risk table
  columns:
  - Dimension
  - Current state
  - Expansion signal
  - Risk or constraint
  - Diligence question
  rows:
  - - Geographic coverage
    - 26-28 states (two sources give slightly different counts); California non-admitted
    - Series D and wins-page activity through March 2026 suggest active expansion
    - Operators with multi-region fleets outside current footprint cannot be fully served
    - Request current admitted/non-admitted state map and 12-month expansion plan
  - - Fleet-size coverage
    - Non-fleet 1-9 PU to fleet 500+ PU; named proof clusters at 40-150 PU
    - Crunchbase confirms 500+ truck fleets served; wins pages show range
    - No named proof above ~150 PU; underwriting complexity increases with size
    - Request premium or count concentration across fleet-size bands
  - - Customer concentration
    - Not disclosed; "thousands" suggests breadth but top-account share is unknown
    - Doubled YoY premium growth (Crunchbase) suggests new logos, not just expansion
    - Unaudited; top-5 or top-10 accounts could represent material concentration
    - Request top-10 accounts by premium and their renewal history
  - - Distribution channel
    - Agent-only as of March 2026; no direct digital bind confirmed
    - Ascend direct-billing simplifies retail agent workflow; 2x appointments achieved
    - Every new policy requires a broker; limits direct-acquisition speed
    - Confirm whether a direct bind capability is planned and on what timeline
  - - Product breadth
    - Primary-auto liability plus AL/APD/GL/MTC as evidenced in wins pages
    - Series D implies broader commercial-insurance ambitions
    - New coverage lines require additional state filings and carrier-paper capacity
    - Request current carrier-paper scope and non-admitted filing roadmap
  notes: Expansion signals are drawn from wins pages, funding announcements, and the Ascend case. Risks and constraints are analytical inferences, not company promises.
