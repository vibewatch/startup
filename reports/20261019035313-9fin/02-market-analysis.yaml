callouts:
  - calloutType: "insight"
    title: "The category pitch is workflow-specific, not generic AI"
    body: "9fin's reachable budget appears to sit inside debt-market workflows such as origination, credit research, restructuring, and legal analysis, which makes adoption timing dependent on desk-level ROI rather than a horizontal AI platform purchase."
    claimRefs: ["CM003", "CM006", "CM014"]
  - calloutType: "risk"
    title: "Sizing remains proxy-based"
    body: "The retained evidence supports a large category and real institutional penetration, but it still does not isolate a bottom-up SAM/SOM by asset class, geography, or buyer cohort, limiting how tightly this chapter can connect market size to valuation."
    claimRefs: ["CM004", "CM009", "CM013"]
