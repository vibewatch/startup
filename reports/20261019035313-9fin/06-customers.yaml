callouts:
  - calloutType: "strength"
    title: "Cross-functional workflow fit is the strongest part of the customer story"
    body: >-
      Public evidence consistently shows 9fin selling into interconnected debt-market teams rather than a
      single analyst persona, which improves the odds of multi-seat adoption inside one institution.
    claimRefs: ["CU001", "CU002", "CU007", "CU008"]
  - calloutType: "risk"
    title: "Durability is still under-disclosed"
    body: >-
      The company talks about best-in-class retention, but the reviewed sources do not publish NRR, churn,
      contract length, or top-customer concentration, leaving a meaningful diligence gap on renewal quality.
    claimRefs: ["CU009", "CU013"]
