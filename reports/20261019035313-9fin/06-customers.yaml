company:
  name: "9fin"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    9fin shows credible breadth across bank, buy-side, legal, and advisory credit workflows, and public
    materials point to at least 300+ institutions or 350+ leading credit teams on the platform by 2026.
    The stronger adoption proof is role-level workflow fit and a small set of testimonials, while durability,
    concentration, and renewal quality remain under-disclosed for an underwriting-grade customer chapter.
sections:
  - id: "customer-footprint"
    title: "Customer footprint is broad, but the segmentation proof is still mostly company-reported"
    body: >-
      The public record consistently places 9fin inside professional credit workflows rather than generic
      fintech productivity tooling. Official materials say the platform serves banks, asset managers,
      advisors, and law firms, while the banking page expands that into concrete workflows spanning
      origination, syndicate, sales and trading, credit research, and restructuring. The breadth is useful
      because it implies multiple buyer personas inside one credit organization, but most of the segmentation
      evidence is still company-controlled. Even the strongest scale claims — all top-10 investment banks,
      80% of trading desks, and more than 350 leading credit teams — are presented through company-authored
      surfaces rather than customer-by-customer disclosure, so the takeaway is wide market penetration with
      limited public transparency on payer mix and revenue contribution by segment.
    claimRefs: ["CU001", "CU002", "CU004", "CU010", "CU011"]
    tableRefs: ["TU001"]
    figureRefs: ["FU001"]
  - id: "adoption-proof"
    title: "Adoption proof shows real workflow usage, but public evidence is heavier on testimonials than deployment metrics"
    body: >-
      9fin has more customer proof than a simple logo wall, but less than a diligence-grade cohort file.
      IK Partners provides the cleanest named proof: the customer story and an independent feature repeat the
      same quote that 9fin's analytics help structure transactions intelligently and operate more efficiently.
      Beyond that, the best public evidence comes from anonymous testimonials on the AI page from a global law
      firm, an asset manager, and an investment bank. Those quotes matter because they show role diversity and
      practical usage, but they stop short of disclosing contract scope, seat count, rollout depth, or whether
      the deployments are departmental experiments versus firm-wide standards. The result is credible adoption
      evidence with modest reference quality.
    claimRefs: ["CU005", "CU006", "CU011"]
    tableRefs: ["TU002", "TU003"]
  - id: "durability-and-expansion"
    title: "Expansion signals are credible; durability and concentration are not yet underwritten"
    body: >-
      The customer story gets stronger when viewed through 2026 product expansion. The June 2026 AI release
      positions AI Chat and Research Grid as tools for screening, comparison, deal structuring, and risk work
      across existing client types, while the September 2026 Private 9fin launch adds sponsor and private-name
      monitoring that can widen usage within the same accounts. That supports a plausible land-and-expand
      motion. The weaker side is durability: public materials claim best-in-class retention, but the reviewed
      sources do not publish NRR, GRR, churn, renewal rates, contract lengths, or top-customer exposure.
      An otherwise favorable independent profile still notes that AI-native credit platforms face data-quality
      and model-reliability challenges, so procurement and governance friction should be treated as unresolved
      rather than assumed away.
    claimRefs: ["CU007", "CU008", "CU009", "CU012", "CU013", "CU014"]
    tableRefs: []
