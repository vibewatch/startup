company:
  name: "9fin"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    9fin presents itself as an AI-native debt-markets intelligence platform that has grown from a
    2016 founding into a 2026 unicorn valued at $1.3 billion after a $170 million Series C. Public
    sources support meaningful commercial traction and an expanding product footprint, but revenue,
    current headcount, board composition, and full cap-table terms remain materially under-disclosed.
sections:
  - id: "identity-and-positioning"
    title: "Identity, positioning, and operating footprint"
    body: |-
      9fin is consistently described across its own web properties and third-party profiles as an
      AI-native platform for global debt or credit markets rather than a broad horizontal finance
      tool. The company frames the product around a combined workflow of market news, legal and deal
      documents, historical data, analytics, and cited AI outputs for banks, asset managers,
      advisers, and related credit-market professionals. Public company-controlled materials also
      place the business in London with operating presence in New York, Hong Kong, and Belfast, with
      broader team coverage across Latin America and Asia. The resulting picture is a private,
      growth-stage enterprise software company selling specialized workflow infrastructure into debt
      capital markets, but with pricing and several core operating metrics still undisclosed in the
      assigned source pool.
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO005", "CO006", "CO016"]
    tableRefs: ["TO001"]
  - id: "leadership-and-governance"
    title: "Leadership visibility, founder dependence, and governance disclosure"
    body: |-
      Public disclosures remain heavily founder-led. Steven Hunter appears as chief executive and the
      main commercial narrator across fundraising and product-launch materials, while Hussam
      El-Sheikh is consistently identified as co-founder and chief technology officer. The June 2026
      AI launch also puts Chief Product Officer Moisés García on record for the product roadmap, and
      the company-announcement feed shows 2026 additions in customer partnerships and emerging
      markets. That operating depth is constructive, but the assigned pool still does not disclose a
      current board roster, voting control, liquidation preferences, or fully diluted ownership, so
      governance and control remain diligence questions rather than reusable facts.
    claimRefs: ["CO001", "CO013", "CO014", "CO015"]
    tableRefs: ["TO002"]
  - id: "funding-history-and-stakeholders"
    title: "Funding history, scale disclosures, and stakeholder map"
    body: |-
      The public financing arc is legible even though the full cap table is not. Tech.eu reports a
      $23 million Series A+ in December 2022, Business Wire reports a $50 million Series B in
      December 2024, and 2026 sources converge on a $170 million Series C at a $1.3 billion
      valuation. The British Business Bank states that its own $20 million participation helped push
      total capital raised above $250 million, while company-controlled surfaces now cite penetration
      across hundreds of institutions and top-tier investment-bank workflows. Those claims support a
      credible scale narrative, but investor economics, secondaries beyond the July 2026 employee
      liquidity event, and current revenue quality remain opaque.
    claimRefs: ["CO007", "CO008", "CO009", "CO010", "CO011", "CO012"]
    tableRefs: ["TO003"]
    figureRefs: ["FO001"]
  - id: "milestones-and-evidence-quality"
    title: "Milestones, current momentum, and evidence-quality caveats"
    body: |-
      The 2026 source set points to a company still broadening both geography and product scope.
      Public materials show Latin America coverage, AI Chat and Research Grid, new regional hubs, a
      first employee secondary sale, and an ISO 42001 certification for AI governance. At the same
      time, not all overview evidence carries the same weight. One third-party profile explicitly
      says it reflects 9fin's self-description rather than an independent audit, and Yahoo labels
      the June 2026 launch item as paid press-release content. The overview chapter is therefore
      strong enough to establish identity, funding landmarks, and disclosed scale, but not strong
      enough to treat missing adverse, governance, and unit-economics evidence as cleared.
    claimRefs: ["CO011", "CO012", "CO015", "CO016"]
callouts:
  - calloutType: "risk"
    title: "Governance and economics still underwrite with blind spots"
    body: >-
      Public sources support the valuation step-up and product expansion, but they still do not
      disclose board composition, full cap-table rights, current revenue, ARR, NRR, or burn.
    claimRefs: ["CO010", "CO014", "CO015"]
  - calloutType: "insight"
    title: "Scale claims look directionally strong but remain partly company-controlled"
    body: >-
      9fin's 2026 footprint claims are consistent across several surfaces, yet many of the strongest
      current-scale datapoints still originate on company-controlled pages or syndicated releases.
    claimRefs: ["CO005", "CO010", "CO015"]
