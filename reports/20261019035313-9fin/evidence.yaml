evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Current revenue run rate, ARR, NRR, gross margin, burn, and runway.
    whyItMatters: >-
      The overview can describe valuation and scale narrative, but it cannot test quality of growth or downside
      financing risk without current operating metrics.
    diligencePath: >-
      Request the latest board pack or audited FY2024-FY2025 financial statements with revenue, retention, margin, and
      cash-burn schedules.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      Current board composition, voting control, liquidation preferences, debt or SAFE overhang, and fully diluted
      ownership.
    whyItMatters: >-
      Funding totals alone do not show control, liquidation stack, or whether the unicorn valuation translates into
      acceptable entry economics.
    diligencePath: Request the current cap table, board observer list, latest financing documents, and any side-letter summary.
    relatedQuestionRefs:
      - QO002
      - QO003
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-coverage
    missingEvidence: Independent litigation, regulatory, outage, layoffs, or other adverse-source coverage for the current period.
    whyItMatters: >-
      The assigned overview pool is rich on company narrative and financing news but does not independently clear
      operational, legal, or reputational downside.
    diligencePath: >-
      Run dedicated legal, regulatory, enforcement, outage, and layoff searches and add direct source coverage before
      treating the risk screen as complete.
    relatedQuestionRefs:
