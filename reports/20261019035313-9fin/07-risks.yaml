  evidenceGaps:
    - type: missing-source
      severity: material
      topic: model-governance-and-liability
      missingEvidence: Public or diligence-only evidence on model error rates, override rates, incident logs, customer liability allocation, and mandatory human review for AI-assisted workflows.
      whyItMatters: Without production-quality QA and liability evidence, the highest-severity risk cannot be underwritten from marketing language alone.
      diligencePath: Request AI governance packs, customer contract language, escalation playbooks, and post-incident review materials from management and security leads.
      relatedQuestionRefs: [QR002, QR003, QR004]
      relatedTableRefs: [TR001, TR002]
    - type: missing-source
      severity: material
      topic: financial-underwriting
      missingEvidence: Audited or investor-grade FY2025-FY2026 revenue, gross margin, burn, runway, pricing architecture, and current retention metrics.
      whyItMatters: Funding size and valuation are public, but operating quality and durability are still too opaque to underwrite downside or valuation support confidently.
      diligencePath: Obtain board or investor reporting, audited financials, cohort retention packs, and pricing documentation.
      relatedQuestionRefs: [QR006, QR007]
      relatedTableRefs: [TR003]
    - type: missing-source
      severity: material
      topic: customer-concentration
      missingEvidence: Current top-customer concentration, renewal schedules, NRR by segment, and procurement-cycle data for large-bank and asset-manager accounts.
      whyItMatters: Strong logo penetration can mask concentration, long sales cycles, or expansion dependence if segment-level retention is weak.
      diligencePath: Request customer concentration tables, cohort retention by segment, and top-account renewal histories from GTM and finance leadership.
      relatedQuestionRefs: [QR005]
      relatedTableRefs: [TR003]
    - type: missing-source
      severity: minor
      topic: legal-and-compliance-mapping
      missingEvidence: Jurisdiction-by-jurisdiction mapping of where 9fin's newer AI workflows enter regulated advice, communications, data-rights, or privacy review.
      whyItMatters: Expansion across products and geographies can create hidden approval or workflow-boundary risk even without a visible public dispute today.
      diligencePath: Review privacy, DPA, compliance, and product-governance materials with counsel and product owners for each major market.
      relatedQuestionRefs: [QR004, QR008]
      relatedTableRefs: [TR001]
