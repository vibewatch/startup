      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: AI 质量是论点破坏风险
            body: 由于 9fin 将带引用的 AI 销售给契约、资本结构、财报和信用比较工作流，核心下行风险不是需求不足，而是生产质量失误在控制发现之前已经进入客户决策。
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR012
          - type: callout
            title: 融资降低偿付风险，但不降低承销不透明
            body: $170m C 轮融资和累计超过 $250m 的融资提供资产负债表支持，但公开证据仍不足以在 $1.3b 估值下评估当前收入质量、现金消耗、定价能力或集中度。
            calloutType: risk
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR011
          - type: callout
            title: 尽调应强制取得量化客户与模型证据
            body: 在提高判断确定性之前，尽调应要求客户集中度、续约和 NRR 数据，以及模型 QA、事故和合同控制证据，说明 AI 失败如何被预防、发现和分配责任。
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 对价格敏感的建议
        blocks:
          - type: paragraph
            body: >-
              最干净的公开信号是，9fin 最近经过验证的价格锚仍是 2026 年 3 月 C 轮的 13
              亿美元估值；据报道，之后的员工二次交易以同一估值成交，而非进一步上调。这一点确认了流动性和估值标记的持续性，但不证明价格出现新的上调。同时，本次证据仍未披露经审计
              ARR、净留存、毛利率、现金消耗和优先权结构细节，因此当前估值比承销它更容易观察。基于此，              价格敏感型判断为“跟踪”：公司看起来是真实业务，但入场逻辑仍需要更硬的财务证明或更好的价格。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV011
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.2'
        title: 哪些支持溢价，哪些不支持
        blocks:
          - type: paragraph
            body: >-
              9fin 的溢价定位确有真实证据支撑。Debriefing 称平台服务超过 300 家金融机构；9fin 自己的银行和 AI
              页面则描述了覆盖新闻、数据、文件、契约、资本表、财务数据、申报文件和法律分析的连接式工作流。这些来源支持 9fin 销售的是工作流平台，而非单一功能。但估值支持弱于产品支持。Tracxn 和 Dealroom
              提供了有用的融资和倍数指标，可公开记录对收入质量的刻画仍过于粗糙，对留存和利润率的披露也过少，无法把工作流广度转化为干净的承销案例。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.3'
        title: 情景区间与入场纪律
        blocks:
          - type: paragraph
            body: >-
              由于指定证据集包含经过验证的价格标记，却缺乏完整的分子数据，情景区间应保持宽泛。乐观情景要求 9fin 新推出的 AI、发起人跟踪和更广泛工作流模块能够变现为持久的增购和留存。基准情景假设现有 13
              亿美元估值在更硬证据出现前大致公平。悲观情景并非假设：Dealroom 显示 2024 年末此前估值为 5 亿美元，其公布的
              EV/收入倍数意味着未来上行更多取决于持续增长，而非倍数扩张。因此，入场纪律比单独看公司质量更重要。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 最终尽调要求与论点破坏因素
        blocks:
          - type: paragraph
            body: >-
              从“跟踪”进入“买入”最快的路径，是核实经审计 ARR、毛利率、现金消耗、NRR、产品线组合以及 2026 年 3
              月融资的实际经济性。缺失的资本表细节尤其重要，因为即使名义企业价值保持不变，清算优先权、完全摊薄后的股份数和二次出售规模也会实质改变实际回报。如果工作流扩张无法变现、竞争压力削弱差异化，或 9fin
              发布更强财务披露前私募市场估值纪律收紧，论点也会被打破。在这些事项得到解决之前，公开证据更支持耐心，而非坚定下注。
            claimRefs:
              - CV011
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 当前判断
            body: 按当前公开估值跟踪 9fin：公司明显强于投机性概念，但承销案例仍弱于产品案例。
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV016
