        - AI Chat、Research Grid、发起人跟踪和更广泛的银行家工作流转化为持续增购和可持续增长。
        - 如果增长速度超过进一步的倍数压缩，估值可能高于当前轮次估值，大约进入 $1.5B-$2.0B 区间。
        - 需要独立证据证明扩张产品已经变现，而不只是发布上线。
      - - 基准
        - 产品市场匹配仍可信，但公开财务披露仍不完整，当前老股交易仍是最好的价格信号。
        - 在更深入的尽调提供更扎实的分子数据前，估值可能维持在当前水平附近，大约 $1.1B-$1.4B。
        - 当前指定证据大多符合这一情景。
      - - 悲观
        - 增长放缓、产品广度无法充分变现，或私募市场的估值纪律明显收紧。
        - 下行可能将估值拉回此前 $500M 的水平与大约 $1.0B 之间的宽幅区间。
        - ARR、NRR、利润率和优先股细节缺失，使下行风险比表面估值所暗示的更难排除。
    notes: 这些区间以 Dealroom 披露的 $500M 2024 年估值、$1.3B 2026 年估值和公开的 EV / 收入参考点为锚；它们只是示意性的分析区间，不是精确估值。
