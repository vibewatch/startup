      - number: '4.3'
        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              最近一轮融资明显增强了 9fin 持续投资的能力，但没有消除主要尽调障碍。独立报道和合作方披露一致表明，9fin 在 2026 年完成 1.7 亿美元 C 轮融资，估值 13 亿美元，累计融资超过 2.5
              亿美元，资金用于 AI 能力开发、专有数据扩张和继续拓展美国市场；其中 British Business Bank 单独出资 2000
              万美元。这看起来是用于产品和市场扩张的成长资本，而不是公开可见的救助融资。即便如此，审阅过的来源没有披露现金余额、现金消耗、跑道、债务义务、毛利率或营运资金需求，因此财务结论是“商业前景可观，但仅凭公开证据仍无法完成承销”。下一步尽调不应再寻找叙事性来源，而应获得管理层或数据室提供的经审计运营指标。
