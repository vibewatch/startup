              公开增长披露方向积极，但对承销而言仍不完整。9fin 当前关于页面称其为 350 多家机构的信用团队提供支持，而 2026 年春季融资报道称已有超过 300 家机构上平台。2026 年报道还称公司 ARR
              已连续多年实现 100% 增长；其 2024 年 B 轮公告则称，自 2022 年 A+ 轮以来集团 ARR 增长 400%，当时接近 200 家客户、拥有 240
              名员工。这些数据支持真实采用和扩张，但仍不足以分析收入质量，因为公开记录没有绝对 ARR、收入运行率、毛利率、CAC 回收期和留存。外部 ICP 分析还把 Bloomberg
              的根深蒂固、更偏好综合平台以及预算限制列为真实转化阻力，这些因素同时影响赢单率和定价能力。
