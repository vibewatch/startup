  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局仍从现状与现有巨头开始
        blocks:
          - type: paragraph
            body: >
              最清晰的公开判断是，9fin 首先要与债务团队现有的工作方式竞争：在时间压力下拼接零散
              PDF、邮件、贷款人备忘录、数据室和自有模型。独立报道指出，债务市场仍由拥有强大数据业务、分销能力和根深蒂固工作流的现有巨头主导，因此 9fin
              并非只参加一场狭窄的功能对比。它试图用一个面向信用研究、比较和执行支持的统一运营层，替代多工具和人工流程的蔓延。真正的替代方案是广泛的现有巨头套件、内部自建系统和已经嵌入机构团队的工作习惯，而不只是少数创业公司同行。
