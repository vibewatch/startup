        - 在时间压力下逐笔组装信贷观点的分析师
        - 显性软件依赖低，但人工工作繁重且来源链条薄弱
        - 缓慢的比较周期与碎片化上下文，正是 9fin 试图替代的对象
      - - 内部自建 / 定制模型
        - 机构仍在团队内部依赖专有模型与本地工作流
        - 拥有专业分析师与内部工具资源的团队
        - 适配本地流程与内部偏好
        - 维护负担与薄弱的共享上下文让规模化扩展更难
      - - 叠加在现有工具上的 AI 插件
        - 独立文章称，第一波金融 AI 大多是叠加在现有工具上的副驾驶
        - 希望加快摘要或笔记起草、但不替换技术栈的团队
        - 无需重建更广泛的信息技术栈即可加速狭窄任务
        - 如果缺少结构化专有债务数据与工作流上下文，护城河更弱
    notes: |
      这是基于留存公开证据的类别层面视角；指定来源池不包含可比的点名同业产品页面或价格卡，因此表格画像的是替代方案类别，而不是封闭的厂商清单。
