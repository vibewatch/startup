  - id: FI001
    title: 9fin 公开收入模型桥接
    type: flow
    summary: 公开证据支持从企业工作流到订阅收入的桥接，但并未披露实际定价或毛利计算。
    data:
      nodes:
        - id: institutions
          label: 机构信用团队
          detail: 覆盖银行、资产管理机构、对冲基金、律师事务所、顾问和私人信贷基金的 350+ 家机构。
        - id: platform
          label: 一体化债务市场平台
          detail: 覆盖公开和私人信贷工作流的新闻、数据、文件、法律洞察和 AI。
        - id: modules
          label: 可变现的工作流模块
          detail: AI Chat、Research Grid、业绩电话会摘要、契约 / 文件智能和私人信贷跟踪。
        - id: sales-motion
          label: 以演示为导向的企业销售
          detail: 公开页面使用演示和免费试用 CTA；未披露席位数、用量或合同定价等数字。
        - id: expansion
          label: 采用与扩张
          detail: 公开报道显示，机构数从 2026 年初的 300+ 增长到当前官方文案中的 350+，因此账户仍在持续扩张。
        - id: visibility-gap
          label: 收入和毛利可见性缺口
          detail: 绝对 ARR、收入运行速率、毛利率、CAC / 回本期、烧钱速度和现金跑道仍未公开披露。
      edges:
        - from: institutions
          to: platform
          label: 债务市场工作流需求
        - from: platform
          to: modules
          label: 封装进具体研究工具
        - from: modules
          to: sales-motion
          label: 通过企业访问权限销售
        - from: sales-motion
          to: expansion
          label: 客户数增长和交叉销售
        - from: expansion
          to: visibility-gap
          label: 增长势头可见；单位经济性不可见
    approximationNotes: 该流程图是概念性的；其顺序和产品界面有来源支持，但不代表公司披露了转化率、贡献利润率或量化的扩张收入。
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI009
      - CI010
      - CI011
      - CI016
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 9fin 披露的技术栈将债务市场内容和专家背景置于工作流专用 AI 应用及企业控制之下。
    data:
      layers:
        - label: 来源语料库
          detail: 债务市场文件和事件流
          modules:
            - 申报文件 / 招股书
            - 新闻 / 业绩电话会
          outputs:
            - 原始债务市场输入
        - label: 结构化数据基础
          detail: 规范化分析和历史市场背景
          modules:
            - 20+ 年债券 / 贷款数据
            - 资本表 / 定价 / 契约
          outputs:
            - 可比公司和筛选数据集
        - label: 专家增补
          detail: 叠加在数据之上的编辑、法律和分析师背景
          modules:
            - 编辑部报道
            - 法律 / 信贷框架
          outputs:
            - 解读后的市场背景
        - label: 工作流应用
          detail: 面向信用市场交易台的角色专用界面
          modules:
            - 发起 / 基准比较
            - 重组 / 研究
          outputs:
            - 可直接执行任务的工作流
        - label: AI 交互层
          detail: 面向用户、用于回答、总结和比较的 AI 工具
          modules:
            - AI Chat
            - Research Grid
          outputs:
            - 带引用的决策和摘要
        - label: 治理与信任
          detail: 围绕隐私、模型处理和安全的企业控制
          modules:
            - Zero Data Retention
            - SOC 2 Type II
          outputs:
            - 企业部署准备度
    approximationNotes: 该图综合了保留的公开证据，并非供应商系统图的字面还原。
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE008
      - CE009
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 9fin 的公开客户故事从以银行为中心的债务工作流起步，并扩展至法律、买方、AI 和私人市场等相邻用例。
    data:
      nodes:
        - label: 银行发起
          touchpoints:
            - Originate earlier and build stronger pitches
            - Monitor issuance, pricing, and deal activity
        - label: 信贷分析
          touchpoints:
            - Compare terms, pricing, covenants, and capital structures
            - Trace evidence back to source documents
        - label: AI 工作流加速
          touchpoints:
            - Ask cited questions with AI Chat
            - Build comparisons in Research Grid
        - label: 法律和顾问支持
          touchpoints:
            - Benchmark covenant language and documents
            - Support transaction structuring and diligence work
        - label: 买方监测
          touchpoints:
            - Screen opportunities and benchmark risks
            - Support portfolio and private-credit monitoring
        - label: 扩展至私人发行人
          touchpoints:
            - Follow sponsors and private-company signals
            - Create new adoption surfaces inside existing accounts
    approximationNotes: 旅程阶段总结的是已披露工作流，而非经过测量的转化率或账户渗透率。
    claimRefs:
      - CU001
      - CU002
      - CU007
      - CU008
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险集中在 AI 工作流完整性、披露不透明和企业客户集中度，而不是已记录的公开事件。
    data:
      columns:
        - label: 低可能性
        - label: 中等可能性
        - label: 高可能性
      rows:
        - label: 重大影响
          values:
            - null
            - null
            - label: 客户集中度 / 续约冲击
              tone: warning
              detail: 即使头部客户质量很高，大型机构客户集中也会放大续约延迟或预算收缩的影响。
        - label: 高影响
          values:
            - null
            - label: AI 工作流 / 输出完整性
              tone: warning
              detail: 带引用且可追溯的输出有所帮助，但指定来源池中没有公开的错误率或责任披露。
            - label: 财务不透明与估值
              tone: warning
              detail: 融资和估值信息公开，但收入、烧钱速度、利润率、现金跑道和定价披露仍不充分。
        - label: 中高影响
          values:
            - null
            - label: 安全 / 保密性剩余风险
              tone: neutral
              detail: SOC 2、审计、漏洞测试和零数据留存声明能够降低剩余风险，但无法消除风险。
            - label: 企业客户集中度 / 采购拖累
              tone: warning
              detail: 机构客户集中度和漫长的尽调周期可能放大流失或扩张延迟。
        - label: 中等影响
          values:
            - null
            - label: 财务系统成熟度
              tone: neutral
              detail: 随着业务规模扩大并接近新的里程碑，FP&A 体系仍在搭建中。
            - label: 产品和地域执行复杂度
              tone: neutral
              detail: 更广泛的公开 / 私人信贷覆盖和国际扩张提高了整合及运营复杂度。
        - label: 中低影响
          values:
            - null
            - label: 数据资产整合压力
              tone: neutral
              detail: 平台扩张后，数据集变广、覆盖范围增加，规范化和维护工作可能暗中膨胀。
            - null
        - label: 低影响
          values:
            - null
            - label: 公开定价不透明
              tone: neutral
              detail: 不透明的定价主要增加外部基准比较的难度，并不直接威胁日常服务连续性。
            - null
        - label: 观察清单
          values:
            - label: 指定来源池中没有已确认的公开事件
              tone: neutral
              detail: 来源集未显示已披露的宕机、泄露或执法行动，但没有证据不等于证据表明不存在。
            - null
            - null
    approximationNotes: 热力图位置是根据来源中的工作流范围、已披露控制、融资背景和公开披露缺口得出的分析排名，而非公司发布的概率。
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR005
      - CR007
      - CR008
      - CR009
      - CR011
      - CR012
