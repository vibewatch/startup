              公开证据对商业形态的说明强于对实际价格的说明。最强的包装信号来自 9fin 自己的招聘材料，其中将公司描述为快速增长的 SaaS 企业，并提到
              ARR、NRR、CAC、LTV、流失和客户群组报告。这支持企业订阅模式，也解释了为什么工作流深度和留存对竞争故事很重要。但材料仍未披露目录价、实际成交价、折扣、席位结构，或相对于现有巨头和其他创业公司的采购议价能力。因此，本章对待办事项、信任和工作流广度的比较更有把握，对实际价格压力或捆绑经济性的比较则没有。
