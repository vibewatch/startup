      - number: '2.3'
        title: 驱动因素、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              现有证据中最强的采用驱动因素，是债务市场的结构性复杂度，以及在不牺牲可审计性的前提下压缩研究时间的价值主张。融资报道描述贷款、债券和私募信贷工作流正在汇合，并指出 AI 只有与可靠的底层数据结合才有用，这与
              9fin 针对契约、资本表、申报文件和新闻提供带引用答案的产品承诺一致。同一批证据也揭示了核心承销约束：估值依赖于汇合与生产率提升的故事，但尚无独立的工作流级 TAM、按客户层级披露的定价，或对 300 多家和
              350 多家机构数字使用一致且带日期的分母。因此，预算归属可以按工作流推断，却不能直接量化。
