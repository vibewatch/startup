  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台范围与可见模块
        blocks:
          - type: paragraph
            body: >-
              指定证据支持这样一个产品：它远不止单一 AI 功能或数据流。9fin 官方页面反复描述一个连接式平台，将债务市场新闻、结构化数据、法律或契约洞察和 AI
              工作流整合起来，服务银行、基金、律师事务所及其他信用团队。这种广度很重要，因为它把 9fin
              定位为发起、研究和重组的工作流基础设施，而不是点解决方案；也解释了为什么管理层持续强调决策速度，而不是狭窄的文件处理能力。


              相比早期材料，当前可见模块更加清晰。AI 页面展示 AI Chat、Research Grid 和财报电话会摘要，面向银行的产品页则强调发起、证券化、契约基准比较和市场情报工作流。Multiples 与
              Ventureburn 的外部描述也指向同一故事：一个债务情报平台，覆盖杠杆贷款、高收益债券、不良债务、私募信贷、CLO
              和资产支持融资，并加入工作流自动化。这种一致性是产品优势，说明公司正从研究工具扩展为债务团队的运营层。
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE007
