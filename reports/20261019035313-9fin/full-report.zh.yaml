  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 边界与替代工作流
        blocks:
          - type: paragraph
            body: >-
              现有证据将 9fin 的市场边界定义为债务资本市场情报，而非通用金融数据软件。公司页面持续将产品置于公开和私募信贷场景，覆盖杠杆融资、不良债务、CLO、私募信贷、ABF
              和投资级市场，并围绕发起、银团、销售与交易、信用研究、重组和法律文件分析等具体工作流组织需求。这一定位很重要：它既把可触达预算扩展到多个席位类型，也明确了主要替代方案——零散的点工具、电子表格、邮件和 PDF
              研究、法律文件审阅，以及无法将带引用的 AI 输出连接到底层债务文件的传统市场数据系统。
