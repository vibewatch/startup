            body: >-
              9fin 在自有网站和第三方资料中始终被描述为服务全球债务或信用市场的 AI 原生平台，而不是泛化的横向金融工具。公司将产品定位为一套组合式工作流：覆盖市场新闻、法律及交易文件、历史数据、分析工具和带引用的 AI
              输出，面向银行、资产管理机构、顾问和其他信用市场专业人士。公司控制的公开材料还显示，其业务位于伦敦，并在纽约、香港和贝尔法斯特设有运营据点，团队覆盖范围延伸至拉丁美洲和亚洲。综合来看，9fin
              是一家向债务资本市场销售专业化工作流基础设施的私营成长期企业软件公司，但定价及若干核心运营指标在本次来源池中仍未披露。
