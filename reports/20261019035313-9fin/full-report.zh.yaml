      - number: '5.2'
        title: 运营栈与交付模式
        blocks:
          - type: paragraph
            body: >-
              运营模式似乎先建立大型债务市场内容层，再在其上叠加结构化工作流。9fin AI 表示系统可处理契约、资本表、财务数据、申报文件、新闻和 9fin 分析；Ventureburn
              则独立描述产品从财报电话会、法律申报、债券募集说明书和信用文件中提取相关信息。用户看到答案之前，系统已经包含文件摄取、标准化、结构化数据和领域应用逻辑。证据不足以支持“拥有专有基础模型”的说法，但足以支持另一判断：产品价值来自经过整理的信用市场数据，以及对原始材料的引用回溯。


              公开工程信号也显示出一套严肃的生产体系，而非轻量演示层。Built In 上 Applied AI Manager 职位要求在偏 AWS 的技术栈上完成端到端模型开发、部署、监控、可复现性、可观测性、CI/CD
              和事故管理，这与公司试图在多款产品中把 AI 功能工业化的方向一致。APIs.io 提供了重要的反向信息：9fin 似乎提供 API 和数据服务访问，但本次来源池仍没有开放的公开开发者门户或已发布的 API
              规格。由此可见，产品对内部交付可能已经较成熟，但对外部技术尽调和集成范围界定仍然不透明。
