            body: >-
              9fin 确实发布了有意义的信任信号。AI 页面称客户数据永远不会训练模型，模型供应商须遵守零数据保留要求，定期第三方审计、漏洞测试和 SOC 2 Type II
              控制共同保护平台。这些信号对受监管金融客户有实际意义，也符合公司的企业销售路径，并进一步说明 9fin 理解机密市场信息与 AI 采用之间的典型顾虑。


              但公开证明仍不完整。本次来源池没有公开正常运行时间或延迟承诺、模型评估统计、幻觉或错误率报告，也没有开放 API 文档。APIs.io 提到 API
              访问需通过协议获得但没有公开规格，这对评估实施风险尤其重要：平台作为交钥匙工作流可能很强，但仅凭公开证据仍难评估集成深度和运营可靠性。这一缺口并不否定产品故事，却使技术尽调无法仅靠公开材料干净完成。
            claimRefs:
