company:
  name: 9fin
chapter:
  number: 8
  title: Valuation
  summary: "The assigned public sources anchor 9fin's current market price at a $1.3 billion 2026 valuation, but they do not provide enough audited financial detail to underwrite that mark aggressively. Product breadth, institutional penetration, and a same-valuation secondary support a Track recommendation rather than a Buy."
sections:
  - id: price-sensitive-recommendation
    title: Price-sensitive recommendation
    body: "The cleanest public signal is that 9fin's latest verified price anchor is still the March 2026 Series C valuation of $1.3 billion, with a later employee secondary reportedly clearing at the same valuation rather than above it. That matters because it confirms liquidity and mark persistence, but it does not prove a new step-up in price. At the same time, the assigned evidence still withholds audited ARR, net retention, gross margin, burn, and preference-stack detail, so the current mark is easier to observe than to underwrite. On that basis, the price-sensitive call is Track: the company looks real, but the entry case still needs harder financial proof or a better price."
    claimRefs: [CV001, CV004, CV005, CV011, CV012, CV013, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: underwriting-support
    title: What supports the premium, and what does not
    body: "There is real evidence behind 9fin's premium positioning. Debriefing says the platform serves more than 300 financial institutions, while 9fin's own banker and AI pages describe a connected workflow across news, data, documents, covenants, cap tables, financials, filings, and legal analysis. Those sources support the idea that 9fin is selling a workflow platform rather than a single feature. Still, valuation support is weaker than product support. Tracxn and Dealroom provide useful funding and multiple markers, but the public record remains too coarse on revenue quality and too light on retention and margin to convert workflow breadth into a clean underwriting case."
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011, CV012]
    tableRefs: [TV002]
  - id: scenario-range-and-entry-discipline
    title: Scenario range and entry discipline
    body: "The scenario range should stay wide because the assigned evidence set contains verified price marks but incomplete numerator data. The bull case requires 9fin's newer AI, sponsor-tracking, and broader workflow modules to monetize into durable upsell and retention. The base case assumes the existing $1.3 billion mark is roughly fair until harder evidence arrives. The bear case is not hypothetical: Dealroom shows a prior $500 million valuation in late 2024, and its posted EV/revenue ratios imply that future upside will depend more on continued growth than on multiple expansion. Entry discipline therefore matters more than company quality alone."
    claimRefs: [CV003, CV004, CV005, CV010, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: final-diligence-asks-and-thesis-breakers
    title: Final diligence asks and thesis-breakers
    body: "The fastest way to move from Track to Buy would be to verify audited ARR, gross margin, burn, NRR, product-line mix, and the actual economics of the March 2026 round. The missing cap-table details are especially important because liquidation preferences, fully diluted share count, and secondary-sale sizing can materially change realized returns even if headline enterprise value holds. The thesis also breaks if workflow expansion does not monetize, if competitive pressure narrows differentiation, or if private-market valuation discipline tightens before 9fin publishes stronger financial disclosure. Until those items are cleared, the public evidence supports patience more than conviction."
    claimRefs: [CV011, CV013, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Evidence-based implication
    rows:
      - ["Recommendation", "Track", "Public evidence shows a real platform and a stable 2026 price anchor, but not enough audited financial detail to chase the current mark."]
      - ["Confidence", "Medium", "Multiple independent sources agree on the financing history, while core underwriting inputs remain undisclosed or coarse."]
      - ["Risk rating", "High", "The mark depends on sustaining premium workflow differentiation despite competitive intensity and limited public financial transparency."]
      - ["Valuation stance", "Fair to full", "A same-valuation secondary supports mark persistence, but public evidence does not show a post-round re-rating."]
      - ["Entry discipline", "Do not pre-empt", "Upgrade only after diligence confirms ARR quality, retention, margins, and the Series C preference stack."]
    notes: "Summary rows synthesize the assigned public sources into an investment stance; they are not management guidance."
    claimRefs: [CV001, CV004, CV005, CV010, CV011, CV012, CV013, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - ["Thesis", "9fin appears to have real workflow depth: Debriefing cites 300+ institutions, and official product pages span cited AI, data, documents, and legal/market workflows.", "An upgrade would need audited ARR, NRR, and margin evidence showing that workflow breadth is monetizing efficiently."]
      - ["Anti-thesis", "The current $1.3 billion mark may already discount the workflow and AI story, while public financial disclosure remains too thin for independent underwriting.", "This concern would fade if disclosed ARR, retention, and margin quality clearly support the current EV/revenue context."]
      - ["Competitive constraint", "Tracxn lists 68 active competitors, so premium pricing has to come from durable domain differentiation rather than generic AI claims.", "Independent customer outcome data or win-rate evidence versus named peers would strengthen defensibility."]
    notes: "This table contrasts supporting and disconfirming evidence using only the assigned source pool."
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Core assumptions
      - Valuation / return logic
      - Key risks / probability signal
    rows:
      - ["Bull", "AI Chat, Research Grid, sponsor tracking, and broader banker workflows convert into sustained upsell and durable growth.", "Value can move above the current round mark, roughly into a $1.5B-$2.0B band, if growth outruns any further multiple compression.", "Needs independent proof that expansion products are monetized, not just launched."]
      - ["Base", "Product-market fit remains credible, but public financial disclosure stays incomplete and the current secondary remains the best price signal.", "Value likely stays around the current mark, roughly $1.1B-$1.4B, until deeper diligence supplies harder numerator data.", "Most assigned evidence fits this case today."]
      - ["Bear", "Growth slows, product breadth does not fully monetize, or private-market valuation discipline tightens materially.", "Downside could pull value back toward a broad range between the prior $500M mark and roughly $1.0B.", "Missing ARR, NRR, margin, and preference detail make downside harder to dismiss than the headline valuation suggests."]
    notes: "Ranges are analytical bands anchored on Dealroom's disclosed $500M 2024 mark, $1.3B 2026 mark, and published EV/revenue reference points; they are illustrative, not precise appraisals."
    claimRefs: [CV003, CV004, CV005, CV010, CV011, CV012, CV013, CV014, CV015, CV016]
