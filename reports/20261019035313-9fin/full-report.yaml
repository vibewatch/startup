      - number: '5.3'
        title: Deployment fit inside customer workflows
        blocks:
          - type: paragraph
            body: >-
              The customer-workflow evidence is strongest where 9fin can collapse several adjacent credit tasks into one
              surface. The bank page highlights earlier origination signals, historical comps, covenant comparisons, and
              financing views; the AI page adds cited Q&A, side-by-side research grids, and earnings summaries; external
              coverage says the newer tools repackage earnings calls, parse covenant language, benchmark deals, and
              distill market trends. Put together, these features are targeted at workflows where speed matters but
              users still need traceability back to original documents.


              The practical implication is that 9fin's differentiation is not just "AI for finance." It is domain
              packaging: debt-market datasets, legal and market context, and workflow-specific outputs delivered inside
              one surface. That should improve stickiness if customers adopt multiple modules at once, because switching
              away would mean rebuilding both the data layer and the operating workflow. The chapter evidence does not
              yet prove realized ROI, implementation times, or module-by-module penetration, but it does show a coherent
              product thesis that is aligned with how leveraged-finance and credit teams actually work.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE013
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE006
              - CE014
      - number: '5.4'
        title: Trust controls, compliance posture, and technical diligence risks
        blocks:
          - type: paragraph
            body: >-
              9fin does publish meaningful trust signals. The AI page says customer data never trains models,
              zero-data-retention requirements apply to model providers, and regular third-party audits, vulnerability
              testing, and SOC 2 Type II controls help secure the platform. Those are relevant signals for regulated
              financial customers and they fit the company's enterprise sales motion. They also reinforce that 9fin
              understands the objection pattern around confidential market information and AI adoption.


              Even so, public proof remains incomplete. The assigned pool does not expose public uptime or latency
              commitments, model-evaluation statistics, hallucination/error-rate reporting, or open API documentation.
              APIs.io's note that API access exists under agreement but lacks a public specification is especially
              important for underwriting implementation risk: the platform may be strong as a turnkey workflow, yet
              integration depth and operational reliability are still hard to assess from public evidence alone. That
              gap does not negate the product story, but it keeps technical diligence from being cleanly underwritten on
              public materials.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The wedge is workflow-specific, cited AI
            body: >-
              9fin's strongest product signal is not generic LLM positioning; it is the combination of proprietary
              debt-market inputs, role-specific workflows, and answers that are explicitly traced back to source
              material.
            calloutType: strength
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE014
          - type: callout
            title: Implementation depth is still hard to underwrite from public evidence
            body: >-
              The company publishes meaningful security and MLOps signals, but the assigned pool still lacks public
              uptime, model-quality, and open API documentation, so technical diligence would need customer-facing
              materials before treating integration and reliability as solved.
            calloutType: risk
            claimRefs:
