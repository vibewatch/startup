  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform scope and visible module set
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a product that is broader than a single AI feature or data feed. 9fin's
              official surfaces repeatedly describe one connected platform that combines debt-market news, structured
              data, legal or covenant insight, and AI workflows for banks, funds, law firms, and other credit teams.
              That breadth matters because it positions 9fin as workflow infrastructure for origination, research, and
              restructuring rather than as a point solution. It also shows why management keeps framing the business
              around time-to-decision instead of around a narrow document-processing tool.


              The visible module set is now clearer than in earlier 9fin materials. The AI surface exposes AI Chat,
              Research Grid, and earnings-call summaries, while the bank-facing product page emphasizes origination,
              securitization, covenant benchmarking, and market-intelligence workflows. External descriptions from
              Multiples and Ventureburn line up with the same story: a debt-intelligence platform that mixes coverage
              across leveraged loans, high-yield bonds, distressed debt, private credit, CLOs, and asset-backed finance
              with workflow automation. That consistency is a product strength because it suggests the company is
              expanding from a research utility toward an operating layer for debt desks.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE007
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE014
      - number: '5.2'
        title: Operating stack and delivery model
        blocks:
          - type: paragraph
            body: >-
              The operating model appears to start with a large debt-market content layer and then add structured
              workflows on top of it. 9fin AI says the system works across covenants, cap tables, financials, filings,
              news, and 9fin analysis, while Ventureburn independently describes the product as extracting relevant
              information from earnings calls, legal filings, bond prospectuses, and credit documentation. That
              combination implies a stack with document ingestion, normalization, structured data, and domain-specific
              application logic before the user ever sees an answer. The evidence does not support a claim about
              proprietary foundation models, but it does support a claim that product utility comes from curated
              credit-market data plus citation back to source material.


              Public engineering signals also suggest a serious production program rather than a lightweight demo layer.
              The Built In role for an Applied AI Manager calls for end-to-end model development, deployment,
              monitoring, reproducibility, observability, CI/CD, and incident management on an AWS-leaning stack, which
              is consistent with a company trying to industrialize AI features across multiple products. APIs.io adds an
              important counterweight: 9fin appears to offer API and data-services access, but there is still no open
              public developer portal or published API specification in the assigned evidence pool. That means the
              product may be operationally mature for internal delivery while remaining opaque for external technical
              diligence and integration scoping.
            claimRefs:
              - CE003
              - CE006
              - CE007
              - CE010
              - CE011
              - CE012
