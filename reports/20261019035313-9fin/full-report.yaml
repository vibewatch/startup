      - number: '2.2'
        title: Sizing lenses and adoption signals
        blocks:
          - type: paragraph
            body: >-
              A clean TAM/SAM/SOM stack is not disclosed in the retained evidence, so the chapter has to size the
              opportunity through multiple lenses rather than one generic market slide. External 2026 coverage
              repeatedly anchors debt capital markets at about $145 trillion globally, which supports the category's
              macro scale but not software spend. Narrower served-market lenses come from penetration proxies: 9fin says
              it powers 350+ institutions, Business Wire says users include asset managers with more than $17 trillion
              of combined AUM, and the same release says all 10 of the top 10 investment banks use the platform. Those
              figures support a meaningful enterprise foothold, but they still do not disclose paid-seat counts, segment
              mix, or regional revenue concentration.
