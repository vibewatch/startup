  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Boundary and substituted workflows
        blocks:
          - type: paragraph
            body: >-
              The retained evidence defines 9fin's market boundary as debt-capital-markets intelligence rather than
              generic financial-data software. Company pages consistently place the product across public and private
              credit, covering leveraged finance, distressed debt, CLOs, private credit, ABF, and investment grade, and
              they organize demand around specific workflows such as origination, syndicate, sales and trading, credit
              research, restructuring, and legal document analysis. That framing matters because it broadens the
              reachable budget beyond one seat type while also clarifying the main substitutes: fragmented point tools,
              spreadsheet work, email and PDF-based research, legal-document review, and legacy market-data systems that
              do not connect cited AI outputs to the underlying debt documents.
