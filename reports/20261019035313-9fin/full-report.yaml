      - number: '3.2'
        title: 9fin's strongest public edge is breadth across debt workflows
        blocks:
          - type: paragraph
            body: >
              The official product surfaces consistently position 9fin as a single platform spanning public and private
              credit workflows rather than a point solution. The bank-facing product page combines market intelligence,
              historical data, legal insight, and AI-powered tools across origination, syndicate, sales and trading,
              credit research, and restructuring. The AI launch extended that pitch from information retrieval into
              in-product comparison and decision support, with AI Chat and Research Grid explicitly designed to help
              banks, asset managers, advisors, and law firms screen opportunities, compare companies, structure deals,
              and assess risk. The competitive consequence is that 9fin can plausibly consolidate budget and workflow
              time from several narrower tools if buyers value cross-workflow speed more than best-of-breed depth in
              each individual niche.
            claimRefs:
