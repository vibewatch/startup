      - number: '2.3'
        title: Drivers, constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption drivers in the retained evidence are structural complexity in debt markets and the
              promise of compressing research time without losing auditability. Round coverage describes converging
              loan, bond, and private-credit workflows and argues that AI is only useful when paired with reliable
              underlying data, which matches 9fin's product promise of cited answers across covenants, cap tables,
              filings, and news. The same evidence also surfaces the key underwriting constraint: valuation depends on a
              convergence-and-productivity story that is not yet backed by an independent workflow-level TAM, disclosed
              pricing by segment, or consistently defined and dated denominators for the 300-plus and 350-plus
              institution figures. Budget ownership is therefore inferable by workflow, but not directly quantified.
            claimRefs:
              - CM005
              - CM012
              - CM013
              - CM014
              - CM016
