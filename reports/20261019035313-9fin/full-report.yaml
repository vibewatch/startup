      - number: '3.4'
        title: Commercial comparison is still limited by thin public pricing evidence
        blocks:
          - type: paragraph
            body: >
              Public evidence is stronger on commercial shape than on actual price. The strongest packaging signal comes
              from 9fin's own hiring materials, which describe a fast-growing SaaS business that manages ARR, NRR, CAC,
              LTV, churn, and cohort reporting. That supports an enterprise-subscription framing and helps explain why
              workflow depth and retention matter in the competitive story. It still does not reveal list pricing,
              realized pricing, discounting, seat structure, or procurement leverage relative to incumbents or other
              startups. As a result, this chapter can compare jobs-to-be-done, trust, and workflow breadth with more
              confidence than it can compare actual price pressure or bundle economics.
