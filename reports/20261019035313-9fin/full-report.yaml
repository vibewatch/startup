  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      9fin's disclosed stack layers debt-market content and expert context beneath workflow-specific AI applications and
      enterprise controls.
    data:
      layers:
        - label: Source corpus
          detail: Debt-market documents and event streams
          modules:
            - Filings / prospectuses
            - News / earnings calls
          outputs:
            - Raw debt-market inputs
        - label: Structured data foundation
          detail: Normalized analytics and historical market context
          modules:
            - 20+ years of bond / loan data
            - Cap tables / pricing / covenants
          outputs:
            - Comparable and screening dataset
        - label: Expert enrichment
          detail: Editorial, legal, and analyst context layered onto the data
          modules:
            - Newsroom coverage
            - Legal / credit frameworks
          outputs:
            - Interpreted market context
        - label: Workflow applications
          detail: Role-specific surfaces for credit-market desks
          modules:
            - Origination / benchmarking
            - Restructuring / research
          outputs:
            - Task-ready workflows
        - label: AI interaction layer
          detail: User-facing AI tools that answer, summarize, and compare
          modules:
            - AI Chat
            - Research Grid
          outputs:
            - Cited decisions and summaries
        - label: Governance and trust
          detail: Enterprise controls around privacy, model handling, and security
          modules:
            - Zero Data Retention
            - SOC 2 Type II
          outputs:
            - Enterprise deployment readiness
    approximationNotes: The figure is a synthesis of the retained public evidence rather than a literal vendor system diagram.
    claimRefs:
