  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer footprint is broad, but the segmentation proof is still mostly company-reported
        blocks:
          - type: paragraph
            body: >-
              The public record consistently places 9fin inside professional credit workflows rather than generic
              fintech productivity tooling. Official materials say the platform serves banks, asset managers, advisors,
              and law firms, while the banking page expands that into concrete workflows spanning origination,
              syndicate, sales and trading, credit research, and restructuring. The breadth is useful because it implies
              multiple buyer personas inside one credit organization, but most of the segmentation evidence is still
              company-controlled. Even the strongest scale claims — all top-10 investment banks, 80% of trading desks,
              and more than 350 leading credit teams — are presented through company-authored surfaces rather than
              customer-by-customer disclosure, so the takeaway is wide market penetration with limited public
              transparency on payer mix and revenue contribution by segment.
            claimRefs:
