              - CR009
              - CR012
      - number: '7.3'
        title: Commercial, dependency, and financial-underwriting risk
        blocks:
          - type: paragraph
            body: >-
              9fin's customer profile is strategically attractive but also creates concentration and execution pressure.
              Company-aligned materials place the platform with more than 300-350 institutions and all top-10 investment
              banks, which is strong proof of enterprise relevance but also implies long procurement cycles, demanding
              security reviews, and renewal sensitivity to a relatively concentrated set of sophisticated buyers. The
              company is simultaneously broadening product scope across public and private credit, adding data assets
              such as Bond Radar, and expanding geographically, which raises integration and operating-complexity risk.
              Financially, the firm has substantial capital and a visible growth story, yet the assigned pool still
              lacks audited revenue, burn, runway, pricing, and current retention disclosure, so valuation risk is
              driven more by missing operating evidence than by funding scarcity.
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR008
              - CR009
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR009
              - CR011
              - CR013
      - number: '7.4'
        title: Thesis-break triggers and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The investment case should break if diligence cannot show that 9fin's AI workflows are measurably accurate
              in production, contractually govern failure cases, and retain enterprise customers without
              margin-destructive service intensity. The most important diligence asks are therefore operational rather
              than narrative: audited FY2025-FY2026 revenue, gross margin, burn, and runway; cohort and concentration
              data for the top customers and buyer segments; model-governance evidence such as red-team results,
              incident logs, escalation paths, and human-review requirements; and current legal/compliance packs
              covering privacy, data rights, and regulated-workflow use. If these materials show strong retention, low
              concentration, stable unit economics, and mature AI-governance instrumentation, residual risk falls
              quickly; if not, the current funding and logo momentum alone should not be treated as sufficient
              underwriting support.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR008
              - CR009
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: AI quality is the thesis-break risk
            body: >-
              Because 9fin is selling cited AI into covenant, capital-structure, earnings, and credit-comparison
              workflows, the core downside is not a lack of demand but a production-quality miss that reaches customer
              decisions before controls catch it.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR012
          - type: callout
            title: Funding reduces solvency risk, not underwriting opacity
            body: >-
              The $170 million Series C and $250 million-plus cumulative funding provide balance-sheet support, but
              public evidence still does not underwrite current revenue quality, burn, pricing power, or concentration
              at a $1.3 billion valuation.
            calloutType: risk
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR011
          - type: callout
            title: Diligence should force quantified customer and model evidence
            body: >-
              Before upgrading conviction, diligence should require customer concentration, renewal, and NRR data plus
              model QA, incident, and contract-control evidence that shows how AI failures are prevented, detected, and
              allocated.
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price-sensitive recommendation
        blocks:
          - type: paragraph
            body: >-
              The cleanest public signal is that 9fin's latest verified price anchor is still the March 2026 Series C
              valuation of $1.3 billion, with a later employee secondary reportedly clearing at the same valuation
              rather than above it. That matters because it confirms liquidity and mark persistence, but it does not
              prove a new step-up in price. At the same time, the assigned evidence still withholds audited ARR, net
              retention, gross margin, burn, and preference-stack detail, so the current mark is easier to observe than
              to underwrite. On that basis, the price-sensitive call is Track: the company looks real, but the entry
              case still needs harder financial proof or a better price.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV011
              - CV012
              - CV013
              - CV016
