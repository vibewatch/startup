            - Trace evidence back to source documents
        - label: AI workflow acceleration
          touchpoints:
            - Ask cited questions with AI Chat
            - Build comparisons in Research Grid
        - label: Legal and advisory support
          touchpoints:
            - Benchmark covenant language and documents
            - Support transaction structuring and diligence work
        - label: Buy-side monitoring
          touchpoints:
            - Screen opportunities and benchmark risks
            - Support portfolio and private-credit monitoring
        - label: Expansion into private names
          touchpoints:
            - Follow sponsors and private-company signals
            - Create new adoption surfaces inside existing accounts
    approximationNotes: Journey stages summarize disclosed workflows rather than measured conversion rates or account penetration.
    claimRefs:
      - CU001
      - CU002
      - CU007
      - CU008
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual risk clusters in AI workflow integrity, disclosure opacity, and enterprise concentration rather than in a
      documented public incident.
    data:
      columns:
        - label: Low likelihood
        - label: Medium likelihood
        - label: High likelihood
      rows:
        - label: Critical impact
          values:
            - null
            - null
            - label: Customer concentration / renewal shock
              tone: warning
              detail: >-
                Large-institution concentration can magnify delayed renewals or budget pullbacks even when headline logo
                quality is strong.
        - label: High impact
          values:
            - null
            - label: AI workflow / output integrity
              tone: warning
              detail: >-
                Cited and traceable outputs help, but no public error-rate or liability disclosure is available in the
                assigned pool.
            - label: Financial opacity vs valuation
              tone: warning
              detail: >-
                Funding and valuation are public, while revenue, burn, margin, runway, and pricing remain insufficiently
                disclosed.
        - label: Medium-high impact
          values:
            - null
            - label: Security / confidentiality residual
              tone: neutral
              detail: >-
                SOC 2, audits, vulnerability testing, and zero-data-retention claims reduce but do not eliminate
                residual risk.
            - label: Enterprise concentration / procurement drag
              tone: warning
              detail: Institutional customer concentration and long diligence cycles can magnify churn or delayed expansion.
        - label: Medium impact
          values:
            - null
            - label: Finance-systems maturity
              tone: neutral
              detail: FP&A build-out is still underway while the business scales and approaches new milestones.
            - label: Product and geography execution complexity
              tone: neutral
              detail: >-
                Broader public/private-credit coverage and international expansion raise integration and operating
                complexity.
        - label: Low-medium impact
          values:
            - null
            - label: Data-asset integration strain
              tone: neutral
              detail: >-
                Broader datasets and acquired coverage can create hidden normalization and maintenance work as the
                platform expands.
            - null
        - label: Low impact
          values:
            - null
            - label: Public-pricing opacity
              tone: neutral
              detail: >-
                Opaque pricing complicates external benchmarking more than it directly threatens day-to-day service
                continuity.
            - null
        - label: Watchlist
          values:
            - label: No confirmed public incident in assigned pool
              tone: neutral
              detail: >-
                The source set does not show a disclosed outage, breach, or enforcement action, but absence of evidence
                is not evidence of absence.
            - null
            - null
    approximationNotes: >-
      Heatmap placement is an analytical ranking derived from sourced workflow scope, disclosed controls, funding
      context, and public disclosure gaps rather than from company-published probabilities.
