      - number: '3.3'
        title: Durability depends on proprietary data, trust, and workflow embedding
        blocks:
          - type: paragraph
            body: >
              The most defensible moat in the retained evidence is not generic AI, but the combination of proprietary
              debt-market data, workflow embedding, and institution-grade trust controls. 9fin says its AI answers are
              cited and tied back to original source material, that customer data does not train model providers, and
              that the platform operates with SOC 2 Type II audited controls plus regular testing. Independent
              commentary reinforces that setup by arguing that winners in credit AI will need structured proprietary
              data rather than a model wrapper alone. That does not remove displacement risk: incumbents still control
              distribution and daily habits, and 9fin still needs to turn product breadth into hard switching costs,
              multi-workflow usage, and renewal behavior that outsiders can verify.
            claimRefs:
              - CP001
              - CP006
              - CP008
              - CP011
              - CP012
              - CP014
