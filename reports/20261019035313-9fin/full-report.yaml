      - number: '6.2'
        title: >-
          Adoption proof shows real workflow usage, but public evidence is heavier on testimonials than deployment
          metrics
        blocks:
          - type: paragraph
            body: >-
              9fin has more customer proof than a simple logo wall, but less than a diligence-grade cohort file. IK
              Partners provides the cleanest named proof: the customer story and an independent feature repeat the same
              quote that 9fin's analytics help structure transactions intelligently and operate more efficiently. Beyond
              that, the best public evidence comes from anonymous testimonials on the AI page from a global law firm, an
              asset manager, and an investment bank. Those quotes matter because they show role diversity and practical
              usage, but they stop short of disclosing contract scope, seat count, rollout depth, or whether the
              deployments are departmental experiments versus firm-wide standards. The result is credible adoption
              evidence with modest reference quality.
