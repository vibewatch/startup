              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.2'
        title: What supports the premium, and what does not
        blocks:
          - type: paragraph
            body: >-
              There is real evidence behind 9fin's premium positioning. Debriefing says the platform serves more than
              300 financial institutions, while 9fin's own banker and AI pages describe a connected workflow across
              news, data, documents, covenants, cap tables, financials, filings, and legal analysis. Those sources
              support the idea that 9fin is selling a workflow platform rather than a single feature. Still, valuation
              support is weaker than product support. Tracxn and Dealroom provide useful funding and multiple markers,
              but the public record remains too coarse on revenue quality and too light on retention and margin to
              convert workflow breadth into a clean underwriting case.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.3'
        title: Scenario range and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The scenario range should stay wide because the assigned evidence set contains verified price marks but
              incomplete numerator data. The bull case requires 9fin's newer AI, sponsor-tracking, and broader workflow
              modules to monetize into durable upsell and retention. The base case assumes the existing $1.3 billion
              mark is roughly fair until harder evidence arrives. The bear case is not hypothetical: Dealroom shows a
              prior $500 million valuation in late 2024, and its posted EV/revenue ratios imply that future upside will
              depend more on continued growth than on multiple expansion. Entry discipline therefore matters more than
              company quality alone.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Final diligence asks and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The fastest way to move from Track to Buy would be to verify audited ARR, gross margin, burn, NRR,
              product-line mix, and the actual economics of the March 2026 round. The missing cap-table details are
              especially important because liquidation preferences, fully diluted share count, and secondary-sale sizing
              can materially change realized returns even if headline enterprise value holds. The thesis also breaks if
              workflow expansion does not monetize, if competitive pressure narrows differentiation, or if
              private-market valuation discipline tightens before 9fin publishes stronger financial disclosure. Until
              those items are cleared, the public evidence supports patience more than conviction.
            claimRefs:
              - CV011
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Current call
            body: >-
              Track 9fin at the current public mark: the company looks materially stronger than a speculative concept,
              but the underwriting case is still weaker than the product case.
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV016
