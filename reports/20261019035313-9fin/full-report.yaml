      - CR003
      - CR004
      - CR005
      - CR007
      - CR008
      - CR009
      - CR011
      - CR012
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Verified price, product proof, and flat secondary liquidity all point to a real company but an incomplete
      underwriting case.
    data:
      nodes:
        - label: Verified $1.3B mark
          note: Series C plus same-valuation secondary establish the current public price anchor.
          claimRefs:
            - CV001
            - CV005
        - label: Real workflow breadth
          note: Institutional adoption and cross-credit workflows support genuine product proof.
          claimRefs:
            - CV006
            - CV007
            - CV008
        - label: Trust / security support
          note: Official AI materials highlight zero data retention, audits, and SOC 2 controls.
          claimRefs:
            - CV009
        - label: No post-round re-rating
          note: The public secondary signal is flat to the round, not higher.
          claimRefs:
            - CV005
        - label: Financial opacity and competition
          note: ARR precision, margin quality, and preference terms remain missing while competitors stay numerous.
          claimRefs:
            - CV010
            - CV011
            - CV012
            - CV016
        - label: 'Recommendation: Track'
          note: Wait for stronger underwriting evidence or a better entry point before upgrading.
          claimRefs:
            - CV013
            - CV015
            - CV016
