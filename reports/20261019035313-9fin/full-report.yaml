      - number: '7.2'
        title: Legal, governance, and operating-control risk
        blocks:
          - type: paragraph
            body: >-
              The public record reviewed here shows credible control language but not enough operating evidence to
              downgrade governance risk to low. 9fin says outputs are cited and traceable, customer data never trains
              model providers, and the platform uses zero-data-retention requirements, regular third-party audits,
              vulnerability testing, and SOC 2 Type II controls. Those mitigants matter because the product is
              explicitly sold into sensitive debt-capital-markets workflows where an error can alter a financing view,
              covenant read, or earnings interpretation. But the same source set does not disclose public model error
              rates, incident history, customer liability allocation, or regulator-facing compliance packs for the newer
              AI workflows, so diligence should treat the company as controlled but not yet fully evidenced from
              outside-in review.
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
