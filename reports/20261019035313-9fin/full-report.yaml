      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The latest financing clearly improved 9fin's ability to keep investing, but it does not remove the main
              diligence blocker. Independent coverage and partner disclosure agree that 9fin raised $170 million in a
              2026 Series C at a $1.3 billion valuation, taking total funding above $250 million, with proceeds aimed at
              AI capability development, proprietary data expansion, and continued US growth; British Business Bank
              alone accounted for $20 million of the round. That profile looks like growth capital for product and
              go-to- market expansion, not a publicly visible rescue raise. Even so, no reviewed source discloses cash
              on hand, burn, runway, debt obligations, gross margin, or working-capital needs, so the financial verdict
              is "commercially promising but still un-underwritable on public evidence." The next diligence step is not
              another narrative source; it is management or data-room access to audited operating metrics.
