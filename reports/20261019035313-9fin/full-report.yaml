  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape still starts with the status quo and incumbents
        blocks:
          - type: paragraph
            body: >
              The cleanest public read is that 9fin first competes against how debt teams already work: fragmented PDFs,
              emails, lender memos, data rooms, and proprietary models stitched together under time pressure.
              Independent coverage says debt markets are still dominated by incumbents with powerful data businesses,
              distribution, and entrenched workflows, so 9fin is not trying to win a narrow feature bake-off. It is
              trying to replace multi-tool, manual process sprawl with a single operating layer for credit research,
              comparison, and execution support. That framing matters because the real alternatives are broad incumbent
              suites, internal builds, and workflow habits that are already embedded in institutional teams, not only a
              short list of startup peers.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP014
              - CP015
