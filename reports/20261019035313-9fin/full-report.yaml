            title: Cross-functional workflow fit is the strongest part of the customer story
            body: >-
              Public evidence consistently shows 9fin selling into interconnected debt-market teams rather than a single
              analyst persona, which improves the odds of multi-seat adoption inside one institution.
            calloutType: strength
            claimRefs:
