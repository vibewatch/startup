      - CE003
      - CE006
      - CE008
      - CE009
      - CE011
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      9fin's public customer story starts with bank-centric debt workflows and expands into adjacent legal, buy-side,
      AI, and private-market use cases.
    data:
      nodes:
        - label: Bank origination
          touchpoints:
            - Originate earlier and build stronger pitches
