      - number: '6.3'
        title: Expansion signals are credible; durability and concentration are not yet underwritten
        blocks:
          - type: paragraph
            body: >-
              The customer story gets stronger when viewed through 2026 product expansion. The June 2026 AI release
              positions AI Chat and Research Grid as tools for screening, comparison, deal structuring, and risk work
              across existing client types, while the September 2026 Private 9fin launch adds sponsor and private-name
              monitoring that can widen usage within the same accounts. That supports a plausible land-and-expand
              motion. The weaker side is durability: public materials claim best-in-class retention, but the reviewed
              sources do not publish NRR, GRR, churn, renewal rates, contract lengths, or top-customer exposure. An
              otherwise favorable independent profile still notes that AI-native credit platforms face data-quality and
              model-reliability challenges, so procurement and governance friction should be treated as unresolved
              rather than assumed away.
            claimRefs:
