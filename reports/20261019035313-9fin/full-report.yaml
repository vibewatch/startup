  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual-risk overview
        blocks:
          - type: paragraph
            body: >-
              9fin's current risk stack is concentrated around workflow integrity and disclosure opacity, not around a
              proven public incident in the assigned source set. The company is pushing cited AI deeper into covenant
              analysis, company comparisons, earnings summaries, and financing workflows used by banks, asset managers,
              advisers, and law firms, which makes any model-quality failure consequential because the product sits
              close to real underwriting and execution decisions. At the same time, 9fin has enough external validation
              on funding and enterprise usage to show real traction, but not enough public operating disclosure to
              underwrite durability cleanly at a unicorn valuation. That is why the highest-severity items are AI-output
              integrity, financial opacity, and concentration/procurement drag, with legal-compliance and security
              governance still material but somewhat better mitigated by public control statements.
            claimRefs:
              - CR001
