  - id: FI001
    title: 9fin public revenue model bridge
    type: flow
    summary: >-
      Public evidence supports an enterprise workflow-to-subscription revenue bridge, but not disclosed realized pricing
      or gross-profit math.
    data:
      nodes:
        - id: institutions
          label: Institutional credit teams
          detail: 350+ institutions across banks, asset managers, hedge funds, law firms, advisors, and private credit funds.
        - id: platform
          label: Integrated debt-market platform
          detail: News, data, documents, legal insight, and AI across public and private credit workflows.
        - id: modules
          label: Monetizable workflow modules
          detail: >-
            AI Chat, Research Grid, earnings-call summaries, covenant/document intelligence, and private-credit
            tracking.
        - id: sales-motion
          label: Demo-led enterprise sale
          detail: Public surfaces use demo and free-trial CTAs; no numeric seat, usage, or contract pricing is disclosed.
        - id: expansion
          label: Adoption and expansion
          detail: >-
            Publicly reported institution growth from 300+ in early 2026 to 350+ on current official copy implies
            continued account expansion.
        - id: visibility-gap
          label: Revenue and gross-profit visibility gap
          detail: Absolute ARR, revenue run rate, gross margin, CAC/payback, burn, and runway are still undisclosed publicly.
      edges:
        - from: institutions
          to: platform
          label: debt-market workflow demand
        - from: platform
          to: modules
          label: packaged into specific research tools
        - from: modules
          to: sales-motion
          label: sold through enterprise access
        - from: sales-motion
          to: expansion
          label: logo growth and cross-sell
        - from: expansion
          to: visibility-gap
          label: traction is visible; unit economics are not
    approximationNotes: >-
      The flow is conceptual and source-backed on sequence and product surfaces; it does not imply disclosed conversion
      rates, contribution margins, or quantified expansion revenue.
    claimRefs:
