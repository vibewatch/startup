callouts:
  - calloutType: strength
    title: Breadth is the clearest public differentiator
    body: >
      Across the retained sources, 9fin's most supportable edge is not one dataset
      or one AI feature, but the attempt to combine debt data, documents, legal
      insight, and cited workflows inside one product.
    claimRefs: [CP001, CP003, CP007]
  - calloutType: risk
    title: Incumbent response and public pricing opacity remain the main blind spots
    body: >
      Independent coverage still emphasizes entrenched incumbent distribution, while
      the assigned pool does not provide public pricing or named-peer product
      detail strong enough for an underwriting-grade price or feature war view.
    claimRefs: [CP006, CP013]
