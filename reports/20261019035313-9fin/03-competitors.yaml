  evidenceGaps:
    - type: missing-source
      severity: material
      topic: pricing-comparison
      missingEvidence: Public list pricing, standard contract structure, and discounting detail for 9fin and named rivals.
      whyItMatters: Price pressure and bundle leverage are central to whether workflow breadth converts into durable commercial advantage.
      diligencePath: Collect procurement screenshots, sales collateral, or customer contracts covering seat, usage, and term structure for 9fin and at least two named alternatives.
      relatedQuestionRefs: [QP007]
      relatedTableRefs: [TP003]
    - type: enumeration-incomplete
      severity: material
      topic: named-peer-benchmarking
      missingEvidence: Direct competitor official pages or independent benchmarks for named vendor feature sets, pricing, and compliance posture.
      whyItMatters: Without vendor-level evidence, the chapter can compare alternative classes but cannot support a closed peer ranking with underwriting confidence.
      diligencePath: Add retained sources for at least three named competitors across official product pages, public pricing signals, and independent reviews or coverage.
      relatedQuestionRefs: [QP002, QP006]
      relatedTableRefs: [TP001, TP002]
    - type: private-evidence-only
      severity: material
      topic: switching-costs
      missingEvidence: Customer renewal data, multi-product attach rates, win-loss reasons, and migration evidence from incumbent or internal workflows.
      whyItMatters: Workflow breadth is only durable if it creates measurable switching costs, retention, and budget consolidation rather than trial usage.
