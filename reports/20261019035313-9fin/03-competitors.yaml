          "Likely enterprise contracts, but not directly evidenced in this assigned pool",
          "Bundle leverage and discounting cannot be compared from public evidence here",
          "Needs procurement screenshots or contracts before underwrite-quality comparison"
        ]
      - [
          "Status-quo manual stack",
          "Implicit cost is labor and tool sprawl rather than a single SKU",
          "Work is assembled across PDFs, emails, data rooms, and proprietary models",
          "The economic substitute is staff time and missed speed, not one visible price tag",
          "ROI proof matters more than sticker-price claims"
        ]
      - [
          "Internal build / bespoke workflows",
          "No market list price",
