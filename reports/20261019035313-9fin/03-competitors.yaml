company:
  name: 9fin
chapter:
  number: 3
  title: Competitors
  summary: >
    9fin is competing less as a point data tool and more as a workflow-consolidation
    platform for credit professionals. The retained evidence most clearly supports
    breadth across public/private credit, cited AI workflows, and trust controls,
    while independent coverage still highlights entrenched incumbent distribution
    and the lack of public named-peer pricing or product detail.
sections:
  - id: competitive-landscape
    title: Competitive landscape still starts with the status quo and incumbents
    body: >
      The cleanest public read is that 9fin first competes against how debt teams
      already work: fragmented PDFs, emails, lender memos, data rooms, and
      proprietary models stitched together under time pressure. Independent coverage
      says debt markets are still dominated by incumbents with powerful data
      businesses, distribution, and entrenched workflows, so 9fin is not trying to
      win a narrow feature bake-off. It is trying to replace multi-tool, manual
      process sprawl with a single operating layer for credit research, comparison,
      and execution support. That framing matters because the real alternatives are
      broad incumbent suites, internal builds, and workflow habits that are already
      embedded in institutional teams, not only a short list of startup peers.
    claimRefs: [CP004, CP005, CP006, CP014, CP015]
    tableRefs: [TP001]
  - id: capability-breadth
    title: 9fin's strongest public edge is breadth across debt workflows
    body: >
      The official product surfaces consistently position 9fin as a single platform
      spanning public and private credit workflows rather than a point solution.
      The bank-facing product page combines market intelligence, historical data,
      legal insight, and AI-powered tools across origination, syndicate, sales and
      trading, credit research, and restructuring. The AI launch extended that
      pitch from information retrieval into in-product comparison and decision
      support, with AI Chat and Research Grid explicitly designed to help banks,
      asset managers, advisors, and law firms screen opportunities, compare
      companies, structure deals, and assess risk. The competitive consequence is
      that 9fin can plausibly consolidate budget and workflow time from several
      narrower tools if buyers value cross-workflow speed more than best-of-breed
      depth in each individual niche.
    claimRefs: [CP001, CP002, CP003, CP007, CP009, CP010, CP015]
    tableRefs: [TP002]
  - id: moat-durability
    title: Durability depends on proprietary data, trust, and workflow embedding
    body: >
      The most defensible moat in the retained evidence is not generic AI, but the
      combination of proprietary debt-market data, workflow embedding, and
      institution-grade trust controls. 9fin says its AI answers are cited and tied
      back to original source material, that customer data does not train model
      providers, and that the platform operates with SOC 2 Type II audited controls
      plus regular testing. Independent commentary reinforces that setup by arguing
      that winners in credit AI will need structured proprietary data rather than a
      model wrapper alone. That does not remove displacement risk: incumbents still
      control distribution and daily habits, and 9fin still needs to turn product
      breadth into hard switching costs, multi-workflow usage, and renewal behavior
      that outsiders can verify.
    claimRefs: [CP001, CP006, CP008, CP011, CP012, CP014]
    figureRefs: [FP001]
  - id: packaging-and-diligence-gaps
    title: Commercial comparison is still limited by thin public pricing evidence
    body: >
      Public evidence is stronger on commercial shape than on actual price. The
      strongest packaging signal comes from 9fin's own hiring materials, which
      describe a fast-growing SaaS business that manages ARR, NRR, CAC, LTV,
      churn, and cohort reporting. That supports an enterprise-subscription framing
      and helps explain why workflow depth and retention matter in the competitive
      story. It still does not reveal list pricing, realized pricing, discounting,
      seat structure, or procurement leverage relative to incumbents or other
      startups. As a result, this chapter can compare jobs-to-be-done, trust, and
      workflow breadth with more confidence than it can compare actual price
      pressure or bundle economics.
    claimRefs: [CP011, CP013]
    tableRefs: [TP003]
