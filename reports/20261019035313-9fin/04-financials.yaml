schemaVersion: report-v2
artifact: financials
slug: 9fin
runDate: 2026-10-19
company:
  name: 9fin
chapter:
  number: 4
  title: Financials
  summary: >-
    9fin presents as a recurring, enterprise intelligence platform monetizing integrated debt-market data,
    news, legal intelligence, and AI workflows across banks, asset managers, law firms, and private credit
    users. Demand and product breadth look credible, and the 2026 Series C materially extended growth capital,
    but public evidence still does not disclose realized pricing, absolute ARR, gross margin, burn, runway, or
    CAC/payback, leaving the underwriting bottleneck in disclosure rather than customer adoption.
sections:
  - id: revenue-model
    title: Revenue model and commercial surfaces
    body: >-
      Public commercial evidence points to an enterprise subscription model rather than transaction-linked or
      balance-sheet-driven revenue. 9fin describes a single platform spanning public and private credit, with
      news, data, documents, legal intelligence, and AI workflows packaged into institutional research use
      cases. The current product set also extends beyond a single seat-level tool: AI Chat, Research Grid, and
      earnings-call workflows deepen usage inside existing teams, while Private 9fin and sponsor tracking widen
      the addressable workflow footprint. What remains opaque is monetization detail. The reviewed commercial
      pages route prospects to demos or trials but do not disclose seat, usage, contract-duration, or module
      pricing, so public evidence supports the shape of the revenue model more than its realized price or mix.
    claimRefs: [CI006, CI008, CI009, CI010, CI011, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-unit-economics
    title: Public traction and unit-economics signal
    body: >-
      Public traction disclosure is directionally positive but still incomplete for underwriting. 9fin's current
      about page says it powers credit teams at 350+ institutions, while spring 2026 financing coverage cited
      more than 300 institutions already on platform. The company also reported multiple consecutive years of
      100% ARR growth in 2026 coverage, and its 2024 Series B release said group-wide ARR had grown 400% since
      the 2022 Series A+ round, with nearly 200 customers and 240 employees at that time. Those datapoints
      support real adoption and expansion, but they stop short of revenue quality analysis because the public
      record still omits absolute ARR, revenue run rate, gross margin, CAC/payback, and retention. External ICP
      analysis also flags Bloomberg entrenchment, broader-platform preference, and budget constraints as real
      conversion friction, which matters for both win rates and pricing power.
    claimRefs: [CI006, CI007, CI012, CI013, CI014, CI015, CI016]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financial verdict
    body: >-
      The latest financing clearly improved 9fin's ability to keep investing, but it does not remove the main
      diligence blocker. Independent coverage and partner disclosure agree that 9fin raised $170 million in a
      2026 Series C at a $1.3 billion valuation, taking total funding above $250 million, with proceeds aimed
      at AI capability development, proprietary data expansion, and continued US growth; British Business Bank
      alone accounted for $20 million of the round. That profile looks like growth capital for product and go-to-
      market expansion, not a publicly visible rescue raise. Even so, no reviewed source discloses cash on hand,
      burn, runway, debt obligations, gross margin, or working-capital needs, so the financial verdict is
      "commercially promising but still un-underwritable on public evidence." The next diligence step is not
      another narrative source; it is management or data-room access to audited operating metrics.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI016]
callouts:
  - calloutType: insight
    title: Enterprise software shape, opaque realized economics
    body: >-
      Public evidence supports a multi-workflow subscription platform with cross-sell potential, but not the
      price realization, module mix, or margin profile needed to underwrite revenue quality.
    claimRefs: [CI008, CI009, CI010, CI011, CI016]
  - calloutType: risk
    title: Fresh capital reduces near-term financing pressure, not disclosure risk
    body: >-
      The Series C likely bought operating time and expansion capacity, but public sources still leave runway,
      burn, and cash conversion unverified.
    claimRefs: [CI001, CI003, CI004, CI005, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Core platform subscriptions
        - Institutional access to integrated debt-market news, data, documents, legal intelligence, and AI workflows.
        - Institution or team contract
        - Live platform; 350+ institutions disclosed, but no public revenue split by product or customer type.
        - Recurring-like model is plausible, but realized revenue mix is undisclosed.
        - Revenue by product family, customer segment, and geography.
      - - AI workflows
        - AI Chat, Research Grid, and earnings-call summaries appear to deepen usage within the existing platform.
        - Module, seat, or bundled entitlement unknown
        - Commercially active product family; attach rate and standalone monetization not disclosed.
        - Likely increases stickiness, but incremental revenue and compute cost are unverified.
        - AI module attach rate, price uplift, and inference-cost profile.
      - - Private credit / sponsor workflows
        - Private 9fin and sponsor tracking extend the product footprint into private-market monitoring.
        - Module or bundle unknown
        - Newer workflow surface; public evidence does not disclose ARR contribution.
        - Useful expansion vector, but contribution margin and customer uptake are unknown.
        - ARR contribution, user penetration, and renewal behavior for private-credit modules.
      - - Data and covenant intelligence
        - Historical data, pricing, trading history, and covenant/document benchmarking support research workflows.
        - Platform access
        - Core capability is public, but no standalone price or usage economics are disclosed.
        - Valuable for retention and workflow breadth, but not measurable as a separate revenue stream from public data.
        - Module-level usage, attach, and margin contribution.
    notes: >-
      Public sources describe product surfaces and usage categories, not audited revenue mix; "unknown" or
      missing detail means the reviewed public evidence does not disclose the metric.
    claimRefs: [CI006, CI008, CI009, CI010, CI016]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Product / surface
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Bank platform
        - No public numeric price; demo-led enterprise sale with free-trial CTA.
        - List price undisclosed; realized price unknown.
        - Contract duration, seat minimums, bundle structure, and discounts not disclosed.
        - 9fin banks
      - - 9fin AI workflows
        - No public numeric price for AI Chat, Research Grid, or earnings-call summaries.
        - Bundled versus add-on pricing not disclosed.
        - Attach rate, per-seat uplift, and usage caps unknown.
        - 9fin AI
      - - Private 9fin / sponsor tracking
        - No public numeric price on the reviewed product-update surface.
        - No disclosed list or realized pricing.
        - Packaging, customer eligibility, and incremental ACV unknown.
        - Private 9fin update
    notes: >-
      Reviewed public commercial surfaces provide demo/trial routes and product descriptions but no quoted list
      prices; absence of public pricing is not evidence of free usage.
    claimRefs: [CI009, CI010, CI011, CI016]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - ARR growth
        - Multiple consecutive years of 100% ARR growth; 400% group-wide ARR growth since 2022 disclosed in the 2024 Series B release.
        - Medium
        - Shows demand velocity, but not the current ARR denominator or quality of growth.
        - Audited ARR by year, gross retention, and net revenue retention.
      - - Customer / institution count
        - 350+ institutions currently; more than 300 institutions cited in spring 2026 financing coverage.
        - Medium
        - Demonstrates adoption breadth, but not paying-logo count, ACV, or concentration.
        - Paying customers, top-10 concentration, and ACV distribution.
      - - Public pricing transparency
        - null
        - High
        - Without price disclosure, the public record cannot support ACV, discounting, or payback analysis.
        - Price book, average realized pricing, discount bands, and contract duration.
      - - Gross margin / burn / runway
        - null
        - High
        - Capital intensity and financing dependency cannot be underwritten without these metrics.
        - Latest cash balance, monthly burn, gross margin, runway, and debt obligations.
      - - CAC / payback / retention
        - null
        - High
        - Sales efficiency and expansion durability are central to whether growth is value-accretive.
        - CAC, sales cycle, payback, logo churn, and NRR by cohort.
    notes: >-
      null means the reviewed public evidence does not disclose the metric; disclosed growth and adoption figures
      are company-reported or financing-coverage datapoints, not audited unit-economics statements.
    claimRefs: [CI006, CI007, CI011, CI012, CI013, CI014, CI016]
figures:
