  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: disclosure-gap
      missingEvidence: >-
        Current ARR, revenue run rate, gross margin, opex, cash balance, burn, runway, debt obligations, and
        any capex or service-delivery cost disclosures.
      whyItMatters: >-
        Without these metrics, the financial chapter can describe demand and financing history but cannot
        underwrite margin path, financing dependency, or downside resilience.
      diligencePath: >-
        Request board deck or data-room financials with monthly cash bridge, P&L summary, cash runway view, and
        debt schedule.
      relatedQuestionRefs: [QI005, QI007]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: pricing-transparency
      missingEvidence: >-
        Contract-level pricing, average ACV, discount bands, contract duration, AI-module attach, and renewal
        terms.
      whyItMatters: >-
        Public product breadth does not reveal realized price, discounting discipline, or whether newer AI and
        private-credit workflows expand ACV or merely defend retention.
      diligencePath: >-
        Request current price book, standard MSA/order-form terms, and anonymized cohort data on expansions and
        renewals.
      relatedQuestionRefs: [QI002, QI004]
      relatedTableRefs: [TI001, TI002]
    - type: private-evidence-only
      severity: material
      topic: product-mix
      missingEvidence: >-
        Revenue mix by core platform, AI workflows, and private-credit products, plus US versus non-US revenue
        contribution.
      whyItMatters: >-
        The public record shows broad product expansion, but not which modules actually monetize, how much they
        contribute, or whether growth is concentrated in a single geography or workflow.
      diligencePath: >-
        Request segmented ARR or revenue bridge by product family, geography, and customer cohort for the last
        two fiscal years.
      relatedQuestionRefs: [QI001, QI003]
      relatedTableRefs: [TI001, TI003]
