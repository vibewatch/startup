companyProfile:
  summary: "Highspot is a leading AI-powered sales enablement platform founded in 2012 in Seattle by Robert Wahbe, Oliver Sharp, and David Wortendyke. The company serves enterprise revenue teams with a unified platform integrating content management, guided selling, conversational intelligence, training, and analytics. Its Nexus AI layer, launched progressively through 2024–2026, underpins autonomous deal agents and GTM workflow automation. Highspot reported an estimated ARR of $450M in 2024 and has raised approximately $655M in total venture funding through its Series F round at a $3.5B valuation in January 2022. In late 2025/early 2026, Highspot entered a pending merger agreement with Seismic, creating a potential $6B combined sales enablement entity subject to FTC and EU antitrust review."
  foundedDate: "2012-01-01"
  founders:
    - name: "Robert Wahbe"
      role: "CEO & Co-Founder"
      background: "Former SVP at Microsoft, led product and GTM for key enterprise products."
      claimRefs: [CO002]
    - name: "Oliver Sharp"
      role: "Co-Founder"
      background: "Computer scientist and researcher with prior roles at Microsoft Research."
      claimRefs: [CO002]
    - name: "David Wortendyke"
      role: "Co-Founder"
      background: "Enterprise software engineer with background at Microsoft."
      claimRefs: [CO002]
  foundingLocation: "Seattle, WA, USA"
  headquarters: "Seattle, WA, USA"
  productSummary: "Highspot offers Content Hub (enterprise content management and scoring), Sales Plays & Playbooks (guided selling workflows), Digital Sales Rooms (collaborative buyer-seller portals), Conversation Intelligence (AI meeting analysis), Training & Coaching, and Highspot Analytics. The Nexus AI platform provides cross-product AI automation including a Deal Agent (autonomous deal execution, January 2026) and GTM Agent (market motion automation, May 2026). Deep integrations span Salesforce, Microsoft 365, HubSpot, Zoom, Slack, and 100+ ecosystem partners."
  customerFocus: "Enterprise and upper-mid-market B2B revenue teams (sales, marketing, enablement); primary ICP is companies with 500+ sales reps in technology, financial services, healthcare, and manufacturing."
  businessModel: "Annual SaaS subscription per seat, multi-year enterprise contracts, platform pricing tiers by module; professional services and training revenue supplementary."
  stage: "Late-Stage Private (Series F, pending Seismic merger)"
  fundingStatus: "$248M Series F (January 2022, $3.5B valuation); total raised ~$655M from D1 Capital, ICONIQ Growth, B Capital, Tiger Global, Madrona, Sapphire Ventures, Salesforce Ventures."
  disclosureProfile: private-undisclosed
