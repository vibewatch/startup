      - ["Coaching & Call Intelligence", "Moderate (Nexus)", "Moderate", "Strong", "Moderate", "Best-in-class", "Disadvantaged vs Gong"]
      - ["Digital Sales Rooms", "Strong", "Strong", "Moderate", "Strong", "Weak", "Parity"]
      - ["Analytics & Reporting", "Strong (Nexus)", "Strong", "Strong", "Moderate", "Strong", "Parity or slight edge"]
      - ["Buyer Engagement Tools", "Moderate", "Moderate", "Moderate", "Strong", "Weak", "Disadvantaged in field sales"]
