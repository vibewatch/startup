      - number: '6.2'
        title: Customer Growth and Adoption Trajectory
        blocks:
          - type: paragraph
            body: >-
              Highspot's customer count has grown from a small enterprise base in 2015 to approximately 300 large
              enterprise accounts in 2024, with corresponding ARR growth from approximately $60M in 2020 to ~$450M in
              2024. This trajectory represents a compelling growth arc but at the same time shows a significant slowdown
              from the hypergrowth period of 2020–2022 (when many SaaS companies benefited from digital transformation
              acceleration). The COVID-era acceleration in enablement platform adoption—driven by the sudden need to
              equip distributed sales teams with digital-first tools—created an artificial lift in 2020–2021 that has
              since normalized. From 2023 onward, customer growth rates have likely moderated to a more sustainable pace
              as the market matures. The 2023 layoffs, which reduced Highspot's go-to-market team by approximately 25%,
              would have slowed new customer acquisition during the restructuring period. Enterprise SaaS customer
              acquisition cycles typically take 6–18 months for accounts in Highspot's target size range, meaning the
              impact of the 2023 GTM reductions would be felt in 2024 customer count and ARR growth. The Seismic merger
              announcement in February 2026 adds further uncertainty: enterprise buyers may pause procurement decisions
              while waiting for clarity on which product platform will survive the integration, effectively creating a
              customer acquisition headwind. On the positive side, Highspot's installed base of ~300 enterprise accounts
              has significant expansion potential: each account likely deploys Highspot to a fraction of its total
              salesforce initially, with expansion to additional business units, geographies, and product lines driving
              NRR above 100%.
