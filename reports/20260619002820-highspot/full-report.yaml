      - number: '1.2'
        title: Founders and Leadership
        blocks:
          - type: paragraph
            body: >-
              Highspot was co-founded in 2012 by Robert Wahbe, Oliver Sharp, and David Wortendyke—all of whom had long
              careers at Microsoft before starting Highspot together. Robert Wahbe served as CEO from founding; prior to
              Highspot he was Corporate Vice President of the Server and Tools Division at Microsoft, giving him deep
              experience managing enterprise software business units. Oliver Sharp served as SVP of AI at Highspot,
              focusing on the company's AI strategy and Nexus platform; he previously co-founded Colusa, a runtime
              compilation company acquired by Microsoft. David Wortendyke served as CTO and head of engineering; he
              helped bring products like Windows NT and Visual Studio to market at Microsoft. The three co-founders
              represent a rare founding team with combined enterprise software product, business, and AI depth. Beyond
              the founders, the executive team in 2024–2025 included CFO Chris Larson and Chief People Officer Amy
              Johnson. The board includes representatives from major investors D1 Capital, ICONIQ Growth, B Capital
              Group, Madrona Venture Group, Salesforce Ventures, Sapphire Ventures, and Tiger Global Management. With
              the February 2026 announcement of a merger with Seismic, Robert Wahbe is slated to join the board of the
              combined entity operating under the Seismic brand, with Seismic CEO Rob Tarkoff leading the merged
              company.
