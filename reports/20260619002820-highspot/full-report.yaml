        title: Exhibits
        blocks:
          - type: callout
            title: Large and Fast-Growing TAM
            body: >-
              The sales enablement platform market is projected at $6.9–7.8B in 2026 with 17–18.5% CAGR, making it one
              of the fastest-growing enterprise software segments. AI tailwinds are additionally accelerating growth
              with a 35% CAGR for the AI sub-segment.
            calloutType: strength
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: callout
            title: Merger Integration Creates Competitor Window
            body: >-
              The Seismic-Highspot merger creates a 12–24 month disruption window during which competitors can target
              at-risk Highspot customers uncertain about product roadmap and support continuity.
            calloutType: risk
            claimRefs:
              - CM024
              - CM030
          - type: callout
            title: Consolidation Reshaping Market Structure
            body: >-
              Two major 2025–2026 mergers (Seismic+Highspot and Showpad+Bigtincan) have effectively consolidated the top
              of the market into two large entities, with Mindtickle as the only remaining major independent challenger.
              This structural shift reduces the number of credible enterprise alternatives for buyers.
            calloutType: insight
            claimRefs:
              - CM007
              - CM008
              - CM009
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              The revenue enablement platform market is defined by a handful of major players competing across content
              management, sales training and coaching, buyer engagement, and analytics. As of mid-2026, the competitive
              landscape has been reshaped by two landmark mergers: (1) Seismic's merger with Highspot announced February
              12, 2026, and (2) Showpad's merger with Bigtincan completed in late 2025. These transactions effectively
              created two large combined entities at the top of the market. The primary competitors Highspot faces—and
              that the combined Seismic+Highspot entity faces—are: Mindtickle (independent; best-in-class for sales
              readiness and training), Showpad+Bigtincan (field sales and EMEA strength), Allego (video-centric
              coaching), and adjacent platforms like Gong (revenue intelligence) and Outreach/Salesloft (sales
              execution). Highspot's strategic position before the merger was defined by three core strengths: (1) Nexus
              AI engine providing content intelligence and deal guidance, (2) deep Salesforce and Microsoft ecosystem
              integrations, and (3) enterprise-grade governance and analytics. These capabilities compared favorably
              against Seismic's similar strength in content management and analytics, while Highspot was generally rated
              higher for ease of use and seller adoption. The merger with Seismic is therefore partly
              defensive—combining forces rather than continuing costly head-to-head competition for the same enterprise
              buyer.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
