      - number: '1.4'
        title: Scale Metrics and Key Milestones
        blocks:
          - type: paragraph
            body: >-
              As of 2024, Highspot reported approximately $450M in annual recurring revenue (ARR), serving around 300
              large enterprise customers and approximately 1,000–1,200 employees. The ARR figure of $450M reported by
              data aggregator GetLatka implies average contract values of roughly $1.5M per account across the customer
              base, consistent with Highspot's enterprise-only go-to-market motion. The company reached 1,000 employees
              and passed the $1B in total-customer-revenue mark around 2022–2023, coinciding with the Series F
              deployment. Highspot has been listed on the Forbes Cloud 100 for multiple consecutive years and was named
              the highest in 'Ability to Execute' in the 2025 Gartner Magic Quadrant for Revenue Enablement Platforms.
              In January 2026, Highspot launched new 'Agentic AI' capabilities powered by its Nexus engine, including
              Deal Intelligence and Deal Agent for real-time deal coaching. The most significant milestone in the
              company's history since the Series F is the February 12, 2026 announcement of a definitive merger
              agreement with Seismic, another major sales enablement platform. Key milestones span founding in 2012,
              multiple financing events, product expansions including Content Hub, Digital Rooms, Conversation
              Intelligence and the Nexus AI platform, international expansion to EMEA and ANZ, recognition in industry
              analyst rankings, layoffs in 2023 related to the path to profitability, and the culminating 2026 merger.
            claimRefs:
