      - number: '3.2'
        title: Primary Competitor Profiles
        blocks:
          - type: paragraph
            body: >-
              Seismic is Highspot's primary historical direct competitor and now merger partner. Seismic was founded in
              2010 in San Diego, has raised approximately $440M in equity plus a $500M debt facility in 2024, and
              carries a $3B post-money valuation from its 2021 Series G led by Permira. Seismic's estimated ARR is
              approximately $300M as of 2026, slightly below Highspot's reported ~$450M. Seismic's core strength has
              been content management, personalization, and document automation—particularly in financial services and
              technology. The company was historically strong in EMEA and Asia Pacific markets where Highspot's
              international presence was more limited. Permira controls Seismic and will control the merged entity, with
              Seismic CEO Rob Tarkoff leading the combined company. Mindtickle is the leading independent pure-play
              revenue enablement competitor. The company focuses almost exclusively on sales training, onboarding,
