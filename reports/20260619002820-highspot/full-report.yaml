  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Size and Growth Trajectory
        blocks:
          - type: paragraph
            body: >-
              The global sales enablement platform market was valued at approximately $6.9–7.8 billion in 2026 depending
              on the analyst methodology, with a consensus CAGR of 17–18.5% projected through 2033–2035. Grand View
              Research estimates the market at $6.9 billion in 2026, growing to $21.2 billion by 2033 (CAGR 17.3%).
              Precedence Research projects $7.79 billion in 2026 and $35.68 billion by 2035 (CAGR 18.4%). Fortune
              Business Insights estimates $7.2 billion for 2026, reaching $25.65 billion by 2034. The market is driven
              by digital-first B2B buyer behavior, AI-powered platform capabilities, and enterprise consolidation of
              point solutions into unified revenue enablement suites. The AI-specific sub-segment within sales
              enablement is projected to surpass $2 billion in spending by 2026 alone, growing at a 35% CAGR toward $3.4
              billion by 2030. North America commands approximately 40–44% of global market revenue in 2026, with the
              U.S. as the dominant country. Asia Pacific is the fastest-growing region at 21.8% CAGR. The platform
              delivery model has shifted overwhelmingly to SaaS/cloud, with over 80% of new implementations in 2026
              being cloud-based. Given Highspot's reported ~$450M ARR in 2024 against a market of approximately $6.9–7.8
              billion in 2026, the company holds roughly a 6–7% revenue share of the total platform market before the
              Seismic combination.
            claimRefs:
              - CM001
              - CM002
