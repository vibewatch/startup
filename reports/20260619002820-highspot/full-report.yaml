  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Profile
        blocks:
          - type: paragraph
            body: >-
              Highspot's customer base is composed almost entirely of large enterprise organizations, with an average
              contract value of approximately $1.5M per customer. The company targets organizations with large sales
              teams (typically 200+ reps) where the ROI from unified content management, training, and analytics is most
              pronounced. The customer base spans multiple verticals. Financial services is one of the largest segments,
              including banks, insurance companies, asset managers, and fintech firms such as Charles Schwab, Visa, and
              Aetna, where sales compliance and content governance requirements make the Highspot platform particularly
              valuable. Technology and software companies represent a significant cohort, including Amazon, Adobe, and
              various SaaS vendors where Highspot is used to enable large enterprise sales teams. Manufacturing and
              industrial companies include Toyota and General Motors, where Highspot enables distributor and dealer
              network training at scale. Healthcare organizations including Aetna use Highspot for compliance-driven
              content governance and training. Professional services and consulting firms round out the customer
              profile. Geographically, Highspot's customer base is predominantly North American, with growing European
              presence. Customer size typically exceeds $1B in annual revenue, with many Fortune 500 companies in the
              portfolio. The company markets primarily through direct enterprise sales and a network of technology and
              consulting partners, including Salesforce, Microsoft, and Accenture-type system integrators. The high ACV
              ($1.5M) model implies a relatively small number of very large enterprise customers rather than a broad SMB
              or mid-market base, which positions the company favorably for NRR-driven expansion but creates revenue
              concentration risk.
