companyProfile:
  summary: >-
    Highspot is a leading AI-powered sales enablement platform founded in 2012 in Seattle by Robert Wahbe, Oliver Sharp,
    and David Wortendyke. The company serves enterprise revenue teams with a unified platform integrating content
    management, guided selling, conversational intelligence, training, and analytics. Its Nexus AI layer, launched
    progressively through 2024–2026, underpins autonomous deal agents and GTM workflow automation. Highspot reported an
    estimated ARR of $450M in 2024 and has raised approximately $655M in total venture funding through its Series F
    round at a $3.5B valuation in January 2022. In late 2025/early 2026, Highspot entered a pending merger agreement
    with Seismic, creating a potential $6B combined sales enablement entity subject to FTC and EU antitrust review.
