      - number: '2.2'
        title: Market Structure and Competitive Segmentation
        blocks:
          - type: paragraph
            body: >-
              The revenue enablement platform market has undergone dramatic consolidation in 2025–2026. The two most
              consequential mergers were: (1) Seismic and Highspot announcing a definitive merger agreement in February
              2026, creating a combined entity estimated at approximately $6 billion in combined value; and (2) Showpad
              merging with Bigtincan in late 2025 under Vector Capital, creating a second-tier competitor with greater
              scale. The market can be segmented into three tiers: (1) Large Enterprise: dominated post-merger by
              Seismic+Highspot with combined estimated enterprise market share of 40–50% for content management and
              guided selling use cases in the large enterprise segment; (2) Mid-Market: contested by Showpad+Bigtincan,
              Mindtickle, Allego, and others with combined estimated share of 15–25%; (3) SMB and specialty: served by
              Outreach, Salesloft, Gong, Spekit, Dock, and adjacent CRM-integrated tools. Mindtickle remains the leading
              independent platform focused on sales readiness, training, and coaching, particularly strong in
              technology, pharma, and finance verticals. The market's vertical concentration is strongest in consumer
              goods, retail, IT/telecom, and banking/financial services. Geography-wise, North America leads spend, with
              EMEA showing strong growth especially in manufacturing and healthcare verticals where Showpad has
              traditionally been strong. The shift from point solutions (content libraries, LMS systems) to unified
              revenue enablement platforms has been the defining structural change of the past five years.
            claimRefs:
