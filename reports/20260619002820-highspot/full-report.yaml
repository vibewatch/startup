      - number: '7.2'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Highspot faces a multi-layered regulatory risk environment in 2026. Merger regulatory review is the most
              immediate legal risk: the FTC and EU have both been identified as reviewing the Seismic transaction. EU
              antitrust review is particularly sensitive given that the combined entity would dominate the European
              sales enablement market, and the European Commission has shown increased willingness to intervene in
              technology sector mergers. If the EU blocks or imposes conditions on the merger, the transaction economics
              may change adversely for Highspot investors. GDPR compliance remains a persistent risk: despite Highspot's
              published certifications, any data breach, cross-border data transfer violation, or failure to honor Data
              Subject Access Requests could trigger regulatory penalties of up to €20M or 4% of global annual turnover.
              GDPR enforcement has accelerated under new streamlined complaint processes in effect since 2026. The EU AI
              Act introduces a new compliance layer. As of August 2, 2026, main obligations for high-risk AI systems
              become enforceable. If any of Highspot's AI features (e.g., Deal Agent's automated deal risk assessment,
              or any features touching employee monitoring or HR decision-making) are classified as 'high-risk' under
              the AI Act, Highspot must demonstrate conformity assessment, maintain a technical documentation file,
              register in the EU AI database, and implement continuous monitoring. Non-compliance with the EU AI Act
              carries penalties of up to €35M or 7% of global annual turnover—potentially $31M+ for Highspot at its
              current ARR scale. The EU Digital Omnibus Package is also being developed, introducing additional
              obligations related to legitimate interest for AI data processing and mandatory bias detection. Employment
              law risk is relevant in the context of the 2023 dual-round layoffs and any post-merger workforce
              restructuring: WARN Act requirements in the US and equivalent obligations in Europe must be carefully
              managed. IP risks include the possibility of patent disputes over AI training methodologies or the
              Enablement Graph data model, given the increasingly litigious AI IP landscape in 2026.
            claimRefs:
