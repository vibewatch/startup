      - number: '4.3'
        title: Unit Economics and Cost Structure
        blocks:
          - type: paragraph
            body: >-
              Highspot's exact unit economics are not publicly disclosed, but can be partially estimated from available
              data. Revenue per employee of approximately $375,000–$450,000 implies reasonable capital efficiency for a
              late-stage enterprise SaaS company. Industry benchmarks from SaaSRise and CFO Advisors suggest scale-stage
              SaaS companies have a median CAC payback period of 15–18 months and median LTV:CAC ratios of 3.2x–4x.
              Top-quartile performers achieve CAC payback under 12 months and LTV:CAC above 5x. Given Highspot's average
              contract value of ~$1.5M and an enterprise gross retention rate likely above 90% (consistent with
              multi-year contracts), even conservative LTV assumptions yield substantial multiples. Cost structure is
              dominated by R&D, sales and marketing, and professional services headcount. The 2023 layoffs (10% in
              February, 15% in June) reduced the workforce by approximately 25% from peak headcount, which given ~1,200
              employees at peak implies a reduction to roughly 900 employees before subsequent rehiring to reach 2024
              levels. The explicit path-to-profitability framing of the 2023 layoffs suggests the company was operating
              at a loss before the restructuring. The Rule of 40—a common SaaS health metric combining growth rate and
              profit margin—would require current figures to calculate precisely. If ARR growth slowed to approximately
              15–20% annually (consistent with scale compression at $450M ARR), achieving Rule of 40 would require
              approximately 20–25% EBITDA margins, which would be consistent with the cost restructuring objective.
              Enterprise SaaS gross margins of 70–80% provide sufficient coverage for operating leverage if
              sales/marketing efficiency improves.
