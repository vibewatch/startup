  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture and Core Modules
        blocks:
          - type: paragraph
            body: >-
              Highspot's product architecture is built around a unified data layer—the Nexus AI engine—that ingests
              signals from CRM, content engagement, training activity, conversation data, and buyer interactions to
              produce contextually aware recommendations and agentic actions. The platform is organized into five
              primary modules. Content Hub serves as the central content management and governance layer, allowing
              marketing teams to organize, manage, and track content performance down to the slide level. Sales Plays
              provide structured playbook workflows that guide reps through complex sales motions with compliant,
              approved collateral and training modules. Digital Rooms create personalized buyer microsites where sellers
              can curate and share content, track engagement, and accelerate deal cycles through collaborative
              experiences. Conversation Intelligence captures, transcribes, and analyzes customer conversations to
              extract insights about buyer behavior, objection patterns, and rep performance. Analytics and Initiative
              Scorecards tie all enablement activity to pipeline and revenue outcomes, providing CMOs and revenue
              leaders with evidence-based attribution for sales enablement investments. The Nexus AI engine's Enablement
              Graph correlates CRM activities with Highspot usage data to surface next-best-action recommendations. The
              architecture is designed to be integration-first, operating as an orchestration layer above existing GTM
              toolchains rather than a replacement CRM or LMS. Highspot's 2026 product announcements—Deal Agent in
              January and GTM Agent in May—represent a shift from assistive AI (summarization, recommendations) to
              agentic AI (autonomous task execution and proactive risk mitigation).
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
