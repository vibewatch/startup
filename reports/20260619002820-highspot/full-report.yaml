      - number: '1.3'
        title: Funding History and Valuation
        blocks:
          - type: paragraph
            body: >-
              Highspot has raised approximately $654–$655 million across eight documented funding rounds. The company's
              most recent financing was a Series F round closed in January 2022 at $248M, which valued the company at
              $3.5 billion post-money. The Series F was led by new investors B Capital Group and D1 Capital Partners,
              with participation from existing backers ICONIQ Growth, Madrona Venture Group, Salesforce Ventures,
              Sapphire Ventures, and Tiger Global Management. The round brought Highspot into the exclusive club of
              private software unicorns and was used to fund international expansion, accelerate AI product development,
              and scale the go-to-market team. Prior rounds included a Series E ($200M, 2021), Series D ($75M, 2019),
              Series C ($35M, 2018), Series B ($15M, 2017), and earlier seed and angel stages. No new funding rounds
              were announced between the Series F (Jan 2022) and the Seismic merger announcement (Feb 2026), a period of
              roughly four years. The absence of a new funding round during this period, combined with the merger
              announcement, suggests the company was either managing efficiently on the Series F proceeds or
              encountering headwinds in a more challenging financing environment. The $3.5B valuation from the 2022
              round has not been officially updated; the merged Seismic-Highspot entity is described by analysts as
              potentially forming a combined entity valued above $6B.
