      - number: '5.2'
        title: Nexus AI Engine and Agentic Capabilities
        blocks:
          - type: paragraph
            body: >-
              The Nexus AI engine is Highspot's proprietary artificial intelligence layer, introduced as the central
              technology differentiator beginning in 2024 with a full agentic rollout in 2026. Nexus unifies structured
              (CRM data, pipeline metrics) and unstructured data (content, call transcripts, training submissions) into
              a unified intelligence graph. The Enablement Graph is a proprietary data structure that models the
              relationships between GTM actions (content shares, training completions, coaching interactions) and sales
              outcomes (pipeline movement, deal closure), enabling predictive analytics and automated action
              recommendations. Deal Agent, launched January 2026, analyzes CRM data, buyer engagement signals, and
              conversation patterns to generate a unified deal risk view with recommended mitigating actions. GTM Agent,
              launched May 2026, operates at the strategy-to-execution level, translating sales leadership priorities
              into rep-level guidance, identifying which plays are winning, and surfacing what behaviors drive revenue
              performance across the team. AI Role Play enables sellers to practice conversations with AI-simulated
              buyers, with automated evaluation and feedback delivered at scale. The MCP (Multi-Context Platform)
              Server, introduced in 2026, enables Highspot's Nexus AI to connect with external LLM providers including
              OpenAI, Anthropic, and Microsoft Copilot, allowing enterprises to run AI-enabled GTM workflows through any
              compatible AI orchestration layer. Highspot also supports running AI workloads within a customer's
              dedicated Microsoft Azure OpenAI Service instance, a critical feature for regulated industries requiring
              data residency and sovereignty controls. The company states that Nexus AI does not use customer data for
              model training, maintaining clear data separation between customers.
            claimRefs:
