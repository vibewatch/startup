            body: >-
              Highspot does not file public financial statements, and exact financial metrics are not officially
              disclosed. Based on third-party data providers and industry benchmarks, the following picture emerges.
              ARR: GetLatka reports approximately $450M ARR as of 2024, representing a remarkable growth from an
              estimated $60M ARR in 2020, implying a CAGR of approximately 70% over that four-year period. Customer
              count: approximately 300 enterprise customers in 2024, consistent with a high-ACV, low-volume enterprise
              GTM motion. Average contract value: approximately $1.5M per customer ($450M ÷ 300 customers), at the
              premium end of the SaaS market. Headcount: approximately 1,000–1,200 employees in 2024–2025, implying
              annualized revenue per employee of approximately $375,000–$450,000, above the median for enterprise SaaS
              but consistent with a premium-ACV model. Gross margin: not publicly disclosed; enterprise SaaS platforms
              with similar profiles typically achieve 70–80% gross margins, excluding professional services. NRR (Net
              Revenue Retention): not publicly disclosed; given the company's land-and-expand model and enterprise
              customer focus, industry comparable NRR would likely be in the 110–120% range if expansion is strong.
              Valuation multiple: the $3.5B Series F valuation (Jan 2022) implies approximately 7.8x ARR at the 2024 ARR
              level, elevated relative to the 4–6x median for private SaaS in 2025–2026 per Windsor Drake benchmarks. A
              2026-market-consistent valuation of 4–6x ARR would imply a range of $1.8B–$2.7B—meaningfully below the
