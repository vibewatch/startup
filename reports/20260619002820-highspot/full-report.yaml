      - number: '7.5'
        title: People and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Highspot's people risk profile is elevated for several reasons. Key person risk: Highspot's three
              co-founders—Robert Wahbe (CEO), Oliver Sharp (SVP AI and co-founder), and David Wortendyke (CTO)—have been
              reported to join the board of the combined entity rather than taking operational roles in the merged
              company. The loss of the founding team from day-to-day operations creates succession risk for both
              technology direction (Oliver Sharp's Nexus AI vision) and customer relationships (CEO Robert Wahbe's
              enterprise relationships). Talent attrition risk: post-merger integration typically drives voluntary
              departures among top talent who prefer independent company culture, find their roles redundant, or are
              offered retention packages to stay but leave after the vesting period. Highspot's 2023 workforce
              reductions of approximately 25% already demonstrated the company's willingness to make large-scale
              workforce changes; post-merger rationalization may involve further reductions. Cultural integration is
              particularly challenging when merging two companies that were direct competitors: sales teams will have
              included 'competitive selling' against each other, and internal dynamics may be adversarial initially.
              PE-driven execution risk: Permira's controlling interest introduces incentive structures that prioritize
              financial returns over long-term product investment. PE firms typically focus on EBITDA margins and exit
              timing (3–5 year horizon) rather than R&D investment cycles (5–10 year horizon), which can conflict with
              the long-term innovation investment required to compete with Microsoft and Salesforce. Execution risk in
              the agentic AI space: Highspot's 2026 Deal Agent and GTM Agent launches are early-production products in
              an intensely competitive space; if execution quality is poor or the products fail to deliver promised
              outcomes, customer trust and NRR will suffer.
