            body: >-
              Highspot's revenue concentration profile is a critical consideration for any investor or acquirer. With
              approximately 300 enterprise customers and $450M ARR, each customer represents an average of $1.5M in ARR.
              If the top 20 customers represent 20% of ARR (a common enterprise software distribution), then $90M ARR is
              concentrated in 20 accounts. Losing a single enterprise account of $3M–$5M+ represents a meaningful
