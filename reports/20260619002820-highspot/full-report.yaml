chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Highspot, Inc. is a privately held enterprise software company headquartered in Seattle, Washington.
              Founded in 2012 by three former Microsoft senior technologists, the company pioneered the modern sales
              enablement category and has grown to become one of its most recognized leaders. The core mission is to
              improve the productivity and effectiveness of go-to-market (GTM) teams—sales, marketing, and customer
              success—by providing a unified AI-powered platform that manages content, training, coaching, analytics,
              and buyer engagement in one system. Highspot's platform integrates across the modern revenue tech stack,
              connecting to CRM systems (Salesforce, Microsoft Dynamics, HubSpot), communication tools (Slack, Microsoft
              Teams), video platforms (Zoom), and business intelligence systems. The business model is
              subscription-based SaaS, predominantly selling to mid-market and large enterprise organizations under
              multi-year contracts. Target customers are companies with large, distributed, or complex sales forces that
              need centralized enablement infrastructure. The company generates recurring revenue from per-seat
              licensing plus professional services. Average contract values are large by SaaS standards, reportedly
              around $1.5M per enterprise customer, with a concentrated base of roughly 300 high-value accounts
              generating the reported $450M ARR in 2024.
