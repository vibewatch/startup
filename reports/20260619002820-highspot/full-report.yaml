        title: Trust, Compliance, and Security Framework
        blocks:
          - type: paragraph
            body: >-
              Highspot has established an enterprise-grade security and compliance posture targeting regulated
              industries such as financial services, healthcare, and government. The company holds SOC 2 Type II
              certification, confirming independent audit of security controls over confidentiality, availability,
              processing integrity, and privacy. ISO 27001 certification covers information security management systems.
              ISO 27701 extends the ISO 27001 framework to privacy information management, a critical differentiator for
              GDPR compliance. GDPR compliance is documented with data residency options, DSAR (Data Subject Access
              Request) management tools, and consent management capabilities. The company also reports compliance with
              the EU AI Act, indicating proactive alignment with emerging AI transparency and risk classification
              requirements—a significant differentiator for EU-based enterprise sales. Highspot's AI policies state that
              customer data is not used to train models (a critical guarantee for enterprises concerned about
              proprietary information leakage into shared AI models). HYOK (Hold Your Own Key) encryption allows
              enterprises to retain cryptographic control over their data. Role-based access controls, real-time audit
              APIs, metadata-based content governance, and incident response procedures complete the security framework.
              The security page at highspot.com/product/security/ and trust page at highspot.com/trust/ document these
              certifications publicly.
