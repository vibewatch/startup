              - CV025
      - number: '8.5'
        title: Final Diligence Asks and Actionable Next Steps
        blocks:
          - type: paragraph
            body: >-
              Completing a comprehensive valuation analysis for Highspot requires access to several categories of
              private information that are not available through public sources. The most critical diligence asks,
              listed in priority order, are: (1) Audited financial statements for FY2023, FY2024, and management
              accounts for FY2025—necessary to verify ARR, gross margin, NRR, burn rate, and profitability; (2) Merger
              agreement including deal structure, merger consideration type (cash, equity, debt), treatment of preferred
              shareholders, and implied Highspot valuation—to reconcile the $6B SaaS Sentinel estimate with the official
              transaction terms; (3) Capitalization table with liquidation preference waterfall—to assess how the merger
              consideration distributes across Highspot's approximately 655M raised in equity from Series A through F
              investors; (4) Customer cohort data including gross retention by vintage year, NRR by cohort, and top 10
              customer ACV—to validate the land-and-expand growth thesis; (5) EU AI Act compliance assessment
              documentation—to assess whether Highspot's AI features are classified as high-risk and what compliance
              investment is required by August 2026; (6) Merger integration plan including technology rationalization
              timeline, planned workforce changes, and customer communication plan—to assess integration execution
              quality and bear-case probability. Without these items, the valuation is necessarily bracketed by a wide
              $1.4–4.5B range, which limits investment decision precision. The valuation analysis cannot be definitively
              resolved without formal due diligence access.
            claimRefs:
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
          - type: table
            tableRef: TV006
            claimRefs:
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Merger Transaction Validates Near-Peak Value Preservation
            body: >-
              The SaaS Sentinel report of a $6B combined deal implies Highspot's contribution at approximately
              $3.5B—near the $3.5B Series F mark. This suggests the merger structure preserves investor value despite
              four years of SaaS market compression since January 2022.
            calloutType: strength
            claimRefs:
              - CV004
              - CV007
          - type: callout
            title: Standalone Bear Case at $1.4–1.8B
            body: >-
              If the Seismic merger is blocked or fails, Highspot faces a standalone valuation of approximately
              $1.4–1.8B at 3–4x ARR—approximately 50–60% below the $3.5B Series F mark—requiring either a down-round to
              sustain operations or a distressed sale.
            calloutType: risk
            claimRefs:
              - CV019
              - CV014
          - type: callout
            title: Financial Opacity Limits Confidence in All Scenarios
            body: >-
              All valuation scenarios carry unusually high uncertainty because key financial metrics (gross margin, NRR,
              profitability) are not publicly available. The $2.5B–$3.0B base case rests on estimated inputs that have
              not been independently verified.
            calloutType: risk
            claimRefs:
              - CV030
              - CV026
