      - number: '7.4'
        title: Operational, Technology, and Security Risk
        blocks:
          - type: paragraph
            body: >-
              Highspot's operational risk profile is elevated in 2026 by the complexity of the pending merger
              integration and the platform's deep enterprise dependency. Technology integration risk is the primary
              operational concern: merging Nexus AI with Seismic's AI architecture, consolidating two separate
              cloud-native SaaS platforms, migrating customer data between systems, and rationalizing 100+ integration
              connectors for both platforms will take multiple years and introduce system instability risks. Customer
              data security is a persistent risk at Highspot's scale: storing approximately $450M ARR worth of
              enterprise customers' most sensitive sales materials, CRM integration tokens, and conversation transcripts
              represents a significant cybersecurity attack surface. A data breach affecting even one major customer
              could trigger GDPR penalties, customer contract terminations, and reputational damage that affects the
              entire customer base. Highspot's cloud infrastructure dependency (AWS and/or Azure) means that hyperscaler
              outages translate directly into platform unavailability; however, this is a standard enterprise SaaS risk.
              The Conversation Intelligence module introduces specific risks related to call recording consent
              regulations, which vary by US state (two-party consent laws in California, Florida, and others) and by EU
              jurisdiction. Any recording of calls without proper consent could trigger legal liability. Service
              delivery quality during the merger transition period represents another operational risk: the
              post-announcement period typically sees key talent departures, project delays, and customer communication
              gaps that can erode the 'high customer success ratings' that are a competitive differentiator for Highspot
              today. The operational complexity of serving ~300 enterprise accounts with multi-year SLAs during an
              active M&A integration is a non-trivial execution challenge.
