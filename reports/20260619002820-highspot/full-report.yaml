      - number: '4.4'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Highspot raised $248M in its Series F in January 2022, which along with its ~$655M total raised provides
              the financing foundation. The company has not announced any additional equity rounds in the approximately
              four years between the Series F and the Seismic merger announcement in February 2026. This extended period
              without new capital either reflects strong revenue generation covering operating expenses, or a
              disciplined decision to manage toward profitability and an exit rather than pursuing a potentially
              dilutive or down-round in the 2022–2024 funding market. The 2023 layoffs (totaling approximately 25% of
              peak workforce) are consistent with active cash management. The SaaS funding market experienced a
              significant reset between 2022 and 2024, with median Series F+ valuations declining substantially from
              2021 peaks. Raising a new round at or above $3.5B would have been difficult in this environment, which may
              explain the absence of new capital and the decision to pursue a merger with Seismic. From a capital
              adequacy perspective, the most recent financing of $248M at the likely cash-burn rate for a 1,000–1,200
              person company (estimated annual operating expenses of $200M–$350M at industry norms) would provide
              approximately 12–24 months of runway if the company was operating at a material loss. This window aligns
              with the 2024–2025 timeframe where the company likely needed to either achieve profitability or begin new
              financing or merger discussions. The merger with Seismic, with Permira (a major private equity firm) as
              the controlling entity, provides access to institutional capital at scale but at the cost of Highspot's
              strategic independence and potential dilution for common shareholders.
