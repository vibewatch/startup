  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场规模与增长轨迹
        blocks:
          - type: paragraph
            body: >-
              按不同分析机构方法口径，2026 年全球销售赋能平台市场规模约为 $6.9B–$7.8B，市场共识预计到 2033–2035 年 CAGR 为 17–18.5%。Grand View Research 估算
              2026 年市场为 $6.9B，到 2033 年增长至 $21.2B（CAGR 17.3%）。Precedence Research 预计 2026 年为 $7.79B，2035 年达到 $35.68B（CAGR
              18.4%）。Fortune Business Insights 估计 2026 年为 $7.2B，到 2034 年达到 $25.65B。市场增长由数字优先的 B2B 买方行为、AI
              驱动的平台能力，以及企业把点状工具整合进统一营收赋能套件推动。销售赋能中的 AI 专项子赛道预计仅 2026 年支出就超过 $2B，并以 35% CAGR 增至 2030 年的 $3.4B。北美约占 2026
              年全球市场收入的 40–44%，美国是主导国家。亚太是增长最快地区，CAGR 为 21.8%。平台交付模式已经压倒性转向 SaaS / 云，2026 年超过 80% 的新部署基于云。以 Highspot 2024
              年报道的约 $450M ARR，对比 2026 年约 $6.9B–$7.8B 的市场规模，公司在与 Seismic 合并前约占整体平台市场 6–7% 的收入份额。
