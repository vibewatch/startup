      - number: '5.2'
        title: Nexus AI 引擎与智能体能力
        blocks:
          - type: paragraph
            body: >-
              Nexus AI 引擎是 Highspot 自研的人工智能层，自 2024 年起成为核心技术差异点，并在 2026 年完整推出 agentic 能力。Nexus 把结构化数据（CRM
              数据、管道指标）和非结构化数据（内容、通话转录、培训提交）合进一张统一智能图谱。Enablement Graph 是一套自研数据结构，用来建模 GTM
              动作（内容分享、培训完成、辅导互动）与销售结果（管道推进、交易关闭）之间的关系，从而支撑预测分析和自动行动建议。Deal Agent 于 2026 年 1 月推出，会分析 CRM
              数据、买方互动信号和对话模式，生成统一的交易风险视图，并给出缓释动作。GTM Agent 于 2026 年 5
              月推出，工作在战略到执行层，把销售领导层优先级翻译成销售代表层面的指导，识别哪些打法正在奏效，并浮现团队中哪些行为在驱动收入表现。AI Role Play 让销售人员与 AI
              模拟买方练习对话，并大规模获得自动评估和反馈。MCP（Multi-Context Platform）Server 于 2026 年推出，使 Highspot 的 Nexus AI 能连接
              OpenAI、Anthropic、Microsoft Copilot 等外部 LLM 提供商，企业可通过任何兼容的 AI 编排层运行 AI 驱动的 GTM 工作流。Highspot 也支持在客户专属的
              Microsoft Azure OpenAI Service 实例内运行 AI 工作负载；对于需要数据驻留和主权控制的受监管行业，这是关键能力。公司称，Nexus AI
              不使用客户数据训练模型，客户之间保持清晰的数据隔离。
