      - number: '1.4'
        title: 规模指标与关键里程碑
        blocks:
          - type: paragraph
            body: >-
              截至 2024 年，Highspot 报道约 $450M 年度经常性收入（ARR），服务约 300 个大型企业客户，员工约 1,000–1,200 人。数据聚合商 GetLatka 报道的 $450M
              ARR，意味着按客户群计算，每个账户平均合同价值约 $1.5M，与 Highspot 只做企业客户的 GTM 动作一致。公司在 2022–2023 年前后达到 1,000 名员工，并跨过客户累计收入 $1B
              关口，时间上与 Series F 资金投入相重合。Highspot 连续多年入选 Forbes Cloud 100，并在 2025 Gartner Magic Quadrant for Revenue
              Enablement Platforms 中被评为“Ability to Execute”最高的厂商。2026 年 1 月，Highspot 发布由 Nexus 引擎驱动的新“Agentic
              AI”能力，包括面向实时交易辅导的 Deal Intelligence 和 Deal Agent。Series F 以来，公司历史上最重要的里程碑是 2026 年 2 月 12 日宣布与另一家主要销售赋能平台
              Seismic 签署最终合并协议。关键节点包括 2012 年创立、多轮融资、Content Hub、Digital Rooms、Conversation Intelligence 和 Nexus AI
              平台等产品扩展、向 EMEA 和 ANZ 国际扩张、获得行业分析师排名认可、2023 年围绕盈利路径进行裁员，以及最终走向 2026 年合并。
