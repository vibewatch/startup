              若 Seismic 合并被阻止或失败，Highspot 独立估值约为 $1.4–1.8B，按 3–4x ARR 计算——比 $3.5B Series F 标记低约
              50–60%——需要下轮融资维持运营，或进行困境出售。
            calloutType: risk
