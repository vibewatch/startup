      - number: '7.5'
        title: 人才与执行风险
        blocks:
          - type: paragraph
            body: >-
              Highspot 的人才风险因多重因素而升高。关键人物风险：据报道，Highspot 三位联合创始人——Robert Wahbe（CEO）、Oliver Sharp（SVP AI 兼联合创始人）和 David
              Wortendyke（CTO）——将加入合并实体董事会，而非在合并后公司担任运营职务。创始团队离开日常运营，会在技术方向（Oliver Sharp 的 Nexus AI 愿景）和客户关系（CEO Robert
              Wahbe 的企业关系）两方面造成接班风险。人才流失风险：并购后整合通常会推动顶尖人才自愿离开，他们可能偏好独立公司文化、发现自身角色冗余，或拿到留任包后在归属期结束离开。Highspot 2023 年约 25%
              的裁员已经显示，公司愿意进行大规模劳动力调整；并购后梳理可能带来进一步裁减。两个直接竞争对手合并时，文化整合尤其困难：销售团队过去会彼此“竞争性销售”，内部关系初期可能带有对抗性。PE
              驱动的执行风险：Permira 的控股权益引入一种激励结构，更优先财务回报，而非长期产品投资。PE 公司通常关注 EBITDA 利润率和退出时点（3–5 年周期），而不是 R&D 投资周期（5–10
              年周期）；这可能与同 Microsoft 和 Salesforce 竞争所需的长期创新投入冲突。agentic AI 领域的执行风险：Highspot 2026 年推出的 Deal Agent 和 GTM
              Agent 仍是激烈竞争空间中的早期生产产品；若执行质量不佳，或产品未能交付承诺结果，客户信任和 NRR 都会受损。
