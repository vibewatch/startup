      - number: '5.3'
        title: 技术栈与集成生态
        blocks:
          - type: paragraph
            body: >-
              Highspot 的技术栈遵循集成优先思路，在 CRM、协作、LMS、通信和数据系统上提供 100 多个原生连接器。核心 CRM 集成包括 Salesforce Sales Cloud 和 Microsoft
              Dynamics 365，双向同步数据：把 Highspot 使用数据呈现在 CRM 记录里，也把管道上下文引入 Highspot 推荐。协作集成覆盖 Microsoft Teams、Slack 和
              Zoom，让内容分享和 enablement 触发点嵌入沟通工作流。Gmail 和 Outlook 邮件集成把上下文内容建议和互动跟踪带进销售人员的主沟通渠道。OneDrive、SharePoint、Box 和
              Google Drive 等云存储集成允许企业在源头管理内容，而不是复制进 Highspot。营销技术集成包括 HubSpot、Marketo 和 Pardot，用于对齐内容生命周期。2026 年 MCP
              Server 把集成面扩展到 AI 层本身，任何兼容 OpenAI 的 agent 都能查询并检索 Highspot 的内容和智能图谱。底层平台采用云原生 SaaS 架构，托管在公有云基础设施上（基于
              Microsoft 合作深度，可能是 AWS 或 Azure）。平台支持通过 SAML 2.0 做 SSO、用 SCIM 做用户配置，提供 RBAC 角色访问控制，并开放 API
              以支持自定义集成。内容分发针对全球交付优化，CDN 支持高带宽素材交付。
