chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Highspot, Inc. 是一家总部位于华盛顿州西雅图的私营企业软件公司。公司由三位前 Microsoft 高级技术管理者于 2012
              年创立，较早打出“现代销售赋能”这个品类，并成长为其中知名度最高的领导者之一。核心使命是提升 go-to-market（GTM）团队——销售、营销和客户成功——的生产力和有效性，靠一个统一的 AI
              驱动平台，把内容、培训、辅导、分析和买方互动放进同一系统。Highspot 平台接入现代营收技术栈，包括 CRM 系统（Salesforce、Microsoft
              Dynamics、HubSpot）、沟通工具（Slack、Microsoft Teams）、视频平台（Zoom）和商业智能系统。商业模式是订阅制
              SaaS，主要面向中型市场和大型企业客户销售多年期合同。目标客户是销售队伍庞大、分散或复杂，需要集中式赋能基础设施的公司。公司通过按席位授权和专业服务获得经常性收入。按 SaaS
              标准看，平均合同价值较高，据称每个企业客户约 $1.5M；约 300 个高价值账户贡献了 2024 年报道的 $450M ARR。
