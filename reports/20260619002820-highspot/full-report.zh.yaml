      - number: '3.2'
        title: 主要竞争者画像
        blocks:
          - type: paragraph
            body: >-
              Seismic 是 Highspot 历史上最主要的直接竞争对手，现在也是合并伙伴。Seismic 2010 年成立于圣迭戈，累计获得约 $440M 股权融资，并在 2024 年获得 $500M 债务融资；其
              2021 年由 Permira 领投的 Series G 轮投后估值为 $3B。Seismic 2026 年预计 ARR 约 $300M，略低于 Highspot 报道的约 $450M。Seismic
              核心强项一直是内容管理、个性化和文档自动化，在金融服务和科技行业尤其突出。公司过去在 EMEA 和亚太市场强势，而 Highspot 国际覆盖相对有限。Permira 控制
              Seismic，并将控制合并实体；Seismic CEO Rob Tarkoff 将领导合并后公司。Mindtickle 是领先的独立纯营收赋能竞争者。公司几乎只专注销售培训、入职、辅导和就绪项目，连续 26
              个以上季度在 G2 的 Sales Training and Onboarding 排名第一。Mindtickle 已获得超过 $100M
              融资，被视为企业在优先考虑技能发展而非内容管理时的稳定独立选择。其披露定价约为 $450/用户/年。Showpad（现已在 Vector Capital 旗下与 Bigtincan
              合并）过去在内容管理和买方互动工具上与 Highspot 竞争，在制造业、医疗健康和 EMEA 企业细分中尤其强。Bigtincan 补上了文件治理、离线访问和伙伴赋能能力。合并后的
              Showpad+Bigtincan 实体企业市场份额估计为 15–20%。
