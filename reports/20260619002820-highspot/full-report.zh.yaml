      - number: '6.4'
        title: 留存、重复使用与客户满意度
        blocks:
          - type: paragraph
            body: >-
              Highspot 未公开披露官方净收入留存率（NRR）或毛留存率，但可得第三方和代理数据给出有意义信号。截至 2026 年，Highspot 在 G2 上基于 600 多条评论整体评分约 4.4/5，位列销售
              enablement 平台第一梯队。在 Gartner Peer Insights 上，Highspot 评分约
              4.5/5，内容管理、分析和客户支持持续获得好评。公司称续约率较高，符合多年期企业合同结构：企业一旦把 Highspot 嵌入 CRM 和培训工作流，就会面临显著迁移成本（数据迁移、200–2,000
              名销售代表再培训、历史分析基线丢失），这在结构上推动毛留存高于平均水平。用户评论中的负面主题集中在：（1）大型企业实施复杂、价值实现时间长；（2）Conversation Intelligence 不如 Gong
              等专门工具扎实；（3）搜索和内容组织需要持续的管理投入；（4）相较更简单替代品，价格被认为偏高。公司客户支持评分高（评论中频繁提及），说明其持续投入客户成功，这符合高 ACV
              模式：客户成功是保护大合同的必要条件。考虑到 Seismic 合并，整合期存在有意义的客户流失风险：处于续约中期的企业买方，可能选择评估竞争平台，而不是承诺给一家产品方向不确定的合并实体。
