      - number: '7.4'
        title: 运营、技术与安全风险
        blocks:
          - type: paragraph
            body: >-
              2026 年，待完成合并整合的复杂性和平台对大型企业的深度依赖，使 Highspot 的运营风险上升。技术整合风险是首要运营担忧：把 Nexus AI 与 Seismic 的 AI 架构合并、整合两个独立云原生
              SaaS 平台、在系统间迁移客户数据，并梳理两个平台的 100 多个集成连接器，都需要多年时间，并会引入系统不稳定风险。在 Highspot 当前规模下，客户数据安全是持续风险：公司存储约 $450M ARR
              对应企业客户最敏感的销售材料、CRM 集成令牌和对话转录，形成显著网络安全攻击面。即使只影响一个主要客户的数据泄露，也可能触发 GDPR 罚款、客户合同终止和损害整个客户基础的声誉损失。Highspot
              对云基础设施（AWS 和 / 或 Azure）的依赖意味着超大规模云厂商宕机会直接转化为平台不可用；不过这是标准企业 SaaS 风险。Conversation Intelligence
              模块引入与通话录音同意法规有关的特定风险；这些法规因美国各州（California、Florida
              等州的双方同意法）和欧盟司法辖区而异。任何未经适当同意的通话录音都可能触发法律责任。合并过渡期内的服务交付质量是另一项运营风险：公告后的阶段通常会出现关键人才离职、项目延迟和客户沟通缺口，可能侵蚀
              Highspot 今天作为竞争差异点的“高客户成功评分”。在活跃 M&A 整合期间，服务约 300 个带多年 SLA 的企业账户，运营复杂度不低。
