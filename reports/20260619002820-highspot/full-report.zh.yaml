      - number: '8.5'
        title: 最终尽调问题与可执行下一步
        blocks:
          - type: paragraph
            body: >-
              要完成对 Highspot 的全面估值分析，需要获取几类公开来源无法提供的私有信息。最关键的尽调问题按优先级排列为：（1）FY2023、FY2024 经审计财务报表，以及 FY2025 管理账——用于核实
              ARR、毛利率、NRR、烧钱速度和盈利能力；（2）合并协议，包括交易结构、合并对价类型（现金、股权、债务）、优先股股东处理方式和隐含 Highspot 估值——用于把 SaaS Sentinel 的 $6B
              估计与官方交易条款对齐；（3）资本结构表及清算优先权瀑布——评估合并对价如何分配给 Highspot 从 Series A 到 F 约 655M 股权融资的投资人；（4）客户 cohort 数据，包括按
              vintage year 的毛留存、按 cohort 的 NRR 和前 10 大客户 ACV——验证 land-and-expand 增长论点；（5）EU AI Act 合规评估文件——评估 Highspot
              AI 功能是否被归类为高风险，以及 2026 年 8
              月前需要投入多少合规成本；（6）合并整合计划，包括技术梳理时间表、计划中的劳动力调整和客户沟通计划——评估整合执行质量和熊市情景概率。缺少这些项目时，估值必然只能落在 $1.4–4.5B
              的宽区间内，限制投资决策精度。没有正式尽调访问，估值分析无法被最终解决。
            claimRefs:
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
