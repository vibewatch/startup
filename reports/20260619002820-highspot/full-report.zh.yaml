      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              2026 年，Highspot 面临多层监管风险环境。合并监管审查是最直接的法律风险：FTC 和欧盟都被识别为正在审查 Seismic 交易。欧盟反垄断审查尤其敏感，因为合并实体将主导欧洲销售
              enablement 市场，而欧盟委员会近年更愿意干预科技行业并购。若欧盟阻止合并或施加条件，交易经济性可能对 Highspot 投资人不利。GDPR 合规仍是持续风险：尽管 Highspot
              发布了认证，任何数据泄露、跨境数据传输违规，或未能满足 Data Subject Access Request，都可能触发最高 €20M 或全球年营业额 4% 的监管罚款。2026 年起生效的新简化投诉流程已加速
              GDPR 执法。EU AI Act 又增加一层合规要求。自 2026 年 8 月 2 日起，高风险 AI 系统的主要义务开始可执行。若 Highspot 的任何 AI 功能（例如 Deal Agent
              自动交易风险评估，或任何涉及员工监控或 HR 决策的功能）被归类为 AI Act 下的“高风险”，Highspot 必须证明符合性评估，维护技术文档，在欧盟 AI 数据库登记，并实施持续监控。违反 EU AI
              Act 的罚款最高可达 €35M 或全球年营业额 7%——按 Highspot 当前 ARR 规模，潜在金额超过 $31M。EU Digital Omnibus Package 也在制定中，将围绕 AI
              数据处理的合法利益和强制偏见检测引入更多义务。2023 年两轮裁员以及任何并购后劳动力重组，都让劳动法风险具备相关性：美国 WARN Act 要求和欧洲同等义务必须审慎管理。IP 风险包括围绕 AI 训练方法或
              Enablement Graph 数据模型发生专利争议的可能性；2026 年 AI IP 诉讼环境正变得越来越激烈。
