      - number: '1.5'
        title: 负面事件与风险因素
        blocks:
          - type: paragraph
            body: >-
              Highspot 没有躲开成长阶段科技公司面对的广泛挑战。2023 年，公司进行了两轮重要裁员：2 月约裁减 10% 员工，6 月又裁减 15%。公司称这些调整是迈向盈利、并投向 AI
              等增长领域的必要步骤，但前员工和外部观察者指出，公司围绕离职补偿和岗位安全的沟通并不一致。Glassdoor 和 Blind
              等平台上的员工评价显示，裁员后士气下滑，员工担心管理层透明度和长期稳定性。公司还缩减西雅图办公室面积，同时在印度、加拿大等成本更低地区扩张。竞争层面，Highspot
              面临结构性风险：销售赋能品类已经拥挤，Seismic、Showpad、Bigtincan、Mindtickle 等玩家在 AI 功能上激烈竞争，差异化越来越难。与 Seismic
              合并虽可能造就一个主导玩家，但也带来整合执行风险和过渡期客户流失风险。合并财务细节尚未公开，交易结构、稀释和管理层延续性都存在不确定性。公司 $450M ARR 对应 $3.5B 估值，收入倍数约
              7.8x；相对当前私营 SaaS 市场偏高，一旦增长放缓，下行风险值得追问。
