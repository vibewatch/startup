      - number: '7.6'
        title: 图表
        blocks:
          - type: callout
            title: 合并被监管阻止风险
            body: FTC 和欧盟都在审查 Seismic 合并。不利监管结果——阻止或施加重大条件——会让 Highspot 作为独立公司被迫滞留，在多年整合相关分心和人才流失之后，仍要面对竞争逆风。
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR009
          - type: callout
            title: EU AI Act 高风险分类风险
            body: >-
              若 Highspot 的 Deal Agent 或其他 AI 功能被归类为 EU AI Act 下的“高风险”（2026 年 8 月起可执行），Highspot 将面临最高 €35M 或全球营业额 7%
              的潜在罚款，并需完成强制符合性评估和欧盟 AI 系统登记。
            calloutType: risk
            claimRefs:
              - CR010
              - CR011
              - CR012
          - type: callout
            title: 被 Microsoft 和 Salesforce 平台替代
            body: >-
              Microsoft Copilot for Sales 和 Salesforce Einstein GPT 正把原生销售 enablement 能力嵌入 CRM 工作流，降低选择集成方案而非 Highspot
              的摩擦。PE 所有权和合并整合分心可能进一步拉大竞争差距。
            calloutType: risk
