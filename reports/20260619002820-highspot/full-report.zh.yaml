      - number: '1.3'
        title: 融资历史与估值
        blocks:
          - type: paragraph
            body: >-
              Highspot 在八轮有记录融资中累计获得约 $654M–$655M。公司最近一轮融资是 2022 年 1 月完成的 $248M Series F，投后估值 $3.5B。Series F 由新投资方 B
              Capital Group 和 D1 Capital Partners 领投，现有投资方 ICONIQ Growth、Madrona Venture Group、Salesforce
              Ventures、Sapphire Ventures 和 Tiger Global Management 参投。该轮融资把 Highspot 推入私营软件独角兽行列，并用于支持国际扩张、加速 AI 产品开发、扩大
              GTM 团队。此前轮次包括 Series E（$200M，2021）、Series D（$75M，2019）、Series C（$35M，2018）、Series
              B（$15M，2017），以及更早的种子轮和天使轮。从 Series F（2022 年 1 月）到 Seismic 合并公告（2026 年 2
              月）之间约四年，公司未宣布新融资。期间没有新融资，再叠加合并公告，说明公司要么靠 Series F 资金高效运营，要么在更困难的融资环境中遇到阻力。2022 年那轮 $3.5B
              估值尚未得到官方更新；分析师称合并后的 Seismic-Highspot 实体可能组成估值超过 $6B 的合并公司。
