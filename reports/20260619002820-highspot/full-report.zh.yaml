  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构与核心模块
        blocks:
          - type: paragraph
            body: >-
              Highspot 的产品架构围绕统一数据层——Nexus AI 引擎——搭建。该引擎吸收
              CRM、内容互动、培训活动、会话数据和买方互动信号，产出有上下文感知的推荐和智能体动作。平台分为五个主要模块。Content Hub
              是中心化内容管理和治理层，让营销团队能组织、管理并追踪内容表现，粒度可下钻到幻灯片级别。Sales Plays 提供结构化 playbook
              工作流，用合规、已批准的材料和培训模块引导销售代表穿过复杂销售动作。Digital Rooms 创建个性化买方微站，销售可在其中策展并分享内容、追踪互动，并通过协作体验加速交易周期。Conversation
              Intelligence 捕获、转写并分析客户对话，提取买方行为、异议模式和销售代表表现洞察。Analytics 和 Initiative Scorecards 把所有赋能活动连接到管线和收入结果，为 CMO
              和营收负责人提供基于证据的销售赋能投资归因。Nexus AI 引擎的 Enablement Graph 会关联 CRM 活动和 Highspot 使用数据，浮现下一步最佳行动建议。该架构按集成优先设计，作为现有
              GTM 工具链之上的编排层运行，而不是替代 CRM 或 LMS。Highspot 2026 年产品公告——1 月 Deal Agent、5 月 GTM Agent——代表公司从辅助式 AI（摘要、推荐）转向
              agentic AI（自主任务执行和主动风险缓释）。
