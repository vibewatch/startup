      - number: '5.4'
        title: 信任、合规与安全框架
        blocks:
          - type: paragraph
            body: >-
              Highspot 已建立企业级安全与合规体系，面向金融服务、医疗健康、政府等受监管行业。公司持有 SOC 2 Type II 认证，证明保密性、可用性、处理完整性和隐私相关安全控制经过独立审计。ISO 27001
              认证覆盖信息安全管理体系。ISO 27701 把 ISO 27001 框架扩展到隐私信息管理，是 GDPR 合规的关键差异点。GDPR 合规通过数据驻留选项、DSAR（Data Subject Access
              Request）管理工具和同意管理能力来支撑。公司还称符合 EU AI Act，说明其主动对齐新兴 AI 透明度和风险分级要求——这对欧盟企业销售是重要差异点。Highspot 的 AI
              政策称，客户数据不会用于训练模型；对于担心专有信息泄露进共享 AI 模型的企业，这是关键保证。HYOK（Hold Your Own Key）加密让企业保留对自身数据的加密控制权。基于角色的访问控制、实时审计
              API、基于元数据的内容治理和事件响应流程共同补齐安全框架。highspot.com/product/security/ 的安全页面和 highspot.com/trust/ 的信任页面公开记录了这些认证。
