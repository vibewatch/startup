      - number: '6.2'
        title: 客户增长与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              Highspot 客户数从 2015 年的小型企业客户基础，增长到 2024 年约 300 个大型企业账户；对应 ARR 从 2020 年约 $60M 增至 2024 年约
              $450M。这条曲线很有吸引力，但也显示 2020–2022 年超高速增长期之后明显放缓（当时许多 SaaS 公司受益于数字化转型加速）。COVID 期间 enablement
              平台采用加速——由分布式销售团队突然需要数字优先工具驱动——在 2020–2021 年带来一次非自然抬升，之后已经回归常态。2023 年以后，随着市场成熟，客户增长率很可能降到更可持续的节奏。2023 年裁员使
              Highspot 的 GTM 团队减少约 25%，重组期内会拖慢新客户获取。Highspot 目标规模账户的企业 SaaS 获客周期通常为 6–18 个月，因此 2023 年 GTM 缩减的影响会在 2024
              年客户数和 ARR 增长中体现。2026 年 2 月宣布的 Seismic 合并又增加不确定性：企业买方可能暂停采购决策，等待明确哪一套产品平台会在整合后保留，实际上形成获客逆风。积极面是，Highspot 约
              300 个企业账户的装机基础还有可观扩张空间：每个账户一开始很可能只把 Highspot 部署到其整体销售队伍的一部分，随后向更多业务单元、地域和产品线扩展，推动 NRR 高于 100%。
