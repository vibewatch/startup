      - number: '2.2'
        title: 市场结构与竞争分层
        blocks:
          - type: paragraph
            body: >-
              2025–2026 年，营收赋能平台市场经历了剧烈整合。最关键的两笔合并是：（1）Seismic 与 Highspot 于 2026 年 2 月宣布签署最终合并协议，形成估计合并价值约 $6B
              的实体；（2）Showpad 于 2025 年底在 Vector Capital 旗下与 Bigtincan 合并，形成规模更大的第二梯队竞争者。市场可分三层：（1）大型企业：合并后由
              Seismic+Highspot 主导，在大型企业的内容管理和引导式销售场景中，合计企业市场份额估计为 40–50%；（2）中型市场：由 Showpad+Bigtincan、Mindtickle、Allego
              等竞争，合计份额估计为 15–25%；（3）SMB 和专项场景：由 Outreach、Salesloft、Gong、Spekit、Dock 以及相邻的 CRM 集成工具服务。Mindtickle
              仍是聚焦销售就绪、培训和辅导的领先独立平台，在科技、制药和金融垂直行业尤其强。市场的垂直集中度在消费品、零售、IT / 电信和银行 / 金融服务中最强。按地区看，北美支出领先，EMEA 增长强劲，尤其在
              Showpad 传统强势的制造业和医疗健康垂直行业。过去五年最核心的结构性变化，是从点状解决方案（内容库、LMS 系统）转向统一的营收赋能平台。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
