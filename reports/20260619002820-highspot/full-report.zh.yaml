      - number: '1.2'
        title: 创始人与领导层
        blocks:
          - type: paragraph
            body: >-
              Highspot 由 Robert Wahbe、Oliver Sharp 和 David Wortendyke 于 2012 年共同创立，三人在创办 Highspot 之前都长期任职
              Microsoft。Robert Wahbe 自公司创立起担任 CEO；此前他是 Microsoft Server and Tools Division 的 Corporate Vice
              President，积累了管理企业软件业务单元的深厚经验。Oliver Sharp 在 Highspot 担任 AI SVP，专注公司的 AI 战略和 Nexus 平台；他此前联合创立运行时编译公司
              Colusa，后被 Microsoft 收购。David Wortendyke 担任 CTO 和工程负责人；他曾帮助 Microsoft 将 Windows NT、Visual Studio
              等产品推向市场。三位联合创始人把企业软件产品、商业和 AI 能力集中在一个团队里，这种组合并不常见。创始人之外，2024–2025 年高管团队包括 CFO Chris Larson 和 Chief People
              Officer Amy Johnson。董事会包括主要投资方 D1 Capital、ICONIQ Growth、B Capital Group、Madrona Venture Group、Salesforce
              Ventures、Sapphire Ventures 和 Tiger Global Management 的代表。随着 2026 年 2 月宣布与 Seismic 合并，Robert Wahbe
              预计加入合并实体董事会；该实体将以 Seismic 品牌运营，并由 Seismic CEO Rob Tarkoff 领导。
