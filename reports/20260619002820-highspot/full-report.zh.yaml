      - number: '3.5'
        title: 负面竞争发现
        blocks:
          - type: paragraph
            body: >-
              Highspot 分析中有几项负面竞争因素值得关注。第一，相比 Mindtickle，Highspot
              在销售培训和就绪上的相对弱项已有记录，限制了公司服务优先考虑技能发展的企业。需要最佳培训能力的企业买家往往部署双平台策略（Highspot 负责内容 + Mindtickle
              负责培训），总拥有成本随之上升。第二，Seismic 合并制造客户不确定性：分析师指出，Seismic 历史上相比 Highspot
              净推荐值更低、易用性评分更低，引发外界担心两套平台整合会拖低合并产品的可用性。第三，定价集中度风险：Highspot 平均合同价值高（每个客户约 $1.5M），意味着有限数量客户贡献了大部分收入；合并过渡期若有
              3–5 个企业账户流向竞争对手，影响可能就很实质。第四，AI-native 平台兴起（基于大语言模型、遗留基础设施极少）可能在 2–3 年周期内挑战 Highspot 的在位优势。第五，CRM
              厂商的竞争工具（Salesforce Einstein、Microsoft Copilot for Sales）正把内容管理和辅导功能直接嵌入 CRM
              订阅，可能把核心赋能功能商品化，并降低企业为独立赋能平台付费的意愿。
