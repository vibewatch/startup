  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与画像
        blocks:
          - type: paragraph
            body: >-
              Highspot 的客户群几乎全由大型企业组成，平均合同价值约为每客户 $1.5M。公司瞄准销售团队庞大的组织（通常 200 名以上销售代表）；在这些组织里，统一内容管理、培训和分析带来的 ROI
              最明显。客户覆盖多个垂直行业。金融服务是最大细分之一，包括银行、保险公司、资产管理公司，以及 Charles Schwab、Visa、Aetna 等金融科技公司；销售合规和内容治理要求让 Highspot
              平台在这些场景中特别有价值。技术和软件公司也是重要客群，包括 Amazon、Adobe 以及各类 SaaS 厂商，Highspot 用于赋能大型企业销售团队。制造和工业客户包括 Toyota、General
              Motors，Highspot 可大规模支持分销商和经销商网络培训。Aetna 等医疗健康组织使用 Highspot 做合规驱动的内容治理和培训。专业服务和咨询公司补足客户画像。地域上，Highspot
              客户以北美为主，欧洲存在感正在提升。客户规模通常超过 $1B 年收入，组合中有许多 Fortune 500 公司。公司主要通过直销企业销售，以及 Salesforce、Microsoft 和 Accenture
              类型系统集成商等技术与咨询伙伴网络获客。高 ACV（$1.5M）模式意味着客户数量相对较少、但单体极大的企业客户，而不是广泛的 SMB 或中端市场基础；这让公司在 NRR
              驱动扩张上处于有利位置，但也带来收入集中风险。
