  name: Neko Health
chapter:
  number: 2
  title: Market Analysis
  summary: 'Neko Health sells into the preventive-health screening market: affluent
    consumers and employers buy a premium direct-pay scan to reduce uncertainty, while
    the status quo remains annual physicals, symptom-driven care, and MRI or lab-based
    screening alternatives. The category is large enough to support a long runway,
    but adoption is constrained by false positives, follow-up cascades, reimbursement
    friction, and medical-liability risk.'
sections:
- id: market-boundary
  title: Market boundary and substitutes
  body: 'The relevant market is not general healthcare. It is the overlap of preventive
    screening, longevity services, executive health checks, and private diagnostic
    alternatives that people buy to answer a simple question: am I healthy right now?
    The closest substitutes are annual physicals, lab panels, whole-body MRI, and
    status-quo symptom-driven care. Neko''s pitch is that a single, non-invasive visit
    can reduce uncertainty faster and more pleasantly than those substitutes, but
    it still has to compete against more familiar and often cheaper habits of care.
    The category still leans on consumer psychology as much as medical proof, because
    people buy certainty and convenience together, not one or the other.'
  claimRefs:
  - CM001
  - CM002
  - CM004
  - CM009
  tableRefs:
  - TM001
- id: market-sizing
  title: Sizing lenses and adoption path
  body: Multiple public sources point to a market that is large and growing, but the
    estimates vary depending on whether the lens is all preventive screening, just
    private direct-pay scanning, or a narrower convenience-health cohort. SNS Insider
    coverage cited a $29.7 billion market in 2025 rising to $47.2 billion by 2033,
    while competitor comparisons show why the customer can be affluent and self-pay
    even when insurance does not participate. Neko's realistic early buyers are high-income
    consumers, and later possibly employers or partner channels that want a premium
    health perk.
  claimRefs:
  - CM003
  - CM004
  - CM005
  - CM011
  tableRefs:
  - TM002
  - TM003
  figureRefs:
  - FM001
- id: adoption-constraints
  title: Adoption constraints and diligence gaps
  body: 'The main risk in this market is not lack of demand; it is whether the category
    creates more downstream cost and anxiety than value. Critical commentary on full-body
    scanning repeatedly highlights false positives, unnecessary follow-up, and the
    difficulty of proving long-term population-level benefit. That means the real
    adoption test is not just whether customers sign up once, but whether the service
    can keep producing enough meaningful findings to justify repeat annual spending,
    reimbursement support, or employer sponsorship over time. That is why the market
    can grow even while the evidence base stays contested: premium consumers may pay
    for reassurance before economists or regulators agree on the full value.'
  claimRefs:
  - CM006
  - CM007
  - CM008
  - CM010
  - CM012
