evidenceGaps:
  - type: missing-source
    severity: material
    topic: audited financials
    missingEvidence: No audited revenue, margin, or cash-balance disclosure surfaced in the fetched sources.
    whyItMatters: Those metrics determine whether the valuation is underwritten by operating performance or narrative momentum.
    diligencePath: Obtain statutory accounts or a management update with revenue, margin, and cash burn.
    relatedQuestionRefs:
      - QO008
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: Tracker sources disagree materially on employee count.
    whyItMatters: Headcount is a proxy for organizational scale and cost structure, so the mismatch should not be glossed over.
    diligencePath: Pull a company-authored headcount or a fresh third-party data provider before treating any count as current.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: low
    topic: TO002 leadership coverage
    missingEvidence: The public source set does not expose a full executive org chart or tenure history.
    whyItMatters: The leadership table is intentionally partial and should not be read as a complete management census.
    diligencePath: Request an org chart or current leadership roster from management.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: low
    topic: TO003 investor coverage
    missingEvidence: The public source set names investors but does not disclose exact ownership percentages or governance rights.
    whyItMatters: The investor map is intentionally partial and omits cap-table precision.
    diligencePath: Request the latest cap table and financing terms.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: blocking
    topic: cash and burn
    missingEvidence: No public cash balance, burn rate, or runway data surfaced.
    whyItMatters: Without runway, the company’s need for additional capital and timing risk cannot be judged precisely.
    diligencePath: Request management accounts or a cash-use statement tied to the Series C.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: clinic payback
    missingEvidence: No clinic-level payback or margin breakdown was disclosed.
    whyItMatters: Clinic payback determines whether growth is additive or just expensive expansion.
    diligencePath: Obtain site-level economics from management or a credible operating memo.
    relatedQuestionRefs:
      - QI006
  - type: missing-source
    severity: material
    topic: peer-reviewed validation
    missingEvidence: No peer-reviewed sensitivity/specificity or PPV study surfaced for the core scan.
    whyItMatters: Clinical performance is the biggest technical proof point and it remains opaque.
    diligencePath: Find a published paper, regulator filing, or trial readout for the core scan.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: conversion and payer mix
    missingEvidence: No public conversion funnel, employer contract, or insurer coverage data surfaced.
    whyItMatters: Without the funnel, customer demand cannot be turned into a durable customer-acquisition model.
    diligencePath: Obtain a conversion cohort, an employer contract, or payer evidence.
    relatedQuestionRefs:
      - QU007
  - type: missing-source
    severity: material
    topic: TR001 regulatory / legal risk register
    missingEvidence: No formal published dossier of scan outcomes, false-positive rates, or regulator findings surfaced.
    whyItMatters: Those are the facts that determine whether the clinical downside is manageable or structural.
    diligencePath: Obtain published trial data, PMCF, or regulator correspondence.
    relatedQuestionRefs:
      - QR001
      - QR008
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: precise mark
    missingEvidence: No company-confirmed Series C valuation or secondary trade data surfaced.
    whyItMatters: Without a confirmed mark, even the reported $7B figure should be treated as directional.
    diligencePath: Obtain a company press release with valuation or a credible secondary transaction record.
    relatedQuestionRefs:
      - QV001
      - QV006
