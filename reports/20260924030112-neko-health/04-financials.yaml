  summary: Neko Health has raised over $1.0B across three rounds and now monetizes
    through a premium cash-pay scan, but the public source set still leaves revenue,
    margin, cash burn, and clinic payback under-specified.
sections:
- id: funding
  title: Funding chronology and valuation
  body: Neko’s financing story is unusually fast-moving. The company has raised more
    than a billion dollars across three rounds, and the latest Series C is the event
    that changes the economic conversation because it is both large and valuation-setting.
    The public evidence supports the existence of the round and the broad valuation
    narrative, but not a full company-confirmed mark for the Series C itself. That
    matters because valuation without disclosed earnings is an expectations game.
    The market is pricing the expansion path, the brand, and the perceived category
    winner, not a mature cash flow stream. The evidence base is enough to trace round
    sizes and pricing anchors, but not enough to reconstruct audited unit economics.
    The evidence base is enough to trace round sizes and pricing anchors, but not
    enough to reconstruct audited unit economics.
  claimRefs:
  - CI001
  - CI002
  - CI003
  tableRefs:
  - TI001
  - TI002
  figureRefs: []
- id: monetization
  title: Monetization and cost structure
  body: 'The present model is straightforward: consumers pay per scan, repeat annually
    if they like the result, and receive a clinician review as part of the bundle.
    The problem is that the unit economics are not fully visible. Each clinic requires
    real estate, devices, and staff, and the company has not published a clinic margin
    or payback calculation. That makes it hard to tell whether the business is a premium
    service business with healthy returns or a growth story that simply consumes capital
    to buy time. The evidence supports a premium product with strong demand signals;
    it does not yet prove a self-funding clinic network.'
  claimRefs:
  - CI004
  - CI005
  - CI006
  tableRefs:
  - TI003
  figureRefs: []
- id: capital-adequacy
  title: Capital adequacy and forward needs
  body: The Series C gives Neko a large runway to build out its U.S. plan, but the
    source set does not tell us how much cash the company had before the round or
    how quickly it burns through that capital. That means the real question is not
    whether the company can continue operating, but whether it can open enough clinics
    and preserve service quality before the next financing decision. In other words,
    the raise buys option value. It does not yet prove that the unit economics are
    good enough to make the model independent of future capital. That still leaves
    clinic economics and burn discipline as the real underwriting bottlenecks. Those
    assumptions are directional only, not yet audited.
  claimRefs:
  - CI007
  - CI008
  - CI009
  tableRefs: []
  figureRefs:
  - FI001
