chapter:
  number: 6
  title: Customers
  summary: Neko Health’s customers are affluent self-pay consumers who want preventive reassurance, repeatable annual
    checkups, and a better explanation of their health. The evidence set shows strong early demand and retention,
    but not yet broad payer diversity or enterprise-scale customer proof.
sections:
- id: who-pays
  title: Who pays and why
  body: Neko’s current customer is the affluent self-paying consumer. That customer is buying reassurance, a baseline
    health picture, and a polished preventive experience. The important thing is that the buyer, user, and payer
    are usually the same person right now. That keeps the model simple, but it also caps the audience to people
    who can afford repeated annual screening. The evidence suggests the company is winning with this segment because
    it is clear, high-intent, and emotionally resonant. The model becomes much harder if the company tries to broaden
    to lower-income households or wait for insurers to carry the bill. The customer story therefore hinges on whether
    the waitlist converts into repeatable visits rather than one-time publicity. The customer story therefore hinges
    on whether the waitlist converts into repeatable visits rather than one-time publicity.
  claimRefs:
  - CU001
  - CU006
  - CU009
  tableRefs:
  - TU001
  - TU002
  figureRefs: []
- id: proof-and-durability
  title: Adoption proof and durability
  body: The adoption data are strong enough to say the product has real pull. More than 100,000 scans and a 75%
    rebooking rate are not trivial numbers, especially for a physical clinic service. Those metrics tell us that
    customers are not just curious; many come back. Still, the proof is mostly about enthusiasm and repeated habit,
    not yet about broader market conversion or enterprise distribution. The exact funnel is opaque, the payer mix
    is narrow, and the public evidence does not show a large employer or insurer channel. So the customer thesis
    is real, but it is still concentrated in a premium niche. Strong repeat behavior is encouraging, but the public
    evidence still stops short of a full renewal or cohort analysis.
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU008
  - CU011
  tableRefs:
  - TU003
  figureRefs: []
- id: expansion-risks
  title: Expansion and concentration risk
  body: The geographic story is encouraging and dangerous at the same time. Neko has moved from Stockholm into the
    U.K. and is now preparing a New York launch, which shows the experience can travel. But the current customer
    base is still concentrated in a small number of urban pockets, and the source set does not show evidence of
    payer diversification. That means the customer story is not yet a broad healthcare channel story. It is a premium
    urban consumer story with strong repeat behavior. The next diligence question is whether that story can be duplicated
    city by city without losing conversion or raising support costs too sharply. The open question is whether that
    premium story can widen without compressing conversion or lifting support costs too sharply.
  claimRefs:
  - CU005
  - CU007
  - CU010
  - CU012
  tableRefs: []
  figureRefs:
  - FU001
