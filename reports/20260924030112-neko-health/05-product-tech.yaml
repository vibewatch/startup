chapter:
  number: 5
  title: Product & Technology
  summary: Neko Health delivers a one-hour, non-invasive scan that blends sensors, bloodwork, and clinician review.
    The product is differentiated by vertical integration and repeated measurements, but the evidence set still
    lacks peer-reviewed performance data and a clean regulatory narrative.
sections:
- id: experience
  title: What the product is
  body: Neko’s product is a one-hour preventive-health visit, not a software dashboard. The customer pays for a
    scan, bloodwork, and a clinician conversation that turns measurements into a health summary and follow-up plan.
    The experience is deliberately designed to feel reassuring rather than medical-argon heavy. That is important
    because the company is selling repeat behavior. If the first visit feels confusing or scary, the annual model
    weakens. If it feels easy, legible, and useful, the product can become a habit. The public evidence strongly
    supports the consumer-facing workflow; it does not yet prove that the clinical signal is enough to justify broad
    medical adoption. The public evidence also suggests an operationally complex stack rather than a simple consumer
    gadget, which matters because any technical moat depends on reproducibility, quality control, and follow-through.
    The public evidence also suggests an operationally complex stack rather than a simple consumer gadget, which
    matters because any technical moat depends on reproducibility, quality control, and follow-through.
  claimRefs:
  - CE001
  - CE002
  - CE009
  tableRefs:
  - TE001
  - TE002
  figureRefs: []
- id: architecture
  title: How it works and what changed
  body: 'The source set describes a vertically integrated stack: proprietary sensors, blood analysis, clinician
    review, and an internal software layer that now includes wearables and body composition. The recent device refresh
    suggests the product is still improving, which is good news for customers but also a reminder that this is an
    evolving system rather than a frozen platform. The key technical claim is not just that the scan exists, but
    that repeat measurements can create a better longitudinal model over time. That claim is plausible and important.
    It is also the one most dependent on data quality and clinical rigor. That long-lived stack matters because
    longitudinal measurement is only useful if the data plumbing stays stable.'
  claimRefs:
  - CE003
  - CE004
  - CE006
  - CE007
  tableRefs:
  - TE003
  figureRefs: []
- id: trust-and-gaps
  title: Trust, safety, and validation gaps
  body: The current evidence set is strongest on workflow and weakest on validation. Hiring pages show a real operational
    stack, but they do not substitute for a published performance paper or a regulator-approved claims package.
    That gap matters because a preventive scan can create follow-up burden as easily as it creates value. The right
    diligence question is therefore not whether the product is polished. It is whether the product can be trusted
    to find meaningful issues without producing too many noisy referrals or compliance surprises. On the material
    we reviewed, the answer is still partially open. That gap matters because preventive screening only compounds
    value if the underlying measurement stack remains trustworthy over repeated annual visits.
  claimRefs:
  - CE005
  - CE008
  - CE010
  - CE011
  - CE012
  tableRefs: []
  figureRefs:
  - FE001
