      - number: '1.3'
        title: Leadership, governance, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The leadership story is straightforward enough to help the company sell the category. Daniel Ek brings
              founder fame and category credibility, while Hjalmar Nilsonne is the operating face of the business. The
              cap table now includes a mix of institutional venture backers and celebrity investors, which helps with
              distribution and publicity but does not substitute for operating evidence. The real diligence gap is still
