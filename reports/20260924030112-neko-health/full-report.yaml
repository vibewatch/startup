  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Clinical and reimbursement risk
        blocks:
          - type: paragraph
            body: >-
              The biggest risk is not that the product exists; it is that the product finds too much that does not
              matter. False positives and follow-up cascades are the canonical critique of full-body scanning, and the
              source set repeats that criticism from multiple angles. The reimbursement issue compounds the problem. If
              customers pay out of pocket, the market stays premium and limited. If a payer never enters the model,
              growth stays tied to discretionary spend. That combination can still support a strong business, but it
              also means the company’s downside is not just product failure. It is category refusal at scale. Taken
              together, these risks matter less as abstract downside labels than as direct drivers of slower bookings,
              thinner margins, and harder valuation support. Taken together, these risks matter less as abstract
              downside labels than as direct drivers of slower bookings, thinner margins, and harder valuation support.
              The central diligence test is whether those warnings are manageable or structural.
