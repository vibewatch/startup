  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who pays and why
        blocks:
          - type: paragraph
            body: >-
              Neko’s current customer is the affluent self-paying consumer. That customer is buying reassurance, a
              baseline health picture, and a polished preventive experience. The important thing is that the buyer,
              user, and payer are usually the same person right now. That keeps the model simple, but it also caps the
              audience to people who can afford repeated annual screening. The evidence suggests the company is winning
              with this segment because it is clear, high-intent, and emotionally resonant. The model becomes much
              harder if the company tries to broaden to lower-income households or wait for insurers to carry the bill.
              The customer story therefore hinges on whether the waitlist converts into repeatable visits rather than
              one-time publicity. The customer story therefore hinges on whether the waitlist converts into repeatable
