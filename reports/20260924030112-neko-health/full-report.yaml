        title: Capital, staffing, and rollout risk
        blocks:
          - type: paragraph
            body: >-
              Neko’s clinic model is expensive to grow. Every new site needs real estate, hardware, clinicians, and a
              well-managed follow-up path. The hiring footprint shows a real operating company, but it also shows how
              many systems have to work at once. That makes execution risk very real. The company can certainly spend
              the Series C on growth, but spending alone does not prove attractive economics. If productivity or
              conversion disappoints in any key city, the valuation story compresses quickly. In other words, growth is
              not the same thing as scalability.
