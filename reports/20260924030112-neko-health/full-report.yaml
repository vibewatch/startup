      - number: '2.3'
        title: Adoption constraints and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The main risk in this market is not lack of demand; it is whether the category creates more downstream
              cost and anxiety than value. Critical commentary on full-body scanning repeatedly highlights false
              positives, unnecessary follow-up, and the difficulty of proving long-term population-level benefit. That
              means the real adoption test is not just whether customers sign up once, but whether the service can keep
              producing enough meaningful findings to justify repeat annual spending, reimbursement support, or employer
              sponsorship over time. That is why the market can grow even while the evidence base stays contested:
              premium consumers may pay for reassurance before economists or regulators agree on the full value.
            claimRefs:
              - CM006
              - CM007
              - CM008
