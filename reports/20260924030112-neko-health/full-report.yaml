      - number: '3.2'
        title: Positioning, pricing, and moat
        blocks:
          - type: paragraph
            body: >-
              Neko's price point is far below premium MRI alternatives, but the real moat may be the integrated
              experience rather than the scanner alone. The company owns the hardware, software, and clinic workflow,
              which makes the service harder to copy than a single imaging test. Still, lower switching costs and
              multi-homing mean consumers can try more than one preventive service, especially when the alternatives are
              also marketed as premium self-care. That makes distribution, partner access, and repeat-visit habit
              formation central to the moat question.
            claimRefs:
              - CP005
