  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not general healthcare. It is the overlap of preventive screening, longevity
              services, executive health checks, and private diagnostic alternatives that people buy to answer a simple
              question: am I healthy right now? The closest substitutes are annual physicals, lab panels, whole-body
              MRI, and status-quo symptom-driven care. Neko's pitch is that a single, non-invasive visit can reduce
              uncertainty faster and more pleasantly than those substitutes, but it still has to compete against more
              familiar and often cheaper habits of care. The category still leans on consumer psychology as much as
              medical proof, because people buy certainty and convenience together, not one or the other.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
      - number: '2.2'
        title: Sizing lenses and adoption path
        blocks:
          - type: paragraph
            body: >-
              Multiple public sources point to a market that is large and growing, but the estimates vary depending on
              whether the lens is all preventive screening, just private direct-pay scanning, or a narrower
              convenience-health cohort. SNS Insider coverage cited a $29.7 billion market in 2025 rising to $47.2
              billion by 2033, while competitor comparisons show why the customer can be affluent and self-pay even when
              insurance does not participate. Neko's realistic early buyers are high-income consumers, and later
              possibly employers or partner channels that want a premium health perk.
            claimRefs:
              - CM003
