      - number: '8.3'
        title: Recommended stance
        blocks:
          - type: paragraph
            body: >-
              The correct stance on the public evidence is not blind enthusiasm and not outright dismissal. It is to
              recognize that Neko is still in the option-value phase of the story. The company has real demand, real
              capital, and a real expansion plan. It does not yet have the audited financial detail, precision valuation
              data, or clinic economics that would let an investor call the mark reasonable on fundamentals alone. So
              the valuation should be treated as expensive and execution-sensitive, with upside still available if the
              U.S. rollout proves the model can scale without breaking the customer experience. The right stance is to
              underwrite upside only if the public evidence catches up to the price, not before. The point is not
              perfection; it is whether the public evidence can justify the current price with enough margin of safety.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV010
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV008
              - CV012
