              The evidence set is reassuring in one narrow sense: there is no obvious major litigation or enforcement
              event surfaced here. But that does not solve the proof problem. The company still lacks a public outcomes
              dossier, a regulator-facing evidence package, or a clear payer path. The risk is therefore less about a
              single catastrophic event and more about accumulated uncertainty. Until the company shows outcomes,
              privacy controls, and controlled follow-up economics, investors should treat the story as attractive but
              incomplete. The practical question is whether repeated screening can stay attractive if follow-up burden,
