  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape
        blocks:
          - type: paragraph
            body: >-
              The competitive set is broader than the company sometimes implies. Direct peers include MRI-based
              preventive screening providers such as Prenuvo and Ezra/Function Health, but the real comparison set also
              includes large imaging groups, lab-first membership products, and ordinary health-check pathways that
              already sit in the consumer's budget. Neko's launch into the United States matters because that is where
              the most scaled competitors already operate, and where the company will have to prove that its one-hour
              ritual is distinctive enough to overcome inertia and existing trust. The category also includes adjacent
              services like medical checkup bundles and longevity memberships, so the competitive boundary is fuzzy and
              can widen quickly as customers compare alternatives.
