      - number: '3.3'
        title: Threats and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The most relevant threats are not just other startups; they are scaled imaging and laboratory franchises
              that can bundle preventive services into existing operations. Neko may have the better consumer ritual,
              but competitors with payer relationships, referral channels, or larger installed bases can still win if
              they move quickly enough. The open diligence question is whether a premium, cash-pay product can defend
              itself once the market matures and consumers learn that many of the same health questions can be answered
              by cheaper or reimbursed alternatives. In practice, the biggest question is whether Neko can keep
              attracting repeat buyers once competitor brands, referrals, and reimbursement-supported pathways become
              more familiar to consumers.
