        title: What the market is paying for
        blocks:
          - type: paragraph
            body: >-
              The market is paying for a future category winner, not a mature clinic chain. The best-supported mark is a
              reported figure near $7 billion, but the company has not publicly confirmed that exact price in the source
              set we reviewed. The point is not that the number is fake; it is that it is directional. Investors are
              pricing brand, expansion, and repeat behavior. That can be rational in a category with large upside. It
              also means the valuation is fragile if the U.S. rollout stumbles or if repeat annual usage fades after the
              novelty wears off. The valuation view is therefore a judgment about how much of the current premium is
