        title: Adoption proof and durability
        blocks:
          - type: paragraph
            body: >-
              The adoption data are strong enough to say the product has real pull. More than 100,000 scans and a 75%
              rebooking rate are not trivial numbers, especially for a physical clinic service. Those metrics tell us
              that customers are not just curious; many come back. Still, the proof is mostly about enthusiasm and
              repeated habit, not yet about broader market conversion or enterprise distribution. The exact funnel is
              opaque, the payer mix is narrow, and the public evidence does not show a large employer or insurer
              channel. So the customer thesis is real, but it is still concentrated in a premium niche. Strong repeat
              behavior is encouraging, but the public evidence still stops short of a full renewal or cohort analysis.
