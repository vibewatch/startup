  - id: FE001
    title: End-to-End Scan Flow
    type: stack
    layout: standard
    summary: >-
      The product narrative progresses from scan capture to clinical review, but validation evidence is still lighter
      than the commercial story.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE006
      - CE011
    data:
      layers:
        - label: Consumer workflow
          detail: 60-minute preventive scan, bloodwork, and same-visit clinician review for the customer experience
        - label: Sensor and lab stack
          detail: Proprietary sensors, blood analysis, and measurement capture that create the raw diagnostic data
        - label: Wearables and body composition
          detail: Longitudinal context and broader health signals added to the scan experience
        - label: Clinical review and follow-up
          detail: Human clinician interpretation, routing, and escalation of meaningful findings
        - label: Operations and compliance
          detail: Data handling, HRIS/workflow integrations, privacy controls, and quality checks
        - label: Governance and data controls
          detail: Privacy, compliance, and quality controls that keep the clinic workflow repeatable and trustable
  - id: FU001
    title: Customer Journey Funnel
    type: journey-map
    layout: standard
    summary: >-
      The customer path starts with brand awareness and ends with repeat visits or referrals, but conversion quality
      remains the key unknown.
    data:
      items:
        - id: awareness
          label: Affluent consumer awareness
          actor: Consumer
          description: The buyer learns about preventive screening through founder brand, media coverage, and waitlist publicity.
          channels:
            - TechCrunch
            - FT
            - Official site
        - id: booking
          label: Book first scan
          actor: Buyer=user=payer
          description: The user books a one-time scan to get reassurance and a baseline health picture.
          channels:
            - Official site
            - Press coverage
            - Referral
        - id: visit
          label: Complete scan and review
          actor: Clinic and clinician
          description: The one-hour clinic experience combines sensors, bloodwork, and clinician explanation.
          channels:
            - Official site
            - Case study
            - Customer commentary
        - id: repeat
          label: Rebook annually
          actor: Consumer
          description: Repeat booking is the key durability signal because the product only compounds if the habit sticks.
          channels:
            - Official site
            - Media follow-up
            - Waitlist proof
        - id: expand
          label: Expand by city or channel
          actor: Operations and partnerships
          description: The company widens from initial urban pockets toward more cities or potential employer/partner channels.
          channels:
            - New York launch
            - Dealroom
            - LinkedIn case study
        - id: partner
          label: Partner / employer channel
          actor: Business development
          description: If repeat demand holds, the company can test broader distribution through employers or partner-led access.
          channels:
            - Official site
            - B2B partnerships
            - Customer referrals
    claimRefs:
