chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Neko Health is best understood as a premium preventive-health clinic network, not a software company. The
              company’s public story combines founder credibility, a simple consumer pitch, and a deliberately
              high-touch clinic experience. That combination matters because the investment case depends on whether a
              repeatable medical service can behave more like a consumer subscription than a one-off procedure. The
              company’s current footprint in Sweden and the U.K., along with the planned SoHo opening in New York, shows
              that the model has outgrown its original pilot stage. The unanswered question is not whether the brand can
              attract attention, but whether the operational system behind it can scale without destroying economics or
              clinical credibility.
            claimRefs:
              - CO001
              - CO002
              - CO009
