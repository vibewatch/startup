      - number: '1.2'
        title: Funding, valuation, and scale signals
        blocks:
          - type: paragraph
            body: >-
              The funding history is unusually aggressive for a company with limited public financial disclosure. The
              Series A and B are now historical, but the $700 million Series C is the key current event because it
              anchors the company’s public valuation narrative, its expansion plan, and its investor roster. Media and
              tracker sources converge on a valuation near $7 billion, but the company did not publicly confirm that
              figure in the source set we reviewed. That distinction is important: the round itself is real capital, yet
              the exact mark is still a reported number rather than a fully company-owned disclosure. The scale signals
              are also real. More than 100,000 scans and 350,000+ registrations imply meaningful demand, but they do not
              yet answer the harder question of conversion economics.
