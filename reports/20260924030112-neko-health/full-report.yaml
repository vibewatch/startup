        title: Expansion and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The geographic story is encouraging and dangerous at the same time. Neko has moved from Stockholm into the
              U.K. and is now preparing a New York launch, which shows the experience can travel. But the current
              customer base is still concentrated in a small number of urban pockets, and the source set does not show
              evidence of payer diversification. That means the customer story is not yet a broad healthcare channel
              story. It is a premium urban consumer story with strong repeat behavior. The next diligence question is
              whether that story can be duplicated city by city without losing conversion or raising support costs too
