  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What the product is
        blocks:
          - type: paragraph
            body: >-
              Neko’s product is a one-hour preventive-health visit, not a software dashboard. The customer pays for a
              scan, bloodwork, and a clinician conversation that turns measurements into a health summary and follow-up
              plan. The experience is deliberately designed to feel reassuring rather than medical-argon heavy. That is
              important because the company is selling repeat behavior. If the first visit feels confusing or scary, the
              annual model weakens. If it feels easy, legible, and useful, the product can become a habit. The public
              evidence strongly supports the consumer-facing workflow; it does not yet prove that the clinical signal is
              enough to justify broad medical adoption. The public evidence also suggests an operationally complex stack
              rather than a simple consumer gadget, which matters because any technical moat depends on reproducibility,
              quality control, and follow-through. The public evidence also suggests an operationally complex stack
