chapter:
  number: 7
  title: Risks
  summary: Neko Health’s biggest risks are clinical overdiagnosis, follow-up burden, capital intensity, and valuation
    compression if the business cannot prove better economics at scale. The source set gives several adverse warnings,
    but it still does not show a major formal regulatory or litigation event.
sections:
- id: clinical
  title: Clinical and reimbursement risk
  body: The biggest risk is not that the product exists; it is that the product finds too much that does not matter.
    False positives and follow-up cascades are the canonical critique of full-body scanning, and the source set
    repeats that criticism from multiple angles. The reimbursement issue compounds the problem. If customers pay
    out of pocket, the market stays premium and limited. If a payer never enters the model, growth stays tied to
    discretionary spend. That combination can still support a strong business, but it also means the company’s downside
    is not just product failure. It is category refusal at scale. Taken together, these risks matter less as abstract
    downside labels than as direct drivers of slower bookings, thinner margins, and harder valuation support. Taken
    together, these risks matter less as abstract downside labels than as direct drivers of slower bookings, thinner
    margins, and harder valuation support. The central diligence test is whether those warnings are manageable or
    structural.
  claimRefs:
  - CR001
  - CR002
  - CR012
  tableRefs:
  - TR001
  - TR002
  figureRefs: []
- id: execution
  title: Capital, staffing, and rollout risk
  body: Neko’s clinic model is expensive to grow. Every new site needs real estate, hardware, clinicians, and a
    well-managed follow-up path. The hiring footprint shows a real operating company, but it also shows how many
    systems have to work at once. That makes execution risk very real. The company can certainly spend the Series
    C on growth, but spending alone does not prove attractive economics. If productivity or conversion disappoints
    in any key city, the valuation story compresses quickly. In other words, growth is not the same thing as scalability.
  claimRefs:
  - CR003
  - CR007
  - CR009
  - CR010
  tableRefs:
  - TR003
  figureRefs: []
- id: data-and-oversight
  title: Data, regulation, and proof gaps
  body: 'The evidence set is reassuring in one narrow sense: there is no obvious major litigation or enforcement
    event surfaced here. But that does not solve the proof problem. The company still lacks a public outcomes dossier,
    a regulator-facing evidence package, or a clear payer path. The risk is therefore less about a single catastrophic
    event and more about accumulated uncertainty. Until the company shows outcomes, privacy controls, and controlled
    follow-up economics, investors should treat the story as attractive but incomplete. The practical question is
    whether repeated screening can stay attractive if follow-up burden, regulation, or pricing pressure rise together.
    The follow-up question is whether the model scales faster than its downside externalities.'
  claimRefs:
  - CR004
  - CR005
  - CR006
  - CR008
  - CR011
  tableRefs: []
  figureRefs:
  - FR001
