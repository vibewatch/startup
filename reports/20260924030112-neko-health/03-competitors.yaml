company:
  name: Neko Health
chapter:
  number: 3
  title: Competitors
  summary: Neko Health competes in a crowded preventive-screening market where whole-body
    MRI providers, blood-biomarker memberships, imaging chains, and ordinary primary-care
    pathways all substitute for the same consumer dollars. The company's strongest
    differentiation is its vertically integrated clinic experience and lower sticker
    price, but U.S. incumbents already have scale, trust, and distribution advantages.
sections:
- id: landscape
  title: Competitive landscape
  body: The competitive set is broader than the company sometimes implies. Direct
    peers include MRI-based preventive screening providers such as Prenuvo and Ezra/Function
    Health, but the real comparison set also includes large imaging groups, lab-first
    membership products, and ordinary health-check pathways that already sit in the
    consumer's budget. Neko's launch into the United States matters because that is
    where the most scaled competitors already operate, and where the company will
    have to prove that its one-hour ritual is distinctive enough to overcome inertia
    and existing trust. The category also includes adjacent services like medical
    checkup bundles and longevity memberships, so the competitive boundary is fuzzy
    and can widen quickly as customers compare alternatives.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  tableRefs:
  - TP001
  - TP002
- id: positioning
  title: Positioning, pricing, and moat
  body: Neko's price point is far below premium MRI alternatives, but the real moat
    may be the integrated experience rather than the scanner alone. The company owns
    the hardware, software, and clinic workflow, which makes the service harder to
    copy than a single imaging test. Still, lower switching costs and multi-homing
    mean consumers can try more than one preventive service, especially when the alternatives
    are also marketed as premium self-care. That makes distribution, partner access,
    and repeat-visit habit formation central to the moat question.
  claimRefs:
  - CP005
  - CP006
  - CP007
  - CP009
  - CP010
  tableRefs:
  - TP003
  figureRefs:
  - FP001
- id: threats-and-gaps
  title: Threats and diligence gaps
  body: The most relevant threats are not just other startups; they are scaled imaging
    and laboratory franchises that can bundle preventive services into existing operations.
    Neko may have the better consumer ritual, but competitors with payer relationships,
    referral channels, or larger installed bases can still win if they move quickly
    enough. The open diligence question is whether a premium, cash-pay product can
    defend itself once the market matures and consumers learn that many of the same
    health questions can be answered by cheaper or reimbursed alternatives. In practice,
    the biggest question is whether Neko can keep attracting repeat buyers once competitor
    brands, referrals, and reimbursement-supported pathways become more familiar to
    consumers.
  claimRefs:
  - CP008
  - CP011
  - CP012
