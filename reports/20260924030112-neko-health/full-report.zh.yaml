              - CU008
              - CU012
  - number: 7
    title: 风险考量
    sections:
      - number: '7.1'
        title: 临床与医保报销风险
        blocks:
          - type: paragraph
            body: >-
              最严峻的风险并不在于产品本身能否运转，而在于其筛查出的无关紧要杂音过多。假阳性以及由此引发的层层过度医疗，历来是全身体检领域最核心的批判靶点，手头资料也从多个视角反复印证了这一顾虑。医保报销通道的闭塞更是雪上加霜。若完全依赖个人自费，市场空间只能锁死在高端窄众；若商业或官方买单方迟迟不入局，业绩天花板就始终受制于非刚需的可选消费支出。这一组合或许足以支撑一门小而美的好生意，但也使得其潜在下行风险远非产品研发受挫那么简单，而是面临整个品类在规模扩张时遭遇主流医疗体系排斥的危机。综合来看，这些风险并非空泛的下行标签，而是会直接拖累预约增速、压缩利润空间并动摇高估值基础。综合来看，这些风险并非空泛的下行标签，而是会直接拖累预约增速、压缩利润空间并动摇高估值基础。尽调的核心试金石，在于这些临床警示究竟是运营中可化解的摩擦，还是商业模式无法逾越的硬伤。
            claimRefs:
              - CR001
              - CR002
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
      - number: '7.2'
        title: 资金消耗、医护人力与开店落地风险
        blocks:
          - type: paragraph
            body: >-
              Neko
              的线下门诊模式属于重资金投入型扩张。每增设一个网点，都需要锁定黄金地段物业、采购专用硬件、配置临床医护团队并建立严密的随访体系。从其招聘规模来看，这无疑是一家脚踏实地的重运营公司，但也暴露出其底层多个环节必须高度协同运转的脆弱性。这导致履约交付风险极为现实。公司固然能把
              C 轮融来的巨额资金投入规模扩张，但单纯的砸钱并不等同于跑通了优秀的单店盈利模型。一旦在任何关键城市的单店坪效或转化率不及预期，原先的估值故事就会迅速缩水。换句话说，砸钱铺规模并不等同于业务具备自发的可扩展性。
            claimRefs:
              - CR003
              - CR007
              - CR009
              - CR010
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
      - number: '7.3'
        title: 数据安全、合规监管与循证缺口
        blocks:
          - type: paragraph
            body: >-
              从一个极为狭窄的切面来看，现有证据尚算让人宽慰：公开资料中并未出现重大诉讼或监管处罚记录。然而，这并未从根本上解决循证依据匮乏的硬伤。公司至今拿不出公开的长期健康转归数据报告，缺少面向监管部门的扎实临床有效性证据材料，更无明朗的买单方接入方案。因此，眼下的潜在风险不在于遭遇单一突发性灾难打击，而在于不确定性的层层累积。在公司公开亮出确切的临床转归表现、严密的隐私控制架构以及可控的随访医疗成本前，投资人理应将其视为一个诱人却残缺的故事。现实的问题在于：倘若随访诊疗负担、合规监管门槛以及竞品价格战同时加剧，定期复查的体检模式能否维持现有的吸引力？随之而来的深层追问则是：该商业模式的扩张速度，能否跑赢其伴生的负外部性？
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR008
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
