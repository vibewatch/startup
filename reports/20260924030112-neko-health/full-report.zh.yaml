              - CE006
              - CE011
  - number: 6
    title: 客户与用户画像
    sections:
      - number: '6.1'
        title: 付费人群画像与买单动机
        blocks:
          - type: paragraph
            body: >-
              Neko
              目前的核心客群高度聚焦于高净值自费消费者。该群体付费主要是为了买个安心、获取基线健康数据，以及体验设计精良的高端预防体检。关键在于，当前阶段的购买决策者、使用者与买单人高度三合一。这使得商业逻辑极为纯粹，但也直接把目标受众限定在有能力承担长期年度自费体检的窄众人群内。现有证据印证，公司之所以能打动该客群，在于其定位清晰、用户意图明确且能引发强烈的情感共鸣。一旦公司试图向更广泛的中低收入家庭渗透，或坐等商业医保接盘买单，其扩张难度将陡增。因此，整个客群故事的成立，取决于庞大的候补排队名单能否沉淀为可持续的年度复购，而非止步于一次性尝鲜式围观。因此，整个客群故事的成立，取决于庞大的候补排队名单能否沉淀为可持续的年度复购，而非止步于一次性尝鲜式围观。
            claimRefs:
              - CU001
              - CU006
              - CU009
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
      - number: '6.2'
        title: 市场采纳证据与黏性留存
        blocks:
          - type: paragraph
            body: >-
              各项采纳数据足以说明该产品具备强大的用户自发吸引力。超过 100,000 次体检与 75%
              的复订率绝非小数目，放在重资产运营的线下医疗门诊语境下更是难能可贵。这些核心指标印证了消费者不仅出于猎奇心态，多数人确实完成了复购。然而，这些证据更多体现的是核心种子用户的热情与留存习惯，尚未上升到全人群泛化渗透或企业端集采分销的层面。其具体的转化漏斗并不透明，付费结构单一，公开资料中也未见大型雇主或商业保险机构的大单采购。这套客户逻辑虽已成立，但目前依然深陷于高端小众生态之中。强劲的复购表现固然令人鼓舞，但公开数据尚不足以支撑起完整规范的同周期留存或队列分析。
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU008
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
      - number: '6.3'
        title: 区域扩张与客群集中度风险
        blocks:
          - type: paragraph
            body: >-
              其跨区域扩张的故事既振奋人心，又潜藏隐忧。Neko
              已从斯德哥尔摩跨国落地英国，眼下正筹备进军纽约，这证明其门店服务体验具备跨地域复制能力。但目前的客群仍高度局限在少数核心一二线都市圈，资料中亦未见买单方多元化的迹象。换言之，其客户定位尚未升级为广谱医疗渠道逻辑，骨子里依然是一套带有强复购属性的高端都市消费故事。接下来的尽调重点在于：这种打法能否在不同城市逐一复制，且不至于稀释转化率或导致后台支持成本剧烈失控。待解的核心疑问，正是这套高端故事在向外扩张时，能否避免转化率被动压缩、服务支持成本过快攀升。
            claimRefs:
              - CU005
              - CU007
              - CU010
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
