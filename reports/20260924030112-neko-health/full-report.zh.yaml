  - number: 8
    title: 估值考量
    sections:
      - number: '8.1'
        title: 市场的溢价逻辑
        blocks:
          - type: paragraph
            body: >-
              二级市场与一级资方为之买单的，是一个未来的品类垄断者，而非一家成熟的连锁门诊。目前最受普遍引述的估值标杆是媒体报道的约 $7
              billion，但在我们梳理的资料中，官方并未正式出面确认这一具体数字。核心问题不在于这一数字虚幻与否，而在于它只具有方向性参考意义。投资人定价的是品牌势能、开店扩张预期以及用户的复购习惯。在一个潜在天花板极高的赛道里，这种定价有其合理逻辑；但这同样导致该估值体系极为脆弱，一旦美国开店遇阻，或在尝鲜热度消退后年度复购下滑，高估值就会面临剧烈重构。因此，评估其估值，本质上是在权衡当前的溢价中究竟有多少源自扎实的数据支撑，又有多少纯粹由宏大叙事所推升。评估其估值，本质上是在权衡当前的溢价中究竟有多少源自扎实的数据支撑，又有多少纯粹由宏大叙事所推升。
            claimRefs:
              - CV001
              - CV003
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
      - number: '8.2'
        title: 财务测算的深层推论
        blocks:
          - type: paragraph
            body: >-
              即便套用公开口径中最乐观的粗略营收预估，其隐含的估值倍数依然处于高位。这并不直接代表它是一笔糟糕的投资，但确实要求未来的执行兑现必须严丝合缝。其乐观前景十分明了：成功批量复制门诊、维持高水准用户留存，并顺势将品牌打造成体量庞大的预防性健康医疗网络。下行悲观场景同样清晰：公司长期偏安于高端小众窄众市场，虽有稳定客流，却缺乏足够的商业厚度来支撑头部成长股的估值倍数。当前的客观证据既无法完全验证乐观设想，亦不能径直推导至悲观结局，正因如此，最理性的研判是将该估值定性为「昂贵，但非全无可能」。
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
      - number: '8.3'
        title: 研判建议与投资立场
        blocks:
          - type: paragraph
            body: >-
              基于公开证据链，最务实的投资态度既非盲目追捧，亦非全盘否定，而是看清 Neko
              当下仍处于「期权价值」定价阶段。公司坐拥真实的排队需求、雄厚的资本弹药以及明确的跨国扩张蓝图；但它尚未公开经审计的财务明细、精准确切的估值数据或扎实的单店经济模型，无法单凭基本面数据让投资人认可当前定价的合理性。因此，当下估值在定性上属于高位偏贵，且对后续落地执行极度敏感；若赴美扩张能证明该模式在规模化拓展中不稀释服务体验，其向上天花板依然值得期待。合理的立场是：仅在公开证据足以匹配甚至超越估值要求时，才对其上行空间进行承销，切忌本末倒置。重点不在于苛求完美无缺，而在于公开可查的客观事实能否为当前的昂贵估值提供足够的安全边际。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV010
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV008
              - CV012
