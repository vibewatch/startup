      - number: '3.3'
        title: 潜在威胁与尽调盲区
        blocks:
          - type: paragraph
            body: >-
              最严峻的威胁不仅来自其他初创团队，更源自具备规模优势的连锁影像中心与大型独立实验室，后者完全有能力将预防筛查打包进现有的业务网点中。Neko 或许在 C
              端体验仪式感上更胜一筹，但若老牌玩家动作够快，凭借既有的医保协作网络、成熟的转诊渠道以及庞大的设备装机量，同样可能后来居上。悬而未决的尽调课题在于：随着市场逐步成熟，当消费者意识到大量类似的健康疑问完全可以靠更便宜或可报销的常规渠道解决时，一款主打自费的高端消费级产品能否守住基本盘？落到实际运营中，核心就在于一旦竞品品牌认知铺开、转诊体系和医保支持路径更为普及，Neko
              能否持续维系用户的年度复购。
            claimRefs:
              - CP008
              - CP011
              - CP012
  - number: 4
    title: 财务分析
    sections:
      - number: '4.1'
        title: 融资脉络与估值考量
        blocks:
          - type: paragraph
            body: >-
              Neko 的资本运作节奏快得异乎寻常。三轮融资累计吸纳逾十亿美元，其中最新的 C 轮融资堪称重塑其估值叙事的标志性事件——既体量巨大，又确立了新的定价基准。公开证据足以坐实该轮融资的落地与整体估值轮廓，但关于 C
              轮投后估值的确切数额，始终未见官方出面定调。这十分关键：在没有公开盈利数据的情况下，估值本质上是一场预期博弈。市场买单的是其扩张路径、品牌光环以及所谓的品类头号玩家心智，而非成熟稳定的现金流回报。现有的证据链足以还原历次融资规模与定价锚点，却不足以拆解出经审计的单店单元经济模型。现有的证据链足以还原历次融资规模与定价锚点，却不足以拆解出经审计的单店单元经济模型。
            claimRefs:
