      - number: '1.3'
        title: 管理层、治理结构与尽调空白
        blocks:
          - type: paragraph
            body: >-
              管理层的叙事足够清晰，能有效帮公司打开品类知名度。Daniel Ek 带来了明星创业者的声量与行业公信力，而 Hjalmar Nilsonne
              则是实际操盘的业务门面。股东结构如今集结了一线风投机构与明星投资人，这固然有利于品牌传播和渠道资源，却无法替代扎实的运营业绩。核心的尽调空白依然停留在新一轮融资前的几大死角：缺乏经审计的财务报表、无公开的利润率明细、尚无明确的医保接入路径，也拿不出详实的美国单店经济模型。这些并非无关痛痒的细节遗漏，而是决定其故事究竟会走向高端连锁门诊加盟、还是蜕变为长青健康平台的关键依据。
