      - number: '5.2'
        title: 运作机制与产品迭代
        blocks:
          - type: paragraph
            body: >-
              现有资料勾勒出一套垂直整合的软硬件体系：自研传感器、血液生化分析、医生临床解读，以及一层如今已打通可穿戴设备和身体成分分析的内部软件架构。近期设备硬件的更新迭代显示产品仍在持续进化，这对消费者固然是好消息，但也提醒市场该体系仍处于演变期，尚未完全定型。其核心技术主张不仅在于能完成体检扫描，更在于靠长期的连续复测建立更精准的纵向健康档案。这一主张合乎逻辑且意义重大，但同时对数据采集质量与临床严谨度提出了极高要求。打造能长期沿用的软硬件底座之所以关键，在于唯有底层数据链路长期稳定，纵向连续监测的数据才有实际价值。
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE007
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
      - number: '5.3'
        title: 信任、安全与临床验证盲区
        blocks:
          - type: paragraph
            body: >-
              现有的证据链中，服务流程层面的论据最为充分，临床有效性验证则最为单薄。招聘页面确实展现出了真实的线下运营阵仗，但这绝无法替代同行评审的临床研究论文或监管机构批准的功效声明文件。这一脱节极为致命，因为预防性筛查在创造健康价值的同时，极易诱发繁重的后续随访负担。因此，尽调的关键着眼点不在于产品包装是否光鲜，而在于其能否在不制造过多无效转诊和合规隐患的前提下，准确揪出具有临床意义的问题。就我们梳理的资料来看，答案目前仍未完全尘埃落定。该盲区的影响不可小觑，因为预防性筛查要在长期的年度复检中不断滚雪球放大价值，核心前提是底层的检测体系始终值得信赖。
            claimRefs:
              - CE005
              - CE008
              - CE010
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
