      - number: '2.3'
        title: 渗透瓶颈与尽调盲区
        blocks:
          - type: paragraph
            body: >-
              该市场面临的核心风险并非缺乏需求，而是该品类带来的下游医疗成本与过度焦虑是否会反噬其临床价值。针对全身体检的批评声音始终聚焦于假阳性偏高、诱发不必要的过度诊疗，以及难以从人群层面证实长期临床获益。检验其能否真正跑通的试金石，不仅在于用户是否愿意尝鲜体验一次，更在于这项服务能否持续提供有价值的健康洞察，从而支撑起长期的年度自费复购、医保纳入或雇主采购买单。正因如此，即使循证医学界仍存争议，市场依然在持续扩容：在卫生经济学家或监管机构对其整体价值达成共识之前，高端消费者早已愿意为了买个心安率先自费买单。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM010
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争全景
        blocks:
          - type: paragraph
            body: >-
              其实际面对的竞争格局远比公司口径更宽广。直接竞品涵盖以 Prenuvo 和 Ezra/Function Health 为代表的 MRI
              预防性筛查服务商，但真正的竞争对手还包括大型连锁影像中心、以生化检验为主打的会员制产品，以及早已占据大众常规医疗预算的传统体检渠道。Neko
              进军美国之所以举足轻重，是因为最成熟的一批竞品均扎根于此，公司必须证明其一小时的标准化体检流程具有足够的独特性，足以打破用户惯性并建立信任。由于该领域还交叉延伸至体检套餐、长寿抗衰会员等泛健康服务，其竞争边界相当模糊，随着消费者横向对比替代选项，战局会迅速外溢。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
