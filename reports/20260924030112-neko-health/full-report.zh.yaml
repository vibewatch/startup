chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 定位与运营模式
        blocks:
          - type: paragraph
            body: >-
              理解 Neko Health 的核心，在于将其视为一家高端预防性健康门诊网络，而非软件公司。其向外界输出的叙事融合了明星创始人背书、极简的 C
              端卖点以及刻意营造的高触感线下门诊体验。这种组合至关重要，因为整个投资逻辑的成立，取决于这种可标准化的医疗服务能否像消费品订阅一样形成持续复购，而非沦为一次性买卖。公司目前在瑞典和英国的业务布局，加上即将在纽约
              SoHo 开设的新店，印证该模式已走出最初的试点阶段。眼下悬而未决的真正问题，不在于品牌能否吸引眼球，而在于背后的运营体系能否在扩张中守住单店经济性与临床可信度。
            claimRefs:
              - CO001
              - CO002
              - CO009
