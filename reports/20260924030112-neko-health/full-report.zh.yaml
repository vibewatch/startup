companyProfile:
  summary: >-
    Neko Health 是一家总部位于斯德哥尔摩的预防性健康管理公司，由 Daniel Ek 与 Hjalmar Nilsonne 创立。公司提供时长 60
    分钟的全身体检服务，整合了自研传感器、血液化验与临床医生当面解读，目前在瑞典和英国运营，并计划进军美国市场。公司累计融资已超 $1.0B，一级市场对其定价逻辑更贴近高端消费医疗网络，而非传统医疗器械厂商。
