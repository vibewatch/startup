          description: 用户预约单次扫描，以获取安心感并建立基线健康档案。
          channels:
            - 官方网站
            - 媒体报道
            - 推荐转介
        - id: visit
          label: 完成扫描与解读
          actor: 诊所与临床医生
          description: 长达一小时的到店体验集合了传感器扫描、血液检测与医生面对面解读。
          channels:
            - 官方网站
            - 案例研究
            - 客户评价
        - id: repeat
          label: 按年复购预约
          actor: 消费者
          description: 年度复购是衡量业务持久度的核心信号，唯有形成固定习惯，产品价值方能产生复利。
          channels:
            - 官方网站
            - 媒体跟进报道
            - 候补名单验证
        - id: expand
          label: 按城市或渠道拓展
          actor: 运营与合作拓展
          description: 公司从早期落地的城市网点，向更多城市及潜在雇主或合作伙伴渠道扩张。
          channels:
            - New York 落地
            - Dealroom
            - LinkedIn 案例研究
        - id: partner
          label: 合作伙伴 / 雇主渠道
          actor: 商务拓展
          description: 若复购需求能够持续，公司可借助雇主或合作伙伴渠道探索更广泛的分销网络。
          channels:
            - 官方网站
            - B2B 合作
            - 客户转介
