              - CP006
              - CP007
              - CP009
      - number: '3.2'
        title: 定位、定价与护城河
        blocks:
          - type: paragraph
            body: >-
              Neko 的定价远低于高端 MRI
              筛查方案，但其真正的护城河或许在于全链条一体化的交付体验，而非单一扫描仪硬件。公司自主把控硬件、软件及门诊服务全流程，使得整体体验比起单项影像检查更难被直接复制。然而，较低的转换成本以及用户的多平台尝试心态，使得消费者极易在不同预防健康服务间游移，尤其在竞品同样将自身包装为高端悦己消费的情况下。获客渠道能力、合作伙伴准入以及年度复检习惯的养成，便成了检验护城河深浅的关键所在。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP006
              - CP010
          - type: figure
            figureRef: FP001
            claimRefs:
