      - number: '1.2'
        title: 融资历史、估值与规模信号
        blocks:
          - type: paragraph
            body: >-
              一家公开财务数据极度有限的公司，走出如此激进的融资节奏实属罕见。A 轮与 B 轮已成过去，而规模达 $700 million 的 C
              轮融资则是眼下的核心事件，直接支撑起公司的估值叙事、扩张蓝图与豪华资方阵容。多家媒体与追踪数据库给出的估值口径均在 $7 billion
              上下，但在我们梳理的资料中，公司并未公开确认这一数字。这一差异必须厘清：该轮融资确实带来了真金白银，但具体的估值标签仍属媒体报道口径，而非官方权威披露。各项规模信号同样真实可见：超过 100,000 次体检与
              350,000+ 注册预约印证了旺盛的市场需求，但这尚未解答更为根本的转化端经济性问题。
