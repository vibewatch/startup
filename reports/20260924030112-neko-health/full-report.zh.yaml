      - number: '4.2'
        title: 变现模式与成本结构
        blocks:
          - type: paragraph
            body: >-
              目前的商业模式直截了当：消费者按次为体检买单，若对体验满意则按年复购，全套服务中内含临床医生的报告解读。症结在于单店单元经济模型尚未完全明朗。每家线下门店都需要背负租金装潢、专用设备以及医护人力成本，而公司从未公开过单店利润率或投资回收周期测算。外界很难凭此断定它是一门具备良好回报率的高端服务业生意，还是一个单纯靠烧钱买时间的增长故事。现存证据坐实了这是一款需求旺盛的高端产品，但尚无法证明它是一个能够自我造血的线下门诊网络。
            claimRefs:
              - CI004
              - CI005
              - CI006
