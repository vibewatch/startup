  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Neko 所切入的并非泛医疗大盘，而是预防性筛查、抗衰长寿服务、高管体检以及高端自费诊断的交叉地带。用户买单是为了回答一个简单的问题：我现在身体健康吗？其最直接的替代品包括常规年度体检、生化化验套餐、全身 MRI
              以及传统的有症状才就医模式。Neko
              的卖点在于靠一次无创检查，以更高效、体验更好的方式消解健康焦虑；但它仍需正面迎战用户更熟悉、往往也更廉价的既有医疗习惯。这一品类对消费心理学的倚重丝毫不亚于医学循证，因为消费者买的是确定感与便利性的结合体，缺一不可。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
      - number: '2.2'
        title: 市场测算视角与渗透路径
        blocks:
          - type: paragraph
            body: >-
              多方公开资料显示该市场规模可观且处在上升通道，但具体测算差异极大，主要取决于切入视角是整体预防性筛查、纯自费体检，还是更狭义的高端便捷健康客群。SNS Insider 报道援引的数据显示，该市场 2025
              年规模为 $29.7 billion，到 2033 年有望增至 $47.2 billion；对竞品的对照分析同样印证：即便缺乏医保报销，高净值自费客群依然具备独立买单意愿。Neko
              在早期最现实的买家是高收入群体，中远期则可能向企业雇主或合作渠道延伸，作为一项高端员工健康福利。
