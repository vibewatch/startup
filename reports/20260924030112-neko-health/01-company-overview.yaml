  evidenceGaps:
  - type: missing-source
    severity: material
    topic: audited financials
    missingEvidence: No audited revenue, margin, or cash-balance disclosure surfaced
      in the fetched sources.
    whyItMatters: Those metrics determine whether the valuation is underwritten by
      operating performance or narrative momentum.
    diligencePath: Obtain statutory accounts or a management update with revenue,
      margin, and cash burn.
    relatedQuestionRefs:
    - QO008
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: Tracker sources disagree materially on employee count.
    whyItMatters: Headcount is a proxy for organizational scale and cost structure,
      so the mismatch should not be glossed over.
    diligencePath: Pull a company-authored headcount or a fresh third-party data provider
      before treating any count as current.
    relatedQuestionRefs:
    - QO008
