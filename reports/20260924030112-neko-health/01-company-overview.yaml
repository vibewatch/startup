company:
  name: Neko Health
chapter:
  number: 1
  title: Company Overview
  summary: Neko Health has moved from a Swedish founder-led preventive-health concept
    to a clinic-based consumer health network with a $700M Series C, 100,000+ completed
    scans, and an imminent U.S. launch, but the company still leaves revenue, margins,
    and clinic economics under-specified.
sections:
- id: identity
  title: Identity and operating model
  body: Neko Health is best understood as a premium preventive-health clinic network,
    not a software company. The company’s public story combines founder credibility,
    a simple consumer pitch, and a deliberately high-touch clinic experience. That
    combination matters because the investment case depends on whether a repeatable
    medical service can behave more like a consumer subscription than a one-off procedure.
    The company’s current footprint in Sweden and the U.K., along with the planned
    SoHo opening in New York, shows that the model has outgrown its original pilot
    stage. The unanswered question is not whether the brand can attract attention,
    but whether the operational system behind it can scale without destroying economics
    or clinical credibility.
  claimRefs:
  - CO001
  - CO002
  - CO009
  tableRefs:
  - TO001
  - TO002
- id: funding-and-scale
  title: Funding, valuation, and scale signals
  body: 'The funding history is unusually aggressive for a company with limited public
    financial disclosure. The Series A and B are now historical, but the $700 million
    Series C is the key current event because it anchors the company’s public valuation
    narrative, its expansion plan, and its investor roster. Media and tracker sources
    converge on a valuation near $7 billion, but the company did not publicly confirm
    that figure in the source set we reviewed. That distinction is important: the
    round itself is real capital, yet the exact mark is still a reported number rather
    than a fully company-owned disclosure. The scale signals are also real. More than
    100,000 scans and 350,000+ registrations imply meaningful demand, but they do
    not yet answer the harder question of conversion economics.'
  claimRefs:
  - CO004
  - CO006
  - CO007
  - CO012
  figureRefs:
  - FO001
- id: leadership-and-gaps
  title: Leadership, governance, and diligence gaps
  body: 'The leadership story is straightforward enough to help the company sell the
    category. Daniel Ek brings founder fame and category credibility, while Hjalmar
    Nilsonne is the operating face of the business. The cap table now includes a mix
    of institutional venture backers and celebrity investors, which helps with distribution
    and publicity but does not substitute for operating evidence. The real diligence
    gap is still the same one that mattered before the latest round: no audited financials,
    no public margin detail, no disclosed insurance path, and no exact U.S. economics.
    Those are not minor omissions. They are the facts that determine whether the story
    is a premium clinic franchise or a durable health platform.'
  claimRefs:
  - CO008
  - CO010
  - CO011
  tableRefs:
  - TO003
