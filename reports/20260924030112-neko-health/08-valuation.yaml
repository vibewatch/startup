chapter:
  number: 8
  title: Valuation
  summary: Neko Health’s valuation is best treated as a reported range around $7B rather than a company-confirmed
    mark. Against estimated 2025 revenue and the clinic model’s capital intensity, the premium looks expensive,
    though not absurd if the U.S. rollout and repeat usage work.
sections:
- id: mark
  title: What the market is paying for
  body: The market is paying for a future category winner, not a mature clinic chain. The best-supported mark is
    a reported figure near $7 billion, but the company has not publicly confirmed that exact price in the source
    set we reviewed. The point is not that the number is fake; it is that it is directional. Investors are pricing
    brand, expansion, and repeat behavior. That can be rational in a category with large upside. It also means the
    valuation is fragile if the U.S. rollout stumbles or if repeat annual usage fades after the novelty wears off.
    The valuation view is therefore a judgment about how much of the current premium is justified by evidence versus
    story. The valuation view is therefore a judgment about how much of the current premium is justified by evidence
    versus story.
  claimRefs:
  - CV001
  - CV003
  - CV009
  tableRefs:
  - TV001
  - TV002
  figureRefs: []
- id: math
  title: What the math implies
  body: 'Even using a simple public revenue estimate, the implied multiple is rich. That does not automatically
    make the company a bad investment, but it does mean the case depends on a lot of future execution. The upside
    scenario is straightforward: replicate clinics, preserve retention, and scale the brand into a much larger preventive-health
    network. The downside scenario is also straightforward: the company stays a premium niche with solid demand
    but insufficient economic density to justify a top-tier growth mark. The current evidence fits neither extreme
    perfectly, which is why the right answer is to treat the valuation as expensive, not impossible.'
  claimRefs:
  - CV002
  - CV004
  - CV005
  - CV011
  tableRefs:
  - TV003
  figureRefs: []
- id: stance
  title: Recommended stance
  body: The correct stance on the public evidence is not blind enthusiasm and not outright dismissal. It is to recognize
    that Neko is still in the option-value phase of the story. The company has real demand, real capital, and a
    real expansion plan. It does not yet have the audited financial detail, precision valuation data, or clinic
    economics that would let an investor call the mark reasonable on fundamentals alone. So the valuation should
    be treated as expensive and execution-sensitive, with upside still available if the U.S. rollout proves the
    model can scale without breaking the customer experience. The right stance is to underwrite upside only if the
    public evidence catches up to the price, not before. The point is not perfection; it is whether the public evidence
    can justify the current price with enough margin of safety.
  claimRefs:
  - CV006
  - CV007
  - CV008
  - CV010
  - CV012
  tableRefs: []
  figureRefs:
  - FV001
