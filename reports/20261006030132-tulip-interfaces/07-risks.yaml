callouts:
  - calloutType: "risk"
    title: "Mission-Critical Downtime Liability and Cloud Outage Exposure"
    body: "Deploying a multi-tenant cloud operations platform onto manufacturing plant floors introduces availability vulnerabilities. While traditional legacy MES systems run on isolated on-premises servers, cloud-connected frontline apps depend on uninterrupted wide-area network connectivity. As evidenced by official performance incident history, any latency spike or cloud disruption directly threatens assembly line throughput, creating high operational exposure for enterprise customers unless robust edge autonomy is verified."
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR008"
  - calloutType: "insight"
    title: "Strategic Distribution Moat Creates Channel Concentration"
    body: "Tulip's alliance with Mitsubishi Electric provides unparalleled access to global factory automation accounts but locks company growth into the sales cycles and strategic priorities of its corporate sponsor. Forward diligence must determine whether Tulip retains sales autonomy across competitive factory ecosystems or faces channel pushback from competing hardware vendors like Rockwell Automation and Siemens."
    claimRefs:
      - "CR010"
      - "CR011"
      - "CR012"
