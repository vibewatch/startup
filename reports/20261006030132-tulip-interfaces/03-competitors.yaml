callouts:
  - calloutType: "insight"
    title: "Coexistence Over Displacement in Enterprise Manufacturing"
    body: >-
      Rather than replacing core Tier-1 MES or ERP systems, modern frontline platforms increasingly succeed by acting as an agile edge execution layer. Plant operators leverage Tulip apps for interactive guidance, quality inspections, and machine monitoring, streaming contextualized transactional data back into enterprise systems like SAP, Oracle, or Siemens Opcenter.
    claimRefs:
      - "CP003"
      - "CP007"
      - "CP010"
  - calloutType: "risk"
    title: "Governance Overhead and Application Sprawl"
    body: >-
      The democratic empowerment of citizen developers introduces substantial enterprise operational risks. Without strict Center of Excellence governance, multi-plant operations risk creating unvalidated application variants, inconsistent data schemas, and fragile localized integrations that undermine corporate-wide standard operating procedures.
    claimRefs:
      - "CP002"
      - "CP009"
      - "CP014"
