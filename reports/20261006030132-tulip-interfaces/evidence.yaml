evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited GAAP annual financial statements detailing ARR, gross margin percentage, net revenue retention (NRR), and
      cash burn rate.
    whyItMatters: >-
      Without audited financial disclosures, evaluating the sustainability of the $1.3B valuation multiple and operating
      runway is constrained.
    diligencePath: >-
      Request confidential audited financial statements and board-approved financial models under an NDA during
      diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: leadership
    missingEvidence: Complete voting cap table, formal board composition, and founder succession agreements.
    whyItMatters: >-
      Key-person dependence on co-founders and governance veto rights cannot be evaluated without board and voting
      records.
    diligencePath: Review certified Delaware corporate charter, investors' rights agreement, and voting agreements.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: investors
    missingEvidence: >-
      Full liquidation preference stack, senior liquidation multiples, and participation caps across Series A through
      Series D.
    whyItMatters: Determines net common shareholder waterfall returns under various exit valuation scenarios.
    diligencePath: Examine the certificate of incorporation and preferred share designation schedules.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Disaggregated market share and total addressable market spend specifically for no-code frontline operations
      platforms vs. legacy MES.
    whyItMatters: >-
      Broad MES market data overstates near-term addressable software spend by conflating heavy infrastructure services
      with software licenses.
    diligencePath: >-
      Obtain proprietary Gartner or IDC discrete manufacturing execution software market share tables disaggregated by
      deployment model.
    relatedQuestionRefs:
      - QM002
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: revenue-run-rate
    missingEvidence: >-
      Audited financial disclosure of current GAAP revenue, ARR growth rate, net revenue retention (NRR), and gross
      margins.
    whyItMatters: >-
      Reported figures rely on private database citations ($50M ARR) and statistical evaluations ($10M-$100M sales)
      rather than audited statements.
    diligencePath: Request confidential management financial package and audited income statements under Non-Disclosure Agreement.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-revenue-quality
    missingEvidence: >-
      Price book, order forms, realized discounts, contract duration, ARR definition, revenue mix, deferred revenue, and
      revenue-recognition policy.
    whyItMatters: >-
      Without contract and accounting evidence, the recurring share, pricing power, and comparability of the reported
      ARR and revenue figures cannot be assessed.
    diligencePath: >-
      Review a representative contract sample, billing export, ARR bridge, and audited revenue-recognition memorandum
      under NDA.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Sales cycle, pipeline conversion, quota attainment, CAC by segment, implementation cost, and CAC payback cohorts.
    whyItMatters: >-
      A visible full-funnel motion and broad commercial staffing footprint do not establish efficient acquisition or
      expansion.
    diligencePath: >-
      Obtain CRM cohort exports, bookings by channel, fully loaded sales and marketing spend, and implementation labor
      by customer cohort.
    relatedQuestionRefs:
      - QI003
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin by software, services, and hardware; NRR, GRR, churn, support cost, hosting cost, and services
      utilization.
    whyItMatters: >-
      The public record cannot show whether software economics outweigh professional-services, edge, support, and
      deployment costs.
    diligencePath: >-
      Obtain audited segment gross-margin bridges and quarterly customer cohorts split by segment, site, product, and
      deployment model.
    relatedQuestionRefs:
      - QI005
      - QI006
      - QI010
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, monthly burn, working capital, capex, debt and project-finance obligations, planned use of funds,
      runway, and next-round trigger.
    whyItMatters: >-
      The January 2026 financing amount does not establish how much cash remains or whether future growth can be funded
      without another round.
    diligencePath: >-
      Reconcile bank balances to the latest balance sheet and obtain a board-approved monthly operating plan, debt
      schedule, and downside runway case.
    relatedQuestionRefs:
      - QI007
      - QI008
      - QI009
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: edge-offline-capabilities
    missingEvidence: >-
      Technical documentation specifying whether Tulip Player apps support local offline edge execution and database
      synchronization during complete cloud WAN outages.
    whyItMatters: >-
      Shop-floor production lines risk catastrophic stoppage during network or cloud service outages if local edge
      stations cannot execute workflows autonomously.
    diligencePath: >-
      Request customer disaster-recovery architecture documentation and offline caching specifications from Tulip
      engineering.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: custom-widget-security
    missingEvidence: >-
      Third-party penetration testing reports and sandbox security architecture documentation for custom user-developed
      JavaScript widgets.
    whyItMatters: >-
      Unsandboxed or loosely governed custom widgets could introduce browser vulnerabilities or data exfiltration risks
      on sensitive manufacturing networks.
    diligencePath: >-
      Review SOC 2 Type II reports, FedRAMP package boundary documentation, and custom widget runtime isolation
      parameters.
    relatedQuestionRefs:
      - QE005
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: retention-and-churn
    missingEvidence: >-
      Audited cohort-level net revenue retention (NRR), gross revenue retention (GRR), and logo churn data across
      enterprise customer tiers.
    whyItMatters: >-
      Essential to evaluate customer lifetime value, expansion efficiency, and underlying platform stickiness beyond
      marketing case studies.
    diligencePath: Request confidential SaaS cohort retention tables and churn breakdowns during formal management due diligence.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-universe
    missingEvidence: >-
      Comprehensive listing of all paying commercial customer accounts, contract values (ACVs), and deployment stage per
      account.
    whyItMatters: Public case studies highlight successful production deployments but omit failed pilots or churned accounts.
    diligencePath: Review vendor customer master list and CRM pipeline data under NDA.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: financial-quality
    missingEvidence: Audited ARR, revenue growth, gross margin, GRR, NRR, customer concentration, cash burn, and runway.
    whyItMatters: These inputs determine whether a premium private-software multiple and target investor return are supportable.
    diligencePath: >-
      Obtain audited statements, ARR and revenue bridges, cohort schedules, customer concentration, and monthly cash
      reporting under NDA.
    relatedQuestionRefs:
      - QV002
      - QV007
  - type: conflicting-data
    severity: material
    topic: capital-structure
    missingEvidence: >-
      A reconciled financing history, fully diluted cap table, preferred terms, liquidation preferences, participation
      rights, and option-pool treatment.
    whyItMatters: Conflicting total-funding figures and unknown security terms prevent a reliable dilution or proceeds waterfall.
    diligencePath: >-
      Reconcile board-approved financing documents and model proceeds by security class across downside, base, and
      upside exits.
    relatedQuestionRefs:
      - QV003
  - type: private-evidence-only
    severity: material
    topic: customer-economics
    missingEvidence: Customer-verified ROI denominators, pilot conversion, multi-site expansion, renewal, and deployment-cost data.
    whyItMatters: Company testimonials and implementation programs do not establish durable expansion economics or retention.
    diligencePath: >-
      Run reference calls across new, renewed, churned, and multi-site customers and reconcile findings to contract
      cohorts.
    relatedQuestionRefs:
      - QV004
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: >-
      An IPO timetable, transaction-ready controls, secondary liquidity depth, and comparable M&A precedents with
      disclosed terms.
    whyItMatters: Without a credible route to liquidity, target return and holding period cannot be supported from public evidence.
    diligencePath: >-
      Review board materials, banker work, audit readiness, secondary transfer records, and precedent transactions under
      NDA.
    relatedQuestionRefs:
      - QV010
