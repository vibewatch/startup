callouts:
  - calloutType: strength
    title: Composable Hybrid Architecture Overcoming MES Rigidity
    body: >-
      By decoupling user interface app authoring from underlying database schemas and industrial field protocols, Tulip allows manufacturers to deploy agile, workstation-specific digital guidance within days. The combination of cloud-managed app configuration with distributed on-premises Connector Hosts provides operational flexibility without requiring custom software builds or monolithic MES vendor professional service engagements.
    claimRefs:
      - CE001
      - CE009
      - CE010
  - calloutType: risk
    title: Cloud Connectivity Vulnerability in Real-Time Shop-Floor Execution
    body: >-
      Unlike traditional on-premises SCADA and hardened edge MES systems that execute autonomously within local OT networks, Tulip relies heavily on cloud availability and network connectivity for app delivery and centralized logging. Real-world status tracking indicates that service degradations and incident resolutions can impact operational availability, making offline caching and redundant network design critical for high-speed automated lines.
    claimRefs:
      - CE011
      - CE015
      - CE016
