              - CE010
          - type: callout
            title: 实时车间执行中的云连接脆弱性
            body: >-
              传统本地 SCADA 和加固型边缘 MES 在本地 OT 网络中自主运行，而 Tulip 高度依赖云可用性和网络连接来交付应用并集中记录日志。
              实际状态跟踪显示，服务下降和事件解决可能影响运营可用性，因此离线缓存和冗余网络设计对高速自动化生产线至关重要。
            calloutType: risk
            claimRefs:
