      - number: '5.2'
        title: 模块化平台组件、数据模型与规格
        blocks:
          - type: paragraph
            body: >-
              Tulip 的功能架构分为管理、执行和数据管理模块，通过受治理的企业工作区访问。工作区充当租户隔离边界，把不同工厂设施的 用户、站点配置、应用版本和运营资源隔离开来。每个工作区的应用开发以 App Editor
              为中心，并由 Custom Widget Editor、 Table Editor 和 Table Query Editor 等专用界面支持。

              在持久化层，Tulip 通过 Tulip Tables 使用结构化通用数据模型。Tulip Tables 让公民开发者和工程师能够定义
              表示生产订单、实体资产、批次标识、设备状态和操作员分配的定制关系模式。关键在于，平台原生提供 Machine Data Sources、 Machine Types 和 Machine Downtime
              Reasons 配置，让车间遥测数据动态更新运营表。在生命科学和受监管制造场景中，Tulip 强制使用专门的 GxP 合规数据模型，支持创建电子 Device History Records（eDHR）和电子
              Batch Records（eBR），并对字段 修改和电子签名审批进行细粒度审计。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
