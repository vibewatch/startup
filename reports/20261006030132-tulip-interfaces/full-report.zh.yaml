      - number: '5.4'
        title: 企业信任、GxP 合规与运营可用性风险
        blocks:
          - type: paragraph
            body: >-
              在关键工业环境部署一线软件，必须满足严格治理、信息安全和高可用性保证。Tulip 通过提供 GxP-ready 能力和面向 FedRAMP Moderate
              等效性的安全体系，回应受监管行业需求。平台包含完整审计轨迹、基于角色的访问控制（RBAC）、基于 SAML 的企业单点 登录（SSO）以及 IP/CIDR
              网络访问限制。例外审查流程让质量保证人员只需查看标出的偏差，而不是检查数千条合规记录，从而加快 产品和批次放行。

              不过，在混合云架构上运行工业执行系统会带来明显的可靠性依赖。一线应用同时与云服务和本地 Connector Hosts 通信，因此平台 中断或网络延迟可能直接打断正在运行的生产线。第三方运营监控日志确认，虽然
              Tulip 的滚动可用性较强——30 天运行时间平均 约为 99.75%，且长期保持平稳——事件仍会发生，包括平台性能下降和服务问题，解决周期可能持续数小时甚至数天。对高产量
              制造工厂而言，缺少自主、零延迟的离线边缘执行模式仍是关键技术风险，需要客户严格规划灾难恢复。
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
