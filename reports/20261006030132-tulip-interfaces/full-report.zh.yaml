        title: 管理层、治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Tulip Interfaces 的管理团队兼具 MIT Media Lab 的深厚学术背景和成熟的企业软件管理经验。联合创始人 Natan Linder 担任 CEO，曾联合创办 3D 打印先驱
              Formlabs；联合创始人 Rony Kubat 担任 CIO 和 CISO。团队还包括 CFO Yuval Marcus、 CBO Erik Mirandette、首席产品与工程官 Mason
              Glidden，以及其他运营高管。运营原则强调以人为本的数字化转型、 现场走访和直接赋能一线员工。不过，关键人物依赖仍集中在联合创始人 Natan Linder 身上；他的外部知名度和双重创业
              承诺，使管理层接班安排和正式董事会治理成为后期机构投资者必须核查的重点。
            claimRefs:
              - CO007
              - CO008
