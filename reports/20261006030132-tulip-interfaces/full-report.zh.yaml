  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、支出分类与替代方案
        blocks:
          - type: paragraph
            body: >-
              Tulip 处于工业软件领域，连接一线运营执行、数字化作业指导和可组合车间自动化。其可服务市场位于传统单体 制造执行系统（MES）与一线工人生产力工具之间。Tulip 获取的支出包括数字作业指导编写、质量跟踪、
              电子批记录和设备历史记录、通过 IoT 连接器进行机器监控，以及车间应用搭建。范围外支出包括核心 ERP 交易会计、
              自动化工厂仓库管理系统（WMS）骨干和原生重型自动化硬件。离散制造和批量制造工厂的主要现状替代方案仍是纸质 SOP、 静态 PDF 文件夹和临时电子表格跟踪，另有定制内部软件和传统客户端—服务器
              MES；这些方案往往维护专业服务成本高、 推广周期长。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模口径与可服务机会
        blocks:
          - type: paragraph
            body: >-
              评估 Tulip 的可服务市场，需要把宽泛的工业自动化总量拆成受约束的细分市场。全球制造软件和离散 MES 都是数十亿美元
              级别的大市场，但面向一线的无代码运营软件仍是新兴细分领域，以自下而上的应用开发和敏捷部署为特征。第三方企业画像 将 Tulip 归入 NAICS 5112（软件出版商）和 NAICS
              334513（工业过程仪器），估计运营收入处于 USD 10M 至 USD 100M 区间；二级创投资料则跟踪约 USD 50M ARR 里程碑。由于专门针对“可组合一线运营平台”的独立第三方 市场规模很少从传统
              MES 预测中拆出，规模应从多个角度评估：自上而下的离散 MES 支出、自下而上的目标工厂座席扩张，以及受监管和高精度行业中的工业 AI 应用渗透率。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
