  - id: FI001
    title: 定性商业价值转化为扩张路径
    type: flow
    summary: 公开记录显示了一条商业路径，但没有提供转化率、合同价值、CAC 或毛利桥接。
    data:
      nodes:
        - id: demand
          label: 需求生成
          detail: 内容、网络研讨会、活动和定向营销
        - id: discovery
          label: 潜客转化
          detail: 销售与售前职能；周期长度和转化率未披露
        - id: jumpstart
          label: 一周 Jumpstart
          detail: 现场专业服务入口；价格未披露
        - id: proof
          label: 六周 Proof of Value
          detail: MVP 部署；从试点到合同的转化率未披露
        - id: deployment
          label: SaaS 与边缘部署
          detail: 应用、系统、机器和支持职能；成本构成未披露
        - id: expansion
          label: 结果驱动扩张
          detail: 公司报告的客户成果支撑价值主张；NRR 未披露
    approximationNotes: 这是有证据支持的定性路径，不是经过测量的漏斗。没有暗示任何阶段宽度、转化率、收入或利润率。
    claimRefs:
      - CI002
      - CI003
      - CI005
      - CI006
      - CI016
  - id: FE001
    title: Tulip 交互式前线架构栈
    type: stack
    summary: 端到端架构栈展示从车间物理集成延伸至云治理和企业智能的完整链路。
    data:
      layers:
        - label: 前线界面与执行层
          detail: Tulip Player 部署在工业平板、PC 工位和移动设备上，执行无代码运营应用。
        - label: 边缘硬件与现场设备层
          detail: Edge IO 设备、机器传感器、智能摄像头、灯光拣选控制器和条码扫描器通过物理接口连接。
        - label: 工业设备协议层
          detail: OPC UA 服务器、MQTT 消息代理和原生设备驱动，与 PLC、CNC 机床及工厂历史数据库通信。
        - label: 集成与连接器主机层
          detail: 本地部署和云端连接器主机负责代理双向 HTTP REST API、SQL 数据库及 Unified Namespace（UNS）事件代理。
        - label: 核心应用与数据管理层
          detail: 多租户云平台管理 Workspaces、App Editor、Tulip Tables 通用数据模型及触发器执行逻辑。
        - label: 企业系统集成层
          detail: 与 ERP、MES、PLM、QMS、WMS、CMMS 及云数据仓库进行双向事务交换。
        - label: 智能、治理与安全层
          detail: 一线工业 AI 智能体、GxP 电子批记录（21 CFR Part 11）、SAML SSO，以及 FedRAMP Moderate 合规控制措施。
    approximationNotes: 基于官方 Tulip Interactive Reference Architecture 和技术解决方案文档综合整理的逻辑架构分层图。
    claimRefs:
      - CE001
      - CE005
      - CE009
      - CE010
      - CE011
      - CE012
      - CE013
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 客户通常从局部工位级部署，逐步扩展到企业级可组合运营。
    data:
      items:
        - label: 1. 机会发现
          stage: 初步发现
          focus: Identification of shop-floor bottlenecks and manual tracking friction
          touchpoints:
            - 高管简报和制造业贸易展会演示
            - 与传统刚性 MES 部署成本对标
            - 评估一线纸质 SOP 和错误率
        - label: 2. 初始工位试用
          stage: 试点评估
          focus: Single line or workstation proof-of-value
          touchpoints:
            - 专业服务 Jumpstart 项目
            - 无代码 SOP 与检验应用配置
            - Edge IO 与现有工具连接
        - label: 3. 产线现代化
          stage: 工位推广
          focus: Expansion across connected assembly cell
          touchpoints:
            - 操作员反馈闭环与公民开发
            - 视觉验证与自动防错
            - 通过本地 MES/ERP 连接器同步数据
        - label: 4. 工厂标准化
          stage: 场站采用
          focus: Facility-wide digital operations platform
          touchpoints:
            - 标准化电子日志簿与 GxP 合规审计轨迹
            - 多工位仪表盘与运营分析
            - 公民开发者卓越中心支持
        - label: 5. 多场站规模化
          stage: 企业扩张
          focus: Global deployment across manufacturing network
          touchpoints:
            - 全球企业许可协议
            - 通过企业级系统集成商伙伴推广
            - 跨工厂基准对标与流程治理
        - label: 6. 持续优化
          stage: 长期价值创造
          focus: AI-driven frontline analytics and automated process refinement
          touchpoints:
            - 自动异常检测与计算机视觉质量检查
            - 在各运营部门间共享应用库模板
            - 统一接入企业车间数据湖
    approximationNotes: 基于已记录的企业部署模式和模块化平台架构综合整理的推进路径。
    claimRefs:
      - CU002
      - CU007
      - CU013
  - id: FR001
    title: 企业风险严重性与发生可能性热力图矩阵
    type: matrix
    summary: 按发生可能性和严重性分层，直观呈现运营、监管、依赖和估值风险敞口。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 云平台可用性
          values:
            - label: 产线停摆事故
              tone: risk
            - label: 延迟恶化
              tone: risk
            - label: 依赖单一云
              tone: risk
        - label: 渠道与合作伙伴集中度
          values:
            - label: OEM 硬件锁定
              tone: neutral
            - label: 联盟销售冲突
              tone: risk
            - label: 企业赞助方优先级
              tone: risk
        - label: 估值倍数与增长投资决策
          values:
            - label: 倍数压缩
              tone: risk
            - label: 增长放缓
              tone: risk
            - label: 私募市场流动性摩擦
              tone: risk
        - label: 生命科学与联邦合规
          values:
            - label: FedRAMP 撤销
              tone: neutral
            - label: GxP 电子签名
              tone: neutral
            - label: FDA 21 CFR Part 11 审计
              tone: risk
        - label: 合同责任与服务暂停
          values:
            - label: 缺少通知例外条款
              tone: neutral
            - label: 禁止漏洞扫描
              tone: risk
            - label: 单方面暂停 AUP
              tone: risk
        - label: 一线公民开发者治理
          values:
            - label: AI 解决方案审查
              tone: positive
            - label: 未编目应用蔓延
              tone: neutral
            - label: 触发器循环开销
              tone: risk
    approximationNotes: 根据运营严重性排名、合同风险敞口和工业合作伙伴集中度数据评估。
    claimRefs:
      - CR001
      - CR003
      - CR006
      - CR007
      - CR010
      - CR014
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 证据链从已验证的融资估值出发，经过尚未解决的财务和运营风险，最终落到以尽调为门槛的跟踪建议。
    data:
      nodes:
        - label: $120M D 轮
          detail: Mitsubishi Electric 领投的战略轮融资
        - label: $1.3B 投后估值
          detail: 两个市场数据源和 Tulip 的新闻索引相互印证
        - label: 融资总额冲突
          detail: 五轮合计 $273M，相比六轮合计 $290.9M
        - label: 未经验证的运营 KPI
          detail: ARR 质量、增长、NRR、利润率和现金消耗数据仍不可得
        - label: 当前下行风险检查
          detail: 服务可靠性、优先权、稀释和退出流动性仍需尽调
        - label: 跟踪
          detail: 仅在价格与证据相互印证后重新考虑
    approximationNotes: 按顺序排列的定性流程；不设定转化率、概率或可据以支撑的公允价值点估计值。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV007
      - CV011
      - CV016
