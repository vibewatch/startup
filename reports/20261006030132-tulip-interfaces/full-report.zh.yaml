    title: 乐观、基准与悲观估值情景
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行或论点失效触发条件
    rows:
      - - 乐观
        - 经核实的 ARR、增长、NRR 和毛利率足以支撑溢价；战略渠道分散需求
        - 达到或超过 $1.3B 可能站得住脚，但公开证据无法支持一个可辩护的上限
        - 在审计 KPI 和群组数据披露前无法量化
        - 渠道集中度上升，或留存率低于管理层的投资判断情景
      - - 基准
        - 商业产品广度真实存在，但 $50M ARR 估算仍未经核实
        - 除非质量和增长缩小与高端 SaaS 参照公司的差距，否则价值应低于当前估值
        - 当前公开证据支持这一谨慎情景，但不足以支持一个百分比
        - 没有 ARR 桥接、跨站点扩张疲弱，或融资条款使新资金处于次位
      - - 悲观
        - 增长不及预期，倍数向所引述的 1.9x-6.8x 公开参考区间收缩
        - 以未经核实的 $50M 输入计算，机械得出 $95M-$340M，只说明敏感性，不代表公允价值
        - 若可靠性、续约或现金跑道证据恶化，悲观情景的可能性会上升
        - 重大中断、下轮融资、群组规模收缩，或现金跑道短于投资期限
    notes: 区间是情景敏感性分析，不是预测。公开可比公司并非直接同行，$50M ARR 输入是推导值，现有证据也不足以支持概率百分比。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV011
figures:
  - id: FO001
    title: Tulip 公司里程碑与资本化时间线
    type: timeline
    summary: 从 2012 年 MIT 创立到 2026 年 D 轮独角兽估值，概览 Tulip 的关键公司、融资、产品和运营里程碑。
    data:
      items:
        - label: 在 MIT Media Lab 创立
          date: '2012'
          detail: Natan Linder 和 Rony Kubat 以 MIT Media Lab 长达十年的前线制造界面研究为基础创立公司。
          tone: positive
        - label: 种子融资轮
          date: 2016-09
          detail: 获得由 C4 Ventures 领投的首轮机构种子资金，用于扩建无代码工业应用平台。
          tone: positive
        - label: A 轮资本化
          date: 2017-06
          detail: 完成由 New Enterprise Associates（NEA）领投、Pitango Venture Capital 参与的 $13M A 轮融资。
          tone: positive
        - label: B 轮与 DMG MORI 联盟
          date: 2019-09
          detail: 完成由全球机床龙头 DMG MORI 领投的 $39.5M B 轮融资，以扩展边缘连接并开设欧洲总部。
          tone: positive
        - label: C 轮扩张
          date: 2021-08
          detail: 完成由 Insight Partners 领投的 $100M C 轮融资，加快全球多站点企业部署和招聘。
          tone: positive
        - label: Deloitte Fast 500 认可
          date: 2024-11
          detail: 在 2024 Deloitte Technology Fast 500 中排名第 220 位，体现北美工业软件收入的快速扩张。
          tone: positive
        - label: MES 分析师领导者
          date: '2025'
          detail: 获评 IDC MarketScape 离散 MES 及 ABI Research 流程工业 MES 的领导者。
          tone: positive
        - label: D 轮独角兽融资
          date: 2026-01
          detail: 完成由 Mitsubishi Electric 领投的 $120M D 轮融资，估值 $1.3B，并签署全球战略联盟以部署前线 AI。
          tone: positive
        - label: 记录 G15 节点中断
          date: 2026-07
          detail: 第三方状态监测记录到 G15 节点发生性能下降事故，凸显工业云韧性要求。
          tone: adverse
    approximationNotes: 日期和融资金额来自截至 2026 年 10 月汇编的公司公开公告及第三方投资资料。
    claimRefs:
      - CO001
      - CO002
      - CO004
      - CO006
      - CO010
      - CO011
      - CO012
      - CO015
      - CO016
  - id: FM001
    title: 前线工业运营可服务市场分层
    type: pyramid
    summary: 概念性市场规模层级，从更广泛的工业制造软件支出逐层收窄至前线无代码平台软件。
    data:
      items:
        - label: 潜在可服务总支出（广义工业制造软件与 MES）
          value: TAM Layer
          detail: 覆盖企业工业自动化、传统单体 MES、SCADA 和工厂运营软件的全球市场。
        - label: 可服务可寻址市场支出（离散与受监管制造车间执行）
          value: SAM Layer
          detail: 面向正将运营执行数字化的离散装配、医疗器械、航空航天和生命科学工厂的目标支出。
        - label: 可服务可获取市场（云与无代码前线运营平台）
          value: SOM Layer
          detail: 面向模块化、无代码、以操作员为中心的前线应用构建和机器数据采集的近期可服务软件支出。
        - label: 近期工厂扩张机会（全球工厂覆盖）
          value: Plant Expansion Layer
          detail: 面向寻求模块化数字化的数万家中大型离散制造站点的扩张机会。
        - label: 前线工位数字指导 TAM（操作员席位）
          value: Frontline Worker Layer
          detail: 覆盖全球车间操作员、满足联网工作指导和可追溯性需求的可服务席位。
        - label: 观察到的公司规模基准（当前商业规模）
          value: USD 10M - 100M
          detail: 公司画像估计的销售区间及报告的 USD 50M ARR 基准，支撑当前 USD 1.3B 估值。
    approximationNotes: 市场分层代表概念性的可服务边界，而非单一来源的统计规模，反映私人公司报告的限制。
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
