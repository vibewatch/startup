      - number: '1.3'
        title: 融资沿革、战略联盟与投资者基础
        blocks:
          - type: paragraph
            body: >-
              自 2016 年 Seed 融资以来，Tulip 在六轮有记录的股权融资中累计募集超过 $290M 的机构和战略资本。早期机构支持者包括 New Enterprise
              Associates（NEA）、Pitango Venture Capital、C4 Ventures 和 Vertex Ventures US。之后，公司与工业巨头 加深战略合作：DMG MORI 领投
              2019 年 9 月的 $39.5M Series B，Insight Partners 联合 TIME Ventures 领投 2021 年 8 月的 $100M Series C，Mitsubishi
              Electric Corporation 则领投 2026 年 1 月的关键一轮 $120M Series D。除股权投资外， Mitsubishi Electric 还签署全面战略联盟协议，共同开发 AI
              驱动的可组合应用，并加速其全球工厂网络的数字化转型。 尽管资本充足，详细股权结构、清算优先权和二级交易市场流动性仍属非公开信息；二级市场以估算的 IPO 前股价估值 低频交易。
