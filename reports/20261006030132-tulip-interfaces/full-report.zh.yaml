      - number: '2.3'
        title: 买方分层、预算归属与采用经济性
        blocks:
          - type: paragraph
            body: >-
              一线运营软件的采用涉及制造和生命科学企业中的多类利益相关者。主要经济买方通常是运营副总裁或总监、工厂经理或运营
              卓越负责人，他们掌握工厂层面的持续改进和资本设备优化预算。但在受监管生命科学环境中，质量总监也是重要预算 相关方：GxP 合规、电子历史记录和审计准备度会推动采购；制造 IT /
              数字化转型副总裁则寻求企业范围的数据连接。采用通常 遵循“落地—扩张”路径：工厂先通过快速价值验证部署切入高摩擦的人工工位，随后扩展到装配线和多工厂网络， 让一线工程师和操作员在不受中央 IT
              编程瓶颈限制的情况下搭建定制运营流程。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 增长驱动、技术催化剂与采用阻力
        blocks:
          - type: paragraph
            body: >-
              推动市场采用的宏观因素包括车间结构性技术工人短缺、制药和医疗器械行业监管审计趋严，以及向云连接边缘架构迁移。生成式 AI
              和原生机器学习的近期创新进一步放大平台价值，可自动翻译流程、用计算机视觉做质量检验，并提供智能对话辅助。不过， 采用仍会遇到明显摩擦：传统制造基础设施的硬件折旧周期常达 7 至 10
              年；工业网络安全要求阻碍外部云连接；工厂停机风险 也使客户不愿替换根深蒂固的系统。此外，多租户云可靠性至关重要，因为局部云中断或延迟下降会直接妨碍实时制造执行。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 传统 MES 单体的解构
            body: 一线运营软件市场与 1990 年代的单体 MES 部署有本质区别。采用可组合的无代码应用范式后，Tulip 让车间工艺工程师可以 快速配置定制界面，不必签订多年期、数百万美元的供应商定制开发项目。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
          - type: callout
            title: 运营连续性与延迟脆弱性
            body: 与后台企业 SaaS 不同，车间执行平台深度耦合物理工厂的节拍。运营性能下降或云延迟事件会严重威胁工厂吞吐量，因此需要 企业级架构冗余和强大的本地边缘运行能力。
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 一线运营与工业软件版图
        blocks:
          - type: paragraph
            body: >-
              工业制造执行软件环境包含四类竞争者：单体传统制造执行系统（MES），如 Siemens Opcenter 和 Rockwell FactoryTalk；专业整体设备效率（OEE）和互联工人平台，如
              TeepTrak Pulse、 Parsable 和 Redzone；质量或合规记录平台，如 MasterControl；以及企业内部自研软件。传统 MES 套件长期掌握一级企业
              制造商的关键车间生产管理和监管批记录治理。但传统 MES 往往要求僵化的运营流程，实施周期长达 18 至 36 个月，并持续 依赖高额咨询支出，在高混合装配线上难以跟上运营变化。

              Tulip 将一线运营平台定位为传统单体系统的可组合替代方案，让工厂工程师和运营人员为数字作业指导、质量跟踪、电子批 记录和机器数据语境化搭建模块化应用。Tulip
              不把工厂流程强塞进现成软件的僵化模式，而是提供可视化应用搭建、预置工业 连接器和边缘设备集成，与现有企业 ERP 和 MES 架构并行运行。这一架构形成了不同的竞争路径：Tulip 经常在敏捷离散环境
              中替换或绕开单体 MES，但也常与企业记录系统共存，充当工厂现场的人机交互层。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP008
      - number: '3.2'
        title: 竞争者画像与架构理念
        blocks:
          - type: paragraph
            body: >-
              直接比较显示，可组合应用平台与专用制造点解决方案采用了截然不同的架构理念。TeepTrak Pulse 代表专业 OEE 路线， 专注于用即插即用的边缘硬件（TeepTrak
              Box）标准化测量整体设备效率，安装周期为 8 至 12 周， 不需要复杂 PLC 改造或大规模 IT 集成。相比之下，Tulip 需要内部流程负责人或系统集成商搭建和维护定制应用；单个应用 的典型开发周期为 1
              至 3 个月。

              这种差异在不同制造垂直领域形成了清晰取舍。希望在数十个异构全球工厂中快速、标准化地比较 OEE 的多工厂企业，会从
              即插即用点解决方案的低初始集成摩擦和即时集团级可见性中受益。但对复杂装配、高混合医疗器械制造和受监管生物制药环境， 如果需要交互式电子 SOP、生产线清场和操作员指导，Tulip
              的低代码灵活性可提供更深的流程定制和监管适配。此外， Tulip 在 2023 年战略收购 Apprentice.io，显著扩展了其在生物制药领域的沉浸式能力，提供标准 OEE 工具无法覆盖的增强现实
              （AR）作业指导和无菌运营辅助。
            claimRefs:
              - CP004
