      - number: '5.3'
        title: 系统架构、边缘基础设施与连接层
        blocks:
          - type: paragraph
            body: >-
              Tulip 采用分布式混合架构，把集中式多租户云编排与本地车间执行和工业设备连接起来。在云管理层，Tulip 托管中央管理控制台、 生成式 AI 智能体服务、集中式应用仓库和分析仪表盘。集中式服务通过
              Connector Hosts 与本地工业自动化环境交互；这些受管软件 agent 部署在本地网络或云端，执行安全 SQL 数据库查询、HTTP REST API 事务和企业服务总线交换。

              在实体工厂车间，传统机械、CNC 设备、PLC、智能工具、摄像头和环境传感器通过 Tulip Edge Devices（如 Edge IO 单元）及 软件定义的边缘驱动器连接。平台原生接收并路由 OPC UA 和
              MQTT 等标准工业协议的遥测数据，并把实时事件桥接到企业 Event Brokers 和 Unified Namespaces（UNS）。这种解耦集成拓扑支持双向通信：Tulip Player
              应用中的操作员动作可以触发机器 设定值或灯光拣选序列；机器报警状态和周期完成事件则即时推动应用步骤转换和主管仪表盘更新。
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
