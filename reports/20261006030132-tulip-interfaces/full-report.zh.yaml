      - number: '3.3'
        title: 定价模式、总拥有成本与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              定价结构和持续实施成本反映出各类制造软件的底层架构要求。TeepTrak 等纯监控方案主要按机器或受监控生产资产收费，中型企业 5 年总拥有成本通常为 2m 至 5m 欧元。Tulip
              按用户、工位或座席设置订阅层级，并结合应用范围；其企业客户 5 年 TCO 估计为 3m 至 8m 美元，原因包括多应用推广、系统集成商专业服务和内部应用治理。Tulip 的试点部署通常为初始应用收取
              $50,000 至 $150,000，另有每年 $40,000 至 $100,000 的软件订阅费。

              Tulip 的长期竞争护城河依赖流程嵌入、生态网络效应，以及不断扩大的预置连接器和生成式 AI 编写工具库。一旦运营团队搭建数百个连接车间传感器和企业 ERP 的本地化应用，切换成本就会很高。不过，Tulip
              仍面临持久阻力：内部公民开发者治理可能在企业各工厂造成应用蔓延和技术债；传统 MES 供应商正持续加入模块化云能力；云交付的车间平台仍容易受基础设施事件和网络下降影响，从而可能让实体生产线停摆。
