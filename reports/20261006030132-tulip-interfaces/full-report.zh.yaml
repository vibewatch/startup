chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、沿革与发展阶段
        blocks:
          - type: paragraph
            body: >-
              Tulip Interfaces, Inc. 是一家风险投资支持的工业软件公司，总部位于马萨诸塞州 Somerville 的 77 Middlesex Avenue，并在
              Munich、Budapest、Singapore、Tel Aviv 和 Tokyo 设有国际办公室。公司由 MIT Media Lab 校友 Natan Linder 和 Rony Kubat 于 2012
              年创立，源于十多年对人机交互、计算机视觉和工业车间普适计算的研究。 Tulip 在 Delaware 注册为 C 型公司，作为工业软件即服务（SaaS）供应商运营，商业化一套一线运营平台，
              填补僵化的传统制造执行系统（MES）与车间一线工人之间长期存在的断层。公司在 2026 年 1 月完成 $120M Series D 融资后进入后期独角兽阶段，投后估值达到
              $1.3B，巩固了其作为离散制造和受监管工业环境中灵活、 AI 驱动层的定位。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
