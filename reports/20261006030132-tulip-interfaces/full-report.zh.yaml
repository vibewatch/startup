  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与一线运营流程
        blocks:
          - type: paragraph
            body: >-
              Tulip Interfaces 将核心产品定义为可组合的一线运营平台，目标是替代静态纸质 SOP、手写板和僵化的单体制造执行系统 （MES）。Tulip
              不把离散制造商和流程制造商强行塞进预设数据模式，而是提供无代码可视化编写环境， 让制造工程师、质量专家和运营负责人直接按工位需求搭建定制应用。这些应用通过 Tulip Player——一款可下载的专用客户端——
              在工业平板电脑、PC 和操作员触摸终端上运行。

              平台支持的一线流程包括数字作业指导、在线质量跟踪、动态换型清单、缺陷记录和物料跟踪。操作员按照分步交互式指导操作， 指导内容支持多语言翻译、丰富视觉素材，并根据实时传感器和仪器输入进行条件分支。Tulip
              把执行标准化到工位后，能够捕捉 带上下文的执行记录，自动跟踪节拍，并消除向后台软件重复录入数据，显著降低高混合制造线的准备负担和装配缺陷。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
