companyProfile:
  summary: >-
    Tulip Interfaces 是一家 Series D 工业 SaaS 公司，为制造业和受监管生命科学行业提供无代码、云原生的一线运营平台。公司由 MIT Media Lab 研究人员 Natan Linder 和 Rony
    Kubat 于 2012 年创立，总部位于马萨诸塞州 Somerville。Tulip
    将应用搭建、边缘连接、受治理的车间流程和付费专业服务结合起来。公开记录显示，公司部署规模可观且有战略资本支持，但财务披露仍不透明，因此投资判断仍是：这是一个增长势头强、但私人公司信息不透明的平台。
