            title: 可组合混合架构突破 MES 刚性
            body: >-
              Tulip 将用户界面应用编写与底层数据库模式和工业现场协议解耦，让制造商可以在数天内部署敏捷、按工位定制的数字指导。 云管理的应用配置结合分布式本地 Connector
              Hosts，既提供运营灵活性，又不需要定制软件开发或单体 MES 供应商的专业服务。
            calloutType: strength
            claimRefs:
              - CE001
