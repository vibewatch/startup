callouts:
  - calloutType: "risk"
    title: "Conflicting headline metrics block revenue-quality analysis"
    body: "The retained sources show $50M ARR, $50M revenue, and estimated annual revenue of $145M without common periods or definitions. These values cannot be combined, and none supplies gross margin, retention, or cash conversion."
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI016"
  - calloutType: "recommendation"
    title: "Underwrite from audited operations, not financing totals"
    body: "Require an audited revenue bridge, cohort retention, segment gross margins, sales-efficiency data, and a current cash-to-runway schedule before assigning value to reported ARR or treating the January 2026 financing as evidence of capital adequacy."
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI016"
