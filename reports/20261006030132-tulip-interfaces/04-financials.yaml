company:
  name: "Tulip Interfaces"
chapter:
  number: 4
  title: "Financials"
  summary: "Public evidence identifies a SaaS platform, paid-service surfaces, and a full-funnel commercial motion, but it does not disclose Tulip's pricing, revenue mix, margins, retention, burn, or cash. Third-party revenue and funding figures conflict materially, so financing headlines cannot substitute for audited operating data or a current liquidity bridge."
sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue model and pricing visibility"
    body: >-
      Tulip publicly describes its core product as SaaS and separately markets professional
      services, including a one-week on-site Jumpstart and a six-week Proof of Value. Those
      surfaces suggest potential software and implementation revenue, while the engineering
      page also describes hardware-and-software work around edge connectivity. The evidence
      does not show whether edge equipment is sold, bundled, rented, or absorbed as a delivery
      cost. None of the retained sources states list price, billed unit, minimum commitment,
      discounting, realized price, revenue mix, or accounting treatment. The underwriting
      conclusion is therefore limited: revenue mechanisms are visible, but neither recurring
      revenue quality nor the service and hardware burden can be quantified from public data.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI016"
    tableRefs:
      - "TI001"
      - "TI002"
  - id: "go-to-market-and-sales-efficiency"
    title: "Go-to-market motion and sales-efficiency proxies"
    body: >-
      Tulip's marketing page describes a full-funnel motion spanning awareness, prospect
      conversion, and expansion of existing customers through content, webinars, events, and
      targeted campaigns. Its careers pages show sales, commercial, customer success,
      professional services, support, engineering, and marketing functions across domestic,
      international, and remote locations. That footprint is consistent with a consultative,
      deployment-intensive enterprise motion, but it is not a substitute for sales-cycle,
      quota-attainment, CAC, or payback data. Tulip also displays customer outcome claims such
      as lower defects, preparation cost, inspection time, and rework; these are useful value
      propositions, not evidence of Tulip revenue, retention, or realized pricing. The public
      record supports the commercial process, not its efficiency.
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI016"
    figureRefs:
      - "FI001"
  - id: "traction-and-unit-economics"
    title: "Traction signals and unit-economics gaps"
    body: >-
      The strongest public traction numbers are inconsistent third-party observations.
      Silicon Valley Investment Club reproduces Latka figures of $50 million ARR and $50
      million revenue without a stated measurement period. Prospeo instead displays estimated
      annual revenue of $145 million and revenue per employee of $409,000, also without a
      disclosed period on the page. Revenue is not ARR, and an aggregator estimate is not an
      audited result, so these figures should not be blended into a synthetic run rate.
      Gross margin, software-versus-services mix, NRR, GRR, churn, CAC, payback, and sales
      cycle remain unavailable. Professional services and edge connectivity also make a
      pure-software margin assumption inappropriate until management supplies segment-level
      cost and revenue data.
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI016"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-verdict"
    title: "Capital adequacy and financial verdict"
    body: >-
      Capital raised is the most visible financial signal, but the retained databases disagree:
      Startup Fundraising reports $220 million, Silicon Valley Investment Club reports $290.9
      million, and Prospeo reports $200 million. Silicon Valley Investment Club separately
      reports a $120 million Series D in January 2026. That round size is financing raised, not
      cash available; it does not establish current burn, runway, debt, working-capital needs,
      or the next-round trigger. Prospeo's $464 million formula-based valuation is likewise an
      estimate derived from industry averages and estimated revenue, not a financing price.
      The financial verdict is cautious: Tulip has demonstrated access to capital and plausible
      recurring-software economics, but revenue quality, margin path, capital intensity, and
      liquidity cannot be underwritten until management reconciles the public metrics and
      supplies audited statements, cohort data, and a cash-to-runway bridge.
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
