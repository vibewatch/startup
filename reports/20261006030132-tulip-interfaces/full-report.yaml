      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Capital raised is the most visible financial signal, but the retained databases disagree: Startup
              Fundraising reports $220 million, Silicon Valley Investment Club reports $290.9 million, and Prospeo
              reports $200 million. Silicon Valley Investment Club separately reports a $120 million Series D in January
