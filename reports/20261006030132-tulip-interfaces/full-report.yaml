  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Compliance, Healthcare Quality Standards, and Legal Terms Risk
        blocks:
          - type: paragraph
            body: >-
              Deploying frontline applications in highly regulated industries such as life sciences, pharmaceutical
              manufacturing, medical devices, and defense operations imposes rigorous compliance mandates. Tulip asserts
              GxP readiness and FedRAMP Moderate equivalence, supporting digital batch release, electronic signatures,
              and automated audit trails. However, because Tulip relies on a no-code citizen-developer architecture,
              quality assurance teams face significant validation complexity when frontline personnel build custom
              workflows that touch validated production lines. Tulip mitigates platform-level liabilities through strict
              unilateral contractual provisions in its Acceptable Use Policy (AUP), which disclaims uptime guarantees,
              reserves unilateral suspension rights without prior notice or liability for policy violations, and
              prohibits users from testing system vulnerabilities or reverse engineering. Furthermore, public company
              databases display conflicting commercial scope, occasionally conflating Tulip Interfaces with unrelated
              retail POS platforms, highlighting market opacity regarding formal enterprise regulatory filings.
              Diligence must audit formal FDA 21 CFR Part 11 validation packages, SOC 2 Type II audit reports, and
              master subscription liability caps before production commitment.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
      - number: '7.2'
        title: Operational Reliability, Cloud Outage Exposure, and Citizen Developer Architecture Risk
        blocks:
          - type: paragraph
            body: >-
              Industrial manufacturing execution requires real-time, uninterrupted deterministic performance where
              unpredicted shop-floor latency or software outages can halt assembly lines, spoil temperature-sensitive
              pharmaceutical batches, and idle factory personnel. Independent uptime monitoring recorded official active
              performance incidents—such as the G15 performance degradation—demonstrating that multi-tenant cloud
              software architectures carry systemic availability risks for 24/7 industrial plants. While Tulip operates
              automated internal AI Solution Reviewer agents that execute a 10-phase architecture audit to catch poorly
              constructed app logic, unindexed data tables, and orphaned completion triggers, user-created no-code
              applications can easily degrade workstation responsiveness. If frontline operators introduce circular
              triggers or excessive database queries, client tablets experience latency without formal developer
              intervention. Tulip mitigates these failure modes through automated recommendations, best-practice
              frameworks, and Center of Excellence governance models, but customer operations remain vulnerable to
              factory network disconnection or cloud host disruption.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
