  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Spend Categorization, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Tulip operates in the industrial software domain, bridging frontline operations execution, digital work
              instructions, and composable shop-floor automation. Its addressable space sits between traditional
              monolithic Manufacturing Execution Systems (MES) and frontline worker productivity tools. Spend captured
              by Tulip encompasses digital work instruction authoring, quality tracking, electronic batch and device
              history records, machine monitoring via IoT connectors, and shop-floor app composition. Conversely,
              out-of-scope spend includes core ERP transactional accounting, automated facility warehouse management
              systems (WMS) backbones, and native heavy automation hardware. The primary status-quo substitute across
              discrete and batch manufacturing sites remains manual paper-based Standard Operating Procedures (SOPs),
              static PDF binders, and ad-hoc spreadsheet tracking, supplemented by custom internal software builds and
              legacy client-server MES platforms that suffer from high professional-services maintenance burdens and
              lengthy rollout cycles.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Market Sizing Lenses and Addressable Opportunity
        blocks:
          - type: paragraph
            body: >-
              Assessing Tulip's addressable market requires decomposing broad industrial automation aggregates into
              constrained segments. Global manufacturing software and discrete MES markets represent large multi-billion
              dollar categories, yet frontline-specific no-code operational software constitutes an emerging sub-segment
              characterized by bottom-up app development and agile deployment. Third-party firmographic profiles
              classify Tulip within NAICS 5112 (Software Publishers) and NAICS 334513 (Industrial Process Instruments),
              estimating operational revenues in the USD 10M to USD 100M tier, while secondary venture profiles track an
              ARR milestone of approximately USD 50M. Because independent third-party market sizing specifically
              isolating "composable frontline operations platforms" is rarely disaggregated from traditional MES
              forecasts, sizing must be evaluated through multiple lenses: top-down discrete MES spend, bottom-up
              manufacturing site seat expansion across estimated target facilities, and industrial AI application
              penetration across regulated and high-precision verticals.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
