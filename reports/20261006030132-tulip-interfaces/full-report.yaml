        title: Operational Scale, Infrastructure, and Resilience Tracking
        blocks:
          - type: paragraph
            body: >-
              Commercial adoption of the Tulip platform expanded substantially leading into 2026, driven by rapid
              customer uptake of generative AI capabilities and automated edge triggers. According to company
              operational disclosures, Tulip supported 43,000 active frontline applications across 1,000 customer sites
              in 45 countries during 2025, serving an aggregate base of over 60,000 frontline operators in complex
