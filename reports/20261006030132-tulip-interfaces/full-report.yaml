  - id: TV001
    title: Recommendation Summary
    columns:
      - Dimension
      - Assessment
      - Evidence Boundary
      - Decision Implication
    rows:
      - - Recommendation
        - Track
        - $1.3B financing mark is corroborated, but operating KPIs are not
        - Do not underwrite a new entry until financial and cap-table diligence is complete
      - - Confidence
        - Medium
        - Financing facts are corroborated; revenue quality is derivative and incomplete
        - Treat the call as evidence-sensitive rather than a durable fair-value conclusion
      - - Risk rating
        - Elevated
        - Financial opacity, preference uncertainty, and a current service incident remain open
        - Require downside protection and explicit thesis-break monitoring
      - - Valuation stance
        - Stretched
        - The $1.3B mark is about 26x only if the third-party $50M ARR estimate is accurate
        - Reject the multiple as an entry anchor until ARR, growth, NRR, and margins are verified
    notes: >-
      Assessments are analyst judgments as of 2026-10-06; the implied multiple is a sensitivity using an unverified
      third-party ARR estimate, not a company-reported valuation multiple.
