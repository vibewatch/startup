  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Frontline Operational Workflows
        blocks:
          - type: paragraph
            body: >-
              Tulip Interfaces defines its core offering as a composable frontline operations platform designed to
              replace static paper standard operating procedures (SOPs), manual clipboards, and rigid monolithic
              Manufacturing Execution Systems (MES). Rather than forcing discrete and process manufacturers into
              predetermined data schemas, Tulip provides a no-code visual authoring environment where manufacturing
              engineers, quality specialists, and operational leaders compose custom applications tailored directly to
              workstation requirements. These applications are executed at the physical shop-floor station using the
              Tulip Player—a dedicated, downloadable client application deployed across industrial tablets, PCs, and
              operator touchscreen terminals.

              Frontline workflows enabled by the platform span digital work instructions, inline quality tracking,
              dynamic machine changeover checklists, defect logging, and materials tracking. Operators interact with
              step-by-step interactive guidance featuring multilingual translation, rich visual assets, and conditional
              branching based on real-time sensor and instrument inputs. By standardizing execution directly at the
              station, Tulip captures contextualized execution records, automates cycle-time tracking, and eliminates
              manual data re-entry into back-office software, significantly reducing operator preparation overhead and
              assembly defects across high-mix manufacturing lines.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
