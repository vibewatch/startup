      - number: '1.3'
        title: Capitalization History, Strategic Alliances, and Investor Base
        blocks:
          - type: paragraph
            body: >-
              Tulip has raised more than $290M in cumulative institutional and strategic capital across six documented
              equity rounds since its 2016 Seed financing. Early institutional backing was anchored by New Enterprise
              Associates (NEA), Pitango Venture Capital, C4 Ventures, and Vertex Ventures US. The company subsequently
              deepened strategic corporate ties with industrial heavyweights: DMG MORI led the $39.5M Series B round in
              September 2019, Insight Partners led a $100M Series C in August 2021 alongside TIME Ventures, and
              Mitsubishi Electric Corporation led the pivotal $120M Series D in January 2026. Alongside its equity
              investment, Mitsubishi Electric executed a comprehensive strategic alliance agreement to co-develop
              AI-driven composable applications and accelerate digital transformation across its global factory
              footprint. Despite strong capitalization, detailed cap-table economics, liquidation preferences, and
              secondary trading market liquidity remain private, with secondary clearing mechanisms trading infrequently
              at estimated pre-IPO share valuations.
