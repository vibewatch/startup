      - number: '6.3'
        title: Named Customer Proof and Operational Outcomes
        blocks:
          - type: paragraph
            body: >-
              Documented customer deployments demonstrate tangible shop-floor improvements across quality control,
              throughput, and process compliance. At machine tool manufacturer DMG MORI, Tulip's connected workstation
              applications supported a paperless shop floor, contributing to a 20% production increase and a 62% to 66%
              reduction in reported defect rates. Terminal tractor manufacturer TICO Tractors leveraged Tulip to double
              production capacity while reducing quality inspection and rework times by 60%. In regulated life sciences
              and medical assembly, deployments at organizations such as Laerdal Medical and Sharp Packaging illustrate
              error-proofing via computer vision verification and accelerated clinical packaging cycles, though verified
              commercial contract sizes for these accounts are not disclosed.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
