  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Typical customer progression from localized cell-level deployment to enterprise-wide composable operations.
    data:
      items:
        - label: 1. Opportunity Discovery
          stage: Initial Discovery
          focus: Identification of shop-floor bottlenecks and manual tracking friction
          touchpoints:
            - Executive briefings and manufacturing trade show demonstrations
            - Benchmarking against traditional rigid MES deployment costs
            - Assessment of frontline paper-based SOPs and error rates
        - label: 2. Initial Cell Trial
          stage: Pilot Evaluation
          focus: Single line or workstation proof-of-value
          touchpoints:
            - Professional services Jumpstart engagement
            - No-code SOP and inspection app configuration
            - Edge IO connectivity to existing tools
        - label: 3. Line Modernization
          stage: Cell Rollout
          focus: Expansion across connected assembly cell
          touchpoints:
            - Operator feedback loops and citizen development
            - Vision verification and automated error-proofing
            - Local MES/ERP connector data synchronization
        - label: 4. Plant Standardization
          stage: Site Adoption
          focus: Facility-wide digital operations platform
          touchpoints:
            - Standardized eLogbooks and GxP compliance trails
            - Multi-station dashboarding and operational analytics
            - Citizen developer Center of Excellence enablement
        - label: 5. Multi-Site Scale
          stage: Enterprise Expansion
          focus: Global deployment across manufacturing network
          touchpoints:
            - Global enterprise license agreements
            - Corporate system integrator partner rollout
            - Cross-facility benchmarking and process governance
        - label: 6. Continuous Optimization
          stage: Long-term Value Creation
          focus: AI-driven frontline analytics and automated process refinement
          touchpoints:
            - Automated anomaly detection and computer vision quality checks
            - App library template sharing across operating divisions
            - Unified enterprise shop-floor data lake integration
    approximationNotes: Progression synthesized from documented enterprise deployment patterns and modular platform architecture.
    claimRefs:
