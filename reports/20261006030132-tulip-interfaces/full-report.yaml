            title: Proven Operational ROI Across Flagship Accounts
            body: >-
              Named customer studies demonstrate substantial operational benefits, including 60% reductions in rework
              time at TICO Tractors and over 60% defect reductions at DMG MORI, confirming strong product utility on the
              factory floor.
            calloutType: strength
            claimRefs:
