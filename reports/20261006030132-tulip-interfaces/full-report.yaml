      - number: '6.4'
        title: Retention, Expansion Dynamics, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Tulip's land-and-expand trajectory relies on citizen-led app creation, where initial success on a single
              assembly cell or production line motivates cross-facility rollouts and broader workstation licensing.
              However, official cohort-level retention figures, gross revenue retention (GRR), net revenue retention
              (NRR), and annual customer churn rates are not publicly released by the company. Furthermore, platform
              stability represents an operational dependency for connected factories; independent monitoring documented
              an active performance incident affecting the G15 infrastructure cluster, underscoring that unplanned
              downtime or cloud latency directly impacts frontline manufacturing throughput.
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
