      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Exposure
        blocks:
          - type: paragraph
            body: >-
              The executive team of Tulip Interfaces combines deep academic research roots from the MIT Media Lab with
              seasoned enterprise software leadership. Co-founder Natan Linder serves as Chief Executive Officer, having
              previously co-founded 3D-printing pioneer Formlabs, while co-founder Rony Kubat serves as Chief
              Information Officer and Chief Information Security Officer (CIO & CISO). They are supported by an
              executive bench that includes Yuval Marcus as Chief Financial Officer, Erik Mirandette as Chief Business
              Officer, and Mason Glidden as Chief Product and Engineering Officer, alongside operating executives.
              Operational principles emphasize human-centric digital transformation, gemba walks, and direct worker
              empowerment. However, key-person dependency remains concentrated in co-founder Natan Linder, whose
              external prominence and dual entrepreneurial commitments make executive succession and formal board
              governance critical diligence checkpoints for late-stage institutional investors.
            claimRefs:
