chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Heritage, and Stage
        blocks:
          - type: paragraph
            body: >-
              Tulip Interfaces, Inc. is a venture-backed industrial software company headquartered at 77 Middlesex
              Avenue in Somerville, Massachusetts, with international offices in Munich, Budapest, Singapore, Tel Aviv,
              and Tokyo. The enterprise was founded in 2012 by MIT Media Lab alumni Natan Linder and Rony Kubat, drawing
              upon more than a decade of research into human-computer interaction, computer vision, and ubiquitous
              computing on industrial shop floors. Incorporated in Delaware as a C-corporation, Tulip operates as an
              industrial Software-as-a-Service (SaaS) provider, commercializing a frontline operations platform that
              bridges the historical gap between rigid legacy Manufacturing Execution Systems (MES) and frontline
              shop-floor workers. The company reached late-stage unicorn status in January 2026 following a $120M Series
              D financing round that established a post-money valuation of $1.3B, cementing its position as an agile,
              AI-enabled layer for discrete manufacturing and regulated industrial environments.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
