      - number: '6.2'
        title: Adoption Trajectory and Operational Footprint
        blocks:
          - type: paragraph
            body: >-
              Tulip's deployment footprint has expanded from early academic and prototyping environments into scaled
              factory operations, reporting over 43,000 connected applications, 60,000 active frontline workers, and
              1,000 customer sites globally. The company leverages a hybrid go-to-market motion combining direct
              enterprise sales targeting large multinational production networks with system integrator and
              machine-builder distribution partners such as DMG MORI. While the operational reach across 45 countries
              indicates broad international traction, comprehensive public disclosure of active user retention,
              account-level expansion trajectories, and aggregate customer count historical growth series remains
              limited.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
