              - CU010
          - type: callout
            title: Retention Opacity and Cloud Infrastructure Availability
            body: >-
              Absence of public cohort retention data obscures underlying customer durability, while cloud performance
              degradation incidents (such as G15 performance issues) pose direct operational availability risks to
              factory lines.
            calloutType: risk
            claimRefs:
              - CU014
