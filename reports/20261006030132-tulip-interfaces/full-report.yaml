  - id: FE001
    title: Tulip Interactive Frontline Architecture Stack
    type: stack
    summary: >-
      End-to-end architectural stack illustrating shop-floor physical integration through cloud governance and
      enterprise intelligence.
    data:
      layers:
        - label: Frontline Interface & Execution Layer
          detail: >-
            Tulip Player deployed on industrial tablets, PC stations, and mobile devices executing no-code operational
            apps.
        - label: Edge Hardware & Field Device Layer
          detail: >-
            Edge IO devices, machine sensors, smart cameras, pick-to-light controllers, and barcode scanners connected
            via physical interfaces.
        - label: Industrial Machine Protocol Layer
          detail: >-
            OPC UA servers, MQTT brokers, and native equipment drivers communicating with PLCs, CNC machines, and
            factory historians.
        - label: Integration & Connector Host Layer
          detail: >-
            On-premises and cloud Connector Hosts brokering bi-directional HTTP REST APIs, SQL databases, and Unified
            Namespace (UNS) event brokers.
        - label: Core Application & Data Management Layer
          detail: >-
            Multi-tenant cloud platform managing Workspaces, App Editor, Tulip Tables common data models, and trigger
            execution logic.
        - label: Enterprise Systems Integration Layer
          detail: Bi-directional transactional exchange with ERP, MES, PLM, QMS, WMS, CMMS, and cloud data warehouses.
        - label: Intelligence, Governance & Security Layer
          detail: >-
            Frontline industrial AI agents, GxP electronic batch records (21 CFR Part 11), SAML SSO, and FedRAMP
            Moderate compliance controls.
    approximationNotes: >-
      Logical architectural layer diagram synthesized from official Tulip Interactive Reference Architecture and
      technical solution documentation.
