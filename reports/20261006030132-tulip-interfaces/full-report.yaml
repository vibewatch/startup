              debt, working-capital needs, or the next-round trigger. Prospeo's $464 million formula-based valuation is
              likewise an estimate derived from industry averages and estimated revenue, not a financing price. The
              financial verdict is cautious: Tulip has demonstrated access to capital and plausible recurring-software
              economics, but revenue quality, margin path, capital intensity, and liquidity cannot be underwritten until
              management reconciles the public metrics and supplies audited statements, cohort data, and a
