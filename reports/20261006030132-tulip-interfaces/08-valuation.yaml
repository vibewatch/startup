company:
  name: "Tulip Interfaces"
chapter:
  number: 8
  title: "Valuation"
  summary: "Tulip's January 2026 Series D established a reported $1.3B post-money valuation, but public evidence does not verify the revenue quality, retention, margins, preference terms, or exit path needed to underwrite that price. The resulting stance is track rather than invest: product breadth and strategic backing are credible, while the valuation remains stretched against the limited and partly conflicting financial evidence."
sections:
  - id: "financing-and-entry-discipline"
    title: "Financing Context, Price Support, and Recommendation"
    body: >-
      Two independent market-data sources and Tulip's press index align on a $120M
      Series D led by Mitsubishi Electric and a January 2026 post-money valuation of
      $1.3B. The agreement stops there: Multiples reports $273M raised across five
      rounds, while the Silicon Valley Investment Club tear sheet reports $290.9M
      across six rounds. The latter also says no round-level EV/revenue multiple is
      disclosed and repeats a $50M ARR figure attributed to Latka rather than to
      audited company reporting. If that estimate were accurate, the financing mark
      would equal roughly 26x ARR, but this is a sensitivity calculation rather than
      a verified trading multiple. Public evidence therefore supports a track
      recommendation, medium confidence, elevated financial risk, and a stretched
      valuation stance. Entry should wait for an ARR bridge, cohort retention, gross
      margin, cash burn, cap-table, and preference waterfall that can support the
      price without relying on a derivative estimate.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
    tableRefs:
      - "TV001"
  - id: "thesis-and-anti-thesis"
    title: "Thesis, Anti-Thesis, and Operating Proof"
    body: >-
      The thesis is that Tulip has built a broad operating layer rather than a narrow
      point tool. Its own materials describe product teams spanning app building,
      edge connectivity, analytics, platform infrastructure, and SaaS operations,
      while the main site offers short implementation programs and publishes customer
      outcome testimonials. The press index also shows continuing launches, security
      positioning, and partnerships. These signals make strategic distribution and
      expansion plausible, but they remain company-issued and do not establish
      recurring revenue quality. The anti-thesis is that a global cost base and broad
      product ambition may consume capital before commercial proof catches up. Tulip's
      careers materials describe cross-functional activity across multiple regions,
      and the Somerville and Budapest pages confirm physical operating footprints,
      but none disclose headcount by function, sales efficiency, or burn. An
      independent monitoring page also showed an active major performance issue,
      making reliability evidence a live diligence item rather than a presumed
      strength.
    claimRefs:
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV002"
  - id: "scenarios-and-exit-readiness"
    title: "Scenario Logic, Comparables, and Exit Readiness"
    body: >-
      The available comparable set is useful only as a boundary check. Multiples lists
      public-company revenue multiples from 1.9x to 6.8x for KPIT Technologies, Imdex,
      and Zwsoft, and a 12.0x figure for private software company Nerdio. These
      businesses differ from Tulip in growth, margins, geography, and product mix, so
      none is a direct valuation anchor. The scenario table therefore separates
      observable reference points from assumptions and declines to assign probability
      percentages that public data cannot support. A bull case requires verified
      growth and retention strong enough to defend or exceed the $1.3B mark; a base
      case recognizes commercial promise but demands a discount for missing KPIs; a
      bear case combines multiple compression with weak revenue verification. Exit
      readiness is also unproven: no assigned source supplies an IPO timetable,
      transaction-ready financials, secondary liquidity depth, or relevant M&A
      precedent. The recommendation should change only after those gaps close, not
      because a financing round itself is treated as proof of fair value.
    claimRefs:
      - "CV001"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV011"
      - "CV016"
    tableRefs:
      - "TV003"
    figureRefs:
      - "FV001"
