      - "Anti-Thesis / Limitation"
      - "What Would Change the View"
    rows:
      - - "Product breadth"
        - "Company materials span app authoring, edge, analytics, platform, and SaaS operations"
        - "Breadth is company-described and may increase implementation and support complexity"
        - "Independent usage depth and gross-retention evidence across modules"
      - - "Implementation motion"
        - "Tulip advertises a 1-week Jumpstart and a 6-week Proof of Value"
        - "Short pilots do not establish expansion, renewal, or production-scale economics"
        - "Cohort conversion from pilot to paid multi-site deployment"
      - - "Customer outcomes"
        - "The homepage displays defect and preparation-cost improvement testimonials"
        - "The fetched page does not provide sample size, baseline, period, or audited attribution"
        - "Customer-verified case data with denominators and contract expansion"
      - - "Operating footprint"
        - "Careers pages show cross-functional activity in North America, Europe, and Asia"
        - "Geographic breadth can increase fixed cost while public burn and efficiency remain unknown"
        - "Function-level headcount, quota attainment, CAC payback, and runway"
    notes: "Company-issued product, careers, and testimonial evidence is treated as directional; it is not an independent benchmark of retention, efficiency, or customer ROI."
    claimRefs:
      - "CV009"
      - "CV010"
      - "CV012"
      - "CV013"
      - "CV014"
      - "CV015"
  - id: "TV003"
    title: "Bull, Base, and Bear Valuation Scenarios"
    columns:
      - "Scenario"
      - "Explicit Assumptions"
      - "Valuation / Return Logic"
      - "Probability Signal"
      - "Downside or Thesis-Break Trigger"
    rows:
      - - "Bull"
        - "Verified ARR, growth, NRR, and gross margin justify a premium; strategic channels diversify demand"
        - "At or above $1.3B could be defensible, but public evidence provides no supportable upper bound"
        - "Not quantifiable until audited KPIs and cohort data are disclosed"
        - "Channel concentration or retention below management's underwriting case"
      - - "Base"
        - "Commercial product breadth is real, but the $50M ARR estimate remains unverified"
        - "Value should sit below the current mark unless quality and growth bridge the gap to premium SaaS references"
        - "Current public evidence favors this cautious case without supporting a percentage"
        - "No ARR bridge, weak multi-site expansion, or financing terms that subordinate new money"
      - - "Bear"
        - "Growth disappoints and the multiple compresses toward the cited 1.9x-6.8x public reference range"
        - "On the unverified $50M input, a mechanical $95M-$340M output illustrates sensitivity, not fair value"
        - "Becomes more likely if reliability, renewal, or cash-runway evidence deteriorates"
        - "Material outage, down round, shrinking cohorts, or runway below the investment horizon"
    notes: "Ranges are scenario sensitivities, not forecasts. Public comparables are not direct peers, the $50M ARR input is derivative, and no probability percentage is supportable from the assigned evidence."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV011"
