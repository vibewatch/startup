    claimRefs: [CP002, CP004, CP005, CP006, CP015]
callouts:
  - calloutType: insight
    title: The moat is unproven
    body: "Keyuan has historical scale signals, but the retained evidence does not establish a current product-level advantage against better-documented PLA, PBAT and integrated chemical competitors."
    claimRefs: [CP015, CP016]
  - calloutType: risk
    title: Oversupply and trust are separate risks
    body: "Capacity expansion can pressure industry pricing, while the historical SEC enforcement record makes current controls and customer trust a separate diligence axis."
    claimRefs: [CP011, CP013]
