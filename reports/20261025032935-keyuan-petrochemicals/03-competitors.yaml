slug: keyuan-petrochemicals
runDate: 2026-10-25
company:
  name: Keyuan Petrochemicals
chapter:
  number: 3
  title: Competitors
  summary: Keyuan sits in a broad Chinese chemicals and advanced-materials arena rather than a demonstrably protected niche. Public evidence identifies credible PLA, PBAT, PBS and specialty-material competitors, but does not disclose enough comparable Keyuan product, capacity, pricing or customer data to prove a durable advantage.
sections:
  - id: landscape
    title: Competitive landscape and substitutes
    body: >-
      The relevant competitive set spans integrated petrochemical producers, biodegradable-material
      specialists, compounders and the status quo of conventional plastics. The China bioplastics
      evidence names Hisun Biomaterials, TotalEnergies Corbion PLA, BBCA, COFCO, Kingfa, BASF,
      NatureWorks, Novamont, Danimer, eSUN, Huafon and others, while a separate company directory
      lists Arkema, Braskem, Eastman, Indorama, LyondellBasell and Zhejiang Hisun. This breadth
      matters because a buyer can substitute polymer chemistry, formulation, supplier geography or
      simply retain conventional resin where regulation and customer commitments permit. Keyuan's
      public materials do not establish which of these jobs it wins or whether its present perimeter
      is comparable to the named peers.
    claimRefs: [CP001, CP002, CP003]
    tableRefs: [TP001]
  - id: profiles
    title: Peer profiles and scale signals
    body: >-
      The strongest public scale signals are competitor-specific rather than Keyuan-specific. Jindan
      New Biomaterials describes a two-phase L-Lactide and polylactic-acid project with 10,000 tons
      of initial annual capacity and a stated 100,000-to-150,000-ton potential after full operation.
      Industry reporting places Jindan and Anhui BBCA among Chinese PLA leaders above 100,000 tons,
      while Kingfa is reported as the largest PBAT-capacity holder at 15% and Changhong High-Tech
      and Blue Ridge Tunhe at 9% each. These are capacity indicators, not revenue, realized
      utilization or margin comparisons. Keyuan's own 2010 release described 550,000 metric tons
      of petrochemical design capacity and a planned 70,000-ton SBS addition, but those historical
      company claims do not establish current product scale or share.
    claimRefs: [CP004, CP005, CP006, CP007]
    tableRefs: [TP002]
  - id: buying
    title: Buyer trade-offs, pricing and distribution
    body: >-
      Buyers appear to choose among material families and suppliers on performance, certification,
      availability, conversion support, price and regulatory fit. The market source identifies
      packaging as the largest end-user segment and PLA as the leading subsegment, while the China
      industry article reports that PLA and PBAT together account for more than 80% of domestic
      biodegradable-plastics capacity. The assigned evidence contains no comparable public price
      sheets or realized contract prices for Keyuan or its peers, so a capability matrix can identify
      decision criteria but must leave price, discounting, switching cost and customer concentration
      unknown. Supplier qualification and formulation know-how may create friction, but no retained
      source quantifies it for Keyuan.
    claimRefs: [CP008, CP009, CP010]
    tableRefs: [TP003]
  - id: durability
    title: Moat durability and displacement risk
    body: >-
      The evidence supports a scale-and-compliance hypothesis, not a proven moat. Capacity expansion
      can improve availability and cost, but the same expansion can commoditize resin and pressure
      margins. A 2026 competitor report warns that planned PBAT capacity could create supply-demand
      imbalance and lower industry profitability; it also identifies raw-material volatility, safety
      and policy execution as material risks. The SEC's 2013 enforcement release is not evidence about
      current operations, but it is relevant adverse history for trust and governance diligence: the
      Commission charged Keyuan over undisclosed related-party transactions, books-and-records and
      internal-control violations. Until current product KPIs, customer references, certifications,
      pricing and controls are independently verified, displacement and trust risk remain material.
    claimRefs: [CP011, CP012, CP013, CP014]
    figureRefs: [FP001]
  - id: synthesis
    title: Investment interpretation
    body: >-
      Keyuan's competitive position is therefore best treated as an open underwriting question.
      Its retained public record provides historical capacity and filing-derived financial signals,
      while the peer set demonstrates that the addressable arena includes better-documented
      producers and global chemical companies. The public record does not show whether Keyuan
      competes through lower cost, differentiated formulations, feedstock access, customer
      qualification, local distribution or a protected process. A diligence-ready conclusion is
      to track rather than underwrite a durable moat: request a product-by-product competitor
      win/loss file, current capacity and utilization, realized price waterfall, certification
      portfolio, top-customer concentration, and evidence that current governance controls address
      the historical SEC concerns.
    claimRefs: [CP015, CP016]
