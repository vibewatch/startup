              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Keyuan's official English surface describes a Hong Kong-invested group producing refined petrochemical
              products, synthetic rubbers, and thermoplastic elastomers from two mainland China production bases in
              Ningbo and Fangchenggang. This is a product portfolio and footprint statement, not proof of current
              utilization, realized pricing, or customer outcomes. A 2025 media account describes the subsidiary Keyuan
              Fine Chemical as making more than 30 high-end fine-chemical products, including solvents and chemical
              cleaning agents, for chemical, textile-dyeing, pharmaceutical, food, precision-electronics, and optical
              applications. The same account links SBS to tires and shoe materials and describes ABS as part of a larger
              integrated project. The workflow therefore appears to be industrial formulation and bulk production for
              downstream manufacturers, with product qualification, lot consistency, safety documentation, and delivery
              reliability as the likely buyer gates; public sources do not expose the relevant pass/fail data.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
