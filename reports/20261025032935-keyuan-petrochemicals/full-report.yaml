  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Illustrative residual-risk map based on disclosed dependencies and evidence gaps; it does not assert that an
      incident has occurred.
    data:
      columns:
        - label: Likelihood / impact
          detail: Analytical placement, not a measured probability
        - label: Medium impact
          detail: Could impair a site or quarter
        - label: High impact
          detail: Could impair liquidity or continuity
        - label: Critical impact
          detail: Could break the investment thesis
        - label: Extreme impact
          detail: Could force prolonged remediation or restructuring
        - label: Catastrophic impact
          detail: Could terminate the investment case
      rows:
        - label: Low likelihood
          note: No retained evidence establishes a low likelihood; row is a monitoring baseline.
          values:
            - Low likelihood
            - null
            - Environmental enforcement
            - Major incident
            - Regulatory shutdown
            - Fatality
        - label: Medium likelihood
          note: Used where public evidence describes exposure but not frequency.
          values:
            - Medium likelihood
            - Trading-control breach
            - Logistics interruption
            - Plant outage
            - Major recall
            - Restructuring
        - label: High likelihood
          note: Used for structural exposures such as commodity and working-capital volatility.
          values:
            - High likelihood
            - Quality claim
            - Feedstock shock
            - Liquidity squeeze
            - Covenant breach
            - Insolvency
    approximationNotes: >-
      Likelihood and impact are qualitative analyst classifications anchored to disclosed operating dependencies,
      historical financial structure, and explicit evidence gaps; no numeric probabilities are implied.
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR010
      - CR014
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Operating evidence and valuation signals are filtered through disclosure and downside risk before reaching the
      research-more recommendation.
    data:
      nodes:
        - id: scale
          label: Operating platform
          detail: Two bases, petrochemical products, and feedstock/logistics capabilities
        - id: mark
          label: 2026 valuation signal
          detail: 7.5 billion yuan Hurun valuation
        - id: gap
          label: Underwriting gap
          detail: Current earnings, cash flow, cap table, debt, and preference terms unavailable
        - id: risk
          label: Downside tests
          detail: Margins, cash conversion, leverage, dilution, and liquidity
        - id: call
          label: Recommendation
          detail: Research-more; require current financial and financing evidence
        - id: entry
          label: Entry condition
          detail: Obtain audited accounts, cap table, and executed financing terms
      edges:
        - - scale
          - gap
        - - mark
          - gap
        - - gap
          - risk
        - - risk
          - call
        - - call
          - entry
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV011
      - CV014
