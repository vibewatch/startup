              - CE004
              - CE009
              - CE011
              - CE012
      - number: '5.2'
        title: Operating architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              The disclosed architecture is physical and process-led rather than software-led: upstream feedstock and
              pretreatment, chemical conversion and polymer production, storage and loading, and downstream
              product/application channels. A 2010 company release described 550,000 metric tons of annual petrochemical
              manufacturing design capacity, storage and loading facilities, and process technology intended to support
              low raw-material costs, utilization, and yields; it also announced an SBS facility planned to add 70,000
              metric tons by the end of 2011. These are historical design and forward-looking disclosures, not current
              operating measurements. The 2025 media account reports a 1.2-million-metric-ton-per-year
              ABS-and-supporting-unit project and a claimed roughly 20% cost reduction from integrated raw-material
              production, but this remains a reported claim without plant-level validation in the retained evidence. The
              product architecture is consequently credible as an industrial configuration but not yet
              diligence-complete on current maturity.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE008
              - CE009
              - CE010
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE006
              - CE008
      - number: '5.3'
        title: Differentiation, reliability, and control gaps
        blocks:
          - type: paragraph
            body: >-
              Potential differentiation rests on integration, location, product breadth, and process know-how rather
              than a publicly demonstrated proprietary software moat. The official site emphasizes two production bases;
              the 36Kr account attributes resilience to an upstream-to-production-to-application chain; and the
              historical release described low raw-material-cost and high-utilization/yield technology. Those signals
              support a hypothesis of supply and conversion advantages, but they do not establish defensible
              intellectual property, current yield, quality consistency, environmental performance, or switching costs.
              The adverse SWOT source specifically flags aging-technology risk, modernization needs, commodity exposure,
              and rising environmental-compliance costs. A sector article on biodegradable plastics shows a
              fast-expanding and highly competitive PLA/PBAT supply landscape, while a public peer quote page
              illustrates that even a listed biomaterials peer's market data does not substitute for Keyuan's own
              product KPIs. The key technical diligence ask is a current, SKU-level evidence pack covering
              specifications, batch failures, uptime, maintenance, emissions, certifications, customer qualification,
              incident history, and roadmap milestones.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
              - CE016
      - number: '5.4'
        title: Product and technology verdict
        blocks:
          - type: paragraph
            body: >-
              On the current record, Keyuan looks like a real, asset-backed industrial producer with a broad materials
              surface, not a purely promotional software concept. The evidence is strongest for historical capacity,
              named product families, two-base operations, and an integrated manufacturing thesis. It is weakest for
              present-day plant performance, product qualification, quality systems, safety and environmental controls,
              proprietary technology, and delivery against the newer ABS and biodegradable-materials ambitions. Current
              unicorn coverage confirms private-company and valuation context but adds no technical validation.
              Investors should therefore treat integration and location as hypotheses to test rather than underwrite
              them as durable moats. A site visit, current certificates and permits, SKU technical data, customer
              qualification records, maintenance and outage logs, and project commissioning evidence are required before
              assigning a high-confidence technology or execution premium.
            claimRefs:
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Asset-backed industrial base
            body: >-
              The official footprint and historical capacity disclosures support a genuine manufacturing platform, but
              current utilization and quality evidence are not public.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
          - type: callout
            title: Modernization and verification risk
            body: >-
              Aging-technology and environmental-compliance concerns are explicitly raised by the adverse source, while
              current technical KPIs and control records remain unavailable.
            calloutType: risk
            claimRefs:
              - CE010
              - CE013
          - type: callout
            title: Require plant-level evidence before underwriting a moat
            body: >-
              Treat integration, cost savings, and product breadth as diligence hypotheses until current SKU, yield,
              uptime, certification, and customer-qualification records are produced.
            calloutType: recommendation
            claimRefs:
              - CE009
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and use-case segmentation
        blocks:
          - type: paragraph
            body: >-
              Keyuan's public customer picture is organized around industrial applications rather than a disclosed
              account base. Company releases place SBS in shoe soles and tire treads and Butadiene Styrene Resin in
              packaging, medical instruments, toys, and other plastic products. A 2025 36Kr article broadens the
              described end markets to chemicals, printing and dyeing, pharmaceuticals, food, precision electronics, and
              optics, while a separate PLA market summary identifies food packaging, disposable tableware, medical
              devices, and automotive parts as downstream applications. These records support a diversified set of
              possible buyers, but they do not identify payer entities, current product-level revenue, geography, order
              frequency, or customer size bands. The segmentation is therefore an evidence-bounded map of applications,
              not a verified revenue mix.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU012
      - number: '6.2'
        title: Adoption trajectory and durability
        blocks:
          - type: paragraph
            body: >-
              The strongest public adoption signals are production scale, historical revenue, and market demand rather
              than customer retention. Keyuan stated in 2010 that domestic SBS demand was projected at 750,000 metric
              tons against 600,000 metric tons of production capacity, and company materials described a
              550,000-metric-ton annual design capacity after production began in October 2009. Later reporting supplied
              revenue figures for 2020 through the first three quarters of 2023 and described more than 50 Fortune 500
              customers, but neither source provides active-account definitions or comparable customer cohorts. External
              market sources show rapid PLA consumption and PBAT capacity growth, which create end-market opportunity
              alongside supply competition. None of these measures is a substitute for shipments by customer, repeat
              purchases, renewals, or account-level profitability.
            claimRefs:
              - CU002
              - CU005
              - CU006
              - CU009
              - CU010
              - CU011
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU005
              - CU006
              - CU009
              - CU010
              - CU011
              - CU014
      - number: '6.3'
        title: Named proof, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence names Bridgestone and Adidas among a reported group of more than 50 Fortune 500
              customers, but it supplies no contracts, facilities, products, volumes, dates, production status, or
              outcomes for those relationships. The Ningbo Institute of Technology agreement is useful evidence of an
              R&D partnership, not a customer deployment. Historical financing and balance-sheet records also show that
              production required substantial raw-material working capital and that reported current liabilities
              exceeded current assets in the displayed historical periods; this raises a durability question when
              customer payment terms and advances are not disclosed. Current external recognition in 2026 confirms that
              Keyuan remained visible as a private industrial company, but it does not validate retention or
              concentration. Underwriting therefore requires a current customer ledger, invoice-backed revenue bridge,
              contracts, and references.
            claimRefs:
              - CU005
              - CU007
              - CU008
              - CU013
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU005
              - CU007
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad industrial application surface
            body: >-
              The retained record spans footwear, tires, packaging, medical products, process industries, precision
              manufacturing, and biodegradable-plastic applications, supporting a wide potential buyer set.
            calloutType: strength
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU012
          - type: callout
            title: Customer durability is not underwritten
            body: >-
              No retained source supplies current retention, repeat-purchase, contract-duration, customer-level
              profitability, or top-account concentration data.
            calloutType: risk
            claimRefs:
              - CU015
          - type: callout
            title: Require account-level proof
            body: >-
              Obtain a current top-20 customer schedule, contracts, invoices, shipment history, payment terms, renewal
              or repeat-order cohorts, and references for Bridgestone and Adidas.
            calloutType: recommendation
            claimRefs:
              - CU005
              - CU007
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk posture and evidence limits
        blocks:
          - type: paragraph
            body: >-
              Keyuan describes an integrated model linking international feedstock imports, downstream processing,
              storage, and logistics. Its own materials state that the group imports approximately 7 million tonnes of
              feedstock per annum and that trading decisions are driven by technical suitability, blending
              considerations, logistics constraints, and execution risk. That integration can reduce some procurement
              friction, but it also concentrates exposure in a physically complex chain: imported commodities, port and
              storage availability, processing uptime, product quality, and cross-border execution. The two current
              company pages are substantially syndicated, so they should be treated as one issuer voice rather than
              independent corroboration. Public evidence does not establish current plant utilization, incident history,
              insurance coverage, customer concentration, or a consolidated parent-level debt and covenant package. The
              risk conclusion is therefore not that a failure has been observed; it is that the downside cannot be
              underwritten confidently without current primary records.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.2'
        title: Regulatory, legal, and operating risks
        blocks:
          - type: paragraph
            body: >-
              Petrochemical production and trading create coupled safety, environmental, permitting, and logistics
              risks. Keyuan's own pages emphasize operational safety, regulatory compliance, and risk control, but those
              assertions do not substitute for current permits, inspection outcomes, emissions data, hazardous-material
              procedures, or incident logs. Historical company financing material also warns that forward-looking
              statements involve inherent risks and uncertainties and identifies SEC-filed risk factors as relevant. A
              third-party 2025 analysis of the comparable Ningbo Changhong Polymer business illustrates the sector
              mechanism rather than proving a Keyuan incident: raw-material volatility can compress margin,
              production-flow adjustments can constrain output, technical shutdowns can reduce earnings, and
              hazardous-chemical operations retain accident exposure. For Keyuan, the appropriate diligence test is a
              site-level control package tying permits, maintenance backlog, quality releases, near misses, and
              insurance to each operating entity.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
              - CR007
              - CR010
              - CR011
      - number: '7.3'
        title: Financial, partner, and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The available financial record is stale and concerns the historical public Keyuan Petrochemicals, Inc.
              perimeter rather than a verified current private-company perimeter. ReadyRatios reproduces 2015 current
              liabilities of $783.821 million and 2015 debt of $783.000 million, while also showing 2015 cash of $12.309
              million; those figures are not current solvency measures, but they demonstrate why entity perimeter and
              refinancing history matter. The 2010 financing release says $20.3 million was raised to purchase raw
              materials and included preferred stock and warrants, while also containing explicit forward-looking
              language. Current third-party coverage reports an 80 billion yuan valuation for Keyuan Fine Chemical, and
              China Daily reports a 7.5 billion yuan valuation for Keyuan Petrochemicals in the 2026 index; the
              differing names, dates, and perimeters make valuation and financing linkage unresolved rather than
              contradictory proof. Diligence should obtain audited consolidated statements, debt maturities, guarantees,
              working-capital facilities, cap table, liquidation preferences, and the exact relationship among Keyuan
              Petrochemicals, Keyuan Fine Chemical, and related operating entities.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR012
              - CR013
      - number: '7.4'
        title: Monitoring, mitigation, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              A reasonable monitoring plan should focus on measurable leading indicators rather than broad assurances.
              Monthly checks should cover feedstock volume and spread realization, inventory days, receivables aging,
              plant utilization, unplanned downtime, quality claims, near misses, permit exceptions, and covenant
              headroom. A thesis break would be a material safety or environmental enforcement event, repeated quality
              failures or an unplanned outage that interrupts contracted supply, a sustained inability to pass feedstock
              costs through to customers, or refinancing that increases secured debt and weakens liquidity. A separate
              valuation break would be a financing or independent mark materially below the latest reported private
              valuation without an explainable operating improvement. These are diligence and monitoring triggers, not
              claims that any threshold has already been breached. The current record supports research-more rather than
              a clean risk clearance because the most decision-relevant controls and financial statements are not
              public.
            claimRefs:
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR010
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break risk
            body: >-
              The highest-consequence unknown is not a single reported incident but whether current safety,
              environmental, quality, and liquidity controls are strong enough for a feedstock-intensive integrated
              operation. Obtain entity-level primary records before underwriting scale or valuation.
            calloutType: risk
            claimRefs:
              - CR005
              - CR010
              - CR014
          - type: callout
            title: Diligence gate
            body: >-
              Treat the latest private valuation as a reference point, not proof of realizable value, until audited
              current financials, financing terms, entity perimeter, and operational-control evidence reconcile.
            calloutType: recommendation
            claimRefs:
              - CR012
              - CR013
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Keyuan has evidence of a multi-base industrial platform rather than a purely financial construct: its own
              group description names two mainland production bases and products spanning refined petrochemicals,
              synthetic rubbers, and thermoplastic elastomers, while the technical-capabilities material describes
              feedstock handling, logistics, specification control, and risk management. The valuation signal is also
              current enough to matter: China Daily reports a 2026 Hurun valuation of 7.5 billion yuan and a second
              consecutive recognition. Those facts establish operating breadth and an external valuation mark, not
              investable equity value. The public record does not provide current revenue, EBITDA, free cash flow,
              ownership, liquidation preferences, debt covenants, or a current financing price. Accordingly, a buy
              recommendation would imply unsupported assumptions about earnings quality and dilution. Research-more is
              the price-sensitive call until a current cap table and audited financial pack are obtained.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV011
              - CV014
      - number: '8.2'
        title: Thesis, anti-thesis, and comparable signals
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is that an integrated heavy-oil-to-products chain, two production locations, and
              operating capabilities in feedstock switching, throughput optimization, quality verification, and
              cross-border logistics could support resilience and optionality across petrochemical cycles. The
              anti-thesis is that commodity exposure and capital intensity can make scale look better than value: an
              older company release described a $20.3 million placement used to purchase raw materials, while historical
              SEC-derived statements are not a substitute for current parent-level accounts. A 36Kr report provides a
              stronger but still non-transactional financing chronology, including a 2025 D-round valuation of 8 billion
              yuan. Public-market context also argues against a headline-only valuation: Yahoo Finance displayed Hisun
              Biomaterials at a 3.02 billion yuan market capitalization and 3.12 price-to-sales ratio, while a 2025
              report on the Keyuan-system company Changhong described revenue growth alongside a loss and negative
              operating cash flow. Neither company is a direct valuation proxy for Keyuan. The relevant comparable set
              is therefore triangulation, not a single peer multiple, and requires aligned earnings, debt, perimeter,
              and security terms.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV016
      - number: '8.3'
        title: Scenarios, downside triggers, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              A scenario range can be framed qualitatively because the key denominator is missing. In the bull case,
              current valuation is supported by verified utilization, product mix, cash conversion, and a clean
              preference stack. In the base case, the company remains strategically credible but the 7.5 billion yuan
              mark is treated as an indicative private valuation rather than a realizable exit price. In the bear case,
              weak margins, working-capital absorption, leverage, or a down-round expose common equity to dilution and
              preference overhang. The next diligence request should obtain monthly management accounts, facility-level
              capacity and utilization, customer and product gross margins, debt and covenant schedules, the current cap
              table, preference terms, and evidence supporting the 2026 valuation. A thesis break occurs if management
              cannot reconcile valuation to current operating metrics, if cash conversion is persistently negative
              without committed financing, or if an independent financing process prices the equity materially below the
              headline mark.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate observed valuation references from analyst interpretation. Historical financing and
              public-company benchmark data are retained for context only; they do not establish current Keyuan revenue,
              cash, enterprise value, or ownership. Nulls and open questions are intentional where the assigned public
              sources do not disclose a reliable current figure. This distinction is especially important for a private
              industrial company whose operating footprint can be credible while its common-equity price remains
              untestable. The current 7.5 billion yuan Hurun mark, the reported 8 billion yuan D-round valuation, and
              listed-company market data use different methods and security contexts. They should not be blended into an
              implied return or treated as evidence of a down-round.
            claimRefs:
              - CV003
              - CV004
              - CV008
              - CV010
              - CV011
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline
            body: >-
              The 7.5 billion yuan mark is a valuation reference, not sufficient evidence of a fair common-equity entry
              price; request current terms before underwriting.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV011
          - type: callout
            title: Missing denominator
            body: >-
              Without current revenue, cash flow, debt, ownership, and preference data, precise target returns or a
              numerical valuation range would be false precision.
            calloutType: risk
            claimRefs:
              - CV011
              - CV012
              - CV013
