      - number: '4.3'
        title: Cost structure and capital dependency
        blocks:
          - type: paragraph
            body: >-
              The operating model is exposed to feedstock prices, inventory funding, utilization, maintenance, and
              expansion capex. 36Kr reports that an integrated ABS project reduced costs by about 20%, while the legacy
              company raised $20.3 million in 2010 specifically to purchase raw materials and described capacity
              additions involving storage, pretreatment, asphalt, and SBS facilities. Those historic records show why
              working capital and fixed assets matter, but not today's obligations. As an external benchmark, a 2025
              PLA-industry review put corn at 47% of PLA production cost; that is not a Keyuan cost ratio. A related
              listed-company signal is adverse: Changhong High-tech reported a 2025 net loss and negative operating cash
              flow alongside higher borrowing, but that affiliate evidence cannot be substituted for Keyuan parent
              accounts.
            claimRefs:
              - CI003
              - CI005
              - CI009
              - CI015
              - CI016
      - number: '4.4'
        title: Capital adequacy remains the underwriting blocker
        blocks:
          - type: paragraph
            body: >-
              The financing evidence establishes valuation events, not liquidity. A user-authored Eastmoney post
              reported a first D-round tranche and an RMB 8.0 billion valuation in 2025; China Daily later reported a
              Hurun valuation of RMB 7.5 billion and rank 1,209 in 2026. Hurun explains that its index uses recent
              financing and comparables, with a January 1, 2026 cut-off and selected updates through publication.
              Neither valuation discloses proceeds, unrestricted cash, debt, covenants, project-finance recourse, burn,
              or runway. The financial verdict is therefore cautious: revenue scale and integration may support an
              industrial margin path, but current revenue quality, cash conversion, leverage, and next-round dependency
              remain unverified. Underwriting should require consolidated audited accounts, a debt schedule,
              working-capital aging, capex commitments, and product-level gross-margin waterfalls.
            claimRefs:
              - CI012
              - CI013
              - CI014
