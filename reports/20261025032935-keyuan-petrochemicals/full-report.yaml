chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Keyuan's current public-facing materials describe an integrated fine-chemicals and
              refinery-derived-products group that imports, processes, and applies heavy and intermediate feedstocks.
              The same materials place its main production base in Ningbo, Zhejiang, within the Yangtze River Delta
              petrochemical corridor, and describe approximately 7 million tonnes of annual feedstock imports. A
              separate third-party profile describes Keyuan Petrochemicals as established in 2007 and producing more
              than 30 high-end fine-chemical products across chemical, textile-dyeing, pharmaceutical, food,
              precision-electronics, and optical applications. These descriptions establish a coherent industrial
              identity, but the current corporate perimeter and independently audited operating metrics are not visible
              in the retained public sources.
