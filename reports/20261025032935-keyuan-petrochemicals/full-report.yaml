      - number: '4.2'
        title: Historical traction is sizable but volatile
        blocks:
          - type: paragraph
            body: >-
              Independent reporting attributes revenue of RMB 8.555 billion, RMB 4.847 billion, RMB 11.125 billion, and
              RMB 5.703 billion to 2020, 2021, 2022, and the first three quarters of 2023, respectively. Reported
              parent-attributable profit moved from RMB 538 million in 2020 to a RMB 789 million loss in 2021, then
              recovered to RMB 368 million in 2022 and RMB 107 million through 2023 Q3. The same reporting cites a 2023
              gross margin of 18.7%, but no audited current-period bridge was retained. These discontinuous periods
              indicate both industrial scale and material earnings volatility; they do not establish a current revenue
              run rate, normalized margin, or cash conversion. Older U.S.-issuer statements and forecasts are kept
              separate because their vintage and perimeter make direct comparison unsafe.
            claimRefs:
              - CI004
              - CI006
              - CI007
              - CI008
              - CI010
              - CI011
          - type: table
