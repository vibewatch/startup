  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and value-chain position
        blocks:
          - type: paragraph
            body: >-
              Keyuan's relevant market boundary is best defined as industrial chemical inputs and materials sold into
              downstream manufacturing, not as the entire chemicals sector. Preqin describes fuel-oil fine chemicals
              including styrene, propylene, toluene, industrial hexane, petroleum ether, road asphalt, and transformer
              oil, while the 36Kr account describes more than 30 high-end fine-chemical products used in chemical,
              textile-dyeing, pharmaceutical, food, precision-electronics, and optical applications. The boundary
              therefore includes petrochemical feedstocks, solvents, specialty intermediates, elastomer and resin
              inputs, and selected biodegradable-plastic materials. It excludes unrelated commodity chemicals and
              downstream finished goods that Keyuan does not manufacture. The practical status quo is continued
              procurement of incumbent chemical grades from integrated producers; substitution depends on qualification,
              consistency, delivered cost, and supply assurance rather than on a software-style user switch.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM008
      - number: '2.2'
        title: Sizing lenses and buyer segmentation
        blocks:
          - type: paragraph
            body: >-
              A defensible sizing approach must use multiple lenses. The available company-specific sources provide
              product scope and one historical capacity disclosure, but not a current revenue denominator by product,
              geography, or customer. The older placement material states a 550,000 MT manufacturing design capacity and
              says expansion was intended to meet increasing market demand; this is an operating-capacity lens, not TAM
              or revenue. A separate PLA industry source reports China consumption of 240,000 tonnes in 2024, up 60%,
              but that figure covers the national PLA category and cannot be treated as Keyuan's serviceable market. The
              2026 Hurun index is a valuation context, not market size. These sources support a constrained market map,
              not a precise TAM/SAM/SOM calculation. Buyer ownership is likewise segmented: chemical producers and
              compounders buy intermediates and resins; electronics, pharmaceutical, food, textile, and automotive
              manufacturers specify performance and quality; procurement or plant operations usually owns the budget,
              with engineering and quality controlling qualification.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM009
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM009
              - CM010
      - number: '2.3'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand drivers are industrial production, downstream material substitution, supply-chain security, and
              policy-supported biodegradable-plastic adoption. The 36Kr source attributes a roughly 20% cost reduction
              to upstream integration for an ABS-related project and reports a 2023 consolidated gross margin of 18.7%,
              but those are company-reported figures in a media article rather than an independent market benchmark. The
              PLA source describes policy and technology as twin drivers and says domestic scale production is
              expanding, while the BPI listing demonstrates that PLA demand is mediated by product specifications and
              certification in defined end-of- life environments. Constraints are equally material: chemical markets are
              cyclical, raw-material prices can move faster than pass-through, new plants consume capital before
              qualification and utilization mature, and policy-dependent biodegradable demand can disappoint. A
              comparable 2025 polymer producer reported margin pressure, product-mix adjustment, and negative operating
              cash flow, which is useful adverse sector context but not a Keyuan forecast.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Market conclusion
            body: >-
              Keyuan has exposure to several credible industrial demand pools, but the public record does not identify a
              current company-specific denominator for SAM or SOM. Underwriting should therefore use product-level
              capacity, realized prices, utilization, qualification status, and customer concentration rather than
              headline industry size.
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM013
          - type: callout
            title: Main adoption risk
            body: >-
              The same integration and capacity strategy that can improve supply security also increases fixed-cost,
              financing, and utilization risk when downstream demand or pricing weakens.
            calloutType: risk
            claimRefs:
              - CM010
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set spans integrated petrochemical producers, biodegradable-material specialists,
              compounders and the status quo of conventional plastics. The China bioplastics evidence names Hisun
              Biomaterials, TotalEnergies Corbion PLA, BBCA, COFCO, Kingfa, BASF, NatureWorks, Novamont, Danimer, eSUN,
              Huafon and others, while a separate company directory lists Arkema, Braskem, Eastman, Indorama,
              LyondellBasell and Zhejiang Hisun. This breadth matters because a buyer can substitute polymer chemistry,
              formulation, supplier geography or simply retain conventional resin where regulation and customer
              commitments permit. Keyuan's public materials do not establish which of these jobs it wins or whether its
              present perimeter is comparable to the named peers.
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP008
      - number: '3.2'
        title: Peer profiles and scale signals
        blocks:
          - type: paragraph
            body: >-
              The strongest public scale signals are competitor-specific rather than Keyuan-specific. Jindan New
              Biomaterials describes a two-phase L-Lactide and polylactic-acid project with 10,000 tons of initial
              annual capacity and a stated 100,000-to-150,000-ton potential after full operation. Industry reporting
              places Jindan and Anhui BBCA among Chinese PLA leaders above 100,000 tons, while Kingfa is reported as the
              largest PBAT-capacity holder at 15% and Changhong High-Tech and Blue Ridge Tunhe at 9% each. These are
              capacity indicators, not revenue, realized utilization or margin comparisons. Keyuan's own 2010 release
              described 550,000 metric tons of petrochemical design capacity and a planned 70,000-ton SBS addition, but
              those historical company claims do not establish current product scale or share.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP015
      - number: '3.3'
        title: Buyer trade-offs, pricing and distribution
        blocks:
          - type: paragraph
            body: >-
              Buyers appear to choose among material families and suppliers on performance, certification, availability,
              conversion support, price and regulatory fit. The market source identifies packaging as the largest
              end-user segment and PLA as the leading subsegment, while the China industry article reports that PLA and
              PBAT together account for more than 80% of domestic biodegradable-plastics capacity. The assigned evidence
              contains no comparable public price sheets or realized contract prices for Keyuan or its peers, so a
              capability matrix can identify decision criteria but must leave price, discounting, switching cost and
              customer concentration unknown. Supplier qualification and formulation know-how may create friction, but
              no retained source quantifies it for Keyuan.
            claimRefs:
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a scale-and-compliance hypothesis, not a proven moat. Capacity expansion can improve
              availability and cost, but the same expansion can commoditize resin and pressure margins. A 2026
              competitor report warns that planned PBAT capacity could create supply-demand imbalance and lower industry
              profitability; it also identifies raw-material volatility, safety and policy execution as material risks.
              The SEC's 2013 enforcement release is not evidence about current operations, but it is relevant adverse
              history for trust and governance diligence: the Commission charged Keyuan over undisclosed related-party
              transactions, books-and-records and internal-control violations. Until current product KPIs, customer
              references, certifications, pricing and controls are independently verified, displacement and trust risk
              remain material.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP006
              - CP015
      - number: '3.5'
        title: Investment interpretation
        blocks:
          - type: paragraph
            body: >-
              Keyuan's competitive position is therefore best treated as an open underwriting question. Its retained
              public record provides historical capacity and filing-derived financial signals, while the peer set
              demonstrates that the addressable arena includes better-documented producers and global chemical
              companies. The public record does not show whether Keyuan competes through lower cost, differentiated
              formulations, feedstock access, customer qualification, local distribution or a protected process. A
              diligence-ready conclusion is to track rather than underwrite a durable moat: request a product-by-product
              competitor win/loss file, current capacity and utilization, realized price waterfall, certification
              portfolio, top-customer concentration, and evidence that current governance controls address the
              historical SEC concerns.
            claimRefs:
              - CP015
              - CP016
      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The moat is unproven
            body: >-
              Keyuan has historical scale signals, but the retained evidence does not establish a current product-level
              advantage against better-documented PLA, PBAT and integrated chemical competitors.
            calloutType: insight
            claimRefs:
              - CP015
              - CP016
          - type: callout
            title: Oversupply and trust are separate risks
            body: >-
              Capacity expansion can pressure industry pricing, while the historical SEC enforcement record makes
              current controls and customer trust a separate diligence axis.
            calloutType: risk
            claimRefs:
              - CP011
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and disclosure boundary
        blocks:
          - type: paragraph
            body: >-
              Keyuan appears to monetize physical chemical output rather than recurring software subscriptions: 36Kr
              describes more than 30 high-end fine-chemical products, including solvents and chemical cleaning agents,
              sold into industrial applications. The company has also pursued upstream-to-downstream integration, which
              should connect customer demand to product shipment, revenue, raw-material and conversion costs, and gross
              profit. Public evidence does not disclose list prices, realized prices, contract duration, rebates,
              payment terms, product-level revenue mix, or revenue-recognition policies. Consequently, the revenue model
              is economically understandable but not quantitatively auditable. The tables below distinguish supported
              product categories from unavailable pricing and contract data rather than treating historic production
              capacity as current sales.
