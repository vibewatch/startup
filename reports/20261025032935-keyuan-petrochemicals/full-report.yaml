        title: Exhibits
        blocks:
          - type: callout
            title: Valuation is not cash available
            body: >-
              The RMB 7.5-8.0 billion valuation observations do not disclose round proceeds or parent-level liquidity;
              they cannot be used as runway evidence.
            calloutType: risk
            claimRefs:
