  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow, Company solution, Measurable benefit, Limitation]
    rows:
      - ["Secure consistent polymer or elastomer inputs", "Source petrochemical materials from qualified producers", "Produce refined petrochemicals, SBS, and TPE across two bases", "Potential supply continuity and product breadth", "No current on-time-in-full or lot-consistency data"]
      - ["Meet application-specific material requirements", "Qualify grades for tires, footwear, packaging, or durable goods", "Supply product families and reported fine-chemical grades", "Application coverage is plausible from reported end uses", "No public qualification test results or failure rates"]
      - ["Lower exposure to feedstock volatility", "Purchase or process upstream inputs within an integrated chain", "Use upstream-to-production integration and supporting units", "Reported roughly 20% cost reduction for the ABS-related project", "Claim is not supported by current plant accounts or comparable baseline"]
      - ["Adopt lower-impact materials", "Replace conventional plastics in relevant applications", "Pursue biodegradable-plastics expansion", "Market demand and industry capacity are expanding", "Keyuan product certification and adoption evidence unavailable"]
    notes: Benefits are framed as reported or potential operating outcomes; no row should be read as a verified current customer result.
    claimRefs: [CE001, CE002, CE003, CE004, CE009, CE011, CE012]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Principal risk]
    rows:
      - ["Feedstock and pretreatment", "Secure and condition raw materials before conversion", "Hydrocarbon and chemical input availability", "Commodity-price volatility and supply disruption"]
      - ["Chemical conversion and polymerization", "Produce refined petrochemicals, SBS, TPE, ABS, and related materials", "Process equipment, recipes, utilities, and operator capability", "Aging equipment, yield variance, and unverified modernization"]
      - ["Storage and loading", "Hold and dispatch raw materials and finished goods", "Tanks, loading infrastructure, transport, and safety controls", "Incident, contamination, and logistics-control exposure"]
      - ["Application and qualification", "Match grades to downstream chemical, textile, pharmaceutical, food, electronics, optical, tire, and footwear uses", "Customer testing, certifications, and technical service", "Missing current qualification, performance, and complaint data"]
      - ["Expansion and new materials", "Add ABS, specialty chemicals, and biodegradable-plastics capacity", "Capital, permits, commissioning, and customer pull", "Execution, environmental-compliance, and demand risk"]
    notes: The architecture is an analytical reconstruction from official, historical, media, and industry sources; it is not a current engineering drawing or plant audit.
    claimRefs: [CE001, CE005, CE006, CE008, CE009, CE010, CE013]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Keyuan's public product and operating model can be represented as an integrated physical chain from feedstock through conversion, logistics, and application qualification.
    data:
      layers:
        - label: Inputs and integration
          detail: Feedstock and upstream support layer.
          items:
            - label: Feedstock
              detail: Hydrocarbon and chemical inputs; current sourcing and pretreatment metrics are not public.
            - label: Upstream support
              detail: Reported supporting units and backward-integration thesis for ABS-related production.
        - label: Conversion and assets
          detail: Physical conversion and product-line layer.
          items:
            - label: Petrochemical conversion
              detail: Refined petrochemicals, synthetic rubber, and thermoplastic elastomer production categories.
            - label: Polymer and specialty lines
              detail: SBS, ABS-related materials, fine chemicals, and reported biodegradable-plastics expansion.
        - label: Delivery and qualification
          detail: Logistics, applications, and buyer-qualification layer.
          items:
            - label: Storage and dispatch
              detail: Historical disclosure includes storage and loading facilities across the manufacturing platform.
            - label: Downstream applications
              detail: Reported uses span tires, footwear, packaging, chemical, textile, pharmaceutical, food, electronics, and optical customers.
        - label: Feedstock control
          detail: Input conditioning and upstream dependency layer.
          items:
            - label: Input availability
              detail: Hydrocarbon and chemical inputs require reliable sourcing.
        - label: Process quality
          detail: Yield, uptime, batch consistency, and maintenance layer.
          items:
            - label: Plant KPIs
              detail: Current operating measurements are not publicly disclosed.
        - label: Customer qualification
          detail: Technical-service, certification, and application-approval layer.
          items:
            - label: Qualification records
              detail: Current customer test results and failure rates are unavailable.
    approximationNotes: This is a source-based operating-model abstraction, not a measured process flow, current plant map, or proof of product maturity.
    claimRefs: [CE001, CE002, CE003, CE005, CE006, CE008]
