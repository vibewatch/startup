      - ["Biodegradable-plastics expansion", "Packaging and materials users", "Strategic category reported; current product maturity unclear", "Alignment with a growing PLA/PBAT market", "Product certifications, feedstock economics, and customer adoption"]
    notes: Public and historical sources identify categories and some projects, but do not establish current production status, realized performance, or customer qualification for every row.
