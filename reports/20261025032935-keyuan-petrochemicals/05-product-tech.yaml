  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: product-proof
      missingEvidence: Current SKU datasheets, product specifications, customer qualification records, batch-failure data, and realized performance by product line.
      whyItMatters: Product breadth and historical capacity do not establish present quality, retention, pricing power, or switching costs.
      diligencePath: Request a signed SKU register, technical datasheets, qualification test reports, complaint log, returns data, and three customer references for each material product family.
      relatedQuestionRefs: [QE005, QE008]
    - type: stale
      severity: material
      topic: operating-maturity
      missingEvidence: Current plant utilization, uptime, yield, maintenance backlog, commissioning status, and capex records for the ABS and supporting-unit expansion.
      whyItMatters: The strongest capacity and process disclosures are historical or media-reported and cannot be used as current operating proof.
      diligencePath: Reconcile 2024-2026 production ledgers, utility consumption, maintenance work orders, commissioning certificates, and third-party engineering reports to plant tours.
      relatedQuestionRefs: [QE002, QE003, QE004]
    - type: missing-source
      severity: material
      topic: controls
      missingEvidence: Independently verified permits, environmental and safety certifications, incident history, emissions data, and product-quality-system audits.
      whyItMatters: Chemical manufacturing value and downside risk depend on compliance and process control, while the public record is silent on current control performance.
      diligencePath: Obtain permits, audit reports, emissions and waste records, insurance loss runs, incident registers, and current ISO or equivalent certificates directly from the operating entities.
      relatedQuestionRefs: [QE006, QE008]
    - type: enumeration-incomplete
      severity: minor
      topic: product-portfolio
      missingEvidence: A complete current module, SKU, facility, and application inventory with status and ownership boundaries.
      whyItMatters: Public descriptions mix group-level categories, subsidiary-level claims, historical projects, and expansion ambitions.
      diligencePath: Reconcile the legal-entity chart with a current product master, facility register, production-line status, and application-level revenue bridge.
      relatedQuestionRefs: [QE001, QE002]
    - type: missing-source
      severity: minor
      topic: biodegradable-plastics
      missingEvidence: Keyuan-specific product specifications, certifications, and customer deployments for biodegradable-plastics products.
      whyItMatters: Industry capacity growth does not demonstrate that Keyuan has a qualified, differentiated, or commercial biodegradable-plastics offering.
      diligencePath: Request product registrations, certification files, pilot and production customer references, and current biodegradable-materials revenue by SKU.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: minor
      topic: practitioner-signal
      missingEvidence: A current patent inventory or a practitioner-community proxy such as engineering talks, professional-society discussion, technical recruiting detail, or integration-partner evidence.
      whyItMatters: The assigned public evidence does not expose a developer surface or an equivalent external technical signal for testing claimed process know-how.
      diligencePath: Search patent registries and professional-society proceedings, then request the patent schedule, named process engineers, technical recruiting plan, and external engineering references.
      relatedQuestionRefs: [QE010]
