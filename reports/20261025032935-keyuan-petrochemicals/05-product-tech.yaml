company:
  name: Keyuan Petrochemicals
chapter:
  number: 5
  title: Product & Technology
  summary: Keyuan presents an integrated petrochemical and advanced-materials operating model spanning refined petrochemicals, synthetic rubber, thermoplastic elastomers, ABS-related materials, specialty chemicals, and biodegradable-plastics expansion. Public evidence supports the existence of production assets and product categories, but current product-grade quality metrics, plant KPIs, certifications, security-equivalent controls, and roadmap delivery evidence remain thin.
sections:
  - id: product-surface
    title: Product surface and customer workflow
    body: >-
      Keyuan's official English surface describes a Hong Kong-invested group producing refined petrochemical products, synthetic rubbers, and thermoplastic elastomers from two mainland China production bases in Ningbo and Fangchenggang. This is a product portfolio and footprint statement, not proof of current utilization, realized pricing, or customer outcomes. A 2025 media account describes the subsidiary Keyuan Fine Chemical as making more than 30 high-end fine-chemical products, including solvents and chemical cleaning agents, for chemical, textile-dyeing, pharmaceutical, food, precision-electronics, and optical applications. The same account links SBS to tires and shoe materials and describes ABS as part of a larger integrated project. The workflow therefore appears to be industrial formulation and bulk production for downstream manufacturers, with product qualification, lot consistency, safety documentation, and delivery reliability as the likely buyer gates; public sources do not expose the relevant pass/fail data.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: operating-architecture
    title: Operating architecture and maturity
    body: >-
      The disclosed architecture is physical and process-led rather than software-led: upstream feedstock and pretreatment, chemical conversion and polymer production, storage and loading, and downstream product/application channels. A 2010 company release described 550,000 metric tons of annual petrochemical manufacturing design capacity, storage and loading facilities, and process technology intended to support low raw-material costs, utilization, and yields; it also announced an SBS facility planned to add 70,000 metric tons by the end of 2011. These are historical design and forward-looking disclosures, not current operating measurements. The 2025 media account reports a 1.2-million-metric-ton-per-year ABS-and-supporting-unit project and a claimed roughly 20% cost reduction from integrated raw-material production, but this remains a reported claim without plant-level validation in the retained evidence. The product architecture is consequently credible as an industrial configuration but not yet diligence-complete on current maturity.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-controls
    title: Differentiation, reliability, and control gaps
    body: >-
      Potential differentiation rests on integration, location, product breadth, and process know-how rather than a publicly demonstrated proprietary software moat. The official site emphasizes two production bases; the 36Kr account attributes resilience to an upstream-to-production-to-application chain; and the historical release described low raw-material-cost and high-utilization/yield technology. Those signals support a hypothesis of supply and conversion advantages, but they do not establish defensible intellectual property, current yield, quality consistency, environmental performance, or switching costs. The adverse SWOT source specifically flags aging-technology risk, modernization needs, commodity exposure, and rising environmental-compliance costs. A sector article on biodegradable plastics shows a fast-expanding and highly competitive PLA/PBAT supply landscape, while a public peer quote page illustrates that even a listed biomaterials peer's market data does not substitute for Keyuan's own product KPIs. The key technical diligence ask is a current, SKU-level evidence pack covering specifications, batch failures, uptime, maintenance, emissions, certifications, customer qualification, incident history, and roadmap milestones.
    claimRefs: [CE009, CE010, CE011, CE012, CE013, CE016]
  - id: diligence-verdict
    title: Product and technology verdict
    body: >-
      On the current record, Keyuan looks like a real, asset-backed industrial producer with a broad materials surface, not a purely promotional software concept. The evidence is strongest for historical capacity, named product families, two-base operations, and an integrated manufacturing thesis. It is weakest for present-day plant performance, product qualification, quality systems, safety and environmental controls, proprietary technology, and delivery against the newer ABS and biodegradable-materials ambitions. Current unicorn coverage confirms private-company and valuation context but adds no technical validation. Investors should therefore treat integration and location as hypotheses to test rather than underwrite them as durable moats. A site visit, current certificates and permits, SKU technical data, customer qualification records, maintenance and outage logs, and project commissioning evidence are required before assigning a high-confidence technology or execution premium.
    claimRefs: [CE014, CE015, CE016]
callouts:
  - calloutType: strength
    title: Asset-backed industrial base
    body: The official footprint and historical capacity disclosures support a genuine manufacturing platform, but current utilization and quality evidence are not public.
    claimRefs: [CE001, CE002, CE005, CE006]
  - calloutType: risk
    title: Modernization and verification risk
    body: Aging-technology and environmental-compliance concerns are explicitly raised by the adverse source, while current technical KPIs and control records remain unavailable.
    claimRefs: [CE010, CE013]
  - calloutType: recommendation
    title: Require plant-level evidence before underwriting a moat
    body: Treat integration, cost savings, and product breadth as diligence hypotheses until current SKU, yield, uptime, certification, and customer-qualification records are produced.
    claimRefs: [CE009, CE016]
