evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-cap-table
    missingEvidence: >-
      Current capitalization table, preferred terms, dilution schedule, and financing closing documents for the
      2024-2025 rounds.
    whyItMatters: >-
      Headline valuation does not establish ownership, liquidation preference, dilution, or cash available to the
      operating group.
    diligencePath: >-
      Request the latest cap table, signed financing documents, option schedule, and board-approved capitalization
      reconciliation.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO003
  - type: stale
    severity: material
    topic: current-scale
    missingEvidence: Current consolidated revenue, EBITDA, cash, debt, headcount, customer count, and plant-level operating KPIs.
    whyItMatters: >-
      Historical public-company data and current-facing marketing claims cannot substitute for current underwriting
      metrics.
    diligencePath: >-
      Obtain management accounts, audited financial statements, debt schedules, customer concentration, and production
      utilization by legal entity.
    relatedQuestionRefs:
      - QO002
      - QO008
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Current executive, board, and key-subsidiary leadership roster with dates of appointment and departures.
    whyItMatters: Historical names establish continuity risk but do not show current key-person dependence or governance quality.
    diligencePath: Request the current organization chart, board minutes, director biographies, and material leadership-change log.
    relatedQuestionRefs:
      - QO003
      - QO009
