  name: Keyuan Petrochemicals
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a real operating petrochemical group and a 2026 unicorn valuation of 7.5 billion yuan, but it does not disclose enough current financial, cap-table, or preference data to underwrite a price-sensitive buy decision. The appropriate stance is research-more with explicit downside tests.
sections:
  - id: recommendation
    title: Recommendation and entry discipline
    body: >-
      Keyuan has evidence of a multi-base industrial platform rather than a purely
      financial construct: its own group description names two mainland production
      bases and products spanning refined petrochemicals, synthetic rubbers, and
      thermoplastic elastomers, while the technical-capabilities material describes
      feedstock handling, logistics, specification control, and risk management.
      The valuation signal is also current enough to matter: China Daily reports a
      2026 Hurun valuation of 7.5 billion yuan and a second consecutive recognition.
      Those facts establish operating breadth and an external valuation mark, not
      investable equity value. The public record does not provide current revenue,
      EBITDA, free cash flow, ownership, liquidation preferences, debt covenants, or
      a current financing price. Accordingly, a buy recommendation would imply
      unsupported assumptions about earnings quality and dilution. Research-more is
      the price-sensitive call until a current cap table and audited financial pack
      are obtained.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-antithesis
    title: Thesis, anti-thesis, and comparable signals
    body: >-
      The positive thesis is that an integrated heavy-oil-to-products chain, two
      production locations, and operating capabilities in feedstock switching,
      throughput optimization, quality verification, and cross-border logistics
      could support resilience and optionality across petrochemical cycles. The
      anti-thesis is that commodity exposure and capital intensity can make scale
      look better than value: an older company release described a $20.3 million
      placement used to purchase raw materials, while historical SEC-derived
      statements are not a substitute for current parent-level accounts. A 36Kr
      report provides a stronger but still non-transactional financing chronology,
      including a 2025 D-round valuation of 8 billion yuan. Public-market context
      also argues against a headline-only valuation: Yahoo Finance displayed
      Hisun Biomaterials at a 3.02 billion yuan market capitalization and 3.12
      price-to-sales ratio, while a 2025 report on the Keyuan-system company
      Changhong described revenue growth alongside a loss and negative operating
      cash flow. Neither company is a direct valuation proxy for Keyuan. The
      relevant comparable set is therefore triangulation, not a single peer
      multiple, and requires aligned earnings, debt, perimeter, and security terms.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV016]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios, downside triggers, and diligence asks
    body: >-
      A scenario range can be framed qualitatively because the key denominator is
      missing. In the bull case, current valuation is supported by verified
      utilization, product mix, cash conversion, and a clean preference stack. In
      the base case, the company remains strategically credible but the 7.5 billion
      yuan mark is treated as an indicative private valuation rather than a
      realizable exit price. In the bear case, weak margins, working-capital
      absorption, leverage, or a down-round expose common equity to dilution and
      preference overhang. The next diligence request should obtain monthly
      management accounts, facility-level capacity and utilization, customer and
      product gross margins, debt and covenant schedules, the current cap table,
      preference terms, and evidence supporting the 2026 valuation. A thesis break
      occurs if management cannot reconcile valuation to current operating metrics,
      if cash conversion is persistently negative without committed financing, or
      if an independent financing process prices the equity materially below the
      headline mark.
    claimRefs: [CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
  - id: exhibits
    title: Exhibits
    body: >-
      The exhibits separate observed valuation references from analyst
      interpretation. Historical financing and public-company benchmark data are
      retained for context only; they do not establish current Keyuan revenue,
      cash, enterprise value, or ownership. Nulls and open questions are
      intentional where the assigned public sources do not disclose a reliable
      current figure. This distinction is especially important for a private
      industrial company whose operating footprint can be credible while its
      common-equity price remains untestable. The current 7.5 billion yuan Hurun
      mark, the reported 8 billion yuan D-round valuation, and listed-company
      market data use different methods and security contexts. They should not be
      blended into an implied return or treated as evidence of a down-round.
    claimRefs: [CV003, CV004, CV008, CV010, CV011, CV016]
