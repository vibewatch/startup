callouts:
  - calloutType: recommendation
    title: Price discipline
    body: "The 7.5 billion yuan mark is a valuation reference, not sufficient evidence of a fair common-equity entry price; request current terms before underwriting."
    claimRefs: [CV003, CV004, CV011]
  - calloutType: risk
    title: Missing denominator
    body: "Without current revenue, cash flow, debt, ownership, and preference data, precise target returns or a numerical valuation range would be false precision."
    claimRefs: [CV011, CV012, CV013]
