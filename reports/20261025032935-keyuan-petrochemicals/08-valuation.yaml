    title: Thesis / anti-thesis table
    columns: [Argument, Supporting signal, What would change the view]
    rows:
      - [Integrated platform, "Two production bases and a broad petrochemical product set are described by the group.", "Facility-level utilization and product contribution by site."]
      - [Execution capability, "Technical source describes feedstock switching, throughput optimization, and quality verification.", "Independent customer, inspection, or operating KPI evidence."]
      - [Valuation support, "China Daily reports 7.5 billion yuan in the 2026 Hurun index.", "Signed financing terms, investor confirmation, and current cap table."]
      - [Capital intensity, "Historical placement proceeds were earmarked for raw-material purchases.", "Current working-capital cycle, debt schedule, and cash conversion."]
      - [Financing chronology, "36Kr reported a 2025 D-round first tranche at an 8 billion yuan valuation.", "Executed financing documents and security-level economics."]
      - [Public-market context, "Yahoo Finance displayed Hisun Biomaterials at a 3.02 billion yuan market capitalization and 3.12 price-to-sales ratio.", "Aligned Keyuan revenue, earnings, net debt, and perimeter data."]
      - [Margin fragility, "A 2025 Keyuan-system public company moved from profit to loss while operating cash flow turned negative.", "Keyuan segment margins and stress-tested cash flow."]
    notes: "Signals mix company-issued, independent, historical, affiliated-company, and public-market evidence; neither listed company is treated as a direct Keyuan valuation benchmark."
    claimRefs: [CV002, CV005, CV006, CV007, CV009, CV010, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Verified growth, healthy margins, positive cash conversion, and clean preference terms.", "7.5 billion yuan mark is supported and upside can be assessed against a documented exit path.", "Commodity reversal or execution failure.", "Low-to-medium; required inputs are not public."]
      - [Base, "Operating platform is real but current earnings, leverage, and dilution remain unverified.", "Treat 7.5 billion yuan as indicative; require a discount for illiquidity and information risk.", "Working-capital absorption and preference overhang.", "Highest pending diligence."]
      - [Bear, "Margins compress, cash flow remains weak, or a new financing prices below the headline mark.", "Down-round dilution and limited liquidity can impair common-equity return.", "Leverage, refinancing, and commercialization failure.", "Material; cannot be quantified from assigned sources."]
      - [Exit readiness, "Audited accounts, governance, and buyer-quality KPI package become available.", "Exit multiple and return target can then be modeled; neither is supportable now.", "No transparent exit route or current market clearing price.", "Unresolved."]
    notes: "Qualitative scenarios are used because current revenue, EBITDA, cash flow, capitalization, and transaction terms are not disclosed in the retained evidence."
    claimRefs: [CV003, CV004, CV011, CV012, CV013, CV014, CV015]
