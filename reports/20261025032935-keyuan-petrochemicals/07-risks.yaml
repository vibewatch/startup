      - ["Plant outage, quality failure, or process adjustment", medium, critical, "Company cites repeatable execution; no current uptime or quality KPI", "High", "Obtain utilization, downtime, customer claims, recalls, and batch-release data"]
      - [Working-capital squeeze from inventory and receivables, high, high, "Historical statements show material inventory and receivables balances", "High", "Obtain current aging, supplier terms, factoring, collateral, and liquidity forecast"]
    notes: "Rows combine company operating descriptions with historical financial statements and sector comparator evidence; the risk ratings are analytical assessments and not reported incident frequencies."
    claimRefs: [CR001, CR003, CR007, CR010, CR011]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Concentration signal, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
