company:
  name: Keyuan Petrochemicals
chapter:
  number: 7
  title: Risks
  summary: Public evidence points to a feedstock-intensive, capital-intensive chemicals platform whose main risks are commodity-cycle exposure, execution and safety complexity, leverage and liquidity opacity, and valuation or financing dependence. The strongest evidence is historical and partly company-issued, so current operating controls, consolidated debt, and regulatory records remain material diligence gaps.
sections:
  - id: risk-posture
    title: Risk posture and evidence limits
    body: >-
      Keyuan describes an integrated model linking international feedstock imports, downstream processing, storage, and logistics. Its own materials state that the group imports approximately 7 million tonnes of feedstock per annum and that trading decisions are driven by technical suitability, blending considerations, logistics constraints, and execution risk. That integration can reduce some procurement friction, but it also concentrates exposure in a physically complex chain: imported commodities, port and storage availability, processing uptime, product quality, and cross-border execution. The two current company pages are substantially syndicated, so they should be treated as one issuer voice rather than independent corroboration. Public evidence does not establish current plant utilization, incident history, insurance coverage, customer concentration, or a consolidated parent-level debt and covenant package. The risk conclusion is therefore not that a failure has been observed; it is that the downside cannot be underwritten confidently without current primary records.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: regulatory-operational
    title: Regulatory, legal, and operating risks
    body: >-
      Petrochemical production and trading create coupled safety, environmental, permitting, and logistics risks. Keyuan's own pages emphasize operational safety, regulatory compliance, and risk control, but those assertions do not substitute for current permits, inspection outcomes, emissions data, hazardous-material procedures, or incident logs. Historical company financing material also warns that forward-looking statements involve inherent risks and uncertainties and identifies SEC-filed risk factors as relevant. A third-party 2025 analysis of the comparable Ningbo Changhong Polymer business illustrates the sector mechanism rather than proving a Keyuan incident: raw-material volatility can compress margin, production-flow adjustments can constrain output, technical shutdowns can reduce earnings, and hazardous-chemical operations retain accident exposure. For Keyuan, the appropriate diligence test is a site-level control package tying permits, maintenance backlog, quality releases, near misses, and insurance to each operating entity.
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
  - id: finance-dependency
    title: Financial, partner, and financing dependency
    body: >-
      The available financial record is stale and concerns the historical public Keyuan Petrochemicals, Inc. perimeter rather than a verified current private-company perimeter. ReadyRatios reproduces 2015 current liabilities of $783.821 million and 2015 debt of $783.000 million, while also showing 2015 cash of $12.309 million; those figures are not current solvency measures, but they demonstrate why entity perimeter and refinancing history matter. The 2010 financing release says $20.3 million was raised to purchase raw materials and included preferred stock and warrants, while also containing explicit forward-looking language. Current third-party coverage reports an 80 billion yuan valuation for Keyuan Fine Chemical, and China Daily reports a 7.5 billion yuan valuation for Keyuan Petrochemicals in the 2026 index; the differing names, dates, and perimeters make valuation and financing linkage unresolved rather than contradictory proof. Diligence should obtain audited consolidated statements, debt maturities, guarantees, working-capital facilities, cap table, liquidation preferences, and the exact relationship among Keyuan Petrochemicals, Keyuan Fine Chemical, and related operating entities.
    claimRefs: [CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
  - id: kill-criteria
    title: Monitoring, mitigation, and thesis-break triggers
    body: >-
      A reasonable monitoring plan should focus on measurable leading indicators rather than broad assurances. Monthly checks should cover feedstock volume and spread realization, inventory days, receivables aging, plant utilization, unplanned downtime, quality claims, near misses, permit exceptions, and covenant headroom. A thesis break would be a material safety or environmental enforcement event, repeated quality failures or an unplanned outage that interrupts contracted supply, a sustained inability to pass feedstock costs through to customers, or refinancing that increases secured debt and weakens liquidity. A separate valuation break would be a financing or independent mark materially below the latest reported private valuation without an explainable operating improvement. These are diligence and monitoring triggers, not claims that any threshold has already been breached. The current record supports research-more rather than a clean risk clearance because the most decision-relevant controls and financial statements are not public.
    claimRefs: [CR014, CR015, CR016]
    figureRefs: [FR001]
