      - [Port and storage infrastructure, Ningbo petrochemical corridor, "Core site dependence is described; alternative sites undisclosed", medium, high, "Established port, storage, and logistics systems claimed", "Medium-high"]
      - [Capital providers, Private-equity and other financing counterparties, "Historical placement and later private financing reported; current cap table undisclosed", high, high, "Financing history exists but current terms are not public", "High"]
      - [Downstream customers, Industrial customers across chemicals and materials, "A 36Kr report says 50+ Fortune 500 customers; concentration and retention are unverified", medium, high, "Broad end-use exposure is described", "Medium-high"]
    notes: "The table distinguishes disclosed roles from unverified concentration. Customer and financing references are historical or media-reported and should not be treated as current contractual proof."
    claimRefs: [CR001, CR002, CR012, CR013]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: "Illustrative residual-risk map based on disclosed dependencies and evidence gaps; it does not assert that an incident has occurred."
    data:
      columns:
        - {label: "Likelihood / impact", detail: "Analytical placement, not a measured probability"}
        - {label: "Medium impact", detail: "Could impair a site or quarter"}
        - {label: "High impact", detail: "Could impair liquidity or continuity"}
        - {label: "Critical impact", detail: "Could break the investment thesis"}
        - {label: "Extreme impact", detail: "Could force prolonged remediation or restructuring"}
        - {label: "Catastrophic impact", detail: "Could terminate the investment case"}
      rows:
        - label: "Low likelihood"
          note: "No retained evidence establishes a low likelihood; row is a monitoring baseline."
          values: ["Low likelihood", null, "Environmental enforcement", "Major incident", "Regulatory shutdown", "Fatality"]
        - label: "Medium likelihood"
          note: "Used where public evidence describes exposure but not frequency."
          values: ["Medium likelihood", "Trading-control breach", "Logistics interruption", "Plant outage", "Major recall", "Restructuring"]
        - label: "High likelihood"
          note: "Used for structural exposures such as commodity and working-capital volatility."
          values: ["High likelihood", "Quality claim", "Feedstock shock", "Liquidity squeeze", "Covenant breach", "Insolvency"]
    approximationNotes: "Likelihood and impact are qualitative analyst classifications anchored to disclosed operating dependencies, historical financial structure, and explicit evidence gaps; no numeric probabilities are implied."
    claimRefs: [CR001, CR003, CR005, CR010, CR014]
callouts:
  - calloutType: risk
    title: Primary thesis-break risk
    body: "The highest-consequence unknown is not a single reported incident but whether current safety, environmental, quality, and liquidity controls are strong enough for a feedstock-intensive integrated operation. Obtain entity-level primary records before underwriting scale or valuation."
    claimRefs: [CR005, CR010, CR014]
  - calloutType: recommendation
    title: Diligence gate
    body: "Treat the latest private valuation as a reference point, not proof of realizable value, until audited current financials, financing terms, entity perimeter, and operational-control evidence reconcile."
    claimRefs: [CR012, CR013, CR016]
