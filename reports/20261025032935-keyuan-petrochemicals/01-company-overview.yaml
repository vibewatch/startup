company:
  name: Keyuan Petrochemicals
chapter:
  number: 1
  title: Company Overview
  summary: Keyuan is described by company and third-party sources as a Ningbo-based, vertically integrated fine-chemicals and petrochemical group. The public record supports a substantial historical operating and financing footprint, but current leadership, cap-table detail, customer concentration, and present financial scale remain incompletely disclosed.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Keyuan's current public-facing materials describe an integrated fine-chemicals and refinery-derived-products group that imports, processes, and applies heavy and intermediate feedstocks. The same materials place its main production base in Ningbo, Zhejiang, within the Yangtze River Delta petrochemical corridor, and describe approximately 7 million tonnes of annual feedstock imports. A separate third-party profile describes Keyuan Petrochemicals as established in 2007 and producing more than 30 high-end fine-chemical products across chemical, textile-dyeing, pharmaceutical, food, precision-electronics, and optical applications. These descriptions establish a coherent industrial identity, but the current corporate perimeter and independently audited operating metrics are not visible in the retained public sources.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: capital-and-milestones
    title: Capital history and milestones
    body: >-
      Keyuan's financing history has multiple distinct phases. A 2010 company release documented a $20.3 million private placement led by Prax Capital, the use of proceeds for raw materials, and a board appointment tied to the financing. Later reporting described a 2024 C round at a 7.0 billion yuan valuation and a February 2025 first D-round investment that reportedly lifted the subsidiary's valuation to 8.0 billion yuan. Hurun's 2026 index, whose cut-off was 1 January 2026 and whose valuation updates extended to publication, independently listed Keyuan at 7.5 billion yuan; China Daily likewise reported that valuation and said Keyuan had appeared for two consecutive years. These figures are not interchangeable: they reflect different dates and source methodologies, so the current cap table and financing terms remain open.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010]
    figureRefs: [FO001]
  - id: leadership-scale-and-gaps
    title: Leadership, scale, and diligence gaps
    body: >-
      The historical financing release identifies Chungfeng Tao as chairman and chief executive officer and says Prax partner Lei Xu joined the board, bringing the number of independent directors to four at that time. The retained current-facing pages do not provide a comparable leadership roster or governance update. Historical financial data also shows why scale should be dated carefully: ReadyRatios presents 2015 revenue of $646.549 million and 2013 revenue of $750.628 million from SEC-derived XBRL, while a 2025 third-party article reports different subsidiary-level revenue and earnings series through the third quarter of 2023. Those records can inform diligence, but they do not establish current consolidated revenue, headcount, customers, debt, or cash. The principal conclusion is therefore evidence-backed industrial substance with material disclosure gaps.
    claimRefs: [CO011, CO012, CO013, CO014, CO015]
    tableRefs: [TO002, TO003]
