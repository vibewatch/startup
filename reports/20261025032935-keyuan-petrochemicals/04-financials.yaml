      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Revenue, RMB 8.555b / 4.847b / 11.125b / 5.703b, 2020 / 2021 / 2022 / 2023 Q1-Q3; reported for Keyuan Fine Chemicals, Medium, Shows scale but strong period volatility, Audited monthly revenue bridge through 2026]
      - [Parent-attributable profit, RMB 538m / -789m / 368m / 107m, 2020 / 2021 / 2022 / 2023 Q1-Q3; reported for Keyuan Fine Chemicals, Medium, Indicates earnings cyclicality, Normalized EBITDA and one-off reconciliation]
      - [Gross margin, 18.7%, 2023; third-party report, Medium, Anchors historical conversion before current verification, Product and plant gross-margin waterfall]
      - [Legacy cash and current liabilities, USD 12.309m cash versus USD 783.821m current liabilities, 2015 legacy U.S. reporting perimeter, Low, Demonstrates why perimeter and vintage must be reconciled, Legal-entity bridge and current consolidated balance sheet]
      - [Related listed-company operating cash flow, Negative RMB 115m, 2025 Changhong High-tech; not Keyuan parent, Medium, Directional warning on project and working-capital stress only, Intercompany exposure and parent standalone cash flow]
      - [Current parent cash debt and runway, Unavailable, As of 2026-10-25, Low, Prevents capital-adequacy underwriting, Bank statements debt schedule covenants capex and 24-month cash plan]
    notes: >-
      Values preserve source periods and perimeters; legacy U.S.-issuer and related-company
      metrics are not treated as current Keyuan parent results, and unavailable is not zero.
    claimRefs: [CI004, CI006, CI007, CI008, CI015]
