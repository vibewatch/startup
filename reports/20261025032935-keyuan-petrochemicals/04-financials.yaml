company:
  name: Keyuan Petrochemicals
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a high-volume product-sales model with meaningful raw-material,
    working-capital, and project-capital exposure, but it does not provide current audited
    parent-level accounts. Historical revenue and margin reports are useful directional
    anchors, not a sufficient basis for underwriting current cash generation or runway.
sections:
  - id: revenue-model
    title: Revenue model and disclosure boundary
    body: >-
      Keyuan appears to monetize physical chemical output rather than recurring software
      subscriptions: 36Kr describes more than 30 high-end fine-chemical products, including
      solvents and chemical cleaning agents, sold into industrial applications. The company
      has also pursued upstream-to-downstream integration, which should connect customer
      demand to product shipment, revenue, raw-material and conversion costs, and gross
      profit. Public evidence does not disclose list prices, realized prices, contract
      duration, rebates, payment terms, product-level revenue mix, or revenue-recognition
      policies. Consequently, the revenue model is economically understandable but not
      quantitatively auditable. The tables below distinguish supported product categories
      from unavailable pricing and contract data rather than treating historic production
      capacity as current sales.
    claimRefs: [CI001, CI002, CI005]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-profitability
    title: Historical traction is sizable but volatile
    body: >-
      Independent reporting attributes revenue of RMB 8.555 billion, RMB 4.847 billion,
      RMB 11.125 billion, and RMB 5.703 billion to 2020, 2021, 2022, and the first three
      quarters of 2023, respectively. Reported parent-attributable profit moved from
      RMB 538 million in 2020 to a RMB 789 million loss in 2021, then recovered to
      RMB 368 million in 2022 and RMB 107 million through 2023 Q3. The same reporting
      cites a 2023 gross margin of 18.7%, but no audited current-period bridge was retained.
      These discontinuous periods indicate both industrial scale and material earnings
      volatility; they do not establish a current revenue run rate, normalized margin, or
      cash conversion. Older U.S.-issuer statements and forecasts are kept separate because
      their vintage and perimeter make direct comparison unsafe.
    claimRefs: [CI004, CI006, CI007, CI008, CI010, CI011]
    tableRefs: [TI003]
  - id: cost-and-capital-intensity
    title: Cost structure and capital dependency
    body: >-
      The operating model is exposed to feedstock prices, inventory funding, utilization,
      maintenance, and expansion capex. 36Kr reports that an integrated ABS project reduced
      costs by about 20%, while the legacy company raised $20.3 million in 2010 specifically
      to purchase raw materials and described capacity additions involving storage,
      pretreatment, asphalt, and SBS facilities. Those historic records show why working
      capital and fixed assets matter, but not today's obligations. As an external benchmark,
      a 2025 PLA-industry review put corn at 47% of PLA production cost; that is not a Keyuan
      cost ratio. A related listed-company signal is adverse: Changhong High-tech reported a
      2025 net loss and negative operating cash flow alongside higher borrowing, but that
      affiliate evidence cannot be substituted for Keyuan parent accounts.
    claimRefs: [CI003, CI005, CI009, CI015, CI016]
  - id: capital-adequacy-verdict
    title: Capital adequacy remains the underwriting blocker
    body: >-
      The financing evidence establishes valuation events, not liquidity. A user-authored
      Eastmoney post reported a first D-round tranche and an RMB 8.0 billion valuation in
      2025; China Daily later reported a Hurun valuation of RMB 7.5 billion and rank 1,209
      in 2026. Hurun explains that its index uses recent financing and comparables, with a
      January 1, 2026 cut-off and selected updates through publication. Neither valuation
      discloses proceeds, unrestricted cash, debt, covenants, project-finance recourse, burn,
      or runway. The financial verdict is therefore cautious: revenue scale and integration
      may support an industrial margin path, but current revenue quality, cash conversion,
      leverage, and next-round dependency remain unverified. Underwriting should require
      consolidated audited accounts, a debt schedule, working-capital aging, capex commitments,
      and product-level gross-margin waterfalls.
    claimRefs: [CI012, CI013, CI014]
callouts:
  - calloutType: risk
    title: Valuation is not cash available
    body: >-
      The RMB 7.5-8.0 billion valuation observations do not disclose round proceeds or
      parent-level liquidity; they cannot be used as runway evidence.
    claimRefs: [CI012, CI013, CI014]
