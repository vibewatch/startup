  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-limit
      missingEvidence: Current revenue, volume, utilization, price, geography, and customer concentration by Keyuan product family.
      whyItMatters: Without a current denominator, industry figures cannot be converted into a defensible company-specific SAM or SOM or used to test valuation against market capture.
      diligencePath: Obtain management's product-level volume and revenue bridge, addressable customer universe, qualification pipeline, utilization, and regional sales split for the latest twelve months.
      relatedQuestionRefs: [QM007, QM008]
      relatedTableRefs: [TM002]
    - type: missing-source
      severity: material
      topic: buyer-qualification
      missingEvidence: Independent customer, procurement, or qualification evidence for Keyuan's current product grades and switching behavior.
      whyItMatters: Industrial chemical demand can exist without translating into qualified supplier share, repeat orders, or pricing power.
      diligencePath: Request anonymized customer concentration, qualification timelines, rejection rates, contract duration, and evidence of repeat orders by product family.
      relatedQuestionRefs: [QM004]
      relatedTableRefs: [TM003]
    - type: stale
      severity: minor
      topic: capacity-lens
      missingEvidence: A current plant-capacity and utilization schedule reconciled to the older 550,000 MT disclosure.
      whyItMatters: Historical design capacity may not represent current operating capacity, saleable output, or economic utilization.
      diligencePath: Reconcile current nameplate capacity, effective capacity, outage history, utilization, and planned commissioning by site.
      relatedQuestionRefs: [QM003, QM008]
      relatedTableRefs: [TM002]
