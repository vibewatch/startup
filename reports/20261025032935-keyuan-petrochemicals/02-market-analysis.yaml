chapter:
  number: 2
  title: Market Analysis
  summary: Keyuan operates across fuel-oil fine chemicals, petrochemicals, advanced materials, and emerging biodegradable plastics, so its addressable market is a portfolio of chemical value chains rather than one homogeneous category. Public evidence supports strong industrial demand and integration logic, but it does not support a clean company-specific SAM or SOM; adoption remains exposed to feedstock volatility, cyclicality, policy execution, and capital intensity.
sections:
  - id: market-boundary
    title: Market boundary and value-chain position
    body: Keyuan's relevant market boundary is best defined as industrial chemical inputs and materials sold into downstream manufacturing, not as the entire chemicals sector. Preqin describes fuel-oil fine chemicals including styrene, propylene, toluene, industrial hexane, petroleum ether, road asphalt, and transformer oil, while the 36Kr account describes more than 30 high-end fine-chemical products used in chemical, textile-dyeing, pharmaceutical, food, precision-electronics, and optical applications. The boundary therefore includes petrochemical feedstocks, solvents, specialty intermediates, elastomer and resin inputs, and selected biodegradable-plastic materials. It excludes unrelated commodity chemicals and downstream finished goods that Keyuan does not manufacture. The practical status quo is continued procurement of incumbent chemical grades from integrated producers; substitution depends on qualification, consistency, delivered cost, and supply assurance rather than on a software-style user switch.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-and-segments
    title: Sizing lenses and buyer segmentation
    body: >-
      A defensible sizing approach must use multiple lenses. The available
      company-specific sources provide product scope and one historical capacity
      disclosure, but not a current revenue denominator by product, geography, or
      customer. The older placement material states a 550,000 MT manufacturing
      design capacity and says expansion was intended to meet increasing market
      demand; this is an operating-capacity lens, not TAM or revenue. A separate
      PLA industry source reports China consumption of 240,000 tonnes in 2024, up
      60%, but that figure covers the national PLA category and cannot be treated
      as Keyuan's serviceable market. The 2026 Hurun index is a valuation context,
      not market size. These sources support a constrained market map, not a
      precise TAM/SAM/SOM calculation. Buyer ownership is likewise segmented:
      chemical producers and compounders buy intermediates and resins; electronics,
      pharmaceutical, food, textile, and automotive manufacturers specify
      performance and quality; procurement or plant operations usually owns the
      budget, with engineering and quality controlling qualification.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002, TM003]
    figureRefs: [FM001]
  - id: drivers-and-constraints
    title: Adoption drivers, constraints, and valuation relevance
    body: >-
      Demand drivers are industrial production, downstream material substitution,
      supply-chain security, and policy-supported biodegradable-plastic adoption.
      The 36Kr source attributes a roughly 20% cost reduction to upstream
      integration for an ABS-related project and reports a 2023 consolidated
      gross margin of 18.7%, but those are company-reported figures in a media
      article rather than an independent market benchmark. The PLA source
      describes policy and technology as twin drivers and says domestic scale
      production is expanding, while the BPI listing demonstrates that PLA demand
      is mediated by product specifications and certification in defined end-of-
      life environments. Constraints are equally material: chemical markets are
      cyclical, raw-material prices can move faster than pass-through, new plants
      consume capital before qualification and utilization mature, and
      policy-dependent biodegradable demand can disappoint. A comparable 2025
      polymer producer reported margin pressure, product-mix adjustment, and
      negative operating cash flow, which is useful adverse sector context but not
      a Keyuan forecast.
    claimRefs: [CM010, CM011, CM012, CM013]
    tableRefs: []
callouts:
  - calloutType: insight
    title: Market conclusion
    body: Keyuan has exposure to several credible industrial demand pools, but the public record does not identify a current company-specific denominator for SAM or SOM. Underwriting should therefore use product-level capacity, realized prices, utilization, qualification status, and customer concentration rather than headline industry size.
    claimRefs: [CM005, CM006, CM013]
  - calloutType: risk
    title: Main adoption risk
    body: The same integration and capacity strategy that can improve supply security also increases fixed-cost, financing, and utilization risk when downstream demand or pricing weakens.
    claimRefs: [CM010, CM012, CM013]
