company:
  name: Keyuan Petrochemicals
chapter:
  number: 6
  title: Customers
  summary: Public evidence supports broad industrial end-market exposure and two named customer relationships, but it does not establish current active-account counts, retention, contract duration, customer outcomes, or concentration. Historical capacity and revenue signals show commercial scale, while current customer durability remains a material diligence gap.
sections:
  - id: customer-segmentation
    title: Buyer and use-case segmentation
    body: Keyuan's public customer picture is organized around industrial applications rather than a disclosed account base. Company releases place SBS in shoe soles and tire treads and Butadiene Styrene Resin in packaging, medical instruments, toys, and other plastic products. A 2025 36Kr article broadens the described end markets to chemicals, printing and dyeing, pharmaceuticals, food, precision electronics, and optics, while a separate PLA market summary identifies food packaging, disposable tableware, medical devices, and automotive parts as downstream applications. These records support a diversified set of possible buyers, but they do not identify payer entities, current product-level revenue, geography, order frequency, or customer size bands. The segmentation is therefore an evidence-bounded map of applications, not a verified revenue mix.
    claimRefs: [CU001, CU003, CU004, CU012]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption trajectory and durability
    body: The strongest public adoption signals are production scale, historical revenue, and market demand rather than customer retention. Keyuan stated in 2010 that domestic SBS demand was projected at 750,000 metric tons against 600,000 metric tons of production capacity, and company materials described a 550,000-metric-ton annual design capacity after production began in October 2009. Later reporting supplied revenue figures for 2020 through the first three quarters of 2023 and described more than 50 Fortune 500 customers, but neither source provides active-account definitions or comparable customer cohorts. External market sources show rapid PLA consumption and PBAT capacity growth, which create end-market opportunity alongside supply competition. None of these measures is a substitute for shipments by customer, repeat purchases, renewals, or account-level profitability.
    claimRefs: [CU002, CU005, CU006, CU009, CU010, CU011, CU014]
    tableRefs: [TU002]
  - id: named-proof-and-concentration
    title: Named proof, expansion, and concentration risk
    body: The assigned evidence names Bridgestone and Adidas among a reported group of more than 50 Fortune 500 customers, but it supplies no contracts, facilities, products, volumes, dates, production status, or outcomes for those relationships. The Ningbo Institute of Technology agreement is useful evidence of an R&D partnership, not a customer deployment. Historical financing and balance-sheet records also show that production required substantial raw-material working capital and that reported current liabilities exceeded current assets in the displayed historical periods; this raises a durability question when customer payment terms and advances are not disclosed. Current external recognition in 2026 confirms that Keyuan remained visible as a private industrial company, but it does not validate retention or concentration. Underwriting therefore requires a current customer ledger, invoice-backed revenue bridge, contracts, and references.
    claimRefs: [CU005, CU007, CU008, CU013, CU015, CU016]
    tableRefs: [TU003]
    figureRefs: [FU001]
