      - [China PLA consumption, "240,000 MT; up 60%", "2024", "Reportify industry summary; medium", "Signals growing downstream consumption", "Keyuan-specific volume and customer conversion"]
    notes: "Values preserve each source's metric, period, and unit. Market-level PLA and PBAT figures are context, not Keyuan adoption, and 2023 Q3 revenue is not annualized."
