      - [Ningbo Institute of Technology, Materials R&D, "Joint research on commercial applications for Butadiene Styrene Resin", "R&D agreement; not a customer deployment", "Parties planned to share resulting rights", "Partner evidence does not establish customer revenue"]
    notes: "This is a partial enumeration of publicly named relationships, not a customer census. Partners and cohort claims are explicitly separated from verified production deployments."
    claimRefs: [CU001, CU003, CU005, CU016]
