chapter:
  number: 5
  title: "Product & Technology"
  summary: "Zepz operates a scaled digital remittance platform processing cross-border transfers across 130+ destination corridors via dual consumer brands WorldRemit and Sendwave, underpinned by a multi-rail payout network combining bank deposits, mobile money, and 25,000 cash pickup points. Recent technological developments highlight a strategic shift toward automation, Fireblocks stablecoin settlement infrastructure, and platform replatforming, alongside workforce cuts and heightened regulatory scrutiny under consumer remittance protection rules."
sections:
  - id: "product-offering-portfolio"
    title: "Product Offering and Multi-Brand Portfolio"
    body: "Zepz addresses global cross-border remittances through a differentiated multi-brand strategy anchored by WorldRemit and Sendwave. WorldRemit provides an omni-channel remittance experience supporting migrant workers sending money from approximately 50 source countries to recipients in over 130 destination countries across Africa, Asia, Europe, and the Americas. Sendwave operates as an agile, mobile-only application optimized specifically for key African and Asian diaspora routes, offering fee-free transfers funded by narrow foreign exchange spreads. To expand beyond transactional money transfers, Zepz deployed proceeds from its $267 million Series F round in late 2024 toward developing Zepz Wallet, establishing a stored-value ecosystem to reduce off-ramp friction. Furthermore, Zepz expanded into migrant financial services in January 2026 through the acquisition of Pomelo, integrating consumer credit lines and card products with international remittance rails to eliminate upfront cash funding constraints."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
    tableRefs:
      - "TE001"
  - id: "customer-workflows-and-payout"
    title: "Customer Workflows and Remittance Payout Channels"
    body: "The customer journey across Zepz's platforms is designed to replace friction-heavy brick-and-mortar money transfer agents with instant digital execution. Senders initiate transactions via native mobile applications on iOS and Android, funding transfers using debit cards, credit cards, or regional account-to-account rails including Apple Pay, Poli, Interac, iDEAL, Klarna Sofort, and Trustly. WorldRemit provides four distinct payout modalities tailored to receiver infrastructure in recipient countries: direct bank deposits, mobile wallet credits, cash pickup at more than 25,000 physical partner locations, and instant mobile airtime top-ups. Sendwave focuses directly on mobile money integration, depositing funds within minutes into widely adopted regional telco wallets such as M-Pesa in Kenya, MTN in Ghana and Uganda, and GCash in the Philippines. This diverse disbursement mesh provides high corridor flexibility, enabling receivers in unbanked or cash-dependent emerging markets to access liquidity immediately."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE010"
    tableRefs:
      - "TE002"
  - id: "platform-architecture-and-infrastructure"
    title: "Core Platform Architecture and Multi-Rail Infrastructure"
    body: "Zepz's technical architecture functions as a distributed, high-throughput payment orchestrator spanning consumer client layers, transaction processing microservices, treasury routing engines, and local payout settlement gateways. Following the integration of Sendwave with WorldRemit, the group embarked on a substantial core backend replatforming initiative aimed at automating payment processing, treasury liquidity management, and foreign exchange pricing across its 5,000+ corridor network. To address the persistent cost and settlement latency of traditional correspondent banking relationships, Zepz partnered with enterprise digital asset custodian Fireblocks, supported by a grant from the Solana Foundation. This integration embeds Fireblocks' secure wallet infrastructure and treasury automation directly into Zepz's settlement layer, enabling programmable, near-instant stablecoin clearing across priority emerging market corridors while maintaining institutional cryptographic custody controls."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE007"
      - "CE008"
      - "CE010"
    figureRefs:
      - "FE001"
  - id: "replatforming-and-operational-restructuring"
    title: "Engineering Replatforming, Automation, and Operational Restructuring"
    body: "Between 2023 and 2025, Zepz executed significant operational restructurings to eliminate technical redundancy and lower operating expenditures across its merged platforms. In May 2023, the group reduced headcount by 420 employees, representing 26% of its global workforce, specifically targeting customer care and engineering functions to shift operations from fragmented regional offices into centralized hubs. In February 2025, Zepz completed a third round of workforce reductions, eliminating 200 roles (20% of remaining staff) and closing operational hubs in Kenya and Poland. Management attributed these reductions to the successful rollout of advanced automation, artificial intelligence tooling, and core replatforming initiatives. However, external market observers note that continuous headcount reductions reflect severe competitive pressure from lower-cost peers like Wise and Revolut, alongside the operational complexity of consolidating disparate legacy codebases into a single unified architecture."
    claimRefs:
      - "CE008"
      - "CE009"
    tableRefs:
      - "TE003"
  - id: "trust-compliance-and-regulatory-controls"
    title: "Trust, Security, Compliance, and Regulatory Risk Controls"
    body: "Cross-border remittance operations require rigorous adherence to international financial regulations, anti-money laundering (AML) mandates, and statutory consumer protection standards. In the United States, Sendwave operates under the supervision of the Consumer Financial Protection Bureau (CFPB) and state regulators. In October 2023, the CFPB issued an enforcement consent order against Chime, Inc. (doing business as Sendwave), mandating $1.5 million in consumer redress and a $1.5 million civil money penalty for violations of the Consumer Financial Protection Act and the Remittance Transfer Rule under Regulation E. The Bureau established that Sendwave misrepresented transfer speeds and costs, failed to provide timely fund availability disclosures, and maintained inadequate error investigation procedures. This enforcement underscores the critical need for robust automated compliance telemetry across the remittance industry, a challenge also reflected in CFPB and state regulatory penalties against competitors Wise and MoneyGram."
    claimRefs:
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE014"
