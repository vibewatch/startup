  title: "Valuation"
  summary: "Zepz sustains substantial operational scale with 5.7 million customers and over $15 billion in annual cross-border volume, but underwriting its private market valuation remains constrained by opaque post-2024 financials, unresolved regulatory overhang, and postponed public exit paths."
sections:
  - id: "investment-thesis-and-underwriting-framework"
    title: "Investment Thesis and Underwriting Framework"
    body: "Evaluating Zepz requires balancing its defensible market footprint across high-volume remittance corridors against persistent structural opacity in capital structure and governance. Operating dual brands in WorldRemit and Sendwave, the group reaches migrant communities across more than 130 destination countries and 5,000 corridors, having facilitated over $15 billion in transaction volume. Furthermore, the company reported achieving full-year profitability in 2022 and maintains an active user base of 5.7 million individuals. However, the bull thesis of a scaled, cash-generative remittance incumbent is counterbalanced by sharp organizational restructuring, including workforce cuts of 26% in May 2023 and an additional 200 IT personnel in February 2025 alongside operational closures in Kenya and Poland. Without audited group disclosures post-2024, institutional underwriters cannot verify current operating margins, cash burn, or net revenue retention, leaving investment discipline centered on a cautious research-more posture."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
    tableRefs:
      - "TV001"
    figureRefs: []
  - id: "capitalization-history-and-valuation-discipline"
    title: "Capitalization History and Valuation Discipline"
    body: "The group's historical financing trajectory reveals significant private valuation marks that lack recent secondary liquidity validation. In August 2021, the group completed a $292 million round at a headline $5 billion valuation coinciding with the corporate rebrand to Zepz and integration of Sendwave. More recently, in October 2024, Zepz completed a $267 million Series F round led by Accel with participation from Leapfrog and TCV, alongside potential equity commitments from the International Finance Corporation. Global index benchmarks, such as the Hurun Global Unicorn Index, tracked Zepz at 26 billion RMB in April 2023, 35.5 billion RMB in April 2024, and 34 billion RMB in June 2026. Nevertheless, an envisioned initial public offering targeting a $6 billion valuation was postponed in 2022 amid financial audit verification hurdles and high executive turnover. The absence of public statutory filings on UK Companies House beyond the 2025 confirmation cycle means outside capital faces severe preference stack and dilution uncertainty."
    claimRefs:
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
    tableRefs:
      - "TV002"
    figureRefs: []
  - id: "scenario-modeling-and-downside-protections"
    title: "Scenario Modeling, Comparables, and Downside Protections"
    body: "Scenario analysis for Zepz spans bull, base, and bear trajectories driven by compliance costs, competitive pressure from Wise and Remitly, and expansion into digital wallet infrastructure. In October 2025, Zepz launched the Sendwave Wallet on the Solana blockchain utilizing USDC, and in January 2026 acquired Pomelo International to incorporate credit-building capabilities. In the bull scenario, stablecoin settlement efficiencies and credit card monetization expand customer lifetime value, supporting a re-rating toward scaled peers. In the bear case, severe regulatory compliance penalties—typified by CFPB consent orders penalizing Sendwave $3 million in restitution and penalties in October 2023, parallel CFPB actions against Wise, and state AG enforcement against MoneyGram—depress net margins and force structured down-rounds. The recommendation logic chains these operational variables directly into our underwriting stance."
    claimRefs:
      - "CV013"
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
    figureRefs:
      - "FV001"
