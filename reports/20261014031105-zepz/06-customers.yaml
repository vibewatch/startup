        - Reliable deposit into formal bank accounts without branch visit
        - Branch banking clearance hours and currency conversion delays
      - - GCash & PayMaya
        - Philippines / Mobile Wallet Receivers
        - Mobile wallet payout for Asian diaspora remittance
        - Production
        - Near-instant mobile wallet funding for recipients in Philippines
        - Dependent on recipient mobile e-wallet KYC status
      - - BDO Unibank & Metrobank
        - Philippines / Bank Account Receivers
        - Commercial bank account deposit and cash pickup locations
        - Production
