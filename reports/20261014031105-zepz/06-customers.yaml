    title: Multi-Corridor Distribution Footprint Across Emerging Markets
    body: Zepz maintains a structural distribution moat through direct payout integrations with dominant telecom mobile wallets such as Safaricom M-Pesa in Kenya and GCash in the Philippines, enabling near-instant cross-border liquidity for over 9 million customers across 5,000 corridors.
    claimRefs:
      - CU001
      - CU007
      - CU008
  - calloutType: risk
    title: Regulatory Enforcement and Disclosure Scrutiny on Remittance Fees
    body: The CFPB enforcement order requiring 3 million dollars in consumer redress and penalties against Sendwave demonstrates substantial regulatory risk surrounding deceptive zero-fee marketing claims and delivery timing disclosures, presenting customer attrition and compliance overhead.
    claimRefs:
      - CU012
      - CU014
