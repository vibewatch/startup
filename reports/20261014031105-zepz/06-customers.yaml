company:
  name: Zepz
chapter:
  number: 6
  title: Customers
  summary: Zepz serves over 9 million remittance customers across 5,000 global corridors through its WorldRemit and Sendwave brands, leveraging extensive mobile money and banking payout networks across Africa and Asia. While transaction volume expanded 25% year-to-date and digital settlement delivers structural cost advantages over traditional banks, customer retention and lifetime value are constrained by fierce fintech price competition and regulatory enforcement scrutiny over fee transparency.
sections:
  - id: customer-base-segmentation
    title: Customer Base Segmentation and Demographics
    body: Zepz operates a bi-sided customer model fundamentally anchored in cross-border migrant remittance corridors. Senders predominantly comprise first- and second-generation expatriate workers and diaspora professionals residing in established Western economies, notably the United States, United Kingdom, and the European Union. These individuals routinely remit funds to support family livelihoods, education expenses, and emergency financial needs in emerging markets across Africa, Asia, and Latin America. On the receiving side, customer preferences diverge markedly between banked recipients who accept direct account deposits and unbanked populations who rely on mobile money ecosystems such as Safaricom M-Pesa or cash pickup agents. By operating dual consumer platforms through WorldRemit and Sendwave, Zepz captures both multi-channel remittances and mobile-first, app-based corridor transfers, though average transaction size and corridor concentration remain undisclosed in public filings.
    claimRefs:
      - CU001
      - CU002
      - CU003
    tableRefs:
      - TU001
  - id: adoption-trajectory-and-corridor-reach
    title: Adoption Trajectory and Geographic Footprint
    body: The aggregate adoption trajectory of Zepz reflects extensive global scale, with company disclosures claiming over 9 million active customers operating across more than 5,000 corridors in 130 countries. Following the strategic consolidation of Sendwave and operational restructuring in 2023, management reported that customer transaction volumes expanded by 25% year-to-date, alongside customer acquisition acceleration averaging 30% and peaking at 80% in high-velocity regional corridors. From a pricing perspective, digital money transfer operators possess substantial cost advantages over traditional correspondent banking channels. World Bank benchmarking reveals that digital-only MTOs charged an average of 3.97% in early 2024, compared to commercial bank fees averaging 12.66%, enabling Zepz to sustain customer acquisition momentum despite macroeconomic volatility and inflationary headwinds.
    claimRefs:
      - CU001
      - CU005
      - CU006
      - CU013
    tableRefs:
      - TU002
  - id: named-customer-and-payout-partners
    title: Commercial Deployment and Named Payout Partner Network
    body: Unlike business-to-business enterprise software providers, customer proof in consumer remittances is evidenced through bilateral commercial integrations with institutional payout partners, national clearing houses, and mobile network operators. WorldRemit maintains verified production deployments with tier-one commercial banks and dominant mobile wallet providers across its primary destination markets. In Kenya, recipients receive disbursements via Safaricom M-Pesa, Equity Bank, and Co-operative Bank of Kenya. In the Philippines, the network terminates transactions into BDO Unibank, Metrobank, and leading digital wallets including GCash and PayMaya. Concurrently, Sendwave provides zero-fee consumer corridors across more than 50 nations in Africa and Asia, though fee-free marketing claims are offset by embedded foreign exchange spreads typically within 0.5% of prevailing mid-market exchange rates.
    claimRefs:
      - CU007
      - CU008
      - CU004
    tableRefs:
      - TU003
  - id: customer-journey-and-retention
    title: Customer Journey and Repeat Transaction Dynamics
    body: The end-to-end customer journey begins with mobile onboarding, where senders register through iOS or Android applications and undergo digital identity verification before initiating a transfer. Senders fund payments via debit cards or linked bank accounts, selecting payout destinations based on upfront delivery estimates and foreign exchange quotes. To strengthen customer retention and expand wallet share, Zepz has initiated partnerships with infrastructure providers including Fireblocks to integrate stablecoin settlement rails, supported by a Solana Foundation grant. Management also announced plans to launch proprietary digital wallet products, seeking to evolve from a transactional remittance utility into a primary financial repository for migrant households. However, customer expansion into ancillary financial products faces intense competition from established global digital wallets like PayPal and localized fintech ecosystems.
    claimRefs:
      - CU002
      - CU009
      - CU010
      - CU011
    figureRefs:
      - FU001
  - id: consumer-protection-and-retention-risks
    title: Consumer Protection, Regulatory Scrutiny, and Retention Risks
    body: Consumer durability and trust in cross-border remittances are heavily vulnerable to disclosure transparency, speed accuracy, and regulatory compliance. In October 2023, the Consumer Financial Protection Bureau issued a major consent order against Sendwave, requiring 1.5 million dollars in consumer redress and a 1.5 million dollar civil penalty after finding that the service misrepresented transfer speeds and costs, forced customers to improperly waive statutory rights, and failed to conduct compliant error investigations. Similar regulatory scrutiny has challenged competitors including Wise and MoneyGram, demonstrating widespread enforcement pressure across the remittance sector under the Electronic Fund Transfer Act and Regulation E. Given that price sensitivity and transfer reliability dictate sender loyalty, recurring compliance violations and operational payout delays represent acute risks to customer retention and lifetime value.
    claimRefs:
      - CU012
      - CU014
      - CU004
      - CU013
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / Payer Profile
      - Core Use Case
      - Scale & Reach
      - Strategic & Economic Value
      - Diligence Gap
    rows:
      - - African Diaspora Senders
        - Migrant workers in US, UK, and EU
        - Family support, emergency transfers, and bill payments
        - Millions of active users across UK, US, and Europe corridors
        - High transaction frequency with stable recurring transfer patterns
        - Corridor-level average transaction value not disclosed
      - - Asian Diaspora Senders
        - Migrant professionals and service workers
        - Education support, household maintenance, and savings deposits
        - High-volume corridors to India, Philippines, and Bangladesh
        - High cumulative volume with strong repeat usage
        - Competition from bank wires on higher-value transfers
      - - Unbanked Emerging Market Receivers
        - Family recipients in East/West Africa and Southeast Asia
        - Mobile money cashing out and mobile airtime top-up
        - Coverage across 50+ countries with M-Pesa, GCash, and MTN
        - Drives viral recipient-to-sender acquisition and retention
        - Dependent on local mobile network operator uptime and float
      - - Banked Account Receivers
        - Recipients in established financial systems (e.g. Nigeria, India)
        - Direct bank account deposit for household and bill settlement
        - Thousands of integrated banking institutions globally
        - Lower cash handling cost and higher regulatory traceability
        - Clearing delays and local currency liquidity constraints
    notes: Customer segments segmented by sender geography and recipient payout method based on WorldRemit and Sendwave public operational footprint.
    claimRefs:
      - CU001
      - CU002
      - CU003
