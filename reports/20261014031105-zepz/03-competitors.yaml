        - Moderate (Primarily Bank Account and Multi-Currency Card)
        - High (Bank Account, Cash Pickup, Mobile Wallet)
        - Very High (Dominant Cash Agent Network, Bank, Mobile)
      - - Mobile Money Integration
        - Extensive (M-Pesa, GCash, Airtel, MTN across Africa/Asia)
        - Limited (Selective regional mobile wallet integrations)
        - Extensive (Key emerging market mobile money partners)
        - Moderate (Integrated into major regional mobile money services)
      - - Transfer Settlement Speed
        - 85% settled in minutes via digital disbursement
        - Real-time to same-day via local clearing networks
        - Minutes for express card funding; 3-5 days economy
        - Instant retail cash payout; variable online deposit speed
      - - Pricing Transparency
        - Upfront fee and rate display; zero fee on Sendwave
        - Industry benchmark mid-market rate with exact unbundled fee
        - Upfront fee display with corridor-specific FX markup
        - Complex fee tiers and variable retail agent FX markups
      - - Regulatory Compliance History
        - CFPB consent order against Sendwave in 2023 ($3M)
        - CFPB amended consent order in 2025 ($495k total)
        - Compliant public reporting; ongoing state examiner oversight
        - Recurrent federal/state consent orders (NY AG $250k in 2025)
    notes: Comparison based on reported platform specifications, regulatory consent decrees, and verified app capabilities.
    claimRefs:
      - CP004
      - CP006
      - CP007
      - CP008
      - CP010
  - id: TP003
    title: Pricing Models, Fee Structures, and Economics Comparison
    columns:
      - Provider
      - Fee & FX Margin Model
      - Typical Transfer Cost
      - Speed / Settlement SLA
      - Contract / Account Model
      - Strategic Implication
    rows:
      - - Sendwave (Zepz)
        - Zero upfront transfer fees; FX markup model (~0.5%)
        - 0.4% - 1.2% total cost via embedded exchange rate margin
        - Minutes to mobile money wallets
        - Pay-as-you-go mobile app consumer account
        - Highly competitive on Africa/Asia mobile corridors; low margin buffer
      - - WorldRemit (Zepz)
        - Fixed nominal transfer fee plus corridor FX spread
        - 1.0% - 2.5% combined fee and FX spread depending on corridor
        - 85% within minutes; instant for cash pickup
        - Pay-as-you-go multi-corridor consumer account
        - Balances cash collection convenience with sustainable corridor margins
      - - Wise
        - Zero FX markup (mid-market rate) plus transparent variable fee
        - 0.4% - 0.8% unbundled service fee
        - Instant to 24 hours depending on local rails
        - Multi-currency account and corporate/consumer balance
        - Sets digital pricing floor for banked customers; pressures competitors
      - - Remitly
        - 'Dual tier: Express (higher card fee) and Economy (lower ACH fee)'
        - 1.5% - 3.0% total effective cost including FX spread
        - Instant (Express) or 3-5 banking days (Economy)
        - Pay-as-you-go consumer app account
        - Monetizes consumer urgency via tiered settlement speed structure
      - - Western Union / MoneyGram
        - Front-end retail transaction fee plus variable FX margin spread
        - 3.0% - 6.0%+ effective cost for cash-to-cash transactions
        - Minutes for cash pickup; 1-3 days for bank deposit
        - Walk-in cash retail or registered digital user
        - Extracts premium pricing from unbanked users; vulnerable to digital shift
    notes: >-
      Effective costs reflect typical corridor spreads on $200–$500 principal sends based on public disclosures and
      review benchmarks.
    claimRefs:
      - CP004
      - CP011
      - CP012
