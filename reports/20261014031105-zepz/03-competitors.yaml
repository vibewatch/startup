    rows:
      - - Wise (WISE)
        - Digital Direct Peer
        - Public (LSE); £8B+ listing valuation; global scale
        - Expatriates, professionals, multi-currency banked users
        - Guaranteed mid-market FX with upfront transparent fees
        - Limited cash pickup footprint in cash-heavy emerging markets
      - - Remitly (RELY)
        - Digital Direct Peer
        - Public (NASDAQ); ~$6.9B IPO cap; 170+ destination countries
        - Cross-border immigrants and migrant workers
        - Fast digital app delivery to bank, wallet, and cash agents
        - Higher FX markups on specific corridors; persistent GTM burn
      - - Western Union (WU)
        - Legacy Incumbent
        - Public (NYSE); ~$15B historical cap; 500k+ retail agents
        - Broad global migrant population, unbanked senders
        - Unmatched global retail cash agent footprint and brand awareness
        - High legacy retail agent overhead, slower digital transformation
      - - MoneyGram
        - Legacy Incumbent
        - Private Equity (Madison Dearborn $1.8B); 440k global points
        - Cash-reliant consumer remitters in 200+ countries
        - Dense retail agent network with expanding digital app
        - History of regulatory compliance actions; PE debt leverage
      - - TapTap Send
        - Regional VC Challenger
        - Later-stage VC; ~$154M funding; Africa & Asia corridors
        - African, Asian, and Latin American diaspora communities
        - Zero-fee mobile app model with instant mobile-money payouts
        - Narrow geographic corridor coverage; dependent on venture subsidization
    notes: 'Source: Primary company disclosures, regulatory enforcement filings, and public capital markets comp data.'
    claimRefs:
      - CP002
      - CP003
      - CP005
      - CP014
