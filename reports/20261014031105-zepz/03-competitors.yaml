company:
  name: Zepz
chapter:
  number: 3
  title: Competitors
  summary: >-
    Zepz operates a scaled dual-brand remittance platform across WorldRemit and Sendwave, competing directly against
    public digital peers Wise and Remitly as well as retail incumbents Western Union and MoneyGram. While its
    multi-modal mobile money and cash network provides broad emerging-market corridor coverage, high sender multi-homing
    and recurrent industry-wide regulatory compliance enforcement present ongoing margin and defensibility challenges.
sections:
  - id: competitive-landscape-substitutes
    title: Competitive Landscape and Alternative Substitution
    body: >-
      The cross-border consumer remittance ecosystem encompasses four distinct competitor categories: digital-native
      cross-border networks, traditional retail agent networks, localized emerging corridor specialists, and informal or
      digital cash substitutes. Zepz occupies a dual-brand positioning in this landscape through WorldRemit and
      Sendwave, bridging digital senders across 50 origin countries with recipients in 130 destination markets. Its
      primary direct digital peers are Wise (LSE: WISE) and Remitly (NASDAQ: RELY), both of which completed public
      listings in 2021 and leverage transparent digital app experiences. In contrast, legacy incumbents Western Union
      and MoneyGram maintain vast physical branch networks that dominate cash payout corridors in emerging markets but
      suffer from higher overhead and fee friction. Additionally, informal Hawala brokers and emerging blockchain
      stablecoin protocols present persistent status-quo and next-generation substitutes that threaten traditional fee
      pools.
    claimRefs:
      - CP001
      - CP002
      - CP005
      - CP013
    figureRefs:
      - FP001
  - id: competitor-profiles-incumbent-scale
    title: Competitor Scale, Funding, and Geographic Profiles
    body: >-
      Competitor scale and capitalization reflect divergent operating strategies across the remittance landscape.
      Publicly traded peers Wise and Remitly command multi-billion-dollar market valuations and process tens of billions
      in annual cross-border volume, prioritizing digital-only bank-to-bank and wallet corridors. Incumbent giants
      Western Union and MoneyGram possess entrenched distribution, with MoneyGram supporting 440,000 retail locations
      across 200 countries prior to its buyout by Madison Dearborn Partners. Regional challengers such as TapTap Send,
      TransferGo, and LemFi have collectively raised hundreds of millions in venture capital to capture specific
      diaspora corridors into Africa and Asia. Zepz achieved over $17 billion in transferred volume across 120 million
      transactions in 2025, operating profitably at the cash-flow level while balancing physical cash collection with
      digital mobile money.
    claimRefs:
      - CP002
      - CP003
      - CP005
      - CP014
    tableRefs:
      - TP001
  - id: capability-regulatory-comparison
    title: Capability, Distribution, and Regulatory Compliance Posture
    body: >-
      Differentiation across international remittance providers centers on payout flexibility, transaction settlement
      speed, and regulatory compliance robustness. While Wise excels in account-to-account transparency and mid-market
      exchange rate pricing, it offers limited cash pickup infrastructure in emerging markets. WorldRemit differentiates
      by supporting cash collection points, bank transfers, mobile wallets, and airtime top-ups across Africa, Asia, and
      Latin America, settling approximately 85% of transactions within minutes. However, regulatory scrutiny represents
      an industry-wide challenge under consumer protection and anti-money laundering mandates. The Consumer Financial
      Protection Bureau and state regulators have sanctioned major players across the board: Wise paid roughly $450,000
      in consumer redress and civil penalties for deceptive fee disclosures in 2025, MoneyGram settled for $250,000 with
      the New York Attorney General, and Sendwave was penalized $3 million in combined redress and penalties in late
      2023 for Remittance Transfer Rule non-compliance.
    claimRefs:
      - CP004
      - CP006
      - CP007
      - CP008
      - CP010
    tableRefs:
      - TP002
  - id: pricing-switching-durability
    title: Fee Economics, Multi-Homing Dynamics, and Moat Durability
    body: >-
      Pricing transparency and sender loyalty govern long-term defensibility in digital remittances. Sendwave utilizes a
      zero upfront transfer fee structure on key African corridors, extracting margin almost entirely through an
      exchange rate markup typically within 0.5% of the mid-market rate. WorldRemit employs a hybrid model of modest
      flat fees paired with corridor-specific FX margins. Because migrant workers are highly price-sensitive and face
      minimal friction when installing alternative smartphone applications, multi-homing is prevalent across platforms.
      Providers hold limited traditional switching moats beyond recipient payout convenience and brand trust. To defend
      operating margins in an increasingly commoditized fee environment, Zepz enacted consecutive workforce
      restructurings in 2023 and 2025, while deploying stablecoin settlement pilots through Fireblocks and Solana to
      lower intermediary banking costs.
    claimRefs:
      - CP009
      - CP011
      - CP012
      - CP013
    tableRefs:
      - TP003
