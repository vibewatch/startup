callouts:
  - calloutType: risk
    title: Commoditization Pressure from Zero-Fee Mobile Competitors
    body: >-
      Consumer remittances lack structural software lock-in, with users actively multi-homing to capture promotional FX
      rates. Venture-backed challengers like TapTap Send and Sendwave offer zero transfer fees on key African and Asian
      corridors, forcing WorldRemit to defend take-rates primarily through FX spreads while absorbing rising compliance
      and operational overhead.
    claimRefs:
      - CP011
      - CP012
  - calloutType: insight
    title: Stablecoin Infrastructure as a Defense Against Correspondent Banking Costs
    body: >-
      Zepz’s strategic partnership with Fireblocks and Solana to deploy USDC remittance channels represents a critical
      long-term hedge. By shifting settlement from multi-day correspondent banking chains to real-time blockchain rails,
      Zepz aims to reduce intermediary FX spreads and protect unit economics against lower-cost digital rivals.
    claimRefs:
      - CP013
