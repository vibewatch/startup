evidenceGaps:
  - type: missing-source
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited group-level annual income statements, gross profit, EBITDA, and cash flow statements for fiscal years 2024
      through 2025.
    whyItMatters: >-
      Public underwriters and investors cannot evaluate Zepz's standalone unit economics, operating burn, or path to
      profitability without audited consolidated financials.
    diligencePath: >-
      Request audited UK Companies House statutory accounts or confidential management accounts via virtual data room
      diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
      - TO002
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Post-money valuation and full liquidation preference stack for the 2024 $250M-$267M Accel-led equity round.
    whyItMatters: >-
      Without valuation disclosures, investors cannot determine dilution, common equity downside protection, or whether
      the 2024 financing was a down-round from the $5.0B peak.
    diligencePath: Obtain capitalization table and share certificate filings from Companies House or venture syndicate disclosure.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: corridor-economics
    missingEvidence: >-
      Audited breakdown of transaction volume, gross revenue, and take-rates isolated by individual geographic corridor
      (e.g., US-to-Nigeria vs UK-to-Kenya).
    whyItMatters: >-
      Without corridor-level unit economics, it is impossible to evaluate whether growth is driven by high-margin
      proprietary corridors or commoditized competitive routes.
    diligencePath: >-
      Request confidential management accounts detailing net revenue margin, partner payout costs, and corridor-level
      contribution margin.
  - type: conflicting-data
    severity: material
    topic: active-customer-base
    missingEvidence: >-
      Reconciled monthly active sender count separating WorldRemit web senders, Sendwave mobile app senders, and dormant
      historical accounts.
    whyItMatters: >-
      Public materials report differing metrics ranging from "millions of people" to 5.7M customer records, obscuring
      actual sender retention and cohort repeat rates.
    diligencePath: Obtain cohort retention curves and monthly transacting user (MTU) metrics from internal payment analytics.
  - type: missing-source
    severity: minor
    topic: stablecoin-settlement-share
    missingEvidence: >-
      Precise percentage share of total transfer volume settled via stablecoins (Sendwave Wallet) versus traditional
      fiat banking rails.
    whyItMatters: >-
      Understanding stablecoin adoption velocity determines whether crypto rails provide genuine unit cost advantages or
      remain an early-stage experimental pilot.
    diligencePath: >-
      Review Sendwave Wallet on-chain transaction volumes and liquidity treasury settlement reports under non-disclosure
      agreement.
  - type: private-evidence-only
    severity: material
    topic: competitor-unit-economics
    missingEvidence: >-
      Corridor-specific realized take rates, customer acquisition unit economics, and churn rates for venture-backed
      regional remittance competitors such as TapTap Send, LemFi, and NALA.
    whyItMatters: >-
      Private digital rivals operate with aggressive localized marketing and zero-fee entry promotions in high-volume
      African and Asian corridors, directly threatening Sendwave and WorldRemit gross margins.
    diligencePath: >-
      Review private competitor regulatory filings with the UK Financial Conduct Authority and state money transmitter
      regulatory reports, or conduct targeted primary corridor merchant interviews.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: >-
      Audited consolidated group financial statements (income statement, balance sheet, cash flows) for FY2023 through
      FY2025.
    whyItMatters: >-
      Without audited financial statements, investors cannot confirm true gross margin trajectory, EBITDA, cash burn
      rate, or revenue quality.
    diligencePath: >-
      Request confidential virtual data room access to audited statutory and consolidated accounts under non-disclosure
      agreement.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: corridor-unit-economics
    missingEvidence: >-
      Granular corridor-by-corridor breakdown of gross transaction volume, realized take rate, pay-in acquiring fees,
      and payout partner commission costs.
    whyItMatters: >-
      Monetization sustainability depends on whether top high-volume remittance corridors achieve positive contribution
      margins after payment processing and partner revenue share.
    diligencePath: Obtain management reporting package showing cohort contribution margins across top 20 corridors.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cfpb-remediation
    missingEvidence: >-
      Independent compliance audit or management-certified reporting confirming full operational remediation of CFPB
      Remittance Transfer Rule disclosure and error-resolution compliance deficiencies.
    whyItMatters: >-
      Assessing whether historical compliance breakdowns have been permanently remediated in production software
      architecture is critical to quantifying ongoing regulatory and operational risk.
    diligencePath: >-
      Request internal compliance committee reports, third-party SOC and regulatory audit documentation, and customer
      dispute resolution logs during management diligence.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: developer-metrics
    missingEvidence: >-
      Public developer documentation, sandbox API uptime status, and latency SLA metrics for Zepz's partner integration
      gateways.
    whyItMatters: >-
      Public engineering telemetry is unavailable because Zepz maintains closed, proprietary banking and telco partner
      APIs rather than an open developer portal.
    diligencePath: >-
      Request technical architecture specifications, API documentation, and partner gateway uptime SLAs during technical
      diligence.
    relatedQuestionRefs: []
    relatedTableRefs: []
