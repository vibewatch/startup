callouts:
  - calloutType: insight
    title: The Shift from Legacy Cash Agents to Digital Corridors
    body: The global cross-border remittance market is undergoing a structural transition from offline retail cash agent networks toward mobile-first digital channels. By combining WorldRemit's extensive 5,000-corridor network with Sendwave's fee-free mobile app model, Zepz captures high-frequency family support transfers while leveraging exchange rate spreads to build defensible unit economics in underserved emerging market corridors.
    claimRefs:
      - CM003
      - CM004
      - CM005
  - calloutType: risk
    title: Regulatory Compliance Overhead and Fee Transparency Friction
    body: Cross-border consumer payments face severe regulatory scrutiny across send and payout jurisdictions. Sendwave's $3 million combined redress and civil penalty from the CFPB underscores that fee-free marketing claims require strict adherence to statutory disclosures regarding exchange rate markups and delivery timing, requiring substantial ongoing investment in compliance infrastructure and legal controls.
    claimRefs:
      - CM006
      - CM010
      - CM014
