        - Immediate family living expenses, tuition, or medical bills
      - - Professional Expatriates
        - Salaried corporate and healthcare diaspora professionals
        - Self or family in home country, property investments
        - Scheduled recurring monthly transfers or opportunistic sends
        - Household disposable income and savings budget
        - Predictable monthly commitment, favorable FX exchange rate swings
      - - Sendwave App-First Users
        - Mobile-native smartphone users in high-density corridors
        - Mobile money recipients (e.g., M-Pesa, MTN Mobile Money)
        - Zero-fee app transfer with transparent FX margin
        - Individual remitter personal cash account
        - Desire for transparent zero-fee pricing and instant mobile delivery
      - - Emerging-Market Digital Wallet Users
        - Recipients transitioning from cash-out to digital holding
        - Unbanked/underbanked local consumers in recipient markets
        - Store-of-value in Sendwave Wallet / stablecoin balances
