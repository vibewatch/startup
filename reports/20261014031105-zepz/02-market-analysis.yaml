  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: corridor-economics
      missingEvidence: Audited breakdown of transaction volume, gross revenue, and take-rates isolated by individual geographic corridor (e.g., US-to-Nigeria vs UK-to-Kenya).
      whyItMatters: Without corridor-level unit economics, it is impossible to evaluate whether growth is driven by high-margin proprietary corridors or commoditized competitive routes.
      diligencePath: Request confidential management accounts detailing net revenue margin, partner payout costs, and corridor-level contribution margin.
    - type: conflicting-data
      severity: material
      topic: active-customer-base
      missingEvidence: Reconciled monthly active sender count separating WorldRemit web senders, Sendwave mobile app senders, and dormant historical accounts.
      whyItMatters: Public materials report differing metrics ranging from "millions of people" to 5.7M customer records, obscuring actual sender retention and cohort repeat rates.
      diligencePath: Obtain cohort retention curves and monthly transacting user (MTU) metrics from internal payment analytics.
    - type: missing-source
      severity: minor
      topic: stablecoin-settlement-share
      missingEvidence: Precise percentage share of total transfer volume settled via stablecoins (Sendwave Wallet) versus traditional fiat banking rails.
      whyItMatters: Understanding stablecoin adoption velocity determines whether crypto rails provide genuine unit cost advantages or remain an early-stage experimental pilot.
      diligencePath: Review Sendwave Wallet on-chain transaction volumes and liquidity treasury settlement reports under non-disclosure agreement.
