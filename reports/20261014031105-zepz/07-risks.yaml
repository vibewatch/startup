callouts:
  - calloutType: risk
    title: Regulatory Precedent and Remediation Oversight
    body: The CFPB's 2023 order against Sendwave highlights that retail remittance platforms face immediate regulatory and financial liability when transfer timelines, error investigations, and fee disclosures fall short of statutory requirements. Ongoing compliance audits and adherence to multi-state money transmission standards remain essential to avoid secondary enforcement.
    claimRefs:
      - CR001
      - CR002
      - CR013
  - calloutType: recommendation
    title: Monitoring Stablecoin Rail Dependencies and Executive Governance
    body: Underwriting Zepz requires tracking both third-party custody and screening reliability across Fireblocks and TRM Labs, alongside formal resolution of the permanent chief executive officer succession. Investors should require verified documentation of CFPB remediation and board governance structures prior to capital commitment.
    claimRefs:
      - CR006
      - CR007
      - CR014
