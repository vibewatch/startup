            body: >-
              跨境汇款必须严格遵守国际金融法规、反洗钱（AML）要求和法定消费者保护标准。在美国，Sendwave 接受消费者金融保护局（CFPB）及州监管机构监督。2023 年 10 月，CFPB 对 Chime,
              Inc.（以 Sendwave 经营）发出同意执法令，因违反《消费者金融保护法》和 Regulation E 下的《汇款转账规则》，要求支付 $1.5M 消费者赔付和 $1.5M 民事罚款。该局认定
              Sendwave 误报转账速度和成本、未及时披露资金可用性，并维持不足的错误调查流程。这一执法说明汇款业需要强健的自动化合规监测，Wise 和 MoneyGram 受到 CFPB 及州监管处罚也印证了这一挑战。
