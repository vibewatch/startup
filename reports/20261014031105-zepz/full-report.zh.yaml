chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营品牌与商业模式
        blocks:
          - type: paragraph
            body: >-
              Zepz 是一家总部位于伦敦、专注数字跨境消费汇款的全球金融科技集团。集团于 2021 年由 WorldRemit 与 Sendwave 战略合并成立：前者由索马里兰移民 Ismail Ahmed 于 2010
              年创立，后者是 2014 年成立的应用汇款专业公司。集团采用多品牌模式，覆盖不同移民通道和用户习惯：WorldRemit 支持向银行账户、移动钱包、现金取款代理点汇款及话费充值；Sendwave
              则主打低成本、移动优先体验，重点服务非洲和亚洲的移动钱包通道。两大品牌合计覆盖 50 个汇出市场、130 多个收款国家和地区、全球 5,000 多条通道，服务超过 900 万客户。2025 财年，Zepz
              处理的汇款总额超过 $17B，来自超过 5,000 万笔客户交易，显示其在全球支付生态中的运营规模可观。
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO007
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
