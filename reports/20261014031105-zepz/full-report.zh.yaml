  - id: FV001
    title: 投资判断逻辑流程
    type: flow
    summary: 按顺序设定尽调关卡，从运营规模一路核查监管阻力和估值不透明度，最终得出继续研究的判断。
    data:
      nodes:
        - id: N1
          label: 运营规模
          detail: 覆盖 130 个目的地国家和 5,000 条通道的 5.7M 客户
          tone: positive
        - id: N2
          label: 监管审查
          detail: 过往 CFPB 同意令涉及 $3M 罚款/赔偿，另有同业执法案例
          tone: warning
        - id: N3
          label: 重组影响
          detail: 裁员包括 2023 年削减 26%，以及 2025 年削减 200 名 IT 员工
          tone: warning
        - id: N4
          label: 估值不透明
          detail: 历史上的 $5B 融资轮和 34B RMB 指数估值缺乏审计支持
          tone: negative
        - id: N5
          label: 资本偏好风险
          detail: 累计融资超过 $1.1B，使普通股面临悬垂压力
          tone: risk
        - id: N6
          label: 投资判断结论
          detail: 建议继续研究，风险高且估值已透支
          tone: neutral
      edges:
        - from: N1
          to: N2
          label: 受……制约
        - from: N2
          to: N3
          label: 叠加于
        - from: N3
          to: N4
          label: 导向
        - from: N4
          to: N5
          label: 进一步强化
        - from: N5
          to: N6
          label: 最终形成
    approximationNotes: 流程拓扑对应定性投资判断阶段。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV008
      - CV014
