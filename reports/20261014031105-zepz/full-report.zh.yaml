    summary: 按时间梳理定义 Zepz 演进的创立、融资、重组、监管及产品关键里程碑。
    data:
      items:
        - label: '2010'
          title: WorldRemit Founded
          detail: Ismail Ahmed 在伦敦创立 WorldRemit，将跨境汇款转账搬到线上。
          tone: positive
        - label: '2014'
          title: Sendwave Launch
          detail: Sendwave 推出移动优先应用，向东非提供低成本汇款转账。
          tone: neutral
        - label: '2021'
          title: Sendwave Acquisition and Zepz Creation
          detail: WorldRemit 收购 Sendwave，并统一归于 Zepz 旗下；以 $5.0B 估值完成 $292M E 轮融资。
          tone: positive
        - label: '2022'
          title: IPO Postponement & Restructuring
          detail: 市场低迷之际，Zepz 搁置 $6.0B 的美国 IPO 计划；CEO Breon Corcoran 离任，公司缩减员工规模。
          tone: critical
        - label: '2023'
          title: CFPB Enforcement Action
          detail: 美国 CFPB 因欺骗性费用向 Sendwave 发布同意令，要求支付 $3.0M 补偿及罚款。
          tone: critical
        - label: '2024'
          title: $267M Equity Financing & Debt Refinancing
          detail: Accel、LeapFrog、TCV 和 IFC 注入 $267M 以偿还高成本债务；投后估值未披露。
          tone: positive
        - label: '2025'
          title: Sendwave Solana Wallet Launch
          detail: Zepz 在 Solana 上推出 Sendwave 数字美元钱包，并集成 TRM Labs 以满足反洗钱合规要求。
          tone: positive
        - label: '2026'
          title: Interim Leadership & Profitability Focus
          detail: 临时 CEO Barrie Morris 领导统一运营，为 130+ 个市场的 9M+ 用户提供服务。
          tone: neutral
    approximationNotes: null
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO010
      - CO011
      - CO012
      - CO013
