        - 零汇率加价（中间价），另收透明的浮动费用
        - 0.4% - 0.8% 的未捆绑服务费
        - 视当地支付通道而定，即时至 24 小时到账
        - 多币种账户及企业 / 消费者余额
        - 为有银行账户的客户设定数字化价格底线；挤压竞争对手
      - - Remitly
        - 双层定价：Express（更高的银行卡费用）与 Economy（更低的 ACH 费用）
