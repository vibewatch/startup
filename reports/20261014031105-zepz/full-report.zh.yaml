  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、规模测算与替代动态
        blocks:
          - type: paragraph
            body: >-
              Zepz 的核心可服务市场严格聚焦跨境消费者对消费者（P2P）汇款：国际移民工人频繁向发展中国家的家人汇出小额款项，通常每笔
              $200–$500。该边界明确排除机构批发资金管理、企业贸易结算和投机性加密货币交易，只关注侨民家庭的刚性现金流。过去，汇款业由依赖实体零售代理网络和缓慢代理行体系的传统运营商主导，交易成本高、结算需数日。Zepz
              通过 WorldRemit 和 Sendwave 以移动端、网页界面替代现金柜台，并以算法路由外汇、消除门店成本，把端到端转账延迟压缩到数分钟，同时提供透明费率。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM004
              - CM005
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM009
      - number: '2.2'
        title: 可服务市场测算视角与平台规模
        blocks:
          - type: paragraph
            body: >-
              评估 Zepz 的市场机会需要多个测算视角，而非一个笼统的 TAM。到 2025 年，随着拉美、非洲和亚洲的国际移民通道扩张，全球跨境汇款市场达到 $895B。其中特别适合数字服务的
              SAM，即完全数字化的汇出端转账，估计为 $150B–$200B，受智能手机普及和侨民数字银行渗透推动。Zepz 的可服务市场还受其在 50 个汇出国的监管牌照及覆盖 5,000
              多条通道的本地收款合作关系约束，对应约 $40B–$50B 的直接可触达通道流量。2025 年，Zepz 完成客户转账超过 $17B，超过 2022 年记录的 $15B 规模。在 Accel
              和国际金融公司的机构增长支持下，集团继续深耕连接 OECD 国家与新兴市场的高流量通道。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.3'
        title: 买方细分、用户画像与采用流程
        blocks:
          - type: paragraph
            body: >-
              Zepz
              核心汇款通道的客户由不同汇款人和收款人构成，他们受刚性家庭责任和固定汇款周期驱动。主要汇款人是居住在北美、西欧和中东的蓝领移民工人及第一代侨民专业人士，每月将固定比例的收入汇给非洲、亚洲和拉美的家属。在这一流程中，汇款人负责预算并承担经济付款，收款人则是家庭受益者，用钱支付基本生活、教育和医疗费用。Sendwave
              以简洁的零费转账模式吸引移动优先的侨民社群，通常通过 1%–3% 的窄幅汇率点差变现，从而消除前置交易障碍。收款端也越来越绕过银行账户，转而使用 M-Pesa、MTN Mobile Money
              等本地移动支付运营商和整合式数字钱包，形成端到端数字生命周期，锁定汇款人忠诚度。
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM009
              - CM011
      - number: '2.4'
        title: 增长驱动、监管障碍与运营约束
        blocks:
          - type: paragraph
            body: >-
              Zepz 目标市场的采用增长受数字钱包生态和新兴区块链基础设施的长期转向推动，其中包括与 TRM Labs、Fireblocks
              合作的稳定币结算，以绕开昂贵的代理行通道。但增长也受到关键结构性约束，尤其是强监管执法和合规负担。2023 年 10 月，CFPB 因 Sendwave
              违反《电子资金转账法》和《汇款转账规则》发出执法令，原因是其误导性披露转账速度和费用；CFPB 要求公司支付 $1.5M 消费者赔付及 $1.5M 民事罚款。跨境汇款商还面临通道收款费波动和竞争性 take
              rate 压缩造成的利润率约束。为在多品牌整合后保护运营盈利，Zepz 大幅裁员：2023 年 5 月减少 420 个岗位，2025 年初再减少约 200 个，凸显在规模和获客成本之间保持平衡所需的持续运营纪律。
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM010
              - CM014
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 从传统现金代理转向数字通道
            body: >-
              全球跨境汇款市场正从线下零售现金代理网络转向移动优先的数字渠道。Zepz 将 WorldRemit 的 5,000 多条通道网络与 Sendwave
              的零费移动应用模式结合，承接高频家庭支持汇款，并利用汇率点差在服务不足的新兴市场通道建立可守住的单位经济。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM005
          - type: callout
            title: 监管合规负担与费率透明度摩擦
            body: >-
              跨境消费者支付在汇出地和收款地都面临严格监管审查。CFPB 对 Sendwave 处以合计 $3M 的消费者赔付和民事罚款，说明 Sendwave
              的“零费用”营销宣称必须严格披露汇率加价和交付时效，并持续投入合规基础设施和法律控制。
            calloutType: risk
            claimRefs:
              - CM006
              - CM010
              - CM014
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              跨境消费汇款生态包含四类竞争者：数字原生跨境网络、传统零售代理网络、本地化新兴通道专业公司，以及非正式或数字现金替代品。Zepz 通过 WorldRemit 和 Sendwave 形成双品牌定位，把 50
              个来源国的数字汇款人与 130 个目的地市场的收款人连接起来。主要直接数字同行是 Wise（LSE: WISE）和 Remitly（NASDAQ: RELY），两者都在 2021
              年上市，并依靠透明的数字应用体验。相比之下，传统巨头 Western Union 和 MoneyGram 拥有庞大实体网点，在新兴市场现金收款通道占主导，但成本和费用摩擦更高。非正式 Hawala
              经纪商及新兴区块链稳定币协议，也持续构成现状替代品和下一代替代品，威胁传统费用池。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP010
      - number: '3.2'
        title: 竞争对手规模、融资与地域画像
        blocks:
          - type: paragraph
            body: >-
              竞争对手的规模和资本化反映出汇款市场中不同的运营策略。上市同行 Wise 和 Remitly 的市值达数十亿美元，每年处理数百亿美元跨境交易，重点发展纯数字银行间和钱包通道。传统巨头 Western Union
              和 MoneyGram 拥有牢固的分销网络；在被 Madison Dearborn Partners 收购前，MoneyGram 曾覆盖 200 个国家的 440,000 个零售网点。TapTap
              Send、TransferGo 和 LemFi 等区域挑战者合计筹集数亿美元风险资本，争夺进入非洲和亚洲的特定侨民通道。2025 年，Zepz 在 1.2 亿笔交易中完成超过 $17B
              转账，现金流已经为正，同时兼顾实体现金收款和数字移动支付。
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP014
      - number: '3.3'
        title: 能力、分销与监管合规状况
        blocks:
          - type: paragraph
            body: >-
              国际汇款服务商的差异主要体现在收款灵活性、交易结算速度和监管合规能力。Wise 擅长账户间透明度和中间市场汇率定价，但在新兴市场的现金取款基础设施有限。WorldRemit
              则支持非洲、亚洲和拉美的现金收款点、银行转账、移动钱包及话费充值，约 85% 的交易可在数分钟内结算。不过，在消费者保护和反洗钱要求下，监管审查是全行业挑战。CFPB 和州监管机构已处罚多家主要参与者：Wise
              于 2025 年因误导性费用披露支付约 $450,000 消费者赔付和民事罚款，MoneyGram 与纽约州总检察长以 $250,000 和解，Sendwave 则于 2023
              年末因不合规《汇款转账规则》被处以合计 $3M 赔付和罚款。
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
              - CP010
      - number: '3.4'
        title: 费用经济、多平台使用与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              数字汇款的长期可防守性取决于定价透明度和汇款人忠诚度。Sendwave 在非洲关键通道免收前置转账费，几乎完全靠汇率加价赚钱，加价通常在中间市场汇率的 0.5% 以内。WorldRemit
              采用适度固定费用加通道专属外汇点差的混合模式。移民工人对价格高度敏感，安装其他手机应用的摩擦又很低，因此用户普遍同时使用多个平台。除收款便利性和品牌信任外，服务商几乎没有传统转换壁垒。为守住日益商品化费用环境下的运营利润率，Zepz
              于 2023 年和 2025 年连续重组员工队伍，并通过 Fireblocks 和 Solana 部署稳定币结算试点，以降低中间银行成本。
            claimRefs:
              - CP009
              - CP011
              - CP012
              - CP013
