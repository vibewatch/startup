        - 即时到账（Express），或 3-5 个银行工作日（Economy）
        - 按次付费的消费者应用账户
        - 用分层到账速度将消费者的紧迫需求变现
      - - Western Union / MoneyGram
        - 前端零售交易费，加上浮动汇率利润价差
        - 现金到现金交易的有效成本为 3.0% - 6.0%+
        - 现金领取需几分钟；银行入账需 1-3 天
        - 到店现金零售客户或注册数字用户
        - 从无银行账户用户身上获取溢价；易受数字化迁移冲击
    notes: 有效成本基于公开披露与评测基准，反映 $200–$500 本金汇款的典型通道价差。
