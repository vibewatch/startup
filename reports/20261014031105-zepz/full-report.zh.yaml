      - number: '1.2'
        title: 高管领导、治理变迁与员工队伍演变
        blocks:
          - type: paragraph
            body: >-
              Zepz 近几个运营周期经历了重要的高管更替和组织重组。目前集团由临时首席执行官 Barrie Morris 领导，负责财务战略和运营执行，与首席产品及技术官 George Goodyer、首席人力官
              Justine Dinter 协作。创始人 Ismail Ahmed 继续担任非执行董事，维系公司治理和利益相关方关系。公司原 CEO Breon Corcoran 于 2022 年年中离任，恰逢计划中的 IPO
              延期，之后又发生 CEO 更替，管理层稳定性因此受损。为配合盈利目标，Zepz 还大幅裁员：2022 年裁减不足 5% 的岗位，2023 年进一步减少 400 多个岗位，约占员工数 26%。截至 2026
              年，公司披露全球员工超过 700 人，低于历史峰值约 1,000 名正式员工。
            claimRefs:
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO010
      - number: '1.3'
        title: 资本化历史、债务再融资与估值不透明
        blocks:
          - type: paragraph
            body: >-
              Zepz 的资本结构先获得大量风险资本支持，随后经历资产负债表重组，后期估值也变得不透明。2021 年 8 月，公司完成 $292M 的 Series E 增资，投后估值达到峰值 $5.0B。2022
              年，Zepz 原计划在美国上市、目标估值 $6.0B，但因宏观环境波动以及据报道存在的内部会计和管理摩擦而放弃。2024 年面对高成本债务到期，公司完成由长期投资者 Accel 领投的 $267M
              股权融资，LeapFrog Investments、TCV 参与，国际金融公司（IFC）承诺最多 $20M。融资成功为高息定期债务再融资并稳定资产负债表，但 Zepz
              及其银团没有披露新的投后估值，外部投资判断因此缺少关于下轮融资稀释或清算优先权层级的信息。
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO012
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO014
      - number: '1.4'
        title: 战略演变、监管执法与稳定币扩张
        blocks:
          - type: paragraph
            body: >-
              集团的运营历史体现为快速非内生扩张、监管合规审查，以及近期向区块链结算通道延伸。2023 年 10 月，美国消费者金融保护局（CFPB）对 Sendwave 运营方 Chime, Inc.
              发出同意执法令，要求其向消费者赔付 $1.5M，并缴纳 $1.5M 民事罚款，原因是误导性地宣传转账速度和费用，同时违反《汇款转账规则》。面对行业利润率压力和汇率波动，Zepz 于 2025 年末在 Solana
              区块链上推出 Sendwave Wallet。该产品让 100 多个国家的移民客户持有和转移 USDC 数字美元，并接入 TRM Labs
              风险监控以满足反洗钱和制裁要求。此举意在用链上结算补充传统代理行银行通道。
            claimRefs:
              - CO011
              - CO012
              - CO013
