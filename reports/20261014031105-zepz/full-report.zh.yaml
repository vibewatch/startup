  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 可视化展示发送方入金经过收款处理、变现机制和出款成本后，剩余毛利率如何形成。
    data:
      nodes:
        - id: sender-deposit
          label: 发送方本金入金
        - id: payin-processing
          label: 收款处理（借记卡 / 银行）
        - id: zepz-monetization
          label: Zepz 变现（费用与汇差）
        - id: payout-disbursement
          label: 出款网络（MNO / 银行 / 现金代理）
        - id: recipient-funds
          label: 收款人到账资金
        - id: gross-margin-pool
          label: 剩余毛利池
      edges:
        - from: sender-deposit
          to: payin-processing
        - from: payin-processing
          to: zepz-monetization
        - from: zepz-monetization
          to: payout-disbursement
        - from: payout-disbursement
          to: recipient-funds
        - from: zepz-monetization
          to: gross-margin-pool
    approximationNotes: 流程图展示交易的结构性生命周期；具体美元扣除比例因支付方式、出款通道和通道而异。
