        title: 图表
        blocks:
          - type: callout
            title: 双品牌战略定位与协同
            body: >-
              Zepz 保留 WorldRemit 和 Sendwave 各自的市场身份，以覆盖不同消费者群体。WorldRemit 是全渠道汇款引擎，支持成熟及新兴市场的现金取款、银行入账和移动支付；Sendwave
              则是精简低成本应用，面向非洲和亚洲的高流量移动钱包通道。双品牌架构扩大了通道覆盖，但后台基础设施整合仍是提升运营效率的关键。
            calloutType: insight
