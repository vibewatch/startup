  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 双品牌收入架构与变现机制
        blocks:
          - type: paragraph
            body: >
              Zepz 通过混合收费架构在全球通道的消费汇款流中变现，收入由核心品牌 WorldRemit 和 Sendwave 分别贡献。WorldRemit 在 150
              个目的地国家通过银行入账、移动钱包、现金取款代理点和移动话费充值等方式收取明确转账费并叠加外汇点差。相比之下，Sendwave 在 50
              多条通道实行消费者零费模式，主要服务非洲和亚洲移民路线，几乎完全依靠外汇点差变现，点差通常维持在当时中间市场汇率的 0.5%
              以内。两个平台都接受借记卡、银行转账和本地支付工具供资，再把汇款人的出款存款转换为本地货币并支付。

              但 Zepz 是一家私营公司，2021 年收购 Sendwave 并完成 Series E 融资后又进行品牌重塑，因此集团没有公开披露经审计的合并收入 run rate、通道 take rate，或
              WorldRemit 与 Sendwave 的收入拆分。整体可服务汇款市场规模很大：世界银行估计 2023 年流向中低收入国家的全球汇款为 $656B；但若无法取得管理层财务账目，公开尽调无法核实 Zepz
              的实际交易量、总收入或净 take rate。
