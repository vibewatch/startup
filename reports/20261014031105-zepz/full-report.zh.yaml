      - number: '4.2'
        title: 单位经济驱动因素、交付成本与结算通道效率
        blocks:
          - type: paragraph
            body: >
              数字跨境汇款的单位经济由四层主要变动成本决定：支付工具入款处理费（借记卡交换费和银行转账清算费）、外汇流动性及对冲成本、结算和收款付款费（移动网络运营商钱包费、本地银行通道费、现金取款代理网络费），以及获客和身份验证开支。代理行通道长期带来摩擦、多日结算延迟和不固定的中间商费用。为降低非洲、亚洲和拉美主要目的地的外汇结算摩擦及中间商费用，Zepz
              与 Fireblocks 合作接入企业级数字资产钱包基础设施，并自动化稳定币资金管理。

              但关键的单笔交易指标——包括平均交易金额、净 take rate、毛利率、获客成本（CAC）和客户终身价值（LTV）——都属于严格保密的私有数据。第三方跟踪资料称，Zepz 于 2020 年在 5,000
              万笔交易中处理约 $10B 转账，意味着平均每笔约 $200；但公司没有公布 2022 年之后的当期单位经济指标。尽调投资判断需要颗粒度更高的 cohort
              数据，以确定扣除收款伙伴费用和拒付欺诈损失后，高流量通道的贡献利润率是否在扩大。
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI013
