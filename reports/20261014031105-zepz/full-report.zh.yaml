      - number: '4.3'
        title: 资本充足性、融资依赖与监管合规负担
        blocks:
          - type: paragraph
            body: >
              Zepz 具备较强的股权和债务融资能力：2021 年以 $5B 估值完成 $292M Series E 股权融资，2024 年由 Accel 领投、LeapFrog、TCV、Coller Capital
              和国际金融公司（IFC）参与，获得 $267M 增资，并于 2025 年 3 月完成 $165M 债务融资。资本重组后，公司于 2023 年初裁减约 26% 员工（约 420 人），同年晚些时候又裁减 30
              人；管理层称公司在 2022 年实现完全盈利，并因市场波动暂停 IPO 计划。

              尽管公司声称运营盈利，且近期资产负债表获得流动性注入，但关键运营辖区不断增加的监管和合规负担使未来资本充足性更复杂。2023 年 10 月，CFPB 对 Sendwave（Chime,
              Inc.）发出正式同意令，因其误导性披露转账速度和成本并违反《汇款转账规则》（Regulation E），处以 $1.5M 民事罚款并要求约 $1.5M 消费者赔付。纽约州总检察长于 2025 年与
              MoneyGram 达成 $250,000 和解，CFPB 也对 Wise US Inc. 执法；这些同行监管行动说明，合规、错误调查和费用披露会持续产生重大法律及运营费用，压缩净利润。
