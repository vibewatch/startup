              2022 年 IPO 延期后，Zepz 通过 2024 年 $267M 股权融资为债务再融资，成功稳定资产负债表，但没有披露最新估值。结合高管更替以及 2023 年 CFPB
              针对披露行为的历史同意令，私募尽调需重点审查清算优先权、股权结构表和合规整改成本。
