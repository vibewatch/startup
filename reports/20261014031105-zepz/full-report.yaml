figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronology of key founding, financing, restructuring, regulatory, and product milestones defining Zepz's
      evolution.
    data:
      items:
        - label: '2010'
          title: WorldRemit Founded
          detail: Ismail Ahmed founds WorldRemit in London to bring cross-border remittance transfers online.
          tone: positive
        - label: '2014'
          title: Sendwave Launch
          detail: Sendwave launches a mobile-first app delivering low-cost remittance transfers to East Africa.
          tone: neutral
        - label: '2021'
          title: Sendwave Acquisition and Zepz Creation
          detail: WorldRemit acquires Sendwave and unifies under Zepz, raising $292M Series E at a $5.0B valuation.
          tone: positive
        - label: '2022'
          title: IPO Postponement & Restructuring
          detail: Zepz shelves $6.0B US IPO plans amid market downturn; CEO Breon Corcoran departs; workforce trimmed.
          tone: critical
        - label: '2023'
          title: CFPB Enforcement Action
          detail: US CFPB issues consent order against Sendwave for deceptive fees, mandating $3.0M in redress and fines.
          tone: critical
        - label: '2024'
          title: $267M Equity Financing & Debt Refinancing
          detail: Accel, LeapFrog, TCV, and IFC inject $267M to retire expensive debt; post-money valuation undisclosed.
          tone: positive
        - label: '2025'
          title: Sendwave Solana Wallet Launch
          detail: Zepz launches Sendwave digital dollar wallet on Solana, integrating TRM Labs for AML compliance.
          tone: positive
        - label: '2026'
          title: Interim Leadership & Profitability Focus
          detail: Interim CEO Barrie Morris leads unified operations serving 9M+ users across 130+ markets.
          tone: neutral
    approximationNotes: null
