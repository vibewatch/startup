chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Brands, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Zepz is a London-headquartered global fintech group specializing in digital cross-border consumer
              remittances. The corporate group was formally established in 2021 through the strategic combination of
              WorldRemit, founded in 2010 by Somaliland migrant Ismail Ahmed, and Sendwave, an app-based remittance
              specialist founded in 2014. The group operates a multi-brand model designed to address distinct migrant
              corridors and user behaviors: WorldRemit provides multi-rail cross-border transfers into bank accounts,
              mobile wallets, cash pickup agent locations, and airtime top-ups, while Sendwave focuses on a low-cost,
              mobile-first experience primarily targeted at African and Asian mobile wallet corridors. Together, the
              group serves over 9 million customers across 50 sending markets and more than 130 receiving countries and
              territories, spanning over 5,000 corridors globally. In fiscal year 2025, Zepz processed more than $17
              billion in total remittance volume across more than 50 million individual customer transactions,
              demonstrating substantial operational scale in the global payments ecosystem.
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO007
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.2'
        title: Executive Leadership, Governance Transitions, and Workforce Evolution
        blocks:
          - type: paragraph
            body: >-
              Zepz has navigated significant executive leadership transitions and organizational restructuring over
              recent operating cycles. The group is currently led by Interim Chief Executive Officer Barrie Morris, who
              guides financial strategy and operational execution, working alongside Chief Product and Technology
              Officer George Goodyer and Chief People Officer Justine Dinter. Founder Ismail Ahmed continues to serve as
              Non-Executive Director, anchoring the firm's governance and stakeholder relationships. Executive stability
              has faced headwinds following the departure of former CEO Breon Corcoran in mid-2022 amidst the
              postponement of the company's planned initial public offering, followed by subsequent CEO turnover.
              Alongside leadership churn, Zepz enacted substantial workforce reductions to align costs with
              profitability goals: the group implemented a redundancy round affecting less than 5% of roles in 2022,
              followed by a deeper workforce cut in 2023 eliminating more than 400 positions, or roughly 26% of staff.
              As of 2026, Zepz reports employing over 700 staff globally, down from a historical peak of approximately
              1,000 permanent personnel.
            claimRefs:
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO010
      - number: '1.3'
        title: Capitalization History, Debt Refinancing, and Valuation Opacity
        blocks:
          - type: paragraph
            body: >-
              Zepz's capitalization structure reflects significant venture capital backing followed by balance sheet
              restructuring and late-stage valuation opacity. In August 2021, the company closed a $292 million Series E
              primary funding round that established a peak post-money valuation of $5.0 billion. In 2022, Zepz planned
              to launch a public listing in the United States targeting a $6.0 billion valuation, but abandoned the
              transaction due to volatile macroeconomic conditions and reported internal accounting and management
              friction. In 2024, facing expensive debt maturities, Zepz completed a $267 million equity financing round
              led by longstanding backer Accel, with participation from LeapFrog Investments, TCV, and a commitment of
              up to $20 million from the International Finance Corporation (IFC). While this financing successfully
              refinanced high-interest term debt and stabilized the balance sheet, Zepz and its syndicate did not
              disclose an updated post-money valuation, creating an information gap for external underwriters regarding
              down-round dilution or liquidation preference seniority.
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO012
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO014
      - number: '1.4'
        title: Strategic Evolution, Regulatory Enforcement, and Stablecoin Expansion
        blocks:
          - type: paragraph
            body: >-
              The group's operational history is marked by rapid inorganic scaling, regulatory compliance scrutiny, and
              recent expansion into blockchain-based settlement rails. A material adverse milestone occurred in October
              2023 when the US Consumer Financial Protection Bureau (CFPB) issued an enforcement consent order against
              Sendwave operator Chime, Inc., mandating $1.5 million in consumer redress and a $1.5 million civil money
              penalty for deceptive transfer speed and fee representations, alongside Remittance Transfer Rule
              compliance violations. In response to industry margin pressures and foreign exchange volatility, Zepz
              initiated a major technology initiative in late 2025 by launching the Sendwave Wallet on the Solana
              blockchain. Designed to allow migrant customers in over 100 countries to hold and move USDC digital
              dollars, the product integrates risk monitoring from TRM Labs to meet anti-money laundering and sanctions
              requirements. This deployment represents a strategic effort to supplement traditional correspondent
              banking rails with on-chain settlement capabilities.
            claimRefs:
              - CO011
              - CO012
              - CO013
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO010
              - CO011
              - CO012
              - CO013
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual-Brand Strategic Positioning and Synergies
            body: >-
              Zepz preserves distinct go-to-market identities for WorldRemit and Sendwave to address divergent consumer
              segments. WorldRemit acts as an omnichannel remittance engine supporting cash pickup, bank deposit, and
              mobile money rails across mature and emerging markets. Sendwave operates as a lean, low-cost app tailored
              for high-volume mobile wallet corridors in Africa and Asia. While this dual architecture maximizes
              corridor coverage, integrating back-office infrastructure remains a key driver of operational efficiency.
            calloutType: insight
            claimRefs:
              - CO001
              - CO007
              - CO012
          - type: callout
            title: Valuation Benchmark Opacity and Regulatory Overhead
            body: >-
              Following its postponed 2022 IPO, Zepz successfully stabilized its balance sheet by refinancing debt
              through a $267 million equity round in 2024, but chose not to disclose an updated valuation. Coupled with
              executive turnover and the legacy 2023 CFPB consent order regarding disclosure practices, private
              diligence requires scrutiny of liquidation preferences, cap table structure, and compliance remediation
              costs.
            calloutType: risk
            claimRefs:
              - CO003
              - CO004
              - CO010
              - CO013
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Sizing, and Substitution Dynamics
        blocks:
          - type: paragraph
            body: >-
              The core addressable market for Zepz centers strictly on cross-border consumer-to-consumer (P2P)
              remittances, characterized by frequent, small-ticket transfers typically ranging between $200 and $500
              sent by international migrant workers to support families in developing countries. This perimeter
              deliberately excludes wholesale institutional treasury, corporate commercial trade settlement, and
              speculative cryptocurrency trading, focusing entirely on essential diaspora household cash flows.
              Historically, the remittance industry was dominated by brick-and-mortar money transfer operators relying
              on extensive physical retail agent networks and sluggish correspondent banking systems that imposed high
              transaction costs and multi-day settlement delays. Digital-first providers like Zepz, operating through
              its WorldRemit and Sendwave brands, substitute cash-in retail agent counters with frictionless mobile and
              web interfaces. By eliminating traditional physical storefront overhead and deploying algorithmic foreign
              exchange routing, digital platforms dramatically compress end-to-end transfer latency to minutes while
              offering transparent fee structures.
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM004
              - CM005
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM009
      - number: '2.2'
        title: Addressable Sizing Lenses and Platform Scale
        blocks:
          - type: paragraph
            body: >-
              Evaluating the market opportunity for Zepz requires distinct analytical sizing lenses rather than a single
              generalized total addressable market figure. Globally, cross-border remittances represent an $895 billion
              market by 2025 as international migrant corridors expand across Latin America, Africa, and Asia. Within
              this broader macroeconomic envelope, the digital service addressable market (SAM) accounts for an
              estimated $150 billion to $200 billion in fully digital send-side transfers, reflecting rapid smartphone
              adoption and digital banking penetration among diaspora populations. Zepz’s serviceable market is further
              governed by its regulatory licenses across 50 send countries and local payout partnerships spanning over
              5,000 corridors, representing approximately $40 billion to $50 billion in directly accessible corridor
              flows. In 2025, Zepz captured over $17 billion in completed customer transfers, demonstrating meaningful
              volume scale and expanding beyond its $15 billion volume base recorded in 2022. Supported by institutional
              growth backing from Accel and the International Finance Corporation, the group continues to deepen its
              market capture across high-volume corridors connecting OECD nations to emerging markets.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.3'
        title: Buyer Segmentation, Personas, and Adoption Workflows
        blocks:
          - type: paragraph
            body: >-
              The customer base across Zepz’s core remittance corridors comprises distinct sender and recipient profiles
              governed by non-discretionary family obligations and routine remittance cycles. The primary sender
              demographic consists of blue-collar migrant workers and first-generation diaspora professionals residing
              in North America, Western Europe, and the Middle East who remit a fixed portion of monthly earnings back
              to dependents in Africa, Asia, and Latin America. In these remittance workflows, the sender acts as the
              budget owner and economic payer, while the recipient acts as the household beneficiary utilizing funds for
              essential living expenditures, educational tuition, and healthcare costs. Sendwave specifically captures
              mobile-first diaspora communities by providing a streamlined, zero-fee transfer model that monetizes via
              narrow exchange rate margins, typically between 1% and 3%, removing upfront transactional barriers. On the
              receiving end, payout options increasingly bypass bank accounts in favor of local mobile money operators
              such as M-Pesa and MTN Mobile Money, as well as integrated digital wallets, establishing an end-to-end
              digital lifecycle that locks in sender loyalty.
            claimRefs:
              - CM004
              - CM005
              - CM009
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM009
              - CM011
      - number: '2.4'
        title: Growth Drivers, Regulatory Hurdles, and Operational Constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption growth across Zepz’s target markets is propelled by the secular shift toward digital wallet
              ecosystems and emerging blockchain infrastructure, including stablecoin settlement partnerships with TRM
              Labs and Fireblocks designed to bypass costly correspondent banking rails. However, this growth trajectory
              faces critical structural constraints, most notably intense regulatory enforcement and compliance
              overhead. In October 2023, the Consumer Financial Protection Bureau issued an enforcement order against
              Sendwave for violations of the Electronic Fund Transfer Act and the Remittance Transfer Rule, requiring
              $1.5 million in consumer restitution alongside a $1.5 million civil money penalty due to deceptive speed
              and fee disclosures. Furthermore, cross-border remittance providers operate under tight margin constraints
              driven by corridor payout fee volatility and competitive take-rate compression. To protect operating
              profitability following its multi-brand consolidation, Zepz executed significant workforce reductions,
              cutting 420 jobs in May 2023 and approximately 200 roles in early 2025, highlighting the continuous
              operational discipline required to balance scale against customer acquisition costs.
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM010
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Shift from Legacy Cash Agents to Digital Corridors
            body: >-
              The global cross-border remittance market is undergoing a structural transition from offline retail cash
              agent networks toward mobile-first digital channels. By combining WorldRemit's extensive 5,000-corridor
              network with Sendwave's fee-free mobile app model, Zepz captures high-frequency family support transfers
              while leveraging exchange rate spreads to build defensible unit economics in underserved emerging market
              corridors.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM005
          - type: callout
            title: Regulatory Compliance Overhead and Fee Transparency Friction
            body: >-
              Cross-border consumer payments face severe regulatory scrutiny across send and payout jurisdictions.
              Sendwave's $3 million combined redress and civil penalty from the CFPB underscores that fee-free marketing
              claims require strict adherence to statutory disclosures regarding exchange rate markups and delivery
              timing, requiring substantial ongoing investment in compliance infrastructure and legal controls.
            calloutType: risk
            claimRefs:
              - CM006
              - CM010
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Alternative Substitution
        blocks:
          - type: paragraph
            body: >-
              The cross-border consumer remittance ecosystem encompasses four distinct competitor categories:
              digital-native cross-border networks, traditional retail agent networks, localized emerging corridor
              specialists, and informal or digital cash substitutes. Zepz occupies a dual-brand positioning in this
              landscape through WorldRemit and Sendwave, bridging digital senders across 50 origin countries with
              recipients in 130 destination markets. Its primary direct digital peers are Wise (LSE: WISE) and Remitly
              (NASDAQ: RELY), both of which completed public listings in 2021 and leverage transparent digital app
              experiences. In contrast, legacy incumbents Western Union and MoneyGram maintain vast physical branch
              networks that dominate cash payout corridors in emerging markets but suffer from higher overhead and fee
              friction. Additionally, informal Hawala brokers and emerging blockchain stablecoin protocols present
              persistent status-quo and next-generation substitutes that threaten traditional fee pools.
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP010
      - number: '3.2'
        title: Competitor Scale, Funding, and Geographic Profiles
        blocks:
          - type: paragraph
            body: >-
              Competitor scale and capitalization reflect divergent operating strategies across the remittance
              landscape. Publicly traded peers Wise and Remitly command multi-billion-dollar market valuations and
              process tens of billions in annual cross-border volume, prioritizing digital-only bank-to-bank and wallet
              corridors. Incumbent giants Western Union and MoneyGram possess entrenched distribution, with MoneyGram
              supporting 440,000 retail locations across 200 countries prior to its buyout by Madison Dearborn Partners.
              Regional challengers such as TapTap Send, TransferGo, and LemFi have collectively raised hundreds of
              millions in venture capital to capture specific diaspora corridors into Africa and Asia. Zepz achieved
              over $17 billion in transferred volume across 120 million transactions in 2025, operating profitably at
              the cash-flow level while balancing physical cash collection with digital mobile money.
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP014
      - number: '3.3'
        title: Capability, Distribution, and Regulatory Compliance Posture
        blocks:
          - type: paragraph
            body: >-
              Differentiation across international remittance providers centers on payout flexibility, transaction
              settlement speed, and regulatory compliance robustness. While Wise excels in account-to-account
              transparency and mid-market exchange rate pricing, it offers limited cash pickup infrastructure in
              emerging markets. WorldRemit differentiates by supporting cash collection points, bank transfers, mobile
              wallets, and airtime top-ups across Africa, Asia, and Latin America, settling approximately 85% of
              transactions within minutes. However, regulatory scrutiny represents an industry-wide challenge under
              consumer protection and anti-money laundering mandates. The Consumer Financial Protection Bureau and state
              regulators have sanctioned major players across the board: Wise paid roughly $450,000 in consumer redress
              and civil penalties for deceptive fee disclosures in 2025, MoneyGram settled for $250,000 with the New
              York Attorney General, and Sendwave was penalized $3 million in combined redress and penalties in late
              2023 for Remittance Transfer Rule non-compliance.
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
              - CP010
      - number: '3.4'
        title: Fee Economics, Multi-Homing Dynamics, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Pricing transparency and sender loyalty govern long-term defensibility in digital remittances. Sendwave
              utilizes a zero upfront transfer fee structure on key African corridors, extracting margin almost entirely
              through an exchange rate markup typically within 0.5% of the mid-market rate. WorldRemit employs a hybrid
              model of modest flat fees paired with corridor-specific FX margins. Because migrant workers are highly
              price-sensitive and face minimal friction when installing alternative smartphone applications,
              multi-homing is prevalent across platforms. Providers hold limited traditional switching moats beyond
              recipient payout convenience and brand trust. To defend operating margins in an increasingly commoditized
              fee environment, Zepz enacted consecutive workforce restructurings in 2023 and 2025, while deploying
              stablecoin settlement pilots through Fireblocks and Solana to lower intermediary banking costs.
            claimRefs:
              - CP009
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP011
              - CP012
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commoditization Pressure from Zero-Fee Mobile Competitors
            body: >-
              Consumer remittances lack structural software lock-in, with users actively multi-homing to capture
              promotional FX rates. Venture-backed challengers like TapTap Send and Sendwave offer zero transfer fees on
              key African and Asian corridors, forcing WorldRemit to defend take-rates primarily through FX spreads
              while absorbing rising compliance and operational overhead.
            calloutType: risk
            claimRefs:
              - CP011
              - CP012
          - type: callout
            title: Stablecoin Infrastructure as a Defense Against Correspondent Banking Costs
            body: >-
              Zepz’s strategic partnership with Fireblocks and Solana to deploy USDC remittance channels represents a
              critical long-term hedge. By shifting settlement from multi-day correspondent banking chains to real-time
              blockchain rails, Zepz aims to reduce intermediary FX spreads and protect unit economics against
              lower-cost digital rivals.
            calloutType: insight
            claimRefs:
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Dual-Brand Revenue Architecture and Monetization Mechanics
        blocks:
          - type: paragraph
            body: >
              Zepz monetizes consumer remittance flows across global corridors through a hybrid fee architecture divided
              between its core operating brands, WorldRemit and Sendwave. WorldRemit combines explicit customer transfer
              fees with an FX spread markup across multiple payout methods including bank account deposits, mobile money
              wallets, cash pickup agent locations, and mobile airtime top-ups across 150 destination countries. In
              contrast, Sendwave operates a fee-free consumer model across more than 50 corridors primarily serving
              African and Asian migrant routes, monetizing almost entirely via foreign exchange spreads typically
              maintained within 0.5% of the prevailing mid-market exchange rate. Both platforms rely on consumer funding
              via debit cards, bank transfers, and local payment instruments, converting outbound sender deposits into
              local currency payouts.


              However, because Zepz is a private entity operating post-rebranding following its 2021 Sendwave
              acquisition and Series E round, the group does not publicly disclose its audited consolidated revenue run
              rate, corridor take rates, or revenue split between WorldRemit and Sendwave. The overall addressable
              remittance market represents substantial macro volume—with global remittance flows to low- and
              middle-income countries estimated by the World Bank at $656 billion in 2023—yet public diligence cannot
              verify realized transaction volume, gross revenue, or net take rates for Zepz without access to management
              financial accounts.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI007
              - CI008
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
              - CI004
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI007
      - number: '4.2'
        title: Unit Economics Drivers, Delivery Costs, and Settlement Rail Efficiency
        blocks:
          - type: paragraph
            body: >
              The unit economics of digital cross-border remittances are dictated by four primary variable cost layers:
              payment instrument pay-in processing fees (debit card interchange and bank transfer clearing), foreign
              exchange liquidity and hedging costs, settlement and payout disbursement fees (mobile network operator
              wallet fees, local banking rail fees, and cash pickup correspondent network fees), and customer
              acquisition and verification expenses. Correspondent banking rails have historically added friction,
              multi-day settlement delays, and variable intermediary charges across developing corridors. To lower
              foreign exchange settlement friction and intermediary fees across key African, Asian, and Latin American
              destinations, Zepz partnered with Fireblocks to integrate enterprise digital asset wallet infrastructure
              and automate stablecoin treasury operations.


              Nevertheless, critical per-transaction unit metrics—including average transaction value, net take rate,
              gross margin percentage, customer acquisition cost (CAC), and customer lifetime value (LTV)—are strictly
              guarded private figures. While third-party tracking notes that Zepz handled roughly $10 billion in
              transferred volume across 50 million transactions in 2020 (implying an average transfer size of
              approximately $200), contemporary post-2022 unit economics metrics have not been published by the company.
              Diligence underwriting requires granular cohort data to determine whether contribution margins after
              payout partner fees and chargeback fraud losses are expanding across high-volume corridors.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI007
              - CI008
              - CI011
              - CI013
      - number: '4.3'
        title: Capital Adequacy, Financing Dependency, and Regulatory Compliance Overheads
        blocks:
          - type: paragraph
            body: >
              Zepz has demonstrated substantial access to both equity and debt capital, raising $292 million in Series E
              equity financing in 2021 at a $5 billion valuation, securing $267 million in primary funding in 2024 led
              by Accel with participation from LeapFrog, TCV, Coller Capital, and the International Finance Corporation
              (IFC), and closing a $165 million debt facility in March 2025. Following capital restructuring and a
              workforce reduction of approximately 26% (around 420 employees) in early 2023 alongside an additional 30
              cuts later that year, executive management reported that the company attained full profitability in 2022
              and paused public IPO timelines amidst volatile market conditions.


              Despite claimed operational profitability and recent balance sheet liquidity infusions, forward capital
              adequacy is complicated by increasing regulatory and compliance overheads across key operating
              jurisdictions. In October 2023, the Consumer Financial Protection Bureau (CFPB) issued a formal consent
              order against Sendwave (Chime, Inc.), penalizing the entity $1.5 million in civil money penalties and
              ordering approximately $1.5 million in customer redress for deceptive marketing disclosures regarding
              transfer speed and cost, as well as Remittance Transfer Rule (Regulation E) violations. Peer regulatory
              actions—such as the New York Attorney General's $250,000 settlement with MoneyGram in 2025 and CFPB
              enforcement against Wise US Inc.—underscore that compliance, error investigation, and fee disclosure
              represent material ongoing legal and operational expense items that constrain net profitability.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual-Brand Monetization Bifurcation
            body: >-
              Zepz captures distinct consumer segments by maintaining WorldRemit as a multi-rail, fee-plus-spread
              utility across 150 countries while scaling Sendwave as a zero-fee, mobile-native FX spread channel across
              50+ high-velocity African and Asian corridors.
            calloutType: insight
            claimRefs:
              - CI001
              - CI003
              - CI004
          - type: callout
            title: Regulatory Disclosure and Compliance Overhead
            body: >-
              The CFPB's $3 million enforcement action against Sendwave for deceptive speed and fee representations,
              coupled with parallel actions against peers MoneyGram and Wise, highlights substantial regulatory exposure
              and compliance expense in cross-border retail remittances.
            calloutType: risk
            claimRefs:
              - CI011
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Offering and Multi-Brand Portfolio
        blocks:
          - type: paragraph
            body: >-
              Zepz addresses global cross-border remittances through a differentiated multi-brand strategy anchored by
              WorldRemit and Sendwave. WorldRemit provides an omni-channel remittance experience supporting migrant
              workers sending money from approximately 50 source countries to recipients in over 130 destination
              countries across Africa, Asia, Europe, and the Americas. Sendwave operates as an agile, mobile-only
              application optimized specifically for key African and Asian diaspora routes, offering fee-free transfers
              funded by narrow foreign exchange spreads. To expand beyond transactional money transfers, Zepz deployed
              proceeds from its $267 million Series F round in late 2024 toward developing Zepz Wallet, establishing a
              stored-value ecosystem to reduce off-ramp friction. Furthermore, Zepz expanded into migrant financial
              services in January 2026 through the acquisition of Pomelo, integrating consumer credit lines and card
              products with international remittance rails to eliminate upfront cash funding constraints.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE010
      - number: '5.2'
        title: Customer Workflows and Remittance Payout Channels
        blocks:
          - type: paragraph
            body: >-
              The customer journey across Zepz's platforms is designed to replace friction-heavy brick-and-mortar money
              transfer agents with instant digital execution. Senders initiate transactions via native mobile
              applications on iOS and Android, funding transfers using debit cards, credit cards, or regional
              account-to-account rails including Apple Pay, Poli, Interac, iDEAL, Klarna Sofort, and Trustly. WorldRemit
              provides four distinct payout modalities tailored to receiver infrastructure in recipient countries:
              direct bank deposits, mobile wallet credits, cash pickup at more than 25,000 physical partner locations,
              and instant mobile airtime top-ups. Sendwave focuses directly on mobile money integration, depositing
              funds within minutes into widely adopted regional telco wallets such as M-Pesa in Kenya, MTN in Ghana and
              Uganda, and GCash in the Philippines. This diverse disbursement mesh provides high corridor flexibility,
              enabling receivers in unbanked or cash-dependent emerging markets to access liquidity immediately.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE010
      - number: '5.3'
        title: Core Platform Architecture and Multi-Rail Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Zepz's technical architecture functions as a distributed, high-throughput payment orchestrator spanning
              consumer client layers, transaction processing microservices, treasury routing engines, and local payout
              settlement gateways. Following the integration of Sendwave with WorldRemit, the group embarked on a
              substantial core backend replatforming initiative aimed at automating payment processing, treasury
              liquidity management, and foreign exchange pricing across its 5,000+ corridor network. To address the
              persistent cost and settlement latency of traditional correspondent banking relationships, Zepz partnered
              with enterprise digital asset custodian Fireblocks, supported by a grant from the Solana Foundation. This
              integration embeds Fireblocks' secure wallet infrastructure and treasury automation directly into Zepz's
              settlement layer, enabling programmable, near-instant stablecoin clearing across priority emerging market
              corridors while maintaining institutional cryptographic custody controls.
            claimRefs:
              - CE001
              - CE003
              - CE007
              - CE008
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE007
              - CE008
              - CE009
              - CE010
      - number: '5.4'
        title: Engineering Replatforming, Automation, and Operational Restructuring
        blocks:
          - type: paragraph
            body: >-
              Between 2023 and 2025, Zepz executed significant operational restructurings to eliminate technical
              redundancy and lower operating expenditures across its merged platforms. In May 2023, the group reduced
              headcount by 420 employees, representing 26% of its global workforce, specifically targeting customer care
              and engineering functions to shift operations from fragmented regional offices into centralized hubs. In
              February 2025, Zepz completed a third round of workforce reductions, eliminating 200 roles (20% of
              remaining staff) and closing operational hubs in Kenya and Poland. Management attributed these reductions
              to the successful rollout of advanced automation, artificial intelligence tooling, and core replatforming
              initiatives. However, external market observers note that continuous headcount reductions reflect severe
              competitive pressure from lower-cost peers like Wise and Revolut, alongside the operational complexity of
              consolidating disparate legacy codebases into a single unified architecture.
            claimRefs:
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE003
              - CE007
              - CE008
              - CE009
              - CE011
              - CE012
      - number: '5.5'
        title: Trust, Security, Compliance, and Regulatory Risk Controls
        blocks:
          - type: paragraph
            body: >-
              Cross-border remittance operations require rigorous adherence to international financial regulations,
              anti-money laundering (AML) mandates, and statutory consumer protection standards. In the United States,
              Sendwave operates under the supervision of the Consumer Financial Protection Bureau (CFPB) and state
              regulators. In October 2023, the CFPB issued an enforcement consent order against Chime, Inc. (doing
              business as Sendwave), mandating $1.5 million in consumer redress and a $1.5 million civil money penalty
              for violations of the Consumer Financial Protection Act and the Remittance Transfer Rule under Regulation
              E. The Bureau established that Sendwave misrepresented transfer speeds and costs, failed to provide timely
              fund availability disclosures, and maintained inadequate error investigation procedures. This enforcement
              underscores the critical need for robust automated compliance telemetry across the remittance industry, a
              challenge also reflected in CFPB and state regulatory penalties against competitors Wise and MoneyGram.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Multi-Rail Payout Scale Across Developing Markets
            body: >-
              Zepz's primary technical moat lies in its comprehensive integration mesh spanning 25,000 cash pickup
              points, major banking institutions, and leading mobile money networks across 130+ receiving nations.
            calloutType: strength
            claimRefs:
              - CE001
              - CE003
              - CE010
          - type: callout
            title: Regulatory Enforcement and Error Resolution Architecture
            body: >-
              The 2023 CFPB consent order against Sendwave demonstrates that digital-first remittance automation faces
              severe regulatory penalties when transfer speed marketing, fee disclosures, or error investigation
              processes fail statutory compliance.
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Demographics
        blocks:
          - type: paragraph
            body: >-
              Zepz operates a bi-sided customer model fundamentally anchored in cross-border migrant remittance
              corridors. Senders predominantly comprise first- and second-generation expatriate workers and diaspora
              professionals residing in established Western economies, notably the United States, United Kingdom, and
              the European Union. These individuals routinely remit funds to support family livelihoods, education
              expenses, and emergency financial needs in emerging markets across Africa, Asia, and Latin America. On the
              receiving side, customer preferences diverge markedly between banked recipients who accept direct account
              deposits and unbanked populations who rely on mobile money ecosystems such as Safaricom M-Pesa or cash
              pickup agents. By operating dual consumer platforms through WorldRemit and Sendwave, Zepz captures both
              multi-channel remittances and mobile-first, app-based corridor transfers, though average transaction size
              and corridor concentration remain undisclosed in public filings.
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
      - number: '6.2'
        title: Adoption Trajectory and Geographic Footprint
        blocks:
          - type: paragraph
            body: >-
              The aggregate adoption trajectory of Zepz reflects extensive global scale, with company disclosures
              claiming over 9 million active customers operating across more than 5,000 corridors in 130 countries.
              Following the strategic consolidation of Sendwave and operational restructuring in 2023, management
              reported that customer transaction volumes expanded by 25% year-to-date, alongside customer acquisition
              acceleration averaging 30% and peaking at 80% in high-velocity regional corridors. From a pricing
              perspective, digital money transfer operators possess substantial cost advantages over traditional
              correspondent banking channels. World Bank benchmarking reveals that digital-only MTOs charged an average
              of 3.97% in early 2024, compared to commercial bank fees averaging 12.66%, enabling Zepz to sustain
              customer acquisition momentum despite macroeconomic volatility and inflationary headwinds.
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU005
              - CU006
      - number: '6.3'
        title: Commercial Deployment and Named Payout Partner Network
        blocks:
          - type: paragraph
            body: >-
              Unlike business-to-business enterprise software providers, customer proof in consumer remittances is
              evidenced through bilateral commercial integrations with institutional payout partners, national clearing
              houses, and mobile network operators. WorldRemit maintains verified production deployments with tier-one
              commercial banks and dominant mobile wallet providers across its primary destination markets. In Kenya,
              recipients receive disbursements via Safaricom M-Pesa, Equity Bank, and Co-operative Bank of Kenya. In the
              Philippines, the network terminates transactions into BDO Unibank, Metrobank, and leading digital wallets
              including GCash and PayMaya. Concurrently, Sendwave provides zero-fee consumer corridors across more than
              50 nations in Africa and Asia, though fee-free marketing claims are offset by embedded foreign exchange
              spreads typically within 0.5% of prevailing mid-market exchange rates.
            claimRefs:
              - CU007
              - CU008
              - CU004
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU008
              - CU004
      - number: '6.4'
        title: Customer Journey and Repeat Transaction Dynamics
        blocks:
          - type: paragraph
            body: >-
              The end-to-end customer journey begins with mobile onboarding, where senders register through iOS or
              Android applications and undergo digital identity verification before initiating a transfer. Senders fund
              payments via debit cards or linked bank accounts, selecting payout destinations based on upfront delivery
              estimates and foreign exchange quotes. To strengthen customer retention and expand wallet share, Zepz has
              initiated partnerships with infrastructure providers including Fireblocks to integrate stablecoin
              settlement rails, supported by a Solana Foundation grant. Management also announced plans to launch
              proprietary digital wallet products, seeking to evolve from a transactional remittance utility into a
              primary financial repository for migrant households. However, customer expansion into ancillary financial
              products faces intense competition from established global digital wallets like PayPal and localized
              fintech ecosystems.
            claimRefs:
              - CU002
              - CU009
              - CU010
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU009
              - CU010
              - CU011
      - number: '6.5'
        title: Consumer Protection, Regulatory Scrutiny, and Retention Risks
        blocks:
          - type: paragraph
            body: >-
              Consumer durability and trust in cross-border remittances are heavily vulnerable to disclosure
              transparency, speed accuracy, and regulatory compliance. In October 2023, the Consumer Financial
              Protection Bureau issued a major consent order against Sendwave, requiring 1.5 million dollars in consumer
              redress and a 1.5 million dollar civil penalty after finding that the service misrepresented transfer
              speeds and costs, forced customers to improperly waive statutory rights, and failed to conduct compliant
              error investigations. Similar regulatory scrutiny has challenged competitors including Wise and MoneyGram,
              demonstrating widespread enforcement pressure across the remittance sector under the Electronic Fund
              Transfer Act and Regulation E. Given that price sensitivity and transfer reliability dictate sender
              loyalty, recurring compliance violations and operational payout delays represent acute risks to customer
              retention and lifetime value.
            claimRefs:
              - CU012
              - CU014
              - CU004
              - CU013
      - number: '6.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Multi-Corridor Distribution Footprint Across Emerging Markets
            body: >-
              Zepz maintains a structural distribution moat through direct payout integrations with dominant telecom
              mobile wallets such as Safaricom M-Pesa in Kenya and GCash in the Philippines, enabling near-instant
              cross-border liquidity for over 9 million customers across 5,000 corridors.
            calloutType: strength
            claimRefs:
              - CU001
              - CU007
              - CU008
          - type: callout
            title: Regulatory Enforcement and Disclosure Scrutiny on Remittance Fees
            body: >-
              The CFPB enforcement order requiring 3 million dollars in consumer redress and penalties against Sendwave
              demonstrates substantial regulatory risk surrounding deceptive zero-fee marketing claims and delivery
              timing disclosures, presenting customer attrition and compliance overhead.
            calloutType: risk
            claimRefs:
              - CU012
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Enforcement and Compliance Risk
        blocks:
          - type: paragraph
            body: >-
              Cross-border consumer remittance platforms operate under rigorous multi-jurisdictional financial services
              frameworks, exposing operators to material statutory liability when customer disclosures or fund
              transmission commitments fail. In October 2023, the Consumer Financial Protection Bureau issued a formal
              consent order against Chime, Inc. doing business as Sendwave, finding widespread violations of the
              Consumer Financial Protection Act and Regulation E Remittance Transfer Rules. The federal regulator
              determined that Sendwave deceived consumers regarding transfer velocity and pricing, forced senders to
              waive statutory rights, and failed to maintain proper error resolution procedures, requiring 1.5 million
              dollars in customer redress and an additional 1.5 million dollar civil money penalty. Comparable
              enforcement actions by state authorities, including the New York Attorney General's 2025 settlement
              against MoneyGram over delayed transfers and disclosure failures, demonstrate persistent regulatory
              scrutiny across the sector. For Zepz, sustained operational monitoring and verified remediation of
              historical error handling shortcomings are essential to prevent recurring penalties or state licensing
              sanctions.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR013
      - number: '7.2'
        title: Operational and Digital Asset Infrastructure Risk
        blocks:
          - type: paragraph
            body: >-
              As Zepz expands beyond traditional fiat corridor remittances into digital asset rails, its operational
              risk profile increasingly incorporates blockchain-native vulnerabilities alongside conventional payment
              processing failure modes. The launch and expansion of the Sendwave Wallet, utilizing USD Coin on the
              Solana blockchain across emerging market corridors, introduces operational dependencies on third-party
              digital asset custody, network consensus availability, and automated smart contract settlement. To
              mitigate financial crime and sanctions evasion exposure, Zepz integrated TRM Labs blockchain intelligence
              across its wallet infrastructure and participated in UK National Crime Agency public-private partnership
              initiatives focused on transaction monitoring risk indicators. Concurrently, Zepz relies on Fireblocks
              enterprise treasury infrastructure to automate liquidity management and reduce intermediary correspondent
              banking costs. However, technical outages at key custody providers or underlying blockchain congestion
              represent acute failure scenarios capable of interrupting corridor settlement, necessitating verifiable
              redundant infrastructure and ongoing transaction monitoring safeguards.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR014
      - number: '7.3'
        title: Partner, Banking, and Corridor Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              Remittance volume conversion relies on an intricate, highly concentrated network of upstream card
              acquiring processors, commercial sponsor clearing banks, and downstream mobile money payout operators. In
              core East and West African corridors, disbursement relies heavily on regional telecommunications operators
              such as Safaricom M-Pesa, MTN Mobile Money, and Airtel Money, where local agent float shortages or telecom
              API outages directly disrupt recipient access. Upstream, digital remittance providers face banking
              de-risking pressures and card network interchange increases that can compress transaction margins or force
              corridor rerouting. While Zepz leverages multiple payout mechanisms including bank deposits and cash
              collection points, disruptions to critical partner relationships or local telecom gateways present
              immediate operational bottlenecks. Institutional underwriting must continuously assess partner
              counterparty creditworthiness, multi-vendor payout redundancy, and corridor concentration vulnerabilities
              across key remittance routes.
            claimRefs:
              - CR006
              - CR007
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR010
              - CR012
      - number: '7.4'
        title: Financial Model, Margin Compression, and Governance Risk
        blocks:
          - type: paragraph
            body: >-
              The financial profile of digital money transfer platforms faces intensifying structural margin pressure
              from aggressive mobile money competition and global development policy targets. Industry benchmarks
              documented by the GSMA indicate that global mobile money remittance costs decreased to 3.54 percent for
              200 dollar transfers in 2024, driven by a 50 basis point reduction in service provider fees toward the
              United Nations Sustainable Development Goal target of less than 3 percent. Independent consumer reviews
              indicate that WorldRemit utilizes variable exchange rate markups on mid-market rates rather than
              standardized pricing schedules, exposing volumes to customer price sensitivity as transparent digital
              competitors expand. Furthermore, corporate governance transparency remains limited; public disclosures on
              development finance portals like the International Finance Corporation provide minimal ongoing covenant
              visibility, while Zepz continues operating under interim executive leadership without published permanent
              succession timetables.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR010
              - CR012
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory Precedent and Remediation Oversight
            body: >-
              The CFPB's 2023 order against Sendwave highlights that retail remittance platforms face immediate
              regulatory and financial liability when transfer timelines, error investigations, and fee disclosures fall
              short of statutory requirements. Ongoing compliance audits and adherence to multi-state money transmission
              standards remain essential to avoid secondary enforcement.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR013
          - type: callout
            title: Monitoring Stablecoin Rail Dependencies and Executive Governance
            body: >-
              Underwriting Zepz requires tracking both third-party custody and screening reliability across Fireblocks
              and TRM Labs, alongside formal resolution of the permanent chief executive officer succession. Investors
              should require verified documentation of CFPB remediation and board governance structures prior to capital
              commitment.
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR007
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Underwriting Framework
        blocks:
          - type: paragraph
            body: >-
              Evaluating Zepz requires balancing its defensible market footprint across high-volume remittance corridors
              against persistent structural opacity in capital structure and governance. Operating dual brands in
              WorldRemit and Sendwave, the group reaches migrant communities across more than 130 destination countries
              and 5,000 corridors, having facilitated over $15 billion in transaction volume. Furthermore, the company
              reported achieving full-year profitability in 2022 and maintains an active user base of 5.7 million
              individuals. However, the bull thesis of a scaled, cash-generative remittance incumbent is counterbalanced
              by sharp organizational restructuring, including workforce cuts of 26% in May 2023 and an additional 200
              IT personnel in February 2025 alongside operational closures in Kenya and Poland. Without audited group
              disclosures post-2024, institutional underwriters cannot verify current operating margins, cash burn, or
              net revenue retention, leaving investment discipline centered on a cautious research-more posture.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV014
      - number: '8.2'
        title: Capitalization History and Valuation Discipline
        blocks:
          - type: paragraph
            body: >-
              The group's historical financing trajectory reveals significant private valuation marks that lack recent
              secondary liquidity validation. In August 2021, the group completed a $292 million round at a headline $5
              billion valuation coinciding with the corporate rebrand to Zepz and integration of Sendwave. More
              recently, in October 2024, Zepz completed a $267 million Series F round led by Accel with participation
              from Leapfrog and TCV, alongside potential equity commitments from the International Finance Corporation.
              Global index benchmarks, such as the Hurun Global Unicorn Index, tracked Zepz at 26 billion RMB in April
              2023, 35.5 billion RMB in April 2024, and 34 billion RMB in June 2026. Nevertheless, an envisioned initial
              public offering targeting a $6 billion valuation was postponed in 2022 amid financial audit verification
              hurdles and high executive turnover. The absence of public statutory filings on UK Companies House beyond
              the 2025 confirmation cycle means outside capital faces severe preference stack and dilution uncertainty.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV009
              - CV013
      - number: '8.3'
        title: Scenario Modeling, Comparables, and Downside Protections
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis for Zepz spans bull, base, and bear trajectories driven by compliance costs, competitive
              pressure from Wise and Remitly, and expansion into digital wallet infrastructure. In October 2025, Zepz
              launched the Sendwave Wallet on the Solana blockchain utilizing USDC, and in January 2026 acquired Pomelo
              International to incorporate credit-building capabilities. In the bull scenario, stablecoin settlement
              efficiencies and credit card monetization expand customer lifetime value, supporting a re-rating toward
              scaled peers. In the bear case, severe regulatory compliance penalties—typified by CFPB consent orders
              penalizing Sendwave $3 million in restitution and penalties in October 2023, parallel CFPB actions against
              Wise, and state AG enforcement against MoneyGram—depress net margins and force structured down-rounds. The
              recommendation logic chains these operational variables directly into our underwriting stance.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV008
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV008
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Core Underwriting Directive
            body: >-
              Do not participate in unpriced secondary transactions or new equity extensions without full access to an
              audited post-2024 data room verifying cash burn and unit economics.
            calloutType: recommendation
            claimRefs:
              - CV008
              - CV012
          - type: callout
            title: Preference Overhang and Dilution Risk
            body: >-
              With over $1.1 billion in cumulative capital raised across Series E, Series F, and development finance,
              late-stage liquidation preferences may severely compress common share value in any exit below $4 billion.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
