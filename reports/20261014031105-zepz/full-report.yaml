  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      End-to-end customer journey from diaspora sender app onboarding through cross-border treasury routing to recipient
      mobile money and bank payout.
    data:
      items:
        - label: Sender Discovery & Onboarding
          stage: Sender Discovery & Onboarding
          userAction: Diaspora worker downloads WorldRemit or Sendwave app via iOS or Android store
          touchpoints: Mobile app, biometric ID verification, card funding setup
          sentiment: High motivation to avoid traditional bank wire delays and steep cash MTO fees
        - label: Corridor Selection & FX Quotation
          stage: Corridor Selection & FX Quotation
          userAction: User selects destination country, recipient details, and transfer amount
          touchpoints: Upfront fee calculator, mid-market FX spread display, delivery speed estimate
          sentiment: Positive response to zero-fee messaging, but sensitive to undisclosed FX markups
        - label: Payment Authorization & KYC Screening
          stage: Payment Authorization & KYC Screening
          userAction: Sender funds transfer using debit card, credit card, or bank account transfer
          touchpoints: Payment gateway, AML sanctions screening, fraud prevention checks
          sentiment: Potential friction if verification delays transaction processing
        - label: Cross-Border Settlement & Treasury Routing
          stage: Cross-Border Settlement & Treasury Routing
          userAction: Zepz processes transaction via banking rails or Fireblocks stablecoin infrastructure
          touchpoints: Treasury liquidity pool, automated FX conversion, partner API dispatch
          sentiment: System-level operation determining settlement speed and cost efficiency
        - label: Recipient Fund Disbursement
          stage: Recipient Fund Disbursement
          userAction: Funds delivered to recipient via mobile wallet, bank account, or cash pickup
          touchpoints: M-Pesa, GCash, commercial bank deposit, local partner agent location
          sentiment: High recipient satisfaction upon receiving instant mobile notification
        - label: Repeat Transaction & Expansion Loop
          stage: Repeat Transaction & Expansion Loop
          userAction: Sender executes recurring monthly remittances and explores digital wallet products
          touchpoints: Push notification reminders, recipient address book, upcoming multi-currency wallet
          sentiment: Strong loyalty driven by convenience, with cross-sell potential for digital banking
    approximationNotes: >-
      Journey stages synthesized from WorldRemit and Sendwave user onboarding workflows, regulatory disclosures, and
      partner payout specifications.
