callouts:
  - calloutType: "insight"
    title: "Dual-Brand Strategic Positioning and Synergies"
    body: "Zepz preserves distinct go-to-market identities for WorldRemit and Sendwave to address divergent consumer segments. WorldRemit acts as an omnichannel remittance engine supporting cash pickup, bank deposit, and mobile money rails across mature and emerging markets. Sendwave operates as a lean, low-cost app tailored for high-volume mobile wallet corridors in Africa and Asia. While this dual architecture maximizes corridor coverage, integrating back-office infrastructure remains a key driver of operational efficiency."
    claimRefs:
      - "CO001"
      - "CO007"
      - "CO012"
  - calloutType: "risk"
    title: "Valuation Benchmark Opacity and Regulatory Overhead"
    body: "Following its postponed 2022 IPO, Zepz successfully stabilized its balance sheet by refinancing debt through a $267 million equity round in 2024, but chose not to disclose an updated valuation. Coupled with executive turnover and the legacy 2023 CFPB consent order regarding disclosure practices, private diligence requires scrutiny of liquidation preferences, cap table structure, and compliance remediation costs."
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO010"
      - "CO013"
