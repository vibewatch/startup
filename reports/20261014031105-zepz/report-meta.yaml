companyProfile:
  summary: >-
    Zepz is a London-based cross-border payments group behind WorldRemit and Sendwave. The company operates a
    multi-brand remittance network spanning 50 sending markets, 130+ destinations, and thousands of corridors, and it
    has recently added stablecoin-linked settlement and wallet functionality while remaining a private, late-stage
    business.
