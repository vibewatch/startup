          label: 数据与模型评估
          detail: 客户会测试 SAFE 的集成、FAIR 式量化，以及把控制、暴露和供应商数据合在一起的能力。
        - id: initial-land
          label: 初始落地
          detail: 第一条上线工作流通常是 CRQ、控制报告，或聚焦某个高痛手工流程的 TPRM 动作。
        - id: operational-embed
          label: 运营嵌入
          detail: 团队用 SAFE 做优先级排序、董事会报告、预算规划，以及可辩护的整改排序。
        - id: expansion
          label: 扩张循环
          detail: 拿下第一场胜利后，客户会增加 TPRM、保险优化、更广的供应商覆盖，或更多风险场景。
        - id: durability-test
          label: 持久性测试
