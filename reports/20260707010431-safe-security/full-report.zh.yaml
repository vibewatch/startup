  - id: TR005
    title: 缓释措施与否决标准表
    layout: wide
    columns:
      - 风险
      - 当前缓释措施
      - 否决标准
      - 监测信号
    rows:
      - - 平台数据泄露或重大客户数据暴露
        - 加密、租户隔离、SOC 3 和 AWS 原生控制已公开
        - 任何已确认的大规模暴露漏洞、敞口或嵌入式凭据数据事件
        - 事故披露、客户通知、支持工单激增，或紧急区域 / 密钥轮换
      - - 披露敏感工作流中的模型或评分可靠性失效
        - SAFE AURA、人工监督和不用于训练声明
        - 有证据显示，主要客户无法信任 Safe 输出，用于董事会、披露或优先级排序场景
        - 基准测试请求、人工覆写率、客户升级反馈，或撤回的部署主张
      - - Balbix 或 RiskLens 整合拖累
        - 具名负责人、单一平台叙事和收购理由
        - 迁移里程碑落空、客户困惑，或收购客户群流失持续超过两个季度
        - 路线图延误、SKU 膨胀、支持积压，或客户访谈中出现降级表述
      - - 监管与合同脆弱性
        - 区域选择、处理者定位、SCC 兼容性和出口条款
        - 无法提供受监管买方可接受的 DPA、分包处理方透明度或数据泄露通知承诺
        - 安全问卷延误、法律红线，或因隐私条款导致的区域交易延期
      - - 人才与领导层恶化
        - 新资本和使命驱动的招聘叙事
        - Saket Modi、Gaurav Banga，或一批 AI / 风险引擎负责人离职，且没有清晰接班安排
        - 高管流失、高级招聘长期空缺，或离职率上升和员工评价趋势转负
