      - 依赖项
      - 类型
      - 受损后的影响
      - 替代方案
      - 缓释因素
      - 剩余敞口
    rows:
      - - AWS 托管、KMS 和区域控制平面
        - 云基础设施与采购渠道
        - 服务可用性、密钥管理和部署速度一起下滑
        - 多云重建理论上可行，但没有公开证据
        - 客户可选区域、客户自有 KMS 密钥、AWS 原生控制
        - 高
      - - AWS Marketplace 和私有报价推进
        - 渠道与采购依赖
        - 如果渠道表现不佳，企业采购摩擦会上升，云预算杠杆会减弱
        - 直接企业销售仍可行，但速度更慢
        - Marketplace 上架、合并账单和私有报价
        - 中高
      - - 第三方 LLM 提供商和动态路由
        - 模型提供商依赖
        - 提供商宕机、政策变化或区域缺口，可能影响 SAFE AI 行为和数据路径
        - 可以切换不同模型，但客户不能直接选择提供商
        - 不用于训练承诺，以及由管理员把关的搜索
        - 高
      - - RiskLens 和 FAIR 方法论生态
        - 方法论与人才依赖
        - 如果 FAIR 转译或关键领域人才流失，Safe 的 CRQ 差异化会变弱
        - 内部评分可以继续，但可信度可能下降
        - 收购 RiskLens，并留住与 FAIR 相关的领导层
        - 中高
      - - Balbix CTEM 数据模型和集成底座
        - 被收购技术依赖
        - 统一延迟或迁移问题会扭曲敞口数据和客户信任
        - 自研需要时间，仍有迁移风险
        - 具名 CTEM 负责人和共享的单一平台路线图
        - 高
    notes: 依赖风险不只是技术问题，还包括采购、方法论和外部模型集中度；这些变量会重塑 Safe 的产品行为或商业化杠杆。
