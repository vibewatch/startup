              SAFE 的融资时间线大方向清楚，尽管股权结构表和估值并不透明。Lucideus 在 2016 年披露天使融资，2017 年披露更广泛的天使财团轮；当时公司称前四年基本自力更生，业务仍以印度为主。现代机构轮次来自
