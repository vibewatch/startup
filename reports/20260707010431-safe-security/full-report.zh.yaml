            body: >-
              核心客户风险不是缺少客户 Logo，而是缺少客户耐久度和集中度指标披露。SAFE 的公开参考客户集中在超大型企业和关键任务运营方——这类客户能带来漂亮 ACV
              和强背书，但如果底层客户基数不够宽，也会拉长销售周期、增加定制实施，并带来明显头部客户暴露。地域也呈混合状态：IHG、Glovo 和 Aboitiz
              显示公司确实触达国际市场，但公开叙事整体仍偏北美。证明深度同样不均衡。T-Mobile、Instacart、Kyriba、Carvana、Aboitiz 和 OB Hospitalist Group
              提供了量化案例，Google、Fidelity 和 Chevron 在所审阅材料中仍只是名称级证据。最后，Gartner 将 TPRM
              品类描述为多职能、多利益方市场，凸显采购摩擦：这类销售是复杂企业级项目，不是轻量工具采购。除非 SAFE 披露客户数桥接、头部客户暴露、地域组合和留存队列，集中度风险仍是尽调最大的未解问题之一。
