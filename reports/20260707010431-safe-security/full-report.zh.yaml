      - number: '7.2'
        title: 运营与安全风险
        blocks:
          - type: paragraph
            body: >-
              最难判断的运营风险，是 Safe 所触及数据的敏感性。Safe 一旦被攻破，不会像普通 SaaS 事件，因为平台本来就把漏洞、暴露面、云、身份、AI 和第三方风险信号汇到同一个决策界面。Safe
              公开披露了区域选择、TLS 1.2、AWS KMS 下的 AES-256 加密和 SOC 3 覆盖，这些缓释因素有意义，但不能抹掉失陷后果。独立行业证据在这里很关键：Tenable 和 Qualys 仍在
              Salesloft Drift OAuth 行动中出现客户数据暴露，更大的 Salesforce 供应链事件波及 700 多家组织并暴露嵌入式凭据。Safe 自身 AI
              政策还引入了更隐蔽的风险面。公司称，提示词可能因运营原因被保留，模型路由是动态的，客户不能选择单个提供商。只有支撑性的
              DPA、次处理方、日志和验证层足够强，这些做法才可控。公开材料对这些深层机制的证明仍然偏薄，所以对平台安全和数据处理失效的剩余判断仍是高风险。
