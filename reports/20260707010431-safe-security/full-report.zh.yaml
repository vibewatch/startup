      - number: '8.2'
        title: 可比公司分析
        blocks:
          - type: paragraph
            body: >-
              公开可比公司显示，网络安全倍数会因增长质量和成熟度迅速分层。Tenable 的 2026 年指引收入已接近 $1.1 billion，但企业价值/收入仅约 4.3x；Rapid7 因增长停滞，EV/ARR
              更低，接近 1.2x。Qualys 是盈利能力更强、估值更高的基准，EV/收入约 6.8x，背后有 83% 毛利率和克制执行。Windsor Drake、Finro、Clipperton 和 First
              Analysis 的行业研究都指向同一个结论：公开网络安全定价中位数远低于 2021 年峰值，只有真正的领导者、且 Rule-of-40 画像干净，才能保住两位数倍数。私营和战略可比样本更分散。Axonius 的
              2024 年收入估算和 $2.6 billion 估值隐含高十几倍倍数，SecurityScorecard 更接近高个位数，BitSight 获 Moody's 背书的 $2.4 billion
              轮次则显示，战略买家能为网络风险分析付出更高价格。因此，SAFE 值得放在高于 Tenable 和 Rapid7 的溢价区间分析，但除非经审计规模和稀缺性清晰得多，否则不应与 Wiz 放在同一高度。
