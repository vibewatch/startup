figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: SAFE 从一家创立于 IIT Bombay 的服务公司，演进为多模块网络风险平台；融资、收购、分析师背书，以及一起已披露法律纠纷构成了这条路径。
    data:
      items:
