        blocks:
          - type: paragraph
            body: >-
              SAFE 的轨迹显示，它正从网络风险量化稳步扩到相邻控制平面。公司 2021 年从 Lucideus 更名为 SAFE，2023 年 6 月收购 RiskLens，把 FAIR
              方法论和领导人才纳入内部；2024-2026 年又把平台范围从 CRQ 扩至 TPRM、CTEM 和 AI-SPM。2025 年官方材料称，TPRM 在 2024 年推出后，超过半数客户已采用该模块；2025 年
              6 月 SAFE 材料引用 Forrester，将公司评为网络风险量化 Leader；2025 年 4 月 SAFE 材料引用 Liminal，称其 TPRM 产品能力排名最高。2025 年 7 月既有 C
              轮融资，也有 Cisco AI Defense 合作；2025 年 11 月收购 Balbix，补入暴露管理深度，并让 Balbix 创始人 Gaurav Banga 进入运营团队。主要负面事件出现在 2025
              年末，SecurityScorecard 起诉 SAFE，指控不正当竞争和商业秘密滥用；次月，SAFE 与 SecurityScorecard
              宣布达成解决并开展研究合作。总体看，里程碑记录符合一家仍在快速扩张、不断加品类的公司；但治理、估值和经审计运营指标的公开披露，并没有跟上产品和融资节奏。
