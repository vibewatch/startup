      - number: '4.3'
        title: 资本历史与充足性
        blocks:
          - type: paragraph
            body: >-
              资本充足性短期看可以接受，但在承销最在意的地方仍不透明。SAFE 留存公开来源支持一条融资弧线：从 $50 million B 轮到 $70 million C 轮，总融资超过 $170 million；更早的
              SEC Form D 记录也确认，公司早在当前品牌周期之前就已动用私募资本。2025 年 7 月 C 轮叙事是扩张性的，而非防御性的：募资用途围绕工程、go-to-market、研发和 CyberAGI
              路线图，而不是重组或修复资产负债表。这在方向上是正面信号。但同一材料也留下关键充足性问题。SAFE 不披露当前现金、月烧钱或任何债务期限表。它也不披露 RiskLens 或 Balbix
              的收购成本、已经发生的整合支出，或 Balbix 组合要把 CTEM 大规模变现还需要多少额外产品和 GTM 投资。按低置信度公开估算，这类画像的公司每年可能烧掉约 $25-$45
              million；若不计任何剩余前轮现金，C 轮资金大致对应 18-30 个月 runway。这足以继续建设，但透明度不足以精确承销下一轮时间点。
