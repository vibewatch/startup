  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与画像
        blocks:
          - type: paragraph
            body: >-
              SAFE 的公开客户证据指向大型和中高端企业客户基础，而不是广泛 SMB 或自助式销售。主页称 SAFE 被 10% 的 Fortune 500
              使用，客户库则突出电信、金融服务、医疗健康、保险、零售、公用事业、咨询和酒店业名称。这些故事里的买方通常是 CISO、网络风险负责人、GRC 负责人或 TPRM
              负责人，他们需要董事会级风险沟通、预算论证或可辩护的优先级排序。日常用户是安全、风险和供应商管理团队；付款方通常是企业安全、合规或风险预算负责人。公开用例集中在 CRQ、高管汇报，以及越来越多的 TPRM
              自动化，并反复强调财务语言和业务影响，而不只是技术遥测。这个组合暗示更高的隐含 ACV 和更深的工作流嵌入，但也意味着更长的企业销售周期；如果相对少数超大客户贡献了不成比例的收入，集中风险也更高。
