      - number: '4.4'
        title: 财务缺口与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              核心承销问题不是 SAFE 是否有一个可信的软件业务，而是公开记录从未展示叙事底下的经营算式。留存来源没有披露 ARR、GAAP
              收入、递延收入、模块组合、毛利率、净收入留存、流失、客户集中度、现金余额、月烧钱，或 RiskLens 与 Balbix 的收购对价。这意味着成熟投资人无法判断，SAFE
              究竟是一台拥有有吸引力扩张经济性的高质量经常性软件引擎，还是一个仍带着实质整合负担和服务拖累、需要持续资本的平台招商故事。因此，尽调路径应当精确且财务化，而不是主题化：索取按模块拆分的 ARR 和
              billings；CRQ、TPRM、CTEM 的已实现定价和折扣阶梯；递延收入和 RPO；按 vintage 的 cohort
              留存与扩张；云托管和支持成本驱动因素；按渠道拆分的销售与营销效率；收购整合记分卡；以及包含任何债务、earn-out 或留任包的月度现金 runway
              模型。看到这些材料之前，正确的财务结论是：收入质量和产品宽度可谨慎看正面，但精确度、利润率路径和资本效率仍被阻断。
