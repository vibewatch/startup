  - id: TV006
    title: 最终尽调问题表
    columns:
      - 尽调要求
      - 优先级
      - 重要性
      - 目标来源
    rows:
      - - 从 FY2024 到最近一个季度的当前 ARR 桥接
        - 关键
        - 决定假设以 $1B 进入时，ARR 倍数是 10x、14x，还是更差。
        - 经审计的管理层财务包，或董事会批准的 KPI 材料
      - - 净收入留存、毛利率，以及烧钱 / FCF 状况
        - 关键
        - 区分高质量 SaaS 增长和只有叙事支撑的增长。
        - 经审计财务报表和运营指标明细表
      - - 当前股权结构表、清算优先权、反稀释条款，以及所有 Series C 后债务条款
        - 关键
        - 决定估值上行能否转化为普通股回报。
        - 股权结构表导出、投资条款清单和律师摘要
      - - CRQ、TPRM 和 CTEM 的模块级采用与扩张
        - 高
        - 检验平台宽度是在变现，还是只是扩大产品营销口径。
        - 队列分析和产品附加销售仪表盘
      - - 相对大型安全套件的赢单 / 输单和定价数据
        - 高
        - 显示 SAFE 是否有战略稀缺性，还是容易被打包销售压力挤压。
        - 销售分析、竞争战卡和丢单复盘
      - - 当前市场估值标记背后的证据，包括 2025 或 2026 年任何二级交易或债务融资
        - 高
        - 弥合公司叙事与负面第三方估值信号之间的差距。
        - 投资人更新、融资备忘录，或独立 409A / 估值工作
    notes: 这些问题直接决定投资判断，因为它们堵住的是阻碍买入建议的具体缺口，而不是泛泛收集尽调琐事。
