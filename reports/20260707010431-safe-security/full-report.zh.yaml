        blocks:
          - type: paragraph
            body: >-
              创始人身份是 SAFE 故事里佐证最充分的部分之一。独立报道、CEO 自己的 Forbes 档案和投资者材料都指向 Saket Modi、Rahul Tyagi 和 Vidit Baxi 这三位创始人；Saket
              Modi 仍是公司最清晰、最强势的外部面孔，担任联合创始人兼 CEO。Craft 的公司资料也将 Vidit Baxi 标为联合创始人兼 CISO、Rahul Tyagi 为联合创始人、Saket Bajoria
              为首席产品官。领导层扩张也来自收购：2023 年 RiskLens 交易后，前 RiskLens CEO Nick Sanna 加入 SAFE 任总裁，Jack Jones 成为首席研究科学家；2025 年
              Balbix 收购后，创始人 Gaurav Banga 加入并担任 CTEM
              总裁。主要治理提示在披露深度。为本章审阅的公开材料识别了投资者、战略支持方和运营高管，但没有发布完整董事会名单、委员会结构或明确接班计划。因此，Saket Modi
