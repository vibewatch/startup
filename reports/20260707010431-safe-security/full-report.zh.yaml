  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块
      - 描述
      - 成熟度
      - 关键差异点
      - 竞争对手
    rows:
      - - SAFE CRQ
        - 金融化网络风险决策引擎，基于 FAIR 的情景建模、控制分析和董事会可用报告，以美元量化暴露。
        - 最成熟的商业支柱；2025 年获得 Forrester 外部验证
        - 把基于 FAIR 的量化、FAIR-CAM 控制分析和广泛集成放进同一平台
        - Axio、RiskLens 传统客户基础、KPMG、CYE、ThreatConnect
      - - SAFE CTEM
        - 暴露管理层，统一资产和漏洞遥测，按可利用性和业务影响排序，验证攻击路径，并分派修复。
        - 比 CRQ 更新，但 2025 年 7 月发布并收购 Balbix 后，战略位置居中
        - 把战术层暴露直接连到量化业务影响，而不是把 CTEM 当成独立评分孤岛
        - Balbix 传统平台、Nucleus、Zafran、Tenable 暴露产品
      - - SAFE TPRM
        - 由代理式工作流驱动的第三方风险平台，覆盖准入、问卷、监控、复评和第四方可见性。
        - 快速扩张；SAFE 称截至 2025 年 7 月客户采用率 >50%，不到一年达到 $10M ARR
        - 用专门 AI 代理减少人工催供应商，把 TPRM 变成按风险排序的运营工作流
        - SecurityScorecard、BitSight、Black Kite、Whistic 与 ProcessUnity
      - - SAFE AI-SPM
        - AI 安全态势管理，覆盖影子 AI 发现、AI 供应商可见性、合同、配置、问卷和实时活动监控。
        - 最新模块；2026 年公开发布，主打快速见效
        - Real-Time AI Risk Graph 加上 SAFE 其他模块共用的工作流引擎，且不要求内联部署
        - Cranium、Obsidian、新兴 AI-SPM / AI 治理厂商
      - - SafeX 和工作流底座
        - 推理与工作流层，把遥测转成跨模块行动、报告、摘要、分派和修复编排。
        - 战略平台层，而非独立 SKU
        - 如果模块真正打通，CRQ、CTEM、TPRM 和 AI-SPM 共用的代理式工作流模型可减少工具蔓延
        - Tines、ServiceNow、定制内部编排
      - - API 和集成层
        - REST API、GitHub 集成和连接器市场，把外部工具、资产、发现项和文档带入 SAFE。
        - 生产级公开接口，已发布认证和速率限制细节
        - 把管理员管理的 API 访问，与覆盖安全、ITSM、云和生产力工具的广泛无代码集成界面结合起来
        - 单个扫描器点对点集成、定制 ETL、SOAR 连接器
    notes: 成熟度反映公开商业证据和外部验证，不代表对每个模块可靠性或客户满意度的完整承销判断。
