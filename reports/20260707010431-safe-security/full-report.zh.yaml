  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：SAFE 同时面对直接 CRQ、CTEM、TPRM 与平台整合型对手
        blocks:
          - type: paragraph
            body: >-
              SAFE 防守的不是单一品类小众市场。已审阅证据显示，竞争格局有四条战线。第一条是直接 CRQ 和网络风险管理供应商：SAFE、Tenable、SecurityScorecard、BitSight，以及相邻
              CAASM 玩家 Axonius，都声称能把原始暴露或遥测转化为按业务优先级排序的风险洞察。第二条是 CTEM 和暴露验证供应商，例如 Tenable、CrowdStrike、Rapid7 和
              Cymulate，它们越来越多销售可利用性证明、攻击路径上下文和修复自动化。第三条是专门的 TPRM 厂商，包括 Panorays、Prevalent、OneTrust、ProcessUnity，以及信任管理侧的
              Vanta。第四条是 Palo Alto 和 CrowdStrike 等宽平台替代者，它们能靠续约驱动的平台整合吃掉同一笔预算。Forrester 2025 年 CRQ
              评论很重要，因为它明确指出，厂商已经扩展到暴露管理和第三方风险等相邻用例，这意味着 SAFE 的真实竞争范围比传统 CRQ 阵营更宽。因此，SAFE
              的胜负不只取决于量化准确度，还取决于买方更偏好统一的跨域风险平台，还是专门的评级、TPRM 或暴露管理工具。
