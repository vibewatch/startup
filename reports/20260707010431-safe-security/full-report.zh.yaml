      - number: '5.5'
        title: 路线图、成熟度与前进方向
        blocks:
          - type: paragraph
            body: >-
              路线图足够可见，能判断方向，即便不是每个里程碑都能独立承销。顺序是连贯的：2023 年 RiskLens 给 SAFE 带来可辩护的量化 IP；TPRM 于 2024 年推出，并在 2025
              年被重新定位为完全自主的智能体工作流产品；CTEM 在 2025 年 7 月成为下一个主要模块；Balbix 在 2025 年 11 月跟进，加深暴露管理和资产情报覆盖；AI-SPM 到 2026
              年出现，把同一平台延伸到 AI 治理和 AI 供应商暴露。换句话说，SAFE 正在从战略量化向运营风险降低外扩。不过外部信号有分歧。Forrester 的 CRQ 观点很正面，验证了 FAIR-CAM
              差异化；客户故事显示生产使用；AWS Marketplace 存在说明企业采购意图。但 BankInfoSecurity 提到，用户仍希望在规模化资产和暴露标签上得到改进；PeerSpot
              显示相对于既有厂商，一线用户评价深度非常有限；GARP 对 CyberAGI 的报道也凸显，自主化故事仍有很大愿景成分。SAFE 在 CRQ 上看起来商业成熟，在 TPRM 和 CTEM 上商业加速，在
              AI-SPM 上更早期；三个新界面共同的风险是，自主叙事目前公开宽度大于公开工程证明。
