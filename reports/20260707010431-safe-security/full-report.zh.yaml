      - number: '2.2'
        title: 市场规模：TAM、SAM、SOM
        blocks:
          - type: paragraph
            body: >-
              公开规模证据确认，SAFE 正在出售给多个十亿美元级类别；但这些证据不能支撑一张简单相加的 TAM 幻灯片。Mordor 较宽的 CRQ 评分平台口径在 2026 年达到 USD 5.43 billion；较窄的
              CRQ 治理口径为 USD 2.04 billion，SAFE 自己更早的表述则是 USD 4 billion。CTEM 仍是新兴市场类别，Grand View / GII 口径下 2025 年为 USD
              2.70 billion，按 2026 年前瞻估算约为 USD 3.04 billion；CAASM 相邻市场在 2026 年已经约为 USD 3.70 billion。TPRM
              软件是最大的直接相邻工作流，2025 年为 USD 8.5 billion，按 2026 年前瞻估算约为 USD 9.78 billion。更宽的 GRC 和网络安全资金池大得多，分别为 USD 23.32
              billion 和 USD 264.43 billion，但它们会显著夸大 SAFE 今天能服务的范围。正确的尽调结论是：TAM 真实存在，SAM 和 SOM
              无法从公开材料中单独拆出，而类别重叠本身就是核心市场事实。
