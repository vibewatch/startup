      - number: '7.5'
        title: 终止标准与监控
        blocks:
          - type: paragraph
            body: >-
              Safe 并非毫无缓冲。公司有真实的安全披露、公开的保证覆盖、强融资能力，也能清楚解释 Balbix 和 RiskLens
              的战略意义。但审慎投资者应把当前材料视为可能性证明，而不是控制力证明。近期能观察到的投资论点破裂触发点很明确：Safe 自身发生重大安全事件；出现证据表明大客户不能把 Safe
              输出用于披露敏感或董事会敏感场景；Balbix 和 RiskLens 客户队列出现可见流失或迁移痛点；创始人与收购线领导层出现高管离职。这些都会实质改变承销判断。更大的问题在于，公开记录仍然没有展示：公开 DPA
              或次处理方名单、经过基准测试的模型准确性证据、收购经济性和硬性集成里程碑。这些缺口不是装饰性问题。它们决定投资人是在相信公司已经搭出一套可防御的网络风险决策控制平面，还是只是在相信公司营销了这样一套东西。除非这些缺口补上，监控就必须明确且严厉。
