  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与格局
        blocks:
          - type: paragraph
            body: >-
              Safe Security 最可辩护的市场不是「全部网络安全」，而是一个更窄的企业工作流：把技术暴露转译为业务和治理行动。SAFE 自己在 2025-2026 年的平台信息中，已经把 CRQ、CTEM、TPRM
              和 AI-SPM 打包成一个运营层；因此本章应先定义市场，再谈市场规模。CRQ 覆盖董事会、财务和保险工作流中的网络风险财务表达。CTEM 覆盖攻击面暴露的持续发现、排序、验证和动员。TPRM
              覆盖供应商和第四方的导入、评估、监控和治理全生命周期。这些类别与 CAASM、暴露评估平台、GRC、IRM，甚至 EDR/XDR
              或传统漏洞管理都有重叠，但不能互相替代。买方要解决的任务正向持续、证据支撑的网络风险决策收敛，而预算仍分散在多个相邻科目里。
