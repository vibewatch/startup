      - number: '5.4'
        title: 合规、信任与数据处理
        blocks:
          - type: paragraph
            body: >-
              SAFE 的信任态势强于其公开基础设施披露。安全页面列出 SOC 2 Type 2、ISO 27001:2013、ISO 9001:2015 和 TX-RAMP，并描述一种多租户 AWS
              部署模型，客户可选择区域，传输中使用 TLS 1.2，静态数据使用 AES-256，密钥管理基于 AWS KMS，还有持续 SAST 和 DAST 扫描、每日漏洞评估和定期访问审查。AI
              政策为更新的智能体界面给出了最清晰的信任语言。SAFE 称提示词限定在租户范围内，客户数据不会用于训练共享或跨租户模型，数据不会跨客户共享，模型路由可涉及 AWS Bedrock 托管模型、Anthropic 和
              OpenAI 模型。公司还披露，AI 交互会被记录，管理员可禁用 AI 使用，SAFE AI 并非为 PHI/HIPAA
              工作负载设计。这是有意义的企业级披露。剩余提示在于范围精度。公开信任页面没有提供审计报告摘录、证书编号或多数认证的续期日期，也没有解释 AI
              专属控制如何映射到每项认证边界。受监管环境中的买方应把已发布姿态视为可信但不完整，直到信任中心材料被共享。
