      - number: '8.3'
        title: 情景分析
        blocks:
          - type: paragraph
            body: >-
              在今天这组披露下，情景分析是给 SAFE 估值的唯一诚实方法。熊市情景假设平台故事跑赢了底层经济性：增长放慢，更大的网络安全套件把风险管理打包商品化，市场给 SAFE 的定价更像一个能见度较低的后期 SaaS
              资产，而不是稀缺领导者。在这种结果下，$60 million to $70 million ARR 配 7x to 10x，只能得到 $500 million to $700 million 价值。基准情景假设
              SAFE 继续把 CRQ 领导力转化为更广的 TPRM 和 CTEM 钱包份额，成熟到约 $175 million to $200 million ARR，并跨过 8x to 10x 倍数，支撑约 $1.5
              billion to $2.0 billion。牛市情景要求高得多：CyberAGI 定位必须转化为真实平台领导力，ARR 必须扩大到接近 $300 million to $350
              million，投资者也仍愿意为战略品类赢家支付 10x to 12x。这样可得到约 $3.0 billion to $4.2 billion。上行数字可以实现，但前提是执行把证据缺口补上，而不是只把叙事拉大。
