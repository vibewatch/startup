          mid: 600
          high: 700
        - label: 基准
          low: 1500
          mid: 1750
          high: 2000
        - label: 乐观
          low: 3000
          mid: 3500
          high: 4200
    approximationNotes: 数值单位为百万美元。图中呈现估值区间而非投资者 IRR，因为公开来源未披露 SAFE 当前股数或优先股堆栈机制。
