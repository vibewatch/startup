      - number: '2.3'
        title: 买方画像与决策标准
        blocks:
          - type: paragraph
            body: >-
              SAFE 的买方图谱有吸引力，正因为它跨职能；但同一宽度也拉长企业销售周期。CRQ 和 CTEM 采购通常由 CISO、CRO、企业风险或 IT
              风险组织牵头，因为这些团队负责暴露排序、董事会汇报和修复治理。TPRM 把采购、隐私、法务和合规团队也拉进流程，因为供应商准入、问卷、合同和持续监控都跨越这些职能。网络保险、资本配置或 SEC
              披露质量成为明确用例时，财务和司库团队会影响讨论。IBM 和 Moody's 的公开 TPRM
              框架也说明了自动化为何重要：买方想要清单、尽调、工作流、评分、合同控制、可审计记录和持续监控，并且越来越希望安全审查更早进入采购流程。这个组合利好能统一数据的平台，但也意味着 SAFE
              必须先清掉集成、工作流和治理异议，技术胜利才会变成已签企业合同。
