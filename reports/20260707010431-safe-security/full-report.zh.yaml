      - number: '2.4'
        title: 增长驱动因素与市场约束
        blocks:
          - type: paragraph
            body: >-
              最强的增长驱动因素既清晰也正在发生。AI 采用正在创造新的机器身份、影子 AI 工作流和配置风险，把网络治理推到传统安全控制之外。SEC
              网络披露规则迫使上市公司把重要性判断、治理和董事会监督落到流程里，利好可辩护的量化和报告。网络保险仍在增长，承保方也越来越奖励能量化暴露、或至少能拿出更好证据的客户。供应链攻击仍足够频繁，第三方风险已不再是小众合规任务。与此同时，市场也有真实刹车。2026
              年预算增长仍为正，但买方越来越想要可衡量效果、更少工具和更低运营摩擦。CRQ 还有信任问题：当输出显得过度精确，或与受众没有对齐时，信任会受损。最后，隐私限制、碎片化遥测和漫长的跨职能实施意味着，SAFE
              所在类别技术紧迫性很高，但转化速度并不保证。
