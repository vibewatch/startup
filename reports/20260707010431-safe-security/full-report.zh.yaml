    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              Safe Security 是 Lucideus 的现用品牌；Lucideus 2012 年成立，是一家网络安全公司，如今总部位于加州 Palo
              Alto。公司把自己定位为自主网络风险管理平台，而不是单点安全工具。官方页面反复描述的是一个统一平台：帮助 CISO、TPRM 负责人和 GRC 团队，在企业、第三方、威胁暴露和 AI
              场景中持续量化、排序并降低网络风险。产品栈如今覆盖网络风险量化 (CRQ)、第三方风险管理 (TPRM)、持续威胁暴露管理 (CTEM) 和 AI 安全态势管理
              (AI-SPM)，智能体工作流与实时风险图谱负责串起这些模块。公开地点页面和公司 LinkedIn 资料把 Palo Alto 锚定为总部，并显示公司在 New York、Santa Clara、San
              Jose、New Delhi、Bengaluru、London、Dubai
              以及远程招聘市场还有运营足迹。后续章节最稳妥的标准描述是：一家私营企业网络风险软件供应商，向大型组织销售平台订阅；产品宽度扩张快于财务披露深度。
