      - number: '5.2'
        title: 技术架构与智能体 AI
        blocks:
          - type: paragraph
            body: >-
              能从公开材料中实际验证的架构，核心是连接器、标准化层、基于 FAIR 的风险逻辑和工作流引擎，而不是底层基础设施图。SAFE 的 CRQ 界面称，平台从 200+ 个安全和业务系统摄取数据，每天审查约 600
              个威胁事件。CTEM 页面展示了这种能力如何扩展到漏洞扫描器、CMDB、云工具、渗透测试输出和工单系统，让暴露可以去重、排序并被动员。集成市场和 API 文档让这个故事更具体：SAFE 暴露基于 Swagger
              的 REST API，带版本化端点、管理员管理的凭证和每分钟 1,200 次请求上限；GitHub 等集成指南展示了发现项和资产如何从源系统拉入 SAFE。数据平面之上是工作流织网。文档描述触发器、动作、流控制和
              AI 任务；产品页则宣传 100+ 个工作流、100+ 个 AI 智能体和 150+ 个连接器。关键架构结论是，SAFE 试图成为客户现有安全技术栈之上的编排和推理层。公开缺口在于，SAFE
              尚未发布详细内部服务地图、排队模型或故障域说明，因此该编排层的运营韧性仍需要直接尽调。
