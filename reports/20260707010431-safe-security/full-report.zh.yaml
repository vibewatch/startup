      - number: '7.4'
        title: 人员与执行风险
        blocks:
          - type: paragraph
            body: >-
              人员风险对 Safe 异常重要，因为公司同时由创始人主导、由收购驱动、又由 AI 叙事牵引。Saket Modi 仍是公司品类主张、融资和 CyberAGI 叙事的公众面孔，Gaurav Banga 现在负责
              CTEM 集成，RiskLens 领导层仍与 FAIR 层绑定。如果劳动力市场宽松、员工情绪强，这种集中度或许还能消化，但现实并非如此。TechStrong 的 2026 年调查称，AI
              工程师和网络安全工程师是最难招聘的两个岗位，而 Safe 恰恰需要这种混合人才。Economic Times
              报道，公司约一半员工和大部分研发在印度，这给美国企业销售、印度工程执行和收购后文化整合增加了协调和留任复杂度。最具体的负面证据来自 AmbitionBox：Safe 的员工整体评分为
              2.5/5，工作生活平衡和工作保障得分最低。这些评价不能一锤定音，但方向上重要，因为长工时、弱工作保障和管理摩擦，正是会拖慢集成、削弱 AI 产品质量的条件。
