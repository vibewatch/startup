    title: 论点破裂与否决触发表
    columns:
      - 触发因素
      - 阈值
      - 监测信号
      - 行动
    rows:
      - - 下轮融资或结构化融资
        - 任何一级融资低于 $1B 参考点，或带有惩罚性下行保护
        - 新融资公告、股权结构更新或权利摘要
        - 从“跟踪”转向“回避”，直到重新承销普通股经济性。
      - - 增长可信度下降
        - 当前 ARR 桥接显示 ARR 明显低于约 $80M，或前瞻增长低于品类溢价水平
        - 经审计 ARR 桥接、董事会材料或投资人演示
        - 按上市可比公司区间重新定价，而不是按私营溢价区间。
      - - 模块采用停滞
        - 没有证据显示 CTEM 和 TPRM 正在增加可持续的付费钱包份额
        - 模块挂载、扩展客户群和续约数据
        - 在情景建模中压缩平台溢价。
      - - 上市可比公司重估
        - 高溢价网络安全倍数再次压缩到低个位数
        - Qualys、Tenable、Rapid7 及更广网络安全篮子的上市可比公司行情
        - 收紧进入价格，并下调基准情景估值。
      - - 战略叙事转弱
        - SAFE 不再像记录系统，更像一组功能
        - 相对大型平台的赢单 / 输单数据，以及打包和定价变化
        - 把乐观情景视为失效，只聚焦基准到悲观情景。
    notes: 表中列的是可监控触发器，不是抽象担忧；一旦乐观投资论据失去经济基础，就必须快速行动。
