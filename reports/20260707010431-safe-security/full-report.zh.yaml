  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Safe 今天的监管与法律暴露不是一起头条执法案，而是一层层义务；Safe 嵌在客户治理工作流里，这些义务才变得重要。上市公司客户现在要面对 SEC Item 1.05 和 Item 106
              披露义务，因此任何用于董事会汇报、网络安全重大性评估或事件升级的 Safe 输出，都可能进入受监管的决策链。Safe 自身政策又增加了跨境复杂度。隐私政策明确区分 Safe
              作为自有网站数据控制者和客户数据处理者的角色，同时列出的处理司法辖区覆盖美国、欧洲、巴林、印度、澳大利亚和新加坡。因此，GDPR 传输机制、印度 DPDP 违约通知义务、客户合同中的 DPA
              条款，都不是后台合规卫生，而是核心尽调问题。客户条款还提出出口管制和制裁义务，并大幅限制合同救济；近期 SecurityScorecard
              争议也证明，即便具体事项已经解决，竞争或法律摩擦仍可能触达公司。因此，风险不在某一个可见案件，而在 Safe 能否在审视下支撑企业级合同、披露和事件响应。
