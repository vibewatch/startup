  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: SAFE 的公开客户旅程通常从 CISO 或 TPRM 负责人开始：他们想替代主观的网络风险流程；平台嵌入后，再扩展到董事会报告和相邻模块。
