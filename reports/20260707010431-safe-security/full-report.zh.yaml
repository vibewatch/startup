      - number: '8.4'
        title: 投资建议
        blocks:
          - type: paragraph
            body: >-
              最终建议是跟踪，不是买入，也不是回避。SAFE 有足够的产品证据、品类领导力和战略野心，值得留在尽调名单；如果业务已经接近 $80 million to $100 million ARR 区间上端，一个假设性的
              $1 billion 价格也并不明显荒唐。不过，公开记录仍过于不透明，不能支撑干净的肯定性买入：第三方私募市场数据指向低得多的估值，公开来源没有显示经审计 ARR
              或当前利润率结构，也没有披露优先股条款，让投资者无法把叙事上行转化为普通股结果。因此，本章为评级上调设置了很高的证据门槛。管理层必须展示可信的 ARR 桥接、强留存、健康毛利率，并证明多模块采用正在
              CRQ、TPRM 和 CTEM 中变现。如果 SAFE
              打出持平轮或下轮，模块附加停滞，或更大平台让网络风险管理看起来只是一个功能而非稀缺记录系统，牛市情景就会失效。在这些问题解决之前，正确姿态是有纪律地监控，而不是强行建立确信。
