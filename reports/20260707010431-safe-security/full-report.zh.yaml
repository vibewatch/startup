      - number: '5.3'
        title: 收购、IP 与差异化技术
        blocks:
          - type: paragraph
            body: >-
              SAFE 最强的产品差异化来自两笔收购与原始平台论点的组合。RiskLens 带来 FAIR 知识产权和从业者可信度，而许多 CRQ 竞争对手仍缺这一块；SAFE 如今用这笔收购把自己描述为不只是与 FAIR
              对齐，而是借 FAIR-CAM 和自动化控制分析在运营上基于 FAIR。Balbix 增加的是另一种深度：AI 原生资产发现、暴露发现、可利用性分析、控制有效性上下文和修复工作流钩子。两笔收购合起来支撑 SAFE
              的主张：它能在一个系统里把技术攻击面证据连到业务损失。CyberAGI 和「风险奇点」背后的核心战略论点也在这里：不是更多仪表盘，而是一张组合图谱，把资产、暴露、控制、供应商、AI
              用例和财务后果放在同一平面衡量。公开证据足以在方向上支持这个论点，尤其是关于 Balbix 的外部报道确认了真实 CTEM 能力。未解决的尽调问题是整合成熟度。多数公开来源仍在描述组合应当变成什么，而不是哪些
              Balbix 来源服务、模式或修复闭环已经并入生产版 SAFE One 体验。
