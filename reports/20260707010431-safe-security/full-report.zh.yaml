companyProfile:
  summary: >
    Safe Security（前身 Lucideus）总部位于加州 Palo Alto，是 Saket Modi、Rahul Tyagi 和 Vidit Baxi 2012 年在 IIT Bombay
    创立的网络安全平台公司。公司最初做渗透测试和网络卫生服务，2010 年代中期转向 SaaS，并在 2021 年更名为 SAFE。如今 SAFE Platform 以智能体 AI 架构，把网络风险量化 (CRQ)、持续威胁暴露管理
    (CTEM)、第三方风险管理 (TPRM) 和 AI 安全态势管理 (AI-SPM) 统一起来。RiskLens（2022）和 Balbix（2025）两笔战略收购，分别补上基于 FAIR 的 CRQ 自动化和 AI
    原生网络资产情报。公司 2025 年 7 月完成 $70 million C 轮，隐含 $1B+ 独角兽估值，并称连续三年收入同比三位数增长。Forrester 在 2025 年 Q2 Wave 中将 SAFE
    评为网络风险量化解决方案领域 Leader，Liminal 按产品能力将其评为 #1 TPRM 平台。已披露客户包括 Google、T-Mobile、Fidelity、Chevron 和 IHG。
