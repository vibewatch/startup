  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台概览与模块
        blocks:
          - type: paragraph
            body: >-
              SAFE 的产品故事已不再只是网络风险量化。公开材料如今把 SAFE One 描述为横跨战略、供应商、战术和 AI 暴露管理的统一运营层。实际看，四个商业模块在同一叙事里承担不同工作。CRQ
              仍是面向董事会的财务引擎：它把遥测、威胁数据、控制证据和情景逻辑转化为量化损失暴露和投资决策。CTEM
              是战术层，负责标准化资产和漏洞数据，按可利用性和业务影响排序，验证控制是否真的能钝化攻击路径，再路由修复。TPRM 把同样的智能体逻辑用于供应商准入、问卷、监控和复评。AI-SPM 把技术栈延伸到 AI 供应商和
              AI 使用，覆盖影子 AI、合同风险、配置漂移和外部视角暴露。SAFE 也仍把 SafeX
              定位为推理层，把这些模块输出转成运营决策。这个宽度有战略价值，因为它让一个预算负责人购买共享数据和工作流平面，而不是一组分散单点工具；但投资判断也取决于这些模块是否真的共享同一运营模型，而不只是顶层品牌伞。
