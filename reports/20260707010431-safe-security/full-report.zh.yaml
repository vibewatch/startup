      - number: '4.2'
        title: 单位经济与基准代理
        blocks:
          - type: paragraph
            body: >-
              SAFE 不披露 ACV、CAC、回本期、NRR、毛利率或 ARR，投资人只能从部署规模、客户成果和上市公司基准中三角测算。客户故事有用，因为它们显示 SAFE 落在大型且运营上重要的环境里：T-Mobile 用
              SAFE 覆盖超过一百万项数字资产，Instacart 三周内把 TPRM 落到 600+ 个第三方上，Kyriba 不到一周迁移 290+ 个供应商，并从按供应商付费转向固定价格。这些信号支持一个混合企业
              ACV，可能远高于商品化安全工具价格。合理的公开估算是，有意义的多模块部署约为每年 $250,000 到 $800,000；仅 TPRM 或试点交易可能低于该区间，宽 CRQ+TPRM+CTEM
              平台交易则可能高于该区间。毛利率和 GTM 基准上，上市网络安全 SaaS 可比公司有帮助但也提醒谨慎：Zscaler 在规模化后 GAAP 毛利率仍约 77%，但其 10-K
              显示数据中心扩张和新增人手会压缩利润率；CrowdStrike 文件显示订阅占比很高，但销售和运营投入也重。这意味着 SAFE 最终可能在毛利率上像健康企业
              SaaS，但仍会因企业销售、伙伴赋能和收购后整合而先吃掉大量 CAC。
