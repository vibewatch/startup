  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与商业化
        blocks:
          - type: paragraph
            body: >-
              SAFE 的公开材料指向平台型企业 SaaS 模式，而不是服务驱动的安全咨询公司。公司持续把 CRQ、TPRM 和 CTEM 描述为一个统一网络风险平台，这意味着先落地后扩张的销售动作：CRQ
              似乎是历史楔子，服务董事会、监管和保险视角下的网络风险决策；TPRM 是第一个明确披露的扩张模块；CTEM 则是叠加在同一控制平面上的最新附加产品。这个顺序对财务很重要。SAFE 2024 年推出
              TPRM，一周内就有 100+ 客户上线；到 2025 年 7 月 C 轮公告时，管理层称超过半数客户已经采用该模块。这让 TPRM 成为钱包份额扩张最强的公开信号，而 CTEM 更像 2025-2026
              年的加售向量，不像已经成熟的收入底座。公开定价刻意很薄，但现有线索都像企业级交易：SAFE 宣传为替换既有 TPRM 供应商提供 50% 合同买断、无供应商数量上限、AWS Marketplace
              私有报价，以及案例研究中的固定价格。合起来看，这些线索支持一种谈判式年度订阅模式，定价更可能按模块和范围出售，而不是简单按席位计费。
