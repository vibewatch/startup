  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值论点与框架
        blocks:
          - type: paragraph
            body: >-
              SAFE 的估值论点始于真实运营故事，而不是投影片幻想。公司公开披露了 $70 million Series C、总融资超过 $170 million、三位数增长主张，以及从 CRQ 扩展到 TPRM 和
              CTEM 后模块采用扩大。Forrester 的 2025 年 Q2 CRQ 领导者判断和 SAFE 的 Liminal 定位，有助于支撑其相对增长更慢、范围更窄的网络安全厂商获得溢价。问题不在 SAFE
              是否有野心或产品广度；问题在于，公开证据没有披露经审计 ARR、毛利率、NRR，或当前股权结构表和优先权堆栈。这迫使估值只能靠推断。本章把一个假设性的 $1 billion
              入场价视为承销场景，而不是已确认的公开估值。在这个基础上，关键问题变成：SAFE 是否已经接近 $80 million to $100 million ARR，公司是否应获得 10x to 14x
              前瞻倍数。没有这些答案，正确视角是价格纪律，而不是单纯赞叹品类领导地位。
