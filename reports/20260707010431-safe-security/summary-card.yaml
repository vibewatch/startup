  topStrengths:
    - 'Forrester Wave Leader Q2 2025 in CRQ and Liminal #1 in TPRM — independent analyst validation of market leadership.'
    - >-
      Unified CRQ + CTEM + TPRM + AI-SPM platform eliminates point-solution sprawl and creates cross-sell expansion
      leverage.
    - >-
      Strategic acquisitions of RiskLens (FAIR CRQ) and Balbix (AI-native CAASM) built defensible IP moat faster than
      organic R&D.
    - >-
      Fortune 500 customer base (claimed 10%) with named logos including Google, T-Mobile, Fidelity, and Chevron
      demonstrates enterprise credibility.
    - >-
      Triple-digit YoY revenue growth for three consecutive years, and 50%+ TPRM module adoption among existing CRQ
      customers.
  topRisks:
    - >-
      Financial opacity: ARR, gross margin, NRR, and burn rate remain undisclosed, making the $1B valuation impossible
      to benchmark rigorously.
    - >-
      Competitive displacement: CrowdStrike, Palo Alto Networks, and Tenable are adding CTEM and risk quantification
      capabilities to existing installed bases.
    - >-
      Key-person concentration: Saket Modi is the primary external face, investor relationship holder, and strategic
      narrator.
    - >-
      Acquisition integration risk: digesting both RiskLens and Balbix simultaneously introduces technical-debt and
      cultural complexity.
    - >-
      India-origin data governance exposure: customer security posture data handled across India operations creates
      data-sovereignty and regulatory compliance risk.
  unresolvedGaps:
    - >-
      Audited ARR, gross margin, NRR, and CAC/LTV ratios — essential to validate the $1B+ valuation and growth
      sustainability.
    - Precise headcount and geographic breakdown — LinkedIn signals 51–200, inconsistent with Fortune 500 scale.
    - >-
      Cap table, secondary pricing, and preferred economics — necessary to assess effective dilution and downside
      protection.
    - Retention cohort data — TPRM 50% cross-sell is company-claimed; independent churn or NRR evidence is unavailable.
    - Balbix acquisition price and integration timeline — undisclosed; material to understanding capital efficiency.
