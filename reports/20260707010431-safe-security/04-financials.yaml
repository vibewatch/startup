  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: arr-disclosure
    missingEvidence: Current ARR, GAAP revenue, billings, and deferred revenue by module and segment.
    whyItMatters: Without module-level revenue and billings, public estimates cannot distinguish true recurring software quality from narrative-driven growth claims.
    diligencePath: Request monthly ARR and billings bridge by CRQ, TPRM, CTEM, services, segment, and geography from finance.
    relatedQuestionRefs:
    - QI006
    - QI023
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: margin-disclosure
    missingEvidence: Gross margin bridge showing hosting, support, services, and any data-cost pass-through by product line.
    whyItMatters: Gross margin is the key variable separating strong software economics from a more services- or infrastructure-heavy operating model.
    diligencePath: Request GAAP and contribution-margin reporting by module plus cloud, support, and implementation cost buckets.
    relatedQuestionRefs:
    - QI012
    - QI017
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Latest cash balance, monthly burn, capex commitments, and any debt, covenant, or earn-out obligations.
    whyItMatters: Series C adequacy and next-round timing cannot be underwritten from funding headlines alone.
    diligencePath: Request CFO cash-runway model with actual monthly cash flow, committed spend, and downside scenario analysis.
    relatedQuestionRefs:
    - QI021
    - QI022
    - QI026
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: acquisition-economics
    missingEvidence: RiskLens and Balbix consideration, integration budget, retention packages, and synergy tracking.
    whyItMatters: Acquisition ROI can materially change capital needs, margin timing, and the credibility of the CTEM expansion story.
    diligencePath: Request purchase agreements, integration scorecards, synergy assumptions, and actual-versus-plan integration spend.
    relatedQuestionRefs:
    - QI020
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Median ACV, discount ladders, contract term, and renewal/upsell data for CRQ, TPRM, and CTEM.
    whyItMatters: Public flat-pricing references and procurement clues do not reveal whether SAFE monetizes like premium enterprise software or through heavy discounting.
    diligencePath: Request top-customer contracts, pricing policy, quote-to-book data, and renewal history by module.
    relatedQuestionRefs:
    - QI002
    - QI015
    - QI023
    relatedTableRefs:
    - TI002
    - TI005
  - type: missing-source
    severity: material
    topic: headcount-functional-mix
    missingEvidence: Current employee count and functional split across engineering, sales, customer success, and G&A.
    whyItMatters: Headcount mix is needed to convert revenue and burn scenarios into real productivity and CAC assumptions.
    diligencePath: Request HR roster by function and geography plus hiring plan and attrition statistics.
    relatedQuestionRefs:
    - QI021
    - QI023
    relatedTableRefs:
    - TI003
    - TI005
