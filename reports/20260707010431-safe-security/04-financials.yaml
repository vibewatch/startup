- id: capital-history-and-adequacy
  title: Capital history and adequacy
  body: 'Capital adequacy looks acceptable in the near term but still opaque in the ways that matter for underwriting. SAFE''s retained public sources support a financing arc from a $50 million Series B to a $70 million Series C and more than $170 million raised overall, with older SEC Form D records confirming that the company had been tapping private capital long before the current branding cycle. The July 2025 Series C narrative is expansionary rather than defensive: the proceeds were framed around engineering, go-to-market, R&D, and the CyberAGI roadmap, not around restructuring or balance-sheet repair. That is directionally positive. But the same file leaves key adequacy questions unanswered. SAFE does not disclose current cash on hand, monthly burn, or any debt schedule. It also does not disclose what RiskLens or Balbix cost, what integration spend has already been incurred, or how much additional product and GTM investment the Balbix combination requires to monetize CTEM at scale.
    On a low-confidence public estimate, a company of this profile could plausibly be burning roughly $25-$45 million per year, which would imply roughly 18-30 months of runway for the Series C proceeds before considering any remaining prior-round cash. That is enough to keep building, but not enough transparency to underwrite next-round timing precisely.'
