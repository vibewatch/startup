- id: unit-economics-and-benchmark-proxies
  title: Unit economics and benchmark proxies
  body: 'SAFE does not publish ACV, CAC, payback, NRR, gross margin, or ARR, so the investor has to triangulate from deployment scale, customer outcomes, and public-company benchmarks. The customer stories are useful because they show SAFE landing in large, operationally important environments: T-Mobile used SAFE across more than one million digital assets, Instacart operationalized TPRM across 600+ third parties in three weeks, and Kyriba migrated 290+ vendors in under a week while moving from pay-per-vendor economics to flat pricing. Those signals support a blended enterprise ACV that is probably well above commodity security-tool pricing. A reasonable public estimate is roughly $250,000 to $800,000 per year for meaningful multi-module deployments, with TPRM-only or pilot deals likely below that range and broad CRQ+TPRM+CTEM platform deals above it. For margin and go-to-market benchmarks, public cyber SaaS comps are helpful but cautionary: Zscaler still posted ~77% GAAP gross margin at
    scale, but its 10-K shows that data-center expansion and added headcount can compress margins; CrowdStrike''s filing shows a very high-subscription mix but also heavy sales and operating investment. That suggests SAFE could ultimately look like healthy enterprise SaaS on gross margin, yet still absorb significant CAC upfront through enterprise selling, partner enablement, and post-acquisition integration.'
