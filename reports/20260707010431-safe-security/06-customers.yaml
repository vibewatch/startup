figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: SAFE’s public journey usually starts with a CISO or TPRM leader trying to replace subjective cyber-risk workflows, then expands into board reporting and adjacent modules once the platform is embedded.
  data:
    nodes:
    - id: trigger
      label: Risk communication pain
      detail: A security or risk leader needs to move beyond red-amber-green scoring and justify priorities in business terms.
    - id: evaluation
      label: Data and model evaluation
      detail: SAFE is tested for integrations, FAIR-style quantification, and the ability to combine controls, exposure, and vendor data.
    - id: initial-land
      label: Initial land
      detail: The first live workflow is usually CRQ, control reporting, or a focused TPRM motion tied to a painful manual process.
    - id: operational-embed
      label: Operational embed
      detail: Teams use SAFE for prioritization, board reporting, budget planning, and defensible remediation sequencing.
    - id: expansion
      label: Expansion loop
      detail: Customers add TPRM, insurance optimization, broader vendor coverage, or additional risk scenarios after the first win.
    - id: durability-test
      label: Durability test
      detail: Renewal quality likely benefits from integrations and governance embedding, but public NRR, churn, and term data are missing.
  approximationNotes: Journey stages are inferred from customer stories and review surfaces rather than a published SAFE sales-process diagram.
  claimRefs:
  - CU003
  - CU004
  - CU009
  - CU011
  - CU036
  - CU037
