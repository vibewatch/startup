  evidenceGaps:
  - type: missing-source
    severity: material
    topic: named-customer-proof-gap
    missingEvidence: Customer-authored or third-party deployment detail for Google, Fidelity, and Chevron, including the specific SAFE module used and the current production scope.
    whyItMatters: Name-level logo proof is materially weaker than a live case study when judging adoption depth and reference quality.
    diligencePath: Request direct customer references or redacted deployment summaries for Google, Fidelity, and Chevron, and ask management to map each to CRQ, CTEM, TPRM, or multi-module use.
    relatedQuestionRefs:
    - QU015
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, contract duration, and cohort renewal data by segment or product.
    whyItMatters: Without durability metrics, public case studies cannot show whether expansion is broad-based or driven by a small set of surviving accounts.
    diligencePath: Obtain cohort tables, renewal schedules, churn reasons, and standard contract terms under NDA.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue concentration, geographic ARR mix, and the number of customers above material ACV thresholds.
    whyItMatters: High-value enterprise customers can create outsized downside if the base is not diversified enough by geography or segment.
    diligencePath: Request top-10 customer share, revenue by region, and vertical mix from management or board materials.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table
    missingEvidence: A complete public mapping of every logo shown by SAFE to a specific module, use case, and proof depth.
    whyItMatters: The visible logo wall is broader than the set of customers with deep public deployment narratives, which can distort how representative the flagship stories are.
    diligencePath: Build a full customer-proof matrix from internal references, public customer pages, and reference calls, then compare depth by cohort.
    relatedQuestionRefs:
    - QU016
    - QU026
    relatedTableRefs:
    - TU003
  - type: access-blocked
    severity: minor
    topic: review-surface-depth
    missingEvidence: Open access to richer G2 or LinkedIn customer-review detail that would supplement Gartner, TrustRadius, and FeaturedCustomers.
    whyItMatters: Independent review surfaces help validate satisfaction, implementation quality, and buyer trade-offs beyond company-curated case studies.
    diligencePath: Collect exported review-site reports or conduct reference calls if public review pages remain blocked or too shallow.
    relatedQuestionRefs:
    - QU020
    - QU025
