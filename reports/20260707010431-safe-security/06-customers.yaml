- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Risk type
  - Level
  - Evidence
  - Why it matters
  - Mitigation / diligence path
  rows:
  - - Large-enterprise customer concentration
    - High
    - 10% Fortune 500 claim plus Google, Fidelity, T-Mobile, Chevron, and IHG name-level proof
    - A few very large customers could dominate ARR even if logo count looks healthy
    - Request top-10 customer revenue share, customers above key ARR thresholds, and renewal calendar
  - - Proof-depth concentration
    - Medium-high
    - Deep quantified stories are concentrated in T-Mobile, Instacart, Kyriba, Carvana, Aboitiz, and OBHG
    - Flagship references can overstate average deployment depth if the long tail is shallower
    - Run broader reference calls and ask for anonymized win-loss / deployment-depth distribution
  - - North America skew in public references
    - Medium
    - Most deep stories are U.S.-centric, with IHG, Glovo, and Aboitiz as the main non-U.S. counterweights
    - Regional concentration can amplify macro or execution risk in one geography
    - Request ARR and customer counts by region plus international pipeline conversion
  - - Retention opacity
    - High
    - No public NRR, GRR, logo churn, or contract-length disclosure was found
    - Without cohort durability, it is hard to underwrite customer quality
    - Obtain cohort tables, churn reasons, and contract schedules under NDA
  - - Procurement friction in TPRM and partner-led channels
    - Medium
    - Gartner describes TPRM as multi-function and SAFE’s AWS page emphasizes private offers and co-sell support
    - Complex, multi-stakeholder deals can lengthen cycle times and increase implementation work
    - Request median sales-cycle length, pilot-to-production conversion, and channel-vs-direct mix
  - - New-module mix risk
    - Medium
    - TPRM ramp is fast, but the module only launched in 2024 and is being sold partly through expansion
    - Early hyper-growth can mask immature renewal behavior in the newest product line
    - Request first-cohort TPRM renewals, upsell timing, and services content
  notes: This table mixes upside and risk because SAFE’s public customer file is strongest on why customers buy and weakest on how diversified and durable the base is over time.
