chapter:
  number: 6
  title: Customers
  summary: SAFE’s public customer file supports a real large-enterprise adoption story, especially for T-Mobile, Instacart, Kyriba, Carvana, Aboitiz Power, OB Hospitalist Group, and IHG. The strongest signals are Fortune 500 penetration, fast TPRM cross-sell, and quantified customer outcomes; the weakest remain classic durability disclosures such as NRR, churn, contract length, and top-customer concentration.
sections:
- id: customer-segmentation-and-profile
  title: Customer Segmentation and Profile
  body: SAFE’s public customer evidence points to a large-enterprise and upper-enterprise customer base rather than a broad SMB or self-serve motion. The homepage claims SAFE is used by 10% of the Fortune 500, while the customer library highlights telecom, financial services, healthcare, insurance, retail, utilities, consulting, and hospitality names. The buyer in these stories is usually a CISO, cyber-risk leader, GRC owner, or TPRM leader looking for board-grade risk communication, budget justification, or defensible prioritization. The day-to-day users are security, risk, and vendor-management teams; the payer is typically the enterprise security, compliance, or risk budget owner. Public use cases cluster around CRQ, executive reporting, and increasingly TPRM automation, with repeated emphasis on financial language and business impact rather than technical telemetry alone. That mix suggests higher implied ACVs and deeper workflow embedding, but it also implies longer enterprise sales
    cycles and more concentration risk if a relatively small number of very large customers account for a disproportionate share of revenue.
  claimRefs:
