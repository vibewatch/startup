- id: adoption-trajectory
  title: Adoption Trajectory
  body: 'SAFE does not publish a precise active-customer count in the retrieved public materials, but it does disclose multiple adoption signals that together point to meaningful traction. The strongest are the claim that 10% of the Fortune 500 use SAFE, the April 2025 disclosure that SAFE reached $10 million of TPRM ARR in less than a year, and the July 2025 disclosure that more than half of customers adopted TPRM after launch. The company also says it is trusted by hundreds of global organizations and has delivered triple-digit growth for three consecutive years. The customer-story archive adds a useful freshness signal: 13 public stories are currently listed, and six were added between January and May 2026 alone. That cadence, combined with 100+ integrations and 3 billion daily signals processed, supports the view that SAFE is winning real production deployments and then expanding the visible reference set. What remains missing is the denominator: how many active accounts exist today,
    how many are paying versus pilot, and how many of the named stories represent net-new logos versus deeper wallet share inside existing customers.'
  claimRefs:
  - CU006
  - CU008
  - CU028
  - CU029
  - CU030
  - CU031
  - CU032
  - CU033
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: retention-and-expansion
  title: Retention and Expansion
  body: 'Public evidence supports expansion more clearly than it supports classic SaaS retention metrics. Instacart is the cleanest cross-sell example because it was already using SAFE for CRQ before partnering on TPRM. Kyriba shows another expansion pattern: SAFE’s autonomous TPRM module replaced a pay-per-vendor model with flat-price coverage of the whole vendor ecosystem, while still driving automation and prioritization gains. SAFE’s July 2025 funding announcement adds the strongest company-wide proxy by saying more than 50% of customers adopted TPRM after launch. Customer stories also repeat a durable value proposition around board reporting, budget allocation, cyber-insurance negotiations, and business-case framing—use cases that usually become sticky once embedded into governance routines. Independent review surfaces are directionally supportive, with Gartner showing 99 reviews and a 4.5 average rating and FeaturedCustomers showing a 4.8/5 reference score. The major caveat is that
    none of the reviewed sources disclose NRR, GRR, logo churn, renewal rates, or contract duration, so public evidence proves expansion and satisfaction proxies better than it proves renewal quality.'
  claimRefs:
  - CU011
  - CU015
  - CU018
  - CU030
  - CU031
  - CU034
  - CU035
  - CU036
  - CU037
  - CU038
