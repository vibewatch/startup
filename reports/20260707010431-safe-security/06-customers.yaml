- id: named-customer-proof
  title: Named Customer Proof
  body: 'SAFE’s named-customer proof is real, but it is not equally deep across the roster. T-Mobile is the strongest marquee proof in the reviewed corpus: SAFE’s story describes more than one million monitored digital assets, automated risk quantification, and a 75% reduction in reporting time. IHG also has meaningful use-case detail through SAFE’s community spotlight, which describes moving from qualitative risk scoring toward quantified high-value-asset risk communication and budget allocation. Instacart and Kyriba add high-quality TPRM proof, with quantified onboarding, automation, and ecosystem-coverage outcomes. By contrast, Google, Fidelity, and Chevron were retrieved only as named customers in SAFE’s July 2025 funding materials and a matching independent news recap; no module-specific deployment page, customer-authored story, or quantified outcome was retrieved for them in this run. The right diligence interpretation is that SAFE has believable marquee-logo breadth, but public proof
    depth is still concentrated in a smaller set of flagship stories.'
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU015
  - CU016
  - CU025
  - CU026
  - CU027
  - CU041
