  topStrengths:
    - 2025 年 Q2 Forrester Wave CRQ 领导者、Liminal TPRM 第 1 名——独立分析机构验证其市场领先地位。
    - 统一的 CRQ + CTEM + TPRM + AI-SPM 平台压掉点状工具蔓延，也撬动交叉销售扩张。
    - 收购 RiskLens（FAIR CRQ）和 Balbix（AI-native CAASM）让公司比纯自研更快筑起可防守的 IP 护城河。
    - 公司称覆盖 10% 的 Fortune 500 客户，公开 logo 包括 Google、T-Mobile、Fidelity、Chevron，企业级可信度得到验证。
    - 连续三年收入同比三位数增长，现有 CRQ 客户中超过 50% 采用 TPRM 模块。
  topRisks:
    - 财务不透明：ARR、毛利率、NRR 和烧钱速度均未披露，$1B 估值很难严谨对标。
    - 被大平台挤压：CrowdStrike、Palo Alto Networks、Tenable 正把 CTEM 和风险量化能力加进既有装机基础。
    - 关键人集中：Saket Modi 既是主要外部脸面，也抓着投资人关系和战略叙事。
    - 收购整合风险：RiskLens 和 Balbix 同时消化，技术债和文化复杂度都会上升。
    - 印度来源的数据治理暴露：客户安全态势数据跨印度运营处理，带来数据主权和合规风险。
  unresolvedGaps:
    - 经审计 ARR、毛利率、NRR 和 CAC/LTV 比率——验证 $1B+ 估值和增长可持续性必不可少。
    - 准确员工数和地域拆分——LinkedIn 显示 51–200 人，与 Fortune 500 规模不一致。
    - 股权结构表、老股定价和优先股条款——评估实际稀释和下行保护必须要有。
    - 留存队列数据——TPRM 50% 交叉销售为公司口径；缺少独立流失率或 NRR 证据。
    - Balbix 收购价格和整合时间线——尚未披露，是理解资本效率的重要变量。
