- id: operational-and-security-risks
  title: Operational and security risks
  body: 'The hardest operational risk to underwrite is the sensitivity of the data Safe touches. A breach of Safe would not look like an ordinary SaaS incident, because the platform is designed to aggregate vulnerability, exposure, cloud, identity, AI, and third-party risk signals into one decision surface. Safe publicly discloses region choice, TLS 1.2, AES-256 with AWS KMS, and SOC 3 coverage, which are meaningful mitigants, but they do not erase the consequence of compromise. Independent sector evidence matters here: Tenable and Qualys still suffered customer-data exposure in the Salesloft Drift OAuth campaign, and the larger Salesforce supply-chain incident reached more than 700 organizations while exposing embedded credentials. Safe’s own AI policy also introduces a subtler risk surface. The company says prompts may be retained for operational reasons, model routing is dynamic, and customers cannot select individual providers. Those are manageable practices only if the supporting DPA,
    subprocessor, logging, and validation layers are as strong as the policy language implies. Public proof of those deeper layers remains thin, so the residual view on platform security and data-handling failure remains high.'
