tables:
- id: TR001
  title: Regulatory / legal risk register
  layout: wide
  columns:
  - Risk / issue
  - Jurisdiction / surface
  - Severity
  - Likelihood
  - Current status
  - Mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - SEC-disclosure dependence on Safe outputs
    - U.S. public-company customers / SEC
    - High
    - Medium-High
    - Item 1.05 and Item 106 are active, making cyber materiality and governance workflows disclosure-sensitive
    - Explainable workflows, audit trails, and customer-side review before external use
    - High — a wrong or delayed risk signal can still become part of a regulated disclosure chain
    - Request customer use cases, model-governance controls for disclosure workflows, and any indemnity carve-outs for board or SEC-facing use
  - - GDPR and SCC compliance for cross-border processing
    - EU and UK customer data transfers
    - High
    - Medium
    - Safe discloses multi-country processing and EU SCCs remain the standard transfer mechanism
    - Region selection, processor posture, SCC annexes, and contractual controls
    - Medium-High — no public DPA or subprocessor list is available to verify the paper trail
    - Obtain the standard DPA, SCC modules, subprocessors, and regional data-flow map
  - - India DPDP security and breach-notification exposure
    - India operations and India-linked personal-data processing
    - High
    - Medium
    - DPDP Rules 2025 introduce material penalties and breach-notification duties for data fiduciaries
    - Local compliance ownership, security controls, and rapid breach-notification playbooks
    - Medium-High — India engineering concentration raises execution relevance if Indian data or staff systems are affected
    - Request India entity governance, DPDP compliance controls, and any significant-data-fiduciary assessment
  - - Export-control and sanctions obligations
    - EAR / ITAR / OFAC contractual surface
    - Moderate-High
    - Low-Medium
    - Customer terms explicitly recognize export and sanctions restrictions
    - Restricted-market blocking, access controls, and legal review for global deployments
    - Medium — public language acknowledges the risk, but operating procedures are not public
    - Review export-control policy, restricted-party screening, and developer access controls for regulated features
  - - Contractual remedy asymmetry and legal-opacity risk
    - Customer contracts, incident remedies, and competitive disputes
    - Moderate-High
    - Medium
    - Warranty and remedy language are narrow and only one resolved public dispute is visible
    - Insurance, negotiated enterprise paper, and bespoke security exhibits
    - High — private contract carve-outs, claims inventory, and insurance limits are not visible
    - Request standard MSA redlines, current litigation schedule, insurance tower, and any unresolved legal notices
  notes: Rows rank the most supportable legal and regulatory exposures from public disclosures; private DPA, insurance, and claims schedules remain unavailable.
  enumerationScope:
    coverage: partial
    basis: Covers the highest-severity public legal and regulatory surfaces visible in Safe’s retained sources as of 2026-07-07; it does not claim to enumerate every customer contract clause, data-flow scenario, or jurisdictional issue.
