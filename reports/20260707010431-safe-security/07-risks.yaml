- id: kill-criteria-and-monitoring
  title: Kill criteria and monitoring
  body: 'Safe is not unmitigated. The company has real security disclosures, public assurance coverage, strong access to capital, and a credible strategic explanation for why Balbix and RiskLens matter. But a prudent investor should treat the current file as a proof-of-possibility case rather than a proof-of-control case. The immediate thesis-break triggers are observable. A meaningful security incident at Safe itself, evidence that major customers cannot rely on Safe outputs for disclosure-sensitive or board-sensitive use cases, visible churn or migration pain in Balbix and RiskLens cohorts, or senior departures across the founder and acquisition leadership bench would all materially change the underwriting case. The larger issue is what the public record still does not show: a public DPA or subprocessor list, benchmarked model-accuracy evidence, acquisition economics, and hard integration milestones. Those gaps are not cosmetic. They are the difference between believing the company has
    built a defensible control plane for cyber-risk decisions and merely believing it has marketed one. Until those gaps close, monitoring needs to be explicit and unforgiving.'
