- id: TR005
  title: Mitigation and kill criteria table
  layout: wide
  columns:
  - Risk
  - Current mitigation
  - Kill criterion
  - Monitoring signal
  rows:
  - - Platform-data breach or material customer-data exposure
    - Encryption, tenant isolation, SOC 3, and AWS-native controls are public
    - Any confirmed incident exposing vulnerability, exposure, or embedded-credential data at scale
    - Incident disclosures, customer notices, support-case spikes, or emergency region/key rotations
  - - Model or score reliability failure in disclosure-sensitive workflows
    - SAFE AURA, human oversight, and no-training claims
    - Evidence that major customers cannot trust Safe outputs for board, disclosure, or prioritization use cases
    - Benchmark requests, override rates, customer escalations, or withdrawn deployment claims
  - - Balbix or RiskLens integration drag
    - Named leaders, one-platform narrative, and acquisition rationale
    - Missed migration milestones, customer confusion, or churn in acquired cohorts for more than two quarters
    - Roadmap slips, SKU proliferation, support backlog, or downgrade language in customer references
  - - Regulatory and contracting fragility
    - Region choice, processor framing, SCC compatibility, and export clauses
    - Inability to provide DPA, subprocessor transparency, or breach-notification commitments acceptable to regulated buyers
    - Security questionnaire slippage, legal redlines, or regional deal delays tied to privacy terms
  - - Talent and leadership deterioration
    - Fresh capital and mission-driven recruiting narrative
    - Departure of Saket Modi, Gaurav Banga, or a cluster of AI / risk-engine leaders without clear succession
    - Executive turnover, extended senior-hiring gaps, or rising attrition and negative employee-review trend
  - - Capital opacity or acquisition overhang
    - Recent Series C and claimed triple-digit growth
    - Down-round, distressed debt, or acquisition-write-down signals before Balbix integration value is evident
    - Fundraising rumor cycle, unusual covenant requests, or delayed integration hires and product commitments
  notes: Kill criteria are intentionally concrete and monitorable because the main remaining gaps are in private evidence, not in awareness of the risk categories.
