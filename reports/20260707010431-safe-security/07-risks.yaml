  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-opacity
    missingEvidence: Board-approved budget, burn, runway, debt covenants, current valuation, and any Balbix or RiskLens consideration structure.
    whyItMatters: Without capital-structure detail, investors cannot separate healthy growth investment from acquisition-driven cash strain or hidden preference overhang.
    diligencePath: Request the latest board package, cap table, debt schedule, and the Balbix and RiskLens purchase agreements or summary economics.
    relatedQuestionRefs:
    - QR019
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: material
    topic: customer-contracting
    missingEvidence: Public DPA, subprocessor list, breach-notification SLA, and regional data-flow diagram for SAFE AI and core platform services.
    whyItMatters: These documents determine whether Safe’s marketing claims translate into contractable GDPR, DPDP, and enterprise-security obligations.
    diligencePath: Request the standard DPA, current subprocessor register, SCC annexes, and sample customer security exhibit used in regulated enterprise deals.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR001
    - TR005
  - type: private-evidence-only
    severity: material
    topic: model-quality
    missingEvidence: False-positive rates, score-calibration studies, customer back-testing, and benchmark evidence for CRQ, CTEM, and SAFE AURA trust metrics.
    whyItMatters: The chapter can document governance promises, but it cannot verify that Safe’s risk outputs are accurate enough for board reporting or regulatory-sensitive workflows.
    diligencePath: Ask for validation studies, benchmark decks, pilot retrospectives, and any model-governance committee materials covering score drift or customer overrides.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: material
    topic: integration-milestones
    missingEvidence: Post-close integration roadmap, product-retirement plan, customer migration milestones, and churn or expansion metrics for Balbix and RiskLens accounts.
    whyItMatters: The main technical and commercial risk is integration drag, but public sources do not show whether cross-sell, migration, or platform unification is actually on track.
    diligencePath: Request the post-merger integration dashboard, roadmap by quarter, customer-support transition plan, and any churn or NRR segmentation for acquired cohorts.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR002
    - TR003
    - TR005
