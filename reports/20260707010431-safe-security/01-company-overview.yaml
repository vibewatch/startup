callouts:
- calloutType: strength
  title: Platform breadth now extends beyond CRQ into adjacent control planes
  body: SAFE no longer reads like a single-purpose CRQ vendor. By mid-2026, retained sources show a unified platform spanning CRQ, TPRM, CTEM, and AI-SPM, reinforced by the RiskLens and Balbix acquisitions plus Cisco AI Defense integration. That breadth matters because it improves cross-sell potential and makes SAFE more relevant to both security operators and business-risk owners.
  claimRefs:
  - CO004
  - CO019
  - CO020
  - CO027
  - CO028
  - CO029
  - CO030
- calloutType: risk
  title: Disclosure depth lags product and financing ambition
  body: SAFE's story is strong on momentum but weaker on governance and hard metrics. Retained sources do not support a priced valuation, exact revenue run-rate, debt profile, or full board roster, and even headcount is best treated as a proxy from LinkedIn rather than a management-certified number. The 2025 SecurityScorecard dispute also shows that competitive friction can escalate into litigation, even if the case was later resolved.
  claimRefs:
  - CO012
  - CO025
  - CO035
  - CO037
  - CO038
