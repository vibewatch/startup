- id: founders-and-leadership
  title: Founders, leadership, and governance visibility
  body: 'Founder identity is one of the better-corroborated parts of the SAFE story. Independent reporting, the CEO''s own Forbes profile, and investor materials all point to Saket Modi, Rahul Tyagi, and Vidit Baxi as the founding trio, with Saket Modi still serving as the clearly dominant external face of the company as co-founder and CEO. Craft''s company profile also identifies Vidit Baxi as co-founder and CISO, Rahul Tyagi as co-founder, and Saket Bajoria as Chief Product Officer. Leadership expansion has also come through acquisitions: after the 2023 RiskLens deal, former RiskLens CEO Nick Sanna joined SAFE as President and Jack Jones became Chief Research Scientist, and after the 2025 Balbix acquisition, founder Gaurav Banga joined as President of CTEM. The main governance caveat is disclosure depth. Public materials reviewed for this chapter identify investors, strategic backers, and operating executives, but they do not publish a complete board roster, committee structure, or explicit
    succession plan. That leaves meaningful key-person dependence around Saket Modi and incomplete visibility into board oversight, even though the company now has a late-stage investor set and multiple acquired business lines to integrate.'
  claimRefs:
