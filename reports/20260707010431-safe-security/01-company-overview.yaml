- id: funding-history-and-investors
  title: Funding history, investors, and scale signals
  body: 'SAFE''s funding chronology is directionally clear even though the cap table and valuation are not. Lucideus disclosed angel funding in 2016 and a broader angel syndicate round in 2017 while describing itself as bootstrapped for its first four years and still primarily India-based. The modern institutional chronology comes from SAFE''s own timeline and later financing announcements: the company says it secured a $33 million Series A led by British Telecom and John Chambers in 2021, then a $50 million Series B led by Sorenson Capital in April 2023 with Eight Roads, Telstra Ventures, and WTI, taking disclosed funding above $100 million. The biggest round came on July 31, 2025, when SAFE announced a $70 million Series C led by Avataar Ventures with Susquehanna Asia Venture Capital, NextEquity Partners, Prosperity7 Ventures, and existing investors including Eight Roads, John Chambers, and Sorenson Capital; both company and press-release coverage say total funding then exceeded $170 million.
    What is not supportable from retained official and independent reporting is a priced post-money valuation, debt stack, secondary volume, or precise ownership/control rights. For underwriting, total raised and investor quality are reusable facts; valuation and capitalization structure remain diligence requests, not chapter ground truth.'
