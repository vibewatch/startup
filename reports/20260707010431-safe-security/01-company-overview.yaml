  evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee structure, and explicit governance rights for major investors.
    whyItMatters: Late-stage financing and acquisition integration increase key-person and oversight risk, and later valuation or underwriting work needs clearer governance visibility.
    diligencePath: Request the latest board deck, board roster, committee charters, and investor-rights summary from the company or lead investors.
    relatedQuestionRefs:
    - QO008
    - QO015
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: A priced post-money valuation, any recent secondary marks, and current capitalization-table ownership percentages.
    whyItMatters: Valuation stance cannot be underwritten from round size alone, especially for a late-stage private software company expanding through acquisitions.
    diligencePath: Request the Series C term sheet, latest 409A or board valuation materials, and a current cap-table export.
    relatedQuestionRefs:
    - QO016
    - QO025
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Current ARR or revenue run-rate, gross margin, retention, and customer-count definitions.
    whyItMatters: Growth-rate claims are directionally useful, but later financial and valuation chapters need absolute operating metrics and metric definitions.
    diligencePath: Request monthly management accounts, investor updates, and cohort or retention reporting used in the Series C process.
    relatedQuestionRefs:
    - QO018
    - QO019
    - QO025
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A management-certified global full-time employee count by function and geography.
    whyItMatters: LinkedIn offers only a directional size bucket, which is not enough to gauge post-acquisition integration capacity or operating leverage.
    diligencePath: Ask the company for current employee census data, open headcount plan, and post-acquisition integration staffing by business line.
    relatedQuestionRefs:
    - QO020
    - QO025
    relatedTableRefs:
    - TO001
    - TO002
  - type: missing-source
    severity: material
    topic: capital-structure
    missingEvidence: Any debt facilities, venture credit, secondaries, liquidation preferences, or acquisition earn-out terms.
    whyItMatters: Round announcements name investors and totals, but downside protection, leverage, and contingent obligations can materially change risk and return.
    diligencePath: Request financing schedules, debt agreements, secondary transaction history, and acquisition agreements for RiskLens and Balbix.
    relatedQuestionRefs:
    - QO014
    - QO015
    - QO017
    - QO025
    relatedTableRefs:
    - TO003
    - TO004
