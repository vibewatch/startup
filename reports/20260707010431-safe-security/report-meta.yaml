      claimRefs: [CO008]
  foundingLocation: "Mumbai (IIT Bombay), India"
  headquarters: "Palo Alto, California, USA"
  productSummary: >
    The SAFE Platform delivers four integrated modules: CRQ (SAFE CRQ Engine using
    FAIR methodology to quantify breach risk in financial terms), CTEM (the claimed
    world's first fully autonomous CTEM solution powered by 50+ AI agent nodes and
    100+ workflow templates), TPRM (autonomous third-party risk assessment for vendor
    ecosystems), and AI-SPM (AI Security Posture Management for AI workload risk).
    Balbix's CAASM capabilities anchor the asset intelligence layer; RiskLens IP
    underpins the FAIR quantification engine.
  customerFocus: >
    Fortune 500 enterprises, with emphasis on financial services, telecom, energy,
    healthcare, and technology verticals. Primary buyers are CISOs, CROs, and cyber
    risk or TPRM program leaders.
  businessModel: >
    SaaS subscription with enterprise licensing; pricing is not publicly disclosed
    but industry proxies indicate six-figure to seven-figure annual contract values
    for Fortune 500 accounts. Revenue model spans CRQ, TPRM, and CTEM module tiers,
    with cross-sell driving net expansion.
  stage: Series C
  fundingStatus: >
    $70M Series C closed July 31, 2025, led by Avataar Ventures with Susquehanna
    Asia Venture Capital, NextEquity Partners, Prosperity7 Ventures, Eight Roads
    (Fidelity), John Chambers, and Sorenson Capital. Total disclosed funding exceeds
    $170M across seed, Series A ($33M, British Telecom + John Chambers), Series B
    ($50M, Sorenson Capital + Eight Roads + Telstra + WTI), and Series C.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO004, CO006, CO007, CO008, CO009, CO019, CO021]
