company:
  name: Safe Security
chapter:
  number: 8
  title: Valuation
  summary: 'SAFE screens as a real category leader with credible product breadth across CRQ, TPRM, and CTEM, but the valuation case is materially weaker than the product narrative because public evidence still does not disclose audited ARR, retention, margins, or current preferred terms. Public and private cybersecurity comps support a premium to slower-growth names, yet adverse private-market signals and down-round dynamics keep the price case from reaching a clean buy. Recommendation: Track with medium confidence and high risk; a hypothetical $1B entry is fair only if SAFE can substantiate roughly $80M+ ARR, durable triple-digit growth, and healthy unit economics.'
sections:
- id: valuation-thesis-and-framework
  title: Valuation thesis and framework
  body: SAFE's valuation case starts with a real operating story, not a slide-deck fantasy. The company publicly disclosed a $70 million Series C, total funding above $170 million, triple-digit growth claims, and expanding module adoption after moving from CRQ into TPRM and CTEM. Forrester's Q2 2025 CRQ leadership call and SAFE's Liminal positioning help justify a premium versus slower, narrower cyber vendors. The problem is not whether SAFE has ambition or product breadth; the problem is that public evidence does not disclose audited ARR, gross margin, NRR, or the current cap-table and preference stack. That forces valuation to be inference-driven. In this chapter, a hypothetical $1 billion entry price is treated as an underwriting scenario rather than a confirmed public mark. On that basis, the key question becomes whether SAFE is already operating near $80 million to $100 million of ARR and whether the market should reward it with a 10x to 14x forward multiple. Without those answers,
    the correct lens is price discipline rather than simple admiration for category leadership.
