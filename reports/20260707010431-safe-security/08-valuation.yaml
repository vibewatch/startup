- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Thesis
  - Anti-thesis
  - Weight
  - Evidence
  rows:
  - - SAFE has real CRQ category leadership and expanding platform scope.
    - Leadership claims are mostly company-mediated and still need monetization proof outside marquee references.
    - High
    - Forrester leadership, Liminal recognition, and multi-module product breadth.
  - - Triple-digit growth and 50%+ TPRM adoption can justify a premium multiple.
    - Growth, retention, and gross-margin quality are not audited in the public record.
    - High
    - Series C disclosures and module-adoption claims, offset by disclosure gaps.
  - - CRQ, TPRM, and CTEM together can create a strategic system-of-record position.
    - Large security platforms can bundle adjacent capabilities and compress category pricing.
    - Medium
    - Platform roadmap versus lower-multiple public cyber comps.
  - - Public comps leave room for a premium above slower-growth names.
    - Public cyber median multiples remain far below 2021-style exuberance and punish decelerating vendors quickly.
    - High
    - Tenable, Qualys, Rapid7, Windsor, Finro, Clipperton, and First Analysis.
  - - A $1B entry could still work if SAFE is already near $100M ARR.
    - Third-party private-market data points to a much lower mark and possibly additional undisclosed financing.
    - High
    - Premier Alternatives versus implied-multiple math.
  notes: Weights reflect how strongly each argument should influence a new-money decision today. The anti-thesis is mostly about valuation opacity and market discipline, not about absence of product ambition.
