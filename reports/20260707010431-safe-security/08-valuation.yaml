  evidenceGaps:
  - type: missing-source
    severity: material
    topic: arr-disclosure
    missingEvidence: A board-approved or audited ARR bridge from FY2024 through the latest quarter.
    whyItMatters: Without a hard ARR bridge, the chapter cannot distinguish between fair and stretched entry pricing.
    diligencePath: Request audited management financials or the latest board KPI deck.
    relatedQuestionRefs:
    - QV021
    - QV022
    relatedTableRefs:
    - TV001
    - TV003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Net revenue retention, gross margin, burn / FCF, and customer-concentration data.
    whyItMatters: Premium software multiples are earned by durable growth quality, not by growth slogans.
    diligencePath: Request cohort retention tables, margin schedules, and finance-model outputs.
    relatedQuestionRefs:
    - QV026
    - QV028
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-terms
    missingEvidence: Current cap table, liquidation preferences, anti-dilution mechanics, and any debt or structured financing terms.
    whyItMatters: Investors cannot translate valuation upside into common-equity outcomes without knowing the stack.
    diligencePath: Request counsel summary, cap-table export, and executed term sheets.
    relatedQuestionRefs:
    - QV027
    - QV029
    relatedTableRefs:
    - TV005
    - TV006
  - type: conflicting-data
    severity: material
    topic: current-market-mark
    missingEvidence: A credible explanation for the gap between company narrative and Premier Alternatives' adverse valuation estimate.
    whyItMatters: The investment call changes materially depending on whether the real market-clearing price is near $1B or far below it.
    diligencePath: Request recent secondary data, any 409A materials, and details on late-2025 financing activity.
    relatedQuestionRefs:
    - QV014
    - QV015
    - QV026
    relatedTableRefs:
    - TV001
    - TV004
