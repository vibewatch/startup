- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Monitoring signal
  - Action
  rows:
  - - Down round or structured financing
    - Any primary round below a $1B reference point or with punitive downside protection
    - New financing announcement, cap-table update, or rights summary
    - Move from Track toward Avoid until common-equity economics are re-underwritten.
  - - Growth credibility fades
    - Current ARR bridge implies materially below ~$80M ARR or forward growth below category-premium levels
    - Audited ARR bridge, board pack, or investor presentation
    - Re-rate toward public-comp bands rather than premium private bands.
  - - Module adoption stalls
    - No evidence that CTEM and TPRM are adding durable paid wallet share
    - Module attach, expansion cohorts, and renewal data
    - Collapse the platform premium in scenario modeling.
  - - Public comp reset
    - Premium cyber multiples compress toward low-single digits again
    - Public comp tape for Qualys, Tenable, Rapid7, and broader cyber basket
    - Tighten entry price and lower base-case valuation.
  - - Strategic narrative weakens
    - SAFE stops looking like a system of record and looks more like a feature set
    - Win-loss data versus large platforms and packaging/pricing changes
    - Treat bull case as broken and focus on base-to-bear only.
  notes: These are monitorable triggers rather than abstract worries. The table is designed to force fast action if the bull thesis loses its economic foundation.
