- id: TV006
  title: Final diligence asks table
  columns:
  - Ask
  - Priority
  - Why it matters
  - Target source
  rows:
  - - Current ARR bridge from FY2024 through the latest quarter
    - Critical
    - Determines whether a hypothetical $1B entry is 10x ARR, 14x ARR, or worse.
    - Audited management financial package or board-approved KPI deck
  - - Net revenue retention, gross margin, and burn / FCF profile
    - Critical
    - Separates premium-quality SaaS growth from narrative-only growth.
    - Audited financials and operating metrics schedule
  - - Current cap table, liquidation preferences, anti-dilution, and any post-Series-C debt terms
    - Critical
    - Determines whether valuation upside translates into common-equity returns.
    - Cap table export, term sheets, and counsel summary
  - - Module-level adoption and expansion for CRQ, TPRM, and CTEM
    - High
    - Tests whether platform breadth is monetizing or merely expanding product marketing.
    - Cohort analysis and product attach dashboard
  - - Win-loss and pricing data versus large security suites
    - High
    - Shows whether SAFE has strategic scarcity or is vulnerable to bundling pressure.
    - Sales analytics, battlecards, and closed-lost review
  - - Evidence behind the current market mark, including any 2025 or 2026 secondary or debt financing
    - High
    - Resolves the gap between company narrative and adverse third-party valuation signals.
    - Investor update, financing memo, or independent 409A / valuation work
  notes: These asks are decision-critical because they close the specific holes that block a buy recommendation, rather than collecting generic diligence trivia.
