callouts:
- calloutType: risk
  title: The strongest adverse signal is not the product — it is the price gap
  body: Premier Alternatives' $368.3M estimate is not authoritative enough to replace a financing mark, but it is authoritative enough to block complacency. When a third-party market-data source sits that far below the underwriting conversation, investors need harder proof before assuming a premium outcome.
  claimRefs:
  - CV022
  - CV023
  - CV037
- calloutType: recommendation
  title: Track until the valuation case becomes auditable
  body: 'SAFE can absolutely become a buy, but not on category leadership alone. The upgrade path is straightforward: prove the ARR bridge, prove retention and margin quality, and show terms that preserve equity upside rather than hiding it behind structure.'
  claimRefs:
  - CV041
  - CV042
  - CV043
  - CV045
- calloutType: assumption
  title: Treat the $1B entry as a scenario, not a corroborated public mark
  body: 'This chapter underwrites a $1B price only as a diligence scenario because the fetched public record does not disclose a clean post-Series-C valuation. That distinction matters: the implied multiple math is useful, but the actual current market mark remains unresolved.'
