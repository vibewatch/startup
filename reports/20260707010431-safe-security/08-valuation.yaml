- id: scenario-analysis
  title: Scenario analysis
  body: 'Scenario analysis is the only honest way to value SAFE with today''s disclosure set. The bear case assumes the platform story outruns the underlying economics: growth slows, larger cyber suites commoditize risk-management packaging, and the market prices SAFE more like a lower-visibility late-stage SaaS asset than a scarce leader. Under that outcome, $60 million to $70 million of ARR at 7x to 10x yields only $500 million to $700 million of value. The base case assumes SAFE keeps converting CRQ leadership into broader TPRM and CTEM wallet share, matures into roughly $175 million to $200 million of ARR, and clears an 8x to 10x multiple, supporting about $1.5 billion to $2.0 billion. The bull case requires much more: CyberAGI positioning must translate into real platform leadership, ARR must scale toward $300 million to $350 million, and investors must still be willing to pay 10x to 12x for a strategic category winner. That yields roughly $3.0 billion to $4.2 billion. Those upside
    numbers are achievable, but only if execution closes the evidence gap rather than merely widening the narrative.'
