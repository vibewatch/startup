    risk in financial terms), CTEM (the claimed world's first fully autonomous CTEM solution powered by 50+ AI agent
    nodes and 100+ workflow templates), TPRM (autonomous third-party risk assessment for vendor ecosystems), and AI-SPM
    (AI Security Posture Management for AI workload risk). Balbix's CAASM capabilities anchor the asset intelligence
    layer; RiskLens IP underpins the FAIR quantification engine.
  customerFocus: >
