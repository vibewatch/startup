  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risks
        blocks:
          - type: paragraph
            body: >-
              Safe’s regulatory and legal exposure is not a headline enforcement case today; it is a stack of
              obligations that become material precisely because Safe sits inside customer governance workflows.
              Public-company customers now face SEC Item 1.05 and Item 106 disclosure obligations, so any Safe output
              used in board reporting, cyber materiality assessment, or incident escalation can become part of a
              regulated decision chain. Safe’s own policies add cross-border complexity. The privacy policy explicitly
              distinguishes between Safe as a controller for its own-site data and a processor for customer data, while
              also listing processing jurisdictions that span the United States, Europe, Bahrain, India, Australia, and
              Singapore. That makes GDPR transfer mechanics, India DPDP breach obligations, and customer-contract DPA
              terms central diligence questions rather than back-office hygiene. The customer terms also surface export
              and sanctions obligations and sharply limit contractual remedies, while the recent SecurityScorecard
              dispute proves competitive or legal friction can reach the company even if the specific matter was
              resolved. The risk is therefore less about one visible case and more about whether Safe can support
              enterprise-grade contracting, disclosure, and incident response under scrutiny.
            claimRefs:
