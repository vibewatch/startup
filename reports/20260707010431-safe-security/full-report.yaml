    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and business model
        blocks:
          - type: paragraph
            body: >-
              Safe Security is the current brand of Lucideus, a cybersecurity company founded in 2012 and now
              headquartered in Palo Alto, California. The company positions itself as an autonomous cyber risk
              management platform rather than a point security tool. Across its official pages, SAFE describes one
              unified platform that helps CISOs, TPRM leaders, and GRC teams continuously quantify, prioritize, and
              reduce cyber risk across enterprise, third-party, threat-exposure, and AI use cases. The product stack now
              spans Cyber Risk Quantification (CRQ), Third-Party Risk Management (TPRM), Continuous Threat Exposure
              Management (CTEM), and AI Security Posture Management (AI-SPM), with agentic workflows and a real-time
              risk graph as the connective tissue. Public location pages and the company LinkedIn profile anchor Palo
              Alto as headquarters and show additional operating presence in New York, Santa Clara, San Jose, New Delhi,
              Bengaluru, London, Dubai, and remote hiring markets. For later chapters, the safest canonical description
              is therefore: a privately held enterprise cyber-risk software vendor selling a platform subscription to
              large organizations, with product breadth expanding faster than its financial disclosure.
