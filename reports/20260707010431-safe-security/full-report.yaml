            body: >-
              SAFE's funding chronology is directionally clear even though the cap table and valuation are not. Lucideus
              disclosed angel funding in 2016 and a broader angel syndicate round in 2017 while describing itself as
              bootstrapped for its first four years and still primarily India-based. The modern institutional chronology
