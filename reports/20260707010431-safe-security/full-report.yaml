      - number: '5.3'
        title: Acquisitions, IP, and differentiated technology
        blocks:
          - type: paragraph
            body: >-
              SAFE’s strongest product differentiation comes from combining two acquisitions with its original platform
              thesis. RiskLens brought the FAIR intellectual property and practitioner credibility that many CRQ
              competitors still lack; SAFE now uses that acquisition to frame itself as not merely FAIR-aligned but
              operationally FAIR-based through FAIR-CAM and automated control analytics. Balbix added a different kind
              of depth: AI-native asset discovery, exposure discovery, exploitability analysis, control-efficacy
              context, and remediation workflow hooks. Together, those acquisitions support SAFE’s claim that it can
              connect technical attack-surface evidence to business loss in one system. That is the core strategic
              argument behind CyberAGI and “risk singularity”: not just more dashboards, but a combined graph where
              assets, exposures, controls, vendors, AI use cases, and financial consequences are measured on one plane.
              Public evidence is good enough to support the thesis directionally, especially because outside coverage of
              Balbix confirms real CTEM capabilities. The unresolved diligence issue is integration maturity. Most
              public sources still describe what the combination should become, not which Balbix-origin services,
