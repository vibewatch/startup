  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              SAFE's public materials point to a platform-style enterprise SaaS model rather than a services-led
              security consultancy. The company consistently presents CRQ, TPRM, and CTEM as one unified cyber risk
              platform, which implies a land-and-expand motion: CRQ appears to be the historical wedge for board-,
              regulator-, and insurance-facing cyber risk decisions; TPRM is the first clearly disclosed expansion
              module; and CTEM is the newest attach product layered onto the same control plane. That sequence matters
              financially. SAFE launched TPRM in 2024 with 100+ customers live within a week, and by the July 2025
              Series C announcement management said more than half of customers had already adopted the module. That
              makes TPRM the strongest public signal of wallet expansion, while CTEM looks more like a 2025-to-2026
              upsell vector than an already mature revenue base. Public pricing is intentionally thin, but the clues
              that do exist are enterprise-like: SAFE advertised 50% contract buyouts from incumbent TPRM vendors, no
              vendor caps, AWS Marketplace private offers, and case-study references to flat pricing. Together those
              clues support a negotiated annual subscription model, likely sold by module and scope rather than simple
              per-seat pricing.
