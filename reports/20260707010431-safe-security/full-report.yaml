            body: >-
              Premier Alternatives' $368.3M estimate is not authoritative enough to replace a financing mark, but it is
              authoritative enough to block complacency. When a third-party market-data source sits that far below the
              underwriting conversation, investors need harder proof before assuming a premium outcome.
