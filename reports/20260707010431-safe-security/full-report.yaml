  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      Decision flow from category strength and product breadth through disclosure and price discipline to the current
      recommendation.
    data:
      nodes:
        - id: proof
          label: 'Category proof: CRQ leadership + Series C traction'
          type: start
        - id: breadth
          label: 'Platform breadth: CRQ + TPRM + CTEM'
          type: process
        - id: disclosure
          label: Are ARR, NRR, margin, and terms disclosed?
          type: decision
        - id: price
          label: Does the entry clear premium-comp discipline?
          type: decision
        - id: buy
          label: Conditional Buy
          type: end
        - id: track
          label: Track
          type: end
        - id: avoid
          label: Avoid / reset price
          type: end
      edges:
        - from: proof
          to: breadth
          label: 'Yes: real operating signal'
        - from: breadth
          to: disclosure
          label: Premium narrative exists
        - from: disclosure
          to: track
          label: 'No: key economics missing'
        - from: disclosure
          to: price
          label: 'Yes: evidence closes the gap'
        - from: price
          to: buy
          label: 'Yes: price is disciplined'
        - from: price
          to: avoid
          label: 'No: premium outruns proof'
    approximationNotes: >-
      The chart reduces a complex underwriting process to the two gating questions that dominate this chapter: evidence
      quality and price discipline.
