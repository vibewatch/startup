      - number: '5.4'
        title: Compliance, trust, and data handling
        blocks:
          - type: paragraph
            body: >-
              SAFE’s trust posture is stronger than its public infrastructure disclosure. The security page lists SOC 2
              Type 2, ISO 27001:2013, ISO 9001:2015, and TX-RAMP, and it describes a multi-tenant AWS deployment model
              with customer-selectable regions, TLS 1.2 in transit, AES-256 at rest, AWS KMS-based key management,
              continuous SAST and DAST scanning, daily vulnerability assessment, and periodic access review. The AI
              policy adds the clearest trust language for the newer agentic surface. SAFE says prompts are
              tenant-scoped, customer data is not used to train shared or cross-tenant models, data is not shared across
              customers, and model routing can involve AWS Bedrock-hosted, Anthropic, and OpenAI models. It also
              discloses that AI interactions are logged, AI usage can be disabled by admins, and SAFE AI is not designed
              for PHI/HIPAA workloads. That is meaningful enterprise-grade disclosure. The remaining caveat is scope
              precision. The public trust pages do not provide audit report excerpts, certificate numbers, or renewal
              dates for most certifications, and they do not explain how AI-specific controls map to each certification
              boundary. Buyers in regulated environments should treat the published posture as credible but incomplete
              until trust-center artifacts are shared.
