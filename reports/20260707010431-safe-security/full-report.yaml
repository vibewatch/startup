        title: Customer Segmentation and Profile
        blocks:
          - type: paragraph
            body: >-
              SAFE’s public customer evidence points to a large-enterprise and upper-enterprise customer base rather
              than a broad SMB or self-serve motion. The homepage claims SAFE is used by 10% of the Fortune 500, while
              the customer library highlights telecom, financial services, healthcare, insurance, retail, utilities,
              consulting, and hospitality names. The buyer in these stories is usually a CISO, cyber-risk leader, GRC
              owner, or TPRM leader looking for board-grade risk communication, budget justification, or defensible
              prioritization. The day-to-day users are security, risk, and vendor-management teams; the payer is
              typically the enterprise security, compliance, or risk budget owner. Public use cases cluster around CRQ,
              executive reporting, and increasingly TPRM automation, with repeated emphasis on financial language and
              business impact rather than technical telemetry alone. That mix suggests higher implied ACVs and deeper
              workflow embedding, but it also implies longer enterprise sales cycles and more concentration risk if a
