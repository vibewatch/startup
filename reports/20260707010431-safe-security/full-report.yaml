      - number: '4.4'
        title: Financial gaps and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The core underwriting problem is not whether SAFE has a plausible software business; it is that the public
              record never shows the operating math underneath the narrative. No retained source discloses ARR, GAAP
              revenue, deferred revenue, module mix, gross margin, net revenue retention, churn, customer concentration,
              cash balance, monthly burn, or acquisition consideration for RiskLens and Balbix. That means a
              sophisticated investor cannot tell whether SAFE is a high-quality recurring software engine with
              attractive expansion economics, or a capital-hungry platform story still carrying meaningful integration
              and services drag. The diligence path should therefore be exact and financial rather than thematic:
              request ARR and billings by module; realized pricing and discount ladders for CRQ, TPRM, and CTEM;
              deferred revenue and RPO; cohort retention and expansion by vintage; cloud-hosting and support cost
              drivers; sales and marketing efficiency by channel; acquisition integration scorecards; and a monthly cash
              runway model that includes any debt, earn-outs, or retention packages. Until that package is visible, the
              right financial conclusion is cautiously positive on revenue quality and product breadth, but still
              blocked on precision, margin path, and capital efficiency.
