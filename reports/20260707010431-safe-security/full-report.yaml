      - number: '8.2'
        title: Comparable company analysis
        blocks:
          - type: paragraph
            body: >-
              The public comp set shows how sharply cybersecurity multiples separate by growth quality and maturity.
              Tenable is already near $1.1 billion of guided 2026 revenue, yet trades at only about 4.3x enterprise
              value to revenue; Rapid7 trades even lower near 1.2x EV to ARR because growth has stalled. Qualys is the
              more profitable and better-valued benchmark at about 6.8x EV to revenue, supported by 83% gross margin and
              disciplined execution. Sector studies from Windsor Drake, Finro, Clipperton, and First Analysis all point
              to the same conclusion: median public cyber pricing is far below the 2021 peak, while only genuine leaders
              with clean Rule-of-40 profiles keep double-digit multiples. Private and strategic comps are wider.
              Axonius' estimated 2024 revenue and $2.6 billion valuation imply a high-teens multiple, SecurityScorecard
              sits closer to the high-single digits, and BitSight's $2.4 billion Moody's-backed round shows how a
              strategic buyer can pay up for cyber-risk analytics. SAFE therefore deserves to be analyzed in a premium
              band above Tenable and Rapid7, but not in the same stratosphere as Wiz unless audited scale and scarcity
              become much clearer.
