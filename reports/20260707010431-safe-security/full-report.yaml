      - number: '8.4'
        title: Investment recommendation
        blocks:
          - type: paragraph
            body: >-
              The final recommendation is Track, not Buy and not Avoid. SAFE has enough product proof, category
              leadership, and strategic ambition to stay on the diligence list, and a hypothetical $1 billion price is
              not obviously absurd if the business is already near the upper end of an $80 million to $100 million ARR
              band. However, the public record is still too opaque for a clean affirmative buy: third-party
              private-market data points to a much lower mark, public sources do not show audited ARR or current margin
              structure, and no disclosed preferred terms let investors translate narrative upside into common-equity
              outcomes. The chapter therefore sets a high evidence threshold for upgrade. Management must show a
              credible ARR bridge, strong retention, healthy gross margin, and proof that multi-module adoption is
              monetizing across CRQ, TPRM, and CTEM. The bull case fails if SAFE prints a flat or down round, if module
              attach stalls, or if larger platforms make cyber-risk management look like a feature rather than a scarce
              system of record. Until those issues are resolved, the right posture is disciplined monitoring rather than
              forcing conviction.
