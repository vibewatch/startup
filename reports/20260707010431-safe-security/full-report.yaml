companyProfile:
  summary: >
    Safe Security (formerly Lucideus) is a Palo Alto, California-headquartered cybersecurity platform company founded in
    2012 at IIT Bombay by Saket Modi, Rahul Tyagi, and Vidit Baxi. Originally a penetration-testing and cyber-hygiene
    services firm, the company pivoted to SaaS in the mid-2010s and rebranded as SAFE in 2021. The SAFE Platform now
    unifies Cyber Risk Quantification (CRQ), Continuous Threat Exposure Management (CTEM), Third-Party Risk Management
    (TPRM), and AI Security Posture Management (AI-SPM) under an agentic AI architecture. Strategic acquisitions of
    RiskLens (2022) and Balbix (2025) added FAIR-based CRQ automation and AI-native cyber asset intelligence. The
    company raised a $70 million Series C in July 2025 at an implied $1B+ unicorn valuation and reported triple-digit
    year-over-year revenue growth for three consecutive years. Forrester named SAFE a Leader in Cyber Risk
    Quantification Solutions in its Q2 2025 Wave, and Liminal rated it the #1 TPRM platform by product capability. Named
    customers include Google, T-Mobile, Fidelity, Chevron, and IHG.
