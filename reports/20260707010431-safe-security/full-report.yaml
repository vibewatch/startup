            body: >-
              Founder identity is one of the better-corroborated parts of the SAFE story. Independent reporting, the
              CEO's own Forbes profile, and investor materials all point to Saket Modi, Rahul Tyagi, and Vidit Baxi as
              the founding trio, with Saket Modi still serving as the clearly dominant external face of the company as
              co-founder and CEO. Craft's company profile also identifies Vidit Baxi as co-founder and CISO, Rahul Tyagi
              as co-founder, and Saket Bajoria as Chief Product Officer. Leadership expansion has also come through
              acquisitions: after the 2023 RiskLens deal, former RiskLens CEO Nick Sanna joined SAFE as President and
