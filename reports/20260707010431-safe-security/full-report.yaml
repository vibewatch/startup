      - number: '6.5'
        title: Concentration and Expansion Risk
        blocks:
          - type: paragraph
            body: >-
              The central customer risk is not a lack of logos; it is a lack of disclosed durability and concentration
              metrics. SAFE’s public reference set is heavy on very large enterprises and mission-critical
              operators—exactly the kind of accounts that can produce attractive ACVs and powerful references, but also
              create long sales cycles, bespoke implementation work, and meaningful top-customer exposure if the base is
              not broad enough underneath. Geography also looks mixed: there is clear international reach through IHG,
              Glovo, and Aboitiz, yet the public story still leans North America-heavy overall. Proof depth is similarly
              uneven. T-Mobile, Instacart, Kyriba, Carvana, Aboitiz, and OB Hospitalist Group provide quantified
              narratives, whereas Google, Fidelity, and Chevron remain name-level proof in the reviewed corpus. Finally,
              Gartner’s description of the TPRM category as a multi-function, multi-stakeholder market underscores
              procurement friction: these are complex enterprise sales, not lightweight tool purchases. Until SAFE
              discloses customer-count bridges, top-customer exposure, geo mix, and retention cohorts, concentration
              risk remains one of the biggest open diligence asks.
