  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    summary: >-
      SAFE moved from an IIT Bombay-founded services player into a multi-module cyber-risk platform through financing,
      acquisitions, analyst validation, and one disclosed legal dispute.
