  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation thesis and framework
        blocks:
          - type: paragraph
            body: >-
              SAFE's valuation case starts with a real operating story, not a slide-deck fantasy. The company publicly
              disclosed a $70 million Series C, total funding above $170 million, triple-digit growth claims, and
              expanding module adoption after moving from CRQ into TPRM and CTEM. Forrester's Q2 2025 CRQ leadership
              call and SAFE's Liminal positioning help justify a premium versus slower, narrower cyber vendors. The
              problem is not whether SAFE has ambition or product breadth; the problem is that public evidence does not
              disclose audited ARR, gross margin, NRR, or the current cap-table and preference stack. That forces
              valuation to be inference-driven. In this chapter, a hypothetical $1 billion entry price is treated as an
              underwriting scenario rather than a confirmed public mark. On that basis, the key question becomes whether
              SAFE is already operating near $80 million to $100 million of ARR and whether the market should reward it
              with a 10x to 14x forward multiple. Without those answers, the correct lens is price discipline rather
              than simple admiration for category leadership.
