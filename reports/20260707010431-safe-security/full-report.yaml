      - number: '2.4'
        title: Growth Drivers and Market Constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest growth drivers are visible and current. AI adoption is creating new machine identities,
              shadow-AI workflows, and configuration risk that push cyber governance beyond traditional security
              controls. SEC cyber disclosure rules force public companies to operationalize materiality, governance, and
              board oversight in a way that favors defensible quantification and reporting. Cyber insurance continues to
              grow, and carriers increasingly reward clients that can quantify exposure or at least produce better
              evidence. Supply-chain attacks remain frequent enough that third-party risk is no longer a niche
              compliance task. At the same time, the market has real brakes. Budget growth in 2026 is still positive,
              but buyers increasingly want measurable efficacy, fewer tools, and lower operating friction. CRQ also
              carries a trust problem when outputs look overly precise or are poorly aligned with the audience. Finally,
              privacy limits, fragmented telemetry, and long cross-functional implementations mean SAFE is selling into
              a category where technical urgency is high but conversion speed is not guaranteed.
