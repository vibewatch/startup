        title: 'Market Sizing: TAM, SAM, SOM'
        blocks:
          - type: paragraph
            body: >-
              Public sizing evidence confirms that SAFE is selling into multi-billion categories, but it does not
              justify one simple additive TAM slide. Mordor's broader CRQ scoring-platform lens reaches USD 5.43 billion
              in 2026, while its narrower CRQ-governance lens is USD 2.04 billion in 2026 and SAFE's own older framing
              sits at USD 4 billion. CTEM is still an emerging market category, with a Grand View / GII lens at USD 2.70
              billion in 2025 and roughly USD 3.04 billion on a 2026 forward estimate, while CAASM adjacency is already
              around USD 3.70 billion in 2026. TPRM software is the largest directly adjacent workflow at USD 8.5
              billion in 2025 and roughly USD 9.78 billion on a 2026 forward estimate. Broader GRC and cybersecurity
              pools are far larger, at USD 23.32 billion and USD 264.43 billion respectively, but they materially
              overstate what SAFE can serve today. The right diligence takeaway is that TAM is real, SAM and SOM are not
              publicly isolatable, and overlap between categories is itself a core market fact.
