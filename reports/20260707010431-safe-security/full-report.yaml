      - number: '2.3'
        title: Buyer Profiles and Decision Criteria
        blocks:
          - type: paragraph
            body: >-
              SAFE's buyer map is attractive precisely because it is cross-functional, but that same breadth lengthens
              enterprise sales cycles. CRQ and CTEM purchases typically anchor with the CISO, CRO, enterprise-risk, or
              IT-risk organization because those teams own exposure prioritization, board reporting, and remediation
              governance. TPRM brings procurement, privacy, legal, and compliance teams into the motion because vendor
              onboarding, questionnaires, contracts, and ongoing monitoring all live across those functions. Finance and
              treasury influence the conversation when cyber insurance, capital allocation, or SEC disclosure quality
              become explicit use cases. Public TPRM frameworks from IBM and Moody's also show why automation matters:
              buyers want inventory, due diligence, workflow, scoring, contract controls, auditable records, and
              continuous monitoring, and they increasingly want security review to start earlier in procurement. That
              combination favors platforms that can unify data, but it also means SAFE must clear integration, workflow,
              and governance objections before a technical win becomes a booked enterprise contract.
