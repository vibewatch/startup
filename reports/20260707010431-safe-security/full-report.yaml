  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Landscape
        blocks:
          - type: paragraph
            body: >-
              Safe Security's most defensible market is not “all cybersecurity,” but the narrower enterprise workflow
              where technical exposure is translated into business and governance action. SAFE's own 2025-2026 platform
              messaging now bundles CRQ, CTEM, TPRM, and AI-SPM into one operating layer, which means the chapter should
              treat market definition before market size. CRQ covers the financial expression of cyber risk for boards,
              finance, and insurance workflows. CTEM covers the continuous discovery, prioritization, validation, and
              mobilization of exposures across the attack surface. TPRM covers the lifecycle of onboarding, assessing,
              monitoring, and governing vendors and fourth parties. Those categories overlap with CAASM, exposure
              assessment platforms, GRC, IRM, and even EDR/XDR or traditional vulnerability management, but they are not
              interchangeable. The buying job is converging around continuous, evidence-backed cyber risk decisions,
              while the budget still sits across multiple adjacent line items.
