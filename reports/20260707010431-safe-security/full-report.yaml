              joined as President of CTEM. The main governance caveat is disclosure depth. Public materials reviewed for
              this chapter identify investors, strategic backers, and operating executives, but they do not publish a
              complete board roster, committee structure, or explicit succession plan. That leaves meaningful key-person
              dependence around Saket Modi and incomplete visibility into board oversight, even though the company now
              has a late-stage investor set and multiple acquired business lines to integrate.
