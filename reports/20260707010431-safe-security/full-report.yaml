  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform overview and modules
        blocks:
          - type: paragraph
            body: >-
              SAFE’s product story is no longer just cyber risk quantification. Public materials now present SAFE One as
              a unified operating layer across strategic, vendor, tactical, and AI exposure management. In practice,
              that means four commercial modules are doing different jobs inside one narrative. CRQ remains the
              board-facing financial engine: it converts telemetry, threat data, control evidence, and scenario logic
              into quantified loss exposure and investment decisions. CTEM is the tactical layer that normalizes asset
              and vulnerability data, prioritizes by exploitability and business impact, validates whether controls
              actually blunt attack paths, and then routes remediation. TPRM applies the same agentic logic to vendor
              onboarding, questionnaires, monitoring, and reassessments. AI-SPM extends the stack to AI vendors and AI
              usage, including shadow AI, contract risk, configuration drift, and outside-in exposure. SAFE also still
              positions SafeX as a reasoning layer that turns those module outputs into operational decisions. That
              breadth is strategically useful because it lets one budget owner buy a shared data and workflow plane
              rather than separate point tools, but it also means the investment case depends on whether the modules
              truly share one operating model rather than only a top-level brand umbrella.
            claimRefs:
