      - number: '7.4'
        title: People and execution risks
        blocks:
          - type: paragraph
            body: >-
              People risk is unusually important for Safe because the company is simultaneously founder-led,
              acquisition-led, and AI-story-led. Saket Modi remains the public face of the company’s category claims,
              fundraising, and CyberAGI narrative, while Gaurav Banga now owns CTEM integration and RiskLens leadership
              remains tied to the FAIR layer. That concentration might be manageable if the labor market were loose and
              employee sentiment strong, but neither is true. TechStrong’s 2026 survey says AI engineers and
              cybersecurity engineers are the two hardest roles to fill, and Safe needs exactly that hybrid talent.
              Economic Times reports roughly half of the company’s headcount and most R&D sit in India, which adds
              coordination and retention complexity across U.S. enterprise selling, India engineering execution, and
              post-acquisition cultural integration. The most concrete adverse evidence comes from AmbitionBox, where
              Safe’s overall employee rating is 2.5 out of 5 and work-life balance and job security score worst. Those
              reviews are not dispositive, but they are directionally important because long hours, weak job security,
              and management friction are the exact conditions that can slow integration and weaken AI product quality.
