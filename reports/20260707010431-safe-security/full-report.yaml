            body: >-
              Public evidence supports expansion more clearly than it supports classic SaaS retention metrics. Instacart
              is the cleanest cross-sell example because it was already using SAFE for CRQ before partnering on TPRM.
              Kyriba shows another expansion pattern: SAFE’s autonomous TPRM module replaced a pay-per-vendor model with
              flat-price coverage of the whole vendor ecosystem, while still driving automation and prioritization
              gains. SAFE’s July 2025 funding announcement adds the strongest company-wide proxy by saying more than 50%
              of customers adopted TPRM after launch. Customer stories also repeat a durable value proposition around
              board reporting, budget allocation, cyber-insurance negotiations, and business-case framing—use cases that
              usually become sticky once embedded into governance routines. Independent review surfaces are
              directionally supportive, with Gartner showing 99 reviews and a 4.5 average rating and FeaturedCustomers
              showing a 4.8/5 reference score. The major caveat is that none of the reviewed sources disclose NRR, GRR,
              logo churn, renewal rates, or contract duration, so public evidence proves expansion and satisfaction
              proxies better than it proves renewal quality.
