  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: SAFE Competes Across Direct CRQ, CTEM, TPRM, and Platform-Consolidation Sets'
        blocks:
          - type: paragraph
            body: >-
              SAFE is not defending a single-category niche. The reviewed evidence shows a four-front landscape. First
              are direct CRQ and cyber-risk-management vendors: SAFE, Tenable, SecurityScorecard, BitSight, and adjacent
              CAASM player Axonius all claim to convert raw exposure or telemetry into business-prioritized risk
              insight. Second are CTEM and exposure-validation vendors such as Tenable, CrowdStrike, Rapid7, and
              Cymulate, which increasingly sell exploitability proof, attack-path context, and remediation automation.
              Third are dedicated TPRM specialists including Panorays, Prevalent, OneTrust, and ProcessUnity, plus Vanta
              from the trust-management side. Fourth are broad platform substitutes such as Palo Alto and CrowdStrike
              that can absorb the same budget through renewal-driven platform consolidation. Forrester's 2025 CRQ
              commentary is important because it explicitly says vendors have expanded into adjacent use cases like
              exposure management and third-party risk, meaning SAFE's real competition is broader than the legacy CRQ
              cohort alone. SAFE therefore wins or loses not only on quantification accuracy, but on whether buyers
              prefer a unified cross-domain risk platform versus a specialized ratings, TPRM, or exposure-management
              tool.
