  - id: TM001
    title: Market Definition Table
    columns:
      - Segment
      - Definition
      - Safe.security Position
      - Adjacent Markets
    rows:
      - - CRQ
        - Financially expresses cyber risk for boards, finance, and insurer-facing workflows.
        - Historical wedge and brand anchor through SAFE, RiskLens, and Forrester leadership messaging.
        - IRM, cyber insurance analytics, board reporting
      - - CTEM
        - Continuously scopes, discovers, prioritizes, validates, and mobilizes against exposures.
        - Post-Balbix expansion area positioned as agentic CTEM powered by business-impact context.
        - CAASM, EASM, BAS, exposure assessment platforms
      - - TPRM
        - Manages vendor lifecycle risk from onboarding and due diligence through monitoring and termination.
        - Fast-growth adjacency where SAFE is pushing autonomous workflows and continuous monitoring.
        - Vendor risk management, procurement risk, operational resilience
      - - AI-SPM
        - Monitors and governs AI activity, configuration, exposure, and policy evidence.
        - Newest expansion wedge linking AI adoption to SAFE's existing risk platform.
        - AI governance, AI security tooling, DSPM-like controls
      - - GRC / IRM adjacency
        - Governance, policy, audit, and enterprise-risk workflows that often own or consume cyber-risk outputs.
        - Useful budget adjacency and system-of-record complement, but not SAFE's entire core market.
        - GRC suites, audit platforms, ERM software
      - - EDR/XDR and traditional VM substitutes
        - >-
          Detection, response, or scanner-led programs that can crowd out management-layer budgets when buyers
          prioritize immediate operations.
        - Important status-quo substitute and objection source rather than additive TAM.
