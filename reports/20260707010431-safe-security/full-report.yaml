        title: Milestones, recognitions, partnerships, and adverse events
        blocks:
          - type: paragraph
            body: >-
              SAFE's trajectory shows a steady broadening from cyber-risk quantification into adjacent control planes.
              The company rebranded from Lucideus to SAFE in 2021, bought RiskLens in June 2023 to bring the FAIR
              methodology and leadership talent in-house, and then used 2024-2026 to widen platform scope from CRQ into
              TPRM, CTEM, and AI-SPM. Official 2025 materials claim more than half of customers adopted TPRM after its
              2024 launch, while June 2025 SAFE materials cite Forrester naming the company a Leader in cyber risk
              quantification and April 2025 SAFE materials cite Liminal ranking it highest on TPRM product capability.
              July 2025 added both the Series C raise and a Cisco AI Defense partnership, and November 2025 added the
              Balbix acquisition, which brought exposure-management depth and placed Balbix founder Gaurav Banga into
              the operating team. The principal adverse item surfaced in late 2025, when SecurityScorecard sued SAFE
              over alleged unfair competition and trade-secret misuse; SAFE and SecurityScorecard then announced a
              resolution and research collaboration the next month. On balance, the milestone record is consistent with
              a company that is still scaling fast and adding categories, but that has not matched its product and
              financing pace with equally deep public disclosure on governance, valuation, or audited operating metrics.
