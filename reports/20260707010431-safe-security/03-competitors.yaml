    whyItMatters: Without realized contract evidence, the chapter can compare packaging models but cannot defend precise ACV ranges or discounting behavior.
    diligencePath: Request anonymized SAFE quotes and at least two recent competitive bakeoff price sheets from sales leadership or customers.
