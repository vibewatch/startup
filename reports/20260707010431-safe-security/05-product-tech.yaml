  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "Safe Security now markets SAFE One as a unified cyber-risk operating layer rather than a single CRQ tool: CRQ remains the financial decision engine, CTEM extends the platform into exposure discovery and remediation, TPRM automates vendor-risk workflows, and AI-SPM adds AI-vendor and AI-usage oversight. Public evidence supports real module breadth, meaningful workflow and API surfaces, and strong trust signaling, but the exact scale of the agent/node inventory, the internal service topology, and the depth of Balbix integration are still more visible in positioning than in independently verifiable engineering detail."
  },
  "sections": [
    {
      "id": "platform-overview-and-modules",
      "title": "Platform overview and modules",
      "body": "SAFE’s product story is no longer just cyber risk quantification. Public materials now present SAFE One as a unified operating layer across strategic, vendor, tactical, and AI exposure management. In practice, that means four commercial modules are doing different jobs inside one narrative. CRQ remains the board-facing financial engine: it converts telemetry, threat data, control evidence, and scenario logic into quantified loss exposure and investment decisions. CTEM is the tactical layer that normalizes asset and vulnerability data, prioritizes by exploitability and business impact, validates whether controls actually blunt attack paths, and then routes remediation. TPRM applies the same agentic logic to vendor onboarding, questionnaires, monitoring, and reassessments. AI-SPM extends the stack to AI vendors and AI usage, including shadow AI, contract risk, configuration drift, and outside-in exposure. SAFE also still positions SafeX as a reasoning layer that turns those module outputs into operational decisions. That breadth is strategically useful because it lets one budget owner buy a shared data and workflow plane rather than separate point tools, but it also means the investment case depends on whether the modules truly share one operating model rather than only a top-level brand umbrella.",
