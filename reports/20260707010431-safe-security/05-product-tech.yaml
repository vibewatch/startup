      "id": "technical-architecture-and-ai",
      "title": "Technical architecture and agentic AI",
      "body": "The public architecture that can actually be verified is centered on connectors, a normalization layer, FAIR-based risk logic, and a workflow engine rather than on low-level infrastructure diagrams. SAFE’s CRQ surface says the platform ingests data from 200+ security and business systems and reviews roughly 600 threat events a day. The CTEM page shows how that expands into vulnerability scanners, CMDBs, cloud tools, pen-test outputs, and ticketing systems so exposures can be de-duplicated, prioritized, and mobilized. The integrations marketplace and API docs make that story more concrete: SAFE exposes Swagger-based REST APIs with versioned endpoints, admin-managed credentials, and a stated 1,200-request-per-minute cap, while integration guides such as GitHub show how findings and assets are pulled from source systems into SAFE. On top of that data plane sits the workflow fabric. Docs describe triggers, actions, flow controls, and AI tasks; product pages market 100+ workflows, 100+ AI agents, and 150+ connectors. The key architectural takeaway is that SAFE is trying to become an orchestration and reasoning layer above the customer’s existing security stack. The public gap is that SAFE has not published a detailed internal service map, queueing model, or fault-domain explanation, so the operational resilience of that orchestration layer still needs direct diligence.",
