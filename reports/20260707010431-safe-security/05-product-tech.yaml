    {
      "id": "roadmap-and-direction",
      "title": "Roadmap, maturity, and direction of travel",
      "body": "The roadmap is visible enough to understand direction even if not every milestone is independently underwritten. The sequence is coherent: RiskLens in 2023 gave SAFE defensible quantification IP; TPRM was launched in 2024 and then repositioned in 2025 as a fully autonomous, agentic workflow product; CTEM arrived in July 2025 as the next major module; Balbix followed in November 2025 to deepen exposure-management and asset-intelligence coverage; AI-SPM arrived by 2026 to extend the same platform into AI governance and AI-vendor exposure. In other words, SAFE is building outward from strategic quantification into operational risk reduction. External signals, however, are mixed. Forrester’s CRQ view is strongly positive and validates the FAIR-CAM differentiation, customer stories show production use, and AWS marketplace presence suggests enterprise buying intent. But BankInfoSecurity notes that users still want better asset and exposure tagging at scale, PeerSpot shows very limited grassroots review depth versus incumbents, and GARP’s CyberAGI coverage underscores how much of the autonomy story remains aspirational. SAFE looks commercially mature in CRQ, commercially accelerating in TPRM and CTEM, and earlier in AI-SPM; the common risk across all three newer surfaces is that the autonomy narrative currently has more public breadth than public engineering proof.",
