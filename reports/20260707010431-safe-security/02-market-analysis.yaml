  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: sam-sizing
    missingEvidence: A management revenue bridge that reconciles CRQ, CTEM, CAASM, TPRM, GRC, and broader cybersecurity categories into one non-overlapping SAM model.
    whyItMatters: Public category estimates overlap and use different perimeters, so investors cannot add them into one defensible SAFE-specific TAM or SAM from public sources alone.
    diligencePath: Request management segmentation by module, region, and customer cohort plus the internal market map used in board materials.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: safe-specific-sam
    missingEvidence: Current customer mix, pipeline by module, average contract value, attach rates, and expansion conversion that would support a serviceable-market and market-share model.
    whyItMatters: Without SAFE-specific commercial data, the chapter can bracket category size but cannot prove the portion of those budgets that SAFE can realistically serve or win.
    diligencePath: Ask for board-deck segmentation, sales-ops exports, and cohort-level ACV by CRQ, CTEM, TPRM, and AI-SPM module.
    relatedQuestionRefs:
    - QM026
  - type: missing-source
    severity: material
    topic: pricing-and-sales-cycle
    missingEvidence: Public price cards, standard implementation duration, and median procurement-cycle data for SAFE by buyer segment.
    whyItMatters: Adoption timing and sales efficiency are valuation-critical for a multi-stakeholder enterprise workflow product, but public materials do not disclose a median cycle length or common contract structure.
    diligencePath: Run customer reference calls, request anonymized CRM funnel data, and review procurement artifacts or sample MSAs/SOWs during diligence.
    relatedQuestionRefs:
    - QM027
    relatedTableRefs:
    - TM003
