  rows:
  - - Security leadership
    - CISO / VP Security
    - Prioritize enterprise exposures, brief the board, and prove risk reduction
    - Business-impact prioritization, integration breadth, remediation workflow, auditability
    - Security or enterprise cyber budget
  - - Enterprise risk
    - CRO / Head of Enterprise Risk / IRM lead
    - Translate cyber into enterprise-risk, insurance, and capital-allocation language
    - Defensible quantification, alignment to governance frameworks, insurer/board credibility
    - Corporate risk or shared GRC budget
  - - Third-party risk
    - TPRM lead / Procurement risk / Vendor governance manager
    - Assess vendors, collect evidence, monitor ongoing exposure, and enforce process discipline
    - Workflow automation, questionnaires, monitoring, contract hooks, recordkeeping
    - Procurement, IRM, compliance, or shared-services budget
  - - Finance and insurance
    - CFO / Treasurer / Insurance manager
    - Support insurance buying, SEC disclosure coordination, and cyber capital allocation
    - Financial-loss framing, reporting discipline, insurer acceptance, cross-functional visibility
    - Finance, treasury, or insurance budget
  - - Control owners
    - IT risk / GRC / remediation operations
    - Turn findings into tickets, ownership, exceptions, and recurring compliance evidence
    - Ticketing integration, ownership routing, SLAs, exception management, low manual overhead
    - Shared GRC, IT, or security-operations budget
  notes: Large-enterprise buying is cross-functional. The same account often has a technical champion in security, an operational workflow owner in TPRM or GRC, and an economic influence path through finance, procurement, or the board.
