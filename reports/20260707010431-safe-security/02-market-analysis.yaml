chapter:
  number: 2
  title: Market Analysis
  summary: 'Safe Security sells into a real but overlapping enterprise cyber-risk-management wedge: public 2025-2026 lenses put CRQ around USD 2.0-5.4 billion depending on scope, CTEM around USD 2.7-3.0 billion, TPRM software around USD 8.5-9.8 billion, and adjacent GRC or cybersecurity pools much larger. The opportunity is strongest where CISOs, risk teams, procurement, finance, and boards all need continuous evidence, but adoption remains constrained by integration work, long enterprise buying cycles, and skepticism toward weakly defended quantification outputs.'
sections:
- id: market-definition-and-landscape
  title: Market Definition and Landscape
  body: Safe Security's most defensible market is not “all cybersecurity,” but the narrower enterprise workflow where technical exposure is translated into business and governance action. SAFE's own 2025-2026 platform messaging now bundles CRQ, CTEM, TPRM, and AI-SPM into one operating layer, which means the chapter should treat market definition before market size. CRQ covers the financial expression of cyber risk for boards, finance, and insurance workflows. CTEM covers the continuous discovery, prioritization, validation, and mobilization of exposures across the attack surface. TPRM covers the lifecycle of onboarding, assessing, monitoring, and governing vendors and fourth parties. Those categories overlap with CAASM, exposure assessment platforms, GRC, IRM, and even EDR/XDR or traditional vulnerability management, but they are not interchangeable. The buying job is converging around continuous, evidence-backed cyber risk decisions, while the budget still sits across multiple adjacent
    line items.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM007
  - CM008
  - CM016
  - CM049
  tableRefs:
  - TM001
- id: market-sizing
  title: 'Market Sizing: TAM, SAM, SOM'
  body: Public sizing evidence confirms that SAFE is selling into multi-billion categories, but it does not justify one simple additive TAM slide. Mordor's broader CRQ scoring-platform lens reaches USD 5.43 billion in 2026, while its narrower CRQ-governance lens is USD 2.04 billion in 2026 and SAFE's own older framing sits at USD 4 billion. CTEM is still an emerging market category, with a Grand View / GII lens at USD 2.70 billion in 2025 and roughly USD 3.04 billion on a 2026 forward estimate, while CAASM adjacency is already around USD 3.70 billion in 2026. TPRM software is the largest directly adjacent workflow at USD 8.5 billion in 2025 and roughly USD 9.78 billion on a 2026 forward estimate. Broader GRC and cybersecurity pools are far larger, at USD 23.32 billion and USD 264.43 billion respectively, but they materially overstate what SAFE can serve today. The right diligence takeaway is that TAM is real, SAM and SOM are not publicly isolatable, and overlap between categories is itself
    a core market fact.
