callouts:
- calloutType: strength
  title: SAFE benefits from market convergence, not just category growth
  body: 'SAFE''s strategic advantage is that public market drivers increasingly converge: boards want defensible quantification, security teams want continuous exposure prioritization, and procurement teams want continuous vendor oversight. That convergence makes a unified platform story more compelling than a standalone CRQ pitch.'
  claimRefs:
  - CM001
  - CM027
  - CM032
  - CM046
- calloutType: risk
  title: Adoption can still stall on trust and implementation friction
  body: Even with positive budget growth, SAFE sells into a category where buyers question weak quantification outputs, clean up fragmented data, and coordinate multiple functions before contracts close. That means the market is attractive but not fast-frictionless.
  claimRefs:
  - CM035
  - CM038
  - CM045
  - CM047
