- id: TM004
  title: Growth Drivers and Constraints
  columns:
  - Factor
  - Type
  - Impact
  - Evidence
  rows:
  - - AI-agent and AI-platform adoption expands attack surface and governance needs
    - driver
    - high
    - Gartner highlights AI-agent oversight as a top 2026 security trend; SAFE launched AI-SPM to address the gap.
  - - SEC cyber disclosure rules force recurring governance and reporting discipline
    - driver
    - high
    - SEC and KPMG show four-business-day incident disclosure plus annual governance and strategy disclosure requirements.
  - - Cyber insurance growth increases demand for quantification and better evidence
    - driver
    - medium
    - Munich Re, Fitch, and Marsh-linked reporting connect insurance demand to better risk assessment and underwriting data.
  - - Third-party and supply-chain attacks keep TPRM on the board agenda
    - driver
    - high
    - SecurityScorecard and Moody's show third-party breaches remain common and operationally material.
  - - Budget growth remains positive in 2026
    - driver
    - medium
    - Picus and PwC-linked reporting show continuing budget expansion even amid scrutiny.
  - - Tool consolidation and ROI proof pressure platform purchases
    - constraint
    - medium
    - Picus and Mordor both describe a shift away from disconnected tools toward efficacy and integration.
  - - Implementation complexity and data fragmentation slow deployments
    - constraint
    - high
    - IBM, Moody's, Mordor, and SAFE's own low-friction messaging imply inventory cleanup, integration work, and workflow redesign are still real barriers.
  - - CRQ trust gaps can weaken board adoption when outputs look overly precise
    - constraint
    - medium
    - ExtraHop and PwC-linked coverage show many firms still distrust or underuse financial quantification outputs.
  - - Privacy and data-availability limits can weaken model quality
    - constraint
    - medium
    - Mordor explicitly cites fragmented data pools and privacy rules as headwinds for CRQ model accuracy and cost.
  notes: Impact ratings reflect likely effect on adoption timing for large-enterprise SAFE buyers, not a macro forecast for the whole cybersecurity sector.
