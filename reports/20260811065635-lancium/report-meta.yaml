companyProfile:
  summary: >-
    Lancium says it was founded in Texas in 2017 and is headquartered in The Woodlands. The company positions itself as a developer and operator of large-scale powered land and energy infrastructure for AI data centers rather than as a conventional colocation landlord. Its flagship Abilene site is presented as Stargate I with a 1.2 GW ERCOT-approved interconnect, while additional campuses in Childress and Hall County extend the Texas portfolio. Public evidence supports strong partner validation and unusually large site ambition, but not yet the level of economic disclosure that would let outside investors underwrite the business like a mature infrastructure platform.
  foundedDate: '2017-01-01'
  founders:
    - name: Michael McNamara
      role: CEO and co-founder
      background: Official materials identify McNamara as chief executive officer and co-founder leading Lancium's current scale-up around AI campuses and power infrastructure.
      claimRefs: [CO008]
  foundingLocation: Texas, USA
  headquarters: The Woodlands, Texas, USA
  productSummary: Large AI-focused clean-energy-powered campus sites, grid interconnect access, behind-the-meter power resources, and power-orchestration infrastructure for hyperscale and frontier-model compute demand.
  customerFocus: Frontier AI labs, hyperscalers, campus operators, and other counterparties needing multi-hundred-megawatt to gigawatt-scale Texas AI infrastructure.
  businessModel: Infrastructure developer and powered-land platform monetizing site origination, campus buildout, power-readiness, and partner / tenant relationships rather than traditional software subscriptions.
  stage: Late-stage private
  fundingStatus: >-
    Publicly visible company-level financing includes a reported $500M Blackstone investment in 2024, a disclosed $600M debt financing package in 2025, and Reuters-reported Nvidia terms in August 2026 comprising a $2B initial investment with up to $1B more contingent on milestones.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO004, CO005, CO006, CO008, CO023, CO027, CO034, CO035, CO036, CU016, CV001, CV031]
summary:
  headline: Lancium has genuine strategic value at the intersection of Texas power scarcity and AI campus demand, but the reported ~$10B mark still outruns the public disclosure set and requires disciplined, milestone-based underwriting.
