  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk Is the First Gate
        blocks:
          - type: paragraph
            body: >-
              Lancium’s first major risk bucket is regulatory and legal because large Texas AI campuses depend on grid
              process, state politics, water scrutiny, and infrastructure permissions all moving in the same direction.
              The August 2026 Texas audit pause coverage matters precisely because Lancium sells speed-to-power; any
              queue or verification disruption directly weakens the core commercial promise. The ERCOT patent-license
              documents show that Lancium is not merely adjacent to the Texas market structure but meaningfully tied to
              it, which is a competitive advantage in-state and a portability risk elsewhere. The BearBox opinion is
              not, by itself, a business-ending event in the retained record, but it confirms that IP and legal
              distraction are part of the company history. Environmental and water oversight also matter because
              campus-scale AI infrastructure sits inside real permitting and community-resource regimes, not just
              private-contract logic.
