      - number: '1.4'
        title: Milestones, Expansion Path, and Early Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company moving from controllable-load experimentation into hyperscale AI
              infrastructure with unusual speed. In July 2024, Lancium and Crusoe disclosed the first 200 MW Abilene
              phase with a pathway to 1.2 GW. By August 2024, Lancium highlighted an amended Abilene economic agreement
              that would let the campus host multiple customers rather than remain tied to a single bitcoin-led model.
              March 2025 marked two meaningful inflection points: Crusoe began the next six Abilene buildings, taking
              the site to eight buildings and 4 million square feet, and Lancium licensed a significant patent portfolio
              to ERCOT at no cost to accelerate controllable-load resource participation. By July 2026, Lancium had
              announced a second Crusoe partnership in Childress and a QTS partnership in Hall County, both structured
              around Lancium-controlled land and power infrastructure. At the same time, scrutiny intensified. OpenAI’s
              own August 2026 infrastructure note highlighted closed-loop cooling, community-building, and Abilene’s
              role in training GPT-5.5, while Texas media and regulators focused on whether data centers fully disclose
              water and electricity impacts. Governor Abbott’s August 2026 audit order, the Texas Tribune’s statewide
              reporting on opaque queues, and Data Center Dynamics’ reporting on canceled further Abilene expansion for
              Oracle/OpenAI all show that Lancium’s strategic importance has increased faster than public transparency.
              The company’s milestone cadence is undeniably strong; the question is whether capital deployment, partner
              scope, and grid approvals can stay synchronized as campus plans expand beyond Abilene.
