      - number: '3.4'
        title: Switching Costs, Multi-Homing, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Switching costs in this market are asymmetric. Before a campus is committed, buyers can multi-home their
              search across multiple geographies and developers, meaning Lancium does not control demand in the way a
              closed software platform might. After power rights, land, and site-specific engineering are locked in, the
              costs of moving become very high. Lancium’s moat therefore depends less on customer lock-in and more on
              pre-commit differentiation: site control, ERCOT know-how, patent history around controllable loads,
              partner willingness, and reputation for getting large-load projects through approvals. That moat is real
              but local. If power abundance normalizes, or if integrated rivals replicate the same Texas playbook with
              bigger balance sheets, Lancium’s advantage could compress. The moat is strongest in a power-constrained
              Texas environment and weakest when buyers decide they would rather buy a full cloud or full campus stack
              from a better-capitalized operator.
            claimRefs:
