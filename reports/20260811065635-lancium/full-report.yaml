      - number: '8.2'
        title: Financing Context and Price Support
        blocks:
          - type: paragraph
            body: >-
              The best current support for Lancium’s headline valuation is that sophisticated counterparties continue to
              commit attention, capital, and workload importance to the ecosystem around Abilene. The Blue Owl / Crusoe
              JV and the Nvidia investment reporting both matter because they suggest that third parties see real asset
              value, not just concept-stage optionality. OpenAI’s own infrastructure notes raise confidence that the
              flagship site is operationally meaningful. At the same time, financing support should not be confused with
              a guaranteed attractive entry price for new investors. Public sources still do not expose the full
              preference stack, debt protections, or customer economics. That means the mark can be simultaneously
              credible as a private financing outcome and still unattractive as a fresh underwriting basis unless more
              downside protection or de-risking evidence appears.
            claimRefs:
              - CV002
              - CV003
              - CV009
              - CV010
              - CV011
