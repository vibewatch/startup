      - number: '2.5'
        title: Market Verdict for Lancium
        blocks:
          - type: paragraph
            body: >-
              Lancium is well positioned inside one of the most supply-constrained parts of the AI economy, but it
              should not be valued as though it automatically captures all AI data center growth. The market case for
              Lancium rests on a simple chain: AI demand is growing faster than grid-deliverable power; large AI
              campuses are becoming bigger and more capital intensive; and operators need partners who can secure land,
              power, and community acceptance ahead of traditional timelines. That is real. JLL’s investment supercycle,
              Bloom’s Texas concentration, OpenAI’s Stargate disclosures, and CBRE’s low vacancy data all support it.
              But public evidence also argues against lazy TAM inflation. Queue data are bloated by speculative
              proposals, customer demand can shift across geographies, and even a flagship site like Abilene has already
              seen additional-scope changes. The right market conclusion is that Lancium has entered a market with
              excellent demand fundamentals and scarce strategic inputs, while still needing to prove how much of the
              campus economics it can actually retain, how repeatable its execution model is outside Abilene, and
              whether “clean campus” branding remains robust under rising regulatory scrutiny.
            claimRefs:
              - CM016
              - CM021
              - CM022
