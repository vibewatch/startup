      - number: '1.3'
        title: Funding History, Strategic Stakeholders, and Current Capital Base
        blocks:
          - type: paragraph
            body: >-
              Lancium’s financing history now spans three distinct layers: project-level third-party capital at Abilene,
              company-level equity support for the broader Clean Campus platform, and 2025–2026 balance-sheet funding
              tied directly to Stargate scale-up. The first major validation point in the current cycle came in October
              2024, when Crusoe, Blue Owl Capital, and Primary Digital Infrastructure announced a $3.4 billion joint
              venture to fund a 206 MW, 998,000-square-foot build-to-suit data center on Lancium’s Abilene land. In
              November 2024, Bloomberg reporting summarized by Data Center Dynamics said Blackstone had invested $500
              million into Lancium itself and linked that capital to a plan for five West Texas campuses totaling 5 GW
              by 2028. In October 2025, Lancium announced a separate $600 million debt financing package arranged by
              Santander, with Cantor Fitzgerald as strategic advisor, to advance Clean Campus development beginning with
              Abilene. The capital stack shifted again in August 2026 when Reuters reported that Nvidia would invest an
              initial $2 billion for roughly 20% of Lancium, with another $1 billion available if specified milestones,
              including grid-related thresholds, are achieved. Reuters said the transaction valued Lancium and its land
              and power assets at roughly $10 billion enterprise value and could support a 2027 IPO process. Read
              conservatively, publicly disclosed company-level financing totals at least $1.1 billion before counting
              the new Nvidia commitment, while project-level third-party capital at Abilene is much larger. The capital
              formation story is therefore one of escalating strategic validation—but also of increasing dependence on a
              small set of hyperscale and infrastructure counterparties.
