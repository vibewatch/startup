  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue Model: Campus Development, Powered Land, and Partner-Led Monetization'
        blocks:
          - type: paragraph
            body: >-
              Lancium does not present as a conventional software company with published ARR, seats, or usage-based
              pricing. Public materials instead point to an infrastructure-led model built around securing, designing,
              and energizing large AI campuses, then monetizing that position through land control, development rights,
              power infrastructure, partner arrangements, and long-duration lease or service economics. The 2024 Abilene
              amendment allowing multiple clients, the 2024 Blue Owl / Primary / Crusoe JV for a long-term leased 206 MW
              data center, and the 2025 debt package backing Abilene all suggest that Lancium monetizes campus readiness
              and capital structure rather than a simple retail power spread. That does not mean the business is weak;
              it means the correct lens is project-backed digital infrastructure. Public evidence is still insufficient
              to determine how much of total site economics stay at Lancium versus migrating to operators, lenders, or
              special-purpose entities.
