        title: Mitigation Exists, but Monitoring Must Stay Active
        blocks:
          - type: paragraph
            body: >-
              The encouraging part of the record is that Lancium is not ignoring its exposure. Site-control work,
              community messaging, and ecosystem alignment are all visible mitigants. The company has also shown an
              ability to attract sophisticated partners, which normally indicates that third parties have performed some
              private diligence. But public mitigation maturity is still stronger on narrative than on disclosed
              operating metrics. There is not enough transparent evidence on cybersecurity controls, uptime history,
              safety performance, or customer concentration to convert every major risk into a routine process item.
              That puts more weight on management depth and execution coordination. Investors should therefore treat
              mitigation as real but incomplete and should insist on monitorable milestones—queue progress, water plans,
              signed capacity, campus build cadence, and partner commitments—rather than relying on reputation alone.
            claimRefs:
              - CR022
              - CR023
              - CR026
              - CR027
              - CR030
              - CR036
              - CR037
          - type: table
            tableRef: TR004
            claimRefs:
              - CR021
              - CR027
              - CR036
              - CR037
          - type: table
            tableRef: TR005
            claimRefs:
              - CR030
              - CR031
              - CR039
              - CR040
      - number: '7.5'
        title: Risk Verdict
        blocks:
          - type: paragraph
            body: >-
              Lancium is best understood as a high-upside but high-residual-exposure infrastructure platform. The
              company has real strengths: compelling sites, serious counterparties, Texas-market relevance, and strong
              thematic demand. None of that changes the basic underwriting fact that a few risks dominate the whole
              outcome set. Queue disruption, flagship-site impairment, anchor-ecosystem weakening, or capital-market
              tightening could each move the investment case materially on their own. By contrast, smaller operational
              blemishes are likely survivable if the large milestones keep landing. The right posture is not to dismiss
              the company on risk grounds, but to price it as a milestone-sensitive execution story with concentration
              and disclosure discounts. That means active diligence and explicit kill criteria are mandatory conditions
              for conviction.
            claimRefs:
              - CR001
              - CR016
              - CR030
              - CR033
              - CR039
              - CR040
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Framework and Current Call
        blocks:
          - type: paragraph
            body: >-
              Lancium should not be valued with a reflexive software playbook. Public evidence points to a hybrid model:
              site origination, power orchestration, partner-led campus development, and eventual lease or
              infrastructure-style monetization. That makes milestone quality more important than nominal narrative
              velocity. The August 2026 Nvidia reporting supports a real premium market signal, but it does not solve
              the core underwriting problem that public revenue, margin, and contract data remain sparse. Investors are
              effectively paying for a combination of flagship-site proof, future campus conversion, and scarce AI-power
              positioning. The right public-evidence call is therefore not buy at any price. It is a disciplined track /
              research-more stance that stays constructive on company quality while refusing to collapse uncertainty
              into false precision.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
