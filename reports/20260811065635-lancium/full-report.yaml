      - number: '3.3'
        title: Capability, Pricing, and Distribution Comparison
        blocks:
          - type: paragraph
            body: >-
              On raw distribution, incumbents such as QTS, Digital Realty, Equinix, and Switch retain an advantage: they
              already operate broad portfolios, offer mature colocation products, and possess deep enterprise
              procurement relationships. On vertically integrated AI infrastructure, Crusoe and CoreWeave look stronger
              because they combine customer-facing compute with infrastructure control. Lancium’s comparative strength
              is narrower but distinctive: it speaks the language of Texas power, large-load site design, and campus
              readiness. That matters where a buyer prioritizes fast access to deliverable power over a global
              interconnection fabric. Weaknesses are equally clear. Lancium does not publish list pricing, does not show
              broad customer-logo portfolios, and relies heavily on partner operators for customer surface area. In
              competitive bake-offs, that could force Lancium to win on speed-to-power, site economics, or partner fit
              rather than on brand familiarity.
