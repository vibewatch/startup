  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What Lancium Delivers in Customer Workflow Terms
        blocks:
          - type: paragraph
            body: >-
              Lancium’s customer-facing product is best described as AI-ready powered-campus enablement. The company
              identifies power-advantaged sites, secures ERCOT-ready interconnection and transmission positioning,
              integrates behind-the-meter resources such as battery storage and solar, and then hands a prepared campus
              to partners or hyperscale counterparties that need massive compute capacity. That means the customer
              workflow starts well before server installation: land selection, power modeling, grid integration,
              community and water planning, and partner-specific facility design all happen before revenue-grade compute
              goes live. Lancium’s “Clean Campus” branding captures this broader operating scope. The product is
              therefore neither just a land bank nor just a load-management tool; it is a physical-digital
              infrastructure layer meant to convert power complexity into a deployable AI campus.
