            body: >-
              Lancium’s customer map is unusual because the direct buyer is not always the end user. In some cases, a
              campus operator such as Crusoe or QTS appears to be the direct counterparty. In others, the economic
              sponsor is a hyperscale or frontier AI ecosystem partner such as OpenAI, Oracle, or an unnamed Fortune 100
              tenant. The end user is the AI workload itself—model training, inference, or cloud capacity sold to
              downstream compute buyers. This layered structure means Lancium should be segmented by buyer/user/payer
              role, by campus phase, and by geography. It also means customer quality is less about logo count and more
              about whether a small number of sophisticated counterparties are committing real MW and long-duration
