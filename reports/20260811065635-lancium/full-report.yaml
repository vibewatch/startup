              - CV040
      - number: '8.4'
        title: Downside, Entry Discipline, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Entry discipline matters because Lancium’s downside transmission is straightforward. If ERCOT timing
              weakens, Abilene scope changes, customer concentration persists, or financing terms prove less favorable
              than the headlines imply, valuation should reset lower. None of those outcomes require the company to fail
              outright; they only require the premium narrative to narrow. That is why the remaining diligence asks are
              so important. Investors should request the cap-table and preference waterfall, debt covenants and
              milestone triggers, campus-level contract economics, energization schedules, and water-resource plans
              before treating the current valuation as compelling. A lower entry price or stronger disclosure could
              improve the setup meaningfully. Without one of those two things, new money is being asked to absorb too
              much uncertainty at too high a price.
            claimRefs:
              - CV026
              - CV027
              - CV028
              - CV029
              - CV035
              - CV036
              - CV037
          - type: table
            tableRef: TV005
            claimRefs:
              - CV026
              - CV027
              - CV028
              - CV037
          - type: table
            tableRef: TV006
            claimRefs:
              - CV028
              - CV035
              - CV036
      - number: '8.5'
        title: Final Valuation Verdict
        blocks:
          - type: paragraph
            body: >-
              Lancium is a high-quality strategic asset story with an incompletely proven public economics story. That
              combination can justify serious investor attention, but it does not justify abandoning price discipline.
              The evidence supports calling the company strategically impressive, operationally promising, and
              valuation-sensitive. It does not support treating the reported August 2026 valuation as obviously
              mispriced in investors’ favor. The most defensible posture is to stay engaged, demand deeper diligence,
              and let milestones move the call. If Abilene continues to prove out, additional campuses convert, and
              economic disclosure improves, the valuation can remain premium and possibly grow into itself. If
              concentration or schedule issues persist, the present mark has room to compress. In short: strong company,
              medium confidence, high risk, stretched-but-plausible valuation.
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV039
              - CV040
