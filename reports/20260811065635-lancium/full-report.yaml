      - number: '2.3'
        title: Buyer, User, and Payer Segments
        blocks:
          - type: paragraph
            body: >-
              The buyer map for Lancium-like campuses has at least three layers. First are hyperscalers and frontier AI
              labs—OpenAI, Oracle, Meta, and similar actors—that ultimately need the compute and often anchor
              multi-hundred-megawatt commitments. Second are build-to-suit operators and AI infrastructure developers
              such as Crusoe or QTS that may act as the direct campus operator, construction lead, or lease
              counterparty. Third are capital providers and utilities that determine whether a proposed site becomes
              financeable and electrically deliverable. The user of the end product is the model-training or inference
              workload, but the payer can differ: sometimes the hyperscaler pays directly for reserved capacity,
              sometimes a campus operator raises capital and subcontracts with end users, and sometimes a structured
              project-finance stack absorbs construction risk ahead of occupancy. Lancium’s market advantage is that it
              can insert itself before those roles fully settle by controlling the scarce input—approved power-rich
              land—and then pairing it with a partner-specific campus design. The adoption path therefore does not look
              like a traditional SaaS funnel. It starts with land and power diligence, moves through interconnection and
              community viability, then into financing and operator selection, and only then into the familiar
              construction and GPU-deployment stages. This is why the market is high-value but lumpy: a single win can
              be worth hundreds of megawatts, yet every win requires multi-stakeholder alignment.
