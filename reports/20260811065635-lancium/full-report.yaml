  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Direct Peers, Incumbents, Adjacent Routes, and Status Quo'
        blocks:
          - type: paragraph
            body: >-
              Lancium’s competitor set is best organized by job-to-be-done rather than brand adjacency. For a buyer
              needing a large AI campus, the relevant alternatives include: direct powered-campus developers with energy
              integration narratives (Crusoe, Applied Digital, Soluna); incumbent data center and colocation operators
              with large land banks and enterprise distribution (QTS, Digital Realty, Equinix, Switch); AI-cloud or
              vertically integrated infrastructure providers that can internalize more of the stack (CoreWeave, Oracle,
              and self-build hyperscaler routes); and the status quo option of staying within core metros despite longer
              waits and tighter supply. Lancium is unusual because it entered through controllable-load and
              grid-orchestration logic rather than through traditional colocation. That gives it a specific niche, but
              also means some rivals beat it on customer reach, branded compute, or financing track record while others
              beat it on renewable adjacency or deployment speed in modular designs.
