      - number: '3.2'
        title: Peer Profiles and Strategic Direction
        blocks:
          - type: paragraph
            body: >-
              The closest direct strategic peer is Crusoe, which increasingly combines AI cloud, modular data centers,
              onsite power, and large campus development. Applied Digital is another serious comparator because it
              explicitly markets repeatable “AI Factories” and publicizes large leased capacity. Soluna is smaller but
              important as a West Texas clean-power competitor that turns renewable curtailment into compute-oriented
              sites. QTS, Digital Realty, Equinix, and Switch represent the incumbent alternative: they offer more
              mature customer access, trust posture, and multi-metro portfolios, but often target broader colocation and
              interconnection needs rather than Lancium’s power-first thesis. CoreWeave and Oracle matter differently.
              They are not just landlords; they can move budget control toward bundled cloud or AI-factory solutions,
              reducing the need for an independent powered-land intermediary if they can secure sites themselves. The
              result is a market where Lancium’s direct rivals are fewer than its functional substitutes.
