      - number: '8.4'
        title: 下行、入场纪律与尽调请求
        blocks:
          - type: paragraph
            body: >-
              入场纪律重要，因为 Lancium 的下行传导路径很直接。只要 ERCOT 节奏变弱、Abilene
              范围变化、客户集中度延续，或融资条款不如头条暗示的有利，估值就应下修。上述结果都不要求公司彻底失败；只需要溢价叙事收窄。因此，剩余尽调请求很关键。投资人应先索取股权结构和优先清偿瀑布、债务契约和里程碑触发条款、园区级合同经济性、送电时间表，以及水资源计划，再把当前估值视为有吸引力。更低入场价格或更强披露，都能显著改善格局。两者都没有时，新资金需要在过高价格上吸收太多不确定性。
            claimRefs:
