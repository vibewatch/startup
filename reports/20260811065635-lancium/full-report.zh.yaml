      - number: '2.2'
        title: 用容量、投资和电力稀缺测算机会规模
        blocks:
          - type: paragraph
            body: >-
              最强的公开测算证据是物理容量，而不是收入。JLL 2026 年展望预计，到 2030 年全球数据中心容量可能达到约 200 GW，2025 至 2030 年新增约 97 GW，意味着约 14%
              CAGR；若把房地产、债务和 IT 装配合并计算，累计投资约 $3 trillion。CBRE 显示，短期市场已经紧张：2026 年一季度北美库存同比增长 33%，但美国前四大市场空置率降至纪录低位，例如
              Northern Virginia 0.3%、Dallas-Fort Worth 1.8%。Bloom 2026 年电力调查把论点推进到 Lancium 的地盘：美国 IT 负载可能从 2025 年约 80 GW
              升至 2028 年约 150 GW；得州到 2028 年可能超过 40 GW，接近美国总需求的 30%；到 2030 年，约三分之一数据中心可能使用 100% 现场电力。OpenAI
              自身披露也支持同一方向。Stargate 启动时单独设定了到 2029 年全美 10 GW 的目标；到 2026 年中，OpenAI 称其已与 Oracle 和其他伙伴开发超过 5 GW。对 Lancium
              而言，实际结论是，可服务市场以数十 GW 的美国园区需求计量；但可实现份额取决于有多少开发商真的能拿到电力和社区许可，而不是抽象需求是否存在。
