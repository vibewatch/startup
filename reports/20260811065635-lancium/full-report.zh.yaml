            body: >-
              最能说明问题的公开技术材料，是 Lancium 的专利表面和 ERCOT
              材料。这些专利反复描述“灵活数据中心的分布式电力控制”，包括本地站点控制器、远程主控系统、集群级协调，以及根据电网或表后电力条件转移工作负载。这些文件说明，Lancium
              的技术起点不是静态房地产，而是大型灵活负荷如何与电网互动的控制逻辑。Lancium 后来的官方材料把这套控制传承转译为站点工程：带变电站、储能、太阳能和伙伴就绪基础设施的 GW 级园区。OpenAI 和
              Arrington 证据又增加一层，显示这些站点如何支撑直达芯片的液冷 AI 楼宇和高密度 GPU 网络。因此，架构是分层的：站点发起、电力编排、物理赋能，以及面向租户的算力建设。
