chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              Lancium 自称是得州的大规模带电土地和能源基础设施开发运营商，服务先进计算负载。公司当前定位不是通用托管机房业主，而是专门为 GW 级 AI
              园区拿地、拿输电互连、建设土建和电气基础设施、配置表后资源；这些园区必须比传统公用事业和超大规模建设周期更快落地。2026 年官方公司材料称，Lancium 成立于 2017 年，总部位于得州 The
              Woodlands，正在围绕 ERCOT 建设一组“Clean Campus”：单个园区从 1 GW 起步，可扩至 5+ GW。公司把旗舰 Abilene 站点呈现为 Stargate I，也是
              OpenAI/Oracle/SoftBank Stargate 生态中第一个投入运营的园区。Lancium
              的差异化主张是，大型计算负载可以成为电网资产，而不是纯粹的电网负担；做法是把已获批输电接入、电力编排、现场储能和太阳能，以及灵活运行控制组合起来。2022 年早期报道显示，公司当时在营销面向 ERCOT
              可控负荷策略的软件，并把 Abilene 和 Fort Stockton 的空间租给加密矿工及其他高耗电租户；这解释了为什么公开描述 Lancium 时，既有旧的“脱碳算力”表述，也有新的 AI
              基础设施重心。因此，商业模式已经从灵活负荷平台运营商，演进为电力资源充沛的 AI 园区战略业主兼开发商；收入很可能分布在站点开发、长期基础设施租赁和能源管理服务之间，但具体分部经济性仍未披露。
