        - 对 Lancium 式电力获取风险暴露更低
      - - Applied Digital
        - 面向 AI 的数字基础设施
        - 上市 AI 基础设施参照
        - 更接近 AI 园区热度
        - 资产组合和运营模式不同
      - - CoreWeave
        - AI 云 / 基础设施平台
        - 高关注度 AI 基础设施估值参照
        - 有助于判断投资者风险偏好和 AI 资本开支背景
        - 云 / 服务经济性与 Lancium 差异很大
    enumerationScope:
      coverage: sample
      basis: Table captures the most useful directional public references, not an exhaustive or perfectly matched peer set.
    notes: 可比组只能给方向，因为没有上市同业精确匹配 Lancium 的业务组合。
