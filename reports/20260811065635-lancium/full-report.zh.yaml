  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险是第一道门槛
        blocks:
          - type: paragraph
            body: >-
              Lancium 的第一大风险桶是监管和法律，因为大型得州 AI 园区依赖电网流程、州政治、用水审视和基础设施许可同向推进。2026 年 8 月得州审计暂停报道之所以重要，正因为 Lancium
              卖的是送电速度；任何排队或核验中断，都会直接削弱核心商业承诺。ERCOT 专利许可文件显示，Lancium 不只是贴近得州市场结构，而是与其深度绑定；这在州内是竞争优势，到州外就是可迁移性风险。BearBox
              意见本身在保留记录中并不是足以终结业务的事件，但它确认 IP 和法律干扰属于公司历史的一部分。环境和用水监管同样重要，因为园区级 AI 基础设施嵌在真实许可和社区资源制度中，而不只是私人合同逻辑。
