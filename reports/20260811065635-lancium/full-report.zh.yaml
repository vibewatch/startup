      - number: '2.5'
        title: Lancium 的市场结论
        blocks:
          - type: paragraph
            body: >-
              Lancium 在 AI 经济中供给最受约束的环节之一占了好位置，但不能按它自动吃下所有 AI 数据中心增长来估值。Lancium 的市场论点建立在一条简单链条上：AI 需求增长快于电网可交付电力；大型 AI
              园区越来越大、资本越来越密集；运营商需要能在传统时间线之前锁定土地、电力和社区接受度的伙伴。这条链条真实存在。JLL 的投资超级周期、Bloom 对得州集中的判断、OpenAI 的 Stargate 披露，以及
              CBRE 的低空置率数据都支持它。但公开证据也反对懒惰的 TAM 膨胀。投机项目把排队数据撑大，客户需求可以跨地区迁移，就连 Abilene 这样的旗舰站点也已出现增量范围变化。正确的市场结论是：Lancium
              进入了一个需求基本面优秀、战略输入稀缺的市场；但它仍要证明自己到底能留住多少园区经济性，Abilene 之外的执行模型有多可复制，以及“clean campus”品牌在监管审视上升后能否继续站稳。
