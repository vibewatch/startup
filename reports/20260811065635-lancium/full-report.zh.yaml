      - number: '1.2'
        title: 领导层、治理与创始人连续性
        blocks:
          - type: paragraph
            body: >-
              公开领导层证据在高管层面较充分，董事会层面则更薄。当前官网标记显示，Michael McNamara 是首席执行官兼联合创始人，Ali Fenn 是总裁，Michael Morel 是首席技术官，Niraj
              Javeri 是首席财务官，Paul Dillbeck 是首席开发官，Scott McFarland 是首席公司事务官。2025 年 3 月 Dillbeck 任命公告尤其有信息量：它把 Lancium
              描述为正在扩张一个需要重项目融资、法律和基础设施能力的开发管线。这一任命重要，因为 Lancium 的价值创造越来越取决于园区执行，而不再只是软件驱动的电力优化。2022 年较早的独立报道将 Raymond
              Cline 列为联合创始人，并强调公司的可控负荷软件根基；但当前官方材料突出 McNamara
              和现有运营班底，没有给出完整的历史创始人叙事或公开董事会名单。由此形成一个轻度治理披露缺口：投资者能识别高级运营者，却无法只靠官网还原董事会委员会、独立董事覆盖或创始期全部角色变化。总体看，管理层班底现在已经对准
              Lancium 的真正瓶颈——站点开发、结构化融资、公用事业接口和利益相关方管理；但围绕 McNamara 的关键人物依赖仍高，因为他是战略、政策定位、资本形成和社区沟通的公共面孔。
