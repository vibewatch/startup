    summary: 建议来自一个权衡：战略验证很强，但经济性可见度不完整，且报道价格带溢价。
    data:
      nodes:
        - id: a
          label: 旗舰验证真实存在
        - id: b
          label: AI 电力稀缺支撑溢价
        - id: c
