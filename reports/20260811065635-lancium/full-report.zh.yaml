        - 若市场折价集中度和延迟的现金流转化，估值可能落在 ~$4B-$6B
        - 账面标价快速压缩
        - 任何实质性旗舰受损都可能触发
      - - 上行重估触发项
        - 更深披露叠加新投资者价格纪律
        - 不改变公司质量，也能改善风险调整后回报
