  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：带电土地和 AI 园区基础设施，而非通用托管
        blocks:
          - type: paragraph
            body: >-
              Lancium 面对的市场比“数据中心”窄，又比“电网软件”宽。公司处在带电土地获取、高压互连、表后资源设计和大型 AI 负载园区编排的交汇处。合适的比较对象不是低于 20 MW
              的企业批发托管，也不是纯软件电力管理供应商，而是能够以可信速度交付 200 MW 到 1+ GW 园区的开发商和运营商子集。OpenAI 的 Stargate 计划、Bloom 对 GW 级园区的调查、JLL
              的建设成本数据都显示，AI 基础设施已经从 MW 级套间，迁移到土地、输电和发电架构决定成败的“AI 工厂”园区。Lancium
              自身定位也映射了这次转移：它卖的是园区就绪，而不只是机架空间。因此，这个市场包含的支出覆盖土地控制、变电站和输电建设、电力资源整合、电池和太阳能附加、备用发电架构、园区土建，以及对大块电力的长期合同权利；排除项包括芯片制造、云软件订阅、企业自有机房，以及不发起新增电力富集园区的成熟
              REIT 组合。这个边界重要，因为估值驱动因素是可交付电力和获批土地的稀缺性，而不是 AI 半导体的全部名义价值或全球数据中心资本开支总额。
