  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Lancium 的客户旅程是一条长周期基础设施路径，从需求赞助方走向上线工作负载，中间有多方参与。
    data:
      items:
        - label: 需求赞助方已识别
          description: AI 实验室、超大规模云厂商或运营商意识到需要大型 AI 容量
          buyerTrigger: Need for very large power-rich site
          lanciumValue: Powered-land and ERCOT-aware campus thesis
          conversionBarrier: Few sites can actually deliver power
        - label: 站点和电力尽调
          description: 买方测试位置、公用事业路径、用水和社区可行性
          buyerTrigger: Need bankable infrastructure path
          lanciumValue: Pre-assembled campus readiness
          conversionBarrier: Interconnect and permitting risk
        - label: 合作伙伴 / 租户结构设计
