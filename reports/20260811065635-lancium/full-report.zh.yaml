      - CV022
  - id: TV005
    title: 打破论点与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 旗舰站点受损
        - Abilene 实质性延误、缩小规模或需求重排
        - 打断核心验证和溢价叙事
        - 用更低区间重新测算
      - - ERCOT / 通电延误
        - 排队或里程碑实质性落空
        - 削弱快速拿电优势
        - 推迟或降低敞口
      - - 资本结构意外
        - 优先权或债务条款比预期更苛刻
        - 降低新资金的有效价值
        - 要求价格重置，或停止推进
      - - 集中度持续
        - 少数生态锚点之外没有拓宽
        - 限制平台溢价
        - 提高折现率，降低确信度
      - - 经济性披露不及预期
        - 合约经济性或利润率显著弱于预期
        - 叙事未能转化为回报
        - 转向回避 / 等待姿态
    notes: 这些是投资论点被打破的触发项，而不是运营 KPI。
    claimRefs:
      - CV026
      - CV027
      - CV028
      - CV037
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 股权结构和优先权
        - 完整清算瀑布和投资者权利
        - 决定真实入场经济性
        - 向公司 + 律师索取
      - - 债务条款
        - 契约、触发项和补救措施
        - 影响下行和稀释压力
        - 贷款方 / 管理层尽调
      - - 客户经济性
        - 电价、租赁结构和利用率
        - 把战略验证转成财务验证
        - 商业尽调
      - - 通电排期
        - 按站点列示的当前里程碑计划
        - 时间价值的核心决定因素
        - 项目 / 公用事业尽调
      - - 用水和资源计划
        - 园区层面的用水预算和缓释措施
        - 影响许可和社区耐受度的关键
        - 环境尽调
    notes: 缺少这些材料，当前公开估值标记比叙事看起来更难支撑投资测算。
    claimRefs:
      - CV028
      - CV035
      - CV036
