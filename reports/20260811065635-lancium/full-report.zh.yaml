        title: 切换成本、多归属与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              这个市场的切换成本不对称。园区承诺落定前，买方可以在多个地区和开发商之间多归属寻找，这意味着 Lancium
              并不像封闭软件平台那样控制需求。电力权利、土地和站点专属工程锁定后，迁移成本会变得很高。因此，Lancium 的护城河少靠客户锁定，多靠承诺前差异化：站点控制、ERCOT
              经验、围绕可控负荷的专利历史、伙伴合作意愿，以及推动大负荷项目穿过审批的声誉。这条护城河真实存在，但带有本地性。如果电力充裕常态化，或者综合型对手用更大的资产负债表复制同一套得州打法，Lancium
              的优势可能被压缩。护城河在电力受限的得州环境下最强；当买方决定宁愿从资本实力更强的运营商那里购买完整云或完整园区堆栈时，它最弱。
