      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              Lancium 最大的正向驱动不是抽象的 AI 热情，而是尖锐的电力稀缺。CBRE、JLL、Bloom、Data Center Knowledge、Utility Dive 和 Texas Tribune
              都指向同一个结论：新 AI 园区的主约束已经是电力可得性，而不是原始资本或基础房地产。这利好持有大体量、获批、电力条件优越站点的业主。得州尤其重要，因为相比 Northern Virginia 或
              California 等传统市场，它仍有土地、对大型能源负载的工业容忍度，也给自备电力模式留出更多空间。与此同时，约束正在加剧。Bloom 称开发商和公用事业机构在送电时间上越来越错位；JLL
              提到一线市场平均等待超过 4 年；Abbott 2026 年 8 月审计令说明，社区、用水和电费承担者政治现在也可能打断原本有利的得州叙事。Data Center Knowledge
              显示，超大规模云厂商更愿意考虑表后电力，但这不是免费选项：天然气许可、用水和资本成本都会站到台前。客户把速度看得比教科书式可持续纯度更重要时，Lancium
              的定位最强；但如果天然气备用或不透明排队位置看起来与清洁能源品牌相冲突，同一机制也会让公司承受反弹。因此，这个市场最好理解为结构上有吸引力、运营上不容犯错。
