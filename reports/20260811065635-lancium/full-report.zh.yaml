      - number: '1.4'
        title: 里程碑、扩张路径与早期负面信号
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，公司正以罕见速度从可控负荷试验转向超大规模 AI 基础设施。2024 年 7 月，Lancium 和 Crusoe 披露 Abilene 第一阶段 200 MW，并给出通往 1.2 GW
              的路径。到 2024 年 8 月，Lancium 强调一份修订后的 Abilene 经济协议，将允许园区承载多个客户，而不是继续绑定单一比特币主导模式。2025 年 3 月出现两个重要拐点：Crusoe
              启动下一批 6 栋 Abilene 建筑，把该站点推进到 8 栋楼、400 万平方英尺；Lancium 又以零成本向 ERCOT 许可一组重要专利，加速可控负荷资源参与。到 2026 年 7 月，Lancium
              已宣布在 Childress 与 Crusoe 的第二项合作，以及在 Hall County 与 QTS 的合作，两者都围绕 Lancium 控制的土地和电力基础设施设计。与此同时，审视也在加强。OpenAI
              2026 年 8 月的基础设施说明强调闭环冷却、社区建设，以及 Abilene 在训练 GPT-5.5 中的作用；得州媒体和监管机构则聚焦数据中心是否完整披露用水和用电影响。Abbott 州长 2026 年 8
              月的审计令、Texas Tribune 对全州不透明排队的报道，以及 Data Center Dynamics 关于 Oracle/OpenAI 取消进一步 Abilene 扩建的报道，都说明 Lancium
              的战略重要性上升得比公开透明度更快。公司的里程碑节奏无疑强劲；问题在于，园区计划从 Abilene 向外扩张时，资本部署、伙伴范围和电网审批能否保持同步。
