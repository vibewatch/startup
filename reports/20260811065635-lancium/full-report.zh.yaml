      - number: '8.3'
        title: 可比公司与情景区间
        blocks:
          - type: paragraph
            body: >-
              可比分析在这里主要用于划边界。Ormat 有参考价值，因为它显示公开市场如何给专业能源基础设施定价，但它不是 AI 园区开发商。Equinix 和 Digital Realty
              有参考价值，因为它们是规模化上市数据中心平台，却不像 Lancium 这样集中在 Texas 的带电土地和生态系统。Applied Digital 和 CoreWeave 更贴近 AI
              基础设施热度，但变现结构差异很大。结论不是一个干净的单一可比组，而是三角定位。因此，情景分析比一句倍数更重要。牛市情景需要旗舰项目按期执行，并把多个园区转化出来；熊市情景只需要范围、排队进度或变现出现几次滑坡，就能把当前名义估值大幅压缩。
