            body: >-
              Lancium 的客户地图不寻常，因为直接买方并不总是终端用户。有些情况下，Crusoe 或 QTS 这样的园区运营商似乎是直接交易对手。另一些情况下，经济赞助方是 OpenAI、Oracle 或未具名
              Fortune 100 租户这类超大规模或前沿 AI 生态伙伴。终端用户是 AI 工作负载本身——模型训练、推理，或卖给下游算力买家的云容量。这种分层结构意味着，Lancium 应按买方 / 用户 /
              付款方角色、园区阶段和地理位置切分。它也意味着，客户质量少看客户标识数量，多看少数成熟交易对手是否承诺真实 MW 和长期入驻。
