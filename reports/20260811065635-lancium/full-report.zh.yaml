      - number: '1.3'
        title: 融资历史、战略股东与当前资本基础
        blocks:
          - type: paragraph
            body: >-
              Lancium 的融资历史如今分成三层：Abilene 的项目级第三方资本、更广 Clean Campus 平台的公司级股权支持，以及 2025–2026 年直接绑定 Stargate
              扩张的资产负债表资金。本轮周期的第一个重大背书出现在 2024 年 10 月，当时 Crusoe、Blue Owl Capital 和 Primary Digital Infrastructure 宣布成立
              $3.4 billion 合资项目，为 Lancium Abilene 土地上的 206 MW、998,000 平方英尺定制数据中心提供资金。2024 年 11 月，Data Center Dynamics
              汇总的 Bloomberg 报道称，Blackstone 已向 Lancium 本身投资 $500 million，并把这笔资金同到 2028 年在西得州建设 5 个、合计 5 GW 园区的计划联系起来。2025
              年 10 月，Lancium 又宣布由 Santander 安排、Cantor Fitzgerald 担任战略顾问的 $600 million 债务融资包，用于推进从 Abilene 开始的 Clean
              Campus 开发。2026 年 8 月，资本结构再次变化：Reuters 报道称 Nvidia 将以初始 $2 billion 投资取得 Lancium 约 20%
              股权；若实现包括电网门槛在内的指定里程碑，另有 $1 billion 可用。Reuters 称，这笔交易把 Lancium 及其土地和电力资产的企业价值定在约 $10 billion，并可能支持 2027 年
              IPO 流程。保守看，公开披露的公司层面融资在计入新的 Nvidia 承诺前至少有 $1.1 billion；Abilene
              的项目级第三方资本则大得多。因此，资本形成故事是一条战略背书不断升级的曲线，但公司也越来越依赖少数超大规模和基础设施交易对手。
