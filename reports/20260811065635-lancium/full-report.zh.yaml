  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 框架与当前判断
        blocks:
          - type: paragraph
            body: >-
              Lancium 不能套用软件公司的惯性估值打法。公开证据指向一个混合模型：项目发起、电力编排、合作伙伴主导的园区开发，以及最终的租赁或基础设施式变现。因此，里程碑质量比叙事跑得快更重要。2026 年 8 月
              Nvidia 投资报道释放了真实的溢价市场信号，但没有解决核心承销问题：公开收入、利润率和合同数据仍然稀疏。投资人实际上是在为旗舰场地验证、未来园区转化，以及稀缺 AI
              电力卡位共同买单。因此，基于公开证据的判断不是不计价格买入，而是纪律性跟踪 / 继续研究：认可公司质量，同时拒绝把不确定性压成虚假的精确度。
