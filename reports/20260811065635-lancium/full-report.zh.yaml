      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Lancium 这类园区的买方地图至少有三层。第一层是超大规模云厂商和前沿 AI 实验室——OpenAI、Oracle、Meta 及类似主体——它们最终需要算力，也常常锚定数百 MW 级承诺。第二层是
              Crusoe 或 QTS 这类定制建设运营商和 AI
              基础设施开发商，它们可能担任直接园区运营方、施工牵头方或租赁交易对手。第三层是资本提供方和公用事业机构，它们决定拟议站点能否融资、能否送电。终端产品的用户是模型训练或推理负载，但付款方可以不同：有时超大规模云厂商直接为预留容量付费；有时园区运营商融资后与终端用户分包；有时结构化项目融资栈在入驻前吸收建设风险。Lancium
              的市场优势在于，它可以在这些角色完全落定前切入，控制稀缺输入——获批且电力充沛的土地——再配上面向特定伙伴的园区设计。因此，采用路径不像传统 SaaS
              漏斗。它从土地和电力尽调开始，穿过互连和社区可行性，进入融资和运营商选择，最后才到熟悉的建设和 GPU 部署阶段。这也是为什么该市场价值高却不连续：单个项目胜利可能对应数百 MW，但每次胜利都需要多方协调。
