  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: Lancium 隐含价值最受少数执行和披露变量牵动。
    data:
      items:
        - label: Abilene 执行
          value: 10
          detail: 最能撬动可信度的单一因素
          tone: warning
        - label: 客户经济性披露
          value: 9
          detail: 要把战略验证变成可承销证据，需要这项披露。
          tone: warning
        - label: ERCOT 时点确定性
          value: 8
          detail: 直接影响通电速度溢价
          tone: warning
        - label: 资本支持持久度
          value: 7
          detail: 影响建设节奏和市场信心
          tone: neutral
        - label: 多园区转化
          value: 8
          detail: 决定溢价能否从单一站点扩散出去
          tone: positive
    approximationNotes: 数值是供投委会使用的 1-10 敏感度评分，不是量化模型系数。
    claimRefs:
      - CV007
      - CV024
      - CV027
      - CV030
      - CV036
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 估值区间拉得较宽是合理的，因为可比对象选择和里程碑信心都会显著影响结果。
    data:
      items:
        - label: 悲观情景
          low: 4
          mid: 5
          high: 6
          displayValue: $4B-$6B
          detail: 范围变更、排队摩擦或经济性偏弱都会压缩溢价。
          tone: negative
        - label: 基准情景
          low: 7
          mid: 8.5
          high: 10
          displayValue: $7B-$10B
          detail: 稀缺性溢价仍能守住，但集中度和披露不足仍会压住热情。
          tone: warning
        - label: 乐观情景
          low: 12
          mid: 13.5
          high: 15
          displayValue: $12B-$15B
          detail: 旗舰项目执行到位、多园区转化打开后，公司有机会消化溢价估值。
          tone: positive
    approximationNotes: 这些区间是基于公开证据的投委会情景输出，不是管理层指引，也不是正式公平性意见。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV026
      - CV040
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Lancium 在市场拉力和战略验证上得分高，在经济性可见度和价格支撑上偏低。
    data:
      items:
        - label: 市场需求
          score: 9
          detail: AI 电力需求强，具备通电条件的园区也稀缺。
          tone: positive
        - label: 客户 / 资产验证
          score: 8
          detail: Abilene 和合作伙伴生态的验证真实存在，但集中度高。
          tone: positive
        - label: 护城河 / 差异化
          score: 7
          detail: ERCOT 熟练度和场址整合能力很重要，尤其是在 Texas。
          tone: positive
        - label: 经济性可见度
          score: 4
          detail: 收入、利润率和合同经济性的披露不完整。
          tone: warning
        - label: 执行 / 集中度风险
          score: 4
          detail: 少数里程碑主导整个价值叙事。
          tone: warning
        - label: 估值支撑
          score: 5
          detail: 这个价格说得通，但对新资金并不显然有吸引力。
          tone: neutral
        - label: 证据质量
          score: 5
          detail: 战略证据质量不错；可承销证据仍不完整。
          tone: neutral
    approximationNotes: 评分是基于留存公开证据综合得出的 0-10 序数判断，供投委会讨论使用。
    claimRefs:
      - CV011
      - CV012
      - CV015
      - CV016
      - CV031
      - CV032
      - CV034
