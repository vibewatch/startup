  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Lancium 的技术栈横跨土地与电力获取、控制逻辑、实体赋能和租户专用 AI 设施。
    data:
      layers:
        - label: 租户 AI 设施层
