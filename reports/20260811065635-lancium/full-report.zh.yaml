            body: >-
              Lancium 并不像一家传统软件公司那样公布 ARR、席位数或按用量计费。公开材料指向的是基础设施主导模型：公司锁定、设计并送电给大型 AI
              园区，再通过土地控制、开发权、电力基础设施、伙伴安排，以及长期租赁或服务经济性变现。2024 年允许多客户入驻的 Abilene 修订协议、2024 年 Blue Owl / Primary / Crusoe
              为长期租赁 206 MW 数据中心设立的合资项目，以及 2025 年支持 Abilene 的债务包，都说明 Lancium
              变现的是园区就绪和资本结构，而不是简单零售电价差。这不代表业务弱；它说明正确视角是项目支持的数字基础设施。公开证据仍不足以判断总站点经济性有多少留在 Lancium，又有多少迁移给运营商、贷款人或特殊目的实体。
