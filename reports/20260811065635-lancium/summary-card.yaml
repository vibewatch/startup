  topStrengths:
    - >-
      Lancium controls a rare combination of Texas site readiness, ERCOT-aware power positioning, and flagship AI-campus
      proof at Abilene.
    - >-
      The company has attracted unusually strong counterparties and capital signals, including OpenAI / Oracle ecosystem
      linkage, a large Blue Owl / Crusoe JV, and Reuters-reported Nvidia investment terms.
    - >-
      Public market and analyst evidence suggests power-ready AI campus capacity remains scarce, which supports premium
      strategic value for delivered sites.
  topRisks:
    - >-
      The valuation is still highly dependent on a small number of flagship sites, counterparties, and milestones rather
      than on diversified disclosed economics.
    - >-
      Public evidence remains thin on revenue, margins, contract structure, cap-table protections, and downside debt
      terms.
    - >-
      ERCOT timing, water scrutiny, scope changes at Abilene, or weaker-than-expected campus monetization could compress
      the premium quickly.
    - >-
      Operator and customer concentration remain material because public proof is strongest around Abilene and a few
      ecosystem anchors.
  unresolvedGaps:
    - Full cap-table, liquidation preference, pro-rata, and debt-covenant disclosure is not public.
    - Site-level customer economics, lease structure, and utilization remain too opaque for tight underwriting.
    - Public revenue, margin, burn, and cash-balance disclosure remain incomplete.
    - >-
      Campus-level water budgets, control-security detail, and broader retention / concentration schedules are not
      sufficiently disclosed.
