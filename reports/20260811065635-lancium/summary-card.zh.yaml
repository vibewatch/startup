  topStrengths:
    - Lancium 手里握着少见组合：德州场地接近就绪、能围绕 ERCOT 电力机制布点，并在 Abilene 拿出旗舰 AI 园区证明。
    - 公司吸引了异常强的交易对手和资本信号，包括与 OpenAI / Oracle 生态的连接、大型 Blue Owl / Crusoe JV，以及 Reuters 报道的 Nvidia 投资条款。
    - 公开市场和分析师证据显示，可接入电力的 AI 园区容量仍然稀缺，已交付场地因此具备溢价战略价值。
  topRisks:
    - 估值仍高度依赖少数旗舰场地、交易对手和里程碑，而不是多元且已披露的经济性。
    - 公开证据对收入、利润率、合同结构、股权条款保护和下行情境下债务条款披露仍薄。
    - ERCOT 时间表、用水审查、Abilene 范围变化，或园区变现弱于预期，都可能迅速压缩溢价。
    - 运营方和客户集中度仍是实质风险，因为公开证明主要围绕 Abilene 和少数生态锚点。
  unresolvedGaps:
    - 完整 cap table、清算优先权、pro-rata 权利和债务契约披露尚未公开。
    - 单场地客户经济性、租约结构和利用率仍过于不透明，难以严格承销。
    - 公开收入、利润率、现金消耗和现金余额披露仍不完整。
    - 园区级用水预算、控制与安全细节，以及更广泛的留存 / 集中度明细披露仍不足。
