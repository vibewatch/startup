chapter:
  number: 2
  title: Market Analysis
  summary: 'Lancium operates in the power-constrained edge of the AI data center market: the subset of demand that needs gigawatt-scale campuses, fast interconnection, and credible behind-the-meter power design rather than standard retail colocation. Public 2026 market sources point to a genuine supercycle—JLL projects nearly 100 GW of new data center capacity and up to $3 trillion of investment by 2030, while Bloom expects Texas alone to exceed 40 GW by 2028—but they also show that power, permitting, and community scrutiny now matter more than fiber alone. For Lancium, market attractiveness is high, but the serviceable opportunity is governed by speed-to-power and partner execution, not by generic TAM headlines.'
sections:
- id: market-boundary
  title: 'Market Boundary: Powered Land and AI Campus Infrastructure, Not Generic Colocation'
  body: 'Lancium’s relevant market is narrower than “data centers” and broader than “grid software.” The company sits at the junction of powered land acquisition, high-voltage interconnection, behind-the-meter resource design, and campus orchestration for large AI workloads. That means the right comparison set is not enterprise wholesale colocation below 20 MW, nor software-only power-management vendors, but the subset of developers and operators that can deliver 200 MW-to-1+ GW campuses with credible speed-to-power. OpenAI’s Stargate plans, Bloom’s survey of gigawatt-scale campuses, and JLL’s construction-cost data all show that AI infrastructure has migrated from megawatt-scale suites toward “AI factory” campuses where land, transmission, and generation architecture are decisive. Lancium’s own positioning mirrors that shift: it sells campus readiness, not only rack space. Included spend for this market therefore covers land control, substation and transmission buildout, power-resource
    integration, battery and solar add-ons, backup generation architecture, campus civil works, and long-duration contractual rights to massive blocks of power. Excluded spend includes chip manufacturing, cloud software subscriptions, enterprise server rooms, and stabilized REIT portfolios that do not originate new power-rich campuses. This boundary matters because the valuation driver is scarcity of deliverable power plus entitled land, not the full notional value of AI semiconductors or all global data center capex.'
