- id: market-size-and-supply-tightness
  title: Sizing the Opportunity Through Capacity, Investment, and Power Scarcity
  body: 'The strongest public sizing evidence is physical rather than revenue-based. JLL’s 2026 outlook projects that global data center capacity could reach roughly 200 GW by 2030, with about 97 GW added between 2025 and 2030, implying around 14% CAGR and roughly $3 trillion of cumulative investment when combining real estate, debt, and IT fit-out. CBRE shows that the near-term market is already tight: North American inventory rose 33% year over year in Q1 2026, yet vacancy across the top four U.S. markets fell to record lows such as 0.3% in Northern Virginia and 1.8% in Dallas-Fort Worth. Bloom’s 2026 power survey pushes the argument into Lancium territory: U.S. IT load could climb from roughly 80 GW in 2025 to about 150 GW in 2028, Texas could exceed 40 GW by 2028 and nearly 30% of total U.S. demand, and about one third of data centers may use 100% onsite power by 2030. OpenAI’s own disclosures support the same directional view. Stargate alone targeted 10 GW nationally by 2029 at launch,
    and by mid-2026 OpenAI said it already had more than 5 GW under development with Oracle and other partners. For Lancium, the practical conclusion is that the serviceable market is measured in tens of gigawatts of U.S. campus demand, but the realizable share depends on how many developers can actually secure power and community consent—not on whether demand exists in the abstract.'
