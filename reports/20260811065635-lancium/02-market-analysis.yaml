  - type: private-evidence-only
    severity: material
    topic: market-share
    missingEvidence: A verifiable measure of Lancium’s current share of Texas powered-land pipeline, including contracted MW, reserved MW, and active operator relationships.
    whyItMatters: Market position is strategically important, but public sources provide pipeline anecdotes rather than a comparable market-share denominator.
    diligencePath: Request internal pipeline data, MW under control by site, and competitive win/loss analysis versus QTS, Crusoe, and self-build alternatives.
