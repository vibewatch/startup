    severity: material
    topic: queue-speculation
    missingEvidence: A committed-versus-speculative breakdown of ERCOT large-load queue projects relevant to AI data centers.
    whyItMatters: Queue totals drive bullish market narratives, but if a large share is speculative the apparent addressable market may be overstated for everyone including Lancium.
    diligencePath: Request ERCOT, utility, or internal project-priority data that separates committed projects, posted security, and actual transmission milestones from aspirational requests.
    relatedQuestionRefs:
