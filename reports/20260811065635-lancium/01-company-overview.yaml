- id: leadership-and-governance
  title: Leadership, Governance, and Founder Continuity
  body: 'Public leadership evidence is good at the executive level and thinner at the board level. Current official site markup identifies Michael McNamara as chief executive officer and co-founder, Ali Fenn as president, Michael Morel as chief technology officer, Niraj Javeri as chief financial officer, Paul Dillbeck as chief development officer, and Scott McFarland as chief corporate affairs officer. The March 2025 Dillbeck appointment release is particularly informative because it frames Lancium as scaling a development pipeline that requires heavy project-finance, legal, and infrastructure expertise. That hiring matters because Lancium’s value creation is increasingly tied to campus execution rather than purely software-led power optimization. Earlier independent reporting from 2022 named Raymond Cline as a co-founder and emphasized the company’s controllable-load software roots; current official materials, however, foreground McNamara and the present operating bench rather than providing
    a full historical founder narrative or public board roster. That creates a mild governance disclosure gap: investors can identify senior operators, but cannot reconstruct board committees, independent director coverage, or all founder-era role changes from the public website alone. On balance, the management bench now appears aligned to Lancium’s real bottleneck—site development, structured finance, utility interface, and stakeholder management—yet key-person dependence remains high around McNamara because he is the public face for strategy, policy positioning, capital formation, and community engagement.'
