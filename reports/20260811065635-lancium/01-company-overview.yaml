  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: A current public board roster, committee structure, and independent-director disclosure for Lancium.
    whyItMatters: A late-stage infrastructure platform approaching a reported $10 billion valuation should be assessed on governance strength, oversight quality, and independence, not only executive biographies.
    diligencePath: Request a current board deck, board list, and governance summary from management or investor materials.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: revenue-model
    missingEvidence: Public disclosure of Lancium revenue, margin, contract structure, and how cash flows are split between platform services and project-level entities.
    whyItMatters: Without revenue disclosure, investors cannot assess whether Lancium’s valuation is being driven by stabilized cash flows, development premiums, or optionality on future site monetization.
    diligencePath: Request audited or management financial statements plus top-contract summaries for Abilene, Childress, and Hall County.
    relatedQuestionRefs:
    - QO015
    - QO016
    - QO025
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: material
    topic: founder-continuity
    missingEvidence: A current official explanation of founder-era role changes, including Raymond Cline and any other early technical founders or board members no longer visible in public materials.
    whyItMatters: Founder continuity and historical role transitions can affect IP ownership, technical credibility, and key-person risk, especially for a company built on proprietary power-orchestration technology.
    diligencePath: Request cap-table history, founder-employment history, and any board or officer transition memos covering 2022-2026.
    relatedQuestionRefs:
    - QO006
  - type: private-evidence-only
    severity: blocking
    topic: contract-economics
    missingEvidence: Signed lease or service economics for the major Abilene counterparties and the revenue-sharing mechanics between Lancium and campus operators such as Crusoe or QTS.
    whyItMatters: Lancium’s enterprise value depends on how much economics it captures from controlled land and power infrastructure versus how much value accrues to tenant operators and project finance vehicles.
    diligencePath: Review executed master development agreements, ground leases, utility cost pass-throughs, and any take-or-pay structures tied to campus interconnect rights.
    relatedQuestionRefs:
    - QO025
  - type: conflicting-data
    severity: minor
    topic: job-creation-claims
    missingEvidence: A reconciled, independently audited jobs methodology covering Abilene, Childress, and Hall County construction and permanent employment claims.
    whyItMatters: Community-impact narratives are important to permitting and policy relationships, but public job numbers mix direct, indirect, peak-construction, and permanent roles from different issuers.
    diligencePath: Compare DCOA, county, and partner filings with an audited economic-impact methodology before relying on any single jobs number.
    relatedQuestionRefs:
    - QO027
    relatedTableRefs:
    - TO004
