company:
  name: Lancium
chapter:
  number: 1
  title: Company Overview
  summary: Lancium is a Texas energy-technology and infrastructure company that develops grid-connected, gigawatt-scale “Clean Campus” sites for AI data centers. Public evidence shows a rapid evolution from controllable-load and crypto-adjacent origins into a late-stage powered-land platform anchored by the 1.2 GW Abilene Stargate site, a reported $500 million Blackstone investment in 2024, a $600 million debt package in 2025, and Nvidia’s announced up-to-$3 billion investment in August 2026 at an approximately $10 billion enterprise valuation. The company’s strategic relevance is rising fast, but its board composition, revenue base, and exact customer-contract economics remain only partially public.
sections:
- id: identity-and-business-model
  title: Identity, Headquarters, and Business Model
  body: Lancium describes itself as a Texas-based developer and operator of large-scale powered land and energy infrastructure for advanced computing workloads. Its current positioning is not as a general-purpose colocation landlord, but as a specialist in securing land, transmission interconnects, civil and electrical infrastructure, and behind-the-meter resources for gigawatt-scale AI campuses that must arrive faster than traditional utility and hyperscale build cycles. Official 2026 company materials say Lancium was founded in 2017, is headquartered in The Woodlands, Texas, and is actively building a portfolio of ERCOT-oriented “Clean Campuses” that start at 1 GW and can expand to 5+ GW. The flagship Abilene site is presented as Stargate I, the first operational campus in the OpenAI/Oracle/SoftBank Stargate ecosystem. Lancium’s differentiation claim is that large computing loads can be treated as grid assets rather than pure grid burdens by combining approved transmission access with
    power orchestration, onsite storage and solar, and flexible operational controls. Earlier reporting from 2022 showed the company marketing software for ERCOT controllable-load strategies and leasing space at Abilene and Fort Stockton to crypto miners and other power-intensive tenants, which helps explain why public descriptions of Lancium mix legacy “decarbonized compute” language with its newer AI-infrastructure focus. The business model has therefore evolved from flexible-load platform operator to strategic owner-developer of power-rich AI campuses, with revenue likely split across site development, long-term infrastructure leasing, and energy-management services, though exact segment economics remain undisclosed.
