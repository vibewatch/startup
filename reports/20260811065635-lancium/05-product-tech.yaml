- id: differentiation-and-dependencies
  title: Differentiation, IP, and Critical Dependencies
  body: 'Lancium’s differentiation stems from combining power-orchestration know-how with physical campus delivery. The patents, ERCOT license, and demand-response context suggest the company possesses more than marketing language: it built a real control-system view of how flexible datacenters should interact with the grid. That said, the company’s current product depends on several external layers. ERCOT market design, local utilities, permitting, water planning, partner operators, tenant workloads, and onsite-generation design all sit outside Lancium’s sole control. OpenAI’s infrastructure posts and Bloom’s power report show why those dependencies are also opportunities: the market increasingly needs precisely this kind of integrated stack. But they remain dependencies, not fully owned modules.'
  claimRefs:
  - CE009
  - CE011
  - CE015
