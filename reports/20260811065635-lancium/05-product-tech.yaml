- id: trust-and-controls
  title: Trust, Safety, and Quality Controls
  body: 'Public trust evidence exists, but it is uneven. Lancium and OpenAI both emphasize closed-loop water systems, community investment, and responsible load growth. Lancium’s August 2026 statement supporting Texas audit and transparency requirements suggests management understands that power, water, and ratepayer impact are now product-level issues rather than PR afterthoughts. The company’s royalty-free ERCOT patent license also shows a willingness to reduce market-friction around flexible loads. Yet a different kind of trust evidence is thin: public sources do not disclose uptime SLAs, SOC 2 or ISO security certifications, formal reliability metrics, incident history, or detailed environmental reporting by campus. The public technical story is strong on architecture and strategic intent, weaker on standardized operating proof. For investors, that means technical diligence should combine engineering review, controls review, and real operating telemetry rather than relying on narrative
    alone. It also means site visits and operator reference calls matter more than polished architecture diagrams alone.'
