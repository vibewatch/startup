- id: gtt-and-sales-efficiency
  title: GTM Motion and Sales-Efficiency Proxies
  body: 'Lancium’s go-to-market motion looks more like enterprise business development plus infrastructure origination than like measurable SaaS acquisition funnels. The buyer journey runs through site diligence, utility coordination, partner selection, financing, and local approvals, so classic CAC/payback metrics are not publicly observable or necessarily meaningful. The best public proxies are different: named partner wins, site amendments that broaden monetization potential, evidence of long-term leasing to blue-chip tenants, and the company’s ability to attract sophisticated capital providers. By that standard, Lancium has real commercial proof—Stargate-linked Abilene, QTS and Crusoe tie-ups, Blue Owl and Santander participation—but still lacks disclosure on cycle length, bid conversion, customer acquisition cost, or the cost of carrying pipeline projects before they are monetized.'
