    - Mechanism visible; realized value undisclosed
    - Medium
    - Request executed land lease, easement, and development agreement economics
  - - Campus development / infrastructure services
    - Site engineering, substations, enabling infrastructure, development coordination
    - Project fee / milestone payments
    - Likely active at Abilene and future campuses; terms undisclosed
    - Medium
    - Request project budgets and Lancium fee scopes
  - - Long-duration lease / reserved-capacity economics
    - Site entity or partner leases to hyperscale / operator counterparties
    - MW-month / annual lease / availability payment
    - Long-term leased Abilene JV proof exists; Lancium share unclear
    - Medium
    - Clarify whether Lancium receives rent, service revenue, carried interest, or sale proceeds
  - - Partnered project monetization
    - Economics shared with operators, JVs, lenders, and SPVs
    - Project-level cash yield
    - Publicly evident but structurally opaque
    - Low-medium
    - Map economic waterfall across Lancium, Crusoe, Blue Owl, lenders, and site entities
  - - Grid / IP / flexible-load strategy
    - Potential strategic value from grid orchestration and patents
    - License / avoided-cost / strategic enablement
    - ERCOT license granted royalty-free; direct revenue not shown
    - Low
    - Determine whether IP drives paid economics or only de-risks project execution
  notes: Revenue-stream analysis is mechanism-first because public sources do not disclose Lancium revenue totals or segment mix.
