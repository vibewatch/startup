- id: cost-structure-and-unit-economics
  title: 'Cost Structure and Unit Economics: MW, Interconnect, and Financing Costs Matter More Than Seats'
  body: 'The strongest public unit-economics clues come from infrastructure benchmarks rather than Lancium’s own P&L. JLL’s 2026 outlook says shell-and-core data center construction costs rose from about $7.7 million per MW in 2020 to $10.7 million in 2025 and $11.3 million in 2026, while tenant AI fit-out can push costs dramatically higher. Bloom shows why these numbers matter: capital is flowing toward power-advantaged regions precisely because deliverable power has become the growth bottleneck. For Lancium, the core unit economics likely depend on several linked variables—MW under control, time-to-power, financing cost, substation and transmission scope, partner share of economics, and eventual occupancy or utilization. Public sources support the architecture of that model, but not the actual gross-margin or cash-yield outputs. The company should therefore be underwritten on asset conversion and project economics, not on generic software margin expectations.'
