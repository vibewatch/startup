- id: capital-adequacy
  title: Capital Adequacy and Financing Dependency
  body: Lancium’s public capital access is unusually strong for a private infrastructure developer, but the need for capital is also unusually high. The $600 million debt financing for Abilene, the reported $500 million Blackstone investment, the $3.4 billion Blue Owl / Primary / Crusoe JV at the Lancium site, and Nvidia’s later $2 billion initial investment with up to $1 billion more contingent all point to meaningful external confidence. At the same time, these figures do not answer whether Lancium itself has sufficient unrestricted cash, what obligations sit at project entities, how much future dilution or preferred economics remain, or how many additional billions may be required to bring five campuses toward the company’s stated multi-gigawatt ambitions. In other words, capital access is a strength, but capital dependency remains a defining feature of the model.
