- id: risk-verdict
  title: Risk Verdict
  body: 'Lancium is best understood as a high-upside but high-residual-exposure infrastructure platform. The company has real strengths: compelling sites, serious counterparties, Texas-market relevance, and strong thematic demand. None of that changes the basic underwriting fact that a few risks dominate the whole outcome set. Queue disruption, flagship-site impairment, anchor-ecosystem weakening, or capital-market tightening could each move the investment case materially on their own. By contrast, smaller operational blemishes are likely survivable if the large milestones keep landing. The right posture is not to dismiss the company on risk grounds, but to price it as a milestone-sensitive execution story with concentration and disclosure discounts. That means active diligence and explicit kill criteria are mandatory conditions for conviction.'
