company:
  name: Lancium
chapter:
  number: 7
  title: Risks
  summary: 'Lancium’s risk profile is dominated by a small number of high-consequence dependencies rather than by diffuse operational noise. The most material risks are ERCOT and Texas regulatory timing, flagship-campus execution, partner and customer concentration around Stargate-related demand, heavy capital dependence, and residual uncertainty around water, cybersecurity, and operating disclosure. The company has real mitigants: site control, community engagement, sophisticated ecosystem partners, and demonstrable ERCOT fluency. But those strengths do not fully offset the fact that Lancium’s public proof still concentrates around Abilene and a few marquee counterparties. The underwriting implication is clear: this is a milestone-sensitive infrastructure bet, not a steady-state platform with already-diversified risk.'
sections:
- id: regulatory-legal
  title: Regulatory and Legal Risk Is the First Gate
  body: Lancium’s first major risk bucket is regulatory and legal because large Texas AI campuses depend on grid process, state politics, water scrutiny, and infrastructure permissions all moving in the same direction. The August 2026 Texas audit pause coverage matters precisely because Lancium sells speed-to-power; any queue or verification disruption directly weakens the core commercial promise. The ERCOT patent-license documents show that Lancium is not merely adjacent to the Texas market structure but meaningfully tied to it, which is a competitive advantage in-state and a portability risk elsewhere. The BearBox opinion is not, by itself, a business-ending event in the retained record, but it confirms that IP and legal distraction are part of the company history. Environmental and water oversight also matter because campus-scale AI infrastructure sits inside real permitting and community-resource regimes, not just private-contract logic.
  claimRefs:
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
  - CR032
  tableRefs:
