  figureRefs:
  - FR001
- id: operational-execution
  title: Operational Risk Is Mostly About Schedule Integrity
  body: Operationally, Lancium is exposed less to ordinary data-center uptime chatter and more to the harder problem of sequencing land, power, construction, water, and tenant readiness at very large scale. Abilene is the flagship proof surface, so any delay, resize, or demand reshuffle at that site changes the whole narrative faster than at a diversified operator with dozens of stabilized campuses. The August 2026 Datacenter Dynamics report is important because it demonstrates that strategic-site scope can change even when counterpart quality remains high. New campuses in Childress and Hall County are strategically useful, but they create more fronts that all require execution simultaneously. Workforce, safety, and energization disciplines therefore matter as much as market demand. Public materials show intent and scale, but they do not yet provide the operating detail needed to prove that Lancium already runs a fully de-risked multi-campus machine.
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR020
