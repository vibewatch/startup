- id: partner-financial-dependencies
  title: Partner, Customer, and Capital Dependencies Stay Material
  body: 'Lancium’s commercial architecture is powerful precisely because it layers operators, hyperscale tenants, AI labs, utilities, and capital providers around the same campuses. That also means dependency risk is structural. Crusoe and QTS can expand go-to-market reach, but they can also own more of the customer interface than Lancium does. OpenAI and Oracle participation elevate counterparty quality, yet they concentrate public proof around one ecosystem. Capital intensity adds another layer: large campuses usually require repeated financing events, and the 2026 Nvidia investment reporting reinforces how much the story can pivot around a handful of marquee capital signals. If that capital support weakens before campuses stabilize, Lancium could face slower build cadence, weaker pricing leverage, or pressure to accept less favorable economics. This is not a low-dependency model; it is a high-dependency model that can still win if execution keeps all parties aligned.'
  claimRefs:
