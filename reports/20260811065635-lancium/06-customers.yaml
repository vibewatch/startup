- id: named-proof
  title: 'Named Customer Proof: Production Signals Exist, Mostly Through Partners'
  body: The public record supports at least three meaningful named or near-named proof sets. First, OpenAI and Oracle-related materials explicitly tie Abilene to Stargate and to GPT-5.5 training on Oracle Cloud Infrastructure using Nvidia GB200 systems. Second, Lancium’s October 2024 JV release describes a 206 MW build-to-suit Abilene project that is 100% long-term leased to a Fortune 100 hyperscale tenant, even if the tenant is not named there. Third, Lancium later announced campuses with Crusoe and QTS in Childress and Hall County, proving that more than one operator model is willing to build on Lancium sites. These are meaningful production signals, but they still do not substitute for a diversified customer list or disclosed renewal history.
