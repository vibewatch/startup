- id: retention-and-concentration
  title: Retention, Expansion, and Concentration
  body: Lancium’s expansion path is visible conceptually—additional buildings at Abilene, multiple-client optionality, and new Texas campuses—but public retention data are effectively absent. There is no public NRR, GRR, churn, renewal-rate, contract-duration portfolio, or customer satisfaction series. As a result, the best proxy for customer durability is continued site expansion and follow-on partner commitment. That proxy cuts both ways. It is positive that operators and hyperscale ecosystems keep funding and building at Lancium-linked sites, but it is also a concentration warning because a small set of flagship relationships may account for most value. The August 2026 Data Center Dynamics report that Meta was in talks to pick up Crusoe capacity after an Abilene expansion change is a reminder that capacity allocation can shift between counterparties without much public notice.
  claimRefs:
  - CU011
