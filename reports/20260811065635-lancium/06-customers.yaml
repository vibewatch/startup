  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Lancium’s customer journey is a long-cycle infrastructure path from demand sponsor to live workload, with multiple intermediaries.
  data:
    items:
    - label: Demand sponsor identified
      description: AI lab, hyperscaler, or operator recognizes need for large AI capacity
      buyerTrigger: Need for very large power-rich site
      lanciumValue: Powered-land and ERCOT-aware campus thesis
      conversionBarrier: Few sites can actually deliver power
    - label: Site and power diligence
      description: Buyer tests location, utility path, water, and community viability
      buyerTrigger: Need bankable infrastructure path
      lanciumValue: Pre-assembled campus readiness
      conversionBarrier: Interconnect and permitting risk
    - label: Partner / tenant structuring
      description: Operator, tenant, and capital stack align around site
      buyerTrigger: Need project structure and risk allocation
      lanciumValue: Site and power origination already advanced
      conversionBarrier: Unclear economic splits or concentration risk
    - label: Buildout and occupancy
      description: Campus buildings and compute equipment come online
      buyerTrigger: Need deployment certainty
      lanciumValue: Ready-to-build infrastructure base
      conversionBarrier: Construction timing and scope changes
    - label: Expansion / multi-site growth
      description: Successful site can expand by building, phase, or new campus
      buyerTrigger: Need more capacity fast
      lanciumValue: Texas portfolio and additional sites
      conversionBarrier: Retention, economics, and new-site approvals remain opaque
