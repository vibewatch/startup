chapter:
  number: 6
  title: Customers
  summary: 'Lancium’s customer proof is real but highly concentrated. The public record supports a small number of important customer or customer-adjacent relationships—OpenAI / Oracle / Stargate at Abilene, an unnamed Fortune 100 hyperscale tenant in the Blue Owl / Crusoe JV, an AI client amendment that broadened Abilene to multiple customers, and later operator routes via Crusoe and QTS in Childress and Hall County. What the record does not support is a broad logo wall, public customer counts, retention KPIs, or revenue mix by counterparty. The result is a customer base that looks strategically strong and commercially lumpy: a few high-value counterparties, long deployment cycles, and material partner and concentration dependence. That mix can still be attractive, but only if concentration is priced correctly.'
sections:
- id: segmentation
  title: 'Customer Base Segmentation: Buyer, User, and Payer Are Distinct'
  body: Lancium’s customer map is unusual because the direct buyer is not always the end user. In some cases, a campus operator such as Crusoe or QTS appears to be the direct counterparty. In others, the economic sponsor is a hyperscale or frontier AI ecosystem partner such as OpenAI, Oracle, or an unnamed Fortune 100 tenant. The end user is the AI workload itself—model training, inference, or cloud capacity sold to downstream compute buyers. This layered structure means Lancium should be segmented by buyer/user/payer role, by campus phase, and by geography. It also means customer quality is less about logo count and more about whether a small number of sophisticated counterparties are committing real MW and long-duration occupancy.
