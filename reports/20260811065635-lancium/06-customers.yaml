- id: verdict
  title: Customer Verdict
  body: Lancium’s customer proof is strong where it exists and sparse where diversification should appear. The company clearly has access to sophisticated, valuable counterparties in the AI infrastructure ecosystem. That is an important positive. But the public evidence still describes a customer base through a handful of sites, operators, and ecosystem anchors rather than through a durable portfolio of independently verifiable customers with disclosed renewal economics. The investor takeaway is that customer quality looks high, customer breadth looks narrow, and customer concentration risk remains material until a wider set of production deployments and renewals becomes public. In practical terms, that means reference calls, signed contract review, and top-customer exposure analysis are mandatory before treating the customer base as durable and diversified across sites, operators, and tenant classes sustainably long-term.
