  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-roster
    missingEvidence: A full active customer roster with contract stage, committed MW, and deployment status.
    whyItMatters: Public proof is concentrated in a few flagship relationships, so investors cannot judge breadth or diversification from public sources alone.
    diligencePath: Request a customer schedule listing named counterparties, site, committed capacity, and contract status.
    relatedQuestionRefs:
    - QU011
    - QU012
    - QU024
    relatedTableRefs:
    - TU001
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal timing, and weighted average contract duration across customer and operator segments.
    whyItMatters: Without real retention metrics, customer durability must be inferred from deployment expansion rather than measured directly.
    diligencePath: Request cohort and contract-renewal data by site and segment.
    relatedQuestionRefs:
    - QU013
    - QU014
    - QU024
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-customer and top-partner revenue / committed-MW concentration percentages.
    whyItMatters: A few counterparties may drive most enterprise value, materially affecting risk and valuation.
    diligencePath: Request top-5 customer and partner exposure by MW, revenue, and term.
    relatedQuestionRefs:
    - QU015
    - QU020
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: partner-boundaries
    missingEvidence: Clear delineation of which customer relationships are owned by Lancium versus operators such as Crusoe or QTS.
    whyItMatters: Customer quality is harder to value if Lancium does not own the renewal or expansion relationship directly.
    diligencePath: Review partner agreements, customer contact ownership, and renewal rights by site.
