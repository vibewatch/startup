- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Provider / route
  - Price / unit / contract model
  - Included capabilities
  - Discounts / unknowns
  - Implication
  rows:
  - - Lancium
    - Negotiated project economics; no public price card
    - Powered land, site engineering, interconnect and partner-ready campus path
    - Realized lease, tolling, or service economics unknown
    - Pricing diligence is essential because value capture may sit below headline campus scale
  - - Crusoe
    - Negotiated infrastructure plus cloud stack
    - AI cloud, modular data centers, power infrastructure
    - Public contract economics not disclosed
    - Can win deals by bundling compute and infrastructure
  - - QTS / incumbents
    - Mostly negotiated colocation / hyperscale campus contracts
    - Data center operations, colocation, network, established procurement path
    - List pricing not visible for large campus deals
    - Familiar procurement can offset weaker frontier-power proposition
  - - Applied Digital
    - Negotiated leases and AI factory campus contracts
    - Large leased capacity and campus design
    - Realized economics undisclosed
    - Public-market visibility helps credibility but not pricing transparency
  - - Soluna
    - Hosting / AI campus economics not publicly standardized
    - Renewable-powered sites and BTM infrastructure
    - Mixed Bitcoin / AI exposure complicates direct comparison
    - May undercut on energy narrative where buyers tolerate smaller scale
  - - Self-build hyperscaler route
    - Internal capex with long-term infrastructure ownership
    - Full control of site, power, and customer relationship
    - Requires internal execution and land/power origination capability
    - Sets the toughest benchmark for independent developers when hyperscalers have time and balance sheet
  notes: Most relevant alternatives lack public large-deal price cards, so package design and economics remain a diligence-heavy dimension across the set.
