  rows:
  - - Crusoe
    - Direct peer / integrated AI infrastructure
    - Raised $1.375B at >$10B valuation; contracted capacity approaching 5 GW
    - Hyperscalers and AI builders
    - Combines cloud, modular data centers, power, and campuses
    - More vertically integrated than Lancium, so not a pure apples-to-apples compare
  - - Applied Digital
    - Direct peer / AI campus developer
    - Publicly markets AI Factories and a 210 MW lease at Delta Forge 2
    - Large AI workloads and cloud operators
    - Repeatable campus design and public-market access
    - Less visible Texas-grid orchestration story than Lancium
  - - Soluna
    - Renewable-powered adjacent peer
    - Operational and planned Texas sites from 2 MW pilots to 100 MW+ AI campuses
    - AI / HPC and Bitcoin workloads
    - Strong renewable-curtailment and BTM thesis
    - Smaller scale and more mixed Bitcoin exposure
  - - QTS
    - Incumbent hyperscale campus operator
    - Global campuses across North America and Europe
    - Enterprise, hyperscale, colocation buyers
    - Distribution power, standardized design, trust
    - Less obviously differentiated on ERCOT-style power orchestration
  - - Digital Realty / Equinix / Switch
    - Incumbent substitute set
    - Global multi-metro footprints and enterprise reach
    - Enterprise, network, hybrid-cloud, AI-ready buyers
    - Brand, connectivity, customer trust, land banks
    - Often broader colocation/interconnection orientation rather than Texas powered-land wedge
  - - CoreWeave / Oracle / self-build hyperscalers
    - Adjacent bundled route
    - AI cloud and infrastructure budgets plus cloud control
    - AI labs and hyperscalers
    - Can bundle compute, software, and infrastructure
    - May prefer to internalize site economics rather than rely on independent developers
  notes: 'Rows are grouped by how a buyer could solve the same underlying problem: secure AI-ready power, land, and deployment capacity.'
