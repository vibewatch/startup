- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - ERCOT and controllable-load know-how
    - Integrated rivals can hire similar talent or buy similar capabilities
    - High
    - Verify whether Lancium has site-specific regulatory advantages competitors cannot quickly replicate
  - - Power-rich Texas land control
    - Incumbents and hyperscalers can buy or option competing land banks
    - High
    - Review exclusivity, queue position, and time-to-power by site
  - - Clean-campus positioning
    - Gas-heavy or opaque backup strategies can weaken differentiation
    - Medium-high
    - Demand detailed energy mix and operating assumptions site by site
  - - Partner-led route to market
    - Operators such as Crusoe or QTS may capture most customer economics
    - High
    - Clarify who owns customer contract, margin, and expansion rights
  - - Patent and grid-orchestration history
    - Patents may matter less if market shifts from flexible load to dedicated AI campuses
    - Medium
    - Assess whether patent portfolio still affects real deal economics
  - - Frontier-market speed advantage
    - If core metros resolve power bottlenecks, Lancium’s wedge narrows
    - Medium-high
    - Track grid-connection timelines and comparable land-power offers in DFW and other markets
  notes: Severity reflects how directly each threat could compress Lancium’s pre-commit differentiation or revenue capture.
