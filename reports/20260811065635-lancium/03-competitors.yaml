  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Realized pricing, margin split, and economics-per-MW for Lancium versus direct campus alternatives.
    whyItMatters: Without realized economics, the analysis can compare positioning and scale stories but not true competitive price/performance.
    diligencePath: Request recent bid comparisons, signed term sheets, and per-MW economics across at least one win and one loss.
    relatedQuestionRefs:
    - QP024
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: A formal Lancium win/loss dataset showing which buyers chose Lancium, incumbents, or self-build routes and why.
    whyItMatters: Public sources reveal competitor positioning but not which claims actually drive conversion in live enterprise or hyperscale decisions.
    diligencePath: Request pipeline stage data, lost-deal postmortems, and named-reference calls segmented by buyer type.
    relatedQuestionRefs:
    - QP025
  - type: private-evidence-only
    severity: material
    topic: partner-economics
    missingEvidence: Contractual detail on whether Lancium or its operator partners own the customer relationship, expansion options, and majority of downstream economics.
    whyItMatters: If partners control renewals and economics, Lancium may be less defensible than its campus headlines imply.
    diligencePath: Review partner agreements with Crusoe, QTS, and future operators including exclusivity, ROFRs, and expansion rights.
    relatedQuestionRefs:
    - QP023
  - type: missing-source
    severity: minor
    topic: switching-costs
    missingEvidence: Named public customer commentary describing why a buyer chose Lancium over another site or switched away from a competing route.
    whyItMatters: Switching-cost claims are currently inferred from infrastructure logic rather than directly quoted customer decision narratives.
    diligencePath: Collect customer interviews, conference talks, or procurement documents from buyers evaluating multiple Texas campuses.
    relatedQuestionRefs:
    - QP019
    - QP020
  - type: private-evidence-only
    severity: material
    topic: patent-durability
    missingEvidence: Internal evidence showing whether Lancium’s patent and ERCOT know-how still provide a practical speed or legal advantage in current AI campus negotiations.
    whyItMatters: Historic grid IP matters only if it still changes counterparty behavior in today’s dedicated AI campus market.
    diligencePath: Ask management for examples where patents, CLR know-how, or ERCOT workflow experience directly accelerated or protected a project.
    relatedQuestionRefs:
    - QP026
