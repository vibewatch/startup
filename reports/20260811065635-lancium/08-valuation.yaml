- id: downside-diligence
  title: Downside, Entry Discipline, and Diligence Asks
  body: Entry discipline matters because Lancium’s downside transmission is straightforward. If ERCOT timing weakens, Abilene scope changes, customer concentration persists, or financing terms prove less favorable than the headlines imply, valuation should reset lower. None of those outcomes require the company to fail outright; they only require the premium narrative to narrow. That is why the remaining diligence asks are so important. Investors should request the cap-table and preference waterfall, debt covenants and milestone triggers, campus-level contract economics, energization schedules, and water-resource plans before treating the current valuation as compelling. A lower entry price or stronger disclosure could improve the setup meaningfully. Without one of those two things, new money is being asked to absorb too much uncertainty at too high a price.
  claimRefs:
