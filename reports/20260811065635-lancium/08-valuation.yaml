- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Abilene stays on track, more campuses convert, marquee capital remains available
    - ~$12B-$15B plausible if premium scarcity narrative compounds into repeatable campus monetization
    - Execution still must remain clean
    - Requires continued flagship proof and broadening demand
  - - Base
    - Flagship proof holds, but disclosure gaps and concentration persist
    - ~$7B-$10B supports a premium but not unlimited expansion
    - Price support remains sensitive to milestones
    - Most consistent with current public evidence
  - - Bear
    - Scope changes, queue friction, or monetization disappointments emerge
    - ~$4B-$6B if market discounts concentration and delayed cash-flow conversion
    - Headline mark compresses quickly
    - Any meaningful flagship impairment could trigger it
  - - Upside move trigger
    - Deeper disclosure plus price discipline for new investors
    - Improves risk-adjusted return without changing company quality
    - May not coincide with round timing
    - Would move call materially more constructive
  - - Downside trigger
    - Hidden preferences, debt stress, or weak customer economics
    - Could reduce effective entry value below headline mark
    - Public evidence is thin on these items today
    - Diligence outcome dependent
  notes: Scenario ranges are IC discussion tools, not management guidance.
