- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Bull / thesis view
  - Bear / anti-thesis view
  - What would change the view
  rows:
  - - Flagship-site proof
    - Abilene demonstrates real strategic and operating relevance
    - Abilene remains too concentrated to justify a broad platform premium
    - More site-level operating and tenant economics disclosure
  - - Scarcity value
    - Power-ready AI campuses deserve premium attention in 2026
    - Scarcity narrative does not automatically convert into attractive investor returns
    - Evidence of durable contracted economics
  - - Moat
    - ERCOT fluency and site assembly create differentiation
    - Texas-specific advantages may not travel and can concentrate risk
    - Repeatable wins beyond the flagship ecosystem
  - - Financing support
    - Marquee investors validate the story
    - Private financing headlines can overstate value for new-money entry
    - Full preference and debt stack disclosure
  - - Expansion optionality
    - Multiple-campus pathway can grow into today’s mark
    - Optionality is over-valued if conversion cadence slows
    - Signed multi-site customer and energization progress
  notes: The anti-thesis is mostly about price and concentration, not company irrelevance.
