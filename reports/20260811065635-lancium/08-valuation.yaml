- id: comparables-and-scenarios
  title: Comparables and Scenario Range
  body: Comparable analysis is helpful here mainly as a boundary-setting exercise. Ormat is relevant because it shows how public markets value specialized energy infrastructure, but it is not an AI-campus developer. Equinix and Digital Realty are relevant because they are scaled public data-center platforms, yet they do not resemble Lancium’s Texas-specific powered-land and ecosystem-concentration profile. Applied Digital and CoreWeave are useful because they sit closer to AI infrastructure enthusiasm, though their monetization stacks differ substantially. The result is not a single clean comp set but a triangulation exercise. That is why scenario analysis matters more than a one-line multiple. The bull case needs on-schedule flagship execution and multi-campus conversion; the bear case needs only a few slips in scope, queue progress, or monetization to compress the mark sharply from today’s headline valuation.
