- id: TV003
  title: Bull / base / bear scenario
  columns:
  - Scenario
  - Key assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bear
    - Grid-queue conversion stalls near the observed ~11% (78GW/720GW) rate; regulatory reforms (FCA restrictions, possible EnWG Section 118 exemption removal) compress merchant IRR; sector-wide BESS multiples continue softening as in Q1 2026 M&A data.
    - Illustrative per-MW cross-check compresses toward or below the AllianzGI/Kyon Energy benchmark (~EUR634k/MW); any future valuation disclosure could resemble a down-round.
    - Undisclosed cap-table/preference overhang; customer concentration in a handful of tolling counterparties; unresolved board/governance structure.
    - Consistent with Wood Mackenzie's and Modo Energy's flagged valuation/return-compression risk and the Q1 2026 European BESS M&A repricing signal.
  - - Base
    - Pipeline conversion continues at roughly the disclosed 11% rate but modestly improves as the 2026 maturity-based connection procedure matures; existing RWE/Vattenfall/Stadtwerke Duisburg tolling relationships are maintained or modestly expanded.
    - Illustrative per-MW cross-check sits between the AllianzGI/Kyon Energy (~EUR634k/MW) and Sosteneo/Enel Libra Flexsys (~EUR1.32M/MW) benchmarks, i.e., roughly EUR95M-EUR198M applied to terralayr's disclosed ~150MW scale.
    - Continued reliance on external financing to convert the 8GW pipeline; regulatory implementation risk during the transition to the new maturity procedure.
    - Consistent with terralayr's demonstrated ability to close three financing events in 18 months without yet resolving valuation or revenue disclosure.
  - - Bull
    - Grid-connection reform materially raises the conversion rate; terralayr wins additional blue-chip tolling counterparties at or above current benchmark pricing; sector M&A activity (as seen in Kyon Energy/Allianz and Sosteneo/Enel Libra Flexsys) extends to platforms of terralayr's profile.
    - Illustrative per-MW cross-check approaches or exceeds the Sosteneo/Enel Libra Flexsys benchmark (~EUR1.32M/MW), implying roughly EUR198M or more applied to the disclosed ~150MW scale, before any pipeline-scale re-rating.
    - Execution risk in scaling from ~150MW to a meaningful share of the disclosed 8GW pipeline; competition from capital-backed entrants such as Akaysha Energy.
    - Consistent with the broader financial-sponsor appetite for multi-gigawatt BESS platforms documented in 2026 European M&A commentary, but not yet evidenced for terralayr specifically.
  notes: Valuation figures in this table are this chapter's own scenario arithmetic applied to terralayr's disclosed operating scale for entry-discipline purposes; they are not terralayr's disclosed or implied valuation.
