- id: section-4
  title: 'Scenarios and entry discipline: benchmarking a range without inventing a valuation'
  body: 'Because terralayr''s valuation is not publicly disclosed, this chapter deliberately does not assert one. Instead it builds an entry-discipline framework from independently disclosed German BESS transaction benchmarks applied illustratively to terralayr''s own disclosed operating scale. Allianz Global Investors'' acquisition of a 50% stake in 789 MW of Kyon Energy battery-storage projects for EUR500 million (70% debt-financed) implies a total-investment benchmark of roughly EUR634,000 per MW; Generali''s Sosteneo platform''s EUR1.1 billion acquisition of a 49% stake in Enel Libra Flexsys, covering about 1.7 GW of operational and pipeline capacity, implies a considerably richer full-platform benchmark of roughly EUR1.32 million per MW. Applying these two benchmarks to terralayr''s disclosed roughly 150 MW of operating and under-construction capacity, rather than its much larger 8GW pipeline, produces an illustrative cross-check range of about EUR95 million to EUR198 million; a bear case anchored to distressed public-comparable multiples (Stem- or Nuvve-style compression) would sit well below that, in the EUR22 million-EUR38 million range. None of these figures are terralayr''s actual or implied valuation: they exist only to give an investor a defensible price range to test against whatever figure is eventually disclosed, and to make explicit that the grid-connection queue''s roughly 11% confirmed-commitment conversion rate is itself a key swing factor in how much of the 8GW pipeline should be treated as valuation-relevant near-term capacity.'
