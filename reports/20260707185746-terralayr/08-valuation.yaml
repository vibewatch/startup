- id: section-6
  title: Exit readiness, diligence asks, and thesis-break triggers
  body: 'terralayr is not exit-ready in any conventional sense: it has just closed a growth-equity round, has not disclosed a valuation, and shows no public evidence of an active sale or IPO process, unlike Akaysha Energy''s live 2026 capital process. The single highest-priority diligence ask is a confirmed post-money valuation and capitalization table for the January 2026 round, since revenue detail, pipeline-conversion status, debt terms, and governance structure are all secondary to establishing the actual entry price. Six concrete thesis-break triggers would warrant re-rating the recommendation: a stall in grid-connection queue conversion below roughly 10% of confirmed commitments converting to signed volume within 12 months; a future valuation disclosure implying less than roughly EUR300,000 per MW against the ~EUR634,000/MW AllianzGI/Kyon Energy benchmark; the loss of a major tolling counterparty such as RWE or Vattenfall; removal of the Section 118 EnWG grid-fee exemption or severe Flexible Connection Agreement curtailment; a debt covenant breach or failed refinancing; and sector-wide repricing evidence, such as a distressed multiple on a comparable BESS platform transaction. Until the valuation and financial-disclosure gaps close, this chapter''s recommendation stays research-more/track rather than buy or avoid.'
