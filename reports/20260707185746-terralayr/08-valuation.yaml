- id: section-3
  title: 'Anti-thesis: grid-connection bottlenecks, regulatory flux, and distressed public comparables'
  body: The anti-thesis is built almost entirely from independent, sector-wide adverse evidence rather than terralayr-specific bad news, because no source in this research pack surfaces a terralayr-specific adverse event. Clean Energy Wire and Rödl & Partner both corroborate that Germany's grid-connection request queue for battery storage exceeds 720 GW against only about 2.6 GW actually installed, and Glint Solar puts confirmed connection commitments at only around 78 GW of that queue, an implied conversion rate of roughly 11%. Wood Mackenzie separately warns that current BESS valuation and revenue models likely underestimate risk and revenue variance, noting connection requests ballooned from roughly 300 GW to more than 500 GW within about a year, and that Flexible Connection Agreements now impose import/export, ramp-rate, ancillary-service, and uncompensated re-dispatch restrictions that can compress project IRR by several percentage points. On public comparables, Stem Inc traded at a $64.31 million market cap against a $397.72 million enterprise value on July 7, 2026, a gap consistent with heavy net debt, while Nuvve Holding's market cap has fallen 96.10% since May 2020 to just $2.72 million; both illustrate that BESS-adjacent public companies can trade near distressed levels once growth or profitability is questioned, providing a plausible bear-case floor for any future terralayr valuation event.
