- id: section-2
  title: 'Investment thesis: market pull, product structure, and named customers support continued engagement'
  body: 'The bull case for terralayr starts with market pull rather than company-specific proof: Germany''s BESS grid-connection queue reaching more than 720 GW (against ~263 GW of total installed generation capacity) shows the scale of underlying demand for flexibility assets, even if only a fraction of that queue converts to built capacity. terralayr''s product structure, an integrated developer-owner-operator model wrapped around its LAYR flexibility-as-a-service platform, is designed to both own assets and monetize third-party ones, a dual-sided model that mirrors the direction several better-capitalized peers (Sosteneo/Enel Libra Flexsys, AllianzGI/Kyon Energy) have taken by pairing platform economics with owned or JV-controlled asset bases. On customers, terralayr has moved from pipeline announcements to named, disclosed counterparties: RWE''s five-year virtual 50MW/100MWh tolling deal, a Vattenfall marketing partnership that has since been described as expanding nationwide, and a Stadtwerke Duisburg Energiehandel cooperation. Modo Energy''s German BESS research shows 4-hour projects reaching 13.7% unlevered IRR at 2026 commercial-operation dates, and Glint Solar reports 2-hour projects earning roughly EUR259,000 per MW in 2025 revenue at 15-18% return expectations, both of which describe a sector where well-executed projects can still clear attractive return hurdles even as the queue backs up.'
