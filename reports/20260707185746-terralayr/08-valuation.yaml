- id: section-5
  title: 'Comparable set: public companies, private transactions, and a live capital-process peer'
  body: 'terralayr''s comparable set spans three tiers. Public companies provide the most liquid but least structurally similar comparables: Fluence Energy (NASDAQ:FLNC) is an SEC-reporting, vertically integrated hardware-and-software incumbent trading at a $2.99 billion market cap and $3.00 billion enterprise value as of July 7, 2026, while Stem Inc and Nuvve Holding illustrate how far BESS/flexibility-software valuations can fall once growth or balance-sheet concerns dominate. Private transactions provide closer structural analogues: the AllianzGI/Kyon Energy and Sosteneo/Enel Libra Flexsys deals both involve a financial sponsor buying a minority stake in a German or European developer-operator platform, which is structurally close to terralayr''s own owner-operator-plus-platform model, even though neither deal discloses a multiple as clean as a public EV/revenue ratio. A third tier is a live capital-process peer: Akaysha Energy, a BlackRock-backed Australian BESS developer with a roughly 2 GW operating portfolio, engaged Macquarie Capital in 2026 to run a process reportedly targeting a valuation above USD1 billion and a 50-60% stake sale, offering a real-time read on how the market is currently pricing a scaled BESS developer-operator, albeit in a different jurisdiction and at many multiples of terralayr''s current disclosed scale. Q1 2026 European BESS M&A activity, described by a Baringa director as ''market maturing and repricing risk'' with 50 large transactions and IRRs normalising toward the cost of capital, is the backdrop against which any of these comparables should be read.'
