  topStrengths:
    - 2026 年 Eurazeo 领投的 €192 million 融资，加上一笔独立债务融资，说明专业基础设施投资人愿意给这个平台继续供血。
    - RWE、Vattenfall 和 Stadtwerke Duisburg 等实名商业合作，让 Terralayr 的采用证据强过只讲管线的 BESS 开发商。
    - Terralayr 披露的规模（>150 MW 已运营或在建、约 200 MW 可开工、8 GW 管线）在德国储能市场已经有分量。
    - 自持运营商叠加 LAYR 平台的混合模式，可能让 Terralayr 同时变现自有和第三方电池资产组合。
  topRisks:
    - 已审阅来源没有披露 Terralayr 的估值、收入、毛利率、烧钱速度或现金跑道，任何对价格敏感的承销判断都无从落笔。
    - 到 2026 年，德国 BESS 并网和监管规则仍未稳定，直接压住管线转化和资产层面回报。
    - 这个模式重资本，且越来越依赖项目债、后续股权融资和公用事业级交易对手持续供给。
    - 公开客户证据集中在少数实名公用事业公司；总客户数、续约数据和集中度指标仍未披露。
  unresolvedGaps:
    - 2026 年 1 月轮次的投后估值、股权结构表、清算或优先权条款均未公开。
    - Terralayr 尚未公开披露收入、毛利率、收费制与商户制收入结构，或 >150 MW 运营资产的利用率。
    - 没有单一公开来源能对齐 Terralayr 历史以来在股权、债务和项目层面融资工具上的累计融资额。
    - 董事会构成、权利和投资人控制条款只披露了一部分，治理透明度仍不完整。
