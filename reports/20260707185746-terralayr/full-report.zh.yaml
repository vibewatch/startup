  - id: TV005
    title: 论点破坏与否决触发项
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 并网队列转化停滞
        - 已确认约 78GW 并网承诺中，12 个月内转化为已签容量租用或 PPA 容量的比例低于约 10%
        - 打断支撑基准和乐观情景的管线到收入桥梁
        - 下调至回避 / 跟踪；在转化得到证实前暂缓追加资本
      - - 披露估值处于困境倍数
        - 确认的投后估值相对约 EUR634k/MW 的 AllianzGI/Kyon Energy 基准，隐含不到约 EUR300k/MW
        - 暗示降价轮或投资人信心流失
        - 重新承销论点；按悲观情景得到确认处理
      - - 主要容量租用对手方退出
        - RWE、Vattenfall 或 Stadtwerke Duisburg 终止或不续签容量租用 / 代销协议
        - 移除乐观情景的收入确定性支柱
        - 在找到替代对手方前，立即重估为回避
      - - 监管改革取消电网费豁免或施加强力限发
        - EnWG Section 118 电网费豁免被撤销，或爬坡 / 辅助服务限制把模型 IRR 压低到资本成本以下
        - 打破把管线转化为可融资资产所需的单位经济性
        - 重跑情景模型；可能触发悲观情景
      - - 债务契约违约或再融资失败
        - EUR100M 增量额度、EUR60M BBD 额度或其他已披露债务出现任何已披露违约、豁免或再融资失败
        - 显示资本结构承压
        - 升级至回避；监测契约余量
      - - 行业整体重新定价证据
        - 可比 BESS 平台（例如 Akaysha Energy，或 Enel Libra Flexsys 类型同行）以低于当前可比集的隐含每 MW 倍数完成新交易
        - 确认资产类别整体存在倍数压缩风险
        - 相应下调基于可比项的入场纪律框架
    notes: 触发项来自本章引用的可比公司和行业数据；没有一项已经在 terralayr 身上被观察到。
    claimRefs:
      - CV039
      - CV023
      - CV045
      - CV027
  - id: TV006
    title: 最终尽调要求
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 投后估值
        - 2026 年 1 月轮的确认估值数字；ESS News 和 Mercom Capital 均确认该数字未披露
        - 没有确认的入场价格，就无法给出对价格敏感的建议
        - 直接向 terralayr、Eurazeo 或 RIVE Private Investment 索取条款清单或估值备忘录
      - - 经核对的生命周期总融资额和股权结构表
        - 已披露轮次 / 融资额度未经核对合计约 EUR329M；需要单一确认的总融资额和完整优先权 / 所有权栈
        - 决定任何投资人的稀释、控制权和真实有效进入价格
        - 管理层尽调期间，直接向 terralayr 索取资本结构表和融资历史
      - - 收入、利润率和组合层面容量租用 / 市场化拆分
        - 全部超过 150MW 运营基础的经审计或管理账口径收入和毛利率，而不只是 112MW/238MWh 债务融资批次
        - 需要这些数据，才能有意义地对标可比倍数（EV/revenue、EV/MW）
        - 索取管理账或数据室财务资料
      - - 8GW 管线的并网转化状态
        - 按项目确认哪些管线容量已经拿到并网承诺，哪些只是申请
        - 决定在约 720GW 全国队列下，管线中多少现实上可融资
        - 索取逐项目并网状态清单
      - - 债务额度条款
        - EUR100M 增量额度、EUR60M BBD 额度和其他任何已披露债务的票息、契约和期限
        - 决定下行韧性和再融资风险
        - 索取融资协议或贷款人条款清单
      - - 董事会和治理结构
        - 经核对的董事会名单，以及各投资人类别的投票 / 控制权
        - 决定谁控制退出时点和后续融资等关键决策
        - 索取股东协议和治理文件
    notes: 按解除价格敏感建议阻塞的优先级排序，而非按取证难度排序。
    claimRefs:
      - CV033
      - CV006
      - CV034
      - CV046
