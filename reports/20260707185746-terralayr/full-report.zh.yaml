        - 确认 terralayr 管线中预计 2029 年 8 月前并网的比例
      - - EnWG 第 17(2b) 条灵活 / 可限发并网
        - 驱动因素
        - 当前，至 2026 年逐步落地
        - 允许可限发、低优先级电网接入，可能加快排队容量并网
        - 评估 terralayr 管线站点是否符合灵活并网条款
      - - 采用 tolling 的容量占比上升（70-100% tolled，德国集中在 80-100%）
        - 驱动因素
        - 当前，2025-2026 年
        - 提升项目可融资性和债务杠杆（最高 75%），缓解资本密集约束
        - 核验 terralayr 自身 toll/merchant 组合与 80-100% 市场集中区间的差异
      - - 日前价差高位（约 EUR85k/MW/yr，2025 年）
        - 驱动因素
        - 当前；若价差收窄则可能反转
        - 同时支撑 merchant 和 toll 经济性；价差收窄会削弱增长逻辑
        - 用价差收窄情景压力测试 terralayr 收入模型
      - - 交易对手 / 可融资性风险，以及稳定收入难题（据行业专家）
        - 约束
        - 当前，结构性
        - 若缺少有信用的 tolling 交易对手，融资方可支持的容量就会受限
        - 审查 terralayr toll 交易对手（RWE、Vattenfall）的信用质量和合同条款
      - - 扩张多 GW 管线的资本强度（2024 年 EUR77M，后续融资 EUR192M）
        - 约束
        - 当前，融资需求反复出现
        - 增长节奏取决于 terralayr 能否在管线转化前持续募集股权 / 债务
        - 要求 terralayr 提供前瞻资本计划，并对照管线转化里程碑
    notes: 方向判断反映已找到证据的平衡；若干事项（电网费豁免、EnWG 灵活并网）会随时间不同，同时充当近期驱动因素和长期约束，时间列已注明。
