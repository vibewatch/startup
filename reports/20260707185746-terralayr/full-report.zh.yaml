  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 电网接入被拒先例扩散
        - BNetzA Beschlusskammer 对 BESS 并网权作出更多不利裁决
        - BK6-25-325 之后 12 个月内又出现 2 项或更多不利裁决
        - 下调管线转化假设；对未确认接入的站点打折
      - - 储能专项网络电费最终高于预算
        - BNetzA 发布具有约束力的储能网络电费方法
        - 电费超过当前 EUR110,000-150,000/MW/yr 的容量租用定价假设
        - 用最终电费重跑项目 IRR 和容量租用定价模型
      - - KRITIS/BSIG 不合规
        - BSI 执法，或确认漏登记为关键设施运营方
        - 披露任何确认的未登记或罚款
        - 升级网络安全尽调；要求补救计划和时间表
      - - 贷款人契约违约风险
        - 已签约收入占比与贷款人通常 60-100% 的要求对比
        - 任一测算日已签约占比低于 40%
        - 要求 terralayr 提供更新后的债务契约合规证明
      - - 容量租用对手方不续约
        - RWE（5 年，自 2026 年起）或 Vattenfall（7 年）容量租用协议接近或到期
        - 合同结束后 6 个月内未宣布续约
        - 重新评估收入集中度风险和市场化敞口比例
      - - 市场化价差被进一步蚕食
        - 2 小时储能电池实现的德国日前套利价差，对比 2025 年约 EUR85,000/MW/yr 的基准
        - 实现价差连续 2 个季度低于 EUR60,000/MW/yr
        - 在估值模型中压力测试市场化收入假设
      - - 安全或网络安全事件
        - terralayr 拥有 / 管理的资产披露任何火灾、热失控或网络事件
        - 单一起确认事件
        - 立即触发运营和声誉风险重估；复核完成前暂停新增资本投入
    notes: 阈值是本章基于引用来源提出的监测框架；terralayr 未公开披露自己的内部否决标准或契约监测阈值。
