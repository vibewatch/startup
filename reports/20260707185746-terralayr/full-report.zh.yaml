      - number: '7.3'
        title: 运营、技术与安全风险
        blocks:
          - type: paragraph
            body: >-
              运营层面，德国 BESS 行业自己的安全机构称，即便项目规模已超过 1 GWh，截至目前也没有报告事故（CR019）；也没有公开来源披露任何具体涉及 terralayr
              资产的火灾、热失控、安全执法或召回事件（CR021）。但公开来源同样没有确认其拥有 UL9540A 等同的第三方安全认证；基准竞争对手公开声称符合安全标准，让这一缺口更显眼（CR022）。独立法律 /
              经济分析还把电芯不均衡列为全行业技术风险，可能缩短电池寿命（CR023）；terralayr 没有公开具名电芯供应商，也没有披露质量保证 / 保修流程（CR024）。网络安全侧，Bundesnetzagentur
              和 BSI 正在收紧能源基础设施中对齐 ISO / IEC 27001 的网络安全要求（CR014），但没有公开来源确认 terralayr 的 LAYR 平台获得 ISO 27001、SOC2
              或等同认证，也没有披露网络安全事故（CR026）。可靠性证据只限于 terralayr 自报的 99.9%+ 可用率数字（CR025）。建设执行依赖公司内部披露的 EPC
              招标流程，承包商未具名（CR027）；德国 2026 年负电价事件又构成另一项运营压力，行业协会分析认为，其驱动因素是电网瓶颈，而不是储能雄心不足（CR028）。
            claimRefs:
