      - number: '8.2'
        title: 投资论点：市场拉力、产品结构和具名客户支持继续跟踪
        blocks:
          - type: paragraph
            body: >-
              terralayr 的多头论点首先来自市场拉力，而不是公司特定证明：德国 BESS 并网队列超过 720 GW（对应总装机发电容量约 ~263
              GW），说明灵活性资产的底层需求规模很大，即便只有一小部分队列最终转成建成容量。terralayr 的产品结构，是围绕 LAYR 灵活性即服务平台搭起的一体化开发商 - 所有者 -
              运营商模型，既持有自有资产，也变现第三方资产；这种双边模型，与资本更厚的若干同行（Sosteneo / Enel Libra Flexsys、AllianzGI / Kyon Energy）把平台经济与自有或
              JV 控制资产基础配对的方向相似。客户侧，terralayr 已经从管线公告推进到具名、已披露对手方：RWE 五年期虚拟 50MW / 100MWh tolling 交易、此后被描述为扩展至全国的
              Vattenfall 营销合作，以及 Stadtwerke Duisburg Energiehandel 合作。Modo Energy 的德国 BESS 研究显示，2026 年商业运营日期的 4 小时项目可达到
              13.7% 无杠杆 IRR；Glint Solar 报告称，2 小时项目在 2025 年收入约 EUR259,000 / MW，对应 15-18%
              回报预期。两者共同描述的是一个即便排队拥堵、执行良好的项目仍能跨过有吸引力回报门槛的行业。
            claimRefs:
              - CV010
              - CV032
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
      - number: '8.3'
        title: 反论点：并网瓶颈、监管摇摆与陷入困境的公开可比公司
        blocks:
          - type: paragraph
            body: >-
              反论点几乎完全来自独立、行业层面的负面证据，而不是 terralayr 特定坏消息，因为本研究包没有任何来源提出 terralayr 特定负面事件。Clean Energy Wire 和 Rödl &
              Partner 都印证，德国电池储能并网申请队列超过 720 GW，而实际装机只有约 2.6 GW；Glint Solar 估计该队列中已确认并网承诺仅约 78 GW，隐含转化率约 11%。Wood
              Mackenzie 另行警告，当前 BESS 估值和收入模型可能低估风险与收入波动，并指出并网申请在约一年内从约 300 GW 膨胀到超过 500 GW；Flexible Connection
              Agreements 现在还施加进口 / 出口、爬坡率、辅助服务和无补偿再调度限制，可能把项目 IRR 压缩数个百分点。公开可比公司方面，Stem Inc 在 2026 年 7 月 7 日的市值为 $64.31
              million，企业价值为 $397.72 million，这一差距与重净债务相符；Nuvve Holding 自 2020 年 5 月以来市值下跌 96.10%，只剩 $2.72
              million。两者都说明，一旦增长或盈利能力受到质疑，BESS 相邻上市公司可能交易到接近困境水平，为 terralayr 未来任何估值事件提供一个合理的熊市底部参考。
