          high: 38
          displayValue: EUR22M-EUR38M
          detail: 将承压上市可比公司的折价（Stem / Nuvve 式倍数压缩）套用到 terralayr 披露的约 150MW 运营 / 在建规模；这是示意性底部，不是 terralayr 的实际价值。
          tone: negative
        - label: 基准情景
          low: 75
          mid: 95
          high: 115
          displayValue: EUR75M-EUR115M
          detail: Kyon Energy / AllianzGI 基准（约 EUR634k/MW）套用至披露的约 150MW 规模。
          tone: warning
        - label: 乐观情景
          low: 165
          mid: 198
          high: 230
          displayValue: EUR165M-EUR230M
          detail: Sosteneo / Enel Libra Flexsys 基准（约 EUR1.32M/MW）套用至披露的约 150MW 规模，并假设项目管线继续转化。
          tone: positive
    approximationNotes: 这些区间是本章为投资委员会入场纪律讨论搭建的情景化、每 MW 基准测算。terralayr 未披露 2026 年 1 月融资估值，任何数字都不应被解读为 terralayr 的实际或隐含估值。
    claimRefs:
      - CV037
      - CV038
      - CV021
      - CV001
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: terralayr 在市场顺风、融资和客户证明上得分较好，但因定价和财务细节未披露，估值和证据质量维度得分较差。
    data:
      items:
        - label: 市场顺风
          score: 8
          detail: 德国约 720GW 的 BESS 并网队列反映出灵活性基础设施底层需求极强，尽管转化仍被瓶颈卡住。
          tone: positive
        - label: 商业牵引力证明
          score: 6
          detail: 与 RWE、Vattenfall 和 Stadtwerke Duisburg 披露的容量租赁 / 营销交易真实存在，但只覆盖运营基数的一小部分。
          tone: neutral
        - label: 护城河 / 竞争位置
          score: 5
          detail: 轻资产优化器定位有差异化，但尚未证明能在结构上抵御 Kyon Energy 或 ENGIE 这类垂直整合同行。
          tone: neutral
        - label: 资本获取 / 融资势头
          score: 7
          detail: 约 18 个月内三次融资，并由大型基础设施基金领投，显示投资人支持仍在延续。
          tone: positive
        - label: 监管 / 执行风险
          score: 3
          detail: 2026 年德国 BESS 监管制度未落定，且约 720GW 并网队列对应仅约 78GW 确认承诺，构成系统性风险。
          tone: negative
        - label: 估值披露 / 证据质量
          score: 2
          detail: terralayr 未公开披露投后估值、收入、利润率或口径一致的融资总额。
          tone: negative
    approximationNotes: 评分为 0-10 的序数型投资委员会式判断，锚定引用的公开证据，不是公司提供的 KPI 披露。
    claimRefs:
      - CV010
      - CV007
      - CV031
      - CV002
      - CV015
      - CV033
