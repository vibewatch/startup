      - CV007
      - CV009
      - CV001
      - CV010
      - CV042
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: terralayr 任何基于可比基准的入场价格，都高度取决于采用哪一组每 MW 基准和项目管线转化假设。
    data:
      items:
        - label: Kyon Energy / AllianzGI 基准（EUR k/MW）
          value: 634
          detail: Allianz 以 EUR500M 收购 Kyon Energy 789MW 组合 50% 股权，由此推算出的总投资基准。
          tone: neutral
        - label: Sosteneo / Enel Libra Flexsys 基准（EUR k/MW）
          value: 1320
          detail: Sosteneo 以 EUR1.1bn 收购约 1.7GW 平台 49% 股权，由此推算出的全平台基准。
          tone: positive
        - label: 并网队列转承诺率（%）
          value: 10.8
          detail: 累计德国 BESS 申请约 720GW，对应已确认并网承诺约 78GW。
          tone: negative
        - label: 德国 2 小时 BESS 2025 收入基准（EUR k/MW/yr）
          value: 259
          detail: Glint Solar 披露的 2025 年德国 2 小时 BESS 项目每 MW 年收入。
          tone: neutral
    approximationNotes: 各项单位不同（EUR 千 / MW、百分比、EUR 千 / MW / 年）；这是用独立披露基准做的示意性敏感性筛选，不是单一估值模型。
