      - number: '8.4'
        title: 情景与入场纪律：在不虚构估值的前提下建立基准区间
        blocks:
          - type: paragraph
            body: >-
              由于 terralayr 的估值未公开，本章刻意不作断言。我们改用独立披露的德国 BESS 交易基准，套到 terralayr 已披露运营规模上，搭起一套入场价格纪律框架。Allianz Global
              Investors 以 EUR500 million 收购 Kyon Energy 789 MW 电池储能项目 50% 股权（70% 债务融资），对应总投资约 EUR634,000/MW；Generali 旗下
              Sosteneo 平台以 EUR1.1 billion 收购 Enel Libra Flexsys 49% 股权，覆盖约 1.7 GW 运营和管线容量，对应完整平台基准高得多，约 EUR1.32
              million/MW。把这两个基准套到 terralayr 已披露约 150 MW 运营及在建容量，而不是 8GW 的大管线，得到约 EUR95 million 至 EUR198 million
              的示意性交叉校验区间；以陷入困境的可比上市公司倍数（Stem 或 Nuvve 式压缩）锚定的熊市情景，会明显低于上述区间，约 EUR22 million-EUR38 million。这些数字都不是
              terralayr 的实际或隐含估值，只是给投资人一条可辩护的价格带，用来测试未来披露的任何估值；也明确说明，并网队列约 11% 的确认承诺转化率，本身就是决定 8GW
              管线中有多少可视作近期估值相关容量的关键变量。
