      - number: '5.5'
        title: 差异化评估
        blocks:
          - type: paragraph
            body: >-
              terralayr 主要靠聚合能力和多优化器灵活性，把 LAYR 与传统单资产实体 tolling 协议区分开来：RWE 自己的新闻稿称，这一结构不同于连接单块实体电池的传统 tolling，因为多个单体系统通过
              terralayr 平台池化，让较小电池首次进入长期固定报酬交易（CE040）。Vattenfall 把同一池化机制定义为可靠性优势，因为虚拟组合里的电池可以相互覆盖不可用时段（CE042）；terralayr
              自己的 CEO 则把 Vattenfall 上线视为「LAYR 作为基础设施在实际运行中稳定可用」的证据（CE043）。外部认可强化了这一定位：在 Energize Capital 2025 Electrify
              Everything Top 30 中，30 家公司覆盖所有电气化领域，terralayr 是其中仅有的三家电池储能软件创新者之一（CE029）。与 Fluence Gridstack
              这类硬件中心型竞争对手相比，后者公开记录了软件架构堆栈（Nispera 资产性能管理、Mosaic AI bidding、ISO / API 集成），并明确声称符合 UL9540 / UL9540A / IEC
              安全和网络安全标准；terralayr 自有公开材料只在营销层面描述 LAYR 架构，没有公开披露可比的安全或网络安全认证（CE044、CE045）。未识别到 Virtual Battery、ETF 或 VBA
              机制的专利或其他正式 IP 注册，这意味着公司当前差异化靠的是市场执行和具名合作伙伴关系，而不是可验证的 IP 护城河（CE055）。
