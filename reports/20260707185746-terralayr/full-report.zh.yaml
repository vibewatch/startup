      - number: '2.2'
        title: 市场规模测算视角
        blocks:
          - type: paragraph
            body: >-
              terralayr 的可服务市场没有单一清晰的 TAM 数字，只能三角校验五个大体不可比的公开视角。EMMES 10 预测，到 2030 年欧洲电化学储能新增装机为 153GW/485GWh，较上一年展望上调
              25%。Modo Energy 另行预测，到 2030 年德国电网级 BESS 将超过 15GW。需求侧，BDEW 2025 年 11 月调查显示，德国待处理的大型（>=1MW）并网申请队列超过
              720GW，约为峰值负荷的九倍，其中只有约 78GW 获批。BNetzA 另一个 2024 年中压层级汇编显示，在不同层级也有类似格局：约 10,000 个申请，合计约 400GW/661GWh
              规划容量，其中只有约 3,800 个申请（25GW/46GWh）获批。与所有这些队列数字相比，Rodl & Partner 估计德国当前实际安装并运行的大型储能只有约
              2.6GW。值得注意的是，德国四家输电系统运营商自行报告的累计数字为近 700 个申请、合计 250GW，约比 BDEW 同期对似乎相似的大型申请群体给出的 720GW/78GW 估算低
              3x；本报告保留这一矛盾，不加解决，因为没有找到对齐来源。Fraunhofer ISE 基于容量的估计给出到 2030 年需要约 104GWh、到 2045 年升至
              180GWh，又提供了一个单位不可比的测量视角。在这一背景下，terralayr 自有披露管线约 8GW（约 200MW 可开工，约 150MW 运营或在建）约等于 BDEW 720GW 队列的 5%，也约为
              Modo Energy 2030 年 15GW 预测的一半，尽管这些指标并非同口径。竞争对手 Kyon Energy 披露了大体可比的管线规模（269MW 在建、1.2GW 可开工，另有 1.5GW 和 7GW
              后续管线阶段），说明多个开发商都在争夺同一全国并网队列中相互重叠的部分。未能找到独立来源、自下而上的 BESS 优化 / 容量租赁层服务收入 TAM。
