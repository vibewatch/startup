      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              terralayr 明确把 GTM 分为三类买方：市政公用事业公司（Stadtwerke）、全国性 / 大型公用事业公司，以及 BESS
              所有者和投资人。每一类都有不同的买方、用户和付款方拆分。全国性公用事业方面，RWE Supply & Trading 于 2025 年 5 月同意从 2026 年起为 terralayr 的
              50MW/100MWh 虚拟电池做五年营销；Vattenfall 另于 2025 年宣布一项 55MW、七年合作，到 2026 年已扩展为分阶段在全国营销 terralayr 电池网络，从最初 5MW 分期向完整
              55MW 爬坡。两种情况下，公用事业公司的交易 / 商品创设团队既是容量租赁买方，也是容量租赁溢价付款方。市政公用事业方面，Stadtwerke Duisburg Energiehandel 同意使用
              terralayr 平台管理一个目标超过 100MW 的组合，市政交易台同样既是用户也是付款方。BESS 所有者和投资人方面，terralayr
              直接用低切换成本做营销，允许所有者根据实时表现，在一天内更换优化商，付款方则是资产所有者自己的资产管理预算。Entrix 自称「欧洲领先的灵活性交易商」，在五个国家拥有 3GW 已签约容量，直接争夺同一 BESS
              所有者分部。更广阔市场中也在出现替代性付款 / 池化结构：The Mobility House Energy 与 Electrohold 宣布一种可融资的容量租赁模型，最低池化规模 50MW，并采用 90/10
              或 80/20 分成；Engie 与 Return 签署 100MW 长期虚拟灵活性采购协议；首个支持电网的 BESS 项目（Wutzldorf，5MW/25MWh）使用 Entrix
              做优化，显示除纯价格套利或容量租赁收入外，面向电网服务的调度正成为独立采用触发点。
