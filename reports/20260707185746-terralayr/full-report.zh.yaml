      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              德国 BESS 市场最主要的结构性约束，就是并网申请队列本身规模过大：720GW 待处理队列约为峰值负荷的九倍，正挤压 TSO/DSO
              处理能力；行业认为需要新的并网优先级规则，也就是说，大多数排队申请不会在任何合理时间内转化为已装机容量。两项监管机制在时间方向上相反：电池储能并网费豁免计划于 2029 年 8
              月到期，把接入激励前置到该日期之前；与此同时，EnWG Section 17(2b) 引入灵活 / 可限电并网，意在加快队列吞吐。融资侧，行业专家称德国 BESS
              机会提供全球范围内最好的风险调整后基础设施回报之一，同时也把交易对手风险和难以锁定稳定长期收入列为银行可融资性的核心约束；市场应对方式，是转向高度容量租赁化结构（70-100% 容量固定，德国交易集中在
              80-100%），从而把可融资杠杆提高到最高 75% 杠杆率。较高的日前价差经济性（2025 年约 EUR85,000/MW/year，比 Great Britain 高
              85%）目前同时支撑市场化和容量租赁收入案例，但这只是可逆的近端顺风，不是结构性顺风。扩张一条数 GW 管线本身就资本密集：terralayr 2024 年先融资 EUR77 million（按 Mercom
              Capital，EUR62 million 股权、EUR15 million 债务），之后又融资 EUR192 million 股权，说明增长节奏被反复融资需求卡住，不只取决于市场需求。最后，面对数百 GW
              队列，实际安装的大型储能仅约 2.6GW；terralayr 自有 EPC
              招标指南也提示，最低建设报价很少是最安全选择。二者共同说明，执行风险和并网时点，而不只是需求，决定可服务市场多快转化为产生收入的容量。近期 KraftNAV/EnWG/GeoBG
              监管变化会持久提高转化率，还是只是重新洗牌队列优先级，现有公开证据尚无定论。
            claimRefs:
