      - number: '5.3'
        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              从架构看，terralayr 的模型分层叠加了自有实体 BESS 硬件、IoT / EMS 集成层、LAYR 的虚拟化逻辑、统一 API、调度 /
              辅助服务编排，以及多优化器路由（CE002、CE003、CE007、CE019）。底层设施包括 terralayr 自有的 Tittling（22.83 MWh / 10.35 MW，2025 年 1 月 27
              日并网）和 Untersteinach（2024 年 11 月 26
              日开工）等项目；公司称这些项目使用磷酸铁锂（LFP）体系，满足最高防火安全标准并符合噪音法规（CE024、CE025、CE026）。每个资产的现场能源管理系统通过 IoT Box 接入 LAYR，再由 LAYR
              集中处理资产聚合与拆分、资产建模、运营控制和调度编排（CE011、CE012）。每个接入资产都会获得交钥匙调度基础设施，包括 FCR、aFRR
              等辅助服务的预认证、定期报告和资产管理仪表盘；平台在分配调度信号时承诺遵守技术限制和制造商规范（CE006、CE007）。最有辨识度的架构特征是 ETF
              多优化器编排层：三个独立、具名的优化器合作方可以并行交易同一底层资产，而不是把资产绑定给一个独家交易方（CE004、CE005、CE046、CE047）。RWE 和 Vattenfall 的多资产容量 toll
              结构都依赖这一机制：多个单体电池系统经平台连接成一个虚拟容量块；Vattenfall
              明确称，池化结构能降低停机风险，因为某个单元不可用时，其他电池可以补位（CE039、CE040、CE042、CE043）。整套堆栈还运行在公司无法控制的外部监管层之内——ENTSO-E 的欧盟范围网络规则，以及
              TSO / DSO 并网流程（CE051）。
