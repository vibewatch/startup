  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 推荐结论来自真实融资和客户证明，与未披露估值及系统性并网风险之间的冲突。
    data:
      nodes:
        - id: financing-proof
          label: 融资势头
          detail: 约 18 个月内三次融资事件（2024 年股权 / 债务、2026 年 1 月 EUR192M 轮、BBD 债务融资），由一家大型基础设施基金领投。
          tone: positive
        - id: customer-proof
          label: 客户证明
          detail: 与 RWE、Vattenfall 和 Stadtwerke Duisburg 披露了容量租赁 / 营销协议。
          tone: positive
        - id: comp-context
          label: 可比交易背景
          detail: 已披露的德国 BESS 交易（Kyon Energy / AllianzGI、Enel Libra Flexsys / Sosteneo）给出了每 MW 基准，但没有 terralayr 专属倍数。
          tone: neutral
        - id: valuation-gap
          label: 估值披露缺口
          detail: ESS News 和 Mercom Capital 确认，2026 年 1 月融资未披露投后估值。
          tone: warning
        - id: regulatory-risk
          label: 监管 / 并网队列风险
          detail: 德国 BESS 并网申请约 720GW，而确认承诺仅约 78GW；2026 年监管制度仍未落定。
          tone: warning
        - id: decision
          label: 继续研究 / 观察
          detail: 公开证据支持继续接触，并以可比交易约束入场纪律，但不足以给出价格敏感的买入建议。
          tone: neutral
      edges:
        - from: financing-proof
          to: decision
        - from: customer-proof
          to: decision
        - from: comp-context
          to: valuation-gap
        - from: valuation-gap
          to: decision
        - from: regulatory-risk
          to: decision
    approximationNotes: null
    claimRefs:
