      - number: '1.4'
        title: 规模、里程碑与商业合作
        blocks:
          - type: paragraph
            body: >-
              terralayr 的运营规模自 2023 年 5 月收购首个资产（「trlyr1」）以来大幅增长。截至 2026 年 1 月融资公告，公司称其在德国持有超过 150 MW 正在运营或在建的电池储能，并有接近
              200 MW 处于可开工阶段，另有 8 GW 已锁定开发管线；ESS News 独立佐证同期已有四座并网设施、另有十座在建，合计 150 MW。相比之下，2024 年 10 月 CEO Philipp Man
              告诉 TechCrunch，公司已有 7 megawatt-hours 接入电网，另有 40 megawatt-hours 即将上线，并有超过 200 个站点、合计超过 7 gigawatts
              的开发协议；这说明公司报告增长很快，但两个数据点使用不同单位，无法直接对齐。2025 年内，terralayr 持续公布站点级里程碑，包括 Bavaria 的 Tittling 并网（22.83 MWh /
              10.35 MW，2025 年 1 月），以及 Lohsa、Altencelle、Soltau、Osnabrück、Gößnitz、Elbingerode 和 Söhlde 达到可开工状态。2026
              年，terralayr 从 Averdung Group 手中收购 BBD 合资公司的全部所有权，整合一条超过 1 GW 的管线；BBD 已在 2025 年开始向 terralayr
              出售该管线中的项目。商业上，terralayr 已与 RWE 签署大型公用事业容量租赁协议（50 MW / 100 MWh，五年，2026 年起），与 Vattenfall 签署协议（最高 55
              MW，七年，2026 年分阶段上线），并与 Stadtwerke Duisburg Energiehandel 达成共同开发合作，目标组合超过 100 MW。不过，公开来源没有披露 terralayr
              的收入、收入运行率，或除上述具名交易对手和 2026 年材料中约 50 名员工之外的累计客户数。
