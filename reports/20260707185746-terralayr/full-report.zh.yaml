    title: 护城河耐久度 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓释措施 / 尽调问题
    rows:
      - - 容量虚拟化「Virtual Battery」中间件和技术中立调度 API
        - 资料未显示该中间件模式受专利保护；资金充足的开发商 / 运营商若自建调度软件，也可能复制这一模式（如 Kyon Energy、Akaysha Energy）
        - 重大
        - 要求提供 IP 保护、技术领先时间或切换成本数据，并与竞争对手自建软件对比
      - - 生态聚合能力（BATCON-2 会议，以及 Entrix、suena energy、The Mobility House Energy 组成的 Designated Optimiser 网络）
        - 只是软实力 / 品牌护城河；没有披露独家安排能阻止 Designated Optimisers 在 LAYR 之外直接服务 BESS 业主
        - 重大
        - 索取 Designated Optimiser 协议中的独家、分成或最低量条款（如有）
      - - terralayr 引用 Aurora Energy Research 数据称，在新生的德国 tolling 交易中占 6 笔里的 3 笔
        - 基数极小；竞争对手（Akaysha Energy、Kyon Energy、Return）再赢下一两笔，terralayr 份额就会被大幅摊薄
        - 阻断性
        - 独立核验 Aurora Energy Research 的六笔交易统计，并持续跟踪未来德国 tolling 交易公告
      - - 具名国家级公用事业 offtake 证明（RWE、Vattenfall）
        - 公用事业公司可能自建内部平台，或直接与 Entrix、Return 签约，而不是与 terralayr 续约
        - 重大
        - 索取合同续约条款 / 期限，以及公用事业客户是否有多供应商意图的证据
      - - 面向 BESS 业主宣传的低切换成本 / 无锁定
        - 低锁定能吸引业主使用 LAYR，也同样方便业主转向竞争聚合商；按 terralayr 自己的描述，低锁定不是耐久的留存护城河
        - 重大
        - 索取实际业主流失 / 留存数据，目前未公开披露
      - - 通过银行债务工具获得资本（EUR60M 加 EUR100M 增额授信）
        - 规模和多元化程度明显弱于 Akaysha Energy 的五家银行 AUD300M 工具，也弱于 ENGIE / Fluence 的资产负债表和公开市场规模
        - 重大
        - 比较连续融资中的资本成本和授信规模增长轨迹
      - - 全球 BESS 硬件商品化（据称中国集成商 2025 年全球份额 76%）
        - 硬件成本下降，会降低新开发商 / 运营商进入 terralayr 所在优化层的门槛
        - 轻微
        - 跟踪硬件成本下降是否具体推高德国新进入开发商 / 运营商的速度
    notes: 严重性是本报告基于证据的判断，不是公司披露的风险评级；tolling 交易数量一行被评为阻断性，是因为底层「六笔交易」数字只来自 terralayr 对第三方的引用。
