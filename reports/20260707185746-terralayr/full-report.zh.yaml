  - id: TV002
    title: 正反论点
    columns:
      - 论点
      - 正向论点（乐观情景）
      - 反向论点（悲观情景）
      - 什么会改变判断
    rows:
      - - 市场
        - 德国 BESS 并网排队（约 720GW）反映出灵活性基础设施需求极强。
        - 同一条 720GW 排队相对于仅约 78GW 的已确认承诺，也说明瓶颈而非顺风；Wood Mackenzie 认为当前模型低估了收入 / 风险差异。
        - 队列转化为承诺的比例确认并持续升至约 20-30% 以上。
      - - 产品
        - LAYR 灵活性即服务平台让 terralayr 既能持有资产，也能变现第三方资产，从而分散收入。
        - 没有独立来源验证平台经济性（抽成率、利润率），也无法与 terralayr 自身营销说法切开。
        - 独立验证的平台收入或利润率披露。
      - - 客户
        - RWE、Vattenfall 和 Stadtwerke Duisburg 的容量租用 / 代销协议提供蓝筹收入对手方。
        - 已披露的容量租用容量（例如 RWE 的 50MW/100MWh）只覆盖 terralayr 超过 150MW 运营基础的一部分；其余暴露在市场化交易中。
        - 披露整个运营组合中已实现的容量租用与市场化收入拆分。
      - - 财务
        - 约 18 个月内完成三次融资事件（2024 年股权 / 债务、2026 年 1 月股权、BBD 债务额度），显示投资人持续支持。
        - 没有单一来源把总融资额核对为一个生命周期数字，收入、利润率或估值也完全未披露。
        - 经核对的股权结构表、生命周期总融资额，以及经审计或管理账口径财务数据。
      - - 竞争
        - terralayr 的轻资产、无锁定优化器叙事，使其区别于 Kyon Energy 和 ENGIE 等垂直整合开发运营商。
        - Fluence、Stem、Nuvve 等公开可比公司说明，一旦增长或盈利能力受到质疑，BESS / 灵活性商业模式可能以很深的估值折价交易。
        - 证据显示 terralayr 的优化器经济性在已实现回报上跑赢垂直整合同行。
      - - 风险
        - terralayr 已分散对手方和融资来源，而非依赖单一投资人或客户。
        - >-
          全行业监管变动（KraftNAV 替代、Flexible Connection Agreements、可能取消 EnWG Section 118 豁免）可能压缩整个德国 BESS 行业的 IRR，terralayr
          也包括在内。
        - 2026 年监管框架稳定并最终落地，并确认电网费用和接入规则。
    notes: 综合本章其他位置已经给出来源的主张；这里以正反论点配对呈现，不构成新的原始数据。
    claimRefs:
      - CV010
      - CV011
      - CV007
      - CV009
      - CV021
      - CV015
  - id: TV003
    title: 乐观 / 基准 / 悲观情景
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 悲观
        - >-
          并网队列转化率停在观察到的约 11%（78GW/720GW）附近；监管改革（FCA 限制、可能取消 EnWG Section 118 豁免）压缩市场化 IRR；行业 BESS 倍数像 2026 年一季度 M&A
          数据那样继续走软。
        - 示意性每 MW 交叉校验压缩至或低于 AllianzGI/Kyon Energy 基准（约 EUR634k/MW）；未来若披露估值，可能接近降价轮。
        - 未披露的股权结构 / 优先权悬顶；客户集中在少数容量租用对手方；董事会 / 治理结构未解决。
        - 与 Wood Mackenzie 和 Modo Energy 提示的估值 / 回报压缩风险，以及 2026 年一季度欧洲 BESS M&A 重新定价信号一致。
      - - 基准
        - 管线转化继续维持在披露的约 11% 水平，但随着 2026 年基于成熟度的接入流程成熟而小幅改善；现有 RWE/Vattenfall/Stadtwerke Duisburg 容量租用关系得以维持或小幅扩大。
        - >-
          示意性每 MW 交叉校验落在 AllianzGI/Kyon Energy（约 EUR634k/MW）和 Sosteneo/Enel Libra Flexsys（约 EUR1.32M/MW）基准之间，也就是将
          terralayr 已披露约 150MW 规模对应到约 EUR95M-EUR198M。
        - 将 8GW 管线转化出来仍依赖外部融资；向新的成熟度流程过渡时存在监管执行风险。
        - 与 terralayr 已证明能在 18 个月内完成三次融资事件相符，但估值或收入披露仍未解决。
      - - 乐观
        - >-
          并网改革实质性抬高转化率；terralayr 以达到或超过当前基准的价格赢得更多蓝筹容量租用对手方；行业 M&A 活动（Kyon Energy/Allianz 和 Sosteneo/Enel Libra Flexsys
          已体现）延伸到 terralayr 这类平台。
        - 示意性每 MW 交叉校验接近或超过 Sosteneo/Enel Libra Flexsys 基准（约 EUR1.32M/MW），意味着在披露的约 150MW 规模上对应约 EUR198M 或更高，且尚未计入管线规模重估。
        - 从约 150MW 扩到已披露 8GW 管线中的有意义份额存在执行风险；Akaysha Energy 等资本支持新进入者带来竞争。
        - 与 2026 年欧洲 M&A 评论记录的财务投资人对多 GW BESS 平台的广泛兴趣一致，但这一点尚未在 terralayr 身上得到证实。
    notes: 本表估值数字是本章为入场纪律目的，把自有情景测算套用到 terralayr 已披露运营规模上的结果；不是 terralayr 已披露或隐含估值。
