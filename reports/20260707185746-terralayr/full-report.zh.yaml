chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              terralayr 是一家围绕德国和瑞士市场创立的电池储能资产所有者兼运营商，也提供灵活性即服务平台。母公司 terralayr AG 根据 2022 年 11 月 25 日章程，于 2022 年 12 月 6
              日在 Zug 州商业登记处正式注册为瑞士股份公司，初始股本 CHF 100,000，分为 1,000,000 股记名股票。terralayr AG 注册地址为瑞士 Zug 6300 Grafenauweg
              8。运营通过另一家德国实体 terralayr Germany GmbH & Co. KG 执行，该实体在 Berlin 以 HRA 61696 B 注册，由 terralayr Germany
              Management GmbH 担任普通合伙人，联合创始人 Ludwig Wurlitzer 担任执行董事。值得注意的是，terralayr 当前媒体资料称公司「成立于 2023 年」，这与 2022
              年瑞士注册日期以及公司 2024 年 10 月新闻稿中「成立于 2022 年」的说法冲突；本章明确记录该差异，不静默选取一个日期。商业上，terralayr
              在德国开发、持有并运营电网级电池储能系统，并另行运行名为 LAYR 的软件平台，将电池容量虚拟化并变现——既包括自有资产，也包括第三方电池——出售从 15 minutes 到 15 years
              不等的灵活性。公司将这种模式类比为 AWS 汇聚并转售云计算容量。CEO Philipp Man 曾称 terralayr
              的交易角色更像「交易所」而非自营交易商，即把电池容量匹配给当前最佳买方，而不是押注方向性头寸。由于同一轮机构融资被行业媒体称为「Series C」，CEO 本人又称「技术上是种子轮」，本章把 terralayr
              的融资阶段和命名口径视为未定，不给出确定标签。
