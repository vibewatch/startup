      - number: '8.5'
        title: 可比对象组合：上市公司、私募交易和正在进行资本进程的同行
        blocks:
          - type: paragraph
            body: >-
              terralayr 的可比对象分三层。上市公司流动性最好，但结构相似度最低：Fluence Energy (NASDAQ:FLNC) 是向 SEC 报告、硬件与软件垂直整合的既有玩家，截至 2026 年 7 月
              7 日市值 $2.99 billion、企业价值 $3.00 billion；Stem Inc 和 Nuvve Holding 则说明，一旦增长或资产负债表担忧占上风，BESS /
              灵活性软件估值可以跌到多低。私募交易提供更接近的结构参照：AllianzGI/Kyon Energy 和 Sosteneo/Enel Libra Flexsys
              两笔交易，都是财务投资人买入德国或欧洲开发商-运营商平台的少数股权，结构上接近 terralayr 自身的业主运营商加平台模式，尽管二者都没有披露像上市公司 EV/revenue
              那样干净的倍数。第三层是正在推进资本进程的同行：Akaysha Energy 是 BlackRock 支持的澳大利亚 BESS 开发商，运营组合约 2 GW；它在 2026 年聘请 Macquarie
              Capital 推进一项据称目标估值超过 USD1 billion、出售 50-60% 股权的流程，提供了市场当下如何给已规模化 BESS 开发商-运营商定价的实时参照，尽管司法辖区不同，且当前披露规模是
              terralayr 的多倍。Q1 2026 欧洲 BESS 并购活动是解读这些可比对象的背景；一位 Baringa 董事将其概括为「市场成熟并重新定价风险」，当季有 50 笔大型交易，IRR
              正常化并靠近资本成本。
