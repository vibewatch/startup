            title: 在这一阶段，具名正式上线证明得到异常充分的交叉印证
            body: 三个具名正式上线对手方（RWE、Vattenfall、Stadtwerke Duisburg Energiehandel）都由非公司媒体独立确认，而不只是公司新闻稿；这个证据门槛高于多数早期平台公司。
