      - - Kyon Energy / AllianzGI-TotalEnergies
        - 隐含每 MW 欧元价值（本报告测算）
        - EUR500M 收购 789MW/1628MWh 组合 50% 股权，约 EUR634k/MW 总投资，70% 债务融资（2026 年 3 月）
        - 最接近且已披露的德国 BESS 开发商合资交易倍数。
        - 组合层面的项目融资交易，不是公司股权估值；每 MW 数字是本报告自有测算。
      - - Enel Libra Flexsys / Sosteneo
        - 隐含每 MW 欧元价值（本报告测算）
        - EUR1.1bn 收购约 1.7GW 运营 + 管线组合 49% 股权，隐含整个平台价值约 EUR1.32M/MW（2024 年）
        - 公用事业公司支持的开发运营平台少数股权，结构上最接近 terralayr 的持有运营商模式。
        - 2024 年交易（市场节奏不同于 2026 年）；每 MW 数字是本报告自有测算，并非官方披露倍数。
      - - Harmony Energy Income Trust / Foresight 私有化交易
        - 私有化溢价
        - GBP209.9M，92.4p/股，42% 溢价（2025 年 7 月）
        - 英国运营 BESS 组合私有化，提供公转私溢价基准。
        - 英国市场，不是德国；收益信托包装不同于 terralayr 的私人成长股权结构。
      - - Akaysha Energy (BlackRock)
        - 报道的目标估值 / 出售股权
        - Bloomberg 报道的目标估值 >USD1bn；正考虑出售 50-60% 股权，由 Macquarie 负责流程（2026 年）
        - 最接近的实时资本流程可比：一家 BlackRock 支持的 BESS 开发运营商正在 2026 年实时确定估值。
        - 澳大利亚市场；交易尚未完成；估值数字来自二手报道，不是确认成交价。
      - - terralayr（2026 年 1 月轮）
        - 投后估值
        - 未披露
        - terralayr 自身最近一轮定价融资。
        - terralayr 没有公开估值；这是本章入场纪律框架围绕的核心证据缺口，不是已经解决的可比项。
    notes: 各项指标均为相应来源截至引用日期的自有披露；尚未做经审计的跨可比估值。
