        title: 成本结构、利润率驱动与资本强度
        blocks:
          - type: paragraph
            body: >-
              没有公开来源披露 terralayr 债务成本、每 MW 运营维护成本或按收入流拆分的毛利率，因此本节依赖独立的德国 BESS 项目融资基准，而不是公司特定数字。Modo Energy 2026 年 1
              月模型显示，典型德国 BESS 项目债务利率为 4-6%，目标股本回报为 12-18%；贷款方将杠杆率上限压在约 75%，并要求七年 mini-perm 到期时至少偿还贷款余额的 60%——这与
              terralayr 自身 €60 million ABN AMRO/Commerzbank 设施采用的七年 mini-perm 结构相同。两家独立来源互相佐证，德国贷款方通常要求 60-100%
              项目收入在放债前已被合约锁定；terralayr 自身债务融资组合约 49%
              由容量租赁锁定，处于或低于该区间，却仍完成融资交割。这说明在此处支撑银行可融资性的，不只是合约化收入深度，也包括市场化敞口与多元化组合结构之间的平衡。成本侧，terralayr
              唯一披露的单位经济数据点，是公司主张但未经审计的磨损成本节省：其多优化商平台通过「净额抵消」相反优化商调度计划，每 MW 每年最多节省 €4,000。另一个反向、独立的法律 / 税务来源 Rödl &
              Partner 报告称，德国 BESS 收入在 2025 年较 2024 年「显著下降」，且营销商报酬模型在全市场仍不可比且不透明；这不是 terralayr 特有问题，但对其整个可服务市场都是成本和利润率逆风。
