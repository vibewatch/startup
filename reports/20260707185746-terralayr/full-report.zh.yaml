      - number: '8.7'
        title: 展品
        blocks:
          - type: callout
            title: 继续研究，不是买入：今天还无法知道入场价格
            body: terralayr 的融资和客户验证是真实的，但没有公开来源披露投后估值、收入或经核对的融资总额，因此还无法支撑任何对价格敏感的买入判断。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV042
              - CV043
          - type: callout
            title: 720GW 并网队列是系统性、全行业风险
            body: 据报道，德国 BESS 并网申请队列已超过 720GW，而确认承诺只有约 78GW；这个瓶颈对 terralayr 的 8GW 管线和任何竞争对手一样关键。
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV039
