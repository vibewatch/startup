  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与买方格局
        blocks:
          - type: paragraph
            body: >-
              terralayr 的商业化围绕三类主要买方组织，公司官网为每类都设了面向客户的专页：签署多资产容量 tolling 协议的全国性 / 大型公用事业公司；通过 Virtual Battery
              Auctions（VBAs）获取容量的市政公用事业公司（Stadtwerke）；以及购买托管式、可切换优化器服务的 BESS 所有者 / 投资者（CU001）。RWE 和 Vattenfall
              等大型承购方是德国全国性对手方，其大宗商品开发与交易台同时承担 toll 溢价的买方和付款方角色；两家公司自己的新闻稿分别独立确认了这一点（CU002）。市政公用事业客户以 Stadtwerke Duisburg
              Energiehandel 为例：该公司独立称自己是德国最大的市政能源交易商之一，与其他 Stadtwerke 有 200 多个业务关系，并通过 API-first、IoT Box
              连接的配置接入（CU003）。BESS 所有者 / 投资者由一套独立组合管理产品服务；证据来自 Vattenfall 自有大宗商品开发高管的具名证言，而不是独立客户调查（CU004）。第四条、更早期的渠道是
              ENGIE；其 2025 年 5 月宣布的「Mini Toll」短周期灵活 tolling
              框架仍只是已披露合作关系，而不是已确认的正式上线关系（CU005）。任何细分都没有披露总客户数；全部公开证据都是具名单个案例，而不是已量化的客户基础（CU030）。
