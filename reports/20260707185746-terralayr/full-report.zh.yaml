      - number: '5.4'
        title: 部署、集成、可靠性、支持与路线图
        blocks:
          - type: paragraph
            body: >-
              terralayr 自己的状态页在 2026 年 7 月 7 日显示，所有受监控服务均在线；在其测量窗口内，生产环境 api.trlyr.com/virtual-assets 端点可用率为
              99.999%，api.trlyr.com/auth 为 100%，www.trlyr.com 为 99.977%。页面还列出单独的 sandbox
              端点，说明公司有独立的预生产集成环境（CE018、CE019）。这些具名端点之外，公开资料中没有找到 API 参考文档、SDK 或接入文档；除这张实时快照外，也没有正式
              SLA、服务赔付政策或历史事故复盘公开可得（见证据缺口 GE002、GE003）。交付侧，terralayr 发布了 60 天 EPC 招标流程，用来筛选、选择并签约交钥匙 EPC
              供应商，再跟踪执行时间表、预算，以及现场健康与安全、进度和合规（CE016）。最近完成的九个项目、112 MW / 238 MWh 组合融资以这一流程为支撑；建设和运营由三家成熟供应商通过交钥匙 EPC
              合同和长期 O&M 协议交付，公司明确把这种安排表述为分散执行风险（CE036、CE038）。2026 年的路线图信号包括 RWE 五年期多资产 toll（自 2025 年 5 月 28
              日起）、Vattenfall 从初始 5 MW 批次逐步爬坡到完整 55 MW 虚拟组合切片，以及 2025 年 11 月 ETF
              多优化器发布（CE039、CE041、CE004）。独立媒体报道——Bayerischer Rundfunk 对 Tittling 并网日的现场电视专题，以及 MDR 对 BESS
              并网优先级趋势的报道——为公司的建设和运营进展提供了超出自有公告的第三方印证（CE027、CE028）。
