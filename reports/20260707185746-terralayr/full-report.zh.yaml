  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险登记册概览
        blocks:
          - type: paragraph
            body: >-
              本章只使用公开监管文件、法院和行政决定报道、法律顾问分析、行业协会指引，以及 terralayr 自身披露，对 terralayr 的风险从五个视角排序：监管 / 法律、运营 / 技术 / 安全、伙伴 /
              依赖、财务 / 模型、人员 / 执行（CR001）。terralayr 是一家披露较少的私营公司，又处在 2026
              年监管仍在快速变化的德国电池储能市场；因此，这份登记册主要依赖行业层面证据，而不是公司特定事故史——公开来源没有披露后者。行业证据包括并网排队统计、BNetzA
              对一家储能运营商作出的真实不利裁定（BK6-25-325）、欧盟和德国关键基础设施法律，以及独立分析师对市场化收入被同类容量蚕食的建模（CR002、CR003、CR004、CR036）。某项风险若没有
              terralayr
              特定证据（安全事故、网络安全认证、诉讼），本章会明确说明，而不是从沉默中推断记录干净（CR021、CR026）。风险热力图（FR001）汇总了四大类别中八项最高严重度风险的发生可能性、严重度、缓释成熟度和残余暴露。
