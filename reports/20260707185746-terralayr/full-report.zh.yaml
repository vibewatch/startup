      - number: '8.6'
        title: 退出准备度、尽调问题和投资假设破裂触发器
        blocks:
          - type: paragraph
            body: >-
              按常规标准，terralayr 还没有进入可退出状态：它刚完成一轮成长股权融资，未披露估值，也没有公开证据显示正在推进出售或 IPO 流程，这一点不同于 Akaysha Energy 2026
              年正在进行的资本进程。最高优先级的单一尽调问题，是确认 2026 年 1
              月融资后的投后估值和股权结构表；在实际入场价格明确之前，收入细节、管线转化状态、债务条款和治理结构都排在其后。六个具体的投资假设破裂触发器，足以推动重新评级：并网队列转化停滞，12
              个月内确认承诺转为签约容量的比例低于约 10%；未来披露的估值对应每 MW 低于约 EUR300,000，明显低于 AllianzGI/Kyon Energy 约 EUR634,000/MW 的基准；失去 RWE
              或 Vattenfall 等主要容量租赁对手方；Section 118 EnWG 并网费豁免被取消，或 Flexible Connection Agreement
              出现严重限电；违反债务契约条款或再融资失败；以及全行业重新定价证据，例如可比 BESS 平台交易出现困境倍数。在估值和财务披露缺口补上之前，本章建议维持继续研究 / 跟踪，而不是买入或回避。
