              由 Kyon Energy/AllianzGI 与 Sosteneo/Enel Libra Flexsys 基准拼出的 EUR22M-EUR230M 示意区间，是本章把情景测算套到 terralayr
              已披露规模上的结果，不是 terralayr 已披露或隐含的估值。
