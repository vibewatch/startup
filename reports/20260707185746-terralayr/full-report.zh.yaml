      - number: '7.4'
        title: 伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              terralayr 已披露的伙伴基础，在每一个依赖类别上都偏窄且集中。全部已披露具名 toll 容量都落在 RWE 和 Vattenfall 两个对手方（CR029）；项目债务落在 ABN AMRO 和
              Commerzbank 两家具名贷款方（CR030）；市政公用事业分销渠道通过单一具名伙伴 Stadtwerke Duisburg Energiehandel 运转（CR032）；绿地管线增长在很大程度上依赖与
              Averdung Group 的已收购 BBD 合资公司（CR033）。公司已把优化器 / 交易伙伴基础从早期单优化器模型，分散到覆盖 Entrix、suena energy 和 The Mobility
              House Energy 的三方 Enhanced Trading of Flexibility
              结构，因而在这一特定渠道上略微降低了单点依赖（CR031）。监管方依赖结构性很高，且无法分散：Bundesnetzagentur 和区域电网运营商控制并网审批与费率设定；BK6-25-325
              拒绝先例已经从反面说明了这一点（CR034）。建设执行依赖经过招标但未公开具名的 EPC 承包商，因此无法独立评估承包商层面的集中度（CR035）。依赖地图（FR003）列出了流入 terralayr
              自有资产和平台收入的全部七项具名伙伴与结构性依赖。
