  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：同类、既有玩家、相邻玩家与新进入者
        blocks:
          - type: paragraph
            body: >-
              terralayr 最接近的直接同类，是争夺同一第三方资产所有者委托的独立 BESS 优化 / 交易平台：Entrix 自称「欧洲领先的灵活性交易商」，每天 30,000 笔交易，管理 70
              个项目，在五个国家签约 3GW 容量；suena energy 也是同类——二者都被 terralayr 自己接入其多优化商平台，作为「指定优化商」。既有的纵向一体化开发运营商处在相邻但重叠的类别：Kyon
              Energy 端到端开发、建设并运营自己的德国 BESS 资产组合（269MW 已实现、1.2GW 在建，可开工管线在两个 2026 年站点快照中从 1.5GW 增至 1.7GW）；ENGIE
              在十二个国家持有并运营 5.6GW 储能容量，服务于 2030 年 95GW 可再生能源与储能目标。二者都争夺 terralayr 自有管线依赖的同一并网队列容量，但都不提供第三方优化服务。Fluence
              更上游，是一家公开上市、在 SEC 注册的硬件加软件系统集成商。相邻灵活性供应商包括 The Mobility House Energy（EV/V2G 加电池营销，本身也是 terralayr
              指定优化商）、Nuvve（V2G / 表后灵活性）和 GreenFlex（为约 800 个客户提供更广义脱碳咨询）。现状替代方案包括公用事业公司自己的内部交易台（RWE Supply &
              Trading、Vattenfall Commodity Origination 团队）以及传统单一优化商双边容量租赁交易。可能的新进入者包括 BlackRock 旗下 Akaysha Energy，其通过一项
              AUD300 million 债务融资支持的合资公司进入德国市场；以及总部位于 Amsterdam 的聚合商 Return，后者刚与 ENGIE 签署 100MW 虚拟灵活性采购协议。
