      - number: '1.5'
        title: 监管风险与证据缺口
        blocks:
          - type: paragraph
            body: >-
              terralayr 的增长雄心嵌在德国电池储能市场的重大系统性瓶颈之中。BDEW 2025 年 11 月调查显示，德国输电和配电运营商收到的大型电池储能并网申请合计超过 720 GW，是德国 263 GW
              已装机发电容量的 2.5 倍以上；而实际已安装的大型储能只有约 2.6 GW，律所 Rödl & Partner 也独立佐证了这一数字。问题还被监管不确定性放大：进入 2026
              年时，德国电池储能监管框架仍未稳定。2025 年 11 月 Energy Industry Act 修正案最初把 BESS 认定为优先基础设施，随后 Geothermal Energy Acceleration
              Act 收窄这一优先权；2025 年 12 月 KraftNAV 条例修正案又在替代性接入流程出台前，将大型电池移出快速通道。Energy-Storage.news 因此把 2026 年描述为德国 BESS
              的「成败之年」。Clean Energy Wire、Rödl & Partner 和 Energy-Storage.news 都独立将这种排队与规则变动环境定义为系统性执行风险，且与 terralayr 自身 8
              GW 管线雄心直接相关。除行业层面风险外，本章审阅的资料包无法验证若干公司特定事实，因此记录为明确证据缺口而非编造：可对齐的生命周期融资总额和估值；收入、收入运行率和累计客户数；以及完全对齐的董事名单和治理 /
              投票权结构，尤其是 terralayr 自有四名董事法律声明与 North Data 更广义八名董事会列表之间的差异。每一项都应直接向公司追问，不应默认成立。
