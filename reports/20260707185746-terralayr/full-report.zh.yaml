      - number: '5.6'
        title: 信任、安全、网络安全、隐私、合规与质量控制
        blocks:
          - type: paragraph
            body: >-
              terralayr 的隐私政策将 terralayr AG, Grafenauweg 8, 6300 Zug 列为 GDPR 数据控制者；该政策最后更新于 2022 年 12 月 9 日，并承诺公司按照
              Equator Principles 负责任开发，同时为受项目影响的利益相关方提供英德双语申诉机制（CE020、CE021）。除这份政策文件外，本章审阅的公开来源没有披露 LAYR 平台或 API 获得 ISO
              27001、SOC 2 或可比网络安全认证，也没有公开安全事故披露、漏洞奖励计划或漏洞披露记录（CE022；证据缺口 GE001、GE009）。这与 Fluence Gridstack
              形成对比：后者在声称硬件符合 UL9540 / UL9540A / IEC 安全标准的同时，公开表示其网络安全「支持国际网络安全标准」（CE044）。硬件安全方面，terralayr 称其 LFP
              电池技术「尤其安全，并满足最高防火安全标准」，系统设计也格外安静且符合噪音法规；但没有找到针对 terralayr 自有硬件独立签发的安全证书（CE024）。建设侧质量控制通过公司 60 天 EPC
              招标流程运行，该流程明确跟踪项目交付期间的现场健康与安全、进度和合规（CE016）；最近的组合融资也通过三家成熟供应商的交钥匙 EPC 和长期 O&M 合同搭建，以分散执行风险（CE038）。Roedl &
              Partner 的独立第三方分析印证，德国全行业的安全概念、审批能力和可保险性要求都在收紧，这是 terralayr 必须穿越的监管背景，但不是 terralayr
              自身合规姿态的直接证据（CE049）。除实时公开状态页外，没有找到正式 SLA、可用率保证或事故复盘；terralayr 平台机制也未识别到专利或 IP
              注册。这里把两者都保留为明确证据缺口，而不是推断其做法强或弱（CE023、CE055；证据缺口 GE002、GE005）。
