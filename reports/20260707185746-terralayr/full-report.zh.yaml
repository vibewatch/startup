  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: terralayr 交付什么：产品定义与客户流程
        blocks:
          - type: paragraph
            body: >-
              terralayr 的核心产品是 LAYR：一套软件平台，把实体电池储能系统（BESS）容量虚拟化，让客户通过统一 API 变现，而不是逐个资产签定制交易关系（CE001、CE003）。LAYR
              把实体电池变成一个「Virtual Battery」数字孪生体，既能切成精确 MW
              数量，也能跨多个实体资产聚合，让不同承购方不必拥有或运营硬件，就能使用同一底层容量池（CE002、CE013）。落到客户流程上，有几条路径：市政公用事业公司通过 API-first、IoT Box
              连接的配置接入，再通过 Virtual Battery Auctions（VBAs）交易容量；Stadtwerke Duisburg Energiehandel 就是从短期 tolling 框架协议转到 VBA
              实际参与（CE009、CE011）。电力交易商按固定价格租用一天、一周或更长时间的储能 MW 切片，在 Day-Ahead、Intraday Continuous、FCR 和 aFRR
              市场交易（CE008）。BESS 所有者和投资者使用另一套产品，把整个组合交给平台主动管理；平台为其容量匹配表现最好的优化器，并允许一天内切换（CE014）。RWE、Vattenfall
              等大型承购方则签多资产容量 tolling 协议，LAYR 把多个单体电池系统聚成一个精确 MW 规模的虚拟容量块（CE017、CE039、CE041）。这些流程背后的机制相同：LAYR
              把实体资产的复杂性抽象成一层可交易、由 API 驱动的灵活性能力（CE032）。
            claimRefs:
