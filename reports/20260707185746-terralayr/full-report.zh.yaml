              terralayr 的资本充足性图景完全由融资事件公告拼成，而不是资产负债表披露：已审阅来源没有披露账上现金、月度烧钱速度或以月计的现金跑道。两项最大已披露资本事件分别是 €192 million
              成长股权轮（包括 €80 million 扩大融资选项），由 Eurazeo 通过 Transition Infrastructure Fund 领投，于 2026 年 1 月 19 日宣布，RIVE
