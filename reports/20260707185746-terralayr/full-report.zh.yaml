      - number: '7.7'
        title: 缓释、监控与放弃标准
        blocks:
          - type: paragraph
            body: >-
              terralayr 展示了基础运营与合规设施——GDPR 数据控制者指定和实时公开状态页——但两者都没有披露 KRITIS / BSIG 注册或 ISO 27001 认证（CR049）。截至 2026
              年运行日，德国 BESS 并网、网络费率和建设成本补贴规则都仍在主动变化中，TSO 成熟度程序尚未启动，BNetzA 储能费率指引仍未落定；因此，任何按今天 toll
              或市场化定价假设项目经济性的模型，都带有实质性的未来监管重定价风险（CR050）。缓释与放弃标准表（TR005）把本章识别的每项头部风险，都转成可监控触发器和阈值：更多不利 BNetzA
              裁定、最终储能网络费率超过当前 toll 假设、确认 KRITIS / BSIG 未注册、合同收入占比跌破典型贷款方 covenant 底线、RWE 或 Vattenfall toll
              不续约、市场化价差压缩到低于今天基准，或任何已披露安全 /
              网络安全事件。风险传导图（FR002）追踪每类风险如何通过收入、利润率、融资余量和对手方留存，传导到整体投资论点；本章各表和证据缺口中嵌入的尽调路径，就是任何评估 terralayr
              的投资人或贷款方下一步应提出的具体问题。
