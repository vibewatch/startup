              terralayr 的 GTM 动作瞄准三类具名客户分部——市政公用事业公司、全国 / 国际公用事业公司，以及 BESS
              所有者和投资人——每类都有专门页面，主轴是降低风险和提升收入，而非披露定价层级。由于没有披露获客成本、销售周期长度或回本周期，terralayr 突出切换成本论点：公司告诉 BESS
              所有者，他们可以「只需一天」切换优化商且无锁定，把灵活性本身作为主要销售抓手。相比新闻稿，terralayr 对 2025 年 2
              月行业小组的自述更坦率地承认市场摩擦：关于容量租赁，公司指出「尽管开发商、资产管理人和承购方非常好奇，德国至今签署的交易很少」，且小型或中型独立资产难以找到有竞争力的报价——这更像一条缓慢、关系驱动的企业销售周期，而不是自助式动作。唯一量化的公开牵引力代理指标，是实物容量数字（在
