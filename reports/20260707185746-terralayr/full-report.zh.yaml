      - number: '3.3'
        title: 切换成本、锁定、多归属与合作伙伴 / 分销权力
        blocks:
          - type: paragraph
            body: >-
              terralayr 自有营销明确把低切换成本作为差异点：面向 BESS 所有者的材料承诺，所有者可基于实时表现，「只需一天」切换优化商，从而「切换、扩张并赚得更多」；LAYR
              产品页称多优化商模型「无锁定」「无切换成本」。面向市政公用事业的材料走得更远，描述其自有平台内有「外部优化商作为备用选项」——也就是说，terralayr
              明确让市政客户在第三方优化商之间多归属，而不是要求独家使用某一家交易台。这对护城河是双刃剑：terralayr 自有平台把单个优化商做成可实时互换和比较，正是这一设计吸引 BESS 所有者使用
              LAYR；但同一设计也让所有者很容易离开 LAYR、转向竞争聚合商，并把任何接入平台的单一具名优化伙伴价值商品化。terralayr 三家具名「指定优化商」中的两家——Entrix 和 The Mobility
              House Energy——都在自己官网上把自身作为全服务优化 / 交易提供商直接卖给 BESS 所有者，意味着所有者并不依赖 terralayr 平台才能触达任一伙伴；包括 terralayr、Kyon
              Energy、Entrix 和 Akaysha Energy 在内的所有具名德国 BESS 优化与容量租赁竞争对手，也都处在同一 EnWG 并网制度之下，并面临同一个 2029 年 8
              月并网费豁免悬崖，因此没有竞争对手披露出监管优势。
            claimRefs:
              - CP029
              - CP030
              - CP031
              - CP032
              - CP033
              - CP034
              - CP041
      - number: '3.4'
        title: 护城河耐久性、商品化风险与反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              terralayr 把核心技术护城河描述为容量虚拟化的「Virtual Battery」中间件和技术无关的调度
              API；公司称，这让它可以接入「不论……电池制造商，甚至通信协议不兼容」的电池。这个中间件模式并不明显能阻止资金充足的开发运营商复制，尤其是 Kyon Energy 或新进入的 Akaysha Energy
              这类已经在自建调度软件的玩家。来自 Berenberg、Alexa Capital、KfW、ECO STOR 和 Ingrid Capacity 的多位德国 BESS 市场小组嘉宾，都把交易对手 /
              信用风险和收入稳定性描述为全行业银行可融资性的核心约束，而非 terralayr 特有问题；这说明主要竞争战场是交易对手可信度，而不是专有技术。terralayr 自身引用的 Aurora Energy
              Research 显示，引用时德国市场只有六份容量租赁协议，其中三份由 terralayr 签署——在极小交易数量中占比过大，任何单个竞争对手赢单都可能显著稀释。反向证据显示，terralayr
              并没有独占市场最新交易结构：Wutzldorf 首个支持电网的 BESS 项目，以及 ENGIE-Return 100MW 虚拟灵活性采购协议这项标志性交易，都分别由具名竞争对手 Entrix 和 Return
              完成，而不是 terralayr。另一个信号是，中国系统集成商据报道在 2025 年占全球 BESS 硬件市场 76% 份额；虽然该数据描述的是全球硬件层，而不是德国优化 /
              容量租赁层，但它仍是行业范围内的商品化信号，会间接挤压本章所有硬件相关竞争对手的利润率。未能找到这些公司之间经独立审计的市场份额或赢率对比；本章每个已披露管线、项目数量或交易数量数字，都来自公司自己报告。
