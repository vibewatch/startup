        title: 留存、持久性以及扩张 / 集中风险
        blocks:
          - type: paragraph
            body: >-
              terralayr 没有披露平台业务的 Net Revenue Retention、Gross Revenue Retention 或流失率（CU025）。具名大型承购方 toll
              的已披露合同期限集中在较长一端（RWE 五年、Vattenfall 七年）；但公司高管称平台完整合同期限范围从 15 分钟到 15 年，没有披露标准期限或中位期限（CU026）。Stadtwerke
              Duisburg 从短期框架推进到实际 VBA 参与，是唯一有公开证据的存量扩张案例（CU027）。具名证言存在，但没有找到独立发布的满意度调查或 reference-call
              摘要（CU028）；独立行业媒体称既有玩家「已经通过 LAYR 调度」，暗示持续使用，但没有正式使用指标（CU029）。公开资料中没有总客户数或续约率披露（CU030、CU031）。集中度方面，RWE 和
              Vattenfall 合计占全部已披露具名 toll 容量，且没有最大客户收入占比拆分（CU032、CU033）。ETF 模型让平台层面依赖三个具名优化器合作方（CU034）；相对于 2026 年播客提到的
              8GW 管线，所有具名客户都位于德国（CU035）；大型承购方交易从公告到上线通常需要数月到数个季度，RWE 又拒绝向媒体披露准确 toll
              价格，进一步放大不透明度（CU036、CU037）。独立市场分析（Roedl & Partner；Modo Energy 2026 Q2 展望）还分别提示，德国并网排队超过 700GW，而已装机仅约
              2.5-2.6GW；BESS 电网费豁免也只持续到 2029 年 8 月。这些都是未来对手方经济性的结构性、非公司特定风险（CU038、CU039、CU040）。
