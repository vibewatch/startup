      - number: '3.2'
        title: 能力、定价与 GTM / 分销对比
        blocks:
          - type: paragraph
            body: >-
              terralayr 披露了具体容量租赁定价区间：5-7 年、部分最长 10 年合约，每 MW 每年 EUR110,000-150,000。该区间与 Modo Energy 独立建模的德国 BESS
              交易底层日前价差经济性（约 EUR85,000/MW/year）在数量级上相符；Entrix、Kyon Energy、ENGIE 或 Fluence 都没有在各自官网发布可比的 EUR/MW/year
              数字，因此公开证据只能让跨竞争对手定价做到部分可比。terralayr 的差异化商业结构，是其「Enhanced Trading of
              Flexibility」（ETF）模型：让三家具名第三方优化商——Entrix、suena energy 和 The Mobility House
              Energy——通过一键容量再分配并行交易同一实体电池。terralayr 称，该结构通过多优化商平台对冲相反调度计划，较单一优化商调度每 MW 每年最多节省约 EUR4,000 磨损成本。分销与 GTM
              方面，terralayr 与 ABN AMRO 和 Commerzbank 完成 EUR60 million 高级担保组合债务融资（外加 EUR100 million
              增额额度），并举办自己的行业会议（BATCON-2，Munich），吸引开发商、投资人、公用事业、交易商和政策制定者；Entrix 或 Kyon Energy 没有披露类似生态建设活动。Fluence
              的公众公司身份——由 SEC EDGAR 文件和 S&P Global Tier 1 Cleantech Companies 认可佐证——让其进入资本市场的能力明显强于这里任何一家私营竞争对手；Akaysha
              Energy 的 AUD300 million、五家银行债务银团也大于且更加多元化，超过 terralayr 自己的两家银行融资。公开来源中找到的唯一外部验证，是 Energize Capital 将
              terralayr 列为全电气化 30 家公司中仅三家电池储能软件创新者之一，支持其软件平台定位。
