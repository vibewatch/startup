  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              terralayr 的可服务市场，是德国电网级电池储能系统（BESS）的优化、调度和承购结构设计层，而不是 BESS 硬件制造、EPC 建设或表后 / 户用储能。terralayr 自有 LAYR
              平台将第三方持有的实体 BESS 资产虚拟化，并支持定制承购结构，包括容量租赁与市场化交易组合，再以灵活切片方式通过周期性的虚拟电池拍卖（VBA）进行拍卖。排除但相关的分部包括工厂化硬件供给（以 Fluence
              Gridstack 产品线为代表）、纵向一体化的公用事业自有储能（以 ENGIE 5.6GW 自有并运营组合为代表），以及相邻灵活性市场，如电动车到电网调度（The Mobility
              House、Nuvve）和更广义的脱碳咨询（GreenFlex）。在这一边界内，terralayr 专注的容量租赁结构仍是早期且集中的小众市场：根据 terralayr 引用的 Aurora Energy
              Research，terralayr 自身发布时德国市场只有六份容量租赁协议，其中三份由 terralayr 签署，价格通常在每 MW 每年 EUR110,000 至 EUR150,000 之间。Modo
              Energy 对可比容量租赁价格门槛的独立建模（每 MW 每年 EUR95,000-EUR115,000，杠杆率最高 75%）大体佐证了该区间下端，但在上端略有分歧。随着新兴长时储能技术到 2030
              年在德国达到商业规模，市场边界是否最终应扩大纳入这些技术，仍是开放问题，因为公开资料缺少按技术划分的市场边界数据。
