            title: 具名的一线收入对手方
            body: RWE、Vattenfall 和 Stadtwerke Duisburg 给 terralayr 带来已披露的容量租赁和营销关系，这个商业信号比单纯宣布管线更强。
            calloutType: strength
            claimRefs:
