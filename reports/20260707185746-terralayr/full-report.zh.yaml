      - number: '2.5'
        title: 规模测算与采用尽调缺口
        blocks:
          - type: paragraph
            body: >-
              几个重大缺口限制了仅凭公开证据精确测算 terralayr 可服务市场的能力。第一，BDEW 的德国大型队列数字（720GW/78GW）与四家 TSO 自报数字（250GW/近 700 个申请）之间约 3x
              差异，在本研究找到的任何来源中都没有被对齐；该差异会实质改变对并网瓶颈约束程度的判断。第二，SolarPower Europe 的 European Battery Market Outlook
              2026-2030 可能作为第三个独立预测来源，但无法访问，因为详情页被交互式 JavaScript 数据集查看器拦住，没有返回可读的市场规模文本。第三，EU Joint Research Centre
              的储能政策与监管框架页面返回 HTTP 层级访问拒绝，而非页面内容，阻断了对 EU 层面监管表述的直接验证。第四，Fraunhofer ISE 的容量需求数字（2030 年 104GWh，2045 年
              180GWh）只能通过二级新闻引用获得，而不是研究所自己的原始出版物。第五，Aurora Energy Research 关于德国现有六份容量租赁交易、其中三份为 terralayr 所签的计数，只来自
              terralayr 自我引用，尚未独立验证。最后，未能找到独立来源、自下而上的 BESS 优化 / 容量租赁层服务收入
              TAM；保留下来的每个规模视角，都是用并网申请队列、已装机基础或容量需求预测代理机会，而非服务收入估算。由于这个市场的底层公开证据确实存在争议且不完整，本报告明确保留这些缺口，而不是把它们抹平成单一自信的市场规模数字。
            claimRefs:
              - CM043
              - CM044
