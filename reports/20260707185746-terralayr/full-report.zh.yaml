      - number: '5.2'
        title: 模块、资产与产品线地图
        blocks:
          - type: paragraph
            body: >-
              核心 LAYR 软件之外，terralayr 把公开面向市场的产品拆成几条可区分的产品线。Enhanced Trading of Flexibility（ETF）模型于 2025 年 11 月 19
              日推出，是一个多优化器产品，把 Entrix、suena energy 和 The Mobility House Energy
              三个具名优化器合作方接到一起，让同一块电池并行参与日内市场和辅助服务；容量可在它们之间一键重分配，无需新合同（CE004、CE005）。Virtual Battery Auctions
              是单独的容量租赁产品，不同于面向所有权的 BESS 所有者 / 投资者产品；后者让资产所有者切换优化器，并直接管理整个组合（CE008、CE014）。市政公用事业与公用事业集成产品线，把平台打包成
              API-first、IoT 连接的配置，专门服务公用事业交易台（CE011、CE012）。多资产容量 tolling
              是第四条可区分产品线，面向大型承购方，把多个实体电池聚成一个虚拟容量块（CE013）。最后，terralayr 还运营独立的 Asset Development
              产品线，与土地所有者、市政机构和独立项目开发商合作选址并建设新的 BESS 项目；公司引用了数百 MW 已落地项目经验，以及最近九个项目、112 MW / 238 MWh
              组合融资案例（CE015、CE036、CE037、CE038）。这套模块 / 产品拆解只能从 terralayr
              自己发布的页面重建，而不是来自官方产品目录，因此应视为代表性清单，而非穷尽枚举（见枚举不完整这一证据缺口）。
