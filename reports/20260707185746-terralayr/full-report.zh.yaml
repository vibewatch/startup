      - number: '1.2'
        title: 管理层、创始人与治理
        blocks:
          - type: paragraph
            body: >-
              terralayr 由 CEO Philipp Man 和 COO Ludwig Wurlitzer 联合创办。二人曾花约十年打造奢侈腕表市场 CHRONEXT，之后转向电池储能灵活性；Man 此前还在
              Glencore 航空燃油交易台工作。具名高管层还包括 CFO Robin Cresswell（曾任 Deutsche Bank 美洲基础设施与能源负责人及 DACH 企业贷款负责人）、CTO Sam
              Boswell（曾任职 dare、Limejump 和 Device Authority）、CCO Mikko Preuß（2025 年 4 月晋升，加入公司时间很早，曾任职 Siemens Wind
              Power、BCG 能源业务，并在 Picus Capital 做投资）以及资产开发副总裁 Valerie Mahar。公司治理自注册以来已有明显演进：2022 年 12 月瑞士原始注册文件列 Till
              Spillmann 为唯一董事，拥有单独签字权；而 terralayr 当前法律声明列出四人董事会，包括 Philipp Man（主席）、Ludwig Wurlitzer、Creandum 普通合伙人 Johan
              Brenner，以及 Jochen Schwill——Next Kraftwerke 创始人兼前 CEO，后者是一家 2021 年售予 Shell 的虚拟电厂运营商——他于 2024 年 11 月 13
              日加入担任非执行董事。同月，TenneT Germany 前董事会成员、Shell-ubitricity 前 CEO Lex Hartman 加入，担任董事兼高级顾问。值得注意的是，North Data
              的自动化注册聚合将 Zug 实体列为一名主席加八名成员的更大董事会，无法与 terralayr 自有材料列出的四名董事对齐；考虑到 North Data
              明示其自动抓取免责声明，本章把该差异视为开放的治理透明度问题，而非自行解决。已审阅的每一则融资、合作和治理公告中，Philipp Man 都是唯一被引用的公司发言人，显示 CEO 身上存在明显关键人集中。
