      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              并网监管风险，是德国 BESS 平台最大、证据最具体的一类风险。大型电池储能并网申请超过 720 GW，而已装机大型储能容量约 2.6 GW（CR004）；2026 年 3 月 30 日，BNetzA 的
              Beschlusskammer 6 维持了一家电网运营商拒绝储能运营商并网申请的决定，确认合法拒绝可以长期卡住一个项目（CR002）。2025 年 12 月修订澄清，电池储能不适用 KraftNAV
              条例（CR001）；同时，TSO 提出的基于成熟度的「first-ready, first-served」分配程序预计不会早于 2026 年 4 月启动，但会给未来并网申请增加 EUR50,000 申请费和
              EUR1,500/MW 履约保证金（CR005），再叠加德国联邦最高法院确认的、现已强制的建设成本补贴（CR006）。并网之外，terralayr 的资产基础和任何未来非欧盟融资，还落入 EU Battery
              Regulation（CR009）、德国 KRITIS-Dachgesetz 和修订后的 BSI Act（CR011、CR012）、外资审查门槛（CR015），以及与 BBD 合资这类 roll-up 收购有关的
              Bundeskartellamt 并购控制规则范围内（CR017、CR018）。没有公开来源确认 terralayr 在这些制度下的合规姿态、注册状态或备案历史（CR010、CR013、CR018）。
            claimRefs:
