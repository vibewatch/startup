      - number: '1.3'
        title: 融资历史与投资人基础
        blocks:
          - type: paragraph
            body: >-
              terralayr 已披露的融资历史包括两轮头部机构融资。2024 年 10 月，公司融资约 €77 million，其中 €62 million 为股权、€15 million 为债务，由 RIVE
              Private Investment 领投（其参与获得 EU InvestEU 计划支持），Creandum、Earlybird Venture Capital、Norrsken VC 和 Picus
              Capital 参投；ESS News 后来将其称为「Series C」轮，而 CEO Philipp Man 当时告诉
              TechCrunch，他「不会称之为种子轮，但技术上它就是种子轮」——本章保留这种命名冲突，不加解决。2026 年 1 月，terralayr 完成更大规模的 €192 million 成长股权融资，由 €112
              million 初始分期加 €80 million 扩大融资选项构成，Eurazeo 的 Transition Infrastructure Fund（ETIF）领投——据报道这是 ETIF
              的第九笔也是最后一笔投资——RIVE、Creandum、Earlybird、Norrsken 和 Picus Capital 继续参与。同一时期前后，terralayr 还披露另一笔约 €60 million
              债务融资，与其收购 Big Battery Deutschland（BBD）合资公司全部所有权相关。把这些披露金额相加，累计融资似乎超过 €329
              million，但没有任何单一来源给出对齐后的生命周期融资总额；ESS News 明确称 2026 年 1 月公告未披露 terralayr
              估值。因此，本章把估值列为明确证据缺口，而不是编造数字。值得注意的是，Creandum 普通合伙人 Johan Brenner 直接进入 terralayr 董事会，把最早的机构支持者之一接入正式治理。
