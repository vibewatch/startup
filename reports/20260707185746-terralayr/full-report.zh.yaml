      - number: '7.8'
        title: 图表与要点
        blocks:
          - type: callout
            title: 并网拒绝并非假设——已经发生在一家储能运营商身上
            body: >-
              BNetzA 的 Beschlusskammer 6 在 2026 年 3 月维持了一家电网运营商拒绝电池储能并网申请的决定（案件
              BK6-25-325），确认即便项目已投入大量开发，合法拒绝也能长期卡住项目。这是直接先例，不是建模风险。
            calloutType: risk
            claimRefs:
              - CR002
          - type: callout
            title: 两个对手方贡献 terralayr 全部具名 toll 收入
            body: RWE 和 Vattenfall 是所有已审阅公开来源中仅有的两个具名正式上线 toll 对手方；这种对手方风险集中，在客户、融资和收入模型风险类别上都呈现相似结构。
            calloutType: risk
            claimRefs:
              - CR029
          - type: callout
            title: 市场化收入被同类容量蚕食，是已有记录、可量化的行业趋势
            body: >-
              独立分析师模型预计，在激进的 2030 年建设情景下，德国两小时电池套利收入会从今天约 EUR86,000/MW 降至低至 EUR12,000/MW，直接挤压 terralayr
              组合中任何暴露于市场化收入的部分。
            calloutType: risk
            claimRefs:
              - CR036
          - type: callout
            title: 未披露安全 / 网络安全事件，被视为证据缺口，而不是记录干净
            body: 没有公开来源披露任何具体涉及 terralayr 的火灾、热失控、安全执法、ISO 27001 / SOC2 认证或网络安全事故历史。本章把这种沉默视为未解决的尽调事项，而不是推断其合规或安全记录干净。
            calloutType: assumption
            claimRefs:
              - CR021
              - CR026
          - type: callout
            title: 优先推进并网和财务披露尽调
            body: 两个价值最高的尽调问题是：（1）每个已披露可开工 / 在建站点都要有具约束力且不可上诉的并网确认；（2）实际收入、EBITDA、烧钱速度，以及合同收入与市场化收入拆分。两者目前都未披露，也都直接支撑投资论点。
            calloutType: recommendation
            claimRefs:
              - CR040
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：融资和客户证明真实存在，但估值未披露，无法给出买入结论
        blocks:
          - type: paragraph
            body: >-
              到 2026 年中，terralayr 已经有真实的融资和商业动能：2024 年 10 月一轮约 EUR77 million 融资；2026 年 1 月由 Eurazeo 的 Transition
              Infrastructure Fund 领投的 EUR192 million 成长股权轮（包括 EUR80 million 扩容选项），据称这是该基金第九笔也是最后一笔投资；以及另一笔约 EUR60
              million、与完全持有 Big Battery Deutschland 合资公司有关的债务工具。已披露的 RWE、Vattenfall 和 Stadtwerke Duisburg tolling
              与营销合作，让公司拥有真实、具名的收入对手方，而不只是管线承诺。但 ESS News 和 Mercom Capital 对 2026 年 1
              月融资轮的报道都没有披露投后估值，本研究包中的其他公开来源也没有补上这一缺口；收入、利润率或经调和的累计融资总额也都没有来源披露。这个披露缺口之上，还叠加了系统性行业风险：德国电池储能并网申请队列据报已超过
              720 GW，而已确认并网承诺只有约 78 GW，实际已安装大型储能约 2.6 GW；行业媒体又称 2026 年监管环境仍在重写。合并来看，可支撑的结论是 research-more /
              track，中等信心、高风险评级，而不是买入；原因是融资和客户证明尚未匹配估值、收入或治理透明度。
