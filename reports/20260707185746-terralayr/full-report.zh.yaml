      - number: '4.5'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              terralayr 的财务画像，是一家资本充足、由融资推进的 BESS 平台与资产业务；但公开资料无法独立验证收入、利润率或现金流。它的收入模式确实分散在合同收入、市场化收入和短期拍卖机制上，具名 tolling
              对手方（RWE、Vattenfall、ENGIE）与平台合作方（Stadtwerke Duisburg
              Energiehandel）也有可信度。但每一种变现杠杆都没有披露公司层面的实际价格、成交量或利润率，因此收入质量只能对照市场基准判断，不能用 terralayr
              自己的数字验证。当前资本充足性靠融资公告节奏支撑——18 个月内完成 €192 million 股权轮，以及 €60 million 加 €100 million accordion
              的债务工具——而不是已经证明的自我造血能力；CFO Robin Cresswell 曾在 Deutsche Bank
              做基础设施与企业贷款，这一背景说明公司可能具备机构资本结构设计能力，也与这套分层融资执行相符。最清楚的尽调堵点，是没有任何公开收入、ARR、毛利率、CAC / 回收期或流失率数据，€4,000/MW/year
              netting-off 节省未经验证，BBD 合资交易对价也未披露。在审计财报或管理账可得之前，本章财务结论应理解为：融资执行能力已经体现；底层单元经济和收入质量无法从公开资料独立验证。
