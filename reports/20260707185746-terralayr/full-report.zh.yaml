      - number: '7.5'
        title: 财务与模型风险
        blocks:
          - type: paragraph
            body: >-
              最清楚的量化财务风险，是市场化收入被同类容量蚕食：独立分析师模型预计，德国两小时电池的平均 day-ahead 加 intraday 套利收入，会从今天约 EUR86,000/MW 降到 2030 年 47GW
              基准情景下约 EUR50,000/MW；如果电池建设完全追上新增太阳能容量，则可能低至 EUR12,000/MW（CR036）。而仅覆盖当前投资成本，就需要约 EUR100/MWh
              的日内价差（CR037）。这会直接影响 terralayr 组合中任何按市场化模式商业化的部分，因为两个独立来源把 2025 年德国市场化价差估为约 EUR85,000/MW/year，而 terralayr
              自己披露的 toll 定价区间为 EUR110,000-150,000/MW/year（CR038）；这一溢价反映了市场上为收入确定性而对 70-100% 容量做 tolling 的惯例（CR039）。Rödl
              & Partner 另称，德国储能实际收入在 2025 年较 2024 年明显下降（CR041）；德国 2026 年负电价事件进一步叠加了市场化暴露风险（CR043）。terralayr 的 EUR60
              million 高级担保债务工具，结构是七年期 mini-perm 加 EUR100 million accordion，在底层资产寿命结束前很久就需要再融资或提款（CR042）。没有公开来源披露
              terralayr 的实际收入、EBITDA、烧钱速度、现金可支撑时间，或完整自有组合中合同收入与市场化收入的混合拆分（CR040）；这是本章最大的单一财务证据缺口。
            claimRefs:
              - CR036
              - CR037
              - CR038
              - CR039
              - CR040
              - CR041
              - CR042
              - CR043
      - number: '7.6'
        title: 人员与执行风险
        blocks:
          - type: paragraph
            body: >-
              terralayr 最早的独立媒体报道中，公开叙事集中在一位具名创始人身上（CR048）。瑞士商业登记衍生数据记录了一个八人董事会，至少部分抵消了这种治理画像；但没有公开披露独立董事履历（CR044）。据
              Swiss Official Gazette of Commerce，公司以 terralayr AG
              形式注册在瑞士楚格，而受监管的电池储能资产和收入对手方主要在德国，这增加了跨境治理和监管协调复杂度；没有公开来源解释这一点（CR045）。最关键的执行风险是规模转化：terralayr 自身 2026
              年融资轮的独立法律顾问称，公司拥有超过 150MW 运营中和在建资产，并有约 200MW 可开工资产；相比之下，已披露已锁定管线约
              8GW。这意味着绝大多数管线尚未转化成已融资、已建成容量（CR047）。没有公开来源披露 terralayr 当前员工数、组织架构或关键招聘 /
              离职历史，因此无法独立判断执行团队是否有足够资源完成这轮转化（CR046）。
            claimRefs:
              - CR044
              - CR045
              - CR046
              - CR047
              - CR048
