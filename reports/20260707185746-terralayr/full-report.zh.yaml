      - number: '6.2'
        title: 采用轨迹与具名交易爬坡
        blocks:
          - type: paragraph
            body: >-
              terralayr 的采用轨迹可以从一组独立标注日期的公告和一场近期但未标日期的高管访谈中重建。公司自有 Tittling BESS 资产（10.35MW /
              22.83MWh）已在巴伐利亚上线，成为支撑平台的自有资产基础之一（CU006）。RWE Supply & Trading 与 terralayr 达成五年期、50MW / 100MWh 多资产容量 toll，自
              2026 年生效；RWE 自己的新闻稿、ESS News 和 Renewables Now 均独立确认（CU007）。ENGIE 与 terralayr 于 2025 年 5 月 6 日宣布「Mini
              Toll」合作，但此后没有找到独立媒体报道、签约 MW 数字或正式上线确认（CU008）。Stadtwerke Duisburg Energiehandel 与 terralayr 于 2025 年 9 月 29
              日宣布合作，当天由 pv magazine Germany 独立印证，目标是联合管理超过 100MW（CU009）。terralayr 于 2025 年 11 月 19 日推出多优化器「Enhanced
              Trading of Flexibility」（ETF）模型（CU010）。Vattenfall 的 toll 于 2026 年 3 月上线，先从 5MW 初始批次开始，再逐步爬坡到完整 55MW；pv
              magazine Germany 和 Solarserver 在 2026-03-03 独立确认（CU011）。截至一场 2026 年访谈，terralayr 称其已有三个自有 BESS
              资产上线、两个在建，并计划约一年内达到 100MW 自有容量；独立行业媒体另称，已有超过 50MW 第三方 BESS 上线并调度，近期还预计再增加约 100MW（CU012、CU013、CU014）。
