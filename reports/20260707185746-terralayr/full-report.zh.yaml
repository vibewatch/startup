  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入流、定价与变现
        blocks:
          - type: paragraph
            body: >-
              terralayr 通过三种具名机制商业化其德国电池储能组合，三者都跑在 LAYR
              软件平台之上：与信用良好交易对手签署合约化容量租赁、通过多优化商「ETF」模型获取市场化优化收入，以及虚拟电池拍卖（VBA）这一更短期的市场层。在公司自有
              112MW/238MWh、九个项目、由债务融资的组合中，55MW（约 49%）由一份七年 Vattenfall 容量租赁锁定，剩余 57MW（约 51%）按市场化方式商业化。除这一特定组合外，terralayr
              还另有一份 50MW/100MWh、五年 RWE 容量租赁，一项 2025 年 5 月签署的 ENGIE「Mini Toll」短期框架，以及与 Stadtwerke Duisburg Energiehandel
              的合作；后者把短期容量租赁框架与 VBA 准入结合起来，双方目标共同管理超过 100MW。terralayr 称，截至目前整个德国市场只签署了六份容量租赁协议，公司参与了其中一半；如果底层 Aurora
              Energy Research 计数准确，这一位置异常集中。定价证据仅限市场范围区间，而不是 terralayr 特定已实现数字：据称容量租赁通常定价在每 MW 每年 €110,000 至 €150,000
              之间，而德国更广义日前市场化基准在 2025 年平均约为每 MW 每年 €85,000。公开来源未披露 terralayr 特定的已实现容量租赁价格、市场化收益或 VBA 抽成率。
