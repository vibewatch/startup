  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and buyer landscape
        blocks:
          - type: paragraph
            body: >-
              terralayr organizes its go-to-market around three primary buyer groups, each with a dedicated
              customer-facing page on the company's own site: national/major utilities entering multi-asset capacity
              tolling agreements, municipal utilities (Stadtwerke) accessing capacity through Virtual Battery Auctions
              (VBAs), and BESS owners/investors buying a managed, optimizer-switching service (CU001). Major offtakers
              such as RWE and Vattenfall are Germany-wide counterparties whose commodity-origination and trading desks
              act as both buyer and payer of the toll premium, independently confirmed by each company's own press
              releases (CU002). Municipal utilities are illustrated by Stadtwerke Duisburg Energiehandel, which
              independently describes itself as one of Germany's largest municipal energy traders with more than 200
              business relationships to other Stadtwerke, and which onboards via an API-first, IoT Box-connected setup
              (CU003). BESS owners/investors are served by a distinct portfolio-management product, evidenced by named
              testimonials from Vattenfall's own commodity-origination executives rather than an independent customer
              survey (CU004). A fourth, earlier-stage channel is ENGIE, whose 'Mini Toll' short-duration flexible
              tolling framework, announced in May 2025, remains a disclosed partnership rather than a confirmed
              production relationship (CU005). No aggregate customer count is disclosed for any segment; all public
              evidence takes the form of named individual examples rather than a sized customer base (CU030).
            claimRefs:
