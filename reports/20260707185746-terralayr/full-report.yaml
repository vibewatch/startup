            title: Merchant-revenue cannibalization is a documented, quantified sector trend
            body: >-
              Independent analyst modeling projects two-hour battery arbitrage revenue in Germany falling from about
              EUR86,000/MW today to as low as EUR12,000/MW under aggressive 2030 build-out scenarios, directly
              pressuring any merchant-exposed share of terralayr's portfolio.
            calloutType: risk
