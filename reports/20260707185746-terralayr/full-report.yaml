      - number: '2.2'
        title: Market Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              No single, clean TAM figure exists for terralayr's addressable market; instead, five largely
              incommensurable public lenses must be triangulated. EMMES 10 forecasts 153GW/485GWh of European
              electrochemical storage additions by 2030, a 25% upward revision versus the prior-year outlook. Modo
              Energy separately forecasts more than 15GW of grid-scale BESS specifically in Germany by 2030. On the
              demand side, BDEW's November 2025 survey put Germany's pending large-scale (>=1MW) grid-connection request
              queue at over 720GW, roughly nine times peak load, of which only about 78GW had been approved. A separate
              BNetzA compilation for the medium-voltage level in 2024 shows a comparable pattern at a different tier:
              ~10,000 requests totaling ~400GW/661GWh planned, with only ~3,800 requests (25GW/46GWh) approved. Against
              all of these queue figures, Rodl & Partner estimates that only about 2.6GW of large-scale storage is
              actually installed and operating in Germany today. Notably, the four German transmission system operators'
              own reported cumulative figure of 250GW across nearly 700 requests is roughly 3x lower than BDEW's
              contemporaneous 720GW/78GW estimate for what appears to be a similar population of large-scale requests;
              this report preserves that contradiction rather than resolving it, since no reconciled source was found.
              Fraunhofer ISE's capacity-based estimate of ~104GWh needed by 2030 (rising to 180GWh by 2045) offers yet
              another, non-comparable unit of measurement. Against this backdrop, terralayr's own disclosed pipeline of
              ~8GW (with ~200MW ready-to-build and ~150MW operating or under construction) represents roughly 5% of
              BDEW's 720GW queue and roughly half of Modo Energy's 15GW 2030 forecast, though none of these are
              like-for-like measures. Competitor Kyon Energy discloses a broadly comparable pipeline scale (269MW under
              construction, 1.2GW ready, plus 1.5GW and 7GW further pipeline stages), underscoring that multiple
              developers are laying claim to overlapping portions of the same national connection queue. No
              independently-sourced, bottom-up services-revenue TAM specific to the optimization/tolling layer itself
              could be located.
