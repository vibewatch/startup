      - number: '5.6'
        title: Trust, safety, security, privacy, compliance, and quality controls
        blocks:
          - type: paragraph
            body: >-
              terralayr's privacy policy names terralayr AG, Grafenauweg 8, 6300 Zug as the GDPR Data Controller, was
              last updated 9 December 2022, and commits the company to responsible development under the Equator
              Principles with a bilingual (English/German) grievance mechanism for project-affected stakeholders (CE020,
              CE021). Beyond this policy document, no public source reviewed for this chapter discloses an ISO 27001,
              SOC 2, or comparable cybersecurity certification, nor any public security-incident disclosure, bug-bounty
              programme, or vulnerability-disclosure record for the LAYR platform or API (CE022; evidence gaps GE001,
              GE009). This contrasts with Fluence's Gridstack, which publicly states its network security 'supports
              international cybersecurity standards' alongside UL9540/UL9540A/IEC hardware safety compliance (CE044). On
              hardware safety specifically, terralayr states its LFP battery technology 'is especially safe and meets
              the highest fire safety standards' and that its systems are designed to be exceptionally quiet and comply
              with noise regulations, though no independently issued safety certificate for terralayr's own hardware was
              found (CE024). Quality control on the construction side runs through the company's 60-day EPC tendering
              process, which explicitly tracks on-site Health & Safety, progress, and compliance during project delivery
              (CE016), and its recent portfolio financing was structured with turnkey EPC and long-term O&M contracts
              from three established providers to diversify execution risk (CE038). Independent third-party analysis
              from Roedl & Partner corroborates that safety-concept, approval-capability, and insurability requirements
              are tightening industry-wide in Germany, forming part of the regulatory backdrop terralayr must navigate
              but is not itself direct evidence of terralayr's own compliance posture (CE049). No formal SLA, uptime
              guarantee, or incident postmortem beyond the live public status page was found, and no patent or IP
              registration was identified for terralayr's platform mechanisms; both are preserved here as explicit
              evidence gaps rather than assumed to reflect either strong or weak practice (CE023, CE055; evidence gaps
