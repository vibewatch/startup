  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk register overview
        blocks:
          - type: paragraph
            body: >-
              This chapter ranks terralayr's risks across five lenses -- regulatory/legal,
              operational/technical/security, partner/dependency, financial/model, and people/execution -- using only
              public regulator filings, court and administrative-decision reporting, legal-advisory analysis,
              industry-association guidance, and terralayr's own disclosures (CR001). Because terralayr is a private,
              disclosure-light company operating in a German battery-storage market undergoing active regulatory change
              in 2026, the register leans heavily on sector-level evidence -- grid-connection queue statistics, a real
              adverse BNetzA ruling against a storage operator (BK6-25-325), EU and German critical-infrastructure law,
              and independent analyst modeling of merchant-revenue cannibalization -- rather than company-specific
              incident history, which public sources do not disclose (CR002, CR003, CR004, CR036). Where no
              terralayr-specific evidence exists for a given risk (safety incidents, cybersecurity certification,
              litigation), this chapter states that explicitly rather than inferring a clean record from silence (CR021,
              CR026). The risk heatmap (FR001) summarizes likelihood, severity, mitigation maturity, and residual
              exposure across the eight highest-severity risks identified across all four categories.
