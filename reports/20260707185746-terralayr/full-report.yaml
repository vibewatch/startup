      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Grid-connection regulatory risk is the single largest and most concretely evidenced risk category for a
              German BESS platform. Grid-connection applications for large-scale battery storage exceeded 720 GW against
              roughly 2.6 GW of installed large-scale storage capacity (CR004), and on 30 March 2026 BNetzA's
              Beschlusskammer 6 upheld a grid operator's refusal of a storage operator's connection request, confirming
              that a legally valid refusal can durably block a project (CR002). A December 2025 amendment clarified that
              battery storage falls outside the KraftNAV ordinance (CR001), while the TSOs' proposed 'first-ready,
              first-served' maturity-based allocation procedure -- not expected to launch before April 2026 -- would add
              a EUR50,000 application fee and a EUR1,500/MW realisation deposit to future connection requests (CR005),
              alongside now-mandatory construction-cost subsidies confirmed by the Federal Court of Justice (CR006).
              Beyond grid connection, terralayr's asset base and any future non-EU capital raise sit within the scope of
              the EU Battery Regulation (CR009), Germany's KRITIS-Dachgesetz and revised BSI Act (CR011, CR012),
              foreign-investment screening thresholds (CR015), and Bundeskartellamt merger-control rules relevant to
              roll-up acquisitions such as the BBD joint venture (CR017, CR018). No public source confirms terralayr's
              compliance posture, registration status, or filing history under any of these regimes (CR010, CR013,
              CR018).
