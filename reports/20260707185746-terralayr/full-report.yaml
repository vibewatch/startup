  - id: TV002
    title: Thesis / anti-thesis
    columns:
      - Argument
      - Thesis (bull case)
      - Anti-thesis (bear case)
      - What would change the view
    rows:
      - - Market
        - Germany's BESS grid-connection queue (~720GW) reflects overwhelming demand for flexibility infrastructure.
        - >-
          The same 720GW queue against only ~78GW confirmed commitments signals a bottleneck, not a tailwind, and Wood
          Mackenzie sees current models underestimating revenue/risk variance.
        - A confirmed, sustained rise in the queue-to-commitment conversion rate above roughly 20-30%.
      - - Product
        - >-
          The LAYR flexibility-as-a-service platform lets terralayr both own assets and monetize third-party assets,
          diversifying revenue.
        - >-
          No independent source verifies platform economics (take-rate, margin) separate from terralayr's own marketing
          claims.
        - Independently verified platform revenue or margin disclosure.
      - - Customers
        - RWE, Vattenfall, and Stadtwerke Duisburg tolling/marketing deals provide blue-chip revenue counterparties.
        - >-
          Disclosed tolling volumes (e.g., RWE's 50MW/100MWh) cover only a fraction of terralayr's >150MW operating
          base; the rest is merchant-exposed.
        - Disclosure of the realized tolled-vs-merchant revenue split across the full operating portfolio.
      - - Financials
        - >-
          Three financing events in about 18 months (2024 equity/debt, Jan 2026 equity, BBD debt facility) show
          sustained investor support.
        - >-
          No single source reconciles total funding into one lifetime figure, and no revenue, margin, or valuation
          figure is disclosed at all.
        - A reconciled cap table, lifetime funding total, and audited or management-account financials.
      - - Competition
        - >-
          terralayr's asset-light, no-lock-in optimizer pitch differentiates it from vertically integrated
          developer-operators like Kyon Energy and ENGIE.
        - >-
          Public comparables (Fluence, Stem, Nuvve) show that BESS/flexibility business models can trade at steep
          valuation discounts once growth or profitability is questioned.
        - Evidence that terralayr's optimizer economics outperform vertically integrated peers on realized returns.
      - - Risks
        - >-
          terralayr has diversified its counterparties and financing sources rather than depending on one investor or
          customer.
        - >-
          Sector-wide regulatory flux (KraftNAV replacement, Flexible Connection Agreements, possible EnWG Section 118
          exemption removal) could compress IRR across the whole German BESS sector, terralayr included.
        - A stable, finalized 2026 regulatory framework with confirmed grid-fee and connection rules.
    notes: >-
      Synthesizes claims already sourced elsewhere in this chapter; presented here as paired thesis/anti-thesis
      argument, not new primary data.
    claimRefs:
      - CV010
      - CV011
      - CV007
      - CV009
      - CV021
      - CV015
  - id: TV003
    title: Bull / base / bear scenario
    columns:
      - Scenario
      - Key assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bear
        - >-
          Grid-queue conversion stalls near the observed ~11% (78GW/720GW) rate; regulatory reforms (FCA restrictions,
          possible EnWG Section 118 exemption removal) compress merchant IRR; sector-wide BESS multiples continue
          softening as in Q1 2026 M&A data.
        - >-
          Illustrative per-MW cross-check compresses toward or below the AllianzGI/Kyon Energy benchmark (~EUR634k/MW);
          any future valuation disclosure could resemble a down-round.
        - >-
          Undisclosed cap-table/preference overhang; customer concentration in a handful of tolling counterparties;
          unresolved board/governance structure.
        - >-
          Consistent with Wood Mackenzie's and Modo Energy's flagged valuation/return-compression risk and the Q1 2026
          European BESS M&A repricing signal.
      - - Base
        - >-
          Pipeline conversion continues at roughly the disclosed 11% rate but modestly improves as the 2026
          maturity-based connection procedure matures; existing RWE/Vattenfall/Stadtwerke Duisburg tolling relationships
          are maintained or modestly expanded.
        - >-
          Illustrative per-MW cross-check sits between the AllianzGI/Kyon Energy (~EUR634k/MW) and Sosteneo/Enel Libra
          Flexsys (~EUR1.32M/MW) benchmarks, i.e., roughly EUR95M-EUR198M applied to terralayr's disclosed ~150MW scale.
        - >-
          Continued reliance on external financing to convert the 8GW pipeline; regulatory implementation risk during
          the transition to the new maturity procedure.
        - >-
          Consistent with terralayr's demonstrated ability to close three financing events in 18 months without yet
          resolving valuation or revenue disclosure.
      - - Bull
        - >-
          Grid-connection reform materially raises the conversion rate; terralayr wins additional blue-chip tolling
          counterparties at or above current benchmark pricing; sector M&A activity (as seen in Kyon Energy/Allianz and
          Sosteneo/Enel Libra Flexsys) extends to platforms of terralayr's profile.
        - >-
          Illustrative per-MW cross-check approaches or exceeds the Sosteneo/Enel Libra Flexsys benchmark
          (~EUR1.32M/MW), implying roughly EUR198M or more applied to the disclosed ~150MW scale, before any
          pipeline-scale re-rating.
        - >-
          Execution risk in scaling from ~150MW to a meaningful share of the disclosed 8GW pipeline; competition from
          capital-backed entrants such as Akaysha Energy.
        - >-
          Consistent with the broader financial-sponsor appetite for multi-gigawatt BESS platforms documented in 2026
          European M&A commentary, but not yet evidenced for terralayr specifically.
    notes: >-
      Valuation figures in this table are this chapter's own scenario arithmetic applied to terralayr's disclosed
      operating scale for entry-discipline purposes; they are not terralayr's disclosed or implied valuation.
