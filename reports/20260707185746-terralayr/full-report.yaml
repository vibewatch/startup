  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'What terralayr delivers: product definition and customer workflow'
        blocks:
          - type: paragraph
            body: >-
              terralayr's core product is LAYR, a software platform that virtualises physical battery energy storage
              system (BESS) capacity so it can be monetised through a single unified API rather than through a bespoke,
              asset-by-asset trading relationship (CE001, CE003). LAYR turns a physical battery into a 'Virtual Battery'
              digital twin that can be sliced into exact MW amounts or aggregated across multiple physical assets,
              letting different offtakers access the same underlying capacity pool without owning or operating hardware
              themselves (CE002, CE013). In practice this plays out through several customer-facing workflows: municipal
              utilities onboard via an API-first, IoT Box-connected setup and then trade capacity through Virtual
              Battery Auctions (VBAs), as Stadtwerke Duisburg Energiehandel did after moving from a short-term tolling
              framework agreement to live VBA participation (CE009, CE011). Power traders rent MW-slices of storage
              capacity for a day, a week, or longer at a fixed price to trade across Day-Ahead, Intraday Continuous,
              FCR, and aFRR markets (CE008). BESS owners and investors use a distinct product to have their whole
              portfolio actively managed, with the platform matching the best-performing optimizer to their capacity and
              allowing a switch within a single day (CE014). Major offtakers such as RWE and Vattenfall instead enter
              multi-asset capacity tolling agreements, where LAYR aggregates several individual battery systems into one
              virtual block sized to an exact MW amount (CE017, CE039, CE041). Across all of these workflows the
              underlying mechanism is the same: LAYR abstracts physical asset complexity into a tradeable, API-driven
              flexibility layer (CE032).
