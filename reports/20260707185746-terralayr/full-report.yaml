      - CU001
      - CU003
      - CU009
      - CU021
      - CU027
      - CU031
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: The observed stage sequence from named-deal announcement to sustained platform-wide dispatch.
    data:
      nodes:
        - id: m1
          label: Named engagement announced (deal or partnership publicly disclosed)
        - id: m2
          label: Framework/agreement stage (short-term tolling framework or partnership MOU signed)
        - id: m3
          label: Technical integration (IoT Box/API connection, asset aggregation into virtual portfolio)
        - id: m4
          label: Production go-live (VBA participation or toll dispatch begins)
        - id: m5
          label: Ramp to full contracted scale (e.g. Vattenfall's 5MW initial tranche toward 55MW)
        - id: m6
          label: Sustained platform-wide dispatch (named players reported dispatching via LAYR already)
