      - number: '3.3'
        title: Switching Cost, Lock-In, Multi-Homing, and Partner/Distribution Power
        blocks:
          - type: paragraph
            body: >-
              terralayr's own marketing explicitly sells low switching cost as a differentiator: its BESS-owner
              materials promise owners can "switch, scale, and earn more" by "switching optimisers in just one day based
              on real-time performance," and its LAYR product page states the multi-optimizer model carries "no lock-in"
              and "no switching cost." Its municipal-utility materials go further, describing "external optimisers as a
              fallback option" within its own platform — meaning terralayr explicitly multi-homes its municipal
              customers across third-party optimizers rather than requiring exclusive use of any single trading desk.
              This cuts both ways as a moat: because terralayr's own platform is built to make individual optimizers
              interchangeable and comparable in real time, the same design that attracts BESS owners to LAYR also makes
              it easy for an owner to leave LAYR for a rival aggregator, and it commoditizes the value of any single
              named optimizer partner plugged into it. Two of terralayr's three named "Designated Optimisers" — Entrix
              and The Mobility House Energy — independently market themselves on their own websites as full-service
              optimization/trading providers directly to BESS owners, meaning owners are not dependent on terralayr's
              platform to reach either partner; all named German BESS optimization and tolling competitors, including
              terralayr, Kyon Energy, Entrix, and Akaysha Energy, also operate under the same EnWG grid-connection
              regime and face the same August 2029 grid-fee exemption cliff, so no competitor holds a disclosed
              regulatory advantage.
            claimRefs:
              - CP029
              - CP030
              - CP031
              - CP032
              - CP033
              - CP034
              - CP041
      - number: '3.4'
        title: Moat Durability, Commoditization Risk, and Adverse Competitor Evidence
        blocks:
          - type: paragraph
            body: >-
              terralayr describes its core technical moat as its capacity-virtualization "Virtual Battery" middleware
              and tech-agnostic dispatch API, which it says lets it onboard batteries "regardless of...battery
              manufacturers, sometimes with incompatible communication protocols." That middleware pattern is not
              obviously protected from replication by well-funded developer-operators already building their own
              dispatch software, such as Kyon Energy or newly entered Akaysha Energy. Multiple German BESS market
              panelists — from Berenberg, Alexa Capital, KfW, ECO STOR, and Ingrid Capacity — describe
              counterparty/credit risk and revenue-stability as the central bankability constraint across the sector
              broadly, not specific to terralayr, suggesting the primary competitive battleground is counterparty
              credibility rather than proprietary technology. terralayr's own citation of Aurora Energy Research shows
              only six tolling agreements existed in the German market at time of citation, three signed by terralayr
              itself — an outsized share of an extremely small deal count that a single competitor win could materially
              dilute. Adverse evidence that terralayr does not have exclusive access to the market's newest deal
              structures: the first grid-supportive BESS project in Wutzldorf and the landmark ENGIE-Return 100MW
              virtual flexibility purchase agreement both closed with named competitors (Entrix and Return,
              respectively) rather than terralayr. Separately, Chinese system integrators' reported 76% global BESS
              hardware market share in 2025 is an industry-wide commoditization signal that, while describing the global
              hardware layer rather than Germany's optimization/tolling layer, indirectly pressures margins for every
              hardware-linked competitor named in this chapter. No independently audited market-share or win-rate
              comparison among any of these companies could be located; every disclosed pipeline, project-count, or
              deal-count figure in this chapter is self-reported by the company itself.
