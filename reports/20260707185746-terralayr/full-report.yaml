              - CR036
          - type: callout
            title: Absence of disclosed safety/cyber incidents is treated as an evidence gap, not a clean record
            body: >-
              No public source discloses any fire, thermal-runaway, safety-enforcement, ISO 27001/SOC2 certification, or
              cybersecurity-incident history specifically involving terralayr. This chapter treats that silence as an
              unresolved diligence item rather than inferring compliance or a clean safety record.
