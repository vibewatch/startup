      - number: '5.5'
        title: Differentiation assessment
        blocks:
          - type: paragraph
            body: >-
              terralayr differentiates LAYR from a conventional single-asset physical tolling agreement primarily
              through aggregation and multi-optimizer flexibility: RWE's own press release describes the structure as
              unlike conventional tolling (which connects to one physical battery) because several individual systems
              are pooled via terralayr's platform, letting smaller batteries participate in long-term fixed-remuneration
              deals for the first time (CE040). Vattenfall frames the same pooling as a reliability advantage, since the
              batteries in the virtual portfolio can cover for one another's unavailability (CE042), and terralayr's own
              CEO frames the Vattenfall go-live as evidence that 'LAYR works reliably as infrastructure in live
              operation' (CE043). External recognition reinforces this positioning: terralayr was named one of just
              three software innovators in the battery storage space among Energize Capital's 2025 Electrify Everything
              Top 30, out of 30 companies spanning all electrification sectors (CE029). Compared with a hardware-centric
              competitor such as Fluence's Gridstack, which publicly documents a software architecture stack (Nispera
              asset-performance management, Mosaic AI bidding, ISO/API integrations) and explicit UL9540/UL9540A/IEC
              safety and cybersecurity-standard compliance, terralayr's own public materials describe LAYR's
              architecture only at a marketing level and do not publicly disclose comparable safety or security
              certifications (CE044, CE045). No patent or other formal IP registration for the Virtual Battery, ETF, or
              VBA mechanisms was identified, meaning the company's differentiation currently rests on market execution
              and named-partner relationships rather than a verifiable IP moat (CE055).
