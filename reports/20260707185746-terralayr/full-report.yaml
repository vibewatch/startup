  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation follows from real financing and customer proof colliding with an undisclosed valuation and
      systemic grid-connection risk.
    data:
      nodes:
        - id: financing-proof
          label: Financing momentum
          detail: >-
            Three financing events in about 18 months (2024 equity/debt, Jan 2026 EUR192M round, BBD debt facility), led
            by a major infrastructure fund.
          tone: positive
        - id: customer-proof
          label: Customer proof
          detail: Disclosed tolling/marketing agreements with RWE, Vattenfall, and Stadtwerke Duisburg.
          tone: positive
        - id: comp-context
          label: Comparable context
          detail: >-
            Disclosed German BESS transactions (Kyon Energy/AllianzGI, Enel Libra Flexsys/Sosteneo) provide per-MW
            benchmarks, but no terralayr-specific multiple.
          tone: neutral
        - id: valuation-gap
          label: Valuation disclosure gap
          detail: ESS News and Mercom Capital confirm no post-money valuation was disclosed for the January 2026 round.
          tone: warning
        - id: regulatory-risk
          label: Regulatory / grid-queue risk
          detail: >-
            ~720GW of German BESS grid-connection applications against only ~78GW confirmed commitments, plus an
            unsettled 2026 regulatory regime.
          tone: warning
        - id: decision
          label: Research-more / track
          detail: >-
            Public evidence supports continued engagement and comparable-based entry-discipline, but not a
            price-sensitive buy call.
          tone: neutral
      edges:
        - from: financing-proof
          to: decision
        - from: customer-proof
          to: decision
        - from: comp-context
          to: valuation-gap
        - from: valuation-gap
          to: decision
        - from: regulatory-risk
          to: decision
    approximationNotes: null
    claimRefs:
      - CV002
      - CV007
      - CV009
      - CV001
      - CV010
      - CV042
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Any comparable-based entry price for terralayr is highly sensitive to which per-MW benchmark and
      pipeline-conversion assumption is used.
    data:
      items:
        - label: Kyon Energy / AllianzGI benchmark (EUR k/MW)
          value: 634
          detail: >-
            Implied total-investment benchmark from Allianz's EUR500M/50%-stake acquisition of a 789MW Kyon Energy
            portfolio.
          tone: neutral
        - label: Sosteneo / Enel Libra Flexsys benchmark (EUR k/MW)
          value: 1320
          detail: Implied full-platform benchmark from Sosteneo's EUR1.1bn/49%-stake acquisition covering ~1.7GW.
          tone: positive
        - label: Grid-queue-to-commitment conversion rate (%)
          value: 10.8
          detail: ~78GW of confirmed grid-connection commitments against ~720GW of cumulative German BESS applications.
          tone: negative
        - label: German 2-hour BESS 2025 revenue benchmark (EUR k/MW/yr)
          value: 259
          detail: Glint Solar's reported 2025 annual revenue per MW for two-hour German BESS projects.
          tone: neutral
    approximationNotes: >-
      Units differ by item (EUR thousand/MW, percent, EUR thousand/MW/year); this is an illustrative sensitivity screen
      of independently disclosed benchmarks, not a single valuation model.
    claimRefs:
      - CV023
      - CV025
      - CV011
      - CV014
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Applying disclosed per-MW transaction benchmarks to terralayr's own disclosed operating scale produces a wide
      illustrative cross-check range, not a resolved valuation.
    data:
      items:
        - label: Bear case
          low: 22
          mid: 30
          high: 38
          displayValue: EUR22M-EUR38M
          detail: >-
            Distressed public-comparable discount (Stem/Nuvve-style multiple compression) applied to terralayr's ~150MW
            disclosed operating/under-construction scale; illustrative floor, not terralayr's actual value.
          tone: negative
        - label: Base case
          low: 75
          mid: 95
          high: 115
          displayValue: EUR75M-EUR115M
          detail: Kyon Energy/AllianzGI benchmark (~EUR634k/MW) applied to the disclosed ~150MW scale.
          tone: warning
        - label: Bull case
          low: 165
          mid: 198
          high: 230
          displayValue: EUR165M-EUR230M
          detail: >-
            Sosteneo/Enel Libra Flexsys benchmark (~EUR1.32M/MW) applied to the disclosed ~150MW scale, assuming
            continued pipeline conversion.
          tone: positive
    approximationNotes: >-
      These ranges are this chapter's own scenario-based, per-MW-benchmark arithmetic built for investment-committee
      entry-discipline discussion. terralayr has not disclosed a valuation for its January 2026 round, and none of these
      figures should be read as terralayr's actual or implied valuation.
    claimRefs:
      - CV037
      - CV038
      - CV021
      - CV001
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      terralayr scores well on market tailwind and financing/customer proof, but poorly on valuation and
      evidence-quality dimensions because of undisclosed pricing and financial detail.
    data:
      items:
        - label: Market tailwind
          score: 8
          detail: >-
            Germany's ~720GW BESS grid-connection queue reflects overwhelming underlying demand for flexibility
            infrastructure, even though conversion is bottlenecked.
          tone: positive
        - label: Proof of commercial traction
          score: 6
          detail: >-
            Disclosed tolling/marketing deals with RWE, Vattenfall, and Stadtwerke Duisburg are real but cover only a
            fraction of the operating base.
          tone: neutral
        - label: Moat / competitive position
          score: 5
          detail: >-
            Asset-light optimizer pitch is differentiated but not shown to be structurally protected against vertically
            integrated peers like Kyon Energy or ENGIE.
          tone: neutral
        - label: Capital access / financing momentum
          score: 7
          detail: Three financing events in ~18 months led by a major infrastructure fund show sustained investor support.
          tone: positive
        - label: Regulatory / execution risk
          score: 3
          detail: >-
            Unsettled 2026 German BESS regulatory regime and a ~720GW grid-connection queue against ~78GW confirmed
            commitments are systemic risks.
          tone: negative
        - label: Valuation disclosure / evidence quality
          score: 2
          detail: No post-money valuation, revenue, margin, or reconciled funding total is publicly disclosed for terralayr.
          tone: negative
    approximationNotes: >-
      Scores are ordinal 0-10 investment-committee-style judgments anchored to the cited public evidence, not
      company-provided KPI disclosures.
    claimRefs:
      - CV010
      - CV007
      - CV031
      - CV002
      - CV015
      - CV033
