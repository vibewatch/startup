      - number: '1.4'
        title: Scale, milestones, and commercial partnerships
        blocks:
          - type: paragraph
            body: >-
              terralayr's operational scale has grown substantially since its first asset acquisition ('trlyr1') in May
              2023. As of its January 2026 funding announcement, the company reported owning more than 150 MW of battery
              storage operating or under construction in Germany, with close to 200 MW at ready-to-build stage and a
              further secured development pipeline of 8 GW; ESS News independently corroborated four grid-connected
              facilities and ten more under construction totalling 150 MW as of the same period. This compares with
              October 2024 figures, when CEO Philipp Man told TechCrunch the company had 7 megawatt-hours live on the
              grid with another 40 megawatt-hours coming soon, alongside development agreements for over 200 sites
              totalling more than 7 gigawatts — illustrating rapid reported growth, though the two data points use
              different units and are not directly reconcilable. Through 2025, terralayr announced a steady cadence of
              site-level milestones, including grid connection at Tittling, Bavaria (22.83 MWh / 10.35 MW, January 2025)
              and Ready-to-Build status at Lohsa, Altencelle, Soltau, Osnabrück, Gößnitz, Elbingerode, and Söhlde. In
              2026 terralayr acquired full ownership of the BBD joint venture from the Averdung Group, consolidating a
              pipeline of over 1 GW that BBD had already begun selling to terralayr during 2025. Commercially, terralayr
              has signed major utility tolling agreements with RWE (50 MW / 100 MWh over five years starting in 2026)
              and Vattenfall (up to 55 MW over seven years, with a phased 2026 go-live), plus a co-development
              partnership with Stadtwerke Duisburg Energiehandel targeting a portfolio exceeding 100 MW. Public sources
              do not, however, disclose terralayr's revenue, run-rate, or an aggregate customer count beyond these named
              counterparties and the roughly 50 employees cited in its 2026 materials.
