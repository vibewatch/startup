              a 'Mini Toll' partnership on 6 May 2025, but no independent press, contracted MW figure, or production
              go-live has since been found (CU008). Stadtwerke Duisburg Energiehandel and terralayr announced a
              cooperation on 29 September 2025, independently corroborated the same day by pv magazine Germany,
              targeting joint management of more than 100MW (CU009). terralayr launched its multi-optimizer 'Enhanced
              Trading of Flexibility' (ETF) model on 19 November 2025 (CU010). Vattenfall's toll went live in March
              2026, starting with an initial 5MW tranche to be ramped toward the full 55MW over time, independently
              confirmed by pv magazine Germany and Solarserver on 2026-03-03 (CU011). As of a 2026 interview, terralayr
              states it has three owned BESS assets live, two more under construction, and targets 100MW of owned
              capacity within about a year, while independent trade press separately reports more than 50MW of
              third-party BESS already live and dispatching, with roughly 100MW more expected in the very near future
