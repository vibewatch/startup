            body: >-
              The two highest-value diligence asks are (1) binding, non-appealable grid-connection confirmation for
              every disclosed ready-to-build/under-construction site, and (2) realized revenue, EBITDA, burn rate, and
              contracted-vs-merchant revenue split -- both currently undisclosed and both directly load-bearing for the
