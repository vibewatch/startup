      - number: '8.2'
        title: 'Investment thesis: market pull, product structure, and named customers support continued engagement'
        blocks:
          - type: paragraph
            body: >-
              The bull case for terralayr starts with market pull rather than company-specific proof: Germany's BESS
              grid-connection queue reaching more than 720 GW (against ~263 GW of total installed generation capacity)
              shows the scale of underlying demand for flexibility assets, even if only a fraction of that queue
              converts to built capacity. terralayr's product structure, an integrated developer-owner-operator model
              wrapped around its LAYR flexibility-as-a-service platform, is designed to both own assets and monetize
              third-party ones, a dual-sided model that mirrors the direction several better-capitalized peers
              (Sosteneo/Enel Libra Flexsys, AllianzGI/Kyon Energy) have taken by pairing platform economics with owned
              or JV-controlled asset bases. On customers, terralayr has moved from pipeline announcements to named,
              disclosed counterparties: RWE's five-year virtual 50MW/100MWh tolling deal, a Vattenfall marketing
              partnership that has since been described as expanding nationwide, and a Stadtwerke Duisburg Energiehandel
              cooperation. Modo Energy's German BESS research shows 4-hour projects reaching 13.7% unlevered IRR at 2026
              commercial-operation dates, and Glint Solar reports 2-hour projects earning roughly EUR259,000 per MW in
              2025 revenue at 15-18% return expectations, both of which describe a sector where well-executed projects
              can still clear attractive return hurdles even as the queue backs up.
            claimRefs:
              - CV010
              - CV032
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
      - number: '8.3'
        title: 'Anti-thesis: grid-connection bottlenecks, regulatory flux, and distressed public comparables'
        blocks:
          - type: paragraph
            body: >-
              The anti-thesis is built almost entirely from independent, sector-wide adverse evidence rather than
              terralayr-specific bad news, because no source in this research pack surfaces a terralayr-specific adverse
              event. Clean Energy Wire and Rödl & Partner both corroborate that Germany's grid-connection request queue
              for battery storage exceeds 720 GW against only about 2.6 GW actually installed, and Glint Solar puts
              confirmed connection commitments at only around 78 GW of that queue, an implied conversion rate of roughly
              11%. Wood Mackenzie separately warns that current BESS valuation and revenue models likely underestimate
              risk and revenue variance, noting connection requests ballooned from roughly 300 GW to more than 500 GW
              within about a year, and that Flexible Connection Agreements now impose import/export, ramp-rate,
              ancillary-service, and uncompensated re-dispatch restrictions that can compress project IRR by several
              percentage points. On public comparables, Stem Inc traded at a $64.31 million market cap against a $397.72
              million enterprise value on July 7, 2026, a gap consistent with heavy net debt, while Nuvve Holding's
              market cap has fallen 96.10% since May 2020 to just $2.72 million; both illustrate that BESS-adjacent
              public companies can trade near distressed levels once growth or profitability is questioned, providing a
              plausible bear-case floor for any future terralayr valuation event.
            claimRefs:
              - CV010
              - CV011
              - CV016
              - CV015
              - CV019
              - CV020
              - CV021
          - type: figure
            figureRef: FV002
            claimRefs:
