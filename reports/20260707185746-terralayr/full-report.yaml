  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: financing and customer proof are real, but an undisclosed valuation blocks a buy call'
        blocks:
          - type: paragraph
            body: >-
              terralayr enters mid-2026 with genuine financing and commercial momentum: an October 2024 round of roughly
              EUR77 million, a January 2026 growth-equity round of EUR192 million (including an EUR80 million upsizing
              option) led by Eurazeo's Transition Infrastructure Fund as reportedly its ninth and final investment, and
              a separate roughly EUR60 million debt facility tied to full ownership of the Big Battery Deutschland joint
              venture. Disclosed tolling and marketing partnerships with RWE, Vattenfall, and Stadtwerke Duisburg give
              the company real, named revenue counterparties rather than only pipeline promises. Yet neither ESS News
              nor Mercom Capital's coverage of the January 2026 round discloses a post-money valuation, and no other
              public source in this research pack fills that gap; no source discloses revenue, margin, or a reconciled
              lifetime funding total either. Layered on top of that disclosure gap is a systemic sector risk: Germany's
              grid-connection request queue for battery storage has reportedly passed 720 GW against only around 78 GW
              of confirmed connection commitments and roughly 2.6 GW of actually installed large-scale storage, in a
              regulatory environment that industry press describes as still being rewritten in 2026. Taken together, the
              supportable call is research-more/track with medium confidence and a high risk rating, not buy, because
              the financing and customer proof are not yet matched by valuation, revenue, or governance transparency.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV007
              - CV009
              - CV010
              - CV042
              - CV043
