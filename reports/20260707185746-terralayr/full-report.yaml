              and one recent, undated executive interview. Its own Tittling BESS asset (10.35MW/22.83MWh) came online in
              Bavaria as part of the owned-asset base underlying the platform (CU006). RWE Supply & Trading and
              terralayr closed a five-year, 50MW/100MWh multi-asset capacity toll effective 2026, independently
