  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Peers, Incumbents, Adjacents, and Entrants'
        blocks:
          - type: paragraph
            body: >-
              terralayr's closest direct peers are independent BESS optimization/trading platforms competing for the
              same third-party asset-owner mandates: Entrix, which brands itself "Europe's leading flexibility trader"
              with 30,000 trades per day, 70 projects under management, and 3GW of capacity under contract across five
              countries, and suena energy — both of which terralayr itself onboards as "Designated Optimisers" inside
              its own multi-optimizer platform. Incumbent, vertically-integrated developer-operators occupy an adjacent
              but overlapping category: Kyon Energy develops, builds, and operates its own German BESS fleet end to end
              (269MW realized, 1.2GW under construction, and a ready-to-build pipeline that grew from 1.5GW to 1.7GW
              across two 2026 site snapshots), while ENGIE owns and operates 5.6GW of storage capacity across twelve
              countries toward a 95GW 2030 renewables-and-storage target — both compete for the same connection-queue
              capacity terralayr's own pipeline depends on, but neither offers a third-party optimization service.
              Fluence sits further upstream as a publicly traded, SEC-registered hardware-plus-software system
              integrator. Adjacent flexibility vendors include The Mobility House Energy (EV/V2G plus battery marketing,
              itself also a terralayr Designated Optimiser), Nuvve (V2G/behind-the-meter flexibility), and GreenFlex
              (broader decarbonization consulting for roughly 800 clients). Status-quo alternatives include utilities'
              own in-house trading desks (RWE Supply & Trading, Vattenfall's Commodity Origination team) and
              conventional single-optimizer bilateral tolling deals. Likely new entrants include BlackRock-owned Akaysha
              Energy, which entered the German market via a joint venture backed by an AUD300 million debt facility, and
              Amsterdam-headquartered aggregator Return, which just signed a 100MW virtual flexibility purchase
              agreement with ENGIE.
