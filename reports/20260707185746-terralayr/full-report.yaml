      - - Risk rating
        - High
        - >-
          Germany's roughly 720GW BESS grid-connection queue against ~78GW confirmed commitments, plus an unsettled 2026
          regulatory regime, are systemic execution risks layered on top of company-specific disclosure gaps.
      - - Valuation stance
