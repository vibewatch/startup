          - type: callout
            title: Two counterparties account for all of terralayr's named toll revenue
            body: >-
              RWE and Vattenfall are the only two named production toll counterparties disclosed across all public
              sources reviewed, concentrating counterparty risk in a way that is structurally similar across the
              customer, financing, and revenue-model risk categories.
            calloutType: risk
