      - number: '4.3'
        title: Cost Structure, Margin Drivers & Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              No public source discloses terralayr's cost of debt, operations-and-maintenance cost per MW, or gross
              margin by revenue stream, so this section relies on independent German BESS project-finance benchmarks
              rather than company-specific figures. Modo Energy's January 2026 modeling puts typical German BESS project
              debt at 4-6% interest against a targeted equity return of 12-18%, with lenders capping gearing near 75%
              and requiring at least 60% of the loan balance repaid by a seven-year mini-perm maturity — the same
              seven-year mini-perm structure used in terralayr's own €60 million ABN AMRO/Commerzbank facility. Two
              independent sources corroborate that German lenders typically require 60-100% of project revenue to be
              contracted before committing debt; terralayr's own debt-financed portfolio sits at roughly 49% tolled, at
              or below that range even though it reached financial close, suggesting the balance of merchant exposure
              and diversified portfolio structuring, not contracted-revenue depth alone, supported bankability here. On
              the cost side, terralayr's only disclosed unit-economics data point is a claimed, unaudited saving of up
              to €4,000 per MW per year in wear-and-tear costs from 'netting-off' opposing optimiser dispatch schedules
              across its multi-optimizer platform. Separately, Rödl & Partner (an adverse, independent legal/tax source)
              reports that German BESS revenues 'significantly decreased' in 2025 versus 2024 and that marketer
              remuneration models remain incomparable and opaque market-wide, a cost-and-margin headwind not specific to
              terralayr but relevant to its entire addressable market.
