      - number: '7.7'
        title: Mitigations, monitoring and kill criteria
        blocks:
          - type: paragraph
            body: >-
              terralayr shows baseline operational and compliance infrastructure -- a GDPR data-controller designation
              and a real-time public status page -- but neither discloses KRITIS/BSIG registration nor ISO 27001
              certification (CR049). Because German BESS grid-connection, network-tariff, and construction-cost-subsidy
              rules were all in active flux as of the 2026 run date, with the TSO maturity procedure not yet launched
              and BNetzA storage-tariff guidance still pending, any project-level economics assuming today's toll or
              merchant pricing carry material forward regulatory-repricing risk (CR050). The mitigation and
              kill-criteria table (TR005) converts every top risk identified in this chapter into a monitorable trigger
              and threshold: additional adverse BNetzA rulings, finalized storage network tariffs exceeding current toll
              assumptions, confirmed KRITIS/BSIG non-registration, contracted-revenue share falling below typical lender
              covenant floors, toll non-renewal by RWE or Vattenfall, merchant-spread compression below today's
              benchmark, or any disclosed safety/cybersecurity incident. The risk transmission map (FR002) traces how
              each risk category flows through revenue, margin, financing headroom, and counterparty retention into the
              overall investment thesis, and the diligence paths embedded throughout this chapter's tables and evidence
              gaps constitute the concrete next-step asks for any investor or lender evaluating terralayr.
