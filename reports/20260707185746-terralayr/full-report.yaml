  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      How a prospective customer moves from discovery through commercial commitment to ongoing dispatch and eventual
      renewal on LAYR.
    data:
      nodes:
        - id: n1
          label: Discovery
          detail: >-
            Prospective customer encounters terralayr via press coverage, company insights pages, or conference/podcast
            appearances
          tone: neutral
        - id: n2
          label: Segment-specific onboarding
          detail: Municipal-utility API/IoT Box setup; major-offtaker deal negotiation; BESS-owner portfolio review
          tone: neutral
        - id: n3
          label: Commercial commitment
          detail: Tolling agreement or short-term framework signed (e.g. RWE, Vattenfall, Stadtwerke Duisburg, ENGIE)
          tone: positive
        - id: n4
          label: Production go-live
          detail: VBA participation begins, toll dispatch starts, or owner-managed optimizer switching activates
          tone: positive
        - id: n5
          label: Ongoing dispatch and optimizer routing
          detail: Multi-optimizer ETF routing, ancillary-service pre-qualification, continuous dispatch
          tone: neutral
        - id: n6
          label: Renewal/expansion decision point
          detail: >-
            Contract renewal, additional capacity, or optimizer re-selection -- largely undisclosed publicly beyond the
            single Stadtwerke Duisburg expansion example
          tone: warning
    approximationNotes: >-
      Journey stages are reconstructed from public product pages and named partner press releases; no internal
      customer-lifecycle diagram was published by the company.
