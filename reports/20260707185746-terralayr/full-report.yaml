  - id: TV005
    title: Thesis-break and kill triggers
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Grid-connection queue conversion stalls
        - >-
          Fewer than roughly 10% of the confirmed ~78GW of grid-connection commitments convert to signed tolling or PPA
          volume within 12 months
        - Breaks the pipeline-to-revenue bridge underlying the base and bull cases
        - Downgrade to avoid/track; withhold further capital until conversion is evidenced
      - - Valuation disclosed at a distressed multiple
        - >-
          A confirmed post-money valuation implies less than roughly EUR300k/MW versus the ~EUR634k/MW AllianzGI/Kyon
          Energy benchmark
        - Signals a down-round or loss of investor confidence
        - Re-underwrite the thesis; treat as bear-case confirmation
      - - Major tolling counterparty exit
        - RWE, Vattenfall, or Stadtwerke Duisburg terminates or does not renew its tolling/marketing agreement
        - Removes a revenue-certainty pillar of the bull case
        - Immediate re-rating to avoid pending a replacement counterparty
      - - Regulatory reform removes grid-fee exemption or imposes severe curtailment
        - >-
          The Section 118 EnWG grid-fee exemption is revoked, or ramp/ancillary restrictions cut modeled IRR below the
          cost of capital
        - Breaks the unit economics needed to convert the pipeline into financeable assets
        - Re-run the scenario model; may trigger the bear case
      - - Debt covenant breach or failed refinancing
        - >-
          Any disclosed default, waiver, or failed refinancing on the EUR100M accordion, EUR60M BBD facility, or other
          disclosed debt
        - Signals capital-structure stress
        - Escalate to avoid; monitor covenant headroom
      - - Sector-wide repricing evidence
        - >-
          Comparable BESS platforms (e.g., Akaysha Energy, or Enel Libra Flexsys-style peers) close new transactions at
          implied per-MW multiples below the current comparable set
        - Confirms broader multiple compression risk across the asset class
        - Discount the comparable-based entry-discipline framework accordingly
    notes: >-
      Triggers are constructed from this chapter's cited comparables and sector data; none has yet been observed for
      terralayr specifically.
    claimRefs:
      - CV039
      - CV023
      - CV045
      - CV027
  - id: TV006
    title: Final diligence asks
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Post-money valuation
        - >-
          A confirmed valuation figure for the January 2026 round, which ESS News and Mercom Capital both confirm was
          withheld
        - No price-sensitive recommendation is possible without a confirmed entry price
        - Request the term sheet or valuation memo directly from terralayr, Eurazeo, or RIVE Private Investment
      - - Reconciled lifetime funding total and cap table
        - >-
          A single confirmed total raised (versus the ~EUR329M unreconciled sum of disclosed rounds/facilities) and full
          preference/ownership stack
        - Determines dilution, control, and the true effective entry price for any investor
        - Request a capitalization table and financing history directly from terralayr during management diligence
      - - Revenue, margin, and portfolio-level tolled/merchant split
        - >-
          Audited or management-account revenue and gross margin across the full >150MW operating base, not only the
          112MW/238MWh debt-financed tranche
        - Needed to benchmark comparable multiples (EV/revenue, EV/MW) meaningfully
        - Request management accounts or data-room financials
      - - Grid-connection conversion status of the 8GW pipeline
        - >-
          Project-by-project confirmation of which pipeline capacity has secured grid-connection commitments versus
          applications only
        - Determines how much of the pipeline is realistically financeable given the ~720GW national queue
        - Request a project-by-project grid-connection status schedule
      - - Debt facility terms
        - Coupon, covenants, and maturity for the EUR100M accordion, EUR60M BBD facility, and any other disclosed debt
        - Determines downside resilience and refinancing risk
        - Request facility agreements or lender term sheets
      - - Board and governance structure
        - A reconciled board roster and voting/control rights across investor classes
        - Determines who controls key decisions such as exit timing and further capital raises
        - Request the shareholders' agreement and governance documents
    notes: Ordered by priority for unblocking a price-sensitive recommendation, not by ease of collection.
    claimRefs:
      - CV033
      - CV006
      - CV034
      - CV046
