            body: >-
              terralayr's capital adequacy picture is built entirely from financing-event announcements rather than
              balance-sheet disclosure: no source reviewed discloses cash on hand, monthly burn, or runway in months.
              The two largest disclosed capital events are a €192 million growth-equity round (including an €80 million
