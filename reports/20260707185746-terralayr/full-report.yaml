      - number: '2.5'
        title: Sizing and Adoption Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Several material gaps limit how precisely terralayr's addressable market can be sized from public evidence
              alone. First, the roughly 3x discrepancy between BDEW's 720GW/78GW German large-scale queue figures and
              the four TSOs' own reported 250GW/nearly-700-request figures has not been reconciled by any source found
              in this research, and materially changes how binding the grid-connection bottleneck should be judged to
              be. Second, SolarPower Europe's European Battery Market Outlook 2026-2030, a potential third independent
              forecaster, could not be accessed because its detail page is gated behind an interactive JavaScript
              dataset viewer that returns no readable market-sizing text. Third, the EU Joint Research Centre's storage
              policy-and-regulatory-framework page returned an HTTP-level access rejection rather than page content,
              blocking direct verification of EU-level regulatory framing. Fourth, Fraunhofer ISE's capacity-need
              figures (104GWh by 2030, 180GWh by 2045) are only available via a secondary news citation rather than the
              institute's own primary publication. Fifth, Aurora Energy Research's count of six existing German tolling
              deals, three of them terralayr's own, is sourced only through terralayr's self-citation and has not been
              independently verified. Finally, no independently-sourced, bottom-up services-revenue TAM specific to the
              BESS optimization/tolling layer itself could be located; every retained sizing lens proxies the
              opportunity via connection-request queues, installed-base figures, or capacity-need forecasts rather than
              a services-revenue estimate. These gaps are preserved explicitly, rather than smoothed into a single
              confident market-size number, because the underlying public evidence base for this market is genuinely
              contested and incomplete.
            claimRefs:
              - CM043
              - CM044
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Favorable near-term merchant and tolling economics
            body: >-
              2025 German day-ahead spreads (~EUR85k/MW/year, 85% above Great Britain) and a market-wide shift toward
              heavily tolled capacity (80-100% in Germany) currently support both merchant and tolled BESS revenue cases
              and improve financeable leverage.
            calloutType: strength
            claimRefs:
              - CM020
              - CM039
              - CM038
          - type: callout
            title: Order-of-magnitude gap between the connection queue and installed capacity
            body: >-
              Germany's 720GW pending large-scale connection-request queue dwarfs the ~2.6GW actually installed and
              terralayr's own ~8GW secured pipeline, and even BDEW's and the TSOs' own figures for the size of that
              queue disagree by roughly 3x, underscoring how much of the addressable market may never convert to
              revenue.
            calloutType: risk
            claimRefs:
              - CM014
              - CM017
              - CM018
              - CM035
          - type: callout
            title: Company-disclosed pipeline and asset figures are treated as unaudited management claims
            body: >-
              terralayr's own disclosed 8GW pipeline, ~200MW ready-to-build, and ~150MW operating/under-construction
              figures are company-claimed rather than independently audited; TechCrunch's earlier 2024 snapshot (7MWh
              live, 40MWh imminent, 200+ sites/7GW+ agreements) is broadly consistent in order of magnitude but was also
              sourced from company disclosure.
            calloutType: assumption
            claimRefs:
              - CM021
              - CM022
          - type: callout
            title: Tolling remains a nascent, highly concentrated segment of the German BESS market
            body: >-
              Per Aurora Energy Research as cited by terralayr, only six tolling agreements existed in the German market
              at time of citation, of which terralayr itself had signed three, indicating terralayr holds an outsized
              share of a still-emerging structure rather than competing in a mature, fragmented segment.
