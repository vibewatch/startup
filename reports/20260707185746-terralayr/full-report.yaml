      - number: '7.8'
        title: Exhibits
        blocks:
          - type: callout
            title: Grid-connection refusal is not hypothetical -- it already happened to a storage operator
            body: >-
              BNetzA's Beschlusskammer 6 upheld a grid operator's refusal of a battery-storage connection request in
              March 2026 (case BK6-25-325), confirming that a legally valid refusal can durably block a project even
              after significant development. This is direct precedent, not a modeled risk.
