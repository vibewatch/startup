- id: retention-durability-and-expansion-concentration-risk
  title: Retention, durability, and expansion/concentration risk
  body: "terralayr discloses no Net Revenue Retention, Gross Revenue Retention, or churn rate for its platform business (CU025). Disclosed contract lengths cluster at the long end for named major-offtaker tolls (RWE five years, Vattenfall seven years), while the company's own executives describe the platform's full contract-duration range as 15 minutes to 15 years, with no standard or median term disclosed (CU026). Stadtwerke Duisburg's documented progression from a short-term framework to live VBA participation is the only publicly evidenced expansion-in-place example (CU027). Named testimonials exist, but no independently published satisfaction survey or reference-call summary was found (CU028), and independent trade press description of established players 'dispatching via LAYR already' implies continuity without a formal usage metric (CU029). No total customer count or renewal-rate disclosure exists publicly (CU030, CU031). On concentration, RWE and Vattenfall together account for all disclosed named toll capacity, and no top-customer revenue-share breakdown exists (CU032, CU033). The ETF model creates platform-level dependence on three named optimizer partners (CU034), all named customers are Germany-based against an 8GW pipeline referenced in a 2026 podcast (CU035), and major-offtaker deals show multi-month to multi-quarter announcement-to-go-live cycles, compounded by RWE's declining to disclose exact toll pricing to the press (CU036, CU037). Independent market analyses (Roedl & Partner; Modo Energy's Q2 2026 outlook) separately flag Germany's grid-connection queue exceeding 700GW against roughly 2.5-2.6GW installed, and a BESS grid-fee exemption running only to August 2029, as structural, non-company-specific risks to future counterparty economics (CU038, CU039, CU040)."
