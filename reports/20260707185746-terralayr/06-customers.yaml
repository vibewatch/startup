callouts:
- calloutType: strength
  title: Unusually well-corroborated named production proof for this stage
  body: Three named production counterparties (RWE, Vattenfall, Stadtwerke Duisburg Energiehandel) are each independently confirmed by non-company press -- not just company press releases -- which is a stronger evidentiary bar than most early-stage platform companies clear.
  claimRefs:
  - CU007
  - CU017
  - CU019
- calloutType: risk
  title: High concentration in two named toll counterparties with no disclosed revenue share
  body: RWE and Vattenfall together account for all disclosed named multi-asset toll capacity, yet no top-customer revenue or capacity-share breakdown exists, making the true concentration risk to total company economics unverifiable from public sources.
  claimRefs:
  - CU032
  - CU033
- calloutType: insight
  title: ENGIE remains a partnership framework, not confirmed production
  body: Unlike RWE, Vattenfall, and Stadtwerke Duisburg, the ENGIE 'Mini Toll' relationship has no independent press coverage, contracted MW figure, or go-live confirmation as of the run date, and should be weighted differently in any customer-proof assessment.
  claimRefs:
  - CU008
  - CU022
- calloutType: recommendation
  title: Request retention, renewal, and concentration metrics directly in diligence
  body: Given the systematic public non-disclosure of total customer count, contract renewal rates, NRR/GRR/churn, and top-customer revenue concentration, diligence teams should request these figures directly from terralayr rather than relying on inference from named-deal announcements.
  claimRefs:
  - CU025
  - CU030
  - CU031
  - CU033
