company:
  name: terralayr
chapter:
  number: 6
  title: Customers
  summary: terralayr's disclosed customer base is small but unusually well-corroborated for its stage, anchored by three independently confirmed production counterparties -- RWE (50MW/100MWh, 5-year toll), Vattenfall (55MW, 7-year toll, live from March 2026), and Stadtwerke Duisburg Energiehandel (live Virtual Battery Auction participant) -- alongside a still-unconfirmed ENGIE partnership framework, while the company discloses no aggregate customer count, contract-renewal rate, NRR/GRR/churn figure, or top-customer revenue concentration.
sections:
- id: customer-segmentation-and-buyer-landscape
  title: Customer segmentation and buyer landscape
  body: "terralayr organizes its go-to-market around three primary buyer groups, each with a dedicated customer-facing page on the company's own site: national/major utilities entering multi-asset capacity tolling agreements, municipal utilities (Stadtwerke) accessing capacity through Virtual Battery Auctions (VBAs), and BESS owners/investors buying a managed, optimizer-switching service (CU001). Major offtakers such as RWE and Vattenfall are Germany-wide counterparties whose commodity-origination and trading desks act as both buyer and payer of the toll premium, independently confirmed by each company's own press releases (CU002). Municipal utilities are illustrated by Stadtwerke Duisburg Energiehandel, which independently describes itself as one of Germany's largest municipal energy traders with more than 200 business relationships to other Stadtwerke, and which onboards via an API-first, IoT Box-connected setup (CU003). BESS owners/investors are served by a distinct portfolio-management product, evidenced by named testimonials from Vattenfall's own commodity-origination executives rather than an independent customer survey (CU004). A fourth, earlier-stage channel is ENGIE, whose 'Mini Toll' short-duration flexible tolling framework, announced in May 2025, remains a disclosed partnership rather than a confirmed production relationship (CU005). No aggregate customer count is disclosed for any segment; all public evidence takes the form of named individual examples rather than a sized customer base (CU030)."
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU030
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-named-deal-ramp
  title: Adoption trajectory and named-deal ramp
  body: "terralayr's adoption trajectory can be reconstructed from a sequence of independently dated announcements and one recent, undated executive interview. Its own Tittling BESS asset (10.35MW/22.83MWh) came online in Bavaria as part of the owned-asset base underlying the platform (CU006). RWE Supply & Trading and terralayr closed a five-year, 50MW/100MWh multi-asset capacity toll effective 2026, independently confirmed by RWE's own press release, ESS News, and Renewables Now (CU007). ENGIE and terralayr announced a 'Mini Toll' partnership on 6 May 2025, but no independent press, contracted MW figure, or production go-live has since been found (CU008). Stadtwerke Duisburg Energiehandel and terralayr announced a cooperation on 29 September 2025, independently corroborated the same day by pv magazine Germany, targeting joint management of more than 100MW (CU009). terralayr launched its multi-optimizer 'Enhanced Trading of Flexibility' (ETF) model on 19 November 2025 (CU010). Vattenfall's toll went live in March 2026, starting with an initial 5MW tranche to be ramped toward the full 55MW over time, independently confirmed by pv magazine Germany and Solarserver on 2026-03-03 (CU011). As of a 2026 interview, terralayr states it has three owned BESS assets live, two more under construction, and targets 100MW of owned capacity within about a year, while independent trade press separately reports more than 50MW of third-party BESS already live and dispatching, with roughly 100MW more expected in the very near future (CU012, CU013, CU014)."
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: named-customer-proof-production-vs-pilot
  title: 'Named customer proof: production versus pilot'
  body: "Three named counterparties have reached demonstrable production status, and one remains partnership-stage only. RWE's own press release confirms its five-year, 50MW/100MWh toll, independently corroborated by Renewables Now, which separately quotes RWE's Bart Beljaars, Head of Commercial Asset Optimisation for Continental Europe, by name (CU015, CU016). Vattenfall's seven-year, 55MW toll across eight decentralised battery sites is independently confirmed as live in March 2026 by pv magazine Germany, Solarserver, and Renewables Now, alongside named testimonials from Vattenfall's own Bjoern Schneegans and Honey Duan on terralayr's customer pages (CU017, CU018). Stadtwerke Duisburg Energiehandel's cooperation is independently corroborated by pv magazine Germany, the Unternehmerverband trade association, and the utility's own press release, naming managing director Dr. Michael Arnold, and independently describes itself as managing roughly 300MW of flexible assets with 200-plus Stadtwerke relationships (CU019, CU020). Stadtwerke Duisburg went live on VBA following an earlier tolling framework, the clearest documented production (not pilot) municipal case (CU021). By contrast, ENGIE's partnership has no independent press coverage, MW figure, or go-live confirmation as of the run date, and should be read as partnership/framework-stage rather than production (CU022). terralayr's own CCO Mikko Preuss describes the pooled toll structure as reducing individual-asset outage risk for offtakers, a claim independently reported by Energy-Storage.news (CU023). In total, three production-grade and one partnership-stage named relationship are publicly disclosed, plus an undisclosed number of BESS-owner/investor clients referenced only via aggregate testimonials (CU024)."
  claimRefs:
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
