- id: module-asset-product-map
  title: Module, asset, and product-line map
  body: Beyond the core LAYR software, terralayr organises its public-facing offering into several distinguishable product lines. The Enhanced Trading of Flexibility (ETF) model, launched 19 November 2025, is a multi-optimizer product that unites three named optimizer partners -- Entrix, suena energy, and The Mobility House Energy -- to trade the same battery in parallel across intraday markets and ancillary services, with capacity reallocated between them via a single click and no new contracts (CE004, CE005). Virtual Battery Auctions are a separate, capacity-rental product distinct from the ownership-oriented BESS-owner/investor product, which instead lets an owner switch optimizers and manage its whole portfolio directly (CE008, CE014). A municipal-utility and utility integration product line packages the platform as an API-first, IoT-connected setup specifically for utility trading desks (CE011, CE012). Multi-asset capacity tolling is a fourth distinguishable product line aimed at major offtakers, aggregating several physical batteries into a single virtual capacity block (CE013). Finally, terralayr operates a distinct Asset Development product line that partners with landowners, municipalities, and independent project developers to site and build new BESS projects, citing experience across several hundred megawatts of realized projects and, most recently, a nine-project, 112 MW / 238 MWh portfolio financing (CE015, CE036, CE037, CE038). This module/product breakdown is necessarily reconstructed from terralayr's own published pages rather than an official product catalogue, so it should be treated as a representative rather than an exhaustive enumeration (see the enumeration-incompleteness evidence gap).
  claimRefs:
