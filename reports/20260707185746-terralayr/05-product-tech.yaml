- id: deployment-integration-reliability-roadmap
  title: Deployment, integration, reliability, support, and roadmap
  body: terralayr's own status page reported on 7 July 2026 that all monitored services were online, with the production api.trlyr.com/virtual-assets endpoint at 99.999% uptime, api.trlyr.com/auth at 100% uptime, and www.trlyr.com at 99.977% uptime over its measurement window; the page also lists separate sandbox endpoints, implying a distinct pre-production integration environment (CE018, CE019). No public API reference, SDK, or onboarding documentation was found alongside these named endpoints, and no formal SLA, service-credit policy, or historical incident postmortem is publicly available beyond this live snapshot (see evidence gaps GE002, GE003). On the delivery side, terralayr publishes a 60-day EPC tendering process that screens, selects, and contracts turnkey EPC providers, then tracks execution timelines, budgets, and on-site Health & Safety, progress, and compliance (CE016). This process underpinned the recently closed nine-project, 112 MW / 238 MWh portfolio financing, in which construction and operations are delivered under turnkey EPC contracts and long-term O&M agreements from three established providers, explicitly framed by the company as diversifying execution risk (CE036, CE038). Roadmap signal in 2026 includes the RWE five-year multi-asset toll (from 28 May 2025) and Vattenfall's ramp from an initial 5 MW tranche toward a full 55 MW virtual portfolio slice, alongside the ETF multi-optimizer launch in November 2025 (CE039, CE041, CE004). Independent media coverage -- Bayerischer Rundfunk's on-site TV feature of the Tittling grid-connection day and MDR's coverage of BESS grid-prioritisation trends -- provides third-party corroboration of construction and operational progress beyond the company's own announcements (CE027, CE028).
  claimRefs:
