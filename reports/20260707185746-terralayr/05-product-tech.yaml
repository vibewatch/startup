callouts:
- calloutType: strength
  title: Multi-optimizer orchestration is a genuine architectural differentiator
  body: The ETF model's ability to run three named optimizer partners on the same asset in parallel, with reallocation in a single click, is independently corroborated by RWE and Vattenfall press releases describing pooled, portfolio-level structures that go beyond conventional single-asset tolling.
  claimRefs:
  - CE004
  - CE005
  - CE039
  - CE040
  - CE042
- calloutType: risk
  title: No public cybersecurity certification or SLA disclosed
  body: Unlike hardware-centric competitor Fluence, which publicly claims UL9540/UL9540A/IEC and cybersecurity-standard compliance, terralayr discloses no ISO 27001/SOC 2-equivalent certification, formal SLA, or incident postmortem beyond a live status-page snapshot; this should be closed via direct diligence questions.
  claimRefs:
  - CE022
  - CE023
  - CE044
- calloutType: insight
  title: Developer-signal evidence is a practitioner-community proxy, not a code-surface signal
  body: terralayr has no public code repository, SDK, or developer forum; the developer-signal sources in this chapter are executive podcast/conference appearances, which evidence practitioner engagement and narrative rather than code-level adoption.
  claimRefs:
  - CE030
  - CE031
  - CE032
  - CE033
- calloutType: recommendation
  title: Request a security questionnaire, SLA terms, and complete product/asset catalogue directly
  body: Because public sources do not cover security certifications, contractual SLA terms, or an exhaustive product/asset enumeration, technical and commercial diligence should request these directly from terralayr rather than relying on the public status page and marketing pages alone.
  claimRefs:
  - CE022
  - CE023
