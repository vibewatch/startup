- id: FE004
  title: Product maturity / capability map
  type: matrix
  layout: wide
  summary: Maturity of terralayr's public disclosure across four capability lenses per product line, contrasted with the Fluence Gridstack benchmark.
  data:
    columns:
    - Commercial go-live evidence
    - Technical/architecture disclosure
    - Independent/third-party corroboration
    - Trust & safety disclosure
    rows:
    - label: LAYR virtual battery platform
      values:
      - label: Live (Duisburg VBA, RWE/Vattenfall tolls)
      - label: Marketing-level description; no public API reference
      - label: RWE and Vattenfall press releases corroborate
      - label: No public certification disclosed
    - label: ETF multi-optimizer model
      values:
      - label: Live since 2025-11-19
      - label: Named optimizer partners disclosed
      - label: Partner sites (Entrix, Mobility House) corroborate roles
      - label: No independent audit found
    - label: Virtual Battery Auctions (VBA)
      values:
      - label: Live (Stadtwerke Duisburg Energiehandel)
      - label: Mechanism described at product-page level
      - label: Named customer quote corroborates
      - label: No SLA/uptime guarantee beyond status page
    - label: Multi-asset capacity tolling
      values:
      - label: Live (RWE 50MW, Vattenfall 55MW)
      - label: Aggregation/slicing mechanism described
      - label: Independent partner press releases (high reputation)
      - label: No named safety/security certification
    - label: Asset Development
      values:
      - label: Portfolio financing closed (9 projects, 112MW)
      - label: EPC tendering process documented
      - label: No independent financing-terms corroboration found
      - label: 60-day EPC H&S/compliance process documented
    - label: 'Benchmark: Fluence Gridstack (competitor)'
      values:
      - label: Established commercial product (not terralayr)
      - label: Public architecture stack (Nispera, Mosaic, APIs) documented
      - label: Vendor-published; independent audit not reviewed here
      - label: UL9540/UL9540A/IEC + cybersecurity-standard claims published
  approximationNotes: Maturity levels are qualitative assessments derived from the disclosure depth found in public sources, not a company-provided maturity rating.
