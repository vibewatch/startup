  evidenceGaps:
  - id: GE001
    type: missing-source
    severity: material
    topic: security-certification
    missingEvidence: An ISO 27001, SOC 2 Type I/II, or other independent cybersecurity certification/attestation for LAYR's platform or API.
    whyItMatters: Cannot independently verify terralayr's security posture against industry-standard certifications; hardware-centric competitor Fluence publicly claims UL9540/UL9540A/IEC and cybersecurity-standard compliance for Gridstack, a disclosure level terralayr does not match publicly.
    diligencePath: Request a security questionnaire, SOC 2 report, or penetration-test summary directly from terralayr during technical diligence.
    relatedQuestionRefs:
    - QE006
    - QE027
  - id: GE002
    type: missing-source
    severity: material
    topic: sla-reliability
    missingEvidence: A formal SLA document, uptime guarantee, service-credit policy, or historical incident postmortem archive for LAYR.
    whyItMatters: The only public reliability evidence is a live, point-in-time status page snapshot (captured 2026-07-07); this reflects a single observation window, not a contractual commitment or a multi-period track record.
    diligencePath: Request the commercial SLA terms, historical uptime reporting, and any incident postmortems directly from terralayr.
    relatedQuestionRefs:
    - QE017
    - QE018
