- id: architecture-operating-model
  title: Architecture and operating model
  body: Architecturally, terralayr's model layers owned physical BESS hardware, an IoT/EMS integration layer, LAYR's virtualisation logic, a unified API, dispatch/ancillary-service orchestration, and multi-optimizer routing (CE002, CE003, CE007, CE019). At the base, terralayr's own facilities such as Tittling (22.83 MWh / 10.35 MW, connected to the grid 27 January 2025) and Untersteinach (construction begun 26 November 2024) use lithium iron phosphate (LFP) chemistry that the company states meets the highest fire-safety standards and complies with noise regulations (CE024, CE025, CE026). An IoT Box connects each asset's on-site energy-management system to LAYR, which then handles asset aggregation and disaggregation, asset modelling, operational control, and dispatch orchestration centrally (CE011, CE012). Every onboarded asset receives turnkey dispatch infrastructure, including pre-qualification for Ancillary Services such as FCR and aFRR, regular reporting, and asset-manager dashboards, with the platform guaranteeing adherence to technical restrictions and manufacturer specifications when allocating dispatch signals (CE006, CE007). The most distinctive architectural feature is the ETF multi-optimizer orchestration layer, which lets three independent, named optimizer partners trade the same underlying asset in parallel rather than binding it to a single exclusive trader (CE004, CE005, CE046, CE047). This is the mechanism RWE and Vattenfall both rely on for their multi-asset capacity toll structures, in which several individual battery systems are connected via the platform into a single virtual block, with Vattenfall explicitly citing the pooled structure as reducing outage risk because other batteries can cover an individual unit's unavailability (CE039, CE040, CE042, CE043). The whole stack operates within an external regulatory layer -- ENTSO-E's EU-wide network codes and TSO/DSO grid-connection processes -- that the company does not control (CE051).
