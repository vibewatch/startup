  topStrengths:
    - A €192 million Eurazeo-led 2026 round and a separate debt facility show that specialist infrastructure investors are willing to fund the platform.
    - Named commercial proof with RWE, Vattenfall, and Stadtwerke Duisburg gives Terralayr stronger adoption evidence than a pipeline-only BESS developer.
    - Terralayr's disclosed scale (>150 MW operating or under construction, ~200 MW ready to build, 8 GW pipeline) is meaningful in the German storage market.
    - The hybrid owner-operator plus LAYR platform model could let Terralayr monetize both owned and third-party battery fleets.
  topRisks:
    - No reviewed source discloses Terralayr's valuation, revenue, gross margin, cash burn, or runway, blocking any price-sensitive underwriting.
    - German BESS grid-connection and regulatory rules remain unsettled in 2026, directly threatening pipeline conversion and asset-level returns.
    - The model is capital intensive and increasingly dependent on continued access to project debt, equity follow-ons, and utility-grade counterparties.
    - Public customer proof is concentrated in a small set of named utilities, while aggregate customer count, renewal data, and concentration metrics remain undisclosed.
  unresolvedGaps:
    - The January 2026 round's post-money valuation, cap table, and liquidation or preference terms are not public.
    - Terralayr has not publicly disclosed revenue, gross margin, tolled-versus-merchant mix, or asset-level utilization across its >150 MW operating base.
    - No single public source reconciles Terralayr's lifetime capital raised across equity, debt, and project-level facilities.
    - Governance transparency remains incomplete because board composition, rights, and investor-control terms are only partially disclosed.
disclaimer: This report synthesizes publicly available sources as of 2026-07-07 and does not constitute investment advice. It does not assert a valuation for Terralayr because no reviewed source in this report's evidence pack discloses one.
