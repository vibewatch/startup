companyProfile:
  summary: Terralayr is a Swiss-parent, Germany-operating battery-storage company that develops, owns, and operates grid-scale BESS assets while also monetizing its own and third-party batteries through the LAYR flexibility platform. Its commercial proof includes disclosed utility tolling and marketing relationships with RWE, Vattenfall, and Stadtwerke Duisburg, while its financing proof includes a €77 million 2024 round, a €192 million Eurazeo-led January 2026 growth-equity round, and a separate roughly €60 million debt facility. The company appears strategically credible, but remains financially opaque because no reviewed source discloses valuation, revenue, margins, or a reconciled lifetime funding total.
  foundedDate: '2022-12-06'
  founders:
    - name: Philipp Man
      role: Co-founder and CEO
      background: Previously co-founded and led CHRONEXT for about a decade and earlier worked on Glencore's jet-fuel trading desk.
      claimRefs: [CO012]
    - name: Ludwig Wurlitzer
      role: Co-founder and COO
      background: Previously co-founded CHRONEXT with Philipp Man and led operations and platform development there.
      claimRefs: [CO013]
  foundingLocation: Zug, Switzerland
  headquarters: Zug, Switzerland / Berlin, Germany
  productSummary: Terralayr sells grid-scale battery-storage capacity and a software-led flexibility product, LAYR, that aggregates and optimizes both Terralayr-owned and third-party batteries across tolling, trading, and longer-duration capacity contracts.
  customerFocus: Utilities, power traders, and battery-asset owners in Germany and adjacent European power markets seeking contracted flexibility capacity or portfolio optimization.
  businessModel: Develop, own, and operate BESS assets; sign tolling and virtual-battery commercialization agreements; optimize third-party batteries through LAYR; and fund fleet growth with equity plus project-level debt.
  stage: Series C / growth equity
  fundingStatus: Raised approximately €77 million in October 2024, then €192 million in a Eurazeo-led January 2026 growth-equity round, alongside a separate roughly €60 million debt facility tied to Big Battery Deutschland; public sources still do not disclose a post-money valuation or a fully reconciled lifetime funding total.
  disclosureProfile: private-undisclosed
