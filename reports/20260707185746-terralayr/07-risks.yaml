    whyItMatters: The regulatory/legal risk register in this chapter reflects the regimes independently documented as of the run date; site-specific or project-specific regulatory exposures (e.g. state-level permitting variances) are not enumerated and could add or remove risk rows.
    diligencePath: Request a project-by-project regulatory-compliance matrix from terralayr covering every pipeline and operating site.
