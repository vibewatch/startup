- id: financial-model-risk
  title: Financial and model risk
  body: 'The clearest quantified financial risk is merchant-revenue cannibalization: independent analyst modeling projects average day-ahead-plus-intraday arbitrage revenue for a two-hour German battery falling from about EUR86,000/MW today to about EUR50,000/MW under a 47GW 2030 base case, and to as low as EUR12,000/MW if battery build-out fully matches new solar capacity (CR036), with roughly EUR100/MWh of daily spread needed just to cover today''s investment costs (CR037). This directly bears on any portion of terralayr''s portfolio commercialized on a merchant basis, since two independent sources put 2025 German merchant spreads at about EUR85,000/MW/year versus terralayr''s own disclosed toll-pricing range of EUR110,000-150,000/MW/year (CR038), a premium that reflects the market convention of tolling 70-100% of capacity for revenue certainty (CR039). Rödl & Partner separately reports realized German storage revenues fell materially in 2025 versus 2024 (CR041), and Germany''s 2026 negative-price episodes compound merchant-exposure risk (CR043). terralayr''s EUR60 million senior secured debt facility, structured as a seven-year mini-perm with a EUR100 million accordion, will require refinancing or drawdown well before underlying asset life ends (CR042). No public source discloses terralayr''s realized revenue, EBITDA, burn rate, cash runway, or blended contracted-versus-merchant revenue split across its full owned portfolio (CR040), which is this chapter''s single largest financial evidence gap.'
  claimRefs:
  - CR036
  - CR037
  - CR038
  - CR039
  - CR040
  - CR041
  - CR042
  - CR043
- id: people-execution-risk
  title: People and execution risk
  body: 'terralayr''s public narrative concentrates around a single named founder in its earliest independent press coverage (CR048), a governance profile that is at least partially offset by an eight-member board recorded in Swiss commercial-registry-derived data, though no independent-director biographies are publicly disclosed (CR044). The company is incorporated as terralayr AG in Zug, Switzerland, per the Swiss Official Gazette of Commerce, while its regulated battery-storage assets and revenue counterparties are predominantly German, adding cross-border governance and regulatory-coordination complexity that no public source addresses (CR045). The most consequential execution risk is scale conversion: independent legal counsel to terralayr''s own 2026 financing round states the company owns more than 150MW of operating and under-construction assets plus roughly 200MW ready-to-build, against a disclosed secured pipeline of about 8GW -- implying the large majority of the pipeline has yet to be converted into financed, constructed capacity (CR047). No public source discloses terralayr''s current headcount, organizational chart, or key-hire/departure history, which limits any independent assessment of whether the execution team is resourced to deliver that conversion (CR046).'
  claimRefs:
  - CR044
  - CR045
  - CR046
  - CR047
  - CR048
  tableRefs:
  - TR004
- id: mitigations-monitoring-kill-criteria
  title: Mitigations, monitoring and kill criteria
  body: 'terralayr shows baseline operational and compliance infrastructure -- a GDPR data-controller designation and a real-time public status page -- but neither discloses KRITIS/BSIG registration nor ISO 27001 certification (CR049). Because German BESS grid-connection, network-tariff, and construction-cost-subsidy rules were all in active flux as of the 2026 run date, with the TSO maturity procedure not yet launched and BNetzA storage-tariff guidance still pending, any project-level economics assuming today''s toll or merchant pricing carry material forward regulatory-repricing risk (CR050). The mitigation and kill-criteria table (TR005) converts every top risk identified in this chapter into a monitorable trigger and threshold: additional adverse BNetzA rulings, finalized storage network tariffs exceeding current toll assumptions, confirmed KRITIS/BSIG non-registration, contracted-revenue share falling below typical lender covenant floors, toll non-renewal by RWE or Vattenfall, merchant-spread compression below today''s benchmark, or any disclosed safety/cybersecurity incident. The risk transmission map (FR002) traces how each risk category flows through revenue, margin, financing headroom, and counterparty retention into the overall investment thesis, and the diligence paths embedded throughout this chapter''s tables and evidence gaps constitute the concrete next-step asks for any investor or lender evaluating terralayr.'
  claimRefs:
  - CR049
  - CR050
  tableRefs:
  - TR005
  figureRefs:
  - FR002
