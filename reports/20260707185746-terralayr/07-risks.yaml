- id: operational-technical-security-risk
  title: Operational, technical and security risk
  body: Operationally, the German BESS industry's own safety body states there have been no reported accidents to date even as project sizes exceed 1 GWh (CR019), and no public source discloses any fire, thermal-runaway, safety-enforcement, or recall event involving a terralayr asset specifically (CR021); however, no public source confirms a UL9540A-equivalent third-party safety certification either, a gap made more visible by a benchmark competitor's public safety-standard claims (CR022). Independent legal/economic analysis separately flags cell imbalance as a sector-wide technical risk that can shorten battery lifespan (CR023), and terralayr does not publicly name its cell supplier or disclose a quality-assurance/warranty process (CR024). On the security side, Bundesnetzagentur and BSI are tightening ISO/IEC 27001-aligned cybersecurity requirements for energy infrastructure (CR014), yet no public source confirms an ISO 27001, SOC2, or equivalent certification, nor a cybersecurity-incident disclosure, for terralayr's LAYR platform (CR026). Reliability evidence is limited to terralayr's own self-reported 99.9%+ uptime figures (CR025). Construction execution runs through an internally disclosed EPC-tendering process with unnamed contractors (CR027), and Germany's 2026 negative-price episodes illustrate a further operational stress -- driven by grid bottlenecks rather than a lack of storage ambition, per industry-association analysis (CR028).
  claimRefs:
