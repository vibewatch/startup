- id: partner-dependency-risk
  title: Partner and dependency risk
  body: 'terralayr''s disclosed partner base is narrow and concentrated across every dependency category. Its entire disclosed named toll capacity sits with two counterparties, RWE and Vattenfall (CR029), its project debt sits with two named lenders, ABN AMRO and Commerzbank (CR030), its municipal-utility distribution channel runs through a single named partner, Stadtwerke Duisburg Energiehandel (CR032), and its greenfield pipeline growth depends materially on the acquired BBD joint venture with the Averdung Group (CR033). The company has diversified its optimizer/trading-partner base from an earlier single-optimizer model to a three-partner Enhanced Trading of Flexibility structure spanning Entrix, suena energy, and The Mobility House Energy, somewhat reducing single-point dependency in that specific channel (CR031). Regulator dependency is structurally high and not diversifiable: the Bundesnetzagentur and regional grid operators control connection approvals and tariff-setting, illustrated adversely by the BK6-25-325 refusal precedent (CR034). Construction execution depends on tendered but publicly unnamed EPC contractors, meaning contractor-level concentration cannot be independently assessed (CR035). The dependency map (FR003) lays out all seven named-partner and structural dependencies feeding into terralayr''s owned-asset and platform revenue.'
  claimRefs:
  - CR029
  - CR030
  - CR031
  - CR032
  - CR033
  - CR034
  - CR035
