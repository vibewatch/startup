- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold/event
  - Action implication
  rows:
  - - Grid-connection refusal precedent spreading
    - Additional BNetzA Beschlusskammer rulings against BESS grid-connection rights
    - 2 or more further adverse rulings within 12 months of BK6-25-325
    - Re-underwrite pipeline-conversion assumptions downward; discount unconfirmed connection sites
  - - Storage-specific network tariffs finalized above budget
    - BNetzA publishes binding storage network-tariff methodology
    - Tariff exceeding the current EUR110,000-150,000/MW/yr toll-pricing assumption
    - Re-run project IRR and toll-pricing models with the finalized tariff
  - - KRITIS/BSIG non-compliance
    - BSI enforcement action, or confirmed missed registration as a critical-facility operator
    - Any confirmed non-registration or fine disclosed
    - Escalate cybersecurity diligence; request a remediation plan and timeline
  - - Lender covenant breach risk
    - Contracted-revenue share versus typical 60-100% lender requirement
    - Contracted share falls below 40% at any measurement date
    - Request an updated debt-covenant compliance certificate from terralayr
  - - Toll counterparty non-renewal
    - RWE (5-yr, from 2026) or Vattenfall (7-yr) toll agreement approaching or reaching term
    - No renewal announced within 6 months of contract end
    - Reassess revenue-concentration risk and merchant-exposure ratio
  - - Merchant-spread cannibalization deepening
    - Realized German day-ahead arbitrage spread for a 2-hour battery versus the ~EUR85,000/MW/yr 2025 benchmark
    - Realized spread below EUR60,000/MW/yr for 2 consecutive quarters
    - Stress-test merchant-revenue assumptions in the valuation model
  - - Safety or cybersecurity incident
    - Any disclosed fire, thermal-runaway, or cyber-incident at a terralayr-owned/managed asset
    - A single confirmed incident
    - Trigger immediate operational and reputational risk re-rating; pause new capital commitments pending review
  notes: Thresholds are this chapter's proposed monitoring framework based on cited sources; terralayr has not publicly disclosed its own internal kill-criteria or covenant-monitoring thresholds.
