chapter:
  number: 7
  title: Risks
  summary: 'terralayr''s most severe and best-evidenced risk is grid-connection regulatory risk: a 2026 BNetzA ruling (BK6-25-325) confirms that a legally valid connection refusal can durably block a German battery-storage project, against a national connection queue exceeding 720GW versus roughly 2.6GW installed. Partner concentration is structurally high (RWE and Vattenfall represent all disclosed named toll capacity; ABN AMRO and Commerzbank are the only named lenders), and independent analyst modeling shows German battery-arbitrage revenue compressing materially as storage capacity scales toward 2030. No public source confirms terralayr''s safety certification, cybersecurity registration, or realized financial performance, leaving several high-severity risks as unresolved diligence items rather than confirmed exposures.'
sections:
- id: risk-register-overview
  title: Risk register overview
  body: This chapter ranks terralayr's risks across five lenses -- regulatory/legal, operational/technical/security, partner/dependency, financial/model, and people/execution -- using only public regulator filings, court and administrative-decision reporting, legal-advisory analysis, industry-association guidance, and terralayr's own disclosures (CR001). Because terralayr is a private, disclosure-light company operating in a German battery-storage market undergoing active regulatory change in 2026, the register leans heavily on sector-level evidence -- grid-connection queue statistics, a real adverse BNetzA ruling against a storage operator (BK6-25-325), EU and German critical-infrastructure law, and independent analyst modeling of merchant-revenue cannibalization -- rather than company-specific incident history, which public sources do not disclose (CR002, CR003, CR004, CR036). Where no terralayr-specific evidence exists for a given risk (safety incidents, cybersecurity certification, litigation), this chapter states that explicitly rather than inferring a clean record from silence (CR021, CR026). The risk heatmap (FR001) summarizes likelihood, severity, mitigation maturity, and residual exposure across the eight highest-severity risks identified across all four categories.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR021
  - CR026
  - CR036
  figureRefs:
  - FR001
- id: regulatory-legal-risk
  title: Regulatory and legal risk
  body: Grid-connection regulatory risk is the single largest and most concretely evidenced risk category for a German BESS platform. Grid-connection applications for large-scale battery storage exceeded 720 GW against roughly 2.6 GW of installed large-scale storage capacity (CR004), and on 30 March 2026 BNetzA's Beschlusskammer 6 upheld a grid operator's refusal of a storage operator's connection request, confirming that a legally valid refusal can durably block a project (CR002). A December 2025 amendment clarified that battery storage falls outside the KraftNAV ordinance (CR001), while the TSOs' proposed 'first-ready, first-served' maturity-based allocation procedure -- not expected to launch before April 2026 -- would add a EUR50,000 application fee and a EUR1,500/MW realisation deposit to future connection requests (CR005), alongside now-mandatory construction-cost subsidies confirmed by the Federal Court of Justice (CR006). Beyond grid connection, terralayr's asset base and any future non-EU capital raise sit within the scope of the EU Battery Regulation (CR009), Germany's KRITIS-Dachgesetz and revised BSI Act (CR011, CR012), foreign-investment screening thresholds (CR015), and Bundeskartellamt merger-control rules relevant to roll-up acquisitions such as the BBD joint venture (CR017, CR018). No public source confirms terralayr's compliance posture, registration status, or filing history under any of these regimes (CR010, CR013, CR018).
  claimRefs:
