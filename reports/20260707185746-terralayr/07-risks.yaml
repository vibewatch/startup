  evidenceGaps:
  - type: missing-source
    severity: material
    topic: grid-connection-verification
    missingEvidence: A binding, non-appealable grid-connection agreement or connection-offer letter for each of terralayr's disclosed ready-to-build and under-construction sites.
    whyItMatters: terralayr's own 'ready to build' and 'under construction' site labels are not independently verified as legally secured grid connections; the BK6-25-325 precedent shows a storage operator's connection request can be refused even after significant project development, so an unconfirmed connection status could materially delay or block revenue.
    diligencePath: Request copies of the grid-connection agreement or TSO/DSO connection-offer letter for each named ready-to-build and under-construction site directly from terralayr.
    relatedQuestionRefs:
    - QR008
  - type: missing-source
    severity: material
    topic: merger-control-filing-status
    missingEvidence: Confirmation of whether terralayr's acquisition of 100% of the BBD (Big Battery Deutschland) joint venture from the Averdung Group met Bundeskartellamt merger-control notification thresholds, and if so, whether a filing was made and cleared.
    whyItMatters: An unfiled notifiable transaction can expose the acquirer to fines and, in principle, unwind risk under German competition law; no public source discloses the transaction's turnover figures or filing status.
    diligencePath: Request the BBD transaction's turnover figures and any Bundeskartellamt filing/clearance confirmation directly from terralayr or its legal counsel.
    relatedQuestionRefs:
    - QR017
  - type: missing-source
    severity: blocking
    topic: financial-disclosure-gap
    missingEvidence: terralayr's blended contracted-vs-merchant revenue split across its full owned portfolio, realized 2025/2026 revenue, EBITDA, burn rate, and cash runway.
    whyItMatters: Without these figures, it is not possible to independently quantify the company's exposure to the merchant-revenue-cannibalization and negative-price risks documented in this chapter, or to assess covenant headroom against its EUR60 million debt facility.
    diligencePath: Request current financial statements, revenue-mix disclosure by contract type, and cash-runway figures directly from terralayr during commercial/financial diligence.
    relatedQuestionRefs:
    - QR033
