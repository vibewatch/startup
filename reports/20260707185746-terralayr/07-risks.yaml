callouts:
- calloutType: risk
  title: Grid-connection refusal is not hypothetical -- it already happened to a storage operator
  body: BNetzA's Beschlusskammer 6 upheld a grid operator's refusal of a battery-storage connection request in March 2026 (case BK6-25-325), confirming that a legally valid refusal can durably block a project even after significant development. This is direct precedent, not a modeled risk.
  claimRefs:
  - CR002
- calloutType: risk
  title: Two counterparties account for all of terralayr's named toll revenue
  body: RWE and Vattenfall are the only two named production toll counterparties disclosed across all public sources reviewed, concentrating counterparty risk in a way that is structurally similar across the customer, financing, and revenue-model risk categories.
  claimRefs:
  - CR029
- calloutType: risk
  title: Merchant-revenue cannibalization is a documented, quantified sector trend
  body: Independent analyst modeling projects two-hour battery arbitrage revenue in Germany falling from about EUR86,000/MW today to as low as EUR12,000/MW under aggressive 2030 build-out scenarios, directly pressuring any merchant-exposed share of terralayr's portfolio.
  claimRefs:
  - CR036
- calloutType: assumption
  title: Absence of disclosed safety/cyber incidents is treated as an evidence gap, not a clean record
  body: No public source discloses any fire, thermal-runaway, safety-enforcement, ISO 27001/SOC2 certification, or cybersecurity-incident history specifically involving terralayr. This chapter treats that silence as an unresolved diligence item rather than inferring compliance or a clean safety record.
  claimRefs:
  - CR021
  - CR026
- calloutType: recommendation
  title: Prioritize grid-connection and financial-disclosure diligence
  body: The two highest-value diligence asks are (1) binding, non-appealable grid-connection confirmation for every disclosed ready-to-build/under-construction site, and (2) realized revenue, EBITDA, burn rate, and contracted-vs-merchant revenue split -- both currently undisclosed and both directly load-bearing for the investment thesis.
  claimRefs:
  - CR040
