- id: SO003
  title: Funding history and investor base
  body: terralayr's disclosed funding history spans two headline institutional rounds. In October 2024, the company raised approximately €77 million, split between €62 million of equity and €15 million of debt, led by RIVE Private Investment (whose participation benefited from EU InvestEU program backing) alongside Creandum, Earlybird Venture Capital, Norrsken VC, and Picus Capital; ESS News later referred to this as a 'Series C' round, while CEO Philipp Man told TechCrunch at the time that he 'wouldn't call it a seed round, but that's technically what it is' — a naming inconsistency this chapter preserves rather than resolves. In January 2026, terralayr closed a larger €192 million growth-equity financing, structured as an initial €112 million tranche plus an €80 million upsizing option, led by Eurazeo's Transition Infrastructure Fund (ETIF) — reportedly ETIF's ninth and final investment — with continued participation from RIVE, Creandum, Earlybird, Norrsken, and Picus Capital. Around the same period, terralayr also disclosed a separate roughly €60 million debt facility tied to its acquisition of full ownership of the Big Battery Deutschland (BBD) joint venture. Summing these disclosed figures suggests upward of €329 million in total raised capital, though no single source provides a reconciled lifetime-funding total, and ESS News explicitly states that terralayr's valuation was not disclosed as part of the January 2026 announcement — this chapter therefore leaves valuation as an explicit evidence gap rather than an invented figure. Notably, Creandum General Partner Johan Brenner sits directly on terralayr's board, linking one of its earliest institutional backers to formal governance.
