- id: SO005
  title: Regulatory risk and evidence gaps
  body: 'terralayr''s growth ambitions sit inside a German battery-storage market facing a significant systemic bottleneck. A November 2025 BDEW survey found that German transmission and distribution operators had received grid-connection requests for large-scale battery storage totalling more than 720 GW — over two and a half times Germany''s entire installed electricity generation capacity of 263 GW — against only around 2.6 GW of large-scale storage actually installed, a figure independently corroborated by law firm Rödl & Partner. Compounding this, Germany''s regulatory framework for battery storage remained unsettled entering 2026: a November 2025 Energy Industry Act amendment initially recognised BESS as privileged infrastructure, a subsequent Geothermal Energy Acceleration Act narrowed that privilege, and a December 2025 amendment to the KraftNAV ordinance removed large batteries from fast-track treatment pending a replacement connection procedure — prompting Energy-Storage.news to describe 2026 as a ''make-or-break year'' for German BESS. Clean Energy Wire, Rödl & Partner, and Energy-Storage.news each independently frame this queue-and-rule-change environment as a systemic execution risk directly relevant to terralayr''s own 8 GW pipeline ambitions. Beyond this sector-wide risk, several company-specific facts could not be verified from the source pack reviewed for this chapter and are recorded as explicit evidence gaps rather than invented: a reconciled lifetime-funding total and valuation; revenue, run-rate, and an aggregate customer count; and a fully reconciled board roster and governance/voting-rights structure, given the discrepancy between terralayr''s own four-director legal notice and North Data''s broader eight-member board listing. Each of these is flagged for direct follow-up with the company rather than assumed.'
