- id: SO002
  title: Leadership, founders, and governance
  body: 'terralayr was co-founded by CEO Philipp Man and COO Ludwig Wurlitzer, who together spent roughly a decade building CHRONEXT, a luxury watch marketplace, before turning to battery-storage flexibility; Man also previously worked on Glencore''s jet-fuel trading desk. The named executive bench also includes CFO Robin Cresswell (formerly Deutsche Bank''s Head of Infrastructure & Energy Americas and Head of Corporate Lending DACH), CTO Sam Boswell (previously at dare, Limejump, and Device Authority), CCO Mikko Preuß (promoted in April 2025 after being with the company since its earliest days, having previously worked at Siemens Wind Power, BCG''s Energy Practice, and as an investor at Picus Capital), and VP of Asset Development Valerie Mahar. Governance has visibly evolved since incorporation: the original December 2022 Swiss registration named Till Spillmann as the sole board member with individual signing authority, whereas terralayr''s current legal notice lists a four-person board comprising Philipp Man (President), Ludwig Wurlitzer, Creandum General Partner Johan Brenner, and Jochen Schwill — founder and former CEO of Next Kraftwerke, a virtual-power-plant operator sold to Shell in 2021 — who joined as a non-executive director on 13 November 2024. Lex Hartman, a former TenneT Germany board member and former CEO of Shell-ubitricity, joined the same month as Director and Senior Advisor. Notably, North Data''s automated registry aggregation lists a broader board of one chair and eight members for the Zug entity, which is not reconciled with the four directors named in terralayr''s own materials; given North Data''s stated automated-extraction caveat, this chapter treats the discrepancy as an open governance-transparency question rather than resolving it. Across every funding, partnership, and governance announcement reviewed, Philipp Man is consistently the sole quoted company spokesperson, indicating meaningful key-person concentration around the CEO.'
