chapter:
  number: 1
  title: Company Overview
  summary: terralayr is a Zug-incorporated, Berlin-operated battery-storage owner-operator and flexibility-as-a-service platform provider, founded in December 2022 per Swiss registration (though its own media kit says 2023), and led by CHRONEXT co-founders Philipp Man and Ludwig Wurlitzer. As of January 2026 the company had raised at least €77M (2024) plus €192M equity and ~€60M debt (2026), operated or was building over 150MW of German battery assets against an 8GW pipeline, employed roughly 50 people, and had signed utility tolling deals with RWE and Vattenfall — all set against a German BESS sector facing a 720GW grid-connection queue and unsettled 2025-2026 regulation.
sections:
- id: SO001
  title: Identity, headquarters, and business model
  body: terralayr is a battery-energy-storage owner-operator and flexibility-as-a-service platform provider founded around the German and Swiss markets. Its parent, terralayr AG, was formally incorporated as a Swiss stock corporation in the commercial register of the Canton of Zug on 6 December 2022, per statutes dated 25 November 2022, with an initial share capital of CHF 100,000 divided into 1,000,000 registered shares. terralayr AG is registered at Grafenauweg 8, 6300 Zug, Switzerland. Operations are carried out through a separate German entity, terralayr Germany GmbH & Co. KG, registered in Berlin under HRA 61696 B, with terralayr Germany Management GmbH acting as general partner and co-founder Ludwig Wurlitzer as managing director. Notably, terralayr's own current media kit states the company was 'founded in 2023,' which conflicts with both the 2022 Swiss registration date and the company's own October 2024 press release describing itself as 'established in 2022' — this chapter documents the discrepancy explicitly rather than silently picking one date. Commercially, terralayr develops, owns, and operates grid-scale battery storage systems in Germany, and separately runs a software platform called LAYR that virtualizes and monetizes battery capacity — both its own assets and third-party batteries — selling flexibility in durations from 15 minutes to 15 years. The company likens this to how AWS aggregates and resells cloud computing capacity. CEO Philipp Man has described terralayr's trading role as functioning 'more like an exchange' than a proprietary trader, matching battery capacity to the best available buyer rather than taking directional positions. Because a single institutional round has been characterized inconsistently as both a 'Series C' by trade press and 'technically a seed round' by the CEO himself, this chapter treats terralayr's financing stage and naming conventions as unsettled rather than asserting a definitive label.
