  evidenceGaps:
  - id: GO001
    topic: capital-disclosure-reconciliation
    severity: material
    type: private-evidence-only
    missingEvidence: A single, company-confirmed lifetime-funding total and valuation figure; public sources give per-round amounts (€77M in 2024, €192M plus a €60M debt facility in 2026) but no reconciled total or valuation.
    whyItMatters: Without a reconciled total or valuation, dilution, ownership stakes, and price-per-share trends across rounds cannot be assessed.
    diligencePath: Request a capitalization table and valuation history directly from terralayr or its investors during management diligence.
    relatedQuestionRefs:
    - QO015
    relatedTableRefs:
    - TO001
  - id: GO002
    topic: financial-and-customer-disclosure
    severity: material
    type: private-evidence-only
    missingEvidence: terralayr's revenue, run-rate/ARR, gross margin, and an aggregate customer or offtake-counterparty count; only three named tolling/partnership counterparties (RWE, Vattenfall, Stadtwerke Duisburg) were identified.
    whyItMatters: Revenue and customer concentration figures are core to assessing commercial traction and counterparty concentration risk for an asset-heavy energy business.
    diligencePath: Request management accounts, offtake-contract revenue schedules, and a full counterparty list from terralayr.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO001
  - id: GO003
    topic: governance-transparency-stakeholder-or-investor-map
    severity: material
    type: private-evidence-only
    missingEvidence: A reconciled board roster, board committee structure, and shareholder voting/veto rights; North Data's automated extraction shows 8 board members versus the 4 named in terralayr's own legal notice, and no source discloses committee structure or investor protective provisions.
    whyItMatters: Discrepancies in the disclosed board roster and the absence of voting/veto-rights detail limit assessment of investor control and governance concentration.
    diligencePath: Request the current shareholders' agreement, board committee charters, and an independently verified board roster from terralayr's counsel.
    relatedQuestionRefs:
    - QO028
    relatedTableRefs:
    - TO003
  - id: GO004
    topic: leadership-and-founder-table-coverage
    severity: minor
    type: enumeration-incomplete
    missingEvidence: An independently verified, complete organizational chart beyond the leadership and board roles named in terralayr’s own legal notice, media kit, and press releases.
    whyItMatters: Relying solely on company-published materials for the leadership roster risks omitting departed executives or understating reporting-line changes.
    diligencePath: Cross-check the leadership roster against LinkedIn, German commercial-register filings, and reference calls during deeper diligence.
    relatedTableRefs:
    - TO002
  - id: GO005
    topic: stakeholder-or-investor-map-coverage
    severity: minor
    type: enumeration-incomplete
    missingEvidence: A complete capitalization table and full list of commercial counterparties beyond the named institutional investors, board members, advisors, and three publicly announced utility/partner relationships.
    whyItMatters: The investor map presented here is necessarily limited to publicly disclosed relationships and may omit smaller investors, warrant holders, or undisclosed commercial counterparties.
    diligencePath: Request the full cap table and a complete counterparty/contract register from terralayr during commercial and legal diligence.
    relatedTableRefs:
    - TO003
