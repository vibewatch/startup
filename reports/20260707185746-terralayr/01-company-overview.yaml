callouts:
- calloutType: strength
  title: Investment-grade utility offtake de-risks the flexibility model
  body: Utility-grade tolling relationships with RWE, Vattenfall, and Stadtwerke Duisburg de-risk terralayr's virtualized flexibility model with investment-grade offtake counterparties.
  claimRefs:
  - CO045
  - CO046
  - CO047
- calloutType: risk
  title: Germany's grid-connection queue and shifting regulation threaten pipeline timing
  body: Germany's 720GW battery grid-connection queue and its shifting 2025-2026 regulatory framework (EnWG/GeoBG/KraftNAV) create systemic execution risk for terralayr's 8GW pipeline.
  claimRefs:
  - CO048
  - CO049
  - CO050
- calloutType: assumption
  title: Founding-date and round-naming conflicts are preserved, not resolved
  body: terralayr's own materials are internally inconsistent on both founding date (2022 vs. 2023) and financing-round naming ('Series C' vs. 'technically a seed round'), so this chapter treats both as open conflicts rather than picking a single answer.
  claimRefs:
  - CO003
  - CO011
- calloutType: risk
  title: Founder concentration and an unreconciled board roster
  body: Public communications and governance disclosures show pronounced concentration around founder/CEO Philipp Man, with an unreconciled gap between the four-director legal notice and North Data’s broader eight-member board listing.
  claimRefs:
  - CO022
  - CO024
  - CO025
