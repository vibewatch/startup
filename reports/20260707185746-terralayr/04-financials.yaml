  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: gross-margin-split-disclosure
    missingEvidence: A breakdown of terralayr's gross margin or cost-of-dispatch separating platform (LAYR
      fee) economics from physical battery-asset-ownership economics.
    whyItMatters: Without this split it is impossible to tell whether terralayr's economics behave like
      an asset-light software platform or a capital-intensive independent power producer, which materially
      changes valuation approach and risk profile.
    diligencePath: Request management accounts or a cost-of-dispatch/opex breakdown segmented by revenue
      stream (tolling, merchant, VBA/platform fee) directly from terralayr.
    relatedQuestionRefs:
    - QI041
    - QI023
  - type: private-evidence-only
    severity: material
    topic: churn-retention-disclosure
    missingEvidence: Net revenue retention, renewal rate, or churn data for terralayr's Designated Optimisers
      and third-party asset owners onboarded to LAYR.
    whyItMatters: 'terralayr''s own ''switch in a day'' low-lock-in pitch is a double-edged signal: it
      could support customer trust or could equally mask high churn; without retention data, GTM durability
      cannot be assessed.'
    diligencePath: Request cohort retention or churn metrics for third-party assets and Designated Optimisers
      onboarded to LAYR over the past 12-24 months.
    relatedQuestionRefs:
    - QI042
    - QI016
  - type: private-evidence-only
    severity: minor
    topic: debt-interest-margin-disclosure
    missingEvidence: The realized interest margin or coupon on terralayr's €49 million senior secured
      term loan, versus the generic 4-6% German BESS project-debt benchmark reported by Modo Energy.
    whyItMatters: Without the realized rate, it is not possible to confirm whether terralayr's debt was
      priced in line with, better than, or worse than typical German BESS project finance terms.
    diligencePath: Request the credit agreement's pricing grid or an investor summary of the effective
      interest rate from terralayr or its lenders (ABN AMRO/Commerzbank).
