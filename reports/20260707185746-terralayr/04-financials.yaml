- id: capital-adequacy-financing-dependency
  title: Capital Adequacy & Financing Dependency
  body: 'terralayr''s capital adequacy picture is built entirely from financing-event announcements rather
    than balance-sheet disclosure: no source reviewed discloses cash on hand, monthly burn, or runway
    in months. The two largest disclosed capital events are a €192 million growth-equity round (including
    an €80 million upsizing option), led by Eurazeo through its Transition Infrastructure Fund and announced
    19 January 2026 with RIVE Private Investment, Creandum, Norrsken, Earlybird and Picus Capital re-investing,
    and a €60 million senior secured debt facility (a €49 million term loan plus €11 million of additional
    facilities) alongside a €100 million accordion facility for further pipeline projects, structured
    as a seven-year mini-perm with ABN AMRO and Commerzbank as Mandated Lead Arrangers. Both facilities
    are referenced together in terralayr''s own BBD joint-venture announcement as the capital base for
    its 2026 growth strategy, and the disclosed planned use of funds is to expand the German asset portfolio,
    scale the LAYR platform, and consolidate greenfield development — but no specific budget split across
    these uses, and no explicit next-financing-round trigger or target amount, is disclosed. The accordion
    facility is also conditional (''subject to agreed criteria''), not automatically available. Set against
    terralayr''s disclosed ~8GW secured development pipeline, only its 112MW/238MWh debt-financed tranche
    (about 1.4% of the pipeline) currently carries committed project debt, implying substantial further
    financing will be required to convert the broader pipeline into operating, revenue-generating assets.'
