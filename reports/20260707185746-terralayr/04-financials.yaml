callouts:
- calloutType: risk
  title: Every terralayr-specific unit-economics figure in this chapter is either undisclosed or a single,
    unaudited company claim
  body: No public source discloses terralayr's realized toll price, merchant yield, VBA take-rate, cost
    of debt, O&M cost per MW, or gross margin; the only unit-economics data point terralayr discloses
    itself is the unaudited €4,000/MW/year 'netting-off' saving claim, which cannot be independently verified.
  claimRefs:
  - CI006
  - CI010
  - CI023
  - CI026
- calloutType: insight
  title: terralayr's own debt-financed portfolio sits below the market's typical bankability threshold
    for contracted revenue
  body: Independent sources describe German project lenders as typically requiring 60-100% of BESS revenue
    to be contracted before committing debt, yet terralayr's own 112MW/238MWh debt-financed portfolio
    is only about 49% tolled (55MW of 112MW) — implying its portfolio-level diversification and sponsor
    strength, not contracted-revenue depth alone, supported financial close.
  claimRefs:
  - CI005
  - CI018
  - CI019
  - CI035
- calloutType: assumption
  title: Capital adequacy is demonstrated entirely through financing-event cadence, not disclosed cash
    position
  body: terralayr's apparent financial strength rests on the announcement cadence of two large capital
    events (a €192M equity round and a €60M-plus-€100M-accordion debt facility) within an 18-month window;
    no source discloses cash on hand, burn rate, or runway, so 'well-capitalized' should be read as 'well-financed
    to date,' not as evidence of self-sustaining unit economics.
  claimRefs:
  - CI029
  - CI030
  - CI032
  - CI038
