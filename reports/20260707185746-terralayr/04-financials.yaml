  title: Financials
  summary: terralayr discloses no public revenue, ARR, gross margin, CAC, churn, or cash-runway figures;
    its financial profile is instead evidenced through a diversified tolling/merchant/VBA revenue model,
    market-benchmark unit economics (since no realized company-specific pricing is disclosed), and a cadence
    of large financing events — a €192M Jan 2026 growth-equity round and a €60M-plus-€100M-accordion senior
    secured debt facility — that demonstrate financing execution capability but not independently verifiable
    underlying unit economics.
sections:
- id: revenue-streams-pricing-monetization
  title: Revenue Streams, Pricing & Monetization
  body: 'terralayr commercializes its German battery storage portfolio through three named mechanisms
    that all run through its LAYR software platform: contracted tolling with creditworthy counterparties,
    merchant optimisation via a multi-optimizer ''ETF'' model, and Virtual Battery Auctions (VBA), a shorter-term
    marketplace layer. On the company''s own 112MW/238MWh, nine-project, debt-financed portfolio, 55MW
    (about 49%) is secured under a seven-year Vattenfall capacity toll while the remaining 57MW (about
    51%) is commercialised on a merchant basis. Beyond that specific portfolio, terralayr also holds a
    separate 50MW/100MWh, five-year RWE toll, an ENGIE ''Mini Toll'' short-term framework signed in May
    2025, and a Stadtwerke Duisburg Energiehandel partnership combining a short-term tolling framework
    with VBA access, under which the two parties target joint management of more than 100MW. terralayr
    states that only six tolling agreements have been signed in the entire German market to date, and
    that it is party to half of them, an unusually concentrated position if the underlying Aurora Energy
    Research count is accurate. Pricing evidence is limited to market-wide ranges rather than terralayr-specific
    realized figures: tolls are said to typically price between €110,000 and €150,000 per MW per year,
    while the wider German day-ahead merchant benchmark averaged roughly €85,000 per MW per year in 2025.
    No realized toll price, merchant yield, or VBA take-rate specific to terralayr has been disclosed
    publicly.'
