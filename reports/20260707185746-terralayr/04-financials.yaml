- id: gtm-sales-efficiency-public-traction
  title: GTM Motion, Sales Efficiency Proxies & Public Traction Gaps
  body: 'terralayr''s go-to-market motion targets three named customer segments — municipal utilities,
    national/international utilities, and BESS owners & investors — each addressed with a dedicated page
    framed around risk reduction and revenue uplift rather than disclosed pricing tiers. In place of a
    disclosed customer acquisition cost, sales-cycle length, or payback period, terralayr foregrounds
    a switching-cost argument: BESS owners are told they can switch optimisers ''in just one day'' with
    no lock-in, positioning flexibility itself as the primary sales lever. terralayr''s own account of
    a February 2025 industry panel is more candid about market friction than its press releases, noting
    that ''despite lots of curiosity from developers, asset managers, and off-takers, few deals have been
    signed in Germany so far'' on tolling, and that small or mid-sized standalone assets struggle to find
    competitive offers — evidence of a slow, relationship-driven enterprise sales cycle rather than a
    self-serve motion. The only quantified public-traction proxies are physical capacity figures (50MW-plus
    ''live'' with 100MW more expected ''in the very near future,'' per the CEO around the €192M raise)
    rather than revenue, ARR, GMV, or active-user metrics; the company states a growing share of capacity
    is expected to come from third-party assets over time, but discloses no current owned-versus-third-party
    percentage split, leaving this platform-traction claim unverifiable from public sources.'
  claimRefs:
  - CI011
  - CI012
