callouts:
- calloutType: strength
  title: Favorable near-term merchant and tolling economics
  body: 2025 German day-ahead spreads (~EUR85k/MW/year, 85% above Great Britain) and a market-wide shift toward heavily tolled capacity (80-100% in Germany) currently support both merchant and tolled BESS revenue cases and improve financeable leverage.
  claimRefs:
  - CM020
  - CM039
  - CM038
- calloutType: risk
  title: Order-of-magnitude gap between the connection queue and installed capacity
  body: Germany's 720GW pending large-scale connection-request queue dwarfs the ~2.6GW actually installed and terralayr's own ~8GW secured pipeline, and even BDEW's and the TSOs' own figures for the size of that queue disagree by roughly 3x, underscoring how much of the addressable market may never convert to revenue.
  claimRefs:
  - CM014
  - CM017
  - CM018
  - CM035
- calloutType: assumption
  title: Company-disclosed pipeline and asset figures are treated as unaudited management claims
  body: terralayr's own disclosed 8GW pipeline, ~200MW ready-to-build, and ~150MW operating/under-construction figures are company-claimed rather than independently audited; TechCrunch's earlier 2024 snapshot (7MWh live, 40MWh imminent, 200+ sites/7GW+ agreements) is broadly consistent in order of magnitude but was also sourced from company disclosure.
  claimRefs:
  - CM021
  - CM022
- calloutType: insight
  title: Tolling remains a nascent, highly concentrated segment of the German BESS market
  body: Per Aurora Energy Research as cited by terralayr, only six tolling agreements existed in the German market at time of citation, of which terralayr itself had signed three, indicating terralayr holds an outsized share of a still-emerging structure rather than competing in a mature, fragmented segment.
  claimRefs:
  - CM009
  - CM010
  - CM011
