- id: buyer-user-payer-segmentation
  title: Buyer, User, and Payer Segmentation
  body: 'terralayr explicitly segments its go-to-market into three buyer groups: municipal utilities (Stadtwerke), national/large utilities, and BESS owners and investors. Each segment shows a distinct buyer-user-payer split. For national utilities, RWE Supply & Trading agreed in May 2025 to market a virtual 50MW/100MWh battery from terralayr for five years starting 2026, and Vattenfall separately announced a 55MW, seven-year partnership in 2025 that by 2026 had expanded into staged nationwide marketing of terralayr''s battery network, ramping from an initial 5MW tranche toward the full 55MW; in both cases the utility''s trading/commodity-origination desk is both the buyer of the toll and the payer of the toll premium. For municipal utilities, Stadtwerke Duisburg Energiehandel agreed to use the terralayr platform to manage a portfolio targeted to grow beyond 100MW, with the municipal trading desk again acting as both user and payer. For BESS owners and investors, terralayr markets directly on the basis of low switching cost, allowing owners to change optimizers within a single day based on real-time performance, with the asset owner''s own asset-management budget as payer. Entrix, positioning itself as ''Europe''s leading flexibility trader'' with 3GW of capacity under contract across five countries, directly competes for this same BESS-owner segment. Alternative payer/pooling structures are also emerging in the broader market: The Mobility House Energy and Electrohold announced a bankable tolling model with a 50MW minimum pool size and 90/10 or 80/20 splits, Engie and Return signed a 100MW long-term virtual flexibility purchase agreement, and the first grid-supportive BESS project (Wutzldorf, 5MW/25MWh) used Entrix for optimization, showing that grid-service-oriented dispatch is emerging as a distinct adoption trigger beyond pure price arbitrage or tolling revenue.'
