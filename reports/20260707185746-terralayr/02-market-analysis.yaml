chapter:
  number: 2
  title: Market Analysis
  summary: terralayr's addressable market is the optimization/dispatch layer for grid-scale battery storage in Germany, where a ~720GW connection-request queue (per BDEW) dwarfs the ~2.6GW actually installed and terralayr's own ~8GW pipeline, and multiple sizing lenses (EMMES 10, Modo Energy, BDEW, TSOs, Fraunhofer ISE) disagree by up to 3x rather than converging on one TAM.
sections:
- id: market-boundary-and-definition
  title: Market Boundary and Definition
  body: 'terralayr''s addressable market is the optimization, dispatch, and offtake-structuring layer for grid-scale battery energy storage systems (BESS) in Germany, not BESS hardware manufacturing, EPC construction, or behind-the-meter/residential storage. terralayr''s own LAYR platform virtualizes physical BESS assets owned by third parties and enables tailored offtake structures, including tolling and merchant combinations, sliced flexibly and auctioned through recurring Virtual Battery Auctions. Excluded but related segments include factory-built hardware supply (illustrated by Fluence''s Gridstack line), vertically-integrated utility-owned storage (illustrated by ENGIE''s 5.6GW owned-and-operated portfolio), and adjacent flexibility markets such as electric-vehicle-to-grid dispatch (The Mobility House, Nuvve) and broader decarbonization consulting (GreenFlex). Within this boundary, the tolling structure that terralayr specializes in remains a nascent, concentrated niche: per Aurora Energy Research as cited by terralayr, only six tolling agreements existed in the German market as of terralayr''s own publication, three of which terralayr itself had signed, at prices typically between EUR110,000 and EUR150,000 per MW per year. Modo Energy''s independent modeling of comparable toll-price thresholds (EUR95,000-EUR115,000 per MW per year, with gearing up to 75%) broadly corroborates the lower end of that range while diverging modestly at the upper end. Whether the market boundary should eventually widen to include emerging long-duration storage technologies as they reach commercial scale in Germany by 2030 remains an open question given the absence of public technology-specific market-boundary data.'
