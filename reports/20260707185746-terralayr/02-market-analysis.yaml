- id: sizing-and-adoption-diligence-gaps
  title: Sizing and Adoption Diligence Gaps
  body: Several material gaps limit how precisely terralayr's addressable market can be sized from public evidence alone. First, the roughly 3x discrepancy between BDEW's 720GW/78GW German large-scale queue figures and the four TSOs' own reported 250GW/nearly-700-request figures has not been reconciled by any source found in this research, and materially changes how binding the grid-connection bottleneck should be judged to be. Second, SolarPower Europe's European Battery Market Outlook 2026-2030, a potential third independent forecaster, could not be accessed because its detail page is gated behind an interactive JavaScript dataset viewer that returns no readable market-sizing text. Third, the EU Joint Research Centre's storage policy-and-regulatory-framework page returned an HTTP-level access rejection rather than page content, blocking direct verification of EU-level regulatory framing. Fourth, Fraunhofer ISE's capacity-need figures (104GWh by 2030, 180GWh by 2045) are only available via a secondary news citation rather than the institute's own primary publication. Fifth, Aurora Energy Research's count of six existing German tolling deals, three of them terralayr's own, is sourced only through terralayr's self-citation and has not been independently verified. Finally, no independently-sourced, bottom-up services-revenue TAM specific to the BESS optimization/tolling layer itself could be located; every retained sizing lens proxies the opportunity via connection-request queues, installed-base figures, or capacity-need forecasts rather than a services-revenue estimate. These gaps are preserved explicitly, rather than smoothed into a single confident market-size number, because the underlying public evidence base for this market is genuinely contested and incomplete.
  claimRefs:
  - CM043
  - CM044
