- id: TM004
  title: Growth drivers and adoption constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - 720GW grid-connection request queue (~9x peak load)
    - constraint
    - current, worsening through 2026
    - Grid operators cannot process or connect the full queue; most requests will never become installed capacity
    - Request terralayr's own queue position and expected connection dates per project
  - - Grid-fee exemption expiring August 2029
    - driver (near-term), constraint (post-2029)
    - now through Aug 2029, then reversing
    - Front-loads incentive to connect capacity before the exemption lapses, then removes a cost advantage
    - Confirm what share of terralayr's pipeline is expected to reach connection before Aug 2029
  - - EnWG Section 17(2b) flexible/curtailable connections
    - driver
    - current, phasing in through 2026
    - Could accelerate connection of queued capacity by allowing curtailable, lower-priority grid access
    - Assess whether terralayr's pipeline sites qualify for flexible connection terms
  - - Rising tolled-capacity share (70-100% tolled, Germany clustering 80-100%)
    - driver
    - current, 2025-2026
    - Improves project bankability and debt gearing (up to 75%), easing capital-intensity constraint
    - Verify terralayr's own toll/merchant mix versus the 80-100% market cluster
  - - Elevated day-ahead spreads (~EUR85k/MW/yr, 2025)
    - driver
    - current, subject to reversal if spreads compress
    - Supports both merchant and tolled economics; a compression in spreads would weaken the growth case
    - Stress-test terralayr's revenue model against a spread-compression scenario
  - - Counterparty/bankability risk and stable-revenue difficulty (per industry experts)
    - constraint
    - current, structural
    - Limits how much capacity financiers will fund without a creditworthy tolling counterparty
    - Review credit quality and contract terms of terralayr's toll counterparties (RWE, Vattenfall)
  - - Capital intensity of scaling a multi-GW pipeline (EUR77M 2024, EUR192M subsequent raise)
    - constraint
    - current, recurring financing need
    - Growth pace is gated by terralayr's ability to keep raising equity/debt ahead of pipeline conversion
    - Request terralayr's forward capital plan versus pipeline conversion milestones
  notes: Directionality reflects the balance of evidence found; several items (grid-fee exemption, EnWG flexible connections) act as both near-term drivers and longer-term constraints depending on timing, as noted in the Timing column.
