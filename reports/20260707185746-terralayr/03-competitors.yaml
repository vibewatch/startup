  - - ENGIE
    - 'Incumbent: vertically-integrated utility owner-operator'
    - 5.6GW in operation/under construction across 12 countries (30 Jun 2025); 95GW 2030 renewables-and-storage target
    - Utility-owned/self-financed storage portfolios
    - Balance-sheet scale, multi-country footprint
    - Owns/operates rather than optimizing third-party assets; not a route-to-market for outside BESS owners
  - - Fluence
    - 'Incumbent/adjacent: public hardware-plus-software BESS system integrator'
    - Publicly traded (SEC filer, CIK 1868941); S&P Global Tier 1 Cleantech Company 2025
    - Utilities, data centers, industrial BESS buyers
    - Public capital-markets access; Smartstack hardware+software bundle
    - Upstream hardware/EPC layer, not a dispatch-optimization platform for third-party assets
  - - The Mobility House Energy
    - 'Adjacent/direct: EV V2G plus battery marketing'
    - Active smart-charging, V2G, and battery-marketing business units; Electrohold-backed bankable tolling model; 2.5GWh Bulgaria co-location deal
    - EV fleets, charge point operators, BESS co-location owners
    - Cross-sell from EV-charging customer base; balance-sheet-backed tolling via Electrohold
    - Core business is EV charging, not grid-scale standalone BESS; also a terralayr Designated Optimiser
  - - suena energy
    - 'Direct: BESS optimizer (terralayr Designated Optimiser)'
    - Not disclosed; official solution page returned an empty/blocked fetch
    - BESS owners/investors
    - Named as one of terralayr's top-tier onboarded optimizers
    - No independently verifiable public scale or pricing data
  - - Akaysha Energy (BlackRock)
    - 'Likely entrant: capital-backed developer via joint venture'
    - AUD300M (~$217.8M) debt facility (Sep 2025, 5-bank syndicate); JV with Copenhagen Energy
    - Institutional/large-scale BESS project financing
    - Deep-pocketed sponsor; imports Australian virtual-toll and capacity-swap structures
    - New to German market; no disclosed live German MW yet
  - - Return
    - 'Direct/likely entrant: cross-border BESS flexibility aggregator'
    - 100MW ENGIE vFPA, described as largest fully fixed-price vFPA in Europe to date
    - Large offtakers (e.g. ENGIE) seeking green power flexibility
    - Proprietary aggregation technology; expanding into Netherlands, Belgium, Spain
    - Single marquee deal disclosed; no disclosed Germany-specific fleet size
  notes: Scale/funding figures are each company's own disclosure (site content, press release, or an interview quote) except Fluence's public-filer status and Akaysha's bank syndicate, which are independently reported; no audited cross-competitor comparison exists.
