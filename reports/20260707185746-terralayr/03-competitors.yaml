- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Capacity-virtualization "Virtual Battery" middleware and tech-agnostic dispatch API
    - Middleware pattern is not shown to be patent-protected and could be replicated by well-funded developer-operators building their own dispatch software (e.g. Kyon Energy, Akaysha Energy)
    - material
    - Request evidence of IP protection, technical lead time, or switching-cost data versus competitor in-house software builds
  - - Ecosystem convening (BATCON-2 conference, Designated Optimiser network of Entrix/suena energy/The Mobility House Energy)
    - Soft-power/brand moat only; no disclosed exclusivity preventing Designated Optimisers from serving BESS owners directly outside LAYR
    - material
    - Request exclusivity, revenue-share, or minimum-volume terms (if any) in Designated Optimiser agreements
  - - Outsized share (3 of 6) of nascent German tolling deals per terralayr's Aurora Energy Research citation
    - Extremely small base; one or two additional competitor wins (Akaysha Energy, Kyon Energy, Return) would materially dilute terralayr's share
    - blocking
    - Independently verify Aurora Energy Research's six-deal count and monitor future German tolling-deal announcements
  - - Named national-utility offtake proof (RWE, Vattenfall)
    - Utilities could build internal platforms or contract directly with Entrix or Return instead of renewing with terralayr
    - material
    - Request contract renewal terms/length and evidence of utility multi-sourcing intentions
  - - Low advertised switching cost / no lock-in for BESS owners
    - The same feature that attracts owners to LAYR makes it equally easy for owners to leave LAYR for a rival aggregator; by terralayr's own description this is not a durable retention moat
    - material
    - Request actual owner churn/retention data, not publicly disclosed
  - - Capital access via bank debt facilities (EUR60M plus EUR100M accordion)
    - Materially smaller and less diversified than Akaysha Energy's five-bank AUD300M facility or ENGIE's/Fluence's balance-sheet and public-market scale
    - material
    - Compare cost of capital and facility-size growth trajectory over successive raises
  - - Global BESS hardware commoditization (Chinese integrators' reported 76% global share in 2025)
    - Falling hardware costs lower barriers to entry for new developer-operators that could enter the optimization layer terralayr occupies
    - minor
    - Monitor whether falling hardware costs increase the rate of new entrant developer-operators specifically in Germany
  notes: Severity reflects this report's evidence-based judgment, not a company-disclosed risk rating; the tolling-deal-count row is rated blocking because the underlying six-deal figure is only sourced via terralayr's own citation of a third party.
