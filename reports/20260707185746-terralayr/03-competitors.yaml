  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: competitor-market-share-verification
    missingEvidence: An independently audited comparison of market share, win-rate, or client counts among terralayr, Entrix, Kyon Energy, The Mobility House Energy, and other named competitors; all figures cited in this chapter are self-reported by each company on its own website or in a company interview.
    whyItMatters: Without third-party verification, terralayr's relative competitive position versus Entrix and Kyon Energy cannot be independently benchmarked, only compared on each company's own disclosure.
    diligencePath: Commission an independent market-share study, for example via Modo Energy, Aurora Energy Research, or a paid BESS-market-intelligence subscription, covering named optimizer and tolling competitors in Germany.
    relatedQuestionRefs:
    - QP028
  - type: access-blocked
    severity: minor
    topic: suena-energy-competitor-profile
    missingEvidence: suena energy's official solution page, which returned an empty, blocked extraction, so its scale, pricing, and customer base could not be verified beyond its role as a named Designated Optimiser on terralayr's own platform.
    whyItMatters: suena energy is one of only three named optimizers in terralayr's ETF model; without its own disclosed scale, the competitor-profile and positioning-map placements for suena energy rest on the weakest evidence base in this chapter.
    diligencePath: Retrieve suena energy's page via an alternate rendering method or contact the company directly for its scale and pricing disclosures.
    relatedQuestionRefs:
    - QP004
  - type: missing-source
    severity: material
    topic: tolling-deal-count-verification
    missingEvidence: Aurora Energy Research's own report or dataset showing the six existing German tolling agreements referenced by terralayr, currently available only via terralayr's self-citation of the figure.
    whyItMatters: The three-of-six-deal share underlying terralayr's outsized tolling-market position, and this chapter's moat-durability register, rests entirely on a self-serving citation of a third party rather than an independently accessible report.
    diligencePath: Obtain Aurora Energy Research's underlying report or subscription data directly to confirm the six-deal count and terralayr's three-deal share.
    relatedQuestionRefs:
    - QP027
  - type: private-evidence-only
    severity: material
    topic: cross-competitor-pricing-comparability
    missingEvidence: Standardized, directly comparable EUR-per-MW-per-year pricing disclosures from Entrix, Kyon Energy, ENGIE, and Fluence equivalent to terralayr's own disclosed toll-pricing range.
    whyItMatters: Without competitor pricing, terralayr's EUR110,000-150,000/MW/year toll range cannot be benchmarked against rivals from public evidence alone, leaving the pricing-packaging comparison table only partially comparable.
    diligencePath: Request competitor pricing or quote sheets directly, or obtain customer-side RFP benchmarking data during diligence.
    relatedQuestionRefs:
    - QP013
  - type: private-evidence-only
    severity: minor
    topic: designated-optimiser-partnership-terms
    missingEvidence: The contractual terms, such as exclusivity, revenue share, or minimum-volume commitments, between terralayr and its named Designated Optimisers (Entrix, suena energy, The Mobility House Energy).
    whyItMatters: Without these terms, it is not possible to assess how durable terralayr's ecosystem-convening moat is versus the risk that any Designated Optimiser could exit the platform or serve BESS owners directly outside it.
    diligencePath: Request the Designated Optimiser agreement terms directly from terralayr or its named partners during diligence.
    relatedQuestionRefs:
    - QP022
    - QP023
