- calloutType: risk
  title: terralayr's switching-cost pitch is a double-edged sword for platform lock-in
  body: terralayr markets one-day, no-cost optimizer switching as a customer benefit, but the same design that makes LAYR attractive to BESS owners also makes it trivial for an owner to leave LAYR for a rival aggregator, and it commoditizes the value of any single named optimizer partner plugged into the platform.
  claimRefs:
  - CP031
  - CP032
  - CP036
- calloutType: insight
  title: Two of terralayr's three named optimizer partners are also its direct competitors
  body: Entrix and The Mobility House Energy are simultaneously onboarded "Designated Optimisers" inside terralayr's own ETF model and independently marketed, full-service optimization providers on their own websites, meaning BESS owners are not dependent on terralayr's platform to reach either company.
  claimRefs:
  - CP006
  - CP022
  - CP034
  - CP041
- calloutType: strength
  title: terralayr shows broader capital-access and ecosystem-building signals than smaller pure-play optimizers
  body: terralayr's EUR60M-plus-EUR100M-accordion debt facility, its own industry conference (BATCON-2), and independent recognition as one of three battery-storage software innovators in Energize Capital's Electrify Everything Top 30 collectively exceed what Entrix, Kyon Energy, or suena energy disclose publicly.
  claimRefs:
  - CP024
  - CP026
  - CP027
- calloutType: assumption
  title: Every competitor scale figure in this chapter is self-reported and unaudited
  body: Pipeline, project-count, trades-per-day, and capacity-under-contract figures for terralayr, Entrix, Kyon Energy, ENGIE, and other named competitors all originate from each company's own website, press release, or interview; no independently audited cross-competitor comparison could be located.
  claimRefs:
  - CP003
  - CP006
  - CP039
