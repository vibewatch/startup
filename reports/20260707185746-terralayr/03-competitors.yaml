- id: capability-pricing-and-gtm-comparison
  title: Capability, Pricing, and GTM/Distribution Comparison
  body: >-
    terralayr discloses a specific toll-pricing range (EUR110,000-150,000 per
    MW per year for 5-7 year, sometimes up to 10-year, contracts), which
    aligns in order of magnitude with Modo Energy's independently modeled
    ~EUR85,000/MW/year day-ahead-spread economics underlying German BESS
    deals; none of Entrix, Kyon Energy, ENGIE, or Fluence publishes a
    comparable EUR/MW/year figure on its own official site, leaving
    cross-competitor pricing only partially comparable from public evidence.
    terralayr's differentiated commercial structure is its "Enhanced Trading
    of Flexibility" (ETF) model, which lets three named third-party optimizers
    — Entrix, suena energy, and The Mobility House Energy — trade the same
    physical battery in parallel via one-click capacity reallocation, a
    structure terralayr says generates "netting-off" savings of up to
    roughly EUR4,000 per MW per year in reduced wear versus single-optimizer
    dispatch. On distribution and GTM, terralayr closed a EUR60 million senior
    secured portfolio debt facility (plus a EUR100 million accordion) with
    ABN AMRO and Commerzbank and convenes its own industry conference
    (BATCON-2, Munich) drawing developers, investors, utilities, traders, and
    policymakers — ecosystem-building activity not disclosed by Entrix or
    Kyon Energy. Fluence's public-company status, evidenced by SEC EDGAR
    filings and S&P Global's Tier 1 Cleantech Companies recognition, gives it
    materially broader capital-markets access than any privately held
    competitor named here, while Akaysha Energy's AUD300 million,
    five-bank debt syndicate is larger and more diversified than terralayr's
    own two-bank facility. Independent third-party recognition (Energize
    Capital naming terralayr one of only three battery-storage software
    innovators of 30 across all electrification sectors) is the only
    external validation of terralayr's software-platform positioning located
    in public sources.
