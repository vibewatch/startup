- id: switching-cost-lock-in-and-partner-access
  title: Switching Cost, Lock-In, Multi-Homing, and Partner/Distribution Power
  body: >-
    terralayr's own marketing explicitly sells low switching cost as a
    differentiator: its BESS-owner materials promise owners can "switch,
    scale, and earn more" by "switching optimisers in just one day based on
    real-time performance," and its LAYR product page states the
    multi-optimizer model carries "no lock-in" and "no switching cost." Its
    municipal-utility materials go further, describing "external optimisers
    as a fallback option" within its own platform — meaning terralayr
    explicitly multi-homes its municipal customers across third-party
    optimizers rather than requiring exclusive use of any single trading
    desk. This cuts both ways as a moat: because terralayr's own platform is
    built to make individual optimizers interchangeable and comparable in
    real time, the same design that attracts BESS owners to LAYR also makes
    it easy for an owner to leave LAYR for a rival aggregator, and it
    commoditizes the value of any single named optimizer partner plugged
    into it. Two of terralayr's three named "Designated Optimisers" — Entrix
    and The Mobility House Energy — independently market themselves on their
    own websites as full-service optimization/trading providers directly to
    BESS owners, meaning owners are not dependent on terralayr's platform to
    reach either partner; all named German BESS optimization and tolling
    competitors, including terralayr, Kyon Energy, Entrix, and Akaysha
    Energy, also operate under the same EnWG grid-connection regime and face
    the same August 2029 grid-fee exemption cliff, so no competitor holds a
    disclosed regulatory advantage.
