company:
  name: At-Bay
chapter:
  number: 6
  title: Customers
  summary: >-
    At-Bay's customer evidence supports a broker-led SMB and mid-market wedge, with Forbes reporting 53,000+ small and midsize businesses while At-Bay's own 2025/2026 materials still cite roughly 40,000 insureds or businesses. Stance/MDR adoption is more concrete: Forbes reports growth from fewer than 1,000 customers in 2023 to 7,500 by year-end 2024, and official pages provide named MDR testimonials from Gradient Security, AI InsurTech, and Galahad Risk Advisors. The main diligence gap is durability: no public NRR, GRR, renewal, churn, NPS, or cohort data, and broker-only distribution plus price-sensitive switching create channel and retention friction.
sections:
  - id: segmentation
    title: SMB and mid-market segmentation
    body: >-
      At-Bay's core customer is the small or midsize business buying cyber insurance through an intermediary rather than a direct software checkout. Forbes' March 2026 profile says At-Bay provides cybersecurity insurance to more than 53,000 small and midsize businesses; At-Bay's own home page and Stance materials cite a platform powered by incident insights from 40,000+ insureds, and the July 2025 MXDR launch says At-Bay protects close to 40,000 U.S. businesses representing up to $800 billion in collective revenue. I treat the 53,000 figure as the most current independent customer-count marker and the 40,000 figure as a conservative company-disclosed base still present in official pages. The buyer is usually a CFO, owner, risk manager, or broker placing cyber coverage; the user expands to IT/security operators once Stance, MDR Endpoint, MDR Email, or MXDR is activated. At-Bay now spans SMB, lower mid-market, and larger businesses after raising Cyber and Tech E&O appetite to companies with up to $5 billion in revenue and limits up to $10 million.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Adoption trajectory and deployment scale
    body: >-
      The public adoption curve is strongest for Stance MDR rather than total policyholders. Forbes reports that At-Bay's detection product grew from fewer than 1,000 customers in 2023 to 7,500 customers by the end of 2024, reaching about $13 million in annualized revenue. At-Bay's official MDR launch in October 2023 positioned the product for SMBs, and CrowdStrike's January 2024 partnership announcement reinforced that the Falcon XDR-powered service targeted small-business cyber resilience. Adoption is pulled by the insurance bundle: At-Bay says adopting Stance MDR may unlock insurance premium credits and enhanced ransomware or financial-fraud limits, so expansion can occur at renewal or during broker-led risk remediation rather than only through a standalone security sale. The 2026 InsurSec Report adds scale context by analyzing more than 100,000 policy years and 6,500+ claims, indicating a meaningful longitudinal data asset even though At-Bay does not disclose active monthly users or deployment completion rates.
    claimRefs: [CU009, CU010, CU011, CU012, CU013, CU014, CU015, CU016]
    tableRefs: [TU002]
    figureRefs: [FU002]
  - id: customer-proof
    title: Named customer proof and broker proof
    body: >-
      At-Bay publishes named customer proof primarily for MDR rather than for insurance-policy deployments. Its official home page and MDR page quote Chris White, COO of Gradient Security, saying At-Bay MDR handles security operations end-to-end so his team can focus on the core business; they also quote the CTO of AI InsurTech calling the MDR experience excellent and Ben Beeson, CEO of Galahad Risk Advisors, saying the company onboarded quickly without disruption. These are useful named testimonials, but they prove Stance/MDR adoption and satisfaction more directly than policy renewal or insurance-loss outcomes. Broker proof is broader and more operational: the At-Bay Broker Platform page says submissions through the platform bind 35% faster than email, and Insurance Business recognized At-Bay as a broker-voted 5-Star Cyber Insurance Provider while quoting management on the value of combining insurance and security. Review-site coverage is sparse: SourceForge and Slashdot list At-Bay but show no substantive user-review base, and G2 was inaccessible to fetch because of a JavaScript/ad-block gate.
    claimRefs: [CU017, CU018, CU019, CU020, CU021, CU022, CU023, CU024, CU025]
    tableRefs: [TU003]
    figureRefs: [FU003]
  - id: retention-durability
    title: Retention, repeat usage, and gaps
    body: >-
      Public retention evidence is materially incomplete. At-Bay does not disclose net revenue retention, gross revenue retention, logo retention, broker renewal win rate, customer NPS, cohort renewals, or Stance churn. The best observable retention proxies are indirect: Stance tools are embedded into policyholder workflows, MDR can qualify customers for premium credits, and the platform monitors 1.5 million assets with a reported 15-minute mean time to remediate threats. A Spiceworks SMB user thread is the clearest adverse customer signal: an SMB manufacturing user reported that At-Bay's tools were impressive, but the company switched to a cheaper carrier after one year and lost the tools. That anecdote does not prove systemic churn, but it shows price sensitivity and bundle fragility when the insurance broker finds a cheaper alternative. The absence of published renewal cohorts keeps the retention case below enterprise SaaS diligence standards.
    claimRefs: [CU026, CU027, CU028, CU029, CU030, CU031, CU032, CU033]
    tableRefs: [TU004]
    figureRefs: [FU004]
  - id: expansion-concentration
    title: Expansion, concentration, and channel friction
    body: >-
      At-Bay's land-and-expand motion starts with broker-placed cyber insurance, adds Stance Core monitoring and advisory features, and then upsells MDR Endpoint, MDR Email, MXDR, higher limits, or broader Cyber/Tech E&O coverage. That logic is credible because the same incident data that supports underwriting also produces security alerts and remediation triggers for policyholders. The model remains channel-dependent: customers are instructed to contact their broker to add At-Bay Stance, the broker platform is the primary quote/bind workflow, and Sayata-style digital distribution partnerships reinforce the intermediary layer. Channel leverage lowers CAC and matches commercial-insurance buying behavior, but it also means At-Bay has less direct control over renewals than a pure SaaS vendor. Customer concentration appears low at the individual SMB policyholder level, but concentration risk shifts to broker relationships, reinsurance capacity, distribution platforms, and security-technology partners such as CrowdStrike and SentinelOne. The strongest next diligence step is to request broker-level production concentration, renewal cohorts by segment, Stance attach-rate cohorts, and loss-ratio deltas for MDR adopters versus non-adopters.
    claimRefs: [CU034, CU035, CU036, CU037, CU038, CU039, CU040, CU041, CU042]
    tableRefs: [TU005]
    figureRefs: []
