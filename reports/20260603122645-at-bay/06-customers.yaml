callouts:
  - calloutType: strength
    title: Named MDR testimonials are unusually concrete for an SMB cyber-insurance provider
    body: At-Bay names Gradient Security, AI InsurTech, and Galahad Risk Advisors on official pages, giving real customer proof for MDR deployment even though policyholder logos remain limited.
    claimRefs: [CU017, CU018, CU019]
  - calloutType: risk
    title: Customer-count definitions conflict across public sources
    body: Forbes' 53,000+ SMB figure is materially higher than the 40,000+ insured/business count still used in official At-Bay and Business Wire materials, so active-customer definitions must be reconciled in diligence.
    claimRefs: [CU001, CU002, CU003]
  - calloutType: risk
    title: Broker price shopping can unwind Stance engagement
    body: The Spiceworks user report that a company switched to a cheaper carrier after one year and lost At-Bay tools is a small but important signal of broker-mediated retention friction.
    claimRefs: [CU030, CU031, CU033]
