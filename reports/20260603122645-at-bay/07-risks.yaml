chapter:
  number: 7
  title: Risks
  summary: 'At-Bay''s public record reveals a complex but manageable risk profile centered on five interlocking concerns: a 2024 combined ratio of 102% that signals underwriting stress precisely when cyber insurance rates are declining; an Akira ransomware concentration that drove more than 40% of ransomware claims in 2025 and tests the actuarial models underpinning the entire program; a fronted-MGA structure dependent on Trisura Specialty and a five-reinsurer panel led by Munich Re in a market where systemic aggregation events remain underpriced; an Israel R&D center housing ~340 employees in an active conflict environment; and a softening competitive landscape where Coalition, Corvus, and traditional carriers are reducing pricing power. MDR execution and broker concentration are secondary but monitorable. The investment thesis survives if underwriting discipline tightens, MDR penetration accelerates, and the reinsurance panel holds—but three simultaneous adverse events in loss ratio, Akira persistence, and Israel disruption could challenge the program in the same renewal cycle.'
sections:
- id: risk-overview
  title: Risk overview and thesis-break framing
  body: 'At-Bay operates at the intersection of four risk domains that are individually manageable but collectively demanding. The first and most pressing is underwriting and loss-ratio risk: the FSLSO statutory filing for 2024 shows a combined ratio of 102%, losses of $29.2 million (up 96.7% year on year), and a negative cash flow from operations of $10.7 million—all against a backdrop of a premium portfolio that grew 345% in a single year. That growth rate compresses the seasoning time needed to validate loss assumptions, and it coincides with a US cyber market that recorded its first-ever premium decline of 7% in 2024. The second domain is systemic aggregation risk: the CrowdStrike outage demonstrated that a single vendor failure can trigger correlated claims across thousands of policies simultaneously, and At-Bay''s concentration in SMB cyber makes the exposure real. The third domain is legal and regulatory risk: LMA5567 war-exclusion litigation, multi-state surplus-lines compliance, and the SEC cyber-disclosure rule all impose obligations that a rapidly scaling MGA must absorb without a seasoned in-house regulatory team. The fourth domain is operational and people risk: Israel houses the bulk of At-Bay''s R&D, and the March 2026 layoffs of 25 engineers "in times of war" introduce execution and talent-retention uncertainty at precisely the moment MDR delivery is the primary competitive differentiator. A fifth domain—financial model and competitive risk—sits below the four primary concerns but is nonetheless real: if cyber rates continue declining, the MGA''s underwriting fee and profit commission compress, and competitors with deeper balance sheets or lower expense ratios can price more aggressively. The risk heatmap below places each domain by likelihood and impact severity. The mitigation and kill criteria table in the final section defines which events would make the thesis non-investable.'
