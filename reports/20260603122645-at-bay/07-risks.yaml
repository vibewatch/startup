  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reinsurance-treaty-terms
    missingEvidence: Specific reinsurance treaty terms, pricing, renewal notice periods, aggregate caps, and change-of-control provisions for At-Bay's five-reinsurer panel.
    whyItMatters: Reinsurance is the primary loss-absorption mechanism for a fronted MGA; adverse treaty terms at renewal could force premium reductions or net-risk retention that materially changes the investment thesis.
    diligencePath: Request reinsurance treaty summaries, renewal timeline, and Munich Re relationship terms from management; assess whether strategic-investor alignment creates any conflict on pricing or capacity terms.
    relatedQuestionRefs:
    - QR013
  - type: private-evidence-only
    severity: material
    topic: broker-distribution-concentration
    missingEvidence: Broker-by-broker contribution to DWP and renewal rate, top-10 broker concentration, and any exclusivity or most-favored-MGA clauses.
    whyItMatters: A shift in appointment preferences by a major wholesale broker could reduce At-Bay's submission flow materially within a single renewal cycle, compressing premium volume faster than new appointments can compensate.
    diligencePath: Request top-10 broker DWP concentration, historical renewal rates by broker cohort, and any contractual protections against broker defection.
    relatedQuestionRefs:
    - QR019
  - type: missing-source
    severity: material
    topic: state-regulatory-enforcement
    missingEvidence: State insurance department examination history, complaint ratios by state, NAIC market conduct scores, and any surplus-lines stamping deficiency notices for At-Bay Specialty Insurance.
    whyItMatters: Multi-state surplus-lines compliance failures can trigger fines, policy voidance, and loss of broker appointments; no enforcement history is publicly available in sources reviewed.
    diligencePath: Pull NAIC complaint database for At-Bay Specialty; request DOI correspondence log and compliance-counsel memo covering all 50 states.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: mdr-penetration-and-cohort-economics
    missingEvidence: MDR enrollment as share of total policy count and DWP, loss ratio comparison between MDR and non-MDR policyholders, and MDR renewal rates.
    whyItMatters: The MDR avoidance benefit is At-Bay's primary competitive differentiator; without penetration and cohort-loss data, investors cannot verify whether the Akira-avoidance claim scales across the full book or applies only to a small early adopter cohort.
    diligencePath: Request MDR enrollment metrics, cohort loss triangles, and renewal rate split between MDR and non-MDR policyholders.
    relatedQuestionRefs:
    - QR017
    - QR018
  - type: private-evidence-only
    severity: minor
    topic: israel-operations-resilience
    missingEvidence: Headcount by function pre- and post-March 2026 layoffs, critical-path analysis for MDR detection updates, and business-continuity plan for Israel office disruption.
    whyItMatters: With ~340 Israel staff, the concentration of R&D and threat-intelligence capabilities in an active conflict zone creates a single-point operational risk that is not adequately disclosed in public sources.
    diligencePath: Request Israel headcount map by function, confirmation of which MDR and underwriting-model roles were eliminated in March 2026, and status of any business-continuity or geographic-diversification plan for Israel engineering.
    relatedQuestionRefs:
    - QR015
    - QR016
