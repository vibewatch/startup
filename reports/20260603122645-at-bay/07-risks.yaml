  title: Regulatory / legal risk register
  enumeration: true
  enumerationScope:
    coverage: partial
    basis: 'This register enumerates regulatory and legal risks identified from public statutory filings, third-party legal case coverage, regulatory reports, and surplus-lines compliance guidance for the US cyber MGA sector in 2026. Direct state-level enforcement histories and private regulatory correspondence for At-Bay are not publicly available and are not reflected; the register is therefore partial rather than exhaustive.'
