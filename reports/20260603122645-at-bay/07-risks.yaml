callouts:
- calloutType: risk
  title: 'Primary diligence priority: clear the underwriting and reinsurance stack before committing to 2021 valuation'
  body: 'At-Bay''s combined ratio of 102% was produced in the same year that DWP grew 345%. Rapid premium growth can mask adverse loss development until later accident years emerge. The combination of 334% gross premium to surplus, negative operating cash flow, and a 121.3% debt-to-equity ratio means the program has limited internal shock absorption. Investors should require accident-year loss triangles, actuarial opinions, and a reinsurance treaty summary before treating the $1.35B 2021 benchmark as the current floor.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR023
  - CR024
- calloutType: recommendation
  title: Thesis-break threshold
  body: 'Three simultaneous adverse events would make the current valuation non-investable: (1) 2025 accident-year combined ratio above 105% confirmed in actuarial review; (2) MDR enrollment below 10% of total policyholders by end of 2026; and (3) Munich Re reprices reinsurance by more than 15% at next renewal. Any one alone is manageable; all three together indicate structural deterioration in underwriting economics, competitive moat, and capital access.'
  claimRefs:
  - CR001
  - CR008
  - CR011
  - CR027
  - CR036
