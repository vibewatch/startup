  rows:
  - - Combined ratio above 100% in growth year
    - FSLSO 2024 annual filing shows combined ratio 102%, losses $29.2M up 96.7%, gross premium to surplus 334.2%. Premium grew 345% in a single year.
    - High
    - High
    - AM Best affirmed A- Excellent stable in August 2025; Munich Re-led reinsurance panel absorbs tail.
    - Request management's combined ratio by accident year and by policy cohort; confirm that rapid growth has not impaired loss development patterns.
  - - Akira ransomware concentration
    - At-Bay InsurSec 2026 report states Akira drove >40% of ransomware claims in 2025. actuary.info notes concentration creates actuarial reserve modeling challenges. Zero MDR customers filed Akira claim.
    - High
    - High
    - MDR product delivers demonstrated Akira avoidance for enrolled policyholders; threat intelligence integration feeds underwriting decisions.
    - Quantify MDR penetration as share of total DWP; model loss ratio sensitivity if Akira shifts tactics or if MDR enrollment stalls.
  - - Systemic aggregation and outage event
    - CrowdStrike outage created $5.4B Fortune 500 exposure; Parametrix estimated $540M–$1.08B insured. Cabier Consulting 2026 flags aggregation as unpriced tail risk for cyber MGAs.
    - Medium
    - Critical
    - At-Bay focuses on SMB segment, which has lower single-policy limits than enterprise; reinsurance panel provides buffer.
    - Require management to disclose aggregate exposure to top 10 cloud and software vendors; review reinsurance treaty aggregation clauses.
  - - Reinsurer panel concentration and renewal risk
    - Howden Reinsurance 2025 report shows top 5 global cyber reinsurers hold 62% market share. Munich Re/HSB leads At-Bay panel of five. Reinsurance news confirms panel composition.
    - Medium
    - High
    - Munich Re is simultaneously a strategic backer through HSB and the lead reinsurer, aligning incentives in the short term.
    - Test whether Munich Re strategic relationship creates conflict-of-interest terms; model the impact of losing the lead slot at renewal.
  - - Cyber insurance rate decline and fee compression
    - NAIC confirms first-ever US cyber premium decline of 7% in 2024; WTW reports rates down 5% Q4 2024; Fitch says premium growth decelerating to single digits.
    - High
    - Medium
    - At-Bay continues to grow policy count in SMB segment where pricing discipline is stronger than enterprise.
    - Model revenue sensitivity to a sustained 3%, 5%, and 10% rate decline; confirm whether profit commission triggers still fire at 102% combined ratio.
  notes: 'Systemic aggregation is rated Critical in severity because a single large event could breach reinsurance treaties and generate net retention losses that are difficult to predict from public data.'
