- id: TR005
  title: Mitigation and kill criteria
  columns:
  - Risk domain
  - Monitorable trigger
  - Threshold or event
  - Investment implication
  rows:
  - - Underwriting and loss ratio
    - Combined ratio trend across consecutive accident years
    - Combined ratio exceeds 105% in 2025 accident year or loss development on 2024 book worsens materially from 102% at first report.
    - Treat underwriting model as impaired; require actuarial deep-dive and reinsurance treaty review before committing additional capital.
  - - Akira ransomware concentration
    - Akira share of ransomware claims as reported in subsequent InsurSec reports
    - Akira share rises above 50% or MDR enrollment fails to grow beyond 10% of total policyholders by mid-2026.
    - Thesis-breaking if both occur simultaneously; partial trigger reduces valuation premium for MDR differentiation.
  - - Reinsurance capacity and renewal
    - Munich Re renewal terms and panel participation rate
    - Munich Re reprices by more than 15% at next renewal or any panel reinsurer declines to renew; gross premium to surplus exceeds 350%.
    - Reduce position size; require management to demonstrate alternative reinsurance capacity before next capital event.
  - - Israel operations and MDR continuity
    - MDR detection update cadence and Israel headcount
    - Israel engineering headcount falls by more than 30% from March 2026 post-layoff level, or MDR detection update cycle lengthens by more than 60 days.
    - Reassess MDR competitive moat and adjust probability-weighted upside in the bull case.
  - - Cyber market pricing and revenue model
    - US cyber rate index and At-Bay gross premium growth
    - US cyber rates decline more than 10% in calendar year 2026 or At-Bay DWP growth turns negative year on year for two consecutive quarters.
    - Reframe as a distressed-growth MGA; require evidence of expense-ratio reduction or alternative revenue streams before retaining full position.
  notes: 'These kill criteria are monitoring tools, not automatic sell signals. Each threshold should trigger an accelerated diligence review rather than immediate exit, since context—management response, reinsurance backstop, competitive dynamics—determines whether the thesis is recoverable.'
