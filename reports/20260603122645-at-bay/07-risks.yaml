  rows:
  - - LMA5567 war exclusion litigation
    - Stryker 2026 cyberattack triggered coverage dispute testing LMA5567A/B exclusions; Iran-linked attribution contested by insurer and insured.
    - High
    - High
    - At-Bay policies include war exclusions consistent with Lloyd's mandate from March 2023 onward.
    - Track Stryker outcome; require management to disclose all open war-exclusion coverage disputes by policyholder count and total insured value.
  - - Multi-state surplus-lines compliance
    - At-Bay Specialty Insurance is non-admitted; FSLSO filing confirms Florida surplus-lines registration; multi-state stamping and premium-tax obligations apply in all 50 states.
    - Medium
    - High
    - Trisura fronting carrier structure delegates admitted-paper compliance obligations; surplus-lines brokers file state forms.
    - Request compliance matrix for all states, premium-tax payment records, and any DOI correspondence; confirm no outstanding stamping deficiencies.
  - - SEC cyber-disclosure rule spillover
    - SEC Rule 13e-3 cyber-incident disclosure obligations apply to At-Bay policyholders; disclosure events drive claims and may generate coverage disputes.
    - Medium
    - Medium
    - At-Bay InsurSec report tracks policyholder incident trends; company monitors claim types including regulatory-driven events.
    - Assess whether policy language keeps pace with SEC disclosure timing and scope; review any policyholder regulatory-notice claims filed in 2024–2026.
  - - NAIC systemic-concentration regulatory scrutiny
    - NAIC 2025 Cybersecurity Insurance Report flags insurer concentration in cyber as a systemic regulatory concern; At-Bay Specialty is confirmed in the report as an active US writer.
    - Medium
    - Medium
    - AM Best A- stable rating provides current solvency signal; Munich Re reinsurance panel mitigates concentration signal.
    - Monitor NAIC cyber working-group outputs; request management''s regulatory-dialogue log and any upcoming examination schedule.
  - - Nation-state attribution and coverage ambiguity
    - LMA5567 creates coverage grey zones when attackers are state-affiliated but attacks are not formally designated as acts of war by a government authority.
    - High
    - High
    - Lloyd's marketplace exclusion language aligns At-Bay with industry standard; standard is still being tested in courts.
    - Track emerging case law on CL380/LMA5567 attribution standards; quantify share of At-Bay policyholders in critical-infrastructure sectors that face higher war-exclusion exposure.
  notes: 'Severity reflects potential investment impact rather than base probability; residual exposure in the war-exclusion and attribution rows remains elevated because no court has definitively resolved LMA5567 scope as of run date.'
