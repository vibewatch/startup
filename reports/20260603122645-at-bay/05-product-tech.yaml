  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: reinsurance-capacity
      missingEvidence: >-
        At-Bay's reinsurance panel composition, reinsurance limits, and capital capacity supporting
        ten-million-dollar policy limits for businesses with up to five-billion-dollar revenue.
      whyItMatters: >-
        Reinsurance capacity is a binding constraint on At-Bay's ability to deliver the policy limits it
        advertises to mid-market buyers; a capacity withdrawal or reinsurer dispute would directly limit
        product availability.
      diligencePath: >-
        Request reinsurance program details directly from At-Bay management; review AM Best or S&P carrier
        rating filings for reinsurance dependency disclosures; check NAIC financial filings for At-Bay's
        admitted carrier.
      relatedQuestionRefs:
        - QE017
    - type: enumeration-incomplete
      severity: minor
      topic: competitive-positioning
      missingEvidence: >-
        A systematic side-by-side comparison of At-Bay InsurSec bundling economics versus stand-alone cyber
        insurers (e.g., Coalition, Cowbell, Resilience) including price per dollar of coverage and security
        feature parity at each tier.
      whyItMatters: >-
        Without a rigorous comparison, At-Bay's claimed InsurSec differentiation cannot be fully benchmarked
        against the market, limiting confidence in the competitive moat assessment.
      diligencePath: >-
        Obtain broker market quotes from At-Bay, Coalition, Cowbell, and Resilience for identical risk profiles;
        compare Stance tier features against Coalition Paladin and Cowbell's security services documentation.
      relatedQuestionRefs:
        - QE022
    - type: enumeration-incomplete
      severity: minor
      topic: mxdr-benchmarking
      missingEvidence: >-
        A technical comparison of At-Bay MXDR (SentinelOne Singularity) against independent MDR vendors
        such as Arctic Wolf, Huntress, or Red Canary, covering detection coverage, mean-time-to-respond
        SLAs, and client reporting practices.
      whyItMatters: >-
        At-Bay MXDR launched in July 2025 and has limited public track record; buyers cannot assess whether
        SOC detection quality matches dedicated MDR vendors without comparative benchmarks.
      diligencePath: >-
        Issue an RFP to At-Bay and three independent MDR vendors for a comparable use case; review analyst
        assessments of SentinelOne Singularity vs. competing XDR platforms for proxy benchmarks.
      relatedQuestionRefs:
        - QE023
    - type: enumeration-incomplete
      severity: minor
      topic: relay-integration
      missingEvidence: >-
        Technical details on how Relay Platform's specialty insurance marketplace integrates with At-Bay's
        underwriting systems, whether Relay serves other carriers, and what percentage of At-Bay's book flows
        through Relay versus the Partner API directly.
      whyItMatters: >-
        Understanding Relay's operational role and dependency depth is important for assessing distribution
        concentration risk and the value of the acquisition to At-Bay's technology platform.
      diligencePath: >-
        Request a Relay integration briefing from At-Bay; review any Relay-specific marketing materials or
        broker-facing documentation; check whether Relay has a public broker portal with documented capabilities.
      relatedQuestionRefs:
        - QE026
