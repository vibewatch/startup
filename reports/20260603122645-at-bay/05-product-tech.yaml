          tone: neutral
        - id: n2
          label: Underwriting and exposure scan
          detail: At-Bay's underwriting model runs alongside an Exposure Manager scan to assess external attack surface.
          tone: neutral
        - id: n3
          label: Policy bound with Stance tier selected
          detail: Core, Advanced, Complete, or MXDR tier selected at binding; embedded security services activate.
          tone: positive
