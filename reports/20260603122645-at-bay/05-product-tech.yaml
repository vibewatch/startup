  - id: section-platform-architecture
    title: 'Platform architecture: Stance layers insurance data, security telemetry, and partner detection engines'
    body: >-
      At-Bay's technology architecture layers proprietary risk intelligence atop third-party detection engines rather
      than building a full security stack from scratch. CrowdStrike Falcon XDR provides the endpoint detection engine
      for MDR Endpoint, announced as a partnership on January 31, 2024 alongside the Stance MDR product. SentinelOne
      Singularity underpins the MXDR platform launched July 15, 2025. All policyholder data is hosted on AWS
      infrastructure located exclusively in the United States, per the At-Bay trust page. The Relay Platform—acquired
      August 22, 2022 and maintained as an independent specialty insurance digital marketplace—serves as At-Bay's
      distribution infrastructure for the broker channel. The Partner API v2 delivers asynchronous quote generation
      with a p90 latency below forty seconds, uses JWT authentication, and enforces broker-of-record clearance
      programmatically; API documentation is publicly maintained on GitHub. This combination of insurance data,
      telemetry from detection partners, and a digital distribution layer constitutes the three-sided technology moat
      At-Bay describes as core to its InsurSec differentiation. The architecture is observable at the interface level
      but opaque at the underwriting-model and SOC-tooling internals.
    claimRefs:
      - CE006
      - CE007
      - CE011
      - CE012
      - CE013
