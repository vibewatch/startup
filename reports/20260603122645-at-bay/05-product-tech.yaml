figures:
  - id: FE001
    title: InsurSec platform architecture stack
    type: stack
    layout: wide
    summary: >-
      At-Bay's InsurSec stack layers a distribution and API channel at the base, risk intelligence and security
      operations in the middle, and insurance policy coverage at the top, binding security telemetry to underwriting
      in a single operating model.
    data:
      layers:
        - label: Insurance policy and coverage
          detail: The policy layer provides financial indemnification backed by the security services below it.
          items:
            - label: Cyber policy
              detail: Coverage up to $10M limits for businesses up to $5B revenue.
            - label: Tech E&O
              detail: Technology errors and omissions coverage available alongside cyber.
        - label: Risk intelligence and underwriting
          detail: Proprietary underwriting models consume Stance telemetry and claims data to price and select risk.
          items:
            - label: InsurSec underwriting model
              detail: Integrates Exposure Manager findings and MDR/MXDR telemetry into pricing.
            - label: InsurSec claims data
              detail: Claims frequency and severity data from 40,000+ policyholders inform the model.
        - label: Security operations (At-Bay Security LLC)
          detail: The wholly-owned security subsidiary operates the SOC, MDR, and MXDR services.
          items:
            - label: SOC operations
              detail: 24/7 alert triage, containment, and incident response for MDR/MXDR enrollees.
            - label: Exposure Manager
              detail: Continuous external attack surface scanning for all Stance policyholders.
            - label: Fraud Defense
              detail: Social engineering and wire fraud prevention service.
        - label: Detection technology partnerships
          detail: At-Bay integrates third-party detection engines rather than building endpoint and email sensors in-house.
          items:
            - label: CrowdStrike Falcon XDR
              detail: Endpoint detection and response engine for MDR Endpoint (Advanced and Complete tiers).
            - label: SentinelOne Singularity
              detail: Extended detection and response platform for the MXDR product (launched Jul 2025).
        - label: Distribution and API infrastructure
          detail: Brokers and enterprises reach At-Bay through the Relay marketplace and the Partner API v2.
          items:
            - label: Partner API v2
              detail: JWT-authenticated REST API; async quotes at p90 <40s; BOR clearance enforced.
            - label: Relay Platform
              detail: Specialty insurance digital marketplace (subsidiary acquired Aug 22, 2022).
            - label: AWS US cloud
              detail: All data hosted on AWS infrastructure in the United States.
    approximationNotes: >-
      Layer ordering and groupings are inferred from public press releases and product page descriptions. At-Bay
      does not publish an internal architecture diagram. The underwriting model integration with Stance telemetry
      is described in company materials but not technically documented publicly.
