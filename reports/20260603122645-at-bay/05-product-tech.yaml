  - id: section-tech-operating-model
    title: 'Technology operating model: At-Bay Security LLC runs the SOC; Relay handles specialty distribution'
    body: >-
      At-Bay splits its operating model into two technology-intensive subsidiaries. At-Bay Security LLC operates the
      security services layer—running the MDR and MXDR SOC, managing CrowdStrike and SentinelOne integrations, and
      delivering the Exposure Manager and Fraud Defense capabilities to enrolled policyholders. Relay Platform
      provides specialty insurance digital quoting and placement, positioned as an independent marketplace that
      connects brokers and carriers. The Partner API v2 ties both into the broker workflow: a broker submits a
      submission through the API, receives an asynchronous quote within the p90 latency target, and the system
      performs BOR clearance checks before binding. At-Bay's 2025 InsurSec analysis indicated that ninety percent
      of claims across Q1 2022 through Q4 2024 could have been potentially mitigated by MXDR capabilities. The
      company also reports a ninety-nine point nine-nine-nine percent incident avoidance rate for Stance-enrolled
      policyholders, though no independent third-party audit of this figure was found in public sources. The
      operating model requires continuous coordination between the insurance underwriting function and the security
      SOC—a dependency that creates differentiation but also introduces complexity that would be difficult to
      replicate and equally difficult to unwind if a partner technology relationship changes.
    claimRefs:
