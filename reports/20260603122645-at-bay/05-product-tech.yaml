company:
  name: At-Bay
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    At-Bay has transformed from a cyber insurer into a vertically integrated InsurSec provider, bundling active security
    services—Exposure Manager, Fraud Defense, Security Awareness Training, MDR Endpoint, MDR Email, and MXDR—directly
    into each policy. The platform is built on CrowdStrike Falcon XDR (MDR) and SentinelOne Singularity (MXDR),
    delivered via At-Bay Security LLC, and distributed through a Partner API v2 and the Relay digital marketplace
    subsidiary. The security product roadmap progressed rapidly between 2022 and 2025, expanding coverage depth from
    basic exposure scanning to extended detection and response. Key diligence risks center on the company-claimed
    99.999% incident avoidance rate lacking independent corroboration, bundle lock-in cited by users who lose Stance
    tools when switching carriers, and limited public transparency on reinsurance and capital capacity supporting the
    full InsurSec stack.
sections:
  - id: section-product-definition
    title: 'Product definition: At-Bay bundles active security services with every cyber insurance policy'
    body: >-
      At-Bay markets its offering as InsurSec—a combined insurance and cybersecurity product that goes beyond
      indemnification to actively reduce policyholder risk. Every cyber policy includes Stance, At-Bay's proprietary
      security platform operated by its wholly-owned subsidiary At-Bay Security LLC. Stance is structured into three
      service tiers: Core (Exposure Manager, Fraud Defense, Security Awareness Training, and vCISO advisory), Advanced
      (Core plus MDR Endpoint via CrowdStrike Falcon XDR), and Complete (Advanced plus MDR Email). A fourth track,
      MXDR, launched in July 2025 powered by SentinelOne Singularity, extending detection across endpoint and email
      surfaces for mid-market policyholders. The platform was enhanced in April 2024 to include phishing simulation,
      Microsoft 365 and Google Workspace monitoring integrations, pushing aggregate risk coverage to a company-claimed
      66 percent. Coverage limits expanded on June 3, 2024 to serve businesses with up to five billion dollars in
      revenue and ten million dollars per policy, reflecting a deliberate move upmarket. The embedded value of Stance
      services is approximately seventy thousand to seventy-two thousand dollars per policy according to company
      materials, an important differentiator relative to insurers that price security add-ons separately or not at all.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
