  - id: section-trust-compliance
    title: 'Trust and compliance: SOC 2 Type II certified with AWS US data residency; self-attestation limits remain'
    body: >-
      At-Bay's trust posture is anchored by a SOC 2 Type II certification and a stated policy of storing all
      customer data on AWS infrastructure located in the United States. The trust page further asserts that no
      policyholder data is used to train AI models, and that role-based access controls govern how users interact
      with Stance dashboards. The legal separation between At-Bay Insurance and At-Bay Security LLC provides a
      structural boundary between the insurance entity and the security services subsidiary, though the precise
      regulatory licensing detail for the cybersecurity operations is not publicly enumerated. Material limits on
      the public trust posture include: SOC 2 scope boundaries are not described in publicly accessible detail,
      encryption standards are asserted but not enumerated, and the third-party audit reports underlying the
      certification are not publicly released. For enterprise buyers evaluating the platform, these gaps suggest
      that due diligence would require direct engagement with At-Bay to obtain audit artifacts, data processing
      agreements, and specifics on the subprocessor chain supporting AWS hosting.
    claimRefs:
      - CE020
      - CE021
      - CE022
      - CE023
      - CE024
      - CE025
      - CE026
    tableRefs:
      - TE004
  - id: section-differentiation
    title: 'Differentiation and roadmap: InsurSec bundling creates measurable risk reduction but also user lock-in risk'
    body: >-
      At-Bay's core differentiation is structural: by embedding security tools into the insurance contract, it
      creates an integrated risk-reduction loop that pure insurers cannot replicate without acquiring or partnering
      with a security operations center. Company data indicates that non-Stance policyholders experienced a seven
      percent higher claim frequency, while average claim severity reached two hundred twenty-one thousand dollars
      and ransomware severity reached five hundred eight thousand dollars in 2025 data. The company claims a
      ninety-nine point nine-nine-nine percent incident avoidance rate, an extraordinary figure that has not been
      independently validated. At-Bay's roadmap progression from 2022 through 2025 was rapid: Relay acquisition
      (August 2022), Stance MDR launch with CrowdStrike (October 2023), SAT and M365/GWS integrations
      (April 2024), upmarket expansion to five billion dollar revenue businesses (June 2024), and MXDR with
      SentinelOne (July 2025). A documented adverse signal from the Spiceworks community highlights that
      policyholders lose access to Stance security tools when switching carriers, a switching cost that creates
      lock-in risk from the buyer's perspective. The pace of product launches and technology partner additions
      suggests continued investment, but the roadmap beyond MXDR is not publicly disclosed, limiting
      forward-looking product diligence.
    claimRefs:
