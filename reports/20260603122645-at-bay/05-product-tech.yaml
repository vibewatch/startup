    type: flow
    layout: wide
    summary: >-
      A broker or direct buyer enters At-Bay's workflow through the Partner API or Relay, triggering underwriting,
      Stance activation, continuous monitoring, and—if needed—an integrated incident response process that feeds
      back into claims handling.
    data:
      nodes:
