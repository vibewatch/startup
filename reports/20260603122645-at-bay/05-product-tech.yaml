  - id: FE004
    title: At-Bay product capability maturity matrix by tier
    type: matrix
    layout: wide
    summary: >-
      Core-tier Stance provides strong distribution reach and risk intelligence but limited active detection;
      Advanced and Complete tiers add endpoint and email MDR coverage; MXDR extends the detection surface but
      remains early-stage relative to the mature MDR tiers.
    data:
      columns:
        - Security coverage depth
        - Detection partner depth
        - Distribution reach
        - Product maturity
        - Enterprise readiness
      rows:
        - label: Stance Core
          values:
            - label: limited
              tone: warning
              detail: Exposure Manager and Fraud Defense provide passive scanning and fraud prevention; no active MDR.
            - label: proprietary only
              tone: neutral
              detail: No third-party detection engine at this tier; At-Bay-built modules only.
            - label: strong
              tone: positive
              detail: Available to all policyholders via Partner API and Relay; broadest market penetration.
            - label: strong
              tone: positive
              detail: Core modules launched with the platform; mature and battle-tested across 40,000+ customers.
            - label: medium
              tone: neutral
              detail: Suitable for SMBs; lacks MDR depth that larger enterprises typically require.
        - label: Stance Advanced (MDR Endpoint)
          values:
            - label: medium
              tone: neutral
              detail: Adds CrowdStrike-powered endpoint MDR; strong endpoint coverage but email not included.
            - label: strong (CrowdStrike)
              tone: positive
              detail: CrowdStrike Falcon XDR is a tier-1 endpoint detection platform.
            - label: strong
              tone: positive
              detail: Optional add-on available to the full broker and API channel.
            - label: strong
              tone: positive
              detail: MDR Endpoint GA since January 2024; over 12 months of production operation at run date.
            - label: medium
              tone: neutral
              detail: Endpoint MDR is enterprise-grade; email coverage gap limits full-stack appeal.
        - label: Stance Complete (MDR Email + Endpoint)
          values:
            - label: strong
              tone: positive
              detail: Full MDR coverage across endpoint and email surfaces; broadest Stance protection tier.
            - label: strong (CrowdStrike)
              tone: positive
              detail: Same CrowdStrike engine as Advanced tier; email detection added at Complete.
            - label: strong
              tone: positive
              detail: Available through the same distribution channels as lower tiers.
            - label: strong
              tone: positive
              detail: Complete tier available alongside MDR Endpoint GA since January 2024.
            - label: strong
              tone: positive
              detail: Full endpoint and email MDR meets typical enterprise security requirements.
        - label: Stance MXDR (SentinelOne)
          values:
            - label: strong+
              tone: positive
              detail: Extended detection and response across endpoint and email using SentinelOne Singularity.
            - label: strong (SentinelOne)
              tone: positive
              detail: SentinelOne Singularity is a leading XDR platform; partnership announced July 2025.
            - label: medium
              tone: neutral
              detail: Launched July 2025; SoftwareOne marketplace listing in place but broader rollout is early.
            - label: early
              tone: warning
              detail: Less than 12 months in production at run date (launched Jul 15, 2025); track record limited.
            - label: medium
              tone: neutral
              detail: Designed for mid-market but enterprise procurement track record is still developing.
        - label: Relay / Partner API (distribution layer)
          values:
            - label: none
              tone: warning
              detail: Distribution infrastructure only; no security capability at this layer.
            - label: strong (API depth)
              tone: positive
              detail: JWT auth, async quotes, BOR clearance; deep broker workflow integration.
            - label: strong+
              tone: positive
              detail: Relay and Partner API together span SMB, mid-market, and enterprise broker channels.
            - label: strong
              tone: positive
              detail: Relay acquired August 2022; Partner API v2 in production; both mature distribution assets.
            - label: strong
              tone: positive
              detail: Enterprise-grade API with SLA guarantees and programmatic BOR enforcement.
