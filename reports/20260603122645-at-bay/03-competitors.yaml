callouts:
  - calloutType: risk
    title: "Relay Shutdown: Adverse Execution Signal"
    body: "At-Bay's decision to shut down its Relay specialty insurance platform (acquired 2022, wound down 2025-2026) is the most material adverse competitive signal in this chapter. The shutdown indicates that At-Bay's multi-line diversification thesis—part of its Series D narrative—did not execute. The capital and management attention devoted to Relay during 2022-2025 was diverted from Stance MDR deepening and carrier rating improvement during the same period Coalition built its admitted carrier capability and secured the Allianz partnership. Investors should require management to provide a clear account of Relay economics, the decision timeline, and what organizational learning was captured."
    claimRefs:
      - CP036
      - CP039

  - calloutType: risk
    title: "Zurich-Beazley: The Incumbent Threat Resets"
    body: "The $10.9B Zurich acquisition of Beazley (announced March 2026) fundamentally changes the incumbent threat landscape for At-Bay. A combined Zurich-Beazley entity would have $1.28B+ in cyber premiums, global admitted paper, Beazley's proven BBR claims capabilities, and Zurich's balance sheet capital to invest in pre-breach technology at a scale no InsurTech MGA can match organically. This is not an immediate displacement threat—integration of an $11B acquisition typically takes 18-36 months—but it resets the 5-year competitive calculus. At-Bay needs a global distribution answer (analogous to Coalition's Allianz deal) before Zurich-Beazley integration completes."
    claimRefs:
      - CP011
      - CP012
      - CP013
      - CP020
      - CP021

  - calloutType: insight
    title: "MDR Standalone Revenue ($13M ARR) Is a Defensive Moat Signal"
    body: "At-Bay's Stance MDR reaching $13M in standalone ARR in 2024 (up from <$1M in 2023) with 7,500 dedicated security customers (non-insurance MDR buyers) indicates the security platform is viable independently of the insurance bundle. This bifurcation is strategically important: if At-Bay can grow Stance MDR as a standalone product, it creates a second revenue stream and demonstrates that the security value is real enough to purchase without the insurance subsidy. This also provides a counterargument to the Huntress/Arctic Wolf substitution threat—buyers choosing Stance over Huntress are doing so on security merit, not price."
    claimRefs:
      - CP018
      - CP019
      - CP040

