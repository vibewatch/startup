evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: profitability
    missingEvidence: At-Bay's EBITDA, net income, operating cash flow, and loss ratio are not publicly disclosed for any fiscal year.
    whyItMatters: >-
      Without profitability data, it is impossible to assess whether At-Bay's growth is sustainable or how much runway
      remains from the ~$296M raised.
    diligencePath: >-
      Request audited financials in a management meeting; review any state insurance filing disclosures for the admitted
      carrier entity.
    relatedQuestionRefs:
      - QO022
  - type: private-evidence-only
    severity: material
    topic: reinsurance-structure
    missingEvidence: >-
      The identities of At-Bay's reinsurance capacity partners (beyond Munich Re Ventures as investor), treaty
      structures, and per-event/aggregate retentions are not publicly disclosed.
    whyItMatters: >-
      The 15% risk retention model depends on reinsurance availability; capacity withdrawal or pricing increases could
      materially affect At-Bay's economics.
    diligencePath: Request reinsurance program summary in management meeting; review state insurance filings for admitted carrier.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: minor
    topic: board-composition
    missingEvidence: >-
      Full board of directors composition beyond Preeti Rathi (Icon Ventures) and Yoni Cheifetz (Lightspeed) has not
      been confirmed from public sources.
    whyItMatters: Board composition affects governance quality and investor alignment.
    diligencePath: Request board composition and governance overview from company.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      No new primary financing round or liquidity event has confirmed At-Bay's valuation since the July 2021 Series D at
      $1.35B. The ~$2.1B Forbes estimate is a secondary proxy only.
    whyItMatters: >-
      Valuation is a key input for downstream financial and valuation chapters; reliance on an unconfirmed estimate
      introduces material uncertainty.
    diligencePath: Request current capitalization table and latest 409A or third-party valuation report.
    relatedQuestionRefs:
      - QO009
      - QO025
  - type: stale
    severity: minor
    topic: loss-ratio
    missingEvidence: >-
      At-Bay's actual underwriting loss ratio is not publicly disclosed and the most recent comparable industry data
      points are from 2025 InsurSec Report claims data, not actual combined ratio statistics for At-Bay specifically.
    whyItMatters: Affects assessment of underwriting profitability and financial sustainability.
    diligencePath: >-
      Request loss triangle and combined ratio disclosure from management; review state insurance regulator annual
      statement filings.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: At-Bay current GWP
    missingEvidence: Current At-Bay gross written premium, policy count by segment, and renewal rate-change cohort data.
    whyItMatters: Without current GWP and cohort rate data, SOM and soft-market exposure cannot be quantified.
    diligencePath: Request management KPI pack and reinsurer bordereaux summary by segment and underwriting year.
    relatedQuestionRefs:
      - QM020
      - QM022
      - QM024
      - QM025
  - type: private-evidence-only
    severity: material
    topic: MDR attach economics
    missingEvidence: MDR attach rate, MDR ARR, gross margin, churn, and claims impact by cohort.
    whyItMatters: >-
      The market thesis depends on MDR improving revenue quality and loss selection, but public sources do not quantify
      the effect.
    diligencePath: Request MDR cohort dashboard and claims comparison for attached versus non-attached policyholders.
    relatedQuestionRefs:
      - QM017
      - QM018
      - QM025
  - type: conflicting-data
    severity: minor
    topic: market sizing methodology
    missingEvidence: >-
      A consistent source that reconciles global GWP, U.S. DWP, standalone cyber, packaged cyber, and MDR revenue in one
      taxonomy.
    whyItMatters: Contradictory estimates can inflate TAM if incompatible measures are added together.
    diligencePath: Normalize all sizing to annual commercial cyber premium and keep MDR as an adjacent revenue pool.
    relatedQuestionRefs:
      - QM003
      - QM021
      - QM023
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: reinsurance concentration
    missingEvidence: At-Bay-specific reinsurer panel, quota-share terms, exclusions, and aggregate cyber-cat limits.
    whyItMatters: Public market sources show systemic and reinsurance risks, but At-Bay's exact capacity resilience is private.
    diligencePath: Review treaty documents, reinsurer concentration, retention, and catastrophe model outputs.
    relatedQuestionRefs:
      - QM015
      - QM024
  - type: missing-source
    severity: material
    topic: retention-renewal
    missingEvidence: >-
      At-Bay policyholder renewal and retention rate data, and any comparison of policyholder churn vs. Coalition and
      InsurTech MGA peers.
    whyItMatters: >-
      Retention rate is a key indicator of InsurSec model stickiness and moat durability. Without it, the switching-cost
      analysis is incomplete and the data moat claim cannot be fully validated.
    diligencePath: >-
      Request management-disclosed NRR or renewal rate; cross-check against FSLSO E&S filing data for At-Bay Specialty
      Insurance Company policy counts across quarters.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: MDR-performance-benchmark
    missingEvidence: >-
      Independent third-party benchmark or audit of At-Bay Stance MDR 15-minute MTTR versus CrowdStrike Falcon Complete
      and SentinelOne Vigilance Respond on equivalent threat scenarios.
    whyItMatters: >-
      The 15-minute MTTR is At-Bay's primary technical differentiator in marketing; without independent verification it
      is a company-claimed metric that could overstate real-world performance.
    diligencePath: >-
      Commission independent MDR benchmark test (e.g., CyberRatings or SE Labs); review Stance customer references to
      validate MTTR in actual incidents.
    relatedQuestionRefs:
      - QP010
  - type: missing-source
    severity: material
    topic: E&S-carrier-placement-restrictions
    missingEvidence: >-
      Detailed analysis of which US states and industry verticals (healthcare, financial services) require admitted
      paper for cyber liability, and whether At-Bay's B++ E&S carrier is materially excluded from those placements.
    whyItMatters: >-
      If key enterprise verticals (HIPAA-governed healthcare, financial services regulators) require admitted paper,
      At-Bay Specialty Insurance Company's E&S status prevents penetration of those segments even as At-Bay markets to
      mid-market and enterprise accounts.
    diligencePath: >-
      Review NAIC state-by-state admitted carrier requirements for cyber; consult US surplus lines broker to map
      exclusions in target sectors.
    relatedQuestionRefs:
      - QP020
  - type: missing-source
    severity: minor
    topic: Relay-economics
    missingEvidence: >-
      The economic performance of the Relay specialty insurance platform prior to shutdown -- revenue, loss ratio, and
      capital consumed -- to assess whether the shutdown was a proactive capital allocation decision or a forced exit.
    whyItMatters: >-
      Understanding whether Relay was capital-intensive and loss-making versus strategically pruned affects the severity
      of the execution risk signal.
    diligencePath: >-
      Request At-Bay management disclosure in Series E or acquirer diligence; review any NAIC filing data for
      Relay-issued policies.
