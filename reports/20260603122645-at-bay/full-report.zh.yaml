        - Stryker 2026 年网络攻击引发承保争议，检验 LMA5567A/B 除外条款；保险人与被保险人对伊朗相关归因存在争议。
        - 高
        - 高
        - At-Bay 保单自 2023 年 3 月起纳入与 Lloyd's 要求一致的战争除外条款。
        - 跟踪 Stryker 结果；要求管理层披露所有未决战争除外承保争议，按投保人数和总保额列示。
      - - 多州盈余险合规
        - At-Bay Specialty Insurance 是非认可承保实体；FSLSO 备案确认其 Florida 盈余险注册；所有 50 个州均适用多州盖章和保费税义务。
        - 中
