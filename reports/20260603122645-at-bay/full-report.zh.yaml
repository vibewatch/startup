      - number: '7.5'
        title: 财务模型、竞争与集中度风险
        blocks:
          - type: paragraph
            body: >-
              At-Bay 作为前置 MGA 的财务模型，依赖持续保费增长、稳定再保险定价，以及足以支撑运营的承保利润率。2026 年，三项假设同时承压。美国网络保险保费 2024 年下降
              7%，是市场首次收缩；原因包括大型企业赔付率改善（At-Bay 不参与该市场）、资产负债表更深的传统承保公司降价，以及经纪人驱动的价格竞争。WTW 和 Marsh 均确认，美国网络费率 2024 年 Q4 下降
              5%，买方有利条件延续至 2026 年 Q1。对按保费百分比赚取费用和利润佣金的 MGA 来说，即便保单数量持平，5–7% 的费率下降也会直接转化为费用收入下降。FSLSO 申报披露债务 / 权益比率为
              121.3%，2024 年经营现金流为负 $10.7M，缩小了公司在不动用外部资本情况下吸收一个差于 2024 年承保年度的跑道。2021 年 $1.35B 的 Series D
              估值反映的是截然不同的网络保险市场：保费加速、赔付率扩大有利于承保公司，SMB 细分市场几乎没有竞争。Beinsure 按保费将 At-Bay 列入美国前十大网络保险公司，但 Coalition、Corvus 和
              Cowbell 都在以相近或更低价格激烈争夺同一 SMB 细分市场。Munich Re 预测全球网络保费到 2030 年达到 $28B，支撑长期增长；但路径很关键：如果 At-Bay
              必须先穿越定价低谷才能等到费率正常化，它就需要明显更低的费用率，或一块能吸收期间承保亏损的资本缓冲。下方缓释与否决标准表、以及依赖关系图，给出可监控阈值，用于区分可承受的逆风和会击穿投资逻辑的恶化。
