      - number: '1.2'
        title: 创始人与领导团队
        blocks:
          - type: paragraph
            body: >
              At-Bay 由 4 人于 2016 年联合创立：Rotem Iram（CEO）、Roman Itskovich（首席风险官）、Etai Hochman 和 Tilli
              Kalisky-Bannett。Hochman 和 Kalisky-Bannett 已不再担任高管。Iram 和 Itskovich
              都把以色列精英情报服役经历、全球咨询和金融经验结合在一起，这种少见组合直接塑造了 At-Bay 的承保纪律和技术优先的风险理念。

              Rotem Iram 曾在一个类似 NSA 的以色列情报单位担任上尉，之后在 McKinsey & Company 做咨询，并在 K2 Intelligence 担任运营职务。他拥有 Hebrew
              University of Jerusalem 计算机工程学士学位和 Harvard Business School MBA。军事情报背景是 At-Bay 风险扫描方法的核心。Roman Itskovich 曾在
              Bain Capital 投资团队任职，也曾在 McKinsey 做咨询，之后联合创立 At-Bay。他拥有 Tel Aviv University 经济与会计学士学位和 Harvard Business
              School MBA。

              当前领导团队中，联合创始人之外还包括 Ken Riegler（President, At-Bay Insurance）、Ari Fischel（CFO）、Ayelet Kutner（CTO）、Tara
              Bodden（General Counsel & Head of Claims）、Thom Dekens（CBO and GM, At-Bay Security）、Michael Drummond（Chief
              Underwriting Officer, Cyber and Tech E&O）以及 Adam Tyra（CISO for Customers）。团队覆盖保险运营、网络安全、工程和法务，对一家约 340–367
              人的公司来说职能面较宽。Rotem Iram 周边的关键人物风险很实质：他是 InsurSec 模式的公开门面、战略架构师和主要发言人，任何接班或离任都会带来不成比例的风险。
