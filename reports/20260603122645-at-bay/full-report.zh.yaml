      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              2016 年以来，At-Bay 已通过 6 轮风险融资募集约 $295.7 million，投资方包括科技 VC、全球保险集团的企业风险投资部门，以及具备网络安全运营经验的知名天使投资人。

              2017 年 11 月的 $6 million 种子轮由 Lightspeed Venture Partners 和 Shlomo Kramer 支持；Kramer 是以色列连续创业者，曾联合创立 Check
              Point Software 和 Imperva。2018 年，公司完成 $13 million Series A。2020 年 2 月 Series B 融资 $34 million，由 Munich Re
              Ventures（通过其 HSB 基金）和 Acrew Capital 共同领投，Khosla Ventures、Lightspeed、Qumra Capital、M12（Microsoft 的风险投资基金）和
              Shlomo Kramer 参投。2020 年 12 月，另一笔 $34 million Series C 完成，由 Qumra Capital 领投，M12 在原有财团基础上提高了承诺。

              关键的 Series D 在 2021 年 7 月完成，规模 $185 million，由 Icon Ventures 和 Lightspeed Venture Partners 共同领投。Preeti
              Rathi（Icon Ventures）随融资加入董事会。该轮把 At-Bay 的投后估值推至 $1.35 billion——达到独角兽状态——累计融资在交割时约 $272 million。2021 年 10
              月又追加 $20 million，使累计融资达到约 $292–$295.7 million（按公司 About 页面披露）。Forbes Big Tech 50 2024 估计 At-Bay 估值约 $2.1
              billion，反映 2021 年新股轮后的增长，但没有新的融资事件确认。

              投资人结构以 VC 支持的成长资本为主（Icon Ventures、Lightspeed、Khosla、ION Crossover Partners），并叠加战略保险资本（Munich Re
              Ventures/HSB、Qumra Capital、Glilot Capital）和运营经验（Shlomo Kramer）。公开记录中没有确认的债务或授信安排。Series D
              之后，也没有公开确认的老股流动性或老股要约事件。
