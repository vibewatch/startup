      - number: '4.6'
        title: 证据要点
        blocks:
          - type: callout
            title: 子公司 102% 的综合成本率显示承保压力
            body: >-
              At-Bay Specialty Insurance Company 2024 年综合成本率为 102%，说明 E&S 承保载体子公司层面出现承保亏损。尽管母公司赚取 MGA
              费用和佣金收入，未体现在子公司申报中，而且合并实体可能仍然盈利，但已发生损失率一年内恶化 18 个百分点（50% → 68%）是实质性负面趋势。若子公司综合成本率持续高于 100%，在 334.2% 总保费 /
              盈余比率和三个被标记的 NAIC IRIS 比率背景下，资本充足性压力会加剧。
            calloutType: risk
