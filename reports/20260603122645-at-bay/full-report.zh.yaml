      - number: '2.5'
        title: 约束：费率走软、再保险与系统性风险
        blocks:
          - type: paragraph
            body: >-
              反向市场情景尤其重要。2024–2026 年证据基础显示市场走软：Howden、Marsh、Aon、Gallagher 和 Fitch
              都描述了降价、充足容量，或竞争条件带来的承保风险。这有利于买方，也可能在近期支撑 At-Bay
              容量，但当索赔严重度上升时，它会压缩每个风险暴露的保费收益，并挤压利润率。再保险是另一重约束，因为网络聚合风险仍难建模，专业保险公司依赖分出容量。Moody's 关于网络集中度的研究和 CrowdStrike
              宕机事件说明，这不是理论风险：共同的 EDR、云、身份或软件更新依赖，可能让许多已承保 SMB 同时停摆。MDR 能降低单个客户的事故频率，但无法让组合完全分散共同供应商故障。尽调结论因此需要平衡：At-Bay
              的一体化模型契合 SMB 需求，但估值应因周期时点、系统性风险和未披露的 MDR 贴附经济性而打折。
