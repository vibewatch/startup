            body: >
              Forbes Big Tech 50 2024 给出的 At-Bay 约 $2.1B 估值是外部估计，不是新股市场事件。最后一次有确认投后估值的新股 融资是 2021 年 7 月 Series D，估值
              $1.35B。后续章节使用任何估值数字时，都必须标注为二级估计；在出现新融资轮或流动性事件前，不确定性很高。
            calloutType: assumption
            claimRefs:
              - CO021
              - CO024
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >-
              At-Bay 的市场规模应放在一个刻意收窄的边界里衡量：面向组织的商业网络保险，加上贴附在已承保风险上的相邻 MDR / 安全服务。纳入的保险支出，是独立
              和打包式网络保单的毛承保保费或直接承保保费，覆盖第一方损失、勒索软件 / 勒索、事件响应、业务中断、隐私责任，以及与 Technology E&O 相连的网络风险暴露。纳入的安全邻接，是卖给同一批 SMB
              和中型市场买方的托管检测与响应、漏洞监控和修复，作为降险层。排除项包括个人网络保单、不明确给网络风险定价的广义财产与意外险保费、没有与托管响应打包的通用网络安全软件、保修，以及自保准备金。这个边界重要，因为
              At-Bay 的市场叙事不只是「网络安全支出很大」；它的经济切口在于把风险转移、经纪人主导的保险分销、以及能降低索赔频率的安全控制结合起来。
