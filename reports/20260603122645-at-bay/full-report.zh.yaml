      - number: '3.3'
        title: 传统特种险承保人
        blocks:
          - type: paragraph
            body: >
              Beazley PLC（伦敦；LSE 上市）长期以来是技术最前沿的传统网络险承保公司。其 Beazley Breach
              Response（BBR）产品提供事故后服务——法律、取证、公关和通知，并在医疗、金融服务和科技网络险中拥有公认地位。2025 年，Beazley
              因索赔严重度上升和保费下滑，开始降低美国网络风险暴露，给复杂买方形成了暂时的市场趋硬。2026 年 3 月，Zurich Insurance Group 宣布同意以约 $10.9B（GBP 8.1B）收购
              Beazley——打造分析师所称的「网络保险强权」，把 Beazley 的技术深度与 Zurich 的全球资产负债表和分销结合起来。如果完成，Zurich-Beazley 组合将拥有约 $1.28B
              网络保费（Beazley 单体，2024 年），并成为资本最雄厚的传统保险公司 威胁。这既是 At-Bay 长期市场地位的最大威胁，也验证了网络专业保险板块的战略价值。


              Chubb Limited（NYSE: CB）是全球最大的上市财产与意外险保险公司，业务覆盖约 54 个国家，GWP 约 $54B。Chubb Cyber ERM 面向中大型企业，并通过 Chubb Studio
              为数字合作伙伴提供嵌入式分销。Chubb 的 AA/Aa2 财务实力评级，是相对 At-Bay 的主要竞争优势；不过，Chubb 没有与 At-Bay Stance
              相当的持续事故前监控，因此对优先考虑主动安全管理而非承保公司财务实力的 SMB 来说竞争力不足。


              AXA XL 是 AXA Group 的财产与意外险及专业风险部门，依托 AXA 全球资产负债表为大型企业提供网络责任保障。AXA XL 与 At-Bay 的竞争主要在企业段（收入 $500M 以上），而
              At-Bay 新的大客户产品线（保额最高 $10M）正在进入这一段。AXA XL 的主要优势，是在 At-Bay 没有覆盖的地区提供全球准许承保保障；主要弱点，是缺乏与 At-Bay Stance
              相当的一体化事故前安全服务。
