      - number: '7.3'
        title: 承保、系统性与再保险风险
        blocks:
          - type: paragraph
            body: >-
              FSLSO 2024 年度法定申报，是观察 At-Bay 承保位置最细颗粒度的公开窗口。申报显示，直接承保保费为 $280.6M（较 2023 年 $63.1M 增长 344.9%），已发生损失为
              $29.2M（同比增长 96.7%），综合成本率 102%，总保费 / 盈余比率 334.2%，明显高于 AM Best 对前置项目标记为担忧的 300% 门槛。前置结构本身集中风险：AM Best 在 2025
              年 8 月重申 At-Bay Specialty 为 A- Excellent，但由 Munich Re/HSB 牵头、Skyward Specialty、AXA SA、W.R. Berkley 和
              Fairfax 跟随的五家再保险面板意味着，若多家再保险人同时收缩，要么迫使保费下降，要么要求 At-Bay 保留更多净风险。Howden Reinsurance 2025
              年网络报告显示，全球前五大网络再保险人占 62% 市场份额，确认资本供给侧同样存在集中度。Akira 勒索软件集中度是最大的短期承保威胁：At-Bay 自有 2026 InsurSec report
              称，Akira 在 2025 年推动了超过 40% 的勒索索赔；从精算角度看很危险，因为单一威胁行为者的行动节奏（执法打击、谈判策略、目标选择）可以在一个季度内让赔付率移动数个百分点。2025 年没有
              At-Bay MDR 客户提交 Akira 索赔，这是实质性缓释因素，但整个账本中只有一小部分在用 MDR。系统性聚合叠加了全行业结构性低估的尾部风险：CrowdStrike
              宕机证明，单一供应商故障可同时在数千张保单中产生相关损失，Fortune 500 敞口估计为 $5.4B，所有承保公司合计的已保险部分在 $540M 至 $1.08B 之间。下方风险传导图追踪 Akira
              持续存在和聚合事件如何进入再保险重新谈判，并最终影响保单层面的经济性。
