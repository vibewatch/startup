        blocks:
          - type: paragraph
            body: >-
              At-Bay 的核心差异化是结构性的：把安全工具嵌入保险合同后，公司形成一个一体化风险下降闭环；纯保险公司若不收购或合作安全运营中心，很难复制。公司数据显示，未开通 Stance 的投保人索赔频率高出
              7%；2025 年数据中，平均索赔严重度达到 $221,000，勒索软件严重度达到 $508,000。公司声称事故规避率为 99.999%，这是一个异常高、且尚未独立验证的数字。At-Bay 2022–2025
              年路线图推进很快：收购 Relay（2022 年 8 月），与 CrowdStrike 推出 Stance MDR（2023 年 10 月），上线 SAT 和 M365/GWS 集成（2024 年 4
              月），扩展到最高 $5B 收入企业（2024 年 6 月），并与 SentinelOne 推出 MXDR（2025 年 7 月）。Spiceworks 社区记录的一条负面信号显示，投保人更换承保公司后会失去
              Stance 安全工具访问权；站在买家角度，这是由切换成本带来的锁定风险。产品发布和技术伙伴新增的节奏显示公司仍在投入，但 MXDR 之后的路线图未公开，限制了前瞻性产品尽调。
