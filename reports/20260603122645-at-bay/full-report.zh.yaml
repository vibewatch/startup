chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与商业模式
        blocks:
          - type: paragraph
            body: >
              At-Bay, Inc. 由一批具备深厚网络安全和金融背景的以色列创业者于 2016 年在加州旧金山创立。公司自称是「数字时代的 InsurSec
              提供商」——这种模式把传统保险承保和嵌入式、主动型网络安全服务放在同一个公司结构下。传统承保公司往往先定价、事后理赔；At-Bay 则持续监控被保险企业的外部攻击面，提醒投保人新出现的漏洞，并通过安全关联公司
              At-Bay Security, LLC 直接提供托管检测与响应（MDR）能力。

              保险侧通过 At-Bay Insurance Services, LLC（在全部 50 个州和 D.C. 持牌的盈余险经纪）以及一家活跃的全栈保险公司，承保 Cyber、Technology Errors &
              Omissions（Tech E&O）和 Miscellaneous Professional Liability（MPL）保单。At-Bay 自留约 15%
              的承保风险，其余分出给大型再保险公司，以管理总风险暴露，同时吃到风险筛选和客户关系的经济性。网络安全侧的 At-Bay Security, LLC 则提供 At-Bay Stance MDR 和 Exposure
              Management；非投保人也可以单独购买。双实体结构让 At-Bay 能把保险增强项（降低勒索软件自留额、自动平价续保）包装成激励，推动投保人采用安全平台。

              截至 2025 年，At-Bay 在全球有 6 个办公室，总部位于旧金山，并在以色列特拉维夫设有重要研发和工程中心。经纪人分销网络覆盖美国市场，经纪平台 NPS 为
              93。公司的市场进入完全依靠持牌保险经纪人，不直接面向投保人绑定承保。
