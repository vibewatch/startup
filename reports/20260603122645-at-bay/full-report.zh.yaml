      - number: '3.5'
        title: 定价、分销与切换成本
        blocks:
          - type: paragraph
            body: >
              At-Bay 完全通过持牌保险经纪人分销。这个模型带来既有买方关系的触达，但也制造结构性利润分成，并依赖经纪人的排序决策。Coalition 使用同样的经纪人渠道模型；Cowbell 已开始用直接 SME
              外联补充。At-Bay 和 Coalition 都没有披露直接面向买方的销售能力。经纪人依赖在渠道层面制造关键方风险：如果大型经纪商整合、改变承保名单 偏好，或推出内部 MGA 产品，At-Bay
              在没有直接关系兜底时会失去不成比例的业务量。


              SMB 网络保险市场定价已从 2022 年峰值显著走软。全球网络保险费率从 2022 年中到 2025 年约下降 27%；美国约下降 9%。2026 年，干净风险的 SMB 网络险平均保费估计为每年每 $1M
              保额约 $1,000。随着费率下行，At-Bay 捆绑 MDR 的成本收益账也会变化：买方现在支付 $1,000/year，就能以低于 2022
              年高费率环境的绝对保费，获得同样包含监控的价值主张。保险组件定价权下降，迫使 At-Bay 越来越需要用独立安全价值证明 MDR 包；Huntress 标价 $8.99/endpoint/month，而
              At-Bay 的 Stance MDR 实际上免费包含在内，这让保险加安全包在绝对价格上越来越有优势，但差距在缩小。


              InsurSec 模型中的切换成本为中等。At-Bay 投保人如果切换到 Coalition，会失去 Stance MDR 集成、持续漏洞扫描历史，以及嵌入保单的修复流程。同一个买方会获得 Coalition
              Control 的完整监控套件。切换成本有意义，但不构成禁止性障碍：大多数投保人每年续保，并在每次续保时评估替代方案。多归属（从 Huntress 购买监控、从传统承保公司购买保险）在结构上可行；对于已有 MSP
              关系、预算受限的 SMB 来说，这一选择越来越有吸引力。At-Bay 的 E&S 承保公司（At-Bay Specialty Insurance Company，B++ 评级）获得 AM Best
              财务实力重申，在续保时提供可信度，但与每份保单的集成深度相比，它不是实质锁定因素。
            claimRefs:
