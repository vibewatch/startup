      - number: '8.5'
        title: 可比对象与估值倍数
        blocks:
          - type: paragraph
            body: >-
              最相关的可比对象是混合型。Coalition 以披露的 $5B Series F 估值定义了私人网络保险上限基准，背后有更大规模和市场领导力支撑。Cowbell
              提供较低规模的私人融资参考，但没有公开估值标记。Corvus 提供最具体的 M&A 参考：Travelers 以约 $435M
              收购一家网络保险科技承保平台，显示战略买方兴趣，同时也给出一个远低于独角兽时代私人估值的真实退出数据点。Lemonade、Hippo 和 Root
              等公开保险科技公司并不完美，因为它们不是网络保险专家；但其申报和市场数据对纪律有用：保险型数字模型按收入质量、损失控制、资本强度和盈利路径估值。只有在 Stance 和承保数据能被证明改善损失结果时，At-Bay
              才应相对疲弱的公开数字承保公司获得溢价。
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
