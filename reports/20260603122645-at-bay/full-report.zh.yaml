      - number: '3.4'
        title: MDR 与安全厂商替代品
        blocks:
          - type: paragraph
            body: >
              At-Bay 的 Stance 平台把 MDR、漏洞扫描和暗网监控打包给投保人，用作放大器，降低被保险企业的索赔频率和严重度。独立 MDR 厂商也能在不带保险组件的情况下提供同样服务；随着这些厂商降价并提高
              SMB 可获得性，它们会削弱 At-Bay 从捆绑模型中提取的差异化价值。这是 At-Bay 护城河的结构性风险，不是即时替代威胁。


              Huntress（马里兰州 Columbia；2015 年创立）2024 年 ARR 超过 $100M，完成 $180M Series D，估值 $1.5B；截至 2026 年初拥有超过 4,000 个 MSP
              合作伙伴关系。Huntress 通过 MSP 渠道面向 SMB——与 At-Bay 核心市场是同一客户段——标价约为每端点每月 $8.99。Huntress 在部署便利性和 SMB 优化定价上直接与 Stance
              MDR 竞争，虽然它不捆绑保险，也不提供承保公司保单纸。Huntress 的 MSP 渠道主导地位，让它在 SMB 细分中拥有 At-Bay 通过直销渠道所缺乏的分销密度。


              Arctic Wolf（明尼苏达州 Eden Prairie；2012 年创立）2026 年 2 月提交 S-1 公开发行文件，估值约 $4.3B。Arctic Wolf 2026 年估计收入约 $913M，高于
              2024 年 $541M ARR。Arctic Wolf 面向中型市场组织，通过 Aurora Superintelligence Platform 交付礼宾式 MDR；截至 2024 年客户超过 5,500
              名。Arctic Wolf 的中型市场聚焦与 At-Bay 向上扩展发生重叠，其 IPO 进程也释放出加速商业增长的意图。


              CrowdStrike Falcon Complete 和 SentinelOne Vigilance Respond 代表企业级 MDR 层。两者单独购买时价格高于 At-Bay
              Stance，但覆盖广度更强（SIEM、身份威胁检测、威胁情报），对复杂对手的检测率更高，也拥有一些企业买方相对 At-Bay 一体化但绑定承保公司的 MDR
              产品更偏好的独立品牌认知。CrowdStrike（$2B+ ARR，Nasdaq: CRWD）和 SentinelOne（$700M+ ARR，NYSE: S）并不主要是保险相关竞争者；但随着其托管层面向 SMB
              的价格下降，保险捆绑对 At-Bay 来说就不再那么能区分 MDR 成本。


              Palo Alto Networks Cortex XSOAR 和 Managed Threat Hunting，是面向已经部署 Palo Alto 防火墙和 SASE
              基础设施企业的另一类相邻替代品。At-Bay 今天不直接在这一层竞争，但任何未来企业扩张都可能触发这种替代风险。
