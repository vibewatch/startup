              2024 年，美国网络保险市场首次收缩；按当前走软轨迹，综合成本率预计到 2027 年接近或超过 100%。At-Bay 自身理赔数据也显示，2025 年平均严重度创纪录（$221K），勒索软件严重度达到
              $508K。公司 15% 风险自留意味着这些损失趋势会直接影响经济性。费率走软与严重度上升叠加，是影响整个市场的结构性逆风，但对 At-Bay 这类专业险公司的考验更重。
