      - number: '4.5'
        title: 财务不透明、收入质量与尽调缺口
        blocks:
          - type: paragraph
            body: >
              At-Bay 是私人公司，没有公开的合并财务报表。$155M 收入口径来自 Forbes；2023 年 $110M 净收入口径来自媒体对 Ken Riegler 任命的报道；子公司财务则来自 FSLSO
              剩余线监管申报。上述来源均未提供覆盖最终母公司 At-Bay Inc. 的经审计合并利润表、资产负债表或现金流量表。FSLSO 申报只覆盖一个子公司 At-Bay Specialty Insurance
              Company，不能代表全公司的盈利能力，因为 MGA 佣金和费用收入会流向母公司。


              关键未披露指标包括：（1）保险业务合并毛利率；（2）Stance MDR 毛利率、流失率、CAC
              和净收入留存率；（3）母公司现金余额和烧钱速度；（4）已发生但未报告（IBNR）损失准备金；（5）再保险条约限额、附着点和除外条款；（6）行业层面披露之外的保单或客户集中度。子公司被标记的三个 NAIC IRIS
              比率（#4、#6、#10）需要管理层直接解释；102% 的综合成本率也一样，因为它意味着即便母公司 MGA 获得佣金收入，子公司分出后净额层面仍未实现承保盈利。


              收入质量风险包括：全市场保费率走软（美国 DWP 2024 年下降 6%，预计 2026 年进一步下行）；Akira 勒索软件累积风险（超过 40% 的勒索索赔来自同一个威胁行为者）；以及 85% 的 GWP
              到净收入缺口，使收入增长依赖再保险分出经济性。2021 年 10 月后未募集新的外部资本（累计 $292M）。通往公开市场或下一轮融资的路径，要求公司在合并层面证明承保盈利能力，并提升财务透明度。
