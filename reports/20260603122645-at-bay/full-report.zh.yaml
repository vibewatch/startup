          - type: callout
            title: Stance MDR 打造不受保险费率周期直接牵动的第二收入飞轮
            body: >-
              Stance MDR 的 $13M ARR 和已承保客户基数 18.75%
              渗透率，代表一条正在成形、近似软件的收入流，不与网络保险保费率周期直接相关。净保费收入会在原始费率下跌或再保险分出费率上升时被压缩；MDR 订阅则不受保险市场状况影响，持续贡献经常性收入。已承保客户基数中还有
              81.25%（约 32,500 个符合条件但尚未订阅的客户），对 At-Bay 长期财务画像是结构性重要的增购机会。
