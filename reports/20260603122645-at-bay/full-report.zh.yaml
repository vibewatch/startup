  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              2026 年美国商业网络保险市场分为 4 个竞争层级，每一层都对 At-Bay 的 InsurSec 定位构成不同威胁。第一层是直接 InsurTech 同业——Coalition、Cowbell 和
              Corvus/Travelers，它们都把某种风险情报与保险容量打包。第二层是传统保险公司：Beazley（Zurich Insurance 约 $10.9B 收购，2026 年 3 月宣布）、Chubb 和
              AXA XL。它们不靠事故前技术竞争，而是靠财务实力、经纪网络深度和多险种交叉销售。第三层是 Resilience，一家聚焦企业客户的 InsurTech MGA，为 Fortune 1000 CISO
              量化网络风险，账户最低门槛明显高于 At-Bay。第四层也是战略上最容易被低估的一层，是独立 MDR / 安全厂商——Huntress、Arctic Wolf、SentinelOne Vigilance 和
              CrowdStrike Falcon Complete；它们的 MDR 能力在没有保险组件的情况下，部分替代 At-Bay 的 Stance 平台。


              2026 年，全球网络保险市场估计达到 $16.6B 毛承保保费（GWP），约以 15% CAGR 增长。美国约占其中 $10.2B——约 4 million 张有效保单。MGA 现在承保全球网络 GWP
              的约三分之一，这一份额自 2021 年以来显著提高。截至 2026 年 3 月，At-Bay 为超过 53,000 名中小企业投保人提供网络保险，按美国投保人数量看，是仅次于 Coalition（全球
              100,000+ 投保人）的第二大 InsurTech 网络 MGA。竞争动态由费率走软（全球网络保险费率从 2022 年中到 2025 年约下降 27%）、索赔严重度上升（At-Bay 2026
              InsurSec Report 记录每案平均严重度达到历史高点 $221,000），以及 Zurich-Beazley 收购所代表的市场整合加速共同定义。


              所有 InsurTech 网络保险公司的现状替代品，是从传统承保公司那里通过经纪人购买、且没有捆绑安全服务的网络保单——对于没有现有 MDR 合同的 SMB
              来说，这仍是市场上的最常见选择。内部自建替代方案（公司部署自己的 SIEM/SOC 能力，而不是购买托管安全保险）只对中型市场和企业段相关，不是 At-Bay 核心 SMB 买方的主要选择。
