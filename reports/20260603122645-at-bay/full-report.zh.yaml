      - number: '1.5'
        title: 产品与安全平台
        blocks:
          - type: paragraph
            body: >
              At-Bay 的产品套件横跨两类：保险和主动网络安全。保险组合包括首层和超额 Cyber、Technology E&O 以及 Miscellaneous Professional Liability 保单，通过
              At-Bay Insurance Services, LLC（E&S 经纪）和一家准许承保的全栈承保实体提供。每份盈余险 Cyber 和 Tech E&O 保单都附带 At-Bay Stance Exposure
              Management，包括 Stance Advisory Services——把漏洞扫描、暗网监控、AI 驱动的邮件欺诈预警、虚拟 CISO 咨询和员工安全意识培训作为嵌入功能提供。At-Bay
              估计，按当前市场价格，这些嵌入服务每份保单价值最高 $70,000。

              At-Bay Stance MDR 产品自 2024 年 1 月商业可用，由 At-Bay 安全专家管理，基于 CrowdStrike 技术提供 24/7 端点监控。MDR 通过 At-Bay Security,
              LLC 单独销售，投保人和非投保人都可购买。使用表现靠前 MDR 服务的投保人可能有资格获得保险保费抵免。公司的 2026 InsurSec Report 确认，2025 年遭遇 Akira
              勒索软件攻击且避免全量加密的所有投保人，都已部署 24/7 MDR；这一点强力支撑了该产品的战略叙事。

              更广义的 Stance 平台还包括邮件安全产品（Stance MDR for Email）、风险暴露管理层，以及由 vCISO 顾问交付的桌面演练服务。At-Bay
              许可或自研数字取证与事件响应（DFIR）能力，在理赔事件中使用。公司的风险筛选方法在报价时使用外部攻击面扫描，而不是静态问卷，因此风险模型校准的是实际安全状态，而不是自报控制措施。
