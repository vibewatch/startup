      - number: '7.2'
        title: 法律、监管与合规风险
        blocks:
          - type: paragraph
            body: >-
              At-Bay 作为管理总代理，在美国 50 个州和部分国际市场承保网络保险，并使用 Trisura Specialty Insurance Company
              作为主要前置承保公司。该结构让公司暴露于分层合规义务：要求盖章的州需要剩余线盖章，经纪牌照申报，通过前置承保公司承担 NAIC 偿付能力报告义务，以及不断演进的 SEC 网络披露规则；该规则适用于其企业投保人而非
              At-Bay 本身，但会间接驱动索赔和承保争议。当前最尖锐的法律敞口是 LMA5567A/B 战争除外条款。Lloyd's 要求 2023 年 3 月后所有网络保单采用该条款，2026 年 Stryker
              的伊朗相关攻击引发承保争议后，该条款在对抗性诉讼中接受检验，争点包括“计算机攻击”除外和“关键基础设施”例外的竞争性解释。At-Bay 保单包含战争除外；无论 Stryker
              结果哪一方胜出，都会影响承保人和原告未来如何围绕 At-Bay 投保人的国家行为者归因索赔构建论证。剩余线合规构成第二层监管敞口：多州 MGA
              必须在每个非准入保险人承保风险的司法辖区申报；若盖章、申报或缴纳保费税出错，可能触发罚款、保单无效或牌照暂停。作为主要监管来源的 NAIC 2025 Cybersecurity Insurance Report
              确认 At-Bay Specialty Insurance
              活跃于美国市场，并将系统性集中风险标记为行业层面担忧，强化了监管机构正在审视大型网络保险项目的判断。下方监管—法律风险登记表逐项列出具名风险、可能性、严重度、当前缓释证据和剩余尽调路径。
