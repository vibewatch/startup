      - number: '8.6'
        title: 退出就绪度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              从公开证据看，At-Bay 更适合被战略收购，而非已经具备 IPO 条件。自有承保纸、经纪关系、网络索赔数据和 Stance 平台，会吸引寻求网络保险分发的专业承保公司、再保险人或安全厂商。近期 IPO
              较难支撑，因为公开市场投资者会要求合并 GAAP 收入、赔付率历史、准备金、再保险细节，以及可信的承保盈利路径。最终尽调包必须在任何投资前补齐六项缺口：当前合并财务、损失三角、再保险条约条款、Stance
              队列留存和毛利率、股权结构优先权、经纪人集中度。投资逻辑失效触发因素是明确的：综合成本率高于 105%、再保险条款恶化、MDR 附加停滞，或出现估值下调轮融资
              信号。若其中任意两项同时发生，估值案例应重置到悲观区间。
            claimRefs:
              - CV031
              - CV032
              - CV041
              - CV042
              - CV043
              - CV044
          - type: table
            tableRef: TV006
            claimRefs:
              - CV023
              - CV025
