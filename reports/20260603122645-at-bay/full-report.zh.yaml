      - number: '1.4'
        title: 规模指标与里程碑
        blocks:
          - type: paragraph
            body: >
              At-Bay 从 2016 年一家旧金山小创业公司，成长为截至 2025 年 4 月在美国为近 40,000 家企业提供保险、并在 2024 年产生 $155 million 收入的公司；收入较 2023 年
              $129 million 同比增长约 22%，较 2022 年 $90 million 增长超过 70%。公司累计融资超过 $295.7 million，在 6 个全球办公室约有 340–367 名员工。

              MDR 是 At-Bay 增长最快的板块，客户数从 2023 年初不到 1,000 名，增至 2024 年底 7,500 名，当时带来 $13 million 年化 MDR 收入。Stance 平台整体保护约
              1.5 million 个受监控资产。At-Bay Stance MDR 于 2023 年 10 月 26 日发布，并在 2024 年 1 月商业可用。2024 年 6 月，At-Bay 将 Cyber 和
              Tech E&O 承保胃口扩展到收入最高 $5 billion、保额最高 $10 million 的企业，从而触达更大的中型市场和早期企业账户。

              Relay Platform 的收购（约 2022 年 8 月完成）和后续关停（2024 年 8 月 6 日生效）是一处值得注意的战略转向：At-Bay 收购了一家数字经纪平台创业公司，随后在 Stance
              MDR 动能加速时将其关闭。At-Bay Specialty Insurance Company 子公司 2023 年获得 AM Best A- 财务实力评级，增强了经纪人可信度。公司入选 Forbes
              Fintech 50（2023–2025）和 Forbes Best Startup Employers（2026）。
