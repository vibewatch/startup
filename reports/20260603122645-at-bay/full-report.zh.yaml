      - number: '8.2'
        title: 建议、置信度、风险与估值立场
        blocks:
          - type: paragraph
            body: >-
              建议为继续研究，置信度中等，风险中高，估值立场在合理到偏高之间。若价格处于或低于上一轮新股融资的 $1.35B 标记，证据权衡会有吸引力，因为下行更接近由收入支撑的保险和 M&A 可比对象。若接近 Forbes
              估计的 $2.1B 标记，只有当前赔付率已经正常化、Stance 留存强、再保险人支持保持稳定，案例才算合理。若明显高于约
              $2.1B，举证负担会快速上升，因为公开可比公司不能为承保载体挂钩的保险模型支持无限的软件式倍数。最重要的投资含义是，公开证据支持继续尽调，而不是无条件买入：没有公开来源披露合并毛利率、烧钱速度、NRR、损失三角、经纪人集中度或清算优先权。
            claimRefs:
              - CV001
              - CV002
