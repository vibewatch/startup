        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              At-Bay 只有作为价格纪律严格的 InsurSec 标的才可投，不能按普通高增长软件故事来买。核心逻辑是：一家拥有自有 E&S 承保纸、自研承保数据和内嵌 MDR
              的网络保险公司，能在保费经济性之上降低损失，并增加经常性安全收入。公开证据支持这些要素：Forbes 报道 2024 年收入约 $155M、SMB 客户超过 53,000；At-Bay
              已迁移到自有承保纸；Stance MDR 被营销为预防层；2026 年 InsurSec 证据显示 MDR 可能降低 Akira 勒索软件结果。反向逻辑同样具体。承保载体子公司 2024 年综合成本率为
              102%，Relay 收购后被关闭，网络保险定价正在走软，Akira 集中度显示单一威胁行为者就能给承保模型施压。因此，本章将 At-Bay 视为有差异化、但尚未去风险的私人网络保险平台。
