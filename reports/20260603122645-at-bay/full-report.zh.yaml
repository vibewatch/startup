      - number: '1.6'
        title: 反向因素与风险信号
        blocks:
          - type: paragraph
            body: >
              评估 At-Bay 时，几个结构性和运营性风险因素需要重点关注。

              第一，网络保险市场本身处在持续走软阶段，给全行业利润率带来压力。美国网络险市场 2024 年收缩 7%（NAIC 数据）——这是直接承保保费首次下降。Dual Group 2026 年 4 月分析预计，美国网络险
              2026 年综合成本率为 97%；如果走软延续，2027 年可能进入不盈利区间。美国价格从 2023 年 Q4 到 2025 年 Q4 下降 13%。At-Bay 作为自留 15%
              风险的专业承保公司，在损失率恶化时会直接暴露在盈利压力下。

              第二，At-Bay 自身理赔数据揭示了艰难的损失环境。2026 InsurSec Report 记录，2025 年平均赔案严重度达到历史高点 $221,000，勒索软件赔案严重度为 $508,000，同比上升
              16%。第三方责任索赔 2025 年激增 70%。报告还显示，小企业——At-Bay 的核心市场——严重度上升最陡（收入低于 $25M 的公司上升 40%）。这些趋势会直接转化为更高预期损失。

              第三，Relay Platform 的收购和关停是一个反向里程碑。At-Bay 投资了一家数字经纪投放平台（约 2022 年 8 月收购），不到两年后将其关闭，2024 年 8 月 6 日生效。关停影响约 25
              名员工，管理层需要解释已投入资本和已实现的战略价值。

              第四，At-Bay 尚未盈利。作为私营公司，公司没有披露 EBITDA 或净利润。在已融资约 $296M、2024 年收入 $155M 的背景下，增长投入、理赔成本和运营费用之间的平衡没有公开透明度。

              第五，CEO Rotem Iram 周边的关键人物集中风险显著——他是 InsurSec 战略的主要架构师和公开门面。
