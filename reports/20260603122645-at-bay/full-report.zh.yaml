        title: 平台架构：Stance 叠加保险数据、安全遥测与合作伙伴检测引擎
        blocks:
          - type: paragraph
            body: >-
              At-Bay 的技术架构不是从零搭建完整安全栈，而是在第三方检测引擎之上叠加自研风险情报。CrowdStrike Falcon XDR 为 MDR Endpoint 提供终端检测引擎；该合作在 2024 年 1
              月 31 日与 Stance MDR 产品一起宣布。SentinelOne Singularity 支撑 2025 年 7 月 15 日推出的 MXDR 平台。根据 At-Bay
              信任页面，所有投保人数据都托管在仅位于美国境内的 AWS 基础设施上。Relay Platform 于 2022 年 8 月 22 日被收购，并作为独立的专业保险数字市场保留，承担 At-Bay
              经纪渠道的分发基础设施。Partner API v2 提供异步报价生成，p90 延迟低于 40 秒，使用 JWT 认证，并以程序化方式执行备案经纪人清查；API 文档公开托管在
              GitHub。保险数据、检测合作伙伴的遥测数据和数字分发层三者结合，构成 At-Bay 所称 InsurSec 差异化的三边技术护城河。架构在接口层面可观察，但承保模型和 SOC 工具内部并不透明。
