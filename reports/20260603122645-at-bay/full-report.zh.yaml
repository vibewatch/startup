      - number: '3.2'
        title: 直接 InsurTech MGA 同业
        blocks:
          - type: paragraph
            body: >
              Coalition 是 At-Bay 最重要的直接竞争对手。截至 2026 年，Coalition 全球约有 100,000 名有效投保人，约为 At-Bay 53,000 名的 2x，毛承保保费超过
              $650M。Coalition 的技术护城河来自 Coalition Control 平台（持续外部监控、零日预警、第三方风险管理和可选的 Wirespeed ADR）、准许承保公司 Coalition
              Insurance Company（CIC，AM Best A- 评级），以及 2026 年 5 月宣布的 Allianz 合作，后者授予其 10 年全球分销权。Allianz 交易是
              Corvus/Travelers 收购以来 InsurTech 网络险板块最不对称的竞争进展：它把 Coalition 的分销大幅延伸到 At-Bay 目前依赖的美国经纪人渠道之外。Coalition
              的关键反向信号，是美国投保人从 2022 年约 160,000 名降至 2025 年约 110,000 名、随后全球回升至 100,000+ 的过程缺乏解释；这引发组合质量和定价纪律问题，部分抵消其规模优势。


              Cowbell（加州 Pleasanton；2019 年创立）累计融资 $208.3M，其中包括 Zurich Insurance Group 投入的 $60M Series C。Cowbell 面向
              SME，使用 AI 驱动的 Cowbell Factor 风险评分，但不运营自有承保公司；它通过 Zurich North America 和 Swiss Re 分配容量。2025 年 6 月 Zurich
              Select Plus 模块化多险种 E&S 产品上线，标志着 Cowbell 从纯网络 MGA 向多险种专业平台演进；2025 年 11 月品牌刷新也释放了同样信号。相较 At-Bay 的 E&S
              承保公司（At-Bay Specialty Insurance Company，AM Best B++）和 Coalition 的准许承保保单纸，Cowbell
              没有自有保单纸，是实质结构性劣势，因为这限制精算数据反馈闭环和定价灵活性。


              Corvus/Travelers（马萨诸塞州 Boston；2024 年 1 月由 Travelers 以约 $435M 收购）现在作为 Travelers 的 AI 驱动网络承保能力运行。Corvus 通过
              CrowBar 平台整合绑定前的持续威胁扫描，向投保人交付实时风险仪表盘，并交叉销售到 Travelers Aa2/AA 评级的全球商业险分销体系。收购后，Corvus 扩展到欧洲大陆市场；At-Bay
              还没有这种地理触达。Travelers 组合是最强的机构型竞争者：在风险评分用途上，它拥有与 At-Bay Stance 平台相当或更好的承保技术（虽然 MDR 深度不及），同时分销能力高出一个数量级。


              Resilience（纽约；2016 年创立；4 轮融资共 $217M，包括 2023 年 7 月 $100M Series D）聚焦收入约 $200M 以上的企业账户，用定量网络风险建模和 CISO
              级互动来差异化。美国收入超过 $1B 的企业中，已有超过 10% 采用 Resilience 平台。Resilience 不是 At-Bay 的直接 SMB 竞争对手；但在 At-Bay 新产品线（收入最高
              $5B、保额最高 $10M）正在扩展的中型市场和企业段，它是有意义的竞争对手。
