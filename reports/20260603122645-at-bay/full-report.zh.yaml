            body: >-
              At-Bay 的信任姿态由 SOC 2 Type II 认证和一项明确政策支撑：所有客户数据存储在美国境内的 AWS 基础设施上。信任页面还声称，不使用投保人数据训练 AI
              模型，并由基于角色的访问控制管理用户如何操作 Stance 仪表盘。At-Bay Insurance 与 At-Bay Security LLC
              的法律隔离，在保险实体和安全服务子公司之间提供结构性边界；但网络安全运营所需监管许可的精确细节没有公开列明。公开信任姿态的实质限制包括：SOC 2
              范围边界没有在公开可访问资料中详细说明；加密标准只是被声称，并未列举；支撑认证的第三方审计报告未公开发布。企业买家评估平台时，这些缺口意味着尽调需要直接接触 At-Bay，取得审计材料、数据处理协议，以及支撑
