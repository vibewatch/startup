      - number: '4.4'
        title: 索赔经济性、赔付率压力与市场逆风
        blocks:
          - type: paragraph
            body: >
              FSLSO 监管申报最清楚地揭示了 At-Bay 的赔付经济性。At-Bay Specialty Insurance Company 报告 2024 年已发生损失率为 68%，综合成本率为 102%；2023
              年分别为 50% 和 98%。已发生损失从 2023 年的 $14.9M 增至 2024 年的 $29.2M，增长 97%。承保结果从盈利 $1.2M 转为亏损 $1.3M。经营现金流从 2023 年的正
              $34.1M 恶化为 2024 年的负 $10.7M，$44.8M 的摆动反映赔付支付加速。2024 年税后净利润为 $955K，较 $1.29M 下降 26%。


              At-Bay 自有的 2026 InsurSec Report（基于 100,000+ 个保单年和 6,500+ 起索赔）记录，2025 年网络索赔频率同比上升 7%，平均严重度达到创纪录的
              $221,000。勒索软件严重度上升 16% 至 $508,000，87% 的勒索攻击源自远程访问工具。Akira 勒索软件在 2025 年占勒索索赔超过 40%，是 At-Bay
              有记录以来最高的单一变种集中度。金融欺诈仍是最常见事件类型，占索赔 30%，平均被盗金额上升 16% 至 $285,000。第三方责任严重度同比跃升 70%。At-Bay 索赔团队在 2025 年追回 $56M
              被盗金融欺诈资金；若三天内报案，追回率为 70%。


              2024 年 7 月 CrowdStrike Falcon Sensor 宕机造成估计 $400M–$1.5B
              的全球已保险网络损失（CyberCube），是肯定式网络保险市场史上最大的单一已保险损失事件。市场层面，Munich Re 估计 2024 年全球勒索软件攻击频率约增加 25%；按 CoinLaw 引用 NAIC
              数据，美国网络保险行业赔付率 2024 年上升 7 个百分点至 49%。At-Bay 子公司 102% 的综合成本率说明，公司净自留账本在 2024 年出现承保亏损。At-Bay 2023 年 9 月裁员 27
              人（约占 305 人员工数 10%），反映运营成本上升下的结构调整。
