      - - 母公司层面现金余额与烧钱速度（post-Oct 2021）
        - 不知道当前流动性状况，就无法评估现金跑道
        - 要求提供董事会层面的财务更新和司库报告
      - - 再保险合约条款：限额、attachment、除外责任
        - 无法评估尾部风险暴露或系统性事件保障（例如 CrowdStrike 这类非恶意故障）
        - 审阅再保险协议；重点看系统性事件和非恶意除外条款
