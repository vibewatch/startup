  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与投资逻辑失效框架
        blocks:
          - type: paragraph
            body: >-
              At-Bay 位于四类风险的交叉点；单独看都可管理，合在一起要求很高。第一，也是最紧迫的，是承保与赔付率风险：2024 年 FSLSO 法定申报显示，综合成本率 102%，损失 $29.2M（同比增长
              96.7%），经营现金流为负 $10.7M；与此同时，保费组合一年内增长 345%。这种增速压缩了验证损失假设所需的成熟时间，并且发生在美国网络保险市场 2024 年首次录得 7%
              保费下降的背景下。第二类是系统性聚合风险：CrowdStrike 宕机证明，单一供应商故障可以同时触发数千张保单的相关索赔，而 At-Bay 集中于 SMB
              网络保险，敞口真实存在。第三类是法律与监管风险：LMA5567 战争除外诉讼、多州剩余线合规、SEC 网络披露规则，都会给一家快速扩张的 MGA
              增加义务，而公司未必有成熟的内部监管团队吸收。第四类是运营与人员风险：以色列承载 At-Bay 大部分研发，2026 年 3 月在“战争时期”裁撤 25 名工程师，让执行和人才留存不确定性出现在 MDR
              交付正是主要竞争差异点的时刻。第五类——财务模型与竞争风险——位于四项主要担忧之下，但同样真实：如果网络费率继续下降，MGA
              的承保费和利润佣金会被压缩，资产负债表更深或费用率更低的竞争对手可以更激进定价。下方风险热力图按可能性和影响严重度放置各风险域。最后一节的缓释与否决标准表定义，哪些事件会让投资逻辑变得不可投。
