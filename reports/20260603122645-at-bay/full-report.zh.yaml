      - number: '2.4'
        title: 增长驱动、监管催化与 MDR 采用
        blocks:
          - type: paragraph
            body: >-
              需求增长由三个相互强化的驱动支撑。第一，威胁经济账仍然沉重：Verizon 泄露数据和 IBM
              泄露成本研究显示，对缺乏成熟安全运营的公司来说，勒索软件、凭证泄露、业务中断和响应成本仍会造成实质财务影响。第二，监管提高了董事会和客户关注度：SEC 披露规则抬高上市公司治理和事件报告要求，NIS2
              则扩大欧盟重要和基本实体的网络风险管理义务。第三，MDR 采用把保险从被动赔付产品转成偏预防的服务包。IDC、Gartner、IBM 和 MDR 市场来源都把 MDR 视为成熟的托管安全品类；At-Bay 的
              Stance MDR 顺应这一趋势，向无法自建内部 SOC 能力的客户提供 24/7 监控、响应和修复。对 At-Bay 来说，驱动不只是保单需求增加；更重要的是贴附安全收入、改善损失筛选的可能性。
