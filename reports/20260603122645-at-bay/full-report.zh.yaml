      - number: '1.7'
        title: 展项
        blocks:
          - type: callout
            title: InsurSec 模型是结构性差异化来源
            body: >
              At-Bay 把保险和安全相结合，形成了真实的产品差异化，传统承保公司很难快速复制。嵌入式 Stance 工具每份保单价值最高 $70,000，在降低投保人风险的同时，也改善了 At-Bay 的损失率。MDR
              产品在约 18 个月内从不到 1,000 名客户增至 7,500 名客户，并产生 $13M 年化收入，说明产品市场匹配已经出现，也说明传统保险 GWP 之外存在收入多元化潜力。
            calloutType: strength
