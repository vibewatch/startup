          items:
            - label: InsurSec 承保模型
              detail: 将 Exposure Manager 发现和 MDR/MXDR 遥测接入定价。
            - label: InsurSec 理赔数据
              detail: 来自 40,000+ 投保人的理赔频率和严重度数据为模型提供输入。
        - label: 安全运营（At-Bay Security LLC）
          detail: 全资安全子公司运营 SOC、MDR 和 MXDR 服务。
          items:
            - label: SOC 运营
              detail: 为 MDR/MXDR 客户提供 24/7 告警分诊、遏制和事件响应。
            - label: Exposure Manager
              detail: 面向所有 Stance 投保客户持续扫描外部攻击面。
            - label: Fraud Defense
              detail: 防范社会工程和电汇欺诈的服务。
        - label: 检测技术合作伙伴
          detail: At-Bay 集成第三方检测引擎，而不是自建端点和邮件传感器。
