  - id: TR005
    title: 缓释与止损标准
    columns:
      - 风险领域
      - 可监测触发项
      - 阈值或事件
      - 投资含义
    rows:
      - - 承保与赔付率
        - 连续事故年的综合成本率趋势
        - 2025 事故年综合成本率超过 105%，或 2024 年保单组合的损失发展较首次报告的 102% 显著恶化。
        - 将承保模型视为受损；追加资本前要求精算深挖和再保险合约审查。
      - - Akira 勒索软件集中
        - 后续 InsurSec 报告中的 Akira 勒索软件索赔占比
        - Akira 占比升至 50% 以上，或到 2026 年中 MDR 加入数未能超过总投保人的 10%。
        - 两者同时发生会打破投资逻辑；部分触发则压低 MDR 差异化的估值溢价。
      - - 再保险容量与续约
        - Munich Re 续约条款和组合参与率
        - Munich Re 下次续约重定价超过 15%，或任何组合内再保险方拒绝续约；总保费 / 盈余比超过 350%。
        - 降低仓位；要求管理层在下一次资本事件前证明替代再保险容量。
      - - 以色列运营与 MDR 连续性
        - MDR 检测更新节奏和以色列员工数
        - 以色列工程员工数较 2026 年 3 月裁员后水平下降超过 30%，或 MDR 检测更新周期延长超过 60 天。
        - 重新评估 MDR 竞争护城河，并调整乐观情景中的概率加权上行。
      - - 网络险市场定价与收入模型
        - 美国网络险费率指数和 At-Bay 总保费增长
        - 美国网络险费率在 2026 日历年下降超过 10%，或 At-Bay DWP 增长连续两个季度同比转负。
        - 将其重构为困境增长型 MGA；保留完整仓位前，要求看到费用率下降或替代收入流证据。
    notes: 这些止损标准是监控工具，不是自动卖出信号。每个阈值都应触发加速尽调，而不是立即退出；因为管理层回应、再保险兜底、竞争动态等背景决定投资逻辑能否修复。
    claimRefs:
