  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与保险保费经济性
        blocks:
          - type: paragraph
            body: >
              At-Bay 的财务架构围绕两条相互连接的收入流：来自 E&S 网络险和 Technology E&O 业务的保险保费，以及来自 Stance
              平台的安全即服务订阅费。保险保费是主导收入驱动，完全通过批发经纪人和数字渠道分销。At-Bay 将约 85% 毛承保保费分出给 Munich Re 牵头的再保险团，自留后的价差成为净收入；母公司还按 2024
              年与 At-Bay Specialty Insurance Company 签署的 MGA 协议，作为总代理承保人（MGA）赚取管理和承保费用。


              Forbes 报道 At-Bay 2024 年总收入约 $155M，高于 2023 年的 $129M。Florida Surplus Lines Service
              Office（FSLSO）监管文件显示，At-Bay Specialty Insurance Company 的毛保费 2024 年增长 119% 至 $338.2M，再保险分出后自留净保费
              $49.9M。2023 年，公司录得毛保险保费 $301M；尽管全市场保费费率走软，规模仍较 2022 年增长 20%，合并层面净收入超过 $110M。2022 年，当 At-Bay 作为纯 MGA
              完全使用第三方 Munich Re（HSB）保单纸承保时，毛承保保费约达 $380M。


              2024 年，美国直接网络险承保保费下降 6% 至约 $9.14B（Fitch Ratings，2025 年 5 月），给整个板块带来结构性收入端逆风。网络再保险非比例费率在 2026 年 4
              月续约季按风险调整下降 32%（Gallagher Re 数据，由 actuary.info 报道），降低了再保险成本，但也释放出容量过剩信号，可能进一步压低原保险 保费费率。2024 年，$1M 保额的独立
              SMB 网络险年保费约为 $1,200–$2,200；进入 2026 年，费率预计保持持平到小幅为负。
