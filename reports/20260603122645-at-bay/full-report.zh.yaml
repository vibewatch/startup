        - 索取所有州的合规矩阵、保费税缴款记录和任何 DOI 往来文件；确认不存在未解决的盖章缺陷。
      - - SEC 网络披露规则外溢
        - SEC Rule 13e-3 的网络事件披露义务适用于 At-Bay 投保人；披露事件会驱动索赔，并可能引发承保争议。
        - 中
        - 中
        - At-Bay InsurSec 报告跟踪投保人事件趋势；公司监测包括监管驱动事件在内的索赔类型。
        - 评估保单措辞是否跟上 SEC 披露时点和范围；审查 2024–2026 年已提交的任何投保人监管通知索赔。
      - - NAIC 对系统性集中度的监管审查
        - NAIC 2025 Cybersecurity Insurance Report 将网络险保险人集中列为系统性监管关切；报告确认 At-Bay Specialty 是活跃的美国承保方。
        - 中
        - 中
