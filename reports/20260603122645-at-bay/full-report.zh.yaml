      - number: '3.6'
        title: 护城河韧性与竞争风险
        blocks:
          - type: paragraph
            body: >
              At-Bay 的主要竞争护城河包括：（1）100,000+ 保单年专有理赔数据，用于承保和风险评分；（2）Stance MDR 平台公开的 15 分钟平均修复时间（MTTR），作为技术差异点；（3）E&S
              承保公司身份，使其能获得承保控制权和定价反馈闭环，而 Cowbell 这类依赖容量的 MGA 拿不到。这些护城河真实存在，但正在被侵蚀：按投保人数量看，Coalition 的数据优势是 At-Bay 的
              2x，Coalition 的 Allianz 分销合作也已拉大分销差距。


              2026 年最实质的反向竞争证据，是 At-Bay 关闭 Relay 专业保险平台。At-Bay 2022 年收购 Relay，意在进入专业险种市场（管理责任险、专业责任险和其他非网络险种），但在
              2025–2026 年决定关停该平台。Relay 关停释放两层风险：第一，At-Bay 的多产品扩张雄心已经收缩，削弱其总可用市场论证；第二，Coalition 深化准许承保公司能力和 MDR
              平台期间，管理层带宽被 Relay 建设分走。反向信号还因一个事实而加重：多元化是 At-Bay Series D 叙事的一部分，逆转会带来可信度风险。


              Zurich-Beazley 收购（$10.9B，2026 年 3 月）是未来 5–7 年对 At-Bay 护城河最重要的单一结构性威胁。合并后的 Zurich-Beazley 将拥有 Beazley
              已验证的网络理赔专业能力（2024 年网络保费 $1.28B+）、Zurich 全球准许承保公司网络，以及以 InsurTech MGA 没有新一轮融资就无法匹配的规模投资事故前技术的资本。At-Bay
              没有与全球传统保险公司的合作关系来抵消这种规模整合——Coalition 的 Allianz 交易正是 At-Bay 缺少的对等机制。


              来自安全厂商（CrowdStrike、SentinelOne、Arctic Wolf、Huntress）的商品化压力真实存在，但偏中期。随着 MDR 定价下降、MSP
              渠道渗透加深，对于已经从其他厂商购买托管安全的买方，At-Bay Stance 平台的捆绑安全价值会变窄。15 分钟 MTTR 主张和 MDR $13M ARR 的独立产品收入，是防御信号：At-Bay
              正在主动尝试打造一个不依赖保险包的安全业务。如果成功，这种拆分会让安全产品独立成立，从而强化护城河。
