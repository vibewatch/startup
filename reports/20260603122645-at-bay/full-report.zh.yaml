        - 跟踪 NAIC 网络工作组产出；索取管理层监管沟通日志和任何即将到来的检查安排。
      - - 国家级攻击归因与承保模糊性
        - 当攻击者有国家背景、但政府机构未正式认定攻击为战争行为时，LMA5567 会制造承保灰区。
        - 高
