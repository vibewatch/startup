      - number: '2.2'
        title: TAM/SAM/SOM 与相互矛盾的市场估算
        blocks:
          - type: paragraph
            body: >-
              可支撑的 TAM 是全球商业网络保险保费，2024–2025 年约 $15B-$17B，取决于来源以 Munich Re 全球 GWP、Swiss Re 增长分析、Gallagher 经纪人展望，还是美国
              NAIC DWP 为锚。NAIC 的 $9.14B 美国 2024 DWP 是最强监管基线，但不是全球 TAM；Munich Re 的 2024 年 $15.3B 和 2025 年 $16.3B
              估计更适合作为全球保费口径。At-Bay 的 SAM 更窄：通过经纪人销售给美国 SMB 和中型市场的网络保险，并有来自准许承保和盈余险产品以及单独 MDR 贴附的上行空间。SOM
              还要再为经纪人触达、风险胃口、州可用性、竞争承保公司、再保险容量，以及愿意单独为 MDR 付费的买方占比未知而打折。最重要的矛盾在于：风险暴露数量可以增长，但费率同时走软，所以即使采用率改善，保费 TAM
              也可能看起来持平。
