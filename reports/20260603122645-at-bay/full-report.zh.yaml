      - number: '4.2'
        title: Stance 安全订阅与双收入扩张
        blocks:
          - type: paragraph
            body: >
              At-Bay 的 Stance 平台把 40,000+ 个已承保客户关系，转成安全即服务的增购入口。Stance 托管检测与响应（MDR）在 2023 年 10 月作为可选 MDR 订阅推出，客户数从 2023
              年不足 1,000 家增长到 2024 年底 7,500 家，贡献约 $13M 年化订阅收入。装机客户渗透率约 18.75%（7,500 / 约
              40,000），说明交叉销售仍有实质上行空间，但产品商业化还处在早期。


              Stance 平台打包漏洞扫描、暗网监控、AI 驱动的邮件欺诈警报、vCISO 咨询服务和员工安全培训；At-Bay 称，每张保单内嵌 $70,000 的安全工具价值（Insurance
              Business，2025 年 7 月五星评价）。单独 MDR 定价未公开；按披露的 7,500 个客户 / $13M ARR 比例倒推，Stance 单客户年收入约 $1,733，与 SMB 细分市场的 MDR
              定价大体一致。At-Bay 官网披露 1.5M 个受监控资产、威胁平均修复时间 15 分钟，凸显运营规模。


              Stance 订阅层带来有意义的战略选择权：它降低 At-Bay 对保险费率周期的依赖，并提供毛利率更高的经常性收入。不过，Stance 收入（$13M）相较合并净收入（约 $155M）仍小，约占总额
              8.4%。Stance 的独立毛利率、流失率、CAC 和净收入留存率未公开。Akira 勒索软件在勒索索赔中占比超过 40%，说明威胁行为者集中风险可能同时影响保险赔付率和 Stance MDR 服务范围。
