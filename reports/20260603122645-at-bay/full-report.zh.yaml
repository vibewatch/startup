      - number: '3.7'
        title: 展项
        blocks:
          - type: callout
            title: Relay 关停：反向执行信号
            body: >-
              At-Bay 决定关闭 Relay 专业保险平台（2022 年收购，2025–2026 年关停），是本章最实质的反向竞争信号。关停说明 At-Bay 的多险种多元化论证——Series D
              叙事的一部分——没有执行出来。2022–2025 年投入 Relay 的资本和管理层注意力，从 Stance MDR 深化和承保公司评级提升中被分走；同一时期，Coalition 建起准许承保公司能力，并拿下
              Allianz 合作。投资人应要求管理层清楚说明 Relay 经济账、决策时间线，以及组织层面吸收了哪些教训。
            calloutType: risk
            claimRefs:
              - CP036
              - CP039
          - type: callout
            title: Zurich-Beazley：传统巨头威胁重置
            body: >-
              Zurich 以 $10.9B 收购 Beazley（2026 年 3 月宣布）从根本上改变了 At-Bay 面对的传统保险公司威胁格局。合并后的 Zurich-Beazley 将拥有 $1.28B+
              网络保费、全球准许承保保单纸、Beazley 已验证的 BBR 理赔能力，以及 Zurich 资产负债表资本，能以任何 InsurTech MGA
              都无法靠内生方式匹配的规模投资事故前技术。这不是即时替代威胁——整合一笔 $11B 收购通常需要 18–36 个月——但它重置了 5 年竞争账。At-Bay 需要在 Zurich-Beazley
              整合完成前，拿出全球分销答案（类似 Coalition 的 Allianz 交易）。
            calloutType: risk
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP020
              - CP021
          - type: callout
            title: MDR 独立收入（$13M ARR）是防御型护城河信号
            body: >-
              At-Bay 的 Stance MDR 2024 年达到 $13M 独立 ARR（2023 年不到 $1M），并有 7,500 名专门安全客户（非保险 MDR
              买方），说明安全平台脱离保险包也可成立。这种拆分有战略意义：如果 At-Bay 能把 Stance MDR 做成独立产品，就会创造第二条收入流，也证明安全价值真实到足以在没有保险补贴时被购买。这也为回应
              Huntress/Arctic Wolf 替代威胁提供反论点——选择 Stance 而不是 Huntress 的买方，是基于安全能力，而不是价格。
