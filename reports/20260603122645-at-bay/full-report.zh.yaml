      - number: '7.4'
        title: 运营、人员与 MDR 执行风险
        blocks:
          - type: paragraph
            body: >-
              At-Bay 的竞争差异化建立在三个运营密集型支柱上：通过 MDR 产品进行主动安全监控，来自主动扫描的深度承保数据，以及面向 SMB
              投保人的快速索赔处理。每个支柱都依赖以色列研发中心，那里承载了大部分工程、数据科学和安全研究人才。2026 年 3 月裁撤 25 名工程师，被 calcalistech.com
              描述为发生在“战争时期”，在两个维度上构成负面信号：它说明冲突环境已经带来足以削减员工数的成本压力；也削弱了负责维护和扩展 MDR 检测逻辑的团队产能，而 Akira 正在演进战术。MDR 是 At-Bay
              最清晰的差异化主张——2025 年没有 MDR 客户提交 Akira 索赔——但市场增长很快，且吸引资本充足的竞争者。Grand View Research 预测全球 MDR 市场到 2030 年达到
              $9.5B；Coalition 和其他网络 MGA 正在自建或收购 MDR 能力；传统安全厂商则把保险作为附加项打包。如果 At-Bay 的 MDR 质量因工程人才流失而下降，竞争者将在 12 到 18
              个月内追平执行差距。经纪与分发依赖构成第二个运营风险：At-Bay 通过指定经纪人和批发商网络承保，一旦经纪人偏好转向价格更好、覆盖更广或佣金结构更有吸引力的竞争对手，支撑 MDR
              数据优势的保单数量会被侵蚀。根据 InsurSec report，邮件欺诈在 2026 年超过勒索软件成为头号索赔类型，说明检测问题的变化速度快过任何单一产品的预判。下方人员和伙伴风险登记表列出这两个维度。
