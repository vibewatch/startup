  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义：At-Bay 将主动安全服务打包进每一张网络保险保单
        blocks:
          - type: paragraph
            body: >-
              At-Bay 将自身产品定位为 InsurSec：保险与网络安全结合的产品，超越赔付，主动降低投保人风险。每张网络保单都包含 Stance，这是 At-Bay 自研安全平台，由其全资子公司 At-Bay
              Security LLC 运营。Stance 分为三档服务：Core（Exposure Manager、Fraud Defense、Security Awareness Training 和 vCISO
              咨询）、Advanced（Core 加上由 CrowdStrike Falcon XDR 支撑的 MDR Endpoint）以及 Complete（Advanced 加上 MDR Email）。第四条线 MXDR
              在 2025 年 7 月推出，由 SentinelOne Singularity 提供能力，把检测延伸到中端市场投保人的终端和邮件面。平台在 2024 年 4 月增强，加入钓鱼模拟、Microsoft 365 与
              Google Workspace 监控集成，将公司声称的综合风险覆盖率推至 66%。2024 年 6 月 3 日，承保限额扩大到服务收入最高 $5B 的企业、每张保单最高
              $10M，反映公司有意上探更大客户。按公司材料，每张保单内嵌的 Stance 服务价值约 $70,000–$72,000；相较将安全附加项单独定价或根本不提供的保险公司，这是重要差异点。
