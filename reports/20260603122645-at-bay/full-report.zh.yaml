      - number: '2.3'
        title: SMB 买方、用户、付款人与采用路径
        blocks:
          - type: paragraph
            body: >-
              At-Bay 的目标账户通常不是 Fortune 500 风险管理部门，而是 SMB
              或中型市场公司；它们购买网络险，往往由经纪人建议、客户合同要求、贷款方或董事会压力、事故后担忧，或续保时的承保问题触发。经济买方常常是业主、CFO、财务主管 或风险 / 财务负责人；MDR 和主动监控的日常用户是
              IT 经理、托管服务提供商或安全负责人；渠道守门人则是经纪人。这种拆分既带来杠杆，也带来摩擦。经纪人能高效引入 At-Bay 的保险加安全主张，但 MDR 预算可能在 IT 手里，保费预算在财务手里。At-Bay
              准许承保的小企业产品和经纪人认可的预防优先策略扩大了触达面；CrowdStrike 合作和 Stance MDR 则支撑安全用户侧理由。
