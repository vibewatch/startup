              - CV044
      - number: '8.7'
        title: 证据要点
        blocks:
          - type: callout
            title: 建议：继续研究，而非买入
            body: At-Bay 具备可信的 InsurSec 差异化，但若没有私人层面的损失、Stance 和优先权数据，公开证据还不足以支持在估计 $2.1B 估值或更高位置买入。
            calloutType: recommendation
            claimRefs:
              - CV023
              - CV025
              - CV026
              - CV030
          - type: callout
            title: 承保证明是支点
            body: 102% 综合成本率和网络保险定价走软，是最可能把溢价估值拖成下行保险案例的两个事实。
            calloutType: risk
            claimRefs:
              - CV005
              - CV017
              - CV020
              - CV041
          - type: callout
            title: Stance 是倍数扩张期权
            body: 只有当 Stance MDR 成为耐久、高毛利的经常性收入，并被证明能降低保险损失时，它才能支持更高倍数。
            calloutType: insight
            claimRefs:
