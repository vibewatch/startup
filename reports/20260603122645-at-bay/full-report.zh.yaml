      - number: '8.3'
        title: 融资背景、入场纪律与优先权悬置
        blocks:
          - type: paragraph
            body: >-
              At-Bay 清晰的公开融资锚点仍是 2021 年 Series D：融资 $185M，投后估值 $1.35B；根据背景财务来源，之后又获得额外资本延展。Forbes 和 Latka
              提供当前收入框架，但都不能取代新股融资标记。这一点重要，因为 2021 年后，后期网络保险倍数已经重置：公开市场保险科技
              投资者现在关注损失控制、盈利能力和资本强度。因此，有纪律的入场应基于当前收入和法定经济性承保，而不是基于独角兽标签。优先权悬置是重要的私募市场风险。近 $300M
              披露资本很可能带有清算优先权；若退出价值低于当前优先股堆叠加累计优先权，普通股经济性可能与头部企业价值大幅不同。新资金签署前应要求优先权平价、参与上限和反稀释审查。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV016
              - CV029
              - CV030
              - CV045
          - type: figure
