      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              情景区间有意拉宽，因为最影响估值的变量都在私域。乐观情景达到约 $2.8B–$3.5B：收入复合增速超过 25%，Stance 成为高毛利第二收入线，MDR 证据降低损失，综合成本率改善到 95%
              以下。基准情景约为 $1.4B–$2.1B：At-Bay 仍是强劲的网络 MGA / 承保载体，Stance 有中等贡献，但承保改善逐步推进，估值仍绑定收入加战略稀缺性。悲观情景为
              $0.7B–$1.1B：综合成本率持续高于 100%，保费率继续走软，再保险人要求更差条款，或勒索软件集中度压过预防能力。下行触发因素直接映射到风险章节：赔付率恶化、再保险收缩、MDR 执行失败和市场价格压缩。
