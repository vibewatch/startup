      - number: '4.3'
        title: 承保载体结构、资本充足性与再保险面板
        blocks:
          - type: paragraph
            body: >
              At-Bay 在 2023 年 8 月完成从 MGA 到承保载体的转型，开始由 At-Bay Specialty Insurance Company（NAIC 19607）签发所有新的 E&S Cyber 和
              Tech E&O 保单；该公司是其 2023 年 1 月从 XL Insurance America 收购的特拉华州注册子公司。该实体原名 XL Select Insurance Co.（1965 年成立），在
              44 个州具备准入资格，并已有成熟监管足迹。AM Best 在 2023 年 4 月给予 A-（Excellent）评级和稳定展望，使 At-Bay 能参与要求评级承保纸的经纪配置。Insurance
              Business 称 At-Bay 是首家成为 E&S 承保载体的网络保险科技公司。转型前，At-Bay 使用 HSB Specialty Insurance Company 承保纸（AM Best
              A++，Munich Re 子公司）。


              At-Bay Specialty Insurance Company 的 FSLSO 2024 年度申报显示，截至 2024 年底，总认可资产为 $223.9M，资本与盈余为 $101.2M；到 2025 年
              Q2 快照时仍大体稳定在 $100.7M。总保费 / 盈余比率达到 334.2%，高于 NAIC 通常区间（IRIS #4、#6、#10 被标记），反映中等资本基础上保费快速放大。母公司层面，At-Bay
              Inc. 已累计募集外部资金 $292M：2021 年 7 月 Series D 轮融资 $185M，估值 $1.35B，并在 2021 年 10 月由 ION Crossover Partners 追加
              $20M。2021 年 10 月后未宣布新的融资。


              截至 2024 年，再保险面板由五家授权再保险人组成：Münchener Rückversicherungs-Gesellschaft、Skyward Specialty Insurance Group、AXA
              SA、W.R. Berkley Corp. 和 Fairfax Financial Holdings；它们均为美国非关联或非美国授权机构，2024 年申报中逾期再保险追偿为零。At-Bay 自留约 15%
              的保险风险。根据 Gallagher Re 数据，2026 年 4 月续约时网络再保险非比例费率下降 32%，对 At-Bay 分出部分是积极成本信号，但也说明整体容量过剩，可能进一步压缩原始网络保险费率。
