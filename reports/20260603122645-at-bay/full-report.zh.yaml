  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: At-Bay 最高的剩余风险位于右上象限：Akira 集中度和综合成本率超标都属于高可能性、高影响。战争除外诉讼、系统性聚合和 Israel 扰动聚集在中高影响区间。财务模型压力和竞争压力在近期属于高可能性、中等影响。
    data:
      columns:
        - 中等影响
        - 高影响
        - 严重影响
      rows:
        - label: 高可能性
          values:
            - label: 网络险费率下行与 MGA 费用收入压缩
              tone: risk
              detail: 美国网络险费率 2024 年下跌 7%（NAIC），2024 年 Q4 又降 5%（WTW/Marsh）；MGA 费用收入随费率走。
            - label: Akira 集中度与赔付率压力
              tone: risk
              detail: 2025 年 Akira 驱动 >40% 勒索软件理赔；综合成本率已达 102%；精算模型面临由集中度带来的准备金不确定性。
            - label: DWP 快速增长带来的承保包袱
              tone: risk
              detail: $63M 到 $281M DWP 一年内跃升，压缩队列成熟时间；保费 / 盈余 334% 超过典型 MGA 阈值。
        - label: 中等可能性
          values:
            - label: 经纪人分销集中度浮出水面
              tone: risk
              detail: 批发经纪依赖度未披露；头部经纪人转向会压缩提交流，速度快于新任命能弥补的节奏。
            - label: Israel R&D 扰动与 MDR 质量下滑
              tone: risk
              detail: 2026 年 3 月在活跃冲突区裁掉 25 名工程师；MDR 检测逻辑依赖 Israel 团队持续更新威胁情报。
            - label: 再保险人重新定价或撤回能力
              tone: risk
              detail: 前五大再保险人控制全球网络再保险市场 62%；Munich Re 退出会迫使项目立即重组。
        - label: 低可能性
          values:
            - label: MDR 竞争差距收窄
              tone: neutral
              detail: Coalition、Corvus 和安全厂商正在建设 MDR 相邻能力；若 At-Bay 不持续投入 R&D，差距会在 2–3 年内收窄。
            - label: 战争除外诉讼制造未覆盖理赔
              tone: risk
              detail: Stryker LMA5567 案确立不利先例；随着地缘政治网络活动增加，国家行为体归因争议会反复出现。
            - label: 系统性聚合事件击穿再保险
              tone: risk
              detail: SMB 云栈发生 CrowdStrike 级事件，可能产生超过再保险走廊的相关损失；行业已建模但未充分定价。
    claimRefs:
      - CR001
      - CR008
      - CR012
      - CR013
      - CR014
      - CR016
      - CR027
      - CR028
      - CR039
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: At-Bay 的主要风险沿两条平行链条传导：一条是承保链，从 Akira 持续存在，到赔付率压力，再到再保险重新谈判；另一条是运营链，从 Israel 扰动，到 MDR 质量侵蚀，再到竞争暴露和投保客户流失。
    data:
      nodes:
        - id: N1
          label: Akira 集中度持续
          detail: Akira 勒索软件驱动 >40% 理赔；执法行动或 Akira 战术转向会迅速改变损失轨迹。
          tone: risk
        - id: N2
          label: 赔付率恶化
          detail: 综合成本率升至 105% 以上；2024 账簿的不利发展进一步叠加。
          tone: risk
        - id: N3
          label: 再保险人重新定价或退出
          detail: Munich Re 或其他面板再保险人在续约时要求更高费率，或拒绝续约。
          tone: risk
        - id: N4
          label: 项目经济性被压缩
          detail: MGA 费用收入和利润佣金下降；承保亏损扩大。
          tone: risk
        - id: N5
          label: 需要融资
          detail: 经营现金流为负；需要新资本在利润率被压缩时继续支撑增长。
          tone: risk
        - id: N6
          label: Israel 扰动加剧
          detail: 冲突升级导致人才流失或办公室关闭，超过 2026 年 3 月裁员水平。
          tone: risk
        - id: N7
          label: MDR 检测质量下降
          detail: 威胁情报更新变慢；Akira 和新变种检测落后于竞争工具。
          tone: risk
        - id: N8
          label: 竞争差距收窄
          detail: Coalition、Corvus 和安全厂商缩小 MDR 能力差距。
          tone: risk
        - id: N9
          label: 投保客户流失上升
          detail: 经纪人转向成本更低或 MDR 能力相当的竞争对手；续保率下降。
          tone: risk
        - id: N10
          label: 估值倍数压缩
          detail: 更高赔付率、更弱 MDR 护城河和资本需求共同作用，重定价 2021 年 $1.35B 基准。
          tone: risk
      edges:
        - from: N1
          to: N2
          label: 勒索软件理赔激增
        - from: N2
          to: N3
          label: 赔付率突破触发重新谈判
        - from: N3
          to: N4
          label: 再保险成本上升或能力下降
        - from: N4
          to: N5
          label: 盈利缺口需要外部资本
        - from: N5
          to: N10
          label: 稀释与困境倍数
        - from: N6
          to: N7
          label: 工程流失拖慢检测更新
        - from: N7
          to: N8
          label: 检测缺口给竞争对手留下空间
        - from: N8
          to: N9
          label: 经纪人与投保客户迁移
        - from: N9
          to: N4
          label: 保费量下降叠加费用压缩
        - from: N2
          to: N10
          label: 承保亏损直接向投资者释放信号
        - from: N7
          to: N2
          label: MDR 变弱推高未入组账簿理赔
    claimRefs:
      - CR001
      - CR008
      - CR011
      - CR014
      - CR027
      - CR035
      - CR039
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: At-Bay 平台位于依赖链中心，链条横跨投保客户、经纪人、前端承保公司、再保险人、Israel R&D，以及同时作为再保险人和战略投资者的 Munich Re。任何单个节点变弱，都可能跨多层传导。
    data:
      nodes:
        - id: D1
          label: At-Bay MGA 平台
          detail: 核保、MDR 和理赔编排层。
          tone: neutral
        - id: D2
          label: SMB 投保人（~40,000）
          detail: 收入底盘；MDR 开通率决定赔付率改善幅度。
          tone: neutral
        - id: D3
          label: 批发与零售经纪商
          detail: 主要分销渠道；集中度未披露。
          tone: risk
        - id: D4
          label: Trisura Specialty（出单载体）
          detail: 提供非准入保险资质；准入市场通道覆盖全美 50 州。
          tone: risk
        - id: D5
          label: Munich Re / HSB（主再保方 + 投资方）
          detail: 提供再保险容量，并让战略资本保持同向。
          tone: risk
        - id: D6
          label: 再保险团（另有 4 家）
          detail: Skyward Specialty、AXA SA、W.R. Berkley、Fairfax 提供剩余容量。
          tone: risk
        - id: D7
          label: 以色列研发中心（~340 人）
          detail: MDR 检测逻辑、核保模型、威胁情报。
          tone: risk
        - id: D8
          label: 美国监管环境
          detail: NAIC 偿付能力规则、盈余线备案盖章、SEC 网络安全披露规则。
          tone: neutral
        - id: D9
          label: 网络威胁格局
          detail: Akira 勒索软件集中度、战争除外条款诉讼、新型欺诈路径。
          tone: risk
        - id: D10
          label: 竞争 MGA 与传统保险商
          detail: Coalition、Corvus、Cowbell 和传统保险商在 SMB 细分市场报价竞争。
          tone: risk
      edges:
        - from: D3
          to: D1
          label: 保单提交与续保
        - from: D4
          to: D1
          label: 准入保险资质接入与监管合规
        - from: D5
          to: D1
          label: 主再保险容量
        - from: D6
          to: D1
          label: 补充再保险容量
        - from: D7
          to: D1
          label: MDR 情报与核保数据
        - from: D8
          to: D4
          label: 偿付能力与牌照义务
        - from: D9
          to: D1
          label: 理赔负荷与承保范围争议风险
        - from: D1
          to: D2
          label: 保单与 MDR 服务交付
        - from: D2
          to: D3
          label: 续保与转介绍信号
        - from: D10
          to: D3
          label: 竞争性经纪商委任
