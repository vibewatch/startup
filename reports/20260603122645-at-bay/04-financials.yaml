- id: TI006
  title: Public Financial Gaps and Diligence Paths
  columns:
  - Missing Metric
  - Impact on Analysis
  - Diligence Path
  rows:
  - - Audited consolidated financial statements (At-Bay Inc.)
    - Cannot assess parent profitability, true cash position, or consolidated gross margin
    - Request audited financials under NDA as part of formal due diligence
  - - Segment P&L — Insurance vs. Stance MDR
    - Cannot evaluate relative profitability or strategic capital allocation between segments
    - Request management accounts segmented by business line
  - - Consolidated gross margin on insurance operations
    - Key underwriting profitability metric obscured by MGA/carrier fee structure
    - Obtain unit cost allocation between subsidiary carrier and parent MGA
  - - 'Stance MDR: gross margin, churn, CAC, NRR'
    - Cannot size MDR scalability or capital efficiency without SaaS metrics
    - Request cohort data and retention metrics from CFO
  - - Parent-level cash on hand and burn rate (post-Oct 2021)
    - Cannot evaluate runway without knowing current liquidity position
    - Request board-level financial update and treasurer presentation
  - - 'Reinsurance treaty terms: limits, attachments, exclusions'
    - Cannot assess tail risk exposure or systemic event coverage (e.g., non-malicious failures like CrowdStrike)
    - Review reinsurance agreements; focus on systemic event and non-malicious exclusion clauses
  - - IBNR reserves and actuarial loss development triangles
    - Loss ratio trajectory may be understated by lag in incurred-but-not-reported reserves
    - Request actuarial loss development triangles and reserve adequacy statement
  - - Customer or policy concentration (top 10 accounts by GWP)
    - Concentration risk amplifies loss volatility; SMB focus suggests low concentration but unconfirmed
    - Request top-10 revenue concentration data as part of underwriting file review
  notes: Gaps identified by comparing publicly available sources (FSLSO filings, Forbes, media) against standard insurance
    company due diligence requirements. Private company status means no SEC-grade disclosure obligations. The three flagged
    NAIC IRIS ratios (#4, 6, 10) at the subsidiary warrant management explanation given the 334.2% gross premium to surplus
    ratio.
