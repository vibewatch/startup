  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: consolidated financials
    missingEvidence: Audited consolidated income statement, balance sheet, and cash flow statement for At-Bay Inc. (parent
      entity); parent-level gross margin, EBITDA, and net profitability
    whyItMatters: The $155M revenue figure from Forbes is unaudited and rests on a single media source. Without consolidated
      financials, it is impossible to confirm At-Bay's profitability, assess cash adequacy, or understand the MGA fee/commission
      structure that bridges subsidiary net premium ($49.9M) to consolidated revenue ($155M).
    diligencePath: Request audited consolidated financial statements and management accounts under NDA as part of formal due
      diligence; specify at minimum a three-year income statement, balance sheet, and cash flow statement
    relatedQuestionRefs:
    - QI012
    - QI014
  - type: missing-source
    severity: material
    topic: Stance MDR unit economics
    missingEvidence: Stance MDR gross margin, customer acquisition cost (CAC), gross churn rate, and net revenue retention
      (NRR)
    whyItMatters: Without SaaS unit economics, it is impossible to assess whether Stance MDR is a profitable growth business
      or a below-cost loss-leader used to drive insurance penetration. At $13M ARR with undisclosed margins, the segment's
      contribution to At-Bay's financial health is entirely opaque.
    diligencePath: Request SaaS cohort analysis, MDR segment P&L, and unit economics summary from the CFO as part of commercial
      due diligence
    relatedQuestionRefs:
    - QI018
  - type: missing-source
    severity: material
    topic: parent-level capital adequacy
    missingEvidence: At-Bay Inc. parent-level cash on hand, monthly burn rate, and estimated runway as of mid-2026; no public
      financing since October 2021 ($292M cumulative)
    whyItMatters: The carrier subsidiary recorded negative operating cash flow of -$10.7M in 2024. Without parent-level liquidity
      data, it is impossible to assess whether At-Bay has sufficient capital to sustain operations, absorb claim volatility,
      or support Stance MDR growth without a new capital raise.
    diligencePath: Request board-level financial update and CFO presentation on parent liquidity, cash runway, and capital
      deployment plan
    relatedQuestionRefs:
    - QI014
  - type: missing-source
    severity: material
    topic: reinsurance treaty terms
    missingEvidence: Reinsurance treaty attachment points, per-occurrence and aggregate limits, exclusion clauses (particularly
      non-malicious system failure events), and reinstatement terms
    whyItMatters: The CrowdStrike July 2024 outage was non-malicious. If reinsurance treaties exclude non-malicious system
      failures, At-Bay's effective risk retention on CrowdStrike-type events is substantially higher than the disclosed 15%.
      This is a material tail risk that cannot be assessed without the reinsurance agreements.
    diligencePath: Review reinsurance treaty agreements with a focus on systemic event clauses, non-malicious failure exclusions,
      and reinstatement premium terms
    relatedQuestionRefs:
    - QI022
