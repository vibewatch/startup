- id: financial-gaps
  title: Financial Opacity, Revenue Quality, and Diligence Gaps
  body: 'At-Bay is a private company with no public consolidated financial statements. The $155M revenue figure derives from
    Forbes; the $110M net revenue figure for 2023 from media reporting of the Ken Riegler appointment; and subsidiary financials
    from FSLSO surplus lines regulatory filings. None of these sources provides audited consolidated income statements, balance
    sheets, or cash flow statements covering At-Bay Inc. as the ultimate parent. The FSLSO filings cover only At-Bay Specialty
    Insurance Company—one subsidiary—and cannot proxy for total company profitability, given that MGA commissions and fee
    income flow upward to the parent entity.


    Critical undisclosed metrics include: (1) consolidated gross margin on insurance operations; (2) Stance MDR gross margin,
    churn rate, CAC, and net revenue retention; (3) parent-level cash on hand and burn rate; (4) incurred-but-not-reported
    (IBNR) loss reserves; (5) reinsurance treaty limits, attachment points, and exclusion clauses; and (6) policy or customer
    concentration beyond sector-level disclosures. The three flagged NAIC IRIS ratios (#4, 6, and 10) at the subsidiary warrant
    direct management explanation, as does the combined ratio of 102% (implying underwriting unprofitability at the subsidiary
    ceded-net level even as the parent MGA earns commission income).


    Revenue quality risks include: market-wide premium rate softening (US DWP down 6% in 2024; further declines expected in
    2026); Akira ransomware accumulation risk (40%+ of ransomware claims from one threat actor); and the 85% GWP-to-net-revenue
    gap that makes top-line growth depend on reinsurance cession economics. No new external capital has been raised since
    October 2021 ($292M lifetime). The path to public markets or next-round financing requires demonstrated underwriting profitability
    at the consolidated level and improved financial transparency.

    '
