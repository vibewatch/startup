callouts:
- calloutType: risk
  title: Subsidiary Combined Ratio of 102% Signals Underwriting Pressure
  body: At-Bay Specialty Insurance Company's 2024 combined ratio of 102% indicates an underwriting loss at the E&S carrier
    subsidiary level. While the parent entity earns MGA fee and commission income not reflected in the subsidiary filing—and
    the consolidated entity may still be profitable—the 18-percentage-point deterioration in the losses incurred ratio (50%
    → 68%) in a single year is a material adverse trend. A sustained combined ratio above 100% at the subsidiary would intensify
    capital adequacy pressure given the 334.2% gross premium to surplus ratio and three flagged NAIC IRIS ratios.
  claimRefs:
  - CI020
  - CI021
  - CI022
- calloutType: insight
  title: Stance MDR Creates a Second Revenue Flywheel Insulated from Insurance Rate Cycles
  body: Stance MDR's $13M ARR and 18.75% penetration of the insured base represent an emerging software-like revenue stream
    that is not directly correlated with cyber insurance premium rate cycles. Unlike net premium income—which compresses when
    primary rates fall or reinsurance cession rates rise—MDR subscriptions provide recurring revenue regardless of insurance
    market conditions. The 81.25% of the insured base (roughly 32,500 eligible but not yet subscribing customers) represents
    a structurally important upsell opportunity for At-Bay's long-term financial profile.
  claimRefs:
  - CI006
  - CI007
  - CI008
- calloutType: risk
  title: Revenue Opacity Limits Consolidated Financial Assessment
  body: At-Bay's private status means the $155M revenue figure (Forbes) rests on a single unaudited media source. No new capital
    has been raised since October 2021 ($292M lifetime). The combination of rising claim severity, market-wide premium softening
    (US DWP -6% in 2024), a combined ratio above 100%, and absence of public financials creates a multidimensional diligence
    risk. Investors and counterparties require management engagement, review of consolidated accounts, and scrutiny of reinsurance
    treaty terms—particularly CrowdStrike-type non-malicious systemic event exclusions—before reaching firm financial conclusions.
  claimRefs:
  - CI001
  - CI029
  - CI031
  - CI033
