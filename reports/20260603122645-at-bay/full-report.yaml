      - number: '8.6'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              At-Bay is more strategically acquirable than IPO-ready on public evidence. The own-paper carrier, broker
              relationships, cyber claims data, and Stance platform would be attractive to a specialty carrier,
              reinsurer, or security vendor seeking cyber-insurance distribution. A near-term IPO is harder to support
              because public investors would demand consolidated GAAP revenue, loss-ratio history, reserves, reinsurance
              details, and a credible path to underwriting profitability. The final diligence package must close six
              gaps before any investment: current consolidated financials, loss triangles, reinsurance treaty terms,
              Stance cohort retention and gross margin, cap-table preferences, and broker concentration. Thesis-break
              triggers are explicit: combined ratio above 105%, worse reinsurance terms, stalled MDR attachment, or a
              down-round signal. If any two occur together, the valuation case should reset to the bear range.
            claimRefs:
              - CV031
              - CV032
              - CV041
              - CV042
              - CV043
              - CV044
          - type: table
            tableRef: TV006
            claimRefs:
