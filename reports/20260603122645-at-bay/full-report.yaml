      - number: '1.3'
        title: Funding History & Capital Structure
        blocks:
          - type: paragraph
            body: >
              At-Bay has raised approximately $295.7 million across six venture rounds since 2016, supported by a
              consortium of technology VCs, corporate venture arms from global insurance groups, and notable angel
              investors with cybersecurity operating experience.

              The seed round of $6 million in November 2017 was backed by Lightspeed Venture Partners and Shlomo Kramer,
              the Israeli serial entrepreneur who co-founded Check Point Software and Imperva. A $13 million Series A
              followed in 2018. The company raised $34 million in its Series B in February 2020, co-led by Munich Re
              Ventures (via its HSB fund) and Acrew Capital, with participation from Khosla Ventures, Lightspeed, Qumra
              Capital, M12 (Microsoft's venture fund), and Shlomo Kramer. A second $34 million Series C closed in
              December 2020, led by Qumra Capital, with M12 increasing its commitment alongside the existing syndicate.

              The pivotal Series D closed in July 2021 at $185 million, co-led by Icon Ventures and Lightspeed Venture
              Partners. Preeti Rathi (Icon Ventures) joined the board in conjunction with the financing. The round
              brought At-Bay's post-money valuation to $1.35 billion—unicorn status—and its cumulative funding to
              approximately $272 million at close. An extension of $20 million followed in October 2021 to bring total
              raised to approximately $292–$295.7 million (per company disclosure on the About page). Forbes Big Tech 50
              2024 estimated At-Bay's valuation at roughly $2.1 billion, reflecting growth since the 2021 primary round
              but unconfirmed by a new financing event.

              The investor base is weighted toward VC-backed growth capital (Icon Ventures, Lightspeed, Khosla, ION
              Crossover Partners) augmented by strategic insurance capital (Munich Re Ventures/HSB, Qumra Capital,
              Glilot Capital) and operating experience (Shlomo Kramer). There is no confirmed debt or credit facility in
              the public record. No secondary liquidity or secondary tender events have been publicly confirmed since
              the Series D.
