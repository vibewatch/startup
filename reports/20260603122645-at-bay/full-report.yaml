      - number: '8.5'
        title: Comparable Set and Valuation Multiples
        blocks:
          - type: paragraph
            body: >-
              The most relevant comparable set is mixed. Coalition defines the upper private cyber-insurance benchmark
              at a disclosed $5 billion Series F valuation, supported by broader scale and market leadership. Cowbell
              provides a lower-scale private financing reference without a public valuation mark. Corvus provides the
              most concrete M&A reference: Travelers paid about $435 million for a cyber-insurtech underwriting
              platform, showing strategic appetite but also setting a real exit data point far below unicorn-era private
              marks. Public insurtechs such as Lemonade, Hippo, and Root are imperfect because they are not
              cyber-specialists, but their filings and market data are useful for discipline: insurance-like digital
              models are valued on revenue quality, loss control, capital intensity, and profitability path. At-Bay
              deserves a premium to weak public digital carriers only if Stance and underwriting data demonstrably
              improve loss outcomes.
            claimRefs:
