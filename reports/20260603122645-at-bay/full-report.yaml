chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity & Business Model
        blocks:
          - type: paragraph
            body: >
              At-Bay, Inc. was founded in 2016 in San Francisco, California by Israeli entrepreneurs with deep
              cybersecurity and finance backgrounds. The company self-describes as the "InsurSec provider for the
              digital age"—a model that combines traditional insurance underwriting with embedded, proactive
              cybersecurity services under one corporate structure. Unlike conventional carriers that price and pay
              claims reactively, At-Bay continuously monitors the external attack surface of insured businesses, alerts
              policyholders to emerging vulnerabilities, and provides managed detection and response (MDR) capabilities
              directly through its security affiliate, At-Bay Security, LLC.

              The insurance side, operating through At-Bay Insurance Services, LLC (a licensed surplus-lines broker in
              all 50 states and D.C.) and an active full-stack insurance company, underwrites Cyber, Technology Errors &
              Omissions (Tech E&O), and Miscellaneous Professional Liability (MPL) policies. At-Bay retains
              approximately 15% of the underwritten insurance risk and cedes the remainder to large reinsurers, managing
              aggregate exposure while capturing the economics of risk selection and customer relationships. The
              cybersecurity side, At-Bay Security, LLC, offers At-Bay Stance MDR and Exposure Management as standalone
              products that non-policyholders may also purchase. This dual-entity structure allows At-Bay to market its
              insurance enhancements (reduced ransomware retention, automatic flat renewal) as incentives for
              policyholders to adopt the security platform.

              As of 2025, At-Bay operates in six offices globally, with its headquarters in San Francisco and a
              significant R&D and engineering hub in Tel Aviv, Israel. Its broker distribution network spans the US
              market, with 93 NPS on its broker platform. The company's go-to-market is exclusively through licensed
              insurance brokers, with no direct-to-policyholder binding.
