      - number: '7.4'
        title: Operational, people, and MDR execution risks
        blocks:
          - type: paragraph
            body: >-
              At-Bay's competitive differentiation rests on three operationally intensive pillars: proactive security
              monitoring through its MDR product, deep underwriting data from active scanning, and fast claims handling
              for SMB policyholders. Each pillar depends on the Israel R&D center, which houses the majority of
              engineering, data science, and security research talent. The March 2026 layoff of 25 engineers, described
              by calcalistech.com as occurring "in times of war," is adverse on two dimensions: it signals that the
              conflict environment has already produced cost pressures significant enough to reduce headcount, and it
              reduces the capacity of the team responsible for maintaining and extending MDR detection logic precisely
              when Akira is evolving its tactics. MDR is At-Bay's clearest differentiation claim—zero MDR customers
              filed an Akira claim in 2025—but the market is growing rapidly and attracting well-capitalized
              competitors. Grand View Research projects the global MDR market at $9.5 billion by 2030; Coalition and
              other cyber MGAs are building or acquiring MDR capabilities; and traditional security vendors are bundling
              insurance as an afterthought. If At-Bay's MDR quality degrades because of engineering attrition, a
              competitor closes the execution gap within 12 to 18 months. Broker and distribution dependence creates a
              second operational risk: At-Bay writes through a network of appointed brokers and wholesalers, and a shift
              in broker preferences toward competitors offering better pricing, broader coverage, or more attractive
              commission structures would erode the policy count that keeps the MDR data advantage relevant. Email fraud
              surpassing ransomware as the top claim type in 2026 (per the InsurSec report) indicates that the detection
              problem is shifting faster than any single product can anticipate. The people and partner risk registers
              below enumerate both dimensions.
