      - number: '4.3'
        title: Carrier Structure, Capital Adequacy, and Reinsurance Panel
        blocks:
          - type: paragraph
            body: >
              At-Bay completed its MGA-to-carrier transition in August 2023 when it began issuing all new E&S Cyber and
              Tech E&O policies under At-Bay Specialty Insurance Company (NAIC 19607), the Delaware-domiciled subsidiary
              acquired from XL Insurance America in January 2023. Formerly XL Select Insurance Co. (incorporated 1965),
              the entity carried eligibility in 44 states and a seasoned regulatory footprint. AM Best assigned an A-
              (Excellent) rating with stable outlook in April 2023, enabling At-Bay to compete for broker placements
              that require rated-paper carriers. Insurance Business described At-Bay as the first cyber InsurTech to
              become an E&S carrier. Prior to this transition, At-Bay wrote on HSB Specialty Insurance Company paper (AM
              Best A++, Munich Re subsidiary).


              At-Bay Specialty Insurance Company's FSLSO annual 2024 filing shows total admitted assets of $223.9M and
              capital and surplus of $101.2M at year-end 2024—broadly stable in the Q2 2025 snapshot at $100.7M. The
              gross premium to surplus ratio of 334.2% exceeded NAIC usual ranges (IRIS ratios #4, 6, and 10 flagged),
              reflecting rapid premium scaling on a moderate capital base. At the parent level, At-Bay Inc. has raised
              $292M in total external financing: $185M at the July 2021 Series D close at a $1.35B valuation, extended
              by $20M with ION Crossover Partners in October 2021. No new capital raises have been announced since
              October 2021.


              The reinsurance panel comprises five authorized reinsurers as of 2024: Münchener
              Rückversicherungs-Gesellschaft, Skyward Specialty Insurance Group, AXA SA, W.R. Berkley Corp., and Fairfax
              Financial Holdings—all US unaffiliated or non-US authorized, with zero overdue reinsurance recoveries per
              the 2024 filing. At-Bay retains approximately 15% of insurance risk. Cyber reinsurance non-proportional
              rates dropped 32% at the April 2026 renewal per Gallagher Re data, a positive cost signal for At-Bay's
              ceded portion but also indicative of broad capacity surplus that may compress primary cyber rates further.
