              - CV044
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: research-more, not buy'
            body: >-
              At-Bay has credible InsurSec differentiation, but public evidence does not yet support a buy at or above
              the estimated $2.1B valuation without private loss, Stance, and preference data.
            calloutType: recommendation
            claimRefs:
              - CV023
