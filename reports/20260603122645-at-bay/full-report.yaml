      - number: '3.4'
        title: MDR and Security Vendor Substitutes
        blocks:
          - type: paragraph
            body: >
              At-Bay's Stance platform bundles MDR, vulnerability scanning, and dark web monitoring as a
              force-multiplier for policyholders—reducing claim frequency and severity for insured businesses. The same
              services are available from standalone MDR vendors without an insurance component; as those vendors reduce
              price and improve accessibility for SMBs, they erode the differentiated value At-Bay extracts from its
              bundled model. This is a structural risk to At-Bay's moat, not an immediate displacement threat.


              Huntress (Columbia, MD; founded 2015) surpassed $100M in ARR in 2024, raised a $180M Series D at a $1.5B
              valuation, and had more than 4,000 MSP partner relationships as of early 2026. Huntress targets SMBs
              through the MSP channel—the same customer segment as At-Bay's core market—at a list price of approximately
              $8.99 per endpoint per month. Huntress competes directly with Stance MDR on ease of deployment and
              SMB-optimized pricing, though it does not bundle insurance or provide carrier paper. Huntress's
              MSP-channel dominance gives it distribution density in the SMB segment that At-Bay lacks through direct
              channels.


              Arctic Wolf (Eden Prairie, MN; founded 2012) filed an S-1 for a public offering in February 2026 and
              carries a valuation of approximately $4.3B. Arctic Wolf's estimated revenue reached approximately $913M in
              2026, growing from $541M ARR in 2024. Arctic Wolf targets mid-market organizations with a concierge-model
              MDR offering delivered through its Aurora Superintelligence Platform—5,500+ customers as of 2024. Arctic
              Wolf's mid-market focus overlaps with At-Bay's expansion upmarket, and its IPO process signals intent to
              accelerate commercial growth.


              CrowdStrike Falcon Complete and SentinelOne Vigilance Respond represent the enterprise-grade MDR tier.
              Both are priced above At-Bay Stance on a standalone basis, but they provide superior breadth of coverage
              (SIEM, identity threat detection, threat intelligence), superior detection rates for sophisticated
              adversaries, and independent brand recognition that some enterprise buyers prefer to At-Bay's integrated
              but carrier-linked MDR offering. CrowdStrike ($2B+ ARR, Nasdaq: CRWD) and SentinelOne ($700M+ ARR, NYSE:
              S) are not primarily insurance-linked competitors—but as SMB pricing for their managed tiers falls, the
              insurance bundling becomes less of an MDR cost differentiator for At-Bay.


              Palo Alto Networks Cortex XSOAR and Managed Threat Hunting represent another adjacent substitute for
              enterprises that have already deployed Palo Alto firewalls and SASE infrastructure. At-Bay does not
              compete directly in this tier today but faces the risk that any future enterprise expansion triggers this
              substitution.
            claimRefs:
