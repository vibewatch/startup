      - number: '1.6'
        title: Adverse Considerations & Risk Signals
        blocks:
          - type: paragraph
            body: >
              Several structural and operational risk factors warrant attention in evaluating At-Bay.

              First, the cyber insurance market itself is in a sustained softening phase that poses margin pressure
              across the industry. The US cyber market contracted by 7% in 2024 (NAIC data)—the first-ever reduction in
              direct written premium. Dual Group's April 2026 analysis projected a US cyber combined ratio of 97% in
              2026 and the potential for unprofitable territory in 2027 if softening persists. Prices declined 13% in
              the US from Q4 2023 to Q4 2025. At-Bay, as a specialist carrier retaining 15% of risk, faces direct
              earnings exposure when loss ratios deteriorate.

              Second, At-Bay's own claims data reveals a challenging loss environment. The 2026 InsurSec Report
              documented average claim severity hitting an all-time high of $221,000 in 2025, with ransomware severity
              at $508,000—up 16% year-over-year. Third-party liability claims surged 70% in 2025. The report also shows
              that small businesses—At-Bay's core market—are experiencing the steepest severity increases (40% for
              sub-$25M revenue companies). These trends translate directly into higher expected losses.

              Third, the acquisition and wind-down of Relay Platform is an adverse milestone. At-Bay invested in a
              digital broker-placement platform (acquired ~August 2022) and shut it down less than two years later,
              effective August 6, 2024. The wind-down affected ~25 employees and requires explanation of capital
              deployed and strategic value realized.

              Fourth, At-Bay is unprofitable. As a private company, it has not disclosed EBITDA or net income. With
              approximately $296M raised and $155M in 2024 revenue, the balance between growth investment, claims costs,
              and operational expenses is not publicly transparent.

              Fifth, key-person concentration risk around CEO Rotem Iram is significant—he is the primary architect and
              public face of the InsurSec strategy.
            claimRefs:
              - CO035
              - CO036
              - CO037
              - CO038
              - CO039
              - CO040
              - CO003
      - number: '1.7'
        title: Exhibits
        blocks:
          - type: callout
            title: InsurSec Model as Structural Differentiator
            body: >
              At-Bay's combined insurance-plus-security model creates genuine product differentiation that is difficult
              for traditional carriers to replicate quickly. The embedded Stance tools—valued at up to $70,000 per
              policy—lower policyholder risk while simultaneously improving At-Bay's loss ratio. The MDR product's rapid
              growth (fewer than 1,000 to 7,500 customers in roughly 18 months) with $13M in annualized revenue
              demonstrates both product-market fit and the revenue diversification potential beyond traditional
              insurance GWP.
            calloutType: strength
            claimRefs:
              - CO028
              - CO029
              - CO041
              - CO045
          - type: callout
            title: Cyber Market Softening & Loss Severity Pressure
            body: >
              The US cyber insurance market contracted in 2024 for the first time ever, and combined ratios are
              projected to approach or exceed 100% by 2027 under current softening trajectories. At-Bay's own claims
              data shows record average severity ($221K) and ransomware severity ($508K) in 2025. The company's 15% risk
              retention means these loss trends directly impact its economics. The convergence of rate softening and
              rising severity is a structural headwind that affects the entire market but tests specialist insurers like
              At-Bay disproportionately.
            calloutType: risk
            claimRefs:
              - CO036
              - CO037
              - CO038
              - CO040
          - type: callout
            title: Valuation Estimate Relies on Single Stale Proxy
            body: >
              At-Bay's ~$2.1B estimated valuation from Forbes Big Tech 50 2024 is an external estimate, not a primary
              market event. The last primary financing with a confirmed post-money valuation was the July 2021 Series D
              at $1.35B. Any valuation figure used in downstream chapters must be flagged as a secondary estimate with
              high uncertainty pending a new funding round or liquidity event.
