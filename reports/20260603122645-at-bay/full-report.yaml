      - number: '7.3'
        title: Underwriting, systemic, and reinsurance risks
        blocks:
          - type: paragraph
            body: >-
              The FSLSO annual 2024 statutory filing is the most granular public window into At-Bay's underwriting
              position. It shows direct premiums written of $280.6 million (up 344.9% from $63.1 million in 2023),
              losses incurred of $29.2 million (up 96.7% year on year), a combined ratio of 102%, and a gross premium to
              surplus ratio of 334.2%—well above the 300% threshold that AM Best identifies as a concern for fronted
              programs. The fronting structure itself concentrates risk: AM Best reaffirmed At-Bay Specialty at A-
              Excellent in August 2025, but the reinsurance panel of five—led by Munich Re/HSB, with Skyward Specialty,
              AXA SA, W.R. Berkley, and Fairfax behind—means that a simultaneous retrenchment by multiple reinsurers
              would either force premium reductions or require At-Bay to retain more net risk. Howden Reinsurance's 2025
              cyber report shows that the top five global cyber reinsurers hold 62% of market share, confirming that
              concentration exists on the supply side of capital as well. The Akira ransomware concentration is the
              single largest short-term underwriting threat: At-Bay's own 2026 InsurSec report states that Akira drove
              more than 40% of ransomware claims in 2025, which is actuarially dangerous because a single threat actor's
              operational tempo (law-enforcement disruption, negotiation strategies, target selection) can shift loss
              ratios by several points within a single quarter. Zero At-Bay MDR customers filed an Akira claim in 2025,
              which is a genuine mitigant, but only a small fraction of the total book is on MDR. Systemic aggregation
              adds a tail risk that is structurally underpriced across the industry: the CrowdStrike outage demonstrated
              that a single vendor failure can generate correlated losses across thousands of policies simultaneously,
              with Fortune 500 exposure estimated at $5.4 billion and the insured portion between $540 million and $1.08
              billion across all carriers. The risk transmission map below traces how Akira persistence and aggregation
              events flow into reinsurance renegotiation and ultimately policy-level economics.
            claimRefs:
