      - number: '8.3'
        title: Financing Context, Entry Discipline, and Preference Overhang
        blocks:
          - type: paragraph
            body: >-
              At-Bay's clean public financing anchor remains the 2021 Series D: $185 million at a $1.35 billion
              post-money valuation, later extended by additional capital according to contextual financial sources.
              Forbes and Latka supply the current revenue frame, but neither replaces a primary financing mark. That
              matters because late-stage cyber-insurance multiples reset after 2021: public insurtech investors now
              focus on loss control, profitability, and capital intensity. A disciplined entry should therefore be
              underwritten from current revenue and statutory economics, not from the unicorn label. Preference overhang
              is a material private-market risk. Nearly $300 million of disclosed capital likely carries liquidation
              preferences; if the exit clears below the current preferred stack plus accrued preferences, common-equity
              economics could differ sharply from headline enterprise value. New money should require preference parity,
              participation caps, and anti-dilution review before signing.
            claimRefs:
