  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              The US commercial cyber insurance market in 2026 is structured across four competitor tiers, each
              presenting a distinct threat to At-Bay's InsurSec positioning. The first tier—direct InsurTech
              peers—comprises Coalition, Cowbell, and Corvus/Travelers, all of which bundle some form of risk
              intelligence with insurance capacity. The second tier consists of incumbents: Beazley (being acquired by
              Zurich Insurance for approximately $10.9B, announced March 2026), Chubb, and AXA XL, which compete on
              financial strength, broker network depth, and multi-line cross-sell rather than pre-breach technology. The
              third tier is Resilience, an enterprise-focused InsurTech MGA that quantifies cyber risk for Fortune 1000
              CISOs and operates at a markedly higher account minimum than At-Bay. The fourth and most strategically
              underappreciated tier is standalone MDR/security vendors—Huntress, Arctic Wolf, SentinelOne Vigilance, and
              CrowdStrike Falcon Complete—whose MDR capabilities partially substitute for At-Bay's Stance platform
              without the insurance component.


              The global cyber insurance market reached an estimated $16.6B in gross written premiums (GWP) in 2026,
              growing at approximately 15% CAGR. The US accounted for roughly $10.2B of that total—roughly four million
              policies in force. MGAs now underwrite approximately one-third of global cyber GWP, a share that has grown
              materially since 2021. At-Bay served more than 53,000 small and midsize business policyholders with cyber
              insurance as of March 2026, making it the second-largest InsurTech cyber MGA by US policyholder count,
              behind Coalition's 100,000+ global policyholders. The competitive dynamic is defined by rate softening
              (global cyber insurance rates fell approximately 27% from mid-2022 through 2025), rising claim severity
              (At-Bay's 2026 InsurSec Report documents an all-time high average severity of $221,000 per claim), and
              accelerating market consolidation exemplified by the Zurich-Beazley acquisition.


              The status-quo substitute for all InsurTech cyber insurers is a traditional broker-placed cyber policy
              from an incumbent carrier with no bundled security services—still the modal market choice for SMBs with no
              existing MDR contract. The internal-build alternative (a company deploying its own SIEM/SOC capability
              rather than buying managed security insurance) is relevant only for mid-market and enterprise segments,
              not for At-Bay's core SMB buyer.
