  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary & Scope
        blocks:
          - type: paragraph
            body: >-
              At-Bay should be sized against a deliberately narrow market boundary: commercial cyber insurance for
              organizations plus the adjacent MDR/security services that attach to insured risk. The included insurance
              spend is gross or direct written premium for standalone and packaged cyber policies covering first-party
              losses, ransomware/extortion, incident response, business interruption, privacy liability, and technology
              E&O-linked cyber exposures. The included security adjacency is managed detection and response,
              vulnerability monitoring, and remediation sold as a risk-reduction layer to the same SMB and mid-market
              buyer base. Excluded spend includes personal cyber policies, broad property-and-casualty premium that does
              not price cyber explicitly, generic cybersecurity software not bundled with managed response, warranties,
              and self-insurance reserves. This boundary matters because At-Bay's market narrative is not simply 'large
              cybersecurity spend'; its economic wedge is the combination of risk transfer, broker-led insurance
              distribution, and security controls that can reduce claim frequency.
            claimRefs:
              - CM001
              - CM013
              - CM020
              - CM029
