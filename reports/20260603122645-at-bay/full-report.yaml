              premium income—which compresses when primary rates fall or reinsurance cession rates rise—MDR
              subscriptions provide recurring revenue regardless of insurance market conditions. The 81.25% of the
              insured base (roughly 32,500 eligible but not yet subscribing customers) represents a structurally
