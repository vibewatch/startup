      - number: '1.2'
        title: Founders & Leadership Team
        blocks:
          - type: paragraph
            body: >
              At-Bay was co-founded by four individuals in 2016: Rotem Iram (CEO), Roman Itskovich (Chief Risk Officer),
              Etai Hochman, and Tilli Kalisky-Bannett. Hochman and Kalisky-Bannett no longer hold executive roles. Both
              Iram and Itskovich bring rare combinations of elite Israeli intelligence service, global consulting, and
              finance experience that directly inform At-Bay's underwriting discipline and technology-first risk
              philosophy.

              Rotem Iram served as a captain in an Israeli intelligence unit analogous to the NSA before consulting at
              McKinsey & Company and holding an operations role at K2 Intelligence. He holds a BS in Computer
              Engineering from Hebrew University of Jerusalem and an MBA from Harvard Business School. His military
              intelligence background is central to At-Bay's risk-scanning methodology. Roman Itskovich served on the
              investment team at Bain Capital and as a consultant at McKinsey before co-founding At-Bay. He holds a BA
              in Economics and Accounting from Tel Aviv University and an MBA from Harvard Business School.

              The current leadership team beyond the co-founders includes Ken Riegler (President, At-Bay Insurance), Ari
              Fischel (CFO), Ayelet Kutner (CTO), Tara Bodden (General Counsel & Head of Claims), Thom Dekens (CBO and
              GM, At-Bay Security), Michael Drummond (Chief Underwriting Officer, Cyber and Tech E&O), and Adam Tyra
              (CISO for Customers). The team spans insurance operations, cybersecurity, engineering, and legal—a broad
              functional coverage for a company of roughly 340–367 employees. Key-person risk around Rotem Iram is
              material: he is the public face, strategic architect, and primary spokesperson for the InsurSec model, and
              any succession or departure would carry disproportionate risk.
