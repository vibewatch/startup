  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      At-Bay's highest-residual risks sit in the upper-right quadrant: Akira concentration and combined-ratio overage
      are both high-likelihood and high-impact. War exclusion litigation, systemic aggregation, and Israel disruption
      cluster in the medium-to-high-impact band. Financial model stress and competitive pressure are high-likelihood but
      medium-impact in the near term.
    data:
      columns:
        - Medium impact
        - High impact
        - Critical impact
      rows:
        - label: High likelihood
          values:
            - label: Cyber rate decline and MGA fee compression
              tone: risk
              detail: US cyber rates fell 7% in 2024 (NAIC) and 5% more in Q4 2024 (WTW/Marsh); MGA fee income tracks rate.
            - label: Akira concentration and loss ratio stress
              tone: risk
              detail: >-
                Akira drove >40% of ransomware claims in 2025; combined ratio already 102%; actuarial models face
                concentration-driven reserve uncertainty.
            - label: Underwriting overhang from rapid DWP growth
              tone: risk
              detail: >-
                $63M to $281M DWP in one year compresses cohort-seasoning time; premium-to-surplus 334% exceeds typical
                MGA thresholds.
        - label: Medium likelihood
          values:
            - label: Broker distribution concentration surfaces
              tone: risk
              detail: >-
                Wholesale-broker dependence is undisclosed; a top-broker shift would compress submission flow faster
                than new appointments can compensate.
            - label: Israel R&D disruption and MDR quality degradation
              tone: risk
              detail: >-
                March 2026 layoffs of 25 engineers in active conflict zone; MDR detection logic depends on continuous
                threat-intelligence updates from Israel team.
            - label: Reinsurer repricing or capacity withdrawal
              tone: risk
              detail: >-
                Top 5 reinsurers control 62% of global cyber reinsurance market; Munich Re departure would force
                immediate program restructuring.
        - label: Low likelihood
          values:
            - label: MDR competitive gap closes
              tone: neutral
              detail: >-
                Coalition, Corvus, and security vendors are building MDR-adjacent capabilities; gap narrows within 2–3
                years without continued At-Bay R&D investment.
            - label: War exclusion litigation creates uncovered claims
              tone: risk
              detail: >-
                Stryker LMA5567 case establishes adverse precedent; nation-state attribution disputes will recur as
                geopolitical cyber activity increases.
            - label: Systemic aggregation event breaches reinsurance
              tone: risk
              detail: >-
                CrowdStrike-scale event across SMB cloud stack could generate correlated losses exceeding reinsurance
                corridor; modeled but not priced across industry.
    claimRefs:
      - CR001
      - CR008
      - CR012
      - CR013
      - CR014
      - CR016
      - CR027
      - CR028
      - CR039
