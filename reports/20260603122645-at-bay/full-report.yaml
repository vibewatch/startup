            title: Subsidiary Combined Ratio of 102% Signals Underwriting Pressure
            body: >-
              At-Bay Specialty Insurance Company's 2024 combined ratio of 102% indicates an underwriting loss at the E&S
              carrier subsidiary level. While the parent entity earns MGA fee and commission income not reflected in the
              subsidiary filing—and the consolidated entity may still be profitable—the 18-percentage-point
              deterioration in the losses incurred ratio (50% → 68%) in a single year is a material adverse trend. A
