      - number: '3.2'
        title: Direct InsurTech MGA Peers
        blocks:
          - type: paragraph
            body: >
              Coalition is At-Bay's most important direct competitor. As of 2026, Coalition operates approximately
              100,000 active policyholders globally—roughly 2x At-Bay's 53,000—and runs a gross written premium
              exceeding $650M. Coalition's technological moat derives from its Coalition Control platform (continuous
              external monitoring, zero-day alerts, third-party risk management, and optional Wirespeed ADR), its
              admitted carrier Coalition Insurance Company (CIC, rated A- by AM Best), and its Allianz partnership
              announced in May 2026 that grants 10-year global distribution rights. The Allianz deal is the most
              asymmetric competitive development in the InsurTech cyber segment since the Corvus/Travelers acquisition:
              it extends Coalition's distribution far beyond the US broker channel that At-Bay currently depends on.
              Coalition's key adverse signal—an unexplained decline from approximately 160,000 US policyholders in 2022
              to approximately 110,000 in 2025 before recovering globally to 100,000+—raises portfolio quality and
              pricing-discipline questions that partially offset its scale advantage.


              Cowbell (Pleasanton, CA; founded 2019) raised $208.3M in total funding, including a $60M Series C from
              Zurich Insurance Group. Cowbell targets SMEs with AI-driven Cowbell Factor risk scoring but does not
              operate a proprietary carrier—it routes capacity through Zurich North America and Swiss Re. The June 2025
              launch of the Zurich Select Plus modular multi-line E&S product marked Cowbell's evolution from a
              pure-cyber MGA toward a multi-line specialty platform; the November 2025 brand refresh signaled the same.
              Cowbell's absence of proprietary paper is a meaningful structural disadvantage relative to At-Bay's E&S
              carrier (At-Bay Specialty Insurance Company, AM Best B++) and Coalition's admitted paper, because it
              limits actuarial data feedback loops and pricing flexibility.


              Corvus/Travelers (Boston, MA; acquired January 2024 by Travelers for approximately $435M) now operates as
              Travelers' AI-enabled cyber underwriting capability. Corvus integrates continuous pre-bind threat scans
              via the CrowBar platform, delivers real-time risk dashboards to policyholders, and cross-sells into
              Travelers' Aa2/AA-rated global commercial lines distribution. Post-acquisition, Corvus expanded into
              continental European markets, a geographic reach At-Bay has not yet accessed. The Travelers combination is
              the most formidable institutional competitor: it has comparable or better underwriting technology than
              At-Bay's Stance platform for risk scoring purposes (though not for MDR depth), with exponentially greater
              distribution power.


              Resilience (New York, NY; founded 2016; $217M raised across four rounds including a $100M Series D in July
              2023) focuses on enterprise accounts with revenues above approximately $200M, differentiating through
              quantitative cyber risk modeling and CISO-level engagements. More than 10% of US enterprises with revenues
              over $1B have adopted Resilience's platform. Resilience is not a direct SMB competitor to At-Bay; it is a
              meaningful competitor in the mid-market and enterprise segment where At-Bay's newer product lines (up to
              $5B in revenue, limits up to $10M) are expanding.
