      - number: '1.4'
        title: Scale Metrics & Milestones
        blocks:
          - type: paragraph
            body: >
              At-Bay has grown from a small San Francisco startup in 2016 to a company insuring close to 40,000
              businesses in the US (as of April 2025) and generating $155 million in revenue in 2024—approximately 22%
              year-over-year growth from $129 million in 2023 and over 70% growth from $90 million in 2022. The company
              has over $295.7 million in total funding and approximately 340–367 employees across six global offices.

              The MDR business is At-Bay's fastest-growing segment, expanding from fewer than 1,000 MDR customers in
              early 2023 to 7,500 customers by the end of 2024—generating $13 million in annualized MDR revenue at that
              point. The Stance platform collectively protects approximately 1.5 million monitored assets. At-Bay Stance
              MDR was announced on October 26, 2023, and became commercially available in January 2024. In June 2024,
              At-Bay expanded its Cyber and Tech E&O appetite to businesses with up to $5 billion in revenue and policy
              limits up to $10 million, enabling access to larger mid-market and early enterprise accounts.

              The Relay Platform acquisition (completed approximately August 2022) and its subsequent wind-down
              (effective August 6, 2024) represents a notable strategic pivot: At-Bay acquired a digital broker-platform
              startup and then shut it down as the Stance MDR momentum accelerated. The At-Bay Specialty Insurance
              Company subsidiary received an A- financial strength rating from AM Best in 2023, providing broker
              credibility. The company has been recognized on Forbes Fintech 50 (2023–2025) and Forbes' Best Startup
              Employers (2026).
