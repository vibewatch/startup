      - number: '8.4'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              The scenario range is intentionally wide because the most valuation-sensitive variables are private. The
              bull case reaches roughly $2.8 billion to $3.5 billion if revenue compounds above 25%, Stance becomes a
              high-margin second revenue line, MDR proof reduces losses, and the combined ratio improves below 95%. The
              base case is roughly $1.4 billion to $2.1 billion: At-Bay remains a strong cyber MGA/carrier with moderate
              Stance contribution, but underwriting improvement is gradual and valuation stays tied to revenue plus
              strategic scarcity. The bear case is $0.7 billion to $1.1 billion if combined ratios stay above 100%,
              premium rates keep softening, reinsurers demand worse terms, or ransomware concentration overwhelms
              prevention. Downside triggers map directly to the risk chapter: loss-ratio deterioration, reinsurance
              retrenchment, MDR execution failure, and market-price compression.
