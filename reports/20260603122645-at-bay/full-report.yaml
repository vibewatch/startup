      - number: '2.3'
        title: SMB Buyer, User, Payer and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              At-Bay's target account is usually not a Fortune 500 risk-management department but an SMB or mid-market
              firm whose cyber purchase is triggered by broker advice, customer contract requirements, lender or board
              pressure, post-incident concern, or underwriting questions at renewal. The economic buyer is often an
              owner, CFO, controller, or risk/finance leader; the day-to-day user of MDR and active monitoring is the IT
              manager, managed service provider, or security lead; and the channel gatekeeper is the broker. This split
              creates both leverage and friction. Brokers can efficiently introduce At-Bay's combined
              insurance-plus-security proposition, but MDR budget may sit with IT while premium budget sits with
              finance. At-Bay's admitted small-business product and broker-recognized prevention-first strategy increase
              reach, while the CrowdStrike partnership and Stance MDR support the security-user case.
