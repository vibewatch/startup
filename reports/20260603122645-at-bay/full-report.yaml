      - number: '8.2'
        title: Recommendation, Confidence, Risk, and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more with medium confidence, medium-high risk, and a fair-to-stretched
              valuation stance. At or below the last primary $1.35 billion mark, the balance of evidence would be
              attractive because the downside would be closer to revenue-supported insurance and M&A comparables. Around
              the Forbes-estimated $2.1 billion mark, the case becomes fair only if current loss ratios have normalized,
              Stance retention is strong, and reinsurer support remains stable. Above roughly $2.1 billion, the burden
              of proof rises sharply because public comps do not justify unlimited software-style multiples for a
              carrier-linked insurance model. The most important investment implication is that public evidence supports
              continued diligence, not an unconditional buy: no public source discloses consolidated gross margin, burn,
              NRR, loss triangles, broker concentration, or liquidation preferences.
