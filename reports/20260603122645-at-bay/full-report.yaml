      - number: '4.2'
        title: Stance Security Subscriptions and Dual-Revenue Expansion
        blocks:
          - type: paragraph
            body: >
              At-Bay's Stance platform converts the company's 40,000+ insured customer relationships into a
              security-as-a-service upsell vector. Launched as an optional MDR subscription in October 2023, Stance
              Managed Detection and Response (MDR) grew from fewer than 1,000 customers in 2023 to 7,500 by year-end
              2024, generating approximately $13M in annualized subscription revenue. The installed base penetration
              rate of approximately 18.75% (7,500 of roughly 40,000) signals material upside from cross-selling, though
              the product is in early commercial phases.


              The Stance platform bundles vulnerability scanning, dark web monitoring, AI-powered email fraud alerts,
              vCISO advisory services, and employee security training—described by At-Bay as delivering $70,000 in
              embedded security tool value per policy (Insurance Business, July 2025 five-star review). Standalone MDR
              pricing is not publicly disclosed; implied annual revenue per Stance customer approximates $1,733 at the
              reported 7,500 customer / $13M ARR ratio, consistent with SMB-segment MDR market pricing. At-Bay's
              homepage reports 1.5M monitored assets and a 15-minute mean time to remediate threats, underscoring
              operational scale.


              The Stance subscription layer creates meaningful strategic optionality: it reduces At-Bay's dependence on
              insurance premium rate cycles and provides higher-margin recurring revenue. However, Stance revenue ($13M)
              remains modest relative to consolidated net revenue (~$155M), representing approximately 8.4% of total.
              Standalone gross margin, churn, CAC, and net revenue retention for Stance are not publicly disclosed.
              Akira ransomware's 40%+ share of ransomware claims signals that threat-actor concentration risk could
              affect both insurance loss ratios and Stance MDR scope.
