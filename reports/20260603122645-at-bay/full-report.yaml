      - number: '3.5'
        title: Pricing, Distribution, and Switching Costs
        blocks:
          - type: paragraph
            body: >
              At-Bay distributes exclusively through licensed insurance brokers, a model that provides access to
              established buyer relationships but creates structural margin sharing and dependency on broker
              prioritization decisions. Coalition uses the same broker-channel model; Cowbell has begun supplementing
              with direct SME outreach. Neither At-Bay nor Coalition has a disclosed direct-to-buyer sales capability.
              The broker dependency creates a key-person risk at the channel level: if a major broker consolidates,
              changes panel preferences, or launches an in-house MGA product, At-Bay loses disproportionate volume
              without direct relationships as a backstop.


              Pricing in the SMB cyber insurance market softened significantly from the 2022 peak. Global cyber
              insurance rates fell approximately 27% from mid-2022 through 2025; the US experienced approximately a 9%
              decline. Average SMB cyber premiums in 2026 are estimated at approximately $1,000 per year per $1M limit
              for clean risks. As rates fall, the cost-benefit calculus of At-Bay's bundled MDR shifts: a buyer paying
              $1,000/year now obtains the same monitoring-included value proposition at a lower absolute premium
              compared to 2022's higher-rate environment. The reduction in pricing power over the insurance component
              forces At-Bay to increasingly justify the MDR bundle on standalone security value—$8.99/endpoint/month is
              Huntress's list price versus At-Bay's effectively free-included Stance MDR, making the insurance plus
              security bundle increasingly price-advantaged on an absolute basis, but the gap narrows.


              Switching costs in the InsurSec model are moderate. An At-Bay policyholder who switches to Coalition loses
              their Stance MDR integration, ongoing vulnerability scan history, and the remediation workflow embedded in
              the policy. The same buyer would gain Coalition Control's full monitoring suite. The switching cost is
              meaningful but not prohibitive: most policyholders renew annually and evaluate alternatives at each
              renewal. Multi-homing (buying monitoring from Huntress and insurance from an incumbent) is structurally
              feasible and increasingly attractive for budget-constrained SMBs who already have an MSP relationship.
              At-Bay's AM Best financial strength reaffirmation for its E&S carrier (At-Bay Specialty Insurance Company,
              B++ rating) provides credibility at renewal time but is not a material lock-in factor compared to the
              per-policy integration depth.
            claimRefs:
              - CP014
              - CP015
              - CP016
              - CP028
              - CP029
              - CP030
              - CP031
