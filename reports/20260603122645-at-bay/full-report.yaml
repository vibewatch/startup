      - number: '7.2'
        title: Legal, regulatory, and compliance risks
        blocks:
          - type: paragraph
            body: >-
              At-Bay writes cyber insurance as a managing general agent across all 50 US states and select international
              markets, using Trisura Specialty Insurance Company as its primary fronting carrier. That structure exposes
              the company to layered compliance obligations: surplus-lines stamping requirements in states that mandate
              them, broker license filings, NAIC solvency reporting obligations through the fronting carrier, and the
              evolving SEC cyber-disclosure rule that applies to its enterprise policyholders rather than At-Bay itself
              but indirectly drives claims and coverage disputes. The most acute current legal exposure is the
              LMA5567A/B war exclusion, which Lloyd's mandated for all cyber policies from March 2023 onward and which
              was tested in adversarial litigation in 2026 when Stryker's Iran-linked attack triggered a coverage
              dispute with competing interpretations of "computer attack" exclusions and "critical infrastructure"
              carve-outs. At-Bay's policies contain war exclusions, and the Stryker outcome—irrespective of which side
              prevails—will influence how underwriters and plaintiffs frame future nation-state attribution claims
              against At-Bay policyholders. Surplus-lines compliance creates a second layer of regulatory exposure:
              multi-state MGAs must file in every jurisdiction where a non-admitted insurer writes risk, and failure to
              stamp, file, or pay premium tax correctly can trigger fines, policy voidance, or licensure suspension. The
              NAIC 2025 Cybersecurity Insurance Report, which is a primary regulatory source, confirms At-Bay Specialty
              Insurance is active in the US market and flags systemic concentration risk as an industry-level concern,
              reinforcing that regulators are scrutinizing large cyber programs. The regulatory-legal risk register
              below enumerates each named risk with likelihood, severity, current mitigation evidence, and residual
              diligence path.
            claimRefs:
              - CR016
              - CR017
              - CR021
              - CR022
              - CR026
              - CR041
