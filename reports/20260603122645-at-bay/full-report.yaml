      - number: '3.6'
        title: Moat Durability and Competitive Risk
        blocks:
          - type: paragraph
            body: >
              At-Bay's primary competitive moats are (1) its 100,000+ policy-years of proprietary claims data informing
              underwriting and risk scoring, (2) the Stance MDR platform's 15-minute mean time to remediate (MTTR) as a
              published technical differentiator, and (3) its E&S carrier status enabling underwriting control and
              pricing feedback loops not available to capacity-dependent MGAs like Cowbell. These moats are real but
              eroding: Coalition's data advantage is 2x At-Bay's by policyholder count, and Coalition's Allianz
              distribution partnership is already widening the distribution gap.


              The most material adverse competitive evidence in 2026 is the shutdown of At-Bay's Relay specialty
              insurance platform. At-Bay had acquired Relay in 2022 to enter the specialty lines market (management
              liability, professional liability, and other non-cyber lines), but decided to wind down the platform in
              2025-2026. The Relay shutdown signals two risks: first, that At-Bay's multi-product expansion ambitions
              have been scaled back, narrowing its total addressable market thesis; second, that management bandwidth
              was divided across the Relay buildout during a period when Coalition was deepening its admitted carrier
              capabilities and MDR platform. The adverse signal is compounded by the fact that diversification was a
              stated part of At-Bay's Series D pitch, making the reversal a credibility risk.


              The Zurich-Beazley acquisition ($10.9B, March 2026) represents the single most significant structural
              threat to At-Bay's moat over a 5–7 year horizon. A combined Zurich-Beazley entity would have Beazley's
              proven cyber claims expertise ($1.28B+ in cyber premiums, 2024), Zurich's global admitted carrier network,
              and the capital to invest in pre-breach technology at a scale that InsurTech MGAs cannot match without
              their own capital raises. At-Bay has no partnership with a global incumbent to offset this scale
              consolidation—Coalition's Allianz deal is the equivalent mechanism that At-Bay lacks.


              Commoditization pressure from security vendors (CrowdStrike, SentinelOne, Arctic Wolf, Huntress) is real
              but medium-term. As MDR pricing falls and MSP-channel penetration deepens, the bundled security value of
              At-Bay's Stance platform narrows for buyers who already have managed security from another vendor. The
              15-minute MTTR claim and the MDR's $13M ARR standalone product are defensive signals that At-Bay is
              actively trying to build a security business independent of the insurance bundle—if successful, this
              bifurcation strengthens the moat by making the security product independently viable.
