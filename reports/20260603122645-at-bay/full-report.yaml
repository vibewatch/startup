      - number: '4.4'
        title: Claims Economics, Loss Ratio Pressure, and Market Headwinds
        blocks:
          - type: paragraph
            body: >
              FSLSO regulatory filings provide the clearest window into At-Bay's loss economics. At-Bay Specialty
              Insurance Company reported a losses incurred ratio of 68% and a combined ratio of 102% for 2024—versus 50%
              and 98% in 2023. Losses incurred grew 97% from $14.9M in 2023 to $29.2M in 2024. The underwriting result
              swung from a $1.2M gain to a $1.3M loss. Cash flow from operations deteriorated from positive $34.1M in
              2023 to negative $10.7M in 2024—a $44.8M swing reflecting accelerated loss payments. Net income after tax
              was $955K in 2024, a 26% decline from $1.29M.


              At-Bay's own 2026 InsurSec Report (based on 100,000+ policy years and 6,500+ claims) documented a 7%
              year-over-year increase in cyber claim frequency for 2025, with average severity reaching a record
              $221,000. Ransomware severity rose 16% to $508,000, with 87% of ransomware attacks originating from remote
              access tools. Akira ransomware accounted for more than 40% of ransomware claims in 2025, the highest
              single-strain concentration ever recorded by At-Bay. Financial fraud remained the most frequent incident
              type at 30% of claims, with average theft rising 16% to $285,000. Third-party liability severity jumped
              70% year-over-year. At-Bay's claims team recovered $56M in stolen financial fraud funds in 2025, with 70%
              recovery rates when claims were filed within three days.


              The July 2024 CrowdStrike Falcon Sensor outage generated an estimated $400M–$1.5B in global insured cyber
              losses (CyberCube), representing the largest single insured loss event in the affirmative cyber insurance
              market's history. At the market level, Munich Re estimates global ransomware attack frequency increased
              approximately 25% in 2024, and US cyber industry loss ratios increased 7 percentage points to 49% in 2024
              (per CoinLaw citing NAIC data). At-Bay's subsidiary combined ratio of 102% indicates the company's
              net-retained book incurred an underwriting loss in 2024. At-Bay's September 2023 workforce reduction of 27
              employees (~10% of 305-person headcount) reflected structural adjustments amid growing operating costs.
