        title: TAM/SAM/SOM and Contradictory Market Estimates
        blocks:
          - type: paragraph
            body: >-
              The supportable TAM is global commercial cyber insurance premium, roughly $15B-$17B in 2024-2025 depending
              on whether the source uses Munich Re global GWP, Swiss Re growth analysis, Gallagher's broker outlook, or
              U.S. NAIC DWP as the anchor. NAIC's $9.14B U.S. 2024 DWP is the strongest regulatory baseline but is not a
              global TAM, while Munich Re's $15.3B 2024 and $16.3B 2025 estimates are better for global premium.
              At-Bay's SAM is narrower: U.S. SMB and mid-market cyber insurance sold through brokers, with upside from
              admitted and surplus products plus separate MDR attachment. SOM should be haircut again for broker access,
              risk appetite, state availability, competitive carriers, reinsurance capacity, and the unknown share of
              buyers willing to pay separately for MDR. The most important contradiction is that exposure count can grow
              while rates soften, so premium TAM can look flat even when adoption improves.
