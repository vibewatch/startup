  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Insurance Premium Economics
        blocks:
          - type: paragraph
            body: >
              At-Bay's financial architecture centers on two interconnected revenue streams: insurance premiums from its
              excess-and-surplus (E&S) cyber and technology errors-and-omissions (Tech E&O) book, and
              security-as-a-service subscription fees from its Stance platform. Insurance premiums constitute the
              dominant revenue driver, distributed exclusively through wholesale brokers and digital channels. At-Bay
              earns net revenue as the retained spread after ceding approximately 85% of gross written premium to a
              Munich Re-led reinsurance panel; the parent entity also earns management and underwriting fees as the
              managing general agent (MGA) under a 2024 MGA agreement with At-Bay Specialty Insurance Company.


              Forbes reported At-Bay's total revenue at approximately $155M in 2024, up from $129M in 2023. Florida
              Surplus Lines Service Office (FSLSO) regulatory filings show At-Bay Specialty Insurance Company's gross
              premium grew 119% to $338.2M in 2024, with net premium of $49.9M retained after reinsurance cession. In
              2023, the company recorded gross insurance premiums of $301M—a 20% volume increase from 2022 despite
              market-wide premium rate softening—and net revenue exceeding $110M at the consolidated level. Gross
              written premium reached approximately $380M in 2022 when At-Bay wrote entirely on third-party Munich Re
              (HSB) paper as a pure MGA.


              US direct cyber written premiums declined 6% in 2024 to approximately $9.14B (Fitch Ratings, May 2025),
              creating a structural top-line headwind for the sector. Cyber reinsurance non-proportional rates dropped
              32% risk-adjusted at the April 2026 renewal (Gallagher Re data, reported by actuary.info), reducing
              reinsurance costs but also signaling capacity surplus that may pressure primary premium rates further.
              Standalone SMB cyber insurance premiums for $1M limits ranged approximately $1,200–$2,200 annually in
              2024, with rates expected to remain flat to slightly negative entering 2026.
