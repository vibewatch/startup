      - number: '2.4'
        title: Growth Drivers, Regulatory Catalysts and MDR Adoption
        blocks:
          - type: paragraph
            body: >-
              Demand growth is supported by three mutually reinforcing drivers. First, threat economics remain severe:
              Verizon breach data and IBM breach-cost research show that ransomware, credential compromise, business
              interruption, and response costs remain financially material to companies that lack mature security
              operations. Second, regulation raises board and customer attention: SEC disclosure rules elevate
              public-company governance and incident reporting, while NIS2 expands EU cyber risk-management obligations
              for essential and important entities. Third, MDR adoption converts insurance from a passive indemnity
              product into a prevention-oriented service bundle. IDC, Gartner, IBM, and MDR-market sources treat MDR as
              a mature managed-security category, and At-Bay's Stance MDR fits this trend by providing 24/7 monitoring,
              response, and remediation to customers that cannot build internal SOC capacity. For At-Bay, the driver is
              not just more policy demand; it is the possibility of attaching security revenue and improving loss
              selection.
