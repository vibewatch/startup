      - number: '2.5'
        title: 'Constraints: Rate Softening, Reinsurance and Systemic Risk'
        blocks:
          - type: paragraph
            body: >-
              The adverse market case is unusually important. The 2024-2026 evidence base shows a soft market: Howden,
              Marsh, Aon, Gallagher and Fitch all describe lower pricing, abundant capacity, or underwriting risk from
              competitive conditions. That helps buyers and may support At-Bay capacity in the near term, but it can
              compress premium yield per exposure and reduce margin if claim severity rises. Reinsurance is another
              constraint because cyber aggregation remains hard to model and specialist insurers depend on ceded
              capacity. Moody's cyber concentration work and the CrowdStrike outage show why this is not theoretical: a
              common EDR, cloud, identity, or software-update dependency can create correlated downtime across many
              insured SMBs. MDR lowers incident frequency for individual clients, but it cannot fully diversify a
              portfolio against shared vendor failure. The diligence conclusion is therefore balanced: At-Bay's
              integrated model is well aligned with SMB needs, but valuation should be haircut for cycle timing,
              systemic risk, and undisclosed MDR attach economics.
