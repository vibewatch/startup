  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk overview and thesis-break framing
        blocks:
          - type: paragraph
            body: >-
              At-Bay operates at the intersection of four risk domains that are individually manageable but collectively
              demanding. The first and most pressing is underwriting and loss-ratio risk: the FSLSO statutory filing for
              2024 shows a combined ratio of 102%, losses of $29.2 million (up 96.7% year on year), and a negative cash
              flow from operations of $10.7 million—all against a backdrop of a premium portfolio that grew 345% in a
              single year. That growth rate compresses the seasoning time needed to validate loss assumptions, and it
              coincides with a US cyber market that recorded its first-ever premium decline of 7% in 2024. The second
              domain is systemic aggregation risk: the CrowdStrike outage demonstrated that a single vendor failure can
              trigger correlated claims across thousands of policies simultaneously, and At-Bay's concentration in SMB
              cyber makes the exposure real. The third domain is legal and regulatory risk: LMA5567 war-exclusion
              litigation, multi-state surplus-lines compliance, and the SEC cyber-disclosure rule all impose obligations
              that a rapidly scaling MGA must absorb without a seasoned in-house regulatory team. The fourth domain is
              operational and people risk: Israel houses the bulk of At-Bay's R&D, and the March 2026 layoffs of 25
              engineers "in times of war" introduce execution and talent-retention uncertainty at precisely the moment
              MDR delivery is the primary competitive differentiator. A fifth domain—financial model and competitive
              risk—sits below the four primary concerns but is nonetheless real: if cyber rates continue declining, the
              MGA's underwriting fee and profit commission compress, and competitors with deeper balance sheets or lower
              expense ratios can price more aggressively. The risk heatmap below places each domain by likelihood and
              impact severity. The mitigation and kill criteria table in the final section defines which events would
              make the thesis non-investable.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR012
              - CR013
              - CR028
              - CR035
