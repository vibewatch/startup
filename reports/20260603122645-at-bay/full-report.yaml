      - number: '1.5'
        title: Products & Security Platform
        blocks:
          - type: paragraph
            body: >
              At-Bay's product suite spans two categories: insurance and active cybersecurity. The insurance portfolio
              includes primary and excess Cyber, Technology E&O, and Miscellaneous Professional Liability policies
              offered through At-Bay Insurance Services, LLC (E&S broker) and an admitted full-stack carrier entity.
              Every surplus Cyber and Tech E&O policy comes with access to At-Bay Stance Exposure Management, including
              Stance Advisory Services—providing vulnerability scanning, dark web monitoring, AI-powered email fraud
              alerts, virtual CISO advisory, and employee security awareness training as embedded features. At-Bay
              estimates these embedded services represent up to $70,000 per policy in value at prevailing market rates.

              The At-Bay Stance MDR product—commercially available since January 2024—provides 24/7 endpoint monitoring
              managed by At-Bay's security experts, powered by CrowdStrike technology. MDR is sold separately through
              At-Bay Security, LLC and is available to both policyholders and non-policyholders. Policyholders using
              top-performing MDR services may be eligible for insurance premium credits. The company's 2026 InsurSec
              Report confirmed that every policyholder who faced an Akira ransomware attack in 2025 and avoided full
              encryption had 24/7 MDR in place, strongly supporting the product's strategic narrative.

              The broader Stance platform also includes an email security offering (Stance MDR for Email), an exposure
              management layer, and tabletop exercise services delivered by vCISO advisors. At-Bay licenses or develops
              in-house digital forensics and incident response (DFIR) capabilities used during claims events. The
              company's risk selection methodology uses external attack-surface scans at quote time rather than static
              questionnaires, yielding a risk model calibrated to actual posture rather than self-reported controls.
            claimRefs:
              - CO002
              - CO032
              - CO041
              - CO042
              - CO043
              - CO045
