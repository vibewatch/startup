  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              At-Bay is investable only as a price-disciplined InsurSec thesis, not as a generic high-growth software
              story. The thesis is that a cyber insurer with its own E&S paper, proprietary underwriting data, and
              embedded MDR can reduce losses while adding recurring security revenue on top of premium economics. Public
              evidence supports the ingredients: Forbes reports roughly $155 million of 2024 revenue and more than
              53,000 SMB customers; At-Bay moved onto its own paper; Stance MDR is marketed as a prevention layer; and
              the 2026 InsurSec evidence suggests MDR can reduce Akira ransomware outcomes. The anti-thesis is equally
              concrete. The carrier subsidiary posted a 102% combined ratio in 2024, Relay was shut down after
              acquisition, cyber pricing is softening, and Akira concentration shows that one threat actor can stress an
              underwriting model. The chapter therefore treats At-Bay as a differentiated but not yet de-risked private
              cyber-insurance platform.
            claimRefs:
