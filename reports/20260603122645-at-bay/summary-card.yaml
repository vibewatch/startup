  topStrengths:
    - >-
      Embedded InsurSec model links underwriting, claims data, and Stance security telemetry more tightly than legacy
      cyber insurers.
    - >-
      Own-paper E&S carrier plus broker distribution improve underwriting control and placement credibility versus pure
      MGA peers.
    - >-
      Publicly reported 2024 revenue and 53,000+ customer scale show real commercial penetration, not just narrative
      traction.
    - Stance MDR grew rapidly from under 1,000 customers in 2023 to 7,500 by end-2024, creating a second revenue wedge.
    - >-
      At-Bay's dataset and prevention positioning make the platform strategically attractive to carriers, reinsurers,
      and cyber vendors.
  topRisks:
    - >-
      The carrier subsidiary posted a 102% combined ratio in 2024, showing underwriting stress before public proof of
      improvement.
    - >-
      Cyber-insurance price softening can compress MGA economics if policy growth and Stance attachment do not offset
      lower rates.
    - >-
      Ransomware concentration, including Akira driving 40%+ of 2025 ransomware claims, creates model-risk and
      loss-volatility exposure.
    - >-
      Broker, reinsurer, and partner dependence means At-Bay controls less of renewal and capacity economics than a pure
      software business.
    - >-
      Public investors still lack visibility into consolidated margins, burn, retention, reserve development, and
      preference-stack downside.
  unresolvedGaps:
    - Consolidated GAAP financial statements, gross margin, and burn trajectory are not public.
    - Reinsurance treaty attachment points, pricing, and renewal conditions remain undisclosed.
    - Stance cohort retention, attach rate, gross margin, and customer payback are not public.
    - Broker concentration and renewal cohorts by segment are not public.
    - Cap-table preferences, anti-dilution terms, and secondary liquidity overhang are not public.
