summary:
  headline: >-
    At-Bay has built a credible InsurSec platform with meaningful SMB distribution, own-paper underwriting control, and
    an emerging security upsell engine, but public evidence still supports a research-more recommendation because
    underwriting, retention, and cap-table economics are not disclosed well enough to underwrite a clean entry near the
    estimated $2.1B mark.
