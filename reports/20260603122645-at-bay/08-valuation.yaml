company:
  name: At-Bay
chapter:
  number: 8
  title: Valuation
  summary: 'At-Bay is a research-more investment case at a fair-to-stretched valuation stance: public evidence supports a
    differentiated InsurSec platform, but not an unconditional buy above the estimated $2.1B context without private underwriting,
    Stance, reinsurance, and preference-stack proof. The base valuation range is $1.4B-$2.1B, with bull upside to $2.8B-$3.5B
    if Stance scales and loss ratios normalize, and bear downside to $0.7B-$1.1B if underwriting stress and cyber-pricing
    softness persist.'
sections:
- id: thesis-anti-thesis
  title: Investment Thesis and Anti-Thesis
  body: 'At-Bay is investable only as a price-disciplined InsurSec thesis, not as a generic high-growth software story. The
    thesis is that a cyber insurer with its own E&S paper, proprietary underwriting data, and embedded MDR can reduce losses
    while adding recurring security revenue on top of premium economics. Public evidence supports the ingredients: Forbes
    reports roughly $155 million of 2024 revenue and more than 53,000 SMB customers; At-Bay moved onto its own paper; Stance
    MDR is marketed as a prevention layer; and the 2026 InsurSec evidence suggests MDR can reduce Akira ransomware outcomes.
    The anti-thesis is equally concrete. The carrier subsidiary posted a 102% combined ratio in 2024, Relay was shut down
    after acquisition, cyber pricing is softening, and Akira concentration shows that one threat actor can stress an underwriting
    model. The chapter therefore treats At-Bay as a differentiated but not yet de-risked private cyber-insurance platform.'
  claimRefs:
  - CV002
  - CV003
  - CV005
  - CV007
  - CV010
  - CV012
  - CV038
  - CV039
  - CV040
  tableRefs:
