- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Underwriting loss persists
    - TTM combined ratio >105%
    - Valuation becomes insurance-loss story rather than InsurSec premium
    - Move to bear case or avoid
  - - Reinsurance worsens
    - Higher retention or reduced panel support
    - Tail risk shifts to At-Bay capital base
    - Require lower price and structure
  - - MDR stalls
    - Flat attachment, high churn, or low gross margin
    - Security layer fails to justify multiple premium
    - Remove software uplift
  - - Cyber rates keep falling
    - Rate decline exceeds policy-count growth
    - MGA fees and profit commissions compress
    - Reduce revenue multiple
  - - Ransomware concentration persists
    - Akira-like group drives >40% of ransomware claims again
    - Actuarial model exposed to single actor
    - Demand loss reserves and cohort proof
  notes: Thresholds are diligence triggers derived from public risks and should be replaced by data-room covenants if available.
