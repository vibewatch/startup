- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - Current financials
    - 2025-2026 consolidated revenue, gross margin, burn, cash
    - Determines revenue multiple and runway
    - CFO data-room package and monthly management accounts
  - - Loss performance
    - Loss triangles, combined ratio by cohort, reserve development
    - Separates growth strain from structural underwriting weakness
    - Actuarial review and statutory-to-GAAP bridge
  - - Stance economics
    - ARR, churn, gross margin, attach rate, standalone renewals
    - Validates software-like valuation premium
    - Cohort export and customer interviews
  - - Reinsurance
    - Treaty terms, attachment points, ceding commissions, renewal status
    - Determines tail risk and capital need
    - Review treaties with insurance counsel
  - - Cap table
    - Liquidation preferences, participation, anti-dilution, debt
    - Controls proceeds distribution at exit
    - Legal review of financing documents
  - - Distribution
    - Top broker concentration, commission schedule, renewal retention
    - Tests durability of customer acquisition
    - Broker cohort and channel interviews
  notes: Diligence asks are mandatory before an investment commitment because public evidence leaves each variable unresolved.
