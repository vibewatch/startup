- id: comparables
  title: Comparable Set and Valuation Multiples
  body: 'The most relevant comparable set is mixed. Coalition defines the upper private cyber-insurance benchmark at a disclosed
    $5 billion Series F valuation, supported by broader scale and market leadership. Cowbell provides a lower-scale private
    financing reference without a public valuation mark. Corvus provides the most concrete M&A reference: Travelers paid about
    $435 million for a cyber-insurtech underwriting platform, showing strategic appetite but also setting a real exit data
    point far below unicorn-era private marks. Public insurtechs such as Lemonade, Hippo, and Root are imperfect because they
    are not cyber-specialists, but their filings and market data are useful for discipline: insurance-like digital models
    are valued on revenue quality, loss control, capital intensity, and profitability path. At-Bay deserves a premium to weak
    public digital carriers only if Stance and underwriting data demonstrably improve loss outcomes.'
  claimRefs:
  - CV013
  - CV014
  - CV015
  - CV016
  - CV033
  - CV034
  - CV035
  - CV036
  - CV037
  tableRefs:
  - TV004
  figureRefs: []
- id: exit-readiness-diligence
  title: Exit Readiness and Final Diligence Asks
  body: 'At-Bay is more strategically acquirable than IPO-ready on public evidence. The own-paper carrier, broker relationships,
    cyber claims data, and Stance platform would be attractive to a specialty carrier, reinsurer, or security vendor seeking
    cyber-insurance distribution. A near-term IPO is harder to support because public investors would demand consolidated
    GAAP revenue, loss-ratio history, reserves, reinsurance details, and a credible path to underwriting profitability. The
    final diligence package must close six gaps before any investment: current consolidated financials, loss triangles, reinsurance
    treaty terms, Stance cohort retention and gross margin, cap-table preferences, and broker concentration. Thesis-break
    triggers are explicit: combined ratio above 105%, worse reinsurance terms, stalled MDR attachment, or a down-round signal.
    If any two occur together, the valuation case should reset to the bear range.'
  claimRefs:
  - CV031
  - CV032
  - CV041
  - CV042
  - CV043
  - CV044
