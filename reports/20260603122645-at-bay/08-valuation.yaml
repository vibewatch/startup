  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current consolidated financials
    missingEvidence: Audited or management 2025-2026 consolidated revenue, gross margin, burn, cash, and run-rate ARR.
    whyItMatters: The valuation range is highly sensitive to current revenue quality and cash runway.
    diligencePath: Request CFO data-room financial package and board-approved operating plan.
    relatedQuestionRefs:
    - QV002
    - QV012
    - QV029
  - type: private-evidence-only
    severity: material
    topic: loss ratio and reserves
    missingEvidence: Loss triangles, reserve development, cohort loss ratios, and statutory-to-GAAP reconciliation.
    whyItMatters: Public statutory data shows 2024 stress but does not prove whether it normalized.
    diligencePath: Engage insurance actuary to review carrier and MGA loss data.
    relatedQuestionRefs:
    - QV005
    - QV026
    - QV033
  - type: private-evidence-only
    severity: material
    topic: Stance unit economics
    missingEvidence: Stance ARR, gross margin, churn, attach rate, NRR, and standalone renewal behavior.
    whyItMatters: The valuation premium relies on Stance looking more like software than an insurance bundle.
    diligencePath: Request cohort report and interview retained/churned Stance customers.
    relatedQuestionRefs:
    - QV009
    - QV023
    - QV024
  - type: missing-source
    severity: material
    topic: cap table preferences
    missingEvidence: Liquidation preference stack, participation rights, anti-dilution, warrants, and debt terms.
    whyItMatters: Headline enterprise value may not translate into common or new-investor proceeds.
    diligencePath: Legal review of financing documents and pro forma waterfall.
    relatedQuestionRefs:
    - QV019
    - QV035
  - type: private-evidence-only
    severity: material
    topic: reinsurance treaty terms
    missingEvidence: Current treaty panel, ceding commissions, attachment points, exclusions, and renewal economics.
    whyItMatters: Reinsurance determines tail-risk retention and capital requirement.
    diligencePath: Review treaty documents with insurance counsel and reinsurer references.
    relatedQuestionRefs:
