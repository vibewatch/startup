- id: financing-entry-discipline
  title: Financing Context, Entry Discipline, and Preference Overhang
  body: 'At-Bay''s clean public financing anchor remains the 2021 Series D: $185 million at a $1.35 billion post-money valuation,
    later extended by additional capital according to contextual financial sources. Forbes and Latka supply the current revenue
    frame, but neither replaces a primary financing mark. That matters because late-stage cyber-insurance multiples reset
    after 2021: public insurtech investors now focus on loss control, profitability, and capital intensity. A disciplined
    entry should therefore be underwritten from current revenue and statutory economics, not from the unicorn label. Preference
    overhang is a material private-market risk. Nearly $300 million of disclosed capital likely carries liquidation preferences;
    if the exit clears below the current preferred stack plus accrued preferences, common-equity economics could differ sharply
    from headline enterprise value. New money should require preference parity, participation caps, and anti-dilution review
    before signing.'
  claimRefs:
  - CV001
  - CV004
  - CV005
  - CV016
  - CV029
  - CV030
  - CV045
  tableRefs: []
  figureRefs:
  - FV002
- id: scenarios
  title: Bull, Base, and Bear Scenarios
  body: 'The scenario range is intentionally wide because the most valuation-sensitive variables are private. The bull case
    reaches roughly $2.8 billion to $3.5 billion if revenue compounds above 25%, Stance becomes a high-margin second revenue
    line, MDR proof reduces losses, and the combined ratio improves below 95%. The base case is roughly $1.4 billion to $2.1
    billion: At-Bay remains a strong cyber MGA/carrier with moderate Stance contribution, but underwriting improvement is
    gradual and valuation stays tied to revenue plus strategic scarcity. The bear case is $0.7 billion to $1.1 billion if
    combined ratios stay above 100%, premium rates keep softening, reinsurers demand worse terms, or ransomware concentration
    overwhelms prevention. Downside triggers map directly to the risk chapter: loss-ratio deterioration, reinsurance retrenchment,
    MDR execution failure, and market-price compression.'
  claimRefs:
  - CV017
  - CV018
  - CV020
  - CV021
  - CV027
  - CV028
