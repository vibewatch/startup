companyProfile:
  summary: >-
    At-Bay was founded in 2016 and is headquartered in San Francisco with a significant engineering and R&D hub in Tel Aviv.
    The company combines cyber insurance with security products under its InsurSec model: broker-distributed Cyber and Tech
    E&O policies sit alongside At-Bay Stance exposure management, MDR, and MXDR offerings. Public evidence points to more
    than 53,000 SMB and mid-market customers, about $155 million of 2024 revenue, and rapid adoption of the Stance security
    layer, but the full economics remain private.
  foundedDate: '2016-01-01'
