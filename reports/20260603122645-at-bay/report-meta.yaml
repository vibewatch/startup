  productSummary: >-
    At-Bay sells cyber insurance and technology E&O coverage through brokers, then layers in At-Bay Stance services such as
    exposure management, vulnerability monitoring, MDR Endpoint, MDR Email, and MXDR. The company began issuing new E&S
    cyber policies on its own paper in 2023, giving it more underwriting control while keeping a heavily reinsured model.
  customerFocus: SMB and lower mid-market businesses buying broker-placed cyber insurance, with newer expansion into larger commercial accounts up to $5B in revenue.
  businessModel: >-
    Revenue is driven by insurance premiums and MGA economics on a heavily reinsured cyber/Tech E&O book, plus a growing
    but still minority security-revenue stream from At-Bay Stance MDR/MXDR subscriptions and services.
  stage: Late-stage private (post-Series D, full-stack carrier transition)
  fundingStatus: >-
    Last disclosed primary round was the July 2021 Series D: $185M at a $1.35B post-money valuation, later extended by
    $20M. Total disclosed external capital is about $292M, with no new public primary round since 2021.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO004, CO005, CO021, CO023, CO026, CO028, CI014, CI029]
summary:
  headline: >-
    At-Bay has built a credible InsurSec platform with meaningful SMB distribution, own-paper underwriting control, and an
    emerging security upsell engine, but public evidence still supports a research-more recommendation because underwriting,
    retention, and cap-table economics are not disclosed well enough to underwrite a clean entry near the estimated $2.1B mark.
