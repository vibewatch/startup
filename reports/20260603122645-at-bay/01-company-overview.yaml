  - id: adverse-considerations
    title: Adverse Considerations & Risk Signals
    body: >
      Several structural and operational risk factors warrant attention in evaluating At-Bay.

      First, the cyber insurance market itself is in a sustained softening phase that poses margin pressure
      across the industry. The US cyber market contracted by 7% in 2024 (NAIC data)—the first-ever
      reduction in direct written premium. Dual Group's April 2026 analysis projected a US cyber combined
      ratio of 97% in 2026 and the potential for unprofitable territory in 2027 if softening persists.
      Prices declined 13% in the US from Q4 2023 to Q4 2025. At-Bay, as a specialist carrier retaining
      15% of risk, faces direct earnings exposure when loss ratios deteriorate.

      Second, At-Bay's own claims data reveals a challenging loss environment. The 2026 InsurSec Report
      documented average claim severity hitting an all-time high of $221,000 in 2025, with ransomware
      severity at $508,000—up 16% year-over-year. Third-party liability claims surged 70% in 2025.
      The report also shows that small businesses—At-Bay's core market—are experiencing the steepest
      severity increases (40% for sub-$25M revenue companies). These trends translate directly into
      higher expected losses.

      Third, the acquisition and wind-down of Relay Platform is an adverse milestone. At-Bay invested
      in a digital broker-placement platform (acquired ~August 2022) and shut it down less than two years
      later, effective August 6, 2024. The wind-down affected ~25 employees and requires explanation of
      capital deployed and strategic value realized.

      Fourth, At-Bay is unprofitable. As a private company, it has not disclosed EBITDA or net income.
      With approximately $296M raised and $155M in 2024 revenue, the balance between growth investment,
      claims costs, and operational expenses is not publicly transparent.

      Fifth, key-person concentration risk around CEO Rotem Iram is significant—he is the primary
      architect and public face of the InsurSec strategy.
