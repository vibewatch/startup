callouts:
  - calloutType: strength
    title: InsurSec Model as Structural Differentiator
    body: >
      At-Bay's combined insurance-plus-security model creates genuine product differentiation that is
      difficult for traditional carriers to replicate quickly. The embedded Stance tools—valued at up
      to $70,000 per policy—lower policyholder risk while simultaneously improving At-Bay's loss ratio.
      The MDR product's rapid growth (fewer than 1,000 to 7,500 customers in roughly 18 months) with
      $13M in annualized revenue demonstrates both product-market fit and the revenue diversification
      potential beyond traditional insurance GWP.
    claimRefs:
      - CO028
      - CO029
      - CO041
      - CO045

  - calloutType: risk
    title: Cyber Market Softening & Loss Severity Pressure
    body: >
      The US cyber insurance market contracted in 2024 for the first time ever, and combined ratios are
      projected to approach or exceed 100% by 2027 under current softening trajectories. At-Bay's own
      claims data shows record average severity ($221K) and ransomware severity ($508K) in 2025. The
      company's 15% risk retention means these loss trends directly impact its economics. The convergence
      of rate softening and rising severity is a structural headwind that affects the entire market but
      tests specialist insurers like At-Bay disproportionately.
    claimRefs:
      - CO036
      - CO037
      - CO038
      - CO040

  - calloutType: assumption
    title: Valuation Estimate Relies on Single Stale Proxy
    body: >
      At-Bay's ~$2.1B estimated valuation from Forbes Big Tech 50 2024 is an external estimate, not
      a primary market event. The last primary financing with a confirmed post-money valuation was the
      July 2021 Series D at $1.35B. Any valuation figure used in downstream chapters must be flagged
      as a secondary estimate with high uncertainty pending a new funding round or liquidity event.
    claimRefs:
      - CO021
      - CO024

