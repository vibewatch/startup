- id: TM006
  title: Adverse market-risk register
  columns:
  - Risk
  - Evidence
  - Severity
  - Why it matters for At-Bay
  - Mitigation / diligence path
  rows:
  - - Rate softening
    - Howden, Marsh and Aon describe lower rates
    - High
    - Compresses premium yield per insured exposure
    - Request cohort GWP, rate change and renewal retention
  - - Underwriting discipline
    - Fitch warns growth can raise underwriting risk
    - High
    - Specialists may chase volume in a soft cycle
    - Review loss ratio by cohort and control requirement
  - - Systemic vendor outage
    - CrowdStrike update caused widespread host disruption
    - High
    - Common technology dependency can hit many insureds at once
    - Review aggregation exposure and exclusions
  - - Cyber concentration modeling
    - Moody's highlights concentration risk
    - High
    - Portfolio correlations are hard to diversify
    - Inspect catastrophe model assumptions and stress tests
  - - Reinsurance dependence
    - 2026 cyber reinsurance softened materially
    - Medium
    - Capacity availability can reverse after large events
    - Review treaty duration, panel and retention
  - - Budget split for MDR
    - Insurance and IT budgets differ in SMBs
    - Medium
    - MDR attach may lag policy count
    - Measure attach by segment and broker
  - - Contradictory TAM estimates
    - Sources mix GWP, DWP and market definitions
    - Medium
    - Overstates certainty in valuation narratives
    - Use constrained range, not point TAM
  - - Undisclosed At-Bay metrics
    - No public current GWP, attach or MDR margin
    - High
    - Prevents confident SOM and revenue-quality estimate
    - Diligence request for private KPI pack
