company:
  name: At-Bay
chapter:
  number: 2
  title: Market Analysis
  summary: At-Bay operates at the intersection of a roughly $15B-$17B global commercial cyber insurance market and a faster-growing
    MDR/security-services adjacency. The opportunity is strongest in U.S. SMB and mid-market accounts where brokers, finance
    buyers, and under-resourced IT teams value bundled insurance plus prevention, but the market case must be discounted for
    rate softening, reinsurance dependence, systemic/vendor outage risk, and missing private evidence on At-Bay GWP and MDR
    attach economics.
sections:
- id: market-boundary
  title: Market Boundary & Scope
  body: 'At-Bay should be sized against a deliberately narrow market boundary: commercial cyber insurance for organizations
    plus the adjacent MDR/security services that attach to insured risk. The included insurance spend is gross or direct written
    premium for standalone and packaged cyber policies covering first-party losses, ransomware/extortion, incident response,
    business interruption, privacy liability, and technology E&O-linked cyber exposures. The included security adjacency is
    managed detection and response, vulnerability monitoring, and remediation sold as a risk-reduction layer to the same SMB
    and mid-market buyer base. Excluded spend includes personal cyber policies, broad property-and-casualty premium that does
    not price cyber explicitly, generic cybersecurity software not bundled with managed response, warranties, and self-insurance
    reserves. This boundary matters because At-Bay''s market narrative is not simply ''large cybersecurity spend''; its economic
    wedge is the combination of risk transfer, broker-led insurance distribution, and security controls that can reduce claim
    frequency.'
  claimRefs:
  - CM001
  - CM013
  - CM020
  - CM029
  tableRefs:
  - TM001
- id: sizing
  title: TAM/SAM/SOM and Contradictory Market Estimates
  body: 'The supportable TAM is global commercial cyber insurance premium, roughly $15B-$17B in 2024-2025 depending on whether
    the source uses Munich Re global GWP, Swiss Re growth analysis, Gallagher''s broker outlook, or U.S. NAIC DWP as the anchor.
    NAIC''s $9.14B U.S. 2024 DWP is the strongest regulatory baseline but is not a global TAM, while Munich Re''s $15.3B 2024
    and $16.3B 2025 estimates are better for global premium. At-Bay''s SAM is narrower: U.S. SMB and mid-market cyber insurance
    sold through brokers, with upside from admitted and surplus products plus separate MDR attachment. SOM should be haircut
    again for broker access, risk appetite, state availability, competitive carriers, reinsurance capacity, and the unknown
    share of buyers willing to pay separately for MDR. The most important contradiction is that exposure count can grow while
    rates soften, so premium TAM can look flat even when adoption improves.'
  claimRefs:
  - CM002
  - CM003
  - CM025
  - CM026
  - CM027
  - CM028
  - CM038
  - CM042
  tableRefs:
  - TM002
  figureRefs:
  - FM001
  - FM002
- id: buyer-user-payer
  title: SMB Buyer, User, Payer and Adoption Path
  body: At-Bay's target account is usually not a Fortune 500 risk-management department but an SMB or mid-market firm whose
    cyber purchase is triggered by broker advice, customer contract requirements, lender or board pressure, post-incident
    concern, or underwriting questions at renewal. The economic buyer is often an owner, CFO, controller, or risk/finance
    leader; the day-to-day user of MDR and active monitoring is the IT manager, managed service provider, or security lead;
    and the channel gatekeeper is the broker. This split creates both leverage and friction. Brokers can efficiently introduce
    At-Bay's combined insurance-plus-security proposition, but MDR budget may sit with IT while premium budget sits with finance.
    At-Bay's admitted small-business product and broker-recognized prevention-first strategy increase reach, while the CrowdStrike
    partnership and Stance MDR support the security-user case.
  claimRefs:
  - CM017
  - CM018
  - CM019
  - CM040
  - CM041
  tableRefs:
  - TM003
  figureRefs:
  - FM003
  - FM004
- id: growth-drivers
  title: Growth Drivers, Regulatory Catalysts and MDR Adoption
  body: 'Demand growth is supported by three mutually reinforcing drivers. First, threat economics remain severe: Verizon
    breach data and IBM breach-cost research show that ransomware, credential compromise, business interruption, and response
    costs remain financially material to companies that lack mature security operations. Second, regulation raises board and
    customer attention: SEC disclosure rules elevate public-company governance and incident reporting, while NIS2 expands
    EU cyber risk-management obligations for essential and important entities. Third, MDR adoption converts insurance from
    a passive indemnity product into a prevention-oriented service bundle. IDC, Gartner, IBM, and MDR-market sources treat
    MDR as a mature managed-security category, and At-Bay''s Stance MDR fits this trend by providing 24/7 monitoring, response,
    and remediation to customers that cannot build internal SOC capacity. For At-Bay, the driver is not just more policy demand;
    it is the possibility of attaching security revenue and improving loss selection.'
  claimRefs:
  - CM011
  - CM012
  - CM014
  - CM015
  - CM016
  - CM021
  - CM022
  - CM023
  - CM024
  - CM035
  tableRefs:
  - TM004
  - TM005
- id: constraints-and-adverse
  title: 'Constraints: Rate Softening, Reinsurance and Systemic Risk'
  body: 'The adverse market case is unusually important. The 2024-2026 evidence base shows a soft market: Howden, Marsh, Aon,
    Gallagher and Fitch all describe lower pricing, abundant capacity, or underwriting risk from competitive conditions. That
    helps buyers and may support At-Bay capacity in the near term, but it can compress premium yield per exposure and reduce
    margin if claim severity rises. Reinsurance is another constraint because cyber aggregation remains hard to model and
    specialist insurers depend on ceded capacity. Moody''s cyber concentration work and the CrowdStrike outage show why this
    is not theoretical: a common EDR, cloud, identity, or software-update dependency can create correlated downtime across
    many insured SMBs. MDR lowers incident frequency for individual clients, but it cannot fully diversify a portfolio against
    shared vendor failure. The diligence conclusion is therefore balanced: At-Bay''s integrated model is well aligned with
    SMB needs, but valuation should be haircut for cycle timing, systemic risk, and undisclosed MDR attach economics.'
  claimRefs:
