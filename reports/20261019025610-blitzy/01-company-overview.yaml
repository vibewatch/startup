  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: A current ARR or revenue run-rate, exact customer count, gross margin, and pilot-to-production conversion metrics.
    whyItMatters: Public scale claims are not enough to underwrite commercial quality, margin structure, or durability of demand.
    diligencePath: Request a current board or financing deck plus customer cohort metrics and unit economics in the data room.
    relatedQuestionRefs:
    - QO004
  - type: enumeration-incomplete
    severity: material
    topic: leadership and founder table coverage
    missingEvidence: A full board roster, broader executive bench, and formal governance structure.
    whyItMatters: Key-person concentration is visible, but governance resilience and succession coverage cannot be judged from founder bios alone.
    diligencePath: Request board materials, org chart, executive biographies, and governance documents.
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder or investor map coverage
    missingEvidence: A true cap table, ownership percentages, board seats, round terms, strategic-investor rights, and customer concentration data.
    whyItMatters: Named stakeholders do not reveal control dynamics, return economics, or exposure to a few strategic accounts.
    diligencePath: Request cap table, term sheet summary, customer concentration schedule, and strategic-investor side letters.
    relatedQuestionRefs:
    - QO003
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: minor
    topic: pricing-fit critique
    missingEvidence: Independent, non-competitor corroboration of current pricing floors, contract length, and evaluation economics.
    whyItMatters: The only explicit commercial critique in the assigned pool is competitor-authored, so it should inform diligence questions rather than be treated as verified pricing fact.
    diligencePath: Request current packaging, pricing, proof-of-concept structure, and a redlined enterprise MSA from management.
    relatedQuestionRefs:
    - QO006
