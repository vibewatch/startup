company:
  name: Blitzy
chapter:
  number: 1
  title: Company Overview
  summary: Blitzy presents as a Cambridge-based autonomous software development company that raised a large May 2026 round, but the public record in this assigned pool still leans heavily on company-issued materials for customer, headcount, and product-scale claims. The strongest corroborated ground truth is identity, founding team, and the $200 million financing at a $1.4 billion valuation; commercial terms, revenue, customer count, and governance depth remain notable diligence gaps.
sections:
- id: identity-and-positioning
  title: Identity, stage, and product positioning
  body: 'Blitzy can be grounded as a 2023 Cambridge, Massachusetts company selling autonomous software development into large enterprise codebases. The assigned official pages consistently position the platform as something broader than an IDE copilot: Blitzy says it reverse-engineers large codebases, builds a persistent understanding of the environment, and orchestrates long-running multi-agent execution through Blitzy OS. Third-party market-data pages in this pool broadly preserve the same framing and currently label the company as private and Series G, but the stage label itself is still aggregator-derived rather than a company filing. That distinction matters because later chapters can reuse the company identity, yet should not treat every scale or commercialization claim as independently verified just because multiple secondary profiles repeat it.'
  claimRefs:
  - CO001
  - CO002
  - CO016
  tableRefs:
  - TO001
- id: leadership-and-governance
  title: Leadership, founder-market fit, and governance visibility
  body: The public founder story is one of the clearer parts of the evidence set. Across company-authored material and the May 2026 financing release, Brian Elliott is the commercial and external-facing founder while Sid Pardeshi anchors the technical narrative through his NVIDIA background and patent record. That gives Blitzy a plausible founder-market-fit story for enterprise AI development, but it also creates visible key-person concentration because the assigned pool exposes little bench depth beyond the two founders. No source in the assigned pool names the board, clarifies independent governance, or spells out succession coverage across engineering, sales, or customer delivery. For diligence purposes, leadership credibility is stronger than governance transparency.
  claimRefs:
  - CO003
  - CO004
  - CO005
  tableRefs:
  - TO002
- id: funding-and-stakeholders
  title: Funding history, investors, and stakeholder concentration
  body: 'The most corroborated fresh fact in the pool is the May 2026 financing: multiple assigned sources align on a $200 million round at a $1.4 billion valuation led by Northzone. Secondary market-data pages also align on roughly $204 million total funding across two rounds since 2023, which supports the broad funding arc but does not replace primary disclosure on earlier round structure. The investor roster matters strategically because the round brought in both mainstream venture firms and strategic insurers, reinforcing the regulated-industry thesis the company is pitching. What the pool does not answer is equally important: no source here gives board composition, ownership concentration, liquidation preferences, secondaries, debt, or customer concentration, so stakeholder importance is easier to name than to underwrite precisely.'
  claimRefs:
  - CO006
  - CO007
  - CO008
  tableRefs:
  - TO003
- id: scale-signals-and-open-gaps
  title: Scale signals, proof points, and unresolved diligence gaps
  body: Blitzy has enough public proof points to justify continued diligence, but not enough to underwrite execution quality or revenue power from public data alone. The company and its syndicated releases claim dozens of Global 2000 customers, 10-industry adoption, doubled headcount, and strong code-generation throughput; PR Newswire adds one named customer example with a reported 3-5x velocity improvement. Independent commentary in the assigned pool also shows how the product is being discussed in regulated-industry contexts and what a competitor sees as the likely enterprise-friction points around pricing and deployment fit. Still, the chapter should treat ARR, customer count, governance, and absolute headcount as unresolved rather than inferred, because the assigned evidence set does not provide corroborable operating numbers for those metrics.
  claimRefs:
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
  figureRefs:
  - FO001
