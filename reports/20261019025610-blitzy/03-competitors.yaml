company:
  name: Blitzy
chapter:
  number: 3
  title: Competitors
  summary: >-
    Blitzy's closest competition is not one monolithic peer set but a stack of substitutes:
    autonomous task agents, code-review and codebase-Q&A tools, incumbent copilots, and
    internal teams layering those tools into existing workflows. Public evidence supports a
    real moat in whole-estate brownfield execution for very large enterprise codebases, but
    the same sources also show that Blitzy's commercial entry point and procurement model
    leave plenty of room for lower-friction substitutes whenever a buyer does not need batch
    modernization at Global 2000 scale.
sections:
  - id: landscape-and-classes
    title: "Landscape: direct peers, substitutes, and the status quo"
    body: >-
      Public evidence suggests Blitzy should be analyzed against several competitor classes rather than a single cohort. The direct peer set is narrow: autonomous-agent products such as Devin AI and Factory are presented as the closest software-delivery substitutes, but their public positioning emphasizes single-agent task execution or CI/CD-native workflow automation rather than Blitzy's whole-estate, multi-agent batch modernization. The broader substitute set includes GitHub Copilot, Claude Code, Augment Code, Amazon Q Developer, OpenAI Codex, Gemini Code Assist, and Greptile, all of which attack code generation, review, or codebase understanding at materially lower entry prices. The status quo remains internal engineering teams augmenting existing workflows with copilots and review tools rather than adopting a new platform of record.
    claimRefs: [CP001, CP007, CP008, CP011]
    tableRefs: [TP001]
  - id: workflow-and-buying-tradeoffs
    title: Capability, workflow, and multi-homing tradeoffs
    body: >-
      Blitzy's public differentiation is technical and operational: it claims estate-wide ingestion, a persistent knowledge graph, and thousands of agents coordinating over hours to days, which is materially different from IDE copilots or lighter-weight autonomous agents. At the same time, the company's own messaging makes clear that enterprise engineers remain in the loop. PR Review exists because very large AI-generated pull requests create a review bottleneck, and Blitzy explicitly describes its output as project guides and pull requests that still need human teams for the last mile into production. That framing matters competitively because it implies buyers can multi-home Blitzy with incumbent copilots, PR-review tools, and internal teams instead of replacing them outright.
    claimRefs: [CP002, CP005, CP006, CP014, CP015]
    tableRefs: [TP002]
  - id: pricing-and-procurement
    title: Pricing, packaging, and procurement friction
    body: >-
      Blitzy's public pricing signals are enterprise-first and sharply different from seat-based substitutes. Independent review material lists a free reverse-engineering tier, a $50,000 concept-validation stage, and a typical $500,000 annual commercial engagement, while a competitor-authored comparison argues that Blitzy's enterprise plan starts at $500,000 per year with long commitments and a transformation tier that moves into eight figures. Even if those latter figures are treated cautiously because they come from a competitor, the directional point is consistent across sources: Blitzy is sold as a large-budget platform purchase, whereas GitHub Copilot, Devin, Factory, Greptile, and similar tools are designed to be tried quickly by individual teams. That procurement gap is one of the main openings for substitutes.
    claimRefs: [CP003, CP004, CP009, CP010]
    tableRefs: [TP003]
  - id: durability-and-displacement-risk
    title: Moat durability and displacement risk
    body: >-
      The durable part of Blitzy's moat appears to be batch execution on very large brownfield estates, especially in regulated or operationally complex enterprises where context depth and auditability matter. Public customer proof from Builders FirstSource and official claims about Global 2000 traction support the idea that Blitzy has found a real buyer for that wedge. The displacement risk is that many buyers do not need that wedge every day: if a team mainly wants PR review, codebase Q&A, or lower-risk agent assistance, cheaper substitutes can cover enough of the workflow to narrow Blitzy's advantage. The biggest unresolved question is whether those substitutes merely coexist beside Blitzy or actually win head-to-head in production accounts, because public sources do not quantify win rates, churn, or replacement behavior.
    claimRefs: [CP012, CP013]
    figureRefs: [FP001]
