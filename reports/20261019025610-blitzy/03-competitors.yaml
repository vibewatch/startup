figures:
  - id: FP001
    title: "Competitive positioning map: autonomy depth (X) vs governance fit (Y)"
    type: quadrant
    summary: Ordinal 1-5 scores synthesize retained public evidence on how much autonomous batch execution each option promises and how explicit its governance or enterprise-trust posture appears.
    data:
      points:
        - label: Blitzy
          x: 5
          y: 4
          detail: Highest public autonomy depth in the retained set, paired with enterprise trust messaging but not named per-change accountability.
        - label: CloudGeometry AI-MSL
          x: 3
          y: 5
          detail: Lower autonomy than Blitzy but the strongest explicit human-governance model in the retained competitor comparison.
        - label: Devin AI
          x: 4
          y: 2
          detail: Strong autonomous task execution with materially lighter public governance and procurement posture.
        - label: Factory
          x: 4
          y: 2
          detail: Continuous autonomous workflow execution, but the retained source does not show Blitzy-level estate context or staffed governance.
        - label: GitHub Copilot
          x: 2
          y: 3
          detail: Broad enterprise distribution and compliance comfort, but positioned primarily as a developer productivity layer.
        - label: Greptile
          x: 1
          y: 2
          detail: Review and codebase-understanding tool rather than an autonomous delivery platform.
    approximationNotes: Scores are authored ordinal judgments from retained sources, not third-party benchmark measurements; X captures public autonomy and batch-delivery depth, while Y captures explicit governance, compliance, and procurement fit.
    claimRefs: [CP006, CP013, CP014, CP015]
