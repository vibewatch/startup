  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, substitutes, and the status quo'
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests Blitzy should be analyzed against several competitor classes rather than a single
              cohort. The direct peer set is narrow: autonomous-agent products such as Devin AI and Factory are
              presented as the closest software-delivery substitutes, but their public positioning emphasizes
              single-agent task execution or CI/CD-native workflow automation rather than Blitzy's whole-estate,
              multi-agent batch modernization. The broader substitute set includes GitHub Copilot, Claude Code, Augment
              Code, Amazon Q Developer, OpenAI Codex, Gemini Code Assist, and Greptile, all of which attack code
              generation, review, or codebase understanding at materially lower entry prices. The status quo remains
              internal engineering teams augmenting existing workflows with copilots and review tools rather than
              adopting a new platform of record.
            claimRefs:
              - CP001
              - CP007
              - CP008
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP007
              - CP008
              - CP009
              - CP011
      - number: '3.2'
        title: Capability, workflow, and multi-homing tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Blitzy's public differentiation is technical and operational: it claims estate-wide ingestion, a
              persistent knowledge graph, and thousands of agents coordinating over hours to days, which is materially
              different from IDE copilots or lighter-weight autonomous agents. At the same time, the company's own
              messaging makes clear that enterprise engineers remain in the loop. PR Review exists because very large
              AI-generated pull requests create a review bottleneck, and Blitzy explicitly describes its output as
              project guides and pull requests that still need human teams for the last mile into production. That
              framing matters competitively because it implies buyers can multi-home Blitzy with incumbent copilots,
              PR-review tools, and internal teams instead of replacing them outright.
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP014
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP009
              - CP010
              - CP014
              - CP015
      - number: '3.3'
        title: Pricing, packaging, and procurement friction
        blocks:
          - type: paragraph
            body: >-
              Blitzy's public pricing signals are enterprise-first and sharply different from seat-based substitutes.
              Independent review material lists a free reverse-engineering tier, a $50,000 concept-validation stage, and
              a typical $500,000 annual commercial engagement, while a competitor-authored comparison argues that
              Blitzy's enterprise plan starts at $500,000 per year with long commitments and a transformation tier that
              moves into eight figures. Even if those latter figures are treated cautiously because they come from a
              competitor, the directional point is consistent across sources: Blitzy is sold as a large-budget platform
              purchase, whereas GitHub Copilot, Devin, Factory, Greptile, and similar tools are designed to be tried
              quickly by individual teams. That procurement gap is one of the main openings for substitutes.
            claimRefs:
              - CP003
              - CP004
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP009
              - CP010
              - CP013
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The durable part of Blitzy's moat appears to be batch execution on very large brownfield estates,
              especially in regulated or operationally complex enterprises where context depth and auditability matter.
              Public customer proof from Builders FirstSource and official claims about Global 2000 traction support the
              idea that Blitzy has found a real buyer for that wedge. The displacement risk is that many buyers do not
              need that wedge every day: if a team mainly wants PR review, codebase Q&A, or lower-risk agent assistance,
              cheaper substitutes can cover enough of the workflow to narrow Blitzy's advantage. The biggest unresolved
              question is whether those substitutes merely coexist beside Blitzy or actually win head-to-head in
              production accounts, because public sources do not quantify win rates, churn, or replacement behavior.
            claimRefs:
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP006
              - CP013
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public pricing point to custom enterprise contracts
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a sales-led enterprise contracting model rather than a self-serve software
              subscription. Blitzy's own site positions the product as an autonomous platform for large existing
              codebases, not an IDE copilot, and says the system delivers roughly 80% of a project with human engineers
              finishing the rest. The same site shows a free Sandbox entry point and a named Structured Pilot at
              $250,000 of annual investment with explicit codebase-context and code-generation limits. Independent
              reporting then pushes the commercial range materially higher, describing evaluations up to $250,000 and
              annual project fees from $500,000 to more than $10 million depending on codebase scale.


              That stack implies monetization comes from scoped evaluations, annual pilot contracts, and large
              production deployments whose price is tied to codebase size, autonomy scope, and implementation burden
              instead of per-seat usage. It also means published pricing is list or market-facing framing, not realized
              revenue: none of the retained sources discloses contract mix, discounts, cancellation rights, or the share
              of services embedded inside those engagements. For underwriting, the important takeaway is that Blitzy
              appears capable of selling expensive enterprise programs, but the public record is still too thin to prove
              whether those programs behave like durable software ARR or like high-touch transformation revenue.
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI008
              - CI011
          - type: table
            tableRef: TI001
            claimRefs:
              - CI002
              - CI007
              - CI008
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
