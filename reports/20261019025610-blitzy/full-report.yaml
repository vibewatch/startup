      - number: '4.2'
        title: Traction signals exist, but public GTM efficiency data is still sparse
        blocks:
          - type: paragraph
            body: >-
              The strongest public proof of willingness to pay is not a disclosed revenue number but production-style
              customer adoption and outcome claims. Blitzy said in May 2026 that it was already adopted across dozens of
              Global 2000 enterprises in 10 industries, while a joint Builders FirstSource release said the customer saw
              a 3-5x increase in development velocity in the first three months and had already trained 120 engineers on
              AI-native workflows. Those signals support the idea that buyers will fund substantial deployments when the
              platform is attached to legacy modernization or large-scale product work.


              Even so, the GTM evidence still looks more like enterprise field selling than like repeatable low-friction
              SaaS. Public materials repeatedly frame the product around regulated or complex buyers that want
              deterministic, auditable output and measurable business throughput, which is consistent with consultative
              sales cycles and intense proof-of-value work. What is missing is the actual operating data that would tell
              an investor whether the motion scales efficiently: there is no disclosed pilot-to-production conversion,
              sales-cycle duration, customer concentration, renewal rate, or cohort retention. The result is a traction
              story that appears real, but still not underwritable on efficiency.
            claimRefs:
              - CI005
              - CI009
              - CI010
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI007
              - CI009
              - CI014
              - CI015
      - number: '4.3'
        title: Capital access is proven, while margins and runway remain opaque
        blocks:
          - type: paragraph
            body: >-
              Blitzy clearly has access to capital. The company announced a $200 million financing at a $1.4 billion
              valuation in May 2026, and the same announcement said headcount had more than doubled in the prior six
              months while new capital would fund research, go-to-market expansion, and partnerships. QuantLogix's
              October 2026 profile says there has been no new priced round since that financing and that its current
              $1.4 billion mark is simply anchored to the last confirmed round rather than a new market-clearing price.
              That matters because it separates fundraising validation from any evidence of improved revenue quality or
              margin durability after the round.


              The harder problem is cost structure. Company materials describe thousands of coordinated agents,
              days-to-weeks inference runs, and a remaining human-completion layer, all of which suggest a delivery
              model that may carry meaningful compute and services burden. Yet none of the retained public sources
              discloses gross margin, model-spend intensity, contribution margin by engagement type, cash on hand, burn,
              or debt obligations. Even basic capital totals are noisy in secondary databases, with one tracker listing
              $204 million of disclosed equity funding and another listing $250 million of total raised. The latest
              round therefore reduces near-term financing risk, but it does not answer the underwriting question of how
              efficiently Blitzy converts expensive delivery work into lasting gross profit.
            claimRefs:
              - CI003
              - CI004
              - CI006
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: 'Financial verdict: strong buyer signal, but revenue quality is still unproven'
        blocks:
          - type: paragraph
            body: >-
              The financial picture is directionally attractive but not yet investable on public evidence alone. Blitzy
              appears to sell mission-level programs into large enterprises, and its latest financing suggests investors
              believe the category can support outsized contract values. That combination can support a large business
              if the company is converting pilots into sticky annual revenue at acceptable gross margins. Public
              customer outcome claims and named enterprise references are enough to take the demand side seriously.


              The blocker is that nearly every underwriting metric that matters remains undisclosed. There is no public
              ARR or recognized revenue bridge, no gross-margin view, no CAC or payback disclosure, no churn or NRR, and
              no cash or runway disclosure beyond the fact of the round itself. Competitor framing also suggests long
              commitments and expensive entry points, which may be commercially helpful if customers expand but risky if
              sales cycles lengthen or implementation load stays heavy. On the current public record, the right
              conclusion is that Blitzy has validated capital access and buyer interest, but the business still requires
              data-room proof on revenue quality, margin path, and financing dependency before it can be underwritten
              confidently.
            claimRefs:
              - CI004
              - CI007
              - CI008
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise willingness to pay looks credible
            body: >-
              Named enterprise customers, a $200 million round, and customer-reported productivity gains all support the
              idea that Blitzy can command unusually large contracts for legacy-codebase modernization.
            calloutType: insight
            claimRefs:
