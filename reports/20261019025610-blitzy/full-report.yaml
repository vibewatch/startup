  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation stays at track because financing and customer proof are real, but the missing economic
      denominators keep valuation support incomplete.
    data:
      nodes:
        - id: financing
          label: Financing validated
          detail: $200 million at a $1.4 billion valuation is corroborated across company, investor, and independent coverage.
        - id: proof
          label: Enterprise proof exists
          detail: >-
            Public sources cite dozens of Global 2000 enterprises, 10 industries, and a named Builders FirstSource
            outcome.
        - id: economics
          label: Economics claims are directionally strong
          detail: Management claims $2.91 of ARR per $1 burned and says gross margin looks closer to SaaS.
        - id: opacity
          label: Core denominators are missing
          detail: >-
            No public ARR, revenue run rate, gross-margin percentage, or preference-stack disclosure appears in this
            pool.
        - id: category
          label: Category multiple risk remains high
          detail: >-
            Autonomous-coding peers command rich valuations, which supports upside imagination but also raises
            re-pricing risk.
        - id: recommendation
          label: 'Recommendation: track'
          detail: Stay close to the company, but underwrite only after data-room validation or on structured/discounted terms.
      edges:
        - from: financing
          to: proof
        - from: proof
          to: economics
        - from: economics
          to: opacity
        - from: opacity
          to: category
        - from: category
          to: recommendation
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV007
      - CV009
      - CV010
      - CV012
      - CV014
