  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and buyer workflow
        blocks:
          - type: paragraph
            body: >-
              Blitzy is not presented as an IDE-side assistant for short interactive edits; its own documentation and
              external practitioner writeups describe a longer-horizon operating model for enterprise codebases. The
              visible workflow starts with codebase ingestion and a technical specification that becomes the durable
              context layer for later work. A user prompt and the spec drive an action plan, the customer approves the
              plan before execution, and the output is a pull request plus an updated statement of work or spec section
              for review. Customer-facing evidence also keeps a human reviewer in the loop after execution rather than
              claiming zero-touch production deployment. That package fits large brownfield modernization and multi-file
              feature delivery better than day-to-day conversational coding.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE006
              - CE009
