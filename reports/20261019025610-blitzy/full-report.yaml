    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and product positioning
        blocks:
          - type: paragraph
            body: >-
              Blitzy can be grounded as a 2023 Cambridge, Massachusetts company selling autonomous software development
              into large enterprise codebases. The assigned official pages consistently position the platform as
              something broader than an IDE copilot: Blitzy says it reverse-engineers large codebases, builds a
              persistent understanding of the environment, and orchestrates long-running multi-agent execution through
              Blitzy OS. Third-party market-data pages in this pool broadly preserve the same framing and currently
              label the company as private and Series G, but the stage label itself is still aggregator-derived rather
              than a company filing. That distinction matters because later chapters can reuse the company identity, yet
              should not treat every scale or commercialization claim as independently verified just because multiple
              secondary profiles repeat it.
