          large-enterprise-only motion if accurate.
        - Contract data, customer-mix detail, and proof of expansion below Global 2000 scale would reduce this concern.
    notes: >-
      The anti-thesis rows include adverse and lower-confidence evidence where public sourcing is weaker; they are
      included to discipline entry assumptions rather than to present settled fact.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV006
      - CV009
      - CV011
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - ARR efficiency, SaaS-like gross margins, and enterprise expansion all validate in diligence.
        - >-
          The May 2026 $1.4 billion mark proves conservative and supports a step-up next round or premium strategic
          outcome.
        - Execution concentration, model-cost creep, and governance terms still need confirmation.
        - Only plausible if management can evidence revenue quality and durable margin structure.
      - - Base
        - Traction is real, but revenue quality and margin data are mixed or only partly compelling.
        - >-
          The last-round price is roughly fair for insiders yet not attractive enough for new money without structure or
          discount.
        - Flat valuation risk, slower conversion from pilots to scaled deployments, and customer concentration.
        - Most consistent with the current public evidence set.
      - - Bear
        - Category multiples compress or diligence shows weaker revenue quality than the headline round implies.
        - Next financing is flat, structured, or below the May 2026 mark, limiting new-investor upside.
        - Opaque preference stack, undisclosed churn/NRR, and enterprise-budget tightening.
        - Triggered by failure to verify ARR, gross margin, and contract durability.
    notes: >-
      These are scenario bands around the last known round, not a precise fair-value model; public sources in this pool
      do not support a full bottoms-up return model.
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
