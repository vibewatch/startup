      - number: '5.3'
        title: Deployment maturity, trust controls, and technical risks
        blocks:
          - type: paragraph
            body: >-
              Blitzy's public evidence shows a meaningful deployment pattern in regulated and large-enterprise contexts,
              but it does not clear every trust question needed for underwriting. CXOTalk's regulated-industry framing
              emphasizes deterministic, auditable code and full-pipeline measurement, while CloudGeometry's competitor
              critique argues that certifications and QA review are still not the same as per-change accountability.
              Those sources should not be treated as proof of failure, but they do frame the right diligence tests: what
              audit trail is available per change, how identity, secrets, and environments are segmented, what the
              rollback and incident process looks like, and which security or compliance attestations are current. The
              retained public sources do not answer those questions in detail, so trust, reliability, and governance
              remain the chapter's biggest technical gaps.
            claimRefs:
              - CE006
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Blitzy's product is a governed batch-delivery workflow, not a chat-first coding copilot
            body: >-
              The strongest overlap across official docs, practitioner walkthroughs, and customer evidence is not code
              generation alone; it is the sequence of ingestion, planning, isolated execution, validation, and PR review
              for large enterprise changes.
            calloutType: insight
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE006
          - type: callout
            title: Public trust evidence lags public autonomy claims
            body: >-
              The chapter finds repeated claims about codebase scale, agent parallelism, and velocity, but much weaker
              public evidence on deployment architecture, security boundaries, certification scope, incident handling,
              and per-change auditability.
            calloutType: risk
            claimRefs:
              - CE007
              - CE010
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Enterprise buyer profile and commercial motion
        blocks:
          - type: paragraph
            body: >-
              Public materials consistently position Blitzy as a product for large-enterprise engineering organizations
              with complex legacy estates, not as a broad-seat developer tool. The official pricing ladder starts with a
              reverse-engineering assessment, moves into paid proof-of-concept and pilot packages, then expands into
              annual commercial, enterprise, and transformation deployments with separate onboarding and generation
              charges. That structure implies a land-and-expand motion: first prove ROI on a bounded codebase, then
              expand into team, org-wide, and transformation programs if outcomes hold. The same structure is also a
              filter; third-party commentary frames Blitzy as best suited to Global 2000 budgets and multi-year
              modernization programs, which supports high ACV potential but increases buyer concentration and
              procurement friction outside the top end of the market.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU011
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU011
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU011
              - CU013
              - CU014
      - number: '6.2'
        title: Named adoption proof exists, but breadth is still mostly aggregate
        blocks:
          - type: paragraph
            body: >-
              The retained evidence shows that Blitzy is beyond pure logo slides: public materials point to adoption
              across dozens of Global 2000 enterprises, company leadership says it is operating across 10 industries,
              and independent coverage names State Street and QAD as production deployments tied to up to 5x
              engineering-velocity gains. The clearest named customer story in the retained set is Builders FirstSource,
              where a customer-quoted press release says early use cases delivered a 3-5x increase in development
              velocity and trained 120 engineers on AI-native workflows. That is meaningful proof of enterprise usage,
              but the public roster is still narrow relative to the scale implied by “dozens” of enterprises, so the
              chapter can underwrite real traction more confidently than broad customer-count durability.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
