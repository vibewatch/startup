            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM006
              - CM014
      - number: '2.4'
        title: Adoption drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers in the assigned pool are deferred legacy modernization, shortage of senior
              engineering capacity, and the need for deterministic and auditable output in regulated environments. Early
              case studies and company-linked releases describe measurable velocity gains, which helps explain why
              insurers, banks, and large industrial enterprises would evaluate the product despite its high entry cost.
              The main constraints are equally clear: the pricing signals point to a strategic infrastructure purchase
              rather than an easy pilot for mid-market teams, official sources do not disclose customer conversion or
              renewal metrics, and the only explicit multi-year commitment terms in the assigned pool come from a
              competitor-authored comparison rather than Blitzy itself. That leaves a market that is plausibly large and
              urgent for incumbents, but still under-specified in public data on conversion, contract structure, and
              category-wide TAM.
            claimRefs:
              - CM004
              - CM008
              - CM010
              - CM011
              - CM012
              - CM015
