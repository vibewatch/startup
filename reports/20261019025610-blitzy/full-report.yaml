            - Medium
            - High
            - Developing
            - Medium-High
        - label: Contract and procurement friction
          values:
            - Medium
            - Medium-High
            - Unverified
            - Medium-High
        - label: Third-party model dependency
          values:
            - Medium
            - Medium-High
