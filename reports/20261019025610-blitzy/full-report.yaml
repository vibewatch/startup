            body: >-
              The public founder story is one of the clearer parts of the evidence set. Across company-authored material
              and the May 2026 financing release, Brian Elliott is the commercial and external-facing founder while Sid
              Pardeshi anchors the technical narrative through his NVIDIA background and patent record. That gives
