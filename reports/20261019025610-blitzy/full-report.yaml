              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
      - number: '6.3'
        title: Durability, expansion, and concentration remain underdisclosed
        blocks:
          - type: paragraph
            body: >-
              The core diligence gap is not whether Blitzy can win enterprise interest; it is whether those wins renew,
              expand efficiently, and diversify fast enough to reduce concentration risk. The retained public evidence
              does not disclose net revenue retention, gross retention, churn, renewal rates, pilot-to-production
              conversion, or top-customer concentration. That omission is especially important because the HBS case
              preview still framed 2026 revenue planning and go-to-market staffing as open planning choices by mid-2026,
              and regulated-industry buying criteria emphasize determinism, auditability, and quality controls that can
              lengthen sales cycles and diligence requirements. The chapter therefore supports a view of credible
              enterprise PMF signals, but not a clean read on durability or concentration resilience.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Real enterprise references exist
            body: >-
              Public evidence goes beyond logo walls: State Street, QAD, and Builders FirstSource provide concrete
              reference points, with Builders FirstSource adding an outcome statement and rollout breadth signal.
            calloutType: strength
            claimRefs:
              - CU006
              - CU007
              - CU008
          - type: callout
            title: Durability evidence lags adoption rhetoric
            body: >-
              The public record supports enterprise adoption interest, but it does not disclose retention, renewal,
              churn, pilot-to-production conversion, or top-customer concentration metrics.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The dominant risk is not that Blitzy lacks a plausible technical control model; it is that public evidence
              does not show whether those controls work consistently on customer code under regulated change-management
              standards. Independent commentary describes mixed outcomes from autonomous coding and the possibility of
              syntactically valid but semantically wrong output. Blitzy's response is human-in-the-loop review, an
              approved action plan, and immediate testing, yet those safeguards also create review-capacity and
              accountability dependencies. The next-ranked risks are graph-context integrity, third-party model
              reliance, contract friction, and organizational scaling. Their common thesis-break condition is evidence
              that quality, procurement, or deployment throughput degrades as projects expand.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR007
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR010
              - CR012
              - CR014
      - number: '7.2'
        title: Regulatory, legal, and security exposure
        blocks:
          - type: paragraph
            body: >-
              The retained evidence identifies a buyer requirement rather than a verified legal event: regulated
              insurers need deterministic, auditable code, while the fetched Blitzy FAQ raises security, cost,
              source-of-truth, file-exclusion, and cancellation questions without supplying the answers. The assigned
              adverse search returned no result URLs, but that does not prove the absence of litigation, enforcement,
              privacy complaints, outages, or breaches. Accordingly, legal and security exposure remains unquantified
              rather than clean. A satisfactory mitigation package would include contract-level data use restrictions,
              IP indemnities, incident history, penetration-test evidence, change-control exports, and named approval
              responsibility. Failure to produce those artifacts for a regulated customer should be treated as a
              procurement blocker.
            claimRefs:
              - CR006
              - CR007
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR016
      - number: '7.3'
        title: Operational quality and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Blitzy's knowledge graph is intended to reduce the context loss that occurs when agents traverse very
              large codebases, but this makes graph accuracy and synchronization part of the quality boundary.
              SiliconANGLE reports that the graph updates through source-control integrations, while a Blitzy
              engineering executive described a practical agent context limit far below a 100-million-line estate. The
              platform also reportedly combines third-party foundation models rather than training its own, exposing
              output quality and cost to upstream model changes. Human approval, testing, and agent-on-agent checks
              mitigate these risks; they do not eliminate graph staleness, specification errors, model drift, or review
              bottlenecks. Production defect, rollback, override, and escaped-incident rates remain essential diligence.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR012
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR007
              - CR012
              - CR014
      - number: '7.4'
        title: Financial, commercial, and execution risk
        blocks:
          - type: paragraph
            body: >-
              The May 2026 company release announced a $200 million round at a $1.4 billion valuation, but funding
              raised is not cash available and the public source does not disclose burn, runway, margins, or financing
              preferences. Company-issued adoption and velocity claims also lack account-level denominators. Pricing
              evidence is weaker still: a competitor page gives two different evaluation-cost figures and conflicts with
              a Wikipedia account citing Forbes on annual package pricing. The practical monitoring set is therefore
              cash balance and burn, gross margin after inference expense, production defect rates, renewal and
              expansion cohorts, implementation time, and revenue concentration. Thesis-break triggers are inability to
              reconcile contract terms, repeated quality-control failures, or regulated deployments stalling after
              pilots.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR010
              - CR011
              - CR012
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers
            body: >-
              Reprice or stop if Blitzy cannot produce customer-ready audit artifacts, if production defect and rollback
              evidence contradicts its control claims, if regulated pilots fail to expand, or if contract, burn, margin,
              and runway evidence cannot support the obligations implied by enterprise-scale projects.
            calloutType: risk
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR010
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Public evidence supports traction, not a priced commitment
        blocks:
          - type: paragraph
            body: >-
              The public record is strong enough to validate that Blitzy closed a meaningful May 2026 growth round and
              that sophisticated investors were willing to price the company at $1.4 billion, but it is not strong
              enough to justify paying that mark without a data room. Independent and company-linked sources corroborate
              the $200 million financing, the investor group, and continued enterprise adoption language, while customer
              proof from Builders FirstSource and repeated references to Global 2000 deployments indicate that Blitzy is
              selling something enterprises will test in production-like environments. That said, the evidence still
              supports a watchlist call rather than a buy call because the public sources validate traction more clearly
              than they validate economics.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV009
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
              - CV014
      - number: '8.2'
        title: The anti-thesis is valuation opacity, not lack of ambition
        blocks:
          - type: paragraph
            body: >-
              The hardest underwriting problem is not whether Blitzy has an ambitious product story; it is whether the
              public record provides enough denominator data to judge the May 2026 price. Management claims unusually
              strong efficiency and margin characteristics, and the category remains richly valued, but Crunchbase
              explicitly notes that Blitzy did not disclose hard revenue figures, while the available sources do not
              publish a gross-margin percentage, retention data, or the financing terms that determine real entry
              economics. Independent adverse evidence is also directionally cautionary: a competitor's comparison page
              describes a high minimum contract size and long commitments, which, if accurate, reinforces the view that
              Blitzy's current model is concentrated in large-enterprise transformations rather than broadly distributed
              software spend.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV009
              - CV011
      - number: '8.3'
        title: Scenario discipline should center on proof of durable economics
        blocks:
          - type: paragraph
            body: >-
              The bull case is straightforward: if the company can substantiate the ARR efficiency claim, show SaaS-like
              margins after inference and services, and demonstrate that the Global 2000 footprint converts into
              expanding recurring revenue, the May 2026 round can look like a bridge to a much larger outcome rather
              than a valuation ceiling. The base case is flatter: the round price holds only for insiders or structured
              capital until management proves revenue quality, customer concentration, and renewal depth. The bear case
              is not that Blitzy lacks demand, but that category enthusiasm outruns monetization evidence and forces the
              next raise to be flat, structured, or lower. The right next step is therefore a diligence pack focused on
              economics, financing terms, and milestone-based thesis-break triggers before underwriting hold or exit
              timing.
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
