  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Public signals define Blitzy's wedge through modernization pain, target verticals, codebase scale, and disclosed
      commercial thresholds rather than a clean disclosed TAM/SAM/SOM.
    data:
      items:
        - label: Legacy modernization pain
          displayValue: '>$5M projects'
          note: Secondary NTT DATA proxy cited by Beri for large insurers and banks
          claimRefs:
            - CM014
        - label: Regulated-enterprise wedge
          displayValue: Government, financial services, insurance
          note: Verticals repeatedly named in company and independent coverage
          claimRefs:
            - CM004
        - label: Installed-codebase scope
          displayValue: 1M-100M+ LOC
          note: Brownfield codebase size, not a developer-seat count
          claimRefs:
            - CM002
        - label: Reported traction
          displayValue: Dozens of Global 2000 / 10 industries
          note: Company-reported adoption, with no disclosed conversion funnel
          claimRefs:
            - CM003
        - label: Structured pilot
          displayValue: $250K / 15M LOC / 500K lines
          note: Official bounded trial tier for larger brownfield estates
          claimRefs:
            - CM006
        - label: Sandbox
          displayValue: $25K / 1M LOC / 100K lines
          note: Lowest disclosed official entry point
          claimRefs:
            - CM006
    approximationNotes: >-
      This is an evidence-constrained commercial wedge, not a formal TAM/SAM/SOM bridge; public sources expose
      thresholds and buyer pain, but not a category-total revenue model.
    claimRefs:
      - CM002
      - CM003
      - CM004
      - CM006
      - CM014
  - id: FP001
    title: 'Competitive positioning map: autonomy depth (X) vs governance fit (Y)'
    type: quadrant
    summary: >-
      Ordinal 1-5 scores synthesize retained public evidence on how much autonomous batch execution each option promises
      and how explicit its governance or enterprise-trust posture appears.
    data:
      points:
        - label: Blitzy
          x: 5
          'y': 4
          detail: >-
            Highest public autonomy depth in the retained set, paired with enterprise trust messaging but not named
            per-change accountability.
        - label: CloudGeometry AI-MSL
          x: 3
          'y': 5
          detail: >-
            Lower autonomy than Blitzy but the strongest explicit human-governance model in the retained competitor
            comparison.
        - label: Devin AI
          x: 4
          'y': 2
          detail: Strong autonomous task execution with materially lighter public governance and procurement posture.
        - label: Factory
          x: 4
          'y': 2
          detail: >-
            Continuous autonomous workflow execution, but the retained source does not show Blitzy-level estate context
            or staffed governance.
        - label: GitHub Copilot
          x: 2
          'y': 3
          detail: >-
            Broad enterprise distribution and compliance comfort, but positioned primarily as a developer productivity
            layer.
        - label: Greptile
          x: 1
          'y': 2
          detail: Review and codebase-understanding tool rather than an autonomous delivery platform.
    approximationNotes: >-
      Scores are authored ordinal judgments from retained sources, not third-party benchmark measurements; X captures
      public autonomy and batch-delivery depth, while Y captures explicit governance, compliance, and procurement fit.
    claimRefs:
      - CP006
      - CP013
      - CP014
      - CP015
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows a staged monetization path from codebase intake and evaluation into large enterprise
      deployments, with human completion and customer-outcome proof embedded in the commercial model.
    data:
      nodes:
        - label: Codebase intake
          value: 1M-100M+ LOC context
          note: Reverse-engineering of large existing enterprise codebases is the prerequisite for any paid engagement.
          claimRefs:
            - CI001
        - label: Sandbox / evaluation
          value: $0 public sandbox; third-party reports say evaluations can reach $250k
          note: Entry economics are scoped and sales-led rather than seat-based.
          claimRefs:
            - CI007
            - CI011
        - label: Structured pilot
          value: $250k annual pilot tier
          note: Official site names a Structured Pilot with explicit context and generation caps.
          claimRefs:
            - CI011
        - label: Enterprise deployment
          value: $500k to >$10m annual projects
          note: >-
            Independent reporting places production deployments in a wide enterprise range that scales with codebase
            scope.
          claimRefs:
            - CI007
            - CI008
        - label: Human completion / governance
          value: ~20% human completion
          note: Blitzy says humans complete the remaining production work after autonomous output.
          claimRefs:
            - CI002
        - label: Customer outcome proof
          value: BFS reports 3-5x velocity in 3 months; 120 engineers trained
          note: Company-issued customer proof supports upsell logic but does not prove realized contract economics.
          claimRefs:
            - CI009
            - CI010
      edges:
        - from: Codebase intake
          to: Sandbox / evaluation
          label: scoping and reverse engineering
        - from: Sandbox / evaluation
          to: Structured pilot
          label: paid proof of value
        - from: Structured pilot
          to: Enterprise deployment
          label: production expansion
        - from: Enterprise deployment
          to: Human completion / governance
          label: approval and finishing work
        - from: Human completion / governance
          to: Customer outcome proof
          label: measured operating impact
    approximationNotes: >-
      This is a commercialization sequence, not a revenue or gross-profit waterfall; the values are published list
      prices or operating proxies rather than realized unit economics.
    claimRefs:
      - CI002
      - CI007
      - CI008
      - CI009
      - CI010
      - CI011
  - id: FE001
    title: Publicly described product architecture map
    type: stack
    summary: The retained evidence points to a six-layer stack from codebase ingestion through validated PR delivery.
    data:
      layers:
        - label: Customer inputs
          detail: Existing codebase, user requirements, branch selection, and environment configuration
          modules:
            - label: Repo + branch
            - label: Long-form spec / prompt
            - label: Env vars, secrets, setup commands
        - label: Persistent context
          detail: Technical specification plus a knowledge-graph style model of the estate
          modules:
            - label: Technical specification
            - label: Dependency map
            - label: Current-state context
        - label: Planning layer
          detail: Action plan derived from the prompt and spec, then approved or revised by the customer
          modules:
            - label: Agent action plan
            - label: Human approval gate
        - label: Parallel execution
          detail: Thousands of agents coordinate over long-running refactors or feature builds
          modules:
            - label: Agent orchestration
            - label: Third-party foundation models
            - label: Long-horizon execution
        - label: Validation environment
          detail: Execution occurs in isolated environments wired into the customer's validation pipeline
          modules:
            - label: Build / start commands
            - label: Tests + lint
            - label: Quality validation
        - label: Delivery loop
          detail: Output is a statement of work or spec update plus a pull request for human review and merge
          outputs:
            - label: Reviewable PR
            - label: Updated spec section
            - label: Remaining manual work
    approximationNotes: >-
      This figure synthesizes the public operating model from retained sources; internal services, data flows, and
      control boundaries remain partially undisclosed.
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE006
      - CE013
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Blitzy's public motion appears to move from codebase assessment into structured pilots, then into high-ACV
      enterprise rollouts and regulated-industry expansion.
    data:
      items:
        - label: Reverse-engineering assessment
          phase: Entry
          actor: Enterprise engineering leadership
          tone: neutral
          touchpoints:
            - Reverse Engineer ($0)
            - Codebase understanding up to 100K lines
            - ROI validation before broader commitment
          detail: Low-friction starting point for large brownfield codebases.
        - label: Paid proof of concept
          phase: Validation
          actor: Team or initiative sponsor
          tone: neutral
          touchpoints:
            - Proof of Concept ($50K for 2 months)
            - Guided validation on bounded scope
            - Converts technical promise into procurement evidence
          detail: Commercial motion begins before any org-wide contract.
        - label: Structured pilot
          phase: Pilot
          actor: Delivery team plus Blitzy FDEs
          tone: neutral
          touchpoints:
            - Structured Pilot ($250K for 6 months)
            - 5M lines onboarding; 1.25M lines generation
            - Named customer evidence starts appearing here
          detail: Pilot-sized motion precedes broader deployment.
        - label: Team deployment
          phase: Expansion
          actor: One engineering team
          tone: positive
          touchpoints:
            - Commercial tier (~$500K typical annual investment)
            - One-team acceleration on defined initiative
            - Builders FirstSource outcome proof
          detail: First credible expansion loop from assessment into budgeted usage.
        - label: Enterprise transformation
          phase: Rollout
          actor: Multi-team enterprise program sponsor
          tone: positive
          touchpoints:
            - Enterprise (~$5M typical annual investment)
            - Transformation (~$50M typical annual investment)
            - 10 industries and Global 2000 positioning
          detail: Rollout narrative is strong, but cohort economics are not public.
        - label: Governance and renewal proof
          phase: Durability
          actor: Regulated-industry buyer committee
          tone: risk
          touchpoints:
            - Auditability and deterministic-code requirements
            - Procurement friction outside Global 2000 budgets
            - Retention and pilot-to-production data undisclosed
          detail: Expansion story is visible; durability proof is still the missing loop.
    approximationNotes: >-
      Stages summarize public pricing, customer-proof, and regulated-buyer evidence rather than a disclosed internal
      funnel with measured conversion rates.
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU011
      - CU013
      - CU014
