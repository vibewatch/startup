        title: Architecture, operating model, and differentiation
        blocks:
          - type: paragraph
            body: >-
              The architecture described across company and third-party surfaces centers on persistent context plus
              parallel execution. Public materials say Blitzy reverse-engineers the codebase into a knowledge graph or
              equivalent deep contextual model, then coordinates thousands of agents for hours to days or days to weeks
              while connected to runnable validation environments. The company and its syndicated coverage tie the
              differentiation narrative to extended inference-time compute, large-codebase context, and benchmark claims
              such as a 66.5% SWE-Bench Pro score. External practitioner evidence reinforces that the system is
              optimized for large, pre-scoped refactors and net-new features rather than exploratory debugging, which is
              directionally consistent with the platform's batch-planned architecture.
