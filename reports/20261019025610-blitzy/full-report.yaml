  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitution logic
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence consistently places Blitzy inside autonomous brownfield software development for
              large enterprise codebases, not the broad seat-based market for IDE copilots, snippet generation, or
              greenfield prototyping. Official materials emphasize reverse engineering existing repositories, mapping
              dependencies, and shipping reviewed, tested pull requests against complex production environments.
              Independent coverage reinforces that wedge by describing a buyer willing to fund modernization and
              backlog-compression programs measured in hundreds of thousands to millions of dollars rather than per-seat
              subscriptions. The status-quo substitute is still multi-year legacy modernization projects and large
              in-house engineering programs, while adjacent alternatives are developer copilots and lighter code
              assistants that help individuals but do not claim the same brownfield, whole-codebase autonomy.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM008
              - CM009
              - CM013
      - number: '2.2'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The likely economic buyer is a CIO, CTO, or senior engineering leader with a modernization or platform
              mandate, while the day-to-day users are engineering managers, architects, and developers supervising
              generated output. The payer is therefore closer to a transformation, core-systems, or engineering-capacity
              budget than to a self-serve developer tools line item. Adoption also appears to be staged rather than
              purely viral: official materials describe codebase ingestion, implementation-plan review, runtime
              validation, and pull-request review, while external pilot evidence points to controlled use cases such as
              upgrades, migrations, new feature builds, and security remediation on live repositories. This makes
              Blitzy's land motion look like a bounded brownfield pilot that expands only after governance and workflow
              fit are proven inside the existing SDLC.
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM008
              - CM009
      - number: '2.3'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Public sources do not disclose an independent market-total estimate for autonomous brownfield enterprise
              software development, so the usable sizing lenses are deployment thresholds, codebase scale, and project
              economics. Official packaging shows a $25K sandbox and a $250K structured pilot tied to increasingly large
              codebase-context limits, while independent reporting places full engagements from roughly $500K to above
              $10M and frames the underlying legacy-modernization problem as a multi- million-dollar pain point at banks
              and insurers. Those signals imply a top-down wedge defined by high-value modernization budgets and
              difficult incumbent systems, not a bottom-up developer adoption curve. They also imply that Blitzy's
              accessible near-term market is narrower than the headline AI coding category because public proof clusters
              around complex brownfield programs with unusually high willingness to pay.
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM012
              - CM014
