chapter:
  number: 7
  title: Risks
  summary: >-
    Blitzy's highest residual risks are code-governance failure in regulated
    environments, dependence on a complex graph-and-model stack, and execution
    pressure created by enterprise-scale commitments. Public evidence describes
    human approval and testing controls, but does not establish Blitzy-specific
    legal clearance, incident history, cash runway, or consistent contract terms.
sections:
  - id: ranked-risk-picture
    title: Ranked risk picture
    body: >-
      The dominant risk is not that Blitzy lacks a plausible technical control
      model; it is that public evidence does not show whether those controls work
      consistently on customer code under regulated change-management standards.
      Independent commentary describes mixed outcomes from autonomous coding and
      the possibility of syntactically valid but semantically wrong output.
      Blitzy's response is human-in-the-loop review, an approved action plan, and
      immediate testing, yet those safeguards also create review-capacity and
      accountability dependencies. The next-ranked risks are graph-context
      integrity, third-party model reliance, contract friction, and organizational
      scaling. Their common thesis-break condition is evidence that quality,
      procurement, or deployment throughput degrades as projects expand.
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR007
      - CR014
    figureRefs:
      - FR001
  - id: regulatory-legal-and-security
    title: Regulatory, legal, and security exposure
    body: >-
      The retained evidence identifies a buyer requirement rather than a verified
      legal event: regulated insurers need deterministic, auditable code, while
      the fetched Blitzy FAQ raises security, cost, source-of-truth, file-exclusion,
      and cancellation questions without supplying the answers. The assigned
      adverse search returned no result URLs, but that does not prove the absence
      of litigation, enforcement, privacy complaints, outages, or breaches.
      Accordingly, legal and security exposure remains unquantified rather than
      clean. A satisfactory mitigation package would include contract-level data
      use restrictions, IP indemnities, incident history, penetration-test
      evidence, change-control exports, and named approval responsibility. Failure
      to produce those artifacts for a regulated customer should be treated as a
      procurement blocker.
    claimRefs:
      - CR006
      - CR007
      - CR016
    tableRefs:
      - TR001
  - id: operational-quality-and-dependencies
    title: Operational quality and dependency risk
    body: >-
      Blitzy's knowledge graph is intended to reduce the context loss that occurs
      when agents traverse very large codebases, but this makes graph accuracy and
      synchronization part of the quality boundary. SiliconANGLE reports that the
      graph updates through source-control integrations, while a Blitzy engineering
      executive described a practical agent context limit far below a
      100-million-line estate. The platform also reportedly combines third-party
      foundation models rather than training its own, exposing output quality and
      cost to upstream model changes. Human approval, testing, and agent-on-agent
      checks mitigate these risks; they do not eliminate graph staleness,
      specification errors, model drift, or review bottlenecks. Production defect,
      rollback, override, and escaped-incident rates remain essential diligence.
    claimRefs:
      - CR003
      - CR004
      - CR005
      - CR012
      - CR014
    tableRefs:
      - TR002
  - id: financial-commercial-and-kill-criteria
    title: Financial, commercial, and execution risk
    body: >-
      The May 2026 company release announced a $200 million round at a $1.4
      billion valuation, but funding raised is not cash available and the public
      source does not disclose burn, runway, margins, or financing preferences.
      Company-issued adoption and velocity claims also lack account-level
      denominators. Pricing evidence is weaker still: a competitor page gives two
      different evaluation-cost figures and conflicts with a Wikipedia account
      citing Forbes on annual package pricing. The practical monitoring set is
      therefore cash balance and burn, gross margin after inference expense,
      production defect rates, renewal and expansion cohorts, implementation time,
      and revenue concentration. Thesis-break triggers are inability to reconcile
      contract terms, repeated quality-control failures, or regulated deployments
      stalling after pilots.
    claimRefs:
      - CR008
      - CR009
      - CR010
      - CR011
      - CR013
      - CR015
    tableRefs:
      - TR003
