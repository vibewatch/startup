      - ["Independent media range", "Evaluations up to $250k; annual project fees $500k to >$10m", "third-party description of price bands", "No public data on average discounting, gross margin, or share of contracts at each band", "SI003 / CI007"]
      - ["Competitor framing of contract rigidity", "$500k+/yr minimum with 36-month Enterprise commitment; Transformation tier starts at $10m/yr", "competitor characterization, not verified rate card", "Adverse source may overstate rigidity to sell against Blitzy", "SI007 / CI008"]
    notes: >-
      Public price points are not the same as realized pricing, realized ACV, or
      recognized revenue; this table should be read as market-facing monetization
      evidence only.
    claimRefs: [CI007, CI008, CI011]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["ARR / recognized revenue", null, "low", "Without a revenue bridge, it is impossible to distinguish durable software ARR from project-heavy delivery revenue", "Provide monthly bookings, billings, recognized revenue, and backlog by product vs. services"]
      - ["Gross margin / inference cost", null, "low", "Thousands of agents, long inference runs, and human completion can compress margins if compute or services load is high", "Provide gross-margin bridge including model spend, hosting, people cost, and contribution margin by engagement type"]
      - ["Pilot-to-production conversion", null, "low", "High list prices only matter if pilots turn into durable production contracts", "Provide counts, ACV, and conversion rates from evaluation to pilot to production by cohort"]
      - ["Sales-cycle duration", "Not publicly disclosed; likely enterprise and consultative", "medium", "Long procurement and security reviews increase cash needs and concentration risk", "Provide median days from first meeting to paid pilot and from pilot start to production contract"]
      - ["Customer outcome proxy", "Builders FirstSource says 3-5x development-velocity gain in the first 3 months and 120 engineers trained", "medium", "Outcome proof supports willingness to pay, but it is not a direct monetization metric", "Provide before/after ROI and scope economics across multiple production customers"]
      - ["Capital adequacy", "$200m raised at $1.4b in May 2026; no public cash, burn, runway, or debt data", "medium", "Round size alone is not cash on hand and does not prove runway sufficiency", "Provide cash balance, burn, debt obligations, and next-round trigger"]
    notes: >-
      Null means the retained public sources do not disclose the metric. Qualitative
      entries are operating proxies, not audited unit-economics disclosures.
    claimRefs: [CI004, CI007, CI009, CI014, CI015]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows a staged monetization path from codebase intake and
      evaluation into large enterprise deployments, with human completion and
      customer-outcome proof embedded in the commercial model.
    data:
      nodes:
        - label: Codebase intake
          value: 1M-100M+ LOC context
          note: Reverse-engineering of large existing enterprise codebases is the prerequisite for any paid engagement.
          claimRefs: [CI001]
        - label: Sandbox / evaluation
          value: $0 public sandbox; third-party reports say evaluations can reach $250k
          note: Entry economics are scoped and sales-led rather than seat-based.
          claimRefs: [CI007, CI011]
        - label: Structured pilot
          value: $250k annual pilot tier
          note: Official site names a Structured Pilot with explicit context and generation caps.
          claimRefs: [CI011]
        - label: Enterprise deployment
          value: $500k to >$10m annual projects
          note: Independent reporting places production deployments in a wide enterprise range that scales with codebase scope.
          claimRefs: [CI007, CI008]
        - label: Human completion / governance
          value: ~20% human completion
          note: Blitzy says humans complete the remaining production work after autonomous output.
          claimRefs: [CI002]
        - label: Customer outcome proof
          value: BFS reports 3-5x velocity in 3 months; 120 engineers trained
          note: Company-issued customer proof supports upsell logic but does not prove realized contract economics.
          claimRefs: [CI009, CI010]
      edges:
        - from: Codebase intake
          to: Sandbox / evaluation
          label: scoping and reverse engineering
        - from: Sandbox / evaluation
          to: Structured pilot
          label: paid proof of value
        - from: Structured pilot
          to: Enterprise deployment
          label: production expansion
        - from: Enterprise deployment
          to: Human completion / governance
          label: approval and finishing work
        - from: Human completion / governance
          to: Customer outcome proof
          label: measured operating impact
    approximationNotes: >-
      This is a commercialization sequence, not a revenue or gross-profit waterfall;
      the values are published list prices or operating proxies rather than realized
      unit economics.
    claimRefs: [CI002, CI007, CI008, CI009, CI010, CI011]
