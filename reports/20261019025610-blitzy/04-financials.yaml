  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-quality-gap
      missingEvidence: ARR, recognized-revenue policy, deferred-revenue balance, and customer-concentration data by cohort.
      whyItMatters: Revenue quality cannot be underwritten without knowing whether public traction converts into durable recurring revenue.
      diligencePath: Request a 24-month bookings/billings/revenue bridge with customer concentration and renewal detail.
      relatedQuestionRefs: [QI002]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: margin-structure
      missingEvidence: Gross margin, model-spend burden, hosting cost, and human-services utilization by engagement type.
      whyItMatters: The platform's compute intensity and remaining human completion could materially change contribution economics.
      diligencePath: Request a gross-margin bridge that splits model/compute, infrastructure, people, and third-party tooling costs.
      relatedQuestionRefs: [QI004, QI005]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: Cash balance, monthly burn, debt or project-finance obligations, and management's next-round trigger.
      whyItMatters: A large financing event is not a runway disclosure and cannot be used as a proxy for liquidity sufficiency.
      diligencePath: Request current cash, burn, debt schedule, board budget, and base/upside/downside runway scenarios.
      relatedQuestionRefs: [QI007]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: sales-efficiency
      missingEvidence: Median sales-cycle duration, evaluation-to-pilot conversion, pilot-to-production conversion, and payback by customer segment.
      whyItMatters: Contract size can look attractive while still producing poor capital efficiency if conversion or implementation timelines are weak.
      diligencePath: Request funnel and payback cohorts segmented by regulated vs. non-regulated customers and by codebase size.
      relatedQuestionRefs: [QI003, QI008]
      relatedTableRefs: [TI001, TI003]
    - type: conflicting-data
      severity: minor
      topic: financing-totals
      missingEvidence: A reconciled financing ledger showing which public totals include only primary equity and which include secondaries or other instruments.
      whyItMatters: Inconsistent public totals are not a thesis-breaker, but they reduce confidence in using secondary databases for capital-history analysis.
      diligencePath: Request the company cap table or a board-approved financing summary that reconciles each public total-raised figure.
      relatedQuestionRefs: [QI007]
