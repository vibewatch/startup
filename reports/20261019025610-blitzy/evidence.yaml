evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: A current ARR or revenue run-rate, exact customer count, gross margin, and pilot-to-production conversion metrics.
    whyItMatters: Public scale claims are not enough to underwrite commercial quality, margin structure, or durability of demand.
    diligencePath: Request a current board or financing deck plus customer cohort metrics and unit economics in the data room.
    relatedQuestionRefs:
      - QO004
  - type: enumeration-incomplete
    severity: material
    topic: leadership and founder table coverage
    missingEvidence: A full board roster, broader executive bench, and formal governance structure.
    whyItMatters: >-
      Key-person concentration is visible, but governance resilience and succession coverage cannot be judged from
      founder bios alone.
    diligencePath: Request board materials, org chart, executive biographies, and governance documents.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder or investor map coverage
    missingEvidence: >-
      A true cap table, ownership percentages, board seats, round terms, strategic-investor rights, and customer
      concentration data.
    whyItMatters: Named stakeholders do not reveal control dynamics, return economics, or exposure to a few strategic accounts.
    diligencePath: Request cap table, term sheet summary, customer concentration schedule, and strategic-investor side letters.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: pricing-fit critique
    missingEvidence: Independent, non-competitor corroboration of current pricing floors, contract length, and evaluation economics.
    whyItMatters: >-
      The only explicit commercial critique in the assigned pool is competitor-authored, so it should inform diligence
      questions rather than be treated as verified pricing fact.
    diligencePath: Request current packaging, pricing, proof-of-concept structure, and a redlined enterprise MSA from management.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: tam-sam-som
    missingEvidence: >-
      An independent market-size report with disclosed TAM/SAM/SOM or CAGR for autonomous brownfield enterprise software
      development.
    whyItMatters: >-
      Without a category-total model, valuation and long-term market-capacity arguments rest on price thresholds and
      pain proxies rather than a comparable revenue pool.
    diligencePath: >-
      Add an analyst, public-market, or industry-association source that quantifies the category directly and separates
      brownfield enterprise autonomy from general AI coding assistants.
    relatedQuestionRefs:
      - QM002
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: conversion-and-segment-economics
    missingEvidence: >-
      Segment-level customer counts, pilot-to-production conversion, renewal behavior, and average deployed contract
      size.
    whyItMatters: >-
      Those metrics determine whether the current wedge is a repeatable market or a small number of bespoke
      transformation deals.
    diligencePath: >-
      Request cohort retention, deployment conversion, and ACV data by vertical and deal stage from management or the
      data room.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: contract-structure
    missingEvidence: >-
      Official confirmation of term length, volume commitments, and packaging boundaries above the published sandbox and
      structured-pilot tiers.
    whyItMatters: >-
      Public threshold pricing alone does not show how scalable or sticky the commercial model is for buyers outside the
      largest incumbents.
    diligencePath: >-
      Obtain Blitzy order-form or sales collateral that confirms enterprise and transformation terms, then reconcile it
      with competitor and media descriptions.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Realized contract values, discounting, renewal terms, and pilot-to-production conversion for Blitzy deployments.
    whyItMatters: >-
      Public list pricing shows procurement friction, but underwriting competitive durability requires knowing whether
      large customers actually expand, compress price, or churn.
    diligencePath: Request cohort-level sales data, expansion and renewal metrics, and a sample of signed order forms or MSAs.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: head-to-head-benchmarks
    missingEvidence: >-
      Independent head-to-head evaluations of Blitzy versus Devin, Copilot, Factory, and service-heavy alternatives on
      real enterprise brownfield tasks.
    whyItMatters: >-
      Current retained evidence describes positioning and pricing, but it does not show win rates or quality-adjusted
      ROI across comparable production deployments.
    diligencePath: >-
      Seek buyer references, paid pilot scorecards, and independent benchmark results tied to the same codebase scope
      and workflow stage.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: switching-cost-and-multi-homing
    missingEvidence: Quantified data on replacement behavior, multi-vendor usage, and time-to-value after initial deployment.
    whyItMatters: >-
      The most important competitive question is whether Blitzy displaces incumbent copilots and services or merely
      layers on top of them for a subset of workloads.
    diligencePath: >-
      Ask for deployment architecture diagrams, tooling overlap by account, and churn or contraction reasons from lost
      or downsized customers.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: revenue-quality-gap
    missingEvidence: ARR, recognized-revenue policy, deferred-revenue balance, and customer-concentration data by cohort.
    whyItMatters: >-
      Revenue quality cannot be underwritten without knowing whether public traction converts into durable recurring
      revenue.
    diligencePath: Request a 24-month bookings/billings/revenue bridge with customer concentration and renewal detail.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: margin-structure
    missingEvidence: Gross margin, model-spend burden, hosting cost, and human-services utilization by engagement type.
    whyItMatters: The platform's compute intensity and remaining human completion could materially change contribution economics.
    diligencePath: Request a gross-margin bridge that splits model/compute, infrastructure, people, and third-party tooling costs.
    relatedQuestionRefs:
      - QI004
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Cash balance, monthly burn, debt or project-finance obligations, and management's next-round trigger.
    whyItMatters: A large financing event is not a runway disclosure and cannot be used as a proxy for liquidity sufficiency.
    diligencePath: Request current cash, burn, debt schedule, board budget, and base/upside/downside runway scenarios.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: >-
      Median sales-cycle duration, evaluation-to-pilot conversion, pilot-to-production conversion, and payback by
      customer segment.
    whyItMatters: >-
      Contract size can look attractive while still producing poor capital efficiency if conversion or implementation
      timelines are weak.
    diligencePath: Request funnel and payback cohorts segmented by regulated vs. non-regulated customers and by codebase size.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: conflicting-data
    severity: minor
    topic: financing-totals
    missingEvidence: >-
      A reconciled financing ledger showing which public totals include only primary equity and which include
      secondaries or other instruments.
    whyItMatters: >-
