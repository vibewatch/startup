  topStrengths:
    - Whole-estate autonomous development positioning is differentiated from lighter coding assistants.
    - The May 2026 financing and named enterprise references support real buyer willingness to pay.
    - Public evidence points to a credible founder story and meaningful enterprise adoption.
  topRisks:
    - Revenue quality, ARR, and gross margin remain undisclosed, so software economics are still unproven.
    - Customer retention, concentration, and renewal durability are not public.
    - Deployment complexity, model dependence, and review bottlenecks may compress execution quality at scale.
  unresolvedGaps:
    - >-
      ARR and revenue run-rate remain undisclosed, so the latest valuation cannot be normalized against public
      economics.
    - Customer retention, NRR, churn, and concentration remain private beyond aggregate adoption claims.
    - Exact headcount, board composition, liquidation preferences, and other financing terms are still not public.
    - Gross margin, inference cost structure, and services mix remain opaque.
