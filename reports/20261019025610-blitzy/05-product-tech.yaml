company:
  name: "Blitzy"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Blitzy's retained product evidence consistently describes a batch-mode enterprise software-development platform:
    the codebase is ingested into a persistent technical specification and knowledge graph, a human-approved action
    plan launches large numbers of agents in isolated validation environments, and the output is a reviewable pull
    request plus an updated spec. Independent practitioner and customer-adoption evidence supports the workflow and
    reported velocity gains, but public proof of security architecture, reliability history, and formal compliance
    controls remains materially thinner than the autonomy claims.
sections:
  - id: "product-definition-and-workflow"
    title: "Product definition and buyer workflow"
    body: >-
      Blitzy is not presented as an IDE-side assistant for short interactive edits; its own documentation and external
      practitioner writeups describe a longer-horizon operating model for enterprise codebases. The visible workflow
      starts with codebase ingestion and a technical specification that becomes the durable context layer for later
      work. A user prompt and the spec drive an action plan, the customer approves the plan before execution, and the
      output is a pull request plus an updated statement of work or spec section for review. Customer-facing evidence
      also keeps a human reviewer in the loop after execution rather than claiming zero-touch production deployment.
      That package fits large brownfield modernization and multi-file feature delivery better than day-to-day
      conversational coding.
    claimRefs: ["CE001", "CE002", "CE004", "CE006", "CE009"]
    tableRefs: ["TE001", "TE002"]
  - id: "architecture-and-differentiation"
    title: "Architecture, operating model, and differentiation"
    body: >-
      The architecture described across company and third-party surfaces centers on persistent context plus parallel
      execution. Public materials say Blitzy reverse-engineers the codebase into a knowledge graph or equivalent deep
      contextual model, then coordinates thousands of agents for hours to days or days to weeks while connected to
      runnable validation environments. The company and its syndicated coverage tie the differentiation narrative to
      extended inference-time compute, large-codebase context, and benchmark claims such as a 66.5% SWE-Bench Pro
      score. External practitioner evidence reinforces that the system is optimized for large, pre-scoped refactors
      and net-new features rather than exploratory debugging, which is directionally consistent with the platform's
      batch-planned architecture.
    claimRefs: ["CE003", "CE004", "CE005", "CE007", "CE008", "CE013"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "deployment-trust-and-technical-risks"
    title: "Deployment maturity, trust controls, and technical risks"
    body: >-
      Blitzy's public evidence shows a meaningful deployment pattern in regulated and large-enterprise contexts, but
      it does not clear every trust question needed for underwriting. CXOTalk's regulated-industry framing emphasizes
      deterministic, auditable code and full-pipeline measurement, while CloudGeometry's competitor critique argues
      that certifications and QA review are still not the same as per-change accountability. Those sources should not
      be treated as proof of failure, but they do frame the right diligence tests: what audit trail is available per
      change, how identity, secrets, and environments are segmented, what the rollback and incident process looks
      like, and which security or compliance attestations are current. The retained public sources do not answer those
      questions in detail, so trust, reliability, and governance remain the chapter's biggest technical gaps.
    claimRefs: ["CE006", "CE010", "CE011", "CE012"]
callouts:
  - calloutType: "insight"
    title: "Blitzy's product is a governed batch-delivery workflow, not a chat-first coding copilot"
    body: >-
      The strongest overlap across official docs, practitioner walkthroughs, and customer evidence is not code
      generation alone; it is the sequence of ingestion, planning, isolated execution, validation, and PR review for
      large enterprise changes.
    claimRefs: ["CE001", "CE002", "CE004", "CE006"]
  - calloutType: "risk"
    title: "Public trust evidence lags public autonomy claims"
    body: >-
      The chapter finds repeated claims about codebase scale, agent parallelism, and velocity, but much weaker
      public evidence on deployment architecture, security boundaries, certification scope, incident handling, and
      per-change auditability.
    claimRefs: ["CE007", "CE010", "CE011", "CE012"]
