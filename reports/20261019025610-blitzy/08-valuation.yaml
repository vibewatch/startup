company:
  name: Blitzy
chapter:
  number: 8
  title: Valuation
  summary: "Blitzy's May 2026 $200 million round at a $1.4 billion valuation is well corroborated, and public customer proof suggests real enterprise traction, but public evidence still omits ARR, gross margin, and financing-term detail needed to underwrite that price. That mix supports a track posture rather than paying the last-round mark on public evidence alone."
sections:
  - id: investment-call
    title: "Public evidence supports traction, not a priced commitment"
    body: |-
      The public record is strong enough to validate that Blitzy closed a meaningful May 2026 growth round and that sophisticated investors were willing to price the company at $1.4 billion, but it is not strong enough to justify paying that mark without a data room. Independent and company-linked sources corroborate the $200 million financing, the investor group, and continued enterprise adoption language, while customer proof from Builders FirstSource and repeated references to Global 2000 deployments indicate that Blitzy is selling something enterprises will test in production-like environments. That said, the evidence still supports a watchlist call rather than a buy call because the public sources validate traction more clearly than they validate economics.
    claimRefs: [CV001, CV002, CV004, CV006, CV013]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: price-discipline
    title: "The anti-thesis is valuation opacity, not lack of ambition"
    body: |-
      The hardest underwriting problem is not whether Blitzy has an ambitious product story; it is whether the public record provides enough denominator data to judge the May 2026 price. Management claims unusually strong efficiency and margin characteristics, and the category remains richly valued, but Crunchbase explicitly notes that Blitzy did not disclose hard revenue figures, while the available sources do not publish a gross-margin percentage, retention data, or the financing terms that determine real entry economics. Independent adverse evidence is also directionally cautionary: a competitor's comparison page describes a high minimum contract size and long commitments, which, if accurate, reinforces the view that Blitzy's current model is concentrated in large-enterprise transformations rather than broadly distributed software spend.
    claimRefs: [CV007, CV008, CV009, CV010, CV011]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: "Scenario discipline should center on proof of durable economics"
    body: |-
      The bull case is straightforward: if the company can substantiate the ARR efficiency claim, show SaaS-like margins after inference and services, and demonstrate that the Global 2000 footprint converts into expanding recurring revenue, the May 2026 round can look like a bridge to a much larger outcome rather than a valuation ceiling. The base case is flatter: the round price holds only for insiders or structured capital until management proves revenue quality, customer concentration, and renewal depth. The bear case is not that Blitzy lacks demand, but that category enthusiasm outruns monetization evidence and forces the next raise to be flat, structured, or lower. The right next step is therefore a diligence pack focused on economics, financing terms, and milestone-based thesis-break triggers before underwriting hold or exit timing.
    claimRefs: [CV003, CV007, CV008, CV011, CV012, CV013, CV014]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: "Recommendation summary table"
    columns: [Dimension, Current read, Evidence, Decision implication]
    rows:
      - [Recommendation, Track, "Round and enterprise traction are corroborated, but price support is incomplete.", "Stay engaged, but do not pay the last-round mark on public evidence alone."]
      - [Confidence, Medium, "Financing, customer proof, and deployment claims are directionally strong; economics remain partially private.", "Upgrade only after data-room validation of revenue quality and financing terms."]
      - [Risk rating, High, "Opaque ARR, undisclosed margin percentage, and missing preference-stack detail leave downside hard to price.", "Require either a lower entry price or better downside protection."]
      - [Valuation stance, Stretched, "The $1.4 billion mark is public, but the denominator metrics needed to normalize it are not.", "Treat the last round as a negotiation anchor, not as verified fair value."]
      - [Entry discipline, Structured or discounted only, "Public evidence supports interest in the asset but not clean underwriting at headline price.", "Push for preferred economics, milestone tranches, or post-diligence repricing."]
    notes: "Public-evidence synthesis as of 2026-10-19; blanks in underlying sources reflect undisclosed company data rather than zero values."
    claimRefs: [CV001, CV002, CV004, CV006, CV009, CV013]
  - id: TV002
    title: "Thesis / anti-thesis table"
    columns: [Side, Argument, Evidence today, What would change the view]
    rows:
      - [Thesis, "Blitzy has validated enterprise appetite for autonomous development at meaningful scale.", "Dozens of Global 2000 enterprises, 10 industries, and named customer proof from Builders FirstSource.", "More named production customers and cohort-based expansion data would strengthen conviction."]
      - [Thesis, "The company is raising from a position of momentum rather than obvious distress.", "$200 million at $1.4 billion was backed by Northzone plus new and existing investors, and partner messaging frames the round as scale capital.", "A slower hiring cadence or evidence of capital being used to plug unit-economics gaps would weaken this view."]
      - [Anti-thesis, "Public valuation support is incomplete because revenue quality is not disclosed.", "Crunchbase says Blitzy did not reveal hard revenue figures, and management gives no public gross-margin percentage or retention data in this pool.", "Verified ARR, gross margin, NRR, and services-intensity metrics could convert this from opacity to evidence."]
      - [Anti-thesis, "Commercial concentration and pricing friction could narrow the buyer set.", "A competitor comparison page describes a $500K annual minimum and long commitment terms, consistent with a large-enterprise-only motion if accurate.", "Contract data, customer-mix detail, and proof of expansion below Global 2000 scale would reduce this concern."]
    notes: "The anti-thesis rows include adverse and lower-confidence evidence where public sourcing is weaker; they are included to discipline entry assumptions rather than to present settled fact."
    claimRefs: [CV001, CV003, CV004, CV006, CV009, CV011]
  - id: TV003
    title: "Bull / base / bear scenario table"
    columns: [Case, Assumptions, "Valuation / return logic", "Key risks", "Probability signal"]
    rows:
      - [Bull, "ARR efficiency, SaaS-like gross margins, and enterprise expansion all validate in diligence.", "The May 2026 $1.4 billion mark proves conservative and supports a step-up next round or premium strategic outcome.", "Execution concentration, model-cost creep, and governance terms still need confirmation.", "Only plausible if management can evidence revenue quality and durable margin structure."]
      - [Base, "Traction is real, but revenue quality and margin data are mixed or only partly compelling.", "The last-round price is roughly fair for insiders yet not attractive enough for new money without structure or discount.", "Flat valuation risk, slower conversion from pilots to scaled deployments, and customer concentration.", "Most consistent with the current public evidence set."]
      - [Bear, "Category multiples compress or diligence shows weaker revenue quality than the headline round implies.", "Next financing is flat, structured, or below the May 2026 mark, limiting new-investor upside.", "Opaque preference stack, undisclosed churn/NRR, and enterprise-budget tightening.", "Triggered by failure to verify ARR, gross margin, and contract durability."]
    notes: "These are scenario bands around the last known round, not a precise fair-value model; public sources in this pool do not support a full bottoms-up return model."
    claimRefs: [CV001, CV007, CV008, CV009, CV010, CV011, CV012, CV013]
