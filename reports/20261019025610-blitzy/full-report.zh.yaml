        title: 财务结论：买方信号强，但收入质量仍未经证明
        blocks:
          - type: paragraph
            body: >-
              财务图景方向上有吸引力，但仅凭公开证据还不能投资。Blitzy 似乎向大型企业销售任务级项目，最新融资则说明投资人相信这一类别可以支撑超大合同金额。
              如果公司能以可接受的毛利率把试点转化为黏性的年度收入，这一组合可以支撑一项大型业务。公开客户结果声明和点名企业参考已经足以让人认真看待需求侧。

              阻碍在于，几乎所有重要投资判断指标都未披露。没有公开 ARR 或确认收入桥接表，没有毛利率视角，没有 CAC 或回本期披露，没有流失率或 NRR， 也没有除融资事实以外的现金或 runway
              披露。竞争对手的表述还暗示承诺期较长、进入成本较高；如果客户扩张，这可能有利， 但若销售周期拉长或实施负担持续偏重，也会带来风险。基于当前公开记录，正确结论是：Blitzy 已验证融资能力和买方兴趣，
