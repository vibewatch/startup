        title: 定价、套餐与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              Blitzy 的公开定价信号以企业为先，与按席位计费的替代品明显不同。独立评测材料列出免费逆向工程层、$50,000 概念验证阶段和典型的 $500,000 年度商业项目；竞争对手撰写的比较则称 Blitzy
              企业计划起价为每年 $500,000，承诺期较长，转型层级进入八位数。 即使由于后两项数字来自竞争对手而应谨慎看待，各来源的方向性判断仍一致：Blitzy 被作为大预算平台采购，而 GitHub
              Copilot、Devin、Factory、 Greptile 等工具则设计成让单个团队快速试用。这一采购差距正是替代品的主要切入口之一。
