      - number: '2.2'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              可能的经济买方是承担现代化或平台职能的 CIO、CTO 或高级工程负责人；日常用户则是监督生成结果的工程经理、架构师和开发者。
              因此付款预算更接近转型、核心系统或工程产能预算，而不是自助式开发者工具科目。采用路径看起来也是分阶段推进，而非纯粹病毒式扩散： 官方材料描述了代码库导入、实施方案审查、运行时验证和 pull request
              审查；外部试点证据则指向在真实代码库上进行升级、迁移、新功能开发和安全修复等受控用例。因此，Blitzy 的切入动作更像一个边界清晰的棕地试点，只有在现有 SDLC 内证明治理和工作流匹配后才会扩张。
