      - number: '3.2'
        title: 能力、工作流与多平台并用的权衡
        blocks:
          - type: paragraph
            body: >-
              Blitzy 的公开差异化同时体现在技术和运营上：公司声称能够导入整个代码资产、建立持久知识图谱，并让数千个智能体运行数小时到数天协同工作， 这与 IDE copilot
              或更轻量的自主智能体有实质区别。与此同时，公司自己的信息也明确表示企业工程师仍在流程中。 PR Review 之所以存在，是因为超大型 AI 生成 pull request 会形成审查瓶颈；Blitzy
              也明确把产出描述为项目指南和 pull request， 最后进入生产仍需人工团队完成。这一定位在竞争上很关键：它意味着买方可以把 Blitzy 与现有 copilot、PR 审查工具和内部团队并用，
              而不必彻底替换它们。
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP014
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
