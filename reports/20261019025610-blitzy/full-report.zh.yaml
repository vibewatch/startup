              经历和专利记录支撑技术叙事。这让 Blitzy 在企业 AI 开发领域具备合理的创始人与市场匹配故事， 但也形成明显的关键人集中，因为指定资料池几乎没有披露两位创始人之外的梯队深度。资料池中没有来源点名董事会、
