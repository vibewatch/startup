        title: 身份、阶段与产品定位
        blocks:
          - type: paragraph
            body: >-
              可以将 Blitzy 确定为一家成立于 2023 年、位于 Cambridge（马萨诸塞州）的公司，向大型企业代码库销售自主软件开发能力。指定官方页面始终把该平台定位为比 IDE copilot
              更广的产品：Blitzy 称其会逆向工程大型代码库、建立对环境的持久理解， 并通过 Blitzy OS 编排长时间运行的多智能体执行。资料池中的第三方市场数据页面大体沿用了这一定位，目前将公司标为 私营企业和
              Series G，但这一阶段标签来自聚合平台，而非公司申报。这个区别很重要：后续章节可以复用公司身份， 却不能因为多个二手简介重复某项规模或商业化说法，就把它当作独立验证的事实。
