  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与公开定价指向定制化企业合同
        blocks:
          - type: paragraph
            body: >-
              公开证据指向以销售为主的企业签约模式，而非自助式软件订阅。Blitzy 官网将产品定位为面向大型现有代码库的自主平台，而不是 IDE copilot， 并称系统可以交付项目约
              80%，剩余部分由人工工程师完成。同一网站展示免费 Sandbox 入口，以及名为 Structured Pilot 的套餐， 年度投入为
              $250,000，并设有明确的代码库上下文和代码生成上限。独立报道随后把商业区间推得更高，称评估项目最高可达 $250,000， 年度项目费则根据代码库规模从 $500,000 到超过 $10M 不等。

              这套价格阶梯意味着，变现来自范围明确的评估、年度试点合同和大型生产部署，价格取决于代码库规模、自主范围及实施负担，而非按席位使用。
              这也意味着公开定价只是目录价或面向市场的表述，不是实际收入：保留的来源没有披露合同组合、折扣、取消权，或这些项目中包含的服务收入比例。 对投资判断而言，关键结论是 Blitzy
              似乎能够销售昂贵的企业项目，但公开记录仍太薄，无法证明这些项目表现得像持久的软件 ARR， 还是更像高接触式转型收入。
