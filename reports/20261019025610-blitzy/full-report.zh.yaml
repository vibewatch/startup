        title: 受证据约束的规模化视角
        blocks:
          - type: paragraph
            body: >-
              公开来源没有披露自主棕地企业软件开发的独立市场总量估算，因此可用的规模化视角是部署门槛、代码库规模和项目经济性。 官方套餐显示 $25K Sandbox 和 $250K Structured
              Pilot，并与逐步增大的代码库上下文上限绑定；独立报道则将完整项目放在约 $500K 至 $10M
              以上，并把银行和保险公司面临的遗留系统现代化问题描述为数百万美元级的痛点。这些信号指向由高价值现代化预算和难以替换的存量系统 定义的自上而下切入口，而不是自下而上的开发者采用曲线。它们也意味着，Blitzy
              近期可触达市场窄于主流 AI 编程类别， 因为公开验证集中在复杂棕地项目和异常高的支付意愿上。
