  summary: >-
    Blitzy 是一家总部位于 Cambridge、面向大型企业代码库的自主软件开发平台。公司称，其系统会逆向工程现有代码库、 构建持久化知识图谱，并编排长时间运行的多智能体执行流程，同时把最终审批和交付留给人工工程师。
    公开证据支持其已有真实企业采用和 2026 年 5 月的重要融资，但公司对合同经济性、客户集中度以及能够证明软件式 持久性的运营指标披露仍然很少。
