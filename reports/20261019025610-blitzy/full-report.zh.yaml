  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同行、替代品与现状
        blocks:
          - type: paragraph
            body: >-
              公开证据表明，分析 Blitzy 时应看多个竞争类别，而非单一同类群体。直接同行范围较窄：Devin AI、Factory 等自主智能体产品被视为最接近的软件交付替代品，
              但它们的公开定位更强调单智能体任务执行或原生 CI/CD 工作流自动化，而不是 Blitzy 面向全资产的多智能体批量现代化。 更广泛的替代品包括 GitHub Copilot、Claude
              Code、Augment Code、Amazon Q Developer、OpenAI Codex、Gemini Code Assist 和 Greptile；
              它们都以明显更低的进入价格切入代码生成、代码审查或代码库理解。现状仍是内部工程团队在现有流程中叠加 copilot 和审查工具， 而不是采用一个新的记录平台。
            claimRefs:
              - CP001
              - CP007
              - CP008
              - CP011
