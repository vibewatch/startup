      - number: '4.3'
        title: 融资能力已验证，但利润率和 runway 仍不透明
        blocks:
          - type: paragraph
            body: >-
              Blitzy 明显具备融资能力。公司在 2026 年 5 月宣布以 $1.4B 估值完成 $200M 融资，同一公告称过去六个月员工数已翻倍以上，新资金将用于研发、GTM 扩张和合作伙伴关系。QuantLogix
              的 2026 年 10 月简介称，自该轮融资以来没有新的定价轮，当前 $1.4B
              估值只是锚定在最近一次确认轮次，而不是新的市场出清价格。这一点很重要，因为它把融资验证与本轮之后收入质量或利润率持久性改善的证据区分开来。

              更难的问题是成本结构。公司材料描述了数千个协同智能体、持续数天到数周的推理运行，以及仍需人工完成的交付层，
              这都暗示交付模式可能承担显著的算力和服务负担。然而，保留的公开来源都没有披露毛利率、模型支出强度、按项目类型划分的贡献利润率、
              手头现金、烧钱速度或债务义务。即便是基本融资总额，二手数据库也存在噪声：一个追踪器列出 $204M 已披露股权融资，另一个列出 $250M 累计融资。因此，最新一轮降低了近期融资风险，却没有回答 Blitzy
              如何高效把昂贵的交付工作转化为持久毛利这一投资判断问题。
