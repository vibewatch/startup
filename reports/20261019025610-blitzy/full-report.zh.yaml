          tone: adverse
          claimRefs:
            - CO015
    approximationNotes: 部分项目只有期间而非精确日期，因为指定来源池往往只提供月份或年份粒度。
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO006
      - CO008
      - CO009
      - CO012
      - CO013
      - CO014
      - CO015
  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 公开信号通过现代化痛点、目标垂直行业、代码库规模和已披露商业门槛，勾勒出 Blitzy 的切入口，而不是给出清晰披露的 TAM / SAM / SOM。
    data:
      items:
        - label: 旧系统现代化痛点
          displayValue: '>$5M projects'
          note: Beri 引用的 NTT DATA 二手代理指标，针对大型保险公司和银行
          claimRefs:
            - CM014
        - label: 受监管企业切入口
          displayValue: Government, financial services, insurance
          note: 公司和独立报道反复提及的垂直行业
          claimRefs:
            - CM004
        - label: 已部署代码库范围
          displayValue: 1M-100M+ LOC
          note: Brownfield 代码库规模，而非开发者席位数
          claimRefs:
            - CM002
        - label: 据报道的客户进展
          displayValue: Dozens of Global 2000 / 10 industries
          note: 公司自报采用情况，但未披露转化漏斗
          claimRefs:
            - CM003
        - label: 结构化试点
          displayValue: $250K / 15M LOC / 500K lines
          note: 面向大型 Brownfield 代码库的官方限定试用层级
          claimRefs:
            - CM006
        - label: 沙盒
          displayValue: $25K / 1M LOC / 100K lines
          note: 官方披露的最低入场点
          claimRefs:
            - CM006
    approximationNotes: 这是受证据约束的商业切入口，不是正式的 TAM / SAM / SOM 桥接；公开来源展示了门槛和买方痛点，但没有展示品类总收入模型。
    claimRefs:
      - CM002
      - CM003
      - CM004
      - CM006
      - CM014
  - id: FP001
    title: 竞争定位图：自主深度（X）与治理适配度（Y）
    type: quadrant
    summary: 1-5 的序数评分综合了保留的公开证据：各选项承诺多少自主批量执行能力，以及其治理或企业信任定位有多明确。
    data:
      points:
        - label: Blitzy
          x: 5
          'y': 4
          detail: 在保留样本中，公开自主深度最高，同时传递企业信任信息，但没有按变更列出责任归属。
        - label: CloudGeometry AI-MSL
          x: 3
          'y': 5
          detail: 自主性低于 Blitzy，但在保留的竞争对比中，明确的人类治理模式最强。
        - label: Devin AI
          x: 4
          'y': 2
          detail: 自主任务执行能力强，但公开治理和采购定位明显更轻。
        - label: Factory
          x: 4
          'y': 2
          detail: 持续执行自主工作流，但保留来源没有展示 Blitzy 级别的资产背景或人员化治理。
        - label: GitHub Copilot
          x: 2
          'y': 3
          detail: 企业分发广、合规接受度高，但主要定位为开发者生产力层。
        - label: Greptile
          x: 1
          'y': 2
          detail: 这是代码审查和代码库理解工具，而非自主交付平台。
    approximationNotes: 评分是基于保留来源作出的序数判断，不是第三方基准测量；X 代表公开自主性和批量交付深度，Y 代表明确的治理、合规和采购适配度。
    claimRefs:
      - CP006
      - CP013
      - CP014
      - CP015
  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 公开证据显示，Blitzy 的变现路径分阶段从代码库接入和评估走向大型企业部署；人工收尾和客户成果证明也嵌入商业模式。
    data:
      nodes:
        - label: 代码库接入
          value: 1M-100M+ LOC context
          note: 对大型既有企业代码库进行逆向工程，是任何付费合作的前提。
          claimRefs:
            - CI001
        - label: 沙盒 / 评估
          value: $0 public sandbox; third-party reports say evaluations can reach $250k
          note: 入场经济按范围限定并由销售驱动，而不是按席位计费。
          claimRefs:
            - CI007
            - CI011
        - label: 结构化试点
          value: $250k annual pilot tier
          note: 官网将 Structured Pilot 作为正式产品，并设有明确的上下文和生成上限。
          claimRefs:
            - CI011
        - label: 企业部署
          value: $500k to >$10m annual projects
          note: 独立报道将生产部署放在宽泛的企业范围内，规模随代码库范围扩大。
          claimRefs:
            - CI007
            - CI008
        - label: 人工收尾 / 治理
          value: ~20% human completion
          note: Blitzy 称，自主输出后由人工完成剩余生产工作。
          claimRefs:
            - CI002
        - label: 客户成果证明
          value: BFS reports 3-5x velocity in 3 months; 120 engineers trained
          note: 公司发布的客户证明支持增购逻辑，但不能证明已实现的合同经济性。
          claimRefs:
            - CI009
            - CI010
      edges:
        - from: Codebase intake
          to: Sandbox / evaluation
          label: 范围界定与逆向工程
        - from: Sandbox / evaluation
          to: Structured pilot
          label: 付费价值验证
        - from: Structured pilot
          to: Enterprise deployment
          label: 生产扩张
        - from: Enterprise deployment
          to: Human completion / governance
          label: 审批与收尾工作
        - from: Human completion / governance
          to: Customer outcome proof
          label: 可衡量的运营影响
    approximationNotes: 这是商业化顺序，而不是收入或毛利润瀑布图；其中数值是公开标价或运营代理指标，不是已实现的单位经济性。
    claimRefs:
      - CI002
      - CI007
      - CI008
      - CI009
      - CI010
      - CI011
  - id: FE001
    title: 公开描述的产品架构图
    type: stack
    summary: 保留的证据指向一个六层架构，从代码库接入一直延伸到经过验证的 PR 交付。
    data:
      layers:
        - label: 客户输入
          detail: 既有代码库、用户需求、分支选择和环境配置
          modules:
            - label: 代码库 + 分支
            - label: 长文本规格 / 提示词
            - label: 环境变量、密钥、设置命令
        - label: 持久化上下文
          detail: 技术规格，以及类似知识图谱的资产模型
          modules:
            - label: 技术规格
            - label: 依赖关系图
            - label: 当前状态上下文
        - label: 规划层
          detail: 根据提示词和规格生成行动计划，再由客户批准或修改
          modules:
            - label: 智能体行动计划
            - label: 人工审批门
        - label: 并行执行
          detail: 数千个智能体协同执行长期重构或功能构建
          modules:
            - label: 智能体编排
            - label: 第三方基础模型
            - label: 长周期执行
        - label: 验证环境
          detail: 在接入客户验证流水线的隔离环境中执行
          modules:
            - label: 构建 / 启动命令
            - label: 测试 + 静态检查
            - label: 质量验证
        - label: 交付闭环
          detail: 输出为工作说明书或规格更新，并附带供人工审查和合并的拉取请求
          outputs:
            - label: Reviewable PR
            - label: Updated spec section
            - label: Remaining manual work
    approximationNotes: 该图基于保留来源综合公开运营模式；内部服务、数据流和控制边界仍有部分未披露。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE006
      - CE013
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Blitzy 的公开销售路径似乎从代码库评估开始，进入结构化试点，再走向高 ACV 企业部署和受监管行业扩张。
    data:
      items:
        - label: 逆向工程评估
          phase: 入口
          actor: 企业工程负责人
          tone: neutral
          touchpoints:
            - 逆向工程（$0）
            - 代码库理解上限 100K 行
            - 在扩大承诺前验证 ROI
          detail: 面向大型 Brownfield 代码库的低摩擦起点。
        - label: 概念验证（PoC）
          phase: 验证
          actor: 团队或项目发起人
          tone: neutral
          touchpoints:
            - 概念验证（PoC）（$50K，2 个月）
            - 在限定范围内进行引导式验证
            - 将技术承诺转化为采购证据
          detail: 在签订组织级合同前，商业化动作就已开始。
        - label: 结构化试点
          phase: 试点
          actor: 交付团队与 Blitzy FDE
          tone: neutral
          touchpoints:
            - Structured Pilot ($250K，6 个月)
            - 接入 5M 行代码；生成 1.25M 行
            - 具名客户证据开始在此出现
          detail: 先进行试点规模的商业化，再扩大部署。
        - label: 团队部署
          phase: 扩张
          actor: 一个工程团队
          tone: positive
          touchpoints:
            - 商业层级（通常年度投入约 $500K）
            - 围绕明确项目加速一个团队
            - Builders FirstSource 成果证明
          detail: 从评估走向预算化使用的第一个可信扩张闭环。
        - label: 企业转型
          phase: 推广
          actor: 多团队企业项目发起人
          tone: positive
          touchpoints:
            - Enterprise（通常年度投入约 $5M）
            - Transformation（通常年度投入约 $50M）
            - 10 个行业和 Global 2000 定位
          detail: 推广叙事很强，但队列经济性尚未公开。
        - label: 治理与续约证明
          phase: 持久性
          actor: 受监管行业买方委员会
          tone: risk
          touchpoints:
            - 可审计性和确定性代码要求
            - Global 2000 预算之外的采购摩擦
            - 留存和试点到生产的数据未披露
          detail: 扩张故事已经可见；持久性证明仍是缺失的闭环。
    approximationNotes: 这些阶段总结公开定价、客户证明和受监管买方证据，而不是披露了转化率的内部漏斗。
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU011
      - CU013
      - CU014
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 治理风险和语义代码风险同时具有高影响与不完整的公开缓解证据；融资降低了近期资本风险，但没有解决执行经济性。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解成熟度
        - 剩余严重度
      rows:
        - label: 受监管买方治理失败
          values:
            - 中高
            - 高
            - 发展中
            - 高
        - label: 语义代码或规格错误
          values:
            - 中
            - 高
            - 发展中
            - 中高
        - label: 图谱上下文或集成失败
          values:
            - 中
            - 高
            - 发展中
            - 中高
        - label: 合同与采购摩擦
          values:
            - 中
            - 中高
            - 未验证
            - 中高
        - label: 第三方模型依赖
          values:
            - 中
            - 中高
            - 部分
            - 中
        - label: 资本效率不足
          values:
            - Unknown
            - 中高
            - 仅有融资
            - Unknown
    approximationNotes: 基于保留公开证据的定性矩阵；类别不是数值概率，未知也不等于低风险。
    claimRefs:
      - CR001
      - CR002
      - CR007
      - CR010
      - CR012
      - CR014
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议维持观察，是因为融资和客户证明都真实存在，但缺失的经济分母仍使估值支撑不完整。
    data:
      nodes:
        - id: financing
          label: 融资已验证
          detail: 公司、投资者和独立报道共同印证了 $200 million、估值 $1.4 billion 的融资。
        - id: proof
          label: 企业证明存在
          detail: 公开来源提到数十家 Global 2000 企业、10 个行业，以及 Builders FirstSource 的具名成果。
        - id: economics
          label: 经济性表述方向较强
          detail: 管理层称每消耗 $1 可带来 $2.91 的 ARR，并称毛利率看起来更接近 SaaS。
        - id: opacity
          label: 核心分母缺失
          detail: 这一证据池中没有公开 ARR、收入运行率、毛利率百分比或优先股堆叠披露。
        - id: category
          label: 品类倍数风险仍高
          detail: 自主编码同业享有较高估值，既支持对上行空间的想象，也提高了重新定价风险。
        - id: recommendation
          label: 建议：观察
          detail: 继续紧密关注公司，但只有在数据室验证后，或采用结构化 / 折价条款时，才进行投资判断。
      edges:
        - from: financing
          to: proof
        - from: proof
          to: economics
        - from: economics
          to: opacity
        - from: opacity
          to: category
        - from: category
          to: recommendation
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV007
      - CV009
      - CV010
      - CV012
      - CV014
