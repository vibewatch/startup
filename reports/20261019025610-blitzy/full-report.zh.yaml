        - 更多具名生产客户和基于队列的扩张数据会增强信心。
      - - 投资逻辑
        - 公司是在动能推动下融资，而非明显陷入困境。
        - Northzone 联合新老投资者支持了 $200 million、估值 $1.4 billion 的融资；合作伙伴信息将本轮描述为规模化资本。
        - 招聘节奏放缓，或出现资本被用于填补单位经济缺口的证据，都会削弱这一判断。
      - - 反向逻辑
        - 由于收入质量未披露，公开估值支撑并不完整。
        - Crunchbase 称 Blitzy 未披露硬收入数据；在这一证据池中，管理层也没有公开毛利率百分比或留存数据。
        - 经验证的 ARR、毛利率、NRR 和服务强度指标，可能把这一问题从不透明变成证据。
      - - 反向逻辑
        - 商业集中度和定价摩擦可能收窄买方范围。
