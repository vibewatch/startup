  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代逻辑
        blocks:
          - type: paragraph
            body: >-
              指定证据始终将 Blitzy 放在面向大型企业代码库的自主棕地软件开发领域，而不是 IDE copilot、代码片段生成或仅面向绿地项目的宽泛席位市场。
              官方材料强调逆向工程现有代码库、梳理依赖关系，并针对复杂生产环境交付经过审查和测试的 pull request。
              独立报道进一步巩固了这一切入点：买方愿意为现代化和压缩积压项目投入数十万到数百万美元，而不是购买按席位计费的订阅。
              现状替代方案仍是多年期遗留系统现代化项目和大型内部工程团队；相邻替代品则是帮助个人开发者、却不宣称具备同等棕地和全代码库自主能力的 developer copilot 及轻量代码助手。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM006
