        title: 财务、商业与执行风险
        blocks:
          - type: paragraph
            body: >-
              公司 2026 年 5 月公告宣布以 $1.4B 估值完成 $200M 融资，但已融资额不等于可用现金，公开来源也没有披露烧钱速度、runway、利润率或融资优先权。
              公司发布的采用和速度声明同样缺乏账户层面的分母。定价证据更弱：一个竞争对手页面给出两个不同的评估成本数字， 并与引用 Forbes 的 Wikipedia
              说法在年度套餐定价上冲突。因此，实际监测清单应包括现金余额和烧钱速度、扣除推理成本后的毛利率、 生产缺陷率、续约和扩张
              cohort、实施时间及收入集中度。论点破裂触发条件是无法对合同条款作出一致解释、质量控制反复失败， 或受监管部署在试点后停滞。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR010
              - CR011
              - CR012
              - CR014
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 论点破裂触发条件
            body: 如果 Blitzy 无法提供客户可用的审计材料，生产缺陷和回滚证据与其控制声明相矛盾，受监管试点无法扩张， 或合同、烧钱、利润率和 runway 证据无法支撑企业级项目所隐含的义务，就应重新定价或停止推进。
            calloutType: risk
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR010
              - CR011
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开证据支持牵引力，不支持按该价格作出承诺
        blocks:
          - type: paragraph
            body: >-
              公开记录足以验证 Blitzy 在 2026 年 5 月完成了一轮重要成长融资，且成熟投资人愿意以 $1.4B 为公司定价， 但不足以在没有数据室的情况下证明应按这一估值买入。独立来源和公司关联来源共同印证了
              $200M 融资、投资人群体和持续企业采用的表述； Builders FirstSource 的客户验证以及 Global 2000 部署的反复提及，也表明 Blitzy 销售的是企业会在类生产环境中测试的产品。
              但证据仍更支持列入观察名单，而不是买入，因为公开来源对牵引力的验证明显强于对经济性的验证。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV009
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
              - CV014
      - number: '8.2'
        title: 反方论点是估值不透明，而不是缺乏雄心
        blocks:
          - type: paragraph
            body: >-
              最难的投资判断问题，不是 Blitzy 有没有雄心勃勃的产品故事，而是公开记录是否给出了足够的分母数据，让投资人判断 2026 年 5 月的价格。管理层声称效率和利润率特征异常强，且该类别估值仍然很高；但
              Crunchbase 明确指出 Blitzy
              没有披露硬收入数字，现有来源也没有发布毛利率百分比、留存数据或决定真实进入经济性的融资条款。独立的反向证据同样值得警惕：竞争对手比较页面描述了较高的最低合同额和较长的承诺期；如果属实，这进一步支持 Blitzy
              当前模式集中于大型企业转型，而不是广泛分布的软件支出。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV009
              - CV011
      - number: '8.3'
        title: 情景纪律应围绕持久经济性的证明
        blocks:
          - type: paragraph
            body: >-
              乐观情景很直接：如果公司能证明 ARR 效率声明，展示扣除推理和服务后的 SaaS 式利润率，并证明 Global 2000 覆盖转化为不断扩大的经常性收入， 那么 2026 年 5
              月融资可以看作通向更大结果的桥梁，而不是估值上限。基准情景更平：在管理层证明收入质量、客户集中度和续约深度前， 本轮价格只对内部人或结构化资本成立。悲观情景不是 Blitzy
              没有需求，而是类别热情跑在变现证据前面，迫使下一轮平价、结构化或更低估值融资。 因此，下一步应在判断持有或退出时点前，先准备一份聚焦经济性、融资条款和基于里程碑的论点破裂触发条件的尽调材料包。
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV011
