  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观情景
        - ARR 效率、SaaS 式毛利率和企业扩张都在尽调中得到验证。
        - 2026 年 5 月的 $1.4 billion 估值被证明偏保守，支持下一轮上调或更高溢价的战略结果。
        - 执行集中度、模型成本攀升和治理条款仍需确认。
        - 只有当管理层能证明收入质量和持久的利润率结构时，这一情景才可信。
      - - 基准情景
        - 客户进展真实存在，但收入质量和利润率数据参差不齐，或只能部分令人信服。
        - 上一轮价格对内部人而言大致合理，但对新资金缺乏结构或折价就不够有吸引力。
        - 估值持平风险、试点转为规模化部署的速度放缓，以及客户集中度。
        - 与当前公开证据集合最为一致。
      - - 悲观情景
        - 品类倍数压缩，或尽调显示收入质量弱于上一轮估值所暗示的水平。
        - 下一轮融资持平、结构化或低于 2026 年 5 月估值，限制新投资者的上行空间。
