    title: TAM/SAM/SOM or sizing lens table
    columns:
      - Publisher
      - Year
      - Geography
      - Value
      - CAGR
      - Methodology
      - Confidence
      - Limitation
    rows:
      - - Blitzy website
        - "2026"
        - Global product packaging
        - $25K Sandbox; 1M LOC context; 100K lines to generate
        - n/a
        - Published package tier on the company site
        - High
        - Company packaging is not the same as realized contract value or market size
      - - Blitzy website
        - "2026"
        - Global product packaging
        - $250K Structured Pilot; 15M LOC context; 500K lines to generate
        - n/a
        - Published package tier on the company site
        - High
        - Official tiering proves entry economics, not total addressable demand
      - - Beri
        - "2026"
        - Global 2000 / regulated incumbents
        - Up to $250K evaluation; $500K to >$10M annual project fees
        - n/a
        - Third-party synthesis of target-customer pricing and fit
        - Medium
        - Assigned pool does not include an official full rate card
      - - Beri citing NTT DATA
        - "2026"
        - Large insurers and banks
        - ">$5M core system replacements; 3-5 year project duration"
        - n/a
        - Secondary citation used as a proxy for the modernization pain budget
        - Low
        - Primary NTT DATA source is not in the assigned pool
      - - CloudGeometry competitor roundup
        - "2026"
        - Enterprise comparison view
        - $500K/year enterprise tier; $10M/year transformation tier; 36-48 month terms
        - n/a
        - Competitor-authored comparison of Blitzy commercial tiers
        - Low
        - Useful as contrary evidence, but not official confirmation of final contract terms
    notes: >-
      The pool lacks an independent category TAM/SAM/SOM with disclosed CAGR, so
      this table uses public economic lenses - package thresholds, engagement
      range, and modernization pain budgets - instead of pretending one broad
      estimate is comparable.
    claimRefs: [CM005, CM006, CM012, CM014]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Global 2000 brownfield modernization
        - CIO / CTO
        - Platform teams, architects, and developers
        - Transformation or engineering-capacity budget
        - Ingest repo, review plan, run autonomous build/test cycle, review PR
        - CIO or VP Engineering
        - Large legacy backlog with unacceptable delivery timelines
      - - Regulated insurers, banks, and government teams
        - Technology president or engineering executive
        - Developers, architects, compliance and release reviewers
        - Core-systems modernization or risk-mitigation budget
        - Controlled pilot on live repos with standards, tests, and auditability
        - CIO, COO, or business-unit technology lead
        - Need to modernize without breaking compliance-sensitive production systems
      - - Existing product teams on complex repos
        - Engineering manager
        - Senior engineers and product managers supervising output
        - R&D or roadmap delivery budget
        - Upgrade, migration, new feature, or remediation sprint inside current SDLC
        - VP Engineering
        - Throughput gains needed without adding equivalent headcount
      - - Development agencies with enterprise clients
        - Delivery leader
        - Implementation teams
        - Services budget or enterprise client project budget
        - Scoped modernization or build program on a client codebase
        - General manager or services lead
        - Fixed-scope legacy project where faster execution improves delivery margin
    notes: >-
      Buyer map synthesized from official positioning, documentation, and
      external pilot evidence; production customer counts by segment are not
      disclosed in the assigned pool.
    claimRefs: [CM003, CM004, CM007, CM008, CM009]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Public signals define Blitzy's wedge through modernization pain, target
      verticals, codebase scale, and disclosed commercial thresholds rather than
      a clean disclosed TAM/SAM/SOM.
    data:
      items:
        - label: Legacy modernization pain
          displayValue: ">$5M projects"
          note: Secondary NTT DATA proxy cited by Beri for large insurers and banks
          claimRefs: [CM014]
        - label: Regulated-enterprise wedge
          displayValue: Government, financial services, insurance
          note: Verticals repeatedly named in company and independent coverage
          claimRefs: [CM004]
        - label: Installed-codebase scope
          displayValue: 1M-100M+ LOC
          note: Brownfield codebase size, not a developer-seat count
          claimRefs: [CM002]
        - label: Reported traction
          displayValue: Dozens of Global 2000 / 10 industries
          note: Company-reported adoption, with no disclosed conversion funnel
          claimRefs: [CM003]
        - label: Structured pilot
          displayValue: $250K / 15M LOC / 500K lines
          note: Official bounded trial tier for larger brownfield estates
          claimRefs: [CM006]
        - label: Sandbox
          displayValue: $25K / 1M LOC / 100K lines
          note: Lowest disclosed official entry point
          claimRefs: [CM006]
    approximationNotes: >-
      This is an evidence-constrained commercial wedge, not a formal TAM/SAM/SOM
      bridge; public sources expose thresholds and buyer pain, but not a
      category-total revenue model.
    claimRefs: [CM002, CM003, CM004, CM006, CM014]
callouts:
  - calloutType: insight
    title: Brownfield transformation, not seat expansion
    body: >-
      Public evidence positions Blitzy closer to a strategic modernization
      program than to an IDE-assistant subscription, which narrows the near-
      term addressable wedge while lifting deal size.
    claimRefs: [CM005, CM006, CM013]
  - calloutType: strength
    title: Regulated incumbents have both pain and budget
    body: >-
      The sharpest buyer pull appears in regulated and legacy-heavy enterprises
      where modernization delays, auditability requirements, and large
      backlogs justify unusually high willingness to pay for throughput gains.
    claimRefs: [CM004, CM008, CM010, CM014]
  - calloutType: risk
    title: Market proof is still thin on conversion and contract structure
    body: >-
      Public sources show traction and threshold pricing, but they still do not
      disclose segment-level customer counts, renewal behavior, or officially
      confirmed long-term contract terms.
    claimRefs: [CM003, CM012]
