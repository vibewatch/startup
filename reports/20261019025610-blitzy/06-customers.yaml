company:
  name: Blitzy
chapter:
  number: 6
  title: Customers
  summary: >-
    Blitzy has credible enterprise adoption proof, but the public record is still much stronger on
    logo-quality references and project-level velocity anecdotes than on retention, renewal, or
    concentration durability. The strongest named signals are State Street, QAD, and Builders
    FirstSource, while pricing and third-party commentary imply a concentrated Global 2000 buyer set
    with meaningful procurement friction outside very large modernization budgets.
sections:
  - id: enterprise-buyer-profile
    title: Enterprise buyer profile and commercial motion
    body: >-
      Public materials consistently position Blitzy as a product for large-enterprise engineering
      organizations with complex legacy estates, not as a broad-seat developer tool. The official
      pricing ladder starts with a reverse-engineering assessment, moves into paid proof-of-concept
      and pilot packages, then expands into annual commercial, enterprise, and transformation
      deployments with separate onboarding and generation charges. That structure implies a
      land-and-expand motion: first prove ROI on a bounded codebase, then expand into team, org-wide,
      and transformation programs if outcomes hold. The same structure is also a filter; third-party
      commentary frames Blitzy as best suited to Global 2000 budgets and multi-year modernization
      programs, which supports high ACV potential but increases buyer concentration and procurement
      friction outside the top end of the market.
    claimRefs: [CU001, CU002, CU003, CU011, CU013]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: named-adoption-proof
    title: Named adoption proof exists, but breadth is still mostly aggregate
    body: >-
      The retained evidence shows that Blitzy is beyond pure logo slides: public materials point to
      adoption across dozens of Global 2000 enterprises, company leadership says it is operating
      across 10 industries, and independent coverage names State Street and QAD as production
      deployments tied to up to 5x engineering-velocity gains. The clearest named customer story in
      the retained set is Builders FirstSource, where a customer-quoted press release says early use
      cases delivered a 3-5x increase in development velocity and trained 120 engineers on
      AI-native workflows. That is meaningful proof of enterprise usage, but the public roster is
      still narrow relative to the scale implied by “dozens” of enterprises, so the chapter can
      underwrite real traction more confidently than broad customer-count durability.
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration remain underdisclosed
    body: >-
      The core diligence gap is not whether Blitzy can win enterprise interest; it is whether those
      wins renew, expand efficiently, and diversify fast enough to reduce concentration risk. The
      retained public evidence does not disclose net revenue retention, gross retention, churn,
      renewal rates, pilot-to-production conversion, or top-customer concentration. That omission is
      especially important because the HBS case preview still framed 2026 revenue planning and
      go-to-market staffing as open planning choices by mid-2026, and regulated-industry buying
      criteria emphasize determinism, auditability, and quality controls that can lengthen sales
      cycles and diligence requirements. The chapter therefore supports a view of credible enterprise
      PMF signals, but not a clean read on durability or concentration resilience.
    claimRefs: [CU010, CU011, CU012, CU014]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Global 2000 engineering organizations
        - CIO / CTO / VP Eng buyers; engineering org users; enterprise IT/digital transformation payer
        - Legacy modernization, large codebase refactoring, and autonomous delivery for brownfield systems
        - Dozens of Global 2000 enterprises; 10 industries; 50M-100M+ line contexts in third-party framing
        - Core high-ACV segment aligned to Blitzy's public positioning
        - Exact customer count, vertical mix, and contract-size distribution are undisclosed
      - - Regulated-industry buyers
        - Technology leadership buyers; platform and engineering teams as users; regulated IT budget as payer
        - Auditable, deterministic autonomous development in insurance, financial services, and government-adjacent environments
        - Regulated sectors highlighted in company expansion plans; insurer use case discussed publicly
        - Strategic wedge because compliance-sensitive buyers can justify large modernization spend
        - Named production customers are sparse and governance evidence is mostly qualitative
      - - Team-level commercial deployments
        - Team or business-unit sponsor; one engineering team as user; initiative-level transformation budget as payer
        - One-team acceleration for a defined modernization initiative after evaluation
        - Commercial tier typically priced at $500K per year after assessment / pilot stages
        - Land-and-expand entry path before org-wide rollout
        - Conversion rate from evaluation to paid expansion is undisclosed
      - - Enterprise-wide transformation programs
        - Executive sponsor buyers; multi-team engineering org users; centralized transformation budget as payer
        - Org-wide onboarding, codebase reverse engineering, and transformation-scale delivery
        - Enterprise tier typically $5M per year; Transformation tier typically $50M per year
        - Supports very large contracts if deployments succeed
        - Public evidence does not disclose top-customer concentration or renewal mix
    notes: >-
      Segmentation mixes company-issued pricing data with third-party positioning; null-like gaps
      reflect undisclosed customer counts, concentration, and conversion metrics rather than absence
      of enterprise demand.
    claimRefs: [CU001, CU002, CU003, CU005, CU011, CU013, CU014]
