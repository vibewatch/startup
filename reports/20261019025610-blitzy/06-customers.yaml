        - "2026-05-05"
        - Business Wire / Blitzy
        - medium
        - Supports cross-vertical demand rather than a single-sector story
        - By-industry customer mix and revenue contribution are undisclosed
      - - Named production references
        - State Street; QAD
        - "2026-05-15"
        - AlgeriaTech
        - medium
        - Confirms public reference customers beyond anonymous logo walls
        - Contract scope, duration, and annualized value are undisclosed
      - - Customer outcome at Builders FirstSource
        - 3-5x increase in development velocity in first 3 months
        - "2026-02-26"
        - PR Newswire / Blitzy
        - medium
        - Indicates early realized ROI at a named enterprise account
        - Baseline throughput and durability beyond initial use cases are undisclosed
      - - Deployment breadth at Builders FirstSource
        - 120 engineers trained on AI-native workflows
        - "2026-02-26"
        - PR Newswire / Blitzy
        - medium
        - Suggests usage expanded beyond a tiny experiment team
        - Total eligible engineer base and paid expansion economics are undisclosed
    notes: >-
      This table intentionally preserves missing denominators because the retained evidence contains
      breadth and velocity claims but not customer-count definitions, renewal data, or ARR by cohort.
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Builders FirstSource
        - Building materials enterprise / digital products
        - Next-generation digital solutions and technology-stack modernization
        - Production partnership with initial use cases in market
        - 3-5x development velocity gain in first 3 months; 120 engineers trained
        - Company-issued release; no contract value, renewal, or renewal cohort data
      - - State Street
        - Financial services / regulated enterprise
        - Enterprise modernization and autonomous software development deployment
        - Production deployment in third-party coverage
        - Included in third-party-cited up to 5x engineering velocity proof
        - No direct customer quote or contract scope in retained sources
      - - QAD
        - Enterprise software / manufacturing-focused ERP
        - Enterprise modernization and autonomous software development deployment
        - Production deployment in third-party coverage
        - Included with State Street in third-party-cited velocity proof
        - Scope, timing, and value remain undisclosed in retained evidence
    notes: >-
      Enumeration is partial: this captures the publicly named references in the retained source set
      as of runDate, not an exhaustive customer roster.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly named customer references visible in the retained 2025-2026 source set as of
        2026-10-19, limited to sources allocated to this chapter worker.
