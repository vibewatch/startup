evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headquarters
    missingEvidence: >-
      A current legal-entity document or official legal notice that reconciles Paris branding with Levallois
      work-location references.
    whyItMatters: >-
      Headquarters wording drives jurisdiction, service-of-process, and local-employer diligence and is currently not
      presented in one canonical line across retained public sources.
    diligencePath: Request the latest Kbis / legal mentions package and the current group org chart from management.
    relatedQuestionRefs:
      - QO006
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      A full live board roster, committee structure, investor-rights summary, and current cap-table ownership
      percentages.
    whyItMatters: >-
      Public materials identify Stanislas Niox-Chateau and Vittorio Colao, but not the full control map needed to
      evaluate governance, veto rights, and decision-making power.
    diligencePath: Request current board materials, shareholder agreement summary, and the latest financing table.
    relatedQuestionRefs:
      - QO008
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: profitability
    missingEvidence: FY2025 or FY2026 audited financials confirming whether profitability was reached after the 2024 disclosure.
    whyItMatters: >-
      The investment case changes materially if Doctolib has crossed into durable profitability versus merely narrowing
      losses while still spending heavily on expansion and AI.
    diligencePath: Request FY2025 audited accounts, 2026 management accounts, and board-approved budget versus actuals.
    relatedQuestionRefs:
      - QO018
      - QO025
  - type: missing-source
    severity: material
    topic: country-denominator-sam
    missingEvidence: >-
      A stable, machine-readable and current practitioner denominator for France and Germany that can be retained
      directly from public institutional pages in this run.
    whyItMatters: >-
      It would let the chapter convert today's monetized footprint into a cleaner country-by-country SAM instead of
      relying on ARR mix and qualitative adoption evidence.
    diligencePath: >-
      Pull direct 2025-2026 physician census tables from CNOM and KBV publications or management-provided country
      denominator decks, then rebuild the sizing table.
    relatedQuestionRefs:
      - QM010
      - QM016
    relatedTableRefs:
      - TM002
  - type: access-blocked
    severity: material
    topic: italy-telemedicine-guidance
    missingEvidence: >-
      A readable retained copy of Italy's national telemedicine guidance and any current procurement guidance for
      private platforms interacting with public access channels.
    whyItMatters: >-
      Italy is the least transparent of Doctolib's three core operating markets in public materials, which weakens
      payer-structure confidence.
    diligencePath: >-
      Fetch the ministerial guidance via a stable PDF or archive snapshot, then add procurement and reimbursement
      citations from AGENAS or regional health authorities.
    relatedQuestionRefs:
      - QM017
      - QM019
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: country-arpu-and-packaging
    missingEvidence: >-
      Current country-by-country package pricing, attach rates, and gross-to-net revenue per practitioner for France,
      Germany, and Italy.
    whyItMatters: >-
      Without package-level pricing, the chapter can estimate the installed monetized base but cannot produce a robust
      bottom-up SAM by segment and package tier.
    diligencePath: >-
      Request current price lists, contract templates, and cohort-level revenue bridges from management or channel
      partners.
    relatedQuestionRefs:
      - QM005
      - QM019
      - QM028
    relatedTableRefs:
      - TM002
      - TM003
  - type: conflicting-data
    severity: material
    topic: antitrust-remedy-impact
    missingEvidence: >-
      A final view of whether the French antitrust case will lead only to a fine or also to interoperability, conduct,
      or pricing remedies after appeal.
    whyItMatters: >-
      The remedy scope could materially alter pricing power and competitive entry barriers in Doctolib's core French
      market.
    diligencePath: >-
      Monitor the appeal docket, management disclosures, and any follow-on remedy notices from the Autorité de la
      concurrence.
    relatedQuestionRefs:
      - QM027
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-discounting
    missingEvidence: >-
      Negotiated enterprise contract terms, actual discounting, seat counts, and bundle attach rates for Doctolib,
      Maiia, CGM, Livi, and eConsult are not public.
    whyItMatters: >-
      List pricing overstates buyer certainty and can misstate whether Doctolib truly prices at a premium after
      discounts or whether incumbents buy share with bundling.
    diligencePath: >-
      Request recent signed order forms, renewal decks, discount policies, and win-loss analyses for at least France,
      Germany, and Italy.
    relatedQuestionRefs:
      - QP027
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: churn-multi-homing-and-migration-friction
    missingEvidence: >-
      Public sources do not disclose churn, multi-homing rates, migration duration, data-portability success, or
      win-back rates by competitor class.
    whyItMatters: >-
      The core underwriting question is whether marketplace and workflow lock-in are truly durable or merely expensive
      to replicate; public claims do not show actual switching behavior.
    diligencePath: >-
