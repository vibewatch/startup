  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: api-integration
    missingEvidence: A public API map or partner-integration reference that shows which EHR, billing, and telephony connectors are generally available versus private or custom-only.
    whyItMatters: Doctolib is now selling itself as a workflow operating system, so the openness of integration boundaries determines switching costs, implementation effort, and antitrust resilience.
    diligencePath: Request partner API documentation, integration catalogs by country, and at least three anonymized implementation diagrams from recent enterprise deployments.
    relatedQuestionRefs:
    - QE015
    - QE024
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: ai-safety-metrics
    missingEvidence: Independent benchmarking for consultation-assistant note quality, phone-assistant routing accuracy, false escalation rates, and emergency-detection recall.
    whyItMatters: Public marketing proves that AI assistants exist, but not that they are safe or accurate enough for scaled clinical or front-desk deployment.
    diligencePath: Ask for offline evaluation scorecards, red-team reports, clinician override rates, and post-launch incident review statistics for each assistant.
    relatedQuestionRefs:
    - QE022
    - QE026
    relatedTableRefs:
    - TE004
    - TE005
  - type: private-evidence-only
    severity: material
    topic: enterprise-rollout
    missingEvidence: Cohort data for larger-practice and hospital rollouts, including attach rates, go-live times, and support requirements for the all-in-one suite and phone assistant.
    whyItMatters: The open-source set shows solo-practice and selected-specialty positioning, but underwriting enterprise expansion requires harder proof of deployment repeatability.
    diligencePath: Request segmented pipeline and deployment metrics by practice size, specialty, and country for 2025-2026 launches.
    relatedQuestionRefs:
    - QE023
    - QE024
    relatedTableRefs:
    - TE001
    - TE005
  - type: missing-source
    severity: minor
    topic: uptime-slos
    missingEvidence: Public service-level objectives, incident-rate statistics by component, or audited uptime history beyond the status page feed.
    whyItMatters: Component-level observability exists, but buyers still lack a quantified reliability commitment for workflow-critical modules like phone assistant, patient messaging, or billing.
    diligencePath: Ask for internal SLO dashboards, on-call escalation policies, and a 12-month incident summary by major product component.
    relatedQuestionRefs:
    - QE013
    - QE027
    relatedTableRefs:
    - TE003
    - TE004
