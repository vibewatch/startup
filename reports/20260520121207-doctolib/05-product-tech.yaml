tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Workflow job
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Patient booking + companion app
    - Patients and families
    - Search, book, manage relatives, reminders, document exchange
    - Mature; live in app stores and on national booking sites
    - Turns patient access into a reusable front door for the provider workflow suite
    - Need MAU, booking conversion, and cohort-retention data by country
  - - Online calendar
    - Practices and solo providers
    - Expose availability, reduce no-shows, increase online visibility
    - Mature; public German landing page and pricing package
    - Combines visibility with workflow hooks rather than pure lead gen
    - Need specialty-level attach and switching data versus incumbents
  - - Digital reception + patient management
    - Front-desk staff
    - Handle intake, reminders, queueing, and appointment administration
    - Mature marketing surface; ROI claims based on internal stats
    - Operational pain relief is sold as part of one suite, not a bolt-on
    - Need independent before/after labor-savings studies
  - - Teleconsultation
    - Doctors and patients
    - Run secure remote consultations inside Doctolib workflow
    - Mature but strategically constrained by tying history
    - Native workflow coupling with booking and patient record context
    - Need current standalone-vs-bundled adoption split and API boundaries
  - - Clinical software + patient billing
    - Doctors, assistants, finance staff
    - Document encounters, manage billing and downstream admin
    - Expanding; third-party coverage says one app for appointment, documentation, billing
    - Moves Doctolib from front door into core practice OS territory
    - Need public proof on depth of billing/EHR functionality by country
  - - Consultation assistant
    - Clinicians
    - Transcribe and summarize visits for record creation
    - Current launch; partner case study and official landing page
    - Specific workflow value proposition with human review and deletion controls
    - Need independent quality metrics by specialty and note type
  - - Phone assistant
    - Practices, secretaries, callers
    - Automate call intake, booking, renewals, and urgency routing
    - Current launch; staged rollout into larger establishments
    - Captures offline access channel that point-booking tools miss
    - Need abandonment, transfer, and escalation error rates
  - - Doctolib Team + Siilo collaboration
    - Care teams
    - Secure peer advice and internal collaboration on patient cases
    - Integrated roadmap with standalone Siilo retained
    - Extends product from patient-provider workflow into provider-provider workflow
    - Need usage by country and interoperability with non-Doctolib systems
  notes: Rows separate public availability from public proof. Workflow depth is well evidenced; quantitative adoption and integration depth are less public.
