callouts:
- calloutType: strength
  title: The product is now a workflow stack, not just a booking surface
  body: 'Doctolib’s strongest product advantage is breadth across one care episode: patient acquisition, scheduling, reminders, teleconsultation access, consultation documentation, billing, and care-team
    messaging can all sit inside one commercial surface. That makes the suite harder to displace than a pure booking or pure telephony tool.'
  claimRefs:
  - CE001
  - CE009
  - CE019
  - CE030
  - CE032
- calloutType: risk
  title: Bundle depth is a moat, but also a live regulatory and trust risk
  body: The same integrated design that makes Doctolib sticky also triggered an antitrust fine around tying teleconsultation to booking, and public privacy criticism has not disappeared. Future expansion
    therefore depends on interoperability and safety proof, not only on adding more modules.
  claimRefs:
  - CE041
  - CE044
  - CE045
  - CE047
- calloutType: recommendation
  title: Underwrite the suite only after API, AI-eval, and enterprise-rollout evidence is provided
  body: The public set proves a broad and current product, but not enough about open integrations, AI accuracy, or large-site deployment repeatability. Those three diligence asks should gate any high-conviction
    view on product-led expansion.
  claimRefs:
  - CE019
  - CE027
  - CE038
  - CE049
