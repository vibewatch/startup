company:
  name: Doctolib
chapter:
  number: 5
  title: Product & Technology
  summary: 'Doctolib has moved well beyond appointment booking into a multi-layer healthcare workflow stack: patient booking and reminders, teleconsultation, messaging and documents, digital reception,
    practice software and billing, secure care-team collaboration, and newly launched AI assistants for consultation notes and phone intake. Public evidence is strongest on breadth, current launch cadence,
    and trust signaling—GDPR posture, ISO/HDS controls, EU-hosted health data, and a visible component-level status surface. Public evidence is weakest on open integration depth, assistant-quality benchmarks,
    and large-enterprise deployment proof. The strategic nuance is that the same bundled workflow depth that makes Doctolib differentiated also triggered French antitrust findings around tying teleconsultation
    to booking, so future product expansion must rely more on interoperability and trust than on bundle lock-in.'
sections:
- id: workflow-product-definition
  title: Workflow product definition
  body: 'Doctolib is best understood as a healthcare workflow system with two coordinated entry points, not as a simple appointment-booking widget. On the patient side, the public app and web surface let
    users book in-person or video visits, message practitioners, manage relatives’ appointments, receive reminders, and store or share medical documents. On the provider side, the public package ladder
    and feature pages show a deliberate move up the workflow stack: online calendar, patient and appointment management, digital reception, teleconsultation, clinical documentation, patient billing, and
    AI assistants. The German pages make the commercial logic especially explicit because the product ladder starts with light patient management and climbs into all-in-one practice software plus paid AI
    add-ons. That is important strategically: Doctolib’s differentiation is not any single feature, but the promise that demand capture, front-desk work, consultation documentation, and post-visit follow-up
    live in one workflow environment. The patient surface therefore acts as both access layer and retention layer for the provider software, while the provider software is sold as the operating core that
    turns access into repeatable workflow savings.'
