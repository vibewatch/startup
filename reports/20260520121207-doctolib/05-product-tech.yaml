- id: differentiation-and-technical-risk
  title: Differentiation and technical risk
  body: 'Doctolib’s product differentiation is workflow breadth with a credible trust wrapper. The company is no longer just selling a scheduling front door; it is selling a path from patient acquisition
    and reminders into documentation, billing, care-team messaging, and AI-assisted administrative labor. That breadth creates a sticky operating model and makes point solutions look narrower by comparison.
    It is also the source of the clearest product risk. The French competition authority concluded that Doctolib tied teleconsultation to the booking product and used exclusivity clauses in ways that foreclosed
    rivals, which means the product habit of coupling modules cannot be treated as a pure moat. Heise’s reporting adds a second trust risk by highlighting persistent privacy criticism from German data-protection
    advocates. The result is a nuanced verdict: technically, the suite looks broad, current, and increasingly AI-enabled; operationally, it has enough public evidence to prove seriousness; strategically,
    it must now win more through interoperability, safety, and measured workflow outcomes than through bundle lock-in. Buyers should treat open integration depth, AI evaluation rigor, and enterprise rollout
    evidence as the three main diligence gates.'
