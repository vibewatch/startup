- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / certification
  - Current status
  - Scope
  - Public proof
  - Gap
  rows:
  - - GDPR compliance and data-governance posture
    - Publicly stated
    - Doctolib Connect and broader health-data processing
    - Connect privacy policy says Doctolib complies with GDPR and local laws and works with authorities
    - No public external audit report is linked
  - - Dedicated privacy governance team
    - Publicly stated
    - DPO plus security, legal, and data-protection engineers
    - Connect privacy policy lists dedicated roles
    - No public staffing scale or response-time metrics
  - - Encrypted backups with limited retention
    - Publicly stated
    - Protected snapshots for continuity
    - Connect privacy policy says snapshots are encrypted at rest and kept up to seven days
    - No public restore-test frequency or recovery targets
  - - End-to-end encryption and authorized access
    - Publicly stated
    - Patient health data and clinician access
    - Patient help article says health data are end-to-end encrypted and only authorized clinicians can access them
    - No public key-management or admin-access model
  - - ISO 27001 + HDS + BSI audits
    - Publicly stated
    - France and Germany certifications / audits
    - Help article and compliance page cite ISO 27001, HDS, and annual BSI audits
    - No downloadable certificate register on the reviewed page set
  - - Privacy by default + European hosting
    - Publicly stated
    - Product-wide trust framing
    - Privacy page emphasizes privacy by default, encryption, consent, and European hosting
    - No public per-product data-flow map
  - - Competition-law control on bundle design
    - Adverse external finding
    - Booking + teleconsultation commercial design
    - French authority found tied selling and exclusivity practices
    - Need current contract language and interoperability commitments
  notes: Security and compliance posture is publicly stronger than the openness of implementation detail. The most material trust gap is verification depth, not absence of policy language.
