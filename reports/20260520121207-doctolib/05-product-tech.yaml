- id: operating-architecture-and-dependencies
  title: Operating architecture and dependencies
  body: 'Public evidence supports a layered operating model. Patient channels handle search, booking, teleconsultation access, reminders, and document exchange; practice modules handle calendar, reception,
    documentation, and billing; AI services sit on top of those workflows to automate note-taking and phone intake; and a collaboration layer extends the system into care-team messaging. The Microsoft case
    study is the clearest technical proof point: the consultation assistant uses Azure AI services, GPT-4o, and Mistral Large to turn live conversation into structured summaries, with clinicians reviewing
    output before it enters the record. The status page adds an important operating clue because it lists phone assistant, patient management, telehealth, patient messaging, clinical software, billing,
    and device connection as separately monitored components rather than as a monolith. That suggests Doctolib is running a product family with service boundaries that matter operationally even if the company
    does not publish a formal public architecture map. GitHub activity across database, infrastructure, and data-pipeline tooling reinforces the same picture: the company appears to operate a substantial
    internal platform estate beneath the visible workflow suite.'
