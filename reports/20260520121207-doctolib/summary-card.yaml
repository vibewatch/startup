  topStrengths:
    - >-
      99% of 2024 ARR came from provider-paid subscriptions, giving Doctolib a stronger SaaS profile than consumer-led
      telehealth peers.
    - >-
      The platform has real scale across Europe, with 400,000 paying healthcare-professional subscribers and a broader
      current surface of 520,000 professionals and 90 million people.
    - >-
      Product breadth now extends well beyond booking into messaging, teleconsultation, clinical workflow,
      billing-related tools, and AI assistants.
    - >-
      2024 ARR reached €348 million while losses narrowed sharply, supporting a credible path toward better operating
      leverage.
    - The Medicus acquisition gives Doctolib a real UK infrastructure wedge rather than a cold-start market entry.
  topRisks:
    - >-
      The French antitrust case is live and targets exclusivity, tying, and acquisition conduct that overlap with
      Doctolib's historic monetization logic.
    - France still represented 80% of 2024 ARR, so legal and geographic concentration risks compound each other.
    - Public disclosure still does not provide cash, debt, gross margin, NRR, churn, or preference-overhang visibility.
    - >-
      Public operating metrics are not fully harmonized across paying subscribers, broader professional users, bookings,
      and teleconsultations.
    - >-
      Even after the reset, the ~€3.6B secondary implies roughly 9x-10x recurring revenue and still sits above public
      workflow and HCIT comparables.
  unresolvedGaps:
    - 2025 audited revenue, EBITDA, cash, and debt disclosures remain unavailable.
    - The 2022 debt quantum, financing covenants, and liquidation-preference terms are still not public.
    - Country-level retention, churn, NRR, realized pricing, and module attach rates are not disclosed.
    - >-
      France appeal and remedy scenarios still need sensitivity analysis tied to teleconsultation and workflow attach
      economics.
    - >-
      Management has not publicly reconciled the 400k paying-subscriber base with the broader 520k professional and 90m
      user metrics.
