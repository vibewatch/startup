  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: Country- and package-level NRR, GRR, churn, and renewal cohorts for paying providers.
    whyItMatters: Public scale does not prove durability; renewal economics determine customer quality and valuation support.
    diligencePath: Request cohort tables by country, specialty, and product tier plus voluntary vs involuntary churn splits.
    relatedQuestionRefs:
    - QU016
    - QU017
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-10 customer exposure, subscriber mix by institution size, and any dependency on large provider groups or specialties.
    whyItMatters: France concentration is visible, but top-account risk is not; concentration can change renewal leverage and downside risk.
    diligencePath: Request ARR by top-10 accounts, segment mix, and country-by-country subscriber concentration.
    relatedQuestionRefs:
    - QU019
    - QU022
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named-proof
    missingEvidence: A broader current list of named live hospital, clinic, and group-practice references with deployment status and outcomes.
    whyItMatters: Public proof today is strongest on partner validation and one named GP, which is not enough to underwrite enterprise reference quality.
    diligencePath: Request customer reference list, case studies, and permissioned reference calls by country and segment.
    relatedQuestionRefs:
    - QU011
    relatedTableRefs:
    - TU003
  - type: conflicting-data
    severity: minor
    topic: metric-definition
    missingEvidence: A reconciled KPI dictionary covering subscribers, professionals using technologies, registered patients, monthly bookings, and teleconsultation counts.
    whyItMatters: Without harmonized definitions, public customer metrics are easy to over- or under-interpret in board materials.
    diligencePath: Request the exact definitions, owners, and last-refresh dates for every public customer KPI used externally.
    relatedQuestionRefs:
    - QU026
    relatedTableRefs:
    - TU002
