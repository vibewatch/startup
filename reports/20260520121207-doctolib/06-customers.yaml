- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / concentration risk
  - Current public evidence
  - Impact
  - Procurement or retention angle
  - Diligence path
  rows:
  - - Installed-base upsell into consultation assistant
    - 30-day free trial for existing Doctolib users; 15-second summary workflow proof
    - Supports higher ARPU from existing subscribers
    - Strong land-and-expand motion if attach and renewal are good
    - Request attach rates and renewal by add-on cohort
  - - Phone assistant rollout from solo to larger establishments
    - Egora says live for solo practitioners and larger establishments by early 2026
    - Expands value into call-heavy front-desk pain
    - Could deepen stickiness across practice size bands
    - Request live account count, churn, and escalation-error rates
  - - Germany specialty expansion
    - GP, pediatrics, and gynecology first, with more specialties to follow
    - Expands TAM beyond initial beachhead
    - Specialty-by-specialty rollout shapes payback and support load
    - Request specialty pipeline, conversion, and implementation burden
  - - Institutional procurement path
    - Hospital/MVZ and practice-network pages plus ISO, C5, and HDS posture
    - Opens larger ACV segments
    - Compliance is a buying prerequisite, not a marketing extra
    - Request named hospital references, procurement cycles, and security questionnaires
  - - France concentration
    - France still represented 80% of ARR in 2024
    - Revenue risk remains country-concentrated
    - Growth elsewhere helps but does not yet rebalance exposure
    - Request ARR, subscriber, and churn split by country
  - - Opaque top-account concentration
    - No public top-customer or top-10 account disclosure
    - Cannot underwrite customer concentration directly
    - Potential hidden dependence on large groups or specialties
    - Request top-10 ARR share and customer mix by segment
  - - Lock-in and price-pressure risk
    - Autorité and legal analyses cite exclusivity, tying, and post-acquisition price increases
    - Part of retention quality may be structural, not voluntary
    - Can raise future antitrust, pricing, and renewal friction
    - Request contract language changes, multi-homing data, and pricing history
  notes: Rows mix upside and risk because the same bundled workflow depth that fuels expansion can also increase regulatory and procurement friction.
