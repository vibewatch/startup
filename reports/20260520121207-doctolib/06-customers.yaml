- id: retention-expansion-and-procurement
  title: Retention proxies, expansion loops, and procurement friction
  body: |-
    The key retention problem is not that public evidence is weak on adoption; it is that renewal-quality evidence is missing. There is no public NRR, GRR, churn, or top-account concentration disclosure. That forces diligence to use proxies. The good proxies are strong: 99% of ARR comes from provider subscriptions, the platform bundles booking, messaging, teleconsultation, documentation, and assistants into one workflow, and Doctolib is clearly pushing land-and-expand from free or basic usage into patient management, consultation assistant, phone assistant, and deeper clinical software. The consultation-assistant page explicitly offers a free trial to existing Doctolib users, which is exactly what an installed-base expansion engine looks like.

    Procurement, however, is not frictionless. Institutional buyers have to clear health-data hosting and cloud-security gates, including HDS in France and BSI C5 plus broader ISO coverage in Germany and across Europe. Doctolib’s health-professional messaging stresses full price transparency and no engagement requirement, which helps the sales story, but archived provider-review evidence still surfaces contract-friction complaints. That mix suggests a real enterprise-grade product with visible upsell and institutional potential, but one where contract terms, rollout burden, and compliance due diligence still need to be tested directly in a data room rather than inferred from marketing copy.
  claimRefs:
  - CU025
  - CU031
  - CU032
  - CU034
  - CU035
  - CU036
