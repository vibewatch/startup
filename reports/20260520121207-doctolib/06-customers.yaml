tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / User / Payer
  - Geography & specialty signal
  - Adoption / proof
  - Revenue / strategic value
  - Key gap
  rows:
  - - Solo and small physician practices
    - 'Buyer: doctor or practice owner; User: doctor, secretary, patient; Payer: practice'
    - France and Germany core base
    - German practice-management and phone-assistant pages target this segment directly
    - Core recurring SaaS subscriber base and easiest add-on upsell
    - No public churn or package mix by practice size
  - - Specialist and therapy practices
    - 'Buyer: specialist owner/manager; User: staff and patients; Payer: practice'
    - Official German taxonomy includes specialists, dentists, radiology, therapy
    - Directory and specialty pages show live booking surfaces
    - Higher ARPU than basic booking if documentation or billing attach
    - No specialty-level attach rates or retention
  - - General-practice cohort
    - 'Buyer: GP office or GP network; User: GP, assistant, patient; Payer: practice'
    - Medicus cites 40,000 GPs; Germany software launched first for GPs
    - Medicus partnership, Germany rollout, Egora phone-use case
    - Strategic lighthouse specialty because it anchors access and teleconsultation
    - No public GP-only renewal or conversion cohort
  - - Nurses and allied professionals
    - 'Buyer: individual nurse or group; User: nurse and patient; Payer: practice'
    - France AI launch added nurse offer; nurse directory live on Doctolib.fr
    - Official nurse offer and live directory proof
    - Expands TAM beyond physicians and creates lower-price entry point
    - No public nurse subscriber count
  - - Hospitals and MVZs
    - 'Buyer: institution, medical director, ops lead; User: departments, front desk, patients; Payer: institution'
    - Germany page explicitly targets hospitals, clinics, and MVZs
    - Dedicated institutional landing page with patient-flow framing
    - Higher ACV and strategic procurement credibility
    - No named live hospital references or public contract values
  - - Practice networks and multi-site groups
    - 'Buyer: network management; User: central ops and local sites; Payer: group entity'
    - Germany practice-network page targets this segment directly
    - Dedicated product page and no-show benchmark
    - Potentially sticky multi-site deployment and centralization
    - No public network count or concentration by group
  notes: Maps explicit public segment surfaces; monetized customer counts are not disclosed by segment, so scale and value are directional rather than audited.
