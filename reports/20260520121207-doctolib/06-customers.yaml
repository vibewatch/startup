company:
  name: Doctolib
chapter:
  number: 6
  title: Customers
  summary: 'Doctolib’s customer model is clearly provider-paid and patient-free, with 400,000 paying healthcare-professional subscribers disclosed for 2024 against a broader current surface of 520,000 professionals and 90 million users. Germany is now materially scaled, public workflow proof is strongest on AI assistant deployment and specialty-specific rollout, and patient satisfaction signals are positive but mixed. The main diligence gap is not adoption but durability: public sources still do not disclose churn, NRR, or top-customer concentration, while regulators and reviews show meaningful lock-in, pricing, and support-friction caveats.'
sections:
- id: buyer-user-payer-segmentation
  title: Buyer, user, payer, and segment map
  body: |-
    Doctolib is not economically a patient-paid marketplace; it is primarily a provider-paid workflow platform with a very large free patient surface. Current company pages split the product into two connected layers: an operating system for health professionals and a health companion for people. Sifted adds the commercial reality that 99% of 2024 ARR came from subscriptions paid by healthcare professionals, which means the main buyer is the practitioner or provider organization, the main daily users are both practice teams and patients, and the healthcare payer reimburses the clinical act rather than Doctolib’s SaaS fee.

    The active segment map is broader than solo doctors. Germany pages explicitly market separate journeys for hospitals and MVZs, multi-site practice networks, and a wide range of specialty practices; French directory pages show live booking surfaces for GPs, pediatricians, and nurses; and Doctolib’s 2025 AI launch added a dedicated nurse offer. This matters because customer quality depends on which layer is growing. A new patient account is usage surface. A new subscriber, practice network, hospital, or assistant add-on is monetized customer depth. The chapter therefore treats provider subscriptions as the core customer metric, patient usage as a demand and retention layer, and public-payer reimbursement as an adoption enabler rather than a Doctolib revenue source.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
