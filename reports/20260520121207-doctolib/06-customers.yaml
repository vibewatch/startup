- id: named-proof-outcomes-and-satisfaction
  title: Named proof, outcomes, and satisfaction signals
  body: |-
    Public customer proof is better on workflow evidence than on blue-chip logo disclosure. The strongest named end-customer-style proof is Doctolib’s own testimonial from Brice A., a general practitioner who says the consultation assistant has become hard to work without. Microsoft provides stronger third-party validation on production maturity: the Azure customer story says Doctolib’s assistant is live, transcribes visits in real time, and generates structured summaries in fifteen seconds that physicians then validate. Medicus adds a partner-side proof point that Doctolib’s GP stack is material enough to underpin UK expansion and publicly references 40,000 GPs already supported.

    Outcome claims are directionally good but mostly company-generated. German pages say no-shows can drop by up to 58%, only around 5% of appointments are missed, half of appointments are booked outside office hours, and 96% of patients are satisfied; the practice-network page cites a lower but still material 40% average no-show reduction. Egora adds an important fresh use-case signal: 40% of calls to GPs go unanswered, the phone assistant is already live for solo practitioners, and larger establishments were due by early 2026. Independent satisfaction signals are mixed rather than bad: the App Store is very strong at 4.7/5, while Trustpilot is middling at 3.5/5 with both praise and operational complaints.
