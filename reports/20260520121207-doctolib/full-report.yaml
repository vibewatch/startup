chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and European footprint
        blocks:
          - type: paragraph
            body: >-
              Doctolib describes itself as a European digital-health platform built to improve the daily life of health
              professionals and help people live healthier lives. Current corporate materials say the company now
              combines appointment scheduling, patient communication, secure professional messaging, electronic health
              records, financial workflows, and AI assistants. The same materials frame Doctolib as both a
              health-professional operating system and a patient-facing health companion rather than only a booking
              marketplace.


              Scale claims are now large enough to anchor the rest of the report. The current about site says 520,000
              health professionals use Doctolib technologies, 90 million people use its health companion, 35 million
              teleconsultations have taken place since launch, and 14 million documents are shared each month. The
              company also says it has around 3,000 employees across more than 30 cities.


              Geographic footprint is also clear even if headquarters wording is not perfectly harmonized. Doctolib runs
              official booking sites in France, Germany, and Italy, and careers materials say the company is established
              in four countries today, including the Netherlands. Germany and Italy are no longer experimental add-ons:
              official and independent sources both show they are material operating markets. The exact headquarters
              description remains somewhat mixed in public-facing material, with current sources pointing to Paris as
              the operating center while some public references and job-posting context still tie teams to Levallois
              within the Paris metropolitan area.
