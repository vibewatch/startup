            body: >-
              Public customer proof is better on workflow evidence than on blue-chip logo disclosure. The strongest
              named end-customer-style proof is Doctolib’s own testimonial from Brice A., a general practitioner who
              says the consultation assistant has become hard to work without. Microsoft provides stronger third-party
              validation on production maturity: the Azure customer story says Doctolib’s assistant is live, transcribes
              visits in real time, and generates structured summaries in fifteen seconds that physicians then validate.
              Medicus adds a partner-side proof point that Doctolib’s GP stack is material enough to underpin UK
              expansion and publicly references 40,000 GPs already supported.


              Outcome claims are directionally good but mostly company-generated. German pages say no-shows can drop by
              up to 58%, only around 5% of appointments are missed, half of appointments are booked outside office
