            body: >-
              The main adverse customer-quality signal is that some observed durability may have been helped by lock-in
              rather than pure customer satisfaction. The French Competition Authority said Doctolib imposed exclusivity
              clauses, tied teleconsultation to prior booking subscriptions, and used the MonDocteur acquisition to
              foreclose competition. Legal analyses add that internal documents linked the deal to reducing pricing
              pressure, increasing prices, and consolidating share. That matters for customer analysis because strong
              retention generated by contractual dependence or lack of alternatives is strategically different from
              retention generated by love of the product.


              User-experience complaints are also real even if they do not outweigh the product’s evident usefulness.
              Trustpilot includes cases of erroneous no-show tagging, lost bookings, and cancelled video appointments;
              ComplaintsBoard is harsher still, though low-sample and complaint-biased; and Heise says German privacy
              criticism remains a live trust issue. The net view is favorable on customer breadth and production
              adoption, cautious on satisfaction dispersion, and incomplete on renewal durability and concentration.
              Management should be asked for subscriber cohorts by country and specialty, top-10 customer exposure, live
              hospital or group-practice references, and a reconciled KPI deck explaining exactly which customer
