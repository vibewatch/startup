      - number: '7.4'
        title: Concentration, financial model, and people execution risk
        blocks:
          - type: paragraph
            body: >-
              The financial-model risk is less about existential burn and more about concentration interacting with
              legal and execution stress. Sifted’s first real financial disclosure shows €348 million of 2024 ARR, 22.5%
              growth, €53.8 million of losses, and €115 million of R&D spend, with 99% of ARR coming from professional
              subscriptions. That is a high-quality core model in one sense: patients are not the revenue source, and
              the platform is clearly not a lead-gen marketplace that depends on ad spend or take rates. But it is also
              a concentrated one. France still represented 80% of ARR in 2024, which means the market facing the biggest
              live antitrust sanction is also the market carrying the overwhelming share of current economics.


              That concentration feeds directly into people and execution risk. Doctolib’s own appeal materials still
              point to a roughly 3,000-person company spread across 30-plus cities, while the UK move adds a fresh
              integration and hiring agenda. Public evidence is good enough to show scale and ambition, but not good
              enough to show succession depth, country-level retention, or post-remedy module attach. If growth in
              France slows, if Germany expansion remains expensive, or if UK execution absorbs too much leadership
              attention, the company can still look large and strategically important while missing the diversification
              milestones needed to justify a flat secondary valuation or an eventual IPO path. For an investor, that is
              a classic “good company, concentrated operating system” risk rather than a binary survival risk.
