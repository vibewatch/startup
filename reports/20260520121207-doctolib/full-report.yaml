  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Workflow product definition
        blocks:
          - type: paragraph
            body: >-
              Doctolib is best understood as a healthcare workflow system with two coordinated entry points, not as a
              simple appointment-booking widget. On the patient side, the public app and web surface let users book
              in-person or video visits, message practitioners, manage relatives’ appointments, receive reminders, and
              store or share medical documents. On the provider side, the public package ladder and feature pages show a
              deliberate move up the workflow stack: online calendar, patient and appointment management, digital
              reception, teleconsultation, clinical documentation, patient billing, and AI assistants. The German pages
              make the commercial logic especially explicit because the product ladder starts with light patient
              management and climbs into all-in-one practice software plus paid AI add-ons. That is important
              strategically: Doctolib’s differentiation is not any single feature, but the promise that demand capture,
              front-desk work, consultation documentation, and post-visit follow-up live in one workflow environment.
              The patient surface therefore acts as both access layer and retention layer for the provider software,
              while the provider software is sold as the operating core that turns access into repeatable workflow
              savings.
