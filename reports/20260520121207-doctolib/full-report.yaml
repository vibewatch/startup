      - number: '6.2'
        title: Adoption trajectory, geography, and metric consistency
        blocks:
          - type: paragraph
            body: >-
              The adoption story is strong but not perfectly harmonized. Sifted’s 2024 disclosure gives the best
              monetized baseline: 400,000 paying healthcare-professional subscribers, 80 million patient accounts,
              France at 80% of ARR, and Germany already at 17%. Official current materials describe a broader
              top-of-funnel surface of 520,000 health professionals and 90 million people using Doctolib technologies,
              which is directionally consistent with scale growth but clearly not the same denominator as paying
              subscribers.


              Germany is the clearest second-market proof. Sifted reported 25 million patients and 100,000 healthcare
              professionals there in 2024, while German product pages cite 25 million registered patients and either 1.9
              million or more than 3 million monthly bookings depending on the page. That inconsistency is not fatal,
              but it does mean diligence should request the exact current Germany KPI definitions before using any
              single marketing number as a board metric. Teleconsultation figures show the same issue. The corporate
              about page says 35 million teleconsultations since launch, yet French health insurance alone counted 13.9
              million teleconsultations in France in 2024. The clean conclusion is that Doctolib has real multi-country
              usage depth, but some of its public customer metrics are marketing-layer numbers rather than a tightly
              versioned operating dashboard.
