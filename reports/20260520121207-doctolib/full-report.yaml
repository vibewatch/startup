      - number: '1.3'
        title: Funding history, investor map, and 2024-2026 financial trajectory
        blocks:
          - type: paragraph
            body: >-
              Doctolib's capital history is one of the cleanest parts of the public record. TechCrunch reported that the
              company's 2019 $170 million (€150 million) round, led by General Atlantic with Accel, Eurazeo, Kernel, and
              Bpifrance participating, took the company to roughly €1 billion of post-money valuation and established
              Doctolib as a unicorn. In March 2022, TechCrunch and FrenchWeb both reported a much larger €500 million
              raise, structured as equity and debt, with Eurazeo leading and Bpifrance plus General Atlantic
              participating. Those sources pegged valuation at €5.8 billion, or roughly $6.4 billion, making Doctolib
              the highest-valued French startup at the time.


              The harder question is what the business looks like after that mark-up. Here the first real disclosure
              only appears in 2025 reporting on the 2024 year. Sifted said Doctolib reached €348 million of ARR in 2024,
              up 22.5% year over year, while losses narrowed 38% to €53.8 million. Sifted also said nearly €300 million
              of revenue had been reached in 2023 and that 99% of ARR comes from subscriptions paid by healthcare
              professionals. France still represented 80% of ARR in 2024, but Germany contributed 17% and Italy just
              under 3%, showing that the non-French business is becoming financially material.


              The trajectory into 2026 is positive but not fully closed. Sifted said profitability was expected within
              months, and Forbes later described roughly $400 million of annualized 2024 subscription revenue and losses
              of about $60 million, but no audited 2025 or 2026 profitability statement was retained. Public
              total-raised figures also vary, with long-form profiles citing more than $815 million and Forbes citing
              about $842 million via PitchBook.
