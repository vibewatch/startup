      - number: '8.4'
        title: Bull, base, bear, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The scenario framework should stay deliberately simple because public inputs are still incomplete. The
              bull case assumes Doctolib keeps growing above 20%, proves durable profitability, expands meaningfully in
              Germany and the UK, and avoids a remedy outcome that materially weakens France attach economics. In that
              world, paying around 9x to 10x recurring revenue can still be justified and the valuation can recover part
              of the lost ground toward the 2022 mark.


              The base case is more conservative. It assumes that the 2026 secondary is directionally fair for today's
              evidence set: growth continues, but not at pandemic-era multiples; margins improve, but public proof is
              still too thin; and antitrust overhang remains a discount rather than a thesis-break. Under that view,
              current holders may be fine, but a new investor does not yet have a clear margin of safety.


              The bear case is not operational collapse. It is multiple compression plus legal friction. If France
              remedies reduce bundle power, if UK execution takes longer than hoped, or if the market converges closer
              to 5x-6x recurring revenue for opaque HCIT names, value can still reset materially lower. That is why
              entry discipline matters more than admiration. The same company can be compelling at €2.5-€3.0 billion and
              stretched at €3.6 billion.
            claimRefs:
              - CV038
              - CV039
              - CV040
