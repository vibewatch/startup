      - number: '7.2'
        title: Privacy, security, AI, and operational reliability
        blocks:
          - type: paragraph
            body: >-
              Doctolib’s second risk cluster sits where sensitive health data, public-service reliability, and
              AI-assisted documentation meet. Official privacy commitments are directionally strong: the company says it
              uses 2FA by default, encrypts data at rest and in transit, stores master encryption keys at ATOS, routes
              TLS termination in Europe behind Cloudflare, and relies on AWS infrastructure carrying HDS and C5
              attestations. Connect adds another trust layer with end-to-end encryption, ephemeral messages, ISO 27001,
              NEN 7510, and C5 Type 1 controls. Elastic’s customer story also shows that Doctolib had to internalize its
              SOC to reduce false positives and extend retention, which is a positive mitigation signal but also an
              admission that the prior operating model was too noisy for the platform’s threat profile.


              The residual exposure comes from what remains unproven in public. The official status page still shows a
              May 6, 2026 incident on a live multi-product surface. Heise reports ongoing criticism from data-protection
              advocates and recurring complaints reaching the Berlin regulator. On the AI side, Microsoft and Doctolib
              engineering show a thoughtful human-review loop, post-summary deletion of audio and transcripts,
              hallucination-focused evaluation, and A/B testing. But those sources do not publish specialty-level error
              rates, silent-failure reviews, or escalation thresholds for misdocumentation and call-routing mistakes. In
              a workflow that touches records, prescriptions, and patient follow-up, the fact that safeguards exist is
              encouraging; the fact that outcome metrics remain mostly private is the risk.
