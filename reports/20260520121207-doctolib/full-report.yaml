            body: >-
              The public rollout story is real but unevenly evidenced. In Germany, third-party reporting says the new
              all-in-one practice software initially targets general practitioners, pediatricians, and gynecologists,
              with more specialties due in 2026. The same reporting says the bundle collapses appointment management,
              documentation, and billing into one application and layers three AI assistants on top. The phone assistant
              appears to be the clearest near-term expansion lever because public coverage already describes concrete
              routing behaviors, visible pricing, and a staged rollout from solo practitioners toward larger
              establishments by early 2026. Collaboration is also moving outward: the 2023 Siilo acquisition adds a
              mobile-first care-team surface while leaving Siilo standalone during integration into Doctolib Team. What
              remains opaque is exactly where deployment boundaries sit for larger groups and third-party software
              partners. Public sources do not provide a broad open API catalog, an enterprise integration matrix, or
              implementation evidence that would show how smoothly Doctolib fits into heterogeneous clinic environments.
              The roadmap therefore looks commercially ambitious and technically plausible, but still under-documented
              where buyers would care most about deployment friction.
