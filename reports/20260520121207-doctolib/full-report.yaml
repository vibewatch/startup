      - number: '7.3'
        title: Platform, cloud, partner, and international expansion dependencies
        blocks:
          - type: paragraph
            body: >-
              Doctolib’s platform is powerful partly because it sits on top of multiple external dependencies whose
              failure modes are correlated with regulation and trust. The most visible technical chain runs from AWS,
              ATOS, and Cloudflare for hosted security controls into Azure OpenAI and Mistral for clinical AI
              functionality, while product distribution in telehealth depends on Ameli and KBV rule sets rather than on
              product UX alone. None of those dependencies is unusual for a modern health-software platform, but they do
              mean that a contractual dispute, compliance change, regional outage, or model-policy shift outside
              Doctolib can propagate quickly into patient-facing workflows and enterprise credibility.


              The new UK move compounds that dependency picture. Medicus gives Doctolib a legitimate shortcut into a
              market long controlled by Optum and TPP, with NHS validation that would have taken years to replicate
              organically. That is strategically attractive because the company is committing more than £100 million,
              150 hires, and a London R&D centre rather than testing the UK with a low-cost pilot. It is also risky
              because the same move adds another regulated operating environment, another integration surface, and
              another installed-base migration problem at a moment when Doctolib is already dealing with French
              antitrust appeal risk and ongoing AI rollout. Public evidence shows ambition and partner fit, but not yet
              the live site-count, switching pace, or operational milestones needed to underwrite execution confidence.
