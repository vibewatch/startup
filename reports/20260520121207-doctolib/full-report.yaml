      - number: '3.2'
        title: >-
          Feature breadth still favors Doctolib, but pricing and distribution are split across very different attack
          vectors
        blocks:
          - type: paragraph
            body: >-
              Doctolib’s strongest competitive card is breadth. Current German product pages now position the company as
              a cloud and AI-based practice system rather than a scheduling widget: booking, reminders, patient intake,
              documentation, billing support, messaging, and AI assistants live inside one stack. That is materially
              broader than low-end booking products and harder to displace once a practice uses the same system for
              administration, communication, and care continuity. It also explains why Doctolib can publish premium
              German list prices from €139 per doctor per month for light patient management up to €475 for its
              all-in-one suite.


              Competitors attack from different angles. Jameda uses a freemium directory-to-software funnel, with a €0
              base entry and premium packages at €119 and €199 plus setup fees; the premium tiers add Google profile
              booking, certified video consultations, and Noa Notes AI support. Doctena sits even lower in the stack,
              publishing Basic, Smart, and Premium list prices that begin at €29, €45, and €69 on annual terms and
              emphasizing easy coexistence with existing software. That makes Doctena less dangerous as a full
              replacement than as a price anchor that compresses the standalone-booking layer.


              Maiia and CGM are different again. Maiia’s public materials emphasize agenda, teleconsultation, secure
              messaging, Claude Bernard prescribing integration, and interoperability with Cegedim software already used
              by 100,000 professionals. CGM’s 2025 annual-report release shows a €1.213 billion revenue base and a
              cloud/platform/AI roadmap across ambulatory, hospital, and pharmacy workflows. In other words, Doctolib’s
              biggest non-marketplace threat is not an SEO clone; it is an incumbent software vendor that can bundle
              digital access into an already-installed workflow.
