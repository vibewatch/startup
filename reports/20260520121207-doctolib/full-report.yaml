      - number: '8.2'
        title: 2022 peak mark versus the 2026 secondary reset
        blocks:
          - type: paragraph
            body: >-
              The cleanest valuation anchor in the public record remains the March 2022 round. TechCrunch and FrenchWeb
              both put that financing at €500 million on a €5.8 billion valuation, and TechCrunch explicitly said the
              round mixed equity and debt. Forbes later described the process for a 2025 secondary as potentially flat
              to the 2022 price, but the executed 2026 transaction cleared materially lower. Independent transaction
              write-ups, including FamilyOfficeHub, Infonet, Healthcare.Digital, and Nordic9, converged on a roughly
              €3.6 billion secondary valuation and around €300 million of shares changing hands.


              That change matters for two reasons. First, it is a real reset in price discovery: the new transaction
              sits about 38% below the 2022 mark. Second, it was a liquidity event rather than fresh primary financing,
              so the company did not refill the balance sheet. Secondary pricing can deserve a discount for illiquidity,
              information asymmetry, and lack of control, but even after allowing for those mechanics, the move still
              says the market no longer pays 2021-2022 healthtech multiples for Doctolib.


              The harder issue is that the public record still does not show what sits ahead of new money in the capital
              structure. The 2022 reporting confirmed equity plus debt but not the debt quantum, covenants, or any
              liquidation-preference hierarchy. That uncertainty means investors can observe a reset price but still not
              know exactly how much protection common-equivalent capital would have below a stressed exit.
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
              - CV015
              - CV044
      - number: '8.3'
        title: 'Comparable set: public, private, and transaction lenses'
        blocks:
          - type: paragraph
            body: >-
              The comparable set from the earlier competition and market chapters is not one clean peer bucket. Teladoc
              is the clearest reminder of how little the market now pays for consumer-heavy virtual care: its current EV
              or sales multiple sits below 1x. Phreesia is a better provider-software and payments-adjacent benchmark,
              but its multiple is still only about 1.2x. Doximity is the highest-quality public analogue because it
              sells clinician productivity and enjoys much stronger margins, and even there the multiple is about 4.3x
              EV or sales. CompuGroup adds a European health-software reference point with over €1.2 billion of revenue,
              €195 million of EBITDA, and a market capitalization near $1.36 billion.


              Those comps do not make Doctolib directly equivalent to any one name. The company deserves some premium to
              Teladoc because its revenue is overwhelmingly subscription-based and less exposed to direct-to-consumer
              churn. It also deserves more credit than many generic HCIT assets because the patient network and practice
              workflow stack create a differentiated operating-system narrative. But the current secondary valuation
              still implies roughly 9x to 10x recurring revenue depending on which revenue base is used, which is above
              Doximity and above Capstone's 6.1x Healthcare IT M&A average.


              Private and M&A references point in the same direction. Docplanner remains the closest private European
              analogue on two-sided healthcare access, and its MyDr acquisition shows continuing software consolidation,
              but the absence of disclosed transaction values limits precision. Sector advisers describe 2025-2026 as a
              selective-scale market in which high-quality profitable assets can still command premiums, while
              unprofitable or opaque names get compressed. That framing fits Doctolib unusually well: quality is real,
              but disclosure is not yet premium-grade.
