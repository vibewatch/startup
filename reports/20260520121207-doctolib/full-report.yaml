        - Segment the market by workflow complexity and willingness to re-platform, not by headline doctor count alone
      - - Care continuity and digital-access relevance
        - Telehealth adjacents can win budget through payers, public systems, or employer contracts
        - Medium
        - Livi targets ICSs/ICBs/insurers and eConsult aligns to NHS digital-access mandates
        - Map channel overlap between private-practice SaaS budgets and payer or public procurement budgets
      - - Network effects and coupled product design
        - Exclusivity, tying, and anti-allotment behavior can turn product coupling into a competition-law vulnerability
        - High
