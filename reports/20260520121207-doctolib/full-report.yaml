  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, payer, and segment map
        blocks:
          - type: paragraph
            body: >-
              Doctolib is not economically a patient-paid marketplace; it is primarily a provider-paid workflow platform
              with a very large free patient surface. Current company pages split the product into two connected layers:
              an operating system for health professionals and a health companion for people. Sifted adds the commercial
              reality that 99% of 2024 ARR came from subscriptions paid by healthcare professionals, which means the
              main buyer is the practitioner or provider organization, the main daily users are both practice teams and
              patients, and the healthcare payer reimburses the clinical act rather than Doctolib’s SaaS fee.


              The active segment map is broader than solo doctors. Germany pages explicitly market separate journeys for
              hospitals and MVZs, multi-site practice networks, and a wide range of specialty practices; French
              directory pages show live booking surfaces for GPs, pediatricians, and nurses; and Doctolib’s 2025 AI
              launch added a dedicated nurse offer. This matters because customer quality depends on which layer is
              growing. A new patient account is usage surface. A new subscriber, practice network, hospital, or
              assistant add-on is monetized customer depth. The chapter therefore treats provider subscriptions as the
              core customer metric, patient usage as a demand and retention layer, and public-payer reimbursement as an
              adoption enabler rather than a Doctolib revenue source.
