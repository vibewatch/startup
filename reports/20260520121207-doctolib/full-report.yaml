  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The right market definition for Doctolib is not simply “European digital health.” Current evidence says
              the company still monetises overwhelmingly through subscriptions paid by healthcare professionals, while
              the product bundle spans patient booking management, teleconsultation, and practitioner workflow tools.
              That means the narrowest credible core market is provider-paid ambulatory workflow software with a
              two-sided patient-access layer attached. Broader telehealth, remote monitoring, and EHR-interoperability
              markets matter, but mostly as adjacent expansion pools rather than direct substitutes for current revenue.


              The sizing consequence is important. Mordor's Europe digital-health estimate of USD 113.94 billion in 2026
              and MarketsandMarkets' global telehealth estimate of USD 94.14 billion in 2024 are real signals of
              adjacent spend, but they are poor one-line proxies for Doctolib's capturable market because Doctolib's
              observed 2024 ARR was only €348 million and still heavily concentrated in provider-paid subscriptions. A
              more useful bottom-up lens starts from the disclosed 400,000 subscribed healthcare professionals and 99%
              subscription mix, which implies roughly €861 of annual subscription ARR per subscribed professional. That
              framing turns the market question from “is digital health big?” into “how much country-level ambulatory
              workflow budget can be converted from phone-plus-secretary or incumbent software into recurring software
              subscriptions?”


              Because public country denominators are incomplete in the retained evidence, the chapter treats top-down
              TAM, installed monetized base, and disclosed country ARR mix as separate lenses rather than pretending to
              derive a precise SAM. This is exactly where contradictory estimates arise: broad analyst TAMs are not
              wrong, but they describe a much wider spend envelope than the one Doctolib currently converts into
              recurring software revenue.
