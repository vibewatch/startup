      - number: '3.4'
        title: The moat is real, but its most aggressive foreclosure mechanics are now attackable
        blocks:
          - type: paragraph
            body: >-
              The French authority’s 2025 case makes the competitive question much sharper. The regulator said Doctolib
              had more than 50% share of the French online-booking market from 2017 through 2022, exceeded 90% in some
              years, and held more than 40% of the teleconsultation-solutions market since 2019. It also said Doctolib
              used exclusivity clauses, tied teleconsultation access to the prior purchase of Doctolib Patient, and had
              previously bought MonDocteur — its principal booking rival — in a way that removed competition, added
              10,000 professionals, and supported later pricing power. O’Melveny and Cleary both frame the decision as a
              first French Towercast-style sanction of a below-threshold killer acquisition in a market with strong
              indirect network effects and high entry barriers.


              That matters because the source of Doctolib’s strength is exactly the coupling regulators are now willing
              to inspect. The company’s best competitive logic is that patient demand, reminders, messaging,
              teleconsultation, and practice workflow work better together than apart. Buyers often value that. But when
              the same design becomes exclusivity, tying, or foreclosure, the moat stops looking purely product-led and
              starts looking legally attackable.


              The investment implication is not that Doctolib lacks a moat. It clearly has one, especially where patient
              demand and provider workflow reinforce each other. The implication is that moat durability now depends
              less on sheer traffic and more on whether Doctolib can win under tighter scrutiny around interoperability,
              AI accountability, cybersecurity, and buyer freedom to multi-home. That is a tougher — but more durable —
              basis for leadership if management can prove it.
