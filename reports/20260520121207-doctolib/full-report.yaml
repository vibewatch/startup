  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: >-
          The peer set is multi-class: one pan-European marketplace rival, several local incumbents, and lighter
          substitutes
        blocks:
          - type: paragraph
            body: >-
              The closest direct peer is not every digital-health company with video visits. It is the Docplanner family
              — including Jameda in Germany and MioDottore in Italy — because that cluster combines patient discovery,
              practitioner reputation, online booking, and software monetization in a way that most closely resembles
              Doctolib’s two-sided logic. Docplanner’s current about page says it leads in 13 countries, handles 25
              million appointments per month, attracts 100 million patient visits per month, and serves 300,000 active
              doctors. Jameda adds German density with 411,000 listed clinicians, more than 1 million bookable
              appointments, 100,000 video consults, and 3.1 million reviews. MioDottore matters because it shows Italy
              is contested through localized brands, not only through one pan-European label.


              The next threat class is more country-specific. Maiia and Cegedim attack France through installed
              software, agenda workflows, secure teleconsultation, and existing provider relationships; CGM and CLICKDOC
              do the same from a larger international health-IT base. Those incumbents do not need to outrank Doctolib
              in consumer search to stay dangerous. They can win if a practice already buys cabinet or clinic software
              from them and sees online booking or teleconsultation as an add-on rather than a new platform decision.


              At the edge of the market, Doctena and similar lighter tools matter because they make the buyer’s outside
              option cheaper and easier. They do not yet replicate Doctolib’s total workflow depth, but they can keep
              lower-complexity practices from ever moving into a higher-ARPU suite.
