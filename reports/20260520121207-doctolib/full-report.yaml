  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue quality and pricing model
        blocks:
          - type: paragraph
            body: >-
              Doctolib's public financial story is unusually clear for a large private European healthtech business on
              top-line quality and unusually thin on everything below it. The clearest disclosed fact is that 2024 ARR
              reached €348 million and that 99% of that ARR came from subscriptions paid by healthcare professionals,
              not from patients or appointment commissions. That matters because it makes Doctolib economically closer
              to a workflow SaaS platform than to a classic marketplace with take-rate exposure. The patient side
              remains free and therefore functions as demand generation, retention support, and practitioner acquisition
              rather than as a billed revenue line. Public pricing reinforces that model: German packages step from a
              free entry tier to €139, €229, €299, and €475 per doctor per month on annual contracts, with additional
              onboarding, migration, and AI-assistant fees. Just as important, the pricing page openly says custom
              bundles, monthly contracts, and volume discounts are available on request, so list price cannot be read as
              realized ARPU. The most attractive lens, therefore, is not headline list price but how effectively
              Doctolib converts free patient demand and broad workflow coverage into higher-tier provider subscriptions
              and add-on adoption.
