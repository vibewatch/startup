      - number: '5.4'
        title: Trust, compliance, and reliability controls
        blocks:
          - type: paragraph
            body: >-
              Doctolib’s public trust posture is stronger than the average private healthtech product narrative, but it
              still mixes meaningful controls with incomplete transparency. The strongest published controls are
              concrete: privacy materials state GDPR compliance, dedicated security and data-protection teams, encrypted
              backup snapshots retained for no more than seven days, EU hosting for health data on AWS under HDS
              standards, end-to-end encryption for health data, authorized-clinician access controls, ISO 27001 in
              France and Germany, HDS in France, and annual BSI audits. The privacy-and-security and compliance pages
              also frame privacy by default, transparent consent, European hosting, and independent audits as core
              design choices rather than afterthoughts. Reliability evidence is thinner but non-zero: the public status
              page reveals modular service monitoring and recent incident handling processes. The caveat is that the
              public set still lacks quantitative SLOs, assistant-quality benchmarks, and detailed integration-security
              architecture. Trust is therefore supported on policy, certification, and surface-level ops visibility, but
              not yet on the kind of public performance evidence that would make AI-assisted clinical workflows fully
              low-friction for a skeptical enterprise buyer.
