      - number: '4.3'
        title: Cost structure, public traction, and missing operating data
        blocks:
          - type: paragraph
            body: >-
              Public traction is strong enough to prove product-market fit but still not sufficient to prove margin
              quality. Sifted's 2024 disclosure gives the central datapoints: €348 million ARR, 22.5% growth, 80 million
              patient accounts, 400,000 healthcare-professional subscribers, and a geography split of 80% France, 17%
              Germany, and less than 3% Italy. That creates a business with real scale and a monetization core still
              overwhelmingly concentrated in France. The same article also disclosed €115 million of research and
              development spend in 2024, roughly one third of revenue, which explains why profitability lagged top-line
              growth despite improving losses. The public problem is that Doctolib still does not disclose gross margin,
              contribution margin, CAC, NRR, or churn. In other words, outsiders can see growth, losses, and product
              breadth but cannot see how much of each euro of ARR is structurally durable after support, hosting,
              onboarding, payment, or teleconsultation delivery costs. Public peers highlight the gap: CompuGroup
              Medical reports revenue, EBITDA, and headcount; Teladoc reports cash, debt, and net loss; YCharts and
              public filings expose benchmark margins. Doctolib does not need to be public to publish more than it does
              today, but today's disclosure still leaves core underwriting variables private.
