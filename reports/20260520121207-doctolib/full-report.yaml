  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis, anti-thesis, and recommendation
        blocks:
          - type: paragraph
            body: >-
              The positive side of the Doctolib case is still strong and consistent with the earlier financial, product,
              and customer chapters. The company now has credible public proof of a real recurring-revenue engine:
              Sifted reported €348 million of 2024 ARR, 99% of that ARR came from provider subscriptions, and losses
              narrowed sharply. That matters because it means Doctolib is not a fragile consumer telehealth story; it is
              a provider workflow platform with patient reach wrapped around it. The Medicus deal also shows management
              is still trying to extend that workflow model into adjacent regulated infrastructure rather than only
              defending the French booking core.


              The anti-thesis is equally concrete. Chapter 7 already established that the French antitrust ruling is not
              cosmetic, and valuation has to price that in because the same bundle logic that drove premium monetization
              is now under appeal. Public disclosure is also still too thin for a conviction price call: gross margin,
              NRR, CAC, debt terms, and liquidation preferences are not public. That leaves investors able to admire
              scale and product depth while still guessing about downside recovery values.


              Netting those two sides together, the most supportable call is research-more with medium confidence, high
              risk, and a stretched current valuation stance. The company quality is better than the price support. At
              today's known secondary level, investors are still paying a premium to public workflow and HCIT
              comparables without getting public-company disclosure in return.
