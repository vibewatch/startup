      - number: '8.5'
        title: Exit readiness, thesis-break triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Doctolib is closer to exit-ready than a typical opaque private healthtech company because it now has
              scale, a recurring subscription core, better UK optionality, and multiple credible public comparables.
              That is the good news. The missing pieces are what stop the recommendation from moving above
              research-more. Unlike public peers, Doctolib has not given the market audited multi-year financial
              statements, detailed governance disclosure, or enough cap-table clarity to underwrite preference overhang.
              That makes any IPO-readiness conclusion only partial.


              The thesis-break triggers are also easy to state. A materially adverse appeal or remedy in France would
              force a lower multiple because it hits the exact economic engine that historically justified the premium.
              Repeated evidence that UK scaling is slower than the >£100 million plan implies would also lower
              optionality value. Finally, if audited data were to show weak margins, heavy debt, or poor country-level
              retention, the current premium over public HCIT comps would be very hard to defend.


              That is why the final diligence list is narrow and practical rather than exhaustive. Management should
              provide 2025 audited revenue, EBITDA, cash, and debt; the 2022 debt and preference documents;
              country-level ARR retention and margin bridges; and scenario analyses for French remedies. If those
              materials hold up, the call can move. If they do not, the 2026 reset may prove to be only the first leg of
              a fuller repricing.
            claimRefs:
              - CV034
              - CV035
              - CV045
              - CV046
              - CV053
