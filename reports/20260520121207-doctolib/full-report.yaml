      - number: '2.2'
        title: France, Germany, and Italy have different buyer-user-payer mechanics
        blocks:
          - type: paragraph
            body: >-
              France is the clearest current monetization engine. Patients use teleconsultation and booking services,
              but public reimbursement rules and Sifted's ARR disclosure both point to providers as the present economic
              buyer of the software layer. Ameli says teleconsultation is reimbursed like an in-office act when it sits
              inside the coordinated-care pathway, which means the payer reimburses the clinical encounter while the
              practitioner or practice still buys workflow software. That distinction matters because it means
              teleconsult growth expands utilisation and retention, but not necessarily payer-funded SaaS revenue.


              Germany looks structurally different. BMG and gematik show that ePA, e-prescription, DiGA, and
              telemedicine now sit inside an explicit national digitalisation agenda, and provider facilities have had
              to integrate ePA into daily work since October 2025. That creates a stronger interoperability and
              compliance pull than in France, but Sifted also reports that German doctors usually operate in larger
              practices with assistants and higher baseline workflow maturity. In other words, Germany offers a larger
              systems-integration case but a harder sales motion for a French-style administrative-efficiency pitch.


              Italy is earlier-stage and more ambiguous. The retained public evidence clearly shows FSE 2.0
              interoperability work continuing into 2026, but Doctolib itself still describes Italy as a market where
              doctors must be evangelised and consumer digital usage is weaker. That suggests the Italian market is not
              just “France a few years behind”; it is a market where private workflow software has to coexist with
              public-system infrastructure and different patient behaviour from the start.
