  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: appeal-remedies
    missingEvidence: Appeal timetable, requested remedies, and any negotiated behavioral commitments or technical unbundling scenarios.
    whyItMatters: The range of outcomes runs from a manageable fine to product, pricing, or interoperability constraints that would directly affect moat durability in France.
    diligencePath: Request outside-counsel appeal memo, regulator correspondence, and management's internal remediation plan for bundling and exclusivity findings.
    relatedQuestionRefs:
    - QR005
    relatedTableRefs:
    - TR001
    - TR005
  - type: private-evidence-only
    severity: material
    topic: uk-rollout-evidence
    missingEvidence: Current Medicus live-site count, pipeline by ICB and GP practice, switching win rate versus Optum/TPP, and first-year rollout milestones.
    whyItMatters: Investment size and strategic ambition are public, but actual UK traction is still too opaque to distinguish a beachhead from a press-release-sized option.
    diligencePath: Request UK weekly operating dashboard, signed contracts, implementation backlog, and post-close integration plan with named owners and milestone dates.
    relatedQuestionRefs:
    - QR015
    - QR027
    relatedTableRefs:
    - TR003
    - TR004
    - TR005
  - type: private-evidence-only
    severity: material
    topic: cloud-resilience
    missingEvidence: Multi-region failover design, disaster-recovery RTO/RPO, critical vendor concentration by workload, incident postmortem policy, and continuity tests.
    whyItMatters: Doctolib handles sensitive health workflows, so a major outage or vendor lock issue can transmit quickly into trust, regulatory reporting, and revenue disruption.
    diligencePath: Request architecture diagrams, DR playbooks, the last three sev-1 postmortems, and contractual contingency provisions with AWS, Microsoft, and key security vendors.
    relatedQuestionRefs:
    - QR023
    - QR028
    relatedTableRefs:
    - TR002
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: ai-safety-outcomes
    missingEvidence: Specialty-level error rates, override rates, silent-failure review process, and incident escalation thresholds for the consultation and phone assistants.
    whyItMatters: Human review is necessary but not sufficient if the system quietly creates low-salience documentation errors or misroutes urgent calls at scale.
    diligencePath: Request AI quality dashboards, clinical governance committee minutes, adverse-event review logs, and per-specialty acceptance-rate cohorts.
    relatedQuestionRefs:
    - QR012
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: material
    topic: post-remedy-retention
    missingEvidence: Country-level churn, net revenue retention, teleconsultation attach, and multi-homing behavior after antitrust pressure on bundling and exclusivity.
    whyItMatters: If retention has relied partly on coupling or limited alternatives, then unbundling pressure could weaken expansion economics before France concentration has diversified.
    diligencePath: Request cohort retention by country and module, contract terms on unbundling, and win-loss analysis for teleconsultation versus standalone rivals.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR001
    - TR005
