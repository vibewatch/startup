- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - French antitrust overhang
    - Appeal or remedy update
    - Appeal lost or remedy compels meaningful unbundling / interoperability changes in France
    - Re-cut France attach, pricing, and retention assumptions; downgrade moat durability
  - - Privacy or security breakdown
    - Official incident / DPA disclosure
    - Material health-data incident or repeated sev-1 events without convincing public postmortems
    - Pause underwriting until root cause, customer impact, and remediation are verified
  - - AI clinical-safety miss
    - Quality or incident evidence
    - Publicly confirmed harmful documentation error, misrouting event, or rising override rate without governance response
    - Treat AI upsell as liability until quality controls are independently evidenced
  - - UK expansion execution miss
    - Rollout and hiring milestones
    - No credible live-site or switching proof after material spending and 12-18 months of integration effort
    - Cut UK option value and treat spend as margin drag rather than growth vector
  - - France concentration remains high
    - ARR mix disclosure
    - France still around current concentration while non-French growth stalls
    - Lower terminal multiple and require evidence that Germany/UK can absorb strategic risk
  - - Trust deterioration in reviews / support
    - Review and outage pattern
    - Persistent no-show, cancellation, or availability complaints alongside slow support resolution
    - Assume brand friction is becoming economically material and revisit customer-acquisition efficiency
  notes: These are monitorable thesis-break signals rather than routine operating KPIs; each would change underwriting faster than slow-moving annual metrics.
