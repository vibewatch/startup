  - - MonDocteur below-threshold merger precedent
    - France / EU
    - Closed transaction now judged ex post under Article 102
    - Medium
    - High
    - Legal novelty limited the historical fine to €50k
    - Future acquisitions of adjacent rivals can draw ex post scrutiny years after closing
    - Review deal-screening policy and board antitrust review process
  - - French teleconsultation reimbursement and coordinated-care rules
    - France
    - Reimbursable only under secure, coordinated-care framework
    - Medium
    - Medium-High
    - Platform already operates secure channels and documented workflow integration
    - Policy or reimbursement changes can narrow telehealth monetization and push usage back toward in-person workflows
    - Request country-level teleconsultation revenue and sensitivity to rule changes
  - - KBV certified-provider and video-treatment limits
    - Germany
    - Certified provider required; 50% pure-video cap and quality rules live
    - Medium
    - Medium-High
    - Doctolib can operate within certified rails and current rules
    - German video economics remain capped by payer rules and certification obligations rather than product demand alone
    - Request Germany teleconsultation attach and compliance audit history
  - - UK NHS governance and clinical-software market-entry obligations
    - United Kingdom
    - Medicus foothold secured but rollout only beginning
    - Medium
    - High
    - Keeping Medicus leadership and local product should reduce policy mismatch
    - NHS deployment or safety-governance issues could delay the payback of >£100m investment
    - Request Medicus validation artifacts, rollout milestones, and safety-case ownership
  notes: Severity order reflects residual downside to thesis, not just probability of occurrence. Public sources capture the visible rule set but not non-public regulator correspondence.
