- id: mitigations-monitoring-and-kill-criteria
  title: Mitigations, monitorable indicators, and kill criteria
  body: |-
    Public mitigations are real and should not be ignored. Doctolib has visible security certifications, a documented subscription model that does not sell patient data, an in-house SOC with better signal quality than before, certified telehealth rails in Germany, and human review before AI output enters the record. UK expansion is also being staged through Medicus rather than through a cold start, and management has kept the local team and founder in place. Those choices reduce some downside paths.

    However, the mitigations are not yet strong enough to change the ranking of the top risks. The best monitorable signals are appeal and remedy developments in France, repeated product incidents on the public status page, fresh DPA criticism or enforcement, evidence that AI outputs create clinically material corrections, slippage in UK implementation milestones, and any failure of Germany or the UK to reduce France dependence over the next planning cycle. The clearest thesis-break event would be a combination of an adverse appeal outcome plus evidence that teleconsultation or workflow attach weakens once tying pressure is removed. Short of that, repeated trust incidents or a visibly stalled UK rollout would also force a reset in how much premium an investor should pay for the platform story. The right diligence posture is therefore not “wait for perfect clarity,” but “treat Doctolib as high-quality infrastructure whose next leg of value creation must now survive legal, safety, and interoperability scrutiny.”
