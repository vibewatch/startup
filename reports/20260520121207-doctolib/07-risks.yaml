chapter:
  number: 7
  title: Risks
  summary: Doctolib’s risk profile is now anchored by a live French antitrust overhang that attacks the same bundle logic supporting growth in its dominant home market. Secondary but still material risks cluster around sensitive-data privacy, AI clinical-safety evidence gaps, cloud and model-partner dependencies, UK Medicus integration, and a financial model still highly concentrated in France even as management scales across 30-plus cities and multiple regulatory regimes.
sections:
- id: antitrust-and-telehealth-regulatory-overhang
  title: Competition, antitrust, and telehealth regulatory overhang
  body: |-
    Doctolib’s highest-severity risk is no longer hypothetical competition law exposure but a live French case that directly attacks the company’s core workflow design. The Autorité de la concurrence fined Doctolib €4.665 million in November 2025, said booking-market share had been above 50% since 2017 and above 90% in some years, and found exclusivity clauses plus a requirement to buy Doctolib Patient before using Téléconsultation. Legal commentary from Cleary, O’Melveny, and A&O Shearman frames the MonDocteur finding as the first French Article 102 sanction of a below-threshold “killer acquisition,” which matters because it widens the range of future deal risk and signals that Doctolib’s most effective lock-in mechanics are now under explicit scrutiny.

    The appeal reduces final-outcome certainty but does not reduce present risk. Doctolib argues the decision misunderstands its business and that disconnecting teleconsultation from the rest of the product would damage patient follow-up, prescription sharing, and billing. That defense is commercially intuitive, but from an investor perspective it confirms the same point: the company’s growth logic still depends on product coupling. At the same time, teleconsultation economics are governed by outside rules rather than product design alone. French reimbursement still depends on coordinated-care and secure digital channels, while Germany’s KBV requires certified video providers, forbids recordings, and retains a 50% pure-video ceiling with temporary authentication workarounds through end-2026. The result is a regulatory stack where legal remedies, reimbursement conventions, and certified-provider rules can all cap monetization or slow rollout even if product demand remains strong.
