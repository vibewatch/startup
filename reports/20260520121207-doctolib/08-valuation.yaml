    "number": 8,
    "title": "Valuation",
    "summary": "Doctolib's 2022 €5.8 billion mark is still well supported, but accessible 2026 secondary reporting points to a reset near €3.6 billion rather than a flat carry. That reset lowers the multiple but does not automatically make the company cheap: on current public revenue evidence, Doctolib still sits above public workflow and HCIT comparables while carrying opaque margins, unknown preference overhang, and a live French competition case. The chapter therefore lands on research-more, medium confidence, high risk, and a stretched current valuation stance, with a more attractive entry band around €2.5-€3.0 billion unless diligence materially improves the disclosure set."
  },
  "sections": [
    {
      "id": "thesis-anti-thesis-and-recommendation",
      "title": "Thesis, anti-thesis, and recommendation",
      "body": "The positive side of the Doctolib case is still strong and consistent with the earlier financial, product, and customer chapters. The company now has credible public proof of a real recurring-revenue engine: Sifted reported €348 million of 2024 ARR, 99% of that ARR came from provider subscriptions, and losses narrowed sharply. That matters because it means Doctolib is not a fragile consumer telehealth story; it is a provider workflow platform with patient reach wrapped around it. The Medicus deal also shows management is still trying to extend that workflow model into adjacent regulated infrastructure rather than only defending the French booking core.\n\nThe anti-thesis is equally concrete. Chapter 7 already established that the French antitrust ruling is not cosmetic, and valuation has to price that in because the same bundle logic that drove premium monetization is now under appeal. Public disclosure is also still too thin for a conviction price call: gross margin, NRR, CAC, debt terms, and liquidation preferences are not public. That leaves investors able to admire scale and product depth while still guessing about downside recovery values.\n\nNetting those two sides together, the most supportable call is research-more with medium confidence, high risk, and a stretched current valuation stance. The company quality is better than the price support. At today's known secondary level, investors are still paying a premium to public workflow and HCIT comparables without getting public-company disclosure in return.",
