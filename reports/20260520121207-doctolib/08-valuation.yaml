    {
      "id": "valuation-history-and-secondary-reset",
      "title": "2022 peak mark versus the 2026 secondary reset",
      "body": "The cleanest valuation anchor in the public record remains the March 2022 round. TechCrunch and FrenchWeb both put that financing at €500 million on a €5.8 billion valuation, and TechCrunch explicitly said the round mixed equity and debt. Forbes later described the process for a 2025 secondary as potentially flat to the 2022 price, but the executed 2026 transaction cleared materially lower. Independent transaction write-ups, including FamilyOfficeHub, Infonet, Healthcare.Digital, and Nordic9, converged on a roughly €3.6 billion secondary valuation and around €300 million of shares changing hands.\n\nThat change matters for two reasons. First, it is a real reset in price discovery: the new transaction sits about 38% below the 2022 mark. Second, it was a liquidity event rather than fresh primary financing, so the company did not refill the balance sheet. Secondary pricing can deserve a discount for illiquidity, information asymmetry, and lack of control, but even after allowing for those mechanics, the move still says the market no longer pays 2021-2022 healthtech multiples for Doctolib.\n\nThe harder issue is that the public record still does not show what sits ahead of new money in the capital structure. The 2022 reporting confirmed equity plus debt but not the debt quantum, covenants, or any liquidation-preference hierarchy. That uncertainty means investors can observe a reset price but still not know exactly how much protection common-equivalent capital would have below a stressed exit.",
