    {
      "id": "comparable-set-and-multiple-context",
      "title": "Comparable set: public, private, and transaction lenses",
      "body": "The comparable set from the earlier competition and market chapters is not one clean peer bucket. Teladoc is the clearest reminder of how little the market now pays for consumer-heavy virtual care: its current EV or sales multiple sits below 1x. Phreesia is a better provider-software and payments-adjacent benchmark, but its multiple is still only about 1.2x. Doximity is the highest-quality public analogue because it sells clinician productivity and enjoys much stronger margins, and even there the multiple is about 4.3x EV or sales. CompuGroup adds a European health-software reference point with over €1.2 billion of revenue, €195 million of EBITDA, and a market capitalization near $1.36 billion.\n\nThose comps do not make Doctolib directly equivalent to any one name. The company deserves some premium to Teladoc because its revenue is overwhelmingly subscription-based and less exposed to direct-to-consumer churn. It also deserves more credit than many generic HCIT assets because the patient network and practice workflow stack create a differentiated operating-system narrative. But the current secondary valuation still implies roughly 9x to 10x recurring revenue depending on which revenue base is used, which is above Doximity and above Capstone's 6.1x Healthcare IT M&A average.\n\nPrivate and M&A references point in the same direction. Docplanner remains the closest private European analogue on two-sided healthcare access, and its MyDr acquisition shows continuing software consolidation, but the absence of disclosed transaction values limits precision. Sector advisers describe 2025-2026 as a selective-scale market in which high-quality profitable assets can still command premiums, while unprofitable or opaque names get compressed. That framing fits Doctolib unusually well: quality is real, but disclosure is not yet premium-grade.",
