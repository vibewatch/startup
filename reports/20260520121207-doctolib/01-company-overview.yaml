    severity: material
    topic: governance
    missingEvidence: A full live board roster, committee structure, investor-rights summary, and current cap-table ownership percentages.
    whyItMatters: Public materials identify Stanislas Niox-Chateau and Vittorio Colao, but not the full control map needed to evaluate governance, veto rights, and decision-making power.
