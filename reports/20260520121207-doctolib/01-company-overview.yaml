- id: founders-leadership-governance
  title: Founders, leadership, and governance visibility
  body: |-
    Current official pages still center Stanislas Niox-Chateau as the company's public face. The mission-committee page identifies him as CEO and co-founder and links his role directly to Doctolib's 2013 origin. Public founder coverage outside the official site remains important because current company pages do not publish a full founding-team roster. Independent profiles continue to identify Ivan Schneider and Jessy Bernal as technical co-founders alongside Stanislas, which supports the view that Doctolib was built by a mixed business-and-product founding team rather than by a single commercial founder.

    Governance evidence is meaningful but incomplete. The clearest board-level datapoint is the 2023 appointment of Vittorio Colao, whose official announcement says the former Italian minister joined the Board of Directors to support Doctolib's European growth. That adds a recognizable policy and telecom operator profile around the founder-CEO. Public materials also show senior operating depth below Stanislas: Sifted quotes CFO Pierre Vergnes on the 2024 results, and the German leadership announcement shows Dr. med. Ilias Tsimpoulis moving from Managing Director Germany to group Chief Medical Officer as Germany became strategically more important.

    The governance gap is that none of the retained public sources provide a complete live board roster, committee structure, or investor-rights map. For diligence, the leadership picture is directionally strong, but formal control still needs direct management materials.
