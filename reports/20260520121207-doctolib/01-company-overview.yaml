- id: milestones-security-and-adverse-posture
  title: Milestones, security posture, and adverse competitive issues
  body: |-
    The milestone record shows a company moving from scheduling into a broader healthcare operating stack. Beyond the financing rounds, Doctolib announced the Tanker acquisition in 2022 to strengthen online medical confidentiality, joined forces with Siilo in 2023 to improve care-team collaboration, renewed or expanded privacy certifications across Italy, France, and Germany in 2024, and publicized German C5 security attestation as evidence of higher trust standards. In May 2026, Doctolib and Medicus announced a plan to build a next-generation GP platform in the UK, showing that management still uses acquisitions and partnerships to open new market vectors.

    That expansion story now sits alongside a much clearer adverse file. In November 2025 the French Competition Authority fined Doctolib €4.665 million for abusing a dominant position in online appointment booking and teleconsultation. The authority said the conduct included exclusivity clauses, tying, and the 2018 MonDocteur acquisition as a way to foreclose competition. Independent summaries from PPC Land and O'Melveny reinforced that this case matters beyond one fine because it is being read as a major French example of platform dominance and a below-threshold killer-acquisition theory.

    Doctolib has publicly said it will appeal. That makes the issue unresolved rather than terminal, but it also means any investment view has to treat regulatory and competition risk as a live chapter-one fact rather than a footnote.
