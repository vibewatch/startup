      - CV051
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: Doctolib 重定价后的倍数低于 2022 年峰值，但相较公开市场和交易背景仍偏高。
    data:
      items:
        - label: 2022 年 Doctolib 峰值（按 2024 ARR 口径）
          value: 16.7
        - label: 2026 年老股交易（按 2024 ARR）
