        - ~€3.6B 估值偏高
        - 2026 年重置后仍隐含约 9x-10x 经常性收入，高于公开工作流和 HCIT 参照。
      - - 入场纪律
        - 优先 ≤€3.0B
        - 更低价格才能更好补偿利润率、资本结构和补救措施敏感性的不透明。
      - - 决策含义
