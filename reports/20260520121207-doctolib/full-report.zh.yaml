      - number: '2.3'
        title: 增长驱动真实存在，但监管和工作流摩擦拖慢转化
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动不是泛泛的数字化话术，而是具体的就医触达和工作流压力。法国 2024 年远程会诊 13.9 million 次，在疫情后回落之后仍同比增长近
              20%，说明远程护理没有消失，而是常态化成了一个持续的护理交付渠道。IQVIA 从更宽视角强化了同一点：数字医疗正在从消费者健康应用，转向面向医疗服务方的诊断、决策支持、远程监测和 AI 辅助平台。这对
              Doctolib 很重要，因为公司的产品方向越来越偏向医疗服务方生产力和护理协同，而不只是预约搜索。


              监管同时是驱动，也是成本。HDS 和 CNIL 让法国的健康数据处理成为高信任领域；EHDS 推动欧洲互操作和单一市场；德国 ePA 推出使接入国家轨道变得不可避免；意大利 FSE 2.0
              工作则抬高架构预期。这些变化能扩大合规既有厂商的市场，但也抬高切换成本、法律支出和技术集成负担。


              采用摩擦因此仍顽固存在。MarketsandMarkets 将 B2B 集成成本、有限 IT 能力和行为抵触列为结构性约束；Sifted
              又补充了国家层面的摩擦：德国需要本地化到更大诊所工作流，意大利仍需要医生教育和消费者习惯培养。实际含义是，市场在增长，但转化速度因国家而异，且运营成本高。
