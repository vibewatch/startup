      - number: '6.5'
        title: 负面信号和尽调判断
        blocks:
          - type: paragraph
            body: >-
              客户质量上的主要负面信号是，部分可观察到的耐久性可能来自锁定效应，而不只是客户满意。法国竞争管理局称，Doctolib 施加排他条款，把使用 Téléconsultation
              绑定在先前购买预约订阅之上，并借助收购 MonDocteur
              排挤竞争。法律分析进一步指出，内部文件把这笔交易与减轻定价压力、提高价格和巩固份额联系起来。这对客户分析很重要，因为由合同依赖或缺少替代方案带来的强留存，与用户热爱产品带来的留存，在战略含义上不同。


              用户体验投诉也是真实存在的，即使还不足以压过产品显然有用这一点。Trustpilot 包括误标爽约、预约丢失、视频预约取消等案例；ComplaintsBoard 更严厉，尽管样本少且偏向投诉；Heise
              称德国隐私批评仍是一个活跃的信任问题。净判断是：客户广度和生产环境采用偏正面，满意度离散度需要谨慎，续约耐久性和集中度仍不完整。管理层应被要求提供按国家和专科拆分的订阅者队列、前 10
              大客户敞口、仍在服务的医院或集团诊所推荐案例，以及一份对 40 万、52 万和其他公开指标分母逐项校准的 KPI 材料。
