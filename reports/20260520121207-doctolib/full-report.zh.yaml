  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与受证据约束的规模测算
        blocks:
          - type: paragraph
            body: >-
              Doctolib
              的正确市场定义不是简单的“欧洲数字医疗”。当前证据显示，公司商业化仍主要靠医疗专业人士付费订阅，而产品包覆盖患者预约管理、远程会诊和医生工作流工具。这意味着，最窄且可信的核心市场，是带有双边患者触达层、由医疗服务方付费的门诊工作流软件。更宽的远程医疗、远程监测和
              EHR 互操作市场也重要，但主要是相邻扩张池，而不是当前收入的直接替代品。


              规模测算由此出现一个重要后果。Mordor 对欧洲数字医疗 2026 年 USD 113.94 billion 的估计，以及 MarketsandMarkets 对全球远程医疗 2024 年 USD 94.14
              billion 的估计，确实提示相邻支出规模；但它们很难作为 Doctolib 可捕获市场的一行代理，因为 Doctolib 2024 年可观察 ARR 只有 €348
              million，且仍高度集中在医疗服务方订阅。更有用的自下而上口径，应从披露的 400,000 名已订阅医疗专业人士和 99% 订阅结构出发，隐含每名订阅专业人士每年约 €861 的订阅
              ARR。这样的框架把市场问题从“数字医疗是否很大？”改写为“各国门诊工作流预算中，有多少能从电话加秘书或既有软件转成经常性软件订阅？”


              由于保留证据中的各国分母不完整，本章把自上而下 TAM、已安装且已变现基础，以及披露的国家 ARR 结构作为三个独立口径，而不是假装推导出精确 SAM。矛盾估计正是在这里产生：宽口径分析师 TAM
              并非错误，但它描述的支出外延远宽于 Doctolib 当前能转化为经常性软件收入的那一块。
