    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 当前价格更接近公允价值争议区，而不是明显便宜的区间。
    data:
      items:
        - label: 悲观估值区间
          low: 2100
          high: 2700
          mid: 2400
        - label: 理想入场区间
          low: 2500
          high: 3000
          mid: 2750
        - label: 基准估值区间
          low: 2900
          high: 3500
          mid: 3200
        - label: 2026 年老股交易标记
          low: 3600
          high: 3600
          mid: 3600
        - label: 乐观估值区间
          low: 4000
          high: 5000
          mid: 4500
    approximationNotes: 所有数值均为百万欧元，代表基于公开经常性收入证据、公开可比公司和行业 M&A 参考点的情景区间。
    claimRefs:
      - CV008
      - CV039
      - CV048
      - CV049
      - CV050
      - CV052
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 公司在证明和战略深度上得分较高，但估值支撑和披露质量偏弱。
    data:
      items:
        - label: 收入证明
          note: 强：€348M ARR 和 99% 订阅收入占比，让业务具备真正的软件可信度。
        - label: 产品深度
          note: 强：工作流广度和患者网络规模，仍支撑医疗操作系统叙事。
        - label: 可比公司支撑
          note: 参差：Doximity 有支撑，但 Teladoc、Phreesia 和行业 M&A 区间把公允价值往下拉。
        - label: 披露质量
          note: 弱：毛利率、NRR、CAC、债务期限表或优先股堆叠均无公开披露。
        - label: 监管风险
          note: 弱：法国反垄断上诉如今直接触及支撑溢价变现的捆绑经济性。
        - label: 入场估值
          note: 当前估值下偏弱：约 €3.6B 较 2022 年下调，但对照公开 HCIT 参考标的，还谈不上明显便宜。
    approximationNotes: KPI 标签是定性、面向投资的判断，不是管理层 KPI；目的在于凸显价格支撑哪里最强、哪里最弱。
    claimRefs:
      - CV004
      - CV005
      - CV008
      - CV041
      - CV045
      - CV046
      - CV051
      - CV052
