      - number: '3.2'
        title: 功能广度仍偏向 Doctolib，但定价和分发被不同攻击向量切开
        blocks:
          - type: paragraph
            body: >-
              Doctolib 最强的竞争牌是广度。当前德国产品页已把公司定位成云端和 AI 驱动的诊所系统，而不是排班小组件：预约、提醒、患者接待、文档、账单支持、消息和 AI
              助手都在一个栈里。一旦诊所把同一系统用于行政、沟通和护理连续性，这套组合就明显宽于低端预约产品，也更难替换。这也解释了为什么 Doctolib 能在德国公开更高的标价：轻量患者管理从每名医生每月 €139
              起，一路到一体化套件 €475。


              竞争者从不同角度进攻。Jameda 采用从免费目录到软件的免费增值漏斗，基础入口 €0，高级包为 €119 和 €199，另收设置费；高级层加入 Google 资料预约、认证视频咨询和 Noa Notes AI
              支持。Doctena 位于栈内更低位置，公开 Basic、Smart 和 Premium 年付标价，起步分别为 €29、€45 和 €69，并强调能与现有软件轻松共存。因此，Doctena
              作为全量替代者的危险较小，作为压缩独立预约层价格的锚点更危险。


              Maiia 和 CGM 又不同。Maiia 的公开材料强调日程、远程会诊、安全消息、Claude Bernard 处方集成，以及与 Cegedim 软件的互操作性；后者已被 100,000 名专业人士使用。CGM
              2025 年年报发布稿显示，公司收入基数为 €1.213 billion，并在门诊、医院和药房工作流上推进云 / 平台 / AI 路线图。换句话说，Doctolib
              最大的非市场型威胁不是搜索流量克隆产品，而是能把数字触达捆进既有工作流的既有软件供应商。
