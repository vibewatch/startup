      - number: '1.2'
        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              当前官方页面仍把 Stanislas Niox-Chateau 放在公司公共叙事中心。使命委员会页面称他为 CEO 兼联合创始人，并把他的角色直接连到 Doctolib 2013
              年的起点。官方站点没有公布完整创始团队名单，因此站外公开创始人报道仍重要。独立人物资料继续将 Ivan Schneider 和 Jessy Bernal 认定为 Stanislas
              之外的技术联合创始人，支持一个判断：Doctolib 不是由单一商业创始人搭起来，而是由商业和产品混合型创始团队共同打造。


              治理证据有意义但不完整。最清楚的董事会层面数据点是 Vittorio Colao 于 2023 年加入；官方公告称，这位意大利前部长进入董事会，是为了支持 Doctolib 的欧洲增长。这给创始人 CEO
              周围补上了一个政策和电信运营商背景鲜明的角色。公开材料也显示，Stanislas 之下有一定运营管理深度：Sifted 在 2024 年业绩报道中引用了 CFO Pierre
              Vergnes；德国领导层公告显示，随着德国战略重要性上升，Dr. med. Ilias Tsimpoulis 从德国董事总经理转任集团首席医疗官。


              治理缺口在于，保留的公开来源都没有给出完整的现任董事会名单、委员会结构或投资者权利图。尽调上，领导层画像方向上较强，但正式控制权仍需要管理层直接材料。
