chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与欧洲足迹
        blocks:
          - type: paragraph
            body: >-
              Doctolib 自称是一个欧洲数字医疗平台，目标是改善医疗专业人士的日常工作，并帮助人们更健康地生活。当前公司材料称，Doctolib 现在把预约排班、患者沟通、安全专业消息、电子健康记录、财务工作流和 AI
              助手放在一起。公司也把自己定义为医疗专业人士的操作系统和面向患者的健康伴侣，而不只是预约撮合市场。


              规模指标已经足以支撑本报告后续分析。当前关于页面称，520,000 名医疗专业人士使用 Doctolib 技术，90 million 人使用其健康伴侣；自上线以来已完成 35 million 次远程会诊，每月共享
              14 million 份文档。公司还称，员工约 3,000 人，分布在 30 多个城市。


              地域足迹也比较清晰，虽然总部表述并非完全一致。Doctolib
              在法国、德国和意大利运营官方预约网站；招聘材料称，公司目前落地于四个国家，包括荷兰。德国和意大利已经不是试验性附属市场：官方和独立来源都显示，它们是重要运营市场。总部描述在公开材料中仍有些混杂；当前来源指向巴黎作为运营中心，一些公开引用和职位语境仍把团队同巴黎都会区内的
              Levallois 联系起来。
