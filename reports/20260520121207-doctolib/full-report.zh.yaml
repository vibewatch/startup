  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 工作流产品定义
        blocks:
          - type: paragraph
            body: >-
              Doctolib 最适合被理解为一个带有两个协同入口的医疗工作流系统，而不是简单的预约小组件。患者端的公开 App
              和网页让用户预约线下或视频就诊、向医生发消息、管理亲属预约、接收提醒，并存储或共享医疗文件。医疗服务方端的公开套餐阶梯和功能页显示，公司有意沿工作流栈上移：在线日历、患者和预约管理、数字接待、远程会诊、临床文档、患者账单和
              AI 助手。德国页面把商业逻辑说得尤其清楚，因为产品阶梯从轻量患者管理起步，爬升到一体化诊所软件和付费 AI 附加模块。战略上，这很重要：Doctolib
              的差异化不是某个单点功能，而是一个承诺——需求捕获、前台工作、会诊文档和就诊后跟进都在同一个工作流环境里。患者端因此同时充当医疗服务方软件的触达层和留存层；医疗服务方软件则被销售为运营核心，把触达转化为可重复的工作流节省。
