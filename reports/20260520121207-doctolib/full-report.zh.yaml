      - number: '8.5'
        title: 退出准备度、投资逻辑破裂触发点和最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              相比典型不透明私募健康科技公司，Doctolib
              更接近退出就绪，因为它现在拥有规模、经常性订阅核心、更好的英国可选性，以及多个可信的上市可比公司。这是好消息。缺失部分则阻止建议升至继续研究以上。不同于上市同业，Doctolib
              没有向市场提供经审计的多年财务报表、详细治理披露，或足以承销优先权悬顶的股权结构清晰度。因此，任何 IPO 准备度结论都只能是部分成立。


              投资逻辑破裂触发点也很容易说清。法国若出现实质不利的上诉或补救结果，会迫使倍数下调，因为它打击的是历史上支撑溢价的那台精确经济引擎。若反复证据显示英国扩张慢于 >£100 million
              计划所暗示的节奏，也会降低可选性价值。最后，如果审计数据最终显示利润率弱、债务沉重或国家级留存差，当前相对上市 HCIT 可比公司的溢价将很难守住。


              因此，最终尽调清单应狭窄而务实，不必穷尽所有问题。管理层应提供 2025 年经审计收入、EBITDA、现金和债务；2022 年债务和优先权文件；按国家拆分的 ARR
              留存和利润率桥；以及法国补救情景分析。如果这些材料经得起检验，判断可以上调。如果经不起，2026 年重置可能只是更完整重定价的第一段。
