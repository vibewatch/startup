  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 买方、用户、付款方和客群地图
        blocks:
          - type: paragraph
            body: >-
              从经济模型看，Doctolib
              不是由患者付费的市场，而是以服务提供方付费为主的工作流平台，并带有一个规模很大的免费患者入口。公司当前页面把产品拆成两个相连层次：面向医疗专业人士的操作系统，以及面向个人的健康伴侣。Sifted
              补充了商业现实：2024 年 ARR 的 99% 来自医疗专业人士支付的订阅。这意味着核心买方是医生或服务提供机构，日常主要用户既包括诊所团队也包括患者，医疗支付方报销的是临床行为，而不是 Doctolib 的
              SaaS 费用。


              当前客群地图已经不止于个体医生。德国页面明确为医院和 MVZ、多站点诊所网络以及广泛专科诊所设计不同旅程；法国目录页面展示了全科医生、儿科医生和护士的实时预约入口；Doctolib 2025 年 AI
              发布还加入了专门面向护士的产品。这一点重要，是因为客户质量取决于增长发生在哪一层。新增患者账号只是使用入口；新增订阅方、诊所网络、医院或助手插件，才是变现后的客户深度。因此，本章把服务提供方订阅作为核心客户指标，把患者使用视为需求与留存层，把公共支付方报销视为采用助推器，而不是
              Doctolib 的收入来源。
