      - - HDS / CNIL 合规负担
        - 正负交织
        - 当前
        - 提高信任和既有玩家防御力，但也抬高成本，拖慢新进入者或功能发布。
        - 确认 Doctolib 当前认证栈和续期日程。
      - - EHDS 互操作性推动
        - 正向但有执行风险
