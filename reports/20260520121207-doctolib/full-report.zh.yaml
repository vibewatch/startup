        - 重算法国附加销售、定价和留存假设；下调护城河耐久性
      - - 隐私或安全事故
        - 官方事件 / DPA 披露
        - 重大健康数据事件，或重复 sev-1 事件且缺乏有说服力的公开复盘
        - 暂停承销判断，直到根因、客户影响和整改得到验证
      - - AI 临床安全失误
        - 质量或事件证据
        - 公开确认出现有害文档错误、误路由事件，或人工推翻率上升且没有治理响应
        - 在质量控制拿到独立证据前，把 AI 增购视为负债
      - - 英国扩张执行失误
        - 推出与招聘里程碑
        - 花掉大量资金并整合 12-18 个月后，仍没有可信上线站点或切换证据
        - 削减英国期权价值，把支出视为利润率拖累而不是增长抓手
      - - 法国集中度仍高
        - ARR 构成披露
        - 法国占比仍接近当前集中度，且非法国增长停滞
        - 下调终局倍数，并要求证明德国 / 英国能吸收战略风险
      - - 评价 / 支持中的信任恶化
        - 评价和故障模式
        - 持续出现爽约、取消或可用性投诉，同时支持响应缓慢
        - 假设品牌摩擦正变得具有经济影响，并重新评估获客效率
