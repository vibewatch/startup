      - number: '3.4'
        title: 护城河真实存在，但其中最激进的排挤机制现在可以被攻击
        blocks:
          - type: paragraph
            body: >-
              法国监管机构 2025 年的案件让竞争问题尖锐得多。监管方称，Doctolib 在 2017 至 2022 年法国在线预约市场份额超过 50%，某些年份超过 90%；自 2019
              年以来，在远程会诊解决方案市场份额超过 40%。监管方还称，Doctolib 使用排他性条款，把远程会诊访问与事先购买 Doctolib Patient 绑定，并曾收购主要预约竞争对手
              MonDocteur，以排除竞争、增加 10,000 名专业人士，并支撑后续定价权。O'Melveny 和 Cleary 都把该决定框定为法国首个 Towercast
              风格制裁：一个低于申报门槛的杀手级收购，发生在间接网络效应强、进入壁垒高的市场。


              这很关键，因为 Doctolib
              的力量来源，正是监管者现在愿意审视的耦合。公司最好的竞争逻辑是：患者需求、提醒、消息、远程会诊和诊所工作流放在一起，比拆开更好用。买方通常认可这一点。但当同一设计变成排他、捆绑或排挤时，护城河就不再只是产品驱动，而开始具备法律可攻击性。


              投资含义不是 Doctolib 没有护城河。它显然有，尤其是在患者需求和医疗服务方工作流彼此强化的地方。含义是，护城河耐久性现在不再主要取决于绝对流量，而取决于 Doctolib 能否在互操作、AI
              责任、网络安全和买方多平台自由受到更严审视时继续赢。如果管理层能证明这一点，领导地位的基础会更难，但也更耐久。
