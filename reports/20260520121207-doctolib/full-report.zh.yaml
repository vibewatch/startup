      - number: '7.5'
        title: 缓释因素、可监控指标和终止标准
        blocks:
          - type: paragraph
            body: >-
              公开缓释因素是真实的，不应忽视。Doctolib 具备可见的安全认证、记录明确且不出售患者数据的订阅模式、信号质量比过去更好的内部 SOC、德国认证远程医疗通道，以及 AI 输出进入病历前的人审。英国扩张也通过
              Medicus 分阶段推进，而不是冷启动；管理层还保留了本地团队和创始人。这些选择降低了部分下行路径。


              不过，这些缓释还不足以改变头部风险排序。最值得监控的信号包括：法国上诉和补救措施进展、公共状态页上重复出现的产品事件、新的 DPA 批评或执法、AI
              输出造成临床实质性更正的证据、英国实施里程碑滑坡，以及德国或英国无法在下一规划周期降低对法国依赖的任何迹象。最清晰的投资逻辑破裂事件，是不利上诉结果叠加证据显示：一旦绑定压力被移除，远程问诊或工作流附加随之走弱。在此之前，反复发生的信任事件或明显停滞的英国落地，也会迫使投资者重估应为平台故事支付多少溢价。因此，正确的尽调姿态不是「等到一切完全清楚」，而是「把
              Doctolib 视作高质量基础设施，但其下一段价值创造必须经受法律、安全和互操作性审视」。
