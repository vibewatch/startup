        - 德国 411k 名临床医生；1m 个可预约时段；100k 次视频问诊；3.1m 条评价
        - 寻求曝光和诊所工具的德国医生
        - 市场平台、评价、在线预约、日历、视频、AI 笔记
        - 德国本土发现品牌强，提供免费增值入口
        - 以德国为中心，变现依赖曝光
      - - CGM CLICKDOC
        - 母公司 2025 年收入 €1.213bn；8,700+ 名员工；19 国办公室布局
        - 已在 CGM 技术栈周边运营的诊所、医院、药房
        - 视频问诊和更广泛云 / 平台工作流增售
        - 既有健康 IT 分发和合规能力
        - 大型消费者需求层公开证据较弱
      - - Doctena
        - 10k+ 名活跃专业人员；14k+ 条评价，平均 4.8/5
        - 需要在线预约和曝光的个人及团体诊所
        - 预约、提醒、候补名单、语音助手、可选视频
        - 绑定更轻，也更容易与既有系统共存
        - 工作流深度更窄，需求飞轮更小
      - - Livi / Kry
        - Livi 有 14m 次预约和 5k+ 名医疗专业人员；Kry 技术上有 3,000+ 名临床医生和 14m+ 次预约
        - 支付方、政府、GP 诊所、混合诊所
        - 数字问诊、分诊、临床医生技术栈、运营软件
        - 靠照护产能和支付方 / 公共渠道入口取胜
        - 不是私营诊所市场的直接替代品
      - - eConsult / NHS 数字前门
        - 1,400+ 家 NHS GP 诊所上线；绑定 GP 合同中的数字访问要求
        - 英国初级保健和政策驱动的访问工作流
        - 在线问诊、分诊、Smart Inbox、NHS App 集成
        - 政策对齐和临床系统集成
        - 英国特定，不是泛欧市场
      - - 自建 / 旧 PMS + 前台接待
        - 没有单一供应商；留存在既有本地工作流里
        - 不愿迁移平台的诊所
        - 电话分诊、本地日历、既有软件、手工行政
        - 无需迁移项目，也无需新增 SaaS 支出
        - 行政负担高，患者自助体验弱
