      - number: '5.4'
        title: 信任、合规与可靠性控制
        blocks:
          - type: paragraph
            body: >-
              Doctolib 的公开信任姿态强于平均私营医疗科技 产品叙事，但它仍是有意义控制和不完整透明度的混合。最强的已发布控制是具体的：隐私材料声明 GDPR
              合规、专门的安全和数据保护团队、加密备份快照保留不超过七天、健康数据在 AWS 上按 HDS 标准进行欧盟托管、健康数据端到端加密、授权临床医生访问控制、法国和德国 ISO 27001、法国 HDS，以及年度
              BSI
              审计。隐私安全页和合规页还把默认隐私、透明同意、欧洲托管和独立审计框定为核心设计选择，而不是事后补丁。可靠性证据较薄，但不是零：公开状态页显示了模块化服务监控和近期事故处理流程。限制在于，公开材料仍缺少量化
              SLO、助手质量基准和详细集成安全架构。因此，信任在政策、认证和表层运维可见性上有支撑，但还没有达到那种能让持怀疑态度的企业买方低摩擦采用 AI 辅助临床工作流的公开性能证据水平。
