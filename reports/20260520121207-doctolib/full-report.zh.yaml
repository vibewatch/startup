      - number: '1.3'
        title: 融资历史、投资者图谱与 2024-2026 年财务轨迹
        blocks:
          - type: paragraph
            body: >-
              Doctolib 的资本历史是公开记录中最清晰的部分之一。TechCrunch 报道，公司 2019 年 $170 million（€150 million）融资由 General Atlantic
              领投，Accel、Eurazeo、Kernel 和 Bpifrance 参与，使公司投后估值达到约 €1 billion，并让 Doctolib 成为独角兽。2022 年 3 月，TechCrunch 和
              FrenchWeb 均报道称，公司完成规模更大的 €500 million 融资，结构为股权和债务，Eurazeo 领投，Bpifrance 和 General Atlantic 参与。这些来源给出的估值为
              €5.8 billion，约 $6.4 billion，使 Doctolib 成为当时估值最高的法国初创公司。


              更难的问题是，经过那次估值上调后，业务本身是什么状态。第一批真正披露只出现在 2025 年对 2024 年的报道中。Sifted 称 Doctolib 2024 ARR 达到 €348 million，同比增长
              22.5%，亏损收窄 38% 至 €53.8 million。Sifted 还称，公司 2023 年收入已接近 €300 million，且 99% 的 ARR 来自医疗专业人士支付的订阅。法国在 2024
              ARR 中仍占 80%，但德国贡献 17%、意大利略低于 3%，说明非法国业务已经具备财务重要性。


              迈向 2026 年的轨迹向好，但还没有闭环。Sifted 称公司预计数月内实现盈利；Forbes 后来描述了大约 $400 million 的 2024 年度化订阅收入和约 $60 million
              的亏损，但保留材料中没有经审计的 2025 或 2026 盈利声明。公开累计融资数字也有差异，长篇人物资料引用超过 $815 million，Forbes 则引用 PitchBook 的约 $842
              million。
