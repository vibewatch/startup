      - number: '8.2'
        title: 2022 年峰值标记与 2026 年老股重定价
        blocks:
          - type: paragraph
            body: >-
              公开记录里最干净的估值锚点，仍是 2022 年 3 月那轮融资。TechCrunch 和 FrenchWeb 都把那笔融资写成 €500 million、估值 €5.8 billion；TechCrunch
              还明确称该轮混合了股权和债务。Forbes 后来称，2025 年老股交易流程可能与 2022 年价格持平，但 2026
              年最终执行的交易明显更低。FamilyOfficeHub、Infonet、Healthcare.Digital 和 Nordic9 等独立交易报道一致指向约 €3.6 billion 的老股估值，以及约 €300
              million 股份换手。


              这个变化有两层含义。第一，它是真实的价格发现重置：新交易较 2022 年标记低约
              38%。第二，它是流动性事件，而不是新的一级融资，所以公司没有补充资产负债表。老股价格可以因非流动性、信息不对称和缺乏控制权而应有折价；但即便考虑这些机制，这次变动仍说明，市场不再为 Doctolib 支付
              2021–2022 年健康科技倍数。


              更难的问题是，公开记录仍没有显示新资金在资本结构中前面还有什么。2022
              年报道确认了股权加债务，但没有确认债务规模、契约条款或任何清算优先权层级。这种不确定性意味着投资者可以看到重置价格，却仍不知道在压力退出情景下，普通股等价资本下方到底有多少保护。
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV009
