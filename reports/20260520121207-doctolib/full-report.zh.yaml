      - number: '3.3'
        title: 相邻产品和现状工作流会约束市场，即便它们不像传统同行
        blocks:
          - type: paragraph
            body: >-
              Doctolib 不只和其他预约市场竞争。Livi、Kry 和 eConsult 展示了预算如何转向护理交付能力、付款方合作或数字触达合规，而不是流向典型的私人诊所软件采购。Livi
              自称是欧洲最大的数字优先医疗服务方，拥有 14 million 次患者预约和 5,000 多名医疗专业人士；其合作伙伴中心面向 ICSs、ICBs、GP 诊所、保险公司和雇主。Kry
              的技术栈比问诊应用走得更远，进入临床医生记录和运营软件，并强调国家药品清单集成和强安全姿态。eConsult 对某些买方而言更明显是替代方案：它称自己已在 1,400 多家 NHS GP
              诊所上线，且英国政策现在要求在线工具在核心时段保持开放、快速响应，并与 NHS App 和临床系统集成。


              这些相邻品类重要，因为它们降低了一个泛欧门诊触达平台拿下全部市场的概率。诊所可以保留旧诊室系统，加一层更轻的预约工具，再把数字需求溢出或分诊外包给付款方或 NHS
              对齐工具。买方真正的现状选项因此比“另一个预约应用”更宽：它包括前台人工、既有软件、国家数字轨道，以及无需采用 Doctolib 完整工作流包也能解决触达问题的护理交付平台。


              这种动态有利于窄场景的品类专家，即使单个玩家都无法匹配 Doctolib 的完整产品栈。
