            body: >-
              公开证据支持一种分层运营模型。患者渠道处理搜索、预约、远程会诊访问、提醒和文档交换；诊所模块处理日历、接待、文档和账单；AI
              服务叠在这些工作流之上，自动化病历记录和电话接待；协作层则把系统延伸到护理团队消息。Microsoft 案例研究是最清楚的技术证据点：会诊助手使用 Azure AI services、GPT-4o 和
              Mistral
              Large，把现场对话转成结构化摘要，医生审阅输出后再进入病历。状态页还给出一个重要运营线索：电话助手、患者管理、远程医疗、患者消息、临床软件、账单和设备连接被列为单独监控组件，而不是一个整体单体。这说明
              Doctolib 运营的是一个带有服务边界的产品家族；即使公司没有发布正式公开架构图，这些边界在运营上仍重要。GitHub
              上围绕数据库、基础设施和数据管道工具的活动也强化了同一判断：可见工作流套件之下，公司似乎运营着相当厚的内部平台资产。
