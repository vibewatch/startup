        - 捆绑经济性受到实质限制，或被强制拆分
        - 削减溢价倍数，并质疑法国附加销售耐久性
        - 转为回避 / 将估值重置到悲观区间
      - - 经审计 2025 年利润率不达预期
        - 毛利率、EBITDA 或现金状况明显弱于市场假设
        - 打掉高于公开可比中位数付费的理由
        - 暂停投资，直到重新完整承销
      - - 英国推出滑坡
        - 投入 >£100M 后仍无可信收入或部署证据
        - 拿掉多元化和退出期权溢价
        - 削减期权价值，把案例收窄到法国核心
      - - 留存或队列疲弱
        - 国家层面流失率或 NRR 明显低于溢价 SaaS 预期
        - 削弱第 4 章的订阅质量投资逻辑
        - 重新定价到较低 HCIT 区间
