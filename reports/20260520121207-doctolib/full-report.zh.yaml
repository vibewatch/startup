          - type: callout
            title: 套件深度是护城河，也是仍在发酵的监管和信任风险
            body: 让 Doctolib 具备黏性的同一套一体化设计，也因把远程问诊和预约绑定在一起触发了反垄断罚款；围绕隐私的公开批评也没有消失。下一阶段扩张不能只靠继续加模块，还要拿出互操作性和安全性的证据。
            calloutType: risk
            claimRefs:
              - CE041
              - CE044
              - CE045
              - CE047
          - type: callout
            title: 只有在 API、AI 评估和企业级落地证据到位后，才承销这套产品组合
            body: 公开材料证明产品覆盖面广且仍在更新，但开放集成、AI 准确性和大型站点可复制部署的证据还不够。这三项尽调问题，应成为对产品驱动扩张形成高置信判断前的门槛。
            calloutType: recommendation
            claimRefs:
              - CE019
              - CE027
