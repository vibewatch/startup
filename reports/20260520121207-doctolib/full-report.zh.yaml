      - number: '7.3'
        title: 平台、云、合作伙伴和国际扩张依赖
        blocks:
          - type: paragraph
            body: >-
              Doctolib 平台之所以强大，部分原因是它架在多个外部依赖之上；这些依赖的失效模式又与监管和信任高度相关。最可见的技术链条，从 AWS、ATOS 和 Cloudflare 提供托管安全控制，延伸到 Azure
              OpenAI 和 Mistral 支撑临床 AI 功能；远程医疗的产品分发则取决于 Ameli 和 KBV 规则集，而不只是产品 UX。对现代健康软件平台来说，这些依赖并不异常，但它们意味着 Doctolib
              外部的合同争议、合规变化、区域宕机或模型政策调整，都可能迅速传导到患者端工作流和企业信誉。


              新进入英国让依赖图谱更复杂。Medicus 给了 Doctolib 一条进入英国的合规捷径；这个市场长期由 Optum 和 TPP 控制，NHS
              背书若靠有机方式复制本来需要多年。战略上，这很有吸引力，因为公司承诺投入超过 £100 million、招聘 150 人并设立伦敦 R&D
              中心，而不是用低成本试点测试英国市场。但风险也同时上升：同一步动作增加了另一个受监管的运营环境、另一个集成表面和另一个存量客户迁移问题，而 Doctolib 此刻已经在处理法国反垄断上诉风险和持续 AI
              落地。公开证据显示了雄心和伙伴匹配度，但还没有给出足以承销执行信心的实时站点数量、切换节奏或运营里程碑。
            claimRefs:
              - CR013
