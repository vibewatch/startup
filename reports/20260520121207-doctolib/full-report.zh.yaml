      - number: '7.4'
        title: 集中度、财务模型和人员执行风险
        blocks:
          - type: paragraph
            body: >-
              财务模型风险与其说是生存级烧钱，不如说是集中度与法律和执行压力相互作用。Sifted 首次真正的财务披露显示，2024 年 ARR 为 €348 million，增长 22.5%，亏损 €53.8
              million，R&D 支出 €115 million，且 99% ARR
              来自专业人士订阅。从一个角度看，这是高质量核心模型：患者不是收入来源，平台显然也不是依靠广告支出或抽佣率的线索生成市场。但它也很集中。法国在 2024 年仍贡献 80%
              ARR，这意味着，面临最大实时反垄断处罚的市场，也承载了当前经济性的压倒性份额。


              这种集中度直接传导到人员和执行风险。Doctolib 自己的上诉材料仍指向一个约 3000 人、分布在 30
              多个城市的公司；英国动作又新增了集成和招聘议程。公开证据足以显示规模和雄心，但不足以证明继任深度、国家级留存或补救措施后的模块附加率。如果法国增长放缓，如果德国扩张仍然昂贵，或如果英国执行吃掉过多领导层注意力，公司仍可能看起来规模很大且战略重要，却错过支撑平价老股估值或最终
              IPO 路径所需的多元化里程碑。对投资者而言，这是典型的「好公司、集中型操作系统」风险，而不是二元生存风险。
