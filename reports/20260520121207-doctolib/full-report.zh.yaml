companyProfile:
  summary: >-
    Doctolib 是一家创始人主导的欧洲数字医疗平台，成立于 2013 年；公司从在线预约拓展为更宽的医疗服务方工作流栈，覆盖患者沟通、远程会诊、安全消息、病历、账单和 AI 助手。当前公开材料显示，Doctolib 技术已触达
    520,000 名医疗专业人士和 90 million 名用户；独立媒体 2025 年报道称，公司 2024 ARR 为 €348 million、增长 22.5%，亏损大幅收窄。公司上一次清晰披露的融资是 2022 年，估值
    €5.8 billion；但 2026 年老股交易报道显示，当前价格发现更接近 €3.6 billion，且没有注入新的新股资本。
