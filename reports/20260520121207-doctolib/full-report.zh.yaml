  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑和建议
        blocks:
          - type: paragraph
            body: >-
              Doctolib 案例的正面逻辑仍然强，并且与前文财务、产品和客户章节一致。公司如今有可信的公开证据，证明自己具备真实的经常性收入引擎：Sifted 报道 2024 年 ARR 为 €348 million，其中
              99% 来自服务提供方订阅，亏损也大幅收窄。这一点重要，因为它说明 Doctolib 不是脆弱的消费者远程医疗故事，而是一个由患者触达包裹的服务提供方工作流平台。Medicus
              交易还表明，管理层仍试图把这套工作流模型延伸到相邻的受监管基础设施，而不只是防守法国预约核心。


              反向逻辑同样具体。第 7
              章已经说明，法国反垄断裁定不是表面问题；估值必须把它计入，因为推动高溢价变现的同一套打包逻辑，如今正在上诉中。公开披露仍然太薄，无法支持高置信价格判断：毛利率、NRR、CAC、债务条款和清算优先权都未公开。这让投资者可以欣赏规模和产品深度，却仍不得不猜测下行回收价值。


              综合两边，最可支持的判断是继续研究，置信度中，风险高，当前估值立场偏高。公司质量好过价格支撑。在今天已知的老股价格水平，投资者仍在相对上市工作流和 HCIT 可比公司支付溢价，却没有拿到上市公司级披露作为回报。
