  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 竞争、反垄断和远程医疗监管悬顶
        blocks:
          - type: paragraph
            body: >-
              Doctolib 最高严重度风险不再是假设性的竞争法敞口，而是一起仍在进行的法国案件，直接打到公司的核心工作流设计。Autorité de la concurrence 在 2025 年 11 月对
              Doctolib 罚款 €4.665 million，称预约市场份额自 2017 年以来一直高于 50%，部分年份高于 90%，并认定公司使用排他条款，且要求先购买 Doctolib Patient 才能使用
              Téléconsultation。Cleary、O’Melveny 和 A&O Shearman 的法律评论把 MonDocteur 认定描述为法国首次根据 Article 102
              对低于申报门槛的「杀手收购」作出处罚。这一点重要，因为它扩大了未来交易风险范围，也表明 Doctolib 最有效的锁定机制如今正被明确审视。


              上诉降低了最终结果的确定性，但没有降低当前风险。Doctolib
              认为该决定误解了其业务，并称如果把远程问诊从产品其余部分中拆开，会损害患者随访、处方共享和计费。这个抗辩在商业上容易理解，但从投资者角度看，它确认的是同一个问题：公司的增长逻辑仍依赖产品耦合。同时，远程问诊经济性受外部规则管控，而不是只由产品设计决定。法国报销仍取决于协调护理和安全数字渠道；德国
              KBV 则要求认证视频服务商、禁止录制，并保留 50% 纯视频比例上限，同时把临时认证变通延续至 2026
              年底。结果是一套监管栈：法律救济、报销惯例和认证服务商规则，即使在产品需求仍强时，也都可能压住变现或拖慢落地。
