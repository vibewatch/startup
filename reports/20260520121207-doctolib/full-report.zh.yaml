      - number: '2.4'
        title: 替代方案包括现状工作流、既有软件和护理交付平台
        blocks:
          - type: paragraph
            body: >-
              替代集合比“其他预约应用”更宽。患者仍可以打电话给前台；诊所可以继续依赖旧诊所软件加人工行政；公共数字医疗基础设施也可能随着时间吸收一部分数据和触达工作流。在此之上，还有直接欧洲替代者。Docplanner
              是最接近的泛欧双边市场类比；Maiia 显示法国已有本地软件加远程会诊竞争者；Kry/Livi 则显示，远程会诊竞争可以来自护理交付品牌，而不只是纯工作流软件供应商。


              法国反垄断案让这组替代讨论具备财务重要性。Autorité 将在线预约和远程医疗咨询技术解决方案定义为两个独立市场，随后认定 Doctolib 通过排他、捆绑和 MonDocteur
              收购滥用支配地位。O'Melveny 的摘要更进一步，把该案框定为仍在演化市场中的排挤竞争。这是最清楚的公开证据，说明 Doctolib
              的法国核心不能再只按赢家通吃式增长故事分析；它还必须被视为一个可能受监管的瓶颈。


              这也解释了为什么公开市场估计看起来彼此冲突。宽口径数字医疗 TAM
              和远程医疗市场报告是有用的方向性信号，但它们描述的竞争战场，并不是法国竞争管理局点名的法国预约和远程会诊市场。投资者因此应把这里的市场规模理解为一组边界，而不是一个干净的单一数字。
