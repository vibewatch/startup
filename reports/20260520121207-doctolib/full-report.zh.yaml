      - number: '1.4'
        title: 里程碑、安全姿态与负面竞争问题
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，公司正从排班工具走向更宽的医疗运营栈。除融资轮次外，Doctolib 于 2022 年宣布收购 Tanker，以加强在线医疗保密；2023 年与 Siilo 联手，改善护理团队协作；2024
              年在意大利、法国和德国续展或扩大隐私认证；并公开德国 C5 安全证明，作为更高信任标准的证据。2026 年 5 月，Doctolib 和 Medicus 宣布计划在英国打造下一代 GP
              平台，显示管理层仍在用收购和合作打开新的市场向量。


              扩张故事现在旁边有一份更清楚的负面档案。2025 年 11 月，法国竞争管理局因 Doctolib 在在线预约和远程会诊中滥用支配地位，对其罚款 €4.665
              million。该机构称，行为包括排他性条款、捆绑，以及通过 2018 年收购 MonDocteur 排挤竞争。PPC Land 和 O'Melveny
              的独立摘要进一步说明，此案不只是一笔罚款：它正被解读为法国关于平台支配地位和低于申报门槛的杀手级收购理论的重要案例。


              Doctolib 已公开表示会申诉。因此，这个问题尚未终结，但也意味着任何投资判断都必须把监管和竞争风险视为第一章的活事实，而不是脚注。
