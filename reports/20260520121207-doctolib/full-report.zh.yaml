              - CV015
              - CV044
      - number: '8.3'
        title: 可比集合：上市、私募和交易视角
        blocks:
          - type: paragraph
            body: >-
              早前竞争和市场章节中的可比集合，并不是一个干净的同业桶。Teladoc 最清楚地提醒我们，市场现在愿意为消费者占比高的虚拟医疗支付得很少：其当前 EV / sales 倍数低于 1x。Phreesia
              是更好的服务提供方软件和支付邻近基准，但倍数仍只有约 1.2x。Doximity 是质量最高的上市类比，因为它销售临床医生生产力并拥有强得多的利润率；即便如此，其倍数也约为 4.3x EV /
              sales。CompuGroup 提供了一个欧洲健康软件参照，收入超过 €1.2 billion，EBITDA 为 €195 million，市值约 $1.36 billion。


              这些可比公司不会让 Doctolib 直接等同于任何一个名字。相较 Teladoc，公司应获得一定溢价，因为收入压倒性来自订阅，且较少暴露于 DTC 流失。相较许多普通 HCIT
              资产，它也应得到更多信用，因为患者网络和诊所工作流技术栈，形成了差异化的操作系统叙事。但当前老股估值仍意味着，取决于采用哪个收入基数，经常性收入倍数约为 9x 到 10x；这高于 Doximity，也高于
              Capstone 的 Healthcare IT M&A 平均 6.1x。


              私募和 M&A 参照指向同一方向。Docplanner 仍是欧洲双边医疗访问领域最接近的私募类比；其收购 MyDr 也显示软件整合仍在继续，但交易价值未披露限制了精度。行业顾问把 2025–2026
              年描述为一个选择性规模市场：高质量、盈利资产仍可获得溢价，亏损或不透明名字则会被压缩。这个框架异常贴合 Doctolib：质量是真实的，但披露还不是溢价级。
