      - number: '5.3'
        title: 部署、集成与路线图
        blocks:
          - type: paragraph
            body: >-
              公开推出故事真实存在，但证据并不均衡。在德国，第三方报道称，新的全一体诊所软件最初面向全科医生、儿科医生和妇科医生，更多专科将在 2026
              年加入。同一报道称，该套件把预约管理、文档和账单压进一个应用，并在其上叠加三个 AI
              助手。电话助手似乎是最清晰的近期扩张杠杆，因为公开报道已经描述了具体路由行为、可见定价，以及从独立执业医生向更大机构分阶段推广、到 2026 年初覆盖的计划。协作也在向外移动：2023 年收购 Siilo
              增加了一个移动优先的护理团队界面，同时在整合进 Doctolib Team 期间保留 Siilo 独立运行。仍不透明的是，大型集团和第三方软件伙伴的部署边界到底在哪里。公开来源没有给出宽口径开放 API
              目录、企业集成矩阵，或能证明 Doctolib 如何顺畅嵌入异构诊所环境的实施证据。因此，路线图看起来商业上雄心很大、技术上可行，但在买方最关心部署摩擦的地方，仍缺少文档支撑。
