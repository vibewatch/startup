      - number: '5.5'
        title: 差异化与技术风险
        blocks:
          - type: paragraph
            body: >-
              Doctolib 的产品差异化是带有可信信任外壳的工作流广度。公司不再只销售一个排班入口；它销售的是一条路径，从患者获客和提醒，延伸到文档、账单、护理团队消息和 AI
              辅助行政劳动。这种广度形成了粘性的运营模型，也让点状解决方案相比之下显得更窄。它也是最清楚产品风险的来源。法国竞争管理局认定，Doctolib
              将远程会诊与预约产品捆绑，并使用排他性条款排挤竞争者；这意味着模块耦合的产品习惯不能被视为纯粹护城河。Heise
              的报道又增加了第二个信任风险：德国数据保护倡导者持续提出隐私批评。结果是一个有层次的结论：技术上，套件看起来宽、当前且越来越 AI
              化；运营上，它有足够公开证据证明严肃性；战略上，它现在必须更多靠互操作、安全和可衡量工作流结果取胜，而不是靠套件锁定。买方应把开放集成深度、AI 评估严谨度和企业推出证据视为三大尽调关口。
