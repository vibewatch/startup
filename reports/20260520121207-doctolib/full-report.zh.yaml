      - number: '4.2'
        title: 销售动作与效率代理指标
        blocks:
          - type: paragraph
            body: >-
              官方产品页暗示，公司采用围绕医生工作流痛点的先落地再扩张销售动作，而不是低摩擦自助式市场。Doctolib 反复把系统卖成一层集成运营层，横跨排班、数字接待、患者沟通、远程会诊、文档、账单、支付和 AI
              助手。这形成了以节省人工、填满日历、减少爽约和提高收款效率为中心的商业论点。公开代理指标有方向性，也有用：患者获客页面称，平台触达 25 million
              多名德国患者；数字接待和沟通页面承诺自动提醒、候补名单、24/7
              电话处理，以及更低的电话或邮件量。这些都是进入市场效率指标，因为它们告诉潜在诊所投资回报叙事从哪里开始。缺失的信息同样重要。没有被审阅的公开来源披露 CAC、回本周期、留存或流失，也没有公开证据拆出 AI
              助手、远程会诊或支付的附加采用率。这意味着投资者能看见产品扩张逻辑，却看不见销售生产率、续约经济性或队列耐久性；这些才会把有说服力的商业故事变成可承销的收入引擎。
