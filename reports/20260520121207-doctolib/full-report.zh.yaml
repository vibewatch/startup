  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入质量与定价模型
        blocks:
          - type: paragraph
            body: >-
              在大型欧洲私营医疗科技公司中，Doctolib 的公开财务叙事在收入质量上异常清晰，在收入线以下则异常单薄。最清楚的披露事实是，2024 ARR 达到 €348 million，且其中 99%
              来自医疗专业人士支付的订阅，而不是患者或预约佣金。这很重要，因为它让 Doctolib 在经济属性上更接近工作流 SaaS
              平台，而不是暴露在抽佣波动中的典型市场平台。患者端保持免费，因此更像需求生成、留存支持和医生获客工具，而不是计费收入线。公开定价也强化了这个模型：德国套餐在年合同中从免费入口层，递进到每名医生每月
              €139、€229、€299 和 €475，并另收导入、迁移和 AI 助手费用。同样重要的是，定价页明确称，定制组合、月度合同和批量折扣可按需提供，因此标价不能直接视为实际
              ARPU。最有吸引力的观察口径，不是标题式标价，而是 Doctolib 能多有效地把免费患者需求和宽工作流覆盖，转成更高层级医疗服务方订阅和附加模块采用。
