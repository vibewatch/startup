  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 支柱
      - 投资逻辑
      - 反向逻辑
      - 改变观点的因素
    rows:
      - - 收入质量
        - 99% 订阅收入结构让 Doctolib 更像服务医疗机构的 SaaS，而不是消费者远程医疗。
        - 公开利润率和留存数据仍缺失，收入质量还无法完整承销。
        - 经审计的毛利率和队列留存披露。
      - - 市场地位
        - Doctolib 仍有欧洲规模、患者触达和比许多对手更深的工作流栈。
        - 法国主导地位如今带着法律悬念，不再只是护城河价值。
        - 清晰的上诉结果，以及更严格规则下附加销售仍能撑住的证据。
      - - 价格重置
        - 2026 年老股交易已经修正了部分 2022 年溢价。
        - 即便重置后，隐含倍数仍高于公开可比公司和行业 M&A 平均水平。
        - 进一步降价，或财务披露明显改善。
      - - 可比公司支撑
        - Doximity 证明，面向临床医生的生产力软件可以守住溢价倍数。
        - Doctolib 的定价仍高于 Doximity，但公开利润率透明度没有跟上。
        - 有公开证据支撑的利润率，或更低入场倍数。
      - - 增长期权
        - Medicus 给 Doctolib 打开了真实的英国基础设施切口，也拓宽了退出叙事。
        - 在站点数、迁移和收入证据出现前，英国价值仍主要是叙事。
        - 2026-2027 年可追踪的英国部署和附加销售经济性。
      - - 资本结构
        - 如果资产负债表已经强健，2026 年老股交易没有新股融资也可以接受。
        - 公开记录仍没有债务余额、契约或清算优先权。
        - 尽调中提供经董事会批准的融资和股权结构包。
    notes: 这张表有意对价格敏感：几项投资逻辑原则上仍可投，但在已知 2026 年价格或披露水平下还不够。
