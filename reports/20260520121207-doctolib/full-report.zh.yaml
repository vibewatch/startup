      - number: '4.5'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              Doctolib
              财务案例中可投资的部分是真实的：公司已有有意义的规模、由高质量订阅驱动的收入基础、透明标价，以及从预约进入更深工作流商业化的清晰产品路径。风险部分也真实存在：公开证据仍没有告诉投资者毛利结构是什么、销售支出之后客户经济性是否有吸引力、混合
              2022 年融资中还剩多少债务，或如果 AI 投入和国际扩张继续按当前节奏推进，还剩多少跑道。2025 年法国反垄断处罚也有财务意义，因为它直接打击了把远程会诊和预约捆在一个包里的商业习惯。处罚没有抹掉
              Doctolib 的定价权，但降低了对下一段 ARPU 扩张能无摩擦推进的信心。综合这些因素，财务结论是：收入质量偏正面，利润率路径需谨慎，资本充足性仍不完整。纪律严明的投资者应把 Doctolib
              视为一家强订阅平台，经济性正在改善但仍部分不透明；在承销任何新的新股融资前，应把现金、债务、利润率、留存和实际定价披露列为准入问题。
