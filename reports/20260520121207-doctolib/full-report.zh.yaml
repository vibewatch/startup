  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司 / 参照
      - 指标
      - 倍数 / 估值 / 状态
      - 重要性
      - 局限
    rows:
      - - Teladoc
        - LTM 收入 $2.51B
        - EV/sales 0.59x；市值 ~$1.16B
        - 说明增长和利润率质量退潮后，市场给消费者属性偏重的虚拟医疗估值很低。
        - 远程医疗结构与 Doctolib 面向机构的 SaaS 核心可比性较弱。
      - - Doximity
        - LTM 收入 $644.9M
        - EV/sales 4.32x；市值 ~$3.7B
        - 最好的公开生产力可比公司：它向临床医生变现，利润率强。
        - 美国网络经济性和盈利能力强于 Doctolib 公开披露所能证明的水平。
      - - Phreesia
        - LTM 收入 $480.6M
        - EV/sales 1.22x；市值 ~$0.54B
        - 有用的工作流和支付相邻型医疗机构软件参照。
        - 利润率更薄，患者接入模型也不同于 Doctolib 的网络化入口层。
      - - CompuGroup Medical
        - 2025 年收入 €1.213B
        - 市值 ~$1.36B；EBITDA €195M
        - 欧洲医疗软件基准，公开 EBITDA，且覆盖诊所软件。
        - 市值 / 收入不能直接等同 EV/sales，CGM 也是更成熟的上市既有厂商。
      - - Docplanner
        - 13 个国家；每月 25M 次预约；300k 名医生
        - 保留来源未披露估值
        - 按运营模式看，最接近的欧洲私营预约入口与工作流类比对象。
        - 已审阅材料中没有保留的公开当前估值。
      - - Docplanner / MyDr 收购
        - 诊所管理 M&A
        - 交易条款未披露
        - 显示端到端医疗软件仍在私募市场持续整合。
        - 估值未披露，限制直接使用倍数。
      - - 医疗 IT M&A 市场
        - 行业交易环境
        - Capstone 平均 6.1x EV/revenue；Solganick 优质资产 12x-15x EBITDA
        - 给 2025-2026 年规模和质量仍能拿到什么价格，设定了最好的外部标尺。
        - 行业平均混合了许多子板块，也假设披露质量优于 Doctolib 当前公开水平。
    notes: 覆盖样本包括开放来源中最相关的上市、私营和交易参照。私营数字医疗交易估值经常不披露，因此表格同时使用公司和行业类比，而不假装拥有完整封闭的同业组。
