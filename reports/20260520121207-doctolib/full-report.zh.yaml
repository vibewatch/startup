      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Doctolib 不是脆弱的收入前初创公司，但公开证据仍不足以完成硬性资本承销。公司显然获得过大量历史支持：2019 年 €150 million，2022 年 €500
              million；后一轮明确被描述为股权和债务混合，估值 €5.8
              billion。但审阅过的公开来源都没有披露债务部分、当前债务余额、贷款方条款、现金余额或跑道。这使外部人无法判断，亏损改善有多少来自运营纪律，有多少来自 2022 年融资后仍剩余的资产负债表能力。Forbes
              还补充了一个重要细节：后续老股活动被描述为股东流动性，而非新股融资；这意味着最近一些公开交易热度至少部分是员工和早期投资者变现，而不是补充公司现金。本章结论因此不能是 Doctolib
              显然现在需要钱；只能是现有公开证据不足以证明它不需要。亏损线收窄令人鼓舞，但在缺少现金、烧钱、债务和利润率披露时，融资依赖仍是部分隐藏的，而非已被证伪。
