      - number: '6.3'
        title: 具名证据、结果和满意度信号
        blocks:
          - type: paragraph
            body: >-
              公开客户证据在工作流层面强于知名客户披露。最强的具名终端客户式证据，来自 Doctolib 自己发布的全科医生 Brice A. 证言；他称问诊助手已经变得难以离开。Microsoft
              在生产成熟度上提供了更强的第三方验证：Azure 客户案例称 Doctolib 的助手已上线，可以实时转写就诊内容，并在 15 秒内生成结构化摘要，再由医生确认。Medicus
              则从合作伙伴侧提供证据：Doctolib 的 GP 技术栈重要到足以支撑英国扩张，并公开提到已经支持 4 万名 GP。


              结果声明方向不错，但大多来自公司自身。德国页面称爽约最多可下降 58%，只有约 5% 的预约未到诊，一半预约发生在办公时间之外，96% 的患者满意；诊所网络页面给出的平均爽约降幅较低，但 40%
              仍有实质意义。Egora 补充了一个重要的新鲜使用场景信号：打给 GP 的电话有 40% 无人接听，电话助手已经面向个体医生上线，较大机构预计到 2026 年初上线。独立满意度信号好坏参半，而不是糟糕：App
              Store 评分很强，为 4.7/5；Trustpilot 则中等，为 3.5/5，既有好评也有运营投诉。
