  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 投资判断取决于：在当前老股价格下，经营证明的改善能否压过监管和披露折价。
    data:
      nodes:
        - label: 2024 年证明：€348M ARR、99% 订阅收入占比、亏损收窄
        - label: 工作流深度和客户规模仍然扎实
        - label: 2026 年重定价：约 €3.6B 老股交易，约 9x-10x 经常性收入
        - label: 监管压力：法国反垄断上诉和捆绑风险
        - label: 披露缺口：利润率、留存、债务、优先权仍未公开
        - label: 英国可选项：Medicus 增加战略叙事，也带来执行工作
        - label: 价格仍高于公开 HCIT 和工作流可比公司
        - label: 建议：继续研究，除非入场价下降或尽调清除阻碍
    approximationNotes: 仅为定性流程；该图概括决策顺序，而不是在正式评分模型中分配权重。
    claimRefs:
      - CV004
      - CV005
      - CV008
      - CV038
      - CV041
