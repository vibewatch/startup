      - number: '2.2'
        title: 法国、德国和意大利的买方、用户、付款方机制不同
        blocks:
          - type: paragraph
            body: >-
              法国是当前最清晰的商业化引擎。患者使用远程会诊和预约服务，但公开报销规则与 Sifted 的 ARR 披露都指向医疗服务方才是软件层眼下的经济买方。Ameli
              称，只要远程会诊处在协调护理路径内，报销方式就与线下门诊行为相同；这意味着付款方报销的是临床就诊，而医生或诊所仍在购买工作流软件。这个区分很重要：远程会诊增长能扩大使用和留存，却不一定带来由付款方资助的 SaaS
              收入。


              德国的结构不同。BMG 和 gematik 显示，ePA、电子处方、DiGA 和远程医疗已进入明确的国家数字化议程；自 2025 年 10 月起，医疗机构还必须把 ePA
              接入日常工作。这比法国带来更强的互操作和合规拉力。但 Sifted
              也报道称，德国医生通常在更大的诊所执业，有助理，基础工作流成熟度更高。换句话说，德国提供的是更大的系统集成机会，但用法式行政效率叙事去销售，难度更高。


              意大利更早期，也更模糊。保留的公开证据清楚显示 FSE 2.0 互操作工作会持续到 2026 年，但 Doctolib
              自己仍把意大利描述为一个需要教育医生、消费者数字使用较弱的市场。这说明意大利不是“几年后的法国”；从一开始，它就是一个私人工作流软件必须与公共系统基础设施和不同患者行为共存的市场。
