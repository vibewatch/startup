  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 同行集合是多类别的：一个泛欧市场竞争者、数个本地既有厂商和更轻量替代品
        blocks:
          - type: paragraph
            body: >-
              最接近的直接同行，不是所有提供视频问诊的数字医疗公司，而是 Docplanner 家族——包括德国的 Jameda 和意大利的
              MioDottore。这个集群把患者发现、医生声誉、在线预约和软件商业化结合起来，最像 Doctolib 的双边逻辑。Docplanner 当前关于页面称，公司在 13 个国家领先，每月处理 25 million
              次预约，吸引 100 million 次患者访问，并服务 300,000 名活跃医生。Jameda 增加了德国密度：411,000 名列名临床医生、超过 1 million 个可预约号源、100,000
              次视频咨询和 3.1 million 条评论。MioDottore 重要，是因为它说明意大利竞争靠本地化品牌展开，而不只是一个泛欧标签。


              下一类威胁更具国家特性。Maiia 和 Cegedim 通过已安装软件、日程工作流、安全远程会诊和既有医疗服务方关系进攻法国；CGM 和 CLICKDOC 则从更大的国际健康 IT
              基础出发做同样的事。这些既有厂商不需要在消费者搜索中压过 Doctolib 才能保持危险。如果一家诊所已经向它们购买诊室或诊所软件，并把在线预约或远程会诊视为附加模块而不是新的平台决策，它们就能赢。


              市场边缘，Doctena 等更轻量工具也重要，因为它们让买方的外部选择更便宜、更容易。它们尚未复制 Doctolib 的完整工作流深度，但可以阻止低复杂度诊所进入更高 ARPU 套件。
