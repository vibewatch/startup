    rows:
      - - Covid 后法国远程问诊常态化
        - 正向
        - 2024-2026
        - 疫情后需求仍在，远程医疗仍能推动采用，不是一次性泡沫。
        - 跟踪 2025-2026 年量增是否仍保持两位数。
      - - 医疗服务方付费的订阅核心
        - 正负交织
        - 当前
