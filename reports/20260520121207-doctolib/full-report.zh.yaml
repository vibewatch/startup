      - number: '6.4'
        title: 留存代理指标、扩张循环和采购摩擦
        blocks:
          - type: paragraph
            body: >-
              核心留存问题不是公开证据无法证明采用，而是缺少续约质量证据。公司没有公开 NRR、GRR、流失率或头部客户集中度。这迫使尽调只能使用代理指标。好的代理指标很强：99% ARR
              来自服务提供方订阅，平台把预约、消息、远程问诊、文档和助手打包进同一套工作流，Doctolib 也明显在推动从免费或基础使用，向患者管理、问诊助手、电话助手和更深的临床软件扩张。问诊助手页面明确向现有
              Doctolib 用户提供免费试用，这正是存量客户扩张引擎的样子。


              采购并非没有摩擦。机构买方必须通过健康数据托管和云安全门槛，包括法国 HDS、德国 BSI C5 以及德国和欧洲更广泛的 ISO 覆盖。Doctolib
              面向医疗专业人士的信息强调价格完全透明、无需承诺期，这有利于销售叙事；但归档的服务提供方评论证据仍能看到合同摩擦投诉。这个组合指向一款真实的企业级产品，具备可见的增购和机构客户潜力；但合同条款、部署负担和合规尽调仍需要在数据室里直接验证，不能从营销文案中推断。
