      - number: '4.3'
        title: 成本结构、公开牵引力与缺失的运营数据
        blocks:
          - type: paragraph
            body: >-
              公开牵引力足以证明产品市场匹配，但仍不足以证明利润率质量。Sifted 的 2024 年披露给出核心数据点：€348 million ARR、22.5% 增长、80 million 个患者账户、400,000
              名医疗专业人士订阅用户，以及法国 80%、德国 17%、意大利低于 3% 的地域结构。这形成了一门具备真实规模、商业化核心仍高度集中在法国的生意。同一篇文章还披露，2024 年研发支出为 €115
              million，约为收入的三分之一；这解释了为什么亏损虽改善，但盈利仍落后于收入增长。公开问题在于，Doctolib 仍不披露毛利率、贡献利润率、CAC、NRR
              或流失。换句话说，外部人能看见增长、亏损和产品广度，却看不见每一欧元 ARR 在扣除支持、托管、导入、支付或远程会诊交付成本后，有多少具备结构性耐久性。公开同行凸显了这一缺口：CompuGroup Medical
              披露收入、EBITDA 和员工数；Teladoc 披露现金、债务和净亏损；YCharts 和公开文件暴露基准利润率。Doctolib 不需要上市才披露更多，但今天的披露仍把核心承销变量留在私人区。
