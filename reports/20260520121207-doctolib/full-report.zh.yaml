        - 法国和德国核心客群
        - 德国诊所管理和电话助手页面直接面向该分群
        - 核心经常性 SaaS 订阅客群，也最容易追加销售
        - 没有按诊所规模拆分的公开流失率或套餐组合
      - - 专科和治疗类诊所
        - 买方：专科业主 / 管理者；用户：员工和患者；付费方：诊所
        - 德国官方分类包括专科、牙科、放射科、治疗类
        - 目录和专科页面显示实时预约入口
        - 如果附加文档或账单模块，ARPU 高于基础预约
        - 没有专科层面的附加购买率或留存
      - - 全科医生群体
        - 买方：全科医生诊所或全科网络；用户：全科医生、助理、患者；付费方：诊所
        - Medicus 提到 40,000 名全科医生；德国软件先面向全科医生推出
        - Medicus 合作、德国推广、Egora 电话使用案例
        - 战略灯塔专科，因为它锚定入口和远程问诊
        - 没有仅针对全科的公开续约或转化群组
      - - 护士和相关专业人员
        - 买方：个人护士或团体；用户：护士和患者；付费方：诊所
        - 法国 AI 发布新增护士产品；Doctolib.fr 上线护士目录
        - 官方护士产品和上线目录构成证据
        - 把 TAM 扩展到医生之外，并创造更低价入口
        - 没有公开护士订阅数
      - - 医院和 MVZ
        - 买方：机构、医疗主任、运营负责人；用户：科室、前台、患者；付费方：机构
        - 德国页面明确面向医院、诊所和 MVZ
