      - number: '6.2'
        title: 采用轨迹、地域和指标一致性
        blocks:
          - type: paragraph
            body: >-
              客户采用路径很强，但口径并不完全统一。Sifted 的 2024 年披露给出了最佳变现基线：40 万名付费医疗专业人士订阅者、8000 万个患者账号，法国贡献 80% ARR，德国已经达到
              17%。官方当前材料描述的漏斗顶部更宽：52 万名医疗专业人士和 9000 万人使用 Doctolib 技术。方向上，这与规模增长一致，但显然不是付费订阅者的同一个分母。


              德国是最清晰的第二市场验证。Sifted 报道称，2024 年德国有 2500 万名患者和 10 万名医疗专业人士；德国产品页面则引用 2500 万名注册患者，并根据页面不同写成每月 190 万次预约或超过
              300 万次预约。这种不一致不致命，但意味着尽调在把任何单一营销数字放进董事会指标前，应先拿到德国当前 KPI 的精确定义。远程问诊数字也有同样问题。公司关于页面称上线以来已有 3500
              万次远程问诊，但仅法国医保就在 2024 年统计了法国 1390 万次远程问诊。干净的结论是：Doctolib 具备真实的多国使用深度，但部分公开客户指标仍是营销层数字，而不是严密版本管理的运营看板。
