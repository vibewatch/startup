            title: 最难缠的竞争者不是某家公司，而是最贴合买方起点的那一类
            body: >-
              如果诊所从消费者需求捕获出发，Docplanner/Jameda 是自然替代。如果起点是已安装软件栈，Maiia/Cegedim 或 CGM 更危险。如果起点是公共或付款方触达义务，Livi、Kry 和
              eConsult 更重要。因此，国家和细分场景比任何单一泛欧份额表更能预测竞争结果。
