      - number: '7.2'
        title: 隐私、安全、AI 和运营可靠性
        blocks:
          - type: paragraph
            body: >-
              Doctolib 的第二类风险，位于敏感健康数据、公共服务可靠性和 AI 辅助文档的交汇处。官方隐私承诺方向上较强：公司称默认使用 2FA，对静态和传输中的数据加密，把主加密密钥存放在 ATOS，在欧洲通过
              Cloudflare 背后进行 TLS 终止，并依赖具备 HDS 和 C5 证明的 AWS 基础设施。Connect 又增加了一层信任：端到端加密、临时消息、ISO 27001、NEN 7510 和 C5
              Type 1 控制。Elastic 的客户案例还显示，Doctolib 必须把 SOC 内部化，以减少误报并延长留存；这是正面的缓释信号，但也承认此前运营模型对平台威胁画像来说过于嘈杂。


              剩余敞口来自公开材料仍未证明的部分。官方状态页仍显示 2026 年 5 月 6 日一起发生在多产品实时表面的事件。Heise 报道称，数据保护倡导者的批评仍在继续，投诉也反复进入柏林监管机构。AI
              方面，Microsoft 和 Doctolib 工程材料展示了较周密的人审闭环、摘要后删除音频和转写、聚焦幻觉的评估以及 A/B
              测试。但这些来源没有公布专科级错误率、静默失败复盘，或针对误写病历和错误呼叫分流的升级阈值。在一条触及记录、处方和患者随访的工作流里，存在保护措施令人鼓舞；结果指标大多仍为私有，才是风险所在。
