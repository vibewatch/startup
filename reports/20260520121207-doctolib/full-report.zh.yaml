      - number: '8.4'
        title: 乐观、基准、悲观情景和入场纪律
        blocks:
          - type: paragraph
            body: >-
              情景框架应刻意保持简单，因为公开输入仍不完整。乐观情景假设 Doctolib 保持 20% 以上增长，证明利润耐久，在德国和英国实现实质扩张，并避开会实质削弱法国附加经济性的补救结果。在这种世界里，支付约 9x
              到 10x 经常性收入仍可辩护，估值也可以收复部分失地、向 2022 年标记靠近。


              基准情景更保守。它假设 2026
              年老股价格对今天的证据集大体合理：增长延续，但不再享受疫情时期倍数；利润率改善，但公开证据仍太薄；反垄断悬顶仍是折价，而非投资逻辑破裂。按这种看法，现有持有人或许还可以，但新投资者尚未获得清晰的安全边际。


              悲观情景不是运营崩塌，而是倍数压缩叠加法律摩擦。如果法国补救措施削弱打包能力，如果英国执行比预期更久，或如果市场对不透明 HCIT 名字的定价收敛到接近 5x–6x
              经常性收入，价值仍可能实质性下调。这就是为什么入场纪律比欣赏更重要。同一家公司，在 €2.5–€3.0 billion 时可以有吸引力，在 €3.6 billion 时则偏高。
