      - - Doctolib
        - Germany pages cite 29k clinicians and 1.9m bookings/month; premium list prices published
        - Ambulatory practices, MVZs, clinics
        - Booking, reminders, intake, docs, billing, AI assistants, messaging
        - Deep workflow breadth plus patient-demand flywheel
        - Premium pricing and French antitrust constraints on tying/exclusivity
      - - Docplanner / MioDottore
        - 13 countries; 25m monthly appointments; 100m monthly patient visits; 300k active doctors
        - Private practices and clinics across multiple countries
        - Patient marketplace plus doctor and clinic software
        - Closest cross-border two-sided analogue to Doctolib
        - Local execution fragmented across brands and countries
      - - Maiia / Cegedim
        - Cegedim-backed stack; interoperability with software used by 100k professionals
        - French doctors, paramedicals, pharmacists, territorial care orgs
        - Agenda, teleconsultation, messaging, prescribing links, cabinet software
        - Installed-base distribution and local workflow fit in France
        - Limited pan-European reach; public pricing not transparent
      - - Jameda
        - 411k clinicians; 1m bookable appointments; 100k video consults; 3.1m reviews in Germany
        - German doctors seeking visibility plus practice tools
        - Marketplace, reviews, online booking, calendar, video, AI notes
        - Strong German discovery brand with freemium entry
        - Germany-centric and visibility-led monetization
      - - CGM CLICKDOC
        - Parent at €1.213bn 2025 revenue; 8,700+ employees; 19-country office base
        - Practices, hospitals, pharmacies already near CGM stack
        - Video consults and broader cloud/platform workflow upsell
        - Incumbent health-IT distribution and compliance posture
        - Weak public evidence of large consumer demand layer
      - - Doctena
        - 10k+ active professionals; 14k+ reviews averaging 4.8/5
        - Solo and group practices needing online booking and visibility
        - Booking, reminders, waiting lists, voice assistant, optional video
        - Lower commitment and easier coexistence with existing systems
        - Narrower workflow depth and smaller demand flywheel
      - - Livi / Kry
        - 14m appointments and 5k+ HCPs on Livi; 3,000+ clinicians and 14+m appointments on Kry tech
        - Payers, governments, GP practices, hybrid clinics
        - Digital consultations, triage, clinician stack, operating software
        - Wins through care capacity and payer/public channel access
        - Not a direct private-practice marketplace replacement
      - - eConsult / NHS digital front door
        - 1,400+ NHS GP practices live; tied to GP-contract digital-access requirements
        - UK primary care and mandate-driven access workflows
        - Online consultation, triage, Smart Inbox, NHS App integration
        - Policy alignment and clinical-system integration
        - UK-specific and not a pan-European marketplace
      - - Internal build / legacy PMS + receptionist
        - No single vendor; persists inside existing local workflows
        - Practices unwilling to re-platform
        - Phone triage, local calendar, incumbent software, manual admin
        - No migration project and no incremental SaaS spend
        - High admin burden and weak patient self-service experience
