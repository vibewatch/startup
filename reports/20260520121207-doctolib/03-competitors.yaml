  - id: adjacent-substitutes-and-status-quo
    title: Adjacents and status quo constrain the market even when they do not look like classic peers
    body: |-
      Doctolib does not only compete against other booking marketplaces. Livi, Kry, and eConsult show how budget can move toward care-delivery capacity, payer partnerships, or digital-access compliance rather than toward a classic private-practice software purchase. Livi describes itself as Europe’s largest digital-first healthcare provider with 14 million patient appointments and more than 5,000 healthcare professionals, while its partner hub is built for ICSs, ICBs, GP practices, insurers, and employers. Kry’s technology stack goes further than a visit app into clinician records and operating software, and it highlights national-medicines-list integration plus strong security posture. eConsult is even more clearly a substitute for some buyers: it says it is live in more than 1,400 NHS GP practices and that UK policy now requires online tools to stay open during core hours, respond quickly, and integrate with the NHS App and clinical systems.

      These adjacencies matter because they reduce the odds that one pan-European ambulatory-access platform takes everything. A practice can keep a legacy cabinet system, add a lighter booking layer, and outsource digital-demand overflow or triage to a payer or NHS-aligned tool. The buyer’s real status quo is therefore broader than “another booking app”: it is receptionist labor, incumbent software, national digital rails, and care-delivery platforms that solve access without adopting Doctolib’s full workflow bundle.

      That dynamic favors category specialists in narrow use cases, even if none individually matches Doctolib’s full product stack.
