callouts:
  - calloutType: insight
    title: The hardest competitor is not one company but whichever class matches the buyer’s starting point
    body: If a practice starts from consumer demand capture, Docplanner/Jameda is the natural alternative. If it starts from an installed software stack, Maiia/Cegedim or CGM is more dangerous. If it starts from public or payer access obligations, Livi, Kry, and eConsult matter more. That makes country and segment context more predictive than any single Europe-wide share table.
    claimRefs:
      - CP036
      - CP037
      - CP041
      - CP042
  - calloutType: risk
    title: Doctolib’s best moat mechanic is now also its clearest regulatory vulnerability
    body: The company still benefits when booking, teleconsultation, patient communication, and workflow live in one system. But the French authority has already said exclusivity, tying, and the MonDocteur acquisition crossed the line into foreclosure. Future moat durability therefore depends on winning with better interoperability, trust, and workflow proof — not on forcing the stack to move as one unit.
