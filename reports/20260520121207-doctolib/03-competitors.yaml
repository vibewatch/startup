  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: realized-pricing-and-discounting
      missingEvidence: Negotiated enterprise contract terms, actual discounting, seat counts, and bundle attach rates for Doctolib, Maiia, CGM, Livi, and eConsult are not public.
      whyItMatters: List pricing overstates buyer certainty and can misstate whether Doctolib truly prices at a premium after discounts or whether incumbents buy share with bundling.
      diligencePath: Request recent signed order forms, renewal decks, discount policies, and win-loss analyses for at least France, Germany, and Italy.
      relatedQuestionRefs:
        - QP027
      relatedTableRefs:
        - TP003
    - type: private-evidence-only
      severity: material
      topic: churn-multi-homing-and-migration-friction
      missingEvidence: Public sources do not disclose churn, multi-homing rates, migration duration, data-portability success, or win-back rates by competitor class.
      whyItMatters: The core underwriting question is whether marketplace and workflow lock-in are truly durable or merely expensive to replicate; public claims do not show actual switching behavior.
      diligencePath: Obtain cohort retention, logo churn, migration project data, integration failure logs, and practitioner surveys segmented by country and specialty.
      relatedQuestionRefs:
        - QP028
