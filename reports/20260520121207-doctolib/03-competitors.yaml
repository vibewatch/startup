  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Moat claim
      - Threat
      - Severity
      - Evidence
      - Mitigation / diligence ask
    rows:
      - - Patient-demand flywheel around search and booking
        - Docplanner/Jameda local brands can capture the same demand pool with their own reviews and discovery surfaces
        - High
        - Docplanner cites 25m monthly appointments and Jameda lists 411k clinicians with 3.1m reviews
        - Measure country-level patient acquisition cost, branded search share, and conversion by channel
      - - Integrated workflow depth beyond scheduling
        - Maiia and CGM can bundle access features into already-installed workflow software
        - High
        - Maiia interoperates with Cegedim software used by 100k professionals and CGM is a €1.213bn health-IT incumbent
        - Request win-loss data for practices already using Cegedim or CGM core systems
      - - Premium monetization from all-in-one suite
        - Freemium or low-cost booking tools can commoditize the front door for simpler practices
        - Medium
        - Jameda starts at €0 and Doctena at €29 while Doctolib light starts at €139
        - Segment the market by workflow complexity and willingness to re-platform, not by headline doctor count alone
      - - Care continuity and digital-access relevance
        - Telehealth adjacents can win budget through payers, public systems, or employer contracts
        - Medium
        - Livi targets ICSs/ICBs/insurers and eConsult aligns to NHS digital-access mandates
        - Map channel overlap between private-practice SaaS budgets and payer or public procurement budgets
      - - Network effects and coupled product design
        - Exclusivity, tying, and anti-allotment behavior can turn product coupling into a competition-law vulnerability
        - High
        - French authority sanctioned exclusivity clauses, tied sales, and the MonDocteur acquisition
        - Review current contract language, interoperability policies, and appeal strategy before underwriting moat durability
      - - Trust, AI, and interoperability posture
        - European buyers increasingly test vendor claims on cyber, AI accountability, and data exchange rather than traffic alone
        - Medium
        - Black Book says 2026 buyers want evidence of interoperability, cybersecurity, and workflow fit
        - Demand product-level proof on integrations, AI governance, exportability, and security operations by country
    notes: 'Severity is qualitative and forward-looking: High means the issue can directly compress pricing power or expansion; Medium means it can narrow parts of the market without necessarily breaking the entire thesis.'
