    - Strategic adjacency and compliance gate
  - - Status quo and incumbent substitutes
    - Phone calls, secretaries, local practice software, incumbent scheduling or teleconsult tools
    - Broad digital-health categories with no workflow overlap
    - Existing practice budgets and labour time
    - Main source of displacement and switching friction
