  rows:
  - - Patient booking marketplace
    - Doctor discovery, slot search, patient self-booking, reminders
    - Clinical record, billing engine, payer reimbursement
    - Patient uses it; provider monetises through subscription-funded workflow stack
    - Core entry point and demand-capture layer
  - - Provider workflow subscription software
    - Booking management, patient communication, notes, care coordination, admin tooling
    - Hospital ERP, full acute-care EMR, insurer claims systems
    - Ambulatory physician, practice owner, or group practice budget
    - Current monetisation core
  - - Teleconsultation technology layer
    - Video consult workflow, patient routing, scheduling tie-in, consultation support
    - The reimbursed medical act itself and broader remote-monitoring devices
    - Provider buys software; payer reimburses clinical episode where rules allow
    - Core-adjacent growth layer
  - - Health-data interoperability / EHR rails
    - ePA, EHDS, FSE 2.0, compliant data exchange and record access
    - Pharma R&D data markets and non-care secondary-use monetisation
