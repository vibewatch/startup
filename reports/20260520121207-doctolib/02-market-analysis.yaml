- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - French teleconsultation normalization after Covid
    - Positive
    - 2024-2026
    - Demand persisted after the pandemic, so remote care remains an adoption tailwind rather than a one-off bubble.
    - Track whether 2025-2026 volume growth remains double-digit.
  - - Provider-paid subscription core
    - Mixed
    - Current
    - Clear monetization model today, but limits direct exposure to payer-funded digital-health spend.
    - Request country-level price architecture and attach-rate data.
  - - HDS / CNIL compliance burden
    - Mixed
    - Current
    - Raises trust and incumbent defensibility, but also increases cost and slows entrants or feature launches.
    - Confirm Doctolib’s current certification stack and renewal calendar.
  - - EHDS interoperability push
    - Positive with execution risk
    - 2025-2031
    - Creates a larger compliant digital-health market but may reduce proprietary lock-in if portability becomes easier.
    - Model compliance capex and any interoperability-led margin compression.
  - - Germany ePA and digitalisation agenda
    - Positive with sales friction
    - 2025-2027
    - Improves infrastructure pull for integrated vendors, but demands localisation into higher-maturity workflows.
    - Request Germany conversion, retention, and package-mix cohorts.
  - - Italy FSE 2.0 and low consumer habit
    - Constraining
    - 2025-2026
    - Requires both technical integration and demand education, slowing monetization versus France.
    - Clarify Italy CAC, churn, and public/private channel mix.
  - - B2B integration cost and IT skill gaps
    - Negative
    - Current
    - Large practices and smaller clinics alike can defer software upgrades if implementation cost feels too high.
    - Quantify onboarding cost, time-to-go-live, and implementation payback.
  - - Antitrust and foreclosure scrutiny
    - Negative
    - Current
    - Could limit price-power or bundling flexibility in Doctolib’s strongest market even while growth continues.
    - Monitor appeal outcome and any conduct remedies affecting bundling or interoperability.
  notes: Rows combine market-growth catalysts with the country-specific frictions most likely to slow conversion from broad
    digital-health demand into Doctolib-style recurring software revenue.
