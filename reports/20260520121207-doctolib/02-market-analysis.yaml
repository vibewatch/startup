- id: growth-drivers-regulation-and-frictions
  title: Growth drivers are real, but regulation and workflow friction slow conversion
  body: |-
    The strongest growth driver is not generic digitisation rhetoric but concrete access and workflow pressure. France's 13.9 million teleconsultations in 2024, up almost 20% year on year after the post-pandemic pullback, show that remote care has not disappeared; it has normalized into a persistent care-delivery channel. IQVIA reinforces the same point from a wider lens, arguing that digital health is moving beyond consumer wellness apps toward provider-facing diagnostics, decision support, remote monitoring, and AI-assisted platforms. That matters for Doctolib because its product direction is increasingly provider productivity and care coordination, not just appointment search.

    Regulation is simultaneously a driver and a tax. HDS and CNIL make health-data handling a high-trust domain in France; EHDS creates a European interoperability and single-market push; Germany's ePA rollout makes integration into national rails unavoidable; and Italy's FSE 2.0 work tightens architectural expectations. These shifts can widen the market for compliant incumbents, but they also raise switching costs, legal spend, and technical integration burden.

    Adoption friction therefore remains stubborn. MarketsandMarkets highlights B2B integration cost, limited IT capability, and behavioural reluctance as structural restraints, while Sifted adds country-specific friction: Germany required localisation into larger-practice workflows, and Italy still needs physician evangelisation and consumer-habit formation. The practical implication is that the market is growing, but conversion speed is country-specific and operationally expensive.
