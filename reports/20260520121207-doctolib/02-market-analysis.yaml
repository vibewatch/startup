  evidenceGaps:
  - type: missing-source
    severity: material
    topic: country-denominator-sam
    missingEvidence: A stable, machine-readable and current practitioner denominator for France and Germany that can be retained
      directly from public institutional pages in this run.
    whyItMatters: It would let the chapter convert today's monetized footprint into a cleaner country-by-country SAM instead
      of relying on ARR mix and qualitative adoption evidence.
    diligencePath: Pull direct 2025-2026 physician census tables from CNOM and KBV publications or management-provided country
      denominator decks, then rebuild the sizing table.
    relatedQuestionRefs:
    - QM010
    - QM016
    relatedTableRefs:
    - TM002
  - type: access-blocked
    severity: material
    topic: italy-telemedicine-guidance
    missingEvidence: A readable retained copy of Italy's national telemedicine guidance and any current procurement guidance
      for private platforms interacting with public access channels.
    whyItMatters: Italy is the least transparent of Doctolib's three core operating markets in public materials, which weakens
      payer-structure confidence.
    diligencePath: Fetch the ministerial guidance via a stable PDF or archive snapshot, then add procurement and reimbursement
      citations from AGENAS or regional health authorities.
    relatedQuestionRefs:
    - QM017
    - QM019
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: material
    topic: country-arpu-and-packaging
    missingEvidence: Current country-by-country package pricing, attach rates, and gross-to-net revenue per practitioner for
      France, Germany, and Italy.
    whyItMatters: Without package-level pricing, the chapter can estimate the installed monetized base but cannot produce
      a robust bottom-up SAM by segment and package tier.
    diligencePath: Request current price lists, contract templates, and cohort-level revenue bridges from management or channel
      partners.
    relatedQuestionRefs:
    - QM005
    - QM019
    - QM028
    relatedTableRefs:
    - TM002
    - TM003
  - type: conflicting-data
    severity: material
    topic: antitrust-remedy-impact
    missingEvidence: A final view of whether the French antitrust case will lead only to a fine or also to interoperability,
      conduct, or pricing remedies after appeal.
    whyItMatters: The remedy scope could materially alter pricing power and competitive entry barriers in Doctolib's core
      French market.
    diligencePath: Monitor the appeal docket, management disclosures, and any follow-on remedy notices from the Autorité de
      la concurrence.
