- id: substitutes-status-quo-and-contradictory-estimates
  title: Substitutes include status quo workflows, incumbent software, and care-delivery platforms
  body: |-
    The substitute set is wider than “other booking apps.” Patients can still call a receptionist, clinics can rely on legacy practice software plus human admin labour, and public digital-health infrastructure can absorb part of the data and access workflow over time. On top of that sit direct European substitutes. Docplanner represents the closest pan-European two-sided marketplace analogue, Maiia shows that France already has a local software-and-teleconsult rival, and Kry/Livi show that teleconsultation competition can come from care-delivery brands rather than pure workflow software vendors.

    The French antitrust case makes that substitute discussion financially material. The Autorité defined separate markets for online appointment booking and remote medical consultation technology solutions, then said Doctolib abused a dominant position through exclusivity, tying, and the MonDocteur acquisition. O'Melveny's summary goes further by framing the case as foreclosure in a still-evolving market. That is the clearest public evidence that Doctolib's French core can no longer be analysed only as a winner-take-most growth story; it must also be analysed as a potentially regulated bottleneck.

    This is also why published market estimates seem to conflict. Broad digital-health TAMs and telehealth market reports are useful directional signals, but they do not describe the same competitive battleground as the French booking-and-teleconsultation markets named by the authority. Investors should therefore read market size here as a range of boundaries, not a single clean number.
