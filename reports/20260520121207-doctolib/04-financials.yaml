- id: sales-motion-and-efficiency-proxies
  title: Sales motion and efficiency proxies
  body: 'The official product pages suggest a land-and-expand sales motion built around practitioner workflow pain rather than a low-friction self-serve marketplace. Doctolib repeatedly sells the system as one integrated operating layer spanning scheduling, digital reception, patient communication, teleconsultation, documentation, billing, payments, and AI assistants. That creates a commercial argument centered on labor savings, fuller calendars, fewer no-shows, and higher collection efficiency. The public proxies are directional but useful: the patient-acquisition page says the platform reaches more than 25 million German patients, while the digital-reception and communication pages promise automated reminders, waitlists, 24/7 phone handling, and lower call or email volume. Those are GTM efficiency indicators because they tell a prospective practice where the ROI story starts. What is missing is equally important. No reviewed public source disclosed CAC, payback, retention, or churn, and
    no public evidence isolates attach rates for AI assistants, teleconsultation, or payments. That means investors can see the product logic for expansion but not the sales productivity, renewal economics, or cohort durability that would turn a persuasive commercial story into an underwritten revenue engine.'
  claimRefs:
