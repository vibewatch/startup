- id: financial-verdict
  title: Financial verdict
  body: 'The investable part of Doctolib''s financial case is real: the company has meaningful scale, a high-quality subscription-led revenue base, transparent list pricing, and a visible product path from booking into deeper workflow monetization. The risky part is also real: public evidence still does not tell investors what the gross-margin structure looks like, whether customer economics are attractive after sales spend, how much debt remains from the mixed 2022 financing, or how much runway is left if AI investment and international expansion continue at the current pace. The 2025 French antitrust sanction also matters financially because it strikes directly at the commercial habit of tying teleconsultation and booking into one bundle. That does not erase Doctolib''s pricing power, but it reduces confidence that the next leg of ARPU expansion will be frictionless. Netting those factors together, the financial verdict is favorable on revenue quality, cautious on margin path, and incomplete
    on capital adequacy. A disciplined investor should treat Doctolib as a strong subscription platform with improving but still partially opaque economics, and should make cash, debt, margin, retention, and realized-pricing disclosure the gating asks before underwriting any fresh primary financing.'
