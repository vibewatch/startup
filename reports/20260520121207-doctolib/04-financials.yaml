  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Cash balance, monthly burn, minimum liquidity target, and board runway plan.
    whyItMatters: A shrinking loss line is not enough to assess capital adequacy without actual liquidity and burn visibility.
    diligencePath: Request the latest monthly management accounts, cash bridge, and 12- to 18-month runway model from finance.
    relatedQuestionRefs:
    - QI020
    - QI026
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: debt-terms
    missingEvidence: Current debt balances, lender names, maturity ladder, covenants, guarantees, and security package.
    whyItMatters: The 2022 raise included debt, but hidden leverage or covenant triggers could change downside risk and financing needs.
    diligencePath: Request debt schedules, facility agreements, covenant calculations, and any board materials on refinancing risk.
    relatedQuestionRefs:
    - QI019
    - QI021
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Gross margin by product and country, including hosting, support, teleconsultation, payment, and onboarding cost buckets.
    whyItMatters: Margin path determines whether ARR growth converts into durable free cash flow or stays subsidy-dependent.
    diligencePath: Request a gross-margin bridge by module, country, and customer cohort for 2024, 2025 YTD, and budget.
    relatedQuestionRefs:
    - QI014
    - QI028
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: retention-cac
    missingEvidence: Gross retention, net revenue retention, logo churn, CAC, CAC payback, and expansion ARR by cohort.
    whyItMatters: A provider-SaaS thesis requires evidence that new ARR is not simply replacing churn or bought through uneconomic sales spend.
    diligencePath: Request cohort dashboards by market, package tier, and acquisition channel, plus sales-commission and payback analysis.
    relatedQuestionRefs:
    - QI011
    - QI012
    - QI028
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized ARPU by package, discount policy, volume concessions, and attach rates for AI, teleconsultation, and payments.
    whyItMatters: List prices are public, but realized pricing and module attach drive true revenue quality and pricing power.
    diligencePath: Request booking-to-close pricing waterfalls and package-level revenue by country for the latest four quarters.
    relatedQuestionRefs:
    - QI005
    - QI006
    - QI015
    relatedTableRefs:
    - TI001
    - TI002
    - TI005
  - type: conflicting-data
    severity: minor
    topic: loss-metric-definition
    missingEvidence: A reconciliation showing whether public loss figures refer to EBITDA loss, operating loss, or net loss.
    whyItMatters: Sifted and Forbes are directionally consistent, but they likely refer to different loss definitions and currencies.
    diligencePath: Request audited P&L extracts and management definitions for ARR, revenue, EBITDA, operating loss, and net loss.
    relatedQuestionRefs:
    - QI016
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: financing-trigger
    missingEvidence: Board-approved funding thresholds, profitability target date, and contingency plan if AI or international expansion overruns.
    whyItMatters: Without a documented trigger, investors cannot distinguish between optional liquidity events and a real need for more capital.
    diligencePath: Request board materials on financing strategy, scenario planning, and the current target date for sustained profitability.
    relatedQuestionRefs:
    - QI022
    - QI023
    - QI028
    relatedTableRefs:
    - TI004
    - TI005
