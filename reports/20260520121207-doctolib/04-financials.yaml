- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Cash balance
    - Cannot prove capital adequacy or downside cushion
    - Request latest treasury report and unrestricted cash detail
  - - Monthly burn
    - Cannot translate shrinking losses into cash usage
    - Request monthly cash bridge for the last 18 months
  - - Runway
    - Cannot assess next-round urgency or optionality
    - Request board runway model with base / downside scenarios
  - - Gross margin / contribution margin
    - Cannot test whether subscription ARR is structurally high quality
    - Request margin bridge by module, country, and customer segment
  - - CAC and payback
    - Cannot test whether growth is efficiently purchased
    - Request sales-efficiency dashboard by channel and package
  - - NRR and churn
    - Cannot test whether expansion offsets attrition
    - Request cohort retention tables by geography and tier
  - - Debt balances and covenants
    - Cannot assess hidden leverage risk from 2022 debt component
    - Request all facility agreements and covenant calculations
  - - Realized pricing and discounting
    - Cannot connect list pricing to actual monetization quality
    - Request pricing waterfall and booked ARR by package
  - - Module revenue mix
    - Cannot size teleconsultation, payments, or AI upside separately
    - Request product-line revenue split and attach-rate data
  notes: Every row is a real public disclosure gap that materially limits underwriting despite solid top-line evidence.
