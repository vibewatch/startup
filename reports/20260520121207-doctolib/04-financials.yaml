- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy and financing dependency
  body: 'Doctolib is not a fragile pre-revenue startup, but public evidence still stops short of hard capital underwriting. The company clearly has substantial historical support: €150 million in 2019 and €500 million in 2022, with the latter explicitly described as a mix of equity and debt at a €5.8 billion valuation. Yet none of the reviewed public sources disclosed the debt slice, current debt balance, lender terms, cash balance, or runway. That makes it impossible to determine how much of the improving loss profile comes from operational discipline versus remaining balance-sheet capacity from the 2022 round. Forbes adds an important nuance by describing later secondary activity as shareholder liquidity rather than primary capital, which implies that at least some recent public transaction energy was about employee and early-investor monetization, not replenishing company cash. The chapter verdict therefore cannot be that Doctolib obviously needs money now; it can only be that the available
    public evidence is insufficient to prove that it does not. The shrinking loss line is encouraging, but absent cash, burn, debt, and margin disclosure, financing dependency remains partially hidden rather than disproven.'
  claimRefs:
