company:
  name: Doctolib
chapter:
  number: 4
  title: Financials
  summary: 'Doctolib''s public financial profile is strongest on revenue quality: 2024 ARR reached €348 million, 99% came from professional subscriptions, and official pricing shows a provider-SaaS upsell path from basic scheduling into billing, payments, and AI-enabled workflow modules. Public evidence also shows losses narrowing and heavy R&D investment, but it still does not disclose cash, burn, runway, margins, NRR, CAC, or debt terms, so capital adequacy remains impossible to underwrite from open sources alone. The 2025 French antitrust sanction adds a financial overhang because it challenges exactly the kind of tied workflow expansion that underpins future ARPU growth.'
sections:
- id: revenue-quality-and-pricing
  title: Revenue quality and pricing model
  body: 'Doctolib''s public financial story is unusually clear for a large private European healthtech business on top-line quality and unusually thin on everything below it. The clearest disclosed fact is that 2024 ARR reached €348 million and that 99% of that ARR came from subscriptions paid by healthcare professionals, not from patients or appointment commissions. That matters because it makes Doctolib economically closer to a workflow SaaS platform than to a classic marketplace with take-rate exposure. The patient side remains free and therefore functions as demand generation, retention support, and practitioner acquisition rather than as a billed revenue line. Public pricing reinforces that model: German packages step from a free entry tier to €139, €229, €299, and €475 per doctor per month on annual contracts, with additional onboarding, migration, and AI-assistant fees. Just as important, the pricing page openly says custom bundles, monthly contracts, and volume discounts are available
    on request, so list price cannot be read as realized ARPU. The most attractive lens, therefore, is not headline list price but how effectively Doctolib converts free patient demand and broad workflow coverage into higher-tier provider subscriptions and add-on adoption.'
