companyProfile:
  summary: >-
    Doctolib is a founder-led European digital-health platform founded in 2013 that has expanded from
    online appointment booking into a broader provider workflow stack spanning patient communication,
    teleconsultation, secure messaging, records, billing, and AI assistants. Current public materials
    show a large installed surface of 520,000 health professionals and 90 million people using
    Doctolib technologies, while independent 2025 reporting disclosed €348 million of 2024 ARR,
    22.5% growth, and sharply narrower losses. The company last clearly disclosed a 2022 financing at
    €5.8 billion, but 2026 secondary reporting indicates current price discovery closer to €3.6
    billion with no fresh primary capital injected.
