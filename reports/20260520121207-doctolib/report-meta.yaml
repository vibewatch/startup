summary:
  headline: >-
    Doctolib has real European workflow-platform scale and improving subscription economics, but the
    current ~€3.6B secondary still looks stretched given opaque margins and capital structure plus a
    live French antitrust overhang.
  overallScore: 5.5
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
