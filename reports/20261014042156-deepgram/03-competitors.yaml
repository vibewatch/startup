callouts:
- calloutType: insight
  title: Full-Stack Speech Architecture as a Defensible Unit Economics Advantage
  body: Deepgram's integration of proprietary STT (Nova-3) and TTS (Aura-2/Flux) within a unified Voice Agent runtime creates structural cost and latency advantages over rivals who must bridge disparate vendor APIs. Operating both ends of the speech loop eliminates third-party markup, enabling an aggressive .50 per conversation hour list price that undercuts stitched component architectures.
  claimRefs:
  - CP002
  - CP003
  - CP006
- calloutType: risk
  title: Open-Weights Whisper and Multimodal Speech-to-Speech Encroachment
  body: While Deepgram maintains superior streaming latency and managed infrastructure compared to self-hosted Whisper Large v3, the ubiquity of open weights caps pricing power for commodity batch transcription. Concurrently, frontier lab advancements in direct speech-to-speech multimodal models threaten to collapse the separate STT-LLM-TTS pipeline into end-to-end models over a three-to-five year horizon.
  claimRefs:
  - CP004
  - CP011
  - CP014
