companyProfile:
  summary: >-
    Deepgram is a Delaware-incorporated, San Francisco-headquartered voice AI infrastructure company founded in 2015 by
    Scott Stephenson and Adam Sypniewski. It sells API-first speech-to-text, text-to-speech, and voice-agent products to
    developers, AI platform ISVs, and enterprise buyers, and it now reports 1,300+ organizations and 200,000+ developers
    building on its platform. Publicly available evidence points to strong commercial traction, but the core financial
    denominators needed to fully underwrite the business remain undisclosed.
