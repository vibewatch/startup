evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: Audited financial statements, verified ARR, GAAP gross margins, net revenue retention, and cash burn rate.
    whyItMatters: >-
      Essential to underwrite the $1.3B Series C valuation multiple and assess long-term gross margin viability given
      speech inference compute costs.
    diligencePath: >-
      Request confidential financial disclosures, GAAP income statements, and customer cohort retention tables under
      non-disclosure agreement.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: minor
    topic: capitalization-table
    missingEvidence: >-
      Complete cap-table shareholder register, liquidation preferences, seniority waterfall, and employee option pool
      sizing.
    whyItMatters: Required to evaluate structural downside protections, dilution risk, and common shareholder payout thresholds.
    diligencePath: Review formal cap table, Certificate of Incorporation amendments, and Series C investor rights agreements.
    relatedTableRefs:
      - TO003
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: pricing-and-gross-margin
    missingEvidence: Audited gross margin breakdown across self-hosted enterprise deployments versus cloud API usage.
    whyItMatters: Unit economics for high-volume voice agent streaming determine whether 85%+ gross margin claims hold at scale.
    diligencePath: Request customer-level hosting cost breakdowns and GPU cluster utilization metrics from company management.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: minor
    topic: market-sizing-divergence
    missingEvidence: >-
      Standardized market sizing methodology separating raw transcription API software from end-to-end CCaaS agent
      platforms.
    whyItMatters: >-
      Broad analyst projections conflate $8B STT software with $40B contact center operational spend, inflating apparent
      addressable revenue.
    diligencePath: Review vendor RFP disclosures and client budget allocation line items across IT software vs customer operations.
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing-discounts
    missingEvidence: >-
      Confidential enterprise contract rate cards, volume discount schedules, and gross margin breakdowns across
      self-hosted versus managed cloud runtime deployments.
    whyItMatters: >-
      Reported list pricing (/bin/bash.0043 to /bin/bash.0077/min and .50/hr) establishes a price floor, but realized
      enterprise unit economics and blended gross margins depend on unobservable high-volume discounting.
    diligencePath: >-
      Request customer contract cohort schedules and deployment-level cost of goods sold (COGS) attribution during
      confidential management diligence.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: speech-to-speech-frontier-risk
    missingEvidence: >-
      Multi-tenant benchmark data comparing end-to-end multimodal speech-to-speech model latency against modular Voice
      Agent API turn-taking performance under high concurrency.
    whyItMatters: >-
      Determines whether enterprise developers will continue paying for modular middleware or migrate directly to native
      multimodal foundation models as inference costs decline.
    diligencePath: >-
      Monitor enterprise production bake-offs between Deepgram Voice Agent API and native frontier realtime endpoints
      across telephony network environments.
    relatedQuestionRefs:
      - QP010
  - type: private-evidence-only
    severity: material
    topic: financial-opacity
    missingEvidence: >-
      Audited GAAP income statements, broken-out revenue by product line (STT, TTS, Voice Agent), and verified gross
      margin disclosures.
    whyItMatters: >-
      Current valuation underwriting relies on third-party estimates of $100M ARR and 85%+ gross margins without
      visibility into true compute cost intensity or software vs services mix.
    diligencePath: >-
      Request confidential historical financial statements, GPU hosting invoices, and product-level gross margin
      breakdowns during confirmatory diligence.
    relatedTableRefs:
