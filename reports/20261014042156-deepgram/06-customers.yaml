figures:
  - id: "FU001"
    title: "Customer Adoption and Expansion Lifecycle"
    type: "journey-map"
    summary: "Customer journey progression from developer discovery and evaluation through production deployment, annual commitment, and multi-product voice stack expansion."
    data:
      items:
        - label: "1. Developer Discovery"
          detail: "Developers sign up via self-serve portal with $200 free credit, testing Nova-3 and Flux models via API keys within minutes."
          touchpoints:
            - "Console signup"
            - "API key generation"
            - "$200 free credit allotment"
            - "Documentation & SDKs"
        - label: "2. Prototyping & Benchmarking"
          detail: "Teams evaluate streaming latency, noisy audio accuracy, and per-second billing against Whisper and legacy cloud APIs."
          touchpoints:
            - "WebSocket streaming"
            - "Audio sample testing"
            - "Comparative accuracy evaluation"
            - "Community forums"
        - label: "3. Pay-As-You-Go Production"
          detail: "Early production launch with consumption billing ($0.29-$0.47/hr for Nova/Flux) and automated credit top-up."
          touchpoints:
            - "Production webhook setup"
            - "Per-second consumption billing"
            - "Auto-reload thresholds"
            - "Status monitoring"
        - label: "4. Growth Plan Commitment"
          detail: "Scaling applications upgrade to Growth tier ($4,000/year) to unlock up to 20% discounts and increased WebSocket concurrency limits."
          touchpoints:
            - "Annual commitment contract"
            - "Higher WSS concurrency limits"
            - "Discounted per-hour rates"
            - "Priority support channel"
        - label: "5. Enterprise & Partner Embedding"
          detail: "Major platforms (IBM watsonx, Sierra, Twilio) deploy dedicated VPC or on-premise runtimes with custom model tuning and HIPAA/BAA compliance."
          touchpoints:
            - "Executive sponsor review"
            - "Security & HIPAA BAA execution"
            - "Dedicated VPC / on-prem deployment"
            - "Co-sell partnership"
        - label: "6. Multi-Product Stack Expansion"
          detail: "Customers expand from speech-to-text into Aura-2 text-to-speech, Audio Intelligence, and unified Voice Agent APIs at $4.50/hour."
          touchpoints:
            - "Aura-2 TTS integration"
            - "Voice Agent API unified call"
            - "Audio Intelligence summarization"
            - "Volume renewal discussions"
    claimRefs:
      - "CU012"
      - "CU013"
