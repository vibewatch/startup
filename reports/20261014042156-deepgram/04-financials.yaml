  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-opacity
    missingEvidence: Audited GAAP income statements, broken-out revenue by product line (STT, TTS, Voice Agent), and verified
      gross margin disclosures.
    whyItMatters: Current valuation underwriting relies on third-party estimates of $100M ARR and 85%+ gross margins without
      visibility into true compute cost intensity or software vs services mix.
    diligencePath: Request confidential historical financial statements, GPU hosting invoices, and product-level gross margin
      breakdowns during confirmatory diligence.
