callouts:
- calloutType: insight
  title: Composite Voice Agent Pricing Alters Contract Value Densities
  body: The introduction of the Voice Agent API at $4.50 per hour represents an order-of-magnitude increase in potential monetization
    per conversation compared to standalone speech transcription ($0.26-$0.46 per hour equivalent). By capturing the conversation
    orchestration layer, Deepgram expands its wallet share from passive transcription to mission-critical contact center automation.
  claimRefs:
  - CI004
  - CI005
- calloutType: risk
  title: Private Financial Opacity Blinds Secondary Underwriting
  body: Despite market momentum and third-party ARR estimates of $100M, Deepgram has released no verified audited revenue,
    gross margin, or retention figures. Investors underwriting the $1.3B valuation must bridge substantial diligence gaps
    regarding customer concentration among high-profile AI startups and true realized compute costs.
  claimRefs:
  - CI010
  - CI011
  - CI013
- calloutType: assumption
  title: Sustaining Software Gross Margins on Deep Learning Workloads
  body: Analyst models estimating 85%+ gross margins assume Deepgram proprietary end-to-end model architecture and specialized
    hardware optimizations insulate it from runaway GPU inference costs. If low-latency streaming agent requirements increase
    compute intensity faster than API pricing scales, margins could face downward pressure.
  claimRefs:
  - CI008
  - CI012
