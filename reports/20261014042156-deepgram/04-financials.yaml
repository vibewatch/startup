  - type: missing-source
    severity: material
    topic: underwriting-risk
    missingEvidence: Net revenue retention (NRR) cohorts and customer concentration data detailing revenue shares for top
      accounts including Sierra, Decagon, and Twilio.
    whyItMatters: High reliance on a handful of fast-growing conversational AI platforms could create extreme revenue volatility
      if clients multi-home or negotiate volume compression.
    diligencePath: Obtain an anonymized customer revenue concentration schedule and net retention cohort analysis across trailing
      twelve-month periods.
