company:
  name: "Deepgram"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Deepgram is a San Francisco-based voice AI foundational model company founded in 2015 by University of Michigan physicists Scott Stephenson and Adam Sypniewski. Operating on an API-first end-to-end deep learning architecture, the company has raised over $215 million in lifetime capital, including a $130 million Series C led by AVP at a $1.3 billion valuation in January 2026. While serving more than 1,300 organizations and 200,000 developers across speech-to-text, text-to-speech, and voice agents, Deepgram keeps audited GAAP financials, customer retention, and true gross margins private."
sections:
  - id: "corporate-identity-and-foundations"
    title: "Corporate Identity and Technical Foundations"
    body: "Deepgram, Inc. was incorporated in Delaware in 2015 and maintains its principal executive headquarters in San Francisco, California. The enterprise was founded by Scott Stephenson and Adam Sypniewski, who initially developed deep learning waveform analysis techniques while conducting academic particle astrophysics research on an underground dark matter detector in China. Recognizing that commercial speech recognition remained constrained by legacy hidden Markov models and multi-stage phonetic pipelines, the founders built an end-to-end deep learning architecture that directly transcribes raw audio waveforms into text. Over eleven years of operational scaling, Deepgram has transformed from a dedicated automatic speech recognition provider into a multimodal voice AI platform. Its production suite encompasses speech-to-text via Nova-3, enterprise text-to-speech via Aura-2, conversational turn detection via Flux, and full-duplex speech-to-speech orchestration through its Voice Agent API, serving more than 1,300 commercial organizations and over 200,000 registered developers globally."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO010"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership and Key-Person Structure"
    body: "Deepgram is directed by its original technical co-founders alongside experienced operational executives. Co-founder and Chief Executive Officer Scott Stephenson holds a doctorate in physics from the University of Michigan and serves as the primary strategic voice, evangelizing voice as the definitive human-to-machine interface while directing corporate capitalization and partnership expansion. Co-founder and Chief Technology Officer Adam Sypniewski oversees research and development, deep learning architecture, and an expanding United States patent portfolio covering unified transformer speech recognition and hardware-efficient parallel processing. Operational scaling and administrative execution are managed by Chief Operating Officer Shadi Baqleh, who guides commercial enterprise operations across a remote-first organization spanning more than twenty states and five countries. From a governance and risk posture, Deepgram maintains institutional controls while enforcing standard Terms of Service that require binding individual arbitration seated in San Francisco and exclude class action proceedings."
    claimRefs:
      - "CO002"
      - "CO005"
      - "CO013"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-investor-syndicate"
    title: "Capitalization History and Investor Syndicate"
    body: "Deepgram has raised more than $215 million in cumulative equity capital across seven financing rounds since its graduation from Y Combinator's Winter 2016 accelerator cohort. In January 2026, the company attained unicorn status upon securing a $130 million Series C financing round at a $1.3 billion post-money valuation. The round was led by AVP, an independent European and North American growth investment platform managing over 2.5 billion euros in assets, chosen specifically to accelerate Deepgram's international go-to-market presence. The Series C round demonstrated high existing investor conviction with continued participation from Madrona Venture Group, Alkeon Capital, Tiger Global, Wing, and BlackRock-managed funds. Crucially, the financing also introduced prominent corporate strategic investors—including Twilio, ServiceNow Ventures, SAP, and Citi Ventures—who serve both as capitalization partners and commercial distribution conduits embedding Deepgram's real-time voice APIs into large enterprise software ecosystems."
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO003"
  - id: "commercial-scale-and-operating-milestones"
    title: "Commercial Scale, Unit Economics, and Operational Milestones"
    body: "Deepgram monetizes its foundational speech models through usage-based developer APIs and enterprise volume contracts. Headline transcription pricing is aggressive, with Nova-3 starting at $0.0077 per minute for streaming and $0.0043 per minute for batch audio. However, third-party pricing diligence indicates that essential production add-ons—specifically speaker diarization ($0.002/min) and PII redaction ($0.002/min)—each add 26% to base costs, driving fully-featured enterprise pipeline expenses up to $0.0130 per minute, representing a 69% premium over raw transcription. Commercially, the platform reached an estimated $100 million in annual recurring revenue by August 2026, building upon $21.8 million in reported 2024 revenue. The platform's strategic scope expanded in January 2026 through the acquisition of Y Combinator-backed OfOne, establishing Deepgram for Restaurants to automate quick-service restaurant drive-thru ordering with greater than 95% order containment, supported by HIPAA, SOC 2, and GDPR compliant zero-retention enterprise infrastructure."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO014"
      - "CO015"
    figureRefs:
      - "FO001"
