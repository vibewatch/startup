        title: 展示项
        blocks:
          - type: callout
            title: 从离线转录转向流式语音代理的结构性变化
            body: 语音 AI 支出正从事后音频转录转向亚秒级交互式语音代理基础设施，竞争优势也由通用词汇量转向低延迟轮转和对话上下文。
            calloutType: insight
            claimRefs:
              - CM002
              - CM009
          - type: callout
            title: 医疗和受监管音频中的企业采购瓶颈
            body: 受监管细分市场的潜在付费意愿虽然很高，但医疗数据泄露平均 $10.93M 的责任成本带来严格的安全审查；缺少私有部署或 HIPAA 合规认证，会立即卡住企业采购。
            calloutType: risk
            claimRefs:
