      - number: '3.4'
        title: 定价、产品打包与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              Deepgram 采用激进的量导向定价，在转录和对话式语音两个层级都形成竞争压力。Pay-as-you-go 方案中，批量音频价格为 /bin/bash.0043 / 分钟，流式音频为
              /bin/bash.0077 / 分钟，明显低于 Google Cloud 和 Microsoft Azure 每分钟 /bin/bash.0160 至 /bin/bash.0240 的目录价。其统一 Voice
