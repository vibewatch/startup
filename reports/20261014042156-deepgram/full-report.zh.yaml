      - number: '2.3'
        title: 买家分层、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              企业和开发者采用分为三个客户群，采购逻辑各不相同。开发者和 AI 原生层包括构建对话代理、自动会议摘要和客服机器人的产品工程师，通常通过按使用量计费的自助 Pay As You Go
              方案接入。中型及成长型软件公司会升级到年度 Growth 合同，起价为每年
              $4,000，资金来自部门工程预算。企业层买家包括联络中心高管、首席信息官和运营负责人，他们要走正式供应商采购流程。企业买家重视定制词汇准确率、多租户安全和专用吞吐量保障。收购餐厅得来速平台 OfOne
              把公司推向垂直企业工作流，也把买家画像延伸到希望直接降低劳动力成本的零售和快餐运营高管。
            claimRefs:
              - CM006
              - CM010
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM013
      - number: '2.4'
        title: 采用驱动因素、监管瓶颈与尽调风险
        blocks:
          - type: paragraph
            body: >-
              市场扩张由企业对类人语音代理的需求推动；这类代理需要亚秒级延迟和自然的对话轮转，而传统大型云厂商的语音引擎往往难以做到。但企业合规、安全治理和切换壁垒，正显著拖慢采用速度。医疗和金融服务等强监管行业面临严格的数据隐私门槛；医疗数据泄露平均每起造成
              $10.93 million 损失，因此企业在把敏感音频送入云端之前，要求严格的 HIPAA、SOC 2 和 GDPR 保障。旧式电话系统集成和供应商锁定也会增加运营摩擦、拉长销售周期。投资尽调的关键缺口仍是：云
              API 量级业务与私有或本地部署之间，缺少披露的单位经济和经审计毛利率。
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM012
