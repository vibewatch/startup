figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Deepgram 创始研究、风险融资轮次、基础模型发布和公司收购的时间脉络。
    approximationNotes: 里程碑日期反映公开新闻公告和平台发布通知。
    claimRefs:
      - CO001
      - CO002
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO014
    data:
      items:
        - label: 创始波形研究
          date: '2015-06-01'
          detail: Scott Stephenson 和 Adam Sypniewski 在 University of Michigan 开展机器学习波形研究，研究源自暗物质探测器实验。
          tone: neutral
        - label: Y Combinator 加速器（W16）
          date: '2016-01-01'
          detail: Deepgram 加入 Y Combinator 2016 年冬季批次，致力于为语音识别打造端到端深度学习架构。
          tone: positive
        - label: Series B 扩展融资（$47M）
          date: '2022-11-29'
          detail: 由 Alkeon Capital 和 Madrona 领投，筹集 $47M Series B 扩展轮，以扩大企业语音基础设施。
          tone: positive
        - label: Aura 企业 TTS 平台发布
          date: '2024-03-12'
          detail: 发布 Aura 文本转语音模型，从纯转录扩展到全双工语音生成，延迟低于 200ms。
          tone: positive
        - label: Voice Agent API 部署
          date: '2025-06-15'
          detail: 发布统一 Voice Agent API，将 STT、LLM 编排和 TTS 结合，为实时对话代理提供 $4.50/小时的服务。
          tone: positive
        - label: 标准企业合规架构
          date: '2025-11-19'
          detail: 发布经过生产环境验证的零留存合规架构，符合 HIPAA、SOC 2 和 GDPR 标准。
          tone: positive
        - label: Series C 独角兽融资（$130M，估值 $1.3B）
          date: '2026-01-13'
          detail: AVP 领投 $130M Series C，估值 $1.3B，BlackRock、Twilio、ServiceNow Ventures 和 Citi Ventures 跟投。
          tone: positive
        - label: 收购 OfOne 与 QSR 自动化
          date: '2026-01-13'
          detail: 收购 YC 支持的 OfOne，为 Deepgram for Restaurants 打下基础，并将实时 AI 得来速点单的覆盖率扩大到 95% 以上。
          tone: positive
        - label: 企业服务条款更新
          date: '2026-08-06'
          detail: 修订企业服务条款，确立个别仲裁以及以加州旧金山为管辖地的法律。
          tone: neutral
  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 从整体联络中心自动化，到实时语音代理 SAM 和当前运行率 SOM 的可服务市场分层。
    data:
      items:
        - label: 联络中心与对话式服务总 TAM
          value: 40000
          unit: USD M
          detail: 全球联络中心软件和对话式自动化市场
        - label: 文本转语音市场（2029 年预测）
          value: 10000
          unit: USD M
          detail: 预计全球 TTS 合成语音市场将以 19.1% CAGR 扩张
        - label: 语音转文本 API 市场（2030 年预测）
          value: 8300
          unit: USD M
          detail: 预计全球语音转文本 API 基础设施将以 14.1% CAGR 增长
        - label: 医疗与受监管语音垂直市场（2027 年预测）
          value: 4890
          unit: USD M
          detail: 专业临床转录和符合 HIPAA 的文档支出
        - label: 实时语音代理与流式 API SAM
          value: 2000
          unit: USD M
          detail: 估算的低于 200ms 对话式语音 API 即时可服务市场
        - label: Deepgram 实时运行率 SOM
          value: 100
          unit: USD M
          detail: Sacra 估算的 2026 年 8 月 ARR 里程碑，覆盖 1,300 多家企业客户
    approximationNotes: 市场分层综合 Sacra 市场预测、分析师预测和 Deepgram 披露的客户增长基准。
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM011
      - CM014
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 从语音 AI 技术栈集成广度和部署自主性两个维度，与商品化云服务和开源模型进行战略定位比较。
    approximationNotes: 坐标分数是有证据支持的序数坐标（1 至 10），评估架构广度（第一方 STT、TTS 和代理运行时）与部署主权（本地部署、私有云和自托管经济性）。
    data:
      points:
        - label: Deepgram
          x: 8.5
          'y': 8.5
          quadrant: 1
          description: 全栈语音 AI（Nova-3 STT + Aura-2/Flux TTS + Agent API），支持本地部署 / VPC 运行时。
        - label: AssemblyAI
          x: 6
          'y': 4.5
          quadrant: 4
          description: 面向开发者的 STT 专业厂商，配备 LeMUR 音频智能；仅支持云端，不提供第一方 TTS。
        - label: Speechmatics
          x: 5
          'y': 7.5
          quadrant: 2
          description: 擅长口音和多语言 STT 的领导者，为欧洲企业提供强大的本地部署选项。
        - label: ElevenLabs
          x: 7.5
          'y': 4
          quadrant: 4
          description: 表现力强的 TTS 和对话式 AI 领导者；云端优先，同时具备次要的语音转文本能力。
        - label: OpenAI（Whisper / Realtime）
          x: 7
          'y': 6.5
          quadrant: 2
          description: 开放权重 Whisper 提供最高的部署自主性；Realtime API 提供集成式多模态云端体验。
        - label: 超大规模云服务商（GCP / Azure / AWS）
          x: 6.5
          'y': 5
          quadrant: 4
          description: 覆盖多种服务的广泛云产品目录，将商品化语音 API 打包进更广泛的企业云协议。
    claimRefs:
      - CP001
      - CP002
      - CP006
      - CP008
      - CP013
      - CP014
  - id: FI001
    title: Deepgram Voice AI 商业转化与利润流
    type: flow
    summary: 展示原始企业对话量如何经 API 编排转化为毛利的结构化流程。
    data:
      nodes:
        - label: 企业语音流量接入
          detail: 从 1,300 多家客户组织和开发者处接入超过 50,000 个音频年、1 万亿个词。
        - label: 统一 API 处理
          detail: 通过端到端深度学习模型执行，包括 Nova-3 STT、Flux TTS 和 Voice Agent 运行时。
        - label: 多层计量架构
          detail: 转录按分钟计费（$0.0043-$0.0077/分钟），对话代理按小时计费（$4.50/小时）。
        - label: 合同变现层
          detail: 收入来自按用量自动充值、Growth 预付款（$4K+/年）和 Enterprise 合同（$15K+/年）。
        - label: 基础设施与模型服务成本
          detail: GPU 计算、数据中心托管、模型推理延迟优化和合规协议。
        - label: 毛利率与现金实现
          detail: 预计毛利率超过 85%；随着规模扩大，高音频量摊薄模型训练投入后，这部分毛利得以实现。
    approximationNotes: 节点顺序反映运营变现机制；利润率数据是行业估算，不是经审计的 GAAP 披露。
    claimRefs:
      - CI003
      - CI004
      - CI008
      - CI012
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Deepgram 语音 AI 平台从音频接入到部署环境的六层架构栈。
    data:
      layers:
        - label: 客户接入与传输层
          detail: 双向 WebSocket 音频流和 REST 批量接入，配合客户端 SDK
        - label: 对话编排层
          detail: Voice Agent API 协调原生轮次检测、打断处理和 LLM 桥接
        - label: 核心神经模型层
          detail: 专有 Nova-3 STT、Flux 对话模型和 Aura-2 TTS 神经引擎
        - label: 音频智能与分析层
          detail: 说话人分离、自动脱敏、自定义关键词提示和情感分析
        - label: 企业安全与治理层
          detail: HIPAA BAA 边界、SOC 2 Type II 控制，以及按请求选择不用于训练的控制
        - label: 基础设施与部署运行时
          detail: 多区域托管公有云和隔离网络自托管容器化运行时
    approximationNotes: 基于 Deepgram 架构出版物和服务规格提炼的概念性功能分层。
    claimRefs:
      - CE003
      - CE006
      - CE007
      - CE008
      - CE010
      - CE012
  - id: FU001
    title: 客户采用与扩张生命周期
    type: journey-map
    summary: 客户旅程从开发者发现和评估，经过生产部署、年度承诺，扩展到多产品语音技术栈。
    data:
      items:
        - label: 1. 开发者发现
          detail: 开发者通过自助门户注册，获得 $200 免费额度，几分钟内即可用 API 密钥测试 Nova-3 和 Flux 模型。
          touchpoints:
            - 控制台注册
            - 生成 API 密钥
            - 分配 $200 免费额度
            - 文档与 SDK
        - label: 2. 原型开发与基准测试
          detail: 团队针对 Whisper 和旧版云 API，评估流式延迟、噪声音频准确率和按秒计费。
          touchpoints:
            - WebSocket 流式传输
            - 音频样本测试
            - 对比准确率评估
            - 社区论坛
        - label: 3. 按用量付费生产
          detail: 早期生产环境上线，采用按用量计费（Nova/Flux 为 $0.29-$0.47/小时）并自动充值额度。
          touchpoints:
            - 配置生产 Webhook
            - 按秒计费
            - 自动充值阈值
            - 状态监控
        - label: 4. Growth 计划承诺
          detail: 随应用扩张，客户升级到 Growth 层级（$4,000/年），获得最高 20% 折扣和更高的 WebSocket 并发上限。
          touchpoints:
            - 年度承诺合同
            - 更高的 WSS 并发上限
            - 折扣小时费率
            - 优先支持渠道
        - label: 5. 企业与合作伙伴嵌入
          detail: 大型平台（IBM watsonx、Sierra、Twilio）部署专用 VPC 或本地运行时，配合定制模型调优和 HIPAA/BAA 合规。
          touchpoints:
            - 高管赞助人审查
            - 执行安全与 HIPAA BAA
            - 专用 VPC / 本地部署
            - 联合销售合作
        - label: 6. 多产品技术栈扩张
          detail: 客户从语音转文本扩展到 Aura-2 文本转语音、Audio Intelligence 和统一 Voice Agent API，价格为 $4.50/小时。
          touchpoints:
            - Aura-2 TTS 集成
            - 统一调用 Voice Agent API
            - Audio Intelligence 摘要
            - 用量续约讨论
    claimRefs:
      - CU012
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 按可能性、影响、缓解成熟度和剩余暴露，评估核心运营、监管、竞争、合作伙伴和财务风险。
