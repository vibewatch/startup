      - number: '1.2'
        title: 管理层与关键人物结构
        blocks:
          - type: paragraph
            body: >-
              Deepgram 由原有技术联合创始人和经验丰富的运营高管共同领导。联合创始人兼首席执行官 Scott Stephenson
              拥有密歇根大学物理学博士学位，是公司的主要战略发声者；他主张语音是人机交互的终极接口，同时负责公司资本运作和伙伴拓展。联合创始人兼首席技术官 Adam Sypniewski
              负责研发、深度学习架构，以及不断扩大的美国专利组合，专利覆盖统一 Transformer 语音识别和硬件高效并行处理。首席运营官 Shadi Baqleh
              负责运营扩张与行政执行，带领商业企业运营团队；组织采用远程优先模式，覆盖 20 多个州和 5 个国家。从治理和风险角度看，Deepgram
              保持制度化控制，并执行标准服务条款：争议必须在旧金山进行具有约束力的个人仲裁，且排除集体诉讼。
            claimRefs:
