  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与结构分类
        blocks:
          - type: paragraph
            body: >-
              2026
              年商业语音人工智能市场由四类结构鲜明的竞争者构成：独立专业模型实验室、大型云平台供应商、开放权重自托管替代方案，以及前沿多模态基础模型实验室。Deepgram、AssemblyAI、Speechmatics 和
              ElevenLabs 等独立模型实验室专注声学建模和语音处理，主要比拼低延迟、专业领域准确率和开发者 API。Google Cloud Speech-to-Text、Microsoft Azure Speech
              Services 和 Amazon Transcribe 等大型云供应商，则把语音当作基础设施商品，打包进完整企业云协议。OpenAI Whisper Large v3 等开放权重模型，为愿意承担 GPU
              基础设施和推理工程成本的组织提供零许可费替代方案。前沿基础模型实验室通过发布原生语音到语音的多模态模型，正形成新的替代层，把传统语音流水线压缩进单一神经网络。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
