chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与技术基础
        blocks:
          - type: paragraph
            body: >-
              Deepgram, Inc. 于 2015 年在特拉华州注册，并在加利福尼亚州旧金山设有主要执行总部。公司由 Scott Stephenson 和 Adam Sypniewski
              创立；两人最初在中国一座地下暗物质探测器上开展粒子天体物理学研究时，开发了深度学习波形分析技术。他们意识到，商业语音识别仍受传统隐马尔可夫模型和多阶段音系流水线限制，于是构建了端到端深度学习架构，直接把原始音频波形转录成文本。经过
              11 年的运营扩张，Deepgram 已从专注自动语音识别的供应商，转型为多模态语音 AI 平台。其生产套件包括基于 Nova-3 的语音转文本、基于 Aura-2 的企业级文本转语音、基于 Flux
              的对话轮次检测，以及通过 Voice Agent API 实现的全双工语音到语音编排，服务全球 1,300 多家商业组织和超过 200,000 名注册开发者。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO010
