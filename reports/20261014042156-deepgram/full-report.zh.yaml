      - number: '3.2'
        title: 同业画像与架构差异化
        blocks:
          - type: paragraph
            body: >-
              在专业独立供应商中，Deepgram 的架构位置很独特：它同时运营第一方自动语音识别（Nova-3）和第一方语音合成（Aura-2 与 Flux TTS）。直接同业过去通常只专注一种模态：AssemblyAI
              严格聚焦语音转文本，使用 Universal-3 模型和 LeMUR LLM 编排层，并依赖第三方伙伴生成语音；Speechmatics 通过 Ursa
              模型专注多语言转录，在带口音英语和方言稳健性上保持技术领先；ElevenLabs 则从表现力语音克隆切入，再扩展到对话代理。Deepgram 借助统一声学栈快速扩张，到 2026 年中 ARR 运行率估计达到
              00M，并由 30M C 轮融资支持。这一双模态基础使其转录延迟低于 300 毫秒、合成延迟低于 90 毫秒，足以支撑交互式企业语音应用。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP008
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP008
      - number: '3.3'
        title: 能力矩阵与技术取舍
        blocks:
          - type: paragraph
            body: >-
              对企业语音供应商的评估显示，延迟、部署灵活性和对话轮转动态之间存在明显技术取舍。在高吞吐联络中心场景中，Deepgram 的话轮结束转录延迟低于 300 毫秒，优于通常超过 600 毫秒的大型云厂商通用
              API。Deepgram 的 Flux 引擎把对话轮转直接融入声学处理，使语音代理无需外部静音计时器也能处理人类打断。Deepgram 还通过 Enterprise Runtime
              覆盖受监管行业，支持部署到客户虚拟私有云或本地环境，并提供 SOC 2 Type II 和 HIPAA 合规。但独立尽调也提示关键限制：供应商公布的基准测试显示词错误率低 40% 至
              54%，却高度依赖供应商自行选择的评测语料。在非标准声学环境的真实企业部署中，独立评测显示其相对 Speechmatics 和优化后的 Whisper 流水线的性能差距更窄。
