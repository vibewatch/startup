  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类定义与纳入支出
        blocks:
          - type: paragraph
            body: >-
              语音人工智能市场包含多个技术层，覆盖语音识别、语音合成和实时代理编排。Deepgram 将核心市场边界定义为实时开发者
              API：提供自动语音转文本（STT）转录和文本转语音（TTS）生成，而不是面向消费者的打包应用或传统人工转录服务。纳入支出包括 API
              消费额度、自定义语言模型训练、多语言语音识别和流式语音代理流水线基础设施。相反，通用云计算托管、通用大语言模型 token 生成、传统硬件电话 PBX
              系统和人工医疗转录劳动均不计入。平台把转录和合成统一到单一对话式 API 架构中，面向希望消除多供应商语音流水线集成摩擦的软件构建者和企业自动化团队。
            claimRefs:
              - CM001
              - CM002
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM013
      - number: '2.2'
        title: 多重分析视角下的可触达市场测算
        blocks:
          - type: paragraph
            body: >-
              测算可触达机会时，需要分别评估不同市场视角，不能只依赖一个宽泛预测。独立行业研究估计，全球语音转文本 API 市场单独到 2030 年就可能达到 $8.3 billion，复合年增长率为
              14.1%。与此同时，文本转语音合成市场到 2029 年还代表着 $10.0 billion 的机会，年增长率为 19.1%。除单点组件 API 外，Deepgram
              还覆盖更广泛的联络中心和客户服务自动化市场；随着企业用自主语音代理替换传统交互式语音应答树，该市场全球年支出超过 $40 billion。在高合规专业垂直领域，仅医疗语音转录市场到 2027 年就代表 $4.89
              billion 的可触达细分市场。以 2026 年 8 月估计的 $100 million ARR 运行率里程碑衡量，Deepgram 在可服务可触达市场中仍有很大空间。
            claimRefs:
