        - label: Series C 轮估值倍数压缩
          values:
            - text: 中
              tone: medium
            - text: 高
              tone: risk
            - text: 中等
              tone: medium
            - text: 高
              tone: critical
    approximationNotes: 可能性和影响等级反映第三方构建者评估、服务条款约定和市场估值倍数。
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR010
      - CR013
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 将技术差异化和增长规模连接到估值风险及最终跟踪建议的决策路径。
    data:
      nodes:
        - id: scale
          label: 1,300+ 家企业客户与自研 STT/TTS 平台
          description: 超过 200,000 名开发者基于 Nova-3、Aura-2 和 Flux 模型构建产品
        - id: funding
          label: $130M Series C 轮，估值 $1.3B
          description: AVP 领投，ServiceNow、Twilio 和 SAP 战略参与
        - id: extension
          label: 全球布局扩张与设于新加坡的亚太总部
          description: EDBI 领投 Series C 轮追加融资，支持国际增长和企业客户覆盖
        - id: opacity
          label: 严重的财务与 ARR 披露不透明
          description: 第三方估算在 $21.8M、$100M 和 $240M 之间相互冲突，且没有经验证的审计
        - id: risk
          label: Frontier Lab 商品化压力与优先清算权负担
          description: 基础模型供应商带来的价格竞争，加上 $215M+ 的高级优先股堆叠
        - id: decision
          label: 审慎立场：跟踪建议
          description: 在获得数据室访问权限并完成单位经济审计之前，暂不评估增长资本投入
      edges:
        - from: scale
          to: funding
        - from: funding
          to: extension
        - from: extension
          to: opacity
        - from: opacity
          to: risk
        - from: risk
          to: decision
    approximationNotes: 概念性流程图，综合定性优势、量化融资里程碑和尽调决策门槛。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV009
      - CV011
