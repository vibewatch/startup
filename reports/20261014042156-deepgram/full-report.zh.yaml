        - $400M（8.0x ARR）
        - '-69% 估值回撤；严重的下轮融资风险触发高级清算优先权，抹掉初级股权'
    notes: 估值倍数以私营 AI 基础设施融资轮和企业软件可比公司为基准；收入输入反映建模区间。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV008
      - CV011
