      - number: '1.3'
        title: 资本化历程与投资人阵容
        blocks:
          - type: paragraph
            body: >-
              自完成 Y Combinator 2016 年冬季批次加速器项目以来，Deepgram 已在 7 轮融资中累计募集超过 $215M 的股权资本。2026 年 1 月，公司以 $1.3B 投后估值完成 $130M
              C 轮融资，跻身独角兽。领投方 AVP 是一家独立的欧美成长型投资平台，管理资产超过 2.5B 欧元；公司选择 AVP，旨在加速国际市场进入。C 轮融资显示现有投资人信心很强，Madrona Venture
              Group、Alkeon Capital、Tiger Global、Wing 和 BlackRock 管理的基金继续参与。更重要的是，本轮还引入 Twilio、ServiceNow Ventures、SAP 和
              Citi Ventures 等知名企业战略投资人；它们既是资本伙伴，也把 Deepgram 的实时语音 API 嵌入大型企业软件生态，成为商业分销渠道。
            claimRefs:
              - CO006
              - CO007
              - CO008
          - type: table
