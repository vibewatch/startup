      - number: '1.4'
        title: 商业规模、单位经济与运营里程碑
        blocks:
          - type: paragraph
            body: >-
              Deepgram 通过按使用量计费的开发者 API 和企业量级合同，将基础语音模型变现。Nova-3 的主打转录价格较为激进：流式音频起价 $0.0077 / 分钟，批量音频为 $0.0043 /
              分钟。但第三方定价尽调显示，生产环境必需的附加功能——说话人分离（$0.002/min）和 PII 脱敏（$0.002/min）——各自会使基础成本增加 26%，将全功能企业流水线成本推高至 $0.0130 /
              分钟，比原始转录贵 69%。商业上，截至 2026 年 8 月，该平台的年度经常性收入估计已达到 1 亿美元，此前 2024 年报告收入为 2,180 万美元。2026 年 1 月收购 Y Combinator
              支持的 OfOne 后，平台战略边界进一步扩大：Deepgram for Restaurants 可自动化快餐店得来速点单，订单自助完成率超过 95%，并由符合 HIPAA、SOC 2 和 GDPR
              的零留存企业基础设施提供支持。
