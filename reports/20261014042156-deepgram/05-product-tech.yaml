callouts:
  - calloutType: "insight"
    title: "Architectural Advantage in Conversational Turn Detection"
    body: "Deepgram native integration of turn-taking detection inside its Flux model addresses the primary point of failure in conversational voice systems. Traditional voice architectures rely on external voice activity detection (VAD) and brittle silence timers that break down when users hesitate or background noise spikes. Embedding conversational state tracking into the speech model itself reduces interruption latency and prevents unnatural speech collisions."
    claimRefs:
      - "CE004"
      - "CE006"
  - calloutType: "risk"
    title: "Language Portfolio Breadth and Add-On Cost Compounding"
    body: "While Deepgram offers superior latency and accuracy in English and core enterprise languages, its coverage of 36 to 40 languages presents a competitive vulnerability against providers supporting over 100 languages for global rollouts. Furthermore, enterprise buyers must model the compound cost of telemetry add-ons: combining diarization, redaction, and keyterm prompting can elevate base per-minute API expenses by more than 100%."
    claimRefs:
      - "CE013"
      - "CE014"
