callouts:
  - calloutType: recommendation
    title: Disciplined Growth Entry Requires Financial Denominators
    body: While Deepgram demonstrates category leadership in low-latency voice AI infrastructure, institutional investors should avoid FOMO underwriting at a $1.3B post-money valuation. Without audited disclosures on gross margins, recurring revenue, and contract churn, the risk-reward profile favors a patient track posture.
    claimRefs:
      - CV001
      - CV003
      - CV011
      - CV014
  - calloutType: risk
    title: Unverified Third-Party ARR Estimates Skew Multiples
    body: Market analysts report wildly divergent revenue estimates for Deepgram, ranging from $21.8M in 2024 to $100M and $240M in 2026. Applying a 5.4x multiple to an unverified $240M figure creates dangerous optical comfort; investors must anchor on verified data room statements.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV008
