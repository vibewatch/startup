callouts:
  - calloutType: "risk"
    title: "Downstream Partner Vertical Integration Risk"
    body: >-
      Deepgram's rapid expansion is heavily propelled by leading AI agent frameworks including Sierra and Decagon. As these agent platforms scale to tens of millions in ARR, their economic incentive to self-host open-source models (such as Whisper or open-weights speech architectures) or build proprietary speech layers grows substantially, presenting a structural customer concentration risk.
