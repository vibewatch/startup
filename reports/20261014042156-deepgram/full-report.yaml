      - number: '1.3'
        title: Capitalization History and Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              Deepgram has raised more than $215 million in cumulative equity capital across seven financing rounds
              since its graduation from Y Combinator's Winter 2016 accelerator cohort. In January 2026, the company
              attained unicorn status upon securing a $130 million Series C financing round at a $1.3 billion post-money
              valuation. The round was led by AVP, an independent European and North American growth investment platform
              managing over 2.5 billion euros in assets, chosen specifically to accelerate Deepgram's international
              go-to-market presence. The Series C round demonstrated high existing investor conviction with continued
              participation from Madrona Venture Group, Alkeon Capital, Tiger Global, Wing, and BlackRock-managed funds.
              Crucially, the financing also introduced prominent corporate strategic investors—including Twilio,
              ServiceNow Ventures, SAP, and Citi Ventures—who serve both as capitalization partners and commercial
              distribution conduits embedding Deepgram's real-time voice APIs into large enterprise software ecosystems.
            claimRefs:
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO008
      - number: '1.4'
        title: Commercial Scale, Unit Economics, and Operational Milestones
        blocks:
          - type: paragraph
            body: >-
              Deepgram monetizes its foundational speech models through usage-based developer APIs and enterprise volume
              contracts. Headline transcription pricing is aggressive, with Nova-3 starting at $0.0077 per minute for
              streaming and $0.0043 per minute for batch audio. However, third-party pricing diligence indicates that
              essential production add-ons—specifically speaker diarization ($0.002/min) and PII redaction
              ($0.002/min)—each add 26% to base costs, driving fully-featured enterprise pipeline expenses up to $0.0130
              per minute, representing a 69% premium over raw transcription. Commercially, the platform reached an
              estimated $100 million in annual recurring revenue by August 2026, building upon $21.8 million in reported
              2024 revenue. The platform's strategic scope expanded in January 2026 through the acquisition of Y
              Combinator-backed OfOne, establishing Deepgram for Restaurants to automate quick-service restaurant
              drive-thru ordering with greater than 95% order containment, supported by HIPAA, SOC 2, and GDPR compliant
              zero-retention enterprise infrastructure.
            claimRefs:
