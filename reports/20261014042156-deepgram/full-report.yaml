          - type: callout
            title: Private Financial Opacity Blinds Secondary Underwriting
            body: >-
              Despite market momentum and third-party ARR estimates of $100M, Deepgram has released no verified audited
              revenue, gross margin, or retention figures. Investors underwriting the $1.3B valuation must bridge
              substantial diligence gaps regarding customer concentration among high-profile AI startups and true
              realized compute costs.
            calloutType: risk
            claimRefs:
              - CI010
              - CI011
              - CI013
          - type: callout
            title: Sustaining Software Gross Margins on Deep Learning Workloads
            body: >-
              Analyst models estimating 85%+ gross margins assume Deepgram proprietary end-to-end model architecture and
              specialized hardware optimizations insulate it from runaway GPU inference costs. If low-latency streaming
              agent requirements increase compute intensity faster than API pricing scales, margins could face downward
              pressure.
            calloutType: assumption
            claimRefs:
