      - number: '7.2'
        title: Regulatory, Privacy, and Legal Exposure
        blocks:
          - type: paragraph
            body: >-
              Voice AI platforms operate under increasingly rigorous data protection, consumer privacy, and biometric
              information regulations across global jurisdictions. Deepgram terms of service strictly prohibit reverse
              engineering of model weights and competitive benchmarking or model training, reflecting aggressive
              intellectual property defense amidst fierce foundation model rivalry. To manage legal disputes and
              mitigate class action exposure, Deepgram mandates individual binding arbitration and class-action waivers
              for resolving customer disputes under California governing law. On the compliance front, healthcare
              compliance deployments require Business Associate Agreements and data protection safeguards to prevent
              costly protected health information breach liabilities. While Deepgram publishes reference architectures
              for HIPAA, SOC 2, and GDPR workloads, enterprise customers bear residual compliance responsibility for
              biometric consent capture and data minimization under regional privacy frameworks.
            claimRefs:
              - CR002
              - CR006
              - CR007
          - type: table
