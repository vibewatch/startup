        title: Cost Structure and Unit Economics Analysis
        blocks:
          - type: paragraph
            body: >-
              Deepgram cost of goods sold (COGS) comprises cloud hosting, specialized GPU compute instances for model
              inference, data center networking, and compliance overhead. Enterprise deployments in regulated industries
              like healthcare and banking mandate stringent adherence to HIPAA, SOC 2, and GDPR standards, necessitating
              dedicated infrastructure partitions and data isolation that add operational delivery expense. Despite
              these capital-intensive inference requirements, independent research from Sacra estimates that Deepgram
              maintains gross margins of 85% or higher, reflecting strong unit economics enabled by proprietary model
              optimization. Sacra further estimates that Deepgram achieved $100 million in annual recurring revenue in
              August 2026, entering 2025 with 115% year-over-year ARR growth as enterprises transitioned toward
              real-time voice agents. However, these metrics remain uncorroborated by audited GAAP financial filings,
              and critical underwriting inputs such as net revenue retention (NRR), customer acquisition cost (CAC)
              payback, and revenue concentration among top voice agent platform accounts remain undisclosed private
              metrics.
