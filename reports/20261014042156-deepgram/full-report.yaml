  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Definitions, and Included Spend
        blocks:
          - type: paragraph
            body: >-
              The voice artificial intelligence market comprises several distinct technology layers spanning speech
              recognition, speech synthesis, and real-time agent orchestration. Deepgram defines its core market
              boundary around real-time developer APIs that deliver automated speech-to-text (STT) transcription and
              text-to-speech (TTS) voice generation, rather than packaged consumer applications or legacy human
              transcription services. Included spend encompasses API consumption credits, custom language model
              training, multi-language speech recognition, and streaming voice agent pipeline infrastructure.
              Conversely, excluded spend includes general cloud compute hosting, generic large language model token
              generation, traditional hardware telephone PBX systems, and manual medical transcription labor. By
              unifying transcription and synthesis under a single conversational API architecture, the platform targets
              software builders and enterprise automation teams seeking to eliminate the integration friction of
              multi-vendor voice pipelines.
            claimRefs:
              - CM001
              - CM002
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM013
      - number: '2.2'
        title: Addressable Market Sizing Across Multiple Analytical Lenses
        blocks:
          - type: paragraph
            body: >-
              Sizing the addressable opportunity requires evaluating distinct market lenses rather than relying on a
              single broad projection. Independent industry research estimates that the global speech-to-text API market
              alone is projected to reach $8.3 billion by 2030, expanding at a 14.1% compound annual growth rate. In
              parallel, the text-to-speech synthesis market represents an additional $10.0 billion opportunity by 2029,
              growing at an annual rate of 19.1%. Beyond discrete component APIs, Deepgram addresses the broader contact
              center and customer service automation landscape, where global spending exceeds $40 billion annually as
              enterprises replace legacy interactive voice response trees with autonomous voice agents. Within
              specialized high-compliance verticals, the medical speech transcription market alone represents a $4.89
              billion addressable segment by 2027. Sizing Deepgram against an estimated August 2026 run-rate milestone
              of $100 million in annual recurring revenue indicates substantial headroom across its serviceable
              addressable market.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM007
              - CM011
