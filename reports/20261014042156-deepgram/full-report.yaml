      - number: '1.2'
        title: Executive Leadership and Key-Person Structure
        blocks:
          - type: paragraph
            body: >-
              Deepgram is directed by its original technical co-founders alongside experienced operational executives.
              Co-founder and Chief Executive Officer Scott Stephenson holds a doctorate in physics from the University
              of Michigan and serves as the primary strategic voice, evangelizing voice as the definitive
              human-to-machine interface while directing corporate capitalization and partnership expansion. Co-founder
              and Chief Technology Officer Adam Sypniewski oversees research and development, deep learning
              architecture, and an expanding United States patent portfolio covering unified transformer speech
              recognition and hardware-efficient parallel processing. Operational scaling and administrative execution
              are managed by Chief Operating Officer Shadi Baqleh, who guides commercial enterprise operations across a
              remote-first organization spanning more than twenty states and five countries. From a governance and risk
              posture, Deepgram maintains institutional controls while enforcing standard Terms of Service that require
              binding individual arbitration seated in San Francisco and exclude class action proceedings.
            claimRefs:
              - CO002
              - CO005
              - CO013
