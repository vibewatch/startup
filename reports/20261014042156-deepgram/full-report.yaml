      - number: '6.4'
        title: Expansion Dynamics, Developer Friction, and Retention Durability
        blocks:
          - type: paragraph
            body: >-
              Customer adoption typically initiates through self-serve developer experimentation and progresses toward
              multi-year enterprise commitments. Developers access $200 in free non-expiring credits and rapid software
              development kit (SDK) integration, allowing teams to benchmark real-time WebSocket streaming in minutes
              before activating Pay-As-You-Go auto-reloading or annual Growth contracts starting at $4,000 per year.
              Enterprise accounts expand consumption from basic speech-to-text into Aura-2 text-to-speech and unified
              Voice Agent APIs priced at $4.50 per hour. However, customer diligence reveals two key headwinds: verified
              reviews note a non-trivial learning curve for advanced features like diarization alongside documentation
              that occasionally lags product releases, and private financial retention indicators—including net revenue
              retention, gross revenue retention, and customer concentration—remain undisclosed.
