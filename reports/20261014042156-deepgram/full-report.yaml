      - number: '4.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Composite Voice Agent Pricing Alters Contract Value Densities
            body: >-
              The introduction of the Voice Agent API at $4.50 per hour represents an order-of-magnitude increase in
              potential monetization per conversation compared to standalone speech transcription ($0.26-$0.46 per hour
              equivalent). By capturing the conversation orchestration layer, Deepgram expands its wallet share from
              passive transcription to mission-critical contact center automation.
            calloutType: insight
            claimRefs:
