        title: Exhibits
        blocks:
          - type: callout
            title: The Structural Shift from Offline Transcription to Streaming Voice Agents
            body: >-
              Voice AI spending is transitioning from retrospective audio transcription toward sub-second interactive
              voice agent infrastructure, shifting competitive advantages from generic vocabulary volume toward
              low-latency turn-taking and conversational context.
            calloutType: insight
            claimRefs:
              - CM002
              - CM009
          - type: callout
            title: Enterprise Procurement Bottlenecks in Healthcare and Regulated Audio
            body: >-
              Despite high potential willingness to pay in regulated segments, the $10.93M average healthcare breach
              liability creates stringent security scrutiny, where lack of private deployment or HIPAA compliance
              certification immediately halts enterprise procurement.
            calloutType: risk
            claimRefs:
