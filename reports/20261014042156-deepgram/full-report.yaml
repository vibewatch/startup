      - number: '6.3'
        title: Named Customer Deployments and Enterprise Production Proof
        blocks:
          - type: paragraph
            body: >-
              Production adoption is corroborated across tier-one enterprise technology leaders and high-growth
              conversational AI providers. In February 2026, IBM announced a strategic partnership selecting Deepgram as
              its first voice partner, embedding Deepgram's speech-to-text and text-to-speech models directly into IBM
              watsonx Orchestrate Agent Builder to power conversational enterprise workflows across global financial and
              healthcare clients. Simultaneously, conversational AI leaders including Sierra and Decagon rely on
              Deepgram's real-time APIs to execute customer-facing voice concierge and agentic workflows, citing
              mission-critical reliability and low latency. Telecommunications giant Twilio embeds Deepgram's streaming
              recognition into live communication channels. These production deployments validate Deepgram's capacity to
              deliver carrier-grade availability and low latency at enterprise scale.
            claimRefs:
