      - number: '8.2'
        title: Financing Context & Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              In January 2026, Deepgram secured $130M in Series C financing led by AVP at a post-money valuation of
              $1.3B, marking a 3.4x step-up from its $379M Series B extension in November 2022. The round attracted top
              institutional backers including Alkeon, Madrona, Tiger Global, and strategic investors such as ServiceNow
              Ventures, Twilio, and SAP, alongside an acquisition of restaurant AI drive-thru specialist OfOne.
              Strategic extension support from Singapore EDBI in August 2026 reinforced its global APAC expansion plans.
              However, with total equity capital raised reaching $215M to $229M across multiple preferred rounds, growth
              equity entry at a headline $1.3B mark demands rigorous entry discipline: public metrics lack audited net
              retention rates, customer concentration breakdowns, and gross margin verification.
            claimRefs:
