      - number: '4.5'
        title: Capital Adequacy, Cash Runway, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Deepgram significantly fortified its balance sheet in January 2026 by securing $130 million in Series C
              financing at a $1.3 billion post-money valuation, led by global tech investment platform AVP alongside
              existing venture backers including Tiger Global, Madrona, In-Q-Tel, BlackRock, and strategic corporate
              investors. Management indicated that proceeds will fund international expansion into Europe and the
              Asia-Pacific region, large-scale compute infrastructure procurement, expanded patent portfolios, and the
              integration of restaurant voice automation startup OfOne. Secondary investment databases report total
              lifetime funding between $215 million and $221 million across multiple rounds, with conflicting
              third-party claims regarding past profitability. From an investment underwriting standpoint, Deepgram
              displays formidable commercial traction and technical positioning as the foundational voice layer for
              next-generation AI agents. Nevertheless, the $1.3 billion valuation represents an aggressive enterprise
              value multiple that cannot be fully underwritten without confirmatory diligence verifying audited ARR,
              gross margins, cash burn rate, and customer churn dynamics.
            claimRefs:
