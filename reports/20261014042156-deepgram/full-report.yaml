              - CV003
              - CV005
              - CV009
              - CV011
      - number: '8.3'
        title: Scenario Analysis & Market Comparables
        blocks:
          - type: paragraph
            body: >-
              Our valuation framework constructs bull, base, and bear scenarios evaluating Deepgram under diverse
              commercial execution trajectories through 2027. Under our base case, assuming $100M ARR modeled by
              independent research tracker Sacra and an expanded voice agent market, Deepgram warrants a 13.0x multiple
              sustaining a $1.3B valuation. The bull scenario projects accelerating voice-first enterprise adoption
              driving $150M ARR at an 18.0x multiple ($2.7B valuation), while the bear case models hyper-competitive
              pricing pressure, model commoditization, and private ARR stalling near $50M, resulting in an 8.0x multiple
              and a 69% valuation repricing down to $400M. Trading multiples across conversational AI peers like
              SoundHound AI and enterprise AI software like C3.ai underscore the market vulnerability of private
              infrastructure multiples when growth moderates.
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
