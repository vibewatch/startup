chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Technical Foundations
        blocks:
          - type: paragraph
            body: >-
              Deepgram, Inc. was incorporated in Delaware in 2015 and maintains its principal executive headquarters in
              San Francisco, California. The enterprise was founded by Scott Stephenson and Adam Sypniewski, who
              initially developed deep learning waveform analysis techniques while conducting academic particle
              astrophysics research on an underground dark matter detector in China. Recognizing that commercial speech
              recognition remained constrained by legacy hidden Markov models and multi-stage phonetic pipelines, the
              founders built an end-to-end deep learning architecture that directly transcribes raw audio waveforms into
              text. Over eleven years of operational scaling, Deepgram has transformed from a dedicated automatic speech
              recognition provider into a multimodal voice AI platform. Its production suite encompasses speech-to-text
              via Nova-3, enterprise text-to-speech via Aura-2, conversational turn detection via Flux, and full-duplex
              speech-to-speech orchestration through its Voice Agent API, serving more than 1,300 commercial
              organizations and over 200,000 registered developers globally.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
