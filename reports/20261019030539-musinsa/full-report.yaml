  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Verified scale supports diligence, but inconsistent valuation references, incomplete terms, and trust risk keep
      the recommendation at track.
    data:
      nodes:
        - id: scale
          label: Scale evidence
          detail: 2022 sales, user, brand, and GMV reports establish a material platform.
        - id: economics
          label: Economics check
          detail: Historical operating profit was thin and current audited segment economics are unavailable.
        - id: valuation
          label: Valuation references
          detail: Historical 2023 marks differ, and the 2026 OTC report supplies a change rather than a complete price.
        - id: comparability
          label: Comparable check
          detail: Available revenue multiples use inconsistent denominators and imperfect peers.
        - id: risk
          label: Risk and terms
          detail: Preference mechanics, trust incidents, and exit execution can change common-equity outcomes.
        - id: decision
          label: Track
          detail: Wait for a verified entry price, audited economics, and security terms.
      edges:
