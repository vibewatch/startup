        title: Exhibits
        blocks:
          - type: callout
            title: Marketplace identity is broader than simple retail
            body: >-
              The strongest official and independent sources consistently portray Musinsa as an ecosystem operator for
              partner brands, not just an apparel storefront, which matters for judging supply-side defensibility and
              later customer-acquisition economics.
