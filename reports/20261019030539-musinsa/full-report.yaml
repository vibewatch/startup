          to: valuation
          label: anchor price
        - from: valuation
          to: comparability
          label: cross-check
        - from: comparability
          to: risk
          label: apply discounts
        - from: risk
          to: decision
          label: set stance
    approximationNotes: >-
      The ordered flow is qualitative and does not assign weights, probabilities, conversion rates, or an implied
      valuation.
