chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and operating model
        blocks:
          - type: paragraph
            body: >-
              Musinsa was founded in 2001 by Cho Man Ho and began as an online sneaker community before expanding into a
              broader fashion commerce and content platform. The public record consistently places the company in Seoul,
              and company-controlled materials now frame Musinsa as a fashion and beauty platform that combines
              marketplace distribution, owned or affiliated channels, creator/content surfaces, and offline experiences.
              That positioning is commercially important because Musinsa is not presenting itself as a single
              storefront; it is presenting itself as infrastructure for partner brands plus a consumer destination,
              which later chapters should treat as the baseline business model.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO008
              - CO009
              - CO010
              - CO011
              - CO014
      - number: '1.2'
        title: Founders, leadership, and governance concentration
        blocks:
          - type: paragraph
            body: >-
              Public leadership disclosure is thin but directionally clear. Founder Cho Man Ho remains the central
              individual in the story: he created the original community, still appears in public leadership references,
              and independent reporting says he owned 52.35 percent of the company in 2025. Mun-il Han is the named CEO
              and has been the public face of the recent seller-first, offline, and international expansion narrative.
              That is enough to identify meaningful key-person concentration, but not enough to clear governance
              diligence: the assigned source pool does not provide a full board roster, committee structure,
              voting-right detail, or a fuller succession bench below the CEO.
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO016
      - number: '1.3'
        title: Funding history, ownership signals, and current scale markers
        blocks:
          - type: paragraph
            body: >-
              Musinsa's latest disclosed private-market anchors point to a late-stage company with meaningful funding
              but still-limited public financial transparency. Tracxn lists $474 million of total funding and a latest
              disclosed Series C round of $190 million in July 2023 at a $2.4 billion valuation. Recent Korean reporting
              adds stronger operating color than the older funding databases: JoongAng reported 670.54 billion won of
              first half 2025 revenue and 58.86 billion won of first half operating profit, while also noting that
              exports were only 0.34 percent of 2024 revenue. Biz Chosun separately described more than 10,000 brands on
              the platform, over 90 billion won of annual brand financing support, and 102.8 billion won of 2024
              operating profit, which together suggest real scale but not a fully investor-ready public disclosure
              package.
            claimRefs:
              - CO005
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO007
              - CO008
              - CO009
              - CO012
      - number: '1.4'
        title: Milestones, expansion, and current watchpoints
        blocks:
          - type: paragraph
            body: >-
              The milestone arc is straightforward: community first, commerce second, then a widening portfolio of owned
              channels, acquisitions, and global distribution. The more important current question is whether the
              expansion story is durable enough to support Musinsa's IPO ambition. Positive recent evidence includes
              stronger Japan traction and continued investment in partner-brand enablement, but adverse evidence also
              matters: repeated seller-quality controversies prompted a zero-tolerance response, AI review promises, and
              possible criminal referrals. For later chapters, the right baseline is a company with genuine momentum and
              ecosystem power, but one still carrying trust, governance, and international-execution risk that cannot be
              hand-waved away by brand count or top-line growth.
            claimRefs:
              - CO003
