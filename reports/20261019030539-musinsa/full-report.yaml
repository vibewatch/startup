              - CE009
              - CE010
              - CE013
      - number: '5.2'
        title: Operating model layers brand enablement onto commerce and omnichannel expansion
        blocks:
          - type: paragraph
            body: |-
              Musinsa’s operating model is most differentiated where commerce is paired
              with services for brands. Public reporting says the company offers
              interest-free production financing, consulting, fit-guide content,
              Creator Marketplace sponsorship, and Partner Stage support across multiple
              properties, which makes the platform look closer to a brand-enablement
              operating system than a pure listing venue. The same logic extends into
              launches and offline/global channels: Musinsa Edition creates exclusive
              drops, Musinsa Drop and Store Seongsu test experiential launches, and
              Musinsa Global plus overseas pop-ups/stores turn online demand into
              cross-border acquisition. The result is a layered product architecture in
              which content, seller tooling, launches, and retail expansion reinforce
              each other, but the public record still does not show which layers carry
              the best unit economics or operational reliability.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
