        - year: 2003
          label: Musinsa.com launched
          detail: Company growth materials list Musinsa.com as the online fashion community milestone.
          claimRefs:
            - CO001
        - year: 2005
          label: Magazine layer added
          detail: Official history lists MUSINSA Magazine as the next major media/content step.
          claimRefs:
            - CO001
        - year: 2009
          label: Store launched
          detail: Official history dates the launch of MUSINSA STORE to 2009.
          claimRefs:
            - CO001
        - year: 2017
          label: Private brand launched
          detail: Official history lists musinsa standard as a 2017 milestone.
          claimRefs:
            - CO001
        - year: 2021
          label: Portfolio broadened
          detail: >-
            Official growth materials list acquisitions of 29CM and StyleShare, while Tracxn records the 2021 Series B
            round.
          claimRefs:
            - CO008
        - date: 2022-09
          label: Global store launched
          detail: Musinsa's newsroom says the global store launched across 13 countries in September 2022.
          claimRefs:
            - CO003
        - date: '2023-07-19'
          label: Latest disclosed funding round
          detail: Tracxn lists a $190M Series C round at a $2.4B post-money valuation.
          claimRefs:
            - CO009
        - date: '2025-07-28'
          label: Brand ecosystem scale highlighted
          detail: Biz Chosun reported more than 10,000 brands on the platform and cited FY2024 revenue above 1 trillion won.
          claimRefs:
