      - CM011
      - CM012
      - CM013
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal scoring places Musinsa furthest toward ecosystem breadth and channel proof among retained peers and
      substitutes.
    xAxis:
      label: Seller-enablement breadth
      min: 1
      max: 5
      lowLabel: narrow channel
      highLabel: integrated ecosystem
    yAxis:
      label: Cross-border and offline proof
      min: 1
      max: 5
      lowLabel: limited retained proof
      highLabel: multi-country plus offline evidence
    data:
      points:
        - label: Musinsa
          x: 5
          'y': 5
          note: >-
            Marketplace, owned adjacencies, seller support, and offline/global activation all appear in retained
            evidence.
        - label: Brandi
          x: 3
          'y': 2
          note: >-
            Tracxn supports a funded domestic marketplace profile, but retained evidence is thinner on cross-border and
            enablement breadth.
        - label: Trenbe
          x: 2
          'y': 2
          note: Retained evidence supports a funded luxury-focused specialist rather than a broad ecosystem.
        - label: StockX
          x: 2
          'y': 4
          note: >-
            Specialist marketplace scale is strong, but the retained evidence points to resale rather than
            brand-incubation breadth.
        - label: Poison
          x: 2
          'y': 3
          note: Tracxn places Poison in the competitor set, but the retained pool supports a narrower geography and model.
        - label: Department stores / wholesale
          x: 1
          'y': 1
          note: >-
            This remains the legacy substitute route, but retained evidence shows less integrated enablement and
            community feedback.
