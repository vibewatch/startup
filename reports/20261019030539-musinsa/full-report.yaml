  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Musinsa’s visible product architecture layers content, seller tooling, launch mechanics, and global/offline
      channels around a marketplace core.
    data:
      layers:
        - label: Community and content acquisition
          detail: Legacy community/media surfaces attract style-led traffic and provide context for discovery.
          modules:
            - label: Online community and magazine roots
              note: Official history starts with a sneaker community and later a web magazine.
            - label: Brand storytelling
              note: Product pages and editorial context support browse-to-buy behavior.
        - label: Marketplace and merchandising core
          detail: Core commerce layer aggregates a large brand base for Korean fashion demand.
          modules:
            - label: Marketplace breadth
              note: Official and independent sources place the platform footprint above 10,000 brands.
            - label: Owned assortment
              note: Musinsa Standard adds direct merchandising control.
        - label: Brand enablement services
          detail: Seller tooling extends beyond listing to financing, training, content production, and creator access.
          modules:
            - label: Interest-free production funding
              note: Reported at >KRW 90bn last year and >KRW 330bn cumulative.
            - label: Partner Stage
              note: Consolidates support across Musinsa Store, 29CM, and Global Store.
            - label: Creator Marketplace
              note: Brands can sponsor products with roughly 4,700 creators.
        - label: Exclusive launch engine
          detail: Drop-style releases create reasons to visit Musinsa that generic marketplaces cannot easily copy.
          modules:
            - label: Musinsa Edition
              note: 126 collaborations last year; 119 launches in Jan-Apr 2026.
            - label: Musinsa Drop
              note: Used for launches such as Oakley Meta AI glasses.
        - label: Offline and cross-border commerce
          detail: Global and physical channels turn digital demand into experiential and international acquisition.
          modules:
            - label: Musinsa Global
              note: ~4,000 brands across 13 strategic markets outside China.
            - label: Physical retail
              note: 41 Musinsa Standard stores and six Musinsa Store locations in Korea.
            - label: Pop-up feedback loop
              note: Tokyo pop-up linked QR reviews for >2,800 products and added new members.
        - label: Trust and control layer
          detail: Governance tools are expanding, but public proof still emphasizes reactive measures.
          modules:
            - label: Seller bans and refunds
              note: Escalated after fake-down and relabeling controversies.
            - label: AI review system
              note: Planned to monitor more than 1.2 million listings.
            - label: Unresolved technical proof
              note: No public service-level, certification, or integration detail in the reviewed source set.
    approximationNotes: >-
      Architecture layers are synthesized from public evidence and indicate operating relationships, not a disclosed
      codebase or vendor diagram.
    claimRefs:
      - CE002
      - CE008
      - CE009
      - CE012
      - CE013
      - CE016
  - id: FU001
    title: Customer journey from seller acquisition to international expansion
    type: journey-map
    summary: >-
      Musinsa's visible customer loop starts with merchant acquisition and consumer traffic, then extends into ad
      monetization and overseas channel expansion before running into retention and trust gaps.
    data:
      items:
        - label: Recruit merchant supply
          actor: Partner brands
          phase: Supply acquisition
          touchpoints:
            - Partner brands join the marketplace and related Musinsa channels
            - Musinsa offers funding, training, creator access, and content support
        - label: Build consumer reach
          actor: Korean members and app users
          phase: Core marketplace use
          touchpoints:
            - Official pages emphasize large member and MAU scale
            - Traffic and discovery support the marketplace's two-sided economics
        - label: Re-engage and monetize demand
          actor: Existing shoppers and merchant advertisers
          phase: Conversion loop
          touchpoints:
            - Moloco case study describes active, inactive, and semi-active cohorts
            - Product Ads appear across home, search, category, PDP, recent-view, and favorites surfaces
        - label: Turn offline interest into digital activity
          actor: International shoppers
          phase: Cross-channel expansion
          touchpoints:
            - Tokyo pop-up visitors searched partner-brand information and reviews in the global store
            - New Japanese global-store members grew after the event
        - label: Expand merchant customers abroad
          actor: Korean labels entering Japan and China
          phase: Merchant expansion
          touchpoints:
            - China stores, Tmall, and the AAKAM agreement show Musinsa acting as an export-enablement channel
            - Global-store and pop-up infrastructure support international brand discovery
        - label: Underwrite durability
          actor: Investors and merchant-risk reviewers
          phase: Open diligence
          touchpoints:
            - Retention, renewal, and concentration metrics are not publicly disclosed
            - Seller-quality incidents show that trust can break even when traffic looks strong
