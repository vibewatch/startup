  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Served-demand layers run from broad ecosystem reach toward narrower monetized export channels and brand-enablement
      surfaces.
    data:
      items:
        - label: Consumer audience
          displayValue: 20M+ members
          detail: Across MUSINSA-operated services.
        - label: Partner supply base
          displayValue: 14K+ partner brands
          detail: Current official service-wide partner count.
        - label: Domestic brand network
          displayValue: 8,000 domestic brands
          detail: Biz Chosun says cumulative platform brands recently surpassed 10,000.
        - label: Cross-border catalog
          displayValue: 800 Korean brands / 13 countries
          detail: BoF's 2023 snapshot of Musinsa's global catalog reach.
        - label: Offline conversion surface
          displayValue: 9.23M Q1 2026 visitors
          detail: EpicKor-reported nationwide store traffic for Musinsa Standard.
        - label: Export monetization
          displayValue: KRW 15.3bn Q1 2026 exports
          detail: EpicKor says exports were 4.2% of quarterly sales.
    approximationNotes: >-
