company:
  name: "Musinsa"
chapter:
  number: 8
  title: "Valuation"
  summary: "Musinsa has credible scale, but the assigned public evidence does not establish a current entry price: historical 2023 valuation references range from $2.3 billion to approximately $2.76 billion, while a September 2026 report only establishes that over-the-counter value rose sharply. The appropriate stance is track with medium confidence and high risk until current audited economics, security terms, and a defensible price are available."
sections:
  - id: "decision-and-entry-discipline"
    title: "Decision and entry discipline"
    body: |
      The recommendation is track, not buy. TechCrunch reported a $190 million July 2023 Series C led by KKR, with Wellington Management participating, and placed the post-money valuation at approximately $2.76 billion based on sources while noting that Musinsa confirmed only that it exceeded 3 trillion won. Other databases do not converge on one historical mark: Tracxn displays $2.4 billion and Multiples displays $2.3 billion. Those records describe funding history, not cash currently available, and none supplies an October 2026 primary financing price.

      September 2026 over-the-counter enthusiasm is relevant but incomplete. KED Global reported that corporate value rose by more than 1 trillion won, or $743 million, in less than two weeks as IPO optimism increased, without providing enough in the fetched text to establish a starting value, closing value, transaction depth, or terms. The sharp move is therefore a sentiment signal rather than a defensible entry benchmark. A price-positive recommendation should wait for a current cap table, security rights, audited financials, and evidence that any quoted secondary value reflects executable volume.
    claimRefs: [CV001, CV002, CV009, CV010, CV011, CV014, CV016]
    tableRefs: [TV001]
  - id: "scale-economics-and-comparability"
    title: "Scale, economics, and comparability"
    body: |
      Operating evidence supports continued diligence. TechCrunch reported $545 million of 2022 sales, up 54% year over year, but only $2.5 million of operating profit after international investment and losses at the SLDT sneaker-resale unit. The same article relayed company claims of more than 8,000 brands, 13 million users, and over $2.35 billion of 2022 GMV. Musinsa's own materials now claim more than 14,000 partner brands and more than 20 million members, while company-controlled pages present the business as connecting online and offline channels and operating globally. These are meaningful scale indicators, but the company-issued figures are not independent verification of monetization quality.

      Available multiple data requires caution. Multiples associates a 4.9x revenue multiple with $475 million of recorded revenue in November 2023 and a 3.0x multiple with $910 million in July 2023; it explains that associated revenue may be run-rate revenue or reported LTM, so the denominators are not necessarily comparable. Its public-company table lists 2.4x LTM revenue for TX Group and 3.1x for Visional, but neither is established here as a clean Korean fashion-marketplace peer. These references are sanity checks, not sufficient evidence for a precise fair-value multiple.
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV008, CV012, CV013]
    tableRefs: [TV002]
  - id: "scenarios-and-downside"
    title: "Scenarios and downside"
    body: |
      The base case treats the $2.3 billion to approximately $2.76 billion historical 2023 marks as diligence anchors rather than current fair value. A bull case requires fresh audited growth, durable operating leverage, and credible international monetization before accepting a premium to that band. A bear case applies if current economics fail to support even the historical marks, financing terms subordinate new common equity, or IPO enthusiasm fades before a liquid exit. No probability percentages or return multiples are assigned because the source set lacks a current security price, ownership waterfall, forecast, and exit timing.

      Trust risk also belongs in valuation. Tenbiz reported seller-label and product-quality controversies, including a jacket whose claimed 80% down content tested at 2.8%; it also reported that Musinsa removed flagged items, issued refunds, announced zero tolerance, and planned AI review across more than 1.2 million listings. The reporting is a low-reputation adverse source and should be independently verified, but the described incidents still identify a concrete downside path: recurring marketplace-quality failures could raise compliance cost and weaken the brand trust required for public-market multiple expansion.
    claimRefs: [CV002, CV003, CV004, CV011, CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: "exit-readiness-and-diligence"
    title: "Exit readiness and final diligence asks"
    body: |
      Public exit evidence is suggestive rather than conclusive. The 2026 KED report links a rapid over-the-counter rerating to IPO optimism, and Musinsa's official positioning emphasizes expansion from Korea to global online and offline channels. Yet the assigned evidence does not contain a current filing, underwriter mandate, expected listing date, audited segment disclosure, or executable offer terms. International presence therefore supports optionality, but it does not by itself establish overseas revenue contribution, country-level profitability, or IPO readiness.

      The decision can improve only through specific evidence. Management should provide the current fully diluted cap table, preferred-share conversion and liquidation terms, secondary-sale overhang, audited 2024-2026 financials, marketplace versus owned-inventory gross profit, and international contribution by country. Thesis-break triggers are a financing or listing price unsupported by audited revenue quality, deterioration in operating profit after normalizing expansion spending, repeated marketplace-quality incidents, or security terms that materially reduce common-equity proceeds. Conversely, durable margins, independently verified international economics, and transparent terms could justify moving from track toward a price-qualified investment recommendation.
    claimRefs: [CV007, CV008, CV011, CV014, CV015, CV016]
callouts:
  - calloutType: "recommendation"
    title: "Price-sensitive working call"
    body: "Track with medium confidence and high risk; do not convert historical valuation references or a reported OTC value increase into a current fair-value estimate without executable price, audited economics, and security terms."
    claimRefs: [CV011, CV014, CV016]
  - calloutType: "risk"
    title: "Do not confuse financing with liquidity"
    body: "Reported funding totals describe historical capital raised, not cash currently available, and the assigned sources disagree on both total funding and the latest valuation marker."
    claimRefs: [CV009, CV010, CV011]
