  - id: "TV001"
    title: "Recommendation summary table"
    columns: ["Dimension", "Assessment", "Evidence basis", "Decision implication"]
    rows:
      - ["Recommendation", "Track", "Scale is credible, but current price and security terms are not established.", "Continue diligence without underwriting a buy case."]
      - ["Confidence", "Medium", "Historical financing and operating metrics are reported, while current valuation evidence is incomplete.", "Treat the call as conditional rather than final."]
      - ["Risk rating", "High", "OTC sentiment, denominator inconsistency, disclosure gaps, and trust incidents can impair entry or exit economics.", "Require downside protection and source verification."]
      - ["Valuation stance", "Unresolved / potentially stretched", "Historical 2023 marks span $2.3B to about $2.76B; no current executable price is in the assigned evidence.", "Reject false precision and anchor negotiations to fresh audited data."]
      - ["Upgrade condition", "Price-qualified only", "A current cap table, audited segment economics, and credible exit process are missing.", "Move toward invest only after terms and fundamentals reconcile."]
    notes: "Assessments are analyst synthesis; dollar valuation references are historical 2023 marks, not October 2026 fair values or indications of cash available."
    claimRefs: [CV001, CV002, CV009, CV010, CV011, CV014, CV015, CV016]
  - id: "TV002"
    title: "Thesis / anti-thesis table"
    columns: ["Side", "Argument", "Evidence", "What would change the view"]
    rows:
      - ["Thesis", "Established transaction scale", "TechCrunch reported $545M of 2022 sales, up 54% year over year.", "Fresh audited growth and segment reconciliation would strengthen the thesis."]
      - ["Thesis", "Broad platform reach", "TechCrunch relayed 2022 claims of 8,000+ brands and 13M users; Musinsa now claims 14K+ partner brands and 20M+ members.", "Independent active-user, retention, and brand-concentration data would improve confidence."]
      - ["Thesis", "International option value", "Company pages operate a GLOBAL MUSINSA storefront and describe online/offline expansion from Korea to the world.", "Country-level revenue, margin, and repeat-purchase evidence would turn presence into economic proof."]
      - ["Anti-thesis", "Thin historical operating margin", "TechCrunch reported only $2.5M of 2022 operating profit on $545M of sales.", "Audited evidence of durable operating leverage would reduce this concern."]
      - ["Anti-thesis", "Unstable valuation denominator", "Multiples reports 4.9x on $475M in Nov. 2023 versus 3.0x on $910M in Jul. 2023, with revenue bases that may differ.", "A consistent LTM net-revenue definition and reconciled enterprise value would make the multiple usable."]
      - ["Anti-thesis", "Marketplace trust exposure", "Tenbiz reported repeated quality allegations and subsequent refunds, bans, and planned AI review.", "Independent incident data showing sustained reduction in violations would lower the discount."]
    notes: "Company-issued reach and international-positioning statements are identified as such; the adverse report is low-reputation and needs independent corroboration."
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV008, CV012, CV015]
  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns: ["Case", "Valuation / return logic", "Assumptions", "Probability signal", "Downside or upgrade trigger"]
    rows:
      - ["Bull", "A premium to the historical $2.3B-$2.76B reference band is considered only after fresh evidence; no precise range is supportable now.", "Audited growth, durable profit, verified international contribution, transparent preferences, and credible IPO demand.", "Strengthening if filings and executable transactions corroborate current fundamentals.", "Upgrade when price, terms, and independently verified economics jointly support target returns."]
      - ["Base", "Use the historical 2023 band only as a diligence anchor and calculate returns from a newly verified entry price.", "Scale persists, profit improves, but disclosure and international economics remain incomplete.", "Most consistent with the mixed public evidence available in the assigned pool.", "Remain at track until audited data and security terms are available."]
      - ["Bear", "Value can fall below historical marks; no downside floor is established by prior rounds or funding raised.", "OTC enthusiasm reverses, profit quality disappoints, trust incidents recur, or preference overhang impairs common equity.", "Strengthening if IPO progress stalls or marketplace-quality controls prove ineffective.", "Reject the investment if normalized economics or waterfall proceeds cannot meet the required return."]
    notes: "Scenarios are conditional decision frames, not forecasts; the source set lacks current price, cap-table waterfall, forecast periods, probability estimates, and target-return inputs."
    claimRefs: [CV002, CV003, CV004, CV011, CV012, CV013, CV014, CV015, CV016]
