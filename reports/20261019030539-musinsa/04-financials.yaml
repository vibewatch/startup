      - ["Fulfillment, advertising, and ancillary services", "Services sold around marketplace activity", "Share of revenue", "30.4% of 2025 revenue", "Diversifies monetization, but the component mix is not publicly separated", "Request revenue and gross profit by fulfillment, advertising, and other service lines."]
      - ["International commerce", "Global online sales plus offline expansion", "KRW sales", "2025 overseas sales expected below 20 billion won; 2026 projected at 100-200 billion won", "Small disclosed base with a large plan-dependent step-up", "Request country-level GMV, net revenue, contribution margin, leases, subsidies, and JV economics."]
