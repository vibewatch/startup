  - id: "TI002"
    title: "Pricing / monetization table"
    columns: ["Offer", "Price / unit / contract", "List vs realized pricing", "Discounts / unknowns", "Diligence ask"]
    rows:
      - ["Consumer storefront promotions", "Item-level retail prices not retained in the fetched page", "Visible promotion labels only", "Extra 20% offers and a winter sale advertised at up to 50% off", "Request gross-to-net sales, markdown cadence, coupon funding, returns, and realized AOV by channel."]
      - ["Partner-brand marketplace", "Commission contract", "38.8% revenue-mix contribution is disclosed; the contractual or realized take rate is not", "Seller incentives, rebates, and advertising bundles are unknown", "Request standard and realized commission schedules, rebate tiers, and seller-level concentration."]
      - ["Musinsa Standard", "Owned-brand retail", "About 471 billion won of 2025 transaction volume; recognized revenue and unit margin are not disclosed", "Promotional mix, markdowns, and returns are unknown", "Request SKU-level sell-through, landed cost, gross margin, return rate, and inventory aging."]
    notes: "The storefront proves promotional activity, not realized pricing or net revenue; transaction volume and revenue are kept distinct."
    claimRefs: ["CI006", "CI007", "CI015"]
  - id: "TI003"
    title: "Unit economics and capital-intensity table"
    columns: ["Metric", "Value / public proxy", "Confidence", "Why it matters", "Diligence ask"]
    rows:
      - ["2025 consolidated earnings", "Revenue 1.4679 trillion won; operating profit 140.5 billion won; EBITDA 232.2 billion won", "Medium", "Shows positive earnings at scale without revealing segment contribution", "Request audited statements and segment bridges from GMV through revenue, gross profit, EBITDA, and cash flow."]
      - ["First-half 2026 profit conversion", "Revenue 821.7 billion won, up 22.5%; operating profit 52.3 billion won, down 11.2%", "Medium", "Growth is not currently translating into proportional operating profit", "Request quarterly margin bridge separating overseas, logistics, offline, and one-time costs."]
      - ["Content-assisted conversion", "2.35% average monthly purchase conversion among viewers of Musinsa-supported detail pages", "Low", "A narrow merchandising proxy, not CAC, retention, or payback", "Request cohort conversion, repeat purchase, CAC, contribution margin, and payback by acquisition source."]
      - ["Partner production financing", "More than 90 billion won in 2024; more than 330 billion won cumulatively since 2015", "Medium", "Can strengthen supply attachment while committing capital before sell-through", "Request outstanding balance, tenor, repayment, loss history, collateral, and accounting classification."]
      - ["Cash, debt, and runway", null, "Low", "Capital adequacy cannot be established from income-statement growth alone", "Provide unrestricted cash, net debt, leases, covenants, monthly cash flow, and board-approved financing plan."]
    notes: "Null means the retained public evidence did not disclose the metric; public proxies do not substitute for audited segment and cash-flow data."
    claimRefs: ["CI001", "CI002", "CI003", "CI004", "CI005", "CI011", "CI012"]
