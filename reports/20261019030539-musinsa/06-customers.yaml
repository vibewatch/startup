schemaVersion: report-v2
artifact: customers
slug: musinsa
runDate: 2026-10-19
company:
  name: Musinsa
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports Musinsa as a two-sided fashion marketplace with meaningful scale
    on both the consumer and merchant sides, but the strongest current proof is around reach,
    international activation, and merchant enablement rather than disclosed retention or
    concentration economics. The same evidence set also shows a live trust risk: Musinsa's
    public customer-scale baselines are inconsistent across its own English surfaces, and
    seller-quality controversies show how brand-side oversight can impair durability.
sections:
  - id: customer-segmentation
    title: Customer base spans shoppers, merchant brands, and export-oriented labels
    body: >-
      The assigned evidence shows Musinsa monetizing a classic two-sided marketplace rather
      than a single consumer storefront. On the demand side, official pages describe a large
      member base and monthly active users, while third-party reporting shows that offline
      pop-ups can push review searches and new-member growth in Japan. On the supply side,
      Musinsa positions partner brands as paying and strategically important customers by
      offering listing access, marketing support, interest-free production funding, training,
      creator distribution, and overseas expansion support. That mix matters because Musinsa's
      durability depends not only on end-shopper traffic but also on whether brands keep
      using the platform as a growth channel.
    claimRefs: [CU004, CU005, CU008, CU011]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption proof is broad, but public baselines are not fully reconciled
    body: >-
      Musinsa's public scale claims point to a very large installed base, but the customer
      narrative is cleaner on gross reach than on consistent definitions. The official
      business page says that as of 2025 Musinsa had 20,000-plus partner brands, 24 million
      users, and 10 million monthly active users, while another Musinsa-controlled English
      page still presents a lower 14,000-plus partner-brand and 20 million-plus member
      baseline. Third-party sources help show direction rather than perfect reconciliation:
      one 2025 profile cites 13 million users and 8,000 partner brands by the end of 2023,
      and 2025-2026 international coverage shows real adoption loops in Japan and China.
    claimRefs: [CU001, CU002, CU003, CU006, CU007, CU009, CU010]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-merchant-proof
    title: Named merchant proof exists, but it is skewed toward expansion and incident evidence
    body: >-
      The named customer proof in the assigned pool is more merchant-side than enterprise-like:
      Musinsa appears in public with specific fashion labels when helping them expand or when
      platform oversight breaks down. AAKAM is the cleanest positive example because Musinsa
      publicly entered a three-way China support agreement alongside KOTRA and the brand.
      The adverse side is also informative. Seller incidents involving MARZIN and Lafudge
      Store show that brands were actively transacting on the platform, but they also show
      that named-customer visibility can come from controversy rather than healthy reference
      value. That weakens how much logo evidence alone can say about durability.
    claimRefs: [CU011, CU012]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Retention, renewal, and concentration remain the biggest customer underwriting gaps
    body: >-
      The available sources do not give the metrics an investor would want for customer
      durability. None of the assigned public evidence discloses merchant churn, GMV or
      revenue concentration by top brand, repeat-purchase cohorts, renewal rates, net
      revenue retention, or channel-level profitability. Instead, the public story emphasizes
      merchandise breadth, user reach, and international launch momentum. That leaves two
      material gaps. First, it is hard to separate healthy retained demand from acquisition-led
      spikes. Second, it is hard to tell whether Musinsa's merchant base is diversified or
      whether a narrower set of brands and owned channels drive outsized economics.
    claimRefs: [CU003, CU012, CU013]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      [Segment, Buyer / user / payer, Use case, Public scale / strategic value, Key gap]
    rows:
      - - Korean marketplace shoppers
        - Buyer and end user
        - Discover and purchase fashion and beauty through Musinsa's online and offline surfaces
        - Business page lists 24M+ users and 10M+ MAU as of 2025
        - No order frequency, paid conversion, or cohort retention data is disclosed
      - - Partner fashion brands
        - Merchant payer and supply-side customer
        - List products, buy marketing support, use funding and training programs, and access demand
        - Business page lists 20,000+ partner brands; Chosun cites 90B won annual and 330B won cumulative production-funding support
        - No take rate, merchant retention, or top-brand concentration is disclosed
      - - International global-store shoppers
        - Buyer and end user outside Korea
        - Browse reviews, discover partner brands, and convert from pop-ups into global-store activity
        - Japan pop-up drove 20,000+ first-week visitors, 64% review searches, and 2.7x new members
        - No repeat-purchase, basket-size, or country cohort data is disclosed
      - - Export-oriented Korean labels
        - Merchant brand using Musinsa as a market-entry channel
        - Use Musinsa stores, Tmall, pop-ups, and KOTRA-linked support to reach Japan and China
        - AAKAM was named in a China expansion agreement; China stores and Tmall traction show channel value
        - No merchant-level sales or renewal outcomes are disclosed
    notes: >-
      Segments mix official and third-party evidence; public proof is stronger on reach and
      enablement than on economics or retention.
    claimRefs: [CU004, CU005, CU008, CU009, CU011]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns: [Metric, Value, Date, Source, Confidence, Implication, Missing denominator]
    rows:
      - - Partner brands
        - 20,000+
        - As of 2025
        - Business page
        - Medium
        - Merchant supply breadth is materially larger than older public baselines
        - Active selling brands versus cumulative signups is not disclosed
      - - Users / members across official surfaces
        - 24M+ users on business page vs 20M+ members on backup about page
        - 2025 business page / undated backup page
        - Business page plus backup about page
        - Medium
        - Reach is large, but Musinsa's own English surfaces do not reconcile to one baseline
        - No common definition for users, members, or active accounts is disclosed
      - - Monthly active users
        - 10M+
        - As of 2025
        - Business page
        - Medium
        - Demand appears large enough to support both marketplace and ad inventory monetization
        - No MAU trendline or purchase conversion is disclosed
      - - Tokyo pop-up to global-store funnel
        - 20,000+ first-week visitors; 64% searched partner-brand info or reviews; Japan new members +2.7x
        - 2025-10
        - Korea Herald
        - Medium
        - Offline events can produce measurable digital acquisition in Japan
        - No purchase conversion or revenue per new member is disclosed
      - - China launch traction
        - 10B+ won GMV in first 100 days; Tmall monthly sales 9x in 3 months; 100,000+ store visitors
        - 2026-03
        - The Investor
        - Medium
        - China is a real adoption channel, not only a branding experiment
        - No repeat rate, margin, or customer acquisition cost is disclosed
    notes: >-
      Metrics come from different periods and definitions; the table preserves the original
      labels rather than forcing a single customer-count denominator.
    claimRefs: [CU001, CU002, CU003, CU006, CU007, CU009, CU010]
  - id: TU003
    title: Named customer proof table
    columns:
      [Customer / brand, Segment, Deployment / use case, Production vs pilot, Outcome / proof, Limitation]
    rows:
      - - AAKAM
        - Designer label and merchant brand
        - Musinsa signed a three-way agreement with KOTRA and AAKAM to help Korean labels navigate China logistics, customs, and marketing
        - Early expansion enablement, not proven sell-through
        - Named brand proves Musinsa is acting as a merchant-enablement channel in China
        - Public evidence gives no sales, renewal, or retention outcome for AAKAM
      - - MARZIN
        - Marketplace seller brand
        - Men's dress shoes sold through a Musinsa promotion before the listing was pulled after label-switching controversy
        - Live production listing with adverse remediation
        - Confirms real seller activity on the platform, not just logo display
        - Reference quality is adverse and does not prove healthy ongoing demand
      - - Lafudge Store and other flagged down-jacket sellers
        - Marketplace seller cohort
        - Products sold through Musinsa before refunds followed misrepresentation findings
        - Live production listings with post-sale refunds
        - Shows that seller relationships are commercially active enough for platform QA failures to matter
        - Cohort is adverse, and public evidence does not quantify broader merchant quality
    notes: >-
      Enumeration is intentionally partial: it includes only named merchant brands visible in
      the assigned pool, not Musinsa's full customer base.
    enumerationScope:
      coverage: partial
      basis: >-
        Rows include only publicly named merchant brands or seller incidents visible in the
        assigned pool, not the full contracted or active seller base.
    claimRefs: [CU009, CU011, CU012]
figures:
  - id: FU001
    title: Customer journey from seller acquisition to international expansion
    type: journey-map
    summary: >-
      Musinsa's visible customer loop starts with merchant acquisition and consumer traffic,
      then extends into ad monetization and overseas channel expansion before running into
      retention and trust gaps.
    data:
      items:
        - label: Recruit merchant supply
          actor: Partner brands
          phase: Supply acquisition
          touchpoints:
            - Partner brands join the marketplace and related Musinsa channels
            - Musinsa offers funding, training, creator access, and content support
        - label: Build consumer reach
          actor: Korean members and app users
          phase: Core marketplace use
          touchpoints:
            - Official pages emphasize large member and MAU scale
            - Traffic and discovery support the marketplace's two-sided economics
        - label: Re-engage and monetize demand
          actor: Existing shoppers and merchant advertisers
          phase: Conversion loop
          touchpoints:
            - Moloco case study describes active, inactive, and semi-active cohorts
            - Product Ads appear across home, search, category, PDP, recent-view, and favorites surfaces
        - label: Turn offline interest into digital activity
          actor: International shoppers
          phase: Cross-channel expansion
          touchpoints:
            - Tokyo pop-up visitors searched partner-brand information and reviews in the global store
            - New Japanese global-store members grew after the event
        - label: Expand merchant customers abroad
          actor: Korean labels entering Japan and China
          phase: Merchant expansion
          touchpoints:
            - China stores, Tmall, and the AAKAM agreement show Musinsa acting as an export-enablement channel
            - Global-store and pop-up infrastructure support international brand discovery
        - label: Underwrite durability
          actor: Investors and merchant-risk reviewers
          phase: Open diligence
          touchpoints:
            - Retention, renewal, and concentration metrics are not publicly disclosed
            - Seller-quality incidents show that trust can break even when traffic looks strong
    claimRefs: [CU005, CU008, CU009, CU010, CU011, CU012, CU013]
