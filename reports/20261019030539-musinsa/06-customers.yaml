  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: A broader, dated list of named active merchant brands, production deployments, and reference outcomes on Musinsa.
      whyItMatters: The named-customer proof table is currently driven by a small set of visible examples, including adverse incidents, so it cannot stand in for Musinsa's full merchant customer base.
      diligencePath: Request a current top-merchant reference list with deployment status, channel mix, and proof of ongoing sell-through or renewals.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: retention-metrics
      missingEvidence: Public or management-verified NRR, GRR, churn, repeat-purchase cohort, or merchant renewal disclosures.
      whyItMatters: Customer durability cannot be underwritten from traffic and launch data alone.
      diligencePath: Request cohort retention, repeat-purchase, merchant renewal, and churn data by major segment from management.
      relatedQuestionRefs: [QU005]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: Top-brand, owned-brand, channel, and country concentration metrics for GMV or revenue.
      whyItMatters: Without concentration data, it is impossible to judge whether Musinsa's scale is diversified or dependent on a narrower set of brands and channels.
      diligencePath: Request top-10 merchant share, owned-brand share, global-store share, and country-level GMV mix.
      relatedQuestionRefs: [QU005, QU007]
    - type: conflicting-data
      severity: material
      topic: customer-scale
      missingEvidence: A reconciled current definition for users, members, active accounts, and partner-brand counts across Musinsa's official English surfaces.
      whyItMatters: Inconsistent baselines make it harder to measure true customer growth and to compare new disclosures with earlier public claims.
      diligencePath: Ask management to reconcile official member, user, MAU, and partner-brand counts in one dated KPI bridge.
      relatedQuestionRefs: [QU008]
