callouts:
  - calloutType: insight
    title: Musinsa's market is multi-sided by design
    body: >-
      Public evidence points to a system that monetizes consumer demand, owned-label retail, and partner-brand
      enablement together, which is why a simple marketplace-TAM framing understates what management is trying to
      build.
    claimRefs: [CM001, CM005, CM012]
  - calloutType: risk
    title: Scale is visible, but market efficiency is not
    body: >-
      Musinsa has credible served-demand signals, yet public evidence still leaves open the true SAM/SOM,
      channel concentration, and whether trust incidents or heavy promotion could cap long-term take-rate quality.
    claimRefs: [CM006, CM014, CM015]
