figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Musinsa's public record shows a long path from niche community to scaled
      fashion platform, with the latest milestones mixing genuine operating
      traction and unresolved trust/valuation questions.
    data:
      items:
        - year: 2001
          label: Community founded
          detail: Musinsa began as an online sneaker community created by Cho Man Ho.
          claimRefs: [CO001]
        - year: 2003
          label: Musinsa.com launched
          detail: Company growth materials list Musinsa.com as the online fashion community milestone.
          claimRefs: [CO001]
        - year: 2005
          label: Magazine layer added
          detail: Official history lists MUSINSA Magazine as the next major media/content step.
          claimRefs: [CO001]
        - year: 2009
          label: Store launched
          detail: Official history dates the launch of MUSINSA STORE to 2009.
          claimRefs: [CO001]
        - year: 2017
          label: Private brand launched
          detail: Official history lists musinsa standard as a 2017 milestone.
          claimRefs: [CO001]
        - year: 2021
          label: Portfolio broadened
          detail: Official growth materials list acquisitions of 29CM and StyleShare, while Tracxn records the 2021 Series B round.
          claimRefs: [CO008]
        - date: "2022-09"
          label: Global store launched
          detail: Musinsa's newsroom says the global store launched across 13 countries in September 2022.
          claimRefs: [CO003]
        - date: "2023-07-19"
          label: Latest disclosed funding round
          detail: Tracxn lists a $190M Series C round at a $2.4B post-money valuation.
          claimRefs: [CO009]
        - date: "2025-07-28"
          label: Brand ecosystem scale highlighted
          detail: Biz Chosun reported more than 10,000 brands on the platform and cited FY2024 revenue above 1 trillion won.
          claimRefs: [CO005, CO012]
        - date: "2025-09-25"
          label: IPO ambition went public
          detail: JoongAng reported a 10 trillion won IPO target valuation alongside H1 2025 revenue and profit disclosure.
          claimRefs: [CO010, CO014]
        - date: "2026-03-13"
          label: Seller-quality controls tightened
          detail: Adverse reporting said Musinsa promised permanent bans, AI review, and possible criminal referrals after repeated mislabeling incidents.
          claimRefs: [CO015]
        - date: "2026-10"
          label: Japan traction became visible
          detail: Korea Herald reported more than 20,000 Tokyo pop-up visitors in the first week and 2.7x new Japan global-store members.
          claimRefs: [CO013]
    approximationNotes: null
    claimRefs: [CO001, CO003, CO005, CO008, CO009, CO010, CO012, CO013, CO014, CO015]
callouts:
  - calloutType: insight
    title: Marketplace identity is broader than simple retail
    body: >-
      The strongest official and independent sources consistently portray
      Musinsa as an ecosystem operator for partner brands, not just an apparel
      storefront, which matters for judging supply-side defensibility and later
      customer-acquisition economics.
    claimRefs: [CO002, CO012, CO016]
  - calloutType: risk
    title: Public ambition outruns public disclosure depth
    body: >-
      Musinsa now has operating scale and profit markers, but the assigned
      pool still leaves material gaps around board structure, cap-table terms,
      unified customer metrics, and whether quality-control remediation is
      strong enough to support an IPO-premium narrative.
    claimRefs: [CO007, CO014, CO015]
