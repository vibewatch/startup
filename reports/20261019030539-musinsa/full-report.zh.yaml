chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、总部与运营模式
        blocks:
          - type: paragraph
            body: >-
              Musinsa 由 Cho Man Ho 于 2001 年创立，最初是线上球鞋社区，后来扩展为更广泛的时尚商业与内容平台。公开记录始终将公司定位于首尔；公司自有材料如今把 Musinsa
              描述为融合平台分销、自有或关联渠道、创作者／内容入口和线下体验的时尚与美妆平台。这一定位很重要：Musinsa 不是把自己包装成单一店铺，而是合作品牌的基础设施和消费者目的地，后文应以此作为基本商业模式。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO008
              - CO009
              - CO010
              - CO011
              - CO014
      - number: '1.2'
        title: 创始人、管理层与治理集中度
        blocks:
          - type: paragraph
            body: >-
              公开管理层披露不多，但方向很清楚。创始人 Cho Man Ho 仍是核心人物：他创立了最初的社区，至今仍出现在公开管理层资料中；独立报道显示，他在 2025 年持有公司 52.35% 的股份。Mun-il Han
              是公开披露的 CEO，也是近期卖家优先、线下和国际扩张叙事的主要代表。这足以确认关键人物集中度较高，但不足以完成治理尽调：指定来源没有完整董事会名单、委员会架构、表决权细节，也没有 CEO
              之下更完整的接班梯队信息。
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO016
      - number: '1.3'
        title: 融资历史、所有权信号与当前规模指标
        blocks:
          - type: paragraph
            body: >-
              Musinsa 最新披露的私募市场锚点显示，公司已进入后期阶段、融资规模可观，但公开财务透明度仍有限。Tracxn 列示累计融资 $474 million；最新披露的 Series C 于 2023 年 7
              月完成，融资 $190 million，估值 $2.4 billion。近期韩国报道比旧融资数据库提供了更强的经营信息：JoongAng 报道 2025 年上半年收入为 670.54 billion
              won、经营利润为 58.86 billion won，并指出出口仅占 2024 年收入的 0.34%。Biz Chosun 另称平台上有超过 10,000 个品牌、每年提供超过 90 billion won
              的品牌融资支持，2024 年经营利润为 102.8 billion won。这些信息共同说明公司已有真实规模，但尚未形成完全适合投资人使用的公开披露包。
            claimRefs:
              - CO005
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO014
