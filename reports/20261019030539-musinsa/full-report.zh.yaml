  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 数字化商品经营把需求转成平台和自有品牌交易，支撑三类已披露收入；扩张支出随后会挤压利润转化。
    data:
      nodes:
        - id: demand
          label: 数字需求与内容
          detail: 编辑和商品详情内容吸引并转化购物者。
        - id: transactions
          label: 商业交易
          detail: 需求转化为合作品牌和自有品牌订单。
        - id: partner
          label: 合作品牌业务
          detail: 合作方交易支撑佣金和辅助服务。
        - id: owned
          label: 自有品牌业务
          detail: Musinsa Standard 和自营零售带来直接商品销售。
        - id: commission
          label: 佣金收入
          value: 38.8% of 2025 revenue
        - id: direct
          label: 直接商品销售
          value: 30.8% of 2025 revenue
        - id: services
          label: 履约、广告及其他
          value: 30.4% of 2025 revenue
        - id: earnings
          label: 运营收益与再投资
          detail: 海外、物流和线下成本挤压了 2026 年上半年的运营利润。
      edges:
        - from: demand
          to: transactions
          label: 转化
        - from: transactions
          to: partner
          label: 平台订单
        - from: transactions
          to: owned
          label: 自营订单
        - from: partner
          to: commission
          label: 佣金变现
        - from: partner
          to: services
          label: 辅助服务变现
        - from: owned
          to: direct
          label: 零售变现
        - from: commission
          to: earnings
        - from: direct
          to: earnings
        - from: services
          to: earnings
    approximationNotes: 仅为概念流程；已披露百分比是收入结构，不是毛利润结构，也不表示存在累计会计桥接。
    claimRefs:
      - CI006
      - CI012
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Musinsa 的可见产品架构以平台核心为底座，向外延伸至内容、卖家工具、发布机制以及全球 / 线下渠道。
    data:
      layers:
        - label: 社区与内容获客
          detail: 早期社区 / 媒体界面吸引追求风格的流量，并为发现商品提供背景。
          modules:
            - label: 线上社区与杂志根基
              note: Official history starts with a sneaker community and later a web magazine.
            - label: 品牌叙事
              note: Product pages and editorial context support browse-to-buy behavior.
        - label: 平台与商品运营核心
          detail: 核心商业层汇聚庞大品牌基础，承接韩国时尚需求。
          modules:
            - label: 平台广度
              note: Official and independent sources place the platform footprint above 10,000 brands.
            - label: 自有商品组合
              note: Musinsa Standard adds direct merchandising control.
        - label: 品牌赋能服务
          detail: 卖家工具从上架延伸到融资、培训、内容制作和创作者接入。
          modules:
            - label: 免息生产融资
              note: Reported at >KRW 90bn last year and >KRW 330bn cumulative.
            - label: Partner Stage
              note: Consolidates support across Musinsa Store, 29CM, and Global Store.
            - label: Creator Marketplace
              note: Brands can sponsor products with roughly 4,700 creators.
        - label: 独家发布引擎
          detail: Drop 式发布为访问 Musinsa 创造理由，通用平台难以轻易复制。
          modules:
            - label: Musinsa Edition
              note: 126 collaborations last year; 119 launches in Jan-Apr 2026.
            - label: Musinsa Drop
              note: Used for launches such as Oakley Meta AI glasses.
        - label: 线下与跨境商业
          detail: 全球和实体渠道把数字需求转化为体验式与国际化获客。
          modules:
            - label: Musinsa Global
              note: ~4,000 brands across 13 strategic markets outside China.
            - label: 实体零售
              note: 41 Musinsa Standard stores and six Musinsa Store locations in Korea.
            - label: 快闪店反馈闭环
              note: Tokyo pop-up linked QR reviews for >2,800 products and added new members.
        - label: 信任与控制层
          detail: 治理工具正在扩展，但公开证据仍主要显示这些措施是在事件发生后才启动。
          modules:
            - label: 卖家封禁与退款
              note: Escalated after fake-down and relabeling controversies.
            - label: AI 审核系统
              note: Planned to monitor more than 1.2 million listings.
            - label: 尚未解决的技术证明
              note: No public service-level, certification, or integration detail in the reviewed source set.
    approximationNotes: 架构层由公开证据综合得出，表示运营关系，不是已披露的代码库或供应商图。
    claimRefs:
      - CE002
      - CE008
      - CE009
      - CE012
      - CE013
      - CE016
  - id: FU001
    title: 从卖家获客到国际扩张的客户旅程
    type: journey-map
    summary: Musinsa 的可见客户闭环从商家获客和消费者流量起步，延伸到广告变现与海外渠道扩张，最后仍卡在留存和信任缺口上。
    data:
      items:
        - label: 招募商家供给
          actor: 合作品牌
          phase: 供给获客
          touchpoints:
            - 合作品牌加入平台及 Musinsa 相关渠道
            - Musinsa 提供融资、培训、创作者接入和内容支持
        - label: 扩大消费者触达
          actor: 韩国会员与应用用户
          phase: 平台核心使用
          touchpoints:
            - 官方页面强调庞大的会员和 MAU 规模
            - 流量与发现机制支撑平台的双边经济性
        - label: 重新激活并变现需求
          actor: 现有购物者与商家广告主
          phase: 转化闭环
          touchpoints:
            - Moloco 案例研究描述了活跃、不活跃和半活跃用户群
            - Product Ads 出现在首页、搜索、分类、PDP、最近浏览和收藏等界面
        - label: 把线下兴趣转成数字活动
          actor: 国际购物者
          phase: 跨渠道扩张
          touchpoints:
            - 东京快闪店访客在全球店搜索合作品牌信息和评价
            - 活动后日本全球店新增会员增加
        - label: 把商家客户拓展到海外
          actor: 进入日本和中国的韩国品牌
          phase: 商家扩张
          touchpoints:
            - 中国门店、天猫和 AAKAM 协议表明 Musinsa 正在充当出口赋能渠道
            - 全球店和快闪店基础设施支持国际品牌发现
        - label: 评估持久性
          actor: 投资者与商家风险评估人员
          phase: 开放尽调
          touchpoints:
            - 留存、续约和集中度指标尚未公开披露
            - 卖家质量事件表明，即使流量看起来强劲，信任也可能崩塌
    claimRefs:
      - CU005
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
  - id: FR001
