            body: >
              公开店铺显示促销商品运营活跃，包括额外 20% 优惠和最高 50% 折扣的冬季促销，但没有披露实现的平均售价、卖家佣金表或退货后的净收入。卖家质量争议又带来财务敏感性：TenBiz
              报道多起商品描述和材质标签争议，其中一件声称含绒 80% 的夹克实测仅 2.8%，随后公司退款并加强监控。这些事件可能产生退款、审核和信任成本，尽管现有证据没有量化影响。结论应保持平衡：Musinsa
              有真实规模和正向盈利，但近期利润压缩、扩张支出、促销强度，以及未披露的资产负债表和细分数据，阻碍了对持久利润率、现金续航或融资依赖的完整判断。
