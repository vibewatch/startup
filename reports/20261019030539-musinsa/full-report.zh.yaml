  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 可服务需求从广泛的生态触达，逐层收窄到已经变现的出口渠道和品牌赋能场景。
    data:
      items:
        - label: 消费者受众
          displayValue: 20M+ members
          detail: 覆盖 MUSINSA 运营的各项服务。
        - label: 合作方供给基础
          displayValue: 14K+ partner brands
          detail: 当前官方披露的全服务合作方数量。
        - label: 国内品牌网络
          displayValue: 8,000 domestic brands
          detail: Biz Chosun 称平台累计品牌数近期已超过 10,000 个。
        - label: 跨境商品目录
          displayValue: 800 Korean brands / 13 countries
          detail: BoF 对 Musinsa 2023 年全球商品目录触达的截面记录。
        - label: 线下转化场景
          displayValue: 9.23M Q1 2026 visitors
          detail: EpicKor 报道的 Musinsa Standard 全国门店客流。
        - label: 出口变现
          displayValue: KRW 15.3bn Q1 2026 exports
          detail: EpicKor 称出口占季度销售额的 4.2%。
    approximationNotes: 各层混合了受众、供给、流量和类似收入的指标；排列顺序遵循从广度到变现的逻辑，不代表单位可以直接比较，也不代表宽度与价值成比例。
    claimRefs:
      - CM002
      - CM011
      - CM012
      - CM013
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 序数评分显示，在保留的同业和替代方案中，Musinsa 在生态广度和渠道验证两项上都处于最前端。
    xAxis:
      label: 卖家赋能广度
      min: 1
      max: 5
      lowLabel: narrow channel
      highLabel: integrated ecosystem
    yAxis:
      label: 跨境与线下验证
      min: 1
      max: 5
      lowLabel: limited retained proof
      highLabel: multi-country plus offline evidence
    data:
      points:
        - label: Musinsa
          x: 5
          'y': 5
          note: 保留证据显示其同时具备平台、自有延伸业务、卖家支持以及线下 / 全球激活能力。
        - label: Brandi
          x: 3
          'y': 2
          note: Tracxn 支持其有融资的国内平台画像，但保留证据对其跨境和赋能广度的支持较弱。
        - label: Trenbe
          x: 2
          'y': 2
          note: 保留证据支持其作为有融资、聚焦奢侈品的专业平台，而非广泛生态。
        - label: StockX
          x: 2
          'y': 4
          note: 专业平台规模较强，但保留证据显示其侧重转售，而非品牌孵化广度。
        - label: Poison
          x: 2
          'y': 3
          note: Tracxn 将 Poison 列入竞争者集合，但保留证据支持的地理范围和模式更窄。
        - label: 百货商店 / 批发
          x: 1
          'y': 1
          note: 这仍是传统替代路径，但保留证据显示其赋能和社区反馈整合程度较低。
    approximationNotes: 定位是有证据支持的 1 至 5 序数评分，不是经审计的基准；它总结引用来源，不推断数值市场份额或转化率。
