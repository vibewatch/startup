            figureRef: FO001
            claimRefs:
              - CO001
              - CO003
              - CO005
              - CO008
              - CO009
              - CO010
              - CO012
              - CO013
              - CO014
              - CO015
      - number: '1.5'
        title: 证据展项
        blocks:
          - type: callout
            title: 平台身份不只是简单零售
            body: 最有力的官方和独立来源都把 Musinsa 描绘为合作品牌的生态运营者，而不只是服装店铺。这一点关系到供给侧护城河，以及后续客户获取经济性的判断。
            calloutType: insight
            claimRefs:
              - CO002
              - CO012
              - CO016
          - type: callout
            title: 公开抱负领先于公开披露深度
            body: Musinsa 已有经营规模和利润指标，但指定来源在董事会结构、股权结构表条款、统一客户指标，以及质量控制整改是否足以支撑 IPO 溢价叙事等方面仍留下重大空白。
            calloutType: risk
            claimRefs:
              - CO007
              - CO014
              - CO015
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              Musinsa 的市场边界应定义为多边时尚生态，而不是狭窄的服装电商店铺。官方介绍页称，公司如今包含线上时尚社区、品牌孵化器、D2C 品牌运营、线上商业、原创内容和线下多元文化空间；EpicKor 对 2025
              年收入结构的总结则显示，公司同时依赖平台佣金、自有品牌收入和直接采购商品。因此纳入的支出不只是第三方平台商品的消费者结账金额，也包括第一方服装销售、帮助卖家获客的品牌服务，以及把线下流量转成线上购买的入口。现实替代方案包括韩国百货商店、品牌自营
              D2C 网站、综合平台、线下多品牌零售，以及绕过 Musinsa 生态的自有品牌建设或出口业务。
            claimRefs:
              - CM001
              - CM003
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM010
              - CM011
              - CM012
      - number: '2.2'
        title: 受证据约束的市场规模视角
        blocks:
          - type: paragraph
            body: >-
              公开证据支持若干已服务需求的观察角度，但无法给出干净的外部 TAM/SAM/SOM。按最宽服务口径，Musinsa 官方材料称其运营服务覆盖 20M+ 会员和 14K+
              合作品牌；更早的第三方报道则给出更窄的子集，例如 13 million 社区会员、韩国平台／应用上的 8,000 个品牌，以及精选时尚子集中的超过 1,500 个韩国当代品牌。在已变现一侧，EpicKor 和
              Statista 都将 2025 年收入定在约 KRW 1.47 trillion，这更适合作为当前已服务需求的可信下限，而非品类 TAM。跨境信号有意义，但规模仍小：BoF 称约 800 个韩国品牌销往 13
              个国家，Biz Chosun 称 Musinsa Global 服务 13 个地区且交易快速增长，EpicKor 称 2026 年第一季度出口达到 KRW 15.3 billion。合理解读是，Musinsa
              已经在变现一大块且仍在增长的韩国时尚需求，但公开材料仍未拆分更广泛的韩国时尚、美妆相关和出口市场中有多少真正可触达。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM006
              - CM008
              - CM009
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM006
              - CM008
              - CM009
              - CM010
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM011
              - CM012
              - CM013
      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Musinsa 至少服务两套买方体系。购物者用它发现时尚、接受编辑策展、在试穿体验后到线下到店，最终在线转化；卖家则借助它获取受众、营销、融资、商品运营指导和全球分销支持。Biz Chosun 和
              DetailDigest 都提到免息生产融资、咨询、导师辅导和营销支持。因此，付费客户不只是购买服装的终端消费者，也包括把营运资金和贸易利润投入 Musinsa
              渠道以获取需求的品牌。采用通常从内容驱动的发现和平台分销开始，再通过线下活动、自有品牌旗舰店、创作者营销，以及出口或游客相关商业进一步加深。
            claimRefs:
              - CM004
              - CM007
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM007
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 增长驱动、约束与尽调空白
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动来自 K-fashion 的文化顺风、Musinsa 聚合分散供给的能力，以及全球快闪店和游客密集型线下门店带来的线上后续转化。BoF 将 Musinsa 的国际机会与市场对 K-content
              熟悉度提升联系起来；Korea Herald 和 EpicKor 也显示，线下和全球活动能带来商品搜索及海外客户收入。主要约束是信任、质量控制和缺少市场效率数据。Tenbiz 记录了多起卖家争议及 Musinsa
              加强监管、引入 AI 审核的回应，说明监督不足会限制购买频率和抽佣率持久性。公开材料也没有披露细分经济性、队列留存或品牌集中度，而这些数据决定当前规模能否转化为可辩护的长期估值倍数。
            claimRefs:
              - CM009
              - CM010
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 证据展项
        blocks:
          - type: callout
            title: Musinsa 的市场天生是多边的
            body: 公开证据指向一个同时变现消费者需求、自有品牌零售和合作品牌赋能的系统，因此简单的平台 TAM 框架低估了管理层试图搭建的业务。
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
              - CM012
          - type: callout
            title: 规模可见，但市场效率不可见
            body: Musinsa 有可信的已服务需求信号，但公开证据仍未回答真实 SAM/SOM、渠道集中度，以及信任事件或重度促销是否会限制长期抽佣率质量。
            calloutType: risk
            claimRefs:
              - CM006
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图
        blocks:
          - type: paragraph
            body: >-
              现有证据显示，Musinsa 同时参与多条竞争链路。官方材料把 MUSINSA、29CM 和 soldout 描绘成一个生态，而不是单一店铺；第三方资料则将其与
              Brandi、StockX、Poison、Trenbe
              等国内平台和专业平台并列。相关竞争集不只是抽象的“时尚电商”，还包括韩国多品牌平台、专业转售或奢侈品平台，以及独立品牌在平台分销规模化前依赖的百货／批发渠道。Musinsa
              的主要差异在于渠道组合更广，但品牌多平台经营仍是结构性可能，因为许多替代方案只解决同一需求中更窄的一部分。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP010
              - CP011
