      - number: '8.4'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >
              公开退出证据只是提示性而非决定性。2026 年 KED 报道将快速场外重估与 IPO 乐观情绪联系起来，Musinsa
              官方定位也强调从韩国扩张到全球线上和线下渠道。但指定证据没有当前申报文件、承销商委任、预期上市日期、审计细分披露或可执行发行条款。因此，国际布局支持期权价值，却不能单独证明海外收入贡献、国家级盈利或 IPO
              准备度。


              只有具体证据才能改善决策。管理层应提供当前完全摊薄股权结构表、优先股转换和清算条款、二级出售悬垂、2024—2026
              年审计财务、平台与自有库存的毛利，以及按国家拆分的国际贡献。若融资或上市价格没有审计收入质量支撑、正常化扩张支出后经营利润恶化、平台质量事件反复，或证券条款大幅减少普通股收益，便会击穿论点。反之，持久利润率、独立核实的国际经济性和透明条款，可能支持建议从跟踪转为有价格约束的投资。
            claimRefs:
              - CV007
              - CV008
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 证据展项
        blocks:
          - type: callout
            title: 对价格敏感的工作判断
            body: 中等置信度、高风险，建议跟踪；在没有可执行价格、审计经济性和证券条款前，不要把历史估值参考或报道的场外价值上涨转成当前公允价值估计。
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV014
              - CV016
          - type: callout
            title: 不要把融资与流动性混为一谈
            body: 报道的融资总额描述的是历史募资，不是当前可用现金；指定来源对总融资额和最新估值标记都存在分歧。
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
              - CV011
