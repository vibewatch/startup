      - number: '8.3'
        title: 情景与下行风险
        blocks:
          - type: paragraph
            body: >
              基准情景把 $2.3 billion 至约 $2.76 billion 的 2023
              年历史估值当作尽调锚点，而非当前公允价值。只有在出现新的审计增长、持久运营杠杆和可信国际变现后，乐观情景才会接受高于该区间的价格。若当前经济性连历史估值都支撑不了、融资条款使新普通股处于次级，或 IPO
              热情在流动性退出前消退，则进入悲观情景。由于来源集缺少当前证券价格、所有权瀑布、预测和退出时点，未赋予概率或回报倍数。


              信任风险也应计入估值。Tenbiz 报道卖家标签和商品质量争议，包括一件声称含绒 80% 但实测仅 2.8% 的夹克；同时称 Musinsa 删除被标记商品、退款、宣布零容忍，并计划对超过 1.2 million
              个商品进行 AI 审核。该报道来源声誉较低，应独立核实，但所述事件仍指出明确的下行路径：平台质量失误反复出现，可能提高合规成本并削弱公开市场倍数扩张所需的品牌信任。
            claimRefs:
              - CV002
