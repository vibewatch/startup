  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策与入场纪律
        blocks:
          - type: paragraph
            body: >
              建议是跟踪，而不是买入。TechCrunch 报道 KKR 领投 2023 年 7 月 $190 million 的 Series C，Wellington Management 参与；据消息人士估算，投后估值约
              $2.76 billion，但 Musinsa 只确认估值超过 3 trillion won。其他数据库也没有统一的历史估值：Tracxn 显示 $2.4 billion，Multiples 显示 $2.3
              billion。这些记录描述的是融资历史，不是当前可用现金；没有任何来源提供 2026 年 10 月的一级融资价格。


              2026 年 9 月场外交易热情有参考价值，但并不完整。KED Global 报道，随着 IPO 乐观情绪升温，公司价值在不到两周内上涨超过 1 trillion won，即 $743
              million；但抓取文本不足以确定起始值、收盘值、交易深度或条款。因此这次急升更像情绪信号，而非可辩护的入场基准。要给出偏正面的价格判断，应等待当前股权结构表、证券权利、审计财务，以及任何报价的二级价值确实对应可执行交易量的证据。
