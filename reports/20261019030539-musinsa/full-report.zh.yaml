figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Musinsa 的公开记录显示，它从小众社区走向规模化时尚平台；最新里程碑一方面显示真实运营牵引力，另一方面也暴露出尚未解决的信任与估值问题。
    data:
      items:
        - year: 2001
          label: 社区成立
          detail: Musinsa 最初是 Cho Man Ho 创建的线上球鞋社区。
          claimRefs:
            - CO001
        - year: 2003
          label: Musinsa.com 上线
          detail: 公司增长材料将 Musinsa.com 列为线上时尚社区里程碑。
          claimRefs:
            - CO001
        - year: 2005
          label: 加入杂志内容层
          detail: 官方历史将 MUSINSA Magazine 列为下一步重要媒体 / 内容业务。
          claimRefs:
            - CO001
        - year: 2009
          label: 店铺上线
          detail: 官方历史显示 MUSINSA STORE 于 2009 年上线。
          claimRefs:
            - CO001
        - year: 2017
          label: 自有品牌上线
          detail: 官方历史将 musinsa standard 列为 2017 年里程碑。
          claimRefs:
            - CO001
        - year: 2021
          label: 投资组合拓宽
          detail: 官方增长材料列出了 29CM 和 StyleShare 的收购，Tracxn 则记录了 2021 年 Series B 轮融资。
          claimRefs:
            - CO008
        - date: 2022-09
          label: 全球店上线
          detail: Musinsa 新闻稿称全球店于 2022 年 9 月覆盖 13 个国家上线。
          claimRefs:
            - CO003
        - date: '2023-07-19'
          label: 最新披露的融资轮次
          detail: Tracxn 列出一轮 $190M 的 Series C，投后估值为 $2.4B。
          claimRefs:
            - CO009
        - date: '2025-07-28'
          label: 品牌生态规模受到关注
          detail: Biz Chosun 报道平台品牌超过 10,000 个，并称 FY2024 收入超过 1T 韩元。
          claimRefs:
            - CO005
            - CO012
        - date: '2025-09-25'
          label: IPO 抱负公开化
          detail: JoongAng 报道 IPO 目标估值为 10T 韩元，同时披露 H1 2025 收入和利润。
          claimRefs:
            - CO010
            - CO014
        - date: '2026-03-13'
          label: 收紧卖家质量控制
          detail: 不利报道指出，在多次错标事件后，Musinsa 承诺永久封禁、AI 审核，并可能移送刑事处理。
          claimRefs:
            - CO015
