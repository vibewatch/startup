      - number: '8.2'
        title: 规模、经济性与可比性
        blocks:
          - type: paragraph
            body: >
              经营证据支持继续尽调。TechCrunch 报道 2022 年销售额为 $545 million，同比增长 54%，但在国际投入和 SLDT 球鞋转售部门亏损后，经营利润仅 $2.5
              million。同一报道转述公司称拥有超过 8,000 个品牌、13 million 用户和超过 $2.35 billion 的 2022 年 GMV。Musinsa 自有材料如今称合作品牌超过 14,000
              个、会员超过 20 million；公司控制页面则将其描述为连接线上线下渠道并全球运营。这些是有意义的规模指标，但公司发布的数据并不是变现质量的独立验证。


              可用倍数数据需谨慎。Multiples 将 2023 年 11 月记录收入 $475 million 对应 4.9x 收入倍数，将 2023 年 7 月 $910 million 对应
              3.0x；它说明相关收入可能是运行率收入或披露的 LTM，因此分母未必可比。其上市公司表列出 TX Group 的 LTM 收入倍数 2.4x、Visional 为
              3.1x，但这里无法确认二者是干净的韩国时尚平台可比公司。这些只能用于合理性检查，不足以支持精确的公允价值倍数。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
