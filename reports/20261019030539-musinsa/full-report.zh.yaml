  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 估值 / 回报逻辑
      - 假设
      - 概率信号
      - 下行或升级触发条件
    rows:
      - - 乐观
        - 只有在出现最新证据后，才考虑高于历史 $2.3B-$2.76B 参考区间的溢价；目前无法支持精确区间。
        - 经审计的增长、可持续利润、经验证的国际业务贡献、透明的优先权安排与可信的 IPO 需求。
        - 如果申报文件和可执行交易共同印证当前基本面，信号会增强。
        - 当价格、条款和独立验证的经济数据共同支持目标回报时升级判断。
      - - 基准
        - 仅把历史 2023 年区间作为尽调锚点，并以最新核实的入场价格计算回报。
        - 规模延续、利润改善，但披露和国际业务经济性仍不完整。
        - 这与指定证据池中混杂的公开证据最为一致。
        - 在获得审计数据和证券条款前，维持跟踪。
      - - 悲观
        - 价值可能跌破历史估值；此前轮次或融资金额都没有建立下行底线。
        - 场外交易热情反转、利润质量令人失望、信任事件重演，或优先权悬垂损害普通股权益。
        - 如果 IPO 进展停滞，或平台质量控制证明无效，悲观信号会增强。
        - 如果正常化经济性或清算瀑布分配无法达到要求回报，拒绝投资。
    notes: 情景是有条件的决策框架，不是预测；来源集缺少当前价格、股权结构清算瀑布、预测期间、概率估计和目标回报输入。
    claimRefs:
