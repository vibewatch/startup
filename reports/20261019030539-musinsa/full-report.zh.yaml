  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 已验证的规模足以支持尽调，但估值参考不一致、条款不完整，加上信任风险，使建议仍停留在观察。
    data:
      nodes:
        - id: scale
          label: 规模证据
          detail: 2022 年销售额、用户、品牌和 GMV 报道证明这是一个有实质规模的平台。
        - id: economics
          label: 经济性核查
          detail: 历史运营利润偏薄，当前经审计的分部经济数据不可得。
        - id: valuation
          label: 估值参考
          detail: 历史 2023 年估值各不相同，2026 年场外交易报道提供的是变化，而非完整价格。
        - id: comparability
          label: 可比性核查
          detail: 可用收入倍数采用不一致的分母，且可比对象并不完美。
        - id: risk
          label: 风险与条款
          detail: 优先权机制、信任事件和退出执行都可能改变普通股结果。
        - id: decision
          label: 跟踪
          detail: 等待核实的入场价格、经审计的经济数据和证券条款。
      edges:
        - from: scale
          to: economics
          label: 测试变现
        - from: economics
          to: valuation
          label: 锚定价格
        - from: valuation
          to: comparability
          label: 交叉核验
        - from: comparability
          to: risk
          label: 应用折价
        - from: risk
          to: decision
          label: 确立立场
    approximationNotes: 该有序流程是定性的，不赋予权重、概率或转化率，也不代表任何隐含估值。
    claimRefs:
      - CV003
      - CV004
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
