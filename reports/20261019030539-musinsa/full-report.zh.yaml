      - number: '4.3'
        title: GTM 杠杆可见，但营运资金和国际化需求正在上升
        blocks:
          - type: paragraph
            body: >
              公开代理指标显示，Musinsa 将数字化商品运营与品牌资本及运营支持结合。Chosun Biz 报道，浏览 Musinsa 支持的商品详情页的客户平均月购买转化率为
              2.35%，这只是内容到购买的窄信号，不是完整 CAC 或回收期指标。同一来源称，2024 年免息生产融资超过 90 billion won，自 2015 年累计超过 330 billion
              won。海外方面，2025 年前九个月海外销售为 13.3 billion won，预计全年低于 20 billion won，而 2026 年预测为 100 billion 至 200 billion
              won。这一步跃升很激进且对资本敏感，需要库存、运费补贴、租赁、合资经济性及国家级贡献利润证据。
