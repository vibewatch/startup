      - number: '3.2'
        title: 分销与市场进入差异化
        blocks:
          - type: paragraph
            body: >-
              Musinsa 的公开优势不只是流量，而是卖家支持与渠道激活的组合。报道显示，公司提供免息生产融资、品牌培训、创作者平台推广，以及接入全球商店的合作路径。CEO Mun-il Han
              将模式描述为卖家管理加策展和数据，而非单纯游戏化。线下和跨境执行让卖家价值主张更具体：Musinsa 负责 Y-3
              在韩国的线下分销，以明确价格运营高端快闪店，并利用东京快闪店把流量导回全球商店。即便公开费率表仍不透明，这也比单纯出售流量的平台更有分销故事。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP007
              - CP008
              - CP016
      - number: '3.3'
        title: 护城河持久性与被替代风险
        blocks:
          - type: paragraph
            body: >-
              Musinsa
              将社区需求、平台商品运营、自有业务、合作伙伴融资及海外／线下激活打包在一起时，护城河最强；否则品牌本需自行拼接这些能力。但同一批证据也说明护城河并非不可攻破。重新贴标或商品描述不实引发的信任事件，会给买家和品牌测试替代方案的机会；一项负面来源认为，事后封禁不足以完全恢复信心。同时，JoongAng
              的报道显示，Musinsa 的国际叙事仍领先于已披露的出口变现，公司必须证明生态广度能转成持久且增厚利润的扩张，而不只是更大的运营版图。
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: 证据展项
        blocks:
          - type: callout
            title: 生态广度是主要竞争优势
            body: Musinsa 最明显的公开差异，是把分销、卖家支持、自有业务及线下／全球激活打包，而不是只做店铺或专业平台。
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
              - CP009
              - CP015
          - type: callout
            title: 信任与变现仍限制护城河持久性
            body: 买家信任事件和出口变现的公开证据有限，意味着 Musinsa 仍需证明更大的版图能带来持久、可防守的经济性，而不是一个更大但更嘈杂的平台。
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
              - CP014
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 多条变现路径的混合收入模式
        blocks:
          - type: paragraph
            body: >
              Musinsa 不是纯平台，不能用单一抽佣率解释全部业务，也不应据此估值。第三方报道将 2025 年收入拆为：合作品牌佣金 38.8%、直接商品销售 30.8%、履约、广告及其他服务
              30.4%。公司运营的入口还覆盖线上商业、自有品牌、线下零售和全球渠道。多元化能提高收入韧性、增加同一需求的变现方式，但也把轻资产佣金经济性与库存、履约和门店风险结合起来。Musinsa Standard 报道的
              2025 年交易额 471 billion won 说明自有品牌规模可观，但交易额不等于收入或毛利。因此，细分收入确认、抽佣率、退货、折价和毛利率仍是关键尽调项目。
            claimRefs:
              - CI006
              - CI007
              - CI013
          - type: table
            tableRef: TI001
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI006
              - CI012
              - CI013
      - number: '4.2'
        title: 增长仍强劲，但扩张正在挤压利润转化
        blocks:
          - type: paragraph
            body: >
              已披露的 2025 年业绩构成了有意义的盈利基础：合并收入达到 1.4679 trillion won，经营利润 140.5 billion won，EBITDA 232.2 billion won。2026
              年上半年收入同比增长 22.5%，达到 821.7 billion won，但经营利润下降 11.2% 至 52.3 billion
              won，原因包括海外、物流和线下扩张成本。这一背离是核心财务矛盾：Musinsa
              一边更快增长，一边为更大的运营版图投入资金，因此收入增长本身不能证明新增国际或门店收入拥有吸引人的贡献利润。公开数字支持合并口径下的盈利，但无法拆分平台、自有品牌、履约或国家层面的经济性。
