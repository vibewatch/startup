              - CO012
      - number: '1.4'
        title: 里程碑、扩张与当前观察点
        blocks:
          - type: paragraph
            body: >-
              发展路径很清楚：先做社区，再做商业，然后不断扩展自有渠道、收购和全球分销。眼下更重要的问题，是这套扩张故事能否持久到足以支撑 Musinsa 的 IPO
              抱负。近期积极信号包括日本市场势头增强，以及持续投入合作品牌赋能；但反向证据同样重要：反复出现的卖家质量争议促使公司采取零容忍回应、承诺引入 AI
              审核，并考虑移交刑事处理。后文应以此为基线：公司确有动能和生态影响力，但信任、治理和国际执行风险仍在，不能靠品牌数量或收入增长轻轻带过。
            claimRefs:
              - CO003
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
