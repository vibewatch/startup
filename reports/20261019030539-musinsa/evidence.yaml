evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Full board roster, committee structure, voting-right detail, share pledges, and liquidation-preference terms.
    whyItMatters: IPO readiness and true control risk cannot be judged from founder ownership alone.
    diligencePath: Request current board materials, cap table by share class, and latest shareholder agreement summary.
    relatedQuestionRefs:
      - QO002
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: scale-metrics
    missingEvidence: >-
      A clean, current public disclosure for headcount, one unified customer metric, and segment-level revenue or
      take-rate economics.
    whyItMatters: Mixed denominators across members, MAUs, brands, and group services limit comparability and valuation work.
    diligencePath: >-
      Request management KPI pack showing buyer counts, active users, headcount, brand concentration, and segment P&L by
      channel.
    relatedQuestionRefs:
      - QO004
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: public roster coverage
    missingEvidence: Complete executive bench, board members, and full institutional shareholder list.
    whyItMatters: The leadership and stakeholder tables are necessarily partial without fuller governance and ownership disclosure.
    diligencePath: Request org chart, board list, board observer rights, and latest financing participant schedule.
    relatedQuestionRefs:
      - QO002
      - QO008
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: public-tam-sam-som
    missingEvidence: >-
      An independent market study that isolates Korean online multi-brand fashion marketplace TAM/SAM/SOM and separates
      domestic demand from cross-border K-fashion demand.
    whyItMatters: >-
      Without a clean external market frame, current platform scale can be mistaken for total addressable market or for
      realistic long-run penetration.
    diligencePath: >-
      Request banker decks, industry-association studies, or channel data that segment Korean online fashion marketplace
      spend by model and geography.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Segment take rates, brand concentration, cohort retention, CAC or payback, and gross margin by marketplace,
      owned-label, offline, and export channels.
    whyItMatters: >-
      These metrics determine whether Musinsa's broad market participation translates into durable unit economics and
      premium valuation support.
    diligencePath: >-
      Request management KPI packs and cohort tables broken out by channel, customer segment, and owned-label versus
      marketplace contribution.
    relatedQuestionRefs:
      - QM005
      - QM008
  - type: private-evidence-only
    severity: material
    topic: marketplace-take-rates
    missingEvidence: Public take rates, seller fees, and realized discounting for Musinsa, Brandi, Trenbe, and other direct peers.
    whyItMatters: >-
      Commercial terms determine whether Musinsa's broader seller stack produces real economic lock-in or just higher
      operating scope.
    diligencePath: Request seller contracts, brand onboarding decks, or procurement-side quotes from Musinsa and named peers.
  - type: missing-source
    severity: material
    topic: peer-operating-metrics
    missingEvidence: >-
      Recent GMV, MAU, order-frequency, and retention data for Brandi, Trenbe, Poison, and department-store
      alternatives.
    whyItMatters: >-
      Public competitor profiles show funding and category focus, but they do not reveal whether Musinsa is winning on
      engagement or only on narrative breadth.
    diligencePath: >-
      Pull direct filings, investor decks, app-data panels, or media interviews for each named peer and refresh the
      comparison matrix.
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Pre-listing QA metrics, seller-removal rates, refund incidence, and post-incident remediation data after
      marketplace quality controversies.
    whyItMatters: >-
      Trust is a core switching-cost variable for buyers and brands, and retained adverse evidence is stronger on
      incidents than on control effectiveness.
    diligencePath: >-
      Request Musinsa policy disclosures, regulator correspondence, or independent testing and consumer-complaint
      datasets tied to marketplace quality.
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, net debt, lease liabilities, burn, runway, covenants, planned use of funds, and
      next-round or IPO financing triggers.
    whyItMatters: >-
      Revenue growth and accounting profit do not establish liquidity or financing resilience while overseas, logistics,
      and offline investment is accelerating.
    diligencePath: >-
      Obtain audited cash-flow statements, current management accounts, debt and lease schedules, covenant calculations,
      and a board-approved monthly cash forecast.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: segment-unit-economics
    missingEvidence: >-
      Marketplace take rate, gross margin by revenue stream, CAC, payback, retention, returns, inventory turns,
      markdowns, and seller concentration.
    whyItMatters: >-
      The hybrid model combines marketplace, owned inventory, fulfillment, advertising, and stores, so consolidated
      earnings do not reveal which streams produce durable margin.
    diligencePath: >-
      Request segment P&Ls, cohort and channel economics, SKU-level inventory aging, returns, markdown history, and the
      bridge from GMV to recognized revenue.
    relatedQuestionRefs:
      - QI001
      - QI003
      - QI004
      - QI005
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: international-unit-economics
    missingEvidence: >-
      Country-level GMV, revenue, contribution margin, store leases, shipping subsidies, return costs, and China
      joint-venture economics.
    whyItMatters: >-
      The international growth plan starts from a small disclosed sales base and is already contributing to
      operating-profit pressure.
    diligencePath: >-
      Request country-level P&Ls, transfer-pricing policy, partner economics, store cohort data, shipping and return
      subsidies, and capital commitments.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: public-technical-disclosure
    missingEvidence: >-
      A real architecture walkthrough, integration surface description, uptime/SLA history, security certifications, and
      incident-management evidence for Musinsa Global and marketplace operations.
    whyItMatters: >-
      Without direct technical proof, diligence cannot verify whether Musinsa's broad product and channel footprint is
      supported by resilient production operations and compliance controls.
    diligencePath: >-
      Request engineering and operations review materials covering system architecture, partner integrations,
      observability, incident history, certification scope, and ownership of seller-risk controls; triangulate with
      partner engineering or public practitioner references if management cannot disclose full internals.
    relatedQuestionRefs:
      - QE008
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
