      - ["Launch exclusive products and generate buzz", "Brands need attention, rankings, and fast sell-through", "Musinsa Edition, Musinsa Drop, and offline pop-ups/stores", "126 collaborations last year; 119 releases in Jan-Apr 2026; Sulwhasoo x Le Je sold out within 30 minutes", "No disclosed conversion, margin split, or repeat-purchase data by drop"]
      - ["Improve product understanding before purchase", "Apparel buyers need fit, sizing, and richer product storytelling", "200+ detailed pages per month plus fit guides and sizing information", "Customers who viewed supported detailed pages converted at about 2.35% monthly", "Traffic base, A/B methodology, and absolute uplift versus untreated pages are not disclosed"]
      - ["Translate offline/global interest into online demand", "Overseas shoppers need local-language trust signals and easy digital follow-up", "Musinsa Global plus QR-linked reviews at pop-ups and curated overseas retail", "Tokyo pop-up exposed >2,800 products to QR reviews; 64% searched product info/reviews; Japan new members rose 2.7x", "No public data on returns, delivery times, customer support, or repeat order quality by market"]
    notes: "Benefits are only the quantities stated in the cited sources; the table does not infer unreported conversion rates, retention, or profitability."
    claimRefs: [CE003, CE006, CE007, CE009, CE010, CE013]
  - id: "TE003"
    title: "Technology / operating architecture table"
    columns:
      - "Layer / process / component"
      - "Role"
      - "Dependency"
      - "Risk"
    rows:
      - ["Community + discovery content", "Attracts fashion interest and frames brand discovery through editorial/community context", "Ongoing content production and curation relevance", "Public evidence proves the surface exists, but not recommendation quality or ranking integrity"]
      - ["Brand enablement services", "Helps partner brands onboard, finance inventory, plan products, and market through creators", "Funding capacity, Partner Stage operations, and creator network participation", "Benefits may be strategically powerful, but the public record does not show ROI by service or default/loss experience on funding support"]
      - ["Exclusive launch and activation engine", "Uses Edition, Drop, and offline events to create scarcity and category expansion", "Brand cooperation, event execution, and merchandising speed", "Launch cadence is visible, but repeatability and gross profit by program are not public"]
      - ["Cross-border and offline channel stack", "Connects domestic assortment to Musinsa Global, overseas pop-ups, and partner-led local stores", "Localization, logistics, retail partners, and inventory coordination", "International expansion could add operational complexity before market-level economics are proven"]
      - ["Trust and quality-control layer", "Screens listings, handles refunds/bans, and adds AI review after seller controversies", "Seller governance process and model/ops accuracy on large listing counts", "Adverse evidence suggests controls have been reactive; preventive QA, security, and compliance maturity remain under-disclosed"]
    notes: "This is an operating-model map inferred from the cited public evidence, not a disclosed system architecture or vendor stack diagram."
    claimRefs: [CE004, CE006, CE008, CE009, CE013, CE015, CE016]
