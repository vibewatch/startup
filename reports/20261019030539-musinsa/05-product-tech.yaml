callouts:
  - calloutType: "strength"
    title: "Seller-enablement flywheel is the clearest product differentiator"
    body: "Musinsa looks structurally stronger than a pure apparel catalog because it pairs demand aggregation with financing, creator marketing, detailed content production, and exclusive launch infrastructure for partner brands."
    claimRefs: [CE004, CE006, CE008, CE014]
  - calloutType: "risk"
    title: "Control maturity is still more asserted than proven"
    body: "The adverse evidence shows Musinsa adding AI review and stronger bans after seller scandals, but the reviewed public materials still do not disclose the architecture, service levels, or compliance artifacts needed to underwrite platform resilience."
