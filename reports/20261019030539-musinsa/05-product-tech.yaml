      - ["Musinsa Global", "Non-Korean shoppers and partner brands seeking export demand", "Active cross-border channel with ~4,000 brands in 13 strategic markets outside China", "Pairs cross-border assortment with localized review lookup and global member acquisition loops", "Need country mix, repeat rate, logistics SLA, and return/refund data"]
      - ["Musinsa Store / pop-up retail", "Shoppers seeking discovery and physical trial", "Active curated retail and event format", "Turns editorial demand and launch programs into physical brand-acquisition surfaces", "Need sales per square meter, four-wall profitability, and payback by location type"]
      - ["Musinsa Edition / Drop / Beauty launches", "Brands launching exclusives and category adjacencies", "Active since 2024 and still accelerating", "Exclusive drops create reasons to visit Musinsa that are hard to replicate on generic multi-platform listings", "Need contribution margin, repeat-buyer uplift, and vendor economics by launch type"]
    notes: "Sources combine official pages and independent reporting; rows reflect visible public surfaces, not a complete internal product org chart."
    claimRefs: [CE001, CE002, CE003, CE009, CE010, CE011, CE012]
