  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: marketplace-take-rates
      missingEvidence: Public take rates, seller fees, and realized discounting for Musinsa, Brandi, Trenbe, and other direct peers.
      whyItMatters: Commercial terms determine whether Musinsa's broader seller stack produces real economic lock-in or just higher operating scope.
      diligencePath: Request seller contracts, brand onboarding decks, or procurement-side quotes from Musinsa and named peers.
    - type: missing-source
      severity: material
      topic: peer-operating-metrics
      missingEvidence: Recent GMV, MAU, order-frequency, and retention data for Brandi, Trenbe, Poison, and department-store alternatives.
      whyItMatters: Public competitor profiles show funding and category focus, but they do not reveal whether Musinsa is winning on engagement or only on narrative breadth.
      diligencePath: Pull direct filings, investor decks, app-data panels, or media interviews for each named peer and refresh the comparison matrix.
    - type: missing-source
      severity: material
      topic: trust-controls
      missingEvidence: Pre-listing QA metrics, seller-removal rates, refund incidence, and post-incident remediation data after marketplace quality controversies.
      whyItMatters: Trust is a core switching-cost variable for buyers and brands, and retained adverse evidence is stronger on incidents than on control effectiveness.
      diligencePath: Request Musinsa policy disclosures, regulator correspondence, or independent testing and consumer-complaint datasets tied to marketplace quality.
