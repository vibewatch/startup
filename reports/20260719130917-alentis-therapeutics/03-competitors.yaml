artifact: competitors
slug: alentis-therapeutics
runDate: '2026-07-19'
company:
  name: Alentis Therapeutics
chapter:
  number: 3
  title: Competitors
  summary: 'Alentis does not face a crowded set of exact CLDN1 peers, but it still operates in an intense competitive field. In oncology, the nearest commercialization precedent is not another CLDN1 company but Astellas’ approved CLDN18.2 drug VYLOY, while the real modality bar is set by large-pharma ADC franchises such as Daiichi Sankyo’s deruxtecan portfolio. In fibrosis, Alentis is even less alone: Madrigal already sells Rezdiffra, 89bio and Akero are in Phase 3 with FGF21 programs, and Novo Nordisk has Phase 3 semaglutide data plus Priority Review. The implication is that Alentis’ moat is strongest on target novelty and weakest on clinical proof, diagnostics, and time-to-market.'
contentRequirements:
- Landscape covering direct peers, incumbents, adjacents, substitutes, status quo, internal build, and likely entrants.
- Competitor profiles with scale, funding, target customer, product scope, pricing, and strategic direction.
- Comparisons on capability, pricing, GTM/distribution, and trust/regulatory posture.
- Switching cost, lock-in, multi-homing, distribution power, and supply/partner access.
- Moat durability, commoditization or displacement risk, and adverse competitor evidence.
