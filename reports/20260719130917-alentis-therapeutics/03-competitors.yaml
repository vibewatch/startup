- calloutType: risk
  title: The real competitive threat is maturity, not copycats
  body: Alentis is more exposed to displacement by companies that already possess approved labels, Phase 3 histology programs, or scaled ADC operations than by another exact CLDN1 startup. The company must prove that target novelty can outrun other players’ clinical and commercial head start.
