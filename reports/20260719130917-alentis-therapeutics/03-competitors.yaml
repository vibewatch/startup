- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Alentis moat claim
  - Competitive threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - First CLDN1 mover in oncology
    - Direct peers are sparse today, but adjacent claudin and ADC incumbents can define buyer expectations before CLDN1 is proven
    - High
    - Track first human selectivity and response data; compare against biomarker-workflow precedents like VYLOY
  - - Shared CLDN1 thesis across oncology and fibrosis
    - Tumor and tissue context may make CLDN1 commercial relevance non-transferable across indications
    - High
    - Demand indication-by-indication biomarker prevalence and response evidence rather than platform-level extrapolation
  - - Mechanistic novelty in fibrosis
    - Rezdiffra is already approved and 89bio/Akero/Novo are later-stage in MASH
    - High
    - Test whether CLDN1 biology yields differentiated efficacy or tolerability that metabolic entrants cannot match
  - - ADC participation in oncology
    - Large-pharma deruxtecan franchises already have approval breadth, physician familiarity, and safety-management playbooks
    - High
    - Review partnering strategy, manufacturing readiness, and trial-site quality relative to ADC incumbents
  - - Potential CLDN1 diagnostic moat
    - No public CLDN1 companion-diagnostic pathway is yet visible, while VYLOY already launches with one
    - Medium
    - Map assay-development partners, cutoffs, and pathology workflow before underwriting launch timing
  - - Strong investor syndicate
    - Capital support helps runway but does not close distribution, regulatory, or commercialization gaps versus Astellas, Daiichi, or Novo
    - Medium
    - Pressure-test post-Series D runway, partnering appetite, and willingness to out-license geography or indications
  notes: Severity reflects near-term displacement risk rather than ultimate scientific value. Several risks can be reduced if Alentis produces unusually clean human biomarker-response data in 2026-2027.
