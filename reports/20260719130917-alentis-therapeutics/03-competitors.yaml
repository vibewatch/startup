evidenceStrategy:
- Competitor official surfaces — product, pricing, docs, case studies, security/compliance, integrations, channel pages, changelog.
- Independent proof — benchmarks, reviews, filings, market reports, customer references, adverse reporting.
- Never treat vendor-authored comparison pages as independent proof.
qualityBar:
- Compare every material way the buyer can solve the same job, including status quo and internal build.
- Mark unsupported matrix cells as unknown or evidence gaps; never guess.
- Include adverse/disconfirming evidence on displacement, commoditization, or incumbent response.
- Query by competitor class; do not build the matrix from one generic comparison source.
sections:
- id: landscape-shape
  title: 'Landscape shape: few exact CLDN1 peers, many adjacent incumbents'
  body: Alentis competes in a deceptively asymmetric landscape. On the narrowest definition—companies advancing CLDN1-targeted drugs into the clinic—public sources still show very few direct peers. That scarcity supports the company’s first-in-class narrative, but it does not mean the field is empty. The closest commercialization precedent today is Astellas’ VYLOY, a CLDN18.2-targeted antibody that proves claudin biology can be commercialized when a biomarker threshold, approved test, and defined tumor segment are in place. The broader modality bar is even higher. Daiichi Sankyo’s May 2026 pipeline shows five deruxtecan ADC families, while approved products such as ENHERTU and DATROWAY already give buyers, investigators, and partners a concrete view of what a scaled ADC franchise looks like. In other words, Alentis is competing less against a swarm of CLDN1 startups than against adjacent claudin and ADC incumbents with established safety databases, trial operations, and commercialization
    muscle.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP006
  - CP007
  - CP009
  - CP010
  - CP012
  - CP023
  - CP027
  - CP035
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: oncology-stack
  title: 'Oncology stack: claudin precedent plus large-pharma ADC execution'
  body: The oncology comparison that matters most is not target identity alone but whether Alentis can translate CLDN1 selectivity into a launch model that looks credible next to better-developed franchises. VYLOY shows the opportunity and the cost of biomarker-led commercialization. Astellas’ official HCP materials define CLDN18.2 positivity at a strict immunohistochemistry threshold and pair approval with FDA-approved testing, but they also document substantial nausea, vomiting, hypersensitivity, and infusion-management burdens. The deruxtecan labels make the bar more demanding still. ENHERTU already spans multiple HER2 indications across breast, lung, gastric, and tumor-agnostic settings, while DATROWAY adds another approved topoisomerase-I ADC with meaningful ILD, ocular, and stomatitis liabilities. Alentis therefore enters oncology with a differentiated target but without the breadth, human safety depth, or diagnostic infrastructure that incumbents already possess. Its direct CLDN1
    scarcity is real, yet the actual competitive benchmark is the operational competence of large-pharma ADC programs.
  claimRefs:
