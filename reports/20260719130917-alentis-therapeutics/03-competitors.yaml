- calloutType: strength
  title: Direct CLDN1 scarcity still has strategic value
  body: 'Even in a crowded ADC and fibrosis market, Alentis still benefits from a genuine scarcity signal: retained public sources do not show an approved CLDN1 therapy or a swarm of mature CLDN1 peers. If human data validate the target, that scarcity could translate into partner interest.'
  claimRefs:
