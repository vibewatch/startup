  rows:
  - - Alentis (ALE.P02 / ALE.P03 / lixudebart)
    - Direct CLDN1 innovator
    - Private Series D-backed clinical-stage biotech with two oncology ADCs and one fibrosis antibody program in clinic
    - CLDN1-positive squamous/solid tumors plus organ fibrosis
    - Only retained company pursuing one CLDN1 narrative across oncology and fibrosis
    - No approved product, no disclosed CLDN1 diagnostic launch model, and early human oncology maturity
  - - Astellas / VYLOY
    - Adjacent claudin incumbent
    - Large-pharma sponsor with an approved CLDN18.2 product
    - HER2-negative CLDN18.2-positive advanced gastric/GEJ cancer
    - Proves claudin-targeted commercialization and companion-testing workflow
    - Different target, different tumor focus, and meaningful infusion/emesis burden
  - - Daiichi Sankyo ADC franchise
    - Modality incumbent
    - Large-pharma ADC portfolio with five DXd families in May 2026 pipeline materials plus marketed brands
    - Multiple solid-tumor segments across HER2, TROP2, HER3, and other targets
    - Execution depth, safety database, and global development footprint
    - Not a direct CLDN1 competitor, so target-specific insight is limited
  - - Madrigal / Rezdiffra
    - Fibrosis incumbent
    - Commercial sponsor of an approved MASH therapy
    - Adults with noncirrhotic MASH and F2-F3 fibrosis
    - First approved fibrosis-market entry in retained set
    - Label is narrow and safety/interaction burdens remain material
  - - 89bio / pegozafermin
    - Late-stage fibrosis rival
    - Clinical-stage company with active Phase 3 MASH program
    - Noncirrhotic MASH F2-F3 plus broader liver/cardiometabolic disease
    - Explicit accelerated-approval path and planned commercial SC formulation
    - Metabolic mechanism rather than CLDN1 biology; still pre-approval
  - - Akero / efruxifermin
    - Late-stage fibrosis rival
    - Clinical-stage company running three Phase 3 SYNCHRONY studies
    - MASH from F2/F3 through cirrhosis and real-world staging
    - Broad Phase 3 footprint and human histology dataset
    - Still pre-approval and not oncology-adjacent
  - - Novo Nordisk / semaglutide in MASH
    - Likely entrant / substitute pressure
    - Large-pharma obesity franchise with Phase 3 MASH data and Priority Review
    - Noncirrhotic MASH with moderate to advanced fibrosis
    - Could import obesity-scale prescribing power into fibrosis
    - Not approved for MASH in retained source and not CLDN1-specific
  notes: The relevant competitor set spans direct CLDN1, adjacent claudin, modality incumbents, approved fibrosis incumbents, late-stage fibrosis entrants, and likely big-pharma entrants rather than only exact target matches.
