  rows:
  - - ALE.P02 / ALE.P03 (Alentis)
    - IV ADC; exact cadence not retained
    - Pre-commercial; no public price signal
    - CLDN1 oncology strategy with two payload variants
    - No payer anchor, no CLDN1 test precedent, early safety/efficacy proof pending
    - Commercial model is still hypothetical
  - - VYLOY (Astellas)
    - IV oncology biologic with chemo
    - Official retained sources do not disclose price
    - First approved claudin-targeted launch model
    - Requires FDA-approved test; high nausea/vomiting and infusion burden
    - Shows how narrow biomarker and workflow discipline can still be commercially relevant
  - - ENHERTU
    - IV infusion once every 3 weeks
    - Official retained sources do not disclose price
    - Broad approved HER2 ADC franchise across multiple tumors
    - Severe ILD/pneumonitis warning and specialist ADC monitoring burden
    - Raises the expected bar for ADC safety operations and physician confidence
  - - DATROWAY
    - IV infusion once every 3 weeks
    - Official retained sources do not disclose price
    - Approved TROP2/topoisomerase-I ADC comparator
    - ILD, ocular toxicity, and stomatitis require active management
    - Demonstrates that even approved ADCs can remain operationally heavy
  - - Rezdiffra
    - Oral commercial therapy; exact cadence not retained in fetched text
    - Official retained sources do not disclose price
    - Approved fibrosis therapy for noncirrhotic MASH F2-F3
    - Hepatotoxicity, gallbladder, statin, and cirrhosis-use limits
    - Fibrosis competitors can win with less cumbersome delivery than an infused biologic
  - - Pegozafermin (89bio)
    - Weekly or every-two-weeks SC injection
    - Pre-commercial; no public price signal
    - Late-stage anti-fibrotic metabolic entrant with planned commercial formulation
    - Still unapproved and biopsy-driven trial burden remains
    - Defines a convenient future packaging benchmark in fibrosis
  - - Efruxifermin (Akero)
    - Once-weekly regimen highlighted in retained source
    - Pre-commercial; no public price signal
    - Late-stage FGF21 fibrosis entrant with broad Phase 3 program
    - Still unapproved and longer-term safety/commercial model unresolved
    - Adds another non-oral but non-infusion comparator in fibrosis
