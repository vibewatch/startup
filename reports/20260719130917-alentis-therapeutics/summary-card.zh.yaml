summary:
  headline: >-
    Alentis 围绕肿瘤 ADC 和纤维化搭起可信的首创同类 CLDN1 平台，背后有大额 Series D 和可见临床推进。最强公开信号是靶点逻辑一致、高质量融资和多中心试验启动；最弱的是估值透明度、现金 /
    跑道披露，以及人体疗效证据。在定价轮条款或干净人体数据显著降低投资评估不确定性前，应保持观察 / 继续研究。
