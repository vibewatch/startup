  topStrengths:
    - 统一的 exposed-CLDN1 平台横跨肿瘤 ADC 和纤维化，让故事比单资产生物技术公司更有厚度。
    - $181.4M Series D 由一线投资者领投，给出明确近端融资信号和催化剂窗口。
    - ALE.P02 和 ALE.P03 均处于 Phase 1/2，ALE.P03 已有 41 个站点的全球招募版图。
    - Lixudebart 增加器官纤维化可选性，覆盖肾、肝和计划中的肺部开发路径，而不是纯肿瘤投资逻辑。
    - Claudin 生物学已有 VYLOY 商业先例，支撑整个靶点家族的可成药性。
  topRisks:
    - 主要肿瘤 ADC 还没有公开人体疗效证据，估值高度押注即将到来的临床数据。
    - Series D 定价条款、股权结构堆叠、现金余额和跑道都未披露，普通股投资评估只能粗算。
    - FDA 剂量优化预期和 CLDN1 生物标志物筛选，会带来实质安全性、入组和执行风险。
    - ADC 竞争场很深，Madrigal 等获批纤维化龙头在商业验证上远远领先。
    - 仍没有付费商业客户；当前客户证明是专科中心招募，而不是变现。
  unresolvedGaps:
    - Series D 股价、出售股权比例、投前 / 投后估值和清算优先权未公开。
    - 当前现金、烧钱速度、现金跑道和下行运营方案未公开。
    - CLDN1 检测供应商、阈值、阳性率、周转时间和筛选失败漏斗仍未公开披露。
    - ALE.P02 和 ALE.P03 的人体剂量、安全性和疗效数据，仍是决定价值的核心未解变量。
    - ADC 项目的 CMC 细节——linker 分析、DAR 和放大生产可重复性——仍属私有信息。
