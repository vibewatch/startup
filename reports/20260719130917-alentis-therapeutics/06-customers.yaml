- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / User / Payer
  - Use case
  - Scale / current footprint
  - Strategic value
  - Gap / unknown
  rows:
  - - CLDN1-positive squamous-tumor patients (ALE.P02)
    - 'User: oncology patient; Buyer/Payer later: hospital + oncology payers'
    - First-in-human ADC use in advanced/metastatic squamous tumors
    - Ongoing Phase 1/2; 170 planned patients
    - Lead path to commercial oncology proof
    - No price, coverage, or screen-failure data
  - - Selected solid-tumor patients (ALE.P03)
    - 'User: oncology patient; Buyer/Payer later: hospital + oncology payers'
    - CLDN1-targeted ADC monotherapy in five named tumor types
    - Recruiting Phase 1/2; 180 planned; 41 named sites
    - Best current customer-proof surface
    - No disclosed dosing conversion or commercial demand
  - - Fibrosis patients (lixudebart)
    - 'User: renal/hepatology/pulmonology patient; Payer later: specialty medical benefit'
    - Anti-fibrotic antibody for renal, liver, and lung fibrosis
    - Renal trial ongoing; liver study completed; IPF planned
    - Diversifies customer thesis beyond oncology
    - No registrational proof or payer strategy
  - - Investigators and specialist sites
    - 'Buyer/User today: investigators, sites, coordinators under protocol'
    - Recruit, dose, monitor, and report
    - Named centers across US, Europe, Asia
    - Only real deployment channel today
    - No disclosed site economics or retention
  - - Diagnostics ecosystem
    - 'User: pathologists/labs; Payer later: testing reimbursement systems'
    - CLDN1 testing and patient selection
    - Central-lab CLDN1 analysis required in ALE.P03
    - Critical gate to future adoption
    - Assay vendor, turnaround time, and companion-diagnostic plan undisclosed
  - - Large-pharma counterparties
    - 'Buyer/Payer: potential partner/acquirer'
    - Co-development, commercialization, or acquisition
    - No disclosed partner today; only adjacency signals
    - Could turn clinical proof into commercial scale
    - Relationship status and appetite unknown
  notes: Alentis’ customer map is role-based, not revenue-based. Current “customers” are primarily trial sites and protocol participants; future commercial buyers and payers are still prospective.
