callouts:
- calloutType: risk
  title: No paying customers yet — all current proof is clinical, not commercial
  body: Alentis has credible early deployment into high-quality specialist centers, but that should not be confused with customer traction. There are no approved products, no disclosed commercial accounts, no payer coverage, no repeat-purchase behavior, and no revenue concentration metrics. The company’s current “customer proof” is really trial recruitment plus site activation.
  claimRefs:
  - CU001
  - CU011
  - CU021
  - CU035
  - CU038
- calloutType: insight
  title: The real commercial bottleneck is the biomarker-and-center workflow
  body: The decisive customer question is not whether CLDN1 sounds interesting. It is whether Alentis can move enough biomarker-positive patients through central-lab testing, prior-line filters, specialist-site throughput, IV infusion, and future reimbursement processes to create a scalable market. That makes assay workflow and screen-failure data disproportionately important diligence items.
  claimRefs:
  - CU015
  - CU016
  - CU019
  - CU023
  - CU037
