- id: deployment-trajectory
  title: Adoption trajectory — trial status, enrollment, and site footprint are the only real usage metrics
  body: 'Because Alentis is precommercial, conventional adoption measures such as active accounts, units sold, ARR, or repeat purchase do not exist. The strongest public substitutes are study status, planned enrollment, and site footprint. Across official and registry sources, Alentis currently shows two ongoing oncology trials and one ongoing renal-fibrosis trial, plus a completed liver-fibrosis study that provides historical dosing proof. Summing disclosed planned enrollment for the ongoing interventional studies yields 410 planned participants: 170 for ALE.P02, 180 for ALE.P03, and 60 for RENAL-F02. ALE.P03 is the clearest real-time deployment signal because its registry mirrors show a recruiting Phase 1/2 study that started on 26 August 2025, is administered by IV infusion, and lists 41 study locations across France, Italy, the Netherlands, Singapore, Spain, Taiwan, and the United States. Lixudebart offers a weaker but still useful proof line: by January 2025, public company and news
    sources reported 26 renal-trial patients dosed and 41 liver-fibrosis patients dosed. That is meaningful clinical deployment, but it still falls far short of commercial adoption.'
  claimRefs:
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  - CU020
  - CU033
  - CU034
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: named-proof
  title: Named customer proof — specialist cancer centers and recruitment surfaces, not paid accounts
  body: 'The best public customer proof is not a logo wall or a generic statement about partnerships. It is the presence of named recruiting institutions, contact points, and protocol detail. The ALE.P03 registries and patient-facing mirrors identify many of the exact centers currently touching the product workflow: Mayo Clinic Comprehensive Cancer Center, MD Anderson Cancer Center, USC Norris, Yale Comprehensive Cancer Center, University of Chicago, John Theurer Cancer Center, Gustave Roussy, Vall d’Hebron, the Netherlands Cancer Institute, National Cancer Centre Singapore, and National Taiwan University Hospital, among others. Those are credible, specialist institutions that matter in oncology adoption. The same mirrors disclose an Alentis clinical-trial contact, inclusion criteria, and central-laboratory CLDN1 testing, which makes the evidence materially better than simple press-release claims. Still, this is prelaunch proof. These sites are recruiting study participants, not buying a
    marketed product or signing disclosed commercial contracts. There are no customer testimonials, procurement records, production deployments, or revenue disclosures that would justify calling any of these institutions commercial accounts. The right interpretation is that Alentis has achieved early workflow penetration into elite centers, not customer monetization.'
  claimRefs:
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU030
  - CU035
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: retention-and-friction
  title: Retention and procurement friction — the gating questions are biomarker, eligibility, and reimbursement
  body: The deepest customer risk is that Alentis can clear early enrollment hurdles yet still face a narrow eventual market because access depends on specialist workflows. For ALE.P03, public mirrors say patients must provide tissue for CLDN1 analysis in a central laboratory, have metastatic disease progression, have exhausted or failed prior standard regimens, and generally present with ECOG 0/1 plus adequate organ function. Exclusions include active CNS disease requiring treatment, significant gastrointestinal bleeding, active infection, and symptomatic or clinically important pneumonitis/interstitial lung disease. Those are standard for oncology trials, but collectively they imply that the addressable customer at launch will be screened down at multiple steps before a patient ever reaches infusion. Public sources also show that the therapy is given by IV infusion, which reinforces the need for specialist sites and operational throughput. Retention metrics such as NRR, GRR, contract renewal,
    or satisfaction scores do not exist. The relevant future retention proxy is whether diagnostic infrastructure, screening conversion, site throughput, and payer coverage can sustain a treatment journey from biopsy to infusion to follow-up. Foundation Medicine, Guardant, and Roche illustrate how mature the surrounding precision-oncology ecosystem already is; Alentis still has to plug into it.
  claimRefs:
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU021
  - CU022
  - CU028
  - CU029
  - CU031
  - CU037
  - CU038
  tableRefs:
  - TU004
- id: expansion-and-concentration
  title: Expansion path and concentration risk — promising counterparties, but no actual customers yet
  body: 'If Alentis succeeds, its customer expansion path is likely to look like a business-development motion, not a direct enterprise-sales motion. Positive human data could let the company broaden from current specialist-site usage into land-and-expand deployment across more tumor types, more fibrosis organs, and one or more large-pharma partnerships. Roche is notable because it combines pharmaceuticals and diagnostics under one roof and explicitly frames oncology around personalized healthcare. AbbVie emphasizes solid tumors and ADC-style biomarker-targeted modalities. Novartis and Merck each show deep oncology investment, broad pipelines, and provider-facing ecosystems that make them plausible future counterparties or competitive benchmarks. But none of these pages is evidence of an Alentis relationship today. That creates a sharp concentration problem: the entire customer thesis currently rests on a handful of ongoing studies, a finite set of specialist centers, and hoped-for future
    partner interest. There is no payer coverage evidence, no pricing evidence, no top-customer revenue concentration because there is no revenue, and no proof that trial participation converts into commercial adoption. Expansion potential is real, but it remains contingent on clinical proof, assay workflow, and partner appetite.'
