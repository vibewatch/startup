- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Expand from current tumor cohorts into broader CLDN1+ oncology use
    - Current proof concentrated in a small number of trials and elite centers
    - Weak data would collapse the customer thesis quickly
    - Verify screen-failure rates, site throughput, and first efficacy signals
  - - Use fibrosis branch to diversify beyond oncology
    - Public customer proof is much weaker in fibrosis than in ALE.P03
    - Diversification may be more theoretical than commercial near-term
    - Request full RENAL-F02 and FEGATO site/deployment details
  - - Land-and-expand via pharma partnership or acquisition
    - No disclosed strategic partner today
    - Counterparty risk is total because there is no fallback revenue base
    - Review BD outreach, inbound interest, and deal-room materials
  - - Embed into precision-diagnostics workflows
    - Central-lab CLDN1 gating could slow adoption if assay logistics are hard
    - Even good data may not scale operationally
    - Request assay vendor, turnaround, and companion-diagnostic plan
  - - Specialist-center launch model
    - Commercial path may stay limited to tertiary centers initially
    - Caps early account count and slows diffusion
    - Stress-test launch assumptions against specialist-center capacity
  notes: The expansion thesis is credible but highly contingent. Without clinical proof and a workable assay workflow, the customer base stays narrow and concentrated.
