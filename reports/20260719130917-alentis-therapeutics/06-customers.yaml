slug: alentis-therapeutics
runDate: '2026-07-19'
company:
  name: Alentis Therapeutics
chapter:
  number: 6
  title: Customers
  summary: 'Alentis has no approved products and therefore no conventional paying commercial customers yet. The real customer surface today is prelaunch and clinical: patients with CLDN1-positive tumors or fibrosis, recruiting investigators and specialist centers, central-lab and precision-oncology testing workflows, and future large-pharma counterparties that could partner or acquire the platform if human data validate it. Public deployment proof is strongest around ALE.P03, whose trial mirrors show a recruiting Phase 1/2 study with 180 planned participants and 41 named sites across Europe, Asia, and the US, including Mayo Clinic, MD Anderson, Gustave Roussy, Vall d’Hebron, NKI, and NCCS. Across public sources, the best supportable adoption metrics are trial status, enrollment targets, site footprint, and patient-dosing updates in fibrosis—not revenue, retention, or account growth. The verdict is that Alentis has credible early customer-proof in specialist-center deployment and strategic
    buyer adjacency, but zero commercial traction and meaningful biomarker, recruitment, and reimbursement friction ahead of launch.'
contentRequirements:
- Customer base segmentation by buyer/user/payer, geography, vertical, size, channel, use case, or revenue band.
- Adoption trajectory (active usage, repeat purchase, deployment, accounts, locations, utilization) where supportable.
- Named customer proof — production vs pilot, outcomes, reference quality, evidence freshness.
- Retention/durability — NRR, GRR, churn, renewal, contract length, cohorts, satisfaction, or gaps.
- Expansion and concentration — land-and-expand, top-customer risk, channel/partner dependence, procurement friction.
