figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: The future customer path for Alentis starts with diagnosis and biomarker screening, moves through specialist-center enrollment and IV infusion, and only later opens into payer and partner-scale commercialization.
  data:
    nodes:
    - id: diagnosis
      label: Tumor / fibrosis diagnosis
      description: Specialists identify a patient with a potentially CLDN1-relevant cancer or fibrosis setting
    - id: biopsy
      label: Tissue / biomarker workup
      description: Patient tissue is gathered and, in ALE.P03, sent for CLDN1 analysis in a central laboratory
    - id: eligibility
      label: Protocol eligibility filter
      description: Prior-line failure, ECOG, organ function, and exclusion criteria narrow the reachable patient set
    - id: site
      label: Specialist-center enrollment
      description: Patients enter the workflow only through experienced academic or tertiary cancer centers
    - id: infusion
      label: IV treatment / monitoring
      description: ALE.P03 is administered by IV infusion and monitored under study protocol
    - id: evidence
      label: Clinical data generation
      description: Safety, PK/PD, response, and biomarker data create the proof needed for scale
    - id: scale
      label: Payer + partner scale-up
      description: Only positive human data would open the path to broader reimbursement and pharma partnering
  approximationNotes: This journey is forward-looking and mostly clinical today. The only realized part of the journey is specialist-site recruitment and study conduct, not commercial reimbursement.
