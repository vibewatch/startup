company:
  name: Alentis Therapeutics
chapter:
  number: 1
  title: Company Overview
  summary: 'Alentis Therapeutics is a Basel-area clinical-stage biotech built around Claudin-1 biology, with roots in Thomas Baumert’s Strasbourg and Inserm research and a disclosed financing stack that now spans Series A through a $181.4 million Series D. The company’s public profile strengthened materially in 2024-2025: ALE.P02 won FDA IND clearance and Fast Track designation, ALE.P03 entered the clinic, lixudebart produced early fibrosis data, and the leadership bench was upgraded with a new CEO, CFO, and additional operating hires. What is strongest in the evidence is the combination of target-specific differentiation and investor quality; what remains under-disclosed is valuation, cap-table structure, revenue, exact headcount, and cash runway.'
