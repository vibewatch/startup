- id: capital-base-and-investor-quality
  title: Capital base, investor quality, and disclosure limits
  body: 'Alentis has assembled one of the more credible private financing stacks among European target-platform biotechs. The funding chronology begins with a CHF12.5 million Series A at launch in 2019, followed by a $67 million Series B in 2021, a $105 million Series C in 2023, and a $181.4 million oversubscribed Series D in November 2024. The investor pattern matters as much as the amounts. Earlier rounds brought in specialist European life-science investors, while the latest round was led by OrbiMed with Novo Holdings and Jeito Capital as co-leads and added Frazier Life Sciences, Longitude Capital, Catalio Capital, Piper Heartland Healthcare Capital, and Avego. That is the profile of a company that has moved out of seed-stage science risk and into late-private syndication for clinical catalysts. At the same time, Alentis still does not publicly disclose its post-money valuation, cap table, liquidation preferences, revenue, or cash position. BioSpace’s financing analysis underscored the
    mixed message: the Series D was large enough to support talk of a possible Nasdaq IPO path, but management was still operating in a challenging biotech market where investor appetite remained selective. So the financing quality is clearly strong, while the price of entry and dilution stack remain opaque.'
  claimRefs:
  - CO015
  - CO016
