sections:
- id: identity-origin-and-footprint
  title: Identity, scientific origin, and operating footprint
  body: 'Alentis Therapeutics is a clinical-stage Swiss biotechnology company built around a single biological wedge: exposed Claudin-1. The company’s official materials describe Claudin-1 as a tight-junction protein that becomes overexpressed and externally exposed in fibrotic tissue and in multiple solid tumors, creating a target that can be addressed with antibodies and antibody-drug conjugates. That framing matters because Alentis is not pitching a broad platform in search of a disease; it is pitching a target-centric company whose oncology and fibrosis franchises both rest on the same biology. The company says it was founded in 2019 after more than 15 years of research by Professor Thomas Baumert and collaborators at the University of Strasbourg and Inserm, and the original launch release ties the initial intellectual property to Strasbourg, Inserm, Mount Sinai, and local technology-transfer infrastructure. Today the company presents itself as headquartered in Basel, Switzerland, with
    an R&D subsidiary in Strasbourg and clinical operations in the United States. That footprint is consistent with a European discovery base that now needs US regulatory and clinical execution to convert Claudin-1 science into registrational oncology data.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO011
  - CO036
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: leadership-governance-and-advisory-depth
  title: Leadership, governance, and advisory depth
  body: 'The leadership profile became materially more “late-private biotech” in 2024 and 2025. Mark Pruzanski joined as chief executive officer in October 2025, replacing Roberto Iacone, who had led the company from the early buildout through the Series D financing and initial oncology IND transition. Pruzanski’s background at Versanis Bio and Intercept Pharmaceuticals is relevant because it gives Alentis a leader with both liver-disease familiarity and capital-markets credibility. The finance function was also upgraded when Jon Freve joined as chief financial officer in September 2024 after IPO experience at Galecto and Spring Bank. On the scientific side, Luigi Manenti serves as chief medical officer, while Alberto Toso moved from head of oncology to chief scientific officer in April 2024 as the company shifted emphasis from a monoclonal-antibody oncology program toward ADC execution. Governance is no longer founder-only: Luca Santarelli chairs the board, William Pao joined as an independent
    member in early 2024, and the board now includes representatives from OrbiMed, Novo Holdings, Jeito, Frazier, and Longitude. The scientific advisory board adds renal-vasculitis, lung-fibrosis, and oncology key opinion leaders, which improves external credibility but also raises expectations for disciplined clinical execution.'
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
