- id: pipeline-state-and-milestone-quality
  title: Pipeline state and milestone quality
  body: 'The strongest reason later chapters can treat Alentis as a real clinical company rather than a speculative discovery story is the state of its pipeline. Oncology now centers on two ADCs, ALE.P02 and ALE.P03, both built around the same anti-CLDN1 antibody but carrying different payloads. ALE.P02 carries a tubulin inhibitor payload and has already achieved both FDA IND clearance and Fast Track designation for advanced or metastatic CLDN1-positive squamous cancers, with the company describing an ongoing Phase 1/2 study planned for 170 patients. ALE.P03 carries a topoisomerase I inhibitor payload and, according to the official pipeline materials, has also entered first-in-human clinical testing. Fibrosis is no longer hypothetical either. Lixudebart, formerly ALE.F02, is already clinical in kidney and liver fibrosis, with RENAL-F02 ongoing in ANCA-associated vasculitis with renal involvement and FEGATO-01 completed in advanced liver fibrosis. Topline January 2025 results reported dose-dependent
    target engagement, favorable safety, and early organ-function signals, while the company is planning a Phase 2 study in idiopathic pulmonary fibrosis. These are meaningful milestones, but they still fall short of registrational proof: Alentis remains dependent on first-in-human oncology readouts and larger fibrosis datasets to validate Claudin-1 as a defensible franchise.'
