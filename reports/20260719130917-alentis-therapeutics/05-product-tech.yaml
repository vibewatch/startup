callouts:
- calloutType: strength
  title: The same CLDN1 biology supports more than one modality
  body: Alentis is not just repackaging a single antibody. The company is using one exposed-CLDN1 thesis to build both tumor-killing ADCs and a fibrosis-reversing monoclonal antibody, which is a credible sign of platform depth if human data continue to hold up.
  claimRefs:
  - CE001
  - CE003
  - CE008
  - CE024
- calloutType: risk
  title: Public technical disclosure still stops short of underwriting detail
  body: The public record is enough to show biological coherence, early clinical entry, and an expanding patent estate. It is not enough to fully underwrite CMC robustness, biomarker cutoffs, payload chemistry decisions, or the long-term off-target and efficacy profile of a first-in-class CLDN1 franchise.
  claimRefs:
  - CE027
  - CE029
  - CE030
  - CE031
  - CE032
  - CE038
