- id: trust-quality-roadmap
  title: Trust, quality controls, and roadmap gaps
  body: The public trust case rests on early regulatory acceptance and selected safety signals, but it is incomplete. ALE.P02 has FDA IND clearance and Fast Track designation, which means the agency accepted a package sufficient to begin human oncology dosing. Lixudebart has completed healthy-volunteer and liver-fibrosis studies and is already in a randomized Phase 2 renal trial, with the company reporting target engagement and favorable early safety. Those are meaningful validation points, but they do not answer the deepest product-risk questions. Public materials still do not provide the kind of technical disclosure an underwriter would want on drug-antibody ratio, linker chemistry beyond “clinically validated,” large-scale CMC reproducibility, biodistribution, companion-diagnostic cutoffs, or the full off-target methodology used to support selectivity claims. The roadmap is visible—ongoing ALE.P02 and ALE.P03 oncology trials, ongoing renal fibrosis work, and a planned IPF Phase 2—but
    the product remains first-in-class enough that execution depends on details the public record still withholds.
