company:
  name: Alentis Therapeutics
chapter:
  number: 5
  title: Product & Technology
  summary: 'Alentis’ product architecture is unusually coherent for a small biotech: the same exposed Claudin-1 biology underlies both its oncology ADC programs and its fibrosis antibody program. ALE.P02 and ALE.P03 use one anti-CLDN1 antibody scaffold with different cytotoxic payloads—a tubulin inhibitor and a topoisomerase I inhibitor—to target CLDN1-positive tumors, while lixudebart is a first-in-class monoclonal antibody intended to reverse fibrosis by blocking exposed CLDN1 signaling and opening the collagen barrier. Independent literature from 2022-2025, much of it tied to Strasbourg/Inserm collaborators and Alentis authors, supports CLDN1 as a mechanistic driver in liver fibrosis, HCC, and PSC models. Patent filings show a maturing IP estate around humanized anti-CLDN1 antibodies, fibrosis-directed mAbs, and exatecan-based CLDN1 ADCs. The platform is differentiated and biologically plausible, but major gaps remain around CMC detail, biomarker workflow, off-target methodology, and
    human efficacy proof.'
