sections:
- id: platform-and-assets
  title: One target, three lead assets, two modality families
  body: Alentis’ product definition is unusually simple at the top level and more nuanced underneath. The company is built around exposed Claudin-1 and currently translates that biology into two modality families. In oncology, ALE.P02 and ALE.P03 are CLDN1-targeted ADCs that use the same anti-CLDN1 antibody but carry different payload classes. In fibrosis, lixudebart is a first-in-class monoclonal antibody designed to reverse organ fibrosis by blocking exposed CLDN1 signaling rather than delivering a cytotoxic payload. This matters in customer-workflow terms because Alentis is not selling a generic “platform” to everyone; it is building asset-specific workflows for oncologists and fibrosis specialists who first need to identify a CLDN1-relevant patient and then administer either a tumor-directed ADC or an anti-fibrotic biologic. The official pipeline now shows two oncology Phase 1/2 programs and a multi-indication clinical fibrosis program, so the product map is already broader than a single
    lead asset even though proof of commercial fit remains early.
  claimRefs:
