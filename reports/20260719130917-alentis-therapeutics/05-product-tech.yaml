- id: mechanism-and-workflow
  title: Clinical mechanism and user workflow
  body: 'The operating workflow differs sharply between oncology and fibrosis, but both depend on the same biological premise: CLDN1 is hidden in healthy tight junctions and becomes overexpressed and exposed in diseased tissue. In oncology, Alentis says its anti-CLDN1 antibody selectively recognizes CLDN1-positive tumor cells, after which ALE.P02 or ALE.P03 is internalized and releases its tubulin-inhibitor or topoisomerase-I payload into tumor tissue. The customer workflow therefore starts with identifying a CLDN1-positive solid tumor, proceeds to infusion of the ADC, and relies on selective internalization to concentrate potency in tumor cells. In fibrosis, lixudebart works differently. The company says the antibody binds exposed CLDN1 without interfering with tight-junction CLDN1, blocks intracellular pro-fibrotic signaling, disrupts physical interactions with collagen-binding receptors, and helps open the collagen barrier. Here the workflow is less about payload delivery and more about
    disease-modifying signaling control, with kidney, liver, and lung fibrosis programs each needing their own staging and response measures. This shared-target, split-mechanism architecture is the heart of the platform.'
  claimRefs:
