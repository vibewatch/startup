    - CLDN1-positive advanced or metastatic squamous solid tumors
    - Phase 1/2 ongoing
    - First-in-class CLDN1 ADC; Fast Track; clinically validated linker/payload components
    - No public efficacy data yet; biomarker workflow still early
  - - ALE.P03
    - Anti-CLDN1 ADC with topoisomerase-I payload
    - Selected advanced or metastatic CLDN1-positive solid tumors
    - Phase 1/2 ongoing
    - Same antibody scaffold with differentiated payload class and broader solid-tumor scope
    - Earlier than commercial proof and public CT details remain sparse
  - - Lixudebart (formerly ALE.F02)
    - Anti-CLDN1 monoclonal antibody
    - Kidney, liver, and lung fibrosis
    - Phase 2 renal ongoing; Phase 1b liver completed; IPF Phase 2 planned
    - Blocks fibrotic signaling rather than delivering a cytotoxic payload
