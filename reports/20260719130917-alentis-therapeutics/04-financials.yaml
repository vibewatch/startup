- id: capital-history-and-use
  title: Capital history and stated use of funds
  body: 'The strongest part of Alentis’ financial record is its disclosed fundraising chronology. The company’s investor page states that Alentis was founded in 2019 with CHF12.5 million in Series A financing, then raised $67 million in Series B in 2021, $105 million in Series C in 2023, and $181.4 million in Series D in November 2024. Without converting currencies, that implies at least $353.4 million of disclosed U.S.-dollar financing plus the Swiss-franc launch round. The official use-of-funds story also evolves clearly. The investor page says Series C was meant to support Phase II and Phase I development of the then-lead ALE.F02 program plus broader CLDN1 platform development, while the Series D announcement and investor page shift emphasis toward building a deep solid-tumor pipeline around CLDN1-targeted medicines. That is consistent with the company’s pivot from fibrosis-led external narrative toward oncology ADC execution. What remains missing is the underwriter’s half of the story:
    the public record still does not disclose post-money valuation, ownership concentration, liquidation stack, or how much of the historical capital remains available today.'
  claimRefs:
  - CI004
  - CI005
  - CI006
  - CI007
