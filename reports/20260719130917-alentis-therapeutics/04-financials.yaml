- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Current public status
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Cash balance
    - Primary runway determinant
    - Not public
    - Cannot calculate survival without new capital
    - Request latest unaudited balance sheet
  - - Monthly / annual burn
    - Determines financing efficiency
    - Not public
    - Cannot pressure-test Series D adequacy
    - Request trailing-12-month burn and 2026 budget
  - - Post-money valuation
    - Frames dilution and return potential
    - Not public
    - Entry attractiveness unresolved
    - Obtain latest cap-table summary or financing memo
  - - Cap table / preference stack
    - Determines control and liquidation outcomes
    - Not public
    - Ownership and downside economics unclear
    - Request cap table, option pool, and preference waterfall
  - - Program-level budget split
    - Shows resource prioritization across oncology and fibrosis
    - Not public
    - Cannot assess focus or portfolio strain
    - Request program budget and headcount allocation
  - - Debt / covenants
    - Affects flexibility and downside risk
    - Not public
    - Potential hidden claims on assets unknown
    - Request debt schedule and covenant package
  - - Commercial pricing assumptions
    - Needed for long-term revenue model
    - Not public and premature
    - Revenue model cannot be quantified yet
    - Revisit after label strategy and payer work are defined
  notes: The chapter’s key message is not that Alentis lacks capital, but that public sources lack the operating disclosures needed to underwrite that capital.
