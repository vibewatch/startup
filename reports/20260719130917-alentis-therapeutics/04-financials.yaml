runDate: '2026-07-19'
company:
  name: Alentis Therapeutics
chapter:
  number: 4
  title: Financials
  summary: 'Alentis is a private, precommercial clinical-stage biotech whose public financial story is far clearer on capital raised than on operating performance. Retained official sources disclose CHF12.5 million at launch, then $67 million Series B, $105 million Series C, and a $181.4 million Series D, implying at least $353.4 million of disclosed U.S.-dollar financing plus the Swiss-franc seed capital. What remains opaque is almost everything an underwriter would normally need next: no public revenue, no cash balance, no burn, no runway, no post-money valuation, and no debt or cap-table detail. The business model today is therefore best understood as financed R&D aimed at producing human data and optionality for partnership, IPO, or acquisition rather than near-term product sales.'
contentRequirements:
- Revenue streams, pricing model, revenue mix, and recognition issues where supportable.
- GTM motion and sales efficiency proxies (cycle, CAC/payback or proxy, channel economics).
- Cost structure, gross margin drivers, working capital, capex, and service-delivery costs.
- Public traction (revenue, ARR, GMV, units, locations, utilization, active users) versus private-metric gaps.
- Capital adequacy and financing dependency — cash on hand, burn, runway, planned use of funds, next-round trigger, and debt/project-finance obligations. Historical round-by-round chronology lives in Company Overview; refer to that chronology in prose, but do not copy Company Overview claim ids; if Financials needs a funding fact, mint a local Financials claim with its own sourceRefs.
- Financial verdict on revenue quality, margin path, capital intensity, and diligence blockers.
