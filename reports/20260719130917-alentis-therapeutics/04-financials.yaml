evidenceStrategy:
- Company financing pages and press releases for round sizes, investor syndicates, and stated use of funds.
- Public-company adjacent comparators for how later-stage MASH and fibrosis programs monetize or require strategic capital.
- Adverse checks focused on missing valuation, cash, burn, runway, debt, and price disclosures rather than fabricated estimates.
qualityBar:
- Separate disclosed facts from inferred financial implications.
- Preserve private-metric gaps explicitly; never fabricate cash, burn, or runway.
- Treat financing announcements as capital raised or committed, not as proof of current cash on hand.
- Use adjacent public-company outcomes only as boundary markers for commercial capital needs, not as direct substitutes for Alentis disclosures.
sections:
- id: revenue-model
  title: 'Revenue model today: financed R&D, not product sales'
  body: 'Alentis does not yet have a commercial P&L in the conventional biotech sense. Retained public sources show a clinical-stage company with oncology ADC and fibrosis assets in human development, but no approved product, no public pricing, and no disclosed sales. That makes the current financial model financing-led rather than revenue-led. The most important inflows in the public record are equity rounds and any future strategic transactions, not prescription revenue. In practical terms, the nearest thing Alentis has to a GTM motion in 2026 is business development: raising specialist capital, generating data that attract future partners, and preserving optionality for an IPO or M&A path. That framing is supported by adjacent examples. 89bio’s 2025 agreement to be acquired by Roche and Akero’s 2025 acquisition by Novo Nordisk show that advanced metabolic-disease assets can monetize through strategic sale before independent large-scale commercialization is fully built. For Alentis, current
    revenue quality is therefore entirely prospective and contingent on future clinical success.'
  claimRefs:
