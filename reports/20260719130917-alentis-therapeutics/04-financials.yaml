- id: adequacy-and-blockers
  title: Capital adequacy, next-round dependency, and diligence blockers
  body: 'The financial verdict is that Alentis looks well financed by private-biotech standards but still cannot be underwritten with confidence from public sources alone. Series D was large and specialist-led, yet it does not substitute for balance-sheet disclosure. There is no retained public figure for cash on hand, monthly burn, runway, debt, or program-by-program spend. There is also no public price anchor for future products, which means revenue-recognition timing, gross-margin path, and commercialization spend must all be deferred to diligence. The most reasonable inference is that future financing dependency now hinges on human data: cleaner oncology readouts, further fibrosis evidence, or a strategic partnership could unlock the next capital step, while weaker data would increase dilution or force narrower prioritization. Adjacent MASH winners demonstrate that moving from late-stage clinical proof to commercialization or strategic exit requires substantial capital and operational
    depth. Alentis may reach that point, but the public record today supports only a capital-strength conclusion, not a runway or unit-economics conclusion, and that distinction is critical.'
