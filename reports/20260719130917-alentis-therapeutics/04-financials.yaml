- id: cost-structure-and-efficiency
  title: Cost structure, sales-efficiency proxies, and capital intensity
  body: 'Because Alentis is precommercial, classic SaaS-style efficiency metrics such as CAC, payback, or gross margin are either inapplicable or undisclosed. The relevant cost question is clinical-platform intensity. Public company materials and Alentis’ own footprint suggest a cost base driven by discovery and translational science in Strasbourg, headquarters functions in Switzerland, and U.S. clinical operations layered on top of multi-program human studies. The company is also carrying both oncology ADC work and fibrosis biology, which implies nontrivial CMC, biomarker, toxicology, and clinical-operations spend before any revenue emerges. Public traction metrics are similarly sparse. Alentis discloses financing milestones and clinical progress, but not revenue, ARR, patient volumes, site productivity, or program-level budget splits. Even employee count is only described directionally as more than 50 on current company pages. Adjacent comparators help frame what success would eventually
    require: Madrigal built the first approved MASH launch, while 89bio and Akero were valuable enough to attract Roche and Novo, respectively, before independent scale-out. Alentis has not yet disclosed a commercial buildout resembling any of those later-stage examples.'
