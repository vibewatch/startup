  title: The capital base is real and unusually credible for a private European biotech
  body: Alentis has assembled a specialist funding stack large enough to move beyond discovery-stage storytelling. The weakness is not capital access; it is the absence of operating disclosure that would show how efficiently that capital is being used.
  claimRefs:
