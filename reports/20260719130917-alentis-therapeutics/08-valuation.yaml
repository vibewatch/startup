company:
  name: Alentis Therapeutics
chapter:
  number: 8
  title: Valuation
  summary: 'Alentis is a private, pre-revenue biotech with strong financing momentum but weak public price discovery. The only hard recent number is the $181.4 million Series D in November 2024, plus management’s stated intent to use the proceeds to launch and advance Phase 1/2 oncology trials and generate data over the next 12–18 months. Public sources still do not disclose the price per share, stake sold, pre-money or post-money valuation, cap-table terms, or current cash/runway, so the financing round is a quality signal rather than a verified valuation anchor. Public comparables provide a wide band: innovation-heavy gene-editing platforms such as CRISPR Therapeutics (~$4.7B), Beam (~$2.8B), Intellia (~$1.6B), and Prime Medicine (~$0.6B) show how much value stage and proof can command, while fibrosis-focused Akero (~$4.5B), 89bio (last known ~$2.2B before Roche’s acquisition agreement), and approved-leader Madrigal (~$12.8B) show what later-stage or commercial fibrosis proof can support.
    Alentis sits far earlier than these leaders on public proof. Our recommendation is TRACK / RESEARCH-MORE with low-to-medium confidence and a high risk rating: underwrite to a wide current EV band of roughly $0.6–1.8B, do not underwrite to an unverified unicorn mark, and re-engage on priced-round terms or clean human proof.'
contentRequirements:
- Investment thesis and anti-thesis tied to market, product, customers, financials, competition, and risks.
- Recommendation, confidence, risk rating, valuation stance, and target return/hold/exit where supportable.
- Current financing/valuation context, entry discipline, dilution/preference overhang, and whether public evidence supports the price.
- Bull/base/bear cases with explicit assumptions, valuation ranges, probability signals, and downside triggers.
- Comparable set — public companies, private rounds, M&A, milestone or model-appropriate references.
- Exit readiness and final diligence asks plus thesis-break triggers.
