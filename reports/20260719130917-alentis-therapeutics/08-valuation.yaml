- id: downside-and-entry-discipline
  title: Downside triggers and entry discipline
  body: 'The most important discipline point is to separate admiration for the platform from willingness to pay. Several things can break the valuation quickly: a safety issue or lack of early activity in the oncology programs, a CLDN1 assay funnel that turns out to be too narrow or too operationally hard, a financing announced on stressed terms before human proof lands, or a competitor data event that makes Alentis look slower or less differentiated. Because public sources do not disclose liquidation preferences, anti-dilution, or the common-equity stack, the downside in a flat or down financing could be materially worse for junior holders than any headline enterprise-value range suggests. This is why current public evidence argues for range-based underwriting and price discipline instead of conviction at a rumored mark. If a new round is priced with strong terms and the company shows clean human proof, the entry debate changes materially. If the company raises again without proof or with
    punitive structure, the bear case becomes much more probable.'
  tableRefs:
  - TV005
  claimRefs:
  - CV030
  - CV031
  - CV032
  - CV033
  - CV034
  - CV037
  - CV039
- id: recommendation-and-diligence
  title: Recommendation and final diligence asks
  body: 'Our recommendation is TRACK / RESEARCH-MORE with low-to-medium confidence, a high risk rating, and a valuation stance of “do not underwrite to an unverified unicorn mark.” The investment case is simply too dependent on missing information: priced-round economics, current cash and burn, cap-table overhang, CLDN1 assay conversion, and early human dose/response evidence. Board quality modestly helps—Luca Santarelli and William Pao add execution and oncology credibility—but governance improvement alone is not a valuation catalyst. The right next step for an investor is not to guess the post-money; it is to force a diligence list that can convert the business from an opaque private story into an underwritable one. The highest-value asks are the Series D term sheet, cash runway, preference stack, assay workflow metrics, and upcoming clinical-readout design. Until those are obtained, a disciplined investor should treat Alentis as a promising but evidence-light private biotech and wait
    either for a clearly priced round or for clean human proof.'
