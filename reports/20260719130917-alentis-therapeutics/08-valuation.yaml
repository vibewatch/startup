callouts:
- calloutType: insight
  title: The right question is not “is Alentis a unicorn?” but “what evidence would justify one?”
  body: The public record is good enough to show a high-quality financing and a credible platform, but not good enough to verify the priced terms of Series D. That makes any simple assertion that Alentis is worth more than $1 billion more narrative than evidence. The disciplined investor flips the burden of proof and demands round terms, cap-table structure, and early human data before paying for that narrative.
  claimRefs:
  - CV002
  - CV003
  - CV004
  - CV031
  - CV038
- calloutType: risk
  title: Why the recommendation is track, not buy
  body: 'Alentis may be a strong company and still be a weak underwriting decision at the wrong price. Public sources leave too many valuation-critical items unknown: current cash, burn, pricing terms, preferences, assay conversion, and human efficacy. Until one of those changes materially, the rational stance is to track the company and wait for either clean proof or a transparently priced entry.'
