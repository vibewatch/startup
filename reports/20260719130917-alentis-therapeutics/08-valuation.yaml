- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Human safety or efficacy miss
    - Meaningful safety signal or no credible activity at tolerable dose
    - Breaks core CLDN1 platform-pricing thesis
    - Pass or mark to bear range
  - - Assay / biomarker bottleneck
    - Low CLDN1 positivity, slow turnaround, or excessive screen failures
    - Undermines enrollment, proof, and eventual commercialization
    - Reduce underwriting range; demand more discount
  - - Stressed financing
    - New round priced flat/down with punitive structure or disclosed runway stress
    - Signals weaker bargaining power and worse common-equity outcomes
    - Avoid or reprice materially lower
  - - Competitive leapfrog
    - Peer data or deals make Alentis look slower or less differentiated
    - Reduces strategic scarcity and exit multiple
    - Tighten comp band and cut bull-case weight
  - - Hidden overhang emerges
    - Preference stack, anti-dilution, or cap-table terms prove aggressive
    - Headline EV no longer maps cleanly to common value
    - Re-underwrite from the cap table upward
  notes: Each trigger is concrete enough to invalidate the thesis rather than merely make the story less exciting.
  claimRefs:
