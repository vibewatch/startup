- id: scenario-and-range
  title: Scenario analysis — a range is credible, a point estimate is not
  body: Because Alentis is private, pre-revenue, and still proof-seeking, scenario analysis is more honest than pretending to have a precise mark. In the bull case, one or both oncology ADCs deliver clean human safety and early activity, lixudebart keeps extending fibrosis optionality, and large-pharma or crossover interest sharpens around a differentiated CLDN1 platform. That path could justify a valuation above the lower public-comp tier and into a multi-billion strategic band. In the base case, the company advances programs and preserves strategic interest but still lacks decisive human proof or disclosed round economics; under that outcome, value likely sits in the lower half of the comp set and remains hostage to another financing or partnership inflection. In the bear case, weak data, assay bottlenecks, or financing stress push value toward the low end of platform comparables and potentially below any rumored unicorn narrative. The key point is not the exact midpoint. It is that public
    evidence supports only a wide current EV band—roughly $0.6–1.8 billion—because proof, pricing terms, and downside protections remain undisclosed.
