evidenceStrategy:
- Use official Alentis financing and program disclosures to define what is known and unknown about current value.
- Use current public-market cap pages as valuation reference points rather than forcing unsupported DCF precision onto a pre-revenue biotech.
- Use official peer homepages and approved-product precedents to calibrate what proof each valuation tier already reflects.
- Convert undisclosed round terms, cash, preference stack, and assay economics into explicit diligence asks.
qualityBar:
- Keep the recommendation price-sensitive and evidence-sensitive rather than a generic quality score.
- Do not treat round size as proof of post-money valuation when pricing terms are absent.
- Use scenario ranges, not false point estimates, when market and cap-table inputs are missing.
- Include clear anti-thesis and kill triggers that would force a markdown or a pass.
sections:
- id: financing-context
  title: Current financing context — a strong round but not a priced public anchor
  body: 'The starting point for Alentis valuation is not a public stock chart or an audited 10-K. It is the November 2024 Series D, which officially raised $181.4 million and was presented as oversubscribed, led by OrbiMed with Novo Holdings and Jeito co-leading. That is a major positive signal: the round was large, recent, and backed by sophisticated healthcare investors. But it is not the same thing as a clean valuation mark. Public materials say the proceeds will fund Phase 1/2 trials for the two CLDN1 oncology ADCs, expand the pipeline, and support general corporate purposes, while management said it aimed to generate clinical data over the next 12–18 months. What public sources do not disclose is the pricing detail that would convert the round into a real equity valuation: share price, stake sold, pre-money, post-money, liquidation preferences, anti-dilution protections, or even current cash balance. Because of that omission, the round should be treated as financing strength and investor
    validation, not as proof that a specific private-market price—let alone an unverified unicorn mark—is justified today.'
  tableRefs:
  - TV001
