  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 概率信号
    rows:
      - - 乐观
        - 肿瘤安全性 / 活性清晰，纤维化期权继续存在，战略方或跨轮投资者兴趣上升
        - EV >$1.8B，且有望进入数十亿美元战略区间；证据把期权转成可定价稀缺性
        - 人体数据可见前，概率较低
      - - 基准
        - 项目推进，但证据和融资条款仍不完整
        - EV 大约 $0.9–1.5B；投资财团质量和平台广度支撑价值，但证据缺口压住上限
        - 按当前公开证据最有可能
      - - 悲观
        - 去风险前数据偏弱、检测卡住，或融资条款承压
        - EV 滑向 $0.6B 或以下；私募市场减记或惩罚性结构更可能出现
        - 信息缺口大，因此概率不可忽视
    notes: 这些是按情景给出的企业价值区间，不是 DCF，也不是私募市场报价。
