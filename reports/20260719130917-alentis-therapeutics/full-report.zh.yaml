      - number: '5.3'
        title: 独立验证与知识产权扩张
        blocks:
          - type: paragraph
            body: >-
              Alentis 的技术故事比单纯公司自称强得多，因为独立文献支持其中几块。2022 年 Science Translational Medicine 论文显示，高特异性单克隆抗体靶向暴露的非连接
              CLDN1，在患者来源肝模型中逆转了促纤维化信号，并在肺和肾模型中显示抗纤维化效果；非人灵长类安全性研究在高浓度下未见严重不良事件。2023 年 Journal of Hepatology
              论文把案例延伸到癌症，显示 CLDN1 特异性抗体在模型系统中抑制肿瘤生长和侵袭，并重编程 HCC 微环境。2025 年 PSC 论文增加了另一个纤维化相关适应症，认为 CLDN1
              既是胆道疾病中的介质，也是潜在治疗靶点。知识产权侧，公开专利记录显示组合正在成熟：从 Strasbourg/Inserm 轴线提交的人源化抗 CLDN1 抗体、覆盖纤维化疾病抗 CLDN1 单克隆抗体的 WIPO
              家族，以及 2025 年覆盖携带 exatecan 载荷抗 CLDN1 ADC 的 WIPO 申请。文献与专利布局演进结合在一起，说明公司正从一个抗体概念扩展为平台资产组合。
