      - number: '1.2'
        title: 领导层、治理与顾问厚度
        blocks:
          - type: paragraph
            body: >-
              2024 和 2025 年，管理层画像明显更接近「后期私营生物科技公司」。Mark Pruzanski 于 2025 年 10 月加入担任 CEO，接替 Roberto Iacone；后者从早期搭建一直带到 D
              轮融资和首个肿瘤 IND 转换。Pruzanski 在 Versanis Bio 和 Intercept Pharmaceuticals 的经历有用，因为 Alentis
              因此获得一位同时熟悉肝病、又具备资本市场信用的负责人。财务职能也在 2024 年 9 月升级，Jon Freve 加入担任 CFO，此前在 Galecto 和 Spring Bank 有 IPO
              经验。科学侧，Luigi Manenti 担任 CMO；随着公司重心从单克隆抗体肿瘤项目转向 ADC 执行，Alberto Toso 于 2024 年 4 月从肿瘤负责人转为
              CSO。治理不再只是创始人班底：Luca Santarelli 担任董事会主席，William Pao 于 2024 年初以独立董事身份加入，董事会还包括 OrbiMed、Novo
              Holdings、Jeito、Frazier 和 Longitude 的代表。科学顾问委员会加入肾血管炎、肺纤维化和肿瘤领域 KOL，提升外部可信度，也抬高了市场对有纪律临床执行的预期。
