      - number: '7.5'
        title: 缓释因素、投资逻辑破裂触发点和首要尽调问题
        blocks:
          - type: paragraph
            body: >-
              Alentis 的风险不是放任不管。它有真实缓释因素：ALE.P02 拥有 Fast Track 资格，lixudebart 在 IPF
              上享有孤儿药激励，公司拥有足够资本推进多个临床项目，董事会也补入了曾把产品从发现阶段推向商业化的高管。当前试验点布局和多中心活动还显示，公司能够启动真实世界临床运营。但这些缓释因素不能中和最高风险的未知项。最清晰的投资逻辑破裂触发点包括：任一肿瘤
              ADC 出现严重安全信号，无法识别足够多 CLDN1 阳性且符合方案的患者，证据显示 CLDN1 暴露过于异质、难以支持可重复疗效，制造或可比性挫折拖慢试验推进，或在可信人体数据到来前发生融资 /
              估值重置。最紧迫的尽调问题很直接：CLDN1
              检测流程和阳性率、试验点启动到入组的转化、药物抗体比和制造控制包、现金烧钱速度和现金跑道，以及即将到来的人体数据读出的时间和质量。在这些问题得到回答前，即便平台故事自洽，剩余风险仍然很高。
