  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 当前收入模型：靠融资支持 R&D，不是产品销售
        blocks:
          - type: paragraph
            body: >-
              按传统生物科技口径，Alentis 还没有商业 P&L。保留的公开来源显示，它是一家临床阶段公司，肿瘤 ADC
              和纤维化资产都在人体验证中，但没有获批产品、没有公开定价，也没有披露销售额。因此当前财务模型由融资驱动，而不是收入驱动。公开记录中最重要的流入是股权融资和未来可能的战略交易，不是处方收入。实际来看，2026 年
              Alentis 最接近商业化路径的动作是商务拓展：募集专门资本，产出能吸引未来合作伙伴的数据，并保留 IPO 或 M&A 路径的可选性。相邻案例也支持这个框架。89bio 2025 年同意被 Roche
              收购、Akero 2025 年被 Novo Nordisk 收购，说明先进代谢疾病资产可以在独立大规模商业化完全搭建前，通过战略出售变现。对 Alentis
              来说，当前收入质量因此完全是前瞻性的，并取决于未来临床成功。
