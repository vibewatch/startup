            body: >-
              财务结论是，按私营生物科技标准，Alentis 看起来融资充足；但仅靠公开来源，仍无法有把握地承保。D
              轮规模大且由专门投资人领投，但不能替代资产负债表披露。保留的公开资料没有给出手头现金、月度烧钱、现金跑道、债务或逐项目支出。未来产品也没有公开价格锚，因此收入确认时点、毛利率路径和商业化支出都必须推迟到尽调。最合理的推断是，未来融资依赖现在取决于人体数据：更干净的肿瘤读数、更多纤维化证据，或战略合作，都可能解锁下一步资本；数据较弱则会增加稀释，或迫使公司缩窄优先事项。相邻
              MASH 赢家说明，从后期临床证据走向商业化或战略退出，需要大量资本和运营厚度。Alentis 可能走到那一步，但今天的公开记录只能支持「资本强」结论，不能支持现金跑道或单位经济性结论；这个区分很关键。
