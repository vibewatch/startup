chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、科学源头与运营布局
        blocks:
          - type: paragraph
            body: >-
              Alentis Therapeutics 是一家临床阶段的瑞士生物科技公司，核心楔子只有一个：暴露型 Claudin-1。公司官方材料把 Claudin-1
              描述为紧密连接蛋白；在纤维化组织和多种实体瘤中，该蛋白会过度表达并暴露到细胞外，进而成为抗体和抗体偶联药物可以攻击的靶点。这个表述很重要：Alentis
              不是拿一个宽泛平台去寻找疾病，而是押注靶点本身，肿瘤和纤维化两条业务线都立在同一套生物学上。公司称，Professor Thomas Baumert 及其 University of Strasbourg 和
              Inserm 合作者开展了 15 年以上研究，公司随后于 2019 年成立；最初发布的启动新闻把早期知识产权连接到 Strasbourg、Inserm、Mount Sinai
              和当地技术转移基础设施。如今公司自称总部位于瑞士 Basel，在 Strasbourg 设有研发子公司，并在美国开展临床运营。这一布局符合欧洲发现基础的画像；下一步要靠美国监管和临床执行，把 Claudin-1
              科学转成注册性肿瘤数据。
