        title: 客户基础分层——真实使用者、购买者和支付方是谁
        blocks:
          - type: paragraph
            body: >-
              Alentis 尚未推出产品，因此正确的客户地图要从角色开始，而不是发票。终端用户是患有 CLDN1 相关疾病的患者，目前分为两条临床分支。肿瘤中，ALE.P02 正在开发用于晚期或转移性 CLDN1
              阳性鳞状实体瘤，ALE.P03 则用于选定的晚期或转移性 CLDN1 阳性结直肠癌、肝内胆管癌、鳞状非小细胞肺癌、尿路上皮癌和宫颈鳞癌。纤维化中，lixudebart 靶向肾、肝、肺纤维化，公开具体项目包括
              ANCA 相关血管炎伴肾受累、晚期肝纤维化/轻度肝硬化，以及计划中的
              IPF。近期经济买方不是医院药房预算，而是资助研究的资本；再往后，是任何愿意商业化或共同开发的大型药企合作伙伴。未来支付方集合包括商业保险、Medicare/Medicaid、国家医疗体系，以及可能的罕见病或专科纤维化渠道。当前运营客户是研究者、研究协调员和专科中心，它们按方案筛查、入组、给药和监测患者。因此
              Alentis 目前的客户基础是临床型、渠道型的，不是商业型的。
