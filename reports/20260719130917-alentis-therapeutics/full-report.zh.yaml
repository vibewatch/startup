              Alentis 并不是进入一个宽松的肿瘤环境，早期靶向疗法不能靠探索不足的剂量水平蒙混过关。FDA Project Optimus
              明确警告，剂量和给药方案刻画不足，会带来更多毒性却不增加疗效，迫使减量，甚至造成不可逆伤害。对于同类首创的 CLDN1 ADC 项目，剂量探索因此升格为核心承销问题。
