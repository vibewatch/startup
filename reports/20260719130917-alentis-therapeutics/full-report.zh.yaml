        - $181.4M Series D 和资金持续投入
        - 后续融资、裁员或项目重新排序
        - 可信数据出现前被迫融资、大幅削减或暂停研究
        - 获取现金、烧钱速度、现金跑道和下行情景运营计划
      - - 竞争替代
        - 同类首创 CLDN1 聚焦和董事会经验
        - 同行数据、获批进展和 CLDN / ADC 交易活动
        - 同行让 Alentis 在临床或商业上变得冗余
        - 用 claudin 和 ADC 基准数据压力测试差异化
    notes: 监测指标只有一部分可从外部观察；最关键的尽调问题仍需要公司私有数据。
    claimRefs:
