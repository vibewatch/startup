            body: >-
              Alentis 的护城河最容易描述，也最难承保。最强支柱是生物学新颖性：公开材料把 CLDN1 定位为横跨肿瘤和纤维化的共同锚点，保留来源没有显示任何获批 CLDN1
              药物。如果早期人体数据证明靶点选择性干净，这会创造合作吸引力。薄弱点在临床证据、诊断和时点。技术综述强调 claudin 生物学会随肿瘤类型变化，因此一个 CLDN1
              阳性癌种成功，不一定能干净外推到更大的肿瘤清单。公开来源也没有显示可与 VYLOY 已用于 CLDN18.2 的路径相当的 CLDN1
              伴随诊断路径。获批前切换成本低，因为研究者、投资人和未来药企合作伙伴可以在多个纤维化或生物标志物肿瘤项目之间多处下注。上市后切换成本会急剧上升，那时检测流程、输注运营和安全管理习惯会固化。眼下，Alentis
