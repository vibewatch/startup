              期肾脏试验；公司报告了靶点结合和良好的早期安全性。这些验证点有意义，但没有回答最深的产品风险问题。公开材料仍没有提供承保人想看的技术披露：药物-抗体比、连接子化学（除「临床验证」外）、大规模 CMC
