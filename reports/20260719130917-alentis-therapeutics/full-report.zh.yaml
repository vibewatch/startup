      - number: '1.3'
        title: 资本基础、投资人质量与披露边界
        blocks:
          - type: paragraph
            body: >-
              在欧洲靶点平台型生物科技公司里，Alentis 拼出了一套更可信的私募融资堆栈。融资时间线从 2019 年成立时的 CHF12.5 million A 轮开始，随后是 2021 年 $67 million B
              轮、2023 年 $105 million C 轮，以及 2024 年 11 月超募的 $181.4 million D 轮。投资人模式和金额一样关键。早期轮次引入欧洲生命科学专门投资人，最新一轮由
              OrbiMed 领投，Novo Holdings 和 Jeito Capital 共同领投，并新增 Frazier Life Sciences、Longitude Capital、Catalio
              Capital、Piper Heartland Healthcare Capital 和 Avego。这个组合说明公司已经从种子期科学风险走向围绕临床催化剂的后期私募联合投资。与此同时，Alentis
              仍未公开披露投后估值、股权结构表、清算优先权、收入或现金头寸。BioSpace 的融资分析点出了矛盾信号：D 轮规模足以支撑可能走 Nasdaq IPO
              路径的讨论，但管理层仍身处挑战性生物科技市场，投资人胃口仍然挑剔。因此融资质量显然很强，入场价格和稀释堆栈仍不透明。
