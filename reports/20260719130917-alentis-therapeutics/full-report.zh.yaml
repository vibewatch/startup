      - number: '7.3'
        title: 纤维化与罕见病中的适应症和患者风险
        blocks:
          - type: paragraph
            body: >-
              纤维化分支降低了纯粹依赖单一适应症的风险，但也把公司暴露在专科诊疗和罕见病约束之下。Alentis 关于 IPF
              孤儿药资格的公告明确说，这种疾病没有治愈方法，现有治疗只能减缓进展，耐受性挑战仍在。Pulmonary Fibrosis Foundation 强调肺纤维化负担可能很重：日常活动也会气短，PF
              覆盖一大类疾病，护理基础设施包括专科中心、支持小组、试验查找工具和研究登记库。未满足需求因此成立，但患者触达也说明，需求活在高触达的专科生态里，而不是大众市场渠道。血管炎也呈现同样模式：Vasculitis
              Foundation 的支持和教育网络显示，患者识别和照护由社区与专家共同驱动。再加上公开的肝纤维化和肾纤维化研究，Alentis 的组合横跨多个器官、终点、专科和招募路径。Phase 1 或 Phase 2
              信号为正，并不能消除一个器官场景难以迁移到另一个器官的风险，也不能保证患者招募、终点敏感度或长期给药耐久性不会失望。
