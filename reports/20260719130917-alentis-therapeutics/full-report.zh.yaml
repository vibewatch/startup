  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 方向
      - 什么会改变判断
    rows:
      - - 横跨肿瘤 ADC 和纤维化的同类首创 CLDN1 平台
        - 投资逻辑
        - 清晰人体证据显示 CLDN1 可在领先项目之间外推
      - - 由顶级机构领投的大额 Series D 给多项研究争取时间
        - 投资逻辑
        - 轮次条款显示估值持平 / 下调，或资金消耗差于预期
      - - VYLOY 已给 claudin 生物学提供商业先例
        - 投资逻辑
        - Alentis 未能展现同等生物标志物严谨性或差异化
      - - 没有获批产品、没有公开收入，也没有披露人体疗效
        - 反向逻辑
        - 积极的首次人体数据，加上透明定价条款
      - - ADC 和纤维化领域拥挤，且有证据更强的上市可比公司
        - 反向逻辑
        - Alentis 展现出明确更优的生物学或合作杠杆
      - - 私募市场价格、优先权和现金跑道仍不透明
        - 反向逻辑
        - 披露条款清单、股权结构表和现金计划，消除结构性不确定性
    notes: 反向逻辑并不是公司弱，而是估值论证有太多内容仍藏在公开视野之外。
    claimRefs:
