      - number: '7.4'
        title: 竞争、资本与组织风险
        blocks:
          - type: paragraph
            body: >-
              即便生物学成立，Alentis 也在生物制药最拥挤的赛道之一竞争。Astellas 的 VYLOY 获批表明 claudin 生物学能撑起获批商业产品，但也抬高了 claudin
              家族里检测严谨度、患者筛选和商业执行的门槛。Daiichi Sankyo 的管线体现了既有 ADC 开发力量的深度。在这个背景下，Alentis 不只要证明 CLDN1
              有效，还要证明自身资产足够差异化，能在更大玩家面前赢得注意力和资本。融资与时间压力在公开来源里可见：Series D 资金被指定用于启动 Phase 1/2 肿瘤试验，管理层称目标是在未来 12–18
              个月内交付临床数据。这是可信的催化窗口，但窗口也有限。公开来源仍未披露现金余额、烧钱速度、现金跑道、检测经济性或制造可重复性。治理能提供一定缓冲——Luca Santarelli
              带来从发现到商业化的经验，William Pao 加入董事会也增加了肿瘤专业度——但价值仍集中在少数领先项目和较窄的领导团队上。
