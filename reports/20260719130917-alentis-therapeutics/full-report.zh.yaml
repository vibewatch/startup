      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              Alentis 的商业上行情景靠三个驱动因素。第一，ADC 仍是已被验证的肿瘤模态，Alentis 不需要从零证明载荷类别。第二，claudin 靶向疗法现在有了 CLDN18.2
              这个真实商业标杆，帮助投资人和未来合作伙伴想象以生物标志物牵引的上市模型。第三，首个获批 MASH 疗法表明，只要患者选择清楚、替代终点获益有说服力，监管会接受纤维化药物。约束同样重要。Claudin
              生物学依赖具体情境，限制了所有 CLDN1 表达肿瘤都像一个市场那样行动的假设。纤维化商业化仍被安全警示、确证性试验义务和长随访周期拖住。Alentis 也缺少可与 Astellas CLDN18.2
              诊断披露相比的公开 CLDN1 流行率数据，因此其市场模型还不能用同样精度做投资测算。眼下，公司可获取市场仍是临床试验和合作生态；更广的商业相关性很可能要等未来 12 至 18
              个月出现令人信服的人体数据后才会扩张。
