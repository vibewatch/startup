  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局形态：精确 CLDN1 同行很少，相邻既有玩家很多
        blocks:
          - type: paragraph
            body: >-
              Alentis 所处竞争格局看似不对称，实际很容易误判。按最窄定义——把 CLDN1 靶向药推进临床的公司——公开来源仍显示直接同行很少。稀缺性支撑公司的同类首创叙事，但不代表战场空白。今天最接近的商业化先例是
              Astellas 的 VYLOY，这是一款 CLDN18.2 靶向抗体，证明只要生物标志物阈值、获批检测和明确定义的肿瘤细分人群到位，claudin 生物学可以被商业化。更广的模态门槛还要高。Daiichi
              Sankyo 2026 年 5 月管线显示五个 deruxtecan ADC 家族；ENHERTU 和 DATROWAY 等获批产品已经让买方、研究者和合作伙伴看到规模化 ADC
              业务板块的具体样子。换句话说，Alentis 与其说是在对抗一群 CLDN1 初创公司，不如说是在面对相邻 claudin 和 ADC 既有玩家；后者已经有安全性数据库、试验运营和商业化肌肉。
