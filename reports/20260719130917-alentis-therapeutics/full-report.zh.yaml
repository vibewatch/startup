            body: >-
              最深的客户风险是，Alentis 能跨过早期入组门槛，却仍因为准入依赖专科流程而面对狭窄的最终市场。公开镜像显示，ALE.P03 患者必须提供组织供中心实验室做 CLDN1
              分析，已有转移性疾病进展，已用尽或未能从既往标准方案获益，并且通常需要 ECOG 0/1 和足够器官功能。排除项包括需要治疗的活动性 CNS
              疾病、显著胃肠道出血、活动性感染，以及有症状或临床重要的肺炎/间质性肺病。这些是肿瘤试验的常规要求，但合在一起意味着，上市时可触达客户会在患者到达输注前被多道筛网缩小。公开来源还显示疗法通过 IV
              输注给药，进一步强化了对专科中心和运营吞吐的需求。NRR、GRR、合同续约或满意度评分等留存指标不存在。相关的未来留存代理，是诊断基础设施、筛查转化、中心吞吐和支付方覆盖，能否支撑从活检到输注再到随访的治疗旅程。Foundation
              Medicine、Guardant 和 Roche 说明周边精准肿瘤生态已经很成熟；Alentis 还需要接入其中。
