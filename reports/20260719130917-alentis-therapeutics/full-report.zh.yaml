      - number: '8.2'
        title: 公开可比公司区间——阶段比故事更关键
        blocks:
          - type: paragraph
            body: >-
              最站得住的公开估值框架，是一条很宽的公开生物科技可比公司区间，并按两条轴拆分：创新平台和纤维化验证。在创新平台一侧，CompaniesMarketCap 显示 CRISPR Therapeutics 在 2026
              年 7 月约为 $4.7 billion，Beam 约为 $2.8 billion，Intellia 约为 $1.6 billion，Prime Medicine 约为 $0.56
              billion。官方公司页面解释了为什么差距这么大。CRISPR 拥有一项获批疗法和多个临床项目。Intellia 正在披露更多积极的 Phase 3 结果。Beam
              指向经过临床验证的递送技术和一座制造设施。Prime 仍更偏纯平台驱动，尚无获批疗法。在纤维化一侧，Akero 的公开估值接近 $4.5 billion，89bio 在 Roche 收购协议前最后已知市值约为
              $2.2 billion，已获批的商业化领导者 Madrigal 接近 $12.8 billion。这些数字说明，公开市场奖励证据、成熟度和商业化。Alentis
              在公开证据上比这些公司都更早，因此除非私下尽调揭示出明显更强的隐藏证据，否则其公允价值应低于已获批和后期阶段领导者。
