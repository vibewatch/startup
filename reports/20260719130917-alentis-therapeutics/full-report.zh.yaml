        title: 下行触发点与入场纪律
        blocks:
          - type: paragraph
            body: >-
              最重要的纪律，是把对平台的欣赏和愿意支付的价格分开。几件事都可能迅速击穿估值：肿瘤项目出现安全问题或早期活性不足，CLDN1 检测漏斗最终过窄或运营难度过高，在人体证据落地前以承压条款融资，或竞争对手数据事件让
              Alentis
              显得更慢、差异化更弱。公开来源没有披露清算优先权、反稀释条款或普通股层级，因此一旦出现平轮或降价融资，初级持有人的下行可能明显比任何表面企业价值区间暗示的更糟。这也是为什么当前公开证据支持区间式承销和价格纪律，而不是对传闻估值产生确信。如果新一轮以强条款定价，并且公司展示干净人体证据，入场争论会发生实质变化。如果公司在没有证据或结构惩罚性很强的情况下再次融资，悲观情景会大幅升温。
