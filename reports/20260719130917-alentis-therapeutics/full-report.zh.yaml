      - number: '2.2'
        title: 规模测算视角：原始疾病负担很大，生物标志物过滤后的机会更小
        blocks:
          - type: paragraph
            body: >-
              围绕 Alentis 的原始疾病负担无疑很大，但有用的结论不是市场「巨大」，而是几组负担视角都指向临床上重要的人群。仅看 2026 年美国估计，SEER 和 ACS 报告肺癌 229,410 例、口腔/咽部癌
              60,480 例、食管癌 22,530 例、宫颈癌 13,490 例。上述肿瘤组在任何 CLDN1 阳性或治疗线次过滤前，合计约 325,910 例年新发病例。肝癌另有 42,340 例美国病例也相关，因为
              CLDN1 生物学和 Alentis 既往项目与肝胆疾病交叉。纤维化端，JCI 2025 年 MASLD/MASH 综述称，全球 30% 至 40% 人口受 MASLD/MASH 谱系疾病影响，2
              型糖尿病人群患病率约 65%，最高 20% 的 MASLD 可进展为 MASH。这些是巨大的负担信号，但不能直接转成可服务市场规模，因为分期、诊断、生物标志物状态和支付方门槛仍会强力过滤。
