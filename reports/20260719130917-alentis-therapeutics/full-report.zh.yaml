        - 医院肿瘤预算和支付方报销
        - 诊断 → 病理 / 生物标志物检测 → 转诊或入组 → 输注
        - 已验证的 CLDN1 检测和治疗线匹配
      - - 更广泛的 CLDN1+ 实体瘤
        - 肿瘤 KOL 和开发合作伙伴
        - 当前是试验赞助方；之后是支付方
        - 转化信号 → 适应症选择 → 试验扩展
        - 生物标志物流行率和队列经济性
      - - 肾纤维化 / AAV
        - 肾病医生
        - 专科药房 / 医院 / 支付方
        - 诊断 → 肾脏风险分期 → 专科治疗决策
        - 纵向疗效和安全性
      - - 肝纤维化 / MASH
        - 肝病医生
        - 支付方和专科处方预算
        - 分期 → 安全性筛查 → 治疗授权
        - 纤维化分期确认和标签匹配
      - - IPF
        - 呼吸科医生
        - 专科支付方和中心
        - 诊断 → 进展评估 → 长期治疗
        - 脆弱患者的风险收益容忍度
      - - 合作 / BD 市场
        - 大药企业务开发团队
        - 公司 BD 预算
        - 人体数据包 → 尽调 → 交易
        - 生物标志物、疗效和可制造性的证据强度
    notes: 生物技术药物市场不是靠简单消费需求放量，而是卡在专科流程和支付方政策上。
