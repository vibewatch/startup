      - number: '5.2'
        title: 临床机制与用户流程
        blocks:
          - type: paragraph
            body: >-
              肿瘤和纤维化的操作流程差异很大，但都依赖同一生物学前提：CLDN1 在健康紧密连接中被隐藏，在病变组织中过度表达并暴露。肿瘤中，Alentis 称其抗 CLDN1 抗体会选择性识别 CLDN1 阳性肿瘤细胞，随后
              ALE.P02 或 ALE.P03 被内化，并把微管蛋白抑制剂或拓扑异构酶 I 载荷释放到肿瘤组织。客户流程因此从识别 CLDN1 阳性实体瘤开始，接着输注
              ADC，并依赖选择性内化把药效集中到肿瘤细胞。纤维化中，lixudebart 的工作方式不同。公司称该抗体结合暴露型 CLDN1，同时不干扰紧密连接中的
              CLDN1；它阻断细胞内促纤维化信号，打断与胶原结合受体的物理相互作用，并帮助打开胶原屏障。这里的流程重点不是载荷递送，而是疾病修饰型信号控制；肾、肝、肺纤维化项目各自需要自己的分期和反应指标。这种共享靶点、机制分叉的架构，是平台核心。
