            body: >-
              由于 Alentis 尚未商业化，CAC、回本周期、毛利率等经典 SaaS 式效率指标要么不适用，要么未披露。真正相关的成本问题是临床平台强度。公开资料和 Alentis 自身布局显示，成本基础由
              Strasbourg 的发现与转化科学、瑞士总部职能，以及叠加在多项目人体研究上的美国临床运营驱动。公司同时推进肿瘤 ADC
              和纤维化生物学，这意味着在任何收入出现前，CMC、生物标志物、毒理和临床运营支出都不轻。公开进展指标同样稀疏。Alentis
              披露融资里程碑和临床进展，但没有披露收入、ARR、患者量、中心生产率或项目级预算拆分。即便员工数，当前公司页面也只是方向性地描述为超过 50 人。相邻可比公司能框出未来成功需要什么：Madrigal
              做出了首个获批 MASH 上市，89bio 和 Akero 则在独立扩张前已经有足够价值吸引 Roche 和 Novo。Alentis 尚未披露任何类似这些后期案例的商业化搭建。
