        title: 情景分析——区间可信，点估计不可信
        blocks:
          - type: paragraph
            body: >-
              Alentis 是私营、尚未产生收入、仍在寻找验证的公司，因此情景分析比假装拥有精确估值更诚实。乐观情景下，一个或两个肿瘤 ADC 交付干净的人体安全性和早期活性，lixudebart
              继续延展纤维化可选性，大药企或跨轮 资金围绕差异化 CLDN1
              平台的兴趣升温。这条路径可能支撑估值越过公开可比公司低端层，进入数十亿美元的战略区间。基准情景下，公司推进项目并保住战略兴趣，但仍缺少决定性人体证据或已披露轮次经济性；在这种结果下，价值大概率落在可比公司集合下半区，并继续受下一轮融资或合作拐点牵制。悲观情景下，疲弱数据、检测瓶颈或融资压力把价值推向平台可比公司的低端，也可能低于任何传闻中的独角兽叙事。关键不是精确中点，而是公开证据目前只支持很宽的当前企业价值（EV）区间——大约
