      - number: '1.4'
        title: 管线状态与里程碑质量
        blocks:
          - type: paragraph
            body: >-
              后续章节之所以可以把 Alentis 当作真实临床公司，而不是投机性的发现故事，最强理由是管线状态。肿瘤业务现在围绕两个 ADC：ALE.P02 和 ALE.P03，二者使用同一抗 CLDN1
              抗体，但搭载不同载荷。ALE.P02 搭载微管蛋白抑制剂载荷，已经获得 FDA IND 放行和 Fast Track 认定，用于晚期或转移性 CLDN1 阳性鳞状癌；公司称正在开展一项计划入组 170 名患者的
              1/2 期研究。ALE.P03 搭载拓扑异构酶 I 抑制剂载荷；按官方管线材料，也已进入首个人体临床测试。纤维化也不再是假设。Lixudebart（原
              ALE.F02）已经在肾脏和肝纤维化进入临床：RENAL-F02 正在 ANCA 相关血管炎伴肾受累中进行，FEGATO-01 已在晚期肝纤维化中完成。2025 年 1
              月顶线结果报告了剂量依赖的靶点结合、良好安全性和早期器官功能信号，公司还计划在特发性肺纤维化中开展 2 期研究。这些里程碑有意义，但仍不到注册性证据：Alentis
              还要靠首个人体肿瘤读数和更大的纤维化数据集，验证 Claudin-1 能成为可防守的业务板块。
