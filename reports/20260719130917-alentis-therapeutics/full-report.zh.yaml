companyProfile:
  summary: >-
    Alentis Therapeutics 是一家私营临床阶段生物科技公司，2019 年围绕 Thomas Baumert 在 University of Strasbourg 和 Inserm 的 CLDN1 研究创立，总部在
    Basel/Allschwil，在 Strasbourg 有研发布局，并在美国开展临床运营。公司正在两个模态家族上搭建统一的暴露型 CLDN1 平台：肿瘤 ADC（ALE.P02 和 ALE.P03）与纤维化抗体
    lixudebart。公开里程碑包括 ALE.P02 获 FDA IND 放行和 Fast Track 认定，ALE.P03 首个人体项目正在进行且招募网络覆盖 41 个中心，lixudebart 已有早期肾脏和肝纤维化数据，以及
    2024 年 11 月由 OrbiMed 领投、Novo Holdings 和 Jeito 参与的 $181.4M D 轮。公开证据支持平台逻辑连贯、投资人组合质量高，但不支持已验证的当前投后估值或完整现金/跑道图景。
