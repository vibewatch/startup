            body: >-
              肿瘤维度最重要的比较，不只是靶点是否相同，而是 Alentis 能否把 CLDN1 选择性转化为一个上市模型，且这个模型放在更成熟业务板块旁边仍可信。VYLOY
              同时展示了机会和生物标志物牵引商业化的成本。Astellas 官方面向医务人员（HCP）的材料用严格的免疫组化阈值定义 CLDN18.2 阳性，并把获批与 FDA
              批准检测绑定；但材料也记录了不轻的恶心、呕吐、超敏反应和输注管理负担。deruxtecan 标签把门槛抬得更高。ENHERTU 已经横跨乳腺癌、肺癌、胃癌和泛肿瘤 HER2 适应症，DATROWAY
              又增加了一个获批的拓扑异构酶 I ADC，并带有有意义的 ILD、眼部和口腔炎风险负担。Alentis 因此带着差异化靶点进入肿瘤市场，但缺少既有玩家已有的广度、人体安全性深度和诊断基础设施。直接 CLDN1
