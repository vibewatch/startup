  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 依据
    rows:
      - - 建议
        - 观察 / 继续研究
        - 科学叙事强，公开估值支撑弱
      - - 信心
        - 低到中
        - 轮次条款、现金和人体疗效仍未公开披露
      - - 风险评级
        - 高
        - 临床早期、严重依赖证据、私营结构不透明
      - - 估值立场
        - 按 $0.6–1.8B 的宽 EV 区间做投资测算；不要假设已有经验证的独角兽估值
        - 可比公司区间很宽，轮次定价未披露
      - - 决策含义
        - 在带价格轮条款或清晰人体证据出现时重新接触
        - 证据要先动，确信度再跟
    notes: 该建议明确依赖价格和证据。交易透明度改善或人体数据更强，都会推动判断。
