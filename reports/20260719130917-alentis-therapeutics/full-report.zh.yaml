      - number: '3.3'
        title: 纤维化堆栈：机制有差异，成熟度更弱
        blocks:
          - type: paragraph
            body: >-
              纤维化是竞争更拥挤的侧翼。Lixudebart 给 Alentis 带来机制上差异化的纤维化逻辑，因为它靶向肾、肝、肺纤维化中的 CLDN1
              生物学，而不是当前领先者强调的代谢通路。但成熟度明显站在竞争对手一边。Rezdiffra 已在非肝硬化 MASH 伴 F2-F3 纤维化中获得加速批准，尽管带有肝毒性、胆囊、相互作用和肝硬化使用限制。89bio
              的 pegozafermin 已进入全球 3 期 ENLIGHTEN 项目，并明确设计用于支持非肝硬化 MASH 的加速批准；Akero 的 efruxifermin 则处在三部分 3 期 SYNCHRONY
              项目中，覆盖组织学、真实世界和结局场景。Novo Nordisk 用 semaglutide 加入了另一个重量级对手：ESSENCE 组织学数据为阳性，FDA Priority Review
              也提示未来纤维化竞争可能不只来自专科生物科技公司，还来自肥胖症规模级既有玩家。结果是，Alentis 也许科学上独特，但今天还没有成熟度优势、商业规模、诊断标准化或全球支付方准备度。
