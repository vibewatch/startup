  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 生物学与临床证据风险
        blocks:
          - type: paragraph
            body: >-
              主导风险在于，Alentis 仍在人体中证明一个同类首创靶点与模态组合。ALE.P02 和 ALE.P03 被定位为抗 CLDN1 ADC，1/2
              期试验进行中，但公开记录显示的仍是研究入场，而不是人体疗效。Lixudebart 有更多安全性和靶点结合历史，但也仍未到注册阶段。科学逻辑依赖一个精确区分：CLDN1
              必须在肿瘤或纤维化组织中充分暴露且与疾病相关，同时在健康紧密连接中保持遮蔽。Frontiers 综述和更广泛 claudin 文献支持机会，但也强调 claudin 生物学在不同肿瘤类型间异质且依赖情境。这意味着
              Alentis 不仅暴露于早期肿瘤失败的标准风险，也暴露于靶点表达和靶点可及性的差异；这些差异会因器官、组织学和疾病分期而明显变化。在一个核心项目拿出令人信服的人体活性并保持可耐受安全性之前，整个 CLDN1
              平台都共享联动的验证风险。
