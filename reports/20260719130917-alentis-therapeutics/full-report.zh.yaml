    title: 估值
    sections:
      - number: '8.1'
        title: 当前融资背景——融资强劲，但缺少公开定价锚
        blocks:
          - type: paragraph
            body: >-
              Alentis 估值的起点不是公开股票走势图，也不是审计过的 10-K，而是 2024 年 11 月的 Series D。该轮官方融资 $181.4 million，披露为超额认购，由 OrbiMed
              领投，Novo Holdings 和 Jeito 共同领投。这是重要正面信号：轮次规模大、时间近，背后是成熟的医疗投资者。但它不等于干净的估值标记。公开材料称，资金将用于资助两个 CLDN1 肿瘤 ADC 的
              Phase 1/2 试验、扩展管线并支持一般公司用途，管理层也表示目标是在未来 12–18
              个月内生成临床数据。公开来源没有披露的是能把这一轮转换成真实股权估值的定价细节：股价、出售股权比例、投前估值、投后估值、清算优先权、反稀释保护，甚至当前现金余额。因为这些缺口，这一轮应看作融资实力和投资者背书，而不是证明某个具体私募市场价格——更不用说未经验证的独角兽估值——今天已经合理。
