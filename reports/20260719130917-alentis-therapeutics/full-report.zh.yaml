  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：生物标志物定义的肿瘤，加上分期特定的纤维化
        blocks:
          - type: paragraph
            body: >-
              Alentis 并不处在一个单一、块状的「肿瘤和纤维化」市场。它的实际市场边界更窄，也更有意思。肿瘤端，近期楔子是 CLDN1 阳性鳞状实体瘤；ALE.P02
              明确围绕肺癌、头颈癌、宫颈癌和食管癌展开，ALE.P03 则延伸到更广泛的 CLDN1 阳性实体瘤。纤维化端，公司没有追逐所有纤维炎症性疾病；它瞄准的是肾、肝、肺纤维化场景，其中暴露型 Claudin-1
              被认为具有生物可干预性。这样的边界纪律很重要，因为它阻止懒惰的 TAM 膨胀。公司的商业未来取决于一小部分患者：疾病既表达正确生物学，又能通过专科路径触达。2026 年 Nature Reviews Cancer
              和 Frontiers 综述支持广义 claudin 靶向逻辑，但也清楚说明 claudin
              生物学会随肿瘤类型和治疗形式变化。因此，更合适的市场视角，是几个由生物标志物定义、共享模态逻辑的微型市场，而不是一个无缝衔接的需求大桶。
