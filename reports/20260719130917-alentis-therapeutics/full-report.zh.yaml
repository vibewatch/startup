              Alentis 财务记录中最强的一块，是已披露的融资时间线。公司投资人页面称，Alentis 于 2019 年以 CHF12.5 million A 轮融资成立，随后在 2021 年完成 $67 million
              B 轮、2023 年完成 $105 million C 轮、2024 年 11 月完成 $181.4 million D 轮。不做货币换算，这意味着至少 $353.4 million
              已披露美元融资，外加瑞士法郎启动轮。官方资金用途叙事也清晰演变。投资人页面称，C 轮用于支持当时主导项目 ALE.F02 的 II 期和 I 期开发，以及更广泛的 CLDN1 平台开发；D
              轮公告和投资人页面则把重心转向围绕 CLDN1 靶向药打造深度实体瘤管线。这符合公司外部叙事从纤维化主导转向肿瘤 ADC
