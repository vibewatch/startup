      - number: '2.3'
        title: 购买者、使用者与支付路径：诊断和专科流程主导采用
        blocks:
          - type: paragraph
            body: >-
              肿瘤和纤维化的买方路径不同，但两者都受专科流程卡口，而不是由消费者需求驱动。肿瘤中，直接用户是肿瘤医生和试验研究者；守门人堆栈还包括病理医生、分子诊断实验室和具备输注能力的中心。Astellas 的 VYLOY
              上市证明了这套基础设施的重要性：商业化需要 FDA 批准的 IHC 伴随诊断、明确阳性阈值和实验室铺开。对 Alentis 来说，这是一个重要先例，因为未来 CLDN1
              市场准入可能不仅取决于药效，还取决于检测标准化。纤维化的用户路径更慢、更纵向。肝病医生、肾病医生和呼吸科医生在更长监测窗口里管理患者，治疗决定还要和影像、活检或替代分期、不良事件监测、支付方事先授权交织。Rezdiffra
              的标签有借鉴意义：即便是首个获批的 MASH 疗法，也被限制在非肝硬化 F2-F3 疾病，并带有安全监测负担。因此，Alentis 面对的是两个由专科治理的市场，临床证据和流程设计必须一起演进。
