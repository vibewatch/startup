      - number: '8.6'
        title: 建议与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              我们的建议是观察 / 继续研究，置信度为低到中等，风险评级为高，估值立场是“不要按未经验证的独角兽估值承销”。投资案例过度依赖缺失信息：定价轮次经济性、当前现金和烧钱速度、股权结构表悬置项、CLDN1
              检测转化，以及早期人体剂量 / 反应证据。董事会质量略有帮助——Luca Santarelli 和 William Pao
              增加了执行与肿瘤可信度——但治理改善本身不是估值催化剂。投资者的正确下一步不是猜投后估值，而是压出一份尽调清单，把公司从不透明的私营故事变成可承销资产。价值最高的问题包括 Series D
              条款清单、现金跑道、优先股堆叠、检测流程指标，以及即将到来的临床读出设计。在拿到这些之前，纪律型投资者应把 Alentis 视为一家有前景但证据偏薄的私营生物科技公司，等待一轮清晰定价的融资，或等待干净人体证据。
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV035
              - CV036
              - CV038
              - CV040
          - type: table
            tableRef: TV006
            claimRefs:
              - CV002
              - CV021
              - CV032
              - CV038
              - CV040
      - number: '8.7'
        title: 图表与证据
        blocks:
          - type: callout
            title: 正确问题不是“Alentis 是不是独角兽？”，而是“什么证据能支撑独角兽估值？”
            body: >-
              公开记录足以显示一轮高质量融资和一个可信平台，但不足以验证 Series D 的定价条款。因此，任何简单断言 Alentis 价值超过 $1 billion
              的说法，叙事都多于证据。纪律型投资者会倒置举证责任，在为这个叙事付费之前，要求看到轮次条款、股权结构表结构和早期人体数据。
            calloutType: insight
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV031
              - CV038
          - type: callout
            title: 为什么建议是观察，而不是买入
            body: >-
              Alentis
              可能是一家强公司，但在错误价格下仍可能是一个弱承销决策。公开来源留下太多估值关键未知项：当前现金、烧钱速度、定价条款、优先权、检测转化和人体有效性。在其中某一项发生实质变化前，理性立场是跟踪公司，等待干净证据或透明定价的入场点。
            calloutType: risk
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV037
              - CV040
