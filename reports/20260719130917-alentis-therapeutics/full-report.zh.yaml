  - id: TV005
    title: 投资逻辑破裂和叫停触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 投资逻辑传导
      - 行动含义
    rows:
      - - 人体安全性或疗效失利
        - 出现有意义的安全性信号，或在可耐受剂量下看不到可信活性
        - 打穿 CLDN1 平台定价的核心逻辑
        - 放弃，或按悲观区间重新标价
      - - 检测 / 生物标志物瓶颈
        - CLDN1 阳性率低、周转慢，或筛选失败率过高
        - 削弱入组、证据生成和最终商业化
        - 下调投资测算区间；要求更大折价
      - - 融资承压
        - 新一轮平价 / 降估值，且结构严苛，或披露现金跑道承压
        - 显示议价能力变弱，普通股回报更差
        - 回避，或大幅压低定价
      - - 竞争者超车
        - 同业数据或交易让 Alentis 显得更慢、差异化更弱
        - 降低战略稀缺性和退出倍数
        - 收窄可比公司区间，并降低乐观情景权重
      - - 隐藏包袱浮出
        - 优先股堆叠、反稀释或股权结构表条款被证实过于激进
        - 表面 EV 不再能干净映射到普通股价值
        - 从股权结构表往上重新测算
    notes: 每个触发项都足够具体，能推翻投资逻辑，而不只是让叙事没那么吸引人。
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
      - CV039
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - Series D 轮定价条款
        - 股价、出售股权比例、投前 / 投后估值、优先权
        - 把融资信号转成可用的估值锚
        - 索取投资条款清单、交割文件和股权结构表
      - - 现金、烧钱速度、现金跑道
        - 当前流动性和下行经营计划
        - 界定下一轮融资前还能用现金换出多少证据
        - 索取董事会材料或经审计财务包
      - - 股权结构表包袱
        - 清算优先权、反稀释、普通股与优先股堆叠
        - 决定平价 / 降估值情境下谁拿走价值
        - 索取公司章程、融资文件和瀑布模型
      - - 检测经济性和漏斗
        - CLDN1 阳性率、周转时间、筛选失败率
        - 同时牵动证据生成和上市经济性
        - 索取检测流程和研究中心漏斗数据
      - - 人体证据包
        - 剂量、安全性、早期活性和纤维化读出设计
        - 整个估值区间最大单一变量
        - 索取方案、SAP 和后续催化事件计划
    notes: 这五项请求比任何增量叙事都重要。没有它们，估值只能停留在有信息支撑的区间， 而不是能下笔承销的估值标记。
    claimRefs:
      - CV002
      - CV021
      - CV032
      - CV038
      - CV040
