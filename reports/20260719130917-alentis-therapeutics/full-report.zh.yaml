      - number: '7.2'
        title: 监管、生物标志物与试验执行风险
        blocks:
          - type: paragraph
            body: >-
              最清晰的外部风险放大器，是监管对肿瘤剂量和患者筛选的审查。FDA Project Optimus
              指出，旧的细胞毒药物范式常常让靶向疗法的剂量和给药方案刻画不足，并警告这会带来毒性却不增加疗效、频繁减量、提前停药，甚至造成持续或不可逆毒性。这一点直接关系到
              Alentis，因为其领先肿瘤资产是正在进入人体剂量探索的 ADC。患者筛选又加了一层脆弱性。NCI 解释，活检不安全、组织不足、找不到匹配生物标志物、生物标志物随时间变化，或检测不可用 /
              未获覆盖时，生物标志物检测可能帮不上忙。Alentis 自己的 ALE.P03 镜像资料显示，项目要求中央实验室确认 CLDN1，设置既往治疗线过滤、ECOG 和器官功能标准，并用排除规则筛得很严。NIH
              的临床试验基础页也强调，参加临床试验可能需要投入大量时间、精力并承受不适；纳入 / 排除标准则是为了保护受试者、保留可解释的数据。Alentis 在多个国家拥有 41
              个具名试验点，也继承了方案一致性、样本处理和数据整合风险。
