      - number: '8.4'
        title: 投资逻辑与反向逻辑——平台可选性真实，估值不透明也真实
        blocks:
          - type: paragraph
            body: >-
              投资逻辑很直接。Alentis 拥有一套自洽的同类首创 CLDN1 平台、两个临床阶段肿瘤 ADC、一条可能带来第二业务线可选性的纤维化分支，以及来自顶级财团、足以支持近期临床催化剂的融资。Claudin
              生物学也有先例：Astellas 的 VYLOY 获批表明，靶向 claudin 的疗法可以成为真实商业产品。反向逻辑同样强。Alentis
              没有获批产品、没有公开收入、没有披露人体有效性数据集，也没有公开轮次定价条款。ADC 领域很深，Daiichi Sankyo 的管线就是例证；商业化纤维化证据也已经掌握在 Madrigal
              等公司手里。此外，估值论证仍继承了前文提到的剂量、生物标志物和试验执行风险。这意味着投资争论不太是公司是否有意思，而是当前私募价格——公开证据里仍未披露——是否充分补偿了不确定性。缺少硬定价条款或干净人体证据时，反向逻辑会把建议挡在“买入”之外。
