  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 各细分的证据质量差异很大：试验站点具名且当前有效，诊断生态只是相邻环节但更成熟，商业证据则处处缺席。
    data:
      columns:
        - 具名机构 / 联系人
        - 当前部署证据
        - 地理广度
        - 商业证据
      rows:
        - label: ALE.P03 站点网络
          values:
            - 高
            - 高
            - 高
            - None
        - label: Lixudebart 临床使用
          values:
            - 低至中
            - 中
            - 低
            - None
        - label: 诊断生态系统
          values:
            - 中
            - 间接
            - 高
            - 仅间接
        - label: 潜在药企交易对手
          values:
            - 中
            - 仅间接
            - 高
            - None
    approximationNotes: 单元格是对证据质量的定性判断，不是商业评分。「间接」指来源显示生态相关性，但不显示与 Alentis 的关系。
    claimRefs:
      - CU014
      - CU020
      - CU024
      - CU025
      - CU028
      - CU029
      - CU032
      - CU035
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 对 Alentis 主要风险的定性严重度评分，覆盖发生可能性、影响、缓解成熟度和剩余暴露。
    data:
      columns:
        - 发生可能性
        - 影响
        - 缓解成熟度
        - 剩余暴露
      rows:
        - label: CLDN1 项目人体疗效未达预期
          values:
            - 中高
            - 高
            - 低
            - 高
        - label: 剂量 / 安全性优化失败
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 生物标志物和招募瓶颈
          values:
            - 高
            - 高
            - 低至中
            - 高
        - label: 纤维化跨器官转化失败
          values:
            - 中
            - 中高
            - 中
            - 中高
        - label: ADC 既有玩家跨越式赶超
          values:
            - 高
            - 中高
            - 低
            - 高
        - label: 资本不透明 / 融资重置
          values:
            - 中高
            - 高
            - 中
            - 高
    approximationNotes: 单元格是基于已披露事实和领域先例的定性判断，而非建模概率。
    claimRefs:
      - CR001
      - CR006
      - CR012
      - CR021
      - CR023
      - CR029
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 剂量、检测或早期疗效一旦出问题，如何传导为更慢入组、更弱数据、更高融资压力和更低平台可信度。
    data:
      nodes:
        - id: dose
          label: 剂量 / 安全性刻画不佳
          description: ADC 剂量或给药方案毒性过高，或低于最优
        - id: assay
          label: CLDN1 检测瓶颈
          description: 生物标志物阳性患者太少，或实验室工作流过慢
        - id: enroll
          label: 入组慢、数据噪声大
          description: 试验在各站点招募缓慢或不一致
        - id: readout
          label: 人体读数弱或延迟
          description: 在投资人和合作伙伴检查点，证据不足
        - id: capital
          label: 融资压力
          description: 去风险里程碑前还需要更多资本
        - id: platform
          label: 平台可信度受损
          description: 市场对更广 CLDN1 逻辑的信心下降
      edges:
        - from: dose
          to: enroll
          label: 压窄合格给药路径
        - from: assay
          to: enroll
          label: 减少候选患者流
        - from: enroll
          to: readout
          label: 推迟证据形成
        - from: readout
          to: capital
          label: 削弱融资筹码
        - from: readout
          to: platform
          label: 降低信心
        - from: capital
          to: platform
          label: 迫使重新排序优先级
    approximationNotes: 风险传导图是因果图，不是概率图；影响幅度取决于尚未披露的运营和现金数据。
    claimRefs:
      - CR006
      - CR009
      - CR012
      - CR013
      - CR021
      - CR029
      - CR032
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Alentis 依赖的外部系统包括监管机构、检测基础设施、专科站点、患者社群和资本；任一系统失灵，都会传导到核心项目。
    data:
      nodes:
        - id: fda
          label: FDA / 监管机构
          description: 剂量优化、孤儿药激励和试验监督
        - id: lab
          label: CLDN1 检测基础设施
          description: 中心实验室生物标志物测试和病理工作流
        - id: sites
          label: 专科中心
          description: 41 个肿瘤站点足迹，加上纤维化专科医生
        - id: patients
          label: 罕见病社群
          description: PF 和血管炎患者认知与转诊流
        - id: capital
          label: 资本市场 / 投资人
          description: 需要资本支撑运营穿过证据节点
        - id: programs
          label: 核心项目
          description: ALE.P02、ALE.P03 和 lixudebart
      edges:
        - from: fda
          to: programs
          label: 设定临床门槛
        - from: lab
          to: programs
          label: 筛选合格患者
        - from: sites
          to: programs
          label: 执行研究
        - from: patients
          to: sites
          label: 提供转诊和试验兴趣
        - from: capital
          to: programs
          label: 支撑延续
    approximationNotes: 多个依赖是系统层级，而非具体供应商，因为公司没有公开披露检测或制造交易对手。
    claimRefs:
      - CR012
      - CR018
      - CR019
      - CR020
      - CR021
      - CR032
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 从融资实力和平台可选性，到证据缺口和估值不透明，最终推导出观察 / 继续研究建议。
    data:
      nodes:
        - id: round
          label: D 轮信号强
          description: 获得 $181.4M 融资，投资方包括一线生物科技投资人
        - id: platform
          label: 平台可选性
          description: 两条肿瘤 ADC，加上纤维化分支和 claudin 先例
        - id: proof
          label: 证据缺口
          description: 未披露人体疗效，也没有公开定价条款
        - id: comp
          label: 可比区间宽
          description: 上市可比公司区间约 $0.56B 至约 $12.76B，取决于阶段和商业化程度
        - id: risk
          label: 剩余风险
          description: 剂量、生物标志物、融资和股权结构表不确定性仍高
        - id: call
          label: 建议：观察 / 继续研究
          description: 激进承销前，等待带价格的条款或清晰的人体证据
      edges:
        - from: round
          to: call
          label: 支撑兴趣
        - from: platform
          to: call
          label: 支撑上行
        - from: proof
          to: call
          label: 限制确信度
        - from: comp
          to: call
          label: 迫使给区间而非点估值
        - from: risk
          to: call
          label: 要求折价和尽调
    approximationNotes: 建议逻辑图是定性决策链，不是加权评分模型。
    claimRefs:
      - CV001
      - CV004
      - CV023
      - CV027
      - CV028
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 证据质量和融资质量变化下，对企业价值的示意性敏感性。
    data:
      items:
        - label: 悲观（数据弱 / 融资承压）
          value: 600
        - label: 保守基准
          value: 900
        - label: 基准
          value: 1200
        - label: 乐观
          value: 2200
        - label: 拉伸战略溢价
          value: 3500
    approximationNotes: 数值单位为百万美元，是用于搭框架的情景中点，不是直接市场报价或 DCF 输出。
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV027
      - CV033
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 在明确的证据和融资假设下，Alentis 低 / 基准 / 高企业价值区间，单位为十亿美元。
    data:
      items:
        - label: 隐含当前企业价值（EV，公开证据区间）
          low: 0.6
          mid: 1
          high: 1.8
        - label: 3 年退出 — 基准情景
          low: 0.8
          mid: 1.4
          high: 2.5
        - label: 3 年退出 — 乐观情景
          low: 2
          mid: 3
          high: 5
    approximationNotes: 区间是作者在公开证据和未知稀释条件下的明确判断；它们用于框定承销，而非事实上观察到的定价。
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV027
      - CV039
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 一张简单的 IC 式评分卡，覆盖影响私营临床阶段生物科技估值的最关键维度。
    data:
      items:
        - label: 市场机会
          value: 7 / 10
        - label: 临床证据
          value: 4 / 10
        - label: 护城河 / 差异化
          value: 6 / 10
        - label: 经济性可见度
          value: 3 / 10
        - label: 风险画像（越高 = 越安全）
          value: 3 / 10
        - label: 估值支撑
          value: 4 / 10
        - label: 证据质量
          value: 5 / 10
    approximationNotes: 评分只是定性综合，应结合主张和尽调问题一起阅读，不能单独当作事实。
    claimRefs:
      - CV017
      - CV020
      - CV028
      - CV029
      - CV030
      - CV039
