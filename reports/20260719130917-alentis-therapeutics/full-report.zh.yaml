  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 一个靶点、三个核心资产、两类模态
        blocks:
          - type: paragraph
            body: >-
              Alentis 的产品定义在顶层异常简单，往下看更有层次。公司围绕暴露型 Claudin-1 搭建，目前把这套生物学转译到两类模态。肿瘤中，ALE.P02 和 ALE.P03 是 CLDN1 靶向
              ADC，使用同一抗 CLDN1 抗体，但搭载不同载荷类别。纤维化中，lixudebart 是同类首创单克隆抗体，设计目的不是输送细胞毒载荷，而是通过阻断暴露型 CLDN1
              信号来逆转器官纤维化。按客户流程看，这一点重要：Alentis 不是向所有人出售一个泛化「平台」，而是在为肿瘤医生和纤维化专科医生搭建资产特定流程；他们要先识别 CLDN1 相关患者，再给予肿瘤定向 ADC
              或抗纤维化生物制剂。官方管线现在显示两个肿瘤 1/2 期项目和一个多适应症临床纤维化项目，因此产品地图已经比单一核心资产更宽，尽管商业契合度证据仍处早期。
