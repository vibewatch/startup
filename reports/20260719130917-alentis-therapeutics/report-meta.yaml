  topStrengths:
  - Unified exposed-CLDN1 platform spans oncology ADCs and fibrosis, giving the story more depth than a single-asset biotech.
  - $181.4M Series D led by top-tier investors provides a meaningful near-term financing signal and catalyst runway.
  - ALE.P02 and ALE.P03 are both in Phase 1/2 development, and ALE.P03 has a visible 41-site global recruitment footprint.
  - Lixudebart adds organ-fibrosis optionality with renal, liver, and planned lung development paths rather than a pure oncology-only thesis.
  - Claudin biology now has a commercial precedent via VYLOY, supporting the broader tractability of the target family.
  topRisks:
  - No public human efficacy proof yet exists for the lead oncology ADCs, leaving valuation highly dependent on upcoming clinical data.
  - The Series D pricing terms, cap-table stack, cash balance, and runway are undisclosed, making common-equity underwriting imprecise.
  - FDA dose-optimization expectations and CLDN1 biomarker gating create meaningful safety, enrollment, and execution risk.
  - The ADC competitive field is deep, and approved fibrosis leaders such as Madrigal sit far ahead on commercial proof.
  - There are still no paying commercial customers; current customer proof is specialist-site recruitment rather than monetization.
  unresolvedGaps:
  - Series D share price, stake sold, pre-/post-money valuation, and liquidation preferences are not public.
  - Current cash, burn, runway, and downside operating plan are not public.
  - CLDN1 assay vendor, cutoff, positivity rate, turnaround time, and screen-failure funnel remain undisclosed publicly.
  - Human dose, safety, and efficacy data for ALE.P02 and ALE.P03 remain the decisive unresolved value driver.
  - CMC detail for the ADC programs—linker analytics, DAR, and scale-up reproducibility—remains private.
