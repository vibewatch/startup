company:
  name: Alentis Therapeutics
chapter:
  number: 2
  title: Market Analysis
  summary: 'Alentis sits inside two large but highly filtered therapeutic markets: biomarker-defined solid tumors and stage-specific organ fibrosis. The raw burden lenses are substantial—roughly 325,910 annual U.S. incident cases across Alentis-relevant squamous tumor families before CLDN1 filtering, plus MASLD/MASH affecting 30% to 40% of the world’s population—but those numbers overstate any true serviceable market because claudin-targeted therapies depend on biomarker gating, diagnostic workflow, and specialty-center adoption. Adjacent approvals provide real validation: VYLOY proves claudin-targeted oncology can launch with a companion diagnostic, and Rezdiffra proves fibrosis therapies can win approval in tightly staged populations. The commercial opportunity is therefore credible, but still much narrower and slower-moving than a headline TAM suggests.'
