- id: buyer-user-payer-path
  title: 'Buyer, user, and payer path: diagnostics and specialty workflows dominate adoption'
  body: 'The buyer path is different in oncology and fibrosis, but in both cases it is gated by specialist workflows rather than consumer demand. In oncology, the immediate users are oncologists and trial investigators, but the gatekeeper stack also includes pathologists, molecular-diagnostic laboratories, and infusion-capable centers. Astellas’ VYLOY launch demonstrates the importance of this infrastructure: commercialization required an FDA-approved IHC companion diagnostic, explicit positivity thresholds, and laboratory rollout. That is an important precedent for Alentis because it suggests future CLDN1 market access will likely depend on assay standardization rather than drug efficacy alone. In fibrosis, the user path is slower and more longitudinal. Hepatologists, nephrologists, and pulmonologists manage patients over longer monitoring windows, and treatment decisions intersect with imaging, biopsy or surrogate staging, adverse-event monitoring, and payer prior authorization. Rezdiffra’s
    label is instructive here: even the first approved MASH therapy is restricted to noncirrhotic F2-F3 disease and carries safety-monitoring burdens. Alentis therefore faces two specialty-governed markets where clinical proof and workflow design must evolve together.'
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM022
  - CM023
  - CM024
  - CM028
  - CM029
  - CM030
