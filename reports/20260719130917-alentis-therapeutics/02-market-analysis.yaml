  - FM003
  - FM004
- id: growth-drivers-and-constraints
  title: Growth drivers and adoption constraints
  body: The commercial upside case for Alentis rests on three drivers. First, ADCs remain a validated oncology modality, so Alentis does not need to prove the payload class from scratch. Second, claudin-targeted therapeutics now have a real commercial benchmark in CLDN18.2, which helps investors and future partners imagine a biomarker-led launch model. Third, the first approved MASH therapy shows that regulators will accept fibrosis drugs when patient selection is clear and surrogate benefit is persuasive. The constraints are just as important. Claudin biology is context dependent, which limits any assumption that all CLDN1-expressing tumors will behave like one market. Fibrosis commercialization remains burdened by safety warnings, confirmatory-trial obligations, and long follow-up horizons. Alentis also lacks public CLDN1 prevalence data comparable to Astellas’ CLDN18.2 diagnostic disclosure, so its market model cannot yet be underwritten with the same precision. For now, the company’s
    obtainable market is still the clinical-trial and partnering ecosystem, with broader commercial relevance likely to expand only after convincing human data over the next 12 to 18 months.
