- id: sizing-lenses
  title: 'Sizing lenses: large raw disease burden, smaller biomarker-filtered opportunity'
  body: The raw disease burden surrounding Alentis is undeniably large, but the useful lesson is not that the market is “huge”; it is that several burden lenses converge around clinically important populations. In 2026 U.S. estimates alone, SEER and ACS report 229,410 lung-cancer cases, 60,480 oral-cavity/pharynx cases, 22,530 esophageal cases, and 13,490 cervical-cancer cases. Those tumor groups together imply roughly 325,910 annual incident cases before any CLDN1 positivity or line-of-therapy filtering. Liver cancer adds another 42,340 U.S. cases, relevant because CLDN1 biology and prior Alentis programs intersect with hepatobiliary disease. On the fibrosis side, JCI’s 2025 MASLD/MASH review says 30% to 40% of the world’s population is affected by MASLD/MASH-spectrum disease, prevalence reaches about 65% in type 2 diabetes, and up to 20% of MASLD can progress into MASH. Those are enormous burden signals, but they do not convert directly into serviceable market size because stage, diagnosis,
    biomarker status, and payer thresholds still filter heavily.
  claimRefs:
  - CM011
  - CM012
  - CM013
  - CM014
  - CM015
  - CM016
  - CM017
  - CM018
  - CM019
  - CM021
