callouts:
- calloutType: insight
  title: The market is large enough to matter but too filtered for lazy TAM claims
  body: Raw incidence and prevalence numbers support a real opportunity, but they must be aggressively filtered for biomarker positivity, stage, line of therapy, and specialty-workflow access. The right market view is targeted and evidence-led, not maximalist.
  claimRefs:
  - CM010
  - CM016
  - CM017
  - CM037
- calloutType: risk
  title: Commercial proof in fibrosis remains structurally slower than early enthusiasm implies
  body: Rezdiffra shows that approval is possible, but also that fibrosis markets still impose confirmatory-trial, safety-monitoring, and stage-definition burdens. Alentis will need more than promising interim signals to convert interest into durable market access.
  claimRefs:
  - CM023
  - CM024
  - CM036
  - CM039
