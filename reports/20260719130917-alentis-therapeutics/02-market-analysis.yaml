tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend or demand
  - Excluded demand
  - Buyer / payer gate
  - Why it matters
  rows:
  - - CLDN1+ squamous solid tumors
    - Advanced or metastatic lung, head and neck, cervical, and esophageal squamous cancers that express CLDN1
    - All-comer solid tumors without CLDN1 biology
    - Oncologists, pathology labs, payers, trial centers
    - This is ALE.P02’s current wedge
  - - Broader CLDN1+ solid tumors
    - Other CLDN1-positive tumors reachable by ALE.P03 or future modalities
    - Tumors where CLDN1 is absent, intracellular, or commercially irrelevant
    - Oncologists, diagnostic labs, pharma partners
    - Represents platform expansion beyond the initial squamous focus
  - - Kidney fibrosis / AAV renal involvement
    - ANCA-associated vasculitis with RPGN and related renal-fibrosis contexts
    - General nephrology populations without the program’s biology or staging criteria
    - Nephrologists, hospital formularies, specialty payers
    - Defines current RENAL-F02 opportunity
  - - Liver fibrosis / MASH-adjacent disease
    - Advanced fibrosis and cirrhosis-adjacent populations where organ scarring drives outcomes
    - Early steatosis without clinically meaningful fibrosis
    - Hepatologists, payers, diagnostic/staging pathway owners
    - Large disease burden but heavy stage filtering
  - - Idiopathic pulmonary fibrosis
    - Progressive lung fibrosis with poor prognosis and limited disease-modifying options
    - Interstitial lung diseases without relevant fibrosis mechanism or biomarker fit
    - Pulmonologists, specialty centers, payers
    - Shows why lung fibrosis is commercially interesting despite small absolute populations
  - - Adjacent claudin-targeted oncology market
    - CLDN18.2, CLDN6 and other claudin programs that validate modality and workflow
    - Unrelated oncology modalities
    - Large pharma, diagnostics vendors, oncology KOLs
    - Provides commercialization precedent rather than direct Alentis revenue today
  notes: Table defines markets by biomarker and stage rather than by broad disease labels.
