callouts:
- calloutType: risk
  title: Project Optimus makes dose characterization a first-order risk, not a detail
  body: Alentis is not entering a permissive oncology environment where early targeted therapies can skate by on poorly explored dose levels. FDA Project Optimus explicitly warns that inadequate dose and schedule characterization can create more toxicity without more efficacy, force dose reductions, and even cause irreversible harm. For a first-in-class CLDN1 ADC program, that elevates dose finding into a central underwriting question.
  claimRefs:
  - CR006
  - CR007
  - CR008
  - CR034
- calloutType: insight
  title: The biggest practical risk may be the biomarker funnel, not the science alone
  body: Even if CLDN1 biology is sound, Alentis still has to move enough patients through biopsy, central-lab CLDN1 analysis, prior-line filters, fitness criteria, and specialist-site logistics to generate clean studies and, eventually, a scalable market. NCI’s biomarker-testing cautions and Alentis’ own protocol criteria make the patient-funnel risk unusually tangible.
  claimRefs:
  - CR009
  - CR010
  - CR011
  - CR012
  - CR032
