company:
  name: Alentis Therapeutics
chapter:
  number: 7
  title: Risks
  summary: 'Alentis faces a concentrated clinical-stage biotech risk stack. The core exposures are: (1) biology and clinical-proof risk—CLDN1 remains first-in-class, expression can be context-dependent, and neither oncology ADC has disclosed human efficacy; (2) regulatory and dose/safety risk—FDA Project Optimus raises the bar for dose optimization in oncology, while Alentis’ heavily pretreated CLDN1-selected population creates a narrow safety and enrollment window; (3) biomarker and recruitment risk—ALE.P03 requires central-lab CLDN1 analysis, prior-treatment filters, and specialist-site execution across a 41-location global footprint; (4) indication-specific risk—fibrosis programs address severe diseases with genuine unmet need, but rare-disease patient engagement and organ-specific efficacy remain hard; and (5) competitive, capital, and organizational risk—large ADC incumbents set a high benchmark, Series D capital is meant to produce data within roughly 12–18 months, and public burn/runway
    data remain unavailable. Mitigants exist—Fast Track, orphan incentives, experienced board leadership, and multicenter deployment—but the residual risk remains high until human dose, efficacy, assay, and financing questions are resolved.'
contentRequirements:
- Severity-ranked risks with likelihood, impact, mitigation maturity, residual exposure, and investor relevance.
- Regulatory/legal risk — licenses, approvals, litigation, enforcement, IP, privacy, environmental, sanctions.
- Operational risk — supply chain, manufacturing, logistics, reliability, outages, recalls, safety, security.
- Partner/dependency risk — supplier, distributor, cloud/platform, capital provider, regulator, key-person.
- Financial/model risk — burn, capital intensity, credit/loss exposure, fraud, working capital, macro sensitivity.
- Mitigations, monitoring indicators, thesis-break triggers, and diligence asks.
