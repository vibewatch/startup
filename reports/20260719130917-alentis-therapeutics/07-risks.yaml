- id: indication-and-patient-risk
  title: Indication and patient risk in fibrosis and rare disease
  body: 'The fibrosis branch reduces pure single-indication dependence, but it introduces its own specialist-care and rare-disease exposures. Alentis’ orphan-drug announcement for IPF explicitly says the disease has no cure, that current treatments only slow progression, and that tolerability challenges remain. The Pulmonary Fibrosis Foundation underscores how burdensome pulmonary fibrosis can become, describing breathlessness in routine activities, a broad PF disease family, and a care infrastructure of specialty centers, support groups, trial finders, and research registries. That is good for unmet need but it also shows that patient engagement lives inside a high-touch specialist ecosystem rather than a mass-market channel. The same pattern appears in vasculitis: the Vasculitis Foundation’s support and education footprint signals that patient identification and care are community- and expert-driven. Add the public liver and renal fibrosis studies, and the result is a portfolio spanning
    multiple organs, endpoints, specialists, and recruitment pathways. Positive Phase 1 or Phase 2 signals do not remove the risk that one organ setting translates poorly into another, or that patient recruitment, endpoint sensitivity, or chronic-dosing durability disappoints.'
  claimRefs:
  - CR002
  - CR014
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
  - CR030
  - CR031
- id: competition-capital-and-organization
  title: Competition, capital, and organizational risk
  body: 'Even if the biology works, Alentis competes inside one of biopharma’s busiest arenas. Astellas’ approval of VYLOY shows that claudin biology can support an approved commercial product, but it also raises the bar for assay rigor, patient selection, and commercial execution in the claudin family. Daiichi Sankyo’s pipeline reflects the sheer depth of incumbent ADC development. That backdrop means Alentis must prove not only that CLDN1 works, but that its assets are differentiated enough to win attention and capital against much larger players. The financing and timing pressure is visible in public sources: Series D proceeds were earmarked to launch Phase 1/2 oncology trials and management said it aimed to deliver clinical data within the next 12–18 months. That is a credible catalyst window, but also a finite one. Public sources still do not disclose cash balance, burn, runway, assay economics, or manufacturing reproducibility. Governance offers some mitigation—Luca Santarelli brings
    discovery-to-commercialization experience, and the William Pao board addition adds oncology expertise—but value remains concentrated in a small number of lead programs and a narrow leadership group.'
