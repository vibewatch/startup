evidenceStrategy:
- Use official program pages, trial records, and financing disclosures for company-specific exposure and timing.
- Use FDA/NCI/NIH primary sources for dose-optimization, biomarker, and trial-execution risk.
- Use adverse or cautionary sources on CLDN heterogeneity, rare-disease burden, and competitive claudin/ADC precedent.
- Convert missing cash, assay, and manufacturing detail into explicit diligence asks rather than estimates.
qualityBar:
- Distinguish first-in-class biology risk from ordinary preclinical or commercial risk.
- Tie biomarker and trial criteria directly to enrollment and operational exposure.
- Treat designations and governance upgrades as mitigants, not proof that risk is solved.
- Use competitor and field precedent to calibrate risk, not to assert Alentis-specific outcomes.
sections:
- id: biology-and-clinical-proof
  title: Biology and clinical-proof risk
  body: 'The dominant risk is that Alentis is still trying to prove a first-in-class target and modality combination in humans. ALE.P02 and ALE.P03 are positioned as anti-CLDN1 ADCs with ongoing Phase 1/2 trials, but the public record still shows study entry rather than human efficacy. Lixudebart has more safety and target-engagement history, yet it also remains pre-registrational. The scientific thesis depends on a precise distinction: CLDN1 must be sufficiently exposed and disease-relevant in tumors or fibrotic tissue while remaining shielded in healthy tight junctions. Frontiers reviews and broader claudin literature support the opportunity but also emphasize that claudin biology is heterogeneous and context-dependent across tumor types. That means Alentis is exposed not only to the standard risk of early-stage oncology failure, but also to target-expression and target-access variability that can differ sharply by organ, histology, and disease stage. Until one of the lead programs produces
    convincing human activity with tolerable safety, the whole CLDN1 platform shares a correlated proof risk.'
  tableRefs:
  - TR002
  figureRefs:
  - FR001
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR029
  - CR034
- id: regulatory-biomarker-and-trial
  title: Regulatory, biomarker, and trial-execution risk
  body: The clearest external risk amplifier is regulatory scrutiny of oncology dose and patient selection. FDA Project Optimus says the old cytotoxic-drug paradigm often leaves targeted therapies with poorly characterized doses and schedules, and warns that this can create toxicity without additional efficacy, frequent dose reductions, premature discontinuation, and even persistent or irreversible toxicities. That matters directly to Alentis because its lead oncology assets are ADCs entering human dose-finding. Patient selection adds another layer of fragility. NCI explains that biomarker testing may fail to help if biopsy is unsafe, tissue is inadequate, no matching biomarker is found, biomarkers change over time, or the relevant test is unavailable or uncovered. Alentis’ own ALE.P03 mirrors show a central-lab CLDN1 requirement, prior-line filters, ECOG and organ-function criteria, and exclusion rules that screen aggressively. NIH’s trial-basics page reinforces that clinical-trial participation
    can require substantial time, effort, and discomfort, while inclusion/exclusion criteria exist to protect participants and preserve interpretable data. With 41 named sites across multiple countries, Alentis also inherits protocol-consistency, sample-handling, and data-integration risk.
  tableRefs:
  - TR001
  - TR003
  figureRefs:
  - FR002
