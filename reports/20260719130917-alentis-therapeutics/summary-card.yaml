summary:
  headline: >-
    Alentis has assembled a credible first-in-class CLDN1 platform across oncology ADCs and fibrosis, backed by a large
    Series D and visible clinical momentum. The strongest public signals are target coherence, high-quality financing,
    and multicenter trial activation; the weakest are valuation transparency, cash/runway disclosure, and human efficacy
    proof. A Track / research-more stance is warranted until priced-round terms or clean human data materially reduce
    underwriting uncertainty.
