  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base segmentation — who the real users, buyers, and payers would be
        blocks:
          - type: paragraph
            body: >-
              Alentis has not launched a product, so the correct customer map starts with roles rather than invoices.
              The end users are patients with CLDN1-relevant disease, currently split into two clinical branches. In
              oncology, ALE.P02 is being developed for advanced or metastatic CLDN1-positive squamous solid tumors and
              ALE.P03 for selected advanced or metastatic CLDN1-positive colorectal, intrahepatic cholangiocarcinoma,
              squamous non-small cell lung, urothelial, and cervical squamous tumors. In fibrosis, lixudebart targets
              kidney, liver, and lung fibrosis, with specific public programs in ANCA-associated vasculitis with renal
              involvement, advanced liver fibrosis/mild cirrhosis, and planned IPF. The near-term economic buyer is not
              a hospital pharmacy budget but the capital that funds studies and, later, any large-pharma partner willing
              to commercialize or co-develop. The future payer set would include commercial insurers, Medicare/Medicaid,
              national systems, and potentially rare-disease or specialty-fibrosis channels. Current operational
              customers are the investigators, research coordinators, and specialist centers that screen, enroll, dose,
              and monitor patients under protocol. This makes Alentis’ present customer base clinical and channel-like,
              not commercial.
