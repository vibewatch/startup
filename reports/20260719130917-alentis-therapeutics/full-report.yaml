      - number: '7.3'
        title: Indication and patient risk in fibrosis and rare disease
        blocks:
          - type: paragraph
            body: >-
              The fibrosis branch reduces pure single-indication dependence, but it introduces its own specialist-care
              and rare-disease exposures. Alentis’ orphan-drug announcement for IPF explicitly says the disease has no
              cure, that current treatments only slow progression, and that tolerability challenges remain. The
              Pulmonary Fibrosis Foundation underscores how burdensome pulmonary fibrosis can become, describing
              breathlessness in routine activities, a broad PF disease family, and a care infrastructure of specialty
              centers, support groups, trial finders, and research registries. That is good for unmet need but it also
              shows that patient engagement lives inside a high-touch specialist ecosystem rather than a mass-market
              channel. The same pattern appears in vasculitis: the Vasculitis Foundation’s support and education
              footprint signals that patient identification and care are community- and expert-driven. Add the public
              liver and renal fibrosis studies, and the result is a portfolio spanning multiple organs, endpoints,
              specialists, and recruitment pathways. Positive Phase 1 or Phase 2 signals do not remove the risk that one
              organ setting translates poorly into another, or that patient recruitment, endpoint sensitivity, or
              chronic-dosing durability disappoints.
            claimRefs:
              - CR002
              - CR014
              - CR016
              - CR017
              - CR018
