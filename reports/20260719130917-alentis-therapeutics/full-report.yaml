      - number: '8.4'
        title: Thesis versus anti-thesis — real platform optionality, real valuation opacity
        blocks:
          - type: paragraph
            body: >-
              The thesis is straightforward. Alentis has a coherent first-in-class CLDN1 platform, two clinical-stage
              oncology ADCs, a fibrosis branch that could add second-franchise optionality, and financing from a
              top-tier syndicate large enough to support near-term clinical catalysts. Claudin biology also has
              precedent: Astellas’ approval of VYLOY shows that claudin-targeted therapeutics can become real commercial
              products. The anti-thesis is equally strong. Alentis has no approved product, no public revenue, no
              disclosed human efficacy dataset, and no public round-pricing terms. The ADC field is deep, as Daiichi
              Sankyo’s pipeline demonstrates, and commercial fibrosis proof already belongs to companies such as
              Madrigal. In addition, the valuation case still inherits the dose, biomarker, and trial-execution risks
              captured in earlier chapters. That means the investment debate is less about whether the company is
              interesting and more about whether the current private price—still undisclosed in public evidence—properly
              compensates for uncertainty. Without hard pricing terms or clean human proof, the anti-thesis keeps the
              recommendation out of “buy.”
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV023
              - CV028
              - CV029
              - CV030
              - CV036
              - CV037
          - type: table
