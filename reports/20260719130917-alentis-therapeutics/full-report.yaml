      - number: '1.2'
        title: Leadership, governance, and advisory depth
        blocks:
          - type: paragraph
            body: >-
              The leadership profile became materially more “late-private biotech” in 2024 and 2025. Mark Pruzanski
              joined as chief executive officer in October 2025, replacing Roberto Iacone, who had led the company from
              the early buildout through the Series D financing and initial oncology IND transition. Pruzanski’s
              background at Versanis Bio and Intercept Pharmaceuticals is relevant because it gives Alentis a leader
              with both liver-disease familiarity and capital-markets credibility. The finance function was also
              upgraded when Jon Freve joined as chief financial officer in September 2024 after IPO experience at
              Galecto and Spring Bank. On the scientific side, Luigi Manenti serves as chief medical officer, while
              Alberto Toso moved from head of oncology to chief scientific officer in April 2024 as the company shifted
              emphasis from a monoclonal-antibody oncology program toward ADC execution. Governance is no longer
              founder-only: Luca Santarelli chairs the board, William Pao joined as an independent member in early 2024,
              and the board now includes representatives from OrbiMed, Novo Holdings, Jeito, Frazier, and Longitude. The
              scientific advisory board adds renal-vasculitis, lung-fibrosis, and oncology key opinion leaders, which
              improves external credibility but also raises expectations for disciplined clinical execution.
