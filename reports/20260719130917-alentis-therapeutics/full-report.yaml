chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scientific origin, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Alentis Therapeutics is a clinical-stage Swiss biotechnology company built around a single biological
              wedge: exposed Claudin-1. The company’s official materials describe Claudin-1 as a tight-junction protein
              that becomes overexpressed and externally exposed in fibrotic tissue and in multiple solid tumors,
              creating a target that can be addressed with antibodies and antibody-drug conjugates. That framing matters
              because Alentis is not pitching a broad platform in search of a disease; it is pitching a target-centric
              company whose oncology and fibrosis franchises both rest on the same biology. The company says it was
              founded in 2019 after more than 15 years of research by Professor Thomas Baumert and collaborators at the
              University of Strasbourg and Inserm, and the original launch release ties the initial intellectual
              property to Strasbourg, Inserm, Mount Sinai, and local technology-transfer infrastructure. Today the
              company presents itself as headquartered in Basel, Switzerland, with an R&D subsidiary in Strasbourg and
              clinical operations in the United States. That footprint is consistent with a European discovery base that
              now needs US regulatory and clinical execution to convert Claudin-1 science into registrational oncology
              data.
