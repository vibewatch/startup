      - number: '8.2'
        title: Public comparable band — stage matters more than story
        blocks:
          - type: paragraph
            body: >-
              The most defensible public valuation framework is a wide band of public-biotech comparables, split across
              two axes: innovation platforms and fibrosis proof. On the innovation side, CompaniesMarketCap shows CRISPR
              Therapeutics at about $4.7 billion in July 2026, Beam at about $2.8 billion, Intellia at about $1.6
              billion, and Prime Medicine at about $0.56 billion. The official company pages explain why the spread is
              so wide. CRISPR has one approved therapy and multiple clinical programs. Intellia is publicizing
              additional positive Phase 3 results. Beam points to clinically validated delivery technologies and a
              manufacturing facility. Prime remains more purely platform-led, with no approved therapy. On the fibrosis
              side, Akero’s public valuation sits near $4.5 billion, 89bio’s last known market cap before Roche’s
              acquisition agreement was about $2.2 billion, and approved commercial leader Madrigal stands near $12.8
              billion. Those figures show that public markets reward proof, maturity, and commercialization. Alentis is
              earlier than all of them on public proof, so its fair value should sit below the approved and late-stage
              leaders unless private diligence reveals materially stronger hidden evidence.
