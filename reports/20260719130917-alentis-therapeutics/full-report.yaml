      - number: '3.2'
        title: 'Oncology stack: claudin precedent plus large-pharma ADC execution'
        blocks:
          - type: paragraph
            body: >-
              The oncology comparison that matters most is not target identity alone but whether Alentis can translate
              CLDN1 selectivity into a launch model that looks credible next to better-developed franchises. VYLOY shows
              the opportunity and the cost of biomarker-led commercialization. Astellas’ official HCP materials define
              CLDN18.2 positivity at a strict immunohistochemistry threshold and pair approval with FDA-approved
              testing, but they also document substantial nausea, vomiting, hypersensitivity, and infusion-management
              burdens. The deruxtecan labels make the bar more demanding still. ENHERTU already spans multiple HER2
              indications across breast, lung, gastric, and tumor-agnostic settings, while DATROWAY adds another
              approved topoisomerase-I ADC with meaningful ILD, ocular, and stomatitis liabilities. Alentis therefore
              enters oncology with a differentiated target but without the breadth, human safety depth, or diagnostic
              infrastructure that incumbents already possess. Its direct CLDN1 scarcity is real, yet the actual
              competitive benchmark is the operational competence of large-pharma ADC programs.
