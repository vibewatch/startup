      - number: '7.5'
        title: Mitigations, thesis-break triggers, and top diligence asks
        blocks:
          - type: paragraph
            body: >-
              Alentis is not unmanaged risk. It has real mitigants: ALE.P02 has Fast Track status, lixudebart has orphan
              incentives in IPF, the company has enough capital to run multiple clinical programs, and its board has
              been upgraded with executives who have taken products from discovery toward commercialization. The current
              site footprint and multicenter activity also show the company can activate real-world clinical operations.
              But those mitigants do not neutralize the highest-risk unknowns. The clearest thesis-break triggers would
              be a serious safety signal in either oncology ADC, inability to identify enough CLDN1-positive and
              protocol-eligible patients, evidence that CLDN1 exposure is too heterogeneous to support repeatable
              response, manufacturing or comparability setbacks that slow study conduct, or a financing/reset event
              before credible human data arrive. The most urgent diligence asks are straightforward: CLDN1 assay
              workflow and positivity rate, site activation versus enrollment conversion, drug-antibody ratio and
              manufacturing-control package, cash burn and runway, and the timing/quality of upcoming human readouts.
              Until those are answered, residual risk remains high even though the platform story is coherent.
