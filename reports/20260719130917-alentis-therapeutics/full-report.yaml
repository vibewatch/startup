  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Biology and clinical-proof risk
        blocks:
          - type: paragraph
            body: >-
              The dominant risk is that Alentis is still trying to prove a first-in-class target and modality
              combination in humans. ALE.P02 and ALE.P03 are positioned as anti-CLDN1 ADCs with ongoing Phase 1/2
              trials, but the public record still shows study entry rather than human efficacy. Lixudebart has more
              safety and target-engagement history, yet it also remains pre-registrational. The scientific thesis
              depends on a precise distinction: CLDN1 must be sufficiently exposed and disease-relevant in tumors or
              fibrotic tissue while remaining shielded in healthy tight junctions. Frontiers reviews and broader claudin
              literature support the opportunity but also emphasize that claudin biology is heterogeneous and
              context-dependent across tumor types. That means Alentis is exposed not only to the standard risk of
              early-stage oncology failure, but also to target-expression and target-access variability that can differ
              sharply by organ, histology, and disease stage. Until one of the lead programs produces convincing human
              activity with tolerable safety, the whole CLDN1 platform shares a correlated proof risk.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR029
              - CR034
