              - CV036
      - number: '8.5'
        title: Downside triggers and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The most important discipline point is to separate admiration for the platform from willingness to pay.
              Several things can break the valuation quickly: a safety issue or lack of early activity in the oncology
              programs, a CLDN1 assay funnel that turns out to be too narrow or too operationally hard, a financing
              announced on stressed terms before human proof lands, or a competitor data event that makes Alentis look
              slower or less differentiated. Because public sources do not disclose liquidation preferences,
              anti-dilution, or the common-equity stack, the downside in a flat or down financing could be materially
              worse for junior holders than any headline enterprise-value range suggests. This is why current public
              evidence argues for range-based underwriting and price discipline instead of conviction at a rumored mark.
              If a new round is priced with strong terms and the company shows clean human proof, the entry debate
              changes materially. If the company raises again without proof or with punitive structure, the bear case
              becomes much more probable.
            claimRefs:
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV037
              - CV039
