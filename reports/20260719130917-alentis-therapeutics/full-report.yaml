            title: The biggest practical risk may be the biomarker funnel, not the science alone
            body: >-
              Even if CLDN1 biology is sound, Alentis still has to move enough patients through biopsy, central-lab
              CLDN1 analysis, prior-line filters, fitness criteria, and specialist-site logistics to generate clean
              studies and, eventually, a scalable market. NCI’s biomarker-testing cautions and Alentis’ own protocol
              criteria make the patient-funnel risk unusually tangible.
