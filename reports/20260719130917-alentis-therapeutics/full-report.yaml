      - number: '5.3'
        title: Independent validation and IP expansion
        blocks:
          - type: paragraph
            body: >-
              Alentis’ technology story is materially stronger than a company-claims-only narrative because independent
              literature supports several parts of it. The 2022 Science Translational Medicine paper shows that highly
              specific monoclonal antibodies targeting exposed non-junctional CLDN1 reversed pro-fibrogenic signaling in
              patient-derived liver models and demonstrated anti-fibrotic effects in lung and kidney models, while
              nonhuman primate safety studies showed no serious adverse events at high concentrations. The 2023 Journal
              of Hepatology paper extends the case into cancer by showing CLDN1-specific antibodies suppressed tumor
              growth and invasion and reprogrammed the HCC microenvironment in model systems. The 2025 PSC paper adds
              another fibrosis-relevant indication, arguing that CLDN1 is both a mediator and a potential therapeutic
              target in biliary disease. On the IP side, public patent records show a maturing estate: humanized
              anti-CLDN1 antibodies filed from the Strasbourg/Inserm axis, a WIPO family covering anti-CLDN1 monoclonal
              antibodies for fibrotic diseases, and a 2025 WIPO application covering anti-CLDN1 ADCs with exatecan
              payloads. This combination of literature and patent drift suggests the company is broadening from one
              antibody concept into a platform estate.
