      - number: '7.2'
        title: Regulatory, biomarker, and trial-execution risk
        blocks:
          - type: paragraph
            body: >-
              The clearest external risk amplifier is regulatory scrutiny of oncology dose and patient selection. FDA
              Project Optimus says the old cytotoxic-drug paradigm often leaves targeted therapies with poorly
              characterized doses and schedules, and warns that this can create toxicity without additional efficacy,
              frequent dose reductions, premature discontinuation, and even persistent or irreversible toxicities. That
              matters directly to Alentis because its lead oncology assets are ADCs entering human dose-finding. Patient
              selection adds another layer of fragility. NCI explains that biomarker testing may fail to help if biopsy
              is unsafe, tissue is inadequate, no matching biomarker is found, biomarkers change over time, or the
              relevant test is unavailable or uncovered. Alentis’ own ALE.P03 mirrors show a central-lab CLDN1
              requirement, prior-line filters, ECOG and organ-function criteria, and exclusion rules that screen
              aggressively. NIH’s trial-basics page reinforces that clinical-trial participation can require substantial
              time, effort, and discomfort, while inclusion/exclusion criteria exist to protect participants and
              preserve interpretable data. With 41 named sites across multiple countries, Alentis also inherits
              protocol-consistency, sample-handling, and data-integration risk.
            claimRefs:
