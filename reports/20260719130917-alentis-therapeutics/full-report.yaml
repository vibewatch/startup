              and site footprint. Across official and registry sources, Alentis currently shows two ongoing oncology
              trials and one ongoing renal-fibrosis trial, plus a completed liver-fibrosis study that provides
              historical dosing proof. Summing disclosed planned enrollment for the ongoing interventional studies
              yields 410 planned participants: 170 for ALE.P02, 180 for ALE.P03, and 60 for RENAL-F02. ALE.P03 is the
