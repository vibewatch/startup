companyProfile:
  summary: >-
    Alentis Therapeutics is a private clinical-stage biotech founded in 2019 around Thomas Baumert’s CLDN1 research at
    the University of Strasbourg and Inserm, with headquarters in Basel/Allschwil, an R&D footprint in Strasbourg, and
    clinical operations in the United States. The company is building a unified exposed-CLDN1 platform across two
    modality families: oncology ADCs (ALE.P02 and ALE.P03) and the fibrosis antibody lixudebart. Public milestones
    include FDA IND clearance and Fast Track designation for ALE.P02, an ongoing ALE.P03 first-in-human program with a
    41-site recruiting footprint, early renal and liver fibrosis data for lixudebart, and a $181.4M Series D in November
    2024 led by OrbiMed with Novo Holdings and Jeito. Public evidence supports a coherent platform and high-quality
    investor syndicate, but not a verified current post-money valuation or full cash/runway picture.
  foundedDate: '2019-01-01'
  founders:
    - name: Thomas Baumert
      role: Scientific founder / founding research source
      background: >-
        University of Strasbourg and Inserm physician-scientist whose Claudin-1 research underpins the company’s
        exposed-CLDN1 platform thesis.
      claimRefs:
        - CO004
        - CO011
  foundingLocation: Strasbourg research origin with Basel company formation
  headquarters: Basel, Switzerland
  productSummary: >-
    The visible product line consists of two anti-CLDN1 oncology ADCs—ALE.P02 and ALE.P03—plus lixudebart, a
    first-in-class fibrosis antibody. ALE.P02 and ALE.P03 use the same CLDN1-targeting logic with different payloads for
    solid tumors, while lixudebart targets exposed CLDN1 in kidney, liver, and lung fibrosis. All three assets are
    precommercial and still depend on clinical proof, biomarker workflow, and manufacturing execution.
  customerFocus: >-
    Future customers are CLDN1-positive oncology and fibrosis patients, specialist trial centers, and potential pharma
    counterparties; there are no paying commercial customers yet.
  businessModel: >-
