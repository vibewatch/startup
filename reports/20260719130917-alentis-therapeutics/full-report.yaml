        title: Exhibits
        blocks:
          - type: callout
            title: Project Optimus makes dose characterization a first-order risk, not a detail
            body: >-
              Alentis is not entering a permissive oncology environment where early targeted therapies can skate by on
              poorly explored dose levels. FDA Project Optimus explicitly warns that inadequate dose and schedule
              characterization can create more toxicity without more efficacy, force dose reductions, and even cause
              irreversible harm. For a first-in-class CLDN1 ADC program, that elevates dose finding into a central
              underwriting question.
            calloutType: risk
            claimRefs:
