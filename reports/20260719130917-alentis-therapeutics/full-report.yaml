      - number: '3.3'
        title: 'Fibrosis stack: differentiated mechanism, weaker maturity'
        blocks:
          - type: paragraph
            body: >-
              Fibrosis is the more crowded competitive flank. Lixudebart gives Alentis a mechanistically differentiated
              fibrosis thesis because it targets CLDN1 biology across kidney, liver, and lung fibrosis rather than the
              metabolic pathways emphasized by current leaders. But maturity clearly favors competitors. Rezdiffra
              already holds accelerated approval in noncirrhotic MASH with F2-F3 fibrosis, albeit with hepatotoxicity,
              gallbladder, interaction, and cirrhosis-use limits. 89bio’s pegozafermin is already in the global Phase 3
              ENLIGHTEN program and is explicitly designed to support accelerated approval in noncirrhotic MASH, while
              Akero’s efruxifermin is in the three-part Phase 3 SYNCHRONY program covering histology, real-world, and
              outcomes settings. Novo Nordisk has added another serious entrant with semaglutide: positive ESSENCE
              histology data and FDA Priority Review signal that future fibrosis competition may come not just from
              specialist biotechs but from obesity-scale incumbents. The result is a market where Alentis may be
              scientifically distinct but is not yet maturity advantaged, commercially scaled, diagnostically
              standardized, or payer-ready today globally.
            claimRefs:
