      - number: '7.4'
        title: Competition, capital, and organizational risk
        blocks:
          - type: paragraph
            body: >-
              Even if the biology works, Alentis competes inside one of biopharma’s busiest arenas. Astellas’ approval
              of VYLOY shows that claudin biology can support an approved commercial product, but it also raises the bar
              for assay rigor, patient selection, and commercial execution in the claudin family. Daiichi Sankyo’s
              pipeline reflects the sheer depth of incumbent ADC development. That backdrop means Alentis must prove not
              only that CLDN1 works, but that its assets are differentiated enough to win attention and capital against
              much larger players. The financing and timing pressure is visible in public sources: Series D proceeds
              were earmarked to launch Phase 1/2 oncology trials and management said it aimed to deliver clinical data
              within the next 12–18 months. That is a credible catalyst window, but also a finite one. Public sources
              still do not disclose cash balance, burn, runway, assay economics, or manufacturing reproducibility.
              Governance offers some mitigation—Luca Santarelli brings discovery-to-commercialization experience, and
              the William Pao board addition adds oncology expertise—but value remains concentrated in a small number of
              lead programs and a narrow leadership group.
            claimRefs:
