      - number: '3.4'
        title: Moat durability, switching costs, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Alentis’ moat is easiest to describe and hardest to underwrite. The strongest pillar is biological
              novelty: public materials position CLDN1 as a shared anchor across oncology and fibrosis, and no retained
              source shows an approved CLDN1 drug. That creates partner appeal if early human data show clean target
              selectivity. The weak points are clinical proof, diagnostics, and timing. Technical reviews emphasize that
              claudin biology is heterogeneous by tumor type, so success in one CLDN1-positive cancer may not generalize
              cleanly across the larger tumor list. Public sources also do not show a CLDN1 companion-diagnostic pathway
              comparable to the one VYLOY already uses for CLDN18.2. Switching costs are low before approval because
              investigators, investors, and future pharma partners can multi-home across multiple fibrosis or
              biomarker-oncology programs. They rise sharply after launch, when testing workflows, infusion operations,
              and safety-management habits become embedded. For now, Alentis remains more vulnerable to displacement by
              better-capitalized adjacent players than by any exact CLDN1 copycat.
