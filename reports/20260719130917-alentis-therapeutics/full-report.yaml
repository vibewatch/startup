  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape shape: few exact CLDN1 peers, many adjacent incumbents'
        blocks:
          - type: paragraph
            body: >-
              Alentis competes in a deceptively asymmetric landscape. On the narrowest definition—companies advancing
              CLDN1-targeted drugs into the clinic—public sources still show very few direct peers. That scarcity
              supports the company’s first-in-class narrative, but it does not mean the field is empty. The closest
              commercialization precedent today is Astellas’ VYLOY, a CLDN18.2-targeted antibody that proves claudin
              biology can be commercialized when a biomarker threshold, approved test, and defined tumor segment are in
              place. The broader modality bar is even higher. Daiichi Sankyo’s May 2026 pipeline shows five deruxtecan
              ADC families, while approved products such as ENHERTU and DATROWAY already give buyers, investigators, and
              partners a concrete view of what a scaled ADC franchise looks like. In other words, Alentis is competing
              less against a swarm of CLDN1 startups than against adjacent claudin and ADC incumbents with established
              safety databases, trial operations, and commercialization muscle.
