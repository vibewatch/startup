  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: biomarker-defined oncology plus stage-specific fibrosis'
        blocks:
          - type: paragraph
            body: >-
              Alentis does not operate in a single monolithic “oncology and fibrosis” market. Its practical market
              boundary is narrower and more interesting. On the oncology side, the near-term wedge is CLDN1-positive
              squamous solid tumors, with ALE.P02 explicitly framed around lung, head and neck, cervical, and esophageal
              cancers and ALE.P03 extending toward broader CLDN1-positive solid tumors. On the fibrosis side, the
              company is not chasing all fibro-inflammatory disease; it is targeting kidney, liver, and lung fibrosis
              settings where exposed Claudin-1 is believed to be biologically actionable. This boundary discipline
              matters because it prevents lazy TAM inflation. The company’s commercial future depends on a subset of
              patients whose disease both expresses the right biology and can be reached through specialist pathways.
              The 2026 Nature Reviews Cancer and Frontiers reviews support the logic of claudin targeting broadly, but
              they also make clear that claudin biology is heterogeneous by tumor type and therapeutic format. That
              means the market is best thought of as several biomarker-defined micro-markets sharing a modality thesis,
              not one seamless bucket of demand.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
