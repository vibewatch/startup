          - type: callout
            title: The real commercial bottleneck is the biomarker-and-center workflow
            body: >-
              The decisive customer question is not whether CLDN1 sounds interesting. It is whether Alentis can move
              enough biomarker-positive patients through central-lab testing, prior-line filters, specialist-site
              throughput, IV infusion, and future reimbursement processes to create a scalable market. That makes assay
              workflow and screen-failure data disproportionately important diligence items.
