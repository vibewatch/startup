      - number: '8.6'
        title: Recommendation and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Our recommendation is TRACK / RESEARCH-MORE with low-to-medium confidence, a high risk rating, and a
              valuation stance of “do not underwrite to an unverified unicorn mark.” The investment case is simply too
              dependent on missing information: priced-round economics, current cash and burn, cap-table overhang, CLDN1
              assay conversion, and early human dose/response evidence. Board quality modestly helps—Luca Santarelli and
              William Pao add execution and oncology credibility—but governance improvement alone is not a valuation
              catalyst. The right next step for an investor is not to guess the post-money; it is to force a diligence
              list that can convert the business from an opaque private story into an underwritable one. The
              highest-value asks are the Series D term sheet, cash runway, preference stack, assay workflow metrics, and
              upcoming clinical-readout design. Until those are obtained, a disciplined investor should treat Alentis as
              a promising but evidence-light private biotech and wait either for a clearly priced round or for clean
              human proof.
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV035
              - CV036
              - CV038
              - CV040
          - type: table
            tableRef: TV006
            claimRefs:
              - CV002
              - CV021
              - CV032
              - CV038
              - CV040
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: The right question is not “is Alentis a unicorn?” but “what evidence would justify one?”
            body: >-
              The public record is good enough to show a high-quality financing and a credible platform, but not good
              enough to verify the priced terms of Series D. That makes any simple assertion that Alentis is worth more
              than $1 billion more narrative than evidence. The disciplined investor flips the burden of proof and
              demands round terms, cap-table structure, and early human data before paying for that narrative.
            calloutType: insight
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV031
              - CV038
          - type: callout
            title: Why the recommendation is track, not buy
            body: >-
              Alentis may be a strong company and still be a weak underwriting decision at the wrong price. Public
              sources leave too many valuation-critical items unknown: current cash, burn, pricing terms, preferences,
              assay conversion, and human efficacy. Until one of those changes materially, the rational stance is to
              track the company and wait for either clean proof or a transparently priced entry.
            calloutType: risk
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV037
              - CV040
