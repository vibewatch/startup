        title: Retention and procurement friction — the gating questions are biomarker, eligibility, and reimbursement
        blocks:
          - type: paragraph
            body: >-
              The deepest customer risk is that Alentis can clear early enrollment hurdles yet still face a narrow
              eventual market because access depends on specialist workflows. For ALE.P03, public mirrors say patients
              must provide tissue for CLDN1 analysis in a central laboratory, have metastatic disease progression, have
              exhausted or failed prior standard regimens, and generally present with ECOG 0/1 plus adequate organ
              function. Exclusions include active CNS disease requiring treatment, significant gastrointestinal
              bleeding, active infection, and symptomatic or clinically important pneumonitis/interstitial lung disease.
              Those are standard for oncology trials, but collectively they imply that the addressable customer at
              launch will be screened down at multiple steps before a patient ever reaches infusion. Public sources also
              show that the therapy is given by IV infusion, which reinforces the need for specialist sites and
              operational throughput. Retention metrics such as NRR, GRR, contract renewal, or satisfaction scores do
              not exist. The relevant future retention proxy is whether diagnostic infrastructure, screening conversion,
              site throughput, and payer coverage can sustain a treatment journey from biopsy to infusion to follow-up.
              Foundation Medicine, Guardant, and Roche illustrate how mature the surrounding precision-oncology
              ecosystem already is; Alentis still has to plug into it.
