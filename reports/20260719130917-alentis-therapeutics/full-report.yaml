            body: >-
              Alentis has credible early deployment into high-quality specialist centers, but that should not be
              confused with customer traction. There are no approved products, no disclosed commercial accounts, no
              payer coverage, no repeat-purchase behavior, and no revenue concentration metrics. The company’s current
