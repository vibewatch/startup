  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current financing context — a strong round but not a priced public anchor
        blocks:
          - type: paragraph
            body: >-
              The starting point for Alentis valuation is not a public stock chart or an audited 10-K. It is the
              November 2024 Series D, which officially raised $181.4 million and was presented as oversubscribed, led by
              OrbiMed with Novo Holdings and Jeito co-leading. That is a major positive signal: the round was large,
              recent, and backed by sophisticated healthcare investors. But it is not the same thing as a clean
              valuation mark. Public materials say the proceeds will fund Phase 1/2 trials for the two CLDN1 oncology
              ADCs, expand the pipeline, and support general corporate purposes, while management said it aimed to
              generate clinical data over the next 12–18 months. What public sources do not disclose is the pricing
              detail that would convert the round into a real equity valuation: share price, stake sold, pre-money,
              post-money, liquidation preferences, anti-dilution protections, or even current cash balance. Because of
              that omission, the round should be treated as financing strength and investor validation, not as proof
              that a specific private-market price—let alone an unverified unicorn mark—is justified today.
            claimRefs:
              - CV001
              - CV002
