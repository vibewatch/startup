            body: >-
              If Alentis succeeds, its customer expansion path is likely to look like a business-development motion, not
              a direct enterprise-sales motion. Positive human data could let the company broaden from current
              specialist-site usage into land-and-expand deployment across more tumor types, more fibrosis organs, and
              one or more large-pharma partnerships. Roche is notable because it combines pharmaceuticals and
              diagnostics under one roof and explicitly frames oncology around personalized healthcare. AbbVie
              emphasizes solid tumors and ADC-style biomarker-targeted modalities. Novartis and Merck each show deep
              oncology investment, broad pipelines, and provider-facing ecosystems that make them plausible future
              counterparties or competitive benchmarks. But none of these pages is evidence of an Alentis relationship
              today. That creates a sharp concentration problem: the entire customer thesis currently rests on a handful
              of ongoing studies, a finite set of specialist centers, and hoped-for future partner interest. There is no
              payer coverage evidence, no pricing evidence, no top-customer revenue concentration because there is no
              revenue, and no proof that trial participation converts into commercial adoption. Expansion potential is
              real, but it remains contingent on clinical proof, assay workflow, and partner appetite.
