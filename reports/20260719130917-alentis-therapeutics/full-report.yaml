      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Series D pricing terms
        - Share price, stake sold, pre-/post-money, preferences
        - Converts financing signal into an actual valuation anchor
        - Request term sheet, closing docs, and cap table
      - - Cash, burn, runway
        - Current liquidity and downside operating plan
        - Defines how much proof can be bought before another financing
        - Request board materials or audited financial package
      - - Cap-table overhang
        - Liquidation preferences, anti-dilution, common vs preferred stack
        - Determines who captures value in flat/down outcomes
        - Request charter, financing docs, and waterfall model
      - - Assay economics and funnel
        - CLDN1 positivity rate, turnaround, screen-failure rate
        - Critical to both proof generation and launch economics
        - Request assay workflow and site funnel data
      - - Human proof package
        - Dose, safety, early activity, and fibrosis readout design
        - The single biggest driver of the entire valuation range
        - Request protocols, SAPs, and upcoming catalyst plan
    notes: >-
      These five asks matter more than any incremental narrative. Without them, the valuation remains an informed range
      rather than an underwritten mark.
