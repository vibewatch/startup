chapter:
  number: 7
  title: "Risks"
  summary: "Stack AV's largest investability risks are not demonstrated failures but unresolved gates: deployment authorization, independently measured safety performance, capital durability, and commercial conversion. Public evidence shows a safety-governance structure and SoftBank support, but the assigned record does not quantify current operating readiness, runway, or production deployment."
sections:
  - id: "regulatory-legal-and-data-exposure"
    title: "Regulatory, Legal, and Data Exposure"
    body: >-
      The available evidence establishes that Stack operates test vehicles and collects a broad
      sensor record, but it does not establish the permits, exemptions, or jurisdiction-by-jurisdiction
      authority needed for driverless commercial freight. Stack's May 2026 privacy notice says test
      vehicles collect telemetry together with radar, video, lidar, GPS, and microphone data for ADS
      research and training; it also contemplates enterprise partners using the ADS. Those activities
      create privacy, retention, transfer, cybersecurity, and contractual exposure even though Stack
      says it does not use facial recognition and applies reasonable safeguards. The same notice
      concedes that no transmission or storage system is guaranteed to be fully secure. The appropriate
      underwriting stance is therefore not to assume non-compliance or an incident, but to keep
      regulatory authorization, security assurance, litigation, and freedom-to-operate status open
      until primary records and audit evidence are produced.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR014"
    tableRefs:
      - "TR001"
  - id: "operational-safety-and-readiness"
    title: "Operational Safety and Readiness"
    body: >-
      Safety impact is inherently high because Stack's own page, citing FMCSA, IIHS, and NHTSA for
      North America, reports 455,000 large-truck crashes per year and 5,000 deaths each year involving
      large trucks. Stack presents two governance mitigations: a commitment to share safety-protocol
      information and an outside Safety Advisory Council that it says provides guidance and external
      oversight. These are useful process signals, not substitutes for test miles, disengagements,
      intervention rates, collision records, operational-design-domain limits, or a validated safety
      case. The current homepage still describes the company as developing autonomous systems rather
      than reporting commercial deployment volume. Residual operational risk must consequently remain
      high or unknown until performance data demonstrates readiness under real freight conditions.
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR011"
      - "CR015"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "capital-partner-and-execution-dependencies"
    title: "Capital, Partner, and Execution Dependencies"
    body: >-
      SoftBank is the only capital backer identified in the assigned evidence, and the amount and
      conditions of that support are not consistently disclosed in the usable record. Stack's launch
      release says SoftBank supplies capital, resources, and AI expertise; Technical.ly described the
      amount as unspecified, while Trucking Dive reported that a spokesperson did not answer its
      funding-level inquiry. The founders' Argo AI history adds relevant execution context rather than
      proving that Stack will repeat Argo's outcome: independent coverage records Argo's 2022 closure,
      Ford and Volkswagen write-offs, and Ford's view that the predecessor failed to attract new
      investors while scaled autonomy remained distant. Tracxn's count of 110 active competitors,
      including 41 funded companies, reinforces the need to diligence financing durability and partner
      conversion rather than infer runway from funding headlines.
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR014"
    tableRefs:
      - "TR003"
  - id: "monitoring-and-thesis-breaks"
    title: "Monitoring, Diligence, and Thesis-Break Conditions"
    body: >-
      Investment monitoring should focus on evidence releases, not narrative milestones. The thesis
      should pause if Stack cannot document its operating-authority pathway, provide independently
      reviewable safety metrics, demonstrate funded runway through the next technical milestone, or
      show enforceable OEM and fleet-partner commitments. A severe safety event, a material data
      breach, loss of sponsor support, or repeated failure to convert development work into measured
      commercial operations would be thesis-break events once verified. Workforce evidence also needs
      reconciliation: the 2023 launch release reported 150 employees across headquarters and 15 states,
      while the extracted Tracxn page contains 248 employees as of December 31, 2024 and a separate 304
      figure dated only "Aug 26." These are proposed diligence gates, not company commitments, and the
      assigned analyst comparison is itself conflict-sensitive because its author disclosed a long
      UBER position.
    claimRefs:
      - "CR012"
      - "CR013"
      - "CR015"
      - "CR016"
