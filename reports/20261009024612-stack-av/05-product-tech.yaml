  title: "Product & Technology"
  summary: "Stack AV develops proprietary Level 4 automated driving systems and specialized cloud assistance infrastructure for Class 8 freight trucks, utilizing multi-modal sensor fusion, perception machine learning architectures, and human-in-the-loop remote assistance to address long-haul supply chain bottlenecks."
sections:
  - id: "product-definition-and-modular-footprint"
    title: "Product Definition and Modular Footprint"
    body: "Stack AV engineers a full-stack autonomous trucking platform engineered specifically for Class 8 heavy-duty vehicles operating across interstate and highway freight corridors. Rather than pursuing passenger mobility or urban robotaxis, the company concentrates its technical development entirely on the operational constraints of long-haul logistics, where driver shortages, regulated service-hour limits, and elevated collision liabilities create pressing demand for continuous freight transit. At the heart of Stack AV's product offering is an integrated Automated Driving System (ADS) combining physical vehicle-mounted compute, an expansive sensor suite, real-time perception and motion-planning algorithms, and cloud-hosted operations tooling. Operating across headquarters in Pittsburgh and distributed engineering teams in 15 states, the firm structures its core product capabilities across five distinct modules: on-vehicle sensor hardware arrays, real-time perception architecture, motion planning and vehicle controls, cloud-native Remote Assist, and fleet data infrastructure. While the core autonomy stack remains in closed test-fleet development, developer signals and engineering disclosures confirm active road-testing of instrumented Class 8 test vehicles across operational logistics corridors."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
    tableRefs:
      - "TE001"
  - id: "technical-architecture-and-sensor-fusion"
    title: "Technical Architecture and Sensor Fusion"
    body: "The technical architecture of Stack AV's autonomous driving system relies on a multi-tiered software and hardware pipeline designed to resolve the unique physical dynamics of heavy commercial trucks. Class 8 tractor-trailers operate at highway speeds with gross combined weights exceeding 80,000 pounds, requiring perception horizons extending hundreds of meters ahead to guarantee safe stopping distances. Stack AV outfits its test vehicles with a comprehensive multi-modal sensor array encompassing radar units, video cameras, lidar scanners, precision GPS, and acoustic microphones designed to detect and record ambient highway conditions. Sensor telemetry is ingested by foundational machine learning architectures within the Perception Architecture subsystem, which performs actor detection, continuous 3D tracking, and semantic scene understanding to resolve long-tail driving anomalies. Downstream motion-planning modules compute collision-free trajectories and actuate steering, throttle, and braking systems. When autonomous vehicles encounter ambiguous edge cases—such as complex construction zones or road hazards—the system interfaces via live cellular video and data uplinks to Stack AV's cloud-based Remote Assist platform, allowing human operators to issue high-level tactical guidance to resolve edge-case impasses."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "deployment-safety-and-operational-workflows"
    title: "Deployment, Safety Governance, and Workflow Integration"
    body: "Deploying autonomous trucking systems requires rigorous safety engineering, fail-operational redundancy, and seamless coordination with existing fleet workflows. In standard commercial logistics, freight carriers face substantial operational bottlenecks, including mandatory hours-of-service rest stops that cap truck utilization at approximately 10 to 11 hours per day, high per-mile operating expenses, and severe liabilities from roadway accidents, where catastrophic collisions can cost over $3 million per fatal or severe incident. Stack AV's operational model pairs automated highway transit with human-in-the-loop monitoring to maximize vehicle uptime while optimizing infrastructure efficiency. To govern system reliability and public road readiness, the company established an external Safety Advisory Council composed of former leadership from the National Transportation Safety Board (NTSB), the Federal Motor Carrier Safety Administration (FMCSA), and the National Highway Traffic Safety Administration (NHTSA). However, Stack AV's technology remains pre-commercial, without public disclosures of driverless regulatory exemption approvals, formal OEM factory integration agreements, or uncrewed commercial freight runs."
    claimRefs:
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"
    tableRefs:
      - "TE002"
