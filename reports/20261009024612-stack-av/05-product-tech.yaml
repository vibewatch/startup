callouts:
  - calloutType: "insight"
    title: "Remote Assist Architecture as Commercialization Accelerator"
    body: "Stack AV's dedicated Remote Assist engineering organization indicates an operating model that utilizes human-in-the-loop cloud intervention to navigate complex, ambiguous edge cases. By streaming real-time video over cellular uplinks to remote operators, the system can resolve unstructured driving impasses without requiring an in-cab safety driver, serving as a vital bridge between supervised testing and fully autonomous commercial operations."
    claimRefs:
      - "CE008"
      - "CE009"
  - calloutType: "risk"
    title: "Pre-Commercial Stage and Absence of OEM Integration Disclosures"
    body: "While Stack AV benefits from an experienced robotics leadership team and SoftBank capital, the company has not publicly disclosed factory-installed drive-by-wire partnerships with major Class 8 truck OEMs (such as PACCAR, Daimler, or Volvo). Without production chassis integration, retrofitted test fleets face significant hurdles scaling to high-reliability commercial freight volumes."
