company:
  name: Stack AV

chapter:
  number: 6
  title: Customers
  summary: >
    Stack AV remains pre-commercial as of late 2026 with zero publicly announced paying customers,
    commercial carrier contracts, or production freight routes. While leadership reports positive
    feedback from demonstrating its autonomous systems on 18-wheelers to prospective enterprise
    fleet partners, commercialization timelines and fleet commitments remain undisclosed.
    The company has established formal data governance and safety advisory frameworks to prepare
    for enterprise deployments, but faces competitive pressure from sector peers advancing on
    commercial highway freight corridors.

sections:
  - id: customer-segmentation
    title: Target Customer Segmentation and Buyer Dynamics
    body: >
      Stack AV targets the Class 8 commercial motor freight industry, focusing on long-haul
      carriers, enterprise supply chain shippers, and private corporate fleets operating high-density
      highway lanes. The buyer dynamic in heavy-duty autonomous trucking involves complex organizational
      alignment across carrier executive leadership, fleet operations managers, and safety compliance
      teams. Enterprise fleet customers evaluate autonomous driving systems based on proven roadway
      safety, equipment reliability, fuel economy, and seamless integration into dispatch networks.
      Stack AV's enterprise data protection disclosures establish that the company anticipates
      allowing enterprise partners to use its Automated Driving System while Stack AV collects and
      maintains vehicle telemetry, video camera feeds, and geolocation data. Furthermore, management
      emphasizes that evolving consumer demand patterns necessitate intelligent, AI-driven supply
      chains that can deliver freight faster and more reliably. To facilitate institutional procurement
      and address rigorous carrier safety vetting, Stack AV established an external Safety Advisory
      Council composed of former transportation safety and regulatory officials. [CU003] [CU004] [CU007] [CU008]
    claimRefs:
      - CU003
      - CU004
      - CU007
      - CU008
    tableRefs:
      - TU001

  - id: adoption-trajectory
    title: Adoption Trajectory and Fleet Deployment Footprint
    body: >
      Stack AV's customer adoption trajectory remains in an early pre-revenue demonstration phase.
      Industry trackers record zero commercial revenue run-rate for the company as of 2026, consistent
      with its ongoing focus on core autonomous systems development and initial highway testing.
      The company deployed an initial test fleet of heavy-duty autonomous trucks on public roads in 2023,
      using traditional engine test tractors while ensuring compatibility with future electric vehicle
      platforms. Management has leveraged this fleet to demonstrate autonomous driving capabilities to
      prospective commercial partners across multiple states. However, prospective fleet customers
      confront substantial adoption hurdles, including stringent federal motor carrier safety standards,
      insurance underwriter requirements, and complex depot integration demands. Backed by long-term
      capital from SoftBank Group Corp, Stack AV has maintained a development posture focused on
      achieving full unconstrained highway autonomy rather than prematurely locking in constrained
      corridor pilot agreements. [CU005] [CU009] [CU013] [CU014]
    claimRefs:
      - CU005
      - CU009
      - CU013
      - CU014
    tableRefs:
      - TU002
    figureRefs:
      - FU001

  - id: named-customer-proof
    title: Named Customer Proof and Competitive Context
    body: >
      As of October 2026, Stack AV has not disclosed any named customer relationships, commercial
      shipper letters of intent, or binding carrier capacity commitments. Chief Executive Officer
      Bryan Salesky publicly confirmed that the startup is actively demonstrating its autonomous
      technology on 18-wheelers to potential enterprise customers with encouraging feedback, but has
      consistently declined to reveal specific partner names. This private demonstration approach
      contrasts sharply with the public commercial milestones publicized by key industry rivals.
      Peer autonomous trucking developers Aurora Innovation, Kodiak Robotics, and Torc Robotics have
      established prominent customer pilot programs with major logistics carriers such as Werner
      Enterprises, FedEx, and Uber Freight. While Stack AV's decision to withhold partner disclosures
      aligns with its patient capital strategy, it prevents external validation of market traction,
      pricing models, and carrier satisfaction metrics. [CU001] [CU002] [CU006] [CU011]
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU011
    tableRefs:
      - TU003

  - id: retention-and-concentration
    title: Commercial Durability and Customer Concentration Risks
    body: >
      Because Stack AV has not launched commercial freight service, traditional software customer
      durability metrics such as Net Revenue Retention, Gross Revenue Retention, and cohort renewal
      rates cannot be measured. Instead, customer durability will be determined by operational uptime,
      safety compliance track records, and system integration depth once carrier fleets deploy.
      Stack AV's publication of an inaugural Voluntary Safety Self-Assessment illustrates its efforts
      to build transparent governance to reassure prospective fleet operators. Nevertheless, the lack
      of contracted carrier anchor tenants exposes the company to severe customer concentration risk
      upon commercialization. If initial deployment relies on a narrow group of launch partners, any
      operational pause or route cancellation by a primary carrier would disproportionately impact
      business momentum. Moreover, competing autonomous developers that secure multi-year carrier
      relationships could lock up premier long-haul corridors and equipment allocations. [CU004] [CU010] [CU012] [CU014]
    claimRefs:
      - CU004
      - CU010
      - CU012
      - CU014

