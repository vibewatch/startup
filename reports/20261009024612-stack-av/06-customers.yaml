callouts:
  - calloutType: risk
    title: Absence of Named Commercial Carrier Partners Creates Deployment Uncertainty
    body: >
      Unlike sector peers Aurora Innovation and Kodiak Robotics, which have publicized carrier
      partnerships with fleets such as Werner Enterprises and FedEx, Stack AV has announced zero
      named customers or pilot commitments. While executive leadership confirms private demonstrations
      to prospective partners, the lack of verifiable carrier traction leaves commercialization timing
      and adoption velocity unconfirmed.
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU011

  - calloutType: insight
    title: Enterprise ADS Framework Signals Focus on Managed Fleet Partnerships
    body: >
      Stack AV's public data governance disclosures explicitly anticipate enterprise partners
      utilizing its Automated Driving System while Stack AV maintains telemetry, video, and geolocation
      infrastructure. This operating architecture suggests Stack AV may pursue a Transportation-as-a-Service
      or managed technology partnership model rather than direct truck ownership.
    claimRefs:
      - CU004
      - CU008
      - CU014

