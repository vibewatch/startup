  - id: FU001
    title: Customer Journey Map
    type: journey-map
    summary: "Five-phase adoption pathway for freight carriers engaging with Stack AV from initial technical demonstration to long-haul commercial deployment."
    data:
      items:
        - label: "1. Demonstration & Technical Validation"
          detail: "Stack AV demonstrates autonomous 18-wheeler capabilities to prospective fleet leadership, validating perception, motion planning, and safety architectures."
        - label: "2. Governance & Safety Review"
          detail: "Carriers review Stack AV's Voluntary Safety Self-Assessment and Safety Advisory Council protocols to satisfy corporate safety and risk management criteria."
        - label: "3. Enterprise Telemetry Integration"
          detail: "Carrier operations evaluate Automated Driving System data interfaces, telemetry feeds, and dispatch integration protocols under bilateral partner terms."
        - label: "4. Supervised Corridor Pilot"
          detail: "Planned deployment of safety-operator-monitored tractors on designated freight lanes to measure fuel efficiency, schedule adherence, and operational uptime."
        - label: "5. Commercial Fleet Operations"
          detail: "Transition to driverless hub-to-hub freight runs with committed freight volumes and recurring capacity-based commercial contracts."
        - label: "6. Network & Lane Expansion"
          detail: "Expansion across multi-state interstate freight corridors and integration into broader shipper and broker supply chain networks."
    approximationNotes: "Illustrative commercial progression derived from industry autonomous trucking adoption cycles and Stack AV disclosed safety and operational frameworks."
