callouts:
  - calloutType: "risk"
    title: "Sponsor Concentration and Tranche Opacity Risk"
    body: "Stack AV's reported $1 billion capital commitment originates from a single investor, SoftBank Group. As observed in Argo AI's sudden shutdown following $3.6 billion in funding, corporate sponsors can pivot capital away from capital-intensive autonomy if macroeconomic conditions sour or commercial timelines extend. Without verified multi-sponsor backing or public tranche milestones, financing dependency represents Stack AV's foremost financial risk."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI011"
  - calloutType: "insight"
    title: "Asset-Light Platform Potential vs Near-Term Cash Consumption"
    body: "While Stack AV's ultimate business model potential lies in high-margin ADS platform software licensing and cloud orchestration, near-term development requires high operational cash burn to support hundreds of engineering staff and continuous Class 8 test fleet operations across multiple states."
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI008"
      - "CI010"
