company:
  name: "Stack AV"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Stack AV addresses autonomous Class 8 trucking, where the retained evidence identifies
    safety, uptime, labor, cost, and supply-chain reliability as adoption drivers but does
    not establish a defensible dollar TAM, SAM, or SOM. Current third-party indicators show
    supervised testing and limited fleet scale, making commercialization timing and buyer
    budgets more important than broad autonomous-vehicle market forecasts.
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >-
      The investable boundary is autonomous systems for Class 8 freight trucks, not the
      broader autonomous-vehicle, logistics-software, electric-truck, warehouse-robotics,
      or passenger-mobility markets. Stack describes an autonomous trucking solution aimed
      at safer and more efficient freight and supply chains, while its founder said in 2023
      that the company was focused on Class 8 trucks but had not disclosed exactly what it
      would automate. The practical substitute set therefore includes human-driven linehaul,
      driver-assistance systems, internal fleet technology, and competing autonomous-truck
      platforms. A 2026 truck unveiling with PACCAR and Peterbilt narrows the product path
      toward OEM-integrated heavy trucks, but it still does not identify a commercial lane,
      priced offering, or addressable spend pool.
    claimRefs: [CM001, CM002, CM007]
    tableRefs: [TM001]
  - id: "buyers-and-adoption"
    title: "Buyers, users, payers, and adoption path"
    body: >-
      Stack's public language points to fleets, carriers, shippers, and supply-chain partners
      as beneficiaries, with operating, safety, procurement, and technology leaders likely
      participating in a purchase. The company frames demand around driver shortages, low
      vehicle uptime, safety exposure, high operating costs, emissions, and pressure for
      reliable supply chains. Adoption is not a simple software sale: the founder highlighted
      the capital required to reach scale and the need for redundant truck equipment, while
      the privacy notice contemplates enterprise partners using Stack's automated driving
      system and generating telemetry, video, audio, and geolocation data. Those dependencies
      imply OEM integration, operational validation, data governance, and fleet workflow
      change before recurring commercial deployment.
    claimRefs: [CM003, CM004, CM005, CM006, CM014]
    tableRefs: [TM003]
  - id: "evidence-constrained-sizing"
    title: "Evidence-constrained sizing"
    body: >-
      The assigned evidence does not provide a comparable revenue pool, per-truck price,
      eligible Class 8 fleet count, route-level operating design domain, or adoption rate,
      so a dollar TAM, SAM, or SOM would be false precision. Demand indicators are material
      but not monetizable by themselves: Stack's safety page cites 455,000 annual large-truck
      crashes, 155,000 injuries in 2021, and roughly 5,000 deaths per year in North America.
      Supply-side evidence is also broad, with Tracxn listing 110 active competitors, 41
      funded and 12 exited. These measures establish problem severity and market crowding;
      they do not establish the portion of freight spend Stack can serve or the revenue it
      can capture.
    claimRefs: [CM011, CM012, CM013, CM015]
    tableRefs: [TM002]
  - id: "timing-and-valuation"
    title: "Commercial timing and valuation relevance"
    body: >-
      As of October 8, 2026, The Road to Autonomy's proprietary index ranked Stack seventh
      with a 21.7 composite score, described supervised testing, and reported 31 registered
      automated vehicles in Texas. Its six factor scores were strongest in safety and
      commercial positioning but weak in operations and revenue, a pattern consistent with
      technical and partnership progress preceding scaled monetization. Tracxn's separate
      directory ranked Stack 30th among 110 active competitors, illustrating that rankings
      change materially with the population and methodology. Valuation work should therefore
      phase adoption around verified driver-out operations, paid freight, fleet utilization,
      and unit economics rather than applying a broad autonomy-market multiple to an
      undisclosed revenue base.
    claimRefs: [CM008, CM009, CM010, CM016]
    figureRefs: [FM001]
