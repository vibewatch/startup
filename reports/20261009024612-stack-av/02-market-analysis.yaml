callouts:
  - calloutType: "risk"
    title: "Do not capitalize a broad autonomy TAM"
    body: >-
      The retained evidence supports a real freight-safety and efficiency problem but not
      Stack-specific pricing, paid deployment volume, eligible routes, or capture rate.
      Underwriting should remain milestone-based until those denominators are disclosed.
    claimRefs: [CM002, CM008, CM009, CM015, CM016]
