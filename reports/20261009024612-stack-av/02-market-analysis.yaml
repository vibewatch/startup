      - ["Stack AV safety page", "2021", "North America", "155,000 injuries from large-truck collisions", null, "Company page attributes data to FMCSA, IIHS, and NHTSA", "Low", "Historical harm metric; not an addressable spend pool"]
      - ["Stack AV safety page", "Annual; page undated", "North America", "5,000 deaths involving large-truck crashes", null, "Company page attributes data to FMCSA, IIHS, and NHTSA", "Low", "Rounded company-presented metric; not a market size"]
      - ["The Road to Autonomy", "2026-10-08", "Stack AV registered fleet in Texas", "31 automated vehicles", null, "Proprietary operator index using public and modeled inputs", "Medium", "Company-specific operating indicator, not sector fleet or paid deployments"]
      - ["Tracxn", "Page accessed 2026-10-09", "Active competitor directory", "110 active; 41 funded; 12 exited", null, "Commercial company directory", "Medium", "Category composition and coverage are proprietary; not demand or revenue"]
      - ["No retained source", "Current run", "Class 8 autonomous trucking", null, null, "TAM/SAM/SOM path attempted from assigned evidence", "Low", "No comparable spend, eligible fleet, price, route, or adoption denominator"]
    notes: >-
      Values retain each publisher's metric, period, denominator, and limitations. CAGR is
      null because none of the assigned sources supplied a comparable growth series.
    claimRefs: [CM008, CM009, CM011, CM012, CM013, CM015]
  - id: "TM003"
    title: "Segment and buyer map"
    columns: ["Segment", "Buyer", "User", "Payer", "Workflow", "Budget owner", "Adoption trigger"]
    rows:
      - ["For-hire Class 8 carrier", "Operations and technology leadership", "Dispatch, safety, maintenance, and remote support teams", "Carrier", "Hub-to-hub or linehaul freight movement", "Fleet operations or technology", "Higher uptime, lower operating cost, or constrained driver supply"]
      - ["Private fleet", "Supply-chain and fleet leadership", "Fleet operations and safety teams", "Enterprise fleet owner", "Dedicated freight routes", "Supply chain or fleet", "Reliable service, safety case, and validated route economics"]
      - ["Shipper or cargo owner", "Logistics procurement", "Transportation planning team", "Shipper directly or through carrier rates", "Contracted freight movement", "Logistics or procurement", "Faster and more reliable goods movement"]
      - ["Truck OEM program", "Vehicle platform and autonomy program leadership", "Engineering, manufacturing, and service teams", "OEM and fleet through program economics", "Redundant chassis integration and support", "Product development or strategic program", "Validated autonomy demand and production readiness"]
      - ["Enterprise ADS partner", "Technology, operations, legal, and privacy stakeholders", "Partner operators and data teams", "Enterprise partner under an undisclosed model", "ADS use with telemetry and sensor-data handling", "Technology and operations", "Operational proof, data terms, and governance acceptance"]
    notes: >-
      Buyer, payer, workflow, and budget-owner roles are analytical inferences from the
      disclosed product, partner, and data relationships; no retained source supplies
      procurement records, contract values, or named commercial customers.
    claimRefs: [CM002, CM003, CM004, CM005, CM006, CM007, CM014]
