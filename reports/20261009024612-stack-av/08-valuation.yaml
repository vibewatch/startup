chapter:
  number: 8
  title: "Valuation"
  summary: "Stack AV has substantial reported SoftBank backing, experienced leadership, and an explicit safety-governance program, but the reviewed public record does not establish a current valuation, financing terms, named commercial adoption, or a commercialization timeline. The defensible stance is Track / research more with medium confidence, high underwriting risk, and no price-based valuation conclusion."
sections:
  - id: "decision-and-entry-discipline"
    title: "Decision and Entry Discipline"
    body: >-
      The current recommendation is Track / research more, with medium confidence in that
      decision, high underwriting risk, and an unknown valuation stance. Independent reporting
      described SoftBank's 2023 backing as more than $1 billion, while Tracxn characterizes the
      company as having raised $1 billion in one round. Those reports do not establish cash
      available on the run date, the security issued, tranche conditions, liquidation preferences,
      dilution, or governance rights. Forge separately shows no Stack AV Forge Price or post-money
      valuation and labels market activity Limited. Without an entry price, capitalization table,
      operating forecasts, or current commercial economics, a dollar valuation range and target
      return would be false precision. Investment approval should therefore remain gated on
      financing documents and verifiable commercial proof rather than the headline funding amount.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV013"
      - "CV014"
      - "CV015"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "thesis-and-anti-thesis"
    title: "Thesis and Anti-Thesis"
    body: >-
      The investable thesis combines reported patient capital, a leadership team formed by former
      Argo AI executives, a focused autonomous-trucking product, and visible safety governance.
      Technical.ly reported 150 employees across 15 states at the 2023 launch, and Stack says its
      systems are designed around safety, reliability, efficiency, and customer outcomes. Its
      Safety Advisory Council adds external guidance, although the company remains the issuer of
      that claim. The anti-thesis is stronger than a normal early-stage disclosure gap: Fortune
      reported that the investment amount was not detailed, potential customers were unnamed, and
      no commercialization or investor-return timeline was supplied. Tracxn also depicts a crowded
      field of 110 active competitors. The evidence supports technical and capital capacity, but
      not current product-market fit, revenue quality, or price discipline.
    claimRefs:
      - "CV001"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV009"
      - "CV010"
      - "CV011"
    tableRefs:
      - "TV002"
  - id: "scenarios-and-comparable-context"
    title: "Scenarios and Comparable Context"
    body: >-
      The scenario framework is intentionally conditional rather than numeric because public
      evidence does not support an enterprise-value range. A bull outcome requires conversion of
      test-fleet activity into named, paid adoption plus credible safety and deployment evidence; a
      base outcome is continued development without enough disclosure to underwrite a price; and a
      bear outcome follows if commercialization remains undated while additional capital is needed
      on unfavorable terms. Tracxn identifies Aurora, Einride, and TuSimple as leading competitors
      and labels Aurora and TuSimple public, but this is a competitive set rather than a clean
      valuation-comparable set. Funding raised by any peer is not enterprise value, and differing
      operating models, maturity, capital structures, and public-market status prevent a sound
      multiple transfer from the reviewed material.
    claimRefs:
      - "CV003"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV014"
      - "CV016"
    tableRefs:
      - "TV003"
  - id: "exit-readiness-and-diligence"
    title: "Exit Readiness and Final Diligence"
    body: >-
      Exit readiness cannot be demonstrated from the assigned public evidence. Forge reports
      Limited market activity and no available Forge Price, while Fortune reports no stated
      commercialization or investor-return timeline. That combination does not prove an exit is
      unavailable, but it leaves both liquidity and timing unquantified. Before changing the
      recommendation, diligence should obtain the fully diluted capitalization table; security and
      preference terms; committed versus funded capital; current cash, monthly cash use, and
      runway; audited financials and operating plan; named pilot or customer contracts; deployment
      milestones; and independently testable safety and regulatory evidence. A target return and
      hold period should be modeled only after those inputs and an actual entry price are known.
      Failure to substantiate paid adoption or durable funding before the next financing decision
      is the principal thesis-break signal.
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV013"
      - "CV014"
      - "CV015"
