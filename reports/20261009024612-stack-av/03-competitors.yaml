    - type: "private-evidence-only"
      severity: "material"
      topic: "pricing-and-lock-in"
      missingEvidence: "Comparable Stack and peer price schedules, realized contract rates, packaging, discounts, liability allocation, term length, exclusivity, and integration costs."
      whyItMatters: "Without comparable commercial terms, diligence cannot quantify buyer ROI, pricing power, switching cost, or multi-homing risk."
      diligencePath: "Request anonymized customer proposals and executed contract schedules, then normalize economics per autonomous mile and per vehicle."
      relatedQuestionRefs:
        - "QP004"
        - "QP007"
      relatedTableRefs:
