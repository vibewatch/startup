    - type: "missing-source"
      severity: "material"
      topic: "comparative-performance"
      missingEvidence: "Independent Stack-versus-peer safety, reliability, disengagement, route-completion, and uptime benchmarks on comparable operating domains."
      whyItMatters: "Company architecture claims cannot prove technical superiority or moat durability without a comparable denominator."
