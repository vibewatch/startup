    - type: "private-evidence-only"
      severity: "material"
      topic: "customer-proof"
      missingEvidence: "Named fleet or shipper pilots, routes, paid status, vehicle count, renewal evidence, service levels, and conversion milestones."
      whyItMatters: "Unnamed demonstrations do not establish repeatable distribution, willingness to pay, or production readiness."
      diligencePath: "Obtain customer references, pilot contracts, operating dashboards, and conversion criteria directly from management and counterparties."
      relatedQuestionRefs:
