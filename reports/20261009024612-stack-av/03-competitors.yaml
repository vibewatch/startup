chapter:
  number: 3
  title: "Competitors"
  summary: "Stack AV competes in a crowded autonomous-freight field that includes broad Class 8 developers, middle-mile specialists, integrated electric-freight operators, internal fleet programs, and human-driven trucking. Its experienced team and SoftBank backing are credible inputs, but public evidence does not yet establish commercial timing, named carrier adoption, pricing, chassis distribution, or durable switching costs."
sections:
  - id: "landscape-and-peer-set"
    title: "A crowded field with several ways to solve the freight job"
    body: >-
      Stack AV's stated arena is autonomous Class 8 trucking, but the buyer's
      alternatives extend beyond like-for-like software developers. Tracxn identifies
      110 active competitors and names Aurora, Einride, and TuSimple as leading peers;
      its profiles also distinguish broad freight-autonomy developers from Gatik's
      middle-mile focus and Einride's combined electric-and-autonomous freight model.
      Fortune separately names Waymo Via, Aurora, and TuSimple as competitors, while
      the status quo remains human-driven capacity and an internal-build path remains
      available to sufficiently large fleets or OEMs. This segmentation matters:
      constrained-route operators can commercialize a narrower operating domain,
      integrated providers can bundle vehicles and orchestration, and broad Class 8
      developers must prove both autonomy and production-grade vehicle integration.
    claimRefs:
      - "CP006"
      - "CP007"
      - "CP008"
    tableRefs:
      - "TP001"
    figureRefs:
      - "FP001"
  - id: "capability-and-trust"
    title: "Differentiation is plausible, but not yet benchmarked"
    body: >-
      Stack describes an autonomy stack spanning artificial intelligence, robotics,
      machine learning, and cloud technology, while a third-party company listing
      characterizes the product as a Class 8 ecosystem combining vehicle software and
      cloud infrastructure. Its privacy notice adds concrete architecture signals:
      test vehicles collect radar, video, lidar, GPS, microphone, route, speed, and
      direction data, and Stack may permit enterprise partners to use the ADS. The
      company also presents an external Safety Advisory Council as oversight. These
      are useful indicators of technical scope and trust posture, not independent
      performance benchmarks. The assigned evidence contains no comparative
      disengagement data, safety-case audit, route-completion benchmark, or production
      reliability result that would prove superiority over Aurora, PlusAI, Waabi, or
      another direct developer.
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP003"
      - "CP004"
    tableRefs:
      - "TP002"
  - id: "commercial-model-and-distribution"
    title: "Commercial packaging, distribution, and lock-in remain open"
    body: >-
      Public evidence shows activity but not a commercial system. Fortune reported a
      test fleet and demonstrations to potential customers whose names were withheld,
      and it reported that neither Stack nor SoftBank supplied a commercialization
      timeline. In a FreightWaves interview, Bryan Salesky said Stack was evaluating
      business models and had not disclosed exactly what it would automate. He also
      described redundant truck architecture as unresolved and said partnering was
      one option. Stack's launch release frames the offer around uptime, safety,
      routes, and energy efficiency, but the retained sources provide no list price,
      rate card, packaging tiers, signed carrier contract, OEM distribution agreement,
      or quantified integration cost. Consequently, switching cost, multi-homing
      resistance, channel power, and realized unit economics cannot yet be compared
      with competing offers.
    claimRefs:
      - "CP009"
      - "CP010"
      - "CP011"
      - "CP012"
      - "CP013"
      - "CP015"
    tableRefs:
      - "TP003"
  - id: "moat-and-displacement-risk"
    title: "Execution evidence, not pedigree, will determine moat durability"
    body: >-
      The founding team brings relevant autonomy experience: Technical.ly and CEEhire
      identify Bryan Salesky, Peter Rander, and Brett Browning as former Argo AI
      leaders. That history provides recruiting and systems-development credibility,
      but it also supplies adverse context. Fortune reported that Ford and Volkswagen
      closed Argo after investing a combined $3.6 billion, illustrating how patient
      capital can still be exhausted before autonomy reaches a satisfactory return.
      Stack's competitive advantage is therefore best treated as an execution thesis,
      not an established moat. Durable differentiation would require independently
      measured safety and reliability, a manufacturable redundant chassis path,
      named fleet demand, credible commercial timing, and contract structures that
      create retention without transferring all deployment risk to Stack. None is
      established by this source set.
    claimRefs:
      - "CP005"
      - "CP010"
      - "CP012"
      - "CP014"
      - "CP016"
