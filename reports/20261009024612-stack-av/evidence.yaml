      deployments.
    whyItMatters: >-
      Without named carrier partners or pilot verification, Stack AV's commercial demand, pricing power, and timeline to
      first revenue cannot be independently validated.
    diligencePath: >-
      Request customer pipeline disclosures, pilot charter agreements, or non-disclosure-cleared carrier reference calls
