evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: post-money-valuation-and-equity-structure
    missingEvidence: >-
      Audited cap table, post-money valuation, preferred share terms, and liquidation preferences for Stack AV's
      SoftBank-backed financing.
    whyItMatters: >-
      Without valuation multiples or equity tranche structures, investors cannot calculate ownership dilution or
      risk-adjusted return hurdles.
    diligencePath: >-
      Review private placement memorandum, Delaware certificate of incorporation amendments, or confidential investor
      presentation materials.
    relatedQuestionRefs:
      - QO005
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market sizing
    missingEvidence: >-
      A current, methodologically transparent Class 8 autonomous-trucking spend or eligible-fleet denominator with
      pricing and adoption assumptions.
    whyItMatters: >-
      Without comparable spend, fleet, route, price, and adoption inputs, dollar TAM, SAM, and SOM cannot be calculated
      without false precision.
    diligencePath: >-
      Obtain industry fleet data, Stack's target operating design domain, deployment pricing, paid-route pipeline, and
      management's bottom-up market model.
    relatedQuestionRefs:
      - QM007
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer economics
    missingEvidence: >-
      Named buyer interviews, procurement ownership, contract structure, willingness-to-pay, and route-level
      return-on-investment evidence.
    whyItMatters: >-
      Public product language identifies beneficiaries but does not prove who controls budget or whether savings exceed
      integration and operating costs.
    diligencePath: >-
      Request customer references, pilot contracts, pricing schedules, deployment milestones, and route-level
      total-cost-of-ownership models.
    relatedQuestionRefs:
      - QM003
      - QM010
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: safety need
    missingEvidence: The underlying FMCSA, IIHS, and NHTSA records for the safety statistics reproduced on Stack's website.
    whyItMatters: >-
      Direct agency sources are needed to verify periods, denominators, rounding, and applicability to Stack's target
      operating design domain.
    diligencePath: >-
      Reconcile each company-presented statistic to the cited agency dataset and retain the original tables and
      definitions.
    relatedQuestionRefs:
      - QM004
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-lock-in
    missingEvidence: >-
      Comparable Stack and peer price schedules, realized contract rates, packaging, discounts, liability allocation,
      term length, exclusivity, and integration costs.
    whyItMatters: >-
      Without comparable commercial terms, diligence cannot quantify buyer ROI, pricing power, switching cost, or
      multi-homing risk.
    diligencePath: >-
      Request anonymized customer proposals and executed contract schedules, then normalize economics per autonomous
      mile and per vehicle.
    relatedQuestionRefs:
      - QP004
      - QP007
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: customer-proof
    missingEvidence: >-
      Named fleet or shipper pilots, routes, paid status, vehicle count, renewal evidence, service levels, and
      conversion milestones.
    whyItMatters: Unnamed demonstrations do not establish repeatable distribution, willingness to pay, or production readiness.
    diligencePath: >-
      Obtain customer references, pilot contracts, operating dashboards, and conversion criteria directly from
      management and counterparties.
    relatedQuestionRefs:
      - QP005
  - type: missing-source
    severity: material
    topic: comparative-performance
    missingEvidence: >-
      Independent Stack-versus-peer safety, reliability, disengagement, route-completion, and uptime benchmarks on
      comparable operating domains.
    whyItMatters: >-
      Company architecture claims cannot prove technical superiority or moat durability without a comparable
      denominator.
    diligencePath: >-
      Commission a technical review of matched-route operating data and reconcile each metric to route, weather,
      intervention, and fleet-size denominators.
    relatedQuestionRefs:
      - QP003
      - QP006
      - QP008
  - type: access-blocked
    severity: minor
    topic: competitor-listing-retrieval-gap
    missingEvidence: >-
      The assigned RobotToday Stack AV supplier-profile URL returned an unrelated robotics-news feed rather than
      Stack-specific profile content.
    whyItMatters: The URL is retained for search provenance but cannot support any competitive claim or independent corroboration.
    diligencePath: Recover a stable archived copy of the intended supplier profile or leave the source uncited in future synthesis.
  - type: private-evidence-only
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: Monthly cash burn rate, operating expense breakdown, and remaining capital runway from SoftBank commitments.
    whyItMatters: Essential for evaluating solvency, time to next financing, and viability through commercial pilot validation.
    diligencePath: >-
      Request audited financial statements, historical cash flow statements, and 24-month forward budget forecasts from
      management.
    relatedQuestionRefs:
      - QI006
      - QI007
  - type: missing-source
    severity: material
    topic: commercial-contracts
    missingEvidence: >-
      Executed commercial pilot agreements, letters of intent, or revenue-generating contracts with fleet carriers or
      freight shippers.
    whyItMatters: >-
      Validates customer willingness to pay, realized per-mile contract pricing, and market demand for Stack AV's
      autonomous trucking platform.
    diligencePath: >-
      Review commercial customer pipeline, signed pilot memorandums of understanding, and agreed freight tariff rate
      cards.
    relatedQuestionRefs:
      - QI002
      - QI005
  - type: private-evidence-only
    severity: material
    topic: disengagement-and-safety-benchmarks
    missingEvidence: >-
      Audited autonomous miles driven, disengagement frequency per thousand miles, and independent third-party
      closed-course safety benchmark evaluations.
    whyItMatters: >-
      Safety validation and system autonomy cannot be independently verified without empirical disengagement records and
      highway test mileage logs.
    diligencePath: >-
      Request confidential test fleet safety reports, simulation disengagement statistics, and voluntary safety
      self-assessment (VSSA) filings.
    relatedQuestionRefs:
      - QE006
      - QE008
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: material
    topic: oem-chassis-integration
    missingEvidence: >-
      Confirmed partnerships with Class 8 truck OEMs (e.g. Peterbilt, Kenworth, Freightliner, Volvo) for
      factory-installed drive-by-wire actuation and dual-redundant steering/braking.
    whyItMatters: >-
      Commercial deployment at scale requires OEM-level chassis integration with functional safety certifications rather
      than aftermarket fleet retrofits.
    diligencePath: >-
      Inquire with executive management regarding OEM joint-development agreements, tier-1 braking/steering supplier
      relationships, and chassis delivery schedules.
    relatedQuestionRefs:
      - QE007
      - QE008
    relatedTableRefs:
      - TE001
      - TE003
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: >-
