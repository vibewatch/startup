        title: 决策与入场纪律
        blocks:
          - type: paragraph
            body: >-
              当前建议为跟踪／继续研究，对该决策的信心中等，投资判断风险高，估值立场未知。独立报道将 SoftBank 2023 年的支持描述为超过 $1 billion；Tracxn 则称公司单轮融资 $1
              billion。这些报道没有证明运行日可用现金、发行的证券、分期条件、清算优先权、稀释或治理权利。Forge 另显示没有 Stack AV Forge Price 或投后估值，并将市场活动标记为
              有限。没有入场价格、资本化表、运营预测或当前商业经济性，美元估值区间和目标回报都会制造虚假精确度。因此，投资批准仍应以融资文件和可验证商业证明为门槛，而不是依据融资金额头条。
