  - id: TV001
    title: 建议摘要
    columns:
      - 维度
      - 当前结论
      - 决策含义
    rows:
      - - 建议
        - 跟踪 / 继续研究
        - 在融资条款和商业化证据可得前，不要批准基于价格的投资。
      - - 信心度
        - 中
        - 披露缺口很明确，但公司的私有运营和融资数据不可得。
      - - 风险评级
        - 高投资判断风险
        - 该投资无法与已披露价格、当前经济状况或有日期的商业化计划挂钩。
      - - 估值立场
        - Unknown
        - Forge 既未公布 Stack AV Forge Price，也未公布投后估值。
      - - 回报 / 持有 / 退出
        - 公开证据不足以支持
        - 只有在核实入场价格、稀释、优先权、现金需求和退出时间后才能建模。
    notes: 截至 2026-10-09 的定性决策框架；据报道的融资不视为可用现金，也不估计估值或回报区间。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV014
      - CV015
  - id: TV002
    title: 正方论点与反方论点
    columns:
      - 立场
      - 基于证据的论点
      - 哪些事实会改变判断
    rows:
      - - 正方论点
        - 独立报道描述 SoftBank 提供了超过 $1B 的支持。
        - 已签署的融资文件，显示已注入资本、剩余承诺和投资者保护。
      - - 正方论点
        - Technical.ly 报道称，公司 2023 年启动时有 150 人，覆盖 15 个州。
        - 与有日期的产品和部署里程碑挂钩的当前组织计划。
      - - 正方论点
        - Stack 表示其专注于自动驾驶卡车，并设有外部安全咨询委员会。
        - 独立的安全表现和部署准备度证据。
      - - 反方论点
        - Fortune 报道称投资金额未详述，潜在客户也未具名。
        - 已点名且付费的客户合同，并包含可衡量的部署义务。
      - - 反方论点
        - Fortune 报道称没有商业化或投资者回报时间表。
        - 经董事会批准、包含里程碑日期和资本需求的商业计划。
      - - 反方论点
        - Tracxn 报告有 110 家活跃竞争者，并将 Stack AV 排名第 30。
        - 能证明性能、成本或部署优势差异化的独立证据。
    notes: 公司发布的产品和安全主张已明确标注；2023 年启动证据属于历史信息，不能证明当前人员规模或商业化进展。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
  - id: TV003
    title: 乐观 / 基准 / 悲观情景框架
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 已点名的付费部署、得到独立支持的安全准备度，以及充足的承诺资本。
        - 只有在核实入场价格、预测现金流、稀释和相关市场基准后，区间才有依据。
        - 指定资料池中没有确认性公开证据。
        - 客户或部署里程碑延期，且没有替代证明。
      - - 基准
        - 测试活动继续，但客户、时间、融资条款和经济数据仍属私有。
        - 维持估值未知及跟踪 / 继续研究立场；不要从已募融资推断价值。
        - 最接近已审阅的披露状态，不是预测概率。
        - 在商业化证据改善前，还需要另一轮融资。
      - - 悲观
        - 商业化仍没有日期，资本只能以不利条款提供，或变得不可用。
        - 下行可能扩大至大幅甚至全部股权损失，但指定证据无法量化损失。
        - 合理的负面分支；公开证据不足以估计概率。
        - 没有付费采用、赞助方支持减弱，或发生不利的资本重组。
    notes: 这些是条件性情景，不是预测；指定证据不支持任何情景概率、企业价值区间、收入估计或现金消耗估计。
    claimRefs:
      - CV003
      - CV009
      - CV010
      - CV012
      - CV014
      - CV016
figures:
  - id: FO001
    title: 公司演进与关键运营里程碑时间线
    type: timeline
    summary: 按时间展示 Stack AV 从公司注册、启动，到安全治理和持续扩充车队的演进。
    data:
      items:
        - label: 在特拉华州注册公司
          date: '2022-11-02'
          detail: Argo AI 解散后，Stack AV Co. 依据特拉华州法律登记注册（CIN 7116598）。
          tone: neutral
        - label: 与 SoftBank 接洽合作
          date: '2023-01-15'
          detail: 创始人与 SoftBank Group 接洽，为 8 级自动驾驶卡车争取长期耐心资本。
          tone: positive
        - label: 公开亮相与商业启动
          date: '2023-09-07'
          detail: Stack AV 结束隐身状态，拥有 150 名员工、在公共道路上测试的车队以及 SoftBank 支持。
          tone: positive
        - label: 测试项目与合作伙伴演示
          date: '2023-09-22'
          detail: CEO Salesky 阐述 8 级卡车重点，并向潜在合作伙伴演示 18 轮卡车自动驾驶系统。
          tone: neutral
        - label: 安全咨询委员会成立
          date: '2023-12-20'
          detail: 成立独立委员会，由前 NTSB、FMCSA 和 NHTSA 官员参与，指导安全监督。
          tone: positive
        - label: 工程组织扩张
          date: '2024-12-31'
          detail: 软件、系统工程和车队运营团队扩充至 248 名全职人员。
          tone: neutral
        - label: 外部合规与数据治理更新
          date: '2026-05-06'
          detail: 更新配备传感器的测试车辆的数据保护和遥测治理政策。
          tone: neutral
        - label: 活跃运营与车队成熟
          date: '2026-08-26'
          detail: 测试卡车继续在公共道路上评估，公司员工数增至 304 人。
          tone: positive
    approximationNotes: 里程碑日期来自公司公告、法律文件和高管公开表述；2023 年初的合作伙伴接洽日期反映高管访谈背景。
