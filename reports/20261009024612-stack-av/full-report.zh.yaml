  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 展示自动驾驶卡车平台如何将客户货运需求转化为商业收入和毛利的运营流程。
    approximationNotes: 基于行业标准货运即服务和平台许可机制的概念性运营流程；转化率和利润率百分比是未经验证的私有指标。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI008
    data:
      nodes:
        - id: demand-intake
          label: 货主货运需求
          role: Freight shippers contract dedicated long-haul Class 8 capacity across target highway freight corridors
        - id: autonomous-dispatch
          label: 自动驾驶车队调度
          role: Stack AV autonomous driving system dispatches sensor-equipped tractor with remote mission control oversight
        - id: linehaul-execution
          label: 干线货运执行
          role: >-
            Autonomous Class 8 vehicle completes linehaul transit maximizing daily uptime without hours-of-service
            delays
        - id: revenue-capture
          label: 货运总收入捕获
          role: Billed on per-mile freight capacity tariff or recurring enterprise software license fee
        - id: direct-operating-costs
          label: 直接运营扣除项
          role: Deduction of vehicle fuel, sensor depreciation, cloud telemetry data, and maintenance
        - id: net-gross-margin
          label: 目标毛利率
          role: Net contribution margin expanding toward 40%+ as hardware amortization and safety driver costs drop
      edges:
        - from: demand-intake
          to: autonomous-dispatch
        - from: autonomous-dispatch
          to: linehaul-execution
        - from: linehaul-execution
          to: revenue-capture
        - from: revenue-capture
          to: direct-operating-costs
        - from: direct-operating-costs
          to: net-gross-margin
  - id: FE001
    title: Stack AV 自动驾驶卡车系统架构
    type: stack
    summary: 分层系统架构，展示传感输入、机器学习感知、运动控制、云基础设施和安全治理。
    data:
      layers:
        - label: 传感与硬件输入层
          detail: 通过 8 级测试车辆传感器集成，全面捕获多模态物理环境
          modules:
            - 光学视频摄像头（360 度覆盖）
            - 电磁雷达与激光雷达传感阵列
            - 高精度定位 GPS 与声学麦克风
        - label: 自动驾驶机器学习与感知引擎
          detail: 通过深度学习模型处理原始传感器遥测，实现实时场景理解
          modules:
            - 感知架构（远距离探测）
            - 3D 动态目标检测与跟踪
            - 高速公路语义场景理解
        - label: 运动规划与车辆控制系统
          detail: 将感知数据转化为运动学驾驶决策和卡车执行器指令
          modules:
            - 运动学轨迹生成与运动规划
            - 重型卡车线控执行器控制
            - 故障安全冗余与最低风险机动
        - label: 云端远程辅助与车队基础设施
          detail: 提供低延迟远程人工辅助并汇总车队遥测
          modules:
            - 通过蜂窝上行链路进行实时视频流传输
            - 远程操作员战术指导界面
            - 云端遥测与性能优化日志
        - label: 车队数据管线与调度集成
          detail: 汇总行程性能分析、路线优化和承运商集成指标
          modules:
            - 行程性能分析与日志引擎
            - 路线优化与运营遥测
            - 承运商调度与企业系统适配器
        - label: 安全治理与监管保障
          detail: 通过机构监督确保系统准备度、合规性和透明风险管理
          modules:
            - 安全咨询委员会战略指导
            - FMCSA 与 NHTSA 监管合规框架
            - 严格的仿真与试验场验证
    approximationNotes: 基于官方出版物和工程披露对 Stack AV 自动驾驶系统架构的概念性呈现。
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 货运承运商与 Stack AV 合作时，从初次技术演示到长途商业部署的五阶段采用路径。
    data:
      items:
        - label: 1. 演示与技术验证
          detail: Stack AV 向潜在车队管理层演示 18 轮卡车自动驾驶能力，验证感知、运动规划和安全架构。
        - label: 2. 治理与安全审查
          detail: 承运商审查 Stack AV 的《自愿安全自评估》和安全咨询委员会协议，以满足企业安全与风险管理标准。
        - label: 3. 企业遥测集成
          detail: 承运商运营团队依据双边合作条款评估自动驾驶系统数据接口、遥测馈送和调度集成协议。
        - label: 4. 监督式走廊试点
          detail: 计划在指定货运线路部署由安全操作员监控的牵引车，以衡量燃油效率、班次遵循度和运营正常运行时间。
        - label: 5. 商业车队运营
          detail: 转向枢纽到枢纽的无人驾驶货运运输，并配套承诺货运量和按运力计费的经常性商业合同。
        - label: 6. 网络与线路扩张
          detail: 覆盖多个州际货运走廊，并融入更广泛的货主与经纪商供应链网络。
    approximationNotes: 这是根据行业自动驾驶卡车的采用周期，以及 Stack AV 披露的安全与运营框架推演出的商业发展示意。
