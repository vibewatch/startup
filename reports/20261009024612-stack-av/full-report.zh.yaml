      - number: '5.3'
        title: 部署、安全治理与工作流集成
        blocks:
          - type: paragraph
            body: >-
              部署自动驾驶卡车系统需要严格的安全工程、失效可运行冗余，以及与现有车队工作流无缝协作。标准商业物流中，货运承运商面临多项运营瓶颈：强制服务时长休息使卡车每日利用率上限约为 10 至 11
              小时，单位里程运营成本高，道路事故责任严重；每起致命或重伤碰撞可能造成超过 $3 million 的损失。Stack AV
              的运营模式将高速公路自动运输与人在回路监控结合，在提升车辆利用率的同时提高基础设施效率。为管理系统可靠性和公共道路就绪度，公司成立外部安全顾问委员会，成员来自 NTSB、FMCSA 和 NHTSA
              的前负责人。然而，Stack AV 技术仍处于商业化前阶段，尚未公开无人驾驶监管豁免批准、正式 OEM 工厂集成协议或无人商业货运运行。
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
