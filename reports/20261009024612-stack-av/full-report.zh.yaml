              - CR008
          - type: callout
            title: 将公开安全治理视为起点
            body: 安全顾问委员会和披露承诺是积极的治理信号，但投资放行仍应要求运营授权记录和可独立复核的安全性能证据。
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR005
  - number: 8
    title: 估值
    sections:
