              - CM006
              - CM007
              - CM014
      - number: '2.3'
        title: 受证据约束的市场测算
        blocks:
          - type: paragraph
            body: >-
              现有证据没有提供可比收入池、单车价格、符合条件的 Class 8 车队数量、按路线划定的运营设计域或采用率，因此用美元给出 TAM、SAM 或 SOM
              只会制造虚假精确度。需求指标很重要，但本身无法货币化：Stack 的安全页面引用北美每年 45.5 万起大型卡车事故、2021 年 15.5 万起伤害，以及每年约 5,000
              人死亡。供给侧证据同样宽泛：Tracxn 列出 110 家活跃竞争者，其中 41 家已融资、12 家已退出。这些指标说明问题严重且市场拥挤，却不能说明 Stack 能服务多少货运支出，或能捕获多少收入。
            claimRefs:
