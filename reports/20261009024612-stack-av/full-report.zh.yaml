              - CM007
      - number: '2.2'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Stack
              的公开表述将车队、承运商、货主和供应链合作伙伴列为受益者；运营、安全、采购和技术负责人可能共同参与采购。公司将需求归因于司机短缺、车辆利用率低、安全风险、运营成本高、排放压力以及对可靠供应链的需求。采用并非简单的软件销售：创始人强调规模化所需资本和冗余卡车设备的必要性，隐私声明则设想企业合作伙伴使用
              Stack 的自动驾驶系统并生成遥测、视频、音频和地理位置数据。因此，在持续商业部署前，还要完成 OEM 集成、运营验证、数据治理和车队工作流改造。
            claimRefs:
              - CM003
