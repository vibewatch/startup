            body: >-
              现有指定公开证据无法证明退出准备度。Forge 报告市场活动有限，且没有可用 Forge Price；Fortune
              报道没有明确商业化或投资者回报时间表。这种组合不能证明无法退出，但使流动性和时间都无法量化。在改变建议前，尽调应取得完全摊薄资本化表、证券和优先权条款、承诺资本与已到账资本、当前现金、月度现金使用和资金期限、经审计财务报表与运营计划、具名试点或客户合同、部署里程碑，以及可独立测试的安全和监管证据。只有在这些输入和实际入场价格明确后，才能建模目标回报和持有期。在下一次融资决策前无法证明付费采用或持久融资，是主要的论点失效信号。
