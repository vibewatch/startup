      - number: '1.4'
        title: 展示
        blocks:
          - type: callout
            title: 第二次机会优势：借力 Argo AI 工程遗产
            body: >-
              Stack AV 在成立数月内就扩充出经过道路测试的车队和数百人的工程团队，说明创始团队成功吸收了 Argo AI 在历时六年、耗资 36 亿美元的开发周期中积累的机构知识和技术人才。Argo AI 最终被载客
              robotaxi 的漫长周期拖垮，而 Stack AV 将同一批核心高管转向 Class 8 高速公路卡车运输——这一领域路线重复度高、司机短缺严重，商业回报也更直接。
            calloutType: insight
            claimRefs:
              - CO002
              - CO003
              - CO007
              - CO012
          - type: callout
            title: 资本集中与商业披露缺失
            body: >-
              尽管获得超过 10 亿美元的承诺支持，Stack AV 的资本高度集中于单一投资者 SoftBank Group。公司既未披露法律意义上的资产负债表结构，也未披露任何具有约束力的承运商商业合同。在 Aurora
              Innovation 等竞争对手已拿下商业货运合作并获得公开市场资本的重资本行业里，Stack AV 的商业验证和估值基准对外部尽调仍完全不透明。
            calloutType: risk
            claimRefs:
              - CO009
              - CO010
              - CO015
