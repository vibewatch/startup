              工程组织表明，公司采用人在回路的云端干预模式来处理复杂、模糊的边界场景。系统通过蜂窝网络向远程操作员传输实时视频，无需车内安全员即可解决非结构化驾驶停滞，成为受监督测试与完全自动驾驶商业运营之间的重要桥梁。
