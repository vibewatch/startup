  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型架构、变现路径与定价动态
        blocks:
          - type: paragraph
            body: >-
              Stack AV
              的商业化计划着眼于解决北美卡车运输经济中的结构性摩擦，尤其是车辆利用率受限、运营支出高和严重碰撞责任（CI001、CI002、CI007）。在商业货运中，自动驾驶开发商主要围绕两种收入模式：交钥匙式
              Freight-as-a-Service（FaaS）运力和自动驾驶系统（ADS）平台软件授权（CI008）。平台授权架构将软件、传感器开发与实体车辆制造分开，使车队运营商和企业承运商合作伙伴能够部署自动驾驶牵引车，而技术提供商无需承担全部滚动车队资本支出（CI008）。Stack
              AV 的外部数据保护披露确认，公司设想让企业合作伙伴使用 ADS 平台，同时管理车辆遥测、传感器感知数据和运营地理位置数据流（CI003）。但 Stack AV
              从未公布标准标价、每英里费率表或分级订阅方案，实际承运商合同金额和收入确认政策对公开市场仍完全不透明（CI004、CI008）。
            claimRefs:
