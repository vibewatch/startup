        title: 目标客户细分与买方动态
        blocks:
          - type: paragraph
            body: >
              Stack AV 面向 Class 8
              商用货运行业，重点服务在高密度高速公路线路运营的长途承运商、企业供应链货主和私人企业车队。重型自动驾驶卡车的采购需要承运商高管、车队运营经理和安全合规团队进行复杂协同。企业车队客户会依据已验证的道路安全、设备可靠性、燃油经济性以及与调度网络的无缝集成来评估自动驾驶系统。Stack
              AV 的企业数据保护披露表明，公司预计允许企业合作伙伴使用其自动驾驶系统，同时由 Stack AV 收集并维护车辆遥测、摄像头视频和地理位置数据。管理层还强调，消费者需求变化要求供应链更智能、由 AI
              驱动，以更快、更可靠地交付货物。为便利机构采购并应对严格的承运商安全审查，Stack AV 成立了由前运输安全和监管官员组成的外部安全顾问委员会。[CU003] [CU004] [CU007] [CU008]
