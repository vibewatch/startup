      - number: '7.4'
        title: 监测、尽调与论点失效条件
        blocks:
          - type: paragraph
            body: >-
              投资监测应关注证据发布，而不是叙事性里程碑。如果 Stack 无法记录运营授权路径、提供可独立复核的安全指标、证明资金可支撑至下一个技术里程碑，或展示具有约束力的 OEM
              与车队伙伴承诺，投资论点就应暂停。经核实后，严重安全事件、重大数据泄露、失去发起方支持，或反复无法把开发工作转化为可测量的商业运营，都将构成论点失效事件。员工证据也需要核对：2023 年发布稿称总部及 15
              个州共有 150 名员工，而提取的 Tracxn 页面显示 2024 年 12 月 31 日有 248 名员工，另有一个只标注“Aug 26”的 304
              人数字。这些是拟议的尽调关口，不是公司承诺；指定分析师的比较本身也存在利益冲突敏感性，因为作者披露持有 UBER 多头头寸。
            claimRefs:
              - CR012
              - CR013
              - CR015
              - CR016
      - number: '7.5'
        title: 展示
        blocks:
          - type: callout
            title: 资本支持不等于可用资金期限
            body: 公开来源确认 SoftBank 支持，但没有证明可用金额、分期条件、消耗率或资金可维持月数。在审阅融资文件和当前现金计划前，投资判断应将这些数量保持为未知。
            calloutType: risk
            claimRefs:
              - CR006
