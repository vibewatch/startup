            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: 资本结构、投资者动态与商业化路线图
        blocks:
          - type: paragraph
            body: >-
              Stack AV 获得日本 SoftBank Group Corp. 的核心资金和技术支持；经济发展官员及财务报道显示，承诺资本超过 10 亿美元。SoftBank 管理着超过 1600
              亿美元的人工智能资产，并将这笔投资定位为长期耐心资本，用于解决供应链和物流领域的重资本约束。然而，Stack AV
              尚未公开披露融资轮次的法律结构、投后估值、股份类别或清算优先权，外部市场评估只能依赖二手数据聚合商；这些聚合商将 2023 年 9 月的首次融资标记为单一机构投资者注资。Stack AV
              虽已向潜在车队客户和物流承运商展示 Class 8 自动驾驶系统，但商业收入、已签约货运订单和具名承运商合作伙伴仍未披露。公司身处重资本行业，直接与 Aurora Innovation、Einride
              等资金充足的上市和非上市自动驾驶卡车企业竞争，因此持续获得资本、达成关键里程碑并取得监管批准，对长期生存至关重要。
            claimRefs:
