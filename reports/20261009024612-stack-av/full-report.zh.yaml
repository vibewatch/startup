      - number: '7.3'
        title: 资本、合作伙伴与执行依赖
        blocks:
          - type: paragraph
            body: >-
              在现有证据中，SoftBank 是唯一确定的资本支持者，但可用记录没有一致披露支持金额和条件。Stack 的发布稿称 SoftBank 提供资本、资源和 AI 专长；Technical.ly
              称金额未说明，Trucking Dive 则报道发言人未回答融资规模问题。创始团队的 Argo AI 经历提供了执行背景，并不能证明 Stack 会重演 Argo 的结局：独立报道记录了 Argo 于 2022
              年关闭、Ford 和 Volkswagen 的减记，以及 Ford 认为前身未能吸引新投资者，而规模化自动驾驶仍遥不可及。Tracxn 统计的 110 家活跃竞争者中有 41
              家已融资，更说明需要尽调融资持久性和伙伴转化，而不是从融资头条推断资金期限。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR014
