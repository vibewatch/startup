      - number: '5.2'
        title: 技术架构与传感器融合
        blocks:
          - type: paragraph
            body: >-
              Stack AV 自动驾驶系统的技术架构依靠多层软硬件流水线，处理重型商用卡车独有的物理动态。Class 8 牵引车在高速公路上高速行驶，整车总重超过 80,000
              磅，需要将感知范围延伸到前方数百米，才能保证安全制动距离。Stack AV 为测试车配备完整的多模态传感器阵列，包括雷达、摄像头、激光雷达、精密 GPS
              和声学麦克风，用于探测并记录高速公路环境。传感器遥测数据进入感知架构子系统中的基础机器学习架构，完成目标检测、连续 3D
              跟踪和语义场景理解，以处理长尾驾驶异常。下游运动规划模块计算无碰撞轨迹，并控制转向、油门和制动。自动驾驶车辆遇到复杂施工区或道路障碍等模糊边界情况时，系统通过蜂窝网络实时视频和数据上行连接 Stack AV
              的云端 Remote Assist 平台，让人工操作员提供高层战术指引，解决边界场景下的停滞。
            claimRefs:
