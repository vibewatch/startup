      - number: '3.2'
        title: 差异化有一定可能，但尚无基准验证
        blocks:
          - type: paragraph
            body: >-
              Stack 将其自动驾驶技术栈描述为覆盖人工智能、机器人、机器学习和云技术；第三方公司资料则将产品描述为结合车辆软件与云基础设施的 Class 8
              生态。其隐私声明提供了更具体的架构信号：测试车辆采集雷达、视频、激光雷达、GPS、麦克风、路线、速度和方向数据，Stack 也可能允许企业合作伙伴使用
              ADS。公司还将外部安全顾问委员会作为监督机制。这些是技术范围和信任姿态的有用信号，并非独立性能基准。现有证据没有比较性脱离接管数据、安全论证审计、路线完成基准或生产可靠性结果，无法证明其优于
              Aurora、PlusAI、Waabi 或其他直接开发商。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP002
