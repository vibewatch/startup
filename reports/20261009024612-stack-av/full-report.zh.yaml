            body: >-
              可投资论点由据报道的耐心资本、由前 Argo AI 高管组成的领导团队、聚焦自动驾驶卡车的产品和可见的安全治理组成。Technical.ly 报道称，2023 年发布时公司在 15 个州有 150
              名员工；Stack 表示其系统围绕安全、可靠性、效率和客户成果设计。安全顾问委员会增加了外部指导，但这项说法仍由公司发布。反论点强于普通早期披露缺口：Fortune
              报道投资金额未详述、潜在客户未具名，也未提供商业化或投资者回报时间表。Tracxn 还描绘了 110 家活跃竞争者组成的拥挤赛道。证据支持技术和资本能力，但不支持当前产品市场匹配、收入质量或价格纪律。
