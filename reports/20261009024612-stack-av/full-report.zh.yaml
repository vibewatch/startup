  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块化版图
        blocks:
          - type: paragraph
            body: >-
              Stack AV 打造全栈自动驾驶卡车平台，专门面向在州际公路和高速货运通道运营的 Class 8 重型车辆。公司不做乘客出行或城市
              robotaxi，而是专注于长途物流的运营约束：司机短缺、法定服务时长限制和高额碰撞责任，推动了持续货运运输需求。Stack AV
              的核心产品是集成式自动驾驶系统（ADS），结合车载计算、完整传感器套件、实时感知与运动规划算法，以及云端运营工具。公司总部在匹兹堡，并在 15
              个州设有分布式工程团队；核心产品能力分为五个模块：车载传感器硬件阵列、实时感知架构、运动规划与车辆控制、云原生 Remote
              Assist，以及车队数据基础设施。核心自动驾驶技术栈仍在封闭测试车队中开发，但开发者信号和工程披露确认，公司正让配备仪器的 Class 8 测试车辆在物流运营通道上进行道路测试。
            claimRefs:
