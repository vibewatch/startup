      - number: '3.4'
        title: 护城河能否持久取决于执行证据，而非履历
        blocks:
          - type: paragraph
            body: >-
              创始团队拥有相关自动驾驶经验：Technical.ly 和 CEEhire 将 Bryan Salesky、Peter Rander 和 Brett Browning 列为 Argo AI
              前负责人。这段经历带来招聘和系统开发可信度，但也提供了负面背景。Fortune 报道称，Ford 和 Volkswagen 合计投入 36 亿美元后关闭
              Argo，说明即使有耐心资本，也可能在自动驾驶获得满意回报前耗尽。Stack
              的竞争优势因此更应视为执行假设，而非已建立的护城河。要形成持久差异化，公司需要独立测量的安全性和可靠性、可制造的冗余底盘路径、具名车队需求、可信的商业化时间，以及能带来客户留存而不把全部部署风险转给 Stack
              的合同结构。现有来源均未证明这些条件。
            claimRefs:
              - CP005
              - CP010
              - CP012
