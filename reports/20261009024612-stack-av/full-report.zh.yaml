        title: 商业打包、分销与锁定仍未明确
        blocks:
          - type: paragraph
            body: >-
              公开证据显示公司在活动，但尚未显示商业系统。Fortune 报道称公司有测试车队，并向未具名的潜在客户进行演示；Stack 和 SoftBank 都未提供商业化时间表。Bryan Salesky 在
              FreightWaves 采访中表示，Stack 正在评估商业模式，尚未披露具体要实现哪些自动化。他还称冗余卡车架构尚未解决，合作是一个选项。Stack
              的发布稿围绕利用率、安全、路线和能源效率来描述产品，但留存来源没有提供标价、费率表、打包层级、已签署承运商合同、OEM
              分销协议或量化集成成本。因此，切换成本、多栖抵抗、渠道权力和实际单位经济性仍无法与竞品方案比较。
