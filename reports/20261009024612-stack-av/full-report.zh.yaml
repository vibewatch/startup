      - number: '2.4'
        title: 商业化时点与估值相关性
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 10 月 8 日，The Road to Autonomy 的专有指数将 Stack 排名第七，综合得分 21.7；该指数描述了受监督测试，并报告得州有 31 辆注册自动驾驶车辆。Stack
              在六项因素中的安全和商业定位得分最高，但运营和收入较弱，这与技术和合作进展先于规模化变现的情况一致。Tracxn 的独立目录则将 Stack 排在 110 家活跃竞争者中的第 30
              位，说明排名会随样本和方法显著变化。因此，估值应围绕已验证的无驾驶员运营、付费货运、车队利用率和单位经济性分阶段判断，而不是对未披露收入基础套用宽泛的自动驾驶市场倍数。
