chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营结构与创立背景
        blocks:
          - type: paragraph
            body: >-
              Stack AV Co.（CIN 7116598）是一家注册于特拉华州、总部位于宾夕法尼亚州匹兹堡的自动驾驶商用车开发商。公司注册日期为 2022 年 11 月 2 日，并于 2023 年 9 月 7
              日正式公开亮相。该公司由 Argo AI 主要出资方 Ford Motor Company 和 Volkswagen AG 于 2022 年 10 月关闭 Argo AI 后的前管理层创立。Stack AV
              不做城市载客 robotaxi，而是专注于 Class 8
              重型长途商用卡车，开发自有人工智能、机器人、机器学习和云端集成自动驾驶系统（ADS）技术栈。公司以匹兹堡为总部，同时采取跨多个州运营并连接国际工程团队的分布式模式；据商业跟踪资料，员工数从公开发布时的 150
              人增至 2024 年底的 248 人，并于 2026 年 8 月达到 304 人。运营测试使用配备传感器、部署在公共货运通道上的测试车辆，在驾驶员监督协议下采集光学、电磁和声学遥测数据，用于模型训练。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO008
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO009
              - CO010
              - CO013
      - number: '1.2'
        title: 高管领导、关键人物风险与安全治理
        blocks:
          - type: paragraph
            body: >-
              管理层由首席执行官 Bryan Salesky、总裁 Peter Rander 博士和首席技术官 Brett Browning 博士组成，三人合计拥有七十多年自动驾驶和重型机械机器人运营经验。Salesky
              曾共同创立 Argo AI 并担任 CEO，还曾在卡内基梅隆大学国家机器人工程中心（NREC）负责 Caterpillar 自动驾驶矿卡项目的软件工程；Rander 共同创立 Argo AI，并在 Uber
              Advanced Technologies Group（Uber ATG）负责工程项目。Browning 曾在 Argo AI、Uber ATG 和 NREC
              负责自动驾驶子系统，覆盖自动驾驶乘用车和重型工业运输车。三人构成极高的关键人物集中度：Stack AV
              的技术声誉、招聘能力和投资者信任都与其个人履历紧密相连。为缓解外部监管疑虑并加强运营监督，公司成立了独立安全顾问委员会，成员包括前联邦运输领域负责人：前 NTSB 主席 Robert Sumwalt、前
              FMCSA 局长 Annette Sandberg、前 NHTSA 代理局长 David Kelly，以及前 FBI 助理局长 Christopher Doss。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO014
