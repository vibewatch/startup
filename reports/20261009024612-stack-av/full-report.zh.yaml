  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 赛道拥挤，货运任务有多种解决路径
        blocks:
          - type: paragraph
            body: >-
              Stack AV 所处赛道是 Class 8 卡车自动驾驶，但买方的替代方案并不限于同类软件开发商。Tracxn 识别出 110 家活跃竞争者，并将 Aurora、Einride 和 TuSimple
              列为主要同业；其资料还将广泛货运自动驾驶开发商与专注中程运输的 Gatik、以及电动与自动驾驶货运结合的 Einride 区分开来。Fortune 另列 Waymo Via、Aurora 和 TuSimple
              为竞争者；现状仍是人工驾驶运力，规模足够大的车队或 OEM 也可以选择内部开发。这种分层很重要：限定路线运营商可以在更窄的运营设计域内商业化；集成供应商可以打包车辆和编排系统；广泛覆盖 Class 8
              的开发商则必须同时证明自动驾驶能力和生产级车辆集成能力。
            claimRefs:
              - CP006
              - CP007
              - CP008
