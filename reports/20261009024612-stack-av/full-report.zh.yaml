  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与数据暴露
        blocks:
          - type: paragraph
            body: >-
              现有证据表明 Stack 运营测试车辆并收集广泛传感器记录，但没有证明无人商业货运所需的许可、豁免或逐司法辖区的授权。Stack 2026 年 5 月隐私声明称，测试车为 ADS
              研究和训练收集遥测以及雷达、视频、激光雷达、GPS 和麦克风数据，也设想企业伙伴使用 ADS。这些活动带来隐私、留存、传输、网络安全和合同暴露，尽管 Stack
              表示不使用面部识别并采取合理防护。同一声明承认，任何传输或存储系统都不能保证绝对安全。因此，投资判断不应假设违规或事故，而应在取得原始记录和审计证据前，将监管授权、安全保证、诉讼和自由运营状态保留为未决事项。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR014
      - number: '7.2'
        title: 运营安全与就绪度
        blocks:
          - type: paragraph
            body: >-
              Stack 自己的页面引用 FMCSA、IIHS 和 NHTSA 的北美数据，报告每年发生 455,000 起大型卡车事故、每年有 5,000 人死于大型卡车相关事故，因此安全影响天然很高。Stack
              提出两项治理缓解措施：承诺分享安全协议信息，以及据称提供指导和外部监督的外部安全顾问委员会。这些是有用的流程信号，不能替代测试里程、脱离接管、干预率、碰撞记录、运营设计域限制或经过验证的安全论证。当前主页仍将公司描述为自动驾驶系统开发商，而非报告商业部署量。因此，在性能数据证明真实货运条件下的就绪度前，剩余运营风险必须维持高位或未知。
            claimRefs:
              - CR004
              - CR005
              - CR011
              - CR015
