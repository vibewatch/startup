      - number: '4.2'
        title: 成本结构动态、毛利率驱动因素与单位经济性
        blocks:
          - type: paragraph
            body: >-
              Class 8
              货运自动驾驶的经济逻辑，是提高牵引车日利用率并降低人工和碰撞责任，从而改善干线运输运营利润率（CI001、CI002、CI007）。传统人工卡车运输中，人工占每英里可变成本的四成至四成五；服务时长监管又将牵引车每日行驶限制在约
              11 小时（CI001、CI002）。此外，造成伤亡的商用卡车碰撞平均成本超过
              $3M，使企业车队承担高额保险费和责任开销（CI007）。自动驾驶系统理论上能让车辆在数百英里线路上接近连续运营，但现实交付仍需要大量抵消性成本投入（CI001、CI002）。Stack AV
              必须投入包含摄像头、雷达、激光雷达和计算单元在内的先进多传感器感知套件，以及持续的云端遥测基础设施、远程车队监控中心和冗余底盘集成（CI003、CI008）。在没有商业货运规模前，Stack AV
              会产生负毛利率；稳态单位经济性取决于达到工业制造规模并完成 OEM 合作集成（CI004、CI008）。
            claimRefs:
              - CI001
