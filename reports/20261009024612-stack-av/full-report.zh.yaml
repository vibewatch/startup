      - number: '4.3'
        title: 资本充足性、现金消耗与发起方依赖
        blocks:
          - type: paragraph
            body: >-
              Stack AV 是北美最依赖资本的早期自动驾驶项目之一，主要获得日本投资集团 SoftBank Group Corp 支持（CI005、CI006、CI011）。Tracxn 企业情报记录显示，Stack AV
              于 2023 年 9 月 7 日完成首轮融资，据报道金额为 $1 billion，并归类为单一机构发起方（CI009、CI010）。SoftBank 管理层和 CEO Bryan Salesky
              将这项承诺描述为耐心的长期资本，旨在支持公司从开发走向商业部署（CI005、CI006）。但公司存在严重的发起方集中风险：SoftBank 是唯一披露的机构支持者，SoftBank 和 Stack AV
              均未披露这笔资本对应的具体分期里程碑、治理控制或清算优先权（CI005、CI009、CI010）。Argo AI 的警示先例——在自动驾驶商业化周期拉长后，于 2022 年 10 月在吸收 Ford Motor
              Co. 和 Volkswagen AG 的 $3.6 billion 后倒闭——凸显单一发起方依赖的脆弱性（CI005、CI006）。Stack AV 虽已在 15 个州建立超过 150 人的运营工程团队，并于
              2024 年末扩至约 248 人，但其月度运营现金消耗和剩余流动性期限仍是完全未经验证的私有指标（CI004、CI005、CI010）。
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI009
              - CI010
              - CI011
      - number: '4.4'
        title: 财务结论、资本强度与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              从机构尽调角度看，Stack AV
              不能被视为拥有可预测现金流或可辩护单位利润的运营企业（CI004、CI012）。公司展现了技术领导力，也吸引了巨额风险资本承诺，但仍处于明确的收入前研发阶段，尚无公布的商业试点收入或具有约束力的承运商采购订单（CI004、CI005、CI012）。如果实现
              Level 4
              商业无人驾驶，货运自动驾驶具有巨大的可触达价值；但达到现金流盈亏平衡需要持续投入数亿美元，用于测试、云端处理和硬件验证（CI005、CI008、CI011）。主要投资判断阻碍包括未经验证的月度现金消耗、SoftBank
              未披露的分期条件、缺失的定价表，以及未经证明的监管无人驾驶部署时间表（CI004、CI005、CI012）。在 Stack AV
              披露经审计财务报表、具有约束力的车队意向书或第三方验证的运营成本里程碑前，私有数据不透明会从结构上阻断直接投资判断（CI004、CI012）。
            claimRefs:
              - CI004
              - CI005
              - CI008
              - CI011
              - CI012
