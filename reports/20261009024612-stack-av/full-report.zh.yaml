  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资边界是 Class 8 货运卡车自动驾驶系统，而不是更宽泛的自动驾驶汽车、物流软件、电动卡车、仓储机器人或乘客出行市场。Stack 将自身描述为面向更安全、更高效货运和供应链的自动驾驶卡车方案，但创始人于
              2023 年表示，公司聚焦 Class 8 卡车，却尚未披露具体要实现哪些自动化。实际替代方案包括人工驾驶干线运输、驾驶辅助系统、车队自研技术和竞争性自动驾驶卡车平台。2026 年与
              PACCAR、Peterbilt 联合发布卡车后，产品路径更偏向集成 OEM 的重型卡车，但仍未明确商业运输线路、定价产品或可触达的支出池。
            claimRefs:
              - CM001
              - CM002
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
