            body: >-
              由于公开证据不支持企业价值区间，情景框架有意采用条件描述而非数字。乐观结果要求将测试车队活动转化为具名、付费的采用，并取得可信的安全和部署证据；基准结果是继续开发，但披露不足以判断价格；悲观结果则是在商业化仍无日期、同时需要以不利条件追加资本时出现。Tracxn
              将 Aurora、Einride 和 TuSimple 列为主要竞争者，并将 Aurora 和 TuSimple
              标为上市公司，但这只是竞争集合，不是干净的估值可比集合。任何同业募集的资金都不是企业价值；运营模式、成熟度、资本结构和公开市场状态不同，也使现有材料无法支持可靠的倍数迁移。
