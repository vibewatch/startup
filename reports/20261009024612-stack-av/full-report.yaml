  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model Architecture, Monetization Pathways, and Pricing Dynamics
        blocks:
          - type: paragraph
            body: >-
              Stack AV's planned commercialization centers on addressing structural friction across the North American
              trucking economy, notably vehicle uptime constraints, high operating expenditures, and severe collision
              liabilities (CI001, CI002, CI007). In commercial freight transportation, autonomous vehicle developers
              converge around two primary revenue models: turnkey Freight-as-a-Service (FaaS) capacity and Autonomous
              Driving System (ADS) platform software licensing (CI008). Under a platform licensing architecture,
              autonomous technology providers separate software and sensor development from physical vehicle
              manufacturing, enabling fleet operators and enterprise carrier partners to deploy autonomous tractors
              without the technology provider absorbing total rolling fleet capital expenditure (CI008). Stack AV's
              external data protection disclosures confirm that the company envisions allowing enterprise partners to
              utilize its ADS platform while managing vehicle telemetry, sensor perception data, and operational
              geolocation feeds (CI003). However, Stack AV has published zero standard list prices, rate-per-mile
              schedules, or tiered subscription tiers, leaving realized carrier contract values and revenue recognition
              policies completely undisclosed to public markets (CI004, CI008).
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI007
              - CI008
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
