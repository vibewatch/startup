      - number: '7.2'
        title: Operational Safety and Readiness
        blocks:
          - type: paragraph
            body: >-
              Safety impact is inherently high because Stack's own page, citing FMCSA, IIHS, and NHTSA for North
              America, reports 455,000 large-truck crashes per year and 5,000 deaths each year involving large trucks.
              Stack presents two governance mitigations: a commitment to share safety-protocol information and an
              outside Safety Advisory Council that it says provides guidance and external oversight. These are useful
              process signals, not substitutes for test miles, disengagements, intervention rates, collision records,
              operational-design-domain limits, or a validated safety case. The current homepage still describes the
              company as developing autonomous systems rather than reporting commercial deployment volume. Residual
              operational risk must consequently remain high or unknown until performance data demonstrates readiness
              under real freight conditions.
            claimRefs:
              - CR004
              - CR005
              - CR011
              - CR015
