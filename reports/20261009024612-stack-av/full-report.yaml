  - id: TV003
    title: Bull / Base / Bear Scenario Framework
    columns:
      - Case
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Named paid deployments, independently supported safety readiness, and sufficient committed capital.
        - >-
          A range becomes supportable only after entry price, forecast cash flows, dilution, and a relevant market
          benchmark are verified.
        - No confirming public evidence in the assigned pool.
        - Customer or deployment milestones slip without replacement proof.
      - - Base
        - Test activity continues, but customers, timing, financing terms, and economics remain private.
        - Maintain unknown valuation and Track / research-more stance; do not infer value from funding raised.
        - Closest to the reviewed disclosure state, not a forecast probability.
        - Another financing is required before commercial evidence improves.
      - - Bear
        - Commercialization remains undated and capital is offered only on adverse terms or becomes unavailable.
        - Downside could extend to substantial or total equity loss, but the assigned evidence cannot quantify it.
        - Plausible adverse branch; probability is not estimable from public evidence.
        - No paid adoption, weakened sponsor support, or an unfavorable recapitalization.
    notes: >-
      These are conditional cases, not forecasts; no scenario probability, enterprise-value range, revenue estimate, or
      cash-burn estimate is supported by the assigned evidence.
