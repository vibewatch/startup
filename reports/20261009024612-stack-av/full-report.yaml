      - number: '7.3'
        title: Capital, Partner, and Execution Dependencies
        blocks:
          - type: paragraph
            body: >-
              SoftBank is the only capital backer identified in the assigned evidence, and the amount and conditions of
              that support are not consistently disclosed in the usable record. Stack's launch release says SoftBank
              supplies capital, resources, and AI expertise; Technical.ly described the amount as unspecified, while
              Trucking Dive reported that a spokesperson did not answer its funding-level inquiry. The founders' Argo AI
              history adds relevant execution context rather than proving that Stack will repeat Argo's outcome:
              independent coverage records Argo's 2022 closure, Ford and Volkswagen write-offs, and Ford's view that the
              predecessor failed to attract new investors while scaled autonomy remained distant. Tracxn's count of 110
              active competitors, including 41 funded companies, reinforces the need to diligence financing durability
              and partner conversion rather than infer runway from funding headlines.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR014
              - CR015
      - number: '7.4'
        title: Monitoring, Diligence, and Thesis-Break Conditions
        blocks:
          - type: paragraph
            body: >-
              Investment monitoring should focus on evidence releases, not narrative milestones. The thesis should pause
              if Stack cannot document its operating-authority pathway, provide independently reviewable safety metrics,
              demonstrate funded runway through the next technical milestone, or show enforceable OEM and fleet-partner
              commitments. A severe safety event, a material data breach, loss of sponsor support, or repeated failure
              to convert development work into measured commercial operations would be thesis-break events once
              verified. Workforce evidence also needs reconciliation: the 2023 launch release reported 150 employees
              across headquarters and 15 states, while the extracted Tracxn page contains 248 employees as of December
              31, 2024 and a separate 304 figure dated only "Aug 26." These are proposed diligence gates, not company
              commitments, and the assigned analyst comparison is itself conflict-sensitive because its author disclosed
              a long UBER position.
            claimRefs:
              - CR012
              - CR013
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Support Is Not the Same as Available Runway
            body: >-
              Public sources confirm SoftBank support but do not establish the amount available, tranche conditions,
              burn rate, or months of runway. Underwriting should keep those quantities unknown until financing
              documents and a current cash plan are reviewed.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR008
          - type: callout
            title: Treat Public Safety Governance as a Starting Point
            body: >-
              The Safety Advisory Council and disclosure commitment are positive governance signals, but investment
              clearance should require operating-authority records and independently reviewable safety-performance
              evidence.
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR005
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The current recommendation is Track / research more, with medium confidence in that decision, high
              underwriting risk, and an unknown valuation stance. Independent reporting described SoftBank's 2023
              backing as more than $1 billion, while Tracxn characterizes the company as having raised $1 billion in one
              round. Those reports do not establish cash available on the run date, the security issued, tranche
              conditions, liquidation preferences, dilution, or governance rights. Forge separately shows no Stack AV
              Forge Price or post-money valuation and labels market activity Limited. Without an entry price,
              capitalization table, operating forecasts, or current commercial economics, a dollar valuation range and
              target return would be false precision. Investment approval should therefore remain gated on financing
              documents and verifiable commercial proof rather than the headline funding amount.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
