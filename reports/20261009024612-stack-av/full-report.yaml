      - number: '2.2'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Stack's public language points to fleets, carriers, shippers, and supply-chain partners as beneficiaries,
              with operating, safety, procurement, and technology leaders likely participating in a purchase. The
              company frames demand around driver shortages, low vehicle uptime, safety exposure, high operating costs,
              emissions, and pressure for reliable supply chains. Adoption is not a simple software sale: the founder
              highlighted the capital required to reach scale and the need for redundant truck equipment, while the
              privacy notice contemplates enterprise partners using Stack's automated driving system and generating
              telemetry, video, audio, and geolocation data. Those dependencies imply OEM integration, operational
              validation, data governance, and fleet workflow change before recurring commercial deployment.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM014
