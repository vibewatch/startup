  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable boundary is autonomous systems for Class 8 freight trucks, not the broader
              autonomous-vehicle, logistics-software, electric-truck, warehouse-robotics, or passenger-mobility markets.
              Stack describes an autonomous trucking solution aimed at safer and more efficient freight and supply
              chains, while its founder said in 2023 that the company was focused on Class 8 trucks but had not
              disclosed exactly what it would automate. The practical substitute set therefore includes human-driven
              linehaul, driver-assistance systems, internal fleet technology, and competing autonomous-truck platforms.
              A 2026 truck unveiling with PACCAR and Peterbilt narrows the product path toward OEM-integrated heavy
              trucks, but it still does not identify a commercial lane, priced offering, or addressable spend pool.
            claimRefs:
