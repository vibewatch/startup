  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: A crowded field with several ways to solve the freight job
        blocks:
          - type: paragraph
            body: >-
              Stack AV's stated arena is autonomous Class 8 trucking, but the buyer's alternatives extend beyond
              like-for-like software developers. Tracxn identifies 110 active competitors and names Aurora, Einride, and
              TuSimple as leading peers; its profiles also distinguish broad freight-autonomy developers from Gatik's
