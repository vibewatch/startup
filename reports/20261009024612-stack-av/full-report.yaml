      - number: '3.4'
        title: Execution evidence, not pedigree, will determine moat durability
        blocks:
          - type: paragraph
            body: >-
              The founding team brings relevant autonomy experience: Technical.ly and CEEhire identify Bryan Salesky,
              Peter Rander, and Brett Browning as former Argo AI leaders. That history provides recruiting and
              systems-development credibility, but it also supplies adverse context. Fortune reported that Ford and
              Volkswagen closed Argo after investing a combined $3.6 billion, illustrating how patient capital can still
              be exhausted before autonomy reaches a satisfactory return. Stack's competitive advantage is therefore
              best treated as an execution thesis, not an established moat. Durable differentiation would require
              independently measured safety and reliability, a manufacturable redundant chassis path, named fleet
