              - CV002
              - CV003
              - CV004
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
              - CV015
      - number: '8.2'
        title: Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The investable thesis combines reported patient capital, a leadership team formed by former Argo AI
              executives, a focused autonomous-trucking product, and visible safety governance. Technical.ly reported
              150 employees across 15 states at the 2023 launch, and Stack says its systems are designed around safety,
              reliability, efficiency, and customer outcomes. Its Safety Advisory Council adds external guidance,
              although the company remains the issuer of that claim. The anti-thesis is stronger than a normal
              early-stage disclosure gap: Fortune reported that the investment amount was not detailed, potential
              customers were unnamed, and no commercialization or investor-return timeline was supplied. Tracxn also
              depicts a crowded field of 110 active competitors. The evidence supports technical and capital capacity,
              but not current product-market fit, revenue quality, or price discipline.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Scenarios and Comparable Context
        blocks:
          - type: paragraph
            body: >-
              The scenario framework is intentionally conditional rather than numeric because public evidence does not
              support an enterprise-value range. A bull outcome requires conversion of test-fleet activity into named,
              paid adoption plus credible safety and deployment evidence; a base outcome is continued development
              without enough disclosure to underwrite a price; and a bear outcome follows if commercialization remains
              undated while additional capital is needed on unfavorable terms. Tracxn identifies Aurora, Einride, and
              TuSimple as leading competitors and labels Aurora and TuSimple public, but this is a competitive set
              rather than a clean valuation-comparable set. Funding raised by any peer is not enterprise value, and
              differing operating models, maturity, capital structures, and public-market status prevent a sound
              multiple transfer from the reviewed material.
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV012
              - CV014
              - CV016
      - number: '8.4'
        title: Exit Readiness and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              Exit readiness cannot be demonstrated from the assigned public evidence. Forge reports Limited market
              activity and no available Forge Price, while Fortune reports no stated commercialization or
              investor-return timeline. That combination does not prove an exit is unavailable, but it leaves both
              liquidity and timing unquantified. Before changing the recommendation, diligence should obtain the fully
              diluted capitalization table; security and preference terms; committed versus funded capital; current
              cash, monthly cash use, and runway; audited financials and operating plan; named pilot or customer
              contracts; deployment milestones; and independently testable safety and regulatory evidence. A target
              return and hold period should be modeled only after those inputs and an actual entry price are known.
              Failure to substantiate paid adoption or durable funding before the next financing decision is the
              principal thesis-break signal.
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track Until Price and Proof Converge
            body: >-
              Substantial reported backing improves the capacity-to-build case, but it does not substitute for an entry
              price, financing terms, named commercial adoption, or a dated path to returns.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV009
              - CV010
              - CV014
              - CV015
          - type: callout
            title: Do Not Treat Funding as Available Cash
            body: >-
              The reviewed sources describe funding or backing but do not establish the amount funded to date, remaining
              commitments, restrictions, preferences, or cash available on 2026-10-09.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV004
