              internal-build path remains available to sufficiently large fleets or OEMs. This segmentation matters:
              constrained-route operators can commercialize a narrower operating domain, integrated providers can bundle
              vehicles and orchestration, and broad Class 8 developers must prove both autonomy and production-grade
              vehicle integration.
