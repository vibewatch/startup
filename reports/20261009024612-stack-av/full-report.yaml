      - number: '5.3'
        title: Deployment, Safety Governance, and Workflow Integration
        blocks:
          - type: paragraph
            body: >-
              Deploying autonomous trucking systems requires rigorous safety engineering, fail-operational redundancy,
              and seamless coordination with existing fleet workflows. In standard commercial logistics, freight
              carriers face substantial operational bottlenecks, including mandatory hours-of-service rest stops that
              cap truck utilization at approximately 10 to 11 hours per day, high per-mile operating expenses, and
              severe liabilities from roadway accidents, where catastrophic collisions can cost over $3 million per
              fatal or severe incident. Stack AV's operational model pairs automated highway transit with
              human-in-the-loop monitoring to maximize vehicle uptime while optimizing infrastructure efficiency. To
              govern system reliability and public road readiness, the company established an external Safety Advisory
              Council composed of former leadership from the National Transportation Safety Board (NTSB), the Federal
              Motor Carrier Safety Administration (FMCSA), and the National Highway Traffic Safety Administration
              (NHTSA). However, Stack AV's technology remains pre-commercial, without public disclosures of driverless
              regulatory exemption approvals, formal OEM factory integration agreements, or uncrewed commercial freight
              runs.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE005
              - CE008
              - CE011
              - CE012
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Remote Assist Architecture as Commercialization Accelerator
            body: >-
              Stack AV's dedicated Remote Assist engineering organization indicates an operating model that utilizes
              human-in-the-loop cloud intervention to navigate complex, ambiguous edge cases. By streaming real-time
              video over cellular uplinks to remote operators, the system can resolve unstructured driving impasses
              without requiring an in-cab safety driver, serving as a vital bridge between supervised testing and fully
              autonomous commercial operations.
            calloutType: insight
            claimRefs:
              - CE008
              - CE009
          - type: callout
            title: Pre-Commercial Stage and Absence of OEM Integration Disclosures
            body: >-
              While Stack AV benefits from an experienced robotics leadership team and SoftBank capital, the company has
              not publicly disclosed factory-installed drive-by-wire partnerships with major Class 8 truck OEMs (such as
              PACCAR, Daimler, or Volvo). Without production chassis integration, retrofitted test fleets face
              significant hurdles scaling to high-reliability commercial freight volumes.
            calloutType: risk
            claimRefs:
              - CE005
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Target Customer Segmentation and Buyer Dynamics
        blocks:
          - type: paragraph
            body: >
              Stack AV targets the Class 8 commercial motor freight industry, focusing on long-haul carriers, enterprise
              supply chain shippers, and private corporate fleets operating high-density highway lanes. The buyer
              dynamic in heavy-duty autonomous trucking involves complex organizational alignment across carrier
              executive leadership, fleet operations managers, and safety compliance teams. Enterprise fleet customers
              evaluate autonomous driving systems based on proven roadway safety, equipment reliability, fuel economy,
              and seamless integration into dispatch networks. Stack AV's enterprise data protection disclosures
              establish that the company anticipates allowing enterprise partners to use its Automated Driving System
              while Stack AV collects and maintains vehicle telemetry, video camera feeds, and geolocation data.
              Furthermore, management emphasizes that evolving consumer demand patterns necessitate intelligent,
              AI-driven supply chains that can deliver freight faster and more reliably. To facilitate institutional
              procurement and address rigorous carrier safety vetting, Stack AV established an external Safety Advisory
              Council composed of former transportation safety and regulatory officials. [CU003] [CU004] [CU007] [CU008]
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU008
          - type: table
            tableRef: TU001
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU008
      - number: '6.2'
        title: Adoption Trajectory and Fleet Deployment Footprint
        blocks:
          - type: paragraph
            body: >
              Stack AV's customer adoption trajectory remains in an early pre-revenue demonstration phase. Industry
              trackers record zero commercial revenue run-rate for the company as of 2026, consistent with its ongoing
              focus on core autonomous systems development and initial highway testing. The company deployed an initial
              test fleet of heavy-duty autonomous trucks on public roads in 2023, using traditional engine test tractors
              while ensuring compatibility with future electric vehicle platforms. Management has leveraged this fleet
              to demonstrate autonomous driving capabilities to prospective commercial partners across multiple states.
              However, prospective fleet customers confront substantial adoption hurdles, including stringent federal
              motor carrier safety standards, insurance underwriter requirements, and complex depot integration demands.
              Backed by long-term capital from SoftBank Group Corp, Stack AV has maintained a development posture
              focused on achieving full unconstrained highway autonomy rather than prematurely locking in constrained
              corridor pilot agreements. [CU005] [CU009] [CU013] [CU014]
            claimRefs:
              - CU005
              - CU009
              - CU013
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU007
              - CU010
              - CU014
      - number: '6.3'
        title: Named Customer Proof and Competitive Context
        blocks:
          - type: paragraph
            body: >
              As of October 2026, Stack AV has not disclosed any named customer relationships, commercial shipper
              letters of intent, or binding carrier capacity commitments. Chief Executive Officer Bryan Salesky publicly
              confirmed that the startup is actively demonstrating its autonomous technology on 18-wheelers to potential
              enterprise customers with encouraging feedback, but has consistently declined to reveal specific partner
              names. This private demonstration approach contrasts sharply with the public commercial milestones
              publicized by key industry rivals. Peer autonomous trucking developers Aurora Innovation, Kodiak Robotics,
              and Torc Robotics have established prominent customer pilot programs with major logistics carriers such as
              Werner Enterprises, FedEx, and Uber Freight. While Stack AV's decision to withhold partner disclosures
              aligns with its patient capital strategy, it prevents external validation of market traction, pricing
              models, and carrier satisfaction metrics. [CU001] [CU002] [CU006] [CU011]
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU006
              - CU011
      - number: '6.4'
        title: Commercial Durability and Customer Concentration Risks
        blocks:
          - type: paragraph
            body: >
              Because Stack AV has not launched commercial freight service, traditional software customer durability
              metrics such as Net Revenue Retention, Gross Revenue Retention, and cohort renewal rates cannot be
              measured. Instead, customer durability will be determined by operational uptime, safety compliance track
              records, and system integration depth once carrier fleets deploy. Stack AV's publication of an inaugural
              Voluntary Safety Self-Assessment illustrates its efforts to build transparent governance to reassure
              prospective fleet operators. Nevertheless, the lack of contracted carrier anchor tenants exposes the
              company to severe customer concentration risk upon commercialization. If initial deployment relies on a
              narrow group of launch partners, any operational pause or route cancellation by a primary carrier would
              disproportionately impact business momentum. Moreover, competing autonomous developers that secure
              multi-year carrier relationships could lock up premier long-haul corridors and equipment allocations.
              [CU004] [CU010] [CU012] [CU014]
            claimRefs:
              - CU004
              - CU010
              - CU012
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Absence of Named Commercial Carrier Partners Creates Deployment Uncertainty
            body: >
              Unlike sector peers Aurora Innovation and Kodiak Robotics, which have publicized carrier partnerships with
              fleets such as Werner Enterprises and FedEx, Stack AV has announced zero named customers or pilot
              commitments. While executive leadership confirms private demonstrations to prospective partners, the lack
              of verifiable carrier traction leaves commercialization timing and adoption velocity unconfirmed.
            calloutType: risk
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU011
          - type: callout
            title: Enterprise ADS Framework Signals Focus on Managed Fleet Partnerships
            body: >
              Stack AV's public data governance disclosures explicitly anticipate enterprise partners utilizing its
              Automated Driving System while Stack AV maintains telemetry, video, and geolocation infrastructure. This
              operating architecture suggests Stack AV may pursue a Transportation-as-a-Service or managed technology
              partnership model rather than direct truck ownership.
            calloutType: insight
            claimRefs:
              - CU004
              - CU008
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Data Exposure
        blocks:
          - type: paragraph
            body: >-
              The available evidence establishes that Stack operates test vehicles and collects a broad sensor record,
              but it does not establish the permits, exemptions, or jurisdiction-by-jurisdiction authority needed for
              driverless commercial freight. Stack's May 2026 privacy notice says test vehicles collect telemetry
              together with radar, video, lidar, GPS, and microphone data for ADS research and training; it also
              contemplates enterprise partners using the ADS. Those activities create privacy, retention, transfer,
              cybersecurity, and contractual exposure even though Stack says it does not use facial recognition and
              applies reasonable safeguards. The same notice concedes that no transmission or storage system is
              guaranteed to be fully secure. The appropriate underwriting stance is therefore not to assume
              non-compliance or an incident, but to keep regulatory authorization, security assurance, litigation, and
              freedom-to-operate status open until primary records and audit evidence are produced.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
