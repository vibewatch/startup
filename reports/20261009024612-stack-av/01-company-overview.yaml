chapter:
  number: 1
  title: "Company Overview"
  summary: "Stack AV Co. is a Pittsburgh-based autonomous trucking developer founded by former Argo AI executives Bryan Salesky, Peter Rander, and Brett Browning, focused on building SAE Level 4 autonomous systems for Class 8 freight transportation. Backed by SoftBank Group Corp. with committed funding reported at north of $1 billion, the company operates test fleets on public roads while remaining pre-commercial without disclosed customer revenue or public valuation."
sections:
  - id: "corporate-identity-and-founding"
    title: "Corporate Identity, Operating Structure, and Founding Heritage"
    body: "Stack AV Co. (CIN 7116598) is a Delaware-incorporated autonomous commercial vehicle developer based in Pittsburgh, Pennsylvania, with corporate registration dating to November 2, 2022, and formal public emergence on September 7, 2023. The venture was established by former Argo AI leadership following the October 2022 shutdown of Argo AI by principal backers Ford Motor Company and Volkswagen AG. Rather than pursuing urban passenger robotaxis, Stack AV concentrates specifically on Class 8 heavy-duty long-haul commercial trucks, developing proprietary artificial intelligence, robotics, machine learning, and cloud-integrated Automated Driving System (ADS) stacks. The company couples its Pittsburgh headquarters with a distributed operating model across multiple states and international engineering connections, expanding headcount from an initial 150 employees at public launch to 248 by year-end 2024 and 304 by August 2026 according to commercial tracking profiles. Operational testing utilizes sensor-equipped test vehicles deployed on public freight corridors to capture optical, electromagnetic, and acoustic telemetry data for model training under driver-supervised protocols."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO008"
      - "CO013"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership, Key-Person Exposure, and Safety Governance"
    body: "The executive team consists of Chief Executive Officer Bryan Salesky, President Peter Rander, Ph.D., and Chief Technology Officer Brett Browning, Ph.D., who together represent over seven decades of combined operational experience in autonomous vehicles and heavy machinery robotics. Salesky previously co-founded and led Argo AI as CEO and directed software engineering for Caterpillar's autonomous mining truck program at Carnegie Mellon University's National Robotics Engineering Center (NREC), while Rander co-founded Argo AI and led engineering initiatives at Uber Advanced Technologies Group (Uber ATG). Browning directed autonomy subsystems across self-driving cars and heavy industrial haulers across Argo AI, Uber ATG, and NREC. The trio represents extreme key-person concentration, as Stack AV's technical reputation, hiring leverage, and investor trust are tightly tied to their personal track records. To mitigate external regulatory skepticism and build operational oversight, the company established an independent Safety Advisory Council comprising former federal transportation leaders, including former NTSB Chairman Robert Sumwalt, former FMCSA Administrator Annette Sandberg, former NHTSA Acting Administrator David Kelly, and former FBI Assistant Director Christopher Doss."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO014"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholder-map"
    title: "Capitalization, Investor Dynamics, and Commercial Roadmap"
    body: "Stack AV was established with anchor financial and technological backing from Japan's SoftBank Group Corp., with economic development officials and financial reporting indicating total committed capital of north of $1 billion. SoftBank, managing more than $160 billion in artificial intelligence assets, positioned its investment as long-term patient capital to solve capital-intensive supply chain and logistics constraints. However, Stack AV has not publicly disclosed its legal funding round structure, post-money valuation, share classes, or liquidation preferences, leaving external market assessments reliant on secondary data aggregators that label the initial September 2023 financing as a single-investor institutional injection. While Stack AV has demonstrated its Class 8 autonomous systems to potential fleet customers and logistics carriers, commercial revenue, contracted freight bookings, and named carrier partners remain undisclosed. The company operates in a capital-intensive environment competing directly with well-funded public and private autonomous trucking entities including Aurora Innovation and Einride, making continued access to capital milestones and regulatory approvals paramount to long-term viability."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO003"
