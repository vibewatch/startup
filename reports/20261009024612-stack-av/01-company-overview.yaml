callouts:
  - calloutType: "insight"
    title: "Second-Chance Advantage: Capitalizing on the Argo AI Engineering Legacy"
    body: "Stack AV's rapid ramp to a road-tested fleet and a multi-hundred person engineering team within months of launch directly reflects its founders' ability to absorb institutional knowledge and technical talent from Argo AI's six-year, $3.6 billion development cycle. While Argo AI succumbed to the extended timelines of passenger robotaxis, Stack AV pivots the same executive core to Class 8 highway trucking—a domain characterized by exit-to-exit highway repetition, acute driver shortages, and more direct commercial ROI."
    claimRefs:
      - "CO002"
      - "CO003"
      - "CO007"
      - "CO012"
  - calloutType: "risk"
    title: "Capital Concentration and Absence of Commercial Disclosures"
    body: "Despite receiving north of $1 billion in committed backing, Stack AV exhibits acute single-investor concentration with SoftBank Group. The company has disclosed neither its legal balance sheet structure nor any binding carrier commercial contracts. In a capital-intensive sector where competitors such as Aurora Innovation have secured commercial freight partnerships and public market capital, Stack AV's commercial validation and valuation benchmarks remain completely opaque to external diligence."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO015"
      - "CO016"
