company:
  name: Arcadia
chapter:
  number: 1
  title: Company Overview
  summary: 'Arcadia remains an energy-intelligence platform for enterprises: the current public story combines utility bill management, energy procurement advisory, and sustainability reporting on top of a unified data layer. The September 2026 refresh confirms the business is still founder-led, still private, and still scaled more by operational volume and customer breadth than by disclosed financial metrics. The most important update versus the prior report is that Arcadia now publicly emphasizes larger enterprise-scale metrics, AI-driven data handling, and continued platform expansion, while revenue, exact headcount, and current valuation remain non-public or only externally estimated.'
sections:
- id: identity-business-model
  title: Identity, Platform, and Business Model
  body: 'Arcadia says it is the energy intelligence platform for businesses and describes one place to pay utility bills, buy energy, and advance sustainability. The current about page keeps the same framing and adds a three-solution enterprise stack: Utility Bill Management, Energy Procurement Advisory, and Sustainability Reporting. The 2026 homepage also emphasizes unified data, AI-powered analytics, and expert advisory. Taken together, the current positioning is no longer a consumer clean-energy app story; it is an enterprise workflow story built around bill payment, energy purchasing, and reporting. The refreshed 2026 cache also emphasizes AI-driven analytics and enterprise advisory, which reinforces that the company is now selling a workflow platform rather than only energy data.'
  claimRefs:
  - CO001
  - CO004
  - CO009
  tableRefs:
  - TO001
  figureRefs: []
- id: leadership-governance
  title: Founders, Leadership, and Governance
  body: "Kiran Bhatraju remains the founder and CEO, and the public leadership page now lists Paige Janson, Erica Borggren, Udit Garg, Paul Mul\xE9, and Nicholas Mack alongside him. That makes the company visibly founder-led but no longer a one-person public face. The governance picture is still thin: public sources do not provide a full board biography pack or committee map, so key-person dependence remains a practical diligence issue even though the leadership bench is broader than it was in early Arcadia Power days. Public leadership therefore reads as founder-led but not founder-only, which is a healthier operating shape than the earlier one-person public narrative."
  claimRefs:
  - CO002
  - CO003
  - CO011
  tableRefs:
  - TO002
- id: funding-scale-milestones
  title: Funding, Scale, and Milestones
  body: Public financing signals still show a large capital base. The 2022 Arcadia press release described a $200 million financing led by J.P. Morgan Asset Management, while Latitude later reported additional growth financing and a credit facility, and FundedIQ / Nasdaq Private Market continue to present Arcadia as a private, pre-IPO company. On the operating side, the current homepage cites 1,500+ enterprise customers, 4.5 million meters under management, 25% of the Fortune 500 served, $30 billion in annual utility payments processed, and $100 billion in utility spend under management. The company also uses Aggregate 2026 as a customer-facing milestone marker for the enterprise business. Because the newest public funding detail comes from a mix of company, trade, and database sources, the exact current cap table and debt stack still need management confirmation.
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  - CO010
  - CO012
  tableRefs:
  - TO003
  figureRefs:
  - FO001
