company:
  name: Arcadia
chapter:
  number: 5
  title: Product & Technology
  summary: 'Arcadia''s product story is a layered enterprise platform: data ingestion and normalization on the bottom, analytics and workflow automation in the middle, and bill pay, procurement, and sustainability actions on top. The refresh confirms that the company is still emphasizing AI-assisted data quality, enterprise security, and workflow integration rather than a narrow API-only story. The most important technical diligence gap remains the same: public sources explain the architecture direction, but not the full reliability, roadmap, or integration economics needed to underwrite scale.'
sections:
- id: product-definition
  title: Product Definition and Module Map
  body: Arcadia's current public product story is a bundle of enterprise workflows rather than a single SKU. The homepage and about page describe one place to pay utility bills, buy energy, and advance sustainability, while the AI-security page frames the company as an AI-powered data and enterprise-security platform. In practice, that means the product stack spans utility bill management, tariff intelligence, data normalization, energy procurement advisory, and sustainability reporting. The refresh suggests the company is still selling a platform that sits inside the customer's operating workflow, not a standalone dashboard. That breadth is what makes the company feel more like an operating layer for energy decisions than a point product.
  claimRefs:
  - CE001
  - CE002
  - CE003
  tableRefs:
  - TE001
- id: workflow-architecture
  title: Workflow, Integrations, and Operating Architecture
  body: 'The architecture looks like a classic enterprise data pipeline: access credentials and provider data come in, bills and tariffs are normalized, analytics are applied, and outputs go to APIs, dashboards, or downstream systems. Public material points to data capture, AI-assisted standardization, and multiple delivery surfaces such as API-style integrations and operational workflows. That architecture is useful because it can reduce manual effort, but it also means Arcadia depends on utility-provider access, data quality, and integration reliability. The product is therefore more operational than a simple software front end.'
  claimRefs:
  - CE004
  - CE005
  - CE006
  - CE007
  tableRefs:
  - TE002
- id: trust-roadmap
  title: Trust, Security, and Roadmap Signals
  body: 'The AI-security page makes trust a core part of the product pitch: Arcadia emphasizes encryption, least-privilege access, and security controls around customer data. Public hiring and marketing pages suggest the team is still investing in GTM and product-marketing capacity, while the conference and customer-facing materials show active roadmap motion. That said, exact release cadence, uptime, and integration economics remain opaque. The technical verdict is therefore positive on architecture direction but still cautious on hard reliability evidence. The search environment is noisier than usual because unrelated Arcadia-branded pages are easy to confuse with the enterprise-energy company. That is a real diligence problem because confidence in the stack depends on source hygiene as well as software quality.'
  claimRefs:
  - CE008
  - CE009
  - CE010
  - CE011
  tableRefs:
  - TE003
  figureRefs:
  - FE001
