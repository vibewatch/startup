  - id: FR001
    title: 风险敞口矩阵
    type: matrix
    summary: 按公开证据归纳法律、运营和合作伙伴风险。
    data:
      columns:
        - 风险领域
        - 当期信号
        - 剩余敞口
      rows:
        - label: 监管 / 法律
          values:
            - 既往监管问询与品牌定位歧义
            - 案卷未结清前，风险仍高
            - 增加采购摩擦与法务审查成本
        - label: 运营风险
          values:
            - 凭证自动化与连接器持续维护
            - 工作流依赖多个外部系统，风险偏高
            - 连接中断会影响账单采集和报告
        - label: 合作伙伴 / 系统集成
          values:
            - 企业级系统集成与生态扩张规模
            - 合作方变动或业务重叠可能损害服务质量，风险中高
            - 集成磨合可能比市场宣传所暗示的更久
        - label: 合规管控
          values:
            - 官网有安全说明和工作流文档
            - 控制措施有文字说明，但未见独立审计，风险中等
            - 索取 DPA、审计结果和安全事件记录
        - label: 客户信任
          values:
            - 企业宣传和社群活动仍在持续
            - 客户证据以方向性信号为主，风险中等
            - 索取 SLA 和客户合同条款
        - label: 合作伙伴集中度
          values:
            - 仍广泛依赖云服务和合作生态
            - 多个外部环节同时关键，风险中高
            - 核实冗余设计和故障切换能力
    approximationNotes: null
    claimRefs:
      - CR001
      - CR004
      - CR008
      - CR011
  - id: FV001
    title: 估值信号流向图
    type: flow
    summary: 展示融资历史、私募市场信息和可比公司如何影响当前估值判断。
    data:
      nodes:
        - id: public-funding
          label: 公开融资历史
          type: source
          detail: 反映融资规模，但没有当前估值
        - id: private-markets
          label: 一级市场参考
          type: process
          detail: Premiere Alts、Tracxn 和 EquityZen 影响市场情绪
        - id: comparables
          label: 可比公司
          type: process
          detail: 上市可比公司为估值倍数区间提供参照
        - id: denominator-gap
          label: 基本面分母缺口
          type: process
          detail: 收入和利润率仍未披露
        - id: scenario
          label: 情景推演框架
          type: process
          detail: 乐观、基准和悲观情景是目前最稳妥的判断框架
        - id: decision
          label: 决策立场
          type: sink
          detail: 建议继续研究，待私下尽调补齐证据缺口后再判断
    approximationNotes: null
    claimRefs:
      - CV001
      - CV004
      - CV008
      - CV012
