  - id: FI001
    title: 资本密集度与现金流图
    type: flow
    summary: 从融资和业务规模一路追踪到收入不确定性，说明为何还需私下披露来评估 Arcadia。
    data:
      nodes:
        - id: funding
          label: 融资历程
          detail: $200M 融资加后续资本
        - id: scale
          label: 业务规模
          detail: 企业运营指标和客户规模较大
        - id: model
          label: 变现模式
          detail: 软件、托管服务和咨询
        - id: gap
          label: 披露缺口
          detail: 未披露利润率、留存率或现金消耗情况
        - id: partner
          label: 合作伙伴经济效益
          detail: 渠道与咨询收入如何分成仍不透明
        - id: runway
          label: 现金跑道 / 烧钱速度
          detail: 未披露现金消耗或现金可支撑期限
      edges:
        - from: funding
          to: scale
          label: 支撑
        - from: scale
          to: model
          label: 必须变现
        - from: model
          to: gap
          label: 无法验证
        - from: model
          to: partner
          label: 可能存在分成
        - from: runway
          to: gap
          label: 尚未披露
    approximationNotes: null
    claimRefs:
      - CI001
      - CI003
      - CI005
      - CI008
      - CI010
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 展示从企业工作流到底层基础设施与控制措施的分层架构。
    data:
      layers:
        - label: 企业级工作流
          detail: 账单支付、能源采购和可持续发展报告
          tone: positive
          modules:
            - 公用事业账单管理
            - 能源采购
            - 可持续发展报告
          outputs:
            - 用户决策
        - label: 应用接入层
          detail: 仪表盘、数据导出、合作伙伴集成、API
          tone: positive
          modules:
