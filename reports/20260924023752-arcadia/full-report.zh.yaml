              - CU007
      - number: '6.3'
        title: 客户集中度、业务扩张与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              客户尽调最缺的是集中度、留存率，以及历史遗留客户与当前账户的构成。Arcadia 没有公布客户集中度、队列留存或复购数据，外界无法判断企业客户关系有多稳固。搜索结果还混入其他 Arcadia
              品牌网站和数据泄露页面，增加了客户核验难度。客户覆盖面是正面信号，但关系能否持续仍无定论；客户逻辑有一定可信度，尚不足以完全支撑投资承保。
