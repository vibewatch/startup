  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接、相邻与替代竞品
        blocks:
          - type: paragraph
            body: >-
              Arcadia 面对的竞争者和替代方案很多。最直接的替代仍是人工流程：电子表格、公用事业门户、经纪商，以及手工拼账单和报告的财务团队。相邻竞争者包括单点数据供应商、能源服务公司、提供 pre-IPO
              可比信息的私募市场平台，以及综合型企业能源软件厂商。公开资料中的差异化主张，是用一套工作流覆盖账单管理、能源采购和可持续发展报告；相比单一公用事业数据 API，覆盖更广，也比普通仪表盘更深入运营。
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 功能广度与产品打包
        blocks:
          - type: paragraph
            body: >-
              官网呈现的是一套组合平台，而非单一产品。产品线更宽，有机会提高交叉销售和客户切换成本，但也让 Arcadia
              更难与专注单项功能的对手直接比较。公司把数据、账单管理、采购咨询和可持续发展报告打包成能源决策操作系统。代价是每个模块都得拿出深度和服务质量，不能只靠某一项功能胜出。此次更新也显示，Arcadia
              正借产品广度争取市场认知；这有战略价值，却要求公司逐一证明各模块的价值。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.3'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Arcadia 的优势看起来来自数据覆盖、工作流整合和客户嵌入，而非某个独家算法。公司称拥有 1,500+ 家企业客户、4.5M
              只在管电表和庞大的公用事业业务量；如果客户关系够稳固，这些条件有助于形成平台型护城河。但财务数据不透明，外界无法判断业务量中有多少是软件收入、多少是服务流水，护城河价值也就难以量化。战略位置虽有吸引力，单一功能切入的竞争者仍可能更容易讲清价值、赢得采购并被客户替换。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP008
      - number: '3.4'
        title: 图表与表格
        blocks:
          - type: callout
            title: 竞争广度既是优势也是负担
            body: Arcadia 有机会争取比单点产品更大的预算；但只要一个模块表现不佳，整个平台的价值主张都可能受损。
            calloutType: insight
            claimRefs:
              - CP004
