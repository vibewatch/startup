  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律合规风险暴露
        blocks:
          - type: paragraph
            body: >-
              法律和监管问题仍是最显眼的尽调风险。Arcadia
              过去的公用事业授权问题曾引起监管关注，留存资料中仍没有明确、广为公开的解决结果。由于公司业务涉及受监管的能源和支付流程，即使不大的合规疑问也可能拖慢客户采购。公司能够规模化运营，但公开证据尚未消除这项法律遗留风险。只有私下核实当前合规做法，并确认旧案已妥善结案，才能把它视为可控问题。即使融资事件已过去很久，合规疑问仍可能挥之不去；企业客户厌恶模糊地带，采购关键工作流软件前尤其需要明确保障。
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR008
              - CR011
      - number: '7.2'
        title: 运营与安全脆弱性
        blocks:
          - type: paragraph
            body: >-
              平台风险不只在法律，也在日常运营。Arcadia 依赖公用事业账户凭证自动化、连接器维护、数据标准化和云服务，以持续接收账单并运行工作流。AI
              安全与集成资料说明公司意识到这些问题，也显示底层系统并不简单。连接器故障、凭证变化或下游系统改动，都可能迅速拖累产品表现，即使没有重大事故。运营韧性因此是核心尽调事项，不是后台细节。公用事业门户或身份认证规则一变，脆弱性就会暴露；营销中看似简单的产品，执行起来却高度复杂。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
              - CR010
      - number: '7.3'
        title: 合作伙伴与系统集成风险
        blocks:
          - type: paragraph
            body: >-
              Arcadia 还依赖企业客户、采购渠道、云基础设施和报告集成等广泛生态。这些伙伴能扩大分销，也会在任一环节出问题时增加摩擦。ENGIE
              等整合项目让依赖更突出：规模效益可能与流程重叠、客户困惑同时出现。公司看起来有能力运营这套系统，但公开资料没有说明它在压力下究竟有多稳。只有当集成对客户确实无感且可靠，投资者才应把它视为价值杠杆。无论整合战略多有吸引力，客户最终看的是系统可用性、账单准确度和变更管理；基于公开资料，买方应把每项集成承诺都视为尚待验证的主张。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR004
              - CR011
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 为何清晰的定价判断目前仍不可能
        blocks:
          - type: paragraph
            body: >-
              Arcadia
              的公开资料讲出了有吸引力的战略故事，却没有给出估值锚点。公司呈现出规模化企业平台的形象，但留存来源没有披露当期收入、ARR、利润率、留存率或客户集中度。估值判断只能先从这些缺口出发，不能贸然套用倍数。当前更合适的结论是列出尽调要求，而不是给出精确折价或溢价。公开叙事解释了投资者为何关注
              Arcadia，却缺少收入等关键分母，无法支撑有根据的定价。
            claimRefs:
              - CV001
              - CV002
              - CV003
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV012
      - number: '8.2'
        title: 可比标的池与市场语境
        blocks:
          - type: paragraph
            body: >-
              公开可比公司并不完美，但仍能提供参照：能源、公用事业和基础设施软件公司通常以相对温和的收入倍数交易，除非软件经济性格外清晰或增长故事足够强。Arcadia
              若能证明利润率和留存达到软件公司的水平，才有理由争取溢价；现有公开资料不足以作此假设。要按纯软件公司定价，仍需私下尽调提供支撑。忽略收入分母缺口会夸大判断把握；若这些条件不成立，乐观情景就会退回到普通的软件与服务混合业务。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: 情景框架
        blocks:
          - type: paragraph
            body: >-
              评估 Arcadia
              应按情景拆解。乐观情景下，公司是客户关系稳固、经济性优于公开资料所显示的企业工作流平台；基准情景下，战略价值仍在，但软件和服务收入并存；悲观情景下，公司虽有价值，价格却超过现有公开证据所能支撑的水平。当前估值立场因此只能是未知，不能简单看多或看空。下一步要补证据，而不是继续讲故事。情景分析不是修辞，而是目前概括公开证据最诚实的方式。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
