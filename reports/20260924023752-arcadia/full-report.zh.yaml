        - label: 核心分析引擎
          detail: 费率模拟、负荷预测、异常检测
          tone: neutral
          modules:
            - Signal
            - Switch
          outputs:
            - 模型测算成本
        - label: 标准化数据底座
          detail: 账单、时段读数、费率、场站属性
          tone: neutral
          modules:
