  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 展示 Arcadia 在人工流程、单点工具和综合企业能源管理套件之间的定位。
    data:
      xAxis:
        label: 工作流广度 / 交付覆盖（0-10 序数）
      yAxis:
        label: 数据控制壁垒（0-10 序数）
      points:
        - label: Arcadia
          x: 8
          'y': 8
          detail: 整合账单支付、能源采购、可持续发展报告和数据基础。
          tone: positive
        - label: UtilityAPI
          x: 4
          'y': 8
          detail: 数据接入能力突出，但掌握的工作流范围较窄。
          tone: positive
        - label: EnergyCAP
          x: 7
          'y': 6
          detail: 公用事业账单管理积累深厚，客户切换成本高。
          tone: neutral
        - label: Watershed
          x: 6
          'y': 5
          detail: 报告工具较强，但留存资料显示其公用事业运营能力较浅。
          tone: neutral
        - label: LevelTen
          x: 7
          'y': 4
          detail: 市场平台和交易基础设施较强，但并非综合能源运营平台。
          tone: warning
        - label: Ameresco
          x: 9
          'y': 3
          detail: 服务覆盖面广，但缺少类似纯软件的数据壁垒证据。
          tone: warning
