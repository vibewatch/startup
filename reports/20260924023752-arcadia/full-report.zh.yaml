            title: 客户广度显而易见，但耐久性尚未确证
            body: Arcadia 有明确的企业客户信号，但公开资料尚未证明留存、客户集中度或账户扩张质量。公司仍有需求和市场活动；没有非公开数据，现有证据还不足以确认客户关系稳固。
