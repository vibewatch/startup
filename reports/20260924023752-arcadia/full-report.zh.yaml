        - id: deploy
          label: 方案部署
          detail: 部署 Arcadia 工作流并接通客户系统
        - id: prove
          label: 市场佐证
          detail: 行业会议、招聘和业务规模指标
        - id: expand
          label: 拓展深化
          detail: 增加场站、模块和用户
        - id: gap
          label: 核心缺口
