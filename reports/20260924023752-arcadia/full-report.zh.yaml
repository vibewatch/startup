            body: >-
              Kiran Bhatraju 仍是创始人兼 CEO。公司当前公开的领导团队还包括 Paige Janson、Erica Borggren、Udit Garg、Paul Mulé 和 Nicholas
              Mack；对外形象仍由创始人领衔，但不再只有他一人。治理信息仍然有限：公开资料没有完整的董事履历或委员会架构。虽然管理团队比早期 Arcadia Power 阶段更完整，关键人物依赖仍是需要核查的实际风险。
