  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块图谱
        blocks:
          - type: paragraph
            body: >-
              Arcadia 对外展示的是一组企业工作流，而不是单一 SKU。官网称客户可在一个平台上支付公用事业账单、采购能源并推进可持续发展；AI 安全页面则把公司描述为 AI
              驱动的数据与企业安全平台。产品涵盖账单管理、资费分析、数据标准化、能源采购咨询和可持续发展报告。更新后的材料仍把 Arcadia
              放在客户日常运营流程中，而非定位为独立仪表盘；从产品覆盖看，它更像能源决策的运营层，而不是单点工具。
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
      - number: '5.2'
        title: 工作流、系统集成与运行架构
        blocks:
          - type: paragraph
            body: >-
              整体架构像一条企业数据管道：接入账户凭证和供应商数据，统一账单与资费格式，再做分析，最后经 API、仪表盘或下游系统交付。公开材料提到数据采集、AI 辅助标准化，以及 API
              集成和运营工作流等交付方式。自动化能减少人工处理，但 Arcadia 也因此依赖公用事业供应商的访问权限、数据质量和集成稳定性。它本质上承担运营工作，不只是软件界面。
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
      - number: '5.3'
        title: 信任体系、安全保障与路线图信号
        blocks:
          - type: paragraph
            body: >-
              Arcadia 在 AI 安全页面把信任作为产品卖点，强调加密、最小权限和客户数据安全控制。招聘与营销页面显示，公司仍在补充 GTM
              和产品营销能力；会议及客户资料也显示产品和市场活动仍在推进。不过，具体发布节奏、正常运行时间和集成成本都不透明。因此，架构方向值得肯定，但可靠性证据仍不足。搜索结果还混有其他 Arcadia
              品牌，核验资料时必须排除同名干扰；判断技术栈，来源可信度和软件质量都重要。
