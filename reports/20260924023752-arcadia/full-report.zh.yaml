        title: 图表与表格
        blocks:
          - type: callout
            title: 市场体量庞大，但收入转化问题仍悬而未决
            body: Arcadia 公布的运营规模足以说明市场真实且有分量；关键仍是公司能否把这些业务量转成稳定的经常性收入，并保住利润率。
            calloutType: insight
