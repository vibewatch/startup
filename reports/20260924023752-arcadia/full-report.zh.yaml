  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 融资历程与资本基础
        blocks:
          - type: paragraph
            body: >-
              融资记录显示 Arcadia 多年来筹得了可观资金。公司 2022 年新闻稿称，J.P. Morgan Asset Management 领投了 $200 million 融资；Latitude
              后来报道了追加增长融资和 $30 million 信贷额度。FundedIQ 与 Nasdaq Private Market 仍把 Arcadia
              列为拟上市（pre-IPO）私营公司。此次更新因此强化了其资本基础可观的判断，但股权、债务、老股流动性和契约安排的具体构成仍不清楚。外部信息支持融资规模不小，却不能替代对具体条款的核实。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI011
              - CI013
      - number: '4.2'
        title: 收入模式、变现机制与定价
        blocks:
          - type: paragraph
            body: >-
              Arcadia 最可能通过企业软件、托管服务和咨询变现，并以公用事业数据和工作流产品为基础。公司没有公开价目表；企业软件通常按客户需求定价，但外界因此无法判断收入构成和毛利率。GetLatka
              等数据库给出的收入、估值都只是估算，不能替代审计披露。目前较稳妥的判断是，Arcadia 收费解决复杂运营问题，而非销售低价标准品；收入质量仍待核实。若服务占比高，营收增长也可能伴随软件利润率承压。
            claimRefs:
              - CI005
              - CI006
              - CI007
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI010
              - CI013
      - number: '4.3'
        title: 单客经济模型与披露缺口
        blocks:
          - type: paragraph
            body: >-
              单客经济仍是最关键的尽调缺口。留存资料没有披露收入、毛利率、净收入留存率（NRR）或客户集中度，因此估值仍要依赖管理层披露或数据室信息。Arcadia
              公布的运营规模说明业务体量不小，却不能说明公司把这些活动转成经常性利润的效率。资本筹集看得见，变现质量看不见，所以本次更新后的财务判断仍只能定性；没有更多数据，增长故事也无法充分承保。网上还有其他 Arcadia
              品牌，资料去重本身也增加了核验成本。
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
