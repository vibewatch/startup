figures:
  - id: FO001
    title: Arcadia 公司关键里程碑时间线
    type: timeline
    summary: 梳理 Arcadia 从早期 Arcadia Power 定位转向大型企业能源管理平台的过程。
    data:
      items:
        - date: '2014'
          label: 公司成立
          detail: Arcadia 由 Kiran Bhatraju 在 Washington, DC 创立。
          tone: positive
        - date: 2022-05
          label: Series E 轮
          detail: $200M 融资由 J.P. Morgan Asset Management 领投。
          tone: positive
        - date: 2024-01
          label: 新一轮融资 / 信贷额度
          detail: Latitude 报道 Arcadia 获得追加增长融资和一笔信贷额度。
          tone: positive
        - date: 2025-01
          label: 发力企业级方案
