companyProfile:
  summary: >-
    Arcadia 从 Arcadia Power 的社区太阳能业务起步，如今已转向覆盖面更广的企业能源智能平台。公司目前主打一个统一系统，承接公用事业数据、账单支付、能源采购和可持续发展工作；收购 Genability、Urjanet
    与 ENGIE Impact 也扩充了平台能力。
  foundedDate: '2014-01-01'
  founders:
    - name: Kiran Bhatraju
      role: 创始人兼 CEO
      background: 创始人持续担任公司的公开代表与战略核心。
      claimRefs: []
  foundingLocation: Washington, DC
  headquarters: Washington, DC
  productSummary: 接入公用事业账单和用电间隔数据、解析资费、分析太阳能与储能、自动管理公用事业账单，并提供能源采购咨询和可持续发展报告集成。
  customerFocus: Fortune 2000 和其他多地点企业；也服务于将 Arcadia 数据嵌入产品的软件、EV、太阳能及能源服务提供商。
  businessModel: 销售企业软件，并围绕公用事业数据、账单管理、采购和报告提供托管服务与咨询。
  stage: Late-stage private
  fundingStatus: 获成长型股权资本支持的私营公司，已披露 2021-2024 年融资；2026 年收购 ENGIE Impact 后，平台进一步扩大。
  disclosureProfile: private-undisclosed
