  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 买方画像与使用者分布
        blocks:
          - type: paragraph
            body: >-
              Arcadia 的公开客户画像指向 Fortune 2000
              企业和其他多地点组织。这些客户管理大量公用事业账户，关注成本、风险和报告质量。潜在买方包括财务、采购、设施和可持续发展负责人，运营与数据团队则可能是使用者或审批方。官网和会议材料还显示，软件、EV、太阳能及能源服务提供商也会使用其数据；不过，付费决策者仍更可能是大型企业职能团队，而非小团队管理员。
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
      - number: '6.2'
        title: 采纳进展、增长动能与客户佐证
        blocks:
          - type: paragraph
            body: >-
              本次更新没有提供留存率或客户队列数据，但能看到客户活动仍在继续。Aggregate 2026 让 Arcadia 呈现出客户社群活动的氛围，招聘信息也显示公司仍在投入商业拓展和产品传播。这些迹象支持
              Arcadia
              仍在拓展企业客户，却无法证明客户持续使用或留存质量。公开证据只能说明业务仍有动静，不能证明增长引擎足够持久；客户信号目前也主要是方向性的。活跃的客户叙事是增长尽调的起点，还不是客户账户经济性稳固的证明。
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
