  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状
        blocks:
          - type: paragraph
            body: >-
              Arcadia
              横跨公用事业账单管理、能源采购、可持续发展报告和企业数据集成。它的市场不是泛指清洁科技软件，而是企业管理数百个公用事业账户、跨多个市场运营时产生的支出与流程负担——尤其是财务和可持续发展团队仍靠电子表格协作的场景。官网把产品概括为一个支付账单、采购能源、推进可持续发展的统一平台。客户真正的替代选择因此是人工后台流程、经纪商、公用事业门户和零散工具，而非某个显而易见的
              SaaS 对手。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 买方客群、驱动因素与制约条件
        blocks:
          - type: paragraph
            body: >-
              可能的买方包括 CFO、采购、设施、可持续发展和运营负责人，IT 与数据团队通常是次要审批方。Arcadia 提及 Fortune 2000
              客户和数百个地点，反映出大型客户在规模化运营中要同时管控成本、风险和报告质量。能源价格波动、报告要求日益复杂，以及 AI
              自动化进入重复、规则明确的工作，都在推动需求。采用障碍则包括切换成本、数据质量、集成工作量，以及企业在问题尚未严重时仍愿意沿用人工流程。此次更新也显示，Arcadia 还在把市场需求转成可复制的 GTM
              模式，品牌本身尚不足以带动增长。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: 市场测算视角与采纳尽调
        blocks:
          - type: paragraph
            body: >-
              现有资料没有公开分析师报告，测算市场更适合先看 Arcadia 自报的运营规模：每年处理 $30 billion 公用事业付款、管理 $100 billion 公用事业支出，服务 1,500+ 家企业客户并管理
              4.5 million 只电表。这些指标说明可服务的业务基础不小，却不等于收入机会：部分金额只是代付或运营流水，并非软件收入。尽调真正要回答的不是市场存不存在，而是其中多少运营量能转成持续的软件、服务和咨询收入。
