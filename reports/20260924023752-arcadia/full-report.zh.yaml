chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、平台与商业模式
        blocks:
          - type: paragraph
            body: >-
              Arcadia 将自己定位为面向企业的能源智能平台：客户可在一个平台上支付公用事业账单、采购能源并推进可持续发展。当前 About 页面延续这一定位，并列出三项企业解决方案：公用事业账单管理（Utility
              Bill Management）、能源采购咨询（Energy Procurement Advisory）和可持续发展报告（Sustainability Reporting）。2026 年主页还突出统一数据、AI
              分析和专家咨询。如今公司的叙事已从面向消费者的清洁能源应用转向企业工作流，覆盖账单支付、能源采购和报告；2026 年更新的公开材料也进一步强调 AI 分析与企业咨询。Arcadia
              卖的不只是能源数据，而是一套工作流平台。
            claimRefs:
              - CO001
              - CO004
              - CO009
