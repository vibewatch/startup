- calloutType: risk
  title: Customer breadth is visible, but durability is not
  body: Arcadia clearly has enterprise customer signal, but the public record does not yet prove retention, concentration, or account expansion quality. The best reading is that the company still has live demand and public motion, but the evidence remains too thin to turn that into durable-account conviction without private data.
