company:
  name: Arcadia
chapter:
  number: 6
  title: Customers
  summary: Arcadia's customer base still looks like large, multi-site enterprises that are willing to buy operational relief around utility bills, energy procurement, and sustainability reporting. The refresh confirms the company is still marketing to finance, operations, and sustainability leaders, and that the public proof surface is active enough to show conferences, hiring, and partner motion. The main open questions remain concentration, retention, and how much of the public customer story is current versus legacy.
sections:
- id: customer-segmentation
  title: Who Buys and Who Uses the Product
  body: Arcadia's public customer story points to Fortune 2000-type enterprises and other multi-site organizations that run a lot of utility accounts and care about cost, risk, and reporting integrity. The likely buyer set includes finance, procurement, facilities, and sustainability leaders, while operations and data teams act as users or approvers. The company's website and conference materials suggest the use case is broad enough to include software, EV, solar, and energy-service partners, but the economic buyer still looks like a large enterprise function rather than a small-team admin.
  claimRefs:
  - CU001
  - CU002
  - CU003
  tableRefs:
  - TU001
- id: adoption-proof
  title: Adoption, Growth, and Customer Proof
  body: The refresh does not surface hard retention or cohort data, but it does show public evidence of ongoing customer motion. Aggregate 2026 gives Arcadia a customer-community feel, and hiring pages still suggest active commercial and product-messaging investment. That is enough to support the idea that the company is still trying to expand the enterprise base, but not enough to prove repeat usage quality. In other words, the public proof says the company is active; it does not yet say the customer engine is unquestionably durable. The customer signal therefore looks active, even if it is still mostly directional instead of measured. That distinction matters because a live customer narrative is necessary for growth diligence, but it is still a step away from showing sticky account economics.
  claimRefs:
  - CU004
  - CU005
  - CU006
  - CU007
  tableRefs:
  - TU002
- id: concentration-risks
  title: Concentration, Expansion, and Diligence Gaps
  body: 'The biggest customer diligence gaps are concentration, retention, and the mix of legacy versus current accounts. Arcadia does not publish customer concentration, cohort retention, or repeat-purchase statistics, so we still cannot tell how sticky the enterprise relationships are. The public record is also noisy: unrelated Arcadia-branded websites and data-breach pages show up in search, which makes customer discovery harder than it should be. That means the customer thesis is positive on breadth, but still incomplete on durability. That combination makes the customer thesis credible but still not fully bankable.'
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU011
  tableRefs:
  - TU003
  figureRefs:
  - FU001
