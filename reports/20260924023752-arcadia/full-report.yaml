  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The public legal surface is still the most obvious diligence risk. Arcadia's historical
              utility-authorization questions were serious enough to merit regulatory attention, and the retained record
              still does not show a clean, widely public resolution. That matters because the business sits close to
              regulated energy and payment workflows, where even a modest compliance question can become a
              customer-procurement problem. The safest reading is that the company can operate at scale, but the public
              evidence does not yet fully clear the legal overhang. It is a manageable issue only if private diligence
              confirms the current operating posture and any prior docket ended cleanly. The public record also
              indicates why compliance questions can linger well after a financing event, because enterprise buyers hate
              ambiguity. The same is true for enterprise trust: buyers want certainty before they buy mission-critical
              workflow software.
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR008
              - CR011
      - number: '7.2'
        title: Operational and security fragility
        blocks:
          - type: paragraph
            body: >-
              The platform risk surface is operational as much as legal. Arcadia depends on utility-credential
              automation, connector maintenance, data normalization, and a cloud stack that must stay available for bill
              ingestion and workflow execution. The AI-security and workflow-integration materials show the company
              knows this, but they also confirm the underlying complexity. If connectors fail, credentials drift, or
              downstream systems change behavior, the product can degrade quickly even without a headline incident. That
              makes operational resilience a first-order diligence topic, not a back-office footnote. That kind of
              fragility is costly because it is not visible until a utility portal or identity policy changes. The
              result is a product that can look simple in marketing but remains structurally complex in execution.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
              - CR010
      - number: '7.3'
        title: Partner and integration risk
        blocks:
          - type: paragraph
            body: >-
              Arcadia also depends on a broad partner ecosystem. Enterprise customers, procurement channels, cloud
              infrastructure, and reporting integrations all amplify distribution, but they also add friction if any one
              layer breaks. The ENGIE-style integration story makes that dependency more important, not less, because
              scale gains can arrive alongside process overlap and customer confusion. The company looks like it has
              enough operating maturity to manage the stack, but the public record still does not quantify how resilient
              the stack actually is under stress. A conservative investor should treat integration as a value creation
              lever only after it proves it can stay invisible to customers. Even if the integration story is strategic,
              the diligence bar stays high because customers ultimately judge uptime, billing accuracy, and change
              management. A buyer reading the public record should treat every integration promise as a claim that still
              needs proof.
            claimRefs:
              - CR008
              - CR009
              - CR010
