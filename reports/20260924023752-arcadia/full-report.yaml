  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Why a clean price call is still impossible
        blocks:
          - type: paragraph
            body: >-
              Arcadia's public materials create a strong strategic story, but they do not create a clean valuation
              anchor. The company talks like a scaled enterprise platform, yet the retained sources still do not publish
              current revenue, ARR, margin, retention, or customer concentration. That means any price view has to start
              with what is missing, not with a confident multiple. In practice, the right output is a diligence posture,
              not a precise markdown or uplift. The public story helps explain why investors care, but it does not give
              a defensible denominator. The missing denominator is the core issue, because without it the market can
              only debate quality in the abstract. The missing denominator is the core issue, because without it the
              market can only debate quality in the abstract.
            claimRefs:
              - CV001
              - CV002
              - CV003
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV012
      - number: '8.2'
        title: Comparable set and market context
        blocks:
          - type: paragraph
            body: >-
              The best public comparables are imperfect but still useful. They show that energy, utility, and
              infrastructure software names generally trade on modest revenue multiples unless they have unusually clean
              software economics or a strong growth narrative. Arcadia could justify a premium if it proves
              software-like margins and retention, but the public record does not let us assume that today. The
              conservative view is that the subject needs private-diligence support before the market can price it like
              a software asset. Any comparison that ignores the denominator gap would overstate confidence. If those
              assumptions fail, the upside case collapses into a plain mixed-model services narrative. If those
              assumptions fail, the upside case collapses into a plain mixed-model services narrative.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: Scenario framing
        blocks:
          - type: paragraph
            body: >-
              The right way to think about Arcadia is scenario-based. In a bull case, the company looks like a durable
              enterprise workflow platform with stickier economics than the current public record reveals. In a base
              case, it remains strategically attractive but still mixed between software and services. In a bear case,
              the company is valuable but priced too richly for the amount of public evidence actually available. That
              makes the immediate valuation stance unknown rather than bullish or bearish, and it makes the next
              diligence step about proof, not narrative. In other words, the scenario frame is not a rhetorical
              flourish; it is the only honest way to summarize the current public evidence. In other words, the scenario
              frame is not a rhetorical flourish; it is the only honest way to summarize the current public evidence.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
