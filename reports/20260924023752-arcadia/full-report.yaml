      - number: '6.2'
        title: Adoption, Growth, and Customer Proof
        blocks:
          - type: paragraph
            body: >-
              The refresh does not surface hard retention or cohort data, but it does show public evidence of ongoing
              customer motion. Aggregate 2026 gives Arcadia a customer-community feel, and hiring pages still suggest
              active commercial and product-messaging investment. That is enough to support the idea that the company is
              still trying to expand the enterprise base, but not enough to prove repeat usage quality. In other words,
              the public proof says the company is active; it does not yet say the customer engine is unquestionably
              durable. The customer signal therefore looks active, even if it is still mostly directional instead of
              measured. That distinction matters because a live customer narrative is necessary for growth diligence,
              but it is still a step away from showing sticky account economics.
            claimRefs:
              - CU004
              - CU005
