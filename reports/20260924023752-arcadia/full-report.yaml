      - number: '4.3'
        title: Unit Economics and Disclosure Gaps
        blocks:
          - type: paragraph
            body: >-
              The hard diligence gap is still unit economics. Revenue, gross margin, net revenue retention, and customer
              concentration are not public in the retained bundle, so any valuation work must rely on management
              disclosure or a data room. Arcadia's large public operating numbers make the business look important, but
              they do not tell us how efficiently the company converts activity into recurring profit. That is why the
              financial view remains qualitative even after this refresh: capital formation is visible, but monetization
              quality is not. Without that disclosure, even a strong growth story remains only partially underwritten.
              Even the outside noise around other Arcadia-branded companies shows how much cleanup a diligence pass must
              do before numbers are trustworthy.
            claimRefs:
              - CI008
