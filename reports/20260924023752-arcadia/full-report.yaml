  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Financing Chronology and Capital Base
        blocks:
          - type: paragraph
            body: >-
              The public financing trail still shows a company that has raised meaningful capital over several years.
              Arcadia's own 2022 press release announced a $200 million round led by J.P. Morgan Asset Management, and
              Latitude later described additional growth financing plus a $30 million credit facility. FundedIQ and
              Nasdaq Private Market still treat the company as a private pre-IPO asset rather than a public or lightly
              financed startup. The refresh therefore points to a business with a substantial capital base, but the
              exact mix of equity, debt, secondary liquidity, and covenant structure remains only partly visible. That
              external signal makes the capital story look real even if the precise terms remain private. That external
              signal makes the capital story look real even if the precise terms remain private and messy.
