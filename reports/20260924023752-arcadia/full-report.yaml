        title: Trust, Security, and Roadmap Signals
        blocks:
          - type: paragraph
            body: >-
              The AI-security page makes trust a core part of the product pitch: Arcadia emphasizes encryption,
              least-privilege access, and security controls around customer data. Public hiring and marketing pages
              suggest the team is still investing in GTM and product-marketing capacity, while the conference and
              customer-facing materials show active roadmap motion. That said, exact release cadence, uptime, and
              integration economics remain opaque. The technical verdict is therefore positive on architecture direction
              but still cautious on hard reliability evidence. The search environment is noisier than usual because
              unrelated Arcadia-branded pages are easy to confuse with the enterprise-energy company. That is a real
              diligence problem because confidence in the stack depends on source hygiene as well as software quality.
