        title: Concentration, Expansion, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The biggest customer diligence gaps are concentration, retention, and the mix of legacy versus current
              accounts. Arcadia does not publish customer concentration, cohort retention, or repeat-purchase
              statistics, so we still cannot tell how sticky the enterprise relationships are. The public record is also
              noisy: unrelated Arcadia-branded websites and data-breach pages show up in search, which makes customer
              discovery harder than it should be. That means the customer thesis is positive on breadth, but still
              incomplete on durability. That combination makes the customer thesis credible but still not fully
              bankable.
