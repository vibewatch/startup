      - number: '5.2'
        title: Workflow, Integrations, and Operating Architecture
        blocks:
          - type: paragraph
            body: >-
              The architecture looks like a classic enterprise data pipeline: access credentials and provider data come
              in, bills and tariffs are normalized, analytics are applied, and outputs go to APIs, dashboards, or
              downstream systems. Public material points to data capture, AI-assisted standardization, and multiple
              delivery surfaces such as API-style integrations and operational workflows. That architecture is useful
              because it can reduce manual effort, but it also means Arcadia depends on utility-provider access, data
              quality, and integration reliability. The product is therefore more operational than a simple software
              front end.
            claimRefs:
              - CE004
              - CE005
