  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              Arcadia's current public product story is a bundle of enterprise workflows rather than a single SKU. The
              homepage and about page describe one place to pay utility bills, buy energy, and advance sustainability,
              while the AI-security page frames the company as an AI-powered data and enterprise-security platform. In
              practice, that means the product stack spans utility bill management, tariff intelligence, data
              normalization, energy procurement advisory, and sustainability reporting. The refresh suggests the company
              is still selling a platform that sits inside the customer's operating workflow, not a standalone
              dashboard. That breadth is what makes the company feel more like an operating layer for energy decisions
              than a point product.
            claimRefs:
