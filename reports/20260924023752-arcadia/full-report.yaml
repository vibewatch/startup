        title: Revenue Model, Monetization, and Pricing
        blocks:
          - type: paragraph
            body: >-
              The most plausible monetization stack is enterprise software plus managed services and advisory revenue,
              layered on top of utility-data and workflow products. The company does not publish a list price or public
              rate card, which is normal for an enterprise workflow seller but still leaves outsiders guessing about mix
              and gross margin. External databases such as GetLatka offer revenue and valuation estimates, but those are
              not substitutes for audited disclosures. The best public conclusion is that Arcadia monetizes complexity,
              not a low-cost commodity product, and that revenue quality still needs verification. That matters because
              a services-heavy mix can look like growth while still depressing software-style margins.
            claimRefs:
              - CI005
