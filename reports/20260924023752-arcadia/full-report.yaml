  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who Buys and Who Uses the Product
        blocks:
          - type: paragraph
            body: >-
              Arcadia's public customer story points to Fortune 2000-type enterprises and other multi-site organizations
              that run a lot of utility accounts and care about cost, risk, and reporting integrity. The likely buyer
              set includes finance, procurement, facilities, and sustainability leaders, while operations and data teams
              act as users or approvers. The company's website and conference materials suggest the use case is broad
              enough to include software, EV, solar, and energy-service partners, but the economic buyer still looks
              like a large enterprise function rather than a small-team admin.
            claimRefs:
              - CU001
