  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status Quo
        blocks:
          - type: paragraph
            body: >-
              Arcadia sits at the intersection of utility bill management, energy procurement, sustainability reporting,
              and enterprise data integration. The practical market boundary is not generic clean-tech software; it is
              the spend and workflow burden created when a company runs hundreds of utility accounts, multiple markets,
              and a finance or sustainability stack that still depends on spreadsheets. The current site explicitly
              frames the product around one place to pay utility bills, buy energy, and advance sustainability. That
              means the main substitutes are manual back-office workflows, brokers, utility portals, and fragmented
              point tools rather than a single obvious SaaS rival.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Buyer Segments, Drivers, and Constraints
        blocks:
          - type: paragraph
            body: >-
              The likely buyer set is a blend of CFO, procurement, facilities, sustainability, and operations leaders,
              with IT and data teams as secondary approvers. Arcadia's own language about Fortune 2000 customers and
              hundreds of locations points to a pain profile where the buyer cares about cost, risk, and reporting
              integrity at scale. Market growth is driven by energy-price volatility, more complicated reporting
              requirements, and the rise of AI-assisted automation for highly repetitive, rules-based work. The main
              adoption constraints are switching costs, data cleanliness, integration effort, and the fact that many
              enterprises still tolerate manual process until the pain is material. The refresh also suggests Arcadia is
              still trying to turn that demand into repeatable GTM motion, rather than relying on brand alone.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: Sizing Lenses and Adoption Diligence
        blocks:
          - type: paragraph
            body: >-
              Without a public analyst report in the current cache, the best sizing lens is to triangulate from
              Arcadia's own claimed operating volume: $30 billion in annual utility payments processed, $100 billion in
              utility spend under management, 1,500+ enterprise customers, and 4.5 million meters. Those metrics imply a
              large serviceable base, but they are not the same as revenue opportunity, because some of the spend is
              pass-through or operational volume rather than software revenue. The diligence question is therefore not
              whether the market exists; it is how much of the operational spend can be monetized as recurring software,
              services, and advisory fees.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is large, but the revenue conversion question remains open
            body: >-
              Arcadia has enough public operating volume to argue that the market is real and meaningful. The diligence
              problem is whether the company can convert that volume into durable recurring revenue and retained margin.
            calloutType: insight
            claimRefs:
              - CM008
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct, Adjacent, and Substitute Competitors
        blocks:
          - type: paragraph
            body: >-
              Arcadia's actual competitive set is broad. The most immediate substitute is still manual operations:
              spreadsheets, utility portals, brokers, and a finance team that stitches together billing and reporting by
              hand. Adjacent competitors include point data providers, energy-service firms, private-market platforms
              that talk up pre-IPO comparables, and broader enterprise energy software vendors. In public sources,
              Arcadia differentiates by promising one workflow that spans bill management, energy buying, and
              sustainability reporting, which is broader than a pure utility-data API and more operational than a simple
              dashboard.
            claimRefs:
              - CP001
              - CP002
              - CP003
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: Feature Breadth and Packaging
        blocks:
          - type: paragraph
            body: >-
              The public site makes Arcadia look like a bundled platform rather than a single-product vendor. That is
              strategically helpful because it can increase attach rates and switching costs, but it also makes the
              product harder to compare against focused rivals. The practical packaging story is that Arcadia can sell
              data, bill management, procurement advisory, and sustainability reporting as one operating system for
              energy decisions. The competitive tradeoff is that the company must defend breadth, integration depth, and
              service quality at once, instead of just winning on one feature axis. The refresh also shows that Arcadia
              is trying to buy mindshare with breadth, which is strategically useful but raises the burden of proof on
              each individual module.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.3'
        title: Moat Durability and Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              Arcadia's moat appears to come from data coverage, workflow integration, and customer embedment rather
              than from a single proprietary algorithm. The company claims 1,500+ enterprise customers, 4.5M meters, and
              very large utility-volume metrics, which are the right ingredients for a platform moat if the customer
              relationship is sticky. The risk is that public financials remain opaque, so outsiders cannot tell how
              much of the volume is software revenue versus service throughput. That makes the moat harder to value,
              even if the strategic position is still attractive. That matters because a competitor with a
              single-function wedge can still be easier to explain, buy, and replace.
            claimRefs:
