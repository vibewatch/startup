- id: FR001
  title: Risk Exposure Matrix
  type: matrix
  summary: Public-evidence matrix showing where legal, operational, and partner risk cluster.
  data:
    columns:
    - Risk domain
    - Current signal
    - Residual exposure
    rows:
    - label: Regulatory / legal
      values:
      - Historical regulator questions and brand ambiguity
      - High until the docket trail is closed
      - Adds procurement friction and legal review
    - label: Operational
      values:
      - Credential automation and connector maintenance
      - High because workflows depend on many external rails
      - Failure can interrupt bill ingestion and reporting
    - label: Partner / integration
      values:
      - Enterprise integrations and ecosystem scale
      - Medium-high because partner churn or overlap can hurt service quality
      - Integration work can outlast the marketing story
    - label: Compliance controls
      values:
      - Security page and workflow docs exist
      - Moderate because controls are described, not audited
      - Need DPA, audit, and incident evidence
    - label: Customer trust
      values:
      - Enterprise messaging and active community motion
      - Moderate because proof is mostly directional
      - Need SLA and contract detail
    - label: Partner concentration
      values:
      - Cloud and ecosystem dependencies remain broad
      - Medium-high because several rails matter at once
      - Need redundancy and fallback evidence
