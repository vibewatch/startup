- id: TR003
  title: Risk diligence checklist
  columns:
  - diligence item
  - why it matters
  - ask
  rows:
  - - Regulatory resolution trail
    - Confirms whether the legacy legal overhang is closed
    - Request the complete docket history and final resolution.
  - - Connector stability
    - Shows whether workflow fragility is operationally manageable
    - Ask for incident counts, recoveries, and connector uptime.
  - - Customer-contract protections
    - Shows how much risk is pushed onto customers
    - Review SLAs, service credits, and any liability caps.
  notes: These are the top diligence asks that fall directly out of the public risk picture.
  enumerationScope:
    coverage: partial
    basis: The checklist captures the highest-priority diligence asks implied by the retained public evidence and not every possible operational question.
