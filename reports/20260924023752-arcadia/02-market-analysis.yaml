company:
  name: Arcadia
chapter:
  number: 2
  title: Market Analysis
  summary: 'Arcadia sells into a broad but operationally specific market: enterprise energy management for multi-site businesses that need utility-data ingestion, bill payment, energy procurement, and sustainability reporting. The public evidence suggests the buyer is typically a finance, procurement, operations, or sustainability leader at a Fortune 2000-type company, and the adoption trigger is usually volatility, reporting burden, or manual process pain. The market is large enough for a scaled platform, but public evidence still constrains precise TAM/SAM/SOM estimates because most of the company''s useful volume metrics are Arcadia''s own claims rather than independently audited industry numbers.'
sections:
- id: market-boundary
  title: Market Boundary and Status Quo
  body: Arcadia sits at the intersection of utility bill management, energy procurement, sustainability reporting, and enterprise data integration. The practical market boundary is not generic clean-tech software; it is the spend and workflow burden created when a company runs hundreds of utility accounts, multiple markets, and a finance or sustainability stack that still depends on spreadsheets. The current site explicitly frames the product around one place to pay utility bills, buy energy, and advance sustainability. That means the main substitutes are manual back-office workflows, brokers, utility portals, and fragmented point tools rather than a single obvious SaaS rival.
  claimRefs:
  - CM001
  - CM002
  - CM003
  tableRefs:
  - TM001
  figureRefs: []
- id: buyers-drivers
  title: Buyer Segments, Drivers, and Constraints
  body: The likely buyer set is a blend of CFO, procurement, facilities, sustainability, and operations leaders, with IT and data teams as secondary approvers. Arcadia's own language about Fortune 2000 customers and hundreds of locations points to a pain profile where the buyer cares about cost, risk, and reporting integrity at scale. Market growth is driven by energy-price volatility, more complicated reporting requirements, and the rise of AI-assisted automation for highly repetitive, rules-based work. The main adoption constraints are switching costs, data cleanliness, integration effort, and the fact that many enterprises still tolerate manual process until the pain is material. The refresh also suggests Arcadia is still trying to turn that demand into repeatable GTM motion, rather than relying on brand alone.
  claimRefs:
  - CM004
  - CM005
  - CM006
  - CM007
  tableRefs:
  - TM002
  figureRefs: []
- id: sizing-lenses
  title: Sizing Lenses and Adoption Diligence
  body: 'Without a public analyst report in the current cache, the best sizing lens is to triangulate from Arcadia''s own claimed operating volume: $30 billion in annual utility payments processed, $100 billion in utility spend under management, 1,500+ enterprise customers, and 4.5 million meters. Those metrics imply a large serviceable base, but they are not the same as revenue opportunity, because some of the spend is pass-through or operational volume rather than software revenue. The diligence question is therefore not whether the market exists; it is how much of the operational spend can be monetized as recurring software, services, and advisory fees.'
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM011
  tableRefs:
