    - Too many modules without enough depth
    - Public sources emphasize breadth
    - Measure module adoption and retention
  - - Data risk
    - Coverage gaps or stale utility data
    - AI/security page focuses on validation
    - Ask for coverage / quality metrics
  - - Economic risk
    - Service-heavy revenue diluting software margin
    - Public revenue not disclosed
    - Ask for margin bridge
  - - Switching risk
    - Customers can revert to manual/broker workflows
    - Market still has many substitutes
    - Ask for cohort retention
  notes: The moat is real but not fully legible without private-company financial disclosure.
