company:
  name: Kraken Technologies
chapter:
  number: 1
  title: Company Overview
  summary: >
    Kraken is a late-stage private utility-software company moving from Octopus
    Energy incubation to standalone governance after a December 2025 transaction
    valued it at $8.65 billion. Public evidence is strongest on platform scale,
    contracted annual revenue, and named investors, but it does not establish
    standalone recognized revenue, margins, total headcount, or a definitive
    post-separation control map.
sections:
  - id: identity-and-scale
    title: Identity, product, and operating scale
    body: >
      Kraken began inside Octopus Energy in 2017 and now describes itself as an
      operating system for utility operations, headquartered in London and New
      York. The late-2025 evidence set consistently places the platform at more
      than 70 million contracted household and business accounts, while Kraken
      reported more than $500 million of contracted annual revenue and more than
      15 billion new data points processed per day. Those are meaningful scale
      indicators, but their labels matter: accounts are not unique customers,
      contracted annual revenue is not audited recognized revenue or cash, and
      the data-point count does not itself demonstrate customer value. The
      resulting profile is infrastructure-scale enterprise software with limited
      public disclosure of standalone economics.
    claimRefs: [CO001, CO002, CO006, CO007, CO008]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and separation
    body: >
      Amir Orad leads Kraken as chief executive, and the September 2025 spin-off
      announcement added Tim Wan as chief financial officer after his tenure at
      Asana. The appointment strengthened finance and listing experience shortly
      before the standalone transaction. Kraken subsequently said the demerger
      would produce a separate cap table, independent governance, and independent
      leadership. That statement is directionally important but not equivalent
      to documentary proof of completed separation. In January 2026, Watt-Logic
      reported that public filings still appeared inconsistent with the announced
      economic split and said the picture remained unusually ambiguous. Until
      executed shareholder, board-rights, and intercompany documents are reviewed,
      Octopus remains a material related-party dependency as former parent,
      residual owner, customer, and innovation partner.
    claimRefs: [CO003, CO004, CO005, CO013, CO014]
    tableRefs: [TO002]
  - id: funding-and-ownership
    title: Funding, valuation, and stakeholder map
    body: >
      The December 2025 transaction is the clearest valuation anchor. Kraken and
      independent reporting describe roughly $1 billion of Kraken equity acquired
      in a D1 Capital Partners-led round at an $8.65 billion valuation, with
      Fidelity International, Durable Capital Partners, and Ontario Teachers'
      Venture Growth also named. The proceeds require careful interpretation:
      Kraken's release said the equity acquisition would fund both Octopus and
      Kraken, while the BBC reported that the majority would go to Octopus and
      Kraken would receive the remainder. Funding raised therefore cannot be
      treated as cash available to Kraken. Octopus was expected to retain 13.7%,
      leaving its reserved rights and commercial arrangements central to control
      and conflict analysis.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO015]
    tableRefs: [TO003]
  - id: milestones-and-diligence
    title: Milestones, disclosure quality, and diligence priorities
    body: >
      Kraken's public chronology shows a long incubation followed by a compressed
      separation: introduction within Octopus in 2017, a formal spin-off
      announcement in September 2025, and a valuation-setting transaction in
      December 2025. The scale and financing claims are repeated by independent
      outlets, but most operating metrics still originate with Kraken. Built In's
      September 2026 AI-generated candidate summary made the same limitation
      explicit, noting limited independent validation of leadership claims and
      growth durability. The next diligence step is therefore not another broad
      scale claim; it is primary documentation that reconciles contracted revenue
      to recognized revenue, maps customer concentration and retention, confirms
      total standalone headcount, and proves the post-spin cap table and
      related-party protections.
    claimRefs: [CO001, CO003, CO006, CO007, CO009, CO010, CO014, CO015, CO016]
    figureRefs: [FO001]
