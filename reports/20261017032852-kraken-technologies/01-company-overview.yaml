callouts:
  - calloutType: strength
    title: Scale is already infrastructure-like
    body: >
      More than 70 million contracted accounts and more than $500 million of
      contracted annual revenue place Kraken beyond an early venture profile,
      although neither metric substitutes for audited standalone economics.
    claimRefs: [CO006, CO007]
  - calloutType: risk
    title: Separation is announced more clearly than it is documented
    body: >
      Kraken promises independent governance and a separate cap table, while the
      assigned adverse analysis found the public ownership record difficult to
      reconcile. Executed transaction and related-party documents are required.
    claimRefs: [CO013, CO014, CO015]
