  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Retail energy suppliers
        - Enterprise utility transformation team
        - Customer operations, billing, and service teams
        - Utility operating company
        - End-to-end account management and tariff servicing
        - CIO / customer-operations leadership (inferred)
        - Replace fragmented legacy billing and service stacks
      - - Large incumbent utility migrations
        - Program sponsor for whole-platform migration
        - Migration, meter, and operations teams
        - Utility operating company
        - Multi-million-account platform migration
        - Transformation office and operations leadership (inferred)
        - Scale customer migration without custom rebuilds
      - - Water utilities
        - Utility digital-services team
        - Customer-service and billing teams
        - Water utility enterprise budget
        - Utility account servicing and workflow modernization
        - CIO / shared-services budget (inferred)
        - Reuse utility-grade operating stack outside energy
      - - Telecom / broadband utilities
        - Telecom service-platform owner
        - Subscriber billing and customer-support teams
        - Telecom / ISP operating budget
        - Recurring-service billing and support workflows
        - Digital operations budget (inferred)
        - Apply utility-style workflow automation to adjacent recurring services
    notes: >-
      Buyer, user, payer, and budget-owner labels combine named customer types
      with product-scope inference; public sources identify customer classes but
      do not disclose exact procurement committees or pricing owners.
    claimRefs: [CM005, CM006, CM007]
figures:
  - id: FM001
    title: Evidence-constrained market adoption stack
    type: pyramid
    summary: >-
      Public evidence supports a large installed base and broad buyer footprint,
      but the layers are adoption proxies rather than a mathematically linked
      TAM/SAM/SOM cascade.
    data:
      items:
        - label: Platform-wide contracted accounts
          displayValue: 70M+
          value: 70
          unit: million accounts
          note: BBC and WSJ both describe the spin-out footprint at more than 70 million accounts.
          tone: positive
        - label: Utility providers on the platform
          displayValue: 40+
          value: 40
          unit: providers
          note: The August 2026 tear sheet and SiliconANGLE cite more than 40 utility providers.
          tone: positive
        - label: Countries served
          displayValue: 27
          value: 27
          unit: countries
          note: Public summaries place Kraken across 27 countries.
          tone: positive
        - label: Octopus platform accounts
          displayValue: 12.9M
          value: 12.9
          unit: million accounts
          note: Wikipedia says Kraken handled Octopus Energy's 12.9 million gas and electricity accounts in 2025.
          tone: neutral
        - label: Octopus retail households
          displayValue: 7.7M
          value: 7.7
          unit: million households
          note: BBC says Octopus became the UK's largest supplier serving 7.7 million households.
          tone: neutral
        - label: Largest named migration cited
          displayValue: 5.8M
          value: 5.8
          unit: million accounts
          note: The tear sheet says Kraken completed EDF Energy's 5.8 million-account migration in 15 months.
          tone: positive
    approximationNotes: >-
      The layers are ordered as adoption evidence, not as proportional shares
      of one common denominator; units vary across accounts, households,
      providers, and countries, so the figure is a market-footprint stack, not
      a derived funnel or spend bridge.
    claimRefs: [CM003, CM004, CM006, CM013]
callouts:
  - calloutType: strength
    title: Installed-base evidence is unusually strong for a private utility-software asset
    body: >-
      More than 70 million managed accounts, 40-plus utility providers, and
      named incumbent customers imply Kraken is selling into enterprise-scale
      utility operating budgets rather than proving demand on small pilots.
    claimRefs: [CM003, CM004, CM006]
  - calloutType: risk
    title: Public evidence supports traction, but not a full market-sizing bridge
    body: >-
      The retained sources show account scale, ARR, and customer footprint, yet
      they do not disclose TAM / SAM / SOM methodology, module pricing, or
      customer-segment mix, which limits how confidently valuation can be tied
      to market share rather than headline adoption.
    claimRefs: [CM010, CM012, CM013]
