    title: Market definition table
    columns:
      - Segment / category
      - Included spend / workflow
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - Retail energy supplier operating software
        - Billing, CRM, meter data, tariff operations, and customer-service automation
        - Commodity procurement, generation ownership, and retail margin economics
        - Utility operating company
        - Core market evidenced by Octopus, EDF, E.ON, and Origin-linked use cases
      - - Grid / flexibility and distributed-energy orchestration
        - Device coordination, virtual power plant, network tooling, and asset optimization
        - Physical generation capex and network construction
        - Utility or network operator
        - Expands Kraken beyond billing into system-operations budgets
      - - Water utility software
        - Customer management and utility workflow modernization
        - Treatment-plant capex and pipe-network construction
        - Water utility enterprise budget
        - Demonstrates adjacent-vertical portability beyond energy supply
      - - Telecom / broadband utility software
        - Subscriber billing and customer-service workflow software
        - Network build-out and spectrum / access infrastructure
        - Telecom / ISP operating budget
        - Shows Kraken pursuing recurring utility-like service operators outside energy
    notes: >-
      Market boundary is synthesized from source-backed product scope and cited
      verticals; buyer / payer labels are enterprise-level because public
      sources do not disclose named budget owners.
    claimRefs: [CM001, CM002, CM005, CM006]
