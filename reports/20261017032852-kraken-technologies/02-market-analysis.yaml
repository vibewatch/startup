  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: A public TAM, SAM, or SOM bridge by geography, utility segment, and module.
      whyItMatters: Without a spend-based bridge, valuation can only be tied to adoption proxies rather than measurable market share.
      diligencePath: Obtain management or banker materials showing segment revenue assumptions, account density, and price-per-account or price-per-module logic.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: buyer-profile
      missingEvidence: Named procurement owners, contract structures, and budget holders by customer segment.
      whyItMatters: Budget ownership and contract terms determine sales-cycle length, expansion logic, and renewal risk.
      diligencePath: Request customer case studies, procurement references, or pipeline materials that identify the buyer committee and pricing model.
      relatedQuestionRefs: [QM003]
      relatedTableRefs: [TM003]
    - type: conflicting-data
      severity: material
      topic: governance
      missingEvidence: Definitive post-spin shareholder and intercompany-agreement disclosures reconciling market commentary with Companies House timing.
      whyItMatters: Governance clarity affects whether rival utilities view Kraken as a neutral platform and whether Octopus-related economics distort standalone market adoption.
      diligencePath: Reconcile post-spin cap-table, PSC filings, and intercompany agreements with management before relying on neutrality as a sales catalyst.
      relatedQuestionRefs: [QM004, QM006]
