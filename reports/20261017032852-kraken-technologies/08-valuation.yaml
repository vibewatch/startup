  evidenceGaps:
    - type: missing-source
      severity: material
      topic: revenue-quality
      missingEvidence: Audited standalone ARR or recognized revenue bridge, gross margin, retention, and customer concentration disclosures for Kraken itself.
      whyItMatters: The current financing mark cannot be underwritten like software equity without evidence on revenue quality and durability.
      diligencePath: Request audited standalone financials plus cohort, renewal, and attach-rate detail from management or existing investors.
      relatedQuestionRefs: [QV003, QV006]
    - type: private-evidence-only
      severity: material
      topic: capital-structure-gap
      missingEvidence: Full post-spinout cap table, liquidation preferences, debt, and any intercompany obligations or service agreements with Octopus.
      whyItMatters: Entry discipline and downside protection depend on who gets paid first and what liabilities remain with Kraken after separation.
      diligencePath: Obtain the post-close capitalization table, shareholder rights summary, and intercompany agreement package during diligence.
      relatedQuestionRefs: [QV002, QV007]
    - type: missing-source
      severity: material
      topic: commercialization
      missingEvidence: Independent customer-level evidence on renewals, module attach rates, and non-Octopus win rates after the spinout.
      whyItMatters: The upside case depends on independence turning into broader demand and durable pricing power, not just narrative relief.
      diligencePath: Ask for cohort renewals, pipeline conversion by utility, and post-spinout customer wins outside Octopus-linked relationships.
      relatedQuestionRefs: [QV004, QV008]
