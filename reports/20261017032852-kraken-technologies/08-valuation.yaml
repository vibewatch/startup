schemaVersion: "report-v2"
artifact: valuation
slug: kraken-technologies
runDate: 2026-10-17
company:
  name: Kraken Technologies
chapter:
  number: 8
  title: Valuation
  summary: >-
    Kraken's disclosed $8.65 billion financing mark is credible as a live
    private-market datapoint because multiple independent outlets agree on the
    round size, ownership split, and large installed-base narrative. It is not
    enough for a buy call on public evidence alone, because standalone
    disclosure still does not bridge quoted recurring revenue to audited
    margins, retention, concentration, or post-spinout capital structure.
    The evidence-backed stance is track, with medium confidence and high risk.
sections:
  - id: recommendation
    title: Recommendation and entry discipline
    body: >-
      The current public record supports a track posture rather than a buy.
      Multiple independent reports agree that Kraken's standalone financing
      fixed an $8.65 billion mark and that the business is already operating at
      large scale, but those same materials stop short of giving investors a
      clean standalone underwriting package. Public sources cite more than 70
      million accounts and more than $500 million of recurring or contracted
      revenue, yet they do not bridge those scale signals to audited margins,
      retention, customer concentration, or downside protection terms. That
      makes the financing mark usable as an anchor, but not enough to claim a
      clear public margin of safety at the current price.
    claimRefs: [CV001, CV005, CV007, CV013, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: public-mark-context
    title: What the current mark proves and what it does not
    body: >-
      The current mark proves investor appetite and separation momentum more
      than fully disclosed software economics. Public reporting says Octopus
      will keep a 13.7% stake, Origin will own 22.7%, and most of the $1
      billion investment goes to Octopus rather than staying inside Kraken.
      That structure matters for entry discipline: the round validates demand
      for the asset, but it does not by itself prove how much cash, leverage,
      preference stack, or related-party complexity will sit with Kraken after
      the demerger. Disclosure drift also remains visible because Octopus's own
      group page still cites only more than 50 million accounts while later
      independent articles cite more than 70 million.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV015]
    tableRefs: [TV002]
  - id: scenarios
    title: Bull, base, and bear framing
    body: >-
      The bull case is that independence removes a real commercial constraint,
      Kraken converts its installed base and utility-specific product advantage
      into broader sales, and management backs the private mark with cleaner
      standalone disclosure before any IPO process. The base case is more
      modest: the company completes the spinout and keeps growing, but the
      market still has to rely on a financing mark and selective revenue
      headlines. The bear case is that elevated pre-spinout expectations,
      group-level stress signals, and missing downside-protection disclosure
      combine to make the current mark look full or to force a less favorable
      follow-on round.
    claimRefs: [CV008, CV009, CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
  - id: exit-readiness
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      IPO optionality is plausible, but not yet underwritten. BBC reporting
      quotes management saying a listing has "every chance" in the medium term,
      and the spinout is framed for completion by mid-2026, but buyers still
      need the materials that would turn ambition into readiness: audited
      standalone revenue and gross margin, retention and concentration detail, a
      full post-spinout cap table with preferences and debt, and the exact
      intercompany agreements that remain with Octopus. Thesis-break triggers
      are straightforward: delayed separation, weaker-than-expected independent
      commercial wins, a downward reset in the recurring-revenue narrative, or
      fresh group-level regulatory or balance-sheet stress that contaminates the
      separation story.
    claimRefs: [CV004, CV009, CV010, CV011, CV013, CV015]
tables:
  - id: TV001
    title: Recommendation summary table
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - ["Recommendation", "Track", "Stay engaged but do not underwrite a buy from public evidence alone."]
      - ["Confidence", "Medium", "Independent reports agree on valuation and scale, but the standalone disclosure pack is still incomplete."]
      - ["Risk rating", "High", "Separation execution, disclosure gaps, and related-party overhang can move the outcome materially."]
      - ["Valuation stance", "Fair", "The $8.65 billion round is a credible anchor, but not obvious upside without new proof."]
      - ["What moves the call", "Standalone disclosure or a cheaper entry", "Upgrade only if Kraken publishes cleaner unit-economics and capital-structure evidence or if price resets lower."]
    notes: >-
      Mixes sourced facts with analyst judgment; the recommendation is anchored
      on the disclosed financing mark and public disclosure gaps rather than on
      a full standalone model.
    claimRefs: [CV001, CV005, CV007, CV010, CV013, CV015]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Evidence, What would change the view]
    rows:
      - ["Thesis: real scale proof exists", "Independent reports cite more than 70 million accounts and more than 40 utility providers across 27 countries", "Audited standalone gross margin and retention could justify higher confidence in software-quality economics."]
      - ["Thesis: spinout can unlock demand", "Multiple sources say independence should help Kraken sell to utilities that were wary of buying from an Octopus-owned platform", "Early post-spinout wins with rival utilities would strengthen pricing-power and TAM assumptions."]
      - ["Anti-thesis: the revenue-quality bridge is still weak", "Public sources disagree between ARR and contracted annual revenue and do not disclose concentration or renewal detail", "A detailed audited bridge from contracts to recognized revenue and retention would reduce the discount."]
      - ["Anti-thesis: the private mark may already be full", "The round is a minority-stake financing mark and most of the new money reportedly goes to Octopus while public cap-table protections remain undisclosed", "A lower entry price or transparent post-spinout capital structure would improve downside protection."]
    notes: >-
      Evidence column summarizes the cited claims; null economics and missing
      cap-table detail are treated as diligence gaps, not as hidden positives.
    claimRefs: [CV001, CV004, CV007, CV008, CV009, CV013, CV014, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Case, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - ["Bull", "Spinout completes on time and Kraken publishes cleaner standalone metrics while expanding beyond Octopus-linked buyers", "Public investors can underwrite a premium to the current mark only if software-quality economics become explicit", "Execution risk shifts from disclosure to scaling", "Needs independent customer wins plus better reporting before the market should pay up."]
      - ["Base", "Separation completes and growth continues but disclosure remains selective", "The current $8.65 billion mark stays the practical anchor and returns depend on execution catching up to narrative", "Limited visibility on retention, margins, and preference stack keeps conviction capped", "Most consistent with the current evidence set."]
      - ["Bear", "Separation slips or public metrics fail to convert into durable standalone economics", "The present mark proves too full and a later round or IPO window demands a lower clearing price", "Group-level stress, related-party complexity, or weak non-Octopus demand can compress appetite", "Supported by the absence of downside-protection disclosure and group overhang signals."]
    notes: >-
      Scenarios are qualitative bands anchored on the disclosed $8.65 billion
      financing mark because the reviewed public evidence does not support a
      tighter intrinsic range.
    claimRefs: [CV001, CV008, CV009, CV010, CV011, CV013, CV015]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The logic chain runs from a credible financing mark and large installed
      base through disclosure and overhang risks to a track recommendation.
    data:
      nodes:
        - id: financing-mark
          label: Financing mark
          note: "$8.65bn valuation from the standalone round"
        - id: scale-proof
          label: Scale proof
          note: ">70m accounts and >$500m recurring or contracted revenue cited"
        - id: independence-unlock
          label: Independence unlock
          note: "Spinout aims to remove competitor conflict in utility sales"
        - id: disclosure-gap
          label: Disclosure gap
          note: "No audited bridge for margins, retention, concentration, or cap table"
        - id: risk-overhang
          label: Risk overhang
          note: "Retained stakes, most proceeds to Octopus, and group-level stress matter"
        - id: recommendation
          label: Recommendation
          note: "Track at current public evidence and price support"
      edges:
        - from: financing-mark
          to: scale-proof
          label: confirms demand
        - from: scale-proof
          to: independence-unlock
          label: supports upside case
        - from: independence-unlock
          to: disclosure-gap
          label: still needs proof
        - from: disclosure-gap
          to: risk-overhang
          label: caps conviction
        - from: risk-overhang
          to: recommendation
          label: leads to
    approximationNotes: >-
      Flow summarizes the chapter's evidence-backed decision path rather than a
      mathematically modeled valuation bridge.
    claimRefs: [CV001, CV005, CV007, CV009, CV010, CV013, CV015]
callouts:
  - calloutType: recommendation
    title: Track until standalone disclosure catches up to the financing mark
    body: >-
      Kraken looks investable enough to monitor closely, but public evidence
      still lacks the standalone reporting needed to justify paying up from the
      current private valuation anchor.
    claimRefs: [CV001, CV007, CV013, CV015]
