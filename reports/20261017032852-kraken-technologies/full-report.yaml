  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Publicly evidenced layers suggest a utility-specific operating stack that runs from customer operations to
      flexibility orchestration, with governance separation becoming part of the product-sales story post-spinout.
    data:
      layers:
        - label: Customer & billing workflows
          detail: AI-based service, billing, and self-service functions used by utility operators.
          modules:
            - Customer service automation
            - Billing operations
            - Self-service workflows
          outputs:
            - Account servicing at scale
            - Lower manual workload
        - label: Product and tariff operations
          detail: Utilities use the platform to launch and adapt products and services faster.
          modules:
            - Offer / tariff configuration
            - Workflow automation
          outputs:
            - Faster product iteration
        - label: Field operations
          detail: Kraken Field extends the platform into installation and service-job scheduling.
          modules:
            - Automated scheduling
            - Routing support
          outputs:
            - 98% of jobs scheduled automatically in cited Octopus case study
        - label: Flexibility & device orchestration
          detail: The retained evidence describes VPP and peak-shifting controls across connected devices.
          modules:
            - Demand flexibility
            - Device orchestration
          outputs:
            - '>500,000 connected devices'
            - 2 GW orchestrated power
        - label: Data & AI core
          detail: Utility-grade AI and large daily data throughput are presented as common infrastructure.
          modules:
            - 15 billion new data points a day
            - Continuous deployments
          outputs:
            - Cross-workflow automation
        - label: Governance boundary
          detail: Separate governance and cap table are part of the post-spinout architecture for customer trust.
          outputs:
            - Independent governance
            - Octopus remains a 13.7% shareholder and key customer
    approximationNotes: >-
      The stack summarizes public descriptions rather than a disclosed system diagram; it should be read as an
      evidence-backed operating model, not a full technical blueprint.
