              - CI004
              - CI005
              - CI013
          - type: callout
            title: Capital headline overstates cash available to Kraken
            body: >-
              The headline $1 billion equity round is not the same as $1 billion of cash for Kraken because BBC says
              most of the proceeds go to Octopus, leaving Kraken's standalone runway and use-of-funds unresolved.
            calloutType: risk
            claimRefs:
              - CI002
              - CI008
