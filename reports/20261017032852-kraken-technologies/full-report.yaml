  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary is utility operating software, with real adjacent-vertical expansion
        blocks:
          - type: paragraph
            body: >-
              The consistent boundary in public sources is a utility operating system rather than a narrow chatbot or
              billing point solution. BBC and SiliconANGLE both describe Kraken as AI software that automates customer
              service and billing for utility companies, while the August 2026 tear sheet adds meter data management,
              field operations, distributed-energy orchestration, and asset optimization. That scope matters because it
              shifts the relevant market away from retail-energy supply economics and toward enterprise operating
              software sold into large regulated or infrastructure-heavy service providers. Wikipedia and the tear sheet
              also show Kraken already extending into water and broadband/telecom utilities, so adjacent spend is real,
              but public evidence still centers on utility workflow modernization rather than a fully generalized
              horizontal SaaS platform.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
      - number: '2.2'
        title: Public market sizing is adoption-led, not TAM-led
        blocks:
          - type: paragraph
            body: >-
              The best supported sizing lenses are operating footprint and software traction rather than a formal spend
              model. WSJ, BBC, SiliconANGLE, the investor tear sheet, and TradingView/Invezz all point to a business
              that had crossed more than 70 million customer accounts by the spin-out, was used by more than 40 utility
              providers across 27 countries, and had ARR above $500 million with rapid recent growth. Those datapoints
              are strong evidence that utility software can become a large revenue pool when a vendor wins
              whole-platform migrations, but they are still not a public TAM/SAM/SOM methodology. There is no disclosed
              spend bridge by geography, module, or account type, and no externally supported conversion from installed
              accounts into software wallet share, so this chapter treats market size as an evidence-constrained
              adoption stack instead of a precision market model.
            claimRefs:
              - CM003
              - CM004
              - CM009
              - CM012
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
