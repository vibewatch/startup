      - number: '3.2'
        title: The spinout improves neutrality, but parent gravity still matters
        blocks:
          - type: paragraph
            body: >-
              The strategic logic of the spinout is clear in the retained sources: Kraken's main commercial objection
              was not whether it had enough product, but whether rival utilities would trust a platform that still lived
              inside Octopus. Skadden says the round paves the way for formal independence and a separate capital and
              governance structure, while the BBC reports Kraken had previously struggled to do business with Octopus's
              rivals. That should widen the addressable customer base. But the separation is not total economic
              detachment. TradingView reports Octopus will still own 13.7% after separation, while Origin will hold
              22.7%. For utilities with strict data-ringfencing or competitive-neutrality requirements, that residual
              ownership context remains part of diligence rather than something the spinout erases in one step.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP009
      - number: '3.3'
        title: Breadth is Kraken's moat; modularity is the clearest counter-position
        blocks:
          - type: paragraph
            body: >-
              Public sources consistently describe Kraken as broader than a billing tool. BBC and Octopus position it
              around customer service and billing automation, and Octopus's own description emphasizes an
              energy-specific cloud architecture rather than a generic enterprise wrapper. Computing adds a commercial
              proof point—$500 million of contracted annual revenue at spinout time—that supports the idea that buyers
              are paying for a broad operating layer, not a single feature. The substitute argument is narrower and
              practical: Tridens markets billing, revenue management, EV charging, and self-service modules as reasons
              to choose a more targeted stack instead of a full utility operating system. In other words, Kraken's
              strongest advantage is breadth, and its clearest vulnerability is that some customers may not want or pay
              for all of that breadth.
            claimRefs:
              - CP004
              - CP007
              - CP008
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP008
              - CP010
              - CP013
              - CP014
              - CP016
      - number: '3.4'
        title: Durability depends on repeatable wins outside flagship logos
        blocks:
          - type: paragraph
            body: >-
              Kraken looks advantaged when a buyer wants one vendor that can span customer operations, billing, and
              utility-specific workflows, but the field is not closed. The retained independent comparison names Kaluza
              as the closest UK peer and cites a large ENGIE deployment, which means sophisticated buyers still have at
              least one purpose-built alternative. The same pool also shows that Kraken started as an internal platform
              before it was commercialized, which makes internal build a credible substitute at the very top end of the
              market even if current economics are undisclosed. Finally, Tridens' competitor-authored critique surfaces
              the classic displacement vectors: integration effort, affordability for smaller utilities, dependence on
              partner ecosystems, and service responsiveness. Public price transparency is still too weak to settle the
              argument, so moat durability rests more on deployment outcomes and switching friction than on any
              published list-price advantage.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Neutrality unlock is the most important competitive change
            body: >-
              Kraken's product breadth was already established before the demerger; the strategic change is that formal
              independence removes the most obvious reason a rival utility would hesitate to buy from it.
            calloutType: insight
            claimRefs:
              - CP002
              - CP003
              - CP009
          - type: callout
            title: Buyers can compare packaging publicly, but not realized price
            body: >-
              Because retained public sources do not disclose list pricing, modular rivals can stay in the conversation
              by promising narrower scope and easier implementation without a clean public TCO benchmark.
            calloutType: risk
            claimRefs:
              - CP014
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and disclosure quality
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a utility-software licensing model rather than a commodity-retail energy revenue
              stream. Multiple independent outlets describe Kraken as selling cloud software to utilities, with scale
              expressed through customer-account migrations, utility client count, and contracted annual recurring
              revenue rather than recognized GAAP revenue. The best-disclosed commercial datapoints are more than 70
              million managed accounts, more than 40 utility-provider customers, and more than $500 million of
              contracted or annual recurring revenue disclosed around the spinout. That is enough to infer that
              monetization depends on enterprise platform licenses and large implementation programs, but not enough to
              separate recurring software revenue from migration, integration, or adjacent service revenue. Public
              sources also do not disclose realized pricing per account, module attach rates, renewal timing, or a
              bridge from contracted ARR to recognized revenue, so revenue quality remains a central diligence item
              rather than a closed question.
