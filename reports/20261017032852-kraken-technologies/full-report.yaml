chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating scale
        blocks:
          - type: paragraph
            body: >
              Kraken began inside Octopus Energy in 2017 and now describes itself as an operating system for utility
              operations, headquartered in London and New York. The late-2025 evidence set consistently places the
              platform at more than 70 million contracted household and business accounts, while Kraken reported more
              than $500 million of contracted annual revenue and more than 15 billion new data points processed per day.
              Those are meaningful scale indicators, but their labels matter: accounts are not unique customers,
              contracted annual revenue is not audited recognized revenue or cash, and the data-point count does not
              itself demonstrate customer value. The resulting profile is infrastructure-scale enterprise software with
              limited public disclosure of standalone economics.
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO008
