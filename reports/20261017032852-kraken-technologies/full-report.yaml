      - number: '5.3'
        title: Maturity, trust boundaries, and diligence risks
        blocks:
          - type: paragraph
            body: >-
              Kraken's product maturity looks strongest on commercial adoption and weakest on independently disclosed
              control detail. Multiple sources support large account scale and a blue-chip customer list, and the
              spinout is explicitly framed as a way to let Kraken sell more neutrally across utilities. That framing
              matters because the pre-spinout structure created a trust tension: competing utilities were being asked to
              buy core operating software from a vendor owned by a rival supplier. The demerger, separate governance,
              and independent cap table partially address that issue, but Octopus remains a shareholder, major customer,
              and innovation partner. Until Kraken discloses more on data segregation, security certifications, SLA
              performance, and module-level customer references, product underwriting still carries execution and trust
              risk.
            claimRefs:
