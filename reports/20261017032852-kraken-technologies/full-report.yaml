  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual severity clusters around incomplete separation, parent spillover, and operational controls that are not
      yet evidenced publicly.
    data:
      columns:
        - label: Likelihood
          note: Public-evidence estimate over the next 12-24 months
        - label: Impact
          note: Effect on underwriting if the risk materializes
        - label: Mitigation maturity
          note: How specific the retained mitigations are in public sources
      rows:
        - label: Separation / governance overhang
          note: Public sources describe intent and financing, not completed legal separation.
          values:
            - label: Medium
              tone: medium
              note: The process was underway, but completion is unverified at runDate.
            - label: High
              tone: high
              note: Failure would preserve customer-conflict and related-party concerns.
            - label: Early
              tone: high
              note: Mitigation is mostly management narrative rather than auditable contracts.
        - label: Parent balance-sheet spillover
          note: Octopus still matters as owner, customer, and recipient of most 2025 proceeds.
          values:
            - label: Medium
              tone: medium
              note: Risk depends on whether parent capital and regulatory issues persist.
            - label: High
              tone: high
              note: Parent stress could distort capital allocation or sale timing.
            - label: Partial
              tone: medium
              note: Funding improved liquidity, but latest compliance evidence is absent.
        - label: Utility-scale uptime / data failure
          note: Platform scope spans billing, customer engagement, and grid operations.
          values:
            - label: Medium
              tone: medium
              note: Large multi-client migrations make execution errors plausible.
            - label: High
              tone: high
              note: A material outage could affect several marquee customers at once.
            - label: Early
              tone: high
              note: No retained public source documents certifications or incident metrics.
        - label: Customer / investor concentration
          note: Public proof clusters around strategic investors and a few flagship utilities.
          values:
            - label: Medium
              tone: medium
              note: Long regulated sales cycles create renewal and onboarding timing risk.
            - label: Medium-High
              tone: high
              note: Delays can weaken both ARR conversion and IPO narrative.
            - label: Partial
              tone: medium
              note: Geographic breadth helps, but customer concentration is not quantified.
        - label: Capital-markets expectation
          note: The $8.65bn valuation and IPO talk create pressure for software-style execution.
          values:
            - label: Medium
              tone: medium
              note: Investor expectations are already elevated by the late-2025 round.
            - label: Medium
              tone: medium
              note: Missed milestones can compress valuation before disclosures deepen.
            - label: Partial
              tone: medium
              note: External capital helps, but governance and renewal evidence still lags.
        - label: Security / compliance disclosure gap
          note: Company materials emphasize cloud scale but not independently auditable controls.
          values:
            - label: Medium
              tone: medium
              note: Control weakness is plausible because public assurance evidence is absent.
            - label: High
              tone: high
              note: A material incident could damage utility trust and regulatory posture quickly.
            - label: Early
              tone: high
              note: No retained source documents certifications, incident metrics, or audit outcomes.
    claimRefs:
      - CR003
      - CR005
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The logic chain runs from a credible financing mark and large installed base through disclosure and overhang risks
      to a track recommendation.
    data:
      nodes:
        - id: financing-mark
          label: Financing mark
          note: $8.65bn valuation from the standalone round
        - id: scale-proof
          label: Scale proof
          note: '>70m accounts and >$500m recurring or contracted revenue cited'
        - id: independence-unlock
          label: Independence unlock
          note: Spinout aims to remove competitor conflict in utility sales
        - id: disclosure-gap
          label: Disclosure gap
          note: No audited bridge for margins, retention, concentration, or cap table
        - id: risk-overhang
          label: Risk overhang
          note: Retained stakes, most proceeds to Octopus, and group-level stress matter
        - id: recommendation
          label: Recommendation
          note: Track at current public evidence and price support
      edges:
        - from: financing-mark
          to: scale-proof
          label: confirms demand
        - from: scale-proof
          to: independence-unlock
          label: supports upside case
        - from: independence-unlock
          to: disclosure-gap
          label: still needs proof
        - from: disclosure-gap
          to: risk-overhang
          label: caps conviction
        - from: risk-overhang
          to: recommendation
          label: leads to
    approximationNotes: Flow summarizes the chapter's evidence-backed decision path rather than a mathematically modeled valuation bridge.
    claimRefs:
