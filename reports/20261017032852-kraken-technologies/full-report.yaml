      - number: '4.2'
        title: Unit economics and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The available unit-economics story is still proxy-based. Growth indicators are unusually strong for a
              vertical software asset: Silicon Republic reported that contracted revenue quadrupled in three years to
              $500 million of committed annual revenue, while Tekedia and TradingView cited Origin in saying contracted
              ARR more than doubled over the prior 18 months. Those disclosures, combined with scale claims of 70
              million-plus accounts and a target of 100 million accounts ahead of plan, imply strong enterprise demand
              and a large installed base over which product and hosting costs can be leveraged. But the public record
              still omits the underwriting metrics that matter most: gross margin, implementation margin, CAC, payback,
              sales-cycle length, NRR, churn, and customer concentration. The spinout also addresses a commercial
              friction point—utilities were hesitant to buy core software from a direct competitor—so the strategic case
              for better future sales efficiency is plausible even though no public source quantifies the uplift.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
