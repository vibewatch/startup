      - number: '1.3'
        title: Funding, valuation, and stakeholder map
        blocks:
          - type: paragraph
            body: >
              The December 2025 transaction is the clearest valuation anchor. Kraken and independent reporting describe
              roughly $1 billion of Kraken equity acquired in a D1 Capital Partners-led round at an $8.65 billion
              valuation, with Fidelity International, Durable Capital Partners, and Ontario Teachers' Venture Growth
              also named. The proceeds require careful interpretation: Kraken's release said the equity acquisition
              would fund both Octopus and Kraken, while the BBC reported that the majority would go to Octopus and
              Kraken would receive the remainder. Funding raised therefore cannot be treated as cash available to
              Kraken. Octopus was expected to retain 13.7%, leaving its reserved rights and commercial arrangements
              central to control and conflict analysis.
