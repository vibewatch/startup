              - CI008
              - CI012
              - CI013
      - number: '4.3'
        title: Capital adequacy, ownership, and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The December 2025 transaction improved strategic flexibility but did not fully answer Kraken's standalone
              capital needs. BBC reporting says the majority of the $1 billion investment goes to Octopus, with Kraken
              receiving the balance, so investors should not treat the headline funding amount as cash available
              entirely to the spinout. Post-separation, Octopus is expected to retain 13.7% of Kraken while Origin holds
              22.7%, preserving strategic ties but also leaving open questions about intercompany economics, transition
              services, and whether Octopus will remain a privileged customer or product-development partner.
              Parent-level context adds urgency: BBC said Octopus had not yet met Ofgem's financial resilience targets
              and reported a £260 million pre-tax loss on £13.7 billion of sales for the year to April 2025, while also
              saying the cash injection would almost double the group's balance sheet. That makes the spinout look
              financially constructive, but because no pooled source discloses Kraken's standalone cash balance, burn,
              capex, debt, or implementation working-capital needs, forward capital adequacy remains a diligence blocker
              rather than a validated strength.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI008
              - CI009
              - CI010
              - CI013
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Software-grade growth proxy, not software-grade disclosure
            body: >-
              Kraken has enough public signals to justify software-style growth attention—$8.65 billion valuation, $500
              million-plus ARR proxy, and 70 million-plus accounts—but not enough audited standalone disclosure to
              underwrite those multiples with confidence.
            calloutType: insight
            claimRefs:
