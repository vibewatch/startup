            title: Trust and control evidence still lags adoption evidence
            body: >-
              The spinout helps address competitive-customer concerns, but public diligence still lacks post-spinout
              detail on security controls, data segregation, uptime commitments, and module-level deployment depth.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer footprint and segment mix
        blocks:
          - type: paragraph
            body: >-
              Kraken's public customer footprint is clearly enterprise-utility led, not a consumer self-serve motion.
              Late-2025 independent coverage described more than 70 million customer accounts and more than 40 utility
              providers across 27 countries, while the live Octopus group page still highlights more than 50 million
              accounts via EDF Energy, Good Energy, E.ON energy, and Origin Energy. That mix suggests the platform wins
              large regulated operators where one contract can move millions of end-customer accounts at once. The same
              evidence also shows segment expansion beyond retail energy into adjacent utility workflows and some
              non-energy utility contexts, which broadens the addressable market but makes customer quality harder to
              compare across segments.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU007
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
              - CU008
              - CU009
              - CU012
              - CU013
              - CU014
      - number: '6.2'
        title: Adoption proof and deployment quality
        blocks:
          - type: paragraph
            body: >-
              Named proof is real but uneven. BBC and SiliconANGLE both name large utility customers such as EDF, E.On
              Next, National Grid US, and Tokyo Gas, while the official page and secondary sources add Origin, Good
              Energy, and broader utility references. The evidence is strongest for enterprise go-lives, migrations, or
              licensing relationships, not for a standardized proof standard across the whole base. TradingView also
              points to a newly signed major customer helping Kraken approach 100 million accounts, but the customer is
              unnamed and the assigned sources do not disclose whether the relationship is already fully live, how much
              ARR it represents, or which modules are deployed.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU008
              - CU011
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU008
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU008
              - CU013
              - CU014
      - number: '6.3'
        title: Durability, expansion and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The weakest part of the customer story is durability and concentration disclosure. None of the assigned
              sources publish NRR, GRR, churn, renewal timing, contract length, or module attach, so public readers can
              verify scale and logos but not whether the installed base expands efficiently once onboarded. Independence
              is also only partial: the spin-out is explicitly pitched as a way to sell more easily to Octopus rivals,
              yet Octopus remains a key partner and customer. Watt-Logic adds a more bearish lens, arguing Kraken is
              becoming central infrastructure inside UK billing and flexibility markets, which heightens ecosystem
              concentration risk if a few very large customer relationships dominate revenue and data flows.
            claimRefs:
              - CU006
              - CU007
              - CU009
              - CU010
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise adoption is credible, but proof is logo-heavy
            body: >-
              The assigned evidence supports real utility adoption at scale, but most proof is still logos plus
              account-count claims rather than standardized deployment-depth or outcome disclosure.
            calloutType: insight
            claimRefs:
              - CU002
              - CU003
              - CU014
          - type: callout
            title: Durability and concentration remain underwritten by private diligence
            body: >-
              Public readers can see scale and named customers, but not retention, customer concentration, or the share
              of commercial value tied to Octopus and other strategically linked accounts.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Carve-out status leaves governance risk unresolved
        blocks:
          - type: paragraph
            body: >-
              The retained pool establishes that Kraken's separation was announced in September 2025 and financially
              underpinned by a $1 billion December 2025 transaction, but it does not prove that the carve-out was fully
              completed by the 2026-10-17 run date. That matters because public sources frame the spin-off as a way to
              remove customer discomfort about buying critical utility software from an energy retailer that also
              competes with many of those customers. Even after separation, Octopus and Origin were expected to remain
              material shareholders, so the residual risk is not "will Kraken exist?" but whether board control,
              data-sharing rules, and related-party economics are documented tightly enough to convince enterprise
              buyers and later public-market investors that Kraken is not still managed for parent-company priorities.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR007
              - CR009
      - number: '7.2'
        title: Scale amplifies operating and control failures
        blocks:
          - type: paragraph
            body: >-
              Kraken's operating footprint is already large enough that execution mistakes would be expensive and
              visible. Company and independent sources place the platform above 70 million contracted accounts across 27
              countries, with deployments spanning billing, customer engagement, and operational workflows for
              utilities. That scale is a commercial asset, but it also means migration, uptime, model-quality, or
              data-governance failures could hit multiple utility clients at once and quickly undermine the
              "utility-grade" positioning used to justify software-style valuation expectations. The retained company
              pages describe cloud architecture, continuous deployments, and heavy data processing, yet they do not
              disclose public incident metrics, recovery objectives, or certifications, so operational resilience still
              needs direct diligence rather than assumption.
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR012
              - CR013
      - number: '7.3'
        title: Parent, investor, and flagship-customer dependencies still shape downside
        blocks:
          - type: paragraph
            body: >-
              Kraken is trying to become a clean enterprise-software story, but the retained evidence still shows
              meaningful dependence on Octopus, Origin, and a small set of marquee utilities. BBC reporting tied the
              transaction to Octopus's own balance sheet, noting that most of the cash would go to the parent and that
              Octopus had not yet met Ofgem's 2025 financial resilience targets. At the same time, public customer proof
              clusters around large utilities such as EDF, E.ON, National Grid US, Origin, and Tokyo Gas. Those
              relationships validate the product, yet they also imply concentration in long-cycle regulated accounts
              where delayed migrations, procurement pauses, or governance objections can slow both ARR conversion and
              the path to a future IPO.
            claimRefs:
              - CR003
              - CR007
              - CR008
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR007
              - CR008
              - CR010
              - CR011
      - number: '7.4'
        title: Mitigation maturity is improving, but the diligence gates are still open
        blocks:
          - type: paragraph
            body: >-
              The good news is that the 2025 transaction added external capital, widened the shareholder base, and
              explicitly repositioned Kraken as a standalone software company instead of an internal support arm. The
              bad news is that the disclosed mitigations are still mostly strategic statements rather than auditable
              control evidence. Before underwriting a materially lower risk rating, an investor should see proof that
              separation is complete, related-party contracts are arm's-length, parent regulatory issues no longer
              contaminate the software story, and Kraken can evidence renewal durability plus enterprise-grade security
              controls. Until those items are documented, the right posture is to treat governance separation, operating
              resilience, and concentration as live kill criteria rather than already-mitigated risks.
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR009
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR005
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Top underwriting blocker: unproven clean carve-out'
            body: >-
              The assigned pool proves financing and intent, but it does not yet prove a fully completed separation with
              disclosed intercompany terms, data barriers, and board independence. That keeps governance and
              enterprise-sales friction as live risks.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR009
          - type: callout
            title: Kill criteria before underwriting a lower risk rating
            body: >-
              Require evidence that Octopus is clear of the cited resilience issue, that Kraken's separation contracts
              are arm's-length, that security controls are externally auditable, and that renewal / concentration data
              supports the software-style valuation narrative.
            calloutType: recommendation
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The current public record supports a track posture rather than a buy. Multiple independent reports agree
              that Kraken's standalone financing fixed an $8.65 billion mark and that the business is already operating
              at large scale, but those same materials stop short of giving investors a clean standalone underwriting
              package. Public sources cite more than 70 million accounts and more than $500 million of recurring or
              contracted revenue, yet they do not bridge those scale signals to audited margins, retention, customer
              concentration, or downside protection terms. That makes the financing mark usable as an anchor, but not
              enough to claim a clear public margin of safety at the current price.
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV013
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV010
              - CV013
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV009
              - CV010
              - CV013
              - CV015
      - number: '8.2'
        title: What the current mark proves and what it does not
        blocks:
          - type: paragraph
            body: >-
              The current mark proves investor appetite and separation momentum more than fully disclosed software
              economics. Public reporting says Octopus will keep a 13.7% stake, Origin will own 22.7%, and most of the
              $1 billion investment goes to Octopus rather than staying inside Kraken. That structure matters for entry
              discipline: the round validates demand for the asset, but it does not by itself prove how much cash,
              leverage, preference stack, or related-party complexity will sit with Kraken after the demerger.
              Disclosure drift also remains visible because Octopus's own group page still cites only more than 50
              million accounts while later independent articles cite more than 70 million.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: Bull, base, and bear framing
        blocks:
          - type: paragraph
            body: >-
              The bull case is that independence removes a real commercial constraint, Kraken converts its installed
              base and utility-specific product advantage into broader sales, and management backs the private mark with
              cleaner standalone disclosure before any IPO process. The base case is more modest: the company completes
              the spinout and keeps growing, but the market still has to rely on a financing mark and selective revenue
              headlines. The bear case is that elevated pre-spinout expectations, group-level stress signals, and
              missing downside-protection disclosure combine to make the current mark look full or to force a less
              favorable follow-on round.
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              IPO optionality is plausible, but not yet underwritten. BBC reporting quotes management saying a listing
              has "every chance" in the medium term, and the spinout is framed for completion by mid-2026, but buyers
              still need the materials that would turn ambition into readiness: audited standalone revenue and gross
              margin, retention and concentration detail, a full post-spinout cap table with preferences and debt, and
              the exact intercompany agreements that remain with Octopus. Thesis-break triggers are straightforward:
              delayed separation, weaker-than-expected independent commercial wins, a downward reset in the
              recurring-revenue narrative, or fresh group-level regulatory or balance-sheet stress that contaminates the
              separation story.
            claimRefs:
              - CV004
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track until standalone disclosure catches up to the financing mark
            body: >-
              Kraken looks investable enough to monitor closely, but public evidence still lacks the standalone
              reporting needed to justify paying up from the current private valuation anchor.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV013
              - CV015
