      - number: '2.3'
        title: Buyers are large utilities, while independence and valuation shape adoption timing
        blocks:
          - type: paragraph
            body: >-
              The observable buyers are large utilities and adjacent infrastructure operators pursuing enterprise
              transformation rather than departmental tooling. Kraken's cited customer list includes EDF, E.ON, National
              Grid US, Origin-linked deployments, TalkTalk, Severn Trent, and Tokyo Gas, which implies sales into
              customer-operations, billing, field, and digital transformation workflows at incumbent-scale operators.
              Demand drivers are clear: utilities need to modernize legacy service stacks, manage complexity in
              distributed energy and flexible demand, and onboard large customer populations without rebuilding each
              workflow in-house. The main constraints are equally visible. Spin-out coverage explicitly says some rival
              utilities struggled to buy from a platform still owned by Octopus, Companies House filings show the
              control structure was still changing in mid-2026, and Watt-Logic argues the valuation already embeds
              software-like optimism that may outrun the public evidence on segment economics.
            claimRefs:
