        title: Operating model, architecture, and dependencies
        blocks:
          - type: paragraph
            body: >-
              The strongest architectural evidence is directional rather than fully technical. Official copy says Kraken
              runs on a scalable cloud architecture with continuous deployments; partner and news sources add
              utility-grade AI, high data throughput, and broad customer-account scale. Together that supports a layered
              view: customer and billing workflows on top, field and flexibility modules as operational extensions, and
              a shared data-and-automation core underneath. What is not public is equally important. The retained source
              set does not provide API-level documentation, implementation timelines by module, uptime commitments, or
              standalone security-certification detail after the spinout, so diligence still depends on management
