      - number: '1.4'
        title: Milestones, disclosure quality, and diligence priorities
        blocks:
          - type: paragraph
            body: >
              Kraken's public chronology shows a long incubation followed by a compressed separation: introduction
              within Octopus in 2017, a formal spin-off announcement in September 2025, and a valuation-setting
              transaction in December 2025. The scale and financing claims are repeated by independent outlets, but most
              operating metrics still originate with Kraken. Built In's September 2026 AI-generated candidate summary
              made the same limitation explicit, noting limited independent validation of leadership claims and growth
              durability. The next diligence step is therefore not another broad scale claim; it is primary
              documentation that reconciles contracted revenue to recognized revenue, maps customer concentration and
              retention, confirms total standalone headcount, and proves the post-spin cap table and related-party
              protections.
