  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The buyer's alternative set is broader than one direct peer
        blocks:
          - type: paragraph
            body: >-
              Kraken is competing across several solution classes, not just against one like-for-like utility-software
              peer. The retained sources support at least four practical alternatives for a buyer solving the same job:
              another purpose-built energy platform such as Kaluza; adjacent or modular specialists such as Tridens;
              incumbent enterprise suites from vendors such as Salesforce, Oracle, and SAP; and the status-quo path of
              extending an internally assembled stack. That matters because Kraken's public proof points set a high bar
              on scale, but alternatives do not need to match its full operating-system breadth to win a deal. A buyer
              can still substitute a narrower billing, CRM, EV, or flexibility layer when that route looks cheaper,
              easier to integrate, or more neutral.
            claimRefs:
