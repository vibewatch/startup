      - number: '1.2'
        title: Leadership, governance, and separation
        blocks:
          - type: paragraph
            body: >
              Amir Orad leads Kraken as chief executive, and the September 2025 spin-off announcement added Tim Wan as
              chief financial officer after his tenure at Asana. The appointment strengthened finance and listing
              experience shortly before the standalone transaction. Kraken subsequently said the demerger would produce
              a separate cap table, independent governance, and independent leadership. That statement is directionally
              important but not equivalent to documentary proof of completed separation. In January 2026, Watt-Logic
              reported that public filings still appeared inconsistent with the announced economic split and said the
              picture remained unusually ambiguous. Until executed shareholder, board-rights, and intercompany documents
              are reviewed, Octopus remains a material related-party dependency as former parent, residual owner,
              customer, and innovation partner.
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO013
              - CO014
