evidenceGaps:
  - type: missing-source
    severity: material
    topic: founding-and-governance
    missingEvidence: >-
      Primary incorporation records, a complete founding-team history, and a current post-spin board and committee
      roster.
    whyItMatters: >-
      The public record supports a 2017 introduction but does not establish complete founder attribution or governance
      accountability.
    diligencePath: >-
      Obtain the current Companies House record, incorporation documents, board register, committee charters, and
      founder equity history.
    relatedQuestionRefs:
      - QO001
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: standalone-economics
    missingEvidence: >-
      Audited standalone recognized revenue, ARR reconciliation, gross margin, retention, customer concentration, and
      module attach rates.
    whyItMatters: >-
      Contracted annual revenue and account scale do not establish software-quality margins, cash generation, or revenue
      durability.
    diligencePath: >-
      Request the financing data room and reconcile contracts to recognized revenue, cash collection, gross margin,
      retention, and concentration.
    relatedQuestionRefs:
      - QO004
      - QO007
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: governance-separation
    missingEvidence: >-
      Executed demerger documents, a definitive post-close cap table, shareholder rights, and Octopus-Kraken
      intercompany agreements.
    whyItMatters: >-
      Announced independent governance cannot resolve control, related-party economics, or data-ringfencing risk without
      documentary support.
    diligencePath: >-
      Review the signed transaction set, reserved matters, board rights, service agreements, data controls, and proceeds
      waterfall.
    relatedQuestionRefs:
      - QO003
      - QO006
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: workforce-and-footprint
    missingEvidence: A current standalone employee count by function and geography plus a legal-entity and office-location list.
    whyItMatters: >-
      Without a denominator, public scale claims cannot be translated into operating leverage or location-concentration
      analysis.
    diligencePath: >-
      Request the post-spin org chart, payroll headcount by geography, contractor count, and office and legal-entity
      schedule.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: A public TAM, SAM, or SOM bridge by geography, utility segment, and module.
    whyItMatters: Without a spend-based bridge, valuation can only be tied to adoption proxies rather than measurable market share.
    diligencePath: >-
      Obtain management or banker materials showing segment revenue assumptions, account density, and price-per-account
      or price-per-module logic.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-profile
    missingEvidence: Named procurement owners, contract structures, and budget holders by customer segment.
    whyItMatters: Budget ownership and contract terms determine sales-cycle length, expansion logic, and renewal risk.
    diligencePath: >-
      Request customer case studies, procurement references, or pipeline materials that identify the buyer committee and
      pricing model.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: governance
    missingEvidence: >-
      Definitive post-spin shareholder and intercompany-agreement disclosures reconciling market commentary with
      Companies House timing.
    whyItMatters: >-
      Governance clarity affects whether rival utilities view Kraken as a neutral platform and whether Octopus-related
      economics distort standalone market adoption.
    diligencePath: >-
      Reconcile post-spin cap-table, PSC filings, and intercompany agreements with management before relying on
      neutrality as a sales catalyst.
    relatedQuestionRefs:
      - QM004
      - QM006
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: List pricing, implementation fees, contract minima, discount bands, and realized pricing by customer size.
    whyItMatters: >-
      Without commercial schedules, investors cannot compare Kraken's true TCO against modular alternatives or
      incumbents.
    diligencePath: Request current pricing sheets, recent MSAs/SOWs, and three anonymized deal summaries split by customer segment.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: neutrality
    missingEvidence: Post-spinout win/loss data and customer references from utilities that directly compete with Octopus.
    whyItMatters: >-
      The central competitive thesis is that independence removes a sales objection; that needs proof in pipeline
      conversion, not just governance language.
    diligencePath: >-
      Request post-2025 pipeline conversion by prospect type and at least three reference calls with non-Octopus utility
      customers.
    relatedQuestionRefs:
      - QP002
      - QP006
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Migration duration, renewal rates, attach rates, and churn by cohort for Kraken deployments versus narrower
      substitutes.
    whyItMatters: Moat durability depends on switching friction and expansion economics, not just scale or valuation optics.
    diligencePath: >-
      Request cohort data for deployment size, time-to-go-live, renewal behavior, and module expansion from the customer
      base.
    relatedQuestionRefs:
      - QP003
      - QP007
  - type: missing-source
    severity: material
    topic: disclosure-gap
    missingEvidence: >-
      Audited standalone revenue recognition policy, revenue mix by software versus services, and a
