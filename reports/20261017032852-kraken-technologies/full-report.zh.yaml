chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与运营规模
        blocks:
          - type: paragraph
            body: >
              Kraken 于 2017 年在 Octopus Energy 内部起步，如今将自己定位为公用事业运营操作系统，总部位于伦敦和纽约。2025 年末的证据一贯显示，该平台拥有超过 7000
              万个家庭及企业合同账户；Kraken 同时报告合同年收入超过 $500 million，每天处理超过 150
              亿个新增数据点。这些都是有意义的规模指标，但标签很重要：账户不等于独立客户，合同年收入不等于经审计的确认收入或现金，数据点数量本身也不能证明客户价值。最终画像是基础设施级企业软件，但独立经济数据的公开披露有限。
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO008
