      - number: '4.2'
        title: 单位经济与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              现有单位经济故事仍基于代理指标。作为垂直软件资产，Kraken 的增长指标异常强劲：Silicon Republic 报道称，合同收入三年增长四倍，达到 $500 million 的承诺年收入；Tekedia 和
              TradingView 引述 Origin 称，合同 ARR 在此前 18 个月增长了一倍以上。结合超过 7000 万账户的规模说法，以及提前实现 1
              亿账户目标的计划，这说明企业需求强劲，且可在庞大装机基础上摊薄产品和托管成本。但公开记录仍缺少最重要的投资判断指标：毛利率、实施毛利率、CAC、回本期、销售周期、NRR、流失率和客户集中度。分拆还在解决一个商业摩擦点——公用事业公司曾不愿从直接竞争对手购买核心软件——因此未来销售效率提高的战略逻辑是可信的，尽管没有公开来源量化提升幅度。
