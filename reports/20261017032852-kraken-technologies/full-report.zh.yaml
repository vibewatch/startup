  - id: TV003
    title: 乐观／基准／悲观情景表
    columns:
      - 情景
      - 假设
      - 估值／回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 分拆按时完成，且 Kraken 发布更清晰的独立经营指标，同时拓展 Octopus 关联买家以外的客户
        - 只有在软件质量型经济性变得明确时，公开市场投资者才可能对当前估值给予溢价
        - 执行风险从信息披露转向规模化
        - 在市场应当愿意提高出价之前，需要独立客户胜利以及更好的报告。
      - - 基准
        - 分离完成，增长持续，但信息披露仍有选择性
        - 当前 86.5 亿美元估值仍是实际锚点，回报取决于执行能否追上叙事
        - 对留存率、利润率和优先股堆叠的可见性有限，使投资信心受限
        - 与当前证据集最为一致。
      - - 悲观
        - 分离延迟，或公开指标无法转化为持久的独立经营经济性
        - 当前估值证明过高，后续融资或 IPO 窗口要求更低的清算价格
        - 集团层面压力、关联方复杂性或对非 Octopus 需求疲弱，可能压缩市场兴趣
        - 由缺乏下行保护披露以及集团拖累信号所支持。
    notes: 由于审阅的公开证据不支持更窄的内在价值区间，情景采用定性区间，并以已披露的 86.5 亿美元融资估值为锚。
