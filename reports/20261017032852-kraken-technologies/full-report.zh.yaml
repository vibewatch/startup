      - number: '4.3'
        title: 资本充足性、所有权与投资判断障碍
        blocks:
          - type: paragraph
            body: >-
              2025 年 12 月的交易改善了战略灵活性，却没有完全回答 Kraken 的独立资本需求。BBC 报道称，$1 billion 投资的大部分流向 Octopus，Kraken 获得余额，因此投资者不应把
              headline 融资额视为分拆主体全部可用的现金。分拆后预计 Octopus 持有 Kraken 13.7%，Origin 持有 22.7%，这既保留战略联系，也留下关联方经济关系、过渡服务，以及
              Octopus 是否仍会是优先客户或产品开发伙伴等问题。母公司背景更增加了紧迫性：BBC 称，截至 2025 年 4 月的年度，Octopus 尚未达到 Ofgem 的财务韧性目标，并在 £13.7
              billion 销售额上录得 £260 million 税前亏损；同时报道现金注入将使集团资产负债表接近翻倍。分拆因此看似具有财务建设性，但由于来源池没有披露 Kraken
              的独立现金余额、烧钱、资本开支、债务或实施营运资金需求，未来资本充足性仍是尽调障碍，而非已验证优势。
