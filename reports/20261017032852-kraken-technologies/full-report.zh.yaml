        title: 里程碑、披露质量与尽调重点
        blocks:
          - type: paragraph
            body: >
              Kraken 的公开时间线显示，公司经历了漫长孵化后迅速分拆：2017 年在 Octopus 内部推出，2025 年 9 月正式宣布分拆，2025 年 12
              月完成确定估值的交易。独立媒体重复报道了规模和融资说法，但大多数运营指标仍来自 Kraken。Built In 在 2026 年 9 月生成的 AI
              候选摘要也明确指出了这一限制：管理层说法和增长持续性的独立验证有限。下一步尽调不应再追逐泛化的规模说法，而应获取一手文件，将合同收入与确认收入勾稽，梳理客户集中度和留存率，确认完整的独立员工数，并证明分拆后的股权结构表及关联方保护措施。
