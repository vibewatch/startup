      - number: '1.2'
        title: 管理层、治理与分拆
        blocks:
          - type: paragraph
            body: >
              Amir Orad 担任 Kraken 首席执行官。2025 年 9 月宣布分拆时，曾在 Asana 任职的 Tim Wan 加入并担任首席财务官。交易独立化前，这项任命强化了公司的财务和上市经验。Kraken
              随后表示，拆分将带来独立的股权结构表、独立治理和独立管理层。这个说法方向上重要，但不等于已有文件证明分拆完成。2026 年 1 月，Watt-Logic
              报道称，公开备案似乎仍与已宣布的经济拆分不一致，整体情况异常模糊。在审阅已签署的股东、董事会权利和关联交易文件前，Octopus 仍是重要关联方依赖：它既是前母公司，也是剩余股东、客户和创新伙伴。
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO013
              - CO014
