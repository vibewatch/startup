            body: >-
              当前公开记录支持跟踪而非买入。多家独立报道都同意，Kraken 的独立融资将估值锚定在 $8.65 billion，业务已具备大规模运营；但同一批材料仍没有给投资者一套清晰的独立投资判断资料。公开来源称账户超过
              7000 万、经常性或合同收入超过 $500 million，却没有把这些规模信号桥接到经审计利润率、留存率、客户集中度或下行保护条款。因此，融资估值可以作为锚点，但不足以据此声称当前价格存在清晰的公开安全边际。
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV013
              - CV015
