  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 买方的替代方案不止一个直接同业
        blocks:
          - type: paragraph
            body: >-
              Kraken 面对的是多个解决方案类别的竞争，而不只是一个同类公用事业软件同行。保留来源支持买方解决同一任务时至少有四种现实替代方案：Kaluza 这类专用能源平台；Tridens
              这类相邻或模块化专业厂商；Salesforce、Oracle 和 SAP 等厂商的 incumbent 企业套件；以及扩展内部拼装技术栈的原有路径。Kraken
              的公开证明点在规模上设定了很高门槛，但替代方案不必复制其完整操作系统广度也能赢得交易。当更窄的计费、CRM、电动车或灵活性模块更便宜、更易集成或更中立时，买方仍可用其替代。
            claimRefs:
