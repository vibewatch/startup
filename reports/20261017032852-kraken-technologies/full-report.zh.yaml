      - number: '8.2'
        title: 当前估值证明了什么，又没有证明什么
        blocks:
          - type: paragraph
            body: >-
              当前估值更多证明了投资者胃口和分拆势头，而不是充分披露的软件经济性。公开报道称，Octopus 将保留 13.7% 持股，Origin 将持有 22.7%，$1 billion 投资的大部分流向
              Octopus，而非留在 Kraken 内部。这一结构对入场纪律很重要：本轮交易验证了资产需求，却不能单独证明分拆后 Kraken
              将承担多少现金、杠杆、优先股堆叠或关联方复杂性。披露漂移也仍然可见：Octopus 自己的集团页面仍只写超过 5000 万账户，而后来的独立文章写超过 7000 万。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景是，独立性消除真实商业约束，Kraken 将装机基础和公用事业专属产品优势转化为更广泛的销售，并在 IPO
              前用更清晰的独立披露支撑私有估值。基准情景更克制：公司完成分拆并继续增长，但市场仍需依赖融资估值和选择性收入
              headline。悲观情景是，分拆前过高预期、集团层面的压力信号及缺失的下行保护披露叠加，使当前估值显得过高，或迫使公司以更不利条件进行后续融资。
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
      - number: '8.4'
        title: 退出准备度、尽调要求与论点破坏触发器
        blocks:
          - type: paragraph
            body: >-
              IPO 期权具有可行性，但尚未完成投资判断。BBC 报道引述管理层称，中期上市“很有机会”，分拆也计划在 2026
              年年中前完成；但买方仍需要把愿景变成上市准备度的材料：经审计的独立收入和毛利率、留存与集中度细节、包含优先权和债务的完整分拆后股权结构表，以及与 Octopus
              仍存续的确切关联交易协议。论点破坏触发器很直接：分拆延迟、独立商业赢单弱于预期、经常性收入叙事下修，或新的集团层面监管及资产负债表压力污染分拆故事。
            claimRefs:
              - CV004
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 持续跟踪，直到独立披露追上融资估值
            body: Kraken 值得密切跟踪，但公开证据仍缺少足以支撑高于当前私有估值锚点出价的独立报告。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV013
              - CV015
