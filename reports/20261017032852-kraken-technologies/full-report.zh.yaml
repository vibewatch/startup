  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界是公用事业运营软件，并已真实拓展至相邻垂直领域
        blocks:
          - type: paragraph
            body: >-
              公开来源一致将 Kraken 的边界定义为公用事业操作系统，而不是狭窄的聊天机器人或单点计费方案。BBC 和 SiliconANGLE 都将 Kraken 描述为帮助公用事业公司自动化客户服务和计费的 AI
              软件；2026 年 8
              月的宣传资料还加入了计量数据管理、现场运营、分布式能源编排和资产优化。这个范围很关键，因为它把相关市场从零售能源供应经济，转向卖给大型受监管或基础设施密集型服务商的企业运营软件。Wikipedia
              和该资料还显示，Kraken 已扩展到水务及宽带 / 电信公用事业，因此相邻支出是真实存在的；但公开证据仍集中在公用事业工作流现代化，而非完全通用的横向 SaaS 平台。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
      - number: '2.2'
        title: 公开市场规模由采用情况驱动，而非由 TAM 驱动
        blocks:
          - type: paragraph
            body: >-
              最有支撑的规模视角是运营覆盖面和软件牵引力，而不是正式的支出模型。WSJ、BBC、SiliconANGLE、投资者资料和 TradingView/Invezz 都指向同一业务画像：分拆时客户账户已超过 7000
              万，覆盖 27 个国家的公用事业服务商超过 40 家，ARR 超过 $500 million，近期增长迅速。这些数据有力证明，供应商拿下整个平台迁移时，公用事业软件可以形成巨大的收入池；但它们仍不是公开的
              TAM/SAM/SOM 方法论。公司没有按地域、模块或账户类型披露支出桥接，也没有外部支持的装机账户转化为软件钱包份额的推导，因此本章把市场规模视为受证据约束的采用堆栈，而不是精确市场模型。
            claimRefs:
              - CM003
              - CM004
              - CM009
              - CM012
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM009
              - CM012
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM013
      - number: '2.3'
        title: 买方是大型公用事业公司，独立性与估值则影响采用时点
        blocks:
          - type: paragraph
            body: >-
              能观察到的买方是追求企业转型的大型公用事业公司及相邻基础设施运营商，而不是采购部门工具。Kraken 列出的客户包括 EDF、E.ON、National Grid US、与 Origin
              相关的部署、TalkTalk、Severn Trent 和 Tokyo
              Gas，说明公司正向行业龙头运营商销售客户运营、计费、现场和数字化转型工作流。需求驱动因素很清楚：公用事业公司需要更新遗留服务栈，管理分布式能源和灵活需求的复杂性，并在不自行重建每条工作流的情况下接入庞大客户群。约束同样明显。分拆报道明确称，一些竞争性公用事业公司很难向仍由
              Octopus 持有的平台采购；Companies House 备案显示，2026 年年中控制结构仍在变化；Watt-Logic 则认为估值已包含软件式乐观预期，可能跑在分部经济数据的公开证据前面。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
      - number: '2.4'
        title: 展示
        blocks:
          - type: callout
            title: 对私有公用事业软件资产而言，装机基础证据异常强
            body: 超过 7000 万个管理账户、40 多家公用事业服务商和已点名的 incumbent 客户表明，Kraken 面向的是企业级公用事业运营预算，而不是靠小型试点证明需求。
            calloutType: strength
            claimRefs:
              - CM003
              - CM004
              - CM006
          - type: callout
            title: 公开证据支持牵引力，但不足以搭出完整市场规模桥接
            body: 保留来源显示了账户规模、ARR 和客户覆盖，但没有披露 TAM / SAM / SOM 方法论、模块定价或客户分部结构，因此无法有足够把握地将估值与市场份额，而非 headline 采用量挂钩。
            calloutType: risk
            claimRefs:
              - CM010
