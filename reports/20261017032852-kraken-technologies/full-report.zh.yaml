  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与披露质量
        blocks:
          - type: paragraph
            body: >-
              公开证据支持公用事业软件许可模式，而不是大宗零售能源收入流。多家独立媒体将 Kraken 描述为向公用事业公司销售云软件，规模通过客户账户迁移、公用事业客户数和合同年经常性收入体现，而非通过确认的 GAAP
              收入体现。披露最充分的商业数据是超过 7000 万个管理账户、超过 40 家公用事业服务商客户，以及分拆前后披露的超过 $500 million
              合同或年经常性收入。这足以推断变现依赖企业平台许可和大型实施项目，但不足以将经常性软件收入与迁移、集成或相邻服务收入分开。公开来源也没有披露每账户实际价格、模块附加率、续约时间，或从合同 ARR
              到确认收入的桥接，因此收入质量仍是核心尽调事项，而不是已解决的问题。
