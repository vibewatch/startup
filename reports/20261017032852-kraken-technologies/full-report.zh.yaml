          detail: 公开来源描述了与主要公用事业公司的许可交易，包括 EDF、E.ON、National Grid US、Origin 和 Tokyo Gas。
          claimRefs:
            - CI004
            - CI011
        - id: accounts
          label: 70m+ 托管账户
          detail: 规模按客户账户而非公开的客户层面收入披露来呈现。
          claimRefs:
            - CI004
            - CI006
        - id: recurring
          label: 5 亿美元以上合同 ARR
          detail: 公开报道引用的合同收入或年度经常性收入超过 5 亿美元。
          claimRefs:
            - CI005
            - CI006
        - id: funding
          label: $1bn 股权融资
          detail: 2025 年 12 月的本轮融资将 Kraken 定价为 86.5 亿美元，并为分离提供资金。
          claimRefs:
            - CI001
            - CI002
        - id: split
          label: 分拆后所有权
          detail: 预计分离后 Octopus 将保留 13.7%，Origin 将保留 22.7%。
          claimRefs:
            - CI003
        - id: gap
          label: 缺失的毛利润桥接
          detail: 没有汇总来源披露确认收入、毛利率或现金消耗，因此从合同 ARR 到现金产生的转化仍然不透明。
          claimRefs:
            - CI007
            - CI008
            - CI013
      edges:
        - from: contracts
          to: accounts
          label: 客户胜利推动迁移和托管账户规模
          claimRefs:
            - CI004
        - from: accounts
          to: recurring
          label: 账户数量支撑经常性软件收入
          claimRefs:
            - CI005
            - CI006
        - from: recurring
          to: funding
          label: 增长代理指标支持后期融资
          claimRefs:
            - CI001
            - CI005
        - from: funding
          to: split
          label: 融资确定分离后的所有权结构
          claimRefs:
            - CI002
            - CI003
        - from: recurring
          to: gap
          label: 通向确认收入和毛利润的公开桥接缺失
          claimRefs:
            - CI007
            - CI013
    approximationNotes: 该图展示已报告的商业流转，而非经审计的转化率；它有意停留在披露缺口处，而不是推断收入实现或利润率。
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据支持的层级显示出一个面向公用事业的运营堆栈，从客户运营延伸至灵活性编排；分离后的治理分离也成为产品销售叙事的一部分。
    data:
      layers:
        - label: 客户与计费工作流
          detail: 公用事业运营商使用的 AI 客服、计费和自助服务功能。
          modules:
            - 客户服务自动化
            - 计费运营
            - 自助服务工作流
          outputs:
            - 大规模账户服务
            - 减少人工工作量
        - label: 产品与资费运营
          detail: 公用事业公司利用该平台更快推出和调整产品及服务。
          modules:
            - 报价／资费配置
            - 工作流自动化
          outputs:
            - 更快的产品迭代
        - label: 现场运营
          detail: Kraken Field 将平台扩展至安装和服务工单调度。
          modules:
            - 自动化调度
            - 路由支持
          outputs:
            - 所引用的 Octopus 案例研究中，98% 的工单由系统自动调度
        - label: 灵活性与设备编排
          detail: 保留证据描述了跨联网设备的虚拟电厂和削峰控制。
          modules:
            - 需求灵活性
            - 设备编排
          outputs:
            - '>50 万台联网设备'
            - 2 GW 编排功率
        - label: 数据与 AI 核心
          detail: 公用事业级 AI 和每日大量数据吞吐量被呈现为通用基础设施。
          modules:
            - 每日新增 150 亿个数据点
            - 持续部署
          outputs:
            - 跨工作流自动化
        - label: 治理边界
          detail: 独立治理和股权结构表是分拆后架构的一部分，旨在建立客户信任。
          outputs:
            - 独立治理
            - Octopus 仍是持有 13.7% 股份的股东和关键客户
    approximationNotes: 该堆栈概括公开描述，而非已披露的系统图；应将其理解为有证据支持的运营模式，而非完整的技术蓝图。
    claimRefs:
      - CE001
      - CE004
      - CE006
      - CE008
      - CE009
      - CE010
      - CE013
  - id: FU001
    title: 从锚定部署到第三方拓展的客户旅程
    type: journey-map
    summary: 公开客户叙事从 Octopus 的锚定部署转向更广泛的公用事业采用，随后又回到持久性和集中度缺口。
    data:
      items:
        - label: 在 Octopus 内部的锚定部署
          actor: Octopus Energy
          phase: 初始参考
          touchpoints:
            - 平台最初为 Octopus 的运营和客户工作流构建
            - 创建首个生产环境参考账户
        - label: 大型公用事业参考客户胜利
          actor: 企业公用事业买家
          phase: 客户标识扩展
          touchpoints:
            - 点名客户包括 EDF、E.ON Next、Origin、National Grid US 和 Tokyo Gas
            - 采用按账户销售，而不是通过自助使用实现
        - label: 跨公用事业及相邻领域拓展
          actor: 水务、电信及更广泛的公用事业运营商
          phase: 细分市场扩展
          touchpoints:
            - 公开材料指出了水务和电信用例，以及能源零售用例
            - 细分市场广度增长快于标准化成果证据
        - label: 中立性摩擦出现
          actor: Octopus 的竞争对手和采购团队
          phase: 销售摩擦
          touchpoints:
            - BBC 称 Kraken 曾难以与 Octopus 的竞争对手开展业务
            - 所有权结构成为销售对话的一部分
        - label: 分拆释放空间并吸引新客户
          actor: 新公用事业公司和投资者
          phase: 扩张循环
          touchpoints:
            - 重要新客户以及未具名客户投资者的信号指向新需求
            - 管理层如今将 Kraken 定义为中立的全球操作系统
        - label: 持久性和集中度尽调
          actor: 投资者和客户风险审查者
          phase: 投资判断缺口
          touchpoints:
            - 公开证据缺少 NRR、流失率、续约和集中度披露
            - 看空报道警告围绕单一平台的生态系统集中度
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU007
      - CU008
      - CU009
      - CU012
      - CU013
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余严重性集中在不完整的分离、母公司外溢影响，以及尚未有公开证据证明的运营控制。
    data:
      columns:
        - label: 可能性
          note: 未来 12-24 个月的公开证据估计
        - label: 影响
          note: 风险实现后对投资判断的影响
        - label: 缓解措施成熟度
          note: 保留来源中的公开缓解措施有多具体
      rows:
        - label: 分离／治理拖累
          note: 公开来源描述了意图和融资，而非已完成的法律分离。
          values:
            - label: 中
              tone: medium
              note: 流程正在进行，但截至 runDate 的完成情况未经核实。
            - label: 高
              tone: high
              note: 失败将维持客户冲突和关联方担忧。
            - label: 早期
              tone: high
              note: 缓解措施主要是管理层叙事，而非可审计合同。
        - label: 母公司资产负债表外溢
          note: Octopus 仍同时是所有者、客户和 2025 年大部分募集资金的接收方。
          values:
            - label: 中
              tone: medium
              note: 风险取决于母公司资本和监管问题是否持续。
            - label: 高
              tone: high
              note: 母公司压力可能扭曲资本配置或出售时机。
            - label: 部分
              tone: medium
              note: 融资改善了流动性，但最新合规证据缺失。
        - label: 公用事业级正常运行时间／数据故障
          note: 平台范围涵盖计费、客户互动和电网运营。
          values:
            - label: 中
              tone: medium
              note: 大规模多客户迁移使执行错误具有合理可能性。
            - label: 高
              tone: high
              note: 重大中断可能同时影响多个标志性客户。
            - label: 早期
              tone: high
              note: 没有保留的公开来源记录认证或事故指标。
        - label: 客户／投资者集中度
          note: 公开证据集中在战略投资者和少数旗舰公用事业公司周围。
          values:
            - label: 中
              tone: medium
              note: 受监管行业较长的销售周期带来续约和上线时点风险。
            - label: 中高
              tone: high
              note: 延迟可能同时削弱 ARR 转化和 IPO 叙事。
            - label: 部分
              tone: medium
              note: 地域广度有所帮助，但客户集中度未量化。
        - label: 资本市场预期
          note: $8.65bn 估值和 IPO 讨论对软件式执行造成压力。
          values:
            - label: 中
              tone: medium
              note: 2025 年末融资已使投资者预期处于较高水平。
            - label: 中
              tone: medium
              note: 在披露深化之前，错过里程碑可能压缩估值。
            - label: 部分
              tone: medium
              note: 外部资本有所帮助，但治理和续约证据仍然滞后。
        - label: 安全／合规披露缺口
          note: 公司材料强调云规模，但没有强调可独立审计的控制措施。
          values:
            - label: 中
              tone: medium
              note: 由于缺乏公开保证证据，控制薄弱具有合理可能性。
            - label: 高
              tone: high
              note: 重大事故可能迅速损害公用事业信任和监管地位。
            - label: 早期
              tone: high
              note: 没有保留来源记录认证、事故指标或审计结果。
    claimRefs:
      - CR003
      - CR005
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 逻辑链从可信的融资估值和庞大的已安装基础出发，经由披露缺口和拖累风险，最终得出跟踪建议。
    data:
      nodes:
        - id: financing-mark
          label: 融资估值
          note: 独立融资轮的 $8.65bn 估值
        - id: scale-proof
          label: 规模证明
          note: 所引用的超过 7000 万账户和超过 5 亿美元经常性或合同收入
        - id: independence-unlock
          label: 独立性释放空间
          note: 分拆旨在消除公用事业销售中的竞争对手冲突
        - id: disclosure-gap
          label: 披露缺口
          note: 没有针对利润率、留存率、集中度或股权结构表的经审计桥接
        - id: risk-overhang
          label: 风险拖累
          note: 保留的股权、大部分资金流向 Octopus 以及集团层面压力都很重要
        - id: recommendation
          label: 建议
          note: 基于当前公开证据和价格支撑进行跟踪
      edges:
        - from: financing-mark
          to: scale-proof
          label: 确认需求
        - from: scale-proof
          to: independence-unlock
          label: 支持上行情景
        - from: independence-unlock
          to: disclosure-gap
          label: 仍需证明
        - from: disclosure-gap
          to: risk-overhang
          label: 限制信心
        - from: risk-overhang
          to: recommendation
          label: 导向
    approximationNotes: 该流程概括本章有证据支持的决策路径，而非数学建模的估值桥接。
    claimRefs:
      - CV001
      - CV005
      - CV007
      - CV009
      - CV010
      - CV013
      - CV015
