              - CP014
              - CP016
      - number: '3.4'
        title: 持久性取决于旗舰 logo 之外能否持续赢单
        blocks:
          - type: paragraph
            body: >-
              当买方希望一个供应商覆盖客户运营、计费和公用事业专属工作流时，Kraken 看起来占优，但竞争场并未封闭。保留的独立比较将 Kaluza 列为最接近的英国同行，并提到其为 ENGIE
              的大型部署，说明成熟买方至少还有一个专用替代方案。同一来源池还显示，Kraken 商业化前是内部平台；即使当前经济数据未披露，这也使内部自建在市场最高端仍是可信替代。Tridens
              撰写的竞争者批评还揭示了典型替代因素：集成工作量、对小型公用事业公司的可负担性、对合作伙伴生态的依赖，以及服务响应速度。公开价格透明度仍太弱，无法定论，因此护城河持久性更多取决于部署结果和切换摩擦，而非公开标价优势。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP015
              - CP016
