      - 证据
      - 哪些情况会改变判断
    rows:
      - - 论点：已有真实规模证明
        - 独立报道称账户数超过 7,000 万，覆盖 27 个国家、超过 40 家公用事业供应商
        - 经审计的独立毛利率和留存率，可能足以支持对软件质量型经济性的更高信心。
      - - 论点：分拆可以释放需求
        - 多个来源称，独立经营应有助于 Kraken 向此前对购买 Octopus 所有平台持谨慎态度的公用事业公司销售
        - 分拆后的早期竞争对手公用事业客户胜利，将强化定价能力和 TAM 假设。
      - - 反论点：收入质量桥接仍然薄弱
        - 公开来源在 ARR 与合同年收入之间存在分歧，且未披露客户集中度或续约细节
        - 从合同到确认收入及留存率的详细审计桥接，将减少折价。
      - - 反论点：私人市场估值可能已经充分反映价值
        - 本轮融资对应少数股权估值，且据报道大部分新增资金流向 Octopus，而公开的资本结构保护措施仍未披露
        - 更低的入场价格或透明的分拆后资本结构，将改善下行保护。
    notes: 证据列概括所引用的主张；经济性数据为空以及资本结构细节缺失，被视为尽调缺口，而非隐藏的积极因素。
