companyProfile:
  summary: >-
    Kraken Technologies 是一家后期私有公用事业软件公司，曾在 Octopus Energy 内部成长，并在 2025 年 12 月的一笔分拆交易中获得 $8.65 billion
    估值。公司将自己定位为公用事业运营操作系统；公开证据显示，其拥有超过 7000 万个合同家庭及企业账户、超过 $500 million
    的合同年收入，以及广泛的公用事业客户基础。公司正转向独立治理，但公开记录仍未回答经审计收入、利润率、留存率、员工数和分拆后控制图谱等关键问题。
