      - number: '1.3'
        title: 融资、估值与利益相关方图谱
        blocks:
          - type: paragraph
            body: >
              2025 年 12 月的交易是最清晰的估值锚点。Kraken 及独立报道称，在 D1 Capital Partners 牵头的一轮交易中，投资者以 $8.65 billion 估值收购了约 $1 billion
              的 Kraken 股权，Fidelity International、Durable Capital Partners 和 Ontario Teachers' Venture Growth
              也参与其中。交易所得需要谨慎解读：Kraken 的公告称股权收购将同时为 Octopus 和 Kraken 提供资金，而 BBC 报道称大部分资金将流向 Octopus，Kraken
              获得剩余部分。因此，筹得的资金不能视为 Kraken 可用现金。预计 Octopus 将保留 13.7% 持股，其保留权利和商业安排仍是控制权及利益冲突分析的核心。
