      - number: '3.2'
        title: 分拆改善了中立性，但母公司影响仍然存在
        blocks:
          - type: paragraph
            body: >-
              保留来源清楚说明了分拆的战略逻辑：Kraken 的主要商业异议不是产品够不够，而是竞争性公用事业公司是否信任一个仍在 Octopus 内部的平台。Skadden
              称此轮交易为正式独立以及独立资本和治理结构铺路；BBC 则报道，Kraken 过去很难与 Octopus 的竞争对手做生意。这应能扩大可触达客户群。但分拆并不等于经济关系完全脱钩。TradingView
              报道称，分拆后 Octopus 仍将持有 13.7%，Origin 将持有 22.7%。对有严格数据隔离或竞争中立要求的公用事业公司而言，这层剩余所有权背景仍是尽调内容，不会被一次分拆抹掉。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP009
      - number: '3.3'
        title: 广度是 Kraken 的护城河，模块化是最清晰的反向定位
        blocks:
          - type: paragraph
            body: >-
              公开来源一贯将 Kraken 描述为比计费工具更广的平台。BBC 和 Octopus 将其定位在客户服务及计费自动化上，Octopus 自己的描述则强调面向能源的云架构，而非通用企业外壳。Computing
              提供了一个商业证明点——分拆时合同年收入为 $500 million——支持买方购买的是广泛运营层，而非单一功能。替代方案更窄也更实际：Tridens
              将计费、收入管理、电动车充电和自助服务模块作为选择定向技术栈、而非完整公用事业操作系统的理由。Kraken 最强的优势是广度，最清晰的弱点是部分客户可能不需要或不愿为全部广度付费。
            claimRefs:
              - CP004
              - CP007
              - CP008
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP008
              - CP010
