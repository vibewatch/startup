company:
  name: "Kraken Technologies"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Public evidence supports Kraken as a utility-specific operating system that spans customer service,
    billing, field operations, and device-orchestration workflows, with scale claims that now extend
    beyond pure energy retail. The product narrative is commercially credible, but several important
    diligence points — especially post-spinout security controls, module-level deployment depth, and
    independent developer-signal evidence — remain under-disclosed.
sections:
  - id: "product-scope"
    title: "What Kraken delivers in the utility workflow"
    body: >-
      Kraken is presented as a purpose-built operating system for utilities rather than a generic CRM or
      back-office toolkit. Across the retained sources, the common workflow spine is customer service,
      billing, product launch, and consumption/flexibility management. Octopus describes a cloud-based,
      continuously deployed platform built for utilities, while BBC and SiliconANGLE independently
      describe AI-based automation across billing, customer service, and energy-usage management. The
      current surface also points to adjacent expansion into water and telecom and to field-service
      automation inside Octopus Energy Services, suggesting the product is broader than a retail-energy
      billing engine but still centered on utility operations rather than general enterprise software.
    claimRefs: ["CE001", "CE002", "CE006", "CE007", "CE008", "CE014"]
    tableRefs: ["TE001", "TE002"]
    figureRefs: ["FE001"]
  - id: "operating-model"
    title: "Operating model, architecture, and dependencies"
    body: >-
      The strongest architectural evidence is directional rather than fully technical. Official copy says
      Kraken runs on a scalable cloud architecture with continuous deployments; partner and news sources
      add utility-grade AI, high data throughput, and broad customer-account scale. Together that supports
      a layered view: customer and billing workflows on top, field and flexibility modules as operational
      extensions, and a shared data-and-automation core underneath. What is not public is equally
      important. The retained source set does not provide API-level documentation, implementation
      timelines by module, uptime commitments, or standalone security-certification detail after the
      spinout, so diligence still depends on management materials and customer reference calls.
    claimRefs: ["CE001", "CE003", "CE004", "CE008", "CE011", "CE013"]
    tableRefs: ["TE003"]
  - id: "maturity-risks"
    title: "Maturity, trust boundaries, and diligence risks"
    body: >-
      Kraken's product maturity looks strongest on commercial adoption and weakest on independently
      disclosed control detail. Multiple sources support large account scale and a blue-chip customer list,
      and the spinout is explicitly framed as a way to let Kraken sell more neutrally across utilities.
      That framing matters because the pre-spinout structure created a trust tension: competing utilities
      were being asked to buy core operating software from a vendor owned by a rival supplier. The
      demerger, separate governance, and independent cap table partially address that issue, but Octopus
      remains a shareholder, major customer, and innovation partner. Until Kraken discloses more on data
      segregation, security certifications, SLA performance, and module-level customer references, product
      underwriting still carries execution and trust risk.
    claimRefs: ["CE003", "CE009", "CE010", "CE012"]
