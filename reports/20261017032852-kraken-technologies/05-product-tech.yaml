      - ["Data and AI layer", "Utility-grade AI and high data throughput support automation and orchestration", "Access to customer, grid, and operational data; model governance", "Public evidence does not disclose security controls, model-governance specifics, or data-segregation architecture"]
      - ["Customer / billing workflow layer", "Automates customer service, billing, and self-service interactions", "Integration with utility account, tariff, and servicing processes", "No public breakdown of which functions are live by customer or module"]
      - ["Field and flexibility extensions", "Supports field scheduling plus demand/flexible-asset orchestration", "Device connectivity, routing, and utility operations adoption", "Operational claims are promising but depend heavily on company or partner narration"]
    notes: "Architecture is reconstructed from retained public descriptions; absent API docs, security artefacts, and reliability disclosures should be treated as diligence asks rather than verified capabilities."
    claimRefs: ["CE001", "CE004", "CE006", "CE008", "CE009", "CE010", "CE013"]
