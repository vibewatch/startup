artifact: customers
slug: kraken-technologies
runDate: 2026-10-17
company:
  name: Kraken Technologies
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence shows real enterprise adoption: late-2025 coverage places Kraken above
    70 million managed customer accounts, with more than 40 utility providers across 27
    countries. But the proof is still concentrated in named logos and scale claims, while
    retention, concentration, and live-versus-contracted deployment quality remain under-disclosed.
sections:
  - id: customer-footprint
    title: Customer footprint and segment mix
    body: >-
      Kraken's public customer footprint is clearly enterprise-utility led, not a consumer
      self-serve motion. Late-2025 independent coverage described more than 70 million customer
      accounts and more than 40 utility providers across 27 countries, while the live Octopus
      group page still highlights more than 50 million accounts via EDF Energy, Good Energy,
      E.ON energy, and Origin Energy. That mix suggests the platform wins large regulated
      operators where one contract can move millions of end-customer accounts at once. The same
      evidence also shows segment expansion beyond retail energy into adjacent utility workflows
      and some non-energy utility contexts, which broadens the addressable market but makes
      customer quality harder to compare across segments.
    claimRefs: [CU002, CU003, CU004, CU005, CU013]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Adoption proof and deployment quality
    body: >-
      Named proof is real but uneven. BBC and SiliconANGLE both name large utility customers
      such as EDF, E.On Next, National Grid US, and Tokyo Gas, while the official page and
      secondary sources add Origin, Good Energy, and broader utility references. The evidence is
      strongest for enterprise go-lives, migrations, or licensing relationships, not for a
      standardized proof standard across the whole base. TradingView also points to a newly
      signed major customer helping Kraken approach 100 million accounts, but the customer is
      unnamed and the assigned sources do not disclose whether the relationship is already fully
      live, how much ARR it represents, or which modules are deployed.
    claimRefs: [CU001, CU002, CU004, CU008, CU011, CU014]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-risks
    title: Durability, expansion and concentration risk
    body: >-
      The weakest part of the customer story is durability and concentration disclosure. None of
      the assigned sources publish NRR, GRR, churn, renewal timing, contract length, or module
      attach, so public readers can verify scale and logos but not whether the installed base
      expands efficiently once onboarded. Independence is also only partial: the spin-out is
      explicitly pitched as a way to sell more easily to Octopus rivals, yet Octopus remains a
      key partner and customer. Watt-Logic adds a more bearish lens, arguing Kraken is becoming
      central infrastructure inside UK billing and flexibility markets, which heightens ecosystem
      concentration risk if a few very large customer relationships dominate revenue and data
      flows.
    claimRefs: [CU006, CU007, CU009, CU010, CU012]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Representative public proof
      - Scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Incumbent energy retailers / suppliers
        - Utility buyer; operations and customer-service teams as users; utility pays
        - EDF Energy, E.ON Next, Good Energy, Origin Energy, and Tokyo Gas appear in assigned sources
        - Multi-million-account migrations and global licensing references
        - Likely core recurring licensing base and strongest reference set
        - Public sources do not break ARR, module mix, or renewal terms by logo
      - - Grid / network and flexibility operators
        - Utility or network buyer; operations and field teams as users
        - National Grid US and virtual-power-plant or device-orchestration references
        - Named US utility client plus 500,000 connected devices / 2 GW VPP surface
        - Shows relevance beyond billing into system operations
        - Assigned evidence does not disclose production depth or contract value by operator
      - - "Adjacent utilities: water and telecom"
        - Utility or telecom buyer; customer and service operations as users
        - Wikipedia cites Portsmouth Water, Severn Trent, and TalkTalk adoption
        - Named adjacency proof, but fewer corroborating sources than core energy utilities
        - Supports expansion beyond electricity and gas verticals
        - Most adjacency rows rely on thin or secondary public proof rather than robust case studies
      - - Anchor related-party customer / partner
        - Octopus is both former parent and continuing customer / innovation partner
        - Spin-out materials describe Octopus as a key innovation partner and forward-thinking global customer
        - Strategically important lighthouse account
        - Helps product iteration and credibility but may distort concentration
        - Assigned sources do not quantify Octopus's revenue share or arm's-length economics
    notes: >-
      Public evidence shows enterprise segments and named logos, but not customer-by-customer
      ARR, renewal, or module penetration.
    claimRefs: [CU003, CU004, CU005, CU007, CU013]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date / period
      - Source quality
      - Implication
      - Missing denominator / caveat
    rows:
      - - Accounts on official group page
        - Over 50 million accounts
        - Live Octopus group page accessed 2026-10-17
        - Company claim
        - Sets a conservative floor for global footprint
        - Undated page appears stale versus later external reporting
      - - Accounts in late-2025 coverage
        - Over 70 million accounts
        - December 2025
        - Multi-source independent news
        - Shows scale step-up around the spin-out
        - Sources alternate between "serves" and "contracted to serve"
      - - Utility-provider footprint
        - More than 40 providers across 27 countries
        - December 2025
        - Independent news plus secondary corroboration
        - Suggests diversified logo base across markets
        - No source splits providers by module, geography, or revenue
      - - Near-term expansion target
        - 100 million accounts target; management says progress is ahead of plan
        - 2025 to 2027 target window
        - Official plus independent management statements
        - Implies continued land-and-expand motion
        - Target is not audited usage and customer identity is undisclosed
      - - Proof of fresh onboarding
        - Unnamed major customer helped move Kraken closer to 100 million accounts
        - December 2025
        - Partner-linked market coverage
        - Signals live pipeline momentum around the spin-out
        - No public name, contract value, or production date in assigned evidence
    notes: >-
      Table reconciles public scale signals; the strongest gap is whether accounts are live,
      contracted, or only targeted at each date.
    claimRefs: [CU001, CU002, CU003, CU008, CU011]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / account
      - Segment
      - Public proof
      - Production vs pilot signal
      - Outcome / scale signal
      - Limitation
    rows:
      - - EDF Energy
        - Incumbent utility / retailer
        - Official page, BBC, SiliconANGLE, and Wikipedia all name EDF
        - Likely production or migration-scale deployment, not a mere logo
        - Named as a core client; Wikipedia cites a five-million-customer transition program
        - Assigned evidence does not disclose current live accounts, ARR, or renewal status
      - - E.ON Next / legacy Npower
        - Incumbent utility / retailer
        - Official page, BBC, and Wikipedia name E.ON Next
        - Production-scale evidence is stronger than for most logos
        - Wikipedia cites a 10 million combined-customer base and record-time migration for former Npower customers
        - Operational outcome and present contract scope are not refreshed in the assigned sources
      - - Origin Energy
        - Strategic utility partner and shareholder-linked customer
        - Official page, Parsers, and TradingView reference Origin as both customer and equity holder
        - Likely production relationship, but independence is structurally mixed
        - Shows customer proof in Australia and strategic capital support
        - Public sources do not separate commercial economics from shareholder alignment
      - - National Grid US
        - North American utility
        - BBC and SiliconANGLE name National Grid US as a client
        - Named production client, but deployment scope is not described
        - Demonstrates US enterprise reference value beyond Octopus-linked markets
        - No public metric for accounts, ARR, module set, or timing in the assigned evidence
      - - TalkTalk / non-energy utilities
        - Telecom and non-energy utility adjacency
        - BBC names TalkTalk; Wikipedia lists water and telecom utility references
        - Adjacency proof exists, but it is thinner than core utility proof
        - Supports thesis that Kraken can expand beyond power and gas workflows
        - Assigned evidence does not provide consistent production-depth or financial outcomes across adjacency wins
    notes: >-
      Enumeration is intentionally partial: it includes only named accounts visible in the
      assigned pool, not Kraken's full installed base.
    enumerationScope:
      coverage: partial
      basis: >-
        Rows include only publicly named customers and adjacent utilities visible in the
        assigned pool, not the full contracted customer base.
    claimRefs: [CU004, CU005, CU008, CU013, CU014]
figures:
  - id: FU001
    title: Customer journey from anchor deployment to third-party expansion
    type: journey-map
    summary: >-
      The public customer narrative moves from Octopus as anchor deployment to broader utility
      adoption, then back to durability and concentration gaps.
    data:
      items:
        - label: Anchor deployment inside Octopus
          actor: Octopus Energy
          phase: Initial reference
          touchpoints:
            - Platform originally built for Octopus operations and customer workflows
            - Created the first production reference account
        - label: Large-utility reference wins
          actor: Enterprise utility buyers
          phase: Logo expansion
          touchpoints:
            - Named clients include EDF, E.ON Next, Origin, National Grid US, and Tokyo Gas
            - Adoption is sold account by account rather than through self-serve usage
        - label: Cross-utility and adjacency stretch
          actor: Water, telecom, and broader utility operators
          phase: Segment expansion
          touchpoints:
            - Public materials point to water and telecom use cases as well as energy retail
            - Segment breadth grows faster than standardized outcome proof
        - label: Neutrality friction emerges
          actor: Octopus rivals and procurement teams
          phase: Sales friction
          touchpoints:
            - BBC says Kraken had struggled to do business with Octopus rivals
            - Ownership structure becomes part of the sales conversation
        - label: Spin-out unlock and new customer onboarding
          actor: New utilities and investors
          phase: Expansion loop
          touchpoints:
            - Major new customer and unnamed customer-investor signals point to fresh demand
            - Management now frames Kraken as a neutral global operating system
        - label: Durability and concentration diligence
          actor: Investors and customer-risk reviewers
          phase: Underwriting gap
          touchpoints:
            - Public evidence lacks NRR, churn, renewal, and concentration disclosure
            - Bearish coverage warns about ecosystem concentration around one platform
    claimRefs: [CU001, CU002, CU006, CU007, CU008, CU009, CU012, CU013, CU014]
callouts:
  - calloutType: insight
    title: Enterprise adoption is credible, but proof is logo-heavy
    body: >-
      The assigned evidence supports real utility adoption at scale, but most proof is still
      logos plus account-count claims rather than standardized deployment-depth or outcome disclosure.
    claimRefs: [CU002, CU003, CU014]
  - calloutType: risk
    title: Durability and concentration remain underwritten by private diligence
    body: >-
      Public readers can see scale and named customers, but not retention, customer concentration,
      or the share of commercial value tied to Octopus and other strategically linked accounts.
    claimRefs: [CU009, CU010, CU012]
