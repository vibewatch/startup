companyProfile:
  summary: >-
    Kraken Technologies is a late-stage private utility-software company that grew inside Octopus Energy before a
    December 2025 spinout transaction valued it at $8.65 billion. It describes itself as an operating system for utility
    operations, with public evidence pointing to more than 70 million contracted household and business accounts, more
    than $500 million of contracted annual revenue, and a broad utility client base. The company is now moving toward
    standalone governance, but the public record still leaves key questions open around audited revenue, margins,
    retention, headcount, and the post-separation control map.
  foundedDate: '2017-01-01'
