  topStrengths:
    - 精准发酵和结构蛋白平台真实存在，科学、制造和合作伙伴证据可见
    - 对私营生物材料公司来说，具名客户牵引力异常强，覆盖户外、生活方式和高级定制合作
    - 战略稀缺性强：很少有公司能在这种可见度下同时具备结构蛋白 IP、商业化工厂雄心和品牌相关性
    - 食品蛋白和非纤维选择权，把上行空间推出单一服装材料叙事之外
  topRisks:
    - 2025-2026 年债务压力和重组，大幅削弱了旧私募估值标记的可信度
    - 公开来源仍未披露重置后的债务条款、现金跑道或工厂级单位经济模型
    - 客户证据很强，但长期采购深度和复购质量尚未在公开层面得到证明
    - 成本平价和规模经济仍未解决，尤其是在高端混纺应用之外
    - 食品蛋白选择权也带来实质监管负担和时间表风险
  unresolvedGaps:
    - 重置后的资本结构、债权人条款、稀释和现金跑道尚未公开
    - 分业务收入、毛利率和每公斤成本仍未披露
    - 具名合作伙伴的复购率、客户集中度和 ACV 尚未公开
    - 泰国运营的工厂利用率、收率和缺陷率数据尚未公开
    - 食品蛋白监管路径和试点经济性仍处早期，公开描述也只有一部分
