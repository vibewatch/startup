- id: leadership-and-governance
  title: Leadership Reset and Governance
  body: The most important change in Spiber’s recent history is not a product launch but a governance reset. Public April 2026 materials show that the company restarted operations under “New Spiber,” with Maya Kawana taking full responsibility for business strategy, governance, and early monetization. Founders Kazuhide Sekiyama and Junichi Sugahara did not disappear; instead they moved out of frontline management to focus on solving technical bottlenecks and accelerating commercialization. This is a significant separation of scientific and managerial roles. The December 2025 support agreement is useful context because it introduced Kawana before the formal launch, explained her prior Goldman Sachs and BOLD background, and signaled that the change was planned rather than abrupt. What remains unclear is the full board composition, protective rights, and post-restructuring ownership map, so governance visibility is better than before but still incomplete for investors.
