  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, gross margin, burn, cash, and remaining liabilities after the 2026 restructuring.
    whyItMatters: The public record proves platform value but not current economic viability or runway.
    diligencePath: Request management accounts, creditor workout summary, and monthly cash-flow bridge.
    relatedQuestionRefs:
    - QO024
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Post-restructuring ownership, board composition, investor rights, and any creditor conversion terms.
    whyItMatters: Control and dilution risk cannot be assessed from public materials alone.
    diligencePath: Request cap table, board list, and summary of any restructuring agreements.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: minor
    topic: adoption-metrics
    missingEvidence: Reconciliation between the 15-brand count in April 2024 and the later 40-plus-brand count on current company pages.
    whyItMatters: The numbers likely reflect different vintages and scopes, but the reader needs that distinction preserved.
    diligencePath: Ask management to separate cumulative launches, active programs, and repeat-production accounts.
    relatedQuestionRefs:
    - QO012
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Current cost per kilogram and cost-down roadmap for Brewed Protein production at Rayong and Japan.
    whyItMatters: Premium positioning and blended usage suggest cost parity remains distant, which affects every later chapter.
    diligencePath: Request plant utilization, yield, feedstock, and conversion-cost data by product family.
    relatedQuestionRefs:
    - QO023
