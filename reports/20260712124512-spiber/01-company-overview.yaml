company:
  name: Spiber
chapter:
  number: 1
  title: Company Overview
  summary: Spiber is a Tsuruoka-based structural-protein company that built real fermentation and brand-launch infrastructure around Brewed Protein™ materials, but entered 2026 only after a leadership reset and balance-sheet restructuring. The public record supports technical depth, partner relevance, and prior unicorn financing, while leaving current economics and ownership opaque.
sections:
- id: identity-and-footprint
  title: Identity, Mission, and Footprint
  body: 'Spiber is best understood as a Japanese structural-protein commercialization company rather than just a fashion-material startup. The company was established in 2007 in Tsuruoka, Yamagata Prefecture, and still anchors its corporate identity there, but its operating footprint is broader: Paris supports European commercial activity and Rayong, Thailand houses the fermentation mass-production infrastructure that turned Brewed Protein from an R&D story into an industrial one. Public materials consistently frame the mission around sustainable well-being and environmental problem-solving, but the product framing is concrete: Spiber designs protein polymers at the DNA level, manufactures them through microbial fermentation, and converts them into fibers, films, resins, and related material forms. That mix of synthetic-biology platform, materials science, and manufacturing footprint matters because later chapters depend on the distinction between scientific novelty and actual supply-chain
    readiness.'
