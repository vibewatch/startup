- id: commercialization-and-milestones
  title: Commercialization, Plant Milestones, and Standards Recognition
  body: 'Spiber’s milestone pattern shows genuine commercialization progress even though the company is still not financially transparent. The Thailand plant was described as the group’s first mass-production facility and its role is now reinforced by the company page and sustainability materials, which place polymer production in Rayong and tie the operation to Bonsucro-certified sugar sourcing. Public 2024 disclosures said 15 brands had already launched products using Spiber materials; newer corporate materials broaden that to 40-plus brands, 200-plus items, and an ecosystem of 80-plus manufacturers. Standard-setting also matters: the 2021 ISO 2076 revision that explicitly included synthetic protein fibre gave Brewed Protein a stronger classification story for buyers and partners. The cumulative picture is of a company that has crossed several capability thresholds—industrial plant, standards recognition, and real product adoption—even if it has not yet crossed into clear financial self-sufficiency.'
