- id: capital-history-and-stage
  title: Capital Formation, Stage, and Public Valuation Markers
  body: 'Spiber has been financed like a deep-tech platform company with recurring step-ups rather than like a lightly capitalized apparel supplier. The 2021 capital package remains the most important historical marker: Spiber announced JPY 34.4 billion in September 2021, then another JPY 5 billion in December, while third-party market-data sources record a $313 million Series E at a $1.22 billion post-money valuation. The public record also shows a $44.1 million Series D in 2018 and a 2024 extension round worth more than JPY 10 billion, or roughly $65 million. Those facts support a late-stage private-company classification, but they do not provide the full underwriting picture because absolute revenue, margin, and cash metrics remain undisclosed. As a result, valuation confidence comes more from financing history than from operating transparency.'
