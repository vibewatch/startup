- id: capital-adequacy-and-restructuring
  title: Capital Adequacy, Financing Dependence, and Restructuring
  body: 'The clearest public financial fact about Spiber is that it required repeated external capital and still hit a wall. The 2021 capital package, the 2024 $65 million-equivalent round, and Tracxn’s roughly $489 million total-raised figure all support a narrative of heavy financing dependence through commercialization. Independent reporting then adds the hardest fact: approximately JPY 40 billion of debt due at the end of 2025 and a restructuring severe enough to create New Spiber under new leadership. This does not negate the platform’s value, but it sharply raises the bar for future financing discipline. Investors should read every future commercialization milestone through that lens: can the company now turn its materials and brand ecosystem into cash generation quickly enough to avoid repeating the prior capital trap?'
