chapter:
  number: 4
  title: Financials
  summary: Spiber has a credible multi-lane revenue concept and unusually well-documented funding history for a private deep-tech company, but almost no public operating-financial disclosure. The 2025-2026 restructuring makes capital adequacy, debt terms, and plant economics more important than launch count in any underwriting exercise.
sections:
- id: revenue-model
  title: Revenue Streams and Business Model
  body: 'Spiber’s public financial story begins with what the company appears to sell. The evidence supports a B2B materials model rather than a direct consumer or software subscription model. Brewed Protein is marketed in multiple forms—fibers, resins, films, and related formats—and recent communications add a food-protein adjacency aimed at ingredient and CPG partners. That implies at least three possible monetization lanes: material sales into textile and industrial applications, co-development revenue with brand or ingredient partners, and future ingredient revenue from food-protein commercialization. What the public record does not show is the current mix between those streams, whether any are recurring, or whether pricing is standardized or fully negotiated. The practical takeaway is that Spiber has multiple monetization options on paper, but still looks like a complex enterprise materials business whose economics depend on qualification, partner development, and production scaling.'
