- id: financial-verdict
  title: Financial Verdict and Diligence Blockers
  body: 'The public financial verdict is straightforward: Spiber looks technically substantial and commercially relevant, but still impossible to underwrite precisely from public sources alone. New leadership is saying the right things about profitability, portfolio optimization, and early monetization, yet those statements are not the same as disclosed financial performance. The best available conclusion is that the company has multiple plausible revenue streams, but no publicly verified evidence that any one stream has reached scaled, repeatable, attractive unit economics. That pushes financial diligence toward first principles: demand quality, order repeatability, plant economics, cap table and debt terms, and runway under realistic utilization assumptions. Until those are supplied, the financial case remains research-more rather than investable on public evidence.'
