- id: traction-and-disclosure
  title: Traction Signals Versus Financial Disclosure
  body: Public traction signals are real but financially incomplete. Spiber can point to brand launches, current site claims of 40-plus brands and 200-plus items, and earlier evidence that 15 brands had already launched products by April 2024. Those are useful adoption markers, but they are not substitutes for revenue run rate, ARR, gross margin, or net retention. The absence of those denominators matters because a business can produce exciting launches and still struggle financially if volumes are low, pricing is promotional, or qualification costs remain high. The company’s financial opacity is especially noticeable when compared with public materials or industrial-biotech analogs that disclose standard metrics. For this chapter, traction is therefore a proof-of-interest signal, not proof of revenue quality.
  claimRefs:
  - CI012
  - CI013
  - CI014
  - CI015
  - CI016
  - CI029
  - CI030
  - CI032
  - CI041
  tableRefs: []
  figureRefs: []
- id: sales-efficiency-and-unit-economics
  title: Sales Efficiency and Unit Economics Proxies
  body: There is not enough public evidence to build a true Spiber unit-economics model, but there is enough to infer where the pressure points sit. A partner-led advanced-materials business usually incurs long qualification cycles, application-development expense, and substantial customer education before recurring orders emerge. Spiber’s public emphasis on launches, partner projects, and category-building is consistent with that pattern. At the manufacturing layer, the Thailand plant and the company’s continued feedstock optimization efforts imply a cost structure that is sensitive to throughput, yield, and raw-material choice. Crucially, none of the sources here disclose output, utilization, COGS composition, or payback. That means the right analytical move is not to guess margins from excitement, but to treat sales efficiency and unit economics as unresolved underwriting questions.
