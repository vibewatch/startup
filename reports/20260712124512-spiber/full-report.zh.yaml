      - number: '2.4'
        title: 增长驱动与商业约束
        blocks:
          - type: paragraph
            body: >-
              纸面需求很强。市场研究反复提到轻量高强生物材料、可持续性要求、精密发酵进步，以及高端品牌需求，把它们列为结构性增长驱动。但商业化仍被成本、吞吐量和标准化卡住。Mordor 的成本讨论尤其有用：当前价格接近每公斤
              USD 300，且工厂吞吐量需要大幅提高，这解释了为什么市场仍集中在高端胶囊系列和技术展示。IP
              密度也是摩擦点，因为庞大的专利丛林会让授权、绕开设计和多供应商策略更复杂。实际含义是，市场可以在小基数上快速增长，同时个别公司仍会受现金约束。对 Spiber
              来说，增长驱动不是问题；更难的是把这些驱动转成低成本、可靠供给，并达到商业上可接受的定价。
