      - number: '1.4'
        title: 商业化、工厂里程碑与标准认可
        blocks:
          - type: paragraph
            body: >-
              Spiber 的里程碑轨迹显示，公司确实推进了商业化，尽管财务仍不透明。泰国工厂被描述为集团第一座量产设施，如今公司页面和可持续发展材料进一步强化了它的角色：聚合物生产放在 Rayong，并与 Bonsucro
              认证糖源绑定。2024 年公开披露称，已有 15 个品牌推出使用 Spiber 材料的产品；更新的公司材料把范围扩大到 40 多个品牌、200 多个单品，以及 80 多家制造商生态。标准制定也重要：2021 年
              ISO 2076 修订明确纳入合成蛋白纤维，让 Brewed Protein 面向买家和伙伴时有了更强的分类叙事。合起来看，Spiber
              已跨过几道能力门槛——工业工厂、标准认可和真实产品采用——即便还没有跨入清晰的财务自给阶段。
