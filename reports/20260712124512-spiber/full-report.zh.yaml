  - id: FR003
    title: 失效模式流程
    type: flow
    summary: 最可能的下行情景不是单一技术失败，而是成本、客户和资本摩擦叠加。
    data:
      nodes:
        - id: cost
          label: 高成本 / 低利用率
        - id: slow
          label: 客户放量慢
        - id: cash
