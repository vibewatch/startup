            body: >-
              Evolved By Nature、Modern Meadow、Ginkgo Bioworks 等相邻公司很重要，因为即便产品不等同于 Brewed Protein
              纤维，它们也会争夺一部分相同的可持续性、创新和材料预算。Evolved By Nature 主打用于护肤、皮革整理和纺织品的 Activated Silk；Modern Meadow 强调 INNOVERA
              和更宽的生物制造；Ginkgo 更适合作为赋能平台，而不是品牌材料对手。相比之下，Toray、Teijin、BASF 这类既有巨头不需要销售人造蜘蛛丝，也能给 Spiber
              施压。它们的规模、既有客户关系、全球分销和宽材料组合，让它们能够守住预算，或把生物基特性吸收到更大的产品包里。竞争框架因此分成两层：一层是直接新材料同业，另一层是工业既有巨头。
