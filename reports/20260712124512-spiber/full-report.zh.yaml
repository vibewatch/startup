  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流与商业模式
        blocks:
          - type: paragraph
            body: >-
              Spiber 的公开财务故事要从它看起来在卖什么说起。证据支持的是 B2B 材料模式，而不是直接面向消费者或软件订阅模式。Brewed Protein
              以多种形态营销——纤维、树脂、薄膜和相关格式——近期沟通又增加了面向配料和 CPG
              伙伴的食品蛋白邻近方向。这意味着至少有三条可能变现路径：向纺织和工业应用销售材料，与品牌或配料伙伴共同开发获得收入，以及未来从食品蛋白商业化中获得配料收入。公开记录没有显示的是，这些收入流当前如何组合、是否有任何一条具备经常性收入属性、定价是标准化还是完全谈判。实际结论是，Spiber
              纸面上有多个变现选项，但仍像一个复杂的企业材料业务，经济性取决于认证、伙伴开发和生产规模化。
