          label: 当前宽估值区间
      edges:
        - from: history
          to: premium
          label: 保留下来的优势
        - from: history
          to: discount
          label: 过期估值重置
        - from: premium
          to: range
          label: 抵消下行
        - from: discount
          to: range
          label: 削低旧头条估值
    claimRefs:
      - CV017
