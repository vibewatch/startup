companyProfile:
  summary: >
    Spiber 是一家位于 Tsuruoka 的日本生物技术和先进材料公司，核心是 Brewed
    Protein™：一个用精密发酵生产结构蛋白的平台，可把蛋白转成纤维、薄膜、树脂和其他材料形态。公司用了近二十年，从结构蛋白研究和学术根基走向商业规模制造、品牌合作，以及更宽的平台野心；如今版图还包括食品蛋白。公开证据显示，Spiber
    有实质客户验证和战略稀缺性，但也在 2025-2026 年遭遇严重资本危机，被迫在新领导层下重启。
  foundedDate: '2007-09-01'
  founders:
