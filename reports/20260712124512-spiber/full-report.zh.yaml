  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              定义 Spiber 市场，最有用的方式不是“所有纺织品”，甚至也不是“所有生物材料”，而是更窄的一块：性能、可持续性和故事性都足够重要，足以支撑一种新材料。Brewed Protein
              在服装中直接对标羊绒、羊毛等高端动物纤维；在可降解性或原料结构重要的场景中，对标石油基合成材料；在涂层、薄膜和特种应用中，还要面对越来越多工程化生物材料。边界随后向邻近市场外扩，例如食品蛋白、技术内饰或涂层等
              Spiber 蛋白平台可能发挥作用的领域。这个区分重要，因为投资者常把每一种可能的蛋白材料用例都当成马上可触达，从而高估
              TAM。公开证据支持宽平台机会，但近期商业上可触达的市场远比最大标题市场数字更窄，也更高端。
