    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与布局
        blocks:
          - type: paragraph
            body: >-
              与其把 Spiber 看成一家时尚材料初创公司，不如把它看成一家日本结构蛋白商业化公司。公司 2007 年成立于 Yamagata Prefecture 的
              Tsuruoka，企业身份至今仍锚定当地，但运营布局更宽：Paris 支撑欧洲商业活动，Thailand 的 Rayong 承载发酵量产基础设施，把 Brewed Protein
              从研发故事推向工业故事。公开材料始终把使命放在可持续福祉和环境问题解决上，但产品叙事很具体：Spiber 在 DNA
              层面设计蛋白聚合物，用微生物发酵制造，再转化为纤维、薄膜、树脂和相关材料形态。合成生物学平台、材料科学和制造布局三者叠在一起，后文才需要区分科学新颖性和真实供应链就绪度。
