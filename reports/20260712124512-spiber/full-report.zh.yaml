    title: 估值桥流程
    type: flow
    summary: Spiber 当前价值是在溢价驱动因素和重组折价之间拉扯出来的。
    data:
      nodes:
        - id: history
          label: 历史独角兽估值
        - id: premium
          label: 技术 / 客户 / 稀缺性溢价
        - id: discount
          label: 债务 / 不透明 / 执行折价
