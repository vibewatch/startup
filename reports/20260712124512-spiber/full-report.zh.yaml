      - number: '2.5'
        title: 监管摩擦与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              监管在这个市场里有两面性。纺织品中，近期最大的监管问题不是产品审批，而是声明举证：生物材料品牌越来越需要用可信证据支撑环保表述，欧洲尤其如此。到了食品蛋白，门槛会高得多，因为正式授权框架开始适用。EU
              新食品制度和 UK Food Standards Agency 指引都指向真正新型配料的上市前授权要求。即便最终材料本身不是 GMO，生物安全框架仍然重要，因为工程微生物是生产系统的一部分。这意味着 Spiber
              更宽的平台故事可信，但不同垂直的上市时间和合规成本差异很大。关键未解缺口在于，Spiber 不公布自己的 TAM/SAM/SOM
              模型，也不公布逐垂直收入预期；投资者仍需要管理层输入，才能把市场可能性转成现实需求预测。
