      role: 联合创始人；前 CEO，现任技术负责人
      background: |
        2026 年公开过渡材料显示，Sekiyama 在带领 Spiber 走过最初规模化阶段后，退出一线管理，转向攻克技术和产品开发瓶颈。
      claimRefs:
        - CO008
  foundingLocation: Tsuruoka, Yamagata Prefecture, Japan
