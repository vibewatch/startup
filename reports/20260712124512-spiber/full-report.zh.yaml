              公开强调发布、伙伴项目和品类建设，与这一模式一致。在制造层面，泰国工厂和公司持续推进的原料优化，意味着成本结构对吞吐量、收率和原料选择敏感。关键是，这些来源都没有披露产出、利用率、COGS
