      - number: '1.5'
        title: 负面背景与披露限制
        blocks:
          - type: paragraph
            body: >-
              Spiber 概览里最主要的警示信号，是技术和合作伙伴动能没有挡住资产负债表危机。2026 年独立报道描述了一场近乎致命的债务局面：约 JPY 40 billion 在 2025
              年底到期，并引发所有权和管理层重置。这个背景会改变投资者解读每个正面里程碑的方式。公司显然保住了足够的合作伙伴支持，才得以保存平台并以 New Spiber
              重启；但外部观察者仍无法核验当前收入、毛利率、现金、剩余负债，或重组后准确股权结构表。另有证据显示，成本仍是战略瓶颈：商业化仍主要依靠高端定位和混合材料。简言之，Spiber
              的概览支撑一个真实、材料可信度异常强的深科技资产，但仅凭公开证据，还不能干净地得出商业模式已经耐久的结论。
