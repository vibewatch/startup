            body: 食品蛋白可能扩大 TAM，但也把欧盟、英国和美国审批框架带进来；服装合作不需要面对这些。
            calloutType: insight
            claimRefs:
              - CR015
              - CR016
              - CR017
              - CR018
              - CR037
          - type: callout
            title: 看重置后的证据，不看重置前的承诺
            body: 任何严肃尽调都应聚焦 2026 年后跑道、债务条款、工厂 KPI，以及新实体的客户可重复性数据。
            calloutType: recommendation
            claimRefs:
              - CR034
              - CR035
              - CR040
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 历史估值锚点及其为何失效
        blocks:
          - type: paragraph
            body: >-
              Spiber 最清晰的历史锚点，是 2021 年 9 月 Series E 对应的 $1.22B
              私募估值。这个标记仍然重要，因为它记录了投资人愿意用独角兽尺度资助一个大胆工业生物技术材料命题的时刻。但若不做大幅调整，它不能被当作当前公允价值。公司随后在 2024 年又融到约 $65M
              等值资金，但公开证据并未清楚显示新的披露重定价。更重要的是，2026
              年债务危机以及新领导层下的重启，打断了原先高光估值的连续性。用于估值时，旧独角兽标记现在最好只作为参照点和上限记忆，而不是关于当前股权价值的事实主张。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV039
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
      - number: '8.2'
        title: 哪些部分仍配得上溢价
        blocks:
          - type: paragraph
            body: >-
              重置之后，Spiber
              仍比普通困境材料初创更值得给分，因为底层确有实质资产。公司有可见的蛋白工程平台、制造资产基础、异常强的具名客户验证，也在多种材料形态和未来食品蛋白上保留选择权。上述特征形成战略稀缺性：很少有气候材料公司能同时拿出类似的技术深度、品牌相关性和工业化野心。因此，把公司简单归零太粗暴。但溢价逻辑应落在这些仍存的战略资产上，而不是旧融资估值。换句话说，Spiber
              仍可能具备有意义的期权价值，只是现在必须用严苛得多的执行视角定价。
            claimRefs:
              - CV006
              - CV007
              - CV017
              - CV025
              - CV029
              - CV030
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV017
              - CV025
              - CV029
              - CV030
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV017
              - CV018
              - CV027
              - CV028
              - CV029
              - CV036
      - number: '8.3'
        title: 可比框架与现实校验
        blocks:
          - type: paragraph
            body: >-
              可比分析很难，因为没有完美上市可比。BASF、Toray 等成熟巨头展示了材料行业的规模、披露和现金生成是什么样，但它们过于多元、也过于成熟，不能直接当估值参照。Ginkgo
              这类上市工业生物技术平台在资本密集度和市场怀疑度上更接近，但商业模式仍不同。AMSilk、Evolved by Nature、Modern Meadow、Kraig
              等方向性私营同行有助于界定生物材料集合，但公开价格发现有限。因此，可比公司的正确用法不是硬套一个虚假倍数，而是三角定位 Spiber
              在战略平台选择权与硬现金流纪律之间应处的位置。这个成熟度阶梯框架，往往比单一倍数更有信息量。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV018
              - CV041
              - CV042
          - type: table
            tableRef: TV003
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV006
            claimRefs:
              - CV041
              - CV042
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV041
              - CV042
      - number: '8.4'
        title: 情景区间与折价
        blocks:
          - type: paragraph
            body: >-
              在公开信息缺口下，做情景分析比给精确数更诚实。悲观情景应假设高端小众需求延续、成本平价仍遥远，且重组后股权价值明显低于旧独角兽标记。基准情景应假设重置稳定平台、保住合作伙伴相关性，并保留改善经济性的可信路径，但相对
              2021 年的乐观仍有大幅折价。乐观情景应假设工厂经济性、重复项目和平台聚焦改善到足以重新支撑低端独角兽叙事。区间必须保持很宽，因为隐藏债务条款、稀释和单位经济表现都可能大幅摆动价值。
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
          - type: table
            tableRef: TV004
            claimRefs:
              - CV020
              - CV021
              - CV022
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
      - number: '8.5'
        title: 估值结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              公开记录能支持的估值结论是：Spiber 有战略价值，但财务不透明。比起“便宜”，说估值被拉得紧更站得住，因为 2026
              年重置后，下行不透明度仍大；但直接放弃也会忽视真实技术、真实伙伴和真实战略稀缺性。当前最可辩护的框架，是低置信度区间，并给出继续研究的建议。若要推进，投资人需要一座重置后的估值桥：先从债务、现金和工厂 KPI
              出发，再看客户可重复性和分部利润率。信息披露前，2021 年独角兽高光估值应只作为历史引用，不能拿来承销。换句话说，投资人应为存活下来的期权估值，而不是假设旧溢价自然保留。这个谨慎判断，就是本章核心结论。
            claimRefs:
              - CV024
              - CV026
              - CV027
              - CV028
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV005
            claimRefs:
              - CV024
              - CV027
              - CV028
              - CV038
              - CV039
              - CV040
      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: 旧独角兽标记是历史，不是当前真相
            body: 2021 年 $1.22B 估值仍可作为锚点，但 2026 年重组意味着，若不打入深度重置折价，就不能向前沿用。
            calloutType: insight
            claimRefs:
              - CV001
              - CV004
              - CV010
              - CV039
          - type: callout
            title: 估值不透明仍是核心问题
            body: 最大问题不是没有战略价值，而是缺少债务、现金和单位经济数据，无法把战略价值折算成当前股权价格。
            calloutType: risk
            claimRefs:
              - CV024
              - CV027
              - CV038
          - type: callout
            title: 使用宽情景，不要虚假精确
            body: 在新实体披露重置后资本结构和经营表现之前，区间框架比点估值目标更诚实。
            calloutType: recommendation
            claimRefs:
              - CV023
