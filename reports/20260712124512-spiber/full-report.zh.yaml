              Spiber 最清晰的公开财务事实是：它反复需要外部资本，最终仍撞上墙。2021 年资本包、2024 年约等于 $65 million 的融资轮，以及 Tracxn 约 $489 million
              的累计融资数字，共同支撑了一个商业化过程中重度依赖融资的叙事。随后独立报道加入最硬的事实：约 JPY 40 billion 债务在 2025 年底到期，重组严厉到足以在新领导层下创建 New
