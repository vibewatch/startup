      - number: '1.2'
        title: 领导层重置与治理
        blocks:
          - type: paragraph
            body: >-
              Spiber 近年最重要的变化不是一次产品发布，而是治理重置。2026 年 4 月公开材料显示，公司以 “New Spiber” 重启运营，Maya Kawana 全面负责业务战略、治理和早期变现。创始人
              Kazuhide Sekiyama 和 Junichi Sugahara 没有离开，而是退出一线管理，集中解决技术瓶颈并加速商业化。这是科学角色与管理角色的一次重要切分。2025 年 12
              月的支持协议提供了有用背景：它在正式启动前引入 Kawana，说明她此前在 Goldman Sachs 和 BOLD
              的经历，也释放出这次变化是有计划推进，而非突然发生。仍不清楚的是完整董事会构成、保护性权利和重组后股权图；因此，治理可见度比过去更好，但对投资者仍不完整。
