      - number: '2.3'
        title: 买家分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              买家进入这个市场时，目标并不一样。高端时尚和户外品牌看重叙事、可追溯性、降低对动物或化石原料的依赖，以及差异化手感；它们可以接受小批量胶囊系列，以及仍带有高单位成本的混纺比例。工业或技术买家则更关心机械性能、认证、供给保障和导入风险。结果就是分阶段采用路径。服装是最清晰的第一市场，因为品牌能用小批量、高定价和故事性来吸收不确定性。汽车、防务或生物医药客户未来单个项目支出可能更高，但它们需要更高标准化，也需要可靠的多年供给。Spiber
              的公开牵引力符合这套逻辑：验证点压倒性集中在高端服装和相邻展示型应用，食品蛋白和工业材料则仍有前景，但商业化更早期。
