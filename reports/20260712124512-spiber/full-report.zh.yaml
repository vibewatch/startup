  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接同业格局
        blocks:
          - type: paragraph
            body: >-
              直接竞争集合比宽泛生物材料名单暗示的更小。Spiber 最相关的同业包括正在尝试把新型蛋白材料工业化的结构蛋白或蜘蛛丝公司，尤其是 AMSilk，以及历史上的 Bolt Threads。第三方初创公司名单反复把
              Spiber、AMSilk 和 Bolt Threads 放在一起，Kraig Biocraft
              则以转基因蚕路线作为技术路径变体出现。这一点重要，因为它提醒投资者区分真正直接同业、相邻生物材料公司，以及只会间接竞争的巨头。到 2026 年，直接同业问题也发生了实质变化，因为 Bolt
              已不再运营。这并不意味着竞争消失；它只是把战场转向更少的存活专业玩家和强大的替代品。
