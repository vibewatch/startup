  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台架构与设计逻辑
        blocks:
          - type: paragraph
            body: >-
              Spiber 应被理解为可编程蛋白平台，而不是单一“蜘蛛丝产品”。公司公开材料持续描述精密发酵、定制 DNA
              设计，以及把植物来源原料转化为结构蛋白，再表达为不同材料形态。这一点重要，因为它把技术论题从一个仿生主张，拓宽成更可适配的材料工程栈。食品蛋白线强化了同一点：Spiber
              正用同一套基础能力，在服装之外追逐功能蛋白。最强的解读是，公司护城河在于设计有用的蛋白家族，并把它们整合成可制造输出，而不只是复制一种知名天然材料。这套架构有战略吸引力，因为它支撑多垂直可选性；但也抬高了尽调负担：投资者不仅需要证明科学有效，还需要证明一条或多条输出路径能以经济方式规模化。
