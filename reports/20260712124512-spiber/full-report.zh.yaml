            body: >-
              Spiber 的融资方式更像一家不断上调估值的深科技平台公司，而不是一家轻资本服装供应商。2021 年资本包仍是最重要的历史标记：Spiber 在 2021 年 9 月宣布 JPY 34.4 billion，12
              月又宣布 JPY 5 billion；第三方市场数据则记录了一轮 $313 million Series E，投后估值 $1.22 billion。公开记录还显示，2018 年有 $44.1 million
              Series D，2024 年又完成超过 JPY 10 billion、约 $65 million 的延展轮。这些事实支持把 Spiber
