      - number: '2.2'
        title: 多个测算镜头，而不是一个确定 TAM
        blocks:
          - type: paragraph
            body: >-
              已发布的人造蜘蛛丝市场数据有方向性价值，但差异太大，不足以支撑一个精确 TAM 主张。Mordor 把 2025 年品类规模放在约 USD 1.95 billion，Market.us 采用 USD 1.4
              billion 的 2024 年基数并预计 2034 年达到 USD 3.4 billion，Research and Markets 则给出小得多的 2030
              年终点。这些差异不只是噪音；它们反映了不同市场边界、细分假设，以及是否纳入相邻的涂层、医疗或航空航天用途。各研究中更重要的共识不是具体美元数，而是：这个品类真实存在、在增长，且仍受供给约束。尽调时更好的方法，是同时使用多个镜头——品类
              TAM、高端服装 SAM，以及基于高端发布形式和客户认证周期的 Spiber 专属 SOM——而不是过度贴合任何一份付费报告标题。
