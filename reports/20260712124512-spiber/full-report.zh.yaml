              个品牌发布产品的早期证据。这些都是有用的采用标记，但不能替代收入年化速率、ARR、毛利率或净留存。缺少这些分母很重要，因为如果销量低、价格带促销性质，或认证成本仍高，一个业务即便有令人兴奋的发布，也仍可能陷入财务困境。与披露标准指标的公开材料公司或工业生物技术类比公司相比，Spiber
              的财务不透明尤其明显。因此在本章中，牵引力是兴趣验证信号，不是收入质量证明。
