              描述的运营路线图则最终指向每年数百吨。产品上，平台已覆盖纤维、薄膜、类树脂材料、涂层和整理技术，食品蛋白和其他功能蛋白也进入路线图。公司当前商业化策略看起来务实使用这些形态：有用时讲完整纤维故事；成本或性能需要折中时用混纺；蛋白功能无需完全替换材料即可创造价值时，用表面或添加剂应用。这是合理的深科技规模化路径，但公开记录仍缺少吞吐量、收率和利用率指标，无法证明制造卓越，而只能证明制造存在。
