- id: tech-verdict
  title: Technology Verdict and Remaining Unknowns
  body: 'The overall product-and-technology verdict is favorable on differentiation and less favorable on disclosed scale certainty. Spiber clearly has real science, patentable process work, multiple product forms, and repeated external validation through projects and manufacturing partnerships. That is enough to conclude the platform is technically serious and commercially relevant. What it is not enough to conclude is whether the core biological and manufacturing KPIs are strong enough for durable, mass-scale economics. Missing data on titers, yields, defect rates, uptime, and cost per kilogram keep the story from graduating to fully underwritten industrial confidence. Investors should therefore separate two claims: first, that Spiber has built a meaningful deep-tech platform; second, that the platform has already solved the hardest scale and cost problems. The first is well supported; the second is not yet public fact.'
