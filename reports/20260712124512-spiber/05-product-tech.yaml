- id: application-flexibility
  title: Application Flexibility and Commercial Translation
  body: The most persuasive practical evidence for the platform is its breadth of end-market expression. Brewed Protein shows up in sweaters, hoodies, couture garments, outerwear, T-shirts, and broader collections across multiple geographies and brand types. That application diversity suggests the material system is adaptable in hand-feel, blend ratio, performance profile, and manufacturing interface. The Spiber Tee 001 launch is especially useful because it discloses a concrete 7% blend, odor-control positioning, and a Japan-made production chain, making the technical story more tangible than most luxury capsules. At the same time, the portfolio still skews premium and curated. That means technical transfer is real, but mass-market readiness remains unproven. For now, Spiber’s strongest application advantage is flexibility, not yet ubiquitous deployment.
  claimRefs:
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
  - CE020
