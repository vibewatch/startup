company:
  name: Spiber
chapter:
  number: 5
  title: Product & Technology
  summary: 'Spiber has one of the more credible synthetic-protein platforms in climate materials: a precision-fermentation stack with visible scientific output, patent activity, and repeated application transfer into real products. The platform looks technically differentiated, but public evidence still does not resolve the decisive scale KPIs such as yield, utilization, and cost-per-kilogram.'
sections:
- id: platform-architecture
  title: Platform Architecture and Design Logic
  body: 'Spiber should be understood as a programmable protein platform rather than a single “spider silk product.” The company’s public materials consistently describe precision fermentation, tailored DNA design, and conversion of plant-derived inputs into structural proteins that can later be expressed as different material formats. That matters because it broadens the technical thesis from one biomimetic claim to a more adaptable materials-engineering stack. The food-protein line reinforces the same point: Spiber is leveraging the same base capability to pursue functional proteins outside apparel. The strongest interpretation is that the company’s moat lies in designing useful protein families and integrating them into manufacturable outputs, not merely in reproducing a famous natural material. This architecture is strategically attractive because it supports multi-vertical optionality, but it also makes the diligence burden higher: investors need proof not only that the science works,
    but that one or more output lanes can scale economically.'
  claimRefs:
  - CE001
  - CE002
  - CE005
  - CE006
  - CE021
  - CE022
  - CE024
  tableRefs:
