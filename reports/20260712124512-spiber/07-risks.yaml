chapter:
  number: 7
  title: Risks
  summary: Spiber’s risk profile is high because capital, cost, and commercialization risks have already interacted badly enough to force a 2026 reset. The platform remains real and valuable, but the public record still leaves post-restructuring debt, runway, plant economics, and repeatable customer depth largely opaque.
sections:
- id: restructuring-and-capital-risk
  title: Restructuring, Leadership, and Capital Risk
  body: The dominant risk frame for Spiber in 2026 is capital and corporate stability. The public record shows a company that raised extraordinary sums, still hit a debt wall, and then relaunched under a new management structure with explicit language about profitability and monetization. That combination is not fatal, but it is serious. It means investors cannot treat Spiber as a conventional late-stage growth story where the remaining question is simply sales execution. Instead, they have to ask whether the 2026 entity has genuinely reset the operating model and capital structure enough to survive the final stretch from technical promise to economically durable commercialization. Leadership change compounds that uncertainty because it can affect culture, prioritization, partner confidence, and financing access all at once.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR029
  - CR030
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: scale-cost-and-focus-risk
  title: Scale, Cost-Parity, and Focus Risk
  body: 'Spiber’s second major risk cluster is industrial execution. Independent reporting and Spiber’s own materials both suggest that the company is still commercializing through premium blends, targeted applications, and stepwise wedges rather than commodity-scale replacement. That is rational, but it means cost parity and manufacturing efficiency remain open questions. The platform is also broad: fibers, finishes, food proteins, and other categories all compete for attention. Breadth can create optionality, but it also creates the danger that management spreads scarce resources too thinly across too many lanes before any one achieves reliable economics. The missing plant metrics—yield, uptime, throughput, utilization, cost per kilogram—make this the most important unresolved risk category after capital structure. Investors should read every new launch as evidence of demand interest, not evidence that factory economics are solved.'
  claimRefs:
  - CR007
  - CR008
  - CR009
  - CR010
  - CR011
  - CR026
  - CR039
  tableRefs:
  - TR002
  figureRefs:
  - FR002
- id: adoption-and-operational-risk
  title: Customer Adoption, Delivery, and Operational Risk
  body: 'Customer traction reduces risk, but it does not eliminate it. Spiber can show real named collaborations and launched products, yet those proofs still skew toward premium, design-forward, or capsule formats rather than disclosed large procurement programs. That creates a classic advanced-materials risk: the company may be admired, sampled, and even launched by brands without yet reaching durable purchasing depth. Operationally, the company also depends on a broad manufacturing ecosystem and a Thailand-centered production system, both of which introduce coordination, QA, and concentration challenges. Novel materials often fail not because the core molecule is impossible but because the surrounding delivery system never becomes boring and reliable enough for mainstream buyers.'
  claimRefs:
  - CR012
  - CR013
  - CR014
  - CR023
  - CR024
  - CR025
  - CR037
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: regulatory-legal-and-ip-risk
  title: Regulatory, Legal, and IP Risk
  body: 'Regulatory and legal risk are asymmetric across Spiber’s opportunity set. Apparel uses are comparatively lighter from a product-approval standpoint, but the moment Spiber pushes deeper into food proteins the risk profile changes materially. EU novel-food rules, UK novel-food authorization, and US GRAS / food-additive frameworks all imply time, evidence, and procedural burden before a novel protein ingredient can scale commercially. Separately, sustainability-centered marketing creates legal exposure if claims about environmental benefit, biodegradability, or footprint reduction are not substantiated. Visible patent activity is a strength, yet it does not remove freedom-to-operate or claim-scope risk. In short: apparel is commercially hard, food is commercially and regulatorily hard, and sustainability messaging must remain disciplined throughout.'
  claimRefs:
  - CR015
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
  - CR021
