  claims:
  - id: CV001
    statement: The best-supported public valuation anchor for Spiber is the $1.22 billion mark attached to the September 2021 Series E round.
    type: third-party-reported
    topic: valuation-history
    sourceRefs:
    - SV001
    - SV002
    - SV027
    confidence: high
    freshness: historical
    answersQuestionRefs:
    - QV001
  - id: CV002
    statement: No equally clear public source shows a higher post-money valuation for the April 2024 round; the latest round is better understood as an extension of financing support than a fresh public repricing event.
    type: inferred
    topic: valuation-history
    sourceRefs:
    - SV003
    - SV004
    - SV005
    - SV006
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV001
  - id: CV003
    statement: Tracxn’s roughly $489 million cumulative-funding figure and the $65 million-equivalent 2024 raise indicate that investors continued to fund the platform despite incomplete profitability.
    type: third-party-reported
    topic: funding
    sourceRefs:
    - SV001
    - SV004
    - SV005
    - SV006
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QV001
  - id: CV004
    statement: The 2026 restructuring is strong evidence that the 2021 unicorn valuation should not be accepted at face value for current underwriting without a reset analysis.
    type: inferred
    topic: valuation-history
    sourceRefs:
    - SV007
    - SV008
    - SV009
    - SV010
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV002
  - id: CV005
    statement: A debt crisis severe enough to force a relaunch usually implies either hidden downside to equity value or a material reprioritization of claims on enterprise value.
    type: inferred
    topic: downside-risk
    sourceRefs:
    - SV007
    - SV008
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV002
  - id: CV006
    statement: 'The strongest bullish argument for valuation is platform optionality: Spiber spans advanced fibers, other material forms, and potentially food proteins.'
    type: inferred
    topic: bull-case
    sourceRefs:
    - SV023
    - SV024
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV003
  - id: CV007
    statement: 'The second bullish argument is traction quality: named customer proof and current ecosystem counts are unusually strong for a private industrial-biotech company.'
    type: inferred
    topic: bull-case
    sourceRefs:
    - SV022
    - SV028
    - SV029
    - SV030
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV003
  - id: CV008
    statement: The strongest bearish argument is that public revenue, gross margin, and cash-flow visibility are all inadequate for a unicorn-level valuation after restructuring.
    type: inferred
    topic: bear-case
    sourceRefs:
    - SV007
    - SV010
    - SV026
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV004
  - id: CV009
    statement: WIPO’s description of profits being limited to small shipments and partner contract money is directionally inconsistent with a mature scale valuation.
    type: third-party-reported
    topic: bear-case
    sourceRefs:
    - SV026
    confidence: medium
    freshness: historical
    answersQuestionRefs:
    - QV004
  - id: CV010
    statement: A credible valuation framework must therefore discount historical private marks for financing conditions, scarcity premium, and subsequent distress.
    type: inferred
    topic: method
    sourceRefs:
    - SV001
    - SV002
    - SV007
    - SV008
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV005
  - id: CV011
    statement: Public public-market comps are imperfect because companies like BASF are mature diversified chemicals businesses and Ginkgo is a horizontal biotech platform, not a textile-material startup.
    type: inferred
    topic: comp-selection
    sourceRefs:
    - SV011
    - SV012
    - SV013
    - SV019
    - SV020
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV006
  - id: CV012
    statement: Even so, those public comps are useful as reality checks on disclosure expectations, capital intensity, and the value investors assign to platforms before durable cash generation.
    type: inferred
    topic: comp-selection
    sourceRefs:
    - SV011
    - SV012
    - SV013
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV006
  - id: CV013
    statement: 'BASF’s filing shows what mature materials scale looks like: large EBITDA, positive free cash flow, and full public disclosure, none of which Spiber currently offers.'
    type: third-party-reported
    topic: public-comps
    sourceRefs:
    - SV011
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV006
  - id: CV014
    statement: Ginkgo’s 10-K is a useful comp not because its business matches Spiber exactly, but because it shows how public investors treat capital-dependent industrial biotech platforms.
    type: third-party-reported
    topic: public-comps
    sourceRefs:
    - SV012
    - SV013
    - SV019
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV006
  - id: CV015
    statement: Private peer sets such as AMSilk, Evolved by Nature, and Modern Meadow suggest that the relevant comparable universe is specialized biomaterials companies with long commercialization arcs.
    type: inferred
    topic: private-comps
    sourceRefs:
    - SV014
    - SV015
    - SV016
    - SV017
    - SV018
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV007
  - id: CV016
    statement: Kraig Biocraft is another useful directional comp because it highlights how spider-silk narratives can diverge dramatically on route-to-scale, cost claims, and commercial maturity.
    type: inferred
    topic: private-comps
    sourceRefs:
    - SV021
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV007
  - id: CV017
    statement: Spiber’s valuation premium over many biomaterials peers historically came from its manufacturing ambition, financing depth, and high-visibility brand collaborations.
    type: inferred
    topic: premium-drivers
    sourceRefs:
    - SV001
    - SV022
    - SV025
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV007
  - id: CV018
    statement: 'Those same features now cut both ways: large plant ambition and large capital raised increase downside if economics still lag.'
    type: inferred
    topic: premium-drivers
    sourceRefs:
    - SV007
    - SV025
    - SV026
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV007
  - id: CV019
    statement: The right valuation question is therefore not whether Spiber once deserved a unicorn mark, but what current enterprise value range is consistent with a post-crisis deep-tech reset.
    type: inferred
    topic: method
    sourceRefs:
    - SV007
    - SV008
    - SV010
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV005
  - id: CV020
    statement: A bear case should assume continued premium-niche demand, incomplete cost improvement, and meaningfully lower equity value than the 2021 private mark.
    type: inferred
    topic: scenario-bear
    sourceRefs:
    - SV007
    - SV026
    - SV029
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV008
  - id: CV021
    statement: A base case should assume the new leadership stabilizes the company, narrows the roadmap, and preserves meaningful strategic option value, but still at a discount to the old unicorn headline.
    type: inferred
    topic: scenario-base
    sourceRefs:
    - SV009
    - SV010
    - SV022
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV008
  - id: CV022
    statement: A bull case should assume genuine plant-economics improvement, repeat customer programs, and monetizable expansion beyond premium apparel into higher-volume or higher-margin lanes.
    type: inferred
    topic: scenario-bull
    sourceRefs:
    - SV022
    - SV023
    - SV025
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV008
  - id: CV023
    statement: Because public operating data are sparse, scenario analysis is more defensible than single-point precision.
    type: inferred
    topic: method
    sourceRefs:
    - SV003
    - SV007
    - SV010
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV005
  - id: CV024
    statement: Current valuation confidence is low because the public record does not disclose debt terms, cash runway, customer concentration, or segment-level revenue.
    type: inferred
    topic: confidence
    sourceRefs:
    - SV007
    - SV008
    - SV010
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV009
  - id: CV025
    statement: The 2024 round shows that investors were still willing to support mass production and sales scale-up, which prevents a zero-like reading of equity value.
    type: company-claimed
    topic: supporting-factors
    sourceRefs:
    - SV004
    - SV005
    - SV006
    confidence: high
    freshness: recent
    answersQuestionRefs:
    - QV009
  - id: CV026
    statement: But the 2026 reset means any analyst should treat historical preferred-price marks as stale until the new entity proves economics and capital structure.
    type: inferred
    topic: confidence
    sourceRefs:
    - SV007
    - SV008
    - SV010
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV009
  - id: CV027
    statement: Comparable public filings also imply that the absence of disclosure itself deserves a discount, especially in capital-intensive industrial-biotech stories.
    type: inferred
    topic: discounts
    sourceRefs:
    - SV011
    - SV012
    - SV013
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV010
  - id: CV028
    statement: Another discount should be applied for execution concentration around one major scale-up system in Thailand.
    type: inferred
    topic: discounts
    sourceRefs:
    - SV025
    - SV026
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV010
  - id: CV029
    statement: 'A partial offset to those discounts is strategic scarcity: very few companies have Spiber’s combination of structural-protein IP, commercial plant ambition, and named brand proof.'
    type: inferred
    topic: offsets
    sourceRefs:
    - SV022
    - SV024
    - SV025
    - SV026
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV010
  - id: CV030
    statement: Food-protein optionality adds upside but should not yet be fully capitalized because it also imports regulatory burden and pre-revenue uncertainty.
    type: inferred
    topic: offsets
    sourceRefs:
    - SV023
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV010
  - id: CV031
    statement: Using only public evidence, a reasonable current enterprise-value range is better expressed in broad scenarios than in a single hard target.
    type: inferred
    topic: scenario-range
    sourceRefs:
    - SV007
    - SV010
    - SV022
    - SV026
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV011
  - id: CV032
    statement: A conservative bear range of roughly $250M-$450M reflects distressed-reset dynamics, limited disclosed revenue, and unresolved cost parity.
    type: inferred
    topic: scenario-range
    sourceRefs:
    - SV007
    - SV026
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV011
  - id: CV033
    statement: A base range of roughly $600M-$900M reflects surviving strategic value, real technology, real partners, and a successful but incomplete reset.
    type: inferred
    topic: scenario-range
    sourceRefs:
    - SV009
    - SV010
    - SV022
    - SV025
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV011
  - id: CV034
    statement: A bullish range of roughly $1.1B-$1.5B would require evidence that the reset preserved or rebuilt a path back toward the old unicorn thesis.
    type: inferred
    topic: scenario-range
    sourceRefs:
    - SV010
    - SV022
    - SV023
    - SV025
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV011
  - id: CV035
    statement: Those ranges are deliberately wide because hidden debt, dilution, and operating performance can move equity value materially without obvious public signals.
    type: inferred
    topic: scenario-range
    sourceRefs:
    - SV007
    - SV008
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV011
  - id: CV036
    statement: On stance, the public record supports describing Spiber as stretched rather than clearly cheap, because downside opacity remains large even after acknowledging platform quality.
    type: inferred
    topic: stance
    sourceRefs:
    - SV007
    - SV010
    - SV026
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV012
  - id: CV037
    statement: The correct recommendation is research-more, not pass outright, because the asset has clear technical and strategic substance that could support meaningful value if the reset works.
    type: inferred
    topic: stance
    sourceRefs:
    - SV022
    - SV025
    - SV026
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV012
  - id: CV038
    statement: 'The decisive diligence ask is a post-reset valuation bridge: current cap table, debt stack, cash, plant KPIs, and customer-repeatability metrics.'
    type: inferred
    topic: diligence
    sourceRefs:
    - SV007
    - SV010
    - SV025
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV013
  - id: CV039
    statement: Without that bridge, the historical $1.22B headline remains more useful as a reference point than as a current fair-value conclusion.
    type: inferred
    topic: diligence
    sourceRefs:
    - SV001
    - SV002
    - SV007
    - SV010
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV013
  - id: CV040
    statement: Overall, Spiber remains one of the more interesting climate-materials platforms in Asia, but its current valuation should be framed as low-confidence and highly execution-dependent.
    type: inferred
    topic: verdict
    sourceRefs:
