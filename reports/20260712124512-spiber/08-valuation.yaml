company:
  name: Spiber
chapter:
  number: 8
  title: Valuation
  summary: 'Spiber’s historical unicorn valuation is real as a reference point but stale as a current underwriting number after the 2026 restructuring. Public evidence supports a wide, low-confidence scenario range: the platform still has strategic scarcity and strong customer proof, but debt opacity, limited revenue disclosure, and unresolved plant economics justify a major reset discount.'
sections:
- id: historical-valuation-anchors
  title: Historical Valuation Anchors and Why They Are Stale
  body: The cleanest historical anchor for Spiber is the $1.22 billion private valuation attached to its September 2021 Series E. That mark still matters because it reflects a moment when investors were willing to fund a bold industrial-biotech materials thesis at unicorn scale. But it cannot be treated as current fair value without major adjustment. The company later raised another approximately $65 million equivalent in 2024, yet public evidence does not clearly indicate a fresh disclosed repricing. More importantly, the 2026 debt crisis and relaunch under new leadership break continuity with the original headline. For valuation purposes, the old unicorn mark is now best treated as a reference point and upper-bound memory, not as a present-day truth claim about equity value.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: what-still-deserves-a-premium
  title: What Still Deserves a Premium
  body: 'Spiber still deserves more credit than a generic distressed materials startup because there is real substance underneath the reset. The company has a visible protein-engineering platform, a manufacturing asset base, unusually strong named customer proof, and genuine optionality across materials forms and future food proteins. Those features create strategic scarcity: very few climate-materials companies can point to a comparable combination of technology depth, brand relevance, and industrial ambition. That is why a full collapse-to-zero interpretation is too simplistic. The premium case, however, should be based on these surviving strategic assets rather than on the old financing headline. In other words, Spiber may still warrant a meaningful option value, but that option value now needs to be priced through a much harsher execution lens.'
  claimRefs:
  - CV006
  - CV007
  - CV017
  - CV025
  - CV029
  - CV030
  tableRefs:
  - TV002
  figureRefs:
  - FV004
- id: comparable-framework
  title: Comparable Framework and Reality Checks
  body: Comparable analysis is difficult because no perfect public comp exists. Mature incumbents like BASF and Toray show what scale, disclosure, and cash generation look like in the materials world, but they are too diversified and too mature to serve as direct valuation analogs. Public industrial-biotech platforms like Ginkgo are closer in capital-intensity and market skepticism, though still different in business model. Directional private peers such as AMSilk, Evolved by Nature, Modern Meadow, and Kraig help define the biomaterials set, but public price discovery is limited. The right use of comps is therefore not to force a false multiple, but to triangulate where Spiber should sit on a spectrum between strategic platform optionality and hard-nosed cash-flow discipline. That maturity-ladder framing is often more informative than a single multiple comparison.
  claimRefs:
  - CV011
  - CV012
  - CV013
  - CV014
  - CV015
  - CV016
  - CV018
  - CV041
  - CV042
