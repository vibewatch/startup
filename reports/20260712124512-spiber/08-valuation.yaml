- id: valuation-verdict
  title: Valuation Verdict and Diligence Blockers
  body: The public-record valuation verdict is that Spiber is strategically valuable but financially opaque. A stretched stance is more defensible than a cheap stance because downside opacity remains large after the 2026 reset, yet a flat pass would ignore real technology, real partners, and real strategic scarcity. The most defensible current framing is a low-confidence range with research-more as the recommendation. To move beyond that, investors need a post-reset valuation bridge that starts from debt, cash, and plant KPIs and then moves to customer repeatability and segment margins. Until that information is available, the 2021 unicorn headline should be cited as history, not underwriting. Put differently, investors should value the surviving option, not assume the old premium is automatically intact. That caution is the core conclusion of this chapter.
  claimRefs:
