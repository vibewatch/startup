            body: >-
              Spiber’s technical credibility rests on more than fashion partnerships. The company maintains a visible
              scientific footprint through a curated academic-publications page and a patent trail that shows continued
              work on applied manufacturing methods. The scientific references, especially sequence-to-property research
              across spider silks, suggest a real understanding of protein architecture rather than superficial
              biomaterial branding. The 2025 WIPO patent record is also revealing: it centers on manufacturable
              protein/polymer fibers, sheath-core structures, and practical textile outcomes. Together, publications and
              patents imply a dual-track moat of science plus process engineering. That is materially stronger than a
              company whose evidence is limited to prototypes or vague trade-secret claims. Still, the public record
