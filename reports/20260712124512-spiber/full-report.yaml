      - number: '4.3'
        title: Sales Efficiency and Unit Economics Proxies
        blocks:
          - type: paragraph
            body: >-
              There is not enough public evidence to build a true Spiber unit-economics model, but there is enough to
              infer where the pressure points sit. A partner-led advanced-materials business usually incurs long
              qualification cycles, application-development expense, and substantial customer education before recurring
              orders emerge. Spiber’s public emphasis on launches, partner projects, and category-building is consistent
              with that pattern. At the manufacturing layer, the Thailand plant and the company’s continued feedstock
              optimization efforts imply a cost structure that is sensitive to throughput, yield, and raw-material
              choice. Crucially, none of the sources here disclose output, utilization, COGS composition, or payback.
              That means the right analytical move is not to guess margins from excitement, but to treat sales
              efficiency and unit economics as unresolved underwriting questions.
