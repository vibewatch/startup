      - number: '1.5'
        title: Adverse Context and Disclosure Limits
        blocks:
          - type: paragraph
            body: >-
              The main caution flag in Spiber’s overview is that technical and partnership momentum did not prevent a
              balance-sheet crisis. Independent coverage in 2026 describes a near-fatal debt situation, with
              approximately JPY 40 billion due at the end of 2025 and a resulting ownership and management reset. That
              context changes how investors should read every positive milestone. The company clearly retained enough
              partner support to preserve the platform and restart as New Spiber, but outside observers still cannot
              verify current revenue, gross margin, cash, remaining liabilities, or the exact post-restructuring cap
              table. There is also evidence that cost remains a strategic bottleneck: premium positioning and
              blended-material use still dominate commercialization. In short, Spiber’s overview supports a real
              deep-tech asset with unusually strong materials credibility, but it does not support a clean conclusion
              that the business model is already durable on public evidence alone.
