      - number: '2.3'
        title: Buyer Segments and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Buyers do not enter this market with the same objective. Premium fashion and outdoor brands care about
              narrative, traceability, reduced reliance on animal or fossil inputs, and differentiated hand feel; they
              can accept capsule launches and blend ratios that still carry high unit cost. Industrial or technical
              buyers instead care about mechanical performance, certification, supply assurance, and qualification risk.
              The result is a staged adoption path. Apparel is the clearest first market because brands can use small
              runs, premium pricing, and storytelling to absorb uncertainty. Automotive, defense, or biomedical
              customers may eventually spend more per program, but they require more standardization and dependable
              multi-year supply. Spiber’s public traction fits that logic: its proof points are overwhelmingly premium
              apparel and adjacent showcase applications, while food proteins and industrial materials remain promising
              but earlier in commercialization.
            claimRefs:
