      - number: '3.5'
        title: What Cannot Yet Be Ranked Cleanly
        blocks:
          - type: paragraph
            body: >-
              The competitive analysis has a real evidence limit that investors should keep visible. Public sources are
              reasonably good at telling us which companies exist, which technology route they emphasize, and whether
              they are still active. They are far worse at exposing current volumes, contribution margins, price
              realization, customer concentration, renewal behavior, or exact cost per kilogram across comparable
              material formats. That means any clean ranking of “who is winning” would be overconfident. The better
              interpretation is more conditional: Spiber looks like one of the few still-visible specialists with actual
              brand and manufacturing proof, AMSilk looks like the most obvious structural-protein peer, Kraig shows a
              distinct transgenic route, and incumbents retain distribution and financial power. Beyond that, real
              underwriting still depends on private commercial data.
