      - number: '2.2'
        title: Sizing Lenses Rather Than One Definitive TAM
        blocks:
          - type: paragraph
            body: >-
              Published market data on synthetic spider silk are directionally useful but too divergent to support one
              precise TAM claim. Mordor places the category near USD 1.95 billion in 2025, Market.us uses a USD 1.4
              billion 2024 base and reaches USD 3.4 billion by 2034, while Research and Markets publishes a much smaller
              2030 endpoint. Those differences are not just noise; they reflect different market boundaries, segment
              assumptions, and whether adjacent coatings, healthcare, or aerospace uses are included. What is consistent
              across the studies is more important than the exact dollar figure: the category is real, growing, and
              still supply-constrained. For diligence purposes, the better method is to use multiple lenses—category
              TAM, premium-apparel SAM, and Spiber-specific SOM based on premium launch formats and qualification
              cycles—rather than overfitting to any single purchased report headline.
