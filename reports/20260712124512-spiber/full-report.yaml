      - number: '3.2'
        title: Adjacent Players and Incumbent Alternatives
        blocks:
          - type: paragraph
            body: >-
              Adjacent companies such as Evolved By Nature, Modern Meadow, and Ginkgo Bioworks matter because they
              compete for some of the same sustainability, innovation, and materials budgets even when their products
              are not identical to Brewed Protein fiber. Evolved By Nature leans into Activated Silk for skincare,
              leather finishing, and textiles; Modern Meadow emphasizes INNOVERA and broader biofabrication; Ginkgo is
              better treated as an enabling platform than as a branded materials rival. By contrast, incumbents like
              Toray, Teijin, and BASF do not need to sell synthetic spider silk to pressure Spiber. Their scale,
              installed customer relationships, global distribution, and broad materials portfolios let them defend
              budgets or absorb bio-based features into larger offerings. That makes the competitive frame two-layered:
              direct novel-material peers at one level, and industrial incumbents at another.
