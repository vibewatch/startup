  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              The most useful way to define Spiber’s market is not “all textiles” and not even “all biomaterials,” but a
              narrower wedge where performance, sustainability, and story all matter enough to justify a novel material.
              Brewed Protein competes directly against premium animal fibers such as cashmere and wool in apparel,
              against petroleum-derived synthetics where biodegradability or feedstock profile matter, and against a
              growing group of engineered biomaterials in coatings, films, and specialty applications. The boundary then
              expands outward into adjacent markets where Spiber’s protein platform could matter, such as food proteins,
              technical interiors, or coatings. That distinction matters because investors often overstate TAM by
              treating every possible protein-material use case as immediately addressable. The public evidence supports
              a broad platform opportunity, but the commercially accessible near-term market is much narrower and more
              premium than the largest headline market numbers suggest.
            claimRefs:
              - CM010
