              - CV029
              - CV036
      - number: '8.3'
        title: Comparable Framework and Reality Checks
        blocks:
          - type: paragraph
            body: >-
              Comparable analysis is difficult because no perfect public comp exists. Mature incumbents like BASF and
              Toray show what scale, disclosure, and cash generation look like in the materials world, but they are too
              diversified and too mature to serve as direct valuation analogs. Public industrial-biotech platforms like
              Ginkgo are closer in capital-intensity and market skepticism, though still different in business model.
              Directional private peers such as AMSilk, Evolved by Nature, Modern Meadow, and Kraig help define the
              biomaterials set, but public price discovery is limited. The right use of comps is therefore not to force
              a false multiple, but to triangulate where Spiber should sit on a spectrum between strategic platform
              optionality and hard-nosed cash-flow discipline. That maturity-ladder framing is often more informative
              than a single multiple comparison.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV018
