          - type: callout
            title: Underwrite post-reset evidence, not pre-reset promise
            body: >-
              Any serious diligence process should focus on post-2026 runway, debt terms, plant KPIs, and
              customer-repeatability data from the new entity.
            calloutType: recommendation
