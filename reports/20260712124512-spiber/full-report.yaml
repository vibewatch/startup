      - number: '3.4'
        title: Moat Durability and Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              Spiber’s moat is strongest where several hard-to-copy elements overlap: protein-engineering know-how,
              fermentation infrastructure, material-form flexibility, and real downstream brand relationships. WIPO’s
              case study supports the IP-and-platform angle, while the public brand ecosystem supports the downstream
              angle. Still, the moat is not impregnable. No peer appears to have decisively solved category economics,
              and that means the long-term winner could be whichever player—or incumbent partner—combines acceptable
              cost with dependable supply and enough application development support. Bolt’s shutdown is an especially
              useful warning sign: high-profile biomaterials narratives can stall even after strong branding. The deeper
              threat to Spiber may eventually come from a scaled incumbent or enabling platform that can internalize
              bio-based capabilities inside a broader materials stack.
