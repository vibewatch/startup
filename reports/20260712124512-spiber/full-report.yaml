  - id: TV005
    title: Valuation diligence blockers table
    columns:
      - Missing input
      - Why it matters
      - Public status
      - Required diligence
    rows:
      - - Post-reset debt and cap table
        - Determines true equity residual
        - Not disclosed
        - Request full capitalization table
      - - Cash balance and runway
        - Determines urgency of next financing
        - Not disclosed
        - Request monthly cash and runway model
      - - Plant economics
        - Drives gross margin and scenario credibility
        - Not disclosed
        - Request yield, utilization, and cost per kg
      - - Customer repeatability
        - Separates launch proof from durable value
        - Not disclosed
        - Request reorder and concentration data
      - - Segment margin by lane
        - Determines which optionality deserves value
        - Not disclosed
        - Request economics for fibers vs other forms vs food
    notes: Without these inputs, valuation should remain low-confidence and range-based.
