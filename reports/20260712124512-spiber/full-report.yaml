      - number: '7.2'
        title: Scale, Cost-Parity, and Focus Risk
        blocks:
          - type: paragraph
            body: >-
              Spiber’s second major risk cluster is industrial execution. Independent reporting and Spiber’s own
              materials both suggest that the company is still commercializing through premium blends, targeted
              applications, and stepwise wedges rather than commodity-scale replacement. That is rational, but it means
              cost parity and manufacturing efficiency remain open questions. The platform is also broad: fibers,
              finishes, food proteins, and other categories all compete for attention. Breadth can create optionality,
              but it also creates the danger that management spreads scarce resources too thinly across too many lanes
              before any one achieves reliable economics. The missing plant metrics—yield, uptime, throughput,
              utilization, cost per kilogram—make this the most important unresolved risk category after capital
              structure. Investors should read every new launch as evidence of demand interest, not evidence that
              factory economics are solved.
