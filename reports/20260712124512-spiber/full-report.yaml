              - CR038
      - number: '7.5'
        title: Risk Verdict, Mitigants, and Diligence Priorities
        blocks:
          - type: paragraph
            body: >-
              Spiber’s risk profile is high, but not because the company lacks substance. In fact, the opposite is true:
              there is enough technology, customer proof, and investor history here that the remaining uncertainties
              matter even more. Public mitigants exist—named customers, real manufacturing assets, active IP, and a new
              leadership narrative centered on monetization—but they are not yet sufficient to offset the unresolved
              variables around debt, runway, unit economics, and repeatable demand. The cleanest integrated verdict is
              that Spiber faces a compound-risk problem: capital, cost, and commercialization friction interacting at
              the same time. That is survivable if management has truly narrowed the roadmap and repaired the balance
              sheet; it is dangerous if the new entity is mostly a rebranding of old constraints. The diligence burden
              is therefore unusually operational and legal, not merely narrative.
            claimRefs:
              - CR031
              - CR032
