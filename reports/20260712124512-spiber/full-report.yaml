  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Historical Valuation Anchors and Why They Are Stale
        blocks:
          - type: paragraph
            body: >-
              The cleanest historical anchor for Spiber is the $1.22 billion private valuation attached to its September
              2021 Series E. That mark still matters because it reflects a moment when investors were willing to fund a
              bold industrial-biotech materials thesis at unicorn scale. But it cannot be treated as current fair value
              without major adjustment. The company later raised another approximately $65 million equivalent in 2024,
              yet public evidence does not clearly indicate a fresh disclosed repricing. More importantly, the 2026 debt
              crisis and relaunch under new leadership break continuity with the original headline. For valuation
              purposes, the old unicorn mark is now best treated as a reference point and upper-bound memory, not as a
              present-day truth claim about equity value.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV039
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
      - number: '8.2'
        title: What Still Deserves a Premium
        blocks:
          - type: paragraph
            body: >-
              Spiber still deserves more credit than a generic distressed materials startup because there is real
              substance underneath the reset. The company has a visible protein-engineering platform, a manufacturing
              asset base, unusually strong named customer proof, and genuine optionality across materials forms and
              future food proteins. Those features create strategic scarcity: very few climate-materials companies can
              point to a comparable combination of technology depth, brand relevance, and industrial ambition. That is
              why a full collapse-to-zero interpretation is too simplistic. The premium case, however, should be based
              on these surviving strategic assets rather than on the old financing headline. In other words, Spiber may
              still warrant a meaningful option value, but that option value now needs to be priced through a much
              harsher execution lens.
            claimRefs:
              - CV006
              - CV007
              - CV017
              - CV025
              - CV029
              - CV030
