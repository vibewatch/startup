      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: This is now a compound-risk story
            body: >-
              Spiber’s main risk is not one failed experiment; it is the interaction of balance-sheet pressure, scale
              economics, and still-premium adoption.
            calloutType: risk
            claimRefs:
