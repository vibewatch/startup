  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Architecture and Design Logic
        blocks:
          - type: paragraph
            body: >-
              Spiber should be understood as a programmable protein platform rather than a single “spider silk product.”
              The company’s public materials consistently describe precision fermentation, tailored DNA design, and
              conversion of plant-derived inputs into structural proteins that can later be expressed as different
              material formats. That matters because it broadens the technical thesis from one biomimetic claim to a
              more adaptable materials-engineering stack. The food-protein line reinforces the same point: Spiber is
              leveraging the same base capability to pursue functional proteins outside apparel. The strongest
              interpretation is that the company’s moat lies in designing useful protein families and integrating them
              into manufacturable outputs, not merely in reproducing a famous natural material. This architecture is
              strategically attractive because it supports multi-vertical optionality, but it also makes the diligence
              burden higher: investors need proof not only that the science works, but that one or more output lanes can
              scale economically.
