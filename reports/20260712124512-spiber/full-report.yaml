chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Footprint
        blocks:
          - type: paragraph
            body: >-
              Spiber is best understood as a Japanese structural-protein commercialization company rather than just a
              fashion-material startup. The company was established in 2007 in Tsuruoka, Yamagata Prefecture, and still
              anchors its corporate identity there, but its operating footprint is broader: Paris supports European
              commercial activity and Rayong, Thailand houses the fermentation mass-production infrastructure that
              turned Brewed Protein from an R&D story into an industrial one. Public materials consistently frame the
              mission around sustainable well-being and environmental problem-solving, but the product framing is
              concrete: Spiber designs protein polymers at the DNA level, manufactures them through microbial
              fermentation, and converts them into fibers, films, resins, and related material forms. That mix of
              synthetic-biology platform, materials science, and manufacturing footprint matters because later chapters
              depend on the distinction between scientific novelty and actual supply-chain readiness.
