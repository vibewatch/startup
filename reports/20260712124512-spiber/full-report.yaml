            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
      - number: '8.5'
        title: Valuation Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              The public-record valuation verdict is that Spiber is strategically valuable but financially opaque. A
              stretched stance is more defensible than a cheap stance because downside opacity remains large after the
              2026 reset, yet a flat pass would ignore real technology, real partners, and real strategic scarcity. The
              most defensible current framing is a low-confidence range with research-more as the recommendation. To
              move beyond that, investors need a post-reset valuation bridge that starts from debt, cash, and plant KPIs
              and then moves to customer repeatability and segment margins. Until that information is available, the
              2021 unicorn headline should be cited as history, not underwriting. Put differently, investors should
              value the surviving option, not assume the old premium is automatically intact. That caution is the core
              conclusion of this chapter.
            claimRefs:
              - CV024
              - CV026
              - CV027
              - CV028
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV005
            claimRefs:
              - CV024
              - CV027
              - CV028
              - CV038
              - CV039
              - CV040
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The old unicorn mark is history, not current truth
            body: >-
              The 2021 $1.22B valuation still matters as an anchor, but the 2026 restructuring means it cannot be
              carried forward without a deep reset discount.
            calloutType: insight
            claimRefs:
              - CV001
              - CV004
              - CV010
              - CV039
          - type: callout
            title: Valuation opacity is still the main problem
            body: >-
              The biggest issue is not absence of strategic value; it is absence of the debt, cash, and unit-economics
              data needed to convert strategic value into a current equity price.
            calloutType: risk
            claimRefs:
              - CV024
              - CV027
              - CV038
          - type: callout
            title: Use wide scenarios, not false precision
            body: >-
              A range-based framework is more honest than a point target until the new entity discloses post-reset
              capital structure and operating performance.
            calloutType: recommendation
            claimRefs:
              - CV023
              - CV031
              - CV032
              - CV033
              - CV034
