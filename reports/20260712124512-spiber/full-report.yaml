  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct Peer Landscape
        blocks:
          - type: paragraph
            body: >-
              The direct competitive set is smaller than broad biomaterials lists imply. Spiber’s most relevant peer
              group includes structural-protein or spider-silk companies that are trying to industrialize novel protein
              materials, especially AMSilk and, historically, Bolt Threads. Third-party startup lists repeatedly place
              Spiber, AMSilk, and Bolt Threads together, with Kraig Biocraft appearing as a technology-route variant via
              transgenic silkworms. This matters because it shows investors should distinguish between true direct
              peers, adjacent biomaterial companies, and giant incumbents that compete only indirectly. The direct-peer
              question also changed materially by 2026 because Bolt is no longer operating. That does not make
              competition disappear; it simply shifts the field toward a smaller set of surviving specialists plus
              powerful substitutes.
