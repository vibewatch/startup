            claimRefs:
              - CV041
              - CV042
      - number: '8.4'
        title: Scenario Ranges and Discounts
        blocks:
          - type: paragraph
            body: >-
              Given the public-information gap, scenario analysis is more honest than precision. A bear case should
              assume premium-niche demand persists, cost parity remains distant, and the restructuring leaves equity
              value materially below the old unicorn mark. A base case should assume the reset stabilizes the platform,
              preserves partner relevance, and keeps open a credible path to improved economics, but still at a
              substantial discount to 2021’s optimism. A bull case should assume that plant economics, repeat programs,
              and platform focus improve enough to re-support a low-end unicorn narrative. These ranges must remain wide
              because hidden debt terms, dilution, and unit-economics performance can swing value sharply.
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
