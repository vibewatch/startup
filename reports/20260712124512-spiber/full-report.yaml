      role: Co-founder; former CEO and current technical leader
      background: >
        Public 2026 transition materials show Sekiyama stepping back from frontline management to focus on technical and
        product-development bottlenecks after leading Spiber through its initial scale-up era.
      claimRefs:
        - CO008
