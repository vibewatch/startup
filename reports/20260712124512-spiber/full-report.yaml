        - Faster-than-expected dilution or weak customer repeatability
      - - Base
        - 600-900
        - Reset stabilizes business, strategic value preserved, but disclosure still partial
        - Plant KPIs or debt stack disappoint
      - - Bull
        - 1100-1500
        - Economics improve materially and old unicorn thesis becomes credible again
        - Any evidence that crisis damage persists structurally
    notes: These are public-evidence ranges, not management targets or market quotes.
