      - number: '4.2'
        title: Traction Signals Versus Financial Disclosure
        blocks:
          - type: paragraph
            body: >-
              Public traction signals are real but financially incomplete. Spiber can point to brand launches, current
              site claims of 40-plus brands and 200-plus items, and earlier evidence that 15 brands had already launched
              products by April 2024. Those are useful adoption markers, but they are not substitutes for revenue run
              rate, ARR, gross margin, or net retention. The absence of those denominators matters because a business
              can produce exciting launches and still struggle financially if volumes are low, pricing is promotional,
              or qualification costs remain high. The company’s financial opacity is especially noticeable when compared
              with public materials or industrial-biotech analogs that disclose standard metrics. For this chapter,
              traction is therefore a proof-of-interest signal, not proof of revenue quality.
