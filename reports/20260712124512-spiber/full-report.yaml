      - number: '5.2'
        title: Manufacturing Stack and Material Forms
        blocks:
          - type: paragraph
            body: >-
              On the production side, Spiber has progressed farther than many biomaterials peers. Public sources
              indicate mass production and polymer manufacturing in Thailand, new financing explicitly tied to mass
              production and sales, and an operations roadmap that WIPO described as eventually reaching several hundred
              tons per year. Product-wise, the platform already spans fibers, films, resin-like materials, coatings, and
              finishing technologies, with food proteins and other functional proteins added to the roadmap. The
              company’s current commercialization strategy appears to use these forms pragmatically: whole-fiber stories
              where useful, blends where cost or performance require compromise, and surface or additive applications
              where protein functionality can deliver value without requiring total material replacement. This is a
              sensible deep-tech scaling pattern, but the public record still omits throughput, yield, and utilization
              metrics that would prove manufacturing excellence rather than merely manufacturing existence.
