      - number: '7.4'
        title: Regulatory, Legal, and IP Risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory and legal risk are asymmetric across Spiber’s opportunity set. Apparel uses are comparatively
              lighter from a product-approval standpoint, but the moment Spiber pushes deeper into food proteins the
              risk profile changes materially. EU novel-food rules, UK novel-food authorization, and US GRAS /
              food-additive frameworks all imply time, evidence, and procedural burden before a novel protein ingredient
              can scale commercially. Separately, sustainability-centered marketing creates legal exposure if claims
              about environmental benefit, biodegradability, or footprint reduction are not substantiated. Visible
              patent activity is a strength, yet it does not remove freedom-to-operate or claim-scope risk. In short:
              apparel is commercially hard, food is commercially and regulatorily hard, and sustainability messaging
              must remain disciplined throughout.
            claimRefs:
              - CR015
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
