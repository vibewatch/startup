  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Restructuring, Leadership, and Capital Risk
        blocks:
          - type: paragraph
            body: >-
              The dominant risk frame for Spiber in 2026 is capital and corporate stability. The public record shows a
              company that raised extraordinary sums, still hit a debt wall, and then relaunched under a new management
              structure with explicit language about profitability and monetization. That combination is not fatal, but
              it is serious. It means investors cannot treat Spiber as a conventional late-stage growth story where the
              remaining question is simply sales execution. Instead, they have to ask whether the 2026 entity has
              genuinely reset the operating model and capital structure enough to survive the final stretch from
              technical promise to economically durable commercialization. Leadership change compounds that uncertainty
              because it can affect culture, prioritization, partner confidence, and financing access all at once.
            claimRefs:
