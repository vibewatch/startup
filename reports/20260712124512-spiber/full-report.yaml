      - number: '3.3'
        title: Capability, Pricing, and Switching Dynamics
        blocks:
          - type: paragraph
            body: >-
              Competition in this category is not mainly about brand awareness; it is about which technology route can
              reliably produce material with acceptable cost, quality, and downstream manufacturability.
              Fermentation-based players like Spiber and AMSilk compete on scale-up, partner development, and
              application fit. Transgenic approaches like Kraig compete on a different biological model and highlight
              how unresolved economics remain across the category. Public pricing disclosure is sparse, but Kraig’s
              cited production-cost figure and sportstextiles’ comments on Spiber’s premium blend usage both point to
              the same conclusion: this is still a premium market. That keeps switching costs moderate. Many buyers are
              experimenting through capsules and blends rather than locking into standardized high-volume contracts,
              which means supplier relationships can still be re-opened as cost, performance, or reliability changes.
            claimRefs:
