- id: drivers-and-constraints
  title: Growth Drivers and Commercial Constraints
  body: 'The demand case is strong on paper. Market studies repeatedly cite lightweight high-strength biomaterials, sustainability mandates, precision-fermentation advances, and premium brand demand as structural growth drivers. Yet the commercialization case remains constrained by cost, throughput, and standardization. Mordor’s cost discussion is particularly useful: current prices near USD 300 per kilogram and the need for far larger plant throughput show why the market is still concentrated in premium capsules and technical demonstrations. IP density is another friction point, because a large patent thicket can complicate licensing, design-around work, and multi-supplier strategies. The practical implication is that the market can grow fast from a small base while still leaving individual companies cash-constrained. For Spiber, growth drivers are not the problem; translating them into low-cost, dependable supply at commercially acceptable pricing is the harder step.'
  claimRefs:
  - CM005
  - CM006
  - CM008
  - CM009
  - CM017
