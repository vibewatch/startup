- id: regulatory-and-diligence-gaps
  title: Regulatory Friction and Remaining Diligence Gaps
  body: 'Regulation cuts two ways in this market. In textiles, the biggest near-term regulatory issue is not product approval but claims substantiation: biomaterials brands increasingly need to support environmental statements with credible evidence, especially in Europe. In food proteins, the bar becomes much higher because formal authorization frameworks apply. The EU novel foods regime and the UK Food Standards Agency’s guidance both point toward pre-market authorization requirements for truly novel ingredients. Even where the final material is not itself a GMO, biosafety frameworks still matter because engineered microorganisms are part of the production system. This means Spiber’s broader platform story is credible, but the time-to-market and compliance cost vary sharply by vertical. The key unresolved gap is that Spiber does not publish its own TAM/SAM/SOM model or vertical-by-vertical revenue expectations, so investors still need management input to convert market possibility into
    a realistic demand forecast.'
