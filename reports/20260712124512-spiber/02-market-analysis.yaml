chapter:
  number: 2
  title: Market Analysis
  summary: Spiber addresses a real and growing synthetic spider silk and protein-materials opportunity, but public market estimates vary widely and the commercially accessible near-term segment is much narrower than headline TAM figures imply. Apparel is the clearest beachhead today, while food and technical adjacencies expand upside but bring heavier regulatory and qualification friction.
sections:
- id: market-boundary
  title: Market Boundary and Status-Quo Alternatives
  body: The most useful way to define Spiber’s market is not “all textiles” and not even “all biomaterials,” but a narrower wedge where performance, sustainability, and story all matter enough to justify a novel material. Brewed Protein competes directly against premium animal fibers such as cashmere and wool in apparel, against petroleum-derived synthetics where biodegradability or feedstock profile matter, and against a growing group of engineered biomaterials in coatings, films, and specialty applications. The boundary then expands outward into adjacent markets where Spiber’s protein platform could matter, such as food proteins, technical interiors, or coatings. That distinction matters because investors often overstate TAM by treating every possible protein-material use case as immediately addressable. The public evidence supports a broad platform opportunity, but the commercially accessible near-term market is much narrower and more premium than the largest headline market numbers suggest.
  claimRefs:
  - CM010
  - CM013
  - CM014
  - CM015
  - CM016
  - CM028
  - CM030
  - CM031
  tableRefs:
  - TM001
- id: sizing-lenses
  title: Sizing Lenses Rather Than One Definitive TAM
  body: 'Published market data on synthetic spider silk are directionally useful but too divergent to support one precise TAM claim. Mordor places the category near USD 1.95 billion in 2025, Market.us uses a USD 1.4 billion 2024 base and reaches USD 3.4 billion by 2034, while Research and Markets publishes a much smaller 2030 endpoint. Those differences are not just noise; they reflect different market boundaries, segment assumptions, and whether adjacent coatings, healthcare, or aerospace uses are included. What is consistent across the studies is more important than the exact dollar figure: the category is real, growing, and still supply-constrained. For diligence purposes, the better method is to use multiple lenses—category TAM, premium-apparel SAM, and Spiber-specific SOM based on premium launch formats and qualification cycles—rather than overfitting to any single purchased report headline.'
