chapter:
  number: 3
  title: Competitors
  summary: Spiber’s direct peer set centers on a small number of protein-material specialists such as AMSilk and, historically, Bolt Threads, while adjacent biomaterials platforms and scaled incumbents create a second layer of competition. The category still lacks clear public evidence of durable cost leadership, which makes distribution power and manufacturing reliability as important as scientific novelty.
sections:
- id: landscape-and-direct-peers
  title: Direct Peer Landscape
  body: The direct competitive set is smaller than broad biomaterials lists imply. Spiber’s most relevant peer group includes structural-protein or spider-silk companies that are trying to industrialize novel protein materials, especially AMSilk and, historically, Bolt Threads. Third-party startup lists repeatedly place Spiber, AMSilk, and Bolt Threads together, with Kraig Biocraft appearing as a technology-route variant via transgenic silkworms. This matters because it shows investors should distinguish between true direct peers, adjacent biomaterial companies, and giant incumbents that compete only indirectly. The direct-peer question also changed materially by 2026 because Bolt is no longer operating. That does not make competition disappear; it simply shifts the field toward a smaller set of surviving specialists plus powerful substitutes.
  claimRefs:
  - CP001
  - CP002
  - CP004
  - CP008
  - CP010
  - CP011
  - CP012
  tableRefs:
  - TP001
- id: adjacent-players-and-incumbents
  title: Adjacent Players and Incumbent Alternatives
  body: 'Adjacent companies such as Evolved By Nature, Modern Meadow, and Ginkgo Bioworks matter because they compete for some of the same sustainability, innovation, and materials budgets even when their products are not identical to Brewed Protein fiber. Evolved By Nature leans into Activated Silk for skincare, leather finishing, and textiles; Modern Meadow emphasizes INNOVERA and broader biofabrication; Ginkgo is better treated as an enabling platform than as a branded materials rival. By contrast, incumbents like Toray, Teijin, and BASF do not need to sell synthetic spider silk to pressure Spiber. Their scale, installed customer relationships, global distribution, and broad materials portfolios let them defend budgets or absorb bio-based features into larger offerings. That makes the competitive frame two-layered: direct novel-material peers at one level, and industrial incumbents at another.'
