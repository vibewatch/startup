- id: go-to-market-and-pricing
  title: Go-to-Market Motion, Premium Willingness to Pay, and Repeatability
  body: Public evidence suggests a high-touch commercialization model. Spiber appears to win customers through co-development, material storytelling, and capsule or collection launches that showcase sustainability and technical differentiation. That model can be valuable because it builds brand equity and application learning, but it is slower and more bespoke than commodity materials sales. The positive interpretation is that brands are willing to pay for novelty and sustainability, particularly in premium contexts. The negative interpretation is that willingness-to-pay remains confined to expensive blends and small batches. The Bonmax collaboration and Tee 001 price point help slightly by showing a more approachable format, but they still do not prove broad price parity or repeatable annual contract value. Independent J.L-A.L confirmation strengthens the case that these are real customer-facing launches, but it still leaves account economics opaque.
  claimRefs:
  - CU014
