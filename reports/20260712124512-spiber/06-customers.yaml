- id: segment-and-geography
  title: Segment Focus and Geographic Reach
  body: 'The current customer map skews heavily toward premium apparel, outdoor, and design-led collaborators. That is strategically sensible: these segments are better able to absorb higher prices, story-driven launches, and iterative material development. Geographically, the named portfolio spans Japan most strongly, but also includes China, New Zealand, and global-facing sustainability brands. That breadth is encouraging because it suggests the material can resonate in multiple brand cultures and product-development systems. At the same time, it underscores a limitation: most visible customer proof remains in prestige-rich, niche-friendly contexts rather than in high-volume basics or industrial procurement. Customer quality is high on signaling value; volume durability is still unproven.'
