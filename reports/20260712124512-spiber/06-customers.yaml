chapter:
  number: 6
  title: Customers
  summary: 'Spiber has strong public customer proof for a deep-tech materials startup, with named collaborations across outdoor, lifestyle, couture, and business-wear contexts. The missing piece is not partner prestige but partner economics: public evidence still does not show repeat-order depth, customer concentration, or conversion from co-development into scaled procurement.'
sections:
- id: named-customer-proof
  title: Named Customer Proof and Portfolio Breadth
  body: Spiber has unusually strong public customer proof for a private deep-tech materials company. Rather than hiding behind anonymous pilots, it regularly publishes named collaborations with recognizable brands including The North Face Japan, Goldwin, PANGAIA, Untouched World, JNBY, Yuima Nakazato, Iris van Herpen, and Bonmax. The breadth matters because it reduces the risk that adoption is a one-off founder-network phenomenon. It also shows that Brewed Protein can travel across outdoor, luxury, contemporary fashion, and more practical apparel formats. What the evidence does not show is how many of these named relationships have become durable, repeating, high-volume procurement programs. So the right read is not “customer risk solved,” but “customer interest clearly validated.”
  claimRefs:
