- id: ecosystem-and-future-customers
  title: Delivery Ecosystem and Future Customer Expansion
  body: Spiber’s customer story is inseparable from its broader ecosystem. The company’s claim of 80-plus manufacturing partners suggests that delivering to customers requires coordination across spinning, knitting, dyeing, finishing, sewing, and other conversion steps. For a novel material, that ecosystem may be a hidden moat because customer adoption depends on process compatibility as much as on bioreactor output. Looking ahead, the future expansion story includes prospective food and ingredient customers, where Spiber is openly engaging CPG brands and strategic partners. That pipeline could become important, but it should currently be treated as potential demand rather than booked business. The more immediate customer milestone is likely deeper repeatability within apparel and adjacent materials before whole new sectors become meaningful revenue pillars.
  claimRefs:
  - CU013
  - CU019
  - CU020
  - CU026
  - CU029
  - CU030
  tableRefs: []
  figureRefs:
  - FU004
- id: customer-verdict
  title: Customer Verdict and Remaining Diligence Gaps
  body: 'The net customer verdict is positive but incomplete. Spiber has more named collaboration proof than many industrial-biotech startups, and the caliber of brands involved suggests there is real market interest in the material story. That should give investors confidence that Spiber is solving an authentic customer-discovery problem, not searching for one. But the public customer story still stops short of the revenue-quality questions that matter most in underwriting: concentration, repeat orders, conversion from co-development to procurement, margin by account, and whether launches continue beyond novelty cycles. Until those metrics are disclosed, brand prestige should be treated as a leading indicator rather than a substitute for demand durability. The best near-term diligence question is simple: which partnerships are turning into multi-season sourcing, and which are still mostly narrative-rich pilots? That distinction will define the difference between impressive visibility and
    durable enterprise demand.'
