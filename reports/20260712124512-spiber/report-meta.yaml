companyProfile:
  summary: |
    Spiber is a Tsuruoka-based Japanese biotechnology and advanced-materials company built around
    Brewed Protein™, a precision-fermentation platform for structural proteins that can be turned
    into fibers, films, resins, and other material forms. The company has spent nearly two decades
    moving from structural-protein research and academic roots into commercial-scale manufacturing,
    brand collaborations, and broader platform ambitions that now include food proteins. Public
    evidence shows meaningful customer proof and strategic scarcity, but also a 2025-2026 capital
    crisis severe enough to force a relaunch under new leadership.
  foundedDate: '2007-09-01'
  founders:
    - name: 'Kazuhide Sekiyama'
      role: 'Co-founder; former CEO and current technical leader'
      background: >
        Public 2026 transition materials show Sekiyama stepping back from frontline management to
        focus on technical and product-development bottlenecks after leading Spiber through its
        initial scale-up era.
      claimRefs: [CO008]
  foundingLocation: 'Tsuruoka, Yamagata Prefecture, Japan'
  headquarters: 'Tsuruoka, Yamagata Prefecture, Japan'
  productSummary: >
    Brewed Protein™ platform for precision-fermented structural proteins and derived biomaterials,
    spanning fibers, films, resins, blends, selective finishes, and future food-protein concepts.
  customerFocus: >
    B2B partnerships with premium apparel, outdoor, and design-led brands today; prospective future
    expansion into ingredient, food, and other industrial-material customers.
  businessModel: >
    B2B materials commercialization and partner co-development model centered on quote-led material
    sales, application development, and scale-up of fermentation-based protein materials.
  stage: 'Late-stage private deep-tech platform under post-crisis reset'
  fundingStatus: >
