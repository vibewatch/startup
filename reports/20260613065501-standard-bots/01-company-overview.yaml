  - id: funding-capital
    title: Funding History, Valuation, and Capital Structure
    body: >
      Standard Bots' publicly disclosed funding history comprises at least two institutional rounds culminating in
      Series C unicorn status. The most recent confirmed prior round was a Series B, which closed on July 12, 2024
      per Crunchbase, led by General Catalyst and totaling $63 million per Forbes. Crunchbase lists 12 investors
      including BoxGroup and Lachy Groom; Tracxn reports 11 institutional investors and total funding of $263 million
      across two rounds (Series B and Series C), though it is possible earlier seed or angel capital is not captured
      in public databases.


      On June 9, 2026, Standard Bots announced a $200 million Series C at a $1 billion post-money valuation.
      The round was led by RoboStrategy — a publicly traded closed-end robotics fund (Nasdaq: BOT) — with
      participation from existing investor General Catalyst. RoboStrategy CEO Andrew Kang and General Catalyst
      partner Max Rimpel both provided on-record quotes supporting the round. The $200M raise from a $63M prior
      round (2024) represents a steep step-up in both capital and valuation, consistent with the pace of
      physical-AI fundraising in 2025-2026.


      The Series C announcement coincided with expansion plans: the Glen Cove, NY manufacturing facility is
      expanding to 70,000 square feet to scale vertically integrated production. Total disclosed capital from
      known rounds is approximately $263 million (Tracxn) or ~$263M+ (Series B $63M + Series C $200M), subject
      to undisclosed earlier capital. No secondary transactions, debt facilities, or credit lines have been
      publicly disclosed. The company remains private.


      TechFundingNews separately notes that Evan Beard has testified before Congress and advised the White House,
      creating potential policy-related non-dilutive influence, though no government grants or contracts for the
      company itself have been publicly confirmed.
