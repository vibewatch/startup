  - id: product-footprint-scale
    title: Product Family, Customer Scale, and Operational Footprint
    body: >
      Standard Bots offers four robot product lines. Spark is a compact tabletop cobot (7 kg payload, 900 mm reach,
      ±0.025 mm repeatability) targeting R&D labs, light manufacturing, and precision assembly. Core is the flagship
      six-axis arm (18 kg payload, 1.3 m reach, ±0.025 mm repeatability, up to 3 m/s linear speed), priced from
      $37,000 — positioned against Fanuc CRX-10iA/L at $50,000+ and Universal Robots UR10e at ~12.5 kg payload.
      Thor is the heavy-payload variant (30 kg, 2 m reach, 296 mm footprint) targeting palletizing and heavy-duty
      applications. Bolt is a bimanual droid platform with stationary, mobile, and vertical-lift configurations;
      its product page describes it as "coming soon" as of the access date, with reservation capability open.


      Software differentiators include: no-code visual programming via touchscreen; fleet management across multiple
      robots; built-in 3D wrist camera (optional on Core); Flux AI Skill, which captures operator demonstrations
      and replicates them autonomously; and a cloud-based model training pipeline. The company positions AI-native
      demonstration-based teaching as a structural moat against legacy cobot providers.


      Customer scale is described in company and press communications as "hundreds of American companies in nearly
      every state." Named enterprise customers include Sunoco (oil and gas), Lockheed Martin (aerospace/defense),
      Amazon (logistics), NASA (government), and the U.S. Army (defense). Adient is mentioned in Robotics &
      Automation News as a customer. Named SMB customers include Shaw Barrels (case study: 4X productivity on
      deep-hole drilling), with additional testimonials from Amazon, TMMI, Mac Products, and Reason Robotics
      appearing on the website.


      Application cells are priced as complete packages: machine tending from $47,000 (DIY) to custom quote
      (Full Integration); welding systems from $75,000; palletizing from $75,000. The company claims 100+ leading
      manufacturers are "already scaling" per application pages. Exact customer count, revenue, ARR, NRR, and
      headcount are not publicly disclosed.


      The manufacturing footprint is at Glen Cove, NY (primary assembly and design); the facility is expanding
      to 70,000 sq ft. A stated 2027 target is to manufacture every component domestically ("metal in to robots
      out"). The company sells direct and has support staff — including applications engineers — distributed across
      the U.S. No international operations or non-U.S. deployments have been mentioned in public materials.
