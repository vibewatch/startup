  evidenceGaps:
    - id: EGO001
      question: James Cordle co-founder verification
      relatedQuestionRefs:
        - QO006
      gapType: private-evidence-only
      severity: minor
      note: >-
        James Cordle named as co-founder in the June 2026 PR Newswire release alongside Evan Beard and David
        Golden. No LinkedIn profile, news mention, or other independent source corroborates Cordle's
        co-founder status or background. No public leadership presence found.
    - id: EGO002
      question: Revenue and financial operating metrics
      relatedQuestionRefs:
        - QO018
      gapType: private-evidence-only
      severity: material
      note: >-
        Standard Bots is a private company with no public financial filings. Revenue, ARR, gross margin,
        burn rate, runway, and NRR are all unknown without data room access. Funding amounts are
        publicly confirmed but operating performance cannot be assessed from public sources.
    - id: EGO003
      question: Total headcount and hiring trajectory
      relatedQuestionRefs:
        - QO019
      gapType: private-evidence-only
      severity: material
      note: >-
        No source discloses total employee count. Active job listings confirm hiring across at least 6
        functional areas but total headcount size is unknown. Careers page testimonials and team listing
        suggest several hundred employees but this is inference, not reported data.
    - id: EGO004
      question: Policy role government contract impact
      relatedQuestionRefs:
        - QO024
      gapType: missing-source
      severity: minor
      note: >-
        Evan Beard's White House advisory and Congressional testimony are reported but no source confirms
        whether these relationships resulted in government contracts, SBIR/STTR grants, or other non-dilutive
        funding. The U.S. Army is named as a customer but contract details are undisclosed.
    - id: EGO005
      question: David Golden current operational role
      relatedQuestionRefs:
        - QO026
      gapType: missing-source
      severity: minor
      note: >-
        David Golden is titled Co-Founder on the careers page but no source describes his current day-to-day
        operational responsibilities. His prior role as Bowery Farming CEO and LeapPay founder is documented
        but his active scope at Standard Bots is not publicly stated.
    - id: EGO006
      question: Investor table completeness — board seats and pre-Series B investors unconfirmed
      relatedTableRefs:
        - TO003
      gapType: private-evidence-only
      severity: minor
      note: >-
        The stakeholder/investor map (TO003) covers all publicly named investors. However, seed and Series A
        investors are not confirmed in public databases. Board composition and observer seat assignments are
        not publicly disclosed. The Crunchbase list of 12 investors is not individually named beyond GC
        and BoxGroup/Lachy Groom.
    - id: EGO007
      question: Milestone table — pre-2024 funding rounds and operational milestones unconfirmed
      relatedTableRefs:
