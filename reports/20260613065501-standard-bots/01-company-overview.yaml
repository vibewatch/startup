callouts:
  - id: CA001
    type: gap
    title: Revenue and Financial Metrics Unavailable
    body: >-
      Standard Bots has not disclosed revenue, ARR, gross margin, NRR, burn rate, or runway. As a private
      company with no public filings, all financial metrics require data room access. The $1B valuation is
      entirely based on the Series C term sheet, not any disclosed revenue multiple.
    claimRefs:
      - CO044
      - CO045
  - id: CA002
    type: risk
    title: Founding Year Conflict Unresolved
    body: >-
      Tracxn and TechFundingNews report a 2011 founding year; GreyJournal's "eight-year-old company" framing
      in June 2026 implies ~2018. The discrepancy is material to assessing the depth of hardware development
      history and the company's runway to product-market fit. Corporate formation documents should be requested.
    claimRefs:
      - CO039
  - id: CA003
    type: risk
    title: Co-Founder James Cordle Unverifiable
    body: >-
      James Cordle is named as a co-founder in the official Series C press release but does not appear on the
      company's leadership page and has no public profile in accessible sources. His current role, equity
      position, and active involvement are unknown. This creates a governance diligence gap.
    claimRefs:
      - CO047
  - id: CA004
    type: risk
    title: BHRC Profile Exists — No Allegations Found (Adverse Source)
    body: >-
      The Business and Human Rights Resource Centre (BHRC) maintains a company profile for Standard Bots. As
      of the June 2026 access date, no allegations, incidents, or adverse reports are listed. The profile's
      existence means BHRC is monitoring the company; the absence of content is a cautiously positive signal,
      not a definitive clearance. Future monitoring is warranted as the company scales.
    claimRefs:
      - CO048

