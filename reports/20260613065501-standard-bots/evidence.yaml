  - type: missing-source
    severity: material
    topic: US dollar cobot market size
    missingEvidence: >-
      A verified US-specific collaborative robot or AI-native robot market dollar figure from a paid analyst report
      (e.g., MarketsandMarkets North America cobot report, IDC, Frost & Sullivan).
    whyItMatters: >-
      Without a credible US dollar TAM figure, sizing-based valuation analysis (revenue multiples, market penetration
      modeling) rests on a derived estimate with low confidence. Investor decks and M&A comps typically require a cited
      analyst figure.
    diligencePath: >-
      Purchase MarketsandMarkets North America collaborative robot market report or IDC robotics intelligence report;
      cross-reference with IFR unit data; validate against Standard Bots' disclosed ASP range.
    relatedQuestionRefs:
      - QM001
      - QM003
      - QM019
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: Standard Bots market share and unit shipments
    missingEvidence: >-
      Standard Bots' actual unit shipment volume, revenue, and calculated market share in the US industrial robot
      market. The company claims to target 10% of US deployments by 2027 but provides no historical unit counts.
    whyItMatters: >-
      Without actual shipment data, the 10% market share claim and SOM analysis cannot be verified or modeled. Revenue
      multiples and competitive positioning claims are unanchored.
    diligencePath: >-
      Request unit shipment data, contract bookings, and application cell deployment metrics from Standard Bots in a
      data room context; cross-reference with any disclosed customer count updates.
    relatedQuestionRefs:
      - QM009
      - QM016
  - type: missing-source
    severity: material
    topic: SME cobot adoption rate and conversion
    missingEvidence: >-
      Empirical data on what fraction of US manufacturers with 10–100 employees have deployed any form of industrial
      robot, and what conversion rates from awareness to purchase look like in the no-code cobot segment.
    whyItMatters: >-
      The SMB conversion funnel shapes the realistic near-term serviceable market. If SMB adoption rates are well below
      5%, the SOM is much smaller than the 239,000-establishment universe implies.
    diligencePath: >-
      IFR or A3 (Association for Advancing Automation) may publish establishment-level robot penetration surveys;
      alternatively, primary research or customer interviews would help.
    relatedQuestionRefs:
      - QM013
      - QM024
  - type: missing-source
    severity: minor
    topic: US-China trade policy impact on robot purchasing 2026
    missingEvidence: >-
      A public government document, policy analysis, or independent study quantifying how specific tariff or trade
      policies enacted in 2025–2026 have changed US industrial robot procurement decisions or reshoring investment
      levels.
    whyItMatters: >-
      Standard Bots' reshoring narrative and advocacy work are central to its growth thesis; if trade policy changes do
      not durably alter procurement, the policy tailwind may be overestimated.
    diligencePath: >-
      Review USTR tariff schedules for HTS codes covering industrial robot components; review any NIST or DOC reshoring
      investment reports; assess CHIPS Act analog for robotics if enacted.
    relatedQuestionRefs:
      - QM020
      - QM027
  - type: missing-source
    severity: minor
    topic: Robot adoption ROI and TCO for SMB manufacturers
    missingEvidence: >-
      An independent study or customer case study quantifying total cost of ownership (including integration, training,
      maintenance, and downtime) and actual payback periods for SMB machine tending or palletizing deployments.
    whyItMatters: >-
      Standard Bots' adoption thesis rests on favorable ROI vs. human labor costs, but hidden integration and
      maintenance costs could extend payback periods and dampen adoption by capital-constrained small manufacturers.
    diligencePath: >-
      Obtain customer ROI data from Standard Bots' marketing materials or request case study access in diligence;
      cross-reference with Universal Robots' published ROI calculator and case studies for comparable cell types.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: minor
    topic: Job displacement evidence recent studies
    missingEvidence: >-
      More recent academic or policy research (2024–2026) quantifying robot-related employment and wage effects at the
      establishment level for US SMB manufacturers specifically.
    whyItMatters: >-
      The political risk narrative around job displacement depends on the current state of evidence. If more recent
      research shows net positive employment at all firms (as the 2025 Minnesota study suggests for adopters), the
      political risk is lower than the older Acemoglu/Restrepo study implies.
    diligencePath: >-
      Review 2025 University of Minnesota study directly (cited in Forbes); search NBER and IZA for 2024–2026 working
      papers on robot adoption and employment in US manufacturing.
