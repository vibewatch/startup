  - id: EGO001
    question: James Cordle co-founder verification
    relatedQuestionRefs:
      - QO006
    gapType: private-evidence-only
    severity: minor
    note: >-
      James Cordle named as co-founder in the June 2026 PR Newswire release alongside Evan Beard and David Golden. No
      LinkedIn profile, news mention, or other independent source corroborates Cordle's co-founder status or background.
      No public leadership presence found.
  - id: EGO002
    question: Revenue and financial operating metrics
    relatedQuestionRefs:
      - QO018
    gapType: private-evidence-only
    severity: material
    note: >-
      Standard Bots is a private company with no public financial filings. Revenue, ARR, gross margin, burn rate,
      runway, and NRR are all unknown without data room access. Funding amounts are publicly confirmed but operating
      performance cannot be assessed from public sources.
  - id: EGO003
    question: Total headcount and hiring trajectory
    relatedQuestionRefs:
      - QO019
    gapType: private-evidence-only
    severity: material
    note: >-
      No source discloses total employee count. Active job listings confirm hiring across at least 6 functional areas
      but total headcount size is unknown. Careers page testimonials and team listing suggest several hundred employees
      but this is inference, not reported data.
  - id: EGO004
