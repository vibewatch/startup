    gapType: missing-source
    severity: minor
    note: >-
      Evan Beard's White House advisory and Congressional testimony are reported but no source confirms whether these
      relationships resulted in government contracts, SBIR/STTR grants, or other non-dilutive funding. The U.S. Army is
      named as a customer but contract details are undisclosed.
