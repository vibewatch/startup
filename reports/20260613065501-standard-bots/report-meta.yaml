companyProfile:
  summary: >-
    Standard Bots is a Glen Cove, New York robotics company founded in 2011 that sells AI-native,
    no-code industrial robot arms and turnkey automation cells for manufacturing workflows such as
    machine tending, welding, palletizing, inspection, and material handling. Its product family
    spans Spark, Core, Thor, and the pre-commercial Bolt platform, with Core priced from $37,000
    and positioned as a more accessible alternative to incumbent cobots. The company has raised a
    publicly confirmed $263M, including a $200M Series C at a $1B valuation in June 2026, and is
    using that capital to expand its Glen Cove facility toward a vertically integrated “metal in to
    robots out” model. The core diligence question is not whether Standard Bots has a credible
    product story; it is whether the private-company financial evidence is strong enough to justify
    the $1B mark.
  foundedDate: '2011-01-01'
  founders:
    - name: Evan Beard
      role: Founder, CEO, and Chief Engineer
      background: >-
        Serial founder and the company’s primary policy and public-facing voice on manufacturing and
        robotics strategy.
      claimRefs: [CO013, CO014]
    - name: David Golden
      role: Co-founder
      background: >-
        Former Bowery Farming and LeapPay co-founder who joined Standard Bots as co-founder in 2020
        and adds scaling and operating experience.
      claimRefs: [CO013, CO015]
    - name: James Cordle
      role: Co-founder
      background: >-
        Named as a co-founder in the June 2026 Series C press release, but no independent public role
        description or background was located.
      claimRefs: [CO013, CO016]
  foundingLocation: Glen Cove, New York, USA
  headquarters: Glen Cove, New York, USA
  productSummary: >-
    Standard Bots sells collaborative robot arms, software, and packaged automation cells. Spark is
    a tabletop precision robot, Core is the flagship 18 kg / 1.3 m general-purpose arm, Thor targets
    larger-payload palletizing and heavy applications, and Bolt is a bimanual “coming soon” droid.
    The software layer emphasizes no-code setup, fleet management, APIs/SDKs, and training by
    demonstration.
  customerFocus: >-
    Primary target customers are small and mid-sized manufacturers that need easier-to-deploy robot
    automation, with additional enterprise and government logos appearing in company-issued materials.
  businessModel: >-
    Hardware sales and leasing plus recurring software/support, with higher-value packaged cells for
    machine tending, welding, palletizing, and related manufacturing applications.
  stage: Series C
  fundingStatus: >-
    Standard Bots announced a $200M Series C at a $1B valuation on 2026-06-09 after a prior $63M
    Series B in 2024. Publicly confirmed cumulative funding stands at about $263M; earlier rounds
    and cap-table terms are not fully disclosed in public sources reviewed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO002, CO007, CO009, CO030, CO039, CI015, CV001, CV003, CV010, CV031]

summary:
  headline: >-
    Research-more: Standard Bots has a credible AI-native cobot product narrative and real customer
    anecdotes, but the June 2026 $1B valuation is too price-sensitive to underwrite from public
    evidence because revenue, margins, and deployment efficiency remain undisclosed.
  overallScore: 6.0
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 1000
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 263
    customerCount: null
    headcount: null
  topStrengths:
    - >-
      Clear product positioning around no-code automation, demonstration-based training, and aggressive
      entry pricing that directly addresses SMB adoption friction in cobots.
    - >-
      A multi-product roadmap (Spark, Core, Thor, Bolt) plus packaged application cells gives Standard
      Bots a broader automation story than a single-arm vendor.
    - >-
      The June 2026 $200M Series C and returning support from General Catalyst provide real financing
      capacity for manufacturing expansion and go-to-market scale-up.
    - >-
      Public customer evidence is imperfect but not empty: Shaw Barrels and HomeGrown Lifting provide
      concrete outcome claims, and the company has assembled a recognizable enterprise-logo narrative.
  topRisks:
    - >-
      Public financial disclosure is too thin to justify the $1B valuation with confidence: revenue,
      ARR, gross margin, burn, runway, and cap-table terms are all undisclosed.
    - >-
      Safety certification posture, warranty exposure, and roadmap maturity remain incomplete in the
      public record, especially for Bolt and the broader AI-autonomy claims.
    - >-
      Manufacturing concentration in Glen Cove and a still-in-progress facility expansion create
      execution, supply-chain, and working-capital risk.
    - >-
      Customer proof is still mostly company-curated; retention, NRR/GRR, concentration, and the depth
      of named enterprise deployments are not independently validated.
    - >-
      Incumbent cobot vendors retain much larger installed bases, service ecosystems, and certification
      histories, while public comparable data show demand softness can hit the category quickly.
  unresolvedGaps:
    - >-
      Audited or management-reconciled financials covering ARR, revenue, gross margin, burn, cash,
      and runway.
    - >-
      Full cap table, liquidation preferences, anti-dilution terms, and whether the Series C included
      unusual structure or secondary components.
    - >-
      Independent evidence for deployment depth, customer concentration, retention, and progress toward
      the claim of reaching 10% of new U.S. robot deployments by 2027.
    - >-
      Third-party safety/certification documentation (for example CE, UL, ISO/TS 15066 posture) and
      ship-readiness milestones for Bolt.
    - >-
      Board composition, governance rights, and a clearer public explanation of co-founder James Cordle’s
      role and current involvement.

disclaimer: >-
  This report is based on publicly available information as of 2026-06-13 and is not investment
  advice. Standard Bots is a private company, and several underwriting-critical inputs remain outside
  the public record reviewed here.
