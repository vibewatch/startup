company:
  name: Standard Bots
chapter:
  number: 6
  title: Customers
  summary: >
    Standard Bots serves two primary customer segments as of June 2026: hundreds of SMB manufacturers
    across nearly every US state, and a small set of named enterprise accounts (Sunoco, Adient,
    Lockheed Martin, Amazon, NASA, US Army) that appear exclusively in the company-authored Series C
    press release. The strongest customer evidence is Shaw Barrels (4x productivity claim, company-sourced)
    and HomeGrown Lifting (doubled throughput, company-sourced). Four website testimonials add
    social proof but are company-curated and unverifiable. No independent trade press or customer-issued
    confirmation corroborates any named enterprise deployment. All retention metrics (NRR, GRR, churn)
    are undisclosed. The education channel (Spark arm kits to institutions) is active but at early stage
    with no named institution partners and an unproven commercial conversion path.

sections:
  - id: customer-base-segmentation
    title: Customer Base Segmentation
    body: >
      Standard Bots serves two broadly distinguishable customer segments: small-to-medium manufacturers
      (SMBs), typically family-owned or regionally anchored shops, and large enterprise accounts
      including Fortune 100 industrials, government agencies, and defense contractors. The company
      explicitly frames itself as serving "Fortune 100 companies to hundreds of SMB manufacturers
      across the country," per the June 2026 Series C press release. As of the same date, the
      company claims deployment across "nearly every state."


      In terms of buyer-user-payer dynamics, the typical payer is the factory owner or VP of
      Operations; the buyer is a manufacturing engineer or plant manager who evaluates automation ROI;
      and the user is the shop-floor operator who programs the robot via demonstration. The 30-day
      free trial significantly lowers the payer commitment barrier, allowing pilots before full
      lease conversion.


      SMB manufacturers appear to be the quantitatively dominant cohort — "hundreds" versus a handful
      of named enterprise accounts. Use cases are primarily machine tending, welding, palletizing, and
      inspection. The enterprise cohort (Sunoco, Adient, Lockheed Martin, Amazon, NASA, US Army) appears
      in the press release but individual deployments are not independently confirmed.


      The education channel is a nascent third segment. Standard Bots operates an Education Program
      offering Spark arm kits at $29,500 to universities, technical schools, and secondary institutions.
      The page claims "Trusted by The Nation's Leading Institutions" but lists no institution names.
      The education pipeline is designed to funnel trained graduates into manufacturing employer accounts,
      but this revenue stream is at an early stage and conversion to commercial accounts is unproven.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU018
      - CU038
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: named-customer-proof
    title: Named Customer Proof
    body: >
      Standard Bots provides limited but non-trivial named customer proof. The strongest evidence is
      from Shaw Barrels, a multi-generational family-owned manufacturer in Bridgeville, PA, documented
      via the company homepage and education page: deployment of the Core robot on a Precihole Deep
      Hole Drilling Machine achieved 4x productivity improvement (800 parts/day from 200 parts/day).
      Shaw Barrels is referenced in two separate company-controlled pages, giving this claim dual
      internal corroboration. However, no independent third-party verification of the productivity
      figure was found.


      HomeGrown Lifting (Lexington, KY), a fitness equipment manufacturer, is cited on the homepage
      for "doubled throughput" after automating rubber tile palletizing. This is company-sourced only.


      The company website features testimonials attributed to Tamil Manivannan (Amazon), Aaron
      (associated with TMMI), Henry (Mac Products), and Kenneth (Reason Robotics). These are
      company-curated testimonials on a company-controlled page; no independent verification channel
      exists. The Amazon testimonial places a Fortune 100 brand in the proof narrative but does not
      confirm a formal enterprise procurement relationship or production deployment scope.


      For enterprise accounts, the Series C press release is the primary evidence source: Sunoco,
      Adient, Lockheed Martin, Amazon, NASA, and the US Army. Press releases are company-authored
      and do not distinguish pilot-stage from production-scale deployments. All six enterprise accounts
      require independent confirmation and pilot-vs-production clarification before being used to
      underwrite enterprise revenue projections.
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
