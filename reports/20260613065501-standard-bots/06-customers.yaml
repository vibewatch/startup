  - id: adoption-trajectory
    title: Adoption Trajectory
    body: >
      Standard Bots' claimed customer trajectory has three public milestones: a deployment base of
      "hundreds of American companies" across "nearly every state," a customer roster spanning
      Fortune 100 industrials through SMB manufacturers, and an ambition to capture 10% of new US
      industrial robot deployments "by next year" (2027 per the June 2026 press release). The IFR
      reported approximately 33,000 new industrial robot units installed in the United States in 2024
      according to the World Robotics 2025 statistics release; a 10% share would imply roughly 3,300
      to 4,000 annual unit deployments — a significant scaling leap from a stated "hundreds" total
      customer baseline.


      The adoption funnel begins with discovery (trade shows, digital outreach, or education program),
      proceeds through the free 30-day pilot, and converts to a paid leasing arrangement. Evidence
      for the post-trial conversion rate is absent from public sources. Land-and-expand is documented
      qualitatively: the TMMI testimonial references multiple units, and the product line (Spark for
      lighter tasks, Core for machine tending, Thor for heavier industrial applications) supports
      account expansion by use-case complexity.


      The 2026 target of "nearly every state" is consistent with an early-stage national SMB rollout.
      Geographic concentration is likely in manufacturing-dense regions: Midwest automotive/industrial
      heartland, mid-Atlantic (company HQ is Glen Cove, NY), and Southeast states with growing
      manufacturing. No customer concentration by state or region is publicly verifiable.


      Compared to Universal Robots at a similar stage, UR shipped approximately 500 units in its
      first two years (2009-2010) and grew to thousands per year by year five. Standard Bots'
      "hundreds" total customer claim is plausibly consistent with early-stage UR trajectory,
      but the 10% share target implies much faster scaling.
    claimRefs:
      - CU016
      - CU017
      - CU019
      - CU020
      - CU021
      - CU027
      - CU028
      - CU030
      - CU031
      - CU032
      - CU036
    tableRefs:
      - TU002
    figureRefs:
      - FU002
      - FU003

  - id: retention-durability-gaps
    title: Retention and Durability Gaps
    body: >
      Standard Bots has not publicly disclosed any retention metrics: net revenue retention (NRR),
      gross revenue retention (GRR), churn rate, customer count by cohort, or average contract
      length. This is typical for a Series C private company, but it represents a significant
      diligence gap. The 30-day free trial model means a proportion of early "deployments" may
      be trial units that did not convert.


      The company has no presence on independent review platforms (G2, Capterra, TrustRadius) as
      of June 2026. This absence is consistent with the B2B hardware-as-a-service model where
      relationships are managed through direct sales, but it limits external triangulation. No
      verified positive reviews from identifiable named customers exist outside company-controlled
      channels.


      The strongest proxy for customer durability is the TMMI testimonial referencing multiple units
      and the expansion narrative describing customers growing from one to multiple-robot configurations.
      However, even if expansion is occurring, the absence of NRR data means diligence cannot confirm
      whether revenue from expanding accounts offsets churn from trial-to-production failures.


      Customer concentration risk appears low in the SMB segment by design, but enterprise accounts
      could represent outsized revenue concentration that is not visible from public sources. A Lockheed
      Martin or Sunoco contract at multi-unit scale would represent meaningful revenue concentration.
    claimRefs:
      - CU022
      - CU023
      - CU024
      - CU025
      - CU026
      - CU029
      - CU033
      - CU034
      - CU040
    tableRefs:
      - TU004
    figureRefs:
      - FU004

  - id: channel-concentration-expansion
    title: Channel Structure and Concentration Risk
    body: >
      Standard Bots operates a primarily direct sales model. No resellers, distributors, or named
      channel partners were identified in public sources as of June 2026. The leasing model implies
      a direct bilateral relationship between Standard Bots and each customer. The support page
      documents an in-house customer success and technical support function.


      The education channel may develop into a secondary sales channel as institutions license
      multiple kits and trained graduates join manufacturing employers who then purchase commercial
      units. The SB Education Program targets undergraduate, graduate, doctoral, and technical
      vocational education; conversion timelines are multi-year and unproven.


      Geographic concentration risk is manageable given stated national presence but is not
      quantifiable without underlying customer data. Enterprise accounts (Sunoco, Adient, Lockheed,
      Amazon) provide higher unit values but require longer sales cycles, formal procurement, and
      potentially dedicated integration support that differs from the SMB self-serve model. Revenue
      from the top 5 customers as a percentage of total revenue is not publicly disclosed.
    claimRefs:
      - CU035
      - CU037
      - CU038
      - CU039
    tableRefs:
      - TU005
    figureRefs: []

