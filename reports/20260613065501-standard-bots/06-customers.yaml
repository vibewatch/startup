callouts:
  - calloutType: risk
    title: All Named Customer Proof Is Company-Controlled
    body: >
      Every customer testimonial and case study publicly available for Standard Bots as of June 2026
      appears on company-owned channels (standardbots.com) or in company-authored press releases.
      No independent trade press or customer-authored case study corroborates any specific deployment.
      Shaw Barrels' 4x productivity claim and HomeGrown Lifting's doubled throughput are each compelling
      but unverifiable from public data. The enterprise customer list (Sunoco, Adient, Lockheed, Amazon,
      NASA, US Army) requires pilot-vs-production clarification before being used to underwrite
      enterprise revenue projections. Industry observers note that cobots are "not a silver bullet"
      and deployment claims should be validated with direct customer references.
    claimRefs:
      - CU013
      - CU015
      - CU040

  - calloutType: risk
    title: Retention and Churn Metrics Are Entirely Opaque
    body: >
      Standard Bots has not publicly disclosed NRR, GRR, churn rate, customer cohort data, or
      repeat purchase rates. The 30-day free trial model means a meaningful fraction of early
      "deployments" may represent unconverted trials. Without retention data, it is not possible
      to assess whether the "hundreds of companies" figure represents a stable, growing, or declining
      install base. This is the single largest quantitative gap in the customer diligence.
    claimRefs:
      - CU022
      - CU023
      - CU024
      - CU025

  - calloutType: insight
    title: Land-and-Expand Structurally Supported but Unquantified
    body: >
      The product line breadth (entry Spark at lower price, Core for machine tending, Thor for heavier
      tasks) creates a natural upsell ladder. The TMMI testimonial references multiple units, and the
      press release describes growing customer accounts. If NRR is above 100%, the "hundreds" customer
      base would compound revenue meaningfully. The education pipeline adds a secondary long-term
      acquisition channel. These structural features are positive, but remain unquantified from
      public data.
    claimRefs:
      - CU029
      - CU030
      - CU038

