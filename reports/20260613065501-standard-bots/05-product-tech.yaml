  name: Standard Bots

chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Standard Bots offers a four-product cobot line (Spark, Core, Thor, Bolt) backed by a proprietary
    software stack (StandardOS) and the Flux AI platform for training-by-demonstration.
    Hardware specs for the three shipping SKUs are verifiable and competitive on payload-to-price;
    the AI autonomous-operation claims are company-asserted and partially demonstrated but lack
    independent benchmark validation. Bolt (the mobile droid) and several AI features are explicitly
    "coming soon," representing material roadmap risk. No third-party safety certifications beyond IP
    ratings have been independently confirmed in public sources.

sections:
  - id: product-line
    title: "Product Line: Spark, Core, Thor, and Bolt"
    body: >-
      Standard Bots ships three cobot arm SKUs and has announced a fourth mobile-arm product
      (Bolt) in beta. Spark (7 kg payload, 900 mm reach) targets tabletop precision applications
      such as inspection, lab workflows, and light assembly; it is the company's smallest form factor
      and is rated IP69K on the arm. Core (18 kg payload, 1,300 mm reach) is the volume workhorse,
      positioned for machine tending, pick-and-place, and palletizing at a $37,000 list price. Thor
      (30 kg payload, 2,000 mm reach) is marketed as the heaviest-payload collaborative robot on
      the market, rated IP69K, and targets welding and end-of-line palletizing starting at $49,500.
      All three shipping SKUs share ±0.025 mm repeatability, a 200 mm or smaller base footprint,
      and the StandardOS software environment. Bolt is a mobile arm paired with an AMR chassis;
      it lists 14 kg payload, three-camera head, and interchangeable torso lengths, but the page
      prominently reads "Coming soon" and reservations are collected via a beta sign-up form.
      The company's own marketing copy distinguishes Bolt from the shipping products with this
      label, making it a pre-commercial announcement as of June 2026.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
