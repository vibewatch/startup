  evidenceGaps:
    - type: missing-source
      severity: material
      topic: safety-compliance
      missingEvidence: "Third-party safety certification documentation — CE marking, UL/CSA listing, or published ISO/TS 15066 conformance declaration — for at least one Standard Bots SKU."
      whyItMatters: "Enterprise buyers in regulated sectors and all EU-market customers require CE marking or equivalent. Absence from public sources is a genuine commercial barrier and a material risk if Standard Bots plans international expansion."
      diligencePath: "Request conformance certificates from Standard Bots directly; check EU RAPEX database and UL product certifications portal for Standard Bots filings."
      relatedQuestionRefs:
        - QE005

    - type: missing-source
      severity: material
      topic: AI-validation
      missingEvidence: "Independent benchmark or third-party case study validating Flux AI autonomous task execution accuracy, failure rate, and generalization across part variations."
      whyItMatters: "Training-by-demonstration autonomy is the key differentiation claim. Without independent validation, buyers cannot assess whether 'self-correcting' and 'autonomous' operate at the accuracy levels needed for production."
      diligencePath: "Request customer case studies with quantified accuracy metrics; look for published benchmarks at robotics conferences (ICRA, IROS); request demo under controlled conditions with unstructured part variations."
      relatedQuestionRefs:
        - QE016
        - QE023

    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: "Public developer community signal — GitHub repository, SDK package registry, Stack Overflow tag, or Discord/forum activity for StandardOS and the Flux AI platform."
