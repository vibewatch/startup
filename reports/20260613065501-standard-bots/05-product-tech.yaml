  - id: hw-architecture
    title: "Hardware Architecture: Vertical Integration, Actuators, and Sensing"
    body: >-
      Standard Bots claims end-to-end hardware design, asserting that "product and component designs
      are 100 percent proprietary after years of research and development." The company builds its own
      actuators using custom motor and drive systems manufactured in Glen Cove, NY. Across all SKUs,
      joint design includes multi-modal torque sensing fused with ultra-high-rate motor control,
      delivering the sub-millimeter path accuracy, faster collision reaction, lower energy waste,
      and longer gear life the company markets. Force and torque sensing are described as real-time
      inputs for AI model tracking. The modular joint architecture is described as "industrial legos"
      enabling configuration for different customer ROI requirements. Thor's product page lists
      native EtherNet/IP and fieldbus support as industrial connectivity. The PR Newswire release
      confirms the current state as designing "almost all" parts in-house, with a stated goal to
      manufacture "virtually everything in-house in America by next year" (2027 horizon per the
      corrected release). The Glen Cove facility is expanding from an undisclosed starting size to
      70,000 sq ft. No third-party manufacturing audit, ISO 9001, or equivalent quality-system
      certification has been confirmed in publicly accessible documents.
    claimRefs:
      - CE023
      - CE024
      - CE025
      - CE026
      - CE027
      - CE028
    tableRefs:
      - TE004
    figureRefs:
      - FE004

  - id: trust-safety-compliance
    title: "Trust, Safety, Compliance, and Quality Controls"
    body: >-
      Standard Bots robots are designed as collaborative robots operating under collision-detection
      safety modes. The Spark arm is rated IP69K (arm) / IP44 (control box); Thor is rated IP69K.
      Core specs list IP54 design rating. OSHA notes there are no specific federal robotics standards
      in the United States, but industry safety is governed by ISO 10218 (industrial robots) and
      ISO/TS 15066 (collaborative robots), both referenced in cobot industry literature. Standard
      Bots' website states robots do not require safety fencing or guarding due to automatic
      collision detection. However, no publicly verified third-party safety certification (CE mark,
      UL listing, or ISO TS 15066 conformance declaration) has been identified in reviewed sources.
      Welding cells integrate with Miller Auto DeltaWeld 350 equipment and use Tregaskiss® Cobot
      MIG Gun and AccuLock™ consumables, indicating third-party certified peripheral integration
      in welding. The company offers a 30-day free on-site pilot with on-site training ("Jump Start
      sessions"). Uptime is guaranteed at 99.9% with a stated phone response time under five minutes
      and on-site support within 24 hours — these are service-level commitments not independently
      audited. No evidence of CE marking, CSA certification, or third-party conformance
      documentation has been found in available sources; this is a material diligence gap for
      enterprise and regulated-sector customers.
    claimRefs:
      - CE029
      - CE030
      - CE031
      - CE032
      - CE033
    tableRefs:
      - TE005

