  - id: ai-platform
    title: "AI and Training-by-Demonstration: Flux Platform"
    body: >-
      Standard Bots brands its AI capability as the "Flux AI" Video-Language-Action (VLA) model,
      marketed under the label "Physical AI." The workflow is described as: (1) operator
      demonstrates a task via teleoperation, hand-guidance, or classic jog; (2) onboard vision
      captures the human actions; (3) data is labeled and annotated in a review step; (4) a model
      is trained in the cloud and versioned; (5) the robot runs the skill autonomously using the
      learned model. The company describes this as "self-serve" and as the "first self-serve AI
      platform for industrial robots." Current live features per the AI product page include
      teleop-capture, anti-gravity teaching (lift-assist), label/annotate/review tooling, and cloud
      training. A feature listed explicitly as "Coming in 2026" is natural-language task programming
      — "Describe your task. Automate program." — suggesting that fully autonomous text-to-motion
      generation is not yet live. Additionally, AI skill distribution ("Create your own AI skills
      without code") is listed on the developers page as "Coming soon." The Bolt page references
      "Fully autonomous navigation (coming soon)" for the AMR platform. The Forbes analysis noted
      that Standard Bots' present-tense claim "designs almost all its own parts" does not mean
      currently manufactures all parts, adding similar caution to the AI readiness claims. No
      peer-reviewed papers, independent benchmarks, or ISO-defined autonomy-level certifications
      for the Flux AI platform have been identified in public sources.
    claimRefs:
      - CE016
      - CE017
      - CE018
      - CE019
      - CE020
      - CE021
      - CE022
