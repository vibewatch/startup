callouts:
  - calloutType: strength
    title: "Competitive Hardware Specs at Lower Price Points"
    body: >-
      Standard Bots Core lists 18 kg payload, 1.3 m reach, and ±0.025 mm repeatability at $37,000,
      compared to Fanuc CRX-10iA/L (10 kg, $50k+) and Universal Robots UR10e (12.5 kg, $50k+).
      Thor's 30 kg payload at ±0.025 mm repeatability is not matched by UR30 (±0.1 mm) or Fanuc
      CRX-30iA (±0.5 mm) at comparable list prices. If independently validated, this represents a
      genuine hardware cost-performance advantage.
    claimRefs:
      - CE005
      - CE006
      - CE034

  - calloutType: risk
    title: "AI Autonomy Claims Lack Independent Validation"
    body: >-
      The Flux AI VLA platform and training-by-demonstration workflow are central to Standard Bots'
      differentiation narrative, but no peer-reviewed benchmark, independent production trial result,
      or ISO autonomy-level metric has been found in public sources. Several AI features (natural-
      language programming, AI skill distribution, Bolt autonomous navigation) are explicitly marked
      "coming soon" or "coming in 2026" on live product pages. Investors and buyers should require
      controlled benchmarks or third-party case study data before treating autonomous AI claims
      as verified capability.
    claimRefs:
      - CE019
      - CE020
      - CE021
      - CE022

  - calloutType: risk
    title: "Bolt Is Pre-Commercial; Several SDK Languages and Features Unreleased"
    body: >-
      The Bolt mobile droid — Standard Bots' stated expansion into the industrial humanoid/AMR
      segment — is not shipping as of June 2026. Autonomous navigation is explicitly labeled
      "coming soon." Developer SDK coverage is incomplete (C++, Rust, Go missing). AI skill
      distribution is also coming soon. These roadmap gaps are material for buyers or investors
      who price in Bolt's revenue contribution or the developer-ecosystem network effect.
    claimRefs:
      - CE007
      - CE008
      - CE013
      - CE014

  - calloutType: risk
    title: "No Public Third-Party Safety Certifications Identified"
    body: >-
      Despite collaborative safety claims and marketing that no fencing is required, no CE marking,
      UL listing, or published ISO/TS 15066 conformance declaration has been identified for any
      Standard Bots product in reviewed public sources. OSHA confirms there are no specific U.S.
      federal robotics standards, but ISO TS 15066 conformance is typically expected by enterprise
      buyers and is required for European sales. This is a material diligence gap.
    claimRefs:
      - CE029
      - CE030
      - CE031

