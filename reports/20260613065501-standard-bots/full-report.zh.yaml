      - number: '6.5'
        title: 渠道结构与集中度风险
        blocks:
          - type: paragraph
            body: >
              Standard Bots 主要采用直销模式。截至 2026 年 6 月，公开来源中未发现经销商、分销商或具名渠道合作伙伴。租赁模式意味着 Standard Bots
              与每个客户之间是直接双边关系。支持页面记录了内部客户成功和技术支持职能。


              教育渠道未来可能发展为第二销售渠道：机构许可多套套件，受训毕业生加入制造业雇主后再购买商业设备。SB Education Program 面向本科、研究生、博士和技术职业教育；转化周期为多年，且尚未证实。


              鉴于公司声称已有全国覆盖，地理集中度风险可控，但没有底层客户数据就无法量化。企业账户（Sunoco、Adient、Lockheed、Amazon）提供更高单元价值，但销售周期更长、采购流程更正式，并可能需要专门集成支持，这与
              SMB 自助模式不同。前 5 大客户收入占总收入比例未公开披露。
