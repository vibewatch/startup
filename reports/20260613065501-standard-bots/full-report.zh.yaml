          - type: callout
            title: 美国工业机器人美元 TAM 未验证——规模测算受证据约束
            body: >-
              没有免费可访问来源给出经验证的美国特定工业或协作机器人美元市场规模。本章所有美国美元估算都来自 IFR 装机量（高置信度）× 估计平均售价（低置信度）。得出的区间（仅硬件 $1.7B–$3.4B，含集成 / 软件
              $2.5B–$10B）跨度很宽；没有付费分析师报告时，不应将其用于精确估值倍数。Standard Bots 自身市占率主张（到 2027 年拿下美国部署 10%）提供了有用的 SOM
              信号，但由公司提出，且未验证。
            calloutType: risk
