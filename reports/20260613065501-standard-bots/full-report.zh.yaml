  - id: TM001
    title: 市场定义——纳入 / 排除支出与替代方案
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 与 Standard Bots 的相关性
    rows:
      - - AI 原生无代码工业机器人臂
        - 机器人硬件（机械臂、控制箱、末端工具）、软件订阅、机队管理、Jump Start / 部署支持、应用单元
        - 无——这是主要可触达市场
        - 制造业所有者运营方、VP Ops、采购负责人 / CapEx 预算或经营租赁
        - 核心 TAM；Standard Bots 直接竞争
      - - 传统（需要代码）工业机器人
        - 机器人硬件、集成劳务、PLC 编程、维护合同、集成商加价
        - 仅纳入买方预算比较
        - VP Manufacturing、工程、大型企业 / CapEx；需要专业集成商
        - 相邻竞争池；SMB 进入门槛更高
      - - 协作机器人（cobots）——竞争细分
        - 竞争对手硬件（Universal Robots、Fanuc CRX、Doosan、Techman）、竞争对手软件、集成服务
        - 无排除——这是直接协作机器人竞争市场
        - 同一 SMB 和企业买方画像；CapEx 或 RaaS 租赁
        - 直接竞争重叠；Standard Bots 必须替换存量或赢得新增场景
      - - 机器人软件和机队管理
        - 仅软件许可证，用于编程、监控、AI 技能管理、SDK 访问
        - 硬件；第三方交付的集成服务
        - 熟悉软件的制造业 IT 买方；可能与硬件决策捆绑
        - 通过订阅模式带来增量收入；护城河赋能点
      - - 机器人集成和专业服务
        - 安装、调试、安全审计、工艺工程、持续应用支持
        - 不含服务的独立硬件销售
        - 工厂工程师、运营总监 / OpEx；服务合同
        - Standard Bots 的 Full Integration 层级直接竞争；降低对第三方 SI 的依赖
      - - 人工劳动（现状替代）
        - 制造业工资、福利、培训、流失成本；每名员工平均 $106,691/yr（NAM）
        - 机器人资本开支
        - 工厂经理、HR 总监 / OpEx（薪酬）
        - 所有自动化决策的主要替代方案；机器人 ROI 逻辑取决于替代这部分成本
    notes: >-
      市场边界来自 Standard Bots 已发布的应用组合和竞争格局。人工成本基准来自 NAM Facts About Manufacturing（2026 年 4
      月数据）。各细分并不互斥——买方可能从多个供应商组合机器人硬件、软件和服务。
    claimRefs:
      - CM001
      - CM003
      - CM016
      - CM036
