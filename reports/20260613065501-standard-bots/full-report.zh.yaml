      - number: '4.3'
        title: 单位经济性与成本结构
        blocks:
          - type: paragraph
            body: >
              仅靠公开信息无法计算 Standard Bots 的单位经济性。公司未披露毛利率、COGS
              拆分、获客成本、销售周期长度或净收入留存。下文区分已知事项（标价、分层结构、制造地点和面积）与必须估计或标记为未披露的事项。

              收入侧，单台 ASP 可从公开价格推断：DIY 机床上下料单元 $47,000 是下限；计入 Value-Add 和 Full Integration 档，以及 Fortune 100 客户的多机器人订单后，混合
              ASP 可能更高。成本侧，垂直一体化的美国制造（公司自制执行器、编码器和控制系统）是战略差异点，但固定成本暴露也高于 Universal Robots
              等竞争对手采用的以亚洲外包为主的模式（Teradyne，丹麦制造且过去外包组件）。IFR 数据显示，美国新增机器人安装量落后中国
              9:1；这一顺风支持放量假设，也凸显相对于建设美国本土制造产能所需资本投入，美国协作机器人可服务市场仍处早期。

              行业毛利率可用 Teradyne 合并 10-K 作基准：Robotics 分部（Universal Robots + MiR）收入下滑、利润率承压，严重到触发商誉减值复核，并在 2025 年计提 $6M
              库存准备。这说明即便规模化协作机器人 OEM 也面临毛利压力；Standard Bots 规模显著更小，且处在资本密集的厂房扩建期，尚不太可能达到可比利润率。可比硬件机器人公司成熟期毛利率通常在
              40–60%；Standard Bots 当前毛利率未知，扩张阶段可能显著更低。

              CAC 未披露。直销模式和分层导入结构（含免费试点和 30 分钟响应时间）指向高接触、高 CAC 模式；这或许适合企业账户，但会给长尾 SMB
              客户扩展带来挑战。软件或支持是否在硬件销售之外贡献经常性收入尚不清楚；定价页把软件和支持打包进单元价格，没有单列项目。
