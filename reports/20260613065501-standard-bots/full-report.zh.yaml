companyProfile:
  summary: >-
    Standard Bots 是一家位于纽约州 Glen Cove 的机器人公司，成立于 2011 年，销售 AI 原生、无代码工业机械臂和交钥匙自动化单元，覆盖机床上下料、焊接、码垛、检测和物料搬运等制造流程。产品线包括
    Spark、Core、Thor 和尚未商业化的 Bolt 平台；Core 起价 $37,000，被定位为比现有协作机器人更易获得的替代方案。公司公开确认已融资 $263M，包括 2026 年 6 月以 $1B 估值完成的 $200M
    Series C，并正用这笔资金扩建 Glen Cove 工厂，推进垂直整合的「metal in to robots out」模式。核心尽调问题不是 Standard Bots
    是否有可信的产品故事，而是这家私营公司的财务证据是否足以支撑 $1B 标记。
