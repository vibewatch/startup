      - number: '2.5'
        title: 图表与证据
        blocks:
          - type: callout
            title: 美国年度机器人部署落后中国 9 比 1——核心市场逻辑
            body: >-
              IFR 数据确认了 Standard Bots 的核心市场逻辑：中国 2024 年安装 295,000 台工业机器人（占全球总量 54%），而美国仅安装 34,200 台（同比下降 9%）。美国制造业就业已从
              1979 年 20 million 人降至今天约 13 million 人。截至 2026 年 4 月，制造业有 474,000 个空缺岗位，预计到 2033 年还需要 3.8 million
              个新职位，易用、低成本自动化的结构性需求很强。问题在于，在现有厂商和中国进口产品缩小价格差之前，Standard Bots 能否从美国每年 34,200 台安装量中拿到有意义份额（其目标为 10%）。
            calloutType: insight
