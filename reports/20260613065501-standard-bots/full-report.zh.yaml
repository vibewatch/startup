      - number: '2.2'
        title: 市场规模——TAM、SAM 与 SOM 视角
        blocks:
          - type: paragraph
            body: >
              公开可得来源中，没有单一资料给出经验证、美国特定的 AI 原生或无代码工业协作机器人市场美元规模。IFR World Robotics 2025
              报告（主要行业普查）提供的是装机量，而非美元金额。因此，当前最严谨的规模测算路径，是用 IFR 装机数据交叉供应商定价，并明确置信度上限。


              全球背景：IFR 报告 2024 年全球安装 542,000 台工业机器人——为历史第二高年度总量，且超过 10 年前数字的两倍。全球年安装量已连续四年超过 500,000 台。运营存量达到 4,664,000
              台，增长 9%。IFR 预测 2025 年增长 6%，全球安装量约 575,000 台，并预计到 2028 年突破 700,000 台门槛。2024 年部署中，亚洲占 74%；欧洲占 16%；美洲占 9%。


              美国市场：美国 2024 年安装 34,200 台工业机器人——较 2023 年下降 9%，占美洲地区安装量（50,100 台）的 68%。当年中国安装的工业机器人数量是美国的 9 倍（295,000 vs.
              34,200）。将 Standard Bots 和 Universal Robots 公开定价数据推导出的 $50K–$100K 平均售价区间应用于该数据，可得到美国工业机器人硬件年 TAM 粗略约
              $1.7B–$3.4B（以 $62K 中点 ASP 估算，中位约 ~$2.1B）。这只是硬件底线估算；若将集成服务和软件按 1.5x–3x 乘数加入，按总拥有成本调整后的美国市场 TAM 约为
              $2.5B–$10B。这些是低置信度推导估算，应与付费分析师报告核对。


              协作机器人细分：MarketsandMarkets 摘要数据（付费墙，部分可访问）显示，欧洲协作机器人市场 2025 年为 $0.41B，2030 年扩至 $0.81B（CAGR
              14.4%）。亚太协作机器人预计从 2025 年 $0.59B 增至 2030 年 $1.60B（CAGR 22.1%）。本轮研究未取得可访问的北美特定协作机器人美元规模；鉴于人均 GDP
              和产业结构相近，美国数字估计与欧洲大致相当或略高，得到当前美国协作机器人 SAM 粗略为 $0.4B–$0.8B。全球智能机器人市场（M&M，更宽口径，包括服务 + 工业 + 协作）估计 2025 年为
              $13.99B，2030 年增至 $50.33B（CAGR 29.2%）。


              Standard Bots 的 SOM 信号：公司称其有望到明年（据 R&AN 和 Forbes，为 2027 年）交付美国新增工业机器人部署的 10%。套用 IFR 2024 年美国基数 34,200
              台，10% 约等于每年 3,400–3,700 台。以 Standard Bots 完整单元 ASP $47K–$75K 计，若完全达到目标渗透率，意味着年硬件收入运行率潜力约
              $160M–$280M。收入、出货量和实际市占率均未公开披露，仍是开放尽调事项。
