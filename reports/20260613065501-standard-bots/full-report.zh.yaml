      - number: '3.2'
        title: 既有硬件厂商
        blocks:
          - type: paragraph
            body: >
              Universal Robots 于 2005 年创立于丹麦，开创协作机器人品类，并仍是全球市场领导者。其产品从 UR3e（3 kg 载荷）到 UR30（30 kg
              载荷）不等，覆盖与轻工业自动化最相关的载荷范围。UR+ 生态是面向第三方夹爪、传感器、视觉系统和软件模块的认证计划，为 UR 带来深厚集成网络，显著降低大多数标准应用的部署复杂度。UR Academy
              提供免费在线培训。认证组件、培训和全球服务覆盖组合在一起，使 Universal Robots 成为多数分销渠道中首次购买协作机器人客户的默认选择。


              ABB 的协作机器人家族包括 GoFa（5 kg）、SWIFTI（4 kg）、YuMi（双臂，各 0.5 kg）和 Single Arm YuMi，覆盖精密装配和协作工作区共享应用。ABB 强调 SafeMove
              安全系统（ISO 13849-1 下 PL d 级）以及符合 ISO 10218-1:2011 和 ISO/TS 15066。ABB 称自己拥有「the broadest service network in
              the industry」，这一主张依托其完整工业自动化组合，包括变频器、PLC 和过程控制系统；这些产品在大制造商账户层面形成粘性。


              Fanuc 的 CRX Series 提供同级最宽载荷范围——12 款型号覆盖 3–50 kg——并宣传经加速寿命测试支持的 8 年免维护主张。「Cobot and
              Go」预工程解决方案库提供可直接部署的应用模板，缩短集成周期。关键在于，Fanuc CRX-10iA/L Paint 被描述为目前唯一获准按美国安全标准用于喷漆的协作机器人，这给 Fanuc 带来
              Standard Bots 尚未回应的受监管应用护城河。Fanuc 在全球拥有数千家认证伙伴组成的成熟工业集成商网络，意味着其协作机器人很少需要 OEM 亲自推动部署——这是 Standard Bots
              当前缺乏的分销优势。


              KUKA 是德国机器人公司，2016 年被中国家电集团 Midea Group 收购，提供 LBR iisy 协作机器人线和 iiQKA 机器人操作系统。KUKA
              的机械工程积累和全球集成商网络是真实竞争资产，但对要求美国制造或盟国制造组件的部分美国政府相关、国防相关制造商而言，Midea 所有权已成为采购顾虑。
