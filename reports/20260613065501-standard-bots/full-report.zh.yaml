  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入 / 排除支出与替代方案
        blocks:
          - type: paragraph
            body: >
              Standard Bots 面向 AI 原生、无代码工业机械臂和集成应用单元市场，向美国制造商销售或租赁产品。纳入支出包括机器人硬件（机械臂 + 控制箱 +
              特定应用工具）、相关软件订阅和机群管理许可，以及集成服务（DIY Kit、Value-Add 或 Full Integration
              层级）。公司将其可服务市场描述为所有仍在执行重复性体力任务的制造商——机床上下料、焊接、码垛、pick & place、去除材料、装配和检测——这些制造商今天没有机器人，或正在评估替换旧系统。根据
              National Association of Manufacturers 数据，美国有 239,000+ 家制造业机构，其中 74% 雇员少于 20 人；这一长尾群体是 Standard Bots
              明确提出的首个滩头阵地。


              市场排除若干相邻支出类别：大型系统集成商为绿地汽车工厂设计的重型自动化交钥匙系统；用于物流和仓储运输的 autonomous mobile robots（AMRs）和 autonomous guided
              vehicles（AGVs）；临床使用的外科或医疗机器人；以及消费机器人。需要工厂培训程序员或全职集成商才能运行的传统工业机器人，也不属于 Standard Bots
              当前直接可服务市场——尽管它们争夺同一资本预算。Universal Robots 作为该市场细分的开创者，验证了同一组垂直行业（汽车、电子、食品饮料、医疗 / 化妆品、金属 / 机加工、塑料 /
              聚合物），证明潜在应用广度，但不能证明 Standard Bots 的具体渗透率。


              现状替代方案很重要：大多数雇员少于 50 人的美国制造商尚未自动化任何生产步骤，仍依赖人工；2026 年制造业员工平均年收入为
              $106,691（NAM）。在中国、墨西哥等低成本地区进行合同制造仍是结构性替代方案；专为超高产量、低混合生产打造的硬自动化也是替代方案，因为此类生产未必受益于柔性机器人。OSHA
              承认美国缺乏专门机器人安全标准，这使合规义务存在不确定性，也进一步拖慢风险规避型 SMB 运营商的采纳决策。
