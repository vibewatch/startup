      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              Standard Bots 的买方群体分为两个主要带宽：（1）中小型独立制造商（SMBs）——通常为 10–200 名员工、由所有者经营或家族运营的工厂——正在做第一笔自动化投资；（2）大型企业和政府 /
              国防客户，希望把自动化延伸到传统机器人不实用的任务或设施中。公司明确声称服务两者：PR Newswire 和 R&AN 称其覆盖「Fortune 100 companies to hundreds of SMB
              manufacturers across nearly every U.S. state」。基于公司专门应用页面和定价披露，机床上下料、焊接和码垛是最高量的切入点。


              在 SMB 带宽中，买方（决策者）通常是所有者、总经理或运营 VP。预算权集中——小制造商缺乏采购官僚体系，因此周期更快，但要求更低价格和更简单的合理化依据。典型采购触发点是填不上的岗位：NAM 数据显示
              2026 年 4 月制造业有 474,000 个空缺岗位，并预计到 2033 年需要 3.8 million 个新制造业职位。Core 单臂 $37,000、完整应用单元
              $47,000–$75,000；若一台机器人替代一个无法填补、平均制造业工资为 $106,691/year 的岗位，单看硬件成本理论回本期低于 9 个月（公司主张口径，未独立验证）。


              Standard Bots 通过一次性购买和订阅 / 租赁模式提供机器人。租赁路径把预算分类从资本开支（CapEx）转为运营开支（OpEx），这会实质影响 SMB
              采纳可行性——许多小制造商无法获得设备贷款，或受限于严格的 CapEx 审批门槛。IFR 服务机器人报告指出，Robot-as-a-Service 机群模式 2024 年全球增长
              31%，验证了这种由融资驱动的采纳趋势。应用交付层级（DIY Kit、Value-Add、Full
              Integration）又按内部能力进一步分层买方：能力最强的客户以更低总成本自助部署，全服务客户则接受溢价，以换取交钥匙部署。


              企业和政府客户（公司声称包括 Sunoco、Lockheed Martin、Amazon、NASA、US
              Army）采购流程更结构化，销售周期更长，通过资本拨款或联邦合同工具采购，并可能要求合规文档、government furnishing clauses
              和安全审查。这类账户单位收入高，但带来集中度风险，也需要专门的政府 / 企业销售职能。
