      - number: '7.6'
        title: 附录
        blocks:
          - type: callout
            title: 安全认证缺口是最高优先级尽调事项
            body: >-
              截至 2026 年 6 月，任何公开审阅来源中均未确认 Standard Bots 拥有第三方安全认证（CE 标志、UL 列名或 ISO/TS 15066
              符合性声明）。这不必然证明不合规——协作机器人仍可能通过内部工程满足标准——但缺少文件会对进入欧盟市场和受监管行业企业部署造成重大障碍。LOI 后尽调应首先解决这一单一缺口。
            calloutType: risk
            claimRefs:
              - CR004
              - CR011
              - CR013
          - type: callout
            title: 财务不透明阻碍独立验证跑道和估值
            body: >-
              收入、ARR、毛利率、月度烧钱速度和现金头寸完全未披露。因此，$1B 估值缺少任何可从公开来源独立验证的财务指标支撑。若尽调流程不包含完整管理账——包括过去 12
              个月收入、单位经济性和现金跑道——就无法验证这一入场价格下的投资逻辑。
            calloutType: risk
            claimRefs:
              - CR023
              - CR026
              - CR028
          - type: callout
            title: 合同条款将产品安全责任转给客户
            body: >-
              Standard Bots 的标准采购和租赁条款要求客户在首次使用前自行执行风险评估、识别安全配置设置，并添加警示或通知。加上宽泛 AS-IS 免责声明和以已支付费用为上限的责任限制，这种姿态限制了
              Standard Bots 的直接产品责任暴露，但可能在风险厌恶行业的企业采购团队中造成摩擦，并提高客户保险要求。
            calloutType: insight
