      - number: '1.3'
        title: 融资历史、估值与资本结构
        blocks:
          - type: paragraph
            body: >
              Standard Bots 公开披露的融资历史至少包括两轮机构融资，并最终进入 Series C 独角兽状态。最近一轮已确认的此前融资是 Series B；Crunchbase 显示该轮于 2024 年 7 月
              12 日完成，Forbes 称由 General Catalyst 领投，总额 $63 million。Crunchbase 列出 12 家投资方，包括 BoxGroup 和 Lachy Groom；Tracxn
              报告 11 家机构投资方，Series B 和 Series C 两轮累计融资 $263 million，但公开数据库可能未捕捉更早的种子轮或天使资金。


              2026 年 6 月 9 日，Standard Bots 宣布以 $1 billion 投后估值完成 $200 million Series C。本轮由 RoboStrategy
              领投——这是一只公开交易的封闭式机器人基金（Nasdaq: BOT）——现有投资方 General Catalyst 参投。RoboStrategy CEO Andrew Kang 和 General
              Catalyst 合伙人 Max Rimpel 均提供了公开署名引述支持本轮融资。从 2024 年 $63M 上轮融资到 $200M 本轮融资，公司在资本额和估值上都大幅跃升，符合 2025-2026 年
              physical-AI 融资节奏。


              Series C 公告与扩产计划同步：纽约州 Glen Cove 制造设施将扩至 70,000 平方英尺，以扩大垂直整合生产。已知轮次披露的总资本约为 $263 million（Tracxn），或约
              ~$263M+（Series B $63M + Series C $200M），但受未披露早期资本影响。未公开披露任何老股交易、债务安排或授信额度。公司仍为私营。


              TechFundingNews 另称 Evan Beard 曾在国会作证并为 White House 提供建议，这可能带来政策相关的非稀释性影响力；但尚无公开确认公司自身获得政府拨款或合同。
