  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Standard Bots 瞄准美国 SME
              和轻工业协作机器人单元市场。这个市场过去主要由两类方案服务：直接用人工（最大的现状替代）或通过硬件厂商、增值经销商（VAR）和系统集成商组合部署六轴协作机器人。竞争场可分为四组：（1）全线自动化既有厂商——Universal
              Robots、ABB、Fanuc 和 KUKA——它们主导装机基础；（2）Doosan Robotics 和 Techman Robot
              等二线协作机器人挑战者；（3）用现成工业机械臂加集成服务进行内部自建的替代方案；（4）继续使用人工并定期提升员工技能的直接现状替代。


              Universal Robots 拥有全球协作机器人市场最大份额，自 2005 年起开创该品类。ABB 和 Fanuc 均拥有更广的工业自动化产品组合和深厚集成商网络。KUKA 现由
              Midea（中国）控股，机械深度相同，但给美国政府相关买方带来采购风险。挑战者中，Doosan 和 Techman 已在亚太站稳脚跟，但在北美分布较弱。Standard Bots
              的差异点在于，它是该价格层级唯一美国本土制造的 AI 原生完整单元供应商——但这一差异必须与明显更小的生态成熟度和服务覆盖相权衡。


              现状替代——持续人工——仍是主导竞争力量。尚未自动化的制造商经常把前期成本、编程复杂度和集成风险列为障碍。Standard Bots
              的无代码部署和完整单元模式，就是为消除这些障碍而设计；它直接竞争的是人工流程惯性，而不只是其他硬件厂商。
