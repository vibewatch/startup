      - number: '8.4'
        title: 退出准备度、尽调要求与否决触发点
        blocks:
          - type: paragraph
            body: >
              Standard Bots 目前并不适合近期公开上市退出。公司的 S-1 准备度受限于：（1）公开领域没有经审计的 GAAP
              财务数据；（2）制造扩张复杂，投资者需要通过工厂走访和供应链尽调来理解；（3）协作机器人市场环境里，公开可比公司（Teradyne/UR）收入承压，IPO
              路演可比口径不利。近期最可能的退出路径，是被战略买方收购——ABB、KUKA 母公司 Midea、Fanuc，或一家美国大型国防 / 工业主承包商——这些买家可能想拿下美国本土 AI
              原生制造能力和客户关系。White House 政策顾问角色，以及 U.S. Army / Lockheed 客户关系，可能让 Standard Bots 对国防工业并购具备吸引力，从而绕开典型 IPO
              准备度要求。


              制造扩张计划（70,000 sqft 工厂，到 2027
              年实现「从金属进厂到机器人出厂」的垂直整合目标）是一把双刃剑：若执行成功，它会带来耐久竞争优势，以及来自密集部署的专有数据；但它也显著增加资本开支承诺和执行风险。Standard Bots
              计划自行设计执行器，并在 Glen Cove
              内部组装每一台设备；对一家本可外采组件的创业公司来说，这是不寻常的战略选择——它显示公司对降本路线图有很强信心，但也制造了关键工厂集中风险（火灾、洪水、劳工行动、许可撤销）。


              协作机器人部署历来卡在初次客户演示与可盈利规模化部署之间的长周期。The Robot Report 关于协作机器人并非制造商「银弹」的分析强调，相比企业客户预期，SMB
              客户部署往往拉长时间线并压缩利润率。Needham & Company、Bal Strategic Partners 和 Optimal PCA 担任 Series C
              交易的战略顾问，说明公司正在建立资本市场关系——这对 IPO 可选性是正面信号，但不足以证明退出已经临近。
