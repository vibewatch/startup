  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >
              Standard Bots
              的收入主要来自打包自动化单元销售——一套可直接部署的完整系统，包含机械臂、控制硬件、软件，以及夹爪、气动元件等按应用配置的配件。公司在具体应用落地页公布标价；对一家工业机器人厂商来说，这种价格透明度并不常见。旗舰
              Core 机械臂标价 $37,000；Thor 重载机械臂标价 $49,500。围绕这些机械臂搭建的应用单元系统价格更高：机床上下料单元起价 $47,000（DIY Kit）或 $57,000（Value-Add
              Package，含现场培训），码垛和焊接单元 DIY 档均从 $75,000 起。Standard Bots 给出的竞争定位是比传统工业机器人 OEM 低 20–30%——其自家公开对比表列出 Fanuc
              CRX-10iA/L 为 $50K+、Core 标价 $37K，Fanuc CRX-30iA 为 $65K+、Thor 为
              $49.5K。公司把这一定价差解释为结构性优势，来源于美国本土垂直一体化制造、直销和自研组件设计。

              收入来源不止硬件。三档服务定义客户关系：（1）DIY Kit——机器人、配件、软件和文档；客户自行安装；（2）Value-Add Package——配置、现场培训和产线爬坡支持，每个单元加价
              $10,000；（3）Full Integration——交钥匙设计、安装、集成和优化，按项目报价。官网同时放出租赁条款页和采购条款页，说明面向资本开支受限的 SMB
              买家存在融资路径，但租赁费率和条款未公开披露。公司另有专门的软件产品（standardbots.com/software）和 AI
              产品页（standardbots.com/ai），但软件价格，以及它是单独订阅还是打包进硬件销售，均未公开披露。支持经济性——30 分钟内响应、24 小时内现场、美国 24/7
              覆盖——作为随附权益营销，而非单独定价的 SKU；支持成本是计入硬件毛利还是作为附加服务销售，仍未披露。
