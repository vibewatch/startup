      - number: '5.3'
        title: AI 与示教训练：Flux 平台
        blocks:
          - type: paragraph
            body: >-
              Standard Bots 将其 AI 能力命名为「Flux AI」Video-Language-Action（VLA）模型，并以「Physical
              AI」标签营销。其工作流描述为：（1）操作员通过遥操作、手引导或传统点动示范任务；（2）机载视觉捕捉人的动作；（3）数据在复核步骤中标注和注释；（4）模型在云端训练并做版本管理；（5）机器人用学到的模型自主执行技能。公司把这称作「self-serve」，并称其为「first
              self-serve AI platform for industrial robots」。AI 产品页列出的当前上线功能包括 teleop-capture、anti-gravity
              teaching（助力抬升）、标注 / 注释 / 复核工具和云训练。一项明确标为「Coming in 2026」的功能是自然语言任务编程——「Describe your task. Automate
              program.」——这说明完全自主的文本到动作生成尚未上线。此外，开发者页面将 AI 技能分发（「Create your own AI skills without code」）列为「Coming
              soon」。Bolt 页面也提到 AMR 平台的「Fully autonomous navigation (coming soon)」。Forbes 分析指出，Standard Bots
              现在时态声称「几乎所有零部件都自行设计」并不等于当前已经制造所有零部件；这一点也给 AI 就绪度声明增加了类似谨慎。公开来源中未发现关于 Flux AI 平台的同行评议论文、独立基准或 ISO
              定义的自主等级认证。
