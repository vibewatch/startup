      - number: '3.4'
        title: Standard Bots 的差异化、护城河与竞争脆弱点
        blocks:
          - type: paragraph
            body: >
              Standard Bots 的主要竞争主张是：（1）在该价格点唯一美国组装的 AI
              原生完整单元协作机器人系统；（2）无代码、通过示范教学的编程，消除对专业集成商的需求；（3）垂直整合产品架构，使其比硬件授权型竞争者迭代更快。


              这些主张形成了真实但脆弱的护城河。无代码界面优势正承受既有厂商压力，它们不断给现有产品添加简化 UX 层——UR 的 PolyScope、Fanuc 的腕部按钮教学，以及 Fanuc 预工程「Cobot and
              Go」套装，都会降低非专家用户的编程门槛。AI 原生架构让 Standard Bots 在装机基础扩大后有机会获得全机群学习优势，但当前装机基础（数百个 SMB 部署）远小于 Universal Robots
              全球超过 100,000 台的装机基础——这意味着来自机群数据积累的竞争强化尚未实质化。


              美国制造定位在短期内耐久——Standard Bots 价格层级没有直接可比的本土制造协作机器人——但它依赖关税保护主义政策环境，以及到 2027 年几乎所有东西都内部制造的承诺，而该承诺尚未被证明。Forbes
              指出，「designs almost all its own parts」并不意味着 Standard Bots 目前制造所有自有零部件——2027 年期限是路线图，不是当前运营状态。


              Standard Bots 相比既有厂商最具体的结构性缺口是生态。Universal Robots 的 UR+ 计划和 Fanuc
              的集成商网络合在一起，意味着买方几乎可为任何标准应用获取认证即插即用外设和本地服务技术员。Standard Bots 目前没有公开的集成商认证计划或等效第三方外设生态，买方必须直接依赖 Standard Bots
              获得应用支持——这会成为限制并行增长的瓶颈。Standard Bots 当前创造的切换成本低：30 天试点模式降低了首次购买摩擦，但尚未形成 UR+ 对多年粘性客户创造的生态锁定。
