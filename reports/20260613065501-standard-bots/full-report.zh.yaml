      - number: '7.4'
        title: 人员、执行与治理风险
        blocks:
          - type: paragraph
            body: >-
              最尖锐的人员风险集中在 Evan Beard 身上，他同时担任 Founder、CEO 和 Chief Engineer。对一家估值 $1B
              的公司而言，这种三重角色并不常见，也意味着深度技术参与；若其离开，很难快速复制。Beard 是所有新闻稿、投资人材料和国会政策证词中的主要公开发言人，是品牌门面，也是外部信任的主要通道。公司未公开披露继任计划、副
              CEO 或 co-CEO 安排。

              联合创始人 James Cordle 在任何已审阅来源中都没有公开背景信息；他的角色、职责和行业经验未知。联合创始人 David Golden 拥有 Bowery Farming 和 LeapPay
              带来的强风险投资规模化执行经验，但其在 Standard Bots
              内部的运营重点未在公开材料中说明。董事会构成、独立董事人数、治理委员会结构和任何顾问委员会成员完全未披露。作为现阶段私营公司，这种治理透明度缺失可以预期，但会限制投资人观察决策问责和争议解决机制。

              并行议程过宽，推高执行风险：工厂扩至 70,000 平方英尺、到 2027 年完成垂直制造整合、Bolt GA 发布、多 SKU 产品支持、AI 路线图交付，以及同时放大 Fortune 100
              账户。公司声称有望在下一年「交付美国新增工业机器人部署的 10%」，这意味着产能和 GTM 能力已到位，但尚未获独立验证。员工数、流失率和薪酬结构均未披露。
