      - number: '1.4'
        title: 产品家族、客户规模与运营足迹
        blocks:
          - type: paragraph
            body: >
              Standard Bots 提供四条机器人产品线。Spark 是紧凑型桌面协作机器人（7 kg 载荷、900 mm 工作半径、±0.025 mm 重复定位精度），面向 R&D 实验室、轻制造和精密装配。Core
              是旗舰六轴机械臂（18 kg 载荷、1.3 m 工作半径、±0.025 mm 重复定位精度、最高 3 m/s 线速度），起价 $37,000——对标 $50,000+ 的 Fanuc CRX-10iA/L 和约
              12.5 kg 载荷的 Universal Robots UR10e。Thor 是重载版本（30 kg、2 m 工作半径、296 mm 占地），面向码垛和重载应用。Bolt 是双臂 droid
              平台，提供固定式、移动式和垂直升降配置；截至访问日，其产品页称「coming soon」，并已开放预订。


              软件差异点包括：通过触摸屏进行无代码可视化编程；跨多台机器人的机群管理；内置 3D 腕部相机（Core 可选）；Flux AI Skill 可捕捉操作员示范并自主复现；以及基于云的模型训练流水线。公司将 AI
              原生、基于示范的教学定位为相对传统协作机器人供应商的结构性护城河。


              公司和媒体沟通将客户规模描述为「hundreds of American companies in nearly every state」。具名企业客户包括 Sunoco（油气）、Lockheed
              Martin（航空航天 / 国防）、Amazon（物流）、NASA（政府）和 U.S. Army（国防）。Robotics & Automation News 提到 Adient 是客户。具名 SMB 客户包括
              Shaw Barrels（案例研究：深孔钻孔生产率提升 4X），网站上还出现来自 Amazon、TMMI、Mac Products 和 Reason Robotics 的推荐语。


              应用单元按完整套装定价：机床上下料从 $47,000（DIY）到定制报价（Full Integration）；焊接系统从 $75,000 起；码垛从 $75,000 起。公司在应用页面称 100+
              领先制造商「already scaling」。准确客户数、收入、ARR、NRR 和员工数均未公开披露。


              制造足迹位于纽约州 Glen Cove（主要组装和设计）；设施正在扩至 70,000 sq ft。公司设定的 2027 年目标是在美国本土制造每个组件（「metal in to robots
              out」）。公司直销，并在全美分布支持人员——包括应用工程师。公开材料未提及国际运营或美国以外部署。
