  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              Standard Bots 进入 2026 年 6 月尽调窗口时，叙事锚点很强：公司称自己是美国最大的 AI 原生工业机器人制造商，背后有 General Catalyst 和 RoboStrategy
              支持，投后估值 $1 billion。乐观逻辑有五根支柱。第一，全球协作机器人市场够大且仍在增长——行业分析师预计到 2030 年复合年增长率超过 17%，IFR
              数据也确认，去年中国安装的工业机器人数量是美国的九倍，意味着美国本土有大量追赶需求，回流激励、关税保护等政策顺风可能进一步提速。第二，Standard Bots
              已经拼出可信的企业客户名单——Sunoco、Lockheed Martin、Amazon、NASA、U.S. Army，以及几乎遍布各州的数百家 SMB 制造商——显示产品在 Fortune 100
              和中端市场垂直行业里都有市场契合。第三，公司的无代码编程模式和 AI 原生架构，把可触达买家从能操作传统机器人编程环境的成熟运营团队，扩大到更广的人群。第四，垂直整合叠加美国本土组装，让 Standard
              Bots 区别于暴露在关税风险下的进口商；公司还声称相对传统制造商有 30% 价格优势。第五，公司是 White House 和 Congress 制定 National Robotics Strategy
              的主要顾问，拥有小型同行不具备的监管入口。


              反向逻辑同样有充分支撑。最关键的弱点是结构性的财务不透明：公司没有公开披露收入、ARR、毛利率或烧钱速度。因此，$1 billion
              估值完全是面向未来的叙事估值，没有收入倍数作锚。更近的可比公司信号明确偏负面：Teradyne 的 Robotics 分部（Universal Robots + MiR 协作机器人）2025 年收入下滑
              15.5%，并裁员约 400 人，说明对成熟玩家而言，短期协作机器人市场在收缩而非扩张。硬件优先的机器人创业公司，估值风险天然高于软件主导企业，因为资本强度会放大每一次运营失误：70,000
              平方英尺的工厂扩建一旦延期或超预算，就会直接侵蚀现金跑道。此外，Wired 对机器人革命为何迟迟未至的分析强调，机器人演示与可盈利规模化商业部署之间仍有长期缺口；Standard Bots
              还没有用公开财务证据跨过这道坎。Reuters 的关税分析显示，本土制造商的投入成本压力可能压低重资本自动化投资需求，而这恰恰发生在 Standard Bots
              试图扩张的时候。合起来看，投资逻辑真实存在，但在当前披露水平下无法验证。
