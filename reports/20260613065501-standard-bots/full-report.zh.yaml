      - number: '7.3'
        title: 合作伙伴、依赖与财务风险
        blocks:
          - type: paragraph
            body: >-
              Standard Bots 的资本结构由两家投资人主导：General Catalyst（Series B 领投、Series C 共同领投）和 RoboStrategy（Series C
              新共同领投）。RoboStrategy 被描述为聚焦机器人的主动管理封闭式基金；其过往业绩和 LP 基础未公开记录，因此难以评估是否有后续支持，或该基金是否有足够 dry powder
              参与未来轮次。投资人基础集中会在公司错过增长目标时提高 down-round 和过桥融资风险。$1B 投后估值意味着收入倍数承销，但没有 ARR 披露就无法确认；公开来源下财务跑道完全不透明。

              供应链侧，在实现 2027 年内部制造目标之前，公司依赖第三方供应商提供电机、伺服驱动、编码器和 GPU 计算单元等组件。焊接单元依赖 Miller Electric（AutoDeltaWeld 350）和
              Tregaskiss/ITW 耗材。Standard Bots 条款中的不可抗力条款明确承认「transportation facilities, fuel, energy, labor or
              materials」短缺暴露——这表明组件供应风险是真实且被合同确认的。Reuters 和 WSJ
              报道提到的美国进口机器人和组件关税政策，会在公司向完全垂直制造过渡期间，为任何非美国本土来源组件带来投入成本不确定性。Teradyne 的 Universal Robots 分部在 2025 年 10-K
              中报告收入同比下降 15.5%，并计提约 $6 million 库存准备，说明传统协作机器人市场短期需求走软，Standard Bots 必须在扩张中穿越这一环境。
