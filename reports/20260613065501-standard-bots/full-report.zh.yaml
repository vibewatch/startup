      - number: '5.5'
        title: 信任、安全、合规与质量控制
        blocks:
          - type: paragraph
            body: >-
              Standard Bots 机器人被设计为在碰撞检测安全模式下运行的协作机器人。Spark 机械臂达到 IP69K（机械臂）/ IP44（控制箱）；Thor 达到 IP69K。Core 规格列出 IP54
              设计等级。OSHA 指出，美国没有专门的联邦机器人标准，但行业安全由 ISO 10218（工业机器人）和 ISO/TS 15066（协作机器人）约束，协作机器人行业文献均引用这两项标准。Standard Bots
              官网称，凭借自动碰撞检测，机器人不需要安全围栏或防护装置。不过，已审阅来源中未发现公开验证的第三方安全认证（CE 标志、UL 列名或 ISO TS 15066 符合性声明）。焊接单元集成 Miller Auto
              DeltaWeld 350 设备，并使用 Tregaskiss® Cobot MIG Gun 和 AccuLock™ 耗材，显示焊接场景中存在第三方认证外设集成。公司提供 30
              天免费现场试点，含现场培训（「Jump Start sessions」）。正常运行时间保证为 99.9%，电话响应时间承诺低于五分钟，现场支持在 24
              小时内到达——这些是服务等级承诺，并未经独立审计。现有来源中未发现 CE 标志、CSA 认证或第三方符合性文件证据；这对企业客户和受监管行业客户构成重大尽调缺口。
