      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              据 PR Newswire 上 2026 年 6 月 Series C 新闻稿，Standard Bots 由 Evan Beard、David Golden 和 James Cordle 联合创办。Tracxn
              和 TechFundingNews 均报告成立时间为 2011 年；不过 GreyJournal 在 2026 年 6 月公告中称该公司「eight years old」，这会指向约 2018
              年成立。鉴于数据库记录中出现 2011 年，本报告采用该数字，但因存在冲突，置信度为中等。TechFundingNews 提到 Evan Beard 此前联合创办 A Plus 和 Gridtech。David
              Golden 据 TechFundingNews 于 2020 年以联合创始人身份加入；他此前联合创办 Bowery Farming（累计融资 $473M，Fidelity/GV/General Catalyst
              支持，美国最大垂直农场公司）和 LeapPay（2014 年出售给 Funding Circle）。未找到 James Cordle 的公开背景资料。


              Evan Beard 担任创始人、CEO 兼首席工程师——这一不常见的三重头衔显示其在高管层面深度参与技术。TechFundingNews 称，他曾为 White House 提供建议，并在
              Congressional Joint Economic Committee 就制造业和机器人政策作证。关键人物风险高：Beard 是所有主要新闻稿、投资者材料和政策论坛中的主要公开发言人。


              Standard Bots 招聘页面列出的领导团队包括：David Golden（Co-Founder）、Zach Tomkinson（Chief Commercial Officer）、Hunjoo
              Kim（Head of Manufacturing Operations）、Ash Higgins（Chief Strategy Officer）、Lee Gross（Head of
              Software）、Robert Irwin（Head of Hardware）和 Dan Grover（Head of
              Product）。招聘页未逐一列出团队成员过往雇主，只提到来自未具名的「pioneering companies」。


              董事会构成和治理结构未公开披露。公司沟通中未点名任何投资人董事席位。截至 2026 年 6 月报告日期，未见重大领导层变动、离职或内部冲突的公开报道。Business and Human Rights
              Resource Centre（BHRC）维护 Standard Bots 公司资料页，但未列出指控或已报道事件；截至访问日，该来源给出干净的反向信号。
