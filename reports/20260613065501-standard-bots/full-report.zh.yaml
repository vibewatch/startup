      - number: '8.3'
        title: 情景分析——乐观、基准与悲观
        blocks:
          - type: paragraph
            body: >
              Standard Bots 没有披露收入，情景分析只能从代理指标出发：公司称到 2027 年有望交付美国新增工业机器人部署的 10%；若美国市场每年安装约 44,000–60,000
              台机器人，这意味着相当大的规模。按每个应用单元 $47,000–$75,000 的平均系统价值估算，50,000 台的 10% 对应 $235–375 million 年收入，足以强力支撑 $1 billion
              估值。不过，10% 部署目标来自公司口径，尚未被任何独立来源验证。IFR 预计全球协作机器人市场到 2030 年将以 17%+ CAGR 增长；若增长兑现，且 Standard Bots
              从收入下滑的竞争者（尤其是 Universal Robots）手中抢到份额，乐观情景就有可信度。


              乐观情景假设：（1）下一轮融资前收入超过 $150 million ARR；（2）硬件 + 软件捆绑毛利率超过 40%；（3）工厂扩建按时且低于预算完成；（4）General Catalyst
              继续作为锚定投资方，推动 Series D 以更高估值完成。基准情景假设进展更温和——下一轮融资时 ARR 为 $50–100 million，毛利率处于 30–35% 区间——这意味着 $1 billion
              估值略显拉伸，下一轮定价接近平轮或小幅下调。悲观情景包括需求疲软（与 Teradyne 2025 年轨迹一致）、资本密集型制造扩张带来的高烧钱速度，以及 2027–2028 年被迫以显著低于 $1 billion
              的估值下轮融资。没有财务数据，很难评估各情景概率信号，但缺乏披露本身会让保守投资者天然更偏向基准或悲观情景。


              优先股结构和清算优先权完全未披露。在基准或悲观情景下，高级优先股持有人（以 RoboStrategy 和 General Catalyst
              为首）可能先于普通股股东收回资本，使不同股权层级的回报明显分化。优先股堆叠不透明，是任何回报分析中的重大缺口。General Catalyst 重复参与（领投 Series B，并共同领投 Series
              C）是正面信号，说明内部投资人有信心；但内部人主导的融资，也会给新进入者带来信息不对称风险。
