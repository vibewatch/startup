              若干重要指标无法从公开来源获得。收入、ARR、毛利率、NRR
              和烧钱速度均未披露——公司是私营企业，也没有提交公开文件。员工数未在任何地方公布；招聘页面列出软件、制造、应用工程、销售和技术岗位，显示公司正在招聘，但未给出员工总数。客户数只被描述为「hundreds of
              American companies」。「美国新增工业机器人部署 10%」是公司预测，不是已报道数字，并依赖对美国总部署量的私人估计。


              成立日期存在冲突：Tracxn 和 TechFundingNews 报告为 2011 年；GreyJournal 在 2026 年 6 月称公司「eight years old」，暗示约 2018 年。本报告采用
              2011 年作为数据库佐证值，但仍需验证。


              联合创始人 James Cordle 出现在 Series C 新闻稿中，但未出现在招聘领导层页面，也没有可访问来源中的公开资料——其当前角色、股权位置和职责无法由公开证据验证。


              投资人董事席位和治理条款未披露。此前轮次估值（Series A、种子轮，如有）不可得——Crunchbase 显示最近一轮为 2024 年 7 月 Series B，未给出更早轮次数据。


              具名企业客户的独立佐证有限：Amazon、Lockheed Martin、NASA 和 U.S. Army
              出现在新闻稿和公司材料中，但未找到独立采购记录、合同公告或第三方客户确认。网站推荐语来自个体操作员而非高管，并引用公司而非正式合同。
