  - id: FM001
    title: 市场规模金字塔 — TAM / SAM / SOM
    type: pyramid
    layout: standard
    summary: 从最宽的全球智能机器人机会，到 Standard Bots 声称的美国部署份额目标，展示层层嵌套的市场，并列出每一层有来源支持的数值。
    approximationNotes: >-
      美国硬件 TAM 来自 IFR 34,200 台 × $50K–$100K ASP 区间；并非来自已发布的美元口径。SAM 代表美国市场； SOM 是公司声称的目标（美国安装量的 10%）。全球智能机器人 TAM 来自 M&M
      付费墙摘要；定义宽于单纯工业机器人。 除标注为实际值的项目外，所有数值都应视为数量级估计。
    data:
      nodes:
        - id: L1
          label: 全球智能机器人市场（TAM — 宽口径）
          detail: M&M 估计：2025 年 $13.99B，2030 年增至 $50.33B（CAGR 29.2%）。包括全球工业、服务和协作机器人。 这是最宽的市场边界；不是 Standard Bots 的主要参照市场。
        - id: L2
          label: 全球工业机器人安装量
          detail: IFR 2024：全球安装 542,000 台；运行存量 4,664,000 台（+9%）。预测 2025 年 575,000 台； 2028 年超过 700,000 台。仅硬件；IFR 未发布美元口径 TAM。
        - id: L3
          label: 美国工业机器人市场（SAM）
          detail: IFR 2024：美国安装 34,200 台。按 $50K–$100K ASP 推导硬件价值：约 $1.7B–$3.4B/年（中枢约 $2.1B）。 本土供应商少；美国大多从日本和欧洲进口机器人。美元数字置信度低。
        - id: L4
          label: AI 原生 / 无代码美国细分（SOM 目标）
          detail: >-
            Standard Bots 称目标是在 2027 年拿下美国新增工业机器人部署的 10%（按 2024 年基数约 3,400–3,700 台/年）。 按每个应用单元 $47K–$75K
            ASP，完全渗透时隐含收入潜力约 $160M–$280M/年。 当前客户数未披露（声称「100+」）；实际市场份额未独立核验。
    claimRefs:
      - CM004
      - CM008
      - CM021
      - CM022
