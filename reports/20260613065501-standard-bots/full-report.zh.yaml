  - id: TV005
    title: 投资逻辑破裂与止损触发条件
    columns:
      - 触发条件
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入停滞
        - 数据室或新闻确认 ARR 同比增长 <20%
        - 估值重估至 <$500M；$1B 标记站不住
        - 退出持仓或不跟投；重新评估可比公司集合
      - - 下轮融资降价
        - 下一轮股权融资投后估值低于 $1B
        - 定价动能丧失；后进投资人被优先权稀释；目标落空的信号
        - 评估清算优先权瀑布；测算普通股回收情景
      - - 关键人物离职（CEO/CTO）
        - Evan Beard 或联合创始人离职，且未公布继任者
        - 融资风险上升；战略不确定；尽调中标记执行依赖
        - 立即升级；领导层交接确认前暂停跟投
      - - 竞争对手价格匹配
        - Universal Robots、ABB 或 KUKA 公开将价格匹配到 Standard Bots 定价 15% 以内
        - 定价护城河被削弱；竞争差异收窄到软件和集成
        - 加快评估竞争护城河；要求在 NDA 下披露毛利率
      - - Glen Cove 工厂资本开支超支
        - 工厂总成本超过 $50M，或建设进度延误 >6 个月
        - 烧钱加速；现金跑道缩短；下一轮融资可能更早发生且条款更差
        - 向 CFO 索取更新后的现金状况；按修订后烧钱速度评估现金跑道
    notes: 触发阈值仅作指示；监控需要直接访问公司财务。止损条件设计为可通过外部信号或 NDA 数据室观察， 不需要诉讼级别的取证。阈值按重大变化级别校准，而不是追求精确。
    claimRefs:
      - CV038
      - CV039
      - CV046
      - CV040
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入 / ARR
        - 截至 2026 年 6 月，ARR、收入运行率或任何收入指标均未公开披露
        - 没有收入锚点，无法计算收入倍数，也无法验证 $1B 估值标记
        - 要求访问 NDA 数据室；与部署数量 × 估计 ASP 对照
      - - 毛利率
        - 硬件和软件毛利率未披露
        - 即使高速增长，硬件毛利率低于 30% 也会让 $1B 估值极难自洽
        - 索取管理层 P&L；对标 Teradyne Robotics 和可比硬件公司
      - - 股权结构表 / 清算优先权
        - 优先股结构、参与权和清算瀑布未公开
        - 没有优先股堆叠就无法计算普通股回报；降价轮回收取决于优先级
        - 向 Series C 数据室索取股权结构表摘要和优先权安排
      - - 客户流失 / 留存
        - 未披露部署留存、流失率或复购数据
        - 部署基础的耐久性支撑经常性收入和 TAM 渗透逻辑
        - 在 NDA 下做客户推荐访谈；索取队列分析
      - - 烧钱速度和现金跑道
        - 月度现金消耗和当前现金跑道未披露
        - 资本充足性不透明；若烧钱速度高，存在被迫以不利条款融资的风险
        - 在 NDA 下索取 CFO 经营模型；围绕工厂扩张节奏做情景分析
      - - 安全和质量认证
        - 最新产品（Bolt、Spark）的 OSHA/ISO TS 15066 及 CE/UL 认证状态未公开确认
        - 企业和政府客户可能要求取得认证后才批准部署；缺少认证 = 销售摩擦
        - 索取当前认证文件；确认产品组合中每个 SKU 的 ISO 和 OSHA 合规状态
    notes: 各项按买入决策视角下的投资重要性排序。收入和毛利率是买入建议前必须确认的阻断项。 股权结构表和烧钱速度是次级阻断项。认证和留存很重要，但单项并非决定性因素。所有问题均假设可获得标准 NDA 访问。
    claimRefs:
      - CV010
      - CV031
      - CV046
