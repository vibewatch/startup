  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群分层
        blocks:
          - type: paragraph
            body: >
              Standard Bots 服务两类大致可区分的客户：中小制造商（SMB），通常是家族拥有或扎根区域的工厂；以及大型企业账户，包括 Fortune 100 工业公司、政府机构和国防承包商。公司在 2026 年 6
              月 Series C 新闻稿中明确称自己服务「从 Fortune 100 公司到全国数百家 SMB 制造商」。截至同一日期，公司声称部署已覆盖「几乎每个州」。


              从买方—用户—付款方动态看，典型付款方是工厂老板或运营副总裁；买方是评估自动化 ROI 的制造工程师或工厂经理；用户则是通过示教编程机器人的车间操作员。30
              天免费试用显著降低付款方承诺门槛，使客户可先试点、再转为完整租赁。


              SMB 制造商似乎是数量上占主导的队列——「数百家」对比少数具名企业账户。使用场景主要是机床上下料、焊接、码垛和检测。企业队列（Sunoco、Adient、Lockheed
              Martin、Amazon、NASA、US Army）出现在新闻稿中，但单个部署未获独立确认。


              教育渠道是刚起步的第三类客户。Standard Bots 运营 Education Program，以 $29,500 向大学、技术学校和中学机构提供 Spark 机械臂套件。页面声称「Trusted by
              The Nation's Leading Institutions」，但未列出机构名称。教育管线旨在把受训毕业生导入制造业雇主账户，但这一收入流仍处早期，向商业账户转化尚未证实。
