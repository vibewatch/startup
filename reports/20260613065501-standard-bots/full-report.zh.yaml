      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 建议：观察 / 继续研究
            body: >
              基于截至 2026 年 6 月 13 日可获得的公开证据，建议立场为观察 / 继续研究。Standard Bots 有吸引力的产品叙事、强客户名单，以及支持 $1 billion
              估值的知名投资人。不过，公司完全没有披露收入、毛利率、烧钱速度和股权结构表，造成无法消除的估值不确定性。按可比公司倍数计算，$1B 估值意味着 $67–200M ARR——几乎肯定尚未达到，但若公司兑现 10%
              美国部署份额目标，未来 2–3 年内可能实现。买入建议至少需要：（1）ARR 确认 ≥$100M，（2）毛利率确认 >35%，（3）工厂扩张按期推进，（4）在 NDA 下审阅股权结构表。
            calloutType: recommendation
            claimRefs:
              - CV031
              - CV036
              - CV041
          - type: callout
            title: 阻断风险：$1B 估值下的财务不透明
            body: >
              对估值最重要的单一风险是结构性的：Standard Bots 没有披露任何收入或财务指标，使 $1 billion 投后估值完全依赖前瞻叙事。相比 Teradyne Robotics 分部按收入下滑基础上的
              5–6 倍交易，Standard Bots 的 $1B 估值意味着未披露收入上的 5–15 倍——区间很宽，若没有 NDA 访问就无法锚定。如果收入处在隐含区间低端（$50–75M
              ARR），即便给予增长溢价，估值也偏激进。硬件优先的机器人公司在规模化时历来面临利润率挤压；没有毛利率可见度，就无法验证经济模型。
            calloutType: risk
            claimRefs:
              - CV010
              - CV032
              - CV042
          - type: callout
            title: 关键信号：General Catalyst 重复参与
            body: >
              General Catalyst 在 2024 年领投 Series B，并在 2026 年 6 月共同领投 Series C，代表有意义的内部人信心。GC
              是高质量机构投资人，能看到外部投资者看不到的私营公司财务数据。它在 $1B
              估值下继续参与，是目前最强的信号，说明内部财务表现达到或超过预期。这不能替代外部尽调，但显著降低了围绕产品市场契合和执行质量的叙事风险。以 $1B 估值进入的投资者，应把 GC
              重复下注视为正面信号——但也要注意本轮内部人与外部资本之间的信息不对称。
            calloutType: insight
            claimRefs:
