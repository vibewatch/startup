      - number: '5.2'
        title: 软件栈：StandardOS、无代码界面、车队管理与 API
        blocks:
          - type: paragraph
            body: >-
              StandardOS 是 Standard Bots 自研机器人操作环境，定位为 ROS 系栈的替代方案。它提供在 iPad
              上操作的无代码拖拽界面；公司称，没有机器人经验的工厂工人也能在一天内编写流程。车队管理内置于单一应用界面，操作员可监控状态，并在单台机器人或车队之间切换。流程编辑器用可读的分步文本呈现程序，而不是代码，并支持同时并排查看
              / 编辑完整流程和单个步骤。面向开发者，Standard Bots 通过原生 REST API 和 SDK 暴露 StandardOS；Python 和 TypeScript SDK
              已列为当前可用，C++、Rust 和 Go 则明确标为「coming soon」。开发者页面写着「No ROS, no worries」，但也承认兼容偏好 ROS
              的用户。公司宣传可直接即插即用地集成夹爪、输送带、第七轴滑台和直线执行器，无需额外驱动。Thor 产品页列出原生 EtherNet/IP
              和现场总线支持，作为工业连接能力。公司称，程序部署后可离线运行，只有软件更新、远程支持或联网应用才需要网络连接。
