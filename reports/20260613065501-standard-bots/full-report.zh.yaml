      - number: '4.2'
        title: 融资历史与资本充足性
        blocks:
          - type: paragraph
            body: >
              2026 年 6 月，Standard Bots 完成由 RoboStrategy（一只聚焦机器人领域的封闭式基金）领投、老股东 General Catalyst 继续参与领投的 $200M Series
              C，跻身独角兽。此前，公司在 2024 年完成 $63M Series B，同样由 General Catalyst 领投。因此，公开披露的累计融资约为 $263M；更早的 Pre-Series B
              轮次在已审阅公开来源中均未得到确认。$1B 投后估值和 $200M 融资意味着投资人基于收入倍数承销，但没有 ARR 披露就无法确认——General Catalyst
              分析师引用的价值逻辑是「机器人民主化」，而非某个具体收入倍数。

              新 Series C 资金投向一个明确且资本密集的项目：把纽约 Glen Cove 工厂扩至 70,000 平方英尺，并加快垂直制造整合。公司称计划到大约 2027
              年「几乎全部自制」，这意味着已宣布的不动产扩张之外仍会有持续资本开支。厂房扩建、工装、组件制造爬坡和员工扩张叠加，使这笔资金用途对一家工业机器人创业公司明显偏重资本开支。月度烧钱速度、交割后现金余额和现金跑道完全未披露。$200M
              融资对现阶段公司而言可能提供多年跑道，但没有烧钱速度披露，公开来源无法计算跑道。

              Teradyne 2025 年 10-K 提供了有参考价值、但不利于简单外推的对照：Universal Robots 母公司报告其 Robotics 分部 2025 年收入同比下降 15.5%，并重组裁撤该分部约
              400 名员工。这反映出 Standard Bots 正在规模化进入的协作机器人市场存在短期逆风。Standard Bots 是暴露于同样的需求疲软，还是靠从传统玩家手中夺份额增长，仍是一个待尽调问题。
