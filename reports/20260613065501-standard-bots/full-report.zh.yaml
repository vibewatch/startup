      - number: '7.2'
        title: 运营与制造风险
        blocks:
          - type: paragraph
            body: >-
              Standard Bots 的全部生产足迹集中在纽约 Glen Cove 单一工厂，目前正用 Series C 资金从约 25,000 平方英尺扩至 70,000
              平方英尺。公司未披露备用或第二制造基地。单工厂模式会把火灾、洪水、极端天气、劳工行动或许可延误转化为生存级运营风险。扩建时间表未公开说明，导致外界无法判断满足既定需求目标所需的产能余量何时到位。公司目标是在下一年交付美国新增工业机器人部署的
              10%，这一数字雄心很大，需要大幅提升产量。

              公开审阅来源中未发现 ISO 9001 质量管理体系认证或等同第三方质量审计文件。未确认 QMS
              会让缺陷率、返工成本、供应商资质管理纪律和保修索赔频率都变得不确定。公司声明的保修覆盖正常使用下的材料和工艺缺陷，但明确排除事故、滥用、误用或第三方篡改造成的损害——这些限制与 AS-IS
              软件免责声明叠加，把剩余产品责任暴露集中到客户运营者身上。

              Bolt 双臂 droid 平台——公司最具 AI 深度、差异化也最强的产品——在产品页上明确标为「coming soon」，可预约但没有确认出货日期。多个 AI 软件能力在产品页中也列为「coming in
              2026」或「coming soon」，包括 collective intelligence、现成 AI playbooks 和新增 SDK 语言。Bolt 路线图滑坡会延迟公司切入类人形 droid
              需求的能力，并压缩其相对资金充足竞争对手的差异化窗口。车队管理和远程诊断依赖云连接；标准条款包含覆盖互联网和电信服务故障的不可抗力条款，隐含承认云依赖风险。
