      - number: '4.4'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >
              Standard Bots 呈现出一套财务上可读、但披露不完整的投资案例。正面看：标价有竞争力（Core $37K，对比 Fanuc $50K+），分层销售模式支持多种 ASP 情景，新增 $200M
              资金提供近期燃料，制造垂直化逻辑对一家目标拿下美国机器人部署 10% 的公司也讲得通。负面看：收入、ARR、毛利率、烧钱速度或留存指标均无公开信息。私营公司不透明度是全方位的。资本计划——到 2027
              年实现全面内部制造——野心很大，可能在达到现金流盈亏平衡前消耗 $200M 融资中的相当大一部分。

              逆风市场背景很重要：Universal Robots 是 Standard Bots 在形态和目标市场上最直接竞争的市场领导者，2025 年收入下降 15.5%，并从机器人业务裁撤约 400
              个岗位。Standard Bots 的增长叙事取决于能否证明它在夺取份额，而不仅是进入一个走软市场。没有收入披露，这一区别无法评估。

              任何投资人若要有信心承销单位经济性、资本充足性或估值，必须先解决五个阻断性尽调缺口。Public Financial Gaps
              表总结了这些缺口。建议在投资人数据室至少提供过往收入、毛利率、烧钱速度，以及与制造里程碑挂钩的资本部署计划之前，将公司视为「继续研究」。
