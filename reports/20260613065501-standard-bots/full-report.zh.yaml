      - number: '8.2'
        title: 估值背景与可比公司分析
        blocks:
          - type: paragraph
            body: >
              Standard Bots 于 2026 年 6 月 9 日完成 Series C，融资 $200 million，投后估值 $1 billion，由 RoboStrategy（Nasdaq: BOT）和
              General Catalyst 领投，Amazon、Samsung Next、Box Group 和 GiantLeap Capital 继续参与。公开披露的累计融资约 $263 million，包括 $63
              million 的 Series B（2024，General Catalyst）和本轮融资。所有公开数据库都无法确认 Series B 之前的资本。$1 billion
              投后估值是前瞻性标记；公司没有披露收入或收入倍数来验证这一估值。


              最直接的公开可比数据来自 Teradyne 的 Robotics 分部，覆盖 Universal Robots（全球协作机器人市场领导者）和 Mobile Industrial Robots。Teradyne 于
              2026 年 2 月提交的 2025 年 10-K 显示，Robotics 分部收入为 $308.3 million，较 2024 年减少 $56.5 million（15.5%）。截至 2025 年 6
              月，Teradyne 总市值约 $12.7 billion。截至 2025 年 12 月 31 日，Robotics 报告单元账面商誉为 $416.4 million。Teradyne
              审计师指出，Robotics 报告单元公允价值高于账面价值，但未来收入增长率假设是关键审计事项——这说明即便是市场领导者，结果区间仍然很宽。按 Teradyne Robotics $308.3 million
              收入，以及约 $1.5–$2 billion 的隐含 Robotics 企业价值（由商誉账面价值和母公司市值分摊估计）计算，公开可比公司意味着这个收入下滑的协作机器人分部交易在 4.9–6.5 倍收入。若
              Standard Bots 要用同一倍数支撑 $1 billion 估值，就需要产生约 $154–204 million
              年化收入——一家没有披露财务数据的私营硬件创业公司几乎肯定尚未达到这一水平。若采用更激进的软件增强增长倍数 10 倍，所需隐含收入为 $100 million ARR；15 倍则为 $67
              million。这些估算来自公开可比数据，只能作方向性参考，不能视为已确认数字。


              建议：观察 / 继续研究。公司值得持续跟踪，但公开财务证据不足以支持在当前 $1 billion 估值下给出买入建议。若出现以下情况，建议可转向买入：（1）收入确认达到 $100M+
              ARR，且毛利率曲线改善；（2）工厂扩建按预算完成；（3）公司证明客户部署的单位经济效率，回本周期低于 24 个月。
