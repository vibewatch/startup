              Standard Bots 声称的客户轨迹有三个公开里程碑：在「几乎每个州」拥有「数百家美国公司」部署基础；客户名录横跨 Fortune 100 工业公司到 SMB
              制造商；并有意「到明年」拿下美国新增工业机器人部署 10%（按 2026 年 6 月新闻稿即 2027 年）。IFR 根据 World Robotics 2025 统计发布称，2024 年美国约安装 33,000
              台新增工业机器人；10% 份额意味着每年大约 3,300 到 4,000 台部署——相较其声称的「数百家」总客户基线，是一次显著扩张跃迁。


              采用漏斗从发现开始（贸易展、数字触达或教育项目），经过免费 30 天试点，再转化为付费租赁安排。公开来源没有试用后转化率证据。Land-and-expand 仅有定性记录：TMMI
              证言提到多台设备，产品线（Spark 面向较轻任务，Core 面向机床上下料，Thor 面向更重工业应用）也支持按用例复杂度在账户内扩张。


              2026 年「几乎每个州」的目标，与早期全国 SMB 推广相一致。地理集中度可能位于制造业密集地区：中西部汽车 / 工业腹地、中大西洋地区（公司总部在 NY Glen
              Cove），以及制造业增长的东南部各州。公开信息无法核实按州或地区划分的客户集中度。


              与相似阶段的 Universal Robots 相比，UR 在最初两年（2009-2010）约出货 500 台，并在第五年增长至每年数千台。Standard Bots 「数百家」总客户的说法与 UR
              早期轨迹大致相容，但 10% 份额目标意味着扩张速度要快得多。
