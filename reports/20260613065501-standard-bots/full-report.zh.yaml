      - number: '3.5'
        title: 图表与证据
        blocks:
          - type: callout
            title: 生态不成熟是 Standard Bots 最耐久的结构性脆弱点
            body: >
              Universal Robots 的 UR+ 计划和 Fanuc 的集成商认证网络合在一起，确保这些平台的买方可以从数百家合格第三方采购认证夹爪、传感器、视觉系统和应用支持。Standard Bots
              目前没有等效的公开认证计划，意味着每个客户部署都直接依赖 Standard Bots。几百个客户时这可行；到几千个客户时会变成增长瓶颈，并制造不对称切换成本：UR
              客户积累认证外设和受训集成商后，切换时面临真实的重新认证成本；Standard Bots 客户今天没有这种锁定，也意味着流失没有障碍。
            calloutType: risk
            claimRefs:
              - CP013
              - CP031
              - CP032
              - CP036
          - type: callout
            title: 美国制造是短期护城河，暂无直接协作机器人对标
            body: >
              在 Standard Bots 价格层级，没有其他 AI 原生协作机器人供应商在美国组装。这为美国国防相关、政府承包商和对关税敏感的制造商创造了真实可防守位置。Standard Bots 还积极就
              National Robotics Strategy 提供建议，并建议禁用中国制造工业机器人，使公司有机会受益于自身正在帮助塑造的政策顺风。该护城河的风险在于政策反转或既有厂商在美国本土化生产，但截至 2026
              年 6 月，两者都未迫近。
            calloutType: strength
            claimRefs:
              - CP007
              - CP010
              - CP025
              - CP040
          - type: callout
            title: 相对既有厂商的价格优势由公司声称，未经验证
            body: >
              Standard Bots 称其产品定价比传统制造商低 20–30%。Universal Robots 和 Fanuc 不公布标价，独立验证困难。比较还取决于是否纳入集成和生态成本；既有厂商机械臂通常还需要
              $20,000–$80,000+ 的额外集成工作，而 Standard Bots 的完整单元模式把这部分纳入。按硬件对硬件口径，该主张可信，但没有第三方定价数据就无法完全验证。
