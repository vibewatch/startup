  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Standard Bots 处于工业机器人行业；OSHA 目前没有针对机器人的专门联邦标准，合规改由 ANSI/RIA R15.06（美国采纳 ISO 10218-1:2011）约束工业机器人，并由 RIA TR
              R15.606（美国采纳 ISO/TS 15066）约束协作机器人安全。这些标准规定协作运行的力和功率限制，要求风险评估文件，并明确防护设计。Standard Bots
              营销其机器人因内置碰撞检测而无需安全围栏，这一说法与协作机器人设计意图一致，但已审阅公开来源中未发现任何第三方符合性声明、CE 标志或 UL
              列名。这构成进入欧盟市场的重大障碍，也会让要求部署前提供认证文件的受监管行业企业客户采购更困难。

              Standard Bots 官网发布的采购和租赁条款包含宽泛的 AS-IS 免责声明：公司明确否认所有关于适销性、适用特定目的、符合法律和不侵犯专利的保证。合同中的 Risk Assessment
              附件要求客户在首次使用前自行做安全配置分析。责任限制条款把公司责任上限封在已支付费用。这种姿态把产品安全责任转给买方运营者，法律上可辩护，但会在风险厌恶行业（航空航天、国防、食品级制造）的企业销售中造成重大阻力。未发现已确认的知识产权诉讼或专利挑战；这里记录的是证据缺口。

              出口管制暴露是行业层面且是假设性的：含有可运行 AI 的 GPU 和定制先进驱动系统的机器人，可能需要根据 Bureau of Industry and Security 的 Export
              Administration Regulations 进行 Export Control Classification Number 审查，尤其是未来任何面向 Country Group D:5
              司法辖区的国际销售。Standard Bots 公开主张美国禁止中国制造的工业机器人和机器人组件；若成为政策，这会形成竞争顺风，但也说明公司主动暴露于机器人供应链贸易政策波动。

              Business and Human Rights Resource Centre 为 Standard Bots 维护了一个资料页，内容很少，表明截至访问日期没有记录在案的人权事件或申诉。现有公开来源未发现
              CPSC 召回、OSHA 传票或 FTC 执法行动；没有公开事件是证据缺口，而非已确认的清白记录。
