      - number: '7.5'
        title: 放弃标准、监控触发器与尽调要求
        blocks:
          - type: paragraph
            body: >-
              六个投资逻辑破裂触发器定义了 Standard Bots 的监控框架。第一，若到 2027 年中仍未取得任何第三方安全认证，将确认其在欧盟和受监管行业扩张面临结构性障碍，并显著压缩总可用市场。第二，若以低于
              $1B 估值发生 down-round 或过桥融资，将说明增长不达预期、投资人信心受损。第三，Evan Beard 离开 CEO 或 Chief Engineer
              角色——且运营结构中没有可信继任者——将要求立即重评投资逻辑。第四，若 Bolt 确认延迟至 2026 年 Q4 之后出货，将反映路线图执行风险，并把类人形邻近差异化拱手让给竞争对手。第五，Glen Cove
              工厂施工延误超过 2027 年 Q1，将限制产能，并通过产能利用不足压缩毛利率。第六，任何已确认的 OSHA 传票、产品召回，或涉及 Standard Bots 机器人的客户安全事故，都会把目前通过 AS-IS
              免责声明和客户侧风险评估义务在合同中管理的产品责任风险具象化。

              优先尽调要求：（1）索取任何第三方安全认证文件或 CE/UL/ISO TS 15066 符合性声明副本；（2）获取核心组件的 EAR 分类文件，包括机载 GPU
              和定制驱动系统；（3）获取董事会构成、治理章程，以及含优先股堆叠的股权结构表；（4）获取过去 12 个月收入、ARR、毛利率和月度烧钱速度，以验证 $1B 估值承销；（5）索取 Bolt GA 路线图，以及已签署
              LOI 或管线证据；（6）获取 Glen Cove 工厂扩建施工合同和完工时间表；（7）确认 2027
              年垂直整合目标的供应链资质认证计划；（8）获取任何未结保修索赔、客户争议记录，或涉及机器人故障或工伤的既往事故报告。
