              $37,000。Thor（30 kg 载荷、2,000 mm 臂展）被营销为市场上载荷最重的协作机器人，达到 IP69K 等级，面向焊接和产线末端码垛，起价 $49,500。三款已出货 SKU 均具备
              ±0.025 mm 重复定位精度、200 mm 或更小底座占地，并运行 StandardOS 软件环境。Bolt 是搭配 AMR 底盘的移动机械臂；页面列出 14 kg
              载荷、三摄像头头部和可互换躯干长度，但显著标注「Coming soon」，并通过 beta 注册表收集预约。公司自家营销文案用这一标签将 Bolt 与已出货产品区分开来，因此截至 2026 年 6 月，Bolt
