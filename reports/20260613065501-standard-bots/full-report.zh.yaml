      - number: '3.3'
        title: 直接协作机器人挑战者与现状替代方案
        blocks:
          - type: paragraph
            body: >
              Doosan Robotics 总部位于 Seoul，自称韩国 No. 1 协作机器人制造商，提供 H、M、A 和 E 系列协作机器人，面向轻工业和服务应用。其产品组合包括工业码垛解决方案和 Dr. Presso
              咖啡服务机器人，显示出横跨制造和服务行业的策略。Doosan 的北美分销正在增长，但仍比 Universal Robots 或 Fanuc 更薄，也尚未提供可与 Standard Bots 相比的完整交钥匙单元。


              台湾 Techman Robot（TM）围绕原生 AI 引擎、机械臂和视觉系统的一体化平台定位协作机器人——这一主张与 Standard Bots 的 AI 原生信息高度重叠。TM AI Cobot S 系列包括
              AI 驱动的缺陷检测和物体识别。Techman 已在亚太电子和精密装配应用中获得牵引，但在美国 SME 制造业足迹较小。


              内部自建替代方案，是由系统集成商使用通用工业机器人（通常是 Fanuc、ABB 或 KUKA 机械臂）和定制软件组装自动化单元；这是制造商在简单协作机器人应用之外的主流历史路径。这一路径通常为一个定制单元花费
              $150,000–$300,000+，并需要 6–18 个月工程时间，与 Standard Bots $47,000–$79,000
              的完整单元定价和据称数日部署形成鲜明对比。现状替代——人工——仍是尚未迈出第一步自动化制造商的实际竞争力量。
