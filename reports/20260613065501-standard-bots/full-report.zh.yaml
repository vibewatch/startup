      - - 全球协作机器人市场（TAM 参考）
        - 行业估计（Marketsandmarkets）
        - 约 $2.1B 市场规模（2024 估计）
        - N/A（市场，不是公司）
        - 渗透率测算的 TAM 锚点：美国份额 10% = 按市场 ASP 约 $100–200M
        - 分析师估计不一；数据在付费墙后；不是公司估值可比项
      - - ABB 机器人事业部
        - 上市母公司（ABB Ltd.）；机器人业务是一个分部
        - 估计机器人收入约 $3B+（未单独拆出）
        - 并入 ABB Group（约 $95B+ 市值）；未披露独立机器人业务 EV
        - 全球 OEM 龙头；协作机器人产品有直接重叠
        - 收入未拆分；ABB 是多元化电气化 / 自动化集团
      - - Standard Bots（自身 — 参考）
        - 私营（Series C，2026 年 6 月）
        - 未披露
        - $1,000M 投后估值（已确认）
        - 当前估值标记；对照上方可比公司
        - 没有收入 / 倍数锚点；私营；均为前瞻性
    notes: >-
      标为估计的 EV 数据来自 Teradyne 10-K 商誉（$416.4M）、总市值（$12.7B，2025 年 6 月）和收入分配。 ABB
      机器人收入是基于行业报道的近似值，不是经独立核验的申报文件数字。Symbotic（SYM）及其他 AI 机器人公司相关， 但本轮抓取周期缺少足够的独立来源可比数据，因此未纳入。所有倍数仅作指示；实际交易倍数会随市场环境波动。
