      - number: '6.4'
        title: 留存与耐久性缺口
        blocks:
          - type: paragraph
            body: >
              Standard Bots 未公开披露任何留存指标：净收入留存率（NRR）、总收入留存率（GRR）、流失率、按队列划分的客户数或平均合同期限。这对 Series C 私营公司很常见，但仍是重大尽调缺口。30
              天免费试用模式意味着一部分早期「部署」可能是未转化的试用设备。


              截至 2026 年 6 月，公司没有出现在独立评价平台（G2、Capterra、TrustRadius）上。这种缺席与 B2B
              硬件即服务模式相符，因为客户关系通过直销管理，但它限制了外部交叉验证。除公司控制渠道外，未发现来自可识别具名客户的已验证正面评价。


              客户耐久性的最强代理指标，是 TMMI 证言提到多台设备，以及客户从一台扩张到多台机器人配置的叙事。不过，即便确有扩张，没有 NRR 数据，尽调也无法确认扩张账户收入是否抵消了试用转生产失败带来的流失。


              SMB 细分中的客户集中度风险按设计应较低，但企业账户可能带来外界无法从公开来源看见的过大收入集中度。一份 Lockheed Martin 或 Sunoco 的多台设备合同，就可能构成有意义的收入集中。
