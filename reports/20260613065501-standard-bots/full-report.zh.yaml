    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >
              Standard Bots 是一家总部位于纽约州 Glen Cove 的制造商，生产 AI 原生六轴工业机械臂和 droid。公司自称「America's largest AI-native industrial
              robot manufacturer」；截至 2026 年 6 月，这一说法反复出现在其官网、新闻稿和多家第三方新闻媒体中。其法律实体为 Standard Bots
              Company，见于公开发布的采购和租赁服务条款。


              Standard Bots 的使命是「propel human productivity through the world's most accessible robots」。公司在 about
              页面给出的长期愿景是「to build the world's preeminent robotics
              platform」，先以制造商为切入点，再扩展到更广的商业市场，最终进入消费市场。商业策略押注垂直整合：公司自研执行器，并在纽约州 Glen Cove 内部组装每一台设备。它计划到 2027
              年在美国本土制造所有环节——「from metal in to robots out」。


              商业模式同时提供一次性购买和订阅 / 租赁。Core 机械臂标价从 $37,000 起。完整的特定应用单元（机床上下料、焊接、码垛）价格从 $47,000 到 $79,000+ 不等，取决于集成层级（DIY
              Kit、Value-Add、Full Integration）。客户还需支付支持订阅费；租赁模式下，客户为软件和设备支付经常性费用。购买设备的所有权在从公司设施发货时转移；承租方不保留所有权。Standard
              Bots 的软件平台无代码、支持机群管理，并面向没有编程背景的操作员——公司将其包装成区别于 Fanuc 和 Universal Robots 等传统协作机器人供应商的结构性差异。


              客户基础覆盖 Fortune 100 公司（Sunoco、Lockheed Martin、Amazon、NASA、U.S. Army）、一级汽车供应商（Robotics & Automation News 称包括
              Adient），以及遍布几乎每个美国州的数百家中小制造商。应用垂直包括机床上下料、焊接、码垛、抓取与放置、表面精加工、测试与检测。公司运营 24/7 支持职能，由应用工程师负责。
