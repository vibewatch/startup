      - number: '1.5'
        title: 里程碑与战略轨迹
        blocks:
          - type: paragraph
            body: >
              Standard Bots 成立于 2011 年（据 Tracxn 和 TechFundingNews
              数据库记录），尽管部分第三方报道暗示公司历史更短。成立阶段意味着公司在获得公开商业能见度前经历了十年以上硬件开发，这与垂直整合机器人制造商常见的长开发周期一致。David Golden 于 2020
              年以联合创始人身份加入，带来 Bowery Farming 和 LeapPay 的风险投资规模执行经验。


              公司 2024 年 7 月的 Series B（$63 million，General Catalyst 领投）是公开数据库中可见的首轮大型机构融资。2026 年 6 月的 Series C（$200
              million，RoboStrategy 和 General Catalyst）确立了独角兽估值，并触发 Glen Cove 70,000 sq ft 工厂扩建。


              战略里程碑包括「nearly every state」的部署足迹——这是一个重要地域主张，暗示广泛的美国商业牵引力——以及在 SMB 制造商之外打入国防 / 航空航天客户（Lockheed
              Martin、NASA、U.S. Army）。公司预计在 Series C 公告后的下一年拿下美国新增工业机器人部署 10%，这是一个未被独立验证的量化市占率主张。


              轨迹显示，公司有意站在美国制造业回流政策与 AI 原生机器人交叉点上：Evan Beard 曾在 Congressional Joint Economic Committee 作证，并为 White House
              提供建议。公司将美国制造机器人包装为国家战略必要事项，并获得 Forbes、SiliconANGLE 和 Robotics & Automation News 与这一叙事一致的报道。


              值得注意的证据缺口包括：没有任何诉讼、监管行动、裁员、召回或负面安全事件的公开记录。BHRC 资料页未显示指控。外部来源未提供对业绩主张（例如「美国部署 10%」、「数百家公司」）的独立审计。
