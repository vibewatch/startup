            body: >
              Standard Bots 提供的具名客户证据有限，但并非没有分量。最强证据来自 Shaw Barrels——一家位于 PA Bridgeville、传承多代的家族制造商——由公司主页和教育页记录：在
              Precihole Deep Hole Drilling Machine 上部署 Core 机器人后，生产率提升 4x（从 200 件 / 天到 800 件 / 天）。Shaw Barrels
              在两个不同的公司控制页面被引用，使该声明获得双重内部印证。不过，未发现第三方对这一生产率数字的独立验证。


              HomeGrown Lifting（KY Lexington）是一家健身器材制造商，主页称其在自动化橡胶地砖码垛后「吞吐量翻倍」。该证据仅来自公司。


              公司官网展示了署名 Tamil Manivannan（Amazon）、Aaron（与 TMMI 相关）、Henry（Mac Products）和 Kenneth（Reason
              Robotics）的客户证言。这些是公司控制页面上的公司筛选证言；没有独立验证渠道。Amazon 证言把一个 Fortune 100 品牌放入证据叙事，但并未确认正式企业采购关系或生产部署范围。


              对企业账户而言，Series C 新闻稿是主要证据来源：Sunoco、Adient、Lockheed Martin、Amazon、NASA 和 US
              Army。新闻稿由公司撰写，未区分试点阶段和生产规模部署。六个企业账户在用于承销企业收入预测之前，都需要独立确认，并厘清试点还是生产。
