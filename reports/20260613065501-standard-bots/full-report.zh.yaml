    approximationNotes: 评分为 1–10 分制的定性判断，仅来自公开证据。依赖收入的维度（单位经济、估值支撑）因缺乏披露仅得 1–4 分。评分不是精算输出；若能进入 NDA 数据室，结果会大幅变化。
    data:
      items:
        - label: 市场机会
          value: 8
          unit: /10
          detail: 协作机器人 TAM 大且仍在增长；预计 17% CAGR；美国政策顺风强
        - label: 产品与技术
          value: 7
          unit: /10
          detail: AI 原生；无代码；自研执行器；Bolt 和 AI 路线图若落地会带来上行，但尚未交付
        - label: 竞争护城河
          value: 6
          unit: /10
          detail: 垂直整合 + 本土制造更耐打；但资源更厚的在位厂商可以反击
        - label: 单位经济
          value: 3
          unit: /10
          detail: 未披露 —— 硬件重模式有资本开支风险；没有毛利率数据
        - label: 风险画像
          value: 3
          unit: /10
          detail: 高 —— 财务不透明 + 资本开支强度高 + 关键人物依赖 + 协作机器人市场逆风
        - label: 估值支撑
          value: 3
          unit: /10
          detail: 偏高 —— 收入未披露即估值 $1B；上市可比公司为下降收入的 5–6x
        - label: 证据质量
          value: 4
          unit: /10
          detail: 有限 —— 无审计财务；无收入披露；产品 / 客户叙事强，但不足以支持买入
