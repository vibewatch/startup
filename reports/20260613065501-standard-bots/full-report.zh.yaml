  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 影响
      - 尽调问题
    rows:
      - - 制造业劳动力短缺（结构性）
        - 驱动
        - 当前；到 2033 年继续加深
        - 2026 年 4 月有 474K 个岗位空缺；到 2033 年需要 3.8M 个新岗位；招不到人的 SMB 会被直接触发购买
        - 确认 Standard Bots 核心垂直领域（机床上下料、焊接、码垛）的劳动力短缺是否持续；跟踪 BLS 制造业细分市场月度 JOLTS
      - - 美中制造业竞争力差距
        - 驱动
        - 当前；政策加速
        - 中国每年安装的机器人数量是美国 9 倍；中国机器人 OEM 在国内市场份额为 57%；美国制造业回流叙事为本土机器人供应商带来政治顺风
        - 评估关税与贸易政策变化（2025–2026）带来的是持久需求拉动，还是周期性影响；监控 Standard Bots 游说推动的任何中国制造机器人部件禁令
      - - 协作机器人硬件总成本下降
        - 驱动
        - 持续（多年）
        - Standard Bots 工作站比传统方案便宜 20–30%；随着来自中国的协作机器人竞争加剧，先发定价优势可能被削弱
        - 核验 Standard Bots 的成本结构，以及垂直整合相对于进口协作机器人能否带来可持续价格优势
      - - 无代码、AI 原生软件易用性
        - 驱动
        - 当前；形成差异化
        - 示教模型免去专业程序员需求；把 SAM 扩展到非技术 SMB 买方；支持规模化机队管理
        - 独立验证无代码说法；评估操作员是否真的无需 IT 支持就能编程；检查客户证言
      - - SMB 预算摩擦与 CapEx 限制
        - 约束
        - 当前；持续
        - 员工少于 20 人的制造商多数难以轻松拿出 $47K+ CapEx；租赁 / 订阅模式可以缓解，但会增加复杂度；贷款审批和现金流顾虑仍在
        - 评估信贷 / 租赁违约率；审查客户群中租赁渗透率 vs. 直接购买占比
      - - 集成复杂度（物理与 IT/OT）
        - 约束
        - 当前；缓慢改善
        - 物理工作站集成（夹具、安全扫描仪、PLC 接线）仍需要技术能力；Full Integration 档位可能范围蔓延，带来进度和成本风险
        - 审查客户案例中的集成周期和总成本；评估安装后的流失率
      - - 监管模糊（OSHA 无机器人标准）
        - 约束
        - 当前；时间线不确定
        - 截至 2026 年，OSHA 没有专门的工业机器人标准；机器人事故经常发生在编程、设置和维护阶段；若没有清晰合规路径，SMB 买方面临责任风险，会抑制采用
        - 监控 OSHA 规则制定；评估 Standard Bots 是否向买方提供合规文档或安全咨询
      - - 岗位替代政治风险
        - 约束
        - 潜伏；取决于情景
        - 较早的美国研究发现，每 1,000 名工人增加 1 台机器人 → 就业率 −0.2 个百分点、工资 −0.42%；这会让「用机器人推动制造回流」叙事面临潜在反弹；可能影响政府补贴或采用激励
        - 跟踪立法环境；评估采用机器人的工厂产生就业的证据（Minnesota 2025 研究——岗位发布 +150%、就业 +15%）是否在政策辩论中获得关注
      - - 竞争对手装机基础与集成商锁定
        - 约束
        - 当前；结构性
        - Fanuc、KUKA、ABB、Universal Robots 拥有庞大装机基础、受训集成商网络和长期服务合同；对已有多机器人机队的企业来说，切换成本很高
        - 量化相对既有供应商的胜率；评估 Standard Bots 集成商生态建设；识别它是借助现有集成商销售，还是绕开集成商销售
      - - 政府政策支持（制造业回流、Made-in-USA）
        - 驱动
        - 正在出现；取决于政策周期
        - Standard Bots 为白宫和国会提供建议；关税政策利好本土组装机器人；投资自动化的制造商可能获得联邦补贴
        - 核验 National Robotics Strategy 提案状态；评估 Standard Bots 是否有望受益，或已经拿到政府资助试点项目
    notes: >-
      方向和时点基于本轮研究中审阅的证据。驱动 / 约束的平衡为定性判断；未应用量化评分模型。岗位替代约束由 Forbes（2026 年 6 月）引用的学术文献支持；Minnesota 2025
      研究这一反向证据来自公司引用，本文未独立审阅。政策驱动因素部分基于公司对自身倡导活动的说法。
