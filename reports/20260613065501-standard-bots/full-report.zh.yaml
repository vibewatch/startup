      - number: '2.4'
        title: 增长驱动因素与采纳约束
        blocks:
          - type: paragraph
            body: >
              Standard Bots 及更广泛美国协作机器人市场的主要需求驱动，是结构性且持续的制造业劳动力短缺。美国制造业就业在 1979 年接近 20 million 人的峰值，如今降至约 13 million
              人；尽管过去十年增加值增长（2025 年 Q4 为 $2.96 trillion，占 GDP 9.4%，据 NAM）。截至 2026 年 4 月，制造业约有 474,000 个未填补岗位。BLS 预计制造业就业到
              2034 年基本持平（12.82M 到 12.82M），而 NAM 预测到 2033 年需要 3.8 million 个新职位——意味着所需岗位与可用劳动力之间的结构性缺口会继续加深。


              第二个主要驱动是中美制造业竞争力。中国 2024 年安装的工业机器人数量是美国的 9 倍，且本土机器人供应商已拿下中国国内市场 57% 份额（十年前为 28%）。美国 2024
              年大部分工业机器人从日本和欧洲进口，本土供应商很少。Standard Bots 将自己定位为本土供给侧回应：垂直整合、在纽约组装，同等应用单元比传统制造商便宜 20–30%。公司是 White House
              和国会制定 National Robotics Strategy 的主要顾问，并曾向 Joint Economic Committee
              作证。关税政策和国防合同本土化要求带来的制造业回流顺风，也提供了补充需求拉动。


              第三个驱动是易用自动化的总成本下降：Standard Bots 完整机床上下料单元起价 $47K，竞品最高可达 $100K；码垛单元 $75K，竞品最高可达
              $150K。无代码、通过示范教学的模式解决了专业编程门槛，而这一门槛过去将 SMB 排除在机器人自动化之外。Universal Robots 作为协作机器人市场开创者，十多年来在汽车、电子、食品饮料、医疗、金属
              / 机加工和塑料垂直行业验证了这一可及性叙事。


              主要约束包括：（1）SMB 预算摩擦——小制造商 CapEx 上限紧，资本成本高；租赁 / 订阅路径缓解但不能消除障碍；（2）集成复杂度——尽管 Standard Bots
              的无代码软件降低编程要求，将机器人物理集成到生产单元（夹具、防护、安全扫描、PLC 接口）仍需技术能力，而许多小工厂不具备；（3）监管模糊——OSHA
              目前没有机器人行业特定标准，机器人事故经常发生在设置和编程等非常规操作中；这一缺口既拖慢采纳（合规不确定），也带来责任敞口；（4）就业替代风险——较早的学术研究发现，每 1,000
              名工人增加一台机器人，会使本地就业率下降约 0.2 个百分点、工资下降约 0.42%，给「用机器人回流制造业」叙事带来政治和声誉风险；（5）现有集成商网络——Fanuc、KUKA、ABB、Universal
              Robots 等既有玩家拥有庞大装机基础、受训集成商生态和长期服务关系，Standard Bots 要增长就必须替代这些优势。
