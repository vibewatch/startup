          - type: callout
            title: 采纳约束真实存在——劳动力成本节省不会自动转化
            body: >-
              SMB 市场面临三重叠加采纳障碍：预算摩擦（受 CapEx 限制的小制造商，<20 名雇员企业占美国机构 74%）、集成复杂度（物理单元集成需要技术能力，许多小工厂缺乏）和监管模糊（OSHA
              没有专门机器人标准，造成合规不确定）。此外，较早的学术研究发现，机器人会降低未采纳企业所在地区的就业率和工资——这是一项政治风险，可能压低政府补贴项目力度。这些约束限制了可服务 SMB 群体向实际买方的转化率。
