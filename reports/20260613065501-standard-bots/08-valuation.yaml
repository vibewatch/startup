  - id: scenario-analysis
    title: Scenario Analysis — Bull, Base, and Bear Cases
    body: >
      Standard Bots' absence of revenue disclosure forces scenario analysis to work from
      proxy indicators: the company claims to be on pace to deliver 10% of new U.S.
      industrial robot deployments by 2027, which implies significant scale if the U.S.
      market installs approximately 44,000–60,000 robots per year. At an average system
      value of $47,000–$75,000 per application cell, 10% of 50,000 units would imply
      $235–375 million in annual revenue—a figure that would strongly support the $1 billion
      valuation. However, the 10% deployment target is company-reported and unverified by
      any independent source. The IFR projects the global cobot market will grow at a 17%+
      CAGR through 2030; if this growth materializes and Standard Bots captures share
      from declining competitors (notably Universal Robots), the bull scenario is credible.


      The bull case assumes: (1) revenue surpasses $150 million ARR by next fund raise;
      (2) gross margins exceed 40% on hardware+software bundles; (3) facility expansion
      completes on schedule and under budget; (4) General Catalyst continues as anchor for
      a Series D at a higher valuation. The base case assumes more modest progress—$50–100
      million ARR at next raise with margins in the 30–35% range—and implies the $1 billion
      mark is slightly stretched, with the next round pricing close to flat or slightly down.
      The bear case involves demand softness (consistent with Teradyne's 2025 trajectory),
      high cash burn from capital-intensive manufacturing scale-up, and a forced down round
      in 2027–2028 at a valuation materially below $1 billion. The probability signal for
      each case is difficult to assess without financial data, but the absence of disclosure
      inherently tilts risk toward the base or bear scenario for conservative investors.


      The preferred stock structure and liquidation preferences are entirely undisclosed.
      In a base or bear scenario, senior preferred holders (led by RoboStrategy and General
      Catalyst) may recover capital before common shareholders, creating meaningful outcome
      divergence between equity tranches. This preference stack opacity is a material gap
      for any return analysis. Repeat participation by General Catalyst (leading both the
      Series B and co-leading the Series C) is a positive signal indicating insider conviction,
      but insider-led rounds also carry information asymmetry risk for new entrants.
