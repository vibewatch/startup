  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-arr
      missingEvidence: >-
        Standard Bots' annual recurring revenue, revenue run-rate, or any revenue metric
        as of June 2026. No financial disclosure exists in public sources.
      whyItMatters: >-
        Without revenue, no revenue multiple or DCF-based valuation can be computed to
        validate the $1 billion post-money mark. The single most important blocking gap.
      diligencePath: >-
        Request NDA access to Series C data room; obtain management-prepared or
        audited revenue, gross margin, and burn-rate schedule.
      relatedQuestionRefs:
        - QV005

    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: >-
        Gross margin by product line (hardware, software, integration service) and in
        aggregate for Standard Bots as a company as of June 2026.
      whyItMatters: >-
        Hardware-led businesses can be value-destructive at high revenue if margins are
        sub-30%; gross margin is required to assess whether the $1B mark is defensible
        on an economic rather than growth-only basis.
      diligencePath: >-
        Request management P&L from data room; benchmark against Teradyne Robotics
        (hardware robotics) and comparable integration businesses.
      relatedQuestionRefs:
        - QV010

    - type: private-evidence-only
      severity: blocking
      topic: burn-rate-runway
      missingEvidence: >-
        Monthly cash burn rate, cash position immediately post-Series C close, and
        projected runway to next fundraise for Standard Bots.
      whyItMatters: >-
        Capital adequacy is fully opaque; if burn rate is high (e.g., >$15M/month
        given capex-intensive manufacturing build-out), the $200M raise may provide
        less than 18 months of runway, creating near-term re-raise risk.
      diligencePath: >-
        Request CFO operating model under NDA; scenario-model burn under facility
        expansion ramp and revenue growth assumptions.
      relatedQuestionRefs:
        - QV015

    - type: private-evidence-only
      severity: blocking
