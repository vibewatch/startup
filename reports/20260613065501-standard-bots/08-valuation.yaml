callouts:
  - calloutType: recommendation
    title: "Recommendation: Track / Research More"
    body: >
      Based on public evidence available through June 13, 2026, the recommended stance is
      Track / Research More. Standard Bots has a compelling product narrative, a strong
      customer roster, and well-regarded investors at a $1 billion mark. However, the
      complete absence of revenue, gross margin, burn rate, and cap table disclosure
      creates irreducible valuation uncertainty. The $1B mark implies $67–200M in ARR
      at comp-based multiples—a level almost certainly not yet reached but potentially
      achievable within 2–3 years if the company executes on its 10% US deployment share
      target. A buy recommendation requires at minimum: (1) ARR confirmed ≥$100M, (2)
      gross margin confirmed >35%, (3) facility expansion on schedule, and (4) cap table
      reviewed under NDA.
    claimRefs:
      - CV031
      - CV036
      - CV041

  - calloutType: risk
    title: "Blocking Risk: Financial Opacity at $1B Mark"
    body: >
      The single most important risk to the valuation is structural: Standard Bots has not
      disclosed any revenue or financial metric, making the $1 billion post-money
      valuation entirely forward-looking. Against Teradyne's Robotics segment trading at
      5–6x declining revenue, a $1B mark for Standard Bots implies 5–15x on undisclosed
      revenue—a wide range that cannot be anchored without NDA access. If revenue is at the
      low end of the implied range ($50–75M ARR), the valuation is aggressive even with a
      growth premium. Hardware-first robotics companies historically face margin compression
      as they scale; without gross margin visibility, the economic model cannot be validated.
    claimRefs:
      - CV010
      - CV032
      - CV042

  - calloutType: insight
    title: "Key Signal: General Catalyst Repeat Participation"
    body: >
      General Catalyst led the Series B in 2024 and co-led the Series C in June 2026,
      representing meaningful insider conviction. GC is a high-quality institutional investor
      with visibility into private company financials that external investors do not have.
      Their continued participation at the $1B mark is the strongest available signal that
      internal financial performance has met or exceeded expectations. This does not
      substitute for external diligence, but it significantly de-risks the narrative
      around product-market fit and execution quality. Investors entering at the $1B mark
      should interpret GC's repeat position as a positive—but also note the information
      asymmetry between insiders and external capital in this round.
    claimRefs:
      - CV048
      - CV002

