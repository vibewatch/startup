  - id: valuation-context-and-comparables
    title: Valuation Context and Comparable Analysis
    body: >
      Standard Bots closed its Series C on June 9, 2026, raising $200 million at a $1 billion
      post-money valuation, led by RoboStrategy (Nasdaq: BOT) and General Catalyst, with
      additional participation from Amazon, Samsung Next, Box Group, and GiantLeap Capital.
      Total disclosed funding stands at approximately $263 million, comprising the $63 million
      Series B (2024, General Catalyst) and the current round. Pre-Series B capital is
      unconfirmed across all public databases. The $1 billion post-money valuation is a
      forward-looking mark; no revenue or revenue multiple has been disclosed to validate it.


      The most directly comparable public dataset is Teradyne's Robotics segment, which
      encompasses Universal Robots (the global cobot market leader) and Mobile Industrial
      Robots. Teradyne's 2025 10-K (filed February 2026) shows Robotics segment revenue of
      $308.3 million, down $56.5 million (15.5%) versus 2024. Teradyne's aggregate market
      capitalization was approximately $12.7 billion as of June 2025. The Robotics reporting
      unit carried $416.4 million of goodwill at December 31, 2025. Teradyne's auditors noted
      that the fair value of the Robotics reporting unit exceeded its carrying value, but that
      future revenue growth rate assumptions are a critical audit matter—signaling the range
      of outcomes remains wide even for the market leader. At Teradyne's Robotics revenue of
      $308.3 million and an implied Robotics enterprise value of roughly $1.5 to $2 billion
      (estimated from goodwill carrying value and parent market-cap allocation), the public
      comp implies a 4.9 to 6.5x revenue multiple for a declining-revenue cobot segment. For
      Standard Bots to justify a $1 billion valuation on the same multiple basis, it would
      need to be generating approximately $154–204 million in annualized revenue—a figure
      almost certainly not yet reached for a private hardware startup with no disclosed
      financials. At a more aggressive software-augmented growth multiple of 10x, the implied
      revenue needed is $100 million ARR; at 15x, $67 million. These are estimates derived
      from public comp data and should be treated as directional only, not as confirmed
      figures.


      Recommendation: Track / Research More. The company deserves continued monitoring but
      does not have sufficient public financial evidence to support a buy recommendation at
      the current $1 billion valuation. The recommendation would shift toward buy if: (1)
      revenue is confirmed at $100M+ ARR with an improving gross margin profile; (2) facility
      expansion completes on budget; (3) the company demonstrates unit-economics efficiency
      with payback periods under 24 months for customer deployments.
