  - id: exit-readiness-diligence-and-triggers
    title: Exit Readiness, Diligence Asks, and Kill Triggers
    body: >
      Standard Bots is not currently positioned for a near-term public exit. The company's
      S-1 readiness is limited by: (1) absence of audited GAAP financials in the public
      domain; (2) a complex manufacturing ramp that investors would need to understand
      through facility tours and supply-chain diligence; and (3) a cobot market environment
      where the public comparable (Teradyne/UR) is under revenue pressure, making comps
      unfavorable for an IPO roadshow. The most plausible near-term exit scenario is
      acquisition by a strategic buyer—ABB, KUKA parent Midea, Fanuc, or a major U.S.
      defense/industrial prime—that wants to acquire the domestic AI-native manufacturing
      capability and customer relationships. The White House policy advisory role and U.S.
      Army/Lockheed customer relationships could make Standard Bots attractive for
      defense-industrial M&A that bypasses typical IPO readiness requirements.


      The manufacturing expansion plan (70,000 sqft facility, vertical integration target of
      "from metal in to robots out" by 2027) is a double-edged signal: successful execution
      would create durable competitive advantages and proprietary data from dense deployment,
      but it also substantially increases capital expenditure commitment and execution risk.
      Standard Bots' stated plan to design its own actuators and assemble every unit in-house
      at Glen Cove is an unusual strategic choice for a startup that could source components
      externally—suggesting high conviction in the cost-reduction roadmap but also creating
      a key-facility concentration risk (fire, flooding, labor action, permit revocation).


      Cobot deployment historically suffers from a long cycle between initial customer
      demonstration and profitable scale deployment. The Robot Report analysis of cobots as
      a "non-silver-bullet" for manufacturers underscores that SMB customer deployments
      often extend timelines and compress margins versus enterprise expectations. Advisors
      Needham & Company, Bal Strategic Partners, and Optimal PCA served as strategic advisors
      for the Series C transaction, suggesting the company is building capital markets
      relationships—a positive signal for IPO optionality, but insufficient evidence that
      exit is imminent.
