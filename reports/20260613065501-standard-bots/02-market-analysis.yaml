tables:
  - id: TM001
    title: Market Definition — Included/Excluded Spend and Substitutes
    columns:
      - Segment / Category
      - Included Spend
      - Excluded Spend
      - Buyer / Payer
      - Relevance to Standard Bots
    rows:
      - - AI-native no-code industrial robot arms
        - Robot hardware (arm, control box, end-of-arm tooling), software subscriptions, fleet management,
          Jump Start / deployment support, application cells
        - Nothing — this is the primary addressable market
        - Manufacturing owner-operator, VP Ops, procurement officer / CapEx budget or operating lease
        - Core TAM; Standard Bots competes directly
      - - Traditional (code-required) industrial robots
        - Robot hardware, integration labor, PLC programming, maintenance contracts, integrator markups
        - In-scope for buyer budget comparison only
        - VP Manufacturing, engineering, large enterprise / CapEx; requires specialist integrator
        - Adjacent competitor pool; higher barriers to entry for SMBs
      - - Collaborative robots (cobots) — competitor segment
        - Competitor hardware (Universal Robots, Fanuc CRX, Doosan, Techman), competitor software,
          integration services
        - Nothing excluded — this is the direct cobot competitor market
        - Same SMB and enterprise buyer profile; CapEx or RaaS lease
        - Direct competitive overlap; Standard Bots must displace or win greenfield
      - - Robot software and fleet management
        - Software-only licenses for programming, monitoring, AI skill management, SDK access
        - Hardware; integration services delivered by third parties
        - Software-savvy manufacturing IT buyer; likely bundled with hardware decision
        - Incremental revenue stream via subscription model; moat enabler
      - - Robot integration and professional services
        - Installation, commissioning, safety audit, process engineering, ongoing application support
        - Stand-alone hardware sales without services
        - Plant engineer, operations director / OpEx; service contracts
        - Standard Bots' Full Integration tier competes directly; reduces dependency on third-party SIs
      - - Human labor (status-quo substitute)
        - Manufacturing wages, benefits, training, turnover costs; average $106,691/yr per employee (NAM)
        - Robot capex
        - Plant manager, HR director / OpEx (payroll)
        - Primary substitute for all automation decisions; robot ROI thesis depends on displacing this cost
    notes: >-
      Market boundaries are drawn from Standard Bots' published application portfolio and competitor
      landscape. Human labor cost benchmark from NAM Facts About Manufacturing (April 2026 data). Segments
      are not mutually exclusive — buyers may combine robot hardware, software, and services from multiple
      vendors.
    claimRefs:
