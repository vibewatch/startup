  - id: TM003
    title: Buyer / Segment Map
    columns:
      - Segment
      - Buyer (Decision-Maker)
      - User (Operator)
      - Payer
      - Workflow / Use Case
      - Budget Owner
      - Adoption Trigger
    rows:
      - - SMB machine tending (1–50 employees)
        - Manufacturing owner or general manager
        - CNC/lathe operator; no robot experience required
        - Business owner / CapEx or operating lease
        - Load/unload CNC, lathe, or injection mold; run lights-out shifts
        - Owner; informal CapEx approval process
        - Unfilled operator position; labor cost vs. $47K cell; production bottleneck
      - - SMB welding (fabrication shops)
        - Shop owner, fabrication manager
        - Welder or unskilled operator trained on iPad interface
        - Business owner / CapEx or lease
        - MIG welding of repetitive joints; structural steel; defense components
        - Owner; may use SBA loans or equipment financing
        - Welder shortage; $75K welding cell vs. $80K+/yr welder + training
      - - SMB palletizing (CPG, food & beverage, distribution)
        - Operations manager, warehouse manager
        - Line worker; Standard Bots Palletizing Wizard enables no-code programming
        - Business owner or Ops VP / CapEx or lease
        - End-of-line pallet building; product changeover; layer pattern programming
        - Owner / Ops VP; may require board approval above threshold
        - High turnover in physical palletizing roles; ergonomic injury risk; $75K vs. $150K competitor
      - - Enterprise machine tending (Tier 1/2 automotive, aerospace)
        - VP Manufacturing, plant engineering director
        - Skilled CNC operator or technician
        - Corporate CapEx budget; ERP-linked procurement
        - High-volume CNC machine tending; multi-robot fleet; integration with PLC/SCADA
        - VP Manufacturing + Finance; formal CapEx approval cycle
        - Robot replacement cycle; capacity expansion; labor cost optimization at scale
      - - Government and defense (NASA, US Army, Lockheed)
        - Contracting officer, program manager
        - Trained technician; may require security clearance
        - Federal contract / cost-plus or FFP vehicle
        - Inspection, assembly, welding, material handling in controlled environments
        - Federal procurement (FAR/DFARS); may require ITAR compliance
        - Program requirement for automation; Made-in-USA mandate alignment
      - - Education (universities, trade schools)
        - Department head, IT director
        - Students, trainees
        - Institutional budget / grants
        - Robotics training curriculum; lab automation demonstrations
        - Academic procurement; grant-funded
        - STEM curriculum demand; workforce development programs
    notes: >-
      Segment definitions are derived from Standard Bots' application pages (machine tending, palletizing,
      welding) and product descriptions. Budget estimates are inferred from pricing disclosures and industry
      labor cost benchmarks (NAM). Government/defense procurement path is company-claimed; contract vehicles
      and compliance requirements are not publicly documented. Education segment is emerging; revenue
      contribution is unknown.
