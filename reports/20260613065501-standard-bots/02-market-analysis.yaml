company:
  name: Standard Bots
chapter:
  number: 2
  title: Market Analysis
  summary: >
    Standard Bots competes primarily in the US market for AI-native, no-code industrial robot arms and
    application cells targeting small and mid-sized manufacturers in machine tending, welding, palletizing,
    pick & place, and related verticals. The International Federation of Robotics reports 542,000 global
    industrial robot installations in 2024 — more than double the figure a decade ago — while the US
    installed only 34,200 units (9% decline YoY), importing most hardware from Japan and Europe and lagging
    China 9-to-1 in annual deployments. A persistent manufacturing labor shortage (474,000 open jobs as of
    April 2026, 12.6 million employed across 239,000+ establishments, 74% with fewer than 20 employees)
    and reshoring policy tailwinds create structural demand for affordable automation. Standard Bots prices
    complete application cells at $47K–$75K versus competitor cells at up to $150K, and targets 10% of new
    US industrial robot deployments by 2027. Precise US cobot-specific market dollar sizing remains
    evidence-constrained due to paywall reports; estimates are derived from IFR unit counts and vendor
    pricing data and carry low to medium confidence.

sections:
  - id: market-boundary
    title: Market Boundary, Included/Excluded Spend, and Substitutes
    body: >
      Standard Bots addresses the market for AI-native, no-code industrial robot arms and integrated
      application cells sold or leased to US manufacturers. The included spend is robot hardware (arm +
      control box + application-specific tooling), associated software subscriptions and fleet management
      licenses, and integration services (DIY Kit, Value-Add, or Full Integration tiers). The company
      describes its addressable market as any manufacturer currently performing repetitive physical tasks —
      machine tending, welding, palletizing, pick & place, material removal, assembly, and inspection —
      that lacks robotics today or is evaluating replacement of legacy systems. Based on National
      Association of Manufacturers data, the US has 239,000+ manufacturing establishments, with 74%
      employing fewer than 20 workers; this long-tail segment is Standard Bots' explicitly stated primary
      beachhead.


      The market excludes several adjacent spend categories: heavy-automation turnkey systems designed by
      large systems integrators for greenfield automotive plants; autonomous mobile robots (AMRs) and
      autonomous guided vehicles (AGVs) for logistics and warehouse transport; surgical or medical robots
      for clinical use; and consumer robots. Traditional industrial robots requiring factory-trained
      programmers or full-time integrators to operate also fall outside Standard Bots' immediate addressable
      market — although they compete for the same capital budget. Universal Robots, the market segment
      creator, validates the same vertical set (automotive, electronics, food & beverage, medical/cosmetics,
      metal/machining, plastic/polymers), confirming breadth of potential application but not Standard
      Bots' specific penetration.


      Status-quo substitutes are significant: most US manufacturers below 50 employees have not automated
      any production step and continue to rely on human labor, which in 2026 commands average annual
      earnings of $106,691 per manufacturing employee (NAM). Contract manufacturing in lower-cost
      geographies (China, Mexico) remains a structural substitute, as does purpose-built hard automation
      for very high-volume, low-mix production that does not benefit from a flexible robot. The
      OSHA-acknowledged absence of dedicated robotics safety standards in the US creates ambiguity around
      compliance obligations that further slows adoption decisions among risk-averse SMB operators.
