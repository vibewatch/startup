  - id: buyer-segmentation
    title: Buyer, User, and Payer Segmentation
    body: >
      Standard Bots' buyer population spans two primary bands: (1) small-to-mid-sized independent
      manufacturers (SMBs) — typically owner-operated or family-run shops with 10–200 employees — who
      are making their first automation investment; and (2) large enterprise and government/defense
      customers who seek to extend automation into tasks or facilities where legacy robots are not
      practical. The company explicitly claims to serve both: "Fortune 100 companies to hundreds of SMB
      manufacturers across nearly every U.S. state" per PR Newswire and R&AN. Machine tending, welding,
      and palletizing are the highest-volume entry points based on the company's dedicated application
      pages and pricing disclosures.


      In the SMB band, the buyer (decision-maker) is typically the owner, general manager, or VP of
      operations. Budget ownership is concentrated — small manufacturers lack procurement bureaucracy,
      enabling faster cycles but requiring lower price points and simpler justification. The typical
      procurement trigger is a labor opening that cannot be filled: NAM data shows 474,000 open
      manufacturing jobs in April 2026 and projects 3.8 million new manufacturing positions needed by
      2033. At $37,000 per Core arm and $47,000–$75,000 per complete application cell, a single robot
      replacing one unfillable position at $106,691/year in average manufacturing wages yields a
      theoretical payback of under 9 months on hardware cost alone (company-claimed framing, not
      independently verified).


      Standard Bots offers the robot via outright purchase and a subscription/leasing model. The leasing
      path shifts budget classification from capital expenditure (CapEx) to operating expenditure (OpEx),
      which materially affects SMB adoption feasibility — many small manufacturers cannot access equipment
      loans or have restrictive CapEx approval thresholds. The IFR service robots report notes that
      Robot-as-a-Service fleet models grew 31% in 2024 globally, validating this financing-driven
      adoption trend. Application delivery tiers (DIY Kit, Value-Add, Full Integration) further segment
      buyers by internal capability: the most capable self-serve at lower total cost, while full-service
      customers accept premium pricing for turnkey deployment.


      Enterprise and government customers (Sunoco, Lockheed Martin, Amazon, NASA, US Army per company
      claims) have more structured procurement with longer sales cycles, purchase via capital appropriations
      or federal contract vehicles, and likely require compliance documentation, government furnishing
      clauses, and security review. These accounts represent high revenue-per-unit deals but create
      concentration risk and require a dedicated government/enterprise sales function.
