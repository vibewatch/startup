callouts:
  - calloutType: insight
    title: US Lags China 9-to-1 in Annual Robot Deployments — The Core Market Thesis
    body: >-
      IFR data confirms Standard Bots' central market thesis: China installed 295,000 industrial robots
      in 2024 (54% of global total) while the US installed only 34,200 (a 9% year-on-year decline).
      US manufacturing employment has declined from 20 million workers in 1979 to approximately 13 million
      today. With 474,000 open manufacturing jobs as of April 2026 and 3.8 million new positions expected
      by 2033, the structural demand case for accessible, low-cost automation is strong. The question is
      whether Standard Bots can capture a meaningful share of the 34,200 annual US installations (it
      targets 10%) before incumbents and Chinese imports close the price gap.
    claimRefs:
      - CM004
      - CM007
      - CM008
      - CM014
      - CM017
      - CM027
      - CM028

  - calloutType: risk
    title: US Industrial Robot Dollar TAM Is Unverified — Sizing Path Is Evidence-Constrained
    body: >-
      No freely accessible source provides a verified US-specific dollar market size for industrial or
      collaborative robots. All US dollar estimates in this chapter are derived from IFR unit counts (high
      confidence) × estimated average selling prices (low confidence). The resulting range ($1.7B–$3.4B
      hardware only, $2.5B–$10B including integration/software) spans a wide band and should not be used
      for precise valuation multiples without a paid analyst report. Standard Bots' own market share claim
      (10% of US deployments by 2027) provides a useful SOM signal but is company-stated and unverified.
    claimRefs:
      - CM008
      - CM019
      - CM022

  - calloutType: risk
    title: Adoption Constraints Are Real — Labor Cost Savings Do Not Automatically Convert
    body: >-
      The SMB market faces three compounding adoption barriers: budget friction (CapEx-limited small
      manufacturers with <20 employees represent 74% of US establishments), integration complexity
      (physical cell integration requires technical capability many small shops lack), and regulatory
      ambiguity (OSHA has no dedicated robot standards, creating compliance uncertainty). Additionally,
      older academic research found robots reduce local employment rates and wages for non-adopting
      firms — a political risk that could dampen government subsidy programs. These constraints limit
      the conversion rate between the addressable SMB population and actual buyers.
    claimRefs:
      - CM016
      - CM032
      - CM033
      - CM034
      - CM035

