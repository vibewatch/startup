callouts:
  - calloutType: risk
    title: Ecosystem Immaturity Is Standard Bots' Most Durable Structural Vulnerability
    body: >
      Universal Robots' UR+ program and Fanuc's integrator certification network collectively ensure that
      buyers of those platforms can source certified grippers, sensors, vision systems, and application
      support from hundreds of qualified third parties. Standard Bots currently offers no equivalent
      published certification program, meaning every customer deployment depends on Standard Bots directly.
      This is workable at hundreds of customers but becomes a growth bottleneck at thousands, and it
      creates an asymmetric switching cost: UR customers who accumulate certified peripherals and trained
      integrators face real re-qualification costs to switch; Standard Bots customers face no such lock-in
      today, which also means they face no barrier to churning.
    claimRefs:
      - CP013
      - CP031
      - CP032
      - CP036
  - calloutType: strength
    title: Made-in-America Is a Near-Term Moat with No Direct Cobot Equivalent
    body: >
      No other AI-native cobot vendor at Standard Bots' price tier assembles in the United States. This
      creates a genuine defensible position for U.S. defense-adjacent, government-contractor, and
      tariff-sensitive manufacturers. Standard Bots is also actively advising on a National Robotics
      Strategy and recommended a ban on Chinese-made industrial robots, positioning the company to benefit
      from policy tailwinds it is helping create. The risk to this moat is policy reversal or incumbent
      onshoring, but neither is imminent as of June 2026.
    claimRefs:
      - CP007
      - CP010
      - CP025
      - CP040
  - calloutType: assumption
    title: Pricing Advantage vs. Incumbents Is Company-Claimed and Unverified
    body: >
      Standard Bots claims its products are priced 20–30% below legacy manufacturers. Universal Robots
      and Fanuc do not publish list prices, making independent validation difficult. The comparison also
      depends on whether integration and ecosystem costs are included; incumbents' arms often require
      $20,000–$80,000+ in additional integration work, which Standard Bots' full-cell model subsumes.
      The claim is plausible on a hardware-to-hardware basis but cannot be fully validated without
      third-party pricing data.
    claimRefs:
      - CP005
      - CP035

