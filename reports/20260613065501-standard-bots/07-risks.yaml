  - id: operational-manufacturing-risk
    title: Operational and Manufacturing Risk
    body: >-
      Standard Bots' entire production footprint is concentrated in a single facility in Glen
      Cove, New York, currently expanding from approximately 25,000 square feet to 70,000 square
      feet using Series C capital. No backup or second manufacturing site has been disclosed. A
      single-facility model creates existential operational risk from fire, flood, extreme weather,
      labor action, or permit delays. The expansion timeline has not been publicly specified,
      creating uncertainty around when the production capacity headroom needed to meet stated
      demand targets becomes available. The company targets delivery of 10 percent of new US
      industrial robot deployments within the next year, an ambitious figure requiring substantial
      production scaling.

      No ISO 9001 quality management system certification or equivalent third-party quality
      audit documentation has been identified in publicly reviewed sources. The absence of a
      confirmed QMS creates uncertainty around defect rates, rework costs, supplier qualification
      discipline, and warranty claim frequency. The company's stated warranty covers defects in
      materials and workmanship under normal use, but expressly excludes damage from accident,
      abuse, misuse, or third-party tampering — limitations that, combined with the AS-IS software
      disclaimer, concentrate residual product liability exposure on the customer-operator.

      The Bolt bimanual droid platform — the company's most AI-advanced and most differentiated
      product — is explicitly listed as "coming soon" on the product page with reservations open
      but no confirmed shipping date. Multiple AI software capabilities are also listed as "coming
      in 2026" or "coming soon" across product pages, including collective intelligence, ready-made
      AI playbooks, and SDK language additions. Roadmap slippage on Bolt delays the company's
      ability to address humanoid-adjacent droid demand and compresses the window against
      well-capitalized competitors. The fleet management and remote diagnostics rely on cloud
      connectivity; the standard terms include a force majeure clause covering failure of internet
      and telecommunications services, which implicitly acknowledges cloud dependency risk.
    claimRefs:
