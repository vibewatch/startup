  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: safety certification gap
      missingEvidence: "Third-party conformance documentation, CE declaration, UL test report, or ISO/TS 15066 conformance certificate for any Standard Bots product"
      whyItMatters: "Required for EU market entry and enterprise deployments in regulated sectors; without documentation investors cannot assess addressable market breadth or near-term sales friction with risk-averse enterprise customers"
      diligencePath: "Request all safety certification documents, CE declarations of conformity, and test reports directly from Standard Bots in due diligence; check EU Machinery Directive NANDO database"
      relatedQuestionRefs: [QR001, QR004]
      relatedTableRefs: [TR001]

    - type: private-evidence-only
      severity: blocking
      topic: financial opacity
      missingEvidence: "Revenue, ARR, gross margin, monthly burn rate, cash on hand, and runway data for Standard Bots as of the Series C close"
      whyItMatters: "The $1B valuation cannot be independently underwritten without financial data; burn rate and runway determine whether the $200M raise provides sufficient coverage for the 2027 vertical integration target"
      diligencePath: "Obtain audited or management-prepared financial statements for FY2024 and H1 2026, plus monthly burn rate and revenue growth trajectory"
      relatedQuestionRefs: [QR010, QR011]

    - type: private-evidence-only
      severity: material
      topic: governance opacity
      missingEvidence: "Board composition, number of independent directors, governance charter, cap table with preference stack, and any existing shareholder agreements"
      whyItMatters: "Without governance disclosure, investors cannot assess decision-making accountability, conflict resolution mechanisms, or protective-provision arrangements that affect economics in downside scenarios"
      diligencePath: "Request corporate charter, board roster, and investor rights agreement directly from Standard Bots legal counsel"
      relatedQuestionRefs: [QR022]

    - type: missing-source
      severity: material
      topic: Bolt roadmap
      missingEvidence: "Confirmed Bolt GA shipping date, beta customer deployment evidence, or technical readiness milestone documentation"
      whyItMatters: "Bolt is the company's most differentiated product; an indefinite 'coming soon' status prevents assessment of when the humanoid-adjacent revenue stream can contribute meaningfully to the financial model"
      diligencePath: "Request Bolt product roadmap with milestone dates, signed letters of intent from beta customers, and production readiness assessment"
      relatedQuestionRefs: [QR014]
