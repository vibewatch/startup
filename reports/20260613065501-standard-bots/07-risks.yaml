    - type: private-evidence-only
      severity: material
      topic: key-person risk
      missingEvidence: "James Cordle professional background, current role responsibilities, and succession planning documentation"
      whyItMatters: "Key co-founder with no public profile creates governance opacity; understanding his role is needed to assess whether leadership redundancy exists beyond Evan Beard and David Golden"
      diligencePath: "Request biography and responsibility scope from Standard Bots management; include in management reference checks"
