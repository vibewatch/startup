  - id: partner-dependency-financial-risk
    title: Partner, Dependency, and Financial Risk
    body: >-
      Standard Bots' capital stack is dominated by two investors: General Catalyst (lead in Series
      B and co-lead in Series C) and RoboStrategy (new co-lead in Series C). RoboStrategy is
      described as an actively managed closed-end fund focused on robotics; its track record and
      LP base are not publicly documented, making it difficult to assess whether follow-on support
      is available or if the fund has sufficient dry powder for participation in future rounds.
      Concentrated investor base increases down-round and bridge-financing risk if the company
      misses growth targets. The $1B post-money valuation implies a multiple-of-revenue
      underwrite that cannot be confirmed without ARR disclosure; financial runway is entirely
      opaque from public sources.

      On the supply chain side, the company relies on third-party suppliers for components
      including electric motors, servo drives, encoders, and GPU compute units until its
      stated 2027 in-house manufacturing target is achieved. Welding cells are dependent on
      Miller Electric (AutoDeltaWeld 350) and Tregaskiss/ITW consumables. The force majeure
      clause in Standard Bots' terms expressly acknowledges exposure to "shortages of
      transportation facilities, fuel, energy, labor or materials" — an indication that component
      supply risk is real and contractually recognized. US tariff policy on imported robots and
      components (referenced in Reuters and WSJ reporting) introduces input cost uncertainty
      for any non-domestically sourced components during the transition to full vertical
      manufacturing. Teradyne's Universal Robots segment reported a 15.5 percent year-over-year
      revenue decline and approximately $6 million inventory provision in its 2025 10-K, signaling
      near-term demand softness in the legacy cobot market that Standard Bots must navigate while
      scaling.
