  - id: people-execution-governance-risk
    title: People, Execution, and Governance Risk
    body: >-
      The most acute people risk is concentrated in Evan Beard, who holds the simultaneous titles
      of Founder, CEO, and Chief Engineer. This triple role is unusual at a $1B-valued company
      and signals deep technical involvement that would be difficult to replicate quickly following
      a departure. Beard is the primary public spokesperson across all press releases, investor
      materials, and congressional policy testimony, making him the face of the brand and the
      primary channel for external trust. No succession plan, deputy CEO, or co-CEO arrangement
      has been publicly disclosed.

      Co-founder James Cordle has no publicly available background information in any reviewed
      source; his role, responsibilities, and industry experience are unknown. Co-founder David
      Golden brings strong venture-scale execution experience from Bowery Farming and LeapPay,
      but his operational focus within Standard Bots is not specified in public materials. The
      board composition, number of independent directors, governance committee structure, and
      any advisory board memberships are entirely undisclosed. This absence of governance
      transparency is expected for a private company at this stage but limits investor visibility
      into decision-making accountability and dispute resolution mechanisms.

      Execution risk is elevated by the breadth of the parallel agenda: facility expansion to
      70,000 square feet, full vertical manufacturing integration by 2027, Bolt GA launch, multi-
      SKU product support, AI roadmap delivery, and Fortune 100 account scaling simultaneously.
      The company's claim to be "on pace to deliver 10 percent of new US industrial robot
      deployments" by the following year implies production and go-to-market capacity that has
      not been independently validated. Headcount, attrition, and compensation structure are all
      undisclosed.
