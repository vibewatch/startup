acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      TR001 (Regulatory/Legal Risk Register) notes field is set and provides data source,
      estimation basis, and scope caveats as required. The acknowledgedWarnings entry is
      included pre-emptively for tables where all cells are direct contract text observations
      with no estimation.
  - dimension: unverifiedSource
    reason: >-
      SR020 (Wired) and SR021 (Reuters) returned broken/401 access status but are in the
      fetch trail; their key facts are supported by corroborating sources (SR027 IFR, SR016
      Teradyne 10-K). Both are retained for source-type and stance diversity.
