callouts:
  - calloutType: risk
    title: Safety Certification Gap Is the Highest-Urgency Diligence Item
    body: >-
      Standard Bots has no confirmed third-party safety certification (CE mark, UL listing, or
      ISO/TS 15066 conformance declaration) in any publicly reviewed source as of June 2026.
      This is not necessarily evidence of non-compliance — collaborative robots may still meet
      the standard through internal engineering — but the absence of documentation creates
      material barriers to EU market entry and enterprise deployments in regulated sectors.
      This single gap should be the first item resolved in post-LOI due diligence.
    claimRefs:
      - CR004
      - CR011
      - CR013

  - calloutType: risk
    title: Financial Opacity Prevents Independent Runway and Valuation Validation
    body: >-
      Revenue, ARR, gross margin, monthly burn, and cash position are entirely undisclosed.
      The $1B valuation is therefore unsupported by any independently verifiable financial
      metric from public sources. A diligence process that does not include full management
      accounts — including trailing 12-month revenue, unit economics, and cash runway — cannot
      validate the investment thesis at this entry price.
    claimRefs:
      - CR023
      - CR026
      - CR028

  - calloutType: insight
    title: Contractual Terms Transfer Product Safety Liability to Customers
    body: >-
      Standard Bots' standard purchase and leasing terms require customers to perform their own
      risk assessments, identify safety configuration settings, and add warnings or notifications
      before first use. Combined with broad AS-IS disclaimers and a limitation of liability cap
      at fees paid, this posture limits Standard Bots' direct product liability exposure but
      may create friction with enterprise procurement teams in risk-averse sectors and raise
      insurance requirements for customers.
    claimRefs:
      - CR005
      - CR006
      - CR007

