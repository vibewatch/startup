      - number: '3.2'
        title: Incumbent Hardware Vendors
        blocks:
          - type: paragraph
            body: >
              Universal Robots, founded in 2005 in Denmark, pioneered the collaborative robot category and remains its
              global market leader. Its products—ranging from the UR3e (3 kg payload) to the UR30 (30 kg payload)—span
              the payloads most relevant to light industrial automation. The UR+ ecosystem, an accreditation program for
              third-party grippers, sensors, vision systems, and software modules, gives UR a deep integration network
              that significantly reduces deployment complexity for most standard applications. UR Academy provides free
              online training. This combination of certified components, training, and global service coverage makes
              Universal Robots the default choice for first-time cobot buyers at most distribution channels.


              ABB's cobot family includes the GoFa (5 kg), SWIFTI (4 kg), YuMi (both arms, 0.5 kg each), and Single Arm
              YuMi, covering precise assembly and collaborative workspace sharing applications. ABB emphasizes its
              SafeMove safety system (PL d-rated under ISO 13849-1) and compliance with ISO 10218-1:2011 and ISO/TS
              15066. ABB positions itself as having "the broadest service network in the industry," a claim it makes in
              reference to its full industrial automation portfolio of drives, PLCs, and process control systems that
              create account-level stickiness with large manufacturers.


              Fanuc's CRX Series offers the broadest payload range in its class—12 models covering 3–50 kg—and markets
              an 8-year zero-maintenance claim backed by accelerated life testing. The "Cobot and Go" pre-engineered
              solutions library provides readily deployable application templates, reducing integration lead time.
              Critically, the Fanuc CRX-10iA/L Paint is described as the only cobot currently approved for painting
              under U.S. safety standards, giving Fanuc a regulated-application moat Standard Bots has not yet
              addressed. Fanuc's established industrial integrator network of thousands of certified partners worldwide
              means its cobots rarely require the OEM to drive the deployment—a distribution advantage Standard Bots
              currently lacks.


              KUKA, the German robotics company acquired by Chinese home-appliance conglomerate Midea Group in 2016,
              offers the LBR iisy cobot line and the iiQKA robot operating system. KUKA's mechanical engineering
              heritage and global integrator network are genuine competitive assets, but Midea ownership has become a
              procurement concern for some U.S. government-adjacent and defense-adjacent manufacturers who require
              American-made or allied-nation-made components.
