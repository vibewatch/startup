      - number: '5.5'
        title: Trust, Safety, Compliance, and Quality Controls
        blocks:
          - type: paragraph
            body: >-
              Standard Bots robots are designed as collaborative robots operating under collision-detection safety
              modes. The Spark arm is rated IP69K (arm) / IP44 (control box); Thor is rated IP69K. Core specs list IP54
              design rating. OSHA notes there are no specific federal robotics standards in the United States, but
              industry safety is governed by ISO 10218 (industrial robots) and ISO/TS 15066 (collaborative robots), both
              referenced in cobot industry literature. Standard Bots' website states robots do not require safety
              fencing or guarding due to automatic collision detection. However, no publicly verified third-party safety
              certification (CE mark, UL listing, or ISO TS 15066 conformance declaration) has been identified in
              reviewed sources. Welding cells integrate with Miller Auto DeltaWeld 350 equipment and use Tregaskiss®
              Cobot MIG Gun and AccuLock™ consumables, indicating third-party certified peripheral integration in
              welding. The company offers a 30-day free on-site pilot with on-site training ("Jump Start sessions").
              Uptime is guaranteed at 99.9% with a stated phone response time under five minutes and on-site support
              within 24 hours — these are service-level commitments not independently audited. No evidence of CE
              marking, CSA certification, or third-party conformance documentation has been found in available sources;
              this is a material diligence gap for enterprise and regulated-sector customers.
            claimRefs:
              - CE029
