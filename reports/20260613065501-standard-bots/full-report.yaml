              The SMB market faces three compounding adoption barriers: budget friction (CapEx-limited small
              manufacturers with <20 employees represent 74% of US establishments), integration complexity (physical
              cell integration requires technical capability many small shops lack), and regulatory ambiguity (OSHA has
              no dedicated robot standards, creating compliance uncertainty). Additionally, older academic research
              found robots reduce local employment rates and wages for non-adopting firms — a political risk that could
