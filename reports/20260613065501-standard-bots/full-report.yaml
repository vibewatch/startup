            title: Safety Certification Gap Is the Highest-Urgency Diligence Item
            body: >-
              Standard Bots has no confirmed third-party safety certification (CE mark, UL listing, or ISO/TS 15066
              conformance declaration) in any publicly reviewed source as of June 2026. This is not necessarily evidence
              of non-compliance — collaborative robots may still meet the standard through internal engineering — but
              the absence of documentation creates material barriers to EU market entry and enterprise deployments in
              regulated sectors. This single gap should be the first item resolved in post-LOI due diligence.
