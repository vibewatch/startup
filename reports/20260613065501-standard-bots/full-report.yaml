  - id: TV004
    title: Comparable Valuation Table
    columns:
      - Comparable
      - Type
      - Revenue / Scale
      - EV or Valuation
      - Relevance
      - Limitation
    enumerationScope:
      coverage: partial
      basis: >-
        Public robotics companies and available private funding data as of June 2026; excludes private companies with no
        disclosed valuations or revenue data; limited by Teradyne being the only fully verified public cobot-segment
        filing.
    rows:
      - - Universal Robots (via Teradyne Robotics)
        - Public segment (Teradyne 10-K FY2025)
        - $308.3M revenue (2025, down 15.5% YoY)
        - ~$1.5–2B implied segment EV (est. from goodwill + parent mktcap allocation)
        - Most direct public cobot comp; robot arm sales + AMR
        - Declining revenue; segment is embedded in Teradyne ($12.7B mktcap); no standalone EV
      - - Teradyne Inc. (parent)
        - 'Public company (Nasdaq: TER)'
        - $3,190M total revenue (2025); Robotics = 9.7% of total
        - $12.7B market cap (June 2025)
        - Context for robotics segment discount within diversified parent
        - Not a pure-play cobot comp; semiconductor test dominates (79% of revenue)
      - - Global cobot market (TAM reference)
        - Industry estimate (Marketsandmarkets)
        - ~$2.1B market size (2024 est.)
        - N/A (market, not company)
        - 'TAM anchor for penetration math: 10% US share = ~$100–200M at market ASPs'
        - Analyst estimates vary; paywall data; not a company valuation comp
      - - ABB Robotics Division
        - Public parent (ABB Ltd.); robotics is a segment
        - ~$3B+ estimated robotics revenue (not separately broken out)
        - Embedded in ABB Group (~$95B+ mktcap); no standalone robotics EV disclosed
        - Global OEM leader; direct cobot product overlap
        - Revenue not broken out; ABB is diversified electrification/automation conglomerate
      - - Standard Bots (self — reference)
        - Private (Series C, June 2026)
        - Undisclosed
        - $1,000M post-money (confirmed)
        - Current mark; benchmark against comps above
        - No revenue/multiple anchor; private; all forward-looking
    notes: >-
      EV figures marked as estimates are derived from Teradyne's 10-K goodwill ($416.4M), total market cap ($12.7B, June
      2025), and revenue allocation. ABB robotics revenue is an approximation from industry reporting, not an
      independently verified filing figure. Symbotic (SYM) and other AI robotics names are relevant but not included
      here due to insufficient independently sourced comparable data in the current fetch cycle. All multiples are
      indicative; actual trading multiples fluctuate with market conditions.
    claimRefs:
