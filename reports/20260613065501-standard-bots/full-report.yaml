      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              Standard Bots was co-founded by Evan Beard, David Golden, and James Cordle, per the June 2026 Series C
              press release on PR Newswire. The founding date is consistently reported as 2011 by Tracxn and
              TechFundingNews, though GreyJournal described the company as "eight years old" at the June 2026
              announcement, which would place founding around 2018; the 2011 figure appears on the database record and
              is used here with medium confidence given the discrepancy. TechFundingNews notes that Evan Beard
              previously co-founded A Plus and Gridtech. David Golden joined as co-founder in 2020 per TechFundingNews;
              he previously co-founded Bowery Farming (raised $473M, Fidelity/GV/General Catalyst-backed, largest
              vertical farming company in the U.S.) and LeapPay (sold to Funding Circle in 2014). No public background
              information has been found for James Cordle.


              Evan Beard serves as Founder, CEO, and Chief Engineer — an unusual triple title signaling deep technical
              involvement at the executive level. He has advised the White House and testified before the Congressional
              Joint Economic Committee on manufacturing and robotics policy per TechFundingNews. Key-person risk is
              high: Beard is the primary public spokesperson across all major press releases, investor materials, and
              policy forums.


              The leadership team identified on the Standard Bots careers page includes: David Golden (Co-Founder), Zach
              Tomkinson (Chief Commercial Officer), Hunjoo Kim (Head of Manufacturing Operations), Ash Higgins (Chief
              Strategy Officer), Lee Gross (Head of Software), Robert Irwin (Head of Hardware), and Dan Grover (Head of
              Product). The team's prior employers are not individually listed on the careers page, though it cites
              alumni of unspecified "pioneering companies."


              Board composition and governance structure are not publicly disclosed. No investor board seats have been
              named in company communications. No material leadership changes, departures, or internal conflicts have
              been publicly reported as of the June 2026 run date. The Business and Human Rights Resource Centre (BHRC)
              maintains a profile page for Standard Bots but lists no allegations or reported incidents, providing a
              clean adverse signal from that source as of the access date.
