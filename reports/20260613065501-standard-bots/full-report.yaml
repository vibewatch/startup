    title: Valuation and Return Range — Bull / Base / Bear
    type: range
    layout: wide
    summary: >-
      Illustrated low-to-high enterprise value ranges for bear, base, and bull scenarios at next fundraise, alongside
      current $1B mark. Ranges reflect explicit assumptions stated in the scenario table; all figures are estimates.
    approximationNotes: >-
      All ranges are illustrative scenario estimates; Standard Bots has not disclosed revenue or margins. Bear range
      assumes down-round; base range reflects flat-to-modest growth; bull range assumes 10% US deployment share
