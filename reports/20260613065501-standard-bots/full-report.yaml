      - number: '5.2'
        title: 'Software Stack: StandardOS, No-Code Interface, Fleet Management, and APIs'
        blocks:
          - type: paragraph
            body: >-
              StandardOS is Standard Bots' proprietary robot operating environment, positioned as an alternative to
              ROS-based stacks. It provides a no-code drag-and-drop interface operated from an iPad that the company
              claims allows a factory worker to program routines in a day with no prior robotics experience. Fleet
              management is built into the single-app interface, enabling operators to monitor status and switch between
              individual robots or a fleet. The routine editor presents programs as readable step-by-step text rather
              than code, and supports side-by-side view/edit of the full routine and individual steps simultaneously.
              For developers, Standard Bots exposes StandardOS through native REST APIs and SDKs; Python and TypeScript
              SDKs are listed as shipping today, while C++, Rust, and Go are listed explicitly as "coming soon." The
              developer page states "No ROS, no worries," though it acknowledges ROS compatibility for users who prefer
              it. Direct integration with grippers, conveyors, seventh-axis slides, and linear actuators is advertised
              as plug-and-play without additional drivers. Native EtherNet/IP and fieldbus support are listed on the
              Thor product page as industrial connectivity features. The company claims offline operation capability
              once programs are deployed, requiring network connectivity only for software updates, remote support, or
              connected applications.
