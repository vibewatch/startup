  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included/Excluded Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >
              Standard Bots addresses the market for AI-native, no-code industrial robot arms and integrated application
              cells sold or leased to US manufacturers. The included spend is robot hardware (arm + control box +
              application-specific tooling), associated software subscriptions and fleet management licenses, and
              integration services (DIY Kit, Value-Add, or Full Integration tiers). The company describes its
              addressable market as any manufacturer currently performing repetitive physical tasks — machine tending,
              welding, palletizing, pick & place, material removal, assembly, and inspection — that lacks robotics today
              or is evaluating replacement of legacy systems. Based on National Association of Manufacturers data, the
              US has 239,000+ manufacturing establishments, with 74% employing fewer than 20 workers; this long-tail
              segment is Standard Bots' explicitly stated primary beachhead.


              The market excludes several adjacent spend categories: heavy-automation turnkey systems designed by large
              systems integrators for greenfield automotive plants; autonomous mobile robots (AMRs) and autonomous
              guided vehicles (AGVs) for logistics and warehouse transport; surgical or medical robots for clinical use;
              and consumer robots. Traditional industrial robots requiring factory-trained programmers or full-time
              integrators to operate also fall outside Standard Bots' immediate addressable market — although they
              compete for the same capital budget. Universal Robots, the market segment creator, validates the same
              vertical set (automotive, electronics, food & beverage, medical/cosmetics, metal/machining,
              plastic/polymers), confirming breadth of potential application but not Standard Bots' specific
              penetration.


              Status-quo substitutes are significant: most US manufacturers below 50 employees have not automated any
              production step and continue to rely on human labor, which in 2026 commands average annual earnings of
              $106,691 per manufacturing employee (NAM). Contract manufacturing in lower-cost geographies (China,
              Mexico) remains a structural substitute, as does purpose-built hard automation for very high-volume,
              low-mix production that does not benefit from a flexible robot. The OSHA-acknowledged absence of dedicated
              robotics safety standards in the US creates ambiguity around compliance obligations that further slows
              adoption decisions among risk-averse SMB operators.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM016
              - CM036
