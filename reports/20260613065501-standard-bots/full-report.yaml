      - CV012
      - CV017
      - CV018
  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Revenue stall
        - ARR growth <20% YoY confirmed in data room or press
        - Valuation re-rate to <$500M; $1B mark unsupportable
        - Exit position or do not follow-on; reassess comparable set
      - - Down round
        - Next equity raise priced below $1B post-money
        - Loss of pricing momentum; preference dilution for late entrants; signal of missed targets
        - Evaluate liquidation preference waterfall; assess recovery scenario for common equity
      - - Key-person departure (CEO/CTO)
        - Evan Beard or co-founder departure without announced successor
        - Fundraising risk; strategic uncertainty; execution dependence flagged in diligence
        - Immediate escalation; pause follow-on until leadership transition confirmed
      - - Competitor price match
        - Universal Robots, ABB, or KUKA publicly matches Standard Bots pricing within 15%
        - Pricing moat eroded; competitive differentiation narrows to software and integration
        - Accelerate competitive moat assessment; require gross margin disclosure under NDA
      - - Capex overrun on Glen Cove facility
        - Facility cost exceeds $50M total or build schedule delayed >6 months
        - Cash burn accelerates; runway shortens; next raise may be earlier and less favorable
        - Request updated cash position from CFO; assess runway under revised burn rate
    notes: >-
      Trigger thresholds are indicative; monitoring requires direct access to company financials. Kill criteria are
      designed to be observable from external signals or NDA data room without requiring litigation-level discovery.
      Thresholds calibrated to material-change level, not precision.
    claimRefs:
      - CV038
      - CV039
      - CV046
      - CV040
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Revenue / ARR
        - No public disclosure of ARR, revenue run-rate, or any revenue metric as of June 2026
        - Cannot compute revenue multiple or validate $1B mark without revenue anchor
        - Request NDA data room access; compare to deployment count × estimated ASP
      - - Gross margin
        - Hardware and software gross margins not disclosed
        - Sub-30% hardware margins would make $1B valuation extremely difficult to justify even at high growth
        - Request management P&L; benchmark against Teradyne Robotics and comparable hardware cos
      - - Cap table / liquidation preferences
        - Preferred stock structure, participation rights, and liquidation waterfall not public
        - Return math for common equity impossible without preference stack; down-round recovery depends on seniority
        - Request cap table summary and preference schedule from Series C data room
      - - Customer churn / retention
        - No deployment retention, churn rate, or repeat purchase data disclosed
        - Durability of the deployment base underpins the recurring revenue and TAM penetration thesis
        - Customer reference calls under NDA; request cohort analysis
      - - Burn rate and runway
        - Monthly cash burn and current runway undisclosed
        - Capital adequacy is opaque; potential forced raise risk at unfavorable terms if burn is high
        - Request CFO operating model under NDA; scenario analysis on facility expansion timing
      - - Safety and quality certifications
        - OSHA/ISO TS 15066 and CE/UL certification status for newest products (Bolt, Spark) not publicly confirmed
        - >-
          Enterprise and government customers may require certifications before deployment approval; missing certs =
          sales friction
        - Request current certification documentation; confirm ISO and OSHA compliance for each SKU in portfolio
    notes: >-
      Items ordered by investment criticality from a buy-decision standpoint. Revenue and gross margin are blocking
      items that must be confirmed before a buy recommendation. Cap table and burn rate are secondary blocking items.
      Certification and retention are material but not individually dispositive. All asks assume standard NDA access.
    claimRefs:
      - CV010
      - CV031
      - CV046
