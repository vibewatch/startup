  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation
        blocks:
          - type: paragraph
            body: >
              Standard Bots serves two broadly distinguishable customer segments: small-to-medium manufacturers (SMBs),
              typically family-owned or regionally anchored shops, and large enterprise accounts including Fortune 100
              industrials, government agencies, and defense contractors. The company explicitly frames itself as serving
              "Fortune 100 companies to hundreds of SMB manufacturers across the country," per the June 2026 Series C
              press release. As of the same date, the company claims deployment across "nearly every state."


              In terms of buyer-user-payer dynamics, the typical payer is the factory owner or VP of Operations; the
              buyer is a manufacturing engineer or plant manager who evaluates automation ROI; and the user is the
              shop-floor operator who programs the robot via demonstration. The 30-day free trial significantly lowers
              the payer commitment barrier, allowing pilots before full lease conversion.


              SMB manufacturers appear to be the quantitatively dominant cohort — "hundreds" versus a handful of named
              enterprise accounts. Use cases are primarily machine tending, welding, palletizing, and inspection. The
              enterprise cohort (Sunoco, Adient, Lockheed Martin, Amazon, NASA, US Army) appears in the press release
              but individual deployments are not independently confirmed.


              The education channel is a nascent third segment. Standard Bots operates an Education Program offering
              Spark arm kits at $29,500 to universities, technical schools, and secondary institutions. The page claims
              "Trusted by The Nation's Leading Institutions" but lists no institution names. The education pipeline is
              designed to funnel trained graduates into manufacturing employer accounts, but this revenue stream is at
              an early stage and conversion to commercial accounts is unproven.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU018
              - CU038
