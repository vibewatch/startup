      - number: '1.6'
        title: Evidence Gaps and Diligence Priorities
        blocks:
          - type: paragraph
            body: >
              Several material metrics are unavailable from public sources. Revenue, ARR, gross margin, NRR, and burn
              rate are not disclosed — the company is private and has made no filings. Headcount is not published
              anywhere; the careers page lists open roles across software, manufacturing, applications engineering,
              sales, and technology, indicating active hiring but providing no total employee count. Customer count is
              described only as "hundreds of American companies." The "10% of new U.S. industrial robot deployments"
              claim is a company projection, not a reported figure, and relies on a private estimate of total U.S.
              deployments.


              Founding date conflict: Tracxn and TechFundingNews report 2011; GreyJournal implies ~2018 by calling the
              company "eight years old" in June 2026. The 2011 date is used in this report as the database-corroborated
              value but requires verification.


              Co-founder James Cordle is named in the Series C press release but absent from the careers leadership page
              and has no public profile in accessible sources — his current role, equity position, and responsibilities
              are unverifiable from public evidence.


              Investor board seats and governance terms are not disclosed. Prior-round valuations (Series A, seed, if
              any) are not available — Crunchbase shows the last round as July 2024 Series B, with no earlier round
              data.


              Independent corroboration of named enterprise customers is limited: Amazon, Lockheed Martin, NASA, and
              U.S. Army are named in press releases and company materials, but no independent procurement records,
              contract announcements, or third-party customer confirmations have been found. The testimonials on the
              website are from individual operators, not executives, and reference companies rather than formal
              contracts.
