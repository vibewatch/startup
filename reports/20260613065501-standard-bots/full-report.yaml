  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              Standard Bots targets the U.S. SME and light industrial cobot cell market, a segment historically served
              either by direct-labor operations (the largest status-quo substitute) or by six-axis cobots deployed
              through a combination of hardware vendor, value-added reseller (VAR), and systems integrator. The
              competitive field can be divided into four groups: (1) incumbent full-line automation vendors— Universal
              Robots, ABB, Fanuc, and KUKA—who dominate installed base; (2) second-tier cobot challengers such as Doosan
              Robotics and Techman Robot; (3) internal-build alternatives using off-the-shelf industrial arms plus
              integration services; and (4) the direct status-quo substitute of manual labor with periodic human
              upskilling.


              Universal Robots holds the largest share of the global cobot market and has pioneered the category since
              2005. ABB and Fanuc each bring broader industrial automation portfolios and deep integrator networks.
              KUKA, now Midea-owned (China), carries the same mechanical depth but has introduced procurement risk for
              U.S. government-adjacent buyers. Among challengers, Doosan and Techman have established footholds in
              Asia-Pacific but are less distributed in North America. Standard Bots is differentiated by being the only
              domestically manufactured AI-native full-cell vendor at this price tier—but that differentiation must be
              weighed against significantly smaller ecosystem maturity and service reach.


              The status-quo alternative—ongoing manual labor—remains the dominant competitive force. Manufacturers that
              have not yet automated frequently cite upfront cost, programming complexity, and integration risk as
              barriers. Standard Bots' no-code deployment and complete-cell model is explicitly designed to eliminate
              those barriers, directly competing with the inertia of manual workflows, not just rival hardware vendors.
