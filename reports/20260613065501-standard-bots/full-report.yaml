      - number: '4.3'
        title: Unit Economics and Cost Structure
        blocks:
          - type: paragraph
            body: >
              Standard Bots' unit economics cannot be computed from public information. The company has not disclosed
              gross margins, COGS breakdown, customer acquisition cost, sales cycle length, or net revenue retention.
              The analysis below distinguishes what is known (list prices, tier structure, manufacturing location and
              footprint) from what must be estimated or flagged as undisclosed.

              On the revenue side, ASP per unit is inferrable from published prices: a DIY machine tending cell at
              $47,000 represents the floor, with blended ASP likely higher once Value-Add and Full Integration tiers are
              factored in and once multi-robot orders from the Fortune 100 customers are considered. On the cost side,
              vertically integrated US manufacturing (the company builds its own actuators, encoders, and control
              systems) is a strategic differentiator but also carries higher fixed-cost exposure than the predominantly
              Asia-outsourced model used by competitors such as Universal Robots (Teradyne, manufacturing in Denmark and
              previously outsourced components). IFR data shows the US lags China 9-to-1 in new robot installations;
              this tailwind supports volume assumptions but also underscores how early-stage the US cobot addressable
              market is relative to the capital investment required to build domestic manufacturing capacity.

              Gross margin for the sector is benchmarked by Teradyne's consolidated 10-K: the Robotics segment
              (Universal Robots + MiR) has faced declining revenue and margin compression severe enough to trigger
              goodwill impairment review, with a $6M inventory provision in 2025. This suggests that even scaled cobot
              OEMs face margin pressure; Standard Bots at significantly smaller scale and during a capital-intensive
              facility buildout phase is unlikely to have reached comparable margins yet. Hardware-robotics gross
              margins for comparable companies typically range 40–60% at maturity; Standard Bots' current margin is
              unknown and possibly materially lower during the expansion phase.

              CAC is not disclosed. The direct sales model and the tiered onboarding structure (with free pilots and
              30-minute response time) suggest a high-touch, high-CAC model that may be appropriate for enterprise
              accounts but poses scalability challenges for the long tail of SMB customers. Whether software or support
              generates recurring revenue above and beyond the hardware sale is not known; the pricing pages bundle
              software and support into the cell price without separate line items.
