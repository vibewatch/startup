            body: >
              The planned transition from "designs almost all its own parts" to full in-house manufacture by 2027
              (facility expansion to 70K sqft plus component manufacturing ramp) is capital-intensive and execution-
              dependent. The $200M Series C funds this plan, but the timeline and capex budget are undisclosed, creating
