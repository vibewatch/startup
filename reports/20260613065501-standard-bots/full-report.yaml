  - id: FV002
    title: Valuation Sensitivity to ARR and Revenue Multiple
    type: bar
    layout: wide
    summary: >-
      Implied enterprise value ($M) at four assumed ARR levels across three revenue multiple scenarios (5x, 10x, 15x).
      Current $1B mark shown as reference. All figures are illustrative estimates based on comparable-derived multiple
      ranges.
    approximationNotes: >-
      ARR figures are unanchored assumptions—Standard Bots has not disclosed revenue. Revenue multiples derived from
      Teradyne Robotics comparable (5–6x) and growth-stage AI hardware blended premiums (10–15x). EV estimates do not
      account for debt, cash, or preference overhang. Reference line at $1,000M is current mark.
    data:
      items:
        - label: $25M ARR × 5x
          value: 125
        - label: $25M ARR × 10x
          value: 250
        - label: $50M ARR × 5x
          value: 250
        - label: $50M ARR × 10x
          value: 500
        - label: $100M ARR × 5x
          value: 500
        - label: $100M ARR × 10x
          value: 1000
        - label: $150M ARR × 5x
          value: 750
        - label: $150M ARR × 10x
          value: 1500
