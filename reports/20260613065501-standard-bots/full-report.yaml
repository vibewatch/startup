      - number: '3.3'
        title: Direct Cobot Challengers and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >
              Doosan Robotics, headquartered in Seoul, describes itself as Korea's No. 1 collaborative robot maker and
              offers a range of H, M, A, and E series cobots targeting light industrial and service applications. Its
              product portfolio includes industrial palletizing solutions and the Dr. Presso coffee-service robot,
              illustrating a strategy that spans manufacturing and service sectors. Doosan's North American distribution
              is growing but remains thinner than Universal Robots or Fanuc, and it does not currently offer a complete
              turnkey cell comparable to Standard Bots.


              Techman Robot (TM) of Taiwan positions its cobots around a native AI engine, robot arm, and vision system
              in a single integrated platform—a proposition that overlaps meaningfully with Standard Bots' AI-native
              message. The TM AI Cobot S series includes AI-powered defect detection and object recognition. Techman has
              gained traction in electronics and precision assembly applications in Asia-Pacific but has a smaller
              footprint in U.S. SME manufacturing.


              The internal-build alternative—custom automation cells assembled by a systems integrator using generic
              industrial robots (typically Fanuc, ABB, or KUKA arms) and custom software—is the dominant historical path
              for manufacturers beyond simple cobot applications. This path typically costs $150,000–$300,000+ for a
              custom cell and requires 6–18 months of engineering time, creating a clear contrast with Standard Bots'
              $47,000–$79,000 full-cell pricing and claimed days-to-deploy timeline. The status-quo alternative—manual
              labor—remains the operative competitive force for manufacturers who have not yet taken the first
              automation step.
