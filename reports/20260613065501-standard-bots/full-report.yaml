  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Standard Bots operates in the industrial robotics sector where OSHA currently has no specific federal
              standards for robots; compliance is instead governed by ANSI/RIA R15.06 (the US adoption of ISO
              10218-1:2011) for industrial robots and RIA TR R15.606 (the US adoption of ISO/TS 15066) for collaborative
              robot safety. These standards set force and power limits for collaborative operation, require risk
              assessment documentation, and specify safeguarding design. Standard Bots markets its robots as requiring
              no safety fencing due to built-in collision detection, a claim consistent with collaborative robot design
              intent, but no third-party conformance declaration, CE mark, or UL listing has been identified in any
              reviewed public source. This constitutes a material barrier to EU market entry and creates friction with
              regulated-sector enterprise customers who require certification documentation before deployment.

              The purchase and leasing terms published on the Standard Bots website contain broad AS-IS disclaimers: the
              company explicitly disclaims all warranties of merchantability, fitness for purpose, conformity to law,
              and patent non-infringement. Customers are required by a contractual Risk Assessment exhibit to perform
              their own safety configuration analysis before first use. The limitation of liability clause caps company
              exposure at fees paid. This posture transfers product safety responsibility to the buyer-operator, which
              is legally defensible but creates a material enterprise sales friction in risk- averse verticals
              (aerospace, defense, food-grade manufacturing). No confirmed intellectual property litigation or patent
              challenge has been identified; the evidence gap is noted.

              Export control exposure is sector-level and hypothetical: robots containing AI-capable GPUs and custom
              advanced actuation systems may require Export Control Classification Number review under the Bureau of
              Industry and Security Export Administration Regulations, particularly for any future international sale to
              Country Group D:5 jurisdictions. Standard Bots has publicly advocated a US ban on Chinese-made industrial
              robots and robotics components; if this becomes policy it would be a competitive tailwind, but it signals
              active exposure to trade policy volatility in the robotics supply chain.

              The Business and Human Rights Resource Centre maintains a profile for Standard Bots with minimal content,
              indicating no documented human rights incidents or grievances as of the access date. No CPSC recall, OSHA
              citation, or FTC enforcement action has been found in available public sources; the absence of public
              incidents is an evidence gap rather than confirmed clean record.
