          - type: callout
            title: Land-and-Expand Structurally Supported but Unquantified
            body: >
              The product line breadth (entry Spark at lower price, Core for machine tending, Thor for heavier tasks)
              creates a natural upsell ladder. The TMMI testimonial references multiple units, and the press release
              describes growing customer accounts. If NRR is above 100%, the "hundreds" customer base would compound
              revenue meaningfully. The education pipeline adds a secondary long-term acquisition channel. These
              structural features are positive, but remain unquantified from public data.
            calloutType: insight
            claimRefs:
              - CU029
              - CU030
