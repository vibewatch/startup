  - id: TM004
    title: Growth Drivers and Adoption Constraints
    columns:
      - Driver / Constraint
      - Direction
      - Timing
      - Implication
      - Diligence Ask
    rows:
      - - Manufacturing labor shortage (structural)
        - Driver
        - Current; deepening through 2033
        - >-
          474K unfilled jobs April 2026; 3.8M new positions needed by 2033; direct purchase trigger for SMBs unable to
          hire
        - >-
          Confirm persistence of labor shortage in Standard Bots' primary verticals (machine tending, welding,
          palletizing); track BLS monthly JOLTS for manufacturing segment
      - - US–China manufacturing competitiveness gap
        - Driver
        - Current; policy-accelerated
        - >-
          China installs 9x more robots/yr than US; 57% domestic market share for Chinese robot OEMs; US reshoring
          narrative creates political tailwind for domestic robot suppliers
        - >-
          Assess whether tariff and trade policy changes (2025–2026) create durable demand pull or are cyclical; monitor
          any ban on Chinese-made robot components that Standard Bots lobbies for
      - - Declining total cost of cobot hardware
        - Driver
        - Ongoing (multi-year)
        - >-
          Standard Bots cells 20–30% cheaper than legacy; first-mover pricing advantage may erode as competition
          intensifies from China-sourced cobots
        - >-
          Verify Standard Bots' cost structure and whether vertical integration provides durable price advantage vs.
          imported cobots
      - - No-code AI-native software accessibility
        - Driver
        - Current; differentiating
        - >-
          Teach-by-demonstration model eliminates need for specialist programmer; expands SAM to non-technical SMB
          buyers; supports fleet management at scale
        - >-
          Independently verify no-code claim; assess whether operators can actually program without IT support; check
          customer testimonials
      - - SMB budget friction and CapEx limits
        - Constraint
        - Current; persistent
        - >-
          Most manufacturers with <20 employees lack easy access to $47K+ CapEx; leasing/subscription model mitigates
          but adds complexity; loan approval and cash flow concerns
        - Assess credit/leasing default rates; review lease penetration vs. outright purchase mix in customer base
      - - Integration complexity (physical and IT/OT)
        - Constraint
        - Current; improving slowly
        - >-
          Physical cell integration (fixturing, safety scanners, PLC wiring) still requires technical capability;
          potential scope creep on Full Integration tier creates schedule and cost risk
        - Review customer case studies for integration timeline and total cost; assess churn rate post installation
      - - Regulatory ambiguity (no OSHA robot standards)
        - Constraint
        - Current; uncertain timeline
        - >-
          OSHA has no dedicated industrial robotics standards as of 2026; robot accidents frequently occur during
          programming, setup, and maintenance; liability risk for SMB buyer deters adoption without clear compliance
          pathway
        - >-
          Monitor OSHA rulemaking; assess whether Standard Bots provides compliance documentation or safety consulting
          to buyers
      - - Job displacement political risk
        - Constraint
        - Latent; scenario-dependent
        - >-
          Older US study found each robot/1,000 workers → −0.2pp employment ratio, −0.42% wages; creates potential
          backlash risk for reshoring-with-robots narrative; may affect government subsidies or adoption incentives
        - >-
          Track legislative environment; assess whether job-creation evidence from adopting plants (Minnesota 2025 study
          — +150% job postings, +15% employment) is gaining traction in policy debate
      - - Competitor installed base and integrator lock-in
        - Constraint
        - Current; structural
        - >-
          Fanuc, KUKA, ABB, Universal Robots have large installed bases, trained integrator networks, and long-term
          service contracts; switching costs are material for enterprises with multi-robot fleets
        - >-
          Quantify win rates vs. incumbent suppliers; assess Standard Bots' integrator ecosystem build-out; identify
          whether it sells through or around existing integrators
      - - Government policy support (reshoring, Made-in-USA)
        - Driver
        - Emerging; policy-cycle dependent
        - >-
          Standard Bots advises White House and Congress; tariff policy benefits domestically-assembled robots;
          potential federal subsidies for manufacturers investing in automation
        - >-
          Verify status of National Robotics Strategy proposals; assess whether Standard Bots is positioned to benefit
          from or has already secured government-funded pilot programs
    notes: >-
      Directions and timing are based on evidence reviewed in this research pass. Driver/constraint balance is
      qualitative; no quantitative scoring model was applied. The job displacement constraint is supported by academic
      literature cited in Forbes (June 2026); the Minnesota 2025 study counter-evidence is company-cited and not
      independently reviewed here. Policy driver is partially based on company claims about its own advocacy activity.
