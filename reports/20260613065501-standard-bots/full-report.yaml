            title: All Named Customer Proof Is Company-Controlled
            body: >
              Every customer testimonial and case study publicly available for Standard Bots as of June 2026 appears on
              company-owned channels (standardbots.com) or in company-authored press releases. No independent trade
              press or customer-authored case study corroborates any specific deployment. Shaw Barrels' 4x productivity
              claim and HomeGrown Lifting's doubled throughput are each compelling but unverifiable from public data.
              The enterprise customer list (Sunoco, Adient, Lockheed, Amazon, NASA, US Army) requires
              pilot-vs-production clarification before being used to underwrite enterprise revenue projections. Industry
              observers note that cobots are "not a silver bullet" and deployment claims should be validated with direct
              customer references.
