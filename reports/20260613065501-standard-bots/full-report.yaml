          label: Market Evidence
          detail: '>17% CAGR; policy tailwinds; 9x China-US install gap — Positive'
        - id: N2
          label: Product Evidence
          detail: AI-native, no-code; proprietary actuators; Bolt roadmap unshipped — Positive with gaps
        - id: N3
          label: Customer Evidence
          detail: Fortune 100 + hundreds of SMBs; no churn/ARR data — Positive with opacity
        - id: N4
          label: Valuation Evidence
          detail: $1B on undisclosed revenue; UR comp at 5–6x declining revenue — Stretched
        - id: N5
          label: Risk Evidence
          detail: High capex; opacity; cobot market headwinds; key-person risk — High risk
        - id: N6
          label: Evidence Gate
          detail: Revenue / ARR undisclosed → blocking; financial opacity → blocking
        - id: N7
          label: 'Recommendation: Track / Research More'
          detail: Upgrade to buy only if revenue >$100M ARR confirmed with >35% gross margins
      edges:
