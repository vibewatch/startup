  - id: FM001
    title: Market Sizing Pyramid — TAM / SAM / SOM
    type: pyramid
    layout: standard
    summary: >-
      Illustrates the nested market from the broadest global intelligent robotics opportunity down to Standard Bots'
      stated US deployment share target, with source-backed values at each layer.
    approximationNotes: >-
      US hardware TAM derived from IFR 34,200 units × $50K–$100K ASP range; not sourced from a published dollar figure.
      SAM represents US market; SOM is company-stated target (10% of US installations). Global intelligent robotics TAM
      from M&M paywall summary; definition is broader than industrial robots alone. All values should be treated as
      order-of-magnitude estimates except where marked actual.
    data:
      nodes:
        - id: L1
          label: Global Intelligent Robotics Market (TAM — broad)
          detail: >-
            M&M estimate: $13.99B in 2025, growing to $50.33B by 2030 (CAGR 29.2%). Includes industrial, service, and
            collaborative robots globally. Broadest possible market boundary; not Standard Bots' primary reference
            market.
        - id: L2
          label: Global Industrial Robot Installations
          detail: >-
            IFR 2024: 542,000 units installed globally; 4,664,000 units operational stock (+9%). Forecast 575,000 in
            2025; >700,000 by 2028. Hardware-only; no published dollar TAM by IFR.
        - id: L3
          label: US Industrial Robot Market (SAM)
          detail: >-
            IFR 2024: 34,200 US units installed. Derived hardware value: ~$1.7B–$3.4B/yr (central ~$2.1B) at $50K–$100K
            ASP. Few domestic suppliers; US imports most robots from Japan and Europe. Low confidence on dollar figure.
        - id: L4
          label: AI-Native / No-Code US Segment (SOM Target)
          detail: >-
            Standard Bots claims target of 10% of new US industrial robot deployments by 2027 (~3,400–3,700 units/yr at
            2024 base). At $47K–$75K ASP per application cell, implied revenue potential ~$160M–$280M/yr at full
            penetration. Current customer count undisclosed ("100+" claimed); actual market share not independently
            verified.
    claimRefs:
      - CM004
      - CM008
      - CM021
      - CM022
