      - number: '4.4'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >
              Standard Bots presents a financially legible but incompletely disclosed investment case. On the positive
              side: list prices are competitive (Core at $37K vs. Fanuc at $50K+), the tiered sales model supports
              multiple ASP scenarios, the $200M fresh capital provides near-term fuel, and the manufacturing
              verticalization thesis is intellectually coherent for a company targeting 10% of US robot deployments. On
              the negative side: no revenue, ARR, gross margin, burn, or retention metric is publicly available. The
              private-company opacity is total. The capital plan—full in-house manufacturing by 2027—is ambitious and
              likely to consume a substantial fraction of the $200M raise before reaching cash-flow breakeven.

              The adverse market context is material: Universal Robots, the market leader that Standard Bots most
              directly competes with on form factor and target market, posted a 15.5% revenue decline in 2025 and cut
              approximately 400 jobs from its robotics business. Standard Bots' growth narrative depends on
              demonstrating that it is taking share, not merely launching into a softening market. This distinction
              cannot be assessed without revenue disclosure.

              Five blocking diligence gaps must be resolved before any investor can underwrite unit economics, capital
              adequacy, or valuation with confidence. These are summarized in the Public Financial Gaps table. The
              recommendation is to treat the company as "research-more" pending an investor data room that provides at
              minimum: trailing revenue, gross margin, burn, and a capital deployment schedule linked to manufacturing
              milestones.
            claimRefs:
              - CI019
              - CI020
