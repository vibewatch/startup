      - number: '6.3'
        title: Adoption Trajectory
        blocks:
          - type: paragraph
            body: >
              Standard Bots' claimed customer trajectory has three public milestones: a deployment base of "hundreds of
              American companies" across "nearly every state," a customer roster spanning Fortune 100 industrials
              through SMB manufacturers, and an ambition to capture 10% of new US industrial robot deployments "by next
              year" (2027 per the June 2026 press release). The IFR reported approximately 33,000 new industrial robot
              units installed in the United States in 2024 according to the World Robotics 2025 statistics release; a
              10% share would imply roughly 3,300 to 4,000 annual unit deployments — a significant scaling leap from a
              stated "hundreds" total customer baseline.


              The adoption funnel begins with discovery (trade shows, digital outreach, or education program), proceeds
              through the free 30-day pilot, and converts to a paid leasing arrangement. Evidence for the post-trial
              conversion rate is absent from public sources. Land-and-expand is documented qualitatively: the TMMI
              testimonial references multiple units, and the product line (Spark for lighter tasks, Core for machine
              tending, Thor for heavier industrial applications) supports account expansion by use-case complexity.


              The 2026 target of "nearly every state" is consistent with an early-stage national SMB rollout. Geographic
              concentration is likely in manufacturing-dense regions: Midwest automotive/industrial heartland,
              mid-Atlantic (company HQ is Glen Cove, NY), and Southeast states with growing manufacturing. No customer
              concentration by state or region is publicly verifiable.


              Compared to Universal Robots at a similar stage, UR shipped approximately 500 units in its first two years
              (2009-2010) and grew to thousands per year by year five. Standard Bots' "hundreds" total customer claim is
              plausibly consistent with early-stage UR trajectory, but the 10% share target implies much faster scaling.
