      - number: '4.2'
        title: Funding History and Capital Adequacy
        blocks:
          - type: paragraph
            body: >
              Standard Bots crossed unicorn status in June 2026 with a $200M Series C led by RoboStrategy (a
              robotics-focused closed-end fund) alongside returning lead General Catalyst. This follows a $63M Series B
              in 2024, also led by General Catalyst. Publicly disclosed cumulative funding therefore stands at
              approximately $263M; earlier pre-Series B rounds are not confirmed in any public source reviewed. The $1B
              post-money valuation and the $200M raise imply a multiple-of-revenue underwrite that cannot be confirmed
              without ARR disclosure—analysts at General Catalyst cited "democratization of robotics" as the value
              thesis, not a specific revenue multiple.

              The fresh Series C capital is earmarked for a specific and capital- intensive program: expanding the Glen
              Cove, New York facility to 70,000 square feet and accelerating vertical manufacturing integration. The
              company has stated that it plans to manufacture "virtually everything in-house" by approximately 2027,
              which implies ongoing capital expenditure beyond the real-estate expansion already announced. The
              combination of a facility buildout, tooling, component manufacturing ramp, and headcount growth makes this
              a meaningfully capex-heavy use-of-funds profile for an industrial robotics startup. Monthly burn rate,
              cash-on-hand post-close, and runway are entirely undisclosed. The $200M raise provides a plausible
              multi-year runway for a company at this stage, but without burn disclosure no runway calculation is
              possible from public sources.

              Comparative context from Teradyne's 2025 10-K is instructive but adverse to simplistic extrapolation:
              Universal Robots' parent reported a 15.5% revenue decline in its Robotics segment in 2025 YoY and
              restructured approximately 400 employees out of the segment. This reflects near-term headwinds in the
              cobot market that Standard Bots enters at scale. Whether Standard Bots is exposed to the same demand
              softness or is growing by taking share from legacy players remains an open diligence question.
