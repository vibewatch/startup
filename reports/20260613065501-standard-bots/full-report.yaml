      - number: '7.5'
        title: Kill Criteria, Monitoring Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Six thesis-break triggers define the monitoring framework for Standard Bots. First, failure to obtain any
              third-party safety certification by mid-2027 would confirm a structural barrier to EU and regulated-sector
              expansion, materially reducing the total addressable market. Second, a down-round or bridge financing
              event at sub-$1B valuation would signal growth shortfall and investor confidence erosion. Third, departure
              of Evan Beard from his CEO or Chief Engineer role — absent a credible successor already in the operating
              structure — would require immediate thesis reassessment. Fourth, confirmed Bolt shipping delay past Q4
              2026 would reflect roadmap execution risk and cede humanoid-adjacent differentiation to competitors.
              Fifth, Glen Cove facility construction delays extending beyond Q1 2027 would constrain production capacity
              and compress gross margins through underutilization. Sixth, any confirmed OSHA citation, product recall,
              or customer safety incident involving a Standard Bots robot would crystallize the product liability risk
              currently managed contractually through AS-IS disclaimers and customer-side risk assessment obligations.

              Priority diligence asks: (1) request a copy of any third-party safety certification documents or CE/UL/ISO
              TS 15066 conformance declarations; (2) obtain EAR classification documentation for core components
              including the onboard GPU and custom actuation system; (3) obtain board composition, governance charter,
              and cap table with preference stack; (4) obtain revenue, ARR, gross margin, and monthly burn rate for the
              trailing 12 months to validate the $1B valuation underwrite; (5) request Bolt GA roadmap with signed LOIs
              or pipeline evidence; (6) obtain Glen Cove facility expansion construction contract and completion
              timeline; (7) confirm supply chain qualification plan for 2027 vertical integration target; and (8) obtain
              any outstanding warranty claims, customer dispute records, or prior incident reports involving robot
              malfunction or workplace injury.
            claimRefs:
