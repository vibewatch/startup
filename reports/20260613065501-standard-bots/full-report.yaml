  - id: FV001
    title: Recommendation Logic Chain
    type: flow
    layout: standard
    summary: >-
      Directed flow from five evidence dimensions (market, product, customers, valuation, risk) through the assessment
      gate to the Track / Research More recommendation.
    approximationNotes: >-
      Node labels are qualitative assessments of available public evidence; all ratings would shift with revenue and
      margin disclosure under NDA. The flow represents current evidence weight, not a scoring algorithm.
    data:
      nodes:
