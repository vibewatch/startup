              Standard Bots has not publicly disclosed NRR, GRR, churn rate, customer cohort data, or repeat purchase
              rates. The 30-day free trial model means a meaningful fraction of early "deployments" may represent
              unconverted trials. Without retention data, it is not possible to assess whether the "hundreds of
              companies" figure represents a stable, growing, or declining install base. This is the single largest
              quantitative gap in the customer diligence.
