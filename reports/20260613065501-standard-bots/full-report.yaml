        title: 'Hardware Architecture: Vertical Integration, Actuators, and Sensing'
        blocks:
          - type: paragraph
            body: >-
              Standard Bots claims end-to-end hardware design, asserting that "product and component designs are 100
              percent proprietary after years of research and development." The company builds its own actuators using
              custom motor and drive systems manufactured in Glen Cove, NY. Across all SKUs, joint design includes
              multi-modal torque sensing fused with ultra-high-rate motor control, delivering the sub-millimeter path
