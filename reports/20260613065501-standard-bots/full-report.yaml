      - number: '6.4'
        title: Retention and Durability Gaps
        blocks:
          - type: paragraph
            body: >
              Standard Bots has not publicly disclosed any retention metrics: net revenue retention (NRR), gross revenue
              retention (GRR), churn rate, customer count by cohort, or average contract length. This is typical for a
              Series C private company, but it represents a significant diligence gap. The 30-day free trial model means
              a proportion of early "deployments" may be trial units that did not convert.


              The company has no presence on independent review platforms (G2, Capterra, TrustRadius) as of June 2026.
              This absence is consistent with the B2B hardware-as-a-service model where relationships are managed
              through direct sales, but it limits external triangulation. No verified positive reviews from identifiable
              named customers exist outside company-controlled channels.


              The strongest proxy for customer durability is the TMMI testimonial referencing multiple units and the
              expansion narrative describing customers growing from one to multiple-robot configurations. However, even
              if expansion is occurring, the absence of NRR data means diligence cannot confirm whether revenue from
              expanding accounts offsets churn from trial-to-production failures.


              Customer concentration risk appears low in the SMB segment by design, but enterprise accounts could
              represent outsized revenue concentration that is not visible from public sources. A Lockheed Martin or
              Sunoco contract at multi-unit scale would represent meaningful revenue concentration.
