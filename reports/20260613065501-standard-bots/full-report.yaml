    columns:
      - Dimension
      - Thesis (Bull)
      - Anti-Thesis (Bear)
      - What Would Change the View
    rows:
      - - Market
        - '>17% CAGR cobot TAM; China gap creates US catch-up demand; policy tailwinds'
        - UR/TER cobot revenue declined 15.5% in 2025; near-term market contracting
        - IFR US install data showing YoY growth recovery and US share gains in 2026–2027
      - - Product & Technology
        - AI-native, no-code platform; proprietary actuators; demonstration-based programming
        - Unverified at scale; Bolt/AI roadmap not yet shipped; no third-party performance benchmarks
        - Independent benchmarks versus UR and KUKA; Bolt shipment and customer proof points
      - - Customers
        - Fortune 100 roster (Amazon, NASA, Lockheed, Army); hundreds of SMBs across ~50 states
        - Revenue undisclosed; individual deployment counts not confirmed; churn unknown
        - Audited customer ARR, repeat purchase rate, and deployment density data
      - - Financials
        - $200M Series C with experienced backers; $263M total disclosed capital; 70k sqft facility planned
        - Zero revenue/margin disclosure; capex-heavy expansion; burn rate unknown
        - Revenue confirmation at $100M+; gross margins >35%; burn <$15M/month
      - - Valuation
        - $1B mark endorsed by RoboStrategy, GC, Amazon, Samsung Next
        - >-
          $1B on undisclosed revenue implies 5–15x ARR multiple depending on revenue assumption; public comps at 5–6x
          declining revenue
        - Revenue at ≥$150M ARR would bring the 5–7x multiple into range of Teradyne comp precedent
      - - Policy & Competitive Moat
        - WH/Congressional advisor role; domestic manufacturing; tariff protection from Chinese robots
        - Chinese competitors installing 9x US volume; cost gap persists despite tariffs; incumbents ABB/UR will respond
        - Confirmed government procurement contracts; tariff protection confirmed at WTO/BIS level
    notes: >-
      Thesis and anti-thesis rows are balanced views derived from public evidence. Where evidence is asymmetric (e.g.,
      financial opacity is confirmed while revenue is not), anti-thesis is weighted more conservatively. "What Would
      Change the View" entries are not predictions but verifiable conditions that would alter the investment stance.
    claimRefs:
      - CV019
      - CV021
      - CV032
      - CV035
