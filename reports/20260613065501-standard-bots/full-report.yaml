        blocks:
          - type: paragraph
            body: >
              Standard Bots provides limited but non-trivial named customer proof. The strongest evidence is from Shaw
              Barrels, a multi-generational family-owned manufacturer in Bridgeville, PA, documented via the company
              homepage and education page: deployment of the Core robot on a Precihole Deep Hole Drilling Machine
              achieved 4x productivity improvement (800 parts/day from 200 parts/day). Shaw Barrels is referenced in two
              separate company-controlled pages, giving this claim dual internal corroboration. However, no independent
              third-party verification of the productivity figure was found.


              HomeGrown Lifting (Lexington, KY), a fitness equipment manufacturer, is cited on the homepage for "doubled
              throughput" after automating rubber tile palletizing. This is company-sourced only.


              The company website features testimonials attributed to Tamil Manivannan (Amazon), Aaron (associated with
              TMMI), Henry (Mac Products), and Kenneth (Reason Robotics). These are company-curated testimonials on a
              company-controlled page; no independent verification channel exists. The Amazon testimonial places a
              Fortune 100 brand in the proof narrative but does not confirm a formal enterprise procurement relationship
              or production deployment scope.


              For enterprise accounts, the Series C press release is the primary evidence source: Sunoco, Adient,
              Lockheed Martin, Amazon, NASA, and the US Army. Press releases are company-authored and do not distinguish
              pilot-stage from production-scale deployments. All six enterprise accounts require independent
              confirmation and pilot-vs-production clarification before being used to underwrite enterprise revenue
              projections.
