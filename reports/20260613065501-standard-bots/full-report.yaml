  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >
              Standard Bots generates revenue primarily through the sale of bundled automation cells—complete,
              ready-to-deploy systems that include a robot arm, control hardware, software, and application-specific
              accessories such as grippers and pneumatics. The company publishes list prices on its application-specific
              landing pages, providing unusually transparent pricing for an industrial robotics vendor. The flagship
              Core robot arm carries a $37,000 list price; the Thor heavy-payload arm lists at $49,500. Application
              cells built around these arms carry higher system prices: machine tending cells start at $47,000 (DIY Kit)
              or $57,000 (Value-Add Package with on-site training), and palletizing and welding cells each start at
              $75,000 for the DIY tier. Standard Bots' stated competitive positioning is 20–30% lower than legacy
              industrial robot OEMs—its own published comparison table lists the Fanuc CRX-10iA/L at $50K+ versus the
              Core at $37K list, and the Fanuc CRX-30iA at $65K+ versus the Thor at $49.5K. The company frames this
              pricing delta as a structural advantage derived from vertically integrated US manufacturing, direct sales,
              and proprietary component design.

              Revenue streams extend beyond hardware. Three service tiers structure the customer relationship: (1) DIY
              Kit—robot, accessories, software, and documentation; customer handles installation; (2) Value-Add Package—
              configuration, on-site training, and production ramp support at a step-up of $10,000 per cell; and (3)
              Full Integration—turnkey design, installation, integration, and optimization at a custom-quoted price. The
              presence of an explicit leasing terms page alongside a purchase terms page signals an available financing
              path for capex-constrained SMB buyers, although lease rates and terms are not publicly disclosed. The
              company also has a dedicated software product (standardbots.com/software) and an AI product page
              (standardbots.com/ai), but software pricing and whether it carries a separate subscription or is bundled
              into the hardware sale is not publicly disclosed. Support economics—response time under 30 minutes,
              on-site within 24 hours, 24/7 US coverage—are marketed as included benefits, not as separately priced
              SKUs; whether support is priced into the hardware margin or sold as an add-on is undisclosed.
