companyProfile:
  summary: >-
    Standard Bots is a Glen Cove, New York robotics company founded in 2011 that sells AI-native, no-code industrial
    robot arms and turnkey automation cells for manufacturing workflows such as machine tending, welding, palletizing,
    inspection, and material handling. Its product family spans Spark, Core, Thor, and the pre-commercial Bolt platform,
    with Core priced from $37,000 and positioned as a more accessible alternative to incumbent cobots. The company has
    raised a publicly confirmed $263M, including a $200M Series C at a $1B valuation in June 2026, and is using that
    capital to expand its Glen Cove facility toward a vertically integrated “metal in to robots out” model. The core
    diligence question is not whether Standard Bots has a credible product story; it is whether the private-company
    financial evidence is strong enough to justify the $1B mark.
