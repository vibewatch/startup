              Revenue, ARR, gross margin, monthly burn, and cash position are entirely undisclosed. The $1B valuation is
              therefore unsupported by any independently verifiable financial metric from public sources. A diligence
              process that does not include full management accounts — including trailing 12-month revenue, unit
              economics, and cash runway — cannot validate the investment thesis at this entry price.
