            title: Contractual Terms Transfer Product Safety Liability to Customers
            body: >-
              Standard Bots' standard purchase and leasing terms require customers to perform their own risk
              assessments, identify safety configuration settings, and add warnings or notifications before first use.
              Combined with broad AS-IS disclaimers and a limitation of liability cap at fees paid, this posture limits
              Standard Bots' direct product liability exposure but may create friction with enterprise procurement teams
              in risk-averse sectors and raise insurance requirements for customers.
