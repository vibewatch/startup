  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product Line: Spark, Core, Thor, and Bolt'
        blocks:
          - type: paragraph
            body: >-
              Standard Bots ships three cobot arm SKUs and has announced a fourth mobile-arm product (Bolt) in beta.
              Spark (7 kg payload, 900 mm reach) targets tabletop precision applications such as inspection, lab
              workflows, and light assembly; it is the company's smallest form factor and is rated IP69K on the arm.
              Core (18 kg payload, 1,300 mm reach) is the volume workhorse, positioned for machine tending,
              pick-and-place, and palletizing at a $37,000 list price. Thor (30 kg payload, 2,000 mm reach) is marketed
              as the heaviest-payload collaborative robot on the market, rated IP69K, and targets welding and
              end-of-line palletizing starting at $49,500. All three shipping SKUs share ±0.025 mm repeatability, a 200
              mm or smaller base footprint, and the StandardOS software environment. Bolt is a mobile arm paired with an
              AMR chassis; it lists 14 kg payload, three-camera head, and interchangeable torso lengths, but the page
              prominently reads "Coming soon" and reservations are collected via a beta sign-up form. The company's own
              marketing copy distinguishes Bolt from the shipping products with this label, making it a pre-commercial
              announcement as of June 2026.
