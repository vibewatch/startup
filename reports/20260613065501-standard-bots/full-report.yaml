      - number: '1.5'
        title: Milestones and Strategic Trajectory
        blocks:
          - type: paragraph
            body: >
              Standard Bots was founded in 2011 (per Tracxn and TechFundingNews database records), though some
              third-party coverage implied a shorter history. The founding period reflects a decade-plus of hardware
              development before public commercial visibility, consistent with the long development cycles typical of
              vertically integrated robotics manufacturers. David Golden joined as co-founder in 2020, bringing
              venture-scale execution experience from Bowery Farming and LeapPay.


              The company's Series B in July 2024 ($63 million, General Catalyst-led) marked its first major
              institutional raise visible in public databases. The Series C in June 2026 ($200 million, RoboStrategy and
              General Catalyst) established unicorn valuation and triggered the 70,000 sq ft Glen Cove facility
              expansion.


              Strategic milestones include the deployment footprint across "nearly every state" — a significant
              geographic claim implying broad U.S. commercial traction — and penetration of defense/aerospace customers
              (Lockheed Martin, NASA, U.S. Army) alongside SMB manufacturers. The company has projected capturing 10% of
              new U.S. industrial robot deployments by the year following the Series C announcement, a quantified market
              share claim not independently verified.


              The trajectory signals deliberate positioning at the intersection of U.S. reshoring policy and AI-native
              robotics: Evan Beard has testified before the Congressional Joint Economic Committee and advised the White
              House. The company frames American-made robotics as a strategic national imperative and has earned
              coverage in Forbes, SiliconANGLE, and Robotics & Automation News aligned with that narrative.


              Notable evidence gaps include: no public record of any litigation, regulatory action, layoffs, recalls, or
              adverse safety events. The BHRC profile shows no allegations. No independent audits of performance claims
              (e.g., "10% of U.S. deployments," "hundreds of companies") are available from external sources.
