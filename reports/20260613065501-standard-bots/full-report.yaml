  - id: FV004
    title: Investment KPI Scorecard
    type: kpi
    layout: compact
    summary: >-
      IC-ready scoring across seven dimensions for Standard Bots as of June 2026. Scores reflect assessable public
      evidence; revenue-dependent dimensions are penalized for opacity.
    approximationNotes: >-
      Scores are qualitative assessments on a 1–10 scale derived from public evidence only. Revenue-dependent dimensions
      (unit economics, valuation support) are scored 1–4 due to lack of disclosure. Scores are not actuarial outputs and
      will shift materially with NDA data room access.
    data:
      items:
        - label: Market Opportunity
          value: 8
          unit: /10
          detail: Large and growing cobot TAM; 17% CAGR projection; strong US policy tailwinds
        - label: Product & Technology
          value: 7
          unit: /10
          detail: AI-native; no-code; proprietary actuators; Bolt and AI roadmap adds upside but unshipped
        - label: Competitive Moat
          value: 6
          unit: /10
          detail: Vertical integration + domestic manufacturing are durable; but incumbents with greater resources can respond
        - label: Unit Economics
          value: 3
          unit: /10
          detail: Undisclosed — hardware-intensive model with capex risk; no gross margin data available
        - label: Risk Profile
          value: 3
          unit: /10
          detail: High — financial opacity + capex intensity + key-person dependency + cobot market headwinds
        - label: Valuation Support
          value: 3
          unit: /10
          detail: Stretched — $1B on undisclosed revenue; public comps at 5–6x declining revenue
        - label: Evidence Quality
          value: 4
          unit: /10
          detail: >-
            Limited — no audited financials; no revenue disclosure; strong product/customer narrative but insufficient
            for buy
    claimRefs:
      - CV026
      - CV029
      - CV030
