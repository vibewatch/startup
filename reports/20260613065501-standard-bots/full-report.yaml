      - number: '2.2'
        title: Market Sizing — TAM, SAM, and SOM Lenses
        blocks:
          - type: paragraph
            body: >
              No single publicly available source provides a verified US-specific dollar figure for the AI-native or
              no-code industrial cobot market. The IFR World Robotics 2025 report (the primary industry census) provides
              unit counts rather than dollar figures. The most rigorous available sizing path is therefore derived from
              IFR unit data cross-referenced with vendor pricing, with explicit confidence ceilings.


              Global context: The IFR reports 542,000 industrial robots installed globally in 2024 — the second highest
              annual total ever recorded and more than double the figure from 10 years prior. Annual global
              installations have exceeded 500,000 units for four consecutive years. Total operational stock reached
              4,664,000 units, up 9%. IFR forecasts 6% growth to approximately 575,000 global installations in 2025,
              with the 700,000-unit threshold expected to be surpassed by 2028. Asia accounted for 74% of 2024
              deployments; Europe 16%; the Americas 9%.


              US market: The United States installed 34,200 industrial robots in 2024 — a 9% decline from 2023,
              representing 68% of Americas-region installations (50,100 total). China installed 9 times more industrial
              robots than the US in that year (295,000 vs. 34,200). Applying a $50K–$100K average selling price range
              derived from Standard Bots' and Universal Robots' published pricing data yields a rough US annual
              industrial robot hardware TAM of approximately $1.7B–$3.4B (central estimate ~$2.1B at $62K midpoint ASP).
              This is a hardware-only floor estimate; adding integration services and software at a 1.5x–3x multiplier
              suggests a total-cost-of-ownership-adjusted TAM of $2.5B–$10B for the US market. These are derived
              estimates with low confidence and should be verified against paid analyst reports.


              Cobot sub-segment: MarketsandMarkets summary data (paywall, partial access) indicates Europe's
              collaborative robot market at $0.41B in 2025, expanding to $0.81B by 2030 (CAGR 14.4%). Asia Pacific
              cobots are projected from $0.59B in 2025 to $1.60B by 2030 (CAGR 22.1%). No accessible North
              America-specific cobot dollar figure was retrieved in this research pass; the US figure is estimated as
              roughly comparable to or slightly above the Europe figure given similar GDP per capita and industrial
              structure, yielding a rough US cobot SAM of $0.4B–$0.8B currently. The global intelligent robotics market
              (M&M, broader category including service + industrial + collaborative) is estimated at $13.99B in 2025
              growing to $50.33B by 2030 (CAGR 29.2%).


              Standard Bots' stated SOM signal: The company claims it is on pace to deliver 10% of new US industrial
              robot deployments by next year (2027 per R&AN and Forbes). Applied to the IFR 2024 US base of 34,200
              units, 10% represents approximately 3,400–3,700 units per year. At Standard Bots' complete cell ASPs of
              $47K–$75K, this implies an annual hardware revenue run-rate potential of approximately $160M–$280M at full
              targeted penetration. Revenue, unit shipment volume, and actual market share are not publicly disclosed;
              these remain open diligence items.
