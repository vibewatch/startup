chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: >
              Standard Bots is a Glen Cove, New York-based manufacturer of AI-native, six-axis industrial robot arms and
              droids. The company describes itself as "America's largest AI-native industrial robot manufacturer," a
              claim repeated across its homepage, press releases, and multiple third-party news outlets as of June 2026.
              Its legal entity is Standard Bots Company, referenced in its publicly posted purchase and leasing terms of
              service.


              Standard Bots' mission is to "propel human productivity through the world's most accessible robots." The
              company's long-term vision — stated on the about page — is "to build the world's preeminent robotics
              platform," with manufacturers as the initial beachhead before expansion into broader commercial and
              eventually consumer markets. The business strategy is premised on vertical integration: the company
              designs its own actuators and assemblies every unit in-house at Glen Cove, NY. It plans to manufacture
              everything — "from metal in to robots out" — domestically by 2027.


              The business model offers robots via outright purchase and a subscription/leasing model. The Core arm
              starts at $37,000 list price. Complete application-specific cells (machine tending, welding, palletizing)
              range from $47,000 to $79,000+ depending on integration tier (DIY Kit, Value-Add, Full Integration).
              Customers also pay a support subscription and, under the leasing model, a recurring fee for software and
              equipment. Title to purchased equipment transfers on shipment from the company's facility; lessees retain
              no ownership. Standard Bots' software platform is no-code, fleet-management enabled, and built for
              operators without programming backgrounds — framed as a structural differentiator from legacy cobot
              providers such as Fanuc and Universal Robots.


              The customer base spans Fortune 100 companies (Sunoco, Lockheed Martin, Amazon, NASA, the U.S. Army), Tier
              1 automotive suppliers (Adient per Robotics & Automation News), and hundreds of small-to-medium
              manufacturers across nearly every U.S. state. Application verticals include machine tending, welding,
              palletizing, pick and place, surface finishing, and testing and inspection. The company operates a 24/7
              support function staffed by applications engineers.
