  topStrengths:
    - >-
      Clear product positioning around no-code automation, demonstration-based training, and aggressive entry pricing
      that directly addresses SMB adoption friction in cobots.
    - >-
      A multi-product roadmap (Spark, Core, Thor, Bolt) plus packaged application cells gives Standard Bots a broader
      automation story than a single-arm vendor.
    - >-
      The June 2026 $200M Series C and returning support from General Catalyst provide real financing capacity for
      manufacturing expansion and go-to-market scale-up.
    - >-
      Public customer evidence is imperfect but not empty: Shaw Barrels and HomeGrown Lifting provide concrete outcome
      claims, and the company has assembled a recognizable enterprise-logo narrative.
  topRisks:
    - >-
      Public financial disclosure is too thin to justify the $1B valuation with confidence: revenue, ARR, gross margin,
      burn, runway, and cap-table terms are all undisclosed.
    - >-
      Safety certification posture, warranty exposure, and roadmap maturity remain incomplete in the public record,
      especially for Bolt and the broader AI-autonomy claims.
    - >-
      Manufacturing concentration in Glen Cove and a still-in-progress facility expansion create execution,
      supply-chain, and working-capital risk.
    - >-
      Customer proof is still mostly company-curated; retention, NRR/GRR, concentration, and the depth of named
      enterprise deployments are not independently validated.
    - >-
      Incumbent cobot vendors retain much larger installed bases, service ecosystems, and certification histories, while
      public comparable data show demand softness can hit the category quickly.
  unresolvedGaps:
    - Audited or management-reconciled financials covering ARR, revenue, gross margin, burn, cash, and runway.
    - >-
      Full cap table, liquidation preferences, anti-dilution terms, and whether the Series C included unusual structure
      or secondary components.
    - >-
      Independent evidence for deployment depth, customer concentration, retention, and progress toward the claim of
      reaching 10% of new U.S. robot deployments by 2027.
    - >-
      Third-party safety/certification documentation (for example CE, UL, ISO/TS 15066 posture) and ship-readiness
      milestones for Bolt.
    - >-
      Board composition, governance rights, and a clearer public explanation of co-founder James Cordle’s role and
      current involvement.
