  - id: financial-verdict-and-diligence-blockers
    title: Financial Verdict and Diligence Blockers
    body: >
      Standard Bots presents a financially legible but incompletely disclosed
      investment case. On the positive side: list prices are competitive (Core
      at $37K vs. Fanuc at $50K+), the tiered sales model supports multiple
      ASP scenarios, the $200M fresh capital provides near-term fuel, and the
      manufacturing verticalization thesis is intellectually coherent for a
      company targeting 10% of US robot deployments. On the negative side: no
      revenue, ARR, gross margin, burn, or retention metric is publicly
      available. The private-company opacity is total. The capital plan—full
      in-house manufacturing by 2027—is ambitious and likely to consume a
      substantial fraction of the $200M raise before reaching cash-flow
      breakeven.

      The adverse market context is material: Universal Robots, the market
      leader that Standard Bots most directly competes with on form factor and
      target market, posted a 15.5% revenue decline in 2025 and cut approximately
      400 jobs from its robotics business. Standard Bots' growth narrative
      depends on demonstrating that it is taking share, not merely launching
      into a softening market. This distinction cannot be assessed without
      revenue disclosure.

      Five blocking diligence gaps must be resolved before any investor can
      underwrite unit economics, capital adequacy, or valuation with confidence.
      These are summarized in the Public Financial Gaps table. The recommendation
      is to treat the company as "research-more" pending an investor data room
      that provides at minimum: trailing revenue, gross margin, burn, and
      a capital deployment schedule linked to manufacturing milestones.
    claimRefs:
      - CI019
      - CI020
      - CI026
      - CI031
      - CI032
      - CI033
      - CI034
    tableRefs:
      - TI005
    figureRefs: []

callouts:
  - calloutType: risk
    title: Total financial opacity from private-company status
    body: >
      Standard Bots has not disclosed any revenue metric (ARR, GMV, total
      revenue, or unit shipments), gross margin, burn rate, or runway. All
      financial analysis is constrained to list prices, disclosed funding
      rounds, and industry benchmarks. This is a material diligence blocker
      for any financial underwriting.
    claimRefs:
      - CI031
      - CI032

  - calloutType: risk
    title: Capital intensity of vertical manufacturing transition
    body: >
      The planned transition from "designs almost all its own parts" to full
      in-house manufacture by 2027 (facility expansion to 70K sqft plus
      component manufacturing ramp) is capital-intensive and execution-
      dependent. The $200M Series C funds this plan, but the timeline and
      capex budget are undisclosed, creating uncertainty about how much of
      the raise is available for commercial growth versus infrastructure.
    claimRefs:
      - CI023
      - CI024
      - CI037

  - calloutType: insight
    title: Published pricing enables partial revenue model reconstruction
    body: >
      Standard Bots' transparent pricing pages—Core at $37K, machine tending
      cells from $47K, palletizing and welding cells from $75K—provide
      stronger evidence for ASP range and GTM structure than most private
      robotics companies disclose. This supports realistic revenue scenario
      modeling once unit volume data is available from the investor data room.
    claimRefs:
      - CI001
      - CI003
      - CI005

