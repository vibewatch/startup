  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: >
        Standard Bots' hardware and services gross margin by SKU, segment,
        and service tier.
      whyItMatters: >
        Gross margin is the primary driver of unit economics, valuation
        multiple, and long-term financial viability. Without it, no revenue
        quality assessment is possible; the range of plausible outcomes
        spans deeply unprofitable to highly attractive.
      diligencePath: >
        Request segment P&L from investor data room; benchmark against
        Teradyne Robotics GAAP segment margin as the closest public comp.
      relatedQuestionRefs:
        - QI015

    - type: private-evidence-only
      severity: blocking
      topic: revenue-and-arr
      missingEvidence: >
        Trailing 8–12 quarters of revenue (by channel, product, and
        geography) and any ARR or recurring revenue metric.
      whyItMatters: >
        Revenue trajectory is required to assess growth rate, assess
        whether the $1B valuation is supportable, and project time to
        breakeven or next raise.
      diligencePath: >
        Request monthly revenue schedule for FY2024 and FY2025 from data
        room; cross-check Series B and Series C use-of-funds statements.
      relatedQuestionRefs:
        - QI017

    - type: private-evidence-only
      severity: blocking
      topic: burn-rate
      missingEvidence: >
        Monthly cash burn, cash-on-hand post Series C, and runway
        projection with stated use-of-funds milestone schedule.
      whyItMatters: >
        Capital adequacy and next-round trigger cannot be assessed. The
        $200M raise is a meaningful amount but the capex plan for full
        manufacturing verticalization could consume it in 2–3 years at
        hardware startup burn rates.
      diligencePath: >
        Request treasury and cash forecast from data room; validate against
        disclosed hiring plans and facility expansion budget.
      relatedQuestionRefs:
        - QI021

    - type: private-evidence-only
      severity: material
      topic: capex-plan
      missingEvidence: >
        Detailed capital expenditure budget and timeline for the 70,000
        sq ft facility expansion and component manufacturing ramp to 2027.
      whyItMatters: >
        The manufacturing verticalization is the primary use of the Series C
        capital. Without a capex budget, the residual capital available for
        commercial growth is unknown, which affects sales efficiency and
        next-round trigger estimates.
      diligencePath: >
        Request capex schedule, construction timeline, and milestone-linked
        payment plan from the data room; validate against comparable
        industrial facility buildout costs in metro New York.
      relatedQuestionRefs:
        - QI014

    - type: private-evidence-only
      severity: material
      topic: software-revenue
      missingEvidence: >
        Whether software is a separately priced subscription or a bundled
        element; if subscription, the pricing, attach rate, and churn rate.
      whyItMatters: >
        A software subscription layer would materially improve revenue
        quality and net revenue retention. Its absence or bundling
        maintains Standard Bots as a hardware-first company with low
        recurring revenue.
      diligencePath: >
        Request software revenue line item and software-per-robot attach
        rate; request any roadmap documentation for software
        productization separate from hardware.
      relatedQuestionRefs:
        - QI025

