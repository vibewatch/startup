company:
  name: Crystalys Therapeutics
chapter:
  number: 6
  title: Customers
  summary: "Crystalys is pre-commercial and therefore has no verified paying-customer or retention base. The strongest current demand evidence is clinical: a defined second-line population with persistent treatment burden, an active U.S. Phase 2 study for XOI-intolerant or uricase-failure patients, and registration-directed Phase 3 programs, while deployment, pricing, adherence, and commercial conversion remain unproven."
sections:
  - id: customer-segments
    title: Target segments and unmet need
    body: >-
      Crystalys is developing dotinurad for patients with gout who need an option
      beyond first-line xanthine oxidase inhibitors, rather than selling into an
      established commercial account base. The company describes the intended use
      as second-line treatment, and its AMETHYST study specifically enrolls adults
      who are intolerant to XOIs or have failed uricase treatment. Independent
      real-world evidence provides a useful demand-side anchor: in a U.S. cohort
      of 969 patients with chronic refractory gout, 57.5% had no evidence of
      reaching serum urate below 6.0 mg/dL during 12 months of follow-up despite
      gout-related medication use. That evidence supports a clinically meaningful
      target population, but it does not establish that these patients will receive
      dotinurad, that payers will reimburse it, or that physicians will switch.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and proof quality
    body: >-
      Adoption is currently measurable as trial enrollment and study execution,
      not as prescriptions, active accounts, repeat purchase, or net retention.
      ClinicalTrials.gov lists AMETHYST as recruiting, sponsored by Crystalys,
      with estimated enrollment of 90 and an estimated primary completion in July
      2027; its primary endpoint is the percentage of participants below 6.0
      mg/dL at Week 24. Crystalys also reported first dosing in the approximately
      500-patient RUBY and approximately 250-patient TOPAZ Phase 3 studies. These
      are credible advancement signals, but they are company or sponsor evidence
      and do not constitute clinical outcomes. A planned open-label extension is
      described as a route to long-term safety and durability data, which means
      persistence and expansion remain future diligence items.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: commercial-conversion
    title: Named proof, expansion, and concentration risk
    body: >-
      No public source in the assigned pool identifies a paying customer,
      production deployment, purchase contract, renewal rate, or customer
      concentration for Crystalys. The named entities are trial populations,
      investors, study sponsors, or development partners rather than customers.
      The commercial proof therefore stops at a plausible clinical segment and
      a development program. Real-world evidence shows substantial healthcare
      utilization among refractory-gout patients, while the company has not
      disclosed a denominator for future eligible patients, a launch price,
      formulary access, channel design, prescriber adoption, or expected
      persistence. The customer thesis is consequently option value on clinical
      validation, not verified revenue durability; diligence should seek
      payer coverage assumptions, physician research, patient persistence data,
      and a reconciled commercialization funnel before underwriting expansion.
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015, CU016]
    tableRefs: [TU003]
    figureRefs: [FU001]
