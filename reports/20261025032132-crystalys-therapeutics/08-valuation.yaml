company:
  name: Crystalys Therapeutics
chapter:
  number: 8
  title: Valuation
  summary: Crystalys has assembled meaningful late-stage financing and a potentially differentiated gout asset, but public evidence does not disclose the Series B price, cap-table preferences, net cash, or commercialization economics. The evidence therefore supports track rather than a priced-in buy call until pivotal data and transaction terms are available.
sections:
  - id: recommendation
    title: Recommendation and entry discipline
    body: Crystalys merits a track recommendation with medium confidence and a high risk rating. The company closed an oversubscribed $130 million Series B in July 2026 to support Phase 3 development and commercialization preparation, and its program includes RUBY, TOPAZ, and AMETHYST. Those are meaningful financing and execution signals, but they are company-issued evidence rather than proof of clinical success or investor returns. The public record identifies an $800 million Series A valuation in September 2025 and $335 million raised across two rounds, while the Series B valuation is not disclosed. EquityZen explicitly says current valuation and share information may not be available for all companies, and its page does not provide a price. Entry should therefore be disciplined around a verified capitalization table, liquidation preferences, fully diluted ownership, cash runway, and clinical probability of success rather than the amount raised alone. A buy call would require evidence that the entry price leaves adequate upside after dilution and launch investment.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Investment thesis versus anti-thesis
    body: >-
      The thesis is that a once-daily oral URAT1 inhibitor with Asian approvals and a broad late-stage program could create strategic value in a large, under-served gout segment. Independent reporting on Arthrosi shows that a separate late-stage URAT1 asset attracted a $950 million upfront payment plus up to $550 million of contingent consideration, demonstrating that strategic buyers can pay substantial amounts for validated gout assets. The anti-thesis is that Crystalys remains pre-revenue and exposed to pivotal-study, regulatory, manufacturing, reimbursement, and commercial execution risk; the Arthrosi transaction is an external benchmark, not a Crystalys valuation. Competitive context is also mixed: Drugs.com reports a complete response letter for Sobi's NASP tied mainly to manufacturing control and facility deficiencies, while Crystalys's public evidence does not establish its own manufacturing readiness. The relevant diligence question is not whether a gout market exists, but whether dotinurad can reproduce the required efficacy, safety, access, and launch economics in the U.S. and Europe at a price that supports the current private-market entry.
      Fierce Biotech also notes that the previously approved URAT1 inhibitor Zurampic had landed on the scrap heap by 2020, while a current pipeline snapshot lists only dotinurad for Crystalys. These signals reinforce single-asset and class-commercialization risk without proving that dotinurad will share the same outcome.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011, CV015, CV016]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and diligence asks
    body: Scenario analysis should remain directional because no current post-money valuation, net cash balance, revenue, net price, gross margin, or fully diluted share count is public in the assigned evidence. The bull case requires clean RUBY and TOPAZ results, a credible regulatory path, acceptable safety and manufacturing execution, and a strategic or public-market exit that values the asset on clinical proof rather than financing momentum. The base case is continued private financing or a partnership while the company resolves regulatory and commercial questions, with dilution and timing risk keeping the recommendation at track. The bear case is a pivotal readout, manufacturing, safety, reimbursement, or commercialization setback that forces a down-round or materially reduces strategic value. Exit readiness is therefore milestone-dependent, not demonstrated by the Series B. Before underwriting, request the signed Series B terms, post-money capitalization, liquidation stack and participating preferences; cash balance and monthly burn; clinical statistical analysis plans and topline timing; manufacturing and regulatory workplan; U.S./European pricing and access assumptions; and scenario-based launch spending. Treat the $800 million Series A valuation as a dated reference point, not a current mark.
    claimRefs: [CV002, CV003, CV012, CV013, CV014]
    tableRefs: [TV003]
    figureRefs: [FV001]
