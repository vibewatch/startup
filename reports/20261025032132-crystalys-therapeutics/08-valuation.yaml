  - id: TV003
    title: Bull / base / bear scenario
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Key risk or trigger]
    rows:
      - [Bull, "RUBY and TOPAZ meet objectives; safety and manufacturing are acceptable; regulatory filings and commercial access are credible.", "Strategic value could be supported by a validated late-stage gout asset; no numeric range is supportable without a current cap table and probability-of-success model.", "Conditional upside, not quantified", "Failure to reproduce Asian evidence or a weak U.S./EU access profile."]
      - [Base, "Clinical program advances but timing, financing, regulatory and launch assumptions remain unresolved.", "Track while preserving entry discipline; future financing may add dilution before value inflection.", "Most supportable current posture", "New financing at unattractive terms or delayed topline data."]
      - [Bear, "Pivotal, safety, manufacturing, regulatory, reimbursement or commercialization setbacks impair the program.", "Down-round, reduced strategic interest, or loss of standalone value is plausible; no downside number is public.", "Material downside risk", "Pivotal failure, manufacturing deficiency, CRL-like event, or inadequate net pricing."]
      - [Diligence gate, "Signed Series B terms, cash/burn, clinical statistics, CMC plan, pricing/access and launch budget are obtained.", "Move toward a priced recommendation only if evidence supports risk-adjusted upside after dilution.", "Required before buy", "Any missing item keeps the call at track or research-more."]
    notes: "Scenarios are qualitative because the assigned sources do not disclose current post-money valuation, net cash, revenue, net price, margins, fully diluted ownership or probability-of-success inputs."
    claimRefs: [CV002, CV003, CV012, CV013, CV014]
