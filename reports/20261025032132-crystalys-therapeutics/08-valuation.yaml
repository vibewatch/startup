callouts:
  - calloutType: recommendation
    title: Track, not a priced-in buy
    body: The evidence supports continued underwriting, not a buy recommendation, because the current entry price, dilution and risk-adjusted commercial economics are not public.
    claimRefs: [CV003, CV004, CV012, CV013]
  - calloutType: risk
    title: External precedent is not a valuation
    body: Arthrosi's $950M upfront and up to $550M contingent transaction shows strategic appetite for a validated gout asset, but it cannot substitute for Crystalys-specific clinical, rights, capitalization and price evidence.
    claimRefs: [CV006, CV007, CV008]
