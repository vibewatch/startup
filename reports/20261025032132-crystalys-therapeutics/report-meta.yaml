companyProfile:
  summary: >-
    Crystalys Therapeutics is a privately held San Diego clinical-stage biopharmaceutical company developing dotinurad,
    a once-daily oral selective URAT1 inhibitor for gout patients whose disease is not adequately controlled by existing
    therapy. The company is advancing Western Phase 3 programs while relying on public financing and milestone execution
    rather than disclosed product revenue.
