  topStrengths:
    - $130 million Series B financing supports a broad late-stage clinical and regulatory program.
    - Dotinurad offers a differentiated oral URAT1 mechanism with existing Asian approval context.
    - RUBY, TOPAZ, and AMETHYST create multiple clinical milestones before a potential Western launch.
  topRisks:
    - Pivotal efficacy, safety, recruitment, and regulatory outcomes remain unproven.
    - The company depends on a single identified lead asset and concentrated development milestones.
    - Series B terms, cash runway, pricing, access, manufacturing readiness, and launch costs are undisclosed.
  unresolvedGaps:
    - Series B price per share, liquidation stack, fully diluted capitalization, and investor protections.
    - Management's explicit FDA and EMA filing pathway and launch sequencing after pivotal readouts.
    - Net pricing, payer access, and required sales-force or partnering investment for U.S. commercialization.
    - Reconciled treated-patient data and clearer persistence, adherence, and real-world outcomes outside Asia.
