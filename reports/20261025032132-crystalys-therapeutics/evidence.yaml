evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Complete executive roster, board composition, voting rights, protective provisions, and succession
      responsibilities.
    whyItMatters: >-
      A single-asset clinical company depends heavily on leadership and investor governance during pivotal development
      and regulatory submission.
    diligencePath: >-
      Request the current board deck, cap table, charter, investor rights agreement, and management organization chart
      under NDA.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: capitalization
    missingEvidence: Series B price per share, post-money capitalization, liquidation stack, debt, cash balance, and current valuation.
    whyItMatters: Raised funding does not establish ownership economics, liquidity, or runway available to shareholders.
    diligencePath: Obtain the Series B term sheet, capitalization table, latest balance sheet, and cash runway model.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: operating-metrics
    missingEvidence: Current headcount, revenue or revenue run-rate, customers, commercial footprint, and launch spending plan.
    whyItMatters: >-
      These private-company metrics determine whether the business is still development-only and how much additional
      capital commercialization may require.
    diligencePath: Request current employee count, audited or management financials, commercial forecast, and launch-resource plan.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: stale
    severity: minor
    topic: regulatory-history
    missingEvidence: >-
      Current FDA and EMA filing pathway, endpoint alignment, and any updated regulatory feedback after the registry
      refresh.
    whyItMatters: Asian approvals and a registered Phase 3 study do not prove Western approval probability or label scope.
    diligencePath: Request the latest regulatory briefing documents, agency meeting minutes, and submission timetable.
    relatedQuestionRefs:
      - QO005
      - QO006
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A public or diligence-grade U.S./E.U. patient funnel for second-line eligible gout patients, including diagnosis,
      treatment failure, coverage, and persistence.
    whyItMatters: >-
      Global category revenue cannot establish Crystalys's serviceable market or revenue ceiling without a population
      and access bridge.
    diligencePath: >-
      Request management's country-by-country epidemiology, eligible-patient funnel, launch sequence, and sensitivity
      cases tied to pivotal data.
    relatedQuestionRefs:
      - QM005
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: payer-access
    missingEvidence: >-
      Net price, formulary assumptions, prior-authorization expectations, and required commercial headcount for U.S. and
      European launch.
    whyItMatters: >-
      Payer restrictions and launch investment determine whether a large clinical population becomes an economically
      attractive market.
    diligencePath: >-
      Obtain the access plan, price corridor, payer research, launch budget, and specialty-pharmacy assumptions from
      management.
    relatedQuestionRefs:
      - QM005
      - QM010
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: market-comparability
    missingEvidence: >-
      Publisher definitions, geographic coverage, product-class inclusion, and forecast methodology for the Grand View
      and Mordor estimates.
    whyItMatters: >-
      The estimates differ materially, and an unexamined denominator could create false precision in TAM-based
      valuation.
    diligencePath: >-
      Obtain the full methodology pages or analyst workbooks and reconcile category definitions before using a
      market-size multiple.
    relatedQuestionRefs:
      - QM004
      - QM005
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing-and-access
    missingEvidence: >-
      Comparable U.S. and European list price, expected net price, payer coverage, contracting assumptions, and
      treatment duration for dotinurad and incumbent therapies.
    whyItMatters: >-
      Clinical differentiation may not produce adoption or durable value if reimbursement and net economics are
      unfavorable against established oral therapies.
    diligencePath: >-
