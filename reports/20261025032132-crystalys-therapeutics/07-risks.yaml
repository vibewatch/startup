    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Enrollment or retention delay, medium, high, "Partial: two global Phase 3 studies are underway", High, "Actual enrollment by geography and screen-failure rate are not public."]
      - ["Clinical supply, manufacturing, or batch-quality failure", medium, critical, "Unclear: public pool does not identify manufacturing network or controls", High, "Provide CMC plan, qualified suppliers, release data, and stability package."]
      - ["Data integrity, protocol deviation, or safety-signal escalation", medium, critical, "Partial: randomized and double-blind design is disclosed", High, "Provide deviation counts, monitoring plan, DMC remit, and adjudication process."]
      - [Liquidity or commercialization spend overrun, medium, high, "Partial: $130M Series B announced for development and preparation", High, "Reconcile cash balance, burn, milestone budget, and launch investment case."]
    notes: "Likelihood, severity, and residual exposure are analyst assessments; the public sources do not disclose incident rates, quality metrics, cash balance, or burn."
    claimRefs: [CR006, CR007, CR008, CR009, CR010]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Lead asset rights and development execution, "Fuji Yakuhin / Crystalys program", "Single lead asset", "Rights, supply, or development dispute delays global filing or launch", critical, "Validate definitive rights, territory, supply, and change-of-control terms", High]
      - [Capital syndicate and follow-on financing, "Frazier Life Sciences and existing investors", "Concentrated private syndicate", "Clinical delay or down-round increases dilution and reduces launch capacity", high, "Obtain cap table, preferences, runway case, and financing triggers", High]
      - [Competitive URAT1 landscape, "Sobi / pozdeutinurad and other gout developers", "Several external programs", "Superior competitor data or launch timing compresses differentiation and price", high, "Run head-to-head evidence and access scenarios using comparable endpoints", High]
    notes: "Counterparties and competitor evidence are drawn from the cited company releases and independent reporting; concentration and residual exposure are not disclosed company metrics."
    claimRefs: [CR011, CR012, CR013, CR014, CR015]

figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Clinical and regulatory execution risks are both high-impact and difficult to clear before pivotal evidence and regulatory diligence mature.
    data:
      columns: [Likelihood, Impact, Mitigation maturity, Residual severity]
      rows:
        - label: Phase 3 endpoint or safety failure
          values: [Medium, Critical, Partial, High]
        - label: US/EU filing or approval delay
          values: [Medium, Critical, In progress, High]
        - label: Manufacturing or clinical-supply failure
          values: [Medium, Critical, Unclear, High]
        - label: Data integrity or protocol deviation
          values: [Medium, Critical, Partial, High]
        - label: Liquidity or launch-spend overrun
          values: [Medium, High, Partial, High]
        - label: Competitor evidence or timing advantage
          values: [Medium, High, Partial, High]
    approximationNotes: "Likelihood and residual severity are qualitative analyst assessments based on the cited public evidence; no numerical probability is implied."
    claimRefs: [CR001, CR006, CR009, CR010, CR014]

callouts:
  - calloutType: risk
    title: Single-asset clinical concentration
    body: "Crystalys has financing support for a late-stage program, but public evidence still centers on dotinurad and planned or ongoing studies; a material safety, efficacy, or regulatory setback would therefore have outsized company impact."
    claimRefs: [CR001, CR006, CR011]
  - calloutType: recommendation
    title: Track pending primary evidence
    body: "The appropriate risk posture is track until the company discloses pivotal results, regulatory interactions, cash and burn, CMC readiness, and enforceable development-rights details."
    claimRefs: [CR004, CR007, CR009, CR015]

