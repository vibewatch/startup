    claimRefs: [CI006, CI007, CI010, CI015]
  - id: TI003
    title: Unit economics and capital-adequacy gaps
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue, null, Low, Establishes whether any operating income exists, "Provide audited revenue and non-product income"]
      - [ARR, Not applicable or undisclosed, Low, ARR is not an appropriate proxy without recurring contracts, "Confirm whether any recurring contracted revenue exists"]
      - [Gross margin, null, Low, Determines product-level value capture, "Provide COGS, transfer price, royalties, and gross-to-net assumptions"]
      - [Cash on hand, null, Low, Funding raised does not equal current cash, "Provide latest cash balance and restricted-cash schedule"]
      - [Burn and dated runway, "Company says runway covers several milestones; no amount or date", Medium, Determines next-round timing, "Provide monthly burn, remaining trial commitments, and downside runway"]
      - [Trial cost per participant, null, Low, Links enrollment progress to remaining spend, "Provide CRO budgets and remaining costs for RUBY, TOPAZ, and AMETHYST"]
      - [Commercial acquisition cost and payback, null, Low, Tests whether direct launch is financeable, "Provide sales-force plan, channel costs, prescriber targeting, and payback model"]
      - [Debt and license obligations, null, Low, May create claims on future cash and revenue, "Provide debt schedule and all territorial license milestones and royalties"]
    notes: >-
      Values reflect only retained public evidence; null means unavailable rather than zero, and the
      runway statement is qualitative company guidance rather than a cash reconciliation.
    claimRefs: [CI003, CI004, CI005, CI007, CI008, CI009, CI010, CI016]
figures:
  - id: FI001
    title: Capital-to-gross-profit dependency chain
    type: flow
    summary: >-
      External capital funds clinical and launch work before regulatory, access, pricing, and
      product-cost inputs can convert activity into revenue and gross profit.
    data:
      nodes:
        - id: capital
          label: External capital
          detail: "$130M Series B is financing, not revenue or current cash."
        - id: trials
          label: Clinical execution
          detail: RUBY, TOPAZ, and AMETHYST consume capital before approval.
        - id: regulatory
          label: Regulatory outcome
          detail: U.S. and European commercialization remains contingent on approvals.
        - id: launch
          label: Commercial readiness
          detail: Sales-force, channel, manufacturing, and launch costs are undisclosed.
        - id: access
          label: Price and payer access
          detail: List price, rebates, coverage, and realized net price are unavailable.
        - id: sales
          label: Net product sales
          detail: Revenue depends on treated volume, persistence, and gross-to-net deductions.
        - id: profit
          label: Gross profit
          detail: Product cost, royalties, and gross margin are unavailable.
      edges:
        - from: capital
          to: trials
        - from: trials
          to: regulatory
        - from: regulatory
          to: launch
        - from: launch
          to: access
        - from: access
          to: sales
        - from: sales
          to: profit
    approximationNotes: >-
      This is a dependency sequence, not a forecast or value-proportional model; undisclosed inputs
      are shown as gaps rather than estimated amounts.
    claimRefs: [CI002, CI005, CI006, CI007, CI009, CI010, CI016]
