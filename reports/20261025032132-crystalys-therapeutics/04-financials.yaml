company:
  name: Crystalys Therapeutics
chapter:
  number: 4
  title: Financials
  summary: >-
    Crystalys has financed a registration-stage program with a $130 million Series B after a
    $205 million Series A, but the public record does not disclose cash, burn, revenue, pricing,
    gross margin, or license obligations. The financial case therefore rests on clinical
    milestones and future commercialization economics rather than demonstrated revenue quality
    or unit economics.
sections:
  - id: capital-adequacy
    title: Capital adequacy is milestone-based, not cash-flow-based
    body: >-
      Crystalys announced a $130 million Series B less than a year after its $205 million Series A.
      The latest proceeds are designated for the RUBY and TOPAZ Phase 3 trials, the AMETHYST Phase
      2 study, and commercial-readiness work. Management says the financing extends runway through
      several expected clinical and regulatory milestones, which reduces immediate financing
      pressure but does not establish a dated runway. None of the retained sources discloses cash
      on hand, burn, debt, or a quantified runway endpoint. Funding raised must therefore not be
      treated as cash available: underwriting still requires a current balance sheet, monthly
      operating burn, committed trial spend, and the financing trigger around pivotal readouts.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI003]
  - id: revenue-and-pricing
    title: Revenue remains contingent on approval, access, and commercial structure
    body: >-
      The public evidence supports a prospective biopharmaceutical product-sales model, not a
      current revenue stream. Dotinurad is being developed for U.S. and European commercialization,
      while an independent report says Crystalys acquired those territorial rights in 2024. No
      retained source identifies revenue, ARR, list price, expected net price, rebate burden, payer
      coverage, or partnership economics. Direct commercialization and a licensing or
      co-commercialization transaction are plausible routes, but neither is disclosed as the
      selected model. Financing proceeds are balance-sheet capital rather than revenue and should
      remain outside any revenue bridge. Until price and access assumptions are documented,
      revenue quality and gross-profit potential cannot be underwritten.
    claimRefs: [CI006, CI007, CI010]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: cost-and-unit-economics
    title: Trial execution and launch preparation dominate the visible cost base
    body: >-
      The visible operating model is capital intensive: RUBY plans about 500 participants treated
      for up to 64 weeks, TOPAZ about 250 participants for up to 76 weeks, and commercial-readiness
      spending is occurring before any disclosed U.S. or European product revenue. Public sources
      do not provide trial cost per participant, manufacturing cost, gross margin, sales-force
      size, channel fees, customer-acquisition cost, sales cycle, or payback. Those omissions make a
      conventional unit-economics calculation premature. A useful operating model must separate
      remaining clinical spend, regulatory and manufacturing readiness, pre-launch commercial
      investment, and post-approval variable economics rather than forcing software metrics onto a
      single-asset clinical-stage company.
    claimRefs: [CI005, CI008, CI009]
  - id: financial-verdict
    title: Financing strength does not remove commercialization risk
    body: >-
      The financing syndicate and stated milestone coverage are strengths, but they do not prove
      product-market economics. The closest adverse commercial precedent in the retained evidence
      is lesinurad: RheumNow reported only about $1.1 million of 2018 sales, a license termination
      expected to save $75 million to $100 million in 2019, and substantial prior license
      consideration. BioPharma Dive also linked the product's withdrawal to kidney-damage concerns
      and low sales. That history does not determine dotinurad's outcome, but it shows that approval
      and mechanism validation alone do not guarantee adoption. The financial verdict is therefore
      cautious: near-term development financing appears strengthened, while pricing, access,
      commercialization cost, license obligations, and post-readout capital needs remain material
      diligence blockers.
    claimRefs: [CI011, CI012, CI013, CI014, CI015, CI016]
callouts:
  - calloutType: risk
    title: Capital raised is not runway
    body: >-
      The $130 million financing is a gross funding event. Without current cash, burn, committed
      trial spend, debt, and license-payment schedules, it cannot be converted into a reliable
      runway estimate.
    claimRefs: [CI001, CI003, CI004]
