callouts:
  - calloutType: insight
    title: Clinical proof and commercial proof are separate
    body: >-
      Direct efficacy evidence and Asian approvals reduce scientific
      uncertainty, but they do not establish a Western price, formulary
      position, sales model, or durable switching behavior.
    claimRefs: [CP004, CP012, CP014, CP015]
  - calloutType: risk
    title: Lesinurad is the relevant adverse analogue
    body: >-
      Its discontinuation shows that a URAT1 rationale can remain commercially
      fragile when renal monitoring, add-on use, cost, and weak demand burden
      adoption.
    claimRefs: [CP008, CP009, CP010, CP011]
