  evidenceGaps:
    - type: missing-source
      severity: material
      topic: Western-efficacy
      missingEvidence: Posted RUBY, TOPAZ, and AMETHYST results with denominators, effect sizes, confidence intervals, and adverse-event tables.
      whyItMatters: The product thesis depends on translating prior Asian experience into controlled US and European efficacy and safety evidence.
      diligencePath: Obtain the complete statistical analysis plans, interim disclosures, topline datasets, and final clinical study reports for each Western trial.
      relatedQuestionRefs: [QE004, QE007]
    - type: missing-source
      severity: material
      topic: manufacturing
      missingEvidence: Western CMC, formulation, batch-release, stability, and commercial supply qualification documents for the oral product.
      whyItMatters: Clinical proof alone does not establish that the product can be consistently manufactured and supplied at launch scale.
      diligencePath: Review the CMC package, qualified manufacturers, inspection history, release specifications, and supply-risk register under NDA.
      relatedQuestionRefs: [QE006, QE008]
    - type: private-evidence-only
      severity: material
