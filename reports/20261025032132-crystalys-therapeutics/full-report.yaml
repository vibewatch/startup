  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Clinical and regulatory execution
        blocks:
          - type: paragraph
            body: >-
              Crystalys is advancing dotinurad through registration-directed Phase 3 studies, but the public evidence
              describes planned study designs rather than completed pivotal outcomes. The RUBY and TOPAZ programs are
              randomized and double-blind, with active allopurinol comparison, and the TOPAZ registry specifies a long
              treatment and follow-up window. That design can generate clinically relevant evidence, but it also creates
              execution exposure around recruitment, retention, endpoint completion, safety monitoring, and protocol
              adherence. The registry itself cautions that the study sponsor or investigator is responsible for the
              safety, science, and accuracy of submitted information, while the government site does not independently
              review the safety and science of every listed study. No public source in this pool establishes a completed
              U.S. or European regulatory filing, approval, or pivotal readout. The near-term kill criteria are a
              material safety signal, a failure to meet the prespecified serum-uric-acid or tophus endpoints, or a
              regulatory request that materially expands the development package.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR006
              - CR009
              - CR010
              - CR014
      - number: '7.2'
        title: Operating, quality, and financial controls
        blocks:
          - type: paragraph
            body: >-
              The Series B release says proceeds are expected to provide operational runway through multiple clinical
              and regulatory milestones, but it does not disclose cash on hand, quarterly burn, runway duration,
              manufacturing cost, or the amount reserved for commercialization. That distinction matters: funding raised
              is not equivalent to cash available, and management's expected runway is not an audited liquidity measure.
              The company is still a clinical-stage biopharmaceutical developer, so manufacturing scale-up, clinical
              supply, quality systems, data integrity, and vendor oversight can become binding constraints before
              approval. Public materials also do not identify a validated commercial manufacturing network, inspection
              history, product-recall history, cybersecurity controls, or incident response record. The appropriate
              monitoring set is monthly cash runway, enrollment and data-cleaning variance, critical deviations, batch
              release and stability results, vendor concentration, and any regulator-requested remediation. Absence of a
              recorded incident is not evidence that no incident occurred.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.3'
        title: Partner, market, and thesis-break exposure
        blocks:
          - type: paragraph
            body: >-
              Crystalys depends on one lead asset, a concentrated investor syndicate, external clinical sites and
              vendors, and a regulatory pathway that remains unfinished in the U.S. and Europe. The company states that
              dotinurad was invented by Fuji Yakuhin and is approved in several Asian markets, while the global program
              is intended to address patients who do not respond adequately to first-line treatment. That history is
              useful context but does not remove transferability, labeling, pricing, or adoption risk in new
              geographies. A separate PharmExec article describes a $1.5 billion acquisition of another URAT1 program
              whose pivotal data were expected in 2026; Sobi's later release reported positive topline results for that
              competitor. This is not a direct Crystalys failure, but it shows that a better-funded or more advanced
              competitor can reset evidence, timing, and commercial expectations. Thesis-break indicators are loss of a
              material development or commercialization right, a financing that materially dilutes existing holders,
              failure to secure a credible launch partner, or competitor data that makes dotinurad's differentiation
              economically insufficient.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The public record is sufficient to rank risks, not to close them. Before assigning a stronger investment
              view, diligence should obtain the current cash balance and monthly burn, the full cap table and any
              liquidation or royalty obligations, the clinical statistical analysis plans and independent safety
              oversight, the regulatory meeting history, manufacturing and quality agreements, and the rights and
              change-of-control provisions governing dotinurad. Management should also provide sensitivity cases for
              enrollment delay, a failed endpoint, a required additional trial, launch-price pressure, and a competitor
              achieving superior persistence or tolerability. These requests are measurable: each should produce a
              document, dated milestone, threshold, or named counterparty rather than a general assurance. Until those
              artifacts are available, residual exposure is high even though the financing reduces near-term funding
              risk.
            claimRefs:
              - CR006
              - CR007
              - CR009
              - CR010
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Single-asset clinical concentration
            body: >-
              Crystalys has financing support for a late-stage program, but public evidence still centers on dotinurad
              and planned or ongoing studies; a material safety, efficacy, or regulatory setback would therefore have
              outsized company impact.
            calloutType: risk
            claimRefs:
              - CR001
              - CR006
              - CR011
          - type: callout
            title: Track pending primary evidence
            body: >-
              The appropriate risk posture is track until the company discloses pivotal results, regulatory
              interactions, cash and burn, CMC readiness, and enforceable development-rights details.
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR007
              - CR009
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Crystalys merits a track recommendation with medium confidence and a high risk rating. The company closed
              an oversubscribed $130 million Series B in July 2026 to support Phase 3 development and commercialization
              preparation, and its program includes RUBY, TOPAZ, and AMETHYST. Those are meaningful financing and
              execution signals, but they are company-issued evidence rather than proof of clinical success or investor
              returns. The public record identifies an $800 million Series A valuation in September 2025 and $335
              million raised across two rounds, while the Series B valuation is not disclosed. EquityZen explicitly says
              current valuation and share information may not be available for all companies, and its page does not
              provide a price. Entry should therefore be disciplined around a verified capitalization table, liquidation
              preferences, fully diluted ownership, cash runway, and clinical probability of success rather than the
              amount raised alone. A buy call would require evidence that the entry price leaves adequate upside after
              dilution and launch investment.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
      - number: '8.2'
        title: Investment thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that a once-daily oral URAT1 inhibitor with Asian approvals and a broad late-stage program
              could create strategic value in a large, under-served gout segment. Independent reporting on Arthrosi
              shows that a separate late-stage URAT1 asset attracted a $950 million upfront payment plus up to $550
              million of contingent consideration, demonstrating that strategic buyers can pay substantial amounts for
              validated gout assets. The anti-thesis is that Crystalys remains pre-revenue and exposed to pivotal-study,
              regulatory, manufacturing, reimbursement, and commercial execution risk; the Arthrosi transaction is an
              external benchmark, not a Crystalys valuation. Competitive context is also mixed: Drugs.com reports a
              complete response letter for Sobi's NASP tied mainly to manufacturing control and facility deficiencies,
              while Crystalys's public evidence does not establish its own manufacturing readiness. The relevant
              diligence question is not whether a gout market exists, but whether dotinurad can reproduce the required
              efficacy, safety, access, and launch economics in the U.S. and Europe at a price that supports the current
              private-market entry. Fierce Biotech also notes that the previously approved URAT1 inhibitor Zurampic had
              landed on the scrap heap by 2020, while a current pipeline snapshot lists only dotinurad for Crystalys.
              These signals reinforce single-asset and class-commercialization risk without proving that dotinurad will
              share the same outcome.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should remain directional because no current post-money valuation, net cash balance,
              revenue, net price, gross margin, or fully diluted share count is public in the assigned evidence. The
              bull case requires clean RUBY and TOPAZ results, a credible regulatory path, acceptable safety and
              manufacturing execution, and a strategic or public-market exit that values the asset on clinical proof
              rather than financing momentum. The base case is continued private financing or a partnership while the
              company resolves regulatory and commercial questions, with dilution and timing risk keeping the
              recommendation at track. The bear case is a pivotal readout, manufacturing, safety, reimbursement, or
              commercialization setback that forces a down-round or materially reduces strategic value. Exit readiness
              is therefore milestone-dependent, not demonstrated by the Series B. Before underwriting, request the
              signed Series B terms, post-money capitalization, liquidation stack and participating preferences; cash
              balance and monthly burn; clinical statistical analysis plans and topline timing; manufacturing and
              regulatory workplan; U.S./European pricing and access assumptions; and scenario-based launch spending.
              Treat the $800 million Series A valuation as a dated reference point, not a current mark.
            claimRefs:
              - CV002
              - CV003
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, not a priced-in buy
            body: >-
              The evidence supports continued underwriting, not a buy recommendation, because the current entry price,
              dilution and risk-adjusted commercial economics are not public.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV012
              - CV013
          - type: callout
            title: External precedent is not a valuation
            body: >-
              Arthrosi's $950M upfront and up to $550M contingent transaction shows strategic appetite for a validated
              gout asset, but it cannot substitute for Crystalys-specific clinical, rights, capitalization and price
              evidence.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV008
