        title: Capital adequacy is milestone-based, not cash-flow-based
        blocks:
          - type: paragraph
            body: >-
              Crystalys announced a $130 million Series B less than a year after its $205 million Series A. The latest
              proceeds are designated for the RUBY and TOPAZ Phase 3 trials, the AMETHYST Phase 2 study, and
              commercial-readiness work. Management says the financing extends runway through several expected clinical
