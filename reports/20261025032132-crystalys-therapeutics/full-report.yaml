  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and unmet need
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not all arthritis spending. It is the addressable pharmacologic management of gout,
              with emphasis on chronic urate-lowering therapy for adults whose disease is inadequately controlled or who
              cannot use first-line options. JAMA's patient information estimates 9.2 million U.S. adults with gout,
              while the clinical sources distinguish acute-flare treatment from long-term urate lowering. Crystalys's
              own financing communication positions dotinurad as a once-daily oral URAT1 inhibitor and a second-line
              option, so acute NSAID/colchicine use, lifestyle management, and last-line injectable uricase are adjacent
              or substitute pools rather than automatically captured revenue. The commercial boundary therefore includes
              oral urate-lowering therapy and specialist-managed refractory disease, but excludes the full prevalence
              population until diagnosis, treatment eligibility, access, and persistence are demonstrated.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
              - CM013
      - number: '2.2'
        title: Sizing lenses and comparability
        blocks:
          - type: paragraph
            body: >-
              Public market-research estimates indicate a multi-billion-dollar global gout-therapeutics category, but
              they are not a Crystalys SAM or SOM. Grand View reports $2.8 billion in 2024, $3.2 billion in 2026, and
              $4.1 billion in 2030 at a 6.5% 2025–2030 CAGR. Mordor reports $4.24 billion in 2025, $4.52 billion in
              2026, and $6.67 billion in 2031 at an 8.11% 2026–2031 CAGR. The different baselines and forecasts show why
              the estimates should be presented as separate lenses, not averaged or added. Neither source isolates
              U.S./E.U. second-line URAT1 use, net price, reimbursement, or Crystalys share. A disciplined underwriting
              case should bridge from treated, eligible patients and payer coverage to net revenue, rather than applying
              a venture-style share to an undifferentiated global category.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
      - number: '2.3'
        title: Buyer, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Adoption has a clinical gate before it becomes a commercial one. The American College of Rheumatology
              guidance covers indications for pharmacologic urate-lowering therapy, choice of initial therapy, and
              switching strategy, while bpac's 2025 practice points say initiation is often delayed and many treated
              patients remain above recommended serum urate levels. The prescriber is typically a primary-care clinician
              or rheumatologist; the patient is the user; and the payer or pharmacy benefit manager controls coverage,
              prior authorization, and net price. For a second-line oral product, triggers include inadequate control,
              intolerance, contraindication, or failure of first-line therapy. This makes guideline placement, evidence
              of serum-urate control, tolerability, persistence, and formulary access more important than prevalence
              alone. Crystalys has not publicly supplied enough U.S./E.U. pricing or access detail to quantify the
              serviceable market.
            claimRefs:
              - CM010
              - CM011
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM013
      - number: '2.4'
        title: Growth drivers, constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The demand case is supported by disease burden and an execution gap: JAMA describes recurrent flares and
              chronic joint damage, while the MEPS-based adherence study found 27.4% of weighted person-years had no
              allopurinol fills, 37.4% had low adherence, and only 35.2% had high adherence. That creates room for
              differentiated efficacy, safety, and persistence, but it does not prove willingness to pay or clinical
              superiority. The same study found lower odds of high adherence among Black patients and patients in the
              U.S. South, highlighting heterogeneous implementation needs. Constraints include generic first-line
              competition, delayed treatment, payer controls, and the absence in the assigned evidence of a public
              Crystalys net-price, launch-cost, or U.S./E.U. eligible-patient model. Phase 3 progress and
              commercialization preparation are company-reported milestones, not approval or adoption evidence.
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM018
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The opportunity is clinically credible but commercially unbridged
            body: >-
              Gout burden and treatment gaps support a real market, yet the assigned evidence cannot convert global
              category estimates into Crystalys's U.S./E.U. second-line revenue opportunity. The next valuation-relevant
              proof points are pivotal readouts, regulatory path, payer positioning, net price, and persistence in the
              intended population.
            calloutType: insight
            claimRefs:
              - CM004
              - CM009
              - CM013
              - CM018
          - type: callout
            title: Market estimates are scope-sensitive
            body: >-
              Grand View and Mordor publish materially different category estimates and forecast horizons. Treating
              either as a directly addressable market would overstate precision because geography, product classes,
              pricing, and patient eligibility are not reconciled.
            calloutType: risk
            claimRefs:
              - CM009
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Crystalys is not competing only with another late-stage molecule. The buyer's alternatives include
              continuing allopurinol, switching to febuxostat, using an add-on uricosuric model exemplified historically
              by lesinurad, escalating to uricase therapy, or tolerating incompletely controlled disease. Crystalys says
              RUBY and TOPAZ compare dotinurad with physician-determined stable-dose allopurinol in approximately 500
              and 250 patients, respectively, which makes the incumbent treatment pathway the pivotal commercial
              reference rather than an abstract drug-class peer. Asian dotinurad is also a useful adjacent comparator
              because it is the same active ingredient in marketed territories, while lesinurad is a discontinued
              direct-mechanism precedent. The assigned pool does not identify a current non-dotinurad late-stage
              entrant, so the live pipeline remains a material diligence gap rather than evidence of an empty field.
            claimRefs:
              - CP003
              - CP008
              - CP010
              - CP012
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP010
              - CP012
              - CP013
              - CP016
      - number: '3.2'
        title: Clinical differentiation and trust
        blocks:
          - type: paragraph
            body: >-
              The strongest comparative evidence favors dotinurad on serum-urate response, but it does not settle
              Western commercial superiority. A 451-patient randomized Chinese Phase 3 study reported a 73.6% week-24
              response rate for dotinurad 4 mg/day versus 38.1% for febuxostat 40 mg/day; at week 12, dotinurad 2 mg/day
              was noninferior to febuxostat 40 mg/day. A separate 37-patient Japanese switch study reported that 26
              patients reached the serum-urate target after moving from febuxostat to dotinurad. That study was
              single-center, single-arm, open-label and manufacturer-funded, so it supports mechanism and hypothesis
              formation more than broad comparative proof. Lesinurad's label reinforces the trust hurdle for
              uricosurics: add-on use and renal monitoring can materially affect prescribing workflow even when urate
              lowering is demonstrated.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP010
              - CP012
              - CP014
              - CP016
      - number: '3.3'
        title: Distribution, pricing, and switching power
        blocks:
          - type: paragraph
            body: >-
              Crystalys has substantial disclosed financing for late-stage development, but funding raised is not
              commercial scale or payer access. The company announced a $205 million Series A and a $130 million Series
              B; neither release discloses U.S. or European list price, expected net price, formulary position,
              contracting terms, or sales-force capacity. Territory evidence is fragmented: Eisai reported Chinese
              approval in 2024 and a Japanese launch by Fuji Yakuhin in 2020, while Crystalys is advancing the Western
              registration program. This partner-enabled Asian precedent may reduce development uncertainty, but it does
              not establish Crystalys's channel power. Lesinurad is the adverse commercial analogue: independent
              coverage says sales ended in 2019, and Fierce Pharma reported that test markets did not meet expectations.
              Generic incumbency and physician familiarity therefore create switching friction that efficacy alone may
              not overcome.
            claimRefs:
              - CP001
              - CP002
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP015
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Crystalys's defensibility is presently an execution moat around an existing molecule: Western trial
              design, regulatory translation, capital, and eventual access. The comparative Chinese data and reported
              Asian exposure are useful proof points, but regional approvals and a company-claimed treated-patient count
              are not substitutes for U.S. or European pivotal outcomes, label scope, pharmacovigilance, reimbursement,
              or realized persistence. The prior lesinurad franchise shows that a mechanistically relevant product can
              lose commercial support when safety warnings, combination requirements, cost, and weak demand burden the
              proposition. Crystalys can create a durable second-line position if pivotal efficacy translates into a
              differentiated label and workable access; the assigned evidence cannot yet test that condition. It also
              cannot rule out displacement by unobserved entrants, improved incumbent management, or an internal payer
              preference for cheaper established therapies.
            claimRefs:
              - CP004
              - CP006
              - CP009
              - CP010
              - CP011
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Clinical proof and commercial proof are separate
            body: >-
              Direct efficacy evidence and Asian approvals reduce scientific uncertainty, but they do not establish a
              Western price, formulary position, sales model, or durable switching behavior.
            calloutType: insight
            claimRefs:
              - CP004
              - CP012
              - CP014
              - CP015
          - type: callout
            title: Lesinurad is the relevant adverse analogue
            body: >-
              Its discontinuation shows that a URAT1 rationale can remain commercially fragile when renal monitoring,
              add-on use, cost, and weak demand burden adoption.
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
