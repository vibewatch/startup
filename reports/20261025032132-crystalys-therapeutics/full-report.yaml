chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and development position
        blocks:
          - type: paragraph
            body: >-
              Crystalys Therapeutics is a privately held, San Diego-headquartered clinical-stage biopharmaceutical
              company focused on gout. Its lead and only publicly identified clinical asset is dotinurad, a once-daily
              oral selective URAT1 inhibitor intended to lower serum uric acid for patients whose disease is not
              adequately controlled by existing therapy. The company is not yet a commercial operating business: its
              disclosed activity centers on global clinical development and preparation for a potential launch.
              Dotinurad was invented by Fuji Yakuhin and has approvals in multiple Asian markets, while Crystalys is
              pursuing U.S. and European development. The registry record for RUBY describes a randomized, double-blind
              Phase 3 comparison with allopurinol, with an estimated enrollment of 500 and estimated completion in
              November 2027. This creates a credible late-stage asset foundation, but it does not establish Western
              approval, revenue, or launch economics.
