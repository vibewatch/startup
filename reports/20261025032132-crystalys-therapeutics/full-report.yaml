      - number: '1.4'
        title: Milestones and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The company’s milestone path is concentrated: preserve the existing Asian approval base, complete RUBY and
              TOPAZ, generate supporting AMETHYST data, and translate that package into U.S. and European regulatory
              submissions and commercialization. RUBY began on August 1, 2025 and its registry record lists primary
              completion on November 29, 2027; the company’s first-patient announcement describes approximately 500 RUBY
              participants and approximately 250 TOPAZ participants. The central upside case is a positive,
              differentiated Western label for a selective oral URAT1 inhibitor. The central downside is also
              concentrated: failure, delay, or endpoint/regulatory mismatch in either pivotal program would affect the
              only identified asset. Independent coverage additionally records prior safety concerns around Mackay’s
              earlier inflammatory-disease company, which is relevant context but not evidence of a Crystalys incident.
