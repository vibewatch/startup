        title: Exhibits
        blocks:
          - type: callout
            title: Capital raised is not runway
            body: >-
              The $130 million financing is a gross funding event. Without current cash, burn, committed trial spend,
              debt, and license-payment schedules, it cannot be converted into a reliable runway estimate.
            calloutType: risk
            claimRefs:
              - CI001
              - CI003
              - CI004
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and clinical mechanism
        blocks:
          - type: paragraph
            body: >-
              Crystalys's lead product is dotinurad, a once-daily oral small molecule that selectively inhibits the
              renal urate transporter URAT1. The company's description says URAT1 is a major transporter involved in
              renal uric-acid reabsorption and that selective inhibition is intended to increase uric-acid excretion
              rather than reduce production. That places the product in a second-line workflow: patients first receive
              xanthine oxidase inhibitors, while dotinurad is intended for patients who remain uncontrolled or cannot
              tolerate those therapies. The mechanism is clinically differentiated from allopurinol's
              production-blocking approach, but the evidence remains disease-proximal: serum uric acid is the principal
              measured endpoint in the registered Phase 2 study, while flare, tophus, renal, and other outcomes remain
              additional questions. A 2025 retrospective Japanese study supplies external mechanistic support, reporting
              that dotinurad increased urine uric acid and reduced serum uric acid, but it was not a randomized
              Crystalys development study.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
      - number: '5.2'
        title: Development, deployment, and maturity
        blocks:
          - type: paragraph
            body: >-
              Product maturity is best described as late clinical development rather than commercial readiness in the US
              or Europe. The company reports 22 completed clinical studies involving more than 1,300 participants and
              approval in Japan, China, the Philippines, Taiwan, and Thailand, while explicitly stating that dotinurad
              is not approved in North America or Europe. The public Western program has three complementary trials.
              RUBY is a Phase 3 study in about 500 adults with gout-associated hyperuricemia, TOPAZ is a Phase 3 study
              in about 250 adults with tophaceous gout, and AMETHYST is a Phase 2 placebo-controlled study in an
              estimated 90 XOI-intolerant or uricase-failure participants. The registry lists AMETHYST as recruiting,
              with an estimated July 2027 primary completion and no posted results. That trial architecture is a
              meaningful deployment signal because the program uses randomized, blinded, multicenter designs and an
              active comparator in the pivotal studies, but it does not establish regulatory approval, manufacturing
              scale, launch operations, or post-approval reliability.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE006
              - CE008
              - CE009
              - CE010
      - number: '5.3'
        title: Differentiation and unresolved controls
        blocks:
          - type: paragraph
            body: >-
              The strongest differentiation is the combination of a selective URAT1 mechanism, prior multi-country use,
              and a targeted position between first-line xanthine oxidase inhibitors and last-line uricase therapy.
              External coverage also describes Crystalys's plan to collect longer-term safety and durability data
              through open-label extensions after RUBY and TOPAZ. However, the core competitive assertions remain
              company- or management-sourced: claims of best-in-class safety, lower dose requirements, and absence of
              renal toxicity are not equivalent to comparative clinical proof. A published competitor report illustrates
              the standard the program must meet: another URAT1 inhibitor had reported month-six serum-uric-acid results
              in a large placebo-controlled Phase 3 trial, whereas Crystalys has not yet posted Western efficacy
              results. The assigned evidence contains no public software stack, API, manufacturing validation package,
              security documentation, or incident history. For this regulated small-molecule product, the closest
              practitioner-community proxy is a public pipeline database, not a developer community; that proxy confirms
              a Phase 3 dotinurad program but cannot validate source code, CMC controls, cybersecurity, or commercial
              supply.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE010
              - CE014
      - number: '5.4'
        title: Product diligence verdict
        blocks:
          - type: paragraph
            body: >-
              Crystalys has a coherent product-to-clinic chain: oral dosing, a defined renal transporter mechanism, an
              existing Asian clinical and regulatory record, and Western trials that test both common gout-associated
              hyperuricemia and harder-to-treat tophaceous or treatment-intolerant populations. The technical investment
              case therefore depends on translation and execution rather than on discovering what the product is. The
              next diligence package should verify the full Asian safety database, dose-selection rationale, renal and
              cardiovascular monitoring, protocol amendments, endpoint adjudication, trial enrollment and retention,
              comparator assumptions, manufacturing and supply qualification, and the evidence supporting any claim
              about flares or tophi. Until results are posted, regulatory status and operational controls should be
              treated as conditional milestones rather than product attributes.
            claimRefs:
              - CE006
              - CE008
              - CE009
              - CE011
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Coherent clinical product thesis
            body: >-
              Dotinurad has a defined renal mechanism, existing Asian use, and a Western program that tests both
              standard-care comparison and difficult-to-treat populations.
            calloutType: strength
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE008
          - type: callout
            title: Translation remains the gating risk
            body: >-
              Asian approvals and mechanistic rationale reduce product-definition risk, but they do not establish
              Western efficacy, long-term clinical benefit, manufacturing readiness, or regulatory approval.
            calloutType: risk
            claimRefs:
              - CE005
              - CE009
