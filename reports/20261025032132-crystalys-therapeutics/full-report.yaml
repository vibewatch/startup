        title: Revenue remains contingent on approval, access, and commercial structure
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a prospective biopharmaceutical product-sales model, not a current revenue
              stream. Dotinurad is being developed for U.S. and European commercialization, while an independent report
              says Crystalys acquired those territorial rights in 2024. No retained source identifies revenue, ARR, list
              price, expected net price, rebate burden, payer coverage, or partnership economics. Direct
              commercialization and a licensing or co-commercialization transaction are plausible routes, but neither is
              disclosed as the selected model. Financing proceeds are balance-sheet capital rather than revenue and
              should remain outside any revenue bridge. Until price and access assumptions are documented, revenue
              quality and gross-profit potential cannot be underwritten.
            claimRefs:
