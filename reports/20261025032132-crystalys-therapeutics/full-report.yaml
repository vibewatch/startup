              The financing announcement says proceeds are expected to provide runway through multiple clinical and
              regulatory milestones, while independent coverage says management expected runway at least one year beyond
              Phase 3 readouts. Revenue, ARR, customers, headcount, and current valuation are not established by
              sufficiently reliable public evidence in this pool and should remain explicit gaps.
