      - number: '4.3'
        title: Trial execution and launch preparation dominate the visible cost base
        blocks:
          - type: paragraph
            body: >-
              The visible operating model is capital intensive: RUBY plans about 500 participants treated for up to 64
              weeks, TOPAZ about 250 participants for up to 76 weeks, and commercial-readiness spending is occurring
              before any disclosed U.S. or European product revenue. Public sources do not provide trial cost per
              participant, manufacturing cost, gross margin, sales-force size, channel fees, customer-acquisition cost,
              sales cycle, or payback. Those omissions make a conventional unit-economics calculation premature. A
              useful operating model must separate remaining clinical spend, regulatory and manufacturing readiness,
              pre-launch commercial investment, and post-approval variable economics rather than forcing software
              metrics onto a single-asset clinical-stage company.
            claimRefs:
              - CI005
              - CI008
              - CI009
      - number: '4.4'
        title: Financing strength does not remove commercialization risk
        blocks:
          - type: paragraph
            body: >-
              The financing syndicate and stated milestone coverage are strengths, but they do not prove product-market
              economics. The closest adverse commercial precedent in the retained evidence is lesinurad: RheumNow
              reported only about $1.1 million of 2018 sales, a license termination expected to save $75 million to $100
              million in 2019, and substantial prior license consideration. BioPharma Dive also linked the product's
              withdrawal to kidney-damage concerns and low sales. That history does not determine dotinurad's outcome,
              but it shows that approval and mechanism validation alone do not guarantee adoption. The financial verdict
              is therefore cautious: near-term development financing appears strengthened, while pricing, access,
              commercialization cost, license obligations, and post-readout capital needs remain material diligence
              blockers.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
