      - number: '1.3'
        title: Capitalization, scale, and disclosed operating metrics
        blocks:
          - type: paragraph
            body: >-
              Crystalys announced an oversubscribed $130 million Series B in July 2026, led by Frazier Life Sciences
              with participation from new and existing investors. Multiples.vc reports a $205 million Series A in
              September 2025 and a reported $800 million post-money valuation for that round; the company-issued
              financing announcement confirms the Series B amount but does not disclose price per share, post-money
              valuation, liquidation preferences, debt, or cash balance. The two disclosed rounds imply $335 million
