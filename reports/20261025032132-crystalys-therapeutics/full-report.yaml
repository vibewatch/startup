  - id: FE001
    title: Dotinurad product architecture map
    type: stack
    summary: >-
      Dotinurad's public product architecture runs from selective renal mechanism through clinical validation and
      regulatory translation.
    data:
      layers:
        - label: Mechanism
          detail: Selective renal transport inhibition is the product's mechanistic layer.
          items:
            - label: Selective URAT1 inhibition
              detail: Reduces renal uric-acid reabsorption.
            - label: Oral once-daily dosing
              detail: Patient-facing administration described by Crystalys.
        - label: Clinical program
          detail: Randomized Western trials test efficacy and safety in defined gout populations.
          items:
            - label: AMETHYST
              detail: Phase 2 placebo-controlled study in XOI-intolerant or uricase-failure participants.
            - label: RUBY
              detail: Phase 3 comparison with allopurinol in gout-associated hyperuricemia.
            - label: TOPAZ
              detail: Phase 3 comparison with allopurinol in tophaceous gout.
        - label: Translation
          detail: Asian approvals support development while US and European approval remains pending.
          items:
            - label: Asian approvals
              detail: Reported approvals in Japan, China, the Philippines, Taiwan, and Thailand.
            - label: Western submissions
              detail: Future US and European submissions depend on current trials and supporting evidence.
        - label: Safety evidence
          detail: Clinical safety and tolerability are measured alongside efficacy in the trials.
        - label: Durability
          detail: Planned open-label extensions are intended to add longer-term safety and durability data.
        - label: Operating controls
          detail: Manufacturing, security, quality, and incident controls are not publicly disclosed in the assigned evidence.
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
  - id: FU001
    title: Customer journey from unmet need to commercial proof
    type: journey-map
    summary: >-
      The evidence-supported path runs from refractory disease burden through clinical validation to an unproven
      reimbursed treatment relationship.
    data:
      nodes:
        - id: need
          label: Refractory disease burden
          title: Persistent hyperuricemia
          description: U.S. real-world cohort shows unresolved serum-urate control and high healthcare utilization.
          touchpoints:
            - Flares and tophi
            - Medication burden
            - Hospital, emergency, and outpatient use
        - id: segment
          label: Defined target segment
          title: XOI-intolerant or uricase-failure patients
          description: AMETHYST eligibility defines a clinically specific second-line population.
          touchpoints:
            - Specialist identification
            - Eligibility screening
            - Payer coverage unknown
        - id: trial
          label: Clinical trial access
          title: AMETHYST, RUBY, and TOPAZ
          description: Recruiting or dosed studies generate controlled evidence rather than commercial use.
          touchpoints:
            - Enrollment
            - Comparator or placebo
            - Safety monitoring
        - id: outcome
          label: Clinical validation
          title: Serum urate and safety endpoints
          description: No outcome results were available in the assigned sources.
          touchpoints:
            - sUA target
            - Adverse events
            - Durability
        - id: access
          label: Reimbursement and prescribing
          title: Commercial access
          description: Pricing, formulary position, prescriber adoption, and channel are undisclosed.
          touchpoints:
            - Payer review
            - Physician choice
            - Patient persistence
        - id: expansion
          label: Durable adoption
          title: Repeat use and expansion
          description: No public evidence establishes prescriptions, renewals, revenue, or concentration.
          touchpoints:
            - Refills
            - Long-term safety
            - Net retention
    approximationNotes: This is an evidence-status journey, not a measured conversion funnel; no conversion rate is inferred.
