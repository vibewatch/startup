company:
  name: Crystalys Therapeutics
chapter:
  number: 1
  title: Company Overview
  summary: Crystalys Therapeutics is a San Diego clinical-stage biotech built around dotinurad, a once-daily oral URAT1 inhibitor being advanced through Western Phase 3 trials for gout. The company has disclosed $335 million of financing across its Series A and Series B, but private-company governance, operating scale, and definitive valuation remain incompletely disclosed.
sections:
  - id: identity-and-business
    title: Identity, product, and development position
    body: >-
      Crystalys Therapeutics is a privately held, San Diego-headquartered clinical-stage
      biopharmaceutical company focused on gout. Its lead and only publicly identified
      clinical asset is dotinurad, a once-daily oral selective URAT1 inhibitor intended to
      lower serum uric acid for patients whose disease is not adequately controlled by
      existing therapy. The company is not yet a commercial operating business: its
      disclosed activity centers on global clinical development and preparation for a
      potential launch. Dotinurad was invented by Fuji Yakuhin and has approvals in
      multiple Asian markets, while Crystalys is pursuing U.S. and European development.
      The registry record for RUBY describes a randomized, double-blind Phase 3 comparison
      with allopurinol, with an estimated enrollment of 500 and estimated completion in
      November 2027. This creates a credible late-stage asset foundation, but it does not
      establish Western approval, revenue, or launch economics.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-and-governance
    title: Leadership, founders, and governance visibility
    body: >-
      Public materials identify James Mackay, Ph.D. as President and Chief Executive
      Officer and describe Crystalys as co-founded by Catalys Pacific and Novo Holdings.
      independent coverage also places Mackay at the center of the company’s financing and
      clinical strategy. The available evidence is stronger on the CEO than on the
      broader operating bench: the assigned sources do not provide a complete executive
      roster, board composition, reserved matters, or shareholder voting rights. The
      company therefore appears founder- and CEO-led from the public record, with a broad
      investor syndicate but limited public governance disclosure. That visibility gap is
      material for diligence because a single-asset biotech’s execution depends on clinical,
      regulatory, and commercialization capabilities that cannot be inferred from financing
      alone.
    claimRefs: [CO005, CO006, CO007]
    tableRefs: [TO002, TO003]
  - id: capitalization-and-scale
    title: Capitalization, scale, and disclosed operating metrics
    body: >-
      Crystalys announced an oversubscribed $130 million Series B in July 2026, led by
      Frazier Life Sciences with participation from new and existing investors. Multiples.vc
      reports a $205 million Series A in September 2025 and a reported $800 million
      post-money valuation for that round; the company-issued financing announcement
      confirms the Series B amount but does not disclose price per share, post-money
      valuation, liquidation preferences, debt, or cash balance. The two disclosed rounds
      imply $335 million raised, but funding raised is not the same as cash available after
      operating and clinical expenditures. The financing announcement says proceeds are
      expected to provide runway through multiple clinical and regulatory milestones, while
      independent coverage says management expected runway at least one year beyond Phase 3
      readouts. Revenue, ARR, customers, headcount, and current valuation are not established
      by sufficiently reliable public evidence in this pool and should remain explicit gaps.
    claimRefs: [CO009, CO010, CO011, CO012, CO013]
  - id: milestones-and-risks
    title: Milestones and diligence implications
    body: >-
      The company’s milestone path is concentrated: preserve the existing Asian approval
      base, complete RUBY and TOPAZ, generate supporting AMETHYST data, and translate that
      package into U.S. and European regulatory submissions and commercialization. RUBY
      began on August 1, 2025 and its registry record lists primary completion on November
      29, 2027; the company’s first-patient announcement describes approximately 500 RUBY
      participants and approximately 250 TOPAZ participants. The central upside case is a
      positive, differentiated Western label for a selective oral URAT1 inhibitor. The
      central downside is also concentrated: failure, delay, or endpoint/regulatory
      mismatch in either pivotal program would affect the only identified asset. Independent
      coverage additionally records prior safety concerns around Mackay’s earlier
      inflammatory-disease company, which is relevant context but not evidence of a Crystalys
      incident. No adverse Crystalys event is established by the assigned sources.
    claimRefs: [CO003, CO014, CO015, CO016]

