              年创立。公司将自己定位为面向高信用消费者的会员俱乐部，称申请者信用分至少要达到 750。官网称会员超过 2,500
              万，但这是注册会员口径，并非活跃用户或付费客户分母。其经营模式把信用卡账单支付、奖励与支付、信贷、财富管理、保险及生活方式服务结合起来。独立描述提到交易、借贷和商户优惠相关费用与佣金，但现有证据没有披露经审计的收入结构。
