    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 收入具备可比性、分部利润率稳定，并且出现 IPO 证据
        - 价格高于 $4.5B 需要新的审计证据；现有证据不足以支持精确的上行区间
        - S-1 备案、经审计的增长质量，以及清晰的普通股条款
        - 收入分母或优先权清算瀑布未通过尽调
      - - 基准
        - 规模延续，但私人业务经济性和融资条款仍不完整
        - 继续研究；仅将 2025 年 $3.5B 估值标记作为入场参考，不视为公允价值
        - 已核对的财务数据和完整的 Series H 条款披露
        - 会计、稀释或退出准备度缺口仍未弥合
      - - 悲观
        - 15.6x 的分母不适用，优先权损害普通股权益，或退出时间推迟
        - 不投资；或在完整清算瀑布分析后要求价格低于 2025 年估值标记
        - 不利的条款披露、分部现金转化疲弱，或持续没有备案
        - 尽调后任何打破核心论点的条件仍然存在
    notes: 由于现有证据缺少经审计的预测、现金流输入和优先权清算瀑布，因此不设定概率或模型推导的估值区间。
