              CRED 的风险边界远不止一个奖励应用。官网描述了信用卡账单支付、通过 CIBIL 软查询获取信用分，以及 对主要银行和卡组织的支持；独立资料则描述公司扩展到借贷、财富管理、UPI 和保险。一份当前资料称
