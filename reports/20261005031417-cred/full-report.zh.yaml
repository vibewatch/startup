            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV013
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV009
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 对价格敏感的建议
            body: 应继续研究，而不是按 45 亿美元估值进行投资评估。只有在经审计的收入质量、普通股经济性和退出路径 都有证据支持后，判断才可能改善；仅靠战略融资无法填补这些缺口。
            calloutType: recommendation
            claimRefs:
              - CV003
