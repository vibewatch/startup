      - - 核心论点
        - 大规模筛选后的消费者分发
        - CRED 自称拥有超过 25M 名信用合格会员，最低分数为 750
        - 经审计的活跃、留存和变现用户群显著低于会员总数这一宣传数字
      - - 核心论点
        - 融资验证了获取战略资本的能力
        - 独立报道均认可一笔由 Meta 领投的 $900M Series H 交易
