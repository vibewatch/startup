        blocks:
          - type: paragraph
            body: >-
              官方声称拥有超过 2,500 万名高信用会员，这扩大了支付或身份故障的潜在影响范围，但没有披露活跃用户 或交易分母。一份独立面试准备指南列出了相关假设故障模式：未经授权或错误扣款、重复支付、虚假成功
              状态、回调延迟、对象级授权绕过，以及未对账的待处理交易。该指南不是 CRED 架构、事故或控制措施的 证据。审阅的公开材料没有事故频率序列、可用性历史、渗透测试结果、对账例外或控制鉴证；这些披露缺失
              是尽调缺口，不是没有发生事故的证据。
            claimRefs:
              - CR001
              - CR010
              - CR013
