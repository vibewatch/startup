  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、宏观结构与准入分层动态
        blocks:
          - type: paragraph
            body: >
              印度数字支付和消费信贷市场存在明显结构分化：一边是高交易量、大众化的 UPI，另一边是高度集中、周转迅速的富裕消费者信贷层。2021 年印度信用卡用户总数达到 6,200 万（62m），但渗透率仍极低，每 100
              人仅约 3 张信用卡，而美国为每 100 人 32 张。尽管基础卡密度很低，行业仍快速扩张；随着数字支付增长、消费者转向延期结算产品，印度信用卡行业预计在 2020 至 2025 年以超过 25%
              的复合年增长率增长。印度储备银行调查数据显示，到 2022 年，印度城市智能手机用户中约 58% 已采用个人财务管理应用，城市数字金融普及也同步加速。


              在这一宏观环境下，印度金融科技市场 2024 年估值约为 9.13 lakh crore INR（1100 亿美元，$110b），预计到 2029 年将扩大至约 35 lakh crore INR（4200
              亿美元，$420b）。Kunal Shah 于 2018 年创立 CRED 时，没有走 PhonePe、Paytm 等横向平台追逐的大众交易量路线。公司看到，数字支付热潮让信用卡管理分散在各家银行应用中：
              这些应用收费惩罚性强，也不给负责任的财务行为奖励。市场分析显示，约 3,000 万名（30m）信用分达到 750 及以上的高信用人群贡献了全国近 70% 的信用卡消费。CRED 以 750+
              征信分设下严格准入门槛，把自己 定位成服务印度高信用人群顶层的会员制俱乐部，而不是通用的支付工具。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
