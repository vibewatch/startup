      - number: '7.3'
        title: 合作伙伴、财务与执行依赖
        blocks:
          - type: paragraph
            body: >-
              CRED 称其支付体验支持印度主要发卡行以及 Visa、Mastercard、American Express 和 RuPay，因此银行、卡组织、
              征信机构和结算连接都是重要依赖，尽管公开证据没有量化集中度或合同冗余。财务能力也 也很难依据指定证据评估：Inc42 报告 FY25 收入至少为 ₹2,535.7 crore、总融资超过 18.9 亿美元，另一份
              资料则报告 2026 年 6 月完成 9 亿美元融资。这些数字不是 ARR、利润率、现金或资金续航。独立资料中的 人员数据彼此矛盾，抓取的官方招聘页面也没有职位数量，因此不能从公开招聘页面推断执行能力。
            claimRefs:
