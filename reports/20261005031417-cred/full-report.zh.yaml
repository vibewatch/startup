            tableRef: TI002
            claimRefs:
              - CI003
              - CI004
              - CI007
              - CI008
              - CI010
      - number: '4.3'
        title: 资本充足性、流动性画像与尽调判断
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月 Meta Platforms 领投 9 亿美元（$900m）Series H、投后估值 45 亿美元（$4.5b）后，CRED 的资本画像得到显著加固 [CI010, CI011,
              CI012]。这笔注资将累计股权融资推升至约 19 亿（$1.9b）至 20 亿美元（$2.0b），按当前经营消耗速度可支撑超过 36 个月 [CI008, CI010, CI011]。估值回升至 45
              亿美元（$4.5b），此前 2025 年 5 月下调至 35 亿（$3.5b）至 36.6 亿美元（$3.66b），低于 2022 年达到的 64 亿美元（$6.4b）峰值 [CI003, CI008,
              CI010, CI013]。现金缓冲 基本缓解了流动性风险，但机构投资者评估其上市准备度时仍受关键披露缺口阻碍：合作伙伴违约担保、 个人借贷群组损失曲线、超过 33%
              变现会员阈值后的交叉销售转化持久性，以及支付聚合商牌照和 信用卡账单规则带来的监管风险 [CI002, CI005, CI014]。
            claimRefs:
              - CI002
              - CI003
              - CI005
              - CI008
              - CI010
