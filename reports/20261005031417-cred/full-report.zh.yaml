              - CI007
      - number: '4.2'
        title: 经营杠杆、费用动态与贡献利润率
        blocks:
          - type: paragraph
            body: >-
              对 CRED 的历史批评集中在高昂获客成本和不可持续的营销消耗 [CI006]。FY24 经营亏损同比收窄 41% 至 ₹609 crore，网络总支付量增长 55% 至 ₹6.87 lakh crore（820
              亿美元，$82b），初步显示出经营杠杆 [CI003, CI007]。尽管经营亏损下降，CRED FY24 法定净亏损仍为 ₹1,644 crore（1.7 亿美元，$170m），反映出大额非经营调整、ESOP
              会计处理和融资费用 [CI004]。营销及奖励分发费用占支付总额的比例已下降，但由于会员 coin 兑换和合作伙伴补贴采用合并记账，各产品线的单位贡献利润率仍未验证 [CI005, CI007]。截至 2026
              年 3 月，员工数同比下降 12% 至 1,056 人，显示公司在压缩编制；未关闭的招聘需求也从产品工程 全部转向催收、现场回收和商业合作 [CI008, CI009]。
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
