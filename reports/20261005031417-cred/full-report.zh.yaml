      - number: '3.2'
        title: 壁垒来自身份认同与生态执行，而非独占功能
        blocks:
          - type: paragraph
            body: >-
              MarkHub 和 upGrowth 都认为，CRED 的核心差异化在于排他性、定位、游戏化和体验，而不是新颖的支付技术。CRED 增加了由合作伙伴出资的奖励层，并扩展到
              UPI、借贷、财富管理、保险和联名卡，有机会加深参与度并交叉销售。但同一证据也削弱了强锁定论：持怀疑态度的二手分析认为，金融应用多平台使用很常见，切换成本很低。因此，CRED
              的防御力取决于能否持续维持品牌意义、有吸引力的合作伙伴供给、信任和产品质量。这些资产作为系统或许难以复制，但底层能力大型应用、银行和专业服务商都具备。
            claimRefs:
              - CP003
