      - number: '7.4'
        title: 缓释措施、监测指标与论点失效条件
        blocks:
          - type: paragraph
            body: >-
              公开证据只支持边界层面的缓释措施：广泛的支付通道支持、据报取得的支付聚合商授权，以及据报取得 的保险牌照。它不能证明经过测试的故障切换、对账准确性、欺诈损失上限、信贷合作伙伴表现、经审计
              现金或牌照条件合规。因此，投资尽调应监测未结支付账龄、重复支付和授权例外、合作伙伴层面的交易量 集中度、监管机构意见、投诉趋势、信贷损失和担保敞口，以及不受限制的流动性。论点失效触发条件应
              包括核心授权丧失或暂停、反复出现重大对账失败、已证实的隐私或授权控制失灵、无法证明贷款方层面的 损失经济性，或流动性降至管理层经董事会批准的经营阈值以下；具体阈值必须来自私有记录，而非杜撰 的公开估计。
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR010
              - CR012
              - CR013
              - CR015
              - CR016
