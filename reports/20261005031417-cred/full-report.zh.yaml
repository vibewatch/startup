      - number: '5.2'
        title: 共享工作流服务把产品广度转化为可复用的会员旅程
        blocks:
          - type: paragraph
            body: >-
              两份内部平台说明解释了 CRED 如何避免各业务线重复搭建共用工作流基础设施。User Attribute Service
              替换了原先的布尔分段模型，后者曾造成组合爆炸、队列争用并依赖中央平台团队。现在，各业务线处理器 消费事件、运行配置好的 JavaScript 业务逻辑、写入受 schema 控制的属性，再通过变更数据捕获把更新
              暴露给实时分析系统和数据湖。订单管理重构把同一套平台逻辑用于交易：中心化、与领域无关的事实来源 支持自定义属性和状态机，同时产品团队保留各自的履约规则。这套架构应能提高复用和一致性，但两份
              说明都是公司自述的设计叙事，并非对会员收益、延迟或缺陷减少的独立测量。
            claimRefs:
              - CE003
