      - number: '2.2'
        title: 多维市场规模框架：TAM、SAM 与 SOM 约束
        blocks:
          - type: paragraph
            body: >
              评估 CRED 可触达的商业机会，必须拆开看印度的信贷与交易池：宏观交易通道、可触达的信用卡持有人，以及能实际变现的高端会员。宏观层面，TAM 受印度整体金融科技生态边界约束，2024 年规模为 9.13
              lakh crore INR（1100 亿美元，$110b），预计 2029 年扩大至 35 lakh crore INR（4200 亿美元，$420b）；全球个人财务应用市场则将从 2024 年的 177.5
              亿美元（$17.75b）增长到 2033 年的 1152.6 亿美元（$115.26b），复合年增长率为 20.57%。在这个大盘中，SAM 由印度活跃信用卡持有人构成：2021 年记录为 6,200
              万人（62m）；其中约 3,000 万人（30m）的 CIBIL 信用分达到 750 及以上，他们贡献了绝大多数消费信用卡支出。


              CRED 的 SAM 可获得市场（SOM）取决于其对这批高端人群的实际渗透。Rutgers Business Review 的学术案例研究显示，CRED 已获得印度经济光谱顶层超过 25%
              的信用卡用户。平台披露显示，CRED 会员从 2021 年报告的 590 万人（5.9m）增至 2026 年超过 2,500 万名（25m）高信用会员。但如此高的渗透率也暴露出无法回避的市场天花板：CRED 坚持
              750+ 信用分准入，国内可触达受众受限于印度优质征信人群的规模。 因此，估值增长不能无限依赖新增会员，而必须转向提高每名会员在相邻金融垂直业务中的变现产出。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM007
              - CM008
              - CM009
              - CM016
