  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 有限会员池周围存在广泛替代品
        blocks:
          - type: paragraph
            body: >-
              CRED 官网称入会需要至少 750 分信用分，并声称拥有超过 2,500 万名高信用会员。这一门槛定义了高端分层，却没有创造独特支付基础设施。独立二手分析将 Paytm、PhonePe、Google
              Pay、发卡银行、借贷聚合商、电商平台和普通银行自动扣款列为同一任务的部分替代方案。竞争格局分层明显：大众支付应用争夺交易频次，银行掌握底层卡关系，专业金融科技公司逐产品竞争，自动扣款则可能直接消除账单支付需求。公开用户数显示部分大众平台触达更广，但这些数据有时间差、来自二手来源，不能与
              CRED 自报会员数直接比较。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP008
              - CP009
          - type: table
            tableRef: TP001
