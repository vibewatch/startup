      - number: '2.3'
        title: 垂直变现路径、监管壁垒与采用障碍
        blocks:
          - type: paragraph
            body: >
              由于信用卡账单处理从发卡行获得的交易费极少，CRED 靠系统性横向扩张产品变现高端会员。FY24 收入达到 2,473 crore INR（2.6 亿美元，$260m），年度亏损收窄至 1,644 crore
              INR 后，公司投入大量资产负债表 资本收购业务并申请监管牌照，以搭建自有金融通道。2024 年 2 月，公司收购数字财富管理平台 Kuvera， 进入直接共同基金分销；2024 年 8 月获得 Bharat
              Bill Payment System（BBPS）客户运营单元认证； 2024 年 11 月通过 CRED Garage 依托 IRDAI 公司代理牌照开展车险分销；2025 年 9 月将 CRED Money
              扩展至定期存款和投资组合管理；2026 年 3 月获得印度储备银行正式支付聚合商授权。


              尽管监管和商业扩张都取得进展，个人财务与信贷管理平台推动多产品采用时，仍会受到用户行为惯性的 约束。在可比消费金融场景中，金融应用的深度采用往往无法转化为工具的实际使用：Capital One 和
              eMarketer 调查显示，76% 的成年人使用手机银行应用，但只有 16% 的人主动使用预算和储蓄工具。 此外，企业费用管理部门 Happay 于 2024 年 11 月剥离给
              MakeMyTrip，说明非核心收购仍可能被清理。               因而，CRED 在截至 2026 年各轮融资评估中约 36.4 亿（$3.64b）至 45
              亿美元（$4.5b）的企业估值，完全取决于筛选出的 高端会员网络能否在借贷、财富管理和保险分销中持续提高复合抽成率。
            claimRefs:
              - CM010
              - CM011
              - CM012
