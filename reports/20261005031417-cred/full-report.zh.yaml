      - number: '4.4'
        title: 展示
        blocks:
          - type: callout
            title: 零费用参与陷阱与借贷交叉销售
            body: >-
              CRED 的主要交易量引擎——信用卡账单结算——不向消费者收费，也不从发卡行取得支付商户折扣费。整个 经济模型都押在一件事上：把付账单的用户成功转化为 CRED Cash 借款人，或通过 CRED Mint
              转化为 点对点借贷参与者。因此，CRED 的本质是专业借贷分销商，而不是支付网络。
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI005
          - type: callout
            title: 信贷质量与违约吸收构成投资评估障碍
            body: >-
              CRED 以 CIBIL 信用分 750+ 的会员群体为卖点，但其规模超过 $2.5B 的撮合借贷组合表现仍隐藏在合作 NBFC
              的资产负债表后。私人投资者无法核实在通胀环境下，违约率、回收费用或首损担保调用是否上升。
            calloutType: risk
            claimRefs:
              - CI002
              - CI005
              - CI010
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 从准入制金融工具扩展为多产品会员平台
        blocks:
          - type: paragraph
            body: >-
              CRED 的客户主张从会员门槛开始，而不是开放式支付漏斗：官网称申请者信用分至少要达到 750。获准加入后， 会员可以管理主要印度发卡行和卡组织的信用卡账单、水电费、房租、奖励及其他支付。公司工程材料显示， 到
              2022—2023 年，产品已从账单支付扩展到电商、借贷、投资、旅行、车辆管理和点对点支付场景。这种 广度意味着该应用是多个受监管或依赖合作伙伴工作流之上的分销层，而不是一个同质化产品。因此，模块图
              按类别看模块图是可信的，但截至运行日期，公开证据并未持续说明哪些现有功能普遍可用、由合作伙伴运营、处于试点、已下线或具有实质经济价值。
            claimRefs:
              - CE001
