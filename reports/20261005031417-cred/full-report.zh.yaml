            body: >-
              CRED 最强的技术差异化并非已披露的专有算法，而是把广泛的产品组合平台化运营。UAS 和 OMS 说明都显示 公司明确迁离了瓶颈设计或重复设计，AWS 案例则提供了少见的具体部署控制指标。安全和 AI
              更难验证。 管理层称安全从设计第一天就进入评审，提到内部威胁建模工具，并指出 AI 用于客服、工程和商户洞察； 但证据池没有渗透测试结果、认证登记、模型评估或事故历史。公开开发者信号也很弱：一页面试准备材料
              只讨论通用系统设计要求，指定招聘页面没有职位细节或开源活动。因此，尽调应把当前可用性、安全保障、 合作伙伴集中度、AI 治理和路线图交付视为需要私有证据回答的问题，而不是从个别架构成功案例中推断。
