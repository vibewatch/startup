      - number: '3.3'
        title: 公开资料不足以评估价格、规模与锁定效应
        blocks:
          - type: paragraph
            body: >-
              指定证据没有提供 CRED
              与替代方案之间可比的消费者价格、商户抽成、奖励补贴、合同条款或实际折扣。学生报告建议扩大产品覆盖并降低订阅价格，但这份声誉较低且有公司协助的材料不能作为可靠价格基准。公开规模数据也自相矛盾：Inc42 列出
              2,256 名员工，QuantLogix 列出 600 名；QuantLogix
              还将估值估计标为低置信度且锚定于融资轮次。这些冲突不能直接决定竞争地位，却说明必须做供应商层面的尽调。下一步应依据竞争对手官方价格、监管许可、奖励经济性、留存、多平台使用和获客数据，进行当前且产品匹配的比较。
