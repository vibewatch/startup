      - number: '7.5'
        title: 展示
        blocks:
          - type: callout
            title: 披露缺口不等于没有事故记录
            body: 现有来源无法证明 CRED 的事故历史、控制有效性、合作伙伴集中度、信贷损失敞口或经审计的流动性。这些 未知项应继续作为明确的尽调事项，不能据此声称不存在事故、集中度、损失或流动性风险。
            calloutType: risk
            claimRefs:
              - CR013
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资与价格背景
        blocks:
          - type: paragraph
            body: >-
              独立报道一致将 Meta 领投的 Series H 描述为 9 亿美元（$900m）、投后估值 45 亿美元（$4.5b），但也称该交易同时包含新股发行和老股购买。这一区分很重要：交易表面金额既不是 CRED
              收到的新现金，也不是当前可用 现金的证据。最新估值较 Multiples 2025 年 6 月 35 亿美元（$3.5b）的参考值回升，但仍低于其 2022 年 6 月 64
              亿美元（$6.4b）的参考值。公开聚合网站对累计融资也说法不一，分别报告约 14.7 亿美元（$1.47b）已披露新股融资、18.9 亿美元（$1.89b）以上总融资和 20
              亿美元（$2.0b）总资本。这些定义无法从预先抓取的证据中调和，因此不应在回报或资金续航计算中混用。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
      - number: '8.2'
        title: 正向论点、反向论点与可比公司
        blocks:
          - type: paragraph
            body: >-
              正向论点是，CRED 已经搭建了一个规模大且经过筛选的分销基础：公司称服务超过 2,500 万名高信用会员（25m），入会要求信用分至少 750。反向论点是估值纪律。Multiples 将 2.9
              亿美元（$290m）收入列在 2026 年 6 月融资旁， 并计算出 15.6 倍倍数，但其方法说明与融资轮次关联的收入可能是年化收入或过去 12 个月收入。分母 含义不明，因此不能把 15.6
              倍视为经审计的历史收入倍数。Multiples 选取的金融科技公司收入倍数约 为 1.2 倍至 17.2 倍，可作为方向性筛选，而非独立基准，因为这些公司的地域、业务组合、盈利能力
              以及上市/非上市状态不同。QuantLogix 另将其以融资轮次为锚的估值标为低置信度，进一步说明最新融资 估值不是连续交易的市场价格。
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV009
              - CV013
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV008
              - CV009
              - CV013
              - CV015
      - number: '8.3'
        title: 情景分析与入场纪律
        blocks:
          - type: paragraph
            body: >-
              情景分析应把已披露估值当作边界，而不是制造一个精确公允价值。乐观情景要求经审计证据证明报告中的 收入分母具有可比性且足够持久，足以支撑高于 45 亿美元融资估值的价格。基准情景维持继续研究的决定，
              在获得融资条款和分部经济性之前，把 2025 年 35 亿美元估值当作谈判参考，而非内在价值。若 15.6 倍 的分母不适用、融资优先权损害普通股价值，或 IPO 路径仍无证据支持，悲观情景就是不投资，或价格
              低于 2025 年估值。没有情景被赋予数字概率，因为证据池没有足够的经审计分部预测、现金流模型、优先权 清算瀑布或二级市场证据来估计概率。
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: 建议与退出准备度
        blocks:
          - type: paragraph
            body: >-
              建议是继续研究，置信度中等、风险高；按最新披露的 45 亿美元估值看，价格已显得偏高。这不是对产品 质量的负面判断，而是对价格和证据的判断。CRED 的规模和新增战略资本有意义，但都不能证明现金创造、
              普通股价值或可投资回报。QuantLogix 称没有公开 S-1，并明确将该估值描述为上一轮融资估值，而非实时 价格。在投资评估前，应取得 Series H
              新股/老股拆分、优先股堆叠、完全摊薄股权结构表、经审计的收入定义、分部贡献利润率、信贷损失敞口和经董事会批准的 IPO 计划。可信申报文件、可调和的经审计分母以及清晰
              的普通股清算瀑布可能改善判断；不利条款或持续不透明则会击穿论点。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV013
              - CV014
              - CV016
