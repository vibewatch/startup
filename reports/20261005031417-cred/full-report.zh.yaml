  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 变现框架与收入架构
        blocks:
          - type: paragraph
            body: >-
              CRED 的生态变现架构以一个基础用户动作——支付信用卡账单——为起点，但该动作不产生直接消费者交易费。 公司通过相邻生态环节变现：CRED Cash 的预审批借贷撮合、CRED Pay 的商户结账接入、CRED
              Mint 的点对点撮合费、精选奢侈品电商和品牌赞助 [CI001, CI002]。FY24 合并收入达到 ₹2,473 crore（2.6 亿美元，$260m），较 FY23 的 ₹1,484 crore
              同比增长 66% [CI003, CI004]。但公司披露仍停留在合计收入，没有公布分部 抽成率、商户净交换费利润率或借贷撮合利差 [CI005]。此外，内部 NBFC 载体 Newtap Finance
              已与银行及 NBFC 分销合作并行，用于获取直接净息差；但信贷资产负债表的吸收情况仍未接受外部承销审查 [CI002, CI005]。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI010
          - type: figure
            figureRef: FI001
            claimRefs:
