          'y': 1
          detail: 高效替代支付任务，但没有更广泛的用户参与层。
    approximationNotes: 分析师按序位给出的分数为 1（低）至 5（高）：x 轴是高端 / 排他性聚焦，y 轴是有证据支持的产品广度；分数是方向性判断，不是已测量的市场份额或表现。
    claimRefs:
      - CP016
  - id: FI001
    title: CRED 生态变现与运营亏损桥
    type: waterfall
    summary: 从信用卡支付金额到 FY24 法定口径净结果的示意性运营转化瀑布图。
    data:
      items:
        - label: 支付总额
          value: 82000
        - label: 零费用核心处理
          value: -81700
        - label: 生态总收入
          value: 300
        - label: 直接运营及奖励成本
          value: -125
        - label: 员工及管理费用
          value: -100
        - label: 运营亏损（FY24）
          value: -75
        - label: 融资及非运营费用
          value: -125
        - label: 净亏损（FY24）
          value: -200
    approximationNotes: 瀑布图以 FY24 ₹6.87L Cr GPV（$82B）、₹2,473 Cr 收入（相当于 $260M-$300M）和 ₹609 Cr 运营亏损为基础，统一换算为百万美元示意。
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI007
  - id: FE001
    title: 产品架构：会员旅程下的共享控制平面
    type: stack
    summary: 控制平面视图将客户界面与工作流、数据、持久化及保障层分开；这些层次均有指定来源的证据支持。
    data:
      layers:
        - label: 会员旅程
          detail: 支付、奖励、信贷、投资、商业、旅行和车辆服务
          items:
            - label: 移动会员体验
              detail: 一个有门槛的多产品界面，而非单一账单支付功能
        - label: 产品编排
          detail: 业务线服务和有状态交易工作流
          items:
            - label: 平台 OMS
              detail: 自定义订单类型、属性、状态机和状态转换历史
        - label: 个性化
          detail: 可复用属性取代粗粒度布尔分群的组合
          items:
            - label: UAS 与 LOB 处理器
              detail: 已配置的事件输入、业务逻辑、命名空间模式和访问控制
        - label: 数据流动与分析
          detail: 变更数据捕获支持实时分析和更长周期的数据使用
          items:
            - label: CDC、实时分析与数据湖
              detail: 公司账户将 Pinot 和数据湖列为下游界面
        - label: 持久化与发布控制
          detail: 托管数据库和自动化蓝绿变更管理
          items:
            - label: RDS/Aurora 集群
              detail: 验证、检查点迁移、维护模式、回滚和监控
        - label: 保障
          detail: 可观测性、安全审查、数据保护和供应商风险控制
          items:
            - label: 运营与信任控制
              detail: 管理层描述的控制措施仍需独立审计证据
    approximationNotes: 该排序是根据不同来源的叙述拼出的分析表示，并不声称 CRED 将其发布为官方技术栈。
    claimRefs:
      - CE005
      - CE008
      - CE011
      - CE012
  - id: FU001
    title: 客户旅程与证据边界
    type: journey-map
    summary: 可观察到的旅程覆盖资格审核、消费者使用、商户结账、支持和产品扩张，但留存仍未被测量。
    data:
      nodes:
        - label: 资格审核
          stage: Member acquisition
          detail: 使用印度手机号码申请，信用分至少为 750。
          touchpoints:
            - Membership application
            - Credit-score check
        - label: 核心会员使用
          stage: Payments
          detail: 支付受支持的信用卡账单，并查看信用信息。
          touchpoints:
            - Card-bill payment
            - Credit-score refresh
        - label: 奖励与商业
          stage: Engagement
          detail: 符合条件时获得金币、现金返还、折扣或合作伙伴优惠。
          touchpoints:
            - Rewards
            - Brand and seller offers
        - label: 商户结账
          stage: Commercial adoption
          detail: 指定商户完成接入并达成协议后，可启用 CRED Pay。
          touchpoints:
            - Payment collection
            - Settlement dashboard
            - API integration
        - label: 支持与对账
          stage: Service recovery
          detail: 支付失败、退款、拒付、争议和商户支持需要多方协同处理。
          touchpoints:
            - In-app support
            - Merchant dispute handling
            - Settlement reconciliation
        - label: 产品扩张
          stage: Cross-sell
          detail: 更广泛的套件覆盖借贷、财富管理、保险、UPI、钱包和车辆服务。
          touchpoints:
            - Financial products
            - Payment products
            - Lifestyle services
    approximationNotes: 该定性顺序根据当前公司材料整理，不表示每个阶段都有已测量的转化率、留存率或共同用户群。
    claimRefs:
      - CU002
      - CU003
      - CU005
      - CU006
      - CU007
      - CU008
      - CU013
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 定性优先级将有证据支持的外围缓解措施，与发生可能性和控制有效性仍未核实的风险区分开来。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 公开缓解证据
        - label: 剩余严重程度
      rows:
        - label: 支付正确性与对账
          values:
            - label: Unknown
            - label: 关键
            - label: 未保留
            - label: 高
        - label: 授权与个人数据
          values:
            - label: Unknown
            - label: 关键
            - label: 未保留
            - label: 高
        - label: 监管边界
          values:
            - label: 中
            - label: 高
            - label: 据报道获得部分授权
            - label: 高
        - label: 银行、卡组织与合作伙伴依赖
          values:
            - label: Unknown
            - label: 高
            - label: 自称获得广泛支持
            - label: 高
        - label: 信贷经济性与流动性
          values:
            - label: Unknown
            - label: 高
            - label: 据报道有融资和收入
            - label: 高
        - label: 执行能力
          values:
            - label: 中
            - label: 中
            - label: 人员配置信号相互矛盾
            - label: 中
    approximationNotes: 仅为分析师的定性评估；指定证据中没有事件频率、风险暴露分母、合作伙伴份额、经审计现金或控制测试结果。
    claimRefs:
      - CR001
      - CR004
      - CR009
      - CR010
      - CR013
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策路径将可观察的规模和融资，与评估价格和退出所需但尚未解决的证据区分开来。
    data:
      nodes:
        - id: member-scale
          label: 公司自称的规模
          detail: 超过 25M 名会员；资格分数至少为 750
        - id: round
          label: 最新融资
          detail: $900M 混合主要 / 次要交易，投后估值为 $4.5B
        - id: multiple
          label: 报道中的价格视角
          detail: 按与融资轮次相关的 $290M 收入计算为 15.6x
        - id: confidence
          label: 价格质量检查
          detail: 锚定融资轮次的低置信度估算，不是当前市场价格
        - id: gaps
          label: 所需私人证据
          detail: 条款、股权结构表、经审计的分母、利润率和亏损暴露
        - id: decision
          label: 决策
          detail: 继续研究；按披露估值标记看，风险高且估值偏紧
      edges:
        - from: member-scale
          to: round
        - from: round
          to: multiple
        - from: multiple
          to: confidence
        - from: confidence
          to: gaps
        - from: gaps
          to: decision
    approximationNotes: 仅表示逻辑顺序；节点大小和间距不编码概率、价值或因果强度。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV009
      - CV013
      - CV014
      - CV016
