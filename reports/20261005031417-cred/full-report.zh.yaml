      - - 反方论点
        - 报道中的倍数缺少清晰可比的分母
        - Multiples 报告 $290M 收入和 15.6x，同时说明这些数值可能是年化口径或 LTM
        - 有经审计的 LTM 收入、分部利润率和现金转化数据支持该融资倍数
      - - 反方论点
