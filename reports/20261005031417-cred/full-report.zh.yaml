        title: 已披露技术栈强调事件驱动平台与受控运营
        blocks:
          - type: paragraph
            body: >-
              现有架构证据指向一套事件驱动的服务体系：Kafka 风格输入流、变更数据捕获、实时分析、数据湖、集中式 订单状态，以及大规模托管数据库集群。AWS 称 CRED 运营着超过 120 个生产环境 RDS 和
              Aurora 集群， 并搭建了蓝绿编排框架，覆盖验证、应用维护模式、CDC 检查点、回滚和切换后监控。AWS 还报告平均切换 时间为两分钟、操作成功率
              100%，在所述采用期间没有生产事故或数据丢失。这些结果是有意义的运营证明， 但来自技术供应商案例研究，不能证明全平台可用性。另一份高管访谈描述了端到端可观测性、加密、脱敏、
              基于角色的控制、安全合作伙伴接入和上线前审查；在指定证据池中，这些仍是管理层描述，没有审计报告 或认证证据。
