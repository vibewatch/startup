      - number: '2.4'
        title: 展示
        blocks:
          - type: callout
            title: 高信用核心人群的结构性天花板
            body: >
              CRED 将自己定位为要求 750+ 信用分的会员制俱乐部，因此在贡献全国 70% 信用卡消费的富裕人群中 占据强势心智。但这一定位也把公司的国内可触达客户基数限制在约 3,000 万人。注册会员已超过
              2,500 万后，CRED 无法再靠国内漏斗顶部的会员数量扩张支撑风险投资估值。未来企业价值几乎完全 取决于提高每名用户在借贷、保险分销和资产管理业务中的变现抽成。
            calloutType: risk
            claimRefs:
              - CM005
              - CM007
              - CM008
          - type: callout
            title: 监管牌照构成长期防御壁垒
            body: >
              正式取得监管授权——包括 2024 年 8 月的 Bharat Bill Payment System（BBPS）认证、2024 年 11 月的 IRDAI 公司代理牌照，以及 2026 年 3 月的 RBI
              支付聚合商授权——让 CRED 从拼装式界面应用变成受监管 的金融基础设施平台。这些资质降低了平台被去中介化的风险，也让公司能向已验证的高端会员群体开展 高毛利金融分销。
            calloutType: insight
            claimRefs:
              - CM013
              - CM014
