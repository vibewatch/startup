company:
  name: "CRED"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    CRED says its gated consumer membership exceeds 25 million people, but the
    reviewed evidence does not disclose active-user cohorts, retention, or
    product-level monetization. Merchant-facing terms establish a second customer
    surface through CRED Pay, yet no retained source names a merchant customer or
    reports a deployment outcome, leaving durability and concentration unverified.
sections:
  - id: "customer-segments"
    title: "A gated consumer base and a separate merchant surface"
    body: >-
      CRED's clearest customer segment is the individual member: the official site
      says applicants need an Indian mobile number and a credit score of at least
      750, while the terms permit CRED to use credit information when determining
      service eligibility. The same terms define a broader commercial surface that
      includes merchants, sellers, lenders, and other contractual partners. Those
      counterparties should not be collapsed into one customer count. Members use
      payment, reward, credit-monitoring, lending, wealth, insurance, and vehicle
      services; select merchants can adopt CRED Pay for checkout collection and
      settlement. Public evidence does not show which party pays CRED, by product,
      or how revenue and strategic value divide between consumers and commercial
      relationships.
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU013"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-evidence"
    title: "Headline reach has grown, but active adoption is not observable"
    body: >-
      The strongest current scale statement is company-issued: CRED says it is
      trusted by more than 25 million creditworthy members. A secondary historical
      source says the company reported 5.9 million users in 2021. These figures
      indicate a larger registered reach, but they use different labels, vintages,
      and potentially different denominators, so they do not establish cohort
      growth or active usage. Inc42's 1.85 million web-traffic figure covers a
      recent 30-day window but is website traffic, not app activity, transactions,
      or paying customers. QuantLogix's September 2026 hiring snapshot suggests a
      go-to-market and operations push, not customer adoption. No reviewed source
      reports monthly active transactors, repeat payment frequency, utilization,
      or product-level conversion.
    claimRefs:
      - "CU001"
      - "CU009"
      - "CU010"
      - "CU012"
      - "CU016"
    tableRefs:
      - "TU002"
  - id: "customer-proof"
    title: "Named relationship evidence does not amount to named customer proof"
    body: >-
      CRED's site lists major supported card issuers and networks, and its terms
      describe onboarding for select Indian merchants. These are meaningful signs
      that the service depends on a multi-party payments ecosystem, but neither
      source identifies a merchant as a paying customer or documents a production
      outcome. A third-party interview-preparation page discusses merchant
      engagement, campaign activity, renewal, and churn scenarios; those prompts
      are hypothetical preparation material rather than evidence of CRED's actual
      customer-success process or any specific account. The sparse public careers
      page likewise provides no customer reference. The available pool therefore
      supports customer-segment and workflow analysis, not a verified customer
      roster, pilot-to-production conversion rate, or measured customer outcome.
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU011"
      - "CU014"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU003"
  - id: "durability-and-concentration"
    title: "Retention, expansion, and concentration remain diligence gaps"
    body: >-
      Merchant onboarding requires due diligence, KYC, and an agreement, while
      CRED Pay can provide collection, settlement, dashboard, and API functions.
      That architecture creates potential expansion paths, but the terms also
      allocate product-quality disputes to merchants and state that CRED is not
      obligated to mediate those disputes. For failed payments that debit a user,
      CRED says it will endeavor to return wrongly deducted amounts within 21 days
      or another legally permitted period. These provisions expose support and
      reconciliation friction without proving that incidents occurred. Across all
      eight reviewed sources, there is no disclosed NRR, GRR, churn, renewal rate,
      contract duration, customer revenue concentration, or active-user cohort.
      Durability cannot be inferred from registered-member scale, service breadth,
      hiring signals, or the absence of a documented incident.
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU013"
      - "CU016"
callouts:
  - calloutType: "risk"
    title: "Customer scale is not retention evidence"
    body: >-
      The 25-million-member statement is a company claim about reach. Without
      active cohorts, renewals, merchant economics, and concentration data, it
      cannot establish durable engagement or recurring customer value.
    claimRefs:
      - "CU001"
      - "CU009"
      - "CU010"
      - "CU016"
