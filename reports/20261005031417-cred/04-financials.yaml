callouts:
  - calloutType: "insight"
    title: "The Zero-Fee Engagement Trap Versus Lending Cross-Sell"
    body: "CRED's primary volume engine—credit card bill settlement—generates no consumer fees and commands no payment merchant discount rate from issuing banks. The entire economic model hinges on successfully converting bill-paying users into borrowers via CRED Cash or peer lenders via CRED Mint, making the company fundamentally a specialty lending distributor rather than a payment network."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI005"
  - calloutType: "risk"
    title: "Underwriting Blocker on Credit Quality and Default Absorption"
    body: "While CRED boasts a member base with CIBIL credit scores of 750+, the performance of its $2.5B+ facilitated lending portfolio remains hidden behind partner NBFC balance sheets. Private investors cannot verify whether default rates, recovery expenses, or first-loss guarantee invocations are increasing in an inflationary environment."
    claimRefs:
      - "CI002"
      - "CI005"
      - "CI010"
