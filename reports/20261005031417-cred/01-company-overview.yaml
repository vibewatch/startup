company:
  name: "CRED"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    CRED is a Bengaluru-based, members-only consumer-fintech platform founded in
    2018 by Kunal Shah, with an official membership gate of a 750 credit score
    and a product scope spanning payments, rewards, credit, and adjacent financial
    services. Its June 2026 Series H reportedly reset the valuation to $4.5 billion,
    but total funding, headcount, revenue, governance, and round terms remain
    insufficiently consistent or disclosed for a fully verified snapshot.
sections:
  - id: "identity-and-business-model"
    title: "Identity and business model"
    body: >-
      CRED is the trade name used by Dreamplug Technologies Private Limited, a
      Bengaluru-based Indian fintech founded in 2018 by Kunal Shah. The company
      describes itself as a members-only club for creditworthy consumers and says
      applicants need a credit score of at least 750. Its official page reports
      more than 25 million members, but that is a registered-member measure rather
      than an active-user or paying-customer denominator. The operating model
      combines credit-card bill payment and rewards with broader payments, credit,
      wealth, insurance, and lifestyle propositions. Independent descriptions
      identify fees and commissions around transactions, lending, and merchant
      offers, but the assigned evidence does not disclose an audited revenue mix.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO001"
  - id: "capitalization-and-milestones"
    title: "Capitalization and milestones"
    body: >-
      The financing record shows rapid private-market repricing rather than a
      monotonic valuation path. CRED reached a reported $2.2 billion mark with its
      April 2021 Series D, and assigned sources disagree on whether the June 2022
      Series F raised $80 million or $140 million. A roughly $72 million Series G
      in June 2025 was reported at a $3.5 billion valuation, below the prior peak.
      The June 2026 Series H is more consistently reported as $900 million at a
      $4.5 billion post-money valuation. Aggregators nevertheless report cumulative
      funding from $1.81 billion to $2.0 billion; none establishes cash currently
      available, debt outstanding, secondary proceeds, or preference terms.
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO014"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      Founder dependence became a current diligence issue in June 2026. Multiple
      assigned sources report that Kunal Shah moved from CRED's chief executive
      role to lead WhatsApp globally, while Miten Sampat became interim CEO. Shah's
      continued founder and shareholder role may preserve strategic influence, but
      the available material does not establish day-to-day authority, succession
      duration, board composition, independent directors, committee structure, or
      investor consent rights. The leadership table is therefore deliberately
      partial: it records the two named decision-makers supported by the pool and
      treats the absent governance structure as a diligence gap rather than
      inferring control from funding participation.
    claimRefs:
      - "CO001"
      - "CO013"
    tableRefs:
      - "TO002"
  - id: "scale-signals-and-reliability"
    title: "Scale signals, regulatory progress, and evidence quality"
    body: >-
      Public scale signals are substantial but not directly comparable. CRED's
      official page claims more than 25 million members, while a third-party tear
      sheet reports 17 million monthly active users; those denominators should not
      be merged into one customer figure. Headcount estimates range from about 600
      to 2,256 across assigned sources, and the careers page exposes opportunities
      without a workforce total. Revenue references also conflict on FY25 values,
      and no assigned primary filing supports a current revenue run-rate or
      profitability claim. Payment-aggregator authorization in March 2026 is a
      meaningful regulatory milestone, yet historical criticism of valuation and
      monetization remains relevant. CRED is still private, and no public S-1 was
      identified by the assigned market-data source.
    claimRefs:
      - "CO002"
      - "CO005"
      - "CO014"
      - "CO015"
      - "CO016"
