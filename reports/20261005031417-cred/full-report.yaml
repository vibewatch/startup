        - from: round
          to: multiple
        - from: multiple
          to: confidence
        - from: confidence
          to: gaps
        - from: gaps
          to: decision
    approximationNotes: Ordered logic only; node size and spacing do not encode probability, value, or causal strength.
    claimRefs:
