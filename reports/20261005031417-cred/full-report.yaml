  - id: FE001
    title: 'Product architecture: shared control planes beneath member journeys'
    type: stack
    summary: >-
      A control-plane view separates the customer surface from workflow, data, persistence, and assurance layers
      evidenced in the assigned sources.
    data:
      layers:
        - label: Member journeys
          detail: Payments, rewards, credit, investments, commerce, travel, and vehicle services
          items:
            - label: Mobile member experience
              detail: A gated multi-product surface rather than a single bill-pay feature
        - label: Product orchestration
          detail: Line-of-business services and stateful transaction workflows
          items:
            - label: Platform OMS
              detail: Custom order types, attributes, state machines, and transition history
        - label: Personalization
          detail: Reusable attributes replace combinations of coarse boolean segments
          items:
            - label: UAS and LOB processors
              detail: Configured event inputs, business logic, namespaced schemas, and access control
        - label: Data movement and analysis
          detail: Change-data capture supplies real-time analysis and longer-horizon data use
          items:
            - label: CDC, real-time analytics, and data lake
              detail: The company account names Pinot and a data lake as downstream surfaces
        - label: Persistence and release control
          detail: Managed databases and automated blue-green change management
          items:
            - label: RDS/Aurora fleet
              detail: Validation, checkpoint migration, maintenance mode, rollback, and monitoring
        - label: Assurance
          detail: Observability, security review, data protection, and vendor-risk controls
          items:
            - label: Operational and trust controls
              detail: Management-described controls require independent audit evidence
    approximationNotes: >-
      The ordering is an analytical representation assembled from separate source accounts; it does not claim that CRED
      publishes this as its canonical stack.
    claimRefs:
      - CE005
      - CE008
      - CE011
      - CE012
  - id: FU001
    title: Customer journey and evidence boundaries
    type: journey-map
    summary: >-
      The observable journey spans eligibility, consumer use, merchant checkout, support, and product expansion, while
      retention remains unmeasured.
    data:
      nodes:
        - label: Eligibility
          stage: Member acquisition
          detail: Apply with an Indian mobile number and a credit score of at least 750.
          touchpoints:
            - Membership application
            - Credit-score check
        - label: Core member use
          stage: Payments
          detail: Pay supported credit-card bills and monitor credit information.
          touchpoints:
            - Card-bill payment
            - Credit-score refresh
        - label: Rewards and commerce
          stage: Engagement
          detail: Receive coins, cashback, discounts, or partner offers when eligible.
          touchpoints:
            - Rewards
            - Brand and seller offers
        - label: Merchant checkout
          stage: Commercial adoption
          detail: Select merchants can enable CRED Pay after onboarding and agreement.
          touchpoints:
            - Payment collection
            - Settlement dashboard
            - API integration
        - label: Support and reconciliation
          stage: Service recovery
          detail: Payment failures, refunds, chargebacks, disputes, and merchant support require multi-party handling.
          touchpoints:
            - In-app support
            - Merchant dispute handling
            - Settlement reconciliation
        - label: Product expansion
          stage: Cross-sell
          detail: The broader suite spans lending, wealth, insurance, UPI, wallet, and vehicle services.
          touchpoints:
            - Financial products
            - Payment products
            - Lifestyle services
    approximationNotes: >-
      Qualitative sequence assembled from current company materials; it does not imply measured conversion, retention,
      or a common population at each stage.
    claimRefs:
      - CU002
      - CU003
      - CU005
      - CU006
      - CU007
      - CU008
      - CU013
