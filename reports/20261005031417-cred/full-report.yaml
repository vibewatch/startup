    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              CRED is the trade name used by Dreamplug Technologies Private Limited, a Bengaluru-based Indian fintech
              founded in 2018 by Kunal Shah. The company describes itself as a members-only club for creditworthy
              consumers and says applicants need a credit score of at least 750. Its official page reports more than 25
              million members, but that is a registered-member measure rather than an active-user or paying-customer
              denominator. The operating model combines credit-card bill payment and rewards with broader payments,
              credit, wealth, insurance, and lifestyle propositions. Independent descriptions identify fees and
              commissions around transactions, lending, and merchant offers, but the assigned evidence does not disclose
              an audited revenue mix.
