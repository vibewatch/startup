      - - Base
        - Scale persists, but private economics and financing terms remain incomplete
        - Research more; use the $3.5B 2025 mark only as an entry reference, not fair value
        - Reconciled financials and complete Series H term disclosure
        - No closure of accounting, dilution, or exit-readiness gaps
      - - Bear
        - The 15.6x denominator is inapplicable, preferences impair common equity, or exit timing slips
        - No investment, or require a price below the 2025 mark after full waterfall analysis
        - Adverse term disclosure, weak segment cash conversion, or continued lack of filing
        - Any thesis-break condition persists after diligence
    notes: >-
      No probabilities or model-derived valuation ranges are assigned because the available evidence lacks audited
      forecasts, cash-flow inputs, and a preference waterfall.
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV008
      - CV009
      - CV013
      - CV014
      - CV016
