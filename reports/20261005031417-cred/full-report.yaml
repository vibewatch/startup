      - number: '3.3'
        title: Pricing, scale, and lock-in are not underwritable from the public set
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not provide like-for-like consumer prices, merchant take rates, reward
              subsidies, contract terms, or realized discounts across CRED and its alternatives. A student report
              recommends broader product coverage and more affordable subscription plans, but that low-reputation,
              company-assisted work is not a reliable pricing benchmark. Public scale data are also internally
              inconsistent: Inc42 lists 2,256 employees while QuantLogix lists 600, and QuantLogix labels its valuation
              estimate low confidence and round anchored. These conflicts do not determine competitive standing; they
              demonstrate why vendor-level diligence is necessary. The next underwriting step is a current,
              product-matched comparison using official competitor pricing, regulatory permissions, reward economics,
              retention, multi-homing, and customer acquisition data.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP008
              - CP009
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Multi-homing limits hard lock-in
            body: >-
              Public commentary describes low switching costs and simultaneous use of multiple financial apps. Rewards
              and brand may increase preference, but the retained evidence does not prove exclusive behavior or durable
              retention.
            calloutType: risk
            claimRefs:
              - CP007
          - type: callout
            title: Underwrite the partner-and-brand system, not the payment feature
            body: >-
              Competitive diligence should test reward-supply economics, partner exclusivity, cohort retention,
              cross-product conversion, and the cost of maintaining premium brand salience.
            calloutType: recommendation
            claimRefs:
