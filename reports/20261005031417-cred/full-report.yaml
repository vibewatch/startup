    title: Recommendation logic
    type: flow
    summary: >-
      The decision path separates observable scale and financing from the unresolved evidence needed to underwrite price
      and exit.
    data:
      nodes:
        - id: member-scale
          label: Company-claimed scale
          detail: More than 25M members; eligibility score of at least 750
        - id: round
          label: Latest financing
          detail: $900M mixed primary/secondary transaction at $4.5B post-money
        - id: multiple
          label: Reported price lens
          detail: 15.6x on $290M round-associated revenue
        - id: confidence
          label: Price-quality check
          detail: Round anchored, low-confidence estimate; not a live market price
        - id: gaps
          label: Required private evidence
          detail: Terms, cap table, audited denominator, margins, and loss exposure
        - id: decision
          label: Decision
          detail: Research more; high risk and stretched at the disclosed mark
      edges:
