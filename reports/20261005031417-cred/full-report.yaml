  - id: FM001
    title: India Consumer Credit Funnel and CRED Addressable Member Pyramid
    type: pyramid
    summary: >-
      Structural tapering from total Indian digital fintech transaction volume down to prime credit cardholders and
      CRED's verified active membership.
    data:
      items:
        - label: India Digital Fintech Macro Base (₹9.13 Lakh Cr / $110B USD in 2024)
          value: 110000
          depth: 1
          description: Total fintech transactions across India projected to expand to ₹35 lakh crore ($420B) by 2029.
        - label: Urban Smartphone Financial App Users (58% Urban Adoption)
          value: 65000
          depth: 2
          description: Urban smartphone users actively utilizing mobile financial management tools.
        - label: Total Credit Card Holders in India (62 Million Cardholders in 2021)
          value: 62
          depth: 3
          description: Active credit card population representing roughly 3 cards per 100 people nationwide.
        - label: Prime Creditworthy Tier (30 Million Individuals with 750+ CIBIL Score)
          value: 30
          depth: 4
          description: Affluent borrowing demographic accounting for roughly 70% of total national credit card spend.
        - label: CRED Captured Member Base (25+ Million Verified Club Members)
          value: 25
          depth: 5
          description: Verified members admitted with 750+ score, capturing over 25% of top-tier cardholders.
        - label: Active Cross-Sell Multi-Product Users (Lending, Wealth & Insurance)
          value: 10
          depth: 6
          description: Estimated members adopting monetized products including CRED Cash, Kuvera, and motor insurance.
    approximationNotes: >-
      Pyramid layers represent structural user segment volumes and macro transaction values across published industry
      data.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM005
      - CM007
      - CM008
  - id: FP001
    title: 'Ordinal positioning map: premium focus versus product breadth'
    type: quadrant
    summary: >-
      CRED occupies the premium-and-broad corner by design, but incumbents retain distribution or relationship
      advantages that the ordinal map does not measure.
    data:
      points:
        - label: CRED
          x: 5
          'y': 5
          detail: Gated premium identity with an expanded financial-services suite.
        - label: Mass payment apps
          x: 1
          'y': 5
          detail: Broad-market access and high-frequency payment distribution.
        - label: Card-issuing banks
          x: 3
          'y': 4
          detail: Own the account relationship and may bundle multiple financial services.
        - label: Specialist fintechs
          x: 3
          'y': 2
          detail: Focused product depth without evidence of CRED's full lifestyle positioning.
        - label: Commerce marketplaces
          x: 2
          'y': 3
          detail: Broad shopping distribution but only adjacent overlap with CRED.
        - label: Autopay / direct bank payment
          x: 1
          'y': 1
          detail: Efficient substitute for the payment task without a broader engagement layer.
    approximationNotes: >-
      Analyst ordinal scores from 1 (low) to 5 (high): x is premium/exclusive focus and y is evidenced product breadth;
      scores are directional, not measured market share or performance.
    claimRefs:
      - CP016
