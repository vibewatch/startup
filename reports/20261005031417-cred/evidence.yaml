evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: scale-and-financials
    missingEvidence: >-
      Audited current-period revenue, profitability, cash, active-user cohorts, and a dated payroll headcount reconciled
      to the legal entity perimeter.
    whyItMatters: >-
      Public figures use conflicting periods and denominators, preventing a reliable cover-metric baseline or
      operating-leverage assessment.
    diligencePath: >-
      Obtain audited FY26 financials, monthly cohort exports, bank balances, and an HRIS headcount report reconciled to
      consolidated entities.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board roster, committee structure, delegated authorities, interim CEO mandate, succession plan, and
      investor consent or observer rights.
    whyItMatters: >-
      The founder's move to WhatsApp creates key-person and decision-right uncertainty that public leadership profiles
      cannot resolve.
    diligencePath: >-
      Request the board pack, organizational chart, employment and transition agreements, reserved-matters schedule, and
      current shareholder agreement.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: >-
      Executed round documents, fully diluted cap table, secondary proceeds, debt facilities, liquidation preferences,
      anti-dilution rights, and cash remaining from primary financings.
    whyItMatters: >-
      Funding raised cannot be treated as cash available, and headline post-money valuation does not reveal ownership
      economics or downside rights.
    diligencePath: >-
      Obtain the capitalization ledger, financing agreements, debt schedule, bank statements, and
      primary-versus-secondary proceeds bridge.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholders
    missingEvidence: >-
      A complete, current investor and stakeholder roster with legal entity, ownership percentage, voting power, and
      transaction history.
    whyItMatters: The public map identifies major names but cannot establish control, concentration, or the full preference stack.
    diligencePath: >-
      Reconcile the statutory shareholder register and fully diluted cap table to every financing and secondary
      transfer.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: product-tier-arpu
    missingEvidence: >-
      Disclosed unit economic breakdown of average revenue per user (ARPU) across distinct CRED product tiers including
      lending (CRED Cash), wealth management (Kuvera), and motor insurance distribution.
    whyItMatters: >-
      Without segmented ARPU disclosure, evaluating customer lifetime value and cross-sell conversion margins across the
      25 million member base relies on top-level corporate revenue run-rates.
    diligencePath: >-
      Examine private placement memoranda, future statutory filings with the Registrar of Companies (MCA), or investor
      presentations released during pre-IPO roadshows.
    relatedQuestionRefs:
      - QM005
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Current product-matched pricing, merchant take rates, reward subsidies, discount terms, and paid-tier adoption for
      CRED and named alternatives.
    whyItMatters: >-
      Without comparable economics, diligence cannot determine whether premium positioning creates pricing power or
      merely higher engagement cost.
    diligencePath: >-
      Collect official pricing and merchant contracts from CRED, Paytm, PhonePe, major card issuers, and specialist
      fintechs, then normalize by product and transaction type.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Cohort retention, multi-homing rates, product-level engagement, reward redemption, cross-product conversion, and
      partner exclusivity.
    whyItMatters: These metrics distinguish durable ecosystem preference from easily reversible use of a rewards interface.
    diligencePath: >-
      Request monthly cohorts, product overlap, redemption economics, partner concentration, and churn reasons from
      management and validate against user-level research.
    relatedQuestionRefs:
      - QP005
      - QP006
      - QP007
  - type: conflicting-data
    severity: material
    topic: workforce-scale
    missingEvidence: A dated, definition-consistent CRED employee count and functional headcount split.
    whyItMatters: Conflicting public estimates prevent reliable comparison of operating scale and investment intensity.
    diligencePath: >-
      Obtain the current payroll roster and reconcile employees, contractors, and acquired-company personnel against
      statutory filings.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: enumeration-incomplete
    severity: material
    topic: competitor-landscape
    missingEvidence: >-
      Current official product, pricing, security, regulatory, and customer evidence for each named direct and adjacent
      competitor.
    whyItMatters: >-
      Secondary summaries cannot support a definitive feature matrix or identify which entrant has the strongest
      product-level advantage.
    diligencePath: >-
      Run a competitor-by-competitor official-source review covering Paytm, PhonePe, Google Pay, major issuing banks,
      lending aggregators, and relevant commerce platforms.
    relatedQuestionRefs:
      - QP001
      - QP003
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: segment-monetization-breakdown
    missingEvidence: >-
      Audited product-level revenue breakdown, gross take rates across payments and lending, and net interest margin
      contribution from Newtap Finance.
    whyItMatters: >-
      Without product segment revenue splits, analysts cannot determine whether revenue growth is sustainably driven by
      recurring fees or dependent on volatile balance-sheet lending spreads.
    diligencePath: Request statutory segment reporting schedules and internal management accounts under NDA.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
  - id: gap-credit-losses
    type: private-evidence-only
    severity: blocking
    topic: lending-loss-performance
    missingEvidence: >-
      Historical vintage delinquency curves, first-loss default guarantee (DLG) invocation history, and recovery rates
      for CRED Cash and CRED Mint portfolios.
    whyItMatters: >-
      Facilitating $2.5B+ in credit without public loss rates exposes investors to unquantified downside risk if
      consumer default rates increase.
    diligencePath: Review lender partner monthly servicing reports and statutory filings of Newtap Finance.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: security
    missingEvidence: >-
      Independent security certifications, audit scope, penetration-test results, privacy-control testing, and a
      complete incident register.
    whyItMatters: Management descriptions do not establish control effectiveness or the absence of security and privacy incidents.
    diligencePath: >-
      Request current SOC or ISO reports, penetration-test summaries, data-flow maps, incident logs, and remediation
      evidence under NDA.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A public repository, package registry, engineering forum, practitioner talk, or other measurable
      developer-adoption surface tied to CRED.
    whyItMatters: >-
      Without a practitioner signal, maintainability, engineering leverage, and external technical credibility cannot be
      independently assessed.
    diligencePath: >-
      Request the internal open-source inventory, repository activity, dependency policy, developer-product metrics, and
      named practitioner references.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: >-
      Platform-wide uptime, payment success, latency, support resolution, defect, rollback, and incident metrics by
      product and partner.
    whyItMatters: >-
      A successful database-change program does not establish reliability across every member workflow or external
      dependency.
    diligencePath: >-
      Review twelve months of service-level dashboards, severity-one and severity-two postmortems, partner error
      budgets, and reconciliation outcomes.
    relatedQuestionRefs:
      - QE005
      - QE010
    relatedTableRefs:
      - TE002
      - TE003
  - type: stale
    severity: material
    topic: roadmap
    missingEvidence: >-
      A run-date product catalog and roadmap showing launch status, ownership, deprecations, adoption gates, and planned
      technical milestones.
    whyItMatters: >-
      Historical engineering posts identify capabilities but cannot establish the current availability or priority of
      every product line.
    diligencePath: >-
      Obtain the current product register, quarterly roadmap, launch scorecards, deprecation log, and architecture
      decision records.
    relatedQuestionRefs:
      - QE002
      - QE009
    relatedTableRefs:
      - TE001
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete list of named merchant customers with contract dates, production or pilot status, deployment scope, and
      measured outcomes.
    whyItMatters: >-
      Supported banks, networks, and unnamed merchant cohorts do not establish customer reference quality, deployment
      conversion, or repeatable value.
    diligencePath: >-
      Request a customer roster and select three references across large, mid-market, and digital-native merchants for
      contract and outcome checks.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Monthly active transactor cohorts, repeat-payment frequency, NRR, GRR, churn, renewal rates, contract length, and
      product-level conversion.
    whyItMatters: >-
      Registered-member scale and service breadth cannot demonstrate durable consumer behavior or recurring merchant
      economics without these measures.
    diligencePath: >-
      Obtain monthly consumer cohorts and merchant renewal schedules for the latest 24 months, reconciled to product
      revenue and gross contribution.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Revenue, payment volume, and gross contribution concentration by merchant, lender, bank, card network, product,
      and distribution channel.
    whyItMatters: >-
      The public relationship list shows multiple dependencies but cannot reveal whether the loss or repricing of one
      counterparty would impair economics.
    diligencePath: >-
      Request top-10 concentration schedules, counterparty contract terms, and sensitivity cases for the largest payment
      and financial-product partners.
    relatedQuestionRefs:
      - QU010
  - type: missing-source
    severity: material
    topic: regulatory-perimeter
    missingEvidence: >-
      Original RBI and IRDAI authorization records, licence conditions, legal-entity mapping, inspection findings,
      litigation records, and open remediation items.
    whyItMatters: >-
      Secondary reports cannot establish whether every regulated product and partner arrangement is within scope or
      whether material conditions remain open.
    diligencePath: >-
      Verify CRED and relevant subsidiaries in regulator registries, obtain authorization orders and inspection
      correspondence, and commission jurisdiction-specific litigation and enforcement searches.
    relatedQuestionRefs:
      - QR001
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: operational-controls
    missingEvidence: >-
      Incident register, uptime and reconciliation metrics, fraud-loss data, penetration tests, access reviews,
      complaint trends, and tested recovery procedures.
    whyItMatters: >-
      Publicly described scale makes payment, authorization, and recovery failures potentially consequential, while
      scenario lists do not establish actual control maturity.
    diligencePath: >-
      Review 24 months of incident and exception data, independently sample transaction reconciliation, inspect security
      assessments, and test disaster-recovery and partner-failover procedures.
    relatedQuestionRefs:
      - QR002
      - QR003
      - QR009
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: financial-and-partner-exposure
    missingEvidence: >-
      Partner-level volume and revenue concentration, lender loss and guarantee exposure, product margins, burn,
      working-capital needs, unrestricted cash, debt, and funding-round terms.
    whyItMatters: >-
      Revenue and funding raised do not establish contribution margin, cash available, loss allocation, refinancing
      need, or resilience to partner repricing.
    diligencePath: >-
      Obtain audited financials, monthly cash bridge, product contribution margins, lender and payment-partner
      concentration, guarantee schedules, covenant packages, and capitalization documents.
    relatedQuestionRefs:
      - QR004
      - QR008
      - QR009
    relatedTableRefs:
      - TR003
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A dated company headcount by function and geography plus a complete current requisition list.
    whyItMatters: Public estimates of 600 and 2,256 employees are too far apart to support an execution-capacity conclusion.
    diligencePath: >-
      Request HRIS headcount snapshots, attrition, critical vacancies, span-of-control data, and hiring-plan variance
      from management.
    relatedQuestionRefs:
      - QR007
  - type: private-evidence-only
    severity: material
    topic: transaction-structure
    missingEvidence: >-
      Series H term sheet, primary-versus-secondary allocation, preference stack, option-pool dilution, and fully
      diluted cap table.
    whyItMatters: Headline transaction size cannot establish cash received or common-equity value without these terms.
    diligencePath: Obtain the executed financing documents, current cap table, and a counsel-prepared preference waterfall.
    relatedQuestionRefs:
      - QV007
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: >-
      Board-approved IPO plan, filing timetable, audited public-company readiness assessment, and named underwriting
      process.
    whyItMatters: Without current exit evidence, neither an IPO date nor an exit multiple can support return underwriting.
    diligencePath: >-
      Request board materials and adviser mandates, then verify any filing directly with the relevant securities
      regulator.
    relatedQuestionRefs:
      - QV008
  - type: conflicting-data
    severity: material
    topic: capital-raised
    missingEvidence: >-
      A company-reconciled schedule separating primary funding, secondary transfers, debt, and cumulative transaction
      value.
    whyItMatters: Public totals from $1.47 billion to $2.0 billion use incompatible definitions and cannot establish cash available.
    diligencePath: Reconcile statutory filings and financing documents to bank receipts and the current capitalization ledger.
