company:
  name: "CRED"
chapter:
  number: 8
  title: "Valuation"
  summary: "CRED's June 2026 financing reset the latest disclosed mark to $4.5 billion, above the 2025 down-round mark but below the 2022 peak. Public evidence supports a research-more recommendation because the reported 15.6x revenue multiple rests on an opaque revenue denominator and the round's primary, secondary, preference, and dilution terms are not fully disclosed."
sections:
  - id: "financing-and-price-context"
    title: "Financing and Price Context"
    body: "Independent coverage consistently describes a $900 million Series H transaction led by Meta at a $4.5 billion post-money valuation, but also says the transaction combined primary issuance with secondary share purchases. That distinction matters: the headline transaction size is neither the amount of new cash received by CRED nor evidence of cash currently available. The latest mark recovered from Multiples' $3.5 billion June 2025 reference, yet remained below its $6.4 billion June 2022 reference. Public aggregators also disagree on cumulative capital raised, reporting approximately $1.47 billion of disclosed primary funding, $1.89 billion-plus of total funding, and $2.0 billion of total capital. Those definitions cannot be reconciled from the prefetched evidence, so they should not be used interchangeably in return or runway calculations."
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV010"
      - "CV011"
      - "CV012"
  - id: "thesis-anti-thesis-and-comparables"
    title: "Thesis, Anti-Thesis, and Comparables"
    body: "The thesis is that CRED has assembled a large, screened distribution base: the company says it serves more than 25 million creditworthy members and requires a score of at least 750 for membership. The anti-thesis is valuation discipline. Multiples records $290 million of revenue beside the June 2026 round and calculates a 15.6x multiple, but its methodology says round-associated revenue may be run-rate revenue or last-twelve-month revenue. That denominator ambiguity prevents treating 15.6x as an audited trailing multiple. Multiples' selected fintech set spans roughly 1.2x to 17.2x revenue; it is useful as a directional screen, not an independent benchmark, because the companies differ in geography, business mix, profitability, and public/private status. QuantLogix separately labels its round-anchored estimate low confidence, reinforcing that the last financing mark is not a continuously traded price."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV008"
      - "CV009"
      - "CV013"
      - "CV015"
    tableRefs:
      - "TV002"
  - id: "scenarios-and-entry-discipline"
    title: "Scenarios and Entry Discipline"
    body: "Scenario analysis should use disclosed marks as guardrails rather than manufacture a precise fair value. A bull outcome requires audited evidence that the reported revenue denominator is comparable and durable enough to justify a price above the $4.5 billion round mark. The base case keeps the decision at research-more and treats the $3.5 billion 2025 mark as a negotiating reference, not intrinsic value, until round terms and segment economics are available. The bear case is no investment, or a price below the 2025 mark, if the 15.6x denominator proves inapplicable, financing preferences impair common-equity value, or an IPO path remains unsubstantiated. No scenario is assigned a numerical probability because the pool contains no audited segment forecasts, cash-flow model, preference waterfall, or secondary-market evidence sufficient to estimate one."
    claimRefs:
      - "CV004"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV013"
      - "CV014"
      - "CV016"
    tableRefs:
      - "TV003"
  - id: "recommendation-and-exit-readiness"
    title: "Recommendation and Exit Readiness"
    body: "The recommendation is research-more with medium confidence, high risk, and a stretched valuation stance at the latest disclosed $4.5 billion mark. This is not a negative judgment on product quality; it is a price-and-evidence judgment. CRED's scale and new strategic capital are meaningful, but neither establishes cash generation, common-equity value, or an investible return. QuantLogix reports no public S-1 and explicitly describes the valuation as a last-round mark rather than a live price. Before underwriting, obtain the Series H primary/secondary split, preference stack, fully diluted cap table, audited revenue definition, segment contribution margins, credit-loss exposure, and board-approved IPO plan. A credible filing, reconcilable audited denominator, and clear common-equity waterfall could improve the view; adverse terms or continued opacity would break the thesis."
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV008"
      - "CV009"
      - "CV013"
      - "CV014"
      - "CV016"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
