  topStrengths:
    - Scaled premium distribution with 25M+ members and a 750-score membership gate.
    - FY24 revenue reached ₹2,473 crore while operating losses narrowed 41%, indicating improving operating leverage.
    - >-
      Product breadth now extends beyond card bill pay into UPI, wallet, lending, wealth, insurance, travel, and vehicle
      services.
    - >-
      March 2026 payment-aggregator authorization and June 2026 strategic capital improved regulatory and financing
      footing.
  topRisks:
    - >-
      Public disclosure remains too thin on segment mix, take rates, gross margin, credit losses, and runway to
      underwrite the business cleanly.
    - >-
      Business complexity and partner dependence widened across payments, lending, insurance, and vehicle services,
      increasing regulatory and execution risk.
    - >-
      The latest financing mark is not a live market price and the Series H primary, secondary, and preference terms
      remain opaque.
    - >-
      User-scale disclosures rely on different definitions such as members, users, MAU, and traffic, limiting confidence
      in customer-quality and retention narratives.
  unresolvedGaps:
    - Segment revenue mix, payment take rates, gross margin, and contribution margin by product line.
    - Credit performance by lender, DLG exposure and invocation history, collections outcomes, and net loss assumptions.
    - Retention durability, churn, GRR or NRR, and product-level monetization across the member base.
    - Detailed June 2026 round terms, secondary mix, preference protections, and current cap-table context.
