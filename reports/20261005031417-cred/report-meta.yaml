companyProfile:
  summary: >-
    CRED is a Bengaluru-based, members-only consumer-fintech platform founded by Kunal Shah in 2018. The service gates
    membership at a 750 credit score and combines card-bill payment and rewards with a broader suite spanning UPI,
    lending, wealth, insurance, wallet, travel, and vehicle services. The company says it serves more than 25 million
    members, but public evidence still does not resolve active usage, product economics, or retention, and leadership
    shifted in June 2026 when Kunal Shah reportedly moved to WhatsApp globally and Miten Sampat became interim CEO.
