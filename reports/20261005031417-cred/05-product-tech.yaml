          items:
            - label: "Mobile member experience"
              detail: "A gated multi-product surface rather than a single bill-pay feature"
        - label: "Product orchestration"
          detail: "Line-of-business services and stateful transaction workflows"
          items:
            - label: "Platform OMS"
              detail: "Custom order types, attributes, state machines, and transition history"
        - label: "Personalization"
          detail: "Reusable attributes replace combinations of coarse boolean segments"
          items:
            - label: "UAS and LOB processors"
              detail: "Configured event inputs, business logic, namespaced schemas, and access control"
        - label: "Data movement and analysis"
          detail: "Change-data capture supplies real-time analysis and longer-horizon data use"
          items:
            - label: "CDC, real-time analytics, and data lake"
              detail: "The company account names Pinot and a data lake as downstream surfaces"
        - label: "Persistence and release control"
          detail: "Managed databases and automated blue-green change management"
          items:
            - label: "RDS/Aurora fleet"
              detail: "Validation, checkpoint migration, maintenance mode, rollback, and monitoring"
        - label: "Assurance"
          detail: "Observability, security review, data protection, and vendor-risk controls"
          items:
            - label: "Operational and trust controls"
              detail: "Management-described controls require independent audit evidence"
    approximationNotes: >-
      The ordering is an analytical representation assembled from separate source
      accounts; it does not claim that CRED publishes this as its canonical stack.
    claimRefs: ["CE005", "CE008", "CE011", "CE012"]
