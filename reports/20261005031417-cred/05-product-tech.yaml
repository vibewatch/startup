      - ["Credit-card and household payments", "Cardholder / bill payer", "Core bill-pay product plus utilities and rent on official site", "Single member interface with rewards", "Payment success, outage, dispute, and support-service levels"]
      - ["Rewards and commerce", "Member and participating brand", "Part of the multi-genre product surface described by CRED", "Personalized eligibility and premium-member positioning", "Active merchant count, redemption rate, breakage, and partner concentration"]
      - ["Credit and investments", "Borrower, investor, or saver", "CRED Cash and CRED Mint named in the 2023 engineering account", "Cross-sell into a pre-screened member base", "Partner responsibilities, credit performance, suitability, and current availability"]
      - ["Travel and vehicle services", "Traveler or vehicle owner", "CRED Escapes and CRED garage named in the 2023 engineering account", "Adjacent high-value workflows inside the member app", "Geographic coverage, active usage, fulfillment ownership, and roadmap"]
    notes: >-
      Product presence is based on current official-site text and historical
      company engineering posts; null quantitative operating metrics are not
      estimated and remain diligence requests.
    claimRefs: ["CE001", "CE002", "CE003", "CE006", "CE015"]
  - id: "TE002"
    title: "Workflow and use-case evidence"
    columns:
      - "User job"
      - "Prior / underlying workflow"
      - "CRED solution"
      - "Measurable public benefit"
      - "Limitation"
    rows:
      - ["Qualify for membership", "Establish creditworthiness outside the app", "Score-gated application using a 750 threshold", null, "No public funnel, approval, or re-engagement metrics"]
      - ["Discover a relevant product or reward", "Separate product logic and coarse boolean segments", "Shared attributes and line-of-business-owned rules", "Real-time analytics feed described as under 10-second latency", "No controlled evidence of conversion or engagement lift"]
      - ["Complete and track an order", "Product-specific and duplicated order systems", "Central platform OMS with custom attributes and state machines", null, "No public order success rate or support-resolution outcome"]
      - ["Maintain production databases", "Coordinated in-place changes and long maintenance windows", "Automated RDS/Aurora blue-green orchestration and rollback", "Two-minute average switchover and 85% lower operational effort reported by AWS", "Supplier case study; not a platform-wide availability series"]
    notes: >-
      Benefits are retained only where the source gives a named measure; nulls
      mean the allocated public evidence did not provide a comparable outcome.
    claimRefs: ["CE001", "CE004", "CE005", "CE007", "CE008", "CE010"]
  - id: "TE003"
    title: "Technology and operating architecture"
    columns:
      - "Layer / component"
      - "Role"
      - "Key dependency"
      - "Risk or diligence question"
    rows:
      - ["Member application", "Presents payments, rewards, credit, commerce, travel, and vehicle journeys", "Banks, networks, lenders, merchants, and other partners", "Which flows are owned, embedded, referred, or partner-operated?"]
      - ["Line-of-business processors", "Consume streams and execute configured business rules", "Correct topics, JavaScript logic, runtime capacity, and monitoring", "How are rule changes reviewed, tested, and rolled back?"]
      - ["User Attribute Service", "Stores namespaced, schema-enforced member attributes", "Access controls, Avro compatibility, and source-event quality", "What are freshness, correction, deletion, and consent service levels?"]
      - ["Order Management System", "Central order record with custom attributes and state machines", "Product teams and fulfillment services emitting valid transitions", "What is the reconciliation process for stuck or contradictory states?"]
      - ["Analytics and data plane", "Feeds Pinot-style real-time analysis and a data lake through CDC", "Pipeline completeness, schema governance, and data quality", "What are lineage, retention, and model-feature controls?"]
      - ["Database control plane", "Coordinates blue-green change, validation, CDC migration, and rollback", "AWS RDS/Aurora, DMS, Debezium, ECS, DNS, and service readiness", "Do reported migration outcomes extend to all production data stores?"]
      - ["Security and observability", "Monitors services and applies design, encryption, access, and vendor controls", "Internal tooling, KMS, threat feeds, and cross-functional review", "Which controls are independently audited and what incidents occurred?"]
    notes: >-
      This is a source-bounded operating model, not a complete inventory; component
      ownership and controls not named in the allocated sources are not inferred.
    claimRefs: ["CE002", "CE004", "CE005", "CE007", "CE008", "CE011", "CE012", "CE013"]
