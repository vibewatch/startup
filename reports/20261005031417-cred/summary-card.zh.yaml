  topStrengths:
    - 依靠 25m+（超过 2500 万）会员和 750 分信用门槛，做出了高端客群分发规模。
    - FY24 营收达到 ₹2,473 crore，经营亏损收窄 41%，说明经营杠杆正在改善。
    - 产品版图已从信用卡账单支付扩展到 UPI、钱包、借贷、财富管理、保险、旅行和车辆服务。
    - 2026 年 3 月获得支付聚合商授权、2026 年 6 月拿到战略资本，监管和融资基础都有改善。
  topRisks:
    - 分部结构、抽成率、毛利率、信用损失和资金可支撑周期的公开披露仍然过薄，难以干净地评估这项业务。
    - 支付、借贷、保险和车辆服务都变得更复杂，也更依赖合作伙伴，监管与执行风险随之上升。
    - 最新融资估值不是实时市场价格，Series H 的增发、老股转让和优先权条款仍不透明。
    - 用户规模披露混用了会员、用户、MAU 和流量等不同口径，削弱了对客户质量和留存叙事的信心。
  unresolvedGaps:
    - 分部收入结构、支付抽成率、毛利率，以及各产品线的贡献利润率。
    - 按贷款方拆分的信用表现、DLG 风险敞口和调用历史、催收结果及净损失假设。
    - 会员群体的留存持久性、流失率、GRR 或 NRR，以及各产品的变现情况。
    - 2026 年 6 月融资轮的详细条款、老股转让占比、优先权保护和当前股权表背景。
