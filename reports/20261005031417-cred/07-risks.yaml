chapter:
  number: 7
  title: "Risks"
  summary: "CRED's company-claimed 25 million-member scale and breadth across payments, lending, wealth, and insurance raise the consequence of payment-state, licensing, and partner failures. Public evidence supports some perimeter mitigants, including reported payment-aggregator authorization and insurance distribution licensing, but does not establish incident history, control effectiveness, credit-loss exposure, partner concentration, or audited liquidity."
sections:
  - id: "regulatory-legal-perimeter"
    title: "Regulatory and legal perimeter"
    body: "CRED's risk perimeter is broader than a single rewards application. Its official page describes card-bill payments, credit-score access through a CIBIL soft inquiry, and support for major banks and card schemes, while independent profiles describe expansion into lending, wealth, UPI, and insurance. A current profile reports final Reserve Bank of India payment-aggregator authorization, and a tertiary source reports an IRDAI corporate-agency licence for motor-insurance distribution. Those are meaningful perimeter mitigants, not proof that every product, partner arrangement, licence condition, or consumer-protection control is compliant. Original regulator orders, licence conditions, inspection findings, litigation searches, and product-level legal-entity mappings remain required before underwriting residual exposure."
    claimRefs:
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR011"
      - "CR012"
      - "CR013"
    tableRefs:
      - "TR001"
  - id: "operational-security-exposure"
    title: "Operational, quality, and security exposure"
    body: "The official membership claim of more than 25 million creditworthy members increases the potential blast radius of payment or identity failures, although it does not disclose active-user or transaction denominators. An independent interview-preparation guide identifies relevant hypothetical failure modes: unauthorized or incorrect debits, duplicate payments, false-success states, delayed callbacks, object-level authorization bypass, and unreconciled pending transactions. That guide is not evidence of CRED's architecture, incidents, or controls. The reviewed public material provides no incident-frequency series, uptime history, penetration-test results, reconciliation exceptions, or control attestations; absence of those disclosures is a diligence gap, not evidence that incidents have not occurred."
    claimRefs:
      - "CR001"
      - "CR010"
      - "CR013"
    tableRefs:
      - "TR002"
  - id: "partner-financial-execution"
    title: "Partner, financial, and execution dependencies"
    body: "CRED states that its payment experience supports major Indian issuers and Visa, Mastercard, American Express, and RuPay, making bank, scheme, bureau, and settlement connectivity material dependencies even though public evidence does not quantify concentration or contractual redundancy. Financial capacity is also difficult to underwrite from the assigned evidence: Inc42 reports FY25 revenue of at least ₹2,535.7 crore and total funding above $1.89 billion, while another profile reports a $900 million June 2026 round. Those figures are not ARR, margin, cash, or runway. Staffing data are internally inconsistent across independent profiles, and the fetched official careers page exposes no role count, so execution capacity cannot be inferred from the public hiring surface."
    claimRefs:
      - "CR002"
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR014"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR003"
  - id: "mitigations-monitors-kill-criteria"
    title: "Mitigations, monitors, and thesis-break criteria"
    body: "Public evidence supports only perimeter-level mitigants: broad rail support, reported payment-aggregator authorization, and reported insurance licensing. It does not establish tested failover, reconciliation accuracy, fraud-loss limits, credit-partner performance, audited cash, or licence-condition compliance. Investment diligence should therefore monitor unresolved-payment aging, duplicate-payment and authorization exceptions, partner-level volume concentration, regulator observations, grievance trends, credit losses and guarantee exposure, and unrestricted liquidity. Thesis-break triggers should include loss or suspension of a core authorization, repeated material reconciliation failures, a substantiated privacy or authorization-control breakdown, inability to evidence lender-level loss economics, or liquidity falling below management's board-approved operating threshold; the exact thresholds must come from private records rather than invented public estimates."
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR009"
      - "CR010"
      - "CR012"
      - "CR013"
      - "CR015"
      - "CR016"
    figureRefs:
      - "FR001"
