      - ["Specialist lending and comparison apps", "Adjacent fintechs", "Not quantified in retained evidence", "Borrowers and financial-product shoppers", "Focused credit discovery or lending workflows", "Named product-level benchmarks and regulatory posture remain unverified"]
      - ["Bank autopay / direct bill payment", "Status quo substitute", "Not applicable", "Cardholders prioritizing convenience", "Removes manual bill-payment effort without another rewards app", "Service quality, failure rates, and rewards trade-offs are unknown"]
    notes: "Partial landscape from the assigned prefetched sources; all unverified cells are explicitly marked and reported scale figures are not normalized."
    claimRefs: [CP001, CP002, CP005, CP006, CP008, CP009, CP013, CP014]
  - id: TP002
    title: Capability and control comparison
    columns:
      - Buying criterion
      - CRED
      - Mass payment apps
      - Card-issuing banks
      - Status quo / internal workaround
    rows:
      - ["Credit-card bill payment", "Core reported capability", "Reported alternative capability", "Native or direct capability", "Manual payment or autopay"]
      - ["Eligibility and identity", "750+ score gate and members-only positioning", "Broad-market access", "Existing customer relationship", "No separate club membership"]
      - ["Rewards and engagement", "Cashback, coins, perks, and partner experiences", "Rewards may exist; retained evidence lacks a current comparison", "Issuer rewards may exist; bank-level terms unknown", "No incremental CRED-style reward layer established"]
      - ["Financial-product breadth", "UPI, lending, wealth, insurance, and co-branded cards reported", "Broad payments footprint; retained product detail is incomplete", "Potentially broad but bank-specific", "Narrow task completion"]
      - ["Distribution and control", "Owns premium brand and member interface; depends on partners and underlying rails", "Large consumer distribution", "Owns card account and servicing relationship", "Embedded in existing banking workflow"]
    notes: "Capability labels reflect only retained evidence; 'unknown' or qualified cells are not negative capability judgments."
    claimRefs: [CP002, CP003, CP004, CP005, CP007, CP009, CP010]
  - id: TP003
    title: Pricing and packaging evidence
    columns:
      - Alternative
      - Public price or contract model
      - Included capabilities evidenced
      - Unknowns
      - Competitive implication
    rows:
      - [CRED, "Comparable current consumer or merchant pricing not established", "Bill payment, rewards, UPI, lending, wealth, insurance, and cards", "Reward subsidy, take rates, realized pricing, and paid-tier adoption", "Cannot test whether premium positioning creates pricing power"]
      - ["Mass payment apps", "Comparable current pricing not established", "Payments and bill-payment alternatives reported", "Product-level fees, rewards, and merchant economics", "Reach advantage cannot be converted into an economic comparison"]
      - ["Card-issuing banks", "Bank-specific pricing not retained", "Direct account servicing and autopay substitute", "Rewards, waiver rules, failure handling, and cross-sell economics", "Control of the primary relationship may offset a weaker engagement layer"]
      - ["Specialist fintechs and marketplaces", "Product-specific pricing not retained", "Lending, comparison, or commerce substitutes reported", "Fees, regulatory permissions, conversion, and customer overlap", "Focused providers may unbundle CRED one product at a time"]
    notes: "No like-for-like pricing source was available in the assigned pool; this table records the missing evidence rather than inferring zero price."
    claimRefs: [CP003, CP004, CP007, CP008, CP009, CP015]
figures:
  - id: FP001
    title: "Ordinal positioning map: premium focus versus product breadth"
    type: quadrant
    summary: >-
      CRED occupies the premium-and-broad corner by design, but incumbents retain
      distribution or relationship advantages that the ordinal map does not measure.
    data:
      points:
        - label: CRED
          x: 5
          y: 5
          detail: "Gated premium identity with an expanded financial-services suite."
        - label: "Mass payment apps"
          x: 1
          y: 5
          detail: "Broad-market access and high-frequency payment distribution."
        - label: "Card-issuing banks"
          x: 3
          y: 4
          detail: "Own the account relationship and may bundle multiple financial services."
        - label: "Specialist fintechs"
          x: 3
          y: 2
          detail: "Focused product depth without evidence of CRED's full lifestyle positioning."
        - label: "Commerce marketplaces"
          x: 2
          y: 3
          detail: "Broad shopping distribution but only adjacent overlap with CRED."
        - label: "Autopay / direct bank payment"
          x: 1
          y: 1
          detail: "Efficient substitute for the payment task without a broader engagement layer."
    approximationNotes: "Analyst ordinal scores from 1 (low) to 5 (high): x is premium/exclusive focus and y is evidenced product breadth; scores are directional, not measured market share or performance."
    claimRefs: [CP016]
callouts:
  - calloutType: risk
    title: Multi-homing limits hard lock-in
    body: >-
      Public commentary describes low switching costs and simultaneous use of
      multiple financial apps. Rewards and brand may increase preference, but the
      retained evidence does not prove exclusive behavior or durable retention.
    claimRefs: [CP007]
  - calloutType: recommendation
    title: Underwrite the partner-and-brand system, not the payment feature
    body: >-
      Competitive diligence should test reward-supply economics, partner
      exclusivity, cohort retention, cross-product conversion, and the cost of
      maintaining premium brand salience.
    claimRefs: [CP003, CP004, CP010, CP016]
