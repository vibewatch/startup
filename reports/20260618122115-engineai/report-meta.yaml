companyProfile:
  summary: >
    EngineAI (Shenzhen EngineAI Robotics Technology Co., Ltd; 中清机器人) is a full-stack
    humanoid robotics startup founded in October 2023 in Shenzhen, China. The company designs,
    manufactures, and markets the T800 series of full-size industrial humanoid robots targeting
    manufacturing assembly, logistics, service, and hazardous operations. EngineAI has raised
    approximately $368M across pre-A, pre-A++, A1, and Series B rounds in under three years,
    reaching a post-Series B valuation exceeding RMB 10 billion ($1.46B+). Luxshare Precision —
    Apple's primary assembly partner — leads the Series B, signaling manufacturing credibility
    and potential captive customer demand. The company filed confidentially for a Hong Kong IPO
    in 2026, sponsored by CICC and CITIC Securities.
  foundedDate: "2023-10-01"
  founders:
    - name: "Founding team"
      role: "CEO and co-founders"
      background: "Former executives from major Chinese technology and robotics companies; team background spans embodied AI, mechatronics, and industrial automation."
      claimRefs: [CO006, CO007]
  foundingLocation: "Shenzhen, Guangdong, China"
  headquarters: "Shenzhen Bay Innovation and Technology Center, Shenzhen, China"
  productSummary: >
    EngineAI's product portfolio is led by the T800, a full-size (173-175 cm, 75 kg) industrial
    humanoid robot with 29-42 degrees of freedom, IP54 ingress protection, and tiered commercial
    packaging (Basic/Eco/Pro/Max at approximately $25K-$50K). The PM01 is a lighter companion
    platform for service and patrol scenarios. Additional variants (SE01, SA01, JS01) broaden
    the portfolio. The proprietary SEED VLA embodied-intelligence model and RL Workspace
    open-source training toolkit form the AI layer; NVIDIA Isaac/GR00T simulation tooling
    supports policy iteration. The Honghualing manufacturing base in Shenzhen targets one robot
    per 15 minutes.
  customerFocus: "Enterprise manufacturers, logistics operators, service sector clients, and government-backed industrial deployment programs; current traction primarily through pilot partnerships with JD.com, NVIDIA, Tencent, ByteDance, and Henan Province-backed entities."
  businessModel: "Hardware sales (T800 and portfolio) with tiered pricing and custom configuration; commercial-stage robotics services (inspections, tourism, hazardous operations); future platform/subscription revenue model anticipated but not yet disclosed."
  stage: "Series B (pre-commercial; limited pilot deployments as of mid-2026)"
  fundingStatus: "Series B $200M closed April 2026 (led by Luxshare Precision, co-invested by Henan Investment Group); total raised ~$368M across four rounds."
  disclosureProfile: private-disclosed
  claimRefs: [CO001, CO002, CO003, CI004, CI005, CI006]

