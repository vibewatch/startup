  topStrengths:
    - "Luxshare Precision as Series B lead — direct link to world-class manufacturing scale and potential captive customer demand"
    - "China government policy tailwinds — embodied AI and humanoid robots are national strategic priorities with significant direct and indirect subsidy"
    - "Demonstrated fundraising velocity — $368M in under 3 years and confidential HKEX IPO filing signal strong institutional confidence"
    - "Shenzhen supply chain advantage — Honghualing factory with 12,000 sqm capacity and access to deep component supply base"
    - "Broad partnership ecosystem — NVIDIA, JD.com, Amazon, Tencent, ByteDance provide go-to-market and technical credibility"
  topRisks:
    - "US-China geopolitical and export control risk — BIS chip restrictions could disrupt NVIDIA-dependent AI compute roadmap"
    - "Pre-revenue, pre-commercial — burn rate with no confirmed commercial revenue and unverified production at scale creates material execution risk"
