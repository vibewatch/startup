  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: AgiBot-financials
      missingEvidence: "AgiBot has not disclosed revenue, gross margin, or profitability data; the IPO prospectus will be the first public financial view."
      whyItMatters: "Without AgiBot financials, it is impossible to calibrate whether EngineAI's pricing is competitive on a unit-economics basis."
      diligencePath: "Monitor AgiBot's HKEX IPO prospectus filing, expected Q3 2026."
      relatedQuestionRefs: [QP002, QP003]

    - type: missing-source
      severity: material
      topic: switching-costs
      missingEvidence: "No public evidence exists on whether industrial customers who deploy one humanoid robot brand face significant switching costs or multi-home across vendors."
      whyItMatters: "Low switching costs imply EngineAI must win each contract on standalone merit; high switching costs mean first-mover advantage compounds."
      diligencePath: "Primary research with industrial robot buyers or comparison with historical switching cost evidence from traditional industrial robot deployments."
      relatedQuestionRefs: [QP008]

    - type: missing-source
      severity: minor
      topic: JD-exclusivity
      missingEvidence: "Terms of EngineAI's JD.com distribution relationship — exclusivity, minimum volume commitments, pricing terms — are not publicly disclosed."
      whyItMatters: "If JD.com has no exclusivity obligation, the relationship's moat value is lower than claimed."
      diligencePath: "Review IPO prospectus for related-party disclosures on the JD.com investor/customer relationship."
      relatedQuestionRefs: [QP009]

    - type: missing-source
      severity: minor
      topic: competitor-funding-comparison
      missingEvidence: "Public sources do not provide a complete, apples-to-apples total capital raised history for Unitree, AgiBot, and EngineAI; available disclosures focus on latest rounds or valuation snapshots."
      whyItMatters: "Without normalized cumulative funding totals, it is harder to judge which competitor has the deepest capital buffer for price wars and production expansion."
      diligencePath: "Revisit company IPO prospectuses, funding databases, and round-by-round disclosures once fuller cap table histories are public."
      relatedQuestionRefs: [QP020]

    - type: missing-source
      severity: minor
      topic: public-competitive-challenges
      missingEvidence: "No well-sourced public record was found of a competitor explicitly rebutting or challenging EngineAI's capability claims by name."
      whyItMatters: "If rivals are directly contesting EngineAI's marketing claims, that would weaken the credibility of its differentiation story ahead of an IPO."
      diligencePath: "Monitor trade press, conference remarks, and legal or advertising disputes for direct competitive rebuttals."
      relatedQuestionRefs: [QP022]

    - type: missing-source
      severity: material
