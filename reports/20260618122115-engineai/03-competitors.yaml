callouts:
  - calloutType: risk
    title: Unitree's $4,000 R1 Creates Existential Price-Compression Risk for EngineAI
    body: >
      Unitree's R1 humanoid robot at approximately $4,000 is 6× cheaper than EngineAI's T800 Basic. While EngineAI
      targets the premium industrial segment, Unitree's rapid iteration cycle could bring similar industrial-grade
      specs to sub-$10,000 pricing within 2–3 product generations (2027–2028). If that happens, EngineAI's
      $25,000–$50,000 value proposition must either be fully validated by then or face severe margin compression.
    claimRefs: [CP006, CP017, CP025]

  - calloutType: strength
    title: AgiBot as a Favorable Comparable — EngineAI's HK IPO Is the Cheaper Entry Point
    body: >
      AgiBot is targeting a $5.1–6.4B Hong Kong IPO, positioning it as a direct comparable for EngineAI. If AgiBot
      achieves that valuation at 10,000+ unit scale, it implies EngineAI's $1.46B valuation at 400–5,000 unit scale
      is attractively priced relative to the sector — a bull case for investors who believe EngineAI can close the
      volume gap. This is only valid if 2026 delivery targets are met.
    claimRefs: [CP009, CP010, CP014, CP015]

  - calloutType: insight
    title: No Western Player Can Currently Compete in China; Regulatory Asymmetry Favors Chinese Vendors
    body: >
      US-China geopolitical tensions, semiconductor export controls, and potential import restrictions on Chinese
      AI-enabled hardware effectively create separate market arenas: China is a Chinese-vendor preserve; the US
      and Europe are contested by Western players with limited Chinese competition. EngineAI's medium-term
      international expansion will face the same geopolitical wall that keeps US players out of China.
    claimRefs: [CP031, CP032]

