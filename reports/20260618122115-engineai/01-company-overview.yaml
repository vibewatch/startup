callouts:
  - calloutType: strength
    title: Luxshare Partnership Bridges the Prototype-to-Production Gap
    body: >
      EngineAI's Series B co-lead Luxshare Precision — the contract manufacturer that assembles iPhones — brings
      world-class supply chain management, quality control, and production efficiency expertise. Luxshare's
      involvement reportedly boosted EngineAI's manufacturing efficiency by 40% and its backing signals that
      the company has solved the most common failure mode for hardware startups: making the transition from
      impressive demo to repeatable factory-floor production.
    claimRefs: [CO019, CO031]

  - calloutType: risk
    title: Revenue and Unit Economics Remain Completely Undisclosed
    body: >
      EngineAI is pursuing a $1.46B+ unicorn valuation and a Hong Kong IPO without disclosing any revenue
      figures, gross margins, or customer economics. The company has not disclosed how many T800 units have
      actually shipped as of June 2026 (vs. the stated 4,000–5,000 target), whether customers are paying the
      full $25K–$50K price or receiving discounted pilot terms, or what the unit economic payback period looks
      like. This opacity is a significant risk for public market investors.
    claimRefs: [CO033, CO034]

  - calloutType: insight
    title: Viral Marketing Creates Outsized Brand Awareness Relative to Commercial Traction
    body: >
      EngineAI's PM01 front-flip video and T800 CES demonstrations generated enormous press attention
      disproportionate to the company's actual commercial scale (approximately 400 units shipped globally in
      2025, per TrendForce estimates). The company's public profile exceeds its commercial maturity, which is
      both an asset (IPO visibility) and a risk (expectations may outrun deliveries).
    claimRefs: [CO026, CO035]

