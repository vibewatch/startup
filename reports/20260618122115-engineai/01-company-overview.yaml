company:
  name: EngineAI

chapter:
  number: 1
  title: Company Overview
  summary: >
    EngineAI (深圳众擎机器人科技有限公司 / Zhongqing Robot), founded in October 2023 by serial robotics entrepreneur
    Zhao Tongyang in Shenzhen, China, has grown from a 2-year-old startup into a billion-dollar unicorn by April 2026 on
    the strength of its T800 humanoid robot, $200M Series B led by Luxshare Precision, and a 12,000-sq-metre factory
    delivering one T800 every 15 minutes. The company's total external funding stands at approximately $367M across
    four rounds and it has confidentially filed for a Hong Kong IPO, positioning itself as one of China's fastest-rising
    humanoid robotics champions.

sections:
  - id: identity-headquarters
    title: Company Identity and Headquarters
    body: >
      EngineAI is formally registered as Shenzhen EngineAI Robotics Technology Co., Ltd.
      (深圳众擎机器人科技有限公司, also known as Zhongqing Robot / 中清机器人). The company was founded in
      October 2023 and is headquartered at the Shenzhen Bay Innovation and Technology Center, Nanshan District,
      Shenzhen, Guangdong, China—one of China's premier technology clusters. EngineAI operates its primary
      manufacturing facility at Honghualing in Shenzhen (approximately 12,000 sq m), with a second large-scale
      production site jointly developed with Luxshare Precision at Zhengzhou's Yunzhi Science Park in Henan Province.
      The company's official websites are https://www.engine-ai.cn (Chinese) and https://en.engineai.com.cn (English).
      EngineAI's stated mission is to advance general-purpose embodied intelligence through autonomous humanoid
      robots that can operate in industrial, commercial, and research environments. As of June 2026, EngineAI is a
      private company that has filed confidentially for an IPO on the Hong Kong Stock Exchange, with CICC and CITIC
      Securities serving as joint sponsors. The company describes itself as having achieved full-stack in-house
      development across core robotic components, motion control algorithms, and embodied AI technologies.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006]
    tableRefs: [TO001]
    figureRefs: [FO002]

  - id: founding-team-leadership
    title: Founding Team and Leadership
    body: >
      EngineAI was founded by Zhao Tongyang (赵同阳), who serves as both CEO and Chairman. Zhao is a serial robotics
      entrepreneur who entered the tech industry around 2012, initially building IoT devices before pivoting to
      bipedal humanoid robots around 2016. He founded Dogotix, a quadruped robotics company that was acquired by
      XPeng Motors. At XPeng (and its robotics spinout Pengxing Intelligent), Zhao led humanoid robotics development
      before departing to found EngineAI, taking much of his core engineering team with him. Zhao holds a bachelor's
      degree in Automation Control from Zhuzhou Normal University (株洲师范高等专科学校). He is known for a
      hands-on leadership style—famously allowing one of EngineAI's robots to kick him on camera as a live
      demonstration of the robot's capabilities and controllability.

      Co-founder Ren Guowen (任国文) oversees manufacturing operations and was named in the PR Newswire
      announcement of the Shenzhen Intelligent Manufacturing Base launch. EngineAI's broader core team is drawn from
      Pengxing Intelligent / XPeng's robotics division and holds advanced degrees from institutions including
      Carnegie Mellon University, MIT, ETH Zurich, Tsinghua University, Peking University, Fudan University,
      Shanghai Jiao Tong University, the Hong Kong University of Science and Technology (HKUST), the National
      University of Singapore, Harbin Institute of Technology, and the University of Tokyo. The company emphasizes
      an R&D-heavy culture with a high proportion of masters and PhD holders. As of the June 2026 IPO filing,
      precise board composition and governance structure are not yet publicly disclosed; this remains a material
      information gap for outside investors.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO002]

  - id: funding-investors
    title: Funding History and Investor Landscape
    body: >
      EngineAI has raised approximately $367M (about 2.65B RMB) across four distinct rounds since 2024:

      **Pre-A (early 2024, ~$28M / ~200M RMB):** Led by Stone Venture (源码资本), with participation from SenseTime's
      Sense Capital (商汤资本), Honghui Capital (宏汇资本), and Highlight Capital (高光资本). This round funded
      initial prototype development and team expansion.

      **Pre-A++ (mid-2025, ~$70M / ~500M RMB):** Led by Rocket Capital (XPeng-backed / 小鹏旗下), with existing
      investors participating. Proceeds went toward scaled PM01 production and T800 development.

      **A1 round (July 2025, ~$70M / ~500M RMB):** Led by JD.com (京东), with co-investors CATL Capital (宁德时代),
      Yintai Group (银泰集团), Tsinghua Holdings Capital (清控基金), and existing investors Sense Capital and Baidu
      Ventures (百度风投). Together the pre-A++ and A1 raised approximately $139M in 2025.

      **Series B (April 2026, $200M / ~1.4B RMB):** Co-led by Henan Investment Group's Huirong Fund (河南国投汇融基金)
      and Luxshare Precision (立讯精密), the Apple contract manufacturer and a heavyweight in China's hardware
      manufacturing ecosystem. This round pushed EngineAI's post-money valuation above 10 billion RMB (~$1.46B),
      qualifying it as a unicorn. Total lifetime capital raised stands at approximately $367M.

      Luxshare is not a passive investor: it has reportedly boosted EngineAI's production efficiency by 40% and is
      co-developing the Zhengzhou expansion site. JD.com serves as both investor and initial commercial deployment
      partner, with T800 units piloted in JD.com retail stores in Shenzhen. The investor syndicate reflects a
      deliberate strategy to combine technology VCs (SenseTime, Baidu), industrial strategics (Luxshare, CATL),
      e-commerce distribution (JD.com), and state-linked capital (Henan Investment Group).
    claimRefs: [CO014, CO015, CO016, CO017, CO018, CO019, CO020, CO021, CO022]
    tableRefs: [TO003]

  - id: products-milestones
    title: Product Portfolio and Corporate Milestones
    body: >
      EngineAI has launched four humanoid robot platforms and one quadruped platform since its founding:

      **SE01 (2024):** Full-size general-purpose humanoid (170 cm, 55 kg, 32 DoF, 330 Nm peak torque). Notable for
      early demonstrations of ultra-realistic natural gait using reinforcement + imitation learning.

      **PM01 (2024–2025):** Lightweight embodied AI agent (138 cm, ~40 kg, 23–24 DoF). Priced from ~$13,700 and
      offered in commercial and educational editions. In 2025 the PM01 achieved what EngineAI claims is the world's
      first humanoid front flip, generating viral attention. Hundreds of PM01 units were produced in 2025 (small-batch
      production phase).

      **SA01 (2025):** Open-source developer-focused platform (~170 cm, ~50 kg, ~32 DoF) priced from ~$5,400,
      targeting research labs and university teams. Full SDK and secondary-development support.

      **JS01 (quadruped, 2025):** Four-legged platform for outdoor inspection and logistics tasks. Positions EngineAI
      in the adjacent quadruped market occupied by Unitree and XPeng.

      **T800 (debuted CES 2026, mass production from May/June 2026):** Full-size industrial-grade humanoid (29 DoF,
      450 Nm peak torque, 14,000 W instantaneous joint power, magnesium-aluminum alloy exoskeleton). Available in
      four editions: Basic ($25,000), Eco ($33,000), Pro ($38,500), Max ($50,000). The T800 is the company's
      flagship product for large-scale delivery in 2026.

      Key milestones include the October 2023 founding; SE01 demonstrations in 2024; PM01 world-first front flip and
      viral marketing campaigns in 2025; T800 global debut at CES 2026 (January 2026); the launch of the Shenzhen
      Honghualing manufacturing base on May 29, 2026; and the confidential Hong Kong IPO filing in June 2026.
    claimRefs: [CO023, CO024, CO025, CO026, CO027, CO028, CO029, CO030]
    tableRefs: [TO004]
    figureRefs: [FO001]

  - id: scale-operations
    title: Manufacturing Scale and Operations
    body: >
      EngineAI's 12,000-square-metre Shenzhen Intelligent Manufacturing Base in Honghualing runs an integrated
      closed-loop process: incoming inspection → component assembly → sub-system testing → final assembly →
      79-point quality inspection → 46 working-condition simulation tests → shipping. This line achieves a
      cycle time of one T800 every 15 minutes, enabling claimed annual capacity of roughly 35,000 units at full
      utilization. The company targets delivery of 4,000–5,000 T800 units by year-end 2026, scaling to
      30,000–50,000 units per year by 2027.

      Manufacturing quality is underpinned by four pillars disclosed in the company's June 2026 press release:
      (1) supply chain quality control with strict component qualification; (2) advanced automated processes
      (automated locking, gluing, laser welding, improving efficiency 40%); (3) digital management and full-link
      component traceability; and (4) rigorous testing. A second production site in Zhengzhou (Henan Province) is
      being co-developed with Luxshare, with Henan Investment Group providing local state backing. The multi-site
      manufacturing strategy hedges geopolitical risk and aligns with Henan's ambitions as a robotics-manufacturing
      hub.

      EngineAI's headcount has not been publicly disclosed; estimates from media coverage suggest roughly 300–500
      employees as of mid-2026, heavily weighted toward engineering. The absence of verified headcount and revenue
      data is a material gap that potential investors should address through due diligence prior to the Hong Kong IPO.
    claimRefs: [CO031, CO032, CO033, CO034, CO035, CO036, CO037]
    figureRefs: [FO003]

