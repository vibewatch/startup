company:
  name: EngineAI
chapter:
  number: 5
  title: "Product & Technology"
  summary: >
    EngineAI's product story is strongest where hardware, control, and manufacturing evidence intersect: the T800 is positioned as a full-size industrial humanoid, the PM01 and other variants broaden scenario coverage, the company has exposed a small but real developer surface via a public C++ SDK, and Honghualing manufacturing claims suggest serious commercialization intent. The diligence caveat is that public technical disclosure remains uneven: T800 spec sheets vary across sources, the public GitHub footprint is thin, and formal safety-certification evidence is still incomplete.

sections:
  - id: section-1
    title: "Portfolio architecture and flagship robot positioning"
    body: >
      EngineAI's disclosed portfolio spans multiple humanoid and adjacent form factors rather than a single hero SKU. Official manufacturing and CES materials describe a line that includes the full-size T800, the lightweight PM01, the earlier SE01 walker, and SA/JS variants used to widen accessibility and scenario coverage. Within that mix, the T800 is the flagship industrial humanoid: sources consistently describe it as the company's universal heavy-duty platform, while PM01 is positioned as the lighter, higher-mobility companion platform for service, patrol, and research-oriented use cases.

      Public specification coverage is directionally strong but not fully harmonized. BotInfo and Aparobot both place the current commercial T800 around 173-175 cm and 75 kg, while public summaries and research notes diverge on the degree-of-freedom count, runtime, ingress protection, and operating-speed presentation. The safest diligence read is that EngineAI clearly markets the T800 as a full-size, high-dynamic industrial humanoid with differentiated joint torque and a four-tier commercial package, but investors should treat detailed spec-sheet precision as version- and edition-dependent until the company publishes a unified canonical data sheet.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE009, CE010, CE011]
    tableRefs: [TE001, TE002]
    figureRefs: [FE004]

  - id: section-2
    title: "Embodied-AI stack, controls, and developer surface"
    body: >
      EngineAI publicly presents itself as a full-stack embodied-intelligence company rather than a chassis vendor. Official and partner materials say the company develops core components, motion control algorithms, and embodied-AI technologies in house. In practice, the public stack appears to rest on four layers: proprietary electromechanical hardware, a hybrid motion-control layer that combines classical control with reinforcement learning, NVIDIA-based high-end compute and simulation tooling, and a modest but concrete external developer layer exposed through the Native SDK GitHub repository.

      The GitHub evidence is especially important because it is one of the few directly inspectable technical artifacts. The public organization currently exposes only one repository, a C++ Native SDK with 39 stars and 13 forks at access time. That repository advertises configuration-driven task orchestration, an FSM-oriented plugin mechanism, and GPU-accelerated container rendering. This is meaningful developer signal, but it does not yet amount to broad ecosystem transparency. For diligence purposes, EngineAI looks stronger on control, locomotion, and embodied-system integration than on open external documentation depth.
    claimRefs: [CE012, CE013, CE014, CE015, CE016, CE017, CE018, CE019, CE020, CE021, CE022, CE023, CE024]
    tableRefs: [TE003]
    figureRefs: [FE001, FE003]

  - id: section-3
    title: "Commercialization workflow, deployment targets, and manufacturing readiness"
    body: >
      Public commercialization evidence centers on a manufacturing-first narrative. PRNewswire's Honghualing launch note describes a 12,000 sqm Shenzhen base with end-to-end inspection, assembly, testing, shipment, and after-sales loops, plus a reported cadence of one robot every 15 minutes. The same release attributes a 40% production-efficiency gain to automated process upgrades and says each robot passes 79 inspections and 46 simulated-condition tests before delivery. Independent coverage ties Luxshare's involvement directly to the problem EngineAI must solve next: turning viral locomotion demos into repeatable industrial output.

      Go-to-market evidence points to a staged customer workflow. The product pages and third-party summaries show T800 pre-orders through JD.com, edition-based packaging for different buyer cohorts, and scenario marketing across industrial assembly, logistics, retail service, patrol, hazardous operations, and longer-horizon household-assistant ambitions. The partner set — NVIDIA, Amazon, JD.com, Tencent, and ByteDance in Robot Report coverage — supports the claim that EngineAI is trying to build application channels and ecosystem leverage around the robot body, not just sell stand-alone hardware.
    claimRefs: [CE025, CE026, CE027, CE028, CE029, CE030, CE031, CE032, CE033, CE034]
    tableRefs: [TE004]
    figureRefs: [FE002]

  - id: section-4
    title: "Technology verdict and unresolved diligence risks"
    body: >
      EngineAI's technical position is credible but not category-leading. Against Chinese peers, the company appears to occupy a mid-tier cost-performance lane: more industrial and better packaged than low-end spectacle bots, but still behind Unitree on manufacturing scale and behind the best Western peers on perceived system quality and public reproducibility. That balance can be investable if Luxshare-enabled manufacturing quality, NVIDIA-aligned tooling, and differentiated actuators translate into reliable enterprise deployment economics.

      The remaining risks are classic pre-scale robotics risks rather than obvious fraud signals. Public spec sheets are inconsistent, the public code footprint is narrow, verified deployment counts remain sparse, and formal safety-certification evidence for T800 is still not clearly surfaced in the accessible record. Those gaps do not negate the technology story, but they materially limit how confidently an outside diligence process can underwrite uptime, safety, and replicability at fleet scale.
    claimRefs: [CE035, CE036, CE037, CE038, CE039]
    tableRefs: [TE005]

