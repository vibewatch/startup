- id: monitoring-triggers-and-kill-criteria
  title: Monitoring triggers, open gaps, and thesis-break criteria
  body: The practical diligence question is not whether EngineAI has risks; it is which ones can be monitored tightly enough to keep the thesis investable. This chapter therefore treats the most important gaps as instrumentable. Certification opacity becomes disqualifying if the company begins meaningful paid deployment without disclosing recognized safety evidence or customer EHS acceptance packages. Manufacturing credibility becomes disqualifying if the 4,000 to 5,000 unit ambition fails to convert into named deliveries, reference accounts, or repeat orders. Financial and IPO risk becomes sharper if Hong Kong timing slips without a visible private-capital bridge. Finally, management-execution risk remains open because the public record says little about succession depth or field-support scale. Several third-party databases and topic pages were inaccessible during this run, so the correct next step is not to ignore those gaps but to make them explicit diligence asks before any underwriting
    decision.
  claimRefs:
