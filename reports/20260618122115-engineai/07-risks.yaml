- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Safety-certification gap
    - Third-party certification evidence remains absent
    - No recognized certificate or customer EHS acceptance pack by first scaled paid deployment
    - Pause underwriting until certification evidence is reviewed
  - - Demand-conversion gap
    - Mass-production narrative fails to translate into reference accounts
    - Named deliveries materially trail 2026 ambition or cancellations dominate preorders
    - Cut valuation expectations and require fresh customer diligence
  - - Safety / liability event
    - Material injury, regulator stop-order, or major recall surfaces
    - One serious incident with unclear root-cause containment
    - Treat as thesis-break until remediation is independently verified
  - - Compute / supply-policy shock
    - Access to high-end compliant compute tightens materially
    - Roadmap slips because required compute or tooling cannot be secured
    - Re-underwrite product roadmap and capital needs
  - - IPO / runway execution
    - Hong Kong path stalls without replacement capital
    - IPO slips more than 12 months and no credible private bridge appears
    - Move thesis to research-more or avoid absent financing clarity
  notes: Kill criteria are framed so an investor can monitor them without needing continuous private-company access.
