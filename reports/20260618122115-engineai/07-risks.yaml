- id: operational-quality-and-security
  title: Operational, quality, and security failure modes
  body: 'Operationally, EngineAI looks real but early. The Honghualing announcement, inspection counts, and 2026 delivery ambition all suggest a company trying to industrialize fast, yet independent proof still trails the narrative. Public sources do not show audited yield, uptime, MTBF, or incident-history data for deployed fleets, and public T800 specs remain version-dependent across review pages and roundups. That gap matters because humanoid deployments fail in the real world through cumulative reliability misses rather than headline demo errors. The core technical risk is not whether EngineAI can make robots move; it is whether dexterous, safety-critical work stays robust under mixed environments, remote updates, and imperfect operators. Add the NVIDIA dependency and the limited public software footprint, and the risk picture becomes clear: quality controls appear to exist inside the factory, but the external evidence needed to trust real-world robustness and cyber-physical resilience
    is still thin.'
  claimRefs:
  - CR002
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
