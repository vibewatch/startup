  evidenceGaps:
  - type: missing-source
    severity: material
    topic: safety-certification
    missingEvidence: Recognized third-party safety certificates, test reports, and customer EHS approvals for T800 deployments.
    whyItMatters: Without external safety evidence, product-liability and deployment-readiness risk cannot be fully cleared.
    diligencePath: Request certification pack, incident log, and any insurer or customer safety review before underwriting.
    relatedQuestionRefs:
    - QR004
    - QR005
    relatedTableRefs:
    - TR001
  - type: access-blocked
    severity: minor
    topic: registry-access
    missingEvidence: A directly readable GSXT company record for EngineAI or its Chinese legal entity.
    whyItMatters: Registry data would improve verification of legal entity status, capital, and filing history.
    diligencePath: Use a Chinese-language compliance specialist or local counsel to retrieve and archive the relevant GSXT record.
    relatedQuestionRefs:
    - QR008
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: cybersecurity-controls
    missingEvidence: Security architecture, remote-update controls, incident-response process, and any prior cyber incidents.
    whyItMatters: Cyber-physical failures can create operational shutdowns and liability that do not show up in glossy launch materials.
    diligencePath: Request security architecture review, software-update policy, and security owner interview.
    relatedQuestionRefs:
    - QR012
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: team-depth
    missingEvidence: An org chart showing manufacturing, safety, service, and compliance leaders plus succession coverage for key executives.
    whyItMatters: Scale-up risk is driven by whether responsibilities have moved beyond the founder narrative into accountable operators.
    diligencePath: Request org chart, functional heads, board committee oversight, and succession planning materials.
    relatedQuestionRefs:
    - QR023
    - QR024
    relatedTableRefs:
    - TR004
