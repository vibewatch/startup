evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue
    missingEvidence: EngineAI's revenue, gross margin, and unit economics have not been publicly disclosed.
    whyItMatters: >-
      Without revenue data, it is impossible to assess whether the $1.46B valuation is justified or stretched. The IPO
      prospectus will be the first opportunity to see these figures.
    diligencePath: >-
      Request management accounts or wait for IPO prospectus. Alternatively, infer revenue from delivery volumes × ASP
      after the 2026 delivery targets are confirmed.
    relatedQuestionRefs:
      - QO014
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Board composition, voting rights, founder control provisions, and corporate governance structure are not publicly
      disclosed.
    whyItMatters: >-
      Founder-dominated governance without strong independent oversight is a risk factor for public-market investors,
      particularly in the context of a Hong Kong IPO.
    diligencePath: Review the IPO prospectus for governance disclosures required under HKEX listing rules.
    relatedQuestionRefs:
      - QO020
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: EngineAI has not publicly disclosed its headcount.
    whyItMatters: >-
      Without headcount data, it is difficult to assess burn rate, talent density, or operational leverage. Approximate
      estimates from media (~300–500) are unverified.
    diligencePath: Request from company or infer from LinkedIn and other professional network data.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: IPO-details
    missingEvidence: IPO target size, pricing range, use-of-proceeds, and expected listing date are not publicly available.
    whyItMatters: >-
      Confidential filing means the market has no way to value EngineAI's IPO terms yet; this creates uncertainty for
      both investors and the company itself.
    diligencePath: >-
      Monitor HKEX application proof submissions. Bloomberg has reported the filing; HKEX public register will disclose
      once the proof is published.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: minor
    topic: adverse-events
    missingEvidence: >-
      No material adverse events (lawsuits, regulatory sanctions, robot accidents, or customer disputes) have been
      identified in public reporting on EngineAI.
    whyItMatters: >-
      Absence of adverse evidence may reflect the company's early commercial stage and limited deployment rather than a
      clean record.
    diligencePath: >-
      Search HKEX enforcement database, Shenzhen court records, and Chinese regulatory databases for any filings related
      to EngineAI or Zhao Tongyang.
    relatedQuestionRefs:
      - QO013
  - type: private-evidence-only
    severity: minor
    topic: co-founder-background
    missingEvidence: >-
      Ren Guowen's specific role, title, and professional background at EngineAI are not publicly documented in
      English-language sources.
    relatedQuestionRefs:
      - QO012
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: >-
      Leadership table is limited to CEO Zhao Tongyang and co-founder Ren Guowen; full team roster including CTO, CFO,
      and other C-suite positions is not publicly disclosed.
    relatedTableRefs:
      - TO002
    relatedQuestionRefs:
      - QO012
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Stakeholder or investor map is limited to investors with confirmed public round participation; governance terms,
      board seats, and ownership percentages are not publicly disclosed.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table
    missingEvidence: >-
      Milestone table is based on public-record events; internal R&D milestones, product iterations, and failed
      prototypes are not publicly documented.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: buyer-satisfaction
    missingEvidence: >-
      The 23% buyer satisfaction figure is from a single analyst source (Aparobot) and has not been corroborated by
      independent industry surveys or academic research.
    whyItMatters: >-
      If buyer satisfaction is as low as 23%, the market size forecasts may be built on unsustainable first-purchase
      demand without repeat orders, fundamentally undermining the IPO growth thesis.
    diligencePath: >-
      Commission or source an independent buyer satisfaction survey across early commercial humanoid robot deployments
      in China, or seek MIIT/industry association data on renewal rates.
    relatedQuestionRefs:
      - QM015
  - type: stale
    severity: minor
    topic: market-forecast
    missingEvidence: >-
      The wide range in 2026 market size forecasts (RMB 20B vs. RMB 104.71B) reflects lack of a definitive authoritative
      market research report.
    whyItMatters: >-
      EngineAI's IPO valuation will depend on which market size assumption investors use; the gap is nearly 5× and
      fundamentally changes the valuation outcome.
    diligencePath: Obtain IDC, Gartner, or CCID Consulting (中国赛迪研究院) primary market research reports on humanoid robot market sizing.
    relatedQuestionRefs:
      - QM002
      - QM021
  - type: private-evidence-only
    severity: material
    topic: EngineAI-revenue
    missingEvidence: >-
      EngineAI has not disclosed its 2025 or 2026 revenue, preventing direct validation of the market share and revenue
      estimates.
    whyItMatters: >-
      Without revenue confirmation, EngineAI's IPO thesis rests entirely on production capacity claims and stated
      delivery targets.
    diligencePath: Obtain management accounts or wait for IPO prospectus financial disclosures.
    relatedQuestionRefs:
      - QM013
      - QM026
  - type: missing-source
    severity: material
    topic: global-humanoid-tam
    missingEvidence: >-
      The chapter cites China-specific 2026 and 2030 market forecasts but does not include a primary or independent
      global 2030 humanoid robot TAM source to fully close the global market sizing question.
    whyItMatters: >-
      A global 2030 TAM anchor is needed to assess whether China's projected share and EngineAI's export optionality are
      realistic, rather than inferred from China-only projections.
    diligencePath: >-
      Obtain a current global humanoid robot market forecast from IDC, TrendForce, Goldman Sachs, or another directly
      attributable analyst source that explicitly states 2030 global TAM.
    relatedQuestionRefs:
      - QM022
  - type: missing-source
    severity: minor
    topic: ipo-comparables
    missingEvidence: >-
      The chapter references Unitree and AgiBot as market benchmarks but does not provide enough disclosed IPO pricing
      or public-market comparable detail to fully anchor EngineAI's prospective valuation range.
    whyItMatters: >-
      Without transaction-quality IPO comparable data, investors may over- or under-estimate the valuation premium
      justified by EngineAI's growth narrative and factory expansion story.
    diligencePath: >-
      Collect prospectus, IPO filing, or public-market valuation materials for Unitree, UBTech, AgiBot, and other
      relevant humanoid robotics issuers once available.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: AgiBot-financials
    missingEvidence: >-
      AgiBot has not disclosed revenue, gross margin, or profitability data; the IPO prospectus will be the first public
      financial view.
    whyItMatters: >-
      Without AgiBot financials, it is impossible to calibrate whether EngineAI's pricing is competitive on a
      unit-economics basis.
    diligencePath: Monitor AgiBot's HKEX IPO prospectus filing, expected Q3 2026.
    relatedQuestionRefs:
      - QP002
      - QP003
  - type: missing-source
    severity: material
    topic: switching-costs
    missingEvidence: >-
