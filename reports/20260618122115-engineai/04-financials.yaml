company:
  name: EngineAI

chapter:
  number: 4
  title: Financials
  summary: >
    EngineAI has raised approximately $368M across four rounds—Pre-A ($28M, 2024), Pre-A++ ($70M, mid-2025),
    A1 ($70M, July 2025), and Series B ($200M, April 2026)—achieving a post-money valuation exceeding RMB 10B
    (~$1.46B). Revenue remains minimal (<$10M est. for 2025) as the company transitions to mass production;
    Unitree's 59.4% gross margin at IPO and Luxshare's 40% manufacturing efficiency improvement are the key
    financial benchmarks for EngineAI's profitability path. The company filed confidentially for a Hong Kong IPO
    in June 2026, but a 145x implied revenue multiple versus Unitree's 24x at IPO signals aggressive valuation
    expectations that require flawless execution on the 4,000–5,000 T800 unit delivery target.

sections:
  - id: I-S1
    title: Funding History and Capital Structure
    body: |
      EngineAI's fundraising trajectory is among the most compressed in Chinese robotics history. Founded in October
      2023, the company closed its Pre-A round of approximately $28 million in 2024, led by Stone Venture with
      participation from SenseTime's Sense Capital and Highlight Capital. This initial capital financed the SE01
      and PM01 development programs and early team scale-up.

      In July 2025, EngineAI closed two rounds in rapid succession totaling approximately RMB 1 billion (~$139–140M).
      The Pre-A++ (~$70M) was led by Rocket Capital and XPeng Motors; the A1 (~$70M) was led by JD.com with CATL
      Capital and Tsinghua Holdings Capital as co-investors. The dual-round structure—unusual in speed—reflected
      fierce competition among Chinese institutional investors for stakes in top humanoid robotics companies.

      The Series B in April 2026 raised $200 million, co-led by Luxshare Precision and Huirong Fund (Henan
      Investment Group), with Zhongchuang Zhiling, Cornerstone Capital, and Huangpujiang Capital participating.
      Existing investors JD.com and CATL maintained positions. Total capital reached approximately $368 million,
      pushing post-money valuation above RMB 10 billion (~$1.46 billion), conferring unicorn status ~30 months
      after founding—exceptionally fast even by Chinese tech startup standards.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI019, CI026, CI028, CI029]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001, FI004]

  - id: I-S2
    title: Investor Value and Strategic Alignment
    body: |
      Approximately 60% of EngineAI's total funding has come from investors with direct operational roles in its
      supply chain, customer acquisition, or technology stack. Luxshare Precision—one of the world's largest Apple
      assembly partners—is the pivotal strategic investor. Its technical collaboration with EngineAI achieved a
      reported 40% manufacturing efficiency improvement on T800 production. Luxshare co-develops the Zhengzhou
      Yunzhi Science Park production facility with Henan Investment Group, providing a capital-light expansion path.

      JD.com serves a dual role as lead A1 investor and enterprise deployment customer, with T800 and PM01 pilots
      in JD.com retail stores establishing referenceable commercial deployments. CATL Capital's participation
      provides access to next-generation solid-state battery supply chain, directly relevant to T800's 4–5 hour
      operational window. Henan Investment Group's industrial infrastructure commitment in Zhengzhou reduces
      EngineAI's greenfield capital requirements by an estimated $30–$50M, effectively a quasi-public-private
      partnership reducing financial risk. XPeng Motors' stake reflects synergies in autonomous navigation AI.
    claimRefs: [CI007, CI008, CI009, CI010, CI027, CI033]
    tableRefs: [TI003]
    figureRefs: [FI002]

  - id: I-S3
    title: Unit Economics and Gross Margin Analysis
    body: |
      The T800 is priced at $25,000 to $50,000 per unit across four editions: Basic ($25K, no dexterous hands),
      Eco ($33K, open-source, tactile sensing), Pro ($38.5K, NVIDIA Thor chip), and Max ($50K, industrial-grade
      24/7 deployment). All editions share the same 173 cm frame, 29-DoF body, and solid-state battery.

      Competitor benchmarking is instructive: Unitree achieved a 59.4% gross margin in 2025 at ~5,000 humanoid
      units on a portfolio including the G1 at ¥99,000 (~$13,800). At equivalent production scale, EngineAI's
      T800—with its higher ASP—should generate comparable or superior gross margins. Luxshare's 40% manufacturing
      efficiency improvement implies a potential BOM reduction from an estimated $15K baseline to ~$9K, pushing
      gross margins toward 64% at $25K ASP. The SA01 ($5,400) and PM01 ($13,700) provide lower absolute margins
      but serve as market development tools, driving RL Workspace ecosystem adoption. Full unit economics
      realization requires achieving the 4,000–5,000 unit 2026 delivery target; current volumes (~400 units in
      2025) are insufficient to capture production learning-curve benefits.
    claimRefs: [CI011, CI012, CI016, CI017, CI022]
    tableRefs: [TI004]
    figureRefs: [FI003]

  - id: I-S4
    title: Revenue Trajectory and Path to Profitability
    body: |
      EngineAI has no publicly disclosed revenue, EBITDA, or net income figures. Based on ~400 units shipped in
      2025 at blended ASPs (~$5K–$25K for PM01/SA01/T800 pilots), estimated 2025 revenues are less than $10M.
      The 2026 delivery target of 4,000–5,000 T800 units at $25K–$50K ASP would yield gross revenue of
      $100M–$250M if fully achieved—a 10–25x year-over-year increase.

      Path to breakeven: Using Unitree as a proxy, it achieved profitability at ~10,000 units/year with >50% gross
      margins. EngineAI, with higher ASPs and Luxshare-enabled margins, could reach EBITDA breakeven at
      5,000–8,000 annual T800 units if operating costs (R&D, headcount, factory overhead) are controlled. Under
      conservative assumptions (3,000 units in 2026 at $30K ASP, 50% gross margin, $120M operating costs),
      EngineAI would operate at approximately $45M EBITDA loss, with 18–24 month runway from the $200M Series B.
      Two key adverse signals: (1) Unitree's IPO revealed 73.6% of humanoid robot revenue came from
      research/education in 2025—not industrial deployment; (2) Aparobot buyer satisfaction data shows only 23%
      satisfaction among humanoid robot customers industry-wide—indicating limited willingness-to-pay at scale.
    claimRefs: [CI013, CI014, CI015, CI020, CI024, CI031, CI032]
    tableRefs: [TI005]
    figureRefs: []

  - id: I-S5
    title: IPO Readiness and Capital Markets Context
    body: |
      EngineAI filed a confidential IPO application with the Hong Kong Stock Exchange in June 2026, with CICC and
      CITIC Securities as joint sponsors—following a pattern set by AgiBot (also targeting HK IPO in Q3 2026)
      and Unitree (STAR Market, approved June 1, 2026 after a record 73-day review at ~$5.8B valuation).

      EngineAI's target listing valuation above $1.46B implies ~145x estimated 2026 revenue—against Unitree's
      ~24x 2025 revenue at IPO and AgiBot's projected ~15–20x. The premium reflects Chinese capital market
      enthusiasm and Luxshare partnership value, but requires the 2026 delivery target to be substantially met.
      Key risks: (1) HKEX may require two fiscal years of audited financials, potentially delaying listing to 2027;
      (2) competitive price pressure from Unitree G1 at $13,800; (3) US-China geopolitical risk affecting foreign
      institutional demand for Chinese hardware companies. Revenue per employee is estimated at below $33K versus
      Unitree's $472K, underscoring the pre-commercialization stage that must close before the IPO.
    claimRefs: [CI018, CI021, CI023, CI025, CI030, CI034, CI035, CI036, CI037]
    tableRefs: []
    figureRefs: []

