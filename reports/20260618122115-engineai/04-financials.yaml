callouts:
  - calloutType: strength
    title: "Luxshare Partnership Creates Structural Cost Advantage"
    body: >
      Luxshare Precision's role as both Series B co-lead and manufacturing partner is EngineAI's most differentiated
      financial asset. The reported 40% manufacturing efficiency improvement translates directly to gross margin
      expansion, potentially taking T800 margins from ~40% to ~64% at $25K ASP—approaching Unitree's 59.4%
      benchmark. No US humanoid peer has access to equivalent supply chain infrastructure at comparable scale.
    claimRefs: [CI007, CI016]

  - calloutType: risk
    title: "145x Revenue Multiple Requires Flawless Execution"
    body: >
      EngineAI's $1.46B valuation implies ~145x estimated 2026 revenue. Unitree traded at ~24x at IPO. The premium
      is predicated on delivering 4,000–5,000 T800 units at $25K–$50K pricing with no competitive ASP erosion
      from Unitree ($13,800 G1) or AgiBot. Any significant slip in unit deliveries or pricing would fundamentally
      alter the IPO valuation narrative and jeopardize HK listing plans.
    claimRefs: [CI013, CI015, CI024]

  - calloutType: risk
    title: "Adverse Signal: 23% Buyer Satisfaction Limits Near-Term Revenue Ramp"
    body: >
      Aparobot's 2025 industry survey found only 23% buyer satisfaction for humanoid robots across the sector.
      Unitree's own IPO prospectus revealed 73.6% of humanoid revenue came from research/education, not industrial
      deployment. These structural limitations on enterprise adoption affect EngineAI's 2026 revenue achievability
      regardless of manufacturing scale—enterprise commitment at full ASP remains unproven.
    claimRefs: [CI024, CI020]

