      - number: '3.2'
        title: 主要竞争对手画像
        blocks:
          - type: paragraph
            body: >
              **Unitree Robotics（宇树科技）** 是无可争议的市场领导者，2016 年成立，总部杭州，背后有 Sequoia China（HongShan）、Tencent 和 Alibaba。2025
              年收入达到人民币 17 亿元（约 $236M），同比增长 335%；毛利率约 59.4%，调整后净利润人民币 5.91 亿元（$82.1M），是唯一拥有经验证财务数据且已盈利的人形机器人公司。Unitree 的
              R1 机器人定价约 $4,000，使其按出货量成为市场份额第一（2025 年全球 32–38%）。其 STAR Market IPO 申请于 2026 年 3 月 20 日受理，2026 年 6 月 1
              日过会；隐含估值约 $5.7–7B。Unitree 计划将 IPO 募资中超过人民币 20 亿元投向 AI、机器人架构和制造设施。

              **AgiBot（智元机器人 / Zhiyuan Innovation）** 是 2025 年中国人形机器人出货量第一的厂商（约 5,168 台，全球份额约 39%）。投资方包括
              Tencent、HongShan、BYD、Hillhouse Investment 和 LG Electronics。AgiBot 目标在 2026 年 Q3 以 $5.1–6.4B 估值赴港 IPO。公司出货
              Yuanzheng（A3）和 Lingxi 系列，A3 定价低于 $20,000。AgiBot 于 2026 年 Q2 发出第 10,000 台机器人，巩固了中国最高出货量人形机器人制造商的位置。公司管理层有前
              Huawei 工程师，带来深厚硬件工程经验。

              **UBTech（优必选）** 是首家完成 HKEX 上市的人形机器人公司。UBTech 以企业客户为重点，产品为 Walker 系列，2025 年出货约 1,000 台（7%
              市场份额），并已转向养老和服务应用。上市公司身份带来透明度，也让其盈利时间表接受投资者审视。

              **Tesla Optimus** 正处于积极研发阶段，商业部署有限（2025 年内部测试少于 150 台）。Tesla 庞大的 AI 基础设施、Full Self-Driving 技术栈和制造能力（Nevada
              Gigafactory 模式）让它成为最可信的长期威胁，但 2026 年在中国商业上仍无关紧要。如果 Dojo AI 训练系统和 Autopilot 视觉能力成功迁移到人形机器人，Tesla 可能在机器人 AI
              能力上获得阶跃式优势。

              **Figure AI（US）** 以 $2.6B 估值融资，并与 BMW 合作推进工业机器人部署、与 Anthropic 合作进行 AI 模型集成。Figure 2025 年商业出货约 150
              台，目前不是中国市场竞争对手，但代表了人形机器人 AI 精细度的标杆。

              **Agility Robotics（Digit）** 获 Amazon 支持，聚焦仓储物流。与 Amazon 的合作让它在西方玩家中拥有最清晰的商业 ROI 证明，是物流部署最可信的概念验证——这与
              EngineAI 的 JD.com 论证直接相关。
