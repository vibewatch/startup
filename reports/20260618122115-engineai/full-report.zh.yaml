      - number: '2.6'
        title: 图表与要点
        blocks:
          - type: callout
            title: 结构性顺风：政府政策 + 人口结构创造数十年需求
            body: >
              中国同时拥有老龄化劳动力、上升的用工成本和全球最大制造业基地，这为人形机器人创造了由政策背书的结构性需求，性质上不同于纯技术周期趋势。国家资本、标准化框架和明确的政府生产目标，使这更像政府支持的产业建设，而不是风险资本驱动的实验——显著降低了突然撤资风险；在美国，许多机器人创业公司曾因此终结。
