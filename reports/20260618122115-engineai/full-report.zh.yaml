      - number: '2.2'
        title: 政府政策与结构性需求驱动
        blocks:
          - type: paragraph
            body: >
              中国人形机器人热潮并非纯市场驱动：国家是该行业增长的主要设计者。关键政策催化包括：

              **Made in China 2025（2015 年起）：** 将先进机器人列为十大重点战略制造领域之一。明确设定国产机器人生产能力和产业渗透目标。

              **MIIT Guidance on Innovation and Development of Humanoid Robots（2023）：** 建立首个专门面向人形机器人的国家级路线图，设定 2025
              年目标（关键技术突破、初步批量生产）和 2027 年目标（形成安全可靠产品和产业生态）。

              **Robot+ Action Plan（2023）：** 将国家对机器人的支持从纯制造自动化扩展至医疗、农业、物流、养老和公共安全，显著放大人形机器人的总可服务市场。

              **MIIT/TC8 标准化委员会（2025 年 12 月）：** MIIT
              成立人形机器人与具身智能标准化技术委员会，正式启动国家级标准制定，覆盖术语、技术要求、接口协议和安全规范。这会降低碎片化、压低研发成本，并给商业就绪度提供更清晰框架。

              **地方政府支持：** 北京、上海、深圳、杭州等城市正设立专项机器人产业基金、研发补贴和场景试点项目。河南省（EngineAI 郑州扩张伙伴）是值得关注的新进入者，正试图打造机器人制造枢纽。NDRC 2025 年
              11 月指导信号显示，政策正从普惠支持转向面向核心部件突破的“精准滴灌”。

              结构性需求来自中国的人口挑战：劳动年龄人口下降、制造业用工成本上升、老龄人口增长，共同拉出持续数十年的机器人需求，尤其是能执行体力劳动的机器人。中国是全球最大制造业经济体，即便在约 1
              亿个制造业岗位中实现很小渗透，也对应巨大的潜在出货需求。
