            body: >
              EngineAI 的技术位置可信，但不是品类领先。与中国同行相比，公司似乎处在中档性价比区间：比低端表演机器人更工业化、包装更完整，但制造规模仍落后
              Unitree，感知中的系统质量和公开可复现性也落后于最好的西方同行。如果 Luxshare 加持的制造质量、NVIDIA 对齐的工具链和差异化执行器能够转化为可靠的企业部署经济性，这个平衡仍具备投资价值。

              剩余风险是典型的规模化前机器人风险，而不是明显造假信号。公开规格表不一致，公开视频代码足迹窄，已验证部署数量仍少，可访问记录里也尚未清楚呈现 T800
              的正式安全认证证据。这些缺口不会推翻技术故事，但会显著限制外部尽调对机队规模下可用率、安全性和可复制性的承销信心。
