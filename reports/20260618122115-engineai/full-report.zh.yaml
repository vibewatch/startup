            body: >-
              剩余工作异常具体。在把本轮视为完全可投之前，尽调需要经审计或至少经投行验证的收入和订单披露、Luxshare 或 JD
              相关铺开的已签部署文件、深圳产线的良率和报废数据，以及清晰的清算优先权和任何由压缩融资节奏产生的
              ratchet。这些问题重要，因为它们把估值叙事和估值证据分开。投后监控应盯少数硬信号，而不是泛泛的市场故事：月度交付节奏、具名客户新增、试点转生产、IPO 流程里程碑，以及任何显示 Luxshare
              正变成绑定需求渠道而不只是制造伙伴的证据。最快打破论点的不会是市场规模预测变软，而是旗舰部署故事正在滑落、同时公司仍扛着独角兽价格的证据。因此，建议保持有条件，决策框架也应动态，而不是一次性定格。
