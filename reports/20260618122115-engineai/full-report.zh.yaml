              定位于工业制造、物流与仓储、零售导览、酒店或商业服务、娱乐或旅游活动，以及科研或教育买方。战略上这有吸引力，因为公司拥有多个切入楔子；但公开记录尚未显示一个定义清晰、采购动作可重复的 ICP。最清楚的渠道证据是
              JD.com：这个平台同时作为投资方、预订店面和试用场所出现，因此既是最具体的商业界面，也是最大的集中度变量。地域也集中。可见客户记录以中国为先，围绕深圳和潜在的河南扩张；海外需求更多仍是兴趣，而不是已披露部署。尽调中最重要的切分，因此不是垂直行业本身，而是已有买方证明的账户与未经证明的场景主张。
