  productSummary: >
    EngineAI 的产品组合由 T800 领衔。这是一款全尺寸（173–175 cm、75 kg）工业人形机器人，拥有 29–42 个自由度、IP54 防护等级，并按 Basic / Eco / Pro / Max 分层商业定价（约
    $25K–$50K）。PM01 是更轻量的伴生平台，面向服务和巡逻场景。SE01、SA01、JS01 等变体进一步拓宽产品线。自研 SEED VLA 具身智能模型和开源训练工具包 RL Workspace 构成 AI
