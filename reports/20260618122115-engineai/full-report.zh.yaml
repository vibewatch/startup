  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场规模、增长轨迹与关键预测
        blocks:
          - type: paragraph
            body: >
              中国人形机器人市场普遍被视为全球机器人行业增长最快的细分赛道。2025 年，该市场规模约人民币 82.4 亿元（约 $1.12B），按收入计约占全球人形机器人市场的 50%。2025 年全球出货约 18,000
              台，其中中国厂商供应约 90%。

              展望 2026 年，各机构预测因方法不同而差异很大。DirectIndustry 的市场追踪显示，2026 年中国人形机器人板块规模将超过人民币 200 亿元（$2.8B）。OFWeek
              及其他中国行业分析师给出更激进情景：2026 年人民币 1,047.1 亿元，较 2025 年近七倍跃升，支撑来自 Unitree 和 AgiBot 的量产爬坡、EngineAI
              等公司的新品导入，以及强烈的政府采购信号。TrendForce 预计，中国人形机器人产量将在 2026 年同比激增 94%。

              到 2030 年，多项预测指向接近人民币 1.19 万亿元（$165B）的市场，CAGR 超过
              65%。这些预测不确定性很高；区间很宽，反映出市场对商业采用速度以及人形机器人规模部署经济性仍未验证存在真实分歧。2025 年 11 月，NDRC
              明确警告不要让高度相似产品“扎堆涌入市场”，这是监管层对泡沫动态敏感的早期信号。对 EngineAI 而言，即便只拿下该市场温和份额——比如人民币 1,040 亿元市场的 2–3%——也意味着到 2026
              年收入可达人民币 20–30 亿元；即便最高端预测偏乐观，这仍能支撑一个可信的 IPO 增长叙事。
