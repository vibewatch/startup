        - from: engineai
          to: honghualing
          label: 产能
        - from: jd
          to: customers
          label: 标杆路径
        - from: honghualing
          to: customers
          label: 交付能力
    approximationNotes: 这些依赖反映公开证据中最影响决策的外部节点。
    claimRefs:
      - CR030
      - CR031
      - CR032
      - CR035
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 投资判断从战略位置出发，经过证据缺口，再进入估值纪律，最终落到有条件放行。
    data:
      nodes:
        - label: 品类上行空间大
        - label: Luxshare 制造验证
        - label: 早期生产就绪
        - label: 收入和客户规模缺失
        - label: 当前价格已反映成功预期
        - label: 带风险溢价的有条件放行
      edges:
        - from: Large category upside
          to: Current price already reflects success
        - from: Luxshare manufacturing validation
          to: Conditional pass with risk premium
        - from: Early production readiness
          to: Conditional pass with risk premium
        - from: Missing revenue and customer scale
          to: Conditional pass with risk premium
        - from: Current price already reflects success
          to: Conditional pass with risk premium
    approximationNotes: 流程展示决策顺序，而非因果确定性；它是投资委员会逻辑图，不是经营模型。
    claimRefs:
      - CV011
      - CV013
      - CV027
      - CV040
      - CV044
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 公允价值对部署转化和客户证据最敏感，而不是又一份增量 TAM 报告。
    data:
      items:
        - label: Luxshare 部署成功
          value: 600
        - label: 收入爬坡提速
          value: 450
        - label: IPO 通道 / 流动性支持
          value: 300
        - label: 倍数压缩
          value: -500
        - label: 客户证据延迟
          value: -650
    approximationNotes: 数值是相对基准估值的美元百万级方向性变化，并非统计推导出的敏感性。
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV045
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 情景区间显示上行空间存在，但一旦商业化节奏滑坡，下行仍然严重。
    data:
      items:
        - label: 熊市情景
          low: 200
          mid: 300
          high: 500
        - label: 基准情景
          low: 900
          mid: 1250
          high: 1600
        - label: 牛市情景
          low: 2800
          mid: 4000
          high: 5000
    approximationNotes: 区间是基于情景假设构建的美元百万级估值带，并非来自上市公司回归输出。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV046
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: EngineAI 在品类和制造杠杆上得分较好，但当前披露和客户证据偏弱。
    data:
      items:
        - label: 市场顺风
          value: 8
        - label: 制造杠杆
          value: 8
        - label: 客户证据
          value: 3
        - label: 披露质量
          value: 3
        - label: 同业定位
          value: 5
        - label: 估值纪律
          value: 4
        - label: 整体可投性
          value: 5
    approximationNotes: 评分是投资委员会基于证据集给出的 0-10 启发式判断；它概括判断，不代表模型输出。
    claimRefs:
      - CV016
      - CV017
      - CV023
      - CV037
      - CV040
      - CV041
