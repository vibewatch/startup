      - number: '4.3'
        title: 单位经济性与毛利率分析
        blocks:
          - type: paragraph
            body: >
              T800 四个版本单台定价为 $25,000–$50,000：Basic（$25K，无灵巧手）、Eco（$33K，开源、触觉感知）、Pro（$38.5K，NVIDIA Thor 芯片）和 Max（$50K，工业级
              24/7 部署）。所有版本共享同一 173 cm 机身、29-DoF 本体和固态电池。

              竞争对标很有参考意义：Unitree 2025 年在人形机器人约 5,000 台规模上实现 59.4% 毛利率，其产品组合包括售价 ¥99,000（约 $13,800）的 G1。在同等生产规模下，EngineAI
              的 T800 因 ASP 更高，理论上应产生相当或更高毛利率。Luxshare 带来的 40% 制造效率提升，意味着潜在 BOM 可从估算 $15K 基线降至约 $9K，使 $25K ASP 下毛利率接近
              64%。SA01（$5,400）和 PM01（$13,700）绝对毛利较低，但承担市场开发工具角色，推动 RL Workspace 生态采用。完整释放单位经济性，需要实现 2026 年 4,000–5,000
              台交付目标；当前 2025 年约 400 台的量不足以吃到生产学习曲线收益。
