      - number: '1.3'
        title: 融资历史与投资人版图
        blocks:
          - type: paragraph
            body: >
              自 2024 年以来，EngineAI 已在四轮融资中募集约 $367M（约人民币 26.5 亿元）：

              **Pre-A（2024 年初，约 $28M / 约人民币 2 亿元）：** Stone Venture（源码资本）领投，SenseTime 旗下 Sense Capital（商汤资本）、Honghui
              Capital（宏汇资本）和 Highlight Capital（高光资本）参与。本轮资金用于早期原型开发和团队扩张。

              **Pre-A++（2025 年中，约 $70M / 约人民币 5 亿元）：** Rocket Capital（XPeng-backed / 小鹏旗下）领投，老股东参与。资金投向 PM01 规模化生产和 T800
              研发。

              **A1 轮（2025 年 7 月，约 $70M / 约人民币 5 亿元）：** JD.com（京东）领投，CATL Capital（宁德时代）、Yintai Group（银泰集团）、Tsinghua
              Holdings Capital（清控基金）以及老股东 Sense Capital 和 Baidu Ventures（百度风投）共同投资。Pre-A++ 与 A1 两轮合计在 2025 年募集约 $139M。

              **B 轮（2026 年 4 月，$200M / 约人民币 14 亿元）：** Henan Investment Group 旗下 Huirong Fund（河南国投汇融基金）与 Luxshare
              Precision（立讯精密）共同领投。后者是 Apple 代工厂，也是中国硬件制造生态中的重量级公司。本轮将 EngineAI 投后估值推高至人民币 100 亿元以上（约
              $1.46B），使其跻身独角兽。公司历史累计融资约 $367M。

              Luxshare 不是被动财务投资人：据报道，它将 EngineAI 生产效率提升了 40%，并共同开发郑州扩产基地。JD.com 同时是投资人和早期商业部署伙伴，T800 已在深圳 JD.com
              零售门店试点。投资人组合体现出明确策略：把技术 VC（SenseTime、Baidu）、产业战略方（Luxshare、CATL）、电商分发（JD.com）和国资关联资本（Henan Investment
              Group）拼在一起。
