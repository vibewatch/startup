            body: >-
              当前轮次首先应被理解为战略标记，其次才是传统财务标记。Pandaily、Humanoids Daily、DealStreetAsia 和 Startup Fortune 的公开报道一致指向：2026 年 4
              月，公司完成 $200 million Series B，投后估值超过 RMB 10 billion，约 $1.46
              billion。对于一家在公开披露中仍基本处于收入前阶段的公司，这是一次显著上调。因此，估值无法靠已报告收入、ARR 或 EBITDA
              支撑，因为这些数字都未披露。投资人买的是四者组合：（1）稀缺的中国类人机器人资产，（2）与 Luxshare 绑定的制造加速故事，（3）香港 IPO
              可选性，（4）在完全商业化前仍奖励品类领导者的市场叙事。这个设定可以成立，但前提是估值纪律锚定在证据顺序上：生产准备度、首批规模化客户转化，然后才是更广泛的资本市场验证。
