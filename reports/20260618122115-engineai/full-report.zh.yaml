      - number: '2.3'
        title: 市场分层与使用场景
        blocks:
          - type: paragraph
            body: >
              人形机器人市场正沿三条主轴分层：应用垂直（工业 vs. 服务 vs. 消费）、价格带（高性能 vs. 商品化）和客户类型（企业 vs. 研发 vs. SMB）。

              **工业制造** 是近期收入最高的细分市场，由汽车装配、电子制造和重工业牵引。人形机器人可以完成焊接、物料搬运、质检，以及传统固定臂工业机器人难以自动化的不规则部件装配。汽车 OEM，尤其是产线高度可变的 EV
              厂商，是最活跃的试点客户之一。这里的经济账最有利：一台 $25,000、寿命 3–5 年的人形机器人，可替代年成本人民币 80,000–150,000 的人工；若机器人以 2–3 班制运行且停机很少，回本周期约
              1–3 年。

              **物流与电商履约** 是第二大部署类别，由 JD.com、SF Express 及其他电商物流运营商推动。试点部署包括拣选、分拣和最后一公里作业。JD.com 同时是投资人和物流试点客户，EngineAI
              因此直接受益。

              **零售、酒店与公共服务** 仍处早期，但能见度高，包括导购、酒店礼宾和导览应用。EngineAI 的 T800 已在 JD.com 零售门店试点；PM01 已用于公共交通和安防巡逻场景。

              **科研与教育** 由 EngineAI 的开源 SA01 和 PM01 平台服务，目标客户是高校和算法开发者。该细分单台收入较低，但能建设生态和人才管线。

              **家庭消费** 仍是 2028–2030 年才可能打开的市场。价格需要降至 $5,000–10,000 以下，运行可靠性也要大幅提升，家庭规模部署才可行。
