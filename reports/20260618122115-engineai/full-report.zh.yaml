      - number: '3.4'
        title: 护城河耐久度与竞争风险评估
        blocks:
          - type: paragraph
            body: >
              EngineAI 的竞争护城河真实存在，但很脆：

              **Luxshare 制造伙伴关系（中等护城河，中等耐久度）：** 与 Luxshare Precision 的合作带来真实制造质量优势——效率提升 40%、79 点检测流程，并接入 Apple
              供应链质量标准。但该优势有时间边界：其他竞争对手也能建立类似制造伙伴关系（Unitree 有自有生产设施；AgiBot 也可能与 Foxconn 或 Luxshare 合作），若 iPhone
              产能需求上升，Luxshare 的优先级也可能改变。

              **JD.com 渠道（中等护城河，中等耐久度）：** JD.com 同时作为投资人和分发伙伴，让 EngineAI 优先接入中国最大电商网络，但排他条款未知。若 T800 表现不能满足 JD.com
              运营需求，关系可能转向对抗。

              **T800 工业级参数（窄护城河，正在衰减）：** 当前 T800 的性能参数在其价格带处于领先。但整个行业处在 12–18 个月一轮的改进周期；Unitree G1 / R1 和 AgiBot A3
              都在快速升级。人形机器人硬件护城河很难维持超过 2–3 个产品周期。

              **深圳供应链接入（宽护城河，耐久）：** 所有中国人形机器人公司都受益于深圳生态，但 EngineAI 的南山总部位于中国最深硬件供应链核心，能降低部件成本并加快制造迭代。

              **关键竞争风险包括：**（1）Unitree $4,000 的 R1 可能在 EngineAI 通过质量差异化前，就把市场低端商品化；（2）AgiBot 10,000
              台产出给了它数据和可靠性优势，且会随规模累积；（3）2026 年 IPO 窗口内任何运营失败（如交付不及预期、T800 致伤事件）都可能严重破坏 EngineAI
              的公开市场叙事；（4）在缺少收入披露的情况下，EngineAI 相对竞争对手的市场位置完全建立在公司自称生产目标之上。
