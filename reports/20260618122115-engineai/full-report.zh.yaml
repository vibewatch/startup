  - id: TV005
    title: 投资假设破裂与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资假设的传导
      - 行动含义
    rows:
      - - 交付落空
        - 2026-2027 年产出跟踪远低于计划，或良率问题持续存在
        - 打破 Luxshare 假设中的爬坡部分
        - 转向回避，或要求全面重新定价
      - - 没有具名量产客户
        - 在规模化声明之后，试点之外没有经验证的付费部署
        - 估值变成纯叙事标记
        - 暂停进一步承销判断，直至证据出现
      - - IPO 窗口关闭
        - 香港上市停滞，或保荐人退出且没有替代方案
        - 移除主要流动性与重估路径
        - 提高折现率，并降低估值容忍度
      - - 优先权悬置开始显现
        - 出现重大棘轮、清算顺位或稀释条款
        - 即便经营改善，普通股上行空间也会被压低
        - 完成股权结构审阅后重算回报
      - - 品类满意度持续偏弱
        - 全行业客户 ROI 和留存仍差
        - 压制估值倍数支撑，也拖慢采用曲线
        - 默认用悲观情景作为分析框架
    notes: 这些触发项都按可观察事件设定，因此无需重写整套投资论点，也能更新建议。
    claimRefs:
      - CV024
      - CV025
      - CV028
      - CV042
  - id: TV006
    title: 最终尽调事项表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入和订单
        - 经审计的 2025-2026 年收入、积压订单和订单桥接
        - 判断当前价格是仍属早期，还是已经过高
        - 索取投行材料、审计摘录或 IPO 草稿财务数据
      - - 客户验证
        - 已签合同、付费部署数量，以及试点转生产转化率
        - 区分战略承诺和真实商业化
        - 索取具名客户清单、发票或 PO
      - - Luxshare 经济性
        - 制造协议范围、部署权和排他条款
        - 厘清 Luxshare 只是供应商，还是也承担需求渠道
        - 审阅最终协议和董事会材料
      - - 工厂表现
        - 各产线良率、报废率、退货和 uptime
        - 检验每 15 分钟一台的节奏能否持续
        - 索取月度运营看板并安排现场走访
      - - 股权结构和优先权
        - 优先权栈、棘轮、认股权证和员工期权池稀释
        - 改变普通股真实下行风险和上行空间
        - 获取完整股权结构表和投资条款清单
      - - IPO 准备度
        - 保荐人尽调状态、审计进度和申报时间表
        - 界定流动性路径和披露节奏
        - 索取保荐人备忘录和上市工作计划
    notes: 每项尽调要求都对应一个明确的决策阻断点；目的不是泛泛补充信息，而是拿到能改变建议的具体证据。
    claimRefs:
      - CV009
      - CV028
      - CV043
