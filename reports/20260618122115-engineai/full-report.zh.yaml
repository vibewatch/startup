        title: 产品组合架构与旗舰机器人定位
        blocks:
          - type: paragraph
            body: >
              EngineAI 披露的产品组合覆盖多个类人和相邻形态，而不是押注单一旗舰 SKU。官方制造与 CES 材料显示，这条产品线包括全尺寸 T800、轻量级 PM01、较早的 SE01
              行走机器人，以及用于扩大可及性和场景覆盖的 SA/JS 变体。在这个组合里，T800 是旗舰工业类人机器人：各类来源一致把它描述为公司的通用重载平台；PM01
              则定位为更轻、更高机动性的伴随平台，面向服务、巡逻和研究型用例。

              公开规格的方向性证据较强，但尚未完全统一。BotInfo 和 Aparobot 都把当前商用 T800 放在约 173-175 cm、75
              kg；但公开摘要和研究笔记在自由度数量、续航、防护等级和运行速度表述上存在差异。最稳妥的尽调读法是：EngineAI 明确把 T800
              营销为一款全尺寸、高动态的工业类人机器人，具备差异化关节扭矩和四档商业套装；但在公司发布统一、权威的数据表之前，投资人应把详细规格精度视为取决于版本和版型。
