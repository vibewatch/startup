  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              人形机器人竞争格局分为三层：中国规模领导者（Unitree、AgiBot）、中国第二梯队挑战者（EngineAI、UBTech、Leju / Fourier、XPeng Robotics、Booster
              Robotics），以及西方玩家（Tesla Optimus、Figure AI、Agility Robotics、Boston Dynamics）。直接替代方案——Fanuc、KUKA、ABB
              的传统固定臂工业机器人，以及“维持人工”的现状——在多数工业应用中仍是主导选项。

              EngineAI 最具威胁的直接竞争对手是 Unitree 和 AgiBot。两者兼具更高生产规模、更强财务指标，以及相当或更好的 AI 能力，同时价格更低（Unitree R1 为
              $4,000，EngineAI T800 为 $25,000）。Unitree 的 IPO 已获准登陆中国 STAR Market，AgiBot 计划 2026 年 Q3 在香港 IPO；两家龙头都可能在
              EngineAI 之前拿到大量公开市场资本，抬高竞争门槛。

              相邻威胁包括 UBTech（HKEX 上市、企业导向 Walker 系列）以及向人形相邻协作机器人扩张的中国工业机器人 incumbent。西方玩家凭借更强 AI 模型集成（Figure AI 的
              Anthropic 伙伴关系、Tesla 面向 Optimus 的全自动驾驶 AI 栈）构成长线威胁；但受地缘政治限制和低出货量影响，当前在中国商业相关性很低。
