      - number: '4.4'
        title: 收入轨迹与盈利路径
        blocks:
          - type: paragraph
            body: >
              EngineAI 未公开披露收入、EBITDA 或净利润数据。基于 2025 年约 400 台出货，以及 PM01 / SA01 / T800 试点的混合 ASP（约 $5K–$25K），估算 2025
              年收入低于 $10M。若 2026 年 4,000–5,000 台 T800 交付目标以 $25K–$50K ASP 完全实现，毛收入将达到 $100M–$250M，同比提升 10–25 倍。

              盈亏平衡路径：以 Unitree 为代理样本，它在年产约 10,000 台、毛利率超过 50% 时实现盈利。EngineAI ASP 更高，且 Luxshare
              带来利润率改善；若运营成本（研发、员工、工厂间接费用）受控，年交付 5,000–8,000 台 T800 可能达到 EBITDA 盈亏平衡。在保守假设下（2026 年 3,000 台、$30K ASP、50%
              毛利率、$120M 运营成本），EngineAI 将产生约 $45M EBITDA 亏损，B 轮 $200M 可支撑 18–24 个月 runway。

              两个关键不利信号：（1）Unitree IPO 披露，2025 年其人形机器人收入的 73.6% 来自科研 / 教育，而非工业部署；（2）Aparobot 买方满意度数据显示，全行业人形机器人客户满意度仅
