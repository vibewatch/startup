        title: 公司身份与总部
        blocks:
          - type: paragraph
            body: >
              EngineAI 的正式注册主体为深圳众擎机器人科技有限公司（Shenzhen EngineAI Robotics Technology Co., Ltd.，也称 Zhongqing Robot /
              中清机器人）。公司 2023 年 10 月成立，总部位于中国广东省深圳市南山区深圳湾科技生态园——中国最重要的科技产业集群之一。EngineAI 的主要制造设施位于深圳红花岭（约 12,000 平方米），并与
              Luxshare Precision 在河南省郑州市云智科技园联合建设第二个大型生产基地。公司官网为 https://www.engine-ai.cn（中文）和
              https://en.engineai.com.cn（英文）。EngineAI 对外表述的使命，是借助可在工业、商业和研究环境中工作的自主式人形机器人，推进通用具身智能。截至 2026 年 6
              月，EngineAI 仍是私营公司，已向 Hong Kong Stock Exchange 保密递交 IPO 申请，CICC 和 CITIC Securities
              担任联席保荐人。公司称自身已在机器人核心部件、运动控制算法和具身智能技术上实现全栈自研。
