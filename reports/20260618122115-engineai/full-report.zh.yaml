            body: >
              留存是公开记录中最弱的一块。受审阅来源没有披露 EngineAI 自身的 NRR、GRR、流失率、合同期限、续约率或复购节奏。这意味着公开证据可以确认第 0
              个月兴趣和初始部署，却无法说明账户是否留下来、扩大使用，或把试点转成经常性收入。在类人机器人里，这个缺口比软件更重要，因为客户采用资本开支重、集成强，且仍取决于可靠性和安全感知。负面信号来自行业层面，而非
              EngineAI 特有：近期引用 Morgan Stanley 的报道称，潜在工业买方中只有 23% 对目前可用的类人机器人产品满意。这不能直接衡量
