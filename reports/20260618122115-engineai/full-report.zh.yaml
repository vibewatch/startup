      - number: '2.5'
        title: 市场风险、逆风与不利信号
        blocks:
          - type: paragraph
            body: >
              尽管增长叙事偏乐观，人形机器人市场仍面对几项显著结构性风险：

              **买方满意度缺口：** 早期人形机器人购买者中，据报道满意度约 23%，说明当前产品未达到商业预期。若客户无法在初始部署中证明 ROI，复购率会很低，出货预测也不会兑现。这是全行业近期最重要的不利信号。

              **泡沫风险与市场扎堆：** NDRC 官员在 2025 年 11 月明确警告，不要让相似产品扎堆涌入市场。OFWeek 和其他中国分析师也提醒，如果早期部署不达预期，可能出现“资本寒冬”；他们把 2026
              年称为检验企业能否把技术转化为商业价值的“压力测试”。中国有超过 150 家人形机器人制造商竞争，带来强烈价格压力和商品化风险。

              **技术成熟度缺口：** 中国公司在出货量上领先，但产品在灵巧操作（人形机器人最难能力）、24/7 工业部署可靠性，以及跨非结构化环境的 AI 泛化上仍有短板。真实世界中混乱、动态环境的表现，仍弱于受控演示条件。

              **地缘政治风险：** 美国对先进半导体的出口管制，限制中国机器人公司获得 NVIDIA 及其他高端计算芯片。对缺少国产芯片替代方案的公司，这会压低 AI 能力上限；对据称升级至 NVIDIA Thor 处理器的
              EngineAI T800 Pro / Max 版本，这是特定风险。

              **标准 / 监管不确定性：** 尽管已有进展，中国人形机器人安全标准仍处早期。在强健安全框架建立前，任何重大机器人致伤或财产损害事件，都可能触发限制性监管，进而叫停部署动能。
