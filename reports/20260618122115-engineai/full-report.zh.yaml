  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与认证敞口
        blocks:
          - type: paragraph
            body: >-
              EngineAI 最高置信度的风险簇落在安全、合规和资本市场准备度的交界处。公司已经在谈大规模交付、工业用例和香港
              IPO，但公开记录中，披露的合规基础设施仍少于愿景。官方和独立产品来源描述了制造吞吐、定价和部署场景，但受审阅来源没有呈现 T800 的公开 CE、UL
              或同等级第三方安全包。这一点很关键：类人机器人要在人、客户和工厂流程附近运行，认证和事故管理准备不是纸面细节，而是商业化闸门。监管尽调路径也不完整。SEC EDGAR 没有显示 EngineAI
              申报路径，HKEX 规则描述了上市框架但没有说明 EngineAI 的申报状态，本轮中 GSXT
              访问受限。因此，监管风险不是已经证明了某个具体违规；而是在商业化主张加速时，用于承销合规、上市准备度和责任控制的公开证据仍不完整。
