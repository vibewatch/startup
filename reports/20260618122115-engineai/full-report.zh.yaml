      - number: '1.2'
        title: 创始团队与领导层
        blocks:
          - type: paragraph
            body: >
              EngineAI 由 Zhao Tongyang（赵同阳）创立，他同时担任 CEO 和董事长。Zhao 是连续机器人创业者，约 2012 年进入科技行业，最早做 IoT 设备，2016
              年前后转向双足人形机器人。他曾创办四足机器人公司 Dogotix，后被 XPeng Motors 收购。在 XPeng 及其机器人分拆业务 Pengxing Intelligent 期间，Zhao
              负责推进人形机器人研发；离开后创立 EngineAI，并带走了核心工程团队中的相当一部分。Zhao 拥有 Zhuzhou Normal
              University（株洲师范高等专科学校）自动化控制学士学位。他的管理风格以亲自上场著称——曾在镜头前让 EngineAI 机器人踢自己，用现场演示证明机器人的能力和可控性。

              联合创始人 Ren Guowen（任国文）负责制造运营，并出现在深圳智能制造基地启动的 PR Newswire 公告中。EngineAI 更广泛的核心团队来自 Pengxing Intelligent /
              XPeng 机器人部门，成员拥有 Carnegie Mellon University、MIT、ETH Zurich、Tsinghua University、Peking University、Fudan
              University、Shanghai Jiao Tong University、Hong Kong University of Science and Technology（HKUST）、National
              University of Singapore、Harbin Institute of Technology 和 University of Tokyo
              等院校的高阶学位。公司强调重研发文化，硕士和博士占比高。截至 2026 年 6 月 IPO 递表，精确董事会组成和治理结构尚未公开；这仍是外部投资者需要补齐的重要信息缺口。
