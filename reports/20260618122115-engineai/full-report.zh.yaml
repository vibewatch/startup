      - number: '1.5'
        title: 制造规模与运营
        blocks:
          - type: paragraph
            body: >
              EngineAI 位于红花岭的 12,000 平方米深圳智能制造基地跑通了一条一体化闭环流程：来料检验 → 部件装配 → 子系统测试 → 总装 → 79 项质量检测 → 46 个工况仿真测试 →
              发货。该产线节拍达到每 15 分钟一台 T800，公司据此声称满产年产能约 35,000 台。公司目标是在 2026 年底前交付 4,000–5,000 台 T800，并在 2027 年提升至年产
              30,000–50,000 台。

              公司 2026 年 6 月新闻稿披露，制造质量由四根支柱支撑：（1）供应链质量控制，对部件准入严格把关；（2）先进自动化工艺（自动锁附、点胶、激光焊接，效率提升
              40%）；（3）数字化管理和部件全链路追溯；（4）严格测试。第二个生产基地位于河南郑州，由 EngineAI 与 Luxshare 共同开发，Henan Investment Group
              提供地方国资支持。多基地制造策略既对冲地缘政治风险，也贴合河南打造机器人制造枢纽的目标。

              EngineAI 尚未公开员工数；媒体估算显示，截至 2026 年中，公司约有 300–500 名员工，明显偏工程团队。经核实的员工数和收入数据缺失，是潜在投资者在香港 IPO 前尽调必须处理的重要缺口。
