      - number: '3.3'
        title: 能力、定价与分发对比
        blocks:
          - type: paragraph
            body: >
              EngineAI T800 在性能参数上具备竞争力：29 DoF、450 Nm 峰值扭矩和 14,000 W 峰值功率，相比已公布竞争产品并不吃亏。T800 的镁铝合金框架、固态电池和 Luxshare
              质量制造流程，使其区别于低成本中国替代品。但 EngineAI 的 $25,000–$50,000 价格带明显高于 Unitree R1（$4,000）和 AgiBot A3（低于
              $20,000），形成价格—价值缺口；EngineAI 必须用更高可靠性、工业级耐久度或特定场景性能优势来证明这一定价。

              在 AI 能力上，中国三大领导者都重投强化学习和模仿学习，用于运动控制；但 Unitree 和 AgiBot 有更长时间、更高出货量来收集真实世界训练数据。EngineAI
              的端到端神经网络运动方案在技术上成立，但公开验证数据少于竞争对手。Figure AI 由 Anthropic 支持的语言模型集成，以及 Tesla Optimus 计划中的全栈
              AI，让西方玩家尽管当前出货落后，仍可能长期领先 AI 质量。

              分发是关键差异点。Unitree 拥有广泛全球分销网络，并通过线上渠道销售（包括国际客户）。AgiBot 面向中国汽车和电子制造企业直接销售。EngineAI 的 JD.com
              伙伴关系提供了进入中国最大电商物流网络的通道，但高度集中在单一关系上。Luxshare 的制造足迹未来可用于出口，但国际分发仍不成熟。

              在信任和监管姿态上，Unitree 走得最远，其 STAR Market 招股书提供完整财务披露；UBTech（HKEX 上市）次之。AgiBot 和 EngineAI 都在 IPO
              进程中，但均未发布招股书。所有中国玩家都面临美国和欧盟因中国 AI 硬件地缘政治顾虑而施加进口限制的可能。
