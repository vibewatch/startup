  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              EngineAI 的融资节奏在中国机器人史上属于最压缩的一类。公司 2023 年 10 月成立，2024 年完成约 $28M 的 Pre-A 轮，由 Stone Venture 领投，SenseTime 旗下
              Sense Capital 和 Highlight Capital 参与。这笔早期资金支持了 SE01 与 PM01 研发项目，以及早期团队扩张。

              2025 年 7 月，EngineAI 连续完成两轮融资，合计约人民币 10 亿元（约 $139–140M）。Pre-A++（约 $70M）由 Rocket Capital 和 XPeng Motors
              领投；A1（约 $70M）由 JD.com 领投，CATL Capital 和 Tsinghua Holdings Capital
              共同投资。两轮结构推进速度异常，反映出中国机构投资人争抢头部人形机器人公司股权的激烈程度。

              2026 年 4 月 B 轮融资 $200M，由 Luxshare Precision 和 Huirong Fund（Henan Investment Group）共同领投，Zhongchuang
              Zhiling、Cornerstone Capital 和 Huangpujiang Capital 参与。老股东 JD.com 和 CATL 继续持有。累计融资约 $368M，投后估值超过人民币 100
              亿元（约 $1.46B），使公司在成立约 30 个月后获得独角兽身份——即便按中国科技创业标准也非常快。
