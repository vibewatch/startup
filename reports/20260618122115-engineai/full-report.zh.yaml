companyProfile:
  summary: >
    EngineAI（Shenzhen EngineAI Robotics Technology Co., Ltd；中清机器人）是一家全栈人形机器人创业公司，2023 年 10 月成立于中国深圳。公司设计、制造并销售 T800
    系列全尺寸工业人形机器人，面向制造装配、物流、服务和危险作业场景。不到三年里，EngineAI 完成 Pre-A、Pre-A++、A1 和 B 轮，累计融资约 $368M，B 轮后估值超过人民币 100
    亿元（$1.46B+）。Apple 核心组装伙伴 Luxshare Precision 领投 B 轮，释放出制造可信度和潜在绑定客户需求的信号。公司已于 2026 年向港交所保密递表，联席保荐人为 CICC 和 CITIC
    Securities。
  foundedDate: '2023-10-01'
