      - number: '8.3'
        title: 投资论点、反论点与建议
        blocks:
          - type: paragraph
            body: >-
              牛市论点是连贯的：EngineAI 从创立到独角兽推进很快，如今股东表上已有战略制造商，而更广泛的类人机器人品类仍受益于巨大的自上而下市场预测和中国显著的政策顺风。Luxshare
              尤其重要，因为它缩小了“演示惊艳的公司”和“可能规模化的硬件公司”之间的差距。反论点同样清晰。公开证据仍没有显示已披露收入、经审计客户集中度、经验证的生产规模部署，或股权表细节。负面类比也真实存在：Aparobot
              的满意度信号显示，品类层面的失望仍高；Unitree 和 AgiBot
              等同行领导者已经占据更强的规模叙事。这些相互对立的事实导向一个价格敏感判断，而不是公司质量判断。只有在投资人明确要求部署证明、接受中等置信度，并施加较大的中国风险溢价，而不是按票面价值承销本轮时，EngineAI
              才值得有条件通过。
