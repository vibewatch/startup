      - number: '1.4'
        title: 产品组合与公司里程碑
        blocks:
          - type: paragraph
            body: >
              成立以来，EngineAI 已推出四个人形机器人平台和一个四足平台：

              **SE01（2024）：** 全尺寸通用人形机器人（170 cm、55 kg、32 DoF、330 Nm 峰值扭矩）。早期以强化学习 + 模仿学习实现超逼真自然步态演示而受到关注。

              **PM01（2024–2025）：** 轻量级具身智能体（138 cm、约 40 kg、23–24 DoF）。起售价约 $13,700，提供商业版和教育版。2025 年，PM01 完成 EngineAI
              所称的全球首个人形机器人前空翻，引发病毒式传播。2025 年 PM01 产出数百台（小批量生产阶段）。

              **SA01（2025）：** 面向开发者的开源平台（约 170 cm、约 50 kg、约 32 DoF），起售价约 $5,400，目标客户是研究实验室和高校团队。提供完整 SDK 和二次开发支持。

              **JS01（四足，2025）：** 面向户外巡检和物流任务的四足平台，使 EngineAI 进入 Unitree 和 XPeng 所在的相邻四足市场。

              **T800（CES 2026 首发，2026 年 5 / 6 月开始量产）：** 全尺寸工业级人形机器人（29 DoF、450 Nm 峰值扭矩、14,000 W
              瞬时关节功率、镁铝合金外骨骼）。提供四个版本：Basic（$25,000）、Eco（$33,000）、Pro（$38,500）、Max（$50,000）。T800 是公司 2026 年规模交付的旗舰产品。

              关键里程碑包括：2023 年 10 月成立；2024 年 SE01 演示；2025 年 PM01 全球首个前空翻和病毒式营销；2026 年 1 月 T800 在 CES 2026 全球首发；2026 年 5 月
              29 日深圳红花岭制造基地启用；以及 2026 年 6 月向香港保密递交 IPO 申请。
