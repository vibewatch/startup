            body: >
              EngineAI 对外把自己定位为全栈具身智能公司，而不是底盘供应商。官方和合作伙伴材料称，公司自研核心部件、运动控制算法和具身 AI
              技术。实际看，公开技术栈似乎落在四层：自有机电硬件；把经典控制与强化学习结合的混合运动控制层；基于 NVIDIA 的高端算力和仿真工具；以及通过 Native SDK GitHub
              仓库暴露给外部的、规模不大但具体存在的开发者层。

              GitHub 证据尤其重要，因为它是少数可直接检查的技术资产之一。访问时，公开组织目前只暴露一个仓库：C++ Native SDK，39 个 star、13 个 fork。该仓库宣称支持配置驱动的任务编排、面向
              FSM 的插件机制，以及 GPU 加速容器渲染。这是有意义的开发者信号，但还谈不上广泛的生态透明度。尽调视角下，EngineAI 在控制、运动和具身系统集成上更强；外部开放文档深度则仍偏弱。
