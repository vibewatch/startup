      - number: '2.4'
        title: EngineAI 的市场位置与可服务机会
        blocks:
          - type: paragraph
            body: >
              2025 年，EngineAI 位居人形机器人第二梯队。TrendForce 和独立分析师估算，公司 2025 年出货约 400 台（约占全球约 13,300 台出货的 3%），而市场领导者 AgiBot 约
              5,168 台（39%），Unitree 约 4,200–5,500 台（32–38%）。这使 EngineAI 明显低于中国前两名，也略低于国内同行 UBTech（约 1,000 台）和 Leju /
              Fourier（各约 300–500 台）。

              但在第二梯队里，EngineAI 的轨迹最陡：其 2026 年交付目标为 4,000–5,000 台，较 2025 年实际数约增长 10–12 倍；相比之下，Unitree 2026 年计划产能为 75,000
              台（大多已有基础）。EngineAI 能否跑出这条爬坡曲线，是 IPO 论证中的核心商业问题。

              EngineAI 近期可服务市场（面向工业 / 服务客户、$25,000–$50,000 的 T800）大致是高端工业细分市场，差异化来自机器人性能、灵巧手和制造质量，而非商品化定价。Luxshare
              伙伴关系给了 EngineAI 在该细分市场的可信度，这是纯机器人创业公司通常缺少的。

              2026 年中国工业级人形机器人的总可服务市场（TAM）保守估计为人民币 100–200 亿元（$1.4–2.8B），到 2030 年在所有垂直领域增长至人民币 1,000
              亿元以上（$14B+）。EngineAI 当前的可服务可得市场（SAM）为面向工业、安防和零售客户的 T800，规模人民币 20–50 亿元（$280M–700M）。若到 2028 年 EngineAI 拿下
              5–10% SAM 份额，隐含收入为人民币 1–5 亿元（$14–70M）——可信，但仍处于盈利前区间。
