      - number: '6.3'
        title: Retention, durability, and satisfaction gaps
        blocks:
          - type: paragraph
            body: >
              Retention is the weakest part of the public record. No reviewed source disclosed NRR, GRR, churn, contract
              duration, renewal rate, or repeat-order cadence for EngineAI itself. That means the public evidence can
              confirm month-zero interest and initial deployments, but not whether accounts stick, expand, or convert
              pilots into recurring revenue. This gap matters more in humanoid robotics than in software because
              customer adoption is capital intensive, integration heavy, and still dependent on reliability and safety
              perception. The adverse signal is sector level rather than EngineAI-specific: recent coverage citing
              Morgan Stanley says only 23% of prospective industrial buyers were satisfied with currently available
              humanoid products. That does not directly measure EngineAI, but it does warn that demand conversion may
              lag manufacturing ambition across the category. Until EngineAI can show reference customers, uptime,
              task-completion metrics, or repeat purchase evidence, durability should be scored as unproven rather than
              assumed.
