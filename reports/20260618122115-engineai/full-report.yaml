      - number: '8.2'
        title: Comparable anchors and scenario framework
        blocks:
          - type: paragraph
            body: >-
              Because EngineAI is not yet disclosing revenue, the most defensible valuation method is scenario-based
              rather than purely comparable-based. The comparable set still matters, but mainly as an anchor for what
              capital markets have recently been willing to underwrite in Chinese humanoid robotics. CNBC places Unitree
              near a $7 billion IPO valuation, while secondary coverage places AgiBot in a roughly $5 billion to $6.4
              billion zone. Both peers are farther along on visible shipment scale and disclosure than EngineAI, so
              their marks cannot be imported directly. The more practical question is what level of future revenue and
              deployment proof would justify EngineAI’s present price. In a bull case, Luxshare-enabled manufacturing
              and early customer adoption could support a multi-billion-dollar outcome. In a base case, EngineAI can
              grow into today’s price but does not offer obvious underwriting upside. In a bear case, commercialization
              delays and multiple compression would leave the current mark looking aggressively early.
