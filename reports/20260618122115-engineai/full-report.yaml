      - number: '6.2'
        title: Named proof and adoption trajectory
        blocks:
          - type: paragraph
            body: >
              The strongest named-customer proof is JD.com, but even there the record points to pilot and channel
              activity rather than a published production fleet contract. ChinaBiz Insider reports a JD.com retail-store
              trial in Shenzhen, while BotInfo documents JD.com as the active preorder channel with a deposit-based
              reservation model. More broadly, management's adoption language is ahead of the disclosed proof set.
              EngineAI has announced a 12,000-square-meter Honghualing manufacturing base, a one-unit-per-15-minute line
              target, and preparation for 4,000 to 5,000 deliveries in 2026, plus framework orders exceeding RMB 500
              million across three sectors. Those signals matter because they show a company organizing for volume.
              However, they do not substitute for named outcomes, site counts, or repeat purchases. Public mentions of
              NVIDIA, Amazon, Tencent, and ByteDance expand the addressable narrative, but they remain ecosystem or
              scenario evidence until independently corroborated by customer-authored deployment results.
