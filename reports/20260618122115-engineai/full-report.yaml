      - number: '1.5'
        title: Manufacturing Scale and Operations
        blocks:
          - type: paragraph
            body: >
              EngineAI's 12,000-square-metre Shenzhen Intelligent Manufacturing Base in Honghualing runs an integrated
              closed-loop process: incoming inspection → component assembly → sub-system testing → final assembly →
              79-point quality inspection → 46 working-condition simulation tests → shipping. This line achieves a cycle
              time of one T800 every 15 minutes, enabling claimed annual capacity of roughly 35,000 units at full
              utilization. The company targets delivery of 4,000–5,000 T800 units by year-end 2026, scaling to
              30,000–50,000 units per year by 2027.

              Manufacturing quality is underpinned by four pillars disclosed in the company's June 2026 press release:
              (1) supply chain quality control with strict component qualification; (2) advanced automated processes
              (automated locking, gluing, laser welding, improving efficiency 40%); (3) digital management and full-link
              component traceability; and (4) rigorous testing. A second production site in Zhengzhou (Henan Province)
              is being co-developed with Luxshare, with Henan Investment Group providing local state backing. The
              multi-site manufacturing strategy hedges geopolitical risk and aligns with Henan's ambitions as a
              robotics-manufacturing hub.

              EngineAI's headcount has not been publicly disclosed; estimates from media coverage suggest roughly
              300–500 employees as of mid-2026, heavily weighted toward engineering. The absence of verified headcount
              and revenue data is a material gap that potential investors should address through due diligence prior to
              the Hong Kong IPO.
