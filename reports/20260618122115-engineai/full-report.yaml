            body: >
              EngineAI has no publicly disclosed revenue, EBITDA, or net income figures. Based on ~400 units shipped in

              2025 at blended ASPs (~$5K–$25K for PM01/SA01/T800 pilots), estimated 2025 revenues are less than $10M.

              The 2026 delivery target of 4,000–5,000 T800 units at $25K–$50K ASP would yield gross revenue of

              $100M–$250M if fully achieved—a 10–25x year-over-year increase.


              Path to breakeven: Using Unitree as a proxy, it achieved profitability at ~10,000 units/year with >50%
              gross

              margins. EngineAI, with higher ASPs and Luxshare-enabled margins, could reach EBITDA breakeven at

              5,000–8,000 annual T800 units if operating costs (R&D, headcount, factory overhead) are controlled. Under

              conservative assumptions (3,000 units in 2026 at $30K ASP, 50% gross margin, $120M operating costs),

              EngineAI would operate at approximately $45M EBITDA loss, with 18–24 month runway from the $200M Series B.

