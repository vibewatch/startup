      - number: '5.3'
        title: Commercialization workflow, deployment targets, and manufacturing readiness
        blocks:
          - type: paragraph
            body: >
              Public commercialization evidence centers on a manufacturing-first narrative. PRNewswire's Honghualing
              launch note describes a 12,000 sqm Shenzhen base with end-to-end inspection, assembly, testing, shipment,
              and after-sales loops, plus a reported cadence of one robot every 15 minutes. The same release attributes
              a 40% production-efficiency gain to automated process upgrades and says each robot passes 79 inspections
              and 46 simulated-condition tests before delivery. Independent coverage ties Luxshare's involvement
              directly to the problem EngineAI must solve next: turning viral locomotion demos into repeatable
              industrial output.

              Go-to-market evidence points to a staged customer workflow. The product pages and third-party summaries
              show T800 pre-orders through JD.com, edition-based packaging for different buyer cohorts, and scenario
              marketing across industrial assembly, logistics, retail service, patrol, hazardous operations, and
              longer-horizon household-assistant ambitions. The partner set — NVIDIA, Amazon, JD.com, Tencent, and
              ByteDance in Robot Report coverage — supports the claim that EngineAI is trying to build application
              channels and ecosystem leverage around the robot body, not just sell stand-alone hardware.
