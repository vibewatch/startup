    sections:
      - number: '1.1'
        title: Company Identity and Headquarters
        blocks:
          - type: paragraph
            body: >
              EngineAI is formally registered as Shenzhen EngineAI Robotics Technology Co., Ltd. (深圳众擎机器人科技有限公司, also
              known as Zhongqing Robot / 中清机器人). The company was founded in October 2023 and is headquartered at the
              Shenzhen Bay Innovation and Technology Center, Nanshan District, Shenzhen, Guangdong, China—one of China's
              premier technology clusters. EngineAI operates its primary manufacturing facility at Honghualing in
              Shenzhen (approximately 12,000 sq m), with a second large-scale production site jointly developed with
              Luxshare Precision at Zhengzhou's Yunzhi Science Park in Henan Province. The company's official websites
              are https://www.engine-ai.cn (Chinese) and https://en.engineai.com.cn (English). EngineAI's stated mission
              is to advance general-purpose embodied intelligence through autonomous humanoid robots that can operate in
              industrial, commercial, and research environments. As of June 2026, EngineAI is a private company that has
              filed confidentially for an IPO on the Hong Kong Stock Exchange, with CICC and CITIC Securities serving as
              joint sponsors. The company describes itself as having achieved full-stack in-house development across
              core robotic components, motion control algorithms, and embodied AI technologies.
