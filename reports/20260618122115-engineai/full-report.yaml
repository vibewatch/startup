      - number: '5.4'
        title: Technology verdict and unresolved diligence risks
        blocks:
          - type: paragraph
            body: >
              EngineAI's technical position is credible but not category-leading. Against Chinese peers, the company
              appears to occupy a mid-tier cost-performance lane: more industrial and better packaged than low-end
              spectacle bots, but still behind Unitree on manufacturing scale and behind the best Western peers on
              perceived system quality and public reproducibility. That balance can be investable if Luxshare-enabled
              manufacturing quality, NVIDIA-aligned tooling, and differentiated actuators translate into reliable
              enterprise deployment economics.

              The remaining risks are classic pre-scale robotics risks rather than obvious fraud signals. Public spec
              sheets are inconsistent, the public code footprint is narrow, verified deployment counts remain sparse,
              and formal safety-certification evidence for T800 is still not clearly surfaced in the accessible record.
              Those gaps do not negate the technology story, but they materially limit how confidently an outside
              diligence process can underwrite uptime, safety, and replicability at fleet scale.
