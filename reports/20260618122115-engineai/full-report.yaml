      - number: '6.4'
        title: Expansion upside versus concentration risk
        blocks:
          - type: paragraph
            body: >
              Expansion upside exists, but it is tightly linked to a small group of ecosystem anchors. Luxshare
              Precision can help EngineAI cross the line from prototype manufacturing to higher-yield production and may
              eventually open factory-floor deployments. Henan Investment Group can support regional procurement,
              industrial-base buildout, and state-linked scenario expansion. JD.com can keep serving as both sales
              channel and early reference account. Yet this same trio also reveals concentration risk: the public
              customer story still depends on a few partner-investor relationships doing multiple jobs at once—funding,
              distribution, manufacturing, and deployment validation. That is efficient in the short run but fragile if
              any one pathway stalls. Independent market reports from Bain, MarketsandMarkets, Morgan Stanley,
              Precedence Research, and Emergen Research all point to large long-term humanoid demand, while the June
              2026 arXiv search shows a research frontier that is still moving fast. The implication is that category
              tailwinds exist, but customer durability will be won account by account, not granted by market size alone.
              Public references remain thinner than the market narrative.
