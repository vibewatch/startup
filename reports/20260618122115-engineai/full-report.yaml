      - number: '2.4'
        title: EngineAI's Market Position and Addressable Opportunity
        blocks:
          - type: paragraph
            body: >
              In 2025, EngineAI ranked as a second-tier humanoid robotics vendor. TrendForce and independent analysts
              estimate the company shipped approximately 400 units in 2025 (roughly 3% of the approximately 13,300
              global units shipped), compared to market leader AgiBot at ~5,168 units (39%) and Unitree at ~4,200–5,500
              units (32–38%). This positions EngineAI well below the top two Chinese players and slightly below domestic
              peers UBTech (~1,000 units) and Leju/Fourier (~300–500 units each).

              However, EngineAI's trajectory is the steepest of the second-tier group: its 2026 delivery target of
              4,000–5,000 units would represent a roughly 10–12× increase from 2025 actuals, compared to Unitree's
              planned 2026 capacity of 75,000 units (mostly pre-existing). Whether EngineAI can execute this ramp is the
              central commercial question for the IPO thesis.

              EngineAI's addressable market in the near term ($25,000–$50,000 T800 for industrial/service customers) is
              roughly the premium industrial subsegment, where differentiation comes from robot performance, dexterous
              hands, and manufacturing quality, rather than commodity pricing. The Luxshare partnership gives EngineAI
              credibility in this segment that pure robotics startups typically lack.

              Total addressable market (TAM) for industrial-grade humanoid robots in China in 2026 is conservatively RMB
              10–20B ($1.4–2.8B), growing to RMB 100B+ ($14B+) by 2030 across all verticals. EngineAI's serviceable
              addressable market (SAM), targeting industrial, security, and retail customers with the T800, is currently
              RMB 2–5B ($280M–700M). If EngineAI captures 5–10% SAM share by 2028, implied revenue would be RMB 100–500M
              ($14–70M) — a plausible but still pre-profitability range.
            claimRefs:
