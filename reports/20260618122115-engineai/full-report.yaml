  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Size, Growth Trajectory, and Key Forecasts
        blocks:
          - type: paragraph
            body: >
              China's humanoid robot market is widely regarded as the fastest-growing subsector in global robotics. In
              2025, the market reached approximately RMB 8.24B (~$1.12 billion), accounting for roughly 50% of the
              global humanoid robotics market by revenue. Global unit shipments in 2025 reached approximately 18,000
              units, of which Chinese vendors supplied around 90%.

              Looking into 2026, forecasts vary significantly by methodology. DirectIndustry's market tracker places the
              China humanoid robot sector above RMB 20B ($2.8B) in 2026. OFWeek and other Chinese industry analysts
              project a more aggressive scenario of RMB 104.71B in 2026 — a nearly seven-fold step-up from 2025 —
              underpinned by mass production scale-ups from Unitree and AgiBot, new product introductions from EngineAI
              and others, and strong government procurement signals. TrendForce projects China humanoid robot output
              volume to surge 94% in 2026 year-over-year.

              By 2030, various forecasts call for a market approaching RMB 1.19 trillion ($165B) with a CAGR exceeding
              65%. These projections carry significant uncertainty; the wide range reflects genuine disagreement about
              the pace of commercial adoption and the unproven economics of deploying humanoid robots at scale. The NDRC
              in November 2025 explicitly warned against "flooding the market" with highly similar products, an early
              signal that regulators are sensitive to bubble dynamics. For EngineAI, even capturing a modest share of
              this market — say 2–3% of a RMB 104B market — implies revenue of RMB 2–3B by 2026, providing a plausible
              IPO growth narrative even if the top-end forecast proves optimistic.
            claimRefs:
