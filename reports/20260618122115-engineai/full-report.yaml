      - number: '2.5'
        title: Market Risks, Headwinds, and Adverse Signals
        blocks:
          - type: paragraph
            body: >
              Despite the bullish growth narrative, the humanoid robot market faces several significant structural
              risks:

              **Buyer satisfaction gap:** A reported buyer satisfaction rate of approximately 23% among early humanoid
              robot purchasers signals that current products do not meet commercial expectations. If customers cannot
              demonstrate ROI on initial deployments, re-order rates will be low and the volume projections will not
              materialize. This is the most important near-term adverse signal for all vendors in the sector.

              **Bubble risk and market flooding:** NDRC officials explicitly warned in November 2025 against flooding
              the market with similar products. OFWeek and other Chinese analysts similarly caution about a "Capital
              Cold Winter" scenario if initial deployments underperform, describing 2026 as a "stress test" for which
              companies can convert technology into commercial value. Over 150 humanoid robot manufacturers compete in
              China, creating intense price pressure and commoditization risk.

              **Technology readiness gaps:** While Chinese companies lead in volume, their products face gaps in
              dexterous manipulation (the most challenging humanoid capability), reliability for 24/7 industrial
              deployment, and AI generalization across unstructured environments. Real-world performance in messy,
              dynamic environments remains inferior to controlled demonstration conditions.

              **Geopolitical risk:** US export controls on advanced semiconductors constrain access to NVIDIA and other
              high-end computing chips for Chinese robotics companies. This limits the AI capability ceiling for
              companies without domestic chip alternatives and is a specific risk for EngineAI's T800 Pro/Max editions
              which reportedly upgrade to NVIDIA Thor processors.

              **Standards/regulatory uncertainty:** Despite progress, China's humanoid robot safety standards are
              nascent. Any significant robot-caused injury or property damage incident before robust safety frameworks
              exist could trigger restrictive regulation that halts deployment momentum.
            claimRefs:
              - CM027
              - CM028
