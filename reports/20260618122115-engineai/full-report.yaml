  productSummary: >
    EngineAI's product portfolio is led by the T800, a full-size (173-175 cm, 75 kg) industrial humanoid robot with
    29-42 degrees of freedom, IP54 ingress protection, and tiered commercial packaging (Basic/Eco/Pro/Max at
    approximately $25K-$50K). The PM01 is a lighter companion platform for service and patrol scenarios. Additional
