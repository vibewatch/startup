        title: Embodied-AI stack, controls, and developer surface
        blocks:
          - type: paragraph
            body: >
              EngineAI publicly presents itself as a full-stack embodied-intelligence company rather than a chassis
              vendor. Official and partner materials say the company develops core components, motion control
              algorithms, and embodied-AI technologies in house. In practice, the public stack appears to rest on four
              layers: proprietary electromechanical hardware, a hybrid motion-control layer that combines classical
              control with reinforcement learning, NVIDIA-based high-end compute and simulation tooling, and a modest
              but concrete external developer layer exposed through the Native SDK GitHub repository.

              The GitHub evidence is especially important because it is one of the few directly inspectable technical
              artifacts. The public organization currently exposes only one repository, a C++ Native SDK with 39 stars
              and 13 forks at access time. That repository advertises configuration-driven task orchestration, an
              FSM-oriented plugin mechanism, and GPU-accelerated container rendering. This is meaningful developer
              signal, but it does not yet amount to broad ecosystem transparency. For diligence purposes, EngineAI looks
              stronger on control, locomotion, and embodied-system integration than on open external documentation
              depth.
