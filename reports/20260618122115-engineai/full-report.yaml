      - number: '3.2'
        title: Key Competitor Profiles
        blocks:
          - type: paragraph
            body: >
              **Unitree Robotics (宇树科技)** is the undisputed market leader, founded 2016, Hangzhou-based, and backed by
              Sequoia China (HongShan), Tencent, and Alibaba. Its 2025 revenue reached RMB 1.7B (~$236M) — a 335% YoY
              increase — with gross margins of approximately 59.4% and adjusted net profit of RMB 591M ($82.1M), making
              it the only profitable humanoid robot company with verified financials. Unitree's R1 robot, priced at
              approximately $4,000, has made it the market-share leader by volume (32–38% global in 2025). Its STAR
              Market IPO application was accepted March 20, 2026, with a hearing on June 1, 2026; implied valuation is
              approximately $5.7–7B. Unitree is earmarking RMB 2B+ of IPO proceeds for AI, robotics architecture, and
              manufacturing facilities.

              **AgiBot (智元机器人 / Zhiyuan Innovation)** is the #1 Chinese humanoid vendor by 2025 shipment volume (~5,168
              units, ~39% global share). Backed by Tencent, HongShan, BYD, Hillhouse Investment, and LG Electronics,
              AgiBot targets a Hong Kong IPO in Q3 2026 at a valuation of $5.1–6.4B. The company ships the Yuanzheng
              (A3) and Lingxi series, with the A3 priced below $20,000. AgiBot shipped its 10,000th unit in Q2 2026,
              cementing its position as China's highest-volume humanoid robot manufacturer. The company has former
              Huawei engineers in leadership, bringing deep hardware engineering expertise.

              **UBTech (优必选)** is the first humanoid robot company to achieve an HKEX listing. Enterprise-focused with
              its Walker series, UBTech shipped approximately 1,000 units in 2025 (7% market share) and has pivoted
              toward elder care and service applications. Its public-company status provides transparency but also
              subjects it to investor scrutiny on profitability timelines.

              **Tesla Optimus** is in active R&D with limited commercial deployment (sub-150 units in 2025 for internal
              testing). Tesla's massive AI infrastructure, Full Self-Driving stack, and manufacturing expertise (Nevada
              Gigafactory model) make it the most credible long-term threat, but it remains commercially irrelevant in
              China in 2026. Its Dojo AI training system and Autopilot vision could give it a step-function advantage in
              robot AI capabilities if successfully transferred to humanoids.

              **Figure AI (US)** raised at a $2.6B valuation and has partnered with BMW for industrial robot deployments
              and Anthropic for AI model integration. With approximately 150 commercial units shipped in 2025, Figure is
              not a current market competitor in China but represents the benchmark for AI sophistication in humanoid
              robots.

              **Agility Robotics (Digit)** is backed by Amazon and focuses on warehouse logistics. Its partnership with
              Amazon gives it the clearest commercial ROI demonstration among Western players, making it the most
              credible proof-of-concept for logistics deployment — directly relevant to EngineAI's JD.com thesis.
