  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current valuation context and price discipline
        blocks:
          - type: paragraph
            body: >-
              The current round should be read first as a strategic mark and only second as a traditional financial
              mark. Public reporting across Pandaily, Humanoids Daily, DealStreetAsia, and Startup Fortune converges on
              a $200 million Series B in April 2026 at a post-money valuation above RMB 10 billion, or roughly $1.46
              billion. That is a meaningful step-up for a company that remains effectively pre-revenue in public
              disclosures. The valuation therefore cannot be defended with reported revenue, ARR, or EBITDA because none
              of those figures are disclosed. Instead, investors are paying for the combination of (1) a scarce Chinese
              humanoid robotics asset, (2) a manufacturing acceleration story tied to Luxshare, (3) optionality around a
              Hong Kong IPO, and (4) a market narrative that still rewards category leaders before full
              commercialization. That setup can work, but only if valuation discipline stays anchored to proof
              sequencing: production readiness, first scaled customer conversion, and then broader capital-markets
              validation.
            claimRefs:
