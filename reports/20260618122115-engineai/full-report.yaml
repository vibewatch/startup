companyProfile:
  summary: >
    EngineAI (Shenzhen EngineAI Robotics Technology Co., Ltd; 中清机器人) is a full-stack humanoid robotics startup founded
    in October 2023 in Shenzhen, China. The company designs, manufactures, and markets the T800 series of full-size
    industrial humanoid robots targeting manufacturing assembly, logistics, service, and hazardous operations. EngineAI
    has raised approximately $368M across pre-A, pre-A++, A1, and Series B rounds in under three years, reaching a
    post-Series B valuation exceeding RMB 10 billion ($1.46B+). Luxshare Precision — Apple's primary assembly partner —
    leads the Series B, signaling manufacturing credibility and potential captive customer demand. The company filed
    confidentially for a Hong Kong IPO in 2026, sponsored by CICC and CITIC Securities.
