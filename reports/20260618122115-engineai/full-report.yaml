      - number: '2.2'
        title: Government Policy and Structural Demand Drivers
        blocks:
          - type: paragraph
            body: >
              China's humanoid robotics boom is not purely market-driven: the state is a primary architect of the
              sector's growth. Key policy catalysts include:

              **Made in China 2025 (2015 onwards):** Designated advanced robotics as one of ten strategic manufacturing
              sectors. Set explicit targets for domestic robot production capability and industrial penetration.

              **MIIT Guidance on Innovation and Development of Humanoid Robots (2023):** Established the first
              national-level roadmap specifically for humanoid robots, with development targets for 2025 (breakthrough
              of key technologies, initial batch production) and 2027 (formation of safe and reliable products and
              industrial ecosystem).

              **Robot+ Action Plan (2023):** Broadened the focus of state robotics support from pure manufacturing
              automation to include healthcare, agriculture, logistics, elder care, and public safety — dramatically
              expanding the total addressable market for humanoid robots.

              **MIIT/TC8 Standardization Committee (December 2025):** MIIT established the Standardization Technical
              Committee for Humanoid Robots and Embodied Intelligence, formally initiating national-level standard
              development covering terminology, technical requirements, interface protocols, and safety specifications.
              This reduces fragmentation, lowers R&D costs, and creates a clearer commercial-readiness framework.

              **Local government support:** Cities including Beijing, Shanghai, Shenzhen, and Hangzhou are setting up
              dedicated robotics industrial funds, R&D subsidies, and scenario pilot programs. Henan Province
              (EngineAI's Zhengzhou expansion partner) is a notable new entrant seeking to build a robotics
              manufacturing hub. NDRC November 2025 guidance signals a shift from universal support to "precision drip
              irrigation" targeting core-component breakthroughs.

              The structural demand driver is China's demographic challenge: a declining working-age population, rising
              manufacturing labor costs, and a growing elderly population create multi-decade demand pull for robots
              capable of performing physical labor. China's position as the world's largest manufacturing economy means
              even a small penetration rate into the ~100M manufacturing jobs represents enormous potential unit demand.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
