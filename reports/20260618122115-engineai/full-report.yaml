  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and certification exposure
        blocks:
          - type: paragraph
            body: >-
              EngineAI's highest-conviction risk cluster sits at the intersection of safety, compliance, and
              capital-markets readiness. The company is already talking about mass delivery, industrial use cases, and a
              Hong Kong IPO, but the public record still shows more aspiration than disclosed compliance infrastructure.
              Official and independent product sources describe manufacturing throughput, pricing, and deployment
              scenarios, yet no reviewed source surfaced a public CE, UL, or equivalent third-party safety pack for
              T800. That matters because humanoids are meant to operate near people, customers, and factory processes,
              so certification and incident-management readiness are not paperwork details; they are commercialization
              gates. The regulatory diligence path is also imperfect. SEC EDGAR shows no EngineAI filing path, HKEX
              rules describe the listing framework but not EngineAI's filing status, and GSXT access was constrained
              during this run. As a result, regulatory risk is not that a specific violation has already been proven; it
              is that the public evidence needed to underwrite compliance, listing readiness, and liability containment
              remains incomplete while commercialization claims accelerate.
