      - number: '8.3'
        title: Thesis, anti-thesis, and recommendation
        blocks:
          - type: paragraph
            body: >-
              The bull thesis is coherent: EngineAI has moved quickly from founding to unicorn status, it now has a
              strategic manufacturer on the cap table, and the broader humanoid category still benefits from large
              top-down market forecasts and significant policy tailwinds in China. Luxshare matters especially because
              it reduces the gap between an impressive demo company and a potentially scalable hardware company. The
              anti-thesis is equally clear. Public evidence still does not show disclosed revenue, audited customer
              concentration, verified production-scale deployments, or cap-table detail. Adverse read-across is also
              real: Aparobot’s satisfaction signal suggests category-level disappointment remains high, and peer leaders
              like Unitree and AgiBot are already occupying the stronger scale narrative. Those opposing facts lead to a
              price-sensitive call rather than a company-quality call. EngineAI merits a conditional pass only if
              investors explicitly demand deployment proof, accept medium confidence, and apply a sizable China risk
              premium rather than underwriting the round at face value.
