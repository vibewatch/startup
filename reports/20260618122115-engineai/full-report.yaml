  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and channel shape
        blocks:
          - type: paragraph
            body: >
              Public customer segmentation is broad but still shallow. Across official materials and third-party
              coverage, EngineAI positions the T800 for industrial manufacturing, logistics and warehousing, retail
              guidance, hotel or commercial services, entertainment or tourism activations, and research or educational
              buyers. That is strategically attractive because it gives the company multiple entry wedges, but it also
              means the public record does not yet show a tightly defined ICP with repeatable procurement motion. The
              clearest channel evidence is JD.com: the platform shows up as investor, preorder storefront, and trial
              venue, which makes it both the most tangible commercial surface and the biggest concentration vector.
              Geography is also concentrated. The visible customer record is China-first, centered on Shenzhen and
              prospective Henan expansion, while overseas demand remains mostly interest rather than disclosed
              deployment. For diligence, the most important split is therefore not vertical by itself, but buyer-proofed
              accounts versus unproven scenario claims.
