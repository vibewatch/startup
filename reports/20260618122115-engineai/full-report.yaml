      - number: '2.3'
        title: Market Segmentation and Use-Case Landscape
        blocks:
          - type: paragraph
            body: >
              The humanoid robot market is segmenting along three primary axes: application vertical (industrial vs.
              service vs. consumer), price tier (high-performance vs. commodity), and customer type (enterprise vs. R&D
              vs. SMB).

              **Industrial manufacturing** is the near-term highest-revenue segment, led by automotive assembly,
              electronics manufacturing, and heavy industry. Humanoid robots can perform welding, material handling,
              quality inspection, and assembly of irregular components that are difficult to automate with traditional
              fixed-arm industrial robots. Automotive OEMs (particularly EV makers with highly variable production
              lines) are among the most active pilot customers. The economics are most favorable here: a humanoid robot
              at $25,000 with a 3–5 year lifespan can substitute for labor costing RMB 80,000–150,000/year, implying a
              payback period of 1–3 years if the robot operates 2–3 shifts with minimal downtime.

              **Logistics and e-commerce fulfillment** is the second-largest deployment category, driven by JD.com, SF
              Express, and other e-commerce logistics operators. Pilot deployments include item picking, sorting, and
              last-mile operations. EngineAI benefits directly from JD.com's dual role as investor and logistics pilot
              customer.

              **Retail, hospitality, and public service** is an early-stage but high-visibility segment, including shop
              assistant, hotel concierge, and guided-tour applications. EngineAI's T800 is piloted at JD.com retail
              stores; PM01 is deployed in public transportation and security patrol scenarios.

              **Research and education** is served by EngineAI's open-source SA01 and PM01 platforms, targeting
              universities and algorithm developers. This segment is lower in revenue per unit but builds ecosystem and
              talent pipeline.

              **Consumer household** remains a 2028–2030 horizon market. Prices would need to decline below
              $5,000–10,000 and operational reliability would need to improve substantially before household deployment
              is viable at scale.
            claimRefs:
