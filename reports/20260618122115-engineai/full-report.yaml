            body: >
              EngineAI's fundraising trajectory is among the most compressed in Chinese robotics history. Founded in
              October

              2023, the company closed its Pre-A round of approximately $28 million in 2024, led by Stone Venture with

              participation from SenseTime's Sense Capital and Highlight Capital. This initial capital financed the SE01

              and PM01 development programs and early team scale-up.


              In July 2025, EngineAI closed two rounds in rapid succession totaling approximately RMB 1 billion
              (~$139–140M).

              The Pre-A++ (~$70M) was led by Rocket Capital and XPeng Motors; the A1 (~$70M) was led by JD.com with CATL

              Capital and Tsinghua Holdings Capital as co-investors. The dual-round structure—unusual in speed—reflected

              fierce competition among Chinese institutional investors for stakes in top humanoid robotics companies.


              The Series B in April 2026 raised $200 million, co-led by Luxshare Precision and Huirong Fund (Henan

              Investment Group), with Zhongchuang Zhiling, Cornerstone Capital, and Huangpujiang Capital participating.

              Existing investors JD.com and CATL maintained positions. Total capital reached approximately $368 million,

              pushing post-money valuation above RMB 10 billion (~$1.46 billion), conferring unicorn status ~30 months

              after founding—exceptionally fast even by Chinese tech startup standards.
