      - number: '1.4'
        title: Product Portfolio and Corporate Milestones
        blocks:
          - type: paragraph
            body: >
              EngineAI has launched four humanoid robot platforms and one quadruped platform since its founding:

              **SE01 (2024):** Full-size general-purpose humanoid (170 cm, 55 kg, 32 DoF, 330 Nm peak torque). Notable
              for early demonstrations of ultra-realistic natural gait using reinforcement + imitation learning.

              **PM01 (2024–2025):** Lightweight embodied AI agent (138 cm, ~40 kg, 23–24 DoF). Priced from ~$13,700 and
              offered in commercial and educational editions. In 2025 the PM01 achieved what EngineAI claims is the
              world's first humanoid front flip, generating viral attention. Hundreds of PM01 units were produced in
              2025 (small-batch production phase).

              **SA01 (2025):** Open-source developer-focused platform (~170 cm, ~50 kg, ~32 DoF) priced from ~$5,400,
              targeting research labs and university teams. Full SDK and secondary-development support.

              **JS01 (quadruped, 2025):** Four-legged platform for outdoor inspection and logistics tasks. Positions
              EngineAI in the adjacent quadruped market occupied by Unitree and XPeng.

              **T800 (debuted CES 2026, mass production from May/June 2026):** Full-size industrial-grade humanoid (29
              DoF, 450 Nm peak torque, 14,000 W instantaneous joint power, magnesium-aluminum alloy exoskeleton).
              Available in four editions: Basic ($25,000), Eco ($33,000), Pro ($38,500), Max ($50,000). The T800 is the
              company's flagship product for large-scale delivery in 2026.

              Key milestones include the October 2023 founding; SE01 demonstrations in 2024; PM01 world-first front flip
              and viral marketing campaigns in 2025; T800 global debut at CES 2026 (January 2026); the launch of the
              Shenzhen Honghualing manufacturing base on May 29, 2026; and the confidential Hong Kong IPO filing in June
              2026.
