            body: >
              EngineAI's disclosed portfolio spans multiple humanoid and adjacent form factors rather than a single hero
              SKU. Official manufacturing and CES materials describe a line that includes the full-size T800, the
              lightweight PM01, the earlier SE01 walker, and SA/JS variants used to widen accessibility and scenario
              coverage. Within that mix, the T800 is the flagship industrial humanoid: sources consistently describe it
              as the company's universal heavy-duty platform, while PM01 is positioned as the lighter, higher-mobility
              companion platform for service, patrol, and research-oriented use cases.

              Public specification coverage is directionally strong but not fully harmonized. BotInfo and Aparobot both
              place the current commercial T800 around 173-175 cm and 75 kg, while public summaries and research notes
              diverge on the degree-of-freedom count, runtime, ingress protection, and operating-speed presentation. The
              safest diligence read is that EngineAI clearly markets the T800 as a full-size, high-dynamic industrial
              humanoid with differentiated joint torque and a four-tier commercial package, but investors should treat
              detailed spec-sheet precision as version- and edition-dependent until the company publishes a unified
              canonical data sheet.
