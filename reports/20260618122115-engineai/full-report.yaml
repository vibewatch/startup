      - number: '1.2'
        title: Founding Team and Leadership
        blocks:
          - type: paragraph
            body: >
              EngineAI was founded by Zhao Tongyang (赵同阳), who serves as both CEO and Chairman. Zhao is a serial
              robotics entrepreneur who entered the tech industry around 2012, initially building IoT devices before
              pivoting to bipedal humanoid robots around 2016. He founded Dogotix, a quadruped robotics company that was
              acquired by XPeng Motors. At XPeng (and its robotics spinout Pengxing Intelligent), Zhao led humanoid
              robotics development before departing to found EngineAI, taking much of his core engineering team with
              him. Zhao holds a bachelor's degree in Automation Control from Zhuzhou Normal University (株洲师范高等专科学校). He
              is known for a hands-on leadership style—famously allowing one of EngineAI's robots to kick him on camera
              as a live demonstration of the robot's capabilities and controllability.

              Co-founder Ren Guowen (任国文) oversees manufacturing operations and was named in the PR Newswire
              announcement of the Shenzhen Intelligent Manufacturing Base launch. EngineAI's broader core team is drawn
              from Pengxing Intelligent / XPeng's robotics division and holds advanced degrees from institutions
              including Carnegie Mellon University, MIT, ETH Zurich, Tsinghua University, Peking University, Fudan
              University, Shanghai Jiao Tong University, the Hong Kong University of Science and Technology (HKUST), the
              National University of Singapore, Harbin Institute of Technology, and the University of Tokyo. The company
              emphasizes an R&D-heavy culture with a high proportion of masters and PhD holders. As of the June 2026 IPO
              filing, precise board composition and governance structure are not yet publicly disclosed; this remains a
              material information gap for outside investors.
