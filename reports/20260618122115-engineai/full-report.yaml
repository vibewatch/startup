  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              The humanoid robotics competitive landscape is organized into three tiers: Chinese scale leaders (Unitree,
              AgiBot), Chinese second-tier challengers (EngineAI, UBTech, Leju/Fourier, XPeng Robotics, Booster
              Robotics), and Western players (Tesla Optimus, Figure AI, Agility Robotics, Boston Dynamics). Direct
              substitutes — traditional fixed-arm industrial robots from Fanuc, KUKA, and ABB, plus the "status quo" of
              human labor — remain the dominant alternative in most industrial applications.

              EngineAI's most threatening direct competitors are Unitree and AgiBot, both of which combine higher
              production scale, stronger financial metrics, and comparable or superior AI capabilities with lower price
              points (Unitree R1 at $4,000 vs. EngineAI T800 at $25,000). Unitree's IPO has been cleared for China's
              STAR Market and AgiBot plans a Hong Kong IPO in Q3 2026, raising the competitive bar by giving both market
              leaders access to substantial public capital before EngineAI.

              Adjacent threats include UBTech (HKEX-listed, enterprise-focused Walker series) and Chinese industrial
              robot incumbents expanding into humanoid-adjacent cobots. Western players pose a longer-term threat
              through superior AI model integration (Figure AI's Anthropic partnership, Tesla's full self-driving AI
              stack for Optimus), but are currently commercially irrelevant in China due to geopolitical constraints and
              low volume.
