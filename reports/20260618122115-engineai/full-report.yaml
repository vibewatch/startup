      - number: '3.3'
        title: Capability, Pricing, and Distribution Comparison
        blocks:
          - type: paragraph
            body: >
              EngineAI's T800 is competitively positioned on performance specs: 29 DoF, 450 Nm peak torque, and 14,000 W
              peak power compare favorably to announced competitors' specs. The T800's magnesium-aluminum alloy frame,
              solid-state battery, and Luxshare-quality manufacturing process differentiate it from lower-cost Chinese
              alternatives. However, EngineAI's $25,000–$50,000 price range is significantly higher than Unitree's R1
              ($4,000) and AgiBot's A3 (<$20,000), creating a price-value gap that EngineAI must justify through
              superior reliability, industrial-grade durability, or specific use-case performance advantages.

              On AI capabilities, all three Chinese leaders are investing heavily in reinforcement learning and
              imitation learning for locomotion, but Unitree and AgiBot have had more time and higher volumes to collect
              real-world training data. EngineAI's end-to-end neural network locomotion approach is technically sound
              but has less public validation data than competitors. Figure AI's Anthropic-backed language model
              integration and Tesla Optimus's planned full-stack AI give Western players a potential long-term AI
              quality lead despite their current volume lag.

              Distribution is a key differentiator. Unitree has a broad global distribution network and sells through
              online channels (including to international customers). AgiBot sells direct-to-enterprise through China's
              automotive and electronics manufacturers. EngineAI's JD.com partnership provides access to China's largest
              e-commerce logistics network but is concentrated in one relationship. Luxshare's manufacturing footprint
              could eventually be leveraged for export, but international distribution is underdeveloped.

              On trust and regulatory posture, Unitree is furthest advanced with its STAR Market prospectus providing
              full financial disclosure, followed by UBTech (HKEX-listed). AgiBot and EngineAI are both in the IPO
              process but neither has published a prospectus. All Chinese players face potential import restrictions in
              the US and EU due to geopolitical concerns over Chinese AI-enabled hardware.
