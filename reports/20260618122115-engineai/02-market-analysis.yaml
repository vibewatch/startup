callouts:
  - calloutType: strength
    title: "Structural Tailwinds: Government Policy + Demographics Create Multi-Decade Demand"
    body: >
      China's combination of an aging workforce, rising labor costs, and the world's largest manufacturing base
      creates structural, policy-backed demand for humanoid robots that is qualitatively different from a pure
      technology-cycle trend. State capital, standardization frameworks, and explicit government production targets
      make this a government-supported industrial buildout rather than a venture-capital-driven experiment —
      substantially reducing the risk of sudden capital withdrawal that has historically ended many robotics
      ventures in the US.
    claimRefs: [CM008, CM009, CM010, CM013]

  - calloutType: risk
    title: Buyer Satisfaction at 23% Is the Pivotal Market Risk
    body: >
      An independently reported buyer satisfaction rate of approximately 23% among early humanoid robot purchasers
      is the most important adverse data point in the entire market analysis. If EngineAI's industrial and service
      customers cannot demonstrate economic ROI from T800 deployments, reorder rates will be low regardless of
      production capacity. This risk is not unique to EngineAI — it is sector-wide — but EngineAI, as a newer and
      smaller vendor, has less margin for error than Unitree or AgiBot.
    claimRefs: [CM027, CM028]

  - calloutType: insight
    title: EngineAI's JD.com Partnership Provides the Best Closed-Loop Demand Signal in Its Portfolio
    body: >
      Unlike most humanoid robot startups that rely on speculative industrial customer interest, EngineAI's JD.com
      relationship — where JD.com is simultaneously investor, pilot customer, and distribution channel — provides
      a real feedback loop between robot performance and commercial deployment. If JD.com meaningfully scales
      T800 deployment across its logistics and retail network in 2026, it would be the strongest credible proof of
      commercial viability in EngineAI's IPO narrative.
    claimRefs: [CM017, CM018, CM021]

