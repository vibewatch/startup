- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Why it matters
  - What would change the view
  - Current read
  rows:
  - - Luxshare manufacturing leverage
    - A strategic EMS partner can de-risk scale-up faster than capital alone
    - Signed deployment rollouts or audited yield data would strengthen it
    - Supportive but not yet fully proven
  - - Large long-term category TAM
    - Top-down analyst houses still support a very large humanoid market
    - If adoption curves flatten materially, long-duration upside compresses
    - Positive but too broad to justify price on its own
  - - China policy and capital-markets tailwind
    - Domestic champions can receive financing and listing support sooner than foreign peers
    - A colder IPO window or policy slowdown would weaken liquidity support
    - Helpful but reversible
  - - No disclosed revenue base
    - Without revenue, price rests on milestones and future optionality
    - Audited bookings and revenue would materially improve the base case
    - Current anti-thesis is strong
  - - Weak production-customer proof
    - A unicorn hardware mark without scaled customer proof is fragile
    - Named paid deployments at scale would soften this concern
    - Current anti-thesis is strong
  - - Category satisfaction risk
    - Low buyer satisfaction would slow enterprise conversion even if demos impress
    - Clear task-level ROI and repeat orders would reduce this risk
    - Current anti-thesis is moderate-to-strong
  notes: Each row ties a directional argument to a concrete falsifier so the recommendation can move with evidence rather than with sentiment.
