- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Delivery miss
    - 2026-2027 output tracking far below plan or persistent yield issues
    - Breaks the scale-up portion of the Luxshare thesis
    - Shift to avoid or require full repricing
  - - No named production customers
    - No verified paid deployments beyond pilots after scale claims
    - Turns the valuation into a pure narrative mark
    - Pause further underwriting until proof appears
  - - IPO window shuts
    - HK listing stalls or sponsors withdraw without replacement
    - Removes a major liquidity and re-rating path
    - Increase discount rate and lower valuation tolerance
  - - Preference overhang emerges
    - Material ratchets, liquidation stack, or dilution terms surface
    - Reduces common-equity upside even if operations improve
    - Re-cut returns after cap-table review
  - - Category satisfaction stays weak
    - Customer ROI and retention remain poor across the sector
    - Limits multiple support and slows adoption curves
    - Use the bear case as the default frame
  notes: Triggers are framed as observable events so the recommendation can be updated without rewriting the whole thesis.
  claimRefs:
  - CV024
  - CV025
  - CV028
  - CV042
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue and bookings
    - Audited 2025-2026 revenue, backlog, and bookings bridge
    - Determines whether current price is early or already excessive
    - Request banker deck, audit excerpts, or IPO draft financials
  - - Customer proof
    - Signed contracts, paid deployment counts, and pilot-to-production conversion
    - Separates strategic promise from real commercialization
    - Request named customer schedule and invoices or POs
  - - Luxshare economics
    - Manufacturing agreement scope, deployment rights, and exclusivity terms
    - Clarifies whether Luxshare is just a supplier or also a demand channel
    - Review definitive agreements and board materials
  - - Factory performance
    - Yield, scrap, returns, and uptime by line
    - Tests whether one-unit-per-15-minute cadence is durable
    - Request monthly operating dashboard and site visit
  - - Cap table and preferences
    - Preference stack, ratchets, warrants, and employee pool dilution
    - Changes true common-equity downside and upside
    - Obtain full cap table and term sheets
  - - IPO readiness
    - Sponsor diligence status, audit progress, and filing timetable
    - Defines liquidity path and disclosure cadence
    - Request sponsor memo and listing workplan
  notes: Each diligence ask is tied to a discrete decision blocker; the point is not more information in general, but specific evidence that can move the recommendation.
