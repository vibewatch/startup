company:
  name: EngineAI
chapter:
  number: 8
  title: Valuation & Recommendation
  summary: 'EngineAI enters valuation at an unusual point on the curve: the company has reached a reported post-money value above RMB 10 billion before disclosing meaningful revenue, but it also has a strategically powerful new backer in Luxshare and a fresh IPO path into Hong Kong. That combination makes the round legible as a milestone-and-optionality price rather than a revenue-multiple price. Peer anchors such as Unitree and AgiBot suggest the category can command multi-billion-dollar marks, yet EngineAI still trails them on shipment proof and disclosure depth. The chapter therefore lands on a conditional pass: the story is investable only with tighter price discipline, verified deployment conversion, and a haircut for China-specific execution and liquidity risk.'
sections:
- id: current-valuation-context
  title: Current valuation context and price discipline
  body: 'The current round should be read first as a strategic mark and only second as a traditional financial mark. Public reporting across Pandaily, Humanoids Daily, DealStreetAsia, and Startup Fortune converges on a $200 million Series B in April 2026 at a post-money valuation above RMB 10 billion, or roughly $1.46 billion. That is a meaningful step-up for a company that remains effectively pre-revenue in public disclosures. The valuation therefore cannot be defended with reported revenue, ARR, or EBITDA because none of those figures are disclosed. Instead, investors are paying for the combination of (1) a scarce Chinese humanoid robotics asset, (2) a manufacturing acceleration story tied to Luxshare, (3) optionality around a Hong Kong IPO, and (4) a market narrative that still rewards category leaders before full commercialization. That setup can work, but only if valuation discipline stays anchored to proof sequencing: production readiness, first scaled customer conversion, and then
    broader capital-markets validation.'
