  evidenceGaps:
  - type: missing-source
    severity: material
    topic: cap-table-overhang
    missingEvidence: A full cap table with liquidation preferences, ratchets, option-pool sizing, and any side letters from the 2025-2026 rounds.
    whyItMatters: Common-equity returns can differ materially from enterprise-value outcomes when the preference stack is opaque.
    diligencePath: Request term sheets, the latest cap table, and counsel summary before underwriting follow-on capital.
    relatedQuestionRefs:
    - QV008
  - type: private-evidence-only
    severity: blocking
    topic: luxshare-deployment-economics
    missingEvidence: Signed deployment contracts or manufacturing-rights agreements showing whether Luxshare is also a customer, channel, or exclusive manufacturing partner.
    whyItMatters: The bull thesis pays for Luxshare as a commercialization bridge; if the relationship is purely financial, the current valuation is harder to defend.
    diligencePath: Review definitive agreements, board materials, and any commercial rollout schedule tied to Luxshare facilities.
    relatedQuestionRefs:
    - QV013
  - type: private-evidence-only
    severity: material
    topic: ipo-readiness
    missingEvidence: Sponsor diligence status, audit progress, and a realistic filing-to-listing timetable for the Hong Kong process.
    whyItMatters: A viable IPO path supports liquidity and multiple expansion, while a delayed or weak process would justify a larger discount.
    diligencePath: Request sponsor memo, audit workplan, and management timetable from the company or bankers.
    relatedQuestionRefs:
    - QV026
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table coverage
    missingEvidence: More complete private-round terms and audited public-comparable metrics for humanoid peers outside Unitree and AgiBot.
    whyItMatters: The current comparable set is decision-useful but not exhaustive, so precision around fair value remains limited.
    diligencePath: Extend comparable work once fuller prospectuses or financing decks are available.
    relatedQuestionRefs:
    - QV020
    - QV021
    relatedTableRefs:
    - TV004
