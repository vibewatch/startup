- id: diligence-and-monitoring
  title: Outstanding diligence asks and monitoring plan
  body: 'The remaining work is unusually concrete. Before treating the round as fully investable, diligence needs audited or at least banker-vetted revenue and bookings disclosure, signed deployment documentation for Luxshare or JD-related rollouts, yield and scrap data from the Shenzhen line, and a clean view of liquidation preferences and any ratchets created by the compressed financing cadence. Those asks matter because they separate valuation narrative from valuation evidence. Monitoring after investment should focus on a few hard signals rather than broad market storytelling: monthly delivery cadence, named customer additions, pilot-to-production conversion, IPO process milestones, and any evidence that Luxshare is becoming a captive demand channel instead of only a manufacturing partner. The fastest thesis-break would not be a softer market-size forecast; it would be proof that the flagship deployment story is slipping while the company still carries a unicorn price. That is why the
    recommendation stays conditional and why the decision frame should remain dynamic rather than permanent.'
