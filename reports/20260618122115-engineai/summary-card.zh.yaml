  topStrengths:
    - Luxshare Precision 领投 Series B——直接接上世界级制造规模，也可能带来锁定式客户需求
    - 中国政策顺风——具身智能和人形机器人是国家战略重点，直接和间接补贴都可观
    - 融资速度已验证——不到 3 年融资 $368M，且已秘密递交 HKEX IPO 申请，显示机构信心强
    - 深圳供应链优势——洪花岭工厂面积 12,000 sqm，并能接入深厚零部件供应底座
    - 伙伴生态广——NVIDIA、JD.com、Amazon、Tencent、ByteDance 提供商业化和技术可信度
  topRisks:
    - 中美地缘政治和出口管制风险——BIS 芯片限制可能打断依赖 NVIDIA 的 AI 算力路线图
    - 未产生收入、未商业化——没有已确认商业收入，规模化生产也未验证，烧钱带来实质执行风险
    - 竞争强度高——Unitree 已进入量产规模；AgiBot 以相近估值融资；Figure AI、Agility 等西方玩家推进很快
    - 估值需要纪律——$1.46B 估值下仍无收入，定价必须依赖激进增长假设，还应计入 30-40% 的中国风险溢价折价
    - 安全与监管认证缺口——T800 在工业部署场景下尚无公开 CE/UL/GB 安全认证文件
  unresolvedGaps:
    - 截至 2026 年 6 月，未披露可验证的商业部署台数或活跃经常性客户合同
    - 公开记录中未找到 T800 工业用途的正式安全认证文件（CE、UL 或中国 GB 标准）
    - HKEX IPO 申请处于保密状态，时间表、定价区间和 IPO 前投资者锁定条款未知
