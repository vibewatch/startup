company:
  name: EngineAI
chapter:
  number: 6
  title: "Customers"
  summary: >
    EngineAI has assembled a credible early commercial surface, but public proof still sits much closer to pilot, preorder, and partner-enablement than to repeatable fleet adoption. JD.com is the clearest named commercial anchor because it appears as investor, channel, and trial venue, while Luxshare Precision and Henan Investment Group broaden the pathway to future deployments without yet proving live production revenue. Public retention data is effectively absent, and the strongest adverse read-across is sector-wide: only 23% of prospective industrial buyers in a Morgan Stanley survey reported satisfaction with current humanoid offerings. The chapter therefore treats EngineAI as pre-commercial to early-commercial, with meaningful upside if manufacturing throughput converts into named repeat customers.

sections:
  - id: customer-segmentation
    title: "Customer segmentation and channel shape"
    body: >
      Public customer segmentation is broad but still shallow. Across official materials and third-party coverage, EngineAI positions the T800 for industrial manufacturing, logistics and warehousing, retail guidance, hotel or commercial services, entertainment or tourism activations, and research or educational buyers. That is strategically attractive because it gives the company multiple entry wedges, but it also means the public record does not yet show a tightly defined ICP with repeatable procurement motion. The clearest channel evidence is JD.com: the platform shows up as investor, preorder storefront, and trial venue, which makes it both the most tangible commercial surface and the biggest concentration vector. Geography is also concentrated. The visible customer record is China-first, centered on Shenzhen and prospective Henan expansion, while overseas demand remains mostly interest rather than disclosed deployment. For diligence, the most important split is therefore not vertical by itself, but buyer-proofed accounts versus unproven scenario claims.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU024, CU026]
    tableRefs: [TU001]
    figureRefs: [FU001]

  - id: adoption-proof
    title: "Named proof and adoption trajectory"
    body: >
      The strongest named-customer proof is JD.com, but even there the record points to pilot and channel activity rather than a published production fleet contract. ChinaBiz Insider reports a JD.com retail-store trial in Shenzhen, while BotInfo documents JD.com as the active preorder channel with a deposit-based reservation model. More broadly, management's adoption language is ahead of the disclosed proof set. EngineAI has announced a 12,000-square-meter Honghualing manufacturing base, a one-unit-per-15-minute line target, and preparation for 4,000 to 5,000 deliveries in 2026, plus framework orders exceeding RMB 500 million across three sectors. Those signals matter because they show a company organizing for volume. However, they do not substitute for named outcomes, site counts, or repeat purchases. Public mentions of NVIDIA, Amazon, Tencent, and ByteDance expand the addressable narrative, but they remain ecosystem or scenario evidence until independently corroborated by customer-authored deployment results.
    claimRefs: [CU006, CU008, CU009, CU010, CU011, CU012, CU013, CU014, CU015, CU016, CU017, CU036]
    tableRefs: [TU002, TU003]
    figureRefs: [FU002, FU003]

  - id: retention-durability
    title: "Retention, durability, and satisfaction gaps"
    body: >
      Retention is the weakest part of the public record. No reviewed source disclosed NRR, GRR, churn, contract duration, renewal rate, or repeat-order cadence for EngineAI itself. That means the public evidence can confirm month-zero interest and initial deployments, but not whether accounts stick, expand, or convert pilots into recurring revenue. This gap matters more in humanoid robotics than in software because customer adoption is capital intensive, integration heavy, and still dependent on reliability and safety perception. The adverse signal is sector level rather than EngineAI-specific: recent coverage citing Morgan Stanley says only 23% of prospective industrial buyers were satisfied with currently available humanoid products. That does not directly measure EngineAI, but it does warn that demand conversion may lag manufacturing ambition across the category. Until EngineAI can show reference customers, uptime, task-completion metrics, or repeat purchase evidence, durability should be scored as unproven rather than assumed.
    claimRefs: [CU018, CU019, CU020, CU021, CU032, CU037]
    tableRefs: [TU004]
    figureRefs: [FU004]

  - id: expansion-and-concentration
    title: "Expansion upside versus concentration risk"
    body: >
      Expansion upside exists, but it is tightly linked to a small group of ecosystem anchors. Luxshare Precision can help EngineAI cross the line from prototype manufacturing to higher-yield production and may eventually open factory-floor deployments. Henan Investment Group can support regional procurement, industrial-base buildout, and state-linked scenario expansion. JD.com can keep serving as both sales channel and early reference account. Yet this same trio also reveals concentration risk: the public customer story still depends on a few partner-investor relationships doing multiple jobs at once—funding, distribution, manufacturing, and deployment validation. That is efficient in the short run but fragile if any one pathway stalls. Independent market reports from Bain, MarketsandMarkets, Morgan Stanley, Precedence Research, and Emergen Research all point to large long-term humanoid demand, while the June 2026 arXiv search shows a research frontier that is still moving fast. The implication is that category tailwinds exist, but customer durability will be won account by account, not granted by market size alone. Public references remain thinner than the market narrative.
    claimRefs: [CU022, CU023, CU024, CU025, CU027, CU028, CU029, CU030, CU031, CU033, CU034, CU035, CU038, CU039]
    tableRefs: [TU005]


