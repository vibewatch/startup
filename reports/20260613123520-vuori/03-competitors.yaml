  - id: adjacent-substitute-competitors
    title: Adjacent, Substitute, and Exited Competitors
    body: >
      Rhone occupies the premium men's activewear niche most directly adjacent to Vuori's
      original positioning. Positioned as a high-performance, executive-aesthetic brand with
      a $70–$125+ price range and fabric platforms emphasizing anti-odor and structured
      silhouette (SilverTech, Sculpt), Rhone appeals to active professionals who prioritize
      technical polish over California lifestyle casualness. The DTC etc. scoring model rates
      Rhone at 84/100 vs. Vuori at 85/100—a near-parity signal that neither brand has pulled
      decisively ahead in DTC execution metrics. Rhone does not publish revenue or funding
      figures publicly, limiting the competitive intelligence available. As both brands expand
      into women's apparel and retail footprints, the degree of overlap will increase.

      Gymshark competes on occasions, not positioning. The UK-founded brand—valued at over
      £1 B after General Atlantic's 2020 investment—operates predominantly as a DTC online
      brand in 180+ countries with only four physical stores. Gymshark leads the gym/training
      category entry point at approximately 36% mental market share among 18–34-year-olds,
      ahead of Under Armour (35%), driven almost entirely by social media and community
      building. Its 2024 European revenue was £145.7 M and UK revenue £136.5 M. Gymshark's
      price range ($6–$170, skewing accessible) and pure gym-performance identity mean it
      attracts the younger, more price-sensitive buyer who may "graduate" into Vuori as
      income rises—making Gymshark a feeder market as much as a competitor.

      Athleta (Gap Inc.) is a top-five U.S. women's activewear brand in structural decline.
      Q1 2026 net sales fell 12% year-over-year to $270 M with comparable sales down 11%;
      full-year 2025 revenue was $1.2 B (-10% YoY). Gap management describes 2026 as a
      "rebuild year," with a new CEO (Maggie Gauger) re-architecting assortment around
      fewer, enduring franchise items. Athleta targets the value end of the women's premium
      activewear market where Vuori is marginally present, but the brand's ongoing operational
      weakness reduces its ability to gain or defend share.

      Outdoor Voices, once a spiritual substitute for Vuori's all-day casual consumer,
      effectively exited the competitive landscape after closing all retail stores in March
      2024 amid near-bankruptcy conditions (overspend on customer acquisition, high lease
      costs, excess debt). Consortium Brand Partners acquired the brand's assets in June 2024
      via an assignment for the benefit of creditors; founder Tyler Haney returned as
      co-owner in August 2024 and the brand relaunched online-only. With no retail presence
      and a nascent relaunch, Outdoor Voices poses no near-term competitive threat to Vuori's
      retail footprint and may serve as a cautionary case study for the capital discipline
      required to scale premium lifestyle athleisure.
