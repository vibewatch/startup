callouts:
  - calloutType: risk
    title: Alo Yoga's Momentum Is the Most Credible Near-Term Displacement Threat
    body: >
      Alo Yoga captured 7.2 percentage points of activewear foot traffic share in roughly
      18 months—the fastest category grab in modern specialty retail per Passby data. While
      this came primarily at Lululemon's expense, Alo's luxury-lifestyle positioning is
      converging toward Vuori's comfort-lifestyle segment. If Alo moves decisively into
      comfort-casual fabrications rather than luxury-fashion, its influencer scale (~32,700
      sponsored posts per year) and comparable store footprint (~99 U.S. stores vs. Vuori's
      93) could replicate the Lululemon dynamic on Vuori.
    claimRefs:
      - CP010
      - CP011
      - CP013
      - CP040
  - calloutType: strength
    title: Vuori's Wallet-Share Growth Signals Emerging Loyalty Premium
    body: >
      The rise in Vuori shoppers' wallet-share—from 21.6% to 27.4% of active and
      athleisure spend—combined with a 17% reduction in Nike DTC purchases by overlapping
      buyers suggests that Vuori is beginning to displace, not merely coexist with, existing
      brand relationships. This is the earliest signal of the loyalty premium that
      Lululemon built into a durable moat in its 2010–2020 growth phase.
    claimRefs:
      - CP032
      - CP033
  - calloutType: insight
    title: Chip Wilson Advisory Disclosure Signals Category-Expertise Portability
    body: >
      Lululemon's April 2026 proxy filing disclosed that founder Chip Wilson—who designed
      the original premium-activewear playbook—is advising both Alo Yoga and Vuori. This
      reduces any first-mover knowledge advantage Lululemon held and accelerates the
      competitive sophistication of both challengers. For Vuori, it is a signal of strategic
      endorsement from the category's architect; for the competitive landscape broadly, it
      means Lululemon's institutional DNA is now at work across multiple fronts simultaneously.
    claimRefs:
      - CP008
      - CP013

