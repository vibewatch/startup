  - id: moat-durability-adverse
    title: Switching Costs, Moat Durability, and Adverse Evidence
    body: >
      Switching costs in premium athleisure are low by nature: no subscriptions, no
      platform lock-in, and apparel purchases are episodic. The primary sources of
      pseudo-lock-in are psychological brand loyalty, wardrobe investment (a closet full
      of Vuori garments creates anchoring and repurchase inertia), size-fit familiarity,
      and community participation at retail events. Earnest Analytics data showing Vuori
      shoppers spending 17% less at Nike's DTC channels suggests real, if modest, displacement
      of a competitor's share-of-wallet—evidence that Vuori's loyalty is growing beyond a
      mere occasional purchase. The rising wallet-share metric (27.4%) reinforces this
      trend. However, Morning Consult's finding that 52% of Vuori customers also shop at
      Lululemon and 30% at Nike confirms multi-homing remains the behavioral norm; Vuori
      has not yet achieved the exclusive-loyalty position that would make switching costs
      truly material.

      The most durable competitive moats for Vuori are brand equity in California-lifestyle
      positioning, the proprietary fabric platforms that are not immediately commodity-
      replicable, the growing retail community infrastructure (100+ stores), and the
      sustainability credentials (56% preferred fibers) that resonate with Vuori's target
      demographic. Lululemon's Nulu and Luon fabrics demonstrate that proprietary materials
      can sustain premium pricing for years—but also that quality criticisms, once they
      emerge in media, can accelerate brand erosion quickly. Vuori must maintain fabric
      quality discipline as it scales internationally.

      Adverse evidence warrants direct acknowledgment. Alo Yoga's foot traffic surge from
      1.4% to 8.6% category share in roughly 18 months demonstrates that a well-funded
      challenger with strong influencer reach and rapid store expansion can structurally
      shift category dynamics faster than incumbents can respond. If Alo continues expanding
      and pivots to more Vuori-adjacent lifestyle-comfort positioning—rather than its current
      luxury-fashion angle—it represents a plausible displacement threat. Additionally,
      Chip Wilson's advisory roles with both Alo Yoga and Vuori, disclosed in Lululemon's
      April 2026 proxy filing, signal that category-defining expertise is now being shared
      across multiple challengers simultaneously, compressing any institutional knowledge
      advantage. Vuori's planned IPO (expected late 2026) will bring public market scrutiny
      and growth expectations that may force margin-dilutive investments to satisfy investor
      cadence, a dynamic that Lululemon itself navigated poorly in 2023–2026.
