  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue
      missingEvidence: Audited annual revenue statements for FY2023–FY2025 with channel breakdown (DTC vs. wholesale)
      whyItMatters: Without audited revenue, the $5.5B valuation cannot be underwritten on a revenue multiple, and growth trajectory cannot be independently verified.
      diligencePath: Request audited financial statements from management; alternatively monitor SEC EDGAR CIK 0001672741 for an S-1 or Form S-11 filing.
      relatedQuestionRefs:
        - QI002
        - QI016
        - QI019
        - QI023

    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: Audited gross margin by channel (DTC e-commerce, owned stores, wholesale) and by product category
      whyItMatters: Gross margin drives IPO valuation, competitive benchmarking against Lululemon, and assessment of fabric-cost premium sustainability. The 40–45% estimate lacks source authority.
      diligencePath: CFO-level data room; await S-1 disclosure. Cross-check against Lululemon's disclosed channel gross margins as a public comp.
      relatedQuestionRefs:
        - QI008
        - QI024

    - type: private-evidence-only
      severity: material
      topic: store-economics
      missingEvidence: Four-wall EBITDA, average revenue per store, and payback period for Vuori's 100+ retail locations
      whyItMatters: Retail expansion is a major capital commitment; without store-level economics, the ROI of the 100-store program and international expansion is unquantifiable.
      diligencePath: Request store P&L data in management presentation; benchmark against Lululemon's disclosed store productivity metrics.
      relatedQuestionRefs:
        - QI012
      relatedTableRefs:
        - TI003

    - type: private-evidence-only
      severity: material
      topic: ltv-cac
      missingEvidence: Actual CAC by channel and year, customer payback period, cohort-level LTV data
      whyItMatters: The 4:1 LTV:CAC claim is unverified; if actual ratio is lower, DTC economics are less compelling and marketing spend would need to be higher to sustain growth.
      diligencePath: Request marketing attribution data from CMO; segmented LTV by acquisition cohort from finance team.
      relatedQuestionRefs:
        - QI009
        - QI025

    - type: private-evidence-only
      severity: material
      topic: cash-flow
      missingEvidence: Operating cash flow statement, capex schedule (store build-outs), and balance sheet including debt, leases, and working capital
      whyItMatters: Without cash flow data, the claim that Vuori is "self-funding" cannot be confirmed; significant lease obligations or revolving credit could contradict the balance-sheet-strength narrative.
      diligencePath: Request full financial statements and lease schedule. Specifically ask about any revolving credit facility or inventory financing lines.
      relatedQuestionRefs:
        - QI021

    - type: missing-source
      severity: material
      topic: tariff-risk
      missingEvidence: Vuori's sourcing country breakdown (% from China, Vietnam, USA) and existing tariff mitigation plans
      whyItMatters: Without knowing the exact sourcing geography, the financial impact of 2026 tariff changes on COGS cannot be quantified.
      diligencePath: Request sourcing breakdown from supply chain team; review import duty schedules for apparel from Vietnam and China under current and proposed tariff regimes.
      relatedQuestionRefs:
        - QI018
        - QI011

    - type: missing-source
      severity: minor
      topic: quality-complaints
      missingEvidence: Volume and trend data on product return rates, warranty claims, and customer service ticket resolution rates
      whyItMatters: Systemic quality issues would be reflected in elevated return rates and customer service costs, potentially compressing realized gross margins below list-price estimates.
      diligencePath: Request return rate by product category from operations; review Trustpilot and BBB complaint trends longitudinally.
      relatedQuestionRefs:
        - QI015
        - QI027

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >
      Tables TI001, TI002, TI003, TI004, TI005, and TI006 already include explicit notes documenting estimation methodology, data sources, confidence levels, and what null values mean. The tableNotes dimension is satisfied via populated notes fields on all tables; this ack is a safety opt-out in case any pure-factual-snapshot table still triggers the warning despite adequate notes coverage.
  - dimension: figureType
    reason: >
      Two planned figure types (flow and range) from the chapter brief are implemented as FI001, FI002, FI003, and FI004. The waterfall and matrix types were substituted: waterfall evidence does not fit Vuori's undisclosed financials (no sequential financial build is source-backed), and matrix coverage is served by TI003 and TI004 tables which provide more clarity than a figure for undisclosed metrics. The figureType warning is acknowledged for the waterfall and matrix substitutions, which are intentional given data constraints.
