  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑与建议
        blocks:
          - type: paragraph
            body: >-
              Vuori 是消费领域少见的组合：一家快速增长、盈利的 DTC 运动服品牌，产品身份可防守，社区忠诚，并正在从 Lululemon
              手中夺取份额。投资逻辑建立在三根结构性支柱上。第一，可服务市场大且继续扩张——全球休闲运动细分市场 2026 年价值 $402.74B，预计到 2034 年年复合增长
              9.7%，跑道远超任何单一竞争对手。第二，份额获取已经被证明：2023 年 Vuori 收入增长 44%，截至 2024 年 10 月年初至今增长 23%，同期运动服饰市场扩张 4.3%；GlobalData
              显示，2018 至 2024 年，Lululemon 到 Vuori 的交叉购物率从 1.2% 升至 7.8%。第三，2017 年以来 EBITDA 和净利润口径均持续盈利——在大多数品牌多年亏损的 DTC
              品类中，这几乎独一无二。

              反向逻辑同样清楚。Vuori 2024 年 11 月 $5.5B 二级估值，按 $600–700M 估算收入计算，隐含约 8–9x EV/revenue；即便 $1B 分析师估算正确，也约为
              5.5x——远高于可比上市品牌。On Holding（ONON）本身也是高增长高端运动品牌，EV/revenue 为 3.0x；Lululemon 曾是行业估值标杆，如今因增长放缓跌至
              1.28x。为一家没有经审计披露的私人公司支付 5.5–9x，需要强烈相信其能继续超高速增长并扩张毛利，而公开证据无法单独验证这一点。此外，2026 年 Trustpilot
              客户评论暴露出重大质量担忧，包括面料采购变化、化学气味和糟糕的国际客户服务——这些是品牌稀释风险的早期信号，常常先于倍数压缩出现。

              综合来看，建议是 TRACK。Vuori 基本面优秀，品牌轨迹强劲，但相对公开定价的同业，估值已经拉长；缺少 S-1 也意味着投资者拿不到支撑买入建议所需的财务证据。
