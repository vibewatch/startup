  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律和监管风险
        blocks:
          - type: paragraph
            body: >-
              2026 年，Vuori 面临不断扩大且多元化的法律风险堆叠。财务影响最大的监管威胁来自 USTR 2026 年 6 月 2 日的认定：越南和中国——Vuori
              服装的两个主要制造基地——未能执行对强迫劳动产品的禁令。USTR 提议对来自这两个经济体的所有进口商品额外征收 12.5% Section 301 关税；公众意见征集将于 2026 年 7 月 6
              日结束，最终实施日期尚未公布。关键在于，这些新关税将叠加现有 Section 122 关税（10%）；若计入基础 MFN HTS 税率，越南服装进入美国的有效进口关税可能达到 22–32%，中国服装则可能达到
              47–57%。Lululemon 另行量化了该行业的关税敞口，预计 2026 年逆风为 $380 million——这是这些政策在规模化后如何稀释利润率的参照基准。

              诉讼方面，Vuori 于 2026 年 1 月对假冒域名运营方（vuoriactivewear.com、vuoriclothingstore.com 及相关 URL）发起商标侵权诉讼；被告未作回应后，公司于
              2026 年 6 月 10 日获得缺席判决。执法方向正确，但社交商务渠道（TikTok、Instagram、广告网络）上持续存在品牌冒充，形成需要连续投入的长期对抗面。另一个风险来自隐私法律顾问 Louis
              Law Group：其 2026 年 3 月启动集体诉讼调查，关注 Vuori 据称在电商网站上使用跟踪像素、会话回放工具和浏览器指纹识别，却未取得消费者明确同意。2026 年 3 月 27 日，联邦法院在
              Allison v. PHH Mortgage 案中将 CCPA 私人诉权扩大至覆盖这类未经授权披露，而不仅是传统数据泄露，实质性拓宽了 Vuori 的诉讼敞口。ADA 网站可访问性诉讼（Petersen v.
              Vuori，2024 年 11 月，佛罗里达）和延期的工资工时集体诉讼（Buchanan v. Vuori）共同构成当前法律日程。
