          - type: callout
            title: 中国和越南采购带来关税与供应链敞口
            body: >
              Vuori 主要通过越南、中国和美国的合作工厂采购服装。美国对中国服装进口关税升级，以及 2026 年越南采购潜在关税修订，制造了有意义的 COGS 上行风险。若关键采购国关税上调
              10–25%，在当前产品定价下，毛利率可能被压缩数个百分点；公司要么提价（需求风险），要么推进供应链多元化（执行和交期风险）。Vuori 的 Vendor Code of Conduct
