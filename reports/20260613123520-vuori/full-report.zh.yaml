      - number: '7.6'
        title: 缓释措施、监测指标与 thesis-break 触发器
        blocks:
          - type: paragraph
            body: >-
              Vuori 的总体风险可控，但需要围绕四条主轴主动监测：关税 / 采购、品牌 / 质量、竞争 / 财务、法律 / 合规。最迫近的二元事件是 USTR Section 301 最终规则——预计在 2026 年 7
              月 7 日听证后公布——它将决定新的 12.5% 关税层是否适用于越南和中国服装进口。有利结果（最终规则排除服装，或纺织机制降低实际税率）将移除 Vuori 近期最尖锐的毛利逆风。不利结果则会迫使 Vuori
              加速向 CAFTA-DR 国家（中美洲）分散采购、提高零售价，或吸收毛利稀释。

              Vuori 投资 thesis 的击穿标准集中在五类可衡量事件：（1）按 Particl 交易数据，Vuori 年度线上销售量连续两个或更多季度同比下降，说明需求减速超出季节性；（2）CEO Joe Kudla
              在 IPO 完成前宣布离任；（3）任何季度 Vuori 被迫在正常季节窗口外进行重大促销折扣，表明正价售罄能力被侵蚀；（4）CBP 对 Vuori 供应链采取任何已确认的转运执法行动；（5）与 S-1
              申报相关的正式 SEC stop-order 或调查。私人公司披露缺口本身就是复合风险：没有经审计财务，上述任何事件都会比上市公司更晚浮现、预警更少。
