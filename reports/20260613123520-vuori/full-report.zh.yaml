      - number: '8.2'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              Vuori 两次主要融资都采取二级要约结构，为现有投资者提供流动性，而不是向公司注入一级股权资金。2021 年，SoftBank Vision Fund 2 领投 $400M，投后估值
              $4B——当时是全球私人服装品牌最大一轮投资。2024 年 11 月，General Atlantic 和 Stripes 共同领投 $825M 二级要约，估值 $5.5B，三年上调
              37.5%。除新投资者外，SoftBank、Norwest 和 ABP Capital 仍是重要投资者。

              Norwest 管理合伙人 Jon Kossow 是 Vuori 董事会成员，自 2019 年 $45M Series A 起观察公司。他明确表示 Vuori
              是「self-sustaining」，且「doesn't need funds for operating cash or investment」。2024
              年融资旨在为机构资本进入前支持品牌的天使投资人和早期高净值投资者提供流动性。管理约 $97B AUM 的 General Atlantic 指派董事总经理 Andrew Ferrer 加入 Vuori
              董事会。Stripes 是一家 $6.2B AUM 的成长股权公司，曾投资 On Running 和 Erewhon；它在资本承诺之外提供品牌建设合作。

              这种结构制造了一个具体分析问题。Vuori 融资是为了奖励现有持有人，而非给增长供血，因此它从未有动力按标准尽调水平向新资金提供方披露财务。$5.5B
              二级市场价格因此基于投资者对品牌轨迹的信念和可比公司分析，而非经确认的财务模型。二级要约中的优先权和清算顺位、股权结构表细节，以及任何 ratchet
              条款均未公开；没有进一步尽调，就无法计算下行情景下的预期回报。
