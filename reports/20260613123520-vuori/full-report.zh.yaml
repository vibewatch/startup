              用稳定的加州海岸设计和高端品质占住这一空白，形成了大公司难以复制的品牌护城河。 40 岁以下男性的服装支出增速比历史队列水平高 34%，47% 的男性买家寻找多用途运动服饰——与 Vuori 核心供给直接对齐。
