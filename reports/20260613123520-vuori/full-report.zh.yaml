      - number: '3.3'
        title: 相邻、替代与退出竞争者
        blocks:
          - type: paragraph
            body: >
              Rhone 占据的男性高端运动服饰利基，最贴近 Vuori 的原始定位。Rhone 定位为高性能、行政审美品牌，价格区间 $70–$125+，
              面料平台强调抗异味和结构化廓形（SilverTech、Sculpt），吸引重视技术质感而非加州生活方式随意感的活跃专业人士。DTC etc. 评分模型给 Rhone 84/100、Vuori
              85/100，近乎持平，说明两者在 DTC 执行指标上都没有决定性领先。Rhone 不公开收入或融资数字， 限制了可获得的竞争情报。随着两家公司都扩展到女装和零售版图，重叠度会提高。

              Gymshark 竞争的是使用场景，不是定位。这家英国创立的品牌在 General Atlantic 2020 年投资后估值超过 £1 B， 主要作为 DTC 线上品牌运营，覆盖 180+
              个国家，实体店只有四家。Gymshark 在 18–34 岁人群中以约 36% 心智市场份额领先健身 / 训练品类入口， 高于 Under Armour（35%），驱动力几乎完全来自社交媒体和社区建设。其
              2024 年欧洲收入为 £145.7 M、英国收入为 £136.5 M。 Gymshark 价格区间为 $6–$170，整体偏入门，其纯健身性能身份吸引更年轻、更价格敏感的买家；这些买家收入提高后可能「升级」到
              Vuori， 因此 Gymshark 既是竞争者，也是导流市场。

              Athleta（Gap Inc.）是美国前五大女性运动服饰品牌，但处于结构性下滑。2026 年 Q1 净销售额同比下降 12% 至 $270 M， 可比销售下降 11%；2025 全年收入为 $1.2 B（同比
              -10%）。Gap 管理层称 2026 年是「重建年」，新 CEO Maggie Gauger 正围绕更少、更持久的特许单品重构品类。Athleta 瞄准女性高端运动服饰市场的价值端，Vuori
              在这一端存在感较弱； 但 Athleta 持续运营疲弱，削弱了其抢份额或守份额的能力。

              Outdoor Voices 曾是 Vuori 全天候休闲消费者的精神替代品，但 2024 年 3 月在近破产状态下关闭所有零售门店后，实际退出竞争版图
              （获客过度支出、高租金成本、债务过多）。Consortium Brand Partners 通过债权人利益转让在 2024 年 6 月收购其资产； 创始人 Tyler Haney 2024 年 8
              月作为共同所有人回归，品牌以线上-only 方式重启。没有零售存在、重启仍处早期，Outdoor Voices 对 Vuori
              零售版图近期不构成竞争威胁，反而可能成为高端生活方式运动休闲规模化所需资本纪律的警示案例。
