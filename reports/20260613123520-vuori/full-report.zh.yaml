  - id: TV006
    title: 最终尽调要求
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入和财务报表
        - FY2024 与 FY2025 经审计收入、毛利、EBITDA 和净利润
        - 目前估计为 $600M–$1B；4x 区间使有效倍数计算无法成立；可证实或证伪 8–9x 隐含倍数
        - 直接向公司索取；IPO 时 S-1 文件；Norwest 或 General Atlantic 老股数据室访问
      - - 分渠道毛利率
        - FY2024–2025 DTC 线上、零售和批发毛利率拆分
        - 验证高端品牌经济性，对照商品化混纺风险；若质量投诉也反映在利润率组合中，该数据会发出信号
        - S-1 分部报告；公司管理层演示
      - - 客户留存指标
        - 净推荐值、复购率，以及按年份队列拆分的留存
        - CNBC 与 Trustpilot 指向质量担忧；客户留存数据可证实或证伪品牌稀释逻辑
        - 公司数据室；来自 Particl、Earnest 或 GlobalData 的二级情报
      - - 国际单店经济性
        - London 和 Shanghai 门店的单店贡献利润率；Japan 和 Europe 批发利润率
        - 国际扩张支撑 IPO 溢价；早期门店必须盈利，才能支持 2026 年达到 15 家门店的逻辑
        - 公司管理层演示；与欧洲和亚洲零售伙伴做渠道访谈
      - - 股权结构表和优先权瀑布
        - 完整股权结构表，包括 SAFE 票据、期权池，以及 2021 和 2024 年老股要约轮的清算优先权条款
        - 老股要约结构可能包含反稀释或棘轮条款，侵蚀普通股价值；这对 IPO 回报建模至关重要
        - 直接向公司索取；法律审查要约收购文件；承销商推介材料
    notes: 所有要求都代表阻碍买入建议的关键或重大证据缺口。S-1 文件将补上前三项；其余尽调可能需要直接访问公司。
