figures:
  - id: FO001
    title: Vuori 里程碑时间线
    type: timeline
    layout: wide
    summary: 按时间顺序呈现 Vuori 从 2015 年到 2026 年 4 月在创立、产品、规模、融资和治理上的关键里程碑。
    data:
      items:
        - label: Vuori 创立
          date: '2015-01-01'
          detail: Joe Kudla 在加州 Encinitas 创办 Vuori，聚焦男士 DTC 运动服饰，并开设快闪店；从亲友处募集约 $2.6M
          tone: positive
        - label: 首家永久门店
          date: '2016-04-01'
          detail: 首家自营零售店在加州 Encinitas 开业；与 REI 建立批发合作
          tone: positive
        - label: 实现盈利
          date: '2017-01-01'
          detail: Vuori 在创立两年后、引入任何机构资本前实现盈利
          tone: positive
        - label: 女装线推出
          date: '2018-01-01'
          detail: Vuori 从只做男装扩展到女式运动服饰；年销售额达到约 $30M，YoY 增长 180%
          tone: positive
        - label: Norwest 投资 $45M
          date: '2019-08-15'
          detail: Norwest Venture Partners 投入 $45M 少数股权成长资本；Jon Kossow 加入董事会
          tone: positive
        - label: SoftBank 以 $4B 估值投资 $400M
          date: '2021-10-13'
          detail: SoftBank Vision Fund 2 投资 $400M；Vuori 估值 $4B；Nagraj Kashyap 加入董事会
          tone: positive
