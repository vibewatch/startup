      - number: '2.3'
        title: 买家与用户分层
        blocks:
          - type: paragraph
            body: >-
              高端运动服饰买家偏向高收入、重视健康的城市成年人，年龄集中在 25–45 岁。按消费者数量和总支出计，女性历史上约占美国运动服饰市场 52–53%
              的份额，原因是瑜伽、普拉提和多功能生活方式穿搭带来更高品类参与度。不过，至少一家大型研究机构估计，按终端用户价值计， 男性运动服饰约占全球运动服饰市场 72.7%——这个矛盾反映了方法边界不同（销量 / 收入组合
              vs. 买家数量）。冲突说明，男女份额常被放在不同定义宇宙里衡量。 千禧一代消费者（2026 年约 27–42 岁）约占运动休闲支出的 38%，Gen Z（约 12–26 岁）约占
              25%；两个队列都把可持续性和品牌真实性抬高为购买标准。 Vuori 的差异化洞察，是它特别吸引男性生活方式性能买家；这一细分过去长期被 Lululemon 等女性主导品牌服务不足。Vuori
              顾客忠诚且钱包集中： 他们在 Vuori 的运动 / 运动休闲钱包份额同比从 21.6% 提高到 27.4%。从付款方看，购买几乎全部来自消费者自费的可选支出，
              只有很小的企业礼品细分；不存在第三方付款模式（不同于 B2B SaaS 或医疗）。预算所有权完全在消费者手里，因此品牌好感、产品质量和全渠道体验是主要采用触发点。 交叉购物显著：52% 的 Vuori 顾客也购买
              Lululemon，使其成为 Vuori 客群中重叠度最高的竞争者。
