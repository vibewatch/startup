      - number: '2.4'
        title: 增长驱动与约束
        blocks:
          - type: paragraph
            body: >-
              高端运动休闲最强的结构性增长驱动，是混合和远程办公永久常态化；性能服饰的使用场景已经不可逆地从健身房扩展到通勤、类办公和社交场景。 行业调查显示，68% 的全球消费者希望服装同时适用于健身和日常穿着。千禧一代和
              Gen Z 的健康与保健意识支撑需求增长，且不完全依赖经济周期； 健身房会员和户外活动参与度增加，会直接转化为运动服饰购买。可持续性已是消费者基础预期：62% 的美国消费者优先考虑可持续材料， 65%
              表示愿为认证可持续产品支付 10% 溢价。DTC 和品牌自有电商渠道以高于市场的速度增长——Mordor Intelligence 估计运动服饰线上零售 CAGR 为
              8.46%——让高端品牌能够获取完整毛利，同时沉淀第一方消费者数据。约束侧，美国服装进口关税在 2025–2026 年显著提高， 某些品类平均税率翻倍，推高从 Vietnam、China 和 Bangladesh
              采购品牌的到岸成本。供应链向近岸采购多元化会在新供应商爬坡时制造瓶颈和质量波动。 基础品类（紧身裤、运动内衣）的市场饱和是实质风险，进入门槛下降，自有品牌竞争者扩散。竞争强度很高：Alo Yoga 在约 18
              个月内从 10 家店扩至 100+ 家，并拿下高端品类客流份额 8.6%（从 1.4% 上升）；即便是主导者 Lululemon，也宣布裁减 150 名公司员工，并以消费者支出模式变化为由下调利润预测。
              如果宏观经济恶化，可选消费品类的消费弹性会成为潜在风险。
