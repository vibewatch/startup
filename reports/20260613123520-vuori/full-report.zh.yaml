      - number: '4.6'
        title: 图表与证据
        blocks:
          - type: callout
            title: 自 2017 年起盈利——DTC 品牌中罕见
            body: >
              Vuori 自 2017 年起 EBITDA 和净利润均为正——距离创立仅两年，且直到 2019 年才获得机构资本。Norwest 管理合伙人 Jon Kossow 公开确认了这一点，Vuori CEO Joe
              Kudla 对 Retail Dive 和 CNBC 的说法也相互印证。Vuori 在机构投资者进入前就实现盈利，并在扩至 100
              家门店、推进国际建设期间维持盈利，这让它明显有别于那些在接近盈亏平衡前消耗数亿美元资本的 DTC 同行。
            calloutType: strength
            claimRefs:
              - CI020
              - CI021
              - CI022
          - type: callout
            title: 老股要约收购 ≠ 资产负债表增强
            body: >
              2024 年 11 月的 $825M 融资轮采用老股要约收购结构，意味着资金流向出售股份的早期投资者，而不是 Vuori 的运营资产负债表。投资者和媒体报道将其正面解读为公司不需要资本的证明；但承销方不应假设
              Vuori 账上新增了 $825M 现金。公司的实际现金状况、运营杠杆和流动性均未确认。未来任何新股融资，都会在 $5.5B 估值锚点上稀释现有利益相关方。
            calloutType: risk
            claimRefs:
              - CI025
              - CI026
              - CI029
          - type: callout
            title: 无经审计财务数据——IPO 是披露闸门
            body: >
              截至 2026 年 6 月，Vuori 尚未公布经审计收入、毛利率、运营利润率或现金流。本章引用的所有财务数字都来自分析师估计、第三方交易追踪机构或投资者方向性表述。若 S-1
              招股说明书提交并公开，将是市场参与者首次基于定量基本面承销这家公司。在此之前，$5.5B 估值完全建立在品牌动能、已确认盈利方向和增长代理指标之上，而非经审计账目。
            calloutType: risk
            claimRefs:
