            - 中 — 无续约 / 订单规模数据
            - 低 — 未披露收入
            - 中 — 仅有 CEO 说法
        - label: Reviews.io（14,853 条已验证）
          values:
            - 高 — 汇总已验证购买评价
            - 中 — 评价时间分散，无队列数据
            - 高 — 4.6/5，含配送和服务分项评分
            - 高 — 独立第三方平台
        - label: Trustpilot（反向，2.2/5）
          values:
            - 高 — 评价覆盖多个有日期的时期
            - 低 — 反向信号；可见流失 / 投诉
            - 高 — 记录了具体失败模式
            - 高 — 独立平台，样本偏反向
        - label: V1 社区（12,000+）
          values:
            - 高 — 官方项目页面，媒体确认
            - 中 — 未披露项目留存率
            - 低 — 未量化销售影响
            - 中 — 公司自营项目
        - label: Earnest 钱包份额（27.4%）
          values:
            - 高 — 信用卡交易面板
            - 高 — 已确认同比份额增长
            - 高 — 量化了从 Nike 转向 Vuori 的钱包份额
            - 高 — 独立信用卡分析
    approximationNotes: 证据独立性评级评估的是来源独立性，不是商业关系质量。结果具体度为「低」反映的是缺少收入披露，并不代表商业表现差。
    claimRefs:
      - CU017
      - CU026
      - CU027
      - CU030
      - CU031
  - id: FU004
    title: 渠道收入结构与留存信号条形图
    type: bar
    layout: standard
    summary: 估算 Vuori 各渠道收入拆分，并列展示关键满意度和忠诚度指标，用来理解 DTC 与批发的平衡。
    data:
      items:
        - label: DTC 线上
          value: 326.6
          unit: USD millions (2025 online DTC, Grips Intelligence)
        - label: DTC 自营门店
          value: 235
          unit: USD millions (estimated; ~75% DTC total minus $326.6M online = ~$235M)
        - label: 批发
          value: 250
          unit: USD millions (estimated; ~25% of ~$1B total revenue)
        - label: Vuori 钱包份额
          value: 27.4
          unit: '% of active-and-athleisure spend (Apr 2024, Earnest Analytics)'
        - label: Reviews.io 评分
          value: 4.6
          unit: out of 5 (14,853 reviews)
        - label: Trustpilot 评分（反向）
          value: 2.2
          unit: out of 5 (Wayback, Q1 2026)
    approximationNotes: >-
      Vuori 未公开披露渠道级财务数据，因此 DTC 自营门店和批发条形值缺失。钱包份额和评价评分在概念上使用右轴；该图旨在说明 DTC
      线上占主导，以及策展式（Reviews.io）与开放式（Trustpilot）评价信号之间的分化。
    claimRefs:
      - CU010
      - CU026
      - CU027
      - CU030
  - id: FR001
    title: Vuori 风险热力图 — 发生可能性 vs. 影响
    type: matrix
    layout: wide
    summary: 定性风险热力图把 Vuori 已识别的主要风险放在两条轴上：发生可能性（高 / 中 / 低）和影响（低 / 中 / 高），用于确定关注和缓释投入优先级。
    data:
      columns:
        - Impact: Low
        - Impact: Medium
        - Impact: High
      rows:
        - label: 高可能性
          values:
            - Section 122 关税 2026 年 7 月到期（净正面）
            - 越南工厂产能受限；CSDDD ESG 合规缺口
            - USTR Section 301 关税上调（拟议 12.5%）
        - label: 中等可能性
          values:
            - 工资 / 工时索赔；ADA 无障碍诉讼
            - CCPA / 隐私集体诉讼；规模化后品牌质量稀释
            - 高端运动休闲市场饱和；零售执行失败
        - label: 低可能性
          values:
            - 仿冒 / 品牌冒充（已受控）
            - 供应链 ESG 审计失败；CBP 转运执法
            - CEO 关键人物离任；IPO 估值低于 $3B
    approximationNotes: 所有发生可能性和影响评级均为作者基于截至 2026 年 6 月公开证据作出的定性评估，未分配量化概率权重。
    claimRefs:
      - CR001
      - CR003
      - CR006
      - CR012
      - CR022
      - CR029
      - CR036
  - id: FR002
    title: 风险传导图 — 头部风险如何影响投资逻辑
    type: dag
    layout: wide
    summary: 有向无环图展示 Vuori 主要运营和监管风险如何传导到收入、利润率、估值和战略结果。
    data:
      nodes:
        - id: tariff-escalation
          label: 关税上调（Section 301）
          description: 拟对越南 / 中国服装加征 12.5% 额外关税；叠加既有 Section 122
        - id: cogs-increase
          label: COGS 上升
          description: 关税叠加和越南工厂价格溢价推高单件到岸成本
        - id: margin-compression
          label: 毛利率压缩
          description: 关税推高 COGS，而全价零售架构调价空间受限
        - id: revenue-deceleration
          label: 收入增长放缓
          description: 2024 年 Q4 见顶后销量走软；2026 年初节后正常化
        - id: ipo-valuation-risk
          label: IPO 估值风险
          description: 若 S-1 提交前增长放缓或利润率压缩，溢价倍数会被侵蚀
        - id: brand-quality-risk
          label: 品牌 / 产品质量风险
          description: 消费者担心规模化会牺牲面料和版型质量（NBC News，2024）
        - id: customer-churn
          label: 客户流失 / 份额损失
          description: 钱包份额转向 Alo Yoga、Fabletics，或回流 Lululemon
        - id: ceo-departure
          label: CEO / 关键人物离任
          description: Joe Kudla 离任会冲击品牌叙事和投资者信心
        - id: competitive-share-loss
          label: 竞争份额损失
          description: 运动休闲市场碎片化；Alo、Fabletics 同时抢占份额
      edges:
        - from: tariff-escalation
          to: cogs-increase
          label: 推高单件 COGS
        - from: cogs-increase
          to: margin-compression
          label: 压缩毛利率
        - from: margin-compression
          to: ipo-valuation-risk
          label: 降低 IPO 盈利倍数
        - from: revenue-deceleration
          to: ipo-valuation-risk
          label: 降低 IPO 收入倍数
        - from: brand-quality-risk
          to: customer-churn
          label: 推动切换行为
        - from: customer-churn
          to: revenue-deceleration
          label: 拉低收入增速
        - from: ceo-departure
          to: brand-quality-risk
          label: 扰动品牌身份和采购愿景
        - from: competitive-share-loss
          to: revenue-deceleration
          label: 限制钱包份额增长
        - from: margin-compression
          to: revenue-deceleration
          label: 迫使提价并压低销量
    claimRefs:
      - CR006
      - CR019
      - CR020
      - CR022
      - CR025
      - CR029
      - CR036
  - id: FR003
    title: 依赖图 — 关键供应、分销和资本依赖
    type: dag
    layout: wide
    summary: 有向图展示 Vuori 在制造、材料、分销、数字获客、资本和监管监督上的关键外部依赖。
    data:
      nodes:
        - id: vuori
          label: Vuori
          description: 运营主体：设计、品牌、DTC / 批发渠道、零售门店
        - id: vietnam-factories
          label: 越南成衣工厂
          description: 主要制造基地；2026 年产能约束加剧
        - id: china-factories
          label: 中国成衣工厂
          description: 次要制造基地；截至 2026 年 6 月有效关税为 35–45%
        - id: fabric-suppliers
          label: 自研面料供应商
          description: DreamKnit™、BlissBlend™ 混纺；约占面料支出 56%；身份未披露
        - id: wholesale-partners
          label: REI / Nordstrom / 批发（约 1,800 家门店）
          description: 估计收入的 30–35%；品牌放大渠道
        - id: digital-platforms
          label: Meta / Google 广告平台
          description: 主要数字 DTC 获客渠道；未披露具体投放分配
        - id: softbank
          label: SoftBank Vision Fund 2
          description: 2021 年起投资 $400M；通过 Nagraj Kashyap 获得董事会席位
        - id: general-atlantic
          label: General Atlantic 与 Stripes
          description: 2024 年 $825M 老股交易领投方；Andrew Ferrer 入董事会
        - id: cbp-ustr
          label: 美国 CBP / USTR
          description: 监管监督：转运执法和关税裁定
      edges:
        - from: fabric-suppliers
          to: vietnam-factories
          label: 供应自研材料
        - from: fabric-suppliers
          to: china-factories
          label: 供应自研材料
        - from: vietnam-factories
          to: vuori
          label: 主要成衣制造
        - from: china-factories
          to: vuori
          label: 次要成衣制造
        - from: wholesale-partners
          to: vuori
          label: 30–35% 收入分销
        - from: digital-platforms
          to: vuori
          label: DTC 获客
        - from: softbank
          to: vuori
          label: 资本与治理
        - from: general-atlantic
          to: vuori
          label: 资本与治理
        - from: cbp-ustr
          to: vuori
          label: 关税与合规执法
    claimRefs:
      - CR010
      - CR015
      - CR026
      - CR030
  - id: FV001
    title: 建议逻辑链
    type: flow
    layout: standard
    summary: 从市场、产品、财务、估值和风险证据，推导至「观察」建议的证据链。
    data:
      nodes:
        - id: n_market
          label: 大 TAM：$402B 运动休闲，9.7% CAGR（2026–2034）
        - id: n_product
          label: 差异化产品与品牌（2017 年以来盈利）
        - id: n_share
          label: 市场份额提升：同比 23–44% vs 市场 2–4%
        - id: n_val
          label: 估值偏高：约 8–9x EV/Rev vs ONON 3.0x、LULU 1.28x
        - id: n_risk
          label: 关键风险：质量投诉（Trustpilot 2.2/5），未提交 S-1
        - id: n_gap
          label: 证据缺口：无审计财务；IPO 窗口不确定
        - id: n_rec
          label: 观察 — S-1 提交时重新评估
      edges:
        - from: n_market
          to: n_rec
        - from: n_product
          to: n_rec
        - from: n_share
          to: n_rec
        - from: n_val
          to: n_rec
        - from: n_risk
          to: n_rec
        - from: n_gap
          to: n_rec
    approximationNotes: null
    claimRefs:
      - CV001
      - CV009
      - CV013
      - CV022
      - CV027
      - CV029
  - id: FV002
    title: EV/收入倍数对比：Vuori vs 上市运动服饰同行
    type: bar
    layout: standard
    summary: 条形图比较上市运动服饰同行的 EV/LTM 收入倍数，并与 Vuori 在 $5.5B 估值下的隐含倍数对照；截至 2026 年 6 月 12 日。
    data:
      items:
        - label: UAA (Under Armour)
          value: 0.84
        - label: LULU (Lululemon)
          value: 1.28
        - label: NKE (Nike)
          value: 1.52
        - label: ONON (On Holding)
          value: 3
        - label: Vuori（收入估计 $1B）
          value: 5.5
        - label: Vuori（收入估计 $700M）
          value: 7.9
        - label: Vuori（收入估计 $600M）
          value: 9.2
      xAxis: 公司 / 情景
      yAxis: EV / LTM 收入倍数（x）
    approximationNotes: Vuori 收入为估计值；EV 等于上一轮老股交易估值 $5.5B。上市同行数据截至 2026 年 6 月 12 日，来自 Yahoo Finance 和 Multiples.vc。
