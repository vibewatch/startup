      - number: '5.2'
        title: 产品线和面料技术地图
        blocks:
          - type: paragraph
            body: >-
              Vuori 的产品架构围绕四个自研面料平台组织，每个平台对应一组不同成衣家族和使用场景定位。

              DreamKnit 是旗舰材料——一种极柔软、四向弹力的磨毛针织面料，采用 89% 再生材料制造，并获认证为 Vuori Preferred Fiber。DreamKnit
              系列覆盖男、女款运动裤、慢跑裤、连帽衫、套头卫衣、长袖和短袖上衣、Polo 衫以及休闲纽扣衬衫。男款核心 SKU 包括 Ponto Performance Jogger、Ponto Performance
              Pant 和 Ponto Full Zip Hoodie；女款核心 SKU 包括 Halo Performance Hoodie 2.0 和 Halo Essential Wideleg Pant。

              BlissBlend 是较新的材料创新，随 Kaia Gerber 合作系列推出。它提供 360° 多维弹力，触感轻盈、近乎无重量，采用 75% 再生材料制造。BlissBlend
              成衣瞄准高端从工作室到街头细分，包括 AllTheForm 上衣、文胸和短裤。

              BreatheInterlock 是 Vuori 覆盖度最高的功能面料，带有桃皮绒触感，为高强度训练提供遮透性和结构感。它支撑核心训练系列（紧身裤、修身上衣、文胸）。

              VCycled 是适合涉水冒险的面料，部分采用再生塑料瓶制成，面向户外和旅行场景，用于冲浪短裤、泳裤混合款和技术休闲短裤。

              2025–2026 年，Vuori 从四个核心软商品平台延伸到两个邻近硬商品的新类别：滑雪和雪地外套（Taika Snow Shell 系列，2025 年 11 月），采用 100% 再生 NetPlus
              渔网面料，防水等级 30K；以及女款牛仔（2026 年 3 月），采用与 Tencel lyocell 混纺的定制高端牛仔布。这些动作扩大了 Vuori
              现有客户群可覆盖的总可用市场（TAM），同时不需要重新建设品牌资产。

              2026 年 4 月，Vuori 任命 Heather Archibald 为首位 Chief Product Officer，负责从设计、材料规划到商品企划、生产和采购策略的完整生命周期。这个新角色把此前分散在
              CEO 之下的产品领导职责正式化。
