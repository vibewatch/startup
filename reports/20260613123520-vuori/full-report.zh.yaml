      - number: '4.4'
        title: 资本充足性和融资
        blocks:
          - type: paragraph
            body: >
              Vuori 2024 年 11 月的 $825 million 投资轮采用老股要约收购结构，由 General Atlantic 和 Stripes 领投，现有投资者 SoftBank Vision Fund
              2、Norwest Venture Partners 和 ABP Capital 参投。关键在于，这次老股要约收购的资金并未进入 Vuori
              资产负债表——交易为早期投资者（天使投资人、高净值个人）提供流动性，而不是向公司注入新资本。Norwest 管理合伙人 Jon Kossow
              证实：「公司正在盈利运营，不需要运营现金或投资资金。」该结构不同于新股融资，意味着公司的现金状况并未因该轮发生实质变化。2024 年融资前，各轮累计融资约 $1.27 billion，包括 2019 年
              Norwest 的 $45M，以及 2021 年 SoftBank Vision Fund 2 的 $400M（该轮也大部分用于偿还早期投资者）。

              Vuori 在 EBITDA
              和净利润层面持续盈利，意味着其运营模式可自我供血。作为没有披露烧钱的盈利公司，传统「现金跑道」框架并不直接适用——公司在产生而非消耗经营现金。管理层确认，当前增长轨迹不需要运营资金支持；该轨迹包括继续在美国开店，并在
              2026 年前把美国以外门店扩至 15 家。未来若再融资，计划用途将支持国际市场进入、供应链投资和 IPO 前组织建设。

              IPO 预计会发生，但截至 2026 年 6 月尚未提交 S-1 招股说明书。CNBC 2024 年 12 月报道，接近公司的人士确认 IPO 计划正在推进。Bloomberg 曾在 2023 年末报道公司考虑
              2024 年 IPO，但最终没有落地。Vuori, Inc.（CIK 0001672741）在 EDGAR 上最近一次 SEC 文件是 2016 年 4 月 27 日的 Form D，涉及一笔早期种子 /
              天使豁免发行。此后没有公开提交后续 Form D 或其他注册声明，这与后续融资通过豁免结构化交易或由投资方实体代为申报相一致。
