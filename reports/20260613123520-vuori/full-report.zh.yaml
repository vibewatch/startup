      - number: '1.2'
        title: 创始人与领导层
        blocks:
          - type: paragraph
            body: >-
              Vuori 创始人兼 CEO Joe Kudla 的履历不典型，横跨会计、时装模特和连续创业。Kudla 在 University of San Diego 学习会计后，先在 Ernst & Young
              任高级审计师，积累了后来塑造 Vuori 营运资本模式的财务纪律。随后他在欧洲做了约两年模特， 包括 Milan 和 Barcelona，由此接触服装行业。Kudla 之后回到会计领域，最终成为会计和 IT
              咨询公司 Vaco 的合伙人。

              Vuori 是 Kudla 的第三次创业。他在自家车库里无薪经营两年，盈利前仅从亲友处募得约 $2.6M。到 2024 年老股交易时， Kudla 仍持有 Vuori
              多数股权；即便引入大量机构资本，创始人控制权仍在。

              Vuori 的 C-suite 包括总裁 Ashley Kechter、CFO Desiree Swanson、CMO Karen Riley-Grant，以及首席数字官 David Sosnowski。2023
              年 4 月，Vuori 宣布四位 C-suite 任命：Hugh Garrity（COO，前 Yeti 全球运营负责人）、 Libby Stockstill（总法律顾问，前 Vans
              全球总法律顾问）、Jennifer Frisch（首席人力官，前 Starbucks 合伙人资源 SVP）， 以及 Bryan Muehlberger（CIO，前 Beachbody CIO）。2026 年 4
              月，Vuori 新设首席产品官职位，并任命 Heather Archibald 负责从设计到采购的端到端产品战略；她此前任 Rothy's 首席产品与商品官。董事会成员包括 Joe Kudla、Jon
              Kossow（Norwest）、Nagraj Kashyap（SoftBank）和 Andrew Ferrer（General Atlantic，2024 年加入）。
