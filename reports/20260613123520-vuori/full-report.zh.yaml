      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: 建议：TRACK — S-1 申报时重新评估
            body: >-
              Vuori 业务质量高——持续盈利，增速比运动服市场快 2–10 倍，并从 Lululemon 手中夺取份额。不过，2024 年 11 月 $5.5B 二级估值相对估算收入隐含 5.5–9.2x
              EV/revenue，较 2026 年 6 月所有上市可比公司都有重大溢价。截至本报告运行日期，公司尚未提交 S-1。缺失的 S-1 和私人财务不透明，使买入建议无法成立。该投资应继续跟踪；一旦 S-1
              申报，且披露收入确认 $1B+ 逻辑、EBITDA margin 超过 12%，应立即上调至 research-more 或 buy。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV013
              - CV014
              - CV018
              - CV027
          - type: callout
            title: 关键风险：规模化下的品牌稀释
            body: >-
              Vuori 的核心竞争优势——高端面料质量和社区真实感——在公司扩张时已经出现早期侵蚀信号。Trustpilot 2026 年将 Vuori 评为「Poor」，评分
              2.2/5，并记录了关于面料成分变化、新采购商品化学气味和国际订单客户服务差的投诉。Particl 数据显示，2025 年 Q4 线上销售按标准化口径未达到 2024 年 Q4 节日高峰。SWOT
              分析指出，相比全球同业，供应链仍不成熟。这些信号尚未构成投资逻辑击穿，但属于 DTC 消费品牌中最常先于倍数压缩出现的运营失败类型。
            calloutType: risk
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV041
          - type: callout
            title: 结构性洞察：Vuori 两轮融资都是二级要约，不是增长资本
            body: >-
              2024 年 11 月 $825M 轮和 2021 年 $400M 轮都采取二级要约结构，为现有持有人提供流动性。Vuori 董事会成员 Jon Kossow 明确表示「there's no financial
              engineering here」，且公司已经盈利，不需要外部资本。这种结构意味着，$5.5B 私人市场价格由新进入的成长投资者（General
              Atlantic、Stripes）基于对品牌轨迹的长期押注设定，而不是公司围绕具体财务计划募资。对新投资者而言，价格反映的是信念而非 financial
              engineering；但这也意味着从运营角度看，没有新资金为下行提供保护。
            calloutType: insight
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV032
              - CV033
          - type: callout
            title: 关键假设：收入估算不确定性很大
            body: >-
              本章 EV/revenue 倍数分析依赖 Vuori 收入估算，范围从 $288M（仅 ECDB 电商）到 $1B（CNBC 引述的分析师共识）。作为中心估算使用的 $600–700M 总收入，是在 ECDB
              电商数字基础上，结合管理层披露的渠道组合评论，对 DTC 零售和批发渠道做膨胀估算得出。该估算未经独立验证，可能在任一方向上出现重大错误。在经审计财务可用前，投资者应把所有倍数计算视为数量级估算。
            calloutType: assumption
            claimRefs:
              - CV008
              - CV011
              - CV013
