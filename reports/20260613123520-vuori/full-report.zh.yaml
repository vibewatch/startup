      - number: '6.3'
        title: 具名批发合作伙伴、大使和社区证明
        blocks:
          - type: paragraph
            body: >-
              对一个 DTC 品牌而言，Vuori 的具名批发证明异常强。Nordstrom、REI 和 Equinox 被确认为三大批发合作伙伴；Forbes 和 Modern Retail 报道显示，批发渠道约占总收入
              25%，约有 1,800 个销售点。REI 在少量门店测试 Vuori 后，发现「强客户亲和力」，并扩展至 150+ 个地点——这是来自有影响力户外零售策展者的有记录背书。英国合作伙伴 Selfridges 和
              Harrods 把品牌锚定在高端百货定位，英国 Barry's Bootcamp 则延伸健身工作室渠道。韩国 Shinsegae Group 是 2025 年 9 月开业首尔门店的加盟合作伙伴。

              大使和社区证明提供了最具差异化的获客信号。Vuori 的 V1 Community Program 面向认证健身专业人士、工作室 / 健身房业主、大学和职业运动员开放，已增长至 12,000 多名成员，包括
              400 名 NIL 运动员和超过 1,000 名 NFL 选秀球员。具名职业大使包括体操运动员兼影响者 Livvy Dunne（2021 年起合作）、Texas 四分卫 Arch Manning、演员兼创意伙伴
              Tom Holland（2026 年春季）、Gerber-Crawford 家族（Cindy Crawford、Rande Gerber、Kaia Gerber、Presley Gerber 作为 2025
              年春季合作伙伴和财务投资者），以及 Marcos Giron（网球）、Justin Williams（骑行）、Alana Blanchard（冲浪）和 Michelle Zhang（高尔夫）等专项人士。CMO
              Karen Riley-Grant 确认，大使驱动的产品性能真实展示是「全球规模化不可或缺的工具」。

              国际开店补充了具名地理证明：伦敦旗舰店（2024 年 10 月）、上海永久门店（2024 年 5 月）、首尔（2025 年 9 月）和北京（2025 年 10 月）。Vuori 同时于 2025 年在 11
              个新国家推出本地化电商（瑞典、挪威、丹麦、芬兰、瑞士、西班牙、意大利、比利时、奥地利、葡萄牙、日本）。
