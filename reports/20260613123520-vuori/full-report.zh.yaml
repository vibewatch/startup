  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >
              Vuori 的收入模型混合直面消费者（DTC）和批发渠道，其中 DTC 贡献超过一半总收入。DTC 覆盖公司自有电商平台（vuoriclothing.com）和持续扩张的品牌实体零售店；到 2025 年 8
              月，全球自营门店已超过 100 家。品牌业务覆盖约 30 个国家，主要靠 DTC 和精选批发网络触达消费者；批发网络约 1,800 个销售点，包括
              REI、Nordstrom、Selfridges、Harrods、Equinox Gyms 和 Barry's Bootcamp。

              Vuori 在功能服饰组合中掌握高端定价：短裤约 $68–$74，慢跑裤 $94–$118，紧身裤约 $78–$100，连帽衫
              $98–$120。品牌通过与批发合作伙伴签订最低广告价（MAP）协议，守住跨渠道价格完整性。Reuters 2024 年 11 月报道的标价为紧身裤 $100、运动文胸 $64。按 Particl 的交易分析，到
              2026 年初，全价平均单件价格已升至低 $100 区间；但当前成交价因选择性促销窗口而滞后。

              服装公司的收入确认相对直接：DTC 销售在发货或交付时确认；批发收入在交付给零售商时确认。这里没有订阅、SaaS
              或平台市场机制。品牌有意压住批发量，避免渠道稀释；这保住了定价权，但也限制了该渠道的总可触达销量。Vuori 2024 年 2 月投放首支 Super Bowl 广告，反映公司为潜在 IPO
              加大营销投入；接近公司的行业人士确认了 IPO 计划，但截至 2026 年 6 月尚未提交 S-1 招股说明书。
