      - number: '5.5'
        title: 路线图和产品发布
        blocks:
          - type: paragraph
            body: >-
              2025–2026 年，Vuori 加快了产品和渠道发布节奏，反映 2024 年 11 月完成的 $825M 老股要约资金所支持的扩张力度。

              2025 年 11 月，Vuori 推出首个滑雪和雪地服饰系列——面向男女的 Taika Snow Shell 系列——采用 100% 再生 NetPlus 4 层面料，防水等级 30K，并使用不含 PFC 的
              DWR 涂层。该系列面向度假村和野雪滑雪者，技术细节包括 RECCO 雪崩反射器、AquaGuard 拉链通风口和一体式防雪裙。设计高级副总裁 Sarah Carlson
              将其称为「基础」，并表示更多高山层次、扩展廓形和新技术面料正在开发中。

              2026 年 3 月，Vuori 首次推出女款牛仔胶囊系列：一条复古阔腿牛仔裤（$198）和一件宽松廓形牛仔夹克（$188），提供骨白和浅靛蓝水洗；面料将定制高端牛仔布与 Tencel lyocell
              混纺，以增加弹力和柔软度。男款牛仔线此前已推出；早期男款牛仔评论指出版型问题（「不合身且太重」），Vuori 在女款版本中通过额外水洗和手工后整理进行了处理。

              2026 年春季「For Kaia」活动加深了 Kaia Gerber 合作（该合作始于 2025 年秋季「Vuori by Kaia」），主打 BlissBlend AllTheForm 和 Sunday
              Track 系列。2026 年 4 月，Vuori 签下 Tom Holland 作为创意、战略和财务合作伙伴——也是首位男性名人合作伙伴——强化品牌向男装生活方式定位的扩张。

              零售 / 基础设施路线图方面，Vuori 计划到 2026 年底再开约 25 个地点，包括英国、中国（2025 年 10 月北京）、韩国（2025 年 9 月通过加盟在首尔开店）、日本和中东的 15
              家国际门店。全球 100 家门店里程碑已在 2025 年末达成。

              Heather Archibald 出任首席产品官（2026 年 4 月 20
              日生效），意味着公司在产品组织纪律上进行结构性投入：她的职责覆盖设计、开发、原材料规划、商品企划、生产和采购策略，并整合进单一垂直一体化产品职能。
