      - number: '6.4'
        title: 留存、满意度和复购信号
        blocks:
          - type: paragraph
            body: >-
              独立评价聚合给出混合但净正向的留存信号。Reviews.io 汇总 14,853 条已验证买家评论，综合评分 4.6/5，准时配送率 98%，客服子评分 4.7/5——高于 DTC
              服装平均水平。客户证言强调面料差异化，也有多条提到在品牌广泛出名之前就已多年购买。多家分析师来源引用 Vuori 自有 NPS 约为 70+，显著高于 2025 年零售行业 28–41
              的平均区间，说明主动推荐品牌的客户占比较高。

              Earnest Analytics 钱包份额分析（2023 年 4 月–2024 年 4 月）揭示了最深的行为忠诚信号：现有 Vuori 买家减少在 Nike DTC 渠道的支出（同比少
              17%），同时把总运动与运动休闲预算中更高份额（21.6% → 27.4%）分配给 Vuori。这一模式说明忠诚度是赢来的，而不是偶然多元化。Vuori
              的「投资幸福」免费退货保证降低首次购买风险，品牌评论者将其视为转化和复购驱动因素。

              反向证据也很重要。Trustpilot 汇总评分为「差」2.2/5，2026 年 3 月评论提到：自动客服机器人无法解决账单争议、退货摩擦导致客户收到店铺积分而非承诺退款，以及国际配送失败（一名英国客户等了 6+
              周才收到订单）。ComplaintsBoard 记录 7 起投诉，解决率 0%。CNBC 2024 年 12 月指出，消费者留言板关注 Vuori 在迈向 IPO
              的规模化过程中能否维持面料质量——这是直接影响留存的感知风险。一名 2026 年长期 Trustpilot 评论者称面料采购转向柬埔寨后手感变差，暗示供应链驱动的质量稀释。
