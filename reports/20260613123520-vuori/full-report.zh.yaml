      - number: '3.5'
        title: 切换成本、护城河耐久性与反向证据
        blocks:
          - type: paragraph
            body: >
              高端运动休闲天然切换成本低：没有订阅、没有平台锁定，服装购买也呈间歇性。伪锁定主要来自心理品牌忠诚、衣橱投资（一柜 Vuori 服装会形成锚定和复购惯性）、 尺码版型熟悉度，以及参与零售活动社区。Earnest
              Analytics 数据显示，Vuori 顾客在 Nike DTC 渠道少花 17%，这说明 Vuori 对竞争者钱包份额形成了真实但温和的挤出——也证明 Vuori 忠诚不只是偶发购买。钱包份额升至 27.4%
              进一步强化了这一趋势。 不过，Morning Consult 发现 52% 的 Vuori 客户也在 Lululemon 购物、30% 也在 Nike 购物，说明多品牌并用仍是行为常态； Vuori
              尚未达到足以让切换成本真正变重的独占忠诚位置。

              Vuori 最耐久的竞争护城河，是加州生活方式定位中的品牌资产、不能立刻商品化复制的自研面料平台、不断扩大的零售社区基础设施（100+ 家门店）， 以及能打动目标客群的可持续资质（56%
              首选纤维）。Lululemon 的 Nulu 和 Luon 面料证明，自研材料可以多年支撑高端定价； 但也说明，一旦质量批评进入媒体，品牌侵蚀可能迅速加速。Vuori 国际扩张时必须守住面料质量纪律。

              反向证据需要正面承认。Alo Yoga 在约 18 个月内把品类客流份额从 1.4% 提升到 8.6%，说明一个资金充足、网红触达强、开店快的挑战者， 可以比在位者反应更快地重塑品类动态。如果 Alo
              继续扩张，并从当前奢华时尚角度转向更靠近 Vuori 的生活方式舒适定位，它就是一个可信的替代威胁。 另外，Lululemon 2026 年 4 月代理文件披露 Chip Wilson 同时为 Alo Yoga
              和 Vuori 提供建议，意味着品类定义级经验正在多个挑战者之间共享， 压缩任何机构知识优势。Vuori 计划 IPO（预计 2026
              年末）会带来公开市场审视和增长预期，可能迫使公司做出稀释利润率的投入来满足投资人节奏； Lululemon 自身在 2023–2026 年就没有很好处理这一动态。
