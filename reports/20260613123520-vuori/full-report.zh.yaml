      - number: '1.6'
        title: 风险、反向事件与证据缺口
        blocks:
          - type: paragraph
            body: >-
              Vuori 的增长故事并非没有实质风险和反向信号。Puck News 2025 年 1 月发表题为「The Vuori Reality Distortion
              Complex」的批判性分析，质疑一个产品「平淡、技术化」的品牌能否支撑 $5.5B 估值。文章指出，Vuori 产品已经无处不在 （Bay Area 青少年篮球赛上每隔一个家长就穿
              Vuori），但质疑这种普及能否转化为足以支撑估值倍数的持久品牌忠诚。

              可持续性方面，Vuori 曾连续三年获得 Climate Neutral Certified 认证，但认证已经失效，不再有效。Good On You 可持续评级服务给 Vuori
              的评级有限，理由包括认证过期、依赖碳抵消而非减排、缺少完整供应商名单，以及没有服装回收或维修计划。

              Vuori 曾遭遇工资工时集体诉讼。一个值得注意的反向进展是，原告律师因在法院文件中提交 AI 幻觉生成的案例引用，被联邦治安法官制裁。 法院驳回该动议，案件最终于 2026 年 1
              月经约定有偏见驳回。该事件说明 Vuori 仍有诉讼暴露，也反映其所处的法律风险环境。

              Better Business Bureau 收到过客户投诉，与 Vuori 的交易量相符。估值怀疑者指出，公司收入倍数偏高（估计为 2025 年收入的 8–14 倍）、100+
              门店国际扩张有执行风险、数字渠道获客成本上升，以及快时尚和自有品牌竞争者正在激进模仿 Vuori 标志性的柔软、 极简美学。
