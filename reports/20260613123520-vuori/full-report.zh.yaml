      - number: '6.2'
        title: 采用轨迹和数字表现
        blocks:
          - type: paragraph
            body: >-
              Vuori 的采用曲线是运动休闲品类中最陡的一批。2025 年 8 月，品牌全球自营零售店突破 100 家，比原定 2026 年目标提前六个月；CEO Joe Kudla
              将这一里程碑归因于消费者动能和社区力量。达到 100 家门店时，Vuori 通过自有地点和分销商网络服务近 30 个国家的客户。根据 Particl 零售分析，自 2023 年以来，总季度销售量每季度约增长
              10.71%；分析师估计 Vuori 全渠道年收入约 $1 billion。

              数字表现也印证了这一轨迹。Grips Intelligence 报告 Vuori 2025 年线上 DTC 收入为 $326.6 million，预计 2026 年增长 50%+。2026 年 4 月，网站录得约
              6.95 million 次会话和 $42.95 million 月线上收入，转化率 4.0–4.5%，高于运动行业约 2.97%
              的平均水平。这些指标意味着一个结构强劲的数字飞轮：高意图流量、高端定价和复购行为压缩获客成本，并放大客户终身价值。

              从市场份额看，Earnest Analytics 信用卡数据显示，2023 年 4 月至 2024 年 4 月，Vuori 和 Alo Yoga 各自获得约 1% 运动休闲市场份额，当时 Under Armour
              正在收缩。Vuori 买家在 Vuori 的运动与运动休闲钱包份额也同比从 21.6% 升至 27.4%，说明品牌忠诚度加深。TD Cowen 提醒，进入 2025 年返校季前，Vuori 相对
              Lululemon 的搜索份额正在提升，Lululemon-to-Vuori Google 搜索比率从 11.7x 走向 10x。在相邻的 Piper Sandler 青少年调查中，Vuori
              在高收入青少年运动服偏好中从第 24 位升至第 15 位。
