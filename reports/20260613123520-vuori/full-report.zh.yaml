              Vuori 顾客钱包份额从运动和运动休闲支出的 21.6% 升至 27.4%，叠加重叠买家在 Nike DTC 购买减少 17%，说明 Vuori 开始替代既有品牌关系，而不只是与其共存。这是 Lululemon
