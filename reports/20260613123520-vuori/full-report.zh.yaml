      - number: '5.3'
        title: 运营模式和供应链
        blocks:
          - type: paragraph
            body: >-
              Vuori 采用轻资产制造模式：公司不拥有也不运营任何生产设施。所有服装都由第三方合约工厂生产；Vuori 按照 Vendor Code of Conduct（VCoC）选择工厂，该准则基于
              International Labor Organization（ILO）核心劳工标准。VCoC 覆盖童工和强迫劳动禁令、公平工资、工作时长限制、环境实践，并要求所有一级供应商及其分包商持续监测和改进。

              供应链全球化，采购关系遍布亚洲（包括柬埔寨）。2026 年初部分客户评论提到，特定 SKU 的面料原产国变为柬埔寨，并抱怨感知柔软度下降。随着品牌把订单扩展到新的工厂关系，这暴露出供应链质量一致性风险。

              物流侧，Vuori 的所有订单都从加州仓库发出，包括英国网站购买订单；这引发了客服投诉，集中在意外进口税和国际买家数周配送延迟。截至 2026 年 6 月，尚无已确认的英国或欧洲履约节点。

              零售渠道覆盖公司自营店、加盟店（例如 2025 年 9 月首尔旗舰店）以及 Nordstrom、REI、Equinox 和独立户外、跑步专业零售商的批发铺货。创始人兼 CEO Joe Kudla
              将早期批发采用视为公司在 DTC 前阶段实现盈利的关键因素。批发组合从属于自有渠道，Vuori 主动把通过批发发现品牌的客户引导至自有 DTC 渠道复购。

              纤维选择由 Textile Exchange 的 Fiber and Materials Matrix 管理，生命周期影响数据来自 Worldly 的 Higg Materials Sustainability
              Index（Higg MSI）。截至 2024 年，约 56% 的总面料支出使用 Vuori Preferred Fibers——与传统同类纤维相比，每公斤温室气体排放更低的纤维。
