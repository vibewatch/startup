      - number: '4.2'
        title: 增长和收入估计
        blocks:
          - type: paragraph
            body: >
              Vuori 是未上市公司，未公开披露财务数据，因此所有收入和增长数字都是分析师估计或公司口径代理指标，并非经审计账目。CNBC 援引 Euromonitor 和 Earnest Analytics 截至 2024
              年末的销售估计报道称，分析师估计 Vuori 年收入约 $1 billion；截至 2024 年 10 月，Vuori 年初至今销售额增长 23%，同期运动服市场增长 4.3%。2023 年，Vuori 增长
              44%，而更广义运动服市场仅增长 2.4%。ECDB 对电商收入的估计显示，vuoriclothing.com 2025 年线上年销售额为 $288M，预计 2026 年增长
              5–10%。这些数字可能低估了总收入，因为它们排除了门店和批发渠道；根据渠道结构报道，这两类渠道合计约占总收入 45–50%。

              Earnest Analytics 2024 年 4 月数据发现，Vuori 和 Alo Yoga 过去 12 个月各自获得约 1% 市场份额；同时，Vuori 买家在 Vuori 的运动与运动休闲钱包份额从
              21.6% 升至 27.4%，说明品牌既在拉新，也在加深忠诚度。TD Cowen 2025 年 7 月研报指出，Vuori 相对 Lululemon 的 Google 搜索份额在提升，搜索比率从 11.7x
              压缩至接近 10x——这是品牌动能的方向性代理指标。

              Particl 交易数据中，假日季季度（2024 年 Q4）归一化线上销量是 Vuori 的峰值；2025 年 Q4 仍处高位，但低于该峰值。2026
              年初出现高端运动休闲品类节后常见的走软。公司尚未公开发布管理层指引、收入展望或年度报告。
