  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图概览
        blocks:
          - type: paragraph
            body: >
              2026 年的高端运动休闲品类，核心不是总需求被摧毁，而是结构性份额转移。Vuori 必须应对三股宏观竞争力量。第一，历史领导者 Lululemon 在北美核心市场明显后撤：2026 年
              Q1，美洲可比销售按固定汇率下降 5–6%，全年收入指引下调至 $11.0–$11.15 B （持平至 -1%），CEO 辞职，品牌还以前所未有的规模依赖促销降价。第二，Alo Yoga
              完成了现代服装专业零售中最快的扩张之一， 从 2023 年初美国 10 家门店增长到 2026 年全球 169 家门店，并拿下约 7.2 个百分点的运动服饰品类客流份额——主要来自
              Lululemon。第三，Nike 和 Adidas 等传统体量领导者仍凭全球收入占主导（分别为 $46 B 和 $29 B），但在生活方式场景上丢失 「心智市场份额」，为 Vuori
              这类高端挑战者系统性占位留下空白。

              Vuori 的竞争位置落在两个层级的交叉处。它在高端生活方式定位上直接对上 Lululemon 和 Alo Yoga，在男性高端性能细分上对上 Rhone。年轻买家中，Gymshark
              的社交媒体健身服模式带来替代风险；重视性价比的女性买家中，Athleta 也构成替代，尽管 Athleta 自身正在转型，2026 年 Q1 收入下滑 12%。Outdoor Voices 曾是精神替代品，但在
              2024 年中通过近破产出售基本退出， 如今只剩线上业务，减少了一个可信的生活方式休闲替代。Nike 或 Gap 自有品牌的内部打造，以及 Lulu 降价区里的「无品牌」商品化运动服， 是主要的现状替代品。

              Morning Consult 的品类研究证实心智版图仍分散：Nike 在全国以 22% MMS 领先，但 Vuori 在 $100 k+ 家庭这一核心客群中的 MMS 为 2.1%，是其全国 0.7%
              的三倍，说明它已强势渗透可触达高端受众，并且仍有可观空白可继续扩张。
