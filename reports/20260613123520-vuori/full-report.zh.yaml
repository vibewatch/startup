      - number: '2.5'
        title: 尽调缺口与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              多个关键数据点仍不确定或存在争议，必须保留差异，而不是用平均数抹平。最重要的数字矛盾是全球运动服饰 TAM 区间：Fortune Business Insights（$373B）对 Mordor
              Intelligence（$488B）——31% 的差距来自边界定义。报告买方应锚定更窄的高端 / 运动休闲子细分 （全球 $402–$460B），而非更宽的运动服饰总量，因为 Vuori
              竞争的是生活方式性能切片，不是商品化运动服。第二个矛盾是性别市场份额： 「女性 52–53%」和「男性 72.7%」两组估计似乎衡量的是根本不同的东西（买家数量 vs.
              一个可能包含由男性购买主导的运动装备和性能鞋履宇宙里的终端用户收入份额）。 Vuori 在美国高端运动休闲中的具体 SAM，没有独立分析机构公开测算；我们的 $8–15B 估计是三角测算，应结合 Vuori
              实际渠道组合和 AOR（平均订单收入）做压力测试。归属于 Vuori 的 SOM 同样由公开收入信号估算；若要做正式自下而上模型，需要获得 Vuori 渠道拆分， 这些信息目前不公开。最后，2026 年关税上调对
              Vuori 毛利率的具体影响尚未披露；公司采购地理和供应链结构并未完全公开，量化关税暴露仍是未解缺口。
