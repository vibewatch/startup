      - number: '3.2'
        title: 直接竞争者与在位者画像
        blocks:
          - type: paragraph
            body: >
              按收入和门店数看，Lululemon 仍是高端运动休闲的主导在位者，但竞争相关性正在快速削弱。2026 年 Q1 暴露出公司承受结构性压力： 美洲收入按固定汇率下降 3%，毛利率压缩 410 个基点至
              54.2%，摊薄 EPS 指引每股下调超过 $1。临时联席 CEO 将恶化部分归因于 「媒体负面评论」——包括与创始人 Chip Wilson 的高调代理权争端；同期披露显示，Wilson 正同时为 Alo
              Yoga 和 Vuori 提供建议。 折扣压力可以量化：行业报道引用的 Jefferies 研究发现，Lululemon 正价售罄率从历史 95% 降至约 75%，品牌定价权出现急剧反转。 前 Nike 高管
              Heidi O'Neill 被任命为新常任 CEO，2026 年 9 月生效，但分析师普遍预期转型会拉长。Lululemon 的疲弱是 Vuori 的实质机会，也是 Alo Yoga
              的机会；后者一直是份额转移的主要受益者。

              Alo Yoga 是 Vuori 最有动能、资源更充足的直接对手。Alo 由创始人 Danny Harris 和 Marco DeGeorge 私有持有， 据报道私人估值 $10 B（最近基准来自 2023
              年末）。它靠工业级名人和网红种草建立位置——12 个月内约 32,700 条赞助帖——并叠加快速开店。 品牌的「sanctuary」门店形式和「studio-to-street」奢华定位瞄准 Gen Z
              和更年轻的千禧一代买家，与 Vuori 以舒适和生活方式驱动、 年龄略高且更富裕的人群部分重叠，但没有完全趋同。Alo 的 DTC 集中度（约 90% 销售）和对网红文化的依赖，在文化趋势变化时可能成为弱点；
              但当下，其品类客流份额 8.6%（对 Vuori 的 9.2%）已经让双方在同一商圈地产和客户注意力上正面竞争。

              Nike（FY2025 收入 $46.3 B，全球运动服装份额约 17.6%）和 Adidas（约 $29 B，份额约 16–18%）规模不同， 但会在高收入买家的生活方式场景以及各自 DTC 渠道上与
              Vuori 相交。Nike 的声誉在 RepTrak 2026 排名中从 2024 年全球第 #21 跌至 #50，而 Adidas 升至 #2；Nike 收入从 2023 年 $51.5 B 降至 2025 年
              $46.3 B。两大宏观玩家缺少 Vuori 建立起来的生活方式休闲真实性，但它们的分销能力、生产规模和品牌认知（Nike 在 18–34 岁队列中的认知度为 83%）仍是强大的结构性优势。
