  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品与服务定义
        blocks:
          - type: paragraph
            body: >-
              Vuori 是一个垂直管理、DTC
              优先的功能服饰品牌，服务的是追求高端、生活方式活跃的成年人：他们希望衣服能从运动场景无缝切到日常生活。核心客户任务很清楚：一套衣橱要覆盖早晨瑜伽或健身、工作日和晚间社交，不需要中途换衣。Vuori
              的标语「为运动而生，为生活而型」概括了这一定位。品牌瞄准运动休闲市场的高端细分，竞争重心不是 Gore-Tex 屏障或压缩分区等性能技术特征，而是面料质量、版型适配多场景的能力和加州海岸美学。

              产品开发遵循公司内部宣称的「面料优先」理念：设计团队先从新材料或材料混纺出发，再根据面料本身的拉伸方向、遮透性、纹理和吸湿排汗特性推导成衣形态。这与标准服装流程（先设计廓形，再指定面料）相反，并催生出四个命名材料平台；Vuori
              将其视为差异化知识产权。每条核心成衣线——男款 Kore Short、Performance Jogger 系列、DreamKnit 连帽衫家族和女款 Halo 系列——都由其锚定材料平台定义。

              客户通过三种分销模式接触 Vuori 产品：品牌 DTC 网站和移动电商体验；100+ 家公司自有及加盟零售店，这些门店兼具社区体验中心功能；以及精选批发合作伙伴（Nordstrom、REI、Equinox
              健身工作室、独立户外和跑步专业零售商）。零售店体验刻意让客户在购买前触摸和感受自研面料，弥补线上软商品销售固有的感官发现缺口。
