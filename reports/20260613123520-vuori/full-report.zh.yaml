  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Vuori 竞争的市场是高端运动服饰和运动休闲：以性能为导向、带生活方式定位的服装，零售单价通常高于 $60，涵盖紧身裤、慢跑裤、
              性能短裤、运动内衣、连帽衫，以及为运动和日常休闲双场景设计的过渡上装。该细分不同于大众运动服（H&M、Target 或 Amazon
              自有品牌销售的快时尚运动基础款）、纯技术运动装备和制服，也不同于没有性能宣称的传统休闲服。运动休闲是运动服饰中的时尚生活方式子类，
              专门覆盖健身房、办公室、旅行和社交等穿着场景；它也是大品类中增长最快的部分。高端运动服饰（定价 $60–$200+）估计占运动服饰总市场价值的
              15–25%。相邻市场包括户外技术服饰（Arc'teryx、Patagonia）、跑步专用鞋履，以及加入性能纺织品的奢侈时装屋；这些市场共享买家人群，
              但主要使用场景不同。现状替代品包括大众零售商的通用运动用品、被重新包装为休闲穿着的传统时尚品牌，以及快速增长的二手运动服饰平台。 Vuori 的纳入支出是面向成人、通过 DTC 和批发销售的高端性能 /
              生活方式服饰；排除支出为鞋履、配饰、装备和低于高端门槛的大众基础款。 这个边界很关键：宽口径运动服饰 TAM 估计往往包含大众市场销量，估计会把 Vuori 真正服务市场夸大 4–6 倍。
