      - number: '1.7'
        title: 图表
        blocks:
          - type: callout
            title: 第二年起盈利——逆周期 DTC 纪律
            body: >-
              Vuori 在获得任何风险资本前，于 2017 年实现盈利。公司采用供应商融资式营运资本模型，让库存按收货、售出、付款的顺序周转。这种财务纪律一直延续到 100+ 家门店开出和 $5.5B 估值阶段——也让
              Vuori 区别于那些边烧钱边融大轮、后来走向破产或困境 M&A 的 DTC 同行。
            calloutType: strength
            claimRefs:
              - CO025
              - CO026
          - type: callout
            title: 约 8–14 倍估计收入的老股估值，需要持续高增长支撑
            body: >-
              Vuori 2024 年 11 月 $5.5B 估值，对应 2025 年估计收入 $424–$637M 的 8–14 倍。2024 年交易是老股要约；
              没有新资金进入资产负债表。要守住这一估值，公司必须继续保持两位数收入增长，成功推进欧洲和亚洲的国际扩张，并维持高端毛利率； 与此同时，Alo Yoga、Lululemon
              和自有品牌模仿者的竞争都在加剧。单位经济或国际执行的任何失误，都可能大幅重置市场预期。
            calloutType: risk
            claimRefs:
              - CO018
              - CO019
              - CO036
          - type: callout
            title: Climate Neutral 认证失效；ESG 可信度出现缺口
            body: >-
              Vuori 曾连续三年持有 Climate Neutral 认证，之后认证失效。Good On You 可持续评级服务指出其可持续实践有限：供应商透明度不完整、 依赖碳抵消、没有服装维修或回收计划。当 ESG
              成为消费者和投资人的基本预期时，认证失效就是一个可信度缺口，可能影响重视可持续性的核心客群对品牌的看法。
