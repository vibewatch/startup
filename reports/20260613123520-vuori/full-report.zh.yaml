      - number: '1.4'
        title: 规模、版图与里程碑
        blocks:
          - type: paragraph
            body: >-
              Vuori 已从 Encinitas 的单品男装 DTC 品牌，成长为全球全渠道运动休闲公司。公司 2018 年推出女装，扩展到如今男女产品约 50/50 的结构。到 2018 年，公司年销售额约 $30M，并靠
              DTC 电商以及与 REI、Nordstrom、Equinox、Selfridges、 Barry's Bootcamp 的批发合作实现三位数增长。

              国际扩张始于 2022 年 3 月，公司在七个市场推出本地化电商（UK、France、Germany、Ireland、Netherlands、Australia、 Canada），随后于 2022 年 9
              月在伦敦 Covent Garden 开出第一家国际旗舰店。截至 2024 年 11 月，Vuori 通过零售、 电商和批发服务 18+ 个国家的客户。截至 2026 年 4 月，Vuori 经营约 100
              家自营零售店，最近一次美国开店是在 2025 年 8 月于 Colorado 的 Aspen。Vuori 预计 2026 年再增加 25 个门店，其中 15 个在国际市场。

              截至 2025 年，员工数估计约 2,600+，包括公司总部、零售门店和履约。分析和市场追踪来源估计 2025 年收入在 $424–$637M 区间，但 Vuori 未公开确认收入数字。公司自 2017
              年盈利，这使其区别于多数同等规模的 DTC 同行。 Vuori 推出 BlissBlend™ 和 DreamKnit™ 等自研面料创新，作为持续产品差异化战略的一部分。
