  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户细分和买家画像
        blocks:
          - type: paragraph
            body: >-
              Vuori 的可触达客户是追求高端、生活方式活跃的消费者，他们把健身性能和日常百搭结合在一起。2026 年 4 月网页流量数据显示，vuoriclothing.com 访客女性 / 男性比例为
              60/40；而品牌历史上最强增长向量，是穿着选择不足、寻找高质量运动休闲服饰的男性——这是 Lululemon 尚未充分开发的空白。如今产品线大约男、女各占一半，反映出成功的性别多元化轨迹。

              年龄集中峰值在 25–34 岁，25–45 岁构成核心。这类客户通常受过大学教育、居住在城市、可支配收入高于平均；购物场景覆盖健身、瑜伽、骑行、跑步和日常休闲。他们愿意支付 $125–150
              的高端平均订单价值，说明相对运动服品类中位数，其价格容忍度较高。心理画像上，他们重视环保（可持续和碳中和承诺有共鸣）、审美驱动（极简加州美学），并且社区导向（参与健身课、健身房、户外俱乐部）。

              渠道结构把买家分成两类：约 75% 收入流向 DTC（自有电商和公司门店），25% 通过批发。DTC 买家直接接触 Vuori 品牌承诺；批发买家则先通过 Nordstrom、REI 或 Equinox
              等合作伙伴的可信零售背书认识品牌——对先在线下发现品牌、再决定线上购买的消费者来说，这种可信度很关键。地理集中度高度偏美国：截至 2026 年，超过 95% 网页流量来自美国；国际扩张仍处早期，但正在加速。
