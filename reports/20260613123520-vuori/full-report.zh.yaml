      - number: '6.5'
        title: 扩张动态和集中度风险
        blocks:
          - type: paragraph
            body: >-
              Vuori 的扩张模型内嵌集中度风险，且会随着国际化加深而上升。美国地理集中度很高：超过 95% 网页流量来自美国；国际收入未单独披露，但估计截至 2025 年仅占总收入低个位数。到 2026 年约 15
              家国际门店分布在伦敦、上海、首尔、北京和部分欧洲市场——从品牌建设看有意义，但相对 100 家美国门店构成的商业盘子仍很小。

              在批发渠道（约占总收入 25%）内，Nordstrom 和 REI 是主导锚定合作伙伴。虽然 Vuori 报告约 1,800 个批发销售点，但缺乏按合作伙伴拆分的收入披露，无法核实集中度。Nordstrom 和
              REI 服务不同渠道客群（高端百货 vs. 户外合作社），一定程度上削弱了单一账户依赖。不过，如果任一锚定伙伴因自有品牌库存压力、市场环境或品类精简而减少订单，Vuori
              都会面临有意义的批发收入冲击。Equinox、Selfridges 和 Harrods 提供高端定位，但分销范围更窄。

              性别集中度是被低估的风险：Vuori 的创始身份、最强社区和历史上最深的产品开发都在男装。女装如今占产品组合 50%，但女性留存和复购率是否匹配已建立男性队列，公开证据不足。Vuori 买家中 52% 也在
              Lululemon 购物，说明很大一部分客户尚未把 Vuori 作为唯一运动休闲品牌；一旦 Lululemon 复苏或激进降价，Vuori 仍有脆弱性。
