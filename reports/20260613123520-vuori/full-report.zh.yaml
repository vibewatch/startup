      - number: '7.5'
        title: 财务与模型风险
        blocks:
          - type: paragraph
            body: >-
              Vuori $5.5B 估值对应 2024–2025 年约 $1B 分析师收入估算，隐含约 5–6x 收入倍数——处在高端服装可比公司的上沿，并依赖持续双位数增长和盈利能力不破。Lululemon
              的先例有启发性，也偏负面：北美同店销售下滑、2026 年披露 $380M 关税逆风、CEO Calvin McDonald 于 2026 年 1 月突然辞职后，LULU 股价较 2023 年高点下跌约 70%。到
              2026 年 6 月，Lululemon 将全年指引从增长 2–4% 下调为收入持平至下降 1%，EPS 指引从 $12.10–12.30 下调至 $10.95–11.15，单日股价下跌 9%。Vuori 不是
              Lululemon，但高端休闲运动倍数压缩是全行业信号，投资者不应忽视。

              Vuori 仍是私人公司，因此没有经审计财务报表、季度报告，也没有截至 2026 年 6 月向 SEC 递交 S-1
              或注册声明。所有收入、毛利和盈利主张都来自分析师估算、公司新闻稿和第三方交易分析工具（Particl、Earnest Analytics）。按 Particl 交易数据，线上销售量在 2024 年 Q4
              触顶，2025 年 Q4 低于该高点，2026 年初节后又继续走软——这是温和但值得盯住的减速。相较 Alo Yoga 的外套深度和 Fabletics 更宽的目录，Vuori 品类偏向下装；如果消费者对
              joggers 和 shorts 的偏好回归常态，集中度风险会上升。报道称 80% 的美国消费者面临可负担性约束，而 Fabletics 通过更低价格点取得 15%
              同店销售增长，这说明高端休闲运动可服务市场可能在分化，而非均匀增长。
