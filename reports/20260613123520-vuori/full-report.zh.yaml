      - number: '7.2'
        title: 运营和供应链风险
        blocks:
          - type: paragraph
            body: >-
              Vuori 的供应链集中在越南和中国，而 USTR 已点名这两个国家未能执行强迫劳动禁令，关税和合规风险因此叠加。最高法院 2026 年 2 月 20 日推翻 IEEPA 关税后，越南实际税率回落到
              10–20%，但拟议中的新 Section 301 关税层、以及 2026 年 3 月启动并覆盖越南等 16 个经济体的调查，意味着关税环境仍高度不稳。越南实际税率只要上调，就会压缩相对中国 20–25
              个百分点的现有关税差；这正是 Vuori 当前采购策略的基础。

              关税之外，越南工厂产能已经明显吃紧。China-plus-one 替代需求激增后，最优质的产能越来越多被订满；越南单位成本比可比中国工厂高 10–25%。Vuori 的 COGS
              主要由高端专有面料（DreamKnit™、BlissBlend™）驱动，一旦类关税成本和工厂单价同步上升，COGS 会被复合挤压。US Customs and Border Protection
              也在主动审计转运欺诈——中国原产货品被重新贴标为越南货品；若采购监督不足，品牌可能面临扣押和声誉损害。

              劳工合规方面，Vuori 的 Vendor Code of Conduct 要求 Tier 1 供应商遵守 ILO
              核心劳工标准，但独立评估确认，公司缺少第三方审计验证，也不披露工厂层面的工资或工作条件数据。这个缺口正在变得更关键：EU 的 Corporate Sustainability Due Diligence
              Directive（CSDDD）2026 年生效后，要求供货给 EU 市场的公司提供可审计、持续监测的供应链 ESG 数据；Vuori 尚未公开证明自己达到这一标准。Vuori 获得 Climate
              Neutral 认证，但其 2024 年温室气体排放几乎全部来自 Scope 3 供应链，公司也没有披露完整的循环或产品寿命终结计划。
