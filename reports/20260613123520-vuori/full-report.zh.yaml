      - number: '3.6'
        title: 图表
        blocks:
          - type: callout
            title: Alo Yoga 动能是近期最可信的替代威胁
            body: >
              Passby 数据显示，Alo Yoga 在约 18 个月内拿下 7.2 个百分点的运动服饰客流份额，是现代专业零售中最快的品类抢占。 虽然这主要来自 Lululemon，但 Alo 的奢华生活方式定位正向
              Vuori 的舒适生活方式细分靠拢。如果 Alo 明确转向舒适休闲面料， 而不是奢华时尚，其网红规模（每年约 32,700 条赞助帖）和可比门店版图（约 99 家美国门店 vs. Vuori 的 93 家）可能在
              Vuori 身上复刻 Lululemon 动态。
