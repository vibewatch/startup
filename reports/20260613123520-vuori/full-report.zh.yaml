          - type: callout
            title: 私人公司披露缺口会放大其他所有风险
            body: >-
              Vuori 作为未披露财务的私人公司，意味着外界拿不到经审计财务报表、详细供应链披露、工厂审计记录或 IPO
              质量管理账。这种不透明使外部无法独立验证公司的毛利率、营运资本、库存风险或确切采购集中度。本章所有风险量化都建立在分析师估算、第三方交易数据和可比公司公开文件之上。潜在投资者在以 $5.5B
              锚定估值投入资本前，最有价值的一步就是要求提供经审计财务和详细供应链地图。
