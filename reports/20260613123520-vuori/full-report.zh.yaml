      - number: '4.5'
        title: 财务缺口和尽调阻碍
        blocks:
          - type: paragraph
            body: >
              Vuori 的未上市状态在所有关键财务维度都造成重大尽调限制。公司没有发布经审计损益表、资产负债表或现金流量表。收入数字（$1B 估计、$288M
              电商）来自第三方追踪机构的分析师估计，并非管理层披露或经审计数字。毛利率、运营利润率和净利率未获确认；毛利率估计区间为 40–50%，但置信度低。CAC、回本周期和客户终身价值未披露；4:1 的 LTV:CAC
              比率来自二级营销行业出版物，而非公司。门店层面经济性（单店收入、四壁 EBITDA）未披露。批发利润率贡献和单销售点盈利能力也未知。

              $825M 融资轮的老股结构意味着公司没有公开备考资本结构、估值方法或财务预测。$5.5B 估值按估计收入隐含约 5–6x 收入倍数，但在收入未确认前，这一判断仍属推测。在 S-1
              或同等监管文件公开前，无法基于财务基本面承销这家公司。客户集中度数据（批发销售点集中度、单一客户依赖）、地理收入拆分和国际单位经济也未披露。

              消费者评价数据暴露运营隐忧：ComplaintsBoard 记录的 7 起投诉解决率为
              0%，常见主题包括质量控制失效（起球、褪色、缝线缺陷）、尺码不一致和客服响应差。若这些运营信号反映规模化后的系统性问题，退货、重新履约成本和保修费用可能压低毛利率。关税敞口也是重大风险：Vuori
              主要从越南和中国采购，美国服装进口关税日程升级可能显著推高 COGS。
