        title: 图表
        blocks:
          - type: callout
            title: 迫近的二元风险：USTR Section 301 关税决定
            body: >-
              USTR 拟对越南和中国服装征收 12.5% Section 301 关税（公众意见截止 2026 年 7 月 6 日），这是 Vuori 盈利能力和 IPO 时间表最具时效性的单一风险。以 Vuori 估算
              $1B 收入规模看，越南服装若叠加后实际关税达到 22–32%，就需要零售价上调 5–15%、毛利率稀释 3–8 个百分点，或显著改变采购地区——这些都会在 IPO 前制造执行复杂度。Lululemon 披露的
              2026 年 $380M 关税逆风提供了按比例参照。该触发因素应作为 IPO 时点和定价决策的门槛事件来监测。
