              Trustpilot 2.2/5 的「差」评分和 2025–2026 年 BBB 投诉呈现出一致模式：面料质量下降（起球、褪色、来自柬埔寨的新材料）、尺码不一致，以及客服不响应。当 Vuori 扩至 100+
              家门店和 30 个国家，并引入新的工厂关系时，质量漂移风险会上升。全球订单只由单一加州配送中心处理，也进一步放大了国际买家的客户体验问题。
