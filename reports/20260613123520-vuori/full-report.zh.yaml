        - IPO 或 IPO 后首个报告季度 EBITDA 为负
        - 摧毁核心投资逻辑差异点（盈利性增长）；从倍数定价转向 DCF 重新定价
        - S-1 文件、IPO 后业绩报告
        - 立即退出；私募市场定价一直假设公司保持盈利
      - - IPO 定价低于 $4B
        - S-1 提交的初始价格区间隐含估值低于 $4B
        - Down-round 信号；早期老股投资人抛售，动能断裂
        - SEC EDGAR S-1 文件
        - 不参与 IPO；若 IPO 后估值稳定，再重新评估
      - - 产品质量监管行动或召回
        - 任何 CPSC 召回、消费者安全申报，或针对面料材料的 FDA / 监管行动
        - 直接伤害品牌；增加供应链重组成本；被媒体放大
        - CPSC 公开召回、FTC/CPSC 执法数据库
        - 重新评估严重程度；轻微问题：持有；系统性问题：退出
      - - 关键领导人离任
        - CEO Joe Kudla 或 COO 离任且没有明确继任者
        - 创始人依赖型品牌可能失去核心身份和执行纪律
        - 公司新闻稿、IPO 后 SEC 8-K、LinkedIn 监控
        - 重大红旗；暂停新增投资；行动前监控 60–90 天
    notes: 触发项是基于前文风险分析和可比公司失败模式设定的监控启发式。阈值仅作示意，应在 S-1 披露实际财务后校准。
