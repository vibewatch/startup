      - number: '8.4'
        title: 牛、基准与熊情景分析
        blocks:
          - type: paragraph
            body: >-
              对考虑按 $5.5B 最后二级价格入场、或在 2026 年末预期 IPO 中建仓的投资者而言，三种情景决定回报画像。由于缺少披露财务，所有情景都是假设；假设基础来自公开可比公司、已观察增长率和管理层评论。

              牛市情景下，Vuori 在 IPO 时收入达到约 $1.5B，EBITDA margin 超过 15%，投资者情绪把公司对标 ONON 的 3.0x 高端增长倍数，IPO 定价高于
              $5.5B。该情景假设公司继续保持 20%+ 增长，亚洲和欧洲国际扩张成功，且没有重大质量或品牌稀释事件。按 $5.5B 二级价格进入的回报会落在 20–60%+ 区间，取决于 IPO 定价和流通股结构。

              基准情景假设 IPO 时收入约 $800M–$1B，盈利能力维持，但由于消费品牌倍数环境压缩，公开市场重新定价到 5–6x EV/revenue。若以 $1B 收入、5.5x 计算，隐含 IPO 估值为
              $5.5B——与上一轮持平。投资者只能从 IPO 流通股结构本身获得温和上行；以 $5.5B 入场的二级持有人在考虑资金时间价值前，实际回报为零。

              熊市情景下，收入增长降至 15% 以下，质量投诉升级并压低复购率，或宏观环境关闭 IPO 窗口。若按 $700M 收入向 LULU 的 1.28x 倍数重估，公开市场估值将约为 $900M——较上次二级价格回撤
              84%。考虑到 Vuori 已建立盈利能力，该情景概率较低，但在 2025–2026 年 discretionary consumer 倍数快速压缩的背景下，并非可以忽略。
