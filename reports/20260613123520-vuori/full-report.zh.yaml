      - number: '8.5'
        title: 退出准备度、thesis-break 触发器与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              Vuori 的主要退出路径是 IPO，且 2021 年和 2024 年要约轮已经建立了二级流动性。多名接近公司的消息人士表示，公司正在筹划 2026 年 IPO，但截至 2026 年 6 月 13 日，尚未向
              SEC 提交 S-1 招股书。关键 IPO 准备里程碑大多已经达成：全球 100 家门店目标在 2025 年 8 月提前完成；国际扩张已启动，在 Seoul、Beijing、London 和 Shanghai
              开店，并在 18+ 个国家开展电商；公司还补充了高管，包括来自 Fabletics 的 global president Ashley Kechter。

              IPO 前的核心监测点是规模化下的品牌完整性。2026 年 Trustpilot 给 Vuori 评为「Poor」，评分 2.2/5，有记录的投诉包括面料质量变化（来自 Cambodia
              的新采购）、新服装化学气味，以及糟糕的国际客户服务。CNBC 报道同样提到消费者担心 IPO 后能否维持质量。Vuori 的 SWOT
              评估承认，相比全球竞争对手，其供应链和物流仍不成熟。这些因素尚未构成投资逻辑击穿，但已经确立了每次更新都应跟踪的监测项目。

              投资者入场前应要求以下材料：至少 FY2024–2025 的经审计收入和 EBITDA margin，按渠道拆分的毛利率轨迹（DTC vs wholesale），net promoter score
              和客户复购率趋势，国际门店层面的单位经济性，以及包含优先权 waterfall 和 2021、2024 年二级要约交易中任何反稀释条款的详细股权结构表。
            claimRefs:
