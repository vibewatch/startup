      - CV013
      - CV014
      - CV018
      - CV020
      - CV021
  - id: FV003
    title: Vuori 隐含估值区间：IPO 乐观 / 基准 / 悲观情景
    type: range
    layout: standard
    summary: 基于收入估计和假设 EV/收入倍数，给出三种情景下的隐含 IPO 估值区间。
    data:
      items:
        - label: 悲观情景（收入 $500–700M，1.3–3x）
          low: 650
          high: 2100
        - label: 基准情景（收入 $800M–$1B，5–6x）
          low: 4500
          high: 6500
        - label: 乐观情景（收入 $1.5B+，4.5–6x）
          low: 6750
          high: 9000
    approximationNotes: 所有数字均为假设情景估计。收入区间来自分析师估计（CNBC）和 ECDB 电商代理指标。倍数假设基于 2026 年 6 月上市可比公司分析。上一轮 $5.5B 老股交易价格标注在基准情景区间内。
    claimRefs:
      - CV008
      - CV013
      - CV027
      - CV019
  - id: FV004
    title: 投资委员会 KPI 评分卡
    type: kpi
    layout: standard
    summary: 基于 2026 年 6 月证据，用 0–10 分量表对 Vuori 的八个投资维度打分，可直接供 IC 使用。
    data:
      items:
        - label: 市场机会
          value: 8
        - label: 产品差异化
          value: 8
        - label: 财务证明（盈利能力）
          value: 7
        - label: 竞争护城河
          value: 6
        - label: IPO / 退出准备度
          value: 5
        - label: 估值吸引力
          value: 3
        - label: 证据质量（私营公司）
          value: 4
        - label: $5.5B 估值下的风险调整后回报
          value: 4
    approximationNotes: 评分为作者基于截至 2026 年 6 月 13 日可得证据作出的评估。相对上市同行，Vuori 倍数偏高，因此估值吸引力较低（3/10）。由于私营公司不披露信息，证据质量较低（4/10）。
    claimRefs:
      - CV005
      - CV013
      - CV022
      - CV029
      - CV031
      - CV036
