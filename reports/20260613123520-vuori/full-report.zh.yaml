              Earnest Analytics 数据显示，52% 的 Vuori 买家也在 Lululemon 购买——这是与任何竞争对手的最高重叠。这意味着 Vuori
              大多数客户尚未把它作为唯一运动休闲品牌。短期钱包份额趋势有利于 Vuori，但 Lululemon 的产品或定价响应可能逆转这些收益。TD Cowen Google 搜索比率（11.7x →
              10x）确认了动能，但也说明不对称性：即便在动能峰值，Lululemon 的自然搜索兴趣仍约为 Vuori 的 10x。
