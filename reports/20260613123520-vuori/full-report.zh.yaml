      - number: '8.3'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月 12 日，高端运动服和运动服饰上市同业的 EV/revenue 倍数跨度很大，构成 Vuori 估值的分析锚。Lululemon 是最直接的高端休闲运动可比公司，在 CEO
              离任和美洲增长停滞后，市值较 2023 年高点蒸发近 70%，目前约为 1.28x EV/LTM revenue（EV 约 $14.1B，收入 $11B）。On Holding（ONON）同比增长
              23%+，毛利率 62%、EBITDA margin 19%，EV/revenue 约 3.0x——反映投资者愿意为高端运动细分市场中真实、盈利的增长支付溢价。Nike 约为 1.52x
              EV/revenue，Under Armour 仅 0.84x，分别反映各自规模和执行画像。

              在这一背景下，Vuori 以 $600M–$1B 估算收入支撑 $5.5B 估值，隐含 EV/revenue 约 5.5–9.2x——比上市可比区间顶部高出 1.8x 至
              7x。私人市场溢价来自更高增长率、pre-IPO 资产的稀缺性，以及投资者相信公司能走向 Lululemon 级别规模。在私人市场，Alo Yoga 因创始人 100% 持股且 2010
              年以来没有外部估值事件，隐含倍数同样很高，但没有可靠披露财务。

              只有当 Vuori 能维持 20%+ 收入增长、在 3–4 年内达到 $1.5B+ 收入且守住 EBITDA margin 时，以 $5.5B 上轮价格进入才站得住脚。若倍数向 ONON 的 3.0x 压缩，在
              $1B 收入上对应公开市场估值约 $3B——较上次二级价格回撤 45%。投资者应把入场纪律锚定在具体收入里程碑上，而不是默认私人估值就是底。
