      - number: '1.5'
        title: 商业模式与竞争位置
        blocks:
          - type: paragraph
            body: >-
              Vuori 的全渠道模式由三条渠道支撑：自有 DTC 电商平台（vuoriclothing.com）、持续增长的自营零售门店网络（截至 2026 年 4 月约 100 家），以及通过
              REI、Nordstrom、Equinox、Selfridges 和 Barry's Bootcamp 等高端伙伴做战略批发。 这套多渠道策略不同于纯 DTC
              同行：批发不用只依赖付费数字营销，也能带来品牌认知和获客；自营零售则创造了差异化的线下品牌体验。

              Joe Kudla 早期最关键的决定，是为男性设计——Kudla 观察到，相比女性主导的运动服饰市场，男性这一细分供给不足——并用多场景面料和极简设计， 让服装既能支持运动表现，又适合日常生活。Vuori
              的供应链模式把工厂伙伴当作投资人，争取有利账期，使库存可以先收、先卖、后付款， 实质上用自身周转为早期增长融资。这种纪律让公司在几乎没有机构资本的情况下于 2017 年盈利。

              Vuori 正在从品类领导者 Lululemon 手中拿份额。分析公司 GlobalData 发现，Lululemon 客户在 Vuori 的消费占比从 2018 年的 1.2% 升至 2024 年末的
              7.8%。Telsey Advisory Group 研究显示，超过一半 Vuori 客户也在 Lululemon 购物，12% 也在 Alo Yoga 购物，说明更多是品类重叠，而非完全替代。Jefferies
              分析师 Randy Konik 公开把 Lululemon 美洲可比销售持平归因于 Vuori 和 Alo Yoga 抢占市场份额。
