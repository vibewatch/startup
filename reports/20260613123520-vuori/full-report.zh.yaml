      - number: '7.3'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Vuori 的业务模型埋下了几类高度集中的依赖风险；公司越接近公开上市，这些风险越尖锐。供给端，服装制造主要分布在越南和中国的合作工厂，专有面料（DreamKnit™ 和 BlissBlend™）来自未披露的
              Tier 1 供应商，外界不知道具体身份。如果关键面料供应商退出合作，或主要工厂遭遇劳工中断、火灾、监管扣押，Vuori 已披露的快速替代能力有限。2026 年 7 月 24 日 Section 122
              关税日落又加了一个变量：越南基础税率可能进一步下降（利好采购经济性），也可能被新的 Section 301 关税压窄成本差。

              分销端，Vuori 批发渠道约贡献估算收入的 30–35%，覆盖约 1,800 个门店，包括 REI、Nordstrom、Selfridges、Harrods、Equinox Gyms 和 Barry's
              Bootcamp。超过 50% 的 Vuori 客户也在 Lululemon 消费，说明高端专业零售渠道和现有品牌生态彼此强化，但也相互依赖：如果 Lululemon
              加大促销来守住份额，共享批发渠道可能承受毛利压力，并间接压低 Vuori 的批发定价。通过 Meta 和 Google 广告平台做数字获客的集中度尚未量化，但很可能重要；任何平台政策变化、ROAS
              崩塌，或广告政策执法限制运动服 DTC 广告，都会拖累 Vuori 的漏斗顶端。

              资本端，SoftBank Vision Fund 2（2021 年，$400M）、General Atlantic 和 Stripes（2024 年，$825M 二级交易）是三家主要机构投资者。2024
              年融资结构是二级要约，意味着没有新的运营资金进入 Vuori 资产负债表。公司虽已运营盈利，但 IPO 前若与机构投资者出现战略分歧，或基金赎回事件要求提前流动性，Vuori 的战略弹性可能被压缩。
