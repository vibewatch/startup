      - number: '2.2'
        title: 市场规模：TAM、SAM 和 SOM
        blocks:
          - type: paragraph
            body: >-
              分析师对全球运动服饰 TAM 的估计差异很大——Fortune Business Insights 给出的 2026 年数字是 $373.1B，Mordor Intelligence 估计为
              $487.9B，二者相差超过 $100B，原因是定义不同（是否纳入鞋履、装备和大众基础款）。主要预测机构的共识区间显示， 2026 年全球运动服饰为 $373–$488B，全球运动休闲（相关生活方式子类）为
              $402–$460B。The Business Research Company 估计 2025 年全球运动服饰市场为 $431.1B，与这些预测一致。MarketDataForecast 估计 2026
              年美国运动服饰市场为 $23.4B，年增速约 4.82%。美国运动休闲子市场增长更快：SourceReady 估计美国运动休闲到 2033 年的 CAGR 为 9.1%。
              高端和奢侈运动服饰规模更小，但增长更快：The Business Research Company 估计 2026 年全球奢侈运动服饰细分为 $7.25B、CAGR 为 7.2%；Mordor
              Intelligence 则将高端细分 CAGR 定为 7.53%，高于整体运动服饰的 5.99%， 证实高端端口跑赢大众市场。就 Vuori 而言，可服务市场（SAM）是通过 DTC
              和高端批发渠道分销的美国及国际高端生活方式运动服饰； 我们用美国市场自下而上规模加国际增长溢价估计，2026 年全球约 $8–15B。这是三角测算，不是披露数字。Vuori 的 SOM 受当前门店网络 （接近
              100 家美国门店）、电商覆盖和批发分销约束；保守看，Vuori 当前收入运行率意味着其只占美国高端 SAM 的低个位数百分比。
