      - number: '4.3'
        title: 成本结构和单位经济
        blocks:
          - type: paragraph
            body: >
              Vuori 不拥有制造设施；所有生产都由合作工厂执行，主要位于越南、中国和美国，也有部分中美洲产能。截至 2024 年，约 56% 的总面料支出投向 Vuori「Preferred
              Fibers」——质量更高、更可持续的材料，包括自研 DreamKnit™ 和 BlissBlend™ 混纺。高端自研面料是销货成本（COGS）的主要驱动因素，这与 Vuori
              的品牌定位一致，也符合行业惯例：面料通常占成衣成本的 50–70%。

              服装、鞋履与配饰行业截至 2026 年 Q1 的过去 12 个月基准毛利率为 50.02%（CSIMarket）。Vuori 尚未公开披露毛利率；分析师对高端 SKU 的估计为
              40–45%，低于行业平均，可能反映自研面料成本更高，以及自营零售门店建设更重资本。管理层确认公司自 2017 年以来 EBITDA 和净利润均为正，Norwest 管理合伙人 Jon Kossow
              形容其为「以老派方式盈利——没有财务工程」。激进零售扩张（100+ 门店及建设资本需求）、营销投入（2024 年 Super Bowl、新聘 CMO）以及向欧洲和亚洲扩张，都推高了运营费用。

              ClickZ 2025 年报道称，Vuori 的 LTV:CAC 比率据称约为 4:1，高于 DTC 品牌通常认为健康的 3:1，意味着相对客户终身价值，获客效率较高。Joe Kudla 明确表示
              Vuori「从未亏本获客」；公司在没有机构资本的情况下于 2017 年实现盈利，也印证了这一点。根据行业数据，2026 年高端服装 DTC 品牌 CAC 基准为 $35–$65；Vuori 实际 CAC
              未披露。早期供应商账期安排——Vuori 先拿到库存、卖出、回款，再向供应商付款——让公司在没有外部融资时也能保持早期资本效率。
