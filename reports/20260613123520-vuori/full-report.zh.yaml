      - number: '1.3'
        title: 融资历史与投资人画像
        blocks:
          - type: paragraph
            body: >-
              在同等规模的 DTC 品牌中，Vuori 的资本形成路径并不常见。Joe Kudla 靠供应商融资式营运资本模型把公司做起来——他把工厂伙伴当作事实上的投资人， 争取有利账期，先收货，再通过批发或 DTC
              渠道卖出，最后付款给供应商。据报道，公司在基础年份只把约 $2.5M 放进资产负债表， 却通过 2024 年老股交易向股东返还约 $1.2B。

              第一笔机构融资发生在 2019 年 8 月，Norwest Venture Partners 以 $45M 投入少数股成长股权；Norwest 管理合伙人 Jon Kossow 加入董事会。Vuori
              当时已经盈利。2021 年 10 月，SoftBank Vision Fund 2 以约 $4B 估值投资 $400M，这是第二笔机构投资，用于支持国际扩张计划和多年美国零售铺店。

              2024 年 11 月，Vuori 完成由 General Atlantic 和 Stripes 领投、另有一批投资人参与的 $825M 投资。关键在于，
              这笔交易设计为老股要约：早期员工和投资人在内的现有股东把股份卖给新投资人。没有资金进入 Vuori 的资产负债表。交易给 Vuori 的估值为 $5.5B。General Atlantic 董事总经理
              Andrew Ferrer 加入 Vuori 董事会。现有投资人 SoftBank、 Norwest 和 ABP Capital 与新领投方一起参与。

              按 2024 年 $5.5B 估值，Vuori 已是全球最有价值的私营服装品牌之一。多个分析来源估计其 2025 年收入在 $400–$637M 区间（公司未确认），对应估值约为估计收入的 8–14 倍。公司自
              2017 年起盈利。
