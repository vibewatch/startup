    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与创立
        blocks:
          - type: paragraph
            body: >-
              Vuori 是一家美国高端性能服饰和运动休闲品牌，总部位于加利福尼亚州圣迭戈县 Carlsbad，旗舰店和创立根基则在附近的 Encinitas。Joe Kudla 自 2014 年开始打磨概念，并在 2015
              年正式推出公司。品牌名「Vuori」在芬兰语中意为「山」， 呼应 Kudla 对登山的热爱和品牌的向上使命。Vuori 的核心理念「Built to Move In. Styled for
              Life.」概括了其定位： 性能服饰既能支撑运动，也能自然切换到日常生活。

              品牌灵感来自加州海岸的活跃生活方式，把健身、瑜伽、冲浪和生活元素融在一起。Vuori 起步时是一个面向男性的 DTC 运动服饰生意，首个系列包括男士运动短裤和服装，早期产品由 Kudla 在 Encinitas
              的车库里开发。2015 年，公司还在 Encinitas 市中心开过快闪店，先搭建社区，再于 2016 年春在 Encinitas 开出第一家永久零售店。Vuori 的指导原则 「Make Great
              Products, Be in Great Relationships, and Live Extraordinary Lives」凸显了其价值观驱动的经营方式。

              Vuori 是私营公司，不披露详细财务。外部信息主要来自新闻稿、记者采访和投资人表述。多数财务指标只能归为私营未披露。
