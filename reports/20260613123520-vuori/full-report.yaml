      - number: '8.4'
        title: Bull, Base, and Bear Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              Three scenarios shape the return profile for investors considering a position at the $5.5B last secondary
              price or at an anticipated IPO in late 2026. All scenarios are hypothetical given the absence of disclosed
              financials; assumptions are grounded in public comps, observed growth rates, and management commentary.

              In the bull case, Vuori reaches approximately $1.5B in revenue at IPO with 15%+ EBITDA margins, investor
              sentiment benchmarks the company to ONON's 3.0x premium growth multiple, and the IPO prices above $5.5B.
              This scenario assumes continued 20%+ growth, successful international rollout in Asia and Europe, and no
              material quality or brand-dilution events. Return from the $5.5B secondary price would be in the range of
              20–60%+ depending on the IPO price and float structure.

              The base case assumes revenue of approximately $800M–$1B at IPO, profitability maintained, but a public
              market repricing toward 5–6x EV/revenue due to the compressed multiple environment for consumer brands. At
              5.5x on $1B revenue, the implied IPO valuation would be $5.5B — flat to last round. Investors would
              receive modest upside from the IPO float structure alone, but secondary holders entering at $5.5B would
              effectively earn zero return before considering time value of capital.

              In the bear case, revenue growth decelerates below 15%, quality complaints escalate to reduce repeat
              purchase rates, or the IPO window closes due to macro conditions. Any repricing toward LULU's 1.28x
              multiple on $700M revenue would imply a $900M public valuation — an 84% drawdown from last secondary
              price. This scenario is low probability given Vuori's established profitability, but it is not negligible
              given the pace of multiple compression across consumer discretionary in 2025–2026.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV013
              - CV019
              - CV027
              - CV028
              - CV041
