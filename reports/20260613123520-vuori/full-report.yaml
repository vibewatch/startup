              The rise in Vuori shoppers' wallet-share—from 21.6% to 27.4% of active and athleisure spend—combined with
              a 17% reduction in Nike DTC purchases by overlapping buyers suggests that Vuori is beginning to displace,
              not merely coexist with, existing brand relationships. This is the earliest signal of the loyalty premium
