      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Large and Fast-Growing Market with Premium Tailwinds
            body: >-
              Even at the conservative end of forecaster ranges, the global athleisure/premium activewear market is a
              $400B+ category growing at 7–9% annually — well above GDP growth and driven by structural lifestyle shifts
              that are secular, not cyclical. Premium activewear specifically outgrows the mass market at ~7.5% CAGR
              (Mordor), and the US athleisure sub-market is tracking at 9.1% (SourceReady). Vuori's positioning at the
              premium-lifestyle intersection places it squarely in the fastest-growing slice of a very large market.
