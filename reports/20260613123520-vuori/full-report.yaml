      - number: '4.5'
        title: Financial Gaps and Diligence Blockers
        blocks:
          - type: paragraph
            body: >
              Vuori's private status creates material diligence limitations across every key financial dimension. No
              audited income statement, balance sheet, or cash flow statement has been published. Revenue figures ($1B
              estimate, $288M e-commerce) are analyst estimates from third-party trackers—not management-disclosed or
              audited figures. Gross margin, operating margin, and net margin are unconfirmed; estimates range from
              40–50% gross margin but carry low confidence. CAC, payback period, and customer lifetime value are not
              disclosed; the 4:1 LTV:CAC ratio is from a secondary marketing-trade publication, not the company.
              Store-level economics (revenue per store, four-wall EBITDA) are not disclosed. Wholesale margin
              contribution and door-level profitability are unknown.

              The $825M round's secondary structure means no pro forma capitalization, valuation methodology, or
              financial projections were made public. The $5.5B valuation implies a revenue multiple of approximately
              5–6x on estimated revenues, but this is speculative absent confirmed revenue. Until an S-1 or equivalent
              filing is made public, underwriting this business on financial fundamentals is not possible. Customer
              concentration data (wholesale door concentration, single-customer dependency), geographic revenue split,
              and international unit economics are also undisclosed.

              Consumer review data surfaces operational concerns: ComplaintsBoard recorded a 0% complaint resolution
              rate for 7 filed complaints, with common themes including quality control failures (pilling, fading,
              stitching defects), inconsistent sizing, and poor customer service responsiveness. These operational
              signals—if they reflect systemic issues at scale—could pressure gross margins through returns,
              re-fulfillment costs, and warranty expenses. Tariff exposure is a material risk: Vuori sources primarily
              from Vietnam and China, and escalating U.S. tariff schedules on apparel imports could increase COGS
              meaningfully.
