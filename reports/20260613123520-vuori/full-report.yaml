chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Founding
        blocks:
          - type: paragraph
            body: >-
              Vuori is an American premium performance apparel and athleisure brand headquartered in Carlsbad,
              California, San Diego County, with its flagship store and founding roots in nearby Encinitas, California.
              The company was formally launched in 2015 by Joe Kudla, who had been developing the concept since 2014.
              The brand name "Vuori" is Finnish for "mountain," reflecting Kudla's passion for mountain climbing and the
              brand's aspirational mission. Vuori's core philosophy—"Built to Move In. Styled for Life."—captures its
              positioning as performance apparel that transitions seamlessly from athletic activity to everyday life.

              The brand is inspired by the active Coastal California lifestyle, integrating influences from fitness,
              yoga, surf, and life. Vuori began as a direct-to-consumer men's activewear business, launching its first
              collection of men's athletic shorts and apparel with early products developed from Kudla's garage in
              Encinitas. The company also operated a pop-up in downtown Encinitas during 2015 to build community before
              opening its first permanent retail store in Encinitas in spring 2016. Vuori's guiding principles—"Make
              Great Products, Be in Great Relationships, and Live Extraordinary Lives"—underscore its values-based
              approach to business.

              Vuori is a private company and does not publish detailed financial disclosures. Its disclosures come
              primarily via press releases, journalist access, and investor statements. The company is classified as
              private-undisclosed for most financial metrics.
