      - number: '1.2'
        title: Founder and Leadership
        blocks:
          - type: paragraph
            body: >-
              Joe Kudla, Vuori's founder and CEO, brings an unconventional background spanning accounting, fashion
              modeling, and serial entrepreneurship. After studying accounting at the University of San Diego, Kudla
              began his career as a Senior Auditor at Ernst & Young, acquiring the financial discipline that would later
              shape Vuori's working capital model. He subsequently worked as a model in Europe—including Milan and
              Barcelona—for approximately two years, gaining exposure to the apparel industry. Kudla then returned to
              accounting, eventually becoming a partner at Vaco, an accounting and IT consulting firm.

              Vuori was Kudla's third startup attempt. He operated the business from his garage without a salary for two
              years and raised only approximately $2.6 million from friends and family before achieving profitability.
              Kudla retains majority ownership of Vuori as of the 2024 secondary transaction, maintaining founder
              control despite significant institutional capital.

              Vuori's C-suite team includes Ashley Kechter as President, Desiree Swanson as CFO, Karen Riley-Grant as
              CMO, and David Sosnowski as Chief Digital Officer. In April 2023, Vuori announced four C-suite hires: Hugh
              Garrity (COO, former Yeti Head of Global Operations), Libby Stockstill (General Counsel, former Vans
              Global General Counsel), Jennifer Frisch (Chief People Officer, former Starbucks SVP Partner Resources),
              and Bryan Muehlberger (CIO, former Beachbody CIO). In April 2026, Vuori created a new Chief Product
              Officer role and appointed Heather Archibald, formerly Chief Product and Merchandising Officer at Rothy's,
              to lead end-to-end product strategy from design through sourcing. The board includes Joe Kudla, Jon Kossow
              (Norwest), Nagraj Kashyap (SoftBank), and Andrew Ferrer (General Atlantic, joined 2024).
