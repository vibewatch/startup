      - number: '5.4'
        title: Digital Commerce & Omnichannel Technology
        blocks:
          - type: paragraph
            body: >-
              Vuori's e-commerce architecture is built on a headless Shopify implementation: Shopify provides the
              transactional backend (inventory, checkout, POS, order management) while a custom frontend decoupled from
              Shopify's native theme layer delivers the brand experience. In July 2023, Vuori contracted Anatta as its
              Technical Architect partner to accelerate development velocity, improve QA, and implement major Shopify
              initiatives including Checkout Extensibility and the Exchanges API integration. Anatta is also developing
              custom middleware to streamline Vuori's ERP integration with Shopify for better inventory synchronization
              and order management.

              The full martech and CX stack published by Commerce Caffeine includes: Shogun (landing-page builder),
              Klaviyo (email and SMS marketing automation), Yotpo (reviews and loyalty/referrals), Rise.ai (loyalty
              rewards and gift cards), Lucky Orange (heatmaps and session recordings), Attentive (mobile SMS
              personalization), Foursixty (Instagram UGC and shoppable social), Tatari (TV and streaming ad analytics),
              Narvar (post-purchase shipping notifications and returns), and Afterpay (BNPL integration at checkout).

              Brian Fortier, Vuori's Director of Retail Technology Solutions, has publicly articulated an omnichannel
              strategy that has shifted from reactive (save-the-sale) to proactive: using customer data across social,
              e-commerce, and brick-and-mortar channels to anticipate needs and personalize the shopping journey. The
              "shared cart" concept—where a product added via a social platform is recognized in-store or on the
              website—is cited as a near-term integration goal. Platforms like Salesforce Commerce Cloud and Shopify are
              described as silo-breaking infrastructure, but Fortier emphasizes that strategic leverage of the data is
              the actual differentiator.

              On the international digital side, Vuori expanded e-commerce to 11 additional countries in mid-2025
              (Sweden, Norway, Denmark, Finland, Switzerland, Spain, Italy, Belgium, Austria, Portugal, and Japan),
              alongside localized pricing and payment options. AI-driven tools including product sequencing,
              attribute-based recommendations, and intent-based search are deployed through Smart Merchandiser to
              support cross-sell, upsell, and out-of-stock substitution workflows.
            claimRefs:
              - CE026
              - CE027
              - CE028
              - CE029
              - CE030
      - number: '5.5'
        title: Roadmap & Product Launches
        blocks:
          - type: paragraph
            body: >-
              Vuori has executed an accelerated product and channel launch cadence over 2025–2026, reflecting the
              capital deployed from the $825M secondary tender closed in November 2024.

              In November 2025 Vuori launched its first ski and snow apparel line—the Taika Snow Shell collection for
              men and women—produced from 100% recycled NetPlus 4-layer fabric rated to 30K waterproofing with PFC-free
              DWR coating. The collection targets resort and backcountry skiers and features technical details including
              RECCO avalanche reflectors, AquaGuard zipper vents, and integrated powder skirts. SVP Design Sarah Carlson
              described this as "the foundation" with additional alpine layers, expanded silhouettes, and new technical
              fabrics in development.

              In March 2026 Vuori debuted its first women's denim capsule—a vintage wide-leg jean ($198) and an
              oversized denim jacket ($188) in bone and light indigo washes—blending custom premium denim with Tencel
              lyocell for stretch and softness. A men's denim line had been introduced previously; initial men's denim
              reviews noted fit issues ("ill-fitting and too heavy"), which Vuori addressed in the women's version with
              additional washing and hand-finishing.

              The Spring 2026 "For Kaia" campaign deepened the Kaia Gerber collaboration (initiated Fall 2025 with
              "Vuori by Kaia"), featuring the BlissBlend AllTheForm and Sunday Track collections. In April 2026 Vuori
              signed Tom Holland as a creative, strategic, and financial partner—the first male celebrity
              partner—reinforcing the brand's expansion into menswear lifestyle positioning.

              On the retail/infrastructure roadmap, Vuori plans approximately 25 additional locations by year-end 2026,
              including 15 international stores in the UK, China (Beijing in October 2025), South Korea (Seoul in
              September 2025 via franchise), Japan, and the Middle East. The 100-store global milestone was reached in
              late 2025.

              The appointment of Heather Archibald as Chief Product Officer (effective April 20, 2026) signals a
              structural investment in product organization discipline: her mandate covers design, development, raw
              material planning, merchandising, production, and sourcing strategy in a single vertically integrated
              product function.
