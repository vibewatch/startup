      - number: '4.3'
        title: Cost Structure and Unit Economics
        blocks:
          - type: paragraph
            body: >
              Vuori does not own its manufacturing facilities; all production is executed through partner factories,
              primarily in Vietnam, China, and the United States, with some Central American capacity. As of 2024,
              approximately 56% of total fabric spend is allocated to Vuori "Preferred Fibers"—higher-quality, more
              sustainable materials including the proprietary DreamKnit™ and BlissBlend™ blends. Premium proprietary
              fabrics represent the primary cost driver in COGS, consistent with Vuori's brand positioning and the
              industry standard where fabric accounts for 50–70% of garment cost.

              Industry-benchmarked gross margins for the Apparel, Footwear & Accessories sector were 50.02% on a
              trailing twelve-month basis through Q1 2026 (CSIMarket). Vuori's gross margin has not been publicly
              disclosed; analyst estimates for premium SKUs place it at 40–45%, below the sector average, likely
              reflecting higher-cost proprietary fabrics and the capital-intensity of owned-retail store build-outs.
              Management has confirmed EBITDA and net income profitability since 2017, described by Norwest Managing
              Partner Jon Kossow as "profitable the old fashioned way—no financial engineering." Operating expenses are
              elevated by aggressive retail expansion (100+ stores with build-out capital requirements), marketing
              investment (Super Bowl 2024, new CMO hire), and international expansion into Europe and Asia.

              ClickZ reported in 2025 that Vuori's LTV:CAC ratio is reportedly approximately 4:1—above the 3:1
              considered healthy for DTC brands and implying efficient customer acquisition relative to customer
              lifetime value. Joe Kudla stated explicitly that Vuori "never acquired a customer at a loss," confirmed by
              reaching profitability in 2017 without institutional capital. CAC for premium apparel DTC brands
              benchmarks at $35–$65 in 2026 per industry data; Vuori's actual CAC is not disclosed. Working capital
              terms with early suppliers—where Vuori received inventory, sold it, collected cash, then paid
              suppliers—enabled early capital efficiency without external financing.
