      - number: '1.4'
        title: Scale, Footprint, and Milestones
        blocks:
          - type: paragraph
            body: >-
              Vuori has grown from a single-product men's DTC brand in Encinitas to a global omnichannel athleisure
              company. The company launched women's apparel in 2018, expanding to what is now a 50/50 men's and women's
              product split. By 2018, the company was generating approximately $30 million in annual sales, growing at
              triple-digit rates through a combination of DTC e-commerce and wholesale partnerships with REI, Nordstrom,
              Equinox, Selfridges, and Barry's Bootcamp.

              International expansion began in March 2022 with localized e-commerce in seven markets (UK, France,
              Germany, Ireland, Netherlands, Australia, Canada), followed by the opening of the first international
              flagship store in London's Covent Garden in September 2022. As of November 2024, Vuori serves customers in
              18+ countries through retail, e-commerce, and wholesale. As of April 2026, Vuori operates approximately
              100 owned retail stores, with its most recent US opening in Aspen, Colorado in August 2025. Vuori
              anticipates adding 25 more locations in 2026, including 15 internationally.

              Employee headcount is estimated at approximately 2,600+ as of 2025, including corporate headquarters,
              retail stores, and fulfillment. Revenue is estimated in the $424–$637 million range for 2025 by analyst
              and market-tracking sources, though Vuori does not publicly confirm revenue figures. The company has been
              profitable since 2017, which distinguishes it from most DTC peers of comparable scale. Vuori launched
              proprietary fabric innovations BlissBlend™ and DreamKnit™ as part of its ongoing product differentiation
              strategy.
