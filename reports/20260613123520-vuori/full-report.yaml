            body: >
              Alo Yoga captured 7.2 percentage points of activewear foot traffic share in roughly 18 months—the fastest
              category grab in modern specialty retail per Passby data. While this came primarily at Lululemon's
              expense, Alo's luxury-lifestyle positioning is converging toward Vuori's comfort-lifestyle segment. If Alo
