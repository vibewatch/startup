  - id: FR001
    title: Vuori Risk Heatmap — Likelihood vs. Impact
    type: matrix
    layout: wide
    summary: >-
      Qualitative risk heatmap placing Vuori's major identified risks across two axes—likelihood (high / medium / low)
      and impact (low / medium / high)—to prioritize attention and mitigation investment.
    data:
      columns:
        - Impact: Low
        - Impact: Medium
        - Impact: High
      rows:
        - label: High Likelihood
          values:
            - Section 122 Tariff Sunset Jul 2026 (net positive)
            - Vietnamese Factory Capacity Constraints; CSDDD ESG Compliance Gap
            - USTR Section 301 Tariff Escalation (12.5% proposed)
        - label: Medium Likelihood
          values:
            - Wage / Hour Claims; ADA Accessibility Suit
            - CCPA / Privacy Class-Action; Brand Quality Dilution at Scale
            - Premium Athleisure Market Saturation; Retail Execution Failure
        - label: Low Likelihood
          values:
            - Counterfeit / Brand Impersonation (contained)
            - Supply Chain ESG Audit Failure; CBP Transshipment Enforcement
            - CEO Key Person Departure; IPO Failure Below $3B
    approximationNotes: >-
      All likelihood and impact ratings are qualitative author assessments based on public evidence as of June 2026. No
      quantitative probability weights have been assigned.
    claimRefs:
      - CR001
      - CR003
      - CR006
      - CR012
      - CR022
      - CR029
      - CR036
  - id: FR002
    title: Risk Transmission Map — How Top Risks Flow Into Thesis Impact
    type: dag
    layout: wide
    summary: >-
      Directed acyclic graph showing how Vuori's primary operational and regulatory risks transmit into revenue, margin,
      valuation, and strategic outcomes.
    data:
      nodes:
        - id: tariff-escalation
          label: Tariff Escalation (Section 301)
          description: Proposed 12.5% additional duty on Vietnam/China apparel; stacks on existing Section 122
        - id: cogs-increase
          label: COGS Increase
          description: Higher landed cost per unit from tariff stacking and Vietnamese factory price premiums
        - id: margin-compression
          label: Gross Margin Compression
          description: Tariff-driven COGS expansion against constrained full-price retail architecture
        - id: revenue-deceleration
          label: Revenue Growth Deceleration
          description: Volume softening post Q4 2024 peak; early 2026 post-holiday normalization
        - id: ipo-valuation-risk
          label: IPO Valuation Risk
          description: Premium multiple eroded if growth slows or margins compress before S-1 filing
        - id: brand-quality-risk
          label: Brand / Product Quality Risk
          description: Consumer concern that scaling sacrifices fabric and fit quality (NBC News, 2024)
        - id: customer-churn
          label: Customer Churn / Share Loss
          description: Wallet share shift to Alo Yoga, Fabletics, or rebound Lululemon
        - id: ceo-departure
          label: CEO / Key Person Departure
          description: Joe Kudla departure would destabilize brand narrative and investor confidence
        - id: competitive-share-loss
          label: Competitive Share Loss
          description: Athleisure market fragmentation; Alo, Fabletics gaining ground simultaneously
      edges:
        - from: tariff-escalation
          to: cogs-increase
          label: increases unit COGS
        - from: cogs-increase
          to: margin-compression
          label: compresses gross margin
        - from: margin-compression
          to: ipo-valuation-risk
          label: reduces IPO earnings multiple
        - from: revenue-deceleration
          to: ipo-valuation-risk
          label: reduces IPO revenue multiple
        - from: brand-quality-risk
          to: customer-churn
          label: drives switching behavior
        - from: customer-churn
          to: revenue-deceleration
          label: reduces top-line growth rate
        - from: ceo-departure
          to: brand-quality-risk
          label: disrupts brand identity and sourcing vision
        - from: competitive-share-loss
          to: revenue-deceleration
          label: caps wallet share growth
        - from: margin-compression
          to: revenue-deceleration
          label: forces price increases that dampen volume
    claimRefs:
      - CR006
      - CR019
      - CR020
      - CR022
      - CR025
      - CR029
      - CR036
