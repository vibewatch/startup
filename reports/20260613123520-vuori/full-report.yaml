      - number: '2.3'
        title: Buyer and User Segmentation
        blocks:
          - type: paragraph
            body: >-
              Premium activewear buyers skew toward higher-income, health-conscious, urban adults aged 25–45. Women have
              historically accounted for approximately 52–53% of US activewear market share by consumer count and total
              spend, driven by higher category engagement in yoga, pilates, and multifunctional lifestyle dressing.
              However, at least one major research firm estimates men's athletic wear commanding approximately 72.7% of
              global activewear market share by end-user value — a contradiction that reflects differing methodological
              boundaries (units/revenue mix vs. buyer count). The conflict highlights that men's and women's shares are
              often measured against different definitional universes. Millennial consumers (ages ~27–42 in 2026)
              account for approximately 38% of athleisure spending, and Gen Z (ages ~12–26) for approximately 25%, with
              both cohorts elevating sustainability and brand authenticity as purchase criteria. Vuori's differentiating
              insight is its particular appeal to male lifestyle-performance buyers, a segment historically underserved
              by female-dominant brands like Lululemon. Vuori shoppers are loyal and wallet-concentrating: they raised
              their active/athleisure share of wallet at Vuori from 21.6% to 27.4% year-over-year. In payer terms,
              purchases are almost entirely self-funded consumer discretionary spend, with a small corporate gifting
              segment; there is no third-party payer model (unlike B2B SaaS or healthcare). Budget ownership rests
              entirely with the consumer, making brand affinity, product quality, and omnichannel experience the primary
              adoption triggers. Cross-shopping is significant: 52% of Vuori shoppers also buy from Lululemon, making it
              the most-overlapping competitor in Vuori's base.
