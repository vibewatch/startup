      - number: '6.2'
        title: Adoption Trajectory and Digital Performance
        blocks:
          - type: paragraph
            body: >-
              Vuori's adoption curve has been among the steepest in the athleisure category. The brand surpassed 100
              owned global retail stores in August 2025—six months ahead of its original 2026 target—with CEO Joe Kudla
              crediting the milestone to consumer momentum and community power. At the time of reaching 100 stores,
              Vuori served customers across close to 30 countries via owned locations and a distributor network. Total
              quarterly sales volume has increased by approximately 10.71% per quarter since 2023 according to Particl's
              retail analytics, and analysts estimate Vuori generates approximately $1 billion in total annual revenue
              across all channels.

              Digital performance corroborates the trajectory. Grips Intelligence reports $326.6 million in online DTC
              revenue for 2025, with 2026 projected to grow 50%+. In April 2026, the site logged ~6.95 million sessions
              and $42.95 million in monthly online revenue, with a conversion rate of 4.0–4.5% versus a sports-industry
              average of ~2.97%. These metrics imply a structurally strong digital flywheel: high-intent traffic,
              premium pricing, and repeat purchase behavior compress customer acquisition cost and amplify lifetime
              value.

              From a market-share lens, Earnest Analytics credit-card data shows Vuori and Alo Yoga each gained
              approximately 1% athleisure market share from April 2023 to April 2024, at a time when Under Armour was
              contracting. Vuori shoppers also increased their active-and-athleisure wallet share at Vuori from 21.6% to
              27.4% year over year, suggesting deepening brand loyalty. TD Cowen flagged that Vuori was gaining
              search-share relative to Lululemon heading into back-to-school 2025, with the Lululemon-to-Vuori Google
              search ratio trending from 11.7x toward 10x. In the adjacent Piper Sandler teen survey, Vuori rose from
              24th to 15th in upper-income teen athletic apparel preferences in early 2024.
            claimRefs:
