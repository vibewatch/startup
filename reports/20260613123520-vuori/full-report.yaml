      - number: '8.5'
        title: Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Vuori's primary exit path is an IPO, with secondary liquidity having been established through the 2021 and
              2024 tender rounds. Multiple sources close to the company indicate a 2026 IPO is being planned, though no
              S-1 prospectus had been filed with the SEC as of June 13, 2026. Key IPO readiness milestones are largely
              met: the 100-store global target was achieved in August 2025 ahead of schedule, international expansion is
              underway with stores in Seoul, Beijing, London, and Shanghai and e-commerce in 18+ countries, and new
              senior leadership has been added including global president Ashley Kechter from Fabletics.

              The central monitoring concern heading into an IPO is brand integrity under scale. Trustpilot reviews in
              2026 rate Vuori "Poor" at 2.2/5, with documented complaints about fabric quality changes (new sourcing
              from Cambodia), chemical odors on new garments, and poor international customer service. CNBC's reporting
              similarly notes consumer concern about quality maintenance post-IPO. Vuori's SWOT assessment acknowledges
              supply chain and logistics immaturity relative to global competitors. These factors do not yet constitute
              a thesis break, but they establish the monitoring items that should be tracked in every refresh.

              Investors should demand the following before entering: audited revenue and EBITDA margin for at least
              FY2024–2025, gross margin trajectory by channel (DTC vs wholesale), net promoter score and customer repeat
              purchase rate trends, international store-level unit economics, and a detailed cap table including
              preference waterfall and any anti-dilution provisions from the 2021 and 2024 secondary tender
              transactions.
            claimRefs:
              - CV024
              - CV025
