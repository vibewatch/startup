          - type: callout
            title: Tariff Escalation and Supply Chain Restructuring Threaten Margins
            body: >-
              US apparel import tariffs increased significantly in 2025–2026 — nearly doubling in some Asian-sourcing
              categories — compressing gross margins industry-wide. Brands sourcing primarily from Vietnam, Bangladesh,
              or China face materially higher landed costs while the competitive market limits the ability to fully pass
              through price increases. Vuori's tariff exposure is not publicly quantified; its sourcing geography is not
              disclosed. This is a material diligence gap that could affect both growth investment capacity and margin
              profile.
