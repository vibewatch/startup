      - number: '2.4'
        title: Growth Drivers and Constraints
        blocks:
          - type: paragraph
            body: >-
              The most powerful structural growth driver for premium athleisure is the permanent normalization of hybrid
              and remote work, which has irrevocably expanded the occasion set for performance apparel beyond the gym
              into commuting, office-adjacent, and social contexts. Industry surveys find 68% of global consumers
              seeking multifunctional clothing for both fitness and daily wear. Health and wellness consciousness among
              Millennials and Gen Z sustains demand growth independent of economic cycles; growing gym membership and
              outdoor activity participation translate directly into activewear purchasing. Sustainability is now a
              baseline consumer expectation: 62% of US consumers prioritize sustainable materials, and 65% state
              willingness to pay a 10% premium for certified sustainable products. DTC and brand-owned e-commerce
              channels grow at above-market rates — Mordor Intelligence estimates online retail for activewear growing
              at 8.46% CAGR — enabling premium brands to capture full margin while gathering first-party consumer data.
              On the constraint side, US apparel import tariffs have increased significantly in 2025–2026, with average
              rates doubling in some categories, imposing higher landed costs on brands sourcing from Vietnam, China,
              and Bangladesh. Supply chain diversification toward nearshore sourcing creates bottlenecks and quality
              variability as new suppliers ramp. Market saturation is a material risk in baseline categories (leggings,
              sports bras) where entry barriers have fallen and private-label competitors proliferate. Competitive
              intensity is acute: Alo Yoga expanded from 10 to 100+ stores in roughly 18 months and captured 8.6% of
              premium category foot traffic (up from 1.4%), while even the dominant incumbent — Lululemon — announced
              150 corporate layoffs and cut profit forecasts citing changing consumer spending patterns. Consumer
              spending elasticity in discretionary categories represents a latent risk if macroeconomic conditions
              deteriorate.
