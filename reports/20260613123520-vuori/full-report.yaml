      - number: '1.3'
        title: Funding History and Investor Profile
        blocks:
          - type: paragraph
            body: >-
              Vuori's capital formation story is unusual among DTC brands of its scale. Joe Kudla bootstrapped the
              company using a supplier-financing working capital model—treating factory partners as de facto investors
              by securing favorable payment terms that allowed him to receive inventory, sell through wholesale or DTC
              channels, and then pay suppliers. The company reportedly put only approximately $2.5 million on its
              balance sheet during its foundational years while returning approximately $1.2 billion to shareholders
              through the 2024 secondary.

              The first institutional round came in August 2019, when Norwest Venture Partners made a $45 million
              minority growth equity investment; Jon Kossow, Managing Partner at Norwest, joined the board. Vuori was
              profitable at the time of this investment. In October 2021, SoftBank Vision Fund 2 invested $400 million
              at an approximately $4 billion valuation, the second institutional investment, funding international
              expansion plans and a multi-year US retail rollout.

              In November 2024, Vuori completed an $825 million investment led by General Atlantic and Stripes,
              alongside a cohort of additional investors. Critically, the transaction was structured as a secondary
              tender offer: existing shareholders—including early employees and investors—sold shares to the new
              investors. No proceeds flowed to Vuori's balance sheet. The deal valued Vuori at $5.5 billion. Andrew
              Ferrer, Managing Director at General Atlantic, joined the Vuori Board of Directors. Existing investors
              SoftBank, Norwest, and ABP Capital participated alongside the new leads.

              At its 2024 valuation of $5.5 billion, Vuori is among the most valuable private apparel brands globally.
              Revenue estimates are in the $400–$637 million range for 2025 (multiple analyst sources; unconfirmed by
              the company), implying a valuation multiple of approximately 8–14x estimated revenue. The company has been
              profitable since 2017.
