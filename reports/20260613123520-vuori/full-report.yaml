      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: TRACK — Reassess at S-1 Filing'
            body: >-
              Vuori's business quality is high — consistently profitable, growing 2–10x faster than the activewear
              market, and capturing share from Lululemon. However, the $5.5B November 2024 secondary valuation implies a
              5.5–9.2x EV/revenue multiple against estimated revenues, a material premium to every public comparable in
              June 2026. No S-1 has been filed as of this report's run date. The missing S-1 and the opacity of private
              financials preclude a buy recommendation. The investment should be tracked and upgraded to research-more
              or buy immediately upon S-1 filing if disclosed revenue confirms the $1B+ thesis and EBITDA margins exceed
              12%.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV013
              - CV014
              - CV018
              - CV027
          - type: callout
            title: 'Critical Risk: Brand Dilution at Scale'
            body: >-
              Vuori's core competitive advantage — premium fabric quality and community authenticity — is showing early
              erosion signals as the company scales. Trustpilot rated Vuori "Poor" at 2.2/5 in 2026, with documented
              complaints about fabric composition changes, chemical odors from newly sourced items, and poor customer
              service for international orders. Particl data shows Q4 2025 online sales did not match the Q4 2024
              holiday peak on a normalized basis. SWOT analysis notes supply chain immaturity relative to global peers.
              These signals do not yet constitute a thesis break, but they are the category of operational failure that
              most commonly precedes multiple compression in DTC consumer brands.
            calloutType: risk
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV041
          - type: callout
            title: 'Structural Insight: Both Vuori Rounds Are Secondary Tenders — Not Growth Capital'
            body: >-
              The $825M November 2024 round and the $400M 2021 round were both structured as secondary tender offers
              providing liquidity to existing holders. Vuori board member Jon Kossow stated explicitly that "there's no
              financial engineering here" and that the company is profitable without needing external capital. This
              structure means the $5.5B private market price was set by incoming growth investors (General Atlantic,
              Stripes) making long-dated bets on brand trajectory — not by a company raising cash against a specific
              financial plan. The implication for new investors is that the price reflects conviction, not financial
              engineering; but it also means there is no fresh capital protecting against downside from an operational
              perspective.
            calloutType: insight
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV032
              - CV033
          - type: callout
            title: 'Key Assumption: Revenue Estimate Carries Wide Uncertainty'
            body: >-
              The EV/revenue multiple analysis throughout this chapter relies on estimated Vuori revenues that range
              from $288M (ECDB e-commerce only) to $1B (analyst consensus per CNBC). The $600–700M total revenue figure
              used as the central estimate is derived by inflating the ECDB e-commerce figure for estimated DTC retail
              and wholesale channels based on disclosed channel mix commentary from management. This estimate has not
              been independently verified and could be materially incorrect in either direction. Investors should treat
              all multiple calculations as order-of-magnitude estimates until audited financials are available.
            calloutType: assumption
            claimRefs:
              - CV008
              - CV011
              - CV013
