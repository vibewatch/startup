              Lululemon's April 2026 proxy filing disclosed that founder Chip Wilson—who designed the original
              premium-activewear playbook—is advising both Alo Yoga and Vuori. This reduces any first-mover knowledge
              advantage Lululemon held and accelerates the competitive sophistication of both challengers. For Vuori, it
