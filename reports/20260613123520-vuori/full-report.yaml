      - number: '4.4'
        title: Capital Adequacy and Financing
        blocks:
          - type: paragraph
            body: >
              Vuori's November 2024 $825 million investment round was structured as a secondary tender offer led by
              General Atlantic and Stripes, joined by existing investors SoftBank Vision Fund 2, Norwest Venture
              Partners, and ABP Capital. Critically, the proceeds from this secondary tender offer did not go to Vuori's
              balance sheet—the transaction provided liquidity to early investors (angels, high-net-worth individuals)
              rather than injecting new capital into the company. Norwest Managing Partner Jon Kossow confirmed: "The
              business is operating profitably. It doesn't need funds for operating cash or for investment." This
              structure contrasts with a primary equity raise and means the company's cash position was not materially
              changed by the round. Prior to the 2024 round, total capital raised across all rounds was approximately
              $1.27 billion, including $45M from Norwest in 2019 and $400M from SoftBank Vision Fund 2 in 2021 (which
              also was largely used to repay early investors).

              Vuori's ongoing profitability at both EBITDA and net income levels implies a self-funding operating model.
              As a profitable company with no disclosed cash burn, the traditional "runway" framing does not directly
              apply—the company is generating rather than consuming operating cash. Management confirmed no need for
              operational funding for its current growth trajectory, which includes continued U.S. store openings and
              international expansion to 15 stores outside the U.S. by 2026. Planned uses of capital from any future
              financing would support international market entry, supply chain investment, and pre-IPO organizational
              build-out.

              An IPO is expected but no S-1 has been filed as of June 2026. CNBC reported in December 2024 that people
              close to the company confirmed IPO plans are underway. Bloomberg had reported in late 2023 that IPO was
              being considered for 2024, which did not materialize. The most recent SEC filing by Vuori, Inc. (CIK
              0001672741) on EDGAR is a Form D for an exempt offering dated April 27, 2016, covering an early seed/angel
              raise. No subsequent Form D or other registration statement has been filed publicly, consistent with the
              later rounds being executed through exempt structured transactions or entities that filed on investors'
              behalf.
