      - number: '6.4'
        title: Retention, Satisfaction, and Repeat Purchase Signals
        blocks:
          - type: paragraph
            body: >-
              Independent review aggregation provides mixed but net-positive retention signals. Reviews.io consolidates
              14,853 verified buyer reviews into a 4.6/5 aggregate, with 98% on-time delivery and a 4.7/5 customer
              service sub-score—above-average for direct-to-consumer apparel. Customer testimonials emphasize fabric
              distinctiveness, and several note multi-year purchase histories since before the brand became widely
              known. Vuori's own proprietary NPS is cited at approximately 70+ by multiple analyst sources, placing it
              well above the 2025 retail industry average band of 28–41 and suggesting a high share of customers who
              actively recommend the brand.

              The Earnest Analytics wallet-share analysis (April 2023–April 2024) reveals the deepest behavioral loyalty
              signal: existing Vuori shoppers redirected spending away from Nike's DTC channels (17% less year over
              year) while allocating a growing share (21.6% → 27.4%) of their total active-and-athleisure budget to
              Vuori. This pattern indicates earned loyalty rather than coincidental diversification. Vuori's "Investment
              in Happiness" free-returns guarantee lowers first-purchase risk and is cited by brand commentators as a
              conversion and repeat-purchase driver.

              The adverse side is material. Trustpilot aggregates a "Poor" 2.2/5 rating, with March 2026 reviews citing:
              automated customer-service bots that fail to resolve billing disputes, return friction where customers
              receive store credit instead of promised refunds, and international shipping failures (a UK customer
              waited 6+ weeks for an order). ComplaintsBoard records a 0% complaint resolution rate against 7 filed
              complaints. CNBC noted in December 2024 that consumer message boards are focused on whether Vuori's fabric
              quality will be maintained as the company scales toward an IPO—a perception risk with direct retention
              implications. A long-term Trustpilot reviewer from 2026 reported fabric sourcing changed to Cambodia with
              an inferior feel, suggesting supply-chain-driven quality dilution.
