      - number: '7.2'
        title: Operational and Supply Chain Risks
        blocks:
          - type: paragraph
            body: >-
              Vuori's supply chain is concentrated in Vietnam and China—the two countries identified by the USTR as
              failing to enforce forced-labor bans—creating a dual tariff and compliance risk. Although the Supreme
              Court's February 20, 2026 invalidation of the IEEPA tariffs reduced Vietnam's effective duty back to
              10–20%, the proposed new Section 301 tariff layer and an active investigation launched March 2026 covering
              16 economies including Vietnam mean the tariff environment remains highly unstable. Any increase in
              Vietnam's effective rate reduces the current 20–25 percentage-point tariff gap versus China that underpins
              Vuori's current sourcing strategy.

              Beyond tariffs, Vietnamese factory capacity is visibly tightening. The best facilities are increasingly
              fully booked as demand for China-plus-one alternatives surges; unit costs in Vietnam run 10–25% above
              comparable Chinese factories. For a brand whose COGS is dominated by premium proprietary fabrics
              (DreamKnit™, BlissBlend™), any simultaneous increase in tariff-equivalent duty and factory unit price
              creates a compounding COGS squeeze. US Customs and Border Protection is also actively auditing
              transshipment fraud—where Chinese-origin goods are relabeled as Vietnamese—exposing brands to potential
              seizure and reputational damage if sourcing oversight is inadequate.

              On labor compliance, Vuori's Vendor Code of Conduct mandates ILO core labor standards across Tier 1
              vendors, but independent assessments confirm the company lacks third-party audit verification and does not
              publish factory-level wage or working-condition data. This gap is increasingly material: the EU's
              Corporate Sustainability Due Diligence Directive (CSDDD), effective 2026, requires companies supplying to
              the EU market to provide auditable, continuously monitored supply-chain ESG data—a standard Vuori has not
              publicly demonstrated it meets. Vuori is certified Climate Neutral but nearly all of its 2024
              greenhouse-gas emissions originate from the Scope 3 supply chain, and no comprehensive circularity or
              end-of-life program has been disclosed.
