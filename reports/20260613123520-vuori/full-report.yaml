  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product & Service Definition
        blocks:
          - type: paragraph
            body: >-
              Vuori operates as a vertically managed, direct-to-consumer–first performance apparel brand that serves
              active adults seeking clothing that moves seamlessly from athletic use to everyday life. The core customer
              job is finding a single wardrobe capable of covering a morning yoga or gym session, a workday, and an
              evening social outing—without requiring a change of clothes. Vuori's tagline, "Built to Move In. Styled
              for Life.", encapsulates this positioning. The brand targets the premium segment of the athleisure market,
              competing primarily on fabric quality, silhouette versatility, and Coastal California aesthetic rather
              than on performance-technical features like Gore-Tex barriers or compression zones.

              Products are developed through an internally declared "fabric-first" philosophy: the design team begins
              with a novel material or material blend and then derives garment form from the fabric's intrinsic
              characteristics—stretch direction, opacity, texture, and moisture management. This is the inverse of the
              standard apparel process (designing silhouettes and then specifying fabric), and it has produced four
              named material platforms that Vuori treats as differentiated intellectual property. Every core garment
              line—the men's Kore Short, the Performance Jogger series, the DreamKnit hoodie family, and the women's
              Halo collection—is defined by the material platform that anchors it.

              Customers engage with Vuori products across three distribution modes: the branded direct-to-consumer
              website and mobile commerce experience, 100+ company-owned and franchised retail stores that function as
              community experiential hubs, and a curated set of wholesale partners (Nordstrom, REI, Equinox fitness
              studios, independent outdoor and run specialty retailers). The retail store experience is intentionally
              designed to let customers touch and feel the proprietary fabrics before purchase, addressing the sensory
              discovery gap inherent in online soft-goods sales.
