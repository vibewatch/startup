      - number: '1.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Profitable Since Year Two—Counter-Cyclical DTC Discipline
            body: >-
              Vuori achieved profitability in 2017 before raising any venture capital, using a supplier-financing
              working capital model that allowed inventory to be received, sold, and paid for in sequence. This fiscal
              discipline has been maintained through 100+ store openings and $5.5B in valuation—distinguishing Vuori
              from DTC peers who raised large rounds while burning cash and later faced bankruptcy or distressed M&A.
            calloutType: strength
            claimRefs:
              - CO025
              - CO026
          - type: callout
            title: Secondary Valuation at ~8–14× Estimated Revenue Demands Sustained High Growth
            body: >-
              Vuori's $5.5 billion valuation in November 2024 implies an 8–14× multiple on estimated 2025 revenue of
              $424–$637 million. The 2024 transaction was a secondary tender; no new capital went to the balance sheet.
              Sustaining this valuation requires continued double-digit revenue growth, successful international
              expansion in Europe and Asia, and maintaining premium gross margins—all while competition from Alo Yoga,
              Lululemon, and private-label imitators intensifies. Any stumble in unit economics or international
              execution could reset expectations sharply.
            calloutType: risk
            claimRefs:
              - CO018
              - CO019
              - CO036
          - type: callout
            title: Climate Neutral Certification Lapsed; ESG Credibility Gap
            body: >-
              Vuori held Climate Neutral certification for three consecutive years before the certification lapsed. The
              Good On You sustainability rating service flags limited sustainability practices: no comprehensive
              supplier transparency, reliance on carbon offsets, and no garment repair or takeback programs. As ESG
              becomes a consumer and investor expectation, the certification lapse is a credibility gap that could
              affect brand perception among the sustainability-conscious core demographic.
            calloutType: risk
            claimRefs:
