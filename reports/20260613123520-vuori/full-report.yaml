      - number: '6.3'
        title: Named Wholesale Partners, Ambassadors, and Community Proof
        blocks:
          - type: paragraph
            body: >-
              For a direct-to-consumer brand, Vuori's named wholesale proof is unusually strong. Nordstrom, REI, and
              Equinox are identified as the three largest wholesale partners; Forbes and Modern Retail reporting places
              the wholesale channel at ~25% of total revenue with approximately 1,800 doors. REI, after testing Vuori in
              a small set of stores, found "strong customer affinity" and expanded to 150+ locations—a documented
              endorsement from an influential outdoor-retail curator. UK partners Selfridges and Harrods align the brand
              with premium department-store positioning, and Barry's Bootcamp in the UK extends the fitness-studio
              channel. The Shinsegae Group in Korea serves as franchise partner for the Seoul store opened in September
              2025.

              Ambassador and community proof provides the most distinctive customer acquisition signal. Vuori's V1
              Community Program—open to certified fitness professionals, studio/gym owners, collegiate, and professional
              athletes—has grown to over 12,000 members, including 400 NIL athletes and more than 1,000 NFL draft picks.
              Named professional ambassadors include gymnast-influencer Livvy Dunne (partnership since 2021), Texas QB
              Arch Manning, actor and creative partner Tom Holland (Spring 2026), the Gerber-Crawford family (Cindy
              Crawford, Rande Gerber, Kaia Gerber, Presley Gerber as Spring 2025 partners and financial investors), and
              specialists Marcos Giron (tennis), Justin Williams (cycling), Alana Blanchard (surf), and Michelle Zhang
              (golf). CMO Karen Riley-Grant confirmed that ambassador-driven authentic demonstration of product
              performance is "an integral tool to scale globally."

              International store openings add named geographic proof: London flagship (October 2024), Shanghai
              permanent store (May 2024), Seoul (September 2025), and Beijing (October 2025). Vuori simultaneously
              launched localized e-commerce in 11 new countries (Sweden, Norway, Denmark, Finland, Switzerland, Spain,
              Italy, Belgium, Austria, Portugal, Japan) in 2025.
