      - number: '8.2'
        title: Financing and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Vuori's two major capital raises have both been structured as secondary tender offers providing liquidity
              to existing investors rather than primary equity injections for the business. In 2021, SoftBank Vision
              Fund 2 led a $400M round that valued the company at $4B — then the largest investment round for a private
              apparel brand globally. In November 2024, General Atlantic and Stripes co-led an $825M secondary tender at
              a $5.5B valuation, a 37.5% step-up over three years. Alongside new investors, SoftBank, Norwest, and ABP
              Capital remain significant investors.

              Norwest managing partner Jon Kossow, a board member who has observed the company from its $45M Series A in
              2019, stated explicitly that Vuori is "self-sustaining" and "doesn't need funds for operating cash or
              investment." The 2024 round was designed to provide liquidity for angels and early high-net-worth
              investors who backed the brand before institutional capital arrived. General Atlantic, which manages
              approximately $97B AUM, assigned managing director Andrew Ferrer to join the Vuori board. Stripes, a $6.2B
              AUM growth equity firm with prior investments in On Running and Erewhon, provided a brand-building
              partnership alongside the capital commitment.

              This structure creates a specific analytical problem. Because Vuori has raised capital to reward existing
              holders rather than to fund growth, it has never had cause to disclose financials to a new money provider
              at a standard diligence level. The $5.5B secondary market price is therefore based on investor conviction
              in the brand trajectory and comparable company analysis — not on a confirmed financial model. The
              preference and liquidation stack, cap table details, and any ratchet provisions from the secondary tender
              are not publicly known, making it impossible to compute expected returns under downside scenarios without
              further diligence.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV032
              - CV033
              - CV036
              - CV037
      - number: '8.3'
        title: Comparable Valuation Analysis
        blocks:
          - type: paragraph
            body: >-
              As of June 12, 2026, the premium activewear and athletic apparel public peer group trades at a wide range
              of EV/revenue multiples that form the analytical anchor for Vuori's valuation. Lululemon — the most direct
              premium athleisure comparable — sits at approximately 1.28x EV/LTM revenue (EV ~$14.1B, revenue $11B)
              after losing nearly 70% of its market cap from its 2023 peak amid CEO departure and Americas growth
              stagnation. On Holding (ONON), growing at 23%+ YoY with 62% gross margins and 19% EBITDA margin, commands
              approximately 3.0x EV/revenue — reflecting investor willingness to pay a premium for authentic, profitable
              growth in the premium athletic segment. Nike trades at approximately 1.52x EV/revenue and Under Armour at
              just 0.84x, reflecting their respective scale and execution profiles.

              Against this backdrop, Vuori's $5.5B valuation on an estimated revenue of $600M–$1B implies an EV/revenue
              multiple of approximately 5.5–9.2x — a 1.8x to 7x premium above the top of the public comparable range.
              The private market premium is attributable to higher growth rates, scarcity value as a pre-IPO asset, and
              investor belief in a Lululemon-scale trajectory. In private markets, Alo Yoga operates with similarly high
              implied multiples given its 100% founder ownership and no external valuation events since 2010, but no
              reliable disclosed financials exist.

              Entry at the $5.5B last-round price is justifiable only if Vuori can sustain 20%+ revenue growth and reach
              $1.5B+ in revenue within 3–4 years while maintaining EBITDA margins. Any multiple compression toward
              ONON's 3.0x on $1B revenue would imply a public market valuation of ~$3B — a 45% drawdown from the last
              secondary price. Investors should anchor entry discipline to specific revenue milestones rather than
              assuming the private valuation is a floor.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
