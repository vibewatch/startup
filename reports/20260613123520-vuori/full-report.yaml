  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              The premium athleisure category in 2026 is defined by structural market-share transfer rather than
              aggregate demand destruction. Three macro forces shape the competitive environment Vuori must navigate.
              First, the historic leader—Lululemon—is in visible retreat in its core North American market: Americas
              comparable sales fell 5–6% on a constant dollar basis in Q1 2026, full-year revenue guidance was cut to
              $11.0–$11.15 B (flat to -1%), the CEO resigned, and the brand has resorted to promotional markdowns at
              unprecedented scale. Second, Alo Yoga has executed one of the fastest specialty-retail expansions in
              modern apparel, growing from 10 U.S. locations in early 2023 to 169 stores worldwide by 2026, capturing
              roughly 7.2 percentage points of activewear category foot traffic share—largely at Lululemon's expense.
              Third, legacy volume leaders Nike and Adidas continue to dominate by global revenues ($46 B and $29 B
              respectively) but are losing "mental market share" on lifestyle occasions, creating whitespace that
              premium challengers like Vuori are systematically occupying.

              Vuori's competitive position sits at the intersection of two tiers. It competes directly with Lululemon
              and Alo Yoga on lifestyle premium positioning, and with Rhone in the men's premium performance segment. It
              faces substitution risk from Gymshark's social-media gym-wear model among younger buyers, and from Athleta
              among value-conscious women's shoppers—though Athleta is itself in turnaround with a 12% revenue decline
              in Q1 2026. Outdoor Voices, once a spiritual substitute, effectively exited via a near-bankruptcy sale in
              mid-2024 and is now an online-only remnant, reducing a credible lifestyle-casual substitute. Internal
              build (private-label from Nike or Gap) and "no-brand" commodity activewear from Lulu's markdown bin
              represent the principal status-quo substitutes.

              Morning Consult's category research confirms the fragmented mental landscape: Nike leads at 22% MMS
              nationally, but Vuori's MMS among $100 k+ households—its core demographic— is 2.1%, three times its 0.7%
              national figure, indicating strong penetration of the addressable premium audience and meaningful
              whitespace to grow beyond it.
