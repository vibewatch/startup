      - number: '7.3'
        title: Partner and Dependency Risks
        blocks:
          - type: paragraph
            body: >-
              Vuori's business model creates several high-concentration dependency risks that become more acute as the
              company scales toward a public offering. On the supply side, garment manufacturing is split primarily
              across Vietnam and China partner factories, with proprietary fabrics (DreamKnit™ and BlissBlend™) sourced
              from undisclosed Tier 1 vendors whose identities are not public. Should either a key fabric supplier exit
              the relationship or a primary factory experience a labor disruption, fire, or regulatory seizure, Vuori
              has limited disclosed capacity for rapid substitution. The Section 122 tariff sunset on July 24, 2026 adds
              another variable: Vietnam's base duty could drop further (a positive for sourcing economics) or new
              Section 301 tariffs could narrow the cost gap.

              On the distribution side, Vuori's wholesale channel accounts for approximately 30–35% of estimated revenue
              through ~1,800 doors including REI, Nordstrom, Selfridges, Harrods, Equinox Gyms, and Barry's Bootcamp.
              More than 50% of Vuori's customers also shop at Lululemon, indicating that retail relationships with
              premium specialty channels and the existing brand ecosystem are mutually reinforcing but also
              co-dependent: if Lululemon accelerates promotional activity to defend share, those shared wholesale
              channels could see margin pressure that indirectly dampens Vuori's wholesale pricing. Digital acquisition
              through Meta and Google advertising platforms represents an unquantified but likely material
              customer-acquisition concentration; any platform policy change, ROAS collapse, or ad-policy enforcement
              that restricts activewear DTC advertising would negatively impact Vuori's top-of-funnel.

              On the capital side, SoftBank Vision Fund 2 (2021, $400M), General Atlantic, and Stripes (2024, $825M
              secondary) represent the three lead institutional investors. The 2024 round was structured as a secondary
              tender offer, meaning no new operating capital entered Vuori's balance sheet. While the company is
              operationally profitable, any strategic disagreement with institutional investors ahead of an IPO—or a
              fund redemption event requiring early liquidity—could constrain Vuori's strategic flexibility.
