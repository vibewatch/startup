  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing
        blocks:
          - type: paragraph
            body: >
              Vuori's revenue model blends direct-to-consumer (DTC) and wholesale channels, with DTC accounting for more
              than half of total revenue. DTC encompasses the company's own e-commerce platform (vuoriclothing.com) and
              its growing network of branded physical retail stores, which surpassed 100 owned locations globally in
              August 2025. The brand operates across approximately 30 countries, primarily through DTC and a curated
              wholesale network of roughly 1,800 doors including REI, Nordstrom, Selfridges, Harrods, Equinox Gyms, and
              Barry's Bootcamp.

              Vuori commands premium pricing across its performance apparel assortment: shorts are priced approximately
              $68–$74, joggers $94–$118, leggings around $78–$100, and hoodies $98–$120. The brand enforces MAP (Minimum
              Advertised Price) agreements with wholesale partners to protect pricing integrity across channels. Reuters
              reported list prices of $100 for leggings and $64 for sports bras in November 2024. Full-price average per
              unit has climbed toward the low $100s range as of early 2026, per Particl's transaction analysis, while
              current selling price lags due to selective promotional windows.

              Revenue recognition is straightforward for an apparel company: DTC sales are recognized at point of
              shipment or delivery; wholesale revenue is recognized on delivery to retailer. No subscription, SaaS, or
              marketplace mechanics apply. The brand has deliberately constrained wholesale volume to prevent channel
              dilution, which maintains pricing power but limits total addressable volume through that channel. Vuori's
              first Super Bowl ad in February 2024 reflected rising marketing investment as the company prepares for a
              potential IPO, with industry sources close to the company confirming IPO plans but no S-1 having been
              filed as of June 2026.
