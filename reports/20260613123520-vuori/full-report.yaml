      - number: '4.2'
        title: Growth and Revenue Estimates
        blocks:
          - type: paragraph
            body: >
              Because Vuori is private with no public financial disclosures, all revenue and growth figures are analyst
              estimates or company-stated proxies, not audited accounts. CNBC, citing Euromonitor and Earnest Analytics
              sales estimates as of late 2024, reported that analysts estimate approximately $1 billion in annual
              revenue, with Vuori growing sales 23% year-to-date through October 2024 against a sportswear market
              growing 4.3%. In 2023, Vuori grew 44% while the broader sportswear market expanded only 2.4%.
              E-commerce-specific revenue estimates from ECDB placed vuoriclothing.com annual online sales at $288M in
              2025, with projected growth of 5–10% in 2026. These figures likely undercount total revenue by excluding
              in-store and wholesale channels, which collectively represent roughly 45–50% of total revenue based on
              channel-mix reporting.

              Earnest Analytics data from April 2024 found that Vuori and Alo Yoga each gained approximately 1% market
              share in the prior 12 months, while Vuori shoppers increased their active-and-athleisure wallet share
              spent at Vuori from 21.6% to 27.4%, indicating both new customer acquisition and deeper loyalty. A TD
              Cowen July 2025 note identified Vuori gaining share of Google searches relative to Lululemon, with the
              search ratio compressing from 11.7x to approaching 10x—a directional proxy for brand momentum.

              The holiday-quarter (Q4 2024) normalized online sales volume represented Vuori's peak in Particl's
              transaction data, with Q4 2025 remaining elevated but below that peak. Early 2026 shows post-holiday
              softening typical for premium athleisure. No management guidance, revenue outlook, or annual report has
              been publicly released.
