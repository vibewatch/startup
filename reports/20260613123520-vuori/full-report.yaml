      - number: '6.5'
        title: Expansion Dynamics and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Vuori's expansion model contains embedded concentration risks that increase as the brand
              internationalizes. US geographic concentration is acute: over 95% of web traffic originates from the
              United States, and international revenue is not separately disclosed but is estimated to represent a low
              single-digit percentage of total revenue as of 2025. The international portfolio of ~15 stores by 2026 is
              spread across London, Shanghai, Seoul, Beijing, and select European markets—meaningful in brand-building
              terms but commercially negligible relative to a 100-store US fleet.

              Within the wholesale channel (~25% of total revenue), Nordstrom and REI are the dominant anchor partners.
              While Vuori reports ~1,800 wholesale doors, the absence of per-partner revenue disclosure makes it
              impossible to verify concentration. Nordstrom and REI serve different channel demographics (premium
              department store vs. outdoor co-op), diluting some single-account dependency. However, if either anchor
              reduced orders—due to own-brand inventory pressures, market conditions, or category rationalization—Vuori
              would face a meaningful wholesale revenue shock. Equinox, Selfridges, and Harrods offer premium
              positioning but narrower distribution.

              Gender concentration is an underappreciated risk: Vuori's founding identity, strongest community, and
              historically deepest product development is in men's apparel. Women's is now 50% of the product mix but
              evidence on whether female retention and repeat-purchase rates match the established male cohort is not
              publicly available. The 52% Lululemon cross-shop among Vuori buyers signals that a large share of the
              customer base has not yet made Vuori their exclusive athleisure brand, implying fragility against a
              Lululemon recovery or aggressive pricing response.
