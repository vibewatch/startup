  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and Regulatory Risks
        blocks:
          - type: paragraph
            body: >-
              Vuori faces a growing and diversified legal risk stack in 2026. The most financially material regulatory
              threat is the USTR's June 2, 2026 determination that Vietnam and China—the two primary manufacturing bases
              for Vuori's garments—failed to enforce bans on goods produced with forced labor. USTR proposed an
              additional 12.5% Section 301 tariff on all imports from both economies; public comments close July 6,
              2026, with final implementation dates unannounced. Critically, these new tariffs would stack atop existing
              Section 122 duties (10%), making the effective US import duty on Vietnamese apparel potentially 22–32% and
              on Chinese apparel 47–57% once base MFN HTS rates are included. Lululemon separately quantified the
              sector's tariff exposure at $380 million in projected 2026 headwinds—a benchmark for how margin-dilutive
              these policies are at scale.

              On the litigation front, Vuori initiated trademark-infringement action in January 2026 against operators
              of counterfeit domains (vuoriactivewear.com, vuoriclothingstore.com, and related URLs), securing a default
              judgment on June 10, 2026 after defendants failed to respond. While the enforcement direction is correct,
              ongoing brand impersonation across social commerce channels (TikTok, Instagram, ad networks) represents a
              persistent adversarial surface requiring continuous investment. Separately, privacy counsel Louis Law
              Group opened a class-action investigation in March 2026 into Vuori's alleged use of tracking pixels,
              session replay tools, and browser fingerprinting on its e-commerce site without explicit consumer consent.
              A March 27, 2026 federal-court ruling in Allison v. PHH Mortgage expanded the CCPA's private right of
              action to cover such unauthorized disclosures—not just traditional data breaches—materially widening
              Vuori's litigation exposure. An ADA website accessibility suit (Petersen v. Vuori, November 2024, Florida)
              and a delayed wage-and-hour collective action (Buchanan v. Vuori) round out the active legal calendar.
