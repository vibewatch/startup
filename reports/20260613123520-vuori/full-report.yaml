  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buyer Profile
        blocks:
          - type: paragraph
            body: >-
              Vuori's addressable customer is a premium-seeking, active-lifestyle consumer who blends fitness
              performance with everyday versatility. Web traffic data from April 2026 reveals a 60/40 female-to-male
              split on vuoriclothing.com, while the brand's strongest growth vector historically was underdressed men
              seeking high-quality athleisure—a whitespace Lululemon had not fully exploited. The product line is now
              roughly 50/50 men's and women's, reflecting a successful gender-diversification trajectory.

              Age concentration peaks in the 25–34 cohort, with the 25–45 band comprising the core. These are typically
              college-educated urban professionals with above-average disposable income; they shop across fitness, yoga,
              cycling, running, and casual daily use. Their willingness to pay a premium average order value of $125–150
              signals high price tolerance relative to the sports-apparel category median. Psychographically, they are
              eco-conscious (sustainability and carbon-neutral commitments resonate), aesthetics-driven (minimalist
              California aesthetic), and community-oriented (fitness class, gym, outdoor club participation).

              Channel mix bifurcates buyers: roughly 75% of revenue flows DTC (own e-commerce and company stores), while
              25% flows through wholesale. The DTC buyer interacts directly with the Vuori brand promise, whereas the
              wholesale buyer is first introduced through trusted retail endorsement from partners like Nordstrom, REI,
              or Equinox—critical for credibility with shoppers who discover the brand in-store before committing
              online. Geographic concentration is heavily US-centric, with over 95% of web traffic originating from the
              United States as of 2026; international expansion is nascent but accelerating.
            claimRefs:
