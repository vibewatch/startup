  - id: FE004
    title: Product Capability & Maturity Matrix
    type: matrix
    layout: wide
    summary: >-
      Vuori's relative strength across six product capability dimensions assessed against four product line clusters
      (core softgoods, category extensions, digital commerce, compliance).
    data:
      columns:
        - Core Softgoods (DreamKnit / BreatheInterlock / VCycled)
        - New Category Extensions (Ski / Denim)
        - Digital Commerce Platform
        - Sustainability & Compliance
      rows:
        - label: Material Innovation
          values:
            - High — four named platforms, IDFL certified, 75–89% recycled content
            - Medium — licensing NetPlus and Tencel lyocell; not proprietary
            - N/A
            - High — Preferred Fibers program, Higg MSI lifecycle data
        - label: Supply Chain Control
          values:
            - Medium — outsourced; VCoC enforced; quality complaints emerging
            - Low — new factory relationships, first-season product
            - N/A
            - Medium — ILO VCoC published; factory list and audit frequency not public
        - label: Brand & Community
          values:
            - High — Kaia Gerber, Tom Holland, hyperlocal ambassador network
            - Low — ski brand equity negligible; denim market highly competitive
            - High — Foursixty UGC, Yotpo reviews, Attentive SMS
            - Medium — Climate Neutral, CleanHub visibility
        - label: Technology Maturity
          values:
            - N/A
            - N/A
            - Medium — headless Shopify, Anatta ERP integration in progress, omnichannel shared-cart not yet live
            - Low — no published data-privacy tech stack; GDPR posture for EU e-commerce unclear
        - label: Customer Quality Perception
          values:
            - Mixed — praised for comfort; Trustpilot 2.2/5, fabric change complaints
            - Unproven — first-season sell-through only
            - Mixed — AI personalization deployed; shipping complaints for international orders
            - Medium — certifications visible but no annual sustainability impact report
    approximationNotes: >-
      Capability ratings (High/Medium/Low/Mixed/Unproven) are qualitative assessments by the author based on
      corroborated public evidence and should not be treated as quantitative scores. "N/A" means the dimension does not
      apply to that product cluster.
