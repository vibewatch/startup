      - number: '2.5'
        title: Diligence Gaps and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >-
              Several key data points remain uncertain or contested and must be preserved rather than resolved by
              averaging. The most significant numerical contradiction is the global activewear TAM spread: Fortune
              Business Insights ($373B) versus Mordor Intelligence ($488B) — a 31% gap driven by boundary definitions.
              Buyers of this report should anchor on the narrower premium/athleisure sub-segment ($402–$460B globally)
              rather than the broader activewear aggregate, as Vuori competes in the lifestyle-performance slice, not
              commodity sportswear. A second contradiction is the gender market share: the "women 52–53%" and "men
              72.7%" estimates appear to measure fundamentally different things (buyer count vs. end-user revenue share
              in a universe that may include sports equipment and performance footwear dominated by male purchasing).
              Vuori's specific US SAM within premium athleisure is not publicly sized by independent analysts; our
              $8–15B estimate is triangulated and should be stress-tested against Vuori's actual channel mix and AOR
              (average order revenue). The SOM attributable to Vuori is likewise estimated from public revenue signals;
              a formal bottom-up model would require access to Vuori's channel breakdowns, which are not publicly
              available. Finally, the impact of 2026 tariff increases on Vuori's gross margins specifically has not been
              disclosed; the company's sourcing geography and supply chain structure are not fully public, making
              quantified tariff exposure an open gap.
