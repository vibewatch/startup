  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              The market Vuori competes in is premium activewear and athleisure — performance-oriented apparel with a
              lifestyle positioning at retail price points generally above $60 per item, encompassing leggings, joggers,
              performance shorts, sports bras, hoodies, and transitional tops designed for both athletic and daily
              casual use. This segment is distinguished from mass-market sportswear (fast-fashion athletic basics sold
              by H&M, Target, or Amazon private label), from pure technical sports equipment and uniforms, and from
              traditional casual wear sold without performance claims. Athleisure is the fashion-lifestyle sub-segment
              of activewear that specifically targets wear occasions spanning the gym, office, travel, and social
              settings; it is the fastest-growing slice of the broader category. Premium activewear (priced $60–$200+)
              is estimated to represent 15–25% of total activewear market value. Adjacent markets include outdoor
              technical apparel (Arc'teryx, Patagonia), running-specific footwear, and luxury fashion houses
              incorporating performance textiles; these share buyer demographics but serve distinct primary occasions.
              Status-quo substitutes include generic sporting goods from mass retailers, traditional fashion brands
              repurposed for casual wear, and fast-growing secondhand athletic apparel platforms. Vuori's included spend
              is DTC and wholesale premium performance/lifestyle apparel for adults; excluded spend is footwear,
              accessories, equipment, and mass-market basics below the premium threshold. This boundary is critical:
              broad activewear TAM estimates often include mass-market volumes that overstate Vuori's true served market
              by an estimated 4–6×.
            claimRefs:
