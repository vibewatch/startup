  evidenceGaps:
    - type: private-evidence-only
      severity: minor
      topic: leadership-roster
      missingEvidence: >-
        A complete and current roster of all VP-level and above executives at Vuori.
        The leadership table (TO002) captures only C-suite and named board members from
        press releases; VP-level roles and recent departures are not fully tracked in
        public sources.
      whyItMatters: >-
        A complete leadership picture is needed to assess functional coverage, key-person
        risk below the CEO, and succession readiness, particularly as Vuori scales to
        international markets.
      diligencePath: >-
        Request a full organizational chart and leadership roster during formal diligence.
        LinkedIn cross-reference all VP-level hires announced since April 2023.
      relatedQuestionRefs:
        - QO006
      relatedTableRefs:
        - TO002

    - type: private-evidence-only
      severity: material
      topic: revenue
      missingEvidence: >-
        Confirmed annual revenue, gross margin, EBITDA, and free cash flow for Vuori. The
        company does not publish financials. Third-party estimates range from $424M to $637M
        for 2025 and are not validated by the company.
      whyItMatters: >-
        Without confirmed revenue, the $5.5B valuation multiple is indeterminate. Revenue
        confirmation is required to assess whether the brand's growth trajectory justifies
        the secondary valuation and investor return expectations.
      diligencePath: >-
        Request audited financials under NDA during diligence. Cross-reference with Vuori's
        disclosed CAGR claims and known funding timeline to validate analyst estimates.
        SEC Form D filings may provide partial capital context.
      relatedQuestionRefs:
        - QO010
        - QO026

    - type: private-evidence-only
      severity: material
      topic: shareholder-composition
      missingEvidence: >-
        Exact equity percentages for Joe Kudla, SoftBank, Norwest, ABP Capital, General
        Atlantic, and Stripes. The 2024 secondary structure involved existing shareholders
        selling; individual stake sizes and dilution effects are not publicly disclosed.
      whyItMatters: >-
        Understanding the cap table is essential for assessing control, potential secondary
        market pressure, and IPO readiness. Majority ownership by Kudla is confirmed in
        narrative but not by specific percentage.
      diligencePath: >-
        Request capitalization table as part of formal diligence. Review any Form D or
        state-level securities filings. Confirm Kudla majority stake and identify any
        liquidation preference or ratchet provisions.
      relatedQuestionRefs:
        - QO028

    - type: missing-source
      severity: minor
      topic: valuation-criticism
      missingEvidence: >-
        Full text of the Puck News "Vuori Reality Distortion Complex" article (paywall
        restricted). Partial excerpt obtained but full analyst argument and sourcing not
        available for direct quotation or citation.
      whyItMatters: >-
        The Puck News piece represents one of the most substantive critical analyses of
        Vuori's valuation and brand positioning. Full access would allow a more complete
        adversarial perspective to be documented.
      diligencePath: >-
        Obtain Puck News subscription or request author contact for access. Search for
        subsequent coverage citing the article's specific arguments.
      relatedQuestionRefs:
        - QO019

    - type: stale
      severity: minor
      topic: litigation
      missingEvidence: >-
        Full docket and any remaining open claims in the Vuori wage and hour class action
        litigation beyond the January 2026 dismissal of the specific sanctions motion.
        Additional wage/hour claims against Vuori may exist in state courts.
      whyItMatters: >-
        Wage and hour class actions in California are common for retail employers and can
        result in material settlements. Confirming the full litigation landscape is
        standard diligence for an investment of this scale.
      diligencePath: >-
        PACER search for all Vuori Inc. federal docket entries. California state court
        searches (LASC, SDSC). Request litigation schedule as part of formal diligence.
      relatedQuestionRefs:
        - QO022

    - type: private-evidence-only
      severity: minor
      topic: investor-stake-breakdown
      missingEvidence: >-
        Individual stake sizes and board seat allocations for each named investor in the
        Stakeholder and Investor Map (TO003). Publicly available sources confirm investor
        names and round amounts but do not disclose percentage ownership or board
        representation for Norwest, ABP Capital, General Atlantic, or Stripes.
      whyItMatters: >-
        Accurate investor representation is required to assess governance, alignment of
        interests, and potential exit dynamics. Partial data may misrepresent control
        structure.
      diligencePath: >-
        Request investor rights agreement and current cap table in formal diligence.
        Cross-reference Form D filings for any disclosed equity information.
      relatedTableRefs:
        - TO003
      relatedQuestionRefs:
        - QO028

    - type: private-evidence-only
      severity: minor
      topic: milestone-completeness
      missingEvidence: >-
        Complete chronological record of all major Vuori product launches, leadership
        transitions, and store openings captured in the Milestone Table (TO004). Several
        milestone dates are approximate month-level estimates from press coverage; exact
        dates and additional milestones not covered in public media may exist.
      whyItMatters: >-
        A complete milestone timeline is necessary to assess execution velocity, growth
        consistency, and any gaps in the company's history that might reflect unannounced
        challenges or leadership changes.
      diligencePath: >-
        Request internal company timeline and board presentation during formal diligence.
        Cross-reference LinkedIn for exact hire dates. Search SEC EDGAR for any Form D
        filings with precise closing dates.
      relatedTableRefs:
        - TO004
      relatedQuestionRefs:
        - QO006
        - QO008

