  - id: business-model
    title: Business Model and Competitive Position
    body: >-
      Vuori operates an omnichannel business model anchored in three channels: its own DTC
      e-commerce platform (vuoriclothing.com), a growing network of owned retail stores
      (approximately 100 as of April 2026), and strategic wholesale distribution through premium
      partners including REI, Nordstrom, Equinox, Selfridges, and Barry's Bootcamp. This
      multi-channel strategy differs from pure DTC peers: wholesale provides brand awareness and
      customer acquisition without relying solely on paid digital marketing, while owned retail
      creates a differentiated physical brand experience.

      Joe Kudla's most consequential early decision was to design for men—a segment Kudla observed
      was underserved relative to the female-dominated activewear market—using versatile fabrics
      and minimal design that could support athletic performance while looking appropriate for
      everyday life. Vuori's supply chain model treated factory partners as investors, securing
      favorable payment terms that enabled inventory to be received, sold, and only then paid for—
      effectively self-funding early growth. This discipline resulted in profitability by 2017 with
      negligible institutional capital.

      Vuori is gaining market share from the category leader Lululemon. Analytics firm GlobalData
      found that Lululemon customers spending at Vuori grew from 1.2% in 2018 to 7.8% by late
      2024. More than half of Vuori's customers also shop at Lululemon, while 12% also shop at Alo
      Yoga per Telsey Advisory Group research, indicating category overlap rather than pure
      substitution. Jefferies analyst Randy Konik publicly attributed Lululemon's flat Americas
      comparable sales to market share gains by Vuori and Alo Yoga.
