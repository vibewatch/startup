chapter:
  number: 1
  title: Company Overview
  summary: >-
    Vuori is a premium performance apparel brand founded in 2015 by Joe Kudla in Encinitas,
    California, blending coastal California lifestyle with technical athleisure. The company
    reached profitability in 2017 without venture capital, completed a $400M SoftBank
    investment in 2021 at a $4B valuation, and closed an $825M secondary tender led by
    General Atlantic and Stripes in November 2024 at a $5.5B valuation. As of April 2026,
    Vuori operates approximately 100 stores across 18+ countries and targets 25 additional
    locations in 2026.

sections:
  - id: identity-and-founding
    title: Identity and Founding
    body: >-
      Vuori is an American premium performance apparel and athleisure brand headquartered in
      Carlsbad, California, San Diego County, with its flagship store and founding roots in
      nearby Encinitas, California. The company was formally launched in 2015 by Joe Kudla,
      who had been developing the concept since 2014. The brand name "Vuori" is Finnish for
      "mountain," reflecting Kudla's passion for mountain climbing and the brand's aspirational
      mission. Vuori's core philosophy—"Built to Move In. Styled for Life."—captures its
      positioning as performance apparel that transitions seamlessly from athletic activity to
      everyday life.

      The brand is inspired by the active Coastal California lifestyle, integrating influences
      from fitness, yoga, surf, and life. Vuori began as a direct-to-consumer men's activewear
      business, launching its first collection of men's athletic shorts and apparel with early
      products developed from Kudla's garage in Encinitas. The company also operated a pop-up
      in downtown Encinitas during 2015 to build community before opening its first permanent
      retail store in Encinitas in spring 2016. Vuori's guiding principles—"Make Great Products,
      Be in Great Relationships, and Live Extraordinary Lives"—underscore its values-based
      approach to business.

      Vuori is a private company and does not publish detailed financial disclosures. Its
      disclosures come primarily via press releases, journalist access, and investor statements.
      The company is classified as private-undisclosed for most financial metrics.
