  - id: operating-model-supply-chain
    title: Operating Model & Supply Chain
    body: >-
      Vuori operates an asset-light manufacturing model: it does not own or operate any
      production facilities. All garments are produced by third-party contract factories
      selected by Vuori against a Vendor Code of Conduct (VCoC) based on International Labor
      Organization (ILO) core labor standards. The VCoC covers child and forced labor
      prohibitions, fair wages, working hours limits, environmental practices, and requires
      continuous monitoring and improvement programs at all tier-1 suppliers and their
      subcontractors.

      The supply chain is global, with sourcing relationships in Asia (including Cambodia).
      Some customer reviews from early 2026 note a change in fabric country of origin to
      Cambodia on specific SKUs, with complaints about perceived softness degradation. This
      raises a supply-chain quality-consistency risk as the brand scales orders across new
      factory relationships.

      On the logistics side, Vuori ships all orders, including UK website purchases, from
      a California-based warehouse, which has generated customer service complaints about
      surprise import duties and multi-week delivery delays for international buyers. As of
      June 2026 there is no confirmed UK or European fulfilment node.

      The retail channel spans company-owned stores, franchise-operated stores (e.g., the
      September 2025 Seoul flagship), and wholesale placements in Nordstrom, REI, Equinox,
      and independent outdoor and run specialty retailers. Founder CEO Joe Kudla attributes
      early wholesale adoption as a key profitability enabler during the pre-DTC phase of the
      business. The wholesale mix is subordinate to owned channels, and Vuori actively steers
      customers from wholesale discovery toward its own DTC channels for repeat purchase.

      Fiber selection is governed by the Textile Exchange's Fiber and Materials Matrix, with
      lifecycle impact data sourced from Worldly's Higg Materials Sustainability Index (Higg
      MSI). As of 2024, approximately 56% of total fabric spend uses Vuori Preferred Fibers—
      fibers that demonstrate reduced greenhouse gas emissions per kilogram compared to their
      conventional equivalents.
