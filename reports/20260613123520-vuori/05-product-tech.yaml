  - id: roadmap-product-launches
    title: Roadmap & Product Launches
    body: >-
      Vuori has executed an accelerated product and channel launch cadence over 2025–2026,
      reflecting the capital deployed from the $825M secondary tender closed in November 2024.

      In November 2025 Vuori launched its first ski and snow apparel line—the Taika Snow Shell
      collection for men and women—produced from 100% recycled NetPlus 4-layer fabric rated to
      30K waterproofing with PFC-free DWR coating. The collection targets resort and backcountry
      skiers and features technical details including RECCO avalanche reflectors, AquaGuard
      zipper vents, and integrated powder skirts. SVP Design Sarah Carlson described this as
      "the foundation" with additional alpine layers, expanded silhouettes, and new technical
      fabrics in development.

      In March 2026 Vuori debuted its first women's denim capsule—a vintage wide-leg jean
      ($198) and an oversized denim jacket ($188) in bone and light indigo washes—blending
      custom premium denim with Tencel lyocell for stretch and softness. A men's denim line
      had been introduced previously; initial men's denim reviews noted fit issues ("ill-fitting
      and too heavy"), which Vuori addressed in the women's version with additional washing and
      hand-finishing.

      The Spring 2026 "For Kaia" campaign deepened the Kaia Gerber collaboration (initiated
      Fall 2025 with "Vuori by Kaia"), featuring the BlissBlend AllTheForm and Sunday Track
      collections. In April 2026 Vuori signed Tom Holland as a creative, strategic, and
      financial partner—the first male celebrity partner—reinforcing the brand's expansion
      into menswear lifestyle positioning.

      On the retail/infrastructure roadmap, Vuori plans approximately 25 additional locations
      by year-end 2026, including 15 international stores in the UK, China (Beijing in
      October 2025), South Korea (Seoul in September 2025 via franchise), Japan, and the
      Middle East. The 100-store global milestone was reached in late 2025.

      The appointment of Heather Archibald as Chief Product Officer (effective April 20, 2026)
      signals a structural investment in product organization discipline: her mandate covers
      design, development, raw material planning, merchandising, production, and sourcing
      strategy in a single vertically integrated product function.
