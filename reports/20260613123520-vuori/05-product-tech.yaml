  - id: product-line-fabric-technology
    title: Product Line & Fabric Technology Map
    body: >-
      Vuori's product architecture is organized around four proprietary fabric platforms,
      each associated with a distinct set of garment families and use-case positioning.

      DreamKnit is the flagship material—an extra-soft, four-way-stretch brushed jersey
      knit manufactured with 89% recycled materials and certified as a Vuori Preferred Fiber.
      The DreamKnit collection spans men's and women's sweatpants, joggers, hoodies, pullover
      sweatshirts, long- and short-sleeve tops, polo shirts, and casual button-downs. Hero
      men's SKUs include the Ponto Performance Jogger, Ponto Performance Pant, and Ponto
      Full Zip Hoodie; hero women's SKUs include the Halo Performance Hoodie 2.0 and the
      Halo Essential Wideleg Pant.

      BlissBlend is the newer material innovation introduced as part of the Kaia Gerber
      collaboration collections. It delivers 360° multidimensional stretch with an airy,
      weightless feel, made with 75% recycled materials. BlissBlend garments target the
      premium studio-to-street segment—AllTheForm tops, bras, and shorts.

      BreatheInterlock is Vuori's highest-coverage performance fabric, carrying a
      peachy-finish that provides opacity and structure for high-intensity training. It anchors
      the workout core range (leggings, fitted tops, bras).

      VCycled is the water-ready adventure fabric crafted partially from recycled plastic
      bottles, serving outdoor and travel segments with boardshorts, swim-trunk hybrids, and
      technical casual shorts.

      In 2025–2026 Vuori expanded beyond its four core soft-goods platforms into two new
      hard-goods-adjacent categories: ski and snow outerwear (Taika Snow Shell line, November
      2025) using 100% recycled NetPlus fishing-net fabric with a 30K waterproof rating, and
      women's denim (March 2026) using a custom premium denim blended with Tencel lyocell.
      These moves extend the TAM addressable by Vuori's existing customer base without
      requiring new brand equity construction.

      In April 2026 Vuori appointed Heather Archibald as its first-ever Chief Product Officer,
      overseeing the full lifecycle from design and material planning through merchandising,
      production, and sourcing strategy. This new role formalizes what had previously been
      distributed product leadership under the CEO.
