callouts:
  - calloutType: strength
    title: Fabric-First Platform Is a Durable Moat
    body: >-
      Vuori's four proprietary fabric platforms—DreamKnit (89% recycled), BlissBlend
      (75% recycled), BreatheInterlock, and VCycled—anchored by IDFL Textile Exchange
      certification and Higg MSI lifecycle benchmarking, are the clearest product
      differentiation the brand has. The fabric-first design philosophy produces garments
      where material choice precedes silhouette, creating a product-development constraint
      that filters out low-quality imitation and builds brand coherence. This is a
      meaningful moat as long as Vuori controls the material innovation cycle and maintains
      certification integrity.
    claimRefs:
      - CE007
      - CE008
      - CE009
      - CE038
      - CE039

  - calloutType: risk
    title: Quality Consistency Risk at Scale
    body: >-
      Trustpilot's 2.2/5 "Poor" rating and BBB complaint filings in 2025–2026 describe
      a consistent pattern: fabric quality degradation (pilling, color fading, new
      materials from Cambodia), sizing inconsistencies, and unresponsive customer service.
      As Vuori scales to 100+ stores and 30 countries while introducing new factory
      relationships, the risk of quality drift increases. The single California distribution
      center for global orders further compounds the customer experience problem for
      international buyers.
    claimRefs:
      - CE043
      - CE044
      - CE019
      - CE020

  - calloutType: insight
    title: Category Extension Strategy Is High-Risk, High-Reward
    body: >-
      The ski outerwear and women's denim launches of 2025–2026 represent a deliberate
      attempt to become a lifestyle brand rather than a niche athleisure label. Both
      extensions enter established, highly competitive categories where Vuori has minimal
      prior brand equity and is not the technical incumbent. The denim precedent is
      cautionary: men's denim received initial fit complaints. Success depends on whether
      Vuori's community of loyal softgoods buyers will adopt these new categories or
      whether the extensions dilute brand identity.
    claimRefs:
      - CE031
      - CE032
      - CE033

