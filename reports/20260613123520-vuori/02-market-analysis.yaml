company:
  name: Vuori
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The premium activewear and athleisure market in which Vuori competes is large and fast-growing, with
    multiple analyst estimates placing the global TAM between $373 billion and $488 billion in 2026 and the
    US activewear market at approximately $23.4 billion. Growth is driven by hybrid work norms,
    health-consciousness, DTC channel expansion, and sustainability demand, while rising import tariffs,
    intensifying competition from Alo Yoga, and commoditization of base categories represent material
    headwinds. Vuori holds approximately 9.2% of premium US athleisure foot traffic and commands a
    27.4% share of its customers' active-apparel wallet, benefiting from strong appeal in the historically
    underserved men's lifestyle-performance segment.

sections:
  - id: market-boundary
    title: Market Boundary and Definition
    body: >-
      The market Vuori competes in is premium activewear and athleisure — performance-oriented apparel
      with a lifestyle positioning at retail price points generally above $60 per item, encompassing
      leggings, joggers, performance shorts, sports bras, hoodies, and transitional tops designed for
      both athletic and daily casual use. This segment is distinguished from mass-market sportswear
      (fast-fashion athletic basics sold by H&M, Target, or Amazon private label), from pure technical
      sports equipment and uniforms, and from traditional casual wear sold without performance claims.
      Athleisure is the fashion-lifestyle sub-segment of activewear that specifically targets wear
      occasions spanning the gym, office, travel, and social settings; it is the fastest-growing slice
      of the broader category. Premium activewear (priced $60–$200+) is estimated to represent
      15–25% of total activewear market value. Adjacent markets include outdoor technical apparel
      (Arc'teryx, Patagonia), running-specific footwear, and luxury fashion houses incorporating
      performance textiles; these share buyer demographics but serve distinct primary occasions.
      Status-quo substitutes include generic sporting goods from mass retailers, traditional
      fashion brands repurposed for casual wear, and fast-growing secondhand athletic apparel platforms.
      Vuori's included spend is DTC and wholesale premium performance/lifestyle apparel for adults;
      excluded spend is footwear, accessories, equipment, and mass-market basics below the premium
      threshold. This boundary is critical: broad activewear TAM estimates often include mass-market
      volumes that overstate Vuori's true served market by an estimated 4–6×.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
