      - CM007
    tableRefs:
      - TM001

  - id: market-sizing
    title: "Market Sizing: TAM, SAM, and SOM"
    body: >-
      Analyst estimates of the global activewear TAM diverge materially — Fortune Business Insights
      places the 2026 figure at $373.1 billion while Mordor Intelligence estimates $487.9 billion,
      a gap of more than $100 billion driven by definitional differences (whether footwear, equipment,
      and mass-market basics are included). Across major forecasters, the consensus range for 2026
      global activewear is $373–$488 billion, and for global athleisure (the relevant lifestyle
      sub-segment) the range is $402–$460 billion. The Business Research Company estimated the
      global activewear market at $431.1 billion in 2025, consistent with these projections.
      The US activewear market is estimated at $23.4 billion in 2026 by MarketDataForecast, growing
      at approximately 4.82% annually. The US athleisure sub-market is growing faster: SourceReady
      estimates a 9.1% CAGR through 2033 for US athleisure specifically.
      Premium and luxury activewear is a smaller but faster-growing slice: The Business Research
      Company estimates the global luxury activewear segment at $7.25 billion in 2026 at 7.2% CAGR,
      while Mordor Intelligence pegs the premium segment CAGR at 7.53% versus 5.99% for overall
      activewear — confirming that the premium end outgrows the mass market. For Vuori specifically,
      the serviceable available market (SAM) is US and international premium lifestyle activewear
      distributed via DTC and premium wholesale channels, which we estimate at $8–15 billion
      globally in 2026 using bottom-up sizing from the US market plus international growth premiums;
      this is a triangulation, not a disclosed figure. Vuori's SOM is constrained by its current
      store network (approaching 100 US stores), e-commerce reach, and wholesale distribution;
      conservatively, Vuori's current revenue run rate implies a low-single-digit percentage of
      the US premium SAM.
