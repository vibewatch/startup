  - id: TM004
    title: Growth Drivers and Constraints Table
    columns:
      - Factor
      - Direction
      - Timing
      - Implication for Vuori
      - Diligence Ask
    rows:
      - - Hybrid / remote work normalization
        - Tailwind
        - Permanent structural (now)
        - Expands occasion set beyond gym; increases repeat purchase frequency
        - How is Vuori measuring wardrobe-replacement purchases vs. incremental?
      - - Health and wellness consciousness (Millennial / Gen Z)
        - Tailwind
        - Sustained multi-year
        - Core buyer cohort's spending on fitness apparel growing faster than income
        - What is Vuori's retention rate among first-time buyers?
      - - Sustainability as purchase criterion
        - Tailwind
        - Accelerating (near-term)
        - Brands with certified sustainable supply chains command price premiums
        - What percentage of Vuori's SKUs use certified recycled/organic materials?
      - - DTC and e-commerce channel growth
        - Tailwind
        - Ongoing (8.46% CAGR)
        - Higher margins, first-party data; Vuori benefits from strong DTC foundation
        - What is Vuori's DTC-to-wholesale revenue split and margin differential?
      - - Men's lifestyle activewear demand growth
        - Tailwind
        - Sustained; men's spending on clothing up 34% vs. decade ago
        - Structural advantage for Vuori given its men's-first positioning
        - What share of Vuori's revenue comes from men's vs. women's categories?
      - - US apparel import tariffs (2025–2026 escalation)
        - Headwind
        - Near-term (active now)
        - Increases landed costs for Asia-sourced inventory; margin compression risk
        - Where does Vuori source its products and what is its tariff exposure?
      - - Market saturation in basic categories (leggings, sports bras)
        - Headwind
        - Increasing (ongoing)
        - Commoditization pressure from private-label; requires premium brand investment
        - How differentiated are Vuori's core SKUs from lower-cost alternatives?
      - - Alo Yoga competitive expansion
        - Headwind
        - Active and accelerating (100+ stores in 2024)
        - Direct competition for premium female and Gen Z buyers; erodes Lululemon overspill
        - What is Vuori's customer overlap with Alo Yoga and churn rate to Alo?
    notes: >-
      Driver/constraint classification based on: hybrid work normalization (industry reports, SourceReady),
      wellness trends (Mordor Intelligence, Persistence), sustainability (WiFi Talents survey data),
      DTC growth (Mordor activewear CAGR 8.46%), tariff data (Fashion Sizzle, supply chain analysis),
      Alo Yoga expansion (Passby foot traffic, Retail Dive). Timing labels are author characterizations.
