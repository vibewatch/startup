  evidenceGaps:
    - type: missing-source
      severity: material
      topic: US premium activewear SAM sizing
      missingEvidence: >-
        An independent analyst estimate of the US premium activewear serviceable addressable market
        (SAM) at the $60+ price tier, separated from mass-market volumes, with methodology and
        geographic/channel scope documented.
      whyItMatters: >-
        Without a credible US premium SAM estimate, Vuori's market penetration rate and growth
        ceiling cannot be robustly calculated; all current SAM estimates are author triangulations
        rather than published analyst figures.
      diligencePath: >-
        Commission a custom sizing from Euromonitor, NPD Group, or Circana using their premium
        apparel sub-tier data; alternatively, derive from Lululemon's disclosed US revenue and
        estimated market share as a proxy for the premium segment floor.
      relatedQuestionRefs:
        - QM003

    - type: missing-source
      severity: material
      topic: consumer spending elasticity in premium activewear downturns
      missingEvidence: >-
        Quantified evidence of how premium activewear unit demand and pricing hold up
        during recessions or consumer spending contractions, with specific historical
        data (2008–2009, 2022 spending pullback) for premium DTC brands.
      whyItMatters: >-
        Vuori's SOM and growth projections assume sustained consumer discretionary spending;
        a recession scenario could compress demand and unit volumes significantly, changing
        the growth calculus.
      diligencePath: >-
        Request Lululemon quarterly revenue trends during prior downturns from their 10-K
        filings; compare premium vs. mass activewear same-store sales during 2022 spending
        pullback using Consumer Edge or Earnest Analytics longitudinal data.
      relatedQuestionRefs:
        - QM019

    - type: missing-source
      severity: material
      topic: Vuori tariff exposure and sourcing geography
      missingEvidence: >-
        Vuori's specific sourcing geography (% sourced from China, Vietnam, Bangladesh vs.
        nearshore), current tariff rate exposure, and gross margin impact of 2025–2026 tariff
        escalation.
      whyItMatters: >-
        Tariff costs directly affect Vuori's gross margins and pricing power. Without disclosed
        sourcing data, the magnitude of headwinds on profitability cannot be quantified.
      diligencePath: >-
        Request sourcing disclosure from Vuori management at due diligence; cross-reference
        any sustainability or supply chain transparency reports Vuori may publish; review any
        IPO filing (expected 2026) for manufacturing geography disclosures.
      relatedQuestionRefs:
        - QM010
        - QM018

    - type: conflicting-data
      severity: minor
      topic: gender market share methodology
      missingEvidence: >-
        A methodologically comparable source that resolves the "women 52–53%" vs. "men 72.7%"
        activewear market share contradiction, clarifying whether these measure buyer counts,
        unit volume, or dollar value in the same product scope.
      whyItMatters: >-
        Understanding actual gender distribution in premium activewear spending is essential for
        validating Vuori's men's-first strategic positioning and sizing the men's opportunity.
      diligencePath: >-
        Commission custom analysis from Earnest Analytics or Consumer Edge segmenting US premium
        activewear spend by buyer gender across consistent product categories; supplement with
        Lululemon 10-K gender revenue disclosures.
      relatedQuestionRefs:
        - QM020

