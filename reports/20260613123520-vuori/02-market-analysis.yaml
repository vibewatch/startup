callouts:
  - calloutType: strength
    title: Large and Fast-Growing Market with Premium Tailwinds
    body: >-
      Even at the conservative end of forecaster ranges, the global athleisure/premium activewear
      market is a $400B+ category growing at 7–9% annually — well above GDP growth and driven by
      structural lifestyle shifts that are secular, not cyclical. Premium activewear specifically
      outgrows the mass market at ~7.5% CAGR (Mordor), and the US athleisure sub-market is
      tracking at 9.1% (SourceReady). Vuori's positioning at the premium-lifestyle intersection
      places it squarely in the fastest-growing slice of a very large market.
    claimRefs:
      - CM016
      - CM017
      - CM037

  - calloutType: risk
    title: Tariff Escalation and Supply Chain Restructuring Threaten Margins
    body: >-
      US apparel import tariffs increased significantly in 2025–2026 — nearly doubling in some
      Asian-sourcing categories — compressing gross margins industry-wide. Brands sourcing primarily
      from Vietnam, Bangladesh, or China face materially higher landed costs while the competitive
      market limits the ability to fully pass through price increases. Vuori's tariff exposure is
      not publicly quantified; its sourcing geography is not disclosed. This is a material diligence
      gap that could affect both growth investment capacity and margin profile.
    claimRefs:
      - CM041
      - CM044
      - CM045

  - calloutType: insight
    title: Men's Lifestyle Activewear Gap Remains Vuori's Structural Advantage
    body: >-
      The global men's activewear segment is large (estimated 72.7% of market by some measures),
      yet historically dominated by performance-first brands (Nike, Under Armour) that lacked the
      lifestyle and aesthetic positioning of Lululemon in women's. Vuori has occupied this white
      space with consistent coastal-California design and premium quality, creating a brand moat
      that has proven difficult for larger incumbents to replicate. Men under 40 are increasing
      clothing spend at 34% above the historical cohort pace, and 47% of male buyers seek
      multi-purpose activewear — directly aligned with Vuori's core offering.
    claimRefs:
      - CM022
      - CM025
      - CM026
      - CM027

  - calloutType: assumption
    title: SAM and SOM Estimates Are Triangulated, Not Analyst-Sourced
    body: >-
      No independent market research firm publishes a Vuori-specific SAM or SOM estimate.
      The $8–15B SAM range and the implicit SOM derived from Vuori's revenue signals are
      author triangulations from US premium market sizing, Vuori's store/channel footprint,
      and growth rate differentials. These estimates should be treated as directional boundaries
      subject to material revision when Vuori discloses revenue and channel mix (expected at IPO).
    claimRefs:
      - CM014
      - CM015
      - CM016

