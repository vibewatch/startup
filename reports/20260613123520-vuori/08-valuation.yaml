  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue
      missingEvidence: "Audited Vuori revenue, gross profit, EBITDA, and net income for FY2024 and FY2025 from audited financial statements or S-1 filing."
      whyItMatters: "The EV/revenue multiple analysis spans a $600M–$1B revenue estimate range — a 67% band of uncertainty. Without audited financials, no precise multiple can be calculated and the buy/sell threshold cannot be set."
      diligencePath: "Request financial statements directly from company or General Atlantic; obtain from S-1 filing when filed; access via secondary market data room if available through institutional intermediaries."
      relatedQuestionRefs: [QV007, QV001]

    - type: missing-source
      severity: blocking
      topic: ipo
      missingEvidence: "SEC S-1 prospectus filing from Vuori disclosing financial statements, cap table, use of proceeds, and risk factors."
      whyItMatters: "The S-1 will be the first authoritative disclosure of Vuori's financials, preference stack, and business risks at IPO pricing. Without it, no entry price discipline can be set from first principles."
      diligencePath: "Monitor SEC EDGAR daily; set alert at edgar.sec.gov for CIK lookup on 'Vuori'; track financial press for S-1 announcement; subscribe to Bloomberg SPAC/IPO pipeline feeds."
      relatedQuestionRefs: [QV008]

    - type: private-evidence-only
      severity: material
      topic: profitability
      missingEvidence: "Vuori gross margin by channel (DTC online, retail stores, wholesale) and EBITDA margin for most recent full fiscal year."
      whyItMatters: "Profitability is the primary thesis differentiator. Gross margin by channel validates whether international retail expansion is accretive or dilutive to the overall margin profile."
      diligencePath: "Management presentation at pre-IPO roadshow; data room access through existing investor network; channel-level analysis via third-party retail intelligence tools (Particl, ECDB, Earnest)."
      relatedQuestionRefs: [QV007, QV013]

    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: "Full Vuori capitalization table including preference waterfall, anti-dilution provisions, and liquidation preferences from the 2021 SoftBank and 2024 General Atlantic/Stripes secondary tender transactions."
      whyItMatters: "Secondary tender structures may include ratchet clauses, preferred return hurdles, or anti-dilution features that effectively reduce common equity value at IPO pricing below assumptions."
      diligencePath: "Legal review of tender offer documents; request from company legal counsel; may be partially disclosed in S-1 registration statement."
      relatedQuestionRefs: [QV019]

    - type: private-evidence-only
      severity: material
      topic: international-unit-economics
      missingEvidence: "Contribution margin per unit for Vuori's international store cohorts in London and Shanghai; wholesale economics in Japan and Europe."
      whyItMatters: "International expansion is a core pillar of the bull case; if early stores are loss-making, the 15-store-by-2026 plan extends cash burn and complicates the IPO financial narrative."
      diligencePath: "Management presentation; channel check with European and Asian retail buyers; Particl localized DTC sales data for UK and China markets."
      relatedQuestionRefs: [QV008]

    - type: private-evidence-only
      severity: material
      topic: comparable-private-peers
      missingEvidence: "Disclosed financials for Alo Yoga and Gymshark to construct apples-to-apples private company comps; both are private with no public GAAP disclosures."
      whyItMatters: "Alo Yoga reportedly commands $10B+ private valuation on estimated sub-$500M revenue, implying a peer-relative premium. Without disclosed data, the private comp range has extremely wide uncertainty bounds."
      diligencePath: "Monitor Companies House filings for Gymshark UK; track media coverage of Alo Yoga fundraising; use third-party intelligence services for private revenue estimates."
      relatedQuestionRefs: [QV022]
      relatedTableRefs: [TV003]

