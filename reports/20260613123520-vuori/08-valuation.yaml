company:
  name: Vuori

chapter:
  number: 8
  title: Valuation
  summary: >-
    Vuori's November 2024 secondary round at $5.5B implies approximately 8–9x forward EV/revenue
    against a $600–700M estimated run rate, a substantial premium to the 1.28–3.0x at which public
    activewear peers trade in June 2026. The business is genuinely differentiated and consistently
    profitable since 2017, growing faster than the market, and backed by premier growth investors.
    However, private-company opacity prevents direct multiple validation, no S-1 has been filed as of
    this run date, and Trustpilot quality complaints signal brand-dilution risk at scale. Recommendation
    is TRACK, with a reassessment trigger at S-1 filing.

sections:
  - id: thesis-and-recommendation
    title: "Investment Thesis, Anti-Thesis, and Recommendation"
    body: >-
      Vuori is a rare combination in consumer: a fast-growing, profitable direct-to-consumer activewear
      brand with a defensible product identity and a loyal community that is actively capturing share
      from Lululemon. The investment thesis rests on three structural pillars. First, a large and
      expanding addressable market — the global athleisure segment was valued at $402.74 billion in
      2026 and is projected to compound at 9.7% annually through 2034, providing a long runway well
      beyond any single competitor. Second, demonstrated share capture: Vuori grew revenues 44% in
      2023 and 23% year-to-date through October 2024 against a 4.3% sportswear market expansion,
      and the Lululemon-to-Vuori cross-shop rate climbed from 1.2% to 7.8% between 2018 and 2024
      per GlobalData. Third, consistent profitability since 2017 on both EBITDA and net income basis —
      a near-unique achievement in a DTC category where most brands lose money for years.

      The anti-thesis is equally clear. Vuori's $5.5B November 2024 secondary valuation implies a
      roughly 8–9x EV/revenue multiple on estimated revenues of $600–700M, or approximately 5.5x even
      if the $1B analyst estimate is correct — far above comparable public brands. On Holding (ONON),
      itself a high-growth premium athletic brand, commands 3.0x EV/revenue; Lululemon, once the
      sector's valuation benchmark, has fallen to 1.28x amid decelerating growth. Paying 5.5–9x for
      a private company with no audited disclosures requires significant conviction in continued
      hypergrowth and margin expansion that cannot be validated from public evidence alone. Additionally,
      Trustpilot customer reviews in 2026 surface material quality concerns including fabric sourcing
      shifts, chemical smells, and poor international customer service — early signals of brand dilution
      risk that commonly precede multiple compression.

      On balance, the recommendation is TRACK. Vuori's fundamentals are excellent and the brand
      trajectory is strong, but the valuation is stretched relative to publicly priced peers, and the
      missing S-1 filing means investors cannot access the financial evidence needed to justify a buy.
    claimRefs: [CV001, CV003, CV005, CV009, CV010, CV012, CV013, CV014, CV017, CV018, CV022, CV029]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001, FV004]

  - id: financing-context
    title: "Financing and Valuation Context"
    body: >-
      Vuori's two major capital raises have both been structured as secondary tender offers providing
      liquidity to existing investors rather than primary equity injections for the business. In 2021,
      SoftBank Vision Fund 2 led a $400M round that valued the company at $4B — then the largest
      investment round for a private apparel brand globally. In November 2024, General Atlantic and
      Stripes co-led an $825M secondary tender at a $5.5B valuation, a 37.5% step-up over three years.
      Alongside new investors, SoftBank, Norwest, and ABP Capital remain significant investors.

      Norwest managing partner Jon Kossow, a board member who has observed the company from its $45M
      Series A in 2019, stated explicitly that Vuori is "self-sustaining" and "doesn't need funds for
      operating cash or investment." The 2024 round was designed to provide liquidity for angels and
      early high-net-worth investors who backed the brand before institutional capital arrived. General
      Atlantic, which manages approximately $97B AUM, assigned managing director Andrew Ferrer to
      join the Vuori board. Stripes, a $6.2B AUM growth equity firm with prior investments in On
      Running and Erewhon, provided a brand-building partnership alongside the capital commitment.

      This structure creates a specific analytical problem. Because Vuori has raised capital to reward
      existing holders rather than to fund growth, it has never had cause to disclose financials to a
      new money provider at a standard diligence level. The $5.5B secondary market price is therefore
      based on investor conviction in the brand trajectory and comparable company analysis — not on
      a confirmed financial model. The preference and liquidation stack, cap table details, and any
      ratchet provisions from the secondary tender are not publicly known, making it impossible to
      compute expected returns under downside scenarios without further diligence.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV007, CV032, CV033, CV036, CV037]

  - id: comparable-valuation
    title: "Comparable Valuation Analysis"
    body: >-
      As of June 12, 2026, the premium activewear and athletic apparel public peer group trades at a
      wide range of EV/revenue multiples that form the analytical anchor for Vuori's valuation.
      Lululemon — the most direct premium athleisure comparable — sits at approximately 1.28x
      EV/LTM revenue (EV ~$14.1B, revenue $11B) after losing nearly 70% of its market cap from its
      2023 peak amid CEO departure and Americas growth stagnation. On Holding (ONON), growing at
      23%+ YoY with 62% gross margins and 19% EBITDA margin, commands approximately 3.0x
      EV/revenue — reflecting investor willingness to pay a premium for authentic, profitable growth
      in the premium athletic segment. Nike trades at approximately 1.52x EV/revenue and Under Armour
      at just 0.84x, reflecting their respective scale and execution profiles.

      Against this backdrop, Vuori's $5.5B valuation on an estimated revenue of $600M–$1B implies
      an EV/revenue multiple of approximately 5.5–9.2x — a 1.8x to 7x premium above the top of
      the public comparable range. The private market premium is attributable to higher growth rates,
      scarcity value as a pre-IPO asset, and investor belief in a Lululemon-scale trajectory. In
      private markets, Alo Yoga operates with similarly high implied multiples given its 100% founder
      ownership and no external valuation events since 2010, but no reliable disclosed financials exist.

      Entry at the $5.5B last-round price is justifiable only if Vuori can sustain 20%+ revenue growth
      and reach $1.5B+ in revenue within 3–4 years while maintaining EBITDA margins. Any multiple
      compression toward ONON's 3.0x on $1B revenue would imply a public market valuation of ~$3B —
      a 45% drawdown from the last secondary price. Investors should anchor entry discipline to
      specific revenue milestones rather than assuming the private valuation is a floor.
    claimRefs: [CV013, CV014, CV015, CV016, CV017, CV018, CV019, CV020, CV021, CV040, CV034]
    tableRefs: [TV003]
    figureRefs: [FV002]

  - id: scenario-analysis
    title: "Bull, Base, and Bear Scenario Analysis"
    body: >-
      Three scenarios shape the return profile for investors considering a position at the $5.5B last
      secondary price or at an anticipated IPO in late 2026. All scenarios are hypothetical given the
      absence of disclosed financials; assumptions are grounded in public comps, observed growth rates,
      and management commentary.

      In the bull case, Vuori reaches approximately $1.5B in revenue at IPO with 15%+ EBITDA margins,
      investor sentiment benchmarks the company to ONON's 3.0x premium growth multiple, and the IPO
      prices above $5.5B. This scenario assumes continued 20%+ growth, successful international
      rollout in Asia and Europe, and no material quality or brand-dilution events. Return from the
      $5.5B secondary price would be in the range of 20–60%+ depending on the IPO price and float
      structure.

      The base case assumes revenue of approximately $800M–$1B at IPO, profitability maintained,
      but a public market repricing toward 5–6x EV/revenue due to the compressed multiple environment
      for consumer brands. At 5.5x on $1B revenue, the implied IPO valuation would be $5.5B — flat
      to last round. Investors would receive modest upside from the IPO float structure alone, but
      secondary holders entering at $5.5B would effectively earn zero return before considering time
      value of capital.

      In the bear case, revenue growth decelerates below 15%, quality complaints escalate to reduce
      repeat purchase rates, or the IPO window closes due to macro conditions. Any repricing toward
      LULU's 1.28x multiple on $700M revenue would imply a $900M public valuation — an 84% drawdown
      from last secondary price. This scenario is low probability given Vuori's established
      profitability, but it is not negligible given the pace of multiple compression across consumer
      discretionary in 2025–2026.
    claimRefs: [CV008, CV009, CV010, CV013, CV019, CV027, CV028, CV041]
    tableRefs: [TV004]
    figureRefs: [FV003]

  - id: exit-triggers-diligence
    title: "Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks"
    body: >-
      Vuori's primary exit path is an IPO, with secondary liquidity having been established through
      the 2021 and 2024 tender rounds. Multiple sources close to the company indicate a 2026 IPO
      is being planned, though no S-1 prospectus had been filed with the SEC as of June 13, 2026.
      Key IPO readiness milestones are largely met: the 100-store global target was achieved in August
      2025 ahead of schedule, international expansion is underway with stores in Seoul, Beijing,
      London, and Shanghai and e-commerce in 18+ countries, and new senior leadership has been added
      including global president Ashley Kechter from Fabletics.

      The central monitoring concern heading into an IPO is brand integrity under scale. Trustpilot
      reviews in 2026 rate Vuori "Poor" at 2.2/5, with documented complaints about fabric quality
      changes (new sourcing from Cambodia), chemical odors on new garments, and poor international
      customer service. CNBC's reporting similarly notes consumer concern about quality maintenance
      post-IPO. Vuori's SWOT assessment acknowledges supply chain and logistics immaturity relative
      to global competitors. These factors do not yet constitute a thesis break, but they establish
      the monitoring items that should be tracked in every refresh.

      Investors should demand the following before entering: audited revenue and EBITDA margin for
      at least FY2024–2025, gross margin trajectory by channel (DTC vs wholesale), net promoter score
      and customer repeat purchase rate trends, international store-level unit economics, and a
      detailed cap table including preference waterfall and any anti-dilution provisions from the 2021
      and 2024 secondary tender transactions.
    claimRefs: [CV024, CV025, CV026, CV027, CV029, CV030, CV031, CV038, CV039]
    tableRefs: [TV005, TV006]

