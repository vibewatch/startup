  - id: financial-model-risks
    title: Financial and Model Risks
    body: >-
      Vuori's $5.5B valuation implies a revenue multiple of approximately 5–6x against the
      ~$1B analyst revenue estimate for 2024–2025—at the upper end of premium apparel
      comparables and dependent on sustained double-digit growth and intact profitability.
      The precedent from Lululemon is instructive and adverse: LULU's stock fell approximately
      70% from its 2023 peak as North American same-store sales declined, tariff headwinds of
      $380M were disclosed for 2026, and CEO Calvin McDonald abruptly resigned in January 2026.
      By June 2026, Lululemon revised its full-year guidance from 2–4% growth to flat-to-1%
      revenue decline and cut EPS guidance from $12.10–12.30 to $10.95–11.15, sending shares
      down 9% in a single session. Vuori is not Lululemon, but the compression in premium
      athleisure multiples is a sector-wide signal that investors should not discount.

      Vuori's private-company status means there are no audited financial statements, no
      quarterly reports, and no S-1 or registration statement on file with the SEC as of
      June 2026. All revenue, margin, and profitability claims rest on analyst estimates, company
      press releases, and third-party transaction analysis tools (Particl, Earnest Analytics).
      Online sales volume peaked in Q4 2024 and Q4 2025 was below that high, with further
      post-holiday softening in early 2026 per Particl transaction data—a modest but watchable
      deceleration. Vuori's assortment is bottoms-heavy relative to Alo Yoga's outerwear depth
      and Fabletics' broader catalog, creating concentration risk if consumer preference for
      joggers and shorts normalizes. With 80% of US consumers reportedly facing affordability
      constraints and Fabletics recording 15% same-store sales growth by offering lower price
      points, there is evidence that the premium athleisure addressable market may be bifurcating
      rather than growing uniformly.
