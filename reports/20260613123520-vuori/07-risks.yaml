callouts:
  - calloutType: risk
    title: "Imminent Binary Risk: USTR Section 301 Tariff Decision"
    body: >-
      The USTR's proposed 12.5% Section 301 tariff on Vietnam and China apparel (public
      comment closes July 6, 2026) is the single most time-sensitive risk for Vuori's
      profitability and IPO timeline. At Vuori's estimated $1B revenue scale, a stacked
      22–32% effective tariff on Vietnamese apparel would require either retail price
      increases of 5–15%, gross-margin dilution of 3–8 percentage points, or a significant
      shift in sourcing geography—all of which create execution complexity ahead of an IPO.
      Lululemon's $380M disclosed tariff headwind for 2026 provides a proportional benchmark.
      This trigger should be monitored as a gate event for IPO timing and pricing decisions.
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR019

  - calloutType: insight
    title: "Private-Company Disclosure Gap Amplifies Every Other Risk"
    body: >-
      Vuori's private-undisclosed status means that no audited financial statements, detailed
      supply-chain disclosures, factory audit records, or IPO-quality management accounts are
      publicly available. This opacity makes it structurally impossible to independently verify
      the company's gross margin, working capital, inventory risk, or exact sourcing
      concentration. Every risk quantification in this chapter rests on analyst estimates,
      third-party transaction data, and public filings of comparator companies. A diligence
      request for audited financials and a detailed supply-chain map is the single highest-value
      action any prospective investor can take before committing capital at the $5.5B anchor
      valuation.
    claimRefs:
      - CR017
      - CR035
      - CR036

