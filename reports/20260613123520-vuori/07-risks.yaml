  - id: mitigations-monitors-kill-criteria
    title: Mitigations, Monitors, and Thesis-Break Triggers
    body: >-
      The aggregate risk picture for Vuori is manageable but requires active monitoring
      across four principal axes: tariff/sourcing, brand/quality, competitive/financial,
      and legal/compliance. The most imminent binary event is the USTR Section 301 final
      rule—expected after July 7, 2026 hearings—which will determine whether a new 12.5%
      tariff layer applies to Vietnamese and Chinese apparel imports. A favorable outcome
      (exclusion of apparel from the final rule, or a textile mechanism that reduces the
      effective rate) would remove Vuori's most acute near-term margin headwind. An
      unfavorable outcome would require Vuori to accelerate sourcing diversification toward
      CAFTA-DR countries (Central America), increase retail prices, or absorb margin dilution.

      Kill criteria for the Vuori investment thesis center on five measurable event types:
      (1) Vuori's annual online sales volume declining two or more consecutive quarters year-on-year,
      as measured by Particl transaction data—a signal of demand deceleration beyond seasonality;
      (2) CEO Joe Kudla announcing his departure prior to a completed IPO; (3) any quarter in
      which Vuori is forced to undertake material promotional discounting outside normal seasonal
      windows, signaling full-price sell-through erosion; (4) any confirmed CBP transshipment
      enforcement action against Vuori's supply chain; and (5) formal SEC stop-order or
      investigation in connection with an S-1 filing. The private-company disclosure gap is
      itself a compounding risk: without audited financials, any of the above events would
      surface later and with less warning than for a public company.
    claimRefs:
      - CR006
      - CR008
      - CR020
      - CR035
      - CR036
      - CR043
    tableRefs:
      - TR005

