companyProfile:
  summary: >-
    Vuori is a late-stage private premium activewear brand founded by Joe Kudla that
    built an unusually profitable DTC-first apparel business before layering on rapid
    owned-store expansion and selective wholesale. The brand's edge comes from
    fabric-first product development, a California lifestyle identity, and a loyal
    premium customer base, while its main diligence challenge is that the business
    remains largely opaque despite a $5.5B secondary valuation and growing IPO
    expectations.
  founders:
    - name: Joe Kudla
      role: Founder, Chief Executive Officer
      background: Former Ernst & Young auditor and Vaco partner who bootstrapped Vuori from Encinitas and still retains majority ownership.
      claimRefs: [CO001, CO006, CO010]
  foundingLocation: Encinitas, California, USA
  headquarters: Carlsbad, California, USA
  productSummary: >-
    Vuori sells premium men's and women's activewear, lounge, outerwear, and adjacent
    lifestyle apparel built around proprietary fabric platforms such as DreamKnit,
    BlissBlend, BreatheInterlock, and VCycled.
  customerFocus: >-
    Affluent, health-conscious consumers aged roughly 25-45 seeking versatile premium
    apparel for fitness and everyday wear, plus selective wholesale and community
    ambassador channels.
  businessModel: >-
    DTC-first omnichannel apparel model combining e-commerce, owned retail stores,
    and curated wholesale partners, with profitability supported by premium pricing
    and disciplined inventory/supplier terms.
  stage: Late-stage private / pre-IPO
  fundingStatus: >-
    $45M Norwest growth round in 2019, $400M SoftBank secondary-style investment in
    2021 at ~$4B, and an $825M November 2024 secondary at $5.5B led by General
    Atlantic and Stripes.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO006, CO010, CO016, CO017, CO018, CO019, CO033, CE001, CU001, CU028]
summary:
  headline: >-
    Vuori appears to be a genuinely strong and profitable premium activewear brand,
    but the last $5.5B mark still looks too expensive to underwrite confidently
    without audited financial disclosure.
