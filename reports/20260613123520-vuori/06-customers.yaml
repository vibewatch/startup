    title: Vuori Customer Segments and Adoption Surfaces (Journey Map)
    type: journey-map
    layout: standard
    summary: >-
      Five-stage buyer journey from initial discovery through community membership,
      mapping channels, touchpoints, and retention levers at each stage.
    data:
      nodes:
        - label: "1 — Discovery"
          description: "Social media, ambassador content, Lululemon cross-shopping, Google search"
          channels: "Instagram, TikTok, NIL athletes, Google organic"
          keySignal: "Search ratio Lululemon:Vuori trending from 11.7x toward 10x"
        - label: "2 — Consideration"
          description: "Wholesale touchpoint (Nordstrom/REI in-store trial), vuoriclothing.com browse"
          channels: "Nordstrom, REI (~150 doors), brand website"
          keySignal: "AOV $125–150; 4.0–4.5% site conversion vs 2.97% category avg"
        - label: "3 — First Purchase"
          description: "DTC (~75% of revenue) or wholesale; Investment in Happiness free-returns guarantee"
          channels: "Own e-commerce, owned stores (100+), wholesale partners"
          keySignal: "$326.6M online DTC revenue 2025; ~296k monthly transactions April 2026"
        - label: "4 — Repeat Purchase"
          description: "Proprietary fabric affinity (DreamKnit, BlissBlend); product catalog expansion"
          channels: "DTC loyalty; email; in-store events (Investment in Happiness Day)"
          keySignal: "Wallet share 21.6%→27.4%; Vuori shoppers –17% at Nike DTC"
        - label: "5 — Community (V1 Program)"
          description: "Certified athletes, fitness professionals, studio owners; 40% off, early access"
          channels: "V1 Community (12,000+ members); ambassador campaigns"
          keySignal: "400 NIL athletes; 1,000+ NFL draft picks; Tom Holland, Gerber-Crawfords"
    approximationNotes: >-
      Stage data is a synthesis of web analytics, Earnest Analytics wallet-share, and publicly
      reported channel metrics. Funnel conversion rates between stages are not publicly disclosed.
