  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: NPS methodology
      missingEvidence: >-
        Vuori has not publicly disclosed its NPS measurement methodology, sample size,
        frequency of measurement, or the specific question text used.
      whyItMatters: >-
        The widely cited ~70+ NPS figure originates from analyst synthesis (Swotanalysis.com,
        DMS Retail citing Vuori SVP comments) and cannot be independently verified. An inflated
        or internally-selective NPS could overstate customer satisfaction versus third-party
        signals like Trustpilot.
      diligencePath: >-
        Request NPS source data, sampling methodology, measurement frequency, and segment-level
        NPS (DTC vs wholesale; men's vs women's; US vs international) in management due-diligence
        sessions.
      relatedQuestionRefs: [QU010, QU025]

    - type: private-evidence-only
      severity: material
      topic: retention cohort data
      missingEvidence: >-
        No formal cohort retention data (monthly or annual), gross retention rate, net revenue
        retention, or repeat-purchase rate has been publicly disclosed by Vuori for either the
        DTC or wholesale customer base.
      whyItMatters: >-
        Without cohort data, it is impossible to verify whether apparent wallet-share growth
        reflects genuine retention or merely a shift in a small, high-loyalty sub-cohort. For a
        brand potentially heading toward an IPO, validated LTV and churn data will be essential
        to support premium valuation multiples.
      diligencePath: >-
        Request trailing-24-month cohort retention analysis by channel (DTC online, DTC in-store,
        wholesale), including 12-month repurchase rate, average order frequency, and customer
        lifetime value estimates.
      relatedQuestionRefs: [QU010, QU016, QU028]

    - type: enumeration-incomplete
      severity: minor
      topic: wholesale revenue concentration
      missingEvidence: >-
        Vuori does not disclose the revenue contribution of individual wholesale partners.
        The claim that Nordstrom and REI are the 'largest' partners is CEO-stated but lacks
        quantification of their share of the ~25% wholesale revenue.
      whyItMatters: >-
        If Nordstrom and REI together account for more than half of wholesale revenue, the
        concentration risk is materially higher than the ~1,800-door count implies.
      diligencePath: >-
        Request top-5 wholesale partners as a percentage of total wholesale revenue; review
        contractual minimum-order commitments and renewal terms.
      relatedQuestionRefs: [QU021, QU027]
      relatedTableRefs: [TU003]

    - type: stale
      severity: minor
      topic: international revenue share
      missingEvidence: >-
        Vuori has not disclosed the specific revenue or customer share contributed by
        international markets. One source estimated US accounts for 99% of 2025 revenue, but
        this is unverified and may not reflect the post-London/Shanghai/Seoul/Beijing openings.
      whyItMatters: >-
        International ambitions are central to the $5.5B valuation narrative; without revenue
        data, the contribution of early international stores to unit economics cannot be assessed.
      diligencePath: >-
        Request international revenue breakdown by geography from management; review early
        store-level economics for London and Shanghai.
      relatedQuestionRefs: [QU030]

