          unit: "out of 5 (Wayback, Q1 2026)"
    approximationNotes: >-
      DTC Owned Stores and Wholesale bar values are absent as Vuori does not publicly disclose
      channel-level financials. Wallet share and review scores use right axis conceptually;
      figure is illustrative of the DTC online dominance and the divergence between curated
      (Reviews.io) and open (Trustpilot) review signals.
    claimRefs: [CU010, CU026, CU027, CU030]

callouts:
  - calloutType: strength
    title: Community Flywheel Drives Durable Acquisition
    body: >-
      Vuori's V1 Community Program—with 12,000+ athletes, 400 NIL deals, and marquee partners
      like Livvy Dunne, Tom Holland, and the Gerber-Crawford family—functions as a performance-
      validated acquisition engine. Members receive 40% off apparel and early-access privileges,
      incentivizing authentic product advocacy that expands reach into fitness, collegiate, and
      lifestyle communities. The Earnest Analytics wallet-share shift (21.6% → 27.4%) and the
      17% reduction in Nike DTC spending by existing Vuori shoppers confirm that community-
      driven loyalty is translating into measurable behavioral change.
    claimRefs: [CU022, CU023, CU024, CU030, CU031]

  - calloutType: risk
    title: Customer Service Friction and Quality Perception Threaten Pre-IPO Loyalty
    body: >-
      Trustpilot's "Poor" 2.2/5 rating, ComplaintsBoard's 0% complaint resolution rate, and
      CNBC's December 2024 reporting on consumer concerns about quality dilution represent a
      convergent adverse signal. Specific failure modes—automated bots failing to resolve
      billing disputes, store-credit-only returns, Cambodia-fabric complaints from long-term
      customers, international shipping delays—are actionable and recurrent. At scale, service
      failures compound churn and are especially dangerous given Vuori's premium pricing, where
      customers expect commensurate after-sale support. Pre-IPO brand management risk is
      significant if these patterns persist or worsen under a public-market growth mandate.
    claimRefs: [CU027, CU034, CU035, CU036, CU043]

  - calloutType: insight
    title: 52% Lululemon Cross-Shop Signals Loyalty Fragility
    body: >-
      Earnest Analytics data shows that 52% of Vuori shoppers also purchase at Lululemon—the
      highest overlap with any competitor. This means a majority of Vuori's customer base has
      not yet made Vuori their exclusive athleisure brand. While wallet-share trends favor Vuori
      in the short term, a Lululemon product or pricing response could reverse these gains.
      The TD Cowen Google search ratio (11.7x → 10x) confirms momentum but also illustrates
      the asymmetry: even at peak momentum, Lululemon commands roughly 10x the organic search
      interest of Vuori.
    claimRefs: [CU032, CU033, CU039]

