        - Role-Based Multi-Agent Peer
        - Independent venture-backed ($18M Series A)
        - Rapid prototype & multi-agent workflow devs
        - Opinionated role-based orchestration with rapid setup and intuitive crew abstractions
        - Less suited for low-level deterministic graph control and complex checkpointed state loops
