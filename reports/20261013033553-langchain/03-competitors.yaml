callouts:
  - calloutType: insight
    title: LangGraph as Defensive Runtime Moat
    body: While minimalist tasks frequently migrate to raw provider SDKs to eliminate token and latency overhead, enterprise workloads requiring durable state resumption, multi-agent supervision, and deterministic middleware checkpoints remain anchored to LangGraph. The runtime layer, rather than top-level prompt templates, represents LangChain's primary defense against framework commoditization.
    claimRefs:
      - CP003
      - CP004
      - CP008
      - CP013
  - calloutType: risk
    title: Observability Disintermediation via OpenTelemetry
    body: LangSmith's monetization relies heavily on trace-based compute and storage consumption. Because LangChain natively outputs standard OpenTelemetry traces, cost-sensitive engineering organizations face minimal technical friction when routing telemetry to self-hosted alternatives such as Langfuse, creating pricing ceilings on high-volume production deployments.
    claimRefs:
      - CP010
      - CP011
