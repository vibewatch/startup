  - id: TP003
    title: Pricing / Packaging Comparison
    columns:
      - Platform / Tool
      - Pricing Model
      - Included Capabilities
      - Enterprise / Scale Unknowns
      - Commercial Implication
    rows:
      - - LangChain / LangSmith
        - Free OSS frameworks; SaaS Developer ($0/mo, 5k traces), Plus ($39/seat/mo, 10k traces) + usage ($1.50/LCU, $1.00/LSU); Enterprise custom
        - LangGraph/LangChain OSS free; LangSmith traces, evals, deployment, and engine on paid tiers
        - Enterprise volume discounts and custom VPC/BYOC infrastructure pricing undisclosed
        - Low entry barrier creates bottom-up adoption; high production trace volume drives monetization
      - - LlamaIndex
        - Free OSS core (LlamaIndex); enterprise cloud/platform pricing on custom quote
        - Data connectors, RAG indexing pipelines, and enterprise knowledge connectors
        - Full production deployment and retrieval platform volume tiering terms private
        - Lower initial platform lock-in; relies on enterprise retrieval expansion
      - - CrewAI
        - Free OSS core; Enterprise tier with hosted multi-agent management
        - Pre-built agent roles, task delegation, and collaborative crew orchestration
        - Usage limits and multi-agent execution scaling multipliers unverified from public tiers
        - Focused on departmental automation budgets rather than broad infra spend
      - - Raw SDK / Self-Hosted OSS
        - Zero framework software fee; pay direct model inference API tokens and cloud compute
        - Full bespoke code ownership, zero third-party software licensing overhead
        - Total cost of ownership shifts entirely to internal developer maintenance and custom monitoring build
        - High labor cost to build state persistence and evals offsets zero software license fees
    notes: Pricing terms reflect published self-serve tiers as of August 2026 and public comparative analyses; enterprise contract floors are negotiated privately.
