evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: Executive leadership bench and board governance
    missingEvidence: >-
      Comprehensive listing of executive leadership appointments across go-to-market and finance, along with formal
      board of directors composition.
    whyItMatters: >-
      Enables assessment of corporate governance maturity, executive bandwidth, and key-person risk diversification
      beyond the technical co-founders.
    diligencePath: Review formal corporate filings, investor disclosure decks, and confirmed leadership executive appointments.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: Cap-table ownership percentages and liquidation preferences
    missingEvidence: >-
      Detailed breakdown of cap-table equity ownership, liquidation preferences, secondary transactions, and voting
      share allocations across financing rounds.
    whyItMatters: >-
      Directly impacts common shareholder dilution, downside protection thresholds, and net return economics under
      various acquisition or IPO exit outcomes.
    diligencePath: Obtain fully diluted cap table and investor rights agreements under formal due diligence NDA.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: Current audited ARR, gross margins, and module breakdown
    missingEvidence: >-
      Audited financial statements detailing 2026 annualized recurring revenue, gross margins, net revenue retention,
      and revenue split between LangSmith and hosted deployment.
    whyItMatters: Critical to validating whether commercial ARR expansion supports the $1.25B Series B private valuation multiple.
    diligencePath: Request audited financial statements, GAAP revenue schedules, and subscription cohort data from management.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: Commercial ARR Breakdown by Product Module
    missingEvidence: >-
      Audited financial disclosure breaking down annual recurring revenue (ARR), net revenue retention (NRR), and
      customer churn between LangSmith observability subscriptions and LangGraph deployment hosting.
    whyItMatters: >-
      Without segmented ARR data, private valuation multiples rely on proxy volume metrics (1B+ events/day, 132K apps)
      rather than verified commercial software unit economics.
    diligencePath: >-
      Request confidential SaaS metric disclosure, cohort retention schedules, and modular ARR breakdown in confirmatory
      diligence.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: Framework Abstraction Longevity vs Hand-Coded Subagents
    missingEvidence: >-
      Quantitative benchmarking comparing total cost of ownership, debugging latency, and code churn between
      framework-orchestrated multi-agent systems and handwritten native codebases in production.
    whyItMatters: >-
      Engineering team backlash against framework bloat (e.g. Octomind case) represents a structural threat to long-term
      orchestration retention if developers revert to unmanaged native code.
    diligencePath: >-
      Interview enterprise engineering leads across Fortune 500 customers to evaluate framework churn, rewrite rates,
      and migration to lightweight alternatives.
    relatedQuestionRefs:
      - QM004
  - type: private-evidence-only
    severity: material
    topic: enterprise-market-share
    missingEvidence: >-
      Disclosed enterprise contract values, net revenue retention by tier, and market share breakdowns between LangSmith
      and closed cloud agent offerings in Fortune 500 accounts.
    whyItMatters: >-
      Determines whether LangSmith's commercial seat-plus-usage monetization model is successfully converting
      open-source momentum into durable enterprise contract value against hyperscaler native tooling.
    diligencePath: >-
      Request customer cohort ARR expansion data, enterprise renewal rates, and competitive win-loss audit records from
      management during sponsor diligence.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-cost-structure
    missingEvidence: >-
      Audited gross margin figures, cloud infrastructure hosting costs (AWS/GCP), and token pass-through expenses for
      LangSmith SaaS and dedicated deployments.
    whyItMatters: >-
      Gross margin determines whether LangChain operates at software margins (70–80%) or lower infrastructure-heavy
      margins due to high-volume trace ingestion and evaluation compute.
    diligencePath: >-
      Request confidential management financial statements detailing Cost of Goods Sold (COGS), hosting line items, and
      third-party API costs.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: >-
      Current monthly net cash burn rate, cash and short-term liquid reserves, and projected months of runway remaining
      from the Series B proceeds.
    whyItMatters: >-
      Determines forward financing dependency, the timing of any required Series C equity round or secondary liquidity,
      and resilience in a tighter venture funding environment.
    diligencePath: >-
      Request monthly cash-flow statements, headcount budget forecasts, and cash-balance verifications from the CFO or
      lead investors.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI003
