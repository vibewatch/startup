      - '2026'
    keyQuote: >-
      Octomind published one of the most widely circulated critiques of LangChain. The company was using agents for
      serious software-testing work: test-case discovery, Playwright test generation, and automatic test repair.
      LangChain initially accelerated development. But as Octomind moved from a simple sequential agent toward
      subagents, specialist collaboration, and dynamically assigned tools, the abstraction became an obstacle. The team
      found itself translating product requirements into “LangChain-appropriate” solutions, debugging framework
      internals, and reading stack traces generated by layers of abstractions it did not own. After removing LangChain,
      the team summarized the result in five words: “We could just code.”
    canonical: SO006
