        - AI 开发者工具基础设施晚期项目整体估值倍数收缩。
      - - 悲观情景
        - OpenAI、Anthropic、Microsoft 的原生 agent 严重商品化；开发者剥离框架；商业转化停滞。
        - 低于 $500M 估值的下轮融资或资本重组。
