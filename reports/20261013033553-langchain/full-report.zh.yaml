  - id: FI001
    title: LangChain 客户变现与毛利转化漏斗
    type: flow
    summary: 展示免费开源框架采用如何转化为商业 LangSmith 软件订阅和企业合同毛利的结构化流程。
    approximationNotes: 转化率和毛利率拆分是基于已报道客户数与公开套餐结构推导出的定性结构阶段。
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI006
      - CI007
      - CI009
    data:
      nodes:
        - id: step-1
          label: 免费开源采用
          detail: LangChain 和 LangGraph 框架合计月下载量 350M+，GitHub star 数 100K+
        - id: step-2
          label: 开发者 Trace 与实验
          detail: 免费 LangSmith 开发者层，用于单工程师调试和提示词测试
        - id: step-3
          label: 团队原型开发与协作
          detail: 转为自助 Plus 套餐，每席位每月 $39，另加记录的 trace 量费用
        - id: step-4
          label: 企业生产环境部署
          detail: 专用云和自托管 VPC 实例，配备安全与 RBAC 控制
        - id: step-5
          label: 多 Agent 编排与 Fleet
          detail: 通过托管 Deep Agents 和无代码 Fleet 构建器运行高价值自主工作流
        - id: step-6
          label: 软件毛利兑现
          detail: 扣除云端 trace 摄取与存储 COGS 后的高毛利年度合同价值
      edges:
        - from: step-1
          to: step-2
        - from: step-2
          to: step-3
        - from: step-3
          to: step-4
        - from: step-4
          to: step-5
        - from: step-5
          to: step-6
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 覆盖基础模型、集成中间件、编排运行时、agent harness、可观测性和企业治理的六层产品与技术架构。
    approximationNotes: 根据 LangChain 和 LangGraph 组件规格综合梳理的架构层级。
    claimRefs:
      - CE004
      - CE006
      - CE007
      - CE009
      - CE011
    data:
      layers:
        - label: 治理与安全层
          detail: LLM Gateway 支出控制、PII 脱敏、人工审批钩子和隔离沙箱
        - label: 可观测性与生命周期层（LangSmith）
          detail: 逐步 tracing、SmithDB trace 索引、在线评估和提示词管理
        - label: Agent Harness 层（Deep Agents 与 Fleet）
          detail: 内置规划、子 agent 委派、文件系统工具和自然语言无代码界面
        - label: 编排与状态运行时（LangGraph）
          detail: 循环执行图、持久化 checkpointer、回退能力和人在回路中的中断
        - label: 框架与中间件层（LangChain）
          detail: LangChain Expression Language（LCEL）、可组合 chain、预构建 agent 架构和记忆钩子
        - label: 集成与基础模型层
          detail: 1,000+ 个模型提供商（OpenAI、Anthropic、本地模型）、向量数据库和第三方 API 连接器
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: LangChain 与 LangSmith 从开发者发现到企业平台扩张的生命周期。
    approximationNotes: 截至 2026 年，根据开发者评价、定价套餐结构和平台案例研究综合梳理的生命周期演进。
    claimRefs:
      - CU001
      - CU003
      - CU008
      - CU013
      - CU014
      - CU015
    data:
      items:
        - stage: 发现与原型开发
          actor: 个人开发者
          action: Installs open-source langchain via pip or uv; chains quickstart templates
          touchpoints:
            - GitHub 仓库
            - 官方文档
            - 快速入门指南
          friction: Leaky abstractions require 6+ hours for novice engineers to build autonomously
          label: 发现与原型开发
        - stage: 本地开发
          actor: 应用工程师
          action: Builds stateful cyclical agents using LangGraph and tests local prompt templates
          touchpoints:
            - LangGraph Studio
            - 本地 Python 环境
            - Discord 社区
          friction: Fast release pace and frequent module changes force unexpected code adjustments
          label: 本地开发
        - stage: 测试与可观测性
          actor: AI 工程负责人
          action: Adopts free LangSmith Developer tier (5,000 monthly traces) for debugging and eval
          touchpoints:
            - LangSmith 开发者 Web 控制台
            - Trace 可视化
            - 数据集评估
          friction: Proprietary observability push creates perceived vendor coupling
          label: 测试与可观测性
        - stage: 团队生产落地
          actor: 工程经理
          action: Upgrades to Plus tier ($39/seat/month) to unlock 10k traces and hosted agent deployment
          touchpoints:
            - Plus 订阅
            - 托管 agent 端点
            - 电子邮件支持
          friction: Asynchronous email support (8-12 hour SLA) lacks real-time live chat
          label: 团队生产落地
        - stage: 企业扩张
          actor: 工程副总裁 / AI 总监
          action: Contracts custom Enterprise tier for 100k+ traces, VPC hosting, and SSO governance
          touchpoints:
            - 企业销售
            - VPC 部署
            - 安全架构审查
          friction: Procurement audits scrutinized recent security vulnerability remediation cycles
          label: 企业扩张
        - stage: 规模化与留存
          actor: 平台运营负责人
          action: Monitors production fleet across business units; evaluates custom model routing
          touchpoints:
            - LangSmith Insights
            - 自动 PR 建议
            - 年度续约
          friction: Wrapper performance overhead leads selective teams to evaluate minimal custom harnesses
          label: 规模化与留存
