              - CO013
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 从框架抽象转向商业可观测性
            body: 开源 LangChain 先建立了品牌优势，但商业价值几乎完全由 LangSmith 的可观测、评估和部署基础设施承接。
            calloutType: insight
