chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与使命
        blocks:
          - type: paragraph
            body: >-
              LangChain Inc. 是一家专业开发者平台和基础设施供应商，帮助客户构建、评估和部署自主 AI 代理及大语言模型应用。公司由 Harrison Chase 和 Ankush Gola 于 2022 年
              10 月在美国加利福尼亚州旧金山创立，最初凭借开源 Python 框架迅速获得开发者传播。该框架旨在抽象提示词模板、模型调用和向量存储检索流水线。为商业化这股势头，公司于 2023 年 1 月正式注册为
              LangChain Inc.，从早期的提示词串联工具转向双层战略：用免费开源编排库占据开发者心智，再通过 LangSmith 这款面向企业的代理可观测、自动评估和可扩展执行运行时平台实现商业变现。
            claimRefs:
              - CO001
              - CO004
              - CO007
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO005
              - CO008
              - CO015
      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              LangChain 的管理层和技术方向由最初的联合创始人主导。首席执行官 Harrison Chase 在 2022 年 10 月离开 Robust Intelligence
              期间，用一个周末开发了这套开源库。他发现，生成式 AI 生态中的机器学习工程师反复编写相同且脆弱的胶水代码，用来连接语言模型、外部 API 和数据存储。联合创始人 Ankush Gola 与 Chase
              搭建公司的技术架构并扩大工程团队。公司保持着工程师主导的管理班底，在开源开发者社区和企业软件工具领域具备较强的创始人与市场匹配度。随着 LangChain 从个人开发者工具走向承载关键任务的企业生产部署，对
              Chase 的关键人物依赖仍是组织的一项核心特征；领先创投机构的战略性机构化董事会参与则提供了一定平衡。
            claimRefs:
              - CO001
              - CO002
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO006
      - number: '1.3'
        title: 资本结构、融资历程与投资者
        blocks:
          - type: paragraph
            body: >-
              从 2023 年 4 月到 2025 年末的四轮融资中，LangChain 累计获得约 $260M 股权风险投资。公司先获得 Benchmark 领投的种子轮融资，随后于 2024 年 2 月完成 Sequoia
              Capital 领投、估值 $200M 的 $25M A 轮融资；2025 年 10 月又完成由 IVP 领投的标志性 $125M B 轮融资。该轮融资将投后估值推至
              $1.25B，使这家开发者平台跻身独角兽。Benchmark、Sequoia Capital 和 Amplify Partners 等老股东大力跟投，新加入的机构成长型投资者包括 CapitalG 和
              Sapphire Ventures。更关键的是，公司的资本结构还纳入了强大的企业软件平台战略投资者联盟，包括 ServiceNow Ventures、Workday Ventures、Datadog
              Ventures、Databricks Ventures 和 Cisco Investments，使 LangChain 与关键企业部署渠道直接对接。
            claimRefs:
              - CO003
              - CO008
              - CO009
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO008
              - CO009
      - number: '1.4'
        title: 公司里程碑、牵引力与市场演进
        blocks:
          - type: paragraph
            body: >-
              LangChain 的发展轨迹同时体现出惊人的开发者采用和显著的架构演进。公司在 B 轮公告中称，LangChain 与 LangGraph 的月度软件包下载量达到 90 million，已进入财富 500
              强企业的 35%。但平台也经历了明显的行业逆风。早期软件工程团队（如 Octomind）公开指出，初始线性链存在抽象层臃肿和调试摩擦，LangChain 因此彻底改造了核心运行时。1.0 架构将
              LangGraph 定位为负责循环编排、检查点和持久恢复的底层有状态运行时，同时把商业重点转向 LangSmith 的追踪和评估。公司 2026 年《代理工程现状》调查显示，尽管如今已有 57.3%
              的组织在生产环境运行代理，输出质量和延迟仍是部署的首要瓶颈，这也确立了可观测性作为关键基础设施的地位。
            claimRefs:
              - CO005
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO003
