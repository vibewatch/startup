        - 以 >$3.0B 估值实现高溢价企业 IPO 或战略收购。
        - 25%
        - 模型提供商捆绑销售与原生 tracing 工具饱和。
      - - 基准情景
        - 核心企业客户对 LangSmith 的留存稳健，但开发者流向轻量原生 SDK，形成抵消。
        - 估值维持在 $1.0B–$1.5B 附近；按 Series B 入场价格计算，IRR 温和地处于十几个百分点。
