  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可支配支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              代理工程平台的市场边界，将应用层编排和运行时可观测性与底层基础模型推理、通用云计算区分开来。可计入的软件支出主要包括有状态执行框架、基于图的协调引擎、开发者工具、逐步追踪平台和自动评估工具，不包括原始 GPU
              算力托管、基础模型 API 的 token 消耗和通用应用性能监控。过去，企业软件开发团队依靠定制脚本和内部胶水代码，把语言模型连接到外部
              API、向量存储和结构化业务数据库。随着代理架构从简单的顺序链演进为复杂的循环工作流和自主子代理集群，维护临时提示词模板及脆弱错误处理流水线的运营成本急剧上升。LangChain
              通过提供标准化、模块化的构件承接了这一转变，而现状替代方案在处理非确定性推理任务时越来越容易被维护瓶颈卡住。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 市场规模：TAM、SAM 与新兴代理经济
        blocks:
          - type: paragraph
            body: >-
              评估企业市场规模，需要从广义生成式 AI 软件采用、专业开发者基础设施和商业可观测性支出等多个角度分析。行业预测显示，全球自主 AI 代理及代理型企业软件市场将从 2024 年的 $5.1 billion 增长至
              2030 年的 $47.1 billion，复合年增长率为 44.8%。在这一总可服务市场中，代理开发基础设施、执行运行时和开发者工具构成的可服务可获得市场（SAM）约为 $1.2
              billion，属于高毛利软件预算。Gartner 的研究也印证了企业准备度正在提升：高成熟度组织中有 57% 已积极信任并准备部署自主 AI 解决方案，而低成熟度组织仅为 14%。商业化方面，LangSmith
              每天接收超过 1 billion 个运营事件，显示出相当可观的企业平台参与度。尽管二手财务分析估计，付费层推出后公司 2024 年首年商业收入约为 $8.5 million，但当前 ARR
              和净扩张率仍是私募尽调的关键缺口。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
      - number: '2.3'
        title: 买方细分、用户画像与预算归属
        blocks:
          - type: paragraph
            body: >-
              企业买方可分为中央平台团队、专门的 AI 应用小组和治理利益相关方等多个层级。最初的主要买方通常是 AI
              平台负责人或工程副总裁，他们从集中式工程基础设施和开发者效率预算中拨款，建立全公司架构标准并避免供应商锁定。次级买方包括应用工程经理和垂直产品负责人，后者负责开发面向客户的对话界面或内部工作流自动化机器人。随着自主代理进入生产环境、处理敏感公司记录和财务数据，采购决策越来越需要与企业安全、治理和合规负责人协同，而这些负责人掌握着专门的
              MLOps 和质量保证预算。LangChain 通过由超过 1 billion
              次累计软件包下载推动的自下而上开源开发者路径进入客户账户；当工程组织需要协作式评估数据集、细粒度访问控制和审计轨迹时，这些使用最终会转化为企业 LangSmith 平台合同。
            claimRefs:
              - CM007
              - CM008
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: 增长驱动因素与关键采用约束
        blocks:
          - type: paragraph
            body: >-
              市场增长来自企业对模型无关灵活性的需求，以及把脆弱原型转为稳健生产系统的运营压力。LangChain 支持 70 多家模型供应商和 1,000
              个集成，帮助企业架构避开专有云锁定。但采用摩擦和结构性约束也在削弱这一势头。IBM 的企业调查显示，扩大生成式 AI 实施规模时，最严重的障碍仍是技术 AI
              技能不足（34%）、缺少专业工具和开发平台（25%）以及项目复杂度上升（24%）。此外，工程师对僵化框架抽象的反弹也构成直接采用风险：像 Octomind
              这样的团队发现，调试嵌套内部结构、把需求转换成框架特有模式会拖慢开发，因此干脆剥离早期框架抽象。这一摩擦推动 LangChain 转向 LangGraph
              更底层的有状态循环执行运行时，也说明长期企业软件留存取决于透明的状态管理、持久执行检查点和可靠的调试可观测性，而不只是高层提示词串联。
            claimRefs:
              - CM009
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 商业切入口：可观测性比框架代码更能驱动变现
            body: >-
              开源 LangChain 和 LangGraph 以超过 1 billion 次下载带来巨量开发者采用，但商业价值集中在 LangSmith。企业愿意为每天 1 billion
              个事件上的追踪、评估和回归测试付费，以解决生产 LLM 的非确定性问题。
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM010
          - type: callout
            title: 采用瓶颈：定制逻辑与框架抽象开销
            body: >-
              企业代理系统成熟后，团队会在僵化框架抽象和生产环境定制控制之间反复权衡。Octomind 等案例显示，复杂的子代理架构可能迫使团队剥离厚重抽象、改用直接代码，也凸显了 LangGraph
              这类底层原语相较于强约束链式框架的必要性。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM013
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与架构分层
        blocks:
          - type: paragraph
            body: >-
              到 2026 年，AI 代理工程市场已从最初的单体提示词串联库，分化为专业运行时层、专门的多代理框架和前沿模型厂商的 SDK。LangChain 同时占据开源开发者心智和企业工具两个阵地，将
              LangChain、LangGraph 开源工具与自有的 LangSmith 可观测、评估和部署平台结合起来。竞争者分别瞄准这条技术栈上的不同开发摩擦点。CrewAI
              在寻求角色化多代理编排的构建者中获得了大量采用，以直观的高层体验取代底层图编译。相反，LlamaIndex 仍是文档摄取、索引流水线和复杂检索增强生成工作负载的主流框架，常在数据密集型企业架构中与
              LangChain 共存或取而代之。前沿模型实验室也推出了更简洁的替代方案，其中最突出的是 OpenAI Agents
              SDK：它提供精简的单模型循环，减少第三方抽象开销，但牺牲了多供应商中立性。与此同时，Open Agent Platform 和 Flowise
              等可视化编排平台正在降低非开发者构建代理的门槛，以网页画布界面承载底层 LangGraph 和 LangChain 图原语。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
      - number: '3.2'
        title: 功能能力、中间件控制与定位
        blocks:
          - type: paragraph
            body: >-
              代理框架的技术差异主要体现在运行时持久性、状态模式灵活性和非侵入式运行时治理上。LangChain 在 2025 年 10 月重置为 v1.0 架构后，将核心执行统一到
              LangGraph，解决了开发者长期诟病的抽象不稳定问题。LangGraph
              支持确定性图编译、循环控制流、多节点状态归约器、时间旅行调试，以及分布式工作节点之间的持久检查点。为应对无法可靠靠提示词工程解决的运行时合规和安全要求，LangChain
              引入了可组合的六钩子中间件架构，能够拦截模型和工具调用，确定性地执行 PII 清洗、上下文摘要和人在回路审批。竞争框架各有取舍。PydanticAI 在寻求严格类型安全、结构化验证和更清爽开发体验的 Python
              工程师中获得了明显关注，但其生态远小于 LangChain 庞大的社区软件包库。LangChain 通过生态中立性维持主要竞争优势，保有覆盖基础模型、向量数据库和工具的 1,000
              多个集成，从而帮助企业客户避开模型供应商锁定。
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP012
          - type: figure
            figureRef: FP001
