              - CP005
              - CP007
              - CP012
              - CP013
      - number: '3.3'
        title: 变现模式、切换动态与替代风险
        blocks:
          - type: paragraph
            body: >-
              代理工具的商业持久性，取决于能否同时抵御现状惯性和开源去中介化。LangChain 最尖锐的竞争威胁并非来自直接框架对手，而是开发者彻底剥离第三方抽象，转而自行实现原始模型 SDK。实践者评估显示，手写 RAG
              流水线相比臃肿的框架封装可以显著降低 token 开销和执行延迟，促使注重成本的工程团队自托管精简循环。不过，一旦应用逻辑需要可恢复检查点、长时间运行的代理线程和容错多步执行，切换成本就会大幅上升；这些正是
              LangGraph 持久化层能形成实际开发者锁定的地方。商业变现上，LangSmith 将免费 Developer 层与按席位收费的 $39 Plus 层结合，并按用量收取计算和存储费用（每 LCU
              $1.50、每 LSU $1.00）。供应商中立的可观测协议正给这种按追踪量收费的模式带来结构性利润率压力。由于 LangChain 输出标准化 OpenTelemetry
