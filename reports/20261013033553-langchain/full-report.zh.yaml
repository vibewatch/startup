          unit: USD B
          detail: 为长期运行的生产 agent 提供托管基础设施、状态持久化和隔离执行。
    approximationNotes: 市场规模分层结合了第三方发布的 2024-2030 年 agent 市场预测（$5.1B 至 $47.1B），以及分析师对开发者基础设施和可观测性预算分配的估算。
    claimRefs:
      - CM004
      - CM005
  - id: FP001
