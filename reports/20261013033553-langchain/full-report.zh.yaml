      - number: '5.4'
        title: 信任、安全、治理与技术风险
        blocks:
          - type: paragraph
            body: >-
              自主代理进入企业生产环境后，会暴露出本地原型阶段不会出现的技术故障模式。无界的工具执行循环可能造成 token
              消耗呈指数增长、上下文窗口耗尽；工具调用失败或输出异常时，还可能产生不可预测的副作用。为降低这些运营风险，LangChain 商业平台加入了严格的治理控制。LLM Gateway
              支持集中式支出上限、实时限流，以及请求发送给外部基础模型前的自动 PII 脱敏。对于需要自主生成代码或执行脚本的任务，部署架构把代理运行隔离在安全的容器沙箱中，并由超过 30 个 Agent Server
              端点提供支持。不过，集成安全漏洞、通过不可信网页检索实施提示词注入，以及在不断演进的多代理系统中同步状态模式的工程复杂度，仍是主要技术风险。
            claimRefs:
              - CE008
              - CE009
              - CE012
              - CE013
              - CE014
