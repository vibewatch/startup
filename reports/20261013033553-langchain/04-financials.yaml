  - id: TI003
    title: LangChain Unit Economics, Traction Disclosures, and Diligence Requests
    columns:
      - Unit Economics Metric
      - Disclosed Value / Proxy
      - Data Confidence
      - Analytical Relevance
      - Diligence Request
    rows:
      - - Annual Recurring Revenue (ARR)
        - $12M–$16M (mid-2025 press estimate)
        - Medium
        - Core commercial scale proxy against $1.25B valuation
        - Provide audited trailing-twelve-month GAAP revenue and exit ARR
      - - Net Revenue Retention (NRR)
        - null
        - Low (Undisclosed)
        - Measures customer expansion across trace volume and seats
        - Request historical cohort retention and net dollar expansion by customer vintage
      - - Gross Margin (%)
        - null
        - Low (Undisclosed)
        - Distinguishes high-margin software license from cloud compute pass-through
        - Request cloud hosting and model inference COGS breakdown
      - - Customer Acquisition Cost (CAC) Payback
        - null
        - Low (Undisclosed)
        - Determines self-serve funnel efficiency vs. enterprise sales team burn
        - Request enterprise sales cycle duration and fully-loaded sales & marketing spend
    notes: >-
      Where metrics are private or undisclosed, values are reported as null with formal diligence requests specified per
      underwriting guidelines.
    claimRefs:
      - CI003
      - CI006
      - CI009
      - CI010
      - CI014
