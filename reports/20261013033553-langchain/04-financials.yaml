          to: step-4
        - from: step-4
          to: step-5
        - from: step-5
          to: step-6
callouts:
  - calloutType: risk
    title: Multiple Contraction Risk Against Model Provider Bundling
    body: >-
      Pricing LangChain at 80 to 100 times ARR leaves zero margin for execution error, especially as frontier model
      vendors natively bundle agent tracing and SDK tooling into base API pricing.
    claimRefs:
      - CI012
      - CI015
  - calloutType: insight
    title: Open-Source Funnel Asymmetry in Enterprise Monetization
    body: >-
      Over 350 million monthly downloads create immense top-of-funnel reach, but conversion to paid LangSmith contracts
      requires navigating security, VPC hosting, and governance hurdles that open-source usage does not automatically
      solve.
    claimRefs:
      - CI002
      - CI007
