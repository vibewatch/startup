    data:
      nodes:
        - id: step-1
          label: Free Open-Source Adoption
          detail: 350M+ monthly downloads and 100K+ GitHub stars across LangChain and LangGraph frameworks
        - id: step-2
          label: Developer Tracing & Experimentation
          detail: Free LangSmith developer tier for single-engineer debugging and prompt testing
        - id: step-3
          label: Team Prototyping & Collaboration
          detail: Conversion to self-serve Plus tier at $39 per seat monthly plus logged trace volume
        - id: step-4
          label: Enterprise Production Deployment
          detail: Dedicated cloud and self-hosted VPC instances with security and RBAC controls
        - id: step-5
          label: Multi-Agent Orchestration & Fleet
          detail: High-value autonomous workflows via managed Deep Agents and no-code Fleet builders
        - id: step-6
          label: Software Gross Profit Realization
          detail: High-margin annual contract value net of cloud trace ingestion and storage COGS
