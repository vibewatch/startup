      - CO010
  - calloutType: risk
    title: Valuation Disconnect vs Disclosed Revenue Scale
    body: >-
      The $1.25B Series B valuation represents a demanding multiple against historical $14M ARR disclosures, requiring
      rapid enterprise conversion to justify private-market pricing.
    claimRefs:
