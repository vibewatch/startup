company:
  name: LangChain
chapter:
  number: 1
  title: Company Overview
  summary: >-
    LangChain is a San Francisco-based AI infrastructure and agent engineering developer platform founded in 2022 by
    Harrison Chase and Ankush Gola. Backed by $260M in cumulative financing including an October 2025 Series B valuing
    the company at $1.25B, the business monetizes enterprise agent observability and deployment via LangSmith while
    maintaining dominant open-source framework distribution.
sections:
  - id: corporate-identity-and-mission
    title: Corporate Identity and Mission
    body: >-
      LangChain Inc. operates as a specialized developer platform and infrastructure provider for building, evaluating,
      and deploying autonomous AI agents and large language model applications. Founded in October 2022 by Harrison
      Chase and Ankush Gola in San Francisco, California, the company initially gained viral developer adoption through
      its open-source Python framework designed to abstract prompt templates, model invocations, and vector store
      retrieval pipelines. The company was formally incorporated as LangChain Inc. in January 2023 to commercialize this
      momentum, transitioning from early prompt-chaining utilities toward a dual-layer strategy: providing free,
      open-source orchestration libraries to capture developer mindshare while driving commercial monetization through
      LangSmith, an enterprise-grade platform for agent observability, automated evaluations, and scalable execution
      runtimes.
    claimRefs:
      - CO001
      - CO004
      - CO007
      - CO015
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Founders, Leadership, and Governance
    body: >-
      LangChain's executive leadership and technical direction are anchored by its original co-founders. Chief Executive
      Officer Harrison Chase originally developed the open-source library over a weekend in October 2022 while departing
      Robust Intelligence, recognizing that machine learning engineers across the generative AI ecosystem were
      repeatedly writing identical, brittle glue code to connect language models with external APIs and data stores.
      Co-founder Ankush Gola partnered with Chase to establish the company's technical architecture and scale
      engineering operations. The company maintains an engineering-centric executive bench with strong founder-market
      fit across open-source developer communities and enterprise software tooling. As LangChain expands beyond
      individual developer tooling into mission-critical enterprise production deployments, key-person reliance on Chase
      remains a defining organizational dynamic, balanced by strategic institutional board participation from lead
      venture capital partners.
    claimRefs:
      - CO001
      - CO002
      - CO006
    tableRefs:
      - TO002
  - id: capitalization-and-ownership
    title: Capitalization, Financing History, and Investors
    body: >-
      Across four financing rounds from April 2023 through late 2025, LangChain has raised approximately $260M in
      cumulative equity venture funding. Following early seed financing led by Benchmark and a $25M Series A round led
      by Sequoia Capital at a $200M valuation in February 2024, the company secured a landmark $125M Series B financing
      round in October 2025 led by IVP. This financing established a post-money valuation of $1.25B, cementing unicorn
      status for the developer platform. The round was heavily supported by existing venture backers including
      Benchmark, Sequoia Capital, and Amplify Partners, alongside new institutional growth investors CapitalG and
      Sapphire Ventures. Crucially, the capitalization structure also features a robust strategic syndicate of
      enterprise software platform investors—including ServiceNow Ventures, Workday Ventures, Datadog Ventures,
      Databricks Ventures, and Cisco Investments—aligning LangChain directly with key enterprise deployment channels.
    claimRefs:
      - CO003
      - CO008
      - CO009
    tableRefs:
      - TO003
  - id: evolution-and-milestones
    title: Corporate Milestones, Traction, and Market Evolution
    body: >-
      LangChain's corporate trajectory highlights both extraordinary developer adoption and significant architectural
      evolution. In its Series B announcement, the company reported reaching 90 million monthly package downloads across
      LangChain and LangGraph, with adoption expanding into 35 percent of the Fortune 500. However, the platform has
      also navigated material industry headwinds. As early software engineering teams like Octomind publicly encountered
      abstraction bloat and debugging friction with initial linear chains, LangChain fundamentally overhauled its core
      runtime. The 1.0 architecture established LangGraph as the low-level stateful runtime for cyclical orchestration,
      checkpoints, and durable recovery, while shifting commercial focus toward LangSmith tracing and evals. The
      company's 2026 State of Agent Engineering survey demonstrated that while 57.3 percent of organizations now run
      agents in production, output quality and latency remain primary deployment bottlenecks, cementing observability as
      essential infrastructure.
    claimRefs:
      - CO005
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
    figureRefs:
      - FO001
