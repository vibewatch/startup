  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Six-layer product and technology architecture spanning foundation models, integration middleware, orchestration
      runtimes, agent harnesses, observability, and enterprise governance.
    approximationNotes: Architectural hierarchy synthesized from LangChain and LangGraph component specifications.
    claimRefs:
      - CE004
      - CE006
      - CE007
      - CE009
      - CE011
    data:
      layers:
        - label: Governance & Security Layer
          detail: LLM Gateway spend controls, PII redaction, human approval hooks, and isolated sandboxes
        - label: Observability & Lifecycle Layer (LangSmith)
          detail: Step-by-step tracing, SmithDB trace indexing, online evals, and prompt management
        - label: Agent Harness Layer (Deep Agents & Fleet)
          detail: Built-in planning, subagent delegation, file system tooling, and natural language no-code interfaces
        - label: Orchestration & State Runtime (LangGraph)
          detail: Cyclical execution graphs, persistent checkpointer, rewind capability, and human-in-the-loop interrupts
        - label: Framework & Middleware Layer (LangChain)
          detail: LangChain Expression Language (LCEL), composable chains, pre-built agent architectures, and memory hooks
        - label: Integrations & Foundation Model Layer
          detail: 1,000+ connectors for model providers (OpenAI, Anthropic, local), vector databases, and third-party APIs
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Developer discovery to enterprise platform expansion lifecycle across LangChain and LangSmith.
    approximationNotes: >-
      Lifecycle progression synthesized from developer reviews, pricing tier structures, and platform case studies as of
      2026.
    claimRefs:
      - CU001
      - CU003
      - CU008
      - CU013
      - CU014
      - CU015
    data:
      items:
        - stage: Discovery & Prototyping
          actor: Individual Developer
          action: Installs open-source langchain via pip or uv; chains quickstart templates
          touchpoints:
            - GitHub repository
            - Official documentation
            - Quickstart guides
          friction: Leaky abstractions require 6+ hours for novice engineers to build autonomously
          label: Discovery & Prototyping
        - stage: Local Development
          actor: Application Engineer
          action: Builds stateful cyclical agents using LangGraph and tests local prompt templates
          touchpoints:
            - LangGraph Studio
            - Local Python environment
            - Discord community
          friction: Fast release pace and frequent module changes force unexpected code adjustments
          label: Local Development
        - stage: Testing & Observability
          actor: Lead AI Engineer
          action: Adopts free LangSmith Developer tier (5,000 monthly traces) for debugging and eval
          touchpoints:
            - LangSmith Developer web console
            - Trace visualization
            - Dataset evals
          friction: Proprietary observability push creates perceived vendor coupling
          label: Testing & Observability
        - stage: Team Production Land
          actor: Engineering Manager
          action: Upgrades to Plus tier ($39/seat/month) to unlock 10k traces and hosted agent deployment
          touchpoints:
            - Plus subscription
            - Hosted agent endpoints
            - Email support
          friction: Asynchronous email support (8-12 hour SLA) lacks real-time live chat
          label: Team Production Land
        - stage: Enterprise Expansion
          actor: VP of Engineering / AI Director
          action: Contracts custom Enterprise tier for 100k+ traces, VPC hosting, and SSO governance
          touchpoints:
            - Enterprise sales
            - VPC deployment
            - Security architectural review
          friction: Procurement audits scrutinized recent security vulnerability remediation cycles
          label: Enterprise Expansion
        - stage: Scale & Retention
          actor: Platform Operations Lead
          action: Monitors production fleet across business units; evaluates custom model routing
          touchpoints:
            - LangSmith Insights
            - Automated PR suggestions
            - Annual renewal
          friction: Wrapper performance overhead leads selective teams to evaluate minimal custom harnesses
          label: Scale & Retention
