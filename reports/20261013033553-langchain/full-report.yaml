        title: Exhibits
        blocks:
          - type: callout
            title: Ubiquitous Developer Mindshare Fuels Enterprise Inbound
            body: >-
              With over 134,000 GitHub stars and widespread integration across 100+ model and vector providers,
              LangChain serves as the default discovery surface for developers entering agent engineering, providing an
              organic inbound funnel that enterprise software competitors struggle to match.
            calloutType: strength
            claimRefs:
              - CU001
              - CU005
          - type: callout
            title: Abstraction Complexity Drives Leaky Abstraction and Churn Threats
            body: >-
              Heavy framework abstractions and rapid breaking updates create maintenance overhead that frustrates senior
              engineers, prompting some mature production teams to evaluate minimal custom API harnesses and threatening
              long-term framework stickiness.
            calloutType: risk
            claimRefs:
              - CU011
              - CU013
          - type: callout
            title: Commercial Value Concentrates in Observability Rather Than Framework
            body: >-
              Because the core framework is open-source and free, LangChain commercial defensibility rests almost
              entirely on LangSmith trace debugging, evaluation datasets, and hosted agent management, decoupling
              enterprise revenue from raw framework download volume.
            calloutType: insight
            claimRefs:
              - CU003
