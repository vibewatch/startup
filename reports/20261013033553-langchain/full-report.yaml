        - Developer backlash ('we could just code'), migration to raw APIs, emergence of MCP with 10K+ servers.
        - LangGraph establishing dominant standard for stateful agents, with LangSmith evals proving indispensable.
      - - Valuation Realism
        - A $1.25B post-money valuation prices in forward ARR scale that remains unverified in public domain.
        - >-
          Lack of audited revenue disclosure; heavy reliance on free-tier usage metrics over commercial financial
          figures.
        - Confirmation of high-margin recurring software ARR exceeding $50M with >120% enterprise net revenue retention.
    notes: >-
      Analysis incorporates reported adoption figures from company and third-party media alongside structural risk
      assessments.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV008
