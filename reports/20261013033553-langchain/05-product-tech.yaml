          detail: Built-in planning, subagent delegation, file system tooling, and natural language no-code interfaces
        - label: Orchestration & State Runtime (LangGraph)
          detail: Cyclical execution graphs, persistent checkpointer, rewind capability, and human-in-the-loop interrupts
        - label: Framework & Middleware Layer (LangChain)
          detail: LangChain Expression Language (LCEL), composable chains, pre-built agent architectures, and memory hooks
        - label: Integrations & Foundation Model Layer
          detail: 1,000+ connectors for model providers (OpenAI, Anthropic, local), vector databases, and third-party APIs
callouts:
  - calloutType: insight
    title: 'Architectural Decoupling: Framework vs. Runtime Engine'
    body: LangChain's strategic transition to running agents on LangGraph as the underlying engine decouples developer interface scaffolding (LCEL, connectors) from execution durability (graph checkpointers, cyclical loops), directly addressing early practitioner criticisms of rigid abstraction chains.
    claimRefs:
      - CE002
      - CE004
  - calloutType: risk
    title: State Bloat and Divergence in Autonomous Loops
    body: While cyclical graph architectures provide controllable execution, long-running agent workflows remain vulnerable to context loss, non-deterministic tool divergence, and escalating token expenditure when recovery policies fail.
    claimRefs:
      - CE008
      - CE013
