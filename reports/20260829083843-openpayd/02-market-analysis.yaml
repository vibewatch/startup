company:
  name: OpenPayd
chapter:
  number: 2
  title: Market Analysis
  summary: 'OpenPayd competes in a convergence market spanning embedded finance, B2B cross-border payments, and stablecoin-enabled treasury infrastructure. The credible top-down lenses are large but heterogeneous: FXC Intelligence sizes total cross-border flows at $208 trillion and revenue pool at $625 billion in 2025, while embedded-finance estimates range from $116.7 billion to $185 billion for 2026-era revenue opportunities depending on scope. The key diligence conclusion is that OpenPayd’s real opportunity is not “all embedded finance,” but the regulated, multi-currency, cross-border subset where API orchestration, compliance, and treasury workflow integration matter most.'
sections:
- id: market-boundary
  title: Market Boundary and Status-Quo Alternatives
  body: 'OpenPayd does not sell consumer banking directly; it sells the infrastructure that lets other businesses embed financial services into their own products and treasury workflows. The most accurate market boundary therefore spans embedded accounts, domestic and cross-border payments, FX, Open Banking connectivity, banking-as-a-service enablement, and stablecoin-linked treasury operations. That market is defined less by a single end product than by the orchestration layer that makes money movement programmable across rails, assets, and jurisdictions.


    This definition matters because the top-down “embedded finance” label can become too broad to be useful. OpenPayd is not competing for all financial activity conducted inside software. It is most relevant where businesses need regulated account infrastructure, multi-currency balances, API-triggered payouts, cross-border settlement, and increasingly a bridge between fiat and digital-asset rails. The main substitutes are still legacy correspondent banking, a patchwork of local PSPs and bank integrations, and internal treasury stacks built by customers themselves. Those substitutes remain viable, but they are slower to deploy, harder to reconcile, and less adaptable when businesses want to expand into new markets or asset types.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  tableRefs:
  - TM001
  figureRefs:
  - FM004
- id: sizing-lenses
  title: 'Sizing Lenses: Flows, Revenue Pools, and Embedded-Finance Revenue'
  body: 'The market is undeniably large, but the right lens depends on the question being asked. FXC Intelligence provides the broadest flow view, putting the global cross-border payments market at $208 trillion in 2025 and the associated revenue pool at $625 billion. That framing is useful for understanding the scale of money movement, but it is not equivalent to OpenPayd’s immediate serviceable revenue opportunity because large portions of that flow still sit in bank-to-bank, wholesale, or corridor-specific activity that a platform provider may not address directly.


    A second lens comes from embedded-finance research. Global Market Insights places the embedded-finance market at $180.5 billion in 2026 after $149.1 billion in 2025, while Custom Market Insights offers a lower 2026 estimate of $116.7 billion. Apideck, citing BCG and Adyen, gives a $185 billion addressable embedded-finance revenue figure for SaaS platforms with less than 20% currently captured. The variation is not a contradiction so much as a scope warning: some estimates are global multi-vertical revenue pools, some focus on distribution through SaaS, and some include infrastructure categories more directly relevant to OpenPayd. The practical conclusion is that OpenPayd’s SAM should be underwritten from the narrower intersection of B2B cross-border, API-led treasury, and regulated stablecoin workflows rather than by quoting one enormous TAM number in isolation.'
