companyProfile:
  summary: 'OpenPayd is a London-centered financial infrastructure company built around API-driven payments, accounts, FX, open banking, and stablecoin-linked money movement. Public evidence suggests a dual-origin story: the core UK operating entity SettleGo Solutions Limited was incorporated in 2015, while founder materials describe OpenPayd as being formed in 2018 by consolidating earlier fintech efforts into a single platform. The company now positions itself as a multi-rail orchestration layer for businesses that need regulated fiat and programmable-money infrastructure together. In June 2026, OpenPayd announced a SPAC merger with Titan Acquisition Corp. at a $1.145B valuation and disclosed more than $85M ARR, more than $240B annualized transaction volume, and more than 1,100 customers.'
  foundedDate: '2015-04-30'
  founders:
  - name: Dr Ozan Özerk
    role: Founder
    background: Founder of OpenPayd and public architect of its multi-entity embedded-finance and digital-asset infrastructure strategy; official materials describe him as consolidating prior fintech ventures into the OpenPayd platform.
    claimRefs:
    - CO017
    - CO019
  foundingLocation: London, UK
  headquarters: London, UK
  productSummary: OpenPayd offers a multi-product infrastructure stack spanning pay-ins, payouts, virtual IBANs, multi-currency and pooled accounts, banking-as-a-service, foreign exchange, open banking, stablecoins, and embedded-finance APIs.
  customerFocus: B2B customers with complex money movement needs, especially fintechs, digital-asset businesses, exchanges, treasury-heavy operators, marketplaces, remittance providers, and other platforms that need regulated cross-border payment and account orchestration.
  businessModel: Primarily infrastructure monetization across payment processing, payout rails, account provisioning, FX-related services, treasury workflows, and stablecoin-linked orchestration. Public sources suggest a high-volume, low-take-rate financial infrastructure model rather than a consumer or high-SaaS-margin model.
  stage: Late-stage private
  fundingStatus: Definitive business combination with Titan Acquisition Corp. announced on 2026-06-01 at a $1.145B pro-forma equity valuation, targeting Nasdaq listing under ticker OP with up to $276M gross proceeds assuming no shareholder redemptions and expected Q4 2026 close.
