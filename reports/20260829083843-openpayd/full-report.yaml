      - number: '7.3'
        title: Operational Complexity and Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, OpenPayd is trying to run a broad and increasingly ambitious infrastructure platform.
              Payments, accounts, APIs, FX, and stablecoin-linked features all appear in the public product set. Even
              without public outage evidence, that breadth implies non-trivial engineering, testing, compliance, and
              operational-coordination risk. The source set does not expose uptime, latency, incident frequency, or
              release-discipline metrics, so outside observers cannot verify whether operational maturity is keeping
              pace with commercial scope.


              Dependency risk compounds the issue. OpenPayd’s differentiated use cases increasingly rely on ecosystems
              such as Fireblocks and Circle, and customer proofs like DECTA show that those partner-linked workflows can
              sit at the heart of treasury operations. Partner-led growth is valuable, but it can also create hidden
              fragility if routing, settlement, conversion, or compliance depend too heavily on a concentrated set of
              external providers. When a platform’s edge is multi-rail orchestration, partner continuity becomes part of
              the product.
            claimRefs:
              - CR015
