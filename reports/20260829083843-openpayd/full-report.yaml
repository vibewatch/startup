  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Headline Valuation and Implied Multiple
        blocks:
          - type: paragraph
            body: >-
              The starting point for valuation is straightforward. OpenPayd announced a $1.145B pro-forma equity
              valuation alongside disclosure of more than $85M annualized recurring revenue, more than $240B annualized
              transaction volume, 1,100+ customers, and presence in 180 countries. On the disclosed floor ARR, that
              equates to about 13.5x ARR. Because the ARR figure is framed as greater than $85M, the true effective
              multiple could be somewhat lower, but the public record does not say how much lower.


              This means investors are being asked to underwrite more than a basic throughput story. A large volume
              number by itself does not justify a premium multiple when take rates are infrastructural and likely low.
              The market must believe OpenPayd can compound customer value through higher-value workflows, strong
              retention, and optionality in regulated stablecoin infrastructure. Put differently, the announced price is
              not low enough to compensate for uncertainty by default; it assumes at least some premium for strategic
              positioning and future operating leverage.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV018
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
      - number: '8.2'
        title: Comparable Lens and Multiple Framing
        blocks:
          - type: paragraph
            body: >-
              The cleanest publicly fetched valuation comp is Airwallex. Airwallex’s late-2025 official funding
              materials disclosed an $8B valuation and stated that annualized revenue had surpassed $1B in October,
              implying roughly 8x revenue or lower. Sacra’s May 2026 estimate goes further, suggesting Airwallex reached
              about $1.5B ARR and raised around an $11B valuation, implying a multiple near 7.3x. These figures are not
              perfectly comparable to OpenPayd, but they are directionally useful because Airwallex is a scaled global
              fintech infrastructure platform with broad product scope and public momentum.


              That comparison makes OpenPayd’s announced multiple look ambitious. OpenPayd may deserve a partial premium
              for its more explicit European stablecoin and MiCA angle, but public materials do not yet show enough on
              margins, concentration, or retention to justify ignoring the scale gap. The realistic interpretation is
              not that OpenPayd is wildly mispriced; it is that the market is already paying for a lot of future proof.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
