  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Peer Set and Landscape Structure
        blocks:
          - type: paragraph
            body: >-
              OpenPayd does not face one clean apples-to-apples peer group. The closest substitutes span four clusters:
              global payments ecosystems such as Stripe and Adyen; regulated UK/EU infrastructure specialists such as
              ClearBank and Modulr; embedded-finance platforms such as Railsr; and US bank-direct middleware vendors
              such as Treasury Prime and Unit. Marqeta sits somewhat adjacent because its public positioning is
              strongest around card issuing and real-time card controls rather than full account-and-treasury
              orchestration.


              This landscape matters because buyers evaluate vendors through different procurement lenses depending on
              use case. A marketplace expanding within Stripe may naturally compare OpenPayd to Treasury. A UK regulated
              institution may compare it more closely to ClearBank or Modulr. A fintech needing sponsor-bank
              orchestration in the US may prefer Treasury Prime or Unit. The net result is that OpenPayd competes not
              only on feature breadth but on where the customer already lives, which jurisdictions matter, and whether
              stablecoin-linked workflows are part of the requirement set.
            claimRefs:
              - CP001
              - CP002
              - CP024
              - CP025
              - CP031
