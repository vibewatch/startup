      - number: '2.4'
        title: Growth Drivers, Constraints, and Diligence Implications
        blocks:
          - type: paragraph
            body: >-
              The strongest market drivers are speed, programmability, and unified compliance. Circle’s CPN materials
              say cross-border payments can still take more than one business day and cost more than 6%, while
              Fireblocks frames the institutional stablecoin problem as one of fragmented liquidity, integration
              complexity, and inconsistent compliance. Both companies therefore pitch orchestration rather than isolated
              infrastructure: regulated stablecoins, local payment rails, FX, and compliance data need to be stitched
              together in one workflow to create enterprise value. PYMNTS reaches a similar conclusion from the treasury
              side, arguing that the commercial benefit emerges only when FX, liquidity, compliance, settlement, and
              reconciliation collapse into a single programmable corridor.


              The market constraints are equally material. Apideck calls risk management existential and points to
              recent BaaS failures and enforcement episodes, while GMI identifies sponsor-bank and data-access
              tightening as a direct market restraint. Fireblocks’ 2026 survey nevertheless shows high institutional
              intent: 88% of financial institutions have committed or will commit budget in 2026 and 96% expect
              regulation to be favorable or very favorable. For OpenPayd, that combination is encouraging but
              unforgiving. The market is large, budgets are moving, and regulation is improving in parts of Europe, but
              buyers will increasingly reward infrastructure that can demonstrate safeguarding discipline, complaint
              resilience, and stable regulatory pathways—not just fast integrations.
