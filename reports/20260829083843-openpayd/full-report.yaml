companyProfile:
  summary: >-
    OpenPayd is a London-centered financial infrastructure company built around API-driven payments, accounts, FX, open
    banking, and stablecoin-linked money movement. Public evidence suggests a dual-origin story: the core UK operating
    entity SettleGo Solutions Limited was incorporated in 2015, while founder materials describe OpenPayd as being
    formed in 2018 by consolidating earlier fintech efforts into a single platform. The company now positions itself as
    a multi-rail orchestration layer for businesses that need regulated fiat and programmable-money infrastructure
    together. In June 2026, OpenPayd announced a SPAC merger with Titan Acquisition Corp. at a $1.145B valuation and
    disclosed more than $85M ARR, more than $240B annualized transaction volume, and more than 1,100 customers.
