  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Surface and Product Architecture
        blocks:
          - type: paragraph
            body: >-
              OpenPayd’s public site describes a platform composed of reusable money-movement primitives rather than one
              monolithic product. The clearest structural pattern is the grouping of capabilities into payments,
              accounts, and trading/digital-asset functions. Payments includes receiving money, sending money, and
              open-banking pay-by-bank flows. Accounts includes virtual IBANs, multi-currency accounts, pooled accounts,
              corporate accounts, and banking-as-a-service. Trading and programmable-money functions include FX,
              stablecoins, and the broader narrative around moving between fiat and digital assets.


              This matters because it suggests a multi-rail architecture that can support different customer workflows
              without forcing a buyer to stitch together many separate vendors. The account primitives are especially
              important: virtual IBANs, pooled accounts, and multi-currency accounts imply a ledger and
              account-allocation model that can support platform customers managing downstream end users. In effect, the
              public product taxonomy already reveals OpenPayd’s design intent: to become the orchestration layer that
              sits above local rails, treasury actions, and digital-asset-linked settlement paths.
