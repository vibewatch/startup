  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Disclosed Scale and Efficiency Signals
        blocks:
          - type: paragraph
            body: >-
              The de-SPAC materials provide enough to frame OpenPayd as a late-stage financial infrastructure company,
              but not enough to model it like a fully disclosed public company. More than $85M ARR, more than $240B
              annualized transaction volume, 1,100+ customers, and operations in 180 countries together describe a
              platform with substantial global reach. Those figures are not trivial for a private fintech and help
              explain why management felt able to pursue a Nasdaq listing at a unicorn valuation.


              At the same time, the disclosed numbers are run-rate metrics rather than a full financial statement
              package. The most informative derived number is that ARR divided by annualized volume lands below 4 basis
              points, which is low in absolute terms but directionally consistent with infrastructure economics. It
              signals a model built on large-value flows and high customer throughput, not on extracting large
              percentage tolls from each transaction. That is not inherently negative, but it puts more weight on
              retention, concentration, and operating leverage than the public materials disclose. It therefore deserves
              to be judged through throughput quality, not just top-line magnitude.
