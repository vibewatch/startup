      - number: '2.2'
        title: 'Sizing Lenses: Flows, Revenue Pools, and Embedded-Finance Revenue'
        blocks:
          - type: paragraph
            body: >-
              The market is undeniably large, but the right lens depends on the question being asked. FXC Intelligence
              provides the broadest flow view, putting the global cross-border payments market at $208 trillion in 2025
              and the associated revenue pool at $625 billion. That framing is useful for understanding the scale of
              money movement, but it is not equivalent to OpenPayd’s immediate serviceable revenue opportunity because
              large portions of that flow still sit in bank-to-bank, wholesale, or corridor-specific activity that a
              platform provider may not address directly.


              A second lens comes from embedded-finance research. Global Market Insights places the embedded-finance
              market at $180.5 billion in 2026 after $149.1 billion in 2025, while Custom Market Insights offers a lower
              2026 estimate of $116.7 billion. Apideck, citing BCG and Adyen, gives a $185 billion addressable
              embedded-finance revenue figure for SaaS platforms with less than 20% currently captured. The variation is
              not a contradiction so much as a scope warning: some estimates are global multi-vertical revenue pools,
              some focus on distribution through SaaS, and some include infrastructure categories more directly relevant
              to OpenPayd. The practical conclusion is that OpenPayd’s SAM should be underwritten from the narrower
              intersection of B2B cross-border, API-led treasury, and regulated stablecoin workflows rather than by
              quoting one enormous TAM number in isolation.
