  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              OpenPayd does not sell consumer banking directly; it sells the infrastructure that lets other businesses
              embed financial services into their own products and treasury workflows. The most accurate market boundary
              therefore spans embedded accounts, domestic and cross-border payments, FX, Open Banking connectivity,
              banking-as-a-service enablement, and stablecoin-linked treasury operations. That market is defined less by
              a single end product than by the orchestration layer that makes money movement programmable across rails,
              assets, and jurisdictions.


              This definition matters because the top-down “embedded finance” label can become too broad to be useful.
              OpenPayd is not competing for all financial activity conducted inside software. It is most relevant where
              businesses need regulated account infrastructure, multi-currency balances, API-triggered payouts,
              cross-border settlement, and increasingly a bridge between fiat and digital-asset rails. The main
              substitutes are still legacy correspondent banking, a patchwork of local PSPs and bank integrations, and
              internal treasury stacks built by customers themselves. Those substitutes remain viable, but they are
              slower to deploy, harder to reconcile, and less adaptable when businesses want to expand into new markets
              or asset types.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
