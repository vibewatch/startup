      - number: '2.3'
        title: Buyer, User, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The most visible OpenPayd customers—eToro, Kraken, B2C2, and DECTA—suggest a buyer profile centered on
              fintechs, brokers, digital-asset platforms, and treasury-heavy businesses. In these deployments, the
              direct buyer is rarely the end user moving funds. Instead, a platform or enterprise buys infrastructure so
              that its own customers or internal teams can open accounts, settle faster, reconcile flows automatically,
              or move between fiat and stablecoins more efficiently. This makes the buyer/user/payer split more complex
              than in ordinary SaaS: product, treasury, payments, compliance, and operations teams all influence the
              purchase, while monetization may occur through platform take rates, spread, or improved customer retention
              downstream.


              The adoption path also tends to be sequential rather than all-at-once. Businesses first solve the basic
              account-and-payment problem, then add FX, payout routing, and treasury automation, and only later
              introduce stablecoin-linked workflows or digital-asset settlement once control, compliance, and reporting
              are in place. That sequencing matters for OpenPayd because the company’s public roadmap and case studies
              show it winning first on infrastructure utility, then using adjacent capabilities to deepen wallet share.
              The adoption decision is therefore tied not only to headline market growth but to whether a provider can
              compress integration effort while preserving compliance and operational visibility.
            claimRefs:
              - CM016
              - CM017
              - CM018
              - CM019
