      - number: '7.2'
        title: Transaction, Listing, and Market Risk
        blocks:
          - type: paragraph
            body: >-
              The de-SPAC transaction adds its own layer of uncertainty. OpenPayd has announced attractive headline
              proceeds and a large valuation, but the 8-K makes clear that cash delivery depends on redemption behavior
              and the broader closing process. That matters because a transaction marketed as a balance-sheet upgrade
              can end up materially less powerful if market conditions shift or if public investors discount the
              business before close. Public-market scrutiny also introduces a second-order risk: OpenPayd is presenting
              a scale and growth narrative before the public source set offers much clarity on margins or durability.


              The market context is also unforgiving. The cross-border and embedded-finance opportunity is enormous, but
              size brings competition rather than protection. Stripe, ClearBank, Modulr, and similar players can
              challenge OpenPayd with distribution strength, bank trust, or automation depth. The practical question is
              not whether OpenPayd has an opportunity, but whether it can preserve differentiated economics while larger
              or better-distributed rivals move into overlapping workflows.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
