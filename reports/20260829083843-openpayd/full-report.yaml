      - number: '1.3'
        title: Nasdaq Listing Context and Capital Formation
        blocks:
          - type: paragraph
            body: >-
              OpenPayd remains private as of the 2026-08-29 run date, but it entered the public-markets process in a
              consequential way on 1 June 2026 by announcing a definitive business combination with Titan Acquisition
              Corp. The transaction would list OpenPayd on Nasdaq under ticker OP and assigns the company a $1.145
              billion pro-forma equity valuation. Public SEC-linked materials indicate that OpenPayd could receive up to
              $276 million of gross proceeds from Titan’s trust account if redemptions remain low. The company framed
              those proceeds as balance-sheet reinforcement plus fuel for technology, hiring, licensing, and U.S.
              expansion.


              These same documents supply the core top-line traction metrics for underwriting the listing story: more
              than $85 million of annualized recurring revenue and more than $240 billion of annualized transaction
              volume as of March 2026. That is enough to support late-stage scale, but not enough to establish full
              financial quality because the reviewed public materials still do not provide audited profitability,
              margin, cohort-retention, or cash-balance detail. SEC process language also matters. Titan’s 8-K confirmed
              the filing path and stated that an F-4 or related transaction materials would be made available through
              the SEC, implying that deeper diligence should migrate quickly from press-style disclosure into
              securities-grade documentation as the de-SPAC proceeds toward the expected Q4 2026 close.
