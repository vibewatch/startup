      - number: '3.3'
        title: Pricing Transparency, Distribution Power, and Switching Costs
        blocks:
          - type: paragraph
            body: >-
              Pricing visibility is uneven across the competitor set. Stripe discloses no monthly fee or minimum balance
              on its public Treasury page, while most other vendors push buyers into demo-led enterprise sales. That
              alone is not determinative, but it reveals how distribution models differ. Stripe and Adyen can attach
              financial infrastructure to much broader commercial relationships; they do not need to win the full
              account on infrastructure alone. Treasury Prime and Unit, meanwhile, sell compliance control and bank
              connectivity as the package. OpenPayd and Modulr compete more directly on infrastructure substance and
              workflow fit.


              Switching cost is therefore not just a product question. If a customer only needs card issuing or a
              limited payment corridor, multi-homing is viable and moat is weaker. But once the provider sits at the
              center of accounts, payout routing, FX, reconciliation, and compliance controls, migration becomes
              operationally expensive and risky. OpenPayd’s strategic goal should be to win those deeper workflow
              positions before larger ecosystems use bundling power to commoditize the outer layers of the stack.
            claimRefs:
