  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A directly fetched and authoritative current headcount disclosure tied to a date near runDate.
    whyItMatters: Headcount is one of the requested cover metrics and helps judge operating leverage versus the disclosed ARR and volume base.
    diligencePath: Use the F-4, investor presentation, or management materials rather than indirect databases to confirm current employee count.
