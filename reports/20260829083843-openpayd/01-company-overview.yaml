- id: formation-and-leadership
  title: Formation History and Leadership Structure
  body: 'The reviewed evidence suggests OpenPayd has a two-layer origin story that is important for diligence. Companies House shows that the core UK operating entity, SettleGo Solutions Limited, was incorporated on 30 April 2015 and originally traded as Facekart Limited until February 2018. By contrast, founder materials state that Dr Ozan Özerk founded OpenPayd in 2018 by consolidating earlier fintech ventures into one platform. The best synthesis is that the legal operating shell predates the full OpenPayd platform brand and strategy. That distinction is material because it reconciles the competing 2015-versus-2018 founding dates that appear in public coverage.


    Leadership disclosure is clear at the executive level even though the public board roster remains limited in the reviewed materials. OpenPayd’s team page lists Özerk as founder and Iana Dimitrova as chief executive officer, and the June 2026 de-SPAC materials repeat Dimitrova’s CEO title while quoting Özerk as founder. The same team page identifies David Bull as CFO, Yasemin Swanson as COO, Lux Thiagarajah as CCO, Aysun Ahi as CPO, and Barry O''Sullivan as chief banking officer. For investors, this indicates an identifiable operating bench across finance, operations, commercial, people, and banking functions. The governance caveat is that the company publicly exposes management roles much more clearly than committee or board structure, leaving some governance diligence to post-F-4 materials or direct management follow-up.'
