company:
  name: OpenPayd
chapter:
  number: 1
  title: Company Overview
  summary: OpenPayd is a London-headquartered embedded-finance infrastructure platform that combines fiat payments, accounts, FX, Open Banking, and digital-asset rails through one API. Public June 2026 de-SPAC materials frame the company as a late-stage private fintech pursuing a Nasdaq listing under ticker OP at a $1.145 billion pro-forma equity value, with more than $85 million ARR, more than $240 billion annualized volume, and more than 1,100 customers across 180 countries as of March 2026. Official sources also show a meaningful compliance-and-dispute overlay, including Maltese complaint proceedings and a UK counterparty dispute, which tempers an otherwise strong scale and regulatory-footprint narrative.
sections:
- id: identity-and-footprint
  title: Identity, Product Scope, and Regulatory Footprint
  body: 'OpenPayd presents itself as a universal financial infrastructure layer for the digital economy rather than as a point product. Across its homepage, API materials, and June 2026 listing documents, the company consistently describes a rails-agnostic platform that allows businesses to move and manage money across fiat rails, blockchain networks, and stablecoins through a single API. The recurring product components are embedded accounts, domestic and international payments, FX, Open Banking, and stablecoin on/off ramps. That positioning matters because it places OpenPayd in the higher-value orchestration layer of embedded finance rather than in a single geography or payments corridor only.


    The regulatory architecture is also more substantial than a typical software-only fintech. OpenPayd’s legal group overview shows a multi-entity structure: SettleGo Solutions Limited for UK e-money activity, a Malta EMI for payment services, a French branch passporting structure, OP Digital Services Limited for regulated crypto-asset activity in Malta, and a Canadian money-services-business registration. Combined with public claims of reach across the United States, United Kingdom, EEA, Canada, and South Africa, the evidence supports the view that OpenPayd has spent years building regulated operating coverage to support cross-border money movement. Public office disclosures anchor the commercial center in London while also showing operational presence in Malta and Sofia, with founder materials pointing to additional footprint in the Netherlands, South Africa, and the United States.'
  claimRefs:
