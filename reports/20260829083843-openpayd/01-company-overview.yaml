    severity: material
    topic: capital-structure
    missingEvidence: Round-by-round total capital raised, any secondaries, and any debt or warehouse facilities outstanding prior to de-SPAC close.
    whyItMatters: The company is entering a public-market process, but public materials reviewed here do not yet provide a full pre-close capital-stack history.
    diligencePath: Review the SEC registration statement and cap-table disclosures once filed, then reconcile with management and investor materials.
