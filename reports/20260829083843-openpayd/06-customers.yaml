- id: risks-and-gaps
  title: Customer Risks, Concentration, and Evidence Gaps
  body: 'The biggest limitation of the public customer record is what it cannot show. There is no public net revenue retention, gross logo retention, churn rate, cohort expansion rate, or top-customer concentration disclosure in the fetched source set. That makes it impossible to know whether OpenPayd is winning many medium accounts, a few very large ones, or some combination of both. Because the most visible customer proofs skew toward digital-asset and treasury-heavy businesses, concentration in a narrower set of high-volume use cases is plausible. That could be an advantage if OpenPayd owns a difficult niche, but a vulnerability if that niche experiences cyclicality or regulatory shocks.


    Adverse customer evidence also exists, though it is sparse. The QuidPay dispute and the Malta arbiter decision do not establish systemic dissatisfaction, but they are reminders that regulated money movement businesses do generate public complaints and counterparty conflict. Given how positive the rest of the public proof set is, the absence of systematic satisfaction and complaint-rate data is itself a material diligence issue.'
