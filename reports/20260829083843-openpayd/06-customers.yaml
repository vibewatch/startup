- id: TU005
  title: Customer risk register
  columns:
  - Risk or gap
  - Why it matters
  - Current public evidence
  - Diligence ask
  rows:
  - - Revenue concentration unknown
    - A few large platforms could dominate volume or ARR
    - Named logos are visible, revenue mix is not
    - Request top-customer ARR and volume mix
  - - Retention / churn undisclosed
    - Win announcements do not prove durability
    - No public NRR or churn metrics found
    - Request cohort retention and expansion history
  - - Sector concentration
    - Digital-asset-heavy customer density could amplify volatility
    - Named proof skews toward crypto-adjacent flows
    - Model ARR and volume by vertical
  - - Complaint / dispute leakage
    - Public disputes can indicate servicing friction or contract complexity
    - QuidPay dispute and Malta complaint are public
    - Review complaint rates and litigation history
  - - Referenceability bias
    - Public case studies usually showcase only best outcomes
    - Source set is dominated by positive proof
    - Request blind customer reference calls including lost or at-risk accounts
  notes: This register highlights the limits of customer proof built mostly from public wins and case studies.
