company:
  name: OpenPayd
chapter:
  number: 6
  title: Customers
  summary: 'OpenPayd’s customer evidence points to a business serving complex, high-throughput financial workflows rather than generic merchants or consumers. Named proofs cluster around digital-asset platforms, treasury-heavy operators, and embedded-finance customers such as Kraken, Bitfinex, Wirex, B2C2, DECTA, Wincent, RedotPay, and eToro, while solution pages expand the target ICP to marketplaces, remittance, payroll, brokerage, iGaming, and insurtech. The strengths are clear: sticky infrastructure use cases, fast money movement, account orchestration, and growing stablecoin-linked utility. The weakness is also clear: public sources show wins and use cases, but do not yet show concentration, retention, or systematic satisfaction data.'
sections:
- id: segment-map
  title: Customer Segments and Ideal Customer Profiles
  body: 'OpenPayd’s public customer story is resolutely B2B. The company is not marketing a consumer wallet or retail financial app; it is marketing infrastructure to businesses that need regulated money movement embedded inside their own operations or products. The solution pages span fintech, digital assets, marketplaces, remittance, iGaming, brokerage, payroll, and insurtech. That breadth signals a fairly horizontal go-to-market ambition, but the common denominator is operationally complex funds movement rather than industry identity alone.


    The named-logo proof suggests the center of gravity still sits in financial platforms and especially in digital-asset-adjacent workflows. Kraken, Bitfinex, B2C2, Wincent, Wirex, RedotPay, and Ripple-linked infrastructure all point in that direction. DECTA and Circle-related business-payment proofs widen the picture somewhat, but even those still revolve around treasury and regulated payment operations. The upshot is that OpenPayd’s true ICP is best described as businesses with messy, cross-border, or always-on money movement requirements, especially where both fiat and newer programmable-money rails matter.'
