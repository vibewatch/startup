company:
  name: OpenPayd
chapter:
  number: 5
  title: Product & Tech
  summary: OpenPayd’s public product story is that of a broad, API-led financial infrastructure stack rather than a narrow payments API. The company exposes modules across payments, accounts, FX, open banking, stablecoins, and embedded finance, then repackages those primitives into vertical solutions for fintechs, digital-asset businesses, marketplaces, remittance operators, and iGaming. Public docs and sandbox access support a genuine developer-integration posture, while Circle, Fireblocks, and MiCA strengthen the programmable-money narrative. The upside is a differentiated multi-rail architecture; the risk is that public sources still do not prove the underlying reliability, observability, or implementation quality of such a broad regulated surface.
sections:
- id: platform-surface
  title: Platform Surface and Product Architecture
  body: 'OpenPayd’s public site describes a platform composed of reusable money-movement primitives rather than one monolithic product. The clearest structural pattern is the grouping of capabilities into payments, accounts, and trading/digital-asset functions. Payments includes receiving money, sending money, and open-banking pay-by-bank flows. Accounts includes virtual IBANs, multi-currency accounts, pooled accounts, corporate accounts, and banking-as-a-service. Trading and programmable-money functions include FX, stablecoins, and the broader narrative around moving between fiat and digital assets.


    This matters because it suggests a multi-rail architecture that can support different customer workflows without forcing a buyer to stitch together many separate vendors. The account primitives are especially important: virtual IBANs, pooled accounts, and multi-currency accounts imply a ledger and account-allocation model that can support platform customers managing downstream end users. In effect, the public product taxonomy already reveals OpenPayd’s design intent: to become the orchestration layer that sits above local rails, treasury actions, and digital-asset-linked settlement paths.'
  claimRefs:
  - CE001
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  - CE011
  - CE013
