- id: TE005
  title: Product-tech risk register
  columns:
  - Risk
  - Why it exists
  - Potential impact
  - Public evidence
  - Diligence ask
  rows:
  - - Surface-area complexity
    - Many modules across regulated rails and stablecoins
    - Longer implementation cycles or bugs
    - Broad product map and regulated footprint
    - Request architecture and service-boundary diagrams
  - - Operational maturity uncertainty
    - Public docs do not expose SLA or incident history
    - Harder to assess production reliability
    - Developer hub exists but depth limits remain
    - Request uptime, latency, and major-incident record
  - - Compliance coupling
    - Product value depends partly on regulatory perimeter
    - Feature rollout can be constrained by jurisdiction
    - MiCA and entity structure are central to product story
    - Request change-management and regulatory release process
  - - Partner dependency
    - Key digital-asset workflows rely on external networks and partners
    - Dependency failures could disrupt differentiated use cases
    - Circle and Fireblocks are visible in product story
    - Request contingency design and vendor concentration data
  - - Velocity risk
    - Broad platform ambition can slow roadmaps if tooling is weak
    - Larger peers may out-ship on core features
    - No public release or versioning metrics found
    - Request engineering productivity and release cadence metrics
  notes: The risks here are about execution quality, not whether the module names exist on the website.
