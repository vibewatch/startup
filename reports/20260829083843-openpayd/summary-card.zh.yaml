  topStrengths:
    - 多轨产品栈覆盖支付、账户、外汇、开放银行和稳定币，为复杂客户流程拼出差异化基础设施故事。
    - 公开披露的 $85M+ ARR、$240B+ 年化交易量和 1,100+ 客户，说明公司已有真正后期牵引力，不只是早期承诺。
    - MiCA 授权，以及 Circle / Fireblocks 生态中的可见扩张，增强了 OpenPayd 在受监管稳定币金融中的战略相关性。
    - Kraken、Bitfinex、Wirex、B2C2、DECTA 和 RedotPay 等实名客户证据表明，OpenPayd 在高价值运营场景里嵌入较深。
    - 如果募集资金接近公布的零赎回情景，经 Titan 登陆 Nasdaq 的路径可能显著增强资产负债表。
  topRisks:
    - 公开可得的盈利能力、利润率、留存和集中度数据仍稀薄，削弱了对两位数 ARR 倍数的信心。
    - de-SPAC 到账现金取决于赎回情况，因此估值和实际资产负债表增强不是同一件事。
    - 已披露客户证据偏向数字资产和资金管理场景，意味着真实集中度可能比 1,100+ 客户标题指向的垂直范围更窄。
    - 公开来源已能看到监管与法律摩擦，包括 Malta 投诉程序和 QuidPay 纠纷。
    - Stripe、ClearBank、Modulr 和 Airwallex 等更大对手可用分销、信任或更广披露规模挤压稀缺性溢价。
  unresolvedGaps:
    - 抓取的公开来源集中没有经审计财务报表，也没有线下项目盈利能力明细。
    - 净收入留存、总留存和队列扩张指标未披露。
    - 按客户、垂直和地域划分的收入与支付量集中度未披露。
    - 正常运行时间、事故历史和实施速度等运营可靠性数据仍为私有信息。
    - 仍需要交割后 F-4/S-4 级别细节和赎回情景融资计划，才能以更高置信度承销公布估值。
