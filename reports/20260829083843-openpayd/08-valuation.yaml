- id: scenario-range
  title: Scenario Range and Valuation Envelope
  body: 'Using only public information, a scenario framework is more honest than a single-point target. A bear case at roughly 7x the disclosed ARR floor yields about $595M. A base case at 10x yields about $850M. The announced deal itself effectively sets the bull case at 13.5x, or about $1.145B. A stretch case around 16x would imply about $1.36B, but that would require conviction that OpenPayd’s real ARR is comfortably above the floor, that customer stickiness is high, and that public markets are ready to assign premium value to regulated stablecoin infrastructure.


    The key point is not that any one scenario is certainly correct. It is that the announced transaction is already sitting close to the upper end of what public evidence alone can comfortably support. If the full cash proceeds arrive, MiCA-driven adoption accelerates, and Circle/Fireblocks materially increase product density, the high-end framing becomes easier to defend. If not, the downside valuation path is meaningful.'
