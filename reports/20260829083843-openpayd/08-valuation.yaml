  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: margin-and-retention
    missingEvidence: No public gross margin, net revenue retention, or cohort economics were located to support a premium infrastructure multiple confidently.
    whyItMatters: Low apparent take-rate infrastructure businesses need proof of retention and operating leverage to justify double-digit ARR multiples.
    diligencePath: Request audited product-level gross margin, NRR, GRR, and attach-rate metrics.
    relatedQuestionRefs:
    - QV013
    - QV024
    - QV030
    relatedTableRefs:
    - TV003
    - TV005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
