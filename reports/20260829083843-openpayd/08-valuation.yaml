- id: comp-lens
  title: Comparable Lens and Multiple Framing
  body: 'The cleanest publicly fetched valuation comp is Airwallex. Airwallex’s late-2025 official funding materials disclosed an $8B valuation and stated that annualized revenue had surpassed $1B in October, implying roughly 8x revenue or lower. Sacra’s May 2026 estimate goes further, suggesting Airwallex reached about $1.5B ARR and raised around an $11B valuation, implying a multiple near 7.3x. These figures are not perfectly comparable to OpenPayd, but they are directionally useful because Airwallex is a scaled global fintech infrastructure platform with broad product scope and public momentum.


    That comparison makes OpenPayd’s announced multiple look ambitious. OpenPayd may deserve a partial premium for its more explicit European stablecoin and MiCA angle, but public materials do not yet show enough on margins, concentration, or retention to justify ignoring the scale gap. The realistic interpretation is not that OpenPayd is wildly mispriced; it is that the market is already paying for a lot of future proof.'
