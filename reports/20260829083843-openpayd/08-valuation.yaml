chapter:
  number: 8
  title: Valuation
  summary: 'OpenPayd’s announced $1.145B de-SPAC valuation equates to roughly 13.5x the disclosed $85M ARR floor, which is a serious multiple for a business that remains only partially disclosed. The bull case is that MiCA, Fireblocks, Circle, and multi-rail embedded-finance infrastructure create strategic scarcity and upside beyond the current ARR floor. The bear case is that larger peers such as Airwallex appear to command lower implied revenue multiples while offering much broader public proof on scale. On balance, the announced price looks full but not indefensible: near the high end of a reasonable public-information range, with fair value more likely below or around the transaction mark than comfortably above it.'
sections:
- id: headline-multiple
  title: Headline Valuation and Implied Multiple
  body: 'The starting point for valuation is straightforward. OpenPayd announced a $1.145B pro-forma equity valuation alongside disclosure of more than $85M annualized recurring revenue, more than $240B annualized transaction volume, 1,100+ customers, and presence in 180 countries. On the disclosed floor ARR, that equates to about 13.5x ARR. Because the ARR figure is framed as greater than $85M, the true effective multiple could be somewhat lower, but the public record does not say how much lower.


    This means investors are being asked to underwrite more than a basic throughput story. A large volume number by itself does not justify a premium multiple when take rates are infrastructural and likely low. The market must believe OpenPayd can compound customer value through higher-value workflows, strong retention, and optionality in regulated stablecoin infrastructure. Put differently, the announced price is not low enough to compensate for uncertainty by default; it assumes at least some premium for strategic positioning and future operating leverage.'
