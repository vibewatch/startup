            body: >-
              OpenPayd 的公开网站描述的是一个由可复用资金流转原语组成的平台，而不是单一整体产品。最清晰的结构模式，是把能力分为支付、账户和交易 / 数字资产功能。
              支付包括收款、付款和开放银行账户直付流程。账户包括虚拟 IBAN、多币种账户、集合账户、企业账户和银行即服务。 交易和可编程货币功能包括 FX、稳定币，以及围绕法币与数字资产之间切换的更大叙事。


              这一点重要，因为它暗示一种多轨道架构，能支撑不同客户工作流，而不强迫买方把许多分散供应商缝在一起。账户原语尤其关键： 虚拟
              IBAN、集合账户和多币种账户意味着一套账本和账户分配模型，可支持平台客户管理下游终端用户。实际上， 公开产品分类已经暴露了 OpenPayd
