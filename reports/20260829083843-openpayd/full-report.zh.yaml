      - number: '8.3'
        title: 情景区间与估值边界
        blocks:
          - type: paragraph
            body: >-
              只用公开信息，情景框架比单点目标更诚实。悲观情景按披露 ARR 下限约 7x 计算，得到约 $595M。基准情景按 10x 计算，得到约 $850M。已宣布交易本身相当于把乐观情景定在 13.5x，即约
              $1.145B。拉伸情景若到约 16x，则隐含约 $1.36B；但成立前提是确信 OpenPayd 真实 ARR 明显高于下限、客户粘性很高，且公开市场愿意给受监管稳定币基础设施溢价。


              关键不在于哪一个情景一定正确，而在于，已宣布交易已经贴近仅凭公开证据能够舒服支撑的上沿。如果全部现金收益到位、MiCA 驱动的采用加速、Circle/Fireblocks
              显著提高产品密度，高端框架会更容易辩护。否则，下行估值路径很有分量。
