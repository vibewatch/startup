  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、合规与法律风险
        blocks:
          - type: paragraph
            body: >-
              OpenPayd 的监管边界同时是强项和风险。公司的实体结构和 MiCA 进展构成了商业故事的一部分，尤其对稳定币相关基础设施而言。
              这意味着监管执行不只是后台合规事项；它会直接影响产品可信度、获客，以及公司更广泛的“可信基础设施供应商”主张。 宽泛的多司法辖区布局自然会提高治理、牌照、客户资金保护或变更管理流程的管理复杂度。


              公开负面来源强化了这种谨慎。马耳他仲裁案显示，投诉可能在监管足迹内浮现；QuidPay 争议则说明商业冲突可能演变为正式诉讼。 两个来源都不能证明系统性弱点，但合在一起，使得把 OpenPayd
              视为没有诉讼或没有投诉并不合理。对受监管金融基础设施供应商来说， 即使是孤立法律问题，也可能带来超比例的声誉和运营后果，因为客户购买的不只是软件，还有信任。
