      - number: '1.2'
        title: 成立脉络与领导层结构
        blocks:
          - type: paragraph
            body: >-
              已审阅证据显示，OpenPayd 有一条对尽调很关键的双层起源故事。Companies House 显示，核心英国运营实体 SettleGo Solutions Limited 于 2015 年 4 月 30
              日成立，最初以 Facekart Limited 名义运营，直到 2018 年 2 月。相较之下，创始人材料称 Dr Ozan Özerk 在 2018 年把此前的金融科技业务整合为一个平台，从而创立
              OpenPayd。最合理的综合判断是：法律运营壳早于完整的 OpenPayd 平台品牌和战略。 这个区分很重要，因为它解释了公开报道中 2015 与 2018 两个创立年份为何并存。


              高管层面的披露较清晰，尽管已审阅材料中的公开董事会名单仍有限。OpenPayd 团队页面列出 Özerk 为创始人、Iana Dimitrova 为首席执行官； 2026 年 6 月 SPAC 合并材料也重复了
              Dimitrova 的 CEO 头衔，并引用 Özerk 的创始人身份。同一团队页面还列出 David Bull 为 CFO、 Yasemin Swanson 为 COO、Lux Thiagarajah 为
              CCO、Aysun Ahi 为 CPO、Barry O'Sullivan 为首席银行官。对投资者来说，
              这说明公司在财务、运营、商业、人力和银行职能上有可识别的运营班底。治理层面的保留意见在于，公司公开呈现管理层角色远比委员会或董事会结构清楚， 一部分治理尽调仍要等 F-4 之后材料或直接管理层访谈补足。
