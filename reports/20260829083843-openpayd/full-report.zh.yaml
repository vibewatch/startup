              公开客户记录最大的限制，是它无法显示的内容。已抓取来源没有公开净收入留存、客户数总留存、流失率、分组扩张率或头部客户集中度。 因此，外部无法知道 OpenPayd
              是赢下了许多中型账户、少数超大账户，还是二者兼有。由于最可见的客户证据偏向数字资产和资金管理较重企业， 集中在一组更窄的高交易量用例上是有可能的。如果 OpenPayd
