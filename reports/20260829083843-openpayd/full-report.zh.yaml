companyProfile:
  summary: >-
    OpenPayd 是一家以伦敦为中心的金融基础设施公司，围绕 API 驱动的支付、账户、FX、开放银行，以及与稳定币挂钩的资金流转搭建。 公开证据指向一条双重起源线索：核心英国运营实体 SettleGo Solutions
    Limited 成立于 2015 年，而创始人材料称 OpenPayd 是在 2018 年把更早的金融科技项目整合进同一个平台后形成。公司如今把自己定位为多轨道编排层，服务需要同时使用受监管法币和可编程货币基础设施的企业。 2026
    年 6 月，OpenPayd 宣布以 $1.145B 估值与 Titan Acquisition Corp. 进行 SPAC 合并，并披露 ARR 超过 $85M、年化交易量超过 $240B、客户超过 1,100 家。
