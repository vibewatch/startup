      - number: '8.4'
        title: 估值立场、折价与下一步尽调
        blocks:
          - type: paragraph
            body: >-
              正确的估值立场要在战略上行和证明缺口之间取平衡。正面看，OpenPayd
              具备真实规模、可见客户牵引力、清晰的多轨产品叙事，以及围绕欧洲受监管稳定币基础设施的可信可选性。凭借规模、客户牵引、多轨产品和稳定币可选性，公司不只是普通支付处理商，也大概率能相对于无差异化嵌入式金融叙事获得溢价。


              负面看，法律和投诉来源存在，竞争替代方案很强，公开材料对利润率、集中度和留存的证明明显偏薄。缺口很重要，因为表观获取费率低的基础设施业务需要极好的底层业务质量，才能守住溢价倍数。今天最可辩护的结论是，公布价格偏满但不明显荒谬：大致公允到略贵，估值信心更多受披露缺失限制，而不是市场机会不足。任何按交易标记或更高价格投资的决定，都应重度依赖私下尽调，而不是只看
              ARR 标题。
