  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 已披露规模与效率信号
        blocks:
          - type: paragraph
            body: >-
              SPAC 合并材料足以把 OpenPayd 定位为后期金融基础设施公司，但还不足以像完整披露的上市公司那样建模。超过 $85M ARR、超过 $240B 年化交易量、1,100+ 客户，以及覆盖 180
              个国家，合在一起描绘了一个具备相当全球触达的平台。对一家私营金融科技企业来说， 这些数字并不小，也解释了管理层为什么认为自己可以以独角兽估值冲刺 Nasdaq 上市。


              同时，已披露数字是年化口径指标，而不是完整财报包。最有信息量的派生数字是：ARR 除以年化交易量低于 4 个基点，
              绝对值偏低，但方向上符合基础设施经济学。它指向一个建立在大额资金流和高客户吞吐上的模式，而不是从每笔交易中抽取高比例通行费。
              这不天然负面，但会把更多权重放到留存、集中度和运营杠杆上，而这些公开材料并未披露。因此，评价它时应看吞吐质量，而不只是收入端规模。
