              - CV005
              - CV007
      - number: '8.2'
        title: 可比公司视角与倍数框架
        blocks:
          - type: paragraph
            body: >-
              公开可获取的最干净估值可比是 Airwallex。Airwallex 2025 年末官方融资材料披露估值 $8B，并称 10 月年化收入已超过 $1B，隐含约 8x 收入或更低。Sacra 2026 年 5
              月的估算更进一步，认为 Airwallex 达到约 $1.5B ARR，并以约 $11B 估值融资，隐含倍数接近 7.3x。两组数字不能与 OpenPayd 完全对表，但具备方向价值，因为 Airwallex
              是规模化全球 fintech 基础设施平台，产品范围更广、公开动能也更强。


              与 Airwallex 对比，OpenPayd 公布的倍数显得偏进取。OpenPayd 更明确押注欧洲稳定币和 MiCA
              角度，可能值得部分溢价；但公开材料在利润率、集中度或留存上仍不足以让人忽略规模差距。更现实的解读不是 OpenPayd 被严重错价，而是市场已经在为大量未来证明买单。
