      - number: '3.3'
        title: 定价透明度、分发能力与切换成本
        blocks:
          - type: paragraph
            body: >-
              竞争对手之间的定价可见度并不均衡。Stripe 的公开 Treasury 页面不披露月费或最低余额，而多数其他供应商把买方推向演示驱动的企业销售。 这一点本身不能决定胜负，但揭示了分发模式的差异。Stripe 和
              Adyen 可以把金融基础设施附着在更广泛的商业关系上， 不需要只靠基础设施拿下整个账户。与此同时，Treasury Prime 和 Unit 销售的是合规控制与银行连接这一整包能力。 OpenPayd 和
              Modulr 则更直接地在基础设施实质和工作流匹配度上竞争。


              切换成本因此不只是产品问题。如果客户只需要发卡或有限支付走廊，多栖部署可行，护城河也更弱。但一旦供应商坐到账户、付款路由、FX、对账和合规控制的中心， 迁移就会变得运营成本高且风险大。OpenPayd
              的战略目标应是在更大生态用捆绑能力把技术栈外层商品化之前，先赢下这些更深的工作流位置。
