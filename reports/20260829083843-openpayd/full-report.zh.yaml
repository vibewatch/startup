  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 同业集合与格局结构
        blocks:
          - type: paragraph
            body: >-
              OpenPayd 面对的不是一个可直接横向比较的干净同业组。最接近的替代方分为四类：Stripe、Adyen 等全球支付生态； ClearBank、Modulr 等受监管英国 / 欧盟基础设施专家；Railsr
              等嵌入式金融平台；以及 Treasury Prime、Unit 等美国银行直连中间件供应商。 Marqeta 更偏相邻，因为它的公开定位最强项是发卡和实时卡控，而不是完整账户与资金管理编排。


              这个格局重要，因为买方会按不同用例使用不同采购镜头。已经在 Stripe 体系内扩张的市场平台，可能自然把 OpenPayd 与 Treasury 比较。 英国受监管机构可能更接近地比较 ClearBank 或
              Modulr。需要美国发起银行编排的金融科技企业，可能更偏好 Treasury Prime 或 Unit。 最终结果是，OpenPayd
              的竞争不只看功能宽度，还要看客户原本身处哪个生态、哪些司法辖区重要，以及与稳定币挂钩的工作流是否属于需求集。
