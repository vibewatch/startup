      - number: '3.2'
        title: 能力、监管站位与信任对比
        blocks:
          - type: paragraph
            body: >-
              最可见的能力差异体现在牌照站位和产品范围上。Stripe Treasury 强调多币种账户、稳定币接入，以及具备全球覆盖的付款能力。 Adyen
              通过单一集成，把嵌入式支付、账户、卡和资本放在同一品牌下。ClearBank 的优势不同：它以完全受监管银行身份销售信任和资产负债表实力， 并直接引用央行级客户资金保护。Modulr
              强调单平台自动化，以及已披露的支付和账户规模。Treasury Prime 和 Unit 则突出直连银行关系、 合规控制和模块化嵌入式银行栈。


              OpenPayd 最强的差异点在于，它比很多同业更明确地把传统轨道和数字资产基础设施连接进同一个平台叙事。MiCA 强化了这种欧洲差异化， 尤其适用于需要受监管路径进入稳定币结算的客户。反面是，OpenPayd
              必须与在特定市场拥有更强传统分发或更深牌照实力的对手竞争。 因此，采购决策很可能会在“谁的生态最宽”和“谁能安全跑最难的工作流”之间分化。
