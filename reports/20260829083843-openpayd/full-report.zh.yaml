  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现有替代方案
        blocks:
          - type: paragraph
            body: >-
              OpenPayd 不直接销售消费银行服务；它销售的是基础设施，让其他企业把金融服务嵌入自己的产品和资金管理工作流。最准确的市场边界因此覆盖嵌入式账户、
              境内与跨境支付、FX、开放银行连接、银行即服务能力，以及与稳定币挂钩的资金管理运营。这个市场不是由某个单一终端产品定义， 而是由一层编排能力定义：它让资金可以跨轨道、资产和司法辖区变得可编程。


              这个定义很重要，因为自上而下的“嵌入式金融”标签很容易宽到失去实用性。OpenPayd 并不是在争夺所有发生在软件里的金融活动。 它最相关的场景，是企业需要受监管账户基础设施、多币种余额、API
              触发付款、跨境结算，以及越来越需要在法币与数字资产轨道之间搭桥。 主要替代方案仍是传统代理行、由本地 PSP 和银行集成拼出的补丁，以及客户自建的内部资金管理栈。这些替代方案仍可用，
              但部署更慢、对账更难；当企业想进入新市场或新资产类型时，也不够灵活。
