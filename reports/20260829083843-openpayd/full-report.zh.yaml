      - number: '1.4'
        title: 商业里程碑、验证与负面信号
        blocks:
          - type: paragraph
            body: >-
              上市前叙事被一串可见的产品、客户和认可里程碑加强。OpenPayd 于 2025 年 5 月推出稳定币基础设施，随后在 2025 年 6 月建立 Circle 合作， 次月宣布 Kraken
              法币流转集成。更早的证据包括 2022 年 eToro 嵌入式金融合作、2024 年 B2C2 结算合作； 2026 年又新增马耳他 MiCA 授权、CNBC 顶级金融科技认可、Fireblocks
              网络分发扩张，以及 DECTA 资金结算合作。 合在一起，公开记录支持这样一个判断：公司已经从嵌入式银行和支付扩展到受监管稳定币基础设施，并获得了可信的生态采用。


              平衡项是，OpenPayd 并不是一个毫无争议的干净规模故事。马耳他仲裁材料记录了至少一起 2026 年投诉，涉及 €520,940 赔偿请求以及 OpenPayd 提出的管辖权挑战。另外，2026 年 7 月
              Lewis Silkin 案例摘要称，英国法院命令 OpenPayd 释放一笔数百万英镑规模的 QuidPay 客户资金准备金。
              任一争议本身都不能推翻增长论点，但二者合在一起说明，交易对手风险、客户资金保护解释，以及反欺诈筛查边界问题已经在公开层面浮现。 因此，尽调问题不是 OpenPayd
              是否有牵引力——它显然有——而是合规执行和争议管理能否像商业平台一样干净地扩张。
