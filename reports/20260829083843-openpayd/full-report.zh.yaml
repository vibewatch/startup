  - id: FR004
    title: 信息披露充分性仪表盘
    type: kpi
    summary: 公开证据能清楚标出核验重点，但关键投资判断仍悬而未决。
    data:
      items:
        - label: 监管边界可见度
          value: moderate
          detail: 实体和牌照叙事已公开，但控制细节没有公开。
          tone: neutral
        - label: 交易确定性可见度
          value: moderate
          detail: 有条件募资已披露，但下行情景融资方案没有披露。
          tone: neutral
        - label: 运营可靠性可见度
          value: low
          detail: 未找到公开 SLA 或事件历史数据集。
          tone: negative
        - label: 客户集中度可见度
          value: low
          detail: 有具名证据，但没有集中度数据。
          tone: negative
        - label: 竞争压力可见度
          value: high
          detail: 可比公司和捆绑威胁在公开信息中清晰可见。
          tone: neutral
        - label: 整体投资核验可见度
          value: partial
          detail: 公开来源更能识别风险向量，而不是量化损失严重性。
          tone: neutral
    claimRefs:
      - CR010
      - CR016
      - CR023
      - CR024
      - CR036
      - CR040
  - id: FV001
    title: 估值输入仪表盘
    type: kpi
    summary: 公开输入支撑了真实规模叙事，但也暴露估值多大程度取决于尚未充分披露的质量。
    data:
      items:
        - label: 名义估值
          value: $1.145B
          detail: 公布的 de-SPAC 备考股权估值。
          tone: positive
        - label: ARR 下限
          value: $85M+
          detail: 用于倍数计算的公开 ARR 下限。
          tone: positive
        - label: 隐含 ARR 倍数
          value: ~13.5x
          detail: 基于披露的 ARR 下限。
          tone: neutral
        - label: 年化交易量
          value: $240B+
          detail: 支撑战略重要性的处理量信号。
          tone: positive
        - label: 总募资目标
          value: $276M
          detail: 以无赎回为条件。
          tone: neutral
        - label: 估值证据质量
          value: partial
          detail: 规模已公开；利润率质量没有公开。
          tone: neutral
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV007
  - id: FV002
    title: 可比倍数区间
    type: range
    summary: OpenPayd 的下限倍数高于 Airwallex 最强的公开可比点，估值叙事因此更偏溢价。
    data:
      items:
        - id: airwallex-official
          label: Airwallex 官方视角
          low: 7.5
          value: 8
          high: 8.5
          unit: x ARR/revenue
        - id: airwallex-sacra
          label: Airwallex Sacra 视角
