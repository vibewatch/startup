            body: >-
              OpenPayd
              可见的客户证明很亮眼，但集中在一条相当窄的高吞吐金融工作流带上。如果公司能拿下难服务的数字资产、资金管理和跨境场景，这种集中可能具备战略吸引力；但业务也会更容易受垂直行业冲击影响。公开来源没有披露收入、支付量或毛利的集中度，因此看似分散的客户数量，仍可能掩盖对少数大客户的实质依赖。


              因此，披露风险是整个风险章节的核心。公开材料足以提出正确问题，却不足以给出量化答案。未找到留存率、集中度、毛利率或运营可靠性的公开指标。外部评估因此只能停在方向性风险图谱，而不是精确的概率加权分析。整体判断是，OpenPayd
              有吸引力，战略位置大概率也不错；但证明责任已经转到执行数据上，而公开记录还没有给出。
