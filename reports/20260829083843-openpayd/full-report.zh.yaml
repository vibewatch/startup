      - number: '2.2'
        title: 规模测算视角：资金流、收入池与嵌入式金融收入
        blocks:
          - type: paragraph
            body: >-
              市场无疑很大，但应该用哪把尺子取决于问题本身。FXC Intelligence 给出了最宽的资金流视角：2025 年全球跨境支付市场为 $208T， 相关收入池为
              $625B。这个框架有助于理解资金流转规模，但并不等同于 OpenPayd 眼前可服务收入机会，因为大量资金流仍处在银行间、 批发或特定走廊活动中，平台提供商未必能直接触达。


              第二把尺子来自嵌入式金融研究。Global Market Insights 预计嵌入式金融市场从 2025 年的 $149.1B 增至 2026 年的 $180.5B； Custom Market
              Insights 给出的 2026 年估算较低，为 $116.7B。Apideck 援引 BCG 和 Adyen，给出 SaaS 平台的 $185B 可触达嵌入式金融收入，并称目前捕获比例不足
              20%。这些差异与其说是矛盾，不如说是在提醒范围不同：有些估算是全球多垂直收入池， 有些聚焦 SaaS 分发，有些则纳入与 OpenPayd 更直接相关的基础设施类别。实际结论是，OpenPayd 的 SAM
              应从 B2B 跨境、 API 驱动资金管理和受监管稳定币工作流的更窄交集来承销，而不是孤立引用一个巨大的 TAM 数字。
