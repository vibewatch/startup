  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值摘要与隐含倍数
        blocks:
          - type: paragraph
            body: >-
              估值起点很直接。OpenPayd 公布的备考股权估值为 $1.145B，同时披露 ARR 超过 $85M、年化交易量超过 $240B、客户 1,100+、覆盖 180 个国家。按披露的 ARR 下限计算，约等于
              13.5x ARR。由于 ARR 表述为高于 $85M，真实有效倍数可能略低，但公开记录没有说明低多少。


              投资人因此要承销的不只是一个基础吞吐量故事。当获取费率具备基础设施属性且可能较低时，单纯的大交易量无法支撑溢价倍数。市场必须相信 OpenPayd
              能靠更高价值的工作流、强留存，以及受监管稳定币基础设施的可选性，持续放大客户价值。换句话说，公布价格并不低，不能自动补偿不确定性；公布价格至少已经为战略位置和未来经营杠杆支付了一部分溢价。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV018
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
