      - number: '1.3'
        title: Nasdaq 上市背景与资本形成
        blocks:
          - type: paragraph
            body: >-
              截至 2026-08-29 运行日，OpenPayd 仍是私营公司，但它已在 2026 年 6 月 1 日通过宣布与 Titan Acquisition Corp.
              达成确定性业务合并，实质性进入公开市场进程。该交易将让 OpenPayd 以 OP 代码在 Nasdaq 上市，并给公司赋予 $1.145B 的备考股权估值。SEC
              相关公开材料显示，若赎回率保持较低，OpenPayd 最多可从 Titan 信托账户获得 $276M 总募资。 公司把这笔资金描述为资产负债表强化，以及技术、招聘、牌照和美国扩张的燃料。


              同一批文件给出了支撑上市故事的核心收入端牵引指标：截至 2026 年 3 月，年化经常性收入超过 $85M，年化交易量超过 $240B。
              这足以支撑后期规模判断，但还不足以证明完整财务质量，因为已审阅公开材料仍没有给出经审计盈利、利润率、分组留存或现金余额细节。 SEC 进程用语同样重要。Titan 的 8-K 确认了申报路径，并称 F-4
              或相关交易材料将通过 SEC 提供，这意味着随着 SPAC 合并向预计 2026 年 Q4 完成推进， 更深入尽调应尽快从新闻稿式披露转向证券级文件。
