  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与理想客户画像
        blocks:
          - type: paragraph
            body: >-
              OpenPayd 的公开客户故事坚定面向 B2B。公司并不营销消费钱包或零售金融应用；它营销的是基础设施，服务那些需要把受监管资金流转嵌入自身运营或产品的企业。
              解决方案页面覆盖金融科技、数字资产、市场平台、汇款、在线博彩、券商、薪资和保险科技。这个宽度显示出相当横向的市场进入雄心， 但共同分母不是行业身份本身，而是运营上复杂的资金流转。


              具名客户标识证据显示，重心仍在金融平台，尤其是靠近数字资产的工作流。Kraken、Bitfinex、B2C2、Wincent、Wirex、RedotPay， 以及与 Ripple
              相关的基础设施，都指向这个方向。DECTA 和 Circle 相关企业支付证据让图景稍微变宽，但即便如此，它们仍围绕资金管理和受监管支付运营展开。 结论是，OpenPayd
              的真实理想客户画像最适合描述为：有混乱、跨境或全天候资金流转需求的企业，尤其是法币和更新的可编程货币轨道都重要的场景。
