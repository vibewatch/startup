chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位、产品范围与监管版图
        blocks:
          - type: paragraph
            body: >-
              OpenPayd 不把自己卖成一个单点产品，而是把自己定位为数字经济的通用金融基础设施层。从官网、API 材料到 2026 年 6 月的上市文件， 公司反复强调一个不依赖单一轨道的平台：企业可以通过一个
              API，在法币轨道、区块链网络和稳定币之间转移并管理资金。 反复出现的产品组件包括嵌入式账户、境内与国际支付、FX、开放银行，以及稳定币出入金通道。这个定位重要，因为它把 OpenPayd
              放在嵌入式金融中价值更高的编排层， 而不是只押注某一个地区或支付走廊。


              监管架构也比典型纯软件金融科技公司更厚。OpenPayd 的法律集团概览显示，它采用多实体结构：SettleGo Solutions Limited 承担英国电子货币业务， Malta EMI
              承担支付服务，法国分支用于护照通行结构，OP Digital Services Limited 在马耳他从事受监管加密资产业务，另有加拿大货币服务业务注册。
              结合公司公开声称覆盖美国、英国、EEA、加拿大和南非，证据支持这样一个判断：OpenPayd 多年来一直在搭建受监管运营覆盖，支撑跨境资金流转。
              公开办公地点把商业中心锚定在伦敦，同时显示其在马耳他和索菲亚有运营存在；创始人材料还指向荷兰、南非和美国的额外足迹。
