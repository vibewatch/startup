summary:
  headline: >-
    OpenPayd combines real scale, regulatory progress, and differentiated stablecoin-linked infrastructure, but the
    announced valuation already assumes meaningful future proof on margins, retention, and concentration that public
    sources do not yet fully disclose.
  overallScore: 7.1
  recommendation: track
  confidence: medium
  riskRating: medium
  valuationStance: stretched
