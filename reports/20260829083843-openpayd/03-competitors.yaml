  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: OpenPayd win/loss data versus Stripe, ClearBank, Modulr, and other named rivals by segment and geography.
    whyItMatters: Public product copy shows positioning, but not actual competitive conversion or price elasticity.
    diligencePath: Request pipeline, win-rate, and loss-reason data segmented by competitor and customer vertical.
    relatedQuestionRefs:
    - QP025
  - type: private-evidence-only
    severity: material
    topic: pricing-benchmarks
    missingEvidence: Corridor-level pricing, FX spreads, implementation fees, and minimum-volume commitments across key competitors.
    whyItMatters: Packaging signals are visible publicly, but procurement decisions in payments infrastructure are highly price and implementation sensitive.
    diligencePath: Collect live quotes from management, RFPs, or customer references for a like-for-like corridor set.
    relatedQuestionRefs:
    - QP009
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: competitive-share
    missingEvidence: A third-party market-share source that quantifies OpenPayd’s relative share in UK/EU embedded accounts, cross-border treasury, or stablecoin-linked infrastructure.
    whyItMatters: The chapter can compare positioning and distribution, but it cannot size actual share without better external category data.
    diligencePath: Fetch analyst-share estimates or public filings that isolate the relevant segment.
    relatedQuestionRefs:
    - QP025
  - type: enumeration-incomplete
    severity: material
    topic: TP004 moat durability / competitive risk register
    missingEvidence: A fuller set of public incident or enforcement examples for major competitors beyond the Railsr onboarding restriction.
    whyItMatters: Sector risk is visible, but richer adverse competitor evidence would improve relative-risk scoring across the whole peer set.
    diligencePath: Extend the adverse search to filings, enforcement actions, and outage histories for the listed peers.
    relatedQuestionRefs:
    - QP012
    relatedTableRefs:
    - TP004
