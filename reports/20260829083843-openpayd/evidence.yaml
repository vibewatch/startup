      volume base.
    diligencePath: >-
      Use the F-4, investor presentation, or management materials rather than indirect databases to confirm current
      employee count.
    relatedQuestionRefs:
      - QO014
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
