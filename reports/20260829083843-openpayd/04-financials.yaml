  name: OpenPayd
chapter:
  number: 4
  title: Financials
  summary: OpenPayd’s public financial story is compelling at the headline level but thin below the surface. The June 2026 de-SPAC announcement disclosed more than $85M ARR, more than $240B annualized transaction volume, and a $1.145B pro-forma valuation, implying roughly 13.5x ARR and an infrastructure-style take rate of about 3.5 bps on annualized flow. Product breadth suggests multiple monetization engines across payments, FX, accounts, banking-as-a-service, and stablecoin infrastructure, but profitability, burn, gross margin, and concentration remain undisclosed. The result is a business that looks scaled and strategically valuable, yet still requires real audited diligence before the valuation can be underwritten confidently.
sections:
- id: scale-and-efficiency
  title: Disclosed Scale and Efficiency Signals
  body: 'The de-SPAC materials provide enough to frame OpenPayd as a late-stage financial infrastructure company, but not enough to model it like a fully disclosed public company. More than $85M ARR, more than $240B annualized transaction volume, 1,100+ customers, and operations in 180 countries together describe a platform with substantial global reach. Those figures are not trivial for a private fintech and help explain why management felt able to pursue a Nasdaq listing at a unicorn valuation.


    At the same time, the disclosed numbers are run-rate metrics rather than a full financial statement package. The most informative derived number is that ARR divided by annualized volume lands below 4 basis points, which is low in absolute terms but directionally consistent with infrastructure economics. It signals a model built on large-value flows and high customer throughput, not on extracting large percentage tolls from each transaction. That is not inherently negative, but it puts more weight on retention, concentration, and operating leverage than the public materials disclose. It therefore deserves to be judged through throughput quality, not just top-line magnitude.'
