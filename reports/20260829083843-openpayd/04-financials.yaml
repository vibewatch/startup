- id: TI004
  title: Financial risk / disclosure gap register
  columns:
  - Risk or gap
  - Why it matters
  - Current public evidence
  - What diligence should ask
  rows:
  - - Profitability undisclosed
    - Valuation cannot be tied to earnings power
    - No gross margin, EBITDA, or cash-flow data in fetched materials
    - Obtain audited income statement and cash-flow history
  - - Customer concentration unknown
    - A few large clients could dominate revenue and volume
    - Customer names are public but revenue share is not
    - Request top-10 customer revenue and volume mix
  - - Regulatory capital requirements unclear
    - Capital intensity affects growth efficiency and downside protection
    - Entity/regulatory footprint is public, capital detail is not
    - Request safeguarding, capital, and liquidity requirements by entity
  - - SPAC proceeds uncertainty
    - Redemptions may reduce cash raised materially
    - Announcement explicitly assumes no redemptions
    - Model multiple redemption scenarios and backup financing options
  - - Legal / complaint cost leakage
    - Disputes can create hidden operating expense and remediation cost
    - QuidPay dispute is public; cost impact undisclosed
    - Review litigation reserve, complaint history, and insurance coverage
  notes: This register prioritizes unknowns that most directly affect whether the headline valuation is supportable.
