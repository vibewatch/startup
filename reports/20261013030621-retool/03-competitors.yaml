callouts:
  - calloutType: insight
    title: "The Low-Code Governance Frontier"
    body: "Retool's primary competitive moat in 2026 is no longer raw UI component count, but enterprise-grade data security and governance. As AI app generators commoditize basic UI scaffolding, Retool's native connectors, role-based access control, and self-hosted compliance capabilities protect its enterprise customer base against prompt-only alternatives."
    claimRefs:
      - CP001
      - CP008
  - calloutType: risk
    title: "Seat Expansion Friction at Scale"
    body: "The primary vector for competitor displacement remains Retool's per-seat pricing model. When internal tool user counts scale from tens to hundreds of operational employees, the steep step-up to Business tier pricing creates strong financial incentives for teams to evaluate self-hosted open-source alternatives like Appsmith or revert to in-house custom builds."
    claimRefs:
      - CP011
      - CP014
