    title: "SaaS Replacement Driven by Vibe Coding Outpaces IT Governance"
    body: "The shift toward custom internal builds is accelerating as 35% of enterprise teams have already replaced commercial SaaS with custom software. However, with 60% of respondents building outside IT oversight, market expansion hinges on providing enterprise-grade platform governance rather than raw code generation speed."
    claimRefs:
      - "CM004"
      - "CM008"
  - calloutType: "risk"
    title: "Autonomous Agent Adoption Constrained by Enterprise Security Boundaries"
    body: "While autonomous agents expand the addressable market from static dashboards into autonomous operations, enterprise IT leaders prioritize platform-enforced authentication, audit trails, and data-level role-based access controls to prevent unmonitored AI executions."
    claimRefs:
      - "CM001"
      - "CM011"
