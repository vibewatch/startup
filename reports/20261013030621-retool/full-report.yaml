        - label: Appsmith
          x: 4.5
          'y': 7
          quadrant: Open-Source Challenger
          description: Open-source control and low infra floor cost with active developer community
        - label: ToolJet
          x: 4
          'y': 6.5
          quadrant: AI-Native Open-Source
          description: Modern UI and native AI components with flexible cloud or self-hosted deployment
        - label: Superblocks
          x: 7
          'y': 7.5
          quadrant: Enterprise Challenger
          description: Strong AI-first messaging and enterprise IT controls for platform teams
        - label: Microsoft Power Apps
          x: 8
          'y': 4
          quadrant: Incumbent Suite
          description: Broad enterprise distribution via Microsoft 365, but rigid developer escape hatches
        - label: Internal Custom Build
          x: 2
          'y': 8
          quadrant: High Flexibility / High Maintenance
          description: Maximum customization and code ownership with substantial ongoing engineering maintenance
