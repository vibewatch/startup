  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Sequential analytical chain connecting enterprise scale and competitive crowdedness to valuation stance and final
      recommendation.
    approximationNotes: >-
      Illustrates the qualitative analytical progression from enterprise customer traction to valuation risk and
      investment recommendation stance.
    data:
      nodes:
        - id: enterprise-scale
          label: Enterprise Scale
          description: 10,000+ organizations and 500,000+ builders validate enterprise demand and product-market fit.
          tone: positive
        - id: product-governance
          label: Governed AppGen
          description: Integrated SSO, RBAC, and VPC deployment defend workflow stickiness against prototype-grade AI tools.
          tone: positive
        - id: competitive-crowding
          label: Competitive Crowding
          description: 266 active market competitors and ubiquitous AI coding tools compress developer platform pricing power.
          tone: warning
        - id: valuation-staleness
          label: Valuation Staleness
          description: $3.2B valuation mark has remained unrefreshed since July 2022, creating substantial multiple overhang.
          tone: negative
        - id: multiple-realignment
          label: Multiple Realignment
          description: Estimated $120M ARR implies 26.7x multiple, requiring severe multiple contraction in public comp parity.
          tone: negative
        - id: recommendation-stance
          label: Research-More Stance
          description: >-
            Recommend research-more posture and track diligence pending confirmatory audited financials and ARR
            verification.
          tone: neutral
      edges:
