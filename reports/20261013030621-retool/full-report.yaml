chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding History, and Mission
        blocks:
          - type: paragraph
            body: >-
              Retool was founded in 2017 by current Chief Executive Officer David Hsu following his direct experience
              with repetitive internal software development during his earlier payments venture Cashew. Headquartered in
              San Francisco, California, the company set out to replace ad-hoc internal dashboards and bespoke CRUD
              utilities with a unified development canvas combining visual building blocks, SQL queries, and JavaScript
              extensibility. Over nearly a decade of commercial execution, the business has transitioned from an
              individual developer utility into an enterprise-wide application generation platform that bridges business
              databases, SaaS APIs, and AI models under centralized administrative controls. David Hsu has maintained
              continuous executive leadership and architectural direction since inception, providing strong technical
              focus but creating a concentrated key-person dependency in the absence of a visible, externally
              highlighted operational co-founder bench.
            claimRefs:
              - CO001
              - CO002
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO008
      - number: '1.2'
        title: Capitalization Structure, Valuation History, and Key Stakeholders
        blocks:
          - type: paragraph
            body: >-
              Retool institutional capitalization path began with acceptance into Y Combinator Winter 2017 cohort, which
              catalyzed early developer adoption and seed capital. The company achieved substantial commercial expansion
              over the subsequent five years, culminating in a $45 million Series C financing round in July 2022 that
              valued the business at $3.2 billion post-money. Sequoia Capital led the Series C financing, joined by an
              elite syndicate of technology executives and venture firms including Stripe co-founders Patrick and John
              Collison, former GitHub CEO Nat Friedman, investor Elad Gil, and BOND Capital. In aggregate, Retool has
              raised approximately $141 million across disclosed venture rounds. Because the company has not raised a
              publicly disclosed equity financing since mid-2022, its capitalization table, liquidation preference
              stack, and current secondary valuation profile remain closely guarded private company information.
            claimRefs:
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO007
      - number: '1.3'
        title: Operating Scale, Product Evolution, and Milestone Progression
        blocks:
          - type: paragraph
            body: >-
              Retool operating footprint has expanded to serve over 10,000 teams and Fortune 500 enterprise customers
              across varied industries. Independent market intelligence estimates that Retool scaled its annual
              recurring revenue to $120 million in October 2025, up from $90 million at the end of 2024, demonstrating
              resilient growth even amidst broad software budgeting scrutiny. This revenue acceleration coincided with
              strategic product releases throughout 2025 and 2026, most notably the launch of multipage applications,
              enterprise AppGen, and autonomous AI Agents with consumption-based monetization units. Rather than
              confining users to a proprietary walled garden, Retool 2026 architecture embraces external vibe coding
              workflows, introducing Model Context Protocol (MCP) server support, command-line deployment utilities, and
              direct ingestion of React code generated in external IDEs like Lovable or Replit.
            claimRefs:
              - CO006
              - CO007
              - CO010
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO005
              - CO006
              - CO007
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO006
              - CO010
              - CO011
      - number: '1.4'
        title: Enterprise Governance, Pricing Dynamics, and Operating Dilemmas
        blocks:
          - type: paragraph
            body: >-
              The core strategic defensibility of Retool rests upon enterprise governance: offering SOC 2 Type II
              compliance, granular role-based access control, automated audit logging, enterprise single sign-on, and
              customer-hosted Virtual Private Cloud or on-premises deployment options. However, this enterprise focus
              introduces material commercial friction for expanding customers. Retool concentrates advanced governance,
              source control, and self-hosting capabilities into high-tier Business and custom Enterprise plans, while
              total software spending escalates across builder seats, internal end-user licenses, workflow run counts,
              and AI credit consumption. Furthermore, the maturation of open-source alternatives such as Appsmith,
              Budibase, and ToolJet exerts ongoing pricing pressure, particularly among technical teams seeking code
              ownership and predictable infrastructure costs.
            claimRefs:
              - CO009
              - CO012
              - CO013
              - CO014
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Shift from Drag-and-Drop Builder to Governed AppGen Platform
            body: >-
              Retool has strategically repositioned its value proposition from a manual drag-and-drop internal UI
              builder to an enterprise-governed application generation platform. By introducing MCP servers, CLI
              deployments, and external code ingestion from tools like Lovable and Replit, Retool aims to centralize
              enterprise governance around shadow IT and vibe-coded applications without forcing developers into
              proprietary visual editors.
            calloutType: insight
            claimRefs:
              - CO009
              - CO011
          - type: callout
            title: Valuation Stagnation and Enterprise Pricing Friction
            body: >-
              While Retool has scaled estimated ARR to $120M as of late 2025, its last disclosed valuation of $3.2B
              dates back to July 2022, representing an elevated 26.7x ARR multiple. Furthermore, locking essential
              security, SSO, and self-hosted capabilities into opaque custom enterprise tiers creates expansion friction
              and invites competitive pressure from open-source alternatives.
            calloutType: risk
            claimRefs:
              - CO003
              - CO006
              - CO012
              - CO014
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Definitions, and Spend Taxonomy
        blocks:
          - type: paragraph
            body: >-
              The enterprise internal software market has historically occupied an ambiguous boundary between bespoke
              custom development and commercial off-the-shelf SaaS. Organizations spend hundreds of billions of dollars
              annually licensing rigid third-party applications or dedicating expensive full-stack engineering resources
              to build internal CRUD dashboards. Retool defines its core addressable boundary around custom operational
              software, connecting directly to live production databases, APIs, and business systems without forcing
              developers to manage bespoke UI scaffolding. This boundary intentionally excludes consumer-facing
              software, public marketing websites, and core transactional ERP engines, focusing instead on internal
              dashboards, workflow automations, customer support consoles, and approval portals. By introducing
              prompt-based AppGen and autonomous agents, Retool expands this boundary into operational automation,
              competing directly against traditional SaaS add-ons and manual back-office processes.
            claimRefs:
              - CM001
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
      - number: '2.2'
        title: TAM, SAM, and SOM Estimation Across Software and AI Budgets
        blocks:
          - type: paragraph
            body: >-
              Evaluating Retool's addressable market requires decomposing generic enterprise software estimates into
              concrete, evidence-constrained spend layers. Third-party analyst research from Sacra estimates that Retool
              reached $120 million in annual recurring revenue in October 2025, scaling from $90 million at year-end
              2024 through subscription-based developer seat tiers and newer monetization units including AI prompting
              credits and agent execution hours. The serviceable obtainable market (SOM) for governed internal developer
              tooling and operational dashboards represents approximately $2.5 billion in annual enterprise spend.
              Expanding upward, the serviceable addressable market (SAM) encompasses custom software development and
              SaaS replacement, driven by enterprise teams seeking tailored applications rather than multi-tenant vendor
              workflows. At the macro level, the total addressable market spans the broader $500 billion enterprise
              software and AI workload ecosystem, where organizations are actively shifting from static dashboards to
              autonomous agentic systems.
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM007
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM012
              - CM013
              - CM014
      - number: '2.3'
        title: Buyer Personas, User Segmentation, and Procurement Pathways
        blocks:
          - type: paragraph
            body: >-
              Enterprise procurement of Retool reflects a dual-motion dynamic between technical builders and central
              governance authorities. Historically, adoption began bottom-up with software engineers, product managers,
              and data analysts who adopted Retool to bypass internal sprint backlogs and deliver internal tools in
              hours rather than weeks. However, as applications scale to production-critical workflows supporting
              thousands of employees, procurement shifts to central IT, engineering leadership, and security executives.
              Budget ownership typically sits within IT operations, enterprise engineering, or dedicated automation
              centers of excellence. The procurement trigger frequently involves reaching a breaking point with
              expensive third-party SaaS contracts or discovering unmonitored shadow IT projects. Enterprise tier
              upgrades are driven by requirements for single sign-on (SSO), granular role-based access control (RBAC),
              comprehensive audit logging, and on-premises or virtual private cloud (VPC) deployment options.
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Adoption Drivers, Structural Headwinds, and Valuation Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The primary growth driver for Retool is the shifting build-versus-buy calculus in enterprise software. In
              Retool's survey of over 800 builders, 35% of enterprise teams reported having already replaced at least
              one commercial SaaS tool with a custom build, while 78% expected to build more custom internal tools in
              2026. However, rapid AI adoption has introduced severe operational and architectural constraints. Industry
              surveys indicate that 93% of CIOs and CISOs are concerned about ungoverned vibe-coded applications running
              in production, with 38% citing it as a top operational risk. Because only 8% of organizations describe
              their AI governance as strong, platform-enforced compliance has become a non-negotiable gating factor for
              production rollouts. A material diligence gap remains regarding whether custom software replacement
              translates into durable customer retention and high net expansion rates, or whether open-source
              alternatives and internal engineering initiatives will cap long-term pricing power.
            claimRefs:
              - CM001
              - CM004
              - CM011
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: SaaS Replacement Driven by Vibe Coding Outpaces IT Governance
            body: >-
              The shift toward custom internal builds is accelerating as 35% of enterprise teams have already replaced
              commercial SaaS with custom software. However, with 60% of respondents building outside IT oversight,
              market expansion hinges on providing enterprise-grade platform governance rather than raw code generation
              speed.
            calloutType: insight
            claimRefs:
              - CM004
              - CM008
          - type: callout
            title: Autonomous Agent Adoption Constrained by Enterprise Security Boundaries
            body: >-
              While autonomous agents expand the addressable market from static dashboards into autonomous operations,
              enterprise IT leaders prioritize platform-enforced authentication, audit trails, and data-level role-based
              access controls to prevent unmonitored AI executions.
            calloutType: risk
            claimRefs:
              - CM001
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Alternative Categories
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape surrounding Retool divides across four distinct architectural categories:
              commercial low-code suites, open-source developer platforms, incumbent enterprise application ecosystems,
              and status-quo custom code. Commercial alternatives such as Superblocks target enterprise platform teams
              with AI-assisted generation and centralized administration. Open-source platforms, led by Appsmith and
              ToolJet, appeal directly to cost-sensitive engineering organizations by providing self-hostable community
              editions with zero software license fees for internal users. Meanwhile, legacy incumbents like Microsoft
              Power Apps leverage pervasive distribution across Microsoft 365 and Azure environments. Despite these
              specialized offerings, the primary substitute for Retool remains internal software engineering using
              React, Node.js, and bespoke authentication, which teams often reconsider only when engineering backlogs
              make low-code velocity essential.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: Platform Capabilities and Developer Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Retool differentiates from both no-code website builders and raw prompt-to-app code generators by
              centering on a developer-first paradigm with extensive code escape hatches. The platform couples over 90
              pre-built UI components with native connectors for more than 100 databases, data warehouses, and REST or
              GraphQL endpoints. Rather than trapping developers in rigid visual abstractions, Retool allows arbitrary
              JavaScript transformations, direct SQL execution, and imported custom React components. The platform has
              expanded its capabilities with AppGen for natural-language application scaffolding, native AI agents, and
              integrations that import applications from external AI builders like Lovable and Replit into Retool's
              governed runtime. Developer enablement programs like Retool University further support enterprise adoption
              and workflow design.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.3'
        title: Pricing Models, Packaging, and Scaling Friction
        blocks:
          - type: paragraph
            body: >-
              Retool's commercial packaging bifurcates users into builder seats and lower-cost internal end-user seats
              across its published tiers. While small engineering pods can validate tools on the free tier or the entry
              Team tier ($10 to $12 per builder and $5 to $7 per internal user monthly), expanding internal tools across
              large operational teams requires the Business tier ($50 to $65 per builder and $14 to $18 per internal
              user monthly). This per-seat compounding creates significant operational expenditure friction when
              applications scale to hundreds of support or operations staff. Furthermore, Retool's consolidation of
              self-hosted deployments exclusively onto custom Enterprise contracts restricts infrastructure-conscious
              teams from self-managing mid-tier instances, creating an economic opening for open-source alternatives.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Defensibility, Moat Durability, and Disruption Risks
        blocks:
          - type: paragraph
            body: >-
              Retool's long-term competitive defensibility rests on enterprise governance depth, identity integration,
              and production data gravity rather than proprietary UI components. Once an organization connects
              production databases, configures granular role-based permissions, establishes Git-backed code review
              workflows, and embeds dozens of operational tools into daily workflows, switching costs become formidable.
              Generic AI code generators like Lovable or Replit can scaffold prototypes quickly from prompts, but they
              lack native database connection pooling, audit logging, single sign-on, and secure deployment
              infrastructure out of the box. Retool capitalizes on this production gap by serving as the secure runtime
              layer, though seat pricing expansion remains a key churn risk.
            claimRefs:
              - CP001
              - CP006
              - CP008
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP006
              - CP008
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Low-Code Governance Frontier
            body: >-
              Retool's primary competitive moat in 2026 is no longer raw UI component count, but enterprise-grade data
              security and governance. As AI app generators commoditize basic UI scaffolding, Retool's native
              connectors, role-based access control, and self-hosted compliance capabilities protect its enterprise
              customer base against prompt-only alternatives.
            calloutType: insight
            claimRefs:
              - CP001
              - CP008
          - type: callout
            title: Seat Expansion Friction at Scale
            body: >-
              The primary vector for competitor displacement remains Retool's per-seat pricing model. When internal tool
              user counts scale from tens to hundreds of operational employees, the steep step-up to Business tier
              pricing creates strong financial incentives for teams to evaluate self-hosted open-source alternatives
              like Appsmith or revert to in-house custom builds.
            calloutType: risk
            claimRefs:
              - CP011
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Retool monetizes primarily through a multi-dimensional software subscription model that separates
              application builders from internal app consumers. Under published 2026 commercial terms, builders pay
              higher monthly rates ranging from $10 to $50 per builder monthly on annual plans ($12 to $65 on monthly
              plans), while internal users pay $5 to $15 monthly on annual contracts ($7 to $18 monthly). The company
              monetizes platform adoption beyond core developer seats by metering automated workflow executions ($75 per
              5,000 runs), pooling account-level AI action credits, and billing autonomous agents on hourly runtime.
              External portal access introduces additional monetization, with users beyond a 50-user free allowance
              billed between $4 and $8 monthly per external user.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI004
      - number: '4.2'
        title: Go-to-Market Motion and Realized Pricing Dynamics
        blocks:
          - type: paragraph
            body: >-
              Retool drives top-of-funnel customer acquisition through a developer-focused product-led motion supported
              by a free tier capped at five users, 500 workflow runs, and 250 AI credits monthly. As internal
              applications scale across departments, teams encounter steep pricing step-functions driven by granular
              permission controls, audit logging, and staging environment requirements. Anonymized enterprise contract
              data from Vendr indicates that realized pricing frequently diverges from published list rates, with
              multi-year agreements and volume seat commitments unlocking double-digit discounting for deployments
              exceeding ten standard users. However, unbudgeted expenses from self-hosted infrastructure maintenance,
              premium support tiers, and high-frequency workflow overages often increase total cost of ownership beyond
              base licensing.
            claimRefs:
              - CI005
              - CI006
              - CI007
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI005
              - CI006
              - CI007
      - number: '4.3'
        title: Cost Structure Drivers and Margin Bridge
        blocks:
          - type: paragraph
            body: >-
              Retool's underlying gross margin profile depends significantly on customer deployment architecture and
              product feature utilization. Managed Retool Cloud accounts absorb recurring hosting infrastructure,
              database connection overhead, and third-party foundation model API expenses, whereas self-hosted
              enterprise deployments shift compute and network egress onto customer VPCs. Service delivery expenses also
              scale with autonomous agent executions, where wall-clock runtime across multi-step external API
              interactions consumes meter allowances without driving software gross margin expansion. Because Retool
              packages visual frontend components and runtime governance together, internal app expansion within
              existing corporate accounts yields strong incremental software margins, partially offset by usage-based
              overage dynamics in data pipeline automations.
            claimRefs:
              - CI008
              - CI009
              - CI010
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI008
              - CI009
      - number: '4.4'
        title: Capital Position, Private Traction, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Retool has raised substantial private venture financing, culminating in a $45 million Series C2 round in
              2022 that valued the company at $3.2 billion with backing from Sequoia Capital. Commercial traction
              indicators include over 10,000 organizations operating production applications on the platform,
              encompassing marquee enterprise customers such as Amazon, Stripe, and Brex. Nevertheless, Retool maintains
              strict private financial opacity, disclosing no official GAAP revenue, annualized recurring revenue (ARR),
              net revenue retention (NRR), or cash burn metrics. From an investment underwriting perspective, Retool
              demonstrates defensible product-market fit in governed internal tooling, but the absence of verified
              cohort retention and realized gross margins constitutes a material diligence blocker that precludes
              independent valuation underwriting.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI010
              - CI011
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Multi-Dimensional Pricing Friction and Cost Cliff Risk
            body: >-
              Retool's hybrid pricing architecture combines per-seat developer licensing with usage meters for
              workflows, AI tokens, and external stakeholders. While self-serve entry is frictionless, scaling
              organizations face steep cost step-functions when transitioning to Business or Enterprise tiers for basic
              governance features.
            calloutType: risk
            claimRefs:
              - CI002
              - CI003
              - CI007
          - type: callout
            title: Deployment Model Determines Realized Software Gross Margins
            body: >-
              Retool achieves high gross margins when enterprise customers deploy on private self-hosted infrastructure,
              offloading compute and networking costs. Conversely, managed cloud-hosted apps and autonomous AI agents
              incur pass-through compute and LLM API expenses that compress net unit margins.
            calloutType: insight
            claimRefs:
              - CI008
              - CI009
              - CI010
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface, Core Modules, and Customer Workflow Delivery
        blocks:
          - type: paragraph
            body: >-
              Retool operates as a comprehensive low-code software development platform engineered to accelerate the
              delivery of internal operations tooling across technical and operational organizations. The platform spans
              multiple distinct delivery surfaces: Retool Apps provides an interactive visual canvas with a rich library
              of pre-built UI components including tables, forms, charts, and modal inspectors that developers bind to
              live backend databases and APIs using JavaScript and SQL. Beyond desktop browser interfaces, Retool Mobile
              delivers native iOS and Android applications equipped with hardware-level camera barcode scanning, push
              notifications, and offline data persistence for field logistics and warehouse operations teams. Backend
              business processes are automated through Retool Workflows, an event-driven automation engine that executes
              scheduled cron jobs, webhook handlers, and asynchronous multi-step ETL pipelines without requiring
              dedicated microservice infrastructure. To support developer enablement and organizational best practices,
              Retool University provides structured curricula and training tracks covering secure AI application
              development, workflow patterns, and enterprise governance paradigms.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE007
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE011
      - number: '5.2'
        title: System Architecture, RPC Mechanics, and Extensibility
        blocks:
          - type: paragraph
            body: >-
              Retool's operating architecture is engineered around the fundamental requirement of connecting securely to
              disparate enterprise data sources while providing a flexible, high-leverage execution environment. In its
              rebuilt 2026 architecture, Retool decouples application presentation logic from centralized access
              governance, enabling engineering teams to either build visually or import external React frontends that
              seamlessly inherit enterprise permissions and audit logging. Crucially for developer teams leveraging
              modern AI coding assistants, Retool exposes a Model Context Protocol (MCP) server that allows external
              coding agents to scaffold and inspect applications directly within developer IDE workflows. To access
              private enterprise databases without exposing sensitive internal endpoints to the public internet, Retool
              RPC utilizes an internal software development kit deployed within customer virtual private clouds that
              establishes outbound polling connections for remote procedure execution, eliminating the necessity for
              complex inbound firewall holes or reverse proxies. This execution engine connects natively to over 70
              database engines, cloud data warehouses, and REST or GraphQL endpoints with bidirectional read and
              writeback support.
            claimRefs:
              - CE003
              - CE004
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE010
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE008
              - CE010
      - number: '5.3'
        title: AI Capabilities, AppGen Generation, and Autonomous Agents
        blocks:
          - type: paragraph
            body: >-
              Retool's artificial intelligence strategy centers on AppGen and Retool Agents, positioning AI not as an
              unguided code generator but as an enterprise-governed workflow acceleration primitive. Retool AppGen
              allows builders to prompt full-stack internal applications using natural language; rather than spitting
              out unverified raw code files that fail compliance reviews, AppGen generates applications composed of
              modular, trusted UI components grounded directly against live production database schemas, pre-existing
              permissions, and corporate access controls. Complementing prompt-based application generation, Retool
              Agents provides an autonomous reasoning framework where large language models evaluate operational data
              and execute multi-step business actions across integrated APIs and workflows. To mitigate hallucination
              risk and regulatory exposure in sensitive operational workflows, Retool incorporates human-in-the-loop
              review gates that mandate explicit operator approval before agents execute high-risk writeback
              transactions or financial disbursements.
            claimRefs:
              - CE006
              - CE007
      - number: '5.4'
        title: Deployment Models, Governance Controls, and Technical Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Retool supports dual deployment topologies designed to accommodate varying corporate compliance and data
              residency requirements: a fully managed multi-tenant Retool Cloud SaaS offering and an enterprise
              self-hosted deployment running on Docker or Kubernetes clusters within private customer infrastructure.
              Retool actively maintains enterprise release lines for self-hosted customers, supporting long-term
              stability branches such as 4.34.8-stable and 4.0.21-stable released in October 2026. Enterprise governance
              primitives enforce strict organizational security posture through Single Sign-On, automated SCIM identity
              provisioning, granular role-based access control across resources and spaces, and immutable audit logs
              capturing every query and agent action. However, significant architectural tradeoffs persist: because
              Retool apps execute within the client browser DOM, complex dashboards binding massive query payloads
              frequently encounter client-side rendering sluggishness and browser memory pressure. Furthermore,
              operating self-hosted Retool clusters imposes substantial continuous DevOps overhead for database
              migrations, container patching, and network ingress management, while essential governance features like
              SSO and Git synchronization remain restricted to high-tier enterprise commercial plans.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Grounded App Generation Solves Enterprise Production Readiness
            body: >-
              Unlike standalone prompt-to-app prototyping builders that produce disconnected codebases lacking
              enterprise controls, Retool's AppGen generates operational software directly grounded in existing database
              schemas, pre-authenticated resources, and corporate governance policies.
            calloutType: strength
            claimRefs:
              - CE006
              - CE010
          - type: callout
            title: Browser Execution and Self-Hosting DevOps Overhead Limit Complex Deployments
            body: >-
              Retool's client-side browser execution model introduces noticeable UI latency when rendering dense
              dashboards with heavy data payloads, while self-hosting Docker and Kubernetes clusters requires dedicated
              DevOps engineering maintenance to manage upgrades and networking.
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Personas
        blocks:
          - type: paragraph
            body: >
              Retool's commercial traction spans a diverse spectrum of customer profiles, ranging from high-growth
              technology startups building initial administrative portals to Fortune 500 enterprises standardizing
              entire internal tool ecosystems. The primary economic buyer varies sharply by organizational scale: small
              and mid-market companies are typically represented by engineering leads or technical founders seeking
              rapid CRUD UI scaffolding over SQL databases, whereas large enterprise contracts are purchased by central
              IT and VP-level engineering leadership looking for centralized access controls and governed deployment
              environments. Across these organizations, Retool distinguishes between builders who create and maintain
              tools and internal end-users who execute operational workflows. Operations teams, customer support units,
              and finance analysts represent the largest internal user populations, leveraging over 70 native database
              and API integrations to automate data lookups, billing operations, and inventory reconciliation. However,
              because advanced applications require fluency in JavaScript and SQL, non-technical business departments
              frequently encounter an implementation bottleneck, remaining dependent on technical staff to build and
              update mission-critical internal applications.
            claimRefs:
              - CU001
              - CU009
              - CU010
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU009
              - CU012
              - CU013
      - number: '6.2'
        title: Adoption Trajectory, SaaS Replacement, and Developer Velocity
        blocks:
          - type: paragraph
            body: >
              Adoption velocity has expanded beyond conventional admin panels into widespread custom software
              replacement. The platform supports over 10,000 active customer organizations operating production
              applications on their live enterprise data. A decisive driver of this trajectory is the economic
              re-evaluation of commercial vertical SaaS: in Retool's comprehensive survey of 817 enterprise builders, 35
              percent of respondent organizations confirmed they have already replaced at least one commercial
              third-party SaaS tool with a custom internal Retool application. Furthermore, 78 percent of surveyed
              builders expect to construct additional custom tools throughout 2026, encouraged by accelerated
              AI-assisted application generation and agentic orchestration. Bottom-up developer momentum frequently
              outpaces formal corporate procurement, with 60 percent of surveyed builders reporting that they
              constructed operational software outside formal IT oversight in the past year. While this bottom-up
              adoption generates rapid organic footprint expansion, it introduces shadow IT risks that eventually force
              centralized IT intervention, security reviews, and enterprise governance consolidation.
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU007
      - number: '6.3'
        title: Named Enterprise Deployments and Production Outcomes
        blocks:
          - type: paragraph
            body: >
              Retool's reference customer roster demonstrates substantial enterprise penetration across market leaders
              including Amazon, Stripe, Brex, and Orangetheory Fitness, each running production software directly
              connected to core operational systems. Detailed deployment evidence shows measurable cost reduction and
              operational independence. At startup discovery platform Harmonic, engineering leaders faced recurring
              support delays from an external vendor costing $20,000 annually; rebuilding the tool directly in Retool
              eliminated the vendor license and triggered a broader cultural transition that now sustains 33 production
              applications integrated with Salesforce, Gong, Slack, and internal APIs under unified audit logging.
              Similarly, AWS Generative AI Innovation Center employs Retool as an application interface layer to
              demonstrate and deploy complex generative AI workflows and model evaluations for enterprise clients. These
              verified deployments demonstrate that Retool functions not merely as an evaluation prototyping sandbox,
              but as durable, long-lived production infrastructure powering daily business workflows across technology,
              financial services, and consumer operations.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU008
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU007
      - number: '6.4'
        title: Account Durability, Expansion Mechanics, and Concentration Risks
        blocks:
          - type: paragraph
            body: >
              Account expansion within Retool follows a documented land-and-expand trajectory: individual development
              teams initially deploy a single administrative tool, subsequently expanding into dozens or hundreds of
              departmental applications managed under Retool's centralized control plane. Reusable component libraries,
              standardized database connection patterns, and Retool RPC significantly reduce the marginal cost of
              constructing subsequent applications. Nevertheless, account durability faces two structural headwinds.
              First, per-user pricing models separate builder seats from internal operational user seats, causing
              software licensing fees to escalate rapidly as tools are rolled out to wide frontline populations. Second,
              Retool provides no public disclosures regarding customer net revenue retention (NRR), gross revenue
              retention (GRR), or annual logo churn rates. Furthermore, revenue concentration among its largest
              enterprise accounts remains undisclosed. Investors must verify whether rapid expansion in technical
              power-user accounts is sufficient to counterbalance seat-pricing procurement friction and potential churn
              in price-sensitive mid-market cohorts.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU014
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU007
              - CU010
              - CU012
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: SaaS Replacement Dynamics Driving Bottom-Up Adoption
            body: >-
              Retool's customer traction increasingly relies on replacing inflexible or high-cost vertical SaaS
              subscriptions with customized internal software, where builders leverage over 70 native integrations to
              consolidate operational workflows.
            calloutType: insight
            claimRefs:
              - CU004
              - CU005
              - CU013
          - type: callout
            title: Seat-Based Pricing and Developer Bottlenecks Limit Expansion
            body: >-
              While technical teams experience rapid turnaround times, per-user seat pricing models and developer
              dependency for complex SQL and JavaScript logic create organizational friction that can stall expansion
              beyond core technical departments.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Compliance, Licensing, and Enterprise Governance
        blocks:
          - type: paragraph
            body: >-
              Retool faces several distinct regulatory compliance and legal governance challenges across its customer
              deployments, specifically regarding data privacy, enterprise access controls, and industry-specific
              mandates. While the core platform maintains SOC 2 Type II certifications and provides comprehensive audit
              logging, enterprise customers operating in highly regulated environments such as healthcare (HIPAA) and
              financial services face structural trade-offs. Retool's multi-tenant cloud offering processes query
              results through cloud infrastructure, necessitating self-hosted on-premises deployments in customer
              Virtual Private Clouds (VPC) to guarantee strict data residency and satisfy sovereignty mandates.
              Crucially, enterprise security architectures routinely require centralized single sign-on (SAML/OIDC)
              integration, but Retool gates SSO behind custom Enterprise tier contracts. This commercial packaging
              decision creates a sudden pricing cliff for growing mid-market engineering organizations whose compliance
              policies require centralized identity management, often forcing rapid cost escalations or contentious
              enterprise contract renegotiations.
            claimRefs:
              - CR002
              - CR003
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
      - number: '7.2'
        title: Operational Reliability, Code Maintainability, and Performance Limits
        blocks:
          - type: paragraph
            body: >-
              The operational reliability and long-term maintainability of applications built on Retool present
              significant friction for engineering organizations. The platform's core architecture stores application
              definitions in proprietary JSON structures without an export path to standard React, TypeScript, or
              Next.js codebases. Consequently, teams face extreme vendor lock-in; decommissioning or migrating an
              existing catalog of dozens of mission-critical internal admin panels requires complete rewrites from
              scratch. Furthermore, Retool encourages embedding business logic as inline JavaScript snippets fragmented
              across component event handlers and query transformers, which lack modern integrated development
              environment tooling, static type safety, and automated unit testing frameworks. As applications grow in
              complexity, this architectural pattern creates fragile maintenance bottlenecks where only the original
              author understands execution flows. Additionally, client-side rendering performance degrades sharply on
              large result sets exceeding ten thousand rows, requiring developers to manually implement server-side
              pagination and SQL optimizations. Self-hosted operations also entail substantial DevOps overhead, as major
              upgrades such as the version four transition require migrating from Docker Compose to complex Kubernetes
              Helm charts without automated in-place upgrade pathways.
            claimRefs:
              - CR001
              - CR008
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR008
              - CR011
              - CR012
      - number: '7.3'
        title: Partner Ecosystem, Model Dependencies, and Commercial Model Risks
        blocks:
          - type: paragraph
            body: >-
              Retool's expanding product surface area introduces critical upstream vendor dependencies and operational
              cost risks. The platform increasingly relies on external model providers including OpenAI, Anthropic, and
              Google for AI Agent execution, exposing customer workflows to third-party API rate limits, model latency
              spikes, and provider service outages. Retool Agent execution is billed on wall-clock runtime, meaning
              long-running or looping autonomous workflows can generate unexpected invoice spikes if developers do not
              implement strict execution bounds. Concurrently, Retool Database relies on managed PostgreSQL
              infrastructure through partners like Neon, creating an external availability dependency for teams
              utilizing managed data storage. From a commercial perspective, Retool's seat-based pricing model—charging
              separate fees for application builders and standard end-users—creates rising budgetary friction as
              operational teams expand access to customer support and back-office tooling. Organizations with broad
              operational footprints frequently encounter cost compounding, triggering internal platform reviews and
              driving evaluations of open-source self-hosted alternatives such as Appsmith or ToolJet.
            claimRefs:
              - CR005
              - CR007
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR007
              - CR014
      - number: '7.4'
        title: Risk Synthesis, Monitoring Indicators, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Synthesizing Retool's operational risk profile reveals that while technical and security controls remain
              competitive, commercial lock-in and infrastructure management overhead represent the primary
              vulnerabilities for enterprise adopters. Diligence findings highlight that Retool is rarely displaced due
              to lack of visual capabilities or database connectors, but rather when per-seat SaaS licensing costs scale
              disproportionately against custom software development budgets. Key monitoring indicators for prospective
              investors and platform evaluators include the ratio of active application builders to read-only end users,
              self-hosted Kubernetes upgrade friction, and customer migration rates toward open-source frameworks. Core
              thesis-break triggers include aggressive enterprise pricing revisions that accelerate customer churn,
              security vulnerabilities compromising centralized database connection credentials, or significant
              competitive feature parity from IDE-native and open AI development platforms. Ongoing diligence must
              actively verify customer contract renewal terms, enterprise SSO adoption hurdles, and actual deployment
              costs for automated AI agent workflows across production environments.
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR010
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise SSO Paywall Creates Steep Cost Cliff
            body: >-
              Enterprise customers requiring SAML and OIDC single sign-on governance face a forced migration from
              standard Business plans to custom enterprise pricing, accelerating evaluation of open-source alternatives
              like Appsmith.
            calloutType: risk
            claimRefs:
              - CR002
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Strategic Positioning
        blocks:
          - type: paragraph
            body: >-
              Retool occupies a premier position in the internal developer tools and low-code operations software
              landscape, supported by broad developer mindshare and established enterprise traction. Over 10,000
              organizations currently operate production software on their business data using Retool, including major
              technology enterprises such as Amazon, Stripe, and Brex. The company's developer community encompasses
              more than 500,000 builders who utilize the platform to replace fragmented internal spreadsheets and custom
              React frontends with governed administrative interfaces. With the introduction of enterprise AppGen and
              Assist capabilities, Retool has integrated generative artificial intelligence directly into its runtime,
              enabling teams to scaffold full-stack tools from natural language prompts while automatically enforcing
              single sign-on, role-based access control, and comprehensive audit logs. Furthermore, Retool's support for
              flexible deployment environments—including managed multi-tenant cloud, customer virtual private clouds,
              and air-gapped on-premises Kubernetes deployments—creates strong architectural lock-in for
              mission-critical enterprise workflows that lightweight consumer AI tools cannot easily replicate.
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV008
              - CV009
              - CV014
      - number: '8.2'
        title: Financing History and Valuation Overhang
        blocks:
          - type: paragraph
            body: >-
              Despite strong strategic positioning, Retool faces significant valuation overhang resulting from the
              timing of its historical capitalization. The company raised a $45 million Series C extension in July 2022
              at a post-money valuation of $3.2 billion, bringing its cumulative equity financing to $165 million across
              six institutional funding rounds with backing from Sequoia Capital, Y Combinator, and prominent angel
              investors. However, more than four years have elapsed since that July 2022 valuation mark, during which
              public software multiples compressed dramatically from peak 2021-2022 levels. Third-party estimates
              indicate Retool reached approximately $120 million in annual recurring revenue across a nine-year
              operating trajectory, implying that the historical $3.2 billion valuation prices the business at
              approximately 26.7 times ARR. In the 2026 market environment, where median enterprise SaaS multiples trade
              between 8.0 and 12.0 times ARR, maintaining a $3.2 billion valuation requires exceptional growth
              acceleration and top-decile net retention that cannot be verified from public data. Furthermore,
              competitive crowding has intensified, with industry intelligence recording 266 active market rivals vying
              for developer attention.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV014
      - number: '8.3'
        title: Scenario Analysis and Valuation Ranges
        blocks:
          - type: paragraph
            body: >-
              Evaluating Retool's investment profile requires scenario analysis that decouples the company's historical
              zero-interest-rate valuation mark from normalized 2026 enterprise software market reality. In a bull case
              scenario, Retool accelerates ARR to $200 million or more at 35% annual growth by monetizing autonomous
              agent workflows, enterprise AppGen seats, and deep Fortune 500 expansions, which would support a valuation
              between $3.2 billion and $4.0 billion at premium multiples of 16.0 to 20.0 times ARR. In the base case
              scenario, representing the most probable 55% likelihood path, ARR expands moderately to between $130
              million and $150 million, yielding an implied enterprise value of $1.3 billion to $1.8 billion under
              normalized 10.0 to 12.0 times multiples. Conversely, a bear case scenario accounts for customer churn, IT
              budget consolidation, and potential displacement by native LLM coding agents, compressing ARR to roughly
              $100 million and lowering valuation to between $600 million and $880 million at 6.0 to 8.0 times ARR.
              These scenarios underscore substantial downside multiple risk for existing equity preferences.
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV013
              - CV014
      - number: '8.4'
        title: Decision Framework and Diligence Path
        blocks:
          - type: paragraph
            body: >-
              Synthesizing the evidence across market scale, competitive crowding, and capital structure leads to a
              research-more investment recommendation with a high risk rating and a stretched valuation stance. While
              Retool's operational footprint of over 10,000 organizations and continuous product innovation in
              enterprise agent testing demonstrate authentic product-market fit, the total lack of audited financial
              disclosures, GAAP revenue bridges, and cohort retention figures prevents underwriting a buy recommendation
              at current implied secondary prices. Diligence priorities before any capital commitment must focus on
              obtaining verified income statements, gross margin profiles across cloud and self-hosted instances, and
              customer renewal quality across mid-market tech versus non-tech enterprise cohorts. Clear thesis-break
              triggers include sustained deceleration in enterprise additions, rising competitive win-rates by emerging
              AI coding frameworks, or evidence of a structured down-round recapitalization. Prospective investors
              should track the asset actively while demanding primary financial transparency.
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV008
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV010
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Overhang and Multiple Compression
            body: >-
              Retool's July 2022 valuation of $3.2B was established near the peak of historical software multiples.
              Against an estimated $120M ARR baseline, this represents a 26.7x multiple that faces severe downward
              pressure under current normalized enterprise software trading levels of 8x to 12x ARR.
            calloutType: risk
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV014
          - type: callout
            title: Capital Discipline and Diligence Priorities
            body: >-
              Institutional allocators should maintain a research-more stance and defer primary capital deployment until
              management provides audited GAAP revenue statements, cohort net revenue retention figures, and unit
              economics across self-hosted and cloud deployments.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV005
              - CV014
