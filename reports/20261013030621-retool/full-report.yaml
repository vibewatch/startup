          date: '2026-06-01'
          detail: >-
            Expands platform to govern vibe-coded apps built in Lovable and Replit via Model Context Protocol servers
            and CLI deployment.
          tone: positive
        - label: Enterprise Pricing & Governance Tiering
          date: '2026-10-01'
          detail: >-
            Advanced governance and self-hosting remain concentrated in top pricing tiers, creating commercial friction
            for expanding teams.
          tone: warning
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Hierarchical market sizing layers from total addressable software spend down to serviceable operational automation
      and current ARR.
    data:
      items:
        - label: Core Enterprise Internal Tool ARR
          value: 120
          unit: USD M
          detail: Sacra estimate of Retool ARR in October 2025 across seat-based developer subscriptions.
        - label: Serviceable Operational Automation (SOM)
          value: 2500
          unit: USD M
          detail: Near-term capture of custom operations dashboards, admin portals, and agent-driven workflows.
        - label: Custom Enterprise Software & AppGen (SAM)
          value: 15000
          unit: USD M
          detail: Addressable spend as 35% of enterprises replace commercial SaaS tools with custom builds.
        - label: Global Low-Code & Cloud Application Platforms
          value: 35000
          unit: USD M
          detail: Enterprise low-code development platforms, internal app builders, and cloud PaaS runtimes.
        - label: Enterprise Application & SaaS Displacement Budget
          value: 120000
          unit: USD M
          detail: Front-office and back-office SaaS license spend exposed to vibe coding and custom workflow automation.
        - label: Total Enterprise Software & AI Workload TAM
          value: 500000
          unit: USD M
          detail: Broader enterprise software, AI investment, and infrastructure spend undergoing composable modernization.
    approximationNotes: >-
      Tier values represent conceptual order-of-magnitude sizing lenses derived from analyst estimates (Sacra ARR
      milestone) and macro enterprise software budgets; SOM and SAM reflect custom build replacement boundaries rather
