  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronological progression of Retool from 2017 Y Combinator founding through Series C unicorn financing to
      2025–2026 enterprise AppGen and AI agent architecture.
    approximationNotes: null
    claimRefs:
