  - id: FE001
    title: Retool Full-Stack Operating & Governance Architecture
    type: stack
    summary: >-
      Layered system architecture showing user touchpoints, AI generation, execution engine, data connectors,
      infrastructure, and enterprise governance.
    data:
      layers:
        - label: User Interface & Client Presentation Layer
          modules:
            - label: Retool Web Apps (React component canvas, custom JS logic)
            - label: Retool Mobile (iOS & Android native apps, offline storage)
            - label: External Portals (Customer & partner facing authenticated apps)
        - label: AI AppGen & Autonomous Agent Layer
          modules:
            - label: Assist / AppGen (Prompt-driven natural language app generator)
            - label: Retool Agents (Multi-step reasoning agents with tool access)
            - label: AI Primitives (Vector database RAG, document extraction, LLM actions)
        - label: Workflow Orchestration & Automation Layer
          modules:
            - label: Retool Workflows (Event-driven visual automation engine)
            - label: Cron & Webhook Schedulers (Background jobs and alerts)
            - label: Transformation Runners (Python and JavaScript data handlers)
        - label: Execution, RPC & Extensibility Layer
          modules:
            - label: Retool RPC (Outbound polling SDK inside customer VPC)
            - label: MCP Server Integration (Model Context Protocol for coding agents)
            - label: Custom Component Runtime (Imported React and TypeScript modules)
        - label: Enterprise Data Connectivity Layer
          modules:
            - label: Managed Retool Database (Built-in PostgreSQL storage)
            - label: Native Connectors (70+ SQL, NoSQL, data warehouses, REST/GraphQL)
            - label: Query Library & Reusable Resources (Shared parameter logic)
        - label: Governance, Security & Deployment Foundation
          modules:
            - label: Identity & Access (SSO, SCIM, role-based access control)
            - label: Audit & Compliance (Comprehensive execution audit logs)
            - label: Deployment Runtime (Retool Cloud vs. Self-hosted Docker/Kubernetes)
    approximationNotes: null
    claimRefs:
      - CE003
      - CE004
      - CE006
      - CE008
      - CE010
  - id: FU001
    title: Customer adoption journey and expansion lifecycle
    type: journey-map
    summary: >-
      Enterprise adoption sequence from initial bottom-up utility building to governed platform-wide portfolio
      expansion.
    approximationNotes: >-
      Lifecycle stages synthesized from customer deployment reports, enterprise case studies, and builder survey
      findings.
    claimRefs:
      - CU007
      - CU010
      - CU012
    data:
      items:
        - label: Initial Problem Identification
          touchpoints:
            - Operations or engineering team identifies acute SaaS limitation or slow internal tool delivery
            - Frustration with high third-party SaaS pricing or delayed engineering tickets
        - label: Bottom-Up Developer Discovery
          touchpoints:
            - Single developer signs up for free tier or creates app via vibe-coding or MCP CLI
            - Rapid prototyping on direct SQL or REST API connections without procurement delay
        - label: First Operational Production App
          touchpoints:
            - Standalone admin dashboard, user onboarding tool, or customer lookup deployed
            - App saves immediate weekly operational hours for department operators
        - label: Departmental Tool Proliferation
          touchpoints:
            - Peer builders duplicate templates and create 5 to 30 custom departmental tools
            - Emergence of unmanaged shadow IT creating schema and access governance concerns
        - label: Central IT Intervention & Governance
          touchpoints:
            - Enterprise IT initiates security audit, requiring SSO, RBAC, and centralized audit logging
            - Adoption of Enterprise plan for self-hosted or VPC runtime with managed permissions
        - label: Portfolio Control Plane Expansion
          touchpoints:
            - Standardization on Retool as core internal tools infrastructure across business units
            - Deployment of shared UI components, Retool RPC, and automated AI workflow agents
