      - CO003
      - CO004
      - CO005
      - CO006
      - CO010
      - CO011
    data:
      items:
        - label: Retool Founded & YC W17
          date: '2017-01-01'
          detail: >-
            David Hsu founds Retool following experience building internal tools at Cashew; joins Y Combinator Winter
            2017 batch.
          tone: positive
        - label: Developer Platform Traction
          date: '2020-02-01'
          detail: >-
            Retool establishes strong commercial product-market fit among software engineering teams building internal
            database dashboards.
          tone: positive
        - label: Series C Unicorn Financing
          date: '2022-07-01'
          detail: >-
            Raises $45M Series C led by Sequoia Capital at $3.2B valuation with Stripe founders, Nat Friedman, and Elad
            Gil participating.
          tone: positive
        - label: Scale to $90M ARR
          date: '2024-12-31'
          detail: >-
            Retool achieves estimated $90M annual recurring revenue run-rate across scaled technical enterprise
            accounts.
          tone: positive
        - label: Q1 2025 Multipage Release
          date: '2025-03-15'
          detail: >-
            Rolls out default multipage app architecture improving page load performance by 27% alongside component
            localization.
          tone: neutral
        - label: Enterprise AppGen Launch
          date: '2025-04-15'
          detail: >-
            Unveils enterprise AppGen capabilities to generate full-stack applications from prompts on production data
            with governance.
          tone: positive
        - label: Autonomous AI Agents
          date: '2025-05-15'
          detail: >-
            Introduces Retool Agents, establishing new consumption-based monetization models based on agent hours and
            prompting credits.
          tone: positive
        - label: Expansion to $120M ARR
          date: '2025-10-15'
          detail: >-
            Reaches estimated $120M ARR milestone following rollout of AI primitives and Neon database partnership
            integration.
          tone: positive
        - label: 2026 Build vs Buy Shift
          date: '2026-02-17'
