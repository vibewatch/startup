callouts:
  - calloutType: "risk"
    title: "Multi-Dimensional Pricing Friction and Cost Cliff Risk"
    body: "Retool's hybrid pricing architecture combines per-seat developer licensing with usage meters for workflows, AI tokens, and external stakeholders. While self-serve entry is frictionless, scaling organizations face steep cost step-functions when transitioning to Business or Enterprise tiers for basic governance features."
    claimRefs:
      - "CI002"
      - "CI003"
      - "CI007"
  - calloutType: "insight"
    title: "Deployment Model Determines Realized Software Gross Margins"
    body: "Retool achieves high gross margins when enterprise customers deploy on private self-hosted infrastructure, offloading compute and networking costs. Conversely, managed cloud-hosted apps and autonomous AI agents incur pass-through compute and LLM API expenses that compress net unit margins."
    claimRefs:
      - "CI008"
      - "CI009"
      - "CI010"
