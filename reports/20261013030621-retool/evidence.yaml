evidenceGaps:
  - type: missing-source
    severity: material
    topic: audited-financials
    missingEvidence: >-
      Audited GAAP financial statements, current verified ARR bridge, gross margin profile, and cohort net revenue
      retention figures.
    whyItMatters: >-
      Without primary GAAP disclosures or audited ARR schedules, valuation multiples and long-term operating leverage
      cannot be independently validated.
    diligencePath: >-
      Request confidential CFO financial disclosures, audited revenue bridges, and customer cohort retention data under
      non-disclosure agreement.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: executive-bench
    missingEvidence: >-
      Comprehensive disclosure of Retool broader executive leadership team, board composition, and functional heads
      across finance, legal, and security.
    whyItMatters: >-
      Heavy reliance on founder-CEO David Hsu creates key-person operational risk if broader executive governance is
      thin.
    diligencePath: >-
      Conduct management background reference checks and request executive organization chart with board governance
      mandates.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table-liquidity
    missingEvidence: >-
      Detailed capitalization table showing post-2022 share classes, liquidation preferences, secondary transactions,
      and employee option pool sizing.
    whyItMatters: >-
      Private valuations may mask senior liquidation preference structures or secondary discounts that materially alter
      common equity value.
    diligencePath: Examine detailed capitalization table, investor rights agreements, and recent 409A valuation reports.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-pricing-durability
    missingEvidence: >-
      Audited segment-level net revenue retention (NRR), customer renewal cohorts, and gross margin breakdown between
      self-hosted and cloud deployments.
    whyItMatters: >-
      Without segmented retention data, it is impossible to verify whether custom AppGen deployments generate durable
      recurring software economics or face churn once initial internal tools stabilize.
    diligencePath: >-
      Request customer cohort retention and gross margin disclosure from Retool's finance team or examine secondary
      transaction disclosures.
    relatedQuestionRefs:
      - QM009
  - type: conflicting-data
    severity: minor
    topic: market-sizing-and-saas-displacement-velocity
    missingEvidence: >-
      Independent quantitative measurement reconciling vendor survey claims of 35% SaaS displacement with actual
      third-party enterprise IT budget reallocations.
    whyItMatters: >-
      Survey-based build-vs-buy data from vendor customers may overestimate broader market displacement rates of
      established commercial SaaS suites.
    diligencePath: >-
      Cross-reference CIO budget surveys and Gartner/IDC enterprise application spending reports to measure actual SaaS
      contract cancellations.
    relatedQuestionRefs: []
  - type: private-evidence-only
    severity: material
    topic: competitor-retention
    missingEvidence: >-
      Disclosed enterprise net revenue retention (NRR) benchmarks and multi-year cohort retention curves comparing
      Retool against low-code peers.
    whyItMatters: >-
      Without verified retention disclosures, it is impossible to quantitatively confirm whether seat-based pricing
      friction leads to elevated customer attrition as internal applications proliferate.
    diligencePath: >-
      Request audited cohort retention breakdowns and gross revenue retention data for enterprise accounts during
      private investor diligence.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: financial-traction
    missingEvidence: Audited GAAP revenue, ARR bridge, and gross margin figures across Cloud and self-hosted product lines.
    whyItMatters: >-
      Without official revenue and gross margin data, underwriting Retool's operating leverage and enterprise valuation
      requires speculative assumptions.
    diligencePath: Request confidential historical income statements and cohort revenue breakdowns under non-disclosure agreement.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: retention-dynamics
    missingEvidence: Net revenue retention (NRR) and gross churn rates segmented by company size and deployment model.
    whyItMatters: >-
      High list pricing on developer seats may cause seat downsizing or churn if internal tooling usage does not sustain
      value.
    diligencePath: Analyze customer cohort expansion data and enterprise license renewal rates from recent fiscal quarters.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: deployment-models
    missingEvidence: >-
      Independent third-party verification of multi-tenant Retool Cloud recovery-time objectives (RTO), recovery-point
      objectives (RPO), and cross-region failover SLA enforcement.
    whyItMatters: >-
      Enterprise buyers deploying business-critical operations software require verified disaster recovery commitments
      beyond standard marketing uptime statements.
    diligencePath: >-
      Request enterprise service-level agreements (SLAs), recent SOC 2 Type II disaster recovery audit reports, and
      multi-region failover runbooks during technical underwriting.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration-metrics
    missingEvidence: >-
      Audited cohort retention curves, net revenue retention (NRR), gross revenue retention (GRR), and top-10 customer
      concentration percentages for 2025-2026.
    whyItMatters: >-
      Without segmented retention data, investors cannot verify whether expansion revenue from maturing enterprise
      accounts offsets churn from small self-serve developer teams.
    diligencePath: >-
      Request confidential SaaS cohort retention tables, customer concentration breakdowns, and annual contract value
      renewal data during formal diligence.
    relatedQuestionRefs:
      - QU009
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: partner-concentration
    missingEvidence: >-
      Disclosed counterparty concentration metrics, multi-cloud redundancy failover benchmarks, and contractual model
      SLAs across OpenAI and Anthropic upstream providers.
    whyItMatters: >-
      Heavy reliance on upstream LLM APIs and cloud infrastructure poses unhedged operational continuity and margin
      compression risks during provider service interruptions.
    diligencePath: >-
      Review vendor agreements, multi-cloud failover architectures, and enterprise business continuity disaster recovery
      audit reports.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: audited-financials-and-retention
    missingEvidence: >-
      Audited financial disclosure including FY2025-2026 GAAP revenue, ARR build, gross margins, net revenue retention
      (NRR), and customer acquisition costs.
    whyItMatters: >-
      Without primary financial reporting, Retool's $3.2B valuation multiple cannot be validated against public SaaS
      comps or private transaction benchmarks.
    diligencePath: >-
      Request private financial statements, cohort retention tables, and revenue breakdown across self-hosted and cloud
      tiers from management.
    relatedQuestionRefs:
      - QV009
    relatedTableRefs:
      - TV003
