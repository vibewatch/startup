  topStrengths:
    - Strong enterprise product-market fit with governed internal app, workflow, and AI-agent tooling.
    - Broad customer adoption across more than 10,000 teams and marquee enterprise references.
    - Security, RBAC, auditability, and deployment flexibility support regulated workflows.
  topRisks:
    - >-
      Public valuation remains anchored to a July 2022 mark that appears stretched versus current public software
      multiples.
    - Public financial disclosure is thin; ARR, gross margin, NRR, and headcount remain incompletely verified.
    - Seat-based and usage-based pricing can create friction as deployments scale across broad operational teams.
  unresolvedGaps:
    - Current ARR or GAAP revenue bridge with gross margin and cohort retention.
    - Any post-2022 financing, secondary pricing, or cap-table / preference-stack disclosure.
    - Customer concentration, renewal quality, and net revenue retention by segment.
    - Clear reconciliation of lifetime funding and current employee count.
    - Evidence that AI, workflow, and self-hosted monetization scale durably without rising implementation friction.
