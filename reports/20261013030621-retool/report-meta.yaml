companyProfile:
  summary: >-
    Retool is a late-stage private platform for building governed internal apps, workflows, and AI agents over
    enterprise data and APIs. It pairs visual development with SQL, JavaScript, native connectors, RBAC, audit logs, and
    deployment options that span managed cloud, customer VPCs, and self-hosted Kubernetes. The business appears to have
    durable enterprise traction, but public diligence still depends on estimated ARR and limited disclosure around
    retention, margins, and current financing terms.
