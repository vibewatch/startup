  - id: TE002
    title: Operational Workflow & Use-Case Evaluation
    columns:
      - User Job
      - Legacy Workflow
      - Retool Solution
      - Measurable Benefit
      - Technical Limitation
    rows:
      - - Customer 360 & Support Lookup
        - Disjointed CRM tabs, SQL consoles, and Stripe admin
        - Unified support dashboard with live database and API queries
        - Consolidates lookup time from minutes to seconds
        - Query performance depends directly on underlying database latency
      - - Refund & Dispute Approval
        - Manual email approvals and manual admin console writes
        - Two-step approval queue with RBAC-gated writeback actions
        - Audit-logged execution prevents duplicate payouts
        - Hard-coded approval thresholds require builder updates
      - - Inventory & Field Logistics
        - Paper forms and spreadsheets without real-time sync
        - Native mobile app with offline mode and barcode scanning
        - Immediate inventory updates with zero desk dependency
        - Camera barcode scan speed varies across device hardware
      - - Automated Data Triage & ETL
        - Cron scripts on unmonitored virtual machines
        - Retool Workflows with alerts, retries, and visual logs
        - Visual pipeline tracking with automated failure alerts
        - Payload size constraints on serverless workflow runner nodes
    notes: Analysis of operational use cases documented across developer evaluations and practitioner reviews.
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE011
  - id: TE003
    title: Technology Stack & Operating Architecture Matrix
    columns:
      - Architecture Layer
      - Underlying Technology
      - Operational Role
      - Key Dependency
      - Primary Operational Risk
    rows:
      - - Frontend Presentation
        - React, TypeScript, browser DOM
        - Renders interactive UI components and client state
        - Browser JS engine performance
        - Sluggish DOM performance on large client-rendered data grids
      - - App Generation & AI
        - LLM APIs (OpenAI/Anthropic), Vector DB
        - Natural language UI scaffolding and autonomous agents
        - Third-party model API availability and prompt stability
        - Model hallucinations and schema misalignments in complex prompts
      - - Backend Execution & RPC
        - Node.js, Go runtime, Retool RPC SDK
        - Executes queries, transforms data, and handles polling RPC
        - Network egress stability from customer VPC
        - Connection pool exhaustion under bursty background queries
      - - Data & Enterprise Governance
        - PostgreSQL, Redis, SCIM, SSO, Git sync
        - Session state, configuration store, RBAC, audit logging
        - Customer identity provider and database availability
        - DevOps maintenance burden for self-hosted container upgrades
    notes: Synthesized from Retool technical architecture specifications, docs, and developer evaluations.
    claimRefs:
      - CE003
      - CE004
      - CE010
      - CE012
figures:
  - id: FE001
    title: Retool Full-Stack Operating & Governance Architecture
    type: stack
    summary: Layered system architecture showing user touchpoints, AI generation, execution engine, data connectors, infrastructure, and enterprise governance.
    data:
      layers:
        - label: User Interface & Client Presentation Layer
          modules:
            - label: Retool Web Apps (React component canvas, custom JS logic)
            - label: Retool Mobile (iOS & Android native apps, offline storage)
            - label: External Portals (Customer & partner facing authenticated apps)
        - label: AI AppGen & Autonomous Agent Layer
          modules:
            - label: Assist / AppGen (Prompt-driven natural language app generator)
            - label: Retool Agents (Multi-step reasoning agents with tool access)
            - label: AI Primitives (Vector database RAG, document extraction, LLM actions)
        - label: Workflow Orchestration & Automation Layer
          modules:
            - label: Retool Workflows (Event-driven visual automation engine)
            - label: Cron & Webhook Schedulers (Background jobs and alerts)
            - label: Transformation Runners (Python and JavaScript data handlers)
        - label: Execution, RPC & Extensibility Layer
          modules:
            - label: Retool RPC (Outbound polling SDK inside customer VPC)
            - label: MCP Server Integration (Model Context Protocol for coding agents)
            - label: Custom Component Runtime (Imported React and TypeScript modules)
        - label: Enterprise Data Connectivity Layer
          modules:
            - label: Managed Retool Database (Built-in PostgreSQL storage)
            - label: Native Connectors (70+ SQL, NoSQL, data warehouses, REST/GraphQL)
            - label: Query Library & Reusable Resources (Shared parameter logic)
        - label: Governance, Security & Deployment Foundation
          modules:
            - label: Identity & Access (SSO, SCIM, role-based access control)
            - label: Audit & Compliance (Comprehensive execution audit logs)
            - label: Deployment Runtime (Retool Cloud vs. Self-hosted Docker/Kubernetes)
    approximationNotes: null
