chapter:
  number: 6
  title: "Customers"
  summary: "Retool has scaled to over 10,000 customer organizations with verified production deployments across major technology enterprises like Amazon, Stripe, and Brex. Growth is increasingly propelled by enterprise SaaS replacement and bottom-up builder adoption, though seat-based licensing friction and developer dependency pose ongoing durability challenges."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation and Buyer Personas"
    body: >
      Retool's commercial traction spans a diverse spectrum of customer profiles, ranging from high-growth technology startups
      building initial administrative portals to Fortune 500 enterprises standardizing entire internal tool ecosystems. The primary
      economic buyer varies sharply by organizational scale: small and mid-market companies are typically represented by engineering
      leads or technical founders seeking rapid CRUD UI scaffolding over SQL databases, whereas large enterprise contracts are purchased
      by central IT and VP-level engineering leadership looking for centralized access controls and governed deployment environments.
      Across these organizations, Retool distinguishes between builders who create and maintain tools and internal end-users who execute
      operational workflows. Operations teams, customer support units, and finance analysts represent the largest internal user populations,
      leveraging over 70 native database and API integrations to automate data lookups, billing operations, and inventory reconciliation.
      However, because advanced applications require fluency in JavaScript and SQL, non-technical business departments frequently encounter
      an implementation bottleneck, remaining dependent on technical staff to build and update mission-critical internal applications.
    claimRefs:
      - "CU001"
      - "CU009"
      - "CU010"
      - "CU013"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-metrics"
    title: "Adoption Trajectory, SaaS Replacement, and Developer Velocity"
    body: >
      Adoption velocity has expanded beyond conventional admin panels into widespread custom software replacement. The platform supports
      over 10,000 active customer organizations operating production applications on their live enterprise data. A decisive driver of
      this trajectory is the economic re-evaluation of commercial vertical SaaS: in Retool's comprehensive survey of 817 enterprise builders,
      35 percent of respondent organizations confirmed they have already replaced at least one commercial third-party SaaS tool with a custom
      internal Retool application. Furthermore, 78 percent of surveyed builders expect to construct additional custom tools throughout 2026,
      encouraged by accelerated AI-assisted application generation and agentic orchestration. Bottom-up developer momentum frequently outpaces
      formal corporate procurement, with 60 percent of surveyed builders reporting that they constructed operational software outside formal
      IT oversight in the past year. While this bottom-up adoption generates rapid organic footprint expansion, it introduces shadow IT risks
      that eventually force centralized IT intervention, security reviews, and enterprise governance consolidation.
    claimRefs:
      - "CU001"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU002"
  - id: "named-customer-proof-and-deployments"
    title: "Named Enterprise Deployments and Production Outcomes"
    body: >
      Retool's reference customer roster demonstrates substantial enterprise penetration across market leaders including Amazon, Stripe,
      Brex, and Orangetheory Fitness, each running production software directly connected to core operational systems. Detailed deployment
      evidence shows measurable cost reduction and operational independence. At startup discovery platform Harmonic, engineering leaders
      faced recurring support delays from an external vendor costing $20,000 annually; rebuilding the tool directly in Retool eliminated the
      vendor license and triggered a broader cultural transition that now sustains 33 production applications integrated with Salesforce,
      Gong, Slack, and internal APIs under unified audit logging. Similarly, AWS Generative AI Innovation Center employs Retool as an
      application interface layer to demonstrate and deploy complex generative AI workflows and model evaluations for enterprise clients.
      These verified deployments demonstrate that Retool functions not merely as an evaluation prototyping sandbox, but as durable,
      long-lived production infrastructure powering daily business workflows across technology, financial services, and consumer operations.
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU008"
    tableRefs:
      - "TU003"
  - id: "durability-expansion-and-concentration-risks"
    title: "Account Durability, Expansion Mechanics, and Concentration Risks"
    body: >
      Account expansion within Retool follows a documented land-and-expand trajectory: individual development teams initially deploy a single
      administrative tool, subsequently expanding into dozens or hundreds of departmental applications managed under Retool's centralized
      control plane. Reusable component libraries, standardized database connection patterns, and Retool RPC significantly reduce the marginal
      cost of constructing subsequent applications. Nevertheless, account durability faces two structural headwinds. First, per-user pricing
      models separate builder seats from internal operational user seats, causing software licensing fees to escalate rapidly as tools are
      rolled out to wide frontline populations. Second, Retool provides no public disclosures regarding customer net revenue retention (NRR),
      gross revenue retention (GRR), or annual logo churn rates. Furthermore, revenue concentration among its largest enterprise accounts
      remains undisclosed. Investors must verify whether rapid expansion in technical power-user accounts is sufficient to counterbalance
      seat-pricing procurement friction and potential churn in price-sensitive mid-market cohorts.
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU014"
      - "CU015"
    figureRefs:
      - "FU001"
