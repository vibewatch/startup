company:
  name: Retool
chapter:
  number: 1
  title: Company Overview
  summary: Retool is an enterprise application generation and internal tools platform founded in 2017 by CEO David Hsu. Headquartered in San Francisco, the company reached an estimated $120M in ARR by late 2025 across more than 10,000 teams, supported by $141M in lifetime funding and a July 2022 Series C valuation of $3.2B led by Sequoia Capital.
sections:
  - id: identity-and-founding
    title: Corporate Identity, Founding History, and Mission
    body: Retool was founded in 2017 by current Chief Executive Officer David Hsu following his direct experience with repetitive internal software development during his earlier payments venture Cashew. Headquartered in San Francisco, California, the company set out to replace ad-hoc internal dashboards and bespoke CRUD utilities with a unified development canvas combining visual building blocks, SQL queries, and JavaScript extensibility. Over nearly a decade of commercial execution, the business has transitioned from an individual developer utility into an enterprise-wide application generation platform that bridges business databases, SaaS APIs, and AI models under centralized administrative controls. David Hsu has maintained continuous executive leadership and architectural direction since inception, providing strong technical focus but creating a concentrated key-person dependency in the absence of a visible, externally highlighted operational co-founder bench.
    claimRefs:
      - CO001
      - CO002
      - CO008
    tableRefs:
      - TO002
  - id: capitalization-and-stakeholders
    title: Capitalization Structure, Valuation History, and Key Stakeholders
    body: Retool institutional capitalization path began with acceptance into Y Combinator Winter 2017 cohort, which catalyzed early developer adoption and seed capital. The company achieved substantial commercial expansion over the subsequent five years, culminating in a $45 million Series C financing round in July 2022 that valued the business at $3.2 billion post-money. Sequoia Capital led the Series C financing, joined by an elite syndicate of technology executives and venture firms including Stripe co-founders Patrick and John Collison, former GitHub CEO Nat Friedman, investor Elad Gil, and BOND Capital. In aggregate, Retool has raised approximately $141 million across disclosed venture rounds. Because the company has not raised a publicly disclosed equity financing since mid-2022, its capitalization table, liquidation preference stack, and current secondary valuation profile remain closely guarded private company information.
    claimRefs:
      - CO003
      - CO004
      - CO005
    tableRefs:
      - TO003
  - id: scale-and-platform-evolution
    title: Operating Scale, Product Evolution, and Milestone Progression
    body: Retool operating footprint has expanded to serve over 10,000 teams and Fortune 500 enterprise customers across varied industries. Independent market intelligence estimates that Retool scaled its annual recurring revenue to $120 million in October 2025, up from $90 million at the end of 2024, demonstrating resilient growth even amidst broad software budgeting scrutiny. This revenue acceleration coincided with strategic product releases throughout 2025 and 2026, most notably the launch of multipage applications, enterprise AppGen, and autonomous AI Agents with consumption-based monetization units. Rather than confining users to a proprietary walled garden, Retool 2026 architecture embraces external vibe coding workflows, introducing Model Context Protocol (MCP) server support, command-line deployment utilities, and direct ingestion of React code generated in external IDEs like Lovable or Replit.
    claimRefs:
      - CO006
      - CO007
      - CO010
      - CO011
    tableRefs:
      - TO001
    figureRefs:
      - FO001
  - id: governance-and-commercial-tradeoffs
    title: Enterprise Governance, Pricing Dynamics, and Operating Dilemmas
    body: 'The core strategic defensibility of Retool rests upon enterprise governance: offering SOC 2 Type II compliance, granular role-based access control, automated audit logging, enterprise single sign-on, and customer-hosted Virtual Private Cloud or on-premises deployment options. However, this enterprise focus introduces material commercial friction for expanding customers. Retool concentrates advanced governance, source control, and self-hosting capabilities into high-tier Business and custom Enterprise plans, while total software spending escalates across builder seats, internal end-user licenses, workflow run counts, and AI credit consumption. Furthermore, the maturation of open-source alternatives such as Appsmith, Budibase, and ToolJet exerts ongoing pricing pressure, particularly among technical teams seeking code ownership and predictable infrastructure costs.'
    claimRefs:
      - CO009
      - CO012
      - CO013
      - CO014
