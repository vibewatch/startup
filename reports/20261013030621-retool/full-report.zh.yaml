  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将企业规模和竞争拥挤度依次连接到估值立场和最终建议的分析链条。
    approximationNotes: 展示从企业客户势头，到估值风险，再到投资建议立场的定性分析进程。
    data:
      nodes:
        - id: enterprise-scale
          label: 企业规模
          description: 10,000+ 家组织和 500,000+ 名构建者验证了企业需求和产品市场契合度。
          tone: positive
        - id: product-governance
          label: 受治理的 AppGen
          description: 集成 SSO、RBAC 和 VPC 部署，抵御原型级 AI 工具对工作流黏性的侵蚀。
          tone: positive
        - id: competitive-crowding
          label: 竞争拥挤
          description: 266 家活跃市场竞争者和无处不在的 AI 编程工具，正在压缩开发者平台的定价权。
          tone: warning
        - id: valuation-staleness
          label: 估值滞后
          description: $3.2B 估值自 2022 年 7 月以来一直未刷新，形成显著的倍数悬压。
          tone: negative
        - id: multiple-realignment
          label: 倍数重估
          description: 预计 $120M ARR 对应 26.7x 倍数；若要与公开可比公司估值水平接轨，倍数必须大幅收缩。
          tone: negative
        - id: recommendation-stance
          label: 继续研究立场
          description: 建议维持继续研究立场，并跟进尽调，等待经审计财务数据确认及 ARR 核实。
          tone: neutral
      edges:
        - from: enterprise-scale
          to: product-governance
        - from: product-governance
          to: competitive-crowding
        - from: competitive-crowding
          to: valuation-staleness
        - from: valuation-staleness
          to: multiple-realignment
        - from: multiple-realignment
          to: recommendation-stance
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV008
      - CV010
