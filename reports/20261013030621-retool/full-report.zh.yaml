companyProfile:
  summary: >-
    Retool 是一个后期私营平台，帮助企业基于数据和 API 构建受治理的内部应用、工作流和 AI Agent。平台把可视化开发与 SQL、JavaScript、原生连接器、RBAC、审计日志结合起来，支持托管云、客户 VPC
    和自托管 Kubernetes 等部署方式。公司似乎已获得持续的企业客户吸引力，但公开尽调仍依赖预估 ARR；留存率、利润率和当前融资条款披露有限。
