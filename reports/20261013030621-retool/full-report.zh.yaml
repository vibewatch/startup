      - number: '5.3'
        title: AI 能力、AppGen 生成与自主 Agent
        blocks:
          - type: paragraph
            body: >-
              Retool 的 AI 战略围绕 AppGen 和 Retool Agents 展开，把 AI 定位为受企业治理的工作流加速基础能力，而不是无约束的代码生成器。Retool AppGen
              允许构建者用自然语言提示生成全栈内部应用；它不是吐出无法通过合规审查、未经验证的原始代码文件，而是直接基于实时生产数据库模式、既有权限和企业访问控制，生成由模块化可信 UI 组件组成的应用。Retool
              Agents 则提供自主推理框架，让大语言模型评估运营数据，并通过集成 API 和工作流执行多步业务动作。为降低敏感运营工作流中的幻觉风险和监管暴露，Retool 设置人工介入审核门槛：Agent
              执行高风险写回交易或资金拨付前，必须获得操作员明确批准。
            claimRefs:
              - CE006
              - CE007
      - number: '5.4'
        title: 部署模式、治理控制与技术取舍
        blocks:
          - type: paragraph
            body: >-
              Retool 支持两种部署拓扑，以适应不同的企业合规和数据驻留要求：完全托管的多租户 Retool Cloud SaaS，以及运行在客户私有基础设施 Docker 或 Kubernetes
              集群中的企业自托管部署。Retool 持续为自托管客户维护企业发行线，支持 2026 年 10 月发布的 4.34.8-stable 和 4.0.21-stable
              等长期稳定分支。企业治理基础能力通过单点登录、自动 SCIM 身份配置、跨资源和空间的细粒度 RBAC，以及记录每次查询和 Agent
              操作的不可篡改审计日志，强制维持严格安全态势。但架构取舍仍然明显：Retool 应用在客户端浏览器 DOM 中执行，绑定海量查询数据的复杂仪表盘经常出现客户端渲染迟缓和浏览器内存压力。此外，运营自托管
              Retool 集群会持续产生大量 DevOps 开销，包括数据库迁移、容器补丁和网络入口管理；SSO、Git 同步等关键治理能力仍限制在高阶企业商业方案中。
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
