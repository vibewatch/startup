            - label: 托管 Retool Database（内置 PostgreSQL 存储）
            - label: 原生连接器（70+ SQL、NoSQL、数据仓库、REST/GraphQL）
            - label: 查询库与可复用资源（共享参数逻辑）
        - label: 治理、安全与部署基础层
          modules:
            - label: 身份与访问（SSO、SCIM、基于角色的访问控制）
            - label: 审计与合规（全面的执行审计日志）
            - label: 部署运行时（Retool Cloud 与自托管 Docker/Kubernetes）
    approximationNotes: null
    claimRefs:
      - CE003
      - CE004
      - CE006
      - CE008
      - CE010
  - id: FU001
    title: 客户采用旅程与扩张生命周期
    type: journey-map
    summary: 企业从自下而上的实用工具构建起步，逐步扩张到受治理的平台级工具组合。
    approximationNotes: 生命周期阶段综合客户部署报告、企业案例研究和构建者调研结果。
    claimRefs:
      - CU007
      - CU010
      - CU012
    data:
      items:
        - label: 识别初始问题
          touchpoints:
            - 运营或工程团队发现 SaaS 存在严重限制，或内部工具交付速度过慢
            - 第三方 SaaS 价格高昂，或工程工单等待时间过长，引发挫败感
        - label: 自下而上的开发者发现
          touchpoints:
            - 单个开发者注册免费层，或通过 vibe-coding 或 MCP CLI 创建应用
            - 直接连接 SQL 或 REST API 快速原型开发，无需等待采购
        - label: 首个运营生产应用
          touchpoints:
            - 部署独立的管理仪表盘、用户入门工具或客户查询工具
            - 应用立即为部门运营人员节省每周运营工时
        - label: 部门工具扩散
          touchpoints:
            - 同行构建者复制模板，创建 5 到 30 个定制部门工具
            - 无管理的影子 IT 出现，引发数据结构和访问治理担忧
        - label: 中央 IT 介入与治理
          touchpoints:
            - 企业 IT 启动安全审计，要求 SSO、RBAC 和集中式审计日志
            - 采用 Enterprise 计划，以获得自托管或 VPC 运行时及托管权限
        - label: 工具组合控制平面扩张
          touchpoints:
            - 各业务部门统一采用 Retool，作为核心内部工具基础设施
            - 部署共享 UI 组件、Retool RPC 和自动化 AI 工作流 Agent
