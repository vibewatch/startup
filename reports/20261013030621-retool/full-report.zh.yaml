            tableRef: TO001
            claimRefs:
              - CO003
              - CO005
              - CO006
              - CO007
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO006
              - CO010
              - CO011
      - number: '1.4'
        title: 企业治理、定价动态与运营困境
        blocks:
          - type: paragraph
            body: >-
              Retool 的核心战略防御力来自企业治理：提供 SOC 2 Type II 合规、细粒度 RBAC、自动审计日志、企业单点登录，以及客户托管 VPC
              或本地部署选项。但这种企业聚焦也给扩张中的客户带来明显商业摩擦。Retool 将高级治理、源码控制和自托管能力集中在高阶 Business 及定制 Enterprise
              方案中；构建者席位、内部终端用户许可、工作流运行次数和 AI 积分消耗会共同推高软件总支出。与此同时，Appsmith、Budibase 和 ToolJet
              等开源替代品逐渐成熟，持续施加定价压力，尤其影响重视代码所有权和基础设施成本可预测性的技术团队。
            claimRefs:
              - CO009
              - CO012
              - CO013
              - CO014
      - number: '1.5'
        title: 重点观察
        blocks:
          - type: callout
            title: 从拖拽式构建器转向受治理的 AppGen 平台
            body: >-
              Retool 已将价值主张从手动拖拽式内部 UI 构建器，战略性地转向受企业治理的应用生成平台。通过引入 MCP 服务器、CLI 部署，以及从 Lovable、Replit 等工具导入外部代码，Retool
              希望围绕影子 IT 和 vibe-coded 应用集中企业治理，同时不强迫开发者使用专有可视化编辑器。
            calloutType: insight
            claimRefs:
              - CO009
              - CO011
          - type: callout
            title: 估值停滞与企业定价摩擦
            body: >-
              截至 2025 年末，Retool 的预估 ARR 已达到 $120M，但最近一次披露的 $3.2B 估值仍停留在 2022 年 7 月，相当于偏高的 26.7x ARR 倍数。此外，把必要的安全、SSO
              和自托管能力锁在不透明的定制企业层级中，会造成扩张摩擦，也给开源替代品留下竞争空间。
            calloutType: risk
            claimRefs:
              - CO003
              - CO006
              - CO012
              - CO014
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类定义与支出分类
        blocks:
          - type: paragraph
            body: >-
              企业内部软件市场长期处于定制开发与商业现成 SaaS 之间的模糊边界。各组织每年花费数千亿美元购买僵化的第三方应用，或投入昂贵的全栈工程资源搭建内部 CRUD 仪表盘。Retool
              将核心可服务边界定义为定制运营软件：直接连接生产数据库、API 和业务系统，而不要求开发者维护定制 UI 脚手架。该边界有意排除面向消费者的软件、公开营销网站和核心交易型
              ERP，引导重点转向内部仪表盘、工作流自动化、客户支持控制台和审批门户。借助基于提示词的 AppGen 与自主 Agent，Retool 又把边界扩展到运营自动化，直接与传统 SaaS 插件和手工后台流程竞争。
            claimRefs:
              - CM001
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
      - number: '2.2'
        title: 软件与 AI 预算中的 TAM、SAM 和 SOM 估算
        blocks:
          - type: paragraph
            body: >-
              评估 Retool 的可服务市场，需要把笼统的企业软件估算拆成受证据约束的具体支出层。第三方分析机构 Sacra 估计，Retool 在 2025 年 10 月达到 $120 million ARR，高于
              2024 年底的 $90 million，收入来自开发者席位订阅，以及 AI 提示词积分和 Agent 执行时长等新变现单位。受治理的内部开发工具和运营仪表盘 SOM 约代表每年 $2.5 billion
              的企业支出。再向上看，SAM 覆盖定制软件开发和 SaaS 替代，驱动力是企业团队希望获得定制应用，而非多租户供应商工作流。宏观层面，TAM 延伸至规模更大的 $500 billion 企业软件与 AI
              工作负载生态，组织正积极从静态仪表盘转向自主 Agent 系统。
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM007
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM012
              - CM013
              - CM014
      - number: '2.3'
        title: 买方画像、用户分层与采购路径
        blocks:
          - type: paragraph
            body: >-
              Retool 的企业采购体现为技术构建者与中央治理部门之间的双向推进。早期采用通常自下而上，由软件工程师、产品经理和数据分析师使用 Retool
              绕开内部冲刺积压，在数小时而非数周内交付内部工具。但当应用扩展到服务数千员工的生产关键工作流后，采购会转向中央 IT、工程管理层和安全高管。预算通常归 IT
              运营、企业工程或专门的自动化卓越中心所有。采购触发点往往是昂贵第三方 SaaS 合同达到难以承受的程度，或发现无人监管的影子 IT 项目。企业层级升级则由 SSO、细粒度 RBAC、完整审计日志，以及本地或
              VPC 部署要求驱动。
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: 采用驱动因素、结构性阻力与估值尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Retool 的主要增长动力，是企业软件中自建与购买之间的权衡正在变化。在 Retool 对超过 800 名构建者的调查中，35% 的企业团队称已用定制开发替代至少一个商业 SaaS 工具，78% 预计 2026
              年会构建更多定制内部工具。但 AI 快速采用也带来严重的运营和架构约束。行业调查显示，93% 的 CIO 和 CISO 担心未受治理的 vibe-coded 应用在生产环境运行，其中 38%
              将其列为首要运营风险。由于只有 8% 的组织认为自身 AI
              治理能力强，平台强制合规已成为生产上线不可妥协的门槛。一个重要尽调缺口仍在于：定制软件替代能否带来持久留存和较高净扩张率，还是开源替代品与内部工程投入会压制长期定价权。
            claimRefs:
              - CM001
              - CM004
              - CM011
      - number: '2.5'
        title: 重点观察
        blocks:
          - type: callout
            title: Vibe coding 驱动的 SaaS 替代速度超过 IT 治理
            body: 定制内部构建正在加速：35% 的企业团队已经用定制软件替代商业 SaaS。但 60% 的受访者在 IT 监管之外构建软件，市场能否扩大，取决于平台能否提供企业级治理，而不只是更快生成代码。
            calloutType: insight
            claimRefs:
              - CM004
              - CM008
          - type: callout
            title: 企业安全边界限制自主 Agent 采用
            body: 自主 Agent 把可服务市场从静态仪表盘扩展到自主运营，但企业 IT 负责人优先要求平台强制认证、审计轨迹和数据层 RBAC，以防止无人监管的 AI 执行。
            calloutType: risk
            claimRefs:
              - CM001
              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与替代品类
        blocks:
          - type: paragraph
            body: >-
              Retool 周边竞争分为四类架构：商业低代码套件、开源开发者平台、既有企业应用生态和现状定制代码。Superblocks 等商业替代品以 AI
              辅助生成和集中管理服务企业平台团队。Appsmith、ToolJet 领衔的开源平台则通过可自托管的社区版吸引重视成本的工程组织，内部用户无需支付软件许可费。Microsoft Power Apps
              等传统巨头依靠 Microsoft 365 和 Azure 的广泛分发。尽管有这些专门产品，Retool 的主要替代品仍是使用 React、Node.js
              和定制认证的内部软件工程；只有工程积压让低代码速度变得必要时，团队才会重新考虑。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: 平台能力与开发者取舍
        blocks:
          - type: paragraph
            body: >-
              Retool 以开发者优先、提供充分代码逃生口的模式，与无代码网站构建器及纯提示词转应用生成器区分开来。平台把超过 90 个预构建 UI 组件，与覆盖 100 多个数据库、数据仓库及 REST 或 GraphQL
              端点的原生连接器结合。它不把开发者困在僵化的可视化抽象中，而是允许任意 JavaScript 转换、直接执行 SQL，以及导入定制 React 组件。平台还增加了用于自然语言搭建应用的 AppGen、原生 AI
              Agent，以及把 Lovable、Replit 等外部 AI 构建器中的应用导入 Retool 受治理运行时的集成。Retool University 等开发者赋能项目进一步支持企业采用和工作流设计。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.3'
        title: 定价模式、产品打包与规模化摩擦
        blocks:
          - type: paragraph
            body: >-
              Retool 的商业打包在各公开层级中把用户分为构建者席位和低价内部终端用户席位。小型工程团队可在免费层或入门 Team 层验证工具（每名构建者每月 $10 至 $12、每名内部用户 $5 至
              $7），但要让内部工具覆盖大型运营团队，就需要 Business 层（每名构建者每月 $50 至 $65、每名内部用户 $14 至
              $18）。按席位叠加的费用会在应用扩展到数百名支持或运营员工时造成显著运营支出摩擦。此外，Retool 把自托管部署完全并入定制 Enterprise
              合同，使重视基础设施的团队无法自行管理中端实例，为开源替代品打开经济空间。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: 可防御性、护城河持久度与颠覆风险
        blocks:
          - type: paragraph
            body: >-
              Retool 的长期竞争防御力依赖企业治理深度、身份集成和生产数据黏性，而不是专有 UI 组件。组织一旦接入生产数据库、配置细粒度权限、建立基于 Git
              的代码审查流程，并把数十个运营工具嵌入日常工作流，切换成本就会很高。Lovable 或 Replit 等通用 AI
              代码生成器可以根据提示快速搭建原型，却没有开箱即用的原生数据库连接池、审计日志、单点登录和安全部署基础设施。Retool 充当安全运行时层，填补生产缺口，但席位定价扩张仍是关键流失风险。
            claimRefs:
              - CP001
              - CP006
              - CP008
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP006
              - CP008
              - CP015
      - number: '3.5'
        title: 重点观察
        blocks:
          - type: callout
            title: 低代码治理前沿
            body: >-
              Retool 在 2026 年的主要竞争护城河已不再是 UI 组件数量，而是企业级数据安全与治理。随着 AI 应用生成器把基础 UI 脚手架商品化，Retool 的原生连接器、RBAC
              和自托管合规能力保护其企业客户群，抵御纯提示词替代品。
            calloutType: insight
            claimRefs:
              - CP001
              - CP008
          - type: callout
            title: 规模化后的席位扩张摩擦
            body: >-
              竞争者取代 Retool 的主要路径仍是其按席位定价模式。当内部工具用户从几十人扩展到数百名运营员工时，升级到 Business 层的陡峭价格跃升会给团队强烈的财务动机，促使其评估 Appsmith
              等自托管开源替代品，或回到内部定制开发。
            calloutType: risk
            claimRefs:
              - CP011
              - CP014
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与定价架构
        blocks:
          - type: paragraph
            body: >-
              Retool 主要通过多维软件订阅模式变现，将应用构建者与内部应用使用者分开。按 2026 年公开商业条款，构建者在年付方案中每月每人 $10 至 $50（按月付 $12 至 $65），内部用户在年付合同中每月
              $5 至 $15（按月 $7 至 $18）。公司还按自动化工作流执行次数计费（每 5,000 次 $75），汇集账户级 AI 操作积分，并按自主 Agent 运行时长收费。外部门户访问另行变现，超过 50
              人免费额度后，每名外部用户每月收费 $4 至 $8。
