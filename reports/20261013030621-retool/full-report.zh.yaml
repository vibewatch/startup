        title: 产品范围、核心模块与客户工作流交付
        blocks:
          - type: paragraph
            body: >-
              Retool 是一套完整的低代码软件开发平台，旨在加快技术和运营组织内部运营工具的交付。平台覆盖多个产品面：Retool Apps 提供交互式可视化画布和丰富的预构建 UI
              组件，包括表格、表单、图表和模态检查器，开发者可用 JavaScript 和 SQL 将其绑定到实时后端数据库及 API。除桌面浏览器界面外，Retool Mobile 提供原生 iOS 和 Android
              应用，配备硬件级摄像头条码扫描、推送通知和离线数据持久化，服务现场物流及仓库运营团队。Retool Workflows 则通过事件驱动的自动化引擎处理后端业务流程，执行定时 cron 任务、webhook
              处理器和异步多步 ETL 管道，无需专用微服务基础设施。Retool University 提供涵盖安全 AI 应用开发、工作流模式和企业治理的结构化课程，支持开发者成长与组织最佳实践。
