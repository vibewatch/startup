      - number: '5.2'
        title: 系统架构、RPC 机制与可扩展性
        blocks:
          - type: paragraph
            body: >-
              Retool 的运营架构围绕一个基本要求设计：安全连接分散的企业数据源，同时提供灵活、高杠杆的执行环境。在重构后的 2026 年架构中，Retool
              将应用展示逻辑与集中式访问治理解耦，让工程团队既可可视化构建，也可导入能够无缝继承企业权限和审计日志的外部 React 前端。对使用现代 AI 编程助手的开发团队而言，Retool 暴露 Model
              Context Protocol（MCP）服务器，允许外部编码 Agent 直接在开发者 IDE 工作流中搭建和检查应用。为访问私有企业数据库而不把敏感内部端点暴露到公网，Retool RPC 使用部署在客户
              VPC 内的内部 SDK，建立用于远程过程执行的出站轮询连接，从而不再需要复杂的入站防火墙开口或反向代理。该执行引擎原生连接 70 多种数据库引擎、云数据仓库和 REST 或 GraphQL
              端点，并支持双向读写回传。
