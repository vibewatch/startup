        title: 成本结构驱动因素与利润率桥接
        blocks:
          - type: paragraph
            body: >-
              Retool 的基础毛利率很大程度取决于客户部署架构和产品功能使用情况。托管 Retool Cloud 账户承担持续的托管基础设施、数据库连接开销和第三方基础模型 API
              费用；自托管企业部署则把计算和网络出口转移到客户 VPC。自主 Agent 执行也会推高服务交付成本：多步外部 API 交互的实际运行时长消耗计量额度，却不带来软件毛利率扩张。由于 Retool
              将可视化前端组件与运行时治理打包销售，既有企业账户内扩展内部应用可带来较高增量软件利润，但数据管道自动化的按用量超额会部分抵消这一优势。
