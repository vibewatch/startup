chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立历程与使命
        blocks:
          - type: paragraph
            body: >-
              Retool 由现任首席执行官 David Hsu 于 2017 年创立。此前，他在支付创业公司 Cashew
              亲身经历了重复性的内部软件开发。公司总部位于加州旧金山，最初希望用统一的开发画布取代临时内部仪表盘和定制 CRUD 工具，将可视化积木、SQL 查询与 JavaScript
              扩展能力放在一起。近十年的商业化运营后，Retool 已从面向单个开发者的工具，转型为企业级应用生成平台，在集中管理控制下连接业务数据库、SaaS API 和 AI 模型。David Hsu
              自创立以来持续负责管理和架构方向，技术聚焦很强，但由于缺少公开可见、被外部重点介绍的运营型联合创始人团队，公司对关键人物的依赖较为集中。
            claimRefs:
              - CO001
              - CO002
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO008
      - number: '1.2'
        title: 资本结构、估值历史与关键利益相关方
        blocks:
          - type: paragraph
            body: >-
              Retool 的机构融资始于加入 Y Combinator 2017 冬季批次，这推动了早期开发者采用和种子资本进入。随后五年公司快速商业扩张，最终在 2022 年 7 月完成 $45 million 的
              Series C 融资，投后估值达到 $3.2 billion。Sequoia Capital 领投，Stripe 联合创始人 Patrick 和 John Collison、前 GitHub CEO Nat
              Friedman、投资人 Elad Gil 及 BOND Capital 等科技高管和风险投资机构参与。合计来看，Retool 在已披露风险轮次中融资约 $141 million。由于公司自 2022
              年中以来没有披露新的股权融资，其股权结构表、清算优先权序列和当前二级市场估值仍是严密保守的私营公司信息。
            claimRefs:
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO007
      - number: '1.3'
        title: 运营规模、产品演进与里程碑进展
        blocks:
          - type: paragraph
            body: >-
              Retool 的运营覆盖面已扩展到各行业超过 10,000 个团队和财富 500 强企业客户。独立市场情报估计，Retool 的 ARR 在 2025 年 10 月达到 $120 million，高于 2024
              年底的 $90 million；即使软件预算普遍受到审视，公司仍保持韧性增长。收入加速与 2025 和 2026 年持续发布战略产品同步发生，最重要的包括多页面应用、企业级
              AppGen，以及采用按用量计费单位的自主 AI Agent。Retool 2026 年的架构没有把用户锁进封闭的专有花园，而是拥抱外部 vibe coding 工作流，增加 Model Context
              Protocol（MCP）服务器支持、命令行部署工具，以及直接导入 Lovable 或 Replit 等外部 IDE 生成的 React 代码。
            claimRefs:
              - CO006
              - CO007
              - CO010
              - CO011
