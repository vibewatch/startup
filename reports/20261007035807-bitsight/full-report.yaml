              - CR016
      - number: '7.3'
        title: Operational, quality, and security execution
        blocks:
          - type: paragraph
            body: >-
              Bitsight claims broad internet-scale collection and a continuously updated supply-chain map, which creates
              both differentiation and an operating burden: asset attribution, evidence certainty, and vulnerability
              prioritization must remain accurate across a large and changing dataset. Its knowledge base explicitly
              labels evidence certainty, and Elastic's integration documentation preserves its queue and backs off on
              HTTP 429 and 5xx responses. Those controls mitigate rather than eliminate availability and data-latency
              risk. The company's 2026 agentic launch adds another execution surface because AI-enabled workflows can
              amplify stale or misattributed signals. Monitor API error rates, collection lag, attribution disputes,
              rating reversals, false-positive rates, and remediation-cycle time. Persistent failures against
              contractual thresholds or materially unreliable attribution would undermine the platform's decision value.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
