  - id: FO001
    title: Bitsight Corporate Evolution and Strategic Milestones
    type: timeline
    summary: Key corporate, financing, product innovation, and M&A milestones from Bitsight's founding in 2011 to 2026.
    data:
      items:
        - date: '2011'
          label: Company Founded
          detail: >-
            Founded in Boston, Massachusetts, by Stephen Boyer and Nagarjuna Venna to create external cyber security
            ratings.
        - date: 2018-06
          label: Series D & $600M Valuation
          detail: >-
            Raised $60M Series D led by Warburg Pincus at ~10x Series A valuation (~$600M), reaching $155M in total
            funding.
        - date: 2021-09
          label: Moody's $250M Partnership & $2.4B Valuation
          detail: >-
            Secured $250M strategic corporate round from Moody's Corporation, cementing category leadership at a $2.4B
            valuation.
        - date: 2024-04
          label: Frost Radar & Forrester Wave Leadership
          detail: 'Named a Leader in both Frost Radar for EASM and The Forrester Wave: Cybersecurity Risk Ratings Platforms.'
        - date: 2024-12
          label: Acquisition of Cybersixgill
          detail: >-
            Completed strategic acquisition of cyber threat intelligence provider Cybersixgill to integrate dark web
            intelligence.
        - date: 2025-04
