              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.2'
        title: Data Pipeline, Architecture & Algorithmic Scoring
        blocks:
          - type: paragraph
            body: >-
              At the technical foundation of Bitsight's ratings engine is an internet-scale big data collection pipeline
              deployed across the Amazon Web Services (AWS) ecosystem. The pipeline ingests security-related
              intelligence from multiple external feeds, scanning over 4 billion IP addresses to map enterprise assets,
              subsidiaries, cloud environments, and nth-party vendor connections. Data processing workloads leverage
              modern distributed architectures—incorporating Java services alongside technologies like Hadoop, Spark,
              and cloud data warehouses—to process terabytes of telemetry daily. Collected signals feed into Bitsight's
              proprietary rating algorithm, which computes objective security ratings on a standardized scale from 250
              to 900. Additionally, the platform incorporates an AI-powered Discovery and Attribution Engine to map
              enterprise asset ownership dynamically, alongside Dynamic Vulnerability Exploit scoring to estimate
              vulnerability exploitability.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
