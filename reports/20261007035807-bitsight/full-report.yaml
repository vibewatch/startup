  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Bitsight's evidenced market is narrower than cybersecurity software overall. Its core boundary is
              continuous, outside-in intelligence about an enterprise and its supply chain: discovering internet-facing
              assets, prioritizing vulnerabilities with threat context, monitoring third parties, and translating
              posture into risk reporting. The adjacent budgets are third-party risk management, external attack-surface
              management, cyber threat intelligence, and security-ratings programs. Internal endpoint protection, SIEM
              operation, cloud-workload protection, incident-response retainers, and general procurement software are
              outside this boundary unless they consume Bitsight data. Manual questionnaires, document reviews, desk
              assessments, and periodic audits remain the principal status-quo substitutes. Bitsight itself says those
              workflows are time-consuming and cannot keep pace with timely onboarding and continuous monitoring,
              establishing a credible automation wedge while also showing that services and internal labor compete with
              software budgets.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM010
              - CM013
