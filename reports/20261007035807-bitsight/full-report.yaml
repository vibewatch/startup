              - CR005
              - CR006
              - CR007
              - CR013
      - number: '7.4'
        title: Partner, commercial, and financial dependencies
        blocks:
          - type: paragraph
            body: >-
              Bitsight's workflow value depends partly on counterparties and customer systems. Moody's adds
              firmographic, financial, and entity context; Elastic requires access to Bitsight Threats API endpoints, a
              valid token, network egress, and eligible Elastic environments. Loss or degradation of either integration
              would not prove core-platform failure, but it could narrow decision context or reduce workflow utility for
              affected customers. Company-reported ARR above $200 million and positive free cash flow in the prior
              fiscal year reduce immediate financing concern, yet neither metric establishes current liquidity, debt
              capacity, gross margin, or runway. The enterprise and expansion mix increases the importance of renewal
              cohorts, top-customer concentration, implementation costs, and module attach rates. Kill criteria are a
              material partner withdrawal without replacement, sustained expansion contraction, or audited economics
              inconsistent with the public scale narrative.
            claimRefs:
              - CR001
              - CR004
              - CR008
              - CR009
              - CR010
