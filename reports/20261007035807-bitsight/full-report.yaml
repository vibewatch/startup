      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption is driven by an expanding external attack surface, third-party dependencies, and the operating
              burden of repeating point-in-time assessments. A company-issued paid release, citing Verizon Business,
              says third parties account for almost half of enterprise breaches and that the figure rose by more than
              60% year over year; because the underlying report is absent from the assigned evidence, this is a demand
              indicator, not an independently verified market statistic. Constraints are equally important. Buyers must
              reconcile different budget owners, replace entrenched manual processes, validate outside-in attribution,
              and justify multi-module subscriptions. The source pool supplies no realized pricing, renewal, retention,
              procurement-cycle, or independently measured category-growth data. For valuation, the strongest evidence
              is company scale and expansion behavior, while the size and growth rate of the addressable category remain
              material diligence gaps.
