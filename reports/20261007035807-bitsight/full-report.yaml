            body: >-
              Bitsight has systematically diversified beyond its legacy 250–900 security ratings core into exposure
              management and threat intelligence, punctuated by its late-2024 acquisition of Cybersixgill. By bundling
              external attack surface mapping and dark web intelligence, Bitsight expanded average contract sizes to
              six-figure commitments and achieved positive free cash flow at $200M ARR.
            calloutType: insight
