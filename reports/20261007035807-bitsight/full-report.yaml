      - Thesis Argument
      - Anti-Thesis Counter
      - Thesis-Break Indicator
    rows:
      - - Market Positioning
        - Category creator and industry standard with 3,500+ enterprise clients and deep Moody's alliance
        - Ratings face commoditization from unified exposure management platforms and bundled scanners
        - Loss of key cyber insurance underwriting partners or Moody's distribution disengagement
      - - Revenue Scale
        - Surpassed $200M ARR with positive free cash flow and strong enterprise contract expansion
        - Lack of audited revenue breakdown, gross margin disclosure, and net revenue retention transparency
        - Deceleration in enterprise ARR growth below 15% YoY or gross margin compression below 65%
      - - Capital & Preference
        - Clean 1.0x non-participating liquidation preference on Series E preferred stock held by Moody's
        - Senior preference overhang of over $400M raised precedes common shares in any down-round or fire sale
        - Sub-1.5x return hurdle on secondary equity entries or senior debt restructuring
      - - Secondary Liquidity
        - Opportunity to acquire pre-IPO stakes at substantial discount to the 2021 $2.4B peak valuation
        - Severe secondary market illiquidity with no established price discovery and strict company ROFR restrictions
        - Sponsor refusal to approve transfer or inability to clear broker-dealer KYC and subscription
