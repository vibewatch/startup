              - CU002
              - CU003
              - CU008
      - number: '6.2'
        title: Adoption Trajectory and Platform Scale
        blocks:
          - type: paragraph
            body: >
              Bitsight's platform adoption trajectory demonstrates significant commercial scale, expanding from an
              estimated 1,200 organizations tracked in 2018 to over 3,300 paying customers and 65,000 active
              organizations by early 2025, and exceeding 3,500 paying customers with more than 75,000 active
              organizations on the platform by mid-2026. The company crossed $200 million in annual recurring revenue
              (ARR) in April 2025, representing a fourfold expansion over five years from approximately $50 million in
              2020. Commercial scale is increasingly characterized by multi-product adoption: official company reporting
              indicates that 70% of new customer contracts in 2024 included exposure management modules, while 40% of
              early adopters of its newly acquired Cyber Threat Intelligence (CTI) capability were existing customers
              cross-selling from core security ratings. Moreover, enterprise contracts valued at over six figures
              ($100,000+ ARR) contribute nearly half of total recurring revenue, illustrating that platform revenue
              density is heavily concentrated in sophisticated enterprise accounts requiring continuous external attack
              surface and digital supply chain visibility.
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
