            body: >-
              The source pool does not contain an independent market study that isolates security ratings, third-party
              cyber-risk software, EASM, and CTI on a consistent geography, period, and revenue basis. A dollar TAM
              would therefore be false precision. Available scale lenses instead range from Bitsight's claimed
              observation surface of more than four billion IPs and forty million monitored organizations to a network
              of more than sixty-eight thousand vendors, sixty-five thousand organizations active on the platform in
              2025, and more than 3,500 customers in 2026. These populations are not nested and cannot be converted into
              penetration rates. Separately, 6sense identifies 1,037 current customer organizations and estimates 9.66%
              share in its broader security-analytics taxonomy. Bitsight's April 2025 announcement of more than $200
              million ARR establishes vendor scale, not market size. GetLatka and CompWorth publish incompatible revenue
              estimates, reinforcing the need for primary financial evidence before using revenue as a sizing proxy.
            claimRefs:
