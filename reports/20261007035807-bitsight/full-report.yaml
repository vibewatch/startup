      - - Customer expansion motion
        - Existing customers
        - Company says expansion generated half of new revenue in the reported period.
        - Aggregate contribution disclosed; NRR and cohort dispersion are not.
        - Weaker adoption or budget compression reduces new revenue and module attach.
        - High
        - Review GRR, NRR, module cohorts, discounting, services burden, and renewal forecasts.
    notes: >-
      Company-issued ARR, cash-flow, contract-mix, and expansion figures are unaudited in the allocated evidence;
