              - CU012
      - number: '6.3'
        title: Customer Durability, Retention Dynamics, and Procurement Friction
        blocks:
          - type: paragraph
            body: >
              Customer durability and expansion represent critical growth drivers for Bitsight, with company disclosures
              confirming that half of all new ARR growth is generated from existing customer expansions rather than new
              logo acquisition alone. Post-sale customer success operations enforce structured account management, where
              dedicated Customer Success Managers (CSMs) oversee tiered customer portfolios spanning 50 mid-tier
              accounts to scaled pools of over 200 commercial accounts, focusing on operational maturity, executive
              business reviews, and churn mitigation. Despite high enterprise durability, Bitsight exhibits meaningful
              procurement friction and market concentration risks. Unlike competitors such as UpGuard that publish
              entry-level transparent pricing starting around $21,000 annually, Bitsight maintains an opaque,
              quote-based pricing structure with multi-year commitments that often exceeds competitor quotes for
              comparable vendor counts. Furthermore, customer migrations are severely constrained by switching friction:
              because security ratings methodologies operate on incompatible scales (Bitsight's 250–900 scale versus
              SecurityScorecard's 0–100 letter grade and UpGuard's 0–950 band system), enterprises embedding Bitsight
              thresholds into vendor procurement SLAs or insurance covenants face significant legal, contractual, and
              technical hurdles if attempting to churn or swap platforms.
            claimRefs:
              - CU002
              - CU007
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU008
              - CU011
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Methodology Lock-in and Vendor SLA Incompatibility
            body: >
              A core dynamic in Bitsight's customer retention is high contractual and operational switching friction.
              Because Bitsight evaluates security posture on a credit-score scale of 250 to 900, while direct
              competitors use disparate grading scales (SecurityScorecard's 0–100 letter grade and UpGuard's 0–950
              bands), enterprise procurement contracts that mandate specific rating thresholds create immense friction
              when attempting to replace or migrate platforms. Replacing Bitsight requires rewriting vendor contract
              clauses, re-educating business stakeholders, and re-baselining historical risk data, giving Bitsight
              substantial defensive pricing power despite its premium quote-only model.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Residual risk priorities and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is evidence quality: Bitsight's value proposition depends on mapping
              external assets, vulnerabilities, vendors, and threat signals into defensible priorities, while an
              independent review cautions that outside-in ratings cannot confirm every internal control or compensating
              safeguard. API availability is the next operational dependency because Elastic's implementation explicitly
              handles authentication failures, rate limits, and server errors. Commercially, company-issued disclosures
              show that six-figure enterprise contracts represent nearly half of ARR and that expansion generated half
              of new revenue; these are positive scale signals but also make renewal quality and enterprise
              concentration essential diligence items. Thesis-break triggers are sustained API failures, material
              attribution errors, undisclosed legal or regulatory action, or verified deterioration in enterprise
              renewal and expansion performance. The heatmap is an evidence-based prioritization, not a record of
              realized incidents.
            claimRefs:
              - CR002
              - CR007
              - CR011
              - CR012
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR007
              - CR011
              - CR013
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and data-governance exposure
        blocks:
          - type: paragraph
            body: >-
              The allocated sources do not establish Bitsight's current litigation, enforcement, certification,
              privacy-audit, or licensing status, so absence of such records in this source set is not evidence that no
              issue exists. The observable concern is decision governance: Moody's describes combining Bitsight cyber
              intelligence with financial and entity context for underwriting and investment decisions, while an
              independent review says external ratings should complement rather than replace questionnaires and
              technical validation. Elastic also warns that diagnostic traces for its Bitsight integration may contain
              sensitive payloads. Diligence should therefore test data-processing terms, retention, model governance,
              customer challenge procedures, and regulator-facing controls. A thesis break would be a material
              enforcement action, an inability to substantiate rating inputs, or deficient controls over customer
              secrets and diagnostic data.
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR007
              - CR016
          - type: table
