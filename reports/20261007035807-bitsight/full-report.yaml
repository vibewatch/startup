      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map follows the workflow rather than a single security persona. Third-party risk and GRC leaders
              pay for vendor onboarding and continuous monitoring; security operations and vulnerability teams use
              external discovery and threat-informed prioritization; CTI teams consume adversary and identity
              intelligence; and executives use defensible posture reporting. The strongest observed segment signal is
              enterprise: 6sense reports 416 detected customers with more than 10,000 employees, versus 206 in the
              1,000-4,999 band and 110 in the 5,000-9,999 band. Bitsight's own commercial data also points to
              expansion-led adoption: half of new revenue came from existing-customer expansion, and 70% of new deals in
              2024 included exposure-management solutions. International demand exists but remained a minority of
              new-logo activity, with 30% of 2024 new customers headquartered outside North America.
            claimRefs:
