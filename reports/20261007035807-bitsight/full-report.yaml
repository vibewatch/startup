  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture & Customer Workflow Solutions
        blocks:
          - type: paragraph
            body: >-
              Bitsight operates as a cyber risk management platform designed to help enterprises, insurers, and
              government organizations quantify, monitor, and mitigate cybersecurity exposure across internal
              infrastructure and digital supply chains. The core platform ingests internet-wide telemetry, mapping
              external digital footprints without requiring endpoint agents or on-premise hardware deployments. For
              governance, risk, and compliance (GRC) teams, the workflow centers on third-party risk management and
              automated vendor due diligence, enabling automated monitoring and questionnaire workflows via the Trust
              Management Hub. Security operations teams utilize Bitsight's external attack surface management (EASM) and
              threat exposure capabilities to continuously discover unmanaged assets, detect shadow IT, and prioritize
              remediation actions against emerging vulnerabilities.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
