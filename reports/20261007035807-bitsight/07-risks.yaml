          values:
            - label: Medium
            - label: High
            - label: Partial
            - label: High
        - label: Enterprise renewal concentration
          note: Enterprise mix is disclosed, while named-customer concentration is not.
          values:
            - label: Unknown
            - label: High
            - label: Not evidenced
            - label: High
        - label: Regulatory and legal status
          note: The allocated sources do not establish current litigation or enforcement status.
          values:
            - label: Unknown
            - label: High
            - label: Not evidenced
            - label: High
        - label: Partner-context continuity
          note: Moody's enriches decision context; replacement and termination protections are undisclosed.
          values:
            - label: Low to medium
            - label: Medium
            - label: Partial
            - label: Medium
        - label: Agentic-workflow accuracy
          note: Early-access uptake is not evidence of production accuracy.
          values:
            - label: Medium
            - label: Medium to high
            - label: Early
            - label: Medium to high
    approximationNotes: >-
      Qualitative categories are analytical prioritization, not measured incident probabilities;
      unknown indicates missing public evidence rather than low risk.
    claimRefs: [CR002, CR007, CR011, CR013, CR016]
callouts:
  - calloutType: risk
    title: Public evidence does not establish a clean legal or incident record
    body: >-
      Require current counsel searches, regulator correspondence, certification scope, customer
      claims history, penetration-test summaries, and incident logs before treating these gaps as cleared.
    claimRefs: [CR016]
  - calloutType: recommendation
    title: Gate investment on operating and cohort evidence
    body: >-
      Require contractual uptime and data-quality performance, top-customer concentration, GRR and
      NRR cohorts, audited cash flow, and partner termination protections before underwriting durability.
    claimRefs: [CR002, CR010, CR011, CR012]
