evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-governance-enumeration
    missingEvidence: >-
      Complete historical and current roster of executive committee members, board of directors committee assignments,
      and advisory board participants.
    whyItMatters: >-
      Current disclosure covers announced C-level executives and key sales VPs but leaves board committee composition
      and independent director roles unverified.
    diligencePath: >-
      Request full corporate governance charter and current board of directors resolution list during legal due
      diligence.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capitalization-structure
    missingEvidence: >-
      Fully diluted cap table, liquidation preferences, share classes, and protective covenants between Moody's
      Corporation, Warburg Pincus, and executive founders.
    whyItMatters: >-
      Determines common shareholder recovery, dilution profile, and effective governance control in any potential IPO or
      strategic sale scenario.
    diligencePath: >-
      Request confidential disclosure of shareholder agreements, latest 409A valuation reports, and secondary
      transaction records under mutual NDA.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: headcount-audit
    missingEvidence: >-
      Audited payroll records detailing current total full-time headcount, R&D versus sales distribution, and
      international office concentration.
    whyItMatters: >-
      Reconciles conflicting directory estimates reporting between 501 and 750 employees following the Cybersixgill
      acquisition.
    diligencePath: Request verified organizational census and geographic payroll summary during formal management diligence.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: gaap-financial-statements
    missingEvidence: >-
      Audited GAAP financial statements including revenue growth rate, gross margins by product line, and full cash-flow
      statements for FY2024 and FY2025.
    whyItMatters: >-
      Self-reported ARR and positive free cash flow milestones lack audited GAAP revenue recognition, net retention rate
      (NRR), and operating margin breakdowns.
    diligencePath: Review audited annual financial statements and independent auditor's report from management.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent market study with annual revenue, geography, category boundaries, and methodology for security
      ratings, TPRM, EASM, and CTI.
    whyItMatters: >-
      Without a common denominator, the available customer, telemetry, ARR, and platform-activity metrics cannot support
      TAM, SAM, SOM, penetration, or CAGR.
    diligencePath: >-
      Obtain current analyst market datasets and public-company segment disclosures, then reconcile definitions and
      double counting before calculating market size.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: conflicting-data
    missingEvidence: Audited accounting revenue and a reconciliation from recognized revenue to annual recurring revenue for 2024-2026.
    whyItMatters: >-
      The assigned third-party estimates disagree, and revenue cannot be substituted for ARR when assessing company
      scale or market penetration.
    diligencePath: >-
      Request audited financial statements and the ARR bridge, including contract duration, churn, expansion, and
      non-recurring revenue.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Realized pricing, contract duration, renewal rates, procurement-cycle length, and budget ownership by module and
      customer segment.
    whyItMatters: >-
      These data determine whether the apparent enterprise demand converts into durable expansion and whether adoption
      constraints limit valuation upside.
    diligencePath: >-
      Review anonymized contracts, renewal cohorts, sales-cycle data, win-loss records, and interviews with TPRM,
      security operations, and CTI buyers.
  - type: private-evidence-only
    severity: material
    topic: win-loss-rates
    missingEvidence: Audited head-to-head win/loss ratios between Bitsight and SecurityScorecard across competitive enterprise RFPs.
    whyItMatters: >-
      Direct win rates would confirm whether Bitsight's ARR growth reflects category expansion or active market-share
      displacement.
    diligencePath: Interview enterprise procurement leads and review anonymized RFP decision data from software brokers.
  - id: GP001
    type: conflicting-data
    severity: minor
    topic: attribution-accuracy-rates
    missingEvidence: >-
      Standardized third-party benchmarks comparing false positive and IP misattribution rates across external rating
      vendors.
    whyItMatters: >-
      Accurate attribution is the primary operational determinant of how much labor customer security teams expend
      disputing scores.
    diligencePath: Commission or review independent lab testing of IP attribution across multi-tenant cloud hosting ranges.
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited financial statements detailing GAAP gross margins, cost of goods sold (COGS) for cloud scanning, and sales
      and marketing efficiency metrics.
    whyItMatters: >-
      Without audited gross margin data, underwriting long-term software profitability and gross profit trajectory
      across scanning infrastructure remains an estimate.
    diligencePath: Request audited 2024-2025 income statements and management discussion schedules during private data room review.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: customer-retention
    missingEvidence: >-
      Audited net revenue retention (NRR) and gross revenue retention (GRR) cohorts segmented by enterprise vs
      mid-market accounts.
    whyItMatters: >-
      NRR proves whether customer expansion exceeds churn in a competitive market experiencing price discounting
      pressure.
    diligencePath: Obtain historical dollar-based net retention cohort schedules from management presentations.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: retention-economics
    missingEvidence: >-
      Audited cohort net revenue retention (NRR), gross retention (GRR), and logo churn rates across enterprise and
      commercial tiers.
    whyItMatters: >-
      While Bitsight discloses that 50% of new revenue originates from customer expansion, exact cohort retention and
      churn rates are required to model long-term enterprise software unit economics.
    diligencePath: >-
      Request confidential SaaS retention metrics, net expansion bridges, and annual logo churn disclosures during
      late-stage sponsor diligence.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: legal-status-gap
    missingEvidence: Current litigation, enforcement, regulator correspondence, licensing, certification scope, and incident history.
    whyItMatters: Material legal or control failures could impair customer trust, regulated use cases, and valuation.
    diligencePath: >-
      Obtain counsel searches, regulator correspondence, audit reports, certification letters, and claims and incident
      registers.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: service-reliability
    missingEvidence: Contractual uptime, API latency, collection lag, attribution-error, false-positive, and remediation performance.
    whyItMatters: Public implementation guidance shows failure handling but does not quantify production reliability.
    diligencePath: Review 24 months of SLA reports, status history, severity-one incidents, backlog age, and customer credits.
    relatedQuestionRefs:
      - QR003
      - QR004
      - QR007
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: customer-economics
    missingEvidence: >-
      Top-customer concentration, GRR, NRR, cohort expansion, gross margin, cash balance, debt, and current free cash
      flow.
    whyItMatters: ARR, prior free cash flow, and aggregate expansion do not establish durability, liquidity, or unit economics.
    diligencePath: Obtain audited statements, bank and debt records, customer-level cohorts, renewal pipeline, and churn analysis.
    relatedQuestionRefs:
      - QR006
      - QR008
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: partner-dependency
    missingEvidence: Partner revenue exposure, data portability, termination rights, replacement costs, and integration-specific SLAs.
    whyItMatters: Partner or platform degradation could reduce context, workflow coverage, or customer utility.
    diligencePath: Review Moody's and major platform agreements, partner-sourced ARR, portability tests, and contingency plans.
    relatedQuestionRefs:
      - QR005
      - QR008
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Certified cap-table ledger showing options pool, warrants, senior liquidation preferences, and ROFR terms
      post-Series E.
    whyItMatters: >-
      Without exact waterfall preferences and potential liquidation carve-outs, secondary equity pricing cannot
      establish downside recovery per share.
    diligencePath: >-
      Request company disclosure package and stockholder agreement via sponsor or lead investor under non-disclosure
      agreement.
    relatedQuestionRefs:
      - QV004
    relatedTableRefs:
      - TV001
  - type: missing-source
    severity: material
    topic: financials
    missingEvidence: >-
      Audited GAAP financial statements for fiscal 2024 and 2025 detailing gross margin, net revenue retention, and
      operating expenses.
    whyItMatters: >-
      Valuation multiples and DCF models rely on unverified ARR assertions without audited GAAP revenue, churn, or
      margin bridges.
    diligencePath: Review audited annual reports or auditor engagement pack during institutional secondary diligence.
    relatedQuestionRefs:
      - QV003
    relatedTableRefs:
      - TV003
