chapter:
  number: 2
  title: "Market Analysis"
  summary: "Bitsight addresses an overlapping market for security ratings, third-party risk management, external attack-surface management, and cyber threat intelligence. The assigned evidence demonstrates enterprise demand and meaningful company scale, but it does not support a defensible dollar TAM, SAM, or SOM; customer, telemetry, and ARR indicators are therefore kept as separate sizing lenses."
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >-
      Bitsight's evidenced market is narrower than cybersecurity software overall. Its core
      boundary is continuous, outside-in intelligence about an enterprise and its supply
      chain: discovering internet-facing assets, prioritizing vulnerabilities with threat
      context, monitoring third parties, and translating posture into risk reporting. The
      adjacent budgets are third-party risk management, external attack-surface management,
      cyber threat intelligence, and security-ratings programs. Internal endpoint protection,
      SIEM operation, cloud-workload protection, incident-response retainers, and general
      procurement software are outside this boundary unless they consume Bitsight data.
      Manual questionnaires, document reviews, desk assessments, and periodic audits remain
      the principal status-quo substitutes. Bitsight itself says those workflows are
      time-consuming and cannot keep pace with timely onboarding and continuous monitoring,
      establishing a credible automation wedge while also showing that services and internal
      labor compete with software budgets.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM010"
    tableRefs:
      - "TM001"
  - id: "evidence-constrained-sizing"
    title: "Evidence-constrained sizing"
    body: >-
      The source pool does not contain an independent market study that isolates security
      ratings, third-party cyber-risk software, EASM, and CTI on a consistent geography,
      period, and revenue basis. A dollar TAM would therefore be false precision. Available
      scale lenses instead range from Bitsight's claimed observation surface of more than
      four billion IPs and forty million monitored organizations to a network of more than
      sixty-eight thousand vendors, sixty-five thousand organizations active on the platform
      in 2025, and more than 3,500 customers in 2026. These populations are not nested and
      cannot be converted into penetration rates. Separately, 6sense identifies 1,037 current
      customer organizations and estimates 9.66% share in its broader security-analytics
      taxonomy. Bitsight's April 2025 announcement of more than $200 million ARR establishes
      vendor scale, not market size. GetLatka and CompWorth publish incompatible revenue
      estimates, reinforcing the need for primary financial evidence before using revenue as
      a sizing proxy.
    claimRefs:
      - "CM002"
      - "CM003"
      - "CM004"
      - "CM005"
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM011"
      - "CM016"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyers-and-adoption"
    title: "Buyers, users, and adoption path"
    body: >-
      The buyer map follows the workflow rather than a single security persona. Third-party
      risk and GRC leaders pay for vendor onboarding and continuous monitoring; security
      operations and vulnerability teams use external discovery and threat-informed
      prioritization; CTI teams consume adversary and identity intelligence; and executives
      use defensible posture reporting. The strongest observed segment signal is enterprise:
      6sense reports 416 detected customers with more than 10,000 employees, versus 206 in
      the 1,000-4,999 band and 110 in the 5,000-9,999 band. Bitsight's own commercial data
      also points to expansion-led adoption: half of new revenue came from existing-customer
      expansion, and 70% of new deals in 2024 included exposure-management solutions.
      International demand exists but remained a minority of new-logo activity, with 30% of
      2024 new customers headquartered outside North America.
    claimRefs:
      - "CM005"
      - "CM009"
      - "CM012"
      - "CM013"
      - "CM014"
    tableRefs:
      - "TM003"
  - id: "drivers-constraints-and-valuation-relevance"
    title: "Drivers, constraints, and valuation relevance"
    body: >-
      Adoption is driven by an expanding external attack surface, third-party dependencies,
      and the operating burden of repeating point-in-time assessments. A company-issued paid
      release, citing Verizon Business, says third parties account for almost half of
      enterprise breaches and that the figure rose by more than 60% year over year; because
      the underlying report is absent from the assigned evidence, this is a demand indicator,
      not an independently verified market statistic. Constraints are equally important.
      Buyers must reconcile different budget owners, replace entrenched manual processes,
      validate outside-in attribution, and justify multi-module subscriptions. The source
      pool supplies no realized pricing, renewal, retention, procurement-cycle, or
      independently measured category-growth data. For valuation, the strongest evidence is
      company scale and expansion behavior, while the size and growth rate of the addressable
      category remain material diligence gaps.
    claimRefs:
      - "CM001"
      - "CM010"
      - "CM012"
      - "CM013"
      - "CM015"
      - "CM016"
