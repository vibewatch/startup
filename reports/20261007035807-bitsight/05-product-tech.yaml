chapter:
  number: 5
  title: "Product & Technology"
  summary: "Bitsight delivers an integrated cyber risk intelligence platform spanning external attack surface discovery, security ratings, vendor risk management, and threat intelligence. Built upon an internet-scale data pipeline that scans over 4 billion IP addresses and evaluates risk vectors across 68,000+ monitored vendors, the platform combines proprietary ratings algorithms with AI-driven discovery and third-party integrations, while relying on core cloud infrastructure and continuous data-ingestion pipelines."
sections:
  - id: "product-portfolio-and-workflow"
    title: "Product Architecture & Customer Workflow Solutions"
    body: "Bitsight operates as a cyber risk management platform designed to help enterprises, insurers, and government organizations quantify, monitor, and mitigate cybersecurity exposure across internal infrastructure and digital supply chains. The core platform ingests internet-wide telemetry, mapping external digital footprints without requiring endpoint agents or on-premise hardware deployments. For governance, risk, and compliance (GRC) teams, the workflow centers on third-party risk management and automated vendor due diligence, enabling automated monitoring and questionnaire workflows via the Trust Management Hub. Security operations teams utilize Bitsight's external attack surface management (EASM) and threat exposure capabilities to continuously discover unmanaged assets, detect shadow IT, and prioritize remediation actions against emerging vulnerabilities."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "telemetry-pipeline-and-infrastructure"
    title: "Data Pipeline, Architecture & Algorithmic Scoring"
    body: "At the technical foundation of Bitsight's ratings engine is an internet-scale big data collection pipeline deployed across the Amazon Web Services (AWS) ecosystem. The pipeline ingests security-related intelligence from multiple external feeds, scanning over 4 billion IP addresses to map enterprise assets, subsidiaries, cloud environments, and nth-party vendor connections. Data processing workloads leverage modern distributed architectures—incorporating Java services alongside technologies like Hadoop, Spark, and cloud data warehouses—to process terabytes of telemetry daily. Collected signals feed into Bitsight's proprietary rating algorithm, which computes objective security ratings on a standardized scale from 250 to 900. Additionally, the platform incorporates an AI-powered Discovery and Attribution Engine to map enterprise asset ownership dynamically, alongside Dynamic Vulnerability Exploit scoring to estimate vulnerability exploitability."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
    tableRefs:
      - "TE002"
  - id: "integrations-trust-and-technical-risks"
    title: "Ecosystem Integration, Differentiation & Platform Dependencies"
    body: "Bitsight delivers extensibility through a Developer API, data feeds, and pre-built integrations with major GRC and enterprise security management platforms, including RSA Archer, MetricStream, ProcessUnity, and OneTrust Vendorpedia. In addition to traditional API connections, Bitsight supports modern agent-ready integration patterns such as Model Context Protocol (MCP) to supply external attack surface intelligence into automated workflows. The company differentiates itself through longitudinal historical ratings data spanning back to its founding in 2011, wide market adoption among cyber insurers and enterprise procurement teams, and the integration of specialized threat intelligence following its acquisition of Cybersixgill. However, technical dependencies remain concentrated in public cloud hosting availability, continuous third-party telemetry access, and the proprietary calibration of its scoring algorithms, where misattribution or scan false-positives require customer dispute handling."
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE014"
    tableRefs:
      - "TE003"
