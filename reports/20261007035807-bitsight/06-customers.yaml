callouts:
  - calloutType: "risk"
    title: "Methodology Lock-in and Vendor SLA Incompatibility"
    body: >
      A core dynamic in Bitsight's customer retention is high contractual and operational switching friction. Because Bitsight evaluates security posture on a credit-score scale of 250 to 900, while direct competitors use disparate grading scales (SecurityScorecard's 0–100 letter grade and UpGuard's 0–950 bands), enterprise procurement contracts that mandate specific rating thresholds create immense friction when attempting to replace or migrate platforms. Replacing Bitsight requires rewriting vendor contract clauses, re-educating business stakeholders, and re-baselining historical risk data, giving Bitsight substantial defensive pricing power despite its premium quote-only model.
    claimRefs:
      - "CU011"
      - "CU012"
