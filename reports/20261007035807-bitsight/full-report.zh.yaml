  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代模式
        blocks:
          - type: paragraph
            body: >-
              Bitsight 所处的竞争格局横跨多个网络风险管理品类，从直接的外部安全评级供应商，到更广泛的第三方风险管理（TPRM）套件、内部漏洞扫描器和自动化合规平台 [CP001, CP004]。Bitsight
              将外部可观测遥测数据转化为持续的数值风险分数，开创了安全评级品类 [CP001]。SecurityScorecard 等直接竞品为供应商生态提供类似的外部视角风险评级 [CP002, CP003]。UpGuard
              等平台则把外部攻击面监测与原生问卷流程、数据泄露检测结合起来，面向寻求统一管理的中型市场和企业买方 [CP004, CP009]。Mastercard 支持的 RiskRecon 等专业玩家强调情境化资产估值和
              IT 扫描准确性 [CP002, CP009]。与此同时，Vanta、Drata 等自动化合规供应商，以及 VISO TRUST、Panorays 等内向型 TPRM
              平台，正通过直接控制验证、自动问卷导入和内部审计证据，越来越多地挑战纯外部评级。评估网络风险替代方案的组织，往往需要在纯外部观察评分、运营问卷修复和内向型保障模式之间权衡 [CP001, CP011]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP009
              - CP010
              - CP011
