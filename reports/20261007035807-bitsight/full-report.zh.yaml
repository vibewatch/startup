          'y': 84
        - label: RiskRecon
          x: 82
          'y': 58
        - label: VISO TRUST
          x: 48
          'y': 90
        - label: Black Kite
          x: 72
          'y': 62
    claimRefs:
      - CP002
      - CP004
      - CP005
      - CP009
      - CP011
  - id: FI001
    title: Bitsight 收入扩张与现金流桥接
    type: waterfall
    summary: 展示 Bitsight 已报告 ARR 规模、扩张速度和迈向正现金流的商业构成。
    approximationNotes: 比例指数根据已披露的里程碑比例归一化至基准规模（$200M+ ARR、约 50% 来自企业交易、扩张占比 50%）； 具体 GAAP 金额构成未公开。
    data:
      items:
        - label: 核心安全评级基础
          value: 100
          displayValue: $100M ARR
          tone: positive
        - label: 企业合同（> $100K）
          value: 100
          displayValue: ~$100M ARR
          tone: positive
        - label: ARR 总额突破
          value: 200
          displayValue: $200M+ ARR
          tone: positive
          isTotal: true
        - label: 客户扩张占比
          value: 50
          displayValue: 50% of New Rev
          tone: opportunity
        - label: 多产品 EASM 采用
          value: 70
