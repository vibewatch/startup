      - number: '2.4'
        title: 驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              采用动力来自不断扩大的外部攻击面、第三方依赖，以及反复进行时点式评估的运营负担。一则公司付费发布、引用 Verizon Business 的材料称，第三方造成近一半企业入侵，且该数字同比上升超过
              60%；由于底层报告不在指定证据中，这只能作为需求信号，不能视为独立验证的市场统计。约束同样重要：买方必须协调不同预算负责人、替换根深蒂固的手工流程、验证外部归因，并证明多模块订阅的合理性。资料没有提供实际定价、续约、留存、采购周期或独立测量的品类增长数据。就估值而言，最强证据是公司规模和扩张行为，而可服务品类的规模与增速仍是重大尽调缺口。
            claimRefs:
              - CM001
              - CM010
              - CM012
              - CM013
              - CM015
              - CM016
