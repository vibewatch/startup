      - number: '7.4'
        title: 合作伙伴、商业与财务依赖
        blocks:
          - type: paragraph
            body: >-
              Bitsight 的工作流价值部分依赖交易对手和客户系统。Moody's 增加公司画像、财务和实体背景；Elastic 需要访问 Bitsight Threats API 端点、有效令牌、网络出口和符合条件的
              Elastic 环境。任一集成丧失或退化，并不能证明核心平台失效，但可能缩窄决策背景或降低受影响客户的工作流效用。公司报告的 ARR 超过
              $200M，且上一财年自由现金流为正，降低了即时融资担忧，但这两个指标都不能证明当前流动性、债务容量、毛利率或现金跑道。企业和扩张组合提高了续约队列、头部客户集中度、实施成本和模块附加率的重要性。停止标准包括关键合作伙伴退出且无替代方、扩张持续收缩，或经审计的经济指标与公开规模叙事不一致。
