  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 剩余风险优先级与论点失效条件
        blocks:
          - type: paragraph
            body: >-
              最高的剩余暴露是证据质量：Bitsight 的价值主张依赖把外部资产、漏洞、供应商和威胁信号映射成经得起审查的优先级，而独立评论提醒，外部评级无法确认每一项内部控制或补偿性保障。下一个运营依赖是 API
              可用性，因为 Elastic 的实现明确处理认证失败、速率限制和服务器错误。商业上，公司披露六位数企业合同占 ARR
              近一半，扩张贡献一半新收入；这些是积极的规模信号，却也让续约质量和企业集中度成为必须尽调的事项。论点失效触发因素包括持续 API
              故障、重大归因错误、未披露的法律或监管行动，以及企业续约和扩张表现经核验后恶化。热力图是基于证据的优先级排序，不是已发生事故的记录。
