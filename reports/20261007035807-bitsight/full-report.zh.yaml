        title: 客户群体分层与买方生态
        blocks:
          - type: paragraph
            body: >
              Bitsight 的客户覆盖受监管金融机构、大型企业网络风险团队、政府国防和民用机构，以及网络保险承保人。根据第三方行业基准和官方披露，Bitsight 平台部署于 38% 的 Fortune
              500、全球前五大投资银行中的四家、超过 180 个政府机构和主要网络保险公司。在企业和金融客户中，经济买方通常是 CISO 或 CRO；第三方风险管理（TPRM）分析师、SOC
              人员和供应商管理办公室则是日常使用者。在网络保险和再保险领域，承保人及组合风险经理把 Bitsight 评级作为外部量化承保输入；研究显示，评级较高的实体遭遇入侵的可能性降低
              45%。但在高度受监管的北美和欧洲一级客户之外，中型组织及精简安全团队经常因 Bitsight 未披露、偏向企业且只报价的定价模式而面临较高采购门槛。
