      - CV003
      - CV004
      - CV008
      - CV009
      - CV010
      - CV011
figures:
  - id: FO001
    title: Bitsight 公司演进与战略里程碑
    type: timeline
    summary: 展示 Bitsight 从 2011 年成立至 2026 年的公司、融资、产品创新和并购里程碑。
    data:
      items:
        - date: '2011'
          label: 公司成立
          detail: Stephen Boyer 和 Nagarjuna Venna 在马萨诸塞州波士顿创立公司，旨在打造外部网络安全评级。
        - date: 2018-06
          label: D 轮与 $600M 估值
          detail: Warburg Pincus 领投 $60M D 轮，估值约为 A 轮的 10 倍（约 $600M），累计融资达到 $155M。
        - date: 2021-09
          label: Moody's $250M 合作与 $2.4B 估值
          detail: 获得 Moody's Corporation $250M 战略企业轮融资，以 $2.4B 估值巩固品类领导地位。
        - date: 2024-04
          label: Frost Radar 与 Forrester Wave 领导者
          detail: 在 EASM 的 Frost Radar 和《Forrester Wave：网络安全风险评级平台》中均被评为领导者。
        - date: 2024-12
          label: 收购 Cybersixgill
          detail: 完成对网络威胁情报提供商 Cybersixgill 的战略收购，以整合暗网情报。
        - date: 2025-04
          label: ARR 超过 $200M 且自由现金流为正
          detail: ARR 达到超过 $200M 的里程碑且自由现金流为正，六位数金额合同贡献了一半 ARR。
        - date: 2025-10
          label: Brand Intelligence 上线
          detail: 推出 Brand Intelligence 能力，用于识别外部品牌冒用和高管网络风险。
        - date: 2026-02
          label: AI 治理与 Shadow MCP 可见性
          detail: 将 AI 风险可见性引入攻击面中的 Shadow AI 和不安全的模型上下文协议（MCP）服务器。
    approximationNotes: 日期来自公开发布的新闻稿、融资交割和产品上线披露。
    claimRefs:
      - CO001
      - CO002
      - CO005
      - CO006
      - CO008
      - CO010
  - id: FM001
    title: 观察到的规模阶梯，而非 TAM/SAM/SOM
    type: pyramid
    summary: 六个定义不同的规模指标展示触达范围、平台活跃度和商业足迹，但不暗示存在共同分母。
    data:
      items:
        - label: 互联网观测面
          value: 4000000000
          unit: IPs
          detail: 公司称持续扫描超过 4B 个 IP；当前页面访问日期为 2026-10-07。
        - label: 受监测组织
          value: 40000000
          unit: organizations
          detail: 公司编写的 2026 年指南称全球有超过 40M 家组织。
        - label: 供应商网络
          value: 68000
          unit: vendors
          detail: 公司称拥有超过 68K 家第三方、第四方及第 N 方供应商组成的网络。
        - label: 平台活跃组织
          value: 65000
          unit: organizations
          detail: 公司新闻稿称 2025 年 4 月有 65,000 家组织活跃在平台上。
        - label: 公司报告的客户
          value: 3500
          unit: customer organizations
          detail: 公司当前网站称拥有 3,500+ 家全球组织客户。
        - label: 6sense 识别的客户
          value: 1037
          unit: customer organizations
          detail: 对 2026 年更广义安全分析品类的独立技术画像估计。
    approximationNotes: 仅为便于阅读，按观测触达范围从广到商业信号排序。各群体的定义和期间不同， 未证明彼此存在嵌套关系，不得据此推断转化率、渗透率、TAM、SAM 或 SOM。
    claimRefs:
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
      - CM007
  - id: FP001
    title: 竞争定位矩阵：遥测规模 vs 工作流广度
    type: quadrant
    summary: 可视化展示网络安全风险管理方案在外部遥测广度和端到端评估工作流整合维度上的定位。
    approximationNotes: 轴分数基于技术能力比较，在 0-100 量表上表示归一化序数评级。
    data:
      xAxis: 外部遥测与扫描规模
