      - number: '4.2'
        title: 市场进入、销售效率代理指标与单位经济
        blocks:
          - type: paragraph
            body: >-
              Bitsight 采用混合企业 GTM 模式，将直接企业外勤销售与战略渠道分销、平台合作结合 [CI001, CI003, CI005]。与 Moody's Corporation 的战略协同把 Bitsight
              评级直接嵌入金融、承保和风险工作流，成为强有力的机构客户获取渠道 [CI005, CI008, CI011]。商业表现显示扩张势头强劲：客户扩张贡献约 50% 新收入，2024 年新交易中 70%
              纳入暴露管理能力，多产品采用率明显上升 [CI001]。其威胁情报产品的早期采用者中，40% 是现有平台客户，说明交叉销售健康 [CI001]。国际扩张也在推进，新客户中 30% 总部位于北美以外
              [CI001]。但私人披露限制了对销售效率的严格评估 [CI012]。独立行业反馈显示，在日益拥挤的市场中，SecurityScorecard、Panorays 等激进竞品持续挤压企业赢单率和定价
              [CI002]。运营成本结构、CAC 回收期、毛利率和 NRR 仍是未公开的私人指标，需要管理层直接核验 [CI012]。
