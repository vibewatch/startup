        blocks:
          - type: paragraph
            body: >
              客户持久性和扩张是 Bitsight 的关键增长动力；公司披露，全部新增 ARR 增长的一半来自现有客户扩张，而非单纯获取新客户。售后客户成功运营采用结构化账户管理：专属 CSM 管理分层客户组合，从 50
              家中型账户到超过 200 家商业账户，重点关注运营成熟度、高管业务回顾和流失缓解。尽管企业客户持久性较高，Bitsight 仍有明显采购摩擦和市场集中风险。UpGuard 等竞品把入门透明价格公开到每年约
              $21,000 起，而 Bitsight 维持不透明的报价制多年合同，对相同供应商数量的报价往往高于竞品。此外，客户迁移受到严重切换摩擦限制：安全评级方法采用不兼容的尺度（Bitsight 为
              250–900，SecurityScorecard 为 0–100 字母等级，UpGuard 为 0–950 区间），把 Bitsight 阈值嵌入供应商采购 SLA
              或保险契约的企业若想流失或更换平台，会遇到重大的法律、合同和技术障碍。
