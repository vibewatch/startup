              - CP007
              - CP009
              - CP011
      - number: '3.2'
        title: 核心能力、遥测广度与技术取舍
        blocks:
          - type: paragraph
            body: >-
              Bitsight 的核心差异化依赖专有扫描基础设施、sinkhole 遥测，以及对超过 4B 个可路由 IPv4 和 IPv6 地址的每日监测 [CP005]。收购 Cybersixgill
              后，公司增加了深网和暗网威胁情报，推动外部攻击面管理（EASM）与网络威胁情报的多产品采用 [CP007, CP008]。但竞品在工作流集成、资产归因准确度和易用性上对其形成挑战 [CP004,
              CP009]。在云和共享托管环境中，买方称归因摩擦需要人工核验并处理供应商争议 [CP009]。此外，UpGuard 等竞品可在单一许可中提供攻击面管理与原生问卷，而 Bitsight
              传统上把评级监测与高级供应商风险评估模块分开 [CP004, CP009]。Black Kite 强调基于 Open FAIR 框架的财务风险量化；VISO TRUST 和 Panorays
              则把外部遥测与内向型文件、证据分析结合，以评估公开扫描无法观察的控制 [CP002, CP011]。
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
