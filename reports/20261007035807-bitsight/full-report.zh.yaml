      - number: '1.3'
        title: 资本化历史、财务规模与关键难题
        blocks:
          - type: paragraph
            body: >
              Bitsight 在公司发展过程中募集了大量成长资本，早期投资者包括 Flybridge Capital Partners、Globespan Capital Partners、Menlo
              Ventures、GGV Capital、Comcast Ventures、Liberty Global Ventures 和 Singtel Innov8，后期则转向机构及企业股权持有 [CO002,
              CO005]。2018 年 6 月，Bitsight 获 Warburg Pincus 领投的 $60M Series D，估计估值为 $600M，当时累计风险投资达到 $155M [CO005]。2021 年
              9 月，Moody's Corporation 领投关键的 $250M 企业投资轮，将 Bitsight 的基准估值定为 $2.4B [CO002, CO008]。

              商业方面，Bitsight 于 2025 年 4 月宣布 ARR 超过 $200M，同时实现正自由现金流；六位数企业合同贡献了近一半 ARR，2024 年新交易中 70% 含暴露管理模块
              [CO006]。平台服务超过 3,500 家客户，并覆盖超过 65,000 个活跃组织 [CO004, CO006]。但 Risk Ledger
              的独立市场评论和竞品分析指出了关键运营难题：企业用户经常遇到评级摩擦，包括漏洞修复后分数仍不变的延迟、专有评分算法不透明，以及将修复负担大量转嫁给被评估供应商的误报 [CO009]。
            claimRefs:
