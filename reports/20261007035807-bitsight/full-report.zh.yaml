  - id: FE001
    title: Bitsight 网络风险情报架构栈
    type: stack
    summary: 分层呈现 Bitsight 平台，从外部遥测摄取延伸至企业和代理式应用接口。
    data:
      layers:
        - label: 代理式与生态集成层
          detail: 开发者 API、MCP 连接器、GRC 集成（Archer、MetricStream）及自动化工作流 webhooks
        - label: 分析与评分引擎层
          detail: 专有安全评级算法（250-900）、动态漏洞利用（DVE）评分和风险分析
        - label: AI 发现与归因层
          detail: 机器学习归因引擎、子公司映射和影子 IT 发现模型
        - label: 大数据处理与存储层
          detail: AWS 分布式计算基础设施，使用 Java、Hadoop、Spark、Iceberg 湖仓表和 OpenSearch
        - label: 互联网规模遥测采集层
          detail: 分布式网络扫描覆盖 4B+ 个 IP 地址、68K+ 个供应商遥测源和每天 7M+ 条地下网络项目
        - label: 外部情报与合作伙伴数据馈送层
          detail: 深网与暗网网络威胁情报（Cybersixgill）、CERT 馈送，以及全球 DNS/BGP 路由馈送
    approximationNotes: 基于公开工程规格和平台解决方案文档梳理出的逻辑架构分层。
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
  - id: FU001
    title: Bitsight 企业客户旅程与扩张循环
    type: journey-map
    summary: 展示客户导入、运营采用、集成成熟度和多产品扩张。
    data:
      items:
        - label: 采购与范围界定
          detail: 初步界定供应商风险管理范围、对关键供应商分级，并定制企业报价。
          tone: neutral
        - label: 导入与资产归因
          detail: 由 CSM 主导导入、完成资产归因、排除访客网络，并生成基线记分卡。
          tone: positive
        - label: 运营落地与集成
          detail: 将风险评级嵌入 GRC 工作流（ServiceNow、API 馈送），并设定供应商 SLA 阈值。
          tone: positive
        - label: 高管与董事会报告
          detail: 为高管层和保险续保生成有据可依的安全绩效指标。
          tone: positive
        - label: 多产品扩张
          detail: 在扩展后的攻击面上交叉销售 Threat Intelligence、Exposure Management 和 Brand Intelligence。
          tone: opportunity
        - label: 合同续签与 SLA 锁定
          detail: 不同供应商评分尺度带来的高切换成本，进一步巩固多年合同续签。
          tone: risk
    approximationNotes: 根据 Bitsight 客户成功生命周期规格、岗位工作流和客户扩张里程碑推导。
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU009
      - CU010
      - CU012
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 根据有证据支持的影响、可观察的可能性和缓解成熟度，对六项优先风险暴露排序。
    data:
      columns:
        - key: likelihood
          label: 可能性
          detail: 仅根据可观察的依赖关系推断定性可能性。
        - key: impact
          label: 影响
          detail: 对决策效用、客户留存或投资价值的潜在影响。
        - key: mitigation
          label: 缓解成熟度
          detail: 已分配公开证据所能显示的成熟度。
        - key: residual
          label: 剩余严重性
          detail: 在已观察到的缓解措施之后仍存留的优先风险等级。
      rows:
        - label: 外部数据完整性与归因
          note: 由外而内的证据无法确认每一项内部控制。
          values:
            - label: 中
            - label: 高
            - label: 部分
            - label: 高
        - label: API 可用性与延迟
          note: Elastic 文档说明了退避机制和队列保留，但没有 Bitsight SLA 可供查阅。
          values:
            - label: 中
            - label: 高
            - label: 部分
            - label: 高
        - label: 企业续签集中度
          note: 企业客户构成已有披露，但具体客户集中度尚未披露。
          values:
            - label: Unknown
            - label: 高
            - label: 无证据支持
            - label: 高
        - label: 监管与法律状态
          note: 已分配的来源无法确认当前诉讼或执法状态。
          values:
            - label: Unknown
            - label: 高
            - label: 无证据支持
            - label: 高
        - label: 合作伙伴背景连续性
          note: Moody's 丰富了决策背景，但替换和终止保护措施尚未披露。
          values:
            - label: 低至中
            - label: 中
            - label: 部分
            - label: 中
        - label: 智能体工作流准确性
          note: 早期访问用户的采用情况不能证明生产环境中的准确性。
          values:
            - label: 中
            - label: 中至高
            - label: 早期
            - label: 中至高
    approximationNotes: 定性类别用于分析排序，并非经过测量的事件概率；unknown 表示缺少公开证据，而非风险较低。
    claimRefs:
      - CR002
      - CR007
      - CR011
      - CR013
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 该决策流程从品类规模和风险评估出发，沿着 Bitsight 证据推导审慎的估值立场，并给出继续研究的建议。
    data:
      nodes:
        - label: 规模与市场护城河
          detail: ARR 超过 $200M，拥有 3,500+ 家企业客户，以及定义品类的评级平台
          tone: positive
        - label: 运营盈利能力
          detail: 公司自报自由现金流为正，企业扩张势头达到六位数规模
          tone: positive
        - label: 资本与估值锚点
          detail: 最近一轮定价为 $2.39B 的 E 轮（2021 年），Moody's 是战略锚定投资者
          tone: neutral
        - label: 信息不对称
          detail: 缺少经审计的 2024-2025 年财务报表、NRR 指标和详细股权结构表
          tone: warning
        - label: 流动性与结构
          detail: 私人持股缺乏流动性，存在转让限制、ROFR 和 $400M+ 的高级优先股堆叠
          tone: negative
        - label: 最终立场：继续研究
          detail: 在经审计财务数据和二级市场定价透明度出现之前，维持观望立场
          tone: neutral
    approximationNotes: 这是按顺序展开的逻辑决策框架，反映证据权重和门槛标准，而非量化加权。
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV008
      - CV013
      - CV014
