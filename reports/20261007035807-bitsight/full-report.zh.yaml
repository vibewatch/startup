        title: 资本充足性、现金流轨迹与尽调结论
        blocks:
          - type: paragraph
            body: >-
              Bitsight 资本雄厚，运营现金管理也很严格 [CI008, CI009, CI010]。自 2011 年成立以来，公司八轮股权融资累计 $398M，其中包括 Moody's 于 2021 年 9
              月领投、投后估值 $2.4B 的标志性 $250M Series E，以及 Warburg Pincus、Menlo Ventures 和 Singtel Innov8 的早期成长资本 [CI003,
              CI008, CI009, CI010]。截至 2025 年 4 月，公开披露的规模已超过 $200M ARR，并实现正自由现金流 [CI001]。独立评论也证实，Bitsight
              在扩大平台的同时保持正现金流，并通过选择性组织重组管理运营成本，包括 2023 年和 2025 年裁员 [CI002,
              CI010]。实现现金流为正显著降低近期融资依赖，并在私募市场无需稀释性下轮融资的情况下提供更灵活的现金跑道 [CI001,
              CI002]。不过从投资判断角度看，私人公司身份掩盖了经审计的资产负债表流动性、毛利率、债务契约和资本分配瀑布，因此结论很清楚：运营规模已被证明，但机构投资仍需全面财务审计披露 [CI001, CI008,
