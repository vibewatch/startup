      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方版图取决于工作流，而非单一安全角色。第三方风险和 GRC 负责人为供应商接入及持续监测付费；安全运营和漏洞团队使用外部发现及受威胁情报驱动的优先级排序；CTI
              团队消费对手和身份情报；高管则使用可经得起审查的安全状况报告。最强的细分市场信号来自企业端：6sense 报告检测到 416 家员工超过 10,000 人的客户，另有 206 家处于 1,000–4,999
              人区间、110 家处于 5,000–9,999 人区间。Bitsight 自身商业数据也指向扩张驱动的采用：新收入的一半来自现有客户扩张，2024 年新交易中 70%
              含暴露管理方案。国际需求确实存在，但新客户活动中仍占少数；2024 年新客户中总部位于北美以外的占 30%。
            claimRefs:
              - CM005
