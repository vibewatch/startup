  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、变现渠道与定价架构
        blocks:
          - type: paragraph
            body: >-
              Bitsight 的绝大多数收入来自经常性 SaaS 年度及多年订阅合同 [CI001,
              CI005]。变现过去以核心外部网络安全评级平台为基础，如今扩展到三大收入流：第三方风险管理（TPRM）和供应商监测订阅、企业安全状况管理（SPM）/外部攻击面管理（EASM），以及由 2024 年末收购
              Cybersixgill 带来的网络威胁情报（CTI）[CI001, CI004, CI007]。合同按模块和配额定价，不提供公开自助购买，主要随受监测第三方实体数、内部 IP
              和域名资产数、用户席位及启用的情报模块变化 [CI003, CI005]。随着企业在 2026 年面对更大的攻击面和更高的监管报告要求，网络安全预算转向持续测量和减少与攻击者相关的暴露，推动供应商整合到多产品平台
              [CI006]。目录价虽未披露，现实客户支出仍会随监测范围和组织规模大幅变化，从五位数中段的入门订阅到六位数企业合同不等 [CI001, CI003]。关键是，超过六位数的企业合同贡献 Bitsight 总
              ARR 的近一半，凸显其对大型企业和机构客户的集中度 [CI001]。
