      - number: '1.4'
        title: 展示项
        blocks:
          - type: callout
            title: 从评级服务转向企业情报平台
            body: >-
              Bitsight 已系统性地从传统的 250–900 安全评级核心扩展到暴露管理和威胁情报，2024 年末收购 Cybersixgill
              是这一转型的重要节点。通过把外部攻击面绘制与暗网情报打包，公司将平均合同规模扩大到六位数，并在 $200M ARR 时实现正自由现金流。
            calloutType: insight
            claimRefs:
              - CO002
              - CO004
              - CO006
          - type: callout
            title: 算法透明度与分数延迟摩擦
            body: 独立评论和竞品评估指出，Bitsight 的评级模型长期存在企业端摩擦。被评估组织称，技术漏洞修复后分数仍会滞后，评分计算缺乏透明度，且误报归因使举证负担落在被评分供应商而非平台身上。
            calloutType: risk
            claimRefs:
              - CO003
              - CO009
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              现有证据显示，Bitsight
              的市场窄于整体网络安全软件。其核心边界是关于企业及其供应链的持续外部视角情报：发现面向互联网的资产、结合威胁背景排定漏洞优先级、监测第三方，并把安全状况转化为风险报告。相邻预算包括第三方风险管理、外部攻击面管理、网络威胁情报和安全评级项目。内部终端防护、SIEM
              运营、云工作负载保护、事件响应服务及通用采购软件都不在边界内，除非它们使用 Bitsight 数据。手工问卷、文件审查、案头评估和定期审计仍是主要现状替代方案。Bitsight
              自身称这些流程耗时，无法跟上及时接入和持续监测；这既构成可信的自动化切入口，也说明服务和内部人力会与软件预算竞争。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM010
              - CM013
      - number: '2.2'
        title: 受证据约束的市场规模估算
        blocks:
          - type: paragraph
            body: >-
              现有资料没有一项独立市场研究，能在一致的地域、期间和收入口径下拆分安全评级、第三方网络风险软件、EASM 与 CTI。因此，直接给出美元 TAM 会制造虚假的精确度。可用的规模视角包括 Bitsight
              声称覆盖超过四十亿个 IP 和四千万个受监测组织、超过六万八千家供应商的网络、2025 年平台上的六万五千个活跃组织，以及 2026 年超过 3,500 家客户。这些人群并非嵌套关系，不能换算渗透率。另据
              6sense，当前客户组织为 1,037 家，在更宽泛的安全分析分类中估计占比 9.66%。Bitsight 2025 年 4 月宣布 ARR 超过 $200M，说明的是供应商规模而非市场规模。GetLatka
              和 CompWorth 发布的收入估算彼此不一致，进一步说明在用收入作为规模代理前，需要一手财务证据。
