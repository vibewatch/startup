      - number: '3.3'
        title: 定价结构、打包摩擦与切换动态
        blocks:
          - type: paragraph
            body: >-
              定价和产品打包是客户评估与续约中的重要摩擦点 [CP006, CP009, CP012]。Bitsight
              采用模块化、报价制定价，主要取决于受监测公司数量、所选产品层级（Essentials、Advanced、Premier）及附加模块 [CP006]。虽然目录价未披露，但真实买方支出差异很大：SMB 年合同平均约
              $18,781，企业年合同平均 $159,083 [CP012]。交易数据显示，激进买方通常会利用多年承诺、竞争压力和财年末时点，在初始报价基础上谈下 15%–30% 的折扣
              [CP006]。大型企业的切换成本中等偏高，因为历史评级追踪、定制董事会报告模板、GRC 集成和供应商监测清单已嵌入采购工作流 [CP001,
              CP006]。但中型组织的障碍较低，若替代供应商提供透明定价、更快接入或一体化评估能力，它们经常切换或同时使用多家平台 [CP004, CP009]。
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP009
              - CP012
