      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 模块化许可与归因摩擦会推动流失
            body: Bitsight 将供应商风险管理评估和威胁情报分开授权，带来了定价复杂度。再叠加共享 IP 基础设施中偶发的资产归因难题，这一组合让统一平台有机会替代 Bitsight。
            calloutType: risk
            claimRefs:
              - CP006
              - CP009
          - type: callout
            title: 买方需求从评级走向全面保障
            body: 外部视角评级仍是高管仪表盘和董事会报告的标准配置，但采购和安全团队越来越需要内向型证据验证与工作流自动化，为新兴竞品打开了空间。
