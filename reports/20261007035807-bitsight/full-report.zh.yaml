chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司定位、产品范围与商业模式
        blocks:
          - type: paragraph
            body: >
              Bitsight 于 2011 年在马萨诸塞州波士顿由 Stephen Boyer 和 Nagarjuna Venna 创立 [CO001]。公司创建了一套客观的外部测量体系，以 250–900
              的量化分数评估组织的网络风险状况，并刻意参照金融信用评级，由此开创了安全评级市场 [CO003]。商业模式是面向企业客户、网络保险承保人、投资银行和政府机构的分层定价 SaaS 订阅平台 [CO002]。

              过去十年，Bitsight 从纯安全评级供应商转型为综合网络风险情报平台 [CO002, CO004]。其技术架构持续监测外部数字基础设施的攻击面暴露，绘制数字供应链，扫描超过 4B 个 IP 地址，并监测超过
              68,000 家供应商的第三方、第四方及更深层级风险
              [CO004]。商业产品组合分为四大支柱：暴露管理（外部攻击面管理与供应链发现）、第三方风险管理（持续供应商监测与信任管理）、治理与报告（高管报告与监管框架映射）以及网络威胁情报（漏洞、勒索软件和身份威胁数据）[CO002]。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO006
              - CO008
      - number: '1.2'
        title: 高管领导、治理与董事会监督
        blocks:
          - type: paragraph
            body: >
              Bitsight 由 CEO Steve Harvey 负责高管领导，推动全球扩张、多产品采用和盈利路线图 [CO006]。创始团队仍承担关键技术和战略职责：联合创始人 Stephen Boyer 任
              CTO，最初设计了公司的专利数据采集和风险评估架构；联合创始人 Nagarjuna Venna 曾任 CPO [CO001, CO003]。前 CEO Tom Turner 曾带领公司度过成长阶段，包括完成
              Series D 融资 [CO005]。

              为加速企业和商业市场拓展，Bitsight 任命 John Wallace 为 CRO，同时任命 Mike Mooney 为北美销售高级副总裁、Scott Simpson 为解决方案工程高级副总裁；两人都从
              Veracode 带来了深厚的企业安全经验 [CO007]。连续股权融资后，机构股东进入董事会，治理得到加强，其中包括 Warburg Pincus 董事总经理 Cary Davis；Moody's 于 2021
              年 9 月领投 $250M 后，公司也与 Moody's Corporation 形成战略治理和商业协同 [CO005, CO008]。
            claimRefs:
              - CO001
