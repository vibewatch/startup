      - number: '8.2'
        title: 融资历史、资本结构与流动性动态
        blocks:
          - type: paragraph
            body: >-
              Bitsight 在多轮融资中组建了由成长股权和战略伙伴组成的机构投资者联盟，累计股权资本约 $400M。公司于 2018 年 6 月获 Warburg Pincus 领投的 $60M Series
              D，使当时累计融资达到 $155M，隐含估值约 $600M。2021 年 9 月，Moody's Corporation 以每股 $80.80 的价格投资标志性 $250M Series E，投后估值达到
              $2.39B。公司注册证书文件确认 Series E 优先股带有标准 1.0x、非累积、非参与型清算优先权，但超过 $400M 的累计优先股堆叠给普通股股东造成了显著结构性悬压。在私募二级市场，Bitsight
              股票交易活动有限、流动性很差。机构交易平台明确会对私营公司相对于公开市场倍数打折，以调整流动性不足和信息不对称。此外，双边二级转让仍受公司批准和优先购买权约束，限制了潜在少数股东的退出灵活性。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
              - CV013
              - CV014
      - number: '8.3'
        title: 情景建模、估值倍数与同业基准
        blocks:
          - type: paragraph
            body: >-
              评估 Bitsight 内在价值，需要参考当前网络安全软件基准和私营同业动态，进行按情景加权的建模。Bitsight 超过 $200M 的报告 ARR、较大的六位数企业合同，以及通过 Cybersixgill
              把平台扩展到网络威胁情报，为基准预测提供支撑。在基准情景下，Bitsight 在正运营现金流和多产品客户扩张支持下，保持 10%–15% 的收入增长轨迹，ARR 达到 $220M–$250M。按
              9.0x–11.0x 的保守 EV/ARR 倍数（与 SecurityScorecard、UpGuard 和 Tenable 等成熟 B2B 网络风险同业一致），隐含企业价值为
              $2.0B–$2.8B。若在乐观情景中净留存加速超过 120%，暴露管理采用推动 IPO 窗口，并按 12.0x–14.0x ARR 定价，企业价值将扩大至 $3.6B–$4.9B。相反，悲观情景假设 ARR
              停滞在 $180M–$200M 附近，倍数压缩至 5.0x–7.0x ARR，隐含估值 $0.9B–$1.4B，并触发下轮融资风险及高级优先权回收摩擦。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.4'
        title: 退出准备度、论点失效触发因素与尽调要求
        blocks:
          - type: paragraph
            body: >-
              Bitsight 的流动性路径集中在两种主要变现方式：市场环境重新向盈利企业软件发行人开放后进行 IPO，或出售给 Moody's Corporation
              等信息服务集团或某家超大规模云平台。不过，近期流动性仍受二级转让障碍、优先购买权限制以及市场对 2021 年未上市科技估值的普遍怀疑所约束。会迫使建议立即下调为避免投资的核心论点失效触发因素包括 ARR
              增长实质放缓至 10% 以下、顶级网络保险承保伙伴流失，或股权持有人之上的激进债务资本化。相反，升级为买入需要两个具体催化剂：取得经审计的 2024–2025 年财务披露，确认毛利率超过 70% 且净留存超过
              115%；或二级定价交易以低于 8.0x ARR 的有吸引力入场估值成交。              机构投资者在参与任何私募交易前，必须优先明确询问股权结构表中的优先股堆叠、客户集中度和经核验的 ARR 构成。
            claimRefs:
              - CV003
              - CV006
              - CV008
              - CV013
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 资本配置立场：继续研究，而非投机性买入
            body: Bitsight 已无可争议地证明其品类领导地位和 $200M ARR 规模，但公开二级市场缺乏流动性、利润率和留存数据未经审计，加上庞大的优先股堆叠，机构投资者仍应在投入资本前要求审计透明度。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
              - CV014
