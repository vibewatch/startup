tables:
  - id: TE001
    title: Product Module / Asset Matrix
    columns:
      - Module / asset
      - Primary user
      - Public status / maturity
      - Differentiation signal
      - Diligence gap
    rows:
      - - Droids core agent
        - Individual engineers and engineering teams
        - General availability; present across self-serve and enterprise packaging
        - One-prompt-to-PR workflow across terminal, IDE, browser, Slack, and desktop surfaces
        - Need independent production-quality data by workflow and user segment
      - - Missions
        - Senior engineers, platform teams, autonomous project owners
        - Publicly launched for Enterprise and Max users; architecture materially described
        - Orchestrator-worker-validator pattern for multi-hour or multi-day work
        - Need customer proof on convergence rate, failure handling, and implementation ROI
      - - Router
        - Cost-conscious admins and users running mixed workload complexity
        - Private research preview in CLI and Desktop as of June 2026
        - Automatic per-session model/provider routing with claimed cost and reliability gains
        - Need third-party validation of routing quality and uptime claims
      - - Desktop
        - Developers needing local computer-use automation
        - Publicly launched in 2026
        - Full system access across VS Code, browser, terminal, docs, and other desktop apps
        - Need proof on security boundaries, OS support depth, and enterprise rollout friction
      - - AutoWiki
        - Platform teams, onboarding owners, repo maintainers
        - Publicly launched; CI installer and GitHub wiki sync documented
        - Continuously refreshed repo documentation with local/cloud/GitHub surfaces
        - Need independent evidence of scale on very large monorepos
      - - Analytics + Agent Readiness
        - Engineering leadership and platform administrators
        - Enterprise-facing product surface live since early 2026
        - Ties autonomy, tokens, tool use, productivity, and readiness into admin reporting
        - Need API schema, retention model, and customer benchmark examples
      - - Automated QA
        - QA owners, reviewers, and application teams
        - Publicly launched on all plans
        - User-flow testing with screenshots, terminal snapshots, and API traces posted to PRs
        - Need flake-rate, browser support, and runtime cost data
      - - Automated Security Review / Code Review
        - Security teams, reviewers, and repo maintainers
        - Publicly launched on all plans
        - Bug-focused code review plus STRIDE/CWE security review and deep audits
        - Need false-positive and missed-finding rates on customer codebases
    notes: >-
      Matrix reflects modules publicly visible across product pages, docs, and launch posts as of 2026-06-23.
      Maturity labels distinguish general availability, launched-but-younger surfaces, and preview features; they do not
      imply audited customer adoption depth.
