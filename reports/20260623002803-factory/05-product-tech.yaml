  - id: TE002
    title: Workflow / Use-Case Table
    columns:
      - User job
      - Current workflow
      - Factory solution
      - Measurable benefit / promise
      - Limitation
    rows:
      - - Build or change a feature
        - Engineer translates ticket/spec into code, tests, and PR manually
        - Droid plans, edits, tests, and opens review-ready output from terminal, IDE, browser, or Slack
        - One prompt to PR; 31x faster feature delivery claimed in Series B materials
        - Claim is company-authored and not independently benchmarked on customer repos
      - - Run a long project or migration
        - Staff engineers coordinate subtasks, QA, and validation over hours or days
        - Missions decomposes work into milestones, worker sessions, and validator passes
        - Multi-hour to multi-day autonomous execution with validation loops
        - Need customer proof on total cost, supervision burden, and rollback frequency
      - - Keep documentation current
        - Docs rot unless humans update architecture pages and setup guides
        - AutoWiki generates and refreshes architecture, module, API, and convention docs on every push
        - Repo wiki becomes a continuously updated build artifact
        - Need evidence on doc quality for large/private monorepos and non-GitHub repos
      - - Review PRs for bugs and security
        - Human review is slow and coverage inconsistent
        - Code Review and Automated Security Review run in PR workflows or locally
        - P0-P3 findings, CWE references, suggested fixes, and clean-diff approval flow
        - Need customer false-positive/false-negative data and escalation practices
      - - Validate user-facing behavior before merge
        - Tests pass but UI or workflow regressions still slip through
        - Automated QA drives flows and posts screenshots, traces, and pass/fail result to the PR
        - Adds human-like workflow verification to every push or on-demand CI check
        - Need public data on coverage authoring effort and flake management
      - - Measure adoption and ROI
        - Leaders lack a common view of token spend, autonomy, and output
        - Analytics and Agent Readiness expose usage, productivity, readiness level, and OTEL exports
        - Makes the internal AI-investment case more legible for engineering leadership
        - Need public pricing, retention, and benchmark guidance for admin surfaces
    notes: >-
      Benefits mix direct company claims and public workflow design. Where metrics come from company announcements,
      they are listed as promises or claimed outcomes rather than independently verified results.
