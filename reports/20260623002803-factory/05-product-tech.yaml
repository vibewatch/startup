  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: compliance
      missingEvidence: Current SOC 2 Type II report, ISO 27001 certificate, ISO 42001 certificate, and security pack proving the latest compliance state.
      whyItMatters: Public pages provide a credible control narrative but not enough documentary support to underwrite the full compliance posture for regulated buyers.
      diligencePath: Request the current trust center packet, auditor letters, scope statements, and change log from Type I to any later attestations.
      relatedQuestionRefs: [QE025]
      relatedTableRefs: [TE004]
    - type: private-evidence-only
      severity: material
      topic: reliability
      missingEvidence: Historical uptime, incident history, SLA attainment, failover metrics, and customer references validating Router and enterprise runtime reliability.
      whyItMatters: Factory is asking buyers to trust autonomous workflows in critical engineering paths, so reliability evidence matters as much as feature breadth.
      diligencePath: Request status history, incident postmortems, SLA reports, and production customer references for Router, Desktop, and Missions.
      relatedQuestionRefs: [QE028]
    - type: missing-source
      severity: material
      topic: integration-depth
      missingEvidence: A comprehensive public integration catalog or API schema covering native connectors, MCP patterns, admin APIs, and deployment prerequisites.
      whyItMatters: Enterprise implementation friction, extensibility, and security review burden cannot be estimated from high-level feature copy alone.
      diligencePath: Request product documentation for each supported connector, admin API references, MCP governance docs, and sample implementation plans.
      relatedQuestionRefs: [QE029]
      relatedTableRefs: [TE003]
    - type: private-evidence-only
      severity: material
      topic: independent-validation
      missingEvidence: Independent customer benchmarks or audit-style proof for Desktop execution quality, Missions convergence, QA flake rates, and security-review precision/recall.
      whyItMatters: Newer modules are strategically important to Factory’s differentiation, but much of the best evidence remains company-authored.
      diligencePath: Ask for named customer case studies with metrics, benchmark protocols, false-positive data, and implementation retrospectives by module.
      relatedQuestionRefs: [QE027]
      relatedTableRefs: [TE001, TE004]
