  - id: TE004
    title: Trust / Quality / Compliance Table
    columns:
      - Control or certification
      - Public status
      - Scope
      - Gap / limitation
    rows:
      - - No customer code used for training
        - Explicitly stated on the security page
        - Customer IP and model-training boundary
        - No public data-processing agreement or external audit evidence in retained set
      - - Single-tenant VPC hosting
        - Explicitly stated for enterprise deployments
        - Isolation of hosted customer environments
        - Need architecture pack and shared-services boundary details
      - - Encryption at rest / in transit
        - AES-256 at rest and TLS 1.2+ in transit stated publicly
        - Stored and transported customer data
        - No public key-management or HSM design disclosure retained
      - - Audit logging and SIEM export
        - Publicly stated in security and pricing materials
        - Monitoring, alerting, activity trails, and governance
        - Need schema, retention, and immutability details
      - - ZDR + SSO / SAML / SCIM + admin controls
        - Publicly stated in Teams/Enterprise packaging
        - Access control, identity lifecycle, and data-retention policy
        - Need exact implementation docs and exclusions by deployment mode
      - - Automated Security Review
        - Publicly launched with STRIDE, CWE references, and deep audits
        - PR-level and repo-level secure-code analysis
        - Need independent precision/recall data on customer codebases
      - - Automated QA with visual evidence
        - Publicly launched across plans
        - Workflow-quality validation before merge
        - Need public test-flake and environment-support evidence
      - - SOC 2 Type I
        - Explicit announcement retained
        - Baseline security/privacy certification signal
        - Need report date, scope, and bridge to later claims
      - - ISO 42001 / SOC 2 Type II / ISO 27001 claims
        - ISO 42001 stated on security page; Missions also claims SOC 2 Type II and ISO 27001
        - AI-governance and enterprise-compliance positioning
        - Need certificates or audit letters because corroboration is thinner than the breadth of the claim
    notes: >-
      Public controls are meaningful, but external diligence should request the current security pack, compliance
      attestations, DPA terms, and architecture diagrams before treating these controls as fully underwritten.
