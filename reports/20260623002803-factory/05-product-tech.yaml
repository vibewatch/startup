  - id: TE003
    title: Technology / Operating Architecture Table
    columns:
      - Layer / component
      - Role
      - Public dependency
      - Risk
    rows:
      - - Interface surfaces
        - Terminal, IDE, browser, Slack, Jira, desktop, and headless automation entry points
        - Client integrations and UI shells around the agent core
        - Broad surface area increases permissioning and support complexity
      - - Droid execution layer
        - Agent plans, searches, edits, tests, reviews, and reports
        - Tool runtime, repo context, and workflow installers
        - Quality depends on tool reliability and context assembly
      - - Missions orchestration layer
        - Breaks large work into milestones, workers, and validators with shared state
        - Task decomposition, validation contracts, and background execution
        - Coordination overhead and long-horizon correctness remain active design risks
      - - Router / model-routing layer
        - Chooses models/providers per session and reroutes on degradation
        - Provider APIs, capacity sources, enterprise routing guidance
        - Opaque classifier logic and limited external verification of claims
      - - Knowledge / telemetry layer
        - AutoWiki, Signals, Analytics, memory, and agent-readiness scoring preserve context and measure outcomes
        - Repo analysis, embeddings/LLM judges, OTEL, BigQuery/OpenAI batch APIs for Signals
        - Privacy depends on abstraction guarantees and data-governance implementation
      - - Deployment / control plane
        - SaaS, hybrid, on-prem, and air-gapped delivery with policy controls
        - Customer network environment, compute allocation, keys, and admin policies
        - Implementation effort and security review burden likely rise with sovereignty requirements
      - - Model connectivity layer
        - BYOK, mixed models, OpenAI/Anthropic/Gemini/generic providers, local models
        - Provider compatibility rules, API quotas, prompt-caching behavior
        - Multi-provider flexibility adds configuration complexity and failure modes
    notes: >-
      This architecture table is reconstructed from product, research, and docs surfaces. Factory publishes meaningful
      operating-model detail, but not a single canonical reference architecture diagram.
