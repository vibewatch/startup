  - id: architecture-and-operating-model
    title: Architecture and Operating Model
    body: >-
      Factory’s public architecture centers on model independence, workflow decomposition, and context management. The homepage frames the stack around model independence and sovereign deployment, while Router and BYOK documentation show how that principle becomes product behavior: Factory can call provider-native models, generic chat-completions endpoints, open-source endpoints, and locally hosted models, then let admins or users switch among them with the model selector. Mixed-model configuration extends the architecture one level further by separating specification-mode planning from execution-mode coding, which implies Factory treats planning and implementation as distinct workloads rather than a single monolithic session.

      Missions adds the clearest architectural disclosure. Factory describes an orchestrator that scopes work, writes a validation contract, decomposes large projects into milestones and features, spawns fresh worker sessions, and inserts independent validators before progress continues. The Missions architecture article makes the design rationale explicit: narrow worker scopes reduce context contamination, externalized shared state preserves continuity, and separate validators counteract self-confirmation bias. Router complements that orchestration layer by choosing models per session, rerouting across providers, and reserving dedicated throughput for enterprise users. AutoWiki, Signals, and Analytics round out the operating model: AutoWiki turns repository structure into continuously updated documentation, Signals abstracts user-session friction into privacy-preserving product telemetry, and Analytics converts token, tool, adoption, and output data into an admin reporting layer. Taken together, the public evidence supports a multi-component operating system for agent-driven engineering rather than a wrapper around one foundation model.
    claimRefs:
