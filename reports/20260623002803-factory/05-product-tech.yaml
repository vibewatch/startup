      - CE037
      - CE039
  - calloutType: recommendation
    title: Prioritize security pack, uptime history, and enterprise implementation evidence in diligence
    body: >-
      Before underwriting Factory as a mission-critical engineering platform, request the current security/compliance
      packet, historical uptime or incident metrics, sample implementation plans, and customer proof for Router,
      Desktop, and Missions.
    claimRefs:
      - CE022
      - CE031
      - CE032
      - CE038
