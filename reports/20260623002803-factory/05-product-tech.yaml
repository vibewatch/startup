  - calloutType: risk
    title: Independent validation still lags the breadth of the public product story
    body: >-
      Factory publishes unusually detailed architecture and benchmark material, but much of the strongest evidence on
      reliability, customer outcomes, and newer module maturity remains company-authored rather than third-party validated.
    claimRefs:
