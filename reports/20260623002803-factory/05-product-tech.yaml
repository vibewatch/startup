figures:
  - id: FE001
    title: Factory Product Architecture Map
    type: stack
    summary: >-
      Publicly visible layers in Factory’s product architecture run from deployment and model connectivity up through
      orchestration, workflow products, and admin telemetry. The stack reflects disclosed operating components rather
      than an internally complete architecture diagram.
    approximationNotes: >-
      Factory publishes meaningful component descriptions but no single canonical architecture diagram. Layering is an
      analyst reconstruction from product pages, launch posts, and docs.
    data:
      layers:
        - id: L1
          label: Sovereign deployment + enterprise control plane
          description: SaaS, hybrid, on-prem, and air-gapped deployment with policy, residency, retention, and network controls
          detail: Homepage, pricing, and enterprise/security materials describe the sovereignty and admin-governance layer.
        - id: L2
          label: Model connectivity layer
          description: BYOK, customModels, mixed models, provider-native APIs, generic endpoints, and local/open-source models
          detail: Docs show OpenAI, Anthropic, Gemini, and generic-chat-completion-api configurations plus planning/implementation model splits.
        - id: L3
          label: Router and session runtime
          description: Per-session model/provider routing, failover, throughput controls, and runtime context signals
          detail: Router is the cost/reliability layer that decides which model path a Droid session should use.
        - id: L4
          label: Droid execution + Missions orchestration
          description: Interactive agents, long-horizon orchestrator-worker-validator loops, and reusable subagents/custom droids
          detail: Missions and custom droids turn the core agent into a multi-agent operating model instead of a single session.
        - id: L5
          label: Workflow products
          description: Code Review, Security Review, Automated QA, AutoWiki, Desktop, CLI/SDK, and background automation
          detail: These modules package the agent layer into concrete SDLC jobs and PR-centered delivery loops.
        - id: L6
          label: Knowledge, telemetry, and admin analytics
          description: Signals, Analytics, agent-readiness scoring, memory, OTEL exports, and wiki/search surfaces
          detail: The admin layer measures usage, readiness, friction, and ROI while preserving cross-session context.
    claimRefs:
      - CE008
      - CE009
