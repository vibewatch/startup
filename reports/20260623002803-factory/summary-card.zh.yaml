  topStrengths:
    - 产品覆盖编码、审查、测试、文档、事故响应和更长周期的智能体工作流，不只是单一 copilot 界面。
    - 从种子轮一路融到估值 $1.5B 的 Series C，再加上 Sequoia、NEA、Khosla、Nvidia、Blackstone、Wipro Ventures 等投资人，Factory 同时拿到充足资本和渠道信用。
    - 具名客户和伙伴验证覆盖企业、金融科技、安全、推理基础设施和全球系统集成，说明商业相关性不止于设计伙伴小圈子。
  topRisks:
    - 公开来源仍缺 ARR、毛利率、留存、烧钱速度、客户集中度和优先权条款，估值无法锚定在已披露的软件基本面上。
    - 最强的基准、使用量和生产力主张多来自公司自写材料或筛选后的案例，而不是独立审计披露。
    - GitHub Copilot、Cursor、Devin、Windsurf 以及强调隐私的企业工具都在施压；Factory 还没证明续约经济性足够耐久，定价和差异化就可能先被压缩。
  unresolvedGaps:
    - 可提交董事会的 ARR、确认收入、毛利率，以及烧钱速度 / 现金跑道披露
    - 净收入留存、合同期限、实际价格实现和客户集中度数据
    - 最新及此前融资轮完整股权结构表、优先股堆叠和治理披露
