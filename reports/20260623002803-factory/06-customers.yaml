- id: named-customer-proof-and-evidence-quality
  title: Named Customer Proof and Evidence Quality
  body: 'The proof set separates cleanly into three tiers. First are five strong case-study accounts—Chainguard, Empower, Groq, Nav, and You.com—where Factory discloses the customer identity, describes the workflow, and in four of five cases supplies quantified outcomes. These are the only sources that demonstrate more than logo usage. Second is Wipro, which is both a partner and an internal deployment commitment: the announcement provides scale and vertical reach, but its customer outcomes are still channel-forward rather than end-customer specific. Third is the long tail of named enterprise references such as Morgan Stanley, EY, Palo Alto Networks, Nvidia, Adobe, Adyen, MongoDB, Bayer, Zapier, and Clari. These names show sales reach into large enterprises, but they do not disclose deployment stage, seat count, production scope, or business outcome. Diligence should therefore treat the case studies as real customer proof, Wipro as channel-plus-rollout proof, and the broader logo list as
    awareness and credibility proof only.'
  claimRefs:
