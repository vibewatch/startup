  title: Customers
  summary: 'Factory''s public customer evidence is strongest on enterprise fit and a small set of named deployments with concrete usage or outcome detail: Chainguard, Empower, Groq, Nav, You.com, and Wipro. The materials support real production adoption, regulated-industry appeal, and credible channel expansion, but durability remains under-disclosed because public sources omit paying-customer count, seat retention, contract terms, renewal rates, and customer concentration by revenue while most additional logos remain unquantified.'
sections:
- id: customer-segmentation-and-buying-center
  title: Customer Segmentation and Buying Center
  body: 'Factory''s public customer base is best understood as enterprise software organizations buying team-wide autonomy rather than individual coding assistance. Pricing and enterprise packaging show payer authority moving from individual developers on Pro, Plus, and Max into centralized engineering, platform, or CTO budgets once a deployment reaches Teams or Enterprise. Users remain day-to-day engineers, but the buying committee broadens in regulated accounts: Factory''s financial-services and enterprise materials repeatedly emphasize security, auditability, role-based access control, model governance, and deployment flexibility, which implies active participation from security, compliance, infrastructure, and procurement stakeholders. Vertical targeting is clearest in SaaS and financial services, then broadens through Wipro into healthcare, manufacturing, retail, and technology. The logo-only customer cohort also reaches into semiconductors and AI infrastructure, digital payments, developer databases, life sciences, workflow automation, and revenue software through Nvidia, Adyen, MongoDB, Bayer, Zapier, and Clari. Geography is only partially disclosed, but the named customer and partner set includes global enterprises such as EY,
    Morgan Stanley, Palo Alto Networks, Wipro, and distributed engineering teams at Empower, indicating the platform is being sold into multinational software environments rather than a single domestic niche.'
