- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / concentration risk
  - Type
  - Impact
  - Evidence
  - Diligence path
  rows:
  - - Self-serve to Teams / Enterprise packaging
    - Expansion driver
    - High positive if pilots convert into seat-based enterprise contracts
    - Pricing and enterprise pages add governance, dedicated compute, and unlimited-seat packaging
    - Request conversion funnel from Pro / Plus / Max into Teams / Enterprise
  - - Azure Marketplace and MACC eligibility
    - Expansion driver
    - High positive because procurement, billing, and security review can compress inside Azure budgets
    - Factory says Azure procurement shortens evaluation and billing cycles; Microsoft marketplace highlights marketplace time savings
    - Verify what share of enterprise ARR now closes through Azure
  - - Wipro internal rollout plus resale
    - Expansion driver and dependency
    - High positive if Wipro scales; also creates partner concentration risk
    - Wipro plans rollout across tens of thousands of engineers and resale into five sectors
    - Request revenue share, pipeline attribution, and exclusivity terms
  - - Proof concentrated in five case-study accounts
    - Concentration risk
    - High because quantified public evidence is dominated by a handful of marquee names
    - Only Chainguard, Empower, Groq, Nav, and You.com provide workflow detail and outcomes
    - Request top-10 customer revenue concentration and sector mix
  - - Vertical proof skew
    - Concentration risk
    - Medium because public proof is strongest in fintech, AI infra/search, security/open source, and consulting
    - Manufacturing, retail, and healthcare appear mainly in Wipro resale claims rather than named deployments
    - Request named references in each promised Wipro sector
  - - Logo-only customer references
    - Concentration / visibility risk
    - Medium because many marquee names may represent small pilots or narrow teams
    - Morgan Stanley, EY, Palo Alto Networks, Nvidia, Adobe, Adyen, MongoDB, Bayer, Zapier, and Clari lack public scope detail
    - Request seats, repos covered, and deployment stage for each marquee account
  notes: Impact levels are analytical judgments based on the public evidence mix. The table distinguishes upside drivers from disclosure-related concentration risks.
