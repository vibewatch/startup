- id: retention-durability-and-public-gaps
  title: Retention, Durability, and Public Gaps
  body: 'Durability is the weakest part of the public customer record. No retained source discloses paying-customer count, seat retention, net revenue retention, gross revenue retention, churn, contract duration, renewal rates, or satisfaction scores. The only retention proxies are behavioral. Chainguard reports running multiple Droid sessions for weeks at a time, which suggests repeat use in a demanding security-engineering workflow. You.com says Factory became standard in code review and keeps agents running around the clock, which is stronger than a one-off pilot. Wipro combined investment with a committed internal rollout, adding another persistence signal. Even so, those proxies are not substitutes for renewal data or spend expansion. Adverse outside commentary also matters here: one external review argues Factory still suffers from code-quality, token-consumption, and reliability problems, and another flags spend predictability risk because public tier descriptions do not disclose
    exact token ceilings. The durable-adoption thesis is therefore plausible but not yet underwritten by cohort data.'
  claimRefs:
