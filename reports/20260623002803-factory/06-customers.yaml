- id: adoption-trajectory-and-usage-proxies
  title: Adoption Trajectory and Usage Proxies
  body: The adoption record is uneven but directionally strong. At the broadest level, Factory's April 2026 Series C announcement claims Droids are used daily by hundreds of thousands of developers across enterprises including Nvidia, Adobe, EY, Palo Alto Networks, and Adyen. Independent reporting adds Morgan Stanley to the named-account set, while the September 2025 Series B launch added MongoDB, Bayer, Zapier, and Clari as global-rollout references. Those logo claims matter less than the operating proxies inside the case studies. Chainguard describes two-week-long Droid sessions spanning six repositories and 80 packages. Empower says Factory cut incident response time by 40% and reduced product-development Q&A and PR-approval delays by up to 50%. Groq cites 3x faster feature development and 5x faster quick-turn tasks. Nav cites 60% lower context-switching time and 2x faster feature cycles. You.com says Factory became part of its standard code-review and background-work system, while Wipro
    says it plans rollout across tens of thousands of engineers. Together, those signals support meaningful usage depth even though public customer-count denominators remain absent.
