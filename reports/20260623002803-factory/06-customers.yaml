figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Illustrates how Factory moves from individual evaluation into governed enterprise deployment, standardization, and partner-led scale.
  data:
    nodes:
    - label: 1. Individual or team discovery
      detail: Developers or team leads trial Factory through CLI, desktop, or self-serve subscriptions to solve coding, review, or debugging tasks
      tone: neutral
    - label: 2. Security and procurement review
      detail: Regulated buyers evaluate SSO, audit logs, model governance, on-prem or hybrid deployment, and approved purchasing paths such as Azure Marketplace
      tone: neutral
    - label: 3. Scoped production rollout
      detail: A customer puts Factory into an operational workflow such as code review, incident response, research, or package maintenance inside a real engineering team
      tone: positive
    - label: 4. Workflow expansion
      detail: Successful accounts widen from a single use case into multiple surfaces or workloads, such as code review plus background agents plus debugging
      tone: positive
    - label: 5. Account standardization
      detail: Factory becomes part of the default engineering system or remains active for weeks at a time, as described by You.com, Nav, and Chainguard
      tone: positive
    - label: 6. Channel-led scale
      detail: Enterprise expansion accelerates through Wipro services relationships, Azure procurement, and security partners that reduce organizational friction
      tone: risk
  approximationNotes: Stages are based on public customer stories, packaging, and channel announcements rather than on an explicitly published Factory sales-funnel diagram.
  claimRefs:
  - CU002
  - CU003
  - CU010
  - CU023
  - CU024
  - CU033
  - CU043
