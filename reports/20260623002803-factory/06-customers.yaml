  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: Paying-customer count, active-seat count, and split between self-serve, Teams, and Enterprise accounts.
    whyItMatters: Without account and seat denominators, public usage anecdotes cannot be converted into penetration, concentration, or expansion metrics.
    diligencePath: Request current customer-count bridge and active-seat cohorting from management, segmented by pricing tier and top vertical.
    relatedQuestionRefs:
    - QU025
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal dates, contract lengths, and expansion-rate data for enterprise customers.
    whyItMatters: Durability is central to underwriting enterprise software quality; public proxies do not substitute for cohort retention or renewal evidence.
    diligencePath: Request cohort retention tables, top-20 account renewal calendar, and seat-expansion history by year.
    relatedQuestionRefs:
    - QU026
  - type: missing-source
    severity: material
    topic: wipro-sector-proof
    missingEvidence: Named end-customer deployments in Wipro's promised banking, healthcare, manufacturing, retail, or technology sectors.
    whyItMatters: The Wipro partnership expands the stated addressable market, but without named implementations it remains more channel promise than validated sector penetration.
    diligencePath: Ask Wipro and Factory for at least one named customer reference or anonymized deployment case in each stated sector.
    relatedQuestionRefs:
    - QU027
  - type: private-evidence-only
    severity: material
    topic: contract-economics
    missingEvidence: Contract value, discounting, minimum commits, support burden, and services mix for named enterprise customers.
    whyItMatters: Customer names alone do not establish revenue quality, gross-margin durability, or channel economics.
    diligencePath: Review standard Teams and Enterprise order forms plus top-customer pricing and professional-services attachments.
    relatedQuestionRefs:
    - QU018
    - QU026
  - type: missing-source
    severity: minor
    topic: adverse-customer-outcomes
    missingEvidence: Named public examples of failed pilots, major downsells, or customer dissatisfaction from verified enterprise users.
    whyItMatters: One competitive review is not enough to understand real churn or implementation failure modes across the installed base.
    diligencePath: Search review platforms, reference-call transcripts, and internal support-escation logs for failed or delayed deployments.
    relatedQuestionRefs:
    - QU024
