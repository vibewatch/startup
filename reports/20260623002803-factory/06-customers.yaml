- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / User / Payer
  - Geography
  - Primary use case
  - Named proof
  - Key gap
  rows:
  - - Regulated financial institutions and fintech
    - 'Buyer: CTO / engineering leadership / risk stakeholders; User: engineers, product, QA; Payer: centralized engineering budget'
    - US and multinational
    - Core banking, client apps, incident response, code review, context gathering
    - Empower, Nav, Morgan Stanley, EY; Factory has a dedicated financial-services page
    - No disclosed seat counts, contract terms, or renewal metrics for any regulated account
  - - SaaS and internet product companies
    - 'Buyer: VP Engineering / platform leads; User: feature teams; Payer: engineering tooling budget'
    - Primarily US-facing, globally distributed teams
    - Feature development, bug fixing, refactoring, APIs, CI/CD
    - You.com plus official SaaS positioning; Zapier and Clari appear as logo references
    - Public proof is strongest for You.com; other SaaS logos are unquantified
  - - AI-native infrastructure and search platforms
    - 'Buyer: engineering leadership; User: infra and application engineers; Payer: platform / AI infra budget'
    - US and global developer orgs
    - Model-flexible coding agents, debugging, review, research, parallel tasking
    - Groq and You.com case studies
    - No public spend, seat, or retention disclosure despite strong workflow specificity
  - - Security, open-source, and platform engineering teams
    - 'Buyer: staff / platform / security leaders; User: engineers maintaining large codebases; Payer: platform or security engineering'
    - Global open-source and security workflows
    - Long-running sessions, package updates, review-heavy engineering, supply-chain-sensitive work
    - Chainguard case study and Palo Alto partnership context
    - Only Chainguard provides direct usage detail; Palo Alto is partnership proof, not outcome proof
  - - Global systems integrators and enterprise IT services
    - 'Buyer: transformation leadership; User: delivery engineers; Payer: enterprise services budget'
    - Global
    - Production-code generation, modernization, client delivery acceleration
    - Wipro internal rollout plus resale motion
    - Public evidence stops at rollout intent and channel scope; no end-client case studies yet
  - - Logo-only large-enterprise cohort
    - Buyer likely enterprise engineering or CIO staff; users likely developers; payer likely central IT
    - Large multinational enterprises
    - Undisclosed
    - Nvidia, Adobe, Adyen, Bayer, MongoDB, Zapier, Clari, Palo Alto Networks, EY, Morgan Stanley
    - These references prove sales reach but not deployment depth, revenue contribution, or retention
  notes: Segmentation mixes direct case-study customers, company-claimed logo references, and partner-mediated routes to market. Geography and payer roles are often inferred from customer type because Factory does not disclose contract owners or seat distribution.
