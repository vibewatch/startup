- id: expansion-channels-and-concentration-risk
  title: Expansion Channels and Concentration Risk
  body: Factory has a credible land-and-expand story, but it is partner-shaped and publicly concentrated. Pricing shows a deliberate path from individual subscriptions into Teams and Enterprise, with larger plans adding SSO, governance, dedicated compute, and premium support that should raise ACV once a pilot clears security review. Azure Marketplace reduces procurement friction by allowing purchase against existing cloud commitments, while Wipro can both deploy Factory internally and resell it into banking, healthcare, manufacturing, retail, and technology clients. Security partnerships with Palo Alto Networks and Snyk further align the product with enterprise control requirements. The risk is that public proof is still concentrated among a handful of marquee case-study accounts and a single large channel partner. Vertical proof is strongest in fintech, security/open source, AI infrastructure, and internet software; manufacturing, retail, and healthcare are still mostly a Wipro pipeline
    claim, not named deployment evidence. As a result, expansion looks real, but customer concentration and channel dependence remain material diligence topics.
  claimRefs:
