- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - ARR and revenue bridge
    - Latest ARR, TTM revenue, bookings, and cohort growth bridge
    - Without it, the Series C price cannot be translated into a defensible software multiple.
    - Finance team / board deck and monthly KPI pack.
  - - Gross margin and model-cost waterfall
    - COGS split by model spend, cloud compute, support, and customer engineering
    - Determines whether Factory can scale like software instead of like a managed service.
    - Finance + engineering ops / cost-allocation review.
  - - Retention and concentration
    - NRR, logo churn, and top-10 customer revenue exposure
    - Tests whether customer proof is durable and diversified enough for late-stage valuation.
    - Revenue ops / cohort deck and customer concentration schedule.
  - - Cap table and preference stack
    - Liquidation preferences, option pool, secondaries, SAFEs, and pro forma dilution
    - Downside protection and ownership economics can change the investment outcome materially.
    - Legal + finance / cap table and financing documents.
  - - Wipro and channel economics
    - Commercial terms, revenue share, implementation ownership, and paid-client conversion data
    - Validates whether the marquee channel story produces attractive economics or just distribution theater.
    - Partnerships + sales / contract review and pipeline analysis.
  - - Benchmark-to-renewal conversion
    - Evidence that benchmark leadership and productivity claims drive expansion or renewal
    - Separates marketing proof from monetizable product advantage.
    - Product + CS / renewal narratives, win-loss, and case-study back-up.
  notes: These are the minimum diligence asks required to convert a public-only narrative into an investable underwriting case.
