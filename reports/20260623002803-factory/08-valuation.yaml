  - - Factory Series C (2026)
    - $150M raise at $1.5B valuation
    - $1.5B disclosed private round
    - Current market-clearing reference price.
    - Tells us what investors paid, not whether the multiple is justified.
  - - GitHub Copilot route
    - Repository-native distribution and incumbent workflow control
    - Standalone valuation not disclosed in retained source pack
    - Represents the distribution ceiling in enterprise coding agents.
    - Bundled inside Microsoft, so the route is strategic rather than directly comparable.
  - - Cursor route
    - Autonomy narrative plus public pricing and Fortune 500 adoption claim
    - Valuation not retained in reviewed source pack
    - Shows buyers will pay for agentic developer tooling with clear UX and pricing.
    - No verified financial denominator is retained here either.
  - - Devin / Windsurf route
    - Agent-native workstation with built-in IDE oversight, shared Spaces, and 1M+ users plus 4,000+ enterprise customers claimed
    - Valuation not retained in reviewed source pack
    - Useful for autonomy and workflow comparison.
    - Claims are vendor-authored and not enough to derive a multiple.
  - - Tabnine route
    - Private deployment options, governance controls, and agentic platform pricing
    - Valuation not retained in reviewed source pack
    - Relevant for regulated-buyer willingness to pay for governance and deployment control.
    - Less agentic breadth than Factory, so the peer is directional, not like-for-like.
