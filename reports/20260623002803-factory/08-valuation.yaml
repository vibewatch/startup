  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: cap-table-visibility
    missingEvidence: Liquidation preferences, option pool, dilution waterfall, any secondary component, and investor rights for the Series C.
    whyItMatters: Late-stage equity outcomes depend on stack seniority and dilution as much as on topline growth; without these terms the downside case is incomplete.
    diligencePath: Request the cap table, financing documents, and board-approved post-money ownership schedule from finance and counsel.
    relatedQuestionRefs:
    - QV005
    - QV028
  - type: private-evidence-only
    severity: blocking
    topic: revenue-visibility
    missingEvidence: Current ARR, TTM revenue, bookings bridge, and gross margin by cohort or plan tier.
    whyItMatters: The current valuation cannot be translated into a defensible software multiple without an economic denominator and margin context.
    diligencePath: Request the latest board deck, KPI pack, revenue waterfall, and gross-margin bridge before any pricing discussion.
    relatedQuestionRefs:
    - QV003
    - QV015
    - QV028
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: NRR, logo churn, seat expansion, top-customer concentration, and contract duration or discounting norms.
    whyItMatters: Named logos and benchmark claims do not prove the durability or diversification that late-stage valuation requires.
    diligencePath: Request cohort retention dashboards, top-10 customer exposure, and standard order forms with pricing and renewal terms.
    relatedQuestionRefs:
    - QV015
    - QV022
    - QV028
  - type: enumeration-incomplete
    severity: material
    topic: comparable-set
    missingEvidence: Verified peer financial denominators or valuation datapoints for the main competitor routes in the coding-agent category.
    whyItMatters: The comparable valuation table is directional rather than fully quantitative, which widens the fair-value range materially.
    diligencePath: Pull validated private-market marks or public-company revenue and market-cap datapoints into the next refresh before tightening scenario bands.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Cash on hand, monthly burn, and runway after the Series C close.
    whyItMatters: Fundraising headlines alone do not show whether the company is financing from strength or simply subsidizing a capital-intensive go-to-market push.
    diligencePath: Request treasury snapshots, monthly burn history, and an 18-month operating plan tied to the Series C budget.
    relatedQuestionRefs:
    - QV004
    - QV028
