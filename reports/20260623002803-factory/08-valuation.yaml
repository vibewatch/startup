- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - ARR scale disappoints
    - Private diligence shows ARR or TTM revenue far below what a $1.5B round would normally imply
    - Breaks the premium-software underwriting case.
    - Do not invest at the disclosed price; revisit only at a materially lower entry.
  - - Gross margin is infrastructure-heavy
    - Margins remain compressed after routing and pricing changes
    - Turns the story from software leverage into service or compute burden.
    - Require a lower valuation or stronger structural protections.
  - - Retention is weak
    - NRR or logo retention does not support land-and-expand claims
    - Undercuts the thesis that workflow breadth creates durable expansion.
    - Move to avoid unless the price resets sharply.
  - - Preference stack is punitive
    - Late-stage preferences, guaranteed returns, or large secondary components dominate the cap table
    - Can destroy common-equity upside even if operations are decent.
    - Do not proceed without term restructuring or exceptional growth proof.
  - - Channel proof fails to monetize
    - Wipro deployment does not turn into durable paid client expansion
    - Reduces one of the main reasons to believe GTM can scale efficiently.
    - Downgrade the bull case and treat current price as aggressive.
  notes: These are monitorable breakpoints for the current narrative and should be tested directly in management and data-room diligence.
