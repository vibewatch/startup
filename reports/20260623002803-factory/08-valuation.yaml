chapter:
  number: 8
  title: Valuation
  summary: Factory has enough evidence-backed product breadth, customer proof, and channel ambition to stay investable, but the public record still does not disclose the revenue, margin, retention, or preference data needed to underwrite the April 2026 $1.5 billion price. The supportable public-only call is research-more with medium confidence, high risk, and a stretched valuation stance until private diligence proves that the recent financing step-up reflects durable enterprise economics rather than momentum alone.
sections:
- id: current-price-and-financing-context
  title: Current Price and Financing Context
  body: 'The disclosed price anchor is clear even though the underwriting base is not. Factory publicly announced a $5 million seed, a $15 million Series A at a $120 million valuation, a $50 million Series B at a $300 million valuation, and a $150 million Series C at a $1.5 billion valuation, implying at least $220 million of disclosed funding since launch. The April 2026 round therefore reset price expectations dramatically only about seven months after the Series B. That can be rational if enterprise adoption, product breadth, and channel leverage are compounding quickly, but the same public record still omits the core variables that would let an investor test the price: ARR, absolute revenue, gross margin, burn, runway, contract duration, NRR, customer concentration, and the preference stack. The key valuation conclusion is that Factory is easy to price narratively and hard to price fundamentally. The round says what the market paid; it does not yet show what the business earns or how
    much downside protection late investors received.'
