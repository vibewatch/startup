- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Why it matters
  - Implication
  - Diligence ask
  rows:
  - - Seed financing
    - $5M announced November 2023
    - Establishes earliest disclosed capitalization
    - Shows credible early investor backing but says little about current solvency
    - Confirm whether seed included SAFEs or priced equity only
  - - Series A financing
    - $15M at $120M valuation in March 2025
    - Marks first disclosed valuation step-up
    - Signals early product-market interest and team-building capital
    - Provide use-of-funds bridge against current product footprint
  - - Series B financing
    - $50M at $300M valuation in September 2025
    - Material growth capital before Droids launch scale-up
    - Suggests investors funded product, hiring, and adoption ramp ahead of Series C
    - Provide board-approved budget and hiring plan post-Series B
  - - Series C financing
    - $150M at $1.5B valuation in April 2026
    - Primary current balance-sheet event
    - Supports near-term operating capacity but does not reveal runway
    - Provide cash balance at close and covenant / preference summary
  - - Use of Series C proceeds
    - Research, product, and global go-to-market
    - Indicates growth investment rather than only balance-sheet defense
    - Likely keeps burn elevated while scaling sales and infrastructure
    - Provide 18-24 month budget allocation by function
  - - Cash / burn / runway / debt
    - null
    - Critical test of capital adequacy
    - Public fundraising headlines cannot be converted into runway or dilution risk
    - Provide cash on hand, monthly burn, debt schedule, and minimum-cash threshold
  notes: Public fundraising evidence is strong, but no retained source discloses treasury detail, leverage,
    or runway. Capital adequacy is therefore inferential rather than balance-sheet based.
