  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-run-rate
    missingEvidence: Latest ARR, TTM revenue, and bookings-to-revenue reconciliation by product tier and
      enterprise contract.
    whyItMatters: Without an absolute revenue base, the 2x MoM growth claim cannot be translated into
      scale or valuation support.
    diligencePath: Request the latest board deck, monthly management accounts, and a signed bookings-to-revenue
      bridge.
    relatedQuestionRefs:
    - QI019
    - QI021
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: Gross margin, COGS, and compute cost per cohort or plan.
    whyItMatters: This determines whether Factory is compounding software leverage or absorbing heavy
      infrastructure and service-delivery burden.
    diligencePath: Request a gross-margin bridge split across self-serve, Teams, and Enterprise cohorts.
    relatedQuestionRefs:
    - QI013
    - QI014
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Cash on hand, monthly burn, debt, and 18-24 month runway forecast after the Series
      C.
    whyItMatters: Fundraising headlines alone cannot establish capital adequacy or next-round dependency.
    diligencePath: Request treasury reporting, monthly cash-flow statements, debt schedule, and board
      runway scenarios.
    relatedQuestionRefs:
    - QI018
    - QI020
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Realized enterprise pricing, discount ladders, contract duration, minimum commits,
      and renewal terms.
    whyItMatters: List pricing does not show actual monetization quality or how revenue is recognized
      across enterprise deals.
    diligencePath: Request sample order forms, pricing approval policy, and the accounting memo for revenue
      recognition.
    relatedQuestionRefs:
    - QI005
    - QI025
    relatedTableRefs:
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, NRR, logo churn, and usage concentration across named
      accounts.
    whyItMatters: Enterprise-logo proof is helpful, but concentration or weak retention could materially
      reduce revenue durability.
    diligencePath: Request cohort retention tables, NRR by segment, and top-10 customer concentration
      by ARR.
    relatedQuestionRefs:
    - QI026
    relatedTableRefs:
    - TI005
  - type: missing-source
    severity: material
    topic: partner-channel-economics
    missingEvidence: Revenue-share terms, reseller margin, implementation economics, and ACV contribution
      from Azure or Wipro channels.
    whyItMatters: Channel leverage is visible, but channel profitability and sales-efficiency effect remain
      unquantified.
    diligencePath: Request channel-partner agreements, sourced-pipeline data, and win-rate comparisons
      by route-to-market.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Current headcount, hiring plan, and org split across engineering, GTM, and customer
      success.
    whyItMatters: Labor is likely a major operating cost driver and a key determinant of post-Series C
      burn.
    diligencePath: Request current HR snapshot and approved hiring plan by department.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
    - TI005
