- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on analysis
  - Exact diligence path
  - Why it matters
  - Severity
  rows:
  - - ARR / TTM revenue
    - Prevents verification of the growth base beneath the 2x MoM claim
    - Request latest board deck, revenue waterfall, and signed bookings-to-revenue bridge
    - Without absolute revenue, valuation multiples cannot be tested
    - blocking
  - - Gross margin and COGS by cohort
    - Blocks underwriting of software leverage versus infrastructure burden
    - Request gross-margin bridge split by self-serve and enterprise accounts
    - Margin path is central to whether Factory behaves like software or managed service
    - blocking
  - - Cash, burn, runway
    - Prevents judgment on financing dependency after Series C
    - Request treasury snapshot, monthly burn history, and 18-month cash forecast
    - Fundraising headlines do not equal solvency visibility
    - blocking
  - - Headcount and hiring plan
    - Obscures operating leverage and post-Series C spend intensity
    - Request headcount by function and approved hiring plan
    - Labor is likely a major driver alongside compute
    - material
  - - Realized enterprise pricing, discounting, and contract duration
    - Prevents assessment of revenue quality and recognition risk
    - Request sample order forms, discount policy, and revenue-recognition memo
    - List pricing is not enough to evaluate actual monetization
    - material
  - - Customer concentration, retention, and NRR
    - Prevents measurement of durability and expansion economics
    - Request top-10 customer revenue share, logo churn, and NRR cohorts
    - Named logos alone do not show revenue concentration or stickiness
    - material
  notes: These are the core blockers to a public-source financial underwrite for Factory as of the run
    date.
