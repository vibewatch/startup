- id: gtm-motion-and-sales-efficiency-proxies
  title: GTM Motion and Sales Efficiency Proxies
  body: 'Factory''s public evidence points to an enterprise-first go-to-market motion rather than a purely
    bottom-up developer tool. Azure Marketplace availability makes the product purchasable through existing
    MACC commitments, which should shorten procurement, billing, and security review cycles. The Wipro
    partnership extends that motion into a large systems-integrator channel, with rollout across tens
    of thousands of engineers and resale into banking, healthcare, manufacturing, retail, and technology
    clients. The June 2026 CRO hire adds another signal that Factory is institutionalizing enterprise
    selling: Marcello Gallo previously helped drive 300% ARR growth at Sigma and 400% revenue growth at
    Moveworks. Customer case studies provide the closest available sales-efficiency proxies. Nav cites
    2x faster feature development and 60% lower context-switching time; Empower cites 40% faster incident
    response and 50% lower PR or Q&A delays; Groq cites 3x to 5x faster engineering loops. Those outcomes
    support willingness to pay, but public sources still do not disclose CAC, sales-cycle length, implementation
    cost, payback period, or expansion-rate data.'
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI012
  - CI022
  - CI023
  - CI024
  - CI025
  - CI042
