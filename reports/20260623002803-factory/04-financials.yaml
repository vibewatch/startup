- id: cost-structure-and-margin-path
  title: Cost Structure, Gross-Margin Drivers, and Service Intensity
  body: 'Factory''s margin story is legible in outline but not in numbers. On the positive side, the company
    is explicitly working to lower model spend: Factory Router claims 20% to 25% token-cost savings while
    preserving most frontier-model benchmark performance, and You.com says the platform''s model flexibility
    helps keep heavy-user spend under control. That suggests real room for gross-margin improvement if
    sessions can be routed away from expensive models without harming output quality. On the cost side,
    however, the public product set is not lightweight. Dedicated compute, background agents, persistent
    Droid Computers, air-gapped deployments, BYOK support, audit logging, single-tenant hosting, and deep
    enterprise integrations all imply infrastructure and customer-success expense. Security partnerships
    with Palo Alto Networks and Snyk likely improve win rates in regulated accounts, but they also add
    delivery complexity and may compress margins through integration and support burden. The result is
    a plausible path to software leverage, but not a demonstrated public gross-margin profile.'
