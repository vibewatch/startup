callouts:
- calloutType: insight
  title: Factory's real market is governance-heavy, not generic copilot spend
  body: The strongest evidence points to a large market for AI code tools, but Factory's closest opportunity is the narrower slice where buyers pay for secure deployment, policy controls, model flexibility, and workflow integration.
  claimRefs:
  - CM005
  - CM015
  - CM036
- calloutType: risk
  title: Crowding and low endpoint lock-in cap pricing power
  body: Because many rivals also market multi-model or agentic workflows, Factory's durable switching cost will likely come from governance and process integration rather than from a unique model endpoint.
  claimRefs:
  - CM034
  - CM035
  - CM039
- calloutType: assumption
  title: ROI is promising but mostly vendor-reported
  body: Customer stories suggest real productivity gains, yet the public record still lacks independent longitudinal data on paid-seat expansion, defect rates, or enterprise payback periods.
  claimRefs:
  - CM029
  - CM038
