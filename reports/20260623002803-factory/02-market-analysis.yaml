company:
  name: Factory
chapter:
  number: 2
  title: Market Analysis
  summary: Factory addresses a fast-growing but loosely defined AI code-tools market, yet its practical opportunity is narrower than headline TAMs because it sells governed, multi-model, enterprise coding agents rather than generic completion. The best public evidence supports a multi-billion-dollar category with enterprise-heavy demand, but Factory's true SAM and SOM remain only directionally measurable because public pricing, paid-seat counts, and a clean enterprise-agent taxonomy are missing.
sections:
- id: market-boundary
  title: Market boundary, included spend, and substitutes
  body: 'Factory should be analyzed inside the market for enterprise AI coding and agent-native software-development platforms, not inside the much broader universe of all AI software. Its core included spend is workflow automation across the SDLC: coding, testing, review, documentation, governance, deployment controls, and team administration. What sits outside that boundary are foundation-model training budgets, raw GPU or generic cloud infrastructure, and non-engineering AI tools that never touch governed software-delivery workflows. The distinction matters because Factory repeatedly sells model choice, auditability, deployment flexibility, and policy controls as much as raw code generation. Those attributes make its closest substitutes a mix of human-only development, internal tooling, and point products such as GitHub Copilot, Cursor, Devin, Windsurf, and Tabnine. In other words, Factory competes for engineering-productivity budgets, but only part of the headline AI code-tools TAM actually
    maps to the governance-heavy platform it is building.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  tableRefs:
  - TM001
- id: market-sizing
  title: TAM, enterprise-weighted lens, and Factory-relevant SAM
  body: 'The public market data is directionally supportive but not clean. Mordor, Grand View, and MarketsandMarkets all describe a multi-billion-dollar AI code-tools category growing roughly 24% to 27% annually, yet their baselines, end dates, and category definitions do not align. The broadest lens is simply the global AI code-tools market, which is already measured at billions of dollars and expanding quickly. A more relevant second lens is enterprise weighting: Mordor says large enterprises represented 59.47% of category revenue in 2025, and applying that share to its 2026 market estimate yields an enterprise-heavy lens of roughly $5.6 billion before any further narrowing. The practical SAM for Factory should be smaller still because the company is not targeting every code tool buyer; it is targeting organizations that want governed autonomous workflows, multi-model routing, and secure deployment across complex environments. Public evidence clearly shows the category is large enough
    to matter, but public evidence does not yet isolate a clean independent SAM for enterprise-governed coding-agent platforms.'
