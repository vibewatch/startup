- id: TM005
  title: Contradictory estimates and diligence gaps
  columns:
  - Issue
  - Evidence
  - Why it matters
  - Current read
  - Next diligence step
  rows:
  - - Broad TAM disagreement
    - Analyst reports differ on baseline year, endpoint, and scope
    - Valuation can be overstated if broad TAM is taken literally
    - Directionally large market; exact TAM not decision-useful alone
    - Pressure-test taxonomy before sizing
  - - No clean governed-agent SAM
    - No independent source isolates enterprise-governed coding-agent spend
    - Factory's real opportunity could be far smaller than category TAM
    - SAM is inferred, not measured
    - Obtain buyer or analyst segmentation
  - - Public SOM opacity
    - Named customers and funding are public, but paid-seat count and segment revenue are not
    - Reach and penetration cannot be quantified cleanly
    - Adoption evidence is positive but incomplete
    - Request cohort, seat, and ARR disclosure
  - - Enterprise pricing opacity
    - Packaging is public, enterprise dollars are not
    - Hard to convert usage claims into revenue potential
    - Monetization lens remains incomplete
    - Gather list pricing, ACV bands, and services mix
  - - Science free-access economics
    - Free research program widens exposure but not proven monetization
    - Could be strategic seeding or a low-yield channel
    - Economics are unproven from public data
    - Request conversion and retention data
  notes: This table preserves the unresolved parts of market sizing rather than forcing a false-precision SAM or SOM.
