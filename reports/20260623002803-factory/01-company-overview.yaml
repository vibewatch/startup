company:
  name: Factory
chapter:
  number: 1
  title: Company Overview
  summary: Factory is a San Francisco private company founded in 2023 that sells enterprise software-development agents called Droids across CLI, IDE, desktop, browser, and partner-integrated workflows. Public evidence supports a fast funding climb from a $5 million seed to a $150 million Series C at a $1.5 billion valuation, but many operating metrics remain company-claimed or undisclosed, so the overview is strongest on identity, capital formation, channel expansion, and disclosed leadership changes rather than audited scale.
sections:
  - id: identity-positioning
    title: Identity, positioning, and business model
    body: Factory presents itself as an enterprise software-development platform rather than a narrow autocomplete product. Its homepage, enterprise page, pricing page, and September 2025 Droids general-access announcement all describe Droids as autonomous agents that can generate code, test, review, document, research, and resolve incidents across the software development lifecycle, while remaining model-agnostic, interface-agnostic, and deployable in SaaS, hybrid, on-premise, or air-gapped modes. Publicly, the company anchors its mission on bringing autonomy to software engineering and sells that mission through a subscription software model with self-serve plans for individual users and custom Teams and Enterprise packages for larger organizations. That positioning matters because Factory is selling workflow orchestration, governance, and deployment flexibility to engineering leaders, not just a code assistant to individual developers. The most stable identity facts in the fetched set are that Factory was founded in 2023, is headquartered in San Francisco, and now pitches a "software factory" product that sits across multiple interfaces and enterprise control surfaces.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
      - CO026
      - CO027
    tableRefs:
      - TO001
    figureRefs:
      - FO002
  - id: founders-leadership-governance
    title: Founders, leadership, and governance baseline
    body: The retrieved source set makes founder identity reasonably clear but leaves governance structure only partially visible. Official June 2026 materials and third-party profiles identify Matan Grinberg and Eno Reyes as founders, with Grinberg clearly acting as co-founder and CEO in public communications. TechCrunch adds the origin story that Grinberg left a UC Berkeley PhD track after Sequoia interest helped catalyze the company’s formation. Public leadership depth expanded materially in June 2026 when Factory hired Marcello Gallo as chief revenue officer after prior scaling roles at Sigma, Moveworks, and MongoDB, which is relevant because it suggests the company is adding a seasoned go-to-market operator after crossing into late-stage enterprise selling. Governance disclosure is thinner. The best-supported board fact in the fetched set is that Khosla’s Keith Rabois joined the board with the Series C, while broader board composition, independent-director presence, and investor control rights remain undisclosed in the materials reviewed. That leaves Factory looking strongly founder-led with real key-person dependence and only partial public governance transparency.
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO043
      - CO046
      - CO047
    tableRefs:
      - TO002
  - id: funding-and-investor-base
    title: Funding history, valuation step-up, and investor map
    body: >-
      Factory’s financing path is unusually steep and is the clearest reason the company has become a serious diligence target.
      Official releases support a $5 million seed in November 2023, a $15 million Series A that valued the business at $120
      million and brought disclosed funding above $20 million, a $50 million Series B at a $300 million valuation in September
      2025, and a $150 million Series C at a $1.5 billion valuation in April 2026. Independent coverage from Business Wire,
      SiliconANGLE, and TechCrunch substantially corroborates the later rounds, while the earliest stages rely more heavily on
      company disclosures and a short Forbes profile. On disclosed amounts alone, Factory has raised about $220 million. The
      investor set is also notable: Sequoia appears from the seed onward; NEA, Nvidia, J.P. Morgan, and Mantis VC joined around
      the Series B; and Khosla, Blackstone, and Insight Partners joined the Series C. Wipro Ventures’ participation adds a
      strategic distribution angle rather than just financial sponsorship. The capital story therefore shows both valuation
      acceleration and a widening mix of venture, corporate, and enterprise-adjacent backers.
    claimRefs:
      - CO016
      - CO017
      - CO018
      - CO019
      - CO020
      - CO021
      - CO022
      - CO044
    tableRefs:
      - TO003
    figureRefs:
      - FO003
  - id: scale-channels-controls
    title: Scale evidence, channels, partnerships, and trust controls
    body: Factory’s public scale evidence is directional but still uneven. The strongest company-claimed traction marker is the April 2026 Series C post saying Droids were used daily by hundreds of thousands of developers and that revenue had doubled month over month for each of the prior six months. Those are powerful statements, but they are not paired with absolute revenue, ARR, customer-count, or headcount disclosures in the fetched set. What is better substantiated is the breadth of channel and product expansion. Droids reached general access in September 2025, Missions added multi-day autonomous execution in February 2025, the Desktop app shipped in April 2026, and Factory Router entered preview in June 2026 with claimed cost savings. Distribution also broadened through Azure Marketplace and the Wipro partnership, while the Palo Alto Networks and Snyk integrations show that Factory is trying to make security and governance part of the core enterprise pitch. Customer case studies from Chainguard and You.com support real usage in complex engineering environments, but they still function as curated proof points rather than audited commercial disclosure.
    claimRefs:
      - CO023
      - CO024
      - CO025
      - CO028
      - CO029
