  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: governance-disclosure-gap
      missingEvidence: Full board roster, independent-director status, observer rights, protective provisions, and major investor governance terms.
      whyItMatters: Governance quality and investor control can materially affect decision speed, founder independence, and downside protection.
      diligencePath: Request the current board deck, cap-table summary, voting agreements, and side-letter schedule from management.
      relatedQuestionRefs:
        - QO006
        - QO027
      relatedTableRefs:
        - TO002
        - TO003
    - type: private-evidence-only
      severity: material
      topic: metrics-gap
      missingEvidence: Absolute ARR, revenue, customer-count, seat-count, retention, and headcount data as of the run date.
      whyItMatters: Without absolute operating metrics, it is hard to judge whether the valuation step-up reflects durable commercial scale or only growth narrative.
      diligencePath: Request the latest board pack, ARR bridge, customer cohort summary, and current headcount by function and geography.
      relatedQuestionRefs:
        - QO016
        - QO017
        - QO027
      relatedTableRefs:
        - TO001
    - type: enumeration-incomplete
      severity: material
      topic: stakeholder-cap-table
      missingEvidence: Ownership percentages, liquidation preferences, secondaries, debt, and any structured capital not disclosed in the public round announcements.
      whyItMatters: The economic hierarchy of the cap table affects both common-equity upside and downside risk in any future financing or exit.
      diligencePath: Obtain the latest capitalization table, major financing documents, and any debt or SAFE schedule.
      relatedQuestionRefs:
        - QO014
        - QO027
      relatedTableRefs:
        - TO003
    - type: missing-source
      severity: minor
      topic: location-footprint
      missingEvidence: A definitive public statement or filing that reconciles headquarters, other offices, and location-level staffing.
      whyItMatters: Location footprint affects hiring leverage, go-to-market reach, and operating-cost assumptions.
      diligencePath: Ask management for current office list, major hiring hubs, and remote-versus-in-office staffing split.
      relatedQuestionRefs:
        - QO017
      relatedTableRefs:
        - TO001
