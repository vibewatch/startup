        blocks:
          - type: paragraph
            body: >-
              Factory 的公开证据指向企业优先的 go-to-market 动作，而不是纯 bottom-up 开发者工具。Azure Marketplace 上架让产品可通过既有 MACC
              承诺采购，应能缩短采购、计费和安全审查周期。Wipro 合作把这一动作延伸到大型系统集成商渠道，覆盖数万名工程师，并转售给银行、医疗、制造、零售和科技客户。2026 年 6 月 CRO
              入职又提供了一个信号：Factory 正在制度化企业销售；Marcello Gallo 此前曾帮助 Sigma 推动 300% ARR 增长，并在 Moveworks 推动 400%
              收入增长。客户案例给出了最接近的销售效率代理指标。Nav 提到功能开发快 2x、上下文切换时间下降 60%；Empower 提到事故响应快 40%、PR 或 Q&A 延迟最多下降 50%；Groq 提到工程循环快
              3x 到 5x。这些结果支撑付费意愿，但公开来源仍未披露 CAC、销售周期长度、实施成本、回本周期或扩张率数据。
