  - id: TV001
    title: 推荐摘要表
    columns:
      - 维度
      - 公开证据解读
      - 含义
    rows:
      - - 推荐
        - 继续研究
        - 保持跟进，但不能只凭公开证据按披露价格承销。
      - - 信心
        - 中
        - 产品和客户证据太多，不至于低信心；经济缺口也太多，不足以高信心。
      - - 风险评级
        - 高
        - 结果取决于未披露的 ARR、毛利、留存和优先权条款。
      - - 估值立场
        - 偏紧
        - $1.5B 标记已经明确，但支撑它的财务分母还没有。
      - - 决策含义
        - 强力跟踪价格和条款
        - 只有拿到私有数据，或入口保护明显改善后，才继续推进。
    notes: 该表是本章的推荐输出；每一行都压缩了下文更完整的分析，而不是引入新证据。
    claimRefs:
      - CV030
