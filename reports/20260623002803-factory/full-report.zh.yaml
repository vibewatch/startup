  - id: TE002
    title: 工作流 / 使用场景表
    columns:
      - 用户任务
      - 当前工作流
      - Factory 方案
      - 可衡量收益 / 承诺
      - 限制
    rows:
      - - 构建或修改功能
        - 工程师手动把 ticket/spec 转成代码、测试和 PR
        - Droid 从 terminal、IDE、browser 或 Slack 规划、编辑、测试，并打开可 review 的输出
        - 一个 prompt 到 PR；Series B 材料声称功能交付快 31x
        - 该主张由公司撰写，未在客户 repo 上独立 benchmark
      - - 运行长期项目或迁移
        - Staff 工程师在数小时或数天内协调子任务、QA 和验证
        - Missions 把工作拆成里程碑、worker session 和 validator pass
        - 通过验证循环实现多小时到多天的自主执行
        - 需要客户证明总成本、监督负担和回滚频率
      - - 保持文档更新
        - 如果没人更新架构页和设置指南，docs 就会腐烂
        - AutoWiki 在每次 push 时生成并刷新架构、模块、API 和约定文档
        - Repo wiki 成为持续更新的构建产物
        - 需要证明大型 / 私有 monorepo 和非 GitHub repo 上的文档质量
      - - 审查 PR 中的 bug 和安全问题
        - 人工 review 慢，覆盖也不稳定
        - Code Review 和 Automated Security Review 在 PR 工作流或本地运行
        - P0-P3 发现、CWE 引用、建议修复和 clean-diff approval flow
        - 需要客户误报 / 漏报数据和升级实践
      - - 合并前验证用户侧行为
        - 测试通过后，UI 或工作流回归仍可能漏进来
        - Automated QA 驱动流程，并把截图、trace 和通过 / 失败结果发到 PR
        - 为每次 push 或按需 CI check 增加类似真人的工作流验证
        - 需要公开数据说明覆盖编写成本和 flake 管理
      - - 衡量采用和 ROI
        - 领导层缺少 token 支出、autonomy 和产出的统一视图
        - Analytics 和 Agent Readiness 暴露用量、生产力、readiness level 和 OTEL exports
        - 让工程领导层更容易看懂内部 AI 投资 case
        - 需要针对管理员界面的公开定价、留存和 benchmark 指引
    notes: 收益混合了公司直接主张和公开工作流设计。凡指标来自公司公告，均列为承诺或声称结果，而非独立验证结果。
