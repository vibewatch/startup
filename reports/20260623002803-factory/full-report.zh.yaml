      - number: '7.3'
        title: 运营、安全与产品可靠性风险
        blocks:
          - type: paragraph
            body: >-
              Factory 特定运营风险来自 Droids 被允许触达的范围。Agent Readiness、Factory Desktop、Missions、code review、BYOK 配置、mixed-model
              routing 和 Custom Droids，都指向围绕持久 context、委托执行和深度进入客户工程系统搭建的产品策略。这个设计可以带来很大生产力增益，但也扩展了失效模式。Google Cloud 2026
              年威胁情报说明把 agentic threat surface 拆成执行什么、由什么指令驱动、连接什么、扩展什么；Factory 产品套件现在覆盖这四类。直接后果是，prompt injection 或
              runtime configuration 失效可能传导到代码变更、工具调用、数据外泄，或长期后台工作中的隐性漂移。


              Factory 没有忽视这个风险；事实上，它自己的产品发布清楚说明管理层把它视为核心问题。Palo Alto Networks 公告明确点名 prompt injection、unauthorized tool
              calls、exposed data flows 和 model misuse。Snyk 合作称，对企业团队来说，没有安全的速度不可持续。自动化安全评审发布说明称，产品会扫描 OWASP Top 10、OWASP
              LLM Top 10、injection、broken auth 和 secrets-in-logs 问题，并进一步说明最深覆盖仍需要 full-repository audit mission。Factory
              的企业 security-review 文档把该姿态扩展到 scheduled CI 和 full-repository audits；GitHub integration security 页面则称，该
              action 在客户 GitHub runners 内运行，使用 transient checkouts、repository-scoped permissions 和 short-lived GitHub
              App tokens。CLI security 文档还宣传 project-directory write limits、command approval、prompt-injection detection 和
              approval-gated web fetching 等内置保护。这些是有意义的缓释项，但也暴露了核心事实：Factory 既是制造自主变更的工具，也是客户用来监管这些变更的工具。


              外部负面证据有限，但有实质意义。一篇 eesel 评测汇总了负面用户反馈，称代码质量弱、认证失效、token
              消耗不透明；这不是决定性指控，但足以阻止尽调假设产品已在所有用例上运营成熟。OWASP、CSET、Google Cloud 和 CACM 的更广品类证据也强化了这一点：当人类评审和权限薄弱时，agentic
              code systems 可能增加漏洞、技术债和隐性执行路径。因此，在尽调能够验证 incident history、auth design、customer approval
              controls、model-routing safeguards，以及其 review 和 security products 的实证 false-positive / false-negative rates
              之前，Factory 的剩余产品风险仍然很高。
