      - 类型
      - 影响
      - 证据
      - 尽调路径
    rows:
      - - 自助到 Teams / Enterprise 打包
        - 扩张驱动因素
        - 如果试点转成按席位计费的企业合同，正向影响高
        - 定价和企业页面增加治理、专用计算和无限席位打包
        - 索取从 Pro / Plus / Max 转向 Teams / Enterprise 的转化漏斗
      - - Azure Marketplace 和 MACC 资格
        - 扩张驱动因素
        - 正向影响高，因为采购、计费和安全审查可压缩进 Azure 预算
        - Factory 称 Azure 采购缩短评估和计费周期；Microsoft marketplace 强调通过 marketplace 可节省时间
        - 核实当前企业 ARR 中有多少比例通过 Azure 成交
      - - Wipro 内部推广加转售
        - 扩张驱动因素和依赖
        - 如果 Wipro 放量，正向影响高；同时也带来合作伙伴集中度风险
        - Wipro 计划向数万名工程师推广，并转售到五个行业
        - 索取收入分成、管线归因和排他条款
      - - 证明集中在五个案例研究账户
        - 集中度风险
        - 高，因为公开量化证据主要由少数标杆客户支撑
        - 只有 Chainguard、Empower、Groq、Nav 和 You.com 提供工作流细节与结果
        - 索取前 10 大客户收入集中度和行业组合
      - - 垂直行业证明偏斜
        - 集中度风险
        - 中，因为公开证据在金融科技、AI 基础设施 / 搜索、安全 / 开源和咨询领域最强
        - 制造、零售和医疗主要出现在 Wipro 转售说法中，而非具名部署
        - 索取每个 Wipro 承诺行业的具名客户背书
      - - 只有客户标识的客户背书
        - 集中度 / 可见性风险
        - 中，因为许多标杆名称可能只是小试点或窄团队
        - Morgan Stanley、EY、Palo Alto Networks、Nvidia、Adobe、Adyen、MongoDB、Bayer、Zapier 和 Clari 缺少公开范围细节
        - 索取每个标杆账户的席位数、覆盖代码仓库和部署阶段
    notes: 影响等级是基于公开证据组合的分析判断。该表把上行驱动因素与披露相关的集中度风险区分开。
