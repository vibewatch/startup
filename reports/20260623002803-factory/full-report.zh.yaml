  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前价格与融资背景
        blocks:
          - type: paragraph
            body: >-
              披露的价格锚很清楚，尽管承销基础并不清楚。Factory 公开宣布过 $5 million seed、$15 million Series A（估值 $120 million）、$50 million
              Series B（估值 $300 million），以及 $150 million Series C（估值 $1.5 billion），意味着成立以来披露融资至少 $220 million。因此，2026 年 4
              月这轮在 Series B 后仅约七个月就大幅重置了价格预期。如果企业采用、产品宽度和渠道杠杆正在快速复利，这可以合理；但同一公开记录仍缺少让投资人测试价格的核心变量：ARR、绝对收入、gross
              margin、burn、runway、contract duration、NRR、customer concentration 和 preference stack。关键估值结论是：Factory
              很容易按叙事定价，却很难按基本面定价。这一轮说明市场付了什么价格；还没有说明公司赚什么、后期投资人拿到多少下行保护。
