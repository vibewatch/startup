      - number: '2.2'
        title: TAM、企业加权视角与 Factory 相关 SAM
        blocks:
          - type: paragraph
            body: >-
              公开市场数据方向上支持，但并不干净。Mordor、Grand View 和 MarketsandMarkets 都描述了一个数十亿美元规模、年增速约 24% 到 27% 的 AI code-tools
              类别，但它们的基线、终止年份和类别定义并不一致。最宽的视角只是全球 AI code-tools 市场，该市场已经以数十亿美元计量并快速扩张。更相关的第二个视角是企业加权：Mordor 称大型企业在 2025
              年贡献类别收入的 59.47%，把该比例套到其 2026 年市场估计，可得到进一步收窄前约 $5.6 billion 的企业重心视角。Factory 的实际 SAM
              应更小，因为公司并不面向所有代码工具买家；它面向的是想要受治理自主工作流、多模型路由，以及可在复杂环境中安全部署的组织。公开证据清楚显示该类别足够大，值得关注；但公开证据尚未为企业治理型编码代理平台隔离出一个干净、独立的
              SAM。
