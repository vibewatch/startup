      - number: '5.5'
        title: 信任、安全、安全性、隐私与合规控制
        blocks:
          - type: paragraph
            body: >-
              Factory 的信任叙事混合了具体控制声明和仍然偏薄的外部验证。最清晰的控制来自安全、定价、企业和文档页面：不把客户代码用作训练数据；在自有 VPC 中进行 sandboxed single-tenant
              hosting；静态 AES-256、传输 TLS 1.2+；审计日志可导出到 SIEM；严格权限执行；ZDR；SSO/SAML/SCIM；模型访问控制和 deny lists；加密密钥、session
              留存、数据驻留和网络策略控制；以及组织级模型策略。Signals 又加入一个隐私设计声明：用户对话被抽象为元数据和模式类别，而不是暴露给人工分析师。Missions
              还声称每条命令都被风险分级，任何内容到达模型前都会扫描 secrets，hooks 可注入客户安全控制，且所有动作都通过 OpenTelemetry 记录。

              安全控制已产品化，而不只是策略声明。标准代码审查采用只看 bug 的 rubric，并设置 P0-P3 严重性；Automated Security Review 增加基于 STRIDE 的
              findings、CWE references、responsible-disclosure examples，以及通过 Missions 做深度仓库审计。Automated QA 加入截图、terminal
              snapshots 和 API traces，用来捕捉 UI 和工作流破损。合规定位可信，但需要尽调纪律：Factory 明确宣布采用 SOC 2 Type I 和 ISO 42001，而 Missions
              发布称已维持 SOC 2 Type II 和 ISO 27001 认证。后续说法可能为真，但留存公开证据薄于声明广度。OWASP 和 Google 的外部安全背景强化了这些控制为何重要——代理式编码工具继承
              prompt-injection、文件信任和自主性风险——但公开来源仍未提供第三方渗透测试报告、事故日志或完整安全架构包。
            claimRefs:
