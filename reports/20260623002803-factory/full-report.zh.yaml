      - number: '8.5'
        title: 建议、风险与最后尽调问题
        blocks:
          - type: paragraph
            body: >-
              仅基于公开信息，可支持的建议是 research-more，而不是 buy。Factory 显然在建设一个有真实需求的品类；相比许多更早期 AI tooling
              公司，它也有更多证据支撑的客户、合作伙伴和产品宽度。这让故事仍可投资，也解释了为什么公司应留在跟踪名单，而不是归入 avoid bucket。但价格敏感答案更严格：公开记录支持 medium
              confidence、high risk 和偏高估值判断，因为缺失指标不是装饰。ARR、gross margin、net retention、concentration 和 cap-table
              preferences 决定这究竟是 premium software platform，还是靠动能融资、基础设施负担重的 growth story。公司也更像 scale-up ready，而不是 exit
              ready。GTM 野心、合作伙伴触达和 workflow breadth 可见，但 IPO-style disclosure quality 不可见。下一步尽调因此应少听更多故事，多看准确的 private
              datasets；这些数据要么验证当前标记，要么打破它。
