        title: 收入模式与公开定价
        blocks:
          - type: paragraph
            body: >-
              Factory 可见收入模式混合了自助订阅和定制企业合同。公开定价页披露了三个有标价的个人层级：每用户每月 $20、$100 和 $200；随后把 Teams 和 Enterprise
              转入谈判式包装，包含定制用量上限、SSO、治理控制、专用计算、审计日志、本地部署选项和 SLA 支持。这个包装设计至少隐含三层变现：席位收入、用量挂钩容量，以及更高毛利或更高 ACV
              的企业治理功能。同时，收入质量问题仍未解决，因为留存下来的公开来源没有披露实际企业定价、折扣、合同期限、续约机制，或收入主要确认为软件订阅、托管基础设施，还是服务含量高的部署收入。Desktop
              使用量纳入现有订阅，说明 Factory 正在优化账户内的席位和工作流扩张；但公开证据仍没有证明这种产品广度如何转化为确认收入或毛利。
