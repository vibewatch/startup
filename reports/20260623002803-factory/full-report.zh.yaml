              公开客户记录里，持久性最弱。保留下来的来源都没有披露付费客户数、席位留存、净收入留存、总收入留存、流失率、合同期限、续约率或满意度分数。唯一的留存代理指标来自行为。Chainguard 称会连续数周运行多个
