  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与采购中心
        blocks:
          - type: paragraph
            body: >-
              Factory 的公开客户群最适合被理解为购买团队级自主性的企业软件组织，而不是购买个人编码辅助的用户。定价和企业包装显示，一旦部署进入 Teams 或 Enterprise，付款权就会从 Pro、Plus 和
              Max 上的个人开发者，迁移到集中化的工程、平台或 CTO 预算。日常用户仍是工程师，但在受监管账户中，采购委员会会扩大：Factory
              的金融服务和企业材料反复强调安全、可审计性、基于角色的访问控制、模型治理和部署灵活性，这意味着安全、合规、基础设施和采购利益相关方会主动参与。垂直目标最清晰的是 SaaS 和金融服务，随后通过 Wipro
              扩展到医疗、制造、零售和科技。仅 logo 的客户群还通过 Nvidia、Adyen、MongoDB、Bayer、Zapier 和 Clari 触达半导体与 AI
              基础设施、数字支付、开发者数据库、生命科学、工作流自动化和收入软件。地域只披露了一部分，但具名客户和伙伴包括 EY、Morgan Stanley、Palo Alto Networks、Wipro，以及
              Empower 的分布式工程团队，说明该平台被卖进跨国软件环境，而不是单一国内细分市场。
