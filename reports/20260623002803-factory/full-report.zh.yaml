  - id: TV005
    title: 破题和否决触发点表
    columns:
      - 触发点
      - 阈值 / 事件
      - 对 thesis 的传导
      - 行动含义
    rows:
      - - ARR 规模令人失望
        - 私有尽调显示 ARR 或 TTM 收入远低于 $1.5B 融资通常暗示的水平
        - 打破高溢价软件承销案例。
        - 不按披露价格投资；只有入口明显降低才重新审视。
      - - 毛利带有重基础设施属性
        - 路由和定价调整后，利润率仍被压缩
        - 叙事从软件杠杆转向服务或算力负担。
        - 要求更低估值或更强结构性保护。
      - - 留存偏弱
        - NRR 或 logo 留存支撑不了 land-and-expand 主张
        - 削弱工作流广度创造持久扩张的 thesis。
        - 除非价格大幅重置，否则转为回避。
      - - 优先权堆栈惩罚性强
        - 后期优先权、保证回报或大额老股占据 cap table 主导
        - 即使运营尚可，也可能摧毁普通股上行。
        - 没有条款重组或异常强的增长证明，就不要推进。
      - - 渠道证据无法货币化
        - Wipro 部署未转化为持久的付费客户扩张
        - 削弱相信 GTM 能高效扩张的主要理由之一。
        - 下调牛市情景，并把当前价格视为激进。
    notes: 这些是当前叙事的可监测断点，应在管理层访谈和 data room 尽调中直接测试。
    claimRefs:
      - CV014
      - CV016
      - CV030
      - CV036
      - CV040
      - CV041
      - CV042
      - CV044
      - CV045
      - CV048
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR 和收入桥
        - 最新 ARR、TTM 收入、bookings 和 cohort 增长桥
        - 没有它，就无法把 Series C 价格转化为可辩护的软件倍数。
        - 财务团队 / 董事会材料和月度 KPI 包。
      - - 毛利和模型成本 waterfall
        - COGS 按模型支出、云算力、支持和客户工程拆分
        - 决定 Factory 能否像软件一样扩张，而不是像托管服务一样扩张。
        - 财务 + 工程运营 / 成本分摊审查。
      - - 留存和集中度
        - NRR、logo 流失和前 10 大客户收入敞口
        - 测试客户证明是否足够持久、足够分散，能支撑后期估值。
        - 收入运营 / cohort 材料和客户集中度明细。
      - - Cap table 和优先权堆栈
        - 清算优先权、期权池、老股、SAFEs 和 pro forma 稀释
        - 下行保护和所有权经济性会实质改变投资结果。
        - 法务 + 财务 / cap table 和融资文件。
      - - Wipro 和渠道经济性
        - 商业条款、收入分成、实施归属和付费客户转化数据
        - 验证 marquee 渠道故事产出有吸引力的经济性，还是只有分发戏剧性。
        - 合作伙伴 + 销售 / 合同审查和 pipeline 分析。
      - - 基准到续约的转化
        - 证明基准领先和生产力主张推动扩张或续约的证据
        - 区分营销证明和可货币化的产品优势。
        - 产品 + CS / 续约叙事、win-loss 和案例研究备份。
    notes: 这些是把纯公开叙事转化为可投资承销案例所需的最低尽调问题。
    claimRefs:
