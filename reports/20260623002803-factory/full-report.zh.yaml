      - number: '8.2'
        title: Thesis 与反面 Thesis
        blocks:
          - type: paragraph
            body: >-
              有证据支撑的 thesis 始于真实企业野心，而不是玩具级开发者定位。Factory 现在横跨 self-serve 和 enterprise packaging
              销售，声称拥有数十万日活开发者，点名蓝筹客户，并有 Wipro 合作，可能把产品放到数万名工程师和大型行业客户面前。产品故事也比 autocomplete 更宽：benchmark
              材料、model-routing 主张、analytics、BYOK 支持和 custom droids 合在一起，指向一个为企业工作流控制搭建的平台。反面 thesis
              是，许多最强正面证据仍来自供应商自己。Benchmark 领先、连续六个月收入翻倍，以及大多数结果主张，都来自 Factory
              自身或经过筛选的客户故事，而不是经审计财务。外部批评还指出成本不透明、可靠性担忧、赛道拥挤，以及 incumbents 或资本更厚的 peers 可能更快压缩差异化，快过 Factory
