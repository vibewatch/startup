        title: 创始人、领导层与治理基线
        blocks:
          - type: paragraph
            body: >-
              已检索资料能较清楚地确认创始人身份，但治理结构只露出一部分。2026 年 6 月官方材料和第三方资料都确认 Matan Grinberg 与 Eno Reyes 为创始人，Grinberg
              在公开沟通中明确以联合创始人兼 CEO 身份出现。TechCrunch 补充了起源故事：Sequoia 的兴趣推动公司成形后，Grinberg 离开 UC Berkeley 博士轨道。2026 年 6
              月，Factory 任命 Marcello Gallo 为首席营收官，公开领导层厚度明显增加；他此前在 Sigma、Moveworks 和 MongoDB
              担任过扩张相关角色。这个信号重要，因为它说明公司进入后期企业销售后，正在补入有经验的 GTM 操盘手。治理披露更薄。抓取资料中支撑最强的董事会事实是：Khosla 的 Keith Rabois 随 Series
              C 加入董事会；更广泛的董事会构成、独立董事是否存在以及投资人控制权仍未在所审材料中披露。因此，Factory 看起来强烈由创始人驱动，存在真实关键人物依赖，公开治理透明度也只有一部分。
