  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象 / 路径
      - 指标锚点
      - 估值 / 状态
      - 关联度
      - 局限
    rows:
      - - Factory Series A (2025)
        - $15M 融资，估值 $120M
        - 已披露私有轮 $120M
        - 给出公司第一个可见的机构定价点。
        - 阶段太早，不能单独锚定当前价格。
      - - Factory Series B (2025)
        - $50M 融资，估值 $300M
        - 已披露私有轮 $300M
        - 可作为 Series C 前最近的标记。
        - 仍缺少经验证的收入或毛利披露。
      - - Factory Series C (2026)
        - $150M 融资，估值 $1.5B
        - 已披露私有轮 $1.5B
        - 当前市场出清参考价。
        - 只能说明投资者付了什么价，不能说明倍数是否合理。
      - - GitHub Copilot 路径
        - 仓库原生分发和既有工作流控制
        - 保留来源包未披露独立估值
        - 代表企业编码 agents 的分发天花板。
        - 被打包在 Microsoft 内部，因此这条路径偏战略，不是直接可比。
      - - Cursor 路径
        - 自主性叙事，加上公开定价和 Fortune 500 采用主张
        - 审阅来源包未保留估值
        - 显示买家愿意为 UX 和定价清晰的 agentic 开发者工具付费。
        - 这里同样没有保留经验证的财务分母。
      - - Devin / Windsurf 路径
        - Agent-native workstation，内置 IDE 监督、共享 Spaces，并声称拥有 1M+ 用户和 4,000+ 企业客户
        - 审阅来源包未保留估值
        - 可用于自主性和工作流比较。
        - 主张由厂商发布，不足以推导倍数。
      - - Tabnine 路径
        - 私有部署选项、治理控制和 agentic 平台定价
        - 审阅来源包未保留估值
        - 对受监管买家愿意为治理和部署控制付费这一点有参考价值。
        - Agentic 广度低于 Factory，因此这个 peer 只能指方向，不能一一对应。
    notes: 这里只是部分可比集合；审阅材料更适合支撑里程碑和定位比较，而不是精确 EV/revenue 计算。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the financing milestones and competitor reference routes that are visible in the reviewed 2025-2026
        public evidence pack, but they do not claim to enumerate every coding-agent peer or every valuation datapoint.
