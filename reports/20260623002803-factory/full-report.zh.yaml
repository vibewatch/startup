  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Factory 面临的不是单一生死风险，而是一套相互叠加的风险系统。严重程度最高的是企业客户环境里的安全与治理失效：Factory 自身材料、Palo Alto Networks 集成说明、Snyk
              合作公告、OWASP 2025 年 agentic security 指引、Google Cloud 2026 年威胁情报文章，以及 CACM 2026 年报道，都指向同一点：agentic coding
              系统把攻击面从生成代码扩展到 prompts、tool calls、本地文件、配置和后台执行。对 Factory 来说，这比轻量 autocomplete 工具更关键，因为 Factory 销售的是常驻
              Droids、后台 missions、桌面访问、本地命令执行，以及跨 CLI、IDE、browser、chat 和客户系统的多界面编排。


              第二层风险由依赖驱动。Factory 的产品差异化来自模型和界面灵活性，但同一设计也增加了对 Anthropic、OpenAI、Google、通用 API providers、客户自管 API keys
              和企业集成的依赖，而这些 Factory 无法完全控制。供应商政策变化、宕机、质量回落或涨价，都可能直接传导到客户成本、支持负担和信任。第三层是财务和商业风险：Series C 材料和 TechCrunch 支持
              $150 million 融资、$1.5 billion 估值，但公开来源仍未披露绝对收入、ARR、burn、续约、客户集中度或 margin 持久性。投资人只能用经过筛选的 proof
              points，去承销未来治理、留存和经济性。


              最终剩余风险评级是高，而非危急，因为公司有可信缓释项。Factory 在安全敏感环境里有真实客户引用，披露了安全架构，具备 SOC 2 Type I、ISO 42001 定位、代码评审和安全评审产品、Azure
              采购杠杆，以及 Wipro 分销渠道。这些缓释项降低了 vapor risk，但它们本身无法回答 Factory 能否在规模化时维持安全自主执行，同时满足收紧的监管预期，并支撑后期估值。本章其余部分将
              Factory 特定证据与品类层面风险证据分开，再把两者转化为可监控触发点、尽调问题和 thesis-break 标准。
