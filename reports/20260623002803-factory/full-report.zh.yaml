      - number: '7.4'
        title: 合作伙伴、客户与财务依赖风险
        blocks:
          - type: paragraph
            body: >-
              Factory 最好的商业故事和最尖锐的风险集中点，是同一件事：它深度嵌入外部平台、模型供应商和企业渠道。BYOK、Gemini、OpenAI / Anthropic 和 mixed-model
              文档显示，Factory 的价值主张依赖连接多个外部 model APIs，并在它们之间管理任务路由。TechCrunch 指出，公司声称的差异化之一是模型切换灵活性，但也指出 Cursor
              等竞争对手同样不锁定单一模型。这意味着护城河在运营执行和企业集成质量，而不是硬性的供应商独占。如果供应商经济性恶化、输出质量漂移，或主要 API 改变行为，Factory 就必须在客户面前吸收支持和产品负担。


              合作伙伴集中度也真实存在。Wipro 合作有强战略价值，因为它设想覆盖数万名工程师的 rollout，并向多个行业转售；但规模也是双刃剑：如果 rollout 延迟或效果弱，就会削弱 Factory
              最强的规模叙事之一。Azure Marketplace 采购同样通过 MACC 降低摩擦，却也强化了对 hyperscaler 生态的渠道依赖。安全可信度也借重 Palo Alto Networks 和 Snyk
              的合作集成。如果这些集成在生产中跑不顺，或客户认为原生控制不足，Factory 面向受监管企业的 pitch 就会失去力道。


              财务上，公开记录相对于估值仍然薄。Factory 的 Series C 文章和 TechCrunch 支持 $150 million 融资、$1.5 billion
              估值，并提到快速增长，但审阅范围内仍没有公开绝对收入、ARR、gross margin、renewal cohort、customer concentration、burn 或 runway
              披露。风险不只是「startup burn」，而是估值脆弱性：如果后续公开或 NDA 尽调显示留存薄、供应商 pass-through 成本高，或企业支持昂贵，估值压缩速度可能远快于 topline
              叙事暗示。因此，投资人应把合作伙伴杠杆和客户 logo 视为销售触达证据，而不是经济性已经去风险的证明。
