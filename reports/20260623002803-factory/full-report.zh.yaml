      - number: '5.2'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              Factory 的公开架构围绕模型独立、工作流拆解和上下文管理。官网把技术栈框在模型独立和主权部署之上；Router 与 BYOK 文档展示了该原则如何变成产品行为：Factory 可调用供应商原生模型、通用
              chat-completions 端点、开源端点和本地托管模型，再让管理员或用户用模型选择器在它们之间切换。混合模型配置把架构再推进一层，把 specification-mode 规划与
              execution-mode 编码分开；这意味着 Factory 把规划和实现视为不同工作负载，而非单一整体 session。

              Missions 给出了最清晰的架构披露。Factory 描述了一个 orchestrator：它界定工作范围、写验证契约、把大型项目拆成里程碑和功能、生成新的 worker
              sessions，并在进度继续前插入独立 validator。Missions 架构文章把设计理由说得很明白：窄 worker scope 降低上下文污染，外置共享状态保持连续性，独立 validator
              抵消自我确认偏差。Router 通过按 session 选择模型、跨供应商重路由，并为企业用户预留专用吞吐，补足这层编排。AutoWiki、Signals 和 Analytics 则补齐运营模型：AutoWiki
              把代码仓库结构转成持续更新的文档，Signals 把用户 session 摩擦抽象成保护隐私的产品遥测，Analytics 把
              token、工具、采用和输出数据转成管理员报告层。合在一起，公开证据支持的是一个代理驱动工程的多组件操作系统，而不是围绕某个基础模型的 wrapper。
