companyProfile:
  summary: >-
    Factory 是一家位于旧金山的私营公司，成立于 2023 年，销售名为 Droids、且不绑定模型的自主软件开发代理。公开资料显示，该平台覆盖 CLI、IDE、桌面端、浏览器、Slack
    和合作伙伴工作流；其企业包装重点不是单纯自动补全，而是治理、集成和部署灵活性。公司从 2023 年 $5 million 种子轮，跃升到 2026 年 4 月估值 $1.5 billion 的 $150 million Series
    C；公开记录还给出了金融服务、安全、金融科技、基础设施和全球系统集成领域的具名客户与伙伴验证。核心尽调约束在财务披露质量：所审材料没有披露 ARR、毛利率、留存或股权条款，因此可投资性判断更依赖私下尽调，而不是公开叙事。
