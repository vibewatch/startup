  - id: TV003
    title: 牛市 / 基准 / 熊市场景表
    columns:
      - 场景
      - 核心假设
      - 可支撑投后区间（USD bn）
      - 概率信号
      - 主要失败模式
    rows:
      - - 牛市
        - Series C 增长主张转化为大型企业 ARR，续约强劲，Router 式成本节省改善毛利，Wipro 转化为规模化付费部署。
        - 1.8-2.4
        - 需要私有尽调确认增长和毛利真实存在，而不只是漏斗顶端的热度。
        - 如果 ARR 或毛利弱于暗示，溢价会迅速消失。
      - - 基准
        - 采用是真实的，但增长回归常态，企业销售仍然昂贵，经济性改善慢于 headline 动能暗示。
        - 0.9-1.4
        - 最符合公开记录：产品和 GTM 证据可见，但单位经济性不可见。
        - 按上一轮或更高价格买入，安全边际有限。
      - - 熊市
        - 收入低于预期或集中度更高，算力和服务负担居高不下，后期优先权或续约转弱放大下行。
        - 0.4-0.8
        - 只要快速上调估值的一轮融资没有同步披露 ARR、NRR 和 cap table 条款，就有可信度。
        - 堆叠的优先权结构可能让一家运营尚可的公司也变成糟糕的股权入口。
    notes: 这些是锚定公开里程碑和缺失数据惩罚的分析性承销区间，不是精确交易倍数。
