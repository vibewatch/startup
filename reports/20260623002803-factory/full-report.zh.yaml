  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层级 / 组件
      - 角色
      - 公开依赖
      - 风险
    rows:
      - - 界面入口
        - Terminal、IDE、browser、Slack、Jira、desktop 和 headless automation 入口
        - 围绕 agent core 的客户端集成和 UI shell
        - 界面范围越广，权限和支持复杂度越高
      - - Droid 执行层
        - Agent 负责规划、搜索、编辑、测试、review 和报告
        - 工具 runtime、repo context 和工作流 installer
        - 质量取决于工具可靠性和 context 组装
      - - Missions 编排层
        - 用共享状态把大型工作拆成 milestones、workers 和 validators
        - 任务拆解、验证契约和后台执行
        - 协调开销和长周期正确性仍是活跃设计风险
      - - Router / 模型路由层
        - 按 session 选择模型 / provider，并在退化时重新路由
        - Provider API、容量来源、企业路由指引
        - 分类器逻辑不透明，主张的外部验证有限
      - - 知识 / telemetry 层
        - AutoWiki、Signals、Analytics、memory 和 agent-readiness scoring 保留 context 并衡量结果
        - Repo analysis、embedding/LLM judges、OTEL、Signals 用 BigQuery/OpenAI batch API
        - 隐私取决于抽象保证和数据治理落地
      - - 部署 / 控制平面
        - SaaS、hybrid、on-prem 和 air-gapped 交付，带 policy controls
        - 客户网络环境、计算分配、密钥和管理员策略
        - 主权要求上升时，实施工作和安全 review 负担可能随之增加
