      - number: '5.4'
        title: 差异化、Know-How 与技术成熟度
        blocks:
          - type: paragraph
            body: >-
              Factory 最有防御性的公开差异化在架构层，而不是纯模型层。公司反复主张，获胜的企业编码平台会横跨任意模型、任意界面和 SDLC 多阶段；公开产品集与这一主张一致。Router、BYOK、mixed
              models、Missions、custom droids、AutoWiki 以及 review/QA/security 工作流，都指向一个编排论点：护城河不是一个 chat
              UX，而是一套能拆解工作、选择模型、保存上下文、验证输出，并把代理嵌入企业交付循环的系统。TechCrunch、SiliconANGLE、eesel 和 Ryan Walker 的独立报道大体确认，市场把
              Factory 理解为企业代理平台，而不是消费者 copilot 克隆。

              第二层差异化来自 Factory 披露的 know-how。Terminal-Bench 文章认为，代理设计与模型选择同样重要，并描述了分层 prompting、针对模型的工具脚手架、fast-fail
              超时、规划工具、后台执行和环境 bootstrapping。2024 年技术报告还加入 HyperCode、ByteRank、multi-model sampling 和 DroidShield
              等具名内部系统。Factory 还发布围绕代码审查经济性、开放评估方法和公开基准页面的 benchmark
              工作，这有助于支撑「公司把评估当作产品能力，而不只是营销」这一说法。但公开成熟度并不均衡。许多性能、客户结果和安全声明仍由公司自写；Router 可靠性、Desktop
              执行质量或广泛企业生产成功的独立证明仍然稀少。因此，Factory 看起来技术上很成熟，并且对编排设计的阐述异常明确，但距离完全由独立方验证的产品质量记录仍有距离。
