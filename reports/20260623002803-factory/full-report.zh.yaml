            body: >-
              Factory 的融资路径异常陡峭，也是它成为严肃尽调标的的最清晰原因。官方发布支持以下事实：2023 年 11 月 $5 million 种子轮；估值 $120 million、使披露融资超过 $20
              million 的 $15 million Series A；2025 年 9 月估值 $300 million 的 $50 million Series B；以及 2026 年 4 月估值 $1.5
              billion 的 $150 million Series C。Business Wire、SiliconANGLE 和 TechCrunch 的独立报道大体佐证了后续轮次；最早阶段则更依赖公司披露和
              Forbes 的短篇资料。仅按披露金额，Factory 已融资约 $220 million。投资人阵容同样值得注意：Sequoia 从种子轮开始出现；NEA、Nvidia、J.P. Morgan 和 Mantis
              VC 在 Series B 前后加入；Khosla、Blackstone 和 Insight Partners 则加入 Series C。Wipro Ventures
              的参与带来战略分销角度，而不只是财务背书。因此，这条资本故事同时显示了估值加速，以及风险资本、企业资本和贴近企业客户投资人的组合扩大。
