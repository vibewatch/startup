              后七个月内以大幅更高估值融资，并投资于应能随时间提升成本效率的工具。但核心阻碍很实质。绝对收入、ARR、实际定价、毛利率、CAC、客户集中度、留存、烧钱和跑道，都不在公开记录中。外部批评也提示 token
