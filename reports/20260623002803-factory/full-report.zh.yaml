      - number: '8.4'
        title: Bull、Base、Bear 与进入纪律
        blocks:
          - type: paragraph
            body: >-
              由于没有公开来源披露 Factory 的 revenue base 或 cap-table terms，下方 scenario bands 应被视为纪律化承销区间，而不是市场出清真相。Bull case 假设
              Series C 动能背后有真实企业 ARR、强续约行为、模型成本效率改善，以及 Wipro 规模分销变现；在这条路径下，高于上一轮的估值可以成立。Base case 假设 product-market
              proof 真实，但没有 headline narrative 暗示得那么爆发，增长会在经济性完全可见前正常化；这会指向接近或略低于当前价格的区间。Bear case 假设 token-heavy
              delivery、续约质量弱、客户集中，或堆叠的 late-stage preferences 让当前估值过于乐观。下行可能很重，因为最新估值从 $300 million 跳到 $1.5 billion
              的速度太快。因此，进入纪律比公司质量本身更重要：缺少 private ARR、gross margin、NRR 和 preference data 时，公开记录不支持仅凭叙事动能就穿透上一轮价格付款。
