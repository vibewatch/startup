        - 确认种子轮是否包含 SAFE，或仅为定价股权
      - - Series A 融资
        - 2025 年 3 月以 $120M 估值融资 $15M
        - 标志首次披露的估值跃升
        - 释放早期产品市场兴趣和团队建设资本的信号
        - 提供资金用途与当前产品版图的桥接
      - - Series B 融资
        - 2025 年 9 月以 $300M 估值融资 $50M
        - Droids 推出并扩张前的重要增长资本
        - 表明投资人在 Series C 前为产品、招聘和采用爬坡提供资金
        - 提供董事会批准的预算和 Series B 后招聘计划
      - - Series C 融资
        - 2026 年 4 月以 $1.5B 估值融资 $150M
        - 当前主要资产负债表事件
        - 支撑近期经营能力，但未披露 runway
        - 提供交割时现金余额和契约 / 优先权摘要
      - - Series C 资金用途
        - 研究、产品和全球 go-to-market
        - 显示这是增长投入，而不只是资产负债表防守
        - 扩大销售和基础设施时，烧钱率可能仍会较高
        - 按职能提供 18-24 个月预算分配
      - - 现金 / 烧钱率 / runway / 债务
        - null
        - 资本充足性的关键检验
        - 公开融资新闻无法转换成 runway 或稀释风险
        - 提供在手现金、月度烧钱率、债务时间表和最低现金阈值
    notes: 公开融资证据很强，但留存来源没有披露资金库细节、杠杆或 runway。因此，资本充足性判断来自推断，而非资产负债表。
