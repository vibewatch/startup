    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Factory 把自己定位成企业软件开发平台，而不是狭义的自动补全产品。其官网、企业页、定价页，以及 2025 年 9 月 Droids 全面开放公告，都把 Droids
              描述为自主代理：可在软件开发生命周期中生成代码、测试、审查、写文档、调研并处理事故；同时保持模型无关、界面无关，并可用
              SaaS、混合、本地或气隙模式部署。公开层面，公司把使命锚定在把自主性带入软件工程，并用订阅软件模式销售该使命：个人用户可选自助计划，大型组织则采用定制 Teams 和 Enterprise
              套餐。这个定位很关键，因为 Factory 卖给工程领导者的是工作流编排、治理和部署灵活性，不只是卖给单个开发者的代码助手。抓取资料中最稳定的身份事实是：Factory 成立于 2023
              年，总部在旧金山，如今推销的是一个横跨多个界面和企业控制面的「software factory」产品。
