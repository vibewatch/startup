        - 多模型选择和可移植性已成为同业常见主张
        - 高
        - 可移植性已不足以单独支撑估值防线
        - 要求提供 Router 在生产中降低支出或延迟的硬证据
      - - 企业信任姿态
        - GitHub、Cursor 与 Tabnine 在已审阅材料中都给出有意义的治理证据
        - 中高
        - Factory 必须靠执行质量赢下受监管交易，而不能只靠信任主张
        - 要求提供受监管客户中的竞争胜单案例
      - - 分销合作伙伴
        - GitHub 控制在位分发，而 Factory 仍依赖 Wipro 等企业渠道
        - 高
        - 渠道杠杆有助于触达，但可能稀释自下而上的产品拉力
        - 询问销售管线中由合作伙伴带来、直接销售和自助服务分别占多少
      - - 安全附加模块
        - Snyk 等相邻厂商可接入多种编码栈，并不限于 Factory
        - 中
        - 安全打包能力可被其他地方的合作伙伴关系追平
        - 要求提供安全模块的附加率和续约证据
      - - 定价不透明
        - 相比 Factory 或 Devin/Windsurf，Cursor、GitHub 和 Tabnine 披露了更多标价信息
        - 中
        - 即使产品很强，支出不透明也会拖慢评估
        - 要求实际客户提供使用曲线、超额费用和折扣表
    notes: 该清单聚焦有证据支撑、会威胁差异化、分销或信任的因素，而非猜测未来新进入者。
