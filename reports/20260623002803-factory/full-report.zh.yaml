      - number: '5.3'
        title: 部署、集成、可靠性、支持与路线图
        blocks:
          - type: paragraph
            body: >-
              在企业编码代理厂商中，Factory 的部署叙事异常宽。官网和企业材料宣传 SaaS、混合、本地和完全气隙选项。定价和企业页面补充了专用计算、分区推理池、本地部署、加密密钥和数据驻留控制、session
              留存控制，以及网络策略。Desktop 把交付从纯云端委托扩展到本地电脑使用：Droids 可操作 VS Code、浏览器标签、终端、文档和其他桌面应用。GA 发布和 Droids
              产品页也强化了界面广度——终端、IDE、浏览器、Slack、Jira、CLI 自动化，以及本地或远程后台代理——因此 Factory 既可以作为终端用户工具落地，也可以作为平台团队自动化基础设施落地。

              集成深度可见，但只有部分被记录。Factory 公开声称原生支持 GitHub/GitLab、Jira、Slack、PagerDuty、GitHub wiki、OTEL export、SIEM export
              和基于 MCP 的 custom context，并提供 code review、QA 和 wiki refresh 的 workflow installers。可靠性声明最强的是
              Router：它称可在供应商路径之间 fail over，并实现 99.9%+ 请求可靠性；另有面向企业工作负载的专用吞吐。支持声明也很明确：专属入职、专属客户经理和客户工程师、24/7
              assistance，以及 SLA-backed 优先支持。路线图方向可从发布节奏和 Series C 公告读出：GA 把 Droids 推广到整个
              SDLC；Desktop、Missions、Router、Signals、Analytics、Automated QA 和 Automated Security Review 扩大了自主性表面；Series C
              称下一阶段将聚焦路由、成本控制、always-on agents、治理，以及规模化衡量 readiness。仍缺失的是关于 uptime 历史、事故频率、企业实施时间，或完整 connector/API
              catalog 的公开证据。
