    sections:
      - number: '5.1'
        title: 按客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Factory 把产品定义为面向企业工程团队的「software factory」，而不是狭义自动补全或 IDE copilot。在 Factory
              描述的客户工作流里，工程师、技术负责人或平台团队成员从工单、prompt、规格、pull request、事故或文档需求出发；在终端、IDE、浏览器、Slack、Jira 或桌面 app 中把工作交给
              Droid；并期待系统能规划、搜索、编辑、测试、审查、写文档，最后交回可上生产的输出。这个运营模型横跨日常编码、迁移、事故响应、代码审查、wiki 生成、QA 和安全审查，因此 Factory
              反复营销的是软件开发生命周期的「每个阶段」，而不是某个单一编码瞬间。

              可见产品地图也不止一个代理。自助计划展示 Droids、后台代理、Desktop、CLI、SDK、用量追踪和 agent-readiness dashboard。产品页和发布文章还加入
              Missions，用于长周期编排；Router，用于自动模型选择；AutoWiki，用于持续刷新的代码库文档；Analytics，用于管理员遥测；Automated QA，用截图和 trace
              测试用户流程；Automated Security Review，用于 PR 扫描；以及面向 GitHub 和 GitLab 的代码审查工作流。Teams 和 Enterprise
              包装再把这组模块包进治理、入职、定制用量、计算分配和支持。按尽调口径，Factory 最应被理解为代理式 SDLC 平台；它可变现的单元是工作流、控制面和由基础设施支撑的自主性，而不只是聊天 session。
