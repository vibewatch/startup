  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: compact
    summary: 仅凭公开信息，估值区间仍然很宽，因为已知价格点远比已知经营数据精确。
    approximationNotes: 区间以情景逻辑推导，单位为投后估值十亿美元，不来自经审计收入倍数。
    data:
      items:
        - label: 悲观情景投后估值区间（USD bn）
          low: 0.4
          high: 0.8
        - label: 基准情景投后估值区间（USD bn）
          low: 0.9
          high: 1.4
        - label: 乐观情景投后估值区间（USD bn）
          low: 1.8
          high: 2.4
    claimRefs:
      - CV031
      - CV036
      - CV039
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Factory 在品类顺风和企业级野心上得分较高，但经济性能见度和下行保护偏弱。
    data:
      items:
        - label: 市场顺风
          value: Strong
        - label: 产品 / 工作流证据
          value: Moderate-strong
        - label: 客户证据质量
          value: Moderate
        - label: 经济性能见度
          value: Weak
        - label: 下行保护能见度
          value: Weak
        - label: 需要价格纪律
          value: High
    approximationNotes: 这些是分析性评分词，不是出版方发布的 KPI。
    claimRefs:
