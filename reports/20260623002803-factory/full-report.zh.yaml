      - number: '8.3'
        title: 估值方法与可比背景
        blocks:
          - type: paragraph
            body: >-
              公开证据不支持为 Factory 计算干净的 EV 或 ARR multiple，因此正确方法应是基于 milestones 和 scenarios，而不是伪精确的 public-comps
              数学。来源包里最可靠的估值 datapoints 是 Factory 自身融资标记、品类 TAM 区间、竞争对手定位，以及企业买家愿意为 agentic software-development tooling
              付费的信号。这些有助于判断方向，但不足以支撑传统软件 multiple，因为分母缺失。GitHub Copilot、Cursor、Devin 或 Windsurf、Tabnine
              仍是相关参考路径，因为它们框定了买家重视的东西：repository-native distribution、autonomy、privacy deployment 和 workflow
              breadth。新的可比公司特定页面让判断更清晰：Devin Desktop 把 coding agents 描述为带内置 oversight 的 shared workstation，Tabnine
              enterprise 材料强调 private deployment 和 governance controls，Terminal-Bench 2.0 则把自己呈现为 top agents 和 models 的
              live benchmark。但审阅包没有保留足够经验证的同行财务数据，无法计算可辩护的 cross-sectional multiple set。因此，可比解读是定性的：Factory 应被纳入 premium
              enterprise-agent cohort，但 2026 年 4 月 $1.5 billion 价格已经假设其宽度、benchmark 领先和 GTM 扩张会转化为大规模、持久 ARR，而不是主要停留在
              proof-of-interest signals。
