      - number: '6.5'
        title: 扩张渠道与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Factory 有可信的 land-and-expand 叙事，但它的形态偏合作伙伴，公开证据也集中。定价显示，公司有意从个人订阅推进到 Teams 和 Enterprise；更大套餐加入
              SSO、治理、专用算力和高级支持，试点通过安全评审后应能抬高 ACV。Azure Marketplace 允许客户用既有云承诺采购，降低采购摩擦；Wipro 既能在内部部署
              Factory，也能把它转售给银行、医疗、制造、零售和科技客户。与 Palo Alto Networks 和 Snyk
              的安全合作，也让产品更贴合企业控制要求。风险在于，公开证明仍集中在少数标杆案例客户和一个大型渠道伙伴上。垂直行业证明在 fintech、安全 / 开源、AI 基础设施和互联网软件最强；制造、零售和医疗目前大多还是
              Wipro 管道主张，而不是具名部署证据。因此，扩张看起来真实，但客户集中度和渠道依赖仍是实质尽调议题。
