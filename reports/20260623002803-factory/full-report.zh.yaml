  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 论点
      - 证据
      - 重要性
      - 什么会改变判断
    rows:
      - - 正方：企业工作流广度真实存在
        - 定价、企业包装、分析、BYOK 和自定义 droids 显示它是平台，而不是单一 copilot 功能。
        - 更广的工作流控制可以撑起更高 ACV，并抬高切换成本。
        - 证明客户确实扩张到多个模块，而不只是试用。
      - - 正方：分发正在快速改善
        - Wipro rollout 加上一位资深 CRO，把触达扩展到大型工程组织。
        - 在企业工具里，分发杠杆和模型质量同样重要。
        - 渠道活动带来的已签客户爬坡、附加率和付费转化。
      - - 正方：基准和客户证明带来上行空间
        - Terminal-Bench 领先主张和案例研究，让买家有理由认真测试 Factory。
        - 如果属实，性能证明可以转化为更快的 land-and-expand 动作。
        - 独立基准复现和续约 cohort。
      - - 反方：经济性仍不透明
        - 留存下来的公开来源没有披露 ARR、毛利、NRR 或 burn。
        - 经济性不透明，使 $1.5B 标记无法锚定到软件基本面。
        - 可上董事会的收入、毛利和留存数据。
      - - 反方：竞争压力很强
        - GitHub Copilot、Cursor、Devin 或 Windsurf、Tabnine 都覆盖同一买家问题的重要部分。
        - 拥挤会压缩定价、销售效率和退出倍数。
        - 证明 Factory 在受监管或复杂企业账户中持续胜出。
      - - 反方：部分外部证据偏负面
        - Ry Walker 和 eesel 都警示拥挤、token 成本不可预测，或可靠性问题。
        - 在披露改善前，下行见证已经存在，后期价格风险会上升。
        - 独立证据证明服务成本和可靠性受控。
    notes: 正面案例有证据支撑，但仍偏叙事；负面案例主要来自缺失的私有指标和竞争拥挤，而不是需求已经被证明崩塌。
