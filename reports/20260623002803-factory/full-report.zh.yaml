      - 公开状态
      - 范围
      - 缺口 / 限制
    rows:
      - - 客户代码不用于训练
        - 安全页面明确说明
        - 客户 IP 与模型训练边界
        - 留存材料中没有公开数据处理协议或外部审计证据
      - - 单租户 VPC 托管
        - 企业部署页面明确说明
        - 托管客户环境隔离
        - 需要架构包和共享服务边界细节
      - - 静态 / 传输中加密
        - 公开说明静态数据采用 AES-256，传输中采用 TLS 1.2+
        - 存储和传输中的客户数据
        - 留存材料中没有公开密钥管理或 HSM 设计披露
      - - 审计日志与 SIEM 导出
        - 安全和定价材料公开说明
        - 监控、告警、活动轨迹和治理
        - 需要模式、保留期限和不可篡改性细节
      - - ZDR + SSO / SAML / SCIM + 管理员控制
        - Teams / Enterprise 套餐公开说明
        - 访问控制、身份生命周期和数据保留策略
        - 需要精确实施文档，以及不同部署模式下的排除项
      - - 自动化安全审查
        - 已公开发布，引用 STRIDE、CWE，并支持深度审计
        - PR 级和 repo 级安全代码分析
        - 需要客户代码库上的独立精确率 / 召回率数据
      - - 带可视化证据的自动化 QA
        - 已在各套餐公开发布
        - 合并前的工作流质量验证
        - 需要公开的测试抖动和环境支持证据
      - - SOC 2 Type I
        - 留存材料中有明确公告
        - 基础安全 / 隐私认证信号
        - 需要报告日期、范围，以及与后续声明的衔接
      - - ISO 42001 / SOC 2 Type II / ISO 27001 声明
        - 安全页面说明 ISO 42001；Missions 也声称 SOC 2 Type II 和 ISO 27001
        - AI 治理和企业合规定位
        - 需要证书或审计函，因为佐证材料薄于声明覆盖面
    notes: 公开控制项有实质意义，但外部尽调在将这些控制视为已充分核验之前，应索取最新安全包、合规证明、DPA 条款和架构图。
