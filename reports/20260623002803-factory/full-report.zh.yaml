  - id: TR005
    title: 缓释和终止标准表
    columns:
      - 风险
      - 可监测触发点
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 企业部署中出现安全 / 隐私失败
        - 公开事故、重大复盘，或客户确认的泄露
        - 与 Factory 工作流有关的任何重大数据外泄、未授权命令执行，或长时间宕机
        - 立即启动破题审查；在根因、影响范围和控制修复得到验证之前，暂停正向承销
      - - 供应商依赖和路由脆弱
        - 主要模型供应商宕机、政策变化，或质量 / 成本持续倒退
        - Factory 无法在正常支持窗口内吸收或绕开的持续性能下降或成本飙升
        - 重新评估多模型护城河和毛利假设的耐久性
      - - 合规证据缺口拖慢企业采用
        - 大型受监管买家因控制 / 法律原因推迟或拒绝扩张
        - 反复卡在安全采购，或到下一轮尽调阶段仍没有可信的 DPA / Type II / 合规包
        - 下调销售扩展性判断；在进一步建立信心前要求书面合规路线图
      - - 合作伙伴主导的 rollout 不达预期
        - Wipro / Azure / 安全集成扩张未能转化为持久的生产部署
        - 旗舰渠道没有拿出有说服力的生产规模证据，或灯塔部署出现明确流失
        - 下调渠道价值假设，并修正获客效率预期
      - - 经济质量撑不起估值叙事
        - NDA 财务包显示留存偏弱、毛利偏差，或集中度过高
        - 收入效率、续约或毛利结构支撑不了后期软件倍数假设
        - 即使 topline 增长仍强，也把估值视为偏紧或偏贵
      - - 治理和运营系统落后于增长
        - 支持负载、事故数量或销售扩张上升，但控制成熟度没有跟上
        - 证据显示高速增长跑在审查严谨度、支持质量或风险监督前面
        - 施加执行折价；在承销耐久性前要求扩张计划
    notes: 这些触发点要么可从外部监测，要么可在尽调中直接索取。它们聚焦会改变承销判断的事件，而不是柔性的叙事变化。
