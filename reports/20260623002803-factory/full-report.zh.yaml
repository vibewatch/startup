      - number: '7.5'
        title: 执行风险、缓释项与 thesis-break 触发点
        blocks:
          - type: paragraph
            body: >-
              执行风险在于，Factory 的扩张速度可能超过其公开证据基础。2026 年 6 月聘任 CRO 是建设性信号，说明公司在制度化 go-to-market
              领导力；但它也意味着后期销售动作仍在实时搭建。公司叙事强调 hyper-growth、always-on agents
              和企业转型；在品类竞赛中这可以是资产，但也带来典型风险：支持、治理和内部控制成熟度落后于营收野心。Factory 自身 Missions 文档也给出一个有用警示：该产品仍被描述为早期 research
              preview，正在测试并行化是否改善结果，以及如何在长周期计划中最大化正确性；troubleshooting 文档还明确讨论 frozen missions、stuck workers 和 blocked
              milestones。Anthropic 最佳实践指南和 GitHub Copilot 文档都强化同一点：agentic coding 只有在客户能执行权限、评审关口和验证闭环时才会成功。换句话说，Factory
              的结果不仅取决于模型质量，也取决于每个客户环境内纪律化的运营 rollout。


              好消息是，缓释项足够具体，可以尽调。Factory 有真实客户案例、明确安全投入、on-premise 和 single-tenant 定位、audit
              logging、模型灵活性、渠道扩张，以及越来越多面向治理而非单纯生成的产品。坏消息是，审阅过的公开材料仍未回答最关键的承销问题：留存是什么样？使用是否集中在少数 lighthouse
              accounts？gross margin 背后有多少供应商支出？是否发生过安全事件？客户多常依赖本地执行，而不是更可控模式？从试点到规模化部署的转化率是多少？


              如果出现四类事件，thesis 应迅速破裂。第一，客户环境内发生重大安全或隐私事件，会直接打击 Factory 的核心企业承诺。第二，model provider 或 routing
              失效导致持续服务降级或重大成本膨胀，会削弱 multi-model thesis。第三，续约弱、扩张差或大型伙伴 rollout 失败的证据，会戳破支撑 $1.5 billion
              估值的增长叙事。第四，如果无法展示超过营销级认证、可供客户使用的合规证据，受监管企业采用会显著放慢。下方缓释表把这些想法转化为可监控触发点和尽调问题，承销公司为持久企业平台之前应先关闭。
