        - id: L2
          label: 模型连接层
          description: BYOK、customModels、混合模型、提供商原生 API、通用端点，以及本地 / 开源模型
          detail: 文档展示了 OpenAI、Anthropic、Gemini 和 generic-chat-completion-api 配置，以及规划 / 实施模型拆分。
        - id: L3
          label: Router 与会话运行时
