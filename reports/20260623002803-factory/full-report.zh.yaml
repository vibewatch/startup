      - number: '7.2'
        title: 法律与监管风险栈
        blocks:
          - type: paragraph
            body: >-
              Factory 的法律与监管风险不在于公司今天显然违规，而在于它卖进企业工作流，而合规门槛上升得比公开披露更快。European Commission 的 AI Act 框架称，通用 AI 模型义务已于 2025
              年 8 月适用，透明度规则将于 2026 年 8 月生效；高风险用例则要求风险评估、日志、文档、人类监督、稳健性、网络安全等控制。Factory 面向金融服务营销，支持受监管企业，并强调 Morgan
              Stanley、EY、Nav 和 Wipro 相关行业渠道等组织使用。即使 Factory 本身并不总是高风险 AI 系统的法律提供方，客户也会追问其工作流、日志、模型路由和评审控制能否支持客户自身合规义务。


              Factory 的法律文件把大量责任转给客户。隐私政策称，Factory 会处理个人信息；当客户集成 repositories 或使用 remote containers 时，会存储来自 code
              repositories 和 projects 的 metadata。同一政策明确表示，没有任何电子传输或存储技术可以保证 100% 安全。个人条款要求有约束力的仲裁，要求客户遵守适用法律，要求客户独立验证
              customer outputs；本地软件安装后，客户环境和已批准命令的责任也大多落在客户身上。这些条款在商业上常见，但对尽调而言，它们意味着法律风险只是部分转移，并未消除。


              Factory 的企业隐私和数据流文档增加了架构细节，但没有消除尽调缺口。文档称 Droid 在本地读写代码，不会把 repository 上传或索引到 Factory cloud datastore；在
              hybrid 或 airgapped 模式下，可把 telemetry 留在客户 observability stack。与此同时，文件内容仍可能流向配置的 model endpoints，可选择启用 cloud
              analytics，cloud-managed deployments 也可能保留有限 operational logs。Factory 的 GitHub integration security
              文档在另一个界面说明同一点：prompts 和 context 会流向配置的 LLM providers，workflow logs 和 artifacts 遵循 GitHub retention
              settings，集成仍依赖 repository permissions 加 Factory API key。这对采购方向上有帮助，但法律和安全团队仍会要求看到实际 DPA、retention
              defaults、subprocessor commitments 和企业合同文件。


              最大未解缺口是证明深度。Factory 公开强调 SOC 2 Type I 和 ISO 42001 定位，但本次审阅的来源集不包含公开 DPA、retention schedule、subprocessor
              matrix、incident-reporting commitments、audit bridge letter 或 SOC 2 Type II report summary。同时，品类层面来源描述了 AI
              code tools 中活跃的版权、透明度和责任担忧。投资含义很直接：Factory 可能已有足够 surface-area maturity 进入严肃企业对话，但公开法律证据还不足以假设采购摩擦、隐私风险或
              AI 治理义务已经完全解决。
