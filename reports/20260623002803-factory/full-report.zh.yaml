    data:
      columns:
        - 证据质量
        - 结果具体性
        - 部署成熟度
        - 留存可见性
        - 渠道依赖
      rows:
        - label: Chainguard
          values:
            - 有客户引语的具名案例研究
            - 量化使用代理指标（6 个仓库、80 个包、2 周会话）
            - 生产使用
            - 中（仅重复使用代理指标）
            - 低
        - label: Empower
          values:
            - 有客户引语的具名案例研究
            - 高（40% / 50% 结果指标）
            - 生产使用
            - 低（无续约数据）
            - 低
        - label: Groq
          values:
            - 有客户引语的具名案例研究
            - 高（3x / 5x 速度指标）
            - 生产使用
            - 低（无续约数据）
            - 低
        - label: Nav
          values:
            - 有客户引语的具名案例研究
            - 高（60% / 2x 指标）
            - 生产使用
            - 低（无续约数据）
            - 低
        - label: You.com
          values:
            - 有工程师引语的具名案例研究
            - 中（调试从数天缩到一个下午；无百分比 KPI）
            - 生产使用，配标准代码审查和 24/7 agent
            - 中（标准化代理指标）
            - 低
        - label: Wipro
          values:
            - 具名伙伴部署公告
            - 终端客户结果低；部署规模高
            - 已承诺内部部署 + 转售动作
            - 中（投资 + 部署承诺）
            - 高
        - label: 仅 logo 队列
          values:
            - 仅由公司或媒体具名
            - 未披露
            - Unknown
            - 未披露
            - Unknown
    approximationNotes: 证据质量和渠道依赖标签，是基于留存来源的具体性与独立性作出的分析判断。
    claimRefs:
      - CU027
      - CU029
      - CU034
      - CU040
      - CU045
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高风险单元格集中在安全治理失败、提供商依赖和估值质量错配，而不是单纯需求风险。
    data:
      columns:
        - 低影响
        - 中影响
        - 高影响
        - 关键影响
      rows:
        - label: 高可能性
          values:
            - ''
            - token 经济性不透明
            - 合规包缺口
            - 安全 / 治理失败
        - label: 中可能性
          values:
            - 功能商品化
            - 治理披露缺口
            - 伙伴部署落空
            - 提供商 / 路由中断
        - label: 低可能性
          values:
            - 轻微渠道延迟
            - 孤立支持摩擦
            - 局部法律争议
            - 重大企业事件级联
    approximationNotes: 可能性和影响是分析师基于已审阅公开记录作出的判断。只有当品类层面证据与 Factory 的运营模式直接相关时，图表才会刻意混合 Factory 特有风险和品类层面风险。
    claimRefs:
      - CR001
      - CR002
      - CR006
      - CR007
      - CR008
      - CR017
      - CR036
      - CR046
  - id: FR002
    title: 风险传导图
    type: dag
    summary: 运营和安全故障会传导为客户信任受损、扩张放慢、经济性走弱，继而带来估值或融资压力。
    data:
      nodes:
        - id: n1
          label: 提示词 / 工具 / 配置故障
          description: Agentic 执行、本地命令或不安全运行时文件引发安全或质量事件。
        - id: n2
          label: 客户信任冲击
          description: 企业买家放慢上线、收紧权限，或重新评估续约决定。
        - id: n3
          label: 支持与修复负担
          description: Factory 必须排查、修补、沟通，并承接客户成功负载。
        - id: n4
          label: 扩张 / 采购放慢
          description: 安全审查拉长，渠道转化走弱，监管行业客户尤其明显。
        - id: n5
          label: 毛利与效率压力
          description: 更多支持工作叠加部署质量走弱，会削弱软件杠杆。
        - id: n6
          label: 估值 / 融资压力
          description: 若规模化质量不及预期，$1.5B 估值会更难守住。
      edges:
        - from: n1
          to: n2
          label: 降低信心
        - from: n1
          to: n3
          label: 增加事件响应负载
        - from: n2
          to: n4
          label: 放慢采用和续约
        - from: n3
          to: n5
          label: 推高运营负担
        - from: n4
          to: n5
          label: 削弱增长质量
        - from: n5
          to: n6
          label: 压缩软件倍数和融资杠杆
    approximationNotes: 图表聚焦下行传导，而不是概率。它不是预测，而是说明最重大的运营风险会如何触达财务结果的因果模型。
    claimRefs:
      - CR018
      - CR019
      - CR022
      - CR023
      - CR025
      - CR026
      - CR035
      - CR046
  - id: FR003
    title: 依赖关系图
    type: dag
    summary: Factory 的商业承诺要靠模型供应商、渠道、安全合作伙伴、客户环境和精选客户证据共同兑现。
    data:
      nodes:
        - id: d1
          label: 模型供应商
          description: Anthropic、OpenAI、Google 和兼容供应商提供核心推理层。
        - id: d2
          label: 渠道 / 采购合作伙伴
          description: Azure Marketplace 和 Wipro 扩大企业触达。
        - id: d3
          label: 安全合作伙伴
          description: Palo Alto Networks 和 Snyk 强化面向受监管企业的叙事。
        - id: d4
          label: 客户环境
          description: GitHub、GitLab、Jira、Slack、本地系统和远程容器承载工作。
        - id: d5
          label: Factory 产品层
          description: Droids、Router、Missions、Desktop 以及评审 / 安全工作流编排执行。
        - id: d6
          label: 收入质量
          description: 扩张、留存、支持负担和毛利耐久性决定估值质量。
      edges:
        - from: d1
          to: d5
          label: 提供模型能力和定价
        - from: d2
          to: d5
          label: 塑造采购和上线
        - from: d3
          to: d5
          label: 增加信任与控制面
        - from: d4
          to: d5
          label: 提供执行上下文和约束
        - from: d5
          to: d6
          label: 将产品质量转化为经济性
    approximationNotes: 这张图刻意简化，只突出外部依赖：即便 Factory 品牌或表层需求不变，这些依赖也能改变经济性。
    claimRefs:
      - CR029
      - CR030
      - CR031
      - CR032
      - CR033
      - CR037
      - CR038
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 真实产品与 GTM 证据支撑上行空间，但经济性和股权结构能见度缺失，迫使建议对公开证据打折。
    data:
      nodes:
        - id: n1
          label: 产品广度
        - id: n2
          label: 基准 / 客户证据
        - id: n3
          label: 渠道 / GTM 规模
        - id: n4
          label: ARR / 毛利 / NRR 缺失
        - id: n5
          label: 未知优先权结构
        - id: n6
          label: 估值折价
        - id: n7
          label: 继续研究建议
      edges:
        - from: n1
          to: n6
          label: 支撑上行
        - from: n2
          to: n6
          label: 支撑上行
        - from: n3
          to: n6
          label: 支撑上行
        - from: n4
          to: n6
          label: 迫使折价
        - from: n5
          to: n6
          label: 迫使折价
        - from: n6
          to: n7
          label: 价格敏感判断
    claimRefs:
      - CV013
      - CV014
      - CV017
      - CV018
      - CV019
      - CV021
      - CV022
      - CV030
      - CV043
      - CV044
      - CV045
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 最大的估值驱动项是隐藏的私有指标，而不是更多产品叙事。
    approximationNotes: 柱状条代表对可支撑估值的方向性影响权重，不是数学拟合的回归输出。
    data:
      items:
        - label: 已验证 ARR 规模
          value: 35
        - label: 毛利质量
          value: 25
        - label: 留存 / NRR 能见度
          value: 20
        - label: 经由 Wipro 的渠道变现
          value: 15
        - label: 从基准测试到续约的转化
          value: 10
        - label: 优先权压力或单位经济性疲弱
          value: -35
    claimRefs:
      - CV014
      - CV017
      - CV019
      - CV022
      - CV030
      - CV036
      - CV037
      - CV038
      - CV040
      - CV044
