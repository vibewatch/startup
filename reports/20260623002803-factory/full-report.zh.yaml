            body: >-
              核心尽调问题不是这个市场是否存在；它显然存在。问题在于，公开数字描述的是不同东西。分析机构发布大而高增长的 AI code-tools TAM，但这些估算混合了自助式 copilots、托管服务、卖给 SME
              的工具，以及广义 AI 开发类别。相反，Factory 推销的是更窄的企业治理型编码代理平台。所审独立资料没有给出该特定子领域的干净
              SAM，因此任何窄口径估计都必然是综合推导。公开触达证据也不完整：Factory
              的融资和具名客户有独立验证，但其最大胆的采用声明仍是公司自称；公开定价架构更多说明包装，而不是实际合同经济性。结果是，本章可以支持对类别增长和企业相关性的方向性信心，同时仍保留对可触达支出、变现组合，以及免费或伙伴主导部署能否转化为耐久收入的实质不确定性。
