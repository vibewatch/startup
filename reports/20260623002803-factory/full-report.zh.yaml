  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              分析 Factory 时，应把它放在企业 AI 编码和代理原生软件开发平台市场里，而不是更宽泛的全部 AI 软件宇宙里。其核心纳入支出是 SDLC
              中的工作流自动化：编码、测试、审查、文档、治理、部署控制和团队管理。边界外的是基础模型训练预算、原始 GPU 或通用云基础设施，以及从不触及受治理软件交付工作流的非工程 AI 工具。这个区分重要，因为
              Factory 反复销售的不只是原始代码生成，还有模型选择、可审计性、部署灵活性和策略控制。这些属性决定了它最接近的替代品是一组混合体：纯人工开发、内部工具，以及 GitHub
              Copilot、Cursor、Devin、Windsurf、Tabnine 等点状产品。换句话说，Factory 争夺的是工程生产力预算，但 headline AI code-tools TAM
              中只有一部分真正映射到它正在构建的重治理平台。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
