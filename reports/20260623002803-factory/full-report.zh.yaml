      - number: '1.5'
        title: 负面背景与未解决概览缺口
        blocks:
          - type: paragraph
            body: >-
              概览中最实质的弱点不是融资记录自相矛盾，而是运营披露缺口和产品风险外部性。eesel 的一篇负面评测认为，早期真实使用暴露了代码质量不稳定、token 消耗重和可靠性问题；这不应被当成定论，但说明外部评论并不都与
              Factory 的营销叙事一致。Factory 自己的 Palo Alto 和 Snyk 公告也从侧面强化了同一点：代理式开发会引入
              prompt-injection、未授权工具、漏洞和治理风险，必须主动管理。尽调上的运营负担因此有两层：第一，验证公司当前企业控制是否真的成熟到足以服务大型受监管客户；第二，补齐董事会构成、控制权、绝对收入或
              ARR、客户数、员工数，以及资本结构中任何二级交易或债务元素等披露空洞。公司概览可以支撑一个后期、快速扩张的叙事，但还不能支撑完全经审计的规模叙事。
