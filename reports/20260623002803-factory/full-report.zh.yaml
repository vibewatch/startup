      - number: '2.4'
        title: 增长驱动、ROI、信任与切换成本
        blocks:
          - type: paragraph
            body: >-
              需求驱动因素同时出现在分析师报告和 Factory
              自己的客户验证里。软件复杂度继续上升，团队希望每个工程师产出更多，市场也正从自动补全转向可审查、测试、写文档和调试的自主多步骤代理。企业治理本身也是增长催化剂，因为买家越来越想要审计轨迹、策略控制和模型路由，而不是单一黑箱
              copilot。ROI 证据也真实存在，尽管大多仍是厂商报告或案例研究。与此同时，最大采用约束是信任和控制。CACM 描述了一个使用量上升快于信心的市场；OWASP 记录了新类别的代理式安全风险；Google
              显示恶意指令和配置文件可重定向代理或外泄数据；分析师报告仍提示法律、隐私和 IP 不确定性。切换成本存在，但主要在工作流集成、治理设置和组织习惯里，而不是硬性的模型锁定，这限制了长期定价权。
