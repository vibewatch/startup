            body: >-
              Factory 的利润率故事在轮廓上可读，但没有数字。正面看，公司明确在降低模型支出：Factory Router 声称在保留大部分前沿模型基准表现的同时节省 20% 到 25% token 成本，You.com
              也称该平台的模型灵活性有助于控制重度用户支出。这说明，只要 session 能从昂贵模型路由到更便宜模型且不损害输出质量，毛利率就有真实改善空间。但成本侧的公开产品集并不轻。专用计算、后台代理、持久化 Droid
              Computers、气隙部署、BYOK 支持、审计日志、单租户托管和深度企业集成，都意味着基础设施和客户成功费用。与 Palo Alto Networks 和 Snyk
              的安全合作可能提升受监管账户胜率，但也增加交付复杂度，并可能通过集成和支持负担压缩利润率。结果是，软件杠杆路径看起来合理，但公开毛利率画像尚未被证明。
