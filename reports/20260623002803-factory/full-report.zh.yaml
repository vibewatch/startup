      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Factory 不卖给单一的泛开发者画像。用户通常是在终端、IDE、浏览器或协作工具中工作的软件工程师或工程团队，但经济买方会随细分市场变化。在较小的 SaaS 或 AI-native
              团队中，采用似乎从工程或平台负责人开始，他们想把 issue-to-PR 执行做得更快、减少上下文切换。在更大或受监管组织中，预算所有者会上移并外扩到平台工程、安全、IT 管理和采购，因为采购理由变成
              SSO、审计日志、数据控制、专用计算以及接入既有审批工作流。Factory 的垂直页面把 SaaS、金融服务、国防和科学等分层说得很明确；Azure Marketplace 和 Wipro
              则展示了采购渠道与服务伙伴如何加速推广。反复出现的采用模式是：开发者拉动，随后由治理驱动扩张。
