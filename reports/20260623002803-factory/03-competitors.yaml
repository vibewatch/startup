- id: TP003
  title: Pricing / Packaging Comparison
  columns:
  - Route
  - Public pricing posture
  - What is included
  - Unknowns or tradeoff
  - Buyer implication
  rows:
  - - Factory
    - $10 per active user per month entry point at GA; broader enterprise packaging remains sales-led
    - Agents across local/cloud, CLI or SDK surfaces, admin controls, and enterprise deployment options
    - Real overages, discounting, and module attach rates are not disclosed in reviewed materials
    - TCO is hardest to underwrite without a sales cycle
  - - GitHub Copilot
    - Public paid tiers at $10, $39, and $100 per user per month
    - IDE, terminal, GitHub surfaces, agents, governance, and policy tooling
    - Seat economics can still depend on enterprise policy and AI credit consumption
    - Easiest mainstream benchmark for seat-based pricing
  - - Cursor
    - Free, $20 individual, $40 per user teams, custom enterprise
    - Autonomous agents, Bugbot, team billing, SSO/OIDC, SCIM, audit logs
    - Enterprise price is custom above the teams tier
    - Good transparency for pilots and smaller teams
  - - Devin / Windsurf
    - Current reviewed pages do not surface a clear active list-price table
    - Agent desktop, ACP, Spaces, and integrations are visible
    - Procurement detail is sparse during the Windsurf-to-Devin transition
    - Sales friction is higher until pricing is clarified
  - - Tabnine
    - $39 code assistant and $59 agentic platform, with provider-cost caveats for some hosted models
    - CLI agent, MCP, context engine, private deployment, headless add-ons
    - Actual spend can vary with model-provider usage and optional headless features
    - Clearest regulated-enterprise alternative with public prices
  - - Internal build / vendor-native stack
    - No bundled seat price; spend is split across model APIs, repo tools, CI, and security tooling
    - Maximum flexibility and ability to buy only missing components
    - Labor, integration, and governance costs are hidden and recurring
    - List-price savings can disappear if platform engineering effort is high
  notes: Public list pricing is compared where the reviewed pages expose it; realized enterprise spend and discounting remain partially undisclosed across several routes.
