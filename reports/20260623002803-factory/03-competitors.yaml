tables:
- id: TP001
  title: Competitor Profile Table
  columns:
  - Competitor / route
  - Category
  - Scale or funding signal
  - Target buyer
  - Differentiation
  - Limitation
  rows:
  - - Factory
    - Direct peer / platform suite
    - $1.5B valuation, hundreds of thousands of daily developers claimed, Wipro rollout into tens of thousands of engineers
    - Large enterprises running multi-tool software delivery
    - Broad suite spanning agents, PR review, routing, wiki, deployment controls, and security add-ons
    - Pricing and benchmark validation remain partly vendor-authored
  - - GitHub Copilot
    - Incumbent platform
    - Public paid tiers and existing GitHub enterprise seat base
    - GitHub-standardized engineering organizations
    - Repository-native distribution, governance, code review, Spaces, MCP, and background agents
    - Reviewed corpus shows less explicit private-deployment posture than Tabnine
  - - Cursor
    - Direct peer
    - Claims trust from over half of the Fortune 500 plus public team pricing
    - Fast-moving engineering teams that want frontier autonomy
    - Autonomous agents, model choice, Bugbot review, clearer public pricing up to teams tier
    - Enterprise pricing is still custom and private-deployment evidence is thinner than Tabnine
  - - Devin / Windsurf
    - Direct peer
    - Current home page claims 1M+ users and 4,000+ enterprise customers
    - Teams prioritizing an agent-first workstation and IDE experience
    - ACP, Spaces, full IDE, and high-autonomy collaboration narrative
    - Current pricing and trust controls are underexplained and the Windsurf brand is in transition
  - - Tabnine
    - Privacy-focused substitute
    - Public $39 and $59 tiers with enterprise context positioning
    - Regulated or mixed-stack teams that value deployment control
    - VPC, on-prem, air-gapped, zero-retention, and no-lock-in posture
    - Narrower workflow bundle than Factory on wiki, routing, and partner integrations
  - - Snyk DeepCode
    - Adjacent budget alternative
    - 25M+ data-flow cases and 19+ supported languages
    - Security and AppSec buyers
    - Security scanning, autofix, prioritization, and AI security specialization
    - Not a full SDLC agent platform
  - - Internal build / vendor-native stack
    - Substitute and status quo
    - Assembled from vendor agents, repo tooling, and security controls rather than one bundle
    - Platform engineering teams with strong internal integration capability
    - Maximum flexibility and no forced suite adoption
    - High integration, governance, and maintenance burden
  notes: Representative 2026 routes rather than an exhaustive list; the relevant choice set includes direct peers, adjacent budget options, and internal build.
