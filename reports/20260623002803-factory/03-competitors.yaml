  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Realized enterprise pricing, overage behavior, and discount schedules for Factory and the current Devin or Windsurf route.
    whyItMatters: Without effective spend curves, the pricing table can compare list posture but not true total cost of ownership at scale.
    diligencePath: Request anonymized customer invoices, usage summaries, or pricing sheets covering overages and renewal terms.
    relatedQuestionRefs:
    - QP013
    - QP026
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Cohort retention, churn, and multi-homing data showing whether Factory customers standardize or keep multiple agents in production.
    whyItMatters: The moat argument depends on whether breadth converts into durable usage rather than pilot activity.
    diligencePath: Ask for customer references that describe migration off incumbents, renewal behavior, and number of products adopted per account.
    relatedQuestionRefs:
    - QP018
    - QP019
  - type: missing-source
    severity: material
    topic: benchmark-validation
    missingEvidence: Independent reproduction of Factorys productivity and benchmark claims using a third-party harness or customer audit.
    whyItMatters: Vendor-authored benchmarks and ROI claims are useful inputs but weak primary proof for a competitive durability call.
    diligencePath: Request third-party benchmark methodology, customer case studies with baseline data, or replicated trial outputs on the buyers own repositories.
    relatedQuestionRefs:
    - QP023
  - type: missing-source
    severity: minor
    topic: trust-packets
    missingEvidence: Comparable trust-center materials for GitHub Copilot and the current Devin or Windsurf route in the same review corpus.
    whyItMatters: A stricter side-by-side trust comparison needs the same level of documentary detail for every named peer.
    diligencePath: Collect trust-center pages, SOC reports, and admin-control documentation for each finalist before security review.
    relatedQuestionRefs:
    - QP014
  - type: enumeration-incomplete
    severity: minor
    topic: landscape-coverage
    missingEvidence: Direct evidence on smaller niche entrants beyond the named peers and substitute classes captured in the competitor profile table.
    whyItMatters: The chapter covers the most relevant routes for enterprise buyers, but it does not claim a complete census of every coding-agent startup.
    diligencePath: Expand the peer list with buyer-shortlist data, procurement records, or category databases before a full market-map exercise.
