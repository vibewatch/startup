- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Integrated multi-surface suite
    - Rivals already cover many of the same surfaces, so the basic agent loop can commoditize
    - High
    - If buyers can approximate breadth with several tools, suite bundling alone loses pricing power
    - Ask for multi-product attach rates and renewal evidence tied to breadth
  - - Model independence and routing
    - Multi-model choice and portability are now common claims across peers
    - High
    - Portability is no longer unique enough to defend valuation by itself
    - Ask for hard evidence that Router reduces spend or latency in production
  - - Enterprise trust posture
    - GitHub, Cursor, and Tabnine each show meaningful governance evidence in the reviewed corpus
    - Medium-High
    - Factory must win regulated deals on execution quality, not on trust claims alone
    - Ask for competitive win stories in regulated accounts
  - - Distribution partnerships
    - GitHub controls incumbent distribution, while Factory still leans on enterprise channels such as Wipro
    - High
    - Channel leverage helps reach but can dilute bottom-up product pull
    - Ask what share of pipeline is partner-led versus direct or self-serve
  - - Security add-ons
    - Adjacent vendors like Snyk can attach to many coding stacks, not only to Factory
    - Medium
    - Security bundling can be matched by partnerships elsewhere
    - Ask for attach rates and renewal evidence on security modules
  - - Pricing opacity
    - Cursor, GitHub, and Tabnine publish more of the list-price story than Factory or Devin/Windsurf
    - Medium
    - Opaque spend can slow evaluation even when the product is strong
    - Ask for usage curves, overages, and discount schedules from actual customers
  notes: The register focuses on evidence-backed threats to differentiation, distribution, or trust rather than on speculative future entrants.
