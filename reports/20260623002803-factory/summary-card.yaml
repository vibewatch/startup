  topStrengths:
    - >-
      Product scope spans coding, review, testing, documentation, incident response, and longer-running agent workflows
      rather than a single copilot surface.
    - >-
      The funding trajectory from seed to a $1.5B Series C, plus investors such as Sequoia, NEA, Khosla, Nvidia,
      Blackstone, and Wipro Ventures, gives Factory substantial capital and channel credibility.
    - >-
      Named customer and partner proof spans enterprises, fintech, security, inference infrastructure, and global
      systems integration, which supports broader commercial relevance than a design-partner niche.
  topRisks:
    - >-
      Public sources still omit ARR, gross margin, retention, burn, customer concentration, and preference terms, so
      valuation cannot be anchored to disclosed software fundamentals.
    - >-
      Many of the strongest benchmark, usage, and productivity claims are company-authored or curated case-study
      evidence rather than independently audited disclosures.
    - >-
      Competitive pressure from GitHub Copilot, Cursor, Devin, Windsurf, and privacy-focused enterprise tooling could
      compress pricing or differentiation before Factory proves durable renewal economics.
  unresolvedGaps:
    - Board-ready ARR, recognized revenue, gross margin, and burn/runway disclosure
    - Net revenue retention, contract length, pricing realization, and customer concentration data
    - Full cap-table, preference stack, and governance disclosure for the latest and prior financing rounds
