summary:
  headline: >-
    Factory is a credible enterprise agentic-software-development platform with real product breadth, customer proof,
    and channel momentum, but public evidence is still too thin on ARR, margins, and contract quality to underwrite the
    April 2026 $1.5 billion valuation.
