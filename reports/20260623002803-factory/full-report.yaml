      - number: '2.4'
        title: Growth drivers, ROI, trust, and switching cost
        blocks:
          - type: paragraph
            body: >-
              Demand drivers are visible across both analyst reports and Factory's own customer proof. Software
              complexity continues to rise, teams want more output per engineer, and the market is moving from
              autocomplete to autonomous multi-step agents that can review, test, document, and debug. Enterprise
              governance is itself a growth catalyst because buyers increasingly want audit trails, policy controls, and
              model routing instead of a single black-box copilot. There is also genuine ROI evidence, although most of
              it remains vendor-reported or case-study based. At the same time, the biggest adoption constraints are
              trust and control. CACM describes a market where usage is rising faster than confidence, OWASP documents
              new categories of agentic security risk, Google shows malicious instruction and configuration files can
              redirect agents or exfiltrate data, and analyst reports still flag legal, privacy, and IP uncertainty.
              Switching cost exists, but mostly in workflow integration, governance setup, and organizational habits
              rather than in hard model lock-in, which limits long-term pricing power.
