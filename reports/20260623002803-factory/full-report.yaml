      - number: '1.4'
        title: Scale evidence, channels, partnerships, and trust controls
        blocks:
          - type: paragraph
            body: >-
              Factory’s public scale evidence is directional but still uneven. The strongest company-claimed traction
              marker is the April 2026 Series C post saying Droids were used daily by hundreds of thousands of
              developers and that revenue had doubled month over month for each of the prior six months. Those are
              powerful statements, but they are not paired with absolute revenue, ARR, customer-count, or headcount
              disclosures in the fetched set. What is better substantiated is the breadth of channel and product
              expansion. Droids reached general access in September 2025, Missions added multi-day autonomous execution
              in February 2025, the Desktop app shipped in April 2026, and Factory Router entered preview in June 2026
              with claimed cost savings. Distribution also broadened through Azure Marketplace and the Wipro
              partnership, while the Palo Alto Networks and Snyk integrations show that Factory is trying to make
              security and governance part of the core enterprise pitch. Customer case studies from Chainguard and
              You.com support real usage in complex engineering environments, but they still function as curated proof
              points rather than audited commercial disclosure.
