      - number: '1.2'
        title: Founders, leadership, and governance baseline
        blocks:
          - type: paragraph
            body: >-
              The retrieved source set makes founder identity reasonably clear but leaves governance structure only
              partially visible. Official June 2026 materials and third-party profiles identify Matan Grinberg and Eno
              Reyes as founders, with Grinberg clearly acting as co-founder and CEO in public communications. TechCrunch
              adds the origin story that Grinberg left a UC Berkeley PhD track after Sequoia interest helped catalyze
              the company’s formation. Public leadership depth expanded materially in June 2026 when Factory hired
              Marcello Gallo as chief revenue officer after prior scaling roles at Sigma, Moveworks, and MongoDB, which
              is relevant because it suggests the company is adding a seasoned go-to-market operator after crossing into
              late-stage enterprise selling. Governance disclosure is thinner. The best-supported board fact in the
              fetched set is that Khosla’s Keith Rabois joined the board with the Series C, while broader board
              composition, independent-director presence, and investor control rights remain undisclosed in the
              materials reviewed. That leaves Factory looking strongly founder-led with real key-person dependence and
              only partial public governance transparency.
