      - number: '1.5'
        title: Adverse context and unresolved overview gaps
        blocks:
          - type: paragraph
            body: >-
              The most material weaknesses in the overview are not contradictions in the funding record but gaps in
              operating disclosure and product-risk externalities. An adverse review from eesel argues that early
              real-world usage exposed inconsistent code quality, heavy token consumption, and reliability problems,
              which should not be treated as definitive but does show that not all outside commentary matches Factory’s
              marketing narrative. Factory’s own Palo Alto and Snyk announcements independently reinforce that agentic
              development introduces prompt-injection, unauthorized-tool, vulnerability, and governance risks that must
              be actively managed. For diligence purposes, the operating burden is therefore twofold: first, verify
              whether the company’s current enterprise controls are actually mature enough for large regulated
              customers; second, close the remaining disclosure holes around board composition, control rights, absolute
              revenue or ARR, customer count, headcount, and any secondary or debt elements in the capital stack. The
              company overview can support a late-stage, fast-scaling narrative, but it cannot yet support a fully
              audited scale narrative.
            claimRefs:
              - CO041
              - CO042
              - CO043
              - CO044
              - CO045
