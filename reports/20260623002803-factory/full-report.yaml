companyProfile:
  summary: >-
    Factory is a San Francisco private company founded in 2023 that sells model-agnostic autonomous software-development
    agents called Droids. Public sources show the platform operating across CLI, IDE, desktop, browser, Slack, and
    partner workflows, with enterprise packaging focused on governance, integrations, and deployment flexibility rather
    than autocomplete alone. The company moved from a $5 million seed in 2023 to a $150 million Series C at a $1.5
    billion valuation in April 2026, while the public record also shows named customer and partner proof across
    financial services, security, fintech, infrastructure, and global systems integration. The key diligence constraint
    is financial disclosure quality: the reviewed pack does not disclose ARR, gross margin, retention, or cap-table
    terms, so the investability call depends on private diligence more than on public narrative.
  founders:
    - name: Matan Grinberg
      role: Co-founder and CEO
      background: >-
        Left a UC Berkeley PhD track to start Factory after early Sequoia interest, according to TechCrunch and profile
        sources.
      claimRefs:
        - CO009
        - CO010
        - CO011
    - name: Eno Reyes
      role: Co-founder
      background: >-
        Public sources identify Reyes as Grinberg's co-founder, but detailed operating biography is still sparse in the
        reviewed pack.
      claimRefs:
        - CO009
  foundingLocation: San Francisco, California, USA
  headquarters: San Francisco, California, USA
  productSummary: >-
    Droids are autonomous software-engineering agents that can generate code, review pull requests, test, document,
    investigate incidents, and execute longer-running workflows across multiple interfaces.
  customerFocus: >-
    Enterprise engineering organizations, especially complex or regulated software teams that value governance,
    integrations, and deployment flexibility, plus self-serve developers using CLI or desktop workflows.
  businessModel: >-
    Self-serve per-user subscriptions plus negotiated Teams and Enterprise contracts that bundle governance, dedicated
    compute, audit logging, and on-premise or private deployment options.
  stage: Series C
  fundingStatus: >-
