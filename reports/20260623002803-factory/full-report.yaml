      - number: '7.4'
        title: Partner, customer, and financial dependency risk
        blocks:
          - type: paragraph
            body: >-
              Factory’s best commercial story and one of its sharpest risk concentrations are the same thing: it is
              deeply interwoven with external platforms, model vendors, and enterprise channels. The BYOK, Gemini,
              OpenAI/Anthropic, and mixed-model documentation show that Factory’s value proposition depends on
              connecting to multiple external model APIs and managing task routing across them. TechCrunch notes that
              the company’s model-switching flexibility is one of its stated differentiators, but also notes that
              competitors such as Cursor are not locked to one model either. That means the moat is operational
              execution and enterprise integration quality rather than hard provider exclusivity. If provider economics
              worsen, output quality drifts, or major APIs change behavior, Factory has to absorb the support and
              product burden in front of the customer.


              Partner concentration is also real. The Wipro partnership is strategically powerful because it
              contemplates rollout across tens of thousands of engineers and resale into multiple industries, but that
              size cuts both ways: a delayed or weak rollout would undercut one of Factory’s strongest scale narratives.
              Azure Marketplace procurement similarly reduces friction through MACC, yet it strengthens channel
              dependence on a hyperscaler ecosystem. Security credibility also leans on partner integrations with Palo
              Alto Networks and Snyk. If those integrations do not work cleanly in production or if customers decide
              native controls are insufficient, Factory’s regulated-enterprise pitch loses force.


              Financially, the public record is still thin relative to valuation. Factory’s Series C post and TechCrunch
              support a $150 million financing at a $1.5 billion valuation and cite fast growth, but there is still no
              public absolute revenue, ARR, gross margin, renewal cohort, customer concentration, burn, or runway
              disclosure in the reviewed set. The risk is not simply “startup burn” but valuation fragility: if public
              or NDA diligence later shows thin retention, heavy provider pass-through costs, or expensive enterprise
              support, the valuation can compress much faster than the topline narrative suggests. Investors should
              therefore treat partner leverage and customer logos as evidence of sales access, not as proof that the
              economics are already de-risked.
