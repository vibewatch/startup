      - number: '3.2'
        title: Competitor Profiles, Pricing, and GTM
        blocks:
          - type: paragraph
            body: >-
              Factory has moved quickly from a 2025 Series B to a 2026 Series C and pairs that funding story with named
              enterprise logos and a Wipro channel partnership. That profile matters because enterprise software
              engineering agents are expensive products to sell and support; distribution, implementation help, and
              trust artifacts often matter as much as raw model quality. Public pricing still differentiates the field.
              GitHub Copilot, Cursor, and Tabnine all expose clearer list pricing than Factory or the current Devin or
              Windsurf surface, while Factory only publicly exposed a $10 per active user per month entry point at
              general availability and otherwise leans into team and enterprise packaging. Cursor and Tabnine make
              procurement easier for smaller teams because pricing is legible before a sales cycle, whereas Factory
              appears optimized for larger rollouts where channel leverage, support, and integration breadth matter more
              than a single seat price.
