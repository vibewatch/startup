      - number: '5.3'
        title: Deployment, Integration, Reliability, Support, and Roadmap
        blocks:
          - type: paragraph
            body: >-
              Factory’s deployment story is unusually broad for an enterprise coding-agent vendor. The homepage and
              enterprise materials advertise SaaS, hybrid, on-premise, and fully air-gapped options. Pricing and
              enterprise pages add dedicated compute, partitioned inference pools, on-prem deployment, encryption-key
              and data-residency controls, session-retention controls, and network policy. Desktop expands delivery from
              cloud-only delegation into local computer use: Droids can navigate VS Code, browser tabs, terminals,
              documents, and other desktop applications. The GA launch and Droids product pages also reinforce the
              interface breadth—terminal, IDE, browser, Slack, Jira, CLI automation, and local or remote background
              agents—so Factory can land either as an end-user tool or as platform-team automation infrastructure.

              Integration depth is visible but only partially documented. Factory publicly claims native GitHub/GitLab,
              Jira, Slack, PagerDuty, GitHub wiki, OTEL export, SIEM export, and MCP-based custom context, plus workflow
              installers for code review, QA, and wiki refresh. Reliability claims are strongest around Router, which
              says it can fail over across provider paths and achieve 99.9%+ request reliability, and around dedicated
              throughput for enterprise workloads. Support claims are also explicit: dedicated onboarding, dedicated
              account manager and customer engineer, 24/7 assistance, and SLA-backed priority support. Roadmap direction
              is legible from launch chronology and the Series C announcement: GA generalized Droids across the SDLC;
              Desktop, Missions, Router, Signals, Analytics, Automated QA, and Automated Security Review expanded the
              autonomy surface; Series C says the next phase will focus on routing, cost control, always-on agents,
              governance, and measuring readiness at scale. What remains missing is public evidence on uptime history,
              incident frequency, enterprise implementation time, or a full connector/API catalog.
