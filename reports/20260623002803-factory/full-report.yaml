  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Factory should be analyzed inside the market for enterprise AI coding and agent-native
              software-development platforms, not inside the much broader universe of all AI software. Its core included
              spend is workflow automation across the SDLC: coding, testing, review, documentation, governance,
              deployment controls, and team administration. What sits outside that boundary are foundation-model
              training budgets, raw GPU or generic cloud infrastructure, and non-engineering AI tools that never touch
              governed software-delivery workflows. The distinction matters because Factory repeatedly sells model
              choice, auditability, deployment flexibility, and policy controls as much as raw code generation. Those
              attributes make its closest substitutes a mix of human-only development, internal tooling, and point
              products such as GitHub Copilot, Cursor, Devin, Windsurf, and Tabnine. In other words, Factory competes
              for engineering-productivity budgets, but only part of the headline AI code-tools TAM actually maps to the
              governance-heavy platform it is building.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
