        title: Capital Adequacy and Public Visibility Gaps
        blocks:
          - type: paragraph
            body: >-
              Factory is clearly well financed on a fundraising basis. The company disclosed a $5 million seed in 2023,
              a $15 million Series A at a $120 million valuation in 2025, a $50 million Series B at a $300 million
              valuation in September 2025, and a $150 million Series C at a $1.5 billion valuation in April 2026. That
              implies at least $220 million of cumulative disclosed funding since launch, with Series C earmarked for
              research, product, and global go-to-market investment. Those facts support capital access, but not capital
              adequacy. No retained public source discloses cash on hand, monthly burn, headcount, debt, payment terms
              with model providers, or runway. Even the strongest third-party views can only infer that the fresh Series
              C likely creates a meaningful runway buffer; they cannot verify whether Factory is efficiently financed or
              simply spending aggressively into a crowded category. For underwriting, the missing treasury and operating
