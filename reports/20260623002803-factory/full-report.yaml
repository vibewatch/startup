      - number: '7.2'
        title: Legal and regulatory risk stack
        blocks:
          - type: paragraph
            body: >-
              The legal and regulatory risk is not that Factory is obviously non-compliant today; it is that the company
              sells into enterprise workflows where the compliance bar is rising faster than public disclosure. The
              European Commission’s AI Act framework states that general-purpose AI model obligations became applicable
              in August 2025 and that transparency rules become effective in August 2026, while high-risk use cases
              require risk assessment, logging, documentation, human oversight, robustness, cybersecurity, and other
              controls. Factory markets to financial services, supports regulated enterprises, and highlights use by
              organizations such as Morgan Stanley, EY, Nav, and Wipro-linked industry channels. Even if Factory itself
              is not always the legal provider of a high-risk AI system, its customers will ask whether its workflows,
              logs, model routing, and review controls can support their own compliance duties.


              Factory’s legal documents shift substantial responsibility to the customer. The privacy policy says
              Factory processes personal information and, when customers integrate repositories or use remote
              containers, stores metadata from code repositories and projects. The same policy explicitly says no
              electronic transmission or storage technology can be guaranteed to be 100% secure. The individual terms
              require binding arbitration, make customers responsible for complying with applicable law, require
              customers to verify customer outputs independently, and place responsibility for the customer environment
              and approved commands largely on the customer once local software is installed. Those clauses are
              commercially common, but for diligence they mean legal risk is partly transferred rather than eliminated.


              Factory’s enterprise privacy-and-data-flow docs add architectural nuance without eliminating the diligence
              gap. The docs say Droid reads and writes code locally, does not upload or index the repository into a
              Factory cloud datastore, and can keep telemetry in the customer observability stack in hybrid or airgapped
              modes; at the same time, file contents can still flow to configured model endpoints, optional cloud
              analytics can be enabled, and cloud-managed deployments may retain limited operational logs. Factory’s
              GitHub integration security docs make the same point in another surface: prompts and context flow to
              configured LLM providers, workflow logs and artifacts follow GitHub retention settings, and the
              integration still depends on repository permissions plus a Factory API key. That is directionally helpful
              for procurement, but it still leaves counsel and security teams asking for the actual DPA, retention
              defaults, subprocessor commitments, and enterprise paper.


              The biggest unresolved gap is proof depth. Factory publicly touts SOC 2 Type I and ISO 42001 positioning,
              but the reviewed source set does not include a public DPA, retention schedule, subprocessor matrix,
              incident-reporting commitments, audit bridge letter, or SOC 2 Type II report summary. Meanwhile,
              category-level sources describe active copyright, transparency, and liability concerns across AI code
              tools. The investment implication is straightforward: Factory probably has enough surface-area maturity to
              enter serious enterprise conversations, but not enough public legal evidence to assume procurement
              friction, privacy risk, or AI-governance obligations are already fully solved.
            claimRefs:
              - CR009
              - CR010
              - CR011
