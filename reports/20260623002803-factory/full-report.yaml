      - number: '8.2'
        title: Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The evidence-backed thesis starts with real enterprise ambition rather than toy-developer positioning.
              Factory now sells across self-serve and enterprise packaging, claims hundreds of thousands of daily
              developers, names blue-chip customers, and has a Wipro partnership that could put the product in front of
              tens of thousands of engineers and major industry clients. The product story is also broader than
              autocomplete: benchmark material, model-routing claims, analytics, BYOK support, and custom droids
              together imply a platform built for enterprise workflow control. The anti-thesis is that many of the
              strongest positives are still vendor-authored. Benchmark leadership, six straight months of revenue
              doubling, and most outcome claims come from Factory itself or from curated customer stories rather than
              audited financials. External critique also flags cost opacity, reliability concerns, crowding, and the
              risk that incumbents or better-capitalized peers compress differentiation faster than Factory can turn
