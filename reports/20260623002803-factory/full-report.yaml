      - number: '8.4'
        title: Bull, Base, Bear, and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              Because no public source discloses Factory's revenue base or cap-table terms, the scenario bands below
              should be read as disciplined underwriting ranges, not market-clearing truth. The bull case assumes that
              Series C momentum is backed by real enterprise ARR, strong renewal behavior, improving model-cost
              efficiency, and monetization of Wipro-scale distribution; under that path, a valuation above the last
              round can be justified. The base case assumes that product-market proof is real but less explosive than
              the headline narrative suggests, with growth normalizing before economics are fully visible; that leads to
              a range around or somewhat below the current price. The bear case assumes that token-heavy delivery, weak
              renewal quality, customer concentration, or stacked late-stage preferences make the current mark too
              optimistic. That downside can be severe because the latest step-up from $300 million to $1.5 billion was
              so fast. Entry discipline therefore matters more than company quality alone: absent private ARR, gross
              margin, NRR, and preference data, the public record does not justify paying through the last round simply
              on narrative momentum.
            claimRefs:
              - CV016
