  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition in Customer Workflow Terms
        blocks:
          - type: paragraph
            body: >-
              Factory defines its product as a “software factory” for enterprise engineering teams rather than as a
              narrow autocomplete or IDE copilot. In the customer workflow Factory describes, an engineer, tech lead, or
              platform team member starts from a ticket, prompt, spec, pull request, incident, or documentation need;
              delegates the work to a Droid in the terminal, IDE, browser, Slack, Jira, or desktop app; and expects the
              system to plan, search, edit, test, review, document, and return production-ready output. That operating
              model extends across routine coding, migration, incident response, code review, wiki generation, QA, and
              security review, which is why Factory repeatedly markets “every stage” of the software development
              lifecycle rather than a single coding moment.

              The visible product map is also broader than one agent. The self-serve plans expose Droids, background
              agents, Desktop, CLI, SDK, usage tracking, and the agent-readiness dashboard. The product pages and launch
              posts add Missions for long-horizon orchestration, Router for automatic model selection, AutoWiki for
              continuously refreshed codebase documentation, Analytics for admin telemetry, Automated QA for user-flow
              testing with screenshots and traces, Automated Security Review for PR scanning, and code review workflows
              for GitHub and GitLab. Teams and Enterprise packaging then wraps that module set in governance,
              onboarding, custom usage, compute allocation, and support. In diligence terms, Factory is best understood
              as an agentic SDLC platform whose monetizable units are workflows, control surfaces, and
              infrastructure-backed autonomy rather than just chat sessions.
