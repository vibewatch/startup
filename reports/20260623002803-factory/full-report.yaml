            title: Factory's real market is governance-heavy, not generic copilot spend
            body: >-
              The strongest evidence points to a large market for AI code tools, but Factory's closest opportunity is
              the narrower slice where buyers pay for secure deployment, policy controls, model flexibility, and
              workflow integration.
            calloutType: insight
            claimRefs:
