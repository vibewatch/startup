  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Supportable post-money range (USD bn)
      - Probability signal
      - Main failure mode
    rows:
      - - Bull
        - >-
          Series C growth claims translate into large enterprise ARR, renewals are strong, Router-style cost savings
          improve margin, and Wipro converts into scaled paid deployments.
        - 1.8-2.4
        - Requires private diligence to confirm that growth and margins are real, not just top-of-funnel excitement.
        - If ARR or gross margin is weaker than implied, the premium evaporates quickly.
      - - Base
        - >-
          Adoption is real, but growth normalizes, enterprise selling stays expensive, and economics improve slower than
          headline momentum suggests.
        - 0.9-1.4
        - Best fit for the public record because product and GTM proof are visible while unit economics are not.
        - Paying at or above the last round leaves limited margin of safety.
      - - Bear
        - >-
          Revenue is smaller or more concentrated than expected, compute and service burdens stay high, and late-stage
          preferences or weaker renewals amplify downside.
        - 0.4-0.8
        - Credible whenever a fast step-up round lacks matching disclosure on ARR, NRR, and cap-table terms.
        - A stacked preference structure can make even a decent operating company a poor equity entry.
    notes: >-
      These are analytical underwriting bands anchored to public milestones and missing-data penalties, not precise
      trading multiples.
