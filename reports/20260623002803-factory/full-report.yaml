  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence
      - Why it matters
      - What would change the view
    rows:
      - - 'Thesis: enterprise workflow breadth is real'
        - >-
          Pricing, enterprise packaging, analytics, BYOK, and custom droids show a platform rather than a single copilot
          feature.
        - Broader workflow control can command higher ACV and raise switching costs.
        - Proof that customers actually expand into multiple modules, not just trial them.
      - - 'Thesis: distribution is improving fast'
        - Wipro rollout plus a seasoned CRO expand reach into large engineering organizations.
        - Distribution leverage matters as much as model quality in enterprise tooling.
        - Signed client ramps, attach rates, and paid conversions from channel activity.
      - - 'Thesis: benchmark and customer proof create upside'
        - Terminal-Bench leadership claims and case studies give a reason for buyers to test Factory seriously.
        - If true, performance proof can turn into faster land-and-expand motion.
        - Independent benchmark replication and renewal cohorts.
      - - 'Anti-thesis: economics are still opaque'
        - No retained public source discloses ARR, gross margin, NRR, or burn.
        - Opaque economics make the $1.5B mark impossible to anchor to software fundamentals.
        - Board-ready revenue, margin, and retention data.
      - - 'Anti-thesis: competitive pressure is intense'
        - GitHub Copilot, Cursor, Devin or Windsurf, and Tabnine all cover major parts of the same buyer problem.
        - Crowding can compress pricing, sales efficiency, and exit multiples.
        - Evidence that Factory wins consistently in regulated or complex-enterprise accounts.
      - - 'Anti-thesis: some external evidence is adverse'
        - Ry Walker and eesel both warn on crowding, token-cost unpredictability, or reliability concerns.
        - Late-stage price risk rises when downside witnesses already exist before disclosure improves.
        - Independent evidence that cost-to-serve and reliability are under control.
    notes: >-
      The positive case is evidence-backed but still narrative-heavy; the negative case is driven mainly by missing
      private metrics and crowding rather than by a proven collapse in demand.
