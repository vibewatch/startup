            body: >-
              Factory does have switching costs, but they are operational rather than absolute. The more a customer
              leans into org memory, audit controls, security partners, and cross-surface workflows, the harder it
              becomes to rip out the platform cleanly. At the same time, the same source set shows why hard lock-in is
              limited. Model portability, MCP-style extensibility, and cross-surface work are now common claims across
              rivals, which means buyers can multi-home or recompose parts of the stack if one vendor disappoints.
              Independent risk sources further weaken simple autonomy narratives because they show that AI coding agents
              can create prompt-injection, untrusted-file, and code-quality problems that require explicit policy and
              review controls. The adverse conclusion is that Factory's moat is not exclusive access to models or a
              uniquely isolated feature. It is the company's ability to package a broad workflow, governance, and
              enterprise rollout motion faster than buyers can assemble the same outcome; that judgment still depends on
              renewal evidence, partner execution, and whether security-heavy buyers treat point solutions as good
              enough. themselves.
