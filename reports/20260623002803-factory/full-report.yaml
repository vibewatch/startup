      - number: '1.3'
        title: Funding history, valuation step-up, and investor map
        blocks:
          - type: paragraph
            body: >-
              Factory’s financing path is unusually steep and is the clearest reason the company has become a serious
              diligence target. Official releases support a $5 million seed in November 2023, a $15 million Series A
              that valued the business at $120 million and brought disclosed funding above $20 million, a $50 million
              Series B at a $300 million valuation in September 2025, and a $150 million Series C at a $1.5 billion
              valuation in April 2026. Independent coverage from Business Wire, SiliconANGLE, and TechCrunch
              substantially corroborates the later rounds, while the earliest stages rely more heavily on company
              disclosures and a short Forbes profile. On disclosed amounts alone, Factory has raised about $220 million.
              The investor set is also notable: Sequoia appears from the seed onward; NEA, Nvidia, J.P. Morgan, and
              Mantis VC joined around the Series B; and Khosla, Blackstone, and Insight Partners joined the Series C.
              Wipro Ventures’ participation adds a strategic distribution angle rather than just financial sponsorship.
              The capital story therefore shows both valuation acceleration and a widening mix of venture, corporate,
              and enterprise-adjacent backers.
