        title: Revenue Model and Public Pricing
        blocks:
          - type: paragraph
            body: >-
              Factory's visible revenue model mixes self-serve subscriptions with custom enterprise contracting. The
              public pricing page discloses three list-priced individual tiers at $20, $100, and $200 per user per
              month, then shifts Teams and Enterprise into negotiated packaging with custom usage limits, SSO,
              governance controls, dedicated compute, audit logging, on-premise options, and SLA-backed support. That
              package design implies at least three monetization layers: seat revenue, usage-linked capacity, and
              higher-margin or higher-ACV enterprise governance features. At the same time, the revenue-quality question
              is unresolved because no retained public source discloses realized enterprise pricing, discounting,
              contract duration, renewal mechanics, or whether revenue is recognized mainly as software subscription,
              managed infrastructure, or services-heavy deployment. Desktop usage being included in existing
              subscriptions suggests Factory is optimizing for seat and workflow expansion inside accounts, but public
              evidence still stops short of showing the revenue mix that converts that product breadth into recognized
