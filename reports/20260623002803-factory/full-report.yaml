      - number: '8.3'
        title: Valuation Method and Comparable Context
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not support a clean EV or ARR multiple for Factory, so the right method is milestone-
              and scenario-based rather than pseudo-precise public-comps math. The most reliable valuation datapoints in
              the source pack are Factory's own financing marks, the category TAM range, competitor positioning, and
              signals that enterprise buyers will pay for agentic software-development tooling. Those are useful for
              direction, but not enough for a conventional software multiple because the denominator is missing. GitHub
              Copilot, Cursor, Devin or Windsurf, and Tabnine are still relevant reference routes because they bound
              what buyers value: repository-native distribution, autonomy, privacy deployment, and workflow breadth.
              Fresh comparable-specific pages sharpen that read: Devin Desktop frames coding agents as a shared
              workstation with built-in oversight, Tabnine enterprise materials emphasize private deployment and
              governance controls, and Terminal-Bench 2.0 presents itself as a live benchmark for top agents and models.
              Yet the reviewed pack does not retain enough verified financial data for those peers to calculate a
              defensible cross-sectional multiple set. The comparable read is therefore qualitative: Factory deserves
              inclusion in a premium enterprise-agent cohort, but the April 2026 $1.5 billion price already assumes that
              breadth, benchmark leadership, and GTM expansion convert into large, durable ARR instead of remaining
              mostly proof-of-interest signals.
