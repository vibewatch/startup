      - number: '2.5'
        title: Contradictory estimates and unresolved sizing gaps
        blocks:
          - type: paragraph
            body: >-
              The central diligence problem is not whether this market exists; it clearly does. The problem is that
              public numbers describe different things. Analyst houses publish large and fast-growing AI code-tools
              TAMs, but those estimates blend self-serve copilots, managed services, tooling sold to SMEs, and broad
              AI-development categories. Factory, by contrast, is pitching a narrower enterprise-governed coding-agent
              platform. No reviewed independent source publishes a clean SAM for that specific subsegment, so any narrow
              estimate is necessarily synthesized. Public reach evidence is also incomplete: Factory has independent
              validation of funding and named customers, but its boldest adoption claims remain company claims, and its
              public pricing architecture says far more about packaging than about actual contract economics. The result
              is a market chapter that can support directional confidence in category growth and enterprise relevance,
              while still preserving material uncertainty around reachable spend, monetization mix, and conversion of
              free or partner-led deployments into durable revenue.
            claimRefs:
              - CM036
              - CM037
