      - number: '2.2'
        title: TAM, enterprise-weighted lens, and Factory-relevant SAM
        blocks:
          - type: paragraph
            body: >-
              The public market data is directionally supportive but not clean. Mordor, Grand View, and
              MarketsandMarkets all describe a multi-billion-dollar AI code-tools category growing roughly 24% to 27%
              annually, yet their baselines, end dates, and category definitions do not align. The broadest lens is
              simply the global AI code-tools market, which is already measured at billions of dollars and expanding
              quickly. A more relevant second lens is enterprise weighting: Mordor says large enterprises represented
              59.47% of category revenue in 2025, and applying that share to its 2026 market estimate yields an
              enterprise-heavy lens of roughly $5.6 billion before any further narrowing. The practical SAM for Factory
              should be smaller still because the company is not targeting every code tool buyer; it is targeting
              organizations that want governed autonomous workflows, multi-model routing, and secure deployment across
              complex environments. Public evidence clearly shows the category is large enough to matter, but public
              evidence does not yet isolate a clean independent SAM for enterprise-governed coding-agent platforms.
            claimRefs:
