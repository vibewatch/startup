chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and business model
        blocks:
          - type: paragraph
            body: >-
              Factory presents itself as an enterprise software-development platform rather than a narrow autocomplete
              product. Its homepage, enterprise page, pricing page, and September 2025 Droids general-access
              announcement all describe Droids as autonomous agents that can generate code, test, review, document,
              research, and resolve incidents across the software development lifecycle, while remaining model-agnostic,
              interface-agnostic, and deployable in SaaS, hybrid, on-premise, or air-gapped modes. Publicly, the company
              anchors its mission on bringing autonomy to software engineering and sells that mission through a
              subscription software model with self-serve plans for individual users and custom Teams and Enterprise
              packages for larger organizations. That positioning matters because Factory is selling workflow
              orchestration, governance, and deployment flexibility to engineering leaders, not just a code assistant to
              individual developers. The most stable identity facts in the fetched set are that Factory was founded in
              2023, is headquartered in San Francisco, and now pitches a "software factory" product that sits across
              multiple interfaces and enterprise control surfaces.
