              The supportable financial verdict is mixed. Factory has a strong commercial narrative: self-serve pricing
              exists, enterprise packaging is premium, procurement friction is reduced through Azure, distribution is
              widened through Wipro, and customer outcome claims suggest buyers are seeing enough value to expand usage.
              The company also raised capital at a sharply higher valuation within seven months of Series B and is
              investing in tooling that should improve cost efficiency over time. But the core blockers are substantial.
              Absolute revenue, ARR, realized pricing, gross margin, CAC, customer concentration, retention, burn, and
              runway are all absent from the public record. External critiques also flag unpredictable token economics,
              frothy competitive conditions, and self-reported growth and benchmark claims. On that evidence, Factory
