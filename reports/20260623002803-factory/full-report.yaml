      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Factory does not sell to a single generic developer persona. The user is usually a software engineer or
              engineering team operating in the terminal, IDE, browser, or collaboration tooling, but the economic buyer
              changes with segment. In smaller SaaS or AI-native teams, adoption appears to begin with engineering or
              platform leadership that wants faster issue-to-PR execution and less context switching. In larger or
              regulated organizations, the budget owner moves upward and outward toward platform engineering, security,
              IT administration, and procurement because the purchase is justified by SSO, audit logging, data controls,
              dedicated compute, and integration into existing approval workflows. Factory's vertical pages make this
              segmentation explicit across SaaS, financial services, defense, and science, while Azure Marketplace and
              Wipro show how procurement channels and service partners can accelerate rollout. The recurring adoption
              pattern is developer pull followed by governance-led expansion.
