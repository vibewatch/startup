  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Solution Classes
        blocks:
          - type: paragraph
            body: >-
              Factory is competing in a layered market, not against one clean peer set. The closest direct peers are
              Cursor and Devin or the current Devin Desktop surface because they sell autonomy first: the product
              promise is that an agent can take a task, work across tools, and return finished work. GitHub Copilot is
              the incumbent because its advantages come from where it already sits — the repository host, seat system,
              policy layer, and collaboration surface — not just from agent quality. Tabnine matters as the privacy and
              deployment-focused substitute for regulated buyers, while Snyk captures adjacent budget as a security
              control rather than as a full SDLC operating system. Underneath all of them sits the status quo: internal
              build around vendor-native agents, repo-host tooling, and security scanners. That means Factory is always
              competing partly against named vendors and partly against a buyer deciding that orchestration can be
              assembled internally.
