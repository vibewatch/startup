  - id: FR002
    title: Risk transmission map
    type: dag
    summary: >-
      Operational and security failures propagate into customer trust, slower expansion, weaker economics, and then
      valuation or financing pressure.
    data:
      nodes:
        - id: n1
          label: Prompt / tool / config failure
          description: Agentic execution, local commands, or unsafe runtime files create a security or quality incident.
        - id: n2
          label: Customer trust shock
          description: Enterprise buyers slow rollout, tighten permissions, or revisit renewal decisions.
        - id: n3
          label: Support and remediation burden
          description: Factory must investigate, patch, communicate, and absorb customer-success load.
        - id: n4
          label: Slower expansion / procurement
          description: Security reviews lengthen and channel conversions weaken, especially in regulated accounts.
        - id: n5
          label: Margin and efficiency pressure
          description: More support work and weaker deployment quality reduce software leverage.
        - id: n6
          label: Valuation / financing pressure
          description: If scale quality disappoints, a $1.5B valuation becomes harder to defend.
      edges:
        - from: n1
          to: n2
          label: reduces confidence
        - from: n1
          to: n3
          label: creates incident response load
        - from: n2
          to: n4
          label: slows adoption and renewals
        - from: n3
          to: n5
          label: raises operating burden
        - from: n4
          to: n5
          label: weakens growth quality
        - from: n5
          to: n6
          label: compresses software multiple and financing leverage
    approximationNotes: >-
      The graph focuses on downside transmission rather than probability. It is not a forecast; it is a causal model for
      how the most material operational risks would reach financial outcomes.
