      - number: '7.5'
        title: Execution risk, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The execution risk is that Factory may be scaling faster than its public evidence base. The June 2026 CRO
              hire is a constructive signal that the company is institutionalizing go-to-market leadership, but it also
              implies the late-stage selling motion is still being built in real time. The company’s messaging
              emphasizes hyper-growth, always-on agents, and enterprise transformation; that can be an asset in a
              category race, but it also raises the classic risk that support, governance, and internal control maturity
              lag top-line ambition. Factory’s own Missions docs add a useful caution flag: the product is still
              described as an early research preview that is testing whether parallelization improves outcomes and how
              to maximize correctness in long-running plans, and the troubleshooting docs explicitly discuss frozen
              missions, stuck workers, and blocked milestones. Anthropic’s best-practices guide and GitHub’s Copilot
              documentation both reinforce that agentic coding succeeds only when customers can enforce permissions,
              review gates, and verification loops. In other words, Factory’s outcomes depend not only on model quality
              but on disciplined operational rollout inside each customer environment.


              The good news is that the mitigants are concrete enough to diligence. Factory has real customer case
              studies, explicit security investment, on-premise and single-tenant positioning, audit logging, model
              flexibility, channel expansion, and a growing product set aimed at governance rather than raw generation
              alone. The bad news is that the reviewed public materials still do not answer the most important
              underwriting questions: What does retention look like? How concentrated is usage among a few lighthouse
              accounts? How much provider spend sits behind gross margin? What security incidents, if any, have
              occurred? How often do customers rely on local execution versus more controlled modes? What is the
              conversion from pilots to scaled deployments?


              The thesis should break quickly if any of four events occur. First, a material security or privacy
              incident inside a customer environment would directly attack Factory’s core enterprise promise. Second, a
              model-provider or routing failure that causes sustained service degradation or major cost inflation would
              undermine the multi-model thesis. Third, evidence of weak renewals, poor expansion, or failed
              large-partner rollouts would puncture the growth narrative supporting the $1.5 billion valuation. Fourth,
              inability to demonstrate customer-ready compliance evidence beyond marketing-level certifications would
              materially slow regulated-enterprise adoption. The mitigation table below converts those ideas into
              monitorable triggers and diligence asks that should be closed before underwriting the company as a durable
              enterprise platform.
