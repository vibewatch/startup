      - number: '5.5'
        title: Trust, Safety, Security, Privacy, and Compliance Controls
        blocks:
          - type: paragraph
            body: >-
              Factory’s trust story is a mix of concrete control claims and still-thin external validation. The clearest
              controls come from the security, pricing, enterprise, and docs surfaces: no customer code used as training
              data; sandboxed single-tenant hosting with its own VPC; AES-256 at rest and TLS 1.2+ in transit; audit
              logging exportable to SIEM; strict permission enforcement; ZDR; SSO/SAML/SCIM; model-access controls and
              deny lists; encryption-key, session-retention, data-residency, and network-policy controls; and org-level
              model policies. Signals adds a privacy-design claim that user conversations are abstracted into metadata
              and pattern categories rather than exposed to human analysts. Missions also claims every command is
              risk-classified, secrets are scanned before anything reaches a model, hooks can inject customer security
              controls, and all actions are logged via OpenTelemetry.

              Safety controls are productized, not just policy statements. Standard code review uses a bug-only rubric
              with P0-P3 severities, while Automated Security Review adds STRIDE-based findings, CWE references,
              responsible-disclosure examples, and deep repository audits through Missions. Automated QA adds
              screenshots, terminal snapshots, and API traces to catch UI and workflow breakage. Compliance positioning
              is credible but needs diligence discipline: Factory explicitly announces SOC 2 Type I and ISO 42001
              adoption, while the Missions launch claims SOC 2 Type II and ISO 27001 as maintained certifications. Those
              later claims may be true, but public evidence in the retained set is thinner than the breadth of the
              assertion. External security context from OWASP and Google reinforces why these controls matter—agentic
              coding tools inherit prompt-injection, file-trust, and autonomy risks—but public sources still do not
              provide a third-party penetration report, incident log, or comprehensive security architecture package.
            claimRefs:
