      - number: '8.5'
        title: Recommendation, Risk, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The supportable public-only recommendation is research-more, not buy. Factory is clearly building in a
              category with real demand, and it has more evidence-backed customer, partner, and product breadth than
              many earlier-stage AI tooling companies. That keeps the story investable and explains why the company
              should remain on the tracking list rather than in an avoid bucket. But the price-sensitive answer is
              stricter: the public record supports medium confidence, high risk, and a stretched valuation stance
              because the missing metrics are not cosmetic. ARR, gross margin, net retention, concentration, and
              cap-table preferences decide whether this is a premium software platform or a momentum-financed
              infrastructure-heavy growth story. The company also looks more scale-up ready than exit ready. GTM
              ambition, partner reach, and workflow breadth are visible, but IPO-style disclosure quality is not. The
              next diligence step should therefore focus less on additional storytelling and more on the exact private
              datasets that could either validate or break the current mark.
