  productSummary: Droids are autonomous software-engineering agents that can generate code, review pull requests, test, document, investigate incidents, and execute longer-running workflows across multiple interfaces.
  customerFocus: Enterprise engineering organizations, especially complex or regulated software teams that value governance, integrations, and deployment flexibility, plus self-serve developers using CLI or desktop workflows.
  businessModel: Self-serve per-user subscriptions plus negotiated Teams and Enterprise contracts that bundle governance, dedicated compute, audit logging, and on-premise or private deployment options.
