companyProfile:
  summary: >-
    Factory is a San Francisco private company founded in 2023 that sells model-agnostic autonomous software-development agents called Droids. Public sources show the platform operating across CLI, IDE, desktop, browser, Slack, and partner workflows, with enterprise packaging focused on governance, integrations, and deployment flexibility rather than autocomplete alone. The company moved from a $5 million seed in 2023 to a $150 million Series C at a $1.5 billion valuation in April 2026, while the public record also shows named customer and partner proof across financial services, security, fintech, infrastructure, and global systems integration. The key diligence constraint is financial disclosure quality: the reviewed pack does not disclose ARR, gross margin, retention, or cap-table terms, so the investability call depends on private diligence more than on public narrative.
