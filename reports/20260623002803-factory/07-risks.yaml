- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Security / privacy failure in enterprise deployment
    - Public incident, major postmortem, or customer-confirmed breach
    - Any material exfiltration, unauthorized command execution, or prolonged outage tied to Factory workflows
    - Immediate thesis-break review; pause positive underwriting until root cause, blast radius, and control fixes are validated
  - - Provider dependency and routing fragility
    - Major model-provider outage, policy change, or persistent quality/cost regression
    - Sustained degradation or cost spike that Factory cannot absorb or reroute around within a normal support window
    - Reassess durability of the multi-model moat and gross-margin assumptions
  - - Compliance evidence gap stalls enterprise adoption
    - Large regulated buyer delays or rejects expansion for control / legal reasons
    - Repeated security-procurement failures or no credible DPA / Type II / compliance package by next diligence stage
    - Downgrade sales scalability and require documented compliance roadmap before further conviction
  - - Partner-led rollout underdelivers
    - Wipro / Azure / security-integration expansion fails to translate into durable production deployments
    - No convincing production-scale evidence from flagship channels or clear churn from lighthouse deployments
    - Reduce channel-value assumption and revise customer-acquisition efficiency expectations
  - - Economic quality misses valuation narrative
    - NDA financial pack shows weak retention, poor gross margin, or heavy concentration
    - Revenue efficiency, renewal, or margin profile does not support late-stage software multiple assumptions
    - Treat valuation as stretched or expensive even if topline growth remains strong
  - - Governance and operating system lag growth
    - Rising support load, incident count, or sales expansion without matching control maturity
    - Evidence that hyper-growth is outrunning review rigor, support quality, or risk oversight
    - Apply execution discount and require scaling plan before underwriting durability
  notes: Triggers are designed to be externally monitorable or directly requestable in diligence. They focus on events that would change the underwriting case rather than on soft narrative shifts.
