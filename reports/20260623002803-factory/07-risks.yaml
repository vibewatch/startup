- id: operational-security-and-product-risk
  title: Operational, security, and product reliability risk
  body: 'Factory-specific operational risk comes from the breadth of what Droids are allowed to touch. Agent Readiness, Factory Desktop, Missions, code review, BYOK configuration, mixed-model routing, and Custom Droids all point to a product strategy built around persistent context, delegated execution, and broad reach into the customer’s engineering system. That design can create large productivity gains, but it also widens failure modes. Google Cloud’s 2026 threat-intelligence note organizes the agentic threat surface into what executes, what instructs, what connects, and what extends; Factory’s product suite now spans all four categories. The direct consequence is that a prompt-injection or runtime-configuration failure can propagate into code changes, tool invocations, data exfiltration, or hidden drift in long-running background work.


    Factory does not ignore this risk; in fact, its own product launches make clear that management sees it as central. The Palo Alto Networks announcement explicitly names prompt injection, unauthorized tool calls, exposed data flows, and model misuse. The Snyk partnership says velocity without security is unsustainable for enterprise teams. The automated-security-review launch note says the product scans for OWASP Top 10, OWASP LLM Top 10, injection, broken auth, and secrets-in-logs issues, and further says the deepest coverage still requires a full-repository audit mission. Factory’s enterprise security-review docs extend that posture into scheduled CI and full-repository audits, while its GitHub integration security page says the action runs inside customer GitHub runners with transient checkouts, repository-scoped permissions, and short-lived GitHub App tokens. The CLI security docs also advertise project-directory write limits, command approval, prompt-injection detection, and approval-gated web fetching as built-in protections. Those are meaningful mitigations, but they also reveal the central truth: Factory is simultaneously the tool creating autonomous change and the tool customers rely on to police that change.


    The external adverse evidence is limited but material. An eesel review compiled negative user feedback claiming weak code quality, broken authentication, and opaque token consumption; that is not a decisive indictment, but it is enough to block an assumption that the product is already operationally mature across all use cases. Broader category evidence from OWASP, CSET, Google Cloud, and CACM reinforces that agentic code systems can increase vulnerabilities, technical debt, and hidden execution paths when human review and permissions are weak. Factory’s residual product risk therefore stays high until diligence can verify incident history, auth design, customer approval controls, model-routing safeguards, and empirical false-positive/false-negative rates for its review and security products.'
