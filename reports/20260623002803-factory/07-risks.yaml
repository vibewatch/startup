chapter:
  number: 7
  title: Risks
  summary: Factory's risk profile is high because the company is selling agentic software into security-sensitive enterprises while relying on rapidly changing model providers, broad execution permissions, and still-limited public operating disclosure. The strongest mitigants are real customer proof, explicit security investment, and channel expansion, but the thesis can still break quickly if security controls, compliance evidence, customer retention, or provider governance prove weaker than the marketing narrative.
sections:
- id: severity-ranked-risk-overview
  title: Severity-ranked risk overview
  body: 'Factory is not facing a single existential risk so much as a stacked system of interacting ones. The highest-severity risk is a security-and-governance failure inside an enterprise customer environment: Factory’s own materials, its Palo Alto Networks integration note, its Snyk partnership announcement, OWASP’s 2025 agentic-security guidance, Google Cloud’s 2026 threat-intelligence writeup, and CACM’s 2026 coverage all converge on the same point that agentic coding systems expand the attack surface from generated code into prompts, tool calls, local files, configuration, and background execution. That matters more for Factory than for a lightweight autocomplete tool because Factory sells always-on Droids, background missions, desktop access, local command execution, and multi-surface orchestration across CLI, IDE, browser, chat, and customer systems.


    The second tier of risk is dependency-driven. Factory’s product differentiation is model and interface flexibility, but the same design increases dependence on Anthropic, OpenAI, Google, generic API providers, customer-managed API keys, and enterprise integrations that Factory does not fully control. A provider policy change, outage, quality regression, or price increase can flow directly into customer cost, support burden, and trust. The third tier is financial and commercial: Series C materials and TechCrunch support a $150 million round at a $1.5 billion valuation, but public sources still do not disclose absolute revenue, ARR, burn, renewal, customer concentration, or margin durability. That leaves investors underwriting future governance, retention, and economics with only curated proof points.


    The resulting residual risk rating is high rather than critical because the company has credible mitigants. Factory has real customer references in security-sensitive environments, a stated security architecture, SOC 2 Type I, ISO 42001 positioning, code-review and security-review products, Azure procurement leverage, and a Wipro distribution channel. Those mitigants lower vapor risk, but they do not by themselves answer whether Factory can sustain secure autonomous execution at scale while meeting tightening regulatory expectations and supporting a late-stage valuation. The rest of the chapter separates Factory-specific evidence from category-level risk evidence, then translates both into monitorable triggers, diligence asks, and thesis-break criteria.'
