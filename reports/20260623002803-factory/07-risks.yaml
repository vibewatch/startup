  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public legal and compliance pack
    missingEvidence: Customer-facing DPA, subprocessor list, retention schedule, incident notification terms, and AI-governance pack.
    whyItMatters: Without these documents it is hard to judge whether Factory can scale cleanly into regulated enterprises or whether the public certifications are mainly top-of-funnel signals.
    diligencePath: Request the current enterprise security packet, DPA, privacy annexes, and latest completed customer security questionnaire.
    relatedQuestionRefs:
    - QR008
    - QR029
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: control-evidence depth
    missingEvidence: SOC 2 Type II report or bridge letter, pen-test summary, and security incident history.
    whyItMatters: Public claims of security maturity reduce vapor risk but do not let an investor test whether controls have been operating effectively over time or whether notable incidents have occurred.
    diligencePath: Request SOC 2 Type II timing, bridge materials, latest pen-test executive summary, and any postmortem / incident register excerpt.
    relatedQuestionRefs:
    - QR015
    - QR029
  - type: private-evidence-only
    severity: blocking
    topic: financial quality and valuation support
    missingEvidence: Absolute revenue, ARR, burn, gross margin, runway, and provider-spend mix.
    whyItMatters: The public record supports funding and growth narrative but not valuation quality, margin durability, or cash-efficiency underwriting.
    diligencePath: Obtain a current financial KPI pack with monthly recurring revenue, net retention, gross margin, burn, and cash runway plus driver-level model spend.
    relatedQuestionRefs:
    - QR024
    - QR026
    - QR029
  - type: missing-source
    severity: material
    topic: customer durability and concentration
    missingEvidence: Logo-level revenue concentration, renewal cohorts, deployment depth, and churn or downsell history.
    whyItMatters: Curated case studies prove use, but they do not show whether Factory has broad repeatable retention or outsized dependence on a few lighthouse accounts.
    diligencePath: Request top-10 customer concentration, NRR / GRR, pilot-to-production conversion, and any churn analysis by cohort.
    relatedQuestionRefs:
    - QR020
    - QR029
  - type: enumeration-incomplete
    severity: minor
    topic: TR001 regulatory and legal register coverage
    missingEvidence: Customer-specific sector regulations, negotiated enterprise contract carve-outs, and non-EU jurisdiction requirements that could change legal exposure materially.
    whyItMatters: The public legal and regulatory register is directionally useful but cannot substitute for account-level procurement and jurisdiction analysis.
    diligencePath: Run legal review against sample enterprise paper and map obligations by target vertical and geography.
    relatedQuestionRefs:
    - QR006
    - QR008
    relatedTableRefs:
    - TR001
