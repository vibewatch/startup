tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Rule / license / case
  - Jurisdiction
  - Status
  - Likelihood
  - Severity
  - Mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - EU AI Act GPAI and transparency obligations
    - EU
    - Active / staged implementation through Aug. 2026+
    - Medium
    - High
    - Map Factory controls to GPAI, transparency, logging, and human-oversight duties; produce customer compliance pack
    - High — regulated customers will still demand evidence beyond marketing claims
    - Request AI Act compliance memo, product mapping, and customer-facing control matrix
  - - Privacy-law and customer-data handling obligations
    - US / EU / other customer jurisdictions
    - Factory privacy policy discloses personal-data and repo-metadata processing plus CCPA/CNIL rights
    - Medium
    - High
    - Use DPAs, retention controls, least-privilege repo access, and customer segmentation of hosted vs local modes
    - High — public materials do not include DPA, subprocessor list, or retention schedule
    - Obtain DPA, retention policy, subprocessors, and deletion SLAs under NDA
  - - Customer-output accuracy and local-command liability allocation
    - Contractual / global
    - Terms require customer verification of outputs and place customer-environment responsibility on the customer
    - High
    - High
    - Constrain execution modes, require approvals, and document safe-operating procedures for local software
    - High — contract shifts rather than removes legal and operational burden
    - Review enterprise order forms, negotiated carve-outs, and customer approval controls
  - - Binding arbitration and indemnity scope
    - US contractual
    - Terms require arbitration and limit remedies while indemnifying only certain IP claims
    - Medium
    - Medium
    - Negotiate enterprise paper with stronger incident, service, and data-protection provisions
    - Medium — default online terms may be unacceptable to large regulated buyers
    - Compare standard terms with enterprise MSAs and customer redlines
  - - Copyright and IP exposure in AI code tools category
    - US / EU
    - Category-level litigation and copyright scrutiny remain active
    - Medium
    - High
    - Maintain attribution / duplication controls, secure indemnities from model vendors where possible, and limit risky training or output use
    - Medium-High — category legal uncertainty can slow procurement even without a Factory-specific case
    - Ask for IP-risk policy, vendor indemnity back-to-backs, and any open disputes
  - - Certification depth and audit evidence gap
    - Global enterprise procurement
    - Factory public evidence shows SOC 2 Type I and ISO 42001 positioning, but not a public Type II or bridge package
    - Medium
    - Medium
    - Continue control maturation and provide customer-ready audit artifacts
    - Medium — may not block pilots but can slow scaled regulated deployment
    - Request SOC 2 Type II timeline, bridge letter, pen-test summary, and security questionnaire responses
  notes: Rows are ordered by severity and reflect a mix of Factory-specific legal documents and category-level AI-governance requirements. The table is intentionally partial because public evidence does not expose enterprise paper, negotiated security addenda, or all jurisdiction-specific obligations.
