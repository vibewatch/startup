  - id: TV001
    title: Recommendation summary table
    columns:
      - Lens
      - Current read
      - Public support
      - Decision implication
      - What changes the view
    rows:
      - - Recommendation
        - Research-more
        - A real franchise is visible, but current price support is only directional
        - Do not treat the reported >$2.2B mark as fully underwritten
        - Upgrade only after filing-grade financial and cap-table disclosure
      - - Confidence
        - Medium
        - The direction of value is credible while the precision of value is weak
        - Use a range and haircut, not a point estimate
        - Confidence rises with audited statements and prospectus disclosure
      - - Risk rating
        - High
        - Preference-stack opacity and multiple dispersion make downside asymmetric
        - Require hard diligence gates before any new money
        - Risk falls if the waterfall and treasury picture are clean
      - - Valuation stance
        - Fair to slightly stretched at reported >$2.2B
        - 5.1x revenue is plausible but already above mature-security floors
        - Avoid paying premium-enterprise multiples off secondary reporting
        - Stance improves if marketed pricing moves closer to the IPO-haircut band
      - - IPO readiness
        - Partial
        - Scale, profitability, and process signals exist, but filing-quality disclosure is absent
        - Treat IPO timing as contingent, not bankable
        - A filed prospectus and audited consolidation would materially improve readiness
      - - Most relevant peer lens
        - Hybrid profitable security vendors plus selected enterprise leaders
        - Bitdefender is neither a pure consumer antivirus stub nor a pure cloud EDR compounder
        - Anchor to mixed-vendor peers first and use enterprise leaders only as ceiling references
        - View changes if business mix and disclosure start to resemble enterprise-only peers
    notes: >-
      This table converts the chapter’s evidence into an investment posture rather than a management-quality score;
      current price discipline matters more than admiration for the company.
    claimRefs:
