  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Reported anchors support a real franchise, but not a public-market premium by default
        blocks:
          - type: paragraph
            body: >-
              Bitdefender’s valuation conversation has to start from the reported anchors rather than from aspiration.
              The first anchor is historical and relatively firm: the 2017 Vitruvian transaction was publicly described
              by Bitdefender and multiple independent outlets as a roughly 30 percent stake sale valuing the company
              above 600 million dollars. The second anchor is current but much weaker: ZF and Aleph both say Bitdefender
              is now targeting a June 2026 U.S. IPO around an implied valuation above 2.2 billion dollars. ZF adds the
              arithmetic behind that figure, tying it to preferred shares valued at 666 million dollars and option
              economics that point to a share price around 10.4 dollars. Those details are useful because they show the
              reported mark is not arbitrary, but they still come through secondary reporting rather than a filed
              prospectus.


              The operating picture is stronger than the disclosure picture. ZF says the group produced 434.5 million
              dollars of 2024 revenue and 56 million dollars of operating profit, while Forbes says 2023 revenue reached
              391.9 million dollars with 85 million dollars of adjusted operating profit. That is enough to establish a
              scaled and profitable cybersecurity business. It is not enough to justify Bitdefender as a pure cloud-EDR
              multiple story. Official pages and ZF’s 58 percent consumer and 42 percent business mix show a hybrid
              model. That hybrid mix supports real value, but it also means the right comparison set has to span both
              premium enterprise names and lower-multiple mature security vendors.
            claimRefs:
