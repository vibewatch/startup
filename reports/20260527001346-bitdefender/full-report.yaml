  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Enterprise platform and architecture
        blocks:
          - type: paragraph
            body: >-
              Bitdefender’s enterprise story is broader than “endpoint AV plus EDR.” The current public package stack
              starts with SMB suites, moves into Business Security Enterprise as the main prevention-plus-EDR control
              plane, then expands into XDR sensors, a bundled Defense XDR offer, and MDR or MSP overlays. The
              architectural logic is consistent across the product pages: a lightweight endpoint agent does prevention
              and risk reduction first, then native sensors extend visibility into identity, network, cloud,
              productivity, and selected business-application surfaces. That matters because the company is not selling
              a collection of unrelated point tools; it is selling a shared control plane whose differentiation is
              supposed to be automated correlation with low operator overhead. The moat is most credible where the
              sources describe real layer reuse: fileless defense, tunable AI or ML, sandboxing, ransomware mitigation,
              risk scoring, live search, and incident views are all presented as parts of one operating stack. The
              weaker point is that much of this architecture is still described by Bitdefender itself rather than by
              independent architecture deep dives, so the chapter should treat workflow claims as directionally credible
              but not fully independently proven.
