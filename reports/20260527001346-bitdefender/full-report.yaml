  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Audited consolidated financials
        - Income statement, balance sheet, cash flow, and notes for the group
        - Required to replace proxy multiples with a real EV and cash-generation view
        - Request the latest audited package and audit committee materials
      - - Preferred-share economics
        - Conversion mechanics, liquidation preference, participation, and ratchets
        - Determines whether the reported 2.2B mark is meaningful for common equity
        - Obtain the shareholder agreement and a fully diluted waterfall
      - - Cash and debt detail
        - Cash balance, debt maturities, covenants, and any refinancing plan
        - Needed to judge downside resilience and IPO-readiness
        - Request treasury schedules and lender reporting packs
      - - Segment economics
        - ARR, retention, gross margin, segment margin, and cohort data for consumer versus business
        - Needed to know whether Bitdefender deserves a higher enterprise-like multiple
        - Request board KPI packs and segment bridges
      - - IPO workstream
        - Banker mandate, target venue, filing status, and readiness timeline
        - Tests whether June 2026 is a real process or only reported intent
        - Request the IPO workplan and legal readiness checklist
      - - Enterprise proof
        - Customer quality, large-account mix, and evidence that enterprise share is rising
        - Supports or refutes the anti-thesis that Bitdefender is still too consumer-heavy for a premium mark
        - Request cohort data, referenceable customers, and sales-mix detail
    notes: >-
      These asks are the minimum package needed to move from directional public-comparable logic to an investable
      underwriting view.
    claimRefs:
