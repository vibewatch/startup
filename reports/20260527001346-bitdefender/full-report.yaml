      - number: '8.2'
        title: Public comps put the reported 2.2 billion dollar mark in the middle of the cyber range, not at the top
        blocks:
          - type: paragraph
            body: >-
              Using public valuation-to-revenue logic, Bitdefender’s reported 2.2 billion dollar anchor implies roughly
              5.1 times 2024 revenue. That screens far below CrowdStrike’s roughly 35.5 times and Palo Alto Networks’
              roughly 21.1 times, below Fortinet’s 14.5 times, close to SentinelOne’s 6.3 times, and above Gen Digital’s
              3.2 times and Trend Micro’s 2.8 times. The dispersion itself is the point. Public cyber is not one
              multiple story. Pure cloud-native, enterprise-only, high-growth platforms can sustain extreme premiums.
              Profitable but more mixed or consumer-exposed vendors trade much lower. Bitdefender’s reported anchor
              already lands well above the mature consumer-security floor but nowhere near the enterprise-cloud ceiling.


              That is why the right output is a scenario band. A bear case at 3.5 to 4.5 times revenue supports roughly
              1.5 to 2.0 billion dollars if disclosure remains sparse, IPO markets soften, or investors treat the
              business as a mixed-security vendor with a private-company discount. A base case at 4.5 to 6.0 times
              supports roughly 2.0 to 2.6 billion dollars and therefore brackets the reported 2.2 billion dollar anchor.
              A bull case at 6.0 to 7.5 times would require much stronger enterprise proof, cleaner filing-grade
              disclosure, and comfort that the preference stack does not absorb common-equity upside. Even before that,
              a 15 to 25 percent IPO haircut to the reported mark points to a marketed value closer to 1.65 to 1.87
              billion dollars.
            claimRefs:
