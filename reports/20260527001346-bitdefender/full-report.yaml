      - number: '6.2'
        title: How customer acquisition and distribution work
        blocks:
          - type: paragraph
            body: >-
              The acquisition model is clearly multi-route. For households, the path is low-friction and largely
              self-serve: editorial reviews, direct web pricing, and app-store trials are all visible without any sales
              contact. For business accounts, Bitdefender still runs a consultative sales motion, evidenced by its
              inquiry form that screens for employee count and geography before routing the buyer to a representative.
              But the bigger pattern is partner leverage. Bitdefender’s core channel pages emphasize a 40,000-plus
              partner network, protected recurring revenues, deal registration, and partner-locator search by reseller,
              distributor, or MSP type. Its MSP-specific page goes further by describing monthly consumption billing
              through distributors and RMM partners, no minimum commitments, and multi-tenant console control—clear
              evidence that much of SMB distribution is designed to flow through service providers, not only direct
              reps. Independent channel media reinforces that this route remains strategic: 2025-2026 coverage describes
              a refreshed program with platinum tiering, deeper NFR access for MSPs, and simplified deal registration
              intended to improve partner economics and faster demo-led selling. Finally, Bitdefender also reaches
              buyers through AWS Marketplace and an OEM licensing motion, which broadens procurement options but makes
              direct-versus-indirect customer ownership less transparent from public sources.
