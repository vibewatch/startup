companyProfile:
  summary: >-
    Bitdefender is a Bucharest-headquartered cybersecurity vendor founded in 2001 by Florin and Mariuca Talpeș. The
    company sells a hybrid portfolio spanning GravityZone endpoint protection, EDR, XDR, MDR, MSP, and
    threat-intelligence products alongside a consumer security-suite business, giving it broader market coverage than
    enterprise-only cyber peers. Public reporting points to about $435M of 2024 group revenue, $56M of operating profit,
    2,061 employees, and more than $90M of R&D spend, while the clearest capital history anchors are the 2017 Vitruvian
    deal at more than $600M valuation and reported planning for a possible June 2026 U.S. IPO at more than $2.2B. The
    underwriting caveat is that Bitdefender remains private and still does not disclose audited consolidated statements,
    ARR/NRR, cash/debt, or preferred-share waterfall terms.
