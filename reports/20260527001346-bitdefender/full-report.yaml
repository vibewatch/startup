  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation follows directly from real operating proof, hybrid-model discounting, and unresolved disclosure
      gaps.
    data:
      nodes:
        - id: n1
          label: Long history + profit
          detail: 2001 origin plus visible 2023-2024 operating profit
        - id: n2
          label: Hybrid mix
          detail: Consumer and business revenue both matter
        - id: n3
          label: Comp dispersion
          detail: Public cyber spans ~2.8x to ~35.5x revenue
        - id: n4
          label: Disclosure gap
          detail: No public cash, waterfall, ARR, or full filing package
        - id: n5
          label: Range not mark
          detail: Public output is a valuation band
        - id: n6
          label: Research-more
          detail: Fair-to-slightly-stretched at >$2.2B unless disclosure improves
      edges:
        - from: n1
          to: n5
          label: Supports floor value
        - from: n2
          to: n5
          label: Compresses multiple
        - from: n3
          to: n5
