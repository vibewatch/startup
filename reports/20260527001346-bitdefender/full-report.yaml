  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and excluded adjacencies
        blocks:
          - type: paragraph
            body: >-
              A disciplined market definition starts with what Bitdefender actually sells, not with a generic
              cybersecurity TAM. Retained official pages show two monetization lanes. On the consumer side, Bitdefender
              sells recurring security subscriptions that now bundle device protection with VPN, password management,
              scam defense, dark-web monitoring, identity protection, and theft-insurance features. On the business
              side, its center of gravity is endpoint-first: endpoint protection, EDR, XDR, risk management, and
              MDR-oriented packages sold directly or through MSPs. The TechZone explainer is useful because it
              explicitly places EPP, EDR, XDR, and MDR on a continuum rather than as four unrelated markets. The
              excluded side matters just as much. Bitdefender does not justify counting broad network-security budgets,
              IAM, generic SIEM, cloud posture, or consulting-led managed security as if they were all addressable
              revenue pools. That would inflate the narrative and hide the fact that Bitdefender wins by being an
              endpoint-led hybrid vendor with both consumer and channel-driven enterprise distribution, not by owning
              every cyber control category.
