      - number: '2.3'
        title: Buyer, user, payer, and channel segmentation
        blocks:
          - type: paragraph
            body: >-
              The buyer map is one reason Bitdefender is easy to misread if you only look at enterprise XDR. In consumer
              security, the buyer, user, and payer usually collapse into one person or household purchasing device,
              privacy, and identity coverage together. In direct small-business deals, Bitdefender’s own packaging
              suggests the buyer is usually an owner or IT generalist who values low-overhead protection rather than
              analyst-grade tooling. The channel-led SMB motion is different: the MSP buys, provisions, and operates the
              platform, but the end customer ultimately funds the monthly bill, which makes the partner channel
              economically central rather than merely referral-driven. Mid-market enterprise buying shifts toward
              security and platform teams evaluating EDR, XDR, and investigation efficiency, while regulated enterprises
              add compliance, retention, and residency questions that can make budgets more durable. Official and
              independent channel sources reinforce that Bitdefender has built real MSP infrastructure around this
              model, including pay-as-you-go provisioning, NFR access, and training intended to let partners resell and
              operate the stack.
