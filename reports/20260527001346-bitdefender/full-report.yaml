  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale / market signal
      - Target segment
      - Key differentiation
      - Primary limitation vs. Bitdefender
    rows:
      - - Bitdefender
        - Hybrid B2B + B2C security vendor
        - Catalog spans SMB, enterprise, MSP, and consumer offers
        - MSP, SMB, mid-market, selective enterprise, households
        - Strong prevention reputation, low-overhead agent messaging, and cross-segment brand reach
        - Less default cloud / identity / SOC breadth than the biggest platform vendors
      - - CrowdStrike
        - Enterprise endpoint / XDR leader
        - AI-native Falcon platform plus broad partner motion
        - Large enterprise and SOC-led cloud-first buyers
        - Single lightweight sensor and broad exposure-management story
        - Higher budget and heavier enterprise operating model than many SMB buyers need
      - - SentinelOne
        - Autonomous XDR platform
        - Fortune 10 and Global 2000 references
        - Enterprise security teams and hybrid-cloud buyers
        - Enterprise-wide endpoint, cloud, and identity platform
        - Less consumer reach and less MSP heritage than Bitdefender
      - - Palo Alto Cortex
        - Security-platform incumbent
        - Cortex plus Unit 42 services
        - Large enterprise and regulated SOCs
        - Deep SOC integration and single-data-lake story
        - Heavier platform stack and less SMB simplicity
      - - Microsoft Defender
        - Bundled security platform
        - Windows and Microsoft 365 installed-base leverage
        - SMB, Microsoft-standardized mid-market and enterprise, households
        - Bundle power, built-in Windows Security, and Lighthouse multi-tenancy
        - Value depends heavily on Microsoft ecosystem standardization
      - - Sophos
        - MDR + MSP/channel incumbent
        - 39,000+ MDR customers and partner-first MSP system
        - MSPs, SMBs, mid-market, regulated sectors
        - Vendor-agnostic MDR plus explicit MSP billing and tooling
        - Less consumer reach and less enterprise platform mindshare than Microsoft or CrowdStrike
      - - Trend Micro
        - SecOps / XDR incumbent
        - Broad partner program and native sensor coverage
        - Mid-market and enterprise SOC teams
        - Unified XDR, agentic SIEM, and SOAR narrative
        - Narrative centers on SecOps depth rather than low-friction endpoint simplicity
      - - Trellix
        - XDR / operations incumbent
        - 500+ integrations across 230 vendors
        - Large organizations with existing tool estates
        - Multi-vendor correlation and no-code automation
        - Public evidence highlights platform complexity more than ease of use
      - - ESET
        - Channel-led endpoint / XDR incumbent
        - 500,000 protected business customers in 178 countries
        - SMB, mid-market, Europe-heavy and regulatory-sensitive buyers
        - Light footprint, private-company continuity, and low-false-positive positioning
        - Lower US enterprise mindshare than the biggest public-platform peers
      - - Fortinet
        - Security-platform adjacent EDR
        - Security Fabric and OT / legacy deployment fit
        - Regulated enterprise, OT/IT convergence, Fortinet estates
        - Lightweight agent, hybrid deployment, and legacy OS support
        - Often wins as part of a wider Fortinet estate rather than as a pure endpoint default
      - - Norton / Gen
        - Consumer suite substitute
        - Large consumer brand and aggressive published consumer ladder
        - Households and prosumers
        - Identity, VPN, backup, and scam-protection bundles
        - Limited relevance for enterprise endpoint/XDR
      - - McAfee / Avast
        - Consumer suite substitutes
        - Trusted-by-millions and free-to-paid consumer motions
        - Households, family plans, prosumers
        - All-in-one privacy, scam, and device-protection packaging
