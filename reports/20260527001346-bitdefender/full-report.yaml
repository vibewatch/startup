  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / public signal
      - Transmission to thesis
      - Action implication
    rows:
      - - IPO process stays unfiled
        - No filed prospectus or equivalent public listing package despite active IPO messaging
        - Turns the June 2026 path into a marketing aspiration rather than a diligence event
        - Assume more delay and apply the bear-band or walk away
      - - Preference stack proves harsher than expected
        - New disclosure reveals aggressive liquidation preference, participation, or anti-dilution terms
        - Common-equity upside can compress even if operations are healthy
        - Reset valuation lower and require stronger downside protection
      - - Public comp median compresses further
        - Relevant mixed-security peers drift toward the 3x revenue area or below
        - Bitdefender’s 5.1x anchor becomes harder to defend without better disclosure
        - Tighten entry price or defer until the market stabilizes
      - - Enterprise proof fails to improve
        - Business mix stays near current levels without better retention, margin, or cohort disclosure
        - The story remains hybrid but not premium
        - Hold the framework at mature-peer bands rather than expanding to enterprise premiums
      - - Treasury picture disappoints
        - Cash, debt, or covenant disclosures imply weaker liquidity than operating profit suggests
        - Valuation-to-revenue proxy overstates equity safety
        - Move to the low end of the range or abandon the IPO-ready thesis
    notes: >-
      Triggers are designed to be monitorable from public filings or direct diligence requests rather than from vague
      sentiment shifts.
