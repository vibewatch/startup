  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Product-security and trust risk
        blocks:
          - type: paragraph
            body: >-
              Bitdefender’s first non-generic risk is the security-vendor paradox: the company sells trust, prevention,
              and low-noise protection, yet its own products continue to show up in disclosed vulnerability trails. The
              2024 vendor advisory on GravityZone Update Server described arbitrary-code-execution exposure, and NVD
              entries in 2025 extended the story into GravityZone Console SSRF and deserialization issues plus a local
              privilege-escalation path in consumer Total Security. None of these disclosures alone proves systemic
              failure; vendor advisories and NVD references also show patching and remediation. But that is not the
              right underwriting lens. The right lens is residual trust damage when a security vendor’s enterprise
              control plane and consumer suite both appear in CVE feeds. The quality story adds another layer.
              Bitdefender’s own documentation says false positives can create alert fatigue, delayed response, and
              compliance risk, and it maintains explicit workflows for legitimate applications detected as threats.
              Public review surfaces make the reputational side concrete: ProductReview and ComplaintsBoard skew
              negative on renewal friction, early charges, cancellations, and support experience, while BBB hosts an
              active complaints surface. For a vendor whose product promise is low-friction protection, the combination
              of own-CVE visibility, false-positive handling, and billing or support criticism is a real customer-trust
              risk rather than a mere support nuisance.
            claimRefs:
