- id: TP003
  title: Independent comparison evidence and caveats
  columns:
  - Evidence lens
  - Vendors explicitly visible in retained set
  - What it says
  - Why it matters
  - Key caveat
  rows:
  - - AV-Comparatives Business Main-Test 2025
    - Bitdefender, Microsoft, Sophos, Trellix, CrowdStrike, ESET
    - Shows Bitdefender near the top of retained protection rates and discusses buyer fit by company size and console style.
    - Best retained like-for-like enterprise testing evidence in this chapter.
    - Vendor configurations were tuned for the test and AV-Comparatives says business and consumer series are not comparable.
  - - AV-TEST Business Windows 11 Feb 2026
    - Business products on an 18-point protection / performance / usability framework
    - Shows the scoring system used for current Windows business tests.
    - Useful for balancing raw protection with performance and usability.
    - The retained page is a framework page rather than a clean vendor score table.
  - - SE Labs enterprise and home report program
    - Enterprise, SMB, and home report tracks plus named advanced-security reports for CrowdStrike, Palo Alto, and Fortinet
    - Confirms that enterprise and consumer security are tested in separate report families.
    - Supports using different evidence lenses for enterprise endpoint/XDR and consumer suites.
    - The retained page is a report index, not one normalized scorecard.
  - - Vendor-authored MITRE references
    - Bitdefender, CrowdStrike, SentinelOne, Palo Alto
    - Major enterprise rivals all cite MITRE ATT&CK rounds as competitive proof points.
    - Shows MITRE still matters in enterprise buying narratives.
    - In the retained set, the extractable detail is mostly vendor-authored rather than a canonical cross-vendor score sheet.
  - - AV-Comparatives Consumer Results
    - Consumer brands including Avast and Microsoft
    - Consumer test history sits on a separate page and evaluation stream from business testing.
    - Helpful when comparing Bitdefender Ultimate Security to household substitutes.
    - Consumer results should not be used as a proxy for enterprise console quality or MDR depth.
  - - AV-TEST Home Windows 11 Feb 2026
    - Home products on the same 18-point framework
    - Applies the same high-level categories to household products.
    - Adds a consumer scoring lens for suite buyers.
    - Home scoring still does not capture enterprise service wrappers, channel motion, or SOC tooling.
  notes: This exhibit is about evidence quality, not a single league table. The chapter deliberately uses separate enterprise and consumer testing lenses because the retained labs themselves describe them as different test universes.
