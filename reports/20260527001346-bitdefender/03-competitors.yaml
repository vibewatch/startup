- id: TP004
  title: Pricing / packaging comparison
  columns:
  - Offer
  - Customer lens
  - Public price / bundle signal
  - Included capabilities
  - What is unknown
  - Strategic implication
  rows:
  - - Bitdefender Business Security Enterprise
    - Business
    - Quote-led; partner-driven purchase after demo or trial
    - Endpoint prevention, EDR, risk analytics, and optional XDR sensors or MDR
    - No retained public per-endpoint or contract-floor price
    - Harder to anchor against public bundle benchmarks, especially in SMB and mid-market deals
  - - Microsoft Defender for Business
    - SMB business
    - Cost-effective package tied to Microsoft security and server add-ons
    - Defender Antivirus, EDR, attack-surface reduction, AIR, vulnerability management, multi-tenant Lighthouse support
    - Retained page does not expose a clean public list price
    - Creates strong bundle pressure in organizations up to 300 employees
  - - CrowdStrike Falcon endpoint + exposure
    - Enterprise
    - No retained public list price
    - Endpoint security, exposure management, SIEM/SOAR adjacency, single-sensor story
    - Contract, seat, and service pricing remain opaque in retained sources
    - Wins where buyers accept higher budget for broader platform outcomes
  - - Sophos MDR + MSP system
    - MSP and mid-market
    - Usage-based and aggregated-billing advantages are explicit; end-customer MDR pricing is not
    - MDR, endpoint, email, firewall, Microsoft integrations, centralized delivery
    - Public end-customer price card is not retained
    - Very strong channel economics and service-wrapper story versus Bitdefender
  - - Bitdefender Ultimate Security
    - Consumer and prosumer
    - Dynamic web pricing plus free trial; no clean retained static price card
    - Antivirus, unlimited VPN, password manager, identity protection, parental controls, family tiers
    - The retained static fetch does not preserve a clean first-year ladder
    - Suite breadth is strong, but retained pricing transparency is weaker than Norton’s
  - - Microsoft Defender for Individuals
    - Consumer household
    - Requires Microsoft 365 Personal, Family, or Premium subscription
    - Cross-device management, identity theft monitoring, credit monitoring, anti-phishing, and platform-specific protection
    - Incremental stand-alone security price is absent because the bundle is the product
    - A powerful indirect substitute for households already paying Microsoft
  - - Norton AntiVirus Plus / 360
    - Consumer household
    - 29.99 dollars first year for one device; 49.99 dollars first year for 5-device Deluxe tier
    - Scam protection, password manager, cloud backup, VPN, privacy monitoring, parental controls at higher tiers
    - Renewal pricing is materially higher after introductory discounts
    - Sets a visible retail price anchor that Bitdefender has to defend against
  - - McAfee Total Protection / McAfee+
    - Consumer family
    - Dynamic price widget; 5-device and unlimited-device tiers are explicit
    - Antivirus, scam protection, VPN, privacy cleanup, and identity coverage up to 2 million dollars
    - The retained static fetch hides exact first-term prices
    - Broad identity-and-privacy bundling keeps consumer pressure high even without a clean static price
  - - Avast One
    - Consumer and freemium ladder
    - Retained page exposes features rather than a stable static price
    - Antivirus, VPN, anti-scam, privacy, and optimization
    - Exact paid ladder is not preserved in retained static text
    - Free-to-paid ladder and simple bundle messaging pressure conversion economics
  notes: The table separates quote-led enterprise purchasing from household retail bundles. Unknown or dynamic fields are marked explicitly instead of being backfilled from memory or non-retained widgets.
