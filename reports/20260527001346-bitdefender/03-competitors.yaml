- id: FP003
  title: Bitdefender moat / readiness KPIs
  type: kpi
  layout: standard
  summary: Bitdefender’s readiness scorecard is strongest on hybrid market coverage and channel relevance, but the retained evidence points to high platform-breadth and bundle pressure from larger rivals.
  data:
    items:
    - label: Hybrid market exposure
      value: B2B + B2C
      note: Business catalog plus consumer flagship widen the battlefield and the TAM.
    - label: Enterprise default breadth
      value: EDR default; XDR add-on
      note: Bitdefender expands beyond endpoint, but more modularly than some platform rivals.
    - label: MSP / channel posture
      value: Strong
      note: Catalog includes MSP offers and enterprise licensing flows through partners.
    - label: Independent test support
      value: Strong but segmented
      note: Retained lab evidence is favorable, but business and consumer series are not directly comparable.
    - label: Bundle pressure
      value: High
      note: Microsoft 365 / Windows plus retail suites compress willingness to pay in SMB and household segments.
    - label: Big-platform threat
      value: High
      note: CrowdStrike, SentinelOne, Palo Alto, Trend, Trellix, and Fortinet all sell broader ecosystems around endpoint security.
  approximationNotes: KPIs are judgment summaries anchored in retained evidence rather than audited external scorecards. They are intended to express competitive durability, not financial performance.
  claimRefs:
  - CP003
  - CP005
  - CP018
