  rows:
  - - Bitdefender
    - Hybrid B2B + B2C security vendor
    - Catalog spans SMB, enterprise, MSP, and consumer offers
    - MSP, SMB, mid-market, selective enterprise, households
    - Strong prevention reputation, low-overhead agent messaging, and cross-segment brand reach
