    "number": 4,
    "title": "Financials",
    "summary": "Bitdefender’s public financial picture is directionally strong but perimeter-sensitive. ZF and Forbes expose a profitable 2023-2024 group trajectory with 2024 revenue of $434.5 million and operating profit of $56 million, while Profit.ro and Romanian registry aggregators show Bitdefender SRL returning to RON 1.67 billion of revenue and RON 239.6 million of net profit in 2024 after a 2023 accounting-driven statutory loss. The main diligence blocker is not scale or profitability, but the lack of audited consolidated statements, current liquidity disclosure, and full preferred-share economics."
  },
