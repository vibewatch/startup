- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Microsoft bundling and platform competition
    - Enterprise mix and business-growth signal
    - Business share fails to rise meaningfully above the 42% 2024 level while Microsoft share keeps climbing
    - Assume multiple pressure persists and do not underwrite public-comp parity
  - - Security-vendor trust damage
    - New disclosed Bitdefender CVEs or materially exploited flaws
    - Any additional high-severity enterprise control-plane issue or repeated consumer privilege flaw without a clear remediation narrative
    - Escalate product-quality diligence and downgrade trust assumptions
  - - Billing / support friction
    - Public review and complaint intensity
    - Another sustained wave of renewal, refund, or cancellation complaints across major review surfaces
    - Assume higher consumer churn and lower brand elasticity
  - - Private-company opacity
    - IPO preparation disclosure package
    - No audited consolidated statements, cash and debt schedule, or preference-term summary before formal IPO marketing
    - Treat exit timing as uncertain and price in higher downside on valuation
  - - Founder and governance concentration
    - Succession and governance disclosure
    - No credible succession path or board-governance expansion while IPO plans advance
    - Treat key-person risk as unresolved and require governance covenants or discount
  - - Regulated-buyer trust and sovereignty traction
    - Sovereign-hosting and public-sector conversion proof
    - No measurable sovereign-hosting wins, regulated-sector references, or procurement progress despite heavy positioning
    - Assume public-sector narrative is more sales collateral than durable moat
