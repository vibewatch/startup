  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Direct-versus-channel revenue mix, enterprise account count, top-customer concentration, and NRR/GRR disclosure.
    whyItMatters: Without this, the channel and customer-quality risks stay directional rather than underwritable.
    diligencePath: Request the latest board pack or GTM metrics showing direct vs indirect mix, enterprise accounts, largest customers, and renewal metrics.
    relatedQuestionRefs:
    - QR014
    - QR030
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: preference-terms
    missingEvidence: Actual preferred-share documents, liquidation and conversion terms, cash balance, debt schedule, and audited consolidated statements.
    whyItMatters: The difference between operating profit and accounting equity can materially change IPO readiness and downside outcomes.
    diligencePath: Obtain audited consolidated financials plus the preference-stack summary memo used for IPO preparation.
    relatedQuestionRefs:
    - QR019
    - QR020
    - QR021
    - QR030
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: governance-transparency
    missingEvidence: Current board composition, committees, voting rights, major shareholders, and formal succession planning for Florin Talpeș.
    whyItMatters: Founder centrality is easier to underwrite when governance and succession are explicit rather than implied.
    diligencePath: Request the current cap table, shareholder agreement summary, board list, committee chart, and succession planning materials.
    relatedQuestionRefs:
    - QR022
    - QR023
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: mdr-service-operations
    missingEvidence: Public or private evidence on MDR SLA attainment, SOC staffing, analyst ratios, and post-Horangi service adoption.
    whyItMatters: Execution risk on the services side is real, but current public proof is mostly narrative rather than operational.
    diligencePath: Ask for MDR service KPIs, customer references, attachment rates, incident-response SLAs, and Horangi integration milestones.
    relatedQuestionRefs:
    - QR026
    - QR029
    relatedTableRefs:
    - TR002
    - TR004
  - type: missing-source
    severity: material
    topic: regulated-buyer-traction
    missingEvidence: Quantified public-sector or regulated-enterprise revenue, sovereign-hosting adoption, and procurement win-rate data.
    whyItMatters: The public trust and residency narrative may be strategically important, but it is still thinly quantified.
    diligencePath: Request regulated-sector pipeline, sovereign-hosting bookings, public-sector references, and certification roadmap materials.
