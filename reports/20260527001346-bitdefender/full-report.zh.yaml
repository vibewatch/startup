  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Bitdefender 的竞争集合异常宽，因为公司不只是终端或 XDR 厂商。保留的业务目录覆盖 SMB、企业、MSP 和附加品类；消费者旗舰套件则把杀毒、VPN、身份保护和家长控制打包成一体化套件。这意味着
              Bitdefender 在企业账户中直接对抗 CrowdStrike、SentinelOne、Palo Alto、Microsoft、Sophos、Trend Micro、Trellix、ESET 和
              Fortinet 等企业优先的终端与 XDR 平台，同时又在消费者和专业消费者场景中面对 Microsoft Defender、Norton、McAfee 和 Avast 这些替代品。


              实际含义是，不同买家用完全不同的尺子评估 Bitdefender。SMB 和 MSP 买家关心部署可控、负担低、许可对渠道友好。大型企业更在意云、身份、邮件和 SOC
              工作流上的平台宽度。家庭买家比较便利性套装、身份权益、首年价格，以及安全是否已经捆进 Windows 或 Microsoft 365。因此，Bitdefender 的 B2B + B2C
              混合模式是真差异，但也迫使公司同时在不止一条价格阶梯、不止一个品牌战场上作战。
