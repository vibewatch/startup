  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 产品安全与信任风险
        blocks:
          - type: paragraph
            body: >-
              Bitdefender 的第一个非泛化风险，是安全厂商悖论：公司出售信任、预防和低噪音保护，但自家产品仍不断出现在已披露漏洞线索里。 2024 年关于 GravityZone Update Server
              的厂商公告描述了任意代码执行暴露；2025 年 NVD 条目把问题延伸到 GravityZone Console 的 SSRF 与反序列化问题，以及消费者版 Total Security 的本地提权路径。
              单看任何一个披露，都不能证明系统性失灵；厂商公告和 NVD 引用也显示公司在打补丁、修复。 但承销不该这样看。真正要看的，是安全厂商的企业控制平面和消费者套件同时出现在 CVE 信息流里时，
              残留的信任损伤。质量故事还叠加一层。Bitdefender 自家文档称，误报会带来警报疲劳、响应延迟和合规风险， 并且维护了合法应用被识别为威胁时的明确处理流程。公开评价把声誉侧具体化：ProductReview
              和 ComplaintsBoard 在续费摩擦、提前扣费、取消和支持体验上偏负面，BBB 也有活跃投诉页面。 一个承诺低摩擦保护的厂商，同时存在自有 CVE
              可见度、误报处理和计费或支持批评，这是真实的客户信任风险， 不只是支持工单麻烦。
