  - id: TV005
    title: 投资逻辑破裂与终止触发条件表
    columns:
      - 触发条件
      - 阈值 / 公开信号
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - IPO 流程迟迟未申报
        - 虽然 IPO 信息释放活跃，但没有已提交招股书或等效公开上市材料
        - 结果会把 2026 年 6 月路径变成营销愿景，而非尽调事件
        - 假设继续延迟，采用悲观区间或退出
      - - 优先股堆叠比预期更苛刻
        - 新披露显示激进清算优先权、参与权或反稀释条款
        - 即使运营健康，普通股上行也会被压缩
        - 下调估值，要求更强下行保护
      - - 上市可比公司中位数继续压缩
        - 混合型安全同业滑向 3x 收入倍数区域或更低
        - 没有更好披露时，Bitdefender 的 5.1x 锚点更难站住
        - 收紧入场价格，或等市场稳定后再推进
      - - 企业业务证据未能改善
        - 业务结构停留在当前水平，留存、利润率或队列披露没有改善
        - 故事仍是混合型，而非高溢价企业级
        - 将框架保持在成熟同业区间，不上调到企业级溢价
      - - 资金状况令人失望
        - 现金、债务或契约披露显示流动性弱于营业利润暗示
        - 估值 / 收入代理指标高估了股权安全性
        - 移到区间低端，或放弃 IPO 就绪逻辑
    notes: 触发条件设计成可从公开文件或直接尽调请求中监测，而不是依赖模糊情绪变化。
    claimRefs:
      - CV032
      - CV033
      - CV037
      - CV041
      - CV042
      - CV044
      - CV046
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 经审计合并财务
        - 集团损益表、资产负债表、现金流量表和附注
        - 需要用真实 EV 和现金生成视角替代代理倍数
        - 要求提供最新审计包和审计委员会材料
      - - 优先股经济性
        - 转换机制、清算优先权、参与权和棘轮条款
        - 决定据报道 2.2B 估值标记对普通股是否有意义
        - 获取股东协议和完全摊薄分配瀑布
      - - 现金和债务细节
        - 现金余额、债务到期、契约和任何再融资计划
        - 判断下行韧性和 IPO 准备度所需
        - 要求提供资金明细表和贷方报告包
      - - 分部经济性
        - 消费者与企业业务的 ARR、留存、毛利率、分部利润率和队列数据
        - 需要判断 Bitdefender 是否配得上更高的类企业级倍数
        - 要求提供董事会 KPI 包和分部桥接表
      - - IPO 工作流
        - 投行授权、目标上市地、申报状态和准备时间表
        - 验证 2026 年 6 月是真流程，还是仅为报道意向
        - 要求提供 IPO 工作计划和法律准备清单
      - - 企业业务证据
        - 客户质量、大客户结构，以及企业业务占比上升的证据
        - 支撑或反驳一个反向逻辑：Bitdefender 消费者业务仍过重，不适合高溢价估值标记
        - 要求提供队列数据、可背书客户和销售结构细节
    notes: 上述问题是最低材料包，用来从方向性的上市可比逻辑推进到可投资的承销判断。
    claimRefs:
