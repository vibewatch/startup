  - id: TR005
    title: 缓释措施与终止条件表
    columns:
      - 风险
      - 可监测触发条件
      - 阈值 / 事件
      - 行动含义
    rows:
      - - Microsoft 捆绑与平台竞争
        - 企业业务占比和业务增长信号
        - 企业业务占比未能显著高于 2024 年 42% 水平，同时 Microsoft 份额继续上升
        - 假设估值倍数继续承压，不把上市可比公司同等估值写进投资假设
      - - 安全厂商信任受损
        - 新披露的 Bitdefender CVE，或被实质利用的漏洞
        - 再出现任何高危企业控制平面问题，或消费者端权限漏洞反复出现且没有清晰修复叙事
        - 升级产品质量尽调，下调信任假设
      - - 计费 / 支持摩擦
        - 公开评价与投诉强度
        - 主要评价平台再次持续涌现续费、退款或取消投诉
        - 假设消费者流失更高、品牌弹性更低
      - - 私营公司不透明度
        - IPO 准备披露包
        - 正式 IPO 推介前仍没有经审计合并报表、现金和债务明细，或优先股条款摘要
        - 将退出时间视为不确定，并在估值中计入更高下行
      - - 创始人和治理集中度
        - 继任与治理披露
        - IPO 计划推进时，仍没有可信继任路径或董事会治理扩容
        - 将关键人风险视为未解决，要求治理约束或折价
      - - 受监管买家的信任与主权化牵引
        - 主权托管和公共部门转化证据
        - 虽然强力定位，但没有可量化的主权托管赢单、受监管行业客户背书或采购进展
        - 假设公共部门叙事更像销售物料，而非持久护城河
    notes: 触发条件设计成可由外部监测或通过尽调索取，而不是纯内部愿景。
