      - number: '6.4'
        title: 持久性、满意度与记录稀薄处
        blocks:
          - type: paragraph
            body: >-
              留存韧性的证据好坏参半。积极面看，Bitdefender 的合作伙伴计划明确围绕经常性收入保护来设计； Pikolin 的五年合作也说明，至少部分企业账户会随时间扩展到更丰富的模块。但这些只是代理指标，
              不是流失率或留存指标。本文审阅的公开记录没有披露净留存率（NRR）、总留存率（GRR）、消费者续费率、 合同期限或大客户集中度。公开评价场也足够分化，不能忽略。SourceForge 的有限样本偏正面，
              Slashdot 也强化了其跨平台和小企业适配度；但 ProductReview 明显反向，一手社区帖里也有自动续费、 退款和支持投诉。TechRadar
              虽整体推荐该产品，也点出扫描速度和系统负担。投资上的读法是： 客户匹配真实存在，尤其是在以预防为主的端点安全和 MSP 打包场景；但客户质量披露仍低于一流软件承销标准。 公开证据足以说明 Bitdefender
              能卖进家庭、SMB 渠道和更大的受监管组织；但还不足以判断这本业务有多粘、 集中度多高，或消费者偏重的规模是否仍压过企业软件经济性。
