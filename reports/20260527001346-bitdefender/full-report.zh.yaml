      - number: '2.3'
        title: 买方、用户、付款方与渠道分层
        blocks:
          - type: paragraph
            body: >-
              买方图谱是 Bitdefender 容易被误读的原因之一，尤其只看企业 XDR 时。消费安全里，买方、用户和付款方通常合成一个人或一个家庭，一起购买设备、隐私和身份覆盖。直销小企业交易中，Bitdefender
              自己的包装显示，买方通常是业主或 IT 通才，看重的是低运维负担的防护，而不是分析师级工具。渠道主导的 SMB 动作不同：MSP
              购买、开通并运营平台，但终端客户最终支付月账单，因此合作伙伴渠道在经济上居中，不只是推荐线索。中端企业采购转向安全和平台团队，评估 EDR、XDR
              和调查效率；受监管企业还会加入合规、留存和数据驻留问题，让预算更耐久。官方和独立渠道来源都强化了这一点：Bitdefender 围绕该模式建出真实的 MSP 基础设施，包括按用量付费开通、NFR
              访问和培训，目的是让合作伙伴转售并运营整套技术栈。
            claimRefs:
