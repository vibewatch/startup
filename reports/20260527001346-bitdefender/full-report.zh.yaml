        - USD 9.89B
        - 21.1x
        - 显示宽企业安全平台能拿到的估值
        - 企业业务广度和披露都大幅领先 Bitdefender 的公开记录
      - - Fortinet
        - USD 98.14B
        - USD 6.79B
        - 14.5x
        - 有真实规模的盈利型网络安全老牌厂商，可作参照
