  - id: TP006
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - Bitdefender 护城河 / 风险
      - 威胁
      - 严重性
      - 证据
      - 缓释 / 尽调需索取
    rows:
      - - 防护口碑和低开销部署
        - 检测质量正在趋同，多家对手都销售强防护加更宽平台。
        - 中
        - Bitdefender 在本次留存的 AV-Comparatives 企业结果中仍接近第一梯队，但并非唯一。
        - 索取因性能占用或降噪成为决定性购买理由时的胜率和留存。
      - - B2B + B2C 混合模式
        - 消费者捆绑和 SMB 捆绑带来两头定价压力。
        - 高
        - Microsoft、Norton、McAfee 和 Avast 都把安全能力与更宽的价值主张捆绑。
        - 分别衡量消费者、SMB 和企业队列的付费意愿，不要假设一条品牌阶梯能贯穿全部客群。
      - - 渠道 / MSP 触达
        - Sophos 和 Microsoft 把 MSP 经济性和工具讲得异常清楚。
        - 高
        - Sophos 公开聚合账单，Microsoft 公开 Lighthouse 多租户能力。
        - 验证伙伴净留存、伙伴集中度，以及相对 Sophos 和 Microsoft 的 MSP 胜负率。
      - - 模块化平台广度
        - 大型企业对手销售更宽的默认云、身份、邮件和 SOC 集成。
        - 高
        - CrowdStrike、SentinelOne、Palo Alto、Trend、Trellix 和 Fortinet 销售的平台都比单纯端点更宽。
        - 量化企业销售周期后段中，Bitdefender 需要多频繁加上传感器、MDR 或邻近产品，才能保持竞争力。
      - - 受监管 / 遗留资产环境适配
        - Fortinet 和 ESET 也主打低摩擦或遗留友好部署。
        - 中
        - FortiEDR 强调遗留 OS 和免重启部署；ESET 强调低误报和轻量占用。
        - 在医疗、教育、公共部门和 OT 密集资产环境中收集客户访谈，检验 Bitdefender 是否仍有独特适配度。
      - - 独立实验室领先
        - 实验室胜出有帮助，但不能普遍类比真实买家环境。
        - 中
        - AV-Comparatives 明确提醒，企业和消费者系列不同，厂商也会为测试调校配置。
        - 实验室证据只能先做一层筛选；判断护城河强度之前，还要尽调真实运营成本、响应质量和生态适配度。
    notes: 严重性是定性判断：高，表示威胁可能在未来 12 到 24 个月实质改变 Bitdefender 的胜率或定价权；中，表示可管理但重要。本图表关注结构性竞争风险，不关注短期产品发布噪音。
