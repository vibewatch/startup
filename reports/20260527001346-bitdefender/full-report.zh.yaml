      - number: '5.2'
        title: 工作流、部署与托管运营
        blocks:
          - type: paragraph
            body: >-
              实际工作流从部署和遥测接入开始，不从营销标签开始。Bitdefender 公开文档显示了云和本地部署平台界面，一个把云解决方案与本地部署解决方案分开的帮助中心，并明确提到公共 API、云安全
              API、Security Data Lake、RMM SDK 工具和 IntelliZone。EDR 和 XDR
              页面随后描述运营循环：预防先拦截或遏制常规威胁，可疑行为或遥测被关联成事件，分析师使用图形化攻击链视图加历史或实时搜索，事件还能推送到 Splunk、QRadar 或 Azure Sentinel
              等外部工具。托管服务逻辑也足够清楚，可作方向性承销：如果买方缺少专职分析师或 24x7 覆盖，Bitdefender 会把他们推向 MDR 和 MSP 模式，而不是假装每个客户都想独自运营完整
              SOC。缺口仍在运营细节。检索到的公开材料擅长列出产品界面和买方结果，但在 MDR SLA、SOC 地理位置、默认留存和增加各传感器类别的经济性上，硬性公开细节偏薄。
