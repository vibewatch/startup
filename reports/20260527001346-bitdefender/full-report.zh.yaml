      - number: '4.2'
        title: 盈利能力、成本结构与本地法定信号
        blocks:
          - type: paragraph
            body: >-
              Bitdefender 从公开经营口径看是盈利的，但公开记录太混杂，无法给出干净的一行式利润率故事。ZF 发布的 2024 年集团数字隐含经营利润率约 12.9%；Forbes Romania 则称 2023
              年集团收入为 $391.9M，调整后经营利润或 EBITDA 为 $85M，按该定义约为 21.7%。两者不能直接比较，因为 2023 年标签是调整后、2024
              年标签是经营利润，但它们仍显示，在融资结构影响前，公司有可观现金生成能力。成本结构代理也指向沉重但有目的的研发基础。ZF 称集团 2024 年研发投入超过 $90M，意味着研发强度下限超过收入的
              20%；官方公司页面称超过一半员工在研发。结合据报道的 2,061 名员工，公开数字隐含集团层面人均收入约 $211,000。


              罗马尼亚法律实体轨迹在法定资产负债表细节上更强，在合并经济性上更弱。Profit.ro 和 Romania Insider 称，2024 年负债达到 300.1M RON，应收账款 347.9M
              RON；Termene 和 ListaFirme 显示，截至年末固定资产约 114.5M RON、流动资产 1.585B RON、本地权益约 562.5M RON。这比 2023 年法定亏损可能暗示的 SRL
              层面图景更健康。关键卡点是会计。Forbes 和 Profit.ro 都称 2023 年本地亏损由罗马尼亚新的收入确认准则驱动，该准则影响本地公司，但不影响合并集团。因此，正确读法不是 Bitdefender
              的业务在 2023 年坏掉了，而是当外部读者最需要纵向一致性时，本地法定口径恰好变了。
