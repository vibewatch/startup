      - number: '5.4'
        title: 独立验证、真实护城河与剩余缺口
        blocks:
          - type: paragraph
            body: >-
              独立证据确实验证了 Bitdefender 故事中的有意义部分，但验证强度并不均衡。企业防护方面，AV-Comparatives 2025 年企业事实表是本轮最强的可得证明：真实世界防护率
              99.6%、恶意软件防护率 99.9%，常见企业软件误报为 0。消费者防护方面，AV-Comparatives 仍在 2025 年把 Bitdefender 评为最高评级，AV-TEST 消费者页面显示其
              2026 年 2 月总分满 6 分。公开评论也支撑 Bitdefender 长期声誉中的一部分：功能密度宽、用户影响相对轻。但反向一侧很重要。同行评论渠道仍指出报告、UI、移动应用和扫描性能问题；GitHub
              证据显示公开开发者生态较窄；漏洞轨迹真实存在，横跨 GravityZone Update Server、GravityZone Console、macOS 终端工具和更老的 BOX
              硬件。最清楚的结论是：Bitdefender 的护城河在预防质量、共享情报和关联工作流上真实存在，但在公开控制平面透明度、生态宽度，以及新平台领导者有时更公开发布的云原生证明深度上更薄。
