        - label: SentinelOne
          x: 8.5
          'y': 6
          description: 覆盖终端、云和身份的自主平台，有大型企业客户背书。
        - label: Palo Alto Cortex
          x: 9.5
          'y': 5.5
          description: 留存集合中 SOC / 平台集成最深，但 SMB 可及性较弱。
        - label: Microsoft Defender
          x: 8
          'y': 10
          description: Windows 和 Microsoft 365 套装力量覆盖 SMB、企业和家庭。
        - label: Sophos
          x: 7
          'y': 8.5
          description: 供应商无关的 MDR，以及明确的 MSP 计费 / 管理优势。
        - label: Trend Micro
          x: 8
          'y': 6.5
          description: SecOps / XDR 广度，搭配宽遥测和合作伙伴生态。
        - label: Trellix
          x: 7.5
          'y': 5.5
          description: 大型企业 XDR 广度，集成多，但复杂度更高。
        - label: ESET
