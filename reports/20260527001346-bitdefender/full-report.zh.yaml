      - number: '8.4'
        title: 未解问题足够具体，足以卡住 IPO 或迫使估值重置
        blocks:
          - type: paragraph
            body: >-
              剩下的工作不是概念问题，而是文件问题。公开申报文件或投资者尽调室必须解决本章当前无法解决的四件事。 第一，Bitdefender 必须给出经审计合并现金、债务和契约条款信息，让投资者从估值 /
              收入代理指标转向真实企业价值框架。 第二，管理层必须披露优先股条款和普通股清算顺序，因为已报道 666 million 美元优先权价值可能主要是会计观感问题，
              也可能是真实稀释和下行不对称来源。第三，公司必须证明企业业务具备留存、利润率和组合质量， 足以支撑高于成熟安全底部的付费。第四，IPO 进程本身必须通过申报文件可观察，而不能只靠已报道时间目标。


              这些缺口形成清晰的投资逻辑破裂触发器。如果 IPO 营销推进时仍没有提交招股书， 如果上市可比公司进一步向成熟安全底部压缩，如果消费者组合仍占主导且缺乏更好企业证据，
              或如果股权类别披露显示清算顺序比媒体报道暗示的更苛刻，已报道 2.2 billion 美元锚点就很难站住脚。 反过来，一套干净的申报文件不能保证溢价估值，但可以让当前区间的可承销性显著提高。
