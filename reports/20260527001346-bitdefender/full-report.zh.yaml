  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 企业平台与架构
        blocks:
          - type: paragraph
            body: >-
              Bitdefender 的企业故事比「终端 AV + EDR」更宽。当前公开产品栈从 SMB 套件开始，进入 Business Security Enterprise 作为主要预防 + EDR 控制平面，再扩展到
              XDR 传感器、捆绑 Defense XDR 产品，以及 MDR 或 MSP
              覆盖。各产品页面的架构逻辑一致：轻量终端代理先做预防和风险降低，再用原生传感器把可见性扩展到身份、网络、云、生产力和部分业务应用场景。这很重要，因为公司卖的不是一堆互不相干的点工具，而是一个共享控制平面，差异化应来自低操作员负担的自动关联。护城河在来源描述真实层复用的地方最可信：无文件防御、可调
              AI 或 ML、沙箱、勒索软件缓解、风险评分、实时搜索和事件视图，都被呈现为同一运营栈的组成部分。较弱的一点是，这套架构很大程度仍由 Bitdefender
              自己描述，而不是独立架构深潜证明；因此本章应把工作流主张视为方向上可信，但尚未完全被独立证明。
