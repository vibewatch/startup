  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与排除的相邻预算
        blocks:
          - type: paragraph
            body: >-
              严谨定义市场，起点应是 Bitdefender 实际销售什么，而不是泛泛的网络安全 TAM。保留的官方页面显示两条变现路径。消费端，Bitdefender 销售经常性安全订阅，如今把设备防护与
              VPN、密码管理、诈骗防护、暗网监控、身份保护和盗窃保险功能捆在一起。企业端，其重心是终端优先：终端防护、EDR、XDR、风险管理和 MDR 导向套餐，既可直销，也可通过 MSP 销售。TechZone
              解释文有用，因为它明确把 EPP、EDR、XDR 和 MDR 放在一个连续谱上，而不是四个互不相干的市场。被排除的一侧同样关键。Bitdefender 不足以支撑把广义网络安全预算、IAM、通用
              SIEM、云态势或咨询主导的托管安全都算作可触达收入池。那会抬高叙事，并掩盖一个事实：Bitdefender
              的胜点在于它是终端主导的混合厂商，既有消费者分销，也有渠道驱动的企业分销，而不是拥有每一个网络安全控制类别。
