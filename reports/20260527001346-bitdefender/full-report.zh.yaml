        - 可作为美国溢价阵营之外成熟盈利安全厂商的地板可比
        - 在地域、上市制度和产品结构上，可比性不够直接
    notes: 本组为精选上市可比公司，而不是穷尽的网络安全公司全集；目的在于把 Bitdefender 框在高溢价企业级龙头和较低倍数的盈利混合型安全同业之间。
