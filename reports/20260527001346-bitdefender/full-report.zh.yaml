  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Bitdefender 把共享终端核心、多表面传感器、关联分析和服务覆盖层叠成一个平台叙事；消费者产品使用同一引擎，但购买体验不同。
    data:
      layers:
        - label: 第 1 层：受保护表面
          detail: 先是终端，然后是身份、网络、云、生产力和业务应用
          modules:
            - 终端
            - 身份
            - 网络
            - 云
            - 生产力应用
          outputs:
            - 共享遥测
        - label: 第 2 层：预防核心
          detail: 执行前和影响前控制
          modules:
            - ML / HyperDetect
            - 漏洞利用防御
            - 勒索软件缓解
            - 沙箱
          outputs:
            - 已阻断或遏制的威胁
        - label: 第 3 层：检测与关联
          detail: EDR 加 XDR 事件构建
          modules:
            - 跨终端关联
            - Incident Advisor
            - 攻击链视图
          outputs:
            - 人类可读事件
        - label: 第 4 层：响应与运营
          detail: 分析师和托管服务工作流
          modules:
            - 实时搜索
            - 一键响应
            - SIEM 转发
            - MDR
          outputs:
            - 分诊和修复
        - label: 第 5 层：商业覆盖
          detail: 面向企业、MSP 和家庭买家的不同包装
          modules:
            - Defense XDR
            - MSP 层级
            - Total Security
            - 威胁情报源
          outputs:
            - 细分市场专属变现
    approximationNotes: 该堆栈综合自公开产品和文档页面；不是供应商提供的参考架构图。
