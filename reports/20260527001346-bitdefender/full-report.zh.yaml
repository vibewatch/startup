  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 谁在购买 Bitdefender，以及公开记录能支撑什么
        blocks:
          - type: paragraph
            body: >-
              Bitdefender 的客户图景足够宽，因此可信，但披露仍不均衡。最明显的买方集合是消费者家庭：公司当前个人方案页面直接向个人和家庭销售省心数字防护、隐私和身份覆盖；Google Play
              和编辑评论则显示，面向移动和多设备用户的应用商店与订阅漏斗仍在运行。这很重要，因为公开界面不是只面向企业；它仍承载有意义的消费者获客和增购引擎。第二类是通过 MSP 和转售商触达的 SMB。Bitdefender
              的合作伙伴页面、定位器和 MSP 产品材料都推动由合作伙伴中介的路径，包含按月用量计费、多租户管理和 RMM/PSA 集成。第三类是直销或通过合作伙伴购买的中端市场与企业账户，具名证明包括
              Ferrari、Saint Francis Healthcare、一所美国大学、Pikolin 以及公共金融客户
              KDFA。因此，受监管和公共部门敏感度可以支撑，但只能靠样本标志，而不是披露的数量。区域结构也只是方向性，不精确：本章具名证明集中在美国、英国、西班牙和意大利；FeaturedCustomers 和
              Bitdefender 自有材料把叙事延伸到 150-170+ 个国家，却没有公布精确活跃客户总数或当前分部结构。
