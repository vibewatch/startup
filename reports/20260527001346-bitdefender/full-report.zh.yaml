chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品组合与商业模式
        blocks:
          - type: paragraph
            body: >-
              Bitdefender 的官方页面把公司身份讲得异常清楚，即便一些硬财务指标仍未公开。核心画像不是「正在做一个功能的创业公司」，而是一家运营多年的全球网络安全厂商：2001
              年创立，总部在布加勒斯特，同时面向家庭和组织销售。后续尽调因此不能把 Bitdefender 简化成纯企业 XDR 故事。公开产品面有两条线。消费端，Bitdefender 销售 Total
              Security、VPN、密码管理、隐私工具和身份盗窃服务等订阅软件。企业端，公司通过 GravityZone 平台推进终端防护、EDR、XDR、MDR 和 MSP
              套餐。官方业务材料还显示，各细分市场的变现方式不同：家庭用户购买可续订订阅，MSP
              则可购买按月、按用量计费且无最低承诺的许可证。领导层页面强化了一个事实：直面消费者仍是家庭用户业务的主要渠道；企业页面则强调托管服务、渠道伙伴和产品宽度。规模说法仍要按证据强度拆开看。官方材料称
              Bitdefender 在 170+ 个国家保护数百万用户，每年拦截超过 500 亿次威胁，已申请 580+ 项专利，并让超过一半员工投入研发。ZF 又补充外部规模背景：美国合同量可观，2024 年研发支出超过
              $90M。合起来看，最稳妥的公司概况表述是：Bitdefender 是一个成熟的 B2C/B2B 混合网络安全平台，建立在共享威胁情报、长期运营的终端产品和仍然突出的罗马尼亚研发基地之上。
