      - number: '8.2'
        title: 上市可比公司显示，已报道 2.2 billion 美元标记位于网络安全区间中部，而非顶部
        blocks:
          - type: paragraph
            body: >-
              按上市公司估值 / 收入逻辑，Bitdefender 已报道的 2.2 billion 美元锚点约等于 2024 年收入的 5.1 倍。这个筛选结果远低于 CrowdStrike 约 35.5 倍、Palo
              Alto Networks 约 21.1 倍， 低于 Fortinet 的 14.5 倍，接近 SentinelOne 的 6.3 倍，高于 Gen Digital 的 3.2 倍和 Trend Micro 的
              2.8 倍。离散本身就是重点。上市网络安全公司不是一个倍数故事。 纯云原生、纯企业、高增长平台可以维持极端溢价。盈利但组合更混杂、或暴露于消费者业务的厂商， 交易倍数低得多。Bitdefender
              已报道锚点已经显著高于成熟消费者安全底部，但远不到企业云天花板。


              所以正确输出是一条情景区间。悲观情景按 3.5 到 4.5 倍收入，在披露仍稀疏、IPO 市场转弱， 或投资者把该业务视为带私营公司折价的混合安全厂商时，支撑约 1.5 到 2.0 billion 美元。
              基准情景按 4.5 到 6.0 倍，支撑约 2.0 到 2.6 billion 美元，因此包住已报道的 2.2 billion 美元锚点。乐观情景按 6.0 到 7.5
              倍，需要更强的企业证据、更干净的申报级披露， 以及让人放心的优先股堆叠不会吞掉普通股上行。在此之前，对已报道标记打 15% 到 25% 的 IPO 折价， 也指向约 1.65 到 1.87 billion
              美元的营销估值。
