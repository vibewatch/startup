      - number: '1.3'
        title: 规模信号、里程碑与反向信号
        blocks:
          - type: paragraph
            body: >-
              Bitdefender 的公开时间线显示，公司从罗马尼亚杀毒软件根基，走向一个全球分发的平台，扩张既靠收购也靠产品。Forbes 的家族人物报道把早期国际化推到 2004 年，把 Axxess 介入推到 2007
              年，并记录 2017 年之后的后续收购。2017 年 Vitruvian 交易的重要性不只是融资，更是治理里程碑：它把公司重估到 $600M
              以上，同时保住创始人多数控制权。后续里程碑显示的是产品拓宽，而非简单维护。官方材料强调 2022 年原生 XDR 里程碑和 2024 年 GravityZone AI Assistant 里程碑，XDR
              页面则描述覆盖终端、身份、云和生产力场景的原生传感器。Forbes 还把 2023 年 Horangi 收购和 2024 年东南亚战略中心归入新的 M&A 阶段；Ferrari 合作报道则显示
              Bitdefender 借品牌级企业关系，在罗马尼亚之外加厚证明点。规模指标也要像里程碑一样严谨：ZF 的 2024 年集团数字和 Profit.ro
              的本地实体数字都有用，但两者口径不同，必须标清。反向角度同样真实。NVD 记录了 2024 年 macOS Bitdefender 漏洞，BleepingComputer 也记录过 Bitdefender
              消费者产品中的早期提权和远程代码执行问题。这些披露不会推翻公司的业务根基，但重要，因为 Bitdefender 卖的是信任。最后，公开市场故事仍只是一个进行中的故事。2026 年 6 月和超过 $2.2B
              的估值是据报道的规划假设，不是 IPO 已完成的证据；围绕优先股的公开透明度仍达不到机构投资者承销上市路径前想看到的水准。
