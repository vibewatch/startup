  - id: TV001
    title: 建议摘要表
    columns:
      - 视角
      - 当前判断
      - 公开证据
      - 决策含义
      - 什么会改变判断
    rows:
      - - 建议
        - 继续研究
        - 能看见真实业务根基，但当前价格支撑只具方向性
        - 不要把据报道的 >$2.2B 估值标记视为已经能完整承销的价格
        - 只有拿到监管申报级财务和股权结构表披露后才上调
      - - 置信度
        - 中
        - 价值方向可信，但估值精度很弱
        - 用区间和折价，不用点估值
        - 经审计报表和招股书披露会提高置信度
      - - 风险评级
        - 高
        - 优先股堆叠不透明、倍数分化，让下行不对称
        - 任何新资金进入前，都要设置硬性尽调关卡
        - 如果分配瀑布和资金状况干净，风险下降
      - - 估值立场
        - 据报道 >$2.2B 下，估值合理到略偏高
        - 5.1x 收入倍数说得通，但已高于成熟安全厂商地板
        - 避免基于老股交易报道支付高溢价企业级倍数
        - 如果推介定价更接近 IPO 折价区间，立场改善
      - - IPO 准备度
        - 部分具备
        - 规模、盈利能力和流程信号都在，但缺少监管文件质量披露
        - 将 IPO 时间视为有条件事件，而非可兑现安排
        - 已提交招股书和经审计合并报表会显著提高准备度
      - - 最适用同业视角
        - 混合型盈利安全厂商，加少数企业级龙头
        - Bitdefender 既不是纯消费者杀毒残留资产，也不是纯云 EDR 复合增长公司
        - 先锚定混合型厂商同业，只把企业级龙头当作上限参照
        - 如果业务结构和披露开始接近纯企业级同业，判断才会改变
    notes: 本表把本章证据转成投资姿态，而不是管理质量评分；当前价格纪律比欣赏公司本身更重要。
    claimRefs:
      - CV018
      - CV026
      - CV028
      - CV032
