      - 公开价格 / 捆绑信号
      - 包含能力
      - 未知项
      - 战略含义
    rows:
      - - Bitdefender Business Security Enterprise 企业版
        - 企业
        - 报价驱动；演示或试用后由伙伴推动采购
        - 端点防护、EDR、风险分析，以及可选 XDR 传感器或 MDR
        - 本次未留存公开的单端点价格或合同底价
        - 更难拿公开捆绑基准定锚，尤其是 SMB 和中端市场交易
      - - Microsoft Defender for Business 商业版
        - SMB 企业
        - 与 Microsoft 安全和服务器附加项绑定的高性价比套装
        - Defender Antivirus、EDR、攻击面缩减、AIR、漏洞管理、多租户 Lighthouse 支持。
        - 本次留存页面没有给出清晰的公开标价
        - 对 300 人以下组织形成很强的捆绑压力
      - - CrowdStrike Falcon 端点 + 暴露面
        - 大型企业
        - 本次未留存公开标价
        - 端点安全、暴露面管理、SIEM/SOAR 邻接能力、单传感器叙事
        - 合同、席位和服务价格在本次留存资料中仍不透明
        - 买家愿意为更宽的平台结果付更高预算时更容易赢
      - - Sophos MDR + MSP 体系
        - MSP 和中端市场
        - 用量计费和聚合账单优势说得很清楚；终端客户 MDR 价格没有公开
        - MDR、端点、邮件、防火墙、Microsoft 集成、集中交付
        - 本次未留存面向终端客户的公开价目表
        - 相比 Bitdefender，渠道经济性和服务封装叙事很强
      - - Bitdefender Ultimate Security
        - 消费者和专业消费者
        - 动态网页定价加免费试用；本次没有留存清晰的静态价目表
        - 防病毒、无限 VPN、密码管理器、身份保护、家长控制、家庭档位
        - 本次静态抓取没有保留清晰的首年价格阶梯
        - 套件广度很强，但本次留存的价格透明度弱于 Norton
      - - Microsoft Defender for Individuals 个人版
        - 消费者家庭
        - 需要 Microsoft 365 Personal、Family 或 Premium 订阅
        - 跨设备管理、身份盗用监控、信用监控、反钓鱼，以及按平台区分的防护。
        - 没有增量独立安全价格，因为产品本身就是捆绑包
        - 对已经付费给 Microsoft 的家庭，是强有力的间接替代品
      - - Norton AntiVirus Plus / 360
        - 消费者家庭
        - 单设备首年 29.99 美元；5 设备 Deluxe 档首年 49.99 美元
        - 防诈骗、密码管理器、云备份、VPN、隐私监控，高档位含家长控制
        - 入门折扣结束后续费价格明显更高
        - 设下了可见的零售价格锚，Bitdefender 必须回应
      - - McAfee Total Protection / McAfee+
        - 消费者家庭
        - 动态价格组件；明确给出 5 设备和无限设备档位
        - 防病毒、防诈骗、VPN、隐私清理，以及最高 200 万美元身份保障
        - 本次静态抓取隐藏了准确首期价格
        - 即使没有清晰的静态价格，宽口径身份与隐私捆绑也会维持消费者端压力
      - - Avast One
        - 消费者与免费增值阶梯
        - 本次留存页面展示功能，而不是稳定的静态价格
        - 防病毒、VPN、反诈骗、隐私和优化
        - 本次留存的静态文本没有保留准确付费阶梯
        - 免费到付费阶梯和简单捆绑信息会挤压转化经济性
