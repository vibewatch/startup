      - number: '7.3'
        title: 财务披露与治理风险
        blocks:
          - type: paragraph
            body: >-
              Bitdefender 的财务风险，不在于明显经营疲弱，而在于披露质量和合并边界模糊。ZF 给出了异常详细的 2024 年图景——434.5 million 美元收入、56 million 美元营业利润、189
              million 美元美国计费合同、 超过 90 million 美元研发支出，以及员工基数高度集中在罗马尼亚——但公司仍是私营企业，
              没有发布上市同行投资者会期待的经审计合并包。资本结构的褶皱，比泛泛贴上“私营公司不透明”标签更严重。 ZF 称优先股占总股本 28.3%，估值 666 million 美元；Aleph
              则称这种会计处理让集团尽管营业利润为正， 仍出现 91 million 美元净亏损和 554.7 million 美元负权益。这可能只是会计扭曲，不是现金危机；
              但没有实际优先权条款、现金余额、债务时间表或经审计合并报表，外部投资者无法测试下行。 治理披露同样薄。Florin Talpeș 显然是公开重心，少数披露监事会成员姓名的来源之一是 ZF， 而非
              Bitdefender 自家网站。数据处理协议（DPA）和隐私政策还增加了更细的风险：即便数据处理责任也取决于产品场景， Bitdefender
              可能按解决方案担任处理者、控制者或共同控制者。简言之，业务可能强于许多不透明的私营公司， 但仅凭公开证据仍无法完整承销。
