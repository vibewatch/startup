      - CV032
      - CV039
      - CV045
      - CV046
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 倍数 / 估值逻辑
      - 隐含价值区间
      - 核心假设
      - 概率信号
      - 关键失败模式
    rows:
      - - 悲观
        - 3.5x-4.5x 2024 年收入
        - USD 1.5B-2.0B
        - IPO 时间后移，披露仍稀疏，投资人把 Bitdefender 视为混合型安全厂商，并施加较重私营公司折价
        - 如果没有申报材料出现，且上市网络安全倍数继续走软，概率更高
        - 优先股悬置或疲弱市场窗口把定价压到据报道锚点以下
      - - 基准
        - 4.5x-6.0x 2024 年收入
        - USD 2.0B-2.6B
        - 增长和经营盈利守住，投资人接受混合结构，但仍对不透明度打折
        - 如果管理层交出可信申报材料，但还未证明纯企业级质量，最可能落在这里
        - 分部披露不足会把倍数钉在区间下半段附近
      - - 乐观
        - 6.0x-7.5x 2024 年收入
        - USD 2.6B-3.3B
        - 企业业务结构、留存和利润率证据明显改善，优先股堆叠看起来温和
        - 只有 IPO 文件显著升级披露且市场胃口强，乐观情景才可信
        - 干净的申报文件始终没有出现，或显示经济性弱于老股交易报道暗示
    notes: 区间是估值带，不是点目标；刻意使用估值 / 收入倍数，因为公开记录还不足以支撑更干净的 EV 框架。
