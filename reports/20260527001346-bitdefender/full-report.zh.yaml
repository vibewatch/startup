      - number: '2.2'
        title: 规模测算口径、重叠与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              外部市场数据支持真实规模，但也说明本章不应坍缩成一个巨大数字。核心企业终端层面，近期出版机构的口径集中在约 $17B–$22B 区间：Fortune 把 2026 年终端安全定为 $17.79B，The
              Business Research Company 为 $20.79B；MarketsandMarkets 和 Market Research Future 分别把相邻 EPP 类别放在 2024 年
              $17.4B 和 2025 年 $19.13B。MDR 还有一个有意义但更小的运营层：Mordor 估算 2026 年 $5.09B，MarketsandMarkets 为
              $6.28B。消费者安全又是另一套逻辑：Cybernews 显示内置防护主导基础杀毒使用，Fortune 则把身份盗窃保护服务单项定为 2026 年
              $19.45B。这些口径重叠且定义不同，不应机械相加。正确结论是：Bitdefender 面前有几个可观的相邻池，但没有私有收入和附加率披露，公开数据无法拆出精确 SAM 或 SOM。
