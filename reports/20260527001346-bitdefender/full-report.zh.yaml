  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 这项建议直接来自三件事：真实运营证据、混合模式折价，以及尚未解决的披露缺口。
    data:
      nodes:
        - id: n1
          label: 长运营历史 + 盈利
          detail: 2001 年起步，加上 2023-2024 年可见经营利润
        - id: n2
          label: 混合收入结构
          detail: 消费端和企业收入都重要
        - id: n3
          label: 可比公司分散度
          detail: 上市网络安全公司收入倍数约 2.8x 至约 35.5x
        - id: n4
          label: 披露缺口
          detail: 现金、清算瀑布、ARR 或完整申报文件均未公开
        - id: n5
          label: 给区间，不给定点
          detail: 公开结论是估值区间
        - id: n6
          label: 继续研究
          detail: 披露不改善时，>$2.2B 对应合理到略偏高
      edges:
        - from: n1
          to: n5
          label: 支撑底部价值
        - from: n2
          to: n5
          label: 压低倍数
        - from: n3
          to: n5
          label: 要求严守同业倍数纪律
        - from: n4
          to: n5
          label: 阻断精确估值
        - from: n5
          to: n6
          label: 使用区间和尽调门槛
        - from: n4
          to: n6
          label: 无监管文件级证据则不买入
    approximationNotes: 这是决策链，不是估值模型；它刻意强调那些让结论停留在买入以下的依赖项。
    claimRefs:
      - CV027
      - CV032
      - CV038
      - CV039
      - CV045
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 对最可能拉动 Bitdefender 可支撑估值区间的变量，给出 0-10 的定性敏感性评分。
    data:
      items:
        - label: 经审计合并披露
          value: 10
        - label: 优先股清晰度
          value: 10
        - label: 企业收入占比证据
          value: 8
        - label: IPO 市场窗口
          value: 7
        - label: 上市可比公司倍数状态
          value: 7
        - label: 持续盈利加增长
          value: 6
    approximationNotes: 分数是分析用敏感性权重，不是概率；数值越高，该因素越能明显改变估值结论。
    claimRefs:
      - CV032
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: IPO 折价、悲观、基准和乐观结果的方向性估值区间，仅基于公开信息。
    data:
      items:
        - label: IPO 折价锚点
          low: 1650
          base: 1760
          high: 1870
          unit: USD M
          note: 在完整监管文件级披露之前，对据报道的 >$2.2B 锚点打 15% 至 25% 折价。
        - label: 悲观区间
          low: 1520
          base: 1740
          high: 1955
          unit: USD M
          note: 若不透明和市场压力占主导，为 2024 年收入的 3.5x 至 4.5x。
        - label: 基准区间
          low: 1955
          base: 2280
          high: 2607
          unit: USD M
          note: 2024 年收入的 4.5x 至 6.0x，围绕据报道的锚点。
        - label: 乐观区间
          low: 2607
          base: 2930
          high: 3259
          unit: USD M
          note: 2024 年收入的 6.0x 至 7.5x，前提是企业端证据和披露更好。
    approximationNotes: 区间来自公开估值 / 收入逻辑；由于 Bitdefender 的现金头寸和股权类别细节仍未公开，这里刻意不搭建真正的企业价值桥。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 仅用公开证据，对 Bitdefender 投资案例给出紧凑评分视图。
    approximationNotes: 分数是基于本章证据综合得出的 0-10 定性判断，不是正式投资委员会模型。
    data:
      items:
        - label: 业务质量
          value: 7
          unit: /10
          detail: 盈利能力和长期运营历史支撑真实特许经营价值
          claimRefs:
            - CV003
            - CV006
            - CV009
            - CV031
        - label: 披露质量
          value: 3
          unit: /10
          detail: 关键现金、分部和股权类别指标仍未公开
          claimRefs:
            - CV017
            - CV032
            - CV037
        - label: 估值支撑
          value: 5
          unit: /10
          detail: 据报道的 >$2.2B 具备合理性，但底层证据还不够干净
          claimRefs:
            - CV018
            - CV026
            - CV035
        - label: IPO 准备度
          value: 4
          unit: /10
          detail: 流程信号存在，但缺少监管文件级可见度
          claimRefs:
            - CV011
            - CV038
            - CV046
        - label: 下行不对称
          value: 3
          unit: /10
          detail: 优先股堆叠不确定和可比公司倍数压缩让下行仍有分量
          claimRefs:
            - CV016
            - CV041
            - CV044
        - label: 上调潜力
          value: 6
          unit: /10
          detail: 干净的申报文件包可能显著改善区间
          claimRefs:
            - CV040
            - CV042
            - CV043
