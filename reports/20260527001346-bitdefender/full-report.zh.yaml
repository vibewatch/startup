companyProfile:
  summary: >-
    Bitdefender 是一家总部位于布加勒斯特的网络安全厂商，2001 年由 Florin 和 Mariuca Talpeș 创立。公司销售混合产品组合：GravityZone 终端防护、EDR、XDR、MDR、MSP
    和威胁情报产品，再加上一条消费者安全套件业务；市场覆盖比只做企业安全的网络安全同行更宽。公开报道指向约 $435M 的 2024 年集团收入、$56M 经营利润、2,061 名员工和超过 $90M 研发支出；最清楚的资本历史锚点是
    2017 年 Vitruvian 交易，当时估值超过 $600M，以及据报道公司在规划可能于 2026 年 6 月赴美 IPO，估值超过 $2.2B。承销层面的保留意见在于：Bitdefender
    仍是私人公司，仍未披露经审计合并报表、ARR/NRR、现金 / 债务或优先股清算瀑布条款。
