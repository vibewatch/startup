      "id": "sizing-lenses",
      "title": "Sizing lenses, overlaps, and contradictory estimates",
      "body": "External market data support real scale, but they also show why this chapter should not collapse into one giant number. For the core business-endpoint layer, recent publisher lenses cluster around the high teens to low twenties of billions of dollars: Fortune puts endpoint security at $17.79 billion in 2026, The Business Research Company puts it at $20.79 billion, while MarketsandMarkets and Market Research Future frame adjacent EPP categories around $17.4 billion in 2024 and $19.13 billion in 2025 respectively. MDR adds another meaningful but smaller operated layer, with Mordor at $5.09 billion in 2026 and MarketsandMarkets at $6.28 billion. Consumer security is different again: Cybernews shows built-in protection dominating basic antivirus usage, while Fortune sizes identity-theft protection services alone at $19.45 billion in 2026. These lenses overlap and use different definitions, so they should not be summed mechanically. The right conclusion is that Bitdefender has several substantial adjacent pools, but public data do not isolate an exact SAM or SOM without private revenue and attach-rate disclosures.",
