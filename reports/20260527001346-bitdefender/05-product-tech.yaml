      "id": "workflow-deployment-and-managed-operations",
      "title": "Workflow, deployment, and managed operations",
      "body": "The practical workflow starts with deployment and instrumentation, not with the marketing labels. Bitdefender’s public docs show a cloud and on-prem platform surface, a help center split between cloud solutions and on-premises solutions, and explicit references to public APIs, cloud-security APIs, Security Data Lake, RMM SDK tools, and IntelliZone. The EDR and XDR pages then describe the operating loop: prevention blocks or contains commodity threats, suspicious behavior or telemetry is correlated into an incident, analysts use graphical attack-chain views plus historical or live search, and events can be pushed to external tools such as Splunk, QRadar, or Azure Sentinel. The managed-services logic is also clear enough to underwrite directionally: if a buyer lacks dedicated analysts or 24x7 coverage, Bitdefender pushes them toward MDR and MSP models rather than pretending every customer wants to run a full SOC alone. Where the gaps remain is in operational detail. The retrieved public material is good at naming surfaces and buyer outcomes, but thin on hard public detail about MDR SLAs, SOC geography, retention defaults, and the economics of adding each sensor category.",
