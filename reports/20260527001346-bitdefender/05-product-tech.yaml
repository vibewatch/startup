    {
      "id": "consumer-stack-threat-intel-and-adjacent-lines",
      "title": "Consumer stack, threat intelligence, and adjacent lines",
      "body": "Consumer Bitdefender should not be collapsed into the enterprise narrative. Total Security is a cross-platform household subscription sold around device coverage, privacy, family controls, and convenience features, not around SOC workflow. The official page and PCMag review align on the broad shape: Windows, macOS, Android, and iOS support; ransomware protection; password and privacy tools; Autopilot; parental control; and upgrade paths into richer VPN and identity-theft packages. That is a different monetization and user-experience model from GravityZone even if the underlying malware engine is shared. The smart-home line is still publicly alive through BOX 2 and NETGEAR Armor, but the evidence base looks older and more brittle than the rest of the portfolio, especially given recent advisory-archive issues affecting BOX v1. The cross-cutting moat is strongest in Bitdefender’s shared labs and intelligence layer. The company now sells feeds, blocklists, APIs, and IntelliZone; publishes IOC material through GitHub; and says it has released 30-plus free decryptors. That does not make Bitdefender a broad developer platform, but it does make the research and telemetry backbone more real than a pure feature checklist.",
