summary:
  headline: Bitdefender 是一家真实盈利的混合型网络安全公司，端点 / XDR 技术和全球分销都有可信基础；但私营公司披露不足、消费者业务占比偏高、优先股堆叠不透明，IPO 前仍只能继续研究，不能直接买入。
