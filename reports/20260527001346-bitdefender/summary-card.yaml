summary:
  headline: >-
    Bitdefender is a real, profitable hybrid cybersecurity franchise with credible endpoint/XDR technology and global
    distribution, but private-company disclosure gaps, a consumer-heavy mix, and preference-stack opacity keep the case
    at research-more rather than buy ahead of any IPO.
