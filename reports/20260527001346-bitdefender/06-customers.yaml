- id: TU003
  title: Named customer proof table
  columns:
  - Customer
  - Segment
  - Deployment / use case
  - Production vs pilot
  - Outcome / proof
  - Limitation
  rows:
  - - Saint Francis Healthcare
    - Healthcare / regulated
    - Protects 3,000 users plus physical PCs, VDI, and servers tied to EMR access
    - Production
    - 44 viruses caught in one month; exclusion-policy work cut from 60 to 5 minutes; admin savings and fewer support calls
    - Official self-published case study; no contract value or renewal term
  - - Ferrari
    - Marquee enterprise / automotive
    - Advanced Threat Intelligence integrated into Ferrari SOC
    - Production partnership
    - Faster alert triage, threat hunting, and threat-context awareness according to Ferrari executives
