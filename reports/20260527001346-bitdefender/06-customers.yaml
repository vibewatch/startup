  rows:
  - - Consumer households
    - Individual or family is buyer, user, and payer
    - Direct website, editorial review, app-store trial
    - Individual plans, Google Play, PCMag, TechRadar
    - Large top-of-funnel and premium identity/VPN upsell base
    - No disclosed active subscriber count or household churn
  - - SMB via MSP / reseller
    - MSP or reseller often procures and manages; SMB consumes and ultimately pays
    - Partner locator, PAN, distributor/RMM billing
    - 40,000+ partners, MSP console, Grant McGregor proof
    - Scalable indirect reach into smaller accounts
    - Public sources do not show direct-versus-partner revenue split
  - - Mid-market / enterprise
    - Security or IT buyer; employees are end users
    - Direct demo plus partner-assisted selling
    - Business inquiry form, Ferrari, Pikolin, U.S. university
    - Higher-ACV opportunity and XDR/MDR upsell
    - Exact enterprise logo count and ARR by segment are undisclosed
  - - Regulated / public sector
    - Healthcare, education, and public-finance buyers with trust sensitivity
    - Consultative selling, often with specialist partners
    - Saint Francis, KDFA, university case studies
    - Supports credibility in trust-sensitive environments
    - No public government-customer total or procurement win-rate disclosure
  - - Marketplace / OEM ecosystem
    - Cloud buyer or OEM partner integrates or procures security route
    - AWS Marketplace and OEM licensing
    - AWS seller profile and OEM page
    - Extends reach beyond classical direct seats
    - Revenue contribution of these routes is not public
  notes: Rows distinguish end-customer segments from distribution routes; Bitdefender can touch the same account through direct, partner, marketplace, or OEM motions, so this is a segmentation lens rather than a strict P&L split.
