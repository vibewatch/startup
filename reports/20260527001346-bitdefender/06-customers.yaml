  - - Kansas Development Finance Authority
    - Public sector / finance
    - GravityZone plus HVI after multiple ransomware incidents on prior tools
    - Production
    - Zero ransomware infections in a year; admin time 50% to 10%; fast deployment
    - Small public entity, so outcome quality is stronger than scale signal
  - - Grant McGregor
    - MSP channel customer
    - Uses GravityZone Cloud MSP Security and MDR for client environments
    - Production
    - Revenue growth from 8% to 15%; security labor from 35-40 hours to one hour; 75% lower CPU use
    - MSP economics are not the same as end-customer economics
  - - Large U.S. university
    - Education / enterprise
    - More than 2,200 endpoints protected across user devices and servers
    - Production
    - 80-90% performance improvement and avoided breaches for four years
    - Anonymous customer; brand value lower than Ferrari or a public institution name
  - - Pikolin Group
    - European manufacturing enterprise
    - 1,300 endpoints plus expanded EDR, analytics, patch, and encryption stack
    - Production
    - Five-year relationship and multi-module expansion
    - Historical case study and no financial value disclosure
  notes: This is a sample of the retained named public record, not an exhaustive list of Bitdefender customers. Rows emphasize production deployments and disclosed outcomes over logo count.
