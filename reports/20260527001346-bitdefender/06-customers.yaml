  evidenceGaps:
  - type: missing-source
    severity: material
    topic: customer-count-disclosure
    missingEvidence: Exact active enterprise-customer count, consumer subscriber count, and current revenue split by consumer, SMB channel, and enterprise segments.
    whyItMatters: The current thesis can support breadth and named proof, but not segment mix or scale weighting, which matters for valuation comps and durability.
    diligencePath: Request management KPI pack with active accounts, paid subscribers, and revenue by segment/channel for the last eight quarters.
    relatedQuestionRefs:
    - QU020
    - QU023
  - type: private-evidence-only
    severity: material
    topic: retention-economics
    missingEvidence: NRR, GRR, churn, renewal rates, contract lengths, and module attach by segment or channel.
    whyItMatters: Case studies show customer wins, but they do not show whether Bitdefender keeps and expands those customers at software-quality economics.
    diligencePath: Request cohort tables for consumer subscriptions, direct business accounts, and partner-led accounts, including renewal and attach by product tier.
    relatedQuestionRefs:
    - QU017
  - type: private-evidence-only
    severity: material
    topic: channel-mix-and-concentration
    missingEvidence: Direct-versus-channel revenue split, top distributor exposure, top-customer concentration, and rules of engagement between direct reps and partners.
    whyItMatters: The channel appears strategically important, which can be a strength or a conflict source depending on concentration and ownership of renewals.
    diligencePath: Review channel-finance deck, partner compensation policies, and top-20 customer/distributor revenue concentration schedules.
    relatedQuestionRefs:
    - QU021
  - type: missing-source
    severity: material
    topic: regulated-trust-depth
    missingEvidence: Public-sector procurement references, trust-certification list tied to government buying, and named regulated wins beyond the current sample.
    whyItMatters: Healthcare and public-finance cases help, but they do not fully answer whether Bitdefender can scale in highly trust-sensitive public-sector procurement cycles.
    diligencePath: Request public-sector reference list, certification matrix, and current pipeline/win-rate data for healthcare, education, and government.
    relatedQuestionRefs:
    - QU022
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-sample
    missingEvidence: An exhaustive customer-proof table covering the full public case-study set by geography, segment, and recency.
    whyItMatters: This chapter uses a deliberate sample of the named public record; it is enough for pattern recognition but not enough to support exhaustive coverage claims.
    diligencePath: Expand the sample from Bitdefender’s full resource library and third-party case-study aggregators, then map each proof point by segment and date.
    relatedQuestionRefs:
    - QU013
    - QU025
