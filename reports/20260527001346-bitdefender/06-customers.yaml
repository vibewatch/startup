- id: TU006
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / conflict risk
  - Impact
  - Diligence path
  rows:
  - - MDR, XDR, and richer security bundles through MSPs and enterprise upsell
    - Partner-led ownership can blur who controls the renewal and customer relationship
    - Could cap margins or slow direct account intelligence
    - Request direct-vs-partner revenue split, attach by module, and partner rules of engagement
  - - Marquee references such as Ferrari and regulated wins
    - Logos can imply broad enterprise penetration even when their revenue weight is unknown
    - Risk of overstating enterprise mix or logo diversity
    - Request active logo counts and top-10 customer revenue share
  - - Large household and mobile acquisition surface
    - Consumer-heavy volume could still outweigh enterprise economics in the book of business
    - Could compress valuation multiple versus enterprise-software peers
    - Request segment revenue, gross margin, and renewal data
  - - Healthcare, education, and public-finance proof points
    - Trust-sensitive demand may still require certifications or procurement proofs not shown on customer pages
    - Could lengthen public-sector sales cycles or limit expansion
    - Request certification matrix, procurement references, and pipeline/win-rate data for public-sector bids
  notes: 'The risk framing focuses on what public evidence cannot prove yet: concentration, renewal ownership, and whether logos translate into durable revenue quality.'
