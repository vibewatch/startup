company:
  name: Bitdefender
chapter:
  number: 6
  title: Customers
  summary: 'Bitdefender’s public customer record supports a hybrid base spanning consumer households, SMBs reached through MSPs and resellers, and mid-market / enterprise buyers with credible healthcare, public-sector, education, manufacturing, and Ferrari proof points. Distribution is clearly multi-route: self-serve web and app stores for consumers, consultative direct sales for larger accounts, and a large partner ecosystem with MSP billing, marketplace, and OEM paths. The main underwriting weakness is disclosure quality rather than lack of logos: public sources are rich in case studies and partner scale proxies, but thin on exact enterprise-customer counts, retention metrics, and concentration.'
sections:
- id: customer-segmentation-and-regional-footprint
  title: Who buys Bitdefender, and what the public record supports
  body: 'Bitdefender’s customer picture is broad enough to be credible but still unevenly disclosed. The most obvious buyer set is consumer households: the company’s current individual-plans page sells stress-free digital protection, privacy, and identity coverage directly to people and families, while Google Play and editorial reviews show a live app-store and subscription funnel for mobile and multi-device users. That matters because the public surface is not enterprise-only; it still carries a meaningful consumer acquisition and upsell engine. A second segment is SMBs reached through MSPs and resellers. Bitdefender’s partner pages, locator, and MSP product materials all push a partner-mediated route with monthly usage billing, multi-tenant management, and RMM/PSA integration. The third segment is mid-market and enterprise accounts buying directly or through partners, with named proof in Ferrari, Saint Francis Healthcare, a U.S. university, Pikolin, and public-finance customer KDFA. Regulated
    and public-sector sensitivity is therefore supportable, but only through sample logos rather than disclosed counts. Regional mix is also directional, not precise: named proof in this chapter clusters in the U.S., U.K., Spain, and Italy, while FeaturedCustomers and Bitdefender’s own materials extend the narrative to 150-170+ countries without publishing exact active-customer totals or current segment mix.'
