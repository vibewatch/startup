evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ownership-transparency
    missingEvidence: >-
      Current cap table, exact shareholder percentages, board rights, preferred-share terms, and management option-pool
      details.
    whyItMatters: Ownership economics directly affect dilution, IPO readiness, liquidation behavior, and governance leverage.
    diligencePath: Request the live capitalization table, shareholder register, option schedule, and governing documents under NDA.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: >-
      A management-certified 2025 or 2026 headcount bridge separating global group employees, Romanian employees, and
      average versus point-in-time counts.
    whyItMatters: >-
      Scale and productivity judgments change depending on whether diligence uses group, local-entity, or
      directory-estimate figures.
    diligencePath: Request a current HR census or payroll-backed headcount pack by entity, geography, and business unit.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: customer-count
    missingEvidence: >-
      A precise, current customer count broken out by consumer subscribers, enterprise accounts, and channel-managed
      customers.
    whyItMatters: >-
      Customer concentration, retention, and valuation quality cannot be assessed well from vague claims like “millions”
      or partner counts alone.
    diligencePath: >-
      Request a current customer KPI pack or cohort dashboard that separates paying users, active enterprise tenants,
      and partner-served accounts.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 public milestone chronology
    missingEvidence: >-
      A fuller dated ledger of product releases, governance changes, litigation, and partnerships beyond the selected
      milestones retained here.
    whyItMatters: >-
      A denser chronology would help later chapters align market, product, and legal developments against one canonical
      timeline.
    diligencePath: >-
      Expand chronology with company press archives, filings, and legal-event searches during later chapter drafting or
      report refresh.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: segment-revenue-mix
    missingEvidence: >-
      Disaggregated Bitdefender revenue by consumer subscriptions, direct enterprise software, MSP channel, and MDR or
      managed-service attach.
    whyItMatters: >-
      Without segment mix, public TAM to company-revenue translation remains approximate and the real B2C/B2B weighting
      is unknown.
    diligencePath: Request current board or lender materials showing revenue by segment, channel, geography, and gross margin.
    relatedQuestionRefs:
      - QM009
      - QM025
  - type: private-evidence-only
    severity: material
    topic: customer-count-by-segment
    missingEvidence: Paid endpoint counts, paid business accounts, and MDR-attached customer counts by direct vs MSP channel.
    whyItMatters: >-
      These metrics are necessary to translate broad market lenses into an actual Bitdefender SOM and to test channel
      concentration risk.
    diligencePath: >-
      Request cohort data on managed endpoints, active MSP tenants, direct enterprise logos, and MDR conversion by
      segment.
    relatedQuestionRefs:
      - QM009
      - QM015
  - type: missing-source
    severity: material
    topic: regulated-residency-proof
    missingEvidence: >-
      Public proof of Bitdefender data-residency, sovereign-hosting, and regional compliance coverage by product tier
      for regulated buyers.
    whyItMatters: >-
      Regulated-enterprise fit depends on more than product claims; buyers often require specific residency and
      assurance artifacts before procurement.
    diligencePath: >-
      Collect current trust-center documents, regional hosting maps, certification scope, and public-sector procurement
      references by jurisdiction.
    relatedQuestionRefs:
      - QM014
      - QM025
  - type: private-evidence-only
    severity: minor
    topic: consumer-attach-rate
    missingEvidence: >-
      Attach rates for VPN, password manager, identity protection, and theft-insurance add-ons inside the consumer
      installed base.
    whyItMatters: >-
      These attach rates determine whether consumer ARPU behaves like mature antivirus, broader security software, or
      identity-protection subscriptions.
    diligencePath: Request consumer cohort and renewal data split by product bundle and attachment behavior.
    relatedQuestionRefs:
      - QM004
      - QM007
  - type: stale
    severity: material
    topic: defender-win-loss
    missingEvidence: >-
      Current win-loss and displacement data versus Microsoft Defender, CrowdStrike, and Palo Alto in enterprise and MSP
      segments.
    whyItMatters: >-
      Bundling and platform-consolidation pressure are major constraints, but their practical severity for Bitdefender
      cannot be quantified from public sources alone.
    diligencePath: Request the latest competitive intelligence deck, top-loss reasons, and renewal retention data by segment.
    relatedQuestionRefs:
      - QM021
      - QM022
  - type: missing-source
    severity: material
    topic: enterprise-pricing-transparency
    missingEvidence: >-
      Public seat-based or contract-floor pricing for Bitdefender Business Security Enterprise, CrowdStrike Falcon,
      SentinelOne, and Cortex XDR on the same basis.
    whyItMatters: >-
      Without comparable public enterprise prices, this chapter can describe transparency and bundle posture but cannot
