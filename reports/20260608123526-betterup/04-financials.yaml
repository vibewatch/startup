- id: TI004
  title: Capital adequacy table
  columns:
  - Metric
  - Public value or status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Cumulative capital raised
    - $566.9M to $628M depending on whether 2024 micro-offerings are included
    - Medium
    - Sets the historical capital base and frames dilution versus current scale
    - Request cap table and financing summary that reconciles vendor totals
  - - Latest priced primary round
    - Series E in 2021 at roughly $4.7B valuation
    - High
    - Still the last clearly priced major primary round in reviewed public sources
    - Request whether any later internal valuation marks or structured financings exist
  - - 2024 SEC micro-offerings
    - $214,699 sold in March 2024 filing and $189,900 sold in October 2024 filing
    - Medium
    - Signals post-2021 cap-table activity but not obviously growth financing
    - Request security class, purpose, and participating holders for both filings
  - - 2026 secondary-market signal
    - Nasdaq Private Market shows active bids, offers, last trade, and live orders
    - Low
    - Useful liquidity read but not a clean current valuation without share-count context
    - Request share-class mapping and any approved secondary transactions
  - - Cash on hand
    - null
    - Low
    - Without cash, liquidity and financing dependency cannot be sized
    - Request latest balance sheet and monthly cash report
  - - Monthly burn
    - null
    - Low
    - Burn rate determines runway and next-round trigger
    - Request monthly P&L and cash-flow statements
  - - Runway months
    - null
    - Low
    - Runway is the main capital-adequacy output investors need
    - Request 12-month plan and downside runway scenario
  - - Debt or project-finance obligations
    - No public debt facilities or covenant disclosures found in reviewed sources
    - Low
    - Absence of disclosure is not proof of absence of leverage
    - Request debt schedule, lender list, and any recourse obligations
  - - Next-round trigger
    - Unknown; no public management guidance found
    - Low
    - Determines whether the company is raising from strength or necessity
    - Request board-approved financing trigger and milestone plan
  notes: BetterUp's funding history is much more visible than its balance-sheet liquidity. Public sources support round history and secondary activity, but not runway.
