- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value or null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - 2021 ARR anchor
    - $100M ARR in July 2021 (official); Sacra modeled ~$125M at end-2021
    - Medium
    - Only official topline anchor in the public record and a base for valuation-history analysis
    - Request audited FY2021 revenue and the exact ARR definition used
  - - 2022 ARR estimate
    - ~$175M ARR (Sacra estimate)
    - Low
    - Only reviewed public 2022 value point; useful but not independently corroborated
    - Request 2022 management P&L and ARR bridge
  - - 2023-2024 revenue estimate series
    - '2023: $151.7M (GetLatka) vs $250M (Sacra); 2024: $214.6M (GetLatka)'
    - Low
    - The user-requested $214.6M and $151.7M figures are supported by GetLatka, but public sources disagree on 2023
    - Request FY2023-FY2024 audited revenue, ARR, and bookings
  - - Current scale signal
    - 750+ organizations, 4,000+ coaches, 75+ languages, 70+ countries (official 2026)
    - Medium
    - Shows enterprise breadth and supply-side complexity even without financial statements
    - Request paying organizations, active members, and paid-seat counts
  - - Headcount snapshot
    - 500 to 2.8K people depending on source
    - Low
    - The denominator drives every revenue-per-employee and sales-efficiency proxy
    - Request HRIS headcount by employee vs contractor and segment
  - - Revenue per employee
    - $76.6K to $338K per employee depending on source pairings
    - Low
    - A very wide range implies public denominator ambiguity is too high for a clean efficiency read
    - Request same-period revenue and employee count on a consistent basis
  - - Revenue per quota-carrying rep
    - ~$1.61M using GetLatka's 2024 figure and 133 sales reps
    - Low
    - Directionally useful for enterprise sales efficiency, but both inputs are third-party estimates
    - Request FY2024 new ARR, quota-carrying reps, and sales productivity by segment
  - - Gross margin / CAC / payback / current NRR
    - null
    - Low
    - These are the core software and services underwriting metrics, and none are disclosed in reviewed sources
    - Request cohort-level gross margin, CAC, payback, logo retention, and expansion metrics
  notes: Every estimated efficiency metric here is low confidence because BetterUp has not published management financials and third-party revenue/headcount datasets disagree materially.
