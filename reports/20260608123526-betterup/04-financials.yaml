- id: capital-and-valuation
  title: Capital raised, valuation history, and secondary-market signals
  body: 'BetterUp''s funding history is much better documented than its operating statements. The company''s own 2021 Series E announcement said it raised $300M at a $4.7B valuation and had total funding of $600M, while SEC Form D filings show a roughly $147M Series D in February 2021 and a roughly $339M Series E filing in October 2021. The main 2026 disagreement is around what counts as cumulative capital: ZoomInfo and GetLatka summarize six core rounds totaling roughly $567M to $570M, whereas Tracxn counts eight rounds and $628M because it includes two 2024 Series E-labeled Form D filings for just $214,699 and $189,900. Those 2024 filings are too small to read as a fresh growth round, and public sources do not explain whether they relate to employee liquidity, option exercises, or some other cap-table housekeeping. A separate 2026 signal comes from Nasdaq Private Market, which showed an active BetterUp order book with a $260.80 highest bid, $188.50 lowest offer, $234 last trade, and 1,298
    live orders, but the same page also lists an NPM price estimate of $2.09 as of May 22, 2026. Without share-class context and a fully diluted share count, those secondary signals are useful as liquidity evidence but not as a clean current valuation.'
  claimRefs:
