- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwrite
  - Exact diligence path
  - Current public workaround
  - Residual risk
  rows:
  - - Cash balance, burn, and runway
    - Cannot judge capital adequacy or financing urgency
    - Request monthly cash report, debt schedule, and 12-month runway model
    - None beyond historical fundraising record
    - High
  - - Gross margin split between coaches and software
    - Cannot assess whether BetterUp behaves like software, services, or a hybrid labor model
    - Request contribution margin by product line and coach-delivery cost bridge
    - ROI case studies only
    - High
  - - CAC, payback, and channel economics
    - Cannot underwrite enterprise sales efficiency or scalability of partner motion
    - Request pipeline, CAC, payback, and win-rate data by channel
    - Low-confidence revenue-per-rep proxy from GetLatka
    - High
  - - Revenue mix, ASP, discounts, and seat counts
    - Cannot convert topline estimates into durable unit economics or renewal quality
    - Request ARR mix by product, enterprise tier, region, and contract term
    - Only qualitative packaging signals
    - High
  - - Headcount definition (employees vs. coaches)
    - Revenue-per-employee and sales productivity remain highly ambiguous
    - Request HRIS headcount by role plus contractor-coach census
    - Use conflicting third-party workforce estimates as a range only
    - Medium-high
  - - Current valuation and share count
    - Secondary trading data cannot be mapped to enterprise value or dilution
    - Request fully diluted share count, share-class map, and latest 409A or internal mark
    - 2021 priced round and 2026 secondary order book
    - High
  - - Purpose of 2024 micro-offerings
    - Cap-table events could imply employee liquidity or other financing behavior not obvious from round history
    - Request legal explanation and board approvals for the two 2024 Form D filings
    - Only the SEC dollar amounts are public
    - Medium
  - - Post-2021 retention and target attainment
    - Missed-target media reports are material but unverified by management
    - Request plan-vs-actuals, NRR, churn, and board commentary on the 2023 layoff
    - Adverse media plus Sacra risk commentary
    - Medium-high
  notes: The main BetterUp diligence blocker is not lack of company scale; it is lack of public operating detail needed to translate scale into margin and liquidity confidence.
