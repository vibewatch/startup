company:
  name: BetterUp
chapter:
  number: 4
  title: Financials
  summary: BetterUp shows real enterprise scale and strong historical fundraising, but its current financial profile is still mostly inferred from company marketing, private-market data vendors, and two small 2024 Form D filings. The best-supported topline estimate is GetLatka's $214.6M 2024 figure, yet conflicting third-party series, opaque pricing, ambiguous headcount, and missing cash, margin, and CAC disclosure keep the underwrite materially incomplete.
sections:
- id: revenue-model
  title: Revenue model, packaging, and monetization visibility
  body: 'BetterUp''s public materials support a business model built around enterprise coaching contracts rather than a transparent self-serve SaaS checkout. The enterprise page describes a platform that combines expert human coaching, AI guidance, and performance intelligence, while the 2020 Identify AI release explains how BetterUp uses HCM-linked data and role-based coaching products to decide who should receive what level of coaching. Distribution evidence also points to enterprise embedment: the Workday badge release says BetterUp imports HCM data to trigger coaching around promotions and organizational changes, and the Microsoft Viva partnership extends BetterUp content into a workplace surface used by millions. What remains notably opaque is price realization. BetterUp''s own enterprise surfaces do not expose a list price, and a March 2026 directory listing still says contact sales for pricing with a license model and no starting price. Sacra''s January 2026 note still references
    legacy-style monthly individual plans at $71, $119, and $223, but those plans are not foregrounded on the current enterprise site. That combination implies a monetization engine with real enterprise breadth but weak public visibility into ASP, discounts, seat counts, and revenue-recognition mix.'
