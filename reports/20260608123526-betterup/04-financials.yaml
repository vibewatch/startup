tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value or status
  - Quality
  - Diligence ask
  rows:
  - - Enterprise coaching programs
    - Multi-seat enterprise contracts for leadership, manager, and workforce development
    - Organization / cohort / seat bundle
    - Clearly core stream; official pages and partner surfaces position BetterUp for enterprise HR and L&D buyers
    - 'Medium-high: enterprise demand is visible, realized ASP is not'
    - Request contracted ARR by product, cohort size, and renewal schedule
  - - AI coaching and digital practice layer
    - Always-on AI guidance, assessments, and content inside workflow tools
    - Bundled platform access
    - Officially present in enterprise product and Microsoft Viva distribution, but no standalone revenue disclosure
    - 'Medium: product is visible, pricing is opaque'
    - Request AI attach rate, usage-based pricing logic, and gross margin split
  - - Live 1:1 and group coaching sessions
    - Human coach supply delivered through platform matching and scheduled sessions
    - Session allocation within contract
    - Clearly central to the service model, but public sources do not separate session revenue from platform fees
    - 'Medium: core delivery mechanism, not cleanly segmented as revenue'
    - Request coaching-session mix, coach utilization, and contribution margin
  - - Partner-embedded distribution
    - Workday and Microsoft workflow channels create top-of-funnel and embedded use cases
    - Partner-enabled enterprise access
    - Visible in Workday HCM and Microsoft Viva integrations; no direct revenue split disclosed
    - 'Medium: channel is real, economics unknown'
    - Request sourced pipeline, attach rate, and partner revenue-share terms
  - - Legacy or non-prominent B2C subscriptions
    - Monthly individual plans cited by Sacra at $71 / $119 / $223
    - Member subscription
    - Present in a 2026 third-party research report but not highlighted on current BetterUp enterprise pages
    - 'Low-medium: likely real but not central to current public GTM'
    - Clarify whether B2C is active, material, or legacy only
  notes: BetterUp's revenue mechanism is legible, but public sources do not disclose revenue mix across enterprise contracts, AI features, coaching delivery, or any residual B2C plans.
