- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer or surface
  - Price / contract
  - List vs. realized pricing
  - Included capabilities
  - Discounts or unknowns
  - Source implication
  rows:
  - - Current enterprise platform
    - Contact sales / demo request
    - No public list price
    - Human coaching, AI guidance, analytics, enterprise workflow integration
    - No public seat minimums, term lengths, or discounting
    - Public pricing opacity is a core underwriting gap
  - - Software-directory listing (March 2026)
    - Contact us for pricing; license model; no free trial
    - Directory summary, not a customer contract
    - BetterUp AI Coach described as enterprise employee-development software
    - Starting price N/A and realized pricing unknown
    - Corroborates enterprise, sales-led packaging rather than self-serve
  - - 'Sacra individual plan: 1 session / month'
    - $71 per month
    - Third-party reported price
    - 1:1 coaching access plus app resources
    - No evidence on conversion, churn, or current prominence
    - Suggests a consumer or legacy edge-case price point still visible to researchers
  - - 'Sacra individual plan: 2 sessions / month'
    - $119 per month
    - Third-party reported price
    - Higher session frequency
    - No evidence on take rate or margin
    - Shows historical / alternative packaging, not current enterprise realized price
  - - 'Sacra individual plan: 4 sessions / month'
    - $223 per month
    - Third-party reported price
    - Highest disclosed monthly session bundle
    - No evidence on current availability, subsidy, or discounts
    - Useful ceiling for member-level pricing, not for enterprise ASP
  notes: BetterUp's current public pricing surface is enterprise-first and opaque; the only numeric prices reviewed came from third-party research, not current BetterUp checkout pages.
