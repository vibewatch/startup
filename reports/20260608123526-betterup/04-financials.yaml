  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: 2023-2024 revenue trajectory
    missingEvidence: A management revenue bridge or audited income statement that reconciles 2023 and 2024 revenue/ARR across third-party datasets.
    whyItMatters: Public revenue estimates drive every efficiency and valuation multiple in this chapter, and the current third-party series disagree materially.
    diligencePath: Request monthly/annual ARR bridge for FY2021-FY2025 plus board reporting definitions for ARR, GAAP revenue, and gross bookings.
    relatedQuestionRefs:
    - QI007
    - QI008
    - QI025
    - QI027
    relatedTableRefs:
    - TI003
  - type: conflicting-data
    severity: material
    topic: Headcount definition and workforce composition
    missingEvidence: A reconciled org chart showing corporate employees, contracted coaches, quota-carrying reps, and international entities as of 2026.
    whyItMatters: Revenue per employee and sales-efficiency proxies swing materially depending on whether contractor coaches are counted as people or external supply.
    diligencePath: Request HRIS headcount by employee vs contractor and a sales-org roster with quota-carrying headcount.
    relatedQuestionRefs:
    - QI012
    - QI013
    - QI014
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: Cash, burn, runway, and debt obligations
    missingEvidence: Cash balance, operating burn, runway, debt facilities, covenant schedule, and any recourse obligations.
    whyItMatters: Without liquidity data, it is impossible to judge capital adequacy, next-round timing, or downside financing risk.
    diligencePath: Request latest board deck, monthly cash report, debt schedule, and 12-month budget-to-actual runway model.
    relatedQuestionRefs:
    - QI019
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: Gross margin, CAC, payback, and revenue mix
    missingEvidence: Gross margin bridge separating coach delivery, platform/software, support, and partner/channel costs, plus CAC/payback by segment.
    whyItMatters: BetterUp's model combines labor and software, so topline scale alone does not reveal contribution margins or sales efficiency.
    diligencePath: Request cohort-level unit-economics deck with segment revenue mix, ASP, discounting, CAC, payback, and retention.
    relatedQuestionRefs:
    - QI020
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: Secondary-market share class and implied valuation
    missingEvidence: Fully diluted share count, share-class mapping, split history, and the class represented by Nasdaq Private Market bid/ask data.
    whyItMatters: The secondary order book provides a live signal, but without share-count and share-class context it cannot be converted into a reliable current valuation.
    diligencePath: Request cap table summary and any approved secondary transaction materials covering the relevant share class.
    relatedQuestionRefs:
    - QI015
    - QI016
    - QI022
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: Purpose of the 2024 micro-offerings
    missingEvidence: Offering memo, board consent, or cap-table note explaining why the two 2024 Form D filings were made and what securities were sold.
    whyItMatters: The filings are too small to represent normal growth capital, but their purpose matters for reading employee liquidity, option exercises, or other capital-structure events.
    diligencePath: Request legal/finance explanation of the two 2024 Form D filings, including purchaser class and security type.
    relatedQuestionRefs:
    - QI005
    - QI026
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: Missed-target confirmation and current plan accuracy
    missingEvidence: Board-approved plan vs. actual revenue, bookings, and headcount for 2023-2026, including any reforecast after the layoffs.
    whyItMatters: Media reports of missed targets are material to revenue quality and valuation confidence, but they are not confirmed in official materials.
    diligencePath: Request budget vs actuals, revised 2024-2026 operating plan, and board discussion of the 2023 layoff rationale.
    relatedQuestionRefs:
    - QI018
    - QI025
    relatedTableRefs:
    - TI005
