    - Low-Medium
    - High
    - Known investor base and scale create some room to maneuver
    - Request board materials on financing strategy, liquidity planning, and scenario thresholds for a fresh lead round
  notes: People risk here is not only about named executives. It is also about whether BetterUp can retain the operators who turn hybrid human-plus-AI coaching into a repeatable enterprise product rather than an expensive category story.
