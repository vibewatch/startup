- id: mitigation-maturity-and-kill-criteria
  title: Mitigation Maturity and Kill Criteria
  body: 'BetterUp does have credible mitigants. The company is not pretending the market is still a pure human-coaching category: it is explicitly pushing a hybrid human-plus-AI model, publishing dedicated privacy and legal materials, and describing AI governance as something shaped by a decade of human-coaching ethics rather than by generic chatbot logic. Those are positives, but the residual exposure is still high because the public proof set is incomplete in the places investors care about most. The sources reviewed here do not establish renewal durability, customer concentration, coach-quality consistency, incident history, or the exact path from 2021 financing to a later liquidity event. That means diligence should treat mitigation maturity as provisional until management can show hard operating evidence. The right kill criteria therefore sit around monitorable signals, not abstract fears: any privacy or AI-governance miss, a visible shift of employer budgets away from discretionary
    coaching, a deterioration in coach quality metrics, or financing activity that confirms a materially lower clearing price than the 2021 valuation anchor should all trigger a thesis reset rather than incremental concern.'
