  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: coach-quality-transparency
    missingEvidence: Public coach credential mix, coach attrition, supervision ratios, wait-time distributions, and quality-audit outcomes by market segment.
    whyItMatters: BetterUp’s marketplace model makes coach quality central to product value, but public sources do not show whether quality scales consistently across geographies and use cases.
    diligencePath: Request coach-ops dashboards, credential distribution, churn by cohort, supervisor ratios, escalation rates, and member satisfaction split by coach type.
    relatedQuestionRefs:
    - QR016
    - QR029
  - type: missing-source
    severity: material
    topic: incident-history
    missingEvidence: A complete public record of breaches, regulator inquiries, customer security incidents, or incident-free attestations tied specifically to BetterUp coaching data.
    whyItMatters: The downside of a sensitive-data failure is much larger than normal L&D software risk, so absence of public incidents is not equivalent to proof of mature controls.
    diligencePath: Run security diligence with breach representations, customer reference checks, subprocessor review, penetration-test summaries, and counsel confirmation on incident history.
    relatedQuestionRefs:
    - QR020
  - type: private-evidence-only
    severity: material
    topic: post-2021-financing-path
    missingEvidence: Board materials or financing records showing whether post-2021 capital has been bridge capital, insider support, or a fresh external price-setting round.
    whyItMatters: The investment case changes materially if BetterUp has needed small insider extensions or is avoiding a new lead round because the 2021 mark no longer clears.
    diligencePath: Request cap-table updates, financing history since 2021, secondary transaction volumes, 409A history, and board discussion of IPO versus private liquidity options.
    relatedQuestionRefs:
    - QR024
  - type: private-evidence-only
    severity: material
    topic: renewal-and-budget-exposure
    missingEvidence: Renewal rates, logo churn, customer concentration, price realization, and the mix of spend coming from L&D, wellbeing, or broader HR budgets.
    whyItMatters: Budget substitution risk is much higher if BetterUp is funded from discretionary wellness and development lines rather than protected workflow or compliance budgets.
    diligencePath: Ask for cohort renewals, top-account share, attach rates for AI-only versus hybrid packages, and renewal-loss reasons tied to cost or bundling.
    relatedQuestionRefs:
    - QR012
    - QR028
    - QR030
  - type: private-evidence-only
    severity: material
    topic: ai-control-evidence
    missingEvidence: Independent evidence of self-harm escalation testing, bias testing, red-teaming, crisis-routing controls, and customer-facing transparency artifacts for AI coaching.
    whyItMatters: BetterUp’s public legal analysis implies real compliance obligations for relational AI, but public marketing materials do not prove operational readiness or auditability.
    diligencePath: Request model-governance documentation, legal memos on NY and CA AI companion laws, testing protocols, escalation logs, and customer notice templates.
    relatedQuestionRefs:
    - QR026
    - QR027
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-register-coverage
    missingEvidence: An exhaustive fifty-state and international map of employment-data, mental-health, and relational-AI rules that could apply to BetterUp deployments.
    whyItMatters: The highest-severity laws are identified, but enterprise exposure can still shift by customer geography, procurement posture, and how coaching data is used in employment contexts.
    diligencePath: Commission outside counsel to map state privacy, AI, labor, and sector-specific obligations by deployment pattern and regulated customer cohort.
    relatedQuestionRefs:
    - QR004
    relatedTableRefs:
    - TR001
