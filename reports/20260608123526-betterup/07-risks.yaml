- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  rows:
  - - Privacy or AI-governance failure
    - Regulator inquiry, customer legal escalation, breach disclosure, or crisis-escalation miss
    - Any material regulator contact tied to coaching data or any confirmed failure of AI disclosure or crisis-routing controls
    - Pause aggressive underwriting of upside, require independent control review, and re-rate the business as a higher-regulation asset
  - - Budget substitution and renewal pressure
    - Renewal slippage, downsell patterns, or procurement objections tied to cost containment or GLP-1 pressure
    - Two consecutive quarters of notable renewal weakness or multiple enterprise losses citing discretionary-budget pressure
    - Treat BetterUp as a cyclical discretionary vendor, lower growth assumptions, and test whether the product still clears a bundled-suite comparison
  - - Suite-platform commoditization
    - Major new Microsoft, LinkedIn, Workday, or SAP releases that add coaching agents, AI tutors, or workflow guidance
    - A top suite vendor ships overlapping functionality and BetterUp loses co-sell priority or clear differentiation in enterprise pitches
    - Escalate diligence on attach rate, pricing power, and whether BetterUp still owns a premium human layer
  - - Coach-quality deterioration
    - Falling satisfaction, longer wait times, higher escalation rates, or credential-mix deterioration
    - Any credible evidence that coach quality is slipping faster than BetterUp can correct it
    - Assume the human moat is eroding and require data proving quality recovery before underwriting margin or retention upside
  - - Financing and valuation reset
    - Secondary-market clearing prices, fresh financing terms, or liquidity programs
    - A new financing or broad secondary clearing price that obviously resets the 2021 valuation anchor downward
    - Rebuild dilution, talent-retention, and exit assumptions from the new clearing price rather than from the 2021 unicorn narrative
  notes: These kill criteria are intentionally monitorable rather than abstract. BetterUp can mitigate many risks operationally, but only if management can show hard evidence before external market or regulatory signals force the re-rating.
