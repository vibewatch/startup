- id: coach-marketplace-and-execution-risk
  title: Coach Marketplace and Execution Quality Risk
  body: BetterUp still depends on people, not just models. Its coach marketplace remains central because the company promises one-on-one, specialist, and group coaching across a wide span of needs, from leadership and career development to parenting, sleep, and mental fitness. That breadth is a commercial advantage, but it also turns coach quality, coach matching, and escalation boundaries into core product risks. The public evidence set is stronger on why credentials matter than on how BetterUp operationalizes them. ICF data show that coaching is a real global market, yet client expectations still favor credentialed professionals and the formal thresholds between ACC, PCC, and MCC levels are substantial. In other words, quality can vary meaningfully inside any large network unless the platform’s own vetting, supervision, and performance management are exceptionally strong. BetterUp’s coach page and growth messaging show scale and ambition, but the reviewed public materials do not reveal
    credential mix, attrition, supervision ratios, wait-time distributions, or quality-audit outcomes. That disclosure gap matters because many of BetterUp’s hardest promises—behavior change, emotionally safe guidance, and manager effectiveness at scale—break first when marketplace quality becomes uneven.
  claimRefs:
