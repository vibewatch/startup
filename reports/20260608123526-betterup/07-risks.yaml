tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Risk / Rule / Case
  - Jurisdiction
  - Current Status
  - Likelihood
  - Severity
  - Mitigation
  - Residual Exposure
  - Diligence Path
  rows:
  - - Relational-AI disclosure and crisis-safeguard laws
    - New York; California
    - Active or imminent, with BetterUp stating its AI coaching sits within scope
    - Medium
    - High
    - Dedicated AI privacy notice, legal analysis, and claimed safety architecture
    - Compliance burden rises as AI coaching becomes more contextual and emotionally aware; a miss would damage trust and enterprise sales
    - Obtain counsel memo mapping disclosures, self-harm detection, crisis routing, transparency materials, and audit logs to NY/CA requirements
  - - AI discrimination and unfairness enforcement on automated workplace tools
    - U.S. federal
    - Active multi-agency enforcement stance with no AI exemption from existing law
    - Medium
    - High
    - Human-plus-AI positioning and customer-specific customization may preserve oversight
    - If BetterUp outputs influence promotion, manager assessment, or talent decisions, the system can attract discrimination or deception scrutiny
    - Review contract language limiting employment-decision use; inspect bias testing, human review controls, and prohibited-use guardrails
  - - Sensitive coaching and wellbeing data handling
    - Multi-jurisdiction enterprise deployments
    - Continuous obligation as BetterUp expands AI coaching into workflow tools and emotionally sensitive topics
    - Medium
    - High
    - Recurring privacy-policy updates, trust messaging, and enterprise legal materials
    - A misuse or leak involving coaching or wellbeing data would likely be judged as more sensitive than normal L&D telemetry even if sector-specific applicability varies by customer
    - Request data map, retention schedule, subprocessor list, model-training boundaries, and customer segmentation for regulated use cases
  - - Employment dispute and culture spillover (Kurtela v. BetterUp)
    - California
    - 2025 labor-and-employment case recorded in San Mateo County; case status closed-stayed
    - Low-Medium
    - Medium
    - No broader public litigation pattern surfaced in this review set
    - Future retaliation or discrimination allegations could undercut BetterUp’s people-transformation brand and complicate enterprise procurement
    - Review complaint, disposition, leadership remediation steps, and any insurance, reserve, or settlement treatment
  - - Brand spoofing and applicant fraud using BetterUp identity
    - Global / internet
    - Precedent established in 2023 WIPO domain ruling
    - Medium
    - Medium
    - BetterUp successfully pursued domain transfer in the known case
    - Repeated spoofing can damage candidate trust, create security-response load, and generate reputational harm out of proportion to the original attack
    - Assess takedown velocity, DMARC and phishing controls, candidate-warning practices, and brand-monitoring coverage
  notes: Rows are ordered by residual severity using the strongest public evidence available as of 2026-06-08; this is a partial register, not an exhaustive fifty-state or multi-country legal map.
  enumerationScope:
    coverage: partial
    basis: Register covers the five highest-priority legal and regulatory exposures surfaced in reviewed BetterUp product, policy, court, and enforcement materials. It excludes lower-signal jurisdictional variants and customer-specific obligations that require deployment-level counsel review.
