  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: BetterUp 通常先切入目标群体，证明效果，再嵌入工作流，之后扩大部署范围。
    data:
      nodes:
        - id: target
          label: 目标群体
          detail: CHRO、L&D 或人力负责人会选定经理、高潜人才、销售负责人，或任务关键人群。
        - id: deploy
          label: 部署教练服务
          detail: 客户面向选定群体上线 1:1 教练、Coaching Circles 或经理项目。
        - id: measure
          label: 衡量成效
          detail: 客户与 BetterUp 跟踪行为、绩效、留存或任务准备度的变化。
        - id: embed
          label: 嵌入系统
          detail: 接入 Microsoft Viva、Workday、SAP 或 Salesforce 后，落地摩擦更小，可视性更高。
        - id: expand
          label: 扩大范围
          detail: 早期证据若成立，就能支撑客户扩大许可证部署，或在账户内增加用例。
    claimRefs:
