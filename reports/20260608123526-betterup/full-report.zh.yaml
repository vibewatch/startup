      - number: '6.4'
        title: 集中度、预算压缩与采用风险
        blocks:
          - type: paragraph
            body: >-
              BetterUp 的客户证据在买方能为领导力人群证明高端辅导支出合理性时最强，这既是优势也是风险。可见客户集偏重大型企业、公共部门组织和转型项目，它们有能力为高管和管理者发展付费。这符合 BetterUp
              的品牌定位，但也暗示公司依赖大账户和目标队列，而不是全员普及。第三方评论和竞争分析也指向同一方向：BetterUp 被定义为高端产品，往往最适合 50-200
              名领导者或有预算的大型企业；当客户不能持续多年投入时，其 ROI 故事更难维持。


              这一点重要，因为客户集中度和预算压缩会相互作用。如果大账户买方开始要求更硬的财务证据，或把预算转向成本更低的 AI 主导替代品，BetterUp
              可能面临扩张放慢、部署范围缩窄，或可自由裁量项目流失。已审阅来源没有披露头部客户集中度，因此本章无法量化 BetterUp 对少数战略账户的暴露程度。但硬留存数据缺失、高端定价画像，以及反复需要证明
              ROI，让客户耐久性成为真实尽调事项，而不是公开案例研究本身能关闭的勾选框。
