        title: 竞争框架：直接同业、相邻平台与现状替代
        blocks:
          - type: paragraph
            body: >-
              BetterUp 并不处在一个单一、干净的企业辅导品类里。最接近的直接替代品是 CoachHub 和 Torch，两者都销售以辅导为核心的转型结果；但许多买方也可以通过扩展现有 HR
              软件，而不是购买独立辅导供应商，来完成同一个任务。Leapsome、Lattice、Culture Amp 和 15Five 都把管理者指导、绩效工作流、分析和 AI 助手打包进更广的人力软件预算。Workday
              和 Cornerstone 又高一层：它们不把自己营销为巨型外部教练网络，但已经掌握 HCM、学习、技能和员工准备预算，可以吸收发展支出。实践中，只有当买方足够重视高端真人辅导加工作流级
              AI，愿意为此设立单独预算项，而不是依赖现有 HCM、绩效或学习栈时，BetterUp 才经常能赢。现实中的现状替代，往往是买方把领导力发展留在既有管理者例行工作、调研、学习工具和 HCM 工作流里。
