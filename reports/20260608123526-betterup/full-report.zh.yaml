  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议保持谨慎，因为 BetterUp 具备可信规模和 AI 动能，但估值分母和价格仍不透明。
    data:
      nodes:
        - id: A
          label: 企业牵引力
          detail: 覆盖 70+ 个国家的 750+ 客户与 4,000+ 教练，支撑了真实规模。
          tone: positive
        - id: B
          label: AI 产品动能
          detail: BetterUp 于 2025 年推出 AI 教练，目前销售由四款产品组成的人类 + AI 平台。
          tone: positive
        - id: C
          label: 公开分母缺口
          detail: 收入、ARR、利润率和留存仍是第三方估算，不是审计披露。
          tone: warning
        - id: D
          label: 二级价格缺口
          detail: Forge 和 PM Insights 有覆盖，但当前价格字段要么受限、要么被遮蔽。
          tone: warning
        - id: E
          label: 决策
          detail: 在管理层证明审计经济性和价格支撑前，结论维持「继续研究 / 公允至偏贵」。
          tone: neutral
      edges:
        - to: E
          label: 支撑上行
          from: A
        - to: E
          label: 可改善经济性
          from: B
        - to: E
          label: 阻碍确信
          from: C
        - to: E
          label: 让价格仅具示意性
          from: D
    approximationNotes: 流程图概括的是投资判断逻辑，不是数值模型。
    claimRefs:
      - CV008
      - CV015
      - CV016
      - CV021
      - CV022
      - CV064
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 按公开的 2024 年收入估算，BetterUp 的公允价值高度取决于投资者愿意在 2026 年支付的收入倍数。
    data:
      items:
        - label: 5x 收入
          value: 1.073
          detail: 基于 $214.6M 收入的粗略软件估值倍数下限。
          tone: negative
        - label: 7x 收入
          value: 1.502
          detail: 困境或低质量未上市软件公司的区间上沿。
          tone: warning
        - label: 9x 收入
          value: 1.931
          detail: 接近 L40 顶级未上市 SaaS 区间的上沿。
          tone: neutral
        - label: 11x 收入
          value: 2.361
          detail: 略高于请求中的 $2.26B 锚点。
          tone: positive
        - label: 13x 收入
          value: 2.79
          detail: 需要 BetterUp 在市场重置后仍守住很高溢价。
          tone: positive
    approximationNotes: 数值是基于 GetLatka 2024 年收入估算做的简单倍数桥，以十亿美元计。
    claimRefs:
      - CV014
      - CV056
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 可支撑区间很宽，因为当前估值标记同时取决于增长，以及 AI 如何影响服务经济性和买方信心。
    data:
      items:
        - label: 悲观
          low: 0.9
          mid: 1.15
          high: 1.4
          displayValue: $0.9B-$1.4B
          detail: AI 压缩溢价，收入支撑仍偏软。
          tone: negative
        - label: 基准
          low: 1.8
          mid: 2.15
          high: 2.5
          displayValue: $1.8B-$2.5B
          detail: 收入落在 $220M-$250M 附近，市场支付 8x-10x。
          tone: warning
        - label: 乐观
          low: 2.6
          mid: 3.1
          high: 3.8
          displayValue: $2.6B-$3.8B
          detail: AI 改善杠杆，BetterUp 维持成长型软件的溢价评级。
          tone: positive
        - label: 2026 年示意锚点
          low: 2.26
          mid: 2.26
          high: 2.26
          displayValue: ~$2.26B
          detail: 可用于价格校验，但不是已确认的公开交易成交价。
          tone: neutral
    approximationNotes: 所有区间都是基于情景的估值带，以十亿美元计，不是管理层指引，也不是已观察到的二级市场成交。
    claimRefs:
      - CV009
      - CV057
      - CV058
      - CV059
      - CV063
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: BetterUp 在企业牵引力和产品广度上得分不错，但证据质量和下行保护仍弱于故事本身。
    data:
      items:
        - label: 企业牵引力
          score: 8
          detail: 官方材料显示企业覆盖面广，教练网络庞大。
          tone: positive
        - label: AI / 产品广度
          score: 7
          detail: 平台有清晰可见的 AI 路线图，并保持 2025-2026 年发布节奏。
          tone: positive
        - label: 市场相关性
          score: 7
          detail: BetterUp 仍处在韧性较强的人力科技和劳动力发展支出类别里。
          tone: positive
        - label: 证据质量
          score: 4
          detail: 收入、利润率和留存仍是估算值，不是公开审计数据。
          tone: warning
        - label: 估值支撑
          score: 5
          detail: 只有落在公开分母区间上沿附近时，示意估值才站得住。
          tone: warning
        - label: 下行保护
          score: 4
          detail: 清算优先权栈不透明、二级价格不确定，削弱投资判断信心。
          tone: warning
    approximationNotes: 分数是基于保留公开证据构建的 1-10 分投资委员会启发式判断。
    claimRefs:
      - CV015
      - CV021
      - CV045
      - CV054
      - CV063
      - CV066
      - CV067
