      - number: '7.3'
        title: 教练市场与交付质量风险
        blocks:
          - type: paragraph
            body: >-
              BetterUp
              仍然依赖人，不只是模型。教练市场仍是核心，因为公司承诺覆盖一对一、专家和团体教练，需求横跨领导力、职业发展、育儿、睡眠和心理适能。广度是商业优势，也把教练质量、匹配和升级边界变成核心产品风险。公开证据更能说明资质为何重要，却很少说明
              BetterUp 如何把资质运营起来。ICF 数据显示，教练是一个真实的全球市场，但客户预期仍偏向持证专业人士，ACC、PCC 和 MCC
              等级之间的正式门槛也相当高。换句话说，任何大型网络内部的质量都可能明显分化，除非平台自身筛选、督导和绩效管理极强。BetterUp
              的教练页面和增长话术显示规模和野心，但本次审阅的公开材料没有披露资质结构、流失、督导比例、等待时间分布或质量审计结果。这个披露缺口很关键，因为 BetterUp
              最难兑现的承诺——行为改变、情绪安全的指导、规模化提升管理者效能——在市场质量不均时最先断裂。
