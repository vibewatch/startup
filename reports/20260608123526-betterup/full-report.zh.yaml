      - number: '1.2'
        title: 创始人、领导梯队与治理可见度
        blocks:
          - type: paragraph
            body: >-
              公开记录里，BetterUp 仍明显由创始人主导，同时领导梯队在变厚。当前关于页面仍把 Alexi Robichaux 和 Eduardo (Eddie) Medina 置于联合创始人位置，Alexi 担任
              CEO，Eddie 担任 COO；已审阅材料没有显示出类似后期金融科技或市场平台公司有时披露的创始人交棒。变化在于围绕两人的职业化管理层更多了。2026 年 5 月的 CFO 任命，把 Kristian
              Talvitie 从 PTC 引入，负责财务、会计和投资者关系；对一家开始考虑纪律性增长、资本策略和最终流动性选择的公司来说，这是典型成熟信号。BetterUp
              也突出展示了围绕商业化、人力、科学和辅导的深厚团队，以及一个显眼的科学委员会。治理层面的限制是可见度：已审阅的官方页面都没有给出清晰董事会名单、委员会结构、所有权图或保留事项框架。因此，本章可以核验公开经营者是谁，但无法判断正式控制权如何在创始人、投资者和任何非执行董事之间分配。
