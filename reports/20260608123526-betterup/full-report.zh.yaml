  - id: TV007
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - 经审计 ARR 桥
        - 按产品和客户分群拆分的经审计 2025-2026 ARR 与收入桥
        - 估值争议取决于真实分母更接近 $175M、$215M，还是 $250M+。
        - 财务团队、审计师和董事会材料。
      - - 毛利率和教练支出
        - AI 推出前后的毛利率、贡献利润率、教练利用率和支出趋势
        - 判断 AI 是扩大利润率，还是只是掩盖服务强度。
        - 财务与运营联合复盘材料。
      - - 留存质量
        - 按雇主队列拆分的 NRR、GRR、队列续约、席位扩张和收缩
        - 没有留存证据，BetterUp 拿不到稳定高倍数。
        - 收入运营和客户成功仪表盘。
      - - 老股与 409A 支撑
        - 最新 409A、要约或老股交易价，以及任何共同基金标记
        - 将约 $2.26B 示例锚点转成经验证的市场数据点。
        - 过户代理、CFO 和投资人关系材料包。
      - - 股权结构表和优先权
        - 清算优先权堆叠、参与权、附函和 ROFR 限制
        - 如果优先股堆叠沉重，名义估值可能高估普通股价值。
        - 法律顾问和最新股权结构表导出。
      - - AI 采用经济性
        - AI 教练产品的使用、挂载、转化和续约证据
        - 显示 AI 是在创造价值、守住留存，还是抬高商品化风险。
        - 产品分析和 GTM 评分卡。
    notes: 这些是把 BetterUp 从有意思的私募市场故事，转成可在所要求估值附近承销投资所需的最低文件清单。
