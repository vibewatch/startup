      - number: '4.2'
        title: 收入轨迹、规模信号与效率代理指标
        blocks:
          - type: paragraph
            body: >-
              最干净的官方财务锚点仍是历史数据：BetterUp 2021 年 10 月称公司已跨过 $100M ARR，净留存率超过 170%。此后，公开记录变得高度依赖估计。Sacra 建模显示 BetterUp 2021
              年 ARR 约 $125M、2022 年 ARR 为 $175M；GetLatka 称收入在 2023 年达到 $151.7M、2024 年达到 $214.6M。不过，Sacra 又显示 2023 年收入为
              $250M，因此 2023-2024 年轨迹方向为正，但没有得到独立调和。即使营收线不透明，运营规模仍可见：官方披露从 2021 年 380 家企业客户、100 万次会话和 3,000 名教练，推进到 2023
              年近 300 万次会话、600+ 组织，再到 2026 年 750+ 组织和 4,000 名教练。员工数是关键分母问题。Tracxn 显示 2,717 名员工，GetLatka 称 2.8K 人，其中包括 133
              名持配额销售，Apps Run The World 列出 500 名员工和 $169M 收入，IncFact 给出 500-1,000
              区间。这些不一致产生了非常宽的单员工收入区间，也意味着每个效率代理指标都应标注低置信度。
