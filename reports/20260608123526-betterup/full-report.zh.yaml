  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 隐私、法律与声誉风险
        blocks:
          - type: paragraph
            body: >-
              BetterUp 现在卖的不只是传统高管教练。公司当下的产品话术围绕面向每名员工的 AI 教练、Slack、Teams 和 Calendar
              里的实时指导，以及对心理适能、韧性和其他职场情绪敏感时刻的支持。范围拉宽后，系统里沉淀的员工上下文更多，买方、监管方或原告也更可能把这些数据看成比普通学习遥测更敏感。BetterUp
              自身法律材料显示，公司多次更新政策，专门写入 AI 隐私条款，并明确指出 AI 教练已落入纽约和加州 第一波关系型 AI 监管。外部监管也在同向推进：FTC 及同类机构强调，AI
              不能豁免既有消费者保护或反歧视法律。案卷里已经能看到法律与信任摩擦，包括 2025 年雇佣诉讼和一起 WIPO 域名欺诈案。这些都不能证明平台控制失灵，但足以说明 BetterUp
              品牌很容易被卷入负面叙事；一旦真出现数据治理疏漏，声誉下行会被放大。
