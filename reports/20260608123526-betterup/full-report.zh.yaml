      - number: '8.4'
        title: 情景区间与 AI 敏感度
        blocks:
          - type: paragraph
            body: >-
              在公开证据下承销 BetterUp，最干净的方法是用收入倍数区间，AI 是能够同时撬动增长和利润率的主变量。乐观情景要求 BetterUp 的 2025-2026 年 AI
              推出不只是增加产品宽度：它必须提高教练产能、改善贡献利润率，并守住企业留存，让投资人有理由在更大的分母上给 10x-12x 收入或类 ARR 倍数。基准情景没那么英雄主义，也更可信。它假设收入已在
              $220M-$250M 区间，AI 主要帮业务防守而不是大幅扩张，市场给一个有规模但仍不透明的私人 HR-tech 资产约 8x-10x。悲观情景不是需求崩盘，而是溢价压缩。如果 BetterUp 无法证明 AI
              改善经济性，或买方认为 AI 让教练更容易被替代，倍数可能压到 5x-7x，估值被推近 $0.9B-$1.4B。因此，这里的 AI 不只是产品故事。它是连接增长、服务成本、买方信心和退出倍数的关键变量。
