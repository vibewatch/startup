      - number: '2.2'
        title: 公开规模测算显示品类很大，但没有干净的 BetterUp SAM
        blocks:
          - type: paragraph
            body: >-
              公开市场估计支持领导力发展和辅导支出相当可观，但并没有拆出干净的 BetterUp 专属 TAM、SAM 或 SOM。Mordor 估计 2026 年高管辅导和领导力发展市场为 $112.98
              billion，Future Market Insights 把 2026 年领导力发展项目市场定为 $98.7 billion，Coherent Market Insights 估算 2026
              年领导力发展辅导市场为 $116.47 billion。对于宽口径品类，这些估计聚集得出奇接近；而 360iResearch 更窄的商业辅导口径在 2026 年只有 $2.81
              billion，说明一旦定义局限于外部辅导服务，而不是混合学习、领导力发展和平台赋能交付，市场会迅速缩小。正确结论不是某个供应商预测“正确”，而是 BetterUp
              参与的是一个大型、多预算品类，其规模随纳入口径剧烈变化。SHRM、CompTIA 和 Harvard Business Impact 从买方侧强化了规模判断：领导力和管理者发展仍是 CHRO 的当前优先事项，AI
              培训预算在上升，L&D 团队面临压力，要更快把面向变革的学习规模化。这个组合支持一个有意义的市场，但也意味着公开自上而下估计更适合说明战略方向，而不是精确承销 BetterUp 的 SAM。
