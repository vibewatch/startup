  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、打包方式与变现可见度
        blocks:
          - type: paragraph
            body: >-
              BetterUp 的公开材料支持一种围绕企业辅导合同构建的商业模式，而不是透明的自助式 SaaS 结账。企业页面描述的平台组合了专家真人辅导、AI 指导和绩效智能；2020 年 Identify AI 发布则解释
              BetterUp 如何使用 HCM 连接数据和基于角色的辅导产品，决定谁应在什么层级获得辅导。分销证据也指向企业嵌入：Workday 徽章发布称 BetterUp 导入 HCM
              数据，在晋升和组织变化周围触发辅导；Microsoft Viva 合作则把 BetterUp 内容延伸到数百万人使用的工作场景里。明显不透明的是价格实现。BetterUp 自身企业页面不披露标价；2026 年 3
              月目录页面仍写着联系销售获取价格，采用授权模式且没有起步价。Sacra 2026 年 1 月笔记仍提到传统风格的个人月度计划，价格为 $71、$119 和
              $223，但这些计划并未在当前企业站点突出展示。这个组合意味着变现引擎有真实企业广度，但 ASP、折扣、席位数和收入确认组合的公开可见度较弱。
