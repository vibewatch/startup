          label: Teams 和 Viva 应用交付
        - from: d1
          to: d4
          label: 日常提示和消息
        - from: d1
          to: d5
          label: 销售绩效衡量
        - from: d1
          to: d6
          label: 托管、安全和区域数据驻留
        - from: d1
          to: d7
          label: 真人辅导和专家覆盖
