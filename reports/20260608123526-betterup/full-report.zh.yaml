      - number: '5.4'
        title: 教练网络、数据飞轮与信任姿态
        blocks:
          - type: paragraph
            body: >
              BetterUp 最有防御力的公开护城河，是教练网络规模、数据埋点，以及围绕敏感员工发展数据的治理。公司现在称其服务超过 750 家企业客户，并运营一个覆盖 70+ 国家、超过 4,000
              名教练的网络，支持专业型、高管型、小组型和 Ready 式支持模式。这给了 BetterUp 足够服务宽度，可以支撑“AI +
              真人”混合模型，而不是把所有互动都塞进一种模式。对该品类的私营公司来说，信任表面也相对详细。BetterUp 称其用 TLS 和 AES-256
              加密数据，提供美国和欧盟托管，通过合同阻止辅导数据进入模型训练，并让 AI 经过面向辅导特定安全的防护栏，而不是泛化企业 AI 营销。弱点在于，大部分证据仍由公司自己撰写。BetterUp
              提到审计、认证和受控研究，但公开层只足以让人相信治理项目存在，还不足以让外部独立重新承销每一项控制。
