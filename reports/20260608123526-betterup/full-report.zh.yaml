      - - AI 产品化
        - 2025 年 AI Coaching 发布，加上当前四产品平台，为提升服务杠杆和扩大挂载打开路径。
        - AI 也抬高替代风险：除非 BetterUp 证明利润率提升和留存韧性，否则买方可能把教练服务看得更可替代。
      - - 私人同业位置
        - Sacra 仍把 BetterUp 定位为在线教练平台中融资和规模领先者。
