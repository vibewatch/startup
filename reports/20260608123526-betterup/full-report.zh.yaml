  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值历史与当前价格锚
        blocks:
          - type: paragraph
            body: >-
              BetterUp 最近一轮有清晰文件记录的定价融资仍是 2021 年 10 月 Series E。最权威的公开记录是 Form D：该文件覆盖 $339,999,958 豁免发行，2021-09-24
              首次出售后于 2021-10-08 备案。第三方数据商对投后估值的核心标记一致，即便对精确募资总额看法不同：Sacra 和 Forge 记录 $4.7B 投后估值、约 $339MM 融资，CB Insights
              则把该事件取整为 $300M。这个差异不如更大的结论重要。BetterUp 从 CB Insights 报道的 2021 年 2 月 $1.73B 估值走到 2021 年 10 月
              $4.7B，吃到了峰值时期市场愿意为远程办公、教练和心理适能叙事支付成长软件倍数的窗口。到 2026 年，公开老股交易场所仍显示 BetterUp
              是被活跃覆盖的私人公司，但非订阅用户看不到相关报价字段。因此，题设的约 $2.26B 锚点只能作为示意性的老股隐含承销标记，而不能当成已确认成交价格。即便如此，算术仍有用：$2.26B 锚点意味着较 2021
              年峰值下调 51.9%，幅度不小，但仍远浅于更广泛公开 SaaS 从 2021 年 16.9x ARR 到 2026 年 3 月 3.8x 的重估。
