      - number: '7.4'
        title: 资本路径、估值与依赖风险
        blocks:
          - type: paragraph
            body: >-
              BetterUp 的融资风险不在于缺乏规模，而在于公开估值锚点已经陈旧，私募市场证据却仍在更新。最后一次被广泛引用的重大融资仍是 2021 年约 $300 million 的 Series E，估值约 $4.7
              billion 至 $5 billion。此后，最清晰的公开市场信号来自私募市场监测机构，而不是新一轮领投或公开申报文件。Nasdaq Private Market 仍将 BetterUp
              列为上市前公司，并显示实时买价、卖价和最近成交数据。PM Insights 将公司跟踪为老股交易资产。GetLatka
              的可靠性低于一手披露，但指向一个在收入和员工数上都已有实质规模的业务，这意味着退出延后带来的成本会快速复合。依赖叙事进一步放大这个风险。BetterUp 与 Microsoft、Workday
              的集成有助于分发和工作流相关性，但也让公司更紧地绑定到未来可能自己吃下价值链的生态。落到实处，BetterUp 需要续约、产品附加销售和最终融资选项，继续验证 2021 年独角兽周期的估值标记；而 2026
              年市场越来越奖励平台宽度，而不是单点叙事。
