      - number: '1.3'
        title: 资本基础、投资者名单与估值标记
        blocks:
          - type: paragraph
            body: >-
              资本故事在最后一轮新股融资上很强，在当前私募市场估值标记上弱得多。BetterUp 自己的 Series E 新闻稿写得很清楚：公司 2021 年 10 月宣布完成 $300 million 融资，估值 $4.7
              billion，由 Wellington Management、ICONIQ Growth 和 Lightspeed 领投，Salesforce Ventures 和 Mubadala
              也参与。独立私募市场平台大体确认了估值和投资者组合，但不是每个细节都一致。Nasdaq Private Market 和 Forge 都把 Series E 显示为约 $339 million，而不是 $300
              million，意味着可能存在总额与净额口径差异，或数据版本不一致；后续估值工作应保留这个差异，而不是抹平。同样的问题也出现在累计融资和收入估计里。Forge 和 Apps Run The World 现在指向约
              $628 million 累计融资，而 BetterUp 官方材料只清楚证明截至 2021 年公告的 $600 million。类似地，公开市场数据来源也没有干净地交叉验证最新 ARR。2026
              年能公开看到的是活跃的老股市场兴趣——买单、卖单、最后成交标记和 NPM 股价估计——但公开数据集透明度还不足以把某一个精确隐含股权价值视为标准答案。
