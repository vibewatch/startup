            body: >-
              基于上述公开记录，在示意性约 $2.26B 入场价下，结论支持继续研究。这个标记已不再是 2021 年式泡沫数字，但也谈不上明显便宜。如果 BetterUp 的真实收入基数已接近 $250M，且 AI
              正在改善服务经济性，价格可以显得合理。如果最可支持的分母仍更接近 $175M-$215M，或 AI 带来的买方怀疑多于利润率杠杆，同样价格就显得偏紧。因此，建议更取决于证据质量，而不是宏观复苏。BetterUp
              有可信规模、更新过的 AI 叙事、新 CFO，以及值得关注的企业结果主张。它没有公开的经审计
              ARR、NRR、毛利率或优先股堆叠披露。在这些文件打开前，公司应留在尽调池，而不是高确信买入池。正确下一步很直接：要求财务桥、留存队列数据、教练成本趋势和股权结构堆叠，把当前标记从示意性模型输入转成可投资价格。
