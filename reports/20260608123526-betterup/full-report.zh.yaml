    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围与公开足迹
        blocks:
          - type: paragraph
            body: >-
              判断 BetterUp 的身份，最稳的锚点是公司当前自有页面和近期新闻材料，而不是过时目录页。公司称其创立于 2013 年，并在 2026 年把自己定义为 AI
              时代的人才转型平台——本质上是一个企业软件与服务平台，把辅导、AI、行为科学和绩效分析合在一起。官方页面一贯把产品放在员工发展、管理者效能、韧性和人力绩效上，而不是某个狭窄的健康场景。公司也持续发布足以支撑后续章节的规模叙事：750+
              企业客户、4,000+ 教练、覆盖 70+ 国家，以及 14x ROI、降低自愿离职率等可量化结果主张。主要保留项是地点。较早的合作伙伴材料仍把 BetterUp 描述为总部在 San Francisco，但
              2025-2026 年公司新闻稿的地点标注和一个办公室地点来源，把重心转向 Austin。第 1 章的正确结论是：BetterUp 的产品身份清晰，但当前总部信号在公开材料中还没有完全标准化。
