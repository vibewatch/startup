  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 BetterUp 真正在追逐的预算池
        blocks:
          - type: paragraph
            body: >-
              不应把 BetterUp 定义成泛化 HR
              软件供应商，也不应把它当作临床心理健康提供方。证据最扎实的边界更窄，也更具投资可分析性：企业领导力发展、管理者效能、行为改变辅导，以及由人才、学习、人力或转型负责人采购的员工韧性项目。BetterUp
              自身定位强调面向关键人才的领导力发展、管理者效能、给每位员工的 AI 辅导和规模化员工韧性；CoachHub、Torch 等相邻竞争者也营销可规模化数字辅导、转型支持和 AI
              赋能发展。市场也与学习平台和员工体验套件重叠，但更适合把它们理解为替代品或捆绑竞争者，而不是完全相同的品类。因此，纳入口径覆盖辅导、领导力发展、管理者赋能，以及目标是行为改变和可衡量员工绩效的部分韧性项目。排除口径包括受保险覆盖的行为健康医疗、没有辅导或练习闭环的泛内容库订阅，以及没有采购发展工作流的宽泛
              HR 套件。这个边界重要，因为 BetterUp 的可服务机会来自多个企业预算负责人，而不是单一专属“辅导”预算项；最强买方逻辑出现在辅导与变革准备、管理者质量或对留存敏感的人才群体绑定时。
