      - number: '1.5'
        title: 里程碑、反向信号与主要尽调缺口
        blocks:
          - type: paragraph
            body: >-
              里程碑路径足够清楚，可以建立第 1 章的基础事实。BetterUp 成立于 2013 年，2019 年显示早期企业牵引，2021 年达到 $100 million ARR 并开设欧洲办公室，同年晚些时候以
              $4.7 billion 新股估值完成 Series E，2024 年和 2025 年扩展集成与 AI 能力，2026 年新增
              CFO，并出现当前老股市场交易信号。反向记录不是生死问题，但不应被埋掉。UniCourt 显示，2025 年 BetterUp
              面临一起不当解雇案件，其中包括工资差异、歧视和报复指控；已审阅案卷没有证明这些指控为事实，但它确实构成真实的声誉和文化尽调事项。更重要的承销问题是透明度，而不是丑闻：当前董事会结构、精确实时股权结构表、清晰总部认定、经交叉验证的
              2024 ARR、Practica 和 Heyday 的精确交割日期，以及完全透明的 2026
              年隐含估值，在可访问公开记录中都仍不完整。因此，公司概况可以对身份和历史里程碑有信心，但也必须把重大证据缺口带入后续章节。
