      - number: '1.4'
        title: 客户证据、合作关系与 AI 平台扩张
        blocks:
          - type: paragraph
            body: >-
              公开客户证据是 BetterUp 更强的资产之一。公司自有客户页面和多份合作伙伴材料指向大型企业和机构采用；Salesforce 与 Mercedes 记录又提供外部支撑，说明 BetterUp
              不只是一个概念化的辅导品牌。平台故事也比单纯一对一辅导更宽。BetterUp 持续建设与 Workday、Salesforce 等工作流和 HR 系统的集成，并借 2025 年 1 月 AI Coaching
              发布，把公司重新定位为企业规模下“真人 + AI”的混合发展平台。这次发布重要，因为它同时做了两件事：推出新的 AI 产品层，并披露 BetterUp 近期收购了 Practica 和
              Heyday，以深化角色特定辅导和教练赋能工作流。这些动作，加上 Mercedes-AMG PETRONAS F1
              扩展等当前合作伙伴案例，显示公司即便没有新的新股融资事件，仍在扩大分销和产品覆盖面。保留项是，本节许多结果数字仍是公司主张，并非独立审计。
