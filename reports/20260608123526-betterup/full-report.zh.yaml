      - number: '7.5'
        title: 缓释成熟度与放弃标准
        blocks:
          - type: paragraph
            body: >-
              BetterUp 确实有可信的缓释因素。公司没有假装市场仍是纯人类教练品类：它明确推进人类 + AI 的混合模型，发布专门的隐私和法律材料，并把 AI
              治理描述为由十年人类教练伦理塑造，而不是套用通用聊天机器人逻辑。这些是加分项，但剩余敞口仍高，因为公开证据集在投资人最关心的地方并不完整。本文审阅的来源无法证明续约韧性、客户集中度、教练质量一致性、事件历史，或从
              2021 年融资通向后续流动性事件的具体路径。因此，在管理层拿出硬运营证据前，尽调应把缓释成熟度视为暂定。正确的放弃标准应围绕可监测信号，而不是抽象担忧：任何隐私或 AI
              治理失误、雇主预算明显偏离可自由裁量教练、教练质量指标恶化，或融资活动确认清算价格显著低于 2021 年估值锚点，都应触发投资逻辑重置，而不是只增加一点担忧。
