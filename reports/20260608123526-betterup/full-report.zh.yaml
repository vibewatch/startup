  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最高剩余风险出现在敏感数据义务、可自由支配预算和套件重叠同时叠加的地方。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 敏感数据 / AI 治理
          values:
            - label: 中
              tone: warning
              detail: 新法规和 FTC 立场提高了未来被审查的概率。
            - label: 高
              tone: negative
              detail: 一次失误就会伤到信任、采购和品牌。
            - label: 中
              tone: warning
              detail: BetterUp 有政策更新和安全叙事，但公开运营证据很少。
            - label: 高
              tone: negative
              detail: 在控制措施拿出独立证据前，剩余风险仍高。
        - label: 预算替代 / GLP-1 压力
          values:
            - label: 高
              tone: negative
              detail: 2026 年雇主调查显示，GLP-1 和药房支出带来广泛成本压力。
            - label: 高
              tone: negative
              detail: 成本收缩周期里，可自由支配的教练预算会很快挪走。
            - label: 低-中
              tone: warning
              detail: ROI 叙事有帮助，但 BetterUp 仍需证明这笔支出对关键任务不可或缺。
            - label: 高
              tone: negative
              detail: 公开续约数据缺位，剩余严重度因此偏高。
        - label: 套件平台商品化
          values:
            - label: 高
              tone: negative
              detail: Microsoft、LinkedIn、Workday 和 SAP 都在销售功能重叠的 AI 指导和学习工具。
            - label: 高
              tone: negative
              detail: 捆绑销售压力会压低价格，也会削弱市场对 BetterUp 差异化的感知。
            - label: 中
              tone: warning
              detail: 人类 + AI 的混合模式能缓释风险，但还不能保证形成护城河。
            - label: 高
              tone: negative
              detail: 在 BetterUp 证明能持续打赢套件平台前，剩余风险仍高。
        - label: 教练市场质量
          values:
            - label: 中
              tone: warning
              detail: 这个市场真实且全球化，但资质质量参差不齐，BetterUp 自身的教练组合也未披露。
            - label: 高
              tone: negative
              detail: 质量失手会同时伤到成效主张和人类护城河。
            - label: 低-中
              tone: warning
              detail: 社群和资质信号有帮助，但公开运营指标很薄。
            - label: 高
              tone: negative
              detail: 质量可能在续约暴露问题前已经下滑，剩余严重度因此保持高位。
        - label: IPO 前 / 估值重置
          values:
            - label: 中
              tone: warning
              detail: 业务已有规模，但上一轮公开标杆估值停留在 2021 年。
            - label: 高
              tone: negative
              detail: 明面上的估值下修会冲击员工士气、融资灵活性和退出叙事。
            - label: 低-中
              tone: warning
              detail: 活跃的二级市场提供流动性，但不能充分验证估值。
            - label: 高
              tone: negative
              detail: 新的定价事件落地前，剩余风险仍高。
    approximationNotes: null
    claimRefs:
      - CR012
      - CR017
      - CR023
      - CR028
      - CR032
      - CR037
      - CR046
      - CR047
      - CR054
      - CR055
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: BetterUp 最大的风险通过四个共同通道传导：信任、续约耐久性、利润率质量和私募市场验证。
    data:
      nodes:
        - id: data
          label: 敏感员工 / 教练数据
          description: AI 教练叠加身心健康与心理适能语境。
        - id: budget
          label: 买方 ROI 与福利审查
          description: GLP-1、成本控制，以及 CFO 对可自由支配项目的审查。
        - id: suites
          label: 套件平台重叠
          description: Microsoft、LinkedIn、Workday 和 SAP 推出重叠的 AI 指导。
        - id: quality
          label: 教练质量差异
          description: 资质组合、匹配和监督决定人类护城河。
        - id: renewal
          label: 续约 / 扩张
          description: BetterUp 能否以可接受价格守住或扩大企业覆盖。
        - id: margin
          label: 利润率 / 服务强度
          description: 人力支持负荷、折扣和补救成本。
        - id: valuation
          label: 私募市场估值支撑
          description: 二级市场流动性和未来融资信心。
      edges:
        - from: data
          to: renewal
        - from: budget
