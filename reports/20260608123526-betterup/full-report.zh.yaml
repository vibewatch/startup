  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    summary: 公开证据显示，BetterUp 通常先作为高价值群体的高端方案销售，之后才考虑更大范围铺开。
    data:
      nodes:
        - id: need
          label: 转型需求
          detail: 客户面临倦怠、经理效能、领导力或任务准备度问题。
        - id: cohort
          label: 选择群体
          detail: 初始部署聚焦经理、领导者、PM、军事领导者，或其他战略人群。
        - id: proof
          label: 展示可衡量变化
          detail: 案例研究提到绩效、留存、韧性、凝聚力和准备度改善。
        - id: instrument
          label: 监测账户
          detail: 集成与账户健康流程让部署更易管理、也更容易续约。
        - id: expand-or-stop
          label: 扩张或停滞
          detail: 高端定价和 ROI 审查决定账户是扩大还是卡住。
      edges:
        - from: need
