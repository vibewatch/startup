companyProfile:
  summary: >-
    BetterUp 是一家后期私营企业辅导平台，把真人教练、AI 辅导和绩效工作流组合起来，服务领导力发展、管理者效能和员工韧性。公开证据支持其在 Fortune 500 和公共部门已有实质采用，全球教练网络规模较大，并通过 AI
    发布和补强型收购持续投入产品，但财务和经营披露仍然有限。
  foundedDate: '2013-01-01'
