      - number: '2.3'
        title: 买方分层、预算负责人，以及项目通常如何被采购
        blocks:
          - type: paragraph
            body: >-
              企业辅导现在不再主要作为精英高管福利采购，而是作为一项可配置能力，指向多个员工问题。初始赞助方常常是
              CHRO、学习负责人、人才发展负责人或业务转型高管；日常用户则从高管和高潜人才，延伸到人员管理者和更广泛员工队列。BetterUp 和 CoachHub 都明确营销规模、可衡量结果和 AI
              赋能辅导，说明买方越来越期待数字触达和结果数据，而不只是一次次一对一课程。最有融资吸引力的切入口是管理者效能、领导力准备、转型支持，以及能让买方合理把辅导连接到生产力、留存、行为改变或变革执行的韧性相关项目。面向广泛员工的部署铺开有战略重要性，但通常需要成本更低的
              AI
              层、清晰预算负责人，以及比高端高管项目更强的证明路径。实践中，采用往往从目标队列开始，经过隐私和安全评审；只有当供应商能证明管理者行为、发展速度或员工结果有可衡量改善时，才会继续扩张。这造就了一个市场动态：买方地图和标题市场规模一样重要。
