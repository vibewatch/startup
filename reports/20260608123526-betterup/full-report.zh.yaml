  - id: TV006
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 经审计 ARR 过低
        - 2025-2026 ARR 落在约 $200M 以下
        - 2026 年示例标记将落出可防守的高溢价倍数区间。
        - 按更接近悲观情景重新承销，并坚持更低入场价。
      - - AI 利润率逻辑失效
        - AI 推出后，毛利率或教练成本强度没有可观察改善
        - AI 变成叙事层，而不是经济护城河。
        - 在证据出现前，将倍数压到 5x-7x。
      - - 留存数据不及预期
        - NRR 低于高端软件常态，或队列续约疲软
        - 经常性收入溢价破裂。
        - 将该资产更像项目制 L&D 支出，而非耐久软件。
      - - 教练供给摩擦恶化
        - 有证据显示教练流失，或在利用率未提升时薪酬继续受压
        - 服务质量和产能开始卡住增长与利润率。
        - 提高风险折扣，并重审乐观 / 基准区间。
      - - 老股与 409A 支撑仍不披露
        - 尽调中拿不到 2026 年已验证交易价或 409A 支撑
        - 本章入场锚点仍只是示例，不是市场定价。
        - 设定条款清单规模时，不要依赖名义标记。
      - - 优先股悬置负担沉重
        - 清算堆叠或结构化条款吃掉低于 $3B 退出价值的大部分
        - 普通股结果与名义估值分化。
        - 重定预期回报，或谈结构性保护。
    notes: 这些都是会移动估值的触发项：每一项都会改变价格支撑，而不只是改变围绕 BetterUp 的叙事语气。
    claimRefs:
