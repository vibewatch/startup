      - number: '5.2'
        title: 真人 + AI 的运营模型
        blocks:
          - type: paragraph
            body: >
              公开证据支持一个真实编排模型，而不只是附带教练目录的内容库。BetterUp 较早架构材料把 Identify AI 描述为一个引擎：它使用组织优先级、职业阶段、学习偏好和 HCM
              数据，决定谁应在何时获得哪类支持。同一逻辑在 2025-2026 年关于里程碑时刻、适时辅导和嵌入工作流干预的材料中仍可见。运营闭环从一个企业信号开始，配置合适用户，采集评估，匹配真人与 AI
              支持，然后把行为助推、提醒和辅导互动推入 Teams、Viva 和 Workday 连接工作流等系统。重要的是，BetterUp 的 AI 发布并未把 AI 呈现为真人替代品。公司反而把 AI
              描述为日常支持层，可以把用户升级回专家真人教练；在一个保密性、细微语境和行为改变比泛化聊天机器人吞吐量更重要的品类里，这个策略更强。
