      - number: '8.3'
        title: 同业区间与市场重估
        blocks:
          - type: paragraph
            body: >-
              最有用的基准不是单一“完美”可比公司，而是一组公开 HCM、学习和相邻员工健康公司。按 Yahoo Finance 当前数据，Workday、Paylocity 和 Paycom 的市值 / 收入大致在
              3.1x-3.6x；学习和员工健康公司从 Teladoc 约 0.5x 到 Talkspace 3.7x 不等。所选样本中位数约 3.1x。这远低于 BetterUp 示意性的 9.0x-12.9x 区间，不过
              Multiples.vc 在 2026 年 5 月仍显示人力资本管理软件的 EV/NTM 收入为 8.7x；若 BetterUp
              的真实收入基数已接近公开估计区间顶部，差距会缩小。私人教练市场背景也支持一定溢价。Sacra 仍把 BetterUp 描述为在线职业教练领导者，融资额高于 CoachHub、Torch 或
              Bravely；Headspace Work 则显示，相邻雇主员工健康平台也在试图以大型企业覆盖面扩展 AI 支持。问题在于，整个软件市场现在同时把 AI 定价为上行和威胁。L40 和 Multiples.vc
              都认为，买方奖励具有 AI 防御性的资产，但惩罚看起来暴露于 AI 驱动替代的软件业务。因此，BetterUp 的溢价必须靠经济性挣出来，而不只是靠叙事。
