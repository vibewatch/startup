      - number: '7.2'
        title: 需求替代、预算周期性与套件竞争
        blocks:
          - type: paragraph
            body: >-
              BetterUp 的商业风险取决于它最终归入哪条预算线。若买方把教练视为提升管理者效能和 AI 转型的高 ROI
              操作系统，支出就能守住。若只把它看作补充型幸福感或发展点解决方案，延后、打包或削减都会容易得多。2026 年预算背景对后一种情况并不友好。GLP-1
              药物正在迫使用人单位做艰难取舍，福利负责人从以敬业度优先转向控成本，SHRM 对 2026 年的表述也强调 ROI 和风险管理，而不是试验。与此同时，平台套件正在缩小功能差距。Microsoft Viva
              已覆盖沟通、洞察、反馈和学习；LinkedIn Learning 营销 AI 教练和角色扮演；Workday 与 SAP 把 AI 导师、技能智能和合规打包进核心套件。BetterUp
              自己的产品叙事也强化了这个风险：它靠 AI 和混合交付把教练民主化，扩大了品类，也降低了市场对 BetterUp 与更广 HR-tech 栈之间边界的感知。结果是商品化路径可信存在，BetterUp
              必须持续证明自己不只是又一层 AI 驱动的员工指导。
