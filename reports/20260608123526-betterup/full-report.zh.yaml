  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户足迹与细分可见度
        blocks:
          - type: paragraph
            body: >-
              BetterUp 有真实企业部署证据，但规模故事比激进市场简化说法有时暗示的更窄，也更容易支撑。本次审阅中最新的一手数字是 750+ 企业客户，而不是 3,000+；已审阅第三方历史引用则指向 2023 年
              600+
              组织，而不是更大的企业账户基数。即便如此，它仍支撑了有意义的安装基础。更重要的是，可见客户名单横跨技术、生命科学、能源、医疗、政府、国防、旅行和工业转型，而不是一个狭窄细分市场。Google、Moderna、Chevron、Workday、Twilio、NetApp、OSF
              HealthCare、City of Santa Monica、Rolls-Royce 和 U.S. Air Force 分别对应不同买方语境和部署理由。


              买方和用户模式也比原始客户数披露更清楚。BetterUp 最常出现的场景，是
              CHRO、领导力发展负责人或人才团队试图改善特定人群中的管理者效能、韧性或领导行为，而不是部署一个便宜的全员福利。这符合高端、目标明确的企业销售。也就是说，本章可以支持真实企业采用和细分多元化的结论，同时仍需提示：按
              ACV 区间、地理和部署广度划分的精确客户组合仍未披露。
