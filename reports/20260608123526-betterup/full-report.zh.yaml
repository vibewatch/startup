      - number: '8.2'
        title: 分母质量与隐含倍数测算
        blocks:
          - type: paragraph
            body: >-
              真正的估值问题在分母质量。BetterUp 不公开披露经审计的 ARR、收入、净留存率或毛利率，因此可支持的公开分母只有第三方估计。Sacra 给出一条连贯的历史阶梯：2021 年 7 月 $100M
              ARR、Series E 时 $125M，到 2022 年底约 $175M。Sacra 页眉还显示 2023 年收入 $250M，而 GetLatka 估计 2024 年收入 $214.6M，2023 年为
              $151.7M。这些数字在边缘上冲突，但有用的是它们划出的区间。按 2021 年峰值，若用 2022 年分母，BetterUp 约为 26.9x ARR；若用 2021 年 ARR 分母，约为
              37.6x。按示意性的 2026 年 $2.26B 标记，倍数在 $175M 上降至约 12.9x，在 $214.6M 上为 10.5x，在 $250M 上为
              9.0x。压缩是真实的，但相较多数公开软件和员工健康可比公司，剩余溢价仍然可观。BetterUp 的官方规模说法部分解释了投资人为何仍愿意付溢价：公司现在称服务 750+ 家企业客户，在 70+ 个国家拥有
              4,000+ 名教练，并能拿出面向企业的 ROI、生产力、人员流失和收入结果主张。问题在于，这些说法没有一个能替代经审计利润率或续约质量。
