      - number: '6.3'
        title: 扩张循环、留存代理指标与合作伙伴生态
        blocks:
          - type: paragraph
            body: >-
              公开记录显示，BetterUp 的设计是先落入一个目标队列，再通过工作流集成和内部证据点扩张。Salesforce 的客户故事描述，合作往往从组织中的某个细分人群开始，早期成功后再扩大；Delivery Hero
              则明确称其在两年多时间里把授权数量翻倍。BetterUp 自身集成栈支持这种动作：Microsoft Viva 把 BetterUp 内容嵌入工作流，Workday 和 SAP SuccessFactors 帮
              HR 团队基于员工属性配置或撤销授权，Salesforce 则被用于 BetterUp 自己的 GTM
              系统，管理客户健康、续约扩张和客户导入。合在一起，这些来源显示的是一个试图变得运营粘性的企业平台，而不只是一个鼓舞型产品。


              公开记录没有提供硬留存数学。已审阅来源没有公开 NRR、GRR、流失率或续约率。最好的耐久性代理指标来自案例研究和评论表面。Twilio 的留存差值方向上很强，TrustRadius
              暗示买方可以在高层领导使用场景中获得价值，BetterUp 也反复营销降低离职率和 ROI
              研究。但这些仍只是代理指标。投资者可以承销一个可信的售后动作和部分扩张证据，却不能把公开材料当作队列留存或续约数据的替代品。
