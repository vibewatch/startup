            body: >-
              BetterUp 的融资历史比经营报表有据可查得多。公司自己的 2021 年 Series E 公告称，公司以 $4.7B 估值融资 $300M，累计融资 $600M；SEC Form D 文件显示，2021 年
              2 月 Series D 约 $147M，2021 年 10 月 Series E 备案约 $339M。2026 年的主要分歧在于哪些资金算作累计资本：ZoomInfo 和 GetLatka
              总结六轮核心融资，合计约 $567M 至 $570M；Tracxn 则统计八轮、$628M，因为它纳入了两笔 2024 年标为 Series E 的 Form D 文件，金额只有 $214,699 和
              $189,900。这些 2024 年文件金额太小，不能解读为新的成长轮；公开来源也没有解释它们是否与员工流动性、期权行权或其他股权结构表整理有关。另一个 2026 年信号来自 Nasdaq Private
              Market：其显示 BetterUp 活跃订单簿中最高买价 $260.80、最低卖价 $188.50、最后成交价 $234、实时订单 1,298 个；但同一页面还列出截至 2026 年 5 月 22 日的
              NPM 价格估计 $2.09。没有股权类别背景和完全稀释股数，这些老股信号可作为流动性证据，但不能给出干净的当前估值。
