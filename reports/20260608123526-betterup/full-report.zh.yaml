      - number: '2.5'
        title: 2025-2026 年增长驱动真实存在，但信任、监管和成本压力拖慢转化
        blocks:
          - type: paragraph
            body: >-
              当前周期里，几个因素支持企业辅导采用。L&D 负责人优先考虑领导力、技能提升和 AI 准备；员工压力仍高，管理者在持续变化中承受更大交付压力；专业辅导供应商现在承诺用 AI
              增强的规模带来可衡量结果，而不是手工打造的高管专属项目。但约束同样重要。Business Group on Health、KFF 和 Mercer
              都显示雇主健康成本通胀很热，迫使预算负责人削减或证明相邻身心健康支出的合理性。World Economic Forum 的 2026 年 AI-at-work 论文认为，信任和治理——不是原始能力——现在是企业
              AI 采用的闸门，尤其在受监管场景里。European Commission 的 AI Act 又增加了真实政策压力：禁止工作场所情绪识别，并把用于员工管理的 AI 系统列为高风险。WEF
              还提示了一个更具战略性的反向情景：AI 可能重塑组织中层，这可能提高对管理者支持的需求，同时让买方更谨慎地部署 AI 引导的发展工具。对 BetterUp
              而言，可投资的问题不是市场是否存在，而是公司能否在捆绑竞争者或成本削减关上窗口之前，持续证明多个相邻预算里的结果和治理适配性。
