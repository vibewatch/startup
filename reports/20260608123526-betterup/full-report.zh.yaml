      - - 借 Workday 嵌入工作流
        - 集成让 BetterUp 更容易落进企业 HR 流程
        - 如果 Workday 转推相邻合作伙伴或原生 AI，伙伴掌控的工作流锚点也可能变成闸门
        - 中高
        - 量化来自 Workday 的销售管线，以及依赖伙伴数据触发的扩张占比
      - - 高端价格定位
        - 品类经济性取决于 BetterUp 能否从高管队列向下扩展
        - 独立指南仍认为 BetterUp 相比按席位计价的 HR 平台偏贵
        - 高
        - 索取总监级以下的实际 ACV、队列结构和席位扩张经济性
      - - 相邻捆绑竞争
        - Lattice、15Five、Culture Amp 和 Leapsome 把经理指导打包进更便宜的工作流工具
        - 经理可能接受软件驱动的教练提示，而不是高端外部教练
        - 高
        - 不只对比纯教练厂商，也要把续约和扩张输赢数据同相邻 HR 平台对比
      - - 既有套件替代
        - Workday 和 Cornerstone 已掌控大量学习 / 人才预算和企业数据流
        - 它们不用单独教练供应商，也能捆绑 AI、学习、技能和伙伴生态
        - 高
        - 梳理 BetterUp 今天替代哪条预算线，以及既有厂商已经在哪些地方掌控决策人
      - - 公开指标一致性
        - 投资人和买方会拿 BetterUp 的 AI / 数据规模说法同同行对标
        - BetterUp 官方页面引用的课时和数据点数量不一致
