  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台定义与 SKU 地图
        blocks:
          - type: paragraph
            body: >
              BetterUp 的公开产品故事现在围绕单一 Human Transformation Platform 展开，而不是单一辅导应用。保留下来的 2025-2026
              年页面显示了一个混合栈：真人教练在领导者和其他高风险时刻仍居核心，AI 辅导扩大日常触达，公司按受众和使用场景打包体验。命名也在变化。2025 年 1 月发布材料仍围绕 BetterUp
              Lead、BetterUp Care 和 BetterUp Manage 来描述生态；当前支持材料则把 Lead、Manage、Ready 和 Grow 展示为正在使用的产品体验。我未能保留单独的当前
              BetterUp Mind 落地页，因此心理适能层似乎被折入 Care 和韧性导向体验，而不是作为独立 2026 SKU 被记录。平台宽度没有因此被否定，但这意味着买方在假设 2025 标签与 2026
              支持命名完全一致之前，应要求 BetterUp 提供当前打包表。
