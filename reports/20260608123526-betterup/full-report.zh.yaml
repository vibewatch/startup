      BetterUp 的公开部署模型既依赖外部 HCM、通信、云和市场渠道，也依赖自身辅导逻辑。
    data:
      nodes:
        - id: d1
          label: BetterUp 核心平台
          type: hub
        - id: d2
          label: Workday / SAP HCM
          type: hcm
          risk: 配置开通、队列逻辑和里程碑定向依赖数据质量和连接器稳定性。
        - id: d3
          label: Microsoft Teams / Viva
          type: communication
          risk: 采用取决于 Microsoft 内部的租户权限、应用白名单和用户发现。
        - id: d4
          label: Slack
          type: communication
          risk: 如果 Slack 访问或频道行为变化，流程内提示和提醒的价值会下降。
        - id: d5
          label: Salesforce / CRM 工作流
          type: crm
          risk: 销售用例 ROI 主张依赖与 CRM 相连的衡量，以及对销售流程的适配。
        - id: d6
          label: AWS + Heroku 托管
          type: infrastructure
          risk: 区域托管和应用安全依赖共享云控制和供应商执行。
        - id: d7
          label: 人工教练网络
          type: service-delivery
          risk: 即使 AI 覆盖扩张，教练供给、QA 和可用性仍然关键。
      edges:
        - from: d1
          to: d2
          label: 身份、状态和里程碑数据
        - from: d1
