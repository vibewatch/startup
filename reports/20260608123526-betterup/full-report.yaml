  - id: TV006
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Audited ARR too low
        - 2025-2026 ARR lands below roughly $200M
        - The illustrative 2026 mark moves outside a defendable premium-multiple range.
        - Re-underwrite closer to the bear case and insist on a lower entry.
      - - AI margin case fails
        - No observable improvement in gross margin or coach-cost intensity after AI rollout
        - AI becomes a narrative layer rather than an economic moat.
        - Compress the multiple toward 5x-7x until proof appears.
      - - Retention data disappoints
        - NRR below premium-software norms or weak cohort renewals
        - The recurring-revenue premium breaks.
        - Treat the asset more like project-based L&D spend than durable software.
      - - Coach-supply friction worsens
        - Evidence of coach churn or further payout compression without utilization gains
        - Service quality and capacity become constraints on growth and margin.
        - Increase risk discount and revisit the bull/base ranges.
      - - Secondary and 409A support stays hidden
        - No 2026 verified print or 409A support is produced in diligence
        - The chapter’s entry anchor remains illustrative rather than priced.
        - Do not rely on the headline mark when sizing a term sheet.
      - - Preference overhang is heavy
        - Liquidation stack or structured terms absorb most sub-$3B exit value
        - Common-equity outcomes diverge from headline valuation.
        - Reprice expected returns or negotiate structural protection.
    notes: >-
      These are valuation-moving triggers: each one changes price support, not merely the narrative tone around
      BetterUp.
    claimRefs:
      - CV036
      - CV042
      - CV061
      - CV066
      - CV067
      - CV068
  - id: TV007
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited ARR bridge
        - Audited 2025-2026 ARR and revenue bridge by product and customer segment
        - The valuation debate depends on whether the true denominator is closer to $175M, $215M, or $250M+.
        - Finance team, auditor, and board materials.
      - - Gross margin and coach payout
        - Gross margin, contribution margin, coach utilization, and payout trend before and after AI rollout
        - Determines whether AI expands margin or simply masks service intensity.
        - Finance plus operations review deck.
      - - Retention quality
        - NRR, GRR, cohort renewal, seat expansion, and contraction by employer cohort
        - Without retention proof, BetterUp does not earn a stable premium multiple.
        - Revenue-operations and customer-success dashboards.
      - - Secondary and 409A support
        - Latest 409A, tender or secondary prints, and any mutual-fund marks
        - Converts the illustrative ~$2.26B anchor into a verified market datapoint.
        - Transfer agent, CFO, and investor-relations pack.
      - - Cap table and preferences
        - Liquidation preference stack, participation rights, side letters, and ROFR restrictions
        - Headline valuation can overstate common-equity value if the stack is heavy.
        - Legal counsel plus current cap-table export.
      - - AI adoption economics
        - Usage, attach, conversion, and renewal evidence for AI coaching products
        - Shows whether AI is creating value, defending retention, or increasing commoditization risk.
        - Product analytics and go-to-market scorecards.
    notes: >-
      These are the minimum files needed to convert BetterUp from an interesting private-market story into an
      underwritable investment at or near the requested mark.
    claimRefs:
      - CV064
      - CV065
      - CV066
