  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation history and current price anchor
        blocks:
          - type: paragraph
            body: >-
              BetterUp’s last clearly documented priced round remains the October 2021 Series E. The most authoritative
              public record is the Form D, which covers a $339,999,958 exempt offering filed on 2021-10-08 after a first
              sale on 2021-09-24. Third-party data vendors agree on the headline post-money mark even if they disagree
              on the exact gross proceeds: Sacra and Forge carry a $4.7B post-money valuation with roughly $339MM
              raised, while CB Insights rounds the event to $300M. That discrepancy matters less than the broader
              conclusion. BetterUp moved from a CB Insights-reported $1.73B valuation in February 2021 to $4.7B by
              October 2021, capturing the peak-era willingness to pay growth software multiples for remote-work,
              coaching, and mental-fitness stories. In 2026, public secondary venues still show BetterUp as an actively
              covered private company, but the relevant quote fields are masked for non-subscribers. That means the
              requested ~$2.26B anchor can only be used as an illustrative secondary-implied underwriting mark, not as a
              confirmed transaction print. Even so, the arithmetic is useful: a $2.26B anchor implies a 51.9% markdown
              from the 2021 peak, which is meaningful but still much shallower than the broader public SaaS reset from
              16.9x ARR in 2021 to 3.8x by March 2026.
            claimRefs:
              - CV001
