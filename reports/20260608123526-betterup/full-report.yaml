      - - Paylocity
        - $6.075B market cap / $1.73B revenue
        - ~3.5x market-cap-to-revenue
        - Mid-cap HCM benchmark with recurring revenue and workflow criticality.
        - More payroll-centric and operationally mature than BetterUp.
      - - Paycom
        - $6.417B market cap / $2.09B revenue
        - ~3.1x market-cap-to-revenue
        - Another public payroll/HCM anchor for disciplined valuation.
        - Less directly exposed to coaching and service-heavy delivery.
      - - Coursera
        - $1.566B market cap / $773.9M revenue
        - ~2.0x market-cap-to-revenue
        - Useful public learning-platform benchmark.
        - Consumer and education mix differs from BetterUp’s enterprise coaching orientation.
      - - Docebo
        - $436.8M market cap / $251.0M revenue
        - ~1.7x market-cap-to-revenue
        - Scaled enterprise-learning SaaS read-through.
        - Learning software economics differ from mixed human-plus-service coaching.
      - - Talkspace
        - $874.4M market cap / $238.4M revenue
        - ~3.7x market-cap-to-revenue
        - Public digital-wellness/mental-health read-through.
