              data-vintage mismatch that later valuation work should preserve rather than smooth away. The same dynamic
              appears in lifetime funding and revenue estimates. Forge and Apps Run The World now point to roughly $628
              million total funding, while official BetterUp materials only clearly establish $600 million through the
              2021 announcement. Likewise, open market-data sources do not cleanly corroborate the latest ARR figure.
              What is public in 2026 is active secondary-market interest — bids, offers, a last-trade marker, and an NPM
              share-price estimate — but not a transparent enough public dataset to treat one exact implied equity value
