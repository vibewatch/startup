    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and public footprint
        blocks:
          - type: paragraph
            body: >-
              BetterUp’s identity record is strongest when anchored on its own current surfaces and recent press
              materials rather than on stale directory pages. The company says it was founded in 2013 and presents
              itself in 2026 as the human transformation platform for the AI era — effectively an enterprise
              software-and-services platform that combines coaching, AI, behavioral science, and performance analytics.
              Official pages consistently frame the product around workforce development, manager effectiveness,
              resilience, and human performance rather than around one narrow wellness use case. The company also
              continues to publish a scale narrative that is big enough to matter for later chapters: 750+ enterprise
              customers, 4,000+ coaches, coverage across 70+ countries, and measurable outcome claims such as 14x ROI
              and lower voluntary turnover. The main caveat is location. Older partner material still describes BetterUp
              as San Francisco-based, but 2025-2026 company press datelines and one office-location source shift the
              center of gravity toward Austin. For chapter 1, the right takeaway is that BetterUp’s product identity is
              clear, but its current headquarters signal is not perfectly standardized across public materials.
