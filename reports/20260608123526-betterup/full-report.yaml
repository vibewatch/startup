      - number: '7.4'
        title: Capital Path, Valuation, and Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              BetterUp’s financing risk is not that the company lacks scale; it is that the public valuation anchor is
              old while the private-market evidence is still current. The last broadly cited major financing remains the
              roughly $300 million Series E from 2021 at about a $4.7 billion to $5 billion valuation. Since then, the
              clearest public market signals come from private-market monitors rather than a new lead round or a public
              filing. Nasdaq Private Market still lists BetterUp as pre-IPO with live bids, offers, and last-trade data.
              PM Insights tracks the company as a secondary-market asset. GetLatka, while lower-reliability than primary
              disclosures, points to a business with meaningful scale in both revenue and headcount, which means the
              cost of a delayed exit can compound quickly. The dependency story reinforces that risk. BetterUp’s
              integrations with Microsoft and Workday help distribution and workflow relevance, but they also tie the
              company more tightly to ecosystems that may one day capture the value chain themselves. In practical
              terms, BetterUp needs renewals, product attach, and eventual financing options to keep validating a 2021
              unicorn-era mark in a 2026 market that increasingly rewards platform breadth, not stand-alone narrative.
            claimRefs:
