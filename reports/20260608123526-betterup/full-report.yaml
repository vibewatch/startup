      - number: '5.2'
        title: Human-plus-AI operating model
        blocks:
          - type: paragraph
            body: >
              The public evidence supports a real orchestration model, not just a content library with a coach directory
              attached. BetterUp's older architecture materials described Identify AI as the engine that uses
              organizational priorities, career stage, learning preferences, and HCM data to decide who should get what
              kind of support and when. That same logic is still visible in 2025-2026 materials around milestone
              moments, right-time coaching, and flow-of- work interventions. The operating loop starts with an
              enterprise signal, provisions the right users, captures assessments, matches human and AI support, and
              then pushes nudges, reminders, and coaching interactions into systems like Teams, Viva, and Workday-linked
              workflows. Importantly, BetterUp's AI launch did not present AI as a human replacement. The company
              instead described AI as a daily support layer that can escalate people back to expert human coaches, which
              is strategically stronger in a category where confidentiality, nuance, and behavior change matter more
              than generic chatbot throughput.
