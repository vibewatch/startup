      - number: '2.2'
        title: Public sizing lenses show a large category, but not a clean BetterUp SAM
        blocks:
          - type: paragraph
            body: >-
              Public market estimates support the idea that leadership-development and coaching spend is substantial,
              but they do not isolate a clean BetterUp-specific TAM, SAM, or SOM. Mordor estimates the 2026 executive
              coaching and leadership-development market at $112.98 billion, Future Market Insights puts the 2026
              leadership-development program market at $98.7 billion, and Coherent Market Insights sizes 2026
              leadership-development coaching at $116.47 billion. Those estimates cluster surprisingly tightly for broad
              categories, while 360iResearch's narrower business coaching lens is only $2.81 billion in 2026, showing
              how quickly the market shrinks when the definition is limited to external coaching services rather than
              blended learning, leadership development, and platform-enabled delivery. The right conclusion is not that
              one vendor forecast is "correct," but that BetterUp participates in a large, multi-budget category whose
              size changes dramatically with inclusion rules. SHRM, CompTIA, and Harvard Business Impact strengthen the
              sizing thesis from the buyer side: leadership and manager development remains a live CHRO priority,
              AI-training budgets are rising, and L&D teams are under pressure to scale change-ready learning faster.
              That combination supports a meaningful market, but it also means public top-down estimates are better for
              showing strategic direction than for underwriting a precise BetterUp SAM.
