        title: Founders, leadership bench, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              BetterUp remains unmistakably founder-led in the public record even as the leadership bench broadens. The
              current about page still centers Alexi Robichaux and Eduardo (Eddie) Medina as co-founders, with Alexi as
              CEO and Eddie as COO, and the reviewed materials do not suggest a founder handoff comparable to what
              later-stage fintechs or marketplaces sometimes disclose. What has changed is the amount of professional
              management wrapped around them. The May 2026 CFO announcement brought Kristian Talvitie in from PTC to run
              finance, accounting, and investor relations, which is a classic maturity signal for a company thinking
              about disciplined growth, capital strategy, and eventual liquidity options. BetterUp also foregrounds a
              deep bench around go-to-market, people, science, and coaching, plus a prominent science board. The
              governance limitation is visibility: none of the reviewed official pages expose a clean board roster,
              committee structure, ownership map, or reserved-matters framework. That means the chapter can verify who
              the public operators are, but not how formal control is allocated among founders, investors, and any
              non-executive directors.
