  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive frame: direct peers, adjacent platforms, and status-quo substitutes'
        blocks:
          - type: paragraph
            body: >-
              BetterUp is not competing in a single, clean enterprise-coaching category. The closest direct alternatives
              are CoachHub and Torch, both of which sell coaching-led transformation outcomes, but many buyers can solve
              the same job by extending existing HR software rather than buying a standalone coaching vendor. Leapsome,
              Lattice, Culture Amp, and 15Five all package manager guidance, performance workflows, analytics, and AI
              assistants inside broader people-software budgets. Workday and Cornerstone sit one layer higher again:
              they do not market themselves as giant external coach networks, yet they already own HCM, learning,
              skills, and workforce-readiness budgets that can absorb development spend. In practice, BetterUp often
              wins only if the buyer values premium human coaching plus workflow-level AI enough to justify a separate
              line item instead of relying on the current HCM, performance, or learning stack. The practical status quo
              is often a buyer keeping leadership development inside manager routines, surveys, learning tools, and HCM
              workflows already in place.
