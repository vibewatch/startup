      - number: '6.4'
        title: Concentration, budget compression, and adoption risks
        blocks:
          - type: paragraph
            body: >-
              BetterUp’s customer proof is strongest where buyers can justify premium coaching spend for leadership
              populations, which is both a strength and a risk. The visible customer set is heavy with large
              enterprises, public-sector organizations, and transformation programs that can pay for executive and
              manager development. That fits BetterUp’s brand positioning, but it also suggests reliance on large
              accounts and targeted cohorts rather than universal workforce penetration. Third-party review and
              competitor analysis point in the same direction: BetterUp is framed as a premium product, often best for
              50-200 leaders or large enterprises with budget, and its ROI story can be harder to sustain when customers
              are not committed for years.


              This matters because customer concentration and budget compression can interact. If large-account buyers
              start demanding harder financial proof or shift budget toward lower-cost AI-led alternatives, BetterUp
              could face slower expansions, narrower deployment scopes, or churn in discretionary programs. The reviewed
              sources do not disclose top-customer concentration, so this chapter cannot quantify how exposed BetterUp
              is to a handful of strategic accounts. But the absence of hard retention data, the premium-pricing
              profile, and the repeated need to prove ROI make customer durability a real diligence item rather than a
              box that public case studies alone can close.
