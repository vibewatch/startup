      - number: '8.5'
        title: Investment stance and diligence asks
        blocks:
          - type: paragraph
            body: >-
              On that basis, the public record supports a research-more stance at an illustrative ~$2.26B entry. The
              mark is no longer a 2021-style bubble number, but it is not obviously cheap either. If BetterUp’s real
              revenue base is already near $250M and AI is improving service economics, the price can look fair. If the
              best defensible denominator is still closer to $175M-$215M, or if AI creates more buyer skepticism than
              margin leverage, the same price looks stretched. The recommendation therefore depends less on macro
              recovery than on evidence quality. BetterUp has credible scale, a refreshed AI narrative, a new CFO, and
              enterprise outcome claims that deserve attention. It does not have public audited ARR, NRR, gross margin,
              or preference-stack disclosure. Until those files are opened, the company belongs in diligence rather than
              in a conviction buy bucket. The right next step is straightforward: demand the financial bridge, retention
              cohort data, coach-cost trend, and cap-table stack that can convert the current mark from an illustrative
              model input into an investable price.
