      - number: '5.5'
        title: Roadmap, moat, and technical risk
        blocks:
          - type: paragraph
            body: >
              BetterUp's 2025 roadmap was strategically coherent. The January AI launch bundled two acquisitions that
              deepen the platform in different ways: Practica adds role-specific AI practice across functional domains,
              while Heyday adds AI intended to help the human coach layer operate more efficiently. The Fall 2025
              release then reframed BetterUp as a continuous human-plus-AI feedback system instead of a set of episodic
              coaching programs. That broadens the moat because BetterUp is no longer selling only live coaching
              minutes; it is selling orchestration across HR systems, communication tools, analytics, and a global coach
              network. The risk is that scale and trust have to keep pace with that ambition. TrustRadius reviewers
              already point to coach-availability and ROI-friction issues, Blind sentiment is mixed, and public
              materials still lack open API schemas, detailed SLAs, or independent validation of the newest AI claims.
              BetterUp looks differentiated, but the next diligence step is verifying operational depth, not just
