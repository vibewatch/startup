              The capital story is strong on the last primary round and much weaker on the current private-market mark.
              BetterUp’s own Series E release is explicit: the company announced a $300 million round at a $4.7 billion
              valuation in October 2021, led by Wellington Management, ICONIQ Growth, and Lightspeed, with Salesforce
              Ventures and Mubadala also participating. Independent private-market platforms broadly confirm the
              valuation and investor mix, but not every detail. Nasdaq Private Market and Forge both surface the Series
