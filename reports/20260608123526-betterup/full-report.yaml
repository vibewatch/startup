  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Privacy, Legal, and Reputation Risk
        blocks:
          - type: paragraph
            body: >-
              BetterUp is no longer just selling classic executive coaching. Its current product language centers on AI
              coaching for every employee, real-time guidance in Slack, Teams, and Calendar, and support for mental
              fitness, resilience, and other emotionally sensitive workplace moments. That widening scope matters
              because it increases both the amount of employee context inside the system and the chance that a buyer,
              regulator, or plaintiff treats the data as more sensitive than routine learning telemetry. BetterUp’s own
              legal materials show repeated policy updates, dedicated AI privacy language, and explicit commentary that
              AI coaching now sits inside the first wave of relational-AI regulation in New York and California.
              External regulators are moving in the same direction: the FTC and peer agencies say there is no AI
              exemption from existing consumer-protection or anti-discrimination law. The company does have evidence of
              legal and trust friction already on the record, including a 2025 employment lawsuit and a WIPO
              domain-fraud case. None of those prove a platform-control failure, but they do show that BetterUp’s brand
              can be pulled into adverse narratives quickly and that the downside of any real data-governance miss would
              be reputationally outsized.
            claimRefs:
