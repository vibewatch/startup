      - number: '2.3'
        title: Buyer segments, budget owners, and how programs usually get bought
        blocks:
          - type: paragraph
            body: >-
              Enterprise coaching is now bought less as an elite executive perk and more as a configurable capability
              that can be pointed at several workforce problems. The initial sponsor is often the CHRO, head of
              learning, talent-development lead, or a business transformation executive, while the day-to-day users
              range from executives and high-potentials to people managers and broader employee cohorts. BetterUp and
              CoachHub both explicitly market scale, measurable outcomes, and AI-enabled coaching, which indicates that
              buyers increasingly expect digital reach and outcome data, not only one-to-one sessions. The most fundable
              entry points are manager effectiveness, leadership readiness, transformation support, and
              resilience-related programs where the buyer can plausibly connect coaching to productivity, retention,
              behavior change, or change execution. Broad employee rollouts are strategically important, but they
              usually require a lower-cost AI layer, a clear budget owner, and a stronger proof path than premium
              executive programs. In practice, adoption often begins with a targeted cohort, moves through privacy and
              security review, and then scales only if the vendor can show measurable improvement in manager behaviors,
              development speed, or workforce outcomes. That creates a market dynamic where the buyer map matters as
              much as the headline market size.
