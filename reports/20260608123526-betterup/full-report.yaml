      - number: '5.4'
        title: Coach network, data flywheel, and trust posture
        blocks:
          - type: paragraph
            body: >
              BetterUp's most defensible public moat is the combination of coach-network scale, data instrumentation,
              and governance wrapped around sensitive employee-development data. The company now says it serves more
              than 750 enterprise customers and operates a network of more than 4,000 coaches across 70-plus countries,
              with specialist, executive, group, and Ready- style support modes. That gives BetterUp enough service
              breadth to support a hybrid AI-plus- human model instead of forcing all interactions into one modality.
              The trust surface is also relatively detailed for a private company in this category. BetterUp says it
              encrypts data with TLS and AES-256, offers US and EU hosting, contractually blocks coaching data from
              model training, and runs AI through guardrails designed for coaching-specific safety rather than generic
              enterprise AI marketing. The weakness is that most of this evidence is still company-authored. BetterUp
              references audits, certifications, and controlled studies, but the public layer gives enough to believe
              the governance program exists without giving enough to independently re-underwrite every control.
