  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and the real budget pools BetterUp is chasing
        blocks:
          - type: paragraph
            body: >-
              BetterUp should not be framed as a generic HR software vendor or as a clinical mental-health provider. The
              most evidence-backed boundary is narrower and more investable: enterprise leadership development,
              manager-effectiveness, behavior-change coaching, and workforce-resilience programs that are purchased by
              talent, learning, people, or transformation leaders. BetterUp's own positioning emphasizes leadership
              development for critical talent, manager effectiveness, AI coaching for every employee, and workforce
              resilience at scale, while adjacent competitors such as CoachHub and Torch market scalable digital
              coaching, transformation support, and AI-enabled development. The market also overlaps with learning
              platforms and employee-experience suites, but those are better understood as substitutes or bundle
              competitors than as the exact same category. Included spend therefore covers coaching, leadership
              development, manager enablement, and selected resilience programs where the goal is behavior change and
              measurable workforce performance. Excluded spend includes insured behavioral-health care, generic
              content-library subscriptions without coaching or practice loops, and broad HR suites when no development
              workflow is being purchased. This boundary matters because BetterUp's addressable opportunity comes from
              multiple enterprise budget owners rather than a single dedicated "coaching line item," and the strongest
              buyer logic appears where coaching is linked to readiness for change, manager quality, or
              retention-sensitive talent groups.
            claimRefs:
