      - number: '5.3'
        title: Deployment mechanics and integration architecture
        blocks:
          - type: paragraph
            body: >
              BetterUp's public technical documentation is strongest where deployment meets enterprise systems. The
              company now documents connectors across Workday, SAP SuccessFactors, Slack, Microsoft Teams, Microsoft
              Viva, Salesforce-linked use cases, and Degreed, with support materials explaining why those integrations
              matter: automated provisioning, de-provisioning, ROI measurement, and a lower-friction user experience.
              Workday is the clearest example. BetterUp says the integration uses the standard Workday API, can usually
              be set up in under an hour, and only pulls the minimum data required for rollout and segmentation. The
              Teams setup guide goes further, specifying admin allow-listing, optional pre-pinning, Graph API scopes,
              and product-specific feature coverage. This is credible enterprise plumbing. The caveat is dependency
              density. BetterUp becomes more valuable when it is wired into HRIS, feedback, collaboration, and CRM
