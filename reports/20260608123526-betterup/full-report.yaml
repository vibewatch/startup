          - type: paragraph
            body: >-
              BetterUp has real enterprise deployment evidence, but the scale story is narrower and more supportable
              than aggressive market shorthand sometimes implies. The freshest primary figure reviewed for this run is
              750+ enterprise customers, not 3,000+, and the third-party historical references reviewed point to 600+
              organizations in 2023 rather than a more expansive enterprise-account base. That still supports a
              meaningful installed base. More importantly, the visible roster is diversified across technology, life
              sciences, energy, healthcare, government, defense, travel, and industrial transformation instead of one
              narrow niche. Google, Moderna, Chevron, Workday, Twilio, NetApp, OSF HealthCare, City of Santa Monica,
              Rolls-Royce, and the U.S. Air Force each map to distinct buyer contexts and deployment reasons.


              The buyer and user pattern is also clearer than raw customer-count disclosure. BetterUp most often appears
              where a CHRO, leadership-development leader, or talent team is trying to improve manager effectiveness,
              resilience, or leadership behavior in a specific population rather than rolling out a cheap universal
              perk. That is consistent with a premium, targeted enterprise sale. It also means the chapter can support a
              conclusion of real enterprise adoption and segment diversity, while still flagging that precise customer
              mix by ACV band, geography, and deployment breadth remains undisclosed.
