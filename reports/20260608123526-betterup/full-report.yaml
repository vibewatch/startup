      - number: '8.2'
        title: Denominator quality and implied-multiple math
        blocks:
          - type: paragraph
            body: >-
              The real valuation problem is denominator quality. BetterUp does not publicly disclose audited ARR,
              revenue, net retention, or gross margin, so the only supportable public denominators are third-party
              estimates. Sacra gives a coherent historical ladder: $100M ARR in July 2021, $125M at the time of the
              Series E, and roughly $175M by the end of 2022. Sacra’s header also shows $250M of 2023 revenue, while
              GetLatka estimates $214.6M of 2024 revenue after $151.7M in 2023. Those figures conflict at the margin,
              but the useful point is the band they create. At the 2021 peak, BetterUp traded around 26.9x ARR using the
              2022 denominator and about 37.6x using the 2021 ARR denominator. At an illustrative 2026 $2.26B mark, the
              multiple falls to about 12.9x on $175M, 10.5x on $214.6M, and 9.0x on $250M. That compression is real, but
              the remaining premium is still substantial relative to most public software and wellness comps. BetterUp’s
              official scale claims partly explain why investors may still pay up: the company now says it serves 750+
              enterprise customers, works with 4,000+ coaches across 70+ countries, and can point to enterprise-facing
              outcome claims around ROI, productivity, turnover, and revenue. The problem is that none of those claims
              substitute for audited margins or renewal quality.
