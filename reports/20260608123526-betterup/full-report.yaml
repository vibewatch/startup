      - number: '2.5'
        title: 2025-2026 growth drivers are real, but trust, regulation, and cost pressure slow conversion
        blocks:
          - type: paragraph
            body: >-
              Several drivers support enterprise coaching adoption in the current cycle. L&D leaders are prioritizing
              leadership, upskilling, and AI-readiness; workers remain stressed and managers are under more pressure to
              deliver through constant change; and specialist coaching vendors now promise measurable outcomes with
              AI-enhanced scale rather than handcrafted executive-only programs. But the constraints are equally
              material. Business Group on Health, KFF, and Mercer all show that employer health-cost inflation is
              running hot, which forces budget owners to trim or justify adjacent wellbeing spend. The World Economic
              Forum's 2026 AI-at-work paper argues that trust and governance—not raw capability—are now the gating
              factors for enterprise AI adoption, especially in regulated settings. The European Commission's AI Act
              adds real policy pressure by banning emotion recognition in workplaces and treating AI systems used for
              worker management as high-risk. WEF also flags a more strategic adverse scenario: AI may reshape the
              middle ranks of organizations, which could increase demand for manager support while simultaneously making
              buyers more cautious about how AI-guided development tools are deployed. For BetterUp, the investable
              question is not whether the market exists, but whether the company can keep proving outcomes and
              governance fitness across several adjacent budgets before bundle competitors or cost cuts close those
              openings.
