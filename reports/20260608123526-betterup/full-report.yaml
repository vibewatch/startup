      - number: '7.2'
        title: Demand Substitution, Budget Cyclicality, and Suite Competition
        blocks:
          - type: paragraph
            body: >-
              BetterUp’s commercial risk is shaped by what budget line it ultimately comes from. If buyers view coaching
              as a high-ROI operating system for manager effectiveness and AI transformation, spend can hold. If they
              view it as a supplemental wellbeing or development point solution, it becomes much easier to delay,
              bundle, or cut. The 2026 budget backdrop is not friendly to the second case. GLP-1 drugs are forcing
              difficult employer tradeoffs, benefits leaders are moving from engagement-first thinking toward cost
              containment, and SHRM’s 2026 framing emphasizes ROI and risk management over experimentation. At the same
              time, platform suites are closing feature distance. Microsoft Viva now spans communications, insights,
              feedback, and learning; LinkedIn Learning markets AI coaching and role-play; Workday and SAP package AI
              tutors, skills intelligence, and compliance inside the core suite. BetterUp’s own product narrative
              reinforces the risk: it is democratizing coaching through AI and hybrid delivery, which expands the
              category but also lowers the perceived boundary between BetterUp and the broader HR-tech stack. The result
              is a credible commoditization path in which BetterUp must keep proving that it is not just another layer
              of AI-enabled employee guidance.
