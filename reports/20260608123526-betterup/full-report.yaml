      - number: '3.2'
        title: 'Head-to-head direct peers: BetterUp vs. CoachHub vs. Torch'
        blocks:
          - type: paragraph
            body: >-
              CoachHub is the clearest like-for-like competitor because it pairs a large human coach network with a 24/7
              AI layer and explicit global-enterprise positioning. Its disclosed language and country coverage are
              broader than BetterUp's public figures, making it especially relevant for multinational rollouts. Torch
              competes differently: its public materials focus on transformation programs, AI practice, and
              organization-level intelligence instead of public network scale. BetterUp still looks strongest when a
              buyer wants premium coaching depth, a large coach bench, and measurable tie-ins to business outcomes;
              CoachHub looks strongest when geography and language coverage dominate the RFP; Torch looks strongest when
              the program is tightly tied to change management, restructuring, or leadership-cohort development. This
              means BetterUp's direct-peer moat is real, but not absolute: CoachHub is close enough on model to pressure
              global accounts, while Torch can win narrower, higher-context change programs without needing
              BetterUp-sized supply.
