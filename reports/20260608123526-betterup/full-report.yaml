        title: Platform definition and SKU map
        blocks:
          - type: paragraph
            body: >
              BetterUp's public product story now centers on a single Human Transformation Platform rather than a single
              coaching app. The retained 2025-2026 pages show a hybrid stack where live coaches remain central for
              leaders and other high-stakes moments, AI coaching expands everyday reach, and the company packages
              experiences by audience and use case. The naming is also in motion. January 2025 launch materials still
              framed the ecosystem around BetterUp Lead, BetterUp Care, and BetterUp Manage, while current support
              materials expose Lead, Manage, Ready, and Grow as live product experiences. I could not retain a separate
              current BetterUp Mind landing page, so the mental-fitness layer appears to be folded into Care- and
              resilience-oriented experiences rather than documented as a standalone 2026 SKU. That does not negate the
              platform breadth, but it means a buyer should ask BetterUp for a current packaging sheet before assuming
              the 2025 labels and the 2026 support nomenclature are fully aligned.
