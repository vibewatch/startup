companyProfile:
  summary: >-
    BetterUp is a late-stage private enterprise coaching platform that combines human coaches, AI coaching, and
    performance workflows for leadership development, manager effectiveness, and workforce resilience. Public evidence
    supports meaningful Fortune 500 and public-sector adoption, a large global coach network, and continued product
    investment through AI launch and tuck-in acquisitions, but financial and operating disclosure remains limited.
