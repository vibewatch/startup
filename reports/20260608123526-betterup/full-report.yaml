      - number: '4.2'
        title: Revenue trajectory, scale signals, and efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The cleanest official financial anchor remains historical: BetterUp said in October 2021 that it had
              crossed $100M ARR and net revenue retention above 170%. After that point, the public record becomes
              estimate-heavy. Sacra modeled BetterUp at roughly $125M ARR in 2021 and $175M ARR in 2022, while GetLatka
              says revenue reached $151.7M in 2023 and $214.6M in 2024. Sacra, however, displays a $250M 2023 revenue
              figure, so the 2023-2024 trajectory is directionally positive but not independently reconciled. Operating
              scale is visible even if topline is not: official disclosures moved from 380 enterprise businesses, 1
              million sessions, and 3,000 coaches in 2021 to nearly 3 million sessions and 600-plus organizations in
              2023 and more than 750 organizations with 4,000 coaches in 2026. Headcount is the key denominator problem.
              Tracxn shows 2,717 employees, GetLatka says 2.8K people including 133 quota-carrying reps, Apps Run The
              World lists 500 employees and $169M revenue, and IncFact gives a 500-1,000 band. Those inconsistencies
              produce a very wide revenue-per-employee range and mean every efficiency proxy should be labeled low
              confidence.
