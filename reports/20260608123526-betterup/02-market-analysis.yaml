        - CHRO, head of talent, L&D leader
        - Core BetterUp budget pool
      - - Manager-effectiveness and people-leader enablement
        - Manager coaching, habits, nudges, feedback and development support
        - Standalone performance-review software with no coaching layer
        - People leaders, HRBPs, business-unit sponsors
        - Fastest practical expansion wedge beyond executives
      - - Workforce resilience and wellbeing coaching
        - Resilience, burnout-prevention, behavior change, caregiver and flexibility support programming
        - Insured therapy, EAP claims handling, medical-plan coverage itself
        - Total rewards, benefits, wellbeing leads
        - Secondary buyer pool; valuable but budget-sensitive
      - - Change, skills, and transformation support
        - Change-readiness, high-potential development, AI-enabled upskilling support, coaching in the flow of work
        - LMS content libraries with no practice, no feedback, and no coaching loop
        - L&D, transformation office, COO or HR transformation teams
        - Important adjacency for enterprise scale deals
      - - Status-quo substitute stack
        - External human coaches, workshops, assessments, surveys, manager toolkits, suite modules
        - Unrelated payroll or core HR administration spend
        - Existing HR and business-function owners
        - Defines the real comparison set BetterUp must displace
    notes: >-
      Included and excluded spend follow retained official buyer messaging plus public survey evidence on L&D, wellbeing,
      and HR-tech budgets; BetterUp's market is multi-pool by nature rather than a single dedicated category.
