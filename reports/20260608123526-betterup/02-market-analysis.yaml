callouts:
  - calloutType: insight
    title: BetterUp's real market is a budget intersection, not one clean TAM
    body: >-
      The strongest evidence does not support one neat BetterUp-only TAM. It supports a budget intersection across
      leadership development, manager effectiveness, resilience, and AI-enabled people development.
    claimRefs:
      - CM013
      - CM017
      - CM018
      - CM045
  - calloutType: strength
    title: AI expands coaching from elite cohorts to broader manager and employee populations
    body: >-
      The market is shifting from premium executive-only coaching toward scalable human-plus-AI models that can reach
      managers and selected broad employee groups while still promising measurable outcomes.
    claimRefs:
      - CM009
      - CM021
