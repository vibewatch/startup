chapter:
  number: 2
  title: Market Analysis
  summary: >-
    BetterUp sits in a real but messy market intersection: enterprise leadership development, manager-effectiveness and
    workforce-resilience budgets, plus a newer AI-coaching and HR-tech modernization layer. Public 2026 market reports
    support a broad leadership/coaching opportunity around roughly $99 billion to $116 billion, but the narrow external
    business-coaching lens is far smaller at about $2.8 billion, which means BetterUp's true SAM depends less on one
    headline TAM than on how much enterprise L&D, wellbeing and change-management spend can be converted into measured,
    repeatable coaching programs. The 2025-2026 shift is favorable to vendors that can scale coaching beyond executives
    and prove outcomes, but rising health-benefit cost pressure, AI-governance scrutiny, and bundle competition from HR
    suites and adjacent vendors make buyer fit and trust as important as category growth.
sections:
  - id: market-boundary
    title: Market boundary and the real budget pools BetterUp is chasing
    body: >-
      BetterUp should not be framed as a generic HR software vendor or as a clinical mental-health provider. The most
      evidence-backed boundary is narrower and more investable: enterprise leadership development, manager-effectiveness,
      behavior-change coaching, and workforce-resilience programs that are purchased by talent, learning, people, or
      transformation leaders. BetterUp's own positioning emphasizes leadership development for critical talent, manager
      effectiveness, AI coaching for every employee, and workforce resilience at scale, while adjacent competitors such
      as CoachHub and Torch market scalable digital coaching, transformation support, and AI-enabled development. The
      market also overlaps with learning platforms and employee-experience suites, but those are better understood as
      substitutes or bundle competitors than as the exact same category. Included spend therefore covers coaching,
      leadership development, manager enablement, and selected resilience programs where the goal is behavior change and
      measurable workforce performance. Excluded spend includes insured behavioral-health care, generic content-library
      subscriptions without coaching or practice loops, and broad HR suites when no development workflow is being
      purchased. This boundary matters because BetterUp's addressable opportunity comes from multiple enterprise budget
      owners rather than a single dedicated "coaching line item," and the strongest buyer logic appears where coaching is
      linked to readiness for change, manager quality, or retention-sensitive talent groups.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM018
      - CM023
      - CM024
      - CM026
    tableRefs:
      - TM001
  - id: sizing-lenses
    title: Public sizing lenses show a large category, but not a clean BetterUp SAM
    body: >-
      Public market estimates support the idea that leadership-development and coaching spend is substantial, but they do
      not isolate a clean BetterUp-specific TAM, SAM, or SOM. Mordor estimates the 2026 executive coaching and
      leadership-development market at $112.98 billion, Future Market Insights puts the 2026 leadership-development
      program market at $98.7 billion, and Coherent Market Insights sizes 2026 leadership-development coaching at $116.47
      billion. Those estimates cluster surprisingly tightly for broad categories, while 360iResearch's narrower business
      coaching lens is only $2.81 billion in 2026, showing how quickly the market shrinks when the definition is limited
      to external coaching services rather than blended learning, leadership development, and platform-enabled delivery.
      The right conclusion is not that one vendor forecast is "correct," but that BetterUp participates in a large,
      multi-budget category whose size changes dramatically with inclusion rules. SHRM, CompTIA, and Harvard Business
      Impact strengthen the sizing thesis from the buyer side: leadership and manager development remains a live CHRO
      priority, AI-training budgets are rising, and L&D teams are under pressure to scale change-ready learning faster.
      That combination supports a meaningful market, but it also means public top-down estimates are better for showing
      strategic direction than for underwriting a precise BetterUp SAM.
    claimRefs:
