  - id: hr-tech-adjacency
    title: BetterUp competes across coaching, wellbeing, and broader HR-tech adjacencies
    body: >-
      BetterUp's competitive positioning is shaped by budget adjacency more than by one neat vendor category. On one
      side, specialist coaching vendors such as CoachHub, Valence, and Torch are adding AI, platform analytics, and
      enterprise change-management messaging to win broader deployments. On the other side, Microsoft Viva and Workday
      position employee experience, skills, learning, internal mobility, and AI-enabled workforce insight inside larger
      HR or productivity suites. The result is that BetterUp is not only competing against direct digital-coaching peers;
      it is also competing against learning platforms, employee-experience layers, manager toolkits, wellbeing programs,
      and the status quo mix of workshops, assessments, and external coaches. The wellness adjacency is real because
      employee stress and burnout create demand for resilience and manager-support programs, but that budget pool is also
      under cost pressure from rising medical and pharmacy expenses. In other words, BetterUp benefits from being useful
      to multiple stakeholders, yet that same multi-budget logic exposes it to bundle competition and to stricter ROI
      scrutiny when benefits or HR-tech budgets tighten.
    claimRefs:
      - CM023
      - CM024
      - CM025
      - CM029
      - CM030
      - CM031
      - CM032
      - CM033
      - CM034
      - CM035
      - CM036
      - CM037
      - CM046
      - CM047
