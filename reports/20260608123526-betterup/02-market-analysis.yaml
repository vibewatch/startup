  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-transparency
      missingEvidence: Public seat-level pricing, average contract size, and per-user budget benchmarks for BetterUp-like enterprise coaching programs.
      whyItMatters: Without public pricing, the chapter can size broad budget pools but cannot convert them into a credible BetterUp-specific SAM or penetration model.
      diligencePath: Request sample SOWs, procurement disclosures, customer budget ranges, or investor materials with contract-size and seat-level pricing data.
      relatedQuestionRefs: [QM024]
    - type: missing-source
      severity: material
      topic: wellbeing-budget-split
      missingEvidence: A credible public dataset showing what share of employer wellbeing budgets currently flows to coaching versus clinical, navigation, or wellness benefits.
      whyItMatters: The wellbeing adjacency is strategically relevant, but the size of the coaching-eligible slice is still not supportable from public evidence.
      diligencePath: Obtain employer benefits-benchmark microdata or broker / consultant survey tables that break out coaching and resilience categories explicitly.
      relatedQuestionRefs: [QM025]
      relatedTableRefs: [TM004]
    - type: missing-source
      severity: material
      topic: ai-only-vs-hybrid-adoption
      missingEvidence: A public 2026 split between AI-only, human-plus-AI, and human-only enterprise coaching deployments.
      whyItMatters: The market narrative clearly moved toward AI, but the actual deployment mix is still opaque and affects BetterUp's cost and positioning assumptions.
      diligencePath: Request vendor deployment mix data, customer references, or independent buyer-survey breakout tables on delivery model mix.
      relatedQuestionRefs: [QM026]
      relatedTableRefs: [TM003]
    - type: missing-source
      severity: material
      topic: procurement-blockers
      missingEvidence: A ranked list of the privacy, legal, security, and bias-review items that most often block AI-coaching pilots from scaling.
      whyItMatters: Governance is a known constraint, but the specific blocker pattern affects sales-cycle risk and regional expansion assumptions.
      diligencePath: Interview enterprise security buyers, legal reviewers, and reference customers about review cycles, requested controls, and common redlines.
      relatedQuestionRefs: [QM027]
      relatedTableRefs: [TM005]
    - type: stale
      severity: minor
      topic: wellbeing-surveys-vintage
      missingEvidence: More current public Deloitte-style wellbeing survey data than the retained 2023 Deloitte well-being study.
      whyItMatters: The stress and burnout pattern is still directionally useful, but fresher third-party trend data would strengthen the 2025-2026 demand read.
      diligencePath: Refresh with the next comparable Deloitte or large-employer wellbeing survey release and replace older well-being benchmarks where possible.
      relatedQuestionRefs: [QM011]
