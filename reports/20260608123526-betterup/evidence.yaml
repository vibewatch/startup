evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headquarters
    missingEvidence: >-
      An authoritative current headquarters statement from BetterUp or a current legal/entity filing that cleanly
      identifies the company’s primary office.
    whyItMatters: >-
      Headquarters affects the canonical company profile and helps distinguish legacy branding from current operating
      center.
    diligencePath: >-
      Request BetterUp’s current corporate-address package, entity filings, and principal-office disclosure from counsel
      or data room.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-TO002
    missingEvidence: A live board roster, committee structure, ownership percentages, and reserved-matters schedule.
    whyItMatters: >-
      Late-stage underwriting depends on understanding who controls strategy, financing, and any secondary liquidity
      decisions.
    diligencePath: Request the current board deck index, cap table, shareholder agreement summary, and observer list in diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: arr-2024
    missingEvidence: A management-approved 2024 revenue and ARR bridge with one clear metric definition and date stamp.
    whyItMatters: >-
      Current scale is central to valuation work, but open sources disagree on the latest figure and mix revenue with
      ARR.
    diligencePath: >-
      Request audited or board-approved 2024 financials plus a KPI memo defining ARR, revenue, NRR, and customer count
      methodology.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: acquisitions
    missingEvidence: Exact close dates, purchase consideration, and post-close integration details for Practica and Heyday.
    whyItMatters: >-
      The acquisitions support the AI thesis, but the accessible public record does not clearly pin down timing or deal
      economics.
    diligencePath: Request M&A summary memos or board materials covering Practica and Heyday, including close dates and rationale.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO004
  - type: access-blocked
    severity: material
    topic: secondary-market
    missingEvidence: >-
      A public or subscriber-visible valuation snapshot with transparent share-count assumptions or executed-trade math
      sufficient to verify an implied 2026 equity value.
    whyItMatters: Current valuation stance should not rely on opaque secondary dashboards or hidden formulas.
    diligencePath: >-
      Obtain a PM Insights, Forge, or Nasdaq Private Market premium export or company-approved secondary history with
      share-class detail.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Public seat-level pricing, average contract size, and per-user budget benchmarks for BetterUp-like enterprise
      coaching programs.
    whyItMatters: >-
      Without public pricing, the chapter can size broad budget pools but cannot convert them into a credible
      BetterUp-specific SAM or penetration model.
    diligencePath: >-
      Request sample SOWs, procurement disclosures, customer budget ranges, or investor materials with contract-size and
      seat-level pricing data.
    relatedQuestionRefs:
      - QM024
