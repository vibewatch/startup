  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: BetterUp realized pricing
    missingEvidence: Average contract values, seat mix by cohort, and renewal pricing remain private; public evidence only shows quote-based selling plus low-confidence comparison estimates.
    whyItMatters: BetterUp's ability to expand below senior-leader cohorts depends on whether realized pricing can compete with seat-based adjacent platforms.
    diligencePath: Request sample MSAs or pricing guardrails by employee tier, plus expansion and renewal data for manager and all-employee programs.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
  - type: conflicting-data
    severity: material
    topic: BetterUp scale-metric consistency
    missingEvidence: A canonical KPI definition for sessions, data points, coaches, and AI usage is missing; official BetterUp surfaces cite different denominators and totals.
    whyItMatters: Inconsistent scale metrics make it harder to benchmark BetterUp's AI and coaching moat versus CoachHub and emerging AI-native competitors.
    diligencePath: Request an investor-grade KPI dictionary and one current metric pack that reconciles all public session, coach, language, and dataset figures.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: Torch public scale disclosure
    missingEvidence: Torch's current customer count, coach-network size, and geographic coverage were not publicly disclosed in the reviewed official materials.
    whyItMatters: Without comparable scale disclosure, Torch may be either a niche specialist or a more material competitor than the public evidence suggests.
    diligencePath: Request Torch RFP responses, reference customers, or analyst data showing current customer count, deployment size, and coach-network breadth.
