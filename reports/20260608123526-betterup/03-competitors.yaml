- id: SP004
  title: Pricing signals, partnerships, and moat durability
  body: 'BetterUp''s strongest evidence-backed advantages are premium hybrid coaching, a large disclosed coach network, and deep workflow integration with Workday and other enterprise systems. Those advantages matter most for executive and manager cohorts where human judgment, behavior change, and governance matter. The problem is economic: independent 2026 buyer guides still describe BetterUp and CoachHub as premium products, while adjacent HR platforms use much cheaper per-seat software pricing and incumbents fold AI-led development into already-approved HCM or learning budgets. BetterUp''s Workday relationship helps embed the product into enterprise workflows, but it also underscores that BetterUp typically relies on partners for the system-of-record anchor. CoachHub''s ICF-led AIMY governance, Workday''s AI acquisitions, and the spread of AI agents across Lattice, 15Five, Culture Amp, Cornerstone, and Workday all point in the same direction: BetterUp''s moat is strongest at the top of
    the market, but category economics are being compressed from below by AI-enabled bundles and from above by incumbent suites with existing budget control. Budget ownership, not product parity, decides many deals.'
