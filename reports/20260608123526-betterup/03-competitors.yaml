- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat or pressure point
  - Why it matters
  - Threat vector
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Premium hybrid coaching depth
    - BetterUp still discloses one of the largest coach networks and a strong human + AI story
    - CoachHub narrows the gap on human coaching and exceeds BetterUp on public global coverage
    - High
    - Request regional win rates and attach rates by cohort to see where BetterUp truly outperforms CoachHub
  - - Workflow embedding via Workday
    - Integration makes BetterUp easier to deploy into enterprise HR motions
    - Partner-owned workflow anchors can also become gatekeepers if Workday pushes adjacent partners or native AI instead
    - Medium-High
    - Quantify pipeline sourced through Workday and the share of expansions dependent on partner data triggers
  - - Premium price positioning
    - Category economics hinge on whether BetterUp can scale below executive cohorts
    - Independent guides still frame BetterUp as expensive relative to per-seat HR platforms
    - High
    - Request realized ACV, cohort mix, and seat-expansion economics below director level
  - - Adjacent bundle competition
    - Lattice, 15Five, Culture Amp, and Leapsome package manager guidance inside cheaper workflow tools
    - Managers may accept software-led coaching prompts instead of premium external coaching
    - High
    - Compare renewal and expansion win/loss data against adjacent HR platforms, not only pure-play coaching vendors
  - - Incumbent suite substitution
    - Workday and Cornerstone already control large learning/talent budgets and enterprise data flows
    - They can bundle AI, learning, skills, and partner ecosystems without a separate coaching vendor
    - High
    - Map which budget line BetterUp displaces today and where incumbents already own the decision maker
  - - Public metric consistency
    - Investors and buyers will benchmark BetterUp's AI/data scale claims against peers
    - Official BetterUp surfaces cite different counts for sessions and data points
    - Medium
    - Request a canonical KPI dictionary for sessions, coaches, data points, and AI adoption metrics
  notes: Risk rows prioritize moat durability, incumbent response, pricing pressure, and evidence quality rather than speculative product-roadmap commentary.
