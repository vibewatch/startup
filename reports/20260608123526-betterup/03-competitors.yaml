- id: SP003
  title: Adjacent HR platforms and incumbent suites compete on breadth and budget fit
  body: The broader competitive risk to BetterUp is not another coach network; it is the widening set of HR platforms that make manager enablement part of a broader suite. Leapsome ties HRIS, performance, learning, and AI agents together for 2,000+ organizations. Lattice combines performance, goals, analytics, and an HR AI agent, while Culture Amp blends engagement, performance, and AI-guided manager coaching for 6,000+ companies. 15Five packages performance reviews, engagement, compensation signals, manager products, Kona, and AMAYA with transparent published pricing. Above them, Workday and Cornerstone already own core enterprise processes such as HCM, learning, skills, and workforce-readiness workflows. None of these vendors replicates BetterUp's external coach marketplace, but each can satisfy enough of the manager-effectiveness or development job to redirect budgets away from premium standalone coaching—especially when procurement prefers fewer vendors, lighter integrations, and seat-based
    pricing over bespoke coaching programs.
  claimRefs:
  - CP017
  - CP018
  - CP019
  - CP020
  - CP021
  - CP022
  - CP023
  - CP024
  - CP025
  - CP026
  - CP027
  - CP030
  - CP035
