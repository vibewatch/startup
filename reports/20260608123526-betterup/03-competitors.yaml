company:
  name: BetterUp
chapter:
  number: 3
  title: Competitors
  summary: BetterUp's closest pure-play rival is CoachHub, while Torch is a narrower coaching-plus-change alternative. The larger strategic pressure comes from adjacent HR platforms—Leapsome, Lattice, Culture Amp, and 15Five—that bundle manager guidance and AI into cheaper per-seat software, plus incumbents such as Workday and Cornerstone that already own system-of-record or learning budgets. BetterUp's edge remains premium hybrid coaching plus workflow integrations such as Workday; its main risk is that AI-assisted manager enablement becomes good enough without a dedicated coaching vendor.
sections:
- id: SP001
  title: 'Competitive frame: direct peers, adjacent platforms, and status-quo substitutes'
  body: 'BetterUp is not competing in a single, clean enterprise-coaching category. The closest direct alternatives are CoachHub and Torch, both of which sell coaching-led transformation outcomes, but many buyers can solve the same job by extending existing HR software rather than buying a standalone coaching vendor. Leapsome, Lattice, Culture Amp, and 15Five all package manager guidance, performance workflows, analytics, and AI assistants inside broader people-software budgets. Workday and Cornerstone sit one layer higher again: they do not market themselves as giant external coach networks, yet they already own HCM, learning, skills, and workforce-readiness budgets that can absorb development spend. In practice, BetterUp often wins only if the buyer values premium human coaching plus workflow-level AI enough to justify a separate line item instead of relying on the current HCM, performance, or learning stack. The practical status quo is often a buyer keeping leadership development inside
    manager routines, surveys, learning tools, and HCM workflows already in place.'
  claimRefs:
  - CP001
  - CP002
  - CP017
  - CP019
  - CP021
  - CP023
  - CP025
  - CP027
  - CP035
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: SP002
  title: 'Head-to-head direct peers: BetterUp vs. CoachHub vs. Torch'
  body: 'CoachHub is the clearest like-for-like competitor because it pairs a large human coach network with a 24/7 AI layer and explicit global-enterprise positioning. Its disclosed language and country coverage are broader than BetterUp''s public figures, making it especially relevant for multinational rollouts. Torch competes differently: its public materials focus on transformation programs, AI practice, and organization-level intelligence instead of public network scale. BetterUp still looks strongest when a buyer wants premium coaching depth, a large coach bench, and measurable tie-ins to business outcomes; CoachHub looks strongest when geography and language coverage dominate the RFP; Torch looks strongest when the program is tightly tied to change management, restructuring, or leadership-cohort development. This means BetterUp''s direct-peer moat is real, but not absolute: CoachHub is close enough on model to pressure global accounts, while Torch can win narrower, higher-context
    change programs without needing BetterUp-sized supply.'
  claimRefs:
  - CP003
  - CP004
  - CP005
  - CP009
  - CP010
  - CP011
  - CP012
  - CP014
