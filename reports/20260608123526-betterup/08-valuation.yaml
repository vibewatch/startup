  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: secondary-market
    missingEvidence: >-
      A dated 2026 secondary trade, signed tender offer, mutual-fund NAV mark, or board-approved 409A that ties BetterUp equity to an observed share price.
    whyItMatters: >-
      Without a verified print, the requested ~$2.26B anchor is only an underwriting illustration rather than a confirmed market-clearing valuation.
    diligencePath: >-
      Request the latest 409A, tender or secondary transaction tape, and any mutual-fund valuation memos from management or the transfer agent.
    relatedQuestionRefs:
    - QV008
    - QV033
    relatedTableRefs:
    - TV002
    - TV007
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin-and-coach-payout
    missingEvidence: >-
      Audited 2025-2026 gross margin, contribution margin by product, and the coach payout or utilization bridge before and after AI-coaching rollout.
    whyItMatters: >-
      The valuation debate turns on whether AI improves unit economics or merely adds product surface while leaving human-service intensity high.
    diligencePath: >-
      Obtain audited financials plus an operating-review deck that reconciles coach costs, AI usage, and contribution margin by segment.
    relatedQuestionRefs:
    - QV031
    relatedTableRefs:
    - TV005
    - TV007
  - type: private-evidence-only
    severity: blocking
    topic: retention-and-cohort-quality
    missingEvidence: >-
      Net revenue retention, gross retention, renewal cadence, seat expansion, and churn by employer cohort and product line.
    whyItMatters: >-
      A premium multiple is hard to defend without proof that BetterUp retains and expands enterprise accounts rather than relying on one-time coaching spend.
    diligencePath: >-
      Request customer cohort data, board-level KPI packs, and renewal dashboards segmented by leadership, manager, and workforce products.
    relatedQuestionRefs:
    - QV032
    relatedTableRefs:
    - TV005
    - TV007
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: >-
      Current cap table, liquidation preferences, participation rights, side letters, and any structured terms attached to primary or secondary liquidity.
    whyItMatters: >-
      Preference overhang can materially change common-equity outcomes even when the headline valuation appears to hold, especially after a multiyear private-market reset.
    diligencePath: >-
      Review financing documents, the latest cap-table export, and counsel summaries of transfer restrictions and investor protections.
    relatedQuestionRefs:
    - QV033
    relatedTableRefs:
    - TV006
    - TV007
