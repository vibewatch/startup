- id: TV006
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Audited ARR too low
    - 2025-2026 ARR lands below roughly $200M
    - The illustrative 2026 mark moves outside a defendable premium-multiple range.
    - Re-underwrite closer to the bear case and insist on a lower entry.
  - - AI margin case fails
    - No observable improvement in gross margin or coach-cost intensity after AI rollout
    - AI becomes a narrative layer rather than an economic moat.
    - Compress the multiple toward 5x-7x until proof appears.
  - - Retention data disappoints
    - NRR below premium-software norms or weak cohort renewals
    - The recurring-revenue premium breaks.
    - Treat the asset more like project-based L&D spend than durable software.
  - - Coach-supply friction worsens
    - Evidence of coach churn or further payout compression without utilization gains
    - Service quality and capacity become constraints on growth and margin.
    - Increase risk discount and revisit the bull/base ranges.
  - - Secondary and 409A support stays hidden
    - No 2026 verified print or 409A support is produced in diligence
    - The chapter’s entry anchor remains illustrative rather than priced.
    - Do not rely on the headline mark when sizing a term sheet.
  - - Preference overhang is heavy
    - Liquidation stack or structured terms absorb most sub-$3B exit value
    - Common-equity outcomes diverge from headline valuation.
    - Reprice expected returns or negotiate structural protection.
  notes: >-
    These are valuation-moving triggers: each one changes price support, not merely the narrative tone around BetterUp.
