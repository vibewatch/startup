- id: peer-band-and-market-reset
  title: Peer band and market reset
  body: >-
    The most useful benchmark is a blended set of public HCM, learning, and adjacent wellness companies rather than a single “perfect” comparable. Workday, Paylocity, and Paycom all trade around 3.1x-3.6x market cap to revenue on current Yahoo Finance data, while learning and wellness names range from about 0.5x for Teladoc to 3.7x for Talkspace. The median across the selected set is roughly 3.1x. That is far below BetterUp’s illustrative 9.0x-12.9x band, although Multiples.vc still shows human capital management software at 8.7x EV/NTM revenue in May 2026, which narrows the gap if BetterUp’s true revenue base is already near the top of the public estimate range. Private-coaching context supports some premium as well. Sacra still describes BetterUp as the leader in online professional coaching, with more capital raised than CoachHub, Torch, or Bravely, while Headspace Work shows that adjacent employer wellness platforms are also trying to scale AI-enabled support at large enterprise footprints.
    The catch is that the whole software market now prices AI as both upside and threat. L40 and Multiples.vc both argue that buyers reward AI-defensible assets but punish software businesses that look exposed to AI-driven substitution. BetterUp’s premium therefore has to be earned through economics, not just narrative.
