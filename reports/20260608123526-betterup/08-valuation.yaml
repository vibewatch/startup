- id: scenario-range-and-ai-sensitivity
  title: Scenario range and AI sensitivity
  body: >-
    The cleanest way to underwrite BetterUp in public evidence is through a revenue-multiple range, with AI as the main variable that can move both growth and margin. The bull case requires BetterUp’s 2025-2026 AI rollout to do more than add product breadth: it has to raise coach capacity, improve contribution margin, and preserve enterprise retention so that investors can justify 10x-12x revenue or ARR-like multiples on a bigger denominator. The base case is less heroic and more plausible. It assumes revenue is already in the $220M-$250M zone, AI helps defend rather than radically expand the business, and the market pays about 8x-10x for a scaled but still opaque private HR-tech asset. The bear case is not a collapse of demand so much as a compression of the premium. If BetterUp cannot show that AI improves economics, or if buyers decide AI makes coaching more substitutable, the multiple can compress toward 5x-7x and force a valuation closer to $0.9B-$1.4B. That is why AI is not just a
    product story here. It is the key variable linking growth, service cost, buyer confidence, and exit multiple.
  claimRefs:
