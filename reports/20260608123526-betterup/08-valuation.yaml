- id: TV007
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited ARR bridge
    - Audited 2025-2026 ARR and revenue bridge by product and customer segment
    - The valuation debate depends on whether the true denominator is closer to $175M, $215M, or $250M+.
    - Finance team, auditor, and board materials.
  - - Gross margin and coach payout
    - Gross margin, contribution margin, coach utilization, and payout trend before and after AI rollout
    - Determines whether AI expands margin or simply masks service intensity.
    - Finance plus operations review deck.
  - - Retention quality
    - NRR, GRR, cohort renewal, seat expansion, and contraction by employer cohort
    - Without retention proof, BetterUp does not earn a stable premium multiple.
    - Revenue-operations and customer-success dashboards.
  - - Secondary and 409A support
    - Latest 409A, tender or secondary prints, and any mutual-fund marks
    - Converts the illustrative ~$2.26B anchor into a verified market datapoint.
    - Transfer agent, CFO, and investor-relations pack.
  - - Cap table and preferences
    - Liquidation preference stack, participation rights, side letters, and ROFR restrictions
    - Headline valuation can overstate common-equity value if the stack is heavy.
    - Legal counsel plus current cap-table export.
  - - AI adoption economics
    - Usage, attach, conversion, and renewal evidence for AI coaching products
    - Shows whether AI is creating value, defending retention, or increasing commoditization risk.
    - Product analytics and go-to-market scorecards.
  notes: >-
    These are the minimum files needed to convert BetterUp from an interesting private-market story into an underwritable investment at or near the requested mark.
