- id: capital-base-and-valuation-markers
  title: Capital base, investor roster, and valuation markers
  body: 'The capital story is strong on the last primary round and much weaker on the current private-market mark. BetterUp’s own Series E release is explicit: the company announced a $300 million round at a $4.7 billion valuation in October 2021, led by Wellington Management, ICONIQ Growth, and Lightspeed, with Salesforce Ventures and Mubadala also participating. Independent private-market platforms broadly confirm the valuation and investor mix, but not every detail. Nasdaq Private Market and Forge both surface the Series E at roughly $339 million rather than $300 million, implying either gross-versus-net differences or a data-vintage mismatch that later valuation work should preserve rather than smooth away. The same dynamic appears in lifetime funding and revenue estimates. Forge and Apps Run The World now point to roughly $628 million total funding, while official BetterUp materials only clearly establish $600 million through the 2021 announcement. Likewise, open market-data sources
    do not cleanly corroborate the latest ARR figure. What is public in 2026 is active secondary-market interest — bids, offers, a last-trade marker, and an NPM share-price estimate — but not a transparent enough public dataset to treat one exact implied equity value as canonical.'
