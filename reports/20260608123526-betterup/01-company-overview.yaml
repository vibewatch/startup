- id: customers-partnerships-and-platform-expansion
  title: Customer proof, partnerships, and AI-platform expansion
  body: 'Public customer proof is one of BetterUp’s stronger assets. The company’s own customer page and multiple partner materials point to adoption across large enterprises and institutions, while the Salesforce and Mercedes records add outside support that BetterUp is more than a conceptual coaching brand. The platform story also looks broader than one-to-one coaching alone. BetterUp has kept building integrations with workflow and HR systems such as Workday and Salesforce, and it used the January 2025 AI Coaching launch to reposition the company around hybrid human-plus-AI development at enterprise scale. That announcement matters because it did two things at once: it launched a new AI product layer and disclosed that BetterUp had recently acquired Practica and Heyday to deepen role-specific coaching and coach-enablement workflows. Those moves, together with current partner examples like the Mercedes-AMG PETRONAS F1 expansion, show a business that is still extending distribution and
    product surface area even without a fresh primary financing event. The caveat is that many outcome numbers in this section remain company-claimed rather than independently audited.'
