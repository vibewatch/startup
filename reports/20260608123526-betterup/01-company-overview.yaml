- id: milestones-adverse-signals-and-diligence-gaps
  title: Milestones, adverse signals, and the main diligence gaps
  body: 'The milestone path is clear enough to establish chapter-1 ground truth. BetterUp was founded in 2013, showed early enterprise traction by 2019, reached $100 million ARR and opened European offices in 2021, raised its Series E at a $4.7 billion primary valuation later that year, expanded integrations and AI capabilities across 2024 and 2025, and added a CFO plus current secondary-market trading signals in 2026. The adverse record is not existential but should not be buried. UniCourt shows a 2025 wrongful-termination case against BetterUp that includes allegations of wage disparity, discrimination, and retaliation; the reviewed docket does not establish those allegations as proven facts, but it does create a real reputational and culture diligence item. The more important underwriting issue is opacity, not scandal: current board structure, exact live cap table, clean headquarters designation, corroborated 2024 ARR, exact close dates for Practica and Heyday, and a fully transparent
    2026 implied valuation are all still incomplete in the accessible public record. That means the company overview can be confident on identity and historical milestones while still carrying material evidence gaps into later chapters.'
