company:
  name: BetterUp
chapter:
  number: 1
  title: Company Overview
  summary: 'BetterUp is a 2013-founded enterprise coaching platform whose public record supports a durable human-plus-AI product story, a founder-led operating core, and a top-tier 2021 Series E that set a $4.7 billion primary valuation. The same record is materially less clean on current cover metrics: open sources disagree on latest revenue, headquarters signals now split between a San Francisco legacy identity and Austin-era operational listings, and public secondary-market pages show clear trading activity in 2026 without exposing enough transparent math to verify a single implied equity value with high confidence.'
sections:
- id: identity-product-and-footprint
  title: Identity, product scope, and public footprint
  body: 'BetterUp’s identity record is strongest when anchored on its own current surfaces and recent press materials rather than on stale directory pages. The company says it was founded in 2013 and presents itself in 2026 as the human transformation platform for the AI era — effectively an enterprise software-and-services platform that combines coaching, AI, behavioral science, and performance analytics. Official pages consistently frame the product around workforce development, manager effectiveness, resilience, and human performance rather than around one narrow wellness use case. The company also continues to publish a scale narrative that is big enough to matter for later chapters: 750+ enterprise customers, 4,000+ coaches, coverage across 70+ countries, and measurable outcome claims such as 14x ROI and lower voluntary turnover. The main caveat is location. Older partner material still describes BetterUp as San Francisco-based, but 2025-2026 company press datelines and one office-location
    source shift the center of gravity toward Austin. For chapter 1, the right takeaway is that BetterUp’s product identity is clear, but its current headquarters signal is not perfectly standardized across public materials.'
