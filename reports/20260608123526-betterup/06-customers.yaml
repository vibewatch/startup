tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Representative proof
  - Scale / operating context
  - Revenue / strategic value
  - Gap
  rows:
  - - Enterprise product and engineering teams
    - L&D or people-development leaders / product managers and managers / enterprise HR budget
    - Google product managers and Twilio employee coaching
    - Google PM cohort plus Twilio rollout to 8,000+ employees
    - Shows BetterUp can sell into elite technology organizations and then widen across large populations
    - No ACV, renewal cadence, or product attach rate disclosed
  - - Life sciences leadership systems
    - Chief people / digital leaders / enterprise people budget
    - Moderna leadership-system build and 2,000+ employee study
    - Large-scale cultural redesign anchored in internal performance drivers
    - Strong proof that BetterUp can support transformation beyond generic wellness coaching
    - No contract size or ongoing seat count disclosed
  - - Energy and industrial transformation
    - Organizational development / leaders and supervisors / enterprise L&D budget
    - Chevron and Rolls-Royce transformation programs
    - Chevron cites 1,000 coached managers; Rolls-Royce coached leaders for six months
    - Supports high-value transformation use cases where resilience and coaching culture matter
    - Public proof is thin on commercial terms and repeat-purchase history
  - - HR-tech and SaaS managers
    - People leaders / managers / enterprise HR budget
    - Workday, NetApp, Delivery Hero
    - Hypergrowth and cross-functional collaboration contexts
    - Shows fit with scaling, culture, and manager-effectiveness programs
    - Public materials do not disclose customer mix by company size
  - - Public sector and defense
    - Agency or military leadership / supervisors and officers / government workforce-development budget
    - NASA, FAA, U.S. Air Force, unnamed military branch, City of Santa Monica
    - Executive, supervisor, Airmen, Guardians, and municipal employee populations
    - Supports government mission-readiness and resilience use cases, not just private-sector coaching
    - U.S. Army is not directly verified in reviewed sources
  - - Healthcare and service operations
    - Leadership academy or HR / clinicians and mission partners / health-system people budget
    - OSF HealthCare and Travelodge
    - OSF spans 147 locations and 25,000 employees; Travelodge used BetterUp in post-COVID talent redesign
    - Adds evidence that BetterUp can support frontline-heavy or operationally stressed organizations
    - Breadth is visible, but exact deployment depth is undisclosed
  notes: Segment definitions are inferred from named customer stories, partner materials, and customer-role descriptions rather than a company-published customer-segmentation breakout. Public proof is strongest for large enterprises and targeted populations.
