- id: expansion-loops-retention-proxies-and-partner-ecosystem
  title: Expansion loops, retention proxies, and partner ecosystem
  body: |-
    The public record suggests BetterUp is designed to land in a targeted cohort and then expand through both workflow integration and internal proof points. Salesforce’s customer story describes engagements that often begin with a segment of the organization and then widen after early success, while Delivery Hero explicitly says it doubled licenses over more than two years. BetterUp’s own integration stack supports that motion: Microsoft Viva embeds BetterUp content in the flow of work, Workday and SAP SuccessFactors help HR teams deploy or revoke licenses based on employee attributes, and Salesforce is used inside BetterUp’s own GTM system to manage customer health, renewal expansion, and onboarding. Together these sources show an enterprise platform trying to become operationally sticky, not just inspirational.

    What the public record does not provide is hard retention math. There is no public NRR, GRR, churn, or renewal-rate disclosure in reviewed sources. The best durability proxies come from case studies and review surfaces. Twilio’s retention deltas are directionally strong, TrustRadius suggests buyers can get value in senior-leader use cases, and BetterUp repeatedly markets turnover reduction and ROI studies. But those are still proxies. Investors can underwrite a credible post-sale motion and some expansion evidence, yet they cannot treat public materials as a substitute for cohort retention or renewal data.
