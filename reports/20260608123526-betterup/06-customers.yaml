  evidenceGaps:
  - type: missing-metric
    severity: material
    topic: current paying-customer and active-account count
    missingEvidence: A current paying-customer count broken out by active enterprise accounts, government accounts, and major product lines.
    whyItMatters: The reviewed public record supports 750+ enterprise customers, but it does not show active-account mix, customer adds, or whether any larger enterprise-client shorthand is valid.
    diligencePath: Request current account count, paying-customer count, and net-new / gross-new logo adds for 2024, 2025, and YTD 2026.
    relatedQuestionRefs:
    - QU001
    - QU002
    relatedTableRefs:
    - TU002
  - type: missing-source
    severity: material
    topic: customer mix by size, geography, and ACV
    missingEvidence: A segmentation table showing customers by ACV band, employee size, geography, vertical, and product or use-case bundle.
    whyItMatters: Named case studies prove breadth, but public references skew toward large, referenceable accounts and do not quantify the real revenue mix.
    diligencePath: Request customer segmentation by ACV, company size, geography, and product family, with example references for each major cohort.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU001
  - type: missing-metric
    severity: critical
    topic: retention and renewal economics
    missingEvidence: NRR, GRR, logo churn, renewal rates, contract duration, and expansion ARR by cohort or product.
    whyItMatters: Case studies and reviews suggest durable value in some cohorts, but investors still cannot see whether BetterUp retains and expands customers at attractive software-like levels.
    diligencePath: Request retention cohorts, renewal waterfalls, contract-length mix, and expansion ARR by product for 2024, 2025, and YTD 2026.
    relatedQuestionRefs:
    - QU018
    - QU026
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: customer concentration and large-account dependency
    missingEvidence: Top-customer ARR share, top-10 customer concentration, renewal calendar concentration, and exposure to a handful of strategic accounts.
    whyItMatters: Premium pricing and large-enterprise focus can create outsized revenue dependence on a small number of buyers, but the public record does not quantify that risk.
    diligencePath: Request top-10 customer ARR share, concentration trend, and renewal calendar by quarter.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: u.s.-army-specific deployment proof
    missingEvidence: A direct U.S. Army contract, case study, or official announcement tying BetterUp to an Army deployment.
    whyItMatters: Reviewed sources support NASA, FAA, the U.S. Air Force, and an unnamed military branch, but they do not directly verify a U.S. Army customer claim.
    diligencePath: Search procurement records or obtain a direct Army reference before using the Army logo in diligence materials.
    relatedQuestionRefs:
    - QU014
    relatedTableRefs:
    - TU003
