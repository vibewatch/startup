- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Driver / risk
  - Public signal
  - Impact
  - Current read
  - Diligence path
  rows:
  - - Cohort-to-expansion motion
    - Salesforce says BetterUp often starts with one segment and expands after proof points
    - Supports expansion ARR without net-new logos
    - Positive but unquantified
    - Request seat expansion by cohort and time-to-expand
  - - Integration-led stickiness
    - Microsoft Viva, Workday, SAP, and Salesforce integrations embed BetterUp into existing workflows and systems
    - Can reduce deployment friction and improve renewal defensibility
    - Real strategic asset
    - Request activation and attach rates by integration
  - - Named customer license growth
    - Delivery Hero says it doubled licenses over 2+ years
    - Supports land-and-expand narrative inside live accounts
    - Positive but anecdotal
    - Request expansion rates across top 20 accounts
  - - Large-account dependency
    - SWOTAnalysis.com says BetterUp is over-reliant on large enterprise contracts
    - A small number of large renewals could move results materially
    - Meaningful unresolved risk
    - Request top-10 customer ARR share and renewal calendar
  - - Premium-pricing exposure
    - Risely and GWork frame BetterUp as premium-priced and cohort-oriented
    - Budget pressure can narrow deployments or slow renewals
    - Material risk outside high-value populations
    - Request win/loss reasons and pricing by segment
  - - ROI proof risk
    - TrustRadius and SWOTAnalysis.com both point to ROI-proof challenges
    - Weak measurement can drive churn or downsizing in discretionary programs
    - Material risk
    - Request customer ROI studies used in live renewal processes
  notes: This table deliberately mixes positive expansion drivers with explicit underwriting risks because public materials show both. Concentration remains unresolved because BetterUp does not publish top-account exposure.
