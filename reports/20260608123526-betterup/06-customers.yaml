- id: named-deployment-proof-and-public-sector-evidence
  title: Named deployment proof and public-sector evidence
  body: |-
    BetterUp’s strongest public evidence is the depth of several named customer stories. Google’s product-manager program, Moderna’s leadership-system redesign, Chevron’s Coaching Circles deployment, Workday’s manager program, Twilio’s broad employee rollout, and NetApp’s global-language footprint all go materially beyond logo walls. They describe who the users were, why BetterUp was deployed, and what changed afterward. In several cases the outcomes are quantified: Google cites gains in strategic planning, sphere of influence, and work-life balance; Moderna cites improvements in team cohesion and goal attainment; Chevron cites gains in psychological safety and coaching capabilities; Workday reports 94% job-effectiveness and 93% goal-progress responses; and Twilio links coaching to performance and retention lifts.

    Public-sector proof is also real, but it needs precision. NASA and FAA appear in a direct BetterUp press release and in BetterUp’s government channel through Carahsoft, while the U.S. Air Force has a dedicated case study with mission-readiness metrics. BetterUp also publishes an unnamed U.S. military-branch story. That is enough to support public-sector and defense deployment proof. It is not enough to support a direct U.S. Army customer claim from reviewed sources, so that logo should stay unverified for this chapter.
