  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow trigger
      - BetterUp solution
      - Measurable benefit
      - Limitation
    rows:
      - - Support a newly promoted manager
        - Promotion or role-change event appears in HCM
        - Workday-triggered provisioning plus Manage or Lead coaching and in-flow reminders
        - Delivers support at the moment of highest manager risk
        - Requires accurate HRIS data mapping and customer-side rollout.
      - - Act on employee feedback quickly
        - Poor manager or team scores show up in Workday Peakon
        - Feedback insights trigger personalized coaching recommendations
        - Creates a closed loop from listening to development action
        - Public materials do not expose the exact scoring thresholds or logic.
      - - Practice high-stakes communication in daily work
        - Employee receives a live challenge in email/chat/workflow
        - AI coaching provides in-the-moment practice and can escalate to a human coach
        - Extends support beyond scheduled live sessions
        - Newest AI outcomes remain mostly company-issued evidence.
      - - Drive sales-leader execution
        - CRM or revenue pressure creates coaching need
        - Sales performance coaching plus Salesforce-linked reporting
        - Case study shows quota and revenue attainment gains
        - Evidence is company-authored proof, not audited public benchmarks.
      - - Support resilience and readiness at scale
        - Org change, leave, or burnout risk requires broad support
        - Care- or Ready-style coaching, group programs, and nudges
        - Lets buyers reach broader populations than exec-only coaching
        - Current Care-versus-Ready product mapping is not fully explicit.
      - - Improve mission-readiness in dispersed workforces
        - Geography, time-zone, and role complexity complicate live support
        - Whole Person coaching delivered across ranks and time zones
        - Air Force case study shows preparedness and commitment gains
        - Public proof is concentrated in selected case studies rather than broad benchmarks.
    notes: >
      Benefits are limited to public BetterUp case studies and integration materials; they should
      be treated as company-claimed customer proof rather than audited, cross-customer benchmarks.
    claimRefs:
      - CE006
      - CE018
      - CE019
      - CE020
      - CE021
      - CE022
      - CE024
      - CE025
      - CE026
      - CE027
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - - Signal and identity layer
        - Ingests HCM status, role, location, and feedback signals to determine eligibility and context
        - Depends on Workday, SAP, SFTP feeds, and customer data quality
        - Bad mappings or stale records can mis-provision users or mistime interventions.
      - - Personalization and matching engine
        - Uses Identify-style logic, milestone moments, and assessments to decide support type and timing
        - Depends on organizational priorities, assessment data, and model quality
        - Public materials describe outcomes but not model architecture or validation depth.
      - - Human coaching network
        - Delivers one-on-one, specialist, group, Ready, and executive support across geographies
        - Depends on coach supply, scheduling, QA, and retention economics
        - Scale pressure or coach scarcity can reduce response quality.
      - - Flow-of-work engagement layer
        - Pushes nudges, content, reports, AI messages, and session actions into Teams, Viva, Slack, and web surfaces
        - Depends on admin permissions, marketplace availability, and app adoption
        - Integration failures directly reduce usage and ROI.
      - - People analytics and ROI layer
        - Connects BetterUp data to productivity, engagement, performance, and retention outcomes through PAD and dashboards
        - Depends on linked HRIS/CRM data and customer willingness to measure outcomes
        - Outcome claims are hard to verify externally without customer data access.
      - - Trust and control plane
        - Applies encryption, hosting choices, privacy rules, model-training restrictions, and AI guardrails
        - Depends on AWS, Heroku, vendor contracts, and internal governance programs
        - Public trust artifacts are strong narrative evidence but not full downloadable diligence packs.
    notes: >
      This architecture is an external reconstruction from BetterUp product, trust, support, and
      partner materials rather than an internal systems diagram or public API reference.
    claimRefs:
      - CE011
      - CE017
      - CE018
      - CE020
      - CE022
