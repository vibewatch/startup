    type: flow
    layout: standard
    summary: >
      The public workflow runs from an enterprise signal to provisioning, coaching interactions,
      and measurable outcomes.
    data:
      nodes:
        - id: n1
          label: Enterprise signal or milestone
          description: Promotion, new hire, leave, feedback result, sales challenge, or org change creates a support need.
        - id: n2
          label: Eligibility and provisioning
          description: HCM and integration rules provision or de-provision the right BetterUp population.
        - id: n3
          label: Onboarding and assessment
          description: Members sign in, complete assessments, and create a baseline for matching and measurement.
        - id: n4
          label: Human and AI coaching delivery
