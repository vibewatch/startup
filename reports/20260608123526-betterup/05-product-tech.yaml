  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sku-taxonomy
      missingEvidence: A current BetterUp packaging sheet or sales collateral that reconciles Lead, Care, Manage, Ready, Grow, and any Mind-era naming into one authoritative 2026 SKU map.
      whyItMatters: The retained public evidence shows taxonomy drift across 2025 and 2026 sources, which makes it harder to underwrite module scope, pricing, and rollout assumptions.
      diligencePath: Ask BetterUp for the current enterprise product catalog, quote sheet, and a redline showing how legacy Care or Mind naming maps onto current Ready or Grow experiences.
      relatedQuestionRefs: [QE003]
      relatedTableRefs: [TE001]
    - type: private-evidence-only
      severity: material
      topic: technical-disclosure
      missingEvidence: External API schemas, field-level mapping docs, webhook catalogs, SSO or SCIM docs, module-level SLAs, and downloadable trust artifacts under NDA.
      whyItMatters: Without those materials it is possible to believe the deployment model exists but impossible to fully estimate engineering effort, operational maturity, or failure-mode handling.
      diligencePath: Request the customer-facing technical implementation guide, API reference, security package, and standard SLA exhibit during management diligence.
      relatedQuestionRefs: [QE025]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: ai-effectiveness
      missingEvidence: Independent validation of the 95% AI feature satisfaction and 16% confidence uplift claims from the January 2025 AI launch.
      whyItMatters: Those outcome claims help anchor BetterUp's moat narrative, but the retained evidence is still limited to company-issued or company-syndicated sources.
      diligencePath: Ask for methodology, sample size, customer names, and any third-party evaluation used in the early-access AI coaching study.
      relatedQuestionRefs: [QE014]
      relatedTableRefs: [TE005]
    - type: missing-source
      severity: minor
      topic: coach-quality
      missingEvidence: Current coach acceptance rates, active-coach utilization, QA pass rates, and average wait times by geography or language.
      whyItMatters: Public materials show the network is large, but not whether quality and availability stay consistent as BetterUp expands AI reach and enterprise coverage.
      diligencePath: Ask for coach-network operating metrics, geography coverage dashboards, and recent quality-review summaries from the Chief Coaching Officer or operations team.
      relatedQuestionRefs: [QE016, QE024]
      relatedTableRefs: [TE004]
