callouts:
  - calloutType: strength
    title: Hybrid human-plus-AI delivery is the clearest moat
    body: >
      BetterUp is not selling only a coach marketplace or only an AI assistant. The stronger
      public evidence points to a hybrid system where AI broadens reach, integrations improve
      timing, and human coaches remain the escalation and high-stakes layer.
    claimRefs:
      - CE001
      - CE006
      - CE015
      - CE016
      - CE017
      - CE028
  - calloutType: insight
    title: Deployment quality depends on enterprise plumbing
    body: >
      The platform becomes meaningfully more valuable when Workday, SAP, Teams, Viva, Slack, and
      CRM systems are connected. That is also why rollout mechanics, permissions, and customer-
      side data hygiene matter almost as much as the coaching content itself.
    claimRefs:
      - CE017
      - CE018
      - CE019
      - CE022
      - CE024
  - calloutType: risk
    title: Public trust evidence is stronger than public technical transparency
    body: >
      BetterUp discloses enough to show a real privacy and AI-governance program, but not enough
      to let an outside engineer fully inspect APIs, SLAs, or test reports. External review
      signals also still point to coach-supply and scaling risk.
    claimRefs:
      - CE031
      - CE032
      - CE034
      - CE039
      - CE040
      - CE042
