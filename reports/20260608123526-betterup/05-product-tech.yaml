  - id: TE004
    title: Trust / quality / compliance table
    columns:
      - Control / quality signal
      - Status
      - Scope
      - Evidence
      - Gap
    rows:
      - - SOC 2 Type II and ISO 27001
        - Claimed current
        - Enterprise platform controls and recurring audits
        - Trust Center, About page, customer page, and Jan 2025 AI launch
        - Public page references reports but does not publish the full artifacts.
      - - TLS and AES-256 encryption
        - Claimed current
        - Data in transit and at rest
        - Trust Center
        - No public key-management or architecture diagram.
      - - US and EU regional hosting
        - Claimed current
        - Customer choice of data residency across AWS regions and Heroku private spaces
        - Trust Center
        - No public region-by-region service inventory or failover RTO/RPO.
      - - Customer data not used for model training
        - Claimed current
        - Coaching conversations and vendor contracts
        - Trust Center plus AI privacy notice existence
        - Public page states policy but not the full vendor contract language.
      - - AI safety guardrails
        - Claimed current
        - Detect-Respond-Monitor framework with classifier agents and customizable responses
        - Trust Center
        - No public model card, benchmark appendix, or red-team report.
      - - Executive and board oversight
        - Claimed current
        - Information Security Committee and periodic board updates
        - Trust Center
        - Governance cadence is described at a high level only.
      - - Separate AI privacy documentation
        - Observed current
        - General privacy notice current Feb 2026 and AI privacy notice updated May 2025
        - Legal hub pages
        - Underlying notice text is harder to extract than the version metadata.
    notes: >
      Trust evidence here is primarily company-authored. It is useful for gating diligence
      conversations, but not a substitute for NDA access to audit reports, policies, and test
      summaries.
    claimRefs:
      - CE031
