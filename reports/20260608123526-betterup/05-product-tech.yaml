    title: Product architecture map
    type: stack
    layout: standard
    summary: >
      Public BetterUp materials describe a five-layer stack that links enterprise signals, human
      coaches, AI coaching, and measurable performance outputs.
    data:
      layers:
        - label: Employee and manager surfaces
          description: Web, mobile, Teams, Viva, Slack, and email-linked touchpoints
          detail: BetterUp meets users in the systems they already use for work and development.
        - label: Signal and identity layer
          description: HCM, feedback, role, location, and milestone data
          detail: Workday, SAP, and related systems determine who should receive support and when.
        - label: Personalization engine
          description: Identify-style logic, assessments, matching, AI coaching, and product-specific journeys
          detail: The platform decides support type, timing, and context using organizational and individual data.
        - label: Human delivery layer
          description: One-on-one, specialist, group, Ready, and executive coaching programs
          detail: Human coaches remain the escalation path and high-stakes support layer.
        - label: Measurement and governance layer
          description: PAD analytics, ROI reporting, encryption, privacy controls, and AI guardrails
          detail: BetterUp links development activity to outcomes while promising confidentiality and safety controls.
    claimRefs:
