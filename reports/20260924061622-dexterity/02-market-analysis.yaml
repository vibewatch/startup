chapter:
  number: 2
  title: Market Analysis
  summary: Dexterity sits in the warehouse and logistics automation market, where labor shortages and hard-to-automate workflows create real demand but sizing remains evidence-constrained. The category is attractive, yet the reachable share depends on integration complexity, safety, and whether task-specific fixed automation wins the simplest cases.
sections:
- id: market-boundary
  title: Market boundary and substitutes
  body: 'Dexterity should be analyzed inside warehouse and logistics automation, with the narrowest practical boundary being high-friction material handling: truck loading, unloading, palletizing, depalletizing, singulation, and sortation. That boundary excludes consumer robots, generic industrial arms used in highly structured lines, and pure software workflows. The real substitutes are manual labor, conveyor or fixed automation, and narrower task-specific robots. Public evidence from Dexterity, Dematic, and Robot Report all points in the same direction: the buyer is trying to automate hard physical workflows that are expensive to staff, safety-sensitive, and often too variable for fixed automation alone. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are decision-relevant and not yet publicly resolved. This chapter also treats public estimates conservatively and separates company
    claims from third-party estimates. The open questions are deliberate because they are decision-relevant and not yet publicly resolved.'
  claimRefs:
  - CM001
  - CM002
  - CM005
  - CM006
  tableRefs:
  - TM001
- id: sizing-and-drivers
  title: Sizing lenses and adoption drivers
  body: 'A single broad TAM estimate is not enough for Dexterity because the value proposition depends on facility type, task mix, deployment complexity, and whether the customer is a parcel carrier, 3PL, retailer, or manufacturer. The better approach is evidence-constrained sizing: count addressable facilities, estimate labor-substitution value, and then adjust for integration and uptime constraints. Public sources consistently highlight labor shortages, parcel growth, and the demand for safer automation as the key pull factors. Those drivers make the category commercially real even without a perfect market-size estimate, but they do not eliminate the need to prove repeatable deployment economics. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are decision-relevant and not yet publicly resolved. This chapter also treats public estimates conservatively and separates company claims
    from third-party estimates. The open questions are deliberate because they are decision-relevant and not yet publicly resolved.'
  claimRefs:
  - CM003
  - CM004
  - CM007
  - CM011
  tableRefs:
  - TM002
  - TM003
- id: adoption-frictions
  title: Adoption constraints and diligence gaps
  body: 'The main adoption brakes are implementation complexity, safety certification, integration with existing warehouse systems, and the risk that the easiest use cases get commoditized by fixed automation or cheaper robots. Technical research on dexterous manipulation shows that the underlying problem is still active and hard, which supports the need for specialized vendors but also signals that the field is still evolving quickly. For underwriting, that means the market is attractive but still noisy: the right question is not whether automation demand exists, but what share Dexterity can capture before capital intensity and competition compress returns. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are decision-relevant and not yet publicly resolved. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open
    questions are deliberate because they are decision-relevant and not yet publicly resolved.'
