chapter:
  number: 5
  title: Product & Technology
  summary: Dexterity ships a production Physical AI stack for logistics workflows, centered on Foresight, Mech, and task-specific manipulation systems. The product looks real and differentiated, but the technical moat depends on repeatable deployment, safety, and the ability to scale beyond bespoke integration.
sections:
- id: product-definition
  title: Product definition and workflow fit
  body: 'Dexterity is best understood as a production robotics platform that fits into warehouse and logistics workflows. The company is not selling a point tool or a single demo robot; it is selling a stack that handles truck loading, unloading, palletizing, sortation, and other repetitive material-handling tasks. The product story is simple but important: software plus robot plus deployment service. That combination matters because enterprise buyers do not just want a machine, they want a workflow that can be installed, operated, and improved inside an existing facility without forcing a full redesign. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are decision-relevant and not yet publicly resolved. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are decision-relevant
    and not yet publicly resolved.'
  claimRefs:
  - CE001
  - CE002
  - CE011
  tableRefs:
  - TE001
  - TE003
- id: architecture-and-deployment
  title: Architecture, deployment, and support
  body: 'Public sources describe Dexterity as a full-stack system that mixes software orchestration, vision, tactile sensing, and hardware integration. Dematic’s partnership language reinforces that the product is meant to be bundled into larger automation projects rather than sold as a standalone gadget. Third-party coverage also points to production deployments and compliance-oriented language, which is a better sign than purely aspirational robotics marketing. The main technical question is scalability: can Dexterity keep the engineering footprint low enough that each new site looks more like repeatable deployment and less like bespoke systems integration? This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are decision-relevant and not yet publicly resolved. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open
    questions are deliberate because they are decision-relevant and not yet publicly resolved.'
  claimRefs:
  - CE003
  - CE004
  - CE007
  - CE010
  tableRefs:
  - TE002
- id: trust-safety-and-differentiation
  title: Trust, safety, and differentiation
  body: 'Dexterity’s most credible differentiation is narrow but meaningful: it appears to be one of the few companies with visible production use in hard logistics tasks at meaningful scale. The company leans heavily on a safety-first narrative, including claims of zero incidents and RIA 15.06 compliance. That narrative is valuable, but it is still mostly company- and partner-supplied. Meanwhile, open-source manipulation research and new academic dexterity projects show that the underlying technical problem remains active and contested. In other words, the product looks real and differentiated, but the moat depends on continuing to out-execute a very hard engineering problem. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are decision-relevant and not yet publicly resolved. This chapter also treats public estimates conservatively and separates company claims from third-party
    estimates. The open questions are deliberate because they are decision-relevant and not yet publicly resolved.'
