chapter:
  number: 7
  title: Risks
  summary: Dexterity has visible safety, capital, partner, and competition risks, but they are legible rather than hidden. The main question is whether the company can keep producing safe, repeatable deployments fast enough to outrun capital intensity and commoditization pressure.
sections:
- id: top-risks
  title: Top risks and why they matter
  body: Dexterity's most important risks are not mysterious. Safety, capital intensity, partner dependence, and commoditization are all visible in public sources. The company claims zero incidents and references compliance standards, which helps, but those claims still need to be read as company-level assertions. The financing history shows repeated large rounds, so continued access to capital matters. And the market is crowded enough that better-funded rivals or incumbents could compress pricing. The thesis is therefore less about hidden blowups and more about execution discipline in a hard, expensive category. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are decision-relevant and not yet publicly resolved. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are decision-relevant
    and not yet publicly resolved. This chapter also treats public estimates conservatively and separates company claims from third-party estimates.
  claimRefs:
  - CR001
  - CR002
  - CR004
  - CR009
  - CR010
  tableRefs:
  - TR001
- id: regulatory-operational-risk
  title: Regulatory, operational, and technical risk
  body: Regulatory and operational risk are intertwined here because warehouse robots live in real facilities with real people. The public safety story is encouraging, but a single incident could create outsized reputational and procurement consequences. On the technical side, recent open-source dexterity research and new robotic-hand projects show that the field is moving fast, which is good for adoption but bad for any company that assumes technical differentiation will stay static. Dexterity has mitigations — partner deployment, focused use cases, and safety language — but none of them erase the need for excellent field execution. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are decision-relevant and not yet publicly resolved. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate
    because they are decision-relevant and not yet publicly resolved. This chapter also treats public estimates conservatively and separates company claims from third-party estimates.
  claimRefs:
  - CR001
  - CR005
  - CR007
  - CR011
  tableRefs:
  - TR002
  - TR003
- id: capital-partner-and-thesis-break
  title: Capital, partner, and thesis-break risk
  body: 'The most practical risk is capital dependence. Robotics businesses often need repeated financing before margin quality is obvious, and Dexterity is no exception. A slower capital market or a weaker operating metric set could force dilution or a slower deployment cadence. Partner concentration is also real because channel and strategic relationships are doing a lot of work in the public narrative. The thesis-break trigger should therefore be straightforward: if the company cannot maintain safe production deployments while proving repeatable economics, the investment case weakens quickly. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are decision-relevant and not yet publicly resolved. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are decision-relevant and
    not yet publicly resolved. This chapter also treats public estimates conservatively and separates company claims from third-party estimates.'
