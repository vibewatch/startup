company:
  name: Dexterity
chapter:
  number: 1
  title: Company Overview
  summary: Dexterity is a late-stage private Physical AI robotics company with strong production proof, deep logistics partnerships, and a still-opaque financial base. Public evidence now points to a 2026 funding and valuation step-up, but audited revenue, margin, and concentration remain undisclosed.
sections:
- id: identity-and-model
  title: Identity, Product, and Business Model
  body: 'Dexterity is a Redwood City robotics company founded in 2017 by Samir Menon. Its public positioning is now firmly around enterprise Physical AI: robots, models, and orchestration software that automate warehouse and logistics tasks rather than a general-purpose AI platform. The company''s own site emphasizes human-like dexterity, under-400ms decision speed, and production use rather than demos. The product story is centered on truck loading, unloading, palletizing, sortation, and other high-friction material-handling jobs that are difficult to automate with conventional industrial robotics. Dexterity appears to monetize these deployments as a managed, long-lived enterprise service rather than a one-time hardware sale.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  tableRefs:
  - TO001
- id: leadership-and-milestones
  title: Leadership, Funding, and Milestones
  body: 'Menon remains the public face of the company, and the company''s About page continues to anchor the founder-market-fit story in Stanford robotics research. The public milestone arc is clear: stealth exit in 2020, a large 2021 Series B, first enterprise deployment in 2022, Japan expansion and partnership activity in 2024, and a 2025 step-up in public valuation. In 2026, Dexterity pushed the Foresight world-model narrative and continued to frame expansion through major logistics customers and a Japan vehicle with Sumitomo. That sequence matters because it shows a progression from research credibility to a production footprint that now spans multiple geographies and customer types.'
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO010
  tableRefs:
  - TO002
  - TO003
  figureRefs:
  - FO001
- id: scale-and-remaining-gaps
  title: Scale Signals and Remaining Gaps
  body: The strongest public scale signals are the 100 million autonomous actions claim, repeated references to top-tier logistics customers, and the continued willingness of major investors and strategics to fund the business. At the same time, the most decision-relevant operating metrics are still opaque. Public sources disagree on total raised and valuation, and third-party directory data gives only a rough headcount estimate. There is no audited revenue, no disclosed gross margin, and no public customer concentration breakdown. For diligence, that means the company looks commercially real, but the underwriting lens should still treat private financial and contract details as unresolved.
  claimRefs:
  - CO003
  - CO004
  - CO008
  - CO009
  - CO011
  - CO012
