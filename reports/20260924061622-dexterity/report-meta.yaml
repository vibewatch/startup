  topStrengths:
    - Real production references with marquee logistics customers and partner-led deployments.
    - One of the few private physical-AI vendors with repeated public proof of scale and deployment cadence.
    - Strategic partner ecosystem around Dematic and Sumitomo expands distribution.
    - Clear problem definition in logistics automation with tangible labor-relief economics.
  topRisks:
    - Capital intensity and opaque financials still make the economics hard to underwrite.
    - Safety, compliance, and deployment reliability remain existential in enterprise robotics.
    - Competition from humanoid and task-specific automation could compress differentiation.
