companyProfile:
  summary: >-
    Dexterity is a Redwood City, California-based Physical AI company founded in 2017 by Samir Menon. It builds
    production robotics systems for warehouse and logistics workflows — especially truck loading, unloading,
    palletizing, and sortation — and sells them as managed deployments for enterprise customers. The company's public
    moat is production proof: multi-site logistics references, a large autonomous-action count, and a growing partner
    ecosystem around Foresight, Mech, and related manipulation systems. However, the financial surface is still thin, so
    the investment case rests on operational credibility rather than disclosed profitability.
