evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: financials
    missingEvidence: Audited revenue, gross margin, and contract concentration
    whyItMatters: Those inputs drive underwriting and are still missing from public sources.
    diligencePath: Request management financials and customer schedule in the next diligence round.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: sizing
    missingEvidence: A public, directly comparable TAM or SAM for Dexterity’s exact wedge
    whyItMatters: Valuation and go-to-market sizing remain less precise without a clean market-study anchor.
    diligencePath: Pull a direct market report or public procurement dataset in the next refresh.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Public pricing and realized deployment economics for Dexterity and its closest rivals
    whyItMatters: The competitor comparison remains partly qualitative without contract-level pricing.
    diligencePath: Collect customer procurement evidence or quote sheets in a later refresh.
    relatedQuestionRefs:
      - QP003
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: gross margin
    missingEvidence: Audited gross margin, contribution margin, and contract tenor
    whyItMatters: Those figures determine whether the RaaS model actually compounds cash.
    diligencePath: Request a management financial pack or diligence data room.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: architecture
    missingEvidence: Full model-training, inference, and integration API documentation
    whyItMatters: The technical moat is hard to score without a public architecture diagram.
    diligencePath: Request a technical deep-dive and deployment architecture packet.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Renewal rates, NRR/GRR, customer concentration, and contract length
    whyItMatters: These are necessary to know whether the customer base is durable or brittle.
    diligencePath: Ask for customer cohort, renewal, and concentration data.
    relatedQuestionRefs:
      - QU004
      - QU005
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: minor
    topic: Named customer proof table
    missingEvidence: A fuller set of named customer contracts and retention evidence
    whyItMatters: The proof table is only partial without a larger customer ledger.
    diligencePath: Ask for a customer list and renewal/cohort view.
    relatedTableRefs:
