  - type: access-blocked
    severity: material
    topic: supplier
    missingEvidence: No public disclosure of the full supply chain, insurance, or customer contract terms
    whyItMatters: Risk severity is harder to score without vendor and liability detail.
    diligencePath: Request supplier and insurance diligence materials.
    relatedQuestionRefs:
