chapter:
  number: 4
  title: Financials
  summary: Dexterity appears to monetize through RaaS-style deployments and services, but public financial visibility remains thin. The company has credible scale signals and large financing rounds, yet revenue, margin, and capital-conversion quality are still not disclosed in a way that supports precise underwriting.
sections:
- id: revenue-model
  title: Revenue model and monetization
  body: Dexterity looks more like a managed robotics operator than a pure hardware vendor. Its public materials and third-party coverage point to RaaS-style deployments in which the company installs, maintains, and improves robots over time while the customer pays for ongoing service value. That structure should create better revenue visibility than one-off hardware sales, but it also means billing is likely tied to uptime, deployment readiness, and long contract cycles. The key underwriting question is not whether customers will pay for automation; it is how much of the economics remain with Dexterity after hardware, service, and support costs are deducted. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are decision-relevant and not yet publicly resolved. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open
    questions are deliberate because they are decision-relevant and not yet publicly resolved.
  claimRefs:
  - CI001
  - CI002
  - CI009
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: capital-and-operations
  title: Capital intensity and operating structure
  body: The company's financing history suggests a capital-intensive model. Multiple large rounds, including the 2025 $95 million mark and the 2026 funding tracked by Tracxn, indicate that investors still expect meaningful R&D and deployment spend. That is consistent with a robotics business where hardware, integration, and service delivery all front-load cash before recurring revenue ramps. The model can work, but it generally needs either strong customer prepayments, very efficient deployments, or regular access to follow-on capital. Public evidence does not show which of those three is doing most of the work here. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are decision-relevant and not yet publicly resolved. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are
    decision-relevant and not yet publicly resolved.
  claimRefs:
  - CI003
  - CI004
  - CI010
  - CI012
  tableRefs:
  - TI003
- id: financial-gaps
  title: Financial gaps and diligence implications
  body: The biggest financial gap is not whether Dexterity can sell; it is whether the business generates enough margin and cash conversion to self-fund growth. Third-party directory estimates suggest sizable revenue, but those estimates conflict and are not audited. The company has not disclosed gross margin, working capital, or contract concentration, so the path to contribution margin is still unresolved. For valuation work, that means the right answer is not a precise spreadsheet. The right answer is a cautious range, a clear view of financing dependence, and a willingness to update the thesis if public or management-supplied financials improve. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are decision-relevant and not yet publicly resolved. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions
    are deliberate because they are decision-relevant and not yet publicly resolved.
