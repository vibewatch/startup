chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Dexterity is a Redwood City robotics company founded in 2017 by Samir Menon. Its public positioning is now
              firmly around enterprise Physical AI: robots, models, and orchestration software that automate warehouse
              and logistics tasks rather than a general-purpose AI platform. The company's own site emphasizes
              human-like dexterity, under-400ms decision speed, and production use rather than demos. The product story
              is centered on truck loading, unloading, palletizing, sortation, and other high-friction material-handling
              jobs that are difficult to automate with conventional industrial robotics. Dexterity appears to monetize
              these deployments as a managed, long-lived enterprise service rather than a one-time hardware sale.
