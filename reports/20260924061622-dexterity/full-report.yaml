      - number: '2.3'
        title: Adoption constraints and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The main adoption brakes are implementation complexity, safety certification, integration with existing
              warehouse systems, and the risk that the easiest use cases get commoditized by fixed automation or cheaper
              robots. Technical research on dexterous manipulation shows that the underlying problem is still active and
              hard, which supports the need for specialized vendors but also signals that the field is still evolving
              quickly. For underwriting, that means the market is attractive but still noisy: the right question is not
              whether automation demand exists, but what share Dexterity can capture before capital intensity and
              competition compress returns. This chapter also treats public estimates conservatively and separates
