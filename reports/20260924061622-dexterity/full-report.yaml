            body: >-
              Menon remains the public face of the company, and the company's About page continues to anchor the
              founder-market-fit story in Stanford robotics research. The public milestone arc is clear: stealth exit in
              2020, a large 2021 Series B, first enterprise deployment in 2022, Japan expansion and partnership activity
              in 2024, and a 2025 step-up in public valuation. In 2026, Dexterity pushed the Foresight world-model
              narrative and continued to frame expansion through major logistics customers and a Japan vehicle with
              Sumitomo. That sequence matters because it shows a progression from research credibility to a production
              footprint that now spans multiple geographies and customer types.
