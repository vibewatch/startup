        blocks:
          - type: paragraph
            body: >-
              Dexterity looks more like a managed robotics operator than a pure hardware vendor. Its public materials
              and third-party coverage point to RaaS-style deployments in which the company installs, maintains, and
              improves robots over time while the customer pays for ongoing service value. That structure should create
              better revenue visibility than one-off hardware sales, but it also means billing is likely tied to uptime,
              deployment readiness, and long contract cycles. The key underwriting question is not whether customers
              will pay for automation; it is how much of the economics remain with Dexterity after hardware, service,
              and support costs are deducted. This chapter also treats public estimates conservatively and separates
