              The company's financing history suggests a capital-intensive model. Multiple large rounds, including the
              2025 $95 million mark and the 2026 funding tracked by Tracxn, indicate that investors still expect
              meaningful R&D and deployment spend. That is consistent with a robotics business where hardware,
              integration, and service delivery all front-load cash before recurring revenue ramps. The model can work,
              but it generally needs either strong customer prepayments, very efficient deployments, or regular access
              to follow-on capital. Public evidence does not show which of those three is doing most of the work here.
