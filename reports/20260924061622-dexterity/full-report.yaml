    sections:
      - number: '3.1'
        title: Competitive landscape
        blocks:
          - type: paragraph
            body: >-
              Dexterity is not competing against a single peer set. The buyer can choose manual labor, fixed automation,
              integrators, or robotics vendors that focus on adjacent manipulation tasks. Independent sources mention
              Covariant and RIOS as neighbors in the manipulation stack, while profile pages and funding coverage place
              Figure and Apptronik in the broader physical-AI race. Dexterity's niche is narrower: warehouse and
              logistics workflows that need flexibility more than a humanoid brand. That narrower focus helps the
              company, but it also means the category is easy to compare with cheaper or more established automation
              options. This chapter also treats public estimates conservatively and separates company claims from
