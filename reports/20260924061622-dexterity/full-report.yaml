      - number: '3.3'
        title: Moat durability and commoditization risk
        blocks:
          - type: paragraph
            body: >-
              The durability question is whether Dexterity can stay specialized long enough to preserve a lead before
              the market gets absorbed into larger automation stacks. The answer is not obvious. Public funding coverage
              shows that capital is flowing into physical AI and humanoid robotics broadly, so the competitive field is
              getting more crowded rather than less. That does not make Dexterity weak; it means the company must keep
              proving deployment speed, reliability, and customer value in tasks that incumbents still struggle to
              automate. In other words, the moat is real but not permanent. This chapter also treats public estimates
