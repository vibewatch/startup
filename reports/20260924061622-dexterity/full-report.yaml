      - number: '7.3'
        title: Capital, partner, and thesis-break risk
        blocks:
          - type: paragraph
            body: >-
              The most practical risk is capital dependence. Robotics businesses often need repeated financing before
              margin quality is obvious, and Dexterity is no exception. A slower capital market or a weaker operating
              metric set could force dilution or a slower deployment cadence. Partner concentration is also real because
              channel and strategic relationships are doing a lot of work in the public narrative. The thesis-break
              trigger should therefore be straightforward: if the company cannot maintain safe production deployments
              while proving repeatable economics, the investment case weakens quickly. This chapter also treats public
              estimates conservatively and separates company claims from third-party estimates. The open questions are
              deliberate because they are decision-relevant and not yet publicly resolved. This chapter also treats
              public estimates conservatively and separates company claims from third-party estimates. The open
              questions are deliberate because they are decision-relevant and not yet publicly resolved. This chapter
