  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Dexterity should be analyzed inside warehouse and logistics automation, with the narrowest practical
              boundary being high-friction material handling: truck loading, unloading, palletizing, depalletizing,
              singulation, and sortation. That boundary excludes consumer robots, generic industrial arms used in highly
              structured lines, and pure software workflows. The real substitutes are manual labor, conveyor or fixed
              automation, and narrower task-specific robots. Public evidence from Dexterity, Dematic, and Robot Report
              all points in the same direction: the buyer is trying to automate hard physical workflows that are
              expensive to staff, safety-sensitive, and often too variable for fixed automation alone. This chapter also
              treats public estimates conservatively and separates company claims from third-party estimates. The open
              questions are deliberate because they are decision-relevant and not yet publicly resolved. This chapter
              also treats public estimates conservatively and separates company claims from third-party estimates. The
