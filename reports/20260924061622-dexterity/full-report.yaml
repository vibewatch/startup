            body: >-
              Dexterity is best understood as a production robotics platform that fits into warehouse and logistics
              workflows. The company is not selling a point tool or a single demo robot; it is selling a stack that
              handles truck loading, unloading, palletizing, sortation, and other repetitive material-handling tasks.
              The product story is simple but important: software plus robot plus deployment service. That combination
              matters because enterprise buyers do not just want a machine, they want a workflow that can be installed,
              operated, and improved inside an existing facility without forcing a full redesign. This chapter also
