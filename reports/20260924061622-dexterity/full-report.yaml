  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Dexterity has one of the strongest public production stories in physical AI: real
              enterprise deployments, marquee logistics customers, and a product stack tuned to hard warehouse
              workflows. The anti-thesis is equally real: the company remains capital intensive, financially opaque, and
              exposed to a competitive field that is getting louder and better funded. That combination usually points
              to a good company that may still be a difficult investment at the wrong price. So the valuation question
              is not whether Dexterity matters; it is whether the current entry point leaves enough margin for the
              unknowns. This chapter also treats public estimates conservatively and separates company claims from
              third-party estimates. The open questions are deliberate because they are decision-relevant and not yet
              publicly resolved. This chapter also treats public estimates conservatively and separates company claims
              from third-party estimates. The open questions are deliberate because they are decision-relevant and not
              yet publicly resolved. This chapter also treats public estimates conservatively and separates company
              claims from third-party estimates.
            claimRefs:
              - CV001
              - CV002
              - CV003
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV010
      - number: '8.2'
        title: Current valuation context and comps
        blocks:
          - type: paragraph
            body: >-
              The March 2025 $1.65 billion mark is the cleanest public price anchor, and later directory data keeps the
              company in the same ballpark. But that mark is not the same thing as a complete valuation model. Public
              revenue and margin data are missing, so any multiple-based view is only a rough check. Because this is a
              robotics business with heavy deployment and hardware obligations, the more useful comparison set is
              robotics, automation, and physical-AI names rather than pure software software comps. The key question is
              whether the public evidence justifies a premium multiple despite the capital intensity. This chapter also
              treats public estimates conservatively and separates company claims from third-party estimates. The open
              questions are deliberate because they are decision-relevant and not yet publicly resolved. This chapter
              also treats public estimates conservatively and separates company claims from third-party estimates. The
              open questions are deliberate because they are decision-relevant and not yet publicly resolved. This
              chapter also treats public estimates conservatively and separates company claims from third-party
              estimates.
