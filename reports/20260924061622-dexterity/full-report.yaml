              real people. The public safety story is encouraging, but a single incident could create outsized
              reputational and procurement consequences. On the technical side, recent open-source dexterity research
              and new robotic-hand projects show that the field is moving fast, which is good for adoption but bad for
              any company that assumes technical differentiation will stay static. Dexterity has mitigations — partner
