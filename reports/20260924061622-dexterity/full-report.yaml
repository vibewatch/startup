        title: Sizing lenses and adoption drivers
        blocks:
          - type: paragraph
            body: >-
              A single broad TAM estimate is not enough for Dexterity because the value proposition depends on facility
              type, task mix, deployment complexity, and whether the customer is a parcel carrier, 3PL, retailer, or
              manufacturer. The better approach is evidence-constrained sizing: count addressable facilities, estimate
              labor-substitution value, and then adjust for integration and uptime constraints. Public sources
              consistently highlight labor shortages, parcel growth, and the demand for safer automation as the key pull
              factors. Those drivers make the category commercially real even without a perfect market-size estimate,
              but they do not eliminate the need to prove repeatable deployment economics. This chapter also treats
              public estimates conservatively and separates company claims from third-party estimates. The open
