      - number: '8.3'
        title: 情景推演、触发因素与投资建议
        blocks:
          - type: paragraph
            body: >-
              基准情景是部署继续增长，但仍需外部融资。乐观情景是公司持续拿下物流标杆客户，并把这些订单转化为可复制的经济效益。悲观情景则是融资周期放缓、毛利改善不及预期，或竞争迫使公司调整方向。综合来看，现阶段更适合跟踪观察，而非积极买入：公司的运营验证优于多数非上市机器人企业，但公开财务信息仍不足以支撑高确信度投资。若利润率、客户集中度和合同质量披露改善，投资判断可能随之改变。本章谨慎对待公开估算，区分公司说法与第三方估算；所列未决问题均与决策相关，且尚未公开解决。
