            body: >-
              最现实的风险是依赖外部资金。机器人公司往往要持续融资，直到毛利水平和质量明朗；Dexterity
              也不例外。融资环境转冷或运营指标走弱，都可能迫使公司接受股权稀释或放慢部署。伙伴集中度风险也很现实，渠道和战略合作在公司公开叙事中占据重要位置。若公司无法在确保生产部署安全的同时证明单位经济性可复制，投资逻辑就会迅速走弱。本章审慎处理公开估算，将公司说法与第三方估算分开看。未决问题均与投资决策直接相关，公开信息尚未给出答案。本章审慎处理公开估算，将公司说法与第三方估算分开看。未决问题均与投资决策直接相关，公开信息尚未给出答案。本章对公开估算数据保持审慎，并将公司口径与第三方估算严格区隔。
