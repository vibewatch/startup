            body: >-
              Dexterity 的差异化范围不大，却有实际分量：在难度极高的物流任务中，它似乎是少数已有一定规模生产应用的公司之一。公司着重强调安全优先，包括宣称零事故并符合 RIA 15.06
              标准。这些说法有价值，但目前主要来自公司和合作伙伴。与此同时，开源灵巧操作研究与学界的新机械手项目表明，底层技术难题仍在快速演进，竞争也很激烈。产品看起来确有差异化，但能否守住优势，仍取决于公司能否持续攻克这道工程难题。本章审慎处理公开估算，将公司说法与第三方估算分开看。未决问题均与投资决策直接相关，公开信息尚未给出答案。本章审慎处理公开估算，将公司说法与第三方估算分开看。未决问题均与投资决策直接相关，公开信息尚未给出答案。
