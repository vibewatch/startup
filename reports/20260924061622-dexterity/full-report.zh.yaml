        title: 收入模式与商业化变现
        blocks:
          - type: paragraph
            body: >-
              Dexterity 更像托管型机器人运营商，而非单纯的硬件供应商。其公开资料与第三方报道都指向类似 RaaS
              的模式：公司安装、维护机器人并持续改进，客户为持续服务付费。这通常比一次性硬件销售更能稳定收入，但账单很可能取决于设备开机率、部署进度和较长的合同周期。投资判断的关键不是客户是否愿意为自动化付费，而是扣除硬件、运维和支持成本后，Dexterity
              还能留下多少收益。本章谨慎对待公开估算，区分公司说法与第三方估算；所列未决问题均与决策相关，且尚未公开解决。
