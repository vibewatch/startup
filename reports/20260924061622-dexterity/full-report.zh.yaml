    sections:
      - number: '6.1'
        title: 客户客群与部署类型
        blocks:
          - type: paragraph
            body: >-
              Dexterity
              似乎主要面向重视吞吐量、人工替代和站点可靠性的大型物流、快递、零售及制造运营商。托管式机器人正适合这类客户：人工成本高或招工困难时，部署的回报更容易算清。公开材料显示，公司服务的是大型企业而非中小企业（SMB）；渠道同样关键，因为诸如
              Dematic
              这样的伙伴能帮助公司触达更大的现有客户群。目标客户不只由行业决定，也取决于设施规模和自动化程度。本章审慎处理公开估算，将公司说法与第三方估算分开看。未决问题均与投资决策直接相关，公开信息尚未给出答案。本章审慎处理公开估算，将公司说法与第三方估算分开看。未决问题均与投资决策直接相关，公开信息尚未给出答案。本章对公开估算数据保持审慎，并将公司口径与第三方估算严格区隔。
