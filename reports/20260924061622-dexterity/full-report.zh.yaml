  - id: TV002
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设条件
      - 含义
      - 下行触发条件
    rows:
      - - 乐观
        - 拿下更多部署订单、披露更充分、毛利稳健
        - 估值能守住或进一步抬升
        - N/A
      - - 基准
        - 保持增长，但资金需求依然高企
        - 维持观察
        - 交付推进平稳但偏慢
      - - 悲观
        - 融资放缓、竞争压低定价、财务模型持续不透明
        - 估值倍数收缩
        - 融资遇阻或执行走样
    notes: 公开财务披露不完整，因此情景区间仅作定性推演。
    claimRefs:
      - CV002
      - CV003
      - CV007
      - CV008
      - CV012
  - id: TV003
    title: 投资逻辑与反向逻辑表
    columns:
      - 论点
      - 何种变化会改变观点
      - 影响
    rows:
