        title: 竞争全景
        blocks:
          - type: paragraph
            body: >-
              Dexterity 面对的并非单一竞争对手群体。买方的选择涵盖人工劳动力、固定自动化设备、系统集成商，以及聚焦相邻操作任务的机器人厂商。独立来源将 Covariant 和 RIOS
              列为机器人操作领域的相邻公司，而企业概况与融资报道则将 Figure 和 Apptronik 置于更宽泛的 Physical AI 竞争版图中。Dexterity
              的切入点更聚焦：它瞄准重视灵活性的仓储物流任务；在这些场景里，灵活性比人形机器人形态更重要。聚焦有助于公司建立优势，也让买方更容易将其与成本更低或更成熟的自动化方案比较。本章谨慎对待公开估算，区分公司说法与第三方估算；所列未决问题均与决策相关，且尚未公开解决。
