              这家非上市机器人公司的公开具名客户案例相当扎实。FedEx、UPS、GXO、Sagawa Express、Kawasaki Heavy Industries
              以及一家全球食品制造商都出现在公开记录中，公司官网也用客户证言强调生产应用。不过，公开信息仍不足以还原完整客户名册；客户总数、活跃站点数和续约情况均未知。因此，更稳妥的判断是：公司有真实的标杆客户和生产案例，但关系能否持续，仍需管理层披露或直接向客户求证。本章审慎处理公开估算，将公司说法与第三方估算分开看。未决问题均与投资决策直接相关，公开信息尚未给出答案。本章审慎处理公开估算，将公司说法与第三方估算分开看。未决问题均与投资决策直接相关，公开信息尚未给出答案。本章对公开估算数据保持审慎，并将公司口径与第三方估算严格区隔。
