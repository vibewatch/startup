        - 置信度下降
      - - 财务透明度极低
        - 若出现经审计的收入与利润率数据
        - 置信度上升
      - - 估值偏高
        - 若估值回落或增速大幅加快
        - 入场条件改善
    notes: 本表补充了乐观 / 基准 / 悲观情景表，重点关注决策触发条件。
    claimRefs:
      - CV002
      - CV003
      - CV011
      - CV012
