  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 核心风险及其影响
        blocks:
          - type: paragraph
            body: >-
              Dexterity
              公司的主要风险都摆在台面上：安全、资本密集、伙伴依赖和产品同质化。公司宣称零事故并援引合规标准，这些仍是公司自己的说法。多轮大额融资也意味着持续获得资金至关重要；竞争又很激烈，资金更充裕的对手或传统厂商可能压低价格。投资判断的关键不是防范难以察觉的突发事件，而是看公司能否在高难度、高投入的赛道里稳健执行。本章审慎处理公开估算，将公司说法与第三方估算分开看。未决问题均与投资决策直接相关，公开信息尚未给出答案。本章审慎处理公开估算，将公司说法与第三方估算分开看。未决问题均与投资决策直接相关，公开信息尚未给出答案。本章对公开估算数据保持审慎，并将公司口径与第三方估算严格区隔。
