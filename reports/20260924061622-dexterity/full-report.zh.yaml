      - number: '7.2'
        title: 监管、运营与技术风险
        blocks:
          - type: paragraph
            body: >-
              仓储机器人要在真实库房里与员工协作，因此监管和运营风险交织在一起。公开的安全情况令人鼓舞，但一次事故就可能造成远超事故本身的声誉损失和采购阻碍。开源灵巧操作研究和新型机械手项目显示，技术演进很快：这有利于行业采纳，却也说明技术优势不会静止不变。Dexterity
              可借助伙伴部署、聚焦特定用例和安全方面的表述降低风险，但最终仍要靠现场执行。本章审慎处理公开估算，将公司说法与第三方估算分开看。未决问题均与投资决策直接相关，公开信息尚未给出答案。本章审慎处理公开估算，将公司说法与第三方估算分开看。未决问题均与投资决策直接相关，公开信息尚未给出答案。本章对公开估算数据保持审慎，并将公司口径与第三方估算严格区隔。
