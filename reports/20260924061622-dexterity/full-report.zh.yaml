companyProfile:
  summary: >-
    Dexterity 总部位于加州 Redwood City，由 Samir Menon 于 2017 年创立，是一家 Physical AI
    公司。它为仓储物流任务打造生产级机器人系统，重点覆盖卡车装卸、码垛和分拣，并以托管部署方式服务企业客户。公司的公开护城河来自实际生产验证：多站点物流案例、大量自主操作记录，以及围绕 Foresight、Mech
    等操作机器人系统建立的伙伴生态。不过，公司披露的财务信息仍有限，投资逻辑依靠的是运营可信度，而非已公开的盈利能力。
