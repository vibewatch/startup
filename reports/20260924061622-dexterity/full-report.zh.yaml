        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              投资逻辑的核心，在于 Dexterity 拥有 Physical AI
              领域最有说服力的公开生产案例之一：企业级部署已经落地，有标杆物流客户，产品技术栈也针对高难度仓储任务调优。反面论据同样成立：公司资本密集、财务不透明，赛道声势渐大，竞争者资金也更充裕。合在一起看，公司本身不错，但价格不合适时，投资仍可能很难做。估值的关键不在于
              Dexterity
              是否有价值，而在于当前价格能否为未知风险留出足够的安全边际。本章审慎处理公开估算，将公司说法与第三方估算分开看。未决问题均与投资决策直接相关，公开信息尚未给出答案。本章审慎处理公开估算，将公司说法与第三方估算分开看。未决问题均与投资决策直接相关，公开信息尚未给出答案。本章对公开估算数据保持审慎，并将公司口径与第三方估算严格区隔。
