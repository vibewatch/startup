              年落地首个企业级部署，2024 年进军日本市场并展开伙伴合作，2025 年公开估值再度抬升。进入 2026 年，Dexterity 进一步强化 Foresight 世界模型叙事，并借助大型物流客户以及与
              Sumitomo 在日本设立的合作实体推进业务扩张。这条演进脉络表明，公司已从研究背书走向跨区域、跨客户类型的实际生产部署。
