  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              分析
              Dexterity，应放在仓储与物流自动化市场中看；更窄且实际的范围，是卡车装载、卸车、码垛、拆垛、单件分离与分拣等难以自动化的物料搬运任务。该范围排除了消费级机器人、高度结构化产线上的通用工业机械臂以及纯软件工作流。真正的替代方案是人工劳动力、输送线或固定自动化设备，以及更专一的单一任务机器人。来自
              Dexterity、Dematic 和 Robot Report
              的公开证据一致表明：买方旨在将高难度物理工作流自动化，这类工序人力成本昂贵、对安全高度敏感，且多变性往往超出单纯固定自动化设备的处理能力。本章审慎处理公开估算，将公司说法与第三方估算分开看。未决问题均与投资决策直接相关，公开信息尚未给出答案。本章审慎处理公开估算，将公司说法与第三方估算分开看。未决问题均与投资决策直接相关，公开信息尚未给出答案。
