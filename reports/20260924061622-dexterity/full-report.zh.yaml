chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Dexterity 于 2017 年由 Samir Menon 在 Redwood City 创立，是一家机器人公司。如今，公司明确主打企业级 Physical
              AI：以机器人、模型和编排软件自动化仓储物流作业，而非打造通用 AI 平台。官网突出三点：接近人类的灵巧操作、低于 400ms
              的决策速度，以及真实生产部署而非演示。产品聚焦卡车装卸、码垛、分拣等传统工业机器人难以自动化的物料搬运任务。Dexterity 似乎主要靠长期托管式企业服务变现，而非一次性硬件销售。
