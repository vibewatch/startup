      - number: '8.2'
        title: 当前估值背景与可比标的
        blocks:
          - type: paragraph
            body: >-
              2025 年 3 月的 $1.65B
              估值记录是公开层面最明确的价格锚点，此后的数据目录也基本维持在同一区间。但这一定价并不等同于完整的估值模型。鉴于公开的收入与利润率数据缺失，任何基于估值倍数的视角都只能作为粗略参考。作为一家部署和硬件交付负担都很重的机器人企业，更有参考价值的对照组应是机器人、自动化与
              Physical AI
              标的，而非纯软件可比公司。核心问题在于：即便资本密集度居高不下，现有公开证据能否支撑其享有溢价倍数。本章审慎处理公开估算，将公司说法与第三方估算分开看。未决问题均与投资决策直接相关，公开信息尚未给出答案。本章审慎处理公开估算，将公司说法与第三方估算分开看。未决问题均与投资决策直接相关，公开信息尚未给出答案。本章对公开估算数据保持审慎，并将公司口径与第三方估算严格区隔。
