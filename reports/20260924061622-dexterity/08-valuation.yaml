- id: scenarios-and-recommendation
  title: Scenarios, triggers, and recommendation
  body: 'A reasonable base case is continued deployment growth with ongoing financing needs. The bull case is that the company keeps winning marquee logistics customers and converts those wins into repeatable economics. The bear case is a slower capital cycle, weaker margin conversion, or competitive pressure that forces a reset. On balance, the right stance is track rather than aggressive buy: the operating proof is better than most private robotics companies, but the public financial surface is still too thin to underwrite a high-conviction entry. More disclosure on margin, customer concentration, and contract quality would move the call. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are decision-relevant and not yet publicly resolved. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate
