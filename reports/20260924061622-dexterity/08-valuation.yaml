- id: valuation-context
  title: Current valuation context and comps
  body: The March 2025 $1.65 billion mark is the cleanest public price anchor, and later directory data keeps the company in the same ballpark. But that mark is not the same thing as a complete valuation model. Public revenue and margin data are missing, so any multiple-based view is only a rough check. Because this is a robotics business with heavy deployment and hardware obligations, the more useful comparison set is robotics, automation, and physical-AI names rather than pure software software comps. The key question is whether the public evidence justifies a premium multiple despite the capital intensity. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are decision-relevant and not yet publicly resolved. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are decision-relevant
    and not yet publicly resolved. This chapter also treats public estimates conservatively and separates company claims from third-party estimates.
