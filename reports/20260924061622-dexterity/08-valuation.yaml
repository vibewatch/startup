  title: Valuation
  summary: 'Dexterity is one of the more credible physical-AI robotics companies in public view, but the current price still depends on a lot of private information the market cannot see. The right call is constructive but cautious: track the name, and wait for better financial disclosure or a more obvious valuation reset before getting aggressive.'
sections:
- id: thesis-and-antithesis
  title: Thesis and anti-thesis
  body: 'The thesis is that Dexterity has one of the strongest public production stories in physical AI: real enterprise deployments, marquee logistics customers, and a product stack tuned to hard warehouse workflows. The anti-thesis is equally real: the company remains capital intensive, financially opaque, and exposed to a competitive field that is getting louder and better funded. That combination usually points to a good company that may still be a difficult investment at the wrong price. So the valuation question is not whether Dexterity matters; it is whether the current entry point leaves enough margin for the unknowns. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are decision-relevant and not yet publicly resolved. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because
