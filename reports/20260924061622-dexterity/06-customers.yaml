chapter:
  number: 6
  title: Customers
  summary: Dexterity has meaningful named-customer proof for a private robotics company, including logistics giants and partner-led deployments. The main open questions are not whether customers exist, but how concentrated the base is and how durable the contracts are once deployment economics are fully exposed.
sections:
- id: customer-segmentation
  title: Customer segments and deployment types
  body: Dexterity appears to sell to large logistics, parcel, retail, and manufacturing operators that care about throughput, labor substitution, and site-level reliability. That is the right customer wedge for a managed robotics business because the buyer can justify deployment when manual labor is expensive or hard to staff. Public materials suggest the company works with enterprise operators rather than SMBs, and the channel story matters because a partner like Dematic can accelerate access to a broader installed base. In other words, the customer segment is not just an industry; it is a facility scale and automation-intensity profile. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are decision-relevant and not yet publicly resolved. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate
    because they are decision-relevant and not yet publicly resolved. The chapter also treats public estimates conservatively and separates company claims from third-party estimates.
  claimRefs:
  - CU001
  - CU003
  - CU009
  tableRefs:
  - TU001
- id: named-customer-proof
  title: Named customer proof and adoption depth
  body: The named-customer evidence is actually fairly strong for a private robotics company. FedEx, UPS, GXO, Sagawa Express, Kawasaki Heavy Industries, and a global food manufacturer are all named somewhere in the public record, and the company's own site uses testimonials to reinforce production use. That said, the evidence stops short of a full customer ledger. We do not have customer counts, active-site counts, or renewal stats. So the right read is that the company has real logos and production references, but the durability of those relationships still needs management disclosure or more direct customer proof. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are decision-relevant and not yet publicly resolved. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are
    decision-relevant and not yet publicly resolved. The chapter also treats public estimates conservatively and separates company claims from third-party estimates.
  claimRefs:
  - CU002
  - CU004
  - CU010
  tableRefs:
  - TU002
- id: retention-and-concentration
  title: Retention, expansion, and concentration risk
  body: Because the company does not disclose retention or concentration, the diligence question shifts to inference. A small logo set with several named enterprise references suggests concentration risk is likely still meaningful, even if the accounts are large and strategic. At the same time, the channel partnership model could improve expansion if implementation becomes standardized enough to scale through integrators. The key is whether the customer story is broadening into repeatable deployments or staying dependent on a handful of flagship accounts. That distinction matters more here than raw logo count. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are decision-relevant and not yet publicly resolved. This chapter also treats public estimates conservatively and separates company claims from third-party estimates. The open questions are deliberate because they are decision-relevant
    and not yet publicly resolved. The chapter also treats public estimates conservatively and separates company claims from third-party estimates.
