- id: mitigations-kill-criteria
  title: Mitigations exist, but the kill criteria are still more public than operational
  body: 'There are real mitigants in the record. o9 is not a stealth product with no deployments: it has credible case studies, a visible partner ecosystem, customer-review momentum, and repeated analyst-recognition claims. The 2023 financing round also suggests that existing investors were willing to support continued growth at a premium valuation. Those points reduce the probability that the company is structurally broken. They do not, however, remove the need for tight monitoring. The right investment posture is to treat residual risk as something that must be observed in a few crisp ways: no injunction or damaging discovery from the SAP case, no evidence that implementations are stalling relative to category alternatives, no worsening employee-friction signals that degrade delivery, and no prolonged inability to explain AI outputs, governance, and pricing power in buyer terms. In other words, the mitigations are commercially visible, but the operating controls behind them still need
    diligence-room verification before residual risk should be scored as low.'
