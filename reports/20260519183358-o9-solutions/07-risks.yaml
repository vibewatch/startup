- id: people-dependency-competition
  title: People, partner, and category crowding risks are manageable but easy to underestimate
  body: 'The people and dependency signals are weaker than the lawsuit evidence, but they still matter because they influence delivery quality. Dealroom’s public profile suggests a globally distributed workforce with a heavy India concentration, which is good for scale but harder to manage consistently across enterprise deployments. Blind and archived Glassdoor material are low-confidence sources, yet they still suggest the usual warning signs of a fast-scaling software company: work pressure, morale questions, and at least some layoff chatter. On the dependency side, o9’s partner network is a strength only if it keeps expanding implementation capacity without reducing quality control. The category context also looks less forgiving than vendor marketing implies. SAP, Oracle, RELEX, Infor, and Anaplan all market AI-enabled planning suites, and Oracle explicitly frames the space as a multi-vendor comparison. That means generic claims about AI-powered planning are becoming table stakes. o9
    still has momentum, but commoditization risk is rising precisely when enterprise buyers are demanding faster ROI and clearer proof.'
