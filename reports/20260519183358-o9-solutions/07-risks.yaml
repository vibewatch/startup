  evidenceGaps:
  - type: missing-source
    severity: material
    topic: customer concentration and renewal visibility
    missingEvidence: Named current customer concentration, renewal, or churn evidence for top accounts and partner-led deployments.
    whyItMatters: Without concentration and renewal proof, it is hard to tell whether reference logos represent durable recurring value or one-off transformation work.
    diligencePath: Request cohort retention, top-customer revenue share, partner-vs-direct implementation mix, and at least three referenceable expansion case studies dated 2025–2026.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs: []
  - type: private-evidence-only
    severity: material
    topic: burn and gross-margin risk
    missingEvidence: Audited current revenue, gross margin, burn, and cash-balance information tied to delivery intensity and AI-product spend.
    whyItMatters: Financial opacity can turn a manageable execution challenge into an underwriting problem if services intensity or AI investment is eroding margin.
    diligencePath: Request audited 2024–2025 financials, services mix, implementation gross margin, and budgeted AI-compute or model-development spend.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs: []
  - type: private-evidence-only
    severity: minor
    topic: mitigation maturity and operator controls
    missingEvidence: Management-level artifacts showing litigation response, implementation playbooks, AI-governance controls, and formal kill-threshold governance.
    whyItMatters: Public sources identify the risks, but they do not prove that internal controls are mature enough to keep residual exposure falling.
    diligencePath: Request legal-response workstreams, deployment QA checklists, model-governance SOPs, and board-level risk-monitoring packs.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR005
  - type: enumeration-incomplete
    severity: minor
    topic: Regulatory / legal risk register coverage
    missingEvidence: A fuller public or management-provided inventory of all regulatory, privacy, and contractual disputes affecting o9’s AI and planning products.
    whyItMatters: The legal register here is intentionally partial and focused on the highest-salience public items, so hidden issues could still change residual risk.
    diligencePath: Request a complete legal, privacy, and regulator-correspondence schedule with outside-counsel commentary and current status for every open matter.
    relatedQuestionRefs: []
    relatedTableRefs:
    - TR001
