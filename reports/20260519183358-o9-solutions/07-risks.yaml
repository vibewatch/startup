- id: implementation-model-risk
  title: Implementation and model risk are the next-order constraints
  body: 'o9 has enough customer proof to show the product is real, but the retained sources also show why execution risk remains material. The platform is positioned as a broad Digital Brain with an Enterprise Knowledge Graph that spans supply chain, finance, procurement, sales, customers, and suppliers. That breadth is commercially attractive, yet it almost always comes with heavy data alignment, workflow redesign, and change management. Third-party materials from valantic, Marelli, and IPROS all point toward transformation-style deployments rather than lightweight plug-ins. Lokad adds the sharper adverse critique: the platform looks credible as a broad planning environment, but its mathematical depth and inspectability are not especially transparent in public evidence. That matters more now that o9 is expanding composite-agent and GenAI capabilities into cross-functional planning. If buyers cannot audit how recommendations are generated, or if implementations remain long and partner-dependent,
    the product’s marketed differentiation can convert into a delivery and governance burden rather than a pricing advantage.'
  claimRefs:
  - CR009
  - CR010
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
  - CR019
  - CR027
  tableRefs:
