- id: capital-adequacy-financing-dependency-and-underwriting-blockers
  title: Capital adequacy, financing dependency, and underwriting blockers
  body: 'The near-term capital story is directionally positive but still incomplete. The company executed
    an up-round in July 2023, which suggests access to supportive capital even in a tougher financing
    market, and multiple databases agree that total raised is roughly in the mid-$500 million range. That
    lowers the probability of acute near-term financing stress. Yet it does not solve the underwriting
    problem because no retained public source discloses current cash, monthly burn, debt headroom, or
    runway. Nor do retained sources show gross margin, NRR, or customer concentration. The late-2025 SAP
    lawsuit adds a further variable: even if the case ultimately favors o9, litigation can still absorb
    time and money while the company remains privately opaque. My financial verdict is therefore mixed.
    Revenue quality may be attractive if the platform truly expands across functions, and investor support
    appears real, but financing dependency still cannot be fully bounded without direct liquidity and
    efficiency data from management. In other words, the latest funding round reduces immediate distress risk,
    but it does not eliminate the need for a full data-room style cash, debt, and efficiency review before
    any serious valuation conclusion. Investors can justify further diligence, but not a high-confidence
    underwriting memo, from public evidence alone. More disclosure is still required.'
