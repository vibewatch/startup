  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash and burn disclosure
    missingEvidence: Current cash on hand, monthly burn, debt headroom, and management runway assumptions.
    whyItMatters: Capital adequacy cannot be underwritten without direct liquidity and burn information.
    diligencePath: Request CFO cash bridge, monthly burn history, debt agreements, and 18-month base/bear
      runway model.
    relatedQuestionRefs:
    - QI014
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: unit economics
    missingEvidence: Gross margin, NRR, CAC, CAC payback, and cohort expansion by customer segment.
    whyItMatters: Revenue quality and the path to durable profitability hinge on whether recurring revenue
      expands efficiently.
    diligencePath: Request audited P&L detail, cohort retention schedules, and board-level sales-efficiency
      reporting.
    relatedQuestionRefs:
    - QI015
    relatedTableRefs:
    - TI003
  - type: missing-source
    severity: material
    topic: realized pricing
    missingEvidence: Signed customer orders or a current pricing book that show platform fees, module
      add-ons, discounts, and services mix.
    whyItMatters: Without realized pricing evidence, monetization analysis stays at the level of platform
      breadth rather than cash yield per customer.
    diligencePath: Collect at least five recent customer quotes or order forms across customer sizes and
      geographies.
    relatedQuestionRefs:
    - QI003
    relatedTableRefs:
    - TI002
  - type: conflicting-data
    severity: material
    topic: public revenue and headcount estimates
    missingEvidence: A company-confirmed ARR or revenue figure and a verified current employee count.
    whyItMatters: Public databases disagree so widely that valuation multiples and productivity ratios
      move materially depending on which source is used.
    diligencePath: Request management-certified ARR, GAAP revenue, and headcount as of quarter-end.
    relatedQuestionRefs:
    - QI009
    - QI017
    relatedTableRefs:
    - TI005
