- id: public-traction-conflicting-estimates-and-unit-economics-gaps
  title: Public traction, conflicting estimates, and unit-economics gaps
  body: Public traction signals are encouraging but uneven. o9’s 2023 financing materials point to 55%
    ARR growth as of Q2 2023 and a still-higher 67% as of Q1 2023. The 2025 Gartner-related release shows
    strong customer sentiment with 94% willingness to recommend and a 4.8/5 rating, while third-party
    databases try to fill the private-company disclosure gap with revenue, sales-rep, and headcount estimates.
    The problem is that those estimates do not line up cleanly. GetLatka says revenue hit $157.5 million
    in 2024 and that the business had 3.3 thousand employees in late 2025; CompWorth points to more than
    3,500 employees and a revenue-per-employee ratio that implies a much higher revenue base; FreightWaves
    cites about 2,500 employees and 17 offices. That spread is too wide for comfort. It means unit-economics
    work remains mostly an exercise in identifying missing fields—gross margin, NRR, CAC, payback, and
    realized pricing—rather than confirming a trustworthy public operating model. Public comps such as Kinaxis
    and Manhattan are useful precisely because they show how much disclosure is still missing at o9; they
    bound the category, but they cannot repair the underlying opacity of the company itself.
