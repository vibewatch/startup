callouts:
- calloutType: risk
  title: The biggest financial fact is missing financial facts
  body: o9’s public story is rich on platform breadth, customer outcomes, and fundraising validation,
    but thin on the metrics that actually underwrite a private software company. No retained source gives
    cash, burn, gross margin, NRR, or realized pricing. That forces any serious diligence process back
    to management-provided data.
  claimRefs:
  - CI014
  - CI029
  - CI030
  - CI043
- calloutType: insight
  title: Conflicting public estimates are themselves a disclosure signal
  body: The spread between GetLatka, CompWorth, FreightWaves, Tracxn, and CB Insights is not just a data-cleaning
    nuisance. It is evidence that the market cannot triangulate o9 cleanly from public information, which
    means valuation work is highly sensitive to whichever unofficial denominator an analyst picks.
  claimRefs:
  - CI005
  - CI006
  - CI008
  - CI009
  - CI010
  - CI011
  - CI041
