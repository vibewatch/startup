- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Public maturity / status
  - Differentiation signal
  - Diligence gap
  rows:
  - - Digital Brain platform
    - Enterprise planning leaders and cross-functional operators
    - Established umbrella platform
    - Unified decision layer across planning and execution rather than single-function tooling
    - Public surfaces describe the concept well but not the exact module boundaries or pricing structure
  - - Enterprise Knowledge Graph
    - Data, planning, and transformation teams
    - Core technical substrate
    - Digital twin of enterprise data, relationships, and constraints used as shared memory and context
    - No public white-box documentation on graph schema design, optimization semantics, or developer tooling depth
  - - Cross-domain planning applications
    - Supply chain, commercial, and finance teams
    - Live and broadening
    - Supports demand, supply, revenue, product, and financial planning on one platform
    - Need a cleaner public map of which workflows are mature, standard, or heavily services-led
  - - AI and agentic layer
    - Planners, analysts, and managers
    - Live but still early in public proof
    - Predictive, prescriptive, generative, atomic-agent, and composite-agent story all tied to same foundation
    - Named production outcomes for the newest agentic features are still sparse in public sources
  - - Partner-led implementation layer
    - Transformation offices and SI-led program teams
    - Live ecosystem
    - Formal partner network plus SI evidence from valantic across multiple industries
    - Delivery quality appears partner-dependent and not fully standardized in public evidence
  - - APEX operating model
    - Executive sponsors and operating-model owners
    - Newer 2026 framing
    - Agile, Adaptive, and Autonomous Planning and Execution links strategy to governed automation
    - APEX positioning is fresh and compelling, but public adoption evidence is still limited
  - - Analyst recognition surface
    - Procurement, strategy, and software selection teams
    - Strong external positioning
    - Top-five use-case rankings and multiple Gartner-linked recognitions support breadth claims
    - Direct Gartner documents are licensed; public pages are still company-mediated summaries
  notes: Rows summarize the major product assets and operating surfaces explicitly named across current official, partner, and independent sources as of 2026-05-19; this is not a contractual SKU list.
