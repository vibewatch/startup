- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role in operating model
  - Key dependency
  - Technical risk
  rows:
  - - Internal and external data layer
    - Feeds operational, commercial, financial, and ecosystem signals into the planning substrate
    - Customer data access, partner feeds, and data quality
    - Data breadth is central to the product thesis, but public documentation does not expose source-by-source integration depth
  - - Enterprise Knowledge Graph
    - Turns raw data into contextual knowledge and an enterprise digital twin
    - Coherent data modeling and graph maintenance
    - Public evidence confirms importance, but not the exact schema design or graph-governance mechanics
  - - AI and optimization layer
    - Runs prediction, trade-off analysis, simulation, and natural-language interactions
    - Model quality, explainability, and domain logic
    - Independent public evidence remains thinner than the vendor narrative for optimization and inspectability
  - - Atomic and composite agents
    - Automate multistep cross-functional analysis and recommendations
    - Recipe quality, feedback loops, and LLM orchestration
    - Feature story is fresh and plausible, but customer-proven production maturity is still early in public sources
  - - Application and workflow layer
    - Exposes domain workflows such as demand planning, supplier collaboration, scheduling, and commercial planning
    - Reusable templates and domain-specific configurations
    - Module breadth may increase implementation complexity and services dependence
  - - API and modular extension layer
    - Allows new algorithms, new use cases, and new data sources to be added without replatforming
    - Stable interfaces and implementation-partner competence
    - Developer-facing public surfaces are still limited compared with the scale of the extensibility claim
  - - Cloud deployment and control layer
    - Runs on major clouds across geographies and business units
    - Cloud-provider availability and enterprise operating discipline
    - Public pages emphasize scale, but do not publish detailed resiliency, sovereignty, or certification architecture
  notes: Architecture layers are synthesized from current official product pages, partner implementation language, and independent commentary rather than from a single public engineering diagram.
