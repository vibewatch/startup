- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow problem
  - o9 workflow
  - Measurable benefit / evidence
  - Known limitation
  rows:
  - - Cross-functional planning
    - Demand, supply, revenue, and financial plans run sequentially in silos
    - Use the Digital Brain to connect plans and decisions on one cross-domain substrate
    - Official pages repeatedly position o9 as an end-to-end planning and execution platform
    - Public sources do not break out where cross-domain orchestration is productized versus services-configured
  - - Forecast and scenario analysis
    - Teams cannot explain plan-versus-actual deviations fast enough
    - Use EKG plus GenAI and composite agents to compare outcomes, diagnose variance, and run post-game analysis
    - April and July 2024 releases specifically describe post-game and forecast-analysis workflows
    - Most proof remains company-authored rather than independently benchmarked
  - - Operational balancing
    - Volatile inputs make static monthly planning too slow
    - Combine predictive and prescriptive AI with scenario simulation to recompute plans and trade-offs
    - AI innovation page claims forecast and optimization gains plus faster decision support
    - Quantitative gains are company-claimed and not broken out by module or customer
  - - Supplier and ecosystem collaboration
    - Upstream and downstream decisions are fragmented across organizations
    - Extend Digital Brain logic to customers, suppliers, and partner-led implementations
    - Official and partner pages both emphasize multi-enterprise connectivity and end-to-end transparency
    - Exact connector list, support boundaries, and supplier-collaboration configuration details stay private
  - - Governed automation
    - Humans cannot manually review every exception at enterprise scale
    - Use APEX and agentic capabilities to move from human-in-loop oversight toward progressively automated workflows
    - 2026 APEX release and AI pages describe governed autonomy and faster recomputation
    - Public proof of touchless production usage remains lighter than the strategic narrative
  notes: Benefit cells mix company-claimed, partner-described, and press-covered evidence. Where quantitative outcomes are absent, the benefit reflects workflow improvement direction rather than audited ROI.
