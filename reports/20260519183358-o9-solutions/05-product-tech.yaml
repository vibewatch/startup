- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / signal
  - Status
  - Scope
  - Gap
  rows:
  - - Explainability by design
    - Explicitly claimed
    - AI page says neural AI is grounded in enterprise logic for causal root-cause analysis
    - No public methodology paper or benchmark proving explainability quality
  - - Role-based access and auditability
    - Explicitly claimed
    - AI page states role-based access, auditability, and policy controls
    - No linked public certification package or architecture note on how controls map to modules
  - - Flexible autonomy
    - Explicitly claimed
    - Official pages say workflows can range from human-in-the-loop to touchless execution
    - No detailed public guardrail catalog for when automation is permitted or blocked
  - - Cloud-native deployment
    - Explicitly claimed
    - Digital Brain page says o9 runs natively on major clouds and scales across geographies and business units
    - Public resiliency, sovereignty, and compliance specifics remain high-level
  - - Partner implementation discipline
    - Real but indirect
    - Partner ecosystem and valantic evidence show structured implementation support
    - Customer outcomes still depend heavily on SI quality and private transformation design
  - - Technical transparency and legal noise
    - Material risk signal
    - Lokad criticizes inspectability while SAP litigation highlights architecture and roadmap sensitivity
    - Neither issue proves product weakness on its own, but both increase diligence burden
  notes: This table separates explicit public control statements from independently validated security or compliance proof. The largest gap is depth of externalized evidence, not absence of enterprise-control language.
