  evidenceGaps:
  - type: missing-source
    severity: material
    topic: security and compliance detail
    missingEvidence: Independent certification documents or detailed public security architecture that map access controls, auditability, and policy enforcement to concrete o9 product modules.
    whyItMatters: Enterprise buyers can hear the control language today, but still cannot verify module-level control maturity and compliance scope from public evidence alone.
    diligencePath: Request current SOC, ISO, regional sovereignty, and model-governance materials plus product-level security architecture documentation during diligence.
    relatedQuestionRefs:
    - QE020
  - type: missing-source
    severity: material
    topic: developer-facing technical documentation
    missingEvidence: Public API references, release-note archives, SDK documentation, or admin guides that show how extensibility works in practice.
    whyItMatters: The product story leans on APIs and modularity, but public technical proof remains thinner than the strategic claim.
    diligencePath: Request sandbox access, API docs, admin runbooks, and partner implementation artifacts that show actual extension patterns.
    relatedQuestionRefs:
    - QE021
  - type: private-evidence-only
    severity: material
    topic: agentic AI production outcomes
    missingEvidence: Named customer case studies showing composite agents or APEX workflows operating in production with measurable benefits and guardrail evidence.
    whyItMatters: The newest AI story could be commercially important, but the public record still looks earlier and more roadmap-shaped than the core planning platform.
    diligencePath: Request three current customer references using composite agents or APEX, including operational metrics, governance controls, and failure cases.
    relatedQuestionRefs:
    - QE025
