  - type: missing-source
    severity: material
    topic: market-share-opacity
    missingEvidence: Third-party market-share, win-rate, and pricing-realization data versus SAP, Oracle, RELEX, Blue Yonder, Kinaxis, and other peers.
    whyItMatters: Without validated share and win-rate data, it is difficult to translate category growth into o9-specific competitive capture assumptions.
    diligencePath: Request independent analyst-share tables, internal win-loss data, and recent RFP outcome summaries segmented by competitor.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM005
  - type: enumeration-incomplete
    severity: material
    topic: sam-som-precision
    missingEvidence: A management-backed SAM and SOM bridge that avoids double counting between SCP, decision intelligence, and AI overlay categories.
    whyItMatters: Broad external TAM lenses are helpful, but they are too coarse to underwrite precise o9-specific share assumptions.
    diligencePath: Request management's market model with boundary definitions, segment weights, and current penetration by vertical and geography.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
