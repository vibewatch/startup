- id: sizing-and-demand-drivers
  title: Sizing lenses, growth rates, and demand drivers
  body: 'The strongest public numeric lens is the broad SCM software market, not an o9-specific planning-only carve-out. Mordor places SCM software at $36.39 billion in 2026 and $56.01 billion by 2031, while MarketsandMarkets frames the same broad market at $38.51 billion in 2025 and $58.42 billion by 2030. A second, faster-growing lens comes from AI in supply chain, where MarketsandMarkets projects a move from $13.93 billion in 2025 to $50.41 billion by 2032. Those figures support the core market conclusion: planning budgets are expanding, but the expansion is being pulled by digital transformation, regulatory traceability, volatility, and AI integration rather than by old visibility-only narratives. Nucleus adds an important qualitative layer by saying buyers now prioritize scenario modeling and contingency planning in real time. For o9 specifically, that means the most relevant valuation lens is not the entire SCM stack but the planning-heavy slice where resilience, cross-functional coordination,
    and enterprise-context AI matter most. The rough range bands in this chapter therefore narrow the broad TAM toward a planning-first opportunity while explicitly preserving uncertainty.'
