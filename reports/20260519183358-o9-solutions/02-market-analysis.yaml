    severity: material
    topic: implementation-economics
    missingEvidence: Public benchmarks for implementation cost, time-to-value, and payback by segment or deployment complexity.
    whyItMatters: ROI expectations are central to buying decisions, but public vendor pages emphasize success anecdotes more than distributional economics.
    diligencePath: Collect customer interviews, procurement records, or neutral implementation benchmarks by buyer type and deployment scope.
