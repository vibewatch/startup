    type: funnel
    layout: standard
    summary: >-
      Public evidence funnel moving from broad technology-footprint counts to a much smaller set of quantified customer
      stories and retention-quality signals.
    approximationNotes: >-
      The funnel counts public evidence surfaces, not actual commercial conversion stages. It is designed to show proof
      quality compression, not to estimate o9 win rates.
