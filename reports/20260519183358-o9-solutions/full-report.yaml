  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category definition
        blocks:
          - type: paragraph
            body: >-
              o9 sits inside the supply chain planning category, but public materials show that the company's real
              market boundary is broader than classic demand or supply planning alone. Solutions Review's summary of
              Gartner defines supply chain planning as technology that manages, aligns, collaborates, and shares
              planning data across the extended supply chain, while ARC expands the practical scope to end-to-end
              transformation, inventory optimization, network design, agility, and resilience. o9 pushes the category
              wider still by emphasizing enterprise planning and decisioning across supply chain, finance, procurement,
              and sales. That makes generic collaboration tools, spreadsheets, and execution-only software status-quo
              substitutes rather than direct peers, while suite vendors such as SAP, Oracle, Infor, Manhattan, and
              e2open become adjacent substitutes because they bundle planning into larger SCM stacks. The result is a
              boundary problem that matters for diligence: the nearer the category stays to planning-centric suites and
              IBP workflows, the more relevant it is to o9's core offering; the more it expands toward full-suite SCM,
              the more the TAM inflates but loses specificity.
