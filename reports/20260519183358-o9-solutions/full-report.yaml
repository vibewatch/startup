    title: Risk heatmap
    type: matrix
    layout: standard
    summary: >-
      Heatmap places the SAP dispute, implementation burden, and AI transparency at the highest residual-severity
      corner; culture and capital-access risks remain material but secondary.
    approximationNotes: Matrix positions are editorial synthesis from retained public evidence rather than numerical probabilities.
    data:
