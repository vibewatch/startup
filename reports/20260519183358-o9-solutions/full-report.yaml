  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform scope, Digital Brain foundation, and module breadth
        blocks:
          - type: paragraph
            body: >-
              o9 does not present itself as a single-point planning tool. The current public product story is a
              cross-domain operating platform that ties together supply chain, revenue, product, and financial planning
              on one Digital Brain foundation. The strongest evidence is the combination of the Digital Brain page, the
              AI innovation page, the industries page, and the 2025-2026 Gartner-linked releases, all of which repeat
              the same architectural thesis: o9 wants the enterprise to work from a shared digital representation of
              data, relationships, constraints, and decision logic rather than from disconnected plans. That matters
              because it explains why the same product surface now spans demand planning, supply planning, commercial
              planning, supplier collaboration, production scheduling, revenue growth management, and P&L-oriented
              workflows. In other words, module breadth is real, but it is best understood as one configurable planning
              substrate applied across many use cases rather than as a cleanly separated SKU family with deeply public
              technical documentation for each module.
