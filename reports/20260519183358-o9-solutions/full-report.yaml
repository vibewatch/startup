  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization breadth
        blocks:
          - type: paragraph
            body: >-
              The retained public evidence supports a software-led revenue model built around a broad enterprise
              planning platform, not a single planning SKU. General Atlantic calls o9 a supply chain planning SaaS
              provider, while the company’s own Digital Brain and homepage materials present one planning-and-execution
              layer spanning supply chain, demand, revenue, product, and financial decisions. That framing matters
              financially because it implies multiple expansion paths inside one account: land with planning, then add
              adjacent decision workflows or decision-intelligence use cases. However, the same retained sources stop
              short of providing the monetization detail investors actually need. No simple public list-price grid is
              visible, no module-level revenue mix is disclosed, and no realized ACV or discount structure is shown. So
              the correct financial reading is ‘wide monetization surface with opaque unit pricing,’ not ‘fully visible
              software economics.’ Put differently, the public record is good enough to support software breadth and
              monetization optionality, but not good enough to model realized contract yield or to separate subscription
              economics from services and support burden. That distinction is important because broad platform scope can
              still coexist with mediocre realized pricing, heavy services drag, or slower-than-expected expansion
              inside installed accounts. The current public record simply does not resolve those trade-offs with
              confidence for investors just yet today.
