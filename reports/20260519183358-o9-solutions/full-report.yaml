      - number: '8.4'
        title: Final diligence asks and exit readiness
        blocks:
          - type: paragraph
            body: >-
              o9 could still become an excellent eventual public-market or late-stage private asset, but the current
              public record is not yet IPO-grade. The missing pieces are not cosmetic. Investors need audited revenue
              and margin, retention quality, customer concentration, services intensity, and the current cap-table and
              preference stack. Public comps disclose those items through annual filings and quarterly reporting, which
              is why their multiples can be interpreted with more confidence. o9 does not have to be public today to
              merit investment, but new money at a multibillion-dollar mark should still demand a private-room
              equivalent of that disclosure standard. Until that information is available, the right action implication
              is not to walk away permanently but to refuse false precision. Stay engaged, build a diligence plan around
              revenue quality and terms, and require enough disclosure that the recommendation can move because evidence
              improved, not because enthusiasm did.
