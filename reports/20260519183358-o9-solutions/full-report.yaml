              risk remains material. The platform is positioned as a broad Digital Brain with an Enterprise Knowledge
              Graph that spans supply chain, finance, procurement, sales, customers, and suppliers. That breadth is
              commercially attractive, yet it almost always comes with heavy data alignment, workflow redesign, and
              change management. Third-party materials from valantic, Marelli, and IPROS all point toward
