        title: Operating scale and public milestones
        blocks:
          - type: paragraph
            body: >-
              Operating scale is directionally clear but not perfectly transparent. Public sources support the idea that
              o9 is a large, globally distributed private software company with meaningful enterprise reach, but they
              disagree on exact size. Dealroom shows 3,295 staff across 29 countries, CompWorth reports 3,500+ employees
              and 9% growth, while late-2025 lawsuit coverage uses a lower figure of more than 2,500 employees. That
