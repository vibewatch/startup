              remains the central public executive voice as co-founder and CEO, which creates a clear key-person
              dependence signal for diligence. The most concrete governance event in the public record is Gary Reiner
              joining the board in connection with the July 2023 financing, which suggests General Atlantic influence at
              the board level. Capital history is clearer than governance history. Multiple official, investor, and
              press sources converge on a $116 million July 2023 round at a $3.7 billion valuation led by BeyondNetZero
              / General Atlantic, with KKR and Generation Investment Management also participating. Database sources
              also show a January 2022 Series C of roughly $295 million at a $2.7 billion valuation and cumulative
              disclosed funding of about $536 million. The 2023 round was framed as existing investors doubling down,
              which reads more like continued conviction in the company than a distressed bridge.
