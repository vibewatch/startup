  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and IP risk now sits at the top of the stack
        blocks:
          - type: paragraph
            body: >-
              The single clearest risk in the public record is the SAP trade-secret dispute. It is not just another
              competitive complaint. The court filing, company statement, and multiple news reports all point to a
              detailed allegation set: named former executives, mass downloads of more than 20,000 files,
              customer-specific project material, and a theory that SAP used those materials to close product and
              go-to-market gaps in business planning. Even if o9 ultimately prevails, this kind of case can still
              consume leadership time, create discovery burden, slow sales conversations, and raise uncomfortable
              diligence questions about internal controls and employee off-boarding. The more important underwriting
              point is that the lawsuit is paired with a specific market context: SAP is trying to transition APO
              customers into IBP, while o9 has been winning in modern planning. That means the legal dispute is not
              isolated from commercial risk; it is intertwined with competitive positioning, customer confidence, and
              the credibility of o9’s technical moat.
