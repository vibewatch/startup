  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and peer classes
        blocks:
          - type: paragraph
            body: >-
              o9 does not compete inside a single tidy bucket. The retained evidence shows four overlapping ways a buyer
              can solve the same planning job. First are best-of-breed planning platforms such as Kinaxis and RELEX,
              plus Blue Yonder where independent market framings still treat it as a top-tier planning peer even though
              the current cached official page is not usable. Second are ERP-embedded incumbents such as SAP IBP and
              Oracle Supply Chain Planning, which package demand, supply, inventory, and S&OP capabilities inside
              broader enterprise stacks. Third are adjacent supply-chain networks or execution suites such as e2open and
              Manhattan Associates that can capture planning budgets from visibility, logistics, commerce, or
              fulfillment control points. Fourth is the status quo: spreadsheets, stitched tools, and internal workflow
              layers. That competitive structure matters because o9’s win condition is not simply ‘better forecasting’;
              it is persuading a large enterprise to replace fragmented decision systems with one integrated planning
              model. The category is therefore less about one-to-one feature parity and more about which vendor or
              internal stack becomes the operating layer for planning decisions. In buyer terms, the real alternative to
              o9 is often not another single SKU but a bundle of ERP modules, network tools, spreadsheets, and
              systems-integrator custom work.
