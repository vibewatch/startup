      - number: '2.4'
        title: Constraints, substitute pressure, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The bullish demand story does not remove important market constraints. Mordor explicitly notes
              cybersecurity concerns, legacy integration complexity, and total-cost-of-ownership scrutiny as adoption
              brakes, which fits what the substitute landscape shows: buyers can choose suite vendors, specialist
              planners, or execution-connected platforms depending on installed base and change appetite. For o9, the
              clearest adverse public signal is not a collapsing market but a skeptical product-quality lens. Lokad's
              April 2026 review credits o9 with real planning-suite breadth and serious platform substance, yet it still
              argues that the public record is much weaker on white-box probabilistic modeling, optimization semantics,
              and technical transparency. That critique matters because enterprise AI budgets increasingly depend on
              trust, explainability, and grounded enterprise context. A second constraint is market opacity itself. The
              public sources are good enough to define substitutes and broad TAM, but they do not disclose o9's precise
              SAM/SOM, market share, price realization, or repeatable win-rate data against SAP, Oracle, RELEX, and
              other peers. Those missing dimensions should remain live diligence asks rather than be backfilled with
              guesswork.
