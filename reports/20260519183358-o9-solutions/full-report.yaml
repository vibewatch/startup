      - number: '3.2'
        title: Capability, pricing, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              o9’s public materials consistently emphasize breadth: the Digital Brain is framed as a single planning and
              execution layer spanning supply chain, revenue, product, financial, procurement, customer, and supplier
              decisions. That is a broader cross-functional pitch than the retained SAP and Oracle pages, which focus
              more specifically on planning inside their broader SCM estates, and it is more architecture-forward than
              the retained RELEX, e2open, or Manhattan pages. But buyers do not decide on architecture alone. Kinaxis
              brings public-market credibility and strong orchestration language; RELEX markets 700-plus proven
              customers and clearly packaged retail depth; Anaplan and Manhattan surface quantified customer outcomes or
              public revenue data; and e2open markets multi-enterprise network scale. o9’s retained official pages, by
              contrast, do not expose a simple public price grid. That means the company can look strategically broad
              while still being harder to compare commercially than peers that publish clearer proof points,
              public-market metrics, or stronger ROI snippets. In practical procurement terms, o9 is asking buyers to
              trust a larger platform thesis with less publicly visible contract detail. That can work in large
              transformations, but it is a weaker position in cost-conscious or proof-hungry competitive evaluations.
