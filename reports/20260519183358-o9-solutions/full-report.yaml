      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The strongest public case for o9 is that it tries to unify planning categories that many rivals still
              describe separately. Enterprise Knowledge Graph language, neuro-symbolic AI, and the new composite-agent
              messaging all support a thesis that the company is building a reusable decision layer rather than a narrow
              point tool. Yet the moat is not cleanly settled. Independent analyst framing is mixed, with one 2024 view
              moving o9 down to Visionary while another 2025 framework still lists it among leaders. Lokad’s independent
              review acknowledges real product substance but explicitly warns that the public material does not fully
              substantiate the strongest AI claims. Most importantly, the SAP trade-secret dispute shows that incumbent
              response is no longer only commercial; it may also become legal and organizationally distracting. My read
              is that o9 has a credible differentiation story, but durability still depends on proving that integrated
              planning meaningfully beats incumbent bundling, adjacent network scale, and buyers’ demand for quantified
              public proof. Until o9 can pair its architecture story with more public pricing clarity, stronger
              third-party ROI evidence, or hard competitive win-rate data, the moat should be underwritten as promising
              but only moderately durable rather than unquestioned category dominance. That is a respectable position,
              but not yet a lock-in story for buyers.
