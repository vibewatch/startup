  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              o9 Solutions presents itself as a Dallas-area enterprise AI software company built around the Digital
              Brain, a cross-functional planning and decisioning platform rather than a single planning point tool.
              Official materials consistently describe the product as connecting supply chain, revenue, P&L,
              procurement, finance, and adjacent decision-making workflows. The architectural centerpiece is the
              Enterprise Knowledge Graph, which company and partner sources describe as the data-and-logic layer that
              grounds the platform in enterprise context. That matters because the company is not selling a narrow
              forecasting module; it is selling a broad integrated planning system meant to unify data, users, and
              decisions across large enterprises. Public identity sources also emphasize founder continuity, customer
              focus, global teams, and a partner ecosystem that helps customers implement digital-transformation
              programs. Independent review coverage from Lokad broadly validates that o9 is a serious planning-suite
              vendor with real platform substance, even as it challenges the transparency of the underlying decision
              logic.
