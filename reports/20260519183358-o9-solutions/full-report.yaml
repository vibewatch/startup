companyProfile:
  summary: >-
    o9 Solutions is a Dallas-area private software company founded in 2009 that sells an AI-native planning and
    decisioning platform to large enterprises with complex supply chains. Its Digital Brain platform uses an Enterprise
    Knowledge Graph to connect data, constraints, and decision workflows across supply chain, commercial, and financial
    functions. The company last disclosed a $116 million July 2023 financing at a $3.7 billion valuation and has since
    continued to market itself as a Leader in supply chain planning and decision intelligence. Public customer evidence
    and partner commentary support that o9 is a real category asset, but audited financials and the exact current scale
    of the business remain private.
