              worldwide team language on the company website. Milestone-wise, the story is a clean public arc from 2009
              founding to late-stage funding rounds in 2022 and 2023, followed by continuing market activity in 2026 via
              media and ecosystem coverage. Revenue is less certain: a GetLatka estimate puts 2024 revenue at $157.5
              million, but that remains a third-party estimate, not an audited disclosure.
