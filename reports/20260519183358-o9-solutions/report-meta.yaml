  productSummary: >-
    o9's Digital Brain is a cloud-oriented enterprise planning and execution platform that connects
    demand, supply, revenue, product, procurement, and financial decisions through an Enterprise
    Knowledge Graph. The platform supports integrated business planning, scenario modeling,
    decision intelligence, and increasingly agentic / GenAI-assisted workflows through the APEX
    operating model.
  customerFocus: >-
    Large enterprises in consumer goods, retail, industrial manufacturing, automotive, life sciences,
    telecom, and adjacent sectors that need cross-functional planning and rapid scenario response.
  businessModel: >-
    Enterprise SaaS-style planning platform sold into large accounts, typically paired with complex
    implementation, integration, and change-management work delivered with partners and expansion
    across additional modules over time.
  stage: late-stage private
