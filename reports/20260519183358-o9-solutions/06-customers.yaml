- id: durability-concentration-and-implementation-risk
  title: Durability, concentration, and implementation complexity remain the main underwriting gaps
  body: 'The adverse case for o9 customers is not that public proof is fake; it is that the durability layer is still too opaque. The strongest critical signals are indirect. Lokad characterizes o9 as a real but configuration-heavy planning environment whose public proof is weaker on transparent quantitative mechanics. Blind provides only a thin employee-review surface, which is too weak for hard operational conclusions but is still not a clean support-quality endorsement. The lawsuit coverage raises a different kind of customer risk: Heise says o9 identified Henkel as a former top customer in the SAP dispute, while multiple articles say stolen files included customer-specific project information and pricing material. That underscores that some accounts are strategically important enough to matter in a competitive fight. Yet none of the current public sources provide clean NRR, GRR, churn, concentration by ARR, or regional revenue mix. Even the customer-story directories are curated libraries
    rather than live cohort disclosures. That leaves the key durability conclusion straightforward: o9 appears to have real enterprise traction, but concentration, retention, and implementation-complexity risk still need private diligence rather than public inference.'
