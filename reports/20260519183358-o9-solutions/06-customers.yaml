- id: named-customer-proof
  title: Named customer proof is strongest in automotive and conference-stage transformation stories
  body: 'The best named public proof in this cache is automotive. Marelli is the cleanest story because the article is detailed enough to show why o9 was selected, how the program started with a contained pilot, and how it scaled into a broader integrated planning program with 90% adoption and 24-month visibility into customer production programmes. The IPROS case adds harder operational numbers even though the customer is unnamed: forecast accuracy rose by ten percentage points, planner productivity improved by 15% to 25%, task automation improved, and decision cycles moved from monthly to weekly. Gartner Barcelona extends the proof set into conference-stage references rather than static case-study libraries. There, o9 says PepsiCo presented its IBP transformation and Toyota presented digital supplier collaboration, while Marelli and IVECO were also featured. Those are meaningful trust signals because they suggest referenceable production programs, not just logo walls. The limitation is
    that the public evidence is still concentrated in a handful of stories and does not yet give a balanced, fresh cross-section by vertical, buyer size, or renewal status.'
