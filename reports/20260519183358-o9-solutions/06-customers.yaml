  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: customer-count denominator
    missingEvidence: A reconciled live-customer count with definitions for direct customers, partner-delivered accounts, pilots, and technology-footprint matches.
    whyItMatters: Public adoption breadth is clear, but inconsistent counts prevent clean underwriting of market penetration or concentration.
    diligencePath: Request the current live-customer count, methodology notes, and a split between direct, partner-led, and inactive historical accounts.
    relatedQuestionRefs:
    - QU002
  - type: missing-source
    severity: blocking
    topic: retention and renewal metrics
    missingEvidence: Current NRR, GRR, churn, logo retention, and renewal timing by cohort or segment.
    whyItMatters: Without retention metrics, public customer breadth cannot be translated into durable commercial quality.
    diligencePath: Request three years of renewal and expansion cohorts, segmented by product family, geography, and top-customer tier.
    relatedQuestionRefs:
    - QU015
    - QU025
  - type: missing-source
    severity: material
    topic: concentration and account exposure
    missingEvidence: Top-customer concentration by ARR, region, and renewal date plus direct evidence on former top-customer churn or poaching outcomes.
    whyItMatters: The Henkel reference and account-specific litigation detail imply that a few accounts may matter disproportionately.
    diligencePath: Request top-10 customer concentration, active churn watchlist, and details on any strategic accounts involved in competitive migrations.
    relatedQuestionRefs:
    - QU017
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table coverage
    missingEvidence: A fuller set of fresh, named customer references outside automotive and conference-stage references, including deployment status and measurable outcomes.
    whyItMatters: The visible proof set is concentrated in a small number of stories and does not fully represent sector breadth or deployment maturity.
    diligencePath: Request at least five additional current reference customers across non-automotive verticals with outcome metrics and renewal context.
    relatedTableRefs:
    - TU003
    relatedQuestionRefs:
    - QU020
  - type: private-evidence-only
    severity: material
    topic: implementation duration and pilot-to-production conversion
    missingEvidence: Cohort data on how long o9 implementations take, what percent move from pilot to production, and where change-management bottlenecks appear.
    whyItMatters: Public case studies prove success is possible, but not how repeatable that success is across the full customer base.
    diligencePath: Request implementation-duration distributions, pilot-to-production conversion rates, and failed-project postmortems by vertical.
    relatedQuestionRefs:
    - QU018
    - QU023
