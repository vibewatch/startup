chapter:
  number: 6
  title: Customers
  summary: o9 Solutions clearly has real enterprise adoption, but the public customer picture is uneven. The strongest evidence comes from automotive proof points such as Marelli and the unnamed global parts-supplier implementation, plus conference-stage references to PepsiCo and Toyota. Broader footprint signals from Landbase, TheirStack, D CEO, Gartner-linked review pages, and customer-story directories support cross-vertical reach, yet they disagree on counts and say little about concentration, retention, or contract economics. The chapter-level conclusion is that adoption is real and multi-vertical, but public durability evidence still lags public logo breadth.
sections:
- id: segmentation-and-adoption-signals
  title: Customer segmentation signals are broad, but public counts are inconsistent
  body: 'The public customer picture starts with breadth rather than precision. o9’s own industry and analyst-linked pages say the platform spans more than 30 verticals and supports supply chain, revenue, and P&L planning, while Landbase and TheirStack both show wide technology footprints across manufacturing, retail, hospitals, professional services, consulting, and food or consumer-goods companies. D CEO adds a third signal by naming more than 200 companies on the platform, including PepsiCo, Kraft Heinz, L’Oréal, and Google. The problem is that these three count surfaces do not reconcile cleanly. Landbase reports 3,088 verified companies, TheirStack reports 1,675, and D CEO frames the user base as more than 200 named companies rather than a full install base. That divergence does not mean adoption is weak; it means public customer counts are derived from different methodologies and should not be treated as a clean ARR-quality denominator. The reliable takeaway is directional: o9 has meaningful
    enterprise penetration across many sectors, but public customer totals remain an evidence-quality problem rather than a solved metric.'
