  rows:
  - - Automotive and industrial manufacturing
    - 'Buyer: supply-chain or operations leadership; user: planners and plant teams; payer: central enterprise IT or transformation budget'
    - Marelli plus unnamed global automotive supplier, with planning, forecasting, and supplier-collaboration use cases
    - Strongest named and quantified proof in current cache
    - Strategically important because complex manufacturing validates core planning credibility
    - Public economics and renewal rates are not disclosed
  - - Consumer goods and food / beverage
    - 'Buyer: IBP, supply-chain, and strategy leaders; user: planners and ESG operators; payer: enterprise operations budget'
    - PepsiCo appears as conference-stage IBP transformation proof; directories list Danone, Kraft Heinz, and other consumer-goods stories
    - Meaningful brand proof but thinner quantified outcome detail than automotive
    - Large CPG logos strengthen enterprise referenceability and cross-domain expansion logic
    - Most public proof is conference or directory level rather than fresh audited metrics
  - - Retail and merchandising-heavy enterprises
    - 'Buyer: merchandising, retail planning, and finance teams; user: planners and store or category operators; payer: corporate planning budget'
    - Case directories list large retail, fashion, and branded-apparel stories
    - Broad category presence in directories rather than detailed live case studies
    - Supports revenue, inventory, and assortment-expansion thesis
    - Named public deployment detail is light
  - - Professional-services and implementation ecosystem
    - 'Buyer: partner-led transformation sponsors; user: SI teams plus end clients; payer: mixed direct and program budgets'
    - TheirStack sample includes Accenture, Genpact, Infosys, and Capgemini; partner page and valantic confirm ecosystem role
    - Shows o9 travels with large consulting ecosystems
    - Important for distribution and implementation leverage
    - Difficult to separate internal use from customer-delivery use on public technology-footprint sites
  - - Healthcare and hospital-facing organizations
    - 'Buyer: operations or supply-chain transformation leaders; user: hospital or provider planning teams; payer: enterprise IT or operations budget'
    - Landbase says hospitals and physicians are a visible footprint segment
    - Meaningful but indirect evidence compared with manufacturing proof
    - Potentially attractive because complex supply and capacity planning problems are sticky
    - Named production case studies are sparse in this cache
  - - Cross-vertical enterprise base
    - 'Buyer: central planning and finance leadership; user: cross-functional teams; payer: enterprise transformation budget'
    - o9 says 30-plus industries and broad supply-chain, revenue, and P&L coverage
    - Very broad marketing and analyst-linked signal, but not a cohort ledger
    - Cross-domain positioning supports land-and-expand motion into adjacent processes
    - No public segmentation by ARR, geography, or buyer persona depth
  notes: This table separates public footprint signals by segment rather than treating third-party install-base counts as a precise customer ledger. Strategic value reflects likely commercial relevance, not disclosed revenue mix.
