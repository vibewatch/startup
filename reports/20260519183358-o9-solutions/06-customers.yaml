- id: partners-expansion-and-adoption-quality
  title: Expansion logic runs through partners, adjacent domains, and change-management-heavy transformations
  body: 'o9’s customer motion does not look purely direct-led. The company explicitly maintains a partner ecosystem, and valantic says it has helped many leading companies in mechanical engineering, automotive, electronics, consumer goods, and life sciences implement o9. TheirStack’s sample list also includes Accenture, Genpact, Infosys, and Capgemini, implying that part of the o9 footprint lives inside service-led transformation programs and ecosystem delivery models. The strongest public adoption-quality signal comes from the Gartner Peer Insights-linked page: 94% of clients recommend the platform, the aggregate rating is 4.8 out of 5 across 54 reviews, and quoted reviewers praise collaborative implementation, change management, and adaptability. The 2025 Magic Quadrant-linked release also says o9 recorded more than 80 go-lives in 2024 and expanded client relationships. That combination suggests credible land-and-expand potential. Even so, the public data set still says much more about
    why large customers choose and deploy o9 than it says about how those customers renew, what they pay, or how adoption evolves by cohort over time.'
