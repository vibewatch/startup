- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / implementation risk
  - Impact
  - Diligence path
  rows:
  - - Cross-domain product expansion from supply chain into revenue and P&L planning
    - Adjacent-domain breadth can deepen account stickiness but also enlarge implementation scope
    - Upsell potential is real, but adoption friction can increase if too many domains are rolled out at once
    - Request phased rollout plans and module attach rates by cohort
  - - Partner-led implementation ecosystem
    - Quality may vary by SI and geography
    - Improves reach and vertical expertise but makes delivery consistency harder to underwrite from public sources
    - Request top-partner performance data and customer-satisfaction breakdown by partner
  - - Named marquee accounts and former top-customer references
    - Large accounts may matter disproportionately to brand and economics
    - Competitive poaching or churn at a few accounts could have outsized signaling value
    - Request top-10 customer concentration, contract value, and renewal timing
  - - AI-led transformation narrative
    - Complexity and change management can keep pilots from reaching scaled production
    - Implementation failure risk can suppress realized expansion even when product breadth is strong
    - Request pilot-to-production conversion rates and implementation-duration cohorts
  - - Directory-count breadth
    - Public counts differ materially across sources
    - Good for directional market proof but poor for hard revenue underwriting
    - Request a reconciled live-customer count, segmented by direct versus partner-led accounts
  notes: 'This table focuses on underwriteable risk drivers rather than generic software-company risks. Most public gaps are denominator gaps: concentration, renewal, and attach-rate data remain private.'
