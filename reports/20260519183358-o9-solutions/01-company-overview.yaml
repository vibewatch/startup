- id: scale-and-public-milestones
  title: Operating scale and public milestones
  body: 'Operating scale is directionally clear but not perfectly transparent. Public sources support the idea that o9 is a large, globally distributed private software company with meaningful enterprise reach, but they disagree on exact size. Dealroom shows 3,295 staff across 29 countries, CompWorth reports 3,500+ employees and 9% growth, while late-2025 lawsuit coverage uses a lower figure of more than 2,500 employees. That conflict is itself a diligence signal because it means precise headcount is still private. Customer breadth is stronger than workforce precision: D CEO''s lawsuit coverage says more than 200 companies use o9 and names well-known enterprise customers. Geographic reach is also visible through India operations and worldwide team language on the company website. Milestone-wise, the story is a clean public arc from 2009 founding to late-stage funding rounds in 2022 and 2023, followed by continuing market activity in 2026 via media and ecosystem coverage. Revenue is less
    certain: a GetLatka estimate puts 2024 revenue at $157.5 million, but that remains a third-party estimate, not an audited disclosure.'
