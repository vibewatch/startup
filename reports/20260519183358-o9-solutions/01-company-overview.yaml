  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Audited 2024 revenue, current ARR, and profitability disclosure from management or lenders.
    whyItMatters: A private-company revenue estimate is useful but insufficient for underwriting growth quality and margin durability.
    diligencePath: Request board materials or audited management accounts covering FY2024 and the latest run-rate bridge.
    relatedQuestionRefs:
    - QO012
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: headcount-precision
    missingEvidence: A management-certified global employee count and office / branch roster as of May 2026.
    whyItMatters: Public headcount estimates vary by roughly one thousand employees, which changes operating-scale assumptions and cost-base analysis.
    diligencePath: Request HRIS export by country plus a current facilities list reconciled to legal entities.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO001
    - TO005
  - type: enumeration-incomplete
    severity: material
    topic: governance-transparency
    missingEvidence: A current board list, observer rights, ownership percentages, and any special control provisions.
    whyItMatters: The public record names only selected individuals and investors, so governance power and succession risk cannot be judged precisely.
    diligencePath: Request the latest board deck cover page, cap table summary, and investor-rights schedule.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: public-chronology
    missingEvidence: A fuller product-and-partnership milestone log with exact launch dates and go-live counts.
    whyItMatters: The public chronology is sufficient for context but may miss important product or commercial events between funding rounds.
    diligencePath: Request a company-prepared milestone timeline covering launches, partnerships, regulatory events, and major customer proofs since 2020.
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
    - TO004
