- id: adverse-flags-and-open-questions
  title: Adverse flags and open questions
  body: 'The dominant adverse flag in the current public record is o9''s November 2025 trade-secret complaint against SAP and three former o9 executives. Across o9''s own release, D CEO, and Heise, the basic allegation is consistent: o9 claims SAP and former insiders misused confidential material tied to Enterprise Knowledge Graph architecture, product roadmaps, pricing, customer use cases, and sales strategy. Public coverage also states that the former executives allegedly downloaded more than 20,000 files before leaving, which raises obvious governance, security, and personnel-retention questions even before the legal merits are decided. SAP''s response was limited to saying it would review the complaint and respond in the legal process. Separate from the lawsuit, Lokad''s independent April 2026 review is a useful softer adverse source because it credits o9 with real platform breadth while still questioning technical transparency and optimization depth. The remaining diligence gaps are
    typical for a private company: exact headcount, full board composition, cap-table ownership, and audited revenue or profitability data remain unavailable in the public corpus.'
