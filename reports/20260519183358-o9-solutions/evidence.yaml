evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Audited 2024 revenue, current ARR, and profitability disclosure from management or lenders.
    whyItMatters: >-
      A private-company revenue estimate is useful but insufficient for underwriting growth quality and margin
      durability.
    diligencePath: Request board materials or audited management accounts covering FY2024 and the latest run-rate bridge.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: headcount-precision
    missingEvidence: A management-certified global employee count and office / branch roster as of May 2026.
    whyItMatters: >-
      Public headcount estimates vary by roughly one thousand employees, which changes operating-scale assumptions and
      cost-base analysis.
    diligencePath: Request HRIS export by country plus a current facilities list reconciled to legal entities.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
      - TO005
  - type: enumeration-incomplete
    severity: material
    topic: governance-transparency
    missingEvidence: A current board list, observer rights, ownership percentages, and any special control provisions.
    whyItMatters: >-
      The public record names only selected individuals and investors, so governance power and succession risk cannot be
      judged precisely.
    diligencePath: Request the latest board deck cover page, cap table summary, and investor-rights schedule.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: public-chronology
    missingEvidence: A fuller product-and-partnership milestone log with exact launch dates and go-live counts.
    whyItMatters: >-
      The public chronology is sufficient for context but may miss important product or commercial events between
      funding rounds.
    diligencePath: >-
      Request a company-prepared milestone timeline covering launches, partnerships, regulatory events, and major
      customer proofs since 2020.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: market-share-opacity
    missingEvidence: >-
      Third-party market-share, win-rate, and pricing-realization data versus SAP, Oracle, RELEX, Blue Yonder, Kinaxis,
      and other peers.
    whyItMatters: >-
      Without validated share and win-rate data, it is difficult to translate category growth into o9-specific
      competitive capture assumptions.
    diligencePath: >-
      Request independent analyst-share tables, internal win-loss data, and recent RFP outcome summaries segmented by
      competitor.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM005
  - type: enumeration-incomplete
    severity: material
    topic: sam-som-precision
    missingEvidence: >-
      A management-backed SAM and SOM bridge that avoids double counting between SCP, decision intelligence, and AI
      overlay categories.
    whyItMatters: >-
      Broad external TAM lenses are helpful, but they are too coarse to underwrite precise o9-specific share
      assumptions.
    diligencePath: >-
      Request management's market model with boundary definitions, segment weights, and current penetration by vertical
      and geography.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: implementation-economics
    missingEvidence: Public benchmarks for implementation cost, time-to-value, and payback by segment or deployment complexity.
    whyItMatters: >-
      ROI expectations are central to buying decisions, but public vendor pages emphasize success anecdotes more than
      distributional economics.
    diligencePath: >-
      Collect customer interviews, procurement records, or neutral implementation benchmarks by buyer type and
      deployment scope.
    relatedQuestionRefs:
      - QM020
      - QM024
    relatedTableRefs:
      - TM003
      - TM004
  - type: access-blocked
    severity: minor
    topic: paywalled-analyst-detail
    missingEvidence: Full Gartner and IDC scoring tables, methodology details, and vendor-by-vendor writeups.
    whyItMatters: >-
      The cached excerpts prove category maturity and some positioning, but the paywalled details would sharpen
      competitive weighting.
    diligencePath: >-
      Purchase the full reports or request analyst reprints that cover exact vendor strengths, cautions, and market-size
      methodology.
    relatedQuestionRefs:
      - QM016
      - QM023
    relatedTableRefs:
      - TM002
      - TM005
  - type: missing-source
    severity: material
    topic: public pricing transparency
    missingEvidence: >-
      A current public o9 price book or recent customer quote set that shows base platform fees, module add-ons, and
      discount bands.
    whyItMatters: >-
      Without list-price or quote evidence, the pricing comparison can only describe opacity rather than realized
      commercial competitiveness.
    diligencePath: >-
      Request three recent o9 proposals across different enterprise sizes or capture a current pricing page if the
      company publishes one.
    relatedQuestionRefs:
      - QP022
    relatedTableRefs:
      - TP003
  - type: access-blocked
    severity: material
    topic: Blue Yonder current product detail
    missingEvidence: >-
      A current accessible Blue Yonder planning-platform page or investor material confirming product breadth and
      current planning packaging.
    whyItMatters: >-
      Blue Yonder is a material peer in independent market framings, but the retained cache does not contain a currently
      usable official product page.
    diligencePath: >-
      Fetch Blue Yonder’s current planning or platform page and an investor or analyst page that confirms product scope
      and scale.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: head-to-head competitive win rates
    missingEvidence: >-
      RFP loss-rate data, competitive takeout analyses, or partner-backed win-rate studies against SAP, Kinaxis, and
      RELEX.
    whyItMatters: >-
      Moat durability is more convincing with verified win-rate or displacement data than with only market framing and
      product claims.
    diligencePath: Ask management for the last twelve months of named competitive evaluations with outcome, ACV, and reason codes.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: minor
    topic: realized implementation economics
    missingEvidence: >-
      Channel economics showing who delivers services, how much revenue partners keep, and the payback profile of
      implementation-led sales.
    whyItMatters: >-
      Implementation leverage affects both distribution advantage and the true switching-cost economics of the installed
      base.
    diligencePath: >-
      Request partner program terms and two joint customer references with deployment scope, partner role, and services
