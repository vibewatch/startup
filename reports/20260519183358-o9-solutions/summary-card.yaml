      Public revenue estimates diverge so widely that the implied valuation multiple cannot be underwritten cleanly from
      outside data.
    - >-
      The November 2025 trade-secret dispute with SAP adds legal cost, management distraction, and competitive noise at
      a sensitive stage of scaling.
    - >-
      Exact headcount, profitability, retention, services intensity, and customer concentration remain private, limiting
      confidence in operating leverage.
    - >-
      Competition is intense across best-of-breed vendors, ERP incumbents, and AI-enabled planning entrants, which can
      pressure implementation wins and pricing.
    - Complex enterprise deployments create execution and adoption risk even when demand for the category is strong.
  unresolvedGaps:
