  topStrengths:
    - >-
      The Digital Brain plus Enterprise Knowledge Graph architecture remains differentiated and is repeatedly cited by
      partners, company materials, and independent reviews.
    - >-
      o9 operates in a large and resilient supply chain planning category where AI, scenario modeling, and
      cross-functional decisioning remain board-level priorities.
    - >-
      Public customer evidence spans blue-chip enterprises and multiple industries, showing that the platform has moved
      well beyond pilot-stage credibility.
    - >-
      Existing investors were still willing to add capital at a multibillion-dollar valuation in 2023, indicating
      institutional confidence in category relevance and company trajectory.
  topRisks:
