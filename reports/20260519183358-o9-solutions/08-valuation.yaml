- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - o9 using Latka denominator
    - 2024 revenue / ARR estimate
    - $3.7B / $157.5M ≈ 23.5x
    - Shows how stretched the round looks on the conservative public estimate set.
    - Estimate is low-confidence and may not be comparable to audited recurring revenue.
  - - o9 using CompWorth denominator
    - Revenue estimate
    - $3.7B / $703.9M ≈ 5.3x
    - Shows that the same round can screen near public planning-software ranges if the high estimate is directionally right.
    - Estimate is low-confidence and archived; not audited or management-reconciled.
  - - Kinaxis
    - EV / Revenue (ttm)
    - 4.28x EV/Revenue; 5.01x P/S
    - Public supply-chain orchestration reference with real disclosures and profitability.
    - Different business mix and public-company governance standard.
  - - Manhattan Associates
    - EV / Revenue (ttm)
    - 7.53x EV/Revenue; 7.88x P/S
    - Premium public planning / commerce software reference with strong investor-grade disclosure.
    - Broader execution footprint and different end-market mix.
  - - e2open
    - Platform scale / filing status
    - 2025 10-K filer; no retained live 2026 multiple
    - Useful as a scale and network reference for connected supply-chain software.
    - Retained corpus does not provide a current May 2026 trading multiple.
  - - RELEX / Anaplan private references
    - Private / strategic reference
    - 700+ customers and IDC leadership support category quality, but no retained current public multiple
    - Useful for sanity-checking strategic relevance without pretending private marks are current public comps.
    - No clean current trading multiple in the retained corpus.
  notes: This is a partial comp set that favors supportable references over forced precision. Public comparability is strongest for Kinaxis and Manhattan; the private and status-only rows are context, not exact pricing anchors.
  enumerationScope:
    coverage: partial
    basis: The table intentionally covers the supportable public and private planning-software references present in the retained corpus as of 2026-05-19; it is not a full banker-style comp screen across every planning vendor or transaction.
