- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - case
  - assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - Revenue quality trends toward the upper public estimate set, AI positioning converts into premium pricing, and disclosure improves.
    - $3.8B-$5.5B range; premium planning-software multiple remains supportable.
    - Execution slip, opaque terms, or weak margin quality would break the case.
    - Possible but evidence-thin from public materials alone.
  - - Base
    - Revenue sits somewhere between the conflicting public estimates and market support resembles high-quality planning-software comps.
    - $2.2B-$3.8B range; roughly full at the last-round mark.
    - Needs better disclosure on revenue quality and terms before becoming compelling.
    - Most defensible public-only case today.
  - - Bear
    - Revenue is closer to the conservative estimate set and the market applies Kinaxis-like or lower support multiples.
    - $0.8B-$2.2B range; downside is driven by denominator risk more than by product collapse.
    - Category competition and valuation compression compound quickly if disclosure stays weak.
    - Easy to defend if the low estimate set is directionally right.
  notes: Ranges are scenario estimates, not a banker-grade fairness opinion. They intentionally keep denominator uncertainty explicit rather than forcing one exact revenue number.
