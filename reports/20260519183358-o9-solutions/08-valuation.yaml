  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current o9 cap-table and preference overhang
    missingEvidence: Current liquidation preferences, participation rights, ratchets, dilution waterfall, and any secondary or structured terms beyond the 2023 headline round.
    whyItMatters: A company can be strategically strong while still offering poor new-money economics if the preference stack is heavy or if hidden protections sit ahead of common.
    diligencePath: Request the latest cap table, financing documents, board consents, and any secondary transaction history since the 2023 round.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: audited o9 revenue, margin, and retention quality
    missingEvidence: Audited 2024–2025 revenue, gross margin, services mix, net retention, and cash generation or burn information.
    whyItMatters: The implied multiple can only be underwritten cleanly if the denominator and its quality are known; otherwise the valuation bridge remains speculative.
    diligencePath: Request audited financial statements, revenue-recognition policy, segment mix, retention cohorts, and customer-concentration data.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: Comparable valuation table coverage
