- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Audited financials
    - Current revenue, gross margin, burn, and services mix
    - This is the core denominator and quality bridge for any price-sensitive recommendation.
    - Management room; audited statements; revenue-recognition memo
  - - Cap table and terms
    - Liquidation preferences, ratchets, secondary history, and dilution waterfall
    - New-money returns depend on terms, not just on enterprise value.
    - Legal diligence with financing documents and board consents
  - - Customer-quality proof
    - Retention cohorts, top-account concentration, and expansion evidence
    - A premium multiple needs durable recurring value, not just logos or case studies.
    - Revenue-ops package plus reference calls
  - - AI-governance proof
    - Explainability, governance, and deployment guardrails for AI features
    - Broader AI positioning widens operational expectations and governance risk.
    - Product and compliance review with model-governance owners
  - - Exit readiness
    - IPO-grade disclosure path, internal controls, and board readiness
    - A credible exit path improves confidence in terminal support and holding-period logic.
    - Finance and governance diligence; timeline to public-company readiness
  notes: These asks are the minimum package required to move the call because the public record is directionally useful but not investment-grade by itself.
