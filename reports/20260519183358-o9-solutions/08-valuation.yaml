- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Audited revenue quality disappoints
    - True recurring revenue lands near the low estimate set or margin quality is weak
    - The current round shifts from merely full to clearly stretched
    - Re-underwrite at a lower price expectation and higher risk discount
  - - Cap-table overhang is heavier than expected
    - Participation, ratchets, or senior preferences materially reduce new-money economics
    - Even a good company can become a bad investment at the same price
    - Pause and renegotiate terms or walk away
  - - Crowded-category pressure compresses the premium
    - Public planning-software multiples fall or AI differentiation proves hard to monetize
    - Bull case loses its scarcity premium
    - Use Kinaxis-like or below-Kinaxis support in the valuation model
  - - Independent quality proof lags company narrative
    - No stronger retention, reference, or audited disclosure emerges
    - Research-more cannot graduate to buy
    - Maintain watch posture rather than stretch into conviction
  - - Operational or legal risk rises
    - Execution, litigation, or governance issues materially worsen
    - Downside case becomes easier to defend than base
    - Increase discount rate and shorten acceptable hold assumptions
  notes: Kill triggers are framed as price-moving or thesis-breaking events rather than as generic diligence questions.
