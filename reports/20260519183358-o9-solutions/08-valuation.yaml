- id: scenario-ranges
  title: 'Scenario ranges: upside exists, but the downside is easier to defend publicly'
  body: 'The upside case for o9 does not require heroic logic. If the real revenue base is materially above the low estimate set, if recent AI positioning translates into durable pricing power, and if the company eventually looks more like a premium planning platform than a services-heavy transformation vendor, then a valuation above the last round is plausible. The problem is that each of those conditions still needs evidence. The base case therefore has to be more conservative: use public-style software multiples, accept that disclosure quality is still private-company grade, and treat the current round as roughly full rather than obviously cheap. The bear case is even easier to argue from the retained corpus because it only requires the low estimate set to be directionally right and the market to compress valuation support toward Kinaxis-like or below-Kinaxis levels. None of this means the company is weak. It means the price-quality tradeoff is not yet asymmetric in the investor’s favor.'
