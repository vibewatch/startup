- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - direction
  - what would change the view
  rows:
  - - The company has real investor backing, category relevance, and repeated analyst-recognition momentum.
    - thesis
    - More proof of audited financial quality would turn this from interesting to actionable.
  - - The 2023 round could still be sensible if the true revenue base is much higher than conservative public estimates imply.
    - thesis
    - Audited current revenue and margins would make the multiple bridge explicit rather than hypothetical.
  - - Planning software is a large category where strong execution can earn premium software multiples.
    - thesis
    - Evidence of durable pricing power and retention would strengthen the premium case.
  - - Current public revenue estimates conflict too widely to support a single precise multiple.
    - anti-thesis
    - A reconciled denominator would sharply improve confidence in the valuation stance.
  - - Crowded-category competition means generic AI claims will not support a sustained scarcity premium by themselves.
    - anti-thesis
    - Independent evidence of better outcomes or switching costs would soften this concern.
  - - Private-company disclosure quality remains below what investors get from public planning-software comps.
    - anti-thesis
    - Provide private-room disclosure that approaches public-company quality on revenue, margin, retention, and terms.
  notes: The anti-thesis is not that o9 is weak; it is that the valuation bridge is still under-specified relative to the price being asked.
