company:
  name: o9 Solutions
chapter:
  number: 8
  title: Valuation
  summary: 'The retained public record is strong enough to show that o9 is a real category asset with credible strategic relevance, but not strong enough to make the 2023 $3.7 billion round look obviously attractive from public evidence alone. The decisive problem is denominator uncertainty: public revenue estimates conflict so widely that the implied multiple swings from premium-but-plausible to clearly stretched, which is why the right recommendation remains research-more pending audited financial and terms disclosure.'
sections:
- id: thesis-and-call
  title: Thesis, anti-thesis, and the right call at the last round price
  body: 'The bullish case for o9 is easy to see. The company had enough investor support to raise an incremental $116 million at a $3.7 billion valuation in 2023, and it paired that with rapid ARR-growth claims and repeated analyst-recognition pages that suggest real commercial traction. It also sits in a large, important planning category rather than in a niche workflow. The anti-thesis is just as clear: the public record still does not offer a clean current revenue denominator, and the small number of third-party estimates that do exist are wildly inconsistent. That is not a trivial modeling inconvenience. It is the core reason the recommendation cannot be a buy from public evidence alone. At one denominator the last round looks like a very aggressive premium multiple; at another it looks only moderately rich. When price sensitivity is this dependent on a disputed denominator, the disciplined call is research-more with medium confidence and a high risk rating rather than a false-precision
    verdict.'
