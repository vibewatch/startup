tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - decision field
  - current view
  - decision implication
  rows:
  - - Recommendation
    - research-more
    - Strong company-quality signals are not enough to underwrite new money cleanly from public evidence alone.
  - - Confidence
    - medium
    - The strategic story is credible, but revenue denominator and cap-table uncertainty remain too important to ignore.
  - - Risk rating
    - high
    - Multiple compression, disclosure opacity, and competition can hurt valuation support without a demand collapse.
  - - Valuation stance
    - stretched-to-fair
    - Fair only if the true revenue base sits materially above the lowest public estimate set.
  - - Entry discipline
    - price-sensitive and disclosure-sensitive
    - A lower price or stronger evidence can move the call more than general enthusiasm can.
  - - Action today
    - stay close but demand more diligence
    - Require audited-like disclosure and terms clarity before moving from research-more to buy.
  notes: 'The recommendation is intentionally price-sensitive: this is not a generic company-quality score disconnected from the entry valuation.'
