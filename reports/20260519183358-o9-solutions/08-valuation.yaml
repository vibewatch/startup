- id: valuation-context
  title: 'Valuation context: the same $3.7B mark screens very differently depending on the denominator'
  body: 'Public comps provide a useful framing device even if they cannot fully solve the private-company problem. Kinaxis and Manhattan both trade on real investor-grade disclosures and therefore give better anchors than generic software baskets. Kinaxis was around 4.28x EV-to-revenue in mid-May 2026, while Manhattan was around 7.53x. That means o9’s 2023 round looks severely stretched if revenue is anywhere near the low third-party estimate of roughly $157.5 million, but it looks much more ordinary if the higher third-party estimate is directionally correct. The challenge is that both estimates are weakly evidenced and not directly comparable. On top of that, e2open, RELEX, Anaplan, SAP, and Oracle all demonstrate that planning software is a crowded field with credible alternatives across public, private, and incumbent buckets. So the comp exercise supports discipline more than conviction: it tells you the round is not automatically absurd, but it also does not close the case that public
    evidence alone justifies paying in at that price.'
