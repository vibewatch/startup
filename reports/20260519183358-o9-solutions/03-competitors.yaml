callouts:
- calloutType: strength
  title: o9’s clearest edge is breadth of decision model
  body: The retained o9 pages are unusually explicit about unifying supply, revenue, product, procurement,
    and financial decisions in one decision layer. Even when rivals have overlapping modules, that cross-functional
    narrative is still the strongest public explanation for why an enterprise buyer would standardize
    on o9 instead of keeping separate planning systems.
  claimRefs:
  - CP002
  - CP003
  - CP004
  - CP027
- calloutType: risk
  title: Competitive pressure is no longer only commercial
  body: The late-2025 SAP trade-secret dispute implies that o9 is strategically relevant to incumbents,
    but it also raises the prospect of legal distraction, customer uncertainty, and incremental cost.
    In a category where analyst framing is already mixed, unresolved litigation can slow the path from
    architectural differentiation to durable market leadership.
  claimRefs:
  - CP031
  - CP036
  - CP037
