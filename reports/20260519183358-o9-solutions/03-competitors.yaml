  rows:
  - - o9 Solutions
    - Reference company
    - $3.7B valuation at July 2023 round; 94% Gartner-reported recommendation rate
    - Large enterprises seeking cross-functional planning
    - Digital Brain + EKG framing across supply, revenue, product, and finance decisions
    - Retained public surfaces do not expose simple list pricing
  - - Kinaxis
    - Best-of-breed direct peer
    - ~$3.846B public market cap; investor page stresses high growth and strong earnings
    - Complex global manufacturers and orchestrated supply chains
    - Real-time orchestration narrative and public-company credibility
    - Less cross-functional finance / product-planning branding in retained surfaces
  - - RELEX
    - Best-of-breed direct peer
    - 700+ customers and 20 years of AI-native infrastructure claimed on official page
    - Retail, grocery, and CPG operators
    - Deep retail-planning credibility and proven customer count
    - More retail-weighted than o9’s broad enterprise-decision story
  - - SAP IBP
    - Incumbent ERP suite
    - Integrated inside broader SAP stack
    - Large enterprises already standardized on SAP
    - Bundled S&OP, demand, supply, replenishment, and inventory planning
    - ERP attachment can matter more than best-of-breed product fit
  - - Oracle Supply Chain Planning
    - Incumbent ERP suite
    - Embedded in Oracle Cloud SCM
    - Large enterprises using Oracle manufacturing and SCM workflows
    - End-to-end planning inside broader cloud-suite procurement
    - Retained sources emphasize suite breadth more than differentiated planning depth
  - - e2open
    - Adjacent network / execution peer
    - 480,000+ partners and 16B+ annual transactions
    - Global multi-enterprise supply chains and channel-heavy operators
    - Network scale and connected-touchpoint visibility
    - Planning-specific differentiation is less central than network breadth
  - - Manhattan Associates
    - Adjacent execution / commerce peer
    - $262.8M Q1 2025 revenue and 25% RPO-bookings growth
    - Retailers and omnichannel operators
    - AI-native platform unifying planning with stores, warehouses, and transportation
    - Broader commerce footprint can make planning only one part of the story
  - - Infor
    - Adjacent suite peer
    - Broad SCM portfolio with planning-to-logistics framing
    - Enterprises wanting broad SCM coverage
    - End-to-end visibility and resilience positioning
    - Retained page is broad-category marketing rather than detailed planning proof
  - - Anaplan
    - Adjacent planning peer
    - Public customer ROI snippets such as 4–6 inventory days removed and $25M savings
    - Enterprises seeking connected planning and finance-adjacent modeling
    - More explicit public ROI messaging on retained page
    - Retained source shows outcome proof but not full SCP breadth versus o9
  notes: Blue Yonder remains relevant in analyst coverage, but the retained cache does not include a current
    usable official product page, so it is discussed in prose rather than fully profiled here.
