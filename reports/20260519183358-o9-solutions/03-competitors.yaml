  - - Mixed analyst framing
    - Visionary in one 2024 framing versus leader in a 2025 value matrix
    - Shifting analyst perception can weaken narrative of clear category leadership
    - Medium
    - Track 2026 MQ movement and ask why perception moved
  - - SAP legal conflict
    - Late-2025 trade-secret lawsuit against SAP
    - Management distraction, legal cost, and customer uncertainty
    - High
    - Request litigation budget, expected timeline, and any customer-impact disclosures
