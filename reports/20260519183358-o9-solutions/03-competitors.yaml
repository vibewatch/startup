  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public pricing transparency
    missingEvidence: A current public o9 price book or recent customer quote set that shows base platform
      fees, module add-ons, and discount bands.
    whyItMatters: Without list-price or quote evidence, the pricing comparison can only describe opacity
      rather than realized commercial competitiveness.
    diligencePath: Request three recent o9 proposals across different enterprise sizes or capture a current
      pricing page if the company publishes one.
    relatedQuestionRefs:
    - QP022
    relatedTableRefs:
    - TP003
  - type: access-blocked
    severity: material
    topic: Blue Yonder current product detail
    missingEvidence: A current accessible Blue Yonder planning-platform page or investor material confirming
      product breadth and current planning packaging.
    whyItMatters: Blue Yonder is a material peer in independent market framings, but the retained cache
      does not contain a currently usable official product page.
    diligencePath: Fetch Blue Yonder’s current planning or platform page and an investor or analyst page
      that confirms product scope and scale.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: head-to-head competitive win rates
    missingEvidence: RFP loss-rate data, competitive takeout analyses, or partner-backed win-rate studies
      against SAP, Kinaxis, and RELEX.
    whyItMatters: Moat durability is more convincing with verified win-rate or displacement data than
      with only market framing and product claims.
    diligencePath: Ask management for the last twelve months of named competitive evaluations with outcome,
      ACV, and reason codes.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: minor
    topic: realized implementation economics
    missingEvidence: Channel economics showing who delivers services, how much revenue partners keep,
      and the payback profile of implementation-led sales.
    whyItMatters: Implementation leverage affects both distribution advantage and the true switching-cost
      economics of the installed base.
    diligencePath: Request partner program terms and two joint customer references with deployment scope,
      partner role, and services mix.
    relatedQuestionRefs:
    - QP017
    relatedTableRefs:
    - TP004
