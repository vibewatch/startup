  - id: FU004
    title: 留存 / 重复使用队列
    type: matrix
    layout: standard
    summary: 公开留存比例缺位时，最诚实的图表不是硬算留存，而是用留存可见度矩阵标出：哪些地方有重复使用证据， 哪些地方仍然缺证据。
    approximationNotes: 本图刻意衡量可见度，而不是留存表现。评分规则：0 代表没有公开证据，1 代表代理证据较弱，2 代表公开信号中等， 3 代表公开信号相对较强。
    data:
      columns:
        - 队列 / 证据面
        - 续约可见度（0-3）
        - 重复使用可见度（0-3）
        - 满意度可见度（0-3）
        - 主要证据缺口
      rows:
        - label: 具名汽车转型队列
          values:
            - 具名汽车转型队列
            - '0'
            - '3'
            - '1'
