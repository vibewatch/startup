        title: 领导层、治理与融资历史
        blocks:
          - type: paragraph
            body: >-
              公开治理能见度很低，但看得见的部分仍然重要。Chakri Gottemukkala 作为联合创始人兼 CEO，仍是最核心的公开高管声音，这给尽调留下明确的关键人物依赖信号。公开记录里最具体的治理事件，是 Gary
              Reiner 随 2023 年 7 月融资加入董事会，说明 General Atlantic 在董事会层面有影响力。融资历史比治理历史更清楚。多个官方、投资方和媒体来源都指向同一件事：BeyondNetZero
              / General Atlantic 领投 2023 年 7 月 $116 million 融资，估值 $3.7 billion，KKR 和 Generation Investment Management
              也参投。数据库来源还显示，2022 年 1 月 Series C 约 $295 million，估值 $2.7 billion，累计披露融资约 $536 million。2023
              年这一轮被包装为现有投资人继续加码，更像是对公司的持续信心，而不是困境桥轮。
