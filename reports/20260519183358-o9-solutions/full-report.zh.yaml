  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类定义
        blocks:
          - type: paragraph
            body: >-
              o9 位于供应链规划品类内，但公开材料显示，公司的真实市场边界比传统需求规划或供应规划更宽。Solutions Review 对 Gartner
              的总结把供应链规划定义为一类技术，用来在延展供应链中管理、对齐、协作并共享规划数据；ARC 则把实际范围扩到端到端转型、库存优化、网络设计、敏捷性和韧性。o9
              进一步扩宽品类，强调横跨供应链、财务、采购和销售的企业规划与决策。这让通用协作工具、电子表格和只做执行的软件成为现状替代品，而不是直接同业；SAP、Oracle、Infor、Manhattan 和 e2open
              等套件厂商则成为相邻替代，因为它们把规划打包进更大的 SCM 技术栈。结果是一个尽调必须处理的边界问题：品类越贴近以规划为中心的套件和 IBP 工作流，就越贴近 o9 的核心产品；品类越扩到完整 SCM
              套件，TAM 越膨胀，但特异性也越弱。
