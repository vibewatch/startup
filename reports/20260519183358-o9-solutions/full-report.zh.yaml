      - number: '2.2'
        title: 规模测算视角、增速与需求驱动因素
        blocks:
          - type: paragraph
            body: >-
              最强的公开数字视角是广义 SCM 软件市场，而不是专门为 o9 切出的纯规划市场。Mordor 预计 SCM 软件 2026 年为 $36.39 billion，到 2031 年为 $56.01
              billion；MarketsandMarkets 则把同一广义市场定义为 2025 年 $38.51 billion、2030 年 $58.42 billion。第二个增长更快的视角来自供应链中的
              AI：MarketsandMarkets 预计该市场将从 2025 年 $13.93 billion 增至 2032 年 $50.41
              billion。这些数字支持核心市场结论：规划预算在扩大，但拉动因素不是旧式的单纯可视化叙事，而是数字化转型、监管可追溯性、波动性和 AI 集成。Nucleus
              又补上一层重要定性判断：买家现在优先考虑实时情景建模和应急规划。具体到 o9，最有用的估值视角不是整个 SCM 技术栈，而是规划含量高、韧性、跨职能协调和企业语境 AI 最重要的那一片。因此，本章的粗略区间把广义
              TAM 收窄为以规划优先的机会，同时明确保留不确定性。
