    summary: 最可见客户引用的公开证明质量，区分具名客户标识、量化运营结果和留存可见度。
    approximationNotes: 评分为定性且基于证据：分数越高，代表当前公开记录在该维度更丰富，不代表客户关系一定商业规模更大。
    data:
      columns:
        - 客户 / 证明集
        - 具名身份（1-3）
        - 生产成熟度（1-3）
        - 量化结果细节（1-3）
        - 留存可见度（1-3）
        - 扩张信号（1-3）
      rows:
