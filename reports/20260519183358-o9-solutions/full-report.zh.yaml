  - id: TU001
    title: 客户分群表
    columns:
      - 细分市场
      - 买方 / 用户 / 付款方
      - 用例与公开证据
      - 规模 / 证据信号
      - 收入 / 战略价值
      - 缺口
    rows:
      - - 汽车与工业制造
        - 买方：供应链或运营负责人；用户：计划员和工厂团队；付款方：企业中央 IT 或转型预算
        - Marelli 加上一家未具名全球汽车供应商，覆盖计划、预测和供应商协作用例
        - 当前缓存中最强的具名且量化证据
        - 战略价值高，因为复杂制造能验证核心计划可信度
        - 公开资料未披露经济性和续约率
      - - 消费品与食品 / 饮料
        - 买方：IBP、供应链和战略负责人；用户：计划员和 ESG 运营人员；付款方：企业运营预算
        - PepsiCo 作为会议场景里的 IBP 转型证据出现；名录列出 Danone、Kraft Heinz 和其他消费品案例
        - 品牌证据有分量，但量化结果细节比汽车领域更薄
        - 大型 CPG 标杆强化企业可背书性，也支撑跨域扩张逻辑
        - 多数公开证据停留在会议或名录层面，而不是新的经审计指标
      - - 零售与商品企划密集型企业
        - 买方：商品企划、零售计划和财务团队；用户：计划员和门店或品类运营人员；付款方：公司计划预算
        - 案例名录列出大型零售、时尚和品牌服装案例
        - 名录显示品类覆盖广，但详细的在线案例研究不多
        - 支撑收入、库存和品类组合扩张论点
        - 具名公开部署细节偏少
      - - 专业服务与实施生态
        - 买方：由合作伙伴牵头的转型赞助方；用户：SI 团队和终端客户；付款方：直接预算与项目预算混合
        - TheirStack 样本包含 Accenture、Genpact、Infosys 和 Capgemini；合作伙伴页面和 valantic 证实生态角色
        - 显示 o9 会随大型咨询生态一起进入客户
        - 对分销触达和实施杠杆很重要
        - 公开技术足迹网站很难区分内部使用和客户交付使用
      - - 医疗健康与医院组织
        - 买方：运营或供应链转型负责人；用户：医院或服务提供方计划团队；付款方：企业 IT 或运营预算
