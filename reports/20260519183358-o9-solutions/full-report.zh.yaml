        title: 最终尽调问题与退出准备度
        blocks:
          - type: paragraph
            body: >-
              o9 仍可能成为出色的上市公司标的，或后期私募资产，但目前公开记录还没达到 IPO
              级别。缺的不是表面材料。投资者需要看到经审计收入和利润率、留存质量、客户集中度、服务强度，以及当前股权结构表和优先股堆叠。上市可比公司通过年报和季报披露这些项目，因此市场能更有把握地解释其倍数。o9
              不必今天就上市，才值得投资；但如果新资金按数十亿美元估值进入，仍应要求公司在私下尽调室里提供相当于这一披露标准的材料。在这些信息可得之前，正确动作不是永远离场，而是拒绝虚假的精确性。继续跟进，围绕收入质量和条款搭建尽调计划，并要求足够披露，让投资建议因证据改善而变化，而不是因热情升温而变化。
