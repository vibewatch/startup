              公开可比公司提供了有用框架，即使它们无法完全解决私有公司问题。Kinaxis 和 Manhattan 都基于真实、投资级披露交易，因此比泛软件篮子提供更好的锚。2026 年 5 月中旬，Kinaxis 的
              EV/收入约为 4.28x，Manhattan 约为 7.53x。这意味着，如果收入接近约 $157.5 million 的低位第三方估计，o9 的 2023
