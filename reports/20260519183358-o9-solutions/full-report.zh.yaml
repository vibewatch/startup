  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台范围、Digital Brain 基座与模块宽度
        blocks:
          - type: paragraph
            body: >-
              o9 并不把自己呈现为单点规划工具。当前公开产品故事是一套跨领域运营平台，在同一个 Digital Brain 基座上连接供应链、收入、产品和财务规划。最强证据来自 Digital Brain 页面、AI
              创新页面、行业页面以及 2025-2026 年 Gartner 关联新闻稿的组合：这些材料反复讲同一个架构逻辑，o9
              希望企业基于数据、关系、约束和决策逻辑的共享数字表征工作，而不是基于互不连接的计划工作。这个点很重要，因为它解释了为什么同一产品表面现在覆盖需求规划、供应规划、商业规划、供应商协作、生产排程、收入增长管理以及面向
              P&L 的工作流。换句话说，模块广度真实存在，但最好理解为一个可配置规划底座被用于多个用例，而不是一组边界清晰、每个模块都有深度公开技术文档的 SKU 家族。
