      - CV007
      - CV008
      - CV009
      - CV020
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 区间图展示悲观、基准、乐观三档估值带，而不是假装能看到一个精确的当前公允价值。
    approximationNotes: 区间基于公开支撑做情景估计，不是可直接用于交易的估值标记。
    data:
      items:
        - label: 悲观情景
          low: 800
          high: 2200
          unit: $M
        - label: 基准情景
          low: 2200
          high: 3800
          unit: $M
        - label: 乐观情景
          low: 3800
          high: 5500
          unit: $M
    claimRefs:
      - CV037
      - CV038
      - CV039
