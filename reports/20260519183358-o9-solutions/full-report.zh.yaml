      - number: '3.3'
        title: 护城河耐久性与被替代风险
        blocks:
          - type: paragraph
            body: >-
              o9 最强的公开论据是：它试图统一许多对手仍然分开描述的规划品类。Enterprise Knowledge Graph 叙事、神经符号 AI
              和新的复合智能体信息，都支撑一个判断：公司在搭建可复用决策层，而不是狭窄点工具。但护城河尚未干净落定。独立分析师框架混杂，一个 2024 年观点把 o9 下调到愿景者，另一个 2025
              年框架仍把它列为领导者。Lokad 的独立评测承认产品有真实厚度，但明确提醒：公开材料尚未充分支撑最强的 AI 主张。最重要的是，SAP
              商业秘密纠纷显示，既有厂商的回应不再只是商业层面，也可能变成法律和组织分心。我对 o9
              的判断是，差异化故事可信，但耐久性仍取决于它能否证明集成规划确实显著强于既有厂商打包、相邻网络规模，以及买家对量化公开证据的要求。在 o9 能把架构叙事与更公开的定价清晰度、更强第三方 ROI
              证据或硬竞争胜率数据配对之前，应把护城河承销为有前景但仅中等耐久，而不是无可质疑的品类统治。这是一个体面位置，但还不是买家的锁定故事。
