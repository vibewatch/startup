              o9 公开倚重正式生态，valantic
              也公开把自己定位为战略实施伙伴，服务汽车、电子、消费品和生命科学转型。伙伴依赖是一把双刃剑：它提高了实施覆盖和行业专长，但也暗示上线后的成功取决于系统集成商质量、变革管理和私有配置工作，而不是完全自助的技术表面。与
              SAP 的诉讼又增加一个信任维度：客户特定用例、架构和路线图材料足够有战略价值，已经成为一场进行中的法律纠纷的一部分。
