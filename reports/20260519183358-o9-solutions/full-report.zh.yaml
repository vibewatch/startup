  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层信号很广，但公开计数不一致
        blocks:
          - type: paragraph
            body: >-
              公开客户图景首先体现为广度，而不是精确度。o9 自身行业和分析师关联页面称，平台覆盖 30 多个垂直行业，并支持供应链、收入和 P&L 规划；Landbase 与 TheirStack
              都显示其技术足迹广泛分布在制造、零售、医院、专业服务、咨询以及食品或消费品公司。D CEO 又给出第三个信号：平台上有 200 多家公司，包括 PepsiCo、Kraft Heinz、L’Oréal 和
              Google。问题是，这三个计数口径无法干净对齐。Landbase 报告 3,088 家已验证公司，TheirStack 报告 1,675 家，D CEO 则把用户群描述为 200
              多家具名公司，而不是完整装机基数。分歧不意味着采用弱；它意味着公开客户计数来自不同方法，不能当作干净的 ARR 质量分母。可靠结论是方向性的：o9
              在多个行业有有意义的企业渗透，但公开客户总数仍是证据质量问题，而不是已经解决的指标。
