  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与 IP 风险现在排在最前
        blocks:
          - type: paragraph
            body: >-
              公开记录中最清楚的单一风险是 SAP 商业秘密纠纷。这不只是另一桩竞争投诉。法院文件、公司声明和多篇新闻报道都指向一组细节化指控：具名前高管、超过 20,000 份文件的大规模下载、客户特定项目材料，以及 SAP
              使用这些材料补齐业务规划中的产品和市场进入缺口这一理论。即便 o9
              最终胜诉，这类案件仍会消耗领导层时间、制造证据开示负担、拖慢销售对话，并引发关于内部控制和员工离职交接的尴尬尽调问题。更重要的承销点在于，诉讼与一个具体市场背景捆在一起：SAP 正试图把 APO 客户迁移到
              IBP，而 o9 一直在现代规划中赢单。这意味着法律纠纷并未脱离商业风险；它与竞争定位、客户信心和 o9 技术护城河的可信度交织在一起。
