      - number: '2.4'
        title: 约束、替代压力与反向信号
        blocks:
          - type: paragraph
            body: >-
              乐观需求故事并不能抹掉重要市场约束。Mordor
              明确指出，网络安全顾虑、遗留系统集成复杂度和总拥有成本审查都是采用刹车；这也符合替代格局：买家可按既有系统和变革意愿，在套件厂商、专业规划工具或连接执行的平台之间选择。o9
              最清楚的公开反向信号不是市场崩塌，而是怀疑产品质量的视角。Lokad 2026 年 4 月评测承认 o9
              有真实规划套件广度和严肃平台厚度，但仍认为公开记录在白盒概率建模、优化语义和技术透明度上弱得多。这一批评很重要，因为企业 AI
              预算越来越依赖信任、可解释性和扎根企业语境。第二个约束是市场自身的不透明。公开来源足以定义替代品和广义 TAM，但没有披露 o9 精确的 SAM/SOM、市场份额、价格实现，或对 SAP、Oracle、RELEX
              等同业的可重复胜率数据。这些缺失维度应继续作为活的尽调问题，而不是用猜测补齐。
