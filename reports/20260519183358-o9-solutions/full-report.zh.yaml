      - number: '2.3'
        title: 买方、用户、付款方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开证据指向一个常见经济锚点：供应链或运营领导层，但日常使用和实施显然是跨职能的。o9 自身定位覆盖供应链、收入和 P&L 规划，GenAI
              信息又延伸到采购、财务和销售。竞争对手页面强化了同一模式：SAP、Oracle 和 Infor 在更大套件里销售规划；Anaplan、RELEX、Manhattan 和 e2open 则分别倚重运营、财务、IT
              和生态协调的不同买家组合。这意味着实务买方地图是多线程的：CSCO 或 COO 往往拥有商业案例，财务可能赞助 IBP 对齐，采购或商品规划会按细分场景成为重度用户，IT
              或数据领导层通常共同负责集成和治理。采用路径也遵循可识别的市场逻辑：波动或监管制造紧迫感，ROI 目标定义入围名单，集成工作成为第一个真正瓶颈，随后买家才会从试点推进到规模化上线。GenAI 和智能体 AI
              功能现在叠在这条路径之上，成为扩张层，而不是底层规划基础的替代品。
