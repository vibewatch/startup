  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 热力图把 SAP 纠纷、实施负担和 AI 透明度放在剩余严重性最高的一角；文化与融资可及性风险仍然显著， 但排在第二梯队。
    approximationNotes: 矩阵位置来自对已保留公开证据的研判综合，不是数值概率。
    data:
      columns:
        - 中等影响
        - 高影响
        - 极高影响
      rows:
        - label: 中等可能性
          values:
            - 人员压力 / 士气下滑
            - 模型透明度 / 可审计性
            - 实施与变革管理负担
        - label: 高可能性
          values:
            - 融资可及性不透明
            - AI 商品化与定价压力
            - SAP 诉讼与知识产权悬而未决
    claimRefs:
      - CR041
      - CR005
      - CR009
      - CR025
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 传导图显示，法律、模型和执行风险会一路传到部署放慢、证据变弱、定价能力下降，最后削弱估值支撑。
    approximationNotes: 连线表达方向性传导，不是量化敏感性系数。
    data:
      nodes:
        - id: legal
          label: SAP 诉讼
        - id: model
          label: AI 透明度风险
        - id: people
          label: 人员 / 交付压力
        - id: deploy
          label: 实施放慢
        - id: proof
          label: 客户证据变弱
        - id: price
          label: 定价能力下降
        - id: valuation
          label: 估值叙事收缩
      edges:
        - from: legal
          to: proof
        - from: legal
          to: valuation
        - from: model
          to: deploy
        - from: model
          to: proof
        - from: people
          to: deploy
        - from: deploy
          to: proof
        - from: proof
          to: price
        - from: price
          to: valuation
    claimRefs:
      - CR042
      - CR017
      - CR018
      - CR019
      - CR038
      - CR039
      - CR040
  - id: FR003
    title: 依赖图
    type: dag
    layout: standard
    summary: 依赖图强调，o9 的风险不是来自单一上游供应商，而是经由合作伙伴、客户背书、投资人支持和拥挤的规划替代方案传导。
    approximationNotes: 节点分组看的是投资判断相关性，而非穷尽式组织图。
    data:
      nodes:
        - id: o9
          label: o9 平台
        - id: si
          label: 实施合作伙伴
        - id: cust
          label: 客户背书
        - id: invest
          label: 现有投资人
        - id: comp
          label: 规划竞争对手
        - id: roi
          label: 可见 ROI / 信任
      edges:
        - from: si
          to: o9
        - from: cust
          to: roi
        - from: o9
          to: roi
        - from: invest
          to: o9
        - from: comp
          to: roi
        - from: roi
          to: invest
    claimRefs:
      - CR043
      - CR013
      - CR014
      - CR020
      - CR033
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 流程从质量信号和品类相关性出发，穿过分母不确定性和披露风险，最后落到「继续研究」建议。
    approximationNotes: 流程只展示方向性逻辑，不做概率加权。
    data:
      nodes:
        - id: quality
          label: 质量信号：投资人背书 + 分析师认可
        - id: category
          label: 大型规划软件品类
        - id: denom
          label: 公开收入估计相互冲突
        - id: disclosure
          label: 没有经审计的最新私营公司披露
        - id: price
          label: 上一轮投资判断对价格敏感
        - id: rec
          label: 建议：继续研究
      edges:
        - from: quality
          to: price
        - from: category
          to: price
        - from: denom
          to: price
        - from: disclosure
          to: price
        - from: price
          to: rec
    claimRefs:
      - CV041
      - CV033
      - CV034
      - CV036
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 柱状图显示，同一轮 $3.7B 融资，在不同公开分母和同业倍数假设下，会对应很不一样的隐含支撑水平。
    approximationNotes: 数值只是方向性支撑标记，不是精确目标价。
    data:
      items:
        - label: o9（按 $157.5M 估计）
          value: 23.5
        - label: o9（按 $703.9M 估计）
          value: 5.3
        - label: Kinaxis EV / 收入
          value: 4.28
        - label: Manhattan EV / 收入
          value: 7.53
        - label: 示意性基准支撑区间
          value: 6
