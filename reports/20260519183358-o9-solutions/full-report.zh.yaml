companyProfile:
  summary: >-
    o9 Solutions 是一家位于 Dallas 区域的私有软件公司，成立于 2009 年，向供应链复杂的大型企业销售 AI 原生规划与决策平台。其 Digital Brain 平台借助 Enterprise Knowledge
    Graph，把供应链、商业和财务职能中的数据、约束和决策工作流连接起来。公司最近一次披露是在 2023 年 7 月，以 $3.7 billion 估值完成 $116 million
    融资；此后仍把自己定位为供应链规划和决策智能领域的领导者。公开客户证据和伙伴评论都支持一个判断：o9 是真实的品类资产，但经审计财务和当前业务准确规模仍未公开。
