              o9 客户侧的反向情景不是公开证据造假，而是耐久性这一层仍过于不透明。最强批评信号是间接的。Lokad 把 o9 描述为一个真实但配置很重的规划环境，公开证据在透明量化机制上更弱。Blind
              只提供很薄的员工评价表面，弱到不能支撑硬运营结论，但也不是干净的支持质量背书。诉讼报道提出另一类客户风险：Heise 称 o9 在 SAP 纠纷中把 Henkel
