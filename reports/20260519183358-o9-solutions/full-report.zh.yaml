      - number: '4.2'
        title: 公开牵引力、互相冲突的估计与单位经济缺口
        blocks:
          - type: paragraph
            body: >-
              公开牵引力信号令人鼓舞，但并不均匀。o9 的 2023 年融资材料指出，ARR 增长截至 2023 年 Q2 为 55%，截至 2023 年 Q1 则更高，为 67%。2025 年 Gartner
              关联新闻稿显示客户情绪强劲：94% 愿意推荐，评分 4.8/5；第三方数据库则试图用收入、销售代表和员工数估计填补私有公司披露缺口。问题在于，这些估计对不齐。GetLatka 称 2024 年收入达到
              $157.5 million，且 2025 年末公司有 3.3 thousand 名员工；CompWorth 指向 3,500 多名员工，并给出一个按人均收入推导出高得多收入基数的比例；FreightWaves
              则引用约 2,500 名员工和 17
              个办公室。这个跨度太大，难以让人安心。它意味着单位经济工作主要仍是在识别缺失字段——毛利率、NRR、CAC、回本周期和实际定价——而不是确认一个可信的公开运营模型。Kinaxis 和 Manhattan
              等公开可比公司之所以有用，正是因为它们显示 o9 仍缺多少披露；它们能界定品类，却无法修复公司自身的底层不透明。
