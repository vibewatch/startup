      - number: '1.4'
        title: 反向信号与待解问题
        blocks:
          - type: paragraph
            body: >-
              当前公开记录里最主要的反向信号，是 o9 在 2025 年 11 月针对 SAP 和三名前 o9 高管提起的商业秘密诉讼。o9 自身新闻稿、D CEO 和 Heise 的基本指控一致：o9 称 SAP
              和前内部人员滥用了与 Enterprise Knowledge Graph 架构、产品路线图、定价、客户用例和销售策略有关的机密材料。公开报道还称，前高管离职前据称下载了 20,000
              多份文件；即使法律实质尚未裁定，这也已经提出明显的治理、安全和人员留存问题。SAP 的回应仅限于表示会审阅诉状并在法律程序中回应。诉讼之外，Lokad 2026 年 4
              月的独立评测是一个较温和但有用的反向来源：它承认 o9
              有真实平台广度，同时仍质疑技术透明度和优化深度。剩余尽调缺口则是私有公司的典型问题：准确员工数、完整董事会构成、股权结构表所有权、经审计收入或盈利数据，在公开语料中仍不可得。
