  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              o9 Solutions 把自己呈现为一家位于 Dallas 区域的企业 AI 软件公司，核心是 Digital
              Brain：它不是单一规划点工具，而是跨职能规划与决策平台。官方材料一贯称，该产品连接供应链、收入、P&L、采购、财务及相邻决策工作流。架构中心是 Enterprise Knowledge
              Graph，公司和伙伴资料把它描述为数据与逻辑层，让平台扎根于企业语境。重点在这里：公司卖的不是狭窄预测模块，而是覆盖大企业数据、用户和决策的广义集成规划系统。公开身份资料还强调创始人连续性、客户聚焦、全球团队，以及帮助客户落地数字化转型项目的伙伴生态。Lokad
              的独立评测大体证明 o9 是严肃的规划套件厂商，平台有真实厚度，但也质疑底层决策逻辑的透明度。
