  - id: TV001
    title: 建议摘要表
    columns:
      - 决策字段
      - 当前观点
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 公司质量信号很强，但仅凭公开证据还不足以干净地承销新资金。
      - - 确信度
        - 中
        - 战略叙事可信，但收入分母和股权结构不确定性仍太重要，不能忽略。
      - - 风险评级
        - 高
        - 即便需求不崩，倍数压缩、披露不透明和竞争也会削弱估值支撑。
      - - 估值立场
        - 偏高至合理
        - 只有真实收入基础显著高于最低一组公开估计，估值才算合理。
      - - 入场纪律
        - 价格敏感、披露敏感
        - 更低价格或更强证据，比笼统热情更能改变结论。
      - - 今日行动
        - 保持跟踪，但要求更多尽调
        - 从继续研究转向买入前，要求接近审计级的披露和清晰条款。
    notes: 该建议有意保持价格敏感：这不是脱离入场估值的泛泛公司质量评分。
    claimRefs:
      - CV001
      - CV007
      - CV020
      - CV033
      - CV034
      - CV035
      - CV036
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 方向
      - 什么会改变观点
    rows:
      - - 公司有真实投资者背书、品类相关性，也持续获得分析机构认可。
        - 投资逻辑
        - 更多经审计的财务质量证明，会把这家公司从“有意思”推到“可行动”。
      - - 如果真实收入基础远高于保守公开估计所暗示的水平，2023 年那轮融资仍可能说得通。
        - 投资逻辑
        - 经审计的当前收入和利润率，会把倍数桥从假设变成明确测算。
      - - 规划软件是大品类，强执行可以拿到优质软件倍数。
        - 投资逻辑
        - 持久定价权和留存证据，会强化溢价逻辑。
      - - 当前公开收入估计分歧过大，无法支撑单一精确倍数。
        - 反向逻辑
        - 对齐后的分母会显著提升对估值立场的信心。
      - - 品类竞争拥挤，泛泛的 AI 说法本身撑不起长期稀缺性溢价。
        - 反向逻辑
        - 独立证据若证明结果更好或切换成本更高，会缓和这一担忧。
      - - 私营公司披露质量仍低于投资者从上市规划软件可比公司能拿到的水平。
        - 反向逻辑
        - 提供接近上市公司质量的私密资料室披露，覆盖收入、利润率、留存和条款。
    notes: 反向逻辑不是 o9 很弱，而是相对当前要价，估值桥仍交代得不够清楚。
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV027
      - CV028
      - CV030
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 收入质量接近公开估计上沿，AI 定位转化为溢价定价，披露改善。
        - $3.8B-$5.5B 区间；优质规划软件倍数仍能站住。
        - 执行滑坡、条款不透明或利润率质量偏弱，都会打破该情景。
        - 有可能，但仅凭公开材料证据偏薄。
      - - 基准
        - 收入落在互相冲突的公开估计之间，市场支撑接近高质量规划软件可比公司。
        - $2.2B-$3.8B 区间；按上一轮估值大致已满。
        - 需要更好的收入质量和条款披露，才会变得有吸引力。
        - 今天仅凭公开资料最站得住的情景。
      - - 悲观
        - 收入更接近保守估计组，市场给出类似 Kinaxis 或更低的支撑倍数。
        - $0.8B-$2.2B 区间；下行更多由分母风险驱动，而不是产品崩塌。
        - 如果披露仍弱，品类竞争和估值压缩会迅速叠加。
        - 若低估计组方向正确，该情景很容易自洽。
    notes: 这些区间是情景估计，不是投行级公平性意见。它们有意把分母不确定性摆在台面上，而不是强行给出一个精确收入数字。
    claimRefs:
      - CV007
      - CV024
      - CV025
      - CV026
      - CV037
      - CV038
      - CV039
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - o9 按 Latka 分母
        - 2024 年收入 / ARR 估计
        - 倍数：$3.7B / $157.5M ≈ 23.5x
        - 显示在保守公开估计组下，这轮融资看起来有多偏高。
        - 该估计置信度低，且可能无法与经审计经常性收入可比。
      - - o9 按 CompWorth 分母
        - 收入估计
        - 倍数：$3.7B / $703.9M ≈ 5.3x
        - 显示如果高估计方向正确，同一轮融资可接近上市规划软件区间。
        - 该估计置信度低且来自存档；未经审计，也未由管理层调和。
      - - Kinaxis
        - EV / 收入（ttm）
        - 4.28x EV/收入；5.01x P/S
        - 有真实披露和盈利能力的上市供应链编排参照。
        - 业务组合和上市公司治理标准不同。
      - - Manhattan Associates
        - EV / 收入（ttm）
        - 7.53x EV/收入；7.88x P/S
        - 高质量上市规划 / 商务软件参照，投资者级披露扎实。
        - 执行版图更广，终端市场组合不同。
      - - e2open
        - 平台规模 / 申报状态
        - 2025 年 10-K 申报公司；留存语料没有实时 2026 年倍数
        - 可作为互联供应链软件的规模和网络参照。
        - 留存语料未提供截至 2026 年 5 月的当前交易倍数。
      - - RELEX / Anaplan 私营公司参照
        - 私营 / 战略参照
        - 700+ 客户和 IDC 领导者地位支撑品类质量，但没有留存的当前公开倍数
        - 可用于校验战略相关性，但不能把私营估值伪装成当前上市可比。
        - 留存语料没有干净的当前交易倍数。
    notes: 这是一组偏部分的可比对象，优先选择可支撑的参照，而不是强求精确。上市可比性在 Kinaxis 和 Manhattan 上最强；私营和状态类行只是背景，不是精确定价锚。
    enumerationScope:
      coverage: partial
      basis: >-
        The table intentionally covers the supportable public and private planning-software references present in the
        retained corpus as of 2026-05-19; it is not a full banker-style comp screen across every planning vendor or
        transaction.
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV013
      - CV014
      - CV015
      - CV020
      - CV021
      - CV023
      - CV045
      - CV046
      - CV047
      - CV048
      - CV049
      - CV050
      - CV051
  - id: TV005
    title: 投资逻辑破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 经审计收入质量低于预期
        - 真实经常性收入落在低估计组附近，或利润率质量偏弱
        - 当前轮次从只是估值已满，变成明显偏高
        - 按更低价格预期和更高风险折价重新承销
      - - 股权结构包袱重于预期
        - 参与权、棘轮条款或高级清算优先权显著削弱新资金经济性
        - 同样价格下，好公司也可能变成差投资
        - 暂停，并重新谈条款或退出
      - - 拥挤品类压力压缩溢价
        - 上市规划软件倍数下行，或 AI 差异化难以变现
        - 乐观情景失去稀缺性溢价
        - 估值模型采用类似 Kinaxis 或低于 Kinaxis 的支撑
      - - 独立质量证明落后于公司叙事
        - 没有出现更强的留存、客户背书或经审计披露
        - 继续研究无法升级为买入
        - 维持观察姿态，而不是勉强提高确信度
      - - 运营或法律风险上升
        - 执行、诉讼或治理问题明显恶化
        - 下行情景比基准情景更容易自洽
        - 提高折现率，并缩短可接受持有期假设
    notes: 终止触发因素被定义为会影响价格或打破投资逻辑的事件，而不是泛泛的尽调问题。
    claimRefs:
      - CV020
      - CV021
      - CV024
      - CV025
      - CV026
      - CV035
      - CV036
      - CV040
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计财务
        - 当前收入、毛利率、烧钱速度和服务收入占比
        - 这是任何价格敏感型建议的核心分母和质量桥。
        - 管理层资料室；经审计报表；收入确认备忘录
      - - 股权结构表和条款
        - 清算优先权、棘轮条款、老股交易历史和稀释瀑布
        - 新资金回报取决于条款，而不只是企业价值。
        - 结合法律尽调、融资文件和董事会同意书
      - - 客户质量证明
        - 留存队列、头部客户集中度和扩张证据
        - 溢价倍数需要持久经常性价值，而不只是客户标识或案例。
        - 收入运营材料包加客户背调电话
      - - AI 治理证明
        - AI 功能的可解释性、治理和部署护栏
        - 更广的 AI 定位抬高运营预期，也放大治理风险。
        - 与模型治理负责人开展产品和合规审查
      - - 退出准备度
        - IPO 级披露路径、内控和董事会准备度
        - 可信退出路径会增强对终值支撑和持有期逻辑的信心。
        - 财务和治理尽调；达到上市公司准备度的时间表
    notes: 这些要求是推动结论变化所需的最低材料包，因为公开记录方向上有用，但本身达不到投资级。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV040
      - CV044
      - CV047
      - CV048
      - CV049
      - CV050
      - CV051
