      - number: '3.2'
        title: 能力、定价与渠道对比
        blocks:
          - type: paragraph
            body: >-
              o9 的公开材料一贯强调广度：Digital Brain 被描述为单一规划与执行层，横跨供应链、收入、产品、财务、采购、客户和供应商决策。相比保留的 SAP 和 Oracle
              页面，这是一套更宽的跨职能叙事；后两者更集中在其广义 SCM 资产里的规划。相比保留的 RELEX、e2open 或 Manhattan 页面，o9 也更突出架构。但买家不会只因架构而下单。Kinaxis
              带来公开市场可信度和强编排叙事；RELEX 宣称 700 多个已验证客户，并清晰包装零售深度；Anaplan 和 Manhattan 展示量化客户结果或公开收入数据；e2open
              则讲多企业网络规模。相比之下，o9 保留的官方页面没有展示简单公开价格表。这意味着公司在战略上显得很宽，却仍比那些披露更清晰证明点、公开市场指标或更强 ROI 片段的同业更难做商业比较。落到实际采购，o9
              要求买家在更少公开合同细节下相信一个更大的平台逻辑。大型转型中这种打法可以奏效，但在成本敏感或证据饥渴的竞争评估中，它的位置更弱。
