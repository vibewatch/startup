  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与同业类型
        blocks:
          - type: paragraph
            body: >-
              o9 并不在一个整齐的单一赛道里竞争。保留证据显示，买家有四种互相重叠的方式来解决同一类规划任务。第一类是 Kinaxis、RELEX 等同类最佳规划平台，以及 Blue
              Yonder；虽然后者当前缓存的官方页面不可用，独立市场框架仍把它视作顶级规划同业。第二类是嵌在 ERP 中的既有厂商，如 SAP IBP 和 Oracle Supply Chain
              Planning，把需求、供应、库存和 S&OP 能力封装在更大的企业技术栈里。第三类是相邻供应链网络或执行套件，如 e2open 和 Manhattan
              Associates，它们可以从可视化、物流、商业或履约控制点切入规划预算。第四类是现状方案：电子表格、拼接工具和内部工作流层。这种竞争结构很关键，因为 o9
              的胜利条件不只是“预测更好”，而是说服大企业用一个集成规划模型替换碎片化决策系统。因此，这个品类不是一对一功能对齐，而是谁——厂商或内部技术栈——成为规划决策的运营层。站在买家角度，o9
              的真实替代品往往不是另一个单一 SKU，而是一组 ERP 模块、网络工具、电子表格和系统集成商定制工作。
