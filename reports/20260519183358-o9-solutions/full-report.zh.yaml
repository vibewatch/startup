      - number: '4.3'
        title: 资本充足性、融资依赖与承销阻碍
        blocks:
          - type: paragraph
            body: >-
              近期资本故事方向偏正面，但仍不完整。公司在 2023 年 7 月完成升值轮，说明即使融资市场更艰难，它仍能获得支持性资本；多个数据库也同意累计融资大约在 $500 million
              中段。这降低了近期急性融资压力的概率。但它没有解决承销问题，因为保留的公开来源没有披露当前现金、月度烧钱速度、债务余量或现金跑道，也没有展示毛利率、NRR 或客户集中度。2025 年末 SAP
              诉讼又增加一个变量：即使案件最终有利于
              o9，诉讼仍会消耗时间和资金，而公司仍保持私有且不透明。因此，我的财务结论是混合的。如果平台确实能跨职能扩张，收入质量可能有吸引力；投资人支持看起来也真实。但如果没有管理层直接提供流动性和效率数据，融资依赖仍无法完全圈定。换句话说，最新融资轮降低了即时困境风险，但在做出严肃估值结论之前，仍需要完整的数据室级现金、债务和效率审查。公开证据足以支持继续尽调，但不足以写出高信心承销备忘录。公司仍需要更多披露。
