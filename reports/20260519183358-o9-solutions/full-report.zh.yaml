              运营规模方向清楚，但并不完全透明。公开来源支持一个判断：o9 是一家规模较大、全球分布的私有软件公司，企业覆盖面有分量，但各来源对准确规模并不一致。Dealroom 显示其在 29 个国家有 3,295
              名员工，CompWorth 报告 3,500+ 名员工且增长 9%，而 2025 年末诉讼报道使用的数字更低，为超过 2,500
              名员工。这种冲突本身就是尽调信号，因为准确员工数仍未公开。客户广度比员工数更有把握：D CEO 的诉讼报道称 200 多家公司使用
              o9，并点名多家知名企业客户。公司网站上的印度运营和全球团队表述也让地理覆盖可见。按里程碑看，故事线很干净：2009 年创立，2022 年和 2023 年完成后期融资，随后在 2026
              年仍通过媒体与生态报道保持市场活动。收入更不确定：GetLatka 估计 2024 年收入为 $157.5 million，但那仍是第三方估计，不是经审计披露。
