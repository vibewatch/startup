  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现宽度
        blocks:
          - type: paragraph
            body: >-
              保留的公开证据支持一个软件主导的收入模式：o9 围绕广义企业规划平台收费，而不是围绕单一规划 SKU。General Atlantic 称 o9 是供应链规划 SaaS 提供商，公司自己的 Digital
              Brain
              和首页材料则展示一个横跨供应链、需求、收入、产品和财务决策的规划与执行层。这一框架在财务上很重要，因为它意味着单一账户内有多条扩张路径：先用规划落地，再叠加相邻决策工作流或决策智能用例。不过，同一批保留来源没有给出投资人真正需要的变现细节。公开渠道看不到简单标价表，没有披露模块级收入结构，也没有展示实际
              ACV
              或折扣结构。因此，正确的财务读法是“变现表面积很宽，但单位价格不透明”，而不是“软件经济模型完全可见”。换句话说，公开记录足以支持软件广度和变现可选性，却不足以建模合同实际产出，也不足以拆分订阅经济与服务、支持负担。这个区别很重要，因为宽平台范围仍可能与一般的实际定价、沉重服务拖累或装机账户内低于预期的扩张并存。当前公开记录还不能让投资人有信心地解开这些取舍。
