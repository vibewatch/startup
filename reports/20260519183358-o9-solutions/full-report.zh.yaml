    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 评分卡给市场相关性和产品广度的分数高于证据质量和估值支撑，因此建议仍是「继续研究」。
    approximationNotes: 分数是研判性的 0–10 风格标记，为了显示一致性换算为 0–100 数值。
