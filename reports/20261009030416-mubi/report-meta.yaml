companyProfile:
  summary: >-
    MUBI is a growth-stage private arthouse streaming and film distribution company founded in 2007 by Efe Cakarel. It
    combines curated subscription video-on-demand, MUBI GO cinema ticketing, theatrical distribution, publishing, and
    selective film production across more than 190 territories, with a 2025 Sequoia-led financing round valuing it at
    $1.0 billion and a 2026 rebound to 1.7 million subscribers.
