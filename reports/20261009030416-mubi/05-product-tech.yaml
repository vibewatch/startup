  - id: TE002
    title: Cinephile Workflow and Exhibition Use-Case Map
    columns:
      - User Persona & Job
      - Legacy Alternative Workflow
      - MUBI Platform Solution
      - Measurable Benefit
      - Technical & Operational Limitation
    rows:
      - - Independent Film Discovery
        - Endless scrolling through massive algorithmic libraries (Netflix/Prime)
        - Single daily spotlight film with 30-day rotating availability window
        - Elimination of decision fatigue; exposure to award-winning global auteurs
        - Limited back-catalog depth compared to mass streaming aggregators
      - - Theatrical Arthouse Attendance
        - Full-price box office ticket purchase at independent theaters
        - MUBI GO weekly digital ticket QR code integrated into monthly subscription
        - Zero marginal box-office cost per selected film for active subscribers
        - Restricted to participating venues; tickets must be redeemed in-person on release week
      - - Global Film Festival Follow-up
        - Waiting months for localized DVD releases or limited festival touring
        - Rapid day-and-date or exclusive windowed digital SVOD streaming release
        - Immediate legal global access to Cannes, Venice, and Sundance award-winners
        - Territorial licensing boundaries causing regional catalog disparities
      - - Film Criticism & Context
        - Fragmented search across academic journals and movie blogs
        - Integrated Notebook editorial platform alongside streaming playback
        - Contextual essays, director commentary, and deep cinematic literacy
        - Editorial content weakly coupled to interactive streaming UI playback controls
    notes: Analysis based on MUBI consumer features, Screen Daily reports, and TechCrunch product coverage.
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE006
      - CE007
  - id: TE003
    title: Technology and Operating Architecture Map
    columns:
      - Layer / Component
      - Role & Functionality
      - Key Technical Dependency
      - Primary Operational & Scalability Risk
    rows:
      - - Multi-Client Frontend Applications
        - Cross-platform video streaming playback and browsing UI
        - Native iOS/Android SDKs, smart TV apps, HTML5 web players
        - Fragmented client device maintenance across hundreds of smart TV models
      - - Streaming Delivery & Transcoding
        - Adaptive bitrate encoding, packaging, and edge CDN delivery
        - Third-party cloud infrastructure, CDN caching nodes, multi-DRM licensing
        - Bandwidth transit costs and peak streaming concurrency during premiere releases
      - - Curation & Catalog Scheduling Engine
        - Automated daily title rotation, metadata tagging, and geo-filtering
        - Proprietary database rules and territorial rights management tables
        - Accidental territory rights leakage and complex cross-border license tracking
      - - MUBI GO Venue Integration Engine
        - Ticketing allocation, daily QR code validation, and cinema settlement
        - Direct cinema exhibitor ticketing APIs, POS integrations, venue capacity feeds
        - POS connectivity outages, venue settlement reconciliation errors, and seat caps
      - - Data & Acquisition Analytics Platform
        - Viewer engagement data aggregation informing theatrical rights bidding
        - Event streaming telemetry, viewing completion logs, and subscriber cohort models
        - Distributor skepticism regarding proprietary viewer data vs verified box-office metrics
    notes: Architecture components inferred from developer engineering analyses, tech stack directories, and executive interviews.
    claimRefs:
      - CE001
      - CE004
      - CE008
      - CE010
      - CE012
