callouts:
  - calloutType: insight
    title: The Curation Flywheel vs Algorithmic Volume
    body: 'MUBI core technical moat is counter-intuitive: rather than investing hundreds of millions in algorithmic recommendation engines, MUBI uses human editorial curation and exclusive theatrical windows as an intentional constraint. By presenting a focused 30-film rotation alongside an expanded prestige catalog, MUBI eliminates subscriber decision paralysis and lowers customer acquisition costs across a dedicated cinephile demographic.'
    claimRefs:
      - CE001
      - CE002
      - CE012
  - calloutType: risk
    title: Audience Brand Sensitivity and Investor Backlash Vulnerability
    body: MUBI operates in a highly politicized, culturally sensitive arthouse niche where consumer brand alignment is fragile. The fallout from its 2025 Sequoia Capital round demonstrated that financing decisions can directly induce catastrophic subscriber churn (shedding 200,000 subscribers) and institutional boycotts by partner film festivals, presenting a critical non-technical operational risk.
    claimRefs:
      - CE014
      - CE015
      - CE016
