callouts:
  - calloutType: "risk"
    title: "Community Brand Fragility and Mission Alignment"
    body: "MUBI's subscriber base is uniquely characterized by ideological alignment and active cinephile participation. As demonstrated by the loss of over 200,000 subscribers and high-profile festival cancellations following the Sequoia Capital investment controversy, brand trust is fragile. For consumer lifestyle platforms in mission-driven cultural niches, financial decisions that clash with subscriber political values represent direct customer churn risks."
    claimRefs:
      - "CU003"
      - "CU006"
      - "CU007"
      - "CU008"
  - calloutType: "insight"
    title: "Resilience Through Exclusive Theatrical Distribution"
    body: "Despite severe brand friction in late 2025, MUBI's rapid rebound to 1.7 million subscribers by Q1 2026 highlights the power of its end-to-end studio model. By acquiring all-rights distribution for critical awards contenders like The Substance and Oscar-nominated international films, MUBI creates exclusive content moats that compel arthouse moviegoers to return to the platform regardless of management controversies."
    claimRefs:
      - "CU003"
      - "CU005"
      - "CU009"
