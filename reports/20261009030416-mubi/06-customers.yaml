chapter:
  number: 6
  title: "Customers"
  summary: "MUBI serves a dedicated core of cinephiles, global arthouse streamers, theatrical patrons, and independent festival partners across 190 countries. While theatrical flagship releases and international distribution expanded its subscriber base to a record 1.7 million by Q1 2026, the service experienced severe subscriber volatility, shedding over 200,000 subscribers and burning $65 million in cash in late 2025 following community and festival backlash over controversial venture capital financing."
sections:
  - id: "customer-segmentation-and-demographics"
    title: "Customer Segmentation and Audience Profile"
    body: "MUBI segments its audience across dedicated cinephiles, general art-film streaming subscribers, hybrid theatrical patrons using MUBI GO, and institutional film festival and university partners [CU001, CU002, CU004]. The core consumer base skews younger, urban, and politically left-leaning, concentrated in European, North American, and Latin American cultural centers [CU004, CU006]. In addition to individual subscribers paying monthly or annual subscription fees, MUBI engages theatrical exhibition chains such as Vue and independent cinemas across the UK, Europe, and Latin America through its MUBI GO subscription and distribution business [CU001, CU004, CU010]. Institutional partners including international film festivals and independent exhibition venues act as critical audience acquisition channels and cultural gatekeepers, though recent ethical controversies highlighted acute vulnerability within these mission-driven relationships [CU006, CU007]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
      - "CU006"
      - "CU007"
      - "CU010"
      - "CU012"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-subscriber-volatility"
    title: "Adoption Trajectory and Subscriber Volatility"
    body: "MUBI experienced dramatic subscriber and operational volatility across 2024–2026 [CU003, CU005, CU008]. Driven by the critical and box-office success of The Substance, which grossed $77 million theatrically, subscriptions surged to 1.44 million in spring 2025 [CU003, CU005]. However, following public controversy regarding a $100 million financing round from Sequoia Capital in May 2025, MUBI missed its 2 million subscriber target and shed over 200,000 subscribers, dropping to 1.2 million subscribers by year-end 2025 [CU003, CU005, CU008]. Subscriber churn was compounded by the box-office underperformance of Lynne Ramsay's Die My Love, which grossed $12 million against a $24 million acquisition cost, driving a $7.3 million operating loss and $65 million of negative cash flow in Q4 2025 [CU003, CU008, CU009]. Subscriptions subsequently rebounded to a record 1.7 million in Q1 2026, buoyed by awards-season theatrical momentum and slate additions, demonstrating audience resilience alongside high headline volatility [CU003, CU005]."
    claimRefs:
      - "CU003"
      - "CU005"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-deployments-and-exhibition-partnerships"
    title: "Institutional Partnerships and Exhibition Proof"
    body: "MUBI's commercial and community proof relies heavily on strategic partnerships with independent film festivals, cinema exhibition circuits, and co-financing institutions [CU004, CU006, CU007, CU010]. In theatrical ticketing, MUBI GO operates across UK multiplex chains including Vue (87 sites) alongside prominent independent venues such as the Barbican, ICA, Genesis, Rio Cinema, and HOME Manchester [CU010]. Production and distribution partnerships include multi-year co-financing agreements with European media investment managers like IPR.VC to finance auteur slates [CU004]. However, partnership durability faces friction when corporate financing decisions conflict with the political values of arts organizations; the Los Angeles Festival of Movies (LAFM) explicitly terminated MUBI as presenting sponsor ahead of its 2026 festival, while planned MUBI Fest events in Latin America and community brand collaborations were canceled or boycotted [CU006, CU007]."
    claimRefs:
      - "CU004"
      - "CU006"
      - "CU007"
      - "CU010"
    tableRefs:
      - "TU003"
  - id: "retention-expansion-and-concentration-risks"
    title: "Retention Dynamics and Channel Concentration Risks"
    body: "Customer retention at MUBI is governed by the delicate balance between niche editorial curation and commercial studio expansion [CU002, CU011]. Early adopters and community cinephiles have expressed concern that platform merchandising increasingly prioritizes in-house MUBI theatrical productions over eclectic global discovery [CU002]. Furthermore, MUBI's growth strategy depends on major theatrical acquisitions and high-prestige festival visibility, exposing consumer retention to hit-driven slate performance and reputational sensitivity [CU003, CU006, CU009]. Internal restructuring in late 2025 resulted in a content leadership overhaul and exit packages for staff, reflecting ongoing organizational adjustments as the company balances subscriber expansion against curated brand identity [CU011]."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU006"
      - "CU009"
      - "CU011"
