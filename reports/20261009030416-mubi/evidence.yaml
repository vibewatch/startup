  - type: private-evidence-only
    severity: material
    topic: segment-revenue
    missingEvidence: >-
      Audited financial breakdown of revenue and gross profit split across direct-to-consumer SVOD, MUBI GO cinema
      ticketing, and theatrical rights distribution.
