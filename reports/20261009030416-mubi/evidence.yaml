  - type: private-evidence-only
    severity: material
    topic: financial-breakdown
    missingEvidence: >-
      Audited segment reporting breaking down revenue and gross margins across core digital SVOD, MUBI GO cinema
      admissions, theatrical distribution, and publishing.
    whyItMatters: >-
      Without segmented financial disclosures, it is impossible to evaluate whether core digital streaming subsidizes
      high-risk theatrical distribution or if MUBI GO generates positive unit contribution margins.
    diligencePath: >-
      Request private investor reporting pack, audited UK statutory accounts, or detailed management accounts for MUBI
      Limited.
