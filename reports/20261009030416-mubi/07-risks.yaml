chapter:
  number: 7
  title: "Risks"
  summary: "MUBI operates at the high-friction intersection of premium auteur culture and capital-intensive film distribution, facing acute reputational vulnerability from controversial funding, severe multi-million-dollar theatrical cash drawdowns, and intensifying regulatory scrutiny across its core subscription billing practices."
sections:
  - id: "reputational-and-governance-fallout"
    title: "Reputational Vulnerability and Governance Fallout"
    body: "MUBI’s brand equity relies heavily on an engaged community of indie filmmakers, progressive audiences, and festival partnerships. That cultural capital was severely compromised following a $100 million venture investment from Sequoia Capital in May 2025 at a $1 billion valuation. Disclosures of Sequoia's broader portfolio holdings, specifically Israeli military technology startup Kela, ignited intense industry backlash amid the ongoing conflict in Gaza. Approximately half of MUBI’s 400-person workforce anonymously signed an internal protest letter demanding the return of the investment and the removal of Sequoia partner Andrew Reed from the board. Prominent cultural institutions and creators promptly severed ties: the Los Angeles Festival of Movies dropped MUBI as its presenting sponsor, multiple MUBI Fest events were canceled, and Oscar-winning filmmakers behind No Other Land declined distribution. The fallout catalyzed a net loss of over 200,000 subscribers in the latter half of 2025, depressing paid members to 1.2 million against an internal year-end target of 2 million. Although management published an Ethical Funding and Investment Policy and subsequently reported a rebound to 1.7 million subscribers by spring 2026, residual reputational fragility remains elevated."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "theatrical-slate-and-cash-flow-drawdowns"
    title: "Theatrical Acquisition Volatility and Working Capital Drag"
    body: "MUBI’s strategic shift from a pure-play curated SVOD service to an active global theatrical buyer introduces massive single-title commercial exposure. In 2025, MUBI acquired global rights to Lynne Ramsay’s Die, My Love at Cannes for a reported $24 million minimum guarantee, but the feature generated only $12 million in worldwide theatrical box office receipts. Compounding theatrical acquisition amortization and marketing commitments, MUBI suffered a negative cash flow of $65 million in Q4 2025 and recorded a full-year accounting loss of $7.3 million on approximately $200 million in revenue. While breakout theatrical acquisitions like The Substance grossed over $80 million, hit-driven volatility creates uneven liquidity cycles. To mitigate single-title underwriting risk, MUBI entered a multi-year co-financing alliance with Helsinki-based fund manager IPR.VC to co-fund European auteur projects such as Paweł Pawlikowski’s Fatherland. However, the requirement to support expensive theatrical releasing schedules, award campaigns, and physical footprint expansion into owned venues like cinemas in Los Angeles and Mexico City represents a persistent drain on working capital."
    claimRefs:
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
    tableRefs:
      - "TR002"
  - id: "regulatory-compliance-and-exhibition-dependencies"
    title: "Consumer Compliance Enforcement and Exhibition Partner Friction"
    body: "Operational and compliance risks are highlighted by legal scrutiny over subscription billing and physical exhibition economics. In March 2026, MUBI received preliminary court approval for a $1.6 million class action settlement resolving allegations that it violated California's Automatic Renewal Law by renewing memberships without required statutory disclosures and consumer consent across 37,786 identified accounts. This settlement mandates nationwide disclosure enhancements and payment operations diligence. Concurrently, MUBI’s hybrid cinema-going benefit, MUBI GO, exposes the company to cinema chain dependencies and cost escalation. MUBI GO incurs millions of dollars in ticket reimbursement outlays to participating venues, while prestigious indie exhibitors in high-demand urban centers resist MUBI's discounted ticket pricing structures. Furthermore, MUBI's strict contractual policy requiring all venues in a chain to participate has created negotiating friction with leading theater operators. These consumer-protection liabilities and exhibition partner constraints limit rapid geographic expansion while raising service-level delivery overhead."
    claimRefs:
      - "CR014"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR003"
