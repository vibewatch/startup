callouts:
  - calloutType: "risk"
    title: "Brand Vulnerability in Auteur Ecosystems"
    body: "MUBI's core monetization model relies on positioning itself as a moral and aesthetic sanctuary for independent cinema. The intense community and staff reaction to the Sequoia investment demonstrates that conventional Silicon Valley financing structures carry acute asymmetric reputation risk when grafted onto culturally politicized creative audiences."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
  - calloutType: "insight"
    title: "Asymmetric Volatility in Theatrical Minimum Guarantees"
    body: "While blockbuster breakout titles like The Substance can deliver massive box office windfalls, competitive festival bidding wars create extreme downside exposure. The $24 million acquisition of Die, My Love against a $12 million theatrical gross illustrates how a single underperforming theatrical bet can trigger multi-million-dollar cash burn spikes."
    claimRefs:
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR012"
