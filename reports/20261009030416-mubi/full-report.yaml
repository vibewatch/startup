  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Investment Thesis
      - Core Anti-Thesis
      - Thesis-Changing Trigger
    rows:
      - - Audience & Brand
        - Loyal global cinephile base valuing editorial curation over algorithmic content
        - Highly sensitive political audience prone to rapid boycotts and high-friction churn
        - Documented sustained retention through controversial news cycles or mainstream brand dilution
      - - Content Pipeline
        - Tier-one film festival awards (Cannes, Venice, Oscars) drive low-cost customer acquisition
        - High minimum guarantee commitments and marketing costs create severe theatrical margin volatility
        - Audited multi-year theatrical slate profitability or third-party co-financing covering majority of MGs
      - - Business Model
        - Integrated flywheel linking physical theatrical ticketing (MUBI GO) with recurring digital SVOD
        - Capital-intensive physical infrastructure (cinemas, ticketing subsidies) dilutes pure-play digital margins
        - Demonstrated positive net cash flow across full operating cycle without external equity rounds
      - - Capital Structure
        - Backing by premier growth sponsors including Summit Partners and Sequoia Capital
        - Potential governance deadlock and preference overhang from $1.0B post-money valuation mark
        - Clean single-class recapitalization or public listing pricing with unencumbered common equity
    notes: Contrasts structural operating advantages against identified execution and market vulnerabilities.
    claimRefs:
