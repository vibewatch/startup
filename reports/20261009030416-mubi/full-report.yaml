      - number: '7.3'
        title: Consumer Compliance Enforcement and Exhibition Partner Friction
        blocks:
          - type: paragraph
            body: >-
              Operational and compliance risks are highlighted by legal scrutiny over subscription billing and physical
              exhibition economics. In March 2026, MUBI received preliminary court approval for a $1.6 million class
              action settlement resolving allegations that it violated California's Automatic Renewal Law by renewing
              memberships without required statutory disclosures and consumer consent across 37,786 identified accounts.
              This settlement mandates nationwide disclosure enhancements and payment operations diligence.
              Concurrently, MUBI’s hybrid cinema-going benefit, MUBI GO, exposes the company to cinema chain
              dependencies and cost escalation. MUBI GO incurs millions of dollars in ticket reimbursement outlays to
              participating venues, while prestigious indie exhibitors in high-demand urban centers resist MUBI's
              discounted ticket pricing structures. Furthermore, MUBI's strict contractual policy requiring all venues
              in a chain to participate has created negotiating friction with leading theater operators. These
              consumer-protection liabilities and exhibition partner constraints limit rapid geographic expansion while
              raising service-level delivery overhead.
            claimRefs:
              - CR014
              - CR015
              - CR016
