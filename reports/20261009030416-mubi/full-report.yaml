      - number: '3.3'
        title: Moat Durability, Switching Costs, and Content Acquisition Exposure
        blocks:
          - type: paragraph
            body: >-
              MUBI's competitive differentiation rests on editorial curation, auteur brand equity, and co-financing
              partnerships that lock in festival distribution rights. Through multi-year co-financing agreements with
              investment fund managers like IPR.VC, MUBI secures global distribution and theatrical pipelines for
              European auteur projects including Paweł Pawlikowski's Fatherland and Felix van Groeningen's Let Love In.
              However, switching costs for consumers remain negligible: subscribers easily multi-home or churn across
              low-friction monthly subscriptions. Furthermore, MUBI's strategic escalation into high-dollar film rights
              acquisitions exposes the business to extreme box-office volatility, demonstrated by Lynne Ramsay's Die My
              Love, which grossed only $12 million against a reported $24 million acquisition cost. This theatrical risk
              profile is further compounded by severe ethical backlash from institutional funding ties, resulting in
              prominent festival partner boycotts and cultural friction.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Hybrid Streamer-Distributor Wedge
            body: >-
              MUBI avoids direct catalog warfare with mass SVOD platforms by pairing hand-picked auteur curation with
              MUBI GO theatrical tickets and direct theatrical distribution. This creates a cultural brand that
              generalist algorithm-driven streamers cannot replicate, converting cinephile hobbyists into recurring
              ecosystem subscribers.
            calloutType: insight
            claimRefs:
              - CP001
              - CP004
              - CP010
          - type: callout
            title: Exposure to Theatrical Volatility and Ethical Capital Sensitivity
            body: >-
              By escalating into multi-million dollar film acquisitions such as Die My Love and accepting capital from
              defense-linked institutional investors like Sequoia, MUBI has exposed its business to box-office
              write-downs and severe cultural boycotts from its core progressive cinephile base.
            calloutType: risk
            claimRefs:
              - CP012
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Monetization Model, and Top-Line Trajectory
        blocks:
          - type: paragraph
            body: >-
              MUBI operates a multi-pronged commercial model spanning consumer subscription video-on-demand (SVOD),
              hybrid theatrical ticketing via MUBI GO, worldwide all-rights film distribution, and production
              co-financing. For fiscal 2025, MUBI generated approximately $200 million in revenue, representing
              substantial top-line scaling from its earlier niche footprint. The foundation of this revenue remains
              recurring consumer subscriptions, which initially expanded on a low-cost curated carousel model of thirty
              hand-picked titles rotating daily at entry pricing of five dollars per month before stepping up to
              regional list pricing such as seven pounds ninety-nine pence per month in the United Kingdom. In mature
              metropolitan territories, the company bundles MUBI GO, providing subscribers one theatrical cinema ticket
              per week for curated partner releases, funded by discounted exhibitor seat reimbursements. Beyond
              direct-to-consumer digital subscriptions, MUBI has expanded aggressively into theatrical film distribution
              and sub-licensing, monetizing box office receipts from festival acquisitions and retaining streaming
              rights for its global digital catalog.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI008
