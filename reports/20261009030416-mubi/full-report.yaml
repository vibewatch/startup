  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Defining MUBI's market boundary requires distinguishing its hybrid cultural model from generic SVOD
              commodity aggregators. While mass-market streamers prioritize high-volume content libraries, MUBI bounds
              its addressable market around curated auteur cinema, international festival titles, repertory
              restorations, and theatrical cinema-going. Included spend spans consumer subscription fees for niche
              video-on-demand catalogs, hybrid theatrical ticketing bundles such as MUBI GO, transactional box office
              spend on distributor releases, and co-financing capital for independent features. Excluded spend comprises
              broad mainstream entertainment, live sports rights, algorithmic ad-supported video, and mass-market
              Hollywood studio franchises. Status-quo substitutes include horizontal streaming giants like Netflix and
              Amazon Prime Video, legacy home physical media, film society memberships, repertory cinema admissions, and
              ad-hoc film festival attendance. In contrast to pure digital platforms, MUBI deliberately merges online
              streaming with in-person theatrical exhibition, positioning physical cinema attendance as a core driver of
              customer engagement and brand loyalty.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
      - number: '2.2'
        title: Addressable Market Sizing Through Multiple Industry Lenses
        blocks:
          - type: paragraph
            body: >-
              Market sizing for MUBI cannot rely on a single unconstrained video streaming estimate, because universal
              streaming TAM figures mask the specific economic realities of high-intent cinephile audiences. Evaluating
              MUBI's market potential requires multiple quantitative lenses spanning broad global streaming, boutique
              arthouse digital distribution, and theatrical box office receipts. On a broad total addressable market
              lens, the global video streaming and theatrical entertainment industry exceeds tens of billions of dollars
              annually, but only a fraction is receptive to uncommercial, auteur-led international cinema. The service
              addressable market narrows to the specialty and independent film sector, where global audiences actively
              seek international festival titles and non-English language cinema. At the service obtainable market
              layer, MUBI has demonstrated the ability to capture approximately 1.7 million paying subscribers globally
              across 190 territories, generating approximately $200 million in top-line revenue run rate. However,
              scaling beyond this core cohort encounters steep customer acquisition hurdles, as demonstrated by the box
              office underperformance of major festival acquisitions such as Die My Love, which grossed only $12 million
              against a $24 million purchase price.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
