  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Reputational Vulnerability and Governance Fallout
        blocks:
          - type: paragraph
            body: >-
              MUBI’s brand equity relies heavily on an engaged community of indie filmmakers, progressive audiences, and
              festival partnerships. That cultural capital was severely compromised following a $100 million venture
              investment from Sequoia Capital in May 2025 at a $1 billion valuation. Disclosures of Sequoia's broader
              portfolio holdings, specifically Israeli military technology startup Kela, ignited intense industry
              backlash amid the ongoing conflict in Gaza. Approximately half of MUBI’s 400-person workforce anonymously
              signed an internal protest letter demanding the return of the investment and the removal of Sequoia
              partner Andrew Reed from the board. Prominent cultural institutions and creators promptly severed ties:
              the Los Angeles Festival of Movies dropped MUBI as its presenting sponsor, multiple MUBI Fest events were
              canceled, and Oscar-winning filmmakers behind No Other Land declined distribution. The fallout catalyzed a
              net loss of over 200,000 subscribers in the latter half of 2025, depressing paid members to 1.2 million
              against an internal year-end target of 2 million. Although management published an Ethical Funding and
              Investment Policy and subsequently reported a rebound to 1.7 million subscribers by spring 2026, residual
              reputational fragility remains elevated.
            claimRefs:
