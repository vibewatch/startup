      - number: '8.2'
        title: Valuation Context, Multiple Realities, and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              MUBI's $1.0B post-money valuation mark—established in May/June 2025 alongside a $100M growth capital
              injection led by Sequoia Capital—represents a rich valuation multiple that is difficult to justify on
              public comparable benchmarks or standalone fundamentals. On an estimated fiscal 2025 top-line revenue of
              approximately $200M, the $1.0B post-money valuation translates to an enterprise value-to-revenue multiple
              of approximately 5.0x trailing revenue. In public markets, mature streaming and digital media
              conglomerates trade at revenue multiples between 1.5x and 3.0x, while traditional independent film
              distribution studios and exhibition chains rarely exceed 1.0x to 1.5x revenue due to high production
              volatility and hit-driven cyclicality. While venture capital sponsors such as Sequoia and largest
              institutional shareholder Summit Partners have historically underwritten MUBI as a hybrid media-tech
              platform capable of commanding software-like multiples, MUBI's actual financial results reveal low
              accounting margins and periodic cash deficits. In 2025, MUBI recorded an accounting net loss of $7.3M on
              its $200M revenue base, while also offering severance buyouts to employees amid internal restructuring. A
              5.0x revenue multiple implies either software-level gross margins above 70% or sustained annual subscriber
              growth above 40%, neither of which is evidenced by public filings. Instead, MUBI's reliance on
              capital-intensive minimum guarantees, physical cinema ticket subsidies via MUBI GO, and physical theater
              construction introduces significant capital intensity. Unless secondary market transactions or private
              growth rounds repricing equity reflect a substantial discount, entering at or near the headline $1.0B
              valuation exposes investors to severe down-round risk upon any future IPO or strategic liquidity event.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV008
              - CV010
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV008
      - number: '8.3'
        title: Scenario Underwriting, Downside Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Underwriting MUBI across bull, base, and bear operating cases illustrates a wide dispersion of valuation
              outcomes centered on subscriber growth, theatrical volatility, and churn management. In a bull case, MUBI
              leverages its rebound to 1.7M subscribers and the prestige of Oscar-winning distribution slates to expand
              global subscriptions toward 3.0M, scaling revenue run-rate to $360M at a stabilized 10% operating margin
              and supporting a $1.2B to $1.5B exit valuation via strategic acquisition or European public listing. In
              the base case, MUBI maintains steady modest growth to 2.1M subscribers with $240M in revenue, but ongoing
              theatrical minimum guarantee outlays and marketing expenditures keep operating margins near break-even (0%
              to 3%), compressing the fair value multiple to 2.5x revenue and yielding an equity valuation of
              approximately $600M. In a bear case, renewed geopolitical controversies or community alienation trigger
              recurrent churn spikes, while high-profile theatrical acquisitions fail at the box office, driving annual
              accounting losses beyond $20M and precipitating a down-round financing or forced sale at $300M to $400M
              (1.5x to 1.8x revenue). Given these dynamics, our recommendation is research-more with medium confidence,
              a high risk rating, and a stretched valuation stance. Formal investment committee approval requires
              addressing several critical diligence gaps: obtaining audited income and cash flow statements detailing
              gross profit splits across SVOD, MUBI GO, and theatrical operations; reviewing cohort-level retention and
              churn bridges during the 2025 subscriber decline; and inspecting cap-table liquidation preferences, senior
              debt covenants, and the implementation of MUBI's promised ethical investment policies.
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV008
              - CV010
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Stance: Research-More on Valuation Multiple Disconnect'
            body: >-
              We recommend a research-more posture on MUBI. While the underlying curation moat and recovery to 1.7M
              subscribers prove audience resilience, underwriting a private $1.0B valuation at 5.0x revenue without
              audited segment contribution margins creates unacceptable downside asymmetry.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV008
              - CV014
          - type: callout
            title: Headline Multiple Compression and Liquidation Preference Overhang
            body: >-
              Securing $100M from Sequoia Capital established a $1.0B post-money valuation mark that outpaces public
              media comps. In any strategic sale or IPO below this mark, senior liquidation preferences could wipe out
              common equity returns.
            calloutType: risk
            claimRefs:
              - CV001
