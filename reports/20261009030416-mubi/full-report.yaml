      - number: '5.2'
        title: Technology Stack, Distribution Logistics, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              MUBI combines cloud-hosted digital media delivery with high-touch physical film distribution logistics
              across more than 190 territories. The digital streaming delivery pipeline relies on multi-platform client
              applications spanning iOS, Android, web browsers, and major smart TV ecosystems, coupled with digital
              rights management (DRM) licensing, multi-bitrate HTTP video encoding, and global content delivery network
              (CDN) edge caching. For the MUBI GO theatrical pass, MUBI integrates digital voucher generation within its
              mobile application directly with participating cinema point-of-sale systems and box-office operations,
              negotiating discounted admission rates directly with commercial multiplex chains like Vue as well as
              independent repertory venues. The physical operating model was fundamentally transformed by the
              acquisition of German sales powerhouse The Match Factory in January 2022 and Benelux distributor Cineart
              in February 2024, enabling MUBI to manage theatrical booking, international festival representation, and
              territorial licensing in-house. While traditional commercial distributors rely on post-hoc theatrical
              box-office returns, MUBI leverages high-frequency viewer interaction data and streaming completion metrics
              to guide theatrical bidding thresholds and multi-year production co-financing commitments, including
              co-financing pacts with institutional fund managers like IPR.VC.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
