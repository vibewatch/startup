chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Footprint, and Business Model
        blocks:
          - type: paragraph
            body: >-
              MUBI was founded in 2007 by CEO Efe Cakarel, originating as a Palo Alto-based cinephile portal named The
              Auteurs before relocating corporate headquarters to London, United Kingdom. Over nearly two decades, MUBI
              transitioned from an online message board and film social database into a multi-territory entertainment
              studio combining subscription video-on-demand (SVOD), weekly theatrical cinema admissions via MUBI GO,
              international film sales, and theatrical distribution. While commercial aggregator directories cite
              approximately 517 employees globally, primary reporting from the Wall Street Journal in 2025 cited
              approximately 400 staffers worldwide. MUBI operates primarily on a direct-to-consumer recurring
              subscription model supplemented by ticket partnerships with theatrical exhibitors and transactional film
              distribution revenues across more than 190 territories.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
