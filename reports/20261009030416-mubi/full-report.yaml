      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Brand Vulnerability in Auteur Ecosystems
            body: >-
              MUBI's core monetization model relies on positioning itself as a moral and aesthetic sanctuary for
              independent cinema. The intense community and staff reaction to the Sequoia investment demonstrates that
              conventional Silicon Valley financing structures carry acute asymmetric reputation risk when grafted onto
              culturally politicized creative audiences.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: Asymmetric Volatility in Theatrical Minimum Guarantees
            body: >-
              While blockbuster breakout titles like The Substance can deliver massive box office windfalls, competitive
              festival bidding wars create extreme downside exposure. The $24 million acquisition of Die, My Love
              against a $12 million theatrical gross illustrates how a single underperforming theatrical bet can trigger
              multi-million-dollar cash burn spikes.
            calloutType: insight
            claimRefs:
              - CR009
