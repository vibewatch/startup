      - number: '1.2'
        title: Executive Leadership, Governance Structure, and Key-Person Exposure
        blocks:
          - type: paragraph
            body: >-
              Corporate leadership remains concentrated in founder and CEO Efe Cakarel, who maintains majority voting
              control of the company's board of directors and majority equity ownership. Former lead engineer Gabe da
              Silveira was appointed Chief Technology Officer and designated co-founder, overseeing platform
              infrastructure. Following the close of Sequoia Capital's $100 million growth equity financing in mid-2025,
              Sequoia partner Andrew Reed joined MUBI's board of directors. The appointment sparked widespread dissent
              among MUBI's workforce and independent film partners due to Sequoia's defense tech portfolio ties,
              prompting filmmaker open letters, festival boycotts, and demands for Reed's removal. Despite public calls
              for structural divestment, Cakarel affirmed that Sequoia remains a minority passive financial investor
              without editorial or programming oversight, leaving substantial strategic key-person risk focused on
              Cakarel himself.
