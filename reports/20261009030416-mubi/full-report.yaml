      - number: '6.4'
        title: Retention Dynamics and Channel Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Customer retention at MUBI is governed by the delicate balance between niche editorial curation and
              commercial studio expansion [CU002, CU011]. Early adopters and community cinephiles have expressed concern
              that platform merchandising increasingly prioritizes in-house MUBI theatrical productions over eclectic
              global discovery [CU002]. Furthermore, MUBI's growth strategy depends on major theatrical acquisitions and
              high-prestige festival visibility, exposing consumer retention to hit-driven slate performance and
              reputational sensitivity [CU003, CU006, CU009]. Internal restructuring in late 2025 resulted in a content
              leadership overhaul and exit packages for staff, reflecting ongoing organizational adjustments as the
              company balances subscriber expansion against curated brand identity [CU011].
            claimRefs:
              - CU002
              - CU003
              - CU006
              - CU009
              - CU011
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Community Brand Fragility and Mission Alignment
            body: >-
              MUBI's subscriber base is uniquely characterized by ideological alignment and active cinephile
              participation. As demonstrated by the loss of over 200,000 subscribers and high-profile festival
              cancellations following the Sequoia Capital investment controversy, brand trust is fragile. For consumer
              lifestyle platforms in mission-driven cultural niches, financial decisions that clash with subscriber
              political values represent direct customer churn risks.
            calloutType: risk
            claimRefs:
              - CU003
              - CU006
              - CU007
              - CU008
          - type: callout
            title: Resilience Through Exclusive Theatrical Distribution
            body: >-
              Despite severe brand friction in late 2025, MUBI's rapid rebound to 1.7 million subscribers by Q1 2026
              highlights the power of its end-to-end studio model. By acquiring all-rights distribution for critical
              awards contenders like The Substance and Oscar-nominated international films, MUBI creates exclusive
              content moats that compel arthouse moviegoers to return to the platform regardless of management
              controversies.
            calloutType: insight
            claimRefs:
              - CU003
