        title: Capitalization History, Investor Base, and Growth Milestones
        blocks:
          - type: paragraph
            body: >-
              MUBI has accumulated roughly $184 million in aggregate disclosed lifetime financing across 11 funding
              rounds, anchored historically by European early-stage funds before securing its $100 million round led by
              Sequoia Capital in mid-2025 at a $1.0 billion post-money valuation. In 2025, MUBI generated approximately
              $200 million in top-line revenue but posted an accounting loss of $7.3 million alongside severe negative
              cash flow of $65 million in Q4 2025, driven by theatrical acquisition outlays such as the $24 million
              commitment for Cannes acquisition Die My Love. In response to commercial volatility and external backlash,
              MUBI established an Ethical Funding and Investment Policy alongside strategic production co-financing
              arrangements, notably a multi-year European auteur film financing pact with Helsinki-based fund manager
              IPR.VC.
