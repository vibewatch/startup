      - number: '6.2'
        title: Adoption Trajectory and Subscriber Volatility
        blocks:
          - type: paragraph
            body: >-
              MUBI experienced dramatic subscriber and operational volatility across 2024–2026 [CU003, CU005, CU008].
              Driven by the critical and box-office success of The Substance, which grossed $77 million theatrically,
              subscriptions surged to 1.44 million in spring 2025 [CU003, CU005]. However, following public controversy
              regarding a $100 million financing round from Sequoia Capital in May 2025, MUBI missed its 2 million
              subscriber target and shed over 200,000 subscribers, dropping to 1.2 million subscribers by year-end 2025
              [CU003, CU005, CU008]. Subscriber churn was compounded by the box-office underperformance of Lynne
              Ramsay's Die My Love, which grossed $12 million against a $24 million acquisition cost, driving a $7.3
              million operating loss and $65 million of negative cash flow in Q4 2025 [CU003, CU008, CU009].
              Subscriptions subsequently rebounded to a record 1.7 million in Q1 2026, buoyed by awards-season
              theatrical momentum and slate additions, demonstrating audience resilience alongside high headline
              volatility [CU003, CU005].
            claimRefs:
              - CU003
              - CU005
              - CU008
              - CU009
