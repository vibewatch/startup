      - number: '7.2'
        title: Theatrical Acquisition Volatility and Working Capital Drag
        blocks:
          - type: paragraph
            body: >-
              MUBI’s strategic shift from a pure-play curated SVOD service to an active global theatrical buyer
              introduces massive single-title commercial exposure. In 2025, MUBI acquired global rights to Lynne
              Ramsay’s Die, My Love at Cannes for a reported $24 million minimum guarantee, but the feature generated
              only $12 million in worldwide theatrical box office receipts. Compounding theatrical acquisition
              amortization and marketing commitments, MUBI suffered a negative cash flow of $65 million in Q4 2025 and
              recorded a full-year accounting loss of $7.3 million on approximately $200 million in revenue. While
              breakout theatrical acquisitions like The Substance grossed over $80 million, hit-driven volatility
              creates uneven liquidity cycles. To mitigate single-title underwriting risk, MUBI entered a multi-year
              co-financing alliance with Helsinki-based fund manager IPR.VC to co-fund European auteur projects such as
              Paweł Pawlikowski’s Fatherland. However, the requirement to support expensive theatrical releasing
              schedules, award campaigns, and physical footprint expansion into owned venues like cinemas in Los Angeles
              and Mexico City represents a persistent drain on working capital.
            claimRefs:
