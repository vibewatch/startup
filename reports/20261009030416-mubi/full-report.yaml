      - number: '6.3'
        title: Institutional Partnerships and Exhibition Proof
        blocks:
          - type: paragraph
            body: >-
              MUBI's commercial and community proof relies heavily on strategic partnerships with independent film
              festivals, cinema exhibition circuits, and co-financing institutions [CU004, CU006, CU007, CU010]. In
              theatrical ticketing, MUBI GO operates across UK multiplex chains including Vue (87 sites) alongside
              prominent independent venues such as the Barbican, ICA, Genesis, Rio Cinema, and HOME Manchester [CU010].
              Production and distribution partnerships include multi-year co-financing agreements with European media
              investment managers like IPR.VC to finance auteur slates [CU004]. However, partnership durability faces
              friction when corporate financing decisions conflict with the political values of arts organizations; the
              Los Angeles Festival of Movies (LAFM) explicitly terminated MUBI as presenting sponsor ahead of its 2026
              festival, while planned MUBI Fest events in Latin America and community brand collaborations were canceled
              or boycotted [CU006, CU007].
            claimRefs:
