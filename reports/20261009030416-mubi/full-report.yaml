      - number: '3.2'
        title: Competitor Profiles, Pricing Models, and Hybrid Exhibition Packaging
        blocks:
          - type: paragraph
            body: >-
              Pricing and packaging across cinephile platforms reflect sharply divergent monetization strategies. In
              France, standard MUBI monthly streaming is priced at €11.99 per month without commitment, while its annual
              commitment drops to approximately €71.88 per year, equivalent to €5.99 per month. For cinephiles seeking
              physical cinema access, MUBI GO costs €18.99 per month and bundles unlimited streaming with one cinema
              ticket per week in partner metropolitan theaters. By comparison, LaCinetek offers classic cinémathèque
              collections curated by film directors at roughly €9.99 per month, UniversCiné provides comprehensive
              French and European indie catalogs at around €5.99 per month or transactional VOD, and Filmo targets mixed
              arthouse and accessible cinema at approximately €6.99 per month. MUBI remains the only platform
              integrating regular theatrical exhibition tickets directly into its recurring subscription bundle.
