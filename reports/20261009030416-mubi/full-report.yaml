      - number: '5.3'
        title: Technical Differentiation, Infrastructure Gaps, and Investor Governance Risks
        blocks:
          - type: paragraph
            body: >-
              MUBI differentiates itself from generic streaming aggregators through its integrated studio flywheel:
              proprietary editorial curation, international sales agency operations via The Match Factory, and
              proprietary audience engagement data that de-risks multi-million-dollar auteur acquisitions. Rather than
              competing in an expensive engineering arms race around generative recommendation algorithms, MUBI treats
              human curation and festival pedigree as its core IP. However, significant product and technical gaps
              persist. MUBI maintains no public developer documentation, open-source API ecosystem, or client SDKs,
              requiring diligence to evaluate its architecture through commercial technology directories, hiring
              records, and developer analyses. Furthermore, MUBI faces operational and governance headwinds stemming
              from capital partner backlash. Following a 100 million dollar financing round in mid-2025 led by Sequoia
              Capital that valued the company at 1 billion dollars, MUBI experienced intense community blowback over
              investor defense ties, resulting in prominent film festival boycotts, the resignation of staff members,
              and the reported loss of 200,000 subscribers in 2025 before rebounding to 1.7 million subscribers in early
              2026. This reputational friction underscores the acute sensitivity of MUBI core cinephile audience to
              brand ethics and governance.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Curation Flywheel vs Algorithmic Volume
            body: >-
              MUBI core technical moat is counter-intuitive: rather than investing hundreds of millions in algorithmic
              recommendation engines, MUBI uses human editorial curation and exclusive theatrical windows as an
              intentional constraint. By presenting a focused 30-film rotation alongside an expanded prestige catalog,
              MUBI eliminates subscriber decision paralysis and lowers customer acquisition costs across a dedicated
              cinephile demographic.
            calloutType: insight
            claimRefs:
              - CE001
              - CE002
              - CE012
          - type: callout
            title: Audience Brand Sensitivity and Investor Backlash Vulnerability
            body: >-
              MUBI operates in a highly politicized, culturally sensitive arthouse niche where consumer brand alignment
              is fragile. The fallout from its 2025 Sequoia Capital round demonstrated that financing decisions can
              directly induce catastrophic subscriber churn (shedding 200,000 subscribers) and institutional boycotts by
              partner film festivals, presenting a critical non-technical operational risk.
            calloutType: risk
            claimRefs:
              - CE014
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Audience Profile
        blocks:
          - type: paragraph
            body: >-
              MUBI segments its audience across dedicated cinephiles, general art-film streaming subscribers, hybrid
              theatrical patrons using MUBI GO, and institutional film festival and university partners [CU001, CU002,
              CU004]. The core consumer base skews younger, urban, and politically left-leaning, concentrated in
              European, North American, and Latin American cultural centers [CU004, CU006]. In addition to individual
              subscribers paying monthly or annual subscription fees, MUBI engages theatrical exhibition chains such as
              Vue and independent cinemas across the UK, Europe, and Latin America through its MUBI GO subscription and
              distribution business [CU001, CU004, CU010]. Institutional partners including international film festivals
              and independent exhibition venues act as critical audience acquisition channels and cultural gatekeepers,
              though recent ethical controversies highlighted acute vulnerability within these mission-driven
              relationships [CU006, CU007].
            claimRefs:
              - CU001
              - CU002
