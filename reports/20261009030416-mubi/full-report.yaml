      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Pathways
        blocks:
          - type: paragraph
            body: >-
              MUBI's user base divides into distinct behavioral cohorts governed by different value propositions and
              willingness to pay. The primary consumer segment consists of urban cinephiles and cultural enthusiasts who
              allocate personal discretionary entertainment budgets to specialty cinema. For this segment, basic
              streaming at $14.99 per month represents an alternative to shrinking studio catalogs, while the $19.99
              premium MUBI GO tier bridges home streaming and weekly theatrical attendance. A second key segment
              comprises independent film production entities, European fund managers such as IPR.VC, and international
              sales agents seeking distribution guarantees and co-financing commitments. The third segment consists of
              independent cinema exhibitors and multiplex chains like Vue that partner on MUBI GO to monetize off-peak
              weekday admissions. Adoption pathways depend heavily on word-of-mouth cultural authority, festival
              prestige, and community goodwill, making the customer relationship unusually fragile when corporate
              decisions clash with subscriber values.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Growth Catalysts, Community Governance, and Market Headwinds
        blocks:
          - type: paragraph
            body: >-
              The primary growth driver for MUBI is the ongoing structural retrenchment of major Hollywood studios and
              legacy SVOD services, which have scaled back acquisitions of mid-budget auteur cinema, creating a supply
              vacuum for prestigious international titles. MUBI capitalizes on this displacement by establishing
              multi-year co-financing alliances, securing theatrical festival sensations such as The Substance, and
              expanding MUBI GO into major metropolitan markets. However, serious adoption constraints govern MUBI's
              expansion velocity. First, cultural brand backlash poses an existential churn risk: in 2025, controversial
              capital ties to Sequoia Capital provoked boycotts that cost MUBI over 200,000 subscribers, caused an
              estimated $7.3 million operating loss on $200 million revenue, and triggered partner defections including
              the Los Angeles Festival of Movies. Second, hit-driven theatrical distribution introduces extreme cash
              flow volatility, illustrated by fourth-quarter 2025 negative cash flow of $65 million following box office
              disappointments. Third, scaling cinema ticketing partnerships requires navigating exhibitor resistance
              regarding ticket discounting and city-center venue economics.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Arthouse Boundary Paradox
            body: >-
              MUBI's growth depends on a delicate economic paradox: it commands high customer loyalty and low
              infrastructure streaming costs by cultivating an uncompromising arthouse identity, yet scaling toward
              venture-backed valuation benchmarks forces the company into volatile theatrical acquisitions and
              institutional partnerships that risk alienating its core progressive subscriber base.
            calloutType: insight
            claimRefs:
              - CM001
              - CM004
              - CM014
          - type: callout
            title: Customer Governance Sensitivity and Hit-Driven Cash Burn
            body: >-
              Unlike commodity streaming utilities where churn is driven by pricing or content catalog volume, MUBI
              operates in a market where community ethics, corporate ownership, and festival sponsorships directly
              govern subscriber retention. The loss of 200,000 subscribers and partner festival defections in 2025
              demonstrate that market demand is tightly bound to brand reputation.
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Across Streaming, Distribution, and Exhibition
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape for specialized cinema divides into three distinct tiers: scale SVOD incumbents,
              dedicated arthouse and festival streaming platforms, and theatrical exhibition networks. Mass-market SVOD
              leaders such as Netflix and Disney+ operate on vast catalog depth and tentpole intellectual property, but
              face slowing growth and subscriber fatigue from generic sequels. Dedicated arthouse platforms, including
              French players LaCinetek, UniversCiné, and Filmo, focus purely on curated digital cinémathèques or French
              independent releases without physical exhibition arms. In contrast, MUBI blends a rotating digital
              streaming catalog with active theatrical distribution and MUBI GO theatrical ticketing. This hybrid
              architecture isolates MUBI from head-to-head catalog competition against mass SVODs, positioning it as an
              editorial complement rather than a primary household streaming utility.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
