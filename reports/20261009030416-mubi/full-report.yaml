      - number: '4.2'
        title: Cost Structure, Theatrical Volatility, and Cash Drain
        blocks:
          - type: paragraph
            body: >-
              The economics of MUBI's hybrid distributor-streamer strategy diverge sharply from pure-play digital SaaS
              or asset-light subscription platforms. The cost structure is heavily exposed to upfront festival minimum
              guarantees (MGs), theatrical print and advertising (P&A) expenses, partner revenue shares, and cloud
              streaming distribution overhead. While digital delivery leverages scalable multi-DRM licensing and cloud
              player infrastructure via vendors such as Castlabs to serve over 190 countries, content acquisition
              commitments create severe cash-flow lumpy cycles. In 2025, MUBI paid an aggressive twenty-four million
              dollars at Cannes to acquire Lynne Ramsay's 'Die My Love', which subsequently grossed only twelve million
              dollars in global theatrical box office receipts. Although management claimed the title outperformed on
              downstream streaming, the timing mismatch between upfront cash commitments and theatrical receipts
              triggered a negative cash flow of sixty-five million dollars in the fourth quarter of 2025, contributing
              to a full-year net loss of seven point three million dollars.
            claimRefs:
              - CI001
              - CI006
              - CI007
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI003
              - CI005
              - CI006
              - CI007
              - CI010
      - number: '4.3'
        title: Capital Adequacy, Financing Dependency, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              MUBI's balance sheet underwent transformation in June 2025 when it secured a one hundred million dollar
              Series F investment led by Sequoia Capital at a post-money valuation of one billion dollars, bringing
              cumulative equity financing to one hundred twenty-seven million dollars across twenty-one funding rounds.
              However, the commercial and reputational fallout from the investor's defense-sector portfolio ties
              demonstrated severe fragility in consumer conversion and partner stability. More than ten thousand
              subscribers cancelled immediately, and the company shed over two hundred thousand subscribers across 2025,
              tumbling to nearly one point two million subscribers against an internal target of two million. The
              resulting cash burn forced headcount adjustments, including severance packages offering three months of
              salary to departing staff. While subscriber counts rebounded to a record one point seven million in the
              first quarter of 2026—bolstered by international rights to four Oscar-nominated international
              features—forward capital adequacy remains exposed to theatrical hit risk, prompting co-financing
              structures such as a multi-year European film pact with Helsinki-based investment fund manager IPR.VC to
              mitigate direct capital outlays.
            claimRefs:
              - CI001
              - CI003
              - CI005
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Theatrical Acquisition Volatility and Minimum Guarantee Cash Drain
            body: >-
              MUBI's high-stakes theatrical bidding strategy creates extreme working-capital volatility. Paying
              twenty-four million dollars for 'Die My Love' against a twelve million dollar box office return
              contributed directly to a negative cash flow of sixty-five million dollars in Q4 2025, proving that
              distributor minimum guarantees can overwhelm subscription operating cash flows.
            calloutType: risk
            claimRefs:
              - CI006
              - CI007
          - type: callout
            title: Co-Financing Slate Partnerships as Balance Sheet Protection
            body: >-
              To defend liquidity while sustaining its auteur pipeline, MUBI entered a multi-year co-financing alliance
              with Finnish fund manager IPR.VC for films including Pawlikowski's 'Fatherland'. This shifts partial
              production risk to institutional third-party capital while securing global distribution rights.
            calloutType: insight
            claimRefs:
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface, SKU Structure, and Cinephile Workflows
        blocks:
          - type: paragraph
            body: >-
              MUBI operates as a direct-to-consumer curated film streaming platform, theatrical distributor, and film
              production studio tailored specifically for independent and auteur cinema enthusiasts. Unlike mass-market
              subscription video-on-demand (SVOD) providers such as Netflix or Amazon Video that rely on algorithmic
              volume and deep back-catalogs, MUBI built its core consumer proposition around extreme editorial curation.
              The primary consumer product delivers an internationally accessible web and mobile application that
              historically featured a rolling window of 30 curated titles, adding one new film each day while retiring
              another after a 30-day viewing window. In addition to the rolling daily selection, the digital platform
              provides an expanded library of international cinema, documentaries, and restored classics accessible on
              mobile devices, smart TVs, and web browsers. Beyond pure digital video on demand, MUBI extends its
              consumer offering into offline theatrical exhibition through MUBI GO, an integrated mobile pass that
              provides subscribers in select metropolitan territories with one complimentary cinema admission per week
              to a curated theatrical release. Complementing these distribution channels, MUBI publishes Notebook, an
              internationally distributed print and online film criticism magazine, and operates physical and production
              assets via its acquisition of sales and production agent The Match Factory and Benelux distributor
              Cineart.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
