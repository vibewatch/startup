  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation/Return Logic
      - Key Risks
      - Probability Signal
    rows:
      - - Bull Case
        - Subscribers scale to 3.0M; revenue expands to $360M; slate co-financing caps theatrical cash drag
        - 3.5x to 4.2x EV/revenue multiple yields $1.25B to $1.50B valuation (~1.25x-1.5x MOIC on Series F)
        - Competition from major streamers and rising Cannes festival bidding wars
        - 'Low (20%): Requires pristine execution and flawless slate commercialization'
      - - Base Case
        - Subscribers reach 2.1M; revenue expands modestly to $240M; operating margins hover near breakeven
        - 2.5x EV/revenue multiple yields ~$600M valuation (~40% haircut against $1.0B Series F post-money mark)
        - Multiple compression across media/streaming comparables and limited buyer universe
        - 'Medium (55%): Reflects observed growth pace and persistent content cost pressures'
      - - Bear Case
        - Renewed subscriber boycotts reduce users below 1.2M; theatrical flops generate >$25M annual cash drain
        - 1.5x to 1.8x EV/revenue on depressed $180M revenue yields $270M to $325M valuation (down-round/distress)
        - Cash exhaustion requiring emergency dilutive financing or senior liquidation preference exercise
        - 'Moderate (25%): Backlash sensitivity and theatrical volatility remain active threats'
    notes: >-
      Scenario multiples assume trailing enterprise value-to-revenue benchmarking against independent film and streaming
      peers.
