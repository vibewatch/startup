  - id: FP001
    title: 竞争定位图：策展深度与影院整合度
    type: quadrant
    summary: 按策展专属性和实体影院整合度，对流媒体与影院竞争者分类定位。
    data:
      xAxis:
        label: 策展重点（算法片库至手工精选作者影片）
        min: 0
        max: 10
      yAxis:
        label: 影院放映整合度（纯数字至影院票务）
        min: 0
        max: 10
      points:
        - label: MUBI（流媒体 + MUBI GO）
          x: 9
          'y': 8.5
          detail: 高度作者电影策展，结合每周 MUBI GO 影院票务和影院发行。
        - label: LaCinetek
          x: 8.5
          'y': 1.5
          detail: 聚焦导演电影馆藏，以纯数字 SVOD 交付。
        - label: UniversCiné
          x: 6.5
          'y': 2
          detail: 聚焦独立电影片库，没有直接的实体放映合作。
        - label: Filmo
          x: 4.5
          'y': 1.5
          detail: 中等策展深度，在作者影片与易于接受的大众商业电影之间取得平衡。
        - label: Netflix / Disney+
          x: 2
          'y': 2.5
          detail: 算法驱动的大众片库，偶尔提供精品影片的影院资格窗口。
        - label: 传统艺术影院
          x: 8
          'y': 9.5
          detail: 在实体场馆放映并策划本地节目，但没有自有全球 SVOD。
