  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 声誉脆弱性与治理后果
        blocks:
          - type: paragraph
            body: >-
              MUBI 的品牌资产高度依赖活跃的独立电影人社区、进步派受众和电影节合作。2025 年 5 月 Sequoia Capital 以 $1 billion 估值投资 $100 million
              后，这笔文化资本受到严重损害。Sequoia 更广泛的投资组合，尤其是以色列军事科技初创公司 Kela，被披露后，在加沙冲突持续期间引发行业强烈反弹。MUBI 400
              人员工中约一半匿名签署内部抗议信，要求退回投资并撤下 Sequoia 合伙人 Andrew Reed 的董事席位。Los Angeles Festival of Movies 取消 MUBI 的主赞助商身份，多场
              MUBI Fest 被取消，No Other Land 背后的奥斯卡获奖电影人拒绝发行。后果是 2025 年下半年净流失超过 200,000 名订阅用户，付费用户降至 1.2 million，低于内部年末目标 2
              million。管理层虽发布《道德融资与投资政策》，并报告 2026 年春季用户回升至 1.7 million，残余声誉脆弱性仍然很高。
