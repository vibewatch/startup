      - number: '7.4'
        title: 展示
        blocks:
          - type: callout
            title: 作者电影生态中的品牌脆弱性
            body: MUBI 的核心变现模式，是把自己定位为独立电影的道德与审美避风港。社区和员工对 Sequoia 投资的强烈反应说明，传统硅谷融资结构一旦嫁接到文化政治化的创意受众上，就会带来严重且不对称的声誉风险。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: 院线最低保证金的非对称波动
            body: >-
              The Substance 等爆款可以带来巨额票房意外收益，但激烈的电影节竞价会造成极大的下行暴露。Die, My Love 以 $24 million 买入、院线票房仅 $12
              million，说明一笔表现不佳的院线下注就可能触发数百万美元现金消耗激增。
            calloutType: insight
            claimRefs:
              - CR009
              - CR010
