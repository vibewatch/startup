  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源、变现模式与营收轨迹
        blocks:
          - type: paragraph
            body: >-
              MUBI 的商业模式包括消费者订阅视频点播（SVOD）、MUBI GO 混合院线票务、全球全权利电影发行和制片联合融资。2025 财年营收约 $200
              million，较早期小众业务规模显著扩大。收入基础仍是经常性消费者订阅：早期以低价精选轮播模式增长，每天轮换三十部手选影片，起价为每月五美元，之后在英国等地提升至每月七英镑九十九便士。成熟都市市场会捆绑
              MUBI GO，每周向订阅用户提供一张精选合作影片的院线票，费用由折扣后的院线座位补偿支付。除面向消费者的数字订阅外，MUBI 还大举拓展院线发行和转授权，从电影节购片中变现票房，并保留全球数字片库的流媒体权利。
