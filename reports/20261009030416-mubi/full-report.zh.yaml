              - CM015
      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              MUBI 用户按不同价值主张和付费意愿分成多个行为群体。核心消费者是城市影迷和文化爱好者，他们把个人可支配娱乐预算投向专业电影。对这类用户而言，$14.99 per month
              的基础流媒体是片库收缩后的一种替代；$19.99 的高级 MUBI GO 套餐则把家庭观看与每周院线观影连接起来。第二类关键客户是独立制片机构、IPR.VC
              等欧洲基金管理人，以及寻求发行保证和联合融资承诺的国际销售代理。第三类是独立影院和 Vue 等多厅影院连锁，它们与 MUBI GO
              合作变现工作日非高峰场次。采用路径高度依赖口碑带来的文化权威、电影节声望和社区善意，因此一旦公司决策与订阅用户价值观冲突，客户关系就格外脆弱。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 增长催化剂、社区治理与市场逆风
        blocks:
          - type: paragraph
            body: >-
              MUBI 的首要增长动力，是好莱坞大制片厂和老牌 SVOD 服务持续收缩结构性撤退，减少中等预算作者电影的购片，为高声望国际片目留下供给缺口。MUBI 通过建立多年联合融资联盟、拿下 The Substance
              等电影节爆款院线片，并把 MUBI GO 扩展到主要都市市场来承接这一缺口。但采用端的约束限制了扩张速度。第一，文化品牌反弹带来生死攸关的流失风险：2025 年，与 Sequoia Capital
              的争议资本关系引发抵制，导致 MUBI 流失超过 200,000 名订阅用户，在 $200 million 营收上造成预计 $7.3 million 的经营亏损，并引发包括 Los Angeles
              Festival of Movies 在内的合作方倒戈。第二，命中驱动的院线发行带来极大现金流波动，2025 年第四季度票房失利后现金流为负 $65
              million。第三，扩大影院票务合作还要应对院线方对票价折扣和市中心场馆经济性的抵触。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 艺术电影边界悖论
            body: MUBI 的增长建立在微妙的经济悖论上：坚定的艺术电影定位带来高客户忠诚度和低基础设施流媒体成本，但若要向风险资本支持的估值基准扩张，公司就必须参与波动剧烈的院线购片和机构合作，这又可能疏远核心进步派订阅用户。
            calloutType: insight
            claimRefs:
              - CM001
              - CM004
              - CM014
          - type: callout
            title: 客户治理敏感度与命中驱动的现金消耗
            body: >-
              大众流媒体工具的流失通常由价格或片库规模驱动，而 MUBI 所处的市场中，社区伦理、公司所有权和电影节赞助会直接决定订阅留存。2025 年流失 200,000
              名订阅用户、合作电影节倒戈，说明市场需求与品牌声誉紧密相连。
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 流媒体、发行与院线展映的竞争格局
        blocks:
          - type: paragraph
            body: >-
              专业电影的竞争分为三层：规模型 SVOD 既有平台、专门的艺术电影与电影节流媒体平台，以及院线展映网络。Netflix、Disney+ 等大众 SVOD
              领导者依靠深厚片库和旗舰知识产权运营，但增长放缓，也受到同质续集造成的订阅疲劳影响。LaCinetek、UniversCiné、Filmo
              等法国艺术电影平台专注于精选数字电影库或法国独立发行，没有实体展映业务。相比之下，MUBI 把轮换数字片库、主动院线发行和 MUBI GO 院线票务结合起来。这种混合架构让 MUBI 避开与大众 SVOD
              的正面片库竞争，成为编辑策划型补充，而不是家庭主流流媒体工具。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
