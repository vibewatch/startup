            - text: 中
              tone: neutral
        - label: 联合融资资本依赖
          values:
            - 低
            - 高
            - 先进
            - text: 低
              tone: positive
    notes: 该矩阵映射主要风险向量，并评估其发生概率、商业影响与运营层面的缓释控制。
    claimRefs:
      - CR002
      - CR008
      - CR011
      - CR013
      - CR015
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 这套决策逻辑依次审视 MUBI 的运营规模、电影节成绩、风险敞口与估值缺口，最终得出“继续研究”的建议。
    data:
      nodes:
        - id: scale
          label: 规模与覆盖范围
          detail: 覆盖 190 多个国家、拥有 170 万订阅用户，收入运行率为 $200M
        - id: content
          label: 高端内容管线
          detail: 戛纳和威尼斯电影节获奖作品持续拉开品牌差异
        - id: risk
          label: 反噬与亏损
          detail: 2025 年流失 20 万用户，净亏损 $7.3M，且最低保证金敞口较高
        - id: valuation
          label: 估值判断
          detail: $1.0B 投后估值的 F 轮对应 5.0x EV/收入倍数，估值偏高
        - id: diligence
          label: 尽调要求
          detail: 经审计的分部毛利率、股权结构表优先权安排，以及用户流失桥接表
        - id: recommendation
          label: 建议
          detail: 在取得经审计的单位经济数据并完成股权结构表尽调前，建议继续研究
      edges:
        - from: scale
          to: content
        - from: content
          to: risk
        - from: risk
          to: valuation
        - from: valuation
          to: diligence
        - from: diligence
          to: recommendation
    approximationNotes: 该图呈现定性评估逻辑；节点顺序展示投资判断如何逐步筛选。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV006
      - CV008
      - CV014
