      - number: '4.3'
        title: 资本充足性、融资依赖与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              2025 年 6 月，MUBI 获得 Sequoia Capital 领投的一亿美元 Series F，投后估值十亿美元，使 21
              轮融资累计股权融资达到一亿二千七百万美元。但投资方国防领域投资组合引发的商业和声誉后果，暴露出消费者转化和合作方稳定性的严重脆弱性。一万多名订阅用户立即取消，2025
              年全年流失超过二十万名，订阅用户跌至约一百二十万，而内部目标为二百万。现金消耗迫使公司调整员工人数，包括向离职员工提供三个月工资的离职补偿。2026
              年第一季度，订阅用户在四部获奥斯卡提名的国际影片版权助推下回升至创纪录的一百七十万，但未来资本充足性仍暴露于院线爆款风险，因此 MUBI 采用与赫尔辛基投资基金管理人 IPR.VC
              签订多年欧洲电影协议等联合融资结构，以减少直接资本支出。
            claimRefs:
