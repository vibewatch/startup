  - id: FE001
    title: MUBI 产品与运营技术栈
    type: stack
    summary: 覆盖消费者触点、交付管线、策展数据及实体分销基础设施的端到端架构。
    data:
      layers:
        - label: 第 6 层：客户端应用与消费者界面
          detail: 覆盖 iOS、Android、网页浏览器和智能电视的多平台客户端应用
          modules:
            - iOS 与 Android 原生应用
            - 智能电视 TVOS/Tizen/Roku 应用
            - HTML5 网页视频播放器
            - 离线下载商店
        - label: 第 5 层：线下放映与票务整合
          detail: MUBI GO 移动票务通行证、影院放映商结算及 Notebook 出版
          modules:
            - MUBI GO 移动优惠券通行证
            - 放映商 POS 对账网关
            - 实体影院场馆系统
            - Notebook 编辑出版
        - label: 第 4 层：策展排期与版权治理
          detail: 自有 30 天轮换片库规则、地域版权过滤及元数据丰富化
          modules:
            - 每日影片轮换引擎
            - Geo-IP 地域版权验证器
            - 双语编辑元数据
            - 社区评分与评论
        - label: 第 3 层：视频摄取与处理管线
          detail: 主视频资产摄取、多码率编码及数字版权打包
          modules:
            - 自动转码管线
            - HLS / DASH 打包
            - Widevine / FairPlay DRM 服务器
            - 隐藏式字幕与字幕
        - label: 第 2 层：边缘交付与云基础设施
          detail: 全球 CDN 缓存节点、API 边缘网关及容器化云服务
          modules:
            - 全球 CDN 边缘缓存
            - API 边缘网关与身份验证
            - 可扩展云视频源站
            - 遥测事件摄取
        - label: 第 1 层：收购情报与制片厂运营
          detail: 销售代理运营、联合融资基金整合及影院排片
          modules:
            - The Match Factory 销售套件
            - IPR.VC 联合融资工具
            - 电影节竞价决策模型
            - 观看遥测分析
    approximationNotes: 技术栈架构综合开发者洞察、高管披露及合作伙伴公告。
    claimRefs:
      - CE001
      - CE004
      - CE007
      - CE009
      - CE010
      - CE012
  - id: FU001
    title: 客户旅程图：影迷发现、留存与影院循环
    type: journey-map
    summary: 展示订阅用户从电影节热度，经 SVOD 策展，到 MUBI GO 影院扩张的获客路径。
    data:
      items:
        - label: 认知与发现
          stage: 认知与发现
          userGoal: Discover award-winning international cinema and festival highlights
          touchpoints: Film festivals (Cannes/Venice), social film discussion, Notebook publication, tote bag marketing
          painPoints: Limited theatrical access to niche independent foreign films in mainstream venues
        - label: 订阅试用与开通
          stage: 订阅试用与开通
          userGoal: Stream exclusive curated arthouse titles at home
          touchpoints: Web app, Apple TV, Roku, Smart TV platform apps, free trial offers
          painPoints: High subscription price points compared to mass-market streaming bundles
        - label: 日常观看与互动核心
          stage: 日常观看与互动核心
          userGoal: Regular engagement with hand-picked auteur films and editorial essays
          touchpoints: Weekly featured releases, Notebook film criticism, member ratings and community lists
          painPoints: Perception of platform shifting toward self-distributed commercial titles over rare classics
        - label: 通过 MUBI GO 扩展影院业务
          stage: 通过 MUBI GO 扩展影院业务
          userGoal: Experience new theatrical releases on the big screen weekly
          touchpoints: MUBI GO mobile ticket selection, participating indie cinemas and Vue multiplexes
          painPoints: Same-day in-person ticketing requirement and geographical concentration in major metro areas
        - label: 社区倡导与流失风险
          stage: 社区倡导与流失风险
          userGoal: Align cultural identity with an ethical, independent cinema champion
          touchpoints: MUBI Fest, community screenings, filmmaker Q&As, customer support
          painPoints: Extreme sensitivity to corporate governance, defense tech ties, and perceived mission drift
        - label: 长期留存与倡导
          stage: 长期留存与倡导
          userGoal: Sustain ongoing multi-year patronage of independent world cinema and physical culture
          touchpoints: Annual membership renewals, physical Notebook magazine subscriptions, repertory cinema loyalty
          painPoints: Fatigue from escalating subscription costs and commercialized studio catalog shifts
    approximationNotes: 客户旅程阶段和触点根据客户反馈讨论、产品描述及行业对 MUBI 多渠道订阅用户生命周期的分析整理。
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU006
      - CU007
      - CU010
