        - 中（55%）：反映已观察到的增长速度及持续的内容成本压力
      - - 悲观情景
        - 订阅用户抵制再起，用户数跌破 1.2M；影院票房失利导致每年现金流出超过 $25M
        - 在受压至 $180M 的收入上，1.5 倍至 1.8 倍 EV / 收入倍数带来 $270M 至 $325M 估值（降价轮 / 困境融资）
        - 现金耗尽，需要紧急稀释性融资或行使高级清算优先权
        - 中等（25%）：反弹敏感度和影院业务波动仍是现实威胁
    notes: 情景倍数以独立电影和流媒体同行的历史企业价值 / 收入基准为假设。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV008
      - CV010
      - CV015
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间展示 MUBI 从 2007 年在帕洛阿尔托创立，到 2026 年戛纳片单及联合融资合作的发展历程。
    data:
      items:
        - date: '2007-03-01'
          label: The Auteurs 创立
          detail: Efe Cakarel 在加州帕洛阿尔托推出独立流媒体服务 The Auteurs。
          claimRefs:
            - CO001
        - date: '2010-06-01'
          label: 更名为 MUBI 并迁往伦敦
          detail: 公司更名为 MUBI，并将总部迁至英国伦敦。
          claimRefs:
            - CO002
        - date: '2012-08-01'
          label: 推出 30 部轮换电影模式
          detail: 推出策展轮播模式，以 $5 / 月提供 30 天内的 30 部电影，降低片库授权成本。
          claimRefs:
            - CO003
        - date: '2016-01-14'
          label: Series E 融资并进入影院业务
          detail: 获得成长资本，并开始在国际电影节直接收购影院电影。
          claimRefs:
            - CO004
        - date: '2018-09-07'
          label: 推出 MUBI GO 影院票
          detail: 在英国推出 MUBI GO，将每周一张免费精选影院票与流媒体服务打包。
          claimRefs:
            - CO006
        - date: '2024-05-20'
          label: 收购 The Substance
          detail: 以 $12M 收购戛纳获奖影片 The Substance，最终实现超过 $80M 的票房突破。
          claimRefs:
            - CO007
        - date: '2025-05-30'
          label: Sequoia Capital $100M 融资轮
          detail: 完成 Sequoia Capital $100M 少数股权投资，MUBI 估值达到 $1.0B。
          claimRefs:
            - CO011
        - date: '2025-08-14'
          label: Sequoia 反弹与道德政策
          detail: 在 200K 个订阅取消之际，Cakarel 公开辩护，并宣布道德融资政策。
          claimRefs:
            - CO012
        - date: '2026-03-31'
          label: 订阅用户回升至 1.7M
          detail: 受奥斯卡提名影片的国际发行推动，MUBI 全球订阅用户恢复至创纪录的 1.7M。
          claimRefs:
            - CO005
        - date: '2026-04-15'
          label: IPR.VC 联合融资合作
          detail: 在六部戛纳电影节影片上映前，与 IPR.VC 签署多年期欧洲作者电影融资协议。
          claimRefs:
            - CO016
    approximationNotes: 里程碑日期反映报道中的新闻稿日期、电影节首映公告及公司监管备案日期。
    claimRefs:
      - CO001
      - CO002
      - CO003
