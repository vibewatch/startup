  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与现状替代品
        blocks:
          - type: paragraph
            body: >-
              划定 MUBI 的市场边界，关键是把它的混合文化模式与普通 SVOD 商品聚合平台区分开。大众流媒体优先追求大容量内容库，MUBI
              的可服务市场则围绕精选作者电影、国际电影节片目、经典修复片和院线观影展开。纳入的支出包括小众点播片库的消费者订阅费、MUBI GO
              等混合院线票务套餐、发行影片的交易型票房支出，以及独立长片的联合制片资本。排除项包括大众主流娱乐、现场体育版权、算法驱动的广告支持视频和好莱坞大制片厂系列。现状替代品包括 Netflix、Amazon Prime
              Video 等综合流媒体巨头、传统家庭实体媒介、电影协会会员、经典影院观影及临时参加电影节。MUBI 不只是数字平台，而是刻意把线上流媒体与线下院线展映合在一起，把实体影院观影置于客户互动和品牌忠诚的核心。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
      - number: '2.2'
        title: 用多重行业视角测算可服务市场
        blocks:
          - type: paragraph
            body: >-
              MUBI 的市场规模不能只靠一个无限外推的视频流媒体估算，因为泛化的流媒体 TAM 会掩盖高意愿影迷群体的真实经济特征。评估 MUBI 的市场潜力，需要同时看全球流媒体大盘、精品艺术电影数字发行和院线票房。按广义
              TAM
              看，全球视频流媒体和院线娱乐行业每年规模超过数百亿美元，但真正愿意为商业性较弱、作者主导的国际电影付费者只占一小部分。可服务市场因此收窄到专业和独立电影领域，覆盖主动寻找国际电影节片目和非英语电影的全球观众。聚焦可获取市场，MUBI
              已在全球 190 个地区吸引约 1.7 million 名付费订户，收入运行率约 $200 million。但要突破这一核心客群，获客难度会陡增。大型电影节购片 Die My Love
              的票房表现就是例证：买入价为 $24 million，最终票房却只有 $12 million。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
