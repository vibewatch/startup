            title: 治理暴露与资本反弹敏感度
            body: >-
              Sequoia Capital 注入 $100 million 后，MUBI 获得艺术电影独角兽估值，但随后的争议引发严重流失（超过 200,000 名订阅用户离开）和文化合作方解约。创始人 Efe
