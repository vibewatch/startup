      - number: '6.2'
        title: 采用轨迹与订阅用户波动
        blocks:
          - type: paragraph
            body: >-
              MUBI 在 2024–2026 年经历了剧烈的订阅和运营波动 [CU003, CU005, CU008]。The Substance 口碑和票房成功（院线票房 $77 million）推动订阅用户在 2025
              年春季升至 1.44 million [CU003, CU005]。但 2025 年 5 月 Sequoia Capital $100 million 融资引发公开争议后，MUBI 未达 2 million
              用户目标，流失超过 200,000 名订阅用户，到 2025 年底降至 1.2 million [CU003, CU005, CU008]。Lynne Ramsay 的 Die My Love
              票房表现不及预期，购入成本 $24 million、票房仅 $12 million，进一步加剧流失，并在 Q4 2025 造成 $7.3 million 经营亏损和 $65 million 负现金流
              [CU003, CU008, CU009]。随后，订阅用户在 2026 年第一季度凭借颁奖季院线动能和片单增加回升至创纪录的 1.7 million，显示受众具韧性，但标题数据波动仍大 [CU003,
              CU005]。
