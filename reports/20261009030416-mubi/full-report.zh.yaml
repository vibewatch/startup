    title: 风险热力图：各战略领域的严重性与可能性评估
    type: matrix
    summary: 从可能性、严重性和缓释成熟度评估 MUBI 的主要风险向量。
    data:
      columns:
        - 可能性
        - 影响严重性
        - 缓释成熟度
        - 残余风险评级
      rows:
