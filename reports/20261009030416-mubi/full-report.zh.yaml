      - number: '5.2'
        title: 技术栈、分发物流与运营模式
        blocks:
          - type: paragraph
            body: >-
              MUBI 将云托管数字媒体交付与覆盖 190 多个市场的高触达实体电影发行物流结合。数字流媒体管线依靠 iOS、Android、网页浏览器和主流智能电视生态的多平台客户端，配套数字版权管理（DRM）授权、多码率
              HTTP 视频编码和全球内容分发网络（CDN）边缘缓存。MUBI GO 院线通行证在移动应用内生成数字券，并直接接入参与影院的 POS 系统和票房运营；公司还与 Vue
              等商业多厅影院及独立经典影院协商折扣票价。收购德国销售公司 The Match Factory（2022 年 1 月）和 Benelux 发行商 Cineart（2024 年 2 月）后，MUBI
              得以内部管理院线订票、国际电影节代表和地域授权。传统商业发行商依赖事后票房回款，而 MUBI 使用高频观众互动数据和流媒体完播指标指导院线竞价门槛及多年制片联合融资承诺，包括与 IPR.VC
              等机构基金管理人的联合融资协议。
