      - number: '3.3'
        title: 壁垒持续性、转换成本与购片暴露
        blocks:
          - type: paragraph
            body: >-
              MUBI 的差异化来自编辑策划、作者品牌资产，以及锁定电影节发行权的联合融资合作。通过与 IPR.VC 等投资基金管理人签订多年联合融资协议，MUBI 为 Paweł Pawlikowski 的
              Fatherland、Felix van Groeningen 的 Let Love In
              等欧洲作者项目获得全球发行和院线渠道。但消费者转换成本几乎为零：订阅者很容易同时使用多个平台，也容易在低摩擦月度订阅间流失。MUBI 进一步购入高价电影版权，也让业务暴露于极端票房波动；Lynne Ramsay
              的 Die My Love 报道购入价为 $24 million，票房却只有 $12 million。机构资金关系引发的严重伦理反弹，又进一步放大院线风险，导致知名电影节合作方抵制和文化摩擦。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
