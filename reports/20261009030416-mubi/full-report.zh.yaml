      - number: '8.4'
        title: 展示
        blocks:
          - type: callout
            title: 投资立场：估值倍数脱节，继续研究
            body: 我们建议继续研究 MUBI。底层策划壁垒和回升至 1.7M 订阅用户证明受众有韧性，但在没有审计分业务贡献利润率的情况下，按 5.0x 营收承受私营公司 $1.0B 估值，会造成不可接受的下行不对称。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV008
