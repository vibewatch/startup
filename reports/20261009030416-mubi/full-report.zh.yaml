              MUBI 的客户留存取决于小众编辑策划与商业制片厂扩张之间的微妙平衡 [CU002, CU011]。早期用户和社区影迷担心，平台商品化越来越偏向 MUBI 自制院线片，而不是丰富多样的全球发现
