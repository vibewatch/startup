  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面、SKU 结构与影迷工作流
        blocks:
          - type: paragraph
            body: >-
              MUBI 是面向消费者的精选电影流媒体平台、院线发行商和电影制片厂，专为独立及作者电影爱好者打造。它不像 Netflix、Amazon Video 等大众 SVOD
              依靠算法规模和深片库，而是以极致编辑策划构建核心产品。主产品提供全球可用的网页和移动应用，历史上维持 30 部精选片滚动窗口，每天增加一部并在 30
              天观看窗口后下架另一部。平台还提供国际电影、纪录片和修复经典片库，可在移动设备、智能电视和浏览器上观看。MUBI GO
              是线下院线权益的移动通行证，在部分都市市场每周为订阅用户提供一张精选院线影片的免费电影票。MUBI 还出版全球发行的纸质及在线影评杂志 Notebook，并通过收购销售与制片代理 The Match
              Factory 及 Benelux 发行商 Cineart 经营实体和制片资产。
