      - number: '1.2'
        title: 高管领导、治理结构与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              公司领导权仍集中在创始人兼 CEO Efe Cakarel 手中；他控制董事会多数投票权，也持有多数股权。前首席工程师 Gabe da Silveira
              出任首席技术官并被列为联合创始人，负责平台基础设施。Sequoia Capital 于 2025 年中完成 $100 million 成长股权融资后，其合伙人 Andrew Reed 加入 MUBI 董事会。由于
              Sequoia 与国防科技投资组合的关联，这一任命在 MUBI 员工和独立电影合作方中引发广泛反弹，进而出现电影人公开信、电影节抵制以及要求 Reed 离任的声音。尽管公众要求进行结构性撤资，Cakarel
              仍确认 Sequoia 是不参与编辑或节目策划监督的少数股被动财务投资者，因此重大的战略关键人物风险仍集中在 Cakarel 身上。
