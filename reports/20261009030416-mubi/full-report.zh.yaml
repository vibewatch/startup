      - number: '5.3'
        title: 技术差异化、基础设施缺口与投资者治理风险
        blocks:
          - type: paragraph
            body: >-
              MUBI 通过整合式制片厂飞轮区别于普通流媒体聚合商：专有编辑策划、The Match Factory
              的国际销售代理业务，以及可降低数百万美元作者电影购片风险的专有观众互动数据。它没有投入昂贵的生成式推荐算法军备竞赛，而是把人工策划和电影节履历视为核心 IP。但产品和技术缺口仍然明显：MUBI
              没有公开开发者文档、开源 API 生态或客户端 SDK，尽调只能借助商业技术目录、招聘记录和开发者分析来评估架构。2025 年中 Sequoia Capital 领投的 100 million dollar
              融资将公司估值推至 1 billion dollars 后，投资方国防关联引发社区强烈反弹，出现电影节抵制、员工辞职，以及 2025 年据报道流失 200,000 名订阅用户；2026 年初用户回升至 1.7
              million。声誉摩擦说明 MUBI 核心影迷受众对品牌伦理与治理极其敏感。
            claimRefs:
              - CE012
              - CE013
