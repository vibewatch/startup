            title: 混合流媒体发行商楔子
            body: MUBI 将手工精选的作者电影与 MUBI GO 院线票和直接院线发行结合，避开与大众 SVOD 的片库正面战。由此形成一般算法流媒体无法复制的文化品牌，把影迷爱好者转化为生态内的经常性订阅用户。
            calloutType: insight
