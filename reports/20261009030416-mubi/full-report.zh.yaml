      - number: '7.3'
        title: 消费者合规执法与院线合作方摩擦
        blocks:
          - type: paragraph
            body: >-
              订阅计费和实体展映经济性受到法律审查，凸显运营与合规风险。2026 年 3 月，MUBI 获法院初步批准 $1.6 million 集体诉讼和解，处理其在 37,786
              个已识别账户上续订会员却未提供法定披露和消费者同意、涉嫌违反 California Automatic Renewal Law 的指控。和解要求全国提升披露并加强支付运营尽调。与此同时，MUBI GO
              混合观影权益使公司依赖影院连锁并面临成本上升。MUBI GO 向参与场馆支付数百万美元票务报销，高需求都市中心的知名独立影院则抵制 MUBI 的折扣票价结构。MUBI
              还要求一个连锁中的所有场馆都参加，严格合同政策加剧了与大型影院运营商的谈判摩擦。这些消费者保护负债和展映合作约束限制快速地域扩张，也推高服务交付成本。
            claimRefs:
              - CR014
              - CR015
              - CR016
