      - number: '4.2'
        title: 成本结构、院线波动与现金消耗
        blocks:
          - type: paragraph
            body: >-
              MUBI 的混合发行商—流媒体策略，经济特征明显不同于纯数字 SaaS 或轻资产订阅平台。成本高度暴露于电影节前置最低保证金（MGs）、院线拷贝与广告（P&A）费用、合作方分成及云流媒体分发开销。数字交付借助
              Castlabs 等供应商的多 DRM 授权和云播放器基础设施服务 190 多个国家，但购片承诺造成现金流剧烈起伏。2025 年，MUBI 在戛纳以二千四百万美元的激进价格购入 Lynne Ramsay 的
              Die My Love，全球院线票房却只有一千二百万美元。管理层虽称该片在后续流媒体表现更好，但前置现金承诺与院线回款错配，使 2025 年第四季度现金流转负六千五百万美元，并造成全年七百三十万美元的净亏损。
            claimRefs:
