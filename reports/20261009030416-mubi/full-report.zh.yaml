  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、核心反论点与战略取舍
        blocks:
          - type: paragraph
            body: >-
              评估 MUBI 作为成长阶段投资，需要在其差异化文化小众定位与独立电影发行及平台经济性的结构性逆风之间权衡。核心投资论点是：MUBI 成功整合精选流媒体、通过 MUBI GO
              吸引订阅用户的院线票务，以及全球电影节发行。它不像大众算法流媒体巨头依赖庞大授权片库或广泛系列 IP，而是服务 190 多个国家的专门影迷，建立了受信任的消费者生活方式品牌。精选高声望电影节片目帮助 MUBI
              赢得品牌忠诚，也证明院线发行能带动后续数字流媒体互动。与赫尔辛基投资基金管理人 IPR.VC 的多年片单联合融资等战略联盟，还让 MUBI
              能资助雄心勃勃的欧洲作者电影，同时降低资产负债表直接制片和发行风险。反论点则强调，高毛利数字品牌极易受到社区反弹和院线执行风险冲击。MUBI 刻意培育了有机且政治参与度高的艺术电影受众，因此 2025 年 6 月
              Sequoia Capital 领投的 $100M 成长融资，因该创投公司的外部国防相关投资而引发订阅抵制、艺术家辞职和电影节赞助取消。2025 年下半年，MUBI 净流失超过 200,000 名订阅用户，从
              1.44M 降至 1.2M，2026 年初才回升至 1.7M。相比传统娱乐工具，这种敏感性说明 MUBI
              客户生命周期价值异常脆弱。再加上为可能院线失利的电影节片目支付数百万美元最低保证金所带来的高资本风险，反论点质疑 MUBI 是否能在持续注资之外实现持久的独立现金创造。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
