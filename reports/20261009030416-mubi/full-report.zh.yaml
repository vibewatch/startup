            title: 标题倍数压缩与清算优先权悬置
            body: Sequoia Capital 投资 $100M，确立了 $1.0B 的投后估值基准，高于公开媒体公司的可比估值。若战略出售或 IPO 的价格低于这一基准，高优先级清算优先权可能吞噬普通股回报。
            calloutType: risk
