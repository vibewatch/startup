          values:
            - 高
            - 关键
            - 中等
            - text: 高
              tone: critical
        - label: 影院收购缺口
          values:
            - 高
            - 关键
            - 发展中
            - text: 关键
              tone: negative
        - label: 消费者自动续订合规
          values:
            - 高
            - 高
