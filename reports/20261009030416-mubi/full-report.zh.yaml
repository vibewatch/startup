chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营版图与商业模式
        blocks:
          - type: paragraph
            body: >-
              MUBI 由 CEO Efe Cakarel 于 2007 年创立，最初是位于 Palo Alto、面向影迷的 The Auteurs 门户，后将总部迁至英国伦敦。近二十年来，MUBI
              从在线留言板和电影社交数据库转型为覆盖多地的娱乐制片厂，将订阅视频点播（SVOD）、MUBI GO 每周院线观影、国际电影销售和院线发行结合起来。商业聚合目录称其全球约有 517 名员工，而《华尔街日报》2025
              年的一手报道称全球员工约 400 人。MUBI 主要采用面向消费者的经常性订阅模式，并通过与院线运营商的票务合作及覆盖 190 多个市场的电影交易发行收入加以补充。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
