      - number: '3.2'
        title: 竞争者画像、定价模式与混合展映套餐
        blocks:
          - type: paragraph
            body: >-
              影迷平台的定价和套餐反映出截然不同的变现策略。在法国，MUBI 标准月度流媒体不设承诺期，价格为 €11.99 per month；年度承诺约 €71.88 per year，相当于 €5.99 per
              month。想要实体影院权益的影迷可购买 MUBI GO，价格为 €18.99 per month，包含无限流媒体和合作都市影院每周一张电影票。相比之下，LaCinetek 以约 €9.99 per month
              提供电影导演精选的经典电影库，UniversCiné 以约 €5.99 per month 或交易型 VOD 提供法国和欧洲独立片库，Filmo 以约 €6.99 per month
              面向艺术电影和大众电影混合需求。MUBI 仍是唯一把常规院线票直接纳入经常性订阅套餐的平台。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
