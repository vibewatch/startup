      - number: '1.3'
        title: 资本化历程、投资者基础与增长里程碑
        blocks:
          - type: paragraph
            body: >-
              MUBI 在 11 轮融资中累计披露约 $184 million 的历史融资，早期主要由欧洲早期基金支持，随后于 2025 年中获得 Sequoia Capital 领投的 $100 million
              融资，投后估值为 $1.0 billion。2025 年 MUBI 的营收约为 $200 million，但录得 $7.3 million 会计亏损，2025 年第四季度现金流严重为负，达 $65
              million；主要原因包括为戛纳购片 Die My Love 承诺的 $24 million。面对商业波动和外部反弹，MUBI
              制定了《道德融资与投资政策》，并安排战略性制片联合融资，尤其是与总部位于赫尔辛基的基金管理人 IPR.VC 签订多年欧洲作者电影融资协议。
