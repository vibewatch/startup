              MUBI 从纯精选 SVOD 服务转为主动的全球院线买方，带来巨大的单片商业暴露。2025 年，MUBI 在戛纳以据报道 $24 million 的最低保证金买下 Lynne Ramsay 的 Die, My
              Love 全球版权，但影片全球院线票房只有 $12 million。院线购片摊销和营销承诺叠加后，MUBI 在 Q4 2025 现金流为负 $65 million，并在约 $200 million 营收上录得
              $7.3 million 全年会计亏损。The Substance 等爆款院线片票房超过 $80 million，但命中驱动的波动造成流动性周期不均。为降低单片投资判断风险，MUBI 与赫尔辛基基金管理人
              IPR.VC 建立多年联合融资联盟，共同资助 Paweł Pawlikowski 的 Fatherland 等欧洲作者项目。然而，高昂的院线发行排期、奖项宣传和在 Los Angeles、Mexico City
              等地扩建自有影院的实体足迹，持续消耗营运资金。
            claimRefs:
              - CR009
              - CR010
