chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2007 by Efe Cakarel as The Auteurs, MUBI has evolved from an arthouse online community into a vertically integrated global streaming platform, theatrical distributor, and film production studio headquartered in London. The company reached a $1 billion valuation following a $100 million minority investment from Sequoia Capital in 2025, but suffered substantial subscriber churn and partner boycotts before rebounding to 1.7 million subscribers in early 2026."
sections:
  - id: "identity-and-business-model"
    title: "Corporate Identity, Operating Footprint, and Business Model"
    body: "MUBI was founded in 2007 by CEO Efe Cakarel, originating as a Palo Alto-based cinephile portal named The Auteurs before relocating corporate headquarters to London, United Kingdom. Over nearly two decades, MUBI transitioned from an online message board and film social database into a multi-territory entertainment studio combining subscription video-on-demand (SVOD), weekly theatrical cinema admissions via MUBI GO, international film sales, and theatrical distribution. While commercial aggregator directories cite approximately 517 employees globally, primary reporting from the Wall Street Journal in 2025 cited approximately 400 staffers worldwide. MUBI operates primarily on a direct-to-consumer recurring subscription model supplemented by ticket partnerships with theatrical exhibitors and transactional film distribution revenues across more than 190 territories."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Executive Leadership, Governance Structure, and Key-Person Exposure"
    body: "Corporate leadership remains concentrated in founder and CEO Efe Cakarel, who maintains majority voting control of the company's board of directors and majority equity ownership. Former lead engineer Gabe da Silveira was appointed Chief Technology Officer and designated co-founder, overseeing platform infrastructure. Following the close of Sequoia Capital's $100 million growth equity financing in mid-2025, Sequoia partner Andrew Reed joined MUBI's board of directors. The appointment sparked widespread dissent among MUBI's workforce and independent film partners due to Sequoia's defense tech portfolio ties, prompting filmmaker open letters, festival boycotts, and demands for Reed's removal. Despite public calls for structural divestment, Cakarel affirmed that Sequoia remains a minority passive financial investor without editorial or programming oversight, leaving substantial strategic key-person risk focused on Cakarel himself."
    claimRefs:
      - "CO001"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholders"
    title: "Capitalization History, Investor Base, and Growth Milestones"
    body: "MUBI has accumulated roughly $184 million in aggregate disclosed lifetime financing across 11 funding rounds, anchored historically by European early-stage funds before securing its $100 million round led by Sequoia Capital in mid-2025 at a $1.0 billion post-money valuation. In 2025, MUBI generated approximately $200 million in top-line revenue but posted an accounting loss of $7.3 million alongside severe negative cash flow of $65 million in Q4 2025, driven by theatrical acquisition outlays such as the $24 million commitment for Cannes acquisition Die My Love. In response to commercial volatility and external backlash, MUBI established an Ethical Funding and Investment Policy alongside strategic production co-financing arrangements, notably a multi-year European auteur film financing pact with Helsinki-based fund manager IPR.VC."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO011"
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
