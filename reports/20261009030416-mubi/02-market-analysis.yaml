callouts:
  - calloutType: "insight"
    title: "The Arthouse Boundary Paradox"
    body: "MUBI's growth depends on a delicate economic paradox: it commands high customer loyalty and low infrastructure streaming costs by cultivating an uncompromising arthouse identity, yet scaling toward venture-backed valuation benchmarks forces the company into volatile theatrical acquisitions and institutional partnerships that risk alienating its core progressive subscriber base."
    claimRefs:
      - "CM001"
      - "CM004"
      - "CM014"
  - calloutType: "risk"
    title: "Customer Governance Sensitivity and Hit-Driven Cash Burn"
    body: "Unlike commodity streaming utilities where churn is driven by pricing or content catalog volume, MUBI operates in a market where community ethics, corporate ownership, and festival sponsorships directly govern subscriber retention. The loss of 200,000 subscribers and partner festival defections in 2025 demonstrate that market demand is tightly bound to brand reputation."
    claimRefs:
      - "CM013"
      - "CM014"
      - "CM015"
