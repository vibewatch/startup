callouts:
  - calloutType: "insight"
    title: "The Hybrid Streamer-Distributor Wedge"
    body: "MUBI avoids direct catalog warfare with mass SVOD platforms by pairing hand-picked auteur curation with MUBI GO theatrical tickets and direct theatrical distribution. This creates a cultural brand that generalist algorithm-driven streamers cannot replicate, converting cinephile hobbyists into recurring ecosystem subscribers."
    claimRefs:
      - "CP001"
      - "CP004"
      - "CP010"
  - calloutType: "risk"
    title: "Exposure to Theatrical Volatility and Ethical Capital Sensitivity"
    body: "By escalating into multi-million dollar film acquisitions such as Die My Love and accepting capital from defense-linked institutional investors like Sequoia, MUBI has exposed its business to box-office write-downs and severe cultural boycotts from its core progressive cinephile base."
    claimRefs:
      - "CP012"
      - "CP015"
      - "CP016"
