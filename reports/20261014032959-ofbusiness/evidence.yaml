evidenceGaps:
  - type: missing-source
    severity: material
    topic: financials-and-audits
    missingEvidence: >-
      Audited parent entity (OFB Tech Private Limited) balance sheets, segment gross margins, and working-capital cash
      flow statements for FY25 and FY26.
    whyItMatters: >-
      Without formal audited filings or a draft red herring prospectus (DRHP), reported turnover figures (₹20,000 Cr)
      and profit metrics cannot be independently verified against debt leverage and working-capital lockups.
    diligencePath: >-
      Review the public Draft Red Herring Prospectus (DRHP) once submitted to SEBI or obtain MCA ROC filings for OFB
      Tech Private Limited and Oxyzo Financial Services.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-ownership-structure
    missingEvidence: >-
      Fully diluted cap table, exact shareholding percentages, option pools, and preference stack for institutional
      investors listed in TO003.
    whyItMatters: >-
      Detailed equity stakes and liquidation preferences among lead investors (SoftBank, Tiger Global, Matrix Partners)
      are private and unverified prior to the public DRHP filing.
    diligencePath: >-
      Inspect the Capital Structure and Principal Shareholders chapters of the Draft Red Herring Prospectus upon SEBI
      submission.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Audited segment disclosures separating true gross merchandise value from net trading turnover and loan book
      interest income across individual industrial commodity verticals.
    whyItMatters: >-
      Without audited product-level transaction volumes and repeat-buyer retention curves, Serviceable Obtainable Market
      (SOM) market share and true procurement wallet penetration cannot be verified.
    diligencePath: >-
      Review forthcoming Draft Red Herring Prospectus (DRHP) statutory segment reporting and restated consolidated
      financial schedules prior to final public offering.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: competitor-retention-cohorts
    missingEvidence: >-
      Audited cohort-based retention, buyer reorder rates, and gross margin waterfalls across major Indian B2B
      marketplace competitors and OfBusiness.
    whyItMatters: >-
      Without cohort retention curves, assessing whether customers remain sticky due to pricing power versus subsidized
      credit availability is impossible.
    diligencePath: >-
      Inspect upcoming Draft Red Herring Prospectus (DRHP) filings for OfBusiness and competitor disclosures regarding
      customer concentration and repeat purchase rates.
    relatedQuestionRefs:
      - QP009
  - type: missing-source
    severity: material
    topic: financial-audits
    missingEvidence: >-
      Audited consolidated parent financial statements for FY25 and FY26, including formal notes on revenue recognition,
      gross margin by product line, and segment-level balance sheets.
    whyItMatters: >-
      Without independent statutory audits, reported ₹20,000 crore turnover and PBT metrics cannot be verified against
      Indian GAAP or Ind AS accounting standards prior to IPO underwriting.
    diligencePath: >-
      Obtain Ministry of Corporate Affairs (MCA) audited filings or review restated historical financial tables in the
      draft red herring prospectus (DRHP) upon submission to SEBI.
    relatedQuestionRefs:
      - QI009
  - type: private-evidence-only
    severity: material
    topic: lending-book-quality
    missingEvidence: >-
      Oxyzo loan portfolio vintage delinquency curves, provision coverage ratio, and top borrower concentration
      disclosures.
    whyItMatters: >-
      Because lending historically generated the vast majority of operating profit, deterioration in SME credit quality
      directly threatens consolidated group earnings.
    diligencePath: >-
      Examine rating agency rationale reports from CRISIL and ICRA and statutory financial disclosures from Oxyzo
      Financial Services.
  - type: private-evidence-only
    severity: material
    topic: architecture-and-infrastructure-transparency
    missingEvidence: >-
      Architectural specifications of the core ERP, cloud infrastructure redundancy, database schemas, and microservice
      uptime metrics.
    whyItMatters: >-
      Without independent disclosures regarding server scalability, uptime records, and data security standards,
      platform technical resilience cannot be rigorously underwritten.
    diligencePath: >-
      Request SOC 2 Type II audit reports, ISO 27001 certifications, cloud infrastructure topology diagrams, and
      disaster recovery SLA documentation.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: developer-signal-and-api-ecosystem
    missingEvidence: >-
      Public developer portal, open API documentation, client SDKs, or developer community metrics for ERP/accounting
      integrations.
    whyItMatters: >-
      As an industrial commerce aggregator, OfBusiness does not expose public developer repositories or API forums,
      limiting external assessment of software engineering depth.
    diligencePath: >-
      Review internal technical architecture documentation, proprietary API specifications for enterprise ERP
      connectors, and IT engineering hiring profiles.
    relatedQuestionRefs:
