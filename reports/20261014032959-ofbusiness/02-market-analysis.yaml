callouts:
  - calloutType: insight
    title: Structural Synergies of the Commerce-Plus-Financing Ecosystem
    body: >-
      Unlike pure-play B2B commerce aggregators that operate on wafer-thin distributor margins, OfBusiness couples raw
      material fulfillment with proprietary purchase financing via its regulated NBFC Oxyzo. Providing credit lines at
      15% to 18% directly disintermediates unorganized local moneylenders who extract 24% to 48%, locking in SME
      procurement loyalty and generating blended group operating profitability.
    claimRefs:
      - CM001
      - CM004
      - CM005
      - CM012
  - calloutType: risk
    title: Commodity Price Volatility and Working-Capital Concentration Risk
    body: >-
      Industrial SME procurement remains structurally vulnerable to macro commodity price fluctuations in coking coal,
      crude oil, and scrap steel. In inflationary cycles, input cost spikes compress buyer operating margins and stretch
      working-capital cycles, transferring liquidity pressure to platform credit facilities and elevating asset-quality
      monitoring requirements across the unrated borrower portfolio.
    claimRefs:
      - CM005
      - CM008
      - CM010
