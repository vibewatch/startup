        - Primary and secondary steel procurement, structural beams, rebar, billet aggregation
        - Direct captive steel mill blast furnace operations and mining concessions
        - EPC contractors, infrastructure developers, heavy fabrication shops
        - Largest single volume driver generating over ₹8,500 crore in baseline commerce revenue
      - - Non-Ferrous Metals (Aluminium, Copper, Zinc)
        - Industrial ingots, extruded profiles, wiring rods, alloy components
        - Specialty aerospace alloys and high-purity precious metals refining
        - Electrical equipment makers, auto-ancillary units, transformer plants
        - High-value transactions with strong credit pull and tight distributor margins
      - - Chemicals & Petroleum Derivatives
        - Bulk industrial solvents, polymer granules, bitumen, furnace fuels, additives
        - Retail fuel distribution, specialty pharmaceuticals, API synthesis
        - Plastics molders, chemical processors, road contractors, packaging plants
        - Fast-growing vertical generating over ₹2,500 crore with significant working-capital intensity
      - - Contract Apparel & Global Garment Manufacturing
        - Finished garment production, institutional yarn, fabric sourcing, apparel assembly
        - Fast-fashion luxury retail storefronts and direct-to-consumer online fashion
        - Tier-one global apparel brands, retail conglomerates, international buying houses
        - Fastest-scaling value-added vertical reaching ₹3,002 crore in FY26 export scale
