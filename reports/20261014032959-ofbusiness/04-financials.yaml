company:
  name: "OfBusiness"
chapter:
  number: 4
  title: "Financials"
  summary: "OfBusiness achieved approximately ₹20,000 crore in group revenue in FY26, pairing low-margin raw material commerce with high-yield SME lending via Oxyzo and higher-margin captive apparel manufacturing. Ahead of an $800M IPO with a heavy 70% secondary exit, operating cash flow reached ₹1,220 crore, but the lack of public audited parent statements and granular lending asset-quality disclosures remains an underwriting diligence gap."
sections:
  - id: "revenue-architecture-and-streams"
    title: "Revenue Architecture and Core Monetization Streams"
    body: "OfBusiness operates an integrated B2B commerce and financial architecture that links SME commodity aggregation directly with working capital financing. In FY26, the company generated approximately ₹20,000 crore in top-line turnover across raw materials, manufacturing exports, and financial services. Historically, commodity commerce generated approximately 55% of consolidated revenue, while purchase financing via Oxyzo accounted for 43% and SaaS tender intelligence through BidAssist contributed 2%. Within its core ₹19,174 crore commerce operations, the company has aggressively scaled value-added captive manufacturing, spearheaded by apparel exports which tripled from ₹843 crore in FY24 to ₹3,002 crore in FY26, expanding from 4.6% to 15.7% of total commerce volume."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI014"
    tableRefs:
      - "TI001"
  - id: "monetization-mechanics-and-spreads"
    title: "Monetization Mechanics, Financing Spreads, and Pricing"
    body: "The monetization engine relies on capturing spreads across transaction facilitation, manufacturing markup, and financial intermediation. In raw material trading, OfBusiness secures channel discounts by aggregating SME demand directly to primary industrial mills, taking a 5% to 10% trading margin. The platform's true profit driver is Oxyzo, which extends purchase financing credit lines up to $20M at annual interest rates of 15% to 18% with repayment horizons up to six months. By pricing significantly below unorganized local distributors and informal moneylenders charging 24% to 48%, OfBusiness achieves high customer stickiness and repeat borrowing while capturing substantial net interest margin spreads over its institutional bank borrowing costs."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI012"
    tableRefs:
      - "TI002"
  - id: "unit-economics-and-cost-structure"
    title: "Cost Structure, Manufacturing Build-Out, and Margin Trajectory"
    body: "To counter the low gross margin ceiling inherent in pure commodity brokering, OfBusiness has systematically internalized manufacturing, processing, and packaging capacity across its core verticals. The platform now produces an average of 40% of its traded goods within company-owned or controlled facilities, anchored by strategic acquisitions such as Bengaluru-based Indian Design. This captive infrastructure protects unit economics against raw material price shocks and improves blending margins. In FY26, the company recorded ₹406 crore in pre-tax profit (PBT), with merchant bankers projecting ₹606 crore for FY27 as captive capacity expands, though customer acquisition cost (CAC) and net revenue retention (NRR) metrics remain undisclosed private metrics."
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI009"
    tableRefs:
      - "TI003"
    figureRefs:
      - "FI001"
  - id: "capital-adequacy-and-cash-generation"
    title: "Capital Adequacy, Cash Flow Generation, and Pre-IPO Financing Dependency"
    body: "Following its $325 million Series G financing round in late 2021 that established a $5 billion private valuation benchmark, OfBusiness has financed growth primarily through operational cash flow and institutional credit lines. The group generated ₹1,220 crore in operating cash flow in FY26, projected to reach ₹1,302 crore in FY27, demonstrating that working capital demands are supported by current trading velocity. However, ahead of a planned $600M to $800M public listing targeted for March or April, the issue structure features a 30% fresh equity issue alongside a 70% offer for sale (OFS). This heavy secondary share component indicates that substantial capital will flow to early financial sponsors rather than funding new working capital buffers."
    claimRefs:
      - "CI010"
      - "CI011"
      - "CI013"
  - id: "diligence-underwriting-verdict"
    title: "Financial Underwriting Verdict and Audit Disclosure Gaps"
    body: "From an underwriting standpoint, OfBusiness presents a resilient financial model where high-margin lending and captive manufacturing subsidize low-margin commodity distribution. The platform's reported operating cash flow and consecutive years of pre-tax profitability provide commercial validation rare among late-stage Indian B2B unicorns. Nonetheless, diligence underwriting is currently constrained by the absence of publicly accessible consolidated FY25 and FY26 audited statutory statements, segment-level EBITDA disclosures, and Oxyzo loan book vintage loss curves. Institutional investors must treat unverified merchant banker projections cautiously until official DRHP financial restatements are lodged with SEBI."
    claimRefs:
      - "CI001"
      - "CI009"
      - "CI010"
      - "CI011"
