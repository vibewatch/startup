callouts:
  - calloutType: "strength"
    title: "Synergistic Dual Model Drives Margin and Retention"
    body: "By bundling raw material aggregation with purchase financing and captive manufacturing, OfBusiness breaks the traditional thin-margin trap of B2B marketplaces. Financing provides sticky switching barriers and high returns on capital, while captive manufacturing in verticals like apparel expands gross margins beyond basic distribution markups."
    claimRefs:
      - "CI002"
      - "CI006"
      - "CI008"
      - "CI012"
  - calloutType: "risk"
    title: "Capital Intensity and High Shareholder Liquidation in IPO Structure"
    body: "While OfBusiness demonstrates strong operating cash flow of ₹1,220 crore, the prospective $600M-$800M IPO structure is heavily weighted toward existing investor liquidity (70% offer for sale vs 30% fresh issue). Underwriters must verify whether the remaining 30% fresh equity is adequate to support expanding working capital needs across 30,000+ employees and growing manufacturing facilities."
    claimRefs:
      - "CI001"
      - "CI010"
      - "CI011"
