    - type: missing-source
      severity: minor
      topic: developer-signal-and-api-ecosystem
      missingEvidence: Public developer portal, open API documentation, client SDKs, or developer community metrics for ERP/accounting integrations.
      whyItMatters: As an industrial commerce aggregator, OfBusiness does not expose public developer repositories or API forums, limiting external assessment of software engineering depth.
      diligencePath: Review internal technical architecture documentation, proprietary API specifications for enterprise ERP connectors, and IT engineering hiring profiles.
