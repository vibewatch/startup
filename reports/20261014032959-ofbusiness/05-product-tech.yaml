figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Six-tier architectural model bridging client discovery, commerce matching, financial underwriting, data infrastructure, and physical fulfillment.
    data:
      layers:
        - label: Client Engagement & Intelligence Layer
          detail: User-facing mobile and web applications (OfBusiness App, Nexizo.AI, BidAssist) providing price discovery, Ask VedAI assistant, and tender analytics.
          modules:
            - OfBusiness Android/iOS App
            - Nexizo.AI Analytics Portal
            - BidAssist Tender Platform
            - Ask VedAI Market Assistant
        - label: Commerce Aggregation & Bidding Layer
          detail: Proprietary demand pooling algorithms that aggregate fragmented SME purchase orders into bulk procurement contracts directly with primary manufacturers.
          modules:
            - Demand Pooling Engine
            - Supplier Bidding & Quote Engine
            - Commodity Benchmark Pricer
            - Order Routing & Matching
        - label: Embedded Finance & Underwriting Layer
          detail: Captive NBFC integration (Oxyzo) utilizing alternate cluster transaction data, supplier history, and purchase orders to sanction unsecured credit lines.
          modules:
            - Alternate Data Risk Engine
            - Oxyzo Purchase Financing
            - Collateral-Free Credit Limits
            - Automated Invoicing & Ledgers
        - label: Manufacturing & Physical Fulfillment Layer
          detail: Pan-India physical distribution network covering Tier 1, 2, and 3 clusters, combined with ~40% owned manufacturing, processing, and packaging capacity.
          modules:
            - 40% In-House Manufacturing (Indian Design)
            - Pan-India Hub & Spoke Logistics
            - BIS & MTC Quality Inspection
            - E-Way Bill & Dispatch Tracking
        - label: Data Infrastructure & Analytics Core
          detail: Centralized industrial commodity database tracking live pricing, regional freight rates, historical supply curves, and supplier performance scores.
          modules:
            - Commodity Pricing Data Lake
            - Supplier Performance Registry
            - Transaction & Fraud Ledgers
            - Cluster Consumption Models
        - label: Security, Governance & Compliance Layer
          detail: Regulatory and quality assurance layer enforcing BIS compliance, Mill Test Certification verification, tax invoice matching, and RBI NBFC controls.
          modules:
            - BIS & NABL Quality Audit Gateway
            - Tax & E-Way Bill Reconciliation
            - RBI NBFC Prudential Controls
            - Enterprise Access & Audit Logging
    approximationNotes: Architectural tiers synthesized from public platform descriptions, mobile application teardowns, and corporate disclosures.
