  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job / Procurement Step
      - Traditional SME Workflow
      - OfBusiness Tech Solution
      - Measurable Benefit
      - Operational Limitation
    rows:
      - - Raw Material Price Discovery
        - Calls to multiple regional brokers, opaque quotes, wide bid-ask spread
        - Live pricing dashboard, historical price charts, Ask VedAI query assistant
        - Transparent market benchmarks, saves 2-5 days in negotiation cycle
        - Prices in volatile categories subject to rapid spot shifts prior to order confirmation
      - - Supplier Selection & Ordering
        - Informal local networks, high risk of grade substitution or counterfeit material
        - Curated network of verified suppliers and BIS-certified manufacturers
        - Assurance of Mill Test Certificate compliance and consistent material specs
        - Physical supplier quality audits reliant on manual cluster-level field inspections
      - - Purchase Financing & Payment
        - Informal credit at 24-48% APR, strict collateral requirements from banks
        - Embedded Oxyzo credit limits at 15-18% APR, collateral-free purchase financing
        - Instant liquidity preservation, payment cycles aligned up to six months
        - Credit approvals restricted to vetted manufacturing sectors with turnover >$3M
      - - Dispatch & Order Tracking
        - Manual phone follow-ups with truck operators, blind transit times
        - Digital e-way bill generation, real-time shipment status, in-app ledger sync
        - Predictable factory delivery scheduling, simplified tax and accounting records
        - Transit delays vulnerable to regional highway logistics bottlenecks and weather shocks
    notes: Step-by-step procurement workflow compared to traditional informal trader channels in Indian industrial clusters.
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE009
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Architecture Layer / Component
      - System Role & Capability
      - Core Dependency / Infrastructure
      - Technical Risk / Vulnerability
    rows:
      - - Client Engagement & Discovery Layer
        - Mobile (Android) and web portals, price tickers, Ask VedAI conversational bot
        - Cloud-hosted web front-end, Google Play distribution, mobile push notifications
        - Mobile app performance degradation or regional connectivity loss in industrial clusters
      - - Commerce & Bidding Engine
        - Aggregates fragmented purchase inquiries, runs matching engine against primary mills
        - Proprietary order routing system, supplier catalog databases, pricing algorithms
        - Algorithm execution bottlenecks during extreme commodity price swings and supply crunches
      - - Fintech & Underwriting Engine (Oxyzo)
        - Evaluates buyer credit limits using alternate cluster and transaction data
        - Proprietary credit scoring models, banking API gateways, RBI-regulated NBFC ledgers
        - Default correlation across SME cohorts during economic downturns; data validation risks
      - - Logistics & In-House Manufacturing Layer
        - Dispatches freight across pan-India clusters; manages 40% in-house manufacturing
        - Third-party fleet partners, warehouse staging depots, owned factories (e.g., Indian Design)
        - Supply chain disruption, transit damage, factory operational stoppages, labor compliance
    notes: Four-layer operating architecture integrating software front-ends, transaction processing, captive underwriting, and physical supply chain execution.
    claimRefs:
