callouts:
  - calloutType: insight
    title: Dual-Engine Symbiosis of Commerce and Captive Lending
    body: The core technical differentiator of OfBusiness is not isolated SaaS software or a basic e-commerce storefront, but the programmatic pairing of physical demand aggregation with embedded credit. By capturing SME transactions through the bidding engine, the platform acquires granular operational data that enables Oxyzo to underwrite working capital loans with lower default risk and lower interest rates than unorganized informal money lenders.
    claimRefs:
      - CE002
      - CE006
      - CE012
  - calloutType: risk
    title: Physical Asset Intensity and Software Disclosure Deficit
    body: While marketed as a tech-enabled B2B unicorn, OfBusiness manufactures or packages 40% of its volume in owned facilities and operates extensive physical logistics across Tier 1, 2, and 3 manufacturing clusters. The absence of public developer resources, open API documentation, or published cloud architecture audits means investors must view the company as a tech-augmented industrial conglomerate rather than an asset-light software marketplace.
    claimRefs:
      - CE007
      - CE013
      - CE014
