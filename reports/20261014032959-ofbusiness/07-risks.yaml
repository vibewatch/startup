callouts:
  - calloutType: "risk"
    title: "Twin-Engine Vulnerability: Working Capital and Credit Risk Feedback Loop"
    body: "The core competitive advantage of OfBusiness—combining bulk material procurement with Oxyzo purchase financing—creates a compounding downside loop during industrial downcycles. If raw material prices collapse or infrastructure project disbursements stall, SME borrowers face simultaneous inventory devaluation and cash flow deficits. This forces Oxyzo to absorb higher default rates while OfBusiness carries aged receivables, magnifying balance sheet stress across both operating arms."
    claimRefs:
      - "CR001"
      - "CR003"
      - "CR004"
      - "CR006"
      - "CR007"
  - calloutType: "insight"
    title: "IPO Readability and Disclosure Opacity Disconnect"
    body: "OfBusiness has transitioned from a digital B2B aggregator into an asset-heavy conglomerate spanning physical manufacturing factories, an NBFC credit business, and enterprise SaaS. While this diversification provides revenue scale (approaching ₹20,000 crore), it significantly complicates pre-IPO evaluation. Prospective public investors face limited transparency regarding intra-group transactions, vertical profit margins, and true credit loss curves without a publicly filed DRHP."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR005"
      - "CR008"
      - "CR010"
