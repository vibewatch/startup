companyProfile:
  summary: >-
    OfBusiness is a late-stage Indian industrial platform that combines B2B raw-material procurement, captive
    manufacturing, and embedded SME financing. Founded in 2015 and headquartered in Gurugram, the company serves
    industrial buyers across metals, chemicals, apparel, and related supply chains while pairing commerce with
    working-capital credit and tender-intelligence products.
