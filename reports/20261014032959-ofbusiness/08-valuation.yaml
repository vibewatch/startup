callouts:
  - calloutType: "recommendation"
    title: "Valuation Stance and Entry Discipline"
    body: "OfBusiness is reasonably valued at its unlisted anchor of $4.4B to $5.0B based on roughly ₹20,000 crore in top-line run rate and positive cash generation. Investors should resist paying growth premiums above this private benchmark until official DRHP filings provide audited parent financials and confirm sustainable SME lending economics."
    claimRefs:
      - "CV001"
      - "CV004"
  - calloutType: "risk"
    title: "Secondary Liquidity and Debt Overhead"
    body: "The prospective IPO structure carries substantial overhang, with 70% of the $600M–$800M offering allocated to secondary Offer for Sale rather than corporate balance sheet expansion. Combined with an 85.6% surge in annual finance costs, this concentration elevates downside vulnerability during macroeconomic credit tightening."
    claimRefs:
      - "CV003"
      - "CV005"
