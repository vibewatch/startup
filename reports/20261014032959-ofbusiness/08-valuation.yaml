company:
  name: "OfBusiness"
chapter:
  number: 8
  title: "Valuation"
  summary: "OfBusiness demonstrates robust revenue scale and positive operating cash flow across four industrial verticals, but unfiled DRHP status, surging finance costs, and an IPO structure heavily weighted toward secondary offer-for-sale liquidity justify a disciplined track stance anchored near its $4.0–$4.5 billion private valuation rather than an expanded public market premium."
sections:
  - id: "investment-thesis-and-anti-thesis"
    title: "Investment Thesis and Core Anti-Thesis"
    body: "The core investment thesis for OfBusiness rests on its demonstrated ability to scale multi-category industrial B2B commerce while maintaining operating profitability. Unlike asset-light procurement marketplaces that struggle with transaction margins, OfBusiness integrates raw material aggregation across metals, chemicals, agriculture, and apparel with captive manufacturing and embedded working-capital financing via Oxyzo. This vertical integration has propelled annual revenue to approximately ₹20,000 crore by FY26, anchored by profitable cash generation. However, the anti-thesis highlights critical structural vulnerabilities. Unlisted company disclosures indicate that consolidated return on assets remained modest at 3.33% in FY24, reflecting the lower-margin reality of bulk industrial trading. More critically, annual finance costs surged 85.6% to ₹468.17 crore in FY24, illustrating that rapid growth remains heavily reliant on debt-fueled working capital. Until OfBusiness demonstrates sustainable operating leverage without compounding financing expenses, the business model exhibits high cyclical vulnerability to Indian interest rate and credit cycles."
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV009"
      - "CV010"
    tableRefs:
      - "TV002"
  - id: "financing-and-cap-table"
    title: "Financing History and Unlisted Multiples"
    body: "OfBusiness's capitalization history reflects aggressive institutional backing followed by increasing secondary liquidity events. The company reached unicorn status in July 2021 and subsequently secured a $5 billion valuation in its December 2021 Series G round led by Alpha Wave Global, Tiger Global, and SoftBank Vision Fund 2. Total lifetime equity and debt capital raised exceeds $867 million. Recent transaction activity, however, demonstrates shifting investor positioning. In October 2024, early growth backer Zodius Capital completed a full secondary exit netting $100 million to $120 million, followed by an April 2025 pre-IPO investment of ₹100 crore ($11.7 million) led by Cornerstone Ventures. In Indian unlisted equity markets, shares trade at an indicative price of ₹475, implying an unlisted trailing price-to-earnings multiple of approximately 5.8x based on FY24 earnings. While this multiple appears heavily discounted compared to pure-play listed tech peers such as Indiamart (27.4x P/E), it reflects higher balance-sheet leverage (0.73 debt-to-equity) and working-capital drag, supporting valuation discipline."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV004"
      - "CV007"
      - "CV008"
      - "CV011"
  - id: "scenarios-and-valuation-logic"
    title: "Valuation Scenarios and Return Distribution"
    body: "Evaluating OfBusiness's forward return profile requires analyzing scenario drivers across revenue realization, margin expansion, and exit multiples. In the base case (55% probability), OfBusiness delivers ₹20,000 crore in FY26 revenue with ₹406 crore in profit before tax and ₹1,220 crore in operating cash flow, supporting a public listing market capitalization of $4.4 billion to $5.0 billion at an 18–22x P/E multiple. The bull case (25% probability) assumes accelerated expansion in high-margin apparel manufacturing—which tripled to ₹3,002 crore in FY26—pushing FY27 revenue to ₹23,520 crore and PBT to ₹606 crore, supporting a valuation of $6.0 billion to $7.0 billion (25–30x P/E). Conversely, the bear case (20% probability) models rising non-performing assets at Oxyzo, continued growth in finance costs, and multiple compression, limiting valuation to $3.0 billion to $3.5 billion. Because the distribution is tightly clustered around the private round anchor, risk-adjusted returns do not warrant aggressive pre-IPO accumulation."
    claimRefs:
      - "CV001"
      - "CV006"
      - "CV009"
      - "CV010"
      - "CV013"
    tableRefs:
      - "TV003"
  - id: "recommendation-and-exit-readiness"
    title: "Recommendation, Exit Readiness, and Diligence Criteria"
    body: "We assign OfBusiness a recommendation of Track with medium confidence, a high risk rating, and a fair valuation stance. While the company's operating scale across 30,000 employees and four primary verticals is impressive, exit readiness is constrained by critical governance and transaction factors. Official market sources confirm that OfBusiness's Draft Red Herring Prospectus (DRHP) has not yet been filed with SEBI, leaving public markets without audited parent financial statements or transparent segment breakdown between B2B trading and NBFC lending. Furthermore, merchant banker reports indicate that the planned $600 million to $800 million IPO will consist of 70% secondary Offer for Sale (OFS) and only 30% fresh primary issuance. This heavy secondary weighting signals that early institutional investors are prioritizing liquidity over corporate capitalization. A transition to a Buy recommendation requires formal DRHP submission, confirmed deceleration of finance costs, and proof that apparel manufacturing can reliably expand consolidated EBITDA margins beyond 8%."
    claimRefs:
      - "CV002"
      - "CV005"
      - "CV006"
      - "CV012"
      - "CV014"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
