        - "$6.0B–$7.0B market cap (25–30x P/E); successful DRHP filing and strong domestic public debut"
        - "Delayed IPO approval, regulatory pushback on fintech underwriting, or margin compression"
      - - "Base Case"
        - "55%"
        - "₹20,000 Cr FY26 revenue with ₹406 Cr PBT; operating cash flows reach ₹1,220 Cr"
        - "$4.4B–$5.0B market cap (18–22x P/E); listing clears at existing private round valuation anchor"
        - "70% OFS component creates secondary selling pressure; working capital financing costs remain high"
      - - "Bear Case"
        - "20%"
        - "Revenue growth slows below 15%; finance costs exceed ₹600 Cr; ROA compresses below 3.0%"
        - "$3.0B–$3.5B market cap (12–15x P/E); down-round valuation or postponed public offering"
        - "Sharp deterioration in SME credit quality, rising NPAs at Oxyzo, or export slowdown in apparel"
    notes: "Scenario parameters modeled on pre-IPO banker estimates, unlisted market benchmarks, and historical margin realizations."
    claimRefs:
