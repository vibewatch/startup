callouts:
  - calloutType: "strength"
    title: "Integrated Commerce-plus-Lending Symbiosis"
    body: "Unlike pure-play commodity aggregators or standalone digital lenders, OfBusiness creates a self-reinforcing flywheel: procurement transaction data underwrites working capital loans via Oxyzo at 15–18% APR, while loan proceeds are directly locked into raw-material purchases on the platform."
    claimRefs:
      - "CO002"
      - "CO011"
  - calloutType: "risk"
    title: "Heavy Secondary Exit and Public DRHP Timing Uncertainty"
    body: "The proposed $600M–$800M initial public offering is heavily weighted toward secondary liquidity (70% Offer for Sale vs 30% fresh equity), following prior IPO postponements from 2022 and 2025. Without public DRHP filings, unverified working-capital intensity and loan-loss provisions present material diligence gaps."
    claimRefs:
      - "CO009"
      - "CO010"
