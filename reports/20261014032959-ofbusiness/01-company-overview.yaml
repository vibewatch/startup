company:
  name: "OfBusiness"
chapter:
  number: 1
  title: "Company Overview"
  summary: "OfBusiness operates an integrated B2B raw-material commerce, manufacturing, and supply-chain financing ecosystem serving Indian industrial SMEs. Founded in 2015 and headquartered in Gurugram, the group reported ₹20,000 crore turnover and ₹700 crore profit after tax for FY26, anchored by its commerce platform, Oxyzo NBFC, and expanding in-house manufacturing footprint ahead of a proposed $600M–$800M initial public offering."
sections:
  - id: "corporate-identity-and-operating-model"
    title: "Corporate Identity, Operating Architecture, and Enterprise Scale"
    body: "OfBusiness (incorporated as OFB Tech Private Limited) was founded in 2015 and commenced commercial operations in 2016 from its headquarters in Gurugram, Haryana. The company was established to address endemic supply-chain frictions faced by Indian small and medium-sized enterprises (SMEs) across core infrastructure and manufacturing sectors, specifically fragmented raw-material procurement, uncompetitive volume pricing, and chronic working-capital deficits. Rather than operating as an asset-light classifieds portal or a detached digital aggregator, OfBusiness built a unified multi-platform operating model linking physical commodity aggregation with cash-flow-backed financial underwriting.\n\nThe group's commercial architecture operates across three synchronized pillars. First, the core OfBusiness commerce platform aggregates demand from thousands of SME fabricators, contractors, and industrial buyers to procure bulk commodities—primarily structural steel, TMT bars, chemicals, polymers, textiles, and agricultural inputs—directly from primary and secondary mills, passing volume discounts to end buyers. Second, Oxyzo Financial Services, established as an RBI-registered Non-Banking Financial Company (NBFC) subsidiary in 2017, provides structured purchase financing and cash-flow-based credit lines at interest rates typically ranging between 15% and 18%, substantially undercutting informal secondary market lending costs of 24% to 48%. Third, BidAssist functions as a proprietary intelligence engine, tracking and categorizing over 3,500 daily government and public-sector tenders across India to help client enterprises discover and win incremental contracts.\n\nAs of 2026, OfBusiness reported substantial operational scale, disclosing an enterprise headcount of more than 30,000 employees, group turnover of approximately ₹20,000 crore, and profit after tax (PAT) of ₹700 crore. The platform spans active physical operations across 26 Indian states, connecting more than 700,000 registered SMEs, while maintaining commercial export relationships in over 70 destination countries."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO011"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Executive Leadership, Co-Founding Team, and Governance Dynamics"
    body: "OfBusiness was co-founded by a multidisciplinary team combining top-tier management consulting, venture capital, and engineering backgrounds. Group Chief Executive Officer Asish Mohapatra holds degrees from IIT Kharagpur and the Indian School of Business (ISB), having previously served as an engagement manager at McKinsey & Company and Vice President at Matrix Partners India, where he evaluated early-stage industrial technologies and consumer investments. Co-founder Ruchi Kalra, an IIT Delhi and ISB alumna and former Partner at McKinsey & Company, led the design and scaling of Oxyzo Financial Services, serving as its chief executive and earning recognition as Women Entrepreneur of the Year in 2026.\n\nThe broader founding group provides specialized functional coverage across operations, engineering, and commodity trading. Co-founder and Chief Strategy Officer Vasant Sridhar, an IIT Madras graduate, directs strategic expansion and commercial operations, particularly spearheading the rapid scaling of the apparel manufacturing vertical. Chief Technology Officer Bhuvan Gupta, an engineering graduate from BITS Pilani and former Vice President of Engineering at Snapdeal, leads proprietary software development, mobile procurement applications, and the BidAssist algorithmic tender-matching platform. Co-founder Nitin Jain, an IIT Delhi computer science graduate and former investment banking technologist at Royal Bank of Scotland, directs agricultural commodity supply chains as CEO of O'AgriFarm.\n\nFrom a diligence and governance perspective, OfBusiness exhibits notable leadership concentration. The marital and professional partnership between Asish Mohapatra and Ruchi Kalra establishes deep strategic alignment across the parent commerce business and the lending subsidiary, but it also creates elevated key-person dependency. Executive succession frameworks, independent board committee authority, and transaction auditing across related-party entities represent crucial areas of institutional inquiry ahead of public equity listing."
    claimRefs:
      - "CO001"
      - "CO014"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-investor-syndicate"
    title: "Financing History, Institutional Syndicate, and Balance Sheet Structure"
    body: "OfBusiness has completed seven institutional equity financing rounds, progressing from early venture backing to prominent sovereign and global crossover sponsorship. Early institutional validation was anchored by Matrix Partners India (now Z47), which led Series A and participated consecutively in subsequent rounds. In 2018, the company raised a ₹200 crore (~$29 million) Series C led by Creation Investments and Falcon Edge Capital, providing catalytic equity to scale the Oxyzo lending book. As manufacturing demand accelerated during post-pandemic supply realignments, OfBusiness completed consecutive capital infusions throughout 2021, culminating in a $160 million round led by SoftBank Vision Fund-II and a $325 million Series G in December 2021 that established a $5.0 billion post-money enterprise valuation.\n\nThe capitalization structure is characterized by an unusual dual-unicorn dynamic. In March 2022, OfBusiness unbundled Oxyzo Financial Services into an independently capitalized corporate vehicle, securing $200 million in Series A funding led by Alpha Wave Global and Tiger Global at an independent valuation exceeding $1 billion. This spin-off created two distinct balance sheets within the broader group perimeter: an asset-heavy, inventory-carrying commerce engine and a regulated NBFC subject to Reserve Bank of India capital adequacy and provisioning mandates.\n\nInstitutional investors on the cap table include SoftBank Vision Fund-II, Tiger Global Management, Matrix Partners India, Norwest Venture Partners, Falcon Edge Capital, Creation Investments, and Zodius Capital. While historical private rounds reflect strong tier-one endorsement, recent market benchmarks indicate valuation consolidation: the 2026 Global Unicorn Ranking positioned OfBusiness at an enterprise valuation of 34 billion RMB (~$4.8 billion), down moderately from 36.5 billion RMB in 2025. Detailed cap table breakdowns, preference stacks, and voting agreements remain undisclosed private data pending formal regulatory prospectus publication."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO015"
    tableRefs:
      - "TO003"
  - id: "operational-milestones-and-ipo-trajectory"
    title: "Strategic Milestones, Manufacturing Integration, and Public Offering Outlook"
    body: "Over its decade-long evolution, OfBusiness transitioned from a pure-play raw-material trading intermediary into a vertically integrated manufacturing and industrial fulfillment platform. To capture higher gross margins and insulate unit economics from volatile spot commodity cycles, the group executed an aggressive programmatic acquisition strategy, acquiring 19 industrial manufacturing and processing businesses. Key acquisitions include Indian Design, an export-oriented garment manufacturer in Bengaluru, and Koeleman India, an agro-processing exporter. Consequently, OfBusiness now manufactures, processes, and packages an average of 40% of its products across core verticals in company-owned facilities.\n\nThis manufacturing pivot is exemplified by the apparel segment, which emerged as the group's fastest-growing vertical in FY26. Apparel turnover tripled from ₹843 crore in FY24 to ₹3,002 crore in FY26, expanding from 4.6% to 15.7% of total commerce turnover. The division serves top-tier global retailers including Uniqlo, Adidas, and Skechers, while expanding manufacturing operations across southern India and Bangladesh. Complementing its industrial assets, OfBusiness launched Nexizo.AI in 2025, an artificial intelligence platform providing SMEs with real-time commodity pricing analytics, verified buyer discovery, and supply-chain competitive intelligence.\n\nThe group's initial public offering trajectory has encountered repeated timing realignments. OfBusiness initially evaluated a $2.0 billion domestic listing in 2022, subsequently retargeted a $1.0 billion offering for the second half of 2025, and subsequently postponed the transaction. Current merchant banker reports indicate the company is preparing a $600M–$800M listing at an equity valuation of $4.4B–$5.0B, engaging Morgan Stanley, JPMorgan, Citigroup, and Axis Capital. Diligence reviews reveal that the proposed offering structure is heavily weighted toward secondary shareholder liquidity, featuring a 70% Offer for Sale (OFS) component against 30% fresh equity issuance, underscoring substantial pre-IPO investor realization pressures."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO012"
      - "CO013"
    figureRefs:
      - "FO001"
  - id: "diligence-synthesis-and-underwriting-conclusions"
    title: "Diligence Summary, Evidence Gaps, and Underwriting Considerations"
    body: "OfBusiness presents a compelling operational profile combining massive top-line scale (₹20,000 crore turnover), sustained bottom-line profitability (₹700 crore PAT in FY26), and a differentiated credit-commerce integration model. The company's ability to cross-sell raw materials and working-capital finance creates high customer stickiness across more than 700,000 registered industrial SMEs. Furthermore, backward integration into owned manufacturing facilities provides margin enhancement compared to pure brokerage models.\n\nHowever, institutional underwriting must weigh significant analytical gaps and structural risks. Primary among these is the heavy 70% Offer for Sale component in the proposed public listing, signaling that existing venture sponsors seek liquidity ahead of public market execution. Additionally, the lack of publicly filed, audited entity-level financial statements for FY25 and FY26 prevents independent reconciliation of gross trading margins, working-capital cash burn, and credit loss provisions. Until the Draft Red Herring Prospectus is formally lodged with SEBI, investors must treat headline revenue and profitability figures as management-reported metrics requiring conservative verification."
    claimRefs:
      - "CO003"
      - "CO009"
      - "CO010"
      - "CO012"
