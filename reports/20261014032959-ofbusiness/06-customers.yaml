callouts:
  - calloutType: "insight"
    title: "The B2B Commerce-Lending Lock-In Loop"
    body: "OfBusiness's customer retention engine relies on bundling raw material procurement with Oxyzo working capital financing. By offering credit limits up to ₹2 crore at 15% to 18% interest, OfBusiness meaningfully undercuts traditional moneylenders charging 24% to 48%, turning financing into a primary customer acquisition and retention moat."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU009"
  - calloutType: "risk"
    title: "The Registered vs. Transacting Disconnect and Concentration Opacity"
    body: "While OfBusiness markets an impressive headline metric of 700,000+ registered SMEs, confirmed credit recipients stand at just 3,000+ businesses and historical transacting clients totaled 4,500 in 2022. Furthermore, OfBusiness discloses zero cohort churn, NRR, or top-account concentration data, leaving investors unable to verify the underlying durability of its SME customer base ahead of its planned IPO."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU008"
      - "CU011"
      - "CU014"
