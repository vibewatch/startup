chapter:
  number: 6
  title: "Customers"
  summary: "OfBusiness serves over 700,000 registered SMEs and 100,000+ active businesses across Indian manufacturing and construction clusters by bundling raw material procurement with embedded Oxyzo credit. While vertical expansion into apparel has added top-tier enterprise accounts like Uniqlo and Adidas generating ₹3,002 crore in FY26, public disclosures lack audited cohort retention curves, NRR, and customer concentration data ahead of its planned IPO."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation and Buyer Economics"
    body: "OfBusiness serves an industrial customer base structured across distinct buyer tiers and product verticals in India's core economy. The platform's foundational tier comprises over 700,000 registered small and medium enterprises (SMEs), with more than 100,000 businesses actively transacting across manufacturing, construction, infrastructure, and capital goods clusters in Tier I and Tier II cities. Core industrial buyers typically operate with monthly raw material requirements between ₹50 lakh and ₹2 crore across heavy categories including structural steel, TMT bars, bulk chemicals, industrial polymers, and cement. For these SME buyers, traditional procurement is highly fragmented and plagued by punitive local credit terms where informal moneylenders and distributors charge 24% to 48% annualized interest. By acting as a bulk aggregator sourcing directly from primary manufacturers, OfBusiness delivers volume pricing benefits alongside purchase financing from its NBFC arm, Oxyzo. In addition to small industrial workshops, the customer base encompasses mid-market emerging corporates with annual revenues between ₹50 crore and ₹500 crore, as well as large multinational enterprise accounts that source specialized finished goods."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU006"
      - "CU007"
      - "CU009"
    tableRefs:
      - "TU001"
  - id: "customer-journey-and-adoption"
    title: "Customer Journey, Touchpoints, and Platform Adoption Loops"
    body: "The adoption pathway for an OfBusiness customer integrates digital discovery, physical procurement, and embedded credit underwriting into a self-reinforcing commercial loop. Customer acquisition begins through specialized digital front-ends, notably the OFB mobile application for real-time commodity price tracking across 100+ categories, BidAssist for discovering government and private tenders, and the recently launched Nexizo.AI platform for competitive intelligence and buyer-supplier matching. Once an SME identifies raw material requirements, OfBusiness utilizes its proprietary bidding engine to match demand with verified suppliers while assessing the buyer's creditworthiness. Rather than relying solely on conventional audited balance sheets—which are often inadequate for smaller Indian manufacturing firms—Oxyzo evaluates alternative operational data, transaction history, and buyer-seller network signals to underwrite collateral-free credit limits up to ₹2 crore. Financing is disbursed at competitive rates between 15% and 18% with flexible repayment cycles extending up to 60 days. This capital preservation incentive cements customer loyalty, as repaid limits unlock subsequent purchase orders, creating an expansion loop across adjacent product categories and deeper procurement wallet share."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU008"
      - "CU009"
      - "CU012"
      - "CU013"
    figureRefs:
      - "FU001"
  - id: "named-customer-proof"
    title: "Enterprise Customer Proof and Vertical Expansion in Apparel"
    body: "While core SME buyers across metal and chemical clusters remain largely anonymous in public disclosures, OfBusiness has established documented, high-profile enterprise customer relationships within its rapidly scaling apparel vertical. Following the strategic acquisition of Bengaluru-based garment manufacturer Indian Design, OfBusiness expanded its apparel operations across South India, Delhi NCR, and Bangladesh to supply seven of the world's top ten global apparel retail brands. Verified production customers include multinational retailers Uniqlo, Adidas, Skechers, Michael Kors, and specialty boutique fashion label Doen. In this vertical, OfBusiness combines owned and contracted manufacturing capacity with raw fabric sourcing, packaging, and international export logistics to more than 70 countries. The apparel division expanded revenue more than three-fold from ₹843 crore in FY24 to ₹3,002 crore in FY26, representing 15.7% of OfBusiness's ₹19,174 crore commerce business. These enterprise contracts validate OfBusiness's ability to satisfy stringent global vendor compliance, quality standards, and high-volume delivery timelines, establishing proof of enterprise adoption beyond its domestic SME procurement base."
    claimRefs:
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU003"
  - id: "customer-retention-and-concentration"
    title: "Adoption Trajectory, Retention Durability, and Concentration Risks"
    body: "OfBusiness's customer growth trajectory reflects substantial top-of-funnel expansion, progressing from 700 SME customers in 2016 to over 4,500 transacting SMEs by July 2022, and surpassing 100,000 active clients across 24 states by 2025. In its early operating history, OfBusiness reported repeat purchase rates exceeding 60%, suggesting strong product-market fit when pairing procurement with credit. However, a rigorous diligence analysis reveals significant analytical gaps between headline registered user counts and durable repeat purchasing. While 700,000+ SMEs are registered on the platform, confirmed active credit recipients stand at approximately 3,000+ SMEs, demonstrating that embedded lending is selectively deployed to higher-tier businesses with sufficient turnover. Crucially, OfBusiness does not disclose net revenue retention (NRR), gross revenue retention (GRR), annual customer cohort churn curves, or revenue concentration for its top 10 and top 20 accounts. The absence of audited cohort retention data leaves open whether top-line commercial growth is driven by expanding wallet share among seasoned clients or continuous new client acquisition masking underlying churn."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU006"
      - "CU008"
      - "CU010"
      - "CU011"
      - "CU014"
    tableRefs:
      - "TU002"
