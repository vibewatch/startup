        - Procurement, logistics, BidAssist tendering
        - Volume discounts passed to buyer; 15-18% loans
        - Preserves cash flow via 30-180 day tailored credit lines
      - - Traditional Offline Brokers
        - Multi-tier markups (8-15% cost inflation)
        - Local transport and physical warehousing
        - Informal credit with implicit 24-48% carrying cost
        - Depletes liquidity through expensive short-term dealer credit
      - - Pure-Play Digital Platforms
        - Commission or take-rate fee (2-5%)
        - Software listing and order dispatch tracking
        - Standard list pricing with limited trade terms
        - Requires upfront cash or external buyer financing
