callouts:
  - calloutType: strength
    title: Coupling of Commerce and Proprietary Credit Creates Defensible SME Lock-in
    body: >-
      By underwriting raw material purchases using proprietary transaction data rather than traditional collateral, OfBusiness addresses
      working capital shortages that generic software platforms and traditional lenders cannot easily resolve.
    claimRefs:
      - CP001
      - CP004
      - CP006
  - calloutType: risk
    title: Commodity Trading Margins Remain Exposed to Volatility and Channel Competition
    body: >-
      Raw material trading margins between 5% and 10% leave little cushion against commodity downturns, driving the strategic necessity of
      pruning low-margin lines and building in-house processing capacity.
    claimRefs:
      - CP009
      - CP010
      - CP013
