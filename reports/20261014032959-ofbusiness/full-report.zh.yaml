      - number: '2.2'
        title: 市场规模视角：全球 B2B 商业、印度制造业 TAM 与可触达规模
        blocks:
          - type: paragraph
            body: >-
              OfBusiness 的商业机会不能只用一个不受约束的 TAM 估算来判断。 全球层面，企业采购部门从手工纸质采购转向软件化供应网络，使 B2B 采购电商形成估计 $14.9 trillion 的年度交易池。
              印度制造业工业交易的 TAM 约为 $700 billion，覆盖基础设施、工程和工业加工。 进一步聚焦年营业额 ₹50 crore–₹500 crore 的中型工业 SME，可服务市场对应的原材料采购支出约为
              $150 billion–$200 billion；其中当前数字采购渗透额仅约 $20 billion–$25 billion，仍有较长扩张跑道。 FY2025，OfBusiness 记录合并收入 ₹22,241
              crore，约合 $2.67 billion 的实际运营规模；服装等垂直业务在 FY26 做到 ₹3,002 crore，也说明增值制造可以把可服务边界推到商品聚合之外。
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM009
              - CM012
