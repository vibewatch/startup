  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 采购格局与现状采购替代方案
        blocks:
          - type: paragraph
            body: >-
              印度工业原材料分销仍由传统非组织化中间商、区域库存商和本地佣金经纪主导，而非数字平台。 采购结构钢、水泥、聚合物和工业化学品的 SME 往往要经过多层经销，每层都会在出厂价上加收
              8%–15%，造成区域价格不透明：TMT 钢筋在生产集群与消费地之间每吨可相差 ₹2,000–₹4,000。 虽然印度已有超过 176
              家建材和工业市场创业公司试图打破碎片化，但工业买家的主要替代选择仍是提供关系型非正式信贷的线下经销商，其年化融资成本为 24%–48%。 OfBusiness
              通过绕开多层经销网络、直接从生产商汇聚批发量，并由持牌放贷子公司 Oxyzo 配套透明材料定价和机构授信，解决这一现状摩擦。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
      - number: '3.2'
        title: 替代运营模式与能力比较
        blocks:
          - type: paragraph
            body: >-
              不同渠道各有取舍：纯市场软件、传统实体库存商、正规商业银行，以及商业与金融科技一体化平台。 实体库存商保有区域库存，却让买家承担质量不一致、等级替换和缺失合规文件的风险；纯 B2B
              商品目录市场能提供数字化价格发现和线索，却无法控制实物履约、物流执行和售后争议；银行和非银放贷人给大企业更低的名义利率，但严格的不动产抵押要求和漫长评估周期把工业 SME 排除在外。 OfBusiness 在
              50 多个商品品类上直接履约，整合强制质量检测证书，在自有制造设施加工约 40% 的产品，并选择性地为年营业额超过 $3 million 的成熟制造客户评估授信。
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP007
              - CP010
