      - number: '3.3'
        title: 渠道动态、切换成本与嵌入式金融护城河
        blocks:
          - type: paragraph
            body: >-
              工业采购的客户锁定和切换壁垒，根本上由信贷可得性和工作流整合决定，而非前端软件界面。 买家理论上可以为现货采购同时使用多个商品供应商，但一旦建立活跃授信额度，对采购融资的运营依赖就会限制渠道迁移。
              OfBusiness 把最高 $20 million、无需抵押的预批采购融资直接嵌入下单流程，利率为 15%–18%，由此形成未打包的数字聚合商难以拆解的商业锁定。 BidAssist 政府招标发现平台和
              Nexizo.AI 情报套件又帮助 SME 赢得政府合同、跟踪上游价格周期。 Oxyzo 通过收购零售固收平台 GoldenPi 等方式扩大资本来源，进一步分散集团流动性并加深机构信贷护城河。
            claimRefs:
              - CP001
