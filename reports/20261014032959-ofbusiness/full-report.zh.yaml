      - CV004
      - CV005
      - CV007
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 概率
      - 收入与 PBT 假设
      - 估值 / 回报逻辑
      - 下行与执行触发因素
    rows:
      - - 乐观情景
        - 25%
        - FY27 收入 ₹23,520 Cr、PBT ₹606 Cr；服装业务占比扩大至 20% 以上
        - 市值 $6.0B–$7.0B（25–30 倍 P/E）；DRHP 成功申报并在国内市场强势上市
        - IPO 审批延迟、监管收紧金融科技信贷承保，或利润率压缩
      - - 基准情景
        - 55%
        - FY26 收入 ₹20,000 Cr、PBT ₹406 Cr；经营现金流达到 ₹1,220 Cr
        - 市值 $4.4B–$5.0B（18–22 倍 P/E）；上市估值以现有私募轮估值为锚
        - 70% 的 OFS 占比带来老股出售压力；营运资金融资成本维持高位
      - - 悲观情景
        - 20%
        - 收入增速放缓至 15% 以下；财务费用超过 ₹600 Cr；ROA 压缩至 3.0% 以下
        - 市值 $3.0B–$3.5B（12–15 倍 P/E）；估值下调或公开发行推迟
        - SME 信贷质量急剧恶化、Oxyzo 的 NPA 攀升，或服装出口放缓
    notes: 情景参数基于 IPO 前承销商估算、非上市市场基准及历史利润率实现情况。
