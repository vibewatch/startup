  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 角度
      - 投资逻辑
      - 反向逻辑风险
      - 转向触发因素 / 改变判断的事项
    rows:
      - - 规模与盈利能力
        - 多垂直采购与服装制造触及约 ₹20,000 Cr 收入并实现盈利运营
        - 合并资产回报率仅 3.33%，反映出低毛利大宗贸易与资本密集特征
        - 提高自有制造占比，使 EBITDA 利润率突破 8%
      - - 金融科技协同
        - Oxyzo 嵌入式金融为 SME 买家提供高毛利信贷承保并增强客户锁定
        - 财务费用飙升（FY24 增长 +85.6%）且暴露于信贷周期，令资产负债表更脆弱
        - 经审计的队列 NPA 数据证明其能抵御高利率环境
      - - IPO 前流动性
        - 基石 IPO 前轮融资（$11.7M）及一线承销商团支持公司在国内上市
        - 拟议 IPO 结构中 70% 为老股出售，显示早期投资者大规模退出
        - 正式申报 DRHP，且新股募集资本占比超过 50%
      - - 市场差异化
        - 商业、招标发现（BidAssist）与定价（Nexizo）一体化，构筑较高进入壁垒
        - 贸易业务受营运资金拖累，库存天数为 28 天、应收账款天数为 31 天
        - 证明现金转换周期可降至 40 天以下，同时不造成信贷压力
    notes: 对比规模化盈利与垂直整合，以及高杠杆和流动性 集中度。
