  - id: TR003
    title: 合作伙伴与依赖风险登记表
    columns:
      - 依赖类别
      - 交易对手 / 集团
      - 战略角色
      - 集中度
      - 失效情景
      - 严重程度
      - 缓释措施
      - 剩余暴露
    rows:
      - - 上游工业供应商
        - 主要钢厂、聚合物石化生产商、水泥厂
        - 大宗原材料供应及批量返利分配
        - 核心大宗商品生产商之间中等
        - 材料短缺期间供应商绕过平台直接向 SME 销售或实行配额分配
        - 高
        - 覆盖 50+ 原材料类别的多供应商聚合及深度采购规模
        - 易受一级生产商价格联盟或削减供应影响
      - - 批发银行贷款方
        - 商业银行与债务共同基金
        - 为 Oxyzo NBFC 贷款组合提供批发授信额度与债务融资
        - 对银行业流动性的依赖中等至高
        - 银行对 NBFC 放贷转向避险，导致借款成本飙升
        - 高
        - 与 50+ 家金融机构建立多元借款关系，并拥有股权缓冲
        - 若借款成本涨幅超过 SME 贷款收益率，净息差将收窄
      - - 核心服装买家
        - 全球零售品牌（Uniqlo、Adidas、Skechers、Michael Kors）
        - 出口规模与高毛利制造产能消化
        - 在刚扩大的服装业务中较高（收入 ₹3,002 Cr）
        - 订单取消或转移至低成本制造中心（越南、柬埔寨）
        - 中
        - 在印度南部及孟加拉国多个中心设有运营布局
        - 服装业务前 7-10 个零售账户的收入集中度
      - - 政府招标门户
        - 中央及邦级公共采购机构
        - 为 BidAssist 平台提供动力的招标发现引擎
        - 平台对采购机会数据依赖度高
        - 招标门户 API 限制或公共招标框架变化
        - 低
        - 自研 AI 聚合、多源抓取及增值企业工作流 SaaS
        - BidAssist 的 SME 用户漏斗及获客效率受扰
    notes: 分析供应商、融资方、买家及公共平台的第三方依赖；基于已披露的 商业合作及行业运营机制。
