  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与核心反向逻辑
        blocks:
          - type: paragraph
            body: >-
              OfBusiness 的核心投资逻辑，是在保持运营盈利的同时，把多品类工业 B2B 商贸做大。不同于交易利润率承压的轻资产采购平台，OfBusiness 通过 Oxyzo
              将金属、化学品、农业和服装原材料汇聚、内部制造与嵌入式营运资本融资结合起来。这种垂直整合让 FY26 年收入达到约 ₹20,000 crore，并由盈利性现金创造支撑。
              但反向逻辑指出了关键结构性脆弱点。非上市公司披露显示，FY24 合并资产回报率仅为 3.33%，反映出大宗工业贸易的低利润率现实。更值得警惕的是，FY24 年度财务成本激增 85.6% 至 ₹468.17
              crore，说明快速增长仍高度依赖债务驱动的营运资本。在 OfBusiness 证明无需不断增加融资费用也能获得可持续运营杠杆之前，其商业模式对印度利率与信用周期仍高度敏感。
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV007
      - number: '8.2'
        title: 融资历史与非上市估值倍数
        blocks:
          - type: paragraph
            body: >-
              OfBusiness 的资本化历史显示机构支持力度强劲，随后老股流动性事件不断增加。公司于 2021 年 7 月达到独角兽地位，随后在 2021 年 12 月由 Alpha Wave Global、Tiger
              Global 和 SoftBank Vision Fund 2 领投的 Series G 轮中取得 $5 billion 估值。公司历次融资累计募集的股权与债务资本超过 $867 million。
              但近期交易显示投资者定位正在变化。2024 年 10 月，早期成长投资者 Zodius Capital 完成全额老股退出，净得 $100 million 至 $120 million；随后 Cornerstone
              Ventures 于 2025 年 4 月领投 ₹100 crore（$11.7 million）的 IPO 前投资。在印度非上市股权市场，股票指示性价格为 ₹475，按 FY24 盈利计算对应约 5.8x
              的非上市滚动市盈率。尽管这一倍数相较 Indiamart（27.4x P/E）等纯科技上市同业大幅折价，但也反映其更高的资产负债表杠杆（债务权益比 0.73）和营运资本拖累，支持保持估值纪律。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV008
              - CV011
      - number: '8.3'
        title: 估值情景与回报分布
        blocks:
          - type: paragraph
            body: >-
              评估 OfBusiness 的远期回报，需要拆解收入兑现、利润率扩张和退出倍数等情景驱动因素。基准情景（概率 55%）假设 OfBusiness FY26 年收入 ₹20,000 crore、税前利润 ₹406
              crore、经营现金流 ₹1,220 crore，并以 18–22x P/E 支撑 $4.4 billion 至 $5.0 billion 的上市市值。乐观情景（概率
              25%）假设高利润率服装制造加速扩张——该业务 FY26 已增长至 ₹3,002 crore，是原来的三倍——推动 FY27 收入达到 ₹23,520 crore、PBT 达到 ₹606 crore，对应
              $6.0 billion 至 $7.0 billion 估值（25–30x P/E）。相反，悲观情景（概率 20%）假设 Oxyzo 不良资产上升、财务成本继续增长且估值倍数压缩，将估值限制在 $3.0
              billion 至 $3.5 billion。由于分布紧密围绕私募轮估值锚点，风险调整后回报不足以支持激进地在 IPO 前积累仓位。
            claimRefs:
              - CV001
              - CV006
              - CV009
              - CV010
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV013
      - number: '8.4'
        title: 建议、退出准备度与尽调标准
        blocks:
          - type: paragraph
            body: >-
              我们给予 OfBusiness “观察”建议，置信度为中，风险评级为高，估值立场为合理。公司覆盖 30,000
              名员工和四条主要业务线，运营规模颇为可观，但治理与交易层面的关键因素限制了退出准备度。官方市场来源确认，OfBusiness 尚未向 SEBI
              提交红鲱鱼招股书草案（DRHP），因此公开市场还看不到经审计的母公司财务报表，也看不到 B2B 商贸与 NBFC 放贷之间透明的分部拆分。此外，券商报告显示，计划中的 $600 million 至 $800
              million IPO 将由 70% 老股发售（OFS）和仅 30% 新股发行组成。老股占比过高，说明早期机构投资者优先考虑流动性，而不是公司资本金扩充。若要升级为“买入”建议，公司需要正式提交
              DRHP、确认财务成本放缓，并证明服装制造能可靠地将合并 EBITDA 利润率推高至 8% 以上。
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV012
              - CV014
