          - type: callout
            title: 商品价格波动与营运资金集中风险
            body: 工业 SME 采购仍容易受到炼焦煤、原油和废钢等大宗商品宏观波动影响。 通胀周期中，投入成本上升会压缩买家运营利润、拉长营运资金周期，把流动性压力转移到平台信贷额度，并提高对未评级借款人资产质量的监控要求。
