      - number: '7.2'
        title: 监管、法律与上市治理
        blocks:
          - type: paragraph
            body: >-
              集团受到严格的印度金融与公司监管约束。Oxyzo Financial Services
              是印度储备银行（RBI）注册的非银行金融公司（NBFC），必须遵守资本充足率规范、优先部门放贷指引、资产分类规则及不良资产（NPA）拨备标准

              [CR003、CR004、CR007、CR009]。由于 OfBusiness 直接向制造业和基础设施中小企业提供最高 $20 million 的采购融资额度，利率为 15% 至 18%；RBI 若收紧无担保
              NBFC 敞口、NBFC 银行授信额度或数字放贷承保框架，都会直接影响集团净利息

              率和融资速度 [CR003、CR004]。此外，公司治理 风险集中在由印度证券交易委员会（SEBI）监管的拟议国内上市上。 IPO 结构包含复杂的公司架构，涵盖市场平台运营、制造工厂、BidAssist 和
              Nexizo.AI 等软件产品，以及 NBFC 子公司

              [CR001、CR002、CR008、CR011]。将多层法律实体、IPO 前老股交易及期权池整合进符合 SEBI ICDR
              规定的统一红鲱鱼招股书草案（DRHP），是一个重大的行政与法律里程碑，但截至目前仍未公开完成

              [CR005、CR008]。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
              - CR009
              - CR011
