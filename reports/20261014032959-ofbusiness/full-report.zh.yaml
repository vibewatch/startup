      - number: '7.3'
        title: 运营、依赖与资产负债表脆弱性
        blocks:
          - type: paragraph
            body: >-
              OfBusiness 的运营脆弱性，源于实体工业履约与分散中小企业集群中交易对手履约能力的相互作用。 在核心工业商贸业务中， OfBusiness 汇聚大宗钢材、水泥、聚合物和化学品需求，并在收购 Indian
              Design 后大举扩张服装制造业务 [CR003、CR010、CR012]。服装业务 FY26 收入跃升至 ₹3,002 crore，随着公司在南印度和孟加拉国扩建工厂， 服装业务收入在 FY26 跃升至
              ₹3,002 crore，随着公司扩建工厂，集团员工数翻倍至超过 30,000 名 [CR002、CR010]。但整合自有生产资产，会让 OfBusiness 承受劳工合规、工厂安全以及对
              Uniqlo、Adidas 和 Skechers 等全球大型服装零售商的客户集中风险

              [CR010]。在商品交易端， 煤炭、铁矿石和原油的上游价格波动，若涨价无法立即传导给中小企业买家，就会压缩商品交易毛利 [CR004、CR006、CR009]。交易对手风险同样具有结构性：OfBusiness
              高度依赖 BidAssist 的公开招标活动及基础设施项目执行，中小企业客户容易遭遇公共部门付款延迟，进而拉长营运资本周期、提高信用违约概率


              [CR001、CR003、CR004]。
            claimRefs:
