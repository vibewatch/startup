      - number: '6.3'
        title: 企业客户验证与服装垂直扩张
        blocks:
          - type: paragraph
            body: >-
              核心金属和化工 SME 买家在公开披露中大多没有姓名，但 OfBusiness 已在快速增长的服装业务中建立了有记录的知名企业客户关系。 收购班加罗尔服装制造商 Indian Design
              后，公司把服装业务扩展到印度南部、Delhi NCR 和孟加拉国，为全球十大服装零售品牌中的七家供货。 已验证客户包括 Uniqlo、Adidas、Skechers、Michael Kors 及精品时装品牌
              Doen。 该业务把自有和外包制造能力、面料采购、包装及出口物流结合起来，覆盖 70 多个国家。 服装收入从 FY24 的 ₹843 crore 增至 FY26 的 ₹3,002 crore，占 ₹19,174
              crore 商业业务的 15.7%。 这些企业合同证明公司能满足全球供应商合规、质量标准和大批量交付时限，企业采用不再局限于印度国内 SME 采购。
            claimRefs:
              - CU004
              - CU005
