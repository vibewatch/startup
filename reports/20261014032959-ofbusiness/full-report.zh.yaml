  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 执行层风险排序与剩余敞口
        blocks:
          - type: paragraph
            body: >-
              机构评估 OfBusiness，必须拆开两个紧密耦合的经济引擎：一个是 轻资产原材料交易与履约市场，另一个是 主要由 Oxyzo Financial Services
              运营的嵌入式信贷融资部门。核心投资逻辑风险在于，营收在 钢材、化学品、聚合物及刚扩张的服装制造等波动性商品行业中快速增长， 会带来严重的营运资本拖累、信用风险放大以及上市阻力。 OfBusiness
              在公开声明及二级市场报道中，将首次公开募股 （IPO）目标定在印度国内交易所，计划融资 $600 million 至 $800 million，估值为 $4.4 billion 至 $5.0 billion；此前
              2021 年 12 月的私募融资定价将其投后估值定为 $5.0 billion [CR002、CR005、CR008]。但原定于 2022 年及 2025 年末的历史 IPO 时间表
              多次延期，说明公开文件准备、子公司重组及券商审核可能存在阻力 [CR007、CR008]。剩余风险画像是：较高的运营与信用敞口虽有集团层面已验证的盈利能力 和保守的回款机制缓解，但仍受制于私有披露的不透明性

              [CR001、CR004]。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR007
              - CR008
