      - number: '6.4'
        title: 采用轨迹、留存韧性与集中度风险
        blocks:
          - type: paragraph
            body: >-
              OfBusiness 的客户增长轨迹显示漏斗前端大幅扩张，从 700 家中小企业客户（2016 年）增至 2022 年 7 月的逾 4,500 家交易中小企业，并在 2025 年突破 100,000 名活跃客户
              覆盖 24 个邦。在早期运营阶段，OfBusiness 报告的复购率 超过 60%，说明采购与信贷结合时产品市场匹配度较强。但严格的尽调分析发现， 注册用户 headline 数量与持久复购之间存在显著分析缺口。
              尽管平台注册中小企业超过 700,000 家，但已确认的活跃信贷 客户约为 3,000+ 家，说明嵌入式信贷只投向 营业额充足的较高层级企业。关键在于，OfBusiness 没有披露净收入
              留存率（NRR）、总收入留存率（GRR）、年度客户队列流失曲线，也没有披露收入 在前 10 和前 20 大客户中的集中度。缺少经审计的队列留存数据，无法判断 营收增长究竟来自成熟客户的钱包份额扩大，还是
              持续获取新客户掩盖了底层流失。
