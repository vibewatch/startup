            - 数字化下单
            - 自动竞价引擎匹配
            - BIS 与轧钢厂测试证书核验
          description: 平台将分散的 SME 采购订单直接聚合至一级钢厂与 Tier-1 供应商。
        - label: 信贷审批与承保
          touchpoints:
            - Oxyzo NBFC 数字化申请
            - 替代数据与社群评估
            - 最高 2 crore 的无抵押信贷额度
          description: 自研信用评分评估现金流与交易历史，而非经审计的资产负债表。
        - label: 订单履约与物流
          touchpoints:
            - 覆盖 Tier I 与 Tier II 集群的全印度配送
            - 实时订单与货运追踪
            - 数字化电子运单与发票
          description: OfBusiness 统筹物流，确保交付时效与质量合规。
        - label: 还款与营运资金周期
          touchpoints:
            - 可灵活延长至 45 至 60 天的还款期限
            - 15% 至 18% 的利率
            - 在应用中核对台账与发票
          description: 买方在项目完工或库存变现后偿还采购融资，从而保留现金。
        - label: 扩张与多垂直领域锁定效应
          touchpoints:
            - 在新增品类中重复采购材料
            - VedAI 采购优化
            - 服装行业企业供货合同
          description: 成功的买方从单一品类采购扩展至跨垂直领域采购，并获得更高的授信额度。
  - id: FR001
    title: 风险严重性矩阵
    type: matrix
    summary: 该风险评估将主要监管、信贷、运营和市场风险领域的发生可能性与财务严重程度进行映射。
    data:
      columns:
        - 中等影响
        - 高影响
        - 严重影响
      rows:
        - label: 严重程度：严重
          values:
            - label: 监管机构对 NBFC 的审查
              score: 5
              detail: RBI 的宏观审慎措施影响无担保贷款和授信额度。
            - label: 银行冻结授信额度
              score: 5
              detail: 系统性流动性收缩限制 NBFC 的批发再融资。
            - label: 严重的 SME 违约潮
              score: 5
              detail: 无担保 SME 采购授信额度出现大范围逾期。
        - label: 严重程度：高
          values:
            - label: 营运资金占用
              score: 4
              detail: 为库存、货运和贸易应收账款提供资金，会拉紧流动现金。
            - label: SME 信贷逾期
              score: 4
              detail: 如果客户现金流因基础设施放缓而受损，无担保贷款可能形成 NPA。
            - label: 工厂整合与劳动力
              score: 4
              detail: 管理服装制造设施中的 30,000+ 名员工。
        - label: 严重程度：中
          values:
            - label: 原材料投入价格波动
              score: 3
              detail: 钢材、煤炭和聚合物价格快速变化，影响采购利润率。
            - label: IPO 时间表延迟
              score: 3
              detail: 资本市场会审视集团结构和分部披露。
            - label: 出口市场摩擦
              score: 3
              detail: 服装出口关税变化和全球零售客户需求转移。
        - label: 严重程度：低
          values:
            - label: 一级供应商去中介化
              score: 2
              detail: 供应商绕过综合电商平台直接销售。
            - label: 数字平台宕机
              score: 2
              detail: 系统故障影响移动应用的价格发现和 BidAssist 运营。
            - label: 轻微库存过时
              score: 2
              detail: 次要产品品类的季节性库存持有错配。
        - label: 监测阈值
          values:
            - label: SME 流失与忠诚度下降
              score: 2
              detail: SME 买方转向其他信贷和采购门户。
            - label: BidAssist 数据源变化
              score: 2
              detail: 政府招标门户变化，改变招标发现聚合方式。
            - label: 物流燃油成本激增
              score: 2
              detail: 跨邦 Tier-2 和 Tier-3 运输线路的货运成本上涨。
        - label: 运营基线
          values:
            - label: 常规信贷拒绝
              score: 1
              detail: 自动开户时例行筛除不符合条件的 SME 申请者。
            - label: 合同重新谈判
              score: 1
              detail: 与主要钢厂按期进行正常的批量返利调整。
            - label: 服装样品迭代
              score: 1
              detail: 面向全球服装品牌买方进行投产前质量调整。
    notes: 分数与单元格位置代表缓释措施实施后的剩余风险对集团企业价值和资本偿付能力的影响。
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR007
      - CR008
      - CR010
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 该分析决策流程将 OfBusiness 的多垂直领域规模和经营利润，与营运资金负担、老股交易悬置及最终的观察建议连接起来。
    data:
      nodes:
        - id: scale
          label: 多垂直领域规模（跨金属、服装、化工、农业，约 ₹20,000 Cr FY26 运行率）
        - id: profitability
          label: 经营盈利能力（₹1,220 Cr FY24 EBITDA 与 ₹406 Cr FY26 预计 PBT）
        - id: leverage
          label: 资本密集度拖累（财务成本激增 85.6%，债务权益比为 0.73）
        - id: ipo-structure
          label: IPO 流动性结构（70% 老股发售，30% 新股融资）
        - id: governance
          label: 信息不对称（上市状态：尚未提交 DRHP；没有经审计的股权结构表）
        - id: stance
          label: 最终建议：以 $4.4B–$5.0B 为锚点观察（严守估值倍数纪律）
      edges:
        - from: scale
          to: profitability
        - from: profitability
          to: leverage
        - from: leverage
          to: ipo-structure
        - from: ipo-structure
          to: governance
        - from: governance
          to: stance
    approximationNotes: 按顺序排列的逻辑依赖，将财务规模与资本结构摩擦综合起来。
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV013
