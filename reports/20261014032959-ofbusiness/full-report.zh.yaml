      - number: '1.5'
        title: 尽调总结、证据缺口与投资判断
        blocks:
          - type: paragraph
            body: >-
              OfBusiness 展现出颇具吸引力的运营画像：营业额达到 ₹20,000 crore、FY26 税后利润 ₹700 crore，并把信贷与商业交易结合起来。 公司把原材料和营运资金融资交叉销售给超过
              700,000 家注册工业 SME，客户黏性较高；向自有制造设施后向整合，也比纯经纪模式更能提升利润率。 不过，机构投资判断必须计入显著的信息缺口和结构性风险。 拟议上市中 70%
              为老股出售，表明现有风投股东希望在进入公开市场前变现；FY25 和 FY26 尚无公开提交、经审计的实体层面财务报表，投资者无法独立核对贸易毛利、营运资金烧钱和信贷损失拨备。 在 Draft Red
              Herring Prospectus 正式向 SEBI 提交前，收入和盈利 headline 都应视为管理层披露、并以保守方式验证。
            claimRefs:
              - CO003
              - CO009
              - CO010
              - CO012
      - number: '1.6'
        title: 展示
        blocks:
          - type: callout
            title: 商业与贷款的协同闭环
            body: >-
              OfBusiness 不像纯商品聚合商或独立数字放贷机构那样各自为战，而是形成自我强化的飞轮：采购交易数据支持 Oxyzo 以 15%–18% APR
              发放营运资金贷款，贷款资金又被直接锁定用于平台上的原材料采购。
            calloutType: strength
            claimRefs:
              - CO002
              - CO011
          - type: callout
            title: 老股退出占比高，公开 DRHP 时间仍不确定
            body: >-
              拟议的 $600M–$800M IPO 以老股流动性为主（Offer for Sale 占 70%，新股占 30%），此前 2022 年和 2025 年的上市计划也曾延期。 在公开 DRHP
              尚未提交的情况下，未经验证的营运资金强度和贷款损失拨备构成重大尽调缺口。
            calloutType: risk
