chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、运营架构与企业规模
        blocks:
          - type: paragraph
            body: >-
              OfBusiness（注册名为 OFB Tech Private Limited）成立于 2015 年，2016 年在哈里亚纳邦 Gurugram 总部开始商业运营。
              公司瞄准印度中小企业在基础设施和制造业供应链中长期存在的摩擦：原材料采购分散、批量价格缺乏竞争力、营运资金持续短缺。
              它没有做成轻资产分类信息网站或脱离交易的数字聚合器，而是把实体商品集采与现金流支持的信贷评估接成一套多平台运营模式。 集团商业架构由三根同步运转的支柱组成：OfBusiness 商业平台汇聚数千家 SME
              制造商、承包商和工业买家的需求，直接向一二级钢厂、化工厂等采购结构钢、TMT 钢筋、化学品、聚合物、纺织品和农业投入品；2017 年成立、在 RBI 注册的非银行金融公司子公司 Oxyzo Financial
              Services，提供结构化采购融资和基于现金流的授信，利率通常为 15%–18%，低于非正规二级市场 24%–48% 的融资成本；BidAssist 则每天跟踪并分类印度各地超过 3,500
              个政府和公共部门招标，帮助客户发现并赢得增量合同。 截至 2026 年，OfBusiness 披露企业员工超过 30,000 人、集团营业额约 ₹20,000 crore、税后利润（PAT）₹700
              crore；平台在印度 26 个邦开展实体业务，连接超过 700,000 家注册 SME，并与 70 多个目的地国家保持商业出口关系。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO011
