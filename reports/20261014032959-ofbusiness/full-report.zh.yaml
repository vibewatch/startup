            title: 注册用户与实际交易用户的脱节及集中度不透明
            body: >-
              OfBusiness 对外强调 700,000+ 家注册中小企业这一亮眼指标，但已确认的信贷 客户仅 3,000+ 家，2022 年历史交易客户总数为 4,500 家。 此外，OfBusiness
              完全没有披露队列流失、NRR 或头部客户集中度数据，投资者 无法在计划 IPO 前验证其中小企业客户基础的持久性。
