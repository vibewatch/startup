  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：核心工业品类、相邻领域与现状替代
        blocks:
          - type: paragraph
            body: >-
              要界定 OfBusiness 的运营边界，必须把印度工业采购经济与泛商业电商市场拆开看。 平台主动绕开零售消费品和维修运营物资，集中服务高周转的大宗工业原材料，包括结构钢、TMT
              钢筋、热轧卷、铝锭、锌、铜杆、石化衍生品、聚合物和农业加工商品。 近年公司又借助并购的制造基础设施进入合同服装和服装出口，以承接全球品牌供应链。 印度工业 SME
              的传统替代方案是层层分销的非组织化区域网络，价格加价不透明、产品质检证书难核实、贸易信贷依靠非正式关系。 OfBusiness
              把需求直接汇聚到大型钢厂和石化炼厂等一线制造商，减少中间商摩擦，并执行标准化钢厂检测合规。
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM014
          - type: table
            tableRef: TM001
