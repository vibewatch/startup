      - number: '2.3'
        title: 买家分层：企业采购角色、信贷流程与预算归属
        blocks:
          - type: paragraph
            body: >-
              OfBusiness 的核心买家集中在中端制造企业、基础设施工程承包商和成长中的企业生产商。 印度工业 SME 的采购决策通常直接由创始人、董事总经理或 CEO 做出，物料排产和技术验收则由工厂运营主管负责。
              采购流程的核心痛点是原材料采购与客户回款之间的营运资金缺口，通常持续 60–90 天。 传统银行因抵押物不足或运营文件非标准化而服务不足，企业只能转向年利率 24%–48% 的非组织化信贷。 OfBusiness
              通过 Oxyzo 嵌入采购融资，以运营交易历史和其他商业数据评估并提供 15%–18% 的授信。 BidAssist 招标情报平台还服务 1.5 million
              家注册企业，先让承包商发现政府招标，再把项目材料采购导回核心商业平台。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM013
      - number: '2.4'
        title: 采用驱动与结构约束：营运资金摩擦、信任与商品周期
        blocks:
          - type: paragraph
            body: >-
              印度科技驱动的 B2B 工业采购受政府基础设施资本开支、GST 追踪正规化以及制造商寻求多元 SME 分销渠道等结构性顺风推动。
              买家越来越多使用数字采购门户，以获得实时商品价格基准、经验证的钢厂检测证书和可靠履约物流。
              但采用速度仍受多重约束：钢筋、炼焦煤和聚合物树脂等原材料价格波动会带来时点和利润风险，未对冲的现货价格波动甚至可能吞噬小型加工厂利润；工业采购金额大、切换摩擦高，企业在交付可靠性和质量合规尚未得到验证前，不愿放弃既有区域供应商关系。
              对平台而言，资本密集度也是结构性约束：同时扩大原材料集采和嵌入式营运资金信贷，需要稳定的债务联合融资、严格的借款人评估和持续抵押品监控，以防周期性商品下行造成信贷损失传染。
            claimRefs:
              - CM001
              - CM005
              - CM010
              - CM011
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 商业与融资生态的结构协同
            body: >-
              OfBusiness 不像纯 B2B 商业聚合商那样只赚极薄的分销差价，而是通过受监管 NBFC Oxyzo，把原材料履约与自有采购融资绑在一起。 15%–18% 的授信直接绕开收取 24%–48%
              的非组织化放贷人，提升 SME 采购黏性并形成混合集团盈利。
            calloutType: insight
            claimRefs:
