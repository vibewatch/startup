      - number: '3.4'
        title: 护城河韧性、商品化压力与战略风险
        blocks:
          - type: paragraph
            body: >-
              尽管规模和盈利能力突出，OfBusiness 仍面临商品贸易商品化、原材料周期波动和私营市场竞争带来的脆弱性。 无差异原材料的纯贸易差价历史上会压缩到
              5%–10%，国内钢材、聚合物或化学品价格快速下跌时，库存贬值会冲击商业资产负债表。 公司认识到纯贸易聚合的长期护城河脆弱，于是加快后向制造整合，在自有工厂平均生产和加工 40% 的交易量，并收购 Indian
              Design 等专业制造资产。 FY2026，公司主动砍掉低回报贸易品类，报告运营收入下降 7%，但服装业务仍增至 ₹3,002 crore。 不过，OfBusiness
              及其未上市、获风投支持的竞争对手都没有公开按客户队列披露留存曲线或按品类披露单位经济性，因此客户关系能否长期维持仍是上市前的核心尽调问题。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP013
              - CP014
