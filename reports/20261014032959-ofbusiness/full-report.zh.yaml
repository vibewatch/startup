        - 规模与运营盈利能力已得到验证，但 DRHP 尚未申报，且大量老股流动性要求严格控制价格 。
        - 维持观察姿态；以 $4.4B–$5.0B 为锚定价格上限
      - - 置信度
        - 中
        - 通过 FY24 非上市公司报告验证历史收入与 EBITDA，但 FY25–FY26 分部数据仍 未获确认
        - 在承诺机构成长资本前等待经审计的 DRHP 披露
      - - 风险评级
        - 高
        - 财务费用增长 85.6% 至 ₹468.17 Cr，债务权益比为 0.73，现金转换周期为 48 天
        - 要求对贷款杠杆及母公司债务担保设置严格契约
      - - 估值立场
        - 合理
        - 相较私募市场可比公司，估值约为非上市公司过去 P/E 的 5.8 倍，$4.4B–$5.0B 的 IPO 前估值较合理
        - 母公司经审计文件披露前，避免支付超过 $5.0B 的增长溢价
    notes: 评估综合非上市股票交易数据、已报告的 FY24 财务数据及 IPO 前承销商的初步 估算。
