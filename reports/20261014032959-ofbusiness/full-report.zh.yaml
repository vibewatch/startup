      - number: '1.2'
        title: 高管团队、联合创始团队与治理动态
        blocks:
          - type: paragraph
            body: >-
              OfBusiness 由兼具顶级管理咨询、风险投资和工程背景的多学科团队共同创立。 集团 CEO Asish Mohapatra 毕业于 IIT Kharagpur 和 Indian School of
              Business（ISB），此前任 McKinsey & Company 项目经理及 Matrix Partners India 副总裁，负责评估早期工业科技和消费投资。 联合创始人 Ruchi Kalra
              毕业于 IIT Delhi 和 ISB，曾任 McKinsey & Company 合伙人，主导 Oxyzo Financial Services 的设计与扩张，担任其 CEO，并于 2026
              年获评年度女性企业家。 其他创始成员覆盖运营、工程和商品交易：联合创始人兼首席战略官 Vasant Sridhar 负责战略扩张和商业运营，尤其推动服装制造业务快速扩大；CTO Bhuvan Gupta
              负责自研软件、移动采购应用和 BidAssist 算法招标匹配平台；联合创始人 Nitin Jain 负责农业商品供应链，并担任 O’AgriFarm CEO。 从尽调和治理角度看，OfBusiness
              的领导权高度集中。 Asish Mohapatra 与 Ruchi Kalra 的婚姻及职业合作，让母公司商业业务与贷款子公司保持深度战略一致，但也加重了关键人物依赖。
              公司在筹备公开上市前，仍需重点核查高管继任机制、独立董事委员会权限，以及关联实体之间的交易审计。
            claimRefs:
              - CO001
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO014
      - number: '1.3'
        title: 融资历史、机构投资者与资产负债表结构
        blocks:
          - type: paragraph
            body: >-
              OfBusiness 已完成七轮机构股权融资，从早期风投支持走到主权基金和全球跨界投资者背书。 Matrix Partners India（现为 Z47）领投 Series A，并连续参与后续轮次。 2018
              年，公司融资 ₹200 crore（约 $29 million），由 Creation Investments 和 Falcon Edge Capital 领投，用于扩大 Oxyzo 贷款规模。
              疫情后供应链重组带动制造需求，公司在 2021 年连续融资，最终完成 SoftBank Vision Fund-II 领投的 $160 million 轮，以及 2021 年 12 月的 $325 million
              Series G，将投后企业估值定为 $5.0 billion。 2022 年 3 月，OfBusiness 将 Oxyzo Financial Services 拆分为独立资本化实体，由 Alpha Wave
              Global 和 Tiger Global 领投 $200 million Series A，独立估值超过 $1 billion。
              集团因此形成两张不同的资产负债表：一边是持有库存、资产较重的商业引擎，另一边是受印度储备银行资本充足率和拨备要求约束的受监管 NBFC。 股东包括 SoftBank Vision Fund-II、Tiger
              Global Management、Matrix Partners India、Norwest Venture Partners、Falcon Edge Capital、Creation Investments
              和 Zodius Capital。 虽然历史私募轮次获得一线机构认可，但近期市场基准显示估值有所收缩：2026 Global Unicorn Ranking 将 OfBusiness 企业估值列为 34b
              RMB（约 $4.8 billion），低于 2025 年的 36.5b RMB。 详细股权结构表、优先股堆叠和表决协议仍属于未披露的私有数据，需等正式监管招股说明书发布。
            claimRefs:
              - CO005
              - CO006
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO015
      - number: '1.4'
        title: 战略里程碑、制造整合与上市展望
        blocks:
          - type: paragraph
            body: >-
              经过十年发展，OfBusiness 从纯原材料贸易中间商转型为垂直整合的制造和工业履约平台。 为提高毛利、降低单位经济性对现货商品周期的敏感度，集团通过程序化并购拿下 19
              家工业制造和加工企业，包括班加罗尔的出口服装制造商 Indian Design 和农产品加工出口商 Koeleman India。 如今，OfBusiness 在自有工厂平均制造、加工和包装核心垂直品类约 40%
              的产品。 服装业务最清楚地呈现这一转向，并在 FY26 成为集团增速最快的垂直领域：营业额从 FY24 的 ₹843 crore 增至 FY26 的 ₹3,002 crore，所占商业营业额从 4.6% 升至
              15.7%。 该部门服务 Uniqlo、Adidas 和 Skechers 等全球头部零售商，并在印度南部和孟加拉国扩建产能。 2025 年，OfBusiness 又推出 Nexizo.AI，为 SME
              提供实时商品价格分析、经验证买家发现和供应链竞争情报。 集团 IPO 时间表多次调整：2022 年曾考虑 $2.0 billion 的国内上市，随后将目标改为 2025 年下半年发行 $1.0
              billion，之后再次延期。 当前承销商报告称，公司准备以 $4.4B–$5.0B 股权估值发行 $600M–$800M，Morgan Stanley、JPMorgan、Citigroup 和 Axis
              Capital 参与其中。 拟议发行中老股出售占 70%，新股发行占 30%，说明 IPO 前投资者存在较强的变现压力。
            claimRefs:
