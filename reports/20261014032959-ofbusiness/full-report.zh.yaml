            title: B2B 商贸与信贷锁定循环
            body: >-
              OfBusiness 的客户留存引擎，把原材料采购与 Oxyzo 营运 资本融资捆在一起。OfBusiness 提供最高 ₹2 crore、利率 15% 至 18% 的授信额度， 明显低于传统放贷者 24% 至
              48% 的收费，把融资变成主要的 获客与留存护城河。
