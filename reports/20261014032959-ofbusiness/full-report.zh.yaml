              - CV013
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 估值立场与入场纪律
            body: >-
              按约 ₹20,000 crore 的营收运行率和正向现金创造计算，OfBusiness 以 $4.4B 至 $5.0B 的非上市估值锚点计价合理。在官方 DRHP
              文件提供经审计的母公司财务数据并确认中小企业放贷经济性可持续之前，投资者应避免为超过这一私募基准的增长溢价买单。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
          - type: callout
            title: 老股流动性与债务负担
            body: 拟议 IPO 结构存在显著的老股供给压力：$600M–$800M 的发行中，70% 分配给老股发售，而不是用于扩充公司资产负债表。再加上年度财务成本激增 85.6%，这种结构会在宏观经济信用收紧时放大下行脆弱性。
            calloutType: risk
            claimRefs:
              - CV003
              - CV005
