      - number: '7.4'
        title: 图表
        blocks:
          - type: callout
            title: 双引擎脆弱性：营运资本与信用风险反馈循环
            body: |-
              OfBusiness 将大宗材料采购与 Oxyzo 采购融资结合，这一核心竞争优势在工业下行周期中会形成不断放大的下行循环。若原材料价格暴跌或基础设施项目拨款停滞，中小企业借款人会同时面临库存贬值与现金流缺口。

              这会迫使 Oxyzo 承受更高违约率，而 OfBusiness 持有账龄偏长的应收款，放大两条运营线的资产负债表压力。
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR006
              - CR007
          - type: callout
            title: IPO 可读性与披露不透明的脱节
            body: >-
              OfBusiness 已从数字 B2B 聚合平台转为横跨实体制造工厂、NBFC 信贷业务和企业 SaaS 的重资产综合集团。虽然多元化带来接近 ₹20,000 crore 的收入规模，却显著增加了 IPO
              前评估的复杂度。


              潜在公众投资者无法在 DRHP 公开备案前，充分看清集团内部交易、各业务线利润率及真实信用损失曲线。
            calloutType: insight
