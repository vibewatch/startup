            body: >-
              The core competitive advantage of OfBusiness—combining bulk material procurement with Oxyzo purchase
              financing—creates a compounding downside loop during industrial downcycles. If raw material prices
              collapse or infrastructure project disbursements stall, SME borrowers face simultaneous inventory
