            body: >-
              Following its $325 million Series G financing round in late 2021 that established a $5 billion private
              valuation benchmark, OfBusiness has financed growth primarily through operational cash flow and
              institutional credit lines. The group generated ₹1,220 crore in operating cash flow in FY26, projected to
              reach ₹1,302 crore in FY27, demonstrating that working capital demands are supported by current trading
              velocity. However, ahead of a planned $600M to $800M public listing targeted for March or April, the issue
