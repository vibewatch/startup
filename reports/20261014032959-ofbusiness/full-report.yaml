      - number: '4.2'
        title: Monetization Mechanics, Financing Spreads, and Pricing
        blocks:
          - type: paragraph
            body: >-
              The monetization engine relies on capturing spreads across transaction facilitation, manufacturing markup,
              and financial intermediation. In raw material trading, OfBusiness secures channel discounts by aggregating
              SME demand directly to primary industrial mills, taking a 5% to 10% trading margin. The platform's true
              profit driver is Oxyzo, which extends purchase financing credit lines up to $20M at annual interest rates
              of 15% to 18% with repayment horizons up to six months. By pricing significantly below unorganized local
              distributors and informal moneylenders charging 24% to 48%, OfBusiness achieves high customer stickiness
              and repeat borrowing while capturing substantial net interest margin spreads over its institutional bank
              borrowing costs.
