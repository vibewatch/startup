  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Procurement Workflow
        blocks:
          - type: paragraph
            body: >-
              OfBusiness addresses the structural inefficiencies of India’s unorganized industrial raw materials supply
              chain through an integrated B2B commerce and credit platform. For micro-, small-, and medium-sized
              enterprises (MSMEs) in manufacturing and infrastructure, traditional procurement involves fragmented local
              intermediaries, wide price opacity, unreliable material quality, and expensive unorganized financing. The
              OfBusiness mobile application and digital buyer portal replace these manual frictions by providing
              real-time commodity price tracking across metals, chemicals, apparel, and food processing inputs. Through
              self-service mobile interfaces, industrial buyers can discover verified supplier rates, submit purchase
              inquiries, generate e-way documentation, and monitor order shipments in real time. Crucially, the
              procurement workflow natively incorporates embedded credit powered by OfBusiness’s captive NBFC arm,
              Oxyzo. Buyers receive pre-sanctioned, collateral-free credit lines with repayment windows of up to six
              months, enabling them to secure bulk raw materials without locking up operating cash flow.
            claimRefs:
              - CE001
              - CE002
              - CE005
          - type: table
            tableRef: TE002
            claimRefs:
