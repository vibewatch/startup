        blocks:
          - type: paragraph
            body: >-
              OfBusiness serves an industrial customer base structured across distinct buyer tiers and product verticals
              in India's core economy. The platform's foundational tier comprises over 700,000 registered small and
              medium enterprises (SMEs), with more than 100,000 businesses actively transacting across manufacturing,
              construction, infrastructure, and capital goods clusters in Tier I and Tier II cities. Core industrial
              buyers typically operate with monthly raw material requirements between ₹50 lakh and ₹2 crore across heavy
              categories including structural steel, TMT bars, bulk chemicals, industrial polymers, and cement. For
              these SME buyers, traditional procurement is highly fragmented and plagued by punitive local credit terms
              where informal moneylenders and distributors charge 24% to 48% annualized interest. By acting as a bulk
              aggregator sourcing directly from primary manufacturers, OfBusiness delivers volume pricing benefits
              alongside purchase financing from its NBFC arm, Oxyzo. In addition to small industrial workshops, the
              customer base encompasses mid-market emerging corporates with annual revenues between ₹50 crore and ₹500
