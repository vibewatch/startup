      - number: '5.3'
        title: Operating Architecture, Bidding Engine, and Fulfillment Infrastructure
        blocks:
          - type: paragraph
            body: >-
              The technology and operating architecture of OfBusiness is organized into four interconnected tiers
              spanning customer touchpoints, transaction clearing, credit risk assessment, and physical distribution.
              The customer layer encompasses native Android mobile applications, web portals, and the Ask VedAI
              interactive query bot. Behind this interface operates the proprietary bidding engine, which pools
              fragmented SME inquiries across industrial clusters and matches them against primary mill production
              schedules to negotiate bulk price concessions. The third tier is the underwriting engine of Oxyzo, which
              assesses SME borrower risk using unconventional operational signals—including historical order frequency,
              cluster payment behaviors, and supplier ledger activity—supplementing traditional financial statements
              that are frequently inadequate. The final tier comprises physical logistics and manufacturing operations.
              Unlike asset-light software marketplaces, OfBusiness operates an extensive hub-and-spoke logistics network
              across Tier 1, 2, and 3 industrial hubs, and directly manufactures, processes, or packages an estimated
              40% of its traded volume in owned production facilities, including specialized apparel operations under
              its Indian Design subsidiary.
