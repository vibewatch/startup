  - id: FU001
    title: 'Customer Journey Map: From Discovery to Financing and Expansion'
    type: journey-map
    summary: >-
      Structured progression of SME and enterprise customers from price discovery through procurement, embedded Oxyzo
      financing, and multi-vertical expansion.
    approximationNotes: >-
      Stages and touchpoints synthesized from OfBusiness operational workflow descriptions, app features, and fintech
      teardowns.
    claimRefs:
      - CU001
      - CU002
      - CU008
      - CU009
      - CU012
      - CU013
    data:
      items:
        - label: Discovery & Intelligence
          touchpoints:
            - Live price tracking on OFB mobile app
            - Tender discovery on BidAssist
            - Market intelligence on Nexizo.AI
          description: SMEs discover transparent benchmark pricing across 100+ raw material categories and public tenders.
        - label: Inquiry & Vendor Matching
          touchpoints:
            - Digital purchase order placement
            - Automated bidding engine matching
            - BIS and Mill Test Certificate verification
          description: Platform aggregates fragmented SME purchase orders directly to primary mills and tier-1 suppliers.
        - label: Credit Sanction & Underwriting
          touchpoints:
            - Oxyzo NBFC digital application
            - Alternative data and community assessment
            - Collateral-free credit limits up to 2 crore
          description: Proprietary credit scoring evaluates cash flows and transaction history rather than audited balance sheets.
        - label: Order Fulfillment & Logistics
          touchpoints:
            - Pan-India delivery across Tier I and II clusters
            - Real-time order and shipment tracking
            - Digital e-way bills and invoices
          description: OfBusiness coordinates logistics, guaranteeing delivery schedules and quality compliance.
        - label: Repayment & Working Capital Cycle
          touchpoints:
            - Flexible repayment terms extending 45 to 60 days
            - Interest rates between 15% and 18%
            - Ledger and invoice reconciliation in app
          description: Buyers repay purchase financing upon project completion or inventory liquidation, preserving cash.
        - label: Expansion & Multi-Vertical Lock-In
          touchpoints:
            - Repeat material orders across new categories
            - VedAI procurement optimization
            - Enterprise supply contracts in apparel
          description: >-
            Successful buyers expand from single-category procurement into cross-vertical sourcing and higher credit
            limits.
  - id: FR001
    title: Risk Severity Matrix
    type: matrix
    summary: >-
      Risk assessment mapping likelihood against financial severity across principal regulatory, credit, operational,
      and market risk domains.
    data:
      columns:
        - Moderate Impact
        - High Impact
        - Critical Impact
      rows:
        - label: Critical Severity
          values:
            - label: Regulatory NBFC Scrutiny
              score: 5
              detail: RBI macroprudential measures impacting unsecured lending and credit lines.
            - label: Bank Credit Line Freezing
              score: 5
              detail: Systemic liquidity contraction restricting NBFC wholesale refinancing.
            - label: Severe SME Default Wave
              score: 5
              detail: Widespread delinquency across unsecured SME purchase credit lines.
        - label: High Severity
          values:
            - label: Working Capital Tie-Up
              score: 4
              detail: Funding inventory, freight, and trade receivables stretches liquid cash.
            - label: SME Credit Delinquency
              score: 4
              detail: NPA formation in unsecured loans if client cash flows suffer infrastructure slowdowns.
            - label: Factory Integration & Labor
              score: 4
              detail: Managing 30,000+ employees across manufacturing facilities in apparel.
        - label: Moderate Severity
          values:
            - label: Raw Material Input Volatility
              score: 3
              detail: Rapid shifts in steel, coal, and polymer prices impact procurement margins.
            - label: IPO Timeline Delay
              score: 3
              detail: Public market scrutiny regarding conglomerate structure and segment disclosures.
            - label: Export Market Friction
              score: 3
              detail: Apparel export tariff changes and global retail client demand shifts.
        - label: Low Severity
          values:
            - label: Primary Supplier Disintermediation
              score: 2
              detail: Direct supplier selling bypassing aggregate commerce platform.
            - label: Digital Platform Outage
              score: 2
              detail: System failure impacting mobile app price discovery and BidAssist operations.
            - label: Minor Inventory Obsolescence
              score: 2
              detail: Seasonal inventory holding mismatches across secondary product categories.
        - label: Monitoring Threshold
          values:
            - label: SME Churn & Loyalty Erosion
              score: 2
              detail: SME buyers switching to alternative credit and procurement portals.
            - label: BidAssist Data Source Shift
              score: 2
              detail: Government tender portal changes altering tender discovery aggregation.
            - label: Logistics Fuel Cost Surge
              score: 2
              detail: Freight cost inflation across inter-state Tier-2 and Tier-3 shipping lanes.
        - label: Operational Baseline
          values:
            - label: Standard Credit Rejections
              score: 1
              detail: Routine filtering of ineligible SME applicants during automated onboarding.
            - label: Contract Re-Negotiation
              score: 1
              detail: Normal periodic volume rebate adjustments with primary steel mills.
            - label: Apparel Sample Iterations
              score: 1
              detail: Pre-production quality adjustments for global apparel brand buyers.
    notes: >-
      Scores and cell placements represent post-mitigation residual risk impact on group enterprise value and capital
      solvency.
