      - number: '7.3'
        title: Operational, Dependency, and Balance Sheet Fragility
        blocks:
          - type: paragraph
            body: >-
              Operational fragility at OfBusiness stems from the interplay between physical industrial fulfillment and
              counterparty performance across fragmented SME clusters. In its core industrial commerce verticals,
              OfBusiness aggregates demand for bulk steel, cement, polymers, and chemicals, while aggressively expanding
              into apparel manufacturing following its acquisition of Indian Design [CR003, CR010, CR012]. In apparel,
              revenue surged to ₹3,002 crore in FY26, with group headcount doubling to over 30,000 employees as it
              expanded factory footprints across South India and Bangladesh [CR002, CR010]. However, integrating owned
              production assets exposes OfBusiness to labor compliance, factory safety, and customer concentration
              across major global apparel retailers like Uniqlo, Adidas, and Skechers [CR010]. On the commodity trading
              side, upstream price volatility in coal, iron ore, and crude oil can compress gross trading margins if
              price increases cannot be passed immediately to SME buyers [CR004, CR006, CR009]. Counterparty risk is
              also structural: OfBusiness relies heavily on public tender activity through BidAssist and infrastructure
              project execution, leaving SME clients vulnerable to public sector payment delays, which in turn stretches
              working capital cycles and increases credit default probabilities [CR001, CR003, CR004].
