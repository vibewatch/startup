            body: >-
              From an underwriting standpoint, OfBusiness presents a resilient financial model where high-margin lending
              and captive manufacturing subsidize low-margin commodity distribution. The platform's reported operating
              cash flow and consecutive years of pre-tax profitability provide commercial validation rare among
              late-stage Indian B2B unicorns. Nonetheless, diligence underwriting is currently constrained by the
              absence of publicly accessible consolidated FY25 and FY26 audited statutory statements, segment-level
              EBITDA disclosures, and Oxyzo loan book vintage loss curves. Institutional investors must treat unverified
