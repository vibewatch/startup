        title: Cost Structure, Manufacturing Build-Out, and Margin Trajectory
        blocks:
          - type: paragraph
            body: >-
              To counter the low gross margin ceiling inherent in pure commodity brokering, OfBusiness has
              systematically internalized manufacturing, processing, and packaging capacity across its core verticals.
              The platform now produces an average of 40% of its traded goods within company-owned or controlled
              facilities, anchored by strategic acquisitions such as Bengaluru-based Indian Design. This captive
              infrastructure protects unit economics against raw material price shocks and improves blending margins. In
              FY26, the company recorded ₹406 crore in pre-tax profit (PBT), with merchant bankers projecting ₹606 crore
              for FY27 as captive capacity expands, though customer acquisition cost (CAC) and net revenue retention
