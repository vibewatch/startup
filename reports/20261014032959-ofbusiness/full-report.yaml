      - number: '7.2'
        title: Regulatory, Legal, and Public Listing Governance
        blocks:
          - type: paragraph
            body: >-
              The group operates within strict Indian financial and corporate regulatory perimeters. Oxyzo Financial
              Services operates as a Reserve Bank of India (RBI) registered Non-Banking Financial Company (NBFC), which
              mandates compliance with capital adequacy norms, priority sector lending guidelines, asset classification
              rules, and non-performing asset (NPA) provisioning standards [CR003, CR004, CR007, CR009]. Because
              OfBusiness channels purchase financing limits of up to $20 million directly to manufacturing and
              infrastructure SMEs at interest rates between 15% and 18%, any regulatory tightening by the RBI on
              unsecured NBFC exposure, bank credit lines to NBFCs, or digital lending underwriting frameworks directly
              impacts group net interest margins and funding velocity [CR003, CR004]. Furthermore, corporate governance
              risks center around the proposed domestic listing regulated by the Securities and Exchange Board of India
              (SEBI). The IPO structure involves a complex corporate architecture encompassing marketplace operations,
              manufacturing facilities, software offerings such as BidAssist and Nexizo.AI, and NBFC subsidiaries
              [CR001, CR002, CR008, CR011]. Reconciling these multi-tiered legal entities, pre-IPO secondaries, and
              option pools into a unified Draft Red Herring Prospectus (DRHP) under SEBI ICDR regulations represents a
              substantial administrative and legal milestone that has yet to be publicly finalized [CR005, CR008].
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR007
