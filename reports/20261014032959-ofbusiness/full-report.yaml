        title: Exhibits
        blocks:
          - type: callout
            title: Dual-Engine Symbiosis of Commerce and Captive Lending
            body: >-
              The core technical differentiator of OfBusiness is not isolated SaaS software or a basic e-commerce
              storefront, but the programmatic pairing of physical demand aggregation with embedded credit. By capturing
              SME transactions through the bidding engine, the platform acquires granular operational data that enables
              Oxyzo to underwrite working capital loans with lower default risk and lower interest rates than
