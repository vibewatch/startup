chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Architecture, and Enterprise Scale
        blocks:
          - type: paragraph
            body: >-
              OfBusiness (incorporated as OFB Tech Private Limited) was founded in 2015 and commenced commercial
              operations in 2016 from its headquarters in Gurugram, Haryana. The company was established to address
              endemic supply-chain frictions faced by Indian small and medium-sized enterprises (SMEs) across core
              infrastructure and manufacturing sectors, specifically fragmented raw-material procurement, uncompetitive
              volume pricing, and chronic working-capital deficits. Rather than operating as an asset-light classifieds
              portal or a detached digital aggregator, OfBusiness built a unified multi-platform operating model linking
              physical commodity aggregation with cash-flow-backed financial underwriting.


              The group's commercial architecture operates across three synchronized pillars. First, the core OfBusiness
              commerce platform aggregates demand from thousands of SME fabricators, contractors, and industrial buyers
              to procure bulk commodities—primarily structural steel, TMT bars, chemicals, polymers, textiles, and
              agricultural inputs—directly from primary and secondary mills, passing volume discounts to end buyers.
              Second, Oxyzo Financial Services, established as an RBI-registered Non-Banking Financial Company (NBFC)
              subsidiary in 2017, provides structured purchase financing and cash-flow-based credit lines at interest
              rates typically ranging between 15% and 18%, substantially undercutting informal secondary market lending
              costs of 24% to 48%. Third, BidAssist functions as a proprietary intelligence engine, tracking and
              categorizing over 3,500 daily government and public-sector tenders across India to help client enterprises
              discover and win incremental contracts.


              As of 2026, OfBusiness reported substantial operational scale, disclosing an enterprise headcount of more
              than 30,000 employees, group turnover of approximately ₹20,000 crore, and profit after tax (PAT) of ₹700
              crore. The platform spans active physical operations across 26 Indian states, connecting more than 700,000
              registered SMEs, while maintaining commercial export relationships in over 70 destination countries.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO011
              - CO012
      - number: '1.2'
        title: Executive Leadership, Co-Founding Team, and Governance Dynamics
        blocks:
          - type: paragraph
            body: >-
              OfBusiness was co-founded by a multidisciplinary team combining top-tier management consulting, venture
              capital, and engineering backgrounds. Group Chief Executive Officer Asish Mohapatra holds degrees from IIT
              Kharagpur and the Indian School of Business (ISB), having previously served as an engagement manager at
              McKinsey & Company and Vice President at Matrix Partners India, where he evaluated early-stage industrial
              technologies and consumer investments. Co-founder Ruchi Kalra, an IIT Delhi and ISB alumna and former
              Partner at McKinsey & Company, led the design and scaling of Oxyzo Financial Services, serving as its
              chief executive and earning recognition as Women Entrepreneur of the Year in 2026.


              The broader founding group provides specialized functional coverage across operations, engineering, and
              commodity trading. Co-founder and Chief Strategy Officer Vasant Sridhar, an IIT Madras graduate, directs
              strategic expansion and commercial operations, particularly spearheading the rapid scaling of the apparel
              manufacturing vertical. Chief Technology Officer Bhuvan Gupta, an engineering graduate from BITS Pilani
              and former Vice President of Engineering at Snapdeal, leads proprietary software development, mobile
              procurement applications, and the BidAssist algorithmic tender-matching platform. Co-founder Nitin Jain,
              an IIT Delhi computer science graduate and former investment banking technologist at Royal Bank of
              Scotland, directs agricultural commodity supply chains as CEO of O'AgriFarm.


              From a diligence and governance perspective, OfBusiness exhibits notable leadership concentration. The
              marital and professional partnership between Asish Mohapatra and Ruchi Kalra establishes deep strategic
              alignment across the parent commerce business and the lending subsidiary, but it also creates elevated
              key-person dependency. Executive succession frameworks, independent board committee authority, and
              transaction auditing across related-party entities represent crucial areas of institutional inquiry ahead
              of public equity listing.
            claimRefs:
              - CO001
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO014
      - number: '1.3'
        title: Financing History, Institutional Syndicate, and Balance Sheet Structure
        blocks:
          - type: paragraph
            body: >-
              OfBusiness has completed seven institutional equity financing rounds, progressing from early venture
              backing to prominent sovereign and global crossover sponsorship. Early institutional validation was
              anchored by Matrix Partners India (now Z47), which led Series A and participated consecutively in
              subsequent rounds. In 2018, the company raised a ₹200 crore (~$29 million) Series C led by Creation
              Investments and Falcon Edge Capital, providing catalytic equity to scale the Oxyzo lending book. As
              manufacturing demand accelerated during post-pandemic supply realignments, OfBusiness completed
              consecutive capital infusions throughout 2021, culminating in a $160 million round led by SoftBank Vision
              Fund-II and a $325 million Series G in December 2021 that established a $5.0 billion post-money enterprise
              valuation.


              The capitalization structure is characterized by an unusual dual-unicorn dynamic. In March 2022,
              OfBusiness unbundled Oxyzo Financial Services into an independently capitalized corporate vehicle,
              securing $200 million in Series A funding led by Alpha Wave Global and Tiger Global at an independent
              valuation exceeding $1 billion. This spin-off created two distinct balance sheets within the broader group
              perimeter: an asset-heavy, inventory-carrying commerce engine and a regulated NBFC subject to Reserve Bank
              of India capital adequacy and provisioning mandates.


              Institutional investors on the cap table include SoftBank Vision Fund-II, Tiger Global Management, Matrix
              Partners India, Norwest Venture Partners, Falcon Edge Capital, Creation Investments, and Zodius Capital.
              While historical private rounds reflect strong tier-one endorsement, recent market benchmarks indicate
              valuation consolidation: the 2026 Global Unicorn Ranking positioned OfBusiness at an enterprise valuation
              of 34 billion RMB (~$4.8 billion), down moderately from 36.5 billion RMB in 2025. Detailed cap table
              breakdowns, preference stacks, and voting agreements remain undisclosed private data pending formal
              regulatory prospectus publication.
            claimRefs:
              - CO005
              - CO006
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO015
      - number: '1.4'
        title: Strategic Milestones, Manufacturing Integration, and Public Offering Outlook
        blocks:
          - type: paragraph
            body: >-
              Over its decade-long evolution, OfBusiness transitioned from a pure-play raw-material trading intermediary
              into a vertically integrated manufacturing and industrial fulfillment platform. To capture higher gross
              margins and insulate unit economics from volatile spot commodity cycles, the group executed an aggressive
              programmatic acquisition strategy, acquiring 19 industrial manufacturing and processing businesses. Key
              acquisitions include Indian Design, an export-oriented garment manufacturer in Bengaluru, and Koeleman
              India, an agro-processing exporter. Consequently, OfBusiness now manufactures, processes, and packages an
              average of 40% of its products across core verticals in company-owned facilities.


              This manufacturing pivot is exemplified by the apparel segment, which emerged as the group's
              fastest-growing vertical in FY26. Apparel turnover tripled from ₹843 crore in FY24 to ₹3,002 crore in
              FY26, expanding from 4.6% to 15.7% of total commerce turnover. The division serves top-tier global
              retailers including Uniqlo, Adidas, and Skechers, while expanding manufacturing operations across southern
              India and Bangladesh. Complementing its industrial assets, OfBusiness launched Nexizo.AI in 2025, an
              artificial intelligence platform providing SMEs with real-time commodity pricing analytics, verified buyer
              discovery, and supply-chain competitive intelligence.


              The group's initial public offering trajectory has encountered repeated timing realignments. OfBusiness
              initially evaluated a $2.0 billion domestic listing in 2022, subsequently retargeted a $1.0 billion
              offering for the second half of 2025, and subsequently postponed the transaction. Current merchant banker
              reports indicate the company is preparing a $600M–$800M listing at an equity valuation of $4.4B–$5.0B,
              engaging Morgan Stanley, JPMorgan, Citigroup, and Axis Capital. Diligence reviews reveal that the proposed
              offering structure is heavily weighted toward secondary shareholder liquidity, featuring a 70% Offer for
              Sale (OFS) component against 30% fresh equity issuance, underscoring substantial pre-IPO investor
              realization pressures.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO012
              - CO013
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO013
      - number: '1.5'
        title: Diligence Summary, Evidence Gaps, and Underwriting Considerations
        blocks:
          - type: paragraph
            body: >-
              OfBusiness presents a compelling operational profile combining massive top-line scale (₹20,000 crore
              turnover), sustained bottom-line profitability (₹700 crore PAT in FY26), and a differentiated
              credit-commerce integration model. The company's ability to cross-sell raw materials and working-capital
              finance creates high customer stickiness across more than 700,000 registered industrial SMEs. Furthermore,
              backward integration into owned manufacturing facilities provides margin enhancement compared to pure
              brokerage models.


              However, institutional underwriting must weigh significant analytical gaps and structural risks. Primary
              among these is the heavy 70% Offer for Sale component in the proposed public listing, signaling that
              existing venture sponsors seek liquidity ahead of public market execution. Additionally, the lack of
              publicly filed, audited entity-level financial statements for FY25 and FY26 prevents independent
              reconciliation of gross trading margins, working-capital cash burn, and credit loss provisions. Until the
              Draft Red Herring Prospectus is formally lodged with SEBI, investors must treat headline revenue and
              profitability figures as management-reported metrics requiring conservative verification.
            claimRefs:
              - CO003
              - CO009
              - CO010
              - CO012
      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated Commerce-plus-Lending Symbiosis
            body: >-
              Unlike pure-play commodity aggregators or standalone digital lenders, OfBusiness creates a
              self-reinforcing flywheel: procurement transaction data underwrites working capital loans via Oxyzo at
              15–18% APR, while loan proceeds are directly locked into raw-material purchases on the platform.
            calloutType: strength
            claimRefs:
              - CO002
              - CO011
          - type: callout
            title: Heavy Secondary Exit and Public DRHP Timing Uncertainty
            body: >-
              The proposed $600M–$800M initial public offering is heavily weighted toward secondary liquidity (70% Offer
              for Sale vs 30% fresh equity), following prior IPO postponements from 2022 and 2025. Without public DRHP
              filings, unverified working-capital intensity and loan-loss provisions present material diligence gaps.
            calloutType: risk
            claimRefs:
              - CO009
              - CO010
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market Boundary: Core Industrial Categories, Adjacencies, and Status-Quo Substitution'
        blocks:
          - type: paragraph
            body: >-
              Defining the operational perimeter of OfBusiness requires disaggregating India industrial procurement
              economy from generic commercial e-commerce marketplaces. The platform deliberately bypasses retail
              consumer distribution and maintenance-repair-operations supplies, concentrating capital on high-velocity
              bulk industrial raw materials. Core product categories comprise ferrous metals including structural steel,
              TMT rebar, and hot-rolled coils; non-ferrous inputs such as aluminium ingots, zinc, and copper rods; bulk
              petrochemical derivatives and polymers; and agricultural processing commodities. More recently, the
              company extended its manufacturing perimeter into contract apparel and garment exports, leveraging
              acquired manufacturing infrastructure to capture integrated global brand supply chains. The conventional
              status-quo alternative for Indian industrial small and medium enterprises relies on unorganized
              multi-tiered regional distribution networks characterized by opaque pricing markups, unverified product
              quality certificates, and informal trade credit lines. By aggregating commercial demand directly to
              primary manufacturers like major steel mills and petrochemical refineries, OfBusiness eliminates
              intermediate distributor friction while enforcing standardized mill test compliance.
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM014
      - number: '2.2'
        title: 'Market Sizing Lenses: Global B2B Commerce, India Manufacturing TAM, and Addressable Volume'
        blocks:
          - type: paragraph
            body: >-
              Assessing the commercial opportunity available to OfBusiness demands multiple analytical lenses rather
              than reliance on a single unconstrained total addressable market estimate. At the global macroeconomic
              level, B2B procurement e-commerce represents an estimated $14.9 trillion annual transaction pool as
              enterprise procurement departments transition from manual, paper-based purchasing to software-enabled
              supply networks. Within India, the total addressable market for manufacturing sector industrial
              transactions is estimated by market analysts at approximately $700 billion across core infrastructure,
              engineering, and industrial processing industries. Narrowing this horizon to the serviceable addressable
              market of mid-sized industrial SMEs with annual turnover between ₹50 crore and ₹500 crore yields an
              estimated annual raw-material procurement spend of $150 billion to $200 billion. Within this serviceable
              pool, current digital procurement penetration remains in early stages at roughly $20 billion to $25
              billion, demonstrating substantial expansion runway. For fiscal year 2025, OfBusiness recorded
              consolidated revenue of ₹22,241 crore, representing approximately $2.67 billion in realized operating
              scale. Furthermore, the rapid growth of specialized verticals such as contract apparel, which scaled to
              ₹3,002 crore in FY26, indicates that value-added manufacturing adjacencies can expand the serviceable
              boundary beyond commodity aggregation.
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM009
              - CM012
