  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Executive Risk Ranking and Residual Exposure
        blocks:
          - type: paragraph
            body: >-
              An institutional evaluation of OfBusiness requires unbundling two tightly coupled economic engines: an
              asset-light raw material trading and fulfillment marketplace and an embedded credit financing division
              operated primarily through Oxyzo Financial Services. The central thesis risk is that rapid top-line growth
              across volatile commodity sectors—such as steel, chemicals, polymers, and newly scaled apparel
              manufacturing—creates acute working-capital drag, credit risk amplification, and public listing friction.
              In public statements and secondary market coverage, OfBusiness has targeted an initial public offering
              (IPO) on domestic Indian exchanges seeking to raise $600 million to $800 million at a valuation of $4.4
              billion to $5.0 billion, following historical private funding marks that established a $5.0 billion
              post-money valuation in December 2021 [CR002, CR005, CR008]. However, historical IPO timelines originally
              floated for 2022 and late 2025 have repeatedly faced postponement, indicating potential friction in public
              documentation preparation, subsidiary restructuring, and merchant banker review [CR007, CR008]. The
              residual risk profile is characterized by high operational and credit exposures mitigated by demonstrated
              group-level profitability and conservative collection mechanisms, but constrained by private disclosure
              opacity [CR001, CR004].
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR007
              - CR008
