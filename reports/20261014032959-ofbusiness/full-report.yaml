              - CE009
      - number: '5.2'
        title: Platform Modules, Raw Material Portfolio, and Software Services
        blocks:
          - type: paragraph
            body: >-
              The commercial portfolio of OfBusiness spans both digital commerce infrastructure and value-added
              enterprise software modules. At its foundation is the core raw material aggregation portal, which
              organizes over one hundred commodity categories into four macro verticals: metals (including structural
              steel, TMT bars, and industrial alloys), chemicals (bulk industrial chemicals and polymers), apparel
              (knits, wovens, and garments), and food processing (grains, pulses, and oilseeds). Complementing this
              transaction engine is BidAssist, an AI-powered SaaS platform that aggregates and indexes over 3,500
              government and public tenders daily, serving as a high-conversion customer acquisition funnel for
              contracting SMEs. Leading into fiscal 2025 and 2026, the company introduced Nexizo.AI, an enterprise
              intelligence solution designed to supply industrial mid-market manufacturers with market trend forecasts,
              buyer matching, and competitive intelligence tools. While these software offerings broaden the platform’s
              touchpoints and assist user retention, public metrics regarding paid software subscription ARR and active
              software user conversion remain closely held.
