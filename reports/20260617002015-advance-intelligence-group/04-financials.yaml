  title: Financials
  summary: Atome Financial reported USD236M of operating income for 2024. Atome Financial said 2024 operating income grew 63% year over year. The company framed 2024 as its first full year of profit.
sections:
- id: section-1
  title: Profitability trajectory and growth
  body: Atome Financial reported USD236M of operating income for 2024. Atome Financial said 2024 operating income grew 63% year over year. The company framed 2024 as its first full year of profit. GMV exceeded USD2B in 2024 on the same disclosure set. Atome Financial said annualized net revenue crossed USD500M by Q2 2025. Atome Financial said annualized GMV crossed USD4B by Q2 2025. These public signals matter because AIG is a private company, so each disclosed fact carries outsized weight in diligence. The chapter therefore interprets disclosed facts cautiously, distinguishes company claims from third-party reporting, and carries forward explicit diligence gaps where the public record stays incomplete. In practice, that means the narrative emphasizes corroborated milestones, regulatory context, and the limits of what can be inferred from private-company disclosure alone. The synthesis also weights unit-level disclosure more heavily than unsupported market lore, because lender economics,
    partner concentration, and compliance posture drive the real diligence outcome.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: section-2
  title: Funding stack and balance-sheet support
  body: Atome Financial earlier disclosed USD170M operating income in 2023 and Q1 2024 profitability. The EvolutionX facility introduced up to USD100M of debt financing for profitable regional expansion. HSBC support was tied to new products and Philippine growth rather than to passive treasury management. Standard Chartered’s partnership and related investment signaling shows external balance-sheet confidence in Atome’s model. AIG added fresh parent-level funding in 2023 before scaling debt lines through 2024 and 2025. Fintech News Singapore reported a USD149M capital injection into Atome Financial in 2026. These public signals matter because AIG is a private company, so each disclosed fact carries outsized weight in diligence. The chapter therefore interprets disclosed facts cautiously, distinguishes company claims from third-party reporting, and carries forward explicit diligence gaps where the public record stays incomplete. In practice, that means the narrative emphasizes corroborated
    milestones, regulatory context, and the limits of what can be inferred from private-company disclosure alone. The synthesis also weights unit-level disclosure more heavily than unsupported market lore, because lender economics, partner concentration, and compliance posture drive the real diligence outcome.
  claimRefs:
  - CI007
  - CI008
  - CI009
  - CI010
  - CI011
  - CI012
  tableRefs:
  - TI002
  figureRefs:
  - FI002
- id: section-3
  title: Revenue quality and disclosure limits
  body: The capital structure has shifted from pure equity narrative to a mix of equity plus bank and private-credit facilities. Atome’s disclosed profitability makes AIG financially stronger than many private BNPL peers, but the evidence is still business-unit specific. Public disclosure remains much weaker for ADVANCE.AI and Ginee than for Atome Financial. Debt-backed growth creates refinance and covenant risk even when it lowers near-term dilution. Kredit Pintar and broader Indonesian credit exposure create localized loss-volatility risk for the group. Consumer-finance unit economics are now plausibly positive, but public charge-off and funding-cost detail remains missing. These public signals matter because AIG is a private company, so each disclosed fact carries outsized weight in diligence. The chapter therefore interprets disclosed facts cautiously, distinguishes company claims from third-party reporting, and carries forward explicit diligence gaps where the public record stays incomplete.
    In practice, that means the narrative emphasizes corroborated milestones, regulatory context, and the limits of what can be inferred from private-company disclosure alone. The synthesis also weights unit-level disclosure more heavily than unsupported market lore, because lender economics, partner concentration, and compliance posture drive the real diligence outcome.
  claimRefs:
  - CI013
  - CI014
  - CI015
  - CI016
  - CI017
  - CI018
  tableRefs:
  - TI003
  figureRefs:
  - FI003
- id: section-4
  title: Financial verdict and downside watchpoints
  body: AIG’s private-company status limits outside validation of consolidated EBITDA, cash, and leverage ratios. Complaint and collection scrutiny can still leak into financial performance through higher losses, legal expense, or slower approvals. The 2024 profit milestone does not eliminate the possibility that a weaker macro period could re-expand losses. Bank-line growth is a strength today but could also become a choke point if lenders retrench. The biggest financial diligence gap is the absence of consolidated audited statements with segment margins and charge-offs. Overall, AIG’s disclosed financial picture is materially better than the typical SEA BNPL private company but still short of IPO-grade transparency. These public signals matter because AIG is a private company, so each disclosed fact carries outsized weight in diligence. The chapter therefore interprets disclosed facts cautiously, distinguishes company claims from third-party reporting, and carries forward explicit diligence
    gaps where the public record stays incomplete. In practice, that means the narrative emphasizes corroborated milestones, regulatory context, and the limits of what can be inferred from private-company disclosure alone. The synthesis also weights unit-level disclosure more heavily than unsupported market lore, because lender economics, partner concentration, and compliance posture drive the real diligence outcome.
