  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 企业客户画像与具名部署
        blocks:
          - type: paragraph
            body: >-
              ADVANCE.AI 面向 APAC 金融机构和数字平台，提供 AI 驱动的身份验证、KYC 和信用风险服务。公司发布的客户故事记录了 Bank Jago（印尼，eKYC 准确率
              99%）、Bukalapak（电商开户）、Allo Bank、Monix（泰国）和 Tokopedia 的部署。根据来源年份不同，企业客户数被称为 500+ 至
              1,000+，包括银行、金融科技公司、电信公司和电商平台。B2B 分部覆盖两类客群：中型数字银行和金融科技公司（用 API 做 eKYC
              开户），以及大型传统银行和电商平台（使用完整风险和信用评分技术栈）。ADVANCE.AI 称其在 Bank Jago 的部署在生物识别 eKYC 上达到 99%
              准确率，新闻稿和案例研究材料使用了这一说法。具名客户证据主要来自公司；独立第三方引用、Gartner Peer Insights
              评论和独立企业案例研究都很稀少。预算所有权通常在技术或合规职能，合同金额未披露。集成完成后竞争粘性很高，因为机构重新配置 KYC 管线的运营成本高。但大型银行常采用多供应商策略，ADVANCE.AI 因而只是多个
              KYC 供应商之一，而非独家供应商。
