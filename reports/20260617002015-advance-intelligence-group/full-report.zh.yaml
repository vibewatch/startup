        blocks:
          - type: paragraph
            body: >-
              Advance Intelligence Group 于 2016 年由 Jefferson Chen 在新加坡创立。集团自称是 AI 原生的金融和数据平台。Advance Intelligence Group
              旗下有消费金融品牌 Atome Financial、企业软件品牌 ADVANCE.AI，以及商户软件品牌 Ginee。Atome Financial 把 Atome BNPL 平台与印尼数字贷款业务 Kredit
              Pintar 组合在一起。Kredit Pintar 被描述为获得印尼 OJK 牌照并受其监管。ADVANCE.AI 聚焦身份验证、KYC 或 KYB、AML、合规和风险管理流程。这些公开信号重要，因为 AIG
              是私人公司，每一项披露事实在尽调中权重都被放大。因此，本章谨慎解读已披露事实，区分公司说法和第三方报道，并在公开记录不完整处保留明确尽调缺口。实践中，叙事重点放在可交叉验证的里程碑、监管背景，以及仅凭私人公司披露能够推断到什么边界。综合判断也更看重业务单元层面的披露，而不是缺乏支撑的市场传闻，因为贷款方经济性、伙伴集中度和合规姿态才决定真正的尽调结果。
