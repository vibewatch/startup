      - number: '2.2'
        title: 企业 AI 身份、KYC 与反欺诈市场
        blocks:
          - type: paragraph
            body: >-
              ADVANCE.AI 参与企业数字身份和 KYC/AML 市场，范围包括 eKYC、生物识别验证、反欺诈决策和信用风险评分，客户是银行、金融科技公司、电信公司和电商平台。MarketsandMarkets
              估计全球身份验证市场 2024 年为 US$11.6B，预计到 2029 年达到 US$26.7B，CAGR 为 17.2%，APAC 是增长最快区域，CAGR 约 23%。IDC 另估计 APAC
              数字身份和欺诈市场 2025 年为 US$3.1B，年增速 23%。面向新兴市场的 AI 原生欺诈和信用评分子市场规模更小，但增长更快，驱动因素是西方训练模型与 SEA
              无银行账户消费者数据画像之间存在缺口。Forrester 指出，大型金融机构正从本地部署 KYC 技术栈转向基于 API、按调用付费的身份平台，这直接利好 ADVANCE.AI。ADVANCE.AI 的 SAM
              估计为活跃 APAC 市场中 800-1,200 家具备有意义数字开户规模的金融服务机构。私人市场证据更难取得，但 ADVANCE.AI 公司自称的 500-1,000
              家企业客户和每年数亿次验证，说明它已经拿下该 SAM 的有意义份额。地域多元化是优势：集团在新加坡、印尼、菲律宾、马来西亚、泰国和越南运营。
