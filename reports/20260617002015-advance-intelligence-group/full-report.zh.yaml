      - number: '7.4'
        title: 执行、伙伴与退出风险
        blocks:
          - type: paragraph
            body: >-
              AIG 正在五个司法辖区同时扩张三块不同业务，每块都需要单独的监管合规、本地伙伴和市场进入投入。管理层带宽有限、资本配置需要取舍，且企业 KYC、消费 BNPL、商户 SaaS
              必须同时守住产品市场匹配，执行风险由此上升。SoftBank Vision Fund 2 和 Warburg Pincus 的投资者集中度带来退出路径依赖：SoftBank 投资组合若整体收缩，或 Warburg
              Pincus 面临基金期限压力，都可能在业务达到最优规模前推快 IPO 时间表。截至 2026 年中，公司尚未提交 IPO 招股书或注册声明，流动性路径仍不确定。AIG 未披露集团层面的 EBITDA
              或自由现金流盈利能力，跑道评估受限。伙伴风险包括菲律宾银行卡业务对 Maya Bank 的集中依赖，以及商户获取对 Shopee、Tokopedia 等平台生态的依赖。SoftBank Vision Fund 2
              与 Warburg Pincus 作为领投方，既提供可信度，也形成清晰的退出压力。2025 年二级市场活动显示，正式 IPO 前实现部分流动性是可能的。未来三到五年，新加坡和印度尼西亚开放银行基础设施铺开，可能把
              KYC 技术栈的部分环节商品化；不过新兴市场监管复杂度仍为 ADVANCE.AI 这类成熟本地玩家保留进入壁垒。若为满足投资者流动性需求而出售某条业务线，交叉销售逻辑可能受损，集团估值倍数也会被压低。
