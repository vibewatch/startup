      - number: '6.2'
        title: 消费者客户基础：规模、分层与采用
        blocks:
          - type: paragraph
            body: >-
              Atome Financial 通过 BNPL 结账融资和 Atome Card，服务新加坡、印尼、菲律宾、马来西亚及其他 SEA 市场的个人消费者。消费业务已披露：50000+ 商户伙伴、触达 10M+
              消费者（公司口径）、菲律宾发行超过 200 万张 Atome Cards（约 80% 发给首次持卡人）、FY2024 GMV run rate 超过 US$2B，以及到 2025 年 Q2 年化 GMV 超过
              US$4B、净收入超过 US$500M。消费者基础偏向 18-40 岁、智能手机原生、半银行覆盖人群；菲律宾卡业务明确瞄准被信用卡排除的人群。Atome 和 Ginee 在 Capterra、GetApp
              的评论页面呈现混合用户情绪：商户称赞多渠道上架效率，消费者偶尔指出 Atome 催收流程争议。Atome（菲律宾）和 Kredit Pintar（印尼）的 App Store
              评分公开可见，显示满意度中等（各商店约 3.5-4.2 星区间）。多家企业客户在 LinkedIn 上的企业推荐，佐证了 ADVANCE.AI
              的部署广度。消费者获客主要靠商户结账集成和数字广告；自然流量和转介绍渠道未披露。Kredit Pintar（印尼数字贷款）服务另一类消费贷款客群，有自己的承保画像。集团未公开披露消费者 cohort
              留存、复购率或消费者 NPS。
