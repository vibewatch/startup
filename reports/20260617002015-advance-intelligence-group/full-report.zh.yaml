              - CV006
              - CV009
              - CV034
      - number: '8.3'
        title: 可比估值与情景分析
        blocks:
          - type: paragraph
            body: >-
              上市公司可比对象中，Zip Co（ASX）、Sezzle（NASDAQ）和 Paidy（PayPal 以 7.1x GMV 收购）是最相关的 BNPL 可比公司。Grab Financial Group
              提供嵌入式 BNPL 参照，但不是独立可比对象。私营市场中，Kredivo 2023 年按隐含 US$1B 估值融资，当时 GMV 约 US$1.5B，对应 0.7x GMV。Akulaku 的隐含估值估计约
              US$1B。Pine Labs 2021 年支付量为 US$40B，估值 US$3.5B，但商业模式不同。ADVANCE.AI 的 KYC 业务最接近 Sumsub；Sumsub 2022 年在 US$50M
              ARR 上估值 US$600M，隐含约 12x 收入。Ginee 可用 GS1 等价 OMS SaaS 的 5x-8x ARR 作为基准，但没有披露 ARR，比较只能看方向。熊市情景假设 Atome BNPL
              受监管压缩利润率、ADVANCE.AI 向全球 KYC 供应商流失 20% 市场份额且 IPO 推迟到 2028 年以后，对应总股权价值
              US$1.0B-US$1.5B。基准情景假设当前轨迹在中等逆风下延续，2027 年股权价值为 US$2.5B-US$3.5B。牛市情景需要集团盈利超过 US$100M EBITDA、ADVANCE.AI 达到
              1,500 家企业客户，并以 12x-15x 收入倍数成功双重上市，对应股权价值 US$4.5B-US$6.0B。
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
