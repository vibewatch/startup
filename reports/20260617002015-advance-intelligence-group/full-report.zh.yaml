      - number: '8.4'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年中，AIG 还未达到 IPO 准备状态，证据是没有任何注册声明、承销商授权披露或 IPO 前准备性文件。第三方报道显示，公司偏好新加坡—香港双重上市；这需要至少两年经审计盈利记录、至少 25%
              公众持股量，并满足 SGX 或 HKEX 上市要求。若 2024 年盈利说法成立，且经审计账目确认集团层面 EBITDA，最早现实 IPO 窗口会是 2027 年下半年。向 Grab、Sea Group
              或区域银行等战略买家出售仍是替代退出路径，但多产品复杂结构会让干净收购更难。基于市场背景，投资者以较 2021 年轮次估值标记折价 10%-20%
              的二级市场交易获得流动性，看起来可行。最重要的破坏论点触发因素，是 Kredit Pintar 被迫披露 NPL 高于 OJK 行业平均，或 BSP、OJK、MAS 对任何 AIG
              实体采取执法行动。最终尽调问题包括：FY2023 和 FY2024 经审计集团财务、Kredit Pintar NPL 和拨备数据、ADVANCE.AI 企业 NRR 和客户流失、Atome BNPL 按
              vintage 划分的逾期和违约率，以及包含完整优先权结构的股权表。
