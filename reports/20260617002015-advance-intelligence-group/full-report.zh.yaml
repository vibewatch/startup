  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Advance Intelligence Group 至少横跨五个司法辖区运营，监管框架各不相同且持续演进。在印尼，Kredit Pintar 持有 OJK 金融科技贷款牌照，Atome 消费 BNPL 和
              ADVANCE.AI 数据处理活动也受到 OJK 及 UU PDP 下国家数据保护机构的监督。在菲律宾，Atome Financial 持有 BSP 的授权证书，并受 Financial Consumer
              Protection Act 约束。在马来西亚，Atome BNPL 架构在 BNM 监管的支付服务牌照下。在新加坡，Atome 和 ADVANCE.AI 受 MAS 监督和 PDPA
              约束。公司处理的生物识别数据受新加坡 PDPA、印尼 UU PDP 和菲律宾 Data Privacy Act 约束。关键监管风险包括牌照续期不确定性、跨境数据传输限制，以及 BNPL 消费者保护要求趋严。BSP
              和 OJK 在 2024-2025 年均引入 BNPL 披露和利率上限规则，可能压缩 Atome 利润率。尚无针对 AIG 实体的执法行动被公开记录，但没有记录并不等于完全合规得到确认。
