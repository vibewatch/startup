  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: SEA BNPL 与数字信贷市场：边界和规模
        blocks:
          - type: paragraph
            body: >-
              Atome Financial
              的主要市场是东南亚消费先买后付（BNPL）和短期限数字信贷，定义为结账环节或嵌入式钱包信贷中的分期消费融资，以本币计价，通过移动优先渠道交付。可服务支出包括线上零售、外卖、旅行、数字服务和部分线下商户类别。不包括传统银行分期卡、按揭、汽车金融和
              B2B 贸易信贷。多家分析机构的估算收敛到 2024 年 SEA BNPL 市场总交易额 US$7B-US$20B，并在 2029 年前以 18-29% 的复合年增长率增长。被广泛引用的 Mordor
              Intelligence 估计显示，区域 BNPL 市场 2024 年为 US$7.3B，到 2029 年以 29% CAGR 扩大至 US$26B；Bloomberg Intelligence
              则在纳入分期卡和电信信贷相邻领域后，给出超过 US$45B 的更广义数字信贷规模。Bain、Google 和 Temasek 的 e-Conomy SEA 2025 报告估计，金融科技总 GMV 为
              US$130B，BNPL 是增长最快的子板块。由于边界定义不同，投资人做承销应锚定更窄的 BNPL-only 估算，把更宽的数字信贷口径作为天花板。多数市场中，BNPL 在合格线上交易中的渗透率仍低于
              10%，意味着基准情形下仍有大量空间。Atome Financial 披露到 2025 年 Q2 年化 GMV 超过 US$4B，意味着相对于更宽口径估算，市场份额处于低个位数百分比区间。
            claimRefs:
