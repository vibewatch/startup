companyProfile:
  summary: >-
    Advance Intelligence Group（AIG）是一家总部位于新加坡的金融科技控股公司，CEO Jefferson Chen 于 2016 年创立。公司经营三条互补业务线：Atome Financial，面向东南亚超过
    1000 万消费者和 50000 家商户伙伴，提供消费端先买后付和嵌入式信贷平台；ADVANCE.AI，面向 500 至 1000 家银行、金融科技公司和平台公司，提供企业身份验证、生物识别 eKYC 和反欺诈平台；以及
    Ginee，面向商户的全渠道电商 SaaS 平台。公司还持有 Kredit Pintar，这是一家获得 OJK 牌照的印尼消费贷款子公司。AIG 在 2021 年 Series D 融资超过 US$400M，估值约
    US$2B，投资方包括 SoftBank Vision Fund 2、Warburg Pincus 和 Pavilion Capital。Atome Financial 披露 2024 年实现 EBITDA 盈利，到 2025 年
    Q2 年化 GMV 超过 US$4B，净收入超过 US$500M。集团尚未披露经审计的集团层面财务或信用质量指标，这是核心尽调缺口。
