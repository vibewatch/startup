  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Advance Intelligence Group 在 2021 年完成 Series D 轮融资，募资超过 US$400M，隐含公司估值约 US$2B。投资者包括 SoftBank Vision Fund
              2、Warburg Pincus 和 Pavilion Capital。此后没有公开披露后续一级或二级轮估值，带来私营金融科技公司常见的盯市难题。按公司披露的 2025 年 Q2 年化 GMV 超过 US$4B
              计算，2021 年融资对应 GMV 倍数约 0.5x；相比上市 BNPL 和金融科技可比公司 0.3x 至 2.0x 的 GMV 交易倍数，这一水平较有利，具体取决于盈利轨迹。公司沟通称 Atome
              Financial 已在 2024 年实现 EBITDA 盈利，这支撑 AIG 估值，但该盈利的确切利润率和覆盖范围尚未独立验证。尽调时，投资者应把入场价校准在 US$2B 至 US$2.5B 股权价值区间，这与
              2021 年估值标记和当前可比倍数一致。若估值为 US$2.5B，按估计 US$500M-US$600M 净收入基数计算，2026E 收入倍数为 4x 至 5x，大体符合公开市场中已盈利 SEA
              金融科技同业。任何高于 US$3.5B 的二级购买，都需要对 BNPL 利润率可持续性、ADVANCE.AI 收入增速加快以及近期 IPO 催化剂有高确信度。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV009
              - CV006
      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              AIG 的多头逻辑有三根支柱：第一，Atome Financial 是 SEA 少数已实现 EBITDA 盈利、同时 GMV 仍保持年增速 50% 以上的 BNPL
              平台之一，在效率曲线上领先多数区域消费信贷同业；第二，ADVANCE.AI 在 SEA 生物识别身份验证上有可防守的数据网络优势，基础是覆盖多元本地人群的数亿笔交易，全球 KYC 供应商不易复制；第三，Ginee
              为 Atome 提供低 CAC 的商户获取漏斗，形成跨产品飞轮，降低独立 BNPL 获客成本。反论点认为，盈利数据来自公司口径且未经审计，BNPL 单位经济取决于避开不利信用选择，而没有 NPL
              披露就无法评估这一点；三产品同步扩张会稀释执行力；在全球金融科技倍数压缩阶段，退出路径也面对公开市场逆风。该论点有证据支撑，但实质上取决于 Atome 的信用质量，这是最重要的尽调问题。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
          - type: figure
            figureRef: FV004
            claimRefs:
