      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Advance Intelligence Group 同时服务三种不同的买方—用户—付款方组合。Atome Financial 的终端用户是个人消费者（通常 18-40
              岁、智能手机原生、半银行覆盖或银行覆盖不足），付款方是已集成结账的商户（通过商户折扣率），收入付款方还包括通过滞纳金付费的消费者。ADVANCE.AI
              的买方、用户和预算所有者都是同一个机构客户（银行、金融科技公司或平台），客户授权使用 API，预算通常归数字或合规职能。Ginee 的买方—用户是 SME 商户或市场卖家，付款方是通过 SaaS
              订阅付费的商户。投资分析必须理解这三种配置，因为各业务单元的获客经济性、转换成本和扩张路径差异很大。消费 BNPL 因多平台使用而转换摩擦低；企业 KYC 因深度集成而锁定强；SaaS
              平台受益于工作流粘性。印尼拥有最大的可服务消费者人口，约 270M，按 World Bank 数据，正规银行渗透率约 49%；菲律宾 BNPL 市场增长很快，成年人超过 70M，银行覆盖率低于 34%。OECD
              和 Asian Development Bank 数据显示，尽管 SEA 智能手机渗透率超过 80%，印尼和菲律宾的正规信贷可得性仍低于 40%。
