      - number: '6.3'
        title: 留存、复用、耐久性与集中度
        blocks:
          - type: paragraph
            body: >-
              Atome Financial 的留存和复用数据没有以任何粒度公开披露。公开来源能提供的代理指标包括：整体 GMV 轨迹（FY2024 同比约增长 50%）、Atome Card 发卡速度（菲律宾两年内超过
              200 万张卡），以及应用商店用户评论量（显示用户基础大但波动）。高层面的 GMV 增长与强留存相符，但没有 cohort
              曲线、总收入留存或净收入留存数据，就无法区分新用户获取增长和留存扩张。ADVANCE.AI 的企业留存同样不透明：没有公开来源披露续约率、平均合同期限或 logo 流失。KYC
              和欺诈基础设施集成深度带来转换成本，可能支撑高留存，但这是推断，不是观测结果。集中度风险明显：如果大型机构客户（例如印尼前五大银行）转向竞争 KYC
              供应商，收入冲击可能很大。消费端同样如此，过度偏向单一市场（菲律宾卡业务）会引入地域集中。Lowy Institute 曾将平台信贷集中列为区域风险，提示部分市场的 BNPL
              采用率可能快于消费者金融素养和还款能力。Atome 的独立 Trustpilot 评论浮现出围绕催收和争议的投诉，显示可能影响留存的客户满意度缺口。
