      - number: '2.4'
        title: 增长驱动、采用约束与市场展望
        blocks:
          - type: paragraph
            body: >-
              SEA 的 BNPL 和身份服务需求由结构性、多年期因素驱动：（1）六大主要市场中银行覆盖不足人口超过 400M，持续制造替代信贷需求；（2）智能手机渗透和移动商务增长加速，SEA 移动商务预计到 2026
              年超过 US$220B；（3）东南亚监管机构逐步为数字支付和贷款运营商发牌并将其常态化；（4）COVID 后 SME 数字化加速，拉动对 Ginee 类 SaaS 工具的需求。关键采用约束包括 BNPL
              监管趋严，尤其是印尼 OJK POJK 8/2024 对消费信贷规则要求更严格；宏观驱动的消费信贷逾期风险；超级 App 对消费者钱包份额的激烈竞争；以及高获客成本带来的持续单位经济压力。Bloomberg
              Intelligence 指出，全球 BNPL 行业在 2023-2024 年出现较高信用损失和运营商整合，随着 SEA 市场成熟，类似压力也可能出现。企业 KYC 的宏观约束是 AWS、Google 和
              Microsoft 以规模价格提供云端身份 API，带来商品化风险。McKinsey 研究显示，嵌入现有数字支付基础设施的贷款增长快于独立 BNPL App，给超级 App
              形成不对称竞争优势。归根到底，市场大且在增长，但竞争强度和监管复杂度要求公司在地域和客群上保持纪律。
