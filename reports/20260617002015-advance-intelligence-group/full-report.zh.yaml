            body: >-
              最有支撑的扩张证明是菲律宾的 Atome Card 业务和 Maya Bank 合作。Atome 借助 Maya Bank 的 US$48M 授信发行超过 200 万张卡，把 Atome Card
              用作菲律宾银行覆盖不足人群的主要数字信贷工具。Jollibee Atome Card 合作（2026 年 3 月宣布）覆盖超过 1,300 家门店，代表一个能拉动用卡频次的高频商户网络。ADVANCE.AI 通过
              AdvanGuard 产品扩展到 Web3 和加密货币 KYC，把企业买方池扩展到传统金融之外。Ginee 已扩张到多个 SEA
              国家，并深化了市场平台集成。企业端客户集中风险重大，但没有按客户收入数据就无法量化。和这一阶段的企业 API 公司一样，集团很可能依赖少数大型机构客户贡献 ADVANCE.AI
              收入的超比例份额。消费端商户伙伴集中度分散（50000+ 商户），但 GMV 可能集中在少数大型线上市场。Business Times Singapore 和 TechInAsia 报道过 Atome Card
