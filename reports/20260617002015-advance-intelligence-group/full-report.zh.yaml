  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 区域 BNPL 与贷款同业
        blocks:
          - type: paragraph
            body: >-
              Kredivo 是围绕消费信贷和分期驱动商业建立的主要区域竞争对手。Akulaku 在类似东南亚消费客群中，以 App 分期和现金贷流程竞争。Grab PayLater 受益于更大 Grab 超级 App
