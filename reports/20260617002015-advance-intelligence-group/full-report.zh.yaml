      - number: '7.3'
        title: 竞争替代与宏观风险
        blocks:
          - type: paragraph
            body: >-
              SEA 的 BNPL 市场竞争激烈，Kredivo、Akulaku、Pine Labs 以及区域银行的 BNPL 产品都在提供边际成本接近零的替代方案。Atome
              靠商户网络广度和品牌认知度做出差异化，但没有结构性护城河能挡住银行主导的 BNPL。Ginee 正面对 Shopee Seller Center、Tokopedia Seller Hub 以及印度尼西亚本地
              OMS 厂商的竞争压力。ADVANCE.AI 可能被 Jumio、Sumsub、Onfido 等全球云端 KYC 供应商替代，这些厂商在 2025-2026 年扩大了 SEA 销售覆盖。宏观风险包括 IDR 和
              PHP 贬值压低美元等值 GMV、利率上行推高 BNPL 资金成本，以及潜在经济放缓削弱消费信贷需求。Lowy Institute 的研究把 SEA 家庭债务累积列为新兴宏观审慎风险，与 Atome
              面临的逆风一致。
