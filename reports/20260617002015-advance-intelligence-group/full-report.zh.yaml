      - number: '7.2'
        title: 信用与运营风险
        blocks:
          - type: paragraph
            body: >-
              Kredit Pintar 是集团在印度尼西亚的消费贷款子公司，贷款账簿直接承担信用风险。NPL 率和核销统计并未公开披露，外部投资者因此有一个重大盲区。Atome 的消费 BNPL 逾期率也未披露；在菲律宾与
              Maya Bank 的联名发卡结构把部分信用风险转给发卡银行，但精确的信用敞口分摊没有文件说明。若违约率或身份欺诈模式变化快过模型再训练周期，ADVANCE.AI
              的反欺诈模型会面临模型漂移风险。关键人物风险中等：CEO Jefferson Chen 是投资者关系和战略定位的核心，且没有公开的接班计划。KYC
              流程一旦出现技术宕机，可能卡住企业客户入驻，并损害续约率。印度尼西亚的 AML 和 CFT 合规由 PPATK 监管；外部法律评论也显示，金融科技贷款机构正面对更严审查。
