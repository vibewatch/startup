  topStrengths:
    - >-
      Atome Financial achieved company-stated EBITDA profitability in FY2024 with annualised GMV above US$4B, placing it
      ahead of most regional BNPL peers on the Efficiency Curve
    - >-
      ADVANCE.AI holds a defensible SEA biometric-identity data-network advantage built on hundreds of millions of
      transactions across diverse local populations that global KYC vendors cannot easily replicate
    - >-
      Multi-product flywheel across Atome BNPL, ADVANCE.AI KYC, and Ginee merchant SaaS creates cross-selling
      optionality and a lower blended customer acquisition cost
  topRisks:
    - >-
      Credit quality of Kredit Pintar and Atome BNPL is entirely undisclosed; NPL and delinquency rates are the single
      most important diligence unknown
    - >-
      BNPL regulatory tightening across five jurisdictions with evolving fee caps and consumer protection mandates could
      compress Atome net interest margins materially
    - >-
      SoftBank Vision Fund 2 and Warburg Pincus exit pressure may accelerate an IPO before optimal scale, and no
      registration statement has been filed as of mid-2026
  unresolvedGaps:
    - >-
      Audited group financials for FY2023 and FY2024 are not publicly available; the EBITDA profitability claim is
      company-stated and unverified
    - >-
      Kredit Pintar NPL rate and Atome BNPL delinquency data by cohort vintage are not disclosed and cannot be assessed
      from public sources
    - >-
      AIG cap table and full Series A to D preference stack are not publicly available, preventing
      liquidation-preference overhang analysis
