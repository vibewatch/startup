        title: Competitive Displacement and Macro Risk
        blocks:
          - type: paragraph
            body: >-
              The BNPL market in SEA is competitive with Kredivo, Akulaku, Pine Labs, and regional bank BNPL products
              offering zero-marginal-cost alternatives. Atome differentiates on merchant network breadth and brand
              recognition but does not hold a structural moat preventing bank-led BNPL. Ginee faces rising competitive
              pressure from Shopee Seller Center, Tokopedia Seller Hub, and local OMS players in Indonesia. ADVANCE.AI
              faces potential displacement by global cloud KYC vendors including Jumio, Sumsub, and Onfido, which
              expanded SEA sales coverage in 2025-2026. Macro risks include IDR and PHP depreciation reducing
              dollar-equivalent GMV, rising interest rates increasing BNPL funding costs, and potential economic
              slowdown reducing consumer credit demand. Lowy Institute research identifies household debt accumulation
              in SEA as an emerging macroprudential risk consistent with adverse macro headwinds for Atome.
