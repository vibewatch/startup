      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Market Outlook
        blocks:
          - type: paragraph
            body: >-
              The primary demand drivers for BNPL and identity services in SEA are structural and multi-year: (1) a
              low-banked population of 400M+ across the six major markets, creating persistent demand for alternative
              credit; (2) accelerating smartphone penetration and mobile-commerce growth, with SEA mobile commerce
              expected to exceed US$220B by 2026; (3) Southeast Asian regulatory bodies progressively licensing and
              normalising digital-payment and lending operators; and (4) post-COVID acceleration of SME digitisation
              driving demand for Ginee-class SaaS tools. Key adoption constraints include tightening BNPL regulations,
              especially Indonesia OJK POJK 8/2024 imposing stricter consumer-credit rules, macro-driven consumer-credit
              delinquency risk, fierce super-app competition for consumer wallet share, and persistent unit-economics
              pressure from high customer acquisition costs. Bloomberg Intelligence notes that the global BNPL sector
              saw elevated credit losses and operator consolidation in 2023-2024, and similar pressures could emerge in
              SEA as the market matures. For enterprise KYC, a macro constraint is the commoditisation risk from
              cloud-hosted identity APIs offered by AWS, Google, and Microsoft at scale prices. McKinsey research
              suggests that embedded lending within existing digital-payment infrastructure is outpacing standalone BNPL
              app growth, creating an asymmetric competitive advantage for super-apps. Net-net, the market is large and
              growing, but competition intensity and regulatory complexity require disciplined geographic and segment
              focus.
            claimRefs:
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
          - type: table
            tableRef: TM004
