  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Advance Intelligence Group operates across at least five jurisdictions with distinct and evolving
              regulatory frameworks. In Indonesia, Kredit Pintar holds an OJK fintech lending licence, and both Atome
              consumer BNPL and ADVANCE.AI data-processing activities face oversight by OJK and the national data
              protection authority under UU PDP. In the Philippines, Atome Financial holds a Certificate of Authority
              from the BSP and is subject to the Financial Consumer Protection Act. In Malaysia, Atome BNPL is
              structured under a payment service licence overseen by BNM. In Singapore, Atome and ADVANCE.AI operate
              under MAS oversight and PDPA. The company processes biometric data subject to PDPA Singapore, Indonesia UU
              PDP, and Philippines Data Privacy Act. Key regulatory risks include licence renewal uncertainty,
              cross-border data transfer restrictions, and tightening BNPL consumer-protection mandates. BSP and OJK
              both introduced BNPL disclosure and interest-cap rules in 2024-2025 that may compress Atome margins. No
              enforcement action against AIG entities has been publicly documented, though that absence is not
              confirmation of full compliance.
