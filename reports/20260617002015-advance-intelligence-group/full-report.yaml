  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'SEA BNPL and Digital Credit Market: Boundary and Sizing'
        blocks:
          - type: paragraph
            body: >-
              The primary market for Atome Financial is consumer buy-now-pay-later (BNPL) and short-tenor digital credit
              in Southeast Asia, defined as instalment-based consumer financing at checkout or via embedded wallet
              credit, denominated in local currencies and delivered through mobile-first channels. The addressable spend
              includes online retail, food delivery, travel, digital services, and selected offline merchant categories.
              It excludes traditional bank instalment cards, mortgage, auto finance, and B2B trade credit. Multiple
              analyst estimates converge on a 2024 SEA BNPL market of US$7B-US$20B in gross transaction value, growing
              at a compound annual rate of 18-29% through 2029. A widely cited Mordor Intelligence estimate places the
              regional BNPL market at US$7.3B in 2024, expanding to US$26B by 2029 at 29% CAGR, while Bloomberg
              Intelligence suggests broader digital-credit figures exceeding US$45B when instalment-card and
              telco-credit adjacencies are included. The Bain and Google and Temasek e-Conomy SEA 2025 report estimated
              total fintech GMV at US$130B with BNPL as the fastest-growing sub-segment. Because boundary definitions
              differ, investors should anchor to the narrower BNPL-only estimate for underwriting and use the broader
              digital-credit figure as a ceiling. Penetration of BNPL among eligible online transactions remains below
              10% in most markets, implying substantial headroom in the base case. Atome Financial reported annualised
              GMV exceeding US$4B by Q2 2025, implying a market share in the low single-digit percentage range relative
              to the broader estimate.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
