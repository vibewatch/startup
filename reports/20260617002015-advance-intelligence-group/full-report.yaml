        title: Retention, Repeat Usage, Durability, and Concentration
        blocks:
          - type: paragraph
            body: >-
              Retention and repeat-usage data for Atome Financial are not publicly disclosed at any granularity. Proxies
              available from public sources include: overall GMV trajectory (up approximately 50% YoY in FY2024), Atome
              Card issuing velocity (over two million cards across a two-year timeframe in the Philippines), and user
              review volume on app stores (indicating a large but variable user base). The high-level GMV growth is
              consistent with strong retention, but without cohort curves, gross revenue retention, or net revenue
              retention figures, it is impossible to separate new-user acquisition growth from expanding retention.
              Enterprise retention for ADVANCE.AI is also opaque: no public source discloses renewal rates, average
              contract duration, or logo churn. The integration-depth of KYC and fraud infrastructure creates switching
              costs that likely support high retention, but this is inferred not observed. Concentration risk is
              notable: if a large institutional client (e.g., a top-5 Indonesian bank) moves to a competing KYC vendor,
              revenue impact could be significant. Similarly, on the consumer side, over-indexing to one market
              (Philippines card franchise) introduces geographic concentration. The Lowy Institute has cited platform
              credit concentration as a regional risk, flagging that BNPL adoption rates in some markets may outpace
              consumer financial literacy and repayment capacity. Independent Trustpilot reviews of Atome surface
              complaints around debt collection and disputes, signalling customer-satisfaction gaps that could affect
              retention.
