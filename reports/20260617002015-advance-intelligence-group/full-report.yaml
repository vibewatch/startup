            body: >-
              Advance Intelligence Group completed a Series D round in 2021 raising over US$400M at an implied company
              valuation of approximately US$2B. Investors included SoftBank Vision Fund 2, Warburg Pincus, and Pavilion
              Capital. No subsequent primary or secondary round valuation has been publicly disclosed, creating a
              mark-to-market challenge typical for private fintech companies. At the company-stated annualised GMV
              exceeding US$4B in Q2 2025, the 2021 round implies a GMV multiple of roughly 0.5x, which compares
              favourably to comparable public BNPL and fintech companies trading at 0.3x to 2.0x GMV depending on
              profitability trajectory. The AIG valuation is supported by reported Atome Financial EBITDA profitability
              as of 2024 per company communications, though the exact margin and scope of that profitability have not
              been independently verified. For diligence purposes, investors should calibrate entry around a US$2B to
              US$2.5B equity value as a range consistent with the 2021 mark and current comparable multiples. At
              US$2.5B, the 2026E revenue multiple would be 4x to 5x on an estimated US$500M-US$600M net revenue base,
              broadly in line with profitable SEA fintech peers in the public market. Any secondary purchase above
              US$3.5B would require high confidence in BNPL margin sustainability, ADVANCE.AI accelerating revenue
              growth, and a near-term IPO catalyst.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV009
              - CV006
      - number: '8.2'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case for AIG rests on three pillars: first, Atome Financial is one of the few BNPL platforms in
              SEA to have reached EBITDA profitability while still growing GMV at above-50% annually, which places it
              ahead of most regional consumer-credit peers on the Efficiency Curve; second, ADVANCE.AI has a defensible
              data-network advantage in SEA biometric-identity verification built on hundreds of millions of
              transactions across diverse local populations that global KYC vendors cannot easily replicate; third,
              Ginee provides a low-CAC merchant acquisition funnel for Atome, creating a cross-product flywheel that
              reduces the standalone BNPL customer-acquisition cost. The anti-thesis argues that profitability data is
              company-stated and unaudited, BNPL unit economics depend on avoiding adverse credit selection which cannot
              be assessed without NPL disclosure, the three-product simultaneous scaling creates execution dilution, and
              the exit path faces public-market headwinds in a period of compressed fintech multiples globally. The
              thesis is evidence-supported but depends materially on Atome credit quality, which is the single most
              important diligence ask.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV001
              - CV006
              - CV009
              - CV034
      - number: '8.3'
        title: Comparable Valuation and Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              For comparable public companies, Zip Co (ASX), Sezzle (NASDAQ), and Paidy (acquired by PayPal at 7.1x GMV)
              provide the most relevant BNPL comps. Grab Financial Group provides an embedded BNPL reference though not
              a standalone comparable. In private markets, Kredivo raised at an implied US$1B valuation in 2023 at
              roughly US$1.5B GMV, implying 0.7x GMV. Akulaku implied valuation is estimated at approximately US$1B.
              Pine Labs was valued at US$3.5B on a payment volume of US$40B in 2021 though the business model differs.
              ADVANCE.AI KYC business is most comparable to Sumsub which was valued at US$600M on US$50M ARR in 2022,
              implying approximately 12x revenue. Ginee can be benchmarked against GS1-equivalent OMS SaaS at 5x-8x ARR,
              but without disclosed ARR the comparison is directional only. The bear case assumes Atome BNPL regulatory
              margin compression, ADVANCE.AI losing 20% market share to global KYC vendors, and a 2028+ IPO, implying
              US$1.0B-US$1.5B total equity. The base case assumes current trajectory continues with moderate headwinds,
              yielding US$2.5B-US$3.5B in 2027. The bull case requires demonstrated group profitability above US$100M
              EBITDA, ADVANCE.AI hitting 1,500 enterprise clients, and successful dual-listing at 12x-15x revenue,
              implying US$4.5B-US$6.0B equity value.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
