      - number: '2.2'
        title: Enterprise AI Identity, KYC, and Fraud-Prevention Market
        blocks:
          - type: paragraph
            body: >-
              ADVANCE.AI competes in the enterprise digital-identity and KYC/AML market, encompassing eKYC, biometric
              verification, anti-fraud decisioning, and credit-risk scoring sold to banks, fintechs, telcos, and
              e-commerce platforms. MarketsandMarkets estimated the global identity-verification market at US$11.6B in
              2024, forecast to reach US$26.7B by 2029 at 17.2% CAGR, with APAC the fastest-growing region at
              approximately 23% CAGR. IDC separately estimates the APAC digital identity and fraud market at US$3.1B in
              2025 growing at 23% annually. The sub-market for AI-native fraud and credit scoring in emerging markets is
              smaller but growing faster, driven by the gap between Western-trained models and the data profiles of
              unbanked SEA consumers. Forrester notes that large financial institutions are shifting from on-premise KYC
              stacks to API-based, pay-per-call identity platforms, directly benefiting ADVANCE.AI. The SAM for
              ADVANCE.AI is estimated at 800-1,200 financial-services institutions across active APAC markets with
              meaningful digital-onboarding scale. Private-market evidence is harder to obtain but ADVANCE.AI
              company-stated enterprise client base of 500-1,000 and hundreds of millions of annual verifications
              suggests it has captured a meaningful share of this SAM. Geographic diversity is a strength: the group
              operates across Singapore, Indonesia, Philippines, Malaysia, Thailand, and Vietnam.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM005
            claimRefs: []
      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Advance Intelligence Group addresses three distinct buyer-user-payer configurations simultaneously. For
              Atome Financial, the end-user is an individual consumer (typically 18-40 years old, smartphone-native,
              semi- or under-banked), the payer is the merchant whose checkout is integrated (via merchant discount
              rate), and the revenue payer also includes the consumer via late fees. For ADVANCE.AI, the buyer, user,
              and budget owner are all the same institutional client (bank, fintech, or platform) that licences the API,
              with budget ownership sitting in the digital or compliance function. For Ginee, the buyer-user is the SME
              merchant or marketplace seller, and the payer is the merchant via SaaS subscription. Understanding these
              three distinct configurations matters for investor analysis because customer acquisition economics,
              switching costs, and expansion vectors differ substantially across business units. Consumer BNPL suffers
              from low switching friction given multi-homing; enterprise KYC benefits from deep integration lock-in;
              SaaS platforms benefit from workflow stickiness. Indonesia accounts for the largest addressable consumer
              population at 270M with approximately 49% formal banking penetration per World Bank data; the Philippines
              has a fast-growing BNPL market with over 70M adults and below 34% banked. OECD and Asian Development Bank
              data indicate that despite smartphone penetration above 80% across SEA, formal credit access remains below
              40% in Indonesia and the Philippines.
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM017
              - CM018
              - CM019
              - CM020
              - CM021
          - type: table
            tableRef: TM003
