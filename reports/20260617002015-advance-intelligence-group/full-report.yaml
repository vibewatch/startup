            body: >-
              Atome Financial serves individual consumers across Singapore, Indonesia, Philippines, Malaysia, and other
              SEA markets with BNPL checkout financing and the Atome Card. The consumer business has disclosed: 50,000+
              merchant partners, 10M+ consumers reached (company-stated), more than two million Atome Cards issued in
              the Philippines (with approximately 80% to first-time cardholders), a US$2B+ GMV run rate in FY2024, and
              annualised GMV exceeding US$4B and net revenue above US$500M by Q2 2025. The consumer base skews towards
              18-40 year olds who are smartphone-native and semi-banked; the Philippines card franchise specifically
              targets the credit-card excluded population. Capterra and GetApp review pages for Atome and Ginee show
              mixed user sentiment: merchants praise multi-channel listing efficiency while consumers occasionally flag
              disputes with the Atome collections process. App Store ratings for Atome (Philippines) and Kredit Pintar
              (Indonesia) are publicly visible and indicate moderate satisfaction (3.5-4.2 stars range across stores).
              LinkedIn corporate testimonials from several enterprise clients corroborate ADVANCE.AI's deployment
              breadth. Consumer acquisition is primarily through merchant checkout integration and digital advertising;
              organic and referral channels are not disclosed. Kredit Pintar (digital lending in Indonesia) serves a
              separate consumer loan cohort with its own underwriting profile. The group does not disclose consumer
              cohort retention, repeat-purchase rates, or consumer NPS publicly.
