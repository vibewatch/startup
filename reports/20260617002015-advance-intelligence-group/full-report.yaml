      - number: '7.4'
        title: Execution, Partner, and Exit Risk
        blocks:
          - type: paragraph
            body: >-
              AIG is simultaneously scaling three distinct businesses across five jurisdictions, each requiring separate
              regulatory compliance, local partnerships, and go-to-market investments. This creates execution risk from
              management bandwidth constraints, capital allocation trade-offs, and the challenge of sustaining
              product-market fit simultaneously in enterprise KYC, consumer BNPL, and merchant SaaS. Investor
              concentration in SoftBank Vision Fund 2 and Warburg Pincus creates exit-path dependency: any broader
              SoftBank portfolio contraction or Warburg Pincus fund-horizon pressure could accelerate an IPO timeline
              before the business reaches optimal scale. No IPO prospectus or registration statement has been filed as
              of mid-2026 and the path to liquidity remains uncertain. AIG has not disclosed group-level EBITDA or
              free-cash-flow profitability, limiting runway assessment. Partner risks include concentration in Maya Bank
              for the Philippines card franchise and dependency on platform ecosystems like Shopee and Tokopedia for
              merchant acquisition. The combination of SoftBank Vision Fund 2 and Warburg Pincus as lead investors
              provides both credibility and a clear exit-pressure dynamic. Secondary market activity in 2025 suggests
              partial liquidity is possible before a formal IPO. Open-banking infrastructure rollouts in Singapore and
              Indonesia could commoditize parts of the KYC stack over a three to five year horizon, though regulatory
              complexity in emerging markets maintains a barrier-to-entry advantage for established local players like
              ADVANCE.AI. Any divestiture of one business line to satisfy investor liquidity needs could impair the
              cross-selling thesis and reduce the group valuation multiple.
