  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Enterprise Customer Profile and Named Deployments
        blocks:
          - type: paragraph
            body: >-
              ADVANCE.AI serves financial institutions and digital platforms across APAC with AI-powered identity
              verification, KYC, and credit-risk services. Company-published customer stories document deployments at
              Bank Jago (Indonesia, eKYC at 99% accuracy), Bukalapak (e-commerce onboarding), Allo Bank, Monix
              (Thailand), and Tokopedia. Enterprise client count is stated at 500+ to 1,000+ depending on source year,
              representing banks, fintechs, telcos, and e-commerce platforms. The B2B segment occupies two segments:
              mid-tier digital banks and fintechs (using API for eKYC onboarding) and large established banks and
              e-commerce platforms (using the full risk and credit-scoring stack). ADVANCE.AI's stated deployment for
              Bank Jago achieved 99% accuracy on biometric eKYC, which is used in press and case-study materials. Named
              customer evidence is predominantly company-sourced; independent third-party references, Gartner Peer
              Insights reviews, and independent enterprise case studies are sparse. Budget ownership typically sits in
              the technology or compliance function, and contract values are undisclosed. The competitive stickiness is
              high once integrated, since reconfiguring KYC pipelines is operationally expensive for an institution.
              However, multi-vendor strategies are common at larger banks, limiting ADVANCE.AI to one of several KYC
              providers rather than exclusive supplier.
