company:
  name: Advance Intelligence Group
chapter:
  number: 6
  title: Customers
  summary: Advance Intelligence Group counts 50,000+ merchants and 10M+ consumers across Southeast Asia as self-disclosed in company materials, anchored by Atome Financial FY2024 profitability and two million
    Atome Cards issued in the Philippines. The enterprise customer base of ADVANCE.AI spans 500-1,000 institutions including banks, fintechs, and e-commerce platforms. Named customer evidence is largely
    company-curated; independent corroboration from G2, Capterra, and Trustpilot shows mixed Atome consumer sentiment and limited third-party enterprise case studies. Retention, cohort data, NPS, and concentration
    metrics are private.
sections:
- id: enterprise-customer-profile
  title: Enterprise Customer Profile and Named Deployments
  body: 'ADVANCE.AI serves financial institutions and digital platforms across APAC with AI-powered identity verification, KYC, and credit-risk services. Company-published customer stories document deployments
    at Bank Jago (Indonesia, eKYC at 99% accuracy), Bukalapak (e-commerce onboarding), Allo Bank, Monix (Thailand), and Tokopedia. Enterprise client count is stated at 500+ to 1,000+ depending on source
    year, representing banks, fintechs, telcos, and e-commerce platforms. The B2B segment occupies two segments: mid-tier digital banks and fintechs (using API for eKYC onboarding) and large established
    banks and e-commerce platforms (using the full risk and credit-scoring stack). ADVANCE.AI''s stated deployment for Bank Jago achieved 99% accuracy on biometric eKYC, which is used in press and case-study
    materials. Named customer evidence is predominantly company-sourced; independent third-party references, Gartner Peer Insights reviews, and independent enterprise case studies are sparse. Budget ownership
    typically sits in the technology or compliance function, and contract values are undisclosed. The competitive stickiness is high once integrated, since reconfiguring KYC pipelines is operationally expensive
    for an institution. However, multi-vendor strategies are common at larger banks, limiting ADVANCE.AI to one of several KYC providers rather than exclusive supplier.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  tableRefs:
  - TU001
  - TU003
  figureRefs: []
- id: consumer-customer-profile
  title: 'Consumer Customer Base: Scale, Segments, and Adoption'
  body: 'Atome Financial serves individual consumers across Singapore, Indonesia, Philippines, Malaysia, and other SEA markets with BNPL checkout financing and the Atome Card. The consumer business has
    disclosed: 50,000+ merchant partners, 10M+ consumers reached (company-stated), more than two million Atome Cards issued in the Philippines (with approximately 80% to first-time cardholders), a US$2B+
    GMV run rate in FY2024, and annualised GMV exceeding US$4B and net revenue above US$500M by Q2 2025. The consumer base skews towards 18-40 year olds who are smartphone-native and semi-banked; the Philippines
    card franchise specifically targets the credit-card excluded population. Capterra and GetApp review pages for Atome and Ginee show mixed user sentiment: merchants praise multi-channel listing efficiency
    while consumers occasionally flag disputes with the Atome collections process. App Store ratings for Atome (Philippines) and Kredit Pintar (Indonesia) are publicly visible and indicate moderate satisfaction
    (3.5-4.2 stars range across stores). LinkedIn corporate testimonials from several enterprise clients corroborate ADVANCE.AI''s deployment breadth. Consumer acquisition is primarily through merchant
    checkout integration and digital advertising; organic and referral channels are not disclosed. Kredit Pintar (digital lending in Indonesia) serves a separate consumer loan cohort with its own underwriting
    profile. The group does not disclose consumer cohort retention, repeat-purchase rates, or consumer NPS publicly.'
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  tableRefs:
  - TU002
  - TU004
  figureRefs:
  - FU001
- id: retention-durability
  title: Retention, Repeat Usage, Durability, and Concentration
  body: 'Retention and repeat-usage data for Atome Financial are not publicly disclosed at any granularity. Proxies available from public sources include: overall GMV trajectory (up approximately 50% YoY
    in FY2024), Atome Card issuing velocity (over two million cards across a two-year timeframe in the Philippines), and user review volume on app stores (indicating a large but variable user base). The
    high-level GMV growth is consistent with strong retention, but without cohort curves, gross revenue retention, or net revenue retention figures, it is impossible to separate new-user acquisition growth
    from expanding retention. Enterprise retention for ADVANCE.AI is also opaque: no public source discloses renewal rates, average contract duration, or logo churn. The integration-depth of KYC and fraud
    infrastructure creates switching costs that likely support high retention, but this is inferred not observed. Concentration risk is notable: if a large institutional client (e.g., a top-5 Indonesian
    bank) moves to a competing KYC vendor, revenue impact could be significant. Similarly, on the consumer side, over-indexing to one market (Philippines card franchise) introduces geographic concentration.
    The Lowy Institute has cited platform credit concentration as a regional risk, flagging that BNPL adoption rates in some markets may outpace consumer financial literacy and repayment capacity. Independent
    Trustpilot reviews of Atome surface complaints around debt collection and disputes, signalling customer-satisfaction gaps that could affect retention.'
  claimRefs:
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  tableRefs:
  - TU005
  figureRefs: []
- id: expansion-concentration
  title: Expansion Vectors, Partnership Proof, and Channel Dependence
  body: The most substantiated expansion proofs are the Atome Card franchise and the Maya Bank partnership in the Philippines. Atome issued over two million cards with US$48M in Maya Bank credit facilities,
    using the Atome Card as a primary digital-credit instrument for underbanked Filipinos. The Jollibee Atome Card partnership (announced March 2026) covers over 1,300 stores, representing a high-frequency
    merchant network that drives card usage frequency. ADVANCE.AI expanded into Web3 and crypto KYC via the AdvanGuard product, broadening its enterprise buyer pool beyond traditional finance. Ginee has
    expanded geographically to multiple SEA countries and deepened its marketplace integrations. Customer concentration risk on the enterprise side is material but unquantifiable without revenue-by-client
    data. The group is likely dependent on a small number of large institutional clients for a disproportionate share of ADVANCE.AI revenue, as is typical for enterprise-API businesses at this stage. On
    the consumer side, merchant partner concentration is diffuse (50,000+ merchants) but GMV may be concentrated in a handful of large online marketplaces. Business Times Singapore and TechInAsia have covered
    the Atome Card launch and Maya Bank partnership as milestones indicating that the consumer card franchise is AIG's primary near-term expansion vehicle.
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
