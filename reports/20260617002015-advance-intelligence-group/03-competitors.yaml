chapter:
  number: 3
  title: Competitors
  summary: Kredivo is a major regional competitor built around consumer credit and installment-led commerce. Akulaku competes on app-based installment and cash-loan workflows in similar Southeast Asian consumer segments. Grab PayLater benefits from the distribution loops of the larger Grab super-app.
sections:
- id: section-1
  title: Regional BNPL and lending peers
  body: Kredivo is a major regional competitor built around consumer credit and installment-led commerce. Akulaku competes on app-based installment and cash-loan workflows in similar Southeast Asian consumer segments. Grab PayLater benefits from the distribution loops of the larger Grab super-app. GoPayLater benefits from GoTo ecosystem traffic and wallet adjacency. SPayLater competes from inside Shopee checkout rather than as a stand-alone destination app. Pine Labs is more merchant-enablement oriented than AIG’s consumer-led Atome model. These public signals matter because AIG is a private company, so each disclosed fact carries outsized weight in diligence. The chapter therefore interprets disclosed facts cautiously, distinguishes company claims from third-party reporting, and carries forward explicit diligence gaps where the public record stays incomplete. In practice, that means the narrative emphasizes corroborated milestones, regulatory context, and the limits of what can be inferred
    from private-company disclosure alone. The synthesis also weights unit-level disclosure more heavily than unsupported market lore, because lender economics, partner concentration, and compliance posture drive the real diligence outcome.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  - CP005
  - CP006
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: section-2
  title: Platform and super-app competition
  body: Affirm provides a useful public-market benchmark for scale, GMV, and credit-sensitivity in BNPL. Klarna provides a second public benchmark for BNPL plus broader payment-network monetization. Block shows how BNPL can be embedded inside a wider payments and merchant ecosystem after the Afterpay acquisition. AIG’s clearest differentiator versus consumer-only rivals is its ADVANCE.AI risk and onboarding stack. AIG’s clearest weakness versus super-apps is lower daily-engagement intensity outside checkout use cases. Merchant acceptance breadth matters because consumers use BNPL where it is already integrated. These public signals matter because AIG is a private company, so each disclosed fact carries outsized weight in diligence. The chapter therefore interprets disclosed facts cautiously, distinguishes company claims from third-party reporting, and carries forward explicit diligence gaps where the public record stays incomplete. In practice, that means the narrative emphasizes corroborated
    milestones, regulatory context, and the limits of what can be inferred from private-company disclosure alone. The synthesis also weights unit-level disclosure more heavily than unsupported market lore, because lender economics, partner concentration, and compliance posture drive the real diligence outcome.
  claimRefs:
  - CP007
  - CP008
  - CP009
  - CP010
  - CP011
  - CP012
  tableRefs:
  - TP002
  figureRefs:
  - FP002
- id: section-3
  title: Global valuation and capability reference points
  body: Marketplace and super-app competitors can cross-subsidize paylater with other revenue pools. Pure-play lenders like Kredivo and Akulaku compete more directly on underwriting and local credit penetration. AIG’s regional breadth is useful, but it does not create the same lock-in as controlling a dominant wallet or marketplace. AIG is better positioned than merchant-only BNPL enablers if cross-sell between lending and AI risk actually works in practice. Affirm and Klarna also show that public investors will re-rate BNPL names quickly when loss or funding assumptions change. AIG competes more credibly on merchant partnerships than on wallet ubiquity. These public signals matter because AIG is a private company, so each disclosed fact carries outsized weight in diligence. The chapter therefore interprets disclosed facts cautiously, distinguishes company claims from third-party reporting, and carries forward explicit diligence gaps where the public record stays incomplete. In practice,
    that means the narrative emphasizes corroborated milestones, regulatory context, and the limits of what can be inferred from private-company disclosure alone. The synthesis also weights unit-level disclosure more heavily than unsupported market lore, because lender economics, partner concentration, and compliance posture drive the real diligence outcome.
  claimRefs:
  - CP013
  - CP014
  - CP015
  - CP016
  - CP017
  - CP018
  tableRefs:
  - TP003
  figureRefs:
  - FP003
- id: section-4
  title: Competitive verdict for AIG
  body: 'The most dangerous local rivals are the ones with ecosystem control, not merely the ones with similar installment features. Regional consumer-finance competitors generally lack AIG’s enterprise-risk software optionality. AIG’s competitive position is therefore mixed rather than dominant: it is stronger than many specialists but weaker than the biggest ecosystems. Merchant bundles such as AsiaPay’s partnership with Atome show how distribution can still be won outside super-app ecosystems. Adverse public-comp signals matter because private-market investors still anchor on listed BNPL sentiment when they mark late-stage companies. Competitive moats in BNPL depend more on checkout share, bank funding, and losses than on app branding alone. These public signals matter because AIG is a private company, so each disclosed fact carries outsized weight in diligence. The chapter therefore interprets disclosed facts cautiously, distinguishes company claims from third-party reporting, and carries
    forward explicit diligence gaps where the public record stays incomplete. In practice, that means the narrative emphasizes corroborated milestones, regulatory context, and the limits of what can be inferred from private-company disclosure alone. The synthesis also weights unit-level disclosure more heavily than unsupported market lore, because lender economics, partner concentration, and compliance posture drive the real diligence outcome.'
