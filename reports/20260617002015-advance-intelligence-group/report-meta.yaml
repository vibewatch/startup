companyProfile:
  summary: 'Advance Intelligence Group (AIG) is a Singapore-headquartered fintech holding company founded in 2016 by CEO Jefferson Chen. It operates three complementary business lines: Atome Financial,
    a consumer buy-now-pay-later and embedded credit platform with over 10 million consumers and 50,000 merchant partners across Southeast Asia; ADVANCE.AI, an enterprise identity verification, biometric
    eKYC, and fraud-detection platform serving 500 to 1,000 banks, fintechs, and platform companies; and Ginee, an omni-channel e-commerce SaaS platform for merchants. The company also holds Kredit Pintar,
    a consumer lending subsidiary in Indonesia licensed by OJK. AIG raised over US$400M in a 2021 Series D at approximately US$2B valuation with SoftBank Vision Fund 2, Warburg Pincus, and Pavilion Capital.
    Atome Financial reported EBITDA profitability in 2024 with annualised GMV exceeding US$4B and net revenue above US$500M by Q2 2025. The group has not disclosed audited group-level financials or credit
    quality metrics, representing the key diligence gap.'
