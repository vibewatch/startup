- id: enterprise-kyc-identity-market
  title: Enterprise AI Identity, KYC, and Fraud-Prevention Market
  body: 'ADVANCE.AI competes in the enterprise digital-identity and KYC/AML market, encompassing eKYC, biometric verification, anti-fraud decisioning, and credit-risk scoring sold to banks, fintechs, telcos,
    and e-commerce platforms. MarketsandMarkets estimated the global identity-verification market at US$11.6B in 2024, forecast to reach US$26.7B by 2029 at 17.2% CAGR, with APAC the fastest-growing region
    at approximately 23% CAGR. IDC separately estimates the APAC digital identity and fraud market at US$3.1B in 2025 growing at 23% annually. The sub-market for AI-native fraud and credit scoring in emerging
    markets is smaller but growing faster, driven by the gap between Western-trained models and the data profiles of unbanked SEA consumers. Forrester notes that large financial institutions are shifting
    from on-premise KYC stacks to API-based, pay-per-call identity platforms, directly benefiting ADVANCE.AI. The SAM for ADVANCE.AI is estimated at 800-1,200 financial-services institutions across active
    APAC markets with meaningful digital-onboarding scale. Private-market evidence is harder to obtain but ADVANCE.AI company-stated enterprise client base of 500-1,000 and hundreds of millions of annual
    verifications suggests it has captured a meaningful share of this SAM. Geographic diversity is a strength: the group operates across Singapore, Indonesia, Philippines, Malaysia, Thailand, and Vietnam.'
