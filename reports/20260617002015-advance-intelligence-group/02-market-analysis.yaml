company:
  name: Advance Intelligence Group
chapter:
  number: 2
  title: Market Analysis
  summary: 'Advance Intelligence Group competes in three complementary markets: consumer BNPL and digital credit across SEA (TAM approximately US$7B-US$26B by 2029 growing at 20-29% CAGR), enterprise AI-driven
    identity and KYC in APAC (TAM approximately US$11.6B globally, growing 17% CAGR), and e-commerce SaaS for merchants. All three markets benefit from low-banked populations, accelerating smartphone penetration,
    and regulatory modernisation, though they also face tightening BNPL oversight, multi-homing consumer behaviour, and large-platform incumbents.'
sections:
- id: sea-bnpl-digital-credit-market
  title: 'SEA BNPL and Digital Credit Market: Boundary and Sizing'
  body: The primary market for Atome Financial is consumer buy-now-pay-later (BNPL) and short-tenor digital credit in Southeast Asia, defined as instalment-based consumer financing at checkout or via embedded
    wallet credit, denominated in local currencies and delivered through mobile-first channels. The addressable spend includes online retail, food delivery, travel, digital services, and selected offline
    merchant categories. It excludes traditional bank instalment cards, mortgage, auto finance, and B2B trade credit. Multiple analyst estimates converge on a 2024 SEA BNPL market of US$7B-US$20B in gross
    transaction value, growing at a compound annual rate of 18-29% through 2029. A widely cited Mordor Intelligence estimate places the regional BNPL market at US$7.3B in 2024, expanding to US$26B by 2029
    at 29% CAGR, while Bloomberg Intelligence suggests broader digital-credit figures exceeding US$45B when instalment-card and telco-credit adjacencies are included. The Bain and Google and Temasek e-Conomy
    SEA 2025 report estimated total fintech GMV at US$130B with BNPL as the fastest-growing sub-segment. Because boundary definitions differ, investors should anchor to the narrower BNPL-only estimate for
    underwriting and use the broader digital-credit figure as a ceiling. Penetration of BNPL among eligible online transactions remains below 10% in most markets, implying substantial headroom in the base
    case. Atome Financial reported annualised GMV exceeding US$4B by Q2 2025, implying a market share in the low single-digit percentage range relative to the broader estimate.
