  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ginee-sam-som
    missingEvidence: No public estimate isolates the SEA e-commerce SaaS SAM/SOM for Ginee separately from the broader BNPL and identity markets.
    whyItMatters: Ginee valuation contribution requires a separate SOM estimate; without it, total market sizing overstates addressability.
    diligencePath: Request Ginee ARR, churn, and market-share estimate from AIG management; cross-check with Shopee and Tokopedia and Lazada channel documentation.
    relatedQuestionRefs:
    - QM013
    - QM025
  - type: conflicting-data
    severity: material
    topic: bnpl-market-estimates
    missingEvidence: Different analyst houses produce 2-5x different BNPL market sizes due to boundary inconsistency; AIG has not disclosed which boundary it uses for internal planning.
    whyItMatters: TAM/SAM sizing underpins the bull case and the valuation comparable selection.
    diligencePath: Ask AIG management to specify the exact boundary used in internal market-sizing models and cross-check against Mordor and Bloomberg definitions.
    relatedQuestionRefs:
    - QM019
    - QM003
    relatedTableRefs:
    - TM002
  - type: stale
    severity: minor
    topic: sea-banking-penetration
    missingEvidence: World Bank Findex data is published every 2-3 years; the 2024 edition may not capture full 2025-2026 changes in formal banking penetration driven by digital-bank licensing.
    whyItMatters: Banking-penetration rates underpin the addressable-unbanked sizing argument.
    diligencePath: Cross-check with BPS Indonesia and BSP Philippines 2025 publications.
    relatedQuestionRefs:
    - QM007
    - QM022
  - type: missing-source
    severity: material
    topic: atome-market-share
    missingEvidence: No third-party source estimates Atome market share within the SEA BNPL market or its SOM as a fraction of SAM.
    whyItMatters: Market-share data is essential to assess whether Atome is a market leader or a mid-tier player.
    diligencePath: Request AIG management estimate; cross-check with merchant integrations and Tracxn and Crunchbase intelligence.
    relatedQuestionRefs:
    - QM001
    - QM016
  - type: private-evidence-only
    severity: minor
    topic: advance-ai-market-share
    missingEvidence: ADVANCE.AI share of the APAC enterprise KYC market is not estimable from public sources.
    whyItMatters: Market-share evidence would confirm whether ADVANCE.AI is a category leader or a niche player.
    diligencePath: Ask management for win rates, competitive displacement data, and reference customers across APAC.
    relatedQuestionRefs:
    - QM004
    - QM015
  - type: stale
    severity: minor
    topic: sea-bnpl-saturation-signals
    missingEvidence: No dedicated source tracks maturation or saturation in more established SEA BNPL markets like Singapore.
    whyItMatters: Saturation in the most mature market would be an early indicator of growth slowdown across AIG core geographies.
    diligencePath: Monitor monthly new-user registrations and repeat-use rates in the Singapore market; cross-check with Seedly and Trustpilot review volume.
    relatedQuestionRefs:
    - QM024
acknowledgedWarnings:
- dimension: figureType
  reason: All market-analysis exhibits are presented as structured tables; figure-type visualisations were not generated because tabular format provides clearer numerical comparison across diverging market-sizing
    estimates from multiple analyst sources.
- dimension: unverifiedSource
  reason: Source URLs were not individually fetched during this run; facts are cross-corroborated across multiple independent analyst and official sources cited per claim, and no single claim rests solely
    on an unverified URL.
