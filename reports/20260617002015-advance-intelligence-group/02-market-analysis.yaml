- id: buyer-segmentation-adoption-dynamics
  title: Buyer, User, and Payer Segmentation
  body: Advance Intelligence Group addresses three distinct buyer-user-payer configurations simultaneously. For Atome Financial, the end-user is an individual consumer (typically 18-40 years old, smartphone-native,
    semi- or under-banked), the payer is the merchant whose checkout is integrated (via merchant discount rate), and the revenue payer also includes the consumer via late fees. For ADVANCE.AI, the buyer,
    user, and budget owner are all the same institutional client (bank, fintech, or platform) that licences the API, with budget ownership sitting in the digital or compliance function. For Ginee, the buyer-user
    is the SME merchant or marketplace seller, and the payer is the merchant via SaaS subscription. Understanding these three distinct configurations matters for investor analysis because customer acquisition
    economics, switching costs, and expansion vectors differ substantially across business units. Consumer BNPL suffers from low switching friction given multi-homing; enterprise KYC benefits from deep
    integration lock-in; SaaS platforms benefit from workflow stickiness. Indonesia accounts for the largest addressable consumer population at 270M with approximately 49% formal banking penetration per
    World Bank data; the Philippines has a fast-growing BNPL market with over 70M adults and below 34% banked. OECD and Asian Development Bank data indicate that despite smartphone penetration above 80%
    across SEA, formal credit access remains below 40% in Indonesia and the Philippines.
