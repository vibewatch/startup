  evidenceGaps:
  - type: missing-source
    severity: material
    topic: kredit-pintar-npl-data
    missingEvidence: Kredit Pintar NPL rate and write-off data are not publicly disclosed and OJK does not publish individual company statistics.
    whyItMatters: Credit quality of the Indonesia consumer lending book is a key underwriting risk that cannot be assessed from public sources.
    diligencePath: Request Kredit Pintar audited financials and OJK reporting extracts from AIG management.
    relatedQuestionRefs:
    - QR009
    - QR010
  - type: missing-source
    severity: material
    topic: group-profitability
    missingEvidence: AIG group EBITDA and free-cash-flow are not publicly disclosed.
    whyItMatters: Without group profitability data the capital runway and funding risk cannot be independently assessed.
    diligencePath: Request AIG group management accounts and auditor sign-off letter.
    relatedQuestionRefs:
    - QR012
  - type: missing-source
    severity: minor
    topic: cross-border-data-compliance
    missingEvidence: No public evidence of a formal cross-border data transfer agreement or binding corporate rules between AIG subsidiaries.
    whyItMatters: Cross-jurisdiction biometric data flows create regulatory and legal exposure across five markets.
    diligencePath: Request DPA legal opinion on cross-border transfer compliance and intercompany data-sharing agreements.
    relatedQuestionRefs:
    - QR007
  - type: missing-source
    severity: minor
    topic: model-governance-policy
    missingEvidence: ADVANCE.AI model governance, retraining cadence, and explainability policy are not publicly disclosed.
    whyItMatters: Model drift in fraud detection is a material operational risk; undisclosed governance is a diligence gap.
    diligencePath: Request ADVANCE.AI model governance documentation from AIG technical leadership.
    relatedQuestionRefs:
    - QR014
  - type: missing-source
    severity: minor
    topic: group-capital-allocation
    missingEvidence: AIG capital allocation framework across Atome, ADVANCE.AI, and Ginee business lines is not publicly disclosed.
    whyItMatters: Multi-business capital allocation determines burn rates and relative strategic priority of each segment.
    diligencePath: Request CFO capital allocation memo and board-approved budget across business segments.
    relatedQuestionRefs:
    - QR025
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-risk-register-completeness
    missingEvidence: Regulatory risk register covers five core jurisdictions but excludes Vietnam and other emerging AIG markets.
    whyItMatters: Vietnam and other markets where ADVANCE.AI may operate carry additional regulatory exposure not captured in the register.
    diligencePath: Request full list of operating jurisdictions from AIG legal and expand the register accordingly.
    relatedTableRefs:
    - TR001
