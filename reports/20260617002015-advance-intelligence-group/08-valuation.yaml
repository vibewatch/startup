- id: TV005
  title: Thesis-Break and Kill Triggers Table
  titleSlug: thesis-break-and-kill-triggers-table
  description: Monitorable triggers that would invalidate or materially change the investment thesis
  columns:
  - Trigger
  - Threshold
  - Transmission to Thesis
  - Action Implication
  rows:
  - - Kredit Pintar NPL disclosed above OJK sector average
    - NPL rate exceeds sector by 200 bps
    - Material credit loss risk; revise bear case down
    - Immediately reduce or exit position
  - - BSP or OJK enforcement action against AIG entity
    - Any formal enforcement or licence suspension
    - Regulatory risk crystallizes; reputation damage
    - Exit position pending resolution
  - - BNPL rate cap below 1.5% monthly in Philippines or Indonesia
    - Legislation enacted and effective
    - Atome BNPL yield compressed; bear case becomes base
    - Revise revenue model downward
  - - SoftBank secondary sale at 30%+ discount to last round
    - Secondary transaction confirmed at discount
    - Implied down-round; investor confidence signal
    - Re-evaluate entry price; reduce accumulate trigger
  - - ADVANCE.AI loses 5+ named enterprise clients to global KYC vendor
    - Confirmed client defections reported
    - KYC moat narrative undermined; revenue at risk
    - Seek enterprise NRR confirmation from management
  - - AIG misses IPO window through 2028
    - No IPO prospectus filed by end of 2027
    - Exit liquidity severely limited; holding risk
    - Seek secondary or redemption rights
  notes: Kill triggers are thesis-break criteria for investment committee monitoring; not predictions of probability.
  claimRefs:
  - CV019
  - CV020
  - CV021
- id: TV006
  title: Final Diligence Asks Table
  titleSlug: final-diligence-asks-table
  description: Outstanding diligence items required before committing capital at or above current valuation
  columns:
  - Topic
  - Missing Evidence
  - Why It Matters
  - Owner or Diligence Path
  rows:
  - - Group EBITDA and FCF
    - Audited group financials FY2023 and FY2024
    - Confirms profitability claim; assesses runway
    - AIG CFO; request audited accounts
  - - Kredit Pintar NPL and provisions
    - NPL rate, write-off policy, provision coverage
    - Credit quality is the single largest blind spot
    - AIG CFO; OJK regulated reporting extracts
  - - Atome BNPL delinquency by vintage
    - Default rates by cohort vintage
    - BNPL unit economics depend on vintage quality
    - AIG CRO; request vintage analysis
  - - ADVANCE.AI enterprise NRR and churn
    - Net Revenue Retention and logo churn rate
    - Enterprise KYC moat verification
    - ADVANCE.AI CRO; management disclosure
  - - Cap table and preference stack
    - Full preference waterfall with all Series A to D terms
    - Required to assess liquidation preference overhang
    - AIG General Counsel; cap table document
  - - ADVANCE.AI ARR and revenue split
    - Segmented revenue Atome vs ADVANCE.AI vs Ginee
    - Valuation requires segment-level revenue visibility
    - AIG CFO; request management accounts by segment
  notes: Diligence paths are illustrative; investor counsel should verify legal access rights before making requests.
  claimRefs:
