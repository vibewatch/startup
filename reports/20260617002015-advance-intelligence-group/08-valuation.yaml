company:
  name: Advance Intelligence Group
chapter:
  number: 8
  title: Valuation
  summary: At the 2021 Series D implied valuation of approximately US$2B and the most recent company-stated annualised GMV above US$4B, Advance Intelligence Group trades at roughly 0.5x annualised GMV,
    a material discount to regional fintech comps. The base case assigns a US$2.5B-US$3.5B equity value by 2027, contingent on Atome achieving sustained BNPL profitability, ADVANCE.AI reaching 1,200 enterprise
    clients, and a Singapore or Hong Kong IPO at 10-12x revenue. The bear case is US$1.0B-US$1.5B under regulatory margin compression and IPO delay. The recommendation is conditional accumulate at or below
    the last disclosed round valuation with hard thesis-break triggers around credit disclosure, regulatory adverse actions, and SoftBank secondary marks.
sections:
- id: valuation-context-and-entry-discipline
  title: Valuation Context and Entry Discipline
  body: Advance Intelligence Group completed a Series D round in 2021 raising over US$400M at an implied company valuation of approximately US$2B. Investors included SoftBank Vision Fund 2, Warburg Pincus,
    and Pavilion Capital. No subsequent primary or secondary round valuation has been publicly disclosed, creating a mark-to-market challenge typical for private fintech companies. At the company-stated
    annualised GMV exceeding US$4B in Q2 2025, the 2021 round implies a GMV multiple of roughly 0.5x, which compares favourably to comparable public BNPL and fintech companies trading at 0.3x to 2.0x GMV
    depending on profitability trajectory. The AIG valuation is supported by reported Atome Financial EBITDA profitability as of 2024 per company communications, though the exact margin and scope of that
    profitability have not been independently verified. For diligence purposes, investors should calibrate entry around a US$2B to US$2.5B equity value as a range consistent with the 2021 mark and current
    comparable multiples. At US$2.5B, the 2026E revenue multiple would be 4x to 5x on an estimated US$500M-US$600M net revenue base, broadly in line with profitable SEA fintech peers in the public market.
    Any secondary purchase above US$3.5B would require high confidence in BNPL margin sustainability, ADVANCE.AI accelerating revenue growth, and a near-term IPO catalyst.
