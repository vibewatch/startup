- id: comparable-valuation-and-scenarios
  title: Comparable Valuation and Scenario Analysis
  body: For comparable public companies, Zip Co (ASX), Sezzle (NASDAQ), and Paidy (acquired by PayPal at 7.1x GMV) provide the most relevant BNPL comps. Grab Financial Group provides an embedded BNPL reference
    though not a standalone comparable. In private markets, Kredivo raised at an implied US$1B valuation in 2023 at roughly US$1.5B GMV, implying 0.7x GMV. Akulaku implied valuation is estimated at approximately
    US$1B. Pine Labs was valued at US$3.5B on a payment volume of US$40B in 2021 though the business model differs. ADVANCE.AI KYC business is most comparable to Sumsub which was valued at US$600M on US$50M
    ARR in 2022, implying approximately 12x revenue. Ginee can be benchmarked against GS1-equivalent OMS SaaS at 5x-8x ARR, but without disclosed ARR the comparison is directional only. The bear case assumes
    Atome BNPL regulatory margin compression, ADVANCE.AI losing 20% market share to global KYC vendors, and a 2028+ IPO, implying US$1.0B-US$1.5B total equity. The base case assumes current trajectory continues
    with moderate headwinds, yielding US$2.5B-US$3.5B in 2027. The bull case requires demonstrated group profitability above US$100M EBITDA, ADVANCE.AI hitting 1,500 enterprise clients, and successful dual-listing
    at 12x-15x revenue, implying US$4.5B-US$6.0B equity value.
