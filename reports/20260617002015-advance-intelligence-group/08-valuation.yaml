  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: audited-group-financials
    missingEvidence: AIG audited group financial statements for FY2023 and FY2024 are not publicly available.
    whyItMatters: Without audited financials the EBITDA profitability claim is unverifiable and the valuation recommendation carries a material uncertainty premium.
    diligencePath: Request audited group accounts and auditor sign-off from AIG CFO under NDA.
    relatedQuestionRefs:
    - QV009
    - QV017
  - type: missing-source
    severity: material
    topic: cap-table-preference-stack
    missingEvidence: AIG full cap table and Series A-D preference waterfall are not publicly disclosed.
    whyItMatters: Preference overhang from multiple rounds could materially reduce the equity return for common or Series A holders.
    diligencePath: Request cap table and preference stack from AIG General Counsel.
    relatedQuestionRefs:
    - QV017
  - type: missing-source
    severity: material
    topic: ipo-timeline-uncertainty
    missingEvidence: No IPO registration statement, bank mandate, or timeline has been officially disclosed by AIG as of mid-2026.
    whyItMatters: IPO timing is a key driver of exit scenarios; uncertainty increases the range of outcome scenarios.
    diligencePath: Monitor SGX and HKEX announcements; request AIG investor relations update.
    relatedQuestionRefs:
    - QV015
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-coverage
    missingEvidence: Comparable valuation table covers seven entities but excludes Pine Labs, Aplazo, Rely, and other regional BNPL and identity-verification comparables.
    whyItMatters: A broader comparable set would tighten the valuation range and reduce anchoring risk on the listed comps.
    diligencePath: Add Pine Labs, Xendit, and at least two more KYC comparables in a follow-up research pass.
    relatedTableRefs:
    - TV004
    relatedQuestionRefs:
    - QV026
  - type: missing-source
    severity: material
    topic: advance-ai-revenue-segment
    missingEvidence: AIG does not disclose ADVANCE.AI segment revenue, ARR, or NRR separately from the group.
    whyItMatters: Sum-of-parts valuation for AIG requires ADVANCE.AI standalone metrics to apply the KYC comparable multiples.
    diligencePath: Request segment revenue breakdown from AIG CFO.
    relatedQuestionRefs:
    - QV026
