- id: TV002
  title: Thesis / Anti-Thesis Table
  titleSlug: thesis-anti-thesis-table
  description: Bull and bear arguments with conditions that would change each view
  columns:
  - Argument
  - Evidence Base
  - What Would Change the View
  rows:
  - - BNPL profitability creates a durable fintech platform
    - Company-stated EBITDA profitability in 2024
    - Audited group financials showing loss or negative FCF
  - - ADVANCE.AI SEA data moat is defensible
    - Hundreds of millions of verifications across local populations
    - Sumsub or Jumio winning 5+ AIG enterprise logos at lower price
  - - Ginee-Atome cross-product flywheel reduces CAC
    - Merchant network overlap; no independent GMV/CAC data
    - Evidence that merchant GMV conversion to Atome consumer is below 5%
  - - SoftBank exit pressure creates IPO timeline risk
    - No filed registration statement as of June 2026
    - SoftBank secondary sale at 30%+ discount to last round
  - - Credit quality undisclosed is a material unknown
    - NPL not disclosed; no independent audit
    - NPL rate for Kredit Pintar revealed above OJK sector average
  - - Regulatory margin compression is underestimated
    - BNPL rate caps in Philippines and Indonesia in motion
    - Fee cap legislation reducing BNPL yield below 1.5% monthly
  notes: Evidence base ratings are analyst assessments; no audited data available for the positive arguments.
