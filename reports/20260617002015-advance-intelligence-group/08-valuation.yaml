- id: investment-thesis-and-anti-thesis
  title: Investment Thesis and Anti-Thesis
  body: 'The bull case for AIG rests on three pillars: first, Atome Financial is one of the few BNPL platforms in SEA to have reached EBITDA profitability while still growing GMV at above-50% annually,
    which places it ahead of most regional consumer-credit peers on the Efficiency Curve; second, ADVANCE.AI has a defensible data-network advantage in SEA biometric-identity verification built on hundreds
    of millions of transactions across diverse local populations that global KYC vendors cannot easily replicate; third, Ginee provides a low-CAC merchant acquisition funnel for Atome, creating a cross-product
    flywheel that reduces the standalone BNPL customer-acquisition cost. The anti-thesis argues that profitability data is company-stated and unaudited, BNPL unit economics depend on avoiding adverse credit
    selection which cannot be assessed without NPL disclosure, the three-product simultaneous scaling creates execution dilution, and the exit path faces public-market headwinds in a period of compressed
    fintech multiples globally. The thesis is evidence-supported but depends materially on Atome credit quality, which is the single most important diligence ask.'
  claimRefs:
