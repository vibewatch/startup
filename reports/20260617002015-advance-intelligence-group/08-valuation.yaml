- id: exit-readiness-and-diligence-asks
  title: Exit Readiness and Final Diligence Asks
  body: 'AIG is not yet IPO-ready as of mid-2026 as evidenced by the absence of any registration statement, underwriter mandate disclosure, or pre-IPO preparatory filings. The company has stated a preference
    for a Singapore-Hong Kong dual listing based on third-party coverage, which would require a track record of at least two audited profitable years, a free-float of at least 25%, and compliance with SGX
    or HKEX listing requirements. Based on the 2024 profitability claim, the earliest realistic IPO window would be H2 2027 if audited accounts confirm group-level EBITDA. A trade sale to a strategic buyer
    such as Grab, Sea Group, or a regional bank remains an alternative exit, though the multi-product complex structure complicates clean acquisition. A secondary market transaction for investor liquidity
    at 10%-20% discount to the 2021 round mark appears plausible based on market context. The single most important thesis-break trigger is a forced disclosure of Kredit Pintar NPL above the OJK sector
    average, or an enforcement action by BSP, OJK, or MAS against any AIG entity. Final diligence asks include: audited group financials for FY2023 and FY2024, Kredit Pintar NPL and provision data, ADVANCE.AI
    enterprise NRR and logo churn, Atome BNPL delinquency and default rates by vintage, and the cap table with full preference stack.'
