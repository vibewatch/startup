chapter:
  number: 1
  title: Company Overview
  summary: Advance Intelligence Group was founded in Singapore in 2016 by Jefferson Chen. The group describes itself as an AI-native financial and data platform. Advance Intelligence Group operates the consumer-finance brand Atome Financial, the enterprise-software brand ADVANCE.AI, and the merchant-software brand Ginee.
sections:
- id: section-1
  title: Identity, founding, and group structure
  body: Advance Intelligence Group was founded in Singapore in 2016 by Jefferson Chen. The group describes itself as an AI-native financial and data platform. Advance Intelligence Group operates the consumer-finance brand Atome Financial, the enterprise-software brand ADVANCE.AI, and the merchant-software brand Ginee. Atome Financial combines the Atome BNPL platform with Kredit Pintar digital lending in Indonesia. Kredit Pintar is presented as licensed and supervised by Indonesia’s OJK. ADVANCE.AI focuses on identity verification, KYC or KYB, AML, compliance, and risk management workflows. These public signals matter because AIG is a private company, so each disclosed fact carries outsized weight in diligence. The chapter therefore interprets disclosed facts cautiously, distinguishes company claims from third-party reporting, and carries forward explicit diligence gaps where the public record stays incomplete. In practice, that means the narrative emphasizes corroborated milestones, regulatory
    context, and the limits of what can be inferred from private-company disclosure alone. The synthesis also weights unit-level disclosure more heavily than unsupported market lore, because lender economics, partner concentration, and compliance posture drive the real diligence outcome.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  tableRefs:
  - TO001
  figureRefs:
  - FO001
- id: section-2
  title: Leadership, governance, and control
  body: Ginee extends the group into merchant software and ecommerce operations tooling. Advance Intelligence Group announced a USD400M Series D in 2021 led by SoftBank Vision Fund 2 and Warburg Pincus. Media coverage tied that round to a valuation of roughly USD2B. The group publicized an additional USD80M financing in 2023 with Warburg Pincus and Northstar support. Publicly cited cumulative funding exceeds USD700M by 2026. EvolutionX announced a debt commitment to Atome Financial of up to USD100M in June 2024. These public signals matter because AIG is a private company, so each disclosed fact carries outsized weight in diligence. The chapter therefore interprets disclosed facts cautiously, distinguishes company claims from third-party reporting, and carries forward explicit diligence gaps where the public record stays incomplete. In practice, that means the narrative emphasizes corroborated milestones, regulatory context, and the limits of what can be inferred from private-company disclosure
    alone. The synthesis also weights unit-level disclosure more heavily than unsupported market lore, because lender economics, partner concentration, and compliance posture drive the real diligence outcome.
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  tableRefs:
  - TO002
  figureRefs:
  - FO002
- id: section-3
  title: Funding, valuation, and capital structure
  body: Atome Financial later expanded its HSBC partnership to support Philippine expansion and new consumer-finance products. Atome Financial reported record operating income of USD236M and full-year profit in 2024. Atome Financial reported annualized net revenue above USD500M by Q2 2025. Atome Financial reported annualized GMV above USD4B by Q2 2025. ADVANCE.AI states that it serves more than 500 enterprise clients across regulated sectors. EDB profiled Jefferson Chen and AIG as a fast-scaling Singapore technology employer. These public signals matter because AIG is a private company, so each disclosed fact carries outsized weight in diligence. The chapter therefore interprets disclosed facts cautiously, distinguishes company claims from third-party reporting, and carries forward explicit diligence gaps where the public record stays incomplete. In practice, that means the narrative emphasizes corroborated milestones, regulatory context, and the limits of what can be inferred from private-company
    disclosure alone. The synthesis also weights unit-level disclosure more heavily than unsupported market lore, because lender economics, partner concentration, and compliance posture drive the real diligence outcome.
  claimRefs:
  - CO013
  - CO014
  - CO015
  - CO016
  - CO017
  - CO018
