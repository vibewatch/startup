companyProfile:
  summary: >-
    Evoken 是一家总部在北京的生成式 AI 创意软件公司，2023 年成立，通过 Beijing Yanyu Technology 运营。公司先靠 LiblibAI 扩规模，LiblibAI
    是中国大型创作者社区和模型分享平台，随后扩展到用于 AI 视频生成的 LibTV，以及面向 AI 设计工作流的 Xingliu 和 Lovart。2026 年 6 月，Evoken 完成约 US$300M 的 Series B+
    融资，估值超过 US$2B；估值支撑来自截至 2026 年 5 月约 US$300M 的 ARR 报道。
