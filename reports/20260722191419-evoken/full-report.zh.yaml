      - number: '2.2'
        title: 微短剧需求是核心 B 端拉力
        blocks:
          - type: paragraph
            body: >-
              最清晰的 B 端驱动力来自中国微短剧经济。多方来源认为 2026 年微短剧市场超过 RMB 120B，约合 US$16.5B，并把这种形态描述为手机原生、高产量、靠算法分发的娱乐。AI
              的价值在于同时压缩成本和时间：报道提到成本只有真人拍摄的十分之一、传统拍摄的五分之一，制作周期从三个月降到一个月。买方行为因此改变。工作室可以跑更多试播，减少低价值素材外包，把预算转向提示词、模型工作流、可复用角色、本地化和后期制作。Liblib
              能拿到的不是整个微短剧市场收入；更准确地说，一个庞大的经常性制作预算现在有理由购买图像、模型和视频工作流能力。区分本身很重要，因为短剧经济奖励的是可重复吞吐，而不是一次性图像质量。有每日剧集流水线的买方看重可复用角色、风格一致性、快速本地化和低摩擦协作，上述诉求更接近工作流软件，而不是
              C 端娱乐支出。
