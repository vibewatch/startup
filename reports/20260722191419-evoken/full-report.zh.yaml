  - id: TR003
    title: 与 Liblib 相关的版权和 IP 案例先例
    columns:
      - 先例
      - 裁判要旨或启示
      - 对 Liblib 的影响
      - 关键缓释措施
    rows:
      - - Li 诉 Liu，北京互联网法院
        - 当人的提示词和参数选择体现智力成果时，AI 生成图像可以受版权保护。
        - 用户若保留流程证据，可能拥有可保护输出，从而影响市场所有权和纠纷。
        - 提示词历史、生成记录、输出溯源和用户披露。
      - - 2025 年北京互联网法院猫挂件案
        - 创作者缺少原创流程记录、依赖事后模拟，主张未获支持。
        - Liblib 应支持创作者可追溯，而不是依赖重建的提示词叙事。
        - 可导出的生成日志、版本历史和审计轨迹。
      - - Ultraman 诉 Acgnai，杭州
        - 训练环节可能被宽松看待，但稳定侵权输出和平台推广会触发帮助侵权责任。
        - 知名 IP 模型被推广、复用或变现时，LoRA 市场会暴露在风险里。
        - IP 检测、模型下架、通知—删除、风险提示，以及封面 / 示例审核。
      - - 广州互联网法院 Ultraman 案
        - AIGC 服务提供者被责令停止侵权生成，并赔偿 RMB 10,000。
        - 即便是服务层提供者，也可能负有防止实质性相似输出的义务。
        - 关键词 / 模型过滤、投诉举报、用户警示和生成内容标识。
      - - EU IP Helpdesk 对 Ultraman 案的分析
        - 注意义务会随盈利能力、架构和防止侵权的能力上升。
        - Liblib 通过订阅、点数和企业使用变现后，法院可能期待更高控制水平。
        - 商业风险分层、前置预防和快速整改证据。
    notes: 这些案件不是普通法意义上的正式约束性先例，但对于承销平台注意义务而言，是高度相关的司法信号。
