  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合已从图像社区扩展为创作者操作系统
        blocks:
          - type: paragraph
            body: >-
              应把 Evoken 评估为多产品创意工作流公司，而不只是 AI 图像网站。旗舰 LiblibAI 界面仍是核心流量和素材层：公开报道提到累计用户超过 3000 万、原创模型超过 50 万、每天生成图片超过 500
              万张。随后，LiblibAI 2.0 通过加入集成式图像和视频生成、头部视频模型、效果模板，以及更广的开放 + 闭源模型菜单，把社区重新定位为专业创作工作室。相邻产品把同一素材基础延伸到新预算：LibTV
              面向视频和短剧团队，Xingliu 面向国内设计智能体工作流，Lovart 则把设计智能体命题带到国际市场。因此，产品组合逻辑是顺序推进的：创作者社区产生素材，工作室工作流提高使用频率，智能体 /
              视频产品再变现专业生产用例。尽调必须看清产品逻辑，因为只有当工作流界面转化为反复付费任务，而不是由促销算力或暂时便宜的上游模型访问补贴的一次性实验时，产品承诺才可持续。
