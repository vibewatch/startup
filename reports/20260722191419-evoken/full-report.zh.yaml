      - number: '8.4'
        title: 最终判断：合理，但需扣除中国 AI 泡沫与合规折价
        blocks:
          - type: paragraph
            body: >-
              中国 2026 年独角兽语境既提供支撑，也提醒谨慎。Nation Press 报道，2026 年上半年中国新增 67 家独角兽；胡润全球指数也显示，AI 是私人市场价值创造的主引擎。Liblib
              因而不是孤立的融资异常，而是处在资本向 AI 应用、机器人、基础设施和工作流自动化大规模再配置的潮流中。同样重要的是反向参照：China Biz Insider 对具身 AI 的现实校验警告，许多现金跑道很短的
              AI 独角兽可能在 2027–2028 年面临整合、估值下调融资或失败。Liblib 已披露 ARR，并拥有蓝筹投资财团，位置好于许多概念阶段同行；但监管 /
              内容安全敞口、公开毛利率指标缺失，都应在估值中明确打折。基于公开记录，超过 US$2 billion 的估值说得通，但它只是一个合理、对证据敏感的入场价，不是明显便宜。因此，投委会的正确姿态不是把本轮简单否定为
              AI 狂热，而是要求证明收入质量强过折价所暗示的水平：经审计的 ARR 桥接、客户队列、贡献毛利和合规控制，才会把立场从合理推向有吸引力。
