  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模区间
        blocks:
          - type: paragraph
            body: >-
              给 Liblib 估值时，不应把每一元娱乐或设计支出都算进去。可投资边界从中国 AIGC
              软件和服务开始，即自动化内容创作；随后收窄到创作者或工作室愿意购买的图像生成平台、视频和动画生成器、模型社区以及工作流工具。公开分析师估计差异很大：IMARC 认为 2025 年中国 AIGC 市场为
              US$5.16B，并以 15.96% 的 CAGR 增长至 2034 年；来源池使用的 Grand View 较低口径则支持约 US$2.36B 的当前市场锚点。区间判断比单一 TAM 更有用，因为 Liblib
              变现的是工作流采用，而不是全部生成式 AI
              基础设施；公司还贴近一个更大的内容支出池——微短剧制作。因此，实用的尽调模型应对齐两条路径：自上而下的分析师市场预测，以及自下而上来自工作室、代理商和企业创意部门的预算份额。第一条路径证明中国 AIGC
              已经足够大；第二条路径决定 Liblib 能拿到多少预算，而不是被云基础设施、基础模型订阅或内部创意劳动力拿走。
