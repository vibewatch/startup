      - number: '3.3'
        title: 护城河耐久性、迁移成本与多平台并用
        blocks:
          - type: paragraph
            body: >-
              当中文社区、模型供给、工作流经验和专业 B 端需求相互增强时，Liblib 的护城河最强。已经依赖 Liblib 托管模型、LoRA 训练、工作流模板和中文审核 /
              合规基础设施的设计师或短剧工作室，比随手试提示词的用户更难迁移。但证据同样支持多平台并用。评论把 Civitai 描述为控制权和模型所有权选项，把 Midjourney 描述为速度与质量选项，也把 SeaArt
              / Tensor / Wujie / AituBo 描述为重叠的直接工具。上述替代品会削弱 Liblib 对每个用例变现的能力，尤其当团队可以用一个平台探索、用另一个平台打磨输出，并为敏感素材保留本地
              Stable Diffusion 流水线。实际尽调问题不是 Liblib 有没有护城河，而是功能快速趋同时，护城河深度是否足以保护抽成率和利润率。因此，在 Liblib
              证明独家素材、更优的中文创作者流动性，或竞争对手难以复制的企业工作流数据之前，应把多平台并用视为默认用户行为。
