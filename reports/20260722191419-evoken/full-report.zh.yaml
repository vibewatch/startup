  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 版图：直接模型社区、全球替代品与中国平台入局者
        blocks:
          - type: paragraph
            body: >-
              Liblib 的竞争集合不是一张简单的图像生成器清单。最接近的直接同行，是能够托管或训练模型、提供 LoRA 式定制，并把创作者留在市场或社区循环里的模型分享与创作社区。本章有来源支撑的包括
              Tensor.Art、SeaArt AI、Wujie AI 和 AituBo；6pen 和 PixAI
              虽然仍在请求范围中被点名，但保留来源文本没有可验证的当前画像，因此未充分展开。全球替代品从两个方向包围同一任务：Civitai 强调开放模型发现和社区控制，Midjourney
              强调专有模型质量和快速输出。中国平台威胁位于两组之上，因为 Baidu、Alibaba、Tencent 和 ByteDance 可以把图像和视频生成打包进电商、游戏、社交和创作者分发场景；Liblib
              必须自己赢得使用，而不是继承流量。
