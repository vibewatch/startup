      - number: '3.2'
        title: 能力与规模对比
        blocks:
          - type: paragraph
            body: >-
              Liblib 的规模指标说明它已经不只是爱好者图像工具：2026 年中报道数据包括累计用户超过 3000 万、原创模型超过 50 万、每天生成图片超过 500 万张，以及 ARR 超过
              US$300M。规模本身支撑其专业工作室叙事，但并不形成能力排他性。SeaArt 拥有文本、图像和视频生成、LoRA 训练、换脸、AI 角色、ComfyUI 和超分辨率。Tensor.Art
              拥有模型托管、在线训练、ComfyUI 工作流和 API 服务。Wujie 增加了国内版权登记路径；AituBo 则攻击新手和低预算人群。最强结论是，Liblib
              的优势在于面向中国的社区、模型和专业需求密度，而不是独有功能清单。简报引用的流量基准在用于定量分析前，需要重新拉取独立流量面板。定价与套餐机制因此重要：即使 Liblib
              的本地供给更强，低价对手仍可能赢得探索性使用，并在创作者围绕其界面形成习惯后再向上销售。
