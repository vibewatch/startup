      - number: '8.3'
        title: 情景分析：如果工作流锁定抵消聚合器风险，估值就能成立
        blocks:
          - type: paragraph
            body: >-
              情景视角指向一个有条件的“合理”价格。悲观情形假设 ARR 停在已披露的 US$300 million 附近，零售端用量仍对补贴敏感，第一方模型厂商压缩转售价差；按 4x ARR，对应估值约 US$1.2
              billion。基准情形假设前瞻 ARR 升至约 US$420 million，但投资者只给 5x 倍数，因为毛利率、NRR 和 API 成本转嫁仍未披露；估值落在约 US$2.1
              billion，能支撑本轮。乐观情形需要证明 LibTV、LiblibAI、Xingliu 和 Lovart 正在变成带工作流锁定的创作者操作系统；如果前瞻 ARR 达到 US$500 million、市场给
              8x，公司可支撑约 US$4 billion。只有私下尽调验证收入质量，这种不对称才有吸引力。
