              最强的财务事实，是 2024 年收入到 2026 年 ARR 的台阶变化。Tencent News 报道 2024 全年收入为 RMB 206M，多篇 2026 年报道则称截至 2026 年 5 月 ARR 为
              US$300M，且同比增长超过 30 倍，也就是超过 3000%。因此，公开故事的重点不是需求是否存在，而是收入结构有多持久。收入似乎来自四条相互连接的流：C 端创作者订阅与积分、专业创作者算力消耗、B 端
              API 或定制化企业服务，以及 LibTV 的生产工作流变现。LibTV 尤其重要，因为它把公司从图像生成兴趣和设计工作流推进到短剧、电影、广告和品牌视频预算。首月单日收入据报超过 US$1M，5
              月收入超过上线首月的 13 倍，服务团队近 1000 个，上述指标指向真实付费意愿。但按收入流确认收入、留存、退款、积分沉淀和企业合同条款仍未公开。
