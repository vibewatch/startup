        title: 身份、结构与商业模式
        blocks:
          - type: paragraph
            body: >-
              本报告应把 Liblib 视为 Evoken 旗下实际运营的 AI 创意平台品牌。Evoken 企业集团在 2026 年 6 月启用现名，此前曾以 Qidian Xingyu / Yanyu Technology
              为人所知。硬身份事实包括：总部在北京、运营公司于 2023 年 5 月成立，旗舰产品 LiblibAI 最初是 AI
              图像生成与模型分享社区。其商业模式不是通用聊天机器人套壳，而是把创作者社区、模型市场、云端生成、LoRA
              训练和付费专业工作流拼在一起。结构之所以关键，是因为后续章节可以围绕一条连贯链路评估市场、产品和估值：社区模型与素材供给生成、视频生产和设计智能体用例。官网仍只能作为公司说法使用，因为它依赖
              JavaScript；这里更耐用的身份基础来自第三方新闻、类似登记信息的 Baike 页面，以及 CAC 备案体系。
