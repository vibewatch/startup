  - id: TV006
    title: 关键估值驱动因素与风险
    columns:
      - 驱动因素 / 风险
      - 证据信号
      - 估值影响
      - 尽调验证
    rows:
      - - ARR 规模
        - 截至 2026 年 5 月 US$300M ARR
        - 支撑当前 >US$2B 估值
        - 核对 ARR 与开票额、收入和队列
      - - 增长速度
        - 据称同比增长 >30x 或 >3,000%
        - 支撑高增长倍数
        - 拆分自然留存、发布峰值和补贴贡献
      - - 工作流锁定
        - 专业内容团队在用 LibTV 和 LiblibAI
        - 可能把倍数推向垂直 AI 区间
        - 验证企业复用和团队级切换成本
      - - 聚合器经济性
        - 没有自研基础模型，依赖第三方 API
        - 把倍数压向公开市场 / 传统 SaaS 区间
        - 审计分产品毛利率和 API 成本合同
      - - 中国 AI 泡沫
        - 2026 上半年 67 家中国独角兽，并出现 2027–2028 年清算式调整的反向预警
        - 抬高降轮和退出窗口风险
        - 对比同队列的烧钱速度、现金跑道和收入质量
      - - 监管 / 内容安全
        - CAC 备案制度和 CCTV 相关内容安全风险
        - 增加合规折价
        - 核验备案、标识控制和整改证据
    notes: 本表把公开证据连到尽调动作；缺失的私有指标会被有意计入估值折价。
