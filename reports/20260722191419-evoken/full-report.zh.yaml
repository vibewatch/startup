              并未把所有训练行为都判定为违法；杭州法院对输入阶段训练相对宽容，把责任重点放在稳定侵权输出、被推广的 LoRA 模型、平台获利、显著性以及未采取预防措施上。因此，Liblib 的模型分享与 LoRA 市场需要强
              IP 审核、投诉通道、模型屏蔽、标识和下架运营。赔偿金额只有 RMB 30,000，但禁令、下架或企业采购封锁会重要得多。
