        - 既有投资人增持或续投
        - 高：中国顶级创投品牌
        - 跟投降低逆向选择担忧
      - - Gaorong Capital
        - 既有投资人增持
        - 中高：早期中国创投支持者
        - 支撑早期轮次延续性
      - - Ant Group
        - 既有投资人增持
        - 战略相关性高
        - 具备金融科技 / 支付 / 云生态邻近性
      - - HT Investment / Times Capital
        - 跟投方
        - 中：后期轮次支持
        - 扩大融资财团，但公开差异化较弱
    notes: 角色来自 2026 年融资报道；确切持股、清算优先权和治理条款未公开。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV041
      - CV042
