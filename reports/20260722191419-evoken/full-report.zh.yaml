            body: >-
              人与治理风险中等但真实。陈冕此前的 CapCut 商业化经验是一项资产，因为公司依赖快速 PMF 判断；但同一证据也让投资命题以创始人为中心。来源包报道的 73.95%
              创始人持股，以及后来的法定代表人变更，不应当作不当行为，而应成为尽调提示：董事会构成、保留事项、关联方控制、信息权和继任规划。实际投资流程应把每项重大风险转化为触发器：CAC 或应用商店再次采取行动、AIGC
