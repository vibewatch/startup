      - number: '2.3'
        title: 细分市场、买方与采用路径
        blocks:
          - type: paragraph
            body: >-
              采用场景分布在专业创作者、工作室买方、企业营销团队和平台生态之间。终端用户可能是设计师、提示词艺术家、制片人、剪辑师或运营团队，但付款方通常是已经为更快内容产出编预算的工作室、代理商、品牌、游戏公司、电商商家或企业部门。IMARC
              的市场分拆确认图像生成平台和视频生成器已是被认可的 AIGC 方案类别；6Wresearch 则显示，中国图像生成受 Baidu、Alibaba、Tencent、ByteDance、SenseTime、Meitu
              及其他大型生态影响。因此，Liblib
              的市场定位需要两层过滤：一是它能否在巨头模型替代品之外，掌握创作者工作流和素材复用；二是它能否把创作者社区转化为短剧、广告、设计和电商工作流中的付费团队。买方旅程还意味着模型层会多平台并用，但素材层粘性更高：团队可能测试多种图像或视频模型，同时保留那个存放已批准模板、生产历史和社区训练模型的平台。
