        - 第三方模型 API 和算力转售决定利差经济性。
        - 缺少产品级贡献毛利时，ARR 质量打折。
        - 按产品、模型家族和用量 cohort 拆分毛利率。
      - - 模型访问和替代
        - 一方供应商可以降价、捆绑应用或限制 API。
        - 工作流锁定必须抵消模型访问商品化。
        - API 条款、排队时长、供应商集中度和调价后流失。
      - - 资本密集度
        - US$300M B+ 轮支持研发、全球扩张和产品组合搭建。
        - 融资降低 runway 风险，但可能掩盖补贴依赖。
        - 月度 burn、云承诺、预付模型点数和回本周期。
      - - 尚未盈利
        - AIbase 报道，Series B 阶段尚未实现盈利。
        - 增长可能依靠风险资本，而非自我造血。
        - EBITDA、现金 runway、CAC 回收期和按用量计的单位经济。
      - - 企业采购风险
        - 已披露客户增强证明力，也抬高审计预期。
        - 合规失误可能拖慢 B 端采用。
        - 安全 / 法务问卷、被拒采购次数和续约数据。
      - - 创始人集中
        - 创始人驱动的速度是产品扩张核心。
        - 执行上行空间伴随继任和控制风险。
        - 董事会纪要、授权地图、关键人保险和继任计划。
