              建设性的技术论点是，Liblib 已积累本地化中文创作者生态：创作者上传、训练并分享 LoRA 模型和工作流，普通用户无需拥有 GPU
              或掌握本地工具，也能复用社区资源。本地化生态可能比单一提示词界面更有防御力，因为社区素材、风格库、工作流模板和生产习惯会制造迁移成本。负面论点同样重要。China Biz Insider 报道称，Evoken
              不开发专有基础模型，LibTV 使用第三方模型 API，包括通过 Volcano Engine 接入 Seedance 2.0。如果模型所有者降低直销价格、限制访问，或打包第一方工作流应用，Evoken
              的毛利率和差异化可能很快承压。合规也是产品风险：CAC 备案背景和报道中的 CCTV 内容安全事件说明，审核与标识不是事后补丁。承销结论是：公司具备牵引力很强的工作流应用护城河，但需要对模型合同、安全整改、API
              控制和按产品线拆分的贡献利润率做私有尽调。
