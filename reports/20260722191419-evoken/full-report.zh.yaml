  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 融资跑道充足，但资本已经成为护城河的一部分
        blocks:
          - type: paragraph
            body: >-
              从财务上看，Evoken 已不再是资金不足的 AI 艺术社区，而是资本市场按品类领导者支持的后期应用层公司。本章需要的本地融资事实很清楚：2023 年小额天使轮、2024 年和 2025 年初一组融资、2025
              年 10 月 US$130M Series B，以及 2026 年 6 月约 US$300M、投后估值超过 US$2B 的 Series B+。关键承销点不只是时间顺序，而是融资史说明了资本充足性。管理层称 B+
              募资将用于研发、全球扩张、AI 创意产品能力和产品组合建设。在一个算力、模型 API 转售、创作者补贴和买量都可能快速吞掉自生现金的市场里，B+ 资金给 Evoken
              提供了短期生存缓冲。股东结构同样重要：Granite Asia、Tencent、Shunwei、HSG、Gaorong、Ant、CMC、Source Code、Mingshi、Yingce、INCE 和
              Lenovo 系资本带来少见的广泛战略与财务资源，而陈冕被报道的控股地位则让创始人激励高度集中。
