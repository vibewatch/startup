            body: >-
              按表面数学，Evoken 相对全球 AI 创意同行并不贵：US$2B 估值对应 US$300M ARR，约为 6.7 倍 ARR。6.7 倍低于 Canva 约 10.5 倍至 16 倍 ARR
              的参考区间，也低于 Sacra 对 Gamma 约 20.6 倍的例子。Midjourney 据报 US$500M 收入和 US$10B 估值，隐含更高的创意 AI 标尺。折价是合理的，因为 Liblib
              尚未证明自己掌握毛利率栈。China Biz Insider 的负面解读很核心：Evoken 不训练自有基础模型，每次生成任务都依赖第三方模型提供商，因此公司经济性是零售价与批发模型 API
              或算力成本之间的价差。最好的上行情形，是社区素材、工作流和 B 端生产集成创造足够锁定，让公司拿到量价折扣并守住价差。下行情形则是第一方模型厂商降价、打包工作流，或迫使 Liblib 补贴用量来守份额。
