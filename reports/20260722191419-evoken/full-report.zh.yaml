  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 头部估值：融资规模大，但 ARR 倍数不高
        blocks:
          - type: paragraph
            body: >-
              按公开 ARR 证据归一化后，Evoken 2026 年 6 月融资看起来金额很大，但并不明显虚高。多篇独立报道共同指向约 US$300M 的 Series B+ 融资、超过 US$2B 的投后估值，以及
              2026 年 5 月约 US$300M 的 ARR。头部轮次因此约为 6.7 倍 ARR，尚未调整账上现金或未公开的优先股条款。一家成立两年的 AI 应用集团，拥有 3000 万+ 用户、50
              万原创模型，以及据报支撑收入的专业内容预算，价格反而相当克制。因此，承销问题不是投资人是否支付了典型 AI 泡沫倍数；而是报告中的 ARR
              在扣除第三方模型和算力成本后，是否具备经常性、留存和正毛利。估值框架也让公司更容易与传统 SaaS 比较：如果把 >US$2B 视作企业价值下限，那么除非真实投后估值远高于披露，否则 US$2B
              以上每多一美元，只会温和推高倍数。
