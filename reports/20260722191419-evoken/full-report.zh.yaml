      - number: '8.2'
        title: 基准让 6.7 倍显得便宜，但不是每一美元 AI 收入都该享受溢价
        blocks:
          - type: paragraph
            body: >-
              外部基准支持公允偏建设性的估值立场。2026 年 SaaS 来源显示，公共云平均倍数接近中个位数，传统 SaaS 约为 4 倍至 7 倍 ARR，更高增长的 AI-native 或垂直 AI
              软件则高得多。在上述背景下，Liblib 的 6.7 倍 ARR 倍数低于 AI-native 头部四分位，更接近重置时代的公开 SaaS。创意 AI 可比公司进一步凸显估值折价：Canva 的 US$4B
              ARR 支撑 US$42B 至 US$65B 估值区间，Midjourney 看起来接近 20 倍收入倍数，Sacra 的 Gamma 数据点也高于 20 倍 ARR。折价是合逻辑的，不是惩罚性折价。Liblib
              增长罕见，但公开证据尚未证明专有模型经济性、企业留存，或足以比肩最佳全球 AI 创意平台的持久工作流护城河。
