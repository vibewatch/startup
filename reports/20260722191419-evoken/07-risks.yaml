    "number": 7,
    "title": "Risks",
    "summary": "Liblib's top diligence risks are regulatory continuity, copyright liability in LoRA/model-sharing workflows, content-safety enforcement after the 2026 CCTV moderation-bypass report, and aggregator economics tied to third-party model access. The company has real filing evidence and scale, but the investment case depends on proving durable compliance operations and product-level gross margin."
  },
  "sections": [
    {
      "id": "regulatory-baseline-and-filing",
      "title": "China's AIGC regime is now an operating system, not a launch checklist",
      "body": "Liblib's first risk layer is regulatory continuity. China now regulates public-facing generative AI through a stack of instruments rather than a single statute: the January 2023 Deep Synthesis Provisions, the August 2023 Interim Measures for Generative AI Services, filing and registration registries administered through CAC and local cyberspace offices, and the September 2025 AIGC labeling Measures plus GB 45438-2025. For Liblib, this stack maps directly to image, video, LoRA training, downloads, user uploads, and distribution workflows. The favorable fact is that 36Kr reports Liblib cleared the deep-synthesis algorithm filing in February 2024 and became the first AI-community platform to complete generative-AI-service filing in March 2024. The adverse underwriting point is that filings are necessary but not sufficient: labeling files, metadata, user declarations, incident response, minors protection, and periodic registry visibility must keep pace with product expansion into LibTV, Xingliu, Lovart, and cross-border workflows.",
