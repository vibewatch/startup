    {
      "id": "business-model-and-dependency-risks",
      "title": "Aggregator economics are investable only if workflow lock-in outruns model commoditization",
      "body": "Evoken's business risk is not demand: public sources cite more than 30 million users, 500,000 original models, and US$300 million ARR by May 2026. The issue is whether those users and workflows create enough margin control. China Biz Insider's adverse framing is central: Evoken does not own proprietary foundation models and depends on third-party APIs, model providers, and cloud or compute economics. That exposes the company to repricing, degraded access, first-party bundling, and direct substitution if model vendors enter the workflow layer. LibTV's growth after Jimeng pricing changes shows Evoken can arbitrage user pain quickly, but it also makes queue times and API cost schedules thesis variables. Not-yet-profitable status and a large B+ round imply that capital is still part of the competitive apparatus. The core diligence ask is product-level gross margin by model family, not just ARR, because a model reseller can grow revenue while destroying contribution margin.",
