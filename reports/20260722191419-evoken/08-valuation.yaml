    {
      "id": "scenario-and-risk-adjusted-view",
      "title": "Scenario analysis: valuation is justified if workflow lock-in offsets aggregator risk",
      "body": "A scenario view points to a conditional “fair” price. The bear case assumes ARR stalls near the disclosed US$300 million level, retail usage remains subsidy-sensitive, and first-party model vendors compress the resale spread; at 4x ARR the implied value is roughly US$1.2 billion. The base case assumes forward ARR rises to about US$420 million while investors apply only a 5x multiple because gross margin, NRR, and API-cost pass-through are still undisclosed; that lands near US$2.1 billion and supports the current round. The bull case requires evidence that LibTV, LiblibAI, Xingliu, and Lovart are becoming a creator operating system with workflow lock-in; if forward ARR reaches US$500 million and the market pays 8x, the company could support about US$4 billion. The asymmetry is attractive only if private diligence validates revenue quality.",
