    {
      "id": "gtm-monetization-and-expansion",
      "title": "Go-to-market: freemium activation into credits, subscriptions and enterprise/API spend",
      "body": "The observable go-to-market motion starts with low-friction community creation rather than top-down enterprise sales. Free daily generations, creator incentives and model browsing bring users into the ecosystem; high-volume usage, priority GPU access, training and professional features convert into subscriptions or credits; API and customized enterprise needs move B-side customers into higher-value contracts. This explains why the same company can show both creator-community metrics and US$300 million ARR: the creator base supplies content, workflows, models and distribution, while professional producers and enterprises supply willingness to pay. Expansion depends on cross-product loops. A creator or studio can begin with image models on LiblibAI, move into video workflows on LibTV, and later buy API or custom services. The diligence question is how much of that loop is recurring and defensible versus subsidy-driven, especially because API setup friction and third-party model alternatives can encourage multi-homing.",
      "claimRefs": [
        "CU019",
