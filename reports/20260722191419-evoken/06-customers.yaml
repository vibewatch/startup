  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Liblib's customer evidence combines large C-side creator liquidity with sample B-side logos and stronger LibTV studio adoption signals. The core diligence risk is not whether demand exists, but whether paid retention, enterprise concentration and reputational risk are durable enough to support the ARR base."
  },
  "sections": [
    {
      "id": "customer-base-and-segments",
      "title": "Customer base: a mass creator community feeding B-side workflows",
      "body": "Liblib's customer base should be underwritten as a dual-market system rather than a pure SaaS account list. On the C side, public reports cite more than 30 million cumulative users by mid-2026, 25 million total users and about 4 million MAU in late 2025, more than 20 million AI creators, more than 500,000 original models, and more than 5 million images generated per day. That creates a large supply side of prompt users, LoRA trainers, designers, illustrators, self-media creators and professional visual workers. On the B side, the verified public proof is narrower but strategically important: Jiemian says LiblibAI provides professional AI-image scenario solutions to Kingsoft Office/WPS, Wondershare, G-bits Games, Tmall Campus and Tsinghua University. The strongest segment lens is therefore C-side creators for liquidity and data, professional creators for subscriptions and credits, and B-side studios or enterprises for API, customized services and higher-value workflow spend.",
