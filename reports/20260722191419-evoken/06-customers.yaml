    {
      "id": "proof-of-adoption-and-vertical-demand",
      "title": "Named logos are real, but LibTV and vertical budgets are stronger adoption signals",
      "body": "The named customer list matters because it satisfies a customer-proof standard, but it does not by itself prove recurring production deployment or outcome specificity. The more compelling B-side evidence comes from vertical budgets around games, short drama, film and advertising. LibTV reportedly moved from launch to more than US$1 million of single-day revenue in its first month, May revenue more than 13 times first-month revenue, more than 300 short-film and film companies integrated within a month, and nearly 1,000 agencies, production houses and brand clients served. Gaming adds a second large budget pool: miHoYo's RMB100 billion AI commitment, NetEase and Tencent AI production pipelines, and broad generative-AI adoption by Chinese game developers all support the thesis that art, asset, NPC and UGC workflows are becoming procurement priorities. These facts imply real demand, while leaving contract size, production status and logo-by-logo outcomes private.",
