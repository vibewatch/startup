    {
      "id": "durability-risks-and-diligence-asks",
      "title": "Durability remains unproven: retention, concentration and reputational risk are the gaps",
      "body": "The customer chapter's constructive conclusion is that demand exists; its caution is that public retention proof does not. No retained source discloses NRR, GRR, churn, renewal rates, contract length, top-customer share, enterprise pipeline conversion or satisfaction. Daily image generation, creator incentives, model supply and LibTV team adoption are useful repeat-usage proxies, but they are not cohort retention. Demand-side risk is also not theoretical. Tech Times reports an industrial-scale AI short-drama boom with 470 AI-produced titles per day, a content glut, real worker displacement, canceled writing projects and unauthorized likeness concerns. That creates two possible demand paths: more studios buy AI tools to compete on volume, or brands and institutions slow adoption because AI content becomes reputationally sensitive. Investment diligence should therefore obtain cohort retention by segment, enterprise revenue concentration, contract renewal data, API/private-deployment terms, and brand-safety procurement objections before treating Liblib's customer base as durable. The practical test is whether usage survives after free compute, creator rewards and launch publicity normalize. Without that evidence, ARR should be treated as strong demand proof but not yet as proof of low-churn customer durability.",
