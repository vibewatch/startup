  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "Evoken’s product stack is a workflow-heavy AI creative platform spanning LiblibAI, LibTV, Xingliu, and Lovart. The technology moat is localized creator assets, LoRA/model marketplace depth, and ComfyUI-style workflow orchestration, while the central adverse risk is dependence on third-party foundation-model APIs rather than owned base models."
  },
  "sections": [
    {
      "id": "product-portfolio",
      "title": "Portfolio has expanded from image community to creator operating system",
      "body": "Evoken should be evaluated as a multi-product creative workflow company, not only as an AI image website. The flagship LiblibAI surface remains the core traffic and asset layer: public reports cite more than 30 million cumulative users, more than 500,000 original models, and more than 5 million images generated per day. LiblibAI 2.0 then reframes that community as a professional creation studio by adding integrated image and video generation, top video models, effects templates, and a broader open-plus-closed model menu. The adjacent products extend that same asset base into new budgets: LibTV targets video and short-drama teams, Xingliu targets domestic design-agent workflows, and Lovart carries the design-agent thesis internationally. The portfolio logic is therefore sequential: creator community creates assets, studio workflows raise frequency, and agents/video products monetize professional production use cases. This matters for diligence because the product promise is only durable if these workflow surfaces convert into repeated paid jobs, not one-time experiments subsidized by promotional compute or temporarily cheap upstream model access.",
