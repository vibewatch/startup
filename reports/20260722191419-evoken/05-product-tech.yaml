    {
      "id": "developer-api-integrations",
      "title": "Developer surface exists, but integration evidence is thinner than product traction",
      "body": "Developer-signal sources indicate that LiblibAI can be treated as a programmatic generation surface, but public evidence is not yet equivalent to a mature enterprise API program with transparent pricing, SLAs, SDKs, and security documentation. GPTProto describes a LiblibAI API ecosystem that exposes text-to-image, image-to-image, ControlNet, ADetailer, LoRA training, ComfyUI online, and complex node workflows. Runflow’s ComfyUI guide shows the pattern such a backend usually follows: clients submit workflow JSON to /prompt, watch execution through WebSocket or history endpoints, upload inputs, and retrieve generated files. This is useful for studios that need repeatable production pipelines, but the diligence gap is real. Public sources do not show Evoken’s API rate limits, customer authentication model, data-retention policy, uptime history, or model-provider pass-through terms; those private controls determine whether developer access is a scalable product line or merely an advanced user convenience.",
      "claimRefs": [
