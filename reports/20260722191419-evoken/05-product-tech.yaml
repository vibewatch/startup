    {
      "id": "architecture-workflows",
      "title": "The technical center is workflow depth around diffusion, LoRA, and ComfyUI-style graphs",
      "body": "The strongest public technical evidence points to an application stack assembled around established diffusion models and workflow orchestration rather than a proprietary foundation model. At the model layer, retained technical sources cover Stable Diffusion, SDXL, Stable Diffusion 3.5, FLUX.1, ControlNet, image-to-image, and LoRA. At the workflow layer, ComfyUI matters because it turns generation into an explicit node graph: checkpoint load, prompt encoding, sampling, VAE decode, post-processing, and custom nodes can be swapped, versioned, and submitted through an API. That architecture maps well to LiblibAI’s public positioning as a model marketplace and creation studio; creators can use specialized Chinese-style model assets, combine base checkpoints with LoRA adapters, and package repeatable workflows. The evidence supports workflow sophistication, but it does not prove ownership of the underlying base models or differentiated inference infrastructure. Those details define practical technical leverage.",
