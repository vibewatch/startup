evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: leadership
    missingEvidence: Full board roster, officer appointments, and post-Series B+ governance documents.
    whyItMatters: >-
      The leadership table is limited to named public executives and legal representatives, which leaves governance
      control and investor rights opaque.
    diligencePath: Request corporate registry extracts, financing documents, and company-provided board / officer schedule.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: investors
    missingEvidence: Complete capitalization table with ownership percentages, option pool, secondary components, and investor rights.
    whyItMatters: >-
      The investor roster captures public names but cannot quantify control, liquidation preference, or economic
      ownership.
    diligencePath: Ask management or lead investors for the post-Series B+ cap table and financing term sheet.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: Exact closing dates and definitive documents for month-only 2024 and early-2025 financing milestones.
    whyItMatters: >-
      The milestone table is the chronology of record; month-only events are enough for overview but not for legal
      diligence.
    diligencePath: Reconcile public announcements against工商 filings, investor releases, and management-provided financing ledgers.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: profitability
    missingEvidence: Audited or management financials showing gross margin, EBITDA, cash burn, retention, and payback.
    whyItMatters: >-
      ARR is strong, but the company was reported not yet profitable in 2025 and infrastructure/model costs may pressure
      margins.
    diligencePath: Request monthly P&L, revenue cohort, GPU/model cost, and customer-retention schedules for 2024-2026.
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, voting thresholds, founder vesting, and investor protective provisions after the B+ round.
    whyItMatters: Founder control and legal-representative changes are visible, but investor governance rights are not public.
    diligencePath: Review amended charter, shareholders agreement, and board consents from the Series B and B+ rounds.
  - type: private-evidence-only
    severity: material
    topic: SAM to SOM bridge
    missingEvidence: Liblib paid customer count, revenue by vertical, cohort retention, and gross margin by image/video workflow.
    whyItMatters: >-
      These data determine how much of the micro-drama and AIGC market can convert into durable recurring software
      revenue.
    diligencePath: Request management KPI export by product line and vertical for 2025-2026, reconciled to billing records.
    relatedQuestionRefs:
      - QM023
  - type: conflicting-data
    severity: minor
    topic: AIGC sizing range
    missingEvidence: Comparable methodology notes for IMARC, Grand View Research, and 6Wresearch China AIGC market definitions.
    whyItMatters: >-
      The public estimates mix software, services, content workflows, and broad AIGC definitions, so the table keeps
      ranges rather than one false-precision TAM.
    diligencePath: Obtain paid analyst databooks or ask management for a buyer-budget bottom-up model.
    relatedQuestionRefs:
      - QM022
  - type: missing-source
    severity: material
    topic: segment share
    missingEvidence: Independent source splitting China AI image generation and AI video workflow revenue by buyer vertical.
    whyItMatters: Without segment shares, Liblib's exact SAM within professional creative workflows remains bounded by proxies.
    diligencePath: Interview studios/agencies and triangulate credit/API spend from Liblib invoices or third-party procurement data.
    relatedQuestionRefs:
      - QM013
      - QM023
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: 6pen and PixAI evidence gap
    missingEvidence: >-
      Current official or independent source profiles for 6pen and PixAI covering origin, launch, scale, features, and
      pricing.
    whyItMatters: >-
      Both names are in the requested direct-competitor scope; unsupported scoring would overstate certainty in the
      feature matrix.
    diligencePath: >-
      Run fresh 2026 Chinese and English searches for 6pen and PixAI official pages, app-store listings, traffic panels,
      and independent reviews before final underwriting.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: traffic benchmark refresh
    missingEvidence: >-
      A citable 2026 web-traffic panel showing Civitai monthly visits, Liblib monthly visits, and Liblib China traffic
      share.
    whyItMatters: >-
      Traffic comparisons affect judgments about global peer scale and whether Liblib is primarily a China-local or
      global platform.
    diligencePath: >-
      Pull Similarweb/Semrush or equivalent 2026 traffic panels and reconcile domains, mobile-app usage, and China
      access effects.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: switching cost and multi-homing
    missingEvidence: Customer-level retention, multi-platform usage, model-upload cohorts, and paid conversion by creator segment.
    whyItMatters: >-
      Public features show overlap; private usage data is needed to decide whether Liblib has durable lock-in or only
      temporary scale.
    diligencePath: >-
      Request anonymized cohort dashboards, top-customer interviews, model marketplace GMV or creator payout data, and
      churn reasons by vertical.
    relatedQuestionRefs:
      - QP015
      - QP016
  - type: conflicting-data
    severity: minor
    topic: pricing and licensing clarity
    missingEvidence: >-
      Current in-app pricing, credit math, and commercial-rights terms for SeaArt, Tensor.Art, AituBo, and Liblib paid
      tiers.
    whyItMatters: >-
      Pricing comparisons in public reviews can become stale quickly and licensing ambiguity affects professional
      adoption.
    diligencePath: >-
      Create test accounts, capture current plan pages, and obtain written support confirmation for commercial-use terms
      on each platform.
    relatedQuestionRefs:
      - QP008
      - QP019
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: >-
      Gross margin, wholesale model-API price schedules, cloud commitments, and contribution margin by LiblibAI, LibTV,
      Xingliu, and Lovart.
    whyItMatters: >-
      The investment case turns on whether US$300 million ARR converts into defensible gross profit or merely subsidized
      model resale volume.
    diligencePath: >-
      Request monthly P&L by product, vendor invoices, committed-use discounts, credit liability schedules, and
      cohort-level contribution margin from management.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI003
      - TI004
  - type: private-evidence-only
    severity: material
    topic: capital adequacy
    missingEvidence: Post-B+ cash balance, monthly burn, debt or cloud prepayment obligations, and runway in months.
    whyItMatters: >-
      The B+ round is large, but high compute and traffic costs can still create financing dependency if gross margin is
      thin.
    diligencePath: >-
      Obtain bank statements, board budget, vendor commitments, debt schedules, and the 24-month operating plan approved
      after the June 2026 financing.
    relatedQuestionRefs:
      - QI025
    relatedTableRefs:
      - TI001
      - TI005
  - type: missing-source
    severity: minor
    topic: revenue mix
    missingEvidence: >-
      Audited or management-certified split of ARR among subscriptions, credits, API, enterprise, LibTV, Xingliu, and
      Lovart.
    whyItMatters: >-
      Revenue quality differs sharply between recurring enterprise contracts, usage credits, subsidized video
      generation, and overseas PLG subscription ARR.
    diligencePath: >-
      Ask management for ARR bridge, recognized revenue policy, deferred revenue, churn, expansion, refunds, and
      credit-breakage schedule by product.
    relatedQuestionRefs:
      - QI007
      - QI008
      - QI009
      - QI010
    relatedTableRefs:
      - TI002
      - TI003
  - type: missing-source
    severity: minor
    topic: cap-table terms
    missingEvidence: >-
      Fully diluted ownership, liquidation preferences, option pool, pro-rata rights, board seats, and strategic
      commercial side letters.
    whyItMatters: >-
      The headline investor roster is strong, but financing terms determine common-equity upside and potential strategic
      constraints.
    diligencePath: >-
      Review the post-B+ cap table, financing documents, investor rights agreement, and any Tencent or cloud-provider
      commercial agreements.
    relatedQuestionRefs:
      - QI014
      - QI015
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: material
    topic: model-provider contracts
    missingEvidence: Executed agreements or pricing schedules for Seedance, image/video model APIs, and cloud GPU providers.
    whyItMatters: >-
      Wholesale access, volume discounts, and termination rights determine whether the aggregator model can preserve
      margin.
    diligencePath: >-
      Request provider contracts, minimum commitments, overage rates, termination clauses, and last-three-month usage
      invoices.
  - type: missing-source
    severity: material
    topic: API reliability and security
    missingEvidence: >-
      Public SLA, status history, authentication architecture, rate limits, data-retention policy, and enterprise
      security documentation.
    whyItMatters: >-
      Developer-signal shows programmatic workflows, but enterprise customers need reliability and data controls before
      production integration.
    diligencePath: Ask for API docs, security whitepaper, uptime logs, incident reports, and two customer integration references.
  - type: missing-source
    severity: material
    topic: content-safety remediation
    missingEvidence: Technical postmortem and remediation evidence for the CCTV-reported inappropriate-content bypass.
    whyItMatters: >-
      AIGC compliance failures can affect product availability, enterprise procurement, and regulatory standing in
      China.
    diligencePath: >-
      Request moderation architecture, red-team results, labeling workflow, regulator correspondence, and
      post-remediation false-negative metrics.
  - type: private-evidence-only
    severity: material
    topic: product-level contribution margin
    missingEvidence: Gross margin by LiblibAI, LibTV, Xingliu, Lovart, and API usage after third-party model costs.
    whyItMatters: The core adverse question is whether workflow lock-in offsets third-party foundation-model COGS.
    diligencePath: Request cohort-level revenue, model/API COGS, cloud spend, creator subsidies, and margin bridges by product.
  - type: enumeration-incomplete
    severity: material
    topic: named-customers
    missingEvidence: >-
      Complete B-side customer roster with deployment status, paid contract value, renewal dates and named outcomes for
      each logo.
