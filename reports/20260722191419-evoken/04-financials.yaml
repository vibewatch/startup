    {
      "id": "diligence-verdict",
      "title": "Financial verdict: real PMF, unproven contribution margin",
      "body": "The financial verdict is constructive but conditional. Liblib has the rare application-layer combination of public ARR scale, recent growth, multi-product expansion, and a blue-chip investor syndicate; these are not vanity signals if the professional-content budget evidence holds. The B+ round should cover near-term product and global expansion needs, and the comparatively low ARR multiple leaves room for upside if Evoken proves that it is becoming a creator operating system rather than a thin model reseller. The unresolved diligence items are also large enough to determine the investment case. Buyers need actual gross margin by product, wholesale model-API price schedules, cloud commitments, cohort retention, enterprise revenue share, credit liability, monthly burn, post-money cash, and runway. Regulatory continuity belongs in the financial chapter because CAC filing status and content-compliance failures can change availability, payment conversion, and enterprise procurement. Until those private inputs are verified, the chapter should underwrite revenue quality as strong, margin quality as unproven, and financing dependency as improved but still strategically important.",
