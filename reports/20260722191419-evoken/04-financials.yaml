      "id": "revenue-scale-and-model",
      "title": "ARR scale is exceptional; recognized revenue and revenue mix remain thinner disclosures",
      "body": "The strongest financial fact is the step-change from 2024 revenue to 2026 ARR. Tencent News reports 2024 full-year revenue of RMB206 million, while multiple 2026 reports cite US$300 million of ARR as of May 2026 and more than 30 times, or more than 3,000%, year-over-year growth. The public story is therefore less about whether demand exists and more about how durable the mix is. Revenue appears to come from four linked streams: C-side creator subscriptions and credits, professional creator compute consumption, B-side API or customized enterprise services, and LibTV's production-workflow monetization. LibTV is particularly important because it moved the company from image-generation hobby and design workflows into short-drama, film, advertising, and brand-video budgets. Reported first-month single-day revenue above US$1 million, May revenue more than 13 times the launch-month level, and nearly 1,000 served teams suggest real willingness to pay. But revenue recognition by stream, retention, refunds, credit breakage, and enterprise contract terms remain private.",
