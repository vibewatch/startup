  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "Evoken's financial story is unusually strong for a young AI application company: public reports cite US$300 million ARR by May 2026 and a June 2026 US$300 million Series B+ at more than US$2 billion. The diligence hinge is not demand, but whether a third-party-model aggregator can convert that ARR into durable gross margin before subsidies and foundation-model competition compress the spread."
  },
  "sections": [
    {
      "id": "funding-capital-adequacy",
      "title": "Funding runway is abundant, but capital has become part of the moat",
      "body": "Financially, Evoken is no longer an undercapitalized AI-art community; it is a late-stage application-layer company being funded as a category leader. The local funding facts needed for this chapter are straightforward: a small 2023 angel round, a cluster of 2024 and early-2025 rounds, a US$130 million Series B in October 2025, and a June 2026 Series B+ of roughly US$300 million at more than US$2 billion post-money. The important underwriting point is not simply the chronology, but what it says about capital adequacy. Management says the B+ proceeds will fund R&D, global expansion, AI creative product capability, and portfolio build-out. That gives Evoken a near-term survival buffer in a market where compute, model-API resale, creator subsidies, and paid traffic can quickly overwhelm self-generated cash. The cap table also matters: Granite Asia, Tencent, Shunwei, HSG, Gaorong, Ant, CMC, Source Code, Mingshi, Yingce, INCE, and Lenovo-related capital create unusually broad strategic and financial access, while Chen Mian's reported controlling stake keeps founder incentives concentrated.",
