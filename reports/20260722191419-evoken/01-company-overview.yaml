    {
      "id": "traction-products-adverse",
      "title": "Scale, product portfolio, and adverse flags",
      "body": "The headline operating metrics are strong enough to justify unicorn-level attention but must be read with caveats. The canonical current metrics are more than 30 million cumulative LiblibAI users, more than 500,000 original models, more than 5 million images generated per day, and ARR above US$300 million as of May 2026. Earlier markers included roughly 25 million users, 4 million MAU, and RMB 206 million of 2024 revenue, which helps reconcile why the 2026 ARR step-up is a major acceleration rather than a trivial restatement. The product portfolio now spans LiblibAI for community/model assets, LibTV for video production, Xingliu for domestic design-agent workflows, and Lovart as an overseas design-agent experiment. Two diligence negatives belong in chapter 1, not buried later: CCTV named LiblibAI in a porn-generation loophole exposé, and 2025 reporting said the company had not yet turned profitable. Both risks are compatible with fast growth; neither should be ignored. materially. This matters.",
