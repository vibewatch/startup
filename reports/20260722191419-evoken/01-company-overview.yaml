    {
      "id": "founder-leadership",
      "title": "Founder, leadership, and governance signals",
      "body": "The founder story is unusually central to the investment case. Chen Mian is repeatedly framed as a product and commercialization founder, with prior responsibility for ByteDance's Jianying / CapCut global commercialization and a public narrative around speed, PMF discipline, and professional creator workflows. That background fits LiblibAI's motion: professional image and video creators are asked to pay for production infrastructure, not simply try a novelty model. The concentration risk is also real. Public materials point to Chen as controlling shareholder at roughly 73.95%, while Zhang Zijie appears in early legal-representative and core product-community disclosures and Yang Nan became legal representative in November 2025. The disclosed team bench is impressive but still high level: elite Chinese and overseas universities plus Tencent, Alibaba, and ByteDance backgrounds. Board composition, protective provisions, and post-Series B+ governance are not public, so the report should preserve founder dependence rather than infer institutionalized governance.",
      "claimRefs": [
        "CO007",
        "CO008",
        "CO009",
        "CO010",
        "CO011",
        "CO012"
      ],
      "tableRefs": [
        "TO002"
      ]
    },
    {
      "id": "capitalization-investors",
      "title": "Funding chronology and investor base",
      "body": "Evoken's financing history is the core timeline of record for the whole report. The company appears to have moved from a US$3.5 million angel round at about a US$15 million valuation in 2023 to multiple 2024 rounds that validated the AI-image community, then to several-hundred-million-RMB financing in early 2025. The October 2025 US$130 million Series B created a public application-layer financing benchmark in China and brought HSG / Sequoia China, CMC Capital, Ant, Lenovo Capital, Shunwei, Source Code, Mingshi, Yingce, and INCE into the story. The June 2026 Series B+ is the step-change: roughly US$300 million at more than US$2 billion post-money, led by Granite Asia, Tencent, and Shunwei, with HT Investment, Times Capital, Gaorong, Ant, and HSG / Sequoia China also cited. The investor map therefore mixes financial venture capital, strategic technology capital, and repeat insiders, while the stated use of proceeds keeps the focus on R&D, global expansion, and product portfolio build-out.",
