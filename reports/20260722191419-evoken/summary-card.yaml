  topStrengths:
    - >-
      Explosive monetization: ARR reached ~US$300M by May 2026, reported up more than 30x year-over-year, anchored by
      professional B-side content producers in short-drama, film and advertising.
    - >-
      Category leadership in China's AI image-creation community with 30M+ cumulative users, 500,000+ original models
      and 5M+ images generated per day.
    - >-
      Blue-chip, strategically aligned investor syndicate (Granite Asia, Tencent, Shunwei, Sequoia China, Ant Group)
      providing capital, distribution and cloud/model access.
    - >-
      Rapid product expansion beyond images into AI video (LibTV) and design agents (Xingliu, Lovart), riding China's
      >RMB120B micro-drama demand pool.
  topRisks:
    - >-
      Content-safety and regulatory exposure: state broadcaster CCTV exposed a moderation-bypass loophole enabling
      pornographic generation, against a tightening CAC / AIGC-labeling regime (GB 45438-2025).
    - >-
      Copyright / IP liability: Chinese courts (Ultraman v. Acgnai) have held generative-AI platforms contributorily
      liable for infringing user-trained models and outputs.
    - >-
      Aggregator / 'wrapper' margin risk: Evoken trains no proprietary foundation model and depends on third-party model
      APIs (e.g. ByteDance Seedance), pressuring margins and defensibility; the company is not yet profitable.
    - >-
      Valuation rests on unaudited, company-disclosed ARR and >30x growth; a China AI-unicorn froth/reckoning could
      compress multiples.
  unresolvedGaps:
    - 'No audited financials: gross margin, net revenue retention, burn rate and cash runway are undisclosed.'
    - >-
      Split of ARR between C-side subscriptions and B-side API/enterprise, and customer concentration, are not
      quantified.
    - Durability of >30x ARR growth and LibTV's economics (reliant on third-party video-model APIs) are unproven.
    - Current headcount and organizational scale after rapid 2025–2026 expansion are not disclosed.
