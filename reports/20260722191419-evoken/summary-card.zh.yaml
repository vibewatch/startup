  topStrengths:
    - 变现爆发：ARR 到 2026 年 5 月约达 US$300M，据报道同比增长超过 30x，由短剧、影视和广告里的专业 B 端内容生产者支撑。
    - 在中国 AI 图像创作社区具备品类领导地位，累计用户 30M+、原创模型 500,000+，每天生成图像 5M+。
    - 投资人阵容强且战略协同度高：Granite Asia、Tencent、Shunwei、Sequoia China、Ant Group 带来资本、分发和云 / 模型入口。
    - 产品从图像快速扩到 AI 视频（LibTV）和设计智能体（Xingliu、Lovart），踩中中国 >RMB120B 微短剧需求池。
  topRisks:
    - 内容安全和监管暴露大：CCTV 披露了可绕过审核、生成色情内容的漏洞，而 CAC / AIGC 标识制度（GB 45438-2025）正在收紧。
    - 版权 / IP 责任：Ultraman v. Acgnai 等中国法院案例已认定生成式 AI 平台要对侵权用户训练模型和输出承担帮助侵权责任。
    - 聚合器 /「套壳」毛利风险：Evoken 不训练自有基础模型，依赖第三方模型 API（如 ByteDance Seedance），利润率和防御性受压；公司尚未盈利。
    - 估值建立在未经审计、公司披露的 ARR 和 >30x 增长上；中国 AI 独角兽泡沫若退潮，倍数可能被压缩。
  unresolvedGaps:
    - 未见经审计财务：毛利率、净收入留存、烧钱速度和现金跑道均未披露。
    - ARR 在 C 端订阅与 B 端 API / 企业之间的拆分，以及客户集中度，未被量化。
    - '>30x ARR 增长的持续性和 LibTV 经济性（依赖第三方视频模型 API）尚未验证。'
    - 2025–2026 快速扩张后的当前员工数和组织规模未披露。
