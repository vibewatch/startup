callouts:
- calloutType: insight
  title: Shlomo Kramer's Track Record Is the Most Underappreciated Valuation Input
  body: "Shlomo Kramer's exit track record as co-founder of Check Point Software (CHKP, market\ncap $18B+) and Imperva (acquired\
    \ by Thoma Bravo in 2019 for $2.1B) represents a\nqualitative premium that is difficult to price but historically has\
    \ delivered significant\nenterprise security exit multiples. At Check Point, Kramer helped build the world's\nlargest\
    \ standalone firewall company. At Imperva, he built a web application security\nleader acquired at approximately 8x ARR\
    \ \u2014 below current Cato's multiple, but during a\nweaker market. Kramer's demonstrated ability to attract top institutional\
    \ investors\n(Lightspeed, Morgan Stanley, Accel, Goldman Sachs), build enterprise sales organizations,\nand execute large-scale\
    \ enterprise deals provides a confidence premium that partially\njustifies Cato's premium multiple. Investors who discounted\
    \ similar founder-quality\npremiums at Snowflake, Datadog, and Palo Alto's early rounds systematically underestimated\n\
    the exit values those companies achieved.\n"
  claimRefs:
  - CV004
  - CV005
  - CV006
- calloutType: risk
  title: NRR Is the Investment Case's Biggest Unknown
  body: "Cato Networks has not disclosed its net revenue retention rate \u2014 the single most important\nSaaS financial metric\
    \ for underwriting a land-and-expand business at 13.7x ARR. Zscaler\nreports NRR of 115\u2013120%. If Cato's NRR is 110%+,\
    \ the current valuation is reasonable:\n$350M ARR growing organically via existing customers at 10% per year provides\
    \ $35M of\nARR growth with zero new logo cost. If NRR is below 105%, the growth story depends almost\nentirely on new\
    \ logo acquisition \u2014 a structurally weaker model subject to macro slowdown\nand competitive displacement. Investors\
    \ cannot resolve this from public sources. Every\nthesis statement about Cato's retention quality rests on indirect evidence\
    \ (GDR >95%,\nNPS 93, multi-year contracts) rather than the definitive metric. This is a non-negotiable\ndata room ask\
    \ before committing at $4.8B.\n"
  claimRefs:
  - CV003
  - CV009
  - CV010
