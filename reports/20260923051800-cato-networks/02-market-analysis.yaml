- id: SM-sizing
  title: "Market Sizing \u2014 Multiple Lenses"
  body: "Market sizing estimates for SASE vary substantially across analysts, reflecting different\nboundary definitions,\
    \ geographic scope, and component inclusion criteria. The Dell'Oro\nGroup\u2014widely regarded as the most rigorous tracker\
    \ of enterprise networking and security\nrevenues\u2014measured the trailing-twelve-month SASE market at approximately\
    \ $2.4 billion\nthrough Q3 2024, with the top six vendors accounting for 72% of that spend. This revenue-\nactuals approach\
    \ captures realized subscription and licensing revenue, making it narrower\nthan forward-looking TAM estimates.\n\nBroader\
    \ analyst houses employ top-down addressable-market frameworks. Grand View Research\nsizes the SASE TAM at approximately\
    \ $4.2B in 2024, projecting growth to roughly $30B by\n2030 at a 27.4% CAGR. Market.us estimates a 24.3% CAGR with a 2024\
    \ baseline of roughly\n$4B. Straits Research places the 2024 market at $3.8B, growing to $22B by 2030 at a\n25.7% CAGR.\
    \ These estimates cluster around a $3.8\u20134.2B 2024 consensus for the core SASE\ncategory.\n\nThe adjacent SD-WAN market\
    \ contributes substantial addressable spend: P&S Market Research\nsizes SD-WAN at $5.9B in 2024, while SNS Insider places\
    \ it at $5.2B. Security Service\nEdge (SSE)\u2014which overlaps with SASE's security stack\u2014is sized by Grand View\
    \ Research at\n$6.1B for 2024 and by MarketsandMarkets at $6.8B. Zero Trust Network Access (ZTNA)\nalone, a SASE sub-component,\
    \ is estimated at $3.4\u20133.5B by Grand View Research in 2024.\n\nApplying a bottom-up SAM lens scoped to mid-market\
    \ and enterprise accounts (500+ employees,\nglobally distributed workforce) in North America and Western Europe, the serviceable\n\
    addressable market for a single-vendor SASE platform like Cato's is conservatively\nestimated at $8\u201312B today, expanding\
    \ toward $25\u201335B by 2030 as MPLS displacement\naccelerates. Cato's current ARR of $300M+ represents roughly 2\u2013\
    4% penetration of that\nSAM, indicating meaningful headroom if net-revenue-retention and expansion sales remain\nhealthy.\n"
  claimRefs:
  - CM006
