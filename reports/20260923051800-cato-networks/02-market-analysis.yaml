- id: SM-segments
  title: Buyer, User, and Payer Segmentation
  body: "Enterprise SASE purchasing involves three distinct roles: the buyer (who initiates and\nevaluates), the user (who\
    \ consumes the service), and the payer (who controls the budget).\nIn large enterprises, the CISO typically initiates\
    \ the evaluation driven by a security\nmandate or a breach incident, while the VP of Network Engineering or Network Operations\n\
    lead acts as the technical buyer validating SD-WAN performance. The CFO or CIO controls\nfinal budget approval for multi-year\
    \ platform deals.\n\nMid-market enterprises (500\u20132,000 employees) present a simpler decision structure: the\nIT Director\
    \ often plays all three roles simultaneously, which accelerates evaluation cycles\nbut also means the vendor must demonstrate\
    \ immediate value without extensive professional\nservices engagement. This segment is Cato's stated sweet spot.\n\nGartner\
    \ predicts that by 2025, at least 70% of new remote-access deployments will use\nZTNA rather than VPNs\u2014up from less\
    \ than 10% in 2021\u2014signaling rapid preference shift\nacross all segments. Regulatory verticals (financial services,\
    \ healthcare, government)\nare high-urgency adopters because of zero-trust mandates, but also face the highest\nswitching\
    \ friction due to compliance attestations tied to existing infrastructure. Retail\nand manufacturing sectors have large\
    \ distributed-branch footprints that make SASE\neconomics compelling through MPLS cost displacement, typically requiring\
    \ an ROI payback\nperiod of 12\u201324 months.\n\nBudget typically sits in two line items: network infrastructure (SD-WAN,\
    \ MPLS displacement)\nand network security (firewall, VPN, SWG). SASE vendors that successfully bridge both\nbudget pools\u2014\
    as Cato does with its single-vendor approach\u2014can capture more wallet share\nper account than point-solution competitors\
    \ but must navigate a cross-functional selling\nmotion that involves both networking and security stakeholders.\n"
  claimRefs:
  - CM014
  - CM015
  - CM016
