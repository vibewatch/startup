      - number: '2.2'
        title: 市场规模测算——多维视角
        blocks:
          - type: paragraph
            body: >
              不同分析机构对 SASE 市场规模的测算差异巨大，根源在于边界定义、地域范围以及组件纳入标准不一。Dell'Oro Group 被公认为追踪企业网络与安全收入最为严谨的机构，其测算截至 2024 年第三季度的过去
              12 个月（TTM）SASE 市场规模约为 $2.4B，其中前六大厂商吃下了 72% 的市场份额。这种基于真实收入的统计口径仅反映实际落袋的订阅与授权收入，因而比前瞻性 TAM 测算更为紧缩。


              更多研究机构采用自上而下的潜在市场框架。Grand View Research 测算 2024 年 SASE TAM 约为 $4.2B，预计到 2030 年将以 27.4% 的复合年增长率（CAGR）增至约
              $30B。Market.us 估计以约 $4B 为 2024 年基准，CAGR 达 24.3%。Straits Research 预计 2024 年市场规模为 $3.8B，到 2030 年以 25.7% 的
              CAGR 增至 $22B。这些机构的数据将核心 SASE 品类在 2024 年的共识区间锚定在 $3.8B–$4.2B 之间。


              相邻的 SD-WAN 市场贡献了可观的潜在支出：P&S Market Research 测算 2024 年 SD-WAN 规模为 $5.9B，SNS Insider 则测算为 $5.2B。与 SASE
              安全栈重叠的安全服务边缘（SSE），Grand View Research 测算其 2024 年规模为 $6.1B，MarketsandMarkets 测算为 $6.8B。仅作为 SASE
              子组件的零信任网络访问（ZTNA），Grand View Research 估计 2024 年市场规模便有 $3.4B–$3.5B。


              若采用自下而上的 SAM 视角，将范围限定在北美和西欧拥有 500 名以上员工且人员全球分布的中型及大型企业客户，Cato 这类单一供应商 SASE 平台当前的可服务市场（SAM）保守估计在 $8B–$12B
              之间；随着 MPLS 替代提速，预计到 2030 年将扩张至 $25B–$35B。Cato 目前 $300M+ 的 ARR 对应约 2%–4% 的 SAM
              渗透率；只要净留存率与增购销售保持健康，未来仍有可观的增长天花板。
