      - number: '7.2'
        title: 监管合规、法律与地缘政治风险
        blocks:
          - type: paragraph
            body: >
              截至研究基准日，Cato Networks 尚未披露任何重大诉讼、监管处罚或知识产权争议。公司拥有 SOC 2 Type II、ISO 27001、PCI DSS Level 1、HIPAA、GDPR 以及英国
              Cyber Essentials 等多项认证，为企业和强监管行业的合规需求提供了坚实基底。但若干结构性监管与法律风险仍值得在尽调中重点关注。


              数据本地化（data residency）是其中最实质性的合规敞口：Cato 在 150+ 个国家设立的 85+ 个 PoP 带来了复杂的欧盟 GDPR 第 44–49
              条跨境数据传输合规要求，引发了德国（BDSG）、法国（CNIL）、印度（DPDP 法案）以及中国等市场的数据主权问题，同时还需应对《欧盟人工智能法案》（EU AI Act）针对 AI
              数据处理提出的最新合规要求。随着 Cato 不断追加 AI 驱动的安全功能（通过收购 Aim Security 及内置在 SPACE 引擎中的能力），监管机构对经由 AI 处理的网络流量数据的审查力度势必升级。


              在地缘政治事件影响以及对美以跨境数据流动全面审查的背景下，寻求赴美上市的以色列企业面临美国 SEC 更为严苛的审核。自 2023 年 10
              月以来持续的以色列冲突，令负有预备役（miluim）义务的工程和运维人员面临不可抗力与业务连续性风险。汇率风险同样显著：Cato 约 50%
              的成本以新谢克尔（ILS）计价，而收入以美元（USD）结算，一旦新谢克尔升值便会放大外汇风险口径。公司未公开披露任何债务或监管性融资负债。
