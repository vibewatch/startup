chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 基本信息、总部、成立日期与商业模式
        blocks:
          - type: paragraph
            body: >
              Cato Networks Ltd. 是一家以色列私营网络安全公司，总部设在特拉维夫（Landmark Tower）。公司在加利福尼亚州圣何塞设有办公室，并在全球范围开展业务，美国市场布局深厚。Cato
              由连续创业者 Shlomo Kramer 与 Gur Shatz 于 2015 年创立，并在 2016 年 2 月正式推出平台，将自身定位于安全访问服务边缘（SASE）品类的先行者——Gartner 随后于
              2019 年提出这一术语，其构想很大程度上正源于 Cato 的架构视角。


              商业模式为云端交付的订阅制平台，将企业网络（SD-WAN）与网络安全（SWG、CASB、ZTNA、FWaaS、DLP、IPS、XDR、EPP）整合为统一的全球云服务。企业客户通过按期支付订阅费，用 Cato
              的托管云骨干网替代碎片化的传统硬件设备与 MPLS 专线。该平台服务于全球各类规模的企业，在零售、制造、金融服务等分支机构分散的行业中，尤其受到中型到大型企业的青睐。收入几乎全部来自
              ARR，按美元计算的总留存率（GRR）超过 95%；随着托管 SASE 服务生态扩张，渠道合作伙伴贡献的比重稳步上升。


              公司属于非公开披露（Private-Disclosed）状态——虽对外公布 ARR 里程碑、客户总数与重大融资事件，但保留了营业利润率、绝对收入额、员工总数以及单客经济模型等内部数据。
            claimRefs:
