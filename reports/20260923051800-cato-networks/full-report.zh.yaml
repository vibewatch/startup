  foundingLocation: Tel Aviv, Israel
  headquarters: Tel Aviv, Israel (with U.S. HQ in New York, NY)
  productSummary: >
    Cato SASE Cloud Platform 将 SD-WAN、全球私有骨干网（85+ 个 PoP 节点）以及完整的安全服务边缘（SSE 360）融合成单一云原生服务。其核心创新在于单通云引擎（Single Pass Cloud
    Engine，SPACE）：流量仅需解密一次，便在统一流水线中执行所有安全功能，随后重新加密并转发——消除了多点方案服务链式堆叠造成的延迟与策略碎片化。2024 年，Cato 进一步扩展平台能力，推出由 SASE 纳管的
    EPP/EDR 以及业内首个 SASE 原生 XDR。在 2024 年 Gartner 单一供应商 SASE 魔力象限中，Cato 与 Palo Alto Networks、Netskope 共同获评领导者。
  customerFocus: >
    主要聚焦中型企业到大型机构（500–10,000 名员工），在制造业、物流、零售、金融服务及医疗健康行业表现强劲。业务版图覆盖北美、欧洲与亚太地区。因 FedRAMP 认证尚在审核流程中（In
    Process），在联邦及公共部门的渗透依然受限。
  businessModel: >
    完全依托云端交付的年度 SaaS 订阅模式；无需本地硬件。定价基于席位数或带宽，并具备贯穿整个 SSE 堆栈的增购潜力（可叠加 ZTNA、CASB、DLP、XDR、EPP/EDR 等模块）。渠道端借助 MSSP、VAR
    与全球系统集成商（Deloitte、Accenture、CDW）联合拓展。直销大客户打法与渠道体系并行。
  stage: Series G
