  - id: TE002
    title: 工作流与用例表
    columns:
      - 用户任务 / 用例
      - 既有传统工作流
      - Cato 解决方案
      - 可量化收益
      - 局限性
    rows:
      - - 分支机构 WAN 的 MPLS 替代
        - 专用 MPLS 成本达 $500-1500/Mbps/月；缺乏弹性；运营商托管；配置变更耗时数周
        - 各分支站点的 Cato Socket 经宽带或蜂窝网络接入就近 PoP；私有骨干网提供媲美 MPLS 的可靠性
        - WAN 成本降低 30-70%；带宽提升 5-30 倍；站点开通从数周缩短至数小时
        - 骨干网 SLA 达成率未经独立审计；新兴市场 PoP 节点密度可能偏低
      - - 分布式办公团队的远程访问与零信任
        - 依赖 VPN 集中器；星型拓扑路由；连通后缺乏持续检测；面临硬件设备 CapEx 与扩容复杂度
        - Cato Client 集成 ZTNA；流量常开经由 PoP 路由；基于身份访问；SPACE 引擎对全会话持续检查
        - 免除 VPN 硬件设备 CapEx；实现微隔离；连通后持续进行威胁检测
        - 需安装 Cato Client；虽支持无 Agent 访问但策略执行能力有所减弱
      - - 云与 SaaS 安全
        - 独立 CASB 代理；云端与本地 DLP 策略割裂；缺乏统一的 SaaS 可视化
        - SPACE 内置 CASB 与 DLP；所有 SaaS 及云端流量均经实时在线检测；支持影子 IT 发现
        - 不论用户身处何地均执行统一 SaaS 策略；对所有流量实施实时 DLP 管控
        - 依据 Gartner 2024 年提示，其 SaaS 应用管控粒度弱于 Palo Alto NGFW
      - - 终端威胁检测与响应
        - EPP 供应商独立；另配 SIEM 汇聚日志；工具割裂导致告警疲劳
        - 同台集成 Cato EPP 与 XDR；统一数据湖关联事件；AI 排定事件优先级
        - 缩减工具数量；网络与终端统一关联降低 MTTR；免除 SIEM 集成工作
        - EPP 防护效果相较专业终端安全厂商（如 CrowdStrike Falcon）未经外部基准评测
      - - 多分支全球企业 WAN
        - 按区域混用多家 SD-WAN 厂商；安全层彼此独立；策略割裂；需维护多份厂商支持合同
        - 全球统一部署 Cato 单一平台；CMA 策略通配全球所有边缘；仅需单一技术支持对接
