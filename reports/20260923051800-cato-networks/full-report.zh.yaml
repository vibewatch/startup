        - Series G 轮约 ~16x ARR 处于或高于上市 SASE 可比公司水平；未体现一级市场流动性折价
      - - 退出时间表（基准）
        - 18–24 个月（IPO 或并购）
        - 低
        - IPO 搁置；战略评估仍在推进；资金储备提供充裕跑道
      - - 基准情景回报
        - 18–24 个月内回报 10–20%（年化约 ~5–12%）
        - 低
        - 取决于 NRR 核实情况、退出窗口与估值倍数重估
      - - 建仓纪律
        - 当前 $4.8B 估值饱满；更倾向以 $4.0–4.3B 参与老股交易
        - 中
        - 在 NRR 未证实 >115% 前，避免因 FOMO 在 >$5.0B 追高溢价
      - - 上调评级触发条件（转为买入）
        - 核实 NRR ≥ 110% 且以 ≤ $4.5B 参与老股交易
        - 高（条件性）
        - NRR 为关键未核实指标；价格至关重要
      - - 下调评级触发条件（转为回避）
        - NRR < 105% 或增速连续两期 < 25% 或建仓估值 >$5.5B
        - 高（条件性）
        - 任一情形均意味着投资逻辑失效或安全边际不足
    claimRefs:
      - CV001
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
  - id: TV002
    title: 投资逻辑与反向逻辑对照表
    notes: 投资逻辑与反向逻辑要点综合前述各章分析得出。证据质量列反映基于现有公开证据对各要点的置信程度。
    columns:
      - 维度
      - 投资逻辑要点
      - 反向逻辑要点
      - 证据质量
    rows:
      - - 市场
        - SASE 到 2028 年将达到 $28B 市场规模，CAGR 为 26% —— Cato 当前市占率为 2.5%，具备提升至 5–10% 的结构性空间
        - 前 6 大 SASE 厂商已占据 72% 市场份额；获取份额须从资金雄厚的既有巨头手中抢夺（Palo Alto 达 $8B ARR、Cisco 安全业务 ARR 超 $3B+）
        - 高
      - - 产品
        - 云原生单一供应商 SASE 架构带来更优 TCO —— Forrester 测算其投资回报率达 246% ROI，并验证了 30x 的带宽改善
        - FedRAMP 未获授权；无原生 EDR；远程浏览器隔离深度落后于 Zscaler；AIM 整合未经证实
        - 高
      - - 客户
        - '拥有 3,500+ 家企业客户、NPS 93（位居 SASE 厂商 #1）、Gartner 评分 4.7/5、GDR 超 95%+ —— 细分赛道客户满意度最佳'
        - NRR 未披露 —— 最核心的留存指标无法从公开渠道获知；头部客户集中度同样未知
        - 中
      - - 财务
        - $350M ARR 且同比增长 43% —— 成为增长最快的纯 SASE 厂商；累计融资 $647M 提供充裕跑道
        - 尚未盈利且年烧钱速度估计达 $180–360M；估值达 13.7x ARR，一旦增长放缓则安全边际极为有限
        - 低（烧钱速度仅为估计）
      - - 竞争
        - 连续 2 年入选 Gartner MQ Leader；多年期合同锁定切换成本；PoP 网络构筑护城河
        - Palo Alto 针对既有 NGFW 客户推行零边际成本平台化策略构成直接竞争威胁；Zscaler 在政府市场的统治地位根深蒂固
        - 高
      - - 风险
        - 多年期合同加上高 NPS 构筑防御壁垒；$647M 资金储备提供缓冲垫
        - FedRAMP 处于 In Process 阶段、业务集中于以色列、联创离职、IPO 搁置 —— 风险组合具有实质影响
        - 中
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
  - id: TV003
    title: 乐观 / 基准 / 悲观情景分析表
    notes: 所有情景数值均为编辑估算。ARR 预测基于当前 $350M ARR 及过去 43% 的增速，增速放缓假设结合竞争态势与市场环境进行校准。退出倍数参考当前上市 SASE 可比公司。概率归属为主观判断。
    columns:
      - 情景
      - ARR（2026E）
      - ARR 增速
      - 退出倍数
      - 退出估值
      - 相对 $4.8B 回报
      - 概率
      - 核心假设
    rows:
      - - 乐观
        - $430M
        - 自 $350M 同比增长 23%
        - 16.5 倍 NTM ARR
        - $7.1B IPO（2027 年 H1）
        - +48%
        - 30%
        - FedRAMP 获批；NRR ≥ 115%；IPO 市场重新开放；来自 Palo Alto 的竞争处于可控范围
      - - 基准
        - $400M
        - 自 $350M 同比增长 14%
        - 13–15 倍 NTM ARR
        - $5.5–6.0B 并购或 IPO
        - +15–25%
        - 50%
        - NRR 证实达 110–115%；增长趋缓；IPO 推迟至 2027 年 H2；未发生重大竞争格局颠覆
      - - 悲观
        - $340M
        - 自 $350M 同比增长 <3%（增长反转）
        - 8–10 倍 NTM ARR
        - $2.8–3.5B 并购或迫售轮
        - '-27–42%'
        - 20%
        - ARR 增速受 Palo Alto 平台化压制陷入停滞；NRR < 105%；IPO 窗口关闭；被迫出售或流血融资
    claimRefs: []
