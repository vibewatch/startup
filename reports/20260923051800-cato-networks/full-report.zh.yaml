      - number: '6.2'
        title: 采用轨迹与规模佐证
        blocks:
          - type: paragraph
            body: >
              Cato Networks 展现出了企业网络安全领域最迅猛的 ARR 增长曲线之一。自 2021 年突破 $100M ARR（成立约 5–6 年后）起，公司于 2024 年 7 月实现 ARR 翻番达到
              $200M，2024 年底触及 $250M ARR（同比增长 46%），并在 2025 年 9 月前跨越 $300M ARR 大关。对应的客户数量，从 $100M 里程碑时的大约 1,000–1,500
              家，扩张至 2024 年 7 月的 2,500+ 家、2025 年 2 月的 3,000+ 家，并在 2025 年 6 月突破 3,500+ 家——不到 12 个月内增幅达 40%。


              这一增长轨迹得到了全球落地基础设施的强力印证：遍及 150+ 个国家的 85+ 个 PoP 构成了实体网络采用的铁证。渠道动能进一步证实了其渗透广度：150+ 家独家“Powered by
              Cato”托管服务合作伙伴表明，第三方 MSP 正在全面转向该平台独家 GTM 打法，比非独占的 VAR 合作展现出更具说服力的采用信号。Gartner Peer Insights 上的评价规模（截至 2024
              年 7 月共有 183 篇实名认证评价，达其他 SASE 领导者厂商的 10 倍）表明其拥有庞大、活跃且乐于公开反馈的真实装机用户群体——这是衡量实际部署广度的高置信度风向标。85+ 个国家的 PoP
              覆盖版图，在运维能力上也足以匹配向 150+ 个国家提供企业级 SLA 保障的实际需求。
