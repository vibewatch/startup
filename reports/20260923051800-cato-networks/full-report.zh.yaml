      - number: '2.3'
        title: 买方、使用者与出资方细分
        blocks:
          - type: paragraph
            body: >
              企业级 SASE 采购涉及三类不同角色：买方（发起并评估）、使用者（消费该服务）与出资方（掌握预算）。在大型企业中，评估通常由 CISO
              在安全合规要求或数据泄露事件驱动下发起；网络工程副总裁或网络运维负责人则充当技术买方，负责验证 SD-WAN 性能。多年度平台级大单的最终预算审批权掌握在 CFO 或 CIO 手中。


              中型企业（500–2,000 名员工）的决策链更为精简：IT 总监往往一人兼顾上述三类角色，这大幅缩短了评估周期，但也要求厂商无需重度专业服务介入就能展现即时价值。这一客群正是 Cato 明确强调的核心优势区间。


              Gartner 预测，到 2025 年，至少 70% 的新增远程访问部署将采用 ZTNA 而非 VPN——远高于 2021 年的不足
              10%——显示出各类企业偏好的迅速迁移。受零信任合规要求驱动，强监管垂直行业（金融服务、医疗、政府）采纳意愿最为迫切，但由于合规证明与既有基础设施深度绑定，面临的切换阻力也最大。零售与制造业拥有庞大的分支机构网络，通过替代高昂的
              MPLS 专线成本，SASE 展现出极具吸引力的经济效益，ROI 回本周期通常在 12–24 个月。


              企业预算通常分散在两个科目中：网络基础设施（SD-WAN、MPLS 替代）与网络安全（防火墙、VPN、SWG）。像 Cato
              这样凭借单一供应商架构成功打通两块预算池的厂商，能从单个客户身上挖出更高的钱包份额（wallet share），但前提是必须理顺横跨网络与安全两大职能团队的交叉销售流程。
            claimRefs:
              - CM014
              - CM015
              - CM016
