      - number: '6.3'
        title: 实名客户案例与证据质量
        blocks:
          - type: paragraph
            body: >
              Cato Networks 已公开披露至少 10 家已投入生产环境的实名企业客户案例，形成了高质量的落地佐证。全球酿酒巨头嘉士伯集团（Carlsberg Group）在 200+ 个分支机构和 25,000+
              名远程用户中部署了 Cato SASE，全面取代了旧有的 VPN 和 SD-WAN 架构。年营收 $7B 的包装制造巨头 O-I Glass 在 20 个国家的 150+ 家工厂部署，服务 23,000
              名员工。良品计划（Ryohin Keikaku/MUJI）在日本本土及海外市场的 820+ 个网点完成联网，覆盖 3,200+ 名员工。年营收 $10B 的德国汽车零部件供应商纬湃科技（Vitesco
              Technologies）在 90+ 个分支机构部署，支持 24,000 名远程用户。跨国租车巨头 Sixt 在欧洲和美洲各网点及远程办公场景部署；航空地面服务商 Swissport
              用于机场场站网络连接。此外，ACCO Brands、工程机械商 Haulotte、工业缝纫机厂商 Juki 以及北欧零售与制造企业 Flügger Group 亦位列公开的署名客户名单中。


              前述六大核心客户（Carlsberg、O-I、MUJI、Vitesco、Sixt、Swissport）的证据质量尤为扎实：均具备 Cato
              官方案例研究背书，披露了具体的部署规模、业务收益和实际用例。所有项目均明确标注为正在运行的生产环境部署——没有任何公开案例提及测试（pilot）中断或流失。从署名案例数量来看，制造业与汽车行业占据主导，反映了
              Cato 在跨地域、多站点的运营技术（OT）环境下具备显著优势。
