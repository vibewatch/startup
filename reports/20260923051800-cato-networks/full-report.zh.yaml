companyProfile:
  summary: >-
    Cato Networks 是一家总部位于特拉维夫的网络安全与网络互通公司，依托全球私有骨干网与单通云引擎，打造出行业领先的单一供应商 SASE 平台。公司由 Shlomo Kramer 与 Gur Shatz 于 2015
    年创立。截至 2026 年 9 月，Cato 公布的 ARR 超过 $415M，客户数突破 4,800 家，G 轮估值达 $4.8B，并完成了对 Aim Security 的收购；与此同时，IPO
    节奏与盈利能见度仍面临持续的不确定性。
  foundedDate: '2015-01-01'
  founders:
