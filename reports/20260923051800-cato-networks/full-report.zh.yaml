      - number: '1.3'
        title: 融资历程、估值演变与投资方图谱
        blocks:
          - type: paragraph
            body: >
              自 2015 年以来，Cato 历经 8 轮融资，累计筹资已突破 10 亿美元。2020 年 11 月，公司在完成 $130M 的 E 轮融资后估值突破 $1B，跻身独角兽行列。最近一轮机构融资为 2025 年
              6 月的 G 轮，以 $4.8B 估值募集 $359M，由 Vitruvian Partners 与 ION Crossover Partners 领投，LightSpeed、Acrew Capital 与
              Adams Street Partners 跟投。2025 年 9 月，Acrew Capital 按同等条款追加 $50M，使 G 轮融资总额达到 $409M。G 轮融资所得中约有 $120M
              用于员工老股转让，在 IPO 推迟的背景下为老员工提供了流动性退出渠道。


              过往融资轮次包括：A 轮（2015 年，$20M）、B 轮（2016 年，$50M）、C 轮（2019 年，$55M）、D 轮（2020 年 4 月，$77M）、E 轮（2020 年 11 月，$130M）以及
              2021 年 F 轮（$200M，估值 $2.5B）。2023 年轮次（$238M，估值 $3B+）由 LightSpeed 领投，使累计融资金额达 $773M。历史投资方包括
              Greylock、Coatue、SoftBank Vision Fund 2、Singtel Innov8、Adams Street Partners 以及 US Venture Partners。
            claimRefs:
              - CO012
