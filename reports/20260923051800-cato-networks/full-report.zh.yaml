      - number: '1.2'
        title: 创始人、高管团队、董事会与治理结构
        blocks:
          - type: paragraph
            body: >
              Cato 由两位以色列网络安全界的资深老将共同创立。CEO Shlomo Kramer 此前曾联合创立 Check Point Software Technologies（全球防火墙先驱）与 Imperva（先以
              $2.1B 出售给 Thoma Bravo，后以 $3.6B 转售给 Thales）。联合创始人 Gur Shatz 此前曾创立 Incapsula（被 Imperva 收购），并担任 Cato 总裁兼 COO
              直至 2024 年 1 月；据报道因与 Kramer 产生分歧而离职。Shatz 目前仍保留董事席位。合作近 20 年的 Kramer 与 Shatz
              分道扬镳，构成了关键人员与公司治理层面的重大风险，在风险章节中将有专门探讨。


              现任高管团队包括 CTO Eyal Heiman、CPO Ofir Agasi、CFO Tomer Wald、CRO Nick Fan 以及首席商务官（Chief Business Officer）Alon
              Alter。这一团队配置在预期 IPO 之前得到了针对性强化。董事会 VC 代表阵容深厚：包括 LightSpeed 的 Ravi Mhatre 和 Yoni Cheifetz、Greylock 的 Jerry
              Chen，以及独立董事 Eyal Waldman（Mellanox 创始人，该公司以 $7B 出售给 Nvidia）和 2024 年 10 月加入的 Gili Iohan（Varonis 前 CFO、ION
              Crossover Partners 合伙人）。Ronen Faier 同样担任独立董事。董事会结构展现出 IPO 前的专业化水准，呼应着走向公开市场的各项筹备。
            claimRefs:
              - CO002
              - CO003
