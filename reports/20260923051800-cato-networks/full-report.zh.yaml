      - number: '1.5'
        title: 关键里程碑、反向事件与战略演进路径
        blocks:
          - type: paragraph
            body: >
              Cato 的发展历程涵盖产品初创（2015–2016 年）、远程办公红利推动的高速增长（2019–2022 年）、多轮巨额融资（2020–2023 年）以及上市前筹备期（2024–2026 年）。2022 年
              11 月达成的 ARR 里程碑，创下了企业网络安全史上从零到 $100M 的最快纪录。即便面临 VC 市场大盘遇冷的逆风，公司在 2023 年融资中依然打破此前的融资节奏，估值突破 $3B+。


              反向事件方面，联合创始人 Gur Shatz 据报道因内部冲突于 2024 年 1 月离职，构成了治理与关键人员维度的实质性风险。原本计划在 2024 年底启动的 IPO 流程随后推迟至 2025 年初；2025
              年 5 月，据报道因潜在收购方对公司估值存在疑虑，Cato 在试探出售意向时叫停了 IPO 进程。公司转而在 2025 年 6 月募集 G
              轮，部分原因在于向员工提供老股流动性。截至本报告运行日期，公司尚未官宣任何 IPO 或并购交易。2025 年 9 月，Cato 在宣布 ARR 突破 $300M 的同时完成了首笔收购，将 AI 安全初创公司
              Aim Security 收入囊中，以借此进军企业级 AI 安全领域。
            claimRefs:
              - CO013
              - CO016
