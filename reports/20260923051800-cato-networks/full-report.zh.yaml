      - number: '5.2'
        title: 核心架构：SPACE、全球 PoP 骨干网与单次处理安全引擎
        blocks:
          - type: paragraph
            body: >
              Cato 平台的核心架构创新在于单次处理云引擎（Single Pass Cloud Engine，简称
              SPACE）：这套软件栈只需对企业流量解密一次，便能在同一处理上下文中，按顺序流水线执行各项安全检测功能，随后重新加密转发交付。涵盖的功能包括用于网络分段的 NGFW、用于威胁防御的 SWG 和
              IPS、用于有效载荷检测的 NGAM、用于浏览器隔离的 RBI、DNS 安全防护、用于应用与数据保护的 CASB 和 DLP，以及用于访问控制的
              ZTNA——全都在共享流量上下文的前提下单次处理完毕。追加新安全功能无需付出额外的解密开销，新模块直接融入 SPACE 流水线，继承既有的高性能表现。


              SPACE 引擎以数千个实例的形式，分布在全球顶级托管数据中心的 85+ 个 PoP 中运行。Cato 自主拥有并管理这些机房内的裸金属计算设备，通过多家一级运营商（Tier-1）线路互联各个 PoP，建成了具备
              SLA 保障、匹敌 MPLS 品质的私有全球广域网骨干。相比租赁超大规模云厂商算力，Cato 直接掌控计算基础设施，得以自主掌控软件更新、容量扩缩及 PoP 扩建节奏。


              支撑 Cato AI/ML 与分析能力的数据湖，汇聚了 SPACE 生成的全部流量上下文、Cato Client 内部 ZTNA 和 EPP 引擎采集的终端遥测数据、源自 Microsoft Defender 与
              CrowdStrike 的第三方终端数据，以及数百个外部威胁情报源。Cato Security Research 团队利用 AI/ML
              校验情报质量，在将新防御规则推向全球前，先基于客户真实流量进行规则仿真，整个部署周期在 24–48 小时内完成。平台依靠四种自管理机制维系高可靠性：自愈（PoP
              自动故障倒换）、自优化（动态路径优选）、自扩缩（SPACE 实例横向扩容）与自演进（无感软件无缝升级）。Cato 宣称其服务可用性达 99.999%。
            claimRefs:
              - CE002
              - CE003
              - CE012
              - CE013
