      - number: '1.4'
        title: 核心指标、经营表现与市场认可
        blocks:
          - type: paragraph
            body: >
              Cato 公开披露过一系列 ARR 里程碑数据：2022 年 11 月达到 $100M（同比增长 60%+）；2024 年第二季度突破 $200M+（不足两年实现翻倍）；2024 年底达到 $250M（同比增长
              46%）；2025 年 9 月突破 $300M+。公司公布的 2023 年 GAAP 收入较 2022 年增长 59%。客户规模在 2024 年 7 月达到 2,500 家，到 2025 年 6
              月大型企业客户数增至 3,500 家。按美元计算的总留存率超过 95%。Cato 尚未公开披露净收入绝对值、毛利率、EBITDA 或单客平均合同价值（ACV）；管理层在 2025 年中承认公司尚未实现盈利。


              2024 年 7 月，Gartner 首次将 Cato 评为单一供应商 SASE 魔力象限的领导者，排名仅次于 Palo Alto Networks。Forrester Wave 在 2023 年第三季度将
              Cato 评为“ZTE/SASE 领导者”。在 Gartner Peer Insights 上，截至 2024 年 7 月，Cato 评分达 4.7/5 分，拥有 183
              条以上经过验证的评价——评价数量是其他任何领导者厂商的 10 倍以上。
