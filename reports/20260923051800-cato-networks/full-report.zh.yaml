      - number: '5.3'
        title: 产品模块全景：SD-WAN、SSE 360、XDR、EPP 及拓展能力
        blocks:
          - type: paragraph
            body: >
              Cato 的产品矩阵由五大核心功能模块构成，全部经由 SPACE 统一交付，并在 CMA 中集中管理。


              SD-WAN 与连接：Cato Socket（面向分支站点的实体硬件）与 vSocket（面向云环境的虚拟镜像）提供具备多链路聚合、应用感知型 QoS、动态路径选择和零接触部署（ZTP）能力的
              SD-WAN。Cato Client 软件代理为 Windows、macOS、iOS、Android 和 Linux 平台上的移动与远程用户提供 SD-WAN 及 ZTNA
              接入。免客户端浏览器门户访问则面向外包人员与 BYOD 设备，执行相对简化的策略。


              SSE 360：全套安全服务边缘（SSE）组件——FWaaS、SWG、IPS、NGAM、RBI、DNS 安全、CASB、DLP 及 ZTNA——依托 SPACE 在 PoP 侧对全部流量实施检测。相比独立 SSE
              厂商的关键差异化在于：SSE 360 既覆盖广域网东西向流量，也覆盖互联网 / 云端南北向流量，而独立 SSE 通常只检测流向互联网的流量。


              XDR 与 MXDR：于 2024 年 1 月作为业界首款基于 SASE 的 XDR 正式上线，将网络与终端遥测数据摄入统一数据湖，提供 AI/ML 驱动的威胁猎捕、UEBA 以及生成式 AI
              赋能的分析师工作台。依托 Cato 自家安全分析师的 MXDR（托管式 XDR）服务早自 2019 年便已推出，比软件产品上线早了整整五年。


              EPP/EDR：业界首个由 SASE 统一纳管的 EPP，于 2024 年全面商用（GA）；运用机器学习与行为分析扫描 300+ 种文件类型；在 CMA 中完全托管，并在单一数据湖中实现终端事件与网络事件的
              XDR 联动关联。


              拓展能力：数字体验监控（DEM）无需部署独立探针即可提供主动式性能可视性；IoT/OT 安全负责资产发现与 OT 策略执行；生成式 AI（GenAI）安全则用于管控“影子 AI”（Shadow
              AI），防御提示词注入攻击与数据泄露，保障 AI 应用运行安全。
