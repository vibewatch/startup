      - number: '2.4'
        title: 增长驱动因素与采用阻力
        blocks:
          - type: paragraph
            body: >
              推动 SASE 普及的核心结构性动力，在于向云端和混合办公模式的长期演进。企业网络流量越来越多地来自分支机构、居家办公与移动终端，且目标直指 SaaS
              应用，使得传统依托数据中心出网的轴辐式（hub-and-spoke）WAN 架构变得低效且昂贵。云原生 SASE
              架构通过提供具备内置安全检测能力的直连云服务化解了这一矛盾，消除了流量回传企业数据中心带来的延迟惩罚。


              监管政策是第二大重要推力。美国白宫 14028 号行政命令（2021 年 5 月）要求联邦机构采用零信任架构；随后发布的 OMB 备忘录 M-22-09（2022 年 1 月）以 NIST SP 800-207
              为核心标准，设定了 2024 财年末的具体落地截止时间。这项联邦指令引发了合规层面的传导效应：联邦承包商以及受监管行业（FFIEC 指引下的银行业、HIPAA 监管下的医疗机构、CMMC
              要求下的国防承包商）纷纷提速采纳零信任与 SASE。网络安全保险承保商也越来越倾向于将零信任网络控制列为承保前置条件。


              阻碍全面推广的客观因素同样显著。既有基础设施的锁定效应是被提及最多的障碍：手握长期 MPLS 合同、存量硬件设备已折旧完毕、安全策略工具已深植业务的企业，面临极高的迁移复杂度与切换成本。多供应商拼接的 SASE
              架构（例如采购一家厂商的 ZTNA 和另一家的 SD-WAN）带来了额外的集成与管理开销，延缓了统一步伐。人才短缺使问题更加棘手：打通网络与安全需要跨学科技能，而目前极少有企业 IT
              团队具备这一能力。数据主权与合规顾虑在欧盟（GDPR）、金融服务和医疗领域构成额外的推进阻力，将流量经由第三方云 PoP 路由需要经历严格的尽职调查。
            claimRefs: []
      - number: '2.5'
        title: 测算差异与相互矛盾的估算
        blocks:
          - type: paragraph
            body: >
              在企业级科技领域中，分析机构对 SASE 市场的测算分歧堪称最为悬殊。Dell'Oro 基于实际收入的统计追踪（截至 2024 年第三季度 TTM 规模为 $2.4B），比同期 Grand View
              Research（$4.2B）或 MarketsandMarkets 自上而下测算的 TAM 小了 50% 以上。部分涵盖相邻 SD-WAN 与 SSE 收入的宽口径定义甚至给出了超过 $9B
              的数字——从最窄口径到最宽口径相差达 4 倍。


              复合年增长率（CAGR）的预期在 22%（Grand View Research）到 38.9%（P&S Market Research 针对 SD-WAN 单项的测算）之间浮动，导致 2030
              年市场规模预测出现从 $17B 到超过 $42B
              的巨大不确定性区间。这些矛盾反映了方法论上的客观差异：基于实际收入的统计口径（Dell'Oro）与潜在市场推算（绝大多数研究机构）的对立、组件纳入标准的分歧（是否计入纯 SD-WAN 或纯
              SSE），以及地域范围的不同（全球对比仅限北美）。


              尚未解决的尽调核心问题包括：(1) 在 Dell'Oro 统计的 $2.4B 市场中，Cato 的实际 ARR 占比究竟有多大？(2) Cato 的 ARR 增长有多少来自老客增购，有多少来自新客户拓展？(3)
              SASE 市场到底迎来了真正的爆发拐点，还是仍处于早期尝鲜阶段？这些认知断层限制了投资人仅凭单一机构数据验证未来预测的置信度。
            claimRefs: []
      - number: '2.6'
        title: 专题图表
        blocks:
          - type: callout
            title: 机构市场定义差异导致 TAM 测算出现 4 倍悬殊
            body: >-
              Dell'Oro 基于实际收入的统计显示 2024 年 SASE 市场规模为 $2.4B，而将 SSE 与 SD-WAN 合并计算的宽口径测算则超过 $9B。投资人应以 Dell'Oro
              的实际落袋规模为基准，并将自上而下的 TAM 测算视作理想天花板。Cato $300M+ 的 ARR 占 Dell'Oro 统计市场的 12.5%，这与在 $9B TAM 中不足 3% 的渗透叙事有着本质区别。
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
          - type: callout
            title: 零信任监管政策红利催生结构性需求
            body: >-
              OMB 备忘录 M-22-09 规定美国联邦机构须在 2024 财年末完成零信任落地，并以 NIST SP 800-207
              为基准。该指令向联邦承包商、国防工业基础（CMMC）、银行业（FFIEC）以及医疗行业（HIPAA）产生合规传导，在企业自发的云迁移需求之外，实质性拓宽了 ZTNA 与 SASE 的企业级潜在市场空间。
            calloutType: strength
            claimRefs: []
          - type: callout
            title: MPLS 合同锁定是采纳进度的首要逆风
            body: >-
              绝大多数中大型企业与一级电信运营商签有 3–5 年期的 MPLS 合同。包括 Cato 商机管线在内的 SASE 替代进度，由合同到期周期主导，而非单纯取决于技术就绪度。这形成了一条可预测但拉长了的 S
              型普及曲线，即便技术领先的 SASE 平台，其抢占市场份额的速度也会受到客观制约。
            calloutType: risk
            claimRefs: []
          - type: callout
            title: 单一供应商 SASE 市场依然高度集中
            body: >-
              Dell'Oro 数据显示，在 $2.4B 的市场规模中，前六大 SASE 厂商吃掉了 72% 的份额，仅 Zscaler 一家就握有约 21% 的市场。尽管 Cato 名列 Gartner
              魔力象限领导者阵营且保持约 50% 的同比增长（2024 年第三季度），但置身于一个走向整合的市场，面对的是资金更雄厚、销售团队更庞大、生态伙伴网络更宽广的上市巨头。
            calloutType: risk
            claimRefs: []
          - type: callout
            title: SAM 测算基于单一供应商融合架构胜过跨厂商拼盘的假设
            body: >-
              $8B–$12B 的 SAM 测算基于一个核心假设：市场将持续转向单一供应商 SASE 架构，而非采用各细分领域最佳工具（best-of-breed）的跨厂商拼装方案。若企业依旧维持“Zscaler 加
              Cisco SD-WAN”的割裂组合，Cato 实际可触达的 SAM 将大幅收缩。这一假设需要对照实际的成单与丢单（win/loss）数据持续检验。
            calloutType: assumption
            claimRefs:
              - CM012
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局总览
        blocks:
          - type: paragraph
            body: >
              SASE 市场的参与者可划分为八类厂商形态：云原生单一供应商平台、从 SSE 切入补充 SD-WAN 的厂商、向云端延伸的传统网络安全厂商、叠加安全能力的传统网络设备商、托管 SASE 供应商、电信运营商
              SASE 捆绑方案、超大规模云厂商的零信任服务，以及自建替代方案。Cato 最核心的战场在第一类，同时抵御其他阵营的蚕食。


              根据 Gartner 2024 年单一供应商 SASE 魔力象限，市场呈现三强领跑格局：Cato Networks、Zscaler 与 Palo Alto Networks 并列领导者。象限还包括以
              Netskope 为代表的挑战者，以及涵盖 Fortinet、Cisco、Cloudflare
              等厂商的远见者和利基厂商。此前分散的市场逐步收敛为三家头部领导者，反映出企业客户正日益从各细分单点工具采购转向一体化平台，这一趋势在结构上利好 Cato 的站位。


              Dell'Oro Group 2024 年第三季度数据显示，前六大 SASE 厂商吃掉了约 $2.4B 季度 SASE 市场规模的约
              72%，体现出极高的集中度。随着大型企业倾向于向全平台型厂商统一采购而非自行拼装单点方案，处于第一梯队之外的厂商面临日益加剧的同质化竞争压力。该趋势加速了领先厂商切换成本的积累，抬高了新进入者的壁垒，同时也加剧了产品架构割裂的老牌厂商被替代的风险。


              相邻替代方案包括企业自建项目（大型云原生企业结合 AWS Transit Gateway、Google BeyondCorp 或 Azure Virtual WAN
              及原生安全控制进行搭建）、AT&T、Verizon 与 Orange Business 等电信运营商提供的托管 SASE 捆绑包，以及区域性 MSSP
              方案。这类替代方案多见于配有专属工程团队的超大型企业，或对数据本地化留存有特定要求的强监管机构。对绝大多数企业而言，现状依然是 MPLS 专线、硬件防火墙、VPN
              集中器以及各色单点安全产品的混合体——这套组合正是 Cato 及其 SASE 竞对正在全力替代的对象。
            claimRefs:
              - CP001
              - CP016
