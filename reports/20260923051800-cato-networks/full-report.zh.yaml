  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              Gartner 给出并被产业界普遍采纳的 SASE 市场定义，是将软件定义广域网（SD-WAN）与云端交付的安全栈——包含安全 Web
              网关（SWG）、云访问安全代理（CASB）、零信任网络访问（ZTNA）和防火墙即服务（FWaaS）——深度融合成统一平台。Cato Networks 正面切入该赛道，核心目标是替代传统的 MPLS
              专线、本地硬件防火墙、VPN 集中器以及孤立的 SD-WAN 硬件设备。


              统计口径内的支出涵盖企业在 SD-WAN、SSE 各组件（SWG、CASB、ZTNA、FWaaS、DLP、IPS）、全球私有骨干网服务以及托管 SASE 交付方面的订阅支出。不包含在内的支出则有消费级 VPN
              产品、不含安全层的电信运营商托管 MPLS 服务、独立于网络环境销售的终端检测与响应（EDR）平台，以及不含网络访问组件的纯身份服务商。


              具备 TAM 扩张潜力的相邻市场包括扩展检测与响应（XDR）、安全运营中心即服务（SOCaaS）、AI 驱动的网络分析以及 IoT/OT 安全网关。企业目前采用的既有替代方案是首要竞争阻力：用于私有 WAN
              的传统多协议标签交换（MPLS）、用于边界安全的 Palo Alto Networks、Fortinet 和 Check Point 硬件防火墙，以及用于远程访问的 Cisco 和 Juniper 单点 VPN
              集中器。已经签订长期 MPLS 协议的企业面临切实的切换成本与合同绑定，拖慢了 SASE 替代进度；在金融服务和医疗等强监管行业，由于合规证明深度依赖既有基础设施，迁移风险进一步上升。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
