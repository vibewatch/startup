      - number: '3.2'
        title: 核心竞争对手画像
        blocks:
          - type: paragraph
            body: >
              Zscaler（NASDAQ: ZS）是按市值计算体量最大的纯云安全厂商，截至 2025 财年第二季度（截至 2025 年 1 月 31 日当季）公布的过去 12 个月（TTM）收入约为 $2.16B。公司在
              185 个国家服务超过 10,000 家企业客户。Zscaler 的平台以 Zero Trust Exchange 为核心，提供安全 Web
              网关（SWG）、云访问安全代理（CASB）、零信任网络访问（ZTNA）以及数据防泄漏（DLP）。Zscaler 不提供原生 SD-WAN，这将其定位于必须由客户自行解决底层网络连接的“SSE
              优先”厂商。在涵盖网络转型的正面选型对比中，这构成了 Cato 最显著的结构性优势。


              Palo Alto Networks（NASDAQ: PANW）是按收入计算全球最大的纯网络安全公司，2024 财年年收入突破 $8B。其 Prisma SASE 产品结合了 Prisma SD-WAN（2020
              年收购自 CloudGenix）、Prisma Access（SSE）以及依托更广泛平台的 AI 驱动安全能力。Palo Alto 的防火墙及安全产品拥有超过 80,000
              家客户的庞大存量装机盘，为其交叉销售提供了强大支点。然而，Prisma SASE 的架构依靠收购拼装而成，而非原生构建，在集成上难免带来系统复杂性。


              Netskope 是体量最大的未上市纯 SSE 厂商，估计 ARR 达 $300M+，估值在 2022 年达到 $7.5B 峰值，随后收缩至约 $3.4B。Netskope 极度聚焦以数据为中心的安全能力——其
              DLP、CASB 和威胁防护被公认为行业标杆——但同样缺乏原生 SD-WAN，在客户需要同步进行网络改造时吸引力受限。在严峻的一级市场环境下，该公司于 2024 年实施了裁员。


              Fortinet 2024 财年公布收入约为 $5.6B，凭借 FortiGate 硬件集成打法在 SD-WAN 市场占据可观份额。Fortinet SASE（FortiSASE）将 FortiGate
              SD-WAN 与云端交付的 SSE 相融合，但其深厚的硬件设备底色使得部署往往依赖本地硬件，可能拖慢整体云化进度。凭借渠道优势与存量装机基础，Fortinet 在硬件换代周期中依然是强劲对手。


              Cloudflare 2024 财年公布收入约为 $1.625B，以 Cloudflare One 作为其零信任 / SASE 产品套件。Cloudflare
              坐拥庞大的开发者与基础设施受众、极高的品牌知名度以及亲民的定价体系。其覆盖 330+ 个 PoP 节点的网络规模远超 Cato 的 80+ 个，任播（anycast）路由架构性能出众。然而，Cloudflare
              One 目前仍缺乏企业级 SD-WAN 能力，也缺少企业 SASE 选型通常要求的全套安全深度（XDR、EPP）。


              Cisco 凭借 Cisco Umbrella（SSE）、Cisco SD-WAN（Viptela/Meraki）以及 Cisco+ SASE（托管捆绑包）提供碎片化的 SASE 产品组合，公司整体年收入超过
              $50B。Cisco 极深的企业客户关系带来了强大的渠道分销杠杆，但其 SASE 产品欠缺原生融合能力，需要跨越多条产品线与多个管理控制台进行集成。客户反馈中频繁将复杂性列为采纳 Cisco SASE
              的主要阻碍。


              Aryaka Networks 作为托管 SASE 供应商，以完全托管服务形式交付 SD-WAN 与安全能力。Aryaka 争夺的是那些渴望获得 SASE
              成果但内部缺乏部署与运维经验的企业客户。托管模式固然减轻了企业的运维负担，但 Aryaka 的安全能力比 Cato 更单薄，定价中也包含了托管服务溢价。


              VMware VeloCloud SD-WAN 在 Broadcom 于 2023 年完成以 $69B 收购 VMware 后归入其版图，目前在大型企业客户中仍是保有量巨大的 SD-WAN
              存量系统。Broadcom 的产品收缩与精简策略在 VeloCloud 客户中引发了不确定性，Cato 及其他厂商正积极借机推动替代。
