chapter:
  number: 4
  title: Financials
  summary: Cato Networks now discloses more than $415M in ARR and 42% YoY growth, but gross margin, NRR, CAC, and burn remain
    private. The company still appears capitalized for near-term execution, with valuation anchored to a $4.8B private round
    and a pre-IPO disclosure gap.
sections:
- id: SF-revenue-model
  title: Revenue Model, Streams, and Pricing
  body: "Cato Networks operates an almost purely subscription-based revenue model anchored to\nannual recurring revenue (ARR).\
    \ The primary stream \u2014 accounting for an estimated 90\u201393%\nof total revenue \u2014 is cloud subscription fees\
    \ charged to enterprise customers for access\nto the Cato SASE Cloud platform. These subscriptions are typically sold\
    \ as multi-year\nenterprise contracts priced on two primary dimensions: per-user (remote access/ZTNA\nseats) and per-site\
    \ (SD-WAN sockets). Published list pricing runs approximately\n$150\u2013$300 per user per year for the full platform\
    \ stack, with per-site pricing varying\nby bandwidth tier and location count.\n\nSecondary revenue streams include professional\
    \ services and implementation (estimated\n5\u20137% of revenue), hardware/CPE leasing for on-premises Cato Sockets (estimated\
    \ 2\u20133%),\ntraining and certification programs, and expansion/upsell through additional security\nmodules such as\
    \ DLP, XDR, EPP, and AI security capabilities added via the AIM Security\nacquisition. Enterprise commit contracts lock\
    \ in base ARR and create a durable revenue\nfoundation; expansion is driven by location additions, user seat growth, and\
    \ module\nattach rates. MSP and white-label partners resell Cato's platform to their own customers,\ncreating an indirect\
    \ distribution channel that represents approximately 40\u201350% of new\nbookings. Revenue recognition follows standard\
    \ SaaS subscription treatment \u2014 contract\nvalue is deferred and recognized ratably over the contract term. Cato has\
    \ not disclosed\na deferred revenue balance, making it impossible to verify the pipeline of future\nrecognized revenue.\
    \ The platform's multi-service model provides natural land-and-expand\nmechanics, as customers typically start with SD-WAN\
    \ or ZTNA before layering in full\nsecurity services over a 12\u201324 month expansion window.\n"
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI012
