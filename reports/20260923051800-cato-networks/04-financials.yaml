callouts:
- calloutType: risk
  title: Private Backbone COGS Creates Structural Gross Margin Disadvantage
  body: "Cato's decision to build and operate a proprietary global backbone of 85+ PoPs rather than\nleverage hyperscaler\
    \ infrastructure (AWS, Azure, GCP) creates a structural gross margin\ndisadvantage relative to software-only SSE peers.\
    \ Zscaler achieves ~79% gross margin and\nCloudflare ~77% by outsourcing compute and delivery to cloud providers. Cato's\
    \ estimated\ngross margin of 62\u201372% reflects the ongoing cost of PoP colocation, hardware refresh,\nand bandwidth\
    \ contracts. While the private backbone provides latency and security\ndifferentiation, it caps gross margin expansion\
    \ and extends the path to operating\nprofitability. Investors should model a persistent 7\u201317 percentage point gross\
    \ margin gap\nversus public software-only peers when comparing operating leverage trajectories.\n"
  claimRefs:
  - CI008
  - CI009
  - CI011
- calloutType: insight
  title: Capital Adequacy Appears Sufficient Near-Term But Burn Rate Is Unverified
  body: "The $409M Series G at $4.8B valuation provides Cato approximately $289M in primary\nproceeds after the ~$120M employee\
    \ secondary component. At an estimated monthly burn of\n$12\u201325M, this implies a post-raise runway of 12\u201324 months\
    \ from the January 2025 close,\nprojecting a next liquidity event need in Q1 2026\u2013Q1 2027. The window aligns with\
    \ the\nanticipated IPO timeline, though the IPO has already been delayed from original 2023\nexpectations. Capital adequacy\
    \ risk is moderate: the company has demonstrated the ability\nto raise at scale, but continued burn without revenue-driven\
    \ cash flow improvement\nelevates reliance on favorable public market conditions. The AIM Security acquisition adds\n\
    unquantified integration costs.\n"
  claimRefs:
  - CI005
  - CI006
