company:
  name: Cato Networks
chapter:
  number: 1
  title: Company Overview
  summary: Cato Networks is a Tel Aviv-based single-vendor SASE company founded in 2015 by Shlomo Kramer and Gur Shatz. The
    company remains private and now reports more than $415M in ARR and 4,800 customers as of September 2026, after a $4.8B
    Series G and the Aim Security acquisition. The refreshed risk set remains centered on the co-founder split, IPO uncertainty,
    and undisclosed margin/retention metrics.
sections:
- id: SO-identity
  title: Identity, headquarters, founding date, and business model
  body: "Cato Networks Ltd. is a private Israeli cybersecurity company headquartered in Tel Aviv\n(Landmark Tower). The company\
    \ maintains a significant US presence with offices in San Jose,\nCalifornia, and operates globally. Founded in 2015 by\
    \ serial entrepreneur Shlomo Kramer\nand Gur Shatz, Cato officially launched its platform in February 2016, positioning\
    \ itself\nas a pioneer of the Secure Access Service Edge (SASE) category \u2014 a term subsequently\ncoined by Gartner\
    \ in 2019 based largely on Cato's architectural vision.\n\nThe business model is a cloud-delivered subscription platform\
    \ that converges enterprise\nnetworking (SD-WAN) and network security (SWG, CASB, ZTNA, FWaaS, DLP, IPS, XDR, EPP) into\n\
    a single global cloud service. Enterprises pay recurring subscriptions to replace\nfragmented legacy appliances and MPLS\
    \ circuits with Cato's managed cloud backbone. The\nplatform serves organizations of all sizes globally, with particular\
    \ traction among\nmid-market to large enterprises in retail, manufacturing, financial services, and other\ndistributed-workforce\
    \ sectors. Revenue is almost entirely ARR-based, with a gross dollar\nretention rate exceeding 95% and channel partners\
    \ playing an increasing role as Cato\nexpands its managed SASE service ecosystem.\n\nThe company holds Private-Disclosed\
    \ status \u2014 it publicly reports ARR milestones, customer\ncounts, and material funding events, but withholds operating\
    \ margin, absolute revenue,\nheadcount, and customer-level economics.\n"
  claimRefs:
  - CO001
  - CO004
  figureRefs:
  - FO001
  tableRefs: []
- id: SO-founders
  title: Founders, leadership, board, and governance
  body: 'Cato was co-founded by two veterans of Israel''s cybersecurity industry. Shlomo Kramer,

    CEO, previously co-founded Check Point Software Technologies (global firewall pioneer) and

    Imperva (sold to Thoma Bravo for $2.1B and subsequently to Thales for $3.6B). Gur Shatz,

    co-founder, previously founded Incapsula (acquired by Imperva) and served as Cato''s

    president and COO until January 2024, when he departed after a reported dispute with

    Kramer. Shatz retains a board seat. The Kramer-Shatz split after nearly 20 years of

    partnership is a notable key-person and governance risk, addressed further in the risks

    chapter.


    The current leadership bench includes Eyal Heiman (CTO), Ofir Agasi (CPO), Tomer Wald

    (CFO), Nick Fan (CRO), and Alon Alter (Chief Business Officer). The bench was deepened

    ahead of the anticipated IPO. The board reflects strong VC representation: Ravi Mhatre and

    Yoni Cheifetz (LightSpeed), Jerry Chen (Greylock), plus independent directors Eyal Waldman

    (founder of Mellanox, sold to Nvidia for $7B) and Gili Iohan (former CFO of Varonis,

    partner at ION Crossover Partners) who joined in October 2024. Ronen Faier serves as a

    further independent director. The board composition signals pre-IPO professionalization and

    reflects preparation for public markets.

    '
  claimRefs:
  - CO002
  - CO003
  tableRefs:
  - TO002
  figureRefs: []
- id: SO-capital
  title: Funding history, valuation, and investor map
  body: 'Cato has raised over $1 billion in total since 2015, progressing through eight funding

    rounds. The company achieved unicorn status in November 2020 with a $130M Series E that

    valued it above $1B. The most recent institutional round, Series G in June 2025, raised

    $359M at a $4.8B valuation, led by Vitruvian Partners and ION Crossover Partners, with

    participation from LightSpeed, Acrew Capital, and Adams Street Partners. In September 2025,

    the Series G was extended by $50M from Acrew Capital on the same terms, bringing the total

    to $409M. Approximately $120M of the Series G proceeds were allocated to an employee

    secondary sale, providing liquidity for long-tenured staff ahead of a delayed IPO.


    Prior rounds include: Series A ($20M, 2015), Series B ($50M, 2016), Series C ($55M, 2019),

    Series D ($77M, April 2020), Series E ($130M, November 2020), and the 2021 Series F

    ($200M, $2.5B valuation). The 2023 round ($238M, $3B+ valuation) was led by LightSpeed

    and brought total raised to $773M. Historical investors include Greylock, Coatue, SoftBank

    Vision Fund 2, Singtel Innov8, Adams Street Partners, and US Venture Partners.

    '
  claimRefs:
  - CO012
  tableRefs:
  - TO003
  figureRefs: []
- id: SO-metrics
  title: Cover metrics, operating performance, and market recognition
  body: "Cato has publicly disclosed a series of ARR milestones: $100M in November 2022 (60%+ YoY),\n$200M+ in Q2 2024 (doubled\
    \ in under two years), $250M at end of 2024 (46% YoY growth),\nand $300M+ in September 2025. The company reported 59%\
    \ GAAP revenue growth in 2023 versus\n2022. The customer base reached 2,500 in July 2024 and 3,500 large enterprise customers\
    \ by\nJune 2025. Gross dollar retention exceeds 95%. Cato has not publicly disclosed absolute\nnet revenue, gross margin,\
    \ EBITDA, or customer ACV; management acknowledged in mid-2025\nthat the company was not yet profitable.\n\nIn July 2024,\
    \ Gartner named Cato a Leader in the Magic Quadrant for Single-Vendor SASE for\nthe first time, placing it second behind\
    \ Palo Alto Networks. The Forrester Wave Q3 2023\nnamed Cato \"ZTE/SASE Leader.\" On Gartner Peer Insights, Cato had a\
    \ 4.7/5 rating with 183+\nverified reviews as of July 2024 \u2014 more than 10x the review count of any other Leader.\n"
  claimRefs:
  - CO013
  - CO014
  - CO015
  - CO016
  tableRefs:
  - TO001
  figureRefs: []
- id: SO-milestones
  title: Key milestones, adverse events, and strategic trajectory
  body: "Cato's trajectory spans product inception (2015-16), rapid growth powered by remote-work\ntailwinds (2019-22), multiple\
    \ large funding rounds (2020-23), and a pre-IPO phase (2024-26).\nThe November 2022 ARR milestone demonstrated the fastest\
    \ $0-$100M path in enterprise\nnetwork security history. The company beat its prior fundraise pace with the 2023 round\n\
    reaching a $3B+ valuation despite broader VC market headwinds.\n\nAdverse events include the January 2024 departure of\
    \ co-founder Gur Shatz after a reported\ndispute \u2014 a material governance and key-person risk. The IPO process, initially\
    \ targeting\nlate 2024, was subsequently pushed to early 2025, then frozen in May 2025 as Cato\nreportedly explored a\
    \ sale amid valuation concerns raised by potential acquirers. The\ncompany raised the Series G in June 2025 instead, partly\
    \ to provide secondary liquidity to\nemployees. As of the run date, no IPO or sale has been announced. Cato made its first\n\
    acquisition in September 2025, buying Aim Security (an AI security startup) to expand into\nenterprise AI security, concurrent\
    \ with the $300M ARR announcement.\n"
  claimRefs:
  - CO013
  - CO016
  figureRefs: []
  tableRefs: []
