  topStrengths:
    - |
      从底层自主构建的单一厂商 SASE 架构（SPACE 引擎）彻底消除了竞争对手靠并购拼凑点状产品所积累的集成债务与运维复杂度；Gartner 魔力象限领导者地位进一步验证了该技术差异化。
    - |
      创始人声誉护城河：Shlomo Kramer 曾联合创立 Check Point 与 Imperva，为公司带来了早期对手无法复制的大企业信任背书、渠道关系以及行业分析师公信力。
    - |
      中端市场客户密度扎实（约 4,000 家客户，估计 ARR $350M+），凭借多模块增购空间（EDR、XDR、ZTNA、CASB、DLP）与 MSSP 渠道杠杆，驱动高效的落地扩张。
  topRisks:
    - Palo Alto Networks 与 Cisco 发起的平台整合攻势，可能在大型企业选型比对（bake-off）中挤压其定价空间与中标率。
    - FedRAMP 认证尚未落地，限制了其切入体量可观的美国公共部门市场，导致联邦业务缺口持续拉大。
    - IPO 窗口停滞与战略出售不确定性使得退出时机与估值支撑模糊，同时 NRR、毛利率与烧钱速度仍未披露。
  unresolvedGaps:
    - NRR、毛利率、营业成本（COGS）结构及烧钱速度仍未公开，而这些关键指标恰恰是审慎评估该业务的门槛底线。
    - FedRAMP 认证获批时间仍不明朗，导致此前对联邦政府 TAM 的测算假设无法得到验证。
    - 退出路径仍存变数：IPO 时点尚不明朗，而若按当前估值寻求战略出售，则必须找到具备明确协同效应的买家。
