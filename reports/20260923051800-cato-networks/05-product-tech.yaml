    - 'Full: proprietary software; MDM-deployable'
    - OS vendor APIs (Windows network extension, macOS system extension, iOS/Android VPN APIs)
    - OS security model changes (e.g., macOS deprecating network extensions) could require agent re-architecture
  - - Threat intelligence and Security Research
    - Feed ingestion from hundreds of external providers; AI/ML quality validation; rule simulation before deployment
    - 'Partial: Cato owns validation and deployment logic; feeds sourced externally'
    - Third-party feed quality and continuity; Cato Security Research team capacity
    - Third-party feed provider outage or feed poisoning affects detection efficacy for all customers simultaneously
