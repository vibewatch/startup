- id: TE002
  title: Workflow / use-case table
  columns:
  - User Job / Use Case
  - Current Legacy Workflow
  - Cato Solution
  - Measurable Benefit
  - Limitation
  rows:
  - - MPLS replacement for branch WAN
    - Dedicated MPLS at $500-1500/Mbps/month; rigid; carrier-managed; weeks to provision changes
    - Cato Socket at each site connects to nearest PoP over broadband or cellular; private backbone provides MPLS-equivalent
      reliability
    - 30-70% WAN cost reduction; 5-30x bandwidth increase; site provisioned in hours vs. weeks
    - Backbone SLA attainment not independently audited; emerging market PoP density may be thinner
  - - Remote access and Zero Trust for distributed workforce
    - VPN concentrators; hub-and-spoke routing; no post-connection inspection; appliance CapEx and scaling complexity
    - Cato Client with ZTNA; always-on routing via PoP; identity-based access; SPACE inspects entire session continuously
    - Eliminates VPN appliance CapEx; microsegmentation; continuous threat inspection post-connection
    - Requires Cato Client install; agentless access available but with reduced policy enforcement capabilities
  - - Cloud and SaaS security
    - Standalone CASB proxy; fragmented DLP policies across cloud and on-premises; no unified SaaS visibility
    - CASB and DLP within SPACE; all SaaS and cloud traffic inspected inline; Shadow IT discovery
    - Unified SaaS policy for all users regardless of location; real-time DLP enforcement on all traffic
    - SaaS application control granularity weaker than Palo Alto NGFW per Gartner 2024 caution
  - - Endpoint threat detection and response
    - Separate EPP vendor; separate SIEM for log aggregation; disconnected tools creating alert fatigue
    - Cato EPP plus XDR in same platform; events correlated in unified data lake; AI-prioritized incidents
    - Reduced tool count; unified network and endpoint correlation reduces MTTR; SIEM integration eliminated
    - EPP efficacy vs. specialized endpoint security vendors (CrowdStrike Falcon) not externally benchmarked
  - - Multi-site global enterprise WAN
    - Multiple SD-WAN vendors by region; separate security layers; fragmented policies; multiple vendor support contracts
    - Single Cato platform globally; CMA policy applies to all edges everywhere; one support relationship
    - Operational simplicity; consistent global policy; consolidated support and billing
    - Single-vendor concentration risk; migration off platform requires replacing networking and security simultaneously
  - - OT and IoT network security
    - Air-gapped or VLAN-isolated OT networks; manual device inventory; no inline traffic inspection
    - Cato IoT/OT Security discovers and classifies devices; SPACE applies inline threat prevention; CMA manages policies
    - Real-time OT device visibility; SPACE threat prevention without a separate OT security product
    - OT protocol depth (e.g., Modbus, DNP3) and ICS-specific detection signatures not documented publicly
  claimRefs:
