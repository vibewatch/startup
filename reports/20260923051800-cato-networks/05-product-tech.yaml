  - id: CE007
    statement: 'Cato EPP (Endpoint Protection Platform), generally available in 2024, is described

      as the industry''s first SASE-managed EPP solution. It scans 300+ file types for

      known, polymorphic, zero-day, and fileless malware using rule-based analysis, machine

      learning, heuristics, and process behavioral analysis. EPP is managed entirely through

      the Cato Management Application alongside all other SASE capabilities - no separate EPP

      console or SIEM integration is required. EPP events feed into the same unified data

      lake as SPACE events, enabling XDR correlation of endpoint and network telemetry.

      '
