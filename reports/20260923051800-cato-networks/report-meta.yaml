  topStrengths:
  - 'Ground-up single-vendor SASE architecture (SPACE engine) eliminates integration debt and operational
    complexity competitors accumulate when bolting together acquired point products; Gartner Magic Quadrant
    Leader recognition validates differentiation.

    '
  - 'Founder-credibility moat: Shlomo Kramer co-founded Check Point and Imperva, bringing enterprise trust,
    channel relationships, and analyst credibility that seed-stage competitors cannot replicate.

    '
  - 'Strong mid-market customer density (~4,000 customers, $350M+ estimated ARR) with multi-module upsell
    surface (EDR, XDR, ZTNA, CASB, DLP) and MSSP-channel leverage for efficient land-and-expand growth.

    '
  topRisks:
  - Platform consolidation by Palo Alto Networks and Cisco can pressure pricing and win rates in enterprise
    bake-offs.
  - FedRAMP remains unresolved, limiting access to a meaningful U.S. public-sector TAM and prolonging
    the federal gap.
  - IPO freeze and strategic-sale uncertainty keep exit timing and valuation support unclear while NRR,
    gross margin, and burn remain undisclosed.
  unresolvedGaps:
  - NRR, gross margin, COGS structure, and burn rate remain non-public; these are still threshold metrics
    for underwriting the business.
  - FedRAMP authorization timing is still unclear, leaving the federal TAM assumption unverified.
  - 'Exit pathway remains uncertain: IPO timing is still unclear and a strategic sale at the current valuation
    would need an obvious synergy buyer.'
