- id: SP-competitor-profiles
  title: Major Competitor Profiles
  body: "Zscaler (NASDAQ: ZS) is the largest pure-play cloud security vendor by market capitalization\nand reported approximately\
    \ $2.16B in trailing twelve-month revenue as of its Q2 FY2025\nresults (quarter ending January 31, 2025). The company\
    \ serves over 10,000 enterprise\ncustomers across 185 countries. Zscaler's platform centers on its Zero Trust Exchange,\n\
    delivering Secure Web Gateway (SWG), Cloud Access Security Broker (CASB), Zero Trust\nNetwork Access (ZTNA), and Data\
    \ Loss Prevention (DLP). Zscaler does not offer native\nSD-WAN, positioning it as an SSE-first vendor that requires customers\
    \ to bring their own\nunderlay networking. This is Cato's most significant structural advantage in head-to-head\nevaluations\
    \ where networking transformation is in scope.\n\nPalo Alto Networks (NASDAQ: PANW) is the world's largest pure-play cybersecurity\
    \ company\nby revenue, with FY2024 annual revenue exceeding $8B. Its Prisma SASE product combines\nPrisma SD-WAN (acquired\
    \ from CloudGenix in 2020), Prisma Access (SSE), and AI-powered\nsecurity from its broader platform. Palo Alto benefits\
    \ from an enormous enterprise installed\nbase of over 80,000 customers for its firewall and security products, enabling\
    \ a powerful\ncross-sell motion. However, Prisma SASE's architecture is assembled from acquisitions rather\nthan built\
    \ natively, which can introduce integration complexity.\n\nNetskope is the largest private pure-play SSE vendor, with\
    \ an estimated $300M+ ARR and a\nvaluation that peaked at $7.5B in 2022 before compression to approximately $3.4B. Netskope\n\
    is deeply focused on data-centric security \u2014 its DLP, CASB, and threat protection are\nconsidered industry-leading\
    \ \u2014 but lacks native SD-WAN, limiting its appeal when\nnetworking transformation is required. The company conducted\
    \ layoffs in 2024 amid\nchallenging private market conditions.\n\nFortinet reported approximately $5.6B in FY2024 revenue\
    \ and holds a significant SD-WAN\nmarket share through its FortiGate hardware-integrated approach. Fortinet SASE (FortiSASE)\n\
    combines FortiGate SD-WAN with cloud-delivered SSE, but its hardware appliance roots mean\ndeployments frequently involve\
    \ on-premises dependencies that can delay full cloud migration.\nFortinet's channel strength and installed base make it\
    \ a formidable competitor in\nhardware-refresh cycles.\n\nCloudflare reported approximately $1.625B in FY2024 revenue\
    \ and offers Cloudflare One as\nits Zero Trust / SASE product suite. Cloudflare benefits from a massive developer and\n\
    infrastructure audience, strong brand recognition, and competitive pricing. Its network of\n330+ PoPs exceeds Cato's 80+,\
    \ and its anycast routing architecture provides strong\nperformance. However, Cloudflare One currently lacks the enterprise\
    \ SD-WAN capabilities\nand the full security breadth (XDR, EPP) that enterprise SASE evaluations typically require.\n\n\
    Cisco offers a fragmented SASE portfolio through Cisco Umbrella (SSE), Cisco SD-WAN\n(Viptela/Meraki), and Cisco+ SASE\
    \ (managed bundle), with total company revenue exceeding\n$50B annually. Cisco's vast enterprise relationships provide\
    \ powerful distribution leverage,\nbut its SASE product lacks native convergence, requiring integration across multiple\
    \ product\nlines and management consoles. Customer feedback frequently cites complexity as a barrier\nto Cisco SASE adoption.\n\
    \nAryaka Networks operates as a managed SASE provider, delivering SD-WAN and security\nas a fully managed service. Aryaka\
    \ competes for enterprises that want SASE outcomes without\nin-house expertise to deploy and operate the platform. While\
    \ Aryaka's managed model reduces\noperational burden, its security capabilities are narrower than Cato's and its pricing\n\
    carries a managed-service premium.\n\nVMware VeloCloud SD-WAN, now part of Broadcom's portfolio following the $69B VMware\n\
    acquisition completed in 2023, remains a significant SD-WAN incumbent in large enterprise\naccounts. Broadcom's product\
    \ rationalization strategy has created uncertainty among\nVeloCloud customers, which Cato and others are actively targeting\
    \ for displacement.\n"
