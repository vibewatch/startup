callouts:
- calloutType: strength
  title: Gartner Peer Insights Dominance Signals Unusually Strong Customer Satisfaction
  body: "Cato Networks' 4.7/5.0 rating from 183 verified Gartner Peer Insights reviews \u2014 10x\nmore than any other Single-Vendor\
    \ SASE Leader \u2014 is a highly credible independent signal\nof customer satisfaction. Gartner's verification process\
    \ requires reviewers to be\nauthenticated enterprise customers with real deployments. At 183 reviews, the sample\nsize\
    \ is statistically meaningful for an enterprise technology segment. The \"Customers'\nChoice\" designation in 2024 further\
    \ confirms that active customers regard Cato's platform\nas a strong performer. This breadth of independent review activity\
    \ at scale is unusual\nin enterprise networking and constitutes a durability signal that is difficult to replicate\nthrough\
    \ marketing alone.\n"
  claimRefs:
  - CU009
  - CU010
  - CU011
- calloutType: risk
  title: NRR Gap Limits Full Retention Underwriting
  body: "While Cato's GDR >95% is a strong floor signal, the absence of publicly disclosed net\nrevenue retention rate prevents\
    \ full assessment of expansion ARR quality. For a company\nat $300M ARR with a land-and-expand model, NRR is a critical\
    \ value-creation driver \u2014\na 120% NRR implies $36M of ARR generated annually from existing customers with zero new\n\
    logo cost. Without NRR, the expansion motion's contribution to ARR growth cannot be\nseparated from new logo additions,\
    \ making it impossible to assess whether growth\ndecelerates if new logo acquisition slows. The NRR disclosure gap is\
    \ a material\ndiligence ask and should be a precondition for any term sheet conversation.\n"
  claimRefs:
  - CU008
