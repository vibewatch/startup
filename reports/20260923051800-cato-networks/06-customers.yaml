chapter:
  number: 6
  title: Customers
  summary: Cato Networks serves 4,800+ enterprise customers globally as of September 2026, with broad manufacturing, retail,
    and distributed-workforce adoption. Public evidence remains strongest on named deployments, satisfaction, and channel
    breadth, while NRR, concentration, and pricing sensitivity remain partially opaque.
sections:
- id: SU-segmentation
  title: Customer Base Overview and Segmentation
  body: "Cato Networks serves 3,500+ enterprise customers across 150+ countries as of June 2025,\nmaking it the largest single-vendor\
    \ SASE provider by publicly reported customer count.\nThe customer base spans six confirmed industry verticals: manufacturing\
    \ (the dominant\ncategory by named deployment volume), automotive, retail, professional services, aviation,\nand office\
    \ products. Geographically, Cato's deployments are concentrated in Europe (where\nseveral of the largest named deployments\
    \ originate) and North America, with growing\npresence in Asia-Pacific through its Japanese retail deployments (Ryohin\
    \ Keikaku/MUJI)\nand APAC PoP expansion.\n\nThe implied average contract value (ACV) at $300M ARR and 3,500 customers\
    \ is approximately\n$85,000 per year, consistent with mid-market to lower-large-enterprise positioning. Named\ndeployments\
    \ range from companies with 3,200 employees (MUJI) to global corporations with\n23,000+ employees (O-I Glass, Vitesco\
    \ Technologies), suggesting Cato serves a broad ACV\nband within the enterprise tier. The buyer persona is the CISO or\
    \ VP of IT Infrastructure\nat distributed-workforce organizations requiring multi-site networking and security\nconvergence.\
    \ Cato's certifications (SOC 2 Type II, ISO 27001, PCI DSS Level 1, HIPAA,\nGDPR, Cyber Essentials UK) address regulated-industry\
    \ buyers in financial services,\nhealthcare, and retail. The payer profile is primarily direct enterprise procurement,\n\
    with approximately 40\u201350% of new bookings flowing through MSP and VAR channel partners\nwho resell Cato's platform\
    \ under the \"Powered by Cato\" program.\n"
  claimRefs:
  - CU001
  - CU002
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: SU-adoption
  title: Adoption Trajectory and Scale Evidence
  body: "Cato Networks has demonstrated one of the fastest ARR growth trajectories in enterprise\nnetworking security. From\
    \ $100M ARR in 2021 (approximately 5\u20136 years post-founding), the\ncompany doubled to $200M ARR by July 2024, then\
    \ reached $250M ARR at year-end 2024\n(representing 46% year-on-year growth), and surpassed $300M ARR by September 2025.\n\
    Corresponding customer count grew from approximately 1,000\u20131,500 at the $100M milestone\nto 2,500+ by July 2024,\
    \ 3,000+ by February 2025, and 3,500+ by June 2025 \u2014 a 40%\nincrease in less than 12 months.\n\nThis trajectory is\
    \ corroborated by Cato's global deployment infrastructure: 85+ PoPs\nacross 150+ countries represent physical adoption\
    \ evidence. Channel momentum further\nconfirms adoption: 150+ exclusive \"Powered by Cato\" managed service partners demonstrate\n\
    that third-party MSPs are committing to platform-exclusive GTM motions, a stronger\nadoption signal than non-exclusive\
    \ VAR relationships. Gartner Peer Insights review volume\n(183 verified reviews as of July 2024, 10x more than any other\
    \ SASE Leader) suggests\na large, actively engaged installed base of users willing to leave public feedback \u2014\na\
    \ reliable proxy for real deployment breadth. The 85+ country PoP footprint is\noperationally consistent with serving\
    \ 150+ countries at enterprise SLA levels.\n"
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU012
  - CU013
  tableRefs:
  - TU002
  figureRefs: []
- id: SU-named
  title: Named Customer Deployments and Proof Quality
  body: "Cato Networks has published case studies for at least ten named enterprise customers in\nproduction, constituting\
    \ high-quality deployment proof. Carlsberg Group (global brewing)\ndeployed Cato SASE across 200+ locations and 25,000+\
    \ remote users, replacing legacy VPN\nand SD-WAN infrastructure. O-I Glass, a $7 billion packaging manufacturer, deployed\n\
    across 150+ factories in 20 countries for 23,000 employees. Ryohin Keikaku (MUJI)\nconnected 820+ locations with 3,200+\
    \ employees across Japan and international markets.\nVitesco Technologies, a $10 billion German automotive supplier, deployed\
    \ across 90+\nlocations for 24,000 remote users. Sixt (global car rental) deployed for branch and remote\naccess in Europe\
    \ and the Americas. Swissport (aviation ground handling) deployed for\nairport connectivity. ACCO Brands, Haulotte (construction\
    \ equipment), Juki (sewing\nmachines), and Fl\xFCgger Group (Nordic retail and manufacturing) round out the published\n\
    named customer set.\n\nEvidence quality is high for the core six deployments (Carlsberg, O-I, MUJI, Vitesco,\nSixt, Swissport):\
    \ all have official Cato case studies with specifics on deployment scale,\noutcomes achieved, and use cases. All are described\
    \ as production deployments in active\nongoing use \u2014 no published case study identifies a discontinued pilot. The\
    \ manufacturing\nand automotive verticals dominate by named deployment volume, reflecting Cato's apparent\nstrength in\
    \ multi-site, geographically dispersed operational technology environments.\n"
  claimRefs:
  - CU014
  - CU015
  - CU016
  tableRefs:
  - TU003
  figureRefs: []
- id: SU-retention
  title: Retention, Satisfaction, and Durability Evidence
  body: "Cato Networks' disclosed gross dollar retention rate of >95% (September 2023) is the\nprimary public retention signal.\
    \ GDR >95% is a strong retention indicator for enterprise\nSaaS; best-in-class SaaS benchmarks (Bessemer, SaaS Capital)\
    \ place the 95th percentile\nat approximately 95%+ GDR. Net revenue retention is not publicly disclosed, preventing\n\
    full assessment of expansion ARR contribution. Gartner Peer Insights satisfaction evidence\nis strong: 4.7/5.0 overall\
    \ rating across 183 verified reviews, with Gartner designating\nCato as a \"Customers' Choice\" in 2024. Enterprise reviewers\
    \ on PeerSpot and G2 generally\nrate the platform above 4.0/5.0 overall, with the most cited shortcomings being initial\n\
    configuration complexity and initial learning curve \u2014 barriers to adoption rather than\ndrivers of churn. A minority\
    \ of Gartner Peer Insights reviewers flag latency variability\non specific PoP routing paths and implementation complexity,\
    \ creating a modest adverse\nsignal against the dominant positive reviews. No published evidence of significant churn\n\
    campaigns, customer wins by competitors directly from Cato's installed base, or major\nproduct recalls exists in the public\
    \ record as of the research date.\n"
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU011
  tableRefs: []
  figureRefs: []
- id: SU-expansion
  title: Expansion, Concentration, and Channel Risk
  body: "Cato Networks' land-and-expand motion is driven by modular security add-ons (DLP, XDR,\nEPP, AI security) and location/seat\
    \ expansion as organizations grow. The \"Powered by Cato\"\nchannel program \u2014 revamped in 2025 \u2014 provides 150+\
    \ exclusive MSP partners who resell the\nplatform and drive expansion among SMB-to-mid-market tiers that the direct sales\
    \ force\ndoes not reach. Channel accounts for approximately 40\u201350% of new bookings, reducing\ntop-customer concentration\
    \ risk in the direct book of business. However, Cato does not\npublicly disclose top-customer revenue concentration or\
    \ whether any single customer\nexceeds 5% of total ARR; this is a material diligence gap for concentration assessment.\n\
    ACV/CAC/LTV data is also not publicly available, making it impossible to assess the\nprofitability of the channel book\
    \ versus the direct book. The \"Powered by Cato\" exclusivity\ncreates partner lock-in that supports retention but also\
    \ creates concentration risk if a\nmajor MSP partner churns or is acquired. The combination of multi-year enterprise contracts,\n\
    high GDR, and channel breadth provides reasonable confidence that the revenue base is\ndurable, but the absence of NRR\
    \ and concentration data limits full underwriting certainty.\n"
  claimRefs:
  - CU013
  tableRefs: []
  figureRefs: []
