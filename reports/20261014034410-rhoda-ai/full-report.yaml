  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition, Foundation Intelligence, and Hardware Form Factor
        blocks:
          - type: paragraph
            body: >-
              Rhoda AI develops a full-stack robotics intelligence platform that formulates physical robot control as
              real-time causal video prediction rather than traditional trajectory coding or discrete action-token
              policies. The company's core software offering, the FutureVision platform, is engineered to handle dynamic
              real-world variability across industrial logistics and assembly facilities where material configurations
              and factory layouts fluctuate continuously. Unlike pre-programmed industrial robotic arms or specialized
              fixed-function automation, Rhoda AI pairs its foundation model with proprietary mobile manipulator
              hardware designed for commercial durability. The physical platform features an omnidirectional wheeled
              base, dual seven-degree-of-freedom arms, and dexterous three-fingered hands engineered to manipulate
              payloads of 25 kilograms continuously and up to 45 kilograms close to the chassis. By rejecting bipedal
              humanoid legs in favor of an inherently stable wheeled chassis, Rhoda AI eliminates the catastrophic
              tip-over and fall hazards that occur during emergency power cuts, ensuring direct operational
              compatibility with existing automated guided vehicles and warehouse fleet standards.
