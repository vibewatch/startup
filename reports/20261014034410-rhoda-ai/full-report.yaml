      - number: '8.3'
        title: 'Scenario Analysis: Bull, Base, and Bear Return Profiles'
        blocks:
          - type: paragraph
            body: >-
              To evaluate Rhoda AI's risk-adjusted return profile, we model three distinct commercial adoption scenarios
              across a three- to five-year investment horizon. Under the bull case (25% probability), Rhoda AI
              successfully converts current manufacturing and logistics evaluations into multi-facility commercial
              rollouts. Underwriting assumptions popularized by syndicate partner Mayfield project that deploying 1,000
              mobile manipulators under a Labor-as-a-Service model could yield approximately $100 million in annual
              recurring revenue from the $30 trillion global manual labor market, eventually scaling toward a
              billion-dollar run rate at 10,000 units. In this scenario, Rhoda AI achieves market leadership in
              industrial manipulation, expanding its valuation toward $5 billion to $8 billion and generating a 3x to 5x
              return for Series A investors.


              Under the base case (50% probability), Rhoda AI achieves steady but measured adoption, encountering
              standard industrial procurement cycles, facility integration hurdles, and extensive safety certifications.
              The company deploys 150 to 300 units across logistics returns processing and structured manufacturing
              cells by 2028, generating $15 million to $30 million in combined hardware and model licensing revenue.
              Growth deceleration and sector-wide multiple normalization compress its forward enterprise value multiple
              to a market-conforming range, yielding an estimated valuation of $1.5 billion to $2.2 billion and flat to
              modest capital appreciation. In the bear case (25% probability), model generalization stumbles against
              unforeseen edge cases on live production floors, causing cycle disruptions and customer churn. High
              compute burn for continuous video foundation model training depletes the $450 million treasury without
              reaching unit economic breakeven, precipitating a down-round or structured recapitalization between $400
              million and $700 million where the senior liquidation preference wipes out common equity.
            claimRefs:
