      - number: '4.3'
        title: Capital Adequacy, Cash Burn Trajectory, and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Rhoda's financial runway is anchored by its $450 million Series A financing closed in March 2026, which
              represents one of the largest early-stage capitalization events in industrial robotics history. Backed by
              top-tier venture firms including Khosla Ventures, Temasek, Mayfield, Premji Invest, and Capricorn
              Investment Group, the company possesses an enviable liquidity cushion. Management plans to allocate this
              capital across three capital-intensive vectors: scaling model pre-training compute clusters, expanding
              production pilot deployments with manufacturing partners, and growing its technical workforce beyond its
              initial 100-plus employees. Despite this substantial balance sheet, forward cash burn is projected to be
              intense. Training generative video models on hundreds of millions of web videos demands tens of millions
              of dollars in compute infrastructure, while hardware engineering, testing facilities, and customer pilot
              subsidization rapidly consume working capital. With commercialization still in exploratory pilot phases,
              Rhoda faces complete dependency on venture capital and strategic balance sheet support until production
