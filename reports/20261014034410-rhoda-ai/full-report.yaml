      - number: '4.2'
        title: Cost Structure, Gross Margin Dynamics, and Hardware Delivery Drivers
        blocks:
          - type: paragraph
            body: >-
              The financial viability of Rhoda's physical AI model depends heavily on unit-level cost structure and the
              computational intensity of Direct Video Action. Unlike imitation-learning platforms that demand hundreds
              of hours of teleoperation data per manipulation skill, Rhoda pre-trains on internet-scale video to
              establish an inherent physics prior, reducing post-training requirements to between 1 and 10 hours of
              robot-specific trajectory data. This creates significant data-efficiency advantages that suppress
              skill-onboarding costs. However, operational delivery introduces substantial cost-of-goods-sold (COGS)
              pressures. Running closed-loop video predictive control dozens of times per second requires either
              dedicated high-performance on-robot edge accelerators or persistent low-latency cloud inference, each
              carrying significant power, thermal, or bandwidth costs. Furthermore, building and maintaining custom
              wheeled mobile manipulators incurs hardware depreciation, actuator replacement, and field maintenance
              expenses that traditional software providers avoid. CEO Jagdeep Singh noted that existing industrial
              humanoid prototypes are fragile toys incapable of sustained industrial shifts, underscoring that
              engineering ruggedized production-grade hardware requires substantial recurring maintenance reserves.
              Gross margins will diverge sharply between software licensing (~75-85%) and full-stack hardware delivery
              (~35-50%), necessitating strict underwriting of blended corporate margins.
            claimRefs:
              - CI009
              - CI010
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
