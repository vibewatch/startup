      - number: '2.3'
        title: 'Buyer Segmentation: Plant Economics, Safety Constraints, and Form Factor Preferences'
        blocks:
          - type: paragraph
            body: >-
              Enterprise procurement decisions within Rhoda AI's target segments are governed by plant-level operational
              managers, workplace safety officers, and capital allocation committees with stringent payback thresholds.
              In automotive manufacturing and logistics distribution centers, typical enterprise buyers require new
              automation systems to demonstrate full capital payback within 12 to 24 months, measured primarily through
              labor replacement, throughput acceleration, and ergonomics risk reduction. A critical divergence has
              emerged between academic robotics demonstrations and commercial customer preferences regarding physical
              form factors. While venture funding has heavily subsidized bipedal humanoid robots designed to replicate
              human anatomy, industrial operations executives express strong preference for wheeled mobile manipulators.
              Wheeled bases integrate seamlessly into existing facility traffic layouts alongside automated guided
              vehicles (AGVs) and autonomous mobile robots (AMRs), avoiding the severe tip-over hazards inherent in
              bipedal locomotion. As noted by company leadership and trade association observations, sudden emergency
              stops (e-stops) on bipedal humanoids risk catastrophic collapses that damage surrounding machinery or
              injure human personnel, whereas wheeled mobile manipulators maintain stable static equilibrium. Rhoda AI's
              deliberate engineering choice to pair a wheeled base with seven-degree-of-freedom arms, dexterous
              three-finger hands, and a 45-kilogram payload capacity reflects direct alignment with industrial factory
              safety standards and procurement expectations.
            claimRefs:
              - CM006
              - CM007
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
