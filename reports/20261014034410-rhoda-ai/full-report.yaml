            title: Wheeled Mobile Manipulators Address Immediate Industrial Safety and Adoption Barriers
            body: >-
              While public attention centers on bipedal humanoid robotics, industrial plant managers strongly favor
              wheeled mobile platforms with dexterous arms. Wheeled bases integrate seamlessly with existing automated
              guided vehicle (AGV) floor layouts and eliminate dangerous dynamic fall hazards during emergency stops.
