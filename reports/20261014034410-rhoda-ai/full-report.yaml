      - number: '3.2'
        title: Competitor Profiles, Technical Architecture, and Capability Comparison
        blocks:
          - type: paragraph
            body: >-
              Evaluating competitor capabilities reveals fundamental architectural divergences between
              Vision-Language-Action (VLA) models, teleoperation-intensive pipelines, and Rhoda's Direct Video-Action
              (DVA) architecture. Mainstream VLA models process image tokens and text prompts to infer action sequences,
              but independent analyses and industry commentary observe that mainstream VLAs typically operate over short
              context windows of only a few video frames. This limitation causes accuracy degradation in long-horizon
              tracking tasks or sequential object manipulation steps. Furthermore, conventional robot policy training
              depends heavily on expensive hardware teleoperation, often requiring thousands of hours of robot-specific
              demonstrations to master a new task. In contrast, Rhoda pretrains FutureVision on hundreds of millions of
              internet videos to establish physical priors before fine-tuning with approximately 10 hours of
              embodiment-specific teleoperation data, achieving closed-loop control cycles updated every few hundred
              milliseconds. However, rival pure-play foundation models like Skild AI command substantially larger
              capital reserves ($1.4B round) and broad hardware-agnostic multi-embodiment partnerships, while humanoid
              developers like Figure AI leverage proprietary bipedal form factors directly targeted at humanoid
              logistics and manufacturing workflows. Status quo industrial robotics vendors maintain virtually 100%
              deterministic reliability within structured lines, contrasting with foundation model platforms that still
              undergo operational pilot validation.
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
