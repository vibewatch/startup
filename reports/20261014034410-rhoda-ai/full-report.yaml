      - number: '1.4'
        title: Platform Architecture Milestones and Commercial Deployment Realities
        blocks:
          - type: paragraph
            body: >-
              At the core of Rhoda AI's technological proposition is FutureVision, powered by a Direct Video Action
              (DVA) architecture that reformulates robotic control as a continuous video-predictive task. The model is
              pretrained on hundreds of millions of public internet videos to build generalized representations of
              motion, physics, and object dynamics before undergoing post-training on 1 to 10 hours of robot-specific
              trajectory data. Closed-loop control runs every few hundred milliseconds, observing environmental states
              and predicting motor actions to handle shifting layouts and unstructured objects. In industrial trials,
              Rhoda demonstrated autonomous component processing completed in under two minutes per cycle. To
              commercialize this stack, Rhoda pursues a dual business model combining proprietary wheeled mobile
              manipulators equipped with 7-DoF arms and dexterous hands with third-party software licensing.
              Nonetheless, critical diligence risks persist: independent analysts highlight that stealth-phase
              demonstrations rarely represent production variance, high GPU compute overhead poses edge deployment
              challenges, and Rhoda has not yet disclosed any contractually committed, paying commercial customers.
            claimRefs:
