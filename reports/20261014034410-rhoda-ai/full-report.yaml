chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation Vintage, and Core Mission
        blocks:
          - type: paragraph
            body: >-
              Rhoda AI is a venture-backed physical artificial intelligence and robotics company headquartered in Palo
              Alto, California, operating at the intersection of generative foundation models and industrial automation.
              Founded in late 2024, the enterprise operated in confidential stealth development for approximately 18
              months before publicly emerging in March 2026 with a $450 million Series A financing round that
              established a post-money valuation of $1.7 billion. The company's core mission is to solve the historical
              adaptability bottleneck in robotics by developing foundation models that generalize across commercial and
              industrial workflows. Instead of programming dedicated trajectories or teleoperating machines for
              thousands of hours, Rhoda AI positions its FutureVision platform as a generalist intelligence layer
              engineered to automate physical tasks across high-volume automotive assembly lines, discrete manufacturing
              facilities, third-party logistics fulfillment centers, and ecommerce supply chain operations.
            claimRefs:
              - CO001
              - CO003
              - CO005
              - CO006
              - CO007
