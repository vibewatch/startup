      - number: '3.3'
        title: Packaging Models, Switching Costs, and Long-Term Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Commercial packaging in physical AI remains emergent, with competitors pursuing divergent monetization
              mechanisms across hardware sales, Robotics-as-a-Service (RaaS), and foundation model licensing.
              Established industrial robotics incumbents sell capital equipment with upfront hardware costs paired with
              long-term maintenance contracts and systems-integration services, creating high switching costs tied to
              fixed factory floor tooling and proprietary controller programming languages. Humanoid makers such as
              Figure AI and Apptronik are exploring turnkey hardware-software leasing or RaaS subscriptions targeting
              commercial enterprise facilities. For foundation model developers, software licensing represents the
              primary mechanism, though pure-play platforms like Skild AI and Physical Intelligence have yet to publish
              standardized public API pricing. Rhoda's planned commercialization blends a dual revenue model: direct
              deployment of in-house mobile manipulators for initial data collection and verification, alongside future
              licensing of FutureVision as an intelligence layer to third-party robotics hardware and software
              manufacturers. Nonetheless, independent industry reviews note that Rhoda lacks publicly documented APIs,
              SDKs, or job-control endpoints at launch, reflecting an enterprise-pilot stage rather than immediate
              callable platform availability. The durability of Rhoda's competitive moat hinges on whether its web-video
              pretraining and closed-loop DVA architecture kickstart a superior real-world data flywheel before
              well-capitalized foundation model rivals or humanoid OEMs saturate enterprise pilot allocations.
            claimRefs:
              - CP002
              - CP003
              - CP007
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
