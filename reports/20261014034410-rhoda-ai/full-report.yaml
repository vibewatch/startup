            body: >-
              Commercial deployments of Rhoda AI's technology focus on high-variability warehouse and manufacturing
              tasks that previously proved intractable for classical automation. In production evaluations conducted
              with sporting-goods retailer Decathlon, Rhoda AI's systems demonstrated end-to-end autonomous operation
              across three distinct operational workflows: bearing decanting, container breakdown, and apparel returns
              processing. The decanting workflow requires bimanual manipulation to unpack ten-kilogram parts boxes,
