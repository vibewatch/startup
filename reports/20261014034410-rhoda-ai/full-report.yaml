        blocks:
          - type: paragraph
            body: >-
              Synthesizing the technological, competitive, and valuation evidence results in an overarching diligence
              recommendation of research-more, accompanied by a high risk rating and a stretched valuation stance. Rhoda
              AI's closed-loop video predictive control architecture, experienced leadership under repeat deep-tech
              entrepreneur Jagdeep Singh, and well-capitalized syndicate establish exceptional foundational strength.
              However, paying $1.7 billion for an early Series A asset prior to independent verification of multi-site
              uptime, deployment scale, and customer contract renewals fails standard price-discipline criteria for
              defensive capital allocation.


              Before upgrading Rhoda AI to an actionable buy stance, institutional investors should monitor explicit
              thesis-break triggers and enforce specific diligence kill criteria. Critical kill criteria include: (1)
              failure to convert current automotive manufacturing and logistics pilots into multi-year commercial
              contracts within twelve months; (2) excessive model degradation or safety-related e-stop frequencies under
              live factory shifts; and (3) escalation of compute burn rates that reduce operational cash runway below 24
              months. Confirmatory diligence must demand confidential access to customer reference calls, audited
              unit-level contribution margins, and the Series A capitalization table to evaluate liquidation preference
              overhang and senior structural rights.
