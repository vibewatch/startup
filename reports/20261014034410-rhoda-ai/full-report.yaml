  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Licensing Strategy, and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Rhoda AI is constructing a commercial architecture centered on foundational physical intelligence,
              targeting industrial robotics across manufacturing, automotive decanting, and fulfillment logistics. The
              core commercialization engine is FutureVision, a foundation model platform driven by Direct Video Action
              (DVA) predictive modeling that the company plans to license to third-party robotics original equipment
              manufacturers (OEMs) and automation software platforms. Concurrently, Rhoda is developing proprietary
              mobile manipulator hardware equipped with seven-degree-of-freedom arms, dexterous three-fingered hands,
              and wheeled bases capable of handling up to 25 kilograms continuously and 40 kilograms peak payload. This
              creates a dual monetization framework: a high-margin recurring software licensing tier paired with
              capital-intensive full-stack robotic deployments. Lead investor Mayfield models an alternative
              Labor-as-a-Service (LaaS) framework where customers pay for autonomous work rather than equipment,
              projecting that 1,000 deployed robotic units could generate approximately $100 million in annual recurring
              revenue (ARR), and scaling to 10,000 units would yield $1 billion in ARR. However, Rhoda remains
              completely pre-revenue today, with zero disclosed commercial contracts, recurring software subscriptions,
              or published list pricing, rendering all forward revenue projections unverified hypotheses.
            claimRefs:
