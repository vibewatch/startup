  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Structure and Strategic Archetypes
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape surrounding Rhoda AI spans four primary structural categories: pure-play
              robotics foundation model developers, vertically integrated humanoid robotics OEMs, status-quo industrial
              automation incumbents, and internal enterprise automation builds. The first category comprises physical AI
              foundation model developers such as Skild AI and Physical Intelligence (Pi), which focus on model-centric
              architectures and hardware-agnostic licensing. Skild AI raised $1.4B in Series C funding at a $14B
              valuation in January 2026, while Physical Intelligence similarly focuses on generalist robotics models
              across multi-embodiment platforms. Rhoda diverges from pure software providers by developing proprietary
              mobile manipulator hardware alongside FutureVision rather than offering immediate universal model
              licensing. The second category features vertically integrated humanoid robotics makers, notably Figure AI
              (which reached a $39B valuation with over $1B raised by early 2026) and Apptronik (which secured a $520M
              Series A extension in February 2026, reaching over $5B valuation and $935M total raised). In contrast to
              bipedal humanoid architectures that suffer from dynamic balancing failure modes, Rhoda adopts a mobile
              manipulator form factor with a wheeled base, seven degree-of-freedom arms, and three-finger hands,
              delivering a 45 kg payload capacity and eliminating tip-over hazards upon emergency stop. The third
              category encompasses traditional industrial robotics incumbents, such as FANUC, ABB, and KUKA, which
              dominate fixed workcells with deterministic programming and established global field support, while the
              fourth category includes internal robotic engineering efforts within tier-one manufacturers and logistics
              operators.
            claimRefs:
              - CP001
              - CP002
              - CP003
