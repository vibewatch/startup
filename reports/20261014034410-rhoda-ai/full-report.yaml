    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, safety, and data-governance exposure
        blocks:
          - type: paragraph
            body: >-
              The central legal and regulatory issue is evidentiary: the assigned public sources do not establish
              Rhoda's certification status, incident record, product-liability allocation, insurance coverage, or rights
              framework for web-video training. That is not evidence that a breach or incident occurred, nor proof that
              none occurred. Rhoda says generative predictions can be inconsistent and produce jerky movement or
              oscillation, while an independent industry article flags determinism, fault tolerance, safety validation,
              and liability as adoption barriers. The company presents video rollouts and a wheeled base as safety aids,
              but these are design mitigations rather than disclosed third-party certification. Investment diligence
              should therefore treat production safety approval and training-data provenance as open conditions
              precedent, with counsel and an independent robotics-safety assessor reviewing the underlying records
              before underwriting broad deployment.
