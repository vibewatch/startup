      - number: '1.2'
        title: Executive Leadership and Scientific Pedigree
        blocks:
          - type: paragraph
            body: >-
              Rhoda AI is led by Chief Executive Officer Jagdeep Singh, a seasoned deep technology entrepreneur who
              previously founded and scaled solid-state battery manufacturer QuantumScape Corporation through its public
              market listing. Singh brings extensive operational experience in managing high-capex, research-intensive
              engineering cycles with multi-year commercialization timelines. The core AI architecture is spearheaded by
              Chief Science Officer Eric Ryan Chan, an established computer vision researcher specializing in generative
              3D modeling and world representation systems who previously conducted generative modeling research at
              WorldLabs. Academic and scientific guidance is anchored by Stanford University Associate Professor Gordon
              Wetzstein, head of the Stanford Computational Imaging Lab. While this leadership syndicate combines proven
              capital formation capabilities with frontier generative vision expertise, the organization exhibits
              pronounced key-person dependency on Singh for strategic direction, capital syndication, and hardware
              strategy execution, while formal board governance and committee allocations remain undisclosed.
