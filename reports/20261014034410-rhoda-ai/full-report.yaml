    notes: >-
      Strategic pillars contrasting foundational physical AI advantages against operational scaling headwinds in
      unstructured industrial environments.
    columns:
      - Strategic Pillar
      - Investment Thesis
      - Counter-Thesis / Anti-Thesis
      - What Would Change View
    rows:
      - - Model Paradigm & Data
        - >-
          Direct Video Action leverages internet-scale video to solve physical commonsense without teleoperation
          bottlenecks.
        - Internet video lacks proprioceptive touch feedback; edge cases in real factories still cause costly failures.
        - Third-party benchmarks proving zero-shot adaptation across diverse manufacturing workcells.
      - - Hardware Architecture
        - >-
          Wheeled mobile manipulators avoid humanoid stability hazards and integrate into brownfield AMR facilities
          safely.
        - >-
          Wheeled form factors cannot navigate stairs or multi-tier racks, capping addressable footprint relative to
          humanoids.
        - Customer audit demonstrating 99%+ cycle completion without human intervention across multi-floor sites.
      - - Commercial Deployment
        - Automotive evaluation showed sub-2-minute cycle time, positioning Rhoda for rapid customer pilot conversion.
        - Single-site evaluations do not guarantee multi-shift reliability, maintenance uptime, or customer ROI.
        - Public case studies and multi-year production service contracts with named Tier-1 manufacturers.
      - - Market Valuation & Capital
        - $450M treasury provides extensive compute runway to out-iterate competitors and build a data flywheel.
        - $1.7B entry valuation leaves minimal margin of safety if enterprise adoption lags or compute burn escalates.
        - Disclosed ARR exceeding $50M or fleet milestone surpassing 500 billable production units.
