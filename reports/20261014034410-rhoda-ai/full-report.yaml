      - number: '5.3'
        title: Direct Video-Action Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              The core technical breakthrough powering Rhoda AI is the Direct Video-Action (DVA) architecture, which
              decouples global physical world understanding from low-level robot joint kinematics. At the foundation
              sits a native causal video model pre-trained from scratch on over one million internet videos, capturing
              intuitive physics, gravity, and object interactions without requiring millions of teleoperation
              demonstration hours. Rhoda AI trains this model using a proprietary Context Amortization objective that
              predicts future frames at every sequence position simultaneously, enabling long-context visual memory
              across hundreds of frames while maintaining inference efficiency through key-value caching. Downstream
              actuation is handled by a compact inverse dynamics model that translates consecutive predicted video
              frames into motor torques and joint positions using approximately ten hours of embodiment-specific
              telemetry. To bridge the latency gap between heavy video model inference (approximately one hundred
              milliseconds) and real-time robot motor control loops (ten to thirty milliseconds), Rhoda AI executes
              leapfrog inference, overlapping future visual rollouts with prior action execution while conditioning
              consecutive rollouts on active motor states to preserve kinematic trajectory continuity.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE012
              - CE015
