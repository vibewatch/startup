callouts:
  - calloutType: strength
    title: "Data Efficiency Advantage Over Classical VLA Models"
    body: "By pre-training on over one million internet videos, Rhoda AI eliminates the multi-million-dollar teleoperation bottleneck that hinders conventional Vision-Language-Action models. Requiring only 10 to 20 hours of physical robot data per embodiment enables rapid adaptation to complex industrial tasks such as container breakdown and bearing decanting."
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE006
  - calloutType: risk
    title: "Decoupled Video-to-Action Boundary and Hardware Generalization"
    body: "The non-differentiable boundary between Rhoda AI's causal video generator and its inverse dynamics model prevents downstream actuation errors from directly refining the core world model. Furthermore, while the wheeled mobile base provides stability and safety in warehouses, its deployment in unstructured industrial environments without extensive site-specific fine-tuning remains unproven."
    claimRefs:
      - CE010
      - CE012
      - CE014
