  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: "safety-validation"
      missingEvidence: "Independent safety assessments, certification status, regulator correspondence, incident and near-miss logs, insurance coverage, and customer-site acceptance records."
      whyItMatters: "These records determine whether Rhoda can deploy physical systems at customer sites with acceptable residual safety and liability exposure."
      diligencePath: "Have independent robotics-safety counsel and an accredited assessor review the safety case, test results, incident history, insurance, and customer contract allocation."
      relatedQuestionRefs:
        - QR001
      relatedTableRefs:
        - TR001

    - type: private-evidence-only
      severity: material
      topic: "unit-economics"
      missingEvidence: "Actual pricing, recurring revenue, deployment count, bill of materials, compute cost, installation cost, field-service burden, warranty reserve, gross margin, burn, cash balance, and runway."
      whyItMatters: "Without these denominators, an investor scenario based on deployed units cannot establish ARR, contribution margin, capital efficiency, or financing sufficiency."
      diligencePath: "Reconcile customer contracts and invoices to the revenue ledger, then review deployment-level contribution margins, cash statements, operating plan, and downside financing model."
      relatedQuestionRefs:
        - QR009
      relatedTableRefs:
        - TR003

    - type: enumeration-incomplete
      severity: material
      topic: "customer-conversion"
      missingEvidence: "Named customers, proof-of-concept count, paid deployment count, units per site, production uptime, intervention rate, renewals, expansions, and reference calls."
      whyItMatters: "Public demonstrations and investor claims do not establish repeatable production performance or commercial conversion."
      diligencePath: "Obtain the complete customer and pilot roster and conduct reference calls selected from that full population rather than management-selected successes."
      relatedQuestionRefs:
        - QR007
      relatedTableRefs:
        - TR003

    - type: missing-source
      severity: material
      topic: "training-data-rights"
      missingEvidence: "Dataset-level provenance, licenses, privacy review, exclusion and deletion controls, geographic restrictions, and litigation or complaint history for web-video pretraining."
      whyItMatters: "Curation and filtering do not by themselves establish permission to use data or quantify legal and reputational exposure."
      diligencePath: "Commission a privileged dataset-lineage and rights audit covering a statistically valid sample and all high-risk source categories."
      relatedQuestionRefs:
        - QR004
      relatedTableRefs:
        - TR001
