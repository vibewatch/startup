callouts:
  - calloutType: "insight"
    title: "The Mobile Manipulator vs. Bipedal Humanoid Strategic Tradeoff"
    body: "While market hype heavily favors bipedal humanoids like Figure AI and Apptronik, Rhoda's choice of a wheeled mobile manipulator directly addresses industrial procurement priorities. Eliminating dynamic balancing risks prevents catastrophic tip-over during emergency stops, and facilities already utilize AMRs and AGVs. However, bipedal humanoids retain a long-term marketing and architectural advantage in navigating unstructured environments with stairs or multi-level obstacles."
    claimRefs:
      - "CP003"
      - "CP006"
      - "CP007"
  - calloutType: "risk"
    title: "Capital Asymmetry and API Accessibility Barriers"
    body: "Rhoda's $450M Series A provides substantial runway but faces capital asymmetry against pure-play foundation models like Skild AI ($1.4B Series C at $14B valuation) and humanoid leaders like Figure AI ($39B valuation). Furthermore, the absence of public API documentation, SDKs, or callable developer interfaces leaves Rhoda dependent on bespoke enterprise pilots, creating deployment friction relative to open software ecosystems."
    claimRefs:
      - "CP002"
      - "CP003"
      - "CP013"
      - "CP016"
