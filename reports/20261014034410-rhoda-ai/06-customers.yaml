    body: "Rhoda AI's DVA architecture shifts the customer adoption economics by slashing robot-specific demonstration requirements from hundreds of hours to 10–20 hours. In live factory tests, this enabled rapid deployment on complex tasks like bearing decanting and container breakdown, achieving autonomous cycles under two minutes."
