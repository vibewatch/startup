callouts:
  - calloutType: insight
    title: "Wheeled Mobile Manipulators Address Immediate Industrial Safety and Adoption Barriers"
    body: "While public attention centers on bipedal humanoid robotics, industrial plant managers strongly favor wheeled mobile platforms with dexterous arms. Wheeled bases integrate seamlessly with existing automated guided vehicle (AGV) floor layouts and eliminate dangerous dynamic fall hazards during emergency stops."
    claimRefs:
      - CM006
      - CM007
      - CM010
  - calloutType: risk
    title: "Unverified Commercial Unit Economics and Absence of Contract Disclosures"
    body: "Investor underwriting relies on a theoretical $100,000 annual recurring revenue per unit model to project a $1 billion ARR business at 10,000 deployed units. However, Rhoda AI has disclosed no paying customer counts, deployment numbers, or gross margin figures, leaving the commercial validity of the Labor as a Service model unverified."
    claimRefs:
      - CM004
      - CM009
      - CM014
