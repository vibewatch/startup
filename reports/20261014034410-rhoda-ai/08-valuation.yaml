  - id: TV002
    title: Thesis / anti-thesis table
    notes: Strategic pillars contrasting foundational physical AI advantages against operational scaling headwinds in unstructured industrial environments.
    columns:
      - Strategic Pillar
      - Investment Thesis
      - Counter-Thesis / Anti-Thesis
      - What Would Change View
    rows:
      - - Model Paradigm & Data
        - Direct Video Action leverages internet-scale video to solve physical commonsense without teleoperation bottlenecks.
        - Internet video lacks proprioceptive touch feedback; edge cases in real factories still cause costly failures.
        - Third-party benchmarks proving zero-shot adaptation across diverse manufacturing workcells.
      - - Hardware Architecture
        - Wheeled mobile manipulators avoid humanoid stability hazards and integrate into brownfield AMR facilities safely.
        - Wheeled form factors cannot navigate stairs or multi-tier racks, capping addressable footprint relative to humanoids.
        - Customer audit demonstrating 99%+ cycle completion without human intervention across multi-floor sites.
      - - Commercial Deployment
        - Automotive evaluation showed sub-2-minute cycle time, positioning Rhoda for rapid customer pilot conversion.
        - Single-site evaluations do not guarantee multi-shift reliability, maintenance uptime, or customer ROI.
        - Public case studies and multi-year production service contracts with named Tier-1 manufacturers.
      - - Market Valuation & Capital
        - $450M treasury provides extensive compute runway to out-iterate competitors and build a data flywheel.
        - $1.7B entry valuation leaves minimal margin of safety if enterprise adoption lags or compute burn escalates.
        - Disclosed ARR exceeding $50M or fleet milestone surpassing 500 billable production units.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    notes: Scenario return modeling across fleet deployment scales, software take rates, and terminal multiple assumptions.
    columns:
      - Scenario
      - Core Assumptions
      - Valuation / Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - Rapid conversion of automotive/logistics pilots into 1,000+ deployed mobile manipulators by 2028; $100M+ recurring revenue under Labor-as-a-Service model.
        - Valuation expands to $5B-$8B (15x-20x forward ARR multiple), delivering 3x-5x return for Series A investors.
        - Compute inflation, hardware warranty costs, or delayed customer procurement cycles.
        - 25% (requires flawless commercial execution and hardware reliability)
      - - Base Case
        - Moderate adoption with 150-300 units deployed in structured logistics workflows; hybrid model licensing and proprietary units generating $15M-$30M revenue.
        - Valuation stabilizes at $1.5B-$2.2B (growth slow-down compresses forward multiples); 1.0x-1.3x return, potential flat follow-on round.
        - Margin compression from customer support overhead and custom integration requirements.
        - 50% (most plausible trajectory given brownfield factory integration friction)
      - - Bear Case
        - Technical distribution shift in unstructured environments; pilot churn; high compute burn drains $450M treasury without reaching scalable unit economics.
        - Valuation compresses to $400M-$700M in a down-round or distressed asset sale; preferred equity takes entire recovery, common wiped out.
        - Hardware safety incident, model hallucination leading to factory downtime, or emergence of superior open-source robotics models.
        - 25% (elevated capital-intensity risk in early deep-tech robotics)
