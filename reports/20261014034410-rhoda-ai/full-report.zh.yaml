        title: 展品
        blocks:
          - type: callout
            title: 顶尖创始基因与巨额早期资本
            body: 连续深科技创业者 Jagdeep Singh、顶尖生成视觉研究团队，以及 $450M Series A 资本，共同为 Rhoda AI 提供多年现金缓冲和强大可信度，使其明显区别于资金不足的机器人初创公司。
            calloutType: strength
