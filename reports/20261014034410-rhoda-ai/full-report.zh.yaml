      - number: '7.2'
        title: 运营可靠性与技术规模
        blocks:
          - type: paragraph
            body: >-
              Rhoda 的闭环架构直接应对延迟和轨迹连续性问题，但这套缓解方案也暴露了失效模式。系统必须预测视频、将其转化为动作、执行，再每秒重复数次；Rhoda
              采用跳跃式推理、动作条件化和缓存上下文，让这条循环持续运转。公开证据没有披露尾延迟、急停频率、恢复率、功耗或现场平均故障间隔。更根本的是，Rhoda
              承认，稳健规划与推理、通过交互自我改进、长时域移动操作，以及高自由度灵巧操作仍是尚未解决的技术挑战。这些缺口使生产可靠性和边缘计算经济性成为可监测风险，而不是已经证实的缺陷：真正决定性的证据，是客户现场在长时间、非筛选运行中的可靠性分布。
