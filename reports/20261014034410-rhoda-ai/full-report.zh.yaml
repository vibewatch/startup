  - id: TV002
    title: 投资论点 / 反论点表
    notes: 对比基础 Physical AI 优势与非结构化工业环境中运营扩张阻力的战略支柱。
    columns:
      - 战略支柱
      - 投资论点
      - 反论点 / 反命题
      - 什么会改变判断
    rows:
      - - 模型范式与数据
        - Direct Video Action 利用网络规模视频解决物理常识问题，避开远程操作瓶颈。
        - 网络视频缺少本体感觉和触觉反馈；真实工厂中的边缘情况仍会造成高昂失效。
        - 第三方基准证明其能在多种制造工作单元中零样本适配。
      - - 硬件架构
        - 轮式移动操作机器人避开人形机器人的稳定性风险，并能安全接入存量 AMR 设施。
        - 轮式形态无法上下楼梯或穿行多层货架，相比人形机器人限制了可覆盖的场地范围。
        - 客户审计证明多层场地在无人干预下的周期完成率超过 99%。
      - - 商业部署
        - 汽车行业评估显示周期不到 2 分钟，为 Rhoda 快速转化客户试点创造条件。
        - 单现场评估不能保证多班次可靠性、维护开机率或客户 ROI。
        - 具名 Tier-1 制造商的公开案例研究和多年生产服务合同。
      - - 市场估值与资本
        - $450M 资金储备提供充足算力 runway，可持续迭代并建立数据飞轮。
        - 如果企业采用落后或算力消耗上升，$1.7B 入场估值几乎没有安全边际。
        - 披露 ARR 超过 $50M，或车队里程碑超过 500 台可计费生产设备。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV012
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    notes: 基于车队部署规模、软件抽成率和终值倍数假设的情景回报建模。
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 主要下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - 到 2028 年，汽车 / 物流试点快速转化为 1,000+ 台已部署移动操作机器人；Labor-as-a-Service 模式下经常性收入达到 $100M+。
        - 估值扩张至 $5B-$8B（远期 ARR 倍数 15x-20x），为 Series A 投资者带来 3x-5x 回报。
        - 算力通胀、硬件保修成本或客户采购周期延迟。
        - 25%（需要商业执行和硬件可靠性都无瑕疵）
      - - 基准情景
        - 温和采用，在结构化物流工作流中部署 150-300 台；混合模式授权和自有设备带来 $15M-$30M 收入。
        - 估值稳定在 $1.5B-$2.2B（增长放缓压缩远期倍数）；回报为 1.0x-1.3x，后续融资可能持平。
        - 客户支持开销和定制集成要求压缩利润率。
        - 50%（考虑到存量工厂集成摩擦，这是最可能的轨迹）
      - - 悲观情景
        - 非结构化环境出现技术分布偏移；试点流失；高算力消耗耗尽 $450M 资金，却未达到可规模化的单位经济性。
        - 在下轮融资或困境资产出售中，估值压缩至 $400M-$700M；优先股拿走全部回收价值，普通股归零。
        - 硬件安全事故、模型幻觉导致工厂停机，或出现更优秀的开源机器人模型。
        - 25%（早期深科技机器人面临较高资本密集型风险）
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
