      - number: '8.4'
        title: 建议逻辑、淘汰标准与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              综合技术、竞争和估值证据后，整体尽调建议为继续研究，风险评级为高，估值判断偏高。Rhoda AI 的闭环视频预测控制架构、连续创业深科技创业者 Jagdeep Singh
              领导的资深团队，以及资本充足的投资财团，构成了异常扎实的基础实力。但在尚未独立验证多现场 uptime、部署规模和客户合同续签前，就为一家早期 Series A 公司支付 $1.7
              billion，达不到防御性资本配置所需的标准价格纪律。


              在把 Rhoda AI 上调为可执行的买入判断前，机构投资者应监测明确的论点失效触发条件，并执行具体的尽调淘汰标准。关键淘汰标准包括：（1）当前汽车制造和物流试点未能在 12
              个月内转化为多年期商业合同；（2）真实工厂班次中模型性能过度下降，或与安全相关的急停频率过高；（3）算力消耗率上升，使运营现金 runway 降至 24
              个月以下。确认性尽调必须要求机密访问客户参考访谈、经审计的单位级贡献利润，以及 Series A 资本结构表，以评估清算优先权的悬置影响和高级结构性权利。
