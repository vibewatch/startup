      - number: '6.3'
        title: 客户概念验证与运营流程
        blocks:
          - type: paragraph
            body: >-
              Rhoda AI 可公开验证的客户证据集中在技术概念验证（PoC）和真实制造试点，而不是已宣布的生产合同。在一次汽车制造试验中，系统自动完成复杂的双手拆包：从 10 kg
              箱中取出轴承、拉出薄包装条并分拣包装材料；行业伙伴此前认为这类任务无法自动化。第二个工业概念验证（PoC）展示了重型 50 磅 Contico 容器的自主拆解，平台在连续 160
              分钟试验中准确判断空间、清理碎片并操纵难开的锁扣，无需人工介入。第三次评估探索电商退货处理，平台借助长上下文视觉记忆，端到端自主拆包、检查、折叠和分箱服装。尽管这些试点在不同制造和履约环境中展示了复杂操作能力，Rhoda
              AI 仍未公布具体客户品牌、商业合同金额或企业部署协议。
