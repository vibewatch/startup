      - number: '8.2'
        title: 融资背景、估值倍数与行业可比公司
        blocks:
          - type: paragraph
            body: >-
              2026 年 3 月，Rhoda AI 结束了 18 个月的隐身运营，宣布完成 $450 million 的 Series A，投后估值为 $1.7 billion。本轮融资由 Premji Invest
              领投，Temasek、Khosla Ventures、Mayfield、Matter Venture Partners、Capricorn Investment Group、Prelude Ventures 和
              John Doerr 等一线投资方组成的财团参与。这是机器人历史上规模最大的 Series A 之一，反映出资本高度集中涌向物理基础模型。该轮融资恰逢 2026 年 1 月和 2 月前所未有的募资浪潮：期间 AI
              机器人领域的风险投资在超过 110 笔交易中突破 $4.3 billion，预计全年行业流入将达到 $20 billion。


              从估值可比角度看，Rhoda AI 的 $1.7 billion 估值使其跻身顶级私人物理 AI 独角兽之列，不过商业化阶段更早。相比之下，Skild AI 在 2026 年 1 月完成 $1.4 billion
              的 Series C 后估值达到 $14 billion；Apptronik 通过增资将其人形机器人平台估值推高至 $5 billion 以上；Figure AI 的估值则达到 $39
              billion。然而，与已公开企业部署情况的后期同行不同，Rhoda AI 尚未披露经常性软件收入、年度经常性收入 run-rate 或可计费机队客户数量。由于 Rhoda AI 的 $1.7 billion
              估值完全建立在未经验证的商业收入之上的远期倍数扩张，行业观察人士指出，公司必须迅速证明商业客户的可验证投资回报，以免未来融资轮次出现倍数压缩。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV009
              - CV010
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
