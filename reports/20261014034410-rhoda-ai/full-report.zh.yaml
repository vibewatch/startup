              Rhoda AI 的商业部署聚焦经典自动化过去难以完成的高变异仓储和制造任务。在与运动用品零售商 Decathlon
              开展的生产评估中，系统端到端自主完成三类流程：轴承拆包、容器拆解和服装退货处理。拆包流程需要双手操作，打开 10 kg 零件箱、取出轴承并分离脆弱塑料内衬；经过 11 小时机器人训练数据后，可自主运行 1.5
