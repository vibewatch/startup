  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Rhoda AI 的核心投资论点很有吸引力：它试图解决机器人自动化规模化的首要瓶颈——依赖人工遥操作。公司把专有的 Direct Video Action（DVA）架构引入 FutureVision
              平台，利用数亿条公开互联网视频预训练基础模型，先建立对物理规律、物体恒存性和动态交互的稳健世界模型，再用仅 10 至 20
              小时的遥操作数据，将这些表征映射到机器人本体。早期在高吞吐汽车装配环境中的评估显示，Rhoda
              完成了一项无需人工干预的自主零部件处理工作流，每个循环用时不到两分钟，超过了既有客户基准。公司还做出了明确的系统级硬件取舍：开发配备七自由度机械臂和三指手的轮式移动操作机器人，而不是不稳定的双足人形机器人，优先保证作业安全、动态平衡，并立即兼容现有自动导引车基础设施。


              反过来，反论点集中在早期试点演示与生产规模工业部署之间的巨大鸿沟。正如 CEO Jagdeep Singh 坦率承认的那样，尽管具身 AI
              领域已投入数十亿美元，如今仍没有通用型自主机器人在商业现场作业中完成有用工作。视频预训练能提供视觉先验，却缺乏触觉本体感知，使系统容易受到多变棕地工厂环境中细微物理分布变化的影响。此外，独立行业分析强调，面对
              Boston Dynamics 和 Tesla Optimus 等资金雄厚的竞争者，Rhoda AI $1.7 billion 的投后估值是否对应已证明的投资回报，值得严肃审视。$450 million 的
              Series A 资金为算力提供了较长 runway，但随着公司激进扩充研究团队并扩大硬件规模，资本密集度仍然很高。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
              - CV014
