chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、成立背景与核心使命
        blocks:
          - type: paragraph
            body: >-
              Rhoda AI 是一家获风险资本支持的实体人工智能与机器人公司，总部位于加利福尼亚州帕洛阿尔托，处于生成式基础模型与工业自动化的交汇处。公司成立于 2024 年底，约 18 个月以保密隐身方式开发，直到
              2026 年 3 月凭借 $450M Series A 融资公开亮相，并由此建立 $1.7B 投后估值。公司的核心使命，是用能跨商业和工业流程泛化的基础模型，解决机器人长期存在的适应性瓶颈。Rhoda AI
              不再为每条轨迹单独编程，也不再让人远程操控机器数千小时，而是把 FutureVision 定位为通用智能层，覆盖高产量汽车装配线、离散制造工厂、第三方物流履约中心和电商供应链中的实体任务。
            claimRefs:
              - CO001
              - CO003
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO011
              - CO012
      - number: '1.2'
        title: 管理层与科学基因
        blocks:
          - type: paragraph
            body: >-
              Rhoda AI 由 CEO Jagdeep Singh 领导。Singh 是资深深科技企业家，曾创办并推动固态电池制造商 QuantumScape Corporation
              上市。他擅长管理高资本开支、研究密集型工程周期，以及多年商业化过程。核心 AI 架构由首席科学官 Eric Ryan Chan 负责；他是专攻生成式 3D 建模和世界表征系统的计算机视觉研究者，曾在
              WorldLabs 从事生成建模研究。科学指导由斯坦福大学副教授、斯坦福计算成像实验室负责人 Gordon Wetzstein 主导。这个领导班子兼具融资能力和前沿生成视觉经验，但公司对 Singh
              的关键人物依赖明显：战略方向、资本组局和硬件战略执行都集中于他；正式董事会治理和委员会分工仍未披露。
            claimRefs:
              - CO003
              - CO004
              - CO013
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO013
      - number: '1.3'
        title: 资本结构、估值基准与投资财团
        blocks:
          - type: paragraph
            body: >-
              Rhoda AI 的 $450M Series A 是实体 AI 与机器人领域规模最大的首轮风险融资之一，公司走出隐身期即成为独角兽。融资由 Wipro 创始人 Azim Premji 的投资机构 Premji
              Invest 领投，体现多阶段全球机构资本对实体自动化的激进配置。财团还包括 Khosla Ventures、Mayfield、Temasek Holdings 及其子公司 Xora
              Innovation、Capricorn Investment Group、Leitmotif、Matter Venture Partners、Prelude Ventures，以及 John Doerr
              等天使投资人。投资方把 Rhoda AI 定位为面向全球体力劳动经济的 Labor as a Service 平台。然而，Rhoda AI 尚未披露经审计收入跑速、ARR 或毛利率基准，因此 $1.7B
              估值与近期财务指标完全脱钩。
            claimRefs:
              - CO001
              - CO002
              - CO010
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO002
              - CO010
      - number: '1.4'
        title: 平台架构里程碑与商业部署现实
        blocks:
          - type: paragraph
            body: >-
              Rhoda AI 的技术主张以 FutureVision 为核心，其 Direct Video
              Action（DVA）架构把机器人控制改写为连续视频预测任务。模型先用数亿条公开互联网视频预训练，学习运动、物理和物体动力学的通用表征，再用 1 至 10
              小时机器人专属轨迹数据进行后训练。闭环控制每几百毫秒运行一次，观察环境状态并预测电机动作，以应对布局变化和非结构化物体。在工业试验中，Rhoda
              展示了每个周期不到两分钟完成自主部件处理。为商业化这一技术栈，公司把配备 7-DoF
              机械臂和灵巧手的自研轮式移动操作机器人，与第三方软件授权结合起来。不过，关键尽调风险仍在：独立分析者指出，隐身期演示很少代表生产环境的波动；高 GPU 算力开销给边缘部署带来挑战；Rhoda
              也尚未披露任何已签约、付费的商业客户。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO011
              - CO014
              - CO015
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO003
              - CO004
