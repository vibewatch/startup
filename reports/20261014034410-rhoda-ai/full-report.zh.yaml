              多人继续做大。尽管资产负债表充裕，未来现金消耗预计仍很高。用数亿条网络视频训练生成式视频模型需要数千万美元算力基础设施；硬件工程、测试设施和客户试点补贴也会快速消耗营运资金。在商业化仍处于探索性试点阶段时，Rhoda
              在生产试点转为能产生现金的企业合同前，完全依赖风险资本和战略资产负债表支持。当前储备预计可支撑 24 至 36 个月运营，但硬件生产扩张还需要在现金流盈亏平衡前获得大量额外融资。
