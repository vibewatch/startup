  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与范围：从刚性自动化向外扩展
        blocks:
          - type: paragraph
            body: >-
              实体人工智能的出现，意味着工业机器人从刚性预编程转向适应性、感知驱动的非结构化操作。传统汽车装配和仓储物流设施已在点焊、激光切割、标准托盘搬运等可预测重复流程中实现较高固定自动化渗透；但部件拆包、打开可变形容器、零件配套和包裹分拣等环境变化大的任务，长期难以自动化，仍依赖人工。Rhoda
              AI 瞄准的正是这条高变异操作边界。公司成立于 2024 年底，2026 年 3 月在 Premji Invest 领投的 $450M 融资支持下走出隐身期，试图在汽车和物流设施替代既有体力劳动。它不与成熟
              PLC 或固定机械臂供应商正面竞争，而是聚焦物体朝向和动态布局不断变化、令传统 VLA 模型及远程操作轨迹系统失效的复杂实体交互任务。Rhoda AI 用数亿条互联网视频训练自研 DVA
              架构，试图赋予机器人通用实体常识，把工业运营中可自动化的边界推进到过去被认为难以由机器完成的任务。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM011
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM007
              - CM011
              - CM012
      - number: '2.2'
        title: 可服务市场测算：宏观劳动力套利与实际 SAM
        blocks:
          - type: paragraph
            body: >-
              风险投资人以巨大的宏观可服务市场评估 Rhoda AI，把机会描述为 Labor as a Service（LaaS），而非资本设备销售。Mayfield Fund 将 TAM
              定义为全球体力劳动经济，覆盖制造、仓储、建筑和农业，每年人工工资支出约 $30T。按这一投资逻辑，实体 AI 不只是替代既有机器人预算，还能用可扩展算力和机械系统替代稀缺体力劳动，释放受限的工业
              GDP。Mayfield 的经济模型假设，部署 1,000 台自主移动操作机器人并签订持续劳务服务协议，可产生约 $100M ARR；规模扩大到 10,000 台，则可形成 $1B ARR
              企业。但要把理论上的劳动力套利变成 SAM，必须严格收窄边界。工业操作的近期可服务市场限于结构化室内制造工厂和高产量物流配送中心，且这些场所面临严重用工短缺和较高重复性劳损率。尽管 2026 年 1
              月单月更广义的机器人与 AI 风险投资已超过 $4.3B，并推动 Rhoda AI 达到 $1.7B 估值基准，商业投资判断仍应在商业车队可靠性和多设施单位经济性经生产验证前，对自上而下的劳动力 TAM 打折。
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM010
              - CM011
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM008
              - CM009
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM010
              - CM011
      - number: '2.3'
        title: 买方细分：工厂经济性、安全约束与形态偏好
        blocks:
          - type: paragraph
            body: >-
              Rhoda AI 目标行业的企业采购由工厂运营经理、职场安全负责人和资本配置委员会主导，回本门槛严格。汽车制造和物流配送中心的典型买方要求新自动化系统在 12 至 24
              个月内完成资本回收，衡量标准是替代人工、提升吞吐并降低人体工学风险。学术机器人演示与商业客户对形态的偏好之间出现明显分歧：风险资本大量补贴试图复制人体结构的双足人形机器人，但工业运营高管更偏爱轮式移动操作机器人。轮式底盘可以与
              AGV、AMR 一起融入现有工厂交通布局，避开双足行走固有的严重倾倒风险。公司管理层和行业协会观察指出，双足人形机器人急停可能发生灾难性倒地，损坏周边设备或伤及人员；轮式操作机器人则能保持静态稳定。Rhoda
              AI 选择轮式底盘、七自由度机械臂、三指灵巧手和 45 kg 负载能力，正是为了贴合工业工厂的安全标准与采购预期。
            claimRefs:
              - CM006
              - CM007
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM007
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 增长驱动、商业障碍与估值尽调缺口
        blocks:
          - type: paragraph
            body: >-
              实体 AI 平台的采用速度受到宏观顺风推动，也被严格的运营和财务瓶颈限制。主要驱动包括制造业长期缺工、工业劳动力老龄化，以及北美和欧洲企业回流带来的非线性生产率需求。Rhoda AI
              在一家真实汽车工厂完成每周期不到两分钟的自主部件处理流程，初步试点说明视频预测闭环控制可以满足企业周期时间要求。但重要的采用约束仍未解决：工业买方要求六西格玛可靠性（99.9999%
              正常运行时间）、共享人机工作单元的稳健安全认证，以及无需工程师介入的快速边缘故障恢复。Rhoda AI 的商业轨迹还被重大尽调缺口遮蔽：公司未公开合同客户数、部署数量、试点转化率或软件授权毛利率。$1.7B
              投后估值和每股 $35.17 的股权定价体现的是风险资本乐观情绪，而非已建立的经常性现金流。要跨过试点技术可行性与持久商业采用之间的鸿沟，Rhoda AI 必须证明 DVA
              模型能在不同制造工厂保持运营可用性，且无需昂贵的定制后训练或专门远程操作监督。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM009
              - CM010
              - CM014
      - number: '2.5'
        title: 展品
        blocks:
          - type: callout
            title: 轮式移动操作机器人解决工业安全与采用障碍
            body: 尽管公众注意力集中在双足人形机器人，工业工厂经理却强烈偏好配备灵巧机械臂的轮式移动平台。轮式底盘能无缝接入现有 AGV 地面布局，并在急停时消除危险的动态跌倒风险。
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM010
          - type: callout
            title: 商业单位经济性未验证，合同披露缺失
            body: >-
              投资判断采用每台每年 $100,000 的 ARR 理论模型，推算 10,000 台部署设备可形成 $1B ARR 业务。然而 Rhoda AI 未披露付费客户数、部署量或毛利率，Labor as a
              Service 模式的商业有效性仍未验证。
            calloutType: risk
            claimRefs:
              - CM004
              - CM009
              - CM014
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局结构与战略类型
        blocks:
          - type: paragraph
            body: >-
              Rhoda AI 所处竞争格局分为四类：纯机器人基础模型开发商、垂直整合的人形机器人 OEM、既有工业自动化厂商，以及企业内部自动化建设。第一类包括 Skild AI 和 Physical
              Intelligence（Pi）等实体 AI 基础模型开发商，侧重模型架构和硬件无关授权。Skild AI 于 2026 年 1 月以 $14B 估值完成 $1.4B Series C；Physical
              Intelligence 也专注跨多种机身的通用机器人模型。Rhoda 与纯软件供应商不同，在开发 FutureVision 的同时自研移动操作机器人硬件，而非立即提供通用模型授权。第二类包括 Figure AI
              和 Apptronik 等垂直整合人形机器人制造商：Figure AI 到 2026 年初估值已达 $39B、融资超过 $1B；Apptronik 于 2026 年 2 月获得 $520M Series A
              延伸融资，估值超过 $5B、累计融资 $935M。与存在动态平衡故障模式的双足架构相比，Rhoda 采用轮式底盘、七自由度机械臂和三指灵巧手的移动操作机器人，提供 45 kg
              负载能力，并在急停时消除倾倒风险。第三类是 FANUC、ABB、KUKA 等传统工业机器人巨头，以确定性编程和成熟全球现场支持主导固定工作单元；第四类则包括一级制造商和物流运营商内部的机器人工程团队。
