      - number: '3.2'
        title: 竞争者画像、技术架构与能力对比
        blocks:
          - type: paragraph
            body: >-
              竞争者能力揭示了 VLA 模型、重度远程操作流程和 Rhoda DVA 架构之间的根本差异。主流 VLA 处理图像 token 和文本提示来推断动作序列，但独立分析和行业评论认为，主流 VLA
              通常只覆盖很短的上下文窗口，只有几帧视频。这会削弱其在长时程跟踪或连续物体操作中的准确率。传统机器人策略训练还高度依赖昂贵的硬件远程操作，掌握新任务往往要数千小时机器人专属演示。相比之下，Rhoda
              先用数亿条互联网视频预训练 FutureVision，建立实体先验，再用约 10 小时机身专属远程操作数据微调，闭环控制每几百毫秒更新一次。不过，Skild AI 等纯基础模型竞争者拥有更大的资本储备（$1.4B
              轮次）和广泛的硬件无关、多机身合作；Figure AI 等人形机器人开发商则利用自有双足形态，直接瞄准人形物流与制造流程。传统工业机器人厂商在结构化生产线上保持近 100%
              的确定性可靠性，而基础模型平台仍处于运营试点验证阶段。
