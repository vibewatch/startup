          - type: paragraph
            body: >-
              Rhoda AI 的客户采用轨迹一面显示出有希望的技术概念验证基准，一面仍处于商业化早期。公司在一次制造客户初步评估中展示了自主部件处理流程，周期不到两分钟，同时满足严格的生产性能阈值。DVA 架构只需 10 至
              20 小时远程操作演示，就能学习复杂的机器人操作任务，绕开传统工业机器人编程所需的数百小时，显著降低采用摩擦。持续运行时间也显示出韧性：容器拆解连续 160 分钟，轴承拆包自主运行 1.5
              小时，期间应对照明变化和物品摆放不规则。投资人 Mayfield 模型认为，部署 1,000 台可产生约 $100M ARR，10,000 台时达到 $1B
              ARR。但这些数字目前只是投资人的前瞻模型，并非经验证的商业车队收入。
