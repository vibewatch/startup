      - number: '8.3'
        title: 情景分析：乐观、基准与悲观回报画像
        blocks:
          - type: paragraph
            body: >-
              为评估 Rhoda AI 的风险调整后回报画像，我们在三至五年的投资期限内建立三种不同的商业采用情景。在乐观情景（概率 25%）下，Rhoda AI 成功把当前的制造和物流评估转化为多工厂商业部署。财团合作方
              Mayfield 推广的投资判断假设认为，在 Labor-as-a-Service 模式下部署 1,000 台移动操作机器人，可从 $30 trillion 的全球体力劳动市场中带来约 $100 million
              的年度经常性收入，并最终在 10,000 台设备时达到十亿美元级 run-rate。在这一情景中，Rhoda AI 成为工业操作领域的市场领导者，估值扩大到 $5 billion 至 $8 billion，为
              Series A 投资者带来 3x 至 5x 回报。


              在基准情景（概率 50%）下，Rhoda AI 稳步但审慎地推进采用，面对标准工业采购周期、工厂集成障碍和广泛的安全认证。到 2028 年，公司在物流退货处理和结构化制造单元中部署 150 至 300
              台设备，硬件与模型授权合计产生 $15 million 至 $30 million 收入。增长放缓和行业整体倍数正常化会将远期企业价值倍数压缩到符合市场的区间，估值预计为 $1.5 billion 至 $2.2
              billion，资本回报持平或小幅增长。在悲观情景（概率 25%）下，模型泛化在真实生产线的意外边缘案例面前失灵，导致循环中断和客户流失。持续训练视频基础模型带来的高额算力消耗会耗尽 $450 million
              资金，却仍未达到单位经济性盈亏平衡，最终触发一轮低价融资或 $400 million 至 $700 million 的结构化资本重组；其中高级清算优先权会抹去普通股权益。
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
