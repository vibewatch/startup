      - number: '5.3'
        title: Direct Video Action 架构与运行模式
        blocks:
          - type: paragraph
            body: >-
              Rhoda AI 的核心技术突破是 DVA
              架构，它把对实体世界的全局理解与低层机器人关节运动学解耦。底层是从零开始用超过一百万条互联网视频预训练的原生因果视频模型，能够捕捉直觉物理、重力和物体互动，无需数百万小时远程操作演示。Rhoda AI 用自研
              Context Amortization 目标训练模型，在每个序列位置同时预测未来帧，以数百帧的长上下文视觉记忆，并通过键值缓存保持推理效率。下游执行由紧凑型逆动力学模型负责，它用约 10
              小时机身专属遥测，把连续预测视频帧转换为电机扭矩和关节位置。为弥合重型视频模型推理（约 100 毫秒）与实时电机控制回路（10 至 30 毫秒）的延迟差，Rhoda 执行 leapfrog
              inference，让未来视觉展开与先前动作执行重叠，并依据当前电机状态条件化连续展开，从而保持运动学轨迹连续。
