  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、安全与数据治理暴露
        blocks:
          - type: paragraph
            body: >-
              核心法律与监管问题在于证据不足：指定公开来源无法证明 Rhoda 的认证状态、事故记录、产品责任分配、保险覆盖或网络视频训练的权利框架。这既不代表发生过违约或事故，也不证明从未发生。Rhoda
              表示生成式预测可能不一致，产生突兀运动或振荡；独立行业文章则把确定性、容错、安全验证和责任列为采用障碍。公司把视频展开和轮式底盘作为安全辅助，但它们只是设计层面的缓解措施，并非已披露的第三方认证。因此，投资尽调应把生产安全批准和训练数据来源视为尚待满足的先决条件，在判断大规模部署前，由法律顾问和独立机器人安全评估机构审阅底层记录。
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR012
