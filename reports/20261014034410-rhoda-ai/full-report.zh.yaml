  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 仅考虑指定证据中披露的控制措施和证明后的影响、可能性及缓解成熟度定性评估。
    data:
      columns:
        - 影响
        - 可能性
        - 缓解成熟度
      rows:
        - label: 工业安全验收
          values:
            - label: 严重
              tone: risk
              detail: 物理部署可能带来严重后果。
            - label: 中等
              tone: warning
              detail: 公开信息中没有事故率或认证结果。
            - label: 部分
              tone: warning
              detail: 报告描述了设计层面的缓解措施，但没有独立验证。
        - label: 闭环稳定性与延迟
          values:
            - label: 高
              tone: risk
              detail: 控制中断可能让任务停止或失稳。
            - label: 中等
              tone: warning
              detail: 该架构承认随机性不连续风险。
            - label: 原型已演示
              tone: warning
              detail: 已披露 Leapfrog 推理与动作条件控制。
        - label: 规划与灵巧泛化
          values:
            - label: 高
              tone: risk
              detail: 这套论点要求能力超越当前任务演示。
            - label: 高
              tone: risk
              detail: Rhoda 明确指出仍有重大挑战。
            - label: 早期
              tone: risk
              detail: 概念验证运行不足以证明广泛泛化。
        - label: 网络视频数据与评测
          values:
            - label: 高
              tone: risk
              detail: 模型策略取决于预训练分布。
            - label: 中等
              tone: warning
              detail: 质量失效是合理担忧，但尚未量化。
            - label: 构建阶段
              tone: warning
              detail: 公司正在招聘，搭建数据整理与评测基础设施。
        - label: 从试点到量产的转化
          values:
            - label: 严重
              tone: risk
              detail: 商业价值需要反复实现付费部署。
            - label: 高
              tone: risk
              detail: 公开信息未披露客户和转化率。
            - label: 概念验证
              tone: warning
              detail: 已披露的验证证据是持续数小时的运行，以及一项投资人描述的工作流。
        - label: 资本效率
          values:
            - label: 高
              tone: risk
              detail: 硬件、算力和服务经济性决定融资需求。
            - label: Unknown
              tone: warning
              detail: 公开信息中没有烧钱速度、利润率、定价或物料清单分母。
            - label: 充足融资缓冲
              tone: neutral
              detail: 已筹资金并不能证明可用现金或资金续航。
    approximationNotes: 截至 2026-10-14，所有单元格均为分析师的定性判断，不是经测量的事故概率、经审计的控制措施或经独立验证的性能评级。
