            body: >-
              Rhoda 实体 AI 模式的财务可行性高度取决于单位成本结构和 DVA 的计算强度。不同于每项操作技能需要数百小时远程操作数据的模仿学习平台，Rhoda 用互联网规模视频预训练来建立物理先验，把后训练需求降至
              1 至 10 小时机器人专属轨迹数据，从而显著提升数据效率、压低技能接入成本。但运营交付会带来明显 COGS
              压力：闭环视频预测控制每秒运行数十次，需要专用高性能机载边缘加速器或持续的低延迟云推理，都会产生显著电力、散热或带宽成本。自研轮式移动操作机器人的制造和维护还会产生硬件折旧、执行器更换和现场维护费用，而传统软件供应商无需承担这些成本。CEO
              Jagdeep Singh 指出，现有工业人形机器人原型是无法持续完成工业班次的脆弱玩具，说明打造坚固、生产级硬件需要大量持续维护储备。软件授权毛利率约 75%–85%，全栈硬件交付约
              35%–50%，两者差异很大，因此必须严格评估混合公司毛利。
