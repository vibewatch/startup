callouts:
  - calloutType: strength
    title: Dual-Market Positioning and Enterprise Cross-Chain Defensibility
    body: TRM Labs has established rare commercial gravity spanning both high-profile public sector law enforcement/defense agencies and premier private fintechs including Circle, Coinbase, PayPal, Robinhood, and Stripe [CO007] [CO008]. Its coverage of over 30 blockchains and superior attribution across fast-growing non-EVM ecosystems such as Tron and Solana provide meaningful differentiation against legacy single-chain architectures [CO010] [CO012].
    claimRefs:
      - CO007
      - CO008
      - CO010
      - CO012
  - calloutType: risk
    title: Private ARR Visibility and Incumbent Precedential Moat
    body: While TRM's headline valuation doubled to $2.0B on the back of reported 4x three-year ARR growth, absolute recurring revenue, gross margins, and post-Series C preference stacks remain closely guarded private figures [CO005] [CO006]. Concurrently, primary competitor Chainalysis retains deeper historical courtroom legal precedent in federal criminal trials and marginal attribution advantages in long-tail Bitcoin entity clustering [CO013] [CO014].
    claimRefs:
      - CO005
      - CO006
      - CO013
      - CO014
