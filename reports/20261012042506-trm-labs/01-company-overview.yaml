company:
  name: TRM Labs
chapter:
  number: 1
  title: Company Overview
  summary: TRM Labs is an AI-powered blockchain intelligence platform founded in 2018 in San Francisco that provides transaction monitoring, sanctions screening, and forensic investigations across 30+ blockchains. In 2026, the company closed a $70M Series C at a $1.0B valuation and subsequent strategic expansion doubling its valuation to $2.0B on the back of 4x ARR growth over three years. Despite serving over 500 customers across 40+ countries including major fintechs and federal agencies, key operational metrics including absolute ARR, margin structure, and detailed cap-table terms remain private.
sections:
  - id: sec-identity-model
    title: Corporate Identity, Product Scope & Operating Model
    body: TRM Labs Inc. is a venture-backed blockchain intelligence and regulatory technology company founded in 2018 and headquartered in San Francisco, California [CO001]. The company develops AI-powered software platforms designed to investigate financial crime, monitor illicit transactions, screen cryptocurrency wallets, and counter national security threats across decentralized ecosystems [CO001] [CO002]. Operating at the nexus of financial compliance (RegTech), cybersecurity, and national security infrastructure, TRM Labs ingests and normalizes raw transaction records from over 30 blockchains to reconstruct complex cross-chain fund flows and attribute pseudonymous wallet clusters to real-world entities [CO002] [CO007]. Its enterprise product suite encompasses TRM Forensics for in-depth criminal tracing, TRM Compliance for continuous transaction monitoring (Know-Your-Transaction/KYT), TRM Sanctions for real-time wallet screening, and TRM Data Fusion for secure inter-agency intelligence collaboration [CO007] [CO008]. TRM serves over 500 customers across more than 40 countries, balancing public-sector enforcement engagements with private-sector enterprise subscriptions from leading financial technology and digital asset institutions [CO003] [CO004] [CO007] [CO008].
    tableRefs:
      - TO001
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO007
      - CO008
  - id: sec-leadership-governance
    title: Executive Leadership, Governance & Key-Person Exposure
    body: TRM Labs was established by Chief Executive Officer Esteban Castaño and Chief Technology Officer Rahul Raina, who continue to direct the company's executive strategy and technical architecture [CO001] [CO002]. Castaño brings background from McKinsey & Company and an MBA from Stanford University, steering corporate capital allocation, global commercial expansion, and sovereign government affairs [CO002]. Raina, an alumnus of Carnegie Mellon University and former Amazon software engineer, architects the firm's graph computation engines, automated address-clustering heuristics, and machine learning infrastructure [CO002]. The broader organizational leadership is supported by senior threat intelligence analysts and former law enforcement investigators recruited from federal agencies including the FBI, IRS Criminal Investigation, and Homeland Security Investigations [CO002] [CO009]. Total headcount exceeds 350 personnel operating in a globally distributed model [CO009]. While founder-market fit remains exceptional across cryptographic engineering and government procurement, key-person risk is moderately elevated around the founding duo, whose specialized industry relationships and public reputations remain central to institutional sales and capital access [CO001] [CO002].
    tableRefs:
      - TO002
    claimRefs:
      - CO001
      - CO002
      - CO009
  - id: sec-capitalization-investors
    title: Capitalization, Financing History & Investor Syndicate
    body: Since its 2018 inception, TRM Labs has completed successive institutional financing rounds totaling more than $220 million in aggregate equity capital [CO006]. In February 2026, the company finalized a $70 million Series C financing round that formally minted its unicorn status at a $1.0 billion valuation [CO003]. The round was led by Blockchain Capital—which originally led TRM's 2018 pre-seed round—and included participation from software buyout sponsor Thoma Bravo alongside existing institutional partners Bessemer Venture Partners, Goldman Sachs, Citi Ventures, and PayPal Ventures [CO003]. Subsequently, in September 2026, TRM secured a strategic Series C expansion round that doubled its post-money valuation to $2.0 billion [CO004]. Blockchain Capital again led the expansion, citing rapid commercial adoption and substantial revenue acceleration [CO004] [CO005]. While headline valuation reflects robust investor appetite for mission-critical compliance rails, private capitalization specifics—such as exact preferred liquidation multipliers, dilution percentages, and unallocated option reserves—remain confidential and represent necessary confirmatory diligence items [CO003] [CO004] [CO005] [CO006].
    tableRefs:
      - TO003
    claimRefs:
      - CO003
      - CO004
      - CO005
      - CO006
  - id: sec-milestones-scale
    title: Operating Scale, Product Cadence & Competitive Position
    body: TRM Labs has scaled rapidly from an early-stage monitoring tool to a premier global intelligence provider serving more than 500 institutional clients across 40+ countries [CO007]. Corporate disclosures in September 2026 indicated that annual recurring revenue has quadrupled over the preceding three-year period [CO005]. Platform development has sustained a brisk cadence, highlighted by the February 2026 shipment of 23 intelligence capabilities spanning fentanyl precursor networks, A7 evasion tracking, and direct OFAC sanctions designations influenced by TRM analytics [CO011]. In cross-vendor compliance evaluations, TRM demonstrates significant competitive advantages in multi-chain breadth, supporting over 30 blockchains with market-leading tracking on high-velocity networks like Tron and Solana [CO010]. These capabilities have driven deep adoption across national security agencies combating state-sponsored cyber warfare [CO012]. Nevertheless, the company confronts competitive moats established by incumbent Chainalysis, which possesses longer-standing courtroom precedent in federal criminal trials and deeper legacy Bitcoin attribution databases [CO013] [CO014].
    figureRefs:
      - FO001
    claimRefs:
      - CO007
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
