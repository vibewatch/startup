  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反论点与战略护城河
        blocks:
          - type: paragraph
            body: >-
              TRM Labs 是公共安全、国家安全和企业金融诚信领域增长最快的现代情报平台之一，投资论点颇具吸引力。公司最初用于 追踪 Bitcoin 及新兴区块链上的多链加密货币流，后来已与联邦执法机构和全球 Tier-1
              金融机构建立深度的关键任务 关系。过去三年，年度经常性收入增长至四倍，使公司有望在 2026 年底突破 $100 million ARR 里程碑。凭借这股 运营势头，TRM 从传统龙头 Chainalysis
              手中夺取了可观的市场份额，并赢得了包括 $95 million 美国移民及海关 执法局合同在内的重要单一来源联邦合同。不过，反投资论点集中在三项关键脆弱性：估值在七个月内从 $1.0 billion 激进扩张至
              $2.0 billion；联邦采购抗议正在挑战单一来源政府授标；即将于 2026 年 11 月推出的 AI 调查平台 尚未证明具备企业商业化能力。面对难以预测的宏观环境，投资者必须在 TRM
              强大的公共部门锁定效应与偏高的估值倍数风险 之间权衡。
