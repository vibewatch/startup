              年初的五年期间，商业收入年均增长超过 150%，由 FATF 旅行规则执行、OFAC 制裁指定扩大以及犯罪分子加剧利用区块链轨道共同推动。此外，TRM 报告称，在 2026 年 9 月以 20 亿美元估值完成 C
              轮扩展前的三年内，ARR 增长了四倍。G2 等同行评审平台上的独立用户反馈总体积极：2026 年 22 条经核实评论的平均评分为 4.8/5.0，客户特别认可其玻璃盒归因方法的透明度和直观的调查工作流。
