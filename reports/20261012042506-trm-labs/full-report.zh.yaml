      - number: '1.2'
        title: 高管领导、治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              TRM Labs 由首席执行官 Esteban Castaño 和首席技术官 Rahul Raina 创立，两人继续负责公司的高管战略与技术架构 [CO001] [CO002]。Castaño 曾任
              McKinsey & Company 顾问并拥有斯坦福大学 MBA 学位，负责公司资本配置、全球商业扩张和主权政府事务 [CO002]。Raina 毕业于卡内基梅隆大学，曾任 Amazon
              软件工程师，负责构建公司的图计算引擎、自动地址聚类启发式算法和机器学习基础设施 [CO002]。更广泛的组织领导层由高级威胁情报分析师和前执法调查人员支持，他们来自 FBI、IRS
              刑事调查处和国土安全调查局等联邦机构 [CO002] [CO009]。公司员工总数超过 350 人，采用全球分布式运营模式
              [CO009]。创始团队在密码工程和政府采购领域的匹配度依然突出，但两位创始人的专业行业关系与公众声誉仍是机构销售和资本获取的核心，因此关键人物风险中度偏高 [CO001] [CO002]。
