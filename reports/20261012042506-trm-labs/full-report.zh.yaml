              TRM Labs 已从早期监控工具快速成长为全球领先的情报提供商，在 40 多个国家服务超过 500 家机构客户 [CO007]。公司 2026 年 9 月披露，年度经常性收入在此前三年增长了四倍
              [CO005]。平台开发节奏依然很快，仅 2026 年 2 月就发布了 23 项情报能力，覆盖芬太尼前体网络、A7 规避追踪，以及受 TRM 分析影响的 OFAC 直接制裁指定
              [CO011]。跨供应商合规评估显示，TRM 的多链覆盖能力显著领先，支持 30 多条区块链，并在 Tron、Solana 等高速网络上拥有领先的追踪能力
              [CO010]。这些能力推动其深入服务于打击国家支持的网络战的国家安全机构 [CO012]。不过，公司仍面对老牌竞争者 Chainalysis
              构筑的护城河：后者在联邦刑事审判中拥有更长期的法庭先例，也拥有更深厚的历史比特币归因数据库 [CO013] [CO014]。
