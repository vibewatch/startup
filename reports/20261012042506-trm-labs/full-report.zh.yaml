  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与支出范围
        blocks:
          - type: paragraph
            body: >-
              区块链情报与加密货币合规市场包括一类专业软件平台：摄取分布式账本数据，将加密地址聚类为现实世界实体，按全球制裁名单筛查交易，并调查非法资金流。过去该市场主要被视为执法机构使用的小众取证领域，如今已分化为两类主要支出：强制性商业合规（虚拟资产服务商和银行的了解交易方筛查与反洗钱交易监控），以及公共部门取证情报（威胁图谱分析、反扩散调查和资产追回）。支出边界明确排除传统法币核心银行反洗钱引擎、通用终端网络安全软件和人工取证追回服务，重点放在多链生态中自动实体归因与实时交易评分的软件预算上。随着网络犯罪集团越来越多地使用自动化和人工智能，市场边界正延伸至横向
              AI 金融欺诈检测，将跨链智能合约监控与合成身份防范纳入统一调查套件。
            claimRefs:
              - CM008
              - CM010
              - CM011
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM008
              - CM010
              - CM011
              - CM014
      - number: '2.2'
        title: TAM/SAM/SOM 与市场规模视角
        blocks:
          - type: paragraph
            body: >-
              要估算区块链情报市场，必须把宏观非法资金流量与可实现的软件许可收入拆开。独立市场研究机构预计，全球区块链分析软件行业到 2026 年将超过 $5
              billion，驱动力包括机构数字资产采用加速与国际监管趋严。这类可触达软件支出，实质上是对庞大底层犯罪资本流动征收的防御性税费：TRM Labs 记录显示，2025 年流入型非法加密货币规模达到历史最高的
              $158 billion；尽管这只占链上可归因交易总量的 1.2%，却占全球离开虚拟资产服务商的可用托管流动性的 2.7%。此外，2025 年地缘政治制裁规避资金流达到 $93
              billion，其中以俄罗斯国家支持的、与卢布挂钩的 A7A5 稳定币为主（$72 billion）；中文托管网络处理的区域结算量超过 $100
              billion。在这一数十亿美元级的可触达软件空间中，一级高后果情报平台的 SOM 已由 TRM 的商业轨迹得到印证：公司正向 $100 million ARR 里程碑扩张，并取得 $2 billion
              投后估值。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
