      - number: '1.3'
        title: 资本结构、融资历史与投资者联盟
        blocks:
          - type: paragraph
            body: >-
              自 2018 年成立以来，TRM Labs 已完成多轮机构融资，累计股权资本超过 2.2 亿美元 [CO006]。2026 年 2 月，公司完成 7000 万美元 C 轮融资，并以 10 亿美元估值正式成为独角兽
              [CO003]。本轮由 Blockchain Capital 领投（该机构最初也领投了 TRM 2018 年的种子前轮），软件收购投资方 Thoma Bravo 参与，现有机构伙伴 Bessemer
              Venture Partners、Goldman Sachs、Citi Ventures 和 PayPal Ventures 也跟投 [CO003]。随后在 2026 年 9 月，TRM 获得战略性 C
              轮扩展融资，投后估值翻倍至 20 亿美元 [CO004]。Blockchain Capital 再次领投，理由是商业采用快速增长且收入加速明显 [CO004]
              [CO005]。这笔表面估值反映出投资者对关键合规基础设施的强劲需求，但私营资本结构细节——如确切的优先清算倍数、稀释比例和未分配期权储备——仍属机密，后续尽调必须确认 [CO003] [CO004]
              [CO005] [CO006]。
