      - number: '8.2'
        title: 融资历史、倍数扩张与资本结构
        blocks:
          - type: paragraph
            body: >-
              自 2018 年成立以来，TRM Labs 已通过七轮融资累计筹集约 $220 million 股权资金。2026 年 2 月，公司完成一轮 $70 million 的 Series C 融资，投后估值达到
              $1.0 billion，由早期投资者 Blockchain Capital 联合领投，Goldman Sachs、Bessemer Venture Partners 和 Thoma Bravo
              参与，正式成为独角兽。仅七个月后，2026 年 9 月，TRM 宣布由 现有投资者主导的内部 Series C 扩展轮，将估值翻倍至 $2.0 billion。按接近 $100 million 的 ARR
              运行率计算，这笔 最新交易对应约 20x ARR 的隐含远期倍数。相比之下，成熟网络情报公司和上市 SaaS 同行的交易倍数为 8x–12x ARR， 这一估值溢价很高；相较主要竞争对手 Chainalysis
              也明显偏离，后者的峰值 $8.6 billion 估值在 2026 年二级交易中 被预估为 $1.55 billion。TRM 的高估值倍数明确建立在品类扩张之上：从专注链上加密追踪，扩展到覆盖多向量威胁的 通用
              AI 犯罪调查。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV013
      - number: '8.3'
        title: 乐观、基准与悲观情景预测
        blocks:
          - type: paragraph
            body: >-
              为评估截至 2028 年不同市场结果下的风险调整后回报，我们根据收入扩张、合同稳固性和平台采用率建立三种运营情景。 乐观情景（25% 概率）中，TRM 成功守住 $95 million ICE
              合同，企业客户迅速采用 2026 年 11 月推出的 AI 调查套件， ARR 以每年 60% 的速度复合增长，到 2028 年达到 $260 million。假设 IPO 时终端 ARR 倍数维持在
              18x，公司企业估值 达到 $4.7 billion，年化回报约 33%。基准情景（50% 概率）中，TRM 维持核心区块链分析优势，AI 采用率稳步提升， ARR 以每年 40% 的速度复合增长，到 2028
              年达到 $195 million。倍数压缩至正常化的 14x ARR 后，估值为 $2.7 billion，对应 11% IRR。悲观情景（25% 概率）中，联邦采购抗议迫使 ICE 合同重新竞标，AI
              平台扩张遭遇客户反弹， 增速降至每年 20%（2028 年 ARR 为 $144 million）。倍数压缩至 8x ARR 后，企业价值为 $1.15 billion，后期投资者 将面临 42% 的资本回撤。
            claimRefs:
              - CV004
              - CV006
              - CV012
