              TRM Labs 的生产部署已覆盖知名商业企业和领先国际执法机构。Circle、Coinbase、Cross River Bank、PayPal、Robinhood、Stripe 和 Visa
              等一级金融机构与金融科技领导者依赖 TRM Labs 开展存款和取款筛查、制裁合规及自动风险评分。在公共部门，TRM 的调查情报直接支持了全球具有标志性的刑事打击行动。2025 年，TRM
              协助美国司法部执行历史上规模最大的加密货币查扣行动之一，追回约 $225 million 与杀猪盘和投资诈骗集团有关的 USDT。在加拿大，TRM
              提供的取证情报帮助执法机构在一宗重大儿童性虐待材料调查中锁定并逮捕嫌疑人。同样，泰国当局利用 TRM 的交易追踪瓦解国际诈骗集团，瑞典机构借助取证线索取得具有里程碑意义的恐怖融资定罪。此外，TRM
              的制裁情报直接促成美国 OFAC 将 ZXion 指定为非法伊朗金融中介。这些跨司法辖区成果由 TRM 的 Beacon Network 推动，该情报共享通道将执法警报与参与交易所实时连接。
