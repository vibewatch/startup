  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 高管风险评估与威胁格局
        blocks:
          - type: paragraph
            body: >-
              TRM Labs 处于数字资产合规、国家安全情报和金融犯罪执法的关键交汇点。公司在 2026 年 9 月 C 轮扩展中取得 20 亿美元里程碑估值，并覆盖超过 190 条区块链和 19
              亿项数字资产，但其底层风险状况越来越受宏观威胁速度与结构性竞争阻力塑造。2025 年全球非法加密货币交易量升至前所未有的 1580 亿美元，推动力包括俄罗斯国家支持的制裁规避基础设施，如与卢布挂钩的 A7A5
              代币和 A7 钱包网络。与此同时，2026 年犯罪分子采用人工智能工具的速度同比上升 40%，降低了部署自动深度伪造社会工程和勒索软件的威胁行为者的技术门槛。对 TRM Labs
              而言，在威胁爆发式增长期间维持高归因精度需要持续再投入资本，使平台容易受到更广泛的加密货币交易量下滑和客户合规预算收缩影响。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
              - CR014
      - number: '7.2'
        title: 监管、法律与联邦采购风险
        blocks:
          - type: paragraph
            body: >-
              随着 TRM Labs 将公共部门业务扩展到 75 个国家的 600 多家政府机构和私营机构，监管与法律风险已变得尖锐。最直接的商业脆弱性来自老牌竞争者诉讼：2026 年 8 月，市场先行者
              Chainalysis 提起联邦诉讼，挑战移民与海关执法局（ICE）授予 TRM Labs 的 9460 万美元合同。联邦合同框架和证据可信度是 TRM
              企业估值的基石，任何采购暂停、司法禁令或重新竞标都可能实质性扰乱预期的联邦扩张和投资者预期。与此同时，平台还要应对复杂跨境制裁规避网络带来的严重合规风险；这些网络通过稳定币、嵌套的高风险交易所和中文托管服务输送数百亿美元。若无法实时发现规避型交易拓扑，可能招致包括美国财政部外国资产控制办公室在内的全球执法机构严厉监管审查。
            claimRefs:
