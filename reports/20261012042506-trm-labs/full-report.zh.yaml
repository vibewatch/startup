      - number: '3.4'
        title: 切换成本、多归属与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              区块链分析品类的客户留存极其持久，合规团队通常会保留初始供应商三年或更久。切换成本本质上是架构和运营问题，而非纯粹的合同问题：迁移平台需要重配可疑活动报告（SAR）申报流程，重新培训缺乏深度加密取证经验的运营人员，适应不同的风险评分分类法，并对无法在竞争平台之间干净导出的历史集群记录进行调和。这种运营惯性强化了
              Chainalysis 在美国一级银行、全球交易所和政府机构中的老牌护城河，因为检查人员和检察官早已熟悉 Chainalysis Reactor
              的可视化。为应对这些取舍，一级机构越来越多采用多归属双栈架构，而不是选择单一赢家。大型机构经常将 Chainalysis 作为复杂取证案件和监管调查的权威主栈，同时运行 TRM
              Labs，作为自动钱包筛查、支付决策和稳定币资金流监控的高吞吐运营层。
            claimRefs:
              - CP010
              - CP011
              - CP012
