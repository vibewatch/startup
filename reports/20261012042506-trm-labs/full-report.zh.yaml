    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、产品范围与运营模式
        blocks:
          - type: paragraph
            body: >-
              TRM Labs Inc. 是一家风险投资支持的区块链情报与监管科技公司，2018 年成立，总部位于加利福尼亚州旧金山 [CO001]。公司开发 AI
              驱动的软件平台，用于调查金融犯罪、监控非法交易、筛查加密货币钱包，并应对去中心化生态中的国家安全威胁 [CO001] [CO002]。TRM Labs
              位于金融合规（RegTech）、网络安全和国家安全基础设施的交汇处，从 30 多条区块链摄取并标准化原始交易记录，重建复杂的跨链资金流，并将假名钱包集群归因到现实世界实体 [CO002]
              [CO007]。其企业产品套件包括用于深度犯罪追踪的 TRM Forensics、持续交易监控（Know-Your-Transaction/KYT）的 TRM Compliance、实时钱包筛查的 TRM
              Sanctions，以及安全开展跨机构情报协作的 TRM Data Fusion [CO007] [CO008]。TRM 在 40 多个国家服务超过 500
              家客户，既承接公共部门执法项目，也向领先的金融科技与数字资产机构提供私营企业订阅服务 [CO003] [CO004] [CO007] [CO008]。
