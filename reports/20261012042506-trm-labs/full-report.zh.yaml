      - number: '6.4'
        title: 留存持久性、采购摩擦与扩张阻力
        blocks:
          - type: paragraph
            body: >-
              尽管客户总量增长很快，TRM Labs
              在竞争激烈的企业环境中仍遇到实质性采购摩擦和扩张挑战。公司不公开企业软件产品的标准分层价格，潜在买方必须参加冗长的销售演示并协商定制商业方案，这会给较小的加密协议和金融科技初创企业带来摩擦。此外，企业账户在
              API 管道投入运行后切换成本很高，但独立从业者评论指出，复杂图谱调查仍存在技术局限。具体而言，用户称交易追踪在复杂跨链环境中偶尔会走到死胡同，渲染涉及数千跳的大型图谱拓扑时性能也会下降。TRM
              还没有公开披露核心 SaaS 留存指标——如净收入留存率（NRR）、毛收入留存率（GRR）或平均合同期限——因此，在 TRM 与老牌 Chainalysis
              争夺联邦和金融企业续约时，客户群持久性与公共部门长期续约稳定性仍需通过私下尽调确认。
            claimRefs:
              - CU005
              - CU012
              - CU013
