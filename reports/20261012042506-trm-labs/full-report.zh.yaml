  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 六阶段分析决策序列，将市场机会、运营规模、竞争护城河、采购风险和估值倍数连接到最终投资立场。
    approximationNotes: 逻辑决策路径节点展示导向买入建议的顺序投资标准和风险关口。
    data:
      nodes:
        - id: market-opportunity
          label: 市场机会
          detail: $158B 非法加密货币交易量和犯罪 AI 采用率同比激增 40%，为调查基础设施带来迫切需求。
        - id: operating-scale
          label: 运营规模
          detail: TRM 覆盖 75+ 个国家的 600+ 家机构客户，拥有 500 名员工，ARR 里程碑接近 $100M。
        - id: competitive-moat
          label: 竞争护城河
          detail: 多链归因和深厚的联邦调查人才储备替代在位者 Chainalysis，$95M ICE 赢单就是证据。
        - id: execution-risks
          label: 执行与法律风险
          detail: Chainalysis 正式抗议 ICE 授标，而尚未发布的 AI 调查平台商业采用仍未经验证。
        - id: valuation-pricing
          label: 估值定价
          detail: $2.0B Series C 扩展轮隐含约 20 倍 ARR，已将从加密追踪扩展到 AI 防御的品类扩张计入价格。
        - id: investment-decision
          label: 投资决策
          detail: 建议买入，但要控制仓位；持续关注 ICE 采购问题的解决进展，以及 2026 年 11 月 AI 平台的发布。
      edges:
        - from: market-opportunity
          to: operating-scale
        - from: operating-scale
          to: competitive-moat
        - from: competitive-moat
          to: execution-risks
        - from: execution-risks
          to: valuation-pricing
        - from: valuation-pricing
          to: investment-decision
