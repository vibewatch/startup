              - CM006
              - CM008
      - number: '2.3'
        title: 买方细分与预算归属
        blocks:
          - type: paragraph
            body: >-
              区块链情报采购在公共安全和商业金融基础设施中对应不同买方角色。公共部门的主要买方是专业联邦执法机构、国家安全指挥部门和 75
              多个司法辖区的监管执法部门，资金来自机构网络犯罪专项拨款和联邦资产没收再投资基金。对这些公共部门买方而言，采购触发点包括取证证据标准、多跳跨链追踪的可辩护性，以及法庭可采信的证据保管链文件。相反，私营部门买方包括受监管的加密交易所、加密托管机构和
              Visa、Stripe、PayPal 等一级支付网络，预算通常归首席合规官或金融犯罪合规负责人管理。商业采购由旅行规则强制合规、FinCEN 和 FATF
              监管检查以及银行伙伴审计要求触发，采用多年期企业订阅合同，分层定价随受监控 API 交易量扩大。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM013
              - CM014
      - number: '2.4'
        title: 增长驱动、采用瓶颈与风险
        blocks:
          - type: paragraph
            body: >-
              AI 增强型金融犯罪速度叠加、监管执法加强，推动市场扩张。TRM Labs 的《2026 年 AI 犯罪采用指数》显示，犯罪分子采用人工智能的得分达到
              54/100；工业化诈骗活动中，报告的深度伪造欺诈损失年初至今较 2025 全年激增 263%。这些新型威胁迫使合规和情报团队从静态规则启发式升级到实时、AI
              原生调查平台。但结构性约束也限制供应商扩张。老牌供应商 Chainalysis
              拥有根深蒂固的多年政府合同框架，以及遍布美国联邦司法巡回区的法庭先例信誉，使竞争平台面临高昂的切换成本和采购惯性。此外，非法资金高度集中在国家级和受制裁基础设施（如俄罗斯 A7
              网络）上，带来地缘政治波动与归因风险；供应商必须持续投入资本建设专业情报能力，避免数据盲区。当前招聘中对拥有 5 至 8 年区块链或金融犯罪经验的高级情报分析师的要求表明，该品类扩张也取决于稀缺的调查人才
              [CM015]。
            claimRefs:
              - CM002
              - CM011
              - CM012
              - CM013
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 从加密追踪到 AI 原生金融犯罪制图的双引擎扩张
            body: >-
              TRM Labs 的可触达市场正从小众加密取证转向横向 AI 犯罪调查。数字犯罪集团在支付轨道上部署合成身份、自动聊天和深度伪造后，区块链追踪与广义金融情报之间的边界逐渐消失，TRM
              的目标预算池也从专业加密合规团队扩展至企业欺诈部门和国家安全指挥机构。
            calloutType: insight
            claimRefs:
              - CM002
              - CM011
              - CM012
          - type: callout
            title: 美国联邦执法中的高切换摩擦与老牌厂商根基
            body: >-
              TRM Labs 虽已在多链分析和私营金融科技客户中快速取得市场份额，但在一级美国联邦机构替代 Chainalysis 仍面临显著结构性摩擦。既有司法先例、历史证据标准和多年期机构框架采购协议，要求 TRM
              先证明其取证可辩护性更强，才能获得独家主供应商地位。
            calloutType: risk
            claimRefs:
              - CM008
              - CM013
              - CM014
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与品类细分
        blocks:
          - type: paragraph
            body: >-
              加密货币交易监控、取证调查和反洗钱合规的商业市场已集中到五家专业供应商：Chainalysis、TRM Labs、Elliptic、Merkle Science 和
              Scorechain。受监管的虚拟资产服务商（VASPs）、商业银行和监管机构必须遵守欧盟《加密资产市场监管法案》（MiCA）、《资金转移监管条例》（TFR）旅行规则和 FinCEN
              制裁公告等框架下的严格监管要求。这些合规制度使机构市场参与者无法绕开区块链分析。Chainalysis 仍是市场老大，自 2014 年以来已在美国联邦执法和一级交易所建立广泛的证据记录，估值达 86 $8.6
              billion。TRM Labs 2018 年成立，在 2026 年 C 轮扩展后估值 $2.0 billion，已成为增长最快、也是 Chainalysis 最直接的同类挑战者。总部位于伦敦的区域竞争者
              Elliptic 重点经营欧洲监管关系和获英国 FCA 授权的机构；Merkle Science 面向亚太交易所提供预测型风险模型；Scorechain
              服务本地化的欧盟合规团队。对大多数机构而言，用内部自建替代商业平台在经济上难以承受：每年需投入超过 €5 million、12 至 18 个月工程时间，仍无法达到全球聚类或实时制裁数据流的同等水平。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP009
      - number: '3.2'
        title: 能力基准：归因深度与 API 性能
        blocks:
          - type: paragraph
            body: >-
              区块链情报平台的核心产品差异，集中在被动取证调查与实时自动决策之间的运营分界。Chainalysis 以取证追踪和执法数据共享建立声誉，其旗舰 Reactor
              界面已成为联邦检察官和资深区块链分析师经过法庭验证的标准。相反，TRM 采用 API
              优先设计，直接嵌入高交易量核心银行、金融科技和交易所流程，在毫秒级延迟预算内返回风险评分。技术基准显示，不同生态的区块链覆盖与归因深度存在明显差异。Chainalysis 覆盖 20
              多条主要区块链，在比特币和老牌交易所集群上拥有无可比拟的历史深度；TRM 支持 30 多条区块链，并在 Tron、Solana 和新兴 EVM Layer-2
              网络上建立了独特优势，而现代稳定币支付量的大部分交易正发生在这些网络。TRM 部署行为聚类算法、跨去中心化金融协议的跨链追踪，以及能够追踪快速跳转中混淆模式的机器学习模型。仅 2026 年 2 月，TRM
              就发布了 23 项情报更新，将受制裁实体地址覆盖扩展到 1160 万个地址，并追踪 19 亿项加密资产。
