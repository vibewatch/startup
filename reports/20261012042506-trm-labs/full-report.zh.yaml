      - number: '3.3'
        title: 定价经济、隐性成本与采购取舍
        blocks:
          - type: paragraph
            body: >-
              加密合规领域的企业软件定价仍不透明，通常采用按年、多层级合同，取决于交易量、受监控地址、链覆盖和调查席位数量。欧洲 CASP 采购基准数据显示，TRM Labs
              提供较易进入的中端价格点：中型受监管实体通常每年支付 €60,000 至 €150,000；Elliptic 为 €80,000 至 €180,000，Chainalysis 为 €120,000 至
              €250,000。Costbench 汇总的经核实买方报告显示，TRM Labs 企业客户的年度合同价值中位数为 $112,000，高交易量机构的合同金额从 $50,000 到 $500,000
              不等。但潜在买家的总拥有成本变量远超初始软件报价。已记录的采购摩擦包括模块扩展失控：增加取证席位、旅行规则模块或专用数据流会大幅推高合同金额。此外，TRM 合同通常要求自动续期，须在周年日前 30
              天书面通知取消，同时还存在专业实施、API 集成维护和员工合规培训等隐性成本。
            claimRefs:
