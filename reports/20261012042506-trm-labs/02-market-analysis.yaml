    title: "The Dual-Engine Expansion from Crypto Tracing to AI-Native Financial Crime Mapping"
    body: "TRM Labs' addressable market is transitioning from niche cryptocurrency forensics into horizontal AI crime investigation. As digital crime syndicates deploy synthetic identities, automated chat, and deepfakes across payments rails, the distinction between blockchain tracing and generalized financial intelligence dissolves, expanding TRM's target budget pools from specialized crypto compliance teams to enterprise fraud and national security commands."
    claimRefs:
      - "CM002"
      - "CM011"
      - "CM012"
