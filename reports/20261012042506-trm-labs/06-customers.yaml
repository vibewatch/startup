callouts:
  - calloutType: "strength"
    title: "Dual Public-Private Moat and Mission-Critical Stickiness"
    body: "TRM Labs' balanced customer distribution between government enforcement agencies (60% of business) and private financial institutions (40% of business) creates a unique structural moat. Law enforcement reliance on TRM Forensics for courtroom-admissible evidence and asset seizures yields exceptional contract durability, while commercial partnerships with networks like Visa, PayPal, and Circle drive high-volume recurring API screening demand."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU006"

  - calloutType: "risk"
    title: "Procurement Opacity and Enterprise Graph Performance Bottlenecks"
    body: "TRM Labs' enterprise expansion faces headwinds from lack of transparent pricing, requiring lengthy custom commercial proposal cycles that disadvantage smaller protocols. Additionally, user reviews highlight technical limitations during massive graph investigations and occasional dead ends in complex DeFi transaction flows, leaving openings for incumbent competitors like Chainalysis."
    claimRefs:
      - "CU012"
      - "CU013"

