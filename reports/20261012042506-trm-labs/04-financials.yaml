      - "CI010"
  - calloutType: "insight"
    title: "Valuation Expansion Outpaces Disclosed Metric Visibility"
    body: "TRM Labs' valuation doubled from 1 billion dollars in February 2026 to 2 billion dollars in September 2026 on the back of reported 4x ARR growth over three years. However, the absence of public disclosures regarding absolute revenue, gross margin, and net retention requires private-stage investors to verify underlying unit economics before underwriting terminal multiples."
