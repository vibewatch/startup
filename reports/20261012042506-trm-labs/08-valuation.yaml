- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Basis & Evidence
  - Decision Implication
  rows:
  - - Recommendation
    - Buy
    - Quadrupled ARR in 3 years with $100M run-rate imminent; 600+ agency/enterprise clients across 75 countries.
    - Authorize position within specialized growth or cybersecurity allocation mandates.
  - - Confidence
    - Medium
    - Strong operational evidence from federal contracts and top-tier co-investors, offset by undisclosed product-level margins.
    - Maintain standard position sizing with milestone-gated follow-on reserves.
  - - Risk Rating
    - Medium
    - Sole-source ICE contract protest by Chainalysis and unproven commercial adoption of nascent AI platform.
    - Require legal tracking of federal procurement protest and customer reference checks.
  - - Valuation Stance
    - Fair
    - 20x forward ARR multiple reflects premium pricing for category expansion from crypto tracing to crimefighting AI.
    - Enforce entry discipline; avoid participating at ungrounded premium step-ups above $2.0B.
  notes: Assessment synthesizes disclosed Series C expansion valuation terms, reported ARR milestones, and federal procurement
    records as of Q3 2026.
