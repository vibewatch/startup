- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key Operating Assumptions
  - Valuation & Multiple Logic
  - Key Risks & Downside Triggers
  - Probability Signal
  rows:
  - - Bull Case
    - Defends $95M ICE contract; AI suite scales rapidly across federal and Fortune 500 accounts; 60% ARR CAGR to $260M by
      2028.
    - $4.7B terminal valuation based on 18x ARR multiple reflecting AI category leadership; ~33% annualized return.
    - Federal regulatory shifts toward open-source compliance or aggressive pricing competition.
    - 25%
  - - Base Case
    - Core crypto tracing compounds at 40% ARR CAGR to $195M by 2028; steady cross-selling of AI investigative tools.
    - $2.7B terminal valuation based on 14x ARR multiple reflecting normalized growth; ~11% annualized return.
    - Extended sales cycles in private financial sector and minor contract scope adjustments.
    - 50%
  - - Bear Case
    - ICE sole-source contract overturned; AI platform adoption stalls; revenue growth moderates to 20% ($144M ARR by 2028).
    - $1.15B terminal valuation based on 8x ARR multiple reflecting cyber SaaS re-rating; -42% capital loss.
    - Customer concentration churn, competitive win-rate erosion by Chainalysis, and down-round restructuring.
    - 25%
  notes: Scenario models assume a 2-year forward horizon from late 2026 to late 2028 based on $100M current ARR baseline and
    diluted share stability.
