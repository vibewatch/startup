- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Pillar
  - Investment Thesis (Bull/Core)
  - Anti-Thesis (Bear/Risk)
  - View-Changing Diligence Trigger
  rows:
  - - Scale & Growth
    - ARR quadrupled in 3 years approaching $100M threshold with 150%+ 5-year revenue CAGR.
    - Top-line growth could decelerate sharply if crypto transaction volumes stagnate or commoditize.
    - Quarterly ARR growth dropping below 35% YoY or net revenue retention falling under 115%.
  - - Federal Defensibility
    - Sole-source $95M ICE contract award demonstrates displacement of incumbent Chainalysis in marquee agency.
    - Chainalysis formal procurement protest could overturn award or trigger competitive bidding.
    - Government Accountability Office (GAO) or court ruling sustaining the Chainalysis bid protest.
  - - AI Platform Expansion
    - Category creation in AI investigations broadens TAM from $2B crypto compliance to $20B+ enterprise fraud.
    - AI investigations product not publicly launched until November 2026; unproven commercial willingness to pay.
    - Enterprise pipeline conversion showing fewer than 25 non-crypto enterprise logos after two quarters.
  - - Valuation Multiple
    - $2.0B valuation reflects unique strategic positioning as defense layer for emerging AI and digital asset threats.
    - 20x ARR multiple creates down-round risk relative to peer multiples trading at 8x-12x ARR.
    - Secondary market discounts exceeding 25% or peer valuation compression across cybersecurity unicorns.
  notes: Thesis arguments synthesize management announcements, co-investor commentary, competitor benchmarks, and legal procurement
    filings.
