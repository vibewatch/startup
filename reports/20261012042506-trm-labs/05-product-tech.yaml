  title: "Product & Technology"
  summary: "TRM Labs delivers an AI-native blockchain intelligence platform spanning real-time risk screening across 190+ blockchains, multi-chain graph forensics, and public-private intelligence networks. Anchored by its Threat Graph of over 3.1 billion labeled addresses and the Orion-powered Co-Case Agent, TRM differentiates through a glass-box evidentiary model and deep public-sector integration, while navigating technical friction in indirect risk calibration and dependency on proprietary ecosystem alliances."
sections:
  - id: "product-service-definition"
    title: "Product Architecture and Core Workflow Delivery"
    body: "TRM Labs defines its product suite around the operating workflows of cryptocurrency exchanges, institutional banks, and national security investigators facing sophisticated financial crime. Rather than functioning as a black-box scoring service, TRM provides an AI-native investigations platform and real-time transaction screening engine that exposes visible source data, confidence levels, and explicit attribution logic for every risk score. In day-to-day operations, compliance officers utilize TRM Transaction Monitoring and API screening to evaluate inbound and outbound transfers against designated entity lists, darknet markets, and high-risk counterparty clusters before funds settle. Simultaneously, law enforcement and specialized forensic analysts deploy TRM Forensics and its embedded Co-Case Agent to translate natural language inquiries into multi-chain graph expansions, cluster criminal syndicates, and compile audit-ready freeze packages for judicial submission. This dual architecture bridges preventative front-end transaction gating with post-incident asset recovery workflows across global jurisdictions."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"

  - id: "modules-and-technical-stack"
    title: "Platform Modules, Infrastructure Stack, and Differentiation"
    body: "The core technical foundation of TRM Labs rests on its proprietary Threat Graph, which tracks over 50 categories of illicit activity across 184+ blockchains and maintains real-time indexing on 57+ distinct chains. The underlying infrastructure combines distributed data pipelines with a web-tier built on React, Node.js, and PostgreSQL, supporting both customer-facing applications and low-latency screening APIs capable of processing billions of on-chain events. TRM's primary competitive differentiation centers on its 'glass box' attribution methodology, where risk decisions are accompanied by provenance trails acceptable to supervisory examiners, banking partners, and courts. This is complemented by the Orion model and Co-Case Agent launched in March 2026, which automates complex graph audits and cross-chain fund tracing without charging incremental add-on licensing fees. By operating at the nexus of automated graph heuristics and human analyst tradecraft, TRM provides specialized tracing capabilities, including MimbleWimble privacy protocol parsing and deep tracking across ruble-pegged A7 evasion infrastructure. Current intelligence hiring materials further describe reusable AI pipelines that convert diverse signals into attribution and augment target selection, showing that human tradecraft remains embedded in the technical stack [CE014]."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE014"
    tableRefs:
      - "TE002"

  - id: "ecosystem-trust-and-operating-risks"
    title: "Operating Networks, Compliance Governance, and Technical Vulnerabilities"
    body: "Beyond standalone software instances, TRM Labs operates collective intelligence networks that link public and private sector defenses. The Beacon Network connects approximately 100 verified law enforcement agencies globally with institutions covering 85% of centralized cryptocurrency transaction volume, while the Benchmark Network facilitates peer threat sharing among 70+ financial institutions across 21 countries. In operational execution, TRM partners directly with major stablecoin issuers and public blockchains through initiatives like the T3 Financial Crime Unit (T3 FCU) alongside Tether and TRON, which has frozen over USD 450 million in illicit USDT within 24 hours of law enforcement requests. Despite these successes, the operating architecture faces material technical and governance challenges. Managing indirect exposure across multi-hop transactions risks generating excessive unactionable alerts or driving lawful users from compliant venues. Furthermore, decentralized finance smart contracts cannot execute native KYC/AML controls, restricting TRM's real-time screening surface to front-end Web3 interfaces, while the platform's heavy on-chain specialization creates gaps in traditional fiat transaction monitoring and automated SAR filing."
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
    tableRefs:
      - "TE003"

