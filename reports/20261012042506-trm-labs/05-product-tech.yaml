callouts:
  - calloutType: "strength"
    title: "Glass-Box Evidentiary Transparency as an Institutional Moat"
    body: "TRM's strict adherence to transparent, audit-ready scoring provides full source provenance, confidence metrics, and attribution paths for every flagged wallet. In contrast to opaque black-box machine learning systems, this glass-box model equips institutional compliance officers and prosecutors with defensible evidence suitable for formal regulatory examinations, SAR narratives, and criminal indictments."
    claimRefs:
      - "CE002"
      - "CE006"

  - calloutType: "risk"
    title: "Indirect Risk Thresholding and Scope Limitation in Fiat Systems"
    body: "As crypto laundering networks adopt complex multi-hop layering through mixers and decentralized bridges, defining indirect exposure thresholds becomes technically fraught. Aggressive thresholding creates severe alert fatigue for compliance analysts, while conservative rules risk missing secondary laundering chains. Furthermore, TRM's pure-play on-chain focus leaves traditional fiat AML and SAR filing uncovered without secondary software integrations."
    claimRefs:
      - "CE011"
      - "CE013"

