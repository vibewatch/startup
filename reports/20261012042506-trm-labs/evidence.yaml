evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics-arr
    missingEvidence: >-
      Audited financial statements, absolute annual recurring revenue (ARR), gross margins, net retention rate (NRR),
      and customer acquisition cost (CAC).
    whyItMatters: >-
      While TRM reported 4x ARR growth over three years and achieved a $2.0B valuation, without absolute revenue figures
      and margin profiles, intrinsic valuation multiples cannot be verified.
    diligencePath: >-
      Request confidential financial disclosure package, audited income statement, and customer cohort retention data
      during late-stage institutional diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Complete cap table schedule detailing exact equity percentages, option pools, liquidation preference seniorities,
      and governance voting thresholds.
    whyItMatters: >-
      Public announcements confirm syndicate participants (Blockchain Capital, Thoma Bravo, Goldman Sachs, Bessemer,
      Citi) but omit ownership percentages and structural downside protections.
    diligencePath: >-
      Review certified cap table, investor rights agreement (IRA), and certificate of incorporation during formal legal
      and confirmatory diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Granular vendor-by-vendor ARR breakdown and market share splits between TRM Labs, Chainalysis, and Elliptic across
      federal versus commercial accounts.
    whyItMatters: >-
      Without segmented ARR disclosures, market share shifts and serviceable obtainable market (SOM) penetration cannot
      be audited beyond vendor valuation headlines.
    diligencePath: FOIA disclosures on federal procurement contract awards and private secondary-market funding circulars.
    relatedQuestionRefs:
