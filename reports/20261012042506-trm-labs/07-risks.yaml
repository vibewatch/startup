    to binary procurement outcomes. The August 2026 Chainalysis lawsuit contesting ICE's $94.6 million contract award underscores
    that government expansion remains litigious and vulnerable to competitor protest, while reliance on Palantir for FedRAMP
    High deployment represents an unhedged operational counterparty risk.
