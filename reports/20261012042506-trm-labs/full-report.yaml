        title: Executive Leadership, Governance & Key-Person Exposure
        blocks:
          - type: paragraph
            body: >-
              TRM Labs was established by Chief Executive Officer Esteban Castaño and Chief Technology Officer Rahul
              Raina, who continue to direct the company's executive strategy and technical architecture [CO001] [CO002].
              Castaño brings background from McKinsey & Company and an MBA from Stanford University, steering corporate
              capital allocation, global commercial expansion, and sovereign government affairs [CO002]. Raina, an
              alumnus of Carnegie Mellon University and former Amazon software engineer, architects the firm's graph
              computation engines, automated address-clustering heuristics, and machine learning infrastructure [CO002].
              The broader organizational leadership is supported by senior threat intelligence analysts and former law
              enforcement investigators recruited from federal agencies including the FBI, IRS Criminal Investigation,
              and Homeland Security Investigations [CO002] [CO009]. Total headcount exceeds 350 personnel operating in a
              globally distributed model [CO009]. While founder-market fit remains exceptional across cryptographic
              engineering and government procurement, key-person risk is moderately elevated around the founding duo,
              whose specialized industry relationships and public reputations remain central to institutional sales and
              capital access [CO001] [CO002].
