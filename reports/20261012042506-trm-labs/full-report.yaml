      - number: '4.2'
        title: Go-to-Market Motion and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              TRM Labs executes a dual go-to-market motion, pairing a consultative enterprise direct-sales team
              targeting global financial institutions with a specialized government affairs and public sector sales
              force navigating complex procurement procedures. In the public sector, customer acquisition involves
              extensive evaluation periods, pilot testing, and formal RFP bidding, often requiring 6 to 18 months to
              close but yielding multi-year government contracts. On the private sector side, sales cycles are driven by
              compliance deadlines, exchange licensing requirements, and risk mitigation mandates. TRM's unit economics
              reflect typical high-gross-margin software dynamics offset by infrastructure overhead; the platform tracks
              over 1.9 billion digital assets and 3.1 billion address labels across multiple blockchain ecosystems,
              demanding continuous cloud compute, RPC node indexing, and automated clustering. While absolute gross
              margins remain private, operational leverage expands as recurring license fees outpace incremental
              indexing compute costs.
