            title: Glass-Box Evidentiary Transparency as an Institutional Moat
            body: >-
              TRM's strict adherence to transparent, audit-ready scoring provides full source provenance, confidence
              metrics, and attribution paths for every flagged wallet. In contrast to opaque black-box machine learning
              systems, this glass-box model equips institutional compliance officers and prosecutors with defensible
              evidence suitable for formal regulatory examinations, SAR narratives, and criminal indictments.
            calloutType: strength
            claimRefs:
