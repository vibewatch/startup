  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture and Core Workflow Delivery
        blocks:
          - type: paragraph
            body: >-
              TRM Labs defines its product suite around the operating workflows of cryptocurrency exchanges,
              institutional banks, and national security investigators facing sophisticated financial crime. Rather than
              functioning as a black-box scoring service, TRM provides an AI-native investigations platform and
              real-time transaction screening engine that exposes visible source data, confidence levels, and explicit
              attribution logic for every risk score. In day-to-day operations, compliance officers utilize TRM
              Transaction Monitoring and API screening to evaluate inbound and outbound transfers against designated
              entity lists, darknet markets, and high-risk counterparty clusters before funds settle. Simultaneously,
              law enforcement and specialized forensic analysts deploy TRM Forensics and its embedded Co-Case Agent to
              translate natural language inquiries into multi-chain graph expansions, cluster criminal syndicates, and
              compile audit-ready freeze packages for judicial submission. This dual architecture bridges preventative
              front-end transaction gating with post-incident asset recovery workflows across global jurisdictions.
            claimRefs:
