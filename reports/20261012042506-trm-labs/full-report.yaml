      - number: '6.3'
        title: Enterprise Customer Proof & Law Enforcement Outcomes
        blocks:
          - type: paragraph
            body: >-
              Production deployment proof for TRM Labs spans high-profile commercial enterprises and leading
              international law enforcement bodies. Tier-1 financial institutions and fintech leaders including Circle,
              Coinbase, Cross River Bank, PayPal, Robinhood, Stripe, and Visa rely on TRM Labs for deposit and
              withdrawal screening, sanctions compliance, and automated risk scoring. In the public sector, TRM Labs'
              investigative intelligence has directly supported landmark criminal disruption operations worldwide. In
              2025, TRM Labs assisted the United States Department of Justice in executing one of its largest
              cryptocurrency seizures in history, recovering approximately $225 million in USDT associated with
              pig-butchering and investment fraud syndicates. In Canada, forensic intelligence supplied by TRM Labs
              enabled law enforcement to identify and arrest a suspect in a major child sexual abuse material
              investigation. Similarly, authorities in Thailand utilized TRM Labs' transaction tracing to dismantle an
              international scam syndicate, and Swedish agencies secured a landmark terrorism financing conviction using
              forensic leads. In addition, TRM Labs' sanctions intelligence contributed directly to the US OFAC
              designation of ZXion as an illicit Iranian financial intermediary. These multi-jurisdictional outcomes are
              facilitated by TRM Labs' Beacon Network, an intelligence-sharing rail that links law enforcement alerts
              with participating exchanges in real time.
