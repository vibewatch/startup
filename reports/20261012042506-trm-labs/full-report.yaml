      - number: '6.2'
        title: Commercial Adoption Trajectory & Global Deployment Scale
        blocks:
          - type: paragraph
            body: >-
              TRM Labs has demonstrated rapid customer adoption and sustained commercial expansion since its 2018
              founding. The company's active institutional deployment base exceeds 600 customer organizations across
              more than 75 countries, spanning major economies across North America, Europe, Asia-Pacific, and Latin
              America. Commercial revenue growth averaged more than 150 percent annually over the five-year period
              through early 2026, driven by rising regulatory compliance mandates such as FATF Travel Rule enforcement,
              expanding OFAC sanctions designations, and escalating criminal exploitation of blockchain rails.
              Furthermore, TRM Labs reported that its annual recurring revenue quadrupled over the three-year period
              leading into its September 2026 Series C expansion at a $2.0 billion valuation. Independent user feedback
              on peer-review platforms such as G2 reflects strong practitioner sentiment, with TRM Labs earning an
              average rating of 4.8 out of 5.0 across 22 verified reviews in 2026, with customers highlighting the
              transparency of its glass-box attribution methodologies and intuitive investigation workflows.
