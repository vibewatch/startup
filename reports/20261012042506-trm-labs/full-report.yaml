      - number: '7.3'
        title: Operational Limitations and Partner Infrastructure Dependencies
        blocks:
          - type: paragraph
            body: >-
              Operationally, TRM Labs faces substantial technical boundaries and partner concentration risks.
              Third-party procurement reviews and architectural benchmarks demonstrate that TRM Labs is purpose-built
              for blockchain forensics rather than comprehensive financial crime operations; the platform lacks native
              automated rule engines for real-time fiat transaction monitoring and does not provide automated Suspicious
              Activity Report (SAR) filing workflows. Consequently, enterprise banks and hybrid fintechs must maintain
              dual-vendor stacks alongside solutions like Unit21, introducing double-licensing expense and integration
              friction. Furthermore, enterprise user feedback indicates that configuring custom on-chain transaction
              rules requires manual transaction feeding rather than automated block-by-block execution. On the
              infrastructure layer, TRM Labs achieved its essential FedRAMP High security authorization via the Palantir
              Federal Cloud Service. While this authorization enables classified federal deployments, it creates a
              single-point operational dependency on Palantir for US government access, paired with enterprise concerns
              regarding unverified third-party uptime attestations. A current intelligence-role posting also warns
              candidates that the operating model may not suit those optimizing for predictability or consistently
              balanced workloads, signaling execution and retention risk in a high-intensity organization.
            claimRefs:
