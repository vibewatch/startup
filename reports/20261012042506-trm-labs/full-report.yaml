  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Executive Risk Assessment & Threat Landscape
        blocks:
          - type: paragraph
            body: >-
              TRM Labs operates at the critical nexus of digital asset compliance, national security intelligence, and
              financial crime enforcement. While the company achieved a milestone $2 billion valuation in its September
              2026 Series C expansion and maintains coverage across more than 190 blockchains and 1.9 billion digital
              assets, its underlying risk profile is increasingly shaped by macro threat velocity and structural
              competitive headwinds. Global illicit cryptocurrency transaction volumes surged to an unprecedented $158
              billion in 2025, propelled by state-backed Russian sanctions evasion infrastructure such as the
              ruble-pegged A7A5 token and the A7 wallet network. Simultaneously, the criminal adoption of artificial
              intelligence tools surged 40% year over year in 2026, lowering technical barriers for threat actors
              deploying automated deepfake social engineering and ransomware. For TRM Labs, maintaining high attribution
              precision amid explosive threat growth requires continuous capital reinvestment, leaving the platform
              vulnerable to broader cryptocurrency transaction volume downturns and client compliance budget
              contractions.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
              - CR014
      - number: '7.2'
        title: Regulatory, Legal, and Federal Procurement Risks
        blocks:
          - type: paragraph
            body: >-
              As TRM Labs expands its public sector footprint to over 600 government agencies and private institutions
              across 75 countries, regulatory and legal exposures have become acute. The most immediate commercial
              vulnerability stems from incumbent litigation: in August 2026, market pioneer Chainalysis filed a federal
              lawsuit challenging a $94.6 million contract awarded by Immigration and Customs Enforcement (ICE) to TRM
              Labs. Because federal contract vehicles and evidentiary trust represent the bedrock of TRM Labs'
              enterprise valuation, any procurement stay, judicial injunction, or recompete could materially disrupt
              projected federal expansion and investor expectations. Concurrently, the platform navigates severe
              compliance exposure from complex cross-border sanctions evasion networks that channel tens of billions of
              dollars through stablecoins, nested high-risk exchanges, and Chinese-language escrow services. Failure to
              detect evasive transaction topologies in real time risks severe supervisory scrutiny from global
              enforcement agencies including the US Treasury Department's Office of Foreign Assets Control.
            claimRefs:
