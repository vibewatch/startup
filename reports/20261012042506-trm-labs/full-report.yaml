        title: Capitalization, Financing History & Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              Since its 2018 inception, TRM Labs has completed successive institutional financing rounds totaling more
              than $220 million in aggregate equity capital [CO006]. In February 2026, the company finalized a $70
              million Series C financing round that formally minted its unicorn status at a $1.0 billion valuation
              [CO003]. The round was led by Blockchain Capital—which originally led TRM's 2018 pre-seed round—and
              included participation from software buyout sponsor Thoma Bravo alongside existing institutional partners
              Bessemer Venture Partners, Goldman Sachs, Citi Ventures, and PayPal Ventures [CO003]. Subsequently, in
              September 2026, TRM secured a strategic Series C expansion round that doubled its post-money valuation to
              $2.0 billion [CO004]. Blockchain Capital again led the expansion, citing rapid commercial adoption and
              substantial revenue acceleration [CO004] [CO005]. While headline valuation reflects robust investor
              appetite for mission-critical compliance rails, private capitalization specifics—such as exact preferred
              liquidation multipliers, dilution percentages, and unallocated option reserves—remain confidential and
              represent necessary confirmatory diligence items [CO003] [CO004] [CO005] [CO006].
