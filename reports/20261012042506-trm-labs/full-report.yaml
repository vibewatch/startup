      - number: '6.4'
        title: Retention Durability, Procurement Friction & Expansion Headwinds
        blocks:
          - type: paragraph
            body: >-
              Despite rapid headline customer growth, TRM Labs encounters substantive procurement friction and expansion
              challenges within competitive enterprise environments. The company does not publish standard tier pricing
              for its enterprise software products, requiring prospective buyers to engage in lengthy sales
              demonstrations and negotiate bespoke commercial proposals, which creates friction for smaller crypto
              protocols and fintech startups. Furthermore, while enterprise accounts exhibit high switching costs once
              API pipelines are operational, independent practitioner reviews note technical limitations during complex
              graph investigations. Specifically, users report that transaction tracing can occasionally hit dead ends
              in convoluted cross-chain environments and experience performance degradation when rendering large graph
              topologies involving thousands of hops. Additionally, TRM Labs does not publicly disclose core SaaS
              retention metrics—such as Net Revenue Retention (NRR), Gross Revenue Retention (GRR), or average contract
              duration—leaving customer cohort durability and long-term public-sector renewal stability subject to
              private diligence confirmation as TRM Labs competes against incumbent Chainalysis for federal and
              financial enterprise renewals.
