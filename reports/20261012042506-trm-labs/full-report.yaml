  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Scope of Spend
        blocks:
          - type: paragraph
            body: >-
              The market for blockchain intelligence and cryptocurrency compliance encompasses specialized software
              platforms that ingest distributed ledger data, cluster cryptographic addresses into real-world entities,
              screen transactions against global sanctions lists, and investigate illicit financial flows. Historically
              treated as a niche forensic discipline for law enforcement agencies, the market has bifurcated into two
              primary expenditure categories: mandatory commercial compliance (Know Your Transaction screening and
              anti-money laundering transaction monitoring for Virtual Asset Service Providers and banks) and
              public-sector forensic intelligence (threat graph analysis, counter-proliferation investigations, and
              asset recovery). Spend boundaries explicitly exclude traditional fiat core-banking anti-money laundering
              engines, generic endpoint cybersecurity software, and manual forensic recovery services, focusing software
              budgets on automated entity attribution and real-time transaction scoring across multi-chain ecosystems.
              As cybercrime syndicates increasingly utilize automation and artificial intelligence, the market boundary
              is actively expanding into horizontal AI-enabled financial fraud detection, incorporating cross-chain
              smart contract monitoring and synthetic identity prevention into unified investigative suites.
            claimRefs:
              - CM008
              - CM010
              - CM011
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM008
              - CM010
              - CM011
              - CM014
      - number: '2.2'
        title: TAM/SAM/SOM and Market Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Sizing the market for blockchain intelligence requires disaggregating macro illicit flow volumes from
              realizable software license revenues. Independent market researchers project the global blockchain
              analytics software sector will surpass $5 billion by 2026, driven by aggressive institutional digital
              asset adoption and tightening international regulatory regimes. This addressable software spend operates
              as a defensive tax against massive underlying criminal capital movements: TRM Labs documented an all-time
              high of $158 billion in incoming illicit cryptocurrency volume in 2025, which, while representing only
              1.2% of total attributed on-chain transaction volume, absorbed 2.7% of all available custodial liquidity
              exiting Virtual Asset Service Providers globally. Furthermore, geopolitical sanctions evasion flows
              reached $93 billion in 2025, dominated by the Russian state-aligned A7A5 ruble-pegged stablecoin ($72
              billion), while Chinese-language escrow networks processed over $100 billion in regional settlement
              volume. Within this multi-billion dollar addressable software space, the Serviceable Obtainable Market
              (SOM) for tier-one high-consequence intelligence platforms is demonstrated by TRM Labs scaling its
              commercial trajectory toward a $100 million ARR milestone and securing a $2 billion post-money valuation.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
