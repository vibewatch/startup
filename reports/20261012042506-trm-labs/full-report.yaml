  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Product Scope & Operating Model
        blocks:
          - type: paragraph
            body: >-
              TRM Labs Inc. is a venture-backed blockchain intelligence and regulatory technology company founded in
              2018 and headquartered in San Francisco, California [CO001]. The company develops AI-powered software
              platforms designed to investigate financial crime, monitor illicit transactions, screen cryptocurrency
              wallets, and counter national security threats across decentralized ecosystems [CO001] [CO002]. Operating
              at the nexus of financial compliance (RegTech), cybersecurity, and national security infrastructure, TRM
              Labs ingests and normalizes raw transaction records from over 30 blockchains to reconstruct complex
              cross-chain fund flows and attribute pseudonymous wallet clusters to real-world entities [CO002] [CO007].
              Its enterprise product suite encompasses TRM Forensics for in-depth criminal tracing, TRM Compliance for
              continuous transaction monitoring (Know-Your-Transaction/KYT), TRM Sanctions for real-time wallet
              screening, and TRM Data Fusion for secure inter-agency intelligence collaboration [CO007] [CO008]. TRM
              serves over 500 customers across more than 40 countries, balancing public-sector enforcement engagements
              with private-sector enterprise subscriptions from leading financial technology and digital asset
              institutions [CO003] [CO004] [CO007] [CO008].
