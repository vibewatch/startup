            title: Indirect Risk Thresholding and Scope Limitation in Fiat Systems
            body: >-
              As crypto laundering networks adopt complex multi-hop layering through mixers and decentralized bridges,
              defining indirect exposure thresholds becomes technically fraught. Aggressive thresholding creates severe
              alert fatigue for compliance analysts, while conservative rules risk missing secondary laundering chains.
              Furthermore, TRM's pure-play on-chain focus leaves traditional fiat AML and SAR filing uncovered without
              secondary software integrations.
            calloutType: risk
            claimRefs:
              - CE011
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation & Public-Private Split
        blocks:
          - type: paragraph
            body: >-
              TRM Labs organizes its commercial go-to-market across two distinct primary segments: public-sector law
              enforcement and national security agencies, and private-sector financial institutions and crypto-native
              enterprises. Public disclosures and independent industry estimates indicate that approximately 40 percent
              of TRM Labs' revenue base is currently generated from private-sector commercial clients, with the
              remaining 60 percent derived from public-sector government contracts. On the government side, buyers
              comprise federal investigative agencies, state and local law enforcement, and international national
              security bodies focused on anti-money laundering enforcement, sanctions evasion, darknet disruption, and
              asset recovery. On the commercial side, clients span tier-1 cryptocurrency exchanges, regulated financial
              institutions, digital payment networks, and tokenized asset issuers requiring real-time wallet screening,
              transaction monitoring, and regulatory reporting. In 2026, TRM Labs introduced custom account segmentation
              within its Transaction Monitoring solution, enabling enterprise compliance teams to define targeted
              monitoring rule sets tailored specifically to retail accounts, high-net-worth individuals, and high-risk
              commercial counterparties. Current recruiting materials independently mirror this dual-segment positioning
              by describing platforms used by both public- and private-sector agencies to trace illicit activity and
              build cases [CU015].
            claimRefs:
              - CU001
              - CU002
