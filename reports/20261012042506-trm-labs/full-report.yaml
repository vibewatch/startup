        title: Final Recommendation, Decision Framework, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              We assign TRM Labs an overall Buy recommendation with Medium confidence, a Medium risk rating, and a Fair
              valuation stance at the prevailing $2.0 billion expansion mark. The decision reflects TRM's unmatched
              institutional moat across 600+ public-sector agencies and private financial institutions in 75 countries,
              supported by a 500-person specialized workforce. With total illicit cryptocurrency transaction volume
              reaching $158 billion and criminal AI adoption surging 40% year-over-year, TRM sits at the nexus of
              critical national security defense and compliance automation. However, because the ~20x ARR multiple
              leaves little margin for operational error, we advise disciplined portfolio sizing capped at target
              allocation. Prior to capital deployment, investment committees must execute confirmatory diligence on two
              critical gaps: first, obtaining cap-table liquidation preferences and seniority terms to identify
              potential preference overhang; second, reviewing audited product-level revenue segmentation to measure
              standalone AI platform bookings versus legacy transaction monitoring licenses.
