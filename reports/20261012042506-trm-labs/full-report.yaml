      - number: '5.2'
        title: Platform Modules, Infrastructure Stack, and Differentiation
        blocks:
          - type: paragraph
            body: >-
              The core technical foundation of TRM Labs rests on its proprietary Threat Graph, which tracks over 50
              categories of illicit activity across 184+ blockchains and maintains real-time indexing on 57+ distinct
              chains. The underlying infrastructure combines distributed data pipelines with a web-tier built on React,
              Node.js, and PostgreSQL, supporting both customer-facing applications and low-latency screening APIs
              capable of processing billions of on-chain events. TRM's primary competitive differentiation centers on
              its 'glass box' attribution methodology, where risk decisions are accompanied by provenance trails
              acceptable to supervisory examiners, banking partners, and courts. This is complemented by the Orion model
              and Co-Case Agent launched in March 2026, which automates complex graph audits and cross-chain fund
              tracing without charging incremental add-on licensing fees. By operating at the nexus of automated graph
              heuristics and human analyst tradecraft, TRM provides specialized tracing capabilities, including
              MimbleWimble privacy protocol parsing and deep tracking across ruble-pegged A7 evasion infrastructure.
              Current intelligence hiring materials further describe reusable AI pipelines that convert diverse signals
              into attribution and augment target selection, showing that human tradecraft remains embedded in the
              technical stack [CE014].
