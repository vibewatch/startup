  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: slash-sam-isolation
    missingEvidence: A management-level breakout of Slash customers and payment volume by U.S. segment, business type, and product adoption tier.
    whyItMatters: Without a disclosed segmentation split, any TAM-SAM-SOM model for Slash relies on broad public proxies rather than the company's actual mix of startups, solopreneurs, cross-border firms, and crypto-adjacent users.
    diligencePath: Request cohort data showing customer count, active businesses, payment volume, and revenue by segment and by product module.
    relatedQuestionRefs:
    - QM009
    - QM026
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: switching-friction-metrics
    missingEvidence: Neutral public benchmarks on full SMB primary-bank switching time, payroll migration time, and drop-off rates during fintech onboarding.
    whyItMatters: The qualitative evidence clearly says switching is sticky, but investors cannot size sales friction or activation risk precisely without conversion data.
    diligencePath: Ask Slash for activation-funnel metrics from application to first funded account and compare them with peer onboarding benchmarks.
    relatedQuestionRefs:
    - QM020
  - type: stale
    severity: material
    topic: stablecoin-regulatory-clarity
    missingEvidence: Fresh supervisory or legal guidance quantifying how sponsor-bank fintechs can market stablecoin-linked business accounts across different U.S. customer cohorts.
    whyItMatters: Stablecoins are a genuine growth vector for Slash, but policy interpretation can change faster than product adoption, which directly affects SAM and risk-adjusted valuation.
    diligencePath: Review 2026 counsel memos, sponsor-bank compliance updates, and any regulator correspondence covering stablecoin eligibility or disclosures.
    relatedQuestionRefs:
    - QM024
    - QM026
  - type: conflicting-data
    severity: minor
    topic: market-sizing-lenses
    missingEvidence: A single apples-to-apples public series that reconciles U.S. SMB firm counts, self-employed workers, and revenue-pool estimates for digital business banking.
    whyItMatters: The available numbers are all useful but they answer different questions, so careless averaging would distort the real opportunity.
    diligencePath: Anchor future updates on one preferred firm-count lens and separately track operator and revenue-pool adjacencies instead of merging them.
    relatedQuestionRefs:
    - QM008
    - QM026
    relatedTableRefs:
    - TM002
