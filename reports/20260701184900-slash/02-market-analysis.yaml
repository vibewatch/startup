tables:
- id: TM001
  title: Market Definition Table
  columns:
  - Segment / category
  - Included spend or activity
  - Excluded spend or activity
  - Buyer / payer
  - Relevance to Slash
  rows:
  - - Business checking and operating cash
    - Primary business checking balances, ACH/wire/FedNow flows, treasury cash, sweep-based insurance
    - Personal checking, consumer debit, household budgeting
    - Business owner or finance lead
    - Core operating-account wedge for U.S.-registered SMBs and solopreneurs
  - - Cards and spend management
    - Corporate or charge-card spend, virtual cards, approval controls, merchant rules, cashback
    - Consumer rewards cards or household credit cards
    - Founder, controller, team manager; business pays
    - High-frequency workflow that makes Slash comparable to Ramp and Brex, not just to a bank
  - - Accounts payable and bookkeeping workflow
    - Bill pay, accounting sync, invoice-adjacent money movement, month-end close support
    - Standalone ERP replacement or consumer P2P payments
    - Finance lead, bookkeeper, operator
    - Important because integrated software drives switching value beyond yield or fees
  - - Working capital and credit access
    - Partner-originated term loans or lines of credit tied to operating cash needs
    - Mortgage, consumer installment credit, unsecured personal borrowing
    - Business owner or finance owner
    - Relevant because credit availability can anchor the primary banking relationship
  - - Cross-border and stablecoin payments
    - USDC/USDT or global-dollar flows, faster settlement, FX-sensitive vendor payments
    - Speculative trading, retail crypto investing, consumer token activity
    - Operator paying suppliers, contractors, or global entities
    - Key differentiator for web3, import-export, agency, and global-first niches
  - - Solopreneur back-office stack
    - Business account, tax set-asides, bookkeeping, contractor payments, subaccounts
    - General consumer personal-finance management
    - Independent worker or sole proprietor
    - Relevant because Found, Novo, and MBO/Found workforce data show a large adjacent self-serve buyer base
  notes: Boundary is intentionally business-operating-finance only. Consumer neobanking, household payments, and retail investing are excluded even if similar UX patterns exist, because Slash eligibility, pricing, and competitor set point to SMB and solopreneur workflows.
