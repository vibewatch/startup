- id: market-sizing-lenses-and-contradictions
  title: Market Sizing Lenses and Contradictions Preserved
  body: 'Public sizing for Slash''s market is directionally strong but methodologically messy. The official firm-count lens is the SBA''s 36.2 million U.S. small businesses, which says the category is enormous before any fintech segmentation. A broader worker lens comes from Found''s 64 million self-employed Americans and MBO''s roughly 73 million independents, which capture the solopreneur and side-income population that may buy business-finance software even when they are not counted as employer firms. A narrower premium lens comes from MBO''s 5.6 million six-figure independents, which is much closer to the cohort that can justify paying for better cash-flow tooling, cashback, and integrated back office help. A fourth lens is Bluevine''s management claim that non-commercially banked SMBs represent a $125 billion market. These are not interchangeable numbers: some count firms, some count people, some count a premium subset, and one counts revenue opportunity. The right conclusion is not
    to average them, but to preserve the disagreement. Slash''s disclosed 10,000-plus businesses and competitor scales such as Mercury at 300,000-plus customers, Relay at 150,000-plus, and Bluevine at 1 million lifetime customers show that digital penetration is real, yet still far below the broad U.S. SMB base. Public sources do not isolate Slash''s exact U.S. SAM or its actual share inside any one vertical, so the bottom layers of any TAM-SAM-SOM stack remain evidence-constrained.'
