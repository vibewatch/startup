figures:
- id: FM001
  title: Slash Market Sizing Lens — Broad Base, Narrower Premium Niche, and Current Scale
  type: pyramid
  layout: standard
  summary: Public data supports a very large U.S. SMB base, but only the premium and digitally native layers look directly comparable to Slash today.
  data:
    nodes:
    - label: Broad business TAM
      value: 36.2M small businesses
      detail: SBA official firm-count lens for the United States.
    - label: Adjacent operator lens
      value: 64M self-employed / ~73M independents
      detail: Found and MBO expand the universe from legal entities to self-employed workers and independents.
    - label: Premium niche lens
      value: 5.6M $100k+ independents
      detail: MBO's higher-income independent cohort is closer to a software-paying solopreneur segment.
    - label: Current disclosed Slash scale
      value: 10k+ businesses; $35B+ yearly payment volume
      detail: Company-disclosed current operating footprint, not a market-size estimate.
  approximationNotes: This pyramid mixes boundary lenses intentionally because public evidence does not isolate Slash's SAM cleanly. The second layer is an adjacent operator lens rather than a mathematically nested subset, and the bottom layer is disclosed company scale rather than a solved SOM share.
  claimRefs:
  - CM017
  - CM018
  - CM019
  - CM020
