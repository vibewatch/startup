callouts:
- calloutType: insight
  title: The real market is software-led business finance, not just checking accounts
  body: Slash competes where the business bank account becomes the control plane for cards, approvals, accounting, treasury, and cross-border money movement. That makes the relevant market closer to an SMB financial operating system than to a stand-alone online checking product.
  claimRefs:
  - CM021
  - CM023
  - CM037
  - CM038
  - CM043
  - CM053
- calloutType: risk
  title: Bundled credit and incumbent trust keep switching harder than digital UX alone suggests
  body: Owners may like better software, but they still care about approval odds, branch convenience, service, and whether one provider can handle deposits and credit together. That gives banks and lender-led rivals a retention advantage even when challenger UX is better.
  claimRefs:
  - CM008
  - CM012
  - CM013
  - CM025
  - CM047
  - CM048
  - CM050
  - CM051
- calloutType: risk
  title: Stablecoins widen Slash's niche but also import non-bank regulatory and trust risk
  body: Stablecoins clearly solve real cross-border and speed problems for some SMBs, yet the same feature set carries irreversible transfers, non-insured balances, sponsor-bank dependence, and policy uncertainty that do not exist in plain vanilla business checking.
  claimRefs:
  - CM026
  - CM027
  - CM028
  - CM029
  - CM030
  - CM031
  - CM032
