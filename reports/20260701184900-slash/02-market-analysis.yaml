- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Cash-flow and operating-expense pain at small firms
    - Driver
    - Current
    - Persistent operating-cost pressure creates demand for better visibility, transfers, and short-term liquidity tools
    - Ask what share of Slash users adopt treasury, cards, or partner credit within 6 months of onboarding
  - - Workflow consolidation across bank, card, AP, and accounting
    - Driver
    - Current / medium-term
    - Software-led bundling can win even when checking alone is commoditized
    - Measure attach rate for accounting sync, approvals, and AI/Twin usage by cohort
  - - Digital-first and cross-border niches needing faster settlement
    - Driver
    - Current / medium-term
    - Stablecoin and faster-payment rails expand relevance beyond domestic checking
    - Request mix of customers using global or crypto-linked flows versus plain ACH/wire
  - - High-value solopreneur and independent workforce growth
    - Driver
    - Medium-term
    - Premium independents can support subscription, cashback, and treasury monetization
    - Quantify how many Slash customers are sole proprietors versus employer firms
  - - Switching cost of replacing a primary bank stack
    - Constraint
    - Current
    - Moving vendors, payroll, accounting links, and cards makes adoption slower than app download metrics suggest
    - Request median time from approval to primary-account activation and the drop-off points
  - - Bundled credit and approval advantages at banks or lender-led peers
    - Constraint
    - Current / medium-term
    - If credit is elsewhere, the primary bank relationship can stay elsewhere too
    - Compare Slash partner-credit usage to Bluevine, Relay, Mercury, or small-bank approval outcomes
  - - Trust, service, and branch/network advantages of incumbents
    - Constraint
    - Persistent
    - Branch access and relationship service still matter to many owners despite better UX elsewhere
    - Track which customer segments still cite branch proximity or advisor access as a blocker
  - - BaaS, sponsor-bank, and stablecoin regulatory risk
    - Constraint
    - Persistent / event-driven
    - Partner-bank or compliance failures can damage category trust faster than product gains can rebuild it
    - Review sponsor-bank concentration, contingency plans, and stablecoin eligibility changes quarterly
  notes: Direction reflects the sign of the factor for Slash adoption rather than whether the underlying trend is good or bad for the economy. Diligence asks are unresolved next-step requests, not verified facts.
