- id: milestones-and-open-questions
  title: Milestones, Strategic Resets, and the Main Open Questions
  body: The chronology shows a company that has repeatedly reset its thesis without losing growth velocity. A 2020-origin and 2021-launch ambiguity gave way to early traction with sneaker resellers, a market shock after the Yeezy collapse, a broader pivot into vertical banking, stablecoin infrastructure in late 2024, a 2025 Series B and rebrand, and then a 2026 unicorn round tied to Twin and AI-native finance workflows. That sequence is investable because the company appears to have turned product speed into revenue and valuation quickly. It is also unfinished. The public record still lacks audited financials, a canonical active-customer definition, an official headcount disclosure beyond the YC profile, and a full board or control picture. Those omissions matter because the same chapter that supports the upside case also documents metric conflicts and partner-dependency risk. Investors should treat Slash as fast-growing and strategically interesting, but still materially under-disclosed
    relative to the ambition implied by its valuation.
