  rows:
  - - Victor Cardenas
    - CEO & co-founder
    - Stanford dropout; started building the company as a teenager during the pandemic and still writes the main founder letters
    - Owns strategy, fundraising narrative, pivot logic, and public product framing
    - High — the clearest public operator and storyteller for revenue, customers, and long-term ambition
  - - Kevin Bai
    - CTO & co-founder
    - University of Waterloo dropout; repeatedly cited as the technical co-founder who joined early and built the product with Cardenas
    - Owns technical architecture, product velocity, and the software layer that differentiates Slash from a plain sponsor-bank wrapper
    - High — product breadth and shipping speed appear tightly tied to founder technical leadership
  - - Hatim Khety
    - Goodwater partner; board seat disclosed after Series B
    - Named by FinTech Global as joining the board after the 2025 financing
    - Represents the clearest publicly disclosed non-founder governance node in the current cap stack
    - Medium — meaningful governance signal, but public materials do not show the full board context around the seat
  - - Brenden Truong
    - Head of Customer Success (named by founder)
    - Founder letter credits him with teaching the team the sneaker-resale market where Slash first found product-market fit
    - Provides continuity from the first wedge market into the later vertical-banking strategy
    - Low to medium — important historically, but not a substitute for a disclosed broader executive bench
  - - Andy Jiang
    - Product manager quoted on stablecoin roadmap
    - Public face of Bridge case-study commentary on crypto expansion and USDSL design intent
    - Signals dedicated product ownership for the stablecoin stack and international expansion thesis
    - Low to medium — visible operator for one product line, not evidence of holdco governance depth
