  evidenceGaps:
  - type: conflicting-data
    severity: minor
    topic: founding-timing
    missingEvidence: A canonical corporate history that reconciles the 2020 origin story with the 2021 founding language used in official fundraising materials.
    whyItMatters: Founding timing does not change current economics, but it does affect how later chapters anchor company age, execution speed, and milestone comparisons.
    diligencePath: Request incorporation records, YC application history, and an official corporate timeline from management, then standardize one chronology across refreshes.
    relatedQuestionRefs:
    - QO003
    - QO027
    relatedTableRefs:
    - TO004
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: A current board roster, committee structure, and any independent-director or observer rights tied to existing investors.
    whyItMatters: Founder dependence is easier to assess than governance quality because the public record stops short of showing who formally controls oversight and reserved matters.
    diligencePath: Obtain the latest board deck, corporate governance documents, and a current cap-table summary with board rights attached.
    relatedQuestionRefs:
    - QO009
    - QO010
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: material
    topic: customer-metric-definition
    missingEvidence: A reconciled definition of active businesses, paying customers, cumulative signups, and the denominator behind the 10,000+ marketing claim.
    whyItMatters: Customer count is a cover metric, and the difference between active monetizing accounts and broader signups can materially change the implied quality of growth.
    diligencePath: Request a KPI dictionary and monthly cohort table that bridges investor metrics, marketing-site language, and internal revenue-bearing accounts.
    relatedQuestionRefs:
    - QO015
    - QO016
    - QO028
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited or board-reviewed revenue statements that reconcile $150M annual revenue, $250M annualized revenue, and the $300M annualized TechCrunch figure.
    whyItMatters: Without a formal revenue bridge, investors cannot tell whether the gap is timing, methodology, product mix, or selective framing.
    diligencePath: Request monthly revenue bridges, gross-profit splits by product line, and management definitions for annualized payment volume and annualized revenue.
    relatedQuestionRefs:
    - QO013
    - QO014
    - QO028
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-control-rights
    missingEvidence: The current cap table, liquidation preferences, board rights, and any concentrated investor vetoes after Series C.
    whyItMatters: A $1.4B valuation is only one part of the capital story; control rights and liquidation structure directly affect strategic flexibility and exit economics.
    diligencePath: Obtain the post-Series C cap table, financing docs, and board-consent matrix from counsel or management.
    relatedQuestionRefs:
    - QO011
    - QO012
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: minor
    topic: complaints-and-closure-data
    missingEvidence: Public complaint narratives, complaint counts, resolution times, involuntary account-closure rates, and any closure reasons by segment.
    whyItMatters: Trustpilot proves some customer satisfaction, but it does not answer whether account closures or support escalations are systematic in higher-risk segments.
    diligencePath: Ask management for complaint dashboards, closure-event data, support SLA reporting, and any bank-partner escalations by category.
    relatedQuestionRefs:
    - QO024
    - QO025
  - type: missing-source
    severity: minor
    topic: official-headcount
    missingEvidence: A company-confirmed headcount and org breakdown rather than a YC profile number.
    whyItMatters: Revenue or payment volume per employee is part of the bullish output-to-headcount narrative, but the headcount denominator is not yet primary-source verified.
    diligencePath: Request a current org chart or payroll-confirmed headcount snapshot and compare it with the YC profile and recruiting surfaces.
    relatedQuestionRefs:
    - QO018
    - QO028
    relatedTableRefs:
    - TO001
