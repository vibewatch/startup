- id: leadership-capital-and-scale
  title: Leadership, Capital Formation, and Scale Signals
  body: Leadership and capital formation remain founder-centric. Cardenas and Bai are still the only consistently public operators at the holdco level, with Goodwater's Hatim Khety the clearest named board addition after Series B; beyond that, the public bench and board remain thin. Capital formation is much clearer than governance disclosure. Series B brought $41 million at a $370 million valuation in May 2025, the company reportedly bought Slash.com for $1 million in the rebrand, and Series C brought $100 million at a $1.4 billion valuation in April 2026. Scale evidence is directionally strong but definitionally messy. Slash said it crossed $150 million in annual revenue in late 2025 and later described a jump from $10 million to $250 million in annualized revenue in 24 months, while TechCrunch cited $300 million annualized revenue in April 2026. Customer counts are similarly split between >5,000 businesses in investor-style materials and 10,000+ entrepreneurs or businesses in marketing
    copy.
