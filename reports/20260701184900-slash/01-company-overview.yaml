- id: TO003
  title: Stakeholder or Investor Map
  columns:
  - Stakeholder
  - Role
  - Control / economic importance
  - Latest evidenced position
  - Why it matters
  - Diligence ask
  rows:
  - - Ribbit / Khosla / Goodwater
    - Lead capital providers in latest round
    - Set the $1.4B Series C valuation and validate the AI/vertical-banking thesis
    - Series C consortium in Apr-2026; Goodwater also led Series B
    - Capital-market signal is strong and Goodwater also has a disclosed board seat through Hatim Khety
    - Confirm board rights, liquidation preferences, pro-rata terms, and any investor vetoes tied to future financing or sale scenarios
  - - NEA / Y Combinator
    - Repeat backers
    - Company says both are investing for a fourth time by Series C
    - Still participating in Apr-2026 round
    - Repeat follow-on behavior is a useful durability signal when the company has already pivoted more than once
    - Obtain exact ownership percentages and any special information or follow-on rights
  - - Column N.A.
    - Sponsor bank and card issuer
    - Provides checking, card issuance, and core regulated account rails
    - Current partner bank named across Slash legal and product pages
    - This is the core operating dependency that turns Slash from software into a functioning banking product
    - Review concentration risk, exit provisions, service-level commitments, and fallback banking-partner plans
  - - IntraFi / sweep network banks
    - Deposit-sweep infrastructure
    - Extends FDIC coverage beyond the single-bank limit through pass-through placement
    - Referenced by Slash security pages and IntraFi FAQ
    - Supports the cash-safety narrative but adds operational and recordkeeping complexity
    - Confirm eligible banks, exclusions, pass-through record maintenance, audit cadence, and customer disclosures
  - - Bridge / Layer2
    - Stablecoin issuer, custody, and conversion stack
    - Bridge issues USDSL and partners handle crypto conversion, custody, or transfer services
    - Current legal pages plus Bridge and Alchemy case studies
    - This dependency underpins Slash's crypto differentiation and most explicit non-bank disclaimers
    - Review reserve mechanics, redemption responsibilities, outage playbooks, and customer recourse if crypto rails fail
  - - Atomic Invest / Atomic Brokerage
    - Treasury partner
    - Powers yield and cash-management product outside insured deposits
    - Current legal disclosures
    - Extends monetization beyond interchange but adds market-risk and partner-risk complexity
    - Review fund selection, fee sharing, asset segregation, and how Slash communicates principal risk to customers
  notes: This map mixes investors and critical operating partners because both sets of stakeholders meaningfully shape Slash's control surface and customer risk. The exact cap table and contract economics remain private.
  enumerationScope:
    coverage: partial
    basis: Covers the disclosed equity backers and the core operating partners visible in public materials; the full cap table, economic splits, and detailed partner contracts remain private.
