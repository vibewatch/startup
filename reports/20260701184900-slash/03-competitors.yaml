- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Competitor
  - Public entry price
  - Paid tiers / yield
  - Cards / rewards
  - Notable fee or waiver structure
  - Implication
  rows:
  - - Slash
    - $0 Free
    - $25 Pro; treasury yield marketed separately
    - 1.5% Free / 2% Pro public cashback; higher custom rates possible
    - $1 same-day ACH and $6 domestic wires on Free; $0 on Pro
    - Aggressive on rewards and payments for high-spend users, but economics must be earned on usage quality
  - - Mercury
    - $0
    - $29.90 Plus; $299 Pro; Treasury unlocked at $250K
    - Cards included; no public cashback headline on reviewed pages
    - Banking core is free, paid plans monetize invoicing, reimbursements, and relationship service
    - Mercury monetizes software and treasury upgrades more transparently than Slash
  - - Ramp
    - $0
    - $15/user Plus + platform fee; Enterprise custom; treasury on Free
    - Up to 5% cashback
    - Zero-fee domestic ACH/checks; monetizes software depth as users scale
    - Broad funnel with software upsell and strong rewards appeal
  - - Brex
    - $0/user
    - $12/user advanced features; treasury return variable
    - Card-led platform with treasury return layered on invested funds
    - Some products have associated fees; return depends on checking/treasury/vault balances
    - Brex can underprice entry and monetize a broader banking-plus-software relationship
  - - Bluevine
    - $0 Standard
    - $30 Plus; $95 Premier; APY 1.3%-3.0%
    - 4% Mastercard Easy Savings cashback on debit purchases
    - Fee waivers are simpler than incumbents, but premium yield requires upgraded plans or activity
    - Competes hard on mainstream SMB value rather than niche workflow depth
  - - Relay
    - No hidden fees called out
    - Starter / Grow / Scale packaging visible; exact public prices not recovered in reviewed text
    - Card and account packaging exists but rewards not emphasized
    - No overdraft fees or minimum balances highlighted
    - Competes on cash-flow clarity and simplicity, not on flashy reward economics
  - - Found / Novo
    - Found free core; Novo no monthly fees
    - Found Plus $35 and Pro $80 with APY; Novo uses balance-based cashback
    - Found 1% cashback on Pro; Novo 1%-2% cashback by balance
    - Self-employed packaging leans on taxes, bookkeeping, and low-friction operations
    - These products undercut Slash for solo operators who do not need treasury or stablecoin rails
  - - Chase
    - $15 Complete Checking
    - $40 Performance; $95 Platinum
    - Traditional debit and merchant acceptance, not fintech-style rewards
    - Monthly fees can be waived with balances, deposits, or card activity
    - Chase monetizes trust, cash handling, and branch service rather than free software-led packaging
