callouts:
- calloutType: insight
  title: Slash monetizes intensity, not ubiquity
  body: Even using conservative public ranges, Slash appears to earn far more revenue per customer than Mercury or the mainstream SMB challengers because it targets businesses that move meaningful card, treasury, and cross-border volume through one stack.
  claimRefs:
