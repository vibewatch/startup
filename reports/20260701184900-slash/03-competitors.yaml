  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cashback-unit-economics
    missingEvidence: Gross margin by rewards cohort, interchange mix, merchant exclusion rates, and realized cashback expense by customer segment.
    whyItMatters: Without unit economics, the market can see that Slash uses rich rewards, but cannot tell whether those rewards are durable at current growth and customer-mix assumptions.
    diligencePath: Request monthly contribution margin by card-spend cohort, rewards redemption rates, and any merchant or vertical concentration affecting interchange yield.
    relatedQuestionRefs:
    - QP022
    relatedTableRefs:
    - TP003
    - TP004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-churn
    missingEvidence: Revenue concentration by vertical, top-customer concentration, cohort churn, and migration destinations when Slash loses accounts.
    whyItMatters: Slash's unusually high revenue per customer is a strength only if concentration risk, churn, and adverse vertical exposure remain manageable.
    diligencePath: Obtain cohort retention by vertical, top-20 customer revenue share, and churn destination data versus Mercury, Ramp, Bluevine, Relay, Found, Novo, and incumbent banks.
