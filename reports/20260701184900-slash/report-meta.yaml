companyProfile:
  summary: >-
    Slash is a San Francisco fintech that combines U.S. business banking and
    charge cards with treasury, stablecoin and Global USD rails, accounting
    automation, APIs, and the Twin AI assistant for digital-first operators.
    Public sources place the project origin in 2020, while official April 2026
    fundraising materials use 2021 founding language; the company first found
    traction with sneaker resellers and sole proprietors before pivoting toward
    larger, verticalized businesses. By April 2026 it had raised a $100 million
    Series C at a $1.4 billion valuation, but the company still discloses far
    less about margins, controls, and partner economics than its growth profile
    suggests.
