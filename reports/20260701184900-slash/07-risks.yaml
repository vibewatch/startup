callouts:
- calloutType: risk
  title: Slash should be underwritten as an orchestrator of regulated partners, not as a self-contained bank
  body: The customer experience is unified, but the regulated responsibilities are split across Column, sweep-network banks, Bridge or Layer2, Alchemy, Atomic, and other counterparties. That design can be powerful and still carry concentrated failure risk.
  claimRefs:
  - CR001
  - CR005
  - CR006
  - CR030
  - CR033
- calloutType: recommendation
  title: The biggest remaining diligence asks are private operating metrics and contingency plans
  body: If management can produce partner-failure playbooks, fraud and dispute metrics, and a credible stablecoin-compliance roadmap, the risk rating can improve quickly. Without that package, public growth metrics should be discounted.
