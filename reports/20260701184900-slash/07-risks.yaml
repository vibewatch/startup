- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Sponsor-bank concentration
    - Column relationship or charter stress
    - Material service interruption, adverse partner action, or no credible backup-bank plan
    - Escalate to diligence blocker until management shows fallback banking and reconciliation continuity
  - - Stablecoin regulatory change
    - GENIUS Act implementation requirements harden
    - Slash cannot explain issuer, reserve, redemption, and customer-disclosure changes needed before the effective date
    - Treat Global USD and USDSL upside as discounted until a compliant operating model is documented
  - - Fraud and support strain
    - Complaint, dispute, or fraud metrics trend poorly
    - Management cannot provide cohort-level dispute, loss, and manual-review data with clear ownership
    - Cut confidence materially because controls may be lagging growth
  - - Cashback economics
    - Rewards economics narrow or exclusions rise
    - Meaningful tightening of rewards, more forfeitures, or economics no longer fit target customers
    - Re-underwrite acquisition efficiency and customer quality, not just gross payment volume
  - - Partner-stack reliability
    - Bridge, Layer2, Alchemy, Atomic, or related partners fail or reprice
    - No tested runbook for outages, redemptions, or customer communication across partner incidents
    - Assume higher churn and support cost until contingency playbooks are evidenced
  - - Leadership and bench depth
    - Founder or key-executive turnover or overload
    - No credible delegated operators for compliance, partner management, and fraud operations
    - Upgrade key-person risk and require succession or org-depth evidence before conviction grows
  notes: These kill criteria convert public risks into specific diligence gates. The chapter intentionally prefers measurable escalation triggers over generic caution language.
