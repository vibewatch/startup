  - id: TE002
    title: 工作流 / 使用场景表
    columns:
      - 用户任务
      - 当前工作流触发点
      - Slash 方案
      - 可衡量收益
      - 限制
    rows:
      - - 开立并入金美国企业账户
        - 新注册美国实体需要管理经营现金
        - Business Banking 开户，叠加外部入金、卡和转账轨道
        - 减少早期财务运营的工具蔓延
        - 核心银行服务仍仅限美国实体
      - - 为供应商或团队创建受控支出
        - 需要预算化支出，又不能共用一张实体卡
        - 发虚拟卡、设限额、冻结卡并监控支出
        - 授权更快，控制更紧
        - 返现排除项会降低部分常用商户的价值
      - - 发送紧急境内付款
        - 供应商或薪资相关付款需要即时结算
        - 从仪表盘使用 RTP 或 FedNow
        - 秒级到账，紧急成本低于电汇
        - 收款银行必须参与，且付款不可撤销
      - - 把多余经营现金转入收益产品
        - 闲置现金躺在支票账户里，但需要收益和当日取用
        - 在同一界面使用 Slash Treasury
        - 现金管理留在财务栈内
        - Treasury 不受 FDIC 保险保护，并使用外部顾问和经纪商
      - - 接收或发送跨境美元
        - 企业想要更快全球结算，又不想承受电汇摩擦
        - 使用 Global USD、稳定币和仪表盘兑换流程
        - 降低钱包摩擦，也可能避开电汇延迟
        - 稳定币流依赖合作伙伴，且不在存款保险内
      - - 在 Slack 中提财务问题或发起操作
        - 企业主或运营方想在上下文里查询余额、卡或转账
        - 在私信或频道中使用 Twin，并由审批流兜底
        - 缩短从提问到执行的时间
        - 设置需要管理员步骤，公开可用性证据偏薄
      - - 用更干净的交易数据结账
        - 财务总监希望更快分类并同步总账
        - 使用会计映射、拆分和直接集成
        - 减少手工对账，加快月末结账
        - 公开文档更强调支持路径，对边缘故障处理讲得较少
    notes: 收益停留在工作流层面，且多由公司自己声称；本表区分实际运营收益与外部依赖、限制，后者仍可能中断流程。
