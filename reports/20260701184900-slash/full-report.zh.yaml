  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、估值背景，以及为什么披露才是瓶颈
        blocks:
          - type: paragraph
            body: >-
              Slash 已有足够真实的市场牵引力，值得投资人认真关注。开放网络记录支持公司估值从 2025 年 5 月 Series B 的 $370 million，快速抬升到 2026 年 4 月 Series C 的
              $1.4 billion，也支持累计融资超过 $160 million。它同样支持真实商业规模：管理层在 Series C 时公开声称年化收入超过 $250 million，TechCrunch 报道年化数字为
              $300 million 并用了“盈利”一词，Sacra 也独立估算 2026 年 3 月年化收入约 $255 million。在此之上，Slash 称其现在驱动超过 $30 billion
              的年化支付量，以及超过 $1 billion 的年化稳定币交易量。


              问题不是 Slash 是否真实。问题是当前价格是否有足够扎实的承销基础，足以积极买入。公开客户数字无法干净对齐：Slash 同时使用 10,000+ 和 5,000+
              的企业数量，公开记录从未定义这些数字指的是活跃账户、付费账户，还是仅仅历史账户。盈利表述也同样单薄。没有经审计报表，没有毛利率桥接，没有资金消耗披露，也没有清晰解释年化收入中有多少能在返现、合作银行经济、稳定币合作伙伴、欺诈和支持成本之后留下来。因此，建议应偏向继续研究
              / 跟踪，置信度为中，公开证据下的估值姿态为合理到偏紧；不是因为业务没有势能，而是因为价格已经要求投资人相信他们还看不见的私有质量指标。
