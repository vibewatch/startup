  - id: TV002
    title: 正向 / 反向论点表
    columns:
      - 论点
      - 证据
      - 什么会改变判断
    rows:
      - - 正向论点：Slash 有真实规模，不只是融资叙事。
        - Series C 材料支撑 $250M+ 年化收入、$30B+ 年化支付量和 $1B+ 年化稳定币量。
        - 经审计报表或扎实数据室会把它从动能证据推进到承保证据。
      - - 正向论点：客户高交易量、高强度使用，业务可能应享有高于平均的变现水平。
        - Sacra 对 $3B+ 卡消费和约 5% 隐含收益率的框架，指向异常高的单企业客户收入。
        - 队列留存、毛利率和奖励负担数据，能验证这种强度是可持续还是促销驱动。
      - - 正向论点：产品宽度扩张足够快，已经重要。
        - Twin、Global USD、稳定币轨道、资金管理和会计工作流，指向更宽的财务操作系统。
        - 若能证明这些产品拉动变现、降低流失，叙事就会更接近软件化溢价。
      - - 反向论点：公开客户和盈利表述还达不到估值级披露。
        - Slash 同时使用 10,000+ 和 5,000+ 客户口径，TechCrunch 的盈利说法背后也没有公开会计桥。
        - 若能统一活跃客户定义，并提供经审计的盈利桥，这个反对理由才会消失。
      - - 反向论点：稳定币和合作方复杂度应拿折价。
        - Column、Bridge、Layer2、Alchemy 和智能钱包基础设施都嵌在产品体验里，带来集中度和规则变化风险。
        - 应急计划、合规准备和合作方经济性会降低这项折价。
      - - 反向论点：当前价格的安全边际有限。
        - 按公开运行年化收入约 4.7x-5.6x 计算，Slash 并非明显高估，但价格也没有低到足以补偿未解缺口。
        - 更低入场价或更好的私有数据，都会显著改善交易结构。
    notes: 反论点针对估值，不否定产品。问题在于，相对市场仍无法验证的内容，今天的价格是否有吸引力。
