  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与定价架构
        blocks:
          - type: paragraph
            body: >-
              Slash 不靠单一明显通道变现，这既是优势，也是建模难题。官方定价让客户菜单相对清楚。公司销售 Free 计划和每月 25 美元的 Pro 计划，在 Free 档对 same-day
              ACH、境内电汇、RTP/FedNow 和国际电汇收取交易费，并把不封顶返现叠到每日结算的签账卡上。独立来源和合作方来源补上其余结构：Sacra 称 Slash
              还从加密资产兑换和出金活动中赚钱，而官方资金管理和稳定币页面表明，Slash
              参与收益和全球支付工作流，不只局限于存款和卡。结果是一个混合收入模型，覆盖交换费或消费挂钩收益、计划费、支付通道费、资金管理利差、稳定币兑换，以及合作方发起的营运资本邻近业务。缺失的是组合。公开来源没有说明哪些通道真正驱动收入、毛利或留存，所以本章能画出机制并列出定价，但还无法把它们对齐到干净的收入确认或利润率桥。
