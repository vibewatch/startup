      - number: '2.4'
        title: 增长驱动、切换约束与结构性风险
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动不是泛化的新银行采纳曲线，而是运营痛点。Federal Reserve 显示，现金流压力、运营费用融资需求和对贷款结果的不满长期存在。Slash、Ramp、Bluevine、Relay、Found 和
              Novo 的胜出方式，都是把几项企业财务任务压进一个工作流：支付、卡、审批、记账、开票和现金管理。跨境和稳定币功能又为数字原生利基群体增加一层驱动，它们想要更快结算或更少电汇中介。但采用约束同样真实。NFIB
              说，客户服务是选银行的第一因素，便利地点对三分之二业主仍然重要，所以网点网络和传统顾问渠道并未过时。切换还意味着重接工资、供应商、会计链接和卡控制；Slash
              自己的关户流程显示，企业银行退出是人工流程，运营上有粘性。捆绑信贷会加深这种粘性：小银行审批通过率仍属最佳，Bluevine 和 Relay 已经把贷款与存款打包，Mercury
              也明确在寻求银行牌照，以获得更多贷款和支付控制。信任也是刹车。赞助银行和扫存网络设计依赖 Column、IntraFi 等合作方，而 Synapse 已经证明，账本或对账失败会困住终端用户。稳定币放大了
              Slash 的机会，但 Slash
              自己的披露也说明，这些资产不是受保险保护的银行存款，可能不可逆，并受地理和监管审查限制。因此，即使软件驱动的挑战者在产品上改善，传统机构仍在网点触达、资产负债表贷款和感知安全上保有真实优势。
