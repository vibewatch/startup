      - number: '7.3'
        title: 合作伙伴与商业模式集中风险
        blocks:
          - type: paragraph
            body: >-
              Slash 的上行空间和脆弱性来自同一个设计选择：它是专门合作伙伴之上的编排层，而不是垂直整合的银行。Column 锚定账户和卡；IntraFi 与存款分扫网络逻辑扩大保险覆盖；Bridge、Layer2 和
              Alchemy 让 Global USD 与 USDSL 看起来像银行产品；Atomic 包装资金管理；其他合作伙伴链条处理营运资本。该架构可以加快功能迭代，但也意味着即便 Slash
              本身没有直接失效，合作伙伴宕机、监管变化或战略性重新定价也会打到客户体验。Synapse 事件在这里的意义是警示性类比，不是因为已知 Slash 与 Synapse
              事实相同，而是因为该案例说明，银行—金融科技栈里的记账和责任缺口可以很快伤害客户。


              模型集中度也存在。Slash
              的价值主张依赖高交易量、数字优先的运营者；这些客户喜欢无上限返现、快速资金流转和稳定币通道。这可能很赚钱，却也把耐久性绑在交换费经济、欺诈纪律，以及一批运营模式比普通小企业银行客户更集中的客户身上。Airwallex
              的批评恰恰有用，因为它带着商业动机：它指出了 Slash 最强的地方，也指出了其以美元为中心、每日结算结构不适配的场景。
