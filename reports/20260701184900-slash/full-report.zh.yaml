  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 建议先承认真实规模，再因透明度不足、合作伙伴复杂度和当前价格安全边际有限而打折。
    data:
      nodes:
        - id: scale
          label: 商业证据
          detail: 250M-300M 年化收入代理指标、30B+ 年化支付量、1B+ 稳定币交易量。
        - id: price
          label: 头条价格
          detail: $370M Series B 之后，Series C 轮对外估值 $1.4B。
        - id: opacity
          label: 披露缺口
          detail: 没有审计后利润率、现金消耗、队列数据或股权结构桥接说明。
        - id: risk
          label: 风险栈
          detail: 客户数量口径矛盾、返现经济性以及合作伙伴 / 监管集中。
        - id: result
          label: 投资建议
          detail: 继续研究 / 跟踪；按公开证据看，估值合理到偏紧。
      edges:
        - from: scale
          to: price
          label: 支撑
        - from: price
          to: opacity
          label: 必须通过
        - from: opacity
          to: risk
          label: 放大
        - from: risk
          to: result
          label: 导向
    claimRefs:
