  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              分析 Slash
              时，应把它放在美国小企业和单人创业者企业银行服务、支出管理、财务工作流软件里，而不是消费者新银行。真正买单的人，是需要主运营账户、卡、转账、控制、会计同步，有时还需要跨境通道的企业主、运营负责人或财务负责人。因此
              Slash 营销的是一个平台，覆盖支票账户、资金管理、合作方发起的营运资本、企业卡、支出控制、稳定币和会计自动化；Ramp、Brex、Bluevine、Found、Novo 和 Mercury
              等竞争者，也都围绕经营企业来定义品类，而不是家庭预算。因此纳入的支出池包括企业支票余额、资金管理余额、支付流、卡消费、 应付账款资金流转、记账 / 关账工具，以及跨境结算。排除项则包括个人支票账户、消费者借记卡和
              P2P 钱包行为、零售投资、房贷，以及其他无法映射到 Slash 产品或风控边界的消费者金融池。现状替代方案通常是一套工具栈：传统银行账户、卡项目、会计软件、发票或 应付账款工具，有时再加一个独立的加密或 FX
              工作流。Slash 对美国注册企业的准入规则进一步说明，这是一块合规负担重的 SMB 运营金融市场，不是大众消费者应用品类。
