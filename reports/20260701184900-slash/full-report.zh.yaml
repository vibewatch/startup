  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、起源故事与商业模式
        blocks:
          - type: paragraph
            body: >-
              Slash 更应被理解为一家旧金山金融科技公司和企业银行平台，而不是银行。它自己的法律和安全页面说明，存款和卡服务由 Column N.A. 提供，Slash 则在其上叠加软件、资金管理、稳定币通道和
              AI。起源故事有些混乱，但这种混乱反而有用：官方 2026 年 4 月融资材料称公司成立于 2021 年，而 Y Combinator、TechCrunch、Founded 和 TNW
              都把真正起点放在疫情期间、YC S21 之前的 2020 年。最公平的读法是，Victor Cardenas 和 Kevin Bai 在 2020 年开始搭建，面向公众的 Slash 发布在 2021
              年成形。第一块楔子是球鞋转售商和个体经营者；那个利基市场受挫后，Slash 转向服务高交易量数字企业的垂直银行。到 2026
              年，公司营销的是更宽的栈，包括企业银行服务、签账卡、资金管理、稳定币支付、会计自动化、API 访问和 Twin。
