      - number: '4.2'
        title: 规模信号、单位经济与返现取舍
        blocks:
          - type: paragraph
            body: >-
              公开规模故事强到必须重视，也乱到必须谨慎。Slash 自称 2025 年底突破 1.5 亿美元年化收入；2026 年 4 月融资材料又把口径推进到 2.5 亿美元年化收入，称 24 个月内从 1,000
              万美元跳升。随后 TechCrunch 报道了 3 亿美元年化收入说法，并加上 profitable 一词；Sacra 则估算 2026 年 3 月年化收入约 2.55
              亿美元。方向上相互一致，但没有对齐。交易量数据呈现同样模式。BusinessWire 和 FinTech Global 都描述超过 300 亿美元年化支付量和 5,000 多家企业客户，而 Slash
              定价和营销页面使用更宽的 10,000+ 创业者或企业口径。Sacra 又补充了更多细节，称年化卡消费超过 30 亿美元，并在这一卡消费基数上隐含接近 5% 的收入率。返现在这里很关键：Slash 承诺 1.5%
              或 2.0% 奖励，宣称已支付超过 1 亿美元，并排除外币交易、拒付、退款和部分商户。这种组合暗示它能在高消费分群上拿到较高的总收入率，但也意味着不小的奖励负担；公开来源没有同时披露欺诈、拒付或
              赞助银行成本分担。每日结算降低信用损失风险，但也压缩客户浮存，并可能把业务收窄到比无担保短期融资更看重控制和速度的运营者。
