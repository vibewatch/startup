      - number: '8.2'
        title: 可比框架：倍数并不离谱，但折价应放在别处
        blocks:
          - type: paragraph
            body: >-
              看 Slash 最干净的公开镜头，是以规模和披露质量为锚的倍数框架，而不是 DCF。表面上，Slash 并不显得明显昂贵。$1.4 billion 估值对应 $250 million 到 $300 million
              的公开年化收入代理，大致是 4.7x 到 5.6x 收入。这低于 Mercury 披露的约 8x 年化收入倍数，也远低于 Ramp 的 32x+ 比率。但这个差距不是免费的上行空间。Mercury 披露了
              300,000+ 客户、连续四年 GAAP 盈利，以及 OCC 有条件特许批准。Ramp 披露了自由现金流、$100 billion+
              采购额，以及软件属性更重的财务运营栈。在决定倍数能否扩张的关键质量上，两家同业都比 Slash 更清晰。


              更宽的可比集强化了同一点。Brex 以 $5.15 billion 出售给 Capital One，说明战略收购方愿意为一体化支出基础设施付钱；但这也把该资产放进了一家有 SEC
              报告和深厚承销能力的上市银行。Bluevine、Relay、Novo 和 Found 展示了 SMB
              金融科技账户基数可以变得多大，但其公开材料更适合判断相对规模和客户细分定位，不适合直接做倍数。正确结论是，Slash 当前的表面倍数方向上可以辩护，但必须先因披露不足、合作伙伴集中，以及收入比纯软件 ARR
              更暴露于支付和激励，给出有意义的折价。
