      - number: '4.4'
        title: 披露缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              核心财务判断很直接：Slash
              的商业牵引真实，但对机构级投资判断来说披露仍不足。公开来源支持真实增长、宽变现面和投资人反复加注的意愿。它们也支持一个结构上有吸引力的模型：高卡消费、稳定币通道和深软件工作流，可能带来异常高的客均收入。它们不支持的是对收入质量的完整判断。公司没有独立审计财务、没有公开毛利率桥、没有披露混合
              抽成率、没有烧钱或现金续航期表、没有合作方收入分成经济，也没有足够强的盈利定义来区分毛利层面盈利、GAAP
              盈利或现金盈利。这种不透明很重要，因为上行案例本身依赖一组假设：奖励可持续性、赞助银行经济、资金管理利差留存、稳定币变现和客户定义。负面信号并非灾难性，但确实存在：BBB 保留投诉渠道，Trustpilot
              情绪有利但不是定论，Synapse 的行业历史说明赞助银行 或中间件对账失败会演变成真实消费者伤害。因此，财务上正确的姿态，是把 Slash
              视为一家高动能、高选择权的金融科技公司；公开证据支持继续跟踪和升级尽调，但没有私人数据前，不足以对利润率耐久性或资本充足性作出干净判断。
