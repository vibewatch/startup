    rows:
      - - 卡消费 / 交换费
        - 高交易量企业的签账卡消费、虚拟卡使用，以及与消费挂钩的经济性
        - 1.5%-2.0% 返现暗示背后有高端卡交换费经济性支撑
        - Sacra 称年化卡消费 >$3B；Slash 宣传已支付 $100M+ 返现
        - 很可能是核心变现通道，但 Slash 未披露扣除奖励和合作方分成后的留存交换费
        - 索取按用户分群拆分的发卡方经济性、综合交换费、奖励支出以及欺诈 / 拒付损失
      - - 订阅计划
        - Free 层级和 $25/月 Pro 层级，捆绑功能
        - Free $0/月；Pro $25/月
        - 只有当相当比例用户为 Pro 付费时才有实质意义
        - 标价最清晰，但单独看大概率不是主要收入驱动
        - 索取按用户分群拆分的付费席位结构、Pro 附加率和订阅 ARR
      - - 转账与支付通道
        - 同日 ACH、国内电汇、RTP/FedNow、国际电汇以及涉及 FX 的用卡收取费用
        - Free 层级：$1 ACH、$6 国内电汇、$5 RTP/FedNow、$25 国际电汇、1% FX 费
        - Slash 称年化支付量 >$30B
        - 标价可见，但实际使用量和减免费用未披露
        - 索取按通道拆分的交易笔数、费用收入和服务成本
      - - 资金管理 / 收益利差
        - 闲置现金进入由 Atomic 管理的货币市场结构
        - 营销材料称年化收益最高 3.76%-3.82%，最高档利率绑定 $500k+ 余额
        - 未公开披露 AUM 或平均余额
        - 可能粘性强、毛利为正，但留存利差和客户余额结构未披露
        - 索取资金管理余额、总收益率、向客户转付比例和 Slash 留存利差
      - - 稳定币 / 全球支付
        - USDC、USDT、USDSL、兑换、出入金，以及全球美元访问
        - Sacra 引用 0.5% USDC 和 0.6% USDT 兑换费；Bridge 称，把加密流留在平台内改善了变现
        - Bridge 称月稳定币量在九个月内从 $5M 增至 $100M
        - 增长大概率很快，也具备战略差异化，但合作方经济性和储备责任不透明
        - 索取兑换费收入、结算成本，以及 Bridge/Layer2 商业条款
      - - 营运资金融资
        - 围绕银行服务栈的短期融资，期限为 30/60/90 天
        - 官方材料披露该产品可用；法律脚注称贷款由 Lead Bank 发放，费用随风险和期限变化
        - 未公开成交量、审批或损失数据
        - 若采用率有规模，经济性值得关注；但当前披露看不出 Slash 赚的是推荐、服务还是利差
        - 索取产品协议、漏斗指标、违约、定价和 Slash 收入分成
    notes: 这些行把面向客户可见的变现杠杆，与每条通道背后大多未披露的留存经济性分开。稳定币和营运资金两行尤其依赖合作方。
