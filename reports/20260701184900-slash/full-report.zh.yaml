      - number: '3.3'
        title: 信任、监管、合作银行结构与分发能力
        blocks:
          - type: paragraph
            body: >-
              SMB 金融里的竞争姿态，受信任和受监管基础设施影响，并不亚于 UX。Chase
              结构性占优，因为它已经拥有银行牌照，可以服务使用网点和现金较多的企业，也能在一张受监管资产负债表内挂上刷卡收单、储蓄和贷款。Capital One 通过与 Brex
              结合，把现代财务产品接到大型银行品牌上，带来类似的信任升级。Mercury 正试图通过 OCC
              条件批准补上这个差距，但在银行上线完成之前，它和其他金融科技公司一样仍依赖合作银行。Bluevine、Relay、Found 和 Novo
              都公开描述赞助银行或项目银行关系，这意味着它们的信任姿态仍部分借自合作方。Slash
              也有这种依赖，并通过稳定币服务商和券商式资金管理产品增加第二层外部性。这不否定产品，但会提高对备用方案、对账和客户沟通的尽调要求。分发能力也重要：更宽的品牌可以靠默认熟悉度、建议和既有银行关系获客，即使在特定工作流里的产品广度不如
              Slash。结果是，Slash 不仅要销售更好的软件，还要提供足够信任，抵消更小的品牌标识和更复杂的底层栈。
