      - number: '6.4'
        title: 扩张与集中风险
        blocks:
          - type: paragraph
            body: >-
              装机客户的上行空间很容易看到。Slash 可以先用银行服务和卡拿下客户，再扩张到资金管理、营运资本、稳定币工作流、Global USD、会计自动化和 Twin。公司页面和第三方描述都能看到这种扩张逻辑，Sacra
              也认为这是客均收入看起来异常高的关键原因。难点在于，扩张和集中交织在一起。让 Slash
              在经济上有吸引力的同一组客户属性——高卡消费、重供应商资金流、广告投放、跨境支付或熟悉加密——也会让客户群围绕一小组垂直和运营模式高度相关。


              最大集中风险因此落在代理机构、电商、加密相邻企业和跨境运营者上；家政服务或承包商邻近扩张，公开证据仍更多停留在营销层面。Airwallex 的批评在这里有用，因为它展示了 Slash 差异化的反面：一个以 USD
              为中心、每日结算、奖励驱动的产品，可以非常适合美国本土高量运营者，但仍不适合全球多币种团队。JD Power 的小企业银行基准又增加一个视角：支持、问题解决和建议质量会实质影响满意度。Slash
              也许能在最匹配分群里继续扩张，但公开证据仍不足以判断收入按垂直、地理或最高支付强度客户群的集中程度。
