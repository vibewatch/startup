      - number: '8.4'
        title: 尽调问题、论点失效触发器与最终立场
        blocks:
          - type: paragraph
            body: >-
              最终建议应保持审慎和有条件，而不是宣传式。Slash 可能正在搭建某种异常有价值的东西：高交易量企业、差异化的稳定币全球账户、AI
              原生工作流工具，以及看起来每客户收入密度异常高的收入引擎。但这个故事中每个有吸引力的部分，都对应一项尽调负担。投资人仍需要经审计的收入和毛利桥接，需要证明返现和交换费经济在合作伙伴分成与欺诈成本之后仍然耐久，也需要一个对齐后的客户数量定义，告诉投委会这些企业里今天有多少是活跃且可变现的。他们还需要看到资本结构是否包含优先权或稀释悬垂，让
              $1.4 billion 的企业名义估值在股权回报口径上变得不那么有吸引力。


              这些未知数决定了否决触发器。如果尽调室显示奖励后利润率疲弱、合作伙伴依赖缺少可信应急计划，或活跃客户基数远小于网站 10,000+ 表述暗示的规模，当前标记就显得偏紧。反过来，如果尽调显示 Mercury
              式盈利纪律、有限集中度，以及比公开记录暗示更干净的经济性，同一个标记可以显得合理。在这些证据出现前，正确立场是继续研究 / 跟踪，置信度为中：把 Slash
              留在漏斗里，尊重增长，但在称其为买入前，坚持要么更好的证据，要么更好的价格。
