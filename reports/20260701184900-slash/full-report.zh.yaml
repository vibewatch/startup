          - type: paragraph
            body: >-
              已完成融资清晰可见，当前流动性却不可见。Slash 公开以 3.7 亿美元估值完成 4,100 万美元 B 轮融资，随后以 14 亿美元估值完成 1 亿美元 C 轮融资，累计披露融资超过 1.6
              亿美元。管理层把最新一轮描述为拓展产品和市场的燃料，尤其是 Twin 和 AI 驱动的工作流自动化，而不是对明显资产负债表压力的回应。乐观解读有支撑：Slash
              看起来比贷款机构更轻资产，因为其卡余额每日结算，营运资本产品也似乎通过 Lead Bank 由合作方发起，而非放在 Slash 自身资产负债表上。但资本强度仍然真实存在。公司补贴奖励，为 Pro
              用户免除境内交易费，并依赖多方基础设施：Column 负责银行，Atomic 负责资金管理，Bridge 和 Layer2 负责稳定币服务，Lead Bank
              负责营运资本。资金管理余额并不只是银行资产负债表上的额外存款；法律脚注说明，该产品位于 broker-dealer 或投资顾问结构中，不受 FDIC
              保险保护，也可能亏损。稳定币服务有一套单独免责声明，包括无保险、不可逆，以及 Slash
              不保证储备。这些披露意味着，主要资本充足性风险与其说是已披露的信用损失，不如说是快速增长之上叠加的多合作方运营和信任依赖。由于 Slash
              没有披露现金、烧钱或现金续航期，委员会只能说融资背景有支撑，不能说流动性宽裕。
