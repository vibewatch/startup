              detail: 每日结算相比循环信用降低应收账款风险。
            - label: 高
              tone: warning
              detail: 依赖 Column 以及赞助银行或发卡经济。
            - label: 中
              tone: neutral
              detail: 定价和奖励公开；留存交换费不公开。
            - label: 奖励和发卡方经济需要尽调
              tone: warning
              detail: 如果伙伴分成偏薄，慷慨返现会压缩利润率。
        - label: 支付通道与全球转账
          values:
            - label: 低
              tone: neutral
              detail: 主要是运营敞口，不像库存式敞口。
            - label: 中到高
              tone: warning
              detail: 依赖支付网络、运营控制和合规筛查。
            - label: 中
              tone: neutral
              detail: 标价费用公开，但使用量和服务成本不公开。
            - label: 交易量不等于利润率
              tone: warning
              detail: 需要通道级毛利，而不是只看支付量标题。
        - label: 资金管理与闲置现金产品
          values:
            - label: 低
              tone: neutral
              detail: 没有明显库存风险，但余额放在投资结构中，而不是普通存款。
            - label: 高
              tone: warning
              detail: Atomic 和货币市场结构是产品交付核心。
            - label: 中
              tone: neutral
              detail: 主打收益率公开；利差留存和 AUM 不公开。
            - label: 利差经济不透明
              tone: warning
              detail: 高报价收益率并不能说明 Slash 在穿透支付和伙伴成本后赚多少。
        - label: 稳定币与运营资本
          values:
            - label: 中
              tone: warning
              detail: 稳定币储备和运营资本贷款由伙伴管理，但信任和运营敞口仍然真实存在。
            - label: 极高
              tone: warning
              detail: Bridge、Layer2 和 Lead Bank 都对价值主张很关键。
            - label: 低到中
              tone: warning
              detail: 法律免责声明公开，但经济模型和损失分担不公开。
            - label: 伙伴经济不确定性最高
              tone: warning
              detail: 这些轨道可能既差异化又赚钱，也可能具备战略价值但利润率低。
