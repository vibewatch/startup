      - number: '5.2'
        title: 架构与合作方栈
        blocks:
          - type: paragraph
            body: >-
              公开架构指向 Slash：它是一个叠在受监管银行通道和专业外部服务商之上的编排层。Column 是可见的银行和发卡方。扫存覆盖依赖网络银行分配逻辑。稳定币和 Global USD 流依赖
              Bridge、Layer2 和 Alchemy，把链上余额做得像银行账户；资金管理通过 Atomic 运转，营运资本产品则经由 Slope 和 Lead Bank。这张依赖图很重要，因为 Slash
              的价值主张是工作流统一：一个仪表盘、一个移动应用、一个 Slack 代理、一个 API
              面，以及一个跨越很不一样的金融原语的会计关账流程。工程博客比普通金融科技营销更有可信度，因为它描述了明确的编排抽象、可审计目标，以及即时入账如何把加密结算接到基于 ACH
              的银行入账上。即便如此，公开文件仍留下重要空白。它没有完整解释 Slash 体验与 Column 核心系统之间是否仍有任何中间件或 BaaS 层，也没有解开早期 Piermont 时代安排迁移到今天 Column
