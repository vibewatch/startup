      - number: '2.2'
        title: 市场规模口径与保留的矛盾
        blocks:
          - type: paragraph
            body: >-
              Slash 所在市场的公开规模方向上很强，但方法上很乱。官方企业数量口径来自 SBA 的 3,620 万家美国小企业，说明任何金融科技细分之前，这个品类本身就很大。更宽的劳动者口径来自 Found 的 6,400
              万自雇美国人和 MBO 约 7,300 万独立工作者，覆盖那些可能购买企业财务软件、但未被计入雇主企业的单人创业者和副业收入人群。更窄的高端口径来自 MBO 的 560
              万六位数收入独立工作者，这更接近愿意为更好的现金流工具、返现和一体化后台帮助付费的人群。第四个口径是 Bluevine 管理层声称，未被商业银行充分服务的 SMB 代表 1,250
              亿美元市场。这些数字不能互换：有的数企业，有的数人，有的数高端子集，还有一个数收入机会。正确结论不是把它们平均，而是保留分歧。Slash 披露的 10,000+ 家企业，以及 Mercury 300,000+
              客户、Relay 150,000+ 客户、Bluevine 100 万累计客户等竞争者规模，说明数字化渗透真实存在，但相对广义美国 SMB 基数仍然很低。公开来源没有拆出 Slash 的精确美国
              SAM，也没有拆出它在任何单一垂直里的实际份额，所以任何 TAM-SAM-SOM 栈的底层都仍受证据限制。
