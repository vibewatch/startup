companyProfile:
  summary: >-
    Slash 是一家旧金山金融科技公司，把美国企业银行服务和签账卡，与资金管理、稳定币和 Global USD 通道、会计自动化、API，以及面向数字优先经营者的 Twin AI 助手组合在一起。公开来源把项目起点放在 2020
    年，官方 2026 年 4 月融资材料则采用 2021 年成立口径；公司最早在球鞋转售商和个体经营者中跑出牵引，随后转向更大、更垂直化的企业。到 2026 年 4 月，公司完成 1 亿美元 C 轮融资、估值 14
    亿美元，但它披露的利润率、控制和合作方经济，仍远少于其增长曲线所需要的透明度。
