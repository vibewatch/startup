      - number: '3.2'
        title: 产品栈、定价、收益率与变现差异
        blocks:
          - type: paragraph
            body: >-
              产品和定价对比说明，为什么 Slash 能支撑一种与大众 SMB 银行服务很不一样的经济曲线。Slash 公开销售免费计划和每月 25 美元的 Pro 计划，公布 1.5% 和 2%
              返现档位，把无限虚拟卡放进基础卖点，并在其上叠加资金管理和原生稳定币支付。Mercury 比很多创业公司银行更透明、分层更清晰，有 0 美元、29.90 美元和 299 美元套餐，资金管理在余额达到
              250,000 美元时解锁。Ramp 在核心软件栈上先以 0 美元定价，再转向按用户和企业方案收费，这为其高价值自动化产品打开宽入口。Brex 从每用户 0 美元起步，以每用户 12
              美元增加付费功能，同时变现更深的银行和资金管理栈，如今又接入 Capital One。Bluevine 靠 APY 档位、支付、订阅和浮存变现；Found 通过免费到付费的自雇计划、APY 和返现变现；Novo
              用无费用定位加余额挂钩返现吸引客户；Chase 则收明确的月度支票账户费用，除非活动或余额满足豁免条件。关键不对称在于，如果 Slash
              持续赢下高消费利基客户，并让它们高强度使用卡、资金管理和稳定币，它不需要达到 Mercury 或 Bluevine 的账户规模，也能产生可观收入。
