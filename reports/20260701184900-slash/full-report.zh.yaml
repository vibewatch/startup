  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 当前公开替代信号
      - 缺口为何重要
      - 精确尽调路径
      - 严重程度
    rows:
      - - 独立经审计财务报表
        - 新闻稿中的收入增长说法，以及 TechCrunch 一条盈利性表述
        - 没有经审计报表，就无法在承销时信任收入质量、费用分类和现金余额
        - 取得 FY2024–FY2025 经审计财务报表，以及 2026 年管理账和附注
        - 阻断
      - - 现金余额、月度消耗和资金续航期
        - 融资轮历史和投资人兴趣
        - 公司历史上融资充足，今天也可能现金吃紧
        - 索取月度资金桥表、财务约束条款包和 12 个月资金续航模型
        - 阻断
      - - 盈利口径
        - TechCrunch 称已盈利
        - 如果「盈利」指毛利，而不是 EBITDA 或现金流，承销结论会明显不同
        - 索取内部指标定义及支撑这一口径的 P&L 桥表
        - 重大
      - - 毛利率和净抽成率
        - 公开支付量、卡支出、返现率和换汇费估算
        - 如果保荐银行、奖励和合作伙伴成本吃掉利润率，只看收入增长还不足以判断耐久性
        - 索取产品级毛利率和净抽成率披露
        - 重大
      - - Column、Atomic、Bridge、Layer2 和 Lead Bank 的合作伙伴经济账
        - 公开产品披露和法律免责声明
        - 合作伙伴分成决定 Slash 能否吃到上行，还是主要把第三方经济账透传出去
        - 索取所有主要合作伙伴商业协议和分成表
        - 重大
      - - 客户定义和分群留存
        - 5,000 与 10,000 客户口径
        - 没有统一分母，ARPU、CAC 效率和留存推断都不可靠
        - 索取活跃、付费和累计客户定义，以及分群留存表
        - 次要
    notes: 每一行都是披露阻碍，不是数据洁癖。问题不在缺少增长信号，而在缺少可用于承销的财务可见度。
