  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 赞助银行集中度
        - Column 关系或银行牌照压力
        - 重大服务中断、合作方不利行动，或缺少可信备用银行方案
        - 升级为尽调阻断项，直到管理层证明备用银行和对账连续性
      - - 稳定币监管变化
        - GENIUS Act 落地要求收紧
        - 生效日前，Slash 无法说明发行方、储备、赎回和客户披露需要做哪些调整
        - 在合规运营模型成文前，对 Global USD 和 USDSL 的上行打折
      - - 欺诈与支持压力
        - 投诉、争议或欺诈指标走弱
        - 管理层无法提供队列层面的争议、损失和人工复核数据，也说不清责任归属
        - 显著下调信心，因为控制体系可能落后于增长
      - - 返现经济性
        - 奖励经济性收窄或排除项增加
        - 奖励明显收紧、作废增加，或经济性不再适配目标客户
        - 重新评估获客效率和客户质量，而不只看总支付额
      - - 合作方技术栈可靠性
        - Bridge、Layer2、Alchemy、Atomic 或相关合作方失效或重新定价
        - 针对合作方事故中的宕机、赎回或客户沟通，没有经过演练的预案
        - 在应急手册得到证明前，按更高流失率和支持成本处理
      - - 领导层与梯队厚度
        - 创始人或关键高管离职、过载
        - 合规、合作方管理和反欺诈运营没有可信的授权负责人
        - 上调关键人物风险；信心增强前，要求接班或组织厚度证据
    notes: 这些否决标准把公开风险转成具体尽调关口。本章有意用可衡量的升级触发项，替代泛泛的谨慎表述。
