      - number: '3.4'
        title: 护城河耐久性、切换成本与战略展望
        blocks:
          - type: paragraph
            body: >-
              Slash
              的护城河真实存在，但有条件。它最强的位置，是企业希望把企业支票账户、卡、资金管理、跨境结算和自动化放进一个工作流，尤其当该企业太利基或太接近加密、主流银行不愿优先服务时。公司在小客户基数上跑出的公开收入规模，意味着它赚的是使用强度，而不是普及率；低费用同行很难快速复制。但同一不对称也带来脆弱性。窄客户群可能流失，合作银行和稳定币规则可能变化，如果消费组合恶化或排除项扩大，重奖励变现也可能更难维持。切换成本是中等的，而不是绝对的：一家公司一旦配置好卡、付款、账单支付、集成、资金管理规则，甚至稳定币流，搬迁会痛苦；但许多买方仍能多家并用，或者在需求变得更主流时退回更宽的品牌。Mercury
              的银行牌照路径、Ramp 的财务套件广度、Bluevine 和 Relay 的主流 SMB 触达、Found 和 Novo 的自助简洁体验，以及 Chase 的网点与信贷信任，都分别攻击 Slash
              位置中的不同弱点。战略问题在于，Slash 能否在横向玩家吸收同类能力之前，更快扩展垂直工作流。
