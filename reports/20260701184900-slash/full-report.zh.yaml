      - - Mercury
        - $0
        - $29.90 Plus；$299 Pro；$250K 解锁 Treasury
        - 含卡；审阅页面未把公开返现作为主标题
        - 银行核心功能免费，付费计划靠发票、报销和客户关系服务变现
        - Mercury 的软件和资金管理升级变现比 Slash 更透明
      - - Ramp
        - $0
        - $15/用户 Plus + 平台费；Enterprise 定制；Free 层含资金管理
        - 最高 5% 返现
        - 国内 ACH / 支票零费用；用户规模扩大后靠软件深度变现
        - 漏斗更宽，软件加购和高奖励都有吸引力
      - - Brex
        - $0/用户
        - $12/用户高级功能；资金管理回报可变
        - 以卡为入口，投资资金再叠加资金管理回报
        - 部分产品会收费；回报取决于支票账户、资金管理和金库余额
        - Brex 可以压低入门价，再从更宽的银行 + 软件关系中变现
      - - Bluevine
        - $0 Standard
        - $30 Plus；$95 Premier；APY 1.3%-3.0%
        - 借记卡消费享 4% Mastercard Easy Savings 返现
        - 费用减免比传统银行简单，但高档收益需要升级计划或满足活动要求
        - 主打主流 SMB 性价比，而不是垂直工作流深度
      - - Relay
        - 明示无隐藏费用
        - Starter / Grow / Scale 套餐可见；已审文本未找到确切公开价格
        - 有卡和账户套餐，但不突出奖励
        - 突出无透支费、无最低余额要求
        - 拼的是现金流清晰和简单，不是亮眼奖励经济
      - - Found / Novo
        - Found 核心功能免费；Novo 无月费
        - Found Plus $35、Pro $80，含 APY；Novo 按余额给返现
        - Found Pro 返现 1%；Novo 按余额返现 1%-2%
        - 自雇人群套餐侧重税务、记账和低摩擦运营
        - 单人经营者若不需要资金管理或稳定币通道，这些产品会压过 Slash
      - - Chase
        - $15 Complete Checking
        - $40 Performance；$95 Platinum
        - 传统借记和商户受理，不是金融科技式奖励
        - 满足余额、存款或用卡活动即可免月费
