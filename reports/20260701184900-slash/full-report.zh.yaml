      - number: '7.2'
        title: 运营、欺诈与支持控制风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，Slash 服务的正是控制薄弱时最容易痛起来的工作流：快速付款、高频用卡、跨境资金流、稳定币转账，以及包含加密货币相邻和数字原生运营者的客户群。Treasury 的 2026 年洗钱评估和 FinCEN
              的 2026 年 AML 提案都强调 AI 驱动诈骗、数字资产滥用、更高风险客户，以及把资源投向最高风险活动的必要性。Slash 自己的禁用活动政策和 KYC/KYB
              材料显示，管理层认识到这些风险；但公开证据仍远未披露损失率、可疑活动报告量、人工审核强度或争议解决表现。


              客户摩擦证据也不是灾难，而是好坏参半。公开可见的 Trustpilot 文本大多肯定日常支持和易用性；但 BBB 投诉形成了另一条负面信号，Slash
              自己的关户文章也确认，账户关闭是人工流程、要经过客服，且可能因争议或调查而延迟。公司发布了 SOC 2 Type II、PCI
              DSS、MFA、审计日志等真实信任信号，但这些只是框架指标，不能证明欺诈运营、事件响应或例外处理能随着公司现在宣传的支付规模顺滑扩张。
