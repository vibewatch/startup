  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买方分群
        blocks:
          - type: paragraph
            body: >-
              Slash 身处拥挤赛道，但重叠并不对称。最接近的横向金融科技竞争者是 Mercury、Ramp 和 Brex，它们都向风投资助或成长型公司销售更宽的财务运营栈。Mercury
              现在覆盖卡、开票、账单支付、支出管理、洞察和银行牌照路径；Ramp 进一步延伸到采购、差旅和会计自动化；Brex 现在又有 Capital One 规模背书。第二层竞争者是主流 SMB
              简化型产品：Bluevine 和 Relay 聚焦普通小企业的运营账户、现金流清晰度和支付；Found 和 Novo 则用记账、税务或无费用的简洁体验瞄准自雇业主和独立企业。Chase
              是传统标杆，因为它把支票账户、刷卡收单、融资邻近能力和网点触达打包。现状替代方案仍是一套工具栈，而不是单一对手：传统支票账户、支出工具，以及会计或开票软件。Slash 的差异化在于，它把稳定币通道、资金管理、AI
              和行业化工作流加到这套栈里；但这也意味着买方会同时把它拿来和好几类竞争者比较，而不是只和一个显而易见的同类比较。
