      - number: '2.3'
        title: 买方分群、预算所有者与采用路径
        blocks:
          - type: paragraph
            body: >-
              这个市场至少分成五类买方模式。第一类是数字优先的创业公司和成长型 SMB，希望把企业卡、审批控制、资金管理收益和会计集成放在一处；Mercury、Ramp、Brex 和 Slash
              都在这里竞争。第二类是单人创业者、创作者和独立专业人士，需要银行账户加记账、开票、税务或承包商工具；Found 和 Novo 明确证明了这类买方存在。第三类是有反复现金流压力的主流雇主型
              SMB，在意低费用、服务、审批通过率，以及运营资金是否清楚可见；Bluevine 和 Relay 显示这个群体可以做得很大。第四类是跨境或加密相邻的运营者，比如代理机构、进出口企业、web3
              初创公司和海外承包商，Slash 的稳定币层直接回应结算速度和钱包复杂度。第五类是更大数字企业内部的财务或运营经理，用户常常是员工或财务主管，但付款方是企业实体，预算所有者是创始人或财务负责人。Federal
              Reserve 和 NFIB 的证据说明为什么这种分群重要：小公司借钱是为了经营，许多单次融资需求低于 50,000
              美元，而选银行仍取决于客户服务、费用、数字能力，以及服务商能否成为主运营枢纽，而不是又一张卡或又一个仪表盘。
            claimRefs:
