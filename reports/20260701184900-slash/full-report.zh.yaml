        title: 牛、基准、熊三种情景支持区间，而不是精确目标价
        blocks:
          - type: paragraph
            body: >-
              情景分析最好被当作搭建区间，而不是宣布单一价格。在牛市情景中，公开的 $250 million 到 $300 million
              年化收入区间是真实的；该区间高端即便扣除返现和合作伙伴分成，仍有健康的毛利转化；稳定币或全球美元产品也能在没有监管重置的情况下持续复利。在这组假设下，当前 $1.4 billion
              标记可以显得合理，甚至略有吸引力，尤其是如果私有尽调显示的单位经济比开放网络能看到的更干净。


              基准情景更克制。如果年化收入真实，但仍更接近支付挂钩变现，而不是高质量软件 ARR，那么约 4x 到 5x 的承销区间会给出大约 $1.0 billion 到 $1.5 billion
              的公允价值。这个区间接近当前价格，而不是明显高于当前价格。它支持继续观察，而不是追价。熊市情景自然来自同一组不确定性。如果客户定义比表面更松，奖励和合作伙伴成本更深地吃掉毛利，或稳定币与合作银行复杂性迫使市场给出更重折价，那么
              2.5x 到 4x 区间会更接近 $0.6 billion 到 $1.0 billion。也因此，公开披露仍不足以支撑高置信目标价：缺失的利润率、集中度和资本结构变量对价值影响太大，不能被一个漂亮数字遮住。
            claimRefs:
