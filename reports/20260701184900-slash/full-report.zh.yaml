  - id: TU005
    title: 扩张与集中度风险表
    columns:
      - 扩张驱动
      - 集中度风险
      - 影响
      - 尽调路径
    rows:
      - - 从卡到资金管理 / 营运资金
        - 客户群偏向高卡消费经营者
        - ARPU 强，但高消费队列放缓会带来周期性
        - 索取卡、资金管理和类信贷产品的收入与毛利结构
      - - 从银行服务到 Global USD / 稳定币
        - 跨境和加密邻近客户可能变得过度重要
        - 让 Slash 做出差异化，但也抬高监管和赞助银行敏感度
        - 索取 Global USD 队列的客户数、收入占比和头部账户集中度
      - - 从 Global USD 到 Global Card 和更广的金融栈
        - 非美国获客可能仍集中在进出口和 web3 场景
        - 增加 TAM，但不一定真正拓宽客户多样性
        - 按地域、行业和支付通道索取分群结构
      - - Twin / 自动化增购
        - 最适合的可能是数字化成熟团队，而非普通 SMB
        - 能提升高频用户黏性，但小客户参与度可能更低
        - 按账户规模索取 Twin 采用率及其对留存或 ARPU 的影响
      - - 家庭服务 / 承包商相邻扩张
        - 该垂直领域被公开点名，但证据很薄
        - 今天可能更像愿景，而非已落地
        - 索取家庭服务或承包商队列的具名客户背书和交易量指标
      - - 客服与账户关闭处理
        - 数字优先的客服模式在高交易量客户需要快速例外处理时，可能变成集中度风险
        - 即便产品强，问题解决慢也会削弱留存
        - 索取 SLA 仪表板、升级政策，以及按问题类型拆分的月度投诉趋势
      - - 具名证明稀缺
        - 本轮只看到一条可明确归因的具名客户引言
        - 难以检验企业级质量、采购深度和集中度韧性
        - 索取按收入、客户年限、行业和生产状态列出的前 20 大客户名单
