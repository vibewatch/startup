      - number: '1.3'
        title: 基础设施、合规与客户风险面
        blocks:
          - type: paragraph
            body: >-
              Slash 的差异化依赖外部基础设施。Column N.A. 提供核心银行和卡通道；IntraFi 式扫存合作方支撑「数亿美元」FDIC 覆盖叙事；Atomic 支撑资金管理；Bridge、Layer2 和
              Alchemy 支撑稳定币发行、托管流、免 gas 交易和 Global USD 机制。这套架构让 Slash
              无需银行牌照就能铺开产品广度，但也把尽调重点集中到合作方合同、对账控制和应急计划上。公司自己的披露说得很清楚：数字资产不是银行存款，不受 FDIC 或 SIPC
              保险保护，可能不可逆，并依赖第三方发行方和托管方。运营层面，关户是人工流程，条款允许 Slash 或金融机构合作方因合规或禁止活动原因暂停或关闭账户。Trustpilot 上的公开情绪整体正面，但 BBB
              投诉页以及竞争对手围绕 FX 和日结算的批评显示，摩擦并非想象。Synapse 仍是这个行业的警示背景：一旦账本和合作银行责任断裂，用户可能数周无法取用资金。
