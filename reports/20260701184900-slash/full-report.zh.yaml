      - CV007
      - CV011
      - CV016
      - CV031
      - CV032
      - CV037
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 公开收入代理指标已经不小，因此倍数假设的小幅变化也会显著推动公允价值。
    approximationNotes: 数值把示例性的年化收入锚乘以选定的可比倍数。它们不是管理层指引，并且刻意忽略公开文件未披露的资本结构条款。
    data:
      items:
        - label: 基于 $250M 年化运行率的 3.0x
          value: 750
        - label: 基于 $250M 年化运行率的 4.0x
