      - number: '6.3'
        title: 满意度、支持与留存信号
        blocks:
          - type: paragraph
            body: >-
              公开满意度信号方向不错，但深度不足以替代留存披露。存档 Trustpilot 快照显示，Slash 来自 369 名客户的评分为
              4.9/5，抓取到的评论大多肯定易用性、虚拟卡、返现、当日资金流转和响应式支持。这些评论也说明，产品最自然的采用者是线上优先运营者，而不是依赖网点的小企业。不过，评论证据并不完整。抓取到的 G2 页面被 JS
              阻挡，所以本轮无法独立核验 B2B 评论深度；BBB 投诉页也只能到达通用壳层，抓取文本没有暴露 Slash 特定投诉数量。


              耐久性证据更薄。没有审阅到的公开来源披露 NRR、GRR、logo 流失率、续约率或标准合同期限。最好的粘性信号是间接的：一位评论者称自 2023 年以来一直使用 Slash，Bridge
              描述的稳定币交易量持续增长，以及 Slash 不断把卡、资金管理、营运资本、Global USD 和 Twin 叠到同一账户关系上。支持和退出摩擦也是真实尽调议题。Slash
              自己的帮助中心说，关户不能自助，需要所有余额和授权清空，可能因争议暂停，通常需要 3 到 5
              个工作日。对一个服务高频资金流转客户的平台来说，这意味着即使公司不披露留存指标，支持质量和异常处理也是留存故事的一部分。
