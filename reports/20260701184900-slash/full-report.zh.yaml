      - number: '6.2'
        title: 采用轨迹与公开证据
        blocks:
          - type: paragraph
            body: >-
              采用证据总量强、归因弱。当前营销页面反复称 10,000+ 家企业使用 Slash，而 2026 年 4 月 BusinessWire 新闻稿称公司服务超过 5,000
              家企业。最保守的解读不是其中一个数字为假，而是 Slash 在广义账户或产品用户与更窄的已服务企业定义之间切换分母。其他公开指标指向有意义的使用：网站称已发行 500 万+ 张虚拟卡、赚取返现超过 1
              亿美元、年支付量达 350 亿美元+；BusinessWire 则称 Slash 已经超过 300 亿美元年化支付量。Bridge 和公司还表示，稳定币活动在九个月内达到约 10
              亿美元年化，这一点尤其重要，因为它展示的是重复运营使用，而不是一次性功能发布。


              具名客户证据是弱环。相对于报道规模，审阅过的来源集里只有一条能直接归属的具名客户引语：Slash Global USD 页面上的
              Privy.io。这条引语有用，因为它描述的是真实工作流整合，而不是模糊满意度。Bridge 和 Alchemy 随后从合作方一侧印证了使用场景模式，称 Slash 正在为 web3
              初创公司、进出口企业和需要美元账户但不想承受加密摩擦的非美国公司解决真实问题。但公开记录仍缺少足够宽、可引用的客户案例库，让投资人检验装机客户中的集中度、企业级成熟度或续约质量。
