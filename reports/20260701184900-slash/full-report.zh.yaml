      - number: '1.4'
        title: 里程碑、战略重置与主要开放问题
        blocks:
          - type: paragraph
            body: >-
              时间线显示，这家公司多次重置命题，却没有丢掉增长速度。2020 年起源与 2021 年发布的模糊期之后，是球鞋转售商的早期牵引、Yeezy 崩盘后的市场冲击、更宽的垂直银行转向、2024
              年底的稳定币基础设施、2025 年 B 轮与品牌重塑，最后是 2026 年围绕 Twin 和 AI
              原生财务工作流的独角兽融资。这条路径之所以值得投资，是因为公司似乎很快把产品速度转成了收入和估值。但故事还没完。公开记录仍缺审计财务、统一的活跃客户定义、YC
              资料页之外的官方员工数披露，以及完整董事会或控制图谱。这些缺口重要，因为支撑上行空间的同一章，也记录了指标冲突和合作方依赖风险。投资人应把 Slash
              视为增长很快、战略上有趣，但相对其估值所暗示的野心，仍明显披露不足。
