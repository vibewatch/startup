  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 扣除奖励和合作方分成后，毛利率不及预期
        - 私有尽调显示，卡和稳定币交易量的毛利转化偏弱
        - 打破 Slash 在当前规模下仍应享有中个位数收入倍数的逻辑。
        - 转向回避，或要求大幅更低价格。
      - - 客户基数质量弱于公开叙事
        - 活跃且可变现账户显著低于公开表述的 5,000-10,000
        - 削弱收入耐久性，也削弱外界感知的市场渗透率。
        - 用更低的活跃客户和队列假设重新评估。
      - - 合作方集中度缺少可信应急方案
        - Column、Bridge 或相关托管 / 编排依赖没有可执行备用方案
        - 把平台脆弱性和运营集中度抬到可接受范围之外。
        - 加大折价，或在应急规划改善前退出。
      - - 稳定币监管迫使产品或披露调整
        - USDSL / 全球美元经济性或客户资格在规则演进后明显收窄
        - 削弱关键差异点，并可能下调增长预期。
        - 下调牛市情形权重，并压低倍数区间。
      - - 资本结构悬顶过重
        - 清算优先权、参与权或棘轮条款吃掉太多上行
        - 企业价值不再能转化成有吸引力的普通股回报。
        - 要求不同条款、更低价格或结构化入场。
      - - 管理层无法在尽调中补上披露缺口
        - 数据室没有经审计报表、收入桥，也没有队列或烧钱数据
        - 证明公开不透明不是暂时问题，而是结构性问题。
        - 维持继续研究 / 跟踪建议，或退出流程。
    notes: 触发项按真实尽调中可观察来设计。它们把抽象估值争论转成明确的停 / 走条件。
    claimRefs:
      - CV031
      - CV032
      - CV035
      - CV036
      - CV039
      - CV040
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计财务和收入桥
        - 2025-2026 年经审计收入、毛利、产品组合和盈利定义
        - 这是高信心估值的核心阻断项，也决定如何解读 $250M-$300M 运行年化收入说法。
        - CFO / 财务数据室请求，绑定审计包和董事会材料。
      - - 返现和合作方经济性桥
        - 按产品线拆分奖励费用、退单 / 欺诈损失、赞助银行分成和稳定币合作方费用
        - 如果激励和合作方成本很重，业务按收入看可以便宜，按毛利看仍可能昂贵。
        - 财务 + 支付运营；索取队列利润率桥和合作方合同。
      - - 客户定义对账
        - 活跃、付费、高交易量和总账户数，以及头部队列集中度
        - 账户定义不明确前，5,000+ 与 10,000+ 的说法达不到估值级。
        - RevOps / 财务；把仪表盘指标与投资者材料对齐。
      - - 资本表和清算瀑布
        - 优先权堆栈、参与权、棘轮条款、可转证券和任何高级索偿
        - 如果瀑布结构拥挤，披露企业价值会高估股权吸引力。
        - 法律尽调；审阅章程、投资者权利协议和融资明细。
      - - 流动性和跑道
        - Series C 后现金余额、月度烧钱、应急计划和最低流动性阈值
        - 投资者不能只凭新一轮融资推断流动性安全。
        - 财务和董事会材料；索取现金跑道模型和下行情景。
      - - 稳定币与合作方风险治理
        - Column、Bridge、Layer2 和钱包提供商的有效协议、应急计划和合规工作流
        - 增长故事里相当一部分现在依赖合作方和监管执行，不只是需求。
        - COO / GC / 合作伙伴团队；索取运营手册和最新法律审查。
    notes: 这些问题按它们改变价格支撑的直接程度排序。第 1-4 项是承保阻断项；第 5-6 项决定差异化增长故事应拿更小还是更大的折价。
    claimRefs:
      - CV010
      - CV013
      - CV016
      - CV031
      - CV036
      - CV042
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: standard
    summary: Slash 从 2020 年起源模糊走到 2026 年独角兽的路径，包括塑造转型的市场冲击和合作方风险背景。
    data:
      items:
        - label: '2020'
          value: Origin begins
          detail: 多份 2026 年报道和 YC 都把公司起源追溯到疫情期间的 2020 年。
          tone: neutral
        - label: '2021'
          value: Official founding language
          detail: 2026 年 4 月融资文案却称 Slash 创立于 2021 年。
          tone: neutral
        - label: 2022-Q4
          value: Wedge market breaks
          detail: 球鞋和 Yeezy 崩盘迫使公司从最初的小众市场转型。
          tone: risk
        - label: 2024-12
          value: Bridge partnership
          detail: 稳定币基础设施上线，拓宽路线图。
          tone: positive
        - label: 2025-05
          value: Series B + rebrand
          detail: $41M 融资对应 $370M 估值，并据报以 $1M 收购 Slash.com。
          tone: positive
        - label: 2025-08
          value: USDSL launches
          detail: Slash 在 Bridge 基础设施之上加入自己的稳定币层。
          tone: positive
        - label: 2025-08
          value: Synapse caution hardens
          detail: CFPB 对 Synapse 的行动成为对账和合作银行风险的行业警示。
          tone: risk
        - label: 2026-04
          value: Series C + Twin
