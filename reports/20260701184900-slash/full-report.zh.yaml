    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 情景区间说明，当前价格可以辩护，但如果没有私有信息佐证，并不显然有利。
    approximationNotes: 低、中、高值代表粗略情景带，而不是点估计。它们明确保留不确定性，因为利润率和资本结构细节并不公开。
    data:
      items:
        - label: 熊市公允价值（USD M）
          low: 600
