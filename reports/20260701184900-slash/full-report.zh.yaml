  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Slash 的公开技术栈将用户界面叠在支付编排、银行通道、链上伙伴和外部资金管理服务之上。
    data:
      layers:
        - label: 用户界面
          detail: 经营者通过网页仪表盘、重建后的移动应用、Slack 或短信里的 Twin，以及 API 界面交互。
          modules:
            - 仪表盘
            - 移动应用
            - Slack 或短信里的 Twin
            - 公开 API
        - label: Slash 控制平面
          detail: Slash 把账户、卡、分析、审批和多实体上下文打包进一个面向客户的控制界面。
          modules:
            - 账户与卡
            - 分析
            - 审批
            - 多实体上下文
        - label: 工作流与通知层
          detail: 转账、Webhook 回调、审批事件和代理动作，依赖内部工作流逻辑与事件处理。
          modules:
            - 资金流概念
            - Webhook 回调
            - 事件日志
            - 授权逻辑
        - label: 银行与卡通道
          detail: 受监管的法币核心由 Column 和 Visa 支持的发卡承载，再加上存款自动划转计划机制。
          modules:
            - Column 存款核心
            - Visa 签账卡
            - ACH / 电汇 / RTP / FedNow
            - 扫存计划
        - label: 稳定币与 Global USD 轨道
          detail: 链上余额和兑换靠合作伙伴支撑，把托管、gas 和结算抽象成接近银行账户的体验。
          modules:
            - Bridge
            - Layer2
            - Alchemy 钱包与 RPC
            - Global USD
        - label: 资金管理、信贷与结账集成
          detail: 收益、授信和账本同步服务靠外部专家扩展平台，而不是 Slash 自建完整资产负债表。
          modules:
            - Atomic Treasury
            - Slope 与 Lead Bank
            - QuickBooks / Xero / Sage
            - Plaid / Yodlee
    approximationNotes: 该图综合公开的产品、法律、帮助中心、合作伙伴和工程材料；内部服务名称以及任何隐藏中间件均未公开记录。
