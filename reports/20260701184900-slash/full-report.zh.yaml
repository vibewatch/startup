        - 重要，因为一体化软件在收益或费用之外驱动切换价值
      - - 营运资本与信贷获取
        - 合作伙伴发起、与运营现金需求挂钩的定期贷款或信贷额度
        - 按揭、消费者分期信贷、无抵押个人借款
        - 企业主或财务负责人
        - 相关，因为信贷可得性可以锚定主要银行关系
      - - 跨境与稳定币支付
        - USDC / USDT 或全球美元资金流、更快结算、对 FX 敏感的供应商付款
        - 投机交易、零售加密投资、消费者代币活动
        - 向供应商、承包商或全球实体付款的运营者
        - web3、进出口、代理服务商和全球优先细分市场的关键差异化
      - - 独立创业者后台栈
        - 企业账户、预留税款、记账、承包商付款、子账户
        - 一般消费者个人财务管理
        - 独立工作者或个体经营者
        - 相关，因为 Found、Novo 与 MBO/Found 劳动力数据表明，邻近自助买方基数很大
    notes: 边界有意只限企业运营金融。消费者新银行、家庭支付和零售投资均被排除，即便存在相似 UX 模式；因为 Slash 的资格、定价和竞争对手集合都指向 SMB 与独立创业者工作流。
