  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与结构性风险
        blocks:
          - type: paragraph
            body: >-
              Slash 最重要的风险是结构性的，不是戏剧性的：公开来源并未显示 Slash
              当前面临执法行动；真正的问题是，公司现在同时覆盖合作银行存款、存款分扫网络保险、签账卡经济、资金管理和稳定币产品，而这些业务落在不同法律制度和不同交易对手之下。Column
              是核心账户和卡业务中明确披露的银行合作伙伴；Slash 自己的稳定币页面则写明，数字资产服务不是存款、不受保险保护，并由 Bridge Building Inc.、Layer2 Financial
              等第三方发行、托管或兑换。也就是说，客户体验看起来是一体的，法律栈却不是一体的。


              稳定币侧的监管只会更明确，不会更松。Norton Rose、Debevoise、OCC 和 FDIC 都把 2025 到 2026 年描述为支付稳定币走向明确许可、储备、赎回、托管、资本、AML
              和披露标准的阶段。这些规则不能证明 Slash 不合规；但它们意味着，产品表述、奖励机制、托管披露和储备陈述，不能再被当作创业早期的灰色地带。公开记录中也没有在已审阅来源里浮现 Slash 的 CFPB
              行动，但诉讼和机构尽调仍不完整，因此这应被视为尽调检查点，而不是干净的法律健康证明。
