  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 公开规模锚点
      - 估值 / 倍数锚点
      - 与 Slash 的关联
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Rows capture the most decision-useful public private-fintech references surfaced in this run: Slash itself,
        disclosed high-scale peers, and lower-price SMB banking references. It is not an exhaustive census of every
        fintech or public-market payments comp.
    rows:
      - - Slash 当前估值
        - 250M-300M 公开年化收入替代值；5,000+ 至 10,000+ 家企业；$30B+ 年化支付量
        - $1.4B Series C；按公开运行年化收入约 4.7x-5.6x
        - 当前入场纪律的直接锚点。
        - 收入质量、盈利能力和活跃客户定义披露不足。
      - - Mercury
        - 300,000+ 客户；$650M 年化收入；连续四年 GAAP 盈利
        - $5.2B Series D；约 8.0x 年化收入
        - 引用样本中披露最好的私有 SMB 银行倍数锚点。
        - 客户基数更宽、披露更强、银行牌照进展更深，使它成为高质量溢价参照，而不是一一对应的可比对象。
      - - Ramp
        - 50,000+ 客户；>$1B 年化收入；>$100B 年化采购量
        - $32B 估值；约 32x 年化收入
        - 金融软件混合溢价的牛市上限。
        - 公开 Slash 证据目前还无法证明 Ramp 那样的软件属性、产品宽度和盈利性。
      - - Brex / Capital One
        - 25,000+ 家 Brex 企业；Capital One 具备上市银行规模并提交 SEC 报告
        - Brex 已公告收购价值 $5.15B
        - 显示一体化支出基础设施的战略价值。
        - 交易价值带有 M&A 特征，且嵌在更大的上市银行平台内。
      - - Bluevine
        - 累计 1M+ 小企业客户；存款 >$2B；已发放融资 >$17B
        - 引用来源未披露估值
        - 大众 SMB 银行业务宽度的有用规模基准。
        - 公开来源在客户和存款规模上更强，在价格或收入倍数上更弱。
      - - Relay
        - 150,000+ 小企业；管理存款 $1.3B；收入有望到 2026 年底达到 3.2x
        - 披露 $50M 增长投资；此处未披露估值
        - 运营型 SMB 银行业务规模的有用基准。
        - 引用材料未披露干净的收入倍数。
      - - Found
        - 聚焦 64M 自雇人群 TAM；一体化银行、记账和报税
        - $50M Series C，估值 >$400M
        - 勾勒 SMB 金融科技中价格更低的单人创业者端。
        - 客户类型不同，且没有引用公开收入数字。
      - - Novo
        - 250,000+ 独立企业
        - 引用来源未披露估值
        - 显示通用型独立企业账户基数可以做得多宽。
        - 没有引用收入或估值锚点，因此更像细分市场基准，而不是定价可比对象。
    notes: 这张可比表刻意混合多种锚点和相对规模参照，因为只有部分同行同时披露估值和收入。目标是保持纪律，而不是制造虚假的精确度。
