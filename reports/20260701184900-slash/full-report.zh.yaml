            body: >-
              公开材料能看到信任和控制，也能看到限制。Slash 强调基于角色的权限、审批工作流、Twin 发起操作的事件日志、MFA、自动欺诈监控、SOC 2 对外定位、PCI 对外定位，以及由 KYC 或 KYB
              驱动的准入检查。法律和帮助中心文件也把安全边界说清楚：资金管理是证券产品，不是受保险保护的存款账户；稳定币和 Global USD 不受 FDIC 保险保护；RTP 和 FedNow
              一旦发出便不可逆；营运资本风控属于合作方。商业限制也不是摆设。返现排除大型商户，禁止活动政策会封堵或限制多个高风险类别和司法辖区，关户是人工支持流程，必须先清空余额、待处理付款，甚至任何即时入账贷款敞口。独立信号没有显示用户信任崩塌，但确实显示入驻
