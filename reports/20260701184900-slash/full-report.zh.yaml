  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 分群、入驻与工作流匹配
        blocks:
          - type: paragraph
            body: >-
              Slash 的公开客户故事从分群开始，而不是泛泛的 SMB 叙事。Business Banking 和 Treasury 仅限美国注册企业，而 Global USD 明确面向 130+ 国家中需要美元余额、ACH
              或电汇访问、稳定币通道，但不想自建独立加密运营的企业。这一分割很重要，因为它说明 Slash 不是一个统一客户群：美国本土注册企业通过银行服务、卡和资金管理进入，非美国实体则由 Global USD
              和跨境工作流拉进来。官方准入页面也显示出实质筛选压力。Slash 排除很长一串高风险或更难风控的类别，核心美国银行服务要求公司化实体，并让所有者和运营者接受 KYB、制裁和居住地审查。


              证据最持续的垂直，是效果营销机构、电商品牌、加密原生团队、进出口企业，以及其他交易强度高的数字优先运营者。官方 2026 年 4 月融资材料又把联盟营销、医疗和家政服务加入这组行业，而 Sacra
              则把公司描述为在横向新银行常常犹豫的地方赢单。当客户能在一个运营界面里受益于即时虚拟卡、高卡吞吐、资金管理、营运资本和稳定币通道时，工作流匹配最强。对需要 30
              天付款浮存的现金紧张企业，或需要广泛多币种支持而不是以 USD 为中心栈的全球复杂财务团队，这种匹配会更弱。
