  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and structural risk
        blocks:
          - type: paragraph
            body: >-
              Slash's most important risk is structural rather than theatrical: it is not that public sources show a
              current enforcement action against Slash, but that the company now spans sponsor-bank deposits,
              sweep-network insurance, charge-card economics, treasury, and stablecoin products that sit under different
              legal regimes and different counterparties. Column is the clearly disclosed bank partner for core accounts
              and cards, while Slash's own stablecoin page says digital-asset services are not deposits, are not
              insured, and are issued, custodied, or converted by third parties such as Bridge Building Inc. and Layer2
              Financial. That means the customer experience looks unified while the legal stack is not.


              The stablecoin side is becoming more regulated, not less. Norton Rose, Debevoise, the OCC, and the FDIC
              all describe a 2025 to 2026 move toward explicit licensing, reserve, redemption, custody, capital, AML,
              and disclosure standards for payment stablecoins. Those rules do not prove Slash is out of compliance;
              they do mean product claims, reward mechanics, custody disclosures, and reserve representations can no
              longer be treated as startup-era gray space. The public record also did not surface a Slash CFPB action in
              reviewed sources, but litigation and agency diligence remain incomplete enough that this should be treated
              as a diligence checkpoint rather than as a clean legal bill of health.
