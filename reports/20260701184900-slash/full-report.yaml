      - number: '6.2'
        title: Adoption trajectory and public proof
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence is strong in aggregate and weak in attribution. Current marketing surfaces repeatedly
              say 10,000+ businesses use Slash, while the April 2026 BusinessWire release said the company served more
              than 5,000 businesses. The most conservative interpretation is not that one number is false, but that
              Slash is switching denominators between broad account or product users and a narrower served-business
              definition. Public metrics otherwise point to meaningful usage: the site claims 5 million+ virtual cards
              issued, more than $100 million earned in cashback, and $35 billion+ in yearly payment volume, while
              BusinessWire said Slash was already above $30 billion in annualized payment volume. Bridge and the company
              also say stablecoin activity reached roughly $1 billion annualized within nine months, which is especially
              relevant because it demonstrates repeat operating use rather than a one-time feature launch.


              Named customer proof is the weak link. Relative to the reported scale, the reviewed source set contains
              only one directly attributable named customer quote: Privy.io on Slash's Global USD page. That quote is
              useful because it describes real workflow consolidation, not vague satisfaction. Bridge and Alchemy then
              corroborate the use-case pattern from the partner side, saying Slash was solving real problems for web3
              startups, import-export businesses, and non-US companies that needed dollar accounts without crypto
              friction. But the public record still lacks the sort of broad, referenceable customer-story library that
              would let an investor test concentration, enterprise maturity, or renewal quality across the installed
              base.
