  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, valuation context, and why disclosure is the bottleneck
        blocks:
          - type: paragraph
            body: >-
              Slash has enough real traction to deserve serious investor attention. The open-web record supports a fast
              step-up from the May 2025 $370 million Series B to the April 2026 $1.4 billion Series C, plus more than
              $160 million of total capital raised. It also supports genuine commercial scale: management publicly
              claimed more than $250 million of annualized revenue at the Series C, TechCrunch reported a $300 million
              annualized figure and used the word profitable, and Sacra independently estimated roughly $255 million
              annualized revenue in March 2026. On top of that, Slash says it now powers more than $30 billion in
              annualized payment volume and more than $1 billion in annualized stablecoin volume.


              The problem is not whether Slash looks real. The problem is whether the current price is underwritten well
              enough to buy aggressively. Public customer figures do not reconcile cleanly: Slash uses both 10,000-plus
              and 5,000-plus business counts, and the public record never defines whether those numbers refer to active,
              paying, or merely historical accounts. Profitability language is similarly thin. There is no audited
              statement, no gross-margin bridge, no burn disclosure, and no clear explanation of how much of the
              run-rate revenue survives cashback, sponsor-bank economics, stablecoin partners, or fraud and support
              costs. That pushes the recommendation toward research-more / track with medium confidence and a
              fair-to-stretched public-evidence stance, not because the business lacks momentum, but because the price
              already asks investors to trust private quality metrics they cannot yet see.
