  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segmentation, onboarding, and workflow fit
        blocks:
          - type: paragraph
            body: >-
              Slash's public customer story begins with segmentation rather than with a generic SMB pitch. Business
              Banking and Treasury are limited to US-registered businesses, while Global USD is explicitly marketed to
              businesses in 130+ countries that need dollar balances, ACH or wire access, and stablecoin rails without
              standing up separate crypto operations. That split matters because it clarifies that Slash is not one
              uniform customer base: domestic incorporated businesses enter through banking, cards, and treasury, while
              non-US entities are pulled in through Global USD and cross-border workflows. Official eligibility pages
              also show meaningful screening pressure. Slash excludes a long list of higher-risk or harder-to-underwrite
              categories, requires incorporated entities for core US banking, and subjects owners and operators to KYB,
              sanctions, and residence review.


              The most consistently evidenced verticals are performance marketing agencies, ecommerce brands,
              crypto-native teams, import-export businesses, and other digital-first operators with high transaction
