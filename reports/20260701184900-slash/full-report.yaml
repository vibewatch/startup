      - number: '8.3'
        title: Bull, base, and bear scenarios support a range, not a precision target
        blocks:
          - type: paragraph
            body: >-
              The scenario work is best treated as a range-building exercise rather than a single-price proclamation. In
              the bull case, the public 250 million to 300 million annualized revenue band is real, the higher end of
              that range carries healthy gross-profit conversion even after cashback and partner sharing, and stablecoin
              or global-dollar products keep compounding without a regulatory reset. Under that set of assumptions, the
              current $1.4 billion mark can look fair and perhaps modestly attractive, especially if private diligence
              reveals cleaner unit economics than the open web can show.


              The base case is more restrained. If the run-rate revenue is real but still closer to payments-linked
              monetization than to high-quality software ARR, then a roughly 4x to 5x underwriting band yields
              approximately $1.0 billion to $1.5 billion of fair value. That lands near, not far above, the current
              price. It supports monitoring, but not chasing. The bear case follows naturally from the same
              uncertainties. If customer definitions prove looser than they appear, if rewards and partner costs eat
              deeper into gross profit, or if stablecoin and sponsor-bank complexity forces a heavier discount, then a
              2.5x to 4x band points closer to $0.6 billion to $1.0 billion. That is why public disclosure is still
              insufficient for a high-confidence target: the missing margin, concentration, and cap-stack variables move
              value too much to hide behind one neat number.
