  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Gross margin disappoints after rewards and partner sharing
        - Private diligence shows weak gross-profit conversion on card and stablecoin volume
        - Breaks the case that Slash deserves even a mid-single-digit revenue multiple on current scale.
        - Move to avoid or require a materially lower price.
      - - Customer-base quality is weaker than public framing implies
        - Active, monetizing accounts prove materially below the 5,000-10,000 public language
        - Undercuts both revenue durability and perceived market penetration.
        - Re-underwrite from lower active-customer and cohort assumptions.
      - - Partner concentration lacks credible contingency plans
        - No workable backup plan for Column, Bridge, or related custody/orchestration dependencies
        - Raises platform fragility and operational concentration beyond acceptable limits.
        - Apply a heavier discount or walk away until contingency planning improves.
      - - Stablecoin regulation forces product or disclosure changes
        - USDSL/global-dollar economics or customer eligibility narrow materially under evolving rules
        - Weakens a key differentiator and may reduce growth expectations.
        - Cut the bull-case weighting and lower the multiple band.
      - - Cap-table overhang is punitive
        - Liquidation preferences, participation, or ratchets absorb too much upside
        - Enterprise value stops translating into attractive common-equity returns.
        - Require different terms, a lower price, or a structured entry.
      - - Management cannot close the disclosure gap in diligence
        - No audited statements, no revenue bridge, and no cohort or burn data emerge in the room
        - Confirms that public opacity is not temporary but structural.
        - Keep the recommendation at research-more / track or exit the process.
    notes: >-
      Triggers are designed to be observable in a real diligence process. They translate an abstract valuation debate
      into explicit stop-or-go conditions.
    claimRefs:
      - CV031
      - CV032
      - CV035
      - CV036
      - CV039
      - CV040
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Audited financials and revenue bridge
        - 2025-2026 audited revenue, gross profit, product mix, and profitability definitions
        - This is the core blocker to a high-confidence valuation and to interpreting the $250M-$300M run-rate claims.
        - CFO / finance room request tied to audit packs and board materials.
      - - Cashback and partner-economics bridge
        - Rewards expense, chargeback/fraud loss, sponsor-bank sharing, and stablecoin partner fees by product line
        - >-
          The business can look cheap on revenue and still be expensive on gross profit if incentives and partner costs
          are heavy.
        - Finance + payments ops; request cohort margin bridge and partner contracts.
      - - Customer-definition reconciliation
        - Active, paying, high-volume, and total-account counts, plus concentration by top cohorts
        - The 5,000+ versus 10,000+ language is not valuation-grade until account definitions are explicit.
        - RevOps / finance; reconcile dashboard metrics to investor materials.
      - - Cap table and liquidation waterfall
        - Preference stack, participation rights, ratchets, convertibles, and any senior claims
        - Headline enterprise value can overstate equity attractiveness if the waterfall is crowded.
        - Legal diligence; review charter, investor-rights agreements, and financing schedules.
      - - Liquidity and runway
        - Cash balance, monthly burn, contingency plans, and minimum liquidity thresholds after Series C
        - Investors cannot infer liquidity comfort from a fresh round alone.
        - Finance and board materials; request runway model and downside scenarios.
      - - Stablecoin and partner-risk governance
        - >-
          Live agreements, contingency plans, and compliance workstreams for Column, Bridge, Layer2, and wallet
          providers
        - A meaningful part of the growth story now depends on partner and regulatory execution, not just demand.
        - COO / GC / partnerships; request operating playbooks and latest legal reviews.
    notes: >-
      These asks are ordered by how directly they change price support. Items 1-4 are underwriting blockers; items 5-6
      determine whether the differentiated growth story deserves a smaller or larger discount.
    claimRefs:
      - CV010
      - CV013
      - CV016
      - CV031
      - CV036
      - CV042
