  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer segmentation
        blocks:
          - type: paragraph
            body: >-
              Slash sits in a crowded landscape, but the overlap is not symmetric. The closest horizontal fintech
              competitors are Mercury, Ramp, and Brex, all of which pitch a broader finance operating stack to
              venture-backed or growth-oriented companies. Mercury now spans cards, invoicing, bill pay, spend
              management, insights, and a charter path; Ramp goes further into procurement, travel, and accounting
              automation; and Brex is now backed by Capital One scale. A second competitive layer is mainstream SMB
              simplifiers: Bluevine and Relay focus on operating accounts, cash-flow clarity, and payments for ordinary
              small businesses, while Found and Novo target self-employed owners and independent businesses with
              bookkeeping, tax, or no-fee simplicity. Chase is the incumbent benchmark because it bundles checking, card
              acceptance, financing adjacency, and branch access. The status-quo substitute is still a stack rather than
              a single rival: incumbent checking, a spend tool, and accounting or invoicing software. Slash is
              differentiated because it adds stablecoin rails, treasury, AI, and industry-shaped workflows to that
              stack, but it also means buyers can compare it to several competitor classes at once rather than to one
              obvious peer set.
