      - number: '4.3'
        title: Capital Adequacy, Partner Dependence, and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              Closed financing is visible even though current liquidity is not. Slash publicly raised $41 million in
              Series B at a $370 million valuation and then $100 million in Series C at a $1.4 billion valuation, taking
              cumulative disclosed capital to more than $160 million. Management framed the latest round as fuel for
              broader product and market expansion, especially Twin and AI-led workflow automation, not as a response to
              an obvious balance-sheet squeeze. That can support a positive reading: Slash appears more asset-light than
              a lender because its card balances settle daily and its working-capital product appears partner-originated
              through Lead Bank rather than held on Slash's own balance sheet. But capital intensity is still real. The
              company subsidizes rewards, waives domestic transaction fees for Pro users, and depends on partner
              infrastructure across Column for banking, Atomic for treasury, Bridge and Layer2 for stablecoin services,
              and Lead Bank for working capital. Treasury balances are not simply extra deposits on a bank balance
              sheet; legal footnotes say the product sits in a broker-dealer or advisory structure that is not FDIC
              insured and can lose value. Stablecoin services have a separate disclaimer stack, including non-insurance,
              irreversibility, and no Slash guarantee of reserves. Those disclosures mean the main capital-adequacy risk
              is not disclosed credit losses so much as multi-partner operational and trust dependency layered on top of
              fast growth. Because Slash discloses no cash, burn, or runway, the committee can only say that the funding
              backdrop is supportive, not that liquidity is comfortable.
