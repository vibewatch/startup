      - number: '6.3'
        title: Satisfaction, support, and retention signals
        blocks:
          - type: paragraph
            body: >-
              Public satisfaction signals are directionally good but not deep enough to substitute for retention
              disclosure. The archived Trustpilot snapshot rates Slash at 4.9 out of 5 from 369 customers and the
              extracted reviews are mostly positive about ease of use, virtual cards, cashback, same-day money movement,
              and responsive support. Those reviews also suggest the product is most naturally adopted by online-first
              operators, not by branch-oriented small businesses. Still, the review evidence is incomplete. The fetched
              G2 page was JS-blocked, so verified B2B-review depth could not be independently checked in this run, and
              the BBB complaints page was reachable only at a generic shell level without exposing Slash-specific
              complaint counts in the extracted text.


              Durability evidence is thinner still. No reviewed public source disclosed NRR, GRR, logo churn, renewal
              rate, or standard contract length. The best stickiness signals are indirect: a reviewer claiming to have
              used Slash since 2023, the growing stablecoin volume described by Bridge, and the fact that Slash keeps
              layering cards, treasury, working capital, Global USD, and Twin onto the same account relationship.
              Support and exit friction are also real diligence topics. Slash's own help center says closure is not
              self-service, requires all balances and authorizations to clear, can be paused by disputes, and usually
              takes three to five business days. For a platform serving high-velocity money movement customers, that
              means support quality and exception handling are part of the retention story even if the company does not
              publish retention metrics.
