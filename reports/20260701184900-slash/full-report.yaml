      - number: '8.2'
        title: 'Comparable framework: the multiple is not crazy, but the discount belongs elsewhere'
        blocks:
          - type: paragraph
            body: >-
              The cleanest public lens on Slash is a multiple framework anchored on scale and disclosure quality, not on
              a DCF. On the surface, Slash does not look obviously expensive. A $1.4 billion valuation against public
              revenue proxies of $250 million to $300 million annualized implies roughly 4.7x to 5.6x revenue. That is
              below Mercury's disclosed roughly 8x annualized-revenue multiple and far below Ramp's 32x-plus ratio. But
              that gap is not free upside. Mercury disclosed 300,000-plus customers, four consecutive years of GAAP
              profitability, and an OCC conditional charter approval. Ramp disclosed free cash flow, $100 billion-plus
              purchase volume, and a much more software-heavy financial-operations stack. Both peers are more legible
              than Slash on the exact qualities that determine whether a multiple deserves to expand.


              The broader comp set reinforces the same point. Brex's $5.15 billion sale to Capital One shows that a
              strategic acquirer will pay for integrated spend infrastructure, but it also places that asset inside a
              public bank with SEC reporting and deep underwriting capacity. Bluevine, Relay, Novo, and Found show how
              much bigger SMB-fintech account bases can get, but their cited public materials are better for relative
              scale and customer-segment framing than for direct multiple work. The right conclusion is that Slash's
              current headline multiple can be defended directionally, yet only after applying a meaningful discount for
              under-disclosure, partner concentration, and the fact that its revenue is more payments-and-incentives
              exposed than a pure software ARR stream.
