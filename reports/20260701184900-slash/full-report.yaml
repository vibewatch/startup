            body: >-
              The public architecture points to Slash as an orchestration layer sitting above regulated bank rails and
              specialized external providers. Column is the visible bank and card issuer. Sweep coverage depends on
              network-bank allocation logic. Stablecoin and Global USD flows depend on Bridge, Layer2, and Alchemy to
              make on-chain balances look bank-like, while treasury runs through Atomic and working-capital offers route
              through Slope and Lead Bank. That dependency map matters because Slash’s value proposition is workflow
