      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The real market is software-led business finance, not just checking accounts
            body: >-
              Slash competes where the business bank account becomes the control plane for cards, approvals, accounting,
              treasury, and cross-border money movement. That makes the relevant market closer to an SMB financial
              operating system than to a stand-alone online checking product.
            calloutType: insight
