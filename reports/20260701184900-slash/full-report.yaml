      - number: '1.3'
        title: Infrastructure, Compliance, and Customer Risk Surfaces
        blocks:
          - type: paragraph
            body: >-
              Slash's differentiation depends on external infrastructure. Column N.A. provides core bank and card rails;
              IntraFi-style sweep partners underpin the “hundreds of millions” FDIC-coverage story; Atomic powers
              treasury; and Bridge, Layer2, and Alchemy enable stablecoin issuance, custody flows, gasless transactions,
              and Global USD mechanics. That architecture gives Slash product breadth without a charter, but it also
              concentrates diligence on partner contracts, reconciliation controls, and contingency planning. The
              company's own disclosures are explicit that digital assets are not bank deposits, not FDIC or SIPC
              insured, may be irreversible, and rely on third-party issuers and custodians. Operationally, account
              closure is manual and the terms let Slash or financial-institution partners suspend or close accounts for
              compliance or prohibited-activity reasons. Public sentiment is net positive on Trustpilot, but the BBB
              complaints page and competitor critiques on FX and daily settlement show friction is not imaginary.
              Synapse remains the cautionary sector backdrop: when ledgers and partner-bank responsibilities break,
              users can lose access to money for weeks.
