      - number: '3.4'
        title: Moat durability, switching costs, and strategic outlook
        blocks:
          - type: paragraph
            body: >-
              Slash's moat is real but conditional. It is strongest where a business wants business checking, cards,
              treasury, cross-border settlement, and automation inside one workflow, especially when the business is too
              niche or too crypto-adjacent for a mainstream bank to prioritize. The company's public revenue scale
              against a small customer base implies it is monetizing intensity rather than ubiquity, which is hard for
              low-fee peers to mimic quickly. But the same asymmetry creates fragility. A narrow customer base can
              churn, partner-bank and stablecoin rules can change, and rewards-heavy monetization may be harder to
              sustain if spend mix deteriorates or exclusions expand. Switching costs are moderate rather than absolute:
              once a company has cards, payouts, bill pay, integrations, treasury rules, and possibly stablecoin flows
              configured, moving is painful, yet many buyers can still multi-home or revert to a broader brand if their
              needs become more mainstream. Mercury's charter path, Ramp's finance-suite breadth, Bluevine and Relay's
              mainstream SMB reach, Found and Novo's self-serve simplicity, and Chase's branch-and-credit trust each
              attack a different weakness in Slash's position. The strategic question is whether Slash can keep
              expanding vertical workflows faster than horizontal players absorb the same capabilities.
