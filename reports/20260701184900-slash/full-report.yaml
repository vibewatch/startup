    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation starts with real scale, then discounts for opacity, partner complexity, and limited margin of
      safety at the current mark.
    data:
      nodes:
        - id: scale
          label: Commercial proof
          detail: 250M-300M annualized revenue proxies, 30B+ annualized payment volume, 1B+ stablecoin volume.
        - id: price
          label: Headline price
          detail: $1.4B Series C after a $370M Series B.
        - id: opacity
          label: Disclosure gap
          detail: No audited margin, burn, cohort, or cap-table bridge.
        - id: risk
          label: Risk stack
          detail: Customer-count tension, cashback economics, and partner/regulatory concentration.
        - id: result
