  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Slash is monetized through more than one obvious rail, and that is both a strength and a modeling
              challenge. Official pricing makes the customer menu relatively legible. The company sells a Free plan and
              a $25-per-month Pro plan, charges transaction fees on the Free tier for same-day ACH, domestic wires,
              RTP/FedNow, and international wires, and layers uncapped cashback on top of a daily-settling charge card.
              Independent and partner sources add the rest of the structure: Sacra says Slash also earns on crypto
              conversion and off-ramp activity, while official treasury and stablecoin pages make clear that Slash
              participates in yield and global-payments workflows rather than limiting itself to deposits and cards. The
              result is a blended revenue model spanning interchange or spend-linked economics, plan fees, payment-rail
              fees, treasury spread, stablecoin conversion, and partner-originated working-capital adjacency. What
              remains missing is the mix. Public sources do not say which of these rails actually drives revenue, gross
              profit, or retention, so the chapter can map mechanisms and list pricing but cannot yet reconcile them to
              a clean revenue-recognition or margin bridge.
