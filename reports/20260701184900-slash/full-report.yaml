      - number: '8.4'
        title: Diligence asks, thesis-break triggers, and the final stance
        blocks:
          - type: paragraph
            body: >-
              The final recommendation should stay thoughtful and conditional rather than promotional. Slash may be
              building something unusually valuable: high-volume businesses, a differentiated stablecoin-enabled global
              account, AI-native workflow tooling, and a revenue engine that appears unusually dense per customer. But
              every attractive part of that story has a paired diligence burden. Investors still need an audited revenue
              and gross-profit bridge, evidence that cashback and interchange economics remain durable after partner
              sharing and fraud costs, and a reconciled customer-count definition that tells the committee how many of
              those businesses are active and monetizing today. They also need to see whether the capital stack contains
              preferences or dilution overhang that make a $1.4 billion enterprise headline less attractive on an
              equity-return basis.


              Those unknowns drive the kill triggers. If a diligence room shows weak margins after rewards, partner
              dependence without credible contingency planning, or a much smaller active customer base than the
              10,000-plus website framing implies, the current mark looks stretched. If instead diligence shows
              Mercury-like profitability discipline, limited concentration, and cleaner economics than the public record
              suggests, the same mark can look fair. Until that evidence exists, the right stance is research-more /
              track with medium confidence: keep Slash in the funnel, respect the growth, but insist on better evidence
              or better price before calling it a buy.
