      - number: '3.2'
        title: Product stack, pricing, yield, and monetization differences
        blocks:
          - type: paragraph
            body: >-
              The product and pricing comparison shows why Slash can support a very different economic profile from
              mass-market SMB banking. Slash publicly sells a free plan and a $25 per month Pro plan, publishes 1.5% and
              2% cashback tiers, keeps unlimited virtual cards in the base proposition, and layers treasury plus native
              stablecoin payments on top. Mercury is more transparent and laddered than many startup banks, with $0,
              $29.90, and $299 packages plus treasury unlocked at $250,000 balances. Ramp prices the core software stack
              at $0 before moving to paid per-user and enterprise plans, which supports a wide funnel into its
              higher-value automation products. Brex starts at $0 per user and adds paid features at $12 per user while
              monetizing a deeper banking and treasury stack now connected to Capital One. Bluevine monetizes via APY
              tiers, payments, subscriptions, and float; Found monetizes through free-to-paid self-employed plans with
              APY and cashback; Novo uses no-fee positioning with a balance-based cashback hook; and Chase charges
              explicit monthly checking fees unless activity or balances waive them. The important asymmetry is that
              Slash does not need Mercury- or Bluevine-scale account counts to produce meaningful revenue if it keeps
              winning high-spend niches that use cards, treasury, and stablecoins intensely.
