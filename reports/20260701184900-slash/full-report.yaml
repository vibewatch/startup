      - number: '7.3'
        title: Partner and business-model concentration risk
        blocks:
          - type: paragraph
            body: >-
              Slash's upside and fragility both come from the same design choice: it is an orchestration layer over
              specialized partners rather than a vertically integrated bank. Column anchors accounts and cards; IntraFi
              and sweep-network logic expand insurance coverage; Bridge, Layer2, and Alchemy make Global USD and USDSL
              feel bank-like; Atomic wraps treasury; and other partner chains handle working capital. That architecture
              can accelerate feature velocity, but it also means partner outages, regulatory changes, or strategic
              repricing can hit customer experience even when Slash itself did not directly fail. The Synapse episode
              matters here as a cautionary analogy, not because Slash is known to share Synapse's facts, but because the
              case shows how recordkeeping and responsibility gaps in bank-fintech stacks can produce customer harm
              quickly.


              There is also model concentration. Slash's value proposition depends on high-volume, digital-first
              operators who like uncapped cashback, fast money movement, and stablecoin rails. That can be lucrative,
              yet it ties durability to interchange economics, fraud discipline, and customers whose operating patterns
              are more concentrated than the average small-business bank base. Airwallex's critique is useful precisely
              because it is commercially motivated: it shows where Slash is strongest and where its USD-centric,
              daily-settlement structure is a poor fit.
