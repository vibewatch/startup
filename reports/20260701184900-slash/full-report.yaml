chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Origin Story, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Slash is best understood as a San Francisco fintech and business-banking platform rather than as a bank.
              Its own legal and security pages say deposit and card services are provided by Column N.A., while Slash
              layers software, treasury, stablecoin rails, and AI on top. The origin story is messy in a useful way:
              official April 2026 fundraise materials say the company was founded in 2021, while Y Combinator,
              TechCrunch, Founded, and TNW place the real origin in 2020 during the pandemic before YC S21. The fairest
              reading is that Victor Cardenas and Kevin Bai started building in 2020 and the public-facing Slash launch
              crystallized in 2021. The first wedge was sneaker resellers and sole proprietors; after that niche broke,
              Slash pivoted into vertical banking for higher-volume digital businesses. In 2026 the company markets a
              broader stack that includes business banking, charge cards, treasury, stablecoin payments, accounting
              automation, API access, and Twin.
