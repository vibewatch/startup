  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Slash should be analyzed inside U.S. small-business and solopreneur business banking, spend management,
              and finance-workflow software rather than consumer neobanking. The relevant buyer is a business owner,
              operator, or finance lead who needs a primary operating account, cards, transfers, controls, accounting
              sync, and sometimes cross-border rails. That is why Slash markets one platform spanning checking,
              treasury, partner-originated working capital, corporate cards, spend controls, stablecoins, and accounting
              automation, while competitors like Ramp, Brex, Bluevine, Found, Novo, and Mercury all frame the category
              around running a business, not around household budgeting. Included spend therefore covers business
              checking balances, treasury balances, payment flows, card spend, AP-related money movement,
              bookkeeping/close tooling, and cross-border settlement. Excluded spend includes personal checking,
              consumer debit and P2P wallet behavior, retail investing, mortgages, and other consumer-finance pools that
              do not map to Slash's product or underwriting posture. The status quo substitute is usually a stack:
              incumbent bank account, card program, accounting software, invoicing or AP tools, and sometimes a separate
              crypto or FX workflow. Slash's U.S.-registered-business eligibility rules reinforce that this is a
              compliance-heavy SMB operating-finance market, not a mass-market consumer app category.
