      - number: '7.2'
        title: Operational, fraud, and support-control risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Slash is serving exactly the kinds of workflows that become painful when controls are thin:
              fast payouts, high card velocity, cross-border flows, stablecoin transfers, and a customer base that
              includes crypto-adjacent and digitally native operators. Treasury's 2026 money-laundering assessment and
              FinCEN's 2026 AML proposal both emphasize AI-enabled scams, digital-asset misuse, higher-risk customers,
              and the need to direct resources toward the riskiest activities. Slash's own prohibited-activities policy
              and KYC/KYB materials show that management recognizes those risks, but public evidence still stops well
              short of disclosing loss rates, suspicious-activity reporting volumes, manual-review intensity, or
              dispute-resolution performance.


              Customer-friction evidence is also mixed rather than catastrophic. Trustpilot text that is publicly
              visible is mostly positive on routine support and ease of use, yet BBB complaints create a separate
              adverse signal, and Slash's own closure article confirms that account closure is manual, support-mediated,
              and can be delayed by disputes or investigations. The company publishes real trust signals such as SOC 2
              Type II, PCI DSS, MFA, and audit logs, but those are framework indicators, not proofs that fraud
              operations, incident response, or exception handling scale cleanly with the payment volume the company now
              advertises.
