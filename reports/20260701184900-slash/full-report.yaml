    company first found traction with sneaker resellers and sole proprietors before pivoting toward larger, verticalized
    businesses. By April 2026 it had raised a $100 million Series C at a $1.4 billion valuation, but the company still
    discloses far less about margins, controls, and partner economics than its growth profile suggests.
