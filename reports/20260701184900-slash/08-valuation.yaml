- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Public scale anchor
  - Valuation / multiple anchor
  - Relevance to Slash
  - Limitation
  enumerationScope:
    coverage: partial
    basis: 'Rows capture the most decision-useful public private-fintech references surfaced in this run: Slash itself, disclosed high-scale peers, and lower-price SMB banking references. It is not an exhaustive census of every fintech or public-market payments comp.'
  rows:
  - - Slash current mark
    - 250M-300M public annualized revenue proxies; 5,000+ to 10,000+ businesses; $30B+ annualized payment volume
    - $1.4B Series C; ~4.7x-5.6x on public run-rate revenue
    - Direct anchor for current entry discipline.
    - Revenue-quality, profitability, and active-customer definitions are under-disclosed.
  - - Mercury
    - 300,000+ customers; $650M annualized revenue; four years of GAAP profitability
    - $5.2B Series D; ~8.0x annualized revenue
    - Best disclosed private SMB-banking multiple anchor in the cited set.
    - Much broader customer base, stronger disclosure, and charter progress make it a premium-quality reference, not a like-for-like comp.
  - - Ramp
    - 50,000+ customers; >$1B annualized revenue; >$100B annualized purchase volume
    - $32B valuation; ~32x annualized revenue
    - Bull-case ceiling for a finance-software hybrid premium.
    - Far more software-like, broader, and more profitable than public Slash evidence can prove today.
  - - Brex / Capital One
    - 25,000+ Brex companies; Capital One at public-bank scale with SEC reporting
    - $5.15B announced acquisition value for Brex
    - Shows strategic value for integrated spend infrastructure.
    - Transaction value is M&A-specific and sits inside a much larger public-bank platform.
  - - Bluevine
    - 1M+ lifetime small-business customers; >$2B on deposit; >$17B financing delivered
    - Valuation not disclosed in the cited source
    - Useful scale benchmark for mass-SMB banking breadth.
    - Public source is stronger on customer and deposit scale than on price or revenue multiple.
  - - Relay
    - 150,000+ small businesses; $1.3B managed deposits; revenue on track to 3.2x by end-2026
    - $50M growth investment disclosed; valuation not disclosed here
    - Useful benchmark for operational-SMB banking scale.
    - No clean revenue multiple disclosed in the cited materials.
  - - Found
    - 64M self-employed TAM focus; all-in-one banking, bookkeeping, and taxes
    - $50M Series C at >$400M valuation
    - Frames the lower-price, solopreneur end of SMB-fintech.
    - Different customer type and no cited public revenue figure.
  - - Novo
    - 250,000+ independent businesses
    - Valuation not disclosed in the cited source
    - Shows how much broader a generalist independent-business account base can get.
    - No cited revenue or valuation anchor, so it is a segment benchmark rather than a pricing comp.
  notes: This comp sheet intentionally mixes multiple anchors and relative-scale references because only some peers disclose both valuation and revenue. The goal is discipline, not false precision.
