  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: gross-margin-after-cashback
    missingEvidence: Audited gross margin, rewards expense, fraud and chargeback cost, and partner-sharing economics by product line.
    whyItMatters: The current valuation can look fair on revenue while still being stretched on gross profit if incentives and partners consume too much of the economics.
    diligencePath: Request audited product-level margin bridge plus sponsor-bank and stablecoin partner economics in the finance room.
    relatedQuestionRefs:
    - QV031
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cash-runway-and-burn
    missingEvidence: Cash balance, monthly burn, downside cash needs, and minimum liquidity thresholds after the Series C.
    whyItMatters: A large round reduces financing pressure, but investors still cannot infer liquidity comfort or future dilution risk without cash and burn data.
    diligencePath: Obtain runway model, board liquidity pack, and downside scenario analysis from finance.
    relatedQuestionRefs:
    - QV032
    relatedTableRefs:
    - TV006
  - type: conflicting-data
    severity: material
    topic: customer-count-definition
    missingEvidence: Reconciled active, paying, and total-account counts explaining the 5,000-plus versus 10,000-plus public language.
    whyItMatters: Customer-definition tension reduces confidence in cohort quality, revenue durability, and any revenue-per-customer inference.
    diligencePath: Request a metric dictionary plus the exact KPI screenshots or investor charts that produced each public figure.
    relatedQuestionRefs:
    - QV033
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: liquidation-waterfall
    missingEvidence: Cap table, preference stack, ratchets, and any senior claims that affect common-equity economics.
    whyItMatters: A headline enterprise valuation can materially overstate the returns available to a new investor if the waterfall is crowded or asymmetric.
    diligencePath: Review charter, investor-rights agreements, financing schedules, and any debt or structured-equity instruments with counsel.
    relatedQuestionRefs:
    - QV034
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table coverage
    missingEvidence: More clean public revenue-plus-valuation disclosures for private SMB-banking peers and any directly comparable secondary marks.
    whyItMatters: The current comp table is decision-useful but still mixes direct multiple anchors with scale-only references because the market does not disclose enough like-for-like data.
    diligencePath: Augment the table with management-provided private-peer decks, secondary marks, or banker comp sheets if the process advances.
    relatedQuestionRefs:
    - QV024
    relatedTableRefs:
    - TV004
