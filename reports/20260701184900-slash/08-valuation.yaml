- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - 'THESIS: Slash has genuine scale, not just a venture narrative.'
    - Series C materials support $250M+ annualized revenue, $30B+ annualized payment volume, and $1B+ annualized stablecoin volume.
    - Audited statements or a strong data room would strengthen this from momentum proof to underwriting proof.
  - - 'THESIS: The business may deserve above-average monetization because its customers are high-volume and high-intensity.'
    - Sacra's $3B+ card-spend and roughly 5% implied yield framing suggest unusually high revenue per business customer.
    - Cohort retention, gross margin, and rewards-burden data would confirm whether the intensity is durable or promotional.
  - - 'THESIS: Product breadth is expanding fast enough to matter.'
    - Twin, Global USD, stablecoin rails, treasury, and accounting workflows suggest a broader financial operating system.
    - Evidence that these products drive monetization and reduce churn would move the story closer to a software-like premium.
  - - 'ANTI-THESIS: Public customer and profitability language is not valuation-grade disclosure.'
    - Slash uses both 10,000+ and 5,000+ customer figures, and TechCrunch's profitability note has no public accounting bridge behind it.
    - A reconciled active-customer definition and audited profitability bridge would remove this objection.
  - - 'ANTI-THESIS: Stablecoin and partner complexity deserve a discount.'
    - Column, Bridge, Layer2, Alchemy, and smart-wallet infrastructure all sit inside the product experience, adding concentration and rule-change risk.
    - Contingency plans, compliance readiness, and partner economics would reduce the discount.
  - - 'ANTI-THESIS: The current price offers limited margin of safety.'
    - At roughly 4.7x-5.6x public run-rate revenue, Slash is not clearly overvalued, but it is also not priced low enough to compensate for open gaps.
    - Either a lower entry price or better private data would improve the setup materially.
  notes: The anti-thesis is valuation-specific, not product-denial. The question is whether today's price is attractive relative to what the market still cannot verify.
