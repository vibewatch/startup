  - CV032
  - CV035
  - CV036
  - CV039
  - CV040
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Audited financials and revenue bridge
    - 2025-2026 audited revenue, gross profit, product mix, and profitability definitions
    - This is the core blocker to a high-confidence valuation and to interpreting the $250M-$300M run-rate claims.
    - CFO / finance room request tied to audit packs and board materials.
  - - Cashback and partner-economics bridge
    - Rewards expense, chargeback/fraud loss, sponsor-bank sharing, and stablecoin partner fees by product line
    - The business can look cheap on revenue and still be expensive on gross profit if incentives and partner costs are heavy.
    - Finance + payments ops; request cohort margin bridge and partner contracts.
  - - Customer-definition reconciliation
    - Active, paying, high-volume, and total-account counts, plus concentration by top cohorts
    - The 5,000+ versus 10,000+ language is not valuation-grade until account definitions are explicit.
    - RevOps / finance; reconcile dashboard metrics to investor materials.
  - - Cap table and liquidation waterfall
    - Preference stack, participation rights, ratchets, convertibles, and any senior claims
    - Headline enterprise value can overstate equity attractiveness if the waterfall is crowded.
    - Legal diligence; review charter, investor-rights agreements, and financing schedules.
  - - Liquidity and runway
    - Cash balance, monthly burn, contingency plans, and minimum liquidity thresholds after Series C
    - Investors cannot infer liquidity comfort from a fresh round alone.
    - Finance and board materials; request runway model and downside scenarios.
  - - Stablecoin and partner-risk governance
    - Live agreements, contingency plans, and compliance workstreams for Column, Bridge, Layer2, and wallet providers
    - A meaningful part of the growth story now depends on partner and regulatory execution, not just demand.
    - COO / GC / partnerships; request operating playbooks and latest legal reviews.
  notes: These asks are ordered by how directly they change price support. Items 1-4 are underwriting blockers; items 5-6 determine whether the differentiated growth story deserves a smaller or larger discount.
