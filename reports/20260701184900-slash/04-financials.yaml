- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Current public substitute
  - Why the gap matters
  - Exact diligence path
  - Severity
  rows:
  - - Standalone audited financial statements
    - Top-line claims in press releases and one TechCrunch profitability quote
    - Without audited statements, revenue quality, expense classification, and cash balances cannot be trusted for underwriting
    - Obtain FY2024-FY2025 audited financials plus 2026 management accounts and notes
    - blocking
  - - Cash balance, monthly burn, and runway
    - Round history and investor appetite
    - A company can be well funded historically and still tight on cash today
    - Request monthly treasury bridge, covenant package, and 12-month runway model
    - blocking
  - - Profitability definition
    - TechCrunch says profitable
    - The underwriting conclusion changes meaningfully if profitable means gross profit versus EBITDA or cash flow
    - Request the internal metric definition and the P&L bridge supporting it
    - material
  - - Gross margin and net take rate
    - Public payment volume, card spend, cashback rates, and conversion-fee estimates
    - Top-line growth is not enough to judge durability if sponsor-bank, rewards, and partner costs absorb the margin
    - Request product-level gross margin and net take-rate disclosures
    - material
  - - Partner economics across Column, Atomic, Bridge, Layer2, and Lead Bank
    - Public product disclosures and legal disclaimers
    - Partner-revenue sharing determines whether Slash captures the upside or mainly passes through third-party economics
    - Request every major partner commercial agreement and revenue-share schedule
    - material
  - - Customer definition and cohort retention
    - 5,000 versus 10,000 customer framing
    - ARPU, CAC efficiency, and retention inference are unreliable without a canonical denominator
    - Request active, paying, and cumulative customer definitions plus cohort retention tables
    - minor
  notes: Every row is a disclosure blocker rather than a data nicety. The issue is not lack of growth signals but lack of underwrite-grade financial visibility.
