company:
  name: Slash
chapter:
  number: 4
  title: Financials
  summary: 'Slash has visible monetization breadth and real scale, with public evidence for a jump from $150 million annualized revenue in late 2025 to roughly $250 million to $300 million annualized in 2026 alongside more than $30 billion in annualized payment volume. The underwriting problem is not traction but opacity: public sources reveal list pricing, cashback mechanics, treasury and stablecoin rails, and funding history, but they do not reveal audited financials, gross margin, burn, runway, net take rate, partner economics, or what management means by profitability.'
sections:
- id: revenue-model-and-pricing
  title: Revenue Model and Pricing Architecture
  body: 'Slash is monetized through more than one obvious rail, and that is both a strength and a modeling challenge. Official pricing makes the customer menu relatively legible. The company sells a Free plan and a $25-per-month Pro plan, charges transaction fees on the Free tier for same-day ACH, domestic wires, RTP/FedNow, and international wires, and layers uncapped cashback on top of a daily-settling charge card. Independent and partner sources add the rest of the structure: Sacra says Slash also earns on crypto conversion and off-ramp activity, while official treasury and stablecoin pages make clear that Slash participates in yield and global-payments workflows rather than limiting itself to deposits and cards. The result is a blended revenue model spanning interchange or spend-linked economics, plan fees, payment-rail fees, treasury spread, stablecoin conversion, and partner-originated working-capital adjacency. What remains missing is the mix. Public sources do not say which of these
    rails actually drives revenue, gross profit, or retention, so the chapter can map mechanisms and list pricing but cannot yet reconcile them to a clean revenue-recognition or margin bridge.'
