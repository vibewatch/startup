      - label: high
        tone: warning
        detail: Depends on Column and sponsor-bank or card-issuing economics.
      - label: medium
        tone: neutral
        detail: Pricing and rewards are public; retained interchange is not.
      - label: Rewards and issuer economics need diligence
        tone: warning
        detail: Cashback generosity can compress margins if partner shares are thin.
    - label: Payment rails and global transfers
      values:
      - label: low
        tone: neutral
        detail: Mainly operating rather than inventory-style exposure.
      - label: medium to high
        tone: warning
        detail: Depends on payment networks, operational controls, and compliance screening.
      - label: medium
        tone: neutral
        detail: List fees are public but usage and cost-to-serve are not.
      - label: Volume does not equal margin
        tone: warning
        detail: Need rail-level gross profit, not just payment-volume headlines.
    - label: Treasury and idle-cash products
      values:
      - label: low
        tone: neutral
        detail: No obvious inventory risk, but balances sit in investment structures rather than plain deposits.
      - label: high
        tone: warning
        detail: Atomic and money-market structures are central to product delivery.
      - label: medium
        tone: neutral
        detail: Headline yields are public; spread retention and AUM are not.
      - label: Spread economics are opaque
        tone: warning
        detail: High quoted yield does not show what Slash earns after pass-through and partner costs.
    - label: Stablecoins and working capital
