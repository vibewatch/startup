tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Public price / economic anchor
  - 2025-2026 scale proxy
  - Revenue quality
  - Diligence ask
  rows:
  - - Card spend / interchange
    - Charge-card spend, virtual-card usage, and spend-linked economics across high-volume businesses
    - 1.5%-2.0% cashback suggests premium-card interchange economics behind the scenes
    - Sacra says >$3B annualized card spend; Slash advertises $100M+ cashback paid out
    - Likely the core monetization rail, but Slash does not disclose retained interchange after rewards and partner shares
    - Request issuer economics, blended interchange, rewards expense, and fraud/chargeback loss by cohort
  - - Subscription plans
    - Free tier and $25/month Pro tier with feature bundling
    - Free $0/month; Pro $25/month
    - Could be meaningful only if a material share of users pay for Pro
    - Cleanest list price, but probably not the main revenue driver on its own
    - Request paid-seat mix, Pro attach rate, and subscription ARR by cohort
  - - Transfer and payment rails
    - Fees on same-day ACH, domestic wires, RTP/FedNow, international wires, and FX-sensitive card usage
    - 'Free tier: $1 ACH, $6 domestic wire, $5 RTP/FedNow, $25 international wire, 1% FX fee'
    - Slash claims >$30B annualized payment volume
    - Visible list pricing, but realized usage and waivers are undisclosed
    - Request rail-level transaction counts, fee revenue, and cost-to-serve by rail
  - - Treasury / yield spread
    - Idle cash placed into money-market structures managed through Atomic
    - Marketing cites up to 3.76%-3.82% annualized yield, with highest rates tied to $500k+ balances
    - No public AUM or average balance disclosure
    - Potentially sticky and margin-positive, but spread retention and customer balance mix are undisclosed
    - Request treasury balances, gross yield, customer pass-through, and Slash retained spread
  - - Stablecoin / global payments
    - USDC, USDT, USDSL, conversion, on/off-ramp, and global dollar access
    - Sacra cites 0.5% USDC and 0.6% USDT conversion fees; Bridge says monetization improved by keeping crypto flows in-platform
    - Bridge says monthly stablecoin volume rose from $5M to $100M within nine months
    - Likely high-growth and strategically differentiated, but partner economics and reserve responsibilities are opaque
    - Request conversion-fee revenue, settlement costs, and Bridge/Layer2 commercial terms
  - - Working-capital financing
    - Short-term financing adjacent to the banking stack with 30/60/90-day terms
    - Official materials disclose availability; legal footnotes say loans are made by Lead Bank and fees vary by risk and term
    - No public volume, approval, or loss data
    - Economically relevant if adoption is meaningful, but current disclosures do not show whether Slash earns referral, servicing, or spread economics
    - Request product agreement, funnel metrics, defaults, pricing, and Slash revenue share
  notes: Rows separate visible customer-facing monetization levers from the largely undisclosed retained economics behind each rail. Stablecoin and working-capital rows are especially partner-dependent.
