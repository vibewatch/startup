- id: TI003
  title: Unit economics table
  columns:
  - Metric / proxy
  - Value
  - Confidence
  - Why it matters
  - What it still does not tell us
  - Diligence ask
  rows:
  - - Annualized revenue trajectory
    - $150M late-2025; $250M-$300M annualized in 2026 public framing
    - Medium
    - Shows strong top-line acceleration and investor appetite
    - No audited revenue or period-end normalization
    - Reconcile the late-2025, $250M, $255M, and $300M figures to one board-approved revenue definition
  - - Annualized payment volume
    - '>$30B'
    - High
    - Shows real money movement at meaningful scale
    - Volume is not margin and may include low-yield flows
    - Request revenue by payment rail and contribution margin by rail
  - - Annualized card spend
    - '>$3B (Sacra)'
    - Medium
    - Anchors card economics and interchange opportunity
    - No disclosed retained interchange after rewards, fraud, or sponsor-bank fees
    - Request gross and net interchange plus rewards burden
  - - Implied revenue yield on card spend
    - ~5% (Sacra estimate)
    - Low to medium
    - Suggests Slash monetizes more than plain checking or generic SMB banking
    - Could mix subscription, payment, and crypto revenue into a spend-based denominator
    - Request a product-by-product revenue bridge rather than an implied blended ratio
  - - Customer count / definition
    - 5,000+ businesses vs 10,000+ entrepreneurs or businesses
    - Medium
    - ARPU and sales-efficiency interpretation depends on the denominator
    - No active-versus-cumulative customer definition
    - Request active, paying, and cumulative customer counts by quarter
  - - Stablecoin traction
    - $5M to $100M monthly in nine months; >$1B annualized
    - High
    - Shows that crypto rails are economically real, not just marketing
    - No disclosed gross profit or partner share from the flow
    - Request stablecoin revenue, settlement cost, and reserve-backed balance data
  - - Cashback burden
    - 1.5%-2.0% public rates; $100M+ paid out
    - Medium
    - Rewards are an economic cost that can materially change gross margin
    - No disclosed rewards expense as share of spend or revenue
    - Request total rewards payout, exclusions, and net margin after incentives
  - - Credit exposure profile
    - Daily settlement lowers receivables risk; working capital appears partner-originated
    - Medium
    - Supports an asset-lighter model than a lender or revolving-card platform
    - Does not reveal financing referral economics or operational loss reserves
    - Request partner product economics, customer usage, and operational loss history
  - - Gross margin / net take rate
    - Undisclosed
    - Low
    - This is the single biggest missing underwriting metric
    - No public view of sponsor-bank, processor, or crypto-partner cost sharing
    - Request gross margin by product rail and net take rate on payment volume
  notes: Most rows are proxies rather than final underwrite metrics. Public evidence is strongest on scale and weakest on retained economics, gross margin, and cost sharing.
