- id: TI004
  title: Capital adequacy table
  columns:
  - Capital item
  - Public anchor
  - Status as of runDate
  - What it funds or signals
  - Confidence
  - Diligence ask
  rows:
  - - Seed + Series A
    - ~$19M in 2023
    - Historical
    - Shows early backing before the major vertical-banking acceleration
    - Medium
    - Request exact round dates, primary versus secondary mix, and liquidation preferences
  - - Series B
    - $41M at $370M valuation
    - Closed in 2025
    - Funding for the post-pivot scale-up and rebrand era
    - High
    - Request cap-table update and the current investor rights stack
  - - Series C
    - $100M at $1.4B valuation
    - Closed in 2026
    - Largest disclosed capital infusion and public proof of investor confidence
    - High
    - Request board materials tying proceeds to hiring, product, and geographic expansion
  - - Cumulative disclosed capital
    - '>$160M total raised'
    - Visible
    - Supportive fundraising backdrop but not a current liquidity measure
    - High
    - Request current unrestricted cash and any debt or minimum-balance covenants
  - - Use of latest proceeds
    - Twin, more industries, more markets, more financial tools
    - Visible but strategic, not quantitative
    - Suggests growth investment rather than emergency recapitalization
    - Medium
    - Request annual budget, headcount plan, and cash-consumption schedule for those initiatives
  - - Current liquidity runway
    - No public cash, burn, or runway disclosure located
    - Undisclosed
    - Primary blocker to judging whether current capital is ample
    - Low
    - Request cash bridge, monthly burn, runway, and downside-case financing plan
  - - Partner-balance-sheet reliance
    - Banking via Column; treasury via Atomic; stablecoins via Bridge/Layer2; financing via Lead Bank
    - Active and material
    - Shows Slash depends on external regulated and technical infrastructure rather than owning the whole stack
    - Medium
    - Request partner agreements, concentration exposure, contingency plans, and termination rights
  notes: This table distinguishes closed capital events from current liquidity visibility. Public funding history is real, but it cannot substitute for an entity-level cash and runway analysis.
