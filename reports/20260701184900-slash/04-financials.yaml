  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: working-capital
    missingEvidence: Unit-level approval, utilization, pricing, default, and fee-share data for the 30/60/90-day working-capital product.
    whyItMatters: Without this, the financing rail cannot be sized or judged as a revenue contributor versus a customer-acquisition perk.
    diligencePath: Request the partner program agreement, funnel metrics, and vintage performance tables from Slash and Lead Bank.
    relatedQuestionRefs:
    - QI011
    relatedTableRefs:
    - TI001
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Entity-level cash balance, monthly burn, liquidity runway, and any board-approved financing plan.
    whyItMatters: Capital adequacy cannot be underwritten from round history alone; current liquidity is the core unanswered question.
    diligencePath: Obtain the latest treasury dashboard, monthly cash bridge, and twelve-month financing plan.
    relatedQuestionRefs:
    - QI016
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Standalone audited financial statements or equivalent reviewed management accounts for FY2024 and FY2025.
    whyItMatters: Audited statements are necessary to validate revenue recognition, expense classification, cash balances, and any profitability claim.
    diligencePath: Request audited FY2024-FY2025 financials plus Q1/Q2 2026 management accounts and footnotes.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI005
  - type: missing-source
    severity: material
    topic: profitability-definition
    missingEvidence: A public or private bridge defining whether profitability means gross profit, EBITDA, net income, or free cash flow.
    whyItMatters: The same word can imply very different underwriting conclusions depending on whether rewards, fraud, and partner fees are above or below the line.
    diligencePath: Request the internal KPI definition used for the TechCrunch profitability statement and the supporting period P&L.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: take-rate-partner-economics
    missingEvidence: Blended interchange retention, transaction take rates, treasury spread retention, and Bridge/Atomic/sponsor-bank revenue-share terms.
    whyItMatters: Without partner economics, the committee cannot tell whether strong top-line growth translates into durable gross profit.
    diligencePath: Request cohort-level revenue mix, gross margin by product rail, and every major partner commercial agreement.
    relatedQuestionRefs:
    - QI019
    - QI022
    relatedTableRefs:
    - TI001
    - TI003
    - TI005
  - type: missing-source
    severity: minor
    topic: customer-definition
    missingEvidence: A canonical active-customer definition split across paying, active, and cumulative business accounts.
    whyItMatters: ARPU and retention analyses are distorted when 5,000 and 10,000 customer counts may be measuring different populations.
    diligencePath: Ask management for monthly active businesses, paying businesses, churn, and cohort revenue retention definitions.
    relatedQuestionRefs:
    - QI006
    relatedTableRefs:
    - TI003
    - TI005
