- id: scale-signals-and-unit-economics
  title: Scale Signals, Unit Economics, and Cashback Tradeoffs
  body: 'The public scale story is strong enough to matter and messy enough to require caution. Slash itself said it crossed $150 million of annualized revenue in late 2025, and its April 2026 fundraise materials moved that framing to $250 million annualized revenue after a jump from $10 million over 24 months. TechCrunch then reported a $300 million annualized revenue claim and added the word profitable, while Sacra estimated approximately $255 million annualized revenue in March 2026. That is directionally coherent but not reconciled. Volume data show the same pattern. BusinessWire and FinTech Global both describe more than $30 billion of annualized payment volume and more than 5,000 business customers, while Slash pricing and marketing surfaces use a much broader 10,000-plus entrepreneur or business framing. Sacra adds more nuance by reporting more than $3 billion of annualized card spend and an implied revenue yield near 5% on that card-spend base. Cashback matters here: Slash promises
    1.5% or 2.0% rewards, advertises more than $100 million paid out, and excludes foreign transactions, chargebacks, refunds, and certain merchants. That combination suggests aggressive gross-revenue capture on high-spend segments, but it also implies a nontrivial rewards burden that public sources do not match with disclosed fraud, chargeback, or sponsor-bank cost sharing. Daily settlement reduces credit loss risk, yet it also reduces customer float and likely narrows the business to operators that value control and speed more than unsecured short-term financing.'
