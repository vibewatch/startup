  title: Pricing / monetization table
  columns:
  - Item
  - Published price / term
  - List vs realized
  - Why it matters
  - Source basis
  - Open issue
  rows:
  - - Free plan subscription
    - $0/month
    - List
    - Shows Slash can grow volume without mandatory software subscription
    - Official pricing and corporate cards pages
    - Need share of customers on Free versus Pro
  - - Pro plan subscription
    - $25/month
    - List
    - Direct recurring revenue layer and the gateway to fee waivers
    - Official pricing and corporate cards pages
    - Need Pro attach rate and renewal behavior
  - - Cashback rate
    - 1.5% Free; 2.0% Pro; custom rates possible
    - List plus negotiated exceptions
    - Rewards drive acquisition and usage intensity but are also a real cost line
    - Rewards terms and corporate cards page
    - Need average realized cashback rate and total rewards expense as % of revenue
  - - Same-day ACH
    - $1 Free; $0 Pro
    - List
    - Low-fee domestic payment rail that matters for heavy operators
    - Official pricing
    - Need actual volume and network cost per transfer
  - - Domestic wire
    - $6 Free; $0 Pro
    - List
    - Important for treasury and supplier workflows
    - Official pricing
    - Need gross fee revenue and waived-fee incidence
  - - RTP / FedNow
    - $5 Free; $0 Pro; Slash caps transfers at $1M even though networks allow more
    - List
    - Signals positioning around faster working-capital movement
    - Official pricing and help center
    - Need adoption rate and support-cost burden
  - - International wire
    - $25 across plans
    - List
    - Cross-border monetization is visible, but the fee is only one part of economics
    - Official pricing and Airwallex review
    - Need corridor mix, settlement costs, and resulting gross margin
  - - Foreign transaction fee
    - 1% with $0.40 minimum
    - List
    - Can offset cross-border card use but also makes Slash less attractive to global operators
    - Official pricing and Airwallex review
    - Need percentage of spend that incurs FX fees
  - - Treasury yield
    - 3.76%-3.82% across current pages; highest legal footnote assumes $500k+
    - Marketing headline, not fixed realized yield
    - Treasury helps retention and spread economics if balances are large
    - Official treasury/yield and legal pages
    - Need actual customer mix, gross yield, and spread retained by Slash
  - - Stablecoin conversions
    - Sacra cites 0.5% USDC and 0.6% USDT conversions
    - Independent estimate
    - Potentially meaningful monetization lever for global and crypto-native customers
    - Sacra company page
    - Need official rate card and revenue share after partner costs
  notes: This table preserves public pricing exactly as disclosed or estimated. List pricing is not realized economics, and several rows depend on customer mix, partner sharing, or negotiated exceptions.
