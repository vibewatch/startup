- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Key dependency
  - Observed risk
  rows:
  - - Web, mobile, and Twin surfaces
    - Collect user intent and expose balances, cards, transfers, and analysis
    - Slash application layer, mobile app, Slack, text channels
    - User trust depends on consistent entitlements and event logging across every surface
  - - Workflow and approval engine
    - Coordinate transfers, card actions, approvals, and audit state
    - Slash internal orchestration plus Flow of Funds concepts
    - Public docs describe abstractions but not the full production topology or failure budgets
  - - API and webhook layer
    - Expose cards, virtual accounts, balances, transfers, and notifications to customer systems
    - Slash API platform and help-center docs
    - Public reference depth may lag the breadth of marketed automation
  - - Banking and card core
    - Hold deposits, issue the charge card, and settle fiat payment rails
    - Column N.A. and Visa
    - Sponsor-bank concentration and unclear historical migration detail remain material
  - - Sweep and deposit-protection layer
    - Distribute balances across network banks for higher insured coverage
    - Column sweep program and IntraFi-linked banks
    - Pass-through coverage depends on correct placement and recordkeeping
  - - Stablecoin and Global USD layer
    - Handle wallets, gas, custody, conversion, and on-chain settlement
    - Bridge, Layer2, Alchemy, and bank handoffs
    - Not FDIC insured and exposed to third-party technical, liquidity, and regulatory change
  - - Treasury, lending, and close integrations
    - Provide yield, short-term credit, and ledger-sync services
    - Atomic, Slope, Lead Bank, QuickBooks, Xero, Sage, Plaid, Yodlee
    - Partner health and integration quality directly affect product completeness
  notes: This is a public-evidence operating model rather than an internal systems diagram; it emphasizes dependency concentration and control boundaries visible from fetched sources.
