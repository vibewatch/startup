- id: architecture-and-partner-stack
  title: Architecture and partner stack
  body: "The public architecture points to Slash as an orchestration layer sitting above regulated bank rails and specialized external providers. Column is the visible bank and card issuer. Sweep coverage depends on network-bank allocation logic. Stablecoin and Global USD flows depend on Bridge, Layer2, and Alchemy to make on-chain balances look bank-like, while treasury runs through Atomic and working-capital offers route through Slope and Lead Bank. That dependency map matters because Slash\u2019s value proposition is workflow unification: one dashboard, one mobile app, one Slack agent, one API surface, and one accounting-close flow across very different financial primitives. The engineering blog adds more credibility than typical fintech marketing because it describes explicit orchestration abstractions, auditability goals, and how instant deposits bridge crypto settlement with ACH-based bank posting. Still, the public file leaves important blanks. It does not fully explain whether any\
    \ middleware or BaaS layer remains between the Slash experience and Column\u2019s core systems, and it does not resolve the exact migration path from earlier Piermont-era arrangements to today\u2019s Column and Visa stack."
