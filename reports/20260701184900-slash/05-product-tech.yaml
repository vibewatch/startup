chapter:
  number: 5
  title: Product & Technology
  summary: "Slash\u2019s public product stack is unusually broad for a private SMB-fintech: core U.S. banking and charge cards sit alongside treasury, stablecoin and Global USD rails, accounting automations, API hooks, and the Twin agent. The stack appears materially real rather than slideware because it is backed by help-center workflows, partner case studies, and an engineering write-up, but it is also heavily partner-dependent on Column, Bridge or Layer2, Atomic, and other external infrastructure. The biggest unresolved diligence questions are the exact middleware and sponsor-bank architecture, the historical Piermont-to-Column transition, and whether Twin and API reliability are as mature operationally as the product surface suggests."
sections:
- id: product-surface-and-workflow
  title: Product surface and workflow
  body: "Slash\u2019s product surface looks more like a finance operating system than a single SMB checking account. The core package starts with U.S. business banking and a charge-card program, but public materials quickly widen into virtual accounts, same-day and real-time transfer rails, treasury, Global USD and stablecoin payments, accounting automation, API hooks, and the Twin AI agent. The breadth is not merely a homepage slogan; it appears across pricing, help-center workflows, integration launch posts, and API navigation. That makes the module map substantively real. It also explains the company\u2019s vertical-banking pitch: Slash is trying to collapse multiple tools that an agency, e-commerce seller, wholesaler, or global contractor-heavy business would otherwise stitch together. The trade-off is packaging complexity. Free and Pro tiers gate different economics, while some of the most differentiated surfaces, such as treasury, working capital, Global USD, and advanced automation,\
    \ rely on separate eligibility paths or partner infrastructure. Buyers are therefore evaluating a bundle, not just a bank account."
