- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow trigger
  - Slash solution
  - Measurable benefit
  - Limitation
  rows:
  - - Open and fund a U.S. business account
    - New incorporated U.S. entity needs operating cash management
    - Business Banking onboarding plus external funding, cards, and transfer rails
    - Reduces tool sprawl for early finance operations
    - Core banking remains U.S.-entity only
  - - Create controlled spend for a vendor or team
    - Need budgeted spend without sharing one physical card
    - Issue virtual cards, set limits, freeze cards, and monitor spend
    - Faster delegation with tighter controls
    - Rewards exclusions reduce value on some common merchants
  - - Send urgent domestic payouts
    - Vendor or payroll-adjacent payment needs instant settlement
    - Use RTP or FedNow from the dashboard
    - Seconds-level delivery and lower urgency cost than wires
    - Recipient-bank participation is required and payments are irrevocable
  - - Move excess operating cash into yield
    - Idle cash sits in checking but needs return with same-day access
    - Use Slash Treasury from the same interface
    - Keeps cash management inside the finance stack
    - Treasury is not FDIC insured and uses external advisers and brokers
  - - Receive or send cross-border dollars
    - Business wants faster global settlement without wire friction
    - Use Global USD, stablecoins, and dashboard conversion workflows
    - Cuts wallet friction and can avoid wire delays
    - Stablecoin flows depend on partners and are outside deposit insurance
  - - Ask finance questions or initiate actions in Slack
    - Owner or operator wants balances, cards, or transfer help in context
    - Use Twin in DM or channel with approval flow backstops
    - Shortens time from question to action
    - Setup requires admin steps and public uptime evidence is thin
  - - Close the books with cleaner transaction data
    - Controller wants faster categorization and ledger sync
    - Use accounting mappings, splits, and direct integrations
    - Less manual reconciliation and faster month-end close
    - Public docs are stronger on supported paths than on edge-case failure handling
  notes: Benefits are workflow-level and mostly company-claimed; the table distinguishes practical operating wins from the external dependencies and limitations that can still interrupt them.
