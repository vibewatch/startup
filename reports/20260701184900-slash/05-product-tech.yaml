- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / quality signal
  - Status
  - Scope
  - Gap
  rows:
  - - RBAC and approval workflows
    - Clearly described
    - Twin and dashboard actions share user entitlements and approval rules
    - No public error-rate or bypass-testing evidence
  - - Event logging for agent actions
    - Publicly claimed
    - Slack-originated Twin actions are supposed to land in the Slash event log
    - Need sample logs or audit-trail retention detail
  - - MFA, fraud monitoring, SOC 2, and PCI positioning
    - Marketed as core plan features
    - Applies to the general product surface and account access posture
    - No fetched audit report or control-scope detail
  - - KYC or KYB and product eligibility controls
    - Explicitly documented
    - Core U.S. banking, Global USD country screening, and company-document collection
    - Exact review SLAs and denial reasons remain opaque
  - - Deposit-protection disclosures
    - Explicitly documented
    - Column sweep program and pass-through FDIC conditions for checking balances
    - Treasury and stablecoin balances sit outside that protection
  - - Rewards and merchant exclusions
    - Explicitly documented
    - Cashback rules, non-rewards merchants, and net-25 payout timing
    - Creates visible value leakage for some high-volume merchants
  - - Account closure and support handling
    - Explicitly documented with independent adverse surface
    - Support-mediated closure, BBB complaints page, and review-site onboarding friction
    - Manual operations remain a real customer-experience dependency
  notes: Control rows mix formal product controls with customer-facing operational guardrails because both shape the real trust profile a finance team experiences after go-live.
