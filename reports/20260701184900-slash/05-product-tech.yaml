tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Current status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Business Banking checking
    - Operators and finance teams
    - Shipped core product
    - One dashboard for ACH, wires, RTP or FedNow, cards, and analytics
    - Need public service-level and outage-history detail
  - - Slash Platinum charge card
    - Owners, finance leads, spend managers
    - Shipped core product
    - Daily-payoff charge card with unlimited virtual cards and merchant controls
    - Need clearer public explanation of any debit-card legacy versus current charge-card stack
  - - Virtual accounts and subaccounts
    - Controllers and multi-entity teams
    - Clearly marketed feature
    - Distinct money pools plus ACH authorization and auto-transfer workflows
    - Need hard limits, reconciliation semantics, and entitlement boundaries
  - - Slash Treasury
    - Cash managers with Pro plans
    - Live but partner-routed
    - Yield and same-day liquidity embedded in the banking surface
    - Need current yield grid and exact fund-option disclosures by balance tier
  - - Stablecoin and Global USD
    - Cross-border operators and non-U.S. businesses
    - High-growth but partner-dependent
    - On-chain dollar access without wallet-management UX
    - Need clearer public boundaries on insurance, geography, and failure handling
  - - Twin AI agent
    - Owners, admins, and cardholders inside Slack or text
    - Live with gated rollout mechanics
    - Natural-language card, transfer, and analysis workflows tied to approvals
    - Need uptime, audit, and rollback evidence beyond feature docs
  - - API and webhook layer
    - Developers and finance automation teams
    - Documented but still product-led
    - Card, virtual-account, balance, and webhook workflows exposed through one surface
    - Need deeper public reference coverage and error-budget detail
  - - Accounting automation
    - Controllers and bookkeepers
    - Live and increasingly broad
    - QuickBooks, Xero, and Sage Intacct sync plus mappings and splits
    - Need stronger public proof on NetSuite depth and multi-entity edge cases
  - - Working capital partner layer
    - Businesses needing short-term liquidity
    - Marketed but clearly partner-led
    - Funding option sits inside the same UI as banking and cards
    - Need public product criteria, pricing ranges, and renewal behavior
  notes: Rows summarize public product surfaces visible on Slash pages and partner materials as of the run date; maturity labels reflect documentation depth and explicit shipment status, not audited reliability.
