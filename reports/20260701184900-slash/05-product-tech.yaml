  evidenceGaps:
  - type: missing-source
    severity: material
    topic: middleware-layer
    missingEvidence: A current architecture statement that names whether Slash still uses any middleware or BaaS layer between its product surfaces and Column.
    whyItMatters: This determines dependency concentration, regulator-facing accountability, and where ledgering and payment orchestration truly live.
    diligencePath: Request the current architecture diagram, sponsor-bank operating memo, and any third-party processing agreements that sit between Slash and Column.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: piermont-transition
    missingEvidence: A dated migration timeline from the historical Piermont and Mastercard setup to the current Column and Visa arrangement, including how legacy cohorts were handled.
    whyItMatters: The legal and operational exposure can differ materially if some customers or cards still sit under older agreements or migrated under special processes.
    diligencePath: Request archived cardholder agreements, migration notices, and operations notes for the Piermont-to-Column transition.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: twin-reliability
    missingEvidence: Internal uptime, rollback, approval-latency, and exception-rate metrics for Twin and the API automation surface.
    whyItMatters: Twin is a major differentiator, but agentic money movement cannot be underwritten from feature pages alone.
    diligencePath: Ask for SLA history, incident logs, audit-log samples, and approval failure metrics for Twin, webhooks, and authorization flows.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
