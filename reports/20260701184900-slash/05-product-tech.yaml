- id: trust-controls-and-operational-limitations
  title: Trust, controls, and operational limitations
  body: "Trust and controls are visible in public materials, but so are the limitations. Slash emphasizes role-based permissions, approval workflows, event logging for Twin-originated actions, MFA, automated fraud monitoring, SOC 2 positioning, PCI positioning, and KYC or KYB-driven eligibility checks. Legal and help-center documents also make clear where the safety boundaries stop: Treasury is a securities product, not an insured deposit account; stablecoins and Global USD are not FDIC insured; RTP and FedNow are irreversible once sent; and working-capital underwriting belongs to partners. Commercial restrictions are also material rather than cosmetic. Cashback excludes major merchants, prohibited-activity policies block or restrict multiple high-risk categories and jurisdictions, and account closure is a manual support process that requires balances, pending payments, and even any instant-deposit loan exposure to be cleaned up first. Independent signals do not show a collapse in user trust,\
    \ but they do show that onboarding and support remain operational choke points. That makes Slash\u2019s controls credible but still operator-dependent."
