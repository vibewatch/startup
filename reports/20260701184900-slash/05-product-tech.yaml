- id: roadmap-maturity-and-open-questions
  title: Roadmap, maturity, and open questions
  body: "Release cadence is one of Slash\u2019s strongest product signals. Stablecoin infrastructure arrived in late 2024, USDSL and scaled payment volume followed in 2025, and April 2026 combined Twin, a rebuilt mobile app, and new funding with explicit claims of more than 100 features shipped in the prior year. Hiring and public positioning still emphasize building, not harvesting. That momentum supports the idea that Slash is trying to own the financial back office for digitally native operators. At the same time, maturity is uneven across modules. Core checking, card controls, transfer rails, and accounting sync look more operationally mature than the still-partner-dependent Global USD stack or the ambitious Twin layer. The historical record also matters here: a 2023 profile described a Piermont and Mastercard setup that no longer matches the current Column and Visa disclosures. Public evidence confirms that the stack changed, but not exactly how or when, and it does not clarify whether\
    \ a hidden middleware layer still mediates the most critical money-movement and ledgering operations. Those are underwriting questions, not cosmetic curiosities."
