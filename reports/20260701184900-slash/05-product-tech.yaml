      modules:
      - Accounts and cards
      - Analytics
      - Approvals
      - Multi-entity context
    - label: Workflow and notification layer
      detail: Transfers, webhooks, approval events, and agent actions depend on internal workflow logic and event handling.
      modules:
      - Flow of Funds concepts
      - Webhooks
      - Event log
      - Authorization logic
    - label: Banking and card rails
      detail: The regulated fiat core sits with Column and Visa-backed card issuance, plus sweep-program mechanics for deposits.
      modules:
      - Column deposit core
      - Visa charge card
      - ACH / wire / RTP / FedNow
      - Sweep program
    - label: Stablecoin and Global USD rails
      detail: On-chain balances and conversions rely on partners that abstract custody, gas, and settlement into a bank-like UX.
      modules:
      - Bridge
      - Layer2
      - Alchemy wallets and RPC
      - Global USD
    - label: Treasury, lending, and close integrations
      detail: Yield, credit, and ledger-sync services extend the platform through external specialists rather than a fully proprietary balance sheet.
      modules:
      - Atomic Treasury
      - Slope and Lead Bank
      - QuickBooks / Xero / Sage
      - Plaid / Yodlee
