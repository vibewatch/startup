  topStrengths:
    - Slash 搭出了一套偏软件的企业银行栈，stablecoin、Global USD、API 和 Twin AI 能力都超过了普通 SMB neobank。
    - 公开规模信号相当可观，包括约 $250 million 至 $300 million 的年化收入、超过 $30 billion 的年化支付量，以及九个月内超过 $1 billion 的年化 stablecoin 交易量。
    - 产品看起来很贴合数字优先、跨境、且常被主流 SMB 银行和更简单 neobank 服务不足的运营型企业。
    - Slash 已证明执行速度和融资能力：从 2025 年 $370 million Series B 推进到 2026 年 $1.4 billion Series C，并获得重复 fintech 投资人支持。
  topRisks:
    - 审计财务、毛利率、烧钱速度，甚至盈利口径都未披露，公开数据无法承销收入质量。
    - 核心银行、存款 sweep 覆盖、资金管理、stablecoin 发行或托管、营运资金融通都依赖 Column 和多家专业伙伴，带来集中度和应急风险。
    - Stablecoin 和 Global USD 增长有意义，但 2026 年支付 stablecoin 规则下，合规框架和伙伴经济性仍在演变。
    - 客户指标在 >5,000 家服务企业与 10,000+ 营销口径之间冲突，也没有公开 NRR、GRR 或流失数据证明耐久性。
    - 返现经济性、不可逆支付网络，以及未公布的欺诈、争议和支持指标，让运营控制质量只得到部分证明。
  unresolvedGaps:
    - FY2024-FY2025 经审计或董事会审阅的财务数据，包括毛利率、烧钱速度、现金余额和清晰的盈利桥。
    - 需要调和后的客户定义，解释 >5,000 家服务企业与 10,000+ 企业或创业者口径的差异。
    - 留存 cohort、NRR、GRR、logo 流失，以及按垂直行业和客户规模划分的集中度。
    - 伙伴失败应急方案，以及覆盖 Column、sweep banks、Bridge、Layer2 和 Alchemy 的当前架构图。
    - Series C 后股权结构表、清算瀑布，以及 2026 年最终规则下的 stablecoin 合规路线图。
