  topStrengths:
    - >-
      Slash has built a software-heavy business-banking stack with stablecoin, Global USD, API, and Twin AI capabilities
      that go well beyond a commodity SMB neobank.
    - >-
      Public scale signals are substantial, including roughly $250 million to $300 million in annualized revenue, more
      than $30 billion in annualized payment volume, and more than $1 billion in annualized stablecoin volume within
      nine months.
    - >-
      The product appears well matched to digital-first, cross-border, and often under-served operating businesses that
      mainstream SMB banks and simpler neobanks handle less well.
    - >-
      Slash has demonstrated execution velocity and financing access, moving from a $370 million Series B in 2025 to a
      $1.4 billion Series C in 2026 with repeat fintech investors.
  topRisks:
    - >-
      Audited financials, gross margin, burn, and even the meaning of profitability remain undisclosed, so quality of
      revenue cannot be underwritten from public data.
    - >-
      Core banking, sweep coverage, treasury, stablecoin issuance or custody, and working-capital flows depend on Column
      and multiple specialist partners, creating concentration and contingency risk.
    - >-
      Stablecoin and Global USD growth is meaningful, but the compliance regime and partner economics are still evolving
      under 2026 payment-stablecoin rules.
    - >-
      Customer metrics conflict between >5,000 served businesses and 10,000-plus marketing claims, and no public NRR,
      GRR, or churn data proves durability.
    - >-
      Cashback economics, irreversible payment rails, and unpublished fraud, dispute, and support metrics leave
      operational-control quality only partially evidenced.
  unresolvedGaps:
    - >-
      FY2024-FY2025 audited or board-reviewed financials, including gross margin, burn, cash balance, and a clear
      profitability bridge.
    - >-
      A reconciled customer definition explaining >5,000 served businesses versus 10,000-plus businesses or
      entrepreneurs.
    - Retention cohorts, NRR, GRR, logo churn, and segment concentration by vertical and customer size.
    - >-
      Partner-failure contingency plans and a current architecture map covering Column, sweep banks, Bridge, Layer2, and
      Alchemy.
    - The post-Series C cap table, liquidation waterfall, and stablecoin compliance roadmap under final 2026 rules.
