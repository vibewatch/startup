  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: customer-count-denominator
    missingEvidence: A management bridge explaining whether 10,000-plus businesses and 5,000-plus served businesses refer to active funded accounts, cumulative signups, or different product cohorts.
    whyItMatters: Customer penetration, ARPU, and concentration analysis all depend on knowing which customer-count denominator is real.
    diligencePath: Request a monthly active funded-business count, cumulative-account count, and product-level customer bridge as of 2026-07-01.
    relatedQuestionRefs:
    - QU007
    relatedTableRefs:
    - TU002
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-coverage
    missingEvidence: A current list of named customers with production status, use case, outcome, tenure, and whether each is referenceable for diligence calls.
    whyItMatters: Without broader named proof, investors cannot test how representative Privy or anonymous reviews are of the paying base.
    diligencePath: Request the top 20 customers by revenue or payment volume, including industry, tenure, product mix, and referenceability.
    relatedQuestionRefs:
    - QU022
    - QU025
    relatedTableRefs:
    - TU003
  - type: access-blocked
    severity: minor
    topic: third-party-review-depth
    missingEvidence: Current readable G2 detail and slash-specific BBB complaint counts or outcomes from the public pages.
    whyItMatters: Independent complaint and satisfaction depth remains partially obscured, which limits confidence in support-quality assessment.
    diligencePath: Capture authenticated or screenshot-backed exports from G2 and BBB, or request company-provided NPS, CSAT, complaint-rate, and dispute-resolution metrics.
    relatedQuestionRefs:
    - QU016
    - QU022
    relatedTableRefs:
    - TU003
    - TU004
  - type: private-evidence-only
    severity: material
    topic: retention-and-renewal
    missingEvidence: NRR, GRR, logo churn, cohort retention, renewal cadence, and standard contract terms by segment and product.
    whyItMatters: Durability cannot be underwritten from public reviews and product breadth alone.
    diligencePath: Request retention cohorts, churn bridge, renewal calendar, and expansion mix for 2024, 2025, and year-to-date 2026.
    relatedQuestionRefs:
    - QU014
    - QU015
    - QU025
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: minor
    topic: support-organization-visibility
    missingEvidence: Publicly readable detail on support headcount, escalation policy, response-time SLAs, and customer-success staffing.
    whyItMatters: Support quality is a meaningful retention lever for money-movement customers, especially when closure or dispute workflows require manual intervention.
    diligencePath: Request support-org staffing, hours of coverage, first-response metrics, and dispute-resolution service levels.
    relatedQuestionRefs:
    - QU024
    - QU025
    relatedTableRefs:
    - TU004
    - TU005
