- id: expansion-and-concentration-risk
  title: Expansion and concentration risk
  body: 'The installed-base upside is easy to see. Slash can land a customer on banking and cards, then expand into treasury, working capital, stablecoin workflows, Global USD, accounting automation, and Twin. That expansion logic is visible in both company pages and third-party descriptions, and Sacra argues it is a key reason average revenue per customer appears unusually high. The difficulty is that expansion and concentration are intertwined. The same customer attributes that make Slash economically attractive—high card spend, heavy vendor flows, ad buying, cross-border payments, or crypto comfort—also make the customer base more correlated around a narrow set of verticals and operating patterns.


    The biggest concentration risks therefore sit in agencies, ecommerce, crypto-adjacent businesses, and cross-border operators, with home-services or contractor-adjacent expansion still more marketed than publicly proven. Airwallex''s critique is useful here because it shows the flip side of Slash''s differentiation: a USD-centric, daily-settlement, rewards-driven product can be excellent for domestic high-volume operators and still be a bad fit for globally multi-currency teams. JD Power''s small-business banking benchmark adds another lens: support, problem resolution, and advice quality meaningfully influence satisfaction. Slash may keep expanding inside its best-fit segments, but public evidence is still not good enough to underwrite how concentrated revenue is by vertical, by geography, or by its most payment-intensive customer cohorts.'
