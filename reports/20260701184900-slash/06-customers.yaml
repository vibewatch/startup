company:
  name: Slash
chapter:
  number: 6
  title: Customers
  summary: Slash appears to have real adoption among high-volume, digital-first businesses, but the public customer record is unusually noisy for a claimed 10,000+ business platform. The strongest evidence is aggregate usage and workflow depth, not a broad library of named enterprise references, and the biggest open questions remain active-customer definitions, true retention, and concentration in agencies, ecommerce, crypto, and cross-border use cases.
sections:
- id: segmentation-onboarding-and-workflow-fit
  title: Segmentation, onboarding, and workflow fit
  body: 'Slash''s public customer story begins with segmentation rather than with a generic SMB pitch. Business Banking and Treasury are limited to US-registered businesses, while Global USD is explicitly marketed to businesses in 130+ countries that need dollar balances, ACH or wire access, and stablecoin rails without standing up separate crypto operations. That split matters because it clarifies that Slash is not one uniform customer base: domestic incorporated businesses enter through banking, cards, and treasury, while non-US entities are pulled in through Global USD and cross-border workflows. Official eligibility pages also show meaningful screening pressure. Slash excludes a long list of higher-risk or harder-to-underwrite categories, requires incorporated entities for core US banking, and subjects owners and operators to KYB, sanctions, and residence review.


    The most consistently evidenced verticals are performance marketing agencies, ecommerce brands, crypto-native teams, import-export businesses, and other digital-first operators with high transaction intensity. Official April 2026 fundraise materials add affiliate marketing, healthcare, and home services to that mix, while Sacra frames the company as winning where horizontal neobanks often hesitate. Workflow fit is strongest where customers benefit from instant virtual cards, high card throughput, treasury, working capital, and stablecoin rails inside one operating surface. It is weaker for cash-constrained businesses that need 30-day payment float or for globally complex finance teams that need broad multicurrency support rather than a USD-centric stack.'
