- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Cards to treasury / working capital
    - Base skews toward high-card-spend operators
    - Strong ARPU but cyclicality if spend-heavy cohorts slow
    - Request revenue and gross profit mix by cards, treasury, and lending-adjacent products
  - - Banking to Global USD / stablecoins
    - Cross-border and crypto-adjacent customers may become disproportionately important
    - Differentiates Slash but raises regulatory and sponsor-bank sensitivity
    - Request customer counts, revenue share, and top-account concentration for Global USD cohort
  - - Global USD to Global Card and broader finance stack
    - Non-US acquisition may still cluster in import-export and web3 use cases
    - Adds TAM without necessarily broadening true customer diversity
    - Request segment mix by geography, industry, and payment rail
  - - Twin / automation upsell
    - Best fit may be digitally mature teams rather than average SMBs
    - Can improve stickiness for power users while leaving smaller customers less engaged
    - Request Twin adoption by account size and its effect on retention or ARPU
  - - Home services / contractor-adjacent expansion
    - Vertical is named publicly but lightly evidenced
    - May be more aspirational than realized today
    - Request named references and volume metrics for home-services or contractor cohorts
  - - Support and closure handling
    - A digital-first support model can become a concentration risk if high-volume customers need fast exception handling
    - Retention can weaken even with a strong product if issue resolution lags
    - Request SLA dashboard, escalation policy, and monthly complaint trend by issue type
  - - Named-proof scarcity
    - Only one clearly attributable named customer quote was reviewed
    - Hard to test enterprise quality, procurement depth, and concentration resilience
    - Request top-20 customer list by revenue, tenure, industry, and production status
  notes: Expansion is visible in product breadth; concentration is visible in who can most naturally use that breadth. Public evidence is insufficient to quantify vertical revenue share or top-customer dependence.
