- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: A typical Slash journey begins with onboarding and compliance, expands into money movement and cards, and then deepens into Global USD, treasury, or Twin when the workflow fit is strong.
  data:
    nodes:
    - id: discover
      label: Discover
      detail: Founder or finance lead finds Slash through digital-first banking, rewards, or cross-border positioning.
    - id: apply
      label: Apply / KYB
      detail: Business submits incorporation, owner, and eligibility information and clears compliance review.
    - id: core
      label: Core banking live
      detail: Customer starts using checking, cards, ACH, wires, and cashback in daily operations.
    - id: expand
      label: Workflow expansion
      detail: Customer adds treasury, working capital, accounting, or Global USD based on operating needs.
    - id: automate
      label: Automation layer
      detail: Power users add Twin or cross-border stablecoin workflows, increasing switching costs.
  approximationNotes: Stages are inferred from public product surfaces, eligibility steps, review commentary, and the way Slash packages adjacent products around the same operating account.
