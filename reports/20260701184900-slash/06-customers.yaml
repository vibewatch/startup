- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public proof
  - Strategic value
  - Gap
  rows:
  - - US-incorporated digital-first SMBs
    - 'Buyer: founder or finance lead; User: finance ops team; Payer: operating business'
    - Checking, cards, ACH, wires, treasury
    - Business Banking and Treasury limited to US-registered businesses; 10,000+ current marketing claim
    - Core acquisition base for card, treasury, and software upsell
    - Slash does not disclose active funded accounts vs total signups
  - - Performance marketing agencies
    - 'Buyer: owner or finance manager; User: ad-spend operators; Payer: agency entity'
    - Virtual cards, client spend segregation, cash movement
    - Sacra repeatedly cites agencies as a core vertical
    - High card throughput and sticky workflow fit
    - No public revenue mix by agency cohort
  - - Ecommerce brands and merchants
    - 'Buyer: founder or controller; User: spend managers; Payer: merchant entity'
    - Supplier payments, cards, chargeback-sensitive spend, working capital
    - Official materials cite ecommerce; Sacra cites high-volume handling
    - Large payment flow and interchange intensity
    - Named brand references are not public in reviewed sources
  - - Crypto-native and web3 teams
    - 'Buyer: treasury or ops lead; User: finance team; Payer: operating company'
    - Stablecoin funding, cross-border payments, Global USD
    - Bridge and Alchemy case studies; official stablecoin materials
    - Differentiated by crypto rails and off-ramp volume
    - Regulatory and sponsor-bank sensitivity is elevated
  - - Import/export and non-US businesses
    - 'Buyer: finance lead; User: ops or treasury; Payer: non-US operating entity'
    - USD account, ACH or wire access, stablecoin settlement, Global Card
    - Global USD page says businesses in 130+ countries can use Slash
    - Expands TAM beyond US incorporation
    - Public proof is concentrated in one Privy quote and partner case studies
  - - Home services / contractor-adjacent and healthcare
    - 'Buyer: owner-operator or finance lead; User: field or back-office spend managers; Payer: operating business'
    - Cards, payments, and working-capital support
    - April 2026 company materials mention home services and healthcare; Sacra names HVAC expansion opportunity
    - Potentially broadens concentration away from pure agencies and crypto
    - Few public named examples or workflow-specific references
  notes: Segmentation combines official eligibility pages, current product surfaces, the April 2026 BusinessWire release, and Sacra synthesis. Public evidence is much stronger on segment intent than on revenue concentration or cohort size.
