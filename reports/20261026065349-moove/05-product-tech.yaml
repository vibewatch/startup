      - [Kovi and Moove Manned, "Human-driven mobility fleets across operating markets", "Kovi acquisition and distinct business units reported by Speedinvest", "Operating experience and fleet maintenance around financed vehicles", "Current SKU boundaries, integration status, and market-level results"]
    notes: >-
      Product descriptions are based on the assigned sources and are not an
      exhaustive current catalog; status reflects reported statements, not
      independent operational verification.
    claimRefs: [CE001, CE005, CE008, CE009, CE012]
  - id: TE002
    title: Driver financing workflow and evidence limits
    columns: [Stage, User job, Reported Moove mechanism, Evidence basis, Limitation]
    rows:
      - [Vehicle access, "Driver needs a vehicle to earn on a mobility platform", "Revenue-based vehicle financing or rental", "IFC and Moove product descriptions", "Current market eligibility and contract terms are not established"]
      - [Underwriting, "Provider assesses ability to repay without relying only on conventional credit history", "Alternative scoring using platform performance and revenue analytics", "IFC description; management account of API-linked signals", "No model validation, scorecard, error rates, or data-governance evidence"]
      - [Repayment, "Driver repays while income varies with completed work", "A percentage of weekly revenue; IFC described 24-, 36-, or 48-month terms in 2021", "IFC press release", "Historical terms may not represent current offers or realized affordability"]
      - [Fleet operation, "Partner needs vehicles ready for service", "Maintenance, charging, and fleet operations are described for AV deployments", "TechCrunch and Moove-sourced announcement coverage", "No independently measured uptime, repair turnaround, or SLA"]
    notes: >-
      The workflow combines reports from different dates and markets; the
      historical IFC repayment terms are not presented as current pricing.
    claimRefs: [CE001, CE002, CE003, CE004, CE007, CE008, CE013]
  - id: TE003
    title: Technology and operating dependencies
    columns: [Layer or process, Role described, External dependency, Principal risk or unknown]
    rows:
      - [Platform signals, "Trip, earnings, rating, cancellation, and maintenance data are described as underwriting inputs", "Mobility-platform integrations and data access", "Data permission, retention, completeness, and portability are not documented"]
      - [Risk decision, "Alternative credit scoring is described as using performance and revenue analytics", "Reliable, representative driver and platform data", "No validation results, loss rates, or bias testing are available"]
      - [Vehicle capital, "Vehicle purchases are financed and repaid from driver revenue", "Asset finance, vehicle supply, and driver earnings", "Current financing terms and asset-level economics are not disclosed"]
      - [Fleet operations, "Charging, servicing, maintenance, and availability are described for AV fleets", "Waymo operating scope, local workforce, service sites, and utilities", "No contract terms, operating KPIs, or continuity commitments are public in this pool"]
      - [Depot infrastructure, "Nests are described as locations for charging, maintenance, and orchestration", "Land, zoning, grid capacity, and site access", "Sector constraints are reported; Moove-specific site capacity and utilization remain unknown"]
    notes: >-
      This is a source-bounded operating model, not a verified technical
      architecture or a complete map of Moove's internal systems.
    claimRefs: [CE002, CE003, CE007, CE008, CE010, CE013]
