    claimRefs: [CE002, CE004, CE010, CE014]
callouts:
  - calloutType: insight
    title: The product is an operating system around vehicle access
    body: >-
      Sources describe a progression from revenue-based financing toward
      maintenance, charging, and fleet operations; whether those services
      deliver repeatable uptime or attractive economics remains unverified.
    claimRefs: [CE001, CE005, CE008]
  - calloutType: risk
    title: Partner demand is a product dependency
    body: >-
      Management described platform demand as necessary for the financing
      model, while reporting connected Moove's Nigerian wind-down with Uber's
      exit; the evidence does not establish a single cause or a global failure.
    claimRefs: [CE006, CE011, CE014]
