company:
  name: Moove
chapter:
  number: 5
  title: Product & Technology
  summary: Moove's evidenced product spans revenue-linked vehicle financing and, more recently, fleet operations and physical infrastructure for autonomous mobility. Public material describes the underwriting inputs and partner workflows, but does not establish independent reliability, security, or unit-level performance.
sections:
  - id: product-surface
    title: Product lines and user workflows
    body: >-
      Moove's original customer-facing product is vehicle access for mobility
      entrepreneurs through Drive-to-Own and rental offerings, with repayment
      tied to driver revenue rather than conventional fixed monthly installments
      (CE001). Its reported product perimeter has expanded from financing into
      fleet ownership, maintenance, charging, and operating support, including
      services for autonomous-vehicle fleets (CE005, CE008). Reporting also
      describes an Uber-connected financing offer in India, but the available
      account does not provide a consistent, independently verified outcome
      measure (CE012). The matrix distinguishes evidenced lines from
      unverified maturity and customer-benefit claims; it is not an exhaustive
      inventory of markets or SKUs.
    claimRefs: [CE001, CE005, CE008, CE012]
    tableRefs: [TE001]
  - id: underwriting-workflow
    title: Financing workflow and data inputs
    body: >-
      IFC's 2021 description and Moove's own product announcement describe
      vehicle financing repaid as a percentage of weekly driver revenue
      (CE001). IFC also reported that Moove embedded alternative credit-scoring
      technology in mobility platforms and used performance and revenue
      analytics for underwriting (CE002). A Speedinvest interview with
      management adds examples of signals said to inform credit and risk
      decisions, including trip frequency, cancellations, ratings, maintenance
      behavior, and earnings stability (CE004). The evidence supports the
      broad mechanism, not the model's predictive performance, data rights,
      retention practices, or realized loss rates. Historical repayment terms
      reported by IFC are not necessarily current terms (CE003).
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE002]
  - id: autonomous-operations
    title: Autonomous fleet operating layer
    body: >-
      TechCrunch reported in December 2024 that Waymo selected Moove for fleet
      operations in Phoenix and for charging and depot build-out associated
      with Miami, while noting that the parties did not disclose their financial
      arrangement (CE007, CE013). A later report carrying Moove's announcement
      described its "Nests" as facilities for charging, servicing, maintenance,
      and fleet orchestration, and reported live operations in Phoenix and
      Miami with London as a future operation (CE008, CE009). This is evidence
      of a physical operating scope, not proof of fleet uptime or customer
      service levels. The architecture map makes the described handoffs
      explicit while keeping power, site access, and partner data as
      dependencies rather than verified Moove capabilities (CE010, CE014).
    claimRefs: [CE007, CE008, CE009, CE010, CE013, CE014]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: demand-and-resilience
    title: Demand alignment and market dependency
    body: >-
      The product's financing logic depends on drivers earning enough from a
      mobility platform to service vehicle payments, and management described
      platform demand and driver supply as prerequisites for expansion
      (CE006). Business Insider Africa reported Moove's decision to end
      operations in Nigeria after Uber's exit, alongside broader sector
      pressures; its account does not establish one exclusive cause for the
      decision (CE011). Read together, these sources make partner continuity
      and local demand important product dependencies, rather than proving
      that the underlying underwriting technology failed globally (CE014).
      The public evidence does not quantify the revenue, assets, or customers
      affected by the wind-down on a consolidated basis.
    claimRefs: [CE006, CE011, CE014]
  - id: verification-gaps
    title: What remains unverified
    body: >-
      The assigned evidence describes product mechanisms and partner
      announcements, but does not provide independent depot utilization,
      vehicle uptime, maintenance turnaround, incident rates, or market-level
      service-level agreements. Axios reports that robotaxi depots face land,
      zoning, and power-access constraints, including a supplier estimate of
      4 to 12 megawatts per site; this is sector context, not a measured Moove
      requirement or performance result (CE010). The available sources also
      do not establish Moove's cybersecurity controls, privacy and retention
      practices, safety assurance, or certifications. These gaps prevent a
      diligence conclusion about reliability, control maturity, or the
      transferability of the model across partners and cities.
    claimRefs: [CE010, CE013, CE014]
