        Request audited monthly cohort files, active-account definitions, arrears and write-off
        schedules, contract samples, and revenue concentration by partner, market, and cohort.
      relatedQuestionRefs: [QU006, QU007]
    - type: missing-source
      severity: material
      topic: named-customer-outcomes
      missingEvidence: >-
        Independent customer references and contract-level evidence for Uber and Waymo deployments,
        including service levels, realized outcomes, pricing, and renewal terms.
      whyItMatters: >-
        Public announcements identify counterparties and operating roles but do not establish
        customer satisfaction, delivered results, or the durability and economics of those roles.
      diligencePath: >-
        Obtain permissioned references from named platform customers and review executed contracts,
        service-level reports, renewal notices, and market-level operating dashboards.
      relatedQuestionRefs: [QU003, QU009]
      relatedTableRefs: [TU003]
    - type: conflicting-data
      severity: minor
      topic: India-adoption
      missingEvidence: >-
        A reconciled India trip count with a defined period, vehicle population, platform scope, and
        methodology; Tech In Africa reports conflicting 4.2 million and 30 million figures.
      whyItMatters: >-
        Without a reconciled denominator and period, the reported trips cannot support an adoption
        trajectory, utilization rate, or customer outcome comparison.
      diligencePath: >-
        Request the source data and definitions behind both published figures, then reconcile them
        to dated fleet and platform records before using either as an operating KPI.
      relatedQuestionRefs: [QU002]
      relatedTableRefs: [TU002]
