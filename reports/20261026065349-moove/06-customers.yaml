schemaVersion: "report-v2"
artifact: customers
slug: moove
runDate: 2026-10-26
company:
  name: Moove
chapter:
  number: 6
  title: Customers
  summary: >-
    Moove's public evidence shows a driver-financing proposition built around platform earnings,
    with reported fleet deployment through Uber and Waymo. The Nigeria wind-down and the absence
    of disclosed retention, cohort, and customer-level economics leave durability less established
    than fleet and trip scale.
sections:
  - id: customer-segments
    title: Who uses Moove and what they receive
    body: >-
      The clearest disclosed end user is the mobility entrepreneur or ride-hailing driver who
      needs a vehicle but lacks conventional financing access. IFC's 2021 description links
      vehicle finance to platform performance and revenue data, with repayments taken as a
      percentage of weekly earnings; it also describes Moove as Uber's exclusive vehicle-finance
      and vehicle-supply partner in sub-Saharan Africa. These are historical product terms, not
      proof that every market or contract uses the same structure today. The current public
      evidence spans driver financing, Uber-linked fleet supply, Waymo fleet operations, and
      eligible Nigerian drivers receiving vehicles at wind-down. It does not disclose a complete
      customer count by geography, product, or revenue band, nor whether counterparties are
      contracted directly or through platform arrangements.
    claimRefs: [CU001, CU002, CU003, CU009, CU012]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-evidence
    title: Adoption signals are operational, not retention proof
    body: >-
      Public operating indicators are uneven and should not be collapsed into a single growth
      curve. IFC's 2021 financing announcement projected up to 1,400 additional Lagos cars and
      estimated four million passenger trips per year, while later coverage reported more than
      9,000 Nigerian customers and about 42,000 vehicles across 29 cities in 13 countries.
      Those figures describe different populations and periods: a financing-supported vehicle
      addition, customers who used Nigerian products, and a global vehicle fleet. A Tech In
      Africa article gives inconsistent India trip totals, so neither figure is treated as a
      reliable comparable series. The sources provide no cohort retention, repeat-purchase,
      churn, renewal, utilization denominator, or market-level revenue split. Fleet and trip
      counts therefore establish reported deployment, not customer durability or economics.
    claimRefs: [CU004, CU006, CU007, CU009, CU010, CU011, CU015]
    tableRefs: [TU002]
  - id: named-deployments
    title: Named relationships and limits of customer proof
    body: >-
      Uber is the best-documented platform relationship: IFC described an exclusive financing
      and vehicle-supply role in sub-Saharan Africa, and The Ken identified Moove among Uber's
      fleet partners for a planned India electric-cab rollout. The Waymo relationship is a
      distinct operating use case; reporting says Moove manages autonomous fleets and related
      infrastructure in Phoenix and Miami. These sources support named counterparties and
      operating roles, but do not disclose contract value, renewal rights, fleet-level output,
      service levels, or customer references. One India article also names a driver in an
      adverse vehicle-impoundment account; that single reported case is not a measured
      default-rate or customer-satisfaction result.
    claimRefs: [CU005, CU008, CU012, CU013, CU014, CU016]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Durability, expansion, and concentration remain open
    body: >-
      The Nigeria exit is a concrete test of local customer durability: eligible vehicle users
      were reported to receive ownership of vehicles worth more than ₦35 billion, while the
      reported customer base exceeded 9,000. Coverage differs on causation. Marketing Analytics
      Africa says the Uber departure materially changed the operating environment and attributes
      the exit to it, while Business Insider Africa says Moove had not disclosed a specific
      reason. The timing and partner dependence warrant diligence, but do not alone prove the
      cause of exit or the health of other markets. Expansion into Waymo fleet operations may
      broaden the customer mix, yet the assigned evidence does not show the share of revenue,
      assets, or utilization tied to any partner. Retention, customer concentration, contract
      terms, and outcomes remain material evidence gaps.
    claimRefs: [CU008, CU009, CU010, CU011, CU012, CU013, CU014, CU015, CU016]
    callouts:
      - calloutType: risk
        title: Deployment is not durability
        body: >-
          Reported vehicles, trips, and customers do not establish repeat usage, repayment
          performance, renewal, profitability, or the concentration of customer economics.
        claimRefs: [CU009, CU010, CU011, CU015, CU016]
tables:
  - id: TU001
    title: Customer and payer segmentation
    columns: [Segment or counterparty, Buyer / user / payer, Use case and scale, Strategic value, Evidence limitation]
    rows:
      - ["Mobility entrepreneurs and ride-hailing drivers", "Driver uses the vehicle; financing customer", "Vehicle access through revenue-based financing", "Serves drivers who may lack conventional credit access", "No current segment count or market-level economics disclosed"]
      - ["Uber-linked drivers in sub-Saharan Africa", "Drivers are end users; Uber is the named platform partner", "Vehicle financing and supply partnership described by IFC in 2021", "Platform access and performance data support underwriting", "Historical relationship description; current terms and exclusivity are not established"]
      - ["Uber-linked fleet partners in India", "Drivers use vehicles; Uber is the platform relationship", "Moove named as one of three fleet partners in a planned 25,000-cab EV rollout", "Potential expansion of fleet supply and vehicle mix", "The Ken excerpt is paywalled and describes a plan, not completed deployment or customer outcomes"]
      - ["Waymo autonomous fleet operations", "Waymo is the named operating counterparty; riders use the service", "Moove reportedly manages fleet operations and supporting infrastructure in Phoenix and Miami", "Adds an operating-services use case beyond driver finance", "Contract scope, economics, and user outcomes are not disclosed"]
    notes: >-
      Sample of named segments and counterparties in the assigned sources, not a complete customer
      census. Partnership and deployment descriptions do not establish direct billing, contract
      value, or current customer counts.
    enumerationScope:
      coverage: sample
      basis: Publicly named customer and counterparty relationships in the assigned fetched sources for this chapter.
    claimRefs: [CU001, CU002, CU003, CU005, CU012]
  - id: TU002
    title: Reported customer and adoption indicators
    columns: [Metric, Value and period, Source, Confidence / implication, Missing denominator or qualification]
    rows:
      - ["IFC-supported vehicle addition", "Up to 1,400 cars; announced 2021", "IFC", "Medium; financing-supported planned deployment", "Actual additions and active utilization not reported here"]
      - ["Lagos passenger trips", "Estimated 4 million per year from additional cars; estimate in 2021 announcement", "IFC", "Medium; source-attributed estimate rather than observed usage", "No realized trip count, vehicle denominator, or measurement period"]
      - ["Nigeria customers using Drive-to-Own and rental", "More than 9,000; reported around October 2026 exit coverage", "Business Insider Africa and KudiCompass", "Medium; reported customer reach", "Not a current active-account count or retention measure"]
      - ["Global operating fleet", "Approximately 42,000 vehicles across 29 cities in 13 countries; reported in 2026 coverage", "Business Insider Africa and Marketing Analytics Africa", "Medium; reported deployment scale", "Not a customer count, utilization rate, or market-level distribution"]
      - ["India trips on Uber", "Tech In Africa reports both over 4.2 million and over 30 million by February 2024", "Tech In Africa", "Low; internally inconsistent source", "Values are not reconciled and are excluded from a comparable adoption trend"]
    notes: >-
      Indicators are source-reported and not directly comparable across populations or periods.
      Forecast trips are not observed trips; vehicle counts are not customer counts; the India
      article gives conflicting trip totals. No source in this set supplies a denominator that
      supports a retention or utilization rate.
    claimRefs: [CU004, CU006, CU007, CU009, CU010, CU011]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or counterparty, Segment, Deployment / use case, Production vs. pilot or plan, Reported outcome, Limitation]
    rows:
      - ["Uber", "Mobility platform / fleet supply", "Vehicle financing and supply relationship in sub-Saharan Africa", "Operating relationship described by IFC in 2021", "IFC described the relationship as exclusive", "Current contract scope, renewal, and customer economics are unavailable"]
      - ["Uber", "Mobility platform / fleet partner", "Moove included in an India electric-cab fleet-partner rollout plan", "Plan reported by The Ken", "Partner inclusion in a 25,000-cab plan", "Paywalled excerpt does not establish completed Moove deployment or results"]
      - ["Waymo", "Autonomous mobility operator", "Moove fleet operations and supporting infrastructure in Phoenix and Miami", "Reported operating deployment", "Named-city fleet operations reported", "No customer reference, contract value, uptime, or rider outcome disclosed"]
    notes: >-
      Partial sample of named counterparties and public deployment evidence; these rows do not
      establish a complete or exhaustive customer list. The named relationships are not
      independently audited customer references.
    enumerationScope:
      coverage: sample
      basis: Named customer and platform deployments explicitly present in assigned sources, not every Moove customer.
    claimRefs: [CU005, CU012, CU013, CU014]
figures:
  - id: FU001
    title: Driver-financing lifecycle and Nigeria wind-down boundary
    type: journey-map
    summary: >-
      Public sources describe an earnings-linked driver-financing path, with eligible Nigerian
      vehicles transferred to drivers at wind-down.
    data:
      items:
        - title: Vehicle-access gap
          label: Vehicle-access gap
          detail: Mobility entrepreneurs may lack conventional credit access to obtain a vehicle.
          touchpoints: [Driver needs a vehicle, Conventional financing is limited]
        - title: Platform earnings signal
          label: Platform earnings signal
          detail: IFC says Moove used mobility-platform performance and revenue analytics for underwriting.
          touchpoints: [Ride-hailing or e-logistics platform, Performance and revenue data]
        - title: Vehicle financing
          label: Vehicle financing
          detail: IFC described financing new vehicles, including loans covering up to 95 percent of purchase price.
          touchpoints: [Vehicle supplied, Financing decision]
        - title: Customer operation
          label: Customer operation
          detail: Drivers use financed vehicles to provide mobility services; IFC estimated additional Lagos cars could enable four million passenger trips per year.
          touchpoints: [Vehicle in service, Passenger trips are an estimate]
        - title: Revenue-linked repayment
          label: Revenue-linked repayment
          detail: IFC described repayments as a percentage of weekly revenue over 24, 36, or 48 months.
          touchpoints: [Weekly earnings, Scheduled repayment]
        - title: Nigeria exit transfer
          label: Nigeria exit transfer
          detail: 2026 coverage says eligible drivers received full ownership of transferred vehicles; eligibility terms were not fully disclosed.
          touchpoints: [Eligible vehicles only, Ownership handover reported]
    claimRefs: [CU001, CU002, CU003, CU004, CU009]
callouts:
  - calloutType: insight
    title: Customer proof is strongest at the operating-relationship level
    body: >-
      Public evidence names Uber and Waymo and describes deployed operating roles, but it does
      not provide independently referenced customer outcomes or retention data.
    claimRefs: [CU005, CU012, CU015, CU016]
