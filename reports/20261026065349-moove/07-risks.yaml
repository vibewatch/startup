      risk ratings.
    claimRefs: [CR001, CR002, CR004, CR007, CR009, CR010, CR011, CR012, CR014]
callouts:
  - calloutType: risk
    title: Nigeria is a demonstrated concentration warning
    body: >-
      Moove's Uber-linked Nigerian financing channel ended after Uber's local departure;
      the announced vehicle transfer mitigates some customer exposure but does not prove
      title completion or restore operating demand.
    claimRefs: [CR001, CR002, CR004, CR005]
  - calloutType: insight
    title: Global scale does not establish local or fleet-level returns
    body: >-
      Reported vehicle counts, ARR, and financing proceeds do not disclose market-level
      margins, cash conversion, debt service, or autonomous-depot payback.
    claimRefs: [CR008, CR009, CR012, CR013]
