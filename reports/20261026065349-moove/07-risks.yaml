        - "Unknown from the assigned evidence"
        - "Potentially high if obligations or permissions block an orderly exit"
        - "Not evidenced"
        - "Review local contracts, regulator correspondence, and counsel's closeout assessment"
      - - "Cross-market autonomous-vehicle approvals, safety, and insurance"
        - "Unknown; no market-by-market status is provided"
        - "High if deployment or liability cover is unavailable"
        - "Not evidenced in the assigned sources"
        - "Request city-level permits, insurance schedules, incident controls, and liability allocation"
    notes: >-
      Partial, source-limited register of diligence priorities, not an exhaustive legal
      inventory or a finding that a violation exists. The sources describe transfer
      conditions and cross-market exposure but do not provide primary legal or regulator
      records; likelihood and completion remain unverified.
    enumerationScope:
      coverage: partial
      basis: "Three high-priority legal and control areas visible in the assigned 2026 reporting; not a complete jurisdictional review."
    claimRefs: [CR004, CR005, CR014]
  - id: TR002
    title: Operational and financial risk register
    columns:
      - Failure mode
      - Likelihood / status
      - Severity
      - Mitigation maturity
      - Residual exposure / monitoring indicator
    rows:
      - - "Nigeria vehicle-finance demand disrupted by Uber's exit"
        - "Realized channel shock; Moove exited afterward"
        - "High for local continuity"
        - "Wind-down and eligible-vehicle transfer announced"
        - "Track transfer completion and alternative-platform utilization"
      - - "Driver cash economics pressured by operating costs"
        - "Sector pressure reported; Moove-specific magnitude unknown"
        - "High if net earnings cannot cover vehicle costs"
        - "No quantified mitigation disclosed in this pool"
        - "Request driver net earnings, fuel/maintenance costs, arrears, and repayment cohorts"
      - - "Currency mismatch between dollar vehicle funding and naira income"
        - "Reported as a model exposure; balance-sheet amount unknown"
        - "High if unhedged obligations persist"
        - "Hedge, repricing, or debt restructuring evidence unavailable"
        - "Obtain debt currency, maturities, covenants, and hedge data"
      - - "Autonomous-fleet and depot capital recovery"
        - "Forward-looking execution risk; project returns not disclosed"
        - "High if utilization or deployment is delayed"
        - "Series C capital and expansion plan reported; unit economics unverified"
        - "Monitor depot openings, utilization, uptime, cash invested, and payback"
    notes: >-
      Qualitative risk assessments distinguish reported events from unmeasured exposures.
      Revenue generated through financed vehicles is not Moove revenue; ARR is not cash
      flow, and funding raised is not evidence of available runway.
    claimRefs: [CR001, CR007, CR008, CR009, CR010, CR012, CR013]
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Role / concentration evidence
      - Failure scenario
      - Mitigation maturity
      - Residual exposure / diligence
    rows:
      - - "Uber and ride-hailing demand"
        - "IFC called Moove Uber's exclusive sub-Saharan financing/supply partner in 2021; The Ken also reported Moove among three partners in a planned 25,000-electric-cab rollout"
        - "Platform withdrawal removes demand access while vehicle and repayment exposure remain"
        - "Nigeria exit and vehicle-transfer program announced"
        - "Verify remaining market/platform concentration and transfers"
      - - "Waymo and autonomous-mobility counterparties"
        - "Coverage reports Moove fleet operations for Waymo; contract concentration and terms undisclosed"
        - "Partner deployment, renewal, or technology decisions delay fleet utilization"
        - "Expansion strategy reported; contract protections unavailable"
        - "Review service levels, renewal/termination rights, and partner-level revenue"
      - - "Lenders and long-term capital providers"
        - "IFC financing and later equity/debt rounds are reported; current debt structure is not disclosed"
        - "Funding costs, maturity, or covenants constrain asset deployment"
        - "Series C financing reported; current liquidity and debt protections unverified"
        - "Obtain consolidated debt schedule, covenants, and runway bridge"
    notes: >-
      Public reporting identifies counterparties and financing events but does not
      quantify current revenue, debt, or operational concentration. Historical partner
      status is not evidence of current contract terms.
    claimRefs: [CR002, CR003, CR010, CR011, CR013, CR015]
