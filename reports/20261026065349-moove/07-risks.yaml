company:
  name: Moove
chapter:
  number: 7
  title: Risks
  summary: Moove's Nigeria wind-down, following Uber's departure, exposes the fragility of a vehicle-financing channel tied to a dominant mobility platform. The transfer of eligible vehicles is a reported mitigation, not verified completion; meanwhile, autonomous-fleet expansion introduces capital recovery, partner, and cross-market execution risks whose underlying economics and contractual protections remain undisclosed.
sections:
  - id: nigeria-platform-concentration
    title: Nigeria exposed a platform-concentration risk
    body: >-
      Moove announced it would end Nigerian operations about five weeks after Uber ceased
      operating there, according to contemporaneous coverage (CR001). IFC had described
      Moove in 2021 as Uber's exclusive vehicle-financing and vehicle-supply partner in
      sub-Saharan Africa, while 2026 reporting says Moove financed cars for Nigerian Uber
      drivers (CR002). This is direct evidence of a concentrated distribution channel,
      not proof that Uber's departure alone caused Moove's decision. Neither company
      identified a single Nigeria-specific reason in the available reporting (CR006).
      Fuel and maintenance costs, driver complaints about commissions and fares, inflation,
      and weaker purchasing power are reported as sector pressures, but the sources do not
      establish their individual contribution to Moove's exit (CR007).
      Separately, The Ken reported an Uber plan to roll out 25,000 electric cabs through
      three fleet partners, including Moove; that reported plan is not evidence of a current
      contract or a measure of Moove's exposure (CR015).
    claimRefs: [CR001, CR002, CR006, CR007, CR015]
    tableRefs: [TR003]
  - id: operating-and-capital-exposure
    title: Transition relief does not resolve operating economics
    body: >-
      Moove said eligible customers would receive vehicle ownership without further
      vehicle payments from October 1, 2026, while earlier remittances and transfer
      documentation still matter (CR004, CR005). Those terms may reduce customers'
      residual vehicle-payment burden, but the evidence does not verify which customers
      qualify, the number of completed transfers, or the vehicles' post-transfer
      utilization. Reported Nigerian customer and vehicle-generated revenue figures are
      historical company metrics, not active-customer counts or Moove revenue (CR008).
      Separately, the reported dollar-debt/naira-income mismatch is a potential currency
      exposure; no debt schedule, hedge position, arrears data, or market-level margin
      evidence is available here to measure it (CR009).
    claimRefs: [CR004, CR005, CR008, CR009]
    tableRefs: [TR002]
  - id: autonomous-fleet-execution
    title: Autonomous operations shift the risk profile
    body: >-
      Moove's reported 2026 Series C plan directs capital toward autonomous fleets,
      fleet ownership, depot infrastructure, and new markets (CR010). Coverage describes
      operations for Waymo and warns that autonomous fleets require larger upfront
      investment and longer recovery periods than the original driver-financing model
      (CR011, CR012). The company-reported global fleet and ARR indicate scale, but do
      not establish cash generation, depot utilization, or returns on invested capital
      (CR013). The available evidence also does not establish the precise Waymo contract
      terms, partner concentration, insurance allocation, operating permits, or safety
      controls; expansion across distinct transport regimes therefore remains an
      execution and diligence risk rather than a confirmed compliance failure (CR014).
    claimRefs: [CR010, CR011, CR012, CR013, CR014]
    tableRefs: [TR001]
  - id: risk-prioritization-and-triggers
    title: Monitor execution, not announcements
    body: >-
      The highest-priority near-term checks are whether eligible Nigerian vehicle titles
      and account closeouts are completed, whether drivers can sustain utilization and
      operating costs without the former anchor platform, and whether Moove's new fleet
      assets reach productive use. A transfer announcement is not evidence that every
      vehicle has changed ownership, and a reported global fleet count is not a margin or
      cash-flow measure. For the autonomous business, diligence should track depot
      openings and utilization, fleet uptime, partner renewal and termination rights,
      insurance and liability allocation, and market-specific approvals. Escalate the
      thesis-break assessment if transfer records fail, operating economics remain
      negative, or expansion milestones require additional unquantified capital.
    claimRefs: [CR004, CR005, CR009, CR010, CR012, CR014]
    figureRefs: [FR001]
