              - CI003
              - CI004
              - CI006
              - CI008
              - CI010
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI011
              - CI012
      - number: '4.2'
        title: Unit economics remain unproven
        blocks:
          - type: paragraph
            body: >-
              Company and media materials report approximately $420 million of annual recurring revenue (ARR), about
              42,000 vehicles across 29 cities in 13 countries, and roughly 3,300 employees. ARR is not a disclosure of
              recognized revenue, gross profit, or cash generation, and the reported fleet and headcount do not reveal
              vehicle utilization, revenue per vehicle, financing cost, servicing burden, or contribution margin. Public
              materials reviewed here provide no segment revenue mix, realized customer pricing, customer-acquisition
              cost, payback, default rate, or depot-level economics. The operational bridge is especially important in
              autonomous mobility: vehicles waiting for charging or service are not earning fares, while site selection
              and power access constrain uptime. Axios reports general sector requirements and expert estimates, not
              Moove-specific capex or profitability; those benchmarks sharpen the diligence questions but cannot fill
              the private-data gap.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI005
              - CI011
              - CI012
              - CI013
      - number: '4.3'
        title: Capital capacity and market-level proof
        blocks:
          - type: paragraph
            body: >-
              Moove announced a $250 million Series C at a $2.1 billion valuation, with proceeds intended to support
              autonomous fleets, Nests infrastructure, and new markets. This is capital raised, not cash currently
              available: the assigned sources do not show cash on hand, operating burn, debt maturities, covenants, or
              runway. Public cumulative funding totals also conflict: Tracxn reports $472 million, while Business
              Insider Africa describes more than $710 million, with no consistent reconciliation of included debt,
              equity, or transaction scope. The Nigerian wind-down is adverse evidence against assuming the historical
              model scales uniformly: Moove's co-CEO said Uber had been the principal platform supporting the Nigerian
              model and that the company could not sustain it after assessing alternatives. The announced transfer of
              vehicles worth about ₦35 billion and the reported ₦57 billion generated by financed vehicles describe
              asset value and driver activity, respectively—not Moove revenue or recoverable cash. Market-level returns,
              liabilities, and proceeds remain unreported.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI014
              - CI015
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI007
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product lines and user workflows
        blocks:
          - type: paragraph
            body: >-
              Moove's original customer-facing product is vehicle access for mobility entrepreneurs through Drive-to-Own
              and rental offerings, with repayment tied to driver revenue rather than conventional fixed monthly
              installments (CE001). Its reported product perimeter has expanded from financing into fleet ownership,
              maintenance, charging, and operating support, including services for autonomous-vehicle fleets (CE005,
              CE008). Reporting also describes an Uber-connected financing offer in India, but the available account
              does not provide a consistent, independently verified outcome measure (CE012). The matrix distinguishes
              evidenced lines from unverified maturity and customer-benefit claims; it is not an exhaustive inventory of
              markets or SKUs.
            claimRefs:
              - CE001
              - CE005
              - CE008
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE008
              - CE009
              - CE012
      - number: '5.2'
        title: Financing workflow and data inputs
        blocks:
          - type: paragraph
            body: >-
              IFC's 2021 description and Moove's own product announcement describe vehicle financing repaid as a
              percentage of weekly driver revenue (CE001). IFC also reported that Moove embedded alternative
              credit-scoring technology in mobility platforms and used performance and revenue analytics for
              underwriting (CE002). A Speedinvest interview with management adds examples of signals said to inform
              credit and risk decisions, including trip frequency, cancellations, ratings, maintenance behavior, and
              earnings stability (CE004). The evidence supports the broad mechanism, not the model's predictive
              performance, data rights, retention practices, or realized loss rates. Historical repayment terms reported
              by IFC are not necessarily current terms (CE003).
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE007
              - CE008
              - CE013
      - number: '5.3'
        title: Autonomous fleet operating layer
        blocks:
          - type: paragraph
            body: >-
              TechCrunch reported in December 2024 that Waymo selected Moove for fleet operations in Phoenix and for
              charging and depot build-out associated with Miami, while noting that the parties did not disclose their
              financial arrangement (CE007, CE013). A later report carrying Moove's announcement described its "Nests"
              as facilities for charging, servicing, maintenance, and fleet orchestration, and reported live operations
              in Phoenix and Miami with London as a future operation (CE008, CE009). This is evidence of a physical
              operating scope, not proof of fleet uptime or customer service levels. The architecture map makes the
              described handoffs explicit while keeping power, site access, and partner data as dependencies rather than
              verified Moove capabilities (CE010, CE014).
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE007
              - CE008
              - CE010
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE004
              - CE010
              - CE014
      - number: '5.4'
        title: Demand alignment and market dependency
        blocks:
          - type: paragraph
            body: >-
              The product's financing logic depends on drivers earning enough from a mobility platform to service
              vehicle payments, and management described platform demand and driver supply as prerequisites for
              expansion (CE006). Business Insider Africa reported Moove's decision to end operations in Nigeria after
              Uber's exit, alongside broader sector pressures; its account does not establish one exclusive cause for
              the decision (CE011). Read together, these sources make partner continuity and local demand important
              product dependencies, rather than proving that the underlying underwriting technology failed globally
              (CE014). The public evidence does not quantify the revenue, assets, or customers affected by the wind-down
              on a consolidated basis.
            claimRefs:
              - CE006
              - CE011
              - CE014
      - number: '5.5'
        title: What remains unverified
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence describes product mechanisms and partner announcements, but does not provide
              independent depot utilization, vehicle uptime, maintenance turnaround, incident rates, or market-level
              service-level agreements. Axios reports that robotaxi depots face land, zoning, and power-access
              constraints, including a supplier estimate of 4 to 12 megawatts per site; this is sector context, not a
              measured Moove requirement or performance result (CE010). The available sources also do not establish
              Moove's cybersecurity controls, privacy and retention practices, safety assurance, or certifications.
              These gaps prevent a diligence conclusion about reliability, control maturity, or the transferability of
              the model across partners and cities.
            claimRefs:
              - CE010
              - CE013
              - CE014
      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The product is an operating system around vehicle access
            body: >-
              Sources describe a progression from revenue-based financing toward maintenance, charging, and fleet
              operations; whether those services deliver repeatable uptime or attractive economics remains unverified.
            calloutType: insight
            claimRefs:
              - CE001
              - CE005
              - CE008
          - type: callout
            title: Partner demand is a product dependency
            body: >-
              Management described platform demand as necessary for the financing model, while reporting connected
              Moove's Nigerian wind-down with Uber's exit; the evidence does not establish a single cause or a global
              failure.
            calloutType: risk
            claimRefs:
              - CE006
              - CE011
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who uses Moove and what they receive
        blocks:
          - type: paragraph
            body: >-
              The clearest disclosed end user is the mobility entrepreneur or ride-hailing driver who needs a vehicle
              but lacks conventional financing access. IFC's 2021 description links vehicle finance to platform
              performance and revenue data, with repayments taken as a percentage of weekly earnings; it also describes
              Moove as Uber's exclusive vehicle-finance and vehicle-supply partner in sub-Saharan Africa. These are
              historical product terms, not proof that every market or contract uses the same structure today. The
              current public evidence spans driver financing, Uber-linked fleet supply, Waymo fleet operations, and
              eligible Nigerian drivers receiving vehicles at wind-down. It does not disclose a complete customer count
              by geography, product, or revenue band, nor whether counterparties are contracted directly or through
              platform arrangements.
            claimRefs:
              - CU001
              - CU002
              - CU003
