chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, origins, and operating model
        blocks:
          - type: paragraph
            body: >-
              Moove was founded in Lagos in 2020 by Ladi Delano and Jide Odunsi to finance vehicles for mobility
              entrepreneurs who had difficulty accessing conventional credit (CO001, CO002). Its original model used
              ride-hailing and driver-performance data to underwrite revenue-based vehicle finance; the company
              describes itself as providing vehicle access and operations for mobility fleets (CO002). IFC and Moove
              described their 2021 relationship as financing for additional cars, including a hybrid-vehicle pilot,
              while TechCrunch's 2022 account described weekly repayments deducted from drivers' earnings (CO002, CO011,
              CO012). A company profile lists Dubai as headquarters and identifies Lagos as its African base; a separate
              profile places the company in the UAE (CO004). Treat the headquarters detail as reported rather than
              independently established.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO011
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO016
      - number: '1.2'
        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Public accounts identify Delano and Odunsi as co-founders and co-CEOs (CO001). The assigned evidence does
              not provide their pre-Moove operating histories, a complete executive roster, board composition, voting
              arrangements, or succession coverage. Forbes Africa describes Delano as co-founder, co-CEO, and
              advisory-board chairman, but this single account does not establish the board's full remit or the
              company's governance rights. The two-person founder table therefore records publicly attributable roles
              and explicitly leaves prior backgrounds and key-person coverage open. Moove's dependence on founders for
              strategic direction, and the extent to which decision-making is distributed, cannot be assessed from these
              sources; an investor-grade diligence review needs the current leadership and governance materials.
            claimRefs:
              - CO001
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
      - number: '1.3'
        title: Financing, reported scale, and company milestones
        blocks:
          - type: paragraph
            body: >-
              In August 2026, Forbes Africa and Nairametrics reported a $250 million Series C at a $2.1 billion
              valuation; Nairametrics named Mubadala as lead, with Woven Capital, Toyota's Growth Fund, and Ion Pacific
              as co-leads (CO005). The reported scale figures are company-attributed: about 42,000 vehicles in 29 cities
              across 13 countries, approximately 3,300 employees, and $420 million of annual recurring revenue (ARR)
              (CO008, CO009, CO016). ARR is not recognized revenue, and the reviewed evidence does not establish current
              revenue, margin, customer count worldwide, or cash available. Cumulative capital is also not settled:
              StartupList reports $697 million across 15 disclosed rounds, whereas Business Insider Africa reports more
              than $710 million in total capital by the Nigeria exit; differing definitions or coverage may explain the
              gap, but the sources do not reconcile it (CO006, CO007). The timeline preserves dated public milestones
              without treating funding raised as deployable cash.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO011
              - CO012
              - CO013
