              - CO015
          - type: figure
            figureRef: FO001
            claimRefs: []
      - number: '1.4'
        title: Partnerships, market exposure, and diligence implications
        blocks:
          - type: paragraph
            body: >-
              Moove's public positioning combines driver vehicle finance with fleet operations. IFC and Moove described
              Uber as an exclusive vehicle financing and supply partner in sub-Saharan Africa, while later reporting
              describes Moove managing Waymo fleet operations in US cities (CO003, CO015, CO016). These are
              strategically important relationships, but the assigned sources do not show contract duration, exclusivity
              scope by market, renewal terms, indemnities, insurance allocation, or revenue concentration. Business
              Insider Africa reports that Moove exited Nigeria in 2026, after Uber announced its own Nigerian departure
              about five weeks earlier; it also reports the transfer of vehicles to eligible drivers (CO010). Moove did
              not provide a specific reason for the exit in that account, so timing alone does not establish that Uber's
              withdrawal caused Moove's decision. The exit makes partner and country concentration a concrete diligence
              issue, not a quantified company-wide exposure.
            claimRefs:
              - CO003
              - CO010
              - CO015
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: vehicle access to fleet infrastructure'
        blocks:
          - type: paragraph
            body: >-
              The evidence supports two related but distinct activities: vehicle access for mobility entrepreneurs and
              operating infrastructure for autonomous fleets. Moove described its original Nigerian model as Rental and
              Drive-to-Own for drivers who lacked vehicle-financing access; the IFC's 2021 partnership described
              financing cars for e-hailing and a pilot hybrid fleet. Those records establish the use case, not the size
              of vehicle-finance spend or Moove's current terms (CM001, CM002). In 2026, Moove's funding coverage
              described expansion into fleet ownership, depots, charging, maintenance and operations (CM012). These
              layers should not be added together: trip fares are downstream mobility-market activity, while financing
              and fleet operations are the potential spend categories relevant to Moove. Current signed prices, contract
              roles and market-wide spend remain undisclosed in this evidence set.
            claimRefs:
              - CM001
              - CM002
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM012
              - CM013
      - number: '2.2'
        title: 'Sizing lenses: broad context is not a serviceable market'
        blocks:
          - type: paragraph
            body: >-
              Fortune Business Insights gives a global robotaxi estimate of USD 1.71 billion for 2022 and forecasts USD
              118.61 billion by 2031, with an 80.8% CAGR for 2022–2031 (CM010). The accessible text does not explain the
              underlying calculation, and its forecast horizon and vintage make it a directional, dated sector estimate
              rather than a current company-specific addressable-spend figure. Two narrower observations answer
              different questions: IFC and Moove estimated up to four million annual Lagos passenger trips enabled by a
              proposed 1,400-car expansion in 2021 (CM003), while Moove-reported Nigerian customer activity exceeded
              9,000 users and approximately NGN 57 billion of revenue generated through financed vehicles (CM005).
              Neither is Moove revenue or a current market size. Moove's separate USD 420 million figure was reported as
              annual recurring revenue (ARR), not as TAM (CM009). No source supports a defensible company-specific SAM
              or SOM; the figure therefore keeps market forecasts, operating scale and company-reported activity in
              separate units rather than inventing addressable-market values.
            claimRefs:
              - CM003
              - CM005
              - CM009
              - CM010
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM005
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM008
              - CM009
              - CM010
      - number: '2.3'
        title: Users, buyers and budget ownership
        blocks:
          - type: paragraph
            body: >-
              The original user is clearest: mobility entrepreneurs and drivers who needed vehicles to earn through
              ride-hailing or related work (CM001). Moove's reported Rental and Drive-to-Own users in Nigeria numbered
              more than 9,000 since inception, but the associated NGN 57 billion is customer revenue generated through
              financed vehicles, not revenue booked by Moove (CM005). The IFC account places e-hailing platforms in the
              operating chain, including a 2021 exclusive vehicle-financing and supply relationship, while the later
              company narrative points to fleet operators as users of autonomy infrastructure (CM002, CM012). Passengers
              are downstream users measured in IFC's trip estimate, not established buyers of Moove services. The
              evidence does not identify today's budget owner, contract payer, pricing, renewal terms or adoption
              threshold for any segment; the map separates observed users from those unresolved commercial roles.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM008
              - CM012
              - CM013
      - number: '2.4'
        title: Adoption drivers, constraints and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The financing thesis responds to a documented access constraint: IFC's 2021 account said Nigerian
              ride-hailing platforms struggled to meet growing user demand because drivers lacked vehicle financing
              (CM002). That is historical evidence, not proof of present demand or current underwriting quality. The
              adverse signal is material: Moove announced that it would end Nigerian operations shortly after Uber's
              exit, and Business Insider reported sector pressures including fuel and maintenance costs, driver
              complaints about commissions and fares, inflation and weak purchasing power (CM004, CM006, CM007). Moove
              did not give a Nigeria-specific reason in that reporting (CM006). For robotaxis, Gasgoo describes
              substantial upfront investment, city-level economics that may not generalize to company profitability, and
              unresolved liability and insurance rules (CM011). These are sector constraints, not measured Moove
              results. Investment diligence should obtain city-level utilization, contribution margins, capital needs,
              customer budgets and signed partner terms before treating either opportunity as scalable.
            claimRefs:
              - CM002
              - CM004
              - CM006
              - CM007
              - CM011
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: A layered field, not a single head-to-head
        blocks:
          - type: paragraph
            body: >-
              The most defensible competitive frame separates vehicle financing for mobility workers from fleet
              operations and autonomous-vehicle infrastructure. Moove's reported Drive-to-Own and rental products
              address access to vehicles; its wider positioning adds fleet management and operations for platform and
              autonomous-mobility partners. Those roles can make Moove both a supplier to an ecosystem participant and a
              potential alternative to capabilities that the participant brings in-house. The assigned sources document
              Uber and Waymo relationships, but do not establish exclusivity or full contract economics. Nigeria's
              recent Uber and Moove departures are a concrete warning that partnership-based demand can change abruptly,
              not proof that every market has the same dependency.
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
