              - CP004
              - CP005
              - CP006
              - CP007
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.2'
        title: Distribution power can become infrastructure competition
        blocks:
          - type: paragraph
            body: >-
              Uber's current strategy is the clearest internal-build and channel-power case in the assigned evidence.
              Axios reports that Uber is leasing and equipping depots, investing in fast-charging hubs, and using trip
              data to select locations; it also describes Uber's shift from an asset-light model toward infrastructure
              and partner commitments. This overlaps with the physical operations Moove describes, while Uber's
              marketplace and network data create a different source of leverage. Moove's Waymo work is a
              partnership-led route into AV fleet operations, not evidence that Moove owns the underlying
              autonomous-driving technology. The positioning figure therefore codes documented activity, not market
              share, technical quality, or a forecast of who wins.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
