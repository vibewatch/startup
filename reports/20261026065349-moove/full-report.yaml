              - CR012
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Nigeria is a demonstrated concentration warning
            body: >-
              Moove's Uber-linked Nigerian financing channel ended after Uber's local departure; the announced vehicle
              transfer mitigates some customer exposure but does not prove title completion or restore operating demand.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
          - type: callout
            title: Global scale does not establish local or fleet-level returns
            body: >-
              Reported vehicle counts, ARR, and financing proceeds do not disclose market-level margins, cash
              conversion, debt service, or autonomous-depot payback.
            calloutType: insight
            claimRefs:
              - CR008
              - CR009
              - CR012
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price reference and investment call
        blocks:
          - type: paragraph
            body: >-
              Moove announced a $250 million Series C at a $2.1 billion valuation, as reported by TechCrunch and stated
              in the Mubadala release (CV001). Moove's release also reports $420 million of ARR; dividing the announced
              valuation by that company-reported ARR gives an illustrative 5.0x valuation-to-ARR ratio, not a revenue
              multiple, earnings multiple, or independently validated benchmark (CV002, CV003). The public materials do
              not establish whether the valuation is pre- or post-money or provide share-class, preference, or dilution
              terms. News coverage that repeats the same announcement is not independent price discovery, and the
              available funding comparison is not a valuation comparable (CV012). The evidence therefore supports
              neither a precise fair-value range nor an entry-price target. Recommendation: research-more, low
              confidence, with an unknown valuation stance and high underwriting uncertainty; defer price approval
              pending audited financials, unit economics, and round documents.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV009
              - CV013
      - number: '8.2'
        title: Investment thesis and countercase
        blocks:
          - type: paragraph
            body: >-
              The bull case is that an operating footprint built for human-driven fleets can extend into autonomous
              mobility: Moove and TechCrunch report approximately 42,000 vehicles, while Moove describes a $420 million
              ARR base and autonomous operations with Waymo (CV002, CV004, CV009). The company says Series C proceeds
              will fund autonomous fleet ownership, robotics-first depots, and new-market launches, while its chief
              executive told TechCrunch the traditional mobility business was set to achieve full profitability in 2026
              (CV006, CV007). These are useful scale and strategic signals, not proof of margins, cash conversion, or
              returns on new assets. The countercase is that Moove's own expansion plan requires capital-intensive
              fleets and depots; TechCrunch reported that the company intended to use debt to buy robotaxis and gave no
              purchase timeline (CV009). The country denominator also differs between TechCrunch and the company's
              release (CV005), reinforcing the need to reconcile operating data before underwriting scale.
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV007
              - CV009
              - CV010
              - CV011
              - CV013
      - number: '8.3'
        title: Scenario framework and diligence gates
        blocks:
          - type: paragraph
            body: >-
              The bull, base, and bear cases below are conditional underwriting paths, not price targets or
              probability-weighted forecasts. The bull case requires recurring ARR to convert into durable contribution
              margin and autonomous deployments to earn attractive returns on fleet, charging, and depot capital; the
              base case assumes legacy operations remain viable while AV economics are not yet proven; the bear case
              reflects debt-funded asset growth, partner dependence, or weak utilization overwhelming scale benefits
              (CV006, CV007, CV009, CV011). The retained sources do not supply gross margin, cash flow, debt schedule,
              contracted unit economics, liquidation preferences, or an exit timetable, so assigning valuation ranges or
              numerical probabilities would create false precision. Before investment, request audited consolidated
              statements and segment economics, cap-table and financing documents, fleet-level utilization and return
              data, and partner contracts with insurance and renewal terms. Re-underwrite only when those records
              reconcile the public ARR and fleet disclosures and permit a suitable comparable set.
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV009
              - CV011
              - CV013
