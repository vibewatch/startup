            - Performance and revenue data
        - title: Vehicle financing
          label: Vehicle financing
          detail: IFC described financing new vehicles, including loans covering up to 95 percent of purchase price.
          touchpoints:
            - Vehicle supplied
            - Financing decision
        - title: Customer operation
          label: Customer operation
          detail: >-
            Drivers use financed vehicles to provide mobility services; IFC estimated additional Lagos cars could enable
            four million passenger trips per year.
          touchpoints:
            - Vehicle in service
            - Passenger trips are an estimate
        - title: Revenue-linked repayment
