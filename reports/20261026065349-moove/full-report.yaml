  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and reported scale
        blocks:
          - type: paragraph
            body: >-
              Moove's original product is a financing mechanism attached to productive vehicles: IFC described the
              company selling new vehicles, financing up to 95% of their purchase price, and collecting repayments as a
              share of customers' weekly revenues over 24-, 36- or 48-month terms. Tracxn likewise describes
              revenue-based vehicle finance, although neither source supplies realized yields, delinquencies, or the
              current portfolio balance. This model exposes Moove to vehicle funding and repayment performance, rather
              than SaaS-style recurring revenue alone. The company now also describes fleet ownership and operations for
              autonomous vehicles, including charging, maintenance, and robotics-enabled depots; no disclosed split
              shows how much revenue comes from financing, rentals, fleet operations, or depot services. [CI001] [CI002]
              [CI003] [CI009]
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI010
          - type: table
            tableRef: TI001
            claimRefs:
