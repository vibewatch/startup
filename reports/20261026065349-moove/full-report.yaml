        min: 0
        max: 2
        low: Not evidenced in assigned sources
        high: Explicit operating or scaled activity
        description: >-
          Ordinal evidence coding: 0 means not evidenced in this pool, 1 means partner-linked or planned activity, and 2
          means active fleet/service operations or explicit infrastructure buildout.
        scale: ordinal
      yAxis:
        label: AV technology or service role evidenced
        min: 0
        max: 2
