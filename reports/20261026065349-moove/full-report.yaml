              - CP008
              - CP009
              - CP010
              - CP012
              - CP013
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP008
              - CP012
              - CP013
      - number: '3.3'
        title: Robotaxi entrants broaden the displacement set
        blocks:
          - type: paragraph
            body: >-
              Gasgoo's 2026 industry overview names automakers and technology providers entering robotaxis, including
              XPeng, Geely, Pony.ai, WeRide, and Baidu Apollo Go. It describes distinct routes: native vehicle design,
              adaptation from driver-assistance systems, and localized fleet services. These are potential substitutes
              for pieces of an AV operating stack, not proven direct substitutes for Moove's full service. The same
              article reports positive unit economics in selected cities for some operators while warning that a
              city-level result does not establish company-wide profitability; new-city fixed costs, demand saturation,
              system reliability, and unresolved liability rules keep the infrastructure thesis exposed to execution
              risk. The evidence does not provide a consistent competitor-level fleet, revenue, or cost denominator.
            claimRefs:
              - CP012
              - CP013
      - number: '3.4'
        title: Pricing and switching economics remain diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The reviewed public material describes Moove's product categories and selected partner activity but
              supplies no comparable customer rates, repayment schedule, contract duration, take rate, or competitor
              price per vehicle. Nor does it establish how easily drivers, fleet owners, or AV partners can multi-home
              or switch providers. Moove's Nigerian exit after Uber's departure makes counterparty resilience especially
              relevant, but source coverage does not show that the same dependency applies globally. Until signed terms,
              cohort retention, utilization, and city-level operating economics are available, claims of a durable moat
              should be treated as hypotheses rather than demonstrated buyer lock-in.
            claimRefs:
              - CP001
              - CP010
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
