              - CU007
              - CU009
              - CU010
              - CU011
      - number: '6.3'
        title: Named relationships and limits of customer proof
        blocks:
          - type: paragraph
            body: >-
              Uber is the best-documented platform relationship: IFC described an exclusive financing and vehicle-supply
              role in sub-Saharan Africa, and The Ken identified Moove among Uber's fleet partners for a planned India
              electric-cab rollout. The Waymo relationship is a distinct operating use case; reporting says Moove
              manages autonomous fleets and related infrastructure in Phoenix and Miami. These sources support named
              counterparties and operating roles, but do not disclose contract value, renewal rights, fleet-level
              output, service levels, or customer references. One India article also names a driver in an adverse
              vehicle-impoundment account; that single reported case is not a measured default-rate or
              customer-satisfaction result.
            claimRefs:
              - CU005
              - CU008
              - CU012
              - CU013
              - CU014
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Durability, expansion, and concentration remain open
        blocks:
          - type: paragraph
            body: >-
              The Nigeria exit is a concrete test of local customer durability: eligible vehicle users were reported to
              receive ownership of vehicles worth more than ₦35 billion, while the reported customer base exceeded
              9,000. Coverage differs on causation. Marketing Analytics Africa says the Uber departure materially
              changed the operating environment and attributes the exit to it, while Business Insider Africa says Moove
              had not disclosed a specific reason. The timing and partner dependence warrant diligence, but do not alone
              prove the cause of exit or the health of other markets. Expansion into Waymo fleet operations may broaden
              the customer mix, yet the assigned evidence does not show the share of revenue, assets, or utilization
              tied to any partner. Retention, customer concentration, contract terms, and outcomes remain material
              evidence gaps.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
