        title: Exhibits
        blocks:
          - type: callout
            title: Customer proof is strongest at the operating-relationship level
            body: >-
              Public evidence names Uber and Waymo and describes deployed operating roles, but it does not provide
              independently referenced customer outcomes or retention data.
            calloutType: insight
            claimRefs:
              - CU005
              - CU012
