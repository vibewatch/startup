      - number: '6.2'
        title: Adoption signals are operational, not retention proof
        blocks:
          - type: paragraph
            body: >-
              Public operating indicators are uneven and should not be collapsed into a single growth curve. IFC's 2021
              financing announcement projected up to 1,400 additional Lagos cars and estimated four million passenger
              trips per year, while later coverage reported more than 9,000 Nigerian customers and about 42,000 vehicles
              across 29 cities in 13 countries. Those figures describe different populations and periods: a
              financing-supported vehicle addition, customers who used Nigerian products, and a global vehicle fleet. A
              Tech In Africa article gives inconsistent India trip totals, so neither figure is treated as a reliable
              comparable series. The sources provide no cohort retention, repeat-purchase, churn, renewal, utilization
              denominator, or market-level revenue split. Fleet and trip counts therefore establish reported deployment,
              not customer durability or economics.
            claimRefs:
              - CU004
              - CU006
              - CU007
              - CU009
              - CU010
              - CU011
              - CU015
          - type: table
            tableRef: TU002
