schemaVersion: "report-v2"
artifact: competitors
slug: moove
runDate: 2026-10-26
company:
  name: Moove
chapter:
  number: 3
  title: Competitors
  summary: >-
    Moove competes across vehicle access, fleet operations, and the physical layer
    of autonomous mobility rather than as a single-purpose ride-hailing rival.
    Current evidence shows meaningful platform dependence in Nigeria and an
    infrastructure race in which Uber and robotaxi operators may build or control
    capabilities that Moove also supplies; comparable pricing, partner terms, and
    market-level economics remain undisclosed.
sections:
  - id: layered-market
    title: A layered field, not a single head-to-head
    body: >-
      The most defensible competitive frame separates vehicle financing for
      mobility workers from fleet operations and autonomous-vehicle infrastructure.
      Moove's reported Drive-to-Own and rental products address access to vehicles;
      its wider positioning adds fleet management and operations for platform and
      autonomous-mobility partners. Those roles can make Moove both a supplier to
      an ecosystem participant and a potential alternative to capabilities that
      the participant brings in-house. The assigned sources document Uber and
      Waymo relationships, but do not establish exclusivity or full contract
      economics. Nigeria's recent Uber and Moove departures are a concrete warning
      that partnership-based demand can change abruptly, not proof that every
      market has the same dependency.
    claimRefs: [CP003, CP005, CP006, CP007, CP010]
    tableRefs: [TP001]
  - id: control-and-distribution
    title: Distribution power can become infrastructure competition
    body: >-
      Uber's current strategy is the clearest internal-build and channel-power
      case in the assigned evidence. Axios reports that Uber is leasing and
      equipping depots, investing in fast-charging hubs, and using trip data to
      select locations; it also describes Uber's shift from an asset-light model
      toward infrastructure and partner commitments. This overlaps with the
      physical operations Moove describes, while Uber's marketplace and network
      data create a different source of leverage. Moove's Waymo work is a
      partnership-led route into AV fleet operations, not evidence that Moove owns
      the underlying autonomous-driving technology. The positioning figure
      therefore codes documented activity, not market share, technical quality,
      or a forecast of who wins.
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: robotaxi-competition
    title: Robotaxi entrants broaden the displacement set
    body: >-
      Gasgoo's 2026 industry overview names automakers and technology providers
      entering robotaxis, including XPeng, Geely, Pony.ai, WeRide, and Baidu
      Apollo Go. It describes distinct routes: native vehicle design, adaptation
      from driver-assistance systems, and localized fleet services. These are
      potential substitutes for pieces of an AV operating stack, not proven
      direct substitutes for Moove's full service. The same article reports
      positive unit economics in selected cities for some operators while warning
      that a city-level result does not establish company-wide profitability;
      new-city fixed costs, demand saturation, system reliability, and unresolved
      liability rules keep the infrastructure thesis exposed to execution risk.
      The evidence does not provide a consistent competitor-level fleet,
      revenue, or cost denominator.
    claimRefs: [CP012, CP013]
  - id: pricing-and-durability
    title: Pricing and switching economics remain diligence gaps
    body: >-
      The reviewed public material describes Moove's product categories and
      selected partner activity but supplies no comparable customer rates,
      repayment schedule, contract duration, take rate, or competitor price per
      vehicle. Nor does it establish how easily drivers, fleet owners, or AV
      partners can multi-home or switch providers. Moove's Nigerian exit after
      Uber's departure makes counterparty resilience especially relevant, but
      source coverage does not show that the same dependency applies globally.
      Until signed terms, cohort retention, utilization, and city-level operating
      economics are available, claims of a durable moat should be treated as
      hypotheses rather than demonstrated buyer lock-in.
    claimRefs: [CP001, CP010, CP014, CP015, CP016]
    tableRefs: [TP003]
tables:
  - id: TP001
    title: Selected competitor and alternative profiles
    columns:
      - Competitor or alternative
      - Category
      - Public scale or funding in assigned sources
      - Target customer or role
      - Evidenced differentiation
      - Limitation or uncertainty
    rows:
      - - Moove
        - Vehicle access, fleet operations, and AV infrastructure partner
        - About 42,000 vehicles across 29 cities and 13 countries reported in 2026; $250 million Series C at a reported $2.1 billion valuation
        - Mobility workers, ride-hailing platforms, and AV operators
        - Combines Drive-to-Own/rental with fleet operations and partner-linked AV activity
        - Announced an end to Nigeria operations; public pricing and partner terms are not disclosed here
      - - Uber
        - Ride-hailing platform and expanding AV infrastructure investor/operator
        - Axios reports 30+ AV partners; a planned Houston depot is 50,000 square feet with 40 chargers and 15 maintenance bays
        - Riders, drivers, and AV partners
        - Network and trip-location data plus depot and charging investment
        - Could internalize or control infrastructure Moove may otherwise supply; announced plans are not completed capacity
      - - Waymo
        - Autonomous-driving operator and Moove partner
        - Moove-related reporting identifies operations in Phoenix and Miami; no comparable Waymo fleet or funding metric is provided
        - Robotaxi riders and fleet operations partners
        - Autonomous-driving capability paired with a partner operating layer
        - Assigned sources do not disclose Moove contract scope, economics, or exclusivity
      - - Pony.ai, WeRide, Baidu Apollo Go
        - Robotaxi developers and localized service operators
        - Gasgoo reports city-level economics and vehicle-cost developments, but metrics differ by company and geography
        - Local robotaxi fleets and technology/vehicle ecosystems
        - Technology-led or localized operating models
        - Not shown to replace Moove's financing and fleet-services bundle; company-wide profitability remains unproven
      - - XPeng and Geely
        - Automakers developing native robotaxi vehicles
        - Gasgoo describes prototypes and planned deployment; no comparable operating fleet scale is provided
        - Robotaxi operators seeking purpose-built vehicles
        - Vehicle design and production integrated with autonomous systems
        - Upfront platform and production-line investment increases downside if adoption misses expectations
      - - Nigeria ride-hailing alternatives and exits
        - Local platform/substitute set; historical exits are not current alternatives
        - Business Insider identifies SafeBoda, Hytch, Uber, and Moove among notable exits or shutdowns over five years
        - Drivers and mobility customers in Nigeria
        - Evidence illustrates an unstable local platform landscape
        - The source set does not identify or size surviving substitutes or driver switching destinations
    notes: >-
      Partial, selected examples rather than an exhaustive market census. Scale
      measures have different dates and scopes and are not directly comparable;
      reported funding and valuation are not operating capacity or cash available.
      Empty competitor metrics are evidence gaps, not zero values.
    enumerationScope:
      coverage: partial
      basis: Selected publicly documented mobility and robotaxi alternatives in the assigned 2026 evidence pool.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP007, CP010, CP011, CP012, CP013]
  - id: TP002
    title: Capability and distribution comparison
    columns:
      - Buying criterion
      - Moove
      - Uber
      - Robotaxi developers / automakers
      - Evidence boundary
    rows:
      - - Driver vehicle access
        - Drive-to-Own and rental products are reported
        - Not established as a Moove-like driver financing offer in assigned sources
        - Not established as comparable driver financing
        - Product-level overlap and eligibility terms are unknown
      - - Fleet operations and maintenance
        - Fleet operations are part of Moove's reported offer
        - Depot, charging, and maintenance infrastructure investment is reported
        - Several operators report localized services; OEM programs vary
        - Ownership, outsourcing, and contract boundaries are not comparable
      - - AV technology
        - Waymo-linked operations are reported; Moove technology ownership is not established
        - Works with multiple AV partners, according to Axios
        - Gasgoo describes in-house and partner technology paths
        - No like-for-like safety, uptime, or autonomy benchmark is available
      - - Distribution and location data
        - Platform partnerships and multi-city footprint are reported
        - Trip data and ride-hailing network inform infrastructure siting
        - Localized city operations are described
        - Customer acquisition cost and demand access are not disclosed
      - - Trust, regulation, and liability
        - No comparable record in the assigned sources
        - Uber is committing to partner-led AV deployments
        - Gasgoo notes unresolved liability and insurance rules in some markets
        - No source supports a relative compliance or safety ranking
      - - Switching and partner access
        - Nigerian dependence on Uber is evidenced; contract terms are not
        - Internal infrastructure investment can reduce reliance on third parties
        - Partner and platform arrangements vary
        - Exclusivity, renewal, multi-homing, and switching costs remain unknown
    notes: >-
      Evidence-led comparison, not a scored feature audit. "Not established"
      means the assigned sources do not substantiate the capability; it does not
      mean the provider lacks it.
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP010, CP012, CP013, CP016]
  - id: TP003
    title: Pricing and packaging evidence
    columns:
      - Provider or offer
      - Disclosed packaging in assigned sources
      - Price, unit, or contract
      - Switching / lock-in evidence
      - Investor implication
    rows:
      - - Moove Drive-to-Own and rental
        - Vehicle access and rental products are reported
        - No comparable rate, repayment schedule, or take rate disclosed
        - No retention, multi-homing, or contract term disclosed
        - Underwrite driver affordability and asset recovery by market
      - - Uber platform and AV infrastructure
        - Ride-hailing network plus depot and charging investments are reported
        - No comparable partner price, service contract, or unit rate disclosed
        - Nigeria exit and partner shifts show exposure, but no exclusivity terms are public here
        - Test whether platform control permits in-house substitution
      - - Robotaxi operators and vehicle programs
        - City services, vehicle programs, and selected unit-economics claims are reported
        - No comparable customer fare, fleet-service fee, or vehicle contract disclosed
        - No switching or supplier concentration evidence disclosed
        - Do not infer provider margins from city-level economics
    notes: >-
      Public sources reviewed for this chapter do not provide like-for-like
      realized prices or contract terms. "Not disclosed" is scoped to the
      assigned evidence and is not evidence that no such terms exist.
    claimRefs: [CP005, CP008, CP012, CP013, CP015, CP016]
figures:
  - id: FP001
    title: "Documented role positioning: Moove, platforms, and robotaxi entrants"
    type: quadrant
    summary: >-
      Ordinal coding of activity described in assigned sources, not a ranking,
      market-share estimate, or measure of technical quality.
    data:
      xAxis:
        label: Physical fleet or infrastructure activity evidenced
        min: 0
        max: 2
        low: Not evidenced in assigned sources
        high: Explicit operating or scaled activity
        description: >-
          Ordinal evidence coding: 0 means not evidenced in this pool, 1 means
          partner-linked or planned activity, and 2 means active fleet/service
          operations or explicit infrastructure buildout.
        scale: ordinal
      yAxis:
        label: AV technology or service role evidenced
        min: 0
        max: 2
        low: Not evidenced in assigned sources
        high: Explicit AV technology or service operation
        description: >-
          Ordinal evidence coding: 0 means not evidenced in this pool, 1 means
          partner ecosystem activity, and 2 means a named AV product or service
          operation; it does not score safety or autonomy quality.
        scale: ordinal
      points:
        - label: Moove
          x: 2
          y: 1
          summary: Reported multi-city fleet scale and Waymo-linked AV operations; no AV technology ownership established.
        - label: Uber
          x: 1
          y: 1
          summary: Planned depot and charging investments plus a broad AV partner network.
        - label: Waymo
          x: 1
          y: 2
          summary: Named AV operator in Moove-linked fleet operations; partner scope is not disclosed.
        - label: Pony.ai
          x: 2
          y: 2
          summary: Gasgoo reports robotaxi business activity and positive unit economics in selected cities.
        - label: WeRide
          x: 2
          y: 2
          summary: Gasgoo reports robotaxi business activity and city-level unit-economics progress.
        - label: Baidu Apollo Go
          x: 2
          y: 2
          summary: Gasgoo reports operations in some profitable cities and a Wuhan service interruption.
    approximationNotes: >-
      Ordinal positions encode only the cited descriptions: 0=not evidenced,
      1=partner-linked or planned, 2=active/scaled activity. Coincident values
      are intentional; coordinates do not imply a ranking, market share,
      asset ownership, safety, profitability, or forecast.
    claimRefs: [CP002, CP006, CP007, CP008, CP012, CP013]
