artifact: company-overview
slug: moove
runDate: 2026-10-26
company:
  name: Moove
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Moove is a Lagos-founded mobility-finance company that has expanded from
    revenue-based vehicle financing into autonomous-fleet operations. Public
    reporting places it at a $2.1 billion valuation after its 2026 Series C,
    while key financial definitions, cumulative capital totals, governance,
    and market-level economics remain undisclosed or unreconciled.
sections:
  - id: identity-and-model
    title: Identity, origins, and operating model
    body: >-
      Moove was founded in Lagos in 2020 by Ladi Delano and Jide Odunsi to
      finance vehicles for mobility entrepreneurs who had difficulty accessing
      conventional credit (CO001, CO002). Its original model used ride-hailing
      and driver-performance data to underwrite revenue-based vehicle finance;
      the company describes itself as providing vehicle access and operations
      for mobility fleets (CO002). IFC and Moove described their 2021
      relationship as financing for additional cars, including a hybrid-vehicle
      pilot, while TechCrunch's 2022 account described weekly repayments
      deducted from drivers' earnings (CO002, CO011, CO012). A company profile
      lists Dubai as headquarters and identifies Lagos as its African base;
      a separate profile places the company in the UAE (CO004). Treat the
      headquarters detail as reported rather than independently established.
    claimRefs: [CO001, CO002, CO004, CO011, CO012]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founders, leadership, and governance visibility
    body: >-
      Public accounts identify Delano and Odunsi as co-founders and co-CEOs
      (CO001). The assigned evidence does not provide their pre-Moove operating
      histories, a complete executive roster, board composition, voting
      arrangements, or succession coverage. Forbes Africa describes Delano as
      co-founder, co-CEO, and advisory-board chairman, but this single account
      does not establish the board's full remit or the company's governance
      rights. The two-person founder table therefore records publicly
      attributable roles and explicitly leaves prior backgrounds and
      key-person coverage open. Moove's dependence on founders for strategic
      direction, and the extent to which decision-making is distributed, cannot
      be assessed from these sources; an investor-grade diligence review needs
      the current leadership and governance materials.
    claimRefs: [CO001]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing, reported scale, and company milestones
    body: >-
      In August 2026, Forbes Africa and Nairametrics reported a $250 million
      Series C at a $2.1 billion valuation; Nairametrics named Mubadala as
      lead, with Woven Capital, Toyota's Growth Fund, and Ion Pacific as
      co-leads (CO005). The reported scale figures are company-attributed:
      about 42,000 vehicles in 29 cities across 13 countries, approximately
      3,300 employees, and $420 million of annual recurring revenue (ARR)
      (CO008, CO009, CO016). ARR is not recognized revenue, and the reviewed evidence
      does not establish current revenue, margin, customer count worldwide, or
      cash available. Cumulative capital is also not settled: StartupList
      reports $697 million across 15 disclosed rounds, whereas Business
      Insider Africa reports more than $710 million in total capital by the
      Nigeria exit; differing definitions or coverage may explain the gap, but
      the sources do not reconcile it (CO006, CO007). The timeline preserves
      dated public milestones without treating funding raised as deployable
      cash.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO011, CO012, CO013, CO014, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: partnerships-and-exposure
    title: Partnerships, market exposure, and diligence implications
    body: >-
      Moove's public positioning combines driver vehicle finance with fleet
      operations. IFC and Moove described Uber as an exclusive vehicle
      financing and supply partner in sub-Saharan Africa, while later reporting
      describes Moove managing Waymo fleet operations in US cities (CO003,
      CO015, CO016). These are strategically important relationships, but the
      assigned sources do not show contract duration, exclusivity scope by
      market, renewal terms, indemnities, insurance allocation, or revenue
      concentration. Business Insider Africa reports that Moove exited
      Nigeria in 2026, after Uber announced its own Nigerian departure about
      five weeks earlier; it also reports the transfer of vehicles to eligible
      drivers (CO010). Moove did not provide a specific reason for the exit in that
      account, so timing alone does not establish that Uber's withdrawal
      caused Moove's decision. The exit makes partner and country concentration
      a concrete diligence issue, not a quantified company-wide exposure.
    claimRefs: [CO003, CO010, CO015]
