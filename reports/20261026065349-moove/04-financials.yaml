schemaVersion: "report-v2"
artifact: financials
slug: moove
runDate: "2026-10-26"
company:
  name: Moove
chapter:
  number: 4
  title: Financials
  summary: >-
    Moove's public evidence describes a revenue-linked vehicle-financing model that is
    expanding into autonomous-fleet operations, supported by a $250 million Series C
    reported at a $2.1 billion valuation. The available record does not disclose the
    recognized revenue, margins, liquidity, debt schedule, or asset-level economics
    needed to underwrite the transition, while the Nigerian exit is a concrete warning
    that platform-dependent fleet economics can fail at market level.
sections:
  - id: revenue-engine
    title: Revenue model and reported scale
    body: >-
      Moove's original product is a financing mechanism attached to productive vehicles:
      IFC described the company selling new vehicles, financing up to 95% of their purchase
      price, and collecting repayments as a share of customers' weekly revenues over
      24-, 36- or 48-month terms. Tracxn likewise describes revenue-based vehicle finance,
      although neither source supplies realized yields, delinquencies, or the current
      portfolio balance. This model exposes Moove to vehicle funding and repayment
      performance, rather than SaaS-style recurring revenue alone. The company now also
      describes fleet ownership and operations for autonomous vehicles, including charging,
      maintenance, and robotics-enabled depots; no disclosed split shows how much revenue
      comes from financing, rentals, fleet operations, or depot services.
      [CI001] [CI002] [CI003] [CI009]
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI010
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: economics-and-disclosure
    title: Unit economics remain unproven
    body: >-
      Company and media materials report approximately $420 million of annual recurring
      revenue (ARR), about 42,000 vehicles across 29 cities in 13 countries, and roughly
      3,300 employees. ARR is not a disclosure of recognized revenue, gross profit, or cash
      generation, and the reported fleet and headcount do not reveal vehicle utilization,
      revenue per vehicle, financing cost, servicing burden, or contribution margin.
      Public materials reviewed here provide no segment revenue mix, realized customer
      pricing, customer-acquisition cost, payback, default rate, or depot-level economics.
      The operational bridge is especially important in autonomous mobility: vehicles
      waiting for charging or service are not earning fares, while site selection and
      power access constrain uptime. Axios reports general sector requirements and
      expert estimates, not Moove-specific capex or profitability; those benchmarks
      sharpen the diligence questions but cannot fill the private-data gap.
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI011
      - CI012
      - CI013
    tableRefs:
      - TI003
  - id: capital-and-market-risk
    title: Capital capacity and market-level proof
    body: >-
      Moove announced a $250 million Series C at a $2.1 billion valuation, with proceeds
      intended to support autonomous fleets, Nests infrastructure, and new markets. This
      is capital raised, not cash currently available: the assigned sources do not show
      cash on hand, operating burn, debt maturities, covenants, or runway. Public cumulative
      funding totals also conflict: Tracxn reports $472 million, while Business Insider
      Africa describes more than $710 million, with no consistent reconciliation of
      included debt, equity, or transaction scope. The Nigerian wind-down is adverse
      evidence against assuming the historical model scales uniformly: Moove's co-CEO
      said Uber had been the principal platform supporting the Nigerian model and that
      the company could not sustain it after assessing alternatives. The announced
      transfer of vehicles worth about ₦35 billion and the reported ₦57 billion generated
      by financed vehicles describe asset value and driver activity, respectively—not
      Moove revenue or recoverable cash. Market-level returns, liabilities, and proceeds
      remain unreported.
    claimRefs:
      - CI007
      - CI008
      - CI009
      - CI014
      - CI015
    tableRefs:
      - TI002
    figureRefs: []
tables:
  - id: TI001
    title: Revenue streams and evidence status
    columns:
      - Stream
      - Mechanism evidenced
      - Public value or status
      - Underwriting implication
    rows:
      - - Driver vehicle financing
        - Vehicle purchase financing repaid from a share of weekly customer revenue.
        - Contract mechanics disclosed historically; current book and yield unavailable.
        - Requires loan-level balances, funding cost, arrears, and loss data.
      - - Driver rental and drive-to-own
        - Moove reports both products in Nigeria; eligible vehicles were transferred at exit.
        - More than 9,000 customers used the products in Nigeria, according to Moove.
        - Customer count and asset transfer do not establish company revenue or returns.
      - - Autonomous fleet operations
        - Company materials describe fleet ownership, management, charging, maintenance, and operations.
        - No segment revenue, contract terms, or realized pricing disclosed.
        - Partner concentration, utilization, uptime, and cost allocation are unknown.
      - - Nests / depot services
        - Company describes robotics-enabled depots supporting charging, service, and maintenance.
        - Expansion is a stated use of Series C proceeds; revenue contribution undisclosed.
        - Capex, site utilization, power costs, and customer billing need verification.
    notes: >-
      Public materials combine company statements and third-party reporting; blanks mean
      not disclosed in the assigned evidence, not zero. Historical Nigeria metrics are
      not presented as current company revenue.
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI006
      - CI008
      - CI010
  - id: TI002
    title: Pricing, financing, and capital disclosed
    columns:
      - Item
      - Reported terms or amount
      - Period / scope
      - What remains unknown
    rows:
      - - Vehicle financing share
        - Up to 95% of vehicle purchase price financed; repayment from a percentage of weekly revenue.
        - IFC description of Moove's 2021 model.
        - Current product terms, realized yield, and loss experience.
      - - Repayment tenor
        - 24, 36, or 48 months.
        - Terms described by IFC in 2021.
        - Current contract mix, delinquency, and early repayment.
      - - IFC financing package
        - $20 million total; up to $10 million from IFC and $10 million mobilized through MCPP.
        - Announced August 2021.
        - Outstanding balance, repayment, and subsequent debt obligations.
      - - Series C
        - $250 million raised at a reported $2.1 billion valuation.
        - Announced in 2026; proceeds planned for AV fleets, depots, and market expansion.
        - Cash remaining, deployment schedule, restrictions, and runway.
      - - Customer pricing / realized economics
        - Not disclosed in the assigned public sources.
        - Current consolidated operating performance.
        - List versus realized price, fees, revenue mix, and gross margin.
    notes: >-
      Funding raised, valuation, and historical loan terms are distinct measures; none is
      cash available, recognized revenue, or evidence of a current return on invested capital.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI007
      - CI013
  - id: TI003
    title: "Unit economics: reported metrics and diligence gaps"
    columns:
      - Metric
      - Public figure
      - Confidence / limitation
      - Diligence request
    rows:
      - - Annual recurring revenue (ARR)
        - Approximately $420 million.
        - Company-reported; not a disclosed GAAP revenue or cash-flow figure.
        - Reconcile ARR to recognized revenue, collections, and contract liabilities.
      - - Gross margin / contribution margin
        - Not disclosed.
        - No segment or vehicle-cohort margin in assigned sources.
        - Obtain audited statements and contribution by product, market, and cohort.
      - - Fleet utilization and uptime
        - Not disclosed for Moove's fleet.
        - Axios provides sector context, not company utilization.
        - Request vehicle-day utilization, downtime, charger use, and service cost per unit.
      - - Financing yield and credit loss
        - Not disclosed for current portfolio.
        - Historical repayment mechanics do not quantify realized performance.
        - Request portfolio yield, delinquency, default, recovery, and funding cost.
      - - Customer acquisition cost and payback
        - Not disclosed.
        - No sales efficiency or channel economics in assigned sources.
        - Request cohort CAC, payback, retention, and partner/channel fees.
    notes: >-
      Null or unavailable means no suitable company-specific value was found in the
      assigned sources; no proxy estimate is substituted.
    claimRefs:
      - CI004
      - CI005
      - CI011
      - CI012
      - CI013
figures:
  - id: FI001
    title: Vehicle-finance and fleet-operations revenue bridge
    type: flow
    summary: >-
      The evidence describes a revenue-linked vehicle-financing loop and an AV operating
      layer, but does not disclose the costs or contribution margin needed to complete it.
    data:
      nodes:
        - id: capital
          label: Debt and equity capital
          detail: Historical IFC financing and later equity rounds are reported.
        - id: assets
          label: Vehicles and fleet infrastructure
          detail: Vehicle financing is evidenced; AV infrastructure expansion is a stated use of proceeds.
        - id: customer-use
          label: Driver or fleet use
          detail: Drivers use financed vehicles; Moove also describes autonomous fleet operations.
        - id: activity
          label: Weekly vehicle-generated activity
          detail: IFC describes repayment from a share of weekly customer revenue.
        - id: repayment
          label: Financing repayment to Moove
          detail: Historical contract terms include 24-, 36-, or 48-month options.
        - id: operating-costs
          label: Charging, maintenance, and depot operations
          detail: Sector sources identify uptime, site, and power constraints; Moove costs are not disclosed.
        - id: contribution
          label: Net contribution and cash return
          detail: Not disclosed; requires segment margin, utilization, funding-cost, and loss data.
      edges:
        - from: capital
          to: assets
        - from: assets
          to: customer-use
        - from: customer-use
          to: activity
        - from: activity
          to: repayment
        - from: capital
          to: operating-costs
        - from: operating-costs
          to: customer-use
        - from: repayment
          to: contribution
        - from: operating-costs
          to: contribution
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI011
      - CI012
