evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Audited consolidated accounts and market- and product-level revenue, gross margin,
      vehicle utilization, maintenance, financing, and depot-cost data.
    whyItMatters: >-
      Without these figures, reported ARR and fleet scale cannot establish durable
      contribution margins, repayment performance, or a path to cash generation.
    diligencePath: >-
      Request audited statements, management accounts, and cohort-level unit economics
      for driver finance, rentals, and autonomous fleet operations.
    relatedQuestionRefs:
      - QI003
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-and-debt
    missingEvidence: >-
      Current cash, operating cash burn, debt maturity and covenant schedules, restricted
      cash, and a market-by-market runway forecast.
    whyItMatters: >-
      A disclosed equity raise is not cash on hand; asset financing and expansion can
      create liquidity needs that ARR does not measure.
    diligencePath: >-
      Obtain the latest consolidated cash-flow statement, lender schedules, facility
      agreements, and a downside runway model.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI002
  - type: conflicting-data
    severity: material
    topic: cumulative-funding
    missingEvidence: >-
      Reconciled round-by-round equity, venture debt, and other financing amounts behind
      the $472 million Tracxn total and the more-than-$710 million media figure.
    whyItMatters: >-
      The discrepancy changes the apparent leverage, dilution, capital efficiency, and
      financing history relevant to future funding needs.
    diligencePath: >-
      Reconcile the capitalization table and debt register to signed financing documents
      and explain each public total's inclusion rules.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: nigeria-market-exit
    missingEvidence: >-
      Nigeria wind-down costs, asset carrying values, loan recoveries, severance and
      liabilities, and the market-level income statement before exit.
