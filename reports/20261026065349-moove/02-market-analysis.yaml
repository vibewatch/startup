artifact: market-analysis
slug: moove
runDate: 2026-10-26
company:
  name: Moove
chapter:
  number: 2
  title: Market Analysis
  summary: Moove's evidence supports a vehicle-financing use case for mobility entrepreneurs and a newer autonomous-fleet infrastructure thesis, but the available sources do not isolate its serviceable spend or city-level economics. An old, broad robotaxi forecast and company-reported activity are context, not a Moove TAM or revenue proxy.
acknowledgedWarnings:
  - dimension: figureType
    reason: A pyramid would imply nested spend tiers that the evidence does not support; this bar figure keeps distinct source measures in their original units and periods.
sections:
  - id: market-boundary
    title: "Market boundary: vehicle access to fleet infrastructure"
    body: >-
      The evidence supports two related but distinct activities: vehicle access for
      mobility entrepreneurs and operating infrastructure for autonomous fleets.
      Moove described its original Nigerian model as Rental and Drive-to-Own for
      drivers who lacked vehicle-financing access; the IFC's 2021 partnership
      described financing cars for e-hailing and a pilot hybrid fleet. Those
      records establish the use case, not the size of vehicle-finance spend or
      Moove's current terms (CM001, CM002). In 2026, Moove's funding coverage
      described expansion into fleet ownership, depots, charging, maintenance and
      operations (CM012). These layers should not be added together: trip fares
      are downstream mobility-market activity, while financing and fleet
      operations are the potential spend categories relevant to Moove. Current
      signed prices, contract roles and market-wide spend remain undisclosed in
      this evidence set.
    claimRefs: [CM001, CM002, CM012]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: "Sizing lenses: broad context is not a serviceable market"
    body: >-
      Fortune Business Insights gives a global robotaxi estimate of USD 1.71
      billion for 2022 and forecasts USD 118.61 billion by 2031, with an 80.8%
      CAGR for 2022–2031 (CM010). The accessible text does not explain the
      underlying calculation, and its forecast horizon and vintage make it a
      directional, dated sector estimate rather than a current company-specific
      addressable-spend figure. Two narrower observations answer different
      questions: IFC and Moove estimated up to four million annual Lagos
      passenger trips enabled by a proposed 1,400-car expansion in 2021 (CM003),
      while Moove-reported Nigerian customer activity exceeded 9,000 users and
      approximately NGN 57 billion of revenue generated through financed
      vehicles (CM005). Neither is Moove revenue or a current market size.
      Moove's separate USD 420 million figure was reported as annual recurring
      revenue (ARR), not as TAM (CM009). No source supports a defensible
      company-specific SAM or SOM; the figure therefore keeps market forecasts,
      operating scale and company-reported activity in separate units rather
      than inventing addressable-market values.
    claimRefs: [CM003, CM005, CM009, CM010, CM013, CM014]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-map
    title: Users, buyers and budget ownership
    body: >-
      The original user is clearest: mobility entrepreneurs and drivers who
      needed vehicles to earn through ride-hailing or related work (CM001).
      Moove's reported Rental and Drive-to-Own users in Nigeria numbered more
      than 9,000 since inception, but the associated NGN 57 billion is customer
      revenue generated through financed vehicles, not revenue booked by Moove
      (CM005). The IFC account places e-hailing platforms in the operating
      chain, including a 2021 exclusive vehicle-financing and supply
      relationship, while the later company narrative points to fleet operators
      as users of autonomy infrastructure (CM002, CM012). Passengers are
      downstream users measured in IFC's trip estimate, not established buyers
      of Moove services. The evidence does not identify today's budget owner,
      contract payer, pricing, renewal terms or adoption threshold for any
      segment; the map separates observed users from those unresolved
      commercial roles.
    claimRefs: [CM001, CM002, CM003, CM005, CM012, CM013]
    tableRefs: [TM003]
  - id: adoption-and-constraints
    title: Adoption drivers, constraints and diligence gaps
    body: >-
      The financing thesis responds to a documented access constraint: IFC's
      2021 account said Nigerian ride-hailing platforms struggled to meet
      growing user demand because drivers lacked vehicle financing (CM002).
      That is historical evidence, not proof of present demand or current
      underwriting quality. The adverse signal is material: Moove announced
      that it would end Nigerian operations shortly after Uber's exit, and
      Business Insider reported sector pressures including fuel and maintenance
      costs, driver complaints about commissions and fares, inflation and weak
      purchasing power (CM004, CM006, CM007). Moove did not give a
      Nigeria-specific reason in that reporting (CM006). For robotaxis,
      Gasgoo describes substantial upfront investment, city-level economics
      that may not generalize to company profitability, and unresolved
      liability and insurance rules (CM011). These are sector constraints,
      not measured Moove results. Investment diligence should obtain
      city-level utilization, contribution margins, capital needs, customer
      budgets and signed partner terms before treating either opportunity as
      scalable.
    claimRefs: [CM002, CM004, CM006, CM007, CM011, CM013, CM014]
tables:
  - id: TM001
    title: Market boundary and adjacent spend
    columns: [Category, Included activity, Excluded or adjacent activity, Buyer / payer evidence, Relevance and limitation]
    rows:
      - [Driver vehicle access, "Rental and Drive-to-Own vehicle access for mobility entrepreneurs; contract prices are not disclosed.", "Downstream passenger fares and total ride-hailing spend are not Moove revenue.", "Drivers are identified as users; budget ownership and payment terms are not established.", "Core historical use case; do not infer market value from user counts."]
      - [E-hailing fleet supply, "Vehicle financing and supply associated with platform-based passenger trips.", "Platform fare revenue and passenger spending are not a measure of Moove's financing revenue.", "IFC described a 2021 Uber financing and supply relationship; current contract status and payer terms are unknown.", "A channel and demand context, not a current exclusive relationship or standalone spend estimate."]
      - [Autonomous fleet operations, "Moove's 2026 company narrative includes fleet ownership, depots, charging, maintenance and operating orchestration.", "Robotaxi vehicle sales and all robotaxi fares cannot be assigned to Moove.", "Fleet operators and partners are the potential operating counterparties; contracts and budget owners are not disclosed.", "An adjacent expansion thesis whose attributable spend is unquantified."]
      - [Status quo and substitutes, "Existing vehicle access and conventional financing are the relevant alternatives to a driver lacking a financed vehicle.", "No source here enumerates alternative lenders, prices, approval rates or vehicle ownership costs.", "Drivers' financing access is the documented need; comparative buyer economics are unavailable.", "A real alternative set is required for adoption and ROI analysis, but this pool does not size it."]
    notes: >-
      Boundary is an evidence-based analytical classification, not a measured
      spend taxonomy. Product descriptions come from IFC's 2021 account and
      Moove-reported coverage; unknown prices, payer terms and current contracts
      are left unquantified.
    claimRefs: [CM001, CM002, CM012, CM013]
  - id: TM002
    title: Sizing lenses and non-comparable activity measures
    columns: [Lens, Publisher / vintage, Geography / unit, Value and period, CAGR, Methodology / confidence, Limitation]
    rows:
      - [Broad robotaxi market, "Fortune Business Insights; report publication date unavailable in fetched text, with a 2022–2031 forecast period.", "Global; USD billions.", "USD 1.71bn in 2022; USD 118.61bn projected for 2031.", "80.8% for 2022–2031.", "Underlying calculation is not stated in the accessible text; report segments by geography, propulsion, application and component. Low confidence as a current sizing anchor.", "Dated sector forecast, not vehicle-finance or fleet-infrastructure spend attributable to Moove."]
      - [Lagos trip-demand proxy, "IFC / Moove partnership release, 2021-08-11.", "Lagos; estimated passenger trips per year.", "Up to 4 million annual trips estimated from a planned expansion of up to 1,400 cars.", "Not stated.", "IFC / Moove project estimate; medium confidence as a historical forecast, not a realized result.", "Trips are not revenue or addressable spend; no subsequent actuals are provided."]
      - [Nigerian customer activity, "Nairametrics report of Moove statements, 2026-10-08.", "Nigeria; customers and revenue generated through financed vehicles since inception.", "More than 9,000 customers; approximately NGN 57bn generated by customers through Moove-financed vehicles.", "Not stated.", "Company-reported cumulative activity; medium confidence as a reported claim.", "The NGN 57bn is customer-generated revenue, not Moove revenue, ARR, annual market spend or an audited figure."]
    notes: >-
      These rows use different markets, periods, units and evidence types and
      must not be summed or compared as equivalent measures. ARR, customer
      revenue generated through financed vehicles, passenger trips and market
      forecasts remain distinct.
    claimRefs: [CM003, CM005, CM009, CM010]
  - id: TM003
    title: Buyer, user and payer map
    columns: [Segment, Buyer / budget owner, User, Offer or workflow evidenced, Adoption trigger / evidence, Open commercial issue]
    rows:
      - [Mobility entrepreneurs and drivers, "Driver is the customer in the reported model; budget owner and payment terms are not given.", "Drivers using vehicles to earn through mobility work.", "Rental and Drive-to-Own vehicle access; more than 9,000 Nigerian customers reported since inception.", "Vehicle-financing access was identified as a constraint in the original use case.", "Pricing, underwriting, repayment performance and customer economics are not disclosed."]
      - [E-hailing platforms, "Platform role in current contracts and budget ownership are unknown.", "Drivers and passengers use the platform-mediated service.", "IFC described Moove as Uber's exclusive vehicle-financing and supply partner in sub-Saharan Africa in 2021.", "IFC's 2021 project forecast up to four million Lagos passenger trips annually from planned fleet additions.", "The 2021 relationship and estimate do not establish current terms, realized demand or renewal."]
      - [Autonomous fleet operators, "Potential operator / partner budget owner is not identified in the sources.", "Fleet operators and their passengers.", "Moove's 2026 narrative describes fleet ownership and depot, charging, maintenance and operations infrastructure; Business Insider reports its Waymo-related fleet operations.", "Fleet deployment and localized operations are the stated adoption context.", "No signed contract values, utilization, city economics or attributable Moove revenue are provided."]
      - [Passengers and riders, "Not shown as direct Moove buyers or budget owners.", "Passengers taking e-hailing or robotaxi trips.", "IFC's estimate concerns trips enabled by cars, not a direct Moove passenger product.", "Passenger demand is downstream of driver and fleet capacity.", "Fare payer, trip volume realized and Moove's share of fare economics are not established."]
    notes: >-
      Segment roles distinguish reported users and partners from unverified
      budget ownership. The table is not an exhaustive customer enumeration;
      current contracts and payer flows are unavailable.
    claimRefs: [CM001, CM002, CM003, CM005, CM008, CM012, CM013]
figures:
