    title: Source-reported market and operating measures
    type: bar
    summary: Distinct market forecasts and operating indicators retain their source units, periods and qualifications; they are not a combined market estimate.
    data:
      series:
        - name: Fortune Business Insights global robotaxi market estimate
          points:
            - label: 2022 estimate
              value: 1.71
              unit: USD billion
              detail: "Global robotaxi market estimate; historical value."
            - label: 2031 forecast
              value: 118.61
              unit: USD billion
              detail: "Global forecast; publisher states 80.8% CAGR for 2022–2031."
        - name: IFC / Moove Lagos demand projection
          points:
            - label: Annual passenger trips
              value: 4
              unit: million trips per year
              detail: "2021 estimate for planned fleet expansion; not realized trips or revenue."
        - name: IFC / Moove Lagos planned fleet addition
          points:
            - label: Additional cars
              value: 1400
              unit: vehicles
              detail: "Up to 1,400 cars planned under the 2021 financing package."
        - name: Moove-reported Nigerian customer activity
          points:
            - label: Customers since inception
              value: 9000
              displayValue: ">9,000"
              unit: customers
              detail: "Lower-bound marker for a company-reported count; not an exact customer total."
            - label: Revenue generated through financed vehicles
              value: 57
              displayValue: "≈57"
              unit: NGN billion, cumulative
              detail: "Customer-generated revenue since inception; not Moove revenue or ARR."
        - name: Business Insider Africa reported fleet footprint
          points:
            - label: Vehicles operated
              value: 42000
              displayValue: "≈42,000"
              unit: vehicles
              detail: "Reported footprint across 29 cities in 13 countries; company-reported scale."
        - name: Nairametrics-reported Moove ARR
          points:
            - label: Annual recurring revenue
              value: 420
              unit: USD million ARR
              detail: "Reported in August 2026 coverage; ARR is not the robotaxi market estimate."
    approximationNotes: >-
      Values are kept in their reported units and periods, with one panel per
      distinct unit. The >9,000 count is plotted at its lower-bound marker.
      These observations are not summed or treated as comparable measures of
      Moove's addressable market.
    claimRefs: [CM002, CM003, CM005, CM008, CM009, CM010]
