companyProfile:
  summary: >-
    Founded in Lagos in 2020, Moove began with revenue-based vehicle financing for mobility entrepreneurs and has
    expanded into fleet ownership and operations, including reported work supporting Waymo fleets. Public reporting
    describes an August 2026 $250 million Series C at a $2.1 billion valuation and company-attributed scale of about
    42,000 vehicles and $420 million ARR. Those figures do not establish recognized revenue, cash generation, or
    profitability, and the assigned evidence leaves market economics, debt, and key partner terms unresolved.
