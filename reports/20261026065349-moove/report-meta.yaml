  topStrengths:
    - >-
      Public reporting and company announcements describe a large vehicle footprint, international operations, and
      active autonomous-fleet work.
    - >-
      The reported Series C and operating disclosures indicate access to substantial capital and a meaningful operating
      base.
  topRisks:
    - >-
      Moove's Nigeria wind-down after Uber's departure demonstrates exposure to platform concentration; announced
      vehicle transfers are not verified as complete.
    - >-
      ARR and fleet scale are not substitutes for recognized revenue, margins, cash flow, debt obligations, or
      market-level unit economics.
    - >-
      Autonomous fleets and depots may require significant capital while utilization, payback, partner protections,
      insurance, and liability terms remain undisclosed.
    - >-
      Reported cumulative capital totals conflict, and the available evidence does not reconcile equity, debt, and
      funding actually received.
  unresolvedGaps:
    - >-
      Obtain consolidated audited financial statements, a reconciled debt and capital schedule, liquidity, and
      cash-runway detail.
    - >-
      Reconcile ARR to recognized revenue and obtain segment, market, and vehicle-level margins, utilization, and depot
      economics.
    - >-
      Review executed partner contracts, renewal and termination terms, concentration, insurance, and liability
      allocation.
    - Verify the eligibility rules and completion status for Nigerian vehicle transfers and account closeouts.
    - Establish customer and revenue concentration by partner, market, and cohort.
