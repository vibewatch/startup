evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: cumulative-capital-raised
    missingEvidence: A dated, reconciled capital schedule separating equity, debt, announced commitments, and amounts actually funded.
    whyItMatters: >-
      StartupList reports $697 million across disclosed rounds while Business Insider Africa reports more than $710
      million in total capital; the definitions and periods are not reconciled.
    diligencePath: >-
      Request the company financing ledger, executed debt schedules, and round-by-round close amounts, then reconcile
      them to dated public announcements.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited consolidated financial statements, recognized revenue, gross margin, cash, debt maturities, and
      market-level unit economics.
    whyItMatters: >-
      The reported $420 million is ARR, not recognized revenue or cash generation; valuation and operating resilience
      cannot be assessed from it alone.
    diligencePath: >-
      Obtain audited statements, management accounts, debt and receivables schedules, and market/depot-level
      contribution margins.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance-leadership
    missingEvidence: >-
      Current executive roster, full board and advisory-board membership, prior executive backgrounds, voting rights,
      and succession arrangements.
    whyItMatters: >-
      Public sources identify two co-founders and some roles but do not establish decision rights, leadership depth, or
      key-person concentration.
    diligencePath: >-
      Request the current organization chart, board roster and charter, biographies, delegation matrix, and succession
      plan.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map-coverage
    missingEvidence: >-
      A complete ownership and stakeholder register, including all investors, creditors, key counterparties, and
      customer cohorts.
    whyItMatters: >-
      The map is a selected public-source sample and cannot establish the full set of economic interests, control
      rights, or dependencies.
    diligencePath: >-
      Reconcile the cap table and debt register to current commercial contracts, major customer cohorts, and board
      materials.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: moove-specific-market-sizing
    missingEvidence: >-
      Current third-party or audited spend data that isolates vehicle-finance and autonomous-fleet infrastructure
      budgets by geography and customer segment, with a bridge from broad robotaxi activity to Moove's addressable
      offer.
    whyItMatters: >-
      Without a defined spend denominator and serviceable geographies, the broad robotaxi forecast cannot establish
      Moove's TAM, SAM, or SOM or support a market-share valuation.
    diligencePath: >-
      Request management's market model with source vintages, segment definitions, customer counts, budget owners,
      exclusions, and reproducible TAM-to-SAM-to-SOM calculations; triangulate it with independent market data.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-ownership
    missingEvidence: >-
      Current customer contracts, price schedules, payment flows, renewal terms, and evidence identifying who budgets
      for vehicle financing and autonomous-fleet operations.
    whyItMatters: >-
      User counts and vehicle footprints do not show willingness to pay, unit economics, contract durability, or which
      party captures the value.
    diligencePath: >-
      Review anonymized contracts and cohort-level invoices with drivers, platforms, and fleet operators; reconcile
      payer, user, asset owner, and renewal obligations by segment.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: city-level-fleet-economics
    missingEvidence: >-
      City- and cohort-level fleet utilization, financing losses, maintenance and charging costs, readiness investment,
      and contribution margin for both driver-finance and robotaxi operations.
    whyItMatters: >-
      Sector reports describe city-specific break-even alongside high upfront costs, but do not establish that Moove's
      unit economics or capital requirements generalize across markets.
    diligencePath: >-
      Obtain audited city-level operating data and partner statements of work, then reconcile deployed vehicles,
      utilization, losses, fixed costs, and cash contribution by cohort.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Comparable realized customer prices, repayment schedules, take rates, fleet-service pricing, and contract
      durations by market and provider.
    whyItMatters: >-
      Without like-for-like price and contract terms, buyer value, driver affordability, gross economics, and
      competitive substitution cannot be assessed.
    diligencePath: >-
      Request redacted customer and partner contracts, price cards, repayment schedules, and market-level realized-rate
      cohorts from Moove and relevant alternatives.
    relatedQuestionRefs:
