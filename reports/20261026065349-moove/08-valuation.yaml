  - id: TV003
    title: Bull, base, and bear scenario framework
    columns:
      - Scenario
      - Required assumptions
      - Valuation and return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - "ARR converts to durable contribution profit; AV fleet and depot investment earns returns above its cost of capital."
        - "A higher mark could be justified only by verified margins, cash generation, and comparable transactions; no numeric range is supportable."
        - "Unassigned; public evidence does not support numerical odds."
        - "Utilization or return on invested fleet/depot capital misses plan."
      - - Base
        - "Traditional fleet operations remain viable while autonomous deployments scale gradually and require continued investment."
        - "The $2.1 billion mark remains an unvalidated financing reference; entry discipline requires a return model and matched comps."
        - "Unassigned; public evidence does not support numerical odds."
        - "Audited results fail to reconcile reported ARR with cash and segment economics."
      - - Bear
        - "Fleet ownership relies on debt, deployment lags, and partner or city concentration limits utilization."
        - "No downside valuation range can be calculated without debt, margins, liquidation preferences, and asset recovery data."
        - "Unassigned; public evidence does not support numerical odds."
        - "Debt service, partner loss, or weak utilization impairs fleet economics."
    notes: "Conditional scenarios preserve missing inputs as gaps; they are not forecasts, assigned probabilities, or valuation ranges."
    claimRefs:
      - CV001
      - CV002
