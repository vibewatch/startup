chapter:
  number: 8
  title: Valuation
  summary: Moove announced a $250 million Series C at a $2.1 billion valuation, alongside company-reported $420 million ARR; that implies about 5.0x ARR but does not establish a comparable-market multiple or investor return. With limited public evidence on profitability, unit economics, capital structure, and partner terms, the defensible call is research-more rather than price approval.
sections:
  - id: investment-call
    title: Price reference and investment call
    body: >-
      Moove announced a $250 million Series C at a $2.1 billion valuation, as reported by TechCrunch and stated in the Mubadala release (CV001). Moove's release also reports $420 million of ARR; dividing the announced valuation by that company-reported ARR gives an illustrative 5.0x valuation-to-ARR ratio, not a revenue multiple, earnings multiple, or independently validated benchmark (CV002, CV003). The public materials do not establish whether the valuation is pre- or post-money or provide share-class, preference, or dilution terms. News coverage that repeats the same announcement is not independent price discovery, and the available funding comparison is not a valuation comparable (CV012). The evidence therefore supports neither a precise fair-value range nor an entry-price target. Recommendation: research-more, low confidence, with an unknown valuation stance and high underwriting uncertainty; defer price approval pending audited financials, unit economics, and round documents.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV012
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: thesis-and-antithesis
    title: Investment thesis and countercase
    body: >-
      The bull case is that an operating footprint built for human-driven fleets can extend into autonomous mobility: Moove and TechCrunch report approximately 42,000 vehicles, while Moove describes a $420 million ARR base and autonomous operations with Waymo (CV002, CV004, CV009). The company says Series C proceeds will fund autonomous fleet ownership, robotics-first depots, and new-market launches, while its chief executive told TechCrunch the traditional mobility business was set to achieve full profitability in 2026 (CV006, CV007). These are useful scale and strategic signals, not proof of margins, cash conversion, or returns on new assets. The countercase is that Moove's own expansion plan requires capital-intensive fleets and depots; TechCrunch reported that the company intended to use debt to buy robotaxis and gave no purchase timeline (CV009). The country denominator also differs between TechCrunch and the company's release (CV005), reinforcing the need to reconcile operating data before underwriting scale.
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
    tableRefs:
      - TV002
  - id: scenarios-and-diligence
    title: Scenario framework and diligence gates
    body: >-
      The bull, base, and bear cases below are conditional underwriting paths, not price targets or probability-weighted forecasts. The bull case requires recurring ARR to convert into durable contribution margin and autonomous deployments to earn attractive returns on fleet, charging, and depot capital; the base case assumes legacy operations remain viable while AV economics are not yet proven; the bear case reflects debt-funded asset growth, partner dependence, or weak utilization overwhelming scale benefits (CV006, CV007, CV009, CV011). The retained sources do not supply gross margin, cash flow, debt schedule, contracted unit economics, liquidation preferences, or an exit timetable, so assigning valuation ranges or numerical probabilities would create false precision. Before investment, request audited consolidated statements and segment economics, cap-table and financing documents, fleet-level utilization and return data, and partner contracts with insurance and renewal terms. Re-underwrite only when those records reconcile the public ARR and fleet disclosures and permit a suitable comparable set.
    claimRefs:
      - CV006
      - CV007
      - CV009
      - CV011
      - CV013
    tableRefs:
      - TV003
