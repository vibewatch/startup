        - "Audited segment margins, repeatable utilization, and profitable deployment economics."
      - - "Anti-thesis: growth may consume capital"
        - "The company plans autonomous fleet ownership and depots; TechCrunch reported debt financing for robotaxi purchases without a timeline."
        - "Fleet-level return-on-capital, debt-service capacity, and contracted utilization."
      - - "Anti-thesis: evidence is not yet comparable"
        - "The disclosed mark and ARR yield an illustrative 5.0x ratio, while the assigned sources provide no suitable valuation peer set or transaction terms."
        - "A matched public/private comparable set and complete Series C capitalization terms."
      - - "Risk signal: partner exposure"
        - "The Ken reported Moove among Uber's fleet partners and framed the shift toward fleet partners as increasing their influence."
        - "Partner concentration, renewal protections, economics, and evidence of diversified demand."
    notes: "Operating scale and ARR are attributed to Moove or named reporting; no row implies audited performance or a like-for-like competitor benchmark."
