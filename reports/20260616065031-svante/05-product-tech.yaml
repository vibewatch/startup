  claims:
    - id: CE001
      statement: >
        Svante's core product is the VeloxoTherm™ rapid-cycle thermal swing adsorption system,
        which uses solid sorbent filters housed in modular rotary adsorption machines (RAMs) to
        capture CO₂ from industrial flue gas and produce pipeline-grade CO₂ at ≥95% purity.
      type: company-claimed
      topic: veloxotherm
      sourceRefs: [SE022, SE023]
      confidence: high
      freshness: current
      answersQuestionRefs: [QE001, QE004]

    - id: CE002
      statement: >
