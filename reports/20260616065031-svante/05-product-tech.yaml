        - from: "ram"
          to: "purification"
          label: "Concentrated CO₂ stream (~60-sec cycle product)"
        - from: "purification"
          to: "co2-product"
          label: "Pipeline-grade CO₂ (≥95% purity, compressed)"
    claimRefs: [CE003, CE007, CE010, CE031, CE033, CE036]

