          label: "Pre-treatment System"
          detail: "Direct contact cooler cools gas to <50°C; wet scrubber removes SOx/particles; guard bed removes residual contaminants; meets RAM feed specs (SOx ≤1.5 ppm, PM ≤0.2 mg/m³)"
        - id: "ram"
          label: "Rotary Adsorption Machine (RAM)"
          detail: "CALF-20 SABs adsorb CO₂ in adsorption zone; low-pressure steam regenerates sorbent in ~60-sec cycle; concentrated CO₂ stream exits; cleaned flue gas exits vent stack"
        - id: "purification"
          label: "CO₂ Purification and Compression"
          detail: "Catalytic oxidation yields >95% CO₂ purity; cryogenic distillation option yields ≤99.9%; CO₂ compressed to pipeline pressure (≥2,200 psia in Linde FEED design)"
        - id: "co2-product"
          label: "Pipeline-Grade CO₂ Delivery"
          detail: "≥95% purity CO₂ for geological sequestration, e-fuels, CO₂-injected concrete, or CDR credit generation; no hazardous secondary emissions"
