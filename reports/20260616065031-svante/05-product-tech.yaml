company:
  name: Svante Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: >
    Svante's core product is the VeloxoTherm™ rapid-cycle thermal swing adsorption platform —
    nanoengineered CALF-20 MOF-coated structured adsorbent filters housed in modular rotary adsorption
    machines (URSA 1000/2000) — that captures CO₂ at ≥90% efficiency and ≥95% purity from industrial
    flue gas using low-pressure steam. The Redwood Facility in Burnaby (141,000 sq ft, May 2025
    commissioning, US$145M investment) is the world's first commercial filter gigafactory rated at 10 Mtpy
    CO₂ capacity; the BASF commercial supply agreement for CALF-20 unlocks scale manufacturing; the
    C-READY skid-mounted product co-developed with SAMSUNG E&A addresses deployment standardization.
    Pilot evidence from Lafarge CO₂MENT, Chevron Kern River (DOE funded), and Södra Värö validates the
    technology through the pre-commercial stage, and the Delek Big Spring project ($95M DOE) advances
    refinery application toward 2027–2028 commercial operations. Key open risks are commercial-scale
    durability under fleet conditions, the BASF single-source dependency for CALF-20, and high CAPEX
    for hydrogen/refinery applications.

sections:
  - id: product-overview
    title: Product Overview and Value Proposition
    body: >
      Svante Technologies sells a complete carbon capture and removal system targeting hard-to-abate
      industrial sectors. Its core value proposition is the delivery of ≥90% CO₂ capture efficiency
      from post-combustion flue gas, concentrated to ≥95% purity pipeline-grade CO₂, without the
      hazardous liquid amine or potassium hydroxide chemicals used in conventional solvent-based
      capture. The product stack rests on CALF-20, a patented zinc-based metal-organic framework (MOF)
      solid sorbent, coated onto thin laminate sheets and assembled into structured adsorbent bed
      filters. These filters are inserted into a rotary adsorption machine (RAM) — a compact,
      continuously rotating contactor that cycles through adsorption and regeneration every
      approximately 60 seconds using low-pressure steam. The end product is a concentrated CO₂
      stream suitable for geological sequestration, e-fuel synthesis, CO₂-injected concrete, or CDR
      credit generation. Svante targets biogenic emitters (pulp and paper, ethanol, waste-to-energy)
      where capture costs are lower, as well as cement, hydrogen, steel, oil-and-gas refining,
      aluminum, and chemicals. For facilities with flue gas CO₂ concentrations below 12% (such as
      natural gas combined cycle power plants), Svante partners with BASF to offer OASE® blue liquid
      amine as a complementary product alongside the solid sorbent offering.
    claimRefs: [CE001, CE036, CE026, CE031]

  - id: product-line-architecture
    title: Product Line and Module Architecture
    body: >
      Svante's commercial product line centers on two RAM sizes. The URSA 1000 is designed to capture
      approximately 500 tonnes of CO₂ per day (approximately 180,000 TPY at continuous operation) and
      the URSA 2000 is designed to capture approximately 2,000 tonnes per day (approximately 730,000 TPY).
      Multiple RAMs can be deployed in parallel to scale capture at a single site — the Linde SMR
      pre-FEED design used two URSA 2000 units in parallel to reach 1.436 million TPY. In May 2025,
      Svante and SAMSUNG E&A launched C-READY, a standardized skid-mounted modular carbon capture
      plant product that packages Svante's VeloxoTherm contactor technology with SAMSUNG E&A's
      digital Engineering Data Platform (EDP) and proven modularization capabilities. C-READY targets
      commercial industrial projects and is marketed as a one-stop-shop for CCUS project delivery from
      front-end engineering through fabrication. For direct air capture applications, Svante supplies
      contactor blocks — a format of the same CALF-20-coated structured adsorbent technology — used in
      Climeworks' Generation 3 DAC system. Svante's technology page also lists the company's solid
      sorbent-based filters as available for industrial point-source capture and DAC in a single
      manufacturing platform.
    claimRefs: [CE005, CE006, CE008, CE021, CE022]
    tableRefs: [TE001]
    figureRefs: [FE001]

  - id: technology-architecture
    title: Technology Architecture and Operating Model
    body: >
      The VeloxoTherm process is a patented rapid-cycle temperature swing adsorption (RC-TSA) system.
      Flue gas enters the rotary adsorption machine after pre-treatment: a direct contact cooler (DCC)
      reduces gas temperature to below 50°C, a wet scrubber removes sulfur oxides (SOx) and particles,
      and a guard bed removes residual contaminants. Inside the RAM, the gas contacts CALF-20-coated
      structured adsorbent beds (SABs). CALF-20 — a Zn₂(1,2,4-triazolate)₂(oxalate) framework
      commercially known as Calgary Framework 20 — adsorbs CO₂ with high selectivity over water and
      nitrogen through physisorption, requiring no chemical bond breaking. The RAM rotates through
      three functional zones: an adsorption zone where CO₂ binds to the sorbent, a regeneration zone
      where low-pressure steam flushes and concentrates the CO₂, and a conditioning zone for cooling
      and preparation. The full adsorption-desorption cycle completes in approximately 60 seconds.
      Concentrated CO₂ (typically 95%+ purity) is then processed through a CO₂ purification and
      compression train — either catalytic oxidation for 95%+ purity or cryogenic distillation for
      up to 99.9% purity — before being compressed to pipeline pressure (≥2,200 psia in the Linde SMR
      FEED). The OSTI DOE final report for the Linde SMR pre-FEED study quantified a steam-to-CO₂
      regeneration ratio of approximately 1.22 kg steam per kg of CO₂ captured, with opportunities
      for further optimization through heat integration and steam recovery.
    claimRefs: [CE002, CE003, CE004, CE007, CE010, CE031, CE032, CE033, CE037]
    tableRefs: [TE003]
    figureRefs: [FE002]

  - id: manufacturing-supply-chain
    title: Manufacturing and Supply Chain
    body: >
      In May 2025, Svante officially commissioned the Redwood Facility — a 141,000-square-foot Centre
      of Excellence for Carbon Capture and Removal — in Burnaby, British Columbia. Built with a
      US$145 million capital investment and backed by strategic investors including Chevron New
      Energies, Temasek, M&G, Canada Growth Fund, United Airlines Ventures, Samsung, and GE Vernova,
      Redwood is the world's first commercial gigafactory for carbon capture filters, capable of
      producing enough solid sorbent-based filters to support capture of up to 10 million tonnes of
      CO₂ annually. The filter production process relies on Svante's roll-to-roll "Sorbent on a Roll"
      coating process, in which CALF-20 MOF sorbent is coated at high volume and low cost onto sheets
      of laminate, which are then stacked into high-performance filter modules. BASF entered a
      commercial supply agreement with Svante in October 2023 to produce CALF-20 at industrial scale
      (several hundred tonnes per year) — the first time MOFs had been manufactured at such scale
      commercially — using a low-temperature green chemistry process. To manage capacity demand from
      the Climeworks DAC supply agreement, Svante also secured additional roll-to-roll coating
      capacity with 3M as a secondary supplier. SAMSUNG E&A serves as the exclusive engineering,
      procurement, and fabrication (EPF) partner for C-READY skid-mounted modules, while Svante
      supplies the contactor machines and filter beds.
    claimRefs: [CE011, CE012, CE013, CE014, CE015, CE016, CE034]
    figureRefs: [FE003]

  - id: differentiation-ip
    title: Differentiation, IP, and Competitive Advantages
    body: >
      Svante's principal differentiation rests on five pillars. First, CALF-20 is a proprietary MOF
      sorbent with demonstrated resistance to industrial flue gas impurities, avoiding the degradation
      and secondary-emission risks associated with liquid amine solvents; its Nobel-Prize-recognized
      chemistry (2025 Nobel in Chemistry cited MOF research) and peer-reviewed scientific publication
      (Science, December 2021) provide a defensible technical foundation. Second, the VeloxoTherm
      architecture enables extremely fast cycle times (~60 seconds vs. hours for conventional
      packed-bed TSA), delivering compact equipment with high throughput and attractive capture
      economics relative to the sorbent inventory. Third, Svante's patent portfolio covers the
      adsorption process (US11813563), the parallel passage contactor design (US11766634), the
      integrated TSA combustion system (US11224834), and underlying zinc MOF synthesis chemistry
      (WO2019204934A1), along with additional published applications including the scalable sortive
      gas separator (US20250153088A1). Fourth, Svante operates the only commercial gigafactory for
      MOF-based carbon capture filters, providing a manufacturing cost and lead-time advantage over
      competitors who do not own filter production. Fifth, the BASF commercial supply agreement for
      CALF-20 resolves the historical barrier to MOF commercialization (large-scale, low-cost
      production), making the supply chain more defensible than a purely in-house synthesis approach.
      Taken together, these differentiators are validated by independent DOE-funded FEED studies at
      industrial scale and by Climeworks' selection of Svante as the DAC filter supplier for its US
      DOE-funded megaton-scale hubs.
    claimRefs: [CE023, CE024, CE025, CE027, CE028, CE038]
    figureRefs: [FE004]

  - id: deployment-roadmap
    title: Deployment, Integration, and Roadmap
    body: >
      Svante has executed or is executing a multi-stage deployment roadmap spanning pilot, pre-FEED,
      and commercial-scale projects across multiple industrial sectors. The CO₂MENT pilot at Lafarge
      Canada's Richmond cement plant (250 TPY, operating since 2019) has accumulated over 4,000 hours
      of operation across three phases: pre-treatment validation, CO₂ capture, and CO₂ utilization
      (conversion to synfuels and CO₂-injected concrete). The Chevron Kern River DOE pilot (25 TPD,
      October 2020–August 2024, $23.4M total funding) validated steady-state operation across 4–14%
      CO₂ concentration flue gas and produced a gap analysis for scale-up to NGCC applications.
      The Linde SMR pre-FEED study (DOE Award DE-FE0032113, $1.9M) defined the design basis for a
      1.436 Mtpy commercial plant at Port Arthur, Texas, with CAPEX estimated at $512M–$656M. At
      Delek US's Big Spring, Texas refinery, Svante and Delek are advancing a DOE-co-funded project
      (up to $95M) targeting 145,000 TPY from an FCC unit, with operations targeted for 2027–2028.
      In early 2026, Svante deployed its first EU pilot at Södra's Värö pulp mill in Sweden —
      evaluating biogenic CO₂ capture of up to 1 million TPY — with RISE as research partner and
      EU Industriklivet funding. Svante's stated ambition is to deploy up to 100 commercial plants
      per year by the latter part of this decade, enabled by Redwood's filter production capacity
      and the C-READY standardized modular plant offering.
    claimRefs: [CE017, CE018, CE019, CE029, CE030, CE034, CE035]
    tableRefs: [TE002, TE005]

  - id: trust-safety-quality
    title: Trust, Safety, Environmental Testing, and Quality
    body: >
      Svante has conducted targeted environmental and safety testing of the CALF-20 system in
      real-world industrial conditions. At the CO₂MENT cement plant pilot, chemical analysis using
      ESI-MS and FTIR found no detectable nitramine or nitrosamine compounds in the CALF-20 laminate
      matrix after extended exposure to NOx-laden cement flue gas, confirming the absence of the
      toxic secondary emissions that have been a known risk in amine-based systems. The Linde SMR
      pre-FEED DOE study included a formal Environmental, Health and Safety (EH&S) Risk Assessment
      and Hazard Identification (HAZID) study covering emissions, effluents, and structured adsorbent
      toxicology. The Chevron Kern River project, conducted under DOE Cooperative Agreement
      DE-FE0031944, was subject to DOE compliance requirements and produced a comprehensive gap
      analysis and techno-economic analysis. Svante's CO₂ product is specified at ≥95% purity,
      meeting pipeline-grade standards for transport and sequestration. The company has not publicly
      disclosed ISO certifications or third-party quality management system audits as of the run date,
      leaving formal quality assurance infrastructure transparency as an open diligence item for
      prospective customers and project finance counterparties.
    claimRefs: [CE019, CE020, CE033, CE036, CE038]
    tableRefs: [TE004]

