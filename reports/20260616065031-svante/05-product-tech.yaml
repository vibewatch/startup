figures:
  - id: FE001
    title: Svante Product Technology Stack — From Sorbent to Capture Plant
    type: stack
    layout: standard
    summary: >
      Five-layer architecture showing how Svante's technology elements integrate from the
      base CALF-20 MOF sorbent material up through filters, the rotary adsorption machine,
      the balance of plant, and the complete integrated project delivery offering (C-READY).
    data:
      layers:
        - label: "Layer 1 — Solid Sorbent (CALF-20 MOF)"
          detail: "Zn-based MOF; high CO₂ selectivity over N₂ and H₂O; physisorption; BASF commercial supply; Nobel-recognized chemistry"
        - label: "Layer 2 — Structured Adsorbent Filters (SABs)"
          detail: "CALF-20 coated via Sorbent on a Roll (roll-to-roll process); laminate stacks form filter modules; Redwood gigafactory (10 Mtpy CO₂); 3M secondary coating"
        - label: "Layer 3 — Rotary Adsorption Machine (RAM)"
          detail: "URSA 1000 (~500 TPD) and URSA 2000 (~2000 TPD); ~60-second adsorption-regeneration cycle; low-pressure steam regeneration; continuous operation"
        - label: "Layer 4 — Balance of Plant / Pre-treatment"
          detail: "DCC (cooling to <50°C), wet scrubber (SOx/particles), guard bed, auxiliary boiler (steam), CO₂ purification (catalytic oxidation / cryogenic), compression to pipeline pressure"
        - label: "Layer 5 — Integrated Plant and Project Delivery"
          detail: "C-READY skid-mounted modular plant (SAMSUNG E&A EPC/EPF); Svante Development co-investment model; OASE blue liquid amine for <12% CO₂ streams; digital EDP integration"
    claimRefs: [CE001, CE004, CE005, CE006, CE014, CE021]

