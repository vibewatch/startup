callouts:
  - calloutType: strength
    title: Commercial Gigafactory Creates Manufacturing Moat
    body: >
      The Redwood Facility (141,000 sq ft, 10 Mtpy CO₂ filter capacity, commissioned May 2025) is the
      world's only commercial-scale MOF filter manufacturing plant for carbon capture. Combined with the
      BASF CALF-20 supply agreement and the C-READY modular plant offering with SAMSUNG E&A, Svante has
      assembled a vertically integrated manufacturing and delivery stack that is difficult and expensive
      for competitors to replicate in the near term.
    claimRefs: [CE011, CE012, CE015, CE021]

  - calloutType: risk
    title: BASF Single-Source Dependency for CALF-20 is a Critical Supply Chain Risk
    body: >
      BASF is currently the only qualified commercial-scale producer of CALF-20. Any supply disruption
      (technical, commercial, or geopolitical) would directly constrain Svante's filter manufacturing
      throughput and its ability to fulfill commercial orders. The 3M secondary coating capacity
      mitigates volume surge risk but does not address the raw MOF supply concentration risk.
    claimRefs: [CE015, CE016]

  - calloutType: risk
    title: Commercial-Scale Durability and Long-Run O&M Costs Remain Unproven at Fleet Scale
    body: >
      CALF-20 has demonstrated stability across 4,000+ hours at the CO₂MENT pilot and in 1,300+
      cycles in Climeworks' Muttenz tests. However, multi-year industrial fleet performance data
      under varying gas compositions, impurity profiles, and maintenance cycles is not yet available.
      Filter replacement schedules, sorbent attrition rates, and long-run O&M costs per tonne of CO₂
      are not publicly disclosed, making total cost of ownership estimates uncertain for project
      finance underwriting.
    claimRefs: [CE038, CE039]

  - calloutType: insight
    title: DAC as a Second Market Provides Product Platform Leverage
    body: >
      Climeworks' Gen 3 field tests showed Svante's structured adsorbents deliver 2× capture
      efficiency and 50% lower energy consumption versus Gen 2 across 1,300+ cycles. With Climeworks
      targeting DOE-funded US megaton DAC hubs, Svante's filter supply could represent a meaningful
      second revenue stream beyond industrial point-source and BECCS, leveraging the same Redwood
      gigafactory. This dual-market platform is unique among solid sorbent vendors and provides
      demand-side resilience.
    claimRefs: [CE027, CE028]

