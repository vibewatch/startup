        as Calgary Framework 20, originally developed at the University of Calgary and protected
        by PCT patent WO2019204934A1 covering zinc MOF synthesis chemistry.
      type: observed
      topic: calf-20
      sourceRefs: [SE009, SE017]
      confidence: high
      freshness: historical
