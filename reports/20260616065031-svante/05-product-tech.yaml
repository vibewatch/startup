    type: flow
    layout: wide
    summary: >
      Five-step operating flow showing how Svante's capture system processes industrial flue gas
      from the emission source through pre-treatment, adsorption, purification, and final
      pipeline-grade CO₂ delivery.
    data:
      nodes:
        - id: "flue-gas-source"
          label: "Industrial Flue Gas Source"
          detail: "Cement kiln, SMR H₂ plant, FCC unit, recovery boiler, or DAC ambient air; CO₂ concentration 4–30% depending on sector"
