summary:
  headline: >-
    Svante holds the world's only solid-sorbent carbon-capture filter gigafactory and the strongest strategic investor
    syndicate in its category, but is pre-revenue with all commercial projects pre-FID and no disclosed financials,
    warranting a research-more stance pending FID confirmations and greater disclosure.
