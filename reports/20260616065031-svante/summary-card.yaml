  topStrengths:
    - >-
      First-mover manufacturing moat: the world's only dedicated solid-sorbent carbon-capture filter gigafactory,
      commissioned May 2025 in Burnaby, BC, creates a replication barrier that is difficult and costly for competitors
      to close
    - >-
      Deep strategic investor syndicate spanning Chevron New Energies, GE Vernova, Samsung Engineering, Temasek, OGCI
      Climate Investments, and the Canada Growth Fund, simultaneously validating technology and providing
      channel-to-market for global deployment
    - >-
      Durable policy floor from US 45Q ($85/tonne industrial, $180/tonne DAC preserved in OBBBA July 2025), Canada's 50%
      CCUS ITC, and EU CBAM creates enabling economics for CCS deployment in exactly the hard-to-abate sectors Svante
      targets
    - >-
      Nobel Prize-linked CALF-20 sorbent IP (Chemistry 2025) and partnership with 3M Ventures on sorbent supply-chain
      alignment provide scientific credibility and potential materials cost advantages
  topRisks:
    - >-
      Pre-revenue and pre-FID across all seven active project partnerships; commercial-scale revenue not expected before
      2027–2028, leaving a 3.5-year equity funding gap from Series E to any near-term exit
    - >-
      Information asymmetry is the core investment risk: no publicly confirmed post-money valuation for any round from
      Series D onward, no audited financials, and opaque CGF convertible note conversion terms make fair-value
      underwriting impossible
    - >-
      FOAK execution risk: IEEFA data show no flagship CCS project has consistently captured more than 80% of its target
      CO₂ volume; BASF single-source dependency for CALF-20 sorbent is a critical supply-chain vulnerability
    - >-
      Policy and market risk: IEA WEO 2025 downgraded CCUS' role in net-zero pathways and US DOE grant cancellations
      have shifted Svante's addressable market toward Canada, concentrating geographic execution risk
  unresolvedGaps:
    - >-
      No confirmed post-money valuation for any Svante funding round from Series D onward, including the CGF convertible
      note implied conversion price
    - Audited revenue, gross margin, burn rate, and cash runway for FY2025 and H1 2026 remain undisclosed
    - >-
      Final investment decision timing and project economics (capex, opex, capture-rate guarantees) for the Delek Big
      Spring, North Star BECCS Phase 1, and Mercer Alberta anchor projects
    - >-
      Canada Growth Fund convertible note tranche-2 drawdown status, conversion price cap, interest rate, and maturity
      schedule
    - >-
      Long-run sorbent durability and O&M costs at fleet commercial scale; no multi-year field performance dataset is
      publicly available
