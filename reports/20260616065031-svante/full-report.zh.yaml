      - number: '1.5'
        title: 里程碑与商业进展
        blocks:
          - type: paragraph
            body: >
              Svante 的里程碑从 2007 年车库里的 R&D 创业公司，延伸到 2025 年投运商业规模过滤器制造设施，并在 2026 年 4 月签下首个大型碳移除包销协议。关键商业合作包括：获美国 DOE grant
              DE-FE0031944 支持的 Chevron Kern River 中试，Lafarge Richmond 水泥厂 CO₂MENT 中试，2025 年 4 月与 Mercer International 在
              Alberta Peace River 制浆厂推进的 Pre-FEED（FEL-2）阶段项目，以及 Delek US Texas Big Spring Refinery 的 FEED-ready 项目。2026
              年 3 月，Svante 收购 Calgary 的 Carbon Alpha Corporation，包括 North Star Carbon Solutions 的所有权权益；North Star 是
              Saskatchewan 的 BECCS 项目，与代表九个 First Nations 的 Meadow Lake Tribal Council（MLTC）共同开发。MLTC 将共同持有该 BECCS
              设施。North Star 一期将从 MLTC Bioenergy Centre 每年捕集最高 140,000 吨 CO₂；FID 预计在 2027 年第一季度。2026 年 4 月，Microsoft 同意在
              15 年内从 North Star 购买 626,000 吨 CDR 信用——这是 Microsoft 首个加拿大 BECCS CDR 包销协议，也被认为是加拿大首个涉及 Indigenous
              所有权的同类协议。North Star 计划于 2029 年初开始商业运营。2025 年，Svante 启动三个新业务单元（OEM&D、Development Company、Solutions &
              Digital Services），并宣布与 SAMSUNG E&A 联合推出预制模块化解决方案「CREADY」。公司在 2025 年进入 Global Cleantech 100 Hall of
              Fame，并入选 TIME 与 Statista 评出的 2025 年 Top 100 Greentech Companies。
