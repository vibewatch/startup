      - number: '7.5'
        title: 缓释措施、监测指标与终止标准
        blocks:
          - type: paragraph
            body: >-
              Svante 已落地多项结构性缓释措施：与 BASF 签订 CALF-20 MOF 材料商业供应协议，锁定最关键原材料并降低单一来源风险；Redwood gigafactory
              的高通量自动化和产品标准化旨在压低制造成本波动；CGF 差价合约工具为加拿大项目吸收碳价下行；投资者名单多元（Chevron、Temasek、M&G、CGF、United Airlines、Samsung、GE
              Vernova、InBC），一定程度上稀释集中度。美国 BECCS 可行性阶段由 Svante Development Inc.
              共同出资，明确包含风险评估、成本进度估算和工厂集成规划，落实了「爬—走—跑」的去风险原则；在模块化 FOAK 技术里，这一原则与更低的成本超支相关。

              关键监测指标包括：（1）Södra 试点和美国 BECCS 可行性阶段的捕集率结果；（2）墨西哥湾沿岸封存场地的 Class VI 许可状态；（3）45Q 相对项目建设成本的实际价值；（4）Chevron
              公开承诺的碳捕集投资；（5）自愿 CDR 信用价格；（6）加拿大碳信用市场价格与 CGF CfD 执行价的差距。推翻投资论点的触发项包括：45Q 抵免被废除，或有效价值降至 $70/tonne 以下；DOE
              资金冻结延长，阻断示范项目；Chevron 出售 Svante 股权；美国 BECCS 项目在 2027 年中前未能锁定 Class VI 封存伙伴；FOAK 工厂捕集率持续低于设计规格的 70%；BASF 供应
              MOF 吸附剂中断；或加拿大 OBPS/TIER 信用供给过剩，把价格压到 CGF CfD 地板以下。FactSet 分析指出，OBBBA 将 45Q 抵免下地质封存与 EOR 拉平，给项目开发商更灵活的 CO₂
              处置选项；若可获得 EOR 承购伙伴，甚至可能免去漫长的 Class VI 许可，从而提供部分缓释。
