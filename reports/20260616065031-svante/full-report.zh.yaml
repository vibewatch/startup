      - number: '2.5'
        title: 市场增长驱动因素
        blocks:
          - type: paragraph
            body: >-
              最持久的市场驱动来自监管和政策。北美方面：美国 45Q 税收抵免（由 IRA 2022 和 OBBBA 2025 更新）为工业点源 CCS 支付 $85/tonne，为 DAC 支付
              $180/tonne，自设备投运起可享 12 年，开工截止日为 2033 年 1 月 1 日。该抵免可转让，也可通过 direct pay 变现，从而变成可银行化的项目融资收入。加拿大联邦
              OBPS（Output-Based Pricing System）在 2026 年对大型工业排放方设定 $95/tonne CO2e（CAD）碳价，为 CCS 提供清晰的避免成本信号。欧洲方面：EU ETS
              EUA 价格在 2026 年初稳定在约 €70–75/tonne（低于估计的 €105–280/tonne 全口径处置成本区间），但 CBAM 分阶段落地正在强化难减排行业的价格信号。EU Net-Zero
              Industry Act 要求到 2030 年欧洲至少形成 50 Mtpa CO2 封存能力——制造监管拉动需求。Germany 从 2026 年中开始的 €6B 工业脱碳方案将资助 CCS 部署。


              需求驱动包括：企业净零承诺增加，带动支付绿色溢价的意愿上升（Microsoft 从 Svante/MLTC 包销 626,000 吨 BECCS，是第一章提到的标志性案例）；科技行业对「clean
              firm」能源的需求，使新的 CCUS 支撑型购电模式可行（Google 与 Broadwing Energy 的 400 MW PPA）；BECCS 扩张以生成 CDR 信用；以及中国国家政策把 CCUS
              视为战略性工业技术。CarbonHerald 称，到 2024 年全球投资已增至约 $6.4B，是此前三倍；IEA 估计近期 CCUS 项目已募集超过 $15B 商业债务。45Q 抵免估计的政策总价值超过
              $30B，属于美国政府已承诺支持。
