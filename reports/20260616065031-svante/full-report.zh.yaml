  - id: FV003
    title: 分情景估值回报区间
    type: range
    layout: wide
    summary: 假设 2026 年以约 US$1B 估值进入，展示低 / 基准 / 高三档企业价值区间及隐含投入资本倍数。
    data:
      items:
        - label: 熊市情景（降轮 / 困境）
          low: 300
          mid: 400
          high: 500
        - label: 基准情景（到 2027 年 1-2 个 FOAK 达到 FID）
          low: 800
          mid: 1000
          high: 1200
        - label: 牛市情景（3-5 个 FOAK + 战略退出）
          low: 2000
          mid: 2500
          high: 3000
    approximationNotes: 所有数值均为 US$M 企业价值。以 US$1B 进入时的隐含 MOIC：熊市 0.3–0.5x，基准 0.8–1.2x，牛市 2.0–3.0x。 数字是作者对 2026–2029 年持有期的估计。优先权结构未知。
    claimRefs:
      - CV027
      - CV036
      - CV038
      - CV039
      - CV043
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: 面向 IC 的八个投资维度评分，采用 1–5 分制，5 分代表最强 / 最具吸引力。
    data:
      items:
        - label: 市场机会（TAM / 增长）
          value: 4
          note: 多十亿吨级 CCS 需求已获确认；政策底线具备结构性
        - label: 技术验证
          value: 3
          note: 超级工厂已投运；尚无 80%+ 开工率的商业规模工厂
        - label: 竞争护城河
          value: 3
          note: 先发制造优势；资本到位后可被复制
        - label: 单位经济性可见度
          value: 1
          note: 披露收入为零；规模化每吨成本尚未确认
        - label: 融资 / 跑道
          value: 2
          note: 只有 CGF 过桥；Series F 尚未宣布；距离 Series E 时间已久
        - label: 估值证据质量
          value: 1
          note: 投后估值未经确认；只有第三方估计
        - label: 战略投资者质量
          value: 5
          note: Chevron、GE Vernova、Temasek、Samsung、CGF —— 顶级验证方
        - label: 退出路径清晰度
          value: 2
          note: 存在并购类比（Oxy/CE、SLB/Aker）；无 IPO 时间表；优先权悬垂未知
    approximationNotes: 评分（1–5）仅基于公开证据作出的作者判断。单位经济性和估值证据得 1 分， 反映的是财务指标完全未披露，而非对技术作出负面评价。
    claimRefs:
      - CV001
      - CV006
      - CV022
      - CV027
      - CV031
      - CV035
      - CV039
