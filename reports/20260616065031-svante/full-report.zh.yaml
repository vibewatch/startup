      - number: '5.8'
        title: 附录
        blocks:
          - type: callout
            title: 商业 Gigafactory 构成制造护城河
            body: >
              Redwood Facility（141,000 sq ft，10 Mtpy CO₂ 过滤器产能，2025 年 5 月投运）是全球唯一一座商业规模 MOF 碳捕集过滤器制造工厂。叠加 BASF CALF-20
              供应协议，以及与 SAMSUNG E&A 合作的 C-READY 模块化工厂方案，Svante 已搭建垂直整合的制造和交付栈，竞争者短期内复制难度高、成本也高。
            calloutType: strength
            claimRefs:
              - CE011
              - CE012
              - CE015
              - CE021
          - type: callout
            title: BASF 作为 CALF-20 单一来源，是关键供应链风险
            body: >
              BASF 目前是唯一合格的商业规模 CALF-20 生产商。任何供应中断（技术、商业或地缘政治）都会直接限制 Svante 的过滤器制造吞吐量及其履行商业订单的能力。3M
              的第二涂覆产能缓解了需求激增风险，但无法解决原料 MOF 供应集中风险。
            calloutType: risk
            claimRefs:
              - CE015
              - CE016
          - type: callout
            title: 商业规模耐久性和长期 O&M 成本仍未在船队规模验证
            body: >
              CALF-20 已在 CO₂MENT 试点中跨 4,000+ 小时、在 Climeworks Muttenz 测试中跨 1,300+
              循环证明稳定。不过，在不同气体组成、杂质谱和维护周期下的多年工业船队性能数据仍不可得。过滤器更换计划、吸附剂损耗率和每吨 CO₂ 的长期 O&M 成本均未公开披露，项目融资承销中的总拥有成本估计因此不确定。
            calloutType: risk
            claimRefs:
              - CE038
              - CE039
          - type: callout
            title: DAC 作为第二市场，提供产品平台杠杆
            body: >
              Climeworks Gen 3 现场测试显示，相比 Gen 2，Svante 结构化吸附剂在 1,300+ 循环中实现 2× 捕集效率、能耗降低 50%。随着 Climeworks 瞄准 DOE
              资助的美国百万吨 DAC 枢纽，Svante 的过滤器供应可能成为工业点源和 BECCS 之外有意义的第二收入流，并复用同一座 Redwood
              gigafactory。这种双市场平台在固体吸附剂供应商中独特，也提高了需求侧韧性。
