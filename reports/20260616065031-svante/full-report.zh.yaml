      basis: >-
        Covers major public transactions and listed/private companies in carbon capture, carbon removal, and clean
        energy hardware sectors as of June 2026. Excludes private transactions with undisclosed terms (Holocene, Carbon
        Clean). Primary source data spans 2023–2026 deal announcements and public filings.
