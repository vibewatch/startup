      - number: '8.4'
        title: 可比交易、公开可比公司与方法论
        blocks:
          - type: paragraph
            body: >-
              Svante 的具体定位是收入前模块化固体吸附剂碳捕集 OEM 和项目共同开发商，市场上没有直接可比的上市公司。因此估值需要用四种方法三角校验。第一，M&A 交易可比：Occidental Petroleum 于
              2023 年 8 月以 US$1.1B 收购 Carbon Engineering，是最相近的数据点——一家加拿大注册的碳捕集技术公司，按技术平台价值而非当前收入被收购，约为投入资本的 10x。SLB 以
              US$382M 购买 Aker Carbon Capture 80% 股权（隐含股权价值 $475M），为一家运营活跃但仍在扩张的平台提供了上限锚。2025 年 4 月 Oxy/Holocene
              收购（条款未披露）说明 sub-$500M 区间仍有整合需求。

              第二，公开公司可比：Bloom Energy（NYSE: BE）2026 年 Q1 收入 US$751M（同比增长 130%），企业价值约 US$74B，隐含 ~24–26x EV/Revenue
              倍数；这一倍数更像愿景上限，反映的是 Bloom 受 AI / 数据中心需求拉动，而非 CCS 行业常态。LanzaTech（NASDAQ: LNZA）提供熊市警示数据：股价下跌
              ~90%、持续经营警告、1:100 反向拆股，说明商业化前碳利用平台在收入里程碑滑坡时会遭遇严重重估。Finerva 分析显示，截至 2026 年 Q1，绿色能源行业 EV/Revenue 中位数为
              5.4x，EV/EBITDA 中位数为 16.3x，但这些倍数适用于已有收入公司。对收入前平台，收入倍数不适用。

              第三，私募市场可比：Climeworks（DAC，不是直接可比）累计融资超过 US$1B，其中包括 2025 年 7 月 US$162M Series G，估值未披露，但第三方估算为
              US$2.5–5B。Carbon Clean（已融资 $243M）没有公开披露估值。这些可比项说明，即便在商业化前，气候科技碳移除龙头也能获得数亿美元级私募估值。

              第四，重置成本 / 资产底：US$145M Redwood 工厂，加上 IP / 专利组合（30+ 专利族）、战略伙伴生态和 FOAK 项目期权，合计约 US$450–600M。Elemental Impact
              2025 年 6 月调查显示，69% 的投资者预计 FOAK 资本可得性到 2026 年会收缩，这会压低独立收入前估值，也强化了采用谨慎基准区间、而非周期高点倍数的理由。
