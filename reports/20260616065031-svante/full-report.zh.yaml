companyProfile:
  summary: >-
    Svante Technologies Inc. 是一家总部位于 British Columbia 省 Burnaby 的碳捕集与封存解决方案提供商，2007 年以 Inventys 名义成立，2019 年为纪念 Svante
    Arrhenius 更名。公司已在多轮融资中募集超过 US$600 million，战略投资方包括 Chevron New Energies、GE Vernova、Samsung Engineering、Temasek、OGCI
    Climate Investments 和 Canada Growth Fund。两条核心产品线是纳米工程 CALF-20
    金属有机框架固体吸附剂过滤器，以及模块化旋转接触器设备，设计目标是在水泥、制浆造纸、氢能、油气炼化等难减排行业，以及生物质能碳捕集（BECCS）和直接空气捕集（DAC）场景中，以 90% 以上效率捕集工业 CO₂。截至 2026 年
    6 月，公司尚未进入商业收入阶段，所有活跃项目合作仍处在 MOU、pre-FEED 或可行性阶段，最终投资决策预计在 2027–2028 年作出。
