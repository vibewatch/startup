  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与业务线
        blocks:
          - type: paragraph
            body: >-
              Svante 有三条不同但相互咬合的业务线。第一条是设备制造：Svante 在 Burnaby Redwood 工厂设计并生产基于固体吸附剂的过滤模块和旋转吸附机（RAM）。第二条是技术包与服务，Svante
              授权其技术，并向工业排放方提供工程、项目开发顾问和一体化项目开发服务。第三条在战略上最关键，即通过 Svante Devco
              共同开发项目；公司借助与主排放方签署的联合开发协议（JDA），在首创型（FOAK）商业碳捕集设施中持有股权。

              收入完全未披露——Svante 没有发布经审计财务报表，截至 2026 年 6 月也没有公开收入、ARR 或利润率数据。CEO
              已承认公司需要「破解变现密码」，说明收入模式仍在从技术示范走向可复制的商业回报。代理信号显示，公司已有实质项目开发活动：Delek Big Spring 炼油厂 CCUS 项目已通过遴选，Mercer Peace
              River 纸浆厂项目进入 Pre-FEED 阶段，Ashdown Pulp Mill 的 DOE pre-FEED 研究正在推进。Svante 与 Tenaska 合作，把端到端 CO2
              运输和封存整合进商业方案，但尚未形成可公开量化的收入承诺。

              商业化获客主要靠直接接触难减排行业的工业排放方（水泥、纸浆和造纸、炼油、钢铁、氢），并由同时也是客户的战略投资方（Delek
              US、Chevron、Suncor）支撑。这种「投资方即客户」结构加快了管线开发，但短期收入敞口也集中在少数大型工业交易对手身上。
