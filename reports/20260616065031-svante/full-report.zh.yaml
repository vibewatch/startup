      - number: '8.2'
        title: 融资历史、估值锚与资本强度
        blocks:
          - type: paragraph
            body: >-
              对一家收入前公司而言，Svante 的资本形成历史并不寻常：它已通过股权轮（Series B 至 E）融资超过 US$600 million，另有 US$100 million CGF 可转债和 C$15
              million InBC 股权投资，却从未披露经审计资产负债表、收入数字或投后估值。2022 年 12 月完成、并延伸至 2023 年 Q1 的 US$318 million Series
              E，是当时全球点源碳捕集技术公司单笔最大融资。Caplight、Tracxn 等第三方情报服务基于近期轮次结构和规模，报告了约 US$1 billion 的隐含企业价值，但 Svante 或其投资者均未确认。

              Burnaby 的 US$145 million Redwood 制造设施构成重要硬资产基础：这座 141,000 sq ft gigafactory 的过滤器产能最高可支持每年捕集 10 million
              tonnes CO₂。在重置成本框架下，这是最重要的单一有形资产。叠加估算的 IP、品牌生态和开发期权价值，资产底约为 US$450–600 million。Canada Growth Fund 可转债结构（两笔
              US$50M，第二笔与项目特定里程碑挂钩）引入优先权栈复杂度：具体转股折扣、上限和利率尚未公开披露；截至 2026 年 6 月，第二笔提款状态也未确认。2026 年 5 月任命新 CFO（Terry
              Lefebvre），说明公司正在投入财务基础设施，既可能为未来融资，也可能为退出准备。资本强度仍高：CGF 资金指定用于 FOAK
              项目共同投资，而非公司运营，这意味着任何商业现金流回收周期启动前，很可能还需要未来轮次。
