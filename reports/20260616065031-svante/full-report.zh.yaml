              工业交易对手的典型项目生命周期为 MOU → pre-FEED（约 1–2 年）→ FEED（约 1 年）→ FID → 建设（约 2 年）→ 商业运营，意味着大多数当前项目距离收入确认还有 3–5
              年。Chevron、Delek、GE Vernova 等投资方兼客户的重叠，意味着这些早期交易对手短期内不太可能取消，因为取消会损害其股权价值。Delek（DOE $91M）、North Star（CGF
