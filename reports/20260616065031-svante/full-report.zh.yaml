              月更新中发布结果，提供了超出公司声明的独立技术验证。Lafarge Canada 在 BC Richmond 水泥厂的 Project CO2MENT 自 2019 年运行，2023 年进入第 3 阶段，与
              Dimensional Energy 合作将 1 吨/日捕集 CO2 转化为合成烃——这是水泥厂的首次此类示范。LafargeHolcim Colorado pre-FEED 研究（2023 年 1
              月完成）评估了 Holcim Florence 水泥厂 1.5 Mt/yr 商业规模工厂，并得出结论：若 45Q 信用达到 $85/吨，则具备经济可行性。Delek Big Spring 炼油厂项目代表
