  - id: FU003
    title: 客户旅程图 — 从工业排放方到商业部署
    type: journey-map
    layout: wide
    summary: 追踪工业排放方与 Svante 初次接触之后，如何经过试点验证、工程推进，最终实现商业化碳移除或 CDR 信用生成。
    data:
      nodes:
        - id: mou
          label: 发现与 MOU
          description: 工业排放方或 CDR 买家识别脱碳需求；Svante 签署非排他 MOU 或合作协议
        - id: feasibility
          label: Pre-FEED / 可行性研究
          description: Svante 与交易对手完成工程设计、成本估算和风险评估；申请政府补助
        - id: pilot
          label: 试点 / 演示运行
          description: 小规模捕集工厂部署在主机场地；在真实工业条件下验证技术表现
        - id: engineering
          label: FEED / 工程与许可
          description: 详细工程；Class VI 井许可或封存协议；项目融资锁定；达成 FID
        - id: construction
          label: 建设与调试
          description: 全规模工厂建成并投运；运营就绪测试；CDR MRV 框架搭好
        - id: commercial
          label: 商业运营与 CDR 包销
          description: 工厂满负荷运行；CDR 信用售出或 CO2 封存；长期包销协议生效；后续合作或扩产
    claimRefs:
      - CU029
      - CU030
      - CU027
      - CU037
  - id: FR001
    title: 风险热力图 — 缓释后的可能性 vs. 剩余严重性
    type: matrix
    layout: wide
    summary: 将 Svante 十二类风险映射到可能性和缓释后剩余严重性；FOAK 执行和 CO₂ 封存许可是剩余严重性最高的风险。
    data:
      columns:
