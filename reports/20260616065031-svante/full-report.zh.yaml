      - number: '4.6'
        title: 资本充足性、财务风险与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，公开信息无法精确评估 Svante 的资本状况。已知承诺资本合计约 US$645M（US$500M+ 私人资本，加上计入私人总额内的 US$145M 工厂投资），其中一部分已投向
              Burnaby 工厂（US$145M），并支撑约 350 人团队和项目管线活动。CGF 首批资金（US$50M）提供项目共同投资能力，但现金消耗率、剩余现金和下一轮融资触发点均未公开。因此，runway
              无法从公开证据中解出。

              三类结构性财务风险最突出。第一，政策依赖：美国 45Q 抵免和加拿大 CCUS ITC 对项目级经济性不可或缺；政府或立法变化——尤其是美国 2024 和 2028 选举周期之后——可能削弱 Svante
              的项目管线经济性，并推迟最终投资决策。第二，FOAK 执行风险：首创型商业项目有实质成本超支和性能风险；IEEFA 发现，全球真实 CCS 项目的实际捕集率持续低于预测。第三，可转债稀释：CGF
              拥有按未披露条款债转股的选择权，给资产负债表和股权结构带来不确定性，下游投资者无法完全评估。

              IEEFA、IISD 和学术研究者等关键分析方强调，迄今 CCS 项目未能达到捕集率目标，而成本已经翻倍。即便 Svante 的技术路径不同于基于溶剂的传统系统，这些发现仍直接适用于 Svante
              所在行业。财务结论是：Svante 相对同业资本充足，但在商业规模上仍处于收入前阶段，高度依赖政策，且缺少支撑尽调承销决策所需的关键指标透明度。
