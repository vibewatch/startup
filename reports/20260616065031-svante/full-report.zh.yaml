      - number: '2.6'
        title: 采用约束、风险因素与反向证据
        blocks:
          - type: paragraph
            body: >-
              即便政策顺风，几项重大约束仍在压制采用。第一，CO2 封存和运输通道是硬门槛：LeadIT 确认，每个推进中的工业 CCS 项目都连接到共享 CO2
              基础设施；没有封存伙伴合同，不论其他条件如何，项目都无法推进。在美国，CO2 注入需要 EPA Class VI 井许可，历史上审批要 3–6 年；2025 年之前 13 年只批准了 8 个。虽然 Class
              VI 审批在 2026 年第一季度加速（一个季度批准 3 个，与 2025 全年持平），但截至 2026 年第一季度末，仍有 106 份申请在审，覆盖 387 口井。Enverus 预测，美国 Class VI
              注入能力到 2027 年底将超过 100 Mtpa，到 2030 年达到 300 Mtpa——但这仍取决于项目管线，并受工期延长影响。


              第二，FOAK 资本强度很高：Brevik 水泥 CCS 项目需要超过 80% 国家资金；欧洲工业 CCS 端到端成本为 €105–280/tonne，远高于当前 ETS 价格。Dow 将其 Path2Zero
              Canada 项目推迟到 2029 年，说明即便在政策友好地区，企业资本周期收紧时工业 CCS 项目也会暂停。第三，CCUS
              系统更像定制工程而不是模块化产品：每个项目都按特定烟气成分、工厂布局和封存通道定制——这限制了学习曲线降本，也让成本预测不可靠。IEA 的 WEO 2025 把 CCUS 对 2050 年累计减排的贡献上限设为
              4.9%（低于 2021 年的 13%），反映可再生能源和电气化作为直接替代方案的竞争力上升。IEEFA 另指出，欧盟端到端处置成本要靠持续达到或高于 €105/tonne 的碳价才能盈亏平衡——而这一价格只在
              2023 年 2 月出现过一次。这些都是重大反向信号，必须约束对 Svante SAM 的乐观市场预测。
