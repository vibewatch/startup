        - label: 活跃试点或演示（工业主机场地）
          value: 4
        - label: Pre-FEED / 可行性（工程研究阶段）
          value: 3
        - label: 工程 / 许可（建设管线）
          value: 1
        - label: 已签约 CDR 包销（商业收入）
