      - CE004
      - CE005
      - CE006
      - CE014
      - CE021
  - id: FE002
    title: VeloxoTherm 客户工作流 — 从烟气到管道级 CO₂
    type: flow
    layout: wide
    summary: |
      五步运营流程展示 Svante 捕集系统如何处理工业烟气：从排放源进入预处理、吸附、纯化，最后交付管道级 CO₂。
    data:
      nodes:
        - id: flue-gas-source
          label: 工业烟气源
          detail: 水泥窑、SMR H₂ 工厂、FCC 装置、回收锅炉或 DAC 环境空气；CO₂ 浓度随行业不同为 4–30%
        - id: pretreatment
          label: 预处理系统
          detail: 直接接触冷却器把气体冷却至 <50°C；湿式洗涤器去除 SOx/颗粒物；保护床去除残余污染物；满足 RAM 进料规格（SOx ≤1.5 ppm，PM ≤0.2 mg/m³）
        - id: ram
          label: 旋转吸附机（RAM）
          detail: CALF-20 SABs 在吸附区吸附 CO₂；低压蒸汽以约 60 秒循环再生吸附剂；浓缩 CO₂ 气流排出；净化烟气从排气筒排出
        - id: purification
          label: CO₂ 纯化与压缩
          detail: 催化氧化可得到 >95% CO₂ 纯度；低温蒸馏选项可得到 ≤99.9%；CO₂ 被压缩至管道压力（Linde FEED 设计中为 ≥2,200 psia）
        - id: co2-product
          label: 管道级 CO₂ 交付
          detail: ≥95% 纯度 CO₂ 用于地质封存、e-fuels、CO₂ 注入混凝土或 CDR 信用生成；无危险二次排放
      edges:
        - from: flue-gas-source
          to: pretreatment
          label: 原始烟气
        - from: pretreatment
          to: ram
          label: 预处理后进料（≤50°C，杂质已去除）
        - from: ram
          to: purification
          label: 浓缩 CO₂ 气流（约 60 秒循环产物）
        - from: purification
          to: co2-product
          label: 管道级 CO₂（≥95% 纯度，已压缩）
    claimRefs:
      - CE003
      - CE007
      - CE010
      - CE031
      - CE033
      - CE036
