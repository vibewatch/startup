  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术放大与 FOAK 执行风险
        blocks:
          - type: paragraph
            body: >-
              Svante 的商业论点完全建立在 FOAK 碳捕集工厂能按规格、按时运行之上。位于 BC Burnaby 的 Redwood gigafactory——2025 年 5 月投运，是全球第一座商业规模 MOF
              吸附剂过滤器制造设施——可为每年最高捕集 1,000 万吨 CO₂ 的工厂提供设备。不过，制造产能本身不能保证商业性能：每一个实际捕集装置，仍是在工业主场址进行的首创型棕地集成。美国东南部 BECCS 项目（每年
              >500,000 吨，纸厂回收锅炉）截至 2026 年 3 月仍处在可行性研究阶段；工程、成本进度估算和风险评估仍在推进，尚未作出任何最终投资决策。

              更广 CCUS 行业的 FOAK 项目在成本超支、进度延误和性能不达标方面已有充分记录。2025 年，美国约 42 个 FOAK 清洁能源项目被取消。UK Public Accounts
              Committee（2025）指出，英国没有商业规模运行的 CCUS 技术案例，国际案例显示政府性能预期「远不能保证」。IEEFA 2026 年 1 月 EU Parliament
              演示记录显示，随着反复低于预期的表现重校预测，IEA 在 WEO 2021 至 WEO 2025 之间已将 CCS 贡献估计下调超过 82%。IEEFA 对 16 个运行项目的分析发现，尽管行业声称可达到 95%
              捕集率，现有项目没有一个能年复一年稳定捕集超过 80% 的 CO₂。Saskatchewan 的 Boundary Dam 项目从未超过 60% 捕集率。常见 FOAK
              失败模式包括未预期的集成挑战（热管理、压力动态、循环损失）、吸附剂降解，以及棕地工业场址的承包商延误。Svante 的模块化旋转接触器设计部分缓解这些风险——在可比 climate-tech
              数据中，模块化与较低成本超支相关——但无法消除 FOAK 执行不确定性。FOAK-to-NOAK 学习曲线取决于早期项目成功，因此 Södra 试点（Sweden）和美国 BECCS
              项目对后续管线加速具有不成比例的重要性。
            claimRefs:
