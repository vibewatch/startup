      - number: '5.4'
        title: 制造与供应链
        blocks:
          - type: paragraph
            body: >
              2025 年 5 月，Svante 正式投运 Redwood Facility——位于 British Columbia 省 Burnaby、面积 141,000 平方英尺的 Centre of
              Excellence for Carbon Capture and Removal。Redwood 由 US$145 million 资本投入建成，并获得 Chevron New
              Energies、Temasek、M&G、Canada Growth Fund、United Airlines Ventures、Samsung 和 GE Vernova
              等战略投资方支持；它是全球第一座商业化碳捕集过滤器 gigafactory，能生产足够的固体吸附剂过滤器，支撑每年最高 1,000 万吨 CO₂ 捕集。过滤器生产依赖 Svante 的
              roll-to-roll「Sorbent on a Roll」涂覆工艺，将 CALF-20 MOF 吸附剂以高产量、低成本涂覆到层压片材上，再堆叠成高性能过滤模块。BASF 于 2023 年 10 月与
              Svante 签署商业供应协议，以工业规模（每年数百吨）生产 CALF-20——这是 MOF 首次以如此规模商业化制造——并采用低温绿色化学工艺。为承接 Climeworks DAC
              供应协议带来的产能需求，Svante 还与 3M 锁定额外 roll-to-roll 涂覆产能，将其作为第二供应商。SAMSUNG E&A 是 C-READY
              撬装模块的独家工程、采购和制造（EPF）伙伴，Svante 则供应接触器机器和过滤床。
