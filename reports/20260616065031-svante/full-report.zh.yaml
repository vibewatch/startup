  - id: FV002
    title: 关键驱动因素的估值敏感性
    type: bar
    layout: standard
    summary: 四类情景驱动因素下的企业价值敏感性区间（US$M，示意）：交易可比锚点、 资产重置成本、按里程碑调整的风险投资估值，以及压缩后的熊市情景。
    data:
      items:
        - label: 重置成本底线（工厂 + IP）
          value: 550
        - label: SLB/Aker 类比（收入前折价）
