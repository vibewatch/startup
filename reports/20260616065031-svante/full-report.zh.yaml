      - number: '3.4'
        title: 伙伴与竞争者的双重关系
        blocks:
          - type: paragraph
            body: >
              Svante 的竞争定位受到 BASF 和 Linde 双重角色关系的复杂化：两家公司既是伙伴，也可能在不同项目语境下成为竞争者。

              BASF 是 Svante 的液态胺伙伴：对于烟气 CO₂ 浓度低于 CALF-20 MOF 固体吸附剂最佳阈值（约 12%）的客户（如天然气联合循环电厂），Svante 授权并转售 BASF 的 OASE
              blue 洗涤液。这个合作让 Svante 能提供全谱碳捕集组合——高 CO₂ 流用固体吸附剂，低 CO₂ 流用 OASE blue——而不是把这些项目拱手让给竞争者。不过，BASF 也通过 Linde 的
              HISOLV 方案和自有直销渠道独立授权 OASE blue；在 BASF-Linde 交付完整交钥匙捕集工厂的项目中，它们与 Svante 的项目交付服务直接竞争。

              Linde 既是 Svante 伙伴（针对 SMR 制氢工厂的 DOE 资助联合工程研究），也是竞争者，因为它与 BASF 共同开发了 HISOLV/OASE blue 燃烧后捕集方案。Linde 的 EPC
              能力和 60+ 个商业工厂案例，使其在任何液态胺可接受的工业 CCS 招标中，都是强大的全服务竞争对手。

              Samsung E&A 是明确的伙伴：C-READY 标准化滑橇式模块联合开发协议指定 Samsung E&A 为 Svante 模块块的独家 EPC 制造伙伴。Samsung E&A
              的模块化和数字项目交付能力，加上 Svante 的 CALF-20 过滤器超级工厂，构成了一条垂直整合的模块化交付渠道，Svante 的直接竞争者尚未复制。不过，如果合作无法放量，Samsung E&A
              也可能部署竞争性捕集技术；其在韩国和东南亚 EPC 合同中的主导地位，还带来地理集中风险。

              MHI 使用类似的轻资本授权模式——与 Worley、KBR、Saipem 和 Chiyoda 合作触达工业客户——这让它无需用自有资本执行项目，就能快速渗透 Svante 瞄准的难减排行业。
            claimRefs:
