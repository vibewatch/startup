        - 资本密集型清洁能源硬件 OEM 中最近的上市类比
        - Bloom 已产生收入且有 AI 顺风；CCS 并非类似需求驱动
      - - 'LanzaTech（NASDAQ: LNZA，2024–25 年）'
        - 上市公司
        - 股价下跌 ~90%；持续经营警示；1:100 反向拆股
        - 警示性降级：商业化前碳利用平台失败
        - 面向尚未产生收入的碳工艺公司的直接警示类比
        - 碳利用不是碳捕集；Svante 战略背书更强
      - - 绿色能源板块中位数（2026 年 Q1）
        - 板块基准
        - EV/Revenue 5.4x；EV/EBITDA 16.3x（板块中位数）
        - 已产生收入的清洁能源公司的板块中位数
        - 提供有收入可比对象会对应什么估值的下限背景
        - Svante 目前没有收入；倍数不能直接适用
    notes: >-
      所有可比对象都只是部分类比；对于尚未产生收入的模块化固体吸附剂碳捕集 OEM 和项目共同开发商，不存在完全等同的上市或私有可比对象。Oxy / CE 和 SLB / Aker
      是质量最高的交易可比。倍数为近似值，来自公开文件和行业报告。
    enumerationScope:
