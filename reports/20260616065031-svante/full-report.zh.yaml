      - number: '8.3'
        title: 牛市、基准与熊市情景分析
        blocks:
          - type: paragraph
            body: >-
              对 2026–2029 年视角的假设投资者，三种估值情景圈定了结果区间。牛市情景要求：到 2027 年底有 3–5 个 FOAK 项目达成最终投资决定；Svante
              开始从首批投运工厂确认过滤器制造收入；一个或多个战略收购方（能源巨头、OEM 集团）进入竞价流程。FTI Consulting 对 CCS M&A 市场的分析显示，2023 年一项碳管理基础设施资产吸引了近 30
              个潜在买家，说明市场对已验证平台资产的战略需求仍高。在这些条件下，Oxy/Carbon Engineering 以 US$1.1 billion 完成的类比交易——其本身也是收入前交易——给现实退出底部定锚；若
              Svante 的部署管线先于竞争对手兑现，协同溢价可指向 US$2–3 billion 企业价值。

              基准情景假设 1–2 个 FOAK 项目在 2027 年前达成 FID，商业过滤器销售于 2027–2028 年以温和规模启动，并通过后续 Series F
              或结构化债务轮为建设承诺提供资金。在这一情景下，最可比的公开交易锚是 SLB/Aker 交易，隐含股权价值约 ~US$475M，标的为运营活跃公司；这意味着 Svante 作为收入前平台，基准情景落在
              US$800M–US$1.2B 区间，与第三方估算和最近轮次的隐含估值一致。

              熊市情景适用于 FOAK 项目时间表进一步滑坡、2026 年后美国政策不确定性加剧，或公司需要下轮融资来补桥接资本。Aker Carbon Capture 退市和收缩表明，即便是一家商业上活跃的点源 CCS
              公司，如果不能持续增长收入，也无法维持公开上市地位。熊市估值压缩至 US$300–500M，将反映有形资产基础的 1x–1.5x，与困境或重组情景一致。
