      - number: '2.2'
        title: 市场规模：多重分析口径
        blocks:
          - type: paragraph
            body: >-
              分析师对 2026 年全球 CCS 市场的估计跨度很大，反映了边界定义、技术范围和方法论差异。The Business Research Company 报告 2026 年市场规模为 $8.15B（高于 2025
              年的 $7.1B，CAGR 14.8%），到 2030 年增至 $14.4B，CAGR 15.3%——增长由工业脱碳、燃烧后技术部署和氢经济扩张推动。Fortune Business Insights 估算
              2026 年市场为 $5.31B（2025 年为 $4.51B），预计到 2034 年达到 $19.98B，CAGR 18.03%；更窄的 2026
              年数字可能反映其边界更紧，排除了一部分油气天然气处理收入。Technavio 预测 2025 至 2030 年期间增长 $25.89B，CAGR
              32.1%，意味着未来市场大得多，也可能纳入了更广价值链收入，包括基础设施和封存服务。StartUs Insights 估计行业 2025 年约为 $8.1B，到 2032 年增至 $18.1B（CAGR
              13%），与 BRC 大体一致。


              这些分歧部分来自定义：纳入 CO2 封存服务、EOR 记账收入和运输管道的市场，会大于只计算捕集设备和工程服务的市场。一个有用的产能口径是：S&P Global Horizons 和 GCCSI 报告称，2026
              年全球运营中 CCS 产能达到 73 Mt CO2/yr，管线中约有 1,300 个项目；GCCSI 2025 Status Report 统计了 77 个运营设施（同比 +54%）、47 个在建设施，以及
              734 个总项目，合计管线产能 416 Mtpa——自 2017 年以来 CAGR 32%。到 2030 年，已宣布项目若全部执行，可交付约 430 Mtpa 捕集产能和 670 Mtpa
              封存产能。这些实体产能指标支撑 Technavio 高端商业乐观情景，而 IEA 更保守的 NZE 2025 Scenario——其中 CCUS 到 2050 年最多贡献累计减排的 4.9%，低于 WEO
              2021 的 13%——锚定反向情景。Svante 的 SAM（主要面向北美、难减排工业点源、可模块化改造的可服务市场）没有公开数据独立测算，仍是尽调缺口。
