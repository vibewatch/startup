      - number: '2.7'
        title: 图表材料
        blocks:
          - type: callout
            title: 封存通道才是限速约束，不是捕集技术
            body: >-
              迄今推进中的每个工业 CCS 项目，都只有在接入共享 CO2 运输与封存网络（Northern Lights、Porthos、Ravenna Hub）后才成功。未能锁定封存通道的项目——包括 Heidelberg
              的 Slite（Sweden）和 Vicat 的 Lebec（California）——无论技术准备度如何，都被终止或暂停。这意味着 CO2 基础设施才是 Svante
              可服务管线的主要约束，而不是其捕集技术性能。
            calloutType: risk
            claimRefs:
              - CM033
              - CM039
          - type: callout
            title: 45Q 是美国市场基石：$85/tonne 工业 CCS 抵免重塑项目经济性
            body: >-
              45Q 对工业点源 CCS 支付 $85/tonne，已由 IRA（2022）和 OBBBA（2025）更新，现在是美国脱碳工具箱中最有力的单一金融工具。对每年捕集 100 万 t CO2 的设施来说，它可在
              12 年内每年产生 $85M 税收抵免收入。该抵免可转让，也可获得财政部 direct pay；即便没有纳税义务，也能融资。IRS Notice 2026-1 在 EPA 报告过渡期间为 2025 合规提供额外
              safe-harbor 清晰度。这为 Svante 的北美管线建立了持久经济基础，不依赖碳市场价格水平。
            calloutType: insight
            claimRefs:
              - CM016
              - CM017
              - CM018
              - CM038
          - type: callout
            title: SAM 估计依赖行业份额假设，尚未被一手数据验证
            body: >-
              Svante 模块化固体吸附剂平台在全球 CCS 市场中的 SAM，是把 40–50% 难减排工业份额（来自 WEF 和 GCCSI 行业分析）套用到分析师 TAM
              数字上估算出来的。没有分析师报告专门测算北美工业设施模块化固体吸附剂改造市场规模。在拿到 Svante 的一手市场研究和客户管线数据前，这个估计应被视为初步边界。
            calloutType: assumption
            claimRefs:
              - CM007
              - CM025
          - type: callout
            title: IEA WEO 2025 下调 CCUS 角色，是重大反向信号
            body: >-
              IEA 的 World Energy Outlook 2025 把 CCUS 到 2050 年对累计减排的贡献上限设为 4.9%——低于 WEO 2021 的
              13%。这一下降轨迹反映可再生能源和电气化经济性越来越有竞争力。IEEFA 另行测算，欧盟端到端 CCUS 处置成本（€105–280/tonne）自 2019 年以来除一个季度外均高于 EU ETS
              价格。这些发现并不排除 Svante 的市场机会，因为后者由合规强制和 45Q/OBPS 经济性驱动，而不是只靠碳市场价格；但长期市场规模假设需要接受审视。
            calloutType: risk
            claimRefs:
              - CM021
              - CM022
              - CM036
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 工业 CCS 竞争格局
        blocks:
          - type: paragraph
            body: >
              Svante Technologies 在 2026
              年进入商业部署时，是全球差异化最强的模块化固体吸附剂点源碳捕集公司；但它面对的是一批既有液态胺供应商，这些公司合计运营数百座商业工厂，并在同一批难减排行业拥有数十年客户关系。竞争格局可分为五类：（1）MHI/Kansai、Linde/BASF
              等大型液态胺技术授权方，拥有 18–60+ 个商业工厂案例；（2）SLB Capturi（Just Catch）和 Carbon
              Clean（CycloneCC）等模块化胺供应商，追求以更小占地快速部署；（3）Svante 自身所在的模块化固体吸附剂细分，CALF-20 MOF 过滤器能降低能耗惩罚，并避免处理液态胺；（4）Carbon
              Engineering/Oxy 在 Texas 运营 Stratos 工厂的大型液体溶剂直接空气捕集（DAC）；以及（5）CarbonCapture Inc. 和 Climeworks 的模块化固体吸附剂
              DAC，它们瞄准大气 CO₂ 移除，而非工业点源排放。Svante 是唯一用同一种固体吸附剂过滤器技术横跨工业点源和 DAC
              的玩家，这给它带来选择权，也要求它同时在多个细分市场竞争。模块化固体吸附剂捕集与胺基系统的差异具有战略意义：液态胺系统需要溶剂储存、再生处理基础设施和连续蒸汽再生；Svante 的 CALF-20
              快速温度摆动吸附无需散装液体化学品，降低现场复杂度，并可能在部分司法辖区加快许可。不过，固体吸附剂系统最适合 CO₂ 浓度高于 12% 的场景，这使 Svante 可服务的烟气范围小于更广的胺基市场。
