      - number: '2.3'
        title: 难减排行业需求垂直
        blocks:
          - type: paragraph
            body: >-
              对工业 CCS 来说，水泥和石灰是战略上最重要的行业，因为不可消除的煅烧排放——约占行业 CO2 的 60%——无法靠燃料切换解决。该行业每年生产约 40 亿吨水泥（2024 年），约占全球 CO2 排放的
              8%。Heidelberg Materials 于 2025 年 6 月在 Norway Brevik 启用全球首座工业规模水泥 CCS 设施，采用 SLB Capturi 胺基溶剂技术，每年捕集约
              400,000 吨 CO2（工厂排放的 50%）。不过，这个里程碑需要 Norway 政府在 Longship 计划下资助超过 80% capex，并在 10 年内覆盖 75–100% 的合格
              opex。LeadIT 2026 年 5 月 Green Cement Technology Tracker 覆盖全球 175+ 个水泥 CCS 项目，但预计到 2035 年捕集的行业 CO2 不到
              2%——这个明显缺口说明项目公告与项目完工之间仍有鸿沟。Holcim（Belgium Obourg）和 Heidelberg（Sweden Slite）项目停滞，都直接与政府资金失败有关。


              制浆造纸是 Svante 当前最活跃的商业行业：生物质燃烧锅炉烟气提供中等浓度 CO2 流，适合改造捕集；如果 CO2 属于生物源，捕集和封存就能生成符合高端 CDR 市场条件的 BECCS 信用。Svante
              与 Mercer International 的 Alberta 项目瞄准的正是这一细分。2025 年，全球 BECCS 在项目开发产能上首次超过 DAC（S&P
              Global），显示投资者对生物源捕集经济性的信心增强。钢铁是中期机会：高炉路线每吨钢排放 2.0–2.2 吨 CO2；配合天然气和 CCS 的 DRI 可降至约 0.6 吨 CO2/吨；EU CBAM
              分阶段落地，开始给传统钢铁对欧出口施加成本压力。制氢（SMR + CCS）以及化工 / 废弃物能源构成近期 TAM 的其余部分。IEA 确认，到 2030 年投入运营的新 CCUS
              项目中，超过一半瞄准制氢、CDR 或难减排工业行业，标志着市场结构正从传统天然气处理主导转向新需求。
