            body: >-
              Svante 逐项目销售资本设备和技术授权，传统 SaaS 留存指标（NRR、GRR、logo churn）不适用。公司没有披露 NRR、GRR
              或正式合同续约率，这与其私人、商业化前状态一致。持久性信号只能从项目里程碑连续性推断：Project CO2MENT 已与 Lafarge Canada 跨三个阶段运行超过六年（2019–2026），说明
