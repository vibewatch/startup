      - number: '7.3'
        title: 封存、运输与客户采用依赖
        blocks:
          - type: paragraph
            body: >-
              Svante 同时做捕集技术和项目开发，但 BECCS 项目要跑完整条价值链，CO₂ 运输基础设施和地质封存运营商全靠第三方。美国东南部 BECCS 项目计划在墨西哥湾沿岸地区通过 Class VI
              许可做永久地质 CO₂ 封存。封存许可通常要两年或更久；即便州级主导能缩短路径，封存就绪仍是项目 FID 的关键路径约束。整条 CCUS 价值链存在结构性成本缺口：目前封存一公吨 CO₂ 的成本为
              $150–$220，而 EU ETS 碳价约为 $52/tonne，留下 $100–$170/tonne 的缺口，只能靠补贴、税收抵免或自愿碳信用收入补上。Sustainableatlas.org
              指出，Class VI 许可瓶颈意味着截至 2026 年初，「尽管已有数百份申请，获批的 Class VI 许可仍不到一打」。

              客户采用节奏的风险很尖锐，因为 Svante 的收入模型依赖工业客户（纸浆与造纸、水泥、氢、乙醇）承诺资本开支很重、开发周期多年的改造项目。高质量 CDR
              信用的自愿碳市场需求在增长，但买方集中在少数科技公司（Microsoft、Frontier Advance Market Commitment）；承购定价仍高度波动，给 BECCS 项目带来收入不确定性。美国
              BECCS 项目的 CDR 信用「拟出售给希望处理 Scope 1 和 Scope 2 排放的组织」，因此直接暴露于 VCM 需求周期。CO₂ 管线路由面临升级的法律反对：South Dakota 已禁止 CO₂
              管线使用征用权；Iowa 正在考虑类似立法；California 在 PHMSA 安全规则最终落地前禁止州内 CO₂ 管线。British Columbia 在 Petroleum and Natural Gas
              Act（Part 14）下的监管框架要求另行取得 BC 省部委颁发的封存储层许可，给 Svante 加拿大本土项目增加了监管依赖。
