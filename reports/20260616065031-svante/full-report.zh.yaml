      - number: '3.6'
        title: 图表材料
        blocks:
          - type: callout
            title: 美国 DOE 资助取消把 Svante 市场重心推向加拿大
            body: >
              Trump administration 取消超过 $3.7 billion 的美国 DOE CCS 资助，已使多个 Svante 项目伙伴停滞，并把公司近期主要增长市场从美国转向 Alberta 的
              Pathways Alliance 和其他加拿大激励计划。这一政策逆转利好收入地域更多元的液态胺既有厂商（欧洲的 SLB Capturi；亚洲 / 欧洲的 MHI），也让 Svante
              在竞争者巩固这些关系前赢得加拿大合同的执行压力进一步上升。
            calloutType: risk
            claimRefs:
              - CP027
          - type: callout
            title: BASF：战略伙伴与间接竞争者
            body: >
              BASF 在 Svante 竞争格局中处在一个罕见的模糊位置。作为转售伙伴，BASF 的 OASE blue 溶剂把 Svante 可服务市场延伸到 CALF-20 难以高效捕集的低 CO₂
              浓度烟气。作为独立授权方（通过 Linde 的 HISOLV EPC 方案），BASF 又争夺同一批工业捕集合约，并拥有深得多的参考工厂数据。投资者和尽调团队应厘清 Svante 的 OASE blue
              转售独家范围，以及随着 CCS 市场规模扩大，BASF 是否可能退出或绕开该合作。
            calloutType: insight
            claimRefs:
              - CP016
              - CP017
          - type: callout
            title: Svante 拥有唯一专用固体吸附剂过滤器超级工厂
            body: >
              Svante 位于 Vancouver 的过滤器超级工厂于 2025 年 5 月投运，是全球第一座专门制造碳捕集固体吸附剂过滤器的设施，披露产能足以支持每年捕集 1000 万吨
              CO₂。没有直接竞争者宣布同等的专用固体吸附剂过滤器制造基础设施。这种制造优先策略旨在消除通常拖慢首创型工业项目的交付瓶颈，也构成一种结构性优势；Carbon Clean、CarbonCapture Inc. 和
              DAC 玩家若不进行多年资本投入，很难复制。
            calloutType: strength
