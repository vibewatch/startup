      - number: '1.4'
        title: 融资历史与投资者基础
        blocks:
          - type: paragraph
            body: >
              Svante 自 2007 年成立以来已在多轮融资中募集超过 US$600 million 总资本，是全球资本最雄厚的工业碳捕集技术公司之一。Series A 和 B 轮由 Roda
              Group、Mitsui、Chevron Technology Ventures 和 Chrysalix 支持。Series C 轮由 OGCI Climate Investment 领投。Series D 轮于
              2021 年完成，由 Suncor 和 Temasek 领投。标志性的 Series E 轮于 2022 年 12 月 15 日完成，规模 US$318
              million——按当时披露口径，是全球点源碳捕集技术公司最大一笔融资——由 Chevron New Energies 领投，Temasek、OGCI Climate Investments、Delek
              US、Hesta AG、3M Ventures、GE Vernova、Japan Energy Fund、Liberty Media、M&G Catalyst、Samsung
              Engineering、TechEnergy Ventures、Full Circle Capital 和 United Airlines Ventures 参投。J.P. Morgan Securities
              LLC 担任牵头配售代理，RBC Capital Markets 担任联合牵头。2024 年 8 月，Canada Growth Fund Inc.（CGF）承诺以两期各 US$50 million
              的可转债形式投入最高 US$100 million（约 C$137 million）——这是 CGF 在 British Columbia 的首笔投资。省级创投基金 InBC Investment Corp.
              也投资了 C$15 million。Redwood 制造设施另获 US$145 million 资本承诺。公司在上述任何轮次后的投后估值均未公开披露。
