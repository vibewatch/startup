      - number: '7.2'
        title: 监管、法律与政策风险
        blocks:
          - type: paragraph
            body: >-
              Svante 的项目经济性依赖美国联邦 45Q 税收抵免，以及加拿大联邦/省级碳定价机制。One Big Beautiful Bill Act（OBBBA，2025 年 7 月 4 日签署）将点源 CCS 的
              45Q 维持在 $85/吨至 2026 年，但没有调整已经发生的通胀。Carbon Capture Coalition 计算，通胀已侵蚀 2022 年抵免上调幅度的一半以上，使有效价值降至约 $68/吨；同时
              2020 至 2024 年间建设和设备成本上涨 30–40%。通胀调整要到 2027 年才适用。OBBBA 还限制未在法案生效后两年内（约 2027 年 7
              月）开工设施的可转让性，给项目增加硬时间线。此外，DOE 于 2025 年 10 月终止 321 项财务奖励，总额约 $7.56 billion，削弱了历史上为早期 CCUS 项目去风险的政府共同投资托底。

              CO₂ 封存的 Class VI 井许可是关键监管瓶颈。截至 2026 年 Q1，106 份 Class VI 申请在审，2026 年仅发放 3 份最终许可，只有 5 个项目在主动注入 CO₂。Louisiana
              于 2025 年 10 月暂停新的 Class VI 申请；North Dakota 法院在 2026 年两项判决（Northwest Landowners Association v.
              State；Swenson Living Trust v. NDIC）中推翻该州 amalgamation 法规，认定孔隙空间整合构成违宪征收——这可能使 Summit Carbon 的 Class VI
              许可失效，并形成不利先例。针对 West Virginia primacy 的 Fourth Circuit 挑战（West Virginia Surface Owners' Rights
              Organization v. Zeldin）仍在进行。California 的 CARB 于 2026 年 5 月发布 CCUS 监管草案，要求注入后 100 年监测。PHMSA 于 2025 年提出全面
              CO₂ 管道安全规则，因应 2020 年 Mississippi Satartia 事件，新增设计、应急响应和蒸气扩散要求。截至 2026 年中，未发现具体点名 Svante
              的直接监管执法、诉讼或专利争议；Svante 的法律敞口是 CCUS 行业系统性的，而非公司特定。
