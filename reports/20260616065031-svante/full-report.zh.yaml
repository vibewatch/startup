      - number: '2.4'
        title: 买方、用户、付款方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              工业 CCS 采购链多方参与、按顺序推进：工厂所有者承担排放责任并驱动商业论证；可持续 / 脱碳团队倡议项目并解读监管信号；工程与采购团队选择并集成技术；法律和财务顾问搭建税收抵免与项目融资结构；CO2
              运输和封存伙伴提供不可缺少的下游基础设施；包销买家购买经认证的低碳产品或 CDR 信用。


              预算归属很复杂。FOAK 规模决定 capex 权限通常在 C-suite / 董事会（CFO、COO）；可持续团队能催化项目，但很少独立持有 capex 预算。触发条件通常是三者组合：碳价上升并跨过 CCS
              相比继续排放的经济盈亏平衡点；供应链或股东要求绿色产品差异化；政府拨款或税收抵免到位，把回收期推到可接受水平。付款方包括工厂所有者（设备与集成）、政府机构（capex / opex 补助；转让给项目融资方的
              45Q 抵免），以及间接支付溢价购买认证低 / 零碳产品的包销买家。封存伙伴通常不在设备供应商范围内，却是门槛条件：截至目前，每个推进中的项目都连接到共享 CO2 基础设施（Northern
              Lights、Porthos、Ravenna Hub）。没有封存伙伴合同，项目无法达到 FID。MRV 与监测合规——现在受 IRS Form 8933 和 45Q
              监测要求约束——又把法律合规职能加入买方决策链；如果 CO2 泄漏，还可能触发追缴责任。
