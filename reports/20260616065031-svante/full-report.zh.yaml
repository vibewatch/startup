      - number: '7.4'
        title: 财务、集中度与资本风险
        blocks:
          - type: paragraph
            body: >-
              Svante 已从 32 家机构投资者处融资约 $493 million USD，最近的资本注入来自 Canada Growth Fund 的可转债（最高 US$100M，分为 $50M + $50M 两笔）和
              InBC 的 CDN$15M 投资。资本强度极高：Redwood gigafactory 花费 $145 million；每座 FOAK 商业工厂在产生碳信用收入前，都需要数亿美元级项目融资。CGF
              可转债通过差价合约工具吸收政策和市场风险，按市场碳价与约定执行价之间的差额向 Svante 付款；但第二笔 $50M 以项目进展为条件。如果早期 FOAK 项目表现不佳，或加拿大碳信用市场出现 IISD 2025
              年碳定价评估指出的供给过剩风险，Svante 就会暴露于再融资压力。

              集中度风险很实质：Chevron 领投 Series E（$318M 轮），既是牵头投资者，也是主要工业试点宿主（Kern River，California）。在股东压力下，Equinor、Shell
              等石油公司已经削减低碳支出，说明 Chevron 也可能同样削减 CCS 承诺。DOE 资金收缩（2025 年 10 月终止 $7.56B 奖励）拿掉了一个关键生态支持机制。若政府成本分担无法持续，FOAK
              项目开发商将更依赖风险溢价更高的私人资本。IEEFA 记录称，加拿大 CCS 项目的运营成本增速约为捕集 CO₂ 增速的两倍，抬高了永久依赖补贴的风险。True North Institute 的 2025 年
              FOAK 案例研究评估发现，历史上政府拨款与 VC、企业承购同为关键支柱；DOE 削减后，Svante 在项目融资上面临更深的「死亡谷」，也必须更依赖私募股权和基础设施基金财团。
