      - number: '3.5'
        title: 竞争护城河与风险因素
        blocks:
          - type: paragraph
            body: >
              Svante 的竞争护城河建立在四根支柱上：（1）专有 CALF-20 MOF IP 和固体吸附剂制造 know-how；（2）全球首座位于 Vancouver 的过滤器超级工厂，产能可支持每年捕集 1000
              万吨 CO₂；（3）C-READY 模块化产品，并由 Samsung E&A 担任独家滑橇制造方；（4）面向低 CO₂ 浓度应用的 BASF OASE blue 合作。

              对这些护城河最重大的威胁包括：第一，Carbon Clean 的 CycloneCC，目标是低于 $30/tonne 并达到 TRL 8+ 商业化——这个成本水平若被验证，将重塑所有工业 CCS
              的经济性；第二，Trump administration 回撤清洁能源政策后，美国 DOE 取消超过 $3.7 billion CCS 资助，已导致 Svante
              多个美国项目伙伴停滞；第三，固体吸附剂的长期耐久性和再生循环性能，可能无法在缺少更多商业验证的情况下跨多种工业烟气组成站住脚；第四，胺基既有厂商凭安装基础、服务合同和既有捕集站点客户锁定，拥有结构性优势。

              工业 CCS 的切换成本很高：改造捕集单元需要深度集成现场烟气基础设施、热回收和公用工程，形成惯性并利好既有供应商——无论是液态胺，还是最终 Svante
              自己的装机基础。多归属（并行运行两套捕集系统）在工业规模下经济性不可行，因此单一站点的先发优势基本是排他的。Svante
              先制造后签大单的策略——在签下大型合同前先建设超级工厂产能——意在用交付速度和成本确定性抢在竞争者前面，但如果项目需求落后于产能爬坡，就会造成近期资产负债表风险。
