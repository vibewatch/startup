  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反论点与建议
        blocks:
          - type: paragraph
            body: >-
              Svante 的投资论点由三根相互咬合的支柱支撑：固体吸附剂碳捕集过滤器的先发制造优势（全球唯一专用 gigafactory，2025 年 5 月投产）；覆盖 Chevron、Temasek、GE
              Vernova、Samsung 和 Canada Growth Fund 的绑定式战略投资者基础，既验证技术，也提供项目承购；以及来自美国 45Q 税收抵免（工业 $85/tonne、DAC
              $180/tonne，已在 2025 年 7 月 OBBBA 中保留）、加拿大 50% CCUS 投资税收抵免、EU Carbon Border Adjustment Mechanism（2026 年 1 月进入
              definitive phase）的结构性政策地板。这些顺风为难减排行业的大规模 CCS 部署创造了可落地的经济环境，而 Svante 的模块化固体吸附剂技术正卡在这个位置。

              反论点同样清晰。Svante 已经在多轮融资中烧掉超过 US$600 million，却仍未跑出规模化商业收入。七个活跃项目合作全部停留在 MOU、pre-FEED
              或可行性阶段；没有一个达成最终投资决定。公司最后一次披露的股权融资是 2023 年 Q1 的 Series E；截至 2026 年 6 月，已有 3.5 年空窗，中间仅靠 Canada Growth
              Fund（2024 年 8 月）的 US$100M 可转债和 InBC（2024 年 11 月）的 C$15M 战略投资桥接估值锚。碳捕集硬件的执行失败已有充分案例：IEEFA 发现，没有一个旗舰 CCS
              项目能持续捕集超过目标 CO₂ 量的 80%。LanzaTech 股价下跌 90% 并发出持续经营警告，是一个警示性平行案例：商业化前的碳利用平台若无法把试点成功转化为规模化单位经济性，会迅速承压。Svante
              任何一轮融资的可公开核验投后估值都未披露，因此当前隐含价值到底是价格，还是叙事标记，存在真实不确定性。

              合并来看，证据支持「继续研究」建议，置信度中等、风险评级高。在至少一个 FOAK 项目达到
              FID、披露收入或近期收入指引、并提供足以建模稀释和优先权压力的股权结构透明度之前，方向性买入仍为时过早。由于缺少价格发现数据，估值立场归为未知。
