      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: 信息不对称是核心估值风险
            body: >-
              今天投资 Svante，最重要的风险不是技术风险或政策风险，而是信息不对称。投后估值没有公开确认；经审计财务不存在；CGF 可转债条款不透明；覆盖 18+ 轮、30+
              投资者的优先权栈完全未披露。这种不对称使投资者无法建模普通股稀释、清算瀑布，或回报对入场价格的敏感性。US$800M–$1.2B 的基准区间有交易可比和第三方数据作方向性支撑，但若无财务披露，无法确认或收窄。
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV022
              - CV023
              - CV024
              - CV040
          - type: callout
            title: 可比交易先例验证技术平台溢价
            body: >-
              2023 年 Oxy/Carbon Engineering 以 US$1.1B 收购收入前加拿大碳捕集技术平台，是最直接可比的退出锚。Carbon Engineering 在被收购前已融资约
              US$110M，意味着早期投资者约 10x MOIC。如果 Svante 要在其 US$600M+ 融资基础上复制这一退出画像，需要 US$1.5–2B
              的收购溢价，显著高于当前隐含价值。该先例也确认，至少一家大型石油巨头（Occidental）愿意为控制碳捕集 IP 平台支付战略溢价。
            calloutType: strength
            claimRefs:
              - CV009
              - CV010
              - CV028
              - CV036
          - type: callout
            title: 基准估值假设没有重大优先权压力
            body: >-
              US$800M–$1.2B 的基准企业价值区间未计入 18+ 轮融资中可能嵌入的清算优先权。如果 Series E 及更早优先股带有标准 1.5–2x 清算优先权，US$1B
              退出时普通股回款可能受到实质损害。这是结构性假设；实际优先权条款未披露。新投资者应把基准 EV 区间视为总企业价值估计，而不是普通股价值。
            calloutType: assumption
            claimRefs:
