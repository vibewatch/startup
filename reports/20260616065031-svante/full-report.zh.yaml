      - number: '7.6'
        title: 图表
        blocks:
          - type: callout
            title: FOAK 执行缺口是最主要的推翻论点风险
            body: >-
              Svante 尚无捕集工厂以完整商业规模运行。最近的验证事件是 Södra 试点（Sweden，2025）和美国 BECCS 项目（可行性阶段，2026 年 3 月）。如果首座商业 FOAK 工厂无法达到
              >80% 捕集率，或成本 / 进度显著超支，投资者信心会被削弱，Nth-of-a-kind 经济性也仍无法证明。IEEFA 发现，尽管行业声称可实现 95%+，现有 CCS 项目没有一个能年复一年稳定捕集超过
              80%。尽调应坚持对 FOAK 性能路径做独立技术评估，并获取 Kern River 和 Södra 的性能数据。
