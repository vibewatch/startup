      - number: '4.5'
        title: 政府激励与项目级经济性
        blocks:
          - type: paragraph
            body: >-
              Svante 的项目经济性由边境两侧多层政府激励显著塑形。在美国，Section 45Q 税收抵免为地质封存 CO2 提供每吨 US$85，为用于其他用途的 CO2 提供每吨 US$60；DAC
              项目最高可获得每吨 US$180。DOE Carbon Capture Large-Scale Pilot Program 为 Delek Big Spring 炼油厂项目提供最高 US$95M（70%
              成本分摊）。另有一项最高 US$1.5M 的 DOE IEDO 成本分摊协议，已入选用于 Ashdown Pulp Mill pre-FEED 研究。

              在加拿大，CCUS Investment Tax Credit（CCUS ITC）已通过 Bill C-59（2024 年 6 月）立法，适用期为 2022 年 1 月至 2040 年 12
              月；它为点源捕集设备提供最高 50% 的合格资本成本抵免，为直接空气捕集设备提供 60%，并为合格运输和封存支出提供 37.5%。BIV
              指出，将投资税收抵免与工业碳定价信用机制叠加后，加拿大体系可覆盖「碳捕集项目资本成本最高 62%」。

              这些激励对项目经济性至关重要。工业点源捕集成本目标为每吨 US$60–120，而 45Q 为地质封存提供每吨 US$85；选定项目建成后，运营经济性可自我供血。不过，IEEFA 对 Alberta 现有 CCS
              工厂的分析发现，运营成本增速是 CO2 捕集量增速的两倍；排放绩效信用的有效上限为 C$170/吨，限制收入上行，也让大规模复制性受到质疑。
