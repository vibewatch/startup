  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Svante
              所在的是工业点源碳捕集子市场——这是更广义碳捕集、利用与封存（CCUS）市场中的一块，由大型固定排放源的烟气流定义，而不是环境空气（直接空气捕集，DAC）或主要服务于提高采收率的电厂。相关纳入支出包括捕集设备（吸附剂
              / 溶剂单元、换热器、压缩机、控制系统）、CO2 调质与液化、现场集成工程，以及长期服务和监测。核心可服务市场不包括专用 CO2 运输和地质封存基础设施（尽管这些是项目可行性的门槛条件）、面向大气 CO2 的
              DAC 系统，以及仅靠电气化或燃料切换就能实现的减排。


              范围内的主要行业，是那些工艺化学排放——不只是燃烧排放——使电气化或燃料替代不足以实现深度脱碳的领域：水泥 / 石灰（煅烧释放约 60% 行业排放，属于不可避免 CO2）、制浆造纸（来自生物源锅炉排放的
              BECCS 机会）、化工 / 石化制造、天然气制氢（燃烧前或燃烧后 CCS）、废弃物能源设施，以及钢铁，其中高炉或天然气 DRI 路线会产生集中的 CO2 流。相邻细分包括用于生成 CDR 信用的 BECCS（带
              CCS 的生物质能），以及 Svante 固体吸附剂过滤器平台可共享材料科学的 DAC
              邻近市场。现状替代方案包括继续无减排运营并购买碳配额、切换至生物质或氢燃料、在技术可行处电气化工艺热，以及使用基于自然的抵消或自愿碳信用（这些信用正面临更高的永久性和可信度审查）。
