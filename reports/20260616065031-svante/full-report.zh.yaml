      - number: '4.3'
        title: CGF 可转债及战略投资方影响
        blocks:
          - type: paragraph
            body: >-
              Canada Growth Fund 的 US$100M 可转债（2024 年 8 月）是近期融资中结构意义最强的一笔。CGF 将投资拆成两批：首批 US$50M 立即投入商业开发和 FOAK
              项目共同投资；第二批 US$50M 可按具体项目提款，但需双方批准。作为可转债，这些工具给 CGF 债转股选择权；估值上限、利率或转换触发条件均未公开，现有股东在转换情境下可能被稀释。

              从战略上看，CGF 投资把 Svante 的资本投放角色从设备制造商推向主动项目共同投资方。CEO
              确认资金用途是让公司「拥有足够现金，基本上能投资这些项目，而这些项目最终会带来投资回报」。这是资本密集型转向：年捕集 200,000–1,000,000 吨的 FOAK 项目，每个都需要可观股权投入，CGF
              首批资金预计只能支持少数早期部署。CGF 也以这笔交易完成其在 British Columbia 的首笔投资，显示政府强力支持 Svante 将知识产权和制造留在加拿大。

              战略投资方结构——Chevron、Delek、OGCI Climate Investments、Suncor 等油气股东合计持股
              40%——既带来一致性，也带来张力。这些投资方对成功部署同时有技术和财务利益，能贡献商业管线；但也可能把 Svante 的范围限制在化石燃料相邻的脱碳场景，而不是更广的 CDR 市场。
