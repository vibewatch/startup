        - label: 基准情景，按里程碑调整
          value: 1000
        - label: Oxy/Carbon Engineering 战略类比
          value: 1100
        - label: 牛市情景（FID + 收入 + 竞价溢价）
          value: 2500
    approximationNotes: 所有数值均为作者估计。Svante 没有经确认的估值。考虑到 Svante 尚未产生收入， SLB/Aker 类比下调约 30%。牛市情景假设战略竞价溢价，与 FTI CCS 并购指引一致。
