      - number: '1.2'
        title: 创立历史与技术
        blocks:
          - type: paragraph
            body: >
              Svante 于 2007 年在 British Columbia 省 Burnaby 的一间车库里创立，四位创始人都来自气体净化与分离行业：Brett Henkel、André Boulet、Darryl
              Wolanski 和 Soheil Khiavi。Brett Henkel 目前担任联合创始人兼战略客户与政府事务副总裁，早年在 QuestAir Technologies 积累了经验。公司早期通过 Series
              A 和 B 轮获得 Roda Group、Mitsui、Chevron Technology Ventures（2014 年首次投资）和 Chrysalix 支持，也获得加拿大和英国政府以及 Alberta
              省的台架级项目资金。诺贝尔奖得主、美国前能源部长 Steven Chu 在早期加入董事会，给公司带来科学和政策可信度。公司的关键技术突破，是把 MOF 纳米材料——尤其是 CALF-20，其发明者在 2025
              年获得诺贝尔化学奖——作为固体吸附剂涂覆到层压过滤片上。过滤器通过类似薄膜电池生产的自动化卷对卷制造工艺生产。2019 年，公司与 Cenovus（原 Husky Energy）合作，在 Saskatchewan
              投运一座每日捕集 30 吨（TPD）CO₂ 的中试装置；位于 BC 省 Richmond 的 Lafarge 水泥厂 CO₂MENT 中试项目也实现每日捕集 1 吨。2025 年 5 月，Svante 正式投产
              Redwood Facility——位于 BC 省 Burnaby、占地 141,000 平方英尺的卓越中心；这是全球首座基于固体吸附剂的碳捕集过滤器商业制造工厂，年产能可支持捕集最高 1000 万吨 CO₂。
