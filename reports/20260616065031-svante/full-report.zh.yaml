      - number: '3.2'
        title: 胺基既有竞争者
        blocks:
          - type: paragraph
            body: >
              工业碳捕集的主导竞争范式仍是液态胺基燃烧后洗涤，四个主要玩家是 SLB Capturi、Mitsubishi Heavy Industries（MHI/Kansai）、Linde/BASF 和 Carbon
              Clean。

              SLB Capturi 于 2024 年由 SLB（80%）和 Aker Carbon Capture（20%）合资成立，是 Svante 最活跃的商业化模块化胺竞争对手。其标准化 Just Catch
              产品线每台每年捕集 100,000–400,000 吨，Big Catch 产品线则可扩展到数百万 TPA；到 2026 年中，公司正执行三个世界级项目：Twence（100
              kt，废弃物能源）、Brevik/Heidelberg Materials（400 kt，水泥——全球首座全规模水泥 CCS 工厂）和 Ørsted Kalundborg（5×100 kt，生物能源）。超过
              60,000 小时运行记录和 DNV GL 认证，给 SLB Capturi 带来可验证的性能证明优势。更关键的是，SLB 覆盖 100 个国家的工程网络和油服资产负债表，远大于 Svante 的资本实力。

              MHI/Kansai 已用 KM CDR Process 和 KS-1/KS-21 胺溶剂交付 18 座商业工厂，实现 90%+ 捕集率和 >99.9% CO₂ 纯度；其通过与 EPC
              公司（KBR、Worley、Saipem、Chiyoda）和工业排放方（ArcelorMittal、Heidelberg）的 8+ 个联盟，采用轻资本授权模式。近期最大项目是其与 Heidelberg 和
              Worley 在英国推进的 800,000 t/yr 水泥 CCS 设施。

              Linde 与 BASF 联合授权 HISOLV/OASE blue 燃烧后捕集系统，拥有 60+ 个商业工厂案例、>65,000 小时运行记录，能耗比 MEA 低 20%。该合作正在 Germany
              Lengfurt 的 Heidelberg Materials 水泥设施部署捕集（CAP2U 合资，70 kt/yr）。

              Carbon Clean 的 CycloneCC 采用旋转填料床（RPB）和自有胺促进缓冲盐溶剂，可把占地最高减少 50%；2025 年在 Fertiglobe Abu Dhabi 化肥厂完成首次工业部署，运行约
              4,000 小时，达到 TRL 7。Carbon Clean 持有 115+ 项有效专利资产，全球有 50+ 个运营站点，并希望把成本降到每吨 CO₂ 低于 $30——远低于多数当前行业案例；如果实现，将对包括
              Svante 在内的所有竞争者造成严重价格压力。
