      - number: '5.3'
        title: 技术架构与运营模型
        blocks:
          - type: paragraph
            body: >
              VeloxoTherm 工艺是一套获得专利的快速循环温度变动吸附（RC-TSA）系统。烟气经预处理后进入旋转吸附机：直接接触冷却器（DCC）将气体温度降至 50°C
              以下，湿式洗涤器去除硫氧化物（SOx）和颗粒物，保护床去除残余污染物。RAM 内部，气体接触涂覆 CALF-20 的结构化吸附床（SAB）。CALF-20——化学式
              Zn₂(1,2,4-triazolate)₂(oxalate)，商业名 Calgary Framework 20——通过物理吸附对 CO₂ 相比水和氮展现高选择性，不需要断裂化学键。RAM
              旋转经过三个功能区：吸附区让 CO₂ 结合到吸附剂上；再生区用低压蒸汽冲洗并浓缩 CO₂；调理区用于冷却和准备。完整吸附-脱附循环约 60 秒完成。浓缩 CO₂（通常 95%+ 纯度）随后进入 CO₂
              纯化和压缩列车——95%+ 纯度采用催化氧化，最高 99.9% 纯度采用低温精馏——再压缩至管道压力（Linde SMR FEED 中为 ≥2,200 psia）。Linde SMR pre-FEED 研究的
              OSTI DOE 最终报告量化的蒸汽-CO₂ 再生比约为每捕集 1 kg CO₂ 需 1.22 kg 蒸汽，并指出可通过热集成和蒸汽回收进一步优化。
