              尽管已融资超过 US$600 million，Redwood Facility 也已投运，Svante 仍未披露收入、利润率或盈利能力。截至 2026 年 6 月，每个商业规模项目（North Star
              BECCS、Mercer Peace River、Delek US Big Spring、IPC US 造纸厂）都处在 Pre-FEED、FEED 或可行性阶段。North Star 的 FID 预计要到
              2027 年第一季度，商业运营则在 2029 年初。这意味着首个项目收入到来前，公司至少还要经历 2–3 年的现金消耗期。
