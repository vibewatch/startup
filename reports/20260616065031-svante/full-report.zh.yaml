  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品概览与价值主张
        blocks:
          - type: paragraph
            body: >
              Svante Technologies 销售完整的碳捕集与去除系统，目标是难减排工业部门。核心价值主张是从燃烧后烟气中实现 ≥90% CO₂ 捕集效率，并浓缩到 ≥95% 纯度的管道级
              CO₂，同时避开传统溶剂捕集中使用的危险液态胺或氢氧化钾化学品。产品栈建立在 CALF-20
              之上；这是一种获得专利的锌基金属有机框架（MOF）固体吸附剂，涂覆在薄层压片上，并组装成结构化吸附床过滤器。这些过滤器装入旋转吸附机（RAM）——一种紧凑、连续旋转的接触器，借助低压蒸汽约每 60
              秒完成一次吸附和再生循环。最终产品是一股浓缩 CO₂ 流，可用于地质封存、e-fuel 合成、CO₂ 注入混凝土或 CDR 信用生成。Svante
              瞄准捕集成本较低的生物源排放方（纸浆和造纸、乙醇、垃圾发电），也覆盖水泥、氢、钢铁、油气炼化、铝和化学品。对于烟气 CO₂ 浓度低于 12% 的设施（如天然气联合循环电厂），Svante 与 BASF
              合作，在固体吸附剂方案之外提供 OASE® blue 液态胺作为互补产品。
            claimRefs:
              - CE001
              - CE036
              - CE026
              - CE031
      - number: '5.2'
        title: 产品线与模块架构
        blocks:
          - type: paragraph
            body: >
              Svante 的商业产品线围绕两种 RAM 尺寸展开。URSA 1000 设计为每天捕集约 500 吨 CO₂（连续运行约 180,000 TPY），URSA 2000 设计为每天捕集约 2,000 吨（约
              730,000 TPY）。多台 RAM 可并联部署，在单一场址扩展捕集规模——Linde SMR pre-FEED 设计使用两台 URSA 2000 并联，达到 1.436 百万吨 TPY。2025 年 5
              月，Svante 与 SAMSUNG E&A 推出 C-READY，这是一款标准化、撬装模块化碳捕集工厂产品，把 Svante 的 VeloxoTherm 接触器技术与 SAMSUNG E&A 的数字
              Engineering Data Platform（EDP）和成熟模块化能力打包在一起。C-READY 面向商业工业项目，作为从前端工程到制造的一站式 CCUS
              项目交付方案进行营销。对于直接空气捕集应用，Svante 供应接触器模块——同样基于 CALF-20 涂覆结构化吸附剂技术——用于 Climeworks 的 Generation 3 DAC 系统。Svante
              技术页面还列明，公司的固体吸附剂过滤器可在同一制造平台上服务工业点源捕集和 DAC。
