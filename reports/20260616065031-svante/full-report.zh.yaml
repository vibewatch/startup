chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与使命
        blocks:
          - type: paragraph
            body: >
              Svante Technologies Inc. 是一家以使命驱动的碳捕集与碳移除解决方案提供商，总部位于加拿大 British Columbia 省 Burnaby 市 8800 Glenlyon
              Parkway，邮编 V5J 5K3。公司是完全私有的后期创业公司（Series E 后），尚未披露 IPO 时间表。公司最初以 Inventys 名义注册，2019 年更名为 Svante，以纪念瑞典科学家
              Svante Arrhenius——他在 1896 年首次识别出大气 CO₂ 浓度与全球地表温度之间的关系。Svante
              的核心业务生产两条产品线：（1）涂覆金属有机框架（MOF）的纳米工程固体吸附剂过滤器；（2）模块化旋转接触器设备，将烟气压过过滤器、吸附 CO₂，并在约 60 秒循环内再生过滤器。捕集到的 CO₂ 会被浓缩至
              95% 的管道级纯度，适合永久地质封存或循环工业再利用。公司瞄准难减排行业：水泥、制浆造纸、氢能、钢铁、石灰、铝和油气炼化，并正向生物质能碳捕集与封存（BECCS）和直接空气捕集（DAC）扩展。Svante
              的商业模式覆盖 OEM 过滤器销售、交钥匙项目交付，以及通过项目开发子公司 Svante Development Inc. 与工业伙伴共同投资首创型 FOAK 商业项目。公司的官方网址是
              www.svanteinc.com。
