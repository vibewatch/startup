  - id: TM004
    title: 工业 CCS 的增长驱动因素与采用约束
    columns:
      - 因素
      - 方向
      - 时间
      - 对 Svante 的含义
      - 尽调问题
    rows:
      - - 美国 45Q 税收抵免（工业 $85/t，DAC $180/t）
        - 驱动因素（强）
        - 当前（投运后 12 年窗口）
        - 改写项目经济性；让许多工厂现金流转正；可直接用于融资
        - Svante 如何在商业协议中设计 45Q 结构？谁申领抵免？
      - - 加拿大 OBPS 碳价（CAD $95/t，继续上升）
        - 驱动因素（中等）
        - 当前且上升（2027–29 年至 $100/t，2030 年至 $115/t）
        - 强化 Alberta 和 BC 工业工厂的避免成本信号
        - Svante 客户合同是否引用 OBPS 合规价值，或采用影子碳价？
      - - EU ETS 碳价（2026 年约 €70–75/t）
        - 驱动因素（中等，部分）
        - 当前但波动大；只有持续高于 €105/t 的 CCUS 盈亏平衡点才有意义
        - 低于端到端 CCUS 全成本盈亏平衡点；欧盟项目仍需要补贴桥接
        - Svante 的欧盟项目管线对 EUA 价格情景有多敏感？
      - - EU CBAM 分阶段导入（钢铁、水泥、化工，2026+）
        - 驱动因素（结构性）
        - 多年分阶段导入（2026–2034）
        - 迫使欧洲难减排出口商转向包括 CCS 在内的低碳路径
        - Svante 毗邻欧盟的管线项目是否受益于 CBAM 价格信号？
      - - EU Net-Zero Industry Act（2030 年 50 Mtpa 储存强制目标）
        - 驱动因素（结构性）
        - 政策已生效；2030 年期限
        - 刺激欧洲储存基础设施建设，削弱一个关键约束
        - Svante 的欧洲目标客户可接入哪些共享储存枢纽？
      - - CO2 运输与储存基础设施接入
        - 约束（硬门槛）
        - 当前；缓慢改善
        - 没有储存伙伴，不管捕集经济性如何，项目都无法进入 FID
        - Svante 客户正在推进哪些储存合作？Northern Lights 管线时间表如何？
      - - EPA Class VI 许可瓶颈（历史上 3–6 年）
        - 约束（重大）
        - 当前；2026 年小幅改善（约每季度 3 张许可，而此前 13 年共 8 张）
        - 拖慢美国工业 CCS；拥有主导审批权的州（TX、WY、ND、LA）项目可以更快推进
        - Svante 的北美目标工厂位于主导审批州，还是 EPA 审核辖区？
      - - FOAK 资本强度与融资风险
        - 约束（重大）
        - 当前；先行者承担最高风险
        - 相比大型溶剂系统，Svante 的模块化过滤器方案可能降低单个项目 capex，但 FID 仍需要补助 + 抵免 + 债务的资金栈
        - Svante 单厂典型 capex 区间是多少？政府出资占比多少？
      - - IEA/分析师对 CCUS 在净零中的角色判断分歧
        - 约束（声誉）
        - 持续存在；IEA WEO 2025 下调 CCUS 占比
        - 如果没有强政策兜底，投资人怀疑可能推高 CCUS 项目的资本成本
        - Svante 在销售材料中如何回应 IEA“CCUS 作用很小”的叙事？
      - - 定制化项目设计（没有模块化学习曲线）
        - 约束（结构性）
        - 持续存在
        - 成本下降慢于 solar PV 或电池；每个场址都需要定制工程
        - Svante 的标准化 filter-block 架构是否能解决竞争对手的定制化属性？
    notes: 方向评级（驱动因素 / 约束）和时间是基于公开证据的定性判断。45Q、OBPS 和 ETS 的财务数字来自官方 / 监管来源；成本盈亏平衡估算来自 IEEFA 和 Agora Industry 研究。
