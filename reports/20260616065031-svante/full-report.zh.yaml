      - number: '4.2'
        title: 资本形成与融资历史
        blocks:
          - type: paragraph
            body: >-
              Svante 已搭出全球碳捕集领域规模最大的私营资本底座之一。早期来自 NRCan、SDTC、ERA、WINN 和 NRC-IRAP 的非稀释性政府拨款，到 2017 年底合计 C$12.3M，用于资助第一座
              CO2 捕集试点工厂。随后公司完成 Series C（2019 年，OGCI Climate Investments 领投，US$26M）、Series D（2021 年，Temasek
              领投，Suncor、Chart Industries、BDC 和 EDC 参投，US$100M），以及标志性的 Series E（2022 年 12 月，2023 年 Q1 二次交割，Chevron New
              Energies 领投，US$318M）。Series E 吸引了广泛的战略和机构投资方，包括 3M Ventures、GE Vernova、Japan Energy Fund、Liberty Media、M&G
              Catalyst、NextEra Energy、Samsung Engineering 和 United Airlines Ventures，J.P. Morgan 与 RBC Capital Markets
              担任配售代理。

              2024 年 8 月，Canada Growth Fund 通过两批各 US$50M 的可转债，承诺最高投入 US$100M（C$137M）。截至 2024 年中，CEO Claude Letourneau
              表示，私营部门融资总额达到 C$685M（约 US$500M），其中超过 90% 来自私人来源。BIV（2025 年 5 月）报道称，截至当时累计募资约 US$600M。公司股权结构约 40% 为油气公司、40%
              为私人和机构投资者，其余为管理层和战略伙伴；没有单一投资者持股超过 15%。
