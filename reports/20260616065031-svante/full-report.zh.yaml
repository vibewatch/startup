        - 60+ 座工厂；与 Heidelberg Lengfurt 的 CAP2U 合资项目（70 kt/yr CCU）；CWLP Illinois 10 MW 试点 2025 年启动
        - 传统大规模液体胺；Svante 是 BASF 面向低 CO₂ 气流的经销商；双方争夺同一类工业 EPC 合同
      - - CarbonCapture Inc.
        - 模块化固体吸附剂 DAC
        - 约 US$80M Series A（2024 年）
        - 自愿 CDR 市场；工业 CO₂ 买方；Class VI 储存
        - 固体吸附剂 Leo Series 模块（每个 500+ t/yr）；模块化开放系统架构；可升级吸附剂 cartridge
        - 商业化前；Project Sonora 开发中；已签署 $47M Frontier 承购协议
        - DAC 聚焦（环境空气 420 ppm CO₂），不是工业烟气；成本约 $600–$800/t，而点源约 $50–$150/t
      - - Climeworks
