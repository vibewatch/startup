      - number: '8.5'
        title: 退出准备度、终止触发项与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Svante 在 2027–2030 年窗口内最可能的退出路径，是被能源巨头战略收购（Chevron 已是 Series E 牵头投资者，并可能在退出场景中行使优先报价权），或可能性较低地在 IPO
              前完成后期私募轮。公司尚未宣布 S-1、F-1 或招股书申报；公开市场对纯碳捕集工具并不友好（Aker Carbon Capture 2025 年 10 月退市）。Carbon Engineering
              在无先前收入、此前约 US$110M 融资的情况下以 $1.1B 出售给 Occidental，意味着早期支持者获得 10x
              投入资本回报——这是历史上很有吸引力、但不确定的类比。今天的新投资者若要严守入场纪律，必须理解 CGF 可转债转换机制和优先权栈；30+ 个既往轮次中嵌入的清算优先权，可能显著稀释新普通股。

              推翻论点的触发项可量化：若到 2027 年 Q4 至少一个 FOAK 项目仍未达到 FID，说明管线尚未去风险；若股权下轮融资低于隐含 US$1B 标记，将重定价投资者头寸；DOE 项目取消若实质缩减美国 45Q
              合格项目管线，将压窄可服务市场；若主要市场碳价跌破 US$50/tonne，即便有税收抵免，增量捕集经济性也不可行。

              最终尽调问题集中在财务披露、治理和项目特定里程碑。没有经审计财务、股权结构细节和 CGF 票据转换条款披露，当前隐含估值区间无法收敛为点估值。即将上任的 CFO（Terry Lefebvre，2026 年 5
              月任命）可能加速财务系统为未来流程做准备，但对于寻求精确估值支撑的投资者，信息缺口仍是阻断项。
