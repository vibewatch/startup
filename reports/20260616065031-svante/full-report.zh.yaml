      - number: '4.4'
        title: 制造资本强度与成本结构
        blocks:
          - type: paragraph
            body: >-
              Burnaby Redwood 工厂是 Svante 最大的单项资本投入，也是其商业化战略的物理基础。Svante 向这座 141,000 sq. ft. 工厂投入
              US$145M（C$198.65M）；工厂同时承担全球总部、R&D 中心和生产线职能。工厂采用大规模自动化和 roll-to-roll
              制造工艺，以商业规模生产固体吸附剂过滤模块和旋转吸附机。满产时，该厂生产的过滤器足以支撑每年去除 1,000 万吨 CO2 的碳捕集设施，相当于约 2,700 万辆乘用车。

              Svante CEO 公开表示，使用 Svante 技术的点源碳捕集成本约为每吨 US$150；工业烟气中 CO2 浓度更高（例如纸浆厂、乙醇厂）时，成本更低。BIV 将点源捕集成本范围描述为「每吨低于
              $250」。公司没有公开毛利率、单位 OPEX 或每个过滤器制造成本数据。营运资本动态也不透明：Svante 未披露应收账款、库存或应付账款特征，但资本密集型制造模式意味着在项目收入到来前需要大量前置投资。

              制造工厂由 Series E 资金资助，并获得 CGF 可转债支持。Chevron New Energies、Temasek、M&G、CGF、United Airlines Ventures、Samsung 和
              GE Vernova 等关键战略投资方直接参与了工厂融资。Burnaby 工厂同时创造竞争护城河（商业过滤器制造先发）和结构性成本负担，必须靠足够订单量吸收。
