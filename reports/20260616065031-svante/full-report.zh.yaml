          - type: callout
            title: BECCS 优先战略瞄准生物源碳溢价
            body: >
              Svante 转向 BECCS（制浆造纸、乙醇、废弃物能源中的生物源 CO₂）并非偶然：生物源 CO₂ 移除信用相较化石源信用享有溢价，因为它构成净移除，而不只是避免排放。Microsoft North Star
              交易，以及 Mercer 和 IPC 造纸厂管线，共同验证了这是最接近商业化收入的路径；其单吨成本低于 DAC，信用价值高于化石源点源捕集。
