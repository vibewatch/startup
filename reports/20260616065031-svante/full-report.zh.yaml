  - id: FE001
    title: Svante 产品技术栈 — 从吸附剂到捕集工厂
    type: stack
    layout: standard
    summary: |
      五层架构展示 Svante 的技术要素如何从底层 CALF-20 MOF 吸附剂材料，逐层整合到过滤器、旋转吸附机、工厂辅助系统，以及完整的一体化项目交付产品（C-READY）。
    data:
      layers:
        - label: 第 1 层 — 固体吸附剂（CALF-20 MOF）
          detail: 锌基 MOF；相对 N₂ 和 H₂O 具备高 CO₂ 选择性；物理吸附；BASF 商业供应；诺奖认可的化学
        - label: 第 2 层 — 结构化吸附过滤器（SABs）
          detail: 通过 Sorbent on a Roll（卷对卷工艺）涂覆 CALF-20；层压堆叠形成过滤器模块；Redwood gigafactory（10 Mtpy CO₂）；3M 二级涂覆
        - label: 第 3 层 — 旋转吸附机（RAM）
          detail: URSA 1000（约 500 TPD）和 URSA 2000（约 2000 TPD）；约 60 秒吸附-再生循环；低压蒸汽再生；连续运行
        - label: 第 4 层 — 工厂辅助系统 / 预处理
          detail: DCC（冷却至 <50°C）、湿式洗涤器（SOx/颗粒物）、保护床、辅助锅炉（蒸汽）、CO₂ 纯化（催化氧化 / 低温）、压缩至管道压力
        - label: 第 5 层 — 一体化工厂与项目交付
          detail: C-READY 撬装模块化工厂（SAMSUNG E&A EPC/EPF）；Svante Development 共同投资模式；面向 <12% CO₂ 气流的 OASE blue 液胺；数字 EDP 集成
    claimRefs:
