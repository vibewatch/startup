              截至 2026 年 Q1，只有 5 个项目正通过 Class VI 井注入 CO₂，另有 106 份申请待批。Louisiana 的暂停令和 North Dakota 的法院挫败进一步收紧了封存瓶颈。任何假设美国
              BECCS 项目在 2026–2027 年 FID 的投资论点，都必须核验：已识别具体的墨西哥湾沿岸 Class VI 封存伙伴；该伙伴已在非暂停令州提交许可申请；并且在项目 OBBBA
