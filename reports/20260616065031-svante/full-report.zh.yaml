      - number: '5.6'
        title: 部署、集成与路线图
        blocks:
          - type: paragraph
            body: >
              Svante 已执行或正在执行多阶段部署路线图，横跨试点、pre-FEED 和商业规模项目，并覆盖多个工业部门。Lafarge Canada Richmond 水泥厂的 CO₂MENT 试点（250 TPY，自
              2019 年运行）已累计运行超过 4,000 小时，分三阶段推进：预处理验证、CO₂ 捕集、CO₂ 利用（转化为合成燃料和 CO₂ 注入混凝土）。Chevron Kern River DOE 试点（25
              TPD，2020 年 10 月–2024 年 8 月，总资金 $23.4M）验证了 4–14% CO₂ 浓度烟气下的稳态运行，并形成了扩展至 NGCC 应用的差距分析。Linde SMR pre-FEED
              研究（DOE Award DE-FE0032113，$1.9M）为 Texas Port Arthur 一座 1.436 Mtpy 商业工厂定义了设计基础，CAPEX 估计为 $512M–$656M。在
              Delek US 的 Texas Big Spring 炼油厂，Svante 和 Delek 正推进一个由 DOE 共同资助（最高 $95M）的项目，目标是从 FCC 装置捕集 145,000 TPY，计划
              2027–2028 年运营。2026 年初，Svante 在 Sweden Södra 的 Värö 纸浆厂部署首个 EU 试点，评估最高 1 百万吨 TPY 的生物源 CO₂ 捕集，RISE
              担任研究伙伴，并获得 EU Industriklivet 资金。Svante 表示的目标是在本十年后半段每年部署最多 100 座商业工厂，这一目标由 Redwood 的过滤器产能和 C-READY
              标准化模块化工厂方案支撑。
