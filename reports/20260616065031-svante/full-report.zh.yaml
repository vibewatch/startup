      - number: '5.7'
        title: 信任、安全、环境测试与质量
        blocks:
          - type: paragraph
            body: >
              Svante 已在真实工业条件下对 CALF-20 系统开展定向环境和安全测试。在 CO₂MENT 水泥厂试点中，使用 ESI-MS 和 FTIR 的化学分析发现，CALF-20 层压基质在长期暴露于含 NOx
              水泥烟气后，没有检测到硝胺或亚硝胺化合物，确认不存在胺基系统已知的有毒二次排放风险。Linde SMR pre-FEED DOE 研究包含正式的 Environmental, Health and
              Safety（EH&S）Risk Assessment 和 Hazard Identification（HAZID）研究，覆盖排放、流出物和结构化吸附剂毒理。Chevron Kern River 项目根据 DOE
              Cooperative Agreement DE-FE0031944 开展，受 DOE 合规要求约束，并产出全面差距分析和技术经济分析。Svante 的 CO₂ 产品规格为 ≥95%
              纯度，满足运输和封存的管道级标准。截至报告日期，公司未公开 ISO 认证或第三方质量管理体系审计，因此正式质量保证基础设施透明度仍是潜在客户和项目融资交易对手的开放尽调项。
