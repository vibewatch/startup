      - number: '5.5'
        title: 差异化、IP 与竞争优势
        blocks:
          - type: paragraph
            body: >
              Svante 的主要差异化建立在五根支柱上。第一，CALF-20 是专有 MOF 吸附剂，已证明能抵抗工业烟气杂质，避开液态胺溶剂的降解和二次排放风险；其受到诺贝尔奖认可的化学基础（2025 年诺贝尔化学奖引用
              MOF 研究）和同行评审科学论文（Science，2021 年 12 月）构成可防御的技术底座。第二，VeloxoTherm 架构带来极快循环时间（约 60 秒，而传统填充床 TSA
              需要数小时），设备更紧凑，吞吐量更高，相对吸附剂库存具备有吸引力的捕集经济性。第三，Svante 专利组合覆盖吸附工艺（US11813563）、平行通道接触器设计（US11766634）、集成 TSA
              燃烧系统（US11224834）和底层锌基 MOF 合成化学（WO2019204934A1），并包括可扩展分选气体分离器（US20250153088A1）等已公开申请。第四，Svante 运营唯一一座 MOF
              基碳捕集过滤器商业 gigafactory，相比没有自有过滤器生产的竞争者，具备制造成本和交付周期优势。第五，BASF 的 CALF-20 商业供应协议解决了 MOF
              商业化的历史障碍（大规模、低成本生产），供应链防御性强于完全内部合成路径。合在一起，这些差异点已由 DOE 资助的工业规模 FEED 研究，以及 Climeworks 选择 Svante 作为其美国 DOE
              资助的百万吨级 DAC 枢纽过滤器供应商所验证。
            claimRefs:
