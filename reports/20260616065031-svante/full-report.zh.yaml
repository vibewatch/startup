            body: >-
              Svante 的部署轨迹遵循从试点验证到商业规模执行的分阶段管线模型，每一阶段都是技术商业化路径上的不同里程碑。最早证明点（CO2MENT Richmond，2019 年）把水泥确立为首个验证行业；Chevron
