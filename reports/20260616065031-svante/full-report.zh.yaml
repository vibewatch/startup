              月，Svante 已披露北美（加拿大和美国）及欧洲（Sweden）的活跃关系；北美至少有五个活跃项目场址，EU 试点为一个。地域偏向具备碳定价或税收抵免机制的辖区（加拿大 OBPS/联邦碳价、美国 45Q、EU
              ETS/RRF），反映工业 CCS 经济性对政策敏感。除 North Star CDR 承购外，没有任何客户细分已达到产生收入的商业合同阶段。Chevron New Energies 领投 $318M
