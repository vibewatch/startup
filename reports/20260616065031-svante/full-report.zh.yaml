  - id: TV005
    title: 投资逻辑失效与否决触发表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 没有 FOAK 项目 FID
        - 到 2027 年 Q4，FID 事件为零
        - 验证执行风险；迫使桥轮或 down-round；削弱 M&A 溢价
        - 重新评估；降低敞口；部署资本前要求 FID 确认
      - - Down-round 股权融资
        - 新一轮定价低于隐含 US$1B 估值
        - 重定价所有既有标记；触发优先股堆叠计算；显示投资者情绪转向
        - 退出或重组持仓；追加部署资本前分析优先权压力
      - - 美国 45Q 政策逆转
        - 2026 年选举后 EPA GHGRP 被削弱，或 45Q 可转让性被取消
        - 消除美国项目的主要经济性；Delek Big Spring 可能不可行；压缩可服务市场
        - 降低美国项目权重；把分析转向仅加拿大管线的可行性
      - - 竞争对手部署 gigafactory
        - SLB Capturi、Carbon Clean 或 MHI 宣布同等滤芯规模制造
        - 侵蚀先发护城河；压缩定价权；提高项目竞标竞争风险
        - 重新评估竞争定位；建模毛利压缩情景
      - - 捕集率持续不及预期
        - 到 2028 年，没有商业工厂连续 12 个月实现 >80% 设计捕集率
        - 验证 IEEFA 提出的效率风险；FOAK 融资缺口扩大；重演 Aker 项目亏损情景
        - 标记为阻断项；要求对首批部署单元做独立工程复核
    notes: 否决触发项是分析师基于公开证据构建的判断。实际阈值应根据具体投资授权和时间窗口调整。
    claimRefs:
      - CV012
      - CV020
      - CV029
      - CV033
      - CV038
      - CV042
  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 投后估值确认
        - Series D 以来任何轮次均未公开披露估值
        - 没有确认价格，$800M–$1.2B 的基准情景区间只能算第三方估计；无法评估入场折价或溢价
        - 公司 / 投资者直接沟通；Caplight 或 PitchBook 订阅数据提供二级市场信息
      - - CGF 可转债转换条款
        - 利率、转换折扣 / 上限、到期日和第二批提款状态未披露
        - 转换机制可能在退出时造成普通股 5–20% 摊薄；影响优先股堆叠建模
        - CGF FOIA 请求或直接双边谈判；若第二批资金发放公告发布，则使用新闻稿
      - - 股权结构表优先股堆叠
        - 18+ 轮融资中的优先股类别条款、清算优先权、反摊薄条款均未披露
        - 对 $600M+ 采用标准 1.5–2x 清算优先权，若退出价低于 ~$900M–$1.2B，将损害普通股回报
        - 通过可接触资料的律所做法律尽调；公司在任何 IPO 或正式退出流程中披露
      - - 收入和烧钱速度
        - 无经审计财务数据；FY2025 或 FY2026 没有确认的代理收入数字
        - 无法套用收入倍数；无法建模现金跑道或何时需要桥接融资
        - 公司披露；通过 CGF 提款事件新闻稿做间接代理
      - - FOAK 项目管线 FID 时间表
        - 截至 2026 年 6 月，Delek Big Spring、North Star BECCS 和 Mercer Alberta 均处于 FID 前阶段
        - FID 确认是主要重估催化剂；若延迟到 2028 年以后，会触发悲观情景
        - 监测 Svante 新闻稿、DOE 奖项状态和伙伴财务披露
    notes: 尽调问题按对估值的重要性排序。第 1–3 项会阻断精确估值建模。第 4–5 项重要，但可通过伙伴披露部分解决。
    claimRefs:
