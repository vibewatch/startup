      - number: '1.3'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >
              Claude Letourneau 自 2017 年起担任 Svante 总裁兼 CEO。他有超过三十年的工业技术商业化经验，曾任 SNC-Lavalin 高级副总裁（北美、采矿与金属）、Canam Group
              高级副总裁（集成精益项目交付），并创办过两家技术创业公司——Vaperma Inc.（膜基气体分离）和 Avestor Inc.（薄膜锂聚合物电池）。他拥有 Université Laval
              化学工程学士和硕士学位，并入选 Wall Street Journal CEO Council 的「World's Most Influential Decision Makers」。2026 年 5
              月，Svante 任命 Terry Lefebvre 为首席财务官，公司称其是经验丰富的财务和转型领导者。Brett Henkel 仍以联合创始人兼战略客户与政府事务副总裁身份活跃。Matt Stevenson
              担任首席营收官，曾主导 Mercer 以及制浆造纸 BECCS 管线。Scott Gardner 是项目共同开发子公司 Svante Development Inc. 的总裁。诺贝尔奖得主、美国前能源部长
              Steven Chu 曾任董事会成员，这是一个值得注意的治理信号。2026 年公司路演材料显示所有权结构：完全摊薄口径下（不含可转债转换），管理层与普通股股东约 38%，其他工业战略方 43%，机构金融与风投
              6%，能源战略方 13%。除公开确认的成员外，完整董事会构成尚未披露。
