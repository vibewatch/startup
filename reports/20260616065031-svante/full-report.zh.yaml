      - number: '1.6'
        title: 风险、争议与证据缺口
        blocks:
          - type: paragraph
            body: >
              Svante 现阶段面临多项重大风险。Business in Vancouver 报道的 CCUS
              批评者认为，碳捕集是「代价高昂的干扰项——一条最终会推迟必要化石燃料转型、并可能助长进一步开采的生命线」，并特别担心回报可能永远无法匹配投入。Svante 尚未公开披露收入、利润率、烧钱速度或盈利能力。截至
              2026 年 6 月，所有商业规模项目的最终投资决策（North Star、Mercer、Delek US Big Spring、IPC US 造纸厂）仍在 12 至 24 个月之后。North Star 计划于
              2029 年初商业运营。美国政策不确定性——包括 DOE 资助取消的担忧——迫使公司把战略重点转向加拿大项目。员工人数估计从约 200 人（公司，2022 年）到 350 人（Business in
              Vancouver，2025 年）不等，显示公司快速扩张，但没有确认的 2026 年数字。关键人风险偏高：Claude Letourneau
              是商业化战略唯一的公开面孔和主要外部发言人；若其离任或分心，影响将很重大。公司持有 100 多项全球专利，但工业客户处 Redwood 过滤器的商业规模长期运行数据仍非常有限。
