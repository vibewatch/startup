      - number: '3.3'
        title: 固体吸附剂同业与 DAC 邻近市场
        blocks:
          - type: paragraph
            body: >
              Svante 并不是唯一开发模块化固体吸附剂碳捕集的公司，但在工业点源玩家中，截至 2026 年它最为领先。最接近的技术同业是 CarbonCapture Inc. 和
              Climeworks，二者也使用固体吸附剂，但瞄准大气 CO₂ 移除（直接空气捕集），而非工业烟气——因此它们是邻近玩家，不是争夺同一项目授予的直接竞争者。

              CarbonCapture Inc.（Los Angeles）是一家纯 DAC 公司，其 Leo Series 模块使用固体吸附剂，每个海运集装箱大小单元每年捕集超过 500
              吨。其模块化开放系统架构（MOSA）支持现场可升级吸附剂滤芯，设计理念类似 Svante，但目标是约 420 ppm CO₂ 的环境空气，而不是 3–25% 的工业烟气。CarbonCapture 在 2024
              年 Series A 轮融资 $80 million，并获得 $47 million Frontier 协议；其 2026 年成本结构估计为每吨净移除 $600–$800，而工业点源 CCS 为
              $50–$150。

              Climeworks（Switzerland）是 DAC 品类领导者，在 Iceland 运营 Orca（4,000 t/yr）和 Mammoth（36,000 t/yr）设施。其 2026 年成本区间为每吨
              $500–$1,000，自愿碳市场聚焦高端买家（Stripe、Schneider Electric、NYK），使其与 Svante 处在根本不同的竞争细分。

              Carbon Engineering（现 Oxy/1PointFive）在 Texas 运营大型 DAC 设施 Stratos，规模 500,000–1,000,000
              t/yr，使用液态氢氧化钾溶剂而非固体吸附剂；它以每吨 $250–$450 瞄准同一批高端自愿与合规 CDR 市场。Svante 的固体吸附剂路径和工业点源重点，与 Stratos 的市场并不重叠。

              截至 2026 年，膜基和低温捕集替代方案在多数难减排工业应用中仍低于 TRL 7，并不构成 Svante 核心水泥、钢铁和生物质市场的近期主要竞争威胁。
