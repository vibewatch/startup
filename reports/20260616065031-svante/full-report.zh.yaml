  - id: FU002
    title: 采用 / 部署漏斗 — 按阶段划分的项目管线
    type: funnel
    layout: standard
    summary: 展示截至 2026 年 6 月，从战略合作和 MOU，到试点 / 演示、可行性、工程、已签约包销阶段逐步收窄的漏斗。
    data:
      items:
        - label: 战略 MOU / 合作（渠道和封存伙伴）
