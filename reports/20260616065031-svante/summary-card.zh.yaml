summary:
  headline: Svante 拥有全球唯一的固体吸附剂碳捕集滤芯超级工厂，也拿到同类公司里最强的战略投资人阵容；但公司尚未产生收入，所有商业项目都未完成 FID，财务数据也未披露。在 FID 与披露能见度提高前，应维持继续研究。
