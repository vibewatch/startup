callouts:
  - calloutType: risk
    title: US DOE Grant Cancellations Shift Svante's Market Toward Canada
    body: >
      The Trump administration's cancellation of more than $3.7 billion in US DOE CCS grants
      has stalled multiple Svante project partners and shifted the company's primary near-term
      growth market from the US to Alberta's Pathways Alliance and other Canadian incentive
      programmes. This policy reversal advantages liquid amine incumbents with more
      geographically diversified revenue bases (SLB Capturi in Europe; MHI in Asia/Europe)
      and puts additional execution pressure on Svante to win Canadian contracts before
      competitors consolidate those relationships.
    claimRefs: [CP027]

  - calloutType: insight
    title: "BASF: Strategic Partner and Indirect Competitor"
    body: >
      BASF occupies a uniquely ambiguous position in Svante's competitive landscape. As a
      reseller partner, BASF's OASE blue solvent extends Svante's addressable market to lower
      CO₂-concentration flue gas streams that CALF-20 cannot efficiently capture. As an
      independent licensor (through Linde's HISOLV EPC offering), BASF competes for the same
      industrial capture contracts and has far deeper reference plant data. Investors and
      diligence teams should clarify the scope of Svante's OASE blue reseller exclusivity and
      whether BASF could exit or bypass the partnership as CCS market volumes grow.
    claimRefs: [CP016, CP017]

  - calloutType: strength
    title: Svante Holds the Only Dedicated Solid-Sorbent Filter Gigafactory
    body: >
      Svante's Vancouver filter gigafactory—commissioned in May 2025—is the world's first
      dedicated manufacturing facility for carbon capture solid sorbent filters, with stated
      capacity to produce enough filters to capture 10 million tonnes of CO₂ per year.
      No direct competitor has announced equivalent specialised solid sorbent filter
      manufacturing infrastructure. This manufacturing-first strategy is designed to eliminate
      the delivery bottleneck that typically slows first-of-a-kind industrial projects, and it
      represents a structural advantage that Carbon Clean, CarbonCapture Inc., and DAC players
      cannot easily replicate without multi-year capital investment.
    claimRefs: [CP023]

