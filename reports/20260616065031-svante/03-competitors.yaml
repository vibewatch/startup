    title: "Competitive Positioning Map: Industrial CCS Players by Deployment Scale and Solid-Sorbent Innovation (2026)"
    type: quadrant
    layout: wide
    summary: >
      Evidence-backed ordinal positioning of major CCS technology providers on two dimensions:
      commercial deployment scale (x-axis, 1=pre-commercial to 5=mature multi-plant operator)
      and modular/solid-sorbent innovation readiness (y-axis, 1=conventional amine to 5=pioneer).
      Svante occupies the high-innovation, emerging-scale quadrant; incumbents cluster in the
      high-scale, low-innovation quadrant. Scores are ordinal estimates based on public evidence,
      not independently calibrated metrics.
