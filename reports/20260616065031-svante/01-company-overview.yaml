company:
  name: Svante Technologies
chapter:
  number: 1
  title: Company Overview
  summary: >
    Svante Technologies Inc. is a Burnaby, British Columbia carbon capture and removal company founded in
    2007 that has raised over US$600 million from strategic investors including Chevron New Energies,
    Temasek, and the Canada Growth Fund. Its proprietary nanoengineered solid sorbent filters and modular
    rotary contactor machines position it as a first-mover in commercial-scale solid-state industrial carbon
    capture, though the company has yet to disclose revenue and all commercial-scale project FIDs remain
    12–24 months away as of the run date.

sections:
  - id: identity-and-mission
    title: Company Identity and Mission
    body: >
      Svante Technologies Inc. is a purpose-driven carbon capture and removal solutions provider
      headquartered at 8800 Glenlyon Parkway, Burnaby, British Columbia, Canada V5J 5K3. The company
      operates as a fully private late-stage venture (post-Series E) with no disclosed IPO timeline.
      Originally incorporated as Inventys, the company rebranded to Svante in 2019 in honor of Svante
      Arrhenius — the Swedish scientist who in 1896 first identified the relationship between atmospheric
      CO₂ concentration and global surface temperature. Svante's core business makes two
      product lines: (1) nanoengineered solid sorbent filters coated with metal-organic frameworks
      (MOFs), and (2) modular rotary contactor machines that force flue gas through the filters,
      adsorb CO₂, and regenerate the filters in approximately 60-second cycles. Captured CO₂ is
      concentrated to 95-percent pipeline-grade purity, suitable for permanent geological storage or
      circular industrial reuse. The company targets hard-to-abate industries: cement, pulp and paper,
      hydrogen, steel, lime, aluminum, and oil and gas refining, and is expanding into bioenergy with
      carbon capture and storage (BECCS) and direct air capture (DAC). Svante's business model spans
      OEM filter sales, turnkey project delivery, and a project development subsidiary (Svante
      Development Inc.) that co-invests in first-of-a-kind FOAK commercial projects alongside
      industrial partners. The company's canonical website is www.svanteinc.com.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006]
    tableRefs: [TO001]
    figureRefs: [FO003]

  - id: founding-history-and-technology
    title: Founding History and Technology
    body: >
      Svante was founded in 2007 in a Burnaby, British Columbia garage by four professionals from the
      gas purification and separation industry: Brett Henkel, André Boulet, Darryl Wolanski, and Soheil
      Khiavi. Brett Henkel, who serves as co-founder and VP of Strategic Accounts and Government
      Affairs, drew on prior experience at QuestAir Technologies. The company secured early R&D
      funding through Series A and B rounds from Roda Group, Mitsui, Chevron Technology Ventures
      (which made its initial investment in 2014), and Chrysalix, as well as bench-scale project
      funding from the Canadian and UK governments and the Province of Alberta. Nobel Laureate and
      former U.S. Secretary of Energy Steven Chu joined the board during the early phase, providing
      scientific and policy credibility. The company's critical technological breakthrough is the
      use of MOF nanomaterials — specifically CALF-20, whose inventors received the Nobel Prize in
      Chemistry in 2025 — as solid sorbents coated onto laminate filter sheets. Filters are produced
      via an automated roll-to-roll manufacturing process analogous to thin-film battery production.
      In 2019, a 30 tonne-per-day (TPD) CO₂ capture pilot plant came online in Saskatchewan in
      collaboration with Cenovus (formerly Husky Energy), and the CO₂MENT pilot at the Lafarge cement
      plant in Richmond, BC captured one tonne per day. In May 2025, Svante officially commissioned
      the Redwood Facility — a 141,000-square-foot Centre of Excellence in Burnaby, BC — as the
      world's first commercial manufacturing plant for solid sorbent-based carbon capture filters,
      with annual capacity to produce filters for capturing up to 10 million tonnes of CO₂.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO013]
    figureRefs: [FO002]

  - id: leadership-and-governance
    title: Leadership and Governance
    body: >
      Claude Letourneau has served as President and CEO of Svante since 2017. He brings over three
      decades of industrial technology commercialization experience, including prior roles as Senior VP
      at SNC-Lavalin (North America, Mining and Metals), Senior VP at Canam Group (Integrated Lean
      Project Delivery), and founder of two technology startups — Vaperma Inc. (membrane-based gas
      separation) and Avestor Inc. (thin-film lithium polymer batteries). He holds a Bachelor and
      Master of Engineering in Chemical Engineering from Université Laval and has been named among
      the Wall Street Journal CEO Council's "World's Most Influential Decision Makers." In May 2026,
      Svante appointed Terry Lefebvre as Chief Financial Officer, described as a seasoned finance and
      transformation leader. Brett Henkel remains active as co-founder and VP of Strategic Accounts
      and Government Affairs. Matt Stevenson serves as Chief Revenue Officer, having led the Mercer
      and pulp and paper BECCS pipeline. Scott Gardner is President of Svante Development Inc., the
      project co-development subsidiary. Nobel Laureate and former U.S. Secretary of Energy Steven
      Chu has served on the board of directors — a notable governance signal. The 2026 corporate deck
      shows ownership structure: approximately 38% management and common shareholders, 43% other
      industrial strategics, 6% institutional financials and venture capital, and 13% energy strategics,
      on a fully diluted basis (excluding convertible note conversion). Full board composition beyond
      publicly confirmed members has not been disclosed.
    claimRefs: [CO014, CO015, CO016, CO017, CO018, CO019, CO020, CO021]
    tableRefs: [TO002]

  - id: funding-history
    title: Funding History and Investor Base
    body: >
      Svante has raised over US$600 million in total capital across multiple rounds since its 2007
      founding, making it one of the most heavily capitalized industrial carbon capture technology
      companies globally. Series A and B rounds were backed by Roda Group, Mitsui, Chevron Technology
      Ventures, and Chrysalix. A Series C round was led by OGCI Climate Investment. The Series D round
      closed in 2021, led by Suncor and Temasek. The landmark Series E round closed on December 15,
      2022 at US$318 million — the largest reported financing of a point-source carbon capture
      technology company globally at that time — led by Chevron New Energies and joined by Temasek,
      OGCI Climate Investments, Delek US, Hesta AG, 3M Ventures, GE Vernova, Japan Energy Fund,
      Liberty Media, M&G Catalyst, Samsung Engineering, TechEnergy Ventures, Full Circle Capital, and
      United Airlines Ventures. J.P. Morgan Securities LLC served as lead placement agent and RBC
      Capital Markets as co-lead. In August 2024, the Canada Growth Fund Inc. (CGF) committed up to
      US$100 million (approximately C$137 million) in convertible notes in two tranches of US$50
      million each — CGF's first investment in British Columbia. InBC Investment Corp., the provincial
      venture fund, has also invested C$15 million. A separate US$145 million capital commitment was
      made for the Redwood manufacturing facility. The company's post-money valuation after any of
      these rounds has not been publicly disclosed.
    claimRefs: [CO022, CO023, CO024, CO025, CO026, CO027, CO028, CO029]
    tableRefs: [TO003]

  - id: milestones-and-commercial-progress
    title: Milestones and Commercial Progress
    body: >
      Svante's milestone arc runs from an R&D garage startup in 2007 through a commissioned
      commercial-scale filter manufacturing facility in 2025 and its first major carbon removal offtake
      agreement in April 2026. Key commercial partnerships include a Chevron Kern River pilot backed
      by U.S. DOE grant DE-FE0031944, the CO₂MENT pilot at the Lafarge Richmond cement plant, a
      Pre-FEED (FEL-2) stage project with Mercer International at the Peace River pulp mill in Alberta
      (April 2025), and a FEED-ready project at Delek US's Big Spring Refinery in Texas. In March
      2026, Svante acquired Calgary-based Carbon Alpha Corporation, including ownership interests in
      North Star Carbon Solutions — a BECCS project in Saskatchewan developed in partnership with the
      Meadow Lake Tribal Council (MLTC), representing nine First Nations. MLTC will co-own the BECCS
      facility. Phase 1 of North Star will capture up to 140,000 tonnes of CO₂ per year from the MLTC
      Bioenergy Centre; FID is expected Q1-2027. In April 2026, Microsoft agreed to purchase 626,000
      tonnes of CDR credits over 15 years from North Star — Microsoft's first Canadian BECCS CDR
      offtake agreement, and believed to be the first in Canada involving Indigenous ownership.
      Commercial operations at North Star are planned for early 2029. In 2025, Svante launched three
      new business units (OEM&D, Development Company, Solutions & Digital Services) and announced a
      joint prefabricated modular solution ("CREADY") with SAMSUNG E&A. The company was inducted into
      the Global Cleantech 100 Hall of Fame in 2025 and ranked in TIME & Statista's Top 100 Greentech
      Companies of 2025.
    claimRefs: [CO030, CO031, CO032, CO033, CO034, CO035, CO036, CO037, CO043]
    tableRefs: [TO004]
    figureRefs: [FO001]

  - id: risks-and-evidence-gaps
    title: Risks, Controversies, and Evidence Gaps
    body: >
      Svante faces multiple material risks at this stage. Critics of CCUS argue, as reported in
      Business in Vancouver, that carbon capture is "a costly distraction — a lifeline that ultimately
      delays a necessary shift away from fossil fuels and potentially enables further extraction," with
      specific concern that the payoff may never match the investment. Svante has not publicly disclosed
      revenue, margins, burn rate, or profitability. All commercial-scale project final investment
      decisions (North Star, Mercer, Delek US Big Spring, IPC US paper mill) are 12 to 24 months away
      as of June 2026. North Star commercial operations are planned for early 2029. US policy
      uncertainty — including concerns around canceled DOE grants — has forced a strategic emphasis
      toward Canadian projects. Headcount estimates span approximately 200 (company, 2022) to 350
      (Business in Vancouver, 2025), indicating rapid scaling but no confirmed 2026 figure. Key-person
      risk is elevated: Claude Letourneau is the sole public face of commercialization strategy and
      the primary external spokesperson; departure or distraction would be material. The company holds
      over 100 global patents but commercial-scale long-term operational data for the Redwood filters
      at industrial customers remains very limited.
    claimRefs: [CO038, CO039, CO040, CO041, CO042, CO044, CO045]

