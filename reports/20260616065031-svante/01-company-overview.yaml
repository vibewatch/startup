  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: valuation
      missingEvidence: "Post-money valuation from any of the Series E, CGF convertible note, or InBC rounds has not been publicly disclosed."
      whyItMatters: "Without a disclosed valuation, valuation-stance analysis and return-on-investment modeling for the financials and valuation chapters are impossible."
      diligencePath: "Request term sheet or investor call summary; cross-reference PitchBook or Crunchbase paid data tiers; monitor press releases for any secondary transaction that implies a price per share."
      relatedQuestionRefs: [QO005]

    - type: private-evidence-only
      severity: minor
      topic: headcount
      missingEvidence: "A confirmed 2026 headcount figure from Svante directly or from a recent filing; current best estimate spans 200–350 across different source vintages."
      whyItMatters: "Headcount is a proxy for operational burn rate, hiring velocity, and organizational maturity; an uncertain range weakens the cover metric section."
      diligencePath: "Request the company for current FTE count; consult LinkedIn employee count heuristic; check any government labor filings in BC."
      relatedQuestionRefs: [QO006]

    - type: missing-source
      severity: material
      topic: adverse-events
      missingEvidence: "No public record of lawsuits, regulatory enforcement, IP disputes, product failures, data breach, or material leadership departures at Svante through June 2026 was found; absence of evidence is not evidence of absence."
      whyItMatters: "A single undisclosed legal, regulatory, or IP event could materially change the risk profile of this early-stage company operating in a government-subsidy-dependent sector."
      diligencePath: "Search BC Court filings, Canadian IP Office records, and any U.S. Federal Courts PACER database for Svante Inc. or Inventys parties; request management representation letter on known litigation."
