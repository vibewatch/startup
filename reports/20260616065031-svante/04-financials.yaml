company:
  name: Svante Technologies

chapter:
  number: 4
  title: Financials
  summary: >-
    Svante Technologies has raised at least C$685M (~US$500M) in private capital through
    Series C, D, and E equity rounds plus a C$137M (US$100M) Canada Growth Fund convertible
    note, financing a US$145M manufacturing facility in Burnaby and a strategic pivot to
    project co-development. Revenue and margins are entirely undisclosed for this private
    company; financial viability depends heavily on government incentives (US 45Q, Canada
    CCUS ITC) and project economics that independent analysts warn remain challenging at
    commercial scale.

sections:
  - id: revenue-model-business-lines
    title: Revenue Model and Business Lines
    body: >-
      Svante operates three distinct but interconnected business lines. The first is equipment
      manufacturing: Svante designs and produces solid sorbent-based filter modules and
      rotary adsorption machines (RAMs) at its Burnaby Redwood facility. The second is
      technology packages and services, where Svante licenses its technology and provides
      engineering, project development advisory, and integrated project development services
      to industrial emitters. The third, and strategically pivotal, is project co-development
      through Svante Devco, where the company takes equity positions in first-of-a-kind (FOAK)
      commercial carbon capture facilities using joint development agreements (JDAs) with host
      emitters.

      Revenue is entirely undisclosed — Svante publishes no audited financials, and no revenue,
      ARR, or margin data is publicly available as of June 2026. The CEO has acknowledged the
      company's need to "crack the code of monetization," signalling that the revenue model is
      still maturing from technology demonstration toward repeatable commercial returns. Proxy
      signals suggest meaningful project development activity: the Delek Big Spring refinery
      CCUS project advanced past selection, the Mercer Peace River mill project reached Pre-FEED
      stage, and the Ashdown Pulp Mill DOE pre-FEED study is under way. Svante's partnership
      with Tenaska for end-to-end CO2 transport and storage integration broadens the commercial
      offering but does not yet provide publicly measurable revenue commitments.

      The go-to-market motion is direct engagement with industrial emitters in hard-to-abate
      sectors (cement, pulp and paper, refining, steel, hydrogen), supported by strategic
      investors who are also customers (Delek US, Chevron, Suncor). This investor-as-customer
      structure accelerates pipeline development but concentrates near-term revenue exposure
      within a small set of large-scale industrial counterparties.
    claimRefs: [CI019, CI020, CI021, CI022, CI023, CI024, CI016, CI017, CI047, CI050]
    tableRefs: [TI002]
    figureRefs: [FI002]

  - id: capital-formation-funding-history
    title: Capital Formation and Funding History
    body: >-
      Svante has assembled one of the largest private capital bases in the global carbon
      capture sector. Early non-dilutive government grants from NRCan, SDTC, ERA, WINN, and
      NRC-IRAP totalled C$12.3M by end-2017, funding the first CO2 capture pilot plant. The
      company then raised US$26M in its Series C (2019, led by OGCI Climate Investments),
      US$100M in its Series D (2021, Temasek lead with Suncor, Chart Industries, BDC, and
      EDC), and US$318M in its landmark Series E (December 2022, second close Q1 2023, led
      by Chevron New Energies). The Series E attracted a broad strategic and institutional
      investor base including 3M Ventures, GE Vernova, Japan Energy Fund, Liberty Media,
      M&G Catalyst, NextEra Energy, Samsung Engineering, and United Airlines Ventures, with
      J.P. Morgan and RBC Capital Markets as placement agents.

      In August 2024, the Canada Growth Fund committed up to US$100M (C$137M) via convertible
      notes in two tranches of US$50M each. As of mid-2024, CEO Claude Letourneau stated that
      total private-sector fundraising reached C$685M (~US$500M), with more than 90% from
      private sources. The BIV (May 2025) reported approximately US$600M in total capital
      raised as of that date. The company's ownership is approximately 40% oil and gas
      companies, 40% private and institutional investors, and the remainder management and
      strategic partners; no single investor holds more than 15%.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI014, CI015, CI038, CI039, CI051]
    tableRefs: [TI001]
    figureRefs: [FI003]

  - id: cgf-convertible-note-strategic-implications
    title: CGF Convertible Note and Strategic-Investor Implications
    body: >-
      The Canada Growth Fund's US$100M convertible note (August 2024) is the most structurally
      significant recent financing event. CGF structured the investment in two tranches: an
      immediate US$50M tranche for commercial development and FOAK project co-investment, and
      a second US$50M tranche available for project-specific draws subject to approval by both
      parties. As convertible notes, the instruments give CGF the option to convert debt to
      equity, creating potential dilution for existing shareholders under conversion scenarios
      that have not been publicly detailed in terms of valuation cap, interest rate, or
      conversion trigger.

      Strategically, the CGF investment transforms Svante's capital deployment from equipment
      manufacturer to active project co-investor. The CEO confirmed the funds are used so the
      company can "have enough cash to basically be able to invest in these projects, and these
      projects eventually will get a return on investment." This is a capital-intensive pivot:
      FOAK projects in the 200,000–1,000,000 tonne/year range will require significant equity
      per project, and the CGF's first tranche is expected to support only a small number of
      initial deployments. The CGF marked its first British Columbia investment with this deal,
      signalling strong government backing for keeping Svante's intellectual property and
      manufacturing in Canada.

      The strategic-investor structure — with 40% oil and gas ownership across Chevron, Delek,
      OGCI Climate Investments, Suncor, and others — creates potential alignment but also
      tension. These investors have both technological and financial interests in successful
      deployment, which provides commercial pipeline, but may constrain Svante's scope to
      fossil-fuel-adjacent decarbonization rather than broader CDR markets.
    claimRefs: [CI006, CI007, CI008, CI009, CI010, CI011, CI012, CI013, CI022, CI049]
    tableRefs: [TI003]

  - id: manufacturing-capital-intensity-cost-structure
    title: Manufacturing Capital Intensity and Cost Structure
    body: >-
      The Burnaby Redwood facility represents Svante's single largest capital commitment and
      the physical foundation of its commercialization strategy. Svante invested US$145M
      (C$198.65M) in the 141,000 sq. ft. facility, which serves as its global HQ, R&D centre,
      and production line. The facility incorporates high-volume automation and roll-to-roll
      manufacturing processes to produce solid sorbent filter modules and rotary adsorption
      machines at commercial scale. At full capacity, the plant can produce enough filters to
      support carbon capture facilities removing 10 million tonnes of CO2 per year — equivalent
      to approximately 27 million passenger vehicles.

      Svante's CEO has publicly stated that point-source carbon capture using Svante technology
      costs approximately US$150 per tonne, with higher concentrations of CO2 in industrial
      flue gas (e.g., pulp mills, ethanol plants) yielding lower costs. The BIV characterized
      the range as "less than $250 per tonne" for point-source capture. No gross margin figures,
      OPEX per unit, or manufacturing cost-per-filter data are publicly disclosed. Working
      capital dynamics are opaque: Svante has not disclosed receivables, inventory, or payables
      characteristics, though the capital-intensive manufacturing model implies material upfront
      investment ahead of project revenue.

      The manufacturing facility was funded by the Series E proceeds and supported by the CGF
      convertible note. Key strategic investors — Chevron New Energies, Temasek, M&G, CGF,
      United Airlines Ventures, Samsung, and GE Vernova — contributed directly to the facility's
      financing. The Burnaby facility creates both a competitive moat (first mover in commercial
      filter manufacturing) and a structural cost burden that requires significant order volume
      to be absorbed.
    claimRefs: [CI025, CI026, CI027, CI028, CI029, CI030, CI016, CI017]
    tableRefs: [TI004]

  - id: government-incentives-project-economics
    title: Government Incentives and Project-Level Economics
    body: >-
      Svante's project economics are materially shaped by a layered stack of government
      incentives on both sides of the border. In the United States, the Section 45Q tax credit
      provides US$85 per tonne for CO2 geologically stored and US$60 per tonne for CO2 used
      in other applications, with DAC projects eligible for up to US$180 per tonne. The DOE
      Carbon Capture Large-Scale Pilot Program provided up to US$95M (70% cost-share) for
      the Delek Big Spring refinery project. A separate DOE IEDO cost-sharing agreement of up
      to US$1.5M was selected for the Ashdown Pulp Mill pre-FEED study.

      In Canada, the CCUS Investment Tax Credit (CCUS ITC) — enacted in Bill C-59 (June 2024)
      and effective from January 2022 to December 2040 — provides up to 50% of eligible capital
      cost for point-source capture equipment and 60% for direct air capture equipment, plus
      37.5% for eligible transportation and storage expenditures. The BIV noted Canada's system
      covers "up to 62 per cent of capital costs for a carbon capture project" when investment
      tax credits are combined with the industrial carbon pricing credit mechanism.

      These incentives are critical to project economics. With capture costs targeting
      US$60–120 per tonne at industrial point sources, and the 45Q offering US$85 per tonne
      for geological storage, select projects can be self-funding on operating economics once
      built. However, IEEFA's analysis of existing Alberta CCS plants found that operating
      costs are rising at twice the rate of CO2 captured volumes, and the effective C$170/tonne
      cap on emission performance credits limits revenue upside, raising questions about
      replicability at scale.
    claimRefs: [CI029, CI030, CI031, CI032, CI035, CI036, CI037, CI033, CI034, CI040]
    tableRefs: [TI005]
    figureRefs: [FI001]

  - id: capital-adequacy-risks-diligence-blockers
    title: Capital Adequacy, Financial Risks, and Diligence Blockers
    body: >-
      Svante's capital position, as of June 2026, cannot be precisely assessed from public
      information. Total known committed capital of approximately US$645M (US$500M+ private
      plus US$145M facility investment counted within the private total) is partially deployed
      into the Burnaby facility (US$145M) and supporting the company's ~350-person workforce
      and pipeline activities. The CGF first tranche (US$50M) provides project co-investment
      capacity, but the cash burn rate, remaining cash position, and next-round trigger are
      not publicly disclosed. Runway is therefore unresolvable from public evidence.

      Three structural financial risks stand out. First, policy dependence: the US 45Q credit
      and Canada's CCUS ITC are essential to project-level economics; changes in administration
      or legislation — particularly in the US following the 2024 and 2028 election cycles —
      could impair Svante's project pipeline economics and delay final investment decisions.
      Second, FOAK execution risk: first-of-a-kind commercial projects carry material cost
      overrun and performance risk; IEEFA found real-world CCS projects globally consistently
      underperform projected capture rates. Third, convertible note dilution: the CGF's
      option to convert debt to equity at undisclosed terms introduces balance sheet and cap
      table uncertainty that downstream investors cannot fully evaluate.

      Critical analysts including IEEFA, IISD, and academic researchers emphasize that CCS
      projects to date have failed to meet capture-rate targets while costs have doubled. These
      findings apply directly to the sector Svante operates in, even if Svante's technology
      approach differs from solvent-based incumbent systems. The financial verdict: Svante is
      well-capitalised relative to peers but remains pre-revenue at commercial scale, highly
      policy-dependent, and opaque on the metrics needed to underwrite a diligence decision.
    claimRefs: [CI033, CI034, CI040, CI041, CI042, CI043, CI044, CI045, CI046, CI048, CI049]
    tableRefs: [TI006]

