  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-opacity
      missingEvidence: >-
        Svante's actual revenue, ARR, gross margin, EBITDA, and annual cash burn rate are
        entirely undisclosed. No audited financial statements, management accounts, or
        regulatory filings from Svante are publicly available.
      whyItMatters: >-
        Without revenue or margin data, underwriters and investors cannot assess capital
        adequacy, determine dilution exposure from the CGF convertible note, or evaluate
        whether the company has reached a sustainable commercial revenue model.
      diligencePath: >-
        Request audited financial statements or management accounts directly from Svante
        under NDA; alternatively obtain via Series E or CGF investor reporting rights.
      relatedQuestionRefs: [QI002, QI003, QI014]

    - type: missing-source
      severity: material
      topic: CGF-convertible-terms
      missingEvidence: >-
        The specific terms of the CGF convertible note — interest rate, conversion trigger,
        valuation cap, discount rate, and maturity date — have not been publicly disclosed
        by either Svante or the Canada Growth Fund.
      whyItMatters: >-
        Convertible note terms directly determine the extent of potential shareholder dilution
        on conversion and the effective cost of capital, both material to valuation analysis.
      diligencePath: >-
        Request the note terms from Svante or Canada Growth Fund Investment Management Inc.
        under investor-level disclosure; review any CGF annual report or parliamentary filings
        for aggregated disclosure.
      relatedQuestionRefs: [QI005, QI011]

    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: >-
        Svante's current cash position, burn rate, and runway are not publicly disclosed.
        It is not possible to determine from public sources when Svante may require its next
        equity round or when the CGF second tranche would be drawn.
      whyItMatters: >-
        Understanding runway is essential to assessing the risk of a down round, bridge
