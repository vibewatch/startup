callouts:
  - calloutType: strength
    title: Best-Capitalised Private Carbon Capture Firm in Canada
    body: >-
      With ~US$500M+ in private capital plus a US$100M government convertible note,
      Svante has achieved a capital base that few private carbon capture companies globally
      can match. The Series E at US$318M remains the largest single private investment
      in point-source carbon capture technology, and the CGF backing signals sustained
      government endorsement of both the technology and the company's Canadian mandate.
    claimRefs: [CI001, CI002, CI006]

  - calloutType: risk
    title: Revenue and Margin Opacity is a Material Diligence Blocker
    body: >-
      Svante discloses no revenue, ARR, gross margin, cash burn, or balance sheet information.
      The company is pre-revenue at commercial scale; its three business lines all depend
      on FOAK projects reaching final investment decision. Without financial visibility,
      investors cannot assess capital adequacy, margin trajectory, or dilution risk from
      the CGF convertible note — creating an underwriting gap that is structural rather
      than resolvable from public evidence alone.
    claimRefs: [CI016, CI017, CI011, CI045, CI048]

  - calloutType: risk
    title: Project Economics Dependent on Persistent Government Policy
    body: >-
      Independent analysts (IEEFA, IISD) have concluded that commercial-scale CCS projects
      are unlikely to achieve financial sustainability without permanent government subsidies.
      Svante's project pipeline is heavily reliant on the US 45Q credit and Canada's CCUS
      ITC. Any legislative weakening — especially post-2028 in the US — could impair
      multiple projects simultaneously, with no clear private-market fallback.
    claimRefs: [CI033, CI034, CI043, CI045]

  - calloutType: insight
    title: CGF Pivot to Project Co-Developer Fundamentally Changes the Risk Profile
    body: >-
      Svante's use of CGF capital to take equity positions in FOAK commercial plants
      shifts the company from a capital-light technology licensor to a project developer
      carrying construction, performance, and policy risk on its own balance sheet. This
      raises return potential but also concentrates financial exposure in a small number
      of high-risk early-commercial projects — a bet that mirrors what project-finance
      lenders typically price at premium rates for first-of-a-kind industrial assets.
    claimRefs: [CI007, CI008, CI009, CI020, CI021, CI022]

