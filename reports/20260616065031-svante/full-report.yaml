      - number: '1.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Investor Depth Bridges Capital and Channel-to-Market
            body: >
              Svante's investor syndicate uniquely combines energy strategics (Chevron, Delek US), industrial
              manufacturing partners (Samsung Engineering, GE Vernova), aviation sustainability buyers (United Airlines
              Ventures), institutional capital (Temasek, M&G Catalyst), and government anchors (CGF, InBC). This
              multi-constituency structure provides not just capital but deployment obligations, manufacturing channel
              access, regulatory relationships, and end-user credibility that pure-financial syndicates cannot
              replicate.
            calloutType: strength
            claimRefs:
              - CO023
              - CO024
              - CO025
              - CO026
              - CO028
          - type: callout
            title: Commercial Revenue and FIDs Remain 12–24 Months Away
            body: >
              Despite over US$600 million raised and the Redwood Facility commissioned, Svante has no disclosed revenue,
              margins, or profitability. Every commercial-scale project (North Star BECCS, Mercer Peace River, Delek US
              Big Spring, IPC US paper mill) is in Pre-FEED, FEED, or feasibility stage as of June 2026. The North Star
              FID is not expected until Q1-2027, with commercial operations in early 2029. This creates a minimum 2–3
              year cash-consumption runway before first project revenue.
            calloutType: risk
            claimRefs:
              - CO038
              - CO040
              - CO041
          - type: callout
            title: BECCS-First Strategy Targets Biogenic Carbon Premium
            body: >
              Svante's go-to-market pivot toward BECCS (biogenic CO₂ in pulp and paper, ethanol, waste-to- energy) is
              deliberate: biogenic CO₂ removal credits command a premium over fossil-source credits because they
              constitute net removal, not merely avoided emissions. The Microsoft North Star deal and the Mercer and IPC
              paper mill pipeline collectively validate this as the most commercially proximate revenue pathway, with
              lower per-tonne cost than DAC and higher credit value than fossil-source point capture.
            calloutType: insight
            claimRefs:
