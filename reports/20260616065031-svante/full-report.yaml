      - number: '3.3'
        title: Solid Sorbent Peers and DAC Adjacency
        blocks:
          - type: paragraph
            body: >
              Svante is not the only company developing modular solid sorbent carbon capture, but among industrial
              point-source players it is the most advanced as of 2026. The closest technical peers are CarbonCapture
              Inc. and Climeworks, both of which use solid sorbents but target atmospheric CO₂ removal (direct air
              capture), not industrial flue gas—making them adjacencies rather than direct competitors for the same
              project awards.

              CarbonCapture Inc. (Los Angeles) is a pure-play DAC company whose Leo Series modules use solid sorbents to
              capture over 500 tonnes per year per shipping-container-sized unit. Its modular open system architecture
              (MOSA) enables field-upgradeable sorbent cartridges, a design philosophy similar to Svante's but aimed at
              ambient air at ~420 ppm CO₂ rather than industrial flue gas at 3–25%. CarbonCapture raised $80 million in
              a Series A in 2024 and secured a $47 million Frontier agreement; its 2026 cost structure is estimated at
              $600–$800 per tonne net removed, versus $50–$150 for industrial point-source CCS.

              Climeworks (Switzerland) is the DAC category leader, operating the Orca (4,000 t/yr) and Mammoth (36,000
              t/yr) facilities in Iceland. Its 2026 cost range of $500–$1,000 per tonne and voluntary carbon market
              focus on premium buyers (Stripe, Schneider Electric, NYK) place it in a fundamentally different
              competitive segment from Svante.

              Carbon Engineering (now Oxy/1PointFive), operating the Stratos large-format DAC facility in Texas at
              500,000–1,000,000 t/yr, uses a liquid potassium hydroxide solvent rather than solid sorbents; it targets
              the same premium voluntary and compliance CDR markets at $250–$450 per tonne. Svante's solid sorbent
              approach and industrial point-source focus do not overlap with Stratos's market.

              Membrane-based and cryogenic capture alternatives remain below TRL 7 for most hard-to-abate industrial
              applications as of 2026 and do not represent near-term primary competitive threats to Svante's core
              cement, steel, and biomass markets.
