      - number: '5.5'
        title: Differentiation, IP, and Competitive Advantages
        blocks:
          - type: paragraph
            body: >
              Svante's principal differentiation rests on five pillars. First, CALF-20 is a proprietary MOF sorbent with
              demonstrated resistance to industrial flue gas impurities, avoiding the degradation and secondary-emission
              risks associated with liquid amine solvents; its Nobel-Prize-recognized chemistry (2025 Nobel in Chemistry
              cited MOF research) and peer-reviewed scientific publication (Science, December 2021) provide a defensible
              technical foundation. Second, the VeloxoTherm architecture enables extremely fast cycle times (~60 seconds
              vs. hours for conventional packed-bed TSA), delivering compact equipment with high throughput and
              attractive capture economics relative to the sorbent inventory. Third, Svante's patent portfolio covers
              the adsorption process (US11813563), the parallel passage contactor design (US11766634), the integrated
              TSA combustion system (US11224834), and underlying zinc MOF synthesis chemistry (WO2019204934A1), along
              with additional published applications including the scalable sortive gas separator (US20250153088A1).
              Fourth, Svante operates the only commercial gigafactory for MOF-based carbon capture filters, providing a
              manufacturing cost and lead-time advantage over competitors who do not own filter production. Fifth, the
              BASF commercial supply agreement for CALF-20 resolves the historical barrier to MOF commercialization
              (large-scale, low-cost production), making the supply chain more defensible than a purely in-house
              synthesis approach. Taken together, these differentiators are validated by independent DOE-funded FEED
              studies at industrial scale and by Climeworks' selection of Svante as the DAC filter supplier for its US
              DOE-funded megaton-scale hubs.
