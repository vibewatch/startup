  - id: TV005
    title: Thesis-Break and Kill Trigger Table
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - No FOAK project FID
        - Zero FID events by Q4 2027
        - Validates execution risk; forces bridge round or down-round; weakens M&A premium
        - Re-evaluate; reduce exposure; require FID confirmation before deploying capital
      - - Down-round equity raise
        - New round priced below implied US$1B valuation
        - Reprices all prior marks; triggers preference stack calculations; signals investor sentiment shift
        - Exit or restructure position; analyse preference overhang before deploying additional capital
      - - US 45Q policy reversal
        - EPA GHGRP weakened post-2026 election or 45Q transferability removed
        - Eliminates primary US project economics; Delek Big Spring likely unviable; shrinks addressable market
        - Reduce weight on US projects; shift analysis to Canada-only pipeline viability
      - - Competitor gigafactory deployment
        - SLB Capturi, Carbon Clean, or MHI announces equivalent filter-scale manufacturing
        - Erodes first-mover moat; compresses pricing power; increases competitive risk in project bidding
        - Re-assess competitive positioning; model margin compression scenarios
      - - Sustained capture rate underperformance
        - No commercial plant achieves >80% design capture rate over 12 consecutive months by 2028
        - Validates IEEFA efficiency risk; FOAK financing gap widens; repeat of Aker loss on project scenario
        - Flag as blocking; require independent engineering review of first deployed units
    notes: >-
      Kill triggers are analyst constructs based on public evidence. Actual thresholds should be adapted to specific
      investment mandate and time horizon.
    claimRefs:
      - CV012
      - CV020
      - CV029
      - CV033
      - CV038
      - CV042
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Post-money valuation confirmation
        - No publicly disclosed valuation for any round from Series D onward
        - >-
          Without a confirmed price, base-case range of $800M–$1.2B is a third-party estimate only; cannot assess entry
          discount or premium
        - Company / investors via direct engagement; secondary data from Caplight or PitchBook subscription
      - - CGF convertible note conversion terms
        - Interest rate, conversion discount/cap, maturity, and second tranche drawdown status undisclosed
        - >-
          Conversion mechanics could result in 5–20% dilution to common equity at exit; affects preference stack
          modelling
        - CGF FOIA request or direct bilateral negotiation; press releases if tranche-2 disbursement is announced
      - - Cap table preference stack
        - Preferred share class terms, liquidation preferences, anti-dilution provisions undisclosed across 18+ rounds
        - Standard 1.5–2x liquidation preference on $600M+ would impair common equity returns below ~$900M–$1.2B exit
        - Legal due diligence via law firm with access; company disclosure in any IPO or formal exit process
      - - Revenue and burn rate
        - No audited financials; no proxy revenue figure confirmed for FY2025 or FY2026
        - Cannot apply revenue multiple; cannot model runway or when bridge financing is required
        - Company disclosure; indirect proxy via CGF drawdown event press releases
      - - FOAK project pipeline FID schedule
        - Delek Big Spring, North Star BECCS, and Mercer Alberta are all in pre-FID phases as of June 2026
        - FID confirmation is the primary re-rating catalyst; delay to 2028+ triggers bear case
        - Monitoring Svante press releases, DOE award status, and partner financial disclosures
    notes: >-
      Diligence asks are ranked by materiality to valuation. Items 1–3 are blocking for precise valuation modelling.
      Items 4–5 are material but partially addressable through partner disclosures.
