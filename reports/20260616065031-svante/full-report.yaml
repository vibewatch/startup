  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Svante operates within the industrial point-source carbon capture sub-market—a slice of the broader carbon
              capture, utilization, and storage (CCUS) market defined by flue-gas streams from large stationary emitters
              rather than from ambient air (direct air capture, DAC) or power plants primarily serving enhanced oil
              recovery. The relevant included spend encompasses capture equipment (sorbent/solvent units, heat
              exchangers, compressors, controls), CO2 conditioning and liquefaction, on-site integration engineering,
              and long-term service and monitoring. Excluded from the core addressable market are dedicated CO2
              transport and geological storage infrastructure (though these are gate conditions for project viability),
              DAC systems targeting atmospheric CO2, and emissions reductions achievable via electrification or
              fuel-switching alone.


              The primary sectors within scope are those where process-chemistry emissions—not just combustion—make
              electrification or fuel substitution insufficient for deep decarbonization: cement/lime (calcination
              releases ~60% of sector emissions as unavoidable CO2), pulp and paper (BECCS opportunity from biogenic
              boiler emissions), chemical/petrochemical manufacturing, hydrogen production from natural gas
              (pre-combustion or post-combustion CCS), waste-to-energy facilities, and increasingly steel where
              blast-furnace or natural-gas DRI routes generate concentrated CO2 streams. Adjacent segments include BECCS
              (bioenergy with CCS) for CDR credit generation, and DAC adjacency where Svante's solid-sorbent filter
              platform shares material science. Status-quo substitutes include continued unabated operation plus carbon
              allowance purchases, fuel switching to biomass or hydrogen, electrification of process heat where
              technically feasible, and nature-based offsets or voluntary carbon credits (which face rising permanence
              and credibility scrutiny).
            claimRefs:
