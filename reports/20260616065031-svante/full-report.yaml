            body: >
              The Redwood Facility (141,000 sq ft, 10 Mtpy CO₂ filter capacity, commissioned May 2025) is the world's
              only commercial-scale MOF filter manufacturing plant for carbon capture. Combined with the BASF CALF-20
              supply agreement and the C-READY modular plant offering with SAMSUNG E&A, Svante has assembled a
