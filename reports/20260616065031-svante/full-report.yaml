  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Technology Scale-Up and FOAK Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Svante's commercial thesis rests entirely on FOAK carbon capture plants performing at specification and on
              schedule. The Redwood gigafactory in Burnaby, BC—commissioned May 2025 as the world's first
              commercial-scale MOF sorbent filter manufacturing facility—can equip plants to capture up to 10 million
              tonnes of CO₂ annually. However, manufacturing capacity alone does not guarantee commercial performance:
              every actual capture installation remains a first-of-a-kind brownfield integration at an industrial host
              site. The Southeast U.S. BECCS project (>500,000 tonnes per year, paper-mill recovery boiler) was still in
              feasibility study phase as of March 2026, with engineering, cost-schedule estimates, and risk assessments
              ongoing before any final investment decision.

              FOAK projects across the broader CCUS industry have a well-documented history of cost overruns, schedule
              delays, and performance shortfalls. Approximately 42 FOAK clean-energy projects were cancelled in the U.S.
              in 2025. The UK Public Accounts Committee (2025) noted that there are no examples of CCUS technology
              operating at commercial scale in the UK and that international examples show government performance
              expectations "are far from guaranteed." IEEFA's January 2026 EU Parliament presentation documented that
              the IEA has downgraded its CCS contribution estimates by over 82% between WEO 2021 and WEO 2025 as
              repeated underperformance recalibrated projections. IEEFA analysis of 16 operational projects found that
              no existing project has consistently captured more than 80% of CO₂ year-in, year-out—despite industry
              claims of 95% achievable rates. The Boundary Dam project in Saskatchewan never exceeded 60% capture rates.
              Common FOAK failure modes include unanticipated integration challenges (thermal management, pressure
              dynamics, cycling losses), sorbent degradation, and contractor delays at brownfield industrial sites.
              Svante's modular rotary-contactor design partially mitigates these risks—modularity correlates with lower
              cost overruns in comparative climate-tech data—but cannot eliminate FOAK execution uncertainty. The
              FOAK-to-NOAK learning curve depends on early project success, making the Södra pilot (Sweden) and U.S.
              BECCS project disproportionately important validation events for subsequent pipeline acceleration.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
