      - number: '5.4'
        title: Manufacturing and Supply Chain
        blocks:
          - type: paragraph
            body: >
              In May 2025, Svante officially commissioned the Redwood Facility — a 141,000-square-foot Centre of
              Excellence for Carbon Capture and Removal — in Burnaby, British Columbia. Built with a US$145 million
              capital investment and backed by strategic investors including Chevron New Energies, Temasek, M&G, Canada
              Growth Fund, United Airlines Ventures, Samsung, and GE Vernova, Redwood is the world's first commercial
              gigafactory for carbon capture filters, capable of producing enough solid sorbent-based filters to support
              capture of up to 10 million tonnes of CO₂ annually. The filter production process relies on Svante's
              roll-to-roll "Sorbent on a Roll" coating process, in which CALF-20 MOF sorbent is coated at high volume
              and low cost onto sheets of laminate, which are then stacked into high-performance filter modules. BASF
              entered a commercial supply agreement with Svante in October 2023 to produce CALF-20 at industrial scale
              (several hundred tonnes per year) — the first time MOFs had been manufactured at such scale commercially —
              using a low-temperature green chemistry process. To manage capacity demand from the Climeworks DAC supply
              agreement, Svante also secured additional roll-to-roll coating capacity with 3M as a secondary supplier.
              SAMSUNG E&A serves as the exclusive engineering, procurement, and fabrication (EPF) partner for C-READY
              skid-mounted modules, while Svante supplies the contactor machines and filter beds.
            claimRefs:
              - CE011
