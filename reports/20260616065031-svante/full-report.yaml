      - number: '1.4'
        title: Funding History and Investor Base
        blocks:
          - type: paragraph
            body: >
              Svante has raised over US$600 million in total capital across multiple rounds since its 2007 founding,
              making it one of the most heavily capitalized industrial carbon capture technology companies globally.
              Series A and B rounds were backed by Roda Group, Mitsui, Chevron Technology Ventures, and Chrysalix. A
              Series C round was led by OGCI Climate Investment. The Series D round closed in 2021, led by Suncor and
              Temasek. The landmark Series E round closed on December 15, 2022 at US$318 million — the largest reported
              financing of a point-source carbon capture technology company globally at that time — led by Chevron New
              Energies and joined by Temasek, OGCI Climate Investments, Delek US, Hesta AG, 3M Ventures, GE Vernova,
              Japan Energy Fund, Liberty Media, M&G Catalyst, Samsung Engineering, TechEnergy Ventures, Full Circle
              Capital, and United Airlines Ventures. J.P. Morgan Securities LLC served as lead placement agent and RBC
              Capital Markets as co-lead. In August 2024, the Canada Growth Fund Inc. (CGF) committed up to US$100
              million (approximately C$137 million) in convertible notes in two tranches of US$50 million each — CGF's
              first investment in British Columbia. InBC Investment Corp., the provincial venture fund, has also
              invested C$15 million. A separate US$145 million capital commitment was made for the Redwood manufacturing
              facility. The company's post-money valuation after any of these rounds has not been publicly disclosed.
