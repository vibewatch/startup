      - number: '7.4'
        title: Financial, Concentration, and Capital Risk
        blocks:
          - type: paragraph
            body: >-
              Svante has raised approximately $493 million USD from 32 institutional investors, with the Canada Growth
              Fund's convertible note (up to US$100M, tranched at $50M + $50M) and InBC CDN$15M investment as the most
              recent capital injections. Capital intensity is extreme: the Redwood gigafactory required $145 million;
              each FOAK commercial plant requires project financing in the hundreds of millions before generating carbon
              credit revenue. The CGF convertible note is structured to absorb policy and market risk through
              contract-for-difference instruments that pay Svante the difference between the market carbon price and a
              contracted strike price—but the second $50M tranche is conditioned on project progress, creating
              refinancing exposure if early FOAK projects underperform or Canadian carbon credit markets experience the
              oversupply risk identified in the IISD's 2025 carbon pricing review.

              Concentration risk is material: Chevron led the Series E ($318M round) and is both the lead investor and
              primary industrial pilot host (Kern River, California). Oil companies including Equinor and Shell have
              already reduced their low-carbon spending under shareholder pressure, illustrating the risk that Chevron
              could similarly reduce its CCS commitment. The DOE funding contraction ($7.56B in terminated awards in
              October 2025) eliminated a key ecosystem support mechanism. Without ongoing government cost-share, FOAK
              project developers face greater reliance on private capital at higher risk premiums. IEEFA documented that
              operating costs at Canadian CCS projects increase at roughly twice the rate of captured CO₂, raising the
              specter of permanent subsidy dependency. The True North Institute's 2025 FOAK case-study review found that
              historically, government grants were a critical pillar alongside VC and corporate offtake; with DOE cuts,
              Svante faces a deeper "valley of death" for project financing and must rely more heavily on private equity
              and infrastructure fund syndicates.
