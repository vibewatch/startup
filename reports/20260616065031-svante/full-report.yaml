      - number: '3.5'
        title: Competitive Moat and Risk Factors
        blocks:
          - type: paragraph
            body: >
              Svante's competitive moat rests on four pillars: (1) proprietary CALF-20 MOF IP and solid sorbent
              manufacturing know-how; (2) the world's first filter gigafactory in Vancouver capable of producing filters
              to capture 10 million tonnes of CO₂ per year; (3) the C-READY modular product with Samsung E&A as the
              exclusive skid fabricator; and (4) the BASF OASE blue partnership for low-CO₂-concentration applications.

              The most significant threats to these moats are: first, Carbon Clean's CycloneCC, which targets under
              $30/tonne and TRL 8+ commercialisation—a cost level that, if validated, would reframe the economics of all
              industrial CCS; second, the US DOE's cancellation of over $3.7 billion in CCS grants following the Trump
              administration's rollback of clean energy policy, which has stalled multiple Svante project partners in
              the US; third, the risk that solid sorbent long-term durability and regeneration cycle performance may not
              hold across diverse industrial flue gas compositions without further commercial validation; and fourth,
              the structural advantage that amine-based incumbents possess via installed base, service contracts, and
              customer lock-in at existing capture sites.

              Switching costs in industrial CCS are material: retrofitting a capture unit requires deep integration with
              site flue gas infrastructure, heat recovery, and utilities, creating inertia that advantages the incumbent
              vendor—whether liquid amine or, eventually, Svante's own installed base. Multi-homing (running two capture
              systems in parallel) is economically infeasible at industrial scale, so first-mover advantage on a given
              site is largely exclusive. Svante's manufacturing-first strategy—building gigafactory capacity before
              signing large contracts—is intended to pre-empt competitors on delivery speed and cost certainty, but it
              creates near-term balance sheet risk if project demand lags production capacity ramp.
            claimRefs:
