  - id: FE001
    title: Svante Product Technology Stack — From Sorbent to Capture Plant
    type: stack
    layout: standard
    summary: >
      Five-layer architecture showing how Svante's technology elements integrate from the base CALF-20 MOF sorbent
      material up through filters, the rotary adsorption machine, the balance of plant, and the complete integrated
      project delivery offering (C-READY).
    data:
      layers:
        - label: Layer 1 — Solid Sorbent (CALF-20 MOF)
          detail: >-
            Zn-based MOF; high CO₂ selectivity over N₂ and H₂O; physisorption; BASF commercial supply; Nobel-recognized
            chemistry
        - label: Layer 2 — Structured Adsorbent Filters (SABs)
          detail: >-
            CALF-20 coated via Sorbent on a Roll (roll-to-roll process); laminate stacks form filter modules; Redwood
            gigafactory (10 Mtpy CO₂); 3M secondary coating
        - label: Layer 3 — Rotary Adsorption Machine (RAM)
          detail: >-
            URSA 1000 (~500 TPD) and URSA 2000 (~2000 TPD); ~60-second adsorption-regeneration cycle; low-pressure steam
            regeneration; continuous operation
        - label: Layer 4 — Balance of Plant / Pre-treatment
          detail: >-
            DCC (cooling to <50°C), wet scrubber (SOx/particles), guard bed, auxiliary boiler (steam), CO₂ purification
            (catalytic oxidation / cryogenic), compression to pipeline pressure
        - label: Layer 5 — Integrated Plant and Project Delivery
          detail: >-
            C-READY skid-mounted modular plant (SAMSUNG E&A EPC/EPF); Svante Development co-investment model; OASE blue
            liquid amine for <12% CO₂ streams; digital EDP integration
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE006
      - CE014
      - CE021
  - id: FE002
    title: VeloxoTherm Customer Workflow — From Flue Gas to Pipeline CO₂
    type: flow
    layout: wide
    summary: >
      Five-step operating flow showing how Svante's capture system processes industrial flue gas from the emission
      source through pre-treatment, adsorption, purification, and final pipeline-grade CO₂ delivery.
    data:
      nodes:
        - id: flue-gas-source
          label: Industrial Flue Gas Source
          detail: >-
            Cement kiln, SMR H₂ plant, FCC unit, recovery boiler, or DAC ambient air; CO₂ concentration 4–30% depending
            on sector
        - id: pretreatment
          label: Pre-treatment System
          detail: >-
            Direct contact cooler cools gas to <50°C; wet scrubber removes SOx/particles; guard bed removes residual
            contaminants; meets RAM feed specs (SOx ≤1.5 ppm, PM ≤0.2 mg/m³)
        - id: ram
          label: Rotary Adsorption Machine (RAM)
          detail: >-
            CALF-20 SABs adsorb CO₂ in adsorption zone; low-pressure steam regenerates sorbent in ~60-sec cycle;
            concentrated CO₂ stream exits; cleaned flue gas exits vent stack
        - id: purification
          label: CO₂ Purification and Compression
          detail: >-
            Catalytic oxidation yields >95% CO₂ purity; cryogenic distillation option yields ≤99.9%; CO₂ compressed to
            pipeline pressure (≥2,200 psia in Linde FEED design)
        - id: co2-product
          label: Pipeline-Grade CO₂ Delivery
          detail: >-
            ≥95% purity CO₂ for geological sequestration, e-fuels, CO₂-injected concrete, or CDR credit generation; no
            hazardous secondary emissions
      edges:
        - from: flue-gas-source
          to: pretreatment
          label: Raw flue gas
        - from: pretreatment
          to: ram
          label: Pre-conditioned feed (≤50°C, impurities removed)
        - from: ram
          to: purification
          label: Concentrated CO₂ stream (~60-sec cycle product)
        - from: purification
          to: co2-product
          label: Pipeline-grade CO₂ (≥95% purity, compressed)
    claimRefs:
      - CE003
      - CE007
      - CE010
      - CE031
      - CE033
      - CE036
