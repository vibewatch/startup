      - number: '4.4'
        title: Manufacturing Capital Intensity and Cost Structure
        blocks:
          - type: paragraph
            body: >-
              The Burnaby Redwood facility represents Svante's single largest capital commitment and the physical
              foundation of its commercialization strategy. Svante invested US$145M (C$198.65M) in the 141,000 sq. ft.
