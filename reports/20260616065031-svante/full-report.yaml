      - number: '1.2'
        title: Founding History and Technology
        blocks:
          - type: paragraph
            body: >
              Svante was founded in 2007 in a Burnaby, British Columbia garage by four professionals from the gas
              purification and separation industry: Brett Henkel, André Boulet, Darryl Wolanski, and Soheil Khiavi.
              Brett Henkel, who serves as co-founder and VP of Strategic Accounts and Government Affairs, drew on prior
              experience at QuestAir Technologies. The company secured early R&D funding through Series A and B rounds
              from Roda Group, Mitsui, Chevron Technology Ventures (which made its initial investment in 2014), and
              Chrysalix, as well as bench-scale project funding from the Canadian and UK governments and the Province of
              Alberta. Nobel Laureate and former U.S. Secretary of Energy Steven Chu joined the board during the early
              phase, providing scientific and policy credibility. The company's critical technological breakthrough is
              the use of MOF nanomaterials — specifically CALF-20, whose inventors received the Nobel Prize in Chemistry
              in 2025 — as solid sorbents coated onto laminate filter sheets. Filters are produced via an automated
              roll-to-roll manufacturing process analogous to thin-film battery production. In 2019, a 30 tonne-per-day
              (TPD) CO₂ capture pilot plant came online in Saskatchewan in collaboration with Cenovus (formerly Husky
              Energy), and the CO₂MENT pilot at the Lafarge cement plant in Richmond, BC captured one tonne per day. In
              May 2025, Svante officially commissioned the Redwood Facility — a 141,000-square-foot Centre of Excellence
              in Burnaby, BC — as the world's first commercial manufacturing plant for solid sorbent-based carbon
              capture filters, with annual capacity to produce filters for capturing up to 10 million tonnes of CO₂.
