      - number: '7.3'
        title: Storage, Transport, and Customer-Adoption Dependency
        blocks:
          - type: paragraph
            body: >-
              Svante is an integrated capture technology and project developer, but depends entirely on third-party CO₂
              transport infrastructure and geologic storage operators to complete the value chain for BECCS projects.
              The Southeast U.S. BECCS project targets permanent geologic CO₂ storage in the Gulf Coast region under
              Class VI permits. Storage permitting timelines of two or more years—even with state primacy offering
              faster paths—mean that storage readiness is the critical-path constraint for project FIDs. The entire CCUS
              value chain faces a structural cost gap: storing a metric ton of CO₂ currently costs $150–$220 while the
              EU ETS carbon price sits at approximately $52/tonne, leaving a gap of $100–$170/tonne that can only be
              bridged by subsidies, tax credits, or voluntary carbon credit revenue. Sustainableatlas.org notes that the
              class VI permitting bottleneck means "fewer than a dozen Class VI permits had been issued despite hundreds
              of applications" through early 2026.

              Customer adoption timing risk is acute because Svante's revenue model depends on industrial customers
              (pulp and paper, cement, hydrogen, ethanol) committing to capital-intensive retrofit projects with
              multi-year development horizons. Voluntary carbon market demand for high-quality CDR credits is growing
              but concentrated among a handful of technology-company buyers (Microsoft, Frontier Advance Market
              Commitment); offtake pricing remains highly variable, creating revenue uncertainty for BECCS projects. CDR
              credits from the U.S. BECCS project are "intended for sale to organizations aiming to address their Scope
              1 and Scope 2 emissions," creating direct exposure to VCM demand cycles. CO₂ pipeline routing faces
              escalating legal opposition: South Dakota banned eminent domain for CO₂ pipelines; Iowa was considering
              similar legislation; and California bans intrastate CO₂ pipelines pending PHMSA safety rule finalization.
              British Columbia's regulatory framework under the Petroleum and Natural Gas Act (Part 14) requires a
              separate storage reservoir licence from BC's Ministry, adding a Canadian regulatory dependency for
              Svante's domestic projects.
