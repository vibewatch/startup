  - id: TM004
    title: 'Growth Drivers and Adoption Constraints: Industrial CCS'
    columns:
      - Factor
      - Direction
      - Timing
      - Implication for Svante
      - Diligence Ask
    rows:
      - - US 45Q tax credit ($85/t industrial, $180/t DAC)
        - Driver (strong)
        - Current (12-yr window from commissioning)
        - Transforms project economics; makes many plants cash-flow positive; directly bankable
        - How does Svante structure 45Q in its commercial agreements? Who claims the credit?
      - - Canada OBPS carbon price ($95/t CAD, rising)
        - Driver (moderate)
        - Current and rising (to $100/t by 2027–29, $115/t by 2030)
        - Strengthens avoided-cost signal for Alberta and BC industrial plants
        - Do Svante customer contracts reference OBPS compliance value or use shadow carbon pricing?
      - - EU ETS carbon price (~€70–75/t in 2026)
        - Driver (moderate, partial)
        - Current but volatile; meaningful only if sustained above €105/t for CCUS breakeven
        - Below breakeven for full end-to-end CCUS cost; subsidy bridge still required for EU projects
        - What is the EU project pipeline sensitivity to EUA price scenarios?
      - - EU CBAM phase-in (steel, cement, chemicals 2026+)
        - Driver (structural)
        - Multi-year phase-in (2026–2034)
        - Forces European hard-to-abate exporters toward low-carbon pathways including CCS
        - Do Svante's EU-adjacent pipeline projects benefit from CBAM pricing signals?
      - - EU Net-Zero Industry Act (50 Mtpa storage mandate by 2030)
        - Driver (structural)
        - Policy in force; 2030 deadline
        - Stimulates European storage infrastructure build-out reducing a key constraint
        - What shared storage hubs are accessible for Svante's European target customers?
      - - CO2 transport & storage infrastructure access
        - Constraint (hard gate)
        - Current; improving slowly
        - Without storage partner, projects cannot reach FID regardless of capture economics
        - Which storage partnerships are Svante customers actively pursuing? Northern Lights pipeline timeline?
      - - EPA Class VI permitting bottleneck (3–6 yr historically)
        - Constraint (material)
        - Current; modest improvement in 2026 (~3 permits/quarter vs. 8 in 13 years prior)
        - Delays US industrial CCS; projects in primacy states (TX, WY, ND, LA) can move faster
        - Are Svante's North American target plants located in primacy states or EPA-reviewed jurisdictions?
      - - FOAK capital intensity & financing risk
        - Constraint (material)
        - Current; first movers bear highest risk
        - >-
          Svante's modular filter approach may reduce capex per project vs. large solvent systems, but FID still
          requires grant+credit+debt stack
        - What is Svante's typical capex range per plant? What portion is government-funded?
      - - IEA/analyst divergence on CCUS role in net-zero
        - Constraint (reputation)
        - Ongoing; IEA WEO 2025 downgraded CCUS share
        - Investor skepticism may increase cost of capital for CCUS projects without strong policy backstop
        - How does Svante respond to the IEA's minimal-role-for-CCUS narrative in sales materials?
      - - Bespoke project design (no modular learning curve)
        - Constraint (structural)
        - Ongoing
        - Cost reduction slower than solar PV or batteries; each site requires custom engineering
        - Does Svante's standardized filter-block architecture address bespoke nature of competitors?
    notes: >-
      Direction ratings (driver/constraint) and timing are qualitative assessments from public evidence. Financial
      figures for 45Q, OBPS, and ETS from official/regulatory sources; cost breakeven estimates from IEEFA and Agora
      Industry research.
