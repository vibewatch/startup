      - number: '1.3'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >
              Claude Letourneau has served as President and CEO of Svante since 2017. He brings over three decades of
              industrial technology commercialization experience, including prior roles as Senior VP at SNC-Lavalin
              (North America, Mining and Metals), Senior VP at Canam Group (Integrated Lean Project Delivery), and
              founder of two technology startups — Vaperma Inc. (membrane-based gas separation) and Avestor Inc.
              (thin-film lithium polymer batteries). He holds a Bachelor and Master of Engineering in Chemical
              Engineering from Université Laval and has been named among the Wall Street Journal CEO Council's "World's
              Most Influential Decision Makers." In May 2026, Svante appointed Terry Lefebvre as Chief Financial
              Officer, described as a seasoned finance and transformation leader. Brett Henkel remains active as
              co-founder and VP of Strategic Accounts and Government Affairs. Matt Stevenson serves as Chief Revenue
              Officer, having led the Mercer and pulp and paper BECCS pipeline. Scott Gardner is President of Svante
              Development Inc., the project co-development subsidiary. Nobel Laureate and former U.S. Secretary of
              Energy Steven Chu has served on the board of directors — a notable governance signal. The 2026 corporate
              deck shows ownership structure: approximately 38% management and common shareholders, 43% other industrial
              strategics, 6% institutional financials and venture capital, and 13% energy strategics, on a fully diluted
              basis (excluding convertible note conversion). Full board composition beyond publicly confirmed members
              has not been disclosed.
