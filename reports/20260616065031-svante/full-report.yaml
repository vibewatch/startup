            title: SAM Estimate Relies on Sector-Share Assumptions Not Validated by Primary Data
            body: >-
              The SAM for Svante's modular solid-sorbent platform within the global CCS market is estimated by applying
              a 40–50% hard-to-abate industrial share (from WEF and GCCSI sector analyses) to analyst TAM figures. No
              analyst report specifically sizes the modular solid-sorbent retrofit market for industrial facilities in
              North America. This estimate should be treated as a preliminary bound pending primary market research and
              customer pipeline data from Svante.
            calloutType: assumption
            claimRefs:
              - CM007
              - CM025
          - type: callout
            title: IEA WEO 2025 Downgrade of CCUS Role Is a Material Adverse Signal
            body: >-
              The IEA's World Energy Outlook 2025 assigns CCUS at most 4.9% of cumulative emissions reductions by
              2050—down from 13% in WEO 2021. This declining trajectory reflects increasingly competitive renewables and
              electrification economics. IEEFA separately calculates that EU end-to-end CCUS disposal costs
              (€105–280/tonne) exceed EU ETS prices in all but one quarter since 2019. These findings do not preclude
              Svante's market opportunity, which is driven by compliance mandates and 45Q/OBPS economics rather than
              carbon market prices alone, but they warrant scrutiny of long-term market size assumptions.
