      - number: '5.7'
        title: Trust, Safety, Environmental Testing, and Quality
        blocks:
          - type: paragraph
            body: >
              Svante has conducted targeted environmental and safety testing of the CALF-20 system in real-world
              industrial conditions. At the CO₂MENT cement plant pilot, chemical analysis using ESI-MS and FTIR found no
              detectable nitramine or nitrosamine compounds in the CALF-20 laminate matrix after extended exposure to
              NOx-laden cement flue gas, confirming the absence of the toxic secondary emissions that have been a known
              risk in amine-based systems. The Linde SMR pre-FEED DOE study included a formal Environmental, Health and
              Safety (EH&S) Risk Assessment and Hazard Identification (HAZID) study covering emissions, effluents, and
              structured adsorbent toxicology. The Chevron Kern River project, conducted under DOE Cooperative Agreement
              DE-FE0031944, was subject to DOE compliance requirements and produced a comprehensive gap analysis and
              techno-economic analysis. Svante's CO₂ product is specified at ≥95% purity, meeting pipeline-grade
              standards for transport and sequestration. The company has not publicly disclosed ISO certifications or
              third-party quality management system audits as of the run date, leaving formal quality assurance
              infrastructure transparency as an open diligence item for prospective customers and project finance
              counterparties.
