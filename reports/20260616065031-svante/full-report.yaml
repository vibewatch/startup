      - number: '7.5'
        title: Mitigations, Monitoring Indicators, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Svante has implemented several structural mitigations: the BASF commercial supply agreement for CALF-20
              MOF materials secures the most critical raw-material input and reduces single-sourcing exposure; the
              Redwood gigafactory's high-volume automation and product standardization is designed to reduce
              manufacturing-cost variability; the CGF contract-for-difference instruments absorb carbon-price downside
              for Canadian projects; and a diversified investor roster (Chevron, Temasek, M&G, CGF, United Airlines,
              Samsung, GE Vernova, InBC) dilutes concentration somewhat. The U.S. BECCS feasibility phase—co-funded by
              Svante Development Inc.—explicitly includes risk assessments, cost-schedule estimation, and
              plant-integration planning before FID, implementing the "crawl-walk-run" de-risking principle that
              correlates with lower cost overruns in modular FOAK technologies.

              Key monitoring indicators include: (1) Södra pilot and U.S. BECCS feasibility capture-rate results; (2)
              Class VI permit status for Gulf Coast storage sites; (3) real value of 45Q relative to project
              construction costs; (4) Chevron's stated carbon capture investment commitments; (5) voluntary CDR credit
              prices; and (6) Canadian carbon credit market pricing vs. CGF CfD strike price. Thesis-break triggers
              include: 45Q credit repeal or reduction below $70/tonne effective value; extended DOE funding freeze
              preventing demonstration projects; Chevron divesting its Svante stake; failure to secure a Class VI
              storage partner before mid-2027 for the U.S. BECCS project; FOAK plant capture rates persistently below
              70% of design specification; MOF sorbent supply disruption from BASF; or Canadian OBPS/TIER credit
              oversupply pushing prices below the CGF CfD floor. The FactSet analysis notes that OBBBA's parity between
              geologic storage and EOR for 45Q credits provides a partial mitigation by offering Svante project
              developers greater flexibility in CO₂ disposition and potentially eliminating the need for lengthy Class
              VI permitting if EOR offtake partners are available.
