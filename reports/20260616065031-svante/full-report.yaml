      - number: '5.6'
        title: Deployment, Integration, and Roadmap
        blocks:
          - type: paragraph
            body: >
              Svante has executed or is executing a multi-stage deployment roadmap spanning pilot, pre-FEED, and
              commercial-scale projects across multiple industrial sectors. The CO₂MENT pilot at Lafarge Canada's
              Richmond cement plant (250 TPY, operating since 2019) has accumulated over 4,000 hours of operation across
              three phases: pre-treatment validation, CO₂ capture, and CO₂ utilization (conversion to synfuels and
              CO₂-injected concrete). The Chevron Kern River DOE pilot (25 TPD, October 2020–August 2024, $23.4M total
              funding) validated steady-state operation across 4–14% CO₂ concentration flue gas and produced a gap
              analysis for scale-up to NGCC applications. The Linde SMR pre-FEED study (DOE Award DE-FE0032113, $1.9M)
              defined the design basis for a 1.436 Mtpy commercial plant at Port Arthur, Texas, with CAPEX estimated at
              $512M–$656M. At Delek US's Big Spring, Texas refinery, Svante and Delek are advancing a DOE-co-funded
              project (up to $95M) targeting 145,000 TPY from an FCC unit, with operations targeted for 2027–2028. In
              early 2026, Svante deployed its first EU pilot at Södra's Värö pulp mill in Sweden — evaluating biogenic
              CO₂ capture of up to 1 million TPY — with RISE as research partner and EU Industriklivet funding. Svante's
              stated ambition is to deploy up to 100 commercial plants per year by the latter part of this decade,
              enabled by Redwood's filter production capacity and the C-READY standardized modular plant offering.
