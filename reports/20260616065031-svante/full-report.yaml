              to support carbon capture facilities removing 10 million tonnes of CO2 per year — equivalent to
              approximately 27 million passenger vehicles.

              Svante's CEO has publicly stated that point-source carbon capture using Svante technology costs
              approximately US$150 per tonne, with higher concentrations of CO2 in industrial flue gas (e.g., pulp
              mills, ethanol plants) yielding lower costs. The BIV characterized the range as "less than $250 per tonne"
              for point-source capture. No gross margin figures, OPEX per unit, or manufacturing cost-per-filter data
              are publicly disclosed. Working capital dynamics are opaque: Svante has not disclosed receivables,
              inventory, or payables characteristics, though the capital-intensive manufacturing model implies material
              upfront investment ahead of project revenue.

              The manufacturing facility was funded by the Series E proceeds and supported by the CGF convertible note.
              Key strategic investors — Chevron New Energies, Temasek, M&G, CGF, United Airlines Ventures, Samsung, and
              GE Vernova — contributed directly to the facility's financing. The Burnaby facility creates both a
