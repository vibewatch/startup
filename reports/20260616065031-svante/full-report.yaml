      - number: '1.5'
        title: Milestones and Commercial Progress
        blocks:
          - type: paragraph
            body: >
              Svante's milestone arc runs from an R&D garage startup in 2007 through a commissioned commercial-scale
              filter manufacturing facility in 2025 and its first major carbon removal offtake agreement in April 2026.
              Key commercial partnerships include a Chevron Kern River pilot backed by U.S. DOE grant DE-FE0031944, the
              CO₂MENT pilot at the Lafarge Richmond cement plant, a Pre-FEED (FEL-2) stage project with Mercer
              International at the Peace River pulp mill in Alberta (April 2025), and a FEED-ready project at Delek US's
              Big Spring Refinery in Texas. In March 2026, Svante acquired Calgary-based Carbon Alpha Corporation,
              including ownership interests in North Star Carbon Solutions — a BECCS project in Saskatchewan developed
              in partnership with the Meadow Lake Tribal Council (MLTC), representing nine First Nations. MLTC will
              co-own the BECCS facility. Phase 1 of North Star will capture up to 140,000 tonnes of CO₂ per year from
              the MLTC Bioenergy Centre; FID is expected Q1-2027. In April 2026, Microsoft agreed to purchase 626,000
              tonnes of CDR credits over 15 years from North Star — Microsoft's first Canadian BECCS CDR offtake
              agreement, and believed to be the first in Canada involving Indigenous ownership. Commercial operations at
              North Star are planned for early 2029. In 2025, Svante launched three new business units (OEM&D,
              Development Company, Solutions & Digital Services) and announced a joint prefabricated modular solution
              ("CREADY") with SAMSUNG E&A. The company was inducted into the Global Cleantech 100 Hall of Fame in 2025
              and ranked in TIME & Statista's Top 100 Greentech Companies of 2025.
