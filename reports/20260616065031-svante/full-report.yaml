      - number: '2.3'
        title: Hard-to-Abate Sector Demand Verticals
        blocks:
          - type: paragraph
            body: >-
              Cement and lime represent the most strategically important sector for industrial CCS given the irreducible
              calcination emission—about 60% of the sector's CO2—that cannot be addressed by fuel-switching. The sector
              produces ~4 billion tonnes of cement annually (2024), accounting for ~8% of global CO2 emissions.
              Heidelberg Materials inaugurated the world's first industrial-scale cement CCS facility (Brevik, Norway)
              in June 2025—capturing ~400,000 t CO2/yr (50% of plant emissions) using SLB Capturi amine-based solvent
              technology. However, this milestone required Norwegian government funding exceeding 80% of capex and
              75–100% of eligible opex for 10 years under the Longship program. LeadIT's May 2026 Green Cement
              Technology Tracker maps 175+ cement CCS projects globally but projects less than 2% of sector CO2 captured
              by 2035—a striking shortfall illustrating the gap between project announcements and project completions.
              Project stalls at Holcim (Obourg, Belgium) and Heidelberg (Slite, Sweden) were directly linked to
              government funding failures.


              Pulp and paper is Svante's most active current commercial sector: boiler flue gas from biomass combustion
              provides a moderately concentrated CO2 stream suitable for retrofit capture; if the CO2 is biogenic,
              capture and storage generates BECCS credits eligible for premium CDR markets. Svante's Mercer
              International Alberta project targets this segment. BECCS globally exceeded DAC in project development
              capacity for the first time in 2025 (S&P Global), reflecting growing investor conviction in biogenic
              capture economics. Steel presents a medium-term opportunity: blast-furnace routes emit 2.0–2.2 t CO2/tonne
              of steel; DRI with natural-gas and CCS can reduce to ~0.6 t CO2/tonne, and EU CBAM's phase-in is beginning
              to put cost pressure on conventional steel exports to Europe. Hydrogen production (SMR + CCS) and
              chemicals/waste-to-energy round out the near-term TAM. The IEA confirms that more than half of new CCUS
              projects becoming operational by 2030 target hydrogen production, CDR, or hard-to-abate industrial
              sectors, marking a structural shift from legacy natural gas processing dominance.
