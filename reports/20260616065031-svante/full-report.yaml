      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Information Asymmetry Is the Core Valuation Risk
            body: >-
              The most significant risk for any investor in Svante today is not technology risk or policy risk — it is
              information asymmetry. No post-money valuation has been publicly confirmed, no audited financials exist,
              CGF convertible note terms are opaque, and the preference stack spanning 30+ investors across 18+ rounds
              is entirely undisclosed. This asymmetry makes it impossible to model common-equity dilution, liquidation
              waterfall, or return sensitivity to entry price. The US$800M–$1.2B base-case range is directionally
              supported by transaction comparables and third-party data, but cannot be confirmed or narrowed without
              financial disclosure.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV022
              - CV023
              - CV024
              - CV040
          - type: callout
            title: Transaction Comp Precedent Validates Technology Platform Premium
            body: >-
              The 2023 Oxy/Carbon Engineering deal at US$1.1B for a pre-revenue Canadian carbon-capture technology
              platform provides the most directly comparable exit anchor. Carbon Engineering had raised approximately
              US$110M before acquisition, implying roughly a 10x MOIC for early investors. If Svante replicates this
              exit profile on its US$600M+ raise, a US$1.5–2B acquisition premium would be required — significantly
              above current implied values. The precedent also confirms that at least one major oil major (Occidental)
              is willing to pay a strategic premium for platform control of carbon-capture IP.
            calloutType: strength
            claimRefs:
              - CV009
              - CV010
              - CV028
              - CV036
          - type: callout
            title: Base-Case Valuation Assumes No Material Preference Overhang
            body: >-
              The US$800M–$1.2B base-case enterprise value range does not account for potential liquidation preferences
              embedded in 18+ funding rounds. If Series E and earlier preferred shares carry standard 1.5–2x liquidation
              preferences, the common equity payout at a US$1B exit could be materially impaired. This is a structural
              assumption; actual preference terms are undisclosed. New investors should treat the base-case EV range as
              a total-enterprise-value estimate, not a common-equity value.
            calloutType: assumption
            claimRefs:
              - CV022
              - CV024
              - CV041
