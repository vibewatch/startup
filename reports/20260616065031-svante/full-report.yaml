      - number: '2.6'
        title: Adoption Constraints, Risk Factors, and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              Several material constraints throttle adoption despite favorable policy tailwinds. First, CO2 storage and
              transport access is a hard gate: as LeadIT confirms, every advancing industrial CCS project connects to
              shared CO2 infrastructure, and without a storage-partner contract, projects cannot proceed regardless of
              other conditions. In the US, CO2 injection requires EPA Class VI well permits that historically took 3–6
              years; only 8 were approved in 13 years prior to 2025. Although Class VI approvals accelerated in Q1 2026
              (3 permits in one quarter matching all of 2025), 106 applications remained under review covering 387 wells
              as of end-Q1 2026. Enverus forecasts US Class VI injection capacity exceeding 100 Mtpa by end-2027 and 300
              Mtpa by 2030—but this remains pipeline-dependent and subject to schedule extensions.


              Second, FOAK capital intensity is severe: the Brevik CCS project for cement required >80% state funding;
              European industrial CCS costs range €105–280/tonne end-to-end, well above current ETS prices. Dow's delay
              of its Path2Zero Canada project to 2029 signals that even policy-friendly jurisdictions see industrial CCS
              projects pause when corporate capital cycles tighten. Third, CCUS systems are bespoke rather than modular:
              each project is tailored to specific flue-gas composition, plant layout, and storage access—limiting
              learning-curve cost declines and making cost projections unreliable. IEA's WEO 2025 assigns CCUS a maximum
              4.9% contribution to cumulative emissions reductions by 2050 (down from 13% in 2021), reflecting the
              rising competitiveness of renewables and electrification as direct alternatives. IEEFA separately notes
              that end-to-end EU disposal costs require sustained carbon prices at or above €105/tonne to break even—a
              level hit only once (February 2023). These are material adverse signals that must constrain optimistic
              market projections for Svante's SAM.
