      - number: '2.5'
        title: Market Growth Drivers
        blocks:
          - type: paragraph
            body: >-
              The most durable market drivers are regulatory and policy-based. In North America: the US 45Q tax credit
              (updated by IRA 2022 and OBBBA 2025) pays $85/tonne for industrial point-source CCS and $180/tonne for
              DAC, available for 12 years from equipment commissioning, with construction start deadline of January 1,
              2033. This credit can be transferred or monetized via direct pay, transforming it into bankable project
              finance revenue. Canada's federal OBPS (Output-Based Pricing System) sets a $95/tonne CO2e (CAD) carbon
              price for large industrial emitters in 2026, providing a clear avoided-cost signal for CCS. In Europe: EU
              ETS EUA prices stabilized around €70–75/tonne in early 2026 (below the €105–280/tonne estimated full
              disposal cost range), but the CBAM phase-in is strengthening the price signal for hard-to-abate sectors.
              The EU Net-Zero Industry Act mandates at least 50 Mtpa CO2 storage capacity in Europe by 2030—creating
              regulatory demand pull. Germany's €6B industrial decarbonization package, starting mid-2026, will fund CCS
              deployment.


              Demand drivers include: rising corporate net-zero commitments driving willingness to pay green premiums
              (Microsoft's 626,000-tonne BECCS off-take from Svante/MLTC is a marquee example from chapter 1);
              tech-sector "clean firm" energy demand enabling new CCUS-backed power purchase models (Google's 400 MW PPA
              with Broadwing Energy); BECCS scaling for CDR credit generation; and Chinese state policy treating CCUS as
              a strategic industrial technology. Investment has tripled to ~$6.4B globally by 2024 according to
              CarbonHerald, and the IEA estimates >$15B in commercial debt raised for CCUS projects recently. The 45Q
              credit's estimated total policy value exceeds $30B in committed US government support.
