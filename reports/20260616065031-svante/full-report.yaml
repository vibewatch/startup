  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Industrial CCS Competitive Landscape
        blocks:
          - type: paragraph
            body: >
              Svante Technologies enters commercial deployment in 2026 as the most differentiated modular solid sorbent
              point-source carbon capture company globally, but it does so against a backdrop of incumbent liquid amine
              providers that collectively operate hundreds of commercial plants and have decades of customer
              relationships across the same hard-to-abate sectors. The competitive landscape can be segmented into five
              distinct categories: (1) large-scale liquid amine technology licensors such as MHI/Kansai and Linde/BASF
              with 18–60+ commercial plant references; (2) modular amine providers such as SLB Capturi (Just Catch) and
              Carbon Clean (CycloneCC) that pursue rapid deployment at smaller footprints; (3) Svante's own modular
              solid sorbent segment, where CALF-20 MOF filters offer lower energy penalties and avoid liquid amine
              handling; (4) large-format liquid-solvent direct air capture (DAC) from Carbon Engineering/Oxy operating
              the Stratos plant in Texas; and (5) modular solid-sorbent DAC from CarbonCapture Inc. and Climeworks,
              which target atmospheric CO₂ removal rather than industrial point-source emissions. Svante is the only
              player that spans both industrial point-source and DAC with a single solid sorbent filter technology,
              giving it optionality but also requiring it to compete across multiple segments simultaneously. The
              distinction between modular solid sorbent capture and amine-based systems is strategically important:
              liquid amine systems require solvent storage, reclaiming infrastructure, and continuous steam
              regeneration, while Svante's CALF-20 rapid temperature-swing adsorption operates without bulk liquid
              chemicals, reducing site complexity and potentially enabling faster permitting in some jurisdictions.
              However, solid sorbent systems are best suited for CO₂ concentrations above 12%, limiting Svante's
              addressable flue gas universe vs the broader amine-based market.
            claimRefs:
