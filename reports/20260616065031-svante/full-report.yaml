              from $85 to approximately $68/tonne since 2022, while construction and equipment costs increased 30–40%
              over the same period. The OBBBA preserves the nominal rate until 2027 but does not adjust for inflation
              already incurred. Projects modeled against a real $85/tonne subsidy may find their IRRs materially
              impaired. The 2-year transferability window (~July 2027) additionally forces accelerated
              construction-start decisions, adding execution pressure.
