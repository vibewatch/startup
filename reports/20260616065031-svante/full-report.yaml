      - number: '1.6'
        title: Risks, Controversies, and Evidence Gaps
        blocks:
          - type: paragraph
            body: >
              Svante faces multiple material risks at this stage. Critics of CCUS argue, as reported in Business in
              Vancouver, that carbon capture is "a costly distraction — a lifeline that ultimately delays a necessary
              shift away from fossil fuels and potentially enables further extraction," with specific concern that the
              payoff may never match the investment. Svante has not publicly disclosed revenue, margins, burn rate, or
              profitability. All commercial-scale project final investment decisions (North Star, Mercer, Delek US Big
              Spring, IPC US paper mill) are 12 to 24 months away as of June 2026. North Star commercial operations are
              planned for early 2029. US policy uncertainty — including concerns around canceled DOE grants — has forced
              a strategic emphasis toward Canadian projects. Headcount estimates span approximately 200 (company, 2022)
              to 350 (Business in Vancouver, 2025), indicating rapid scaling but no confirmed 2026 figure. Key-person
              risk is elevated: Claude Letourneau is the sole public face of commercialization strategy and the primary
              external spokesperson; departure or distraction would be material. The company holds over 100 global
              patents but commercial-scale long-term operational data for the Redwood filters at industrial customers
              remains very limited.
            claimRefs:
              - CO038
              - CO039
              - CO040
