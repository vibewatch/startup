  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Overview and Value Proposition
        blocks:
          - type: paragraph
            body: >
              Svante Technologies sells a complete carbon capture and removal system targeting hard-to-abate industrial
              sectors. Its core value proposition is the delivery of ≥90% CO₂ capture efficiency from post-combustion
              flue gas, concentrated to ≥95% purity pipeline-grade CO₂, without the hazardous liquid amine or potassium
              hydroxide chemicals used in conventional solvent-based capture. The product stack rests on CALF-20, a
              patented zinc-based metal-organic framework (MOF) solid sorbent, coated onto thin laminate sheets and
              assembled into structured adsorbent bed filters. These filters are inserted into a rotary adsorption
              machine (RAM) — a compact, continuously rotating contactor that cycles through adsorption and regeneration
              every approximately 60 seconds using low-pressure steam. The end product is a concentrated CO₂ stream
              suitable for geological sequestration, e-fuel synthesis, CO₂-injected concrete, or CDR credit generation.
              Svante targets biogenic emitters (pulp and paper, ethanol, waste-to-energy) where capture costs are lower,
              as well as cement, hydrogen, steel, oil-and-gas refining, aluminum, and chemicals. For facilities with
              flue gas CO₂ concentrations below 12% (such as natural gas combined cycle power plants), Svante partners
              with BASF to offer OASE® blue liquid amine as a complementary product alongside the solid sorbent
              offering.
            claimRefs:
              - CE001
              - CE036
              - CE026
              - CE031
      - number: '5.2'
        title: Product Line and Module Architecture
        blocks:
          - type: paragraph
            body: >
              Svante's commercial product line centers on two RAM sizes. The URSA 1000 is designed to capture
              approximately 500 tonnes of CO₂ per day (approximately 180,000 TPY at continuous operation) and the URSA
              2000 is designed to capture approximately 2,000 tonnes per day (approximately 730,000 TPY). Multiple RAMs
              can be deployed in parallel to scale capture at a single site — the Linde SMR pre-FEED design used two
              URSA 2000 units in parallel to reach 1.436 million TPY. In May 2025, Svante and SAMSUNG E&A launched
              C-READY, a standardized skid-mounted modular carbon capture plant product that packages Svante's
              VeloxoTherm contactor technology with SAMSUNG E&A's digital Engineering Data Platform (EDP) and proven
              modularization capabilities. C-READY targets commercial industrial projects and is marketed as a
              one-stop-shop for CCUS project delivery from front-end engineering through fabrication. For direct air
              capture applications, Svante supplies contactor blocks — a format of the same CALF-20-coated structured
              adsorbent technology — used in Climeworks' Generation 3 DAC system. Svante's technology page also lists
              the company's solid sorbent-based filters as available for industrial point-source capture and DAC in a
              single manufacturing platform.
