            title: Commercial-Scale Durability and Long-Run O&M Costs Remain Unproven at Fleet Scale
            body: >
              CALF-20 has demonstrated stability across 4,000+ hours at the CO₂MENT pilot and in 1,300+ cycles in
              Climeworks' Muttenz tests. However, multi-year industrial fleet performance data under varying gas
              compositions, impurity profiles, and maintenance cycles is not yet available. Filter replacement
              schedules, sorbent attrition rates, and long-run O&M costs per tonne of CO₂ are not publicly disclosed,
              making total cost of ownership estimates uncertain for project finance underwriting.
            calloutType: risk
            claimRefs:
