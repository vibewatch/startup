              Svante has assembled one of the largest private capital bases in the global carbon capture sector. Early
              non-dilutive government grants from NRCan, SDTC, ERA, WINN, and NRC-IRAP totalled C$12.3M by end-2017,
              funding the first CO2 capture pilot plant. The company then raised US$26M in its Series C (2019, led by
