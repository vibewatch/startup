      - number: '4.6'
        title: Capital Adequacy, Financial Risks, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Svante's capital position, as of June 2026, cannot be precisely assessed from public information. Total
              known committed capital of approximately US$645M (US$500M+ private plus US$145M facility investment
              counted within the private total) is partially deployed into the Burnaby facility (US$145M) and supporting
              the company's ~350-person workforce and pipeline activities. The CGF first tranche (US$50M) provides
              project co-investment capacity, but the cash burn rate, remaining cash position, and next-round trigger
              are not publicly disclosed. Runway is therefore unresolvable from public evidence.

              Three structural financial risks stand out. First, policy dependence: the US 45Q credit and Canada's CCUS
              ITC are essential to project-level economics; changes in administration or legislation — particularly in
              the US following the 2024 and 2028 election cycles — could impair Svante's project pipeline economics and
              delay final investment decisions. Second, FOAK execution risk: first-of-a-kind commercial projects carry
              material cost overrun and performance risk; IEEFA found real-world CCS projects globally consistently
              underperform projected capture rates. Third, convertible note dilution: the CGF's option to convert debt
              to equity at undisclosed terms introduces balance sheet and cap table uncertainty that downstream
              investors cannot fully evaluate.

              Critical analysts including IEEFA, IISD, and academic researchers emphasize that CCS projects to date have
              failed to meet capture-rate targets while costs have doubled. These findings apply directly to the sector
              Svante operates in, even if Svante's technology approach differs from solvent-based incumbent systems. The
              financial verdict: Svante is well-capitalised relative to peers but remains pre-revenue at commercial
              scale, highly policy-dependent, and opaque on the metrics needed to underwrite a diligence decision.
