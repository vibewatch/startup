            title: DAC as a Second Market Provides Product Platform Leverage
            body: >
              Climeworks' Gen 3 field tests showed Svante's structured adsorbents deliver 2× capture efficiency and 50%
              lower energy consumption versus Gen 2 across 1,300+ cycles. With Climeworks targeting DOE-funded US
              megaton DAC hubs, Svante's filter supply could represent a meaningful second revenue stream beyond
              industrial point-source and BECCS, leveraging the same Redwood gigafactory. This dual-market platform is
              unique among solid sorbent vendors and provides demand-side resilience.
            calloutType: insight
