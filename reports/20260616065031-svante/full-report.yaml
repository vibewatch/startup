      - number: '2.4'
        title: Buyer, User, and Payer Segmentation and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The industrial CCS procurement chain is multi-party and sequential, distinguishing the plant owner (who
              holds the emissions liability and drives the business case), the sustainability/decarbonization team
              (which champions the project and interprets regulatory signals), engineering and procurement (which
              selects and integrates technology), legal and finance counsel (which structures the tax credit and project
              finance stack), the CO2 transport and storage partner (who provides the essential downstream
              infrastructure), and the offtake buyer (who purchases certified low-carbon product or CDR credit).


              Budget ownership is complex. Capex authority typically resides with C-suite/board (CFO, COO) given FOAK
              scale; sustainability teams catalyze but rarely hold autonomous capex budgets. The triggering condition is
              typically a combination of: rising carbon pricing crossing the economic breakeven for CCS vs.
              continue-to-emit, supply-chain or shareholder pressure for green product differentiation, and availability
              of government grants or tax credits that shift the payback period to acceptable levels. Payers include the
              plant owner (for equipment and integration), government bodies (capex/opex grants; 45Q credits transferred
              to project finance providers), and indirectly offtake buyers who pay a premium for certified
              low/zero-carbon product. Storage partners are generally not part of the equipment vendor's scope but are a
              gating condition: every advancing project to date connects to shared CO2 infrastructure (Northern Lights,
              Porthos, Ravenna Hub). Without a storage partner contract, projects cannot reach FID. MRV and monitoring
              compliance—now governed by IRS Form 8933 and 45Q's monitoring requirements—adds a legal compliance
              function to the buyer's decision chain, including potential recapture liability if CO2 escapes.
            claimRefs:
              - CM017
              - CM018
