          - type: paragraph
            body: >-
              Svante's capital formation history is unusual for a pre-revenue company: it has raised over US$600 million
              across equity rounds (Series B through E) plus the US$100 million CGF convertible note and C$15 million
              InBC equity, yet has never disclosed an audited balance sheet, revenue figure, or post-money valuation.
              The Series E of US$318 million, closed in December 2022 and extended into Q1 2023, was the largest single
              financing of a point-source carbon-capture technology company globally at the time. Third-party
              intelligence services including Caplight and Tracxn report an implied enterprise valuation of
              approximately US$1 billion based on the structure and scale of recent rounds, but neither figure is
              confirmed by Svante or its investors.

              The US$145 million Redwood manufacturing facility in Burnaby represents a significant hard-asset base: a
              141,000 sq ft gigafactory capable of producing filters to capture up to 10 million tonnes of CO₂ per year.
              This is the single most significant tangible asset in a replacement-cost framework. Adding estimated IP,
              brand ecosystem, and development option value yields an asset floor of approximately US$450–600 million.
              The Canada Growth Fund convertible note structure (two US$50M tranches, second tranche tied to
              project-specific milestones) introduces preference-stack complexity: the specific conversion discount,
              cap, and interest rate have not been publicly disclosed, and the second tranche drawdown status as of June
              2026 is unconfirmed. The appointment of a new CFO (Terry Lefebvre) in May 2026 signals investment in
              financial infrastructure consistent with either a future fundraise or an exit readiness process. Capital
              intensity remains high: the CGF proceeds are earmarked for FOAK project co-investment rather than
              corporate operations, meaning future rounds are likely required before any commercial cash-flow payback
              cycle begins.
