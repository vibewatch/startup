      - number: '4.3'
        title: CGF Convertible Note and Strategic-Investor Implications
        blocks:
          - type: paragraph
            body: >-
              The Canada Growth Fund's US$100M convertible note (August 2024) is the most structurally significant
              recent financing event. CGF structured the investment in two tranches: an immediate US$50M tranche for
              commercial development and FOAK project co-investment, and a second US$50M tranche available for
              project-specific draws subject to approval by both parties. As convertible notes, the instruments give CGF
              the option to convert debt to equity, creating potential dilution for existing shareholders under
              conversion scenarios that have not been publicly detailed in terms of valuation cap, interest rate, or
              conversion trigger.

              Strategically, the CGF investment transforms Svante's capital deployment from equipment manufacturer to
              active project co-investor. The CEO confirmed the funds are used so the company can "have enough cash to
              basically be able to invest in these projects, and these projects eventually will get a return on
              investment." This is a capital-intensive pivot: FOAK projects in the 200,000–1,000,000 tonne/year range
              will require significant equity per project, and the CGF's first tranche is expected to support only a
              small number of initial deployments. The CGF marked its first British Columbia investment with this deal,
              signalling strong government backing for keeping Svante's intellectual property and manufacturing in
              Canada.

              The strategic-investor structure — with 40% oil and gas ownership across Chevron, Delek, OGCI Climate
              Investments, Suncor, and others — creates potential alignment but also tension. These investors have both
