  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Anti-Thesis, and Recommendation
        blocks:
          - type: paragraph
            body: >-
              Svante's investment thesis rests on three interlocking pillars: first-mover manufacturing advantage in
              solid-sorbent carbon-capture filters (the world's only dedicated gigafactory, commissioned May 2025), a
              captive strategic investor base spanning Chevron, Temasek, GE Vernova, Samsung, and the Canada Growth Fund
              that simultaneously validates technology and provides project offtake, and a structural policy floor from
              the US 45Q tax credit ($85/tonne industrial, $180/tonne DAC, preserved in the OBBBA July 2025), Canada's
              50% CCUS Investment Tax Credit, and the EU Carbon Border Adjustment Mechanism (definitive phase, January
              2026). These tailwinds create an enabling economic environment for large-scale CCS deployment in
              hard-to-abate sectors — exactly where Svante's modular solid-sorbent technology is positioned.

              The anti-thesis is equally clear. Svante has burned over US$600 million across multiple rounds without
              reaching commercial revenue at scale. All seven active project partnerships remain at MOU, pre-FEED, or
              feasibility stage; no final investment decision has been reached. The company's last disclosed equity
              financing was a Series E in Q1 2023, leaving a 3.5-year gap to June 2026 with only a US$100M convertible
              note from Canada Growth Fund (August 2024) and a C$15M strategic investment from InBC (November 2024)
              bridging the valuation anchor. Carbon capture hardware execution failures are well-documented: the IEEFA
              found no flagship CCS project has consistently captured more than 80% of its target CO₂ volume.
              LanzaTech's 90% stock decline and going-concern warning are a cautionary parallel for pre-commercial
              carbon-utilisation platforms that fail to convert pilot success to scaled unit economics. No publicly
              verifiable post-money valuation for any Svante round has been disclosed, creating genuine uncertainty
              about whether today's implied value represents a price or a narrative mark.

              Taken together, the evidence supports a recommendation of research-more with medium confidence and a high
              risk rating. A directional buy is premature without at least one FOAK project reaching FID, disclosed
              revenue or near-term revenue guidance, and cap-table transparency sufficient to model dilution and
              preference overhang. Valuation stance is classified as unknown given the absence of price-discovery data.
