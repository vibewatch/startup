      - number: '2.2'
        title: 'Market Sizing: Multiple Analytical Lenses'
        blocks:
          - type: paragraph
            body: >-
              Analyst estimates for the global CCS market in 2026 span a wide range, reflecting different boundary
              definitions, technology scope, and methodology. The Business Research Company reports the market at $8.15B
              in 2026 (up from $7.1B in 2025, 14.8% CAGR), growing to $14.4B by 2030 at 15.3% CAGR—driven by industrial
              decarbonization, post-combustion technology deployment, and hydrogen-economy expansion. Fortune Business
              Insights sizes the 2026 market at $5.31B (from $4.51B in 2025) with a forecast of $19.98B by 2034 at an
              18.03% CAGR; the narrower 2026 figure likely reflects a tighter boundary excluding some oil/gas natural
              gas processing revenue. Technavio's forecast—growth of $25.89B between 2025 and 2030 at a 32.1%
              CAGR—implies a much larger future market and may incorporate broader value-chain revenues including
              infrastructure and storage services. StartUs Insights pegs the industry at ~$8.1B in 2025 growing to
              $18.1B by 2032 (13% CAGR), broadly consistent with BRC.


              These divergent estimates are partly definitional: markets that include CO2 storage services, EOR-credited
              revenue, and transport pipelines will be larger than those counting only capture equipment and engineering
              services. A useful capacity-based lens: S&P Global Horizons and GCCSI report that global operational CCS
              capacity reached 73 Mt CO2/yr in 2026 with ~1,300 projects in the pipeline, and GCCSI's 2025 Status Report
              counted 77 operating facilities (+54% YoY), 47 under construction, and 734 total projects with combined
              pipeline capacity of 416 Mtpa—growing at 32% CAGR since 2017. By 2030, announced projects could deliver
              ~430 Mtpa capture and 670 Mtpa storage capacity if fully executed. These physical-capacity metrics anchor
              the high-end commercial optimism of Technavio, while the IEA's more conservative NZE 2025 Scenario—where
              CCUS contributes at most 4.9% of cumulative emissions reduction by 2050, down from 13% in WEO 2021—anchors
              the adverse case. The SAM for Svante (hard-to-abate industrial point-source, modular-retrofit addressable
              in North America primarily) is not independently sized in public data and remains a diligence gap.
