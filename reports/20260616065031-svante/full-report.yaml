  - id: TE003
    title: VeloxoTherm Technology Architecture — Key Layers and Dependencies
    columns:
      - Layer / Component
      - Function / Role
      - Key Dependency
      - Technical Risk
    rows:
      - - CALF-20 MOF Sorbent
        - Adsorbs CO₂ from flue gas via physisorption; releases CO₂ under low-pressure steam
        - BASF commercial-scale MOF synthesis (sole qualified supplier)
        - Single-source supply risk; long-term field durability under fleet conditions not yet proven
      - - Structured Adsorbent Filters (SABs)
        - High surface-area laminate modules for rapid gas-solid contact; roll-to-roll coating
        - Svante Redwood Facility; 3M as secondary coater
        - Quality uniformity at commercial volumes; filter attrition/replacement schedules
      - - Rotary Adsorption Machine (RAM)
        - Mechanical contactor rotating at ~1 RPM through adsorption, regeneration, conditioning zones
        - Svante in-house RAM design; sealed rotating toroid architecture (patent US20250153088A1)
        - Mechanical sealing at scale; rotating toroid patent abandoned; commercializing next-gen design
      - - Pre-treatment System
        - DCC cooling (<50°C), wet scrubber (SOx, particles), guard bed (residual contaminants)
        - Industrial gas handling vendors; site-specific BOP design
        - Cement/steel high-SOx environments require robust pre-treatment; adds CAPEX
      - - Auxiliary Steam System
        - Provides low-pressure steam for sorbent regeneration (steam-to-CO₂ ~1.22 kg/kg)
        - On-site boiler or waste heat recovery; site utility infrastructure
        - Sites without available waste heat need auxiliary boilers; adds energy cost and CAPEX
      - - CO₂ Purification and Compression
        - Catalytic oxidation (>95% purity) or cryogenic distillation (up to 99.9%)
        - Third-party gas processing vendors; Linde process integration in FEED study
        - Cryogenic option adds CAPEX; CO₂ compression to 2,200+ psia is energy-intensive
    notes: >
      Architecture derived from NETL Technology Sheet, OSTI DOE final report (DE-FE0032113), NETL Claessen and Shah
      presentations, and Svante official technology pages. Risks are diligence assessments by the analyst, not
      statements by Svante or DOE.
    claimRefs:
      - CE002
