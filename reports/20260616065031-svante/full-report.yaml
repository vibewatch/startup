      - number: '4.5'
        title: Government Incentives and Project-Level Economics
        blocks:
          - type: paragraph
            body: >-
              Svante's project economics are materially shaped by a layered stack of government incentives on both sides
              of the border. In the United States, the Section 45Q tax credit provides US$85 per tonne for CO2
              geologically stored and US$60 per tonne for CO2 used in other applications, with DAC projects eligible for
              up to US$180 per tonne. The DOE Carbon Capture Large-Scale Pilot Program provided up to US$95M (70%
              cost-share) for the Delek Big Spring refinery project. A separate DOE IEDO cost-sharing agreement of up to
              US$1.5M was selected for the Ashdown Pulp Mill pre-FEED study.

              In Canada, the CCUS Investment Tax Credit (CCUS ITC) — enacted in Bill C-59 (June 2024) and effective from
              January 2022 to December 2040 — provides up to 50% of eligible capital cost for point-source capture
              equipment and 60% for direct air capture equipment, plus 37.5% for eligible transportation and storage
              expenditures. The BIV noted Canada's system covers "up to 62 per cent of capital costs for a carbon
              capture project" when investment tax credits are combined with the industrial carbon pricing credit
              mechanism.

              These incentives are critical to project economics. With capture costs targeting US$60–120 per tonne at
              industrial point sources, and the 45Q offering US$85 per tonne for geological storage, select projects can
              be self-funding on operating economics once built. However, IEEFA's analysis of existing Alberta CCS
              plants found that operating costs are rising at twice the rate of CO2 captured volumes, and the effective
              C$170/tonne cap on emission performance credits limits revenue upside, raising questions about
              replicability at scale.
