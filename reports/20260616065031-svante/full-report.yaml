      - number: '5.3'
        title: Technology Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >
              The VeloxoTherm process is a patented rapid-cycle temperature swing adsorption (RC-TSA) system. Flue gas
              enters the rotary adsorption machine after pre-treatment: a direct contact cooler (DCC) reduces gas
              temperature to below 50°C, a wet scrubber removes sulfur oxides (SOx) and particles, and a guard bed
              removes residual contaminants. Inside the RAM, the gas contacts CALF-20-coated structured adsorbent beds
              (SABs). CALF-20 — a Zn₂(1,2,4-triazolate)₂(oxalate) framework commercially known as Calgary Framework 20 —
              adsorbs CO₂ with high selectivity over water and nitrogen through physisorption, requiring no chemical
              bond breaking. The RAM rotates through three functional zones: an adsorption zone where CO₂ binds to the
              sorbent, a regeneration zone where low-pressure steam flushes and concentrates the CO₂, and a conditioning
              zone for cooling and preparation. The full adsorption-desorption cycle completes in approximately 60
              seconds. Concentrated CO₂ (typically 95%+ purity) is then processed through a CO₂ purification and
              compression train — either catalytic oxidation for 95%+ purity or cryogenic distillation for up to 99.9%
              purity — before being compressed to pipeline pressure (≥2,200 psia in the Linde SMR FEED). The OSTI DOE
              final report for the Linde SMR pre-FEED study quantified a steam-to-CO₂ regeneration ratio of
              approximately 1.22 kg steam per kg of CO₂ captured, with opportunities for further optimization through
              heat integration and steam recovery.
