companyProfile:
  summary: >-
    Svante Technologies Inc. is a Burnaby, British Columbia carbon capture and storage solutions provider founded in
    2007 as Inventys and rebranded in 2019 in honor of Svante Arrhenius. The company has raised over US$600 million
    across multiple rounds from a strategic syndicate that includes Chevron New Energies, GE Vernova, Samsung
    Engineering, Temasek, OGCI Climate Investments, and the Canada Growth Fund. Its two core product lines —
    nanoengineered CALF-20 metal-organic framework solid-sorbent filters and modular rotary contactor machines — are
    designed to capture industrial CO₂ at 90%-plus efficiency from hard-to-abate sectors including cement, pulp and
    paper, hydrogen, and oil and gas refining, as well as bioenergy with carbon capture (BECCS) and direct air capture
    (DAC). As of June 2026, the company is pre-commercial-revenue with all active project partnerships at MOU, pre-FEED,
    or feasibility stage, and final investment decisions are expected in 2027–2028.
