      - number: '3.4'
        title: Partner versus Competitor Dynamics
        blocks:
          - type: paragraph
            body: >
              Svante's competitive positioning is complicated by dual-role relationships with BASF and Linde, both of
              which are simultaneously partners and potential competitors depending on project context.

              BASF is Svante's liquid amine partner: Svante licenses and resells BASF's OASE blue scrubbing liquid for
              customers whose flue gas CO₂ concentration is below the ~12% threshold optimal for CALF-20 MOF solid
              sorbents (e.g., natural gas combined cycle power plants). This partnership allows Svante to offer a
              full-spectrum carbon capture portfolio—solid sorbent for high-CO₂ streams, OASE blue for low-CO₂
              streams—rather than ceding those projects to competitors. However, BASF independently licenses OASE blue
              through Linde's HISOLV offering and its own direct channels; in projects where BASF-Linde delivers a full
              turnkey capture plant, they compete directly with Svante's project delivery services.

              Linde is both a Svante partner (joint DOE-funded engineering study for SMR hydrogen plants) and a
              competitor via its HISOLV/OASE blue post-combustion capture offering co-developed with BASF. Linde's EPC
              capabilities and 60+ commercial plant references make it a formidable full-service competitor in any
              industrial CCS tender where liquid amine is acceptable.

              Samsung E&A represents an unambiguous partner: the joint development agreement for C-READY standardised
              skid-mounted modules designates Samsung E&A as the exclusive EPC fabrication partner for Svante's module
              blocks. Samsung E&A's expertise in modularisation and digital project delivery, combined with Svante's
              CALF-20 filter gigafactory, forms a vertically integrated modular delivery channel that Svante's direct
              competitors have not yet replicated. However, Samsung E&A could conceivably deploy competing capture
              technologies if the partnership fails to scale, and its dominant market position in Korean and Southeast
              Asian EPC contracts creates geographic concentration risk.

              MHI uses a similar capital-light licensing model—partnering with Worley, KBR, Saipem, and Chiyoda to reach
              industrial customers—that enables rapid market penetration across Svante's target hard-to-abate sectors
              without MHI committing its own capital to project execution.
            claimRefs:
              - CP016
