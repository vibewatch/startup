      - number: '3.2'
        title: Amine-Based Incumbent Competitors
        blocks:
          - type: paragraph
            body: >
              The dominant competitive paradigm in industrial carbon capture remains liquid amine-based post-combustion
              scrubbing, represented by four principal players: SLB Capturi, Mitsubishi Heavy Industries (MHI/Kansai),
              Linde/BASF, and Carbon Clean.

              SLB Capturi, formed in 2024 as a joint venture between SLB (80%) and Aker Carbon Capture (20%), is the
              most commercially active modular amine competitor to Svante. Its standardised Just Catch product line
              captures 100,000–400,000 tonnes per year per unit and its Big Catch line scales to multi-million TPA; by
              mid-2026 it is executing three world-scale projects: Twence (100 kt, waste to energy), Brevik/Heidelberg
              Materials (400 kt, cement—the world's first full-scale cement CCS plant), and Ørsted Kalundborg (5×100 kt,
              bioenergy). Over 60,000 operating hours and DNV GL certification give SLB Capturi a verifiable
              proof-of-performance advantage. Critically, SLB's 100-country engineering footprint and oil services
              balance sheet dwarf Svante's capitalisation.

              MHI/Kansai has delivered 18 commercial plants using its KM CDR Process with KS-1/KS-21 amine solvents,
              achieving 90%+ capture and >99.9% CO₂ purity; it pursues a capital-light licensing model through 8+
              alliances with EPC firms (KBR, Worley, Saipem, Chiyoda) and industrial emitters (ArcelorMittal,
              Heidelberg). Its largest near-term project is an 800,000 t/yr cement CCS facility in the UK with
              Heidelberg and Worley.

              Linde and BASF jointly license the HISOLV/OASE blue post-combustion capture system with 60+ commercial
              plant references, >65,000 operating hours, and 20% lower energy consumption than MEA. This partnership is
              actively deploying capture at a Heidelberg Materials cement facility in Lengfurt, Germany (CAP2U joint
              venture, 70 kt/yr).

              Carbon Clean's CycloneCC uses rotating packed beds (RPBs) with a proprietary amine-promoted buffer salt
              solvent to deliver up to 50% footprint reduction; it completed its first industrial deployment at
              Fertiglobe's Abu Dhabi fertilizer plant in 2025 with ~4,000 hours of operation, reaching TRL 7. Carbon
              Clean holds 115+ active patent assets and has 50+ operational sites globally, with a cost aspiration of
              under $30 per tonne of CO₂—far below most current industry references and, if achieved, would create
              severe pricing pressure across all competitors including Svante.
