      - number: '6.2'
        title: Named Customer Proof and Project Case Studies
        blocks:
          - type: paragraph
            body: >-
              Svante's strongest proof points come from a series of staged industrial deployments progressing through
              formal engineering milestones. The Chevron Kern River pilot (Q2 2023 – August 2024) is the most
              technically validated relationship: it achieved 95% CO2 product purity and ~83% capture recovery on
              industrial boiler flue gas, and demonstrated rapid load-following with approximately 60-second
              adsorption-desorption cycles. Results were published by NETL and Svante in the June 2025 update, providing
              independent technical validation beyond company claims. Lafarge Canada's Project CO2MENT at the Richmond,
              BC cement plant has been running since 2019 and reached Phase 3 in 2023, converting 1 tonne/day of
