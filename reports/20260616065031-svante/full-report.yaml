      - number: '2.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Storage Access Is the Rate-Limiting Constraint, Not Capture Technology
            body: >-
              Every advancing industrial CCS project to date has succeeded only with access to a shared CO2 transport
              and storage network (Northern Lights, Porthos, Ravenna Hub). Projects that failed to secure storage
              access—including Heidelberg's Slite (Sweden) and Vicat's Lebec (California)—were terminated or suspended
              regardless of technology readiness. This positions CO2 infrastructure as the primary constraint on
              Svante's addressable pipeline, not its capture technology performance.
            calloutType: risk
            claimRefs:
              - CM033
              - CM039
          - type: callout
            title: '45Q as the US Market''s Bedrock: $85/Tonne Industrial CCS Credit Reshapes Project Economics'
            body: >-
              The 45Q credit at $85/tonne for industrial point-source CCS—updated by the IRA (2022) and OBBBA (2025)—is
              now the single most powerful financial instrument in the US decarbonization toolkit. For a facility
              capturing 1 million t CO2/year, this generates $85M/year in tax-credit revenue for 12 years. The credit is
              transferable and eligible for direct Treasury pay, making it financeable without a tax liability. IRS
              Notice 2026-1 provides additional safe-harbor clarity for 2025 compliance amid EPA reporting transitions.
              This creates a durable economic basis for Svante's North American pipeline, independent of carbon market
              price levels.
            calloutType: insight
            claimRefs:
