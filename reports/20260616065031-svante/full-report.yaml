            title: BASF Single-Source Dependency for CALF-20 is a Critical Supply Chain Risk
            body: >
              BASF is currently the only qualified commercial-scale producer of CALF-20. Any supply disruption
              (technical, commercial, or geopolitical) would directly constrain Svante's filter manufacturing throughput
              and its ability to fulfill commercial orders. The 3M secondary coating capacity mitigates volume surge
