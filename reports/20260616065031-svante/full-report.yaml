        title: Exhibits
        blocks:
          - type: callout
            title: US DOE Grant Cancellations Shift Svante's Market Toward Canada
            body: >
              The Trump administration's cancellation of more than $3.7 billion in US DOE CCS grants has stalled
              multiple Svante project partners and shifted the company's primary near-term growth market from the US to
              Alberta's Pathways Alliance and other Canadian incentive programmes. This policy reversal advantages
              liquid amine incumbents with more geographically diversified revenue bases (SLB Capturi in Europe; MHI in
              Asia/Europe) and puts additional execution pressure on Svante to win Canadian contracts before competitors
              consolidate those relationships.
            calloutType: risk
            claimRefs:
              - CP027
          - type: callout
            title: 'BASF: Strategic Partner and Indirect Competitor'
            body: >
              BASF occupies a uniquely ambiguous position in Svante's competitive landscape. As a reseller partner,
              BASF's OASE blue solvent extends Svante's addressable market to lower CO₂-concentration flue gas streams
              that CALF-20 cannot efficiently capture. As an independent licensor (through Linde's HISOLV EPC offering),
              BASF competes for the same industrial capture contracts and has far deeper reference plant data. Investors
              and diligence teams should clarify the scope of Svante's OASE blue reseller exclusivity and whether BASF
              could exit or bypass the partnership as CCS market volumes grow.
            calloutType: insight
            claimRefs:
              - CP016
              - CP017
          - type: callout
            title: Svante Holds the Only Dedicated Solid-Sorbent Filter Gigafactory
            body: >
              Svante's Vancouver filter gigafactory—commissioned in May 2025—is the world's first dedicated
              manufacturing facility for carbon capture solid sorbent filters, with stated capacity to produce enough
              filters to capture 10 million tonnes of CO₂ per year. No direct competitor has announced equivalent
              specialised solid sorbent filter manufacturing infrastructure. This manufacturing-first strategy is
              designed to eliminate the delivery bottleneck that typically slows first-of-a-kind industrial projects,
              and it represents a structural advantage that Carbon Clean, CarbonCapture Inc., and DAC players cannot
              easily replicate without multi-year capital investment.
            calloutType: strength
            claimRefs:
              - CP023
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Business Lines
        blocks:
          - type: paragraph
            body: >-
              Svante operates three distinct but interconnected business lines. The first is equipment manufacturing:
              Svante designs and produces solid sorbent-based filter modules and rotary adsorption machines (RAMs) at
              its Burnaby Redwood facility. The second is technology packages and services, where Svante licenses its
              technology and provides engineering, project development advisory, and integrated project development
              services to industrial emitters. The third, and strategically pivotal, is project co-development through
              Svante Devco, where the company takes equity positions in first-of-a-kind (FOAK) commercial carbon capture
              facilities using joint development agreements (JDAs) with host emitters.

              Revenue is entirely undisclosed — Svante publishes no audited financials, and no revenue, ARR, or margin
              data is publicly available as of June 2026. The CEO has acknowledged the company's need to "crack the code
              of monetization," signalling that the revenue model is still maturing from technology demonstration toward
              repeatable commercial returns. Proxy signals suggest meaningful project development activity: the Delek
              Big Spring refinery CCUS project advanced past selection, the Mercer Peace River mill project reached
              Pre-FEED stage, and the Ashdown Pulp Mill DOE pre-FEED study is under way. Svante's partnership with
              Tenaska for end-to-end CO2 transport and storage integration broadens the commercial offering but does not
              yet provide publicly measurable revenue commitments.

              The go-to-market motion is direct engagement with industrial emitters in hard-to-abate sectors (cement,
              pulp and paper, refining, steel, hydrogen), supported by strategic investors who are also customers (Delek
              US, Chevron, Suncor). This investor-as-customer structure accelerates pipeline development but
              concentrates near-term revenue exposure within a small set of large-scale industrial counterparties.
