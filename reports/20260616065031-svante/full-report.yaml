    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Mission
        blocks:
          - type: paragraph
            body: >
              Svante Technologies Inc. is a purpose-driven carbon capture and removal solutions provider headquartered
              at 8800 Glenlyon Parkway, Burnaby, British Columbia, Canada V5J 5K3. The company operates as a fully
              private late-stage venture (post-Series E) with no disclosed IPO timeline. Originally incorporated as
              Inventys, the company rebranded to Svante in 2019 in honor of Svante Arrhenius — the Swedish scientist who
              in 1896 first identified the relationship between atmospheric CO₂ concentration and global surface
              temperature. Svante's core business makes two product lines: (1) nanoengineered solid sorbent filters
              coated with metal-organic frameworks (MOFs), and (2) modular rotary contactor machines that force flue gas
              through the filters, adsorb CO₂, and regenerate the filters in approximately 60-second cycles. Captured
              CO₂ is concentrated to 95-percent pipeline-grade purity, suitable for permanent geological storage or
              circular industrial reuse. The company targets hard-to-abate industries: cement, pulp and paper, hydrogen,
              steel, lime, aluminum, and oil and gas refining, and is expanding into bioenergy with carbon capture and
              storage (BECCS) and direct air capture (DAC). Svante's business model spans OEM filter sales, turnkey
              project delivery, and a project development subsidiary (Svante Development Inc.) that co-invests in
              first-of-a-kind FOAK commercial projects alongside industrial partners. The company's canonical website is
              www.svanteinc.com.
