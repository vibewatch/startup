  topStrengths:
    - 分销护城河突出，拥有 4,150 万月活用户和超过 600 万个商户触点。
    - Mynt 已经实现盈利，FY2025 净利润达到 PHP 172 亿。
    - 生态覆盖支付、信贷、投资、商户受理和合作伙伴通道，而非单一产品钱包。
    - 战略投资者支持和 IPO 需求验证了商业模式，尽管公司才刚开始接受公开市场检验。
  topRisks:
    - 在线赌博限制将费率从 0.31% 压低至 0.25% 后，核心支付的变现能力走弱。
    - 87.7% 的贷款余额留在表内，形成规模为 $925M、NPL 率为 5.1% 的无抵押信贷组合。
    - IPO 高度偏次级发行，新募集的一级资本有限，大部分募资总额将被发起人退出所消化。
    - 按公开市场标准看，公司治理、股权结构表和运营布局的披露仍不完整。
  unresolvedGaps:
