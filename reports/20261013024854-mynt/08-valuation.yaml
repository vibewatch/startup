company:
  name: "Mynt"
chapter:
  number: 8
  title: "Valuation"
  summary: "Mynt's October 2026 initial public offering at ₱6.60 per share implies an equity valuation of approximately $7.7 billion (₱441.5 billion), representing a one-third cut from its top price of ₱10.00 amid challenging Philippine market conditions. While the company achieved ₱17.2 billion in 2025 net income across 39.1 million active users, the recommendation is track with high risk rating and a stretched valuation stance. Key investment concerns include 83% of IPO gross proceeds flowing to selling shareholders, an uncollateralized $925 million on-balance-sheet loan portfolio carrying 5.1% NPLs, and take-rate compression following the domestic regulatory ban on in-app online gambling."
sections:
  - id: investment-thesis-and-framework
    title: "Investment Thesis and Core Anti-Thesis"
    body: "Mynt stands as the undisputed market leader in Philippine digital financial services, anchored by the GCash ecosystem serving 39.1 million monthly active users and settling ₱17.0 trillion in annual gross transaction value [CV001, CV005]. The bull investment thesis centers on this impregnable consumer reach, which propelled full-year 2025 revenues to ₱79.8 billion and generated ₱17.2 billion in net profit, reflecting 56% year-on-year earnings growth [CV005]. Furthermore, strategic rounds in 2024 from MUFG Bank and Ayala Corporation at a $5 billion post-money valuation validated institutional support for Mynt's transition from a payment gateway into a diversified credit, wealth, and merchant platform [CV010]. Conversely, the core anti-thesis highlights structural growth and balance-sheet vulnerabilities [CV012]. Following a domestic regulatory ban on in-app online gambling games, core payments take rates deteriorated from 0.31% to 0.25%, stalling sequential payment expansion [CV007]. To sustain top-line momentum, Mynt has pivoted aggressively into digital lending, retaining 87.7% of its $925 million loan book directly on its own balance sheet with a 5.1% non-performing loan ratio on uncollateralized consumer debt [CV008, CV009]. This shifts Mynt's profile toward an unhedged consumer credit risk vehicle [CV012]."
    claimRefs:
      - CV001
      - CV005
      - CV007
      - CV008
      - CV009
      - CV010
      - CV012
    tableRefs:
      - TV002
  - id: recommendation-and-valuation-stance
    title: "Recommendation, Valuation Stance, and Public Offering Pricing"
    body: "We assign Mynt an investment recommendation of track with a high risk rating and a stretched valuation stance [CV012]. In October 2026, Mynt priced its initial public offering on the Philippine Stock Exchange at ₱6.60 per share, raising up to ₱60.9 billion ($973 million) inclusive of the overallotment option [CV002]. While this represented the largest maiden share sale in the Philippines since 2021, the offer price marked a 33% reduction from the initial ceiling price of ₱10.00, reflecting soft domestic equity sentiment as the PSE index tumbled 7% year-to-date [CV002]. Across 66.9 billion post-IPO common shares, the ₱6.60 price implies an equity valuation of ₱441.5 billion, or approximately $7.6 billion to $7.8 billion, trading at roughly 25x trailing 2025 net profit [CV002, CV003, CV011]. Institutional demand was solidified by 20 cornerstone investors committing roughly ₱36.5 billion (70% of firm shares), led by BlackRock, Schroders, Lazard, and BPI Asset Management [CV006]. However, capital allocation discipline raises significant red flags: Mynt itself will receive only ₱10.6 billion ($170 million) from 1.6 billion primary shares, meaning 83% of gross proceeds will be absorbed by cashing-out selling shareholders, including Ant Financial, Warburg Pincus, and company executives [CV003, CV004]. The absence of primary capital reinvestment combined with full valuation multiples suggests limited margin of safety for public investors [CV011, CV012]."
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
      - CV011
      - CV012
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: scenario-analysis-and-valuation-bounds
    title: "Scenario Analysis: Bull, Base, and Bear Valuations"
    body: "Evaluating Mynt's medium-term prospects yields a probabilistic equity valuation envelope spanning $5.2 billion to $10.0 billion [CV014]. In the bull case (20% probability), payment take rates stabilize and re-accelerate toward 0.30% via high-margin merchant software and remittance corridors, while lending credit loss provisioning remains contained below 4.0% of total loans, propelling 2026 net profit to ₱22 billion ($380 million) and unlocking an equity value of $10.0 billion to $11.0 billion [CV007, CV008, CV011, CV014]. In the base case (55% probability), payment take rates settle at 0.25%, top-line payments growth remains modest, and credit losses remain elevated at 5.0% to 5.5% on-book, holding 2026 earnings around ₱18 billion ($310 million); this scenario supports an equity valuation of $7.5 billion to $7.8 billion (24x P/E), aligning with the finalized ₱6.60 IPO pricing [CV002, CV005, CV007, CV009, CV011, CV014]. In the bear case (25% probability), consumer delinquency on uncollateralized micro-loans spikes above 7.0%, forcing extensive loan impairment charges that compress net profit to ₱12 billion ($205 million) [CV008, CV009]. Under multiple contraction down to 24x trough earnings, equity value retreats to $5.0 billion to $5.5 billion, revisiting the August 2024 private financing benchmark [CV010, CV014]."
    claimRefs:
      - CV002
      - CV005
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV014
    tableRefs:
      - TV003
  - id: comparable-benchmarks-and-diligence-asks
    title: "Comparable Benchmarks, Downside Triggers, and Diligence Asks"
    body: "In a regional context, Mynt's public debut establishes a critical valuation benchmark for Ant Group's Southeast Asian wallet network, including Touch 'n Go in Malaysia, DANA in Indonesia, and TrueMoney in Thailand, as well as domestic Philippine competitor Maya [CV003, CV006]. While Mynt exhibits superior profitability compared to unlisted regional peers, its trading valuation at 25x earnings commands a premium that leaves no cushion for operational missteps [CV011, CV012]. We establish specific thesis-break triggers that would prompt a downgrade to avoid: non-performing loans climbing above 7.0% across Fuse Lending, additional regulatory caps on interchange or domestic fund transfer fees, or aggressive post-lockup secondary selling by private equity sponsors [CV004, CV008, CV009, CV013]. Priority diligence asks require examining Fuse Lending's standalone audited cash flows, granular vintage loss curves across lower-income borrowers, and the precise expiration schedule of secondary share lock-up covenants [CV004, CV008, CV013]."
    claimRefs:
      - CV003
      - CV004
      - CV006
      - CV008
      - CV009
      - CV011
      - CV012
      - CV013
callouts:
  - calloutType: recommendation
    title: "Stance: Track Pending Credit and Secondary Overhang Resolution"
    body: "Although Mynt's market dominance and 2025 net profit of ₱17.2 billion establish exceptional financial scale, public investors should track rather than buy at the ₱6.60 IPO level. With 83% of gross IPO proceeds flowing to cashing-out selling shareholders, 87.7% of the loan portfolio uncollateralized on-balance sheet, and take rates declining from 0.31% to 0.25%, the risk-adjusted return profile warrants waiting for audited credit vintage seasoning and post-listing float stabilization [CV002, CV003, CV007, CV008, CV012]."
    claimRefs:
      - CV002
      - CV003
      - CV007
      - CV008
      - CV012
  - calloutType: risk
    title: "Unsecured Balance-Sheet Credit and Regulatory Take-Rate Vulnerability"
    body: "Mynt's transition into balance-sheet lending introduces meaningful credit risk, with 5.1% NPLs on $925 million of uncollateralized loans as of Q1 2026. Simultaneously, regulatory intervention banning in-app online gaming has proven that payment take rates can compress abruptly, highlighting the fragility of fee margins under shifting Philippine regulatory policy [CV007, CV008, CV009, CV013]."
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV013
