      - number: '3.3'
        title: 转换成本、分销优势与竞争定位
        blocks:
          - type: paragraph
            body: >-
              Mynt 的竞争持久性建立在强大的双边网络效应之上：月活用户超过 4,000 万，受理网络覆盖 600
              万家合作商户和社交卖家。这种密集的用户与商户循环为日常零售支付带来很高的转换成本，使竞争钱包难以全面替代。Globe Telecom、Ayala Corporation、MUFG 和 Ant Group
              的战略支持进一步强化了分销能力和机构信任，Mynt 参与 MUFG Openly-connected Digital Ecosystem 便是例证。不过，客户多平台使用仍很普遍，尤其是城市智能手机用户会在
              Maya 保留账户，以获取数字储蓄账户的竞争性利率。Mynt 虽然在马尼拉大都会以外的无银行账户消费者触达上领先，但要守住钱包活跃度，就必须持续扩展到更高层级的零售银行服务。
            claimRefs:
