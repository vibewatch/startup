  - id: TV002
    title: 正论 / 反论表
    columns:
      - 支柱
      - 看多论点
      - 看空反论
      - 证据转折点 / 何时改变判断
    rows:
      - - 分销与规模护城河
        - GCash 已获得 3,910 万活跃用户和 ₱17.0T 支付交易量，在菲律宾人口中形成无可争议的网络效应。
        - 在线博彩监管禁令后，支付费率压缩至 0.25%，说明业务容易受到政策冲击。
        - 非博彩商户支付费率持续重新加速至 0.30% 以上，同时 MAU 保持两位数增长。
      - - 变现与信贷扩张
        - 2026 年第一季度放贷收入同比增长 48%，Mynt 正将无银行账户的交易用户转化为正式借款客户。
        - 贷款账面中 87.7%（$925M）直接留在资产负债表内，无担保、无抵押小额贷款的不良贷款率为 5.1%。
        - 将放贷转移至表外机构合作伙伴，或证明分层不良贷款率稳定在 3.5% 以下。
      - - 资本结构与募资用途
        - 包括 BlackRock 在内的 20 家领先机构提供基石支持，承诺认购公司 70% 的股份，建立机构信誉。
        - IPO 募集总额中仅 17%（₱10.6B）用于公司增长，83% 则由 IPO 前私募股权发起人和管理层套现。
        - 大股东承诺延长多年锁定期，并将更多经营现金流再投入核心技术。
      - - 估值倍数与市场环境
        - ₱6.60 的最终价格较最初 ₱10.00 的营销上限折价 33%，为公众投资者提供估值缓冲。
        - 隐含估值约 $7.7B，在菲律宾股指下跌的市场中约为过去净利润的 25 倍（年初至今下跌 7%）。
        - 即使信贷损失准备增加、汇率承压，2026 年净利润率仍保持在 25% 以上，显示出韧性。
    notes: 对 Mynt 核心投资论点与反论进行比较，并列出会改变判断的实证数据触发点。
