companyProfile:
  summary: Mynt 是 GCash 背后的菲律宾金融科技集团，把大众支付、转账、商户受理、消费信贷及相邻金融服务整合到一个生态中。公司已达到较大规模并实现盈利，但仍处于 IPO 前阶段，治理、资本结构和信用质量的持续性仍缺乏完整透明度。
  productSummary: 面向菲律宾大众消费者的消费金融科技超级应用，覆盖支付、转账、商户受理、储蓄、借贷及相邻金融服务。
  customerFocus: 菲律宾大众消费者、银行服务不足的借款人、微型商户和合作账单服务商。
  businessModel: 交易费率、商户收单费、贷款利息和服务费、合作伙伴佣金，以及更广泛的生态变现。
  stage: Late-stage private / pre-IPO
  fundingStatus: 2024 年战略轮融资使 Mynt 估值达到 $5.0B；2026 年 10 月 IPO 发行价为每股 PHP 6.60，且以老股出售为主，因此留给公司的新增资本有限。
  disclosureProfile: private-disclosed
  claimRefs:
