        - 多银行合作关系，包括 BPI (Ayala) 及全球贷款机构
        - 低
      - - 二级市场流动性与浮存金管理
        - 基石 IPO 投资者与公众流通股
        - 资本市场流动性提供方
        - 高
        - IPO 前基金在锁定期结束后出售股份造成二级市场抛压
        - 高
        - 分阶段锁定协议及多元化基石投资者基础
        - 较高
    notes: 评估对创始发起人、技术许可方和资本提供方的结构性依赖；集中度反映替代难度。
