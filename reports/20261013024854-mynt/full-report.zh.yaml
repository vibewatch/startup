chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营结构与当前规模
        blocks:
          - type: paragraph
            body: >-
              Caproasia 报道称，Mynt 于 2015 年由 Globe Telecom、Ayala Corporation 和 Ant Financial 组建。公司当前页面将 Mynt, Inc. 认定为
              GCash 母公司，并将 G-Xchange, Inc. 描述为钱包运营方、Fuse Financing, Inc. 描述为贷款公司。较新的 Mynt 公司页面还列出 Ryse、BlockG、Sprynt 和
              ECPay，显示集团已从最初的钱包与借贷结构扩展到投资、数字资产、企业服务和现金数字化支付基础设施。独立的发行期报道显示，GCash 月活用户为 4,150 万，占菲律宾成年人口的 56%；活跃借款人为 750
              万，占月活用户的 18%。这些是活跃度分母，不是注册客户数。现有证据无法确认 Mynt 的总部、员工人数或实体网点覆盖，因此这些封面指标仍应明确标为缺口，不能自行推断。
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO014
