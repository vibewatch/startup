            title: 分销护城河与银行资产负债表能力
            body: >-
              Mynt 超过 4,000 万月活用户和 600 万合作商户的消费者规模，为其在菲律宾提供了无可匹敌的低成本获客能力。但直接竞争者 Maya 借助专门的数字银行牌照提供一体化高收益储蓄产品，迫使 Mynt 依靠
