        title: 展示项
        blocks:
          - type: callout
            title: 具体且整合的控制栈
            body: 文件列出了具体的身份、设备、交易和反欺诈控制，而不是只依靠泛泛的安全主张 [CE007, CE010]。下一步尽调应测试这些控制是否有效，而不是再做一份功能清单。
