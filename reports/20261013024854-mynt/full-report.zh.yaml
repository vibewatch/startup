      - number: '5.3'
        title: 技术差异化与路线图
        blocks:
          - type: paragraph
            body: >-
              最强的技术差异化主张，是把身份、交易和行为数据放进同一个分发界面。Mynt 称其 eKYC 流程可以在五分钟内自动批准符合条件的申请，并于 2025 年 5 月接入菲律宾统计局的 National ID
              Authentication Services [CE007]。公司还称，GScore 是根据 GCash 行为和使用情况生成的专有信任评分，用于帮助没有传统信用记录的用户作出信贷决策
              [CE008]。仅凭营销材料很难评估这些能力：证据池没有独立的歧视性、校准或公平性研究。当前路线图同时扩展用例和自动化，明确列出 GCash Commute QR、Scan to Order、Food
              Hub、GJobs 和 GTourist 等项目 [CE013]。Mynt 还称计划让 Pera Coach 和 Gigi 承担由用户授权的代理式金融任务
              [CE012]，这会提高对授权边界、回滚、可审计性和人工升级机制的尽调要求。
            claimRefs:
              - CE007
              - CE008
              - CE012
              - CE013
      - number: '5.4'
        title: 信任控制与产品风险
        blocks:
          - type: paragraph
            body: >-
              招股书描述了分层账户保护：Security Center、Double Safe 人脸活体检测、单设备 Account Secure 控制、应用内支付授权、App Protect 设备完整性监控，以及实时
              Fraud Management System [CE010]。招股书还称，AI 项目在强调数据隐私、算法公平和人工监督的框架下运行
              [CE011]。这些是控制设计主张，不代表控制措施能够持续防止损失。信贷带来可量化的产品风险：Asia Tech Review 报道，2026 年第一季度 Mynt 自有账上的贷款组合约为 $925
              million，占总组合的 87.7% [CE014]，并报告该季度不良贷款率为 5.1% [CE015]。之后的招股书报告截至 2026 年 6 月 30 日为 4.9%
              [CE009]；不同日期不应视为矛盾，也不应混成一个指标。最后，Straits Times 的排名条目明确标为发行方负责的新闻稿内容，因此不能充当独立技术基准 [CE016]。
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE014
              - CE015
              - CE016
