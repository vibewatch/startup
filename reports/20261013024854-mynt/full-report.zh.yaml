  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与客户流程
        blocks:
          - type: paragraph
            body: >-
              GCash 是由交易驱动的金融服务界面，而非单一用途钱包。Mynt 招股书将支付和转账描述为入口流程，随后连接信贷、储蓄、投资、保险、商户服务，以及国际汇款或消费功能 [CE001]。公司层面将交付拆分给
              GXI（钱包）、Fuse（借贷）、Ryse（投资）、BlockG（数字资产）、Sprynt（数据驱动的客户互动）和 ECPay（实体到数字支付网络）[CE002]。FinTech Futures 独立印证了
              GXI/Fuse 的核心分工，但更宽泛的模块地图仍来自公司自述 [CE003]。这种广度可以提高参与度，但也增加了必须协同运转的受监管实体、交易对手和运营交接数量，客户才能完成端到端任务。
            claimRefs:
              - CE001
              - CE002
              - CE003
