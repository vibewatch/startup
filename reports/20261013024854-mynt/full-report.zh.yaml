      - number: '1.4'
        title: 里程碑演进、监管阻力与 IPO 前尽调
        blocks:
          - type: paragraph
            body: >-
              截至 10 月 13 日运行日，发行期已经结束，但 PSE 上市仍安排在 10 月 20 日，股票代码为 GCASH；此时称上市已经完成还为时过早。基础发行约 8.03 billion 股，发行价为
              P6.60，预计募资约 P53 billion；若超额配售选择权全部行使，总所得将达到约 P60.9 billion。Mynt 自身预计获得 P10.6 billion
              的新增发行总所得，而基础发行大部分是老股，因此发行总所得不能与进入公司的现金混为一谈。增长逻辑还伴随集中度和监管风险。Asia Tech Review 报道，监管机构取消应用内在线赌博入口后，支付费率从 2025
              年第一季度的 0.31% 降至 2026 年第一季度的 0.25%。该报道还称，约 $925 million 的 2026 年第一季度贷款组合中有 87.7% 记在 Mynt 账上，相关产品无抵押，且 5.1%
              的贷款为不良贷款。
