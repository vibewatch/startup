      - number: '5.2'
        title: 架构、整合与可靠性
        blocks:
          - type: paragraph
            body: >-
              Mynt 称其搭建了专有的菲律宾应用层，同时使用成熟的全球技术供应商。披露的交易路径依赖全国清算基础设施（包括 InstaPay 和
              PESONet），以及现金存取合作伙伴、卡网络、账单支付和汇款聚合商、结算银行与合作银行 API [CE005]。实施合作伙伴 Exist 称其曾为 Mynt
              微支付应用提供应用架构建议并开发网关，这是具体的实践信号，但不是当前架构审计 [CE004]。招股书报告，截至 2026 年 6 月 30 日的六个月内，核心交易和资金流服务可用性为
              99.88%，明确包括内部服务和外部整合 [CE006]。这一指标有参考价值，但由公司报告、范围限于六个月；现有证据池没有事故数量、恢复时间、区域冗余证据或独立服务水平鉴证。
