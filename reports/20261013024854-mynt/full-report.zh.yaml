  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 从客户规模、盈利证明和新出现的风险，逐步推导至估值纪律与最终投资路径建议的分析链条。
    data:
      nodes:
        - id: scale
          label: 客户与交易规模
          detail: 39.1M 活跃用户和 ₱17.0T GTV 证明其在菲律宾数字金融市场的主导地位
        - id: proof
          label: 已验证的盈利能力
          detail: 2025 年净利润 ₱17.2B、收入 ₱79.8B，证明核心业务具备经营杠杆
        - id: credit-risk
          label: 放贷资产负债表敞口
          detail: 87.7% 的贷款余额（$925M）留在表内；无抵押信贷 NPL 比率为 5.1%
        - id: regulatory-headwind
          label: 费率压缩
          detail: 在线博彩禁令将支付费率从 0.31% 降至 0.25%，支付收入因此放缓
        - id: pricing-discipline
          label: IPO 估值现实性
          detail: 发售价从 ₱10.00 下调 33% 至 ₱6.60（估值约 $7.7B），反映宏观环境疲软
        - id: secondary-overhang
          label: 发起人资本兑现
          detail: 83% 的募资流向出售股东，而非资产负债表增长资本
        - id: verdict
          label: 投资路径建议
          detail: 等待二级市场过剩压力消化，并取得经审计的信用拨备证据后再入场
      edges:
        - from: scale
          to: proof
        - from: proof
          to: credit-risk
        - from: credit-risk
          to: regulatory-headwind
        - from: regulatory-headwind
          to: pricing-discipline
        - from: pricing-discipline
          to: secondary-overhang
        - from: secondary-overhang
          to: verdict
    approximationNotes: 将可观察的运营、信用和发行因素映射至最终投资立场的逻辑决策链。
