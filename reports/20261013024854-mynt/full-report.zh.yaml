        title: 收入模式、费率与收入流构成
        blocks:
          - type: paragraph
            body: >-
              Mynt 的收入来自核心支付、借贷与融资、商户收单以及其他金融服务。支付过去占主导地位，但 2026 年第一季度仅占总收入的 57%，较 2023 年水平下降超过 10 个百分点。2025 年 8
              月国内监管机构禁止应用内访问在线赌博游戏后，核心支付变现机制直接承压。支付费率从 2025 年第一季度的 0.31% 压至 2026 年第一季度的 0.25%，支付收入下滑，2026 年第一季度收入基本持平于
              $342 million（PHP 20.7 billion），年化运行率大致等于 2025 年收入。为抵消支付放缓，Mynt 正通过 Fuse
              借贷子公司积极变现信贷发起，并扩展投资、保险和合作伙伴解决方案的数字分销。
