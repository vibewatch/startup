      - number: '3.4'
        title: 替代路径、监管压力与信贷敞口
        blocks:
          - type: paragraph
            body: >-
              尽管 Mynt 规模领先，结构性替代风险和资产负债表敞口仍威胁长期利润率的持续性。直接竞争者 Maya 正准备在美国上市，拟募资最多  billion，可能向激进商户激励和获客活动注入大量资本。与此同时，Mynt
              转向消费信贷也带来更高的资产负债表信用敞口。Mynt 将其 25 million 贷款组合的 87.7% 留在自有账上，而非运营轻资产发起平台，因此直接承担信用违约。2026
              年第一季度，其无抵押贷款组合的不良贷款率达到 5.1%。随着传统商业银行升级移动应用、监管合规负担加重，Mynt 必须证明其贷款收益率和生态护城河能够经受信贷收紧周期和持续费率压缩。
            claimRefs:
              - CP001
