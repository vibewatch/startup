      - number: '1.2'
        title: 领导层、治理与关键人物结构
        blocks:
          - type: paragraph
            body: >-
              Mynt 2026 年 8 月发布的公司公告确认 Martha Sazon 为总裁兼首席执行官，Manila Standard 在 10 月 IPO
              报道中也独立确认了这一职务。现有证据池未披露董事长、其他董事、委员会成员、管理层梯队、继任计划或汇报线。因此，证据支持核实首席执行官，但不足以构成完整领导层名单，也不足以判断董事会是否独立。随着 Mynt
              从发起人支持的私有股权结构走向公开市场治理，这一区分很重要：投资者需要了解谁控制提名、风险监督、关联方交易和受监管的放贷决策。单凭一名已披露高管无法量化关键人物依赖。与其从过时或间接材料中补齐缺失职位，更合适的尽调路径是查阅最终招股书中的治理披露、董事会章程和管理层简介。
            claimRefs:
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO008
      - number: '1.3'
        title: 资本化历史、所有权结构与战略支持方
        blocks:
          - type: paragraph
            body: >-
              Mynt 的融资历程从 2021 年的 $300 million 轮融资，发展到 2024 年交易：FinTech Futures 报道 MUFG Bank 和 Ayala Corporation 各投入
              $393 million，使私有估值达到 $5 billion。Asia Tech Review 报道称，截至 2026 年 6 月累计募资超过 $1.2 billion，外资持股略低于
              65%；但这些二手来源数据既不是当前经审计的股权结构表，也不能说明仍可用现金。2026 年 9 月，TechNode Global 报道称，超过 20 家国内外基石投资者已承诺参与拟议 IPO
              的机构配售部分的大致规模。承诺仍取决于重新分配、定价、监管要求、市场条件和交割；它们不是已经完成的二级市场购买。这一发起人基础扩大了机构认可，但发行后的投票控制、出售股东所得、锁定期，以及
              Globe、Ayala、Ant Group、MUFG 和财务投资者的最终持股比例仍有重大疑问。
            claimRefs:
