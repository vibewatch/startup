              - CM014
      - number: '2.4'
        title: 增长驱动、监管约束与规模尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Mynt 的长期市场扩张由强劲的结构性顺风推动，但日益收紧的监管和资产负债表约束也带来关键尽调问题 [CM007, CM010, CM011]。宏观层面，菲律宾现金经济的系统性数字化、智能手机普及，以及支持全国
              QR Ph 互操作的监管要求，继续推动数字交易量增长 [CM012]。此外，与母集团 Globe Telecom 和 Ayala Corporation 的深度整合提供了机构分销能力和低成本获客 [CM005]。

              反过来，Mynt 的可服务盈利能力受到实质约束 [CM007, CM010]。2025 年 8 月应用内在线赌博游戏遭监管突然禁止，显示公司容易受到政策变化影响，核心支付费率被压低 6
              个基点，收入端交易费增长也停滞 [CM007]。为弥补这一缺口，Mynt 通过 Fuse Lending 加速无抵押消费信贷，但这一战略转向令资产负债表更加脆弱：其 $925 million 贷款组合的
              87.7% 直接位于 Mynt 自有资产负债表上，没有第三方信用担保或保险 [CM010]。2026 年第一季度不良贷款达到 5.1%，显示 92% 低收入用户中的信用压力正在显现 [CM011,
              CM012]。交易用户流失、商户交易量集中度，以及经济下行周期中无抵押借贷真正可持续的利润率仍存在关键缺口，因此 Mynt $7 billion IPO 估值是否充分折价反映信用和监管阻力，仍待回答
              [CM011, CM013]。
            claimRefs:
              - CM005
              - CM007
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 从支付通道转向信贷承保
            body: >-
              监管限制将支付费率从 0.31% 压至 0.25% 后，Mynt 从纯交易网关转向资产负债表放贷方，2026 年第一季度信贷增长 48%，同时承担 $925 million 的直接无抵押贷款风险 [CM007,
              CM008, CM009, CM010]。
            calloutType: insight
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
          - type: callout
            title: 人口结构脆弱性与无抵押信贷敞口
            body: >-
              92% 的用户来自较低收入阶层，78% 居住在马尼拉大都会以外；Mynt $925 million 账内信贷组合的不良贷款率为 5.1%，凸显其在无抵押微型借贷市场中容易受到消费者违约周期冲击 [CM010,
              CM011, CM012]。
            calloutType: risk
            claimRefs:
              - CM010
