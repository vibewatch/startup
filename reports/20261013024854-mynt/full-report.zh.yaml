  - id: TV001
    title: 建议汇总表
    columns:
      - 维度
      - 立场 / 评级
      - 关键证据锚点
      - 风险 / 下行敞口
      - 决策含义
    rows:
      - - 总体建议
        - 跟踪
        - 2025 年 3,910 万 MAU 和 ₱17.0T GTV
        - 二级市场大规模套现（占募资总额 83%）
        - 等 IPO 后二级市场抛压消化、信贷分层成熟后，再推迟激进的股权配置
      - - 估值立场
        - 偏高
        - IPO 价格 ₱6.60（股权价值约 $7.6B-$7.8B，约为 2025 年市盈率的 25 倍）
        - 在 PSE 宏观环境疲弱之际，较 ₱10.00 上限下调三分之一
        - 当前入场价对应的安全边际有限，支付业务收入环比增速正在放缓
      - - 信贷与资产负债表风险
        - 高
        - 贷款账面中 87.7% 留在资产负债表内（敞口 $925M）
        - 无担保、无抵押消费信贷的不良贷款率为 5.1%
        - 如果菲律宾消费宏观环境转弱，信贷损失准备可能侵蚀净利润率扩张
      - - 费率与变现
        - 中性至不利
        - 支付费率从 2026 年第一季度的 0.31% 降至 0.25%
        - 在线博彩禁令消除了高利润率交易量
        - 公司只能依赖更高风险的信贷增长来推动收入增长
    notes: 汇总评估框架，综合 Mynt 2026 年第四季度 IPO 初始条款、2025 年经审计历史规模指标及 2026 年第一季度信贷风险披露。
