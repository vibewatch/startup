  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 概率权重
      - 关键运营假设
      - 隐含估值逻辑
      - 关键下行 / 上行风险
    rows:
      - - 乐观情景
        - 20%
        - 支付费率重新加速至 0.30%；放贷不良贷款率控制在 4.0% 以下；2026 年净利润达到 ₱22B（$380M）。
        - $10.0B - $11.0B 股权价值（约为 2026 年市盈率的 26-29 倍，符合申报前估值高点的预期）
        - 关键风险：监管介入消费小额贷款利率，或支付费率上限再次收紧。
      - - 基准情景
        - 55%
        - 支付费率稳定在 0.25%；贷款账面增长 25%，不良贷款率稳定在 5.0%-5.5% 附近；2026 年净利润持平或小幅增长至 ₱18B（$310M）。
        - $7.5B - $7.8B 股权价值（约为 2026 年市盈率的 24-25 倍，与 ₱6.60 IPO 定价相符）
        - 关键风险：菲律宾宏观通胀持续，压低低收入消费者的还款能力。
      - - 悲观情景
        - 25%
        - 无担保放贷不良贷款率升至 7.0% 以上，需要大幅增加拨备；支付业务增长停滞；净利润降至 ₱12B（$205M）。
        - $5.0B - $5.5B 股权价值（约为市盈率低谷的 24 倍，回落至 2024 年 8 月的 Series 融资轮估值）
        - 关键风险：锁定期结束后集中出售二级市场股份，引发 IPO 后市场估值重定价。
    notes: 情景概率分布与估值敏感性模型基于 2025 年已披露的基准表现及 2026 年第一季度运营指标。
