      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 省级采用与底层金字塔触达
            body: GCash 已成功渗透马尼拉大都会以外的地区，78% 的用户居住在省级地区，92% 来自较低收入阶层，使平台成为不可或缺的金融基础设施。
            calloutType: insight
            claimRefs:
              - CU001
              - CU014
          - type: callout
            title: 信用风险上升与费率压缩
            body: 在线赌博监管限制令支付变现走弱后，Mynt 激进转向借贷；但其将 $925 million 无抵押贷款组合的 87.7% 直接留在自有资产负债表上，不良贷款率为 5.1%，因此资产质量容易受到信贷周期波动影响。
            calloutType: risk
            claimRefs:
              - CU004
              - CU005
              - CU006
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 高管风险分类与剩余敞口画像
        blocks:
          - type: paragraph
            body: >-
              评估 Mynt，需要把高交易量的支付基础设施与加速扩张的资产负债表信贷敞口、复杂监管状态拆开看。旗舰运营子公司 G-Xchange
              Inc.（GXI）在菲律宾各地提供广泛的数字支付和转账，但公司增长轨迹和利润率正面临叠加的结构性阻力。具体而言，针对在线游戏交易的监管限制直接压低支付费率，使收入端依赖转向借贷子公司 Fuse
              Lending。由于绝大多数借贷规模留在 Mynt 自有资产负债表，而非银团分发给合作银行，信用违约上升构成最大的下行脆弱点。此外，接近 65%
              的高外资股东持股，以及对生态收购的反垄断审查，也带来重要监管摩擦。资本市场执行还面临估值压缩：近期交易给出的估值约为 $7 billion，而此前目标为 $8 billion 至 $11 billion。
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR007
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR005
              - CR007
              - CR014
              - CR015
      - number: '7.2'
        title: 监管禁令、外资持股上限与法律敞口
        blocks:
          - type: paragraph
            body: >-
              Mynt 运营于日益严格的菲律宾监管框架中，支付变现和公司结构都受到主动约束。一个关键监管事件是国内监管机构停止应用内访问在线赌博游戏。这项针对性限制直接将 Mynt 支付费率从 2025 年第一季度的
              0.31% 降至 2026 年第一季度的 0.25%，使支付收入增长停滞，支付收入占公司总收入的比例降至 57%。外资实体目前持有 Mynt 略低于 65% 的股权，说明其公司治理也面临约束；其中包括 Ant
              Group、MUFG Bank、Warburg Pincus 和 Bow Wave 的大额持股。这一集中度考验适用于公共金融基础设施的菲律宾法定外资持股上限，需要 Ayala Corporation 和
              Globe Telecom 等本地集团谨慎设计结构。与此同时，菲律宾竞争委员会开始更密切审查 Mynt 拟收购电商网络 ECPay
              的交易，以评估市场权力集中度；持续存在的网络投资诈骗和品牌冒用也要求不断开展消费者提醒和反欺诈措施。
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR010
              - CR011
      - number: '7.3'
        title: 无抵押借贷集中度与信用质量恶化
        blocks:
          - type: paragraph
            body: >-
              为抵消交易支付停滞，Mynt 积极扩张借贷子公司 Fuse Lending，2026 年第一季度信贷收入同比增长 48%。但这一增长令资产负债表更加脆弱。Mynt
              没有做资本轻型、把违约风险转给机构资产负债表的贷款发起平台，而是将总贷款组合的 87.7% 留在自有账上，截至 2026 年第一季度形成约 $925 million
              的直接敞口。GLoan、GGives、Borrow Load 和 GLoan Sakto 等底层信贷产品完全无担保、无抵押，也没有第三方保证或信用保险。因此，2026 年第一季度不良贷款（NPL）率升至
              5.1%。借款人结构进一步放大了信用恶化：92% 的 GCash 用户属于低收入群体，78% 居住在马尼拉大都会以外，还款表现因此高度敏感于通胀、天气扰动和区域经济波动。
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR007
              - CR008
              - CR011
      - number: '7.4'
        title: 战略合作伙伴依赖、IPO 结构与尽调否决标准
        blocks:
          - type: paragraph
            body: >-
              Mynt 的运营模式仍高度依赖创始股东和战略分销伙伴。公司 2015 年由 Globe Telecom、Ayala Corporation 和 Ant Financial 合资成立，严重依赖 Globe
              获客和数据渠道整合，依赖 Ant Group 提供技术架构和跨境支付连接。Mynt 拟议的 $1.5 billion IPO 在资本市场上以早期财务支持方出售老股为主，只为运营业务提供 PHP 16.1
              billion（$264 million）的新增发行净所得。此外，估值指引已从最初的 $8 billion 至 $11 billion 区间压缩至近期报道中的约 $7
              billion。公开交易前的财务透明度仍受限制，注册平台在 PSE:GCASH 代码下没有展示标准化的独立财务数据。尽调否决标准应聚焦于 Fuse Lending 不良贷款率超过
              7.0%、外资持股限制相关的不利监管行动，或数字支付费率方面新增的监管干预。
            claimRefs:
              - CR001
              - CR009
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR009
              - CR012
              - CR013
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 资产负债表信用敞口造成非对称下行
            body: >-
              Mynt 从纯交易支付转向高毛利借贷后，资产负债表信用敞口大幅增加。其 $925 million 贷款组合的 87.7% 留在自有账上，不良贷款率已经达到 5.1%；Fuse Lending
              在低收入消费者群体中没有信用保险或抵押担保，因此容易受到宏观冲击。
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: callout
            title: 在全面投入资本前要求招股书级别的群体披露
            body: 由于计划 IPO 为 Mynt 募集的新增资本只有 $264 million，而 IPO 前投资者寻求数十亿美元退出，投资者应把完整披露分期违约曲线、核销政策和 PCC 监管条件作为参与前提。
            calloutType: recommendation
            claimRefs:
              - CR010
              - CR013
              - CR014
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与核心反论点
        blocks:
          - type: paragraph
            body: >-
              Mynt 是菲律宾数字金融服务无可争议的市场领导者，背靠 GCash 生态，服务 3,910 万月活用户，年度处理 ₱17.0 trillion 的总交易额 [CV001,
              CV005]。看多投资论点的核心是这一难以撼动的消费者触达，它推动 2025 年全年收入达到 ₱79.8 billion、净利润达到 ₱17.2 billion，盈利同比增长 56%
              [CV005]。此外，MUFG Bank 和 Ayala Corporation 于 2024 年以 $5 billion 投后估值参与战略轮融资，验证了机构对 Mynt
              从支付网关转向多元化信贷、财富管理和商户平台的支持 [CV010]。相反，核心反论点指向结构性增长和资产负债表脆弱性 [CV012]。国内监管禁止应用内在线赌博游戏后，核心支付费率从 0.31% 恶化至
              0.25%，支付业务环比扩张停滞 [CV007]。为维持收入端动能，Mynt 激进转向数字借贷，将 $925 million 贷款组合的 87.7% 直接留在自有资产负债表上，无抵押消费债务的不良贷款率为
              5.1% [CV008, CV009]。这使 Mynt 更像一个没有对冲的消费者信用风险载体 [CV012]。
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.2'
        title: 建议、估值立场与公开发行定价
        blocks:
          - type: paragraph
            body: >-
              我们给予 Mynt “跟踪”投资建议，风险评级为高，估值立场偏高 [CV012]。2026 年 10 月，Mynt 在菲律宾证券交易所按每股 ₱6.60 定价首次公开募股，连同超额配售权最多募资 ₱60.9
              billion（$973 million）[CV002]。这虽然是菲律宾自 2021 年以来规模最大的首次股票发行，但发行价较最初 ₱10.00 的上限低了 33%，反映出国内股市情绪疲弱；PSE
              指数年初至今已下跌 7% [CV002]。按 IPO 后 66.9 billion 股普通股计算，₱6.60 的价格对应 ₱441.5 billion 的股权估值，即约 $7.6 billion 至 $7.8
              billion，相当于约 25x 2025 年历史净利润 [CV002, CV003, CV011]。20 家基石投资者承诺投入约 ₱36.5 billion（占发行股份的 70%），由
              BlackRock、Schroders、Lazard 和 BPI Asset Management 领投，机构需求因此得到夯实 [CV006]。但资本配置纪律亮起明显红灯：Mynt 自身仅会从 1.6
              billion 股原始发行股份中获得 ₱10.6 billion（$170 million），也就是说，83% 的募资总额将被套现退出的售股股东吸收，其中包括 Ant Financial、Warburg
              Pincus 和公司高管 [CV003, CV004]。原始资本没有再投资，加上估值倍数已处高位，意味着公开市场投资者的安全边际有限 [CV011, CV012]。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: 情景分析：乐观、基准与悲观估值
        blocks:
          - type: paragraph
            body: >-
              对 Mynt 中期前景的评估得出一个概率加权的股权估值区间，覆盖 $5.2 billion 至 $10.0 billion [CV014]。乐观情景（概率
              20%）下，支付抽成率通过高毛利商户软件和汇款通道稳定并重新加速至 0.30% 附近，同时贷款信用损失拨备控制在总贷款的 4.0% 以下，推动 2026 年净利润达到 ₱22 billion（$380
              million），股权价值打开至 $10.0 billion 至 $11.0 billion [CV007, CV008, CV011, CV014]。基准情景（概率 55%）下，支付抽成率稳定在
              0.25%，支付业务营收增长仍然温和，账面信用损失维持在 5.0% 至 5.5% 的高位，2026 年盈利约为 ₱18 billion（$310 million）；该情景支持 $7.5 billion 至
              $7.8 billion 的股权估值（24x P/E），与最终 ₱6.60 的 IPO 定价一致 [CV002, CV005, CV007, CV009, CV011, CV014]。悲观情景（概率
              25%）下，无抵押小额贷款的消费者逾期率升至 7.0% 以上，迫使公司计提大额贷款减值，将净利润压缩至 ₱12 billion（$205 million）[CV008,
              CV009]。若估值倍数收缩至谷底盈利对应的 24x，股权价值将回落至 $5.0 billion 至 $5.5 billion，回到 2024 年 8 月的私募融资基准 [CV010, CV014]。
            claimRefs:
              - CV002
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
      - number: '8.4'
        title: 可比基准、下行触发因素与尽调要求
        blocks:
          - type: paragraph
            body: >-
              从区域视角看，Mynt 上市为 Ant Group 的东南亚钱包网络建立了关键估值基准，覆盖马来西亚的 Touch 'n Go、印度尼西亚的 DANA、泰国的 TrueMoney，以及菲律宾本土竞争对手 Maya
              [CV003, CV006]。Mynt 的盈利能力虽优于未上市的区域同业，但其 25x 盈利估值带来的溢价没有给运营失误留下缓冲 [CV011, CV012]。             
              我们设定了明确的论点失效触发条件，达到这些条件就应下调至“回避”：Fuse Lending 的不良贷款率升至 7.0% 以上；监管进一步限制 interchange
              或国内资金转账费；或者私募股权发起人在锁定期结束后激进减持二级股份 [CV004, CV008, CV009, CV013]。优先尽调事项包括：审查 Fuse Lending
              单独口径的经审计现金流、低收入借款人群体的分期损失曲线，以及二级股份锁定契约的确切到期安排 [CV004, CV008, CV013]。
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 立场：等待信用风险与二级市场抛压缓解后再跟踪
            body: >-
              Mynt 的市场主导地位和 2025 年 ₱17.2 billion 的净利润体现出非凡的财务规模，但公开市场投资者在 ₱6.60 的 IPO 价位应跟踪而非买入。IPO 募资总额中有 83%
              流向套现退出的售股股东，贷款组合中 87.7% 是资产负债表上的无抵押贷款，抽成率又从 0.31% 降至 0.25%；在这种情况下，风险调整后回报值得等待经审计的信用 vintage
              充分成熟，以及上市后流通股稳定下来 [CV002, CV003, CV007, CV008, CV012]。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV012
          - type: callout
            title: 无抵押资产负债表信贷与监管抽成率脆弱性
            body: >-
              Mynt 转向资产负债表放贷后，信用风险明显上升：截至 2026 年第一季度，$925 million 无抵押贷款的不良贷款率为
              5.1%。与此同时，监管干预禁止应用内网络博彩，已经证明支付抽成率可能突然压缩，也凸显出菲律宾监管政策变化下手续费利润率的脆弱性 [CV007, CV008, CV009, CV013]。
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV013
