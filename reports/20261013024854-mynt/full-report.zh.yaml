            body: >-
              借贷是 Mynt 增长最快的变现路径，2026 年第一季度收入同比增长 48%。但由于 Mynt 总贷款组合的 87.7%
              直接位于自有账上，而不是转给外部资产负债表或专门银行合作伙伴，这一增长也带来实质资产负债表风险。截至 2026 年第一季度，GLoan、GGives、Borrow Load 和 GLoan Sakto
              等无抵押产品的账内信贷敞口约为 $925 million。由于这些微型贷款完全没有抵押，也没有担保或保险，不良贷款率截至 2026 年第一季度为 5.1%。这一信贷敞口还集中在较脆弱的消费者群体：Mynt 用户中
              92% 来自低收入群体，78% 居住在马尼拉大都会以外，宏观下行时资产质量可能波动。
