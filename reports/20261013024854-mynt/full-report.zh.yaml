  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 菲律宾数字金融格局与同业结构
        blocks:
          - type: paragraph
            body: >-
              菲律宾数字金融服务的竞争围绕移动金融超级应用、传统全能银行和根深蒂固的现金柜台渠道展开。Mynt 的 GCash 在消费者钱包市场稳居交易量第一，但也面临 Maya 的直接聚焦竞争；Maya 由 Voyager
              Innovations 运营，并得到电信集团 PLDT 和中国 Tencent 支持。除国内同业竞争外，Grab Financial Group 和 GoTo 等区域科技巨头在东南亚保有支付业务，全球支付网络
              Visa 和 Mastercard 则支撑国际卡支付轨道。不过，BDO、BPI 等传统全能银行主导企业流动性和大额工资发放，数百万没有银行账户的居民仍依赖实体当铺和现金网络完成日常支付。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP006
      - number: '3.2'
        title: 功能能力、生态整合与定价结构
        blocks:
          - type: paragraph
            body: >-
              菲律宾金融科技平台的差异化已从简单点对点转账转向覆盖借贷、投资和实体现金分发的全栈金融服务。Mynt 通过 G-Xchange 负责消费者钱包运营、Fuse Lending 负责技术驱动的信贷方案（如 GLoan
              和 GGives），来满足这一需求。为连接数字余额和实体现金经济，Mynt 结合全国 ECPay
              网络与合作现金存取柜台。不过，国内监管要求和商户的结构性价格敏感度仍压制定价能力。政府限制在线赌博支付整合后，Mynt 综合支付费率从 2025 年初的 0.31% 降至 2026 年第一季度的
              0.25%。这一费率压缩说明，为抵消支付商品化，扩张高毛利信贷和财富管理产品为何至关重要。
