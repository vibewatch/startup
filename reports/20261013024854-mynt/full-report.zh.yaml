  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、类别范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Mynt 将可服务市场边界定义为菲律宾零售金融生态的系统性现代化 [CM001, CM014]。公司主要依托旗舰 GCash 移动平台运营，已远超传统电子点对点转账，扩展为完整的金融超级应用套件
              [CM001]。纳入的支出包括高频日常交易，例如公用事业缴费、手机预付费充值、基于 QR 的商户结账、无抵押消费信贷发放、微型储蓄、共同基金投资和数字资产经纪 [CM001, CM014]。相反，Mynt
              明确排除批发机构企业银行、银团企业项目融资和高价值实体零售银行业务，转而聚焦高频消费者与微型商户交易 [CM001]。

              在整个菲律宾群岛，Mynt 服务的主要现状替代方案仍是现金和传统的非正式柜台金融中介
              [CM002]。这个发展中岛国经济长期存在较高的无银行账户人口比例，实体商业银行网点密度也有限；实体现金交易和非正式当铺汇款网络长期充当默认交易媒介 [CM002]。Mynt 通过组织一个覆盖超过 600
              万家合作商户和社区社交卖家的受理网络来打破这一惯性 [CM004]。GCash 在销售点把非正式现金交易数字化，打通纸币与数字商务之间的摩擦，成为日常商业的核心交易枢纽，并建立起可防御的网络效应 [CM002,
              CM004]。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM014
      - number: '2.2'
        title: 市场规模视角与受约束的机会层次
        blocks:
          - type: paragraph
            body: >-
              评估 Mynt 的可服务市场，需要从多个受约束的规模视角切入，而不能依赖一个宽泛的自上而下 headline [CM003, CM005]。从人口用户视角看，2026 年第二季度 GCash 月活用户为
              4,150 万，背后是 9,400 万注册账户的庞大累计基数 [CM003]。这一规模反映出平台在菲律宾成年人口中的渗透率极高，已经成为日常生活的重要基础设施 [CM003]。

              但财务变现指标揭示了更细致、也更受约束的市场现实 [CM005, CM006]。2025 年全年收入达到 PHP 79.7 billion（$1.31 billion），净利润为 PHP 17.25
              billion（$284 million），盈利同比增长 55% [CM005]。然而，2026 年初的年化表现显示平台开始触顶：2026 年第一季度收入为 $342 million（PHP 20.7
              billion），年化后大致与 FY2025 持平，而不是延续过去的超高速增长 [CM006]。这一平台期直接源于监管约束：应用内在线赌博整合被取消，支付费率从 0.31% 降至 0.25%
              [CM007]。因此，Mynt 转向积极扩张资产负债表信贷，以 $925 million 的无抵押贷款敞口打开新的收入池 [CM010]。在股票市场，Mynt 将菲律宾证券交易所 IPO 发行价定为每股 PHP
              6.60，对应隐含市值约 $7 billion [CM013]。这虽是菲律宾历史上规模最大的 IPO，但其 5.3 倍追踪收入倍数依赖于成熟国内市场中由信贷驱动的激进变现能够持续 [CM005, CM013]。
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM010
              - CM013
