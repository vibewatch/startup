      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              Mynt 的用户群分为四个功能性细分，每一类都受独特的经济约束、预算权限和采用流程影响 [CM004, CM012]。最大的基础群体是居住在主要城市之外、没有银行账户或收入较低的零售消费者
              [CM012]。值得注意的是，78% 的 GCash 用户居住在马尼拉大都会以外，92% 来自较低收入社会经济阶层
              [CM012]。对这些用户而言，家庭可自由支配现金是相关预算池，采用主要由基础普惠金融流程驱动：把实体现金兑换成电子货币、接收国内汇款，以及无需长途前往银行网点即可支付市政公用事业账单 [CM002,
              CM012]。

              第二个核心细分是微型、小型和中型企业（MSME），包括社区 sari-sari 便利店和非正式市场摊贩 [CM004]。这些商户采用 GCash，是为了减少现金处理风险、避免实体零钱短缺，并向到店顾客接受 QR
              Ph 互操作支付 [CM004]。为服务其商业需求，Mynt 运营 GXI（数字支付清算）和 ECPay（全国实体支付处理）等专业子公司 [CM014]。与此同时，城市中产专业人士通过该平台使用数字银行、经由
              Ryse 投资，以及进行电商结账 [CM014]。最后，依赖信贷的微型借款人通过 Fuse Financing 获取应急流动性；2026 年第一季度其信贷收入同比增长 48%，而支付收入降至总收入的 57%
              [CM008, CM009]。在所有细分中，依靠行为数据的算法承保取代正式文件，为此前被边缘化的经济参与者提供快速采用路径 [CM009, CM012]。
            claimRefs:
              - CM002
              - CM004
              - CM008
              - CM009
              - CM012
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
