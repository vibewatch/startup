callouts:
  - calloutType: "risk"
    title: "Balance-Sheet Credit Exposure Creates Asymmetric Downside"
    body: "Mynt's transition from pure-play transaction payments to high-margin lending has introduced substantial balance-sheet credit exposure. With 87.7% of its $925 million loan book retained on its own books and non-performing loans already standing at 5.1%, Fuse Lending operates without credit insurance or collateral guarantees across lower-income consumer segments, creating vulnerability to macro shocks."
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
  - calloutType: "recommendation"
    title: "Require Prospectus-Grade Cohort Disclosures Before Full Capital Commitment"
    body: "Given that primary capital raised for Mynt in the planned IPO is limited to $264 million while pre-IPO investors seek multi-billion-dollar exits, investors should condition participation on full audited disclosure of vintage default curves, charge-off policies, and PCC regulatory conditions."
    claimRefs:
      - "CR010"
      - "CR013"
      - "CR014"
      - "CR015"
