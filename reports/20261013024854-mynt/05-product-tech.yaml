company:
  name: Mynt
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Mynt delivers a broad financial-services workflow through GCash, supported by a proprietary application layer, national payment rails, partner networks, behavioral decisioning, and company-described cloud-native infrastructure. The October 2026 prospectus supplies unusually specific architecture and control claims, but uptime, security effectiveness, and roadmap execution still require independent technical assurance."
sections:
  - id: product-workflows
    title: "Product Scope and Customer Workflows"
    body: >-
      GCash is a transaction-led financial-services interface rather than a single-purpose wallet. Mynt's prospectus describes payments and transfers as the entry workflow, followed by credit, savings, investments, insurance, merchant services, and international remittance or spending functions [CE001]. The corporate surface separates delivery among GXI for the wallet, Fuse for lending, Ryse for investments, BlockG for digital assets, Sprynt for data-enabled customer engagement, and ECPay for the physical-to-digital payment network [CE002]. FinTech Futures independently corroborates the core GXI/Fuse split, but the wider module map remains company-described [CE003]. This breadth can increase engagement, yet it also expands the number of regulated entities, counterparties, and operational handoffs that must work together for a customer to complete an end-to-end task.
    claimRefs:
      - CE001
      - CE002
      - CE003
    tableRefs:
      - TE001
      - TE002
  - id: architecture-and-delivery
    title: "Architecture, Integration, and Reliability"
    body: >-
      Mynt says it has built a proprietary Philippine application layer while using established global technology providers. The disclosed transaction path depends on national clearing infrastructure, including InstaPay and PESONet, plus cash-in/cash-out partners, card networks, bill-payment and remittance aggregators, settlement banks, and partner banking APIs [CE005]. An implementation partner, Exist, says it advised on application architecture and developed the gateway for Mynt's micro-payment app, providing a concrete practitioner signal but not a current architecture audit [CE004]. The prospectus reports 99.88% availability for core transactional and fund-flow services during the six months ended June 30, 2026, explicitly including internal services and external integrations [CE006]. That metric is useful but company-reported, scoped to a six-month period, and not accompanied in this pool by incident counts, recovery-time measures, regional redundancy evidence, or an independent service-level attestation.
    claimRefs:
      - CE004
      - CE005
      - CE006
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: differentiation-and-roadmap
    title: "Technology Differentiation and Roadmap"
    body: >-
      The strongest technical differentiation claim is the combination of identity, transaction, and behavioral data inside one distribution surface. Mynt says its eKYC flow can auto-approve eligible applications in under five minutes and integrated with the Philippine Statistics Authority's National ID Authentication Services in May 2025 [CE007]. It also describes GScore as a proprietary trust score derived from GCash behavior and usage to support credit decisions for users without conventional histories [CE008]. These capabilities are difficult to evaluate from marketing alone: the pool contains no independent discrimination, calibration, or fairness study. The current roadmap broadens both use cases and automation, with named initiatives including GCash Commute QR, Scan to Order, Food Hub, GJobs, and GTourist [CE013]. Mynt also says it intends to move Pera Coach and Gigi toward agentic, user-authorized financial tasks [CE012], raising the diligence bar for authorization boundaries, rollback, auditability, and human escalation.
    claimRefs:
      - CE007
      - CE008
      - CE012
      - CE013
  - id: trust-and-risk
    title: "Trust Controls and Product Risk"
    body: >-
      The prospectus describes layered account protection: a Security Center, Double Safe facial liveness checks, single-device Account Secure controls, in-app payment authorization, App Protect device-integrity monitoring, and a real-time Fraud Management System [CE010]. It also states that AI initiatives operate under a framework emphasizing data privacy, algorithmic fairness, and human oversight [CE011]. Those are control-design claims, not evidence that the controls consistently prevent loss. Credit adds a measurable product risk: Asia Tech Review reported that 87.7% of the loan portfolio, about $925 million, sat on Mynt's own books in Q1 2026 [CE014], and reported a 5.1% non-performing-loan ratio for that quarter [CE015]. The later prospectus reported 4.9% as of June 30, 2026 [CE009]; the differing dates should not be treated as a contradiction or blended into one metric. Finally, a Straits Times ranking item is explicitly labeled issuer-responsible press-release content, so it cannot serve as an independent technology benchmark [CE016].
    claimRefs:
      - CE009
      - CE010
      - CE011
      - CE014
      - CE015
      - CE016
callouts:
  - calloutType: strength
    title: "A Specific, Integrated Control Stack"
    body: "The filing names concrete identity, device, transaction, and fraud controls rather than relying only on a generic security claim [CE007, CE010]. The next diligence step is effectiveness testing, not another feature inventory."
    claimRefs:
      - CE007
      - CE010
  - calloutType: risk
    title: "Company Metrics Need Independent Assurance"
    body: "The 99.88% availability result and the control framework are company-reported; this evidence set does not contain independent uptime, penetration-test, incident-response, or model-validation results [CE006, CE011]."
    claimRefs:
      - CE006
      - CE011
