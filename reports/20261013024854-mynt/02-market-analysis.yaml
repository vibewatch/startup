callouts:
  - calloutType: insight
    title: Structural Shift from Payment Rail to Credit Underwriter
    body: Following regulatory restrictions that compressed payment take rates from 0.31% to 0.25%, Mynt pivoted from a pure transaction gateway into a balance-sheet lender, driving 48% credit growth in Q1 2026 while absorbing $925 million in direct uncollateralized loan risk [CM007, CM008, CM009, CM010].
    claimRefs:
      - CM007
      - CM008
      - CM009
      - CM010
  - calloutType: risk
    title: Demographic Vulnerability and Uncollateralized Credit Exposure
    body: With 92% of users originating from lower-income brackets and 78% located outside Metro Manila, Mynt's 5.1% non-performing loan ratio on its $925 million on-book credit portfolio highlights significant vulnerability to consumer default cycles in the uncollateralized nano-lending market [CM010, CM011, CM012].
    claimRefs:
      - CM010
      - CM011
      - CM012
