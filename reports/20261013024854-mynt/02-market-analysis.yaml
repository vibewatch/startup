  - id: TM003
    title: Customer Persona, Budget Ownership, and Adoption Dynamics
    columns:
      - Customer Segment
      - Target User Persona
      - Payer / Budget Authority
      - Primary Workflow & Touchpoints
      - Key Monetization Mechanism
      - Core Adoption Trigger
    rows:
      - - Unbanked Rural & Provincial Consumers
        - Provincial agricultural, domestic, and informal workers (78% outside Metro Manila)
        - Household head discretionary cash budget (92% lower-income)
        - Cash-in at local agent, P2P remittance transfer, prepaid phone load reload, utility bill payment
        - Convenience fees on bill pay, airtime reload margin, cash-out agent transaction commissions
        - Lack of traditional bank branches in provinces; convenience of mobile phone money transfer
      - - Micro & Nano MSME Retailers
        - Neighborhood sari-sari store owners, wet market stallholders, tricycle drivers
        - Sole proprietor micro-enterprise working capital cashbox
        - QR Ph payment acceptance, cash disbursement outlet (GPO), SoundPay payment confirmation
        - Merchant acquiring take rate (0.25% average), cash-out fees, working capital micro-loans
        - Elimination of cash change shortages; customer demand for digital payment; theft reduction
      - - Urban Salaried Consumers & Middle Class
        - Metro Manila and urban BPO workers, young corporate professionals, digital natives
        - Personal salary account, mobile banking budget
        - E-commerce checkout, restaurant dining QR payments, digital bank savings (GSave), mutual funds (GInvest)
        - Interbank transfer fees, investment distribution trail fees, insurance distribution margins
        - Frictionless app interface; seamless integration with digital commerce and delivery platforms
      - - Credit-Constrained Nano-Borrowers
        - Informal gig workers, micro-entrepreneurs needing emergency liquidity
        - Individual borrower emergency household budget
        - In-app credit disbursement (GLoan, GLoan Sakto), point-of-sale buy-now-pay-later (GGives)
        - Monthly loan interest charges (high APR on uncollateralized balance), late payment penalty fees
        - Instant algorithmic approval via proprietary GScore behavioral scoring without formal collateral or income tax records
    notes: Customer segmentation reflects demographic distributions disclosed in market analyses; budget ownership highlights informal cash conversion dynamics.
