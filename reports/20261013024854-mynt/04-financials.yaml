company:
  name: "Mynt"
chapter:
  number: 4
  title: "Financials"
  summary: "Mynt reached scale profitability on its Philippine mobile money ecosystem, posting $284 million (PHP 17.2 billion) in net income on $1.31 billion (PHP 79.7 billion) in revenue for 2025. However, top-line growth plateaued into Q1 2026 as regulatory curbs on online gaming reduced payments take rate from 0.31% to 0.25%, accelerating a strategic pivot toward balance-sheet credit where 87.7% of its $925 million loan book sits directly on Mynt's books with a 5.1% non-performing loan ratio."
sections:
  - id: "revenue-streams-and-pricing"
    title: "Revenue Model, Take Rates, and Stream Composition"
    body: "Mynt generates revenue across core payments, lending and financing, merchant acquiring, and ancillary financial services. Historically dominated by payment processing, payments accounted for 57% of total revenue in Q1 2026, marking a reduction of over 10 percentage points from 2023 levels. The core payment monetization mechanism experienced direct pressure after domestic regulators banned in-app access to online gambling games in August 2025. This regulatory shift compressed Mynt's payment take rate from 0.31% in Q1 2025 down to 0.25% in Q1 2026, causing payment revenue to slump and leaving Q1 2026 revenue essentially flat at $342 million (PHP 20.7 billion), which translates to an annualized run rate roughly equal to 2025 revenue. To offset payments deceleration, Mynt is aggressively monetizing credit originations through its Fuse lending subsidiary and expanding digital distribution across investments, insurance, and partner solutions."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI011"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "unit-economics-and-credit-exposure"
    title: "Unit Economics, Balance Sheet Lending, and Credit Risk Profile"
    body: "Lending represents Mynt's fastest-growing monetization vector, expanding 48% year-on-year in revenue during Q1 2026. However, this growth introduces substantial balance-sheet risk because 87.7% of Mynt's total loan portfolio sits directly on its own books rather than being routed to external balance sheets or dedicated banking partners. As of Q1 2026, on-book credit exposure reached approximately $925 million across uncollateralized lending products including GLoan, GGives, Borrow Load, and GLoan Sakto. Because these microloan products are completely unsecured and not collateralized, guaranteed, or insured, non-performing loans stood at 5.1% as of Q1 2026. This credit exposure is further concentrated in vulnerable consumer demographics, as 92% of Mynt's user base comes from lower-income groups and 78% resides outside Metro Manila, creating potential asset-quality volatility during macro downturns."
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-ipo-trajectory"
    title: "Historical Earnings, Capital Adequacy, and Diligence Blockers"
    body: "Mynt demonstrated foundational profitability by generating PHP 6.7 billion in net income in 2023, expanding to $284 million (PHP 17.2 billion) on $1.31 billion (PHP 79.7 billion) in full-year 2025 revenue. The company raised primary capital in August 2024 at a $5 billion post-money valuation from Ayala Corporation and MUFG Bank, each acquiring 8% equity stakes. While recent capital-markets reporting indicates plans to raise up to $1.5 billion in an October 2026 IPO at an $8 billion to $10.7 billion valuation, primary capital proceeds destined for the company's own treasury represent only PHP 16.1 billion ($264 million), with the vast majority serving as secondary liquidity for existing investors. Diligence on forward capital adequacy remains encumbered by the absence of prospectus-grade standalone audited financial statements, credit loss provisioning schedules, and detailed active-user transacting denominators."
    claimRefs:
      - "CI001"
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
