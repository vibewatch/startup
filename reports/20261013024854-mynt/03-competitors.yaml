  - id: TP002
    title: Financial Super-App and Digital Wallet Feature Capability Matrix
    columns:
      - Capability / Buying Criteria
      - Mynt (GCash)
      - Maya (Voyager)
      - Commercial Banks
      - Status Quo OTC
    rows:
      - - P2P & QR Merchant Payments
        - Pervasive QR acceptance across 6M+ merchants and social sellers
        - High QR Ph penetration; merchant terminal distribution
        - InstaPay/PESONet enabled; selective proprietary merchant QR
        - Cash-only physical exchange; physical paper receipts
      - - Unsecured Consumer Micro-Lending
        - Native micro-loans (GLoan, GGives, Borrow Load) via Fuse
        - Digital bank lending via integrated Maya Bank app
        - Traditional credit cards and collateralized personal loans
        - Informal lending / pawnshop pawn tickets with high interest
      - - Nationwide Cash-In / Cash-Out Network
        - Deep physical reach via ECPay network and partner cash points
        - Smart Padala physical retail network nationwide
        - Branch and ATM networks concentrated in urban centers
        - Thousands of physical pawnshops and remittance counters
      - - Digital Wealth & Asset Access
        - Investments via Ryse, digital assets via BlockG
        - Cryptocurrency trading and digital savings in-app
        - Trust accounts, mutual funds, unit investment trust funds
        - Physical gold, informal paluwagan, cash savings at home
    notes: Comparison covers deployed consumer financial features; bank offerings vary across individual commercial institutions; GCash capabilities anchored on Mynt corporate disclosures.
    claimRefs:
      - CP003
      - CP005
      - CP007
      - CP008
  - id: TP003
    title: Pricing Models, Take Rates, and Unit Monetization Mechanisms
    columns:
      - Service Category
      - Mynt (GCash) Model
      - Peer / Incumbent Benchmark
      - Take Rate / Fee Structure
      - Monetization Implication
    rows:
      - - Digital Payments & Transfers
        - Merchant discount rate and transfer platform fees
        - Standard interchange and payment processing fees
        - Reported 0.25% take rate in Q1 2026 (down from 0.31%)
        - Fee compression necessitates diversification into credit
      - - Unsecured Consumer Lending
        - Interest margin on on-book loans via Fuse Lending
        - Bank net interest margin and personal loan APRs
        - 87.7% of loan book on Mynt balance sheet (25M exposure)
        - High spread potential offset by 5.1% reported NPL ratio
      - - Cash-In / Cash-Out Bridging
        - ECPay transaction fees and partner agent commissions
        - Smart Padala and pawnshop agent commission split
        - Tiered convenience fee per cash-out transaction
        - Steady recurring transactional volume tied to physical economy
      - - Prepaid Airtime & Utility Bills
        - Telco partner distributor margin and biller convenience fees
        - Telco retail distributor and third-party biller fees
        - Standard commission per airtime top-up and bill payment
        - Low-margin utility flow serving as top-of-funnel retention hook
    notes: Take rate and loan book metrics cited from Asia Tech Review analysis of Mynt Q1 2026 financial reporting; peer structures reflect standard industry ranges.
    claimRefs:
      - CP005
      - CP009
      - CP013
      - CP014
