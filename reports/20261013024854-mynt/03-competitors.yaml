callouts:
  - calloutType: insight
    title: Distribution Moat vs Banking Balance Sheet Capabilities
    body: Mynt’s commanding consumer scale of over 40 million monthly active users and 6 million partner merchants provides unmatched low-cost acquisition in the Philippines. However, direct rival Maya has leveraged its dedicated digital banking charter to offer integrated high-yield savings products, forcing Mynt to rely on Fuse Lending and partner banks to defend consumer wallet stickiness.
    claimRefs:
      - CP001
      - CP003
      - CP010
  - calloutType: risk
    title: Regulatory Take Rate Compression and On-Book Credit Risk
    body: The vulnerability of transaction-driven super-apps to policy shifts was highlighted in late 2025 when regulatory restrictions on online gambling payments reduced Mynt’s payment take rate from 0.31% to 0.25%. Compounding this margin pressure, 87.7% of Mynt’s 25 million loan portfolio sits directly on-book with a 5.1% non-performing loan ratio, heightening balance sheet vulnerability compared to asset-light marketplace peers.
    claimRefs:
      - CP009
      - CP013
      - CP014
