company:
  name: "Mynt"
chapter:
  number: 6
  title: "Customers"
  summary: "Mynt has achieved nationwide reach with GCash spanning over 40 million monthly active users and 6 million partner merchants, anchored by strong base-of-pyramid adoption where 78% of users reside outside Metro Manila. However, recent regulatory restrictions on online gambling compressed payment take rates to 0.25%, pushing the company to expand unsecured credit to $925 million on-book with a 5.1% delinquency rate."
sections:
  - id: "customer-segmentation-and-demographics"
    title: "Customer Base Segmentation and Demographic Reach"
    body: "Mynt's customer footprint is characterized by mass-market penetration across historically underserved and unbanked populations throughout the Philippines. A substantial 78% of GCash's user base is located outside Metro Manila, demonstrating deep regional and provincial reach beyond the urban capital. Furthermore, 92% of users originate from lower-income brackets, establishing the platform as the primary digital financial gateway for base-of-pyramid consumers rather than an affluent niche product. Operating under its corporate vision of 'Finance for All', Mynt coordinates retail wallet activity through G-Xchange, Inc. (GXI) and financial inclusion credit through Fuse Lending, effectively functioning as a quasi-bank for millions of unbanked citizens."
    claimRefs:
      - "CU001"
      - "CU014"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-engagement"
    title: "Adoption Trajectory and Active Engagement Metrics"
    body: "While marketing statements highlight more than 94 million registered accounts, verified adoption centers on an active transacting user core of over 40 million monthly active users (MAUs). This user base drives transactions across a broad commercial network exceeding 6 million partner merchants and social sellers nationwide. User engagement has transitioned from peer-to-peer transfers and prepaid airtime top-ups into an expansive daily cashless ecosystem. This scale of domestic adoption earned Mynt international recognition in August 2026, when CNBC and Statista named it among the World's Top Fintech Companies 2026 in the Payments category, distinguishing it as the only Philippine fintech firm to achieve this ranking."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU013"
    tableRefs:
      - "TU002"
  - id: "commercial-customer-proof-and-merchant-ecosystem"
    title: "Named Commercial Customer Proof and Partner Ecosystem"
    body: "Commercial adoption is anchored by strategic shareholder channels and widespread merchant acceptance. Telecom parent Globe Telecom provides default airtime distribution and subscriber loading, while Ayala Corporation embeds GCash checkout across its national shopping mall, real estate, and retail networks. Institutional validation expanded further in 2024–2026 as Japan's Mitsubishi UFJ Financial Group (MUFG) committed to an 8% equity stake and brought Mynt into the MUFG Openly-connected Digital Ecosystem (MODE). On the ground, acceptance spans more than 6 million merchants, ranging from large corporate retail chains to informal micro-merchants and social sellers transacting via QR Ph standards."
    claimRefs:
      - "CU003"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU003"
  - id: "customer-journey-and-retention-risks"
    title: "Customer Journey Expansion, Credit Monetization, and Durability Risks"
    body: "Customer lifecycle progression relies on converting basic mobile wallet users into multi-product financial consumers across savings, credit, investment, and insurance verticals. However, monetization durability faces headwinds from regulatory shifts and rising credit exposure. In August 2025, Philippine regulators halted in-app access to online gambling platforms, triggering a payment revenue slump that reduced Mynt's payment take rate from 0.31% in Q1 2025 to 0.25% in Q1 2026. Consequently, payment revenue shrank to 57% of total revenue in Q1 2026. To offset this stagnation, Mynt expanded its credit vertical by 48% year-on-year, retaining 87.7% ($925 million) of its loan book on its own balance sheet. Because these consumer loans are unsecured and uncollateralized, a 5.1% non-performing loan rate introduces significant asset quality risks."
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
    figureRefs:
      - "FU001"
