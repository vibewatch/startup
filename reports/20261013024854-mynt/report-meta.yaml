summary:
  headline: >-
    Mynt pairs dominant Philippine fintech reach and profitability with an imminent IPO, but the implied $7.7B valuation
    still looks stretched against take-rate compression, an on-balance-sheet unsecured loan book, and a heavily
    secondary offering.
