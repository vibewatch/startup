  topStrengths:
    - Dominant distribution moat with 41.5 million monthly active users and more than 6 million merchant touchpoints.
    - Mynt is already profitable, generating PHP 17.2 billion of net income in FY2025.
    - >-
      The ecosystem spans payments, credit, investments, merchant acceptance, and partner rails rather than a
      single-product wallet.
    - Strategic investor support and IPO demand validate the business model even as public-market execution begins.
  topRisks:
    - >-
      Core payments monetization weakened after the online-gambling restriction compressed take rates from 0.31% to
      0.25%.
    - 87.7% of the loan book sits on balance sheet, leaving a $925 million unsecured credit portfolio with 5.1% NPLs.
    - >-
      The IPO is heavily secondary, limiting fresh primary capital and leaving sponsor exits to absorb most gross
      proceeds.
    - Governance, cap-table, and operating-footprint disclosure remain incomplete relative to a public-market standard.
  unresolvedGaps:
    - Audited standalone Mynt financial statements with cash flow, cash balance, and segment detail.
    - Loan-vintage, provisioning, and funding-cost disclosure for Fuse Lending and related credit products.
    - Final post-IPO ownership, float, and lockup schedule, including any selling-shareholder overhang.
    - Verified headquarters / operating-footprint disclosure and board-level governance detail.
