companyProfile:
  summary: >-
    Mynt is the Philippine fintech group behind GCash, combining mass-market payments, transfers, merchant acceptance,
    consumer lending, and adjacent financial services under one ecosystem. The company now operates at large scale and
    is profitable, but it remains pre-IPO and still leaves investors with incomplete visibility into governance, capital
    structure, and credit-quality durability.
  productSummary: >-
    A Philippine consumer-fintech super-app for payments, transfers, merchant acceptance, savings, lending, and adjacent
    financial services.
  customerFocus: Mass-market Philippine consumers, underbanked borrowers, micro-merchants, and partner billers.
  businessModel: >-
    Transaction take rates, merchant acquiring fees, lending interest and service fees, partner commissions, and broader
    ecosystem monetization.
  stage: Late-stage private / pre-IPO
  fundingStatus: >-
    A 2024 strategic round valued Mynt at $5.0B, and the October 2026 IPO priced at PHP 6.60 per share with a largely
    secondary structure that leaves only limited primary capital for the company.
