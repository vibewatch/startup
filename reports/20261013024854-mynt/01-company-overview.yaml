callouts:
  - calloutType: strength
    title: Scale and Reported Earnings
    body: Independent offer-period reporting puts GCash at 41.5 million monthly active users, while Asia Tech Review reports P17.2 billion of 2025 accounting net income. Neither metric by itself establishes retention, cash generation, or earnings quality.
    claimRefs:
      - CO004
      - CO006
  - calloutType: risk
    title: Balance-Sheet Credit Exposure and Regulatory Margin Drag
    body: Asia Tech Review reports that 87.7% of a $925 million Q1 2026 loan portfolio sat on Mynt's balance sheet with a 5.1% non-performing ratio, while the payment take rate fell from 0.31% in Q1 2025 to 0.25% in Q1 2026 after in-app gambling access was removed.
    claimRefs:
      - CO010
      - CO011
