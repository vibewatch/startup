company:
  name: Mynt
chapter:
  number: 1
  title: Company Overview
  summary: Mynt is the Philippine fintech parent of GCash and a broader group spanning lending, investments, digital assets, enterprise services, and cash-to-digital payments. Its 2026 IPO offer closed with a scheduled October 20 listing after reporting 41.5 million monthly active users, while incomplete governance and corporate-footprint disclosure and a large on-book unsecured loan portfolio remain material diligence gaps.
sections:
  - id: corporate-identity-and-scale
    title: Corporate Identity, Operating Structure, and Current Scale
    body: 'Caproasia reports that Mynt was formed in 2015 by Globe Telecom, Ayala Corporation, and Ant Financial. Current company pages identify Mynt, Inc. as GCash''s parent and describe G-Xchange, Inc. as the wallet operator and Fuse Financing, Inc. as the lending company. The newer Mynt corporate page also names Ryse, BlockG, Sprynt, and ECPay, showing that the group now extends beyond its original wallet-and-lending structure into investments, digital assets, enterprise services, and cash-to-digital payment infrastructure. Independent offer-period reporting puts GCash at 41.5 million monthly active users, or 56 percent of the Philippine adult population, and 7.5 million active borrowers, or 18 percent of monthly active users. Those are activity denominators, not registered-customer counts. The assigned evidence does not establish Mynt''s headquarters, headcount, or physical-location footprint, so those cover metrics remain explicit gaps rather than inferred facts.'
    claimRefs:
      - CO001
      - CO002
      - CO006
      - CO007
      - CO014
    tableRefs:
      - TO001
  - id: leadership-and-governance
    title: Leadership, Governance, and Key-Person Architecture
    body: Mynt's August 2026 company-issued release identifies Martha Sazon as president and chief executive officer, and Manila Standard independently identifies the same role in its October IPO coverage. The assigned pool does not identify a board chair, other directors, committee memberships, executive bench, succession plan, or reporting lines. It therefore supports verification of the chief executive but not a complete leadership roster or a judgment that the board is independent. That distinction matters as Mynt moves from sponsor-backed private ownership toward public-market governance, because investors need to understand who controls nominations, risk oversight, related-party transactions, and regulated lending decisions. Key-person dependence cannot be quantified from a single disclosed executive. Final prospectus governance disclosures, board charters, and management biographies are the appropriate diligence path rather than filling missing roles from stale or indirect material.
    claimRefs:
      - CO008
    tableRefs:
      - TO002
  - id: capitalization-and-stakeholder-map
    title: Capitalization History, Ownership Structure, and Strategic Backers
    body: Mynt's financing history progressed from a $300 million round in 2021 to a 2024 transaction that FinTech Futures reported as $393 million each from MUFG Bank and Ayala Corporation, taking the private valuation to $5 billion. Asia Tech Review reported more than $1.2 billion of cumulative capital raised by June 2026 and foreign ownership just under 65 percent, but those secondary-source figures are not a current audited cap table or a measure of cash still available. In September 2026, TechNode Global reported commitments from more than 20 domestic and global cornerstone investors for approximately the institutional tranche of the proposed IPO. The commitments remained subject to reallocation, pricing, regulatory requirements, market conditions, and closing; they were not completed secondary-market purchases. This sponsor base broadens institutional validation but leaves material questions about post-offer voting control, selling-shareholder proceeds, lockups, and the final stakes held by Globe, Ayala, Ant Group, MUFG, and financial sponsors.
    claimRefs:
      - CO003
      - CO005
      - CO013
      - CO015
      - CO016
    tableRefs:
      - TO003
  - id: evolution-milestones-and-adverse-factors
    title: Milestone Evolution, Regulatory Headwinds, and Pre-IPO Diligence
    body: 'As of the October 13 run date, the offer period had closed but the PSE listing was still scheduled for October 20 under ticker GCASH; describing the listing as completed would be premature. The base offer comprised about 8.03 billion shares at P6.60 and was expected to raise about P53 billion, with total proceeds reaching about P60.9 billion if the over-allotment option were fully exercised. Mynt itself expected P10.6 billion of gross primary proceeds, while most base shares were secondary, so total offer proceeds should not be confused with cash entering the company. The growth case also carries concentration and regulatory risk. Asia Tech Review reported that the regulator''s removal of in-app online-gambling access coincided with the payment take rate falling from 0.31 percent in Q1 2025 to 0.25 percent in Q1 2026. It also reported that 87.7 percent of a roughly $925 million Q1 2026 loan portfolio was held on Mynt''s books, the products were unsecured, and 5.1 percent of loans were non-performing.'
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012
    figureRefs:
      - FO001
