  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: Complete pre-IPO board committee charters, independent director rosters, and executive compensation disclosures.
      whyItMatters: Independent board oversight is critical for evaluating governance maturity and minority shareholder protection before public listing on the PSE.
      diligencePath: Review final SEC Form 17-A/Prospectus and PSE listing memorandum upon formal publication.
      relatedTableRefs:
        - TO002
    - type: private-evidence-only
      severity: material
      topic: ownership-cap-table
      missingEvidence: Detailed shareholding cap table detailing post-IPO economic and voting stakes of Globe, Ayala, Ant Group, and cornerstone investors.
      whyItMatters: Clear understanding of foreign ownership thresholds and post-offering voting control determines governance alignment.
      diligencePath: Inspect final prospectus registration statements filed with the Philippine SEC.
      relatedTableRefs:
        - TO003
    - type: missing-source
      severity: material
      topic: credit-risk
      missingEvidence: Detailed Fuse Financing vintage loss curves, write-off policies, and provisioning methodology for the $925M on-book loan portfolio.
      whyItMatters: With 87.7% of lending on-balance-sheet and 5.1% NPLs, credit loss provisioning directly drives net income volatility.
      diligencePath: Request underwriter credit risk disclosures and standalone audited notes for Fuse Financing.
      relatedQuestionRefs:
        - QO009
    - type: missing-source
      severity: material
      topic: corporate-footprint
      missingEvidence: Verified headquarters address, current employee headcount, and office or operating-location count as of the run date.
      whyItMatters: These basic scale indicators are needed to assess operating complexity, hiring capacity, and geographic concentration.
      diligencePath: Obtain the final prospectus company profile, current organization chart, and facility or office schedule.
      relatedQuestionRefs:
        - QO010
      relatedTableRefs:
        - TO001
    - type: private-evidence-only
      severity: material
      topic: audited-financials
      missingEvidence: Audited standalone Mynt financial statements supporting reported 2025 revenue, net income, cash flow, cash, and debt.
