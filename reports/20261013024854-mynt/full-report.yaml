chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Structure, and Current Scale
        blocks:
          - type: paragraph
            body: >-
              Caproasia reports that Mynt was formed in 2015 by Globe Telecom, Ayala Corporation, and Ant Financial.
              Current company pages identify Mynt, Inc. as GCash's parent and describe G-Xchange, Inc. as the wallet
              operator and Fuse Financing, Inc. as the lending company. The newer Mynt corporate page also names Ryse,
              BlockG, Sprynt, and ECPay, showing that the group now extends beyond its original wallet-and-lending
              structure into investments, digital assets, enterprise services, and cash-to-digital payment
              infrastructure. Independent offer-period reporting puts GCash at 41.5 million monthly active users, or 56
              percent of the Philippine adult population, and 7.5 million active borrowers, or 18 percent of monthly
              active users. Those are activity denominators, not registered-customer counts. The assigned evidence does
              not establish Mynt's headquarters, headcount, or physical-location footprint, so those cover metrics
              remain explicit gaps rather than inferred facts.
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO014
