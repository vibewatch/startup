      - number: '4.2'
        title: Unit Economics, Balance Sheet Lending, and Credit Risk Profile
        blocks:
          - type: paragraph
            body: >-
              Lending represents Mynt's fastest-growing monetization vector, expanding 48% year-on-year in revenue
              during Q1 2026. However, this growth introduces substantial balance-sheet risk because 87.7% of Mynt's
              total loan portfolio sits directly on its own books rather than being routed to external balance sheets or
              dedicated banking partners. As of Q1 2026, on-book credit exposure reached approximately $925 million
              across uncollateralized lending products including GLoan, GGives, Borrow Load, and GLoan Sakto. Because
              these microloan products are completely unsecured and not collateralized, guaranteed, or insured,
              non-performing loans stood at 5.1% as of Q1 2026. This credit exposure is further concentrated in
              vulnerable consumer demographics, as 92% of Mynt's user base comes from lower-income groups and 78%
              resides outside Metro Manila, creating potential asset-quality volatility during macro downturns.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI007
              - CI008
              - CI009
      - number: '4.3'
        title: Historical Earnings, Capital Adequacy, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Mynt demonstrated foundational profitability by generating PHP 6.7 billion in net income in 2023,
              expanding to $284 million (PHP 17.2 billion) on $1.31 billion (PHP 79.7 billion) in full-year 2025
              revenue. The company raised primary capital in August 2024 at a $5 billion post-money valuation from Ayala
              Corporation and MUFG Bank, each acquiring 8% equity stakes. While recent capital-markets reporting
              indicates plans to raise up to $1.5 billion in an October 2026 IPO at an $8 billion to $10.7 billion
              valuation, primary capital proceeds destined for the company's own treasury represent only PHP 16.1
              billion ($264 million), with the vast majority serving as secondary liquidity for existing investors.
              Diligence on forward capital adequacy remains encumbered by the absence of prospectus-grade standalone
              audited financial statements, credit loss provisioning schedules, and detailed active-user transacting
              denominators.
            claimRefs:
              - CI001
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Balance Sheet Credit Exposure in Uncollateralized Microloans
            body: >-
              With 87.7% of its $925 million loan book retained on balance sheet and 92% of users belonging to
              lower-income groups, Mynt carries direct underwriting risk for a 5.1% NPL portfolio that is entirely
              uncollateralized and uninsured.
            calloutType: risk
            claimRefs:
              - CI007
              - CI009
              - CI010
          - type: callout
            title: Regulatory Headwind Induced a Structural Revenue Pivot
            body: >-
              The August 2025 regulatory shutdown of in-app online gambling games depressed payment take rates from
              0.31% to 0.25%, forcing Mynt to rely on higher-margin credit products to sustain revenue growth.
            calloutType: insight
            claimRefs:
              - CI004
              - CI005
              - CI006
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Scope and Customer Workflows
        blocks:
          - type: paragraph
            body: >-
              GCash is a transaction-led financial-services interface rather than a single-purpose wallet. Mynt's
              prospectus describes payments and transfers as the entry workflow, followed by credit, savings,
              investments, insurance, merchant services, and international remittance or spending functions [CE001]. The
              corporate surface separates delivery among GXI for the wallet, Fuse for lending, Ryse for investments,
              BlockG for digital assets, Sprynt for data-enabled customer engagement, and ECPay for the
              physical-to-digital payment network [CE002]. FinTech Futures independently corroborates the core GXI/Fuse
              split, but the wider module map remains company-described [CE003]. This breadth can increase engagement,
              yet it also expands the number of regulated entities, counterparties, and operational handoffs that must
              work together for a customer to complete an end-to-end task.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE005
              - CE007
              - CE008
              - CE014
      - number: '5.2'
        title: Architecture, Integration, and Reliability
        blocks:
          - type: paragraph
            body: >-
              Mynt says it has built a proprietary Philippine application layer while using established global
              technology providers. The disclosed transaction path depends on national clearing infrastructure,
              including InstaPay and PESONet, plus cash-in/cash-out partners, card networks, bill-payment and remittance
              aggregators, settlement banks, and partner banking APIs [CE005]. An implementation partner, Exist, says it
              advised on application architecture and developed the gateway for Mynt's micro-payment app, providing a
              concrete practitioner signal but not a current architecture audit [CE004]. The prospectus reports 99.88%
              availability for core transactional and fund-flow services during the six months ended June 30, 2026,
              explicitly including internal services and external integrations [CE006]. That metric is useful but
              company-reported, scoped to a six-month period, and not accompanied in this pool by incident counts,
              recovery-time measures, regional redundancy evidence, or an independent service-level attestation.
            claimRefs:
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE007
              - CE008
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.3'
        title: Technology Differentiation and Roadmap
        blocks:
          - type: paragraph
            body: >-
              The strongest technical differentiation claim is the combination of identity, transaction, and behavioral
              data inside one distribution surface. Mynt says its eKYC flow can auto-approve eligible applications in
              under five minutes and integrated with the Philippine Statistics Authority's National ID Authentication
              Services in May 2025 [CE007]. It also describes GScore as a proprietary trust score derived from GCash
              behavior and usage to support credit decisions for users without conventional histories [CE008]. These
              capabilities are difficult to evaluate from marketing alone: the pool contains no independent
              discrimination, calibration, or fairness study. The current roadmap broadens both use cases and
              automation, with named initiatives including GCash Commute QR, Scan to Order, Food Hub, GJobs, and
              GTourist [CE013]. Mynt also says it intends to move Pera Coach and Gigi toward agentic, user-authorized
              financial tasks [CE012], raising the diligence bar for authorization boundaries, rollback, auditability,
              and human escalation.
            claimRefs:
              - CE007
              - CE008
              - CE012
              - CE013
      - number: '5.4'
        title: Trust Controls and Product Risk
        blocks:
          - type: paragraph
            body: >-
              The prospectus describes layered account protection: a Security Center, Double Safe facial liveness
              checks, single-device Account Secure controls, in-app payment authorization, App Protect device-integrity
              monitoring, and a real-time Fraud Management System [CE010]. It also states that AI initiatives operate
              under a framework emphasizing data privacy, algorithmic fairness, and human oversight [CE011]. Those are
              control-design claims, not evidence that the controls consistently prevent loss. Credit adds a measurable
              product risk: Asia Tech Review reported that 87.7% of the loan portfolio, about $925 million, sat on
              Mynt's own books in Q1 2026 [CE014], and reported a 5.1% non-performing-loan ratio for that quarter
              [CE015]. The later prospectus reported 4.9% as of June 30, 2026 [CE009]; the differing dates should not be
              treated as a contradiction or blended into one metric. Finally, a Straits Times ranking item is explicitly
              labeled issuer-responsible press-release content, so it cannot serve as an independent technology
              benchmark [CE016].
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A Specific, Integrated Control Stack
            body: >-
              The filing names concrete identity, device, transaction, and fraud controls rather than relying only on a
              generic security claim [CE007, CE010]. The next diligence step is effectiveness testing, not another
              feature inventory.
            calloutType: strength
            claimRefs:
              - CE007
              - CE010
          - type: callout
            title: Company Metrics Need Independent Assurance
            body: >-
              The 99.88% availability result and the control framework are company-reported; this evidence set does not
              contain independent uptime, penetration-test, incident-response, or model-validation results [CE006,
              CE011].
            calloutType: risk
            claimRefs:
              - CE006
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Demographic Reach
        blocks:
          - type: paragraph
            body: >-
              Mynt's customer footprint is characterized by mass-market penetration across historically underserved and
              unbanked populations throughout the Philippines. A substantial 78% of GCash's user base is located outside
              Metro Manila, demonstrating deep regional and provincial reach beyond the urban capital. Furthermore, 92%
              of users originate from lower-income brackets, establishing the platform as the primary digital financial
              gateway for base-of-pyramid consumers rather than an affluent niche product. Operating under its corporate
              vision of 'Finance for All', Mynt coordinates retail wallet activity through G-Xchange, Inc. (GXI) and
              financial inclusion credit through Fuse Lending, effectively functioning as a quasi-bank for millions of
              unbanked citizens.
            claimRefs:
              - CU001
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
      - number: '6.2'
        title: Adoption Trajectory and Active Engagement Metrics
        blocks:
          - type: paragraph
            body: >-
              While marketing statements highlight more than 94 million registered accounts, verified adoption centers
              on an active transacting user core of over 40 million monthly active users (MAUs). This user base drives
              transactions across a broad commercial network exceeding 6 million partner merchants and social sellers
              nationwide. User engagement has transitioned from peer-to-peer transfers and prepaid airtime top-ups into
              an expansive daily cashless ecosystem. This scale of domestic adoption earned Mynt international
              recognition in August 2026, when CNBC and Statista named it among the World's Top Fintech Companies 2026
              in the Payments category, distinguishing it as the only Philippine fintech firm to achieve this ranking.
            claimRefs:
              - CU002
              - CU003
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU013
      - number: '6.3'
        title: Named Commercial Customer Proof and Partner Ecosystem
        blocks:
          - type: paragraph
            body: >-
              Commercial adoption is anchored by strategic shareholder channels and widespread merchant acceptance.
              Telecom parent Globe Telecom provides default airtime distribution and subscriber loading, while Ayala
              Corporation embeds GCash checkout across its national shopping mall, real estate, and retail networks.
              Institutional validation expanded further in 2024–2026 as Japan's Mitsubishi UFJ Financial Group (MUFG)
              committed to an 8% equity stake and brought Mynt into the MUFG Openly-connected Digital Ecosystem (MODE).
              On the ground, acceptance spans more than 6 million merchants, ranging from large corporate retail chains
              to informal micro-merchants and social sellers transacting via QR Ph standards.
            claimRefs:
              - CU003
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU009
              - CU011
              - CU012
      - number: '6.4'
        title: Customer Journey Expansion, Credit Monetization, and Durability Risks
        blocks:
          - type: paragraph
            body: >-
              Customer lifecycle progression relies on converting basic mobile wallet users into multi-product financial
              consumers across savings, credit, investment, and insurance verticals. However, monetization durability
              faces headwinds from regulatory shifts and rising credit exposure. In August 2025, Philippine regulators
              halted in-app access to online gambling platforms, triggering a payment revenue slump that reduced Mynt's
              payment take rate from 0.31% in Q1 2025 to 0.25% in Q1 2026. Consequently, payment revenue shrank to 57%
              of total revenue in Q1 2026. To offset this stagnation, Mynt expanded its credit vertical by 48%
              year-on-year, retaining 87.7% ($925 million) of its loan book on its own balance sheet. Because these
              consumer loans are unsecured and uncollateralized, a 5.1% non-performing loan rate introduces significant
              asset quality risks.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU006
              - CU010
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Provincial Adoption and Base-of-Pyramid Reach
            body: >-
              GCash has successfully penetrated beyond Metro Manila, with 78% of users residing in provincial regions
              and 92% originating from lower-income brackets, establishing the platform as an indispensable financial
              utility.
            calloutType: insight
            claimRefs:
              - CU001
              - CU014
          - type: callout
            title: Credit Risk Escalation and Take-Rate Compression
            body: >-
              As payment monetization softened due to regulatory restrictions on online gambling, Mynt has pivoted
              aggressively toward lending; however, holding 87.7% of its $925 million uncollateralized loan portfolio
              directly on its own balance sheet with a 5.1% non-performing loan rate introduces significant credit
              cyclicality.
            calloutType: risk
            claimRefs:
              - CU004
              - CU005
              - CU006
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Executive Risk Taxonomy and Residual Exposure Profile
        blocks:
          - type: paragraph
            body: >-
              Evaluating Mynt requires disaggregating its high-volume transactional payments utility from its
              accelerating balance-sheet credit exposure and complex regulatory status. While flagship operating
              subsidiary G-Xchange Inc. (GXI) provides ubiquitous digital payments and transfers across the Philippines,
              the firm's growth trajectory and margin profile face compounding structural headwinds. Specifically,
              regulatory restrictions enacted on online gaming transactions have directly compressed payment take rates,
              shifting top-line reliance toward lending subsidiary Fuse Lending. Because the overwhelming majority of
              lending volume is retained on Mynt's own balance sheet rather than syndicated to partner banks, credit
              default escalation represents the single largest downside vulnerability. Furthermore, elevated foreign
              shareholder ownership approaching 65% and antitrust scrutiny over ecosystem acquisitions introduce
              meaningful regulatory friction. Capital markets execution also faces valuation compression, as recent
              transactions price the business at approximately $7 billion against earlier elevated targets of $8 billion
              to $11 billion.
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR007
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR005
              - CR007
              - CR014
              - CR015
      - number: '7.2'
        title: Regulatory Bans, Foreign Equity Limits, and Legal Exposures
        blocks:
          - type: paragraph
            body: >-
              Mynt operates within an increasingly stringent Philippine regulatory framework that actively constrains
              payments monetization and corporate structure. A pivotal regulatory event occurred when the domestic
              regulator halted in-app access to online gambling games. This targeted restriction directly reduced Mynt's
              payment take rate from 0.31% in Q1 2025 to 0.25% in Q1 2026, stalling payment revenue growth and lowering
              payments to 57% of total company income. On the corporate governance front, foreign entities currently
              hold just under 65% of Mynt's equity capital, including major stakes held by Ant Group, MUFG Bank, Warburg
              Pincus, and Bow Wave. This concentration tests Philippine statutory foreign ownership ceilings applicable
              to public financial infrastructure, necessitating careful structuring between local conglomerates Ayala
              Corporation and Globe Telecom. Simultaneously, the Philippine Competition Commission initiated closer
              review into Mynt's proposed acquisition of electronic commerce network ECPay to assess market power
              concentration, while persistent online investment scams and brand impersonation require ongoing consumer
              advisories and fraud mitigation.
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR010
              - CR011
      - number: '7.3'
        title: Unsecured Lending Concentration and Credit Quality Deterioration
        blocks:
          - type: paragraph
            body: >-
              To offset stagnating transaction payments, Mynt has aggressively expanded lending subsidiary Fuse Lending,
              achieving 48% year-over-year credit revenue expansion in Q1 2026. However, this growth introduces severe
              balance-sheet fragility. Rather than acting as a capital-light origination marketplace that offloads
              default risk to institutional balance sheets, Mynt holds 87.7% of its total loan portfolio on its own
              books, representing approximately $925 million in direct exposure as of Q1 2026. The underlying credit
              products—including GLoan, GGives, Borrow Load, and GLoan Sakto—are entirely unsecured, uncollateralized,
              and devoid of third-party guarantees or credit insurance. Consequently, non-performing loans (NPLs) rose
              to 5.1% in Q1 2026. This credit deterioration is exacerbated by borrower demographics, as 92% of GCash
              users belong to lower-income segments and 78% reside outside Metro Manila, leaving repayment performance
              highly sensitive to inflation, weather disruptions, and regional economic volatility.
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR007
              - CR008
              - CR011
      - number: '7.4'
        title: Strategic Partner Dependencies, IPO Structure, and Diligence Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Mynt's operational model remains heavily dependent on its founding shareholders and strategic distribution
              partners. Originating in 2015 as a joint venture among Globe Telecom, Ayala Corporation, and Ant
              Financial, the company relies heavily on Globe for subscriber acquisition and data channel integration,
              and on Ant Group for technical architecture and cross-border payment connectivity. In capital markets,
              Mynt's proposed $1.5 billion initial public offering is heavily weighted toward secondary share exits for
              early financial backers, providing only PHP 16.1 billion ($264 million) in net primary proceeds to the
              operating business. Furthermore, valuation indications have compressed from an initial $8 billion to $11
              billion range down to approximately $7 billion in recent reported pricing. Transparent financial
              disclosure remains constrained prior to public trading, with registry platforms displaying no standardized
              standalone figures under the PSE:GCASH ticker. Diligence kill criteria must focus on Fuse Lending NPL
              spikes exceeding 7.0%, adverse regulatory actions regarding foreign equity limits, or additional
              regulatory interventions in digital payment fees.
            claimRefs:
              - CR001
              - CR009
              - CR012
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR009
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Balance-Sheet Credit Exposure Creates Asymmetric Downside
            body: >-
              Mynt's transition from pure-play transaction payments to high-margin lending has introduced substantial
              balance-sheet credit exposure. With 87.7% of its $925 million loan book retained on its own books and
              non-performing loans already standing at 5.1%, Fuse Lending operates without credit insurance or
              collateral guarantees across lower-income consumer segments, creating vulnerability to macro shocks.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: callout
            title: Require Prospectus-Grade Cohort Disclosures Before Full Capital Commitment
            body: >-
              Given that primary capital raised for Mynt in the planned IPO is limited to $264 million while pre-IPO
              investors seek multi-billion-dollar exits, investors should condition participation on full audited
              disclosure of vintage default curves, charge-off policies, and PCC regulatory conditions.
            calloutType: recommendation
            claimRefs:
              - CR010
              - CR013
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Core Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Mynt stands as the undisputed market leader in Philippine digital financial services, anchored by the
              GCash ecosystem serving 39.1 million monthly active users and settling ₱17.0 trillion in annual gross
              transaction value [CV001, CV005]. The bull investment thesis centers on this impregnable consumer reach,
              which propelled full-year 2025 revenues to ₱79.8 billion and generated ₱17.2 billion in net profit,
              reflecting 56% year-on-year earnings growth [CV005]. Furthermore, strategic rounds in 2024 from MUFG Bank
              and Ayala Corporation at a $5 billion post-money valuation validated institutional support for Mynt's
              transition from a payment gateway into a diversified credit, wealth, and merchant platform [CV010].
              Conversely, the core anti-thesis highlights structural growth and balance-sheet vulnerabilities [CV012].
              Following a domestic regulatory ban on in-app online gambling games, core payments take rates deteriorated
              from 0.31% to 0.25%, stalling sequential payment expansion [CV007]. To sustain top-line momentum, Mynt has
              pivoted aggressively into digital lending, retaining 87.7% of its $925 million loan book directly on its
              own balance sheet with a 5.1% non-performing loan ratio on uncollateralized consumer debt [CV008, CV009].
              This shifts Mynt's profile toward an unhedged consumer credit risk vehicle [CV012].
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.2'
        title: Recommendation, Valuation Stance, and Public Offering Pricing
        blocks:
          - type: paragraph
            body: >-
              We assign Mynt an investment recommendation of track with a high risk rating and a stretched valuation
              stance [CV012]. In October 2026, Mynt priced its initial public offering on the Philippine Stock Exchange
              at ₱6.60 per share, raising up to ₱60.9 billion ($973 million) inclusive of the overallotment option
              [CV002]. While this represented the largest maiden share sale in the Philippines since 2021, the offer
              price marked a 33% reduction from the initial ceiling price of ₱10.00, reflecting soft domestic equity
              sentiment as the PSE index tumbled 7% year-to-date [CV002]. Across 66.9 billion post-IPO common shares,
              the ₱6.60 price implies an equity valuation of ₱441.5 billion, or approximately $7.6 billion to $7.8
              billion, trading at roughly 25x trailing 2025 net profit [CV002, CV003, CV011]. Institutional demand was
              solidified by 20 cornerstone investors committing roughly ₱36.5 billion (70% of firm shares), led by
              BlackRock, Schroders, Lazard, and BPI Asset Management [CV006]. However, capital allocation discipline
              raises significant red flags: Mynt itself will receive only ₱10.6 billion ($170 million) from 1.6 billion
              primary shares, meaning 83% of gross proceeds will be absorbed by cashing-out selling shareholders,
              including Ant Financial, Warburg Pincus, and company executives [CV003, CV004]. The absence of primary
              capital reinvestment combined with full valuation multiples suggests limited margin of safety for public
              investors [CV011, CV012].
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: 'Scenario Analysis: Bull, Base, and Bear Valuations'
        blocks:
          - type: paragraph
            body: >-
              Evaluating Mynt's medium-term prospects yields a probabilistic equity valuation envelope spanning $5.2
              billion to $10.0 billion [CV014]. In the bull case (20% probability), payment take rates stabilize and
              re-accelerate toward 0.30% via high-margin merchant software and remittance corridors, while lending
              credit loss provisioning remains contained below 4.0% of total loans, propelling 2026 net profit to ₱22
              billion ($380 million) and unlocking an equity value of $10.0 billion to $11.0 billion [CV007, CV008,
              CV011, CV014]. In the base case (55% probability), payment take rates settle at 0.25%, top-line payments
              growth remains modest, and credit losses remain elevated at 5.0% to 5.5% on-book, holding 2026 earnings
              around ₱18 billion ($310 million); this scenario supports an equity valuation of $7.5 billion to $7.8
              billion (24x P/E), aligning with the finalized ₱6.60 IPO pricing [CV002, CV005, CV007, CV009, CV011,
              CV014]. In the bear case (25% probability), consumer delinquency on uncollateralized micro-loans spikes
              above 7.0%, forcing extensive loan impairment charges that compress net profit to ₱12 billion ($205
              million) [CV008, CV009]. Under multiple contraction down to 24x trough earnings, equity value retreats to
              $5.0 billion to $5.5 billion, revisiting the August 2024 private financing benchmark [CV010, CV014].
            claimRefs:
              - CV002
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
      - number: '8.4'
        title: Comparable Benchmarks, Downside Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              In a regional context, Mynt's public debut establishes a critical valuation benchmark for Ant Group's
              Southeast Asian wallet network, including Touch 'n Go in Malaysia, DANA in Indonesia, and TrueMoney in
              Thailand, as well as domestic Philippine competitor Maya [CV003, CV006]. While Mynt exhibits superior
              profitability compared to unlisted regional peers, its trading valuation at 25x earnings commands a
              premium that leaves no cushion for operational missteps [CV011, CV012]. We establish specific thesis-break
              triggers that would prompt a downgrade to avoid: non-performing loans climbing above 7.0% across Fuse
              Lending, additional regulatory caps on interchange or domestic fund transfer fees, or aggressive
              post-lockup secondary selling by private equity sponsors [CV004, CV008, CV009, CV013]. Priority diligence
              asks require examining Fuse Lending's standalone audited cash flows, granular vintage loss curves across
              lower-income borrowers, and the precise expiration schedule of secondary share lock-up covenants [CV004,
              CV008, CV013].
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Stance: Track Pending Credit and Secondary Overhang Resolution'
            body: >-
              Although Mynt's market dominance and 2025 net profit of ₱17.2 billion establish exceptional financial
              scale, public investors should track rather than buy at the ₱6.60 IPO level. With 83% of gross IPO
              proceeds flowing to cashing-out selling shareholders, 87.7% of the loan portfolio uncollateralized
              on-balance sheet, and take rates declining from 0.31% to 0.25%, the risk-adjusted return profile warrants
              waiting for audited credit vintage seasoning and post-listing float stabilization [CV002, CV003, CV007,
              CV008, CV012].
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV012
          - type: callout
            title: Unsecured Balance-Sheet Credit and Regulatory Take-Rate Vulnerability
            body: >-
              Mynt's transition into balance-sheet lending introduces meaningful credit risk, with 5.1% NPLs on $925
              million of uncollateralized loans as of Q1 2026. Simultaneously, regulatory intervention banning in-app
              online gaming has proven that payment take rates can compress abruptly, highlighting the fragility of fee
              margins under shifting Philippine regulatory policy [CV007, CV008, CV009, CV013].
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV013
