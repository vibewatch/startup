      - number: '1.4'
        title: Milestone Evolution, Regulatory Headwinds, and Pre-IPO Diligence
        blocks:
          - type: paragraph
            body: >-
              As of the October 13 run date, the offer period had closed but the PSE listing was still scheduled for
              October 20 under ticker GCASH; describing the listing as completed would be premature. The base offer
              comprised about 8.03 billion shares at P6.60 and was expected to raise about P53 billion, with total
              proceeds reaching about P60.9 billion if the over-allotment option were fully exercised. Mynt itself
              expected P10.6 billion of gross primary proceeds, while most base shares were secondary, so total offer
              proceeds should not be confused with cash entering the company. The growth case also carries concentration
              and regulatory risk. Asia Tech Review reported that the regulator's removal of in-app online-gambling
              access coincided with the payment take rate falling from 0.31 percent in Q1 2025 to 0.25 percent in Q1
              2026. It also reported that 87.7 percent of a roughly $925 million Q1 2026 loan portfolio was held on
              Mynt's books, the products were unsecured, and 5.1 percent of loans were non-performing.
            claimRefs:
