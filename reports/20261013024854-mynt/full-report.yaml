    Mynt is the Philippine fintech group behind GCash, combining mass-market payments, transfers, merchant acceptance,
    consumer lending, and adjacent financial services under one ecosystem. The company now operates at large scale and
    is profitable, but it remains pre-IPO and still leaves investors with incomplete visibility into governance, capital
    structure, and credit-quality durability.
