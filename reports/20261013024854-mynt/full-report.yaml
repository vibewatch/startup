      - number: '1.2'
        title: Leadership, Governance, and Key-Person Architecture
        blocks:
          - type: paragraph
            body: >-
              Mynt's August 2026 company-issued release identifies Martha Sazon as president and chief executive
              officer, and Manila Standard independently identifies the same role in its October IPO coverage. The
              assigned pool does not identify a board chair, other directors, committee memberships, executive bench,
              succession plan, or reporting lines. It therefore supports verification of the chief executive but not a
              complete leadership roster or a judgment that the board is independent. That distinction matters as Mynt
              moves from sponsor-backed private ownership toward public-market governance, because investors need to
              understand who controls nominations, risk oversight, related-party transactions, and regulated lending
              decisions. Key-person dependence cannot be quantified from a single disclosed executive. Final prospectus
              governance disclosures, board charters, and management biographies are the appropriate diligence path
              rather than filling missing roles from stale or indirect material.
            claimRefs:
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO008
      - number: '1.3'
        title: Capitalization History, Ownership Structure, and Strategic Backers
        blocks:
          - type: paragraph
            body: >-
              Mynt's financing history progressed from a $300 million round in 2021 to a 2024 transaction that FinTech
              Futures reported as $393 million each from MUFG Bank and Ayala Corporation, taking the private valuation
              to $5 billion. Asia Tech Review reported more than $1.2 billion of cumulative capital raised by June 2026
              and foreign ownership just under 65 percent, but those secondary-source figures are not a current audited
              cap table or a measure of cash still available. In September 2026, TechNode Global reported commitments
              from more than 20 domestic and global cornerstone investors for approximately the institutional tranche of
              the proposed IPO. The commitments remained subject to reallocation, pricing, regulatory requirements,
              market conditions, and closing; they were not completed secondary-market purchases. This sponsor base
              broadens institutional validation but leaves material questions about post-offer voting control,
              selling-shareholder proceeds, lockups, and the final stakes held by Globe, Ayala, Ant Group, MUFG, and
              financial sponsors.
            claimRefs:
              - CO003
              - CO005
              - CO013
              - CO015
              - CO016
