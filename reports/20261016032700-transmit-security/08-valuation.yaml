schemaVersion: "report-v2"
artifact: valuation
slug: transmit-security
runDate: 2026-10-16
company:
  name: Transmit Security
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence still supports that Transmit Security built a real enterprise
    identity platform and reached large historical financing and revenue
    milestones, but the valuation anchor remains stale. The assigned 2026 pool
    shows no disclosed current ARR, retention, margin, cap-table terms, or IPO
    timeline, so the price-sensitive call remains research-more with an
    expensive stance and high underwriting risk.
sections:
  - id: investment-call
    title: Investment call and thesis balance
    body: >-
      The evidence supports a serious enterprise identity platform rather than a
      speculative concept. Transmit Security's current product pages still show
      orchestration, authentication, fraud, and identity-verification breadth,
      while third-party pricing captures six-figure annual entry points that fit
      an enterprise sales motion. The problem is not product relevance; it is
      valuation confidence. The latest public financing anchor in the assigned
      pool is still the June 2021 Series A at a reported $2.2 billion valuation,
      and the freshest revenue proof is a company-issued August 2022 statement
      that ARR exceeded $100 million. Without a newer valuation mark, current
      financial disclosures, or clear liquidity path, the underwriting posture
      should stay research-more rather than buy.
    claimRefs: [CV001, CV002, CV003, CV004, CV007, CV012, CV013, CV014]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: valuation-context
    title: Valuation context and entry discipline
    body: >-
      The financing context is still dominated by the outsized 2021 Series A,
      which gave the company a premium cybersecurity valuation during a much
      richer software market. Public evidence in this pool shows the company has
      maintained broad product ambition, enterprise packaging, and a live hiring
      engine that includes stock-option compensation, but it does not reveal the
      current preference stack, option-pool size, secondary pricing, or whether
      any later insider or structured financing reset the effective mark. The
      privacy statement also shows the platform carries controller and biometric
      data responsibilities that matter for enterprise diligence and could add
      compliance cost if growth slows. Entry discipline therefore has to assume
      valuation opacity and require fresh private-market evidence before treating
      the 2021 unicorn mark as a dependable 2026 reference point.
    claimRefs: [CV001, CV003, CV005, CV006, CV010, CV011, CV012, CV013, CV014]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and final diligence asks
    body: >-
      The bull case depends on Transmit Security turning platform breadth,
      enterprise pricing, and historical growth into a much larger recurring
      revenue base than the public record shows today. The base case assumes the
      company is strategically valuable but still too opaque on current
      financials and financing terms for a clean price call. The bear case is
      that historical momentum has slowed, implementation-heavy enterprise
      delivery constrains margins, and the last known valuation remains above
      what a refreshed market clearing price would support. Exit readiness is
      also weakly evidenced because the assigned pool explicitly says no IPO
      timeline has been announced. The next diligence step is therefore not to
      debate product quality, but to obtain current ARR, retention, gross
      margin, customer concentration, and cap-table evidence that could reprice
      the recommendation.
    claimRefs: [CV002, CV003, CV007, CV008, CV009, CV011, CV012, CV013, CV014]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - ["Recommendation", "research-more", "Real product breadth and enterprise pricing, but stale valuation support", "Do not underwrite a new check from public evidence alone"]
      - ["Confidence", "medium", "Several corroborating public signals, but critical financial inputs are missing", "Use diligence to upgrade or downgrade the call"]
      - ["Risk rating", "high", "Valuation opacity, privacy/compliance obligations, and no visible liquidity timetable", "Assume downside asymmetry until updated metrics are disclosed"]
      - ["Valuation stance", "expensive", "Last visible mark is the 2021 $2.2B Series A; no later public reset or supporting 2026 mark appears in the retained pool", "Need a better entry price or fresher private evidence"]
    notes: >-
      Analytical synthesis of retained public evidence as of the 2026-10-16 run;
      this table intentionally converts source facts into an investment posture
      rather than repeating a single disclosed metric.
    claimRefs: [CV001, CV002, CV007, CV012, CV013, CV014]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - ["Thesis: platform breadth is real", "Official product pages and partner descriptions show orchestration, authentication, fraud, and identity verification in one stack", "Independent usage proof and current module-level adoption data would strengthen conviction"]
      - ["Thesis: enterprise monetization can be meaningful", "2026 captured pricing starts at $50k-$200k annually depending on module and volume", "Current ARR, NRR, and gross-margin disclosure would show whether pricing translates into scalable economics"]
      - ["Anti-thesis: the public valuation anchor is stale", "The visible financing marker is still the June 2021 $543M Series A at a reported $2.2B valuation", "A current primary or secondary mark with terms could validate or reset the reference price"]
      - ["Anti-thesis: exit evidence is thin", "A 2026 IPO tracker still says no IPO date or timeline has been announced", "A filed process, disclosed timetable, or credible strategic-interest evidence would improve exit optionality"]
    notes: >-
      Rows pair positive and negative underwriting signals; they are analytical
      judgments built from multiple retained sources, not verbatim source claims.
    claimRefs: [CV001, CV002, CV003, CV004, CV007, CV009, CV012, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - ["Bull", "Historical >$100M ARR milestone understates current scale; platform breadth wins more large regulated enterprises; pricing floors hold", "Upside requires that current ARR, retention, and margin support a premium software multiple above what public evidence alone proves", "Would improve if management discloses strong 2025-2026 ARR growth and clean cap-table terms", "Growth stalls, or new terms reveal heavy preference or secondary pressure"]
      - ["Base", "Company remains strategically relevant, but public proof is still mostly historical or company-issued", "Fair value should be judged only after fresh private metrics and financing terms are reviewed; until then entry should stay disciplined", "Most consistent with stale public mark, 2026 pricing proof, and absent IPO timetable", "Another year passes without fresh financial disclosure or liquidity progress"]
      - ["Bear", "2021-2022 momentum has faded; implementation intensity and compliance burden weigh on margins; prior mark has not cleared in today's market", "A reset or down-round would imply poor returns from the last visible unicorn valuation and compress exit optionality", "Would gain weight if current revenue is materially below the trajectory implied by the 2022 press release", "Weak renewal, concentration, or fundraising terms surface in diligence"]
    notes: >-
      Scenario rows are not disclosed company forecasts. They translate retained
      evidence and documented gaps into underwriting frames, so missing private
      inputs remain explicit rather than estimated away.
    claimRefs: [CV001, CV002, CV003, CV007, CV008, CV011, CV012, CV013, CV014]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation stays cautious because real product and pricing signals
      are outweighed by stale valuation support and missing 2026 financial
      transparency.
    data:
      nodes:
        - id: product-breadth
          label: Product breadth
          value: "Orchestration, authentication, fraud, and identity verification"
        - id: enterprise-pricing
          label: Enterprise pricing floor
          value: "$50k-$200k annual starting packages"
        - id: historical-scale
          label: Historical scale proof
          value: ">$100M ARR and 40% H1 2022 revenue growth"
        - id: transparency-gap
          label: Transparency gap
          value: "No current ARR, NRR, margin, runway, or cap-table disclosure"
        - id: exit-gap
          label: Exit gap
          value: "No public IPO date or timeline disclosed"
        - id: decision
          label: Decision
          value: "Research-more / high risk / expensive"
      edges:
        - from: product-breadth
          to: historical-scale
        - from: enterprise-pricing
          to: historical-scale
        - from: historical-scale
          to: decision
        - from: transparency-gap
          to: decision
        - from: exit-gap
          to: decision
    approximationNotes: >-
      This figure is a qualitative logic chain rather than a weighted scoring
      model; it shows the sequence of underwriting signals, not a quantified
      probability tree.
    claimRefs: [CV002, CV003, CV004, CV007, CV013, CV014]
callouts:
  - calloutType: recommendation
    title: Recommendation
    body: >-
      Stay at research-more. The assigned evidence still supports meaningful
      product and enterprise-sales substance, but it does not support a fresh
      price-clearing valuation in 2026.
    claimRefs: [CV001, CV003, CV007, CV013, CV014]
  - calloutType: risk
    title: Main underwriting risk
    body: >-
      The biggest risk is paying against the 2021 unicorn mark without current
      ARR, retention, gross-margin, concentration, or preference-stack evidence.
    claimRefs: [CV001, CV011, CV012, CV013, CV014]
  - calloutType: assumption
    title: What would move the call
    body: >-
      A cleaner valuation view would require updated ARR, renewal, gross-margin,
      and cap-table evidence plus either a new financing mark or a credible
      liquidity path.
    claimRefs: [CV002, CV007, CV011, CV013, CV014]
