  evidenceGaps:
    - type: stale
      severity: material
      topic: growth
      missingEvidence: Current 2025-2026 ARR, revenue growth, and margin disclosure rather than the retained August 2022 milestone.
      whyItMatters: The underwriting question is whether the old $2.2B valuation still clears, and stale growth data cannot answer that.
      diligencePath: Request the latest board deck or audited KPI package with ARR, revenue, gross margin, and burn/runway detail.
      relatedQuestionRefs: [QV006, QV008]
    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: Current cap table, liquidation preferences, secondary pricing, and any structured-financing or insider-reset terms after 2021.
      whyItMatters: Entry returns can look acceptable on headline valuation while being materially worse after preference overhang or a hidden reset.
      diligencePath: Obtain the current cap table, financing documents, and any recent 409A, tender, or secondary references.
      relatedQuestionRefs: [QV007, QV008]
    - type: missing-source
      severity: material
      topic: commercial-quality
      missingEvidence: Current net retention, customer concentration, implementation intensity, and services mix by major vertical.
      whyItMatters: Enterprise pricing floors matter less if renewals, upsell, or delivery burden are weak.
      diligencePath: Ask for cohort retention, top-customer exposure, and deployment-resource metrics by segment.
      relatedQuestionRefs: [QV006, QV008]
    - type: missing-source
      severity: material
      topic: exit-readiness
      missingEvidence: Credible evidence of an IPO process, strategic-sale interest, or another liquidity pathway.
      whyItMatters: A private company at a premium historic mark needs a believable exit path to support venture returns.
      diligencePath: Ask management and lead investors for financing plans, expected holding period, and any formal liquidity preparations.
      relatedQuestionRefs: [QV002, QV008]
