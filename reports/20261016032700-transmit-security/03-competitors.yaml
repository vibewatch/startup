  rows:
  - - Transmit Security Full Mosaic Platform
    - Custom quote; pricing based on MAUs or event volume plus deployment architecture
    - Authentication, fraud prevention, orchestration, threat detection, SLA/support,
      integrations
    - No public dollar list price in the assigned sources
    - Budget discussions start late and complicate quick apples-to-apples comparisons
  - - Transmit module suites
    - Same quote-led model; sold as Identity, Fraud/TDR, or Identity Verification
      motions
    - Lets buyers start with a narrower problem while staying in one vendor family
    - Assigned sources do not show attach rates, discounting, or realized module mix
    - Cross-sell can increase switching costs after initial adoption
  - - PeerSpot pairwise comparisons
    - Setup-cost and licensing commentary, not normalized list pricing
    - Signals cost and onboarding are part of buyer evaluation
    - Narratives are inconsistent across pairwise competitor pages
    - Useful as directional pressure, not as benchmark-grade pricing evidence
  - - LoginRadius competitive framing
    - No comparable public pricing disclosed
    - Competes on broader built-in B2B depth, lower engineering overhead, and faster
      deployment
    - Issuer is a competitor and pushes its own shortlist logic
    - Transmit must defend total cost and implementation effort, not only feature
      breadth
  notes: This table mixes official packaging evidence with third-party directional
