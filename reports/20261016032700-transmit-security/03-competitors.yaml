callouts:
- calloutType: strength
  title: Transmit's moat case is integration breadth, not public pricing transparency
  body: 'The clearest defensible difference in the assigned pool is product bundling:
    orchestration, fraud operations, identity verification, and authentication sit
    under one vendor boundary, which can matter for regulated enterprises trying to
    reduce vendor sprawl.'
  claimRefs:
  - CP001
  - CP002
  - CP011
- calloutType: risk
  title: Competitors can attack deployment friction and TCO before feature parity
    is settled
  body: Because public pricing is quote-led and competitor-authored evidence repeatedly
    frames alternatives as easier to deploy or cheaper to start, Transmit may have
    to win a more expensive and more consultative sales process than narrower CIAM
    tools or Microsoft-native status quo paths.
  claimRefs:
  - CP003
  - CP008
  - CP010
  - CP013
