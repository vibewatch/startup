- id: TP002
  title: Feature / capability matrix
  columns:
  - Buying criterion
  - Transmit Security
  - Okta / Auth0
  - Ping / ForgeRock
  - Microsoft Entra ID
  - LoginRadius
  rows:
  - - Identity orchestration and journey design
    - Official pages make orchestration a core pitch, with drag-and-drop and AI-led
      journey design
    - Auth0 is framed as highly customizable and Okta as broad, but the assigned pool
      does not present them as orchestration-led
    - ForgeRock is framed as strong in orchestration; Ping is framed as modular enterprise
      IAM
    - Consumer flow flexibility is not the core strength in the assigned evidence
    - Competitive issuer highlights no-code orchestration and hosted journey design
  - - Built-in fraud prevention coupling
    - Official pages bundle fraud detection and response into the same product family
    - The assigned pool does not show equivalent built-in fraud coupling
    - Ping is discussed as broader enterprise IAM; the pool does not prove the same
      bundled fraud posture
    - The assigned pool does not show built-in fraud as a core differentiator
    - Competitive issuer argues broader CIAM completeness, not fraud-led bundling
  - - B2B / multi-tenant support
    - Official pricing and platform pages mention B2B and workforce identity motions
    - Public evidence in the pool is indirect rather than explicit
    - Public evidence in the pool is indirect rather than explicit
    - Public evidence in the pool is indirect rather than explicit
    - Competitive issuer explicitly markets built-in tenant isolation for B2B SaaS
  - - Regulated-enterprise trust posture
    - Privacy statement and pricing page highlight compliance reporting, audit logs,
      and processor/controller roles
    - Okta is framed as having strong enterprise trust and compliance posture
    - ForgeRock is framed as strong for banks and hybrid regulated environments
    - Microsoft benefits from enterprise governance and conditional access depth
    - No independent trust benchmark is provided in the assigned pool
  - - Deployment simplicity
    - Breadth may raise integration effort because the same stack spans fraud, orchestration,
      and identity
    - Auth0 emphasizes developer customization; Okta emphasizes integration breadth
    - Competitive evidence says ForgeRock can require specialized engineers and long
      implementations
    - Azure-native fit can simplify deployment for Microsoft-heavy buyers
    - Competitive issuer argues for faster implementation with less professional-services
      dependency
  - - Packaging flexibility
    - Full platform plus separate Identity, Fraud/TDR, and Verification suites with
      custom quotes
    - Peer comparisons imply simpler entry pricing for some alternatives but do not
      provide normalized list prices
    - Peer comparisons position Ping as competitively priced relative to some suites
    - Peer excerpts cite licensing concerns rather than transparent list pricing
    - The competitive article does not publish comparable pricing
  notes: '"Not shown in the assigned pool" means the chapter''s prefetched evidence
    did not support a confident yes/no conclusion, so those cells should be read as
    evidence limits rather than product absences.'
