  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: implementation-economics
      missingEvidence: Module-level implementation time, professional-services attach rates, and support staffing by deployment class.
      whyItMatters: Identity platforms can look modular in marketing but still require heavy services work that changes margin, time-to-value, and rollout risk.
      diligencePath: Request recent SOWs, deployment timelines, PS attach rates, and customer-by-customer go-live staffing for complex enterprise implementations.
      relatedQuestionRefs: [QE009]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: Public uptime SLOs, status-history disclosures, incident postmortems, or independently verified availability metrics.
      whyItMatters: Authentication, fraud, and verification systems sit on critical user journeys, so resilience evidence matters as much as feature breadth.
      diligencePath: Request SLA language, twelve-month uptime history, severity-one incident summaries, and release rollback procedures.
      relatedQuestionRefs: [QE009]
    - type: missing-source
      severity: material
      topic: benchmarked-performance
      missingEvidence: Independent benchmarks for fraud-model precision/recall, verification match rates, abandonment reduction, and support-cost impact.
      whyItMatters: Public materials document capability breadth, but underwriting product quality requires evidence that the integrated stack performs well in production.
      diligencePath: Request reference-call notes, third-party evaluations, and customer dashboards that show pre/post outcome deltas by module.
      relatedQuestionRefs: [QE009]
      relatedTableRefs: [TE002, TE003]
