schemaVersion: report-v2
artifact: product-tech
slug: transmit-security
runDate: 2026-10-16
company:
  name: Transmit Security
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Transmit Security's public product surface presents Mosaic as a modular identity platform that combines
    orchestration, CIAM/user management, authentication, fraud prevention, and identity verification rather
    than a single-point tool. The platform appears actively maintained through 2026 releases and clearly
    depends on APIs, standards integrations, and services support, but the assigned evidence set still
    underdocuments public uptime, implementation effort, and independently benchmarked performance.
sections:
  - id: platform-scope
    title: Platform scope and module coverage
    body: >-
      The official product pages describe Mosaic as a broad customer-identity platform, not a narrow
      authenticator. Transmit says one platform covers identity management, fraud prevention, and identity
      verification across the user lifecycle and across user-facing channels, while the FIDO showcase echoes
      the same "entire customer identity lifecycle" framing. In workflow terms, the documented scope spans
      onboarding, login, account recovery, session/profile management, and risk checks inside one control
      plane. That breadth is the core product story and the main differentiator repeated across official,
      partner, and third-party profile surfaces.
    claimRefs: [CE001, CE002, CE005, CE006, CE014]
    tableRefs: [TE001, TE002]
  - id: architecture-delivery
    title: Architecture, integrations, and delivery model
    body: >-
      Public materials point to a composable architecture that blends no-code orchestration with
      microservices-based identity services. The platform page describes drag-and-drop and natural-language
      journey design for registration, login, and payments, plus a CIAM layer for B2C and B2B lifecycle
      management. Partner materials add that deployments rely on APIs, SDKs, and standards integrations such
      as OAuth 2.0, OpenID Connect, SAML, and FIDO2, while the AWS Marketplace consulting offer makes clear
      that enterprises often buy implementation help rather than treating Mosaic as a plug-and-play utility.
      That combination suggests real flexibility, but also meaningful integration and change-management work.
    claimRefs: [CE003, CE008, CE009, CE010]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-roadmap
    title: Maturity and roadmap signals
    body: >-
      The assigned public evidence supports an "actively shipping" verdict more strongly than a "fully proven
      at scale" verdict. The 2026 release-notes surface shows updates in February, March, May, June, August,
      and September across identity orchestration, customer identity management, fraud prevention, identity
      verification, passwordless authentication, device management, and fraud operations. That cadence implies
      current product investment and expanding module depth. At the same time, most of the maturity proof in
      this pool is vendor-authored or partner-mediated, so release velocity is visible while operational
      quality, upgrade friction, and support burden remain less transparent.
    claimRefs: [CE007, CE010, CE013]
  - id: trust-privacy-risks
    title: Trust, privacy, and technical risks
    body: >-
      Trust and compliance controls are explicit parts of the public product story. Transmit's privacy
      statement says the company is usually a processor when enterprise customers use the platform to verify
      end users, but it also acts as a controller for Identity Network profile reuse and some service
      improvement use cases. The same policy confirms biometric handling and a stated retention limit of no
      more than one year after last service use. Those disclosures are useful, but the chapter's assigned
      sources still document privacy roles more clearly than they document public uptime commitments,
      independently measured fraud/verification accuracy, or customer-reported implementation effort.
    claimRefs: [CE011, CE012, CE013]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / product line
      - Primary user
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - [Identity Orchestration, Product and identity teams, Publicly current core module, "Drag-and-drop plus natural-language journey design across registration, login, and payments", "Request rollback/governance evidence and deployment examples for complex journeys"]
      - [User Management, Identity platform teams, Publicly current core module, "Microservices-based B2C and B2B lifecycle, profiling, consent, and self-service in one stack", "Need customer evidence on migration complexity from legacy identity silos"]
      - [Passwordless and secure authentication, Security and application teams, Publicly current core module, "Passkeys, mobile biometrics, OTP, magic links, and social login under one policy surface", "Need conversion, fallback, and account-lockout metrics by flow"]
      - [Fraud detection and response, Fraud and security operations, Publicly current core module, "AI-oriented fraud workflows embedded directly into identity journeys", "Need independent false-positive, recall, and investigation-efficiency benchmarks"]
      - [Identity verification, Onboarding and KYC teams, Publicly current core module, "Government-ID, document-ownership, biometric, AML/PEP, and age-verification workflows", "Need country coverage, manual-review rates, and failure-mode disclosures"]
      - ["Data validation / identity management", Operations and administrators, Publicly current core module, "Validation APIs plus elastic identity provider and admin visibility across sessions", "Need proof on data-source coverage and admin scalability under large migrations"]
    notes: Public module map synthesized from official, partner, and profile sources; differentiation is descriptive, and every gap is a diligence ask rather than a documented defect.
    claimRefs: [CE001, CE003, CE004, CE005, CE006, CE014]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow risk
      - Company solution
      - Measurable/public benefit
      - Limitation
    rows:
      - ["Register or open an account", "High onboarding fraud and KYC friction", "Identity orchestration plus verification and data validation", "Public evidence shows one vendor can connect onboarding and fraud controls", "Assigned sources do not provide pass-rate, abandonment, or review-cost deltas"]
      - [Login or step up authentication, "Password friction and MFA sprawl", "Passkeys, MFA, biometrics, social login, and risk-based authentication", "Documented breadth lets teams tailor UX/security mixes by channel", "No public login-success, reset, or support-ticket impact metrics in this pool"]
      - ["Recover an account or approve a risky action", "Manual review and account-takeover exposure", "Fraud detection plus identity verification inside the same journey", "Public materials show recovery and verification can share platform context", "No independent benchmark on attack-block rates or false positives in cited sources"]
      - ["Manage profiles, consent, and guest-to-user conversion", "Fragmented identity silos across apps and channels", "User management and identity management services", "Centralized lifecycle journeys and profile controls are explicitly documented", "No public migration-time or admin-productivity metrics in assigned evidence"]
    notes: Benefits are limited to what the cited product and partner materials actually document; missing quantitative outcomes remain explicit gaps.
    claimRefs: [CE002, CE003, CE004, CE005, CE006]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - ["Journey orchestration layer", "Designs registration, login, payment, and recovery flows", "Depends on connectors, policy logic, and governance over journey changes", "Public sources do not show rollback, testing, or release-governance depth"]
      - ["Core CIAM and user-management layer", "Handles onboarding, profiles, consent, and customer lifecycle", "Depends on a microservices platform and customer identity data model", "Legacy migration and identity-silo consolidation can be implementation-heavy"]
      - ["Authentication and fraud runtime", "Runs passkeys/MFA plus device and behavioral risk decisions", "Depends on signal quality, model tuning, and customer channel instrumentation", "False positives or brittle instrumentation can degrade UX in production"]
      - ["Verification and data-validation layer", "Executes document, biometric, AML/PEP, age, and data checks", "Depends on third-party data sources, regional coverage, and privacy controls", "Coverage gaps or regulator scrutiny can slow onboarding in sensitive markets"]
      - ["Services and support model", "Delivers implementation, integration, and optimization help", "Depends on customer stakeholders and professional-services capacity", "Heavy services involvement can lengthen time-to-value and raise delivery costs"]
    notes: This architecture table mixes documented platform layers with inferred operating dependencies; risks identify diligence priorities, not confirmed incidents.
    claimRefs: [CE003, CE008, CE009, CE010, CE013]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Public materials show a layered identity stack that starts with journey orchestration and ends with integrations and services dependencies.
    data:
      layers:
        - label: Experience orchestration
          detail: Designs customer journeys across registration, login, payments, and recovery.
          modules:
            - Drag-and-drop journey builder
            - Natural-language prompts
            - Embedded orchestration
          outputs:
            - Journey definitions
            - Automated identity and fraud workflows
        - label: Channel surfaces
          detail: The same identity journeys are meant to run across customer-facing channels.
          modules:
            - Web applications
            - Mobile applications
            - Call-center and omnichannel experiences
          outputs:
            - Shared customer journeys
            - Cross-channel identity consistency
        - label: Core identity services
          detail: Microservices-based CIAM handles onboarding, profiles, consent, and sessions.
          modules:
            - User Management
            - Identity Management
            - Authorization
          outputs:
            - Customer profiles
            - Session and access policies
        - label: Trust and risk controls
          detail: Authentication, verification, and fraud tooling execute inside the same user flow.
          modules:
            - Passkeys and MFA
            - Identity Verification
            - Fraud Detection and Response
            - Data Validation
          outputs:
            - Step-up decisions
            - Document and biometric checks
            - Risk decisions
        - label: Integration and delivery
          detail: APIs, standards integrations, and consulting services connect Mosaic to enterprise apps.
          modules:
            - APIs and SDKs
            - OAuth 2.0 / OIDC / SAML / FIDO2
          outputs:
            - Web, mobile, and API integrations
            - Compliance-aligned deployments
        - label: Governance and services
          detail: Consulting and operational support help customers implement and optimize deployments.
          modules:
            - Remote IAM consulting
            - Security hardening
            - Compliance alignment
          outputs:
            - Implementation packages
            - Customer-specific rollout support
    claimRefs: [CE003, CE004, CE005, CE006, CE008, CE009]
callouts:
  - calloutType: strength
    title: Integrated scope is the core product story
    body: >-
      The strongest consistent signal across official and partner materials is not a single killer feature; it
      is the claim that orchestration, authentication, fraud controls, and identity verification can be
      composed inside one customer-identity platform.
    claimRefs: [CE001, CE004, CE005, CE006, CE014]
  - calloutType: risk
    title: Operational proof trails module breadth
    body: >-
      The assigned pool makes integration standards, consulting support, and release cadence visible, but it
      still leaves public uptime, benchmark accuracy, and implementation-effort proof thinner than the product
      packaging itself.
    claimRefs: [CE007, CE009, CE010, CE013]
