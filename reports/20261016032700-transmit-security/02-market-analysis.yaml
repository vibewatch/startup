company:
  name: "Transmit Security"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Transmit Security's public market case is strongest as a large-enterprise CIAM and identity-orchestration platform with attached fraud and identity-verification budgets, not as a broad, source-backed standalone TAM story. The assigned pool supports enterprise price floors, peer-review/category placement, and regulated-industry buyer evidence, but it does not support a clean public TAM/SAM/SOM or a definitive public split between customer-identity core and workforce adjacency."
sections:
  - id: "market-boundary"
    title: "Market boundary and adjacent spend"
    body: |-
      The strongest source-backed boundary is customer identity and access management rather than generic cybersecurity or workforce-only IAM. Gartner places Transmit Security in an access-management category that is explicitly "transitioning to Customer Identity and Access Management (CIAM)," while the company and partner materials repeatedly describe the platform as a customer-identity stack that combines orchestration, fraud prevention, and identity verification. That means the included spend is customer onboarding, authentication, account recovery, fraud controls, and identity-proofing workflows, especially where those flows must work across channels and geographies. The clearest excluded spend is pure workforce passwordless software or generic security tooling that is not wired into customer journeys. One third-party comparison broadens the scope to workforce, B2B, and B2C in one platform, so workforce should be treated as an adjacent expansion path rather than the default market boundary until Transmit discloses package mix or revenue split by module.
    claimRefs: ["CM001", "CM002", "CM003", "CM004", "CM005"]
    tableRefs: ["TM001"]
  - id: "sizing-lenses"
    title: "Evidence-constrained sizing and enterprise budget lens"
    body: |-
      The assigned pool does not offer a credible standalone TAM, SAM, or SOM estimate, so the better approach is to preserve several narrower public lenses instead of inventing one giant market number. The first lens is category depth: Gartner shows Transmit participating across CIAM-adjacent review markets, and Tracxn counts a large competitive field, which supports the view that the company sells into a crowded but real identity stack budget. The second lens is contract size: a 2026 comparison page publishes entry pricing from $50,000 per 100,000 identity checks to $200,000 per year for the full platform, which points to enterprise-only budget ownership rather than SMB self-serve adoption. The third lens is installed-base scale: company and partner pages cite customer bases tied to more than $1.3 trillion and more than $2 trillion of annual commerce, but the figures do not reconcile cleanly and should be preserved as a range, not a precise current market-size claim. CheckThat.ai adds a fourth lens by calling its figures algorithmic estimates rather than verified disclosures, which is directionally useful but still not a disclosure-grade valuation signal.
    claimRefs: ["CM006", "CM008", "CM009", "CM010", "CM011", "CM012", "CM013", "CM014"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "buyers-drivers-constraints"
    title: "Buyer segmentation, adoption drivers, and constraints"
    body: |-
      The public buyer pattern skews toward large regulated enterprises, especially banks, insurers, retailers, and other customer-facing brands that need security, compliance, and low-friction digital journeys at the same time. The strongest adoption driver is consolidation: multiple sources position Mosaic as an orchestration layer that can combine authentication, fraud controls, and identity verification under one operating model, which is valuable when identity stacks are fragmented. The strongest adoption constraints are also visible in the pool: public entry pricing starts at enterprise levels, Gartner user feedback still flags SDK and custom-UX friction, and public marketing pages do not lay out a full certification list even though the privacy and identity-verification materials make clear that biometric, KYC, and controller-processor issues matter. In practice, that means valuation upside depends on whether buyers prefer one broader platform contract enough to offset implementation complexity and procurement diligence in regulated accounts.
    claimRefs: ["CM004", "CM006", "CM007", "CM008", "CM009", "CM015", "CM016"]
    tableRefs: ["TM003"]
