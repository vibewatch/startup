  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场参与者与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              现有证据将 Transmit Security 放入远超纯反欺诈工具的比较范围。Gartner 的替代清单列出 Okta Workforce Identity、Ping Identity
              Platform、Microsoft Entra ID 和 Oracle Access Management；LoginRadius 则从更深 的 CIAM 能力、B2B
              租户管理、开发者工具、数据驻留和运营简洁性来比较。这说明买方比较的不只是“身份加 反欺诈”专门厂商，也包括大型既有 IAM 套件、微软原生路径和轻量 CIAM 平台。独立案例研究和市场情报页面 将 Mosaic
              描述为面向大型客户部署的广泛 CIAM 技术栈，因此真正的候选名单不仅看功能对等，也看规模证明和 实施匹配度。微软占比较高或邻近员工场景的环境，现实默认方案可能是扩展现有身份技术栈，而非购买全新
              专用平台；大型客户基础的受监管企业则可能优先选择生态引力更强或更易部署的平台，即使 Transmit 产品更广。
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP009
              - CP012
