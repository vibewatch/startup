    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Transmit Security 一贯将自己定位为企业身份安全平台，而非单点产品。官网和外部资料将 Mosaic 描述为
              覆盖身份管理、认证、编排、反欺诈和身份验证的组合式技术栈，服务跨渠道的复杂客户旅程。产品定位 比公司足迹更清晰：第三方及官方材料指向波士顿，而公司 2025 年 11 月新闻稿同时标注波士顿和特拉
              维夫。因此现有证据支持其跨大西洋运营足迹，但不足以给出一个后续章节可直接视为定论的单一总部表述。
