  - id: FI001
    title: 公开收入模式桥接
    type: flow
    summary: 公开证据展示客户活动如何走到报价，但没有说明报价如何转化为利润率或现金续航。
    data:
      nodes:
        - id: usage
          label: 客户活动
          value: MAUs, logins, ID checks
          note: 不同模块衡量不同客户行为，而不是采用单一通用单位。
        - id: modules
          label: 模块选择
          value: Identity / Fraud / Verification / Full platform
          note: 客户可以购买单点模块或捆绑平台。
        - id: list-price
          label: 指示性目录定价
          value: $50k-$200k annual starting points
          note: 已发布基准确立企业 ACV，但不能说明实际成交条款。
        - id: quote
          label: 定制销售报价
          value: Depends on use case, volume, deployment architecture
          note: 最终价格在销售沟通后确认，通常在 24 小时内。
        - id: services
          label: 实施与服务层
          value: Journey design, integrations, training, support setup
          note: 独立来源称这一层可能主导第一年 TCO，但费率未公开。
        - id: operations
          label: 持续运营负担
          value: 99.99% SLA, premium support, privacy/compliance obligations
          note: 身份核验和身份网络服务在支持成本之外，还增加数据治理义务。
        - id: visibility-gap
          label: 利润率与资本可见性缺口
          value: No public current ARR bridge, gross margin, cash, burn, or runway
          note: 公开证据支持收入架构，但不足以证明融资充足。
      edges:
        - from: usage
          to: modules
          label: 工作负载和使用场景决定购买内容
        - from: modules
          to: list-price
          label: 每个模块都有各自的已发布基准
        - from: list-price
          to: quote
          label: 目录定价转化为定制企业方案
        - from: quote
          to: services
          label: 部署范围增加未公开的服务成本
        - from: services
          to: operations
          label: 支持和合规塑造稳定状态下的服务成本
        - from: operations
          to: visibility-gap
          label: 公开披露止步于利润率和现金续航 之前
    approximationNotes: 该流程是定性且按顺序组织的；它总结公开证据所展示的定价与服务义务如何衔接，而非量化的收入确认或毛利润桥接。
    claimRefs:
      - CI001
      - CI007
      - CI008
      - CI011
      - CI015
      - CI016
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开材料展示了一套分层身份技术栈，从旅程编排起步，最终连接到集成和服务依赖。
    data:
      layers:
        - label: 体验编排
          detail: 设计覆盖注册、登录、支付和恢复的客户旅程。
          modules:
            - 拖放式旅程构建器
            - 自然语言提示
            - 嵌入式编排
          outputs:
            - 旅程定义
            - 自动化身份与欺诈工作流
        - label: 渠道界面
          detail: 同一套身份旅程可在面向客户的各类渠道中运行。
          modules:
            - Web 应用
            - 移动应用
            - 呼叫中心与全渠道体验
          outputs:
            - 共享客户旅程
            - 跨渠道身份一致性
        - label: 核心身份服务
          detail: 基于微服务的 CIAM 处理入职、档案、同意和会话。
          modules:
            - 用户管理
            - 身份管理
            - 授权
          outputs:
            - 客户档案
            - 会话与访问策略
        - label: 信任与风险控制
          detail: 身份验证、核验和欺诈工具在同一用户流程中执行。
          modules:
            - 通行密钥与 MFA
            - 身份核验
            - 欺诈检测与响应
            - 数据验证
          outputs:
            - 升级验证决策
            - 文件与生物识别检查
            - 风险决策
        - label: 集成与交付
          detail: API、标准集成和咨询服务将 Mosaic 连接到企业应用。
          modules:
            - API 与 SDK
            - OAuth 2.0 / OIDC / SAML / FIDO2
          outputs:
            - Web、移动端和 API 集成
            - 符合合规要求的部署
        - label: 治理与服务
          detail: 咨询与运营支持帮助客户实施并优化部署。
          modules:
            - 远程 IAM 咨询
            - 安全加固
            - 合规对齐
          outputs:
            - 实施套餐
            - 面向客户的上线支持
