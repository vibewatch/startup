      - number: '2.3'
        title: 买方分层、采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              公开买方主要是大型受监管企业，尤其是同时需要安全、合规和低摩擦数字旅程的银行、保险公司、零售商及 其他面向客户的品牌。最强采用驱动因素是整合：多个来源将 Mosaic 定位为可在一个运营模式下整合认证、
              反欺诈控制和身份验证的编排层，适合身份技术栈碎片化的客户。约束也很明显：公开起价已达企业级，Gartner 用户反馈仍指出 SDK 和定制 UX 存在摩擦；尽管隐私和身份验证材料显示生物识别、KYC
              及处理者—控制者问题 很重要，公开营销页面却没有列出完整认证清单。实际上，估值上行取决于买方是否足够偏好一份更宽的平台合同， 以抵消受监管账户的实施复杂度和采购尽调。
            claimRefs:
