      - number: '4.2'
        title: 服务交付与支持显然重要，但未量化
        blocks:
          - type: paragraph
            body: >-
              现有证据表明，第一年经济性不只由软件订阅费决定。独立定价分析和评测都将实施人力、旅程设计、集成、 培训和支持列为重要成本驱动因素；官方定价页确认所有套餐承诺 99.99% 可用性并提供高级支持。公司还将
              产品定位为跨多个平台编排监管、业务和安全要求，这在战略上有吸引力，却通常意味着大量解决方案工程和 客户成功投入。因此 Transmit 可能拿到较高起始 ACV，但由于专业服务定价和稳态支持强度均未披露，公开
              投资者仍无法建立可信的利润桥接。
            claimRefs:
              - CI008
