  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 历史上的 >$100M ARR 里程碑低估了当前规模；平台覆盖面赢得更多大型受监管企业；定价底线保持不变
        - 上行空间要求当前 ARR、留存率和利润率支撑高于仅凭公开证据所能证明水平的优质软件倍数
        - 若管理层披露强劲的 2025-2026 年 ARR 增长和清晰的股权结构条款，概率信号将改善
        - 增长停滞，或新条款暴露出沉重的优先权负担或二级市场压力
      - - 基准
        - 公司在战略上仍有相关性，但公开证明大多仍来自历史信息或公司自发披露
        - 只有审阅最新非公开指标和融资条款后才能判断公允价值；在此之前，入场应保持纪律
        - 与过时的公开估值标记、2026 年定价证明以及缺失的 IPO 时间表最一致
        - 又过一年，仍没有新的财务披露或流动性进展
      - - 悲观
        - 2021-2022 年的势头已经减弱；实施强度和合规负担挤压利润率；此前估值标记在当前市场尚未得到验证
        - 估值重置或下调轮意味着相对于最近可见独角兽估值的回报不佳，并压缩退出选择
        - 若当前收入显著低于 2022 年新闻稿暗示的轨迹，该情景的权重将上升
        - 尽调中暴露出续约疲软、客户集中或募资条款不利
    notes: 情景行不是公司披露的预测。它们将留存证据和已记录的缺口转化为投资判断框架，因此缺失的非公开输入会被明确保留，而不是用估算掩盖。
