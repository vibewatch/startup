  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻支出
        blocks:
          - type: paragraph
            body: >-
              最有来源支撑的边界是客户身份与访问管理，而非泛网络安全或仅面向员工的 IAM。Gartner 将 Transmit Security
              放在明确“过渡到客户身份与访问管理（CIAM）”的访问管理类别中；公司及合作伙伴资料也反复将其 定义为整合编排、反欺诈和身份验证的客户身份技术栈。因此纳入的支出包括客户开户、认证、账户恢复、
              反欺诈控制和身份核验流程，尤其是需要跨渠道、跨地域运行的流程。最明确的排除项是纯员工无密码软件， 以及未接入客户旅程的通用安全工具。一份第三方比较将范围扩至同一平台上的员工、B2B 和 B2C，因此在
              Transmit 披露套餐组合或按模块拆分收入前，员工场景应视为相邻扩张路径，而非默认市场边界。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
