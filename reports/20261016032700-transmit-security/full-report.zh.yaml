  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 定价足以展示收入架构，却不足以展示实际经济性
        blocks:
          - type: paragraph
            body: >-
              对一家私营网络安全公司而言，Transmit Security 的公开材料在漏斗顶部异常清楚地展示了变现结构：Mosaic
              以模块化企业软件出售，提供参考价目和按用量计费单位，通过销售报价快速跟进，而非自助结账。公司为主要 客户身份套餐公布四个起始价，但每个数字都取决于场景、部署架构和规模；价目表不等于实际合同金额或确认
              收入。独立评测也支持这一结论，并揭示不利一面：买方足以推断六位数 ACV 的销售模式，却无法据此标准化 折扣、多模块采用率、续约涨幅或超过基准的大批量定价。
