      - number: '3.2'
        title: 差异化与转换成本
        blocks:
          - type: paragraph
            body: >-
              Transmit 最强的产品论点，是在单一供应商边界内提供广度。官网和 ForesightIQ 都将 Mosaic 描述为整合身份
              管理、反欺诈、身份验证与编排的技术栈；市场情报页面也将其视为独角兽级身份公司，而非细分单点工具。 对受监管企业而言，客户采用的模块越多，运营逻辑、合规流程和反欺诈控制就越深地嵌入同一平台，初次采用
              后便可能形成转换成本优势。单独替换认证容易，连同认证、反欺诈运营、身份核验和工作流层一起替换则难得多。 但广度也给竞争者留下空间：更简单、更窄的产品可能更快落地。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP008
              - CP009
              - CP011
              - CP013
      - number: '3.3'
        title: 商业压力与替代风险
        blocks:
          - type: paragraph
            body: >-
              公开商业证据不一，削弱了护城河信心。Transmit 公布套餐和计费机制，却不公开价目表；买方须根据 MAU
              或事件量、使用场景和部署架构索取报价。竞争者利用这一缺口，将采购讨论引向总成本和实施摩擦。LoginRadius 称，想要更深 B2B 能力、更低工程负担或更快部署的团队会离开或避开
              Transmit。PeerSpot 的比较片段多次 将 Transmit 描述为比部分替代方案更结构化或更昂贵，但这些双边叙事并不一致，只能视为方向性压力信号， 不能当作基准定价证据。Dealroom 和
              Gartner 显示其规模足以参与企业评估，但都未解决实际定价、服务投入 强度或相对既有厂商的胜负表现等关键尽调缺口。
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP008
              - CP010
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP008
              - CP010
              - CP011
              - CP013
      - number: '3.4'
        title: 展示
        blocks:
          - type: callout
            title: Transmit 的护城河在整合广度，而非公开定价透明度
            body: 现有资料中最清晰、最可守的差异是产品捆绑：编排、反欺诈运营、身份验证和认证归于同一供应商，适合 希望减少供应商扩散的受监管企业。
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP011
          - type: callout
            title: 功能尚未拉平前，竞争者即可攻击部署摩擦与总拥有成本
            body: 由于公开定价由报价驱动，且竞争者资料反复将替代方案描述为更易部署或起步更便宜，Transmit 可能必须用 比窄型 CIAM 工具或微软原生现状方案更昂贵、更依赖顾问的销售流程来赢单。
            calloutType: risk
            claimRefs:
              - CP003
