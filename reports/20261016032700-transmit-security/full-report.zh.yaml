          - type: paragraph
            body: >-
              领导层叙事仍高度围绕创始人。外部数据库及公司 2025 年 11 月公告确认 Mickey Boodaei 和 Rakesh Loonkar 为联合创始人，前者任 CEO，后者任总裁。BusinessWire
              还将 David Mahdi 列为 CIO，说明创始人之外具备 一定高级职能深度；但现有资料未披露董事会构成、控制权、委员会架构或融资相关治理条款。关键人依赖
              因而偏高：创始人延续有利于产品一致性，却也让公开可见的少数经营者承担了大部分解释权。
