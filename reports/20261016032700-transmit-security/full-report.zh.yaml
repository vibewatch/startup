      - number: '4.3'
        title: 公开增长证明停留在历史，当前资本充足度仍不透明
        blocks:
          - type: paragraph
            body: >-
              公开增长证据存在，但主要是历史数据，且大多由公司发布。现有资料中最明确的数字披露来自 2022 年 8 月 新闻稿：ARR 超过 $100 million、上半年收入同比增长 40%，自 2021 年 6 月 A
              轮以来客户基数增长 51%。 FIDO Alliance 公司简介还描述了大型银行、保险公司和零售商的部署，这些客户年交易额超过 $1.3 trillion。
              这些事实说明其确有企业触达，但没有更新当前收入基数、客户集中度或留存情况；现有来源也未披露当前现金、 燃烧率、跑道、债务或融资触发条件。因此资本充足度和下一轮融资依赖仍是尽调议题，而非可承保事实。
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI016
      - number: '4.4'
        title: 结论：企业变现可信，但公开投资判断可见度弱
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，Transmit Security 是一个销售主导的企业平台：入门层有一定定价权，覆盖身份、反欺诈和验证 的模块广，客户成果也可能支撑面向受监管企业的 ROI
              销售。投资判断的难点不是收入模式是否存在，而是公开 证据在投资者真正需要检验收入质量和资本强度之前就停止了。没有当前收入桥、按模块的实际定价、毛利率、 服务附加率、CAC
              或回本期以及现金跑道披露，本章只能有条件地判断收入架构，不能清晰判断利润路径或融资 充足度。
            claimRefs:
              - CI001
              - CI007
              - CI008
              - CI010
              - CI014
              - CI016
