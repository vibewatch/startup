              - CM015
      - number: '2.2'
        title: 受证据约束的规模估算与企业预算视角
        blocks:
          - type: paragraph
            body: >-
              现有资料没有可信的独立 TAM、SAM 或 SOM 估算，因此应保留几个更窄的公开视角，而不是编造一个巨大的市场 数字。第一是品类深度：Gartner 显示 Transmit 参与 CIAM
              相邻评测市场，Tracxn 统计出庞大竞争领域，说明 公司切入的是拥挤但真实的身份技术栈预算。第二是合同规模：2026 年比较页面公布每 100,000 次身份核验 $50,000 起、完整平台每年
              $200,000 起，指向企业预算而非 SMB 自助购买。第三是装机基数：公司和合作伙伴 页面称客户关联的年交易额超过 $1.3 trillion 和 $2
              trillion，但数字无法清晰核对，应作为范围保留，而非 精确的当前市场规模主张。CheckThat.ai 的第四个视角将其数据称为算法估算而非已验证披露，方向上有用，但 仍不足以成为披露级估值信号。
