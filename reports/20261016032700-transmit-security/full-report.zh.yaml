            body: >-
              融资背景仍由规模巨大的 2021 年 A 轮主导，当时软件市场更繁荣，公司获得溢价网络安全估值。公开证据显示， 公司维持了广泛产品抱负、企业套餐和包含期权薪酬的持续招聘，但没有披露当前优先股堆叠、期权池规模、老股
              定价，或后续内部人/结构化融资是否重置有效估值。隐私声明还显示平台承担控制者和生物识别数据责任；若增长 放缓，合规成本可能上升。因此入场纪律必须假设估值不透明，在将 2021 年独角兽估值视为可靠的 2026
              参考点 前，要求新的私募市场证据。
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: 情景、退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              乐观情景取决于 Transmit Security 将平台广度、企业定价和历史增长转化为远高于当前公开记录的经常性收入。
              基准情景假设公司具有战略价值，但当前财务和融资条款仍过于不透明，无法清晰判断价格。悲观情景是历史动能 放缓、实施密集型企业交付压缩利润，而最近已知估值高于更新后的市场出清价格。退出准备度的证据也很弱，
              因为资料明确称尚未宣布 IPO 时间表。下一步尽调不是争论产品质量，而是取得当前 ARR、留存、毛利率、客户 集中度和股权结构表证据，以便重新定价投资建议。
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 展示
        blocks:
          - type: callout
            title: 建议
            body: 维持继续研究。现有证据仍支持有实质性的产品和企业销售基础，但不足以支持 2026 年新的市场出清估值。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV013
              - CV014
          - type: callout
            title: 主要投资判断风险
            body: 最大风险是在缺乏当前 ARR、留存、毛利率、集中度和优先股堆叠证据时，仍按 2021 年独角兽估值买入。
            calloutType: risk
            claimRefs:
              - CV001
              - CV011
              - CV012
              - CV013
              - CV014
          - type: callout
            title: 哪些因素会改变判断
            body: 更清晰的估值判断需要更新的 ARR、续约、毛利率和股权结构表证据，以及新的融资估值或可信的流动性路径。
            calloutType: assumption
            claimRefs:
              - CV002
              - CV007
              - CV011
              - CV013
              - CV014
