      - CE004
      - CE005
      - CE006
      - CE008
      - CE009
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开材料展示了一条从企业买方评估开始，延伸至入职、登录、欺诈检查以及可选跨客户身份复用的旅程。
    data:
      items:
        - label: 企业评估与演示
          actor: 安全、欺诈、IAM 和数字产品买方
          channel: 企业直销
          touchpoints:
            - 申请演示 / 商业评估
            - 基于 MAU 的采购和多年折扣
          tone: neutral
        - label: 注册与身份入职
          actor: 终端客户或业务用户
          channel: Web 与移动端
          touchpoints:
            - 注册与入职工作流
            - 在需要时进行文件核验和自拍 / 活体检测
          tone: positive
        - label: 主登录与自助服务
          actor: 终端客户
          channel: Web、移动端和自助账户流程
          touchpoints:
            - 无密码或 MFA 登录
            - 渐进式建档、同意和账户管理
          tone: positive
        - label: 高风险事件与升级验证
          actor: 终端客户，加上欺诈 / 安全控制
          channel: 登录、恢复、支付或交易流程
          touchpoints:
            - 基于风险的授权
            - 欺诈检测、响应和额外核验
          tone: warning
        - label: 全渠道服务
          actor: 终端客户和企业运营团队
          channel: Web、移动端、呼叫中心和网点
          touchpoints:
            - 一个平台覆盖面向用户的各渠道
            - 一致的身份验证和策略执行
          tone: positive
        - label: 身份复用与扩展闭环
          actor: 跨企业客户的已验证用户
          channel: Identity Network 档案
          touchpoints:
            - 用户选择加入后，在不同客户之间复用身份信息
            - 从一条身份工作流扩展到更多旅程和模块
          tone: neutral
    approximationNotes: 这是对官方产品和隐私文本的工作流汇总；它展示支持的客户旅程界面，不代表实测转化率或附加率。
    claimRefs:
      - CU001
      - CU002
      - CU007
      - CU012
      - CU013
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险集中在部署复杂度、敏感数据治理和商业集中度，而非产品能力缺口。
    data:
      columns:
        - 高可能性
        - 中等可能性
        - 较低可能性
      rows:
        - label: 关键影响 — 交付
          values:
            - label: 集成复杂度
              detail: 针对特定架构的上线可能远超基础实施周期。
            - label: 隐私 / 控制者范围
              detail: 身份网络和服务改进工作流可能使 Transmit 承担数据控制者角色。
            - label: FedRAMP / 公共部门缺口
              detail: 独立评审称截至 2026 年尚未获得 FedRAMP 认证。
        - label: 关键影响 — 合规
          values:
            - label: 敏感 ID 数据处理
              detail: 身份核验工作流可能处理政府签发的 ID 和自拍。
            - label: 商业透明度
              detail: 公开证据无法回答续约、集中度、现金续航 或导出权问题。
            - label: 合作伙伴证明集中度
              detail: 可以看到受监管垂直领域的合作伙伴验证，但指定证据池中的多元渠道证明很薄弱。
        - label: 高影响 — 商业
          values:
            - label: 企业定价 / 买方集中度
              detail: 不透明的报价定价和较高的准入门槛可能缩小可触达买方范围。
            - label: 供应商锁定
              detail: 独立评审称迁入迁出过程复杂，退出成本高。
            - label: 对支持能力的依赖
              detail: 积极的入职反馈意味着交付质量对复杂部署很重要。
        - label: 高影响 — 韧性
          values:
            - label: 公开可用性证据有限
              detail: 指定证据池没有提供公开 SLA、可用性或事故历史证据。
            - label: 欺诈调优质量风险
              detail: 广泛的 AI 驱动控制主张没有配套公开的误报或回滚指标。
            - label: 执行能力不确定性
              detail: 有公开的团队增长信号，但未披露运营能力指标。
        - label: 中等影响 — 客户
          values:
            - label: 对入职的依赖
              detail: 复杂交易可能依赖技术团队的深度参与。
            - label: 区域或数据驻留证明缺口
              detail: 指定证据没有充分记录按市场划分的本地化运营护栏。
            - label: 核验工作流敏感性
              detail: 高保证级别核验流程中的错误会带来客户支持和信任成本。
        - label: 中等影响 — 尽调缺口
          values:
            - label: 诉讼可见性缺口
              detail: 指定证据池不包含公开案卷或重大事项清单。
            - label: 集中度可见性缺口
              detail: 本证据池没有公开的头部客户、续约或流失披露留存于此。
            - label: 现金续航 可见性缺口
              detail: 融资和盈利能力参考资料无法确定当前消耗或现金续航。
    claimRefs:
      - CR004
      - CR006
      - CR008
      - CR009
      - CR010
      - CR012
      - CR013
      - CR016
      - CR017
