    notes: >-
      Public evidence shows indicative entry pricing only; it does not disclose realized contract values, revenue-recognition policy, or module mix by customer.
    claimRefs: ["CI001", "CI002", "CI003", "CI004", "CI005", "CI006", "CI007"]
  - id: "TI002"
    title: "Pricing / monetization table"
    columns: ["Offer", "Public price / unit / contract", "List vs. realized pricing", "Discounts / unknowns", "Source"]
    rows:
      - ["Full Mosaic Platform", "$200,000/year at 100K MAUs; sales quote required", "List pricing only", "No published tiers above the baseline; no discount schedule disclosed", "Official pricing page; independent pricing reviews"]
      - ["Mosaic for Identity", "$100,000/year at 100K MAUs; annual enterprise subscription", "List pricing only", "No public realized price or bundle-conversion data", "Official pricing page; independent pricing reviews"]
      - ["Mosaic for Fraud and Threat Detection", "$100,000/year at 10M logins; annual enterprise subscription", "List pricing only", "Different billing unit from MAU modules makes direct comparison imperfect", "Official pricing page; independent pricing reviews"]
      - ["Mosaic for Identity Verification", "$50,000/year at 100K ID checks; workload-oriented pricing", "List pricing only", "No public pricing for higher-volume ID-check tiers or pass-through data costs", "Official pricing page; independent pricing reviews"]
      - ["B2B / Workforce Identity", "No public price; contact sales", "Realized pricing fully private", "No public bundle, term, or support-tier pricing", "Official pricing page; independent pricing reviews"]
    notes: >-
      Units differ across rows (MAUs, logins, ID checks, or undisclosed), so the table should be read as commercial-structure evidence rather than a directly comparable price list.
    claimRefs: ["CI001", "CI002", "CI003", "CI004", "CI005", "CI006", "CI007", "CI010"]
  - id: "TI003"
    title: "Unit economics table"
    columns: ["Metric", "Value / null", "Confidence", "Why it matters", "Diligence ask"]
    rows:
      - ["Published entry ACV floor", "$50k-$200k/year depending on module and baseline usage", "High for list pricing; low for realized ASP", "Confirms enterprise price point and likely sales-led motion", "Provide realized ASP, gross retention, and expansion by product module"]
      - ["Implementation and professional-services cost", null, "Low", "First-year payback depends on services intensity as much as software fee", "Provide services rate card, attach rate, billable gross margin, and median deployment hours"]
      - ["Support and service commitment", "99.99% uptime target with premium support included across plans", "Medium", "Support obligations can raise cost-to-serve even when license pricing looks attractive", "Provide support staffing model, SLA penalties, and support cost as a percent of revenue"]
      - ["Current ARR / revenue bridge", null, "Low", "Historical growth claims are not enough to underwrite current scale or revenue quality", "Provide current ARR, GAAP/non-GAAP revenue bridge, module mix, and backlog or RPO if tracked"]
      - ["Current gross margin and cash runway", null, "Low", "Margin path and financing dependency drive whether the business can sustain complex enterprise delivery", "Provide current gross margin by software vs. services, cash balance, burn, runway, debt, and next-round trigger"]
    notes: >-
      Null means the assigned public sources do not disclose a credible current figure; the diligence ask names the minimum management evidence needed to underwrite the metric.
    claimRefs: ["CI008", "CI009", "CI010", "CI011", "CI012", "CI013", "CI016"]
figures:
  - id: "FI001"
    title: "Public revenue model bridge"
    type: "flow"
    summary: "Public evidence shows how customer activity reaches a quote, but not how that quote converts into margin or runway."
    data:
      nodes:
        - id: "usage"
          label: "Customer activity"
          value: "MAUs, logins, ID checks"
          note: "Different modules meter different customer behaviors rather than a single universal unit."
        - id: "modules"
          label: "Module selection"
          value: "Identity / Fraud / Verification / Full platform"
          note: "Customers can buy point modules or the bundled platform."
        - id: "list-price"
          label: "Indicative list pricing"
          value: "$50k-$200k annual starting points"
          note: "Published baselines establish enterprise ACVs but not realized deal terms."
        - id: "quote"
          label: "Custom sales quote"
          value: "Depends on use case, volume, deployment architecture"
          note: "Final price is confirmed after sales engagement, usually within 24 hours."
        - id: "services"
          label: "Implementation and services layer"
          value: "Journey design, integrations, training, support setup"
          note: "Independent sources say this layer can dominate first-year TCO, but rates are private."
        - id: "operations"
          label: "Ongoing operating burden"
          value: "99.99% SLA, premium support, privacy/compliance obligations"
          note: "Identity verification and identity-network services add data-governance obligations alongside support cost."
        - id: "visibility-gap"
          label: "Margin and capital visibility gap"
          value: "No public current ARR bridge, gross margin, cash, burn, or runway"
          note: "Public evidence supports the revenue architecture, but not financing adequacy."
      edges:
        - { from: "usage", to: "modules", label: "Workload and use case determine what is bought" }
        - { from: "modules", to: "list-price", label: "Each module has its own published baseline" }
        - { from: "list-price", to: "quote", label: "List pricing converts into a custom enterprise proposal" }
        - { from: "quote", to: "services", label: "Deployment scope adds nonpublic services costs" }
        - { from: "services", to: "operations", label: "Support and compliance shape steady-state cost-to-serve" }
        - { from: "operations", to: "visibility-gap", label: "Public disclosures stop before margin and runway are visible" }
    approximationNotes: >-
      The flow is qualitative and sequence-based; it summarizes public evidence about how pricing and service obligations connect, not a quantified revenue-recognition or gross-profit bridge.
    claimRefs: ["CI001", "CI007", "CI008", "CI011", "CI015", "CI016"]
