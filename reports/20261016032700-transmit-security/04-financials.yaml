company:
  name: "Transmit Security"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Public evidence supports a high-entry, modular enterprise revenue model for Transmit Security, with published
    starting prices from $50,000 to $200,000 per year depending on module and usage basis. What remains missing is the
    underwriter's core bridge from list pricing to realized revenue, gross margin, and capital adequacy: the assigned
    sources do not disclose current ARR, cash, burn, runway, or professional-services attachment economics.
sections:
  - id: "pricing-and-revenue-model"
    title: "Pricing is public enough to show the revenue architecture, not enough to show realized economics"
    body: >-
      Transmit Security's public materials make the monetization structure unusually legible at the top of the funnel
      for a private cybersecurity company: Mosaic is sold as modular enterprise software with indicative list pricing,
      usage-based billing units, and rapid follow-up through a sales quote rather than self-serve checkout. The company
      publishes four starting points across its main customer-identity bundles, but every disclosed number is still
      conditional on use case, deployment architecture, and scale, so list pricing is not the same as realized
      contract value or recognized revenue. Independent review coverage reinforces the same conclusion and adds the
      adverse read-through: buyers can see enough to infer a six-figure ACV motion, but not enough to normalize
      discounts, multi-module take rates, renewal uplift, or large-volume pricing above the published baselines.
    claimRefs: ["CI001", "CI002", "CI003", "CI004", "CI005", "CI006", "CI007"]
    tableRefs: ["TI001", "TI002"]
    figureRefs: ["FI001"]
  - id: "delivery-cost-and-unit-economics"
    title: "Service delivery and support are clearly relevant, but not quantified"
    body: >-
      The assigned evidence suggests that first-year economics are driven by more than software subscription fees.
      Independent pricing analyses and review coverage consistently point to implementation labor, journey design,
      integration effort, training, and support as material cost drivers, while the official pricing page confirms a
      99.99% uptime commitment and premium support across plans. The company also frames the product around
      orchestrating regulatory, business, and security requirements across many platforms, which is strategically
      attractive but usually implies meaningful solution-engineering and customer-success effort. That combination
      supports the view that Transmit can command high starting ACVs, yet it leaves public investors without a credible
      margin bridge because neither professional-services pricing nor steady-state support intensity is disclosed.
    claimRefs: ["CI008", "CI009", "CI010", "CI011", "CI015"]
    tableRefs: ["TI003"]
  - id: "traction-and-capital-visibility"
    title: "Public traction proof is historical, while current capital adequacy is still opaque"
    body: >-
      Public traction evidence exists, but it is mostly historical and largely company-issued. The strongest explicit
      numeric disclosure in the assigned pool is an August 2022 press release claiming more than $100 million of ARR,
      40% year-over-year first-half revenue growth, and 51% customer-base growth since the June 2021 Series A. A FIDO
      Alliance company profile adds a broader scale signal by describing deployments at large banks, insurers, and
      retailers responsible for more than $1.3 trillion in annual commerce. Those facts indicate real enterprise
      reach, but they do not update the current revenue base, customer concentration, or retention picture, and none
      of the retained sources discloses current cash, burn, runway, debt, or financing triggers. That leaves capital
      adequacy and the next-round dependency as diligence topics rather than underwritten facts.
    claimRefs: ["CI012", "CI013", "CI014", "CI016"]
  - id: "financial-verdict"
    title: "Verdict: credible enterprise monetization, but weak public underwriting visibility"
    body: >-
      Financially, Transmit Security looks like a sales-led enterprise platform with meaningful pricing power at the
      entry tier, broad module coverage across identity, fraud, and verification, and customer outcomes that can
      plausibly support ROI-oriented selling into regulated enterprises. The underwriting problem is not whether a
      revenue model exists; it is that public evidence stops before the numbers investors actually need to test revenue
      quality and capital intensity. Without a current revenue bridge, realized pricing by module, gross margin,
      services attach, CAC or payback, and cash-runway disclosures, the chapter can support a qualified view on
      revenue architecture but not a clean view on margin path or financing sufficiency.
    claimRefs: ["CI001", "CI007", "CI008", "CI010", "CI014", "CI016"]
callouts:
  - calloutType: "insight"
    title: "Commercial model is enterprise-first from the first published price point"
    body: >-
      Even before discounts or scale pricing, public list prices start at enterprise ACV levels and route buyers into a
      sales process, which is consistent with a high-touch CIAM and fraud platform rather than a self-serve SaaS motion.
    claimRefs: ["CI001", "CI002", "CI003", "CI004", "CI005"]
  - calloutType: "risk"
    title: "Capital adequacy is still a diligence blocker"
    body: >-
      The assigned public sources do not provide current cash, burn, runway, debt, or financing-trigger disclosures, so
      investors cannot test how long Transmit can fund product, services, and go-to-market at the current operating
      scope without management materials.
    claimRefs: ["CI016"]
