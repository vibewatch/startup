company:
  name: Transmit Security
chapter:
  number: 1
  title: Company Overview
  summary: Transmit Security is a founder-led identity-security vendor founded in 2014 that positions Mosaic as a unified CIAM, orchestration, fraud-prevention, and identity-verification platform for large regulated enterprises. Public evidence supports strong product breadth and 2025 category recognition, but headquarters labeling, capital-history totals, valuation, board visibility, and several operating metrics remain partially opaque or inconsistent across third-party sources.
sections:
- id: identity-and-footprint
  title: Identity, product scope, and operating footprint
  body: 'Transmit Security consistently presents itself as an enterprise identity-security platform rather than a narrow point product. Official product pages and external profiles describe Mosaic as a combined identity management, authentication, orchestration, fraud-prevention, and identity-verification stack serving complex customer journeys across channels. That product identity is clearer than the corporate-footprint story: third-party and official materials point to Boston, while the company’s November 2025 press release uses a combined Boston-and-Tel-Aviv dateline. The assigned evidence therefore supports a transatlantic operating footprint, but not a single clean headquarters statement that later chapters can treat as definitive without follow-up diligence.'
  claimRefs:
  - CO001
  - CO003
  - CO004
  - CO009
  - CO010
  tableRefs:
  - TO001
- id: leadership-and-governance
  title: Founder-led leadership with limited public governance detail
  body: 'The leadership narrative remains strongly founder-centric. External company databases and the company’s own November 2025 announcement identify Mickey Boodaei and Rakesh Loonkar as co-founders, with Boodaei serving as CEO and Loonkar as President. BusinessWire also introduces David Mahdi as CIO, which suggests some senior functional depth beyond the founders, but the assigned pool does not disclose board composition, control rights, committee structure, or any financing-linked governance terms. That leaves key-person dependence elevated: founder continuity is a positive signal for product coherence, yet it also concentrates explanatory power in a small set of publicly visible operators.'
  claimRefs:
  - CO002
  - CO011
  - CO015
  tableRefs:
  - TO002
  - TO003
- id: funding-scale-and-disclosure-quality
  title: Funding credibility is stronger than current-scale transparency
  body: 'The public record clearly anchors a large June 2021 Series A, but it does not cleanly settle the current cap-table narrative. Tracxn reports $543 million raised and a $2.7 billion current valuation, while Indexed reports $583.0 million across two rounds and CheckThat.ai publishes low-confidence valuation and revenue estimates that it explicitly labels algorithmic rather than verified. Adoption signals are better than operating-metric disclosure: BusinessWire and FIDO both place Transmit in large regulated enterprises, including top U.S. banks, yet no retained source provides current ARR, revenue, customer count, debt, secondaries, or a reconciled valuation bridge. Investors can underwrite product relevance from public sources more confidently than present-day financial scale.'
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  - CO012
  - CO014
- id: milestones-and-what-still-needs-proof
  title: Milestones show durable positioning, but proof gaps still matter
  body: 'The dated milestones that do appear are meaningful. The evidence supports a 2014 founding, a 2018 UK entity, a June 2021 Series A that pushed the company into unicorn territory, a 2022 U.S. legal entity, and a cluster of late-2025 signals around Gartner recognition and updated privacy disclosures. Together they show a company still investing in enterprise credibility and governance surfaces. The more important gap is not chronology but precision: later chapters should treat board oversight, ownership changes, customer concentration, and current commercial scale as open diligence items rather than as facts already established by this overview.'
  claimRefs:
  - CO001
  - CO005
  - CO008
  - CO010
  - CO013
  - CO016
  - CO015
  figureRefs:
  - FO001
