schemaVersion: report-v2
artifact: customers
slug: transmit-security
runDate: 2026-10-16
company:
  name: Transmit Security
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports real enterprise adoption in regulated, high-scale customer-identity
    workflows, with named banks, insurers, retailers, and financial-services deployments plus a
    31-review Gartner footprint. The strongest proof remains company-controlled case studies and a
    2022 growth release, while retention, concentration, and current customer-count disclosure are
    still weak.
sections:
  - id: segment-shape
    title: Customer segments and buyer-user structure
    body: >-
      Transmit Security's disclosed customer base is best understood as enterprise buyers funding a
      platform used by their own end customers rather than by internal employees alone. Its current
      product pages position Mosaic for both B2C and B2B journeys including registration, login,
      payments, onboarding, consent, and self-service, while the privacy statement distinguishes the
      paying enterprise customer from the end user whose identity or fraud signals are processed. The
      public proof set is concentrated in regulated, high-risk customer-facing sectors—especially
      banking and adjacent financial services—then broadens into insurance and retail. That implies
      a buyer set led by identity, fraud, security, and digital-product owners, with the end user
      typically being a consumer or business user moving through a customer journey rather than a
      workforce identity flow.
    claimRefs: [CU001, CU002, CU003, CU012, CU014]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Public adoption proof and deployment scale
    body: >-
      Transmit has more than logo-only proof, but the quality of that proof varies. The company and
      case-study directory both anchor the installed base in banks, insurers, retailers, and other
      large brands, and the 2022 press release is unusually concrete by private-company standards:
      it claims 51% customer-base growth in the first half of 2022, more than $100 million of ARR,
      and customer additions including Goldman Sachs, BRED Banque Populaire, and America's Car-Mart.
      The named-proof layer is strongest where a use case or outcome is stated—such as a 100%
      passwordless marketplace, a 200 million-client banking deployment, tens of millions in annual
      savings, or a 98% fraud-reduction result—rather than where a logo appears without deployment
      detail. Independent platform evidence also exists through Gartner Peer Insights, but the review
      base is still small relative to mega-vendor peers.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU010]
    tableRefs: [TU002, TU003]
  - id: durability-gaps
    title: Durability, expansion, and concentration remain under-disclosed
    body: >-
      The customer story is directionally attractive but not yet durable enough for a clean
      underwriting conclusion. Public materials show expansion vectors—more identity steps, more
      channels, and potentially cross-customer identity reuse through the Identity Network—but they
      do not disclose NRR, GRR, churn, renewal rates, contract lengths, or top-customer mix. The
      independent review signal is also modest: Gartner shows 31 ratings at 4.5 out of 5, which
      confirms live usage but is not broad enough to validate retention or cohort quality on its own.
      As a result, the right read is not “customer quality proven,” but rather “enterprise adoption
      proven, durability still partly opaque.”
    claimRefs: [CU006, CU009, CU011, CU013, CU014]
callouts:
  - calloutType: strength
    title: Strongest public proof
    body: >-
      Named banks, insurers, and retailers with explicit deployment outcomes give Transmit more
      customer proof than a logo wall, especially in regulated customer-identity workflows.
    claimRefs: [CU004, CU005, CU010]
  - calloutType: risk
    title: Main customer-quality gap
    body: >-
      Public evidence does not disclose retention, concentration, or current customer-count
      denominators, so adoption breadth is clearer than customer durability.
    claimRefs: [CU006, CU009, CU011]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale / proof
      - Revenue / strategic value
      - Gap
    rows:
      - - Global banks and card-centric financial institutions
        - "Buyer: IAM, fraud, security, and digital-product leaders; User: retail banking or payments customers; Payer: enterprise bank"
        - Passwordless login, risk-based authentication, identity verification, fraud prevention
        - Named customers include BRED, Citigroup, HSBC, Santander, UBS, and an unnamed 200M-client global banking deployment
        - Core vertical with the deepest public proof and the highest stated commerce footprint
        - No current disclosure of live-customer count, renewal rates, or concentration by bank
      - - Insurers and adjacent regulated consumer-finance platforms
        - "Buyer: security and digital-channel owners; User: policyholders or account holders; Payer: insurer or financial institution"
        - Accessible passwordless access, omnichannel CIAM, customer-experience improvement
        - Named proof includes Cattolica Assicurazioni and Nationale Nederlanden, plus review coverage focused on financial-services fit
        - Broadens the thesis beyond banks into other regulated customer-facing identities
        - No public contract-size, module-attach, or retention disclosure by insurer cohort
      - - Retailers and other large enterprises
        - "Buyer: digital commerce, identity, and fraud teams; User: shoppers or end customers; Payer: enterprise brand"
        - Digital marketplace login, onboarding, fraud reduction, customer self-service
        - America's Car-Mart and Lowe's are named; product pages also position Mosaic for both B2C and B2B journeys
        - Shows use outside pure banking and supports the enterprise-CIAM expansion case
        - No vertical revenue mix, partner-sourced share, or production-vs-pilot breakdown
    notes: >-
      Synthesizes company product, privacy, release, and public case-study evidence; “revenue /
      strategic value” is qualitative because no per-segment revenue disclosure is public.
    claimRefs: [CU001, CU002, CU003, CU004, CU012]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Customer-base growth
        - 51% growth in customer base
        - H1 2022
        - Transmit Security via Business Wire
        - Medium
        - Last concrete official growth datapoint shows meaningful commercial momentum
        - Starting customer count and current base are not disclosed
      - - ARR threshold
        - Exceeded $100M ARR
        - H1 2022
        - Transmit Security via Business Wire
        - Medium
        - Suggests enterprise-scale contract values and broad commercial traction at that point
        - No current ARR bridge or revenue by product / segment
      - - Peer-review footprint
        - 4.5/5 from 31 ratings; 52% five-star and 48% four-star
        - Gartner page accessed 2026-10-16; review snapshot includes Sep 2023 review text
        - Gartner Peer Insights
        - Medium
        - Confirms live customer usage and generally positive satisfaction
        - Review volume is too small to infer market share or retention
      - - Commerce footprint claim
        - More than $2T in annual commerce across the customer base
        - Repeated on 2022 release and public case-study directory
        - Company and directory evidence
        - Medium
        - Indicates large-transaction environments and mission-critical use cases
        - No split by active logos, geography, or production modules
    notes: >-
      Rows mix current review-platform data with stale but still useful 2022 company growth
      disclosures; blank denominators and current run-rate gaps limit comparability.
    claimRefs: [CU003, CU005, CU006, CU007]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - America's Car-Mart
        - Retail / auto marketplace
        - Passwordless digital marketplace
        - Presented as production
        - 100% passwordless marketplace and reduced fraud
        - Outcome comes from case-study listing; no user count or go-live date
      - - BRED Banque Populaire
        - Banking
        - BindID password-free banking access
        - Presented as production
        - Accessible, password-free banking for disabled adults
        - Case-study title gives use case but not adoption scale or renewal data
      - - Nationale Nederlanden
        - Insurance
        - CIAM modernization
        - Presented as production
        - Simplified, stronger CIAM with improved security and customer experience
        - Public proof does not quantify user volume or commercial impact
      - - Global Banking Giant
        - Banking
        - Passwordless login
        - Presented as production
        - Passwordless login for 200M clients and tens of millions saved annually
        - Customer is unnamed, reducing reference quality despite large stated scale
      - - Leading US Financial Services Company
        - Financial services
        - Detection and Response Services
        - Presented as production
        - 1300% ROI and 98% reduction in new account fraud
        - Customer is unnamed and the time window behind ROI is not disclosed
    notes: >-
      Partial enumeration of public deployment proof as of 2026-10-16, prioritized to rows with a
      named customer or an explicit scale/outcome rather than the full installed base.
    enumerationScope:
      coverage: partial
      basis: >-
        Public case-study directory snapshot and company release as of 2026-10-16; rows are limited
        to customer references with an explicit deployment cue, named logo, or outcome statement.
    claimRefs: [CU004, CU005, CU010]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public materials show a journey that starts with enterprise buyer evaluation and extends
      through onboarding, login, fraud checks, and optional cross-customer identity reuse.
    data:
      items:
        - label: Enterprise evaluation and demo
          actor: Security, fraud, IAM, and digital-product buyers
          channel: Direct enterprise sales
          touchpoints:
            - Request a demo / commercial evaluation
            - MAU-based procurement and multi-year discounting
          tone: neutral
        - label: Registration and identity onboarding
          actor: End customer or business user
          channel: Web and mobile
          touchpoints:
            - Registration and onboarding workflows
            - Document verification and selfie / liveness checks where required
          tone: positive
        - label: Primary login and self-service
          actor: End customer
          channel: Web, mobile, self-service account flows
          touchpoints:
            - Passwordless or MFA login
            - Progressive profiling, consent, and account management
          tone: positive
        - label: High-risk event and step-up
          actor: End customer plus fraud / security controls
          channel: Login, recovery, payment, or transaction flow
          touchpoints:
            - Risk-based authorization
            - Fraud detection, response, and extra verification
          tone: warning
        - label: Omnichannel servicing
          actor: End customer and enterprise operations team
          channel: Web, mobile, call center, and branch
          touchpoints:
            - One platform across user-facing channels
            - Consistent authentication and policy enforcement
          tone: positive
        - label: Identity reuse and expansion loop
          actor: Existing verified user across enterprise customers
          channel: Identity Network profile
          touchpoints:
            - Reuse identity information across customers when the user opts in
            - Expand from one identity workflow into additional journeys and modules
          tone: neutral
    approximationNotes: >-
      This is a workflow synthesis from official product and privacy text; it illustrates supported
      customer journey surfaces, not measured conversion rates or attach rates.
    claimRefs: [CU001, CU002, CU007, CU012, CU013, CU014]
