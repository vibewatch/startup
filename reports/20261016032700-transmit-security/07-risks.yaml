company:
  name: "Transmit Security"
chapter:
  number: 7
  title: "Risks"
  summary: "Transmit Security's main underwriting risk is not lack of feature breadth, but the combination of sensitive identity-data handling, enterprise-grade implementation complexity, and opaque commercial structure. The assigned public pool also leaves material gaps on public-sector authorization, uptime history, customer concentration, and current vendor-resilience metrics, so conviction still depends on diligence beyond the visible product story."
sections:
  - id: "ranked-risk-landscape"
    title: "Ranked risk landscape"
    body: |
      The strongest public evidence supports a broad product footprint, but that same breadth creates underwriting risk because Mosaic appears to sit in the critical path for registration, login, fraud controls, and identity verification. Official and partner materials portray a unified orchestration layer for identity and fraud, while independent reviewers describe the platform as enterprise-priced, complex enough to require staged implementation, and harder to exit once embedded. That makes the residual risk profile less about feature scarcity and more about deployment friction, vendor dependence, pricing fit, and the lack of public proof for some regulated-workload requirements.
    claimRefs: ["CR001", "CR003", "CR006", "CR007", "CR008", "CR009", "CR010", "CR011", "CR014"]
    tableRefs: ["TR002", "TR003"]
    figureRefs: ["FR001"]
  - id: "regulatory-privacy-exposure"
    title: "Regulatory and privacy exposure"
    body: |
      The clearest legal and regulatory risk comes from the sensitivity of the data handled and the fact pattern in Transmit's own privacy statement. The company says it is usually a processor for customer-provided user data, but becomes a controller in some Identity Network and service-improvement scenarios. The same policy says identity-verification services can process government-issued IDs and selfies, which raises the cost of any control failure or ambiguous responsibility split. Independent review also says FedRAMP was not yet attested as of 2026, so expansion into public-sector or similar authorization-heavy workloads should not be underwritten from public marketing alone.
    claimRefs: ["CR004", "CR005", "CR008", "CR016"]
    tableRefs: ["TR001"]
  - id: "operational-and-dependency-risk"
    title: "Operational and dependency risk"
    body: |
      External review evidence points to real implementation and dependency risk even though user feedback is directionally positive. StackInsight says deployment complexity varies with architecture and that advanced features can extend rollout time materially beyond a basic implementation, while Gartner review evidence suggests user experience and onboarding can be strong when the technical team is engaged. Those two facts can coexist: complex, high-stakes deployments may still land well, but they appear to depend on implementation quality, support capacity, and tuning discipline. The assigned pool does not provide a public uptime history, formal SLA evidence, or incident archive, leaving an unresolved resilience question for a platform that can sit directly in the authentication and fraud-decision path.
    claimRefs: ["CR003", "CR010", "CR011", "CR012", "CR013", "CR015", "CR017"]
  - id: "investment-implication-and-kill-criteria"
    title: "Investment implication and kill criteria"
    body: |
      The investment implication is that Transmit may be attractive when a buyer values unified CIAM, fraud, and verification enough to absorb enterprise pricing and implementation work, but risky if the deal thesis requires broad customer fit, low switching friction, or public-sector readiness. Public evidence is not strong enough to clear customer concentration, renewal durability, runway, uptime resilience, or data-portability risk. A thesis break should trigger if diligence shows unclear controller boundaries by module, weak export and migration rights, absent certification or incident evidence for target verticals, or a growth plan that still depends on a narrow set of regulated enterprise accounts.
    claimRefs: ["CR004", "CR006", "CR007", "CR008", "CR009", "CR014", "CR016", "CR017"]
