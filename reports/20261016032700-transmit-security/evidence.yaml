evidenceGaps:
  - type: missing-source
    severity: material
    topic: headquarters
    missingEvidence: A filing-backed or legal-page statement naming the primary headquarters and corporate domicile.
    whyItMatters: >-
      Later chapters should not build geographic go-to-market, regulatory, or employment assumptions on an ambiguous
      headquarters record.
    diligencePath: >-
      Request the current corporate-structure slide, incorporation package, or another filing-backed headquarters
      reference.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A primary financing record that reconciles whether total funding is $543M or $583M and clarifies the true round
      count.
    whyItMatters: >-
      Capital raised, valuation context, and investor ownership all flow into the valuation chapter and cannot rely on
      mismatched database summaries.
    diligencePath: Obtain the original 2021 financing announcement, investor confirmation, or a current cap-table summary.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-transparency
    missingEvidence: >-
      Current ARR or revenue, exact customer count, headcount, debt or credit exposure, secondary activity, and
      cash-runway detail.
    whyItMatters: >-
      These are core cover metrics for underwriting scale, burn tolerance, and valuation discipline, but the assigned
      public evidence does not surface them.
    diligencePath: Request a current operating-metrics pack or investor update that ties scale metrics to dates and denominators.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: A full board roster, committee structure, ownership-control map, and any investor governance rights.
    whyItMatters: The public record is founder-centric, so governance quality and control concentration remain underexplained.
    diligencePath: Request the board deck cover page, governance appendix, or financing-side rights summary.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      Independent public TAM, SAM, or SOM estimates for the addressable customer-identity, fraud, and verification
      budget that Transmit Security can realistically serve.
    whyItMatters: >-
      Without a clean market-size denominator, valuation work has to rely on pricing floors, installed-base anecdotes,
      and competitive density instead of a quantified demand curve.
    diligencePath: >-
      Obtain analyst market reports or public-company disclosures that isolate CIAM, identity-verification, and
      fraud-orchestration spend for Transmit's target buyer set.
  - type: conflicting-data
    severity: material
    topic: installed-base-lens
    missingEvidence: >-
      A reconciled current installed-base metric for commerce volume, customer count, or production accounts under
      management.
    whyItMatters: >-
      The assigned pool preserves >$1.3T and >$2T commerce figures from different sources, but they are not directly
      comparable enough to support one precise market-scale claim.
    diligencePath: >-
      Ask management for the current commerce-through-platform denominator, date stamp, and definition used in investor
      or partner materials.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: adoption-constraints
    missingEvidence: >-
      Primary-source certification mappings, procurement documents, or trust-center evidence that show which compliance
      artifacts are actually current and available to buyers.
    whyItMatters: >-
      The privacy and verification surfaces show strong compliance relevance, but the public pool does not confirm the
      certification package a regulated buyer can rely on during procurement.
    diligencePath: >-
      Request trust-center access, certification letters, and customer security questionnaires for current SOC, ISO,
      PSD2, AML, KYC, and data-protection evidence.
  - type: private-evidence-only
    severity: minor
    topic: workforce-adjacency
    missingEvidence: >-
      Revenue or deployment split showing whether workforce identity is a core product line, a bundled adjacency, or
      mostly a comparison-site interpretation.
    whyItMatters: >-
      Official and partner sources emphasize customer identity, while one retained comparison source broadens the scope
      to workforce, B2B, and B2C, so the public boundary should stay conservative.
    diligencePath: >-
      Ask for current product packaging, module attach rates, and reference deployments separated by workforce versus
      customer-identity use cases.
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Current realized contract values, minimum ACVs, discounting norms, and professional-services attach rates by
      module.
    whyItMatters: >-
      Public quote-led packaging does not show whether Transmit wins because of superior unit economics or despite a
      heavier services burden.
    diligencePath: >-
      Request anonymized recent quotes, module attach-rate data, and implementation SOW ranges from management and
      channel partners.
  - type: missing-source
    severity: material
    topic: win-loss-evidence
    missingEvidence: >-
      Independent win/loss studies or customer references explaining why buyers selected Okta, Ping, Microsoft,
      ForgeRock, or LoginRadius instead of Transmit.
    whyItMatters: Without loss-side evidence, durability claims risk overweighting vendor messaging and shortlist presence.
    diligencePath: >-
      Collect recent competitive bake-off summaries, customer references, and renewal narratives from reference calls or
      procurement documents.
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, runway, debt or credit facilities, and management's next-round trigger
    whyItMatters: The chapter cannot underwrite financing dependency or downside resilience without current liquidity data.
    diligencePath: Request the latest board or investor update with cash, burn, debt, and fundraising plan by quarter.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: gross-margin-bridge
    missingEvidence: Software gross margin, services gross margin, support cost, and implementation attach rate by module
    whyItMatters: >-
      Pricing alone does not show whether the business scales like software or absorbs delivery costs like a
      services-heavy platform.
    diligencePath: >-
      Request management reporting that splits software revenue, services revenue, support cost, and gross margin by
      product line.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Actual ASPs, discount bands, term lengths, renewal uplift, and module-mix by cohort
    whyItMatters: >-
      List pricing can overstate monetization quality if large customers buy below list or require costly bundling and
      services.
    diligencePath: Request the standard order form, recent win-loss pricing examples, and renewal cohort analysis.
    relatedQuestionRefs:
      - QI002
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: stale
    severity: material
    topic: current-traction
    missingEvidence: 2025-2026 public or management-backed ARR, revenue growth, customer count, and retention metrics
    whyItMatters: >-
      The strongest numeric traction disclosure in the assigned pool is from 2022, which is too stale to anchor current
      underwriting.
    diligencePath: >-
      Request the latest investor deck or board materials showing current ARR, growth, retention, and customer
      concentration.
    relatedQuestionRefs:
      - QI005
      - QI007
  - type: private-evidence-only
    severity: material
    topic: implementation-economics
    missingEvidence: Module-level implementation time, professional-services attach rates, and support staffing by deployment class.
    whyItMatters: >-
      Identity platforms can look modular in marketing but still require heavy services work that changes margin,
      time-to-value, and rollout risk.
    diligencePath: >-
      Request recent SOWs, deployment timelines, PS attach rates, and customer-by-customer go-live staffing for complex
      enterprise implementations.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: >-
      Public uptime SLOs, status-history disclosures, incident postmortems, or independently verified availability
      metrics.
    whyItMatters: >-
      Authentication, fraud, and verification systems sit on critical user journeys, so resilience evidence matters as
      much as feature breadth.
    diligencePath: >-
      Request SLA language, twelve-month uptime history, severity-one incident summaries, and release rollback
      procedures.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: benchmarked-performance
    missingEvidence: >-
      Independent benchmarks for fraud-model precision/recall, verification match rates, abandonment reduction, and
      support-cost impact.
    whyItMatters: >-
      Public materials document capability breadth, but underwriting product quality requires evidence that the
      integrated stack performs well in production.
    diligencePath: >-
      Request reference-call notes, third-party evaluations, and customer dashboards that show pre/post outcome deltas
      by module.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE002
      - TE003
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A current customer reference list showing production vs pilot status, deployment dates, and at least basic scale
      for each cited logo.
    whyItMatters: >-
      Named outcomes drive most of the bullish customer case, but several high-value references remain unnamed or lack
      deployment timing and volume.
    diligencePath: >-
      Request a dated customer reference pack or reference-call list separating live production customers from pilots
      and logo-only permissions.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: durability-gap
    missingEvidence: Current NRR, GRR, churn, renewal-rate, contract-length, and cohort-retention disclosure.
    whyItMatters: >-
      Adoption breadth is easier to prove than customer durability, and without retention data it is hard to underwrite
      expansion efficiency or logo quality.
    diligencePath: >-
      Ask management for recent retention cohorts, gross/net retention, renewal timing, and attach-rate movement by
      major product module.
    relatedQuestionRefs:
      - QU005
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: >-
      Revenue concentration by top customers, top verticals, and partner-sourced channels, plus any exposure to a small
      number of very large banking accounts.
    whyItMatters: >-
      The public proof set skews toward very large regulated enterprises, which can imply strong ACV but also hidden
      concentration risk.
    diligencePath: >-
      Request customer concentration, vertical mix, partner-channel mix, and ARR share for the largest accounts during
      management diligence.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: material
    topic: regulatory-proof-gap
    missingEvidence: >-
      Current certification matrix, any FedRAMP or equivalent authorization roadmap, and any public legal or regulatory
      matter schedule.
    whyItMatters: >-
      Without those materials, investors cannot verify whether regulated-sector expansion depends on capabilities that
      are not yet externally validated.
    diligencePath: >-
      Request the current compliance pack, certification roadmap, outside counsel summary of material matters, and
      vertical-specific authorization assumptions used in pipeline planning.
    relatedQuestionRefs:
      - QR002
      - QR008
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: resilience-proof-gap
    missingEvidence: Twelve-month uptime history, incident log, disaster-recovery test evidence, and contractual SLA terms.
    whyItMatters: >-
      Transmit can sit in the authentication and fraud-decision path, so resilience failures would directly affect
      customer conversion, support cost, and trust.
    diligencePath: >-
      Request the status-page archive, postmortems, DR exercise summaries, service-credit terms, and
      severity-by-severity incident response metrics.
    relatedQuestionRefs:
      - QR003
      - QR008
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: commercial-transparency
    missingEvidence: >-
      Current customer concentration, renewal and retention metrics, top-account exposure, export-rights terms, and
      runway or burn disclosures.
    whyItMatters: >-
      Enterprise pricing, smaller-buyer-base signals, and potential lock-in matter more if growth or retention is
      concentrated in a narrow group of large accounts.
    diligencePath: >-
      Request top-10 customer revenue share, cohort retention, termination and migration clauses, password-hash export
