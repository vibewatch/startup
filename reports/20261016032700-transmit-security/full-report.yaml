              - CP013
      - number: '3.2'
        title: Differentiation and switching costs
        blocks:
          - type: paragraph
            body: >-
              Transmit's strongest product argument is breadth inside a single vendor boundary. The official platform
              pages and ForesightIQ both describe Mosaic as a combined identity-management, fraud-prevention,
              identity-verification, and orchestration stack, and market-intelligence pages track it as a unicorn- scale
              identity company rather than a niche point tool. That combination is strategically important in regulated
              enterprise accounts because the more modules a customer adopts, the more operational logic, compliance
              workflows, and fraud controls become embedded in one platform. The result is a plausible switching-cost
              advantage after initial adoption: replacing authentication alone is easier than replacing authentication,
              fraud operations, identity proofing, and the workflow layer together. The same breadth, however, also
              creates room for competitors to argue that simpler, narrower products will be faster to deploy.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP011
          - type: table
            tableRef: TP002
