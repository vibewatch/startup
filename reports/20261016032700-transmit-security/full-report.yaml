  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          Historical >$100M ARR milestone understates current scale; platform breadth wins more large regulated
          enterprises; pricing floors hold
        - >-
          Upside requires that current ARR, retention, and margin support a premium software multiple above what public
          evidence alone proves
        - Would improve if management discloses strong 2025-2026 ARR growth and clean cap-table terms
        - Growth stalls, or new terms reveal heavy preference or secondary pressure
      - - Base
        - Company remains strategically relevant, but public proof is still mostly historical or company-issued
        - >-
          Fair value should be judged only after fresh private metrics and financing terms are reviewed; until then
          entry should stay disciplined
        - Most consistent with stale public mark, 2026 pricing proof, and absent IPO timetable
        - Another year passes without fresh financial disclosure or liquidity progress
      - - Bear
        - >-
          2021-2022 momentum has faded; implementation intensity and compliance burden weigh on margins; prior mark has
          not cleared in today's market
        - >-
          A reset or down-round would imply poor returns from the last visible unicorn valuation and compress exit
          optionality
        - Would gain weight if current revenue is materially below the trajectory implied by the 2022 press release
        - Weak renewal, concentration, or fundraising terms surface in diligence
    notes: >-
      Scenario rows are not disclosed company forecasts. They translate retained evidence and documented gaps into
      underwriting frames, so missing private inputs remain explicit rather than estimated away.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV008
      - CV011
      - CV012
      - CV013
      - CV014
