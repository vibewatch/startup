      - number: '5.3'
        title: Maturity and roadmap signals
        blocks:
          - type: paragraph
            body: >-
              The assigned public evidence supports an "actively shipping" verdict more strongly than a "fully proven at
              scale" verdict. The 2026 release-notes surface shows updates in February, March, May, June, August, and
              September across identity orchestration, customer identity management, fraud prevention, identity
              verification, passwordless authentication, device management, and fraud operations. That cadence implies
              current product investment and expanding module depth. At the same time, most of the maturity proof in
              this pool is vendor-authored or partner-mediated, so release velocity is visible while operational
              quality, upgrade friction, and support burden remain less transparent.
            claimRefs:
              - CE007
              - CE010
              - CE013
      - number: '5.4'
        title: Trust, privacy, and technical risks
        blocks:
          - type: paragraph
            body: >-
              Trust and compliance controls are explicit parts of the public product story. Transmit's privacy statement
              says the company is usually a processor when enterprise customers use the platform to verify end users,
              but it also acts as a controller for Identity Network profile reuse and some service improvement use
              cases. The same policy confirms biometric handling and a stated retention limit of no more than one year
              after last service use. Those disclosures are useful, but the chapter's assigned sources still document
              privacy roles more clearly than they document public uptime commitments, independently measured
              fraud/verification accuracy, or customer-reported implementation effort.
            claimRefs:
              - CE011
              - CE012
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated scope is the core product story
            body: >-
              The strongest consistent signal across official and partner materials is not a single killer feature; it
              is the claim that orchestration, authentication, fraud controls, and identity verification can be composed
              inside one customer-identity platform.
