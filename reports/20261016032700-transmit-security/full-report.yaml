          - type: callout
            title: Operational proof trails module breadth
            body: >-
              The assigned pool makes integration standards, consulting support, and release cadence visible, but it
              still leaves public uptime, benchmark accuracy, and implementation-effort proof thinner than the product
              packaging itself.
            calloutType: risk
            claimRefs:
              - CE007
              - CE009
              - CE010
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buyer-user structure
        blocks:
          - type: paragraph
            body: >-
              Transmit Security's disclosed customer base is best understood as enterprise buyers funding a platform
              used by their own end customers rather than by internal employees alone. Its current product pages
              position Mosaic for both B2C and B2B journeys including registration, login, payments, onboarding,
              consent, and self-service, while the privacy statement distinguishes the paying enterprise customer from
              the end user whose identity or fraud signals are processed. The public proof set is concentrated in
              regulated, high-risk customer-facing sectors—especially banking and adjacent financial services—then
              broadens into insurance and retail. That implies a buyer set led by identity, fraud, security, and
              digital-product owners, with the end user typically being a consumer or business user moving through a
              customer journey rather than a workforce identity flow.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU012
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU012
              - CU013
              - CU014
      - number: '6.2'
        title: Public adoption proof and deployment scale
        blocks:
          - type: paragraph
            body: >-
              Transmit has more than logo-only proof, but the quality of that proof varies. The company and case-study
              directory both anchor the installed base in banks, insurers, retailers, and other large brands, and the
              2022 press release is unusually concrete by private-company standards: it claims 51% customer-base growth
              in the first half of 2022, more than $100 million of ARR, and customer additions including Goldman Sachs,
              BRED Banque Populaire, and America's Car-Mart. The named-proof layer is strongest where a use case or
              outcome is stated—such as a 100% passwordless marketplace, a 200 million-client banking deployment, tens
              of millions in annual savings, or a 98% fraud-reduction result—rather than where a logo appears without
              deployment detail. Independent platform evidence also exists through Gartner Peer Insights, but the review
              base is still small relative to mega-vendor peers.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU010
      - number: '6.3'
        title: Durability, expansion, and concentration remain under-disclosed
        blocks:
          - type: paragraph
            body: >-
              The customer story is directionally attractive but not yet durable enough for a clean underwriting
              conclusion. Public materials show expansion vectors—more identity steps, more channels, and potentially
              cross-customer identity reuse through the Identity Network—but they do not disclose NRR, GRR, churn,
              renewal rates, contract lengths, or top-customer mix. The independent review signal is also modest:
              Gartner shows 31 ratings at 4.5 out of 5, which confirms live usage but is not broad enough to validate
              retention or cohort quality on its own. As a result, the right read is not “customer quality proven,” but
              rather “enterprise adoption proven, durability still partly opaque.”
            claimRefs:
              - CU006
              - CU009
              - CU011
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Strongest public proof
            body: >-
              Named banks, insurers, and retailers with explicit deployment outcomes give Transmit more customer proof
              than a logo wall, especially in regulated customer-identity workflows.
            calloutType: strength
            claimRefs:
              - CU004
              - CU005
              - CU010
          - type: callout
            title: Main customer-quality gap
            body: >-
              Public evidence does not disclose retention, concentration, or current customer-count denominators, so
              adoption breadth is clearer than customer durability.
            calloutType: risk
            claimRefs:
              - CU006
              - CU009
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk landscape
        blocks:
          - type: paragraph
            body: >
              The strongest public evidence supports a broad product footprint, but that same breadth creates
              underwriting risk because Mosaic appears to sit in the critical path for registration, login, fraud
              controls, and identity verification. Official and partner materials portray a unified orchestration layer
              for identity and fraud, while independent reviewers describe the platform as enterprise-priced, complex
              enough to require staged implementation, and harder to exit once embedded. That makes the residual risk
              profile less about feature scarcity and more about deployment friction, vendor dependence, pricing fit,
              and the lack of public proof for some regulated-workload requirements.
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR014
