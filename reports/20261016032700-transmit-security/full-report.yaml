          value: Orchestration, authentication, fraud, and identity verification
        - id: enterprise-pricing
          label: Enterprise pricing floor
          value: $50k-$200k annual starting packages
        - id: historical-scale
          label: Historical scale proof
          value: '>$100M ARR and 40% H1 2022 revenue growth'
        - id: transparency-gap
          label: Transparency gap
          value: No current ARR, NRR, margin, runway, or cap-table disclosure
        - id: exit-gap
          label: Exit gap
          value: No public IPO date or timeline disclosed
        - id: decision
          label: Decision
          value: Research-more / high risk / expensive
      edges:
        - from: product-breadth
          to: historical-scale
        - from: enterprise-pricing
          to: historical-scale
        - from: historical-scale
          to: decision
        - from: transparency-gap
          to: decision
        - from: exit-gap
          to: decision
    approximationNotes: >-
      This figure is a qualitative logic chain rather than a weighted scoring model; it shows the sequence of
      underwriting signals, not a quantified probability tree.
