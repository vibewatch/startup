chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Transmit Security consistently presents itself as an enterprise identity-security platform rather than a
              narrow point product. Official product pages and external profiles describe Mosaic as a combined identity
              management, authentication, orchestration, fraud-prevention, and identity-verification stack serving
              complex customer journeys across channels. That product identity is clearer than the corporate-footprint
              story: third-party and official materials point to Boston, while the company’s November 2025 press release
              uses a combined Boston-and-Tel-Aviv dateline. The assigned evidence therefore supports a transatlantic
              operating footprint, but not a single clean headquarters statement that later chapters can treat as
              definitive without follow-up diligence.
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO009
              - CO010
