              - CI012
              - CI013
              - CI016
      - number: '4.3'
        title: Public traction proof is historical, while current capital adequacy is still opaque
        blocks:
          - type: paragraph
            body: >-
              Public traction evidence exists, but it is mostly historical and largely company-issued. The strongest
              explicit numeric disclosure in the assigned pool is an August 2022 press release claiming more than $100
              million of ARR, 40% year-over-year first-half revenue growth, and 51% customer-base growth since the June
              2021 Series A. A FIDO Alliance company profile adds a broader scale signal by describing deployments at
              large banks, insurers, and retailers responsible for more than $1.3 trillion in annual commerce. Those
              facts indicate real enterprise reach, but they do not update the current revenue base, customer
              concentration, or retention picture, and none of the retained sources discloses current cash, burn,
              runway, debt, or financing triggers. That leaves capital adequacy and the next-round dependency as
              diligence topics rather than underwritten facts.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI016
      - number: '4.4'
        title: 'Verdict: credible enterprise monetization, but weak public underwriting visibility'
        blocks:
          - type: paragraph
            body: >-
              Financially, Transmit Security looks like a sales-led enterprise platform with meaningful pricing power at
              the entry tier, broad module coverage across identity, fraud, and verification, and customer outcomes that
              can plausibly support ROI-oriented selling into regulated enterprises. The underwriting problem is not
              whether a revenue model exists; it is that public evidence stops before the numbers investors actually
              need to test revenue quality and capital intensity. Without a current revenue bridge, realized pricing by
              module, gross margin, services attach, CAC or payback, and cash-runway disclosures, the chapter can
              support a qualified view on revenue architecture but not a clean view on margin path or financing
              sufficiency.
            claimRefs:
              - CI001
              - CI007
              - CI008
              - CI010
              - CI014
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial model is enterprise-first from the first published price point
            body: >-
              Even before discounts or scale pricing, public list prices start at enterprise ACV levels and route buyers
              into a sales process, which is consistent with a high-touch CIAM and fraud platform rather than a
              self-serve SaaS motion.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: callout
            title: Capital adequacy is still a diligence blocker
            body: >-
              The assigned public sources do not provide current cash, burn, runway, debt, or financing-trigger
              disclosures, so investors cannot test how long Transmit can fund product, services, and go-to-market at
              the current operating scope without management materials.
            calloutType: risk
            claimRefs:
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform scope and module coverage
        blocks:
          - type: paragraph
            body: >-
              The official product pages describe Mosaic as a broad customer-identity platform, not a narrow
              authenticator. Transmit says one platform covers identity management, fraud prevention, and identity
              verification across the user lifecycle and across user-facing channels, while the FIDO showcase echoes the
              same "entire customer identity lifecycle" framing. In workflow terms, the documented scope spans
              onboarding, login, account recovery, session/profile management, and risk checks inside one control plane.
              That breadth is the core product story and the main differentiator repeated across official, partner, and
              third-party profile surfaces.
            claimRefs:
              - CE001
              - CE002
              - CE005
