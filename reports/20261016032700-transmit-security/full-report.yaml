      - number: '1.3'
        title: Funding credibility is stronger than current-scale transparency
        blocks:
          - type: paragraph
            body: >-
              The public record clearly anchors a large June 2021 Series A, but it does not cleanly settle the current
              cap-table narrative. Tracxn reports $543 million raised and a $2.7 billion current valuation, while
              Indexed reports $583.0 million across two rounds and CheckThat.ai publishes low-confidence valuation and
              revenue estimates that it explicitly labels algorithmic rather than verified. Adoption signals are better
              than operating-metric disclosure: BusinessWire and FIDO both place Transmit in large regulated
              enterprises, including top U.S. banks, yet no retained source provides current ARR, revenue, customer
              count, debt, secondaries, or a reconciled valuation bridge. Investors can underwrite product relevance
              from public sources more confidently than present-day financial scale.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO012
              - CO014
      - number: '1.4'
        title: Milestones show durable positioning, but proof gaps still matter
        blocks:
          - type: paragraph
            body: >-
              The dated milestones that do appear are meaningful. The evidence supports a 2014 founding, a 2018 UK
              entity, a June 2021 Series A that pushed the company into unicorn territory, a 2022 U.S. legal entity, and
              a cluster of late-2025 signals around Gartner recognition and updated privacy disclosures. Together they
              show a company still investing in enterprise credibility and governance surfaces. The more important gap
              is not chronology but precision: later chapters should treat board oversight, ownership changes, customer
              concentration, and current commercial scale as open diligence items rather than as facts already
              established by this overview.
