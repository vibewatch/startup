              - CO015
      - number: '1.2'
        title: Founder-led leadership with limited public governance detail
        blocks:
          - type: paragraph
            body: >-
              The leadership narrative remains strongly founder-centric. External company databases and the company’s
              own November 2025 announcement identify Mickey Boodaei and Rakesh Loonkar as co-founders, with Boodaei
              serving as CEO and Loonkar as President. BusinessWire also introduces David Mahdi as CIO, which suggests
              some senior functional depth beyond the founders, but the assigned pool does not disclose board
              composition, control rights, committee structure, or any financing-linked governance terms. That leaves
              key-person dependence elevated: founder continuity is a positive signal for product coherence, yet it also
              concentrates explanatory power in a small set of publicly visible operators.
            claimRefs:
              - CO002
