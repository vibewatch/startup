  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual risk clusters around deployment complexity, sensitive-data governance, and commercial concentration
      rather than product capability gaps.
    data:
      columns:
        - High likelihood
        - Medium likelihood
        - Lower likelihood
      rows:
        - label: Critical impact — delivery
          values:
            - label: Integration complexity
              detail: Architecture-specific rollouts can extend well beyond a basic implementation.
            - label: Privacy / controller scope
              detail: Identity-network and service-improvement workflows can move Transmit into a controller role.
            - label: FedRAMP / public-sector gap
              detail: Independent review says FedRAMP was not yet attested as of 2026.
        - label: Critical impact — compliance
          values:
            - label: Sensitive ID-data handling
              detail: Identity-verification workflows can process government-issued IDs and selfies.
            - label: Commercial transparency
              detail: Public evidence does not close renewal, concentration, runway, or export-rights questions.
            - label: Partner-proof concentration
              detail: >-
                Regulated-vertical partner validation is visible, but diversified channel proof is thin in the assigned
                pool.
        - label: High impact — commercial
          values:
            - label: Enterprise pricing / buyer concentration
              detail: Opaque quote pricing and high entry thresholds can narrow the addressable buyer base.
            - label: Vendor lock-in
              detail: Independent review describes migration in and out as involved with high exit effort.
            - label: Support-capacity dependence
              detail: Positive onboarding feedback implies delivery quality matters for complex deployments.
        - label: High impact — resilience
          values:
            - label: Limited public uptime evidence
              detail: The assigned pool does not provide public SLA, uptime, or incident-history evidence.
            - label: Fraud-tuning quality risk
              detail: Broad AI-driven control claims are not paired with public false-positive or rollback metrics.
            - label: Execution-capacity uncertainty
              detail: Public team-growth signals exist, but operating-capacity metrics are not disclosed.
        - label: Moderate impact — customer
          values:
            - label: Onboarding dependence
              detail: Complex deals may depend on strong technical-team involvement.
            - label: Regional or data-residency proof gap
              detail: Assigned evidence does not fully document localized operating guardrails by market.
            - label: Verification-workflow sensitivity
              detail: Errors in high-assurance verification flows would carry customer-support and trust costs.
        - label: Moderate impact — diligence gap
          values:
            - label: Litigation visibility gap
              detail: The assigned pool does not include a public docket or material-matters schedule.
            - label: Concentration visibility gap
              detail: No public top-customer, renewal, or churn disclosure is retained in this pool.
            - label: Runway visibility gap
              detail: Funding and profitability references do not establish current burn or cash runway.
    claimRefs:
      - CR004
      - CR006
      - CR008
      - CR009
      - CR010
      - CR012
      - CR013
      - CR016
      - CR017
