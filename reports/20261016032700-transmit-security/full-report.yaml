      - number: '3.3'
        title: Commercial pressure and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Public commercial evidence remains mixed in a way that weakens moat confidence. Transmit publishes
              packaging and charging mechanics, but not public list prices; buyers must request a quote based on MAUs or
              event volume, use case, and deployment architecture. Competitor-authored evidence uses that gap to shift
              the buying conversation toward total cost and implementation friction. LoginRadius argues that teams leave
              or avoid Transmit when they want broader built-in B2B depth, lower engineering overhead, or faster
              deployment. PeerSpot's comparison snippets repeatedly frame Transmit as more structured or more expensive
              than some alternatives, but those pairwise narratives are inconsistent and should be treated only as
              directional pressure signals rather than benchmark pricing proof. Dealroom and Gartner show enough scale
              to matter in enterprise evaluations, yet neither closes the key diligence gap around realized pricing,
              services intensity, or win/loss performance against incumbents.
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP008
              - CP010
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP008
              - CP010
              - CP011
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Transmit's moat case is integration breadth, not public pricing transparency
            body: >-
              The clearest defensible difference in the assigned pool is product bundling: orchestration, fraud
              operations, identity verification, and authentication sit under one vendor boundary, which can matter for
              regulated enterprises trying to reduce vendor sprawl.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP011
          - type: callout
            title: Competitors can attack deployment friction and TCO before feature parity is settled
            body: >-
              Because public pricing is quote-led and competitor-authored evidence repeatedly frames alternatives as
              easier to deploy or cheaper to start, Transmit may have to win a more expensive and more consultative
              sales process than narrower CIAM tools or Microsoft-native status quo paths.
            calloutType: risk
            claimRefs:
              - CP003
              - CP008
              - CP010
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Pricing is public enough to show the revenue architecture, not enough to show realized economics
        blocks:
          - type: paragraph
            body: >-
              Transmit Security's public materials make the monetization structure unusually legible at the top of the
              funnel for a private cybersecurity company: Mosaic is sold as modular enterprise software with indicative
              list pricing, usage-based billing units, and rapid follow-up through a sales quote rather than self-serve
              checkout. The company publishes four starting points across its main customer-identity bundles, but every
              disclosed number is still conditional on use case, deployment architecture, and scale, so list pricing is
              not the same as realized contract value or recognized revenue. Independent review coverage reinforces the
              same conclusion and adds the adverse read-through: buyers can see enough to infer a six-figure ACV motion,
              but not enough to normalize discounts, multi-module take rates, renewal uplift, or large-volume pricing
              above the published baselines.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
