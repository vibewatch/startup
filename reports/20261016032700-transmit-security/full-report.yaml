  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adjacent spend
        blocks:
          - type: paragraph
            body: >-
              The strongest source-backed boundary is customer identity and access management rather than generic
              cybersecurity or workforce-only IAM. Gartner places Transmit Security in an access-management category
              that is explicitly "transitioning to Customer Identity and Access Management (CIAM)," while the company
              and partner materials repeatedly describe the platform as a customer-identity stack that combines
              orchestration, fraud prevention, and identity verification. That means the included spend is customer
              onboarding, authentication, account recovery, fraud controls, and identity-proofing workflows, especially
              where those flows must work across channels and geographies. The clearest excluded spend is pure workforce
              passwordless software or generic security tooling that is not wired into customer journeys. One
              third-party comparison broadens the scope to workforce, B2B, and B2C in one platform, so workforce should
              be treated as an adjacent expansion path rather than the default market boundary until Transmit discloses
              package mix or revenue split by module.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM007
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing and enterprise budget lens
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not offer a credible standalone TAM, SAM, or SOM estimate, so the better approach
              is to preserve several narrower public lenses instead of inventing one giant market number. The first lens
              is category depth: Gartner shows Transmit participating across CIAM-adjacent review markets, and Tracxn
              counts a large competitive field, which supports the view that the company sells into a crowded but real
              identity stack budget. The second lens is contract size: a 2026 comparison page publishes entry pricing
              from $50,000 per 100,000 identity checks to $200,000 per year for the full platform, which points to
              enterprise-only budget ownership rather than SMB self-serve adoption. The third lens is installed-base
              scale: company and partner pages cite customer bases tied to more than $1.3 trillion and more than $2
              trillion of annual commerce, but the figures do not reconcile cleanly and should be preserved as a range,
              not a precise current market-size claim. CheckThat.ai adds a fourth lens by calling its figures
              algorithmic estimates rather than verified disclosures, which is directionally useful but still not a
              disclosure-grade valuation signal.
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
