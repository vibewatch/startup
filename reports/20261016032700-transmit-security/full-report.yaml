              - CR016
              - CR017
      - number: '7.2'
        title: Regulatory and privacy exposure
        blocks:
          - type: paragraph
            body: >
              The clearest legal and regulatory risk comes from the sensitivity of the data handled and the fact pattern
              in Transmit's own privacy statement. The company says it is usually a processor for customer-provided user
              data, but becomes a controller in some Identity Network and service-improvement scenarios. The same policy
              says identity-verification services can process government-issued IDs and selfies, which raises the cost
              of any control failure or ambiguous responsibility split. Independent review also says FedRAMP was not yet
              attested as of 2026, so expansion into public-sector or similar authorization-heavy workloads should not
              be underwritten from public marketing alone.
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR016
      - number: '7.3'
        title: Operational and dependency risk
        blocks:
          - type: paragraph
            body: >
              External review evidence points to real implementation and dependency risk even though user feedback is
              directionally positive. StackInsight says deployment complexity varies with architecture and that advanced
              features can extend rollout time materially beyond a basic implementation, while Gartner review evidence
              suggests user experience and onboarding can be strong when the technical team is engaged. Those two facts
              can coexist: complex, high-stakes deployments may still land well, but they appear to depend on
              implementation quality, support capacity, and tuning discipline. The assigned pool does not provide a
              public uptime history, formal SLA evidence, or incident archive, leaving an unresolved resilience question
              for a platform that can sit directly in the authentication and fraud-decision path.
            claimRefs:
              - CR003
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
              - CR017
      - number: '7.4'
        title: Investment implication and kill criteria
        blocks:
          - type: paragraph
            body: >
              The investment implication is that Transmit may be attractive when a buyer values unified CIAM, fraud, and
              verification enough to absorb enterprise pricing and implementation work, but risky if the deal thesis
              requires broad customer fit, low switching friction, or public-sector readiness. Public evidence is not
              strong enough to clear customer concentration, renewal durability, runway, uptime resilience, or
              data-portability risk. A thesis break should trigger if diligence shows unclear controller boundaries by
              module, weak export and migration rights, absent certification or incident evidence for target verticals,
              or a growth plan that still depends on a narrow set of regulated enterprise accounts.
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR008
              - CR009
              - CR014
              - CR016
              - CR017
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-confidence risk cluster
            body: >-
              The clearest underwritable risks are enterprise deployment complexity, sensitive-data governance, and a
              commercial model that appears optimized for large regulated accounts rather than broad self-serve
              adoption.
            calloutType: risk
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR010
              - CR011
              - CR014
          - type: callout
            title: Kill criteria before conviction
            body: >-
              Escalate to a no-go if diligence cannot prove clean controller boundaries by module, credible
              migration/export rights, current uptime and incident evidence, and enough customer diversification to
              offset enterprise-pricing concentration risk.
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR009
              - CR016
              - CR017
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment call and thesis balance
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a serious enterprise identity platform rather than a speculative concept. Transmit
              Security's current product pages still show orchestration, authentication, fraud, and
              identity-verification breadth, while third-party pricing captures six-figure annual entry points that fit
              an enterprise sales motion. The problem is not product relevance; it is valuation confidence. The latest
              public financing anchor in the assigned pool is still the June 2021 Series A at a reported $2.2 billion
              valuation, and the freshest revenue proof is a company-issued August 2022 statement that ARR exceeded $100
              million. Without a newer valuation mark, current financial disclosures, or clear liquidity path, the
              underwriting posture should stay research-more rather than buy.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV009
              - CV012
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV007
              - CV013
              - CV014
      - number: '8.2'
        title: Valuation context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The financing context is still dominated by the outsized 2021 Series A, which gave the company a premium
              cybersecurity valuation during a much richer software market. Public evidence in this pool shows the
              company has maintained broad product ambition, enterprise packaging, and a live hiring engine that
              includes stock-option compensation, but it does not reveal the current preference stack, option-pool size,
              secondary pricing, or whether any later insider or structured financing reset the effective mark. The
              privacy statement also shows the platform carries controller and biometric data responsibilities that
              matter for enterprise diligence and could add compliance cost if growth slows. Entry discipline therefore
              has to assume valuation opacity and require fresh private-market evidence before treating the 2021 unicorn
              mark as a dependable 2026 reference point.
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Scenarios, exit readiness, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The bull case depends on Transmit Security turning platform breadth, enterprise pricing, and historical
              growth into a much larger recurring revenue base than the public record shows today. The base case assumes
              the company is strategically valuable but still too opaque on current financials and financing terms for a
              clean price call. The bear case is that historical momentum has slowed, implementation-heavy enterprise
              delivery constrains margins, and the last known valuation remains above what a refreshed market clearing
              price would support. Exit readiness is also weakly evidenced because the assigned pool explicitly says no
              IPO timeline has been announced. The next diligence step is therefore not to debate product quality, but
              to obtain current ARR, retention, gross margin, customer concentration, and cap-table evidence that could
              reprice the recommendation.
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Stay at research-more. The assigned evidence still supports meaningful product and enterprise-sales
              substance, but it does not support a fresh price-clearing valuation in 2026.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV013
              - CV014
          - type: callout
            title: Main underwriting risk
            body: >-
              The biggest risk is paying against the 2021 unicorn mark without current ARR, retention, gross-margin,
              concentration, or preference-stack evidence.
            calloutType: risk
            claimRefs:
              - CV001
              - CV011
              - CV012
              - CV013
              - CV014
          - type: callout
            title: What would move the call
            body: >-
              A cleaner valuation view would require updated ARR, renewal, gross-margin, and cap-table evidence plus
              either a new financing mark or a credible liquidity path.
            calloutType: assumption
            claimRefs:
              - CV002
              - CV007
              - CV011
              - CV013
              - CV014
