      - number: '5.2'
        title: Architecture, integrations, and delivery model
        blocks:
          - type: paragraph
            body: >-
              Public materials point to a composable architecture that blends no-code orchestration with
              microservices-based identity services. The platform page describes drag-and-drop and natural-language
              journey design for registration, login, and payments, plus a CIAM layer for B2C and B2B lifecycle
              management. Partner materials add that deployments rely on APIs, SDKs, and standards integrations such as
              OAuth 2.0, OpenID Connect, SAML, and FIDO2, while the AWS Marketplace consulting offer makes clear that
              enterprises often buy implementation help rather than treating Mosaic as a plug-and-play utility. That
              combination suggests real flexibility, but also meaningful integration and change-management work.
            claimRefs:
