      - number: '4.2'
        title: Service delivery and support are clearly relevant, but not quantified
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence suggests that first-year economics are driven by more than software subscription
              fees. Independent pricing analyses and review coverage consistently point to implementation labor, journey
              design, integration effort, training, and support as material cost drivers, while the official pricing
              page confirms a 99.99% uptime commitment and premium support across plans. The company also frames the
              product around orchestrating regulatory, business, and security requirements across many platforms, which
              is strategically attractive but usually implies meaningful solution-engineering and customer-success
              effort. That combination supports the view that Transmit can command high starting ACVs, yet it leaves
              public investors without a credible margin bridge because neither professional-services pricing nor
              steady-state support intensity is disclosed.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI015
          - type: table
