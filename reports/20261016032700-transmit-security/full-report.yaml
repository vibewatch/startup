  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Market set and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence places Transmit Security in a much wider comparison set than pure fraud tools.
              Gartner's alternative list surfaces Okta Workforce Identity, Ping Identity Platform, Microsoft Entra ID,
              and Oracle Access Management as top substitutes, while LoginRadius frames evaluations around broader CIAM
              depth, B2B tenant management, developer tooling, data residency, and operational simplicity. That means
              buyers are not only comparing "identity plus fraud" specialists; they are also weighing large incumbent
              IAM suites, Microsoft-native paths, and lighter-weight CIAM platforms. Independent case-study and
              market-intelligence pages also describe Mosaic as a broad CIAM stack for large, customer-facing
              deployments, so the real shortlist is not just feature parity but also proof of scale and implementation
              fit. For Microsoft-heavy or workforce-adjacent environments, the realistic status quo may be expanding
              existing identity stacks rather than buying a net-new dedicated platform. For regulated enterprises
              running large customer bases, the short list is therefore likely to include platforms with stronger
              ecosystem gravity or easier deployment stories even when Transmit leads on product breadth.
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP009
              - CP012
