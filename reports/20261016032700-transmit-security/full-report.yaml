  - id: FI001
    title: Public revenue model bridge
    type: flow
    summary: >-
      Public evidence shows how customer activity reaches a quote, but not how that quote converts into margin or
      runway.
    data:
      nodes:
        - id: usage
          label: Customer activity
          value: MAUs, logins, ID checks
          note: Different modules meter different customer behaviors rather than a single universal unit.
        - id: modules
          label: Module selection
          value: Identity / Fraud / Verification / Full platform
          note: Customers can buy point modules or the bundled platform.
        - id: list-price
          label: Indicative list pricing
          value: $50k-$200k annual starting points
          note: Published baselines establish enterprise ACVs but not realized deal terms.
        - id: quote
          label: Custom sales quote
          value: Depends on use case, volume, deployment architecture
          note: Final price is confirmed after sales engagement, usually within 24 hours.
        - id: services
          label: Implementation and services layer
          value: Journey design, integrations, training, support setup
          note: Independent sources say this layer can dominate first-year TCO, but rates are private.
        - id: operations
          label: Ongoing operating burden
          value: 99.99% SLA, premium support, privacy/compliance obligations
          note: Identity verification and identity-network services add data-governance obligations alongside support cost.
        - id: visibility-gap
          label: Margin and capital visibility gap
          value: No public current ARR bridge, gross margin, cash, burn, or runway
          note: Public evidence supports the revenue architecture, but not financing adequacy.
      edges:
        - from: usage
          to: modules
          label: Workload and use case determine what is bought
        - from: modules
          to: list-price
          label: Each module has its own published baseline
        - from: list-price
          to: quote
          label: List pricing converts into a custom enterprise proposal
        - from: quote
          to: services
          label: Deployment scope adds nonpublic services costs
        - from: services
          to: operations
          label: Support and compliance shape steady-state cost-to-serve
        - from: operations
          to: visibility-gap
          label: Public disclosures stop before margin and runway are visible
    approximationNotes: >-
      The flow is qualitative and sequence-based; it summarizes public evidence about how pricing and service
      obligations connect, not a quantified revenue-recognition or gross-profit bridge.
