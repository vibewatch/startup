              - CM014
      - number: '2.3'
        title: Buyer segmentation, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The public buyer pattern skews toward large regulated enterprises, especially banks, insurers, retailers,
              and other customer-facing brands that need security, compliance, and low-friction digital journeys at the
              same time. The strongest adoption driver is consolidation: multiple sources position Mosaic as an
              orchestration layer that can combine authentication, fraud controls, and identity verification under one
              operating model, which is valuable when identity stacks are fragmented. The strongest adoption constraints
              are also visible in the pool: public entry pricing starts at enterprise levels, Gartner user feedback
              still flags SDK and custom-UX friction, and public marketing pages do not lay out a full certification
              list even though the privacy and identity-verification materials make clear that biometric, KYC, and
              controller-processor issues matter. In practice, that means valuation upside depends on whether buyers
              prefer one broader platform contract enough to offset implementation complexity and procurement diligence
              in regulated accounts.
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
              - CM016
