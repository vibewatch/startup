- id: financing-context
  title: Financing context supports tracking, not complacency
  body: 'Public valuation context gives Juwan credibility but not price certainty. The 2024 GAC/GAIG transaction implies about RMB 7.1 billion of equity value, while earlier reporting pointed to roughly RMB 8 billion around the Tencent-backed 2022 round. Hurun''s 2026 unicorn materials reinforce the idea that the company still belongs in the unicorn conversation. But none of those marks answer the most important underwriting question: whether the company can justify a new entry at those levels on commercial evidence rather than strategic sponsorship.


    That distinction matters because public-company comparables disclose far more. BYD, for example, publishes audited results and sits inside filing systems that let investors track financial performance directly. Juwan does not. This asymmetry argues for caution: without revenue, cap table, and customer concentration data, a prior strategic mark should be treated as a ceiling to challenge—not as a floor to automatically accept.'
