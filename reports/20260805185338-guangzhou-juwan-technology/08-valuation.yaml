    - Separates logos from durable revenue
    - Commercial diligence
  - - Cap table and preferences
    - Current ownership, rights, dilution, and sponsor terms
    - Determines real entry economics
    - Legal / shareholder review
  - - Benchmarking and reliability
    - Side-by-side safety, degradation, and field results
