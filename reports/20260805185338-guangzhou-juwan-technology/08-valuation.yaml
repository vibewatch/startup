company:
  name: Guangzhou Juwan Technology Co., Ltd.
chapter:
  number: 8
  title: Valuation
  summary: 'Juwan still looks like a real company in a valuable category, but not like a price-insensitive buy. The strongest evidence supports a strategic-option view: proven technical relevance, meaningful market context, and unicorn-level transaction anchors. The strongest counter-evidence is the absence of public economics, the strategic nature of the latest valuation mark, and rising competitive and infrastructure pressure. The correct call is to track or research more unless entry price is meaningfully below prior unicorn marks or diligence closes the largest evidence gaps.'
sections:
- id: thesis
  title: Investment thesis and anti-thesis must both start with evidence sensitivity
  body: 'The attractive case for Juwan is easy to state. The company is not a pre-product science project; it has a visible XFC battery story, manufacturing surfaces, named partner and deployment proofs, and exposure to a large Chinese battery and charging market that still matters strategically. Macro demand data remain supportive, and the existence of both 2022 and 2024 unicorn-level valuation anchors shows that sophisticated strategic actors have assigned the asset real value. In that sense, Juwan deserves to stay in an investment committee''s live universe.


    The anti-thesis is just as important and more price-sensitive. Public evidence still does not support revenue quality, margin durability, or runway. The latest price anchor is a connected strategic disposal, not a clean new primary financing round. The underlying market is also concentrating and deflating at the same time, which is a bad combination for smaller suppliers if they cannot prove customer lock-in or cost advantage. So the valuation debate is not “good company or bad company”; it is “how much uncertainty is already embedded in the price?”'
