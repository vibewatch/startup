    - Pause or step away
  - - No customer diversification
    - Non-GAC proof still thin into next financing cycle
    - Raises concentration and stale-mark risk
    - Demand steeper discount
  - - No financial visibility
    - Management cannot produce revenue, margin, and runway package
    - Prevents model-based underwriting
    - Keep at watch / research
  - - Competitive parity without cost proof
    - CATL/BYD continue matching speed while Juwan lacks margin evidence
    - Collapses premium narrative
    - Avoid full-price entry
  notes: These triggers define when a strategic-option story stops being attractive.
