  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-model
    missingEvidence: Revenue, gross margin, cash, burn, debt, and customer concentration needed for a model-based valuation.
    whyItMatters: Without core economics, any current-price underwriting risks false precision.
    diligencePath: Obtain current financial statements, revenue mix, and runway model.
    relatedQuestionRefs:
    - QV008
    - QV009
    - QV018
    - QV025
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Current cap table, preference stack, reserved matters, and dilution mechanics after the strategic transfer.
    whyItMatters: Entry discipline depends on knowing what security is being priced and how downside protections are allocated.
    diligencePath: Review shareholder agreements and post-2024 cap table.
    relatedQuestionRefs:
    - QV016
    - QV023
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: customer-durability
    missingEvidence: Repeat-order evidence and non-GAC customer breadth needed to support a premium scenario.
    whyItMatters: A technology story without durable customers should not trade at a full strategic premium.
    diligencePath: Request customer cohort, reorder data, and top-account revenue concentration.
