      - number: '1.3'
        title: Leadership, backers, and capital signals
        blocks:
          - type: paragraph
            body: >-
              Public leadership disclosure is thinner than the product story. EHang identifies Pei Feng as President of
              Greater Bay Technology in the 2024 partnership announcement, and VentureRadar describes Juwan as a company
              brought together by GAC Group, GAC Capital, the graphene technical team of the GAC Research Institute, and
              a third-party strategic investor. The company therefore looks less like a classic two-founder venture
              startup and more like a strategically incubated technical carve-out from the GAC orbit. That can be an
              advantage for industrial access, but it also creates underwriting questions about board composition,
              voting control, and whether minority investors can influence capital allocation or customer concentration
              decisions.


              The strongest public funding signal is the late-2024 GAC transaction. GAC and GAC Capital agreed to sell
              an 18.82% stake in Juwan to parent GAIG for RMB 1.33 billion, implying equity value of roughly RMB 7.1
              billion. Wiser Asia had earlier reported Tencent's 2022 investment at about RMB 8 billion valuation. Those
              two points are directionally consistent with unicorn status, although they do not prove a liquid
              market-clearing price in 2026. They do show that strategic and state-linked capital continued to ascribe
              material value to the asset. What remains missing is the forward capital story: public sources still do
              not disclose cash, debt, burn, or post-transaction runway.
