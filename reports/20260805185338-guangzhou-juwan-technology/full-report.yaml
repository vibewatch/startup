  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition, modules, and maturity tiers
        blocks:
          - type: paragraph
            body: >-
              Juwan should be understood as a product stack rather than a single battery SKU. The core surface is XFC
              extreme-fast-charging traction batteries for passenger and commercial vehicles, supported by
              charging-solution assets and framed by a broader next-generation storage mission. Baidu Baike and official
              materials add a second tier in the form of the Phoenix battery, which is positioned as a higher-spec
              platform with six-minute 0-80% charging and long-range claims. Public deployment evidence is strongest for
              the mainstream XFC line, while Phoenix and solid-state efforts sit closer to roadmap or emerging-platform
              status.


              This matters because diligence often collapses the whole story into one headline number: minutes to
              charge. That misses the actual module map. Juwan is simultaneously building products, factories,
              validation assets, and a charging-service brand. The right product question is therefore not only “is the
              chemistry fast?” but also “which modules are already delivered, which are scaling, and which remain
              strategic options?”
