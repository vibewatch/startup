      - number: '2.3'
        title: Buyer segmentation, demand drivers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The battery buyer is not the charger user. For the core traction-battery market, the buyers are OEMs,
              fleet vehicle platforms, or industrial-vehicle manufacturers that care about vehicle uptime, charge time,
              and total cost of ownership. For charging infrastructure, the buyers are network operators, site owners,
              utilities, or ecosystem partners who must justify capex, grid interconnection, and utilization. In
              low-altitude mobility, the buyer chain likely includes aircraft OEMs and regulated operators that care
              about certification, turnaround time, and safety rather than only vehicle range. Juwan's public materials
              imply all three layers matter, which is strategically ambitious but commercially complex.


              The main adoption drivers are intuitive and increasingly well evidenced: EV growth, pressure to reduce
              charging inconvenience, and fleet economics that reward faster turnaround. IEA and BNEF both frame
              charging speed and infrastructure sufficiency as central to EV adoption. Juwan's own ecosystem
              story—alliances, stations, and multi-vehicle-category deployments—suggests it is trying to win by selling
              a more complete operating answer than a commodity cell. That is valuable if it works, but it lengthens the
              buyer map and raises execution requirements.
            claimRefs:
