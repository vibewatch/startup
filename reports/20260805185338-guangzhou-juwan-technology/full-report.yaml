      - number: '7.3'
        title: Dependency, financial, and people risks can break the thesis indirectly
        blocks:
          - type: paragraph
            body: >-
              Juwan is unusually dependent on external coordination for a battery company. It needs OEM design-ins,
              charging-network readiness, customer confidence, and sponsor support to line up simultaneously. The EHang
              relationship illustrates both the upside and the risk of this model: a credible application partner can
              validate the technology, but the commercial path may still depend on certification and partner timing
              outside Juwan's control. Heavy-truck programs face a similar issue, where technically interesting pilots
              or deliveries may not turn into recurring economics at the pace investors hope.


              The same dependency logic runs through finance and execution. The connected transaction inside the GAC
              orbit highlights governance questions, not only valuation. Public sources do not tell us whether the
              company can fund factories, inventory, and ecosystem support without another financing event. Hiring
              surfaces suggest that Juwan is still building teams across engineering and operations, but recruiting
              alone does not prove that execution risk is contained. Taken together, these are not small risks: they are
              the channels through which a technically credible company can still miss its commercial moment.
