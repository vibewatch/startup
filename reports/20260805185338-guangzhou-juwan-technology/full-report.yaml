      - number: '4.3'
        title: Valuation signals exist, but liquidity and runway remain open questions
        blocks:
          - type: paragraph
            body: >-
              The most important public financing fact is often misread. The December 2024 HKEX filing makes clear that
              GAC and GAC Capital sold 18.82% of Juwan to GAIG for about RMB 1.331 billion. That confirms the market was
              still assigning Juwan meaningful value, and it triangulates well with Wiser Asia's earlier Tencent-backed
              valuation marker. But it does not automatically mean Juwan itself received RMB 1.331 billion of fresh
              operating cash. The disposal appears to have been a shareholder-level reallocation inside the GAC orbit,
              and both AASTOCKS and Nasdaq framed it as a GAC asset-sale event.


              This distinction is critical for capital adequacy. A strategic secondary can confirm price while leaving
              runway unanswered. Public sources still do not disclose whether Juwan has enough cash to scale factories,
              inventory, testing, and charging-support commitments without another financing event. Because its
              competitive set includes very well-capitalized incumbents and system-level deployment costs, the absence
              of balance-sheet evidence is a material blocker to underwriting.
