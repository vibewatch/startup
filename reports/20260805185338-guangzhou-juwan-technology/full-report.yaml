chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and deployment footprint
        blocks:
          - type: paragraph
            body: >-
              Guangzhou Juwan Technology Co., Ltd. was founded in September 2020 and is headquartered in Nansha
              District, Guangzhou. The company presents itself as GAC Group's first internally incubated mixed-ownership
              high-tech enterprise and positions itself as a battery specialist whose mission is to make EV charging
              feel as fast as refueling. Public company materials describe a business focused on XFC ultra-fast charging
              power batteries and next-generation energy-storage devices rather than a broad EV platform. In practice,
              the public story is a battery-and-charging stack narrative: cells, packs, charging interfaces, and
              ecosystem build-out all sit inside the same brand promise.


              The official site claims a broad deployment footprint. Passenger-car references include GAC AION, GAC
              Trumpchi, and BAIC Arcfox; commercial-vehicle references include FAW Jiefang, Dongfeng heavy truck,
              Shaanxi heavy truck, and GAC Hino; and low-altitude expansion is framed through the EHang partnership.
              That breadth is strategically helpful because it implies the company is trying to avoid being judged only
              as a single-model GAC captive supplier. However, the current public record is much better at proving named
              surfaces than at proving economic scale. No retained source discloses revenue, unit shipments by OEM, or a
              customer mix that cleanly separates pilots, production programs, and actual repeat orders.
