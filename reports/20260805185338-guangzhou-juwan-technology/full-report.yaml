  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and adoption surfaces
        blocks:
          - type: paragraph
            body: >-
              Juwan's customer base should be segmented by job-to-be-done, not by one logo list. Passenger-vehicle OEMs
              are the most obvious battery buyers; fleets and heavy-truck operators care about uptime economics;
              charging-network partners determine whether fast-charging batteries can actually deliver their promised
              convenience; and eVTOL partners represent an emerging adjacent surface. This means Juwan is effectively
              serving several linked customer systems rather than one uniform account class.


              The strongest market logic appears in applications where time saved has direct value. Passenger EVs
              benefit from convenience, but heavy trucks, depots, ports, and logistics hubs can turn fast charging into
              route productivity. The eVTOL story is more speculative commercially, yet it is strategically important
              because it positions Juwan as a fast-turnaround energy supplier beyond road vehicles. As a result, the
              customer map is broad and strategically attractive—but it is also harder to measure because each segment
              has different adoption proof standards. Put differently, the chapter has to judge not just whether the
              company has customers, but whether each customer type can mature into a repeatable, revenue-bearing
              cohort.
