              The main problem is not finding logos. It is finding retention. No retained public source discloses
              customer count, repeat-order rate, churn, NRR, GRR, renewal terms, or top-account concentration. This
              creates a major asymmetry between what public sources can prove and what investors need to know. A battery
              supplier in a competitive market is not underwritten by logo count alone; it is underwritten by repeat
