      - number: '7.4'
        title: Mitigations exist, but the thesis still needs clear kill criteria
        blocks:
          - type: paragraph
            body: >-
              The right response to Juwan's risk profile is not to ignore the upside. The company has some genuine
              mitigants: formal testing surfaces, strategic backers, named partners, early manufacturing evidence, and a
              technology area that still matters to the market. But these mitigants must be judged against the residual
              risks they actually reduce. A testing center does not solve runway. A strategic sponsor does not
              automatically solve minority governance. A named deployment does not solve concentration.


              That is why kill criteria matter. If Juwan fails to show compliance progress under the 2026 safety regime,
              fails to broaden non-GAC customers, or fails to present a credible runway and scale-up KPI package, the
              investment thesis should be downgraded quickly. Conversely, if it can produce those proofs, several
              perceived risks would compress at once. This chapter therefore ends with an operating principle: require
              evidence that directly severs the transmission paths from compliance to customers, from customers to
              financing, and from financing to competitive slippage.
            claimRefs:
