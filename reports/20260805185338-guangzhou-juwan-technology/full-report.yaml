  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive set: direct incumbents, internal build, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Juwan's buyer can solve the same job through several different routes. The most obvious direct route is to
              source high-performance batteries from the large Chinese incumbents, led by CATL and BYD. A second route
              is OEM internal build or tightly controlled captive supply, which is increasingly visible through brands
              such as Geely and FAW Hongqi. A third route is to solve the user-experience problem with
              energy-replenishment architecture rather than only with cell chemistry—for example through battery swap or
              storage-assisted charging. That means Juwan is competing on a system problem, not only on a battery-spec
              sheet.


              This matters because the competitive benchmark is set by companies with very different strategic
              strengths. CATL brings scale and manufacturing credibility, BYD adds vehicle integration plus
              charging-network rollout, Geely frames safety and lifecycle as part of its battery pitch, SVOLT attacks
              with aggressive portfolio breadth, and NIO changes the user experience through swap. Juwan therefore
              cannot be benchmarked against a single peer class. It must win against incumbents, substitutes, and OEM
              internal options at the same time.
            claimRefs:
              - CP001
              - CP002
              - CP014
              - CP015
              - CP016
              - CP037
