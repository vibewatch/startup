  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis must both start with evidence sensitivity
        blocks:
          - type: paragraph
            body: >-
              The attractive case for Juwan is easy to state. The company is not a pre-product science project; it has a
              visible XFC battery story, manufacturing surfaces, named partner and deployment proofs, and exposure to a
              large Chinese battery and charging market that still matters strategically. Macro demand data remain
              supportive, and the existence of both 2022 and 2024 unicorn-level valuation anchors shows that
              sophisticated strategic actors have assigned the asset real value. In that sense, Juwan deserves to stay
              in an investment committee's live universe.


              The anti-thesis is just as important and more price-sensitive. Public evidence still does not support
              revenue quality, margin durability, or runway. The latest price anchor is a connected strategic disposal,
              not a clean new primary financing round. The underlying market is also concentrating and deflating at the
              same time, which is a bad combination for smaller suppliers if they cannot prove customer lock-in or cost
              advantage. So the valuation debate is not “good company or bad company”; it is “how much uncertainty is
              already embedded in the price?”
            claimRefs:
              - CV001
