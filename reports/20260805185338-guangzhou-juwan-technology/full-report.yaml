  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Top risks are clustered around safety, capital, concentration, and competition
        blocks:
          - type: paragraph
            body: >-
              The riskiest aspect of Juwan is not any single technical claim. It is the fact that several
              high-consequence risks pile on top of each other. First, China's July 2026 battery-safety regime raises
              the compliance threshold for the very category where Juwan wants to differentiate. Second, public
              financial opacity means investors cannot tell how much runway the company has to absorb manufacturing
              scale-up, validation, and charging-ecosystem costs. Third, the strongest public customer proofs remain
              concentrated around GAC/AION and GAC-adjacent narratives, which keeps concentration risk high. Fourth, BYD
              and CATL are compressing the same fast-charge narrative with far more scale and distribution.


              These top risks matter because they reinforce each other. A new compliance failure could slow customer
              wins. Slower customer wins could worsen financing dependence. Financing dependence could weaken Juwan's
              ability to keep pace in a competition that is already moving fast. The risk case is therefore systemic
              rather than isolated: the company must execute across safety, customer breadth, financing, and competition
              at the same time.
