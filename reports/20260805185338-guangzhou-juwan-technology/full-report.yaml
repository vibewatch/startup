      - number: '3.2'
        title: 'Capability race: speed, safety, and infrastructure are converging'
        blocks:
          - type: paragraph
            body: >-
              The strongest adverse signal for Juwan is that rivals are now compressing the same charging-time headline
              it popularized. CATL's 2026 Super Technology Day featured third-generation Shenxing, with claimed 10% to
              80% charging in 3 minutes and 44 seconds. BYD's Blade Battery 2.0 and FLASH Charging package claimed 10%
              to 70% refill in about five minutes, alongside more than four thousand installed flash-charging stations
              and a year-end target of twenty thousand. FAW Hongqi also disclosed an in-house ultra-fast battery in the
              sub-four-minute class. In other words, extreme charging speed is no longer a niche line item owned by one
              company.


              At the same time, competitors are differentiating along other axes. Geely emphasizes safety and lifecycle
              durability through its short-blade architecture, while SVOLT is broadening across PHEV fast charging,
              semi-solid cells, storage, and eVTOL-linked products. NIO shows that some customers may prefer a
              three-minute swap experience over any charging race at all. The pattern is convergence: buyers can
              increasingly choose among several credible paths to similar user outcomes, which weakens a pure speed-only
              moat and raises the importance of cost, validation, and channel access.
