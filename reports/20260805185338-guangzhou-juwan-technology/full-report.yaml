      - number: '5.3'
        title: Trust, IP, and quality controls are visible but incomplete
        blocks:
          - type: paragraph
            body: >-
              The strongest public trust signal is Juwan's testing posture. CNAS is China's national
              laboratory-accreditation body, and Baidu Baike says Juwan's testing center gained CNAS recognition in
              November 2024. That does not by itself certify vehicle field reliability, but it does suggest the company
              has crossed into a more formal validation regime. On the IP side, Shanghai Metals Market reported a Juwan
              all-solid-state patent targeted at reducing solid-solid interface impedance, while PATENTSCOPE and Google
              Patents provide public search surfaces for the company's filings. Those facts support a real
              technology-development program rather than pure marketing.


              Still, the product proof has limits. Patent search surfaces are not the same as commercial defensibility,
              and secondary claims about paper and patent counts are not audited unit-economics evidence. The 2026
              battery-safety rules raise the bar further by forcing fast-charge suppliers to prove abuse tolerance,
              propagation control, and validation depth. The right conclusion is that Juwan has meaningful technical
              scaffolding, but open public evidence remains thin on failure rates, cycle life under comparable
              protocols, and scale-up quality.
