  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue surfaces are visible, but realized monetization is not
        blocks:
          - type: paragraph
            body: >-
              Public evidence makes the rough shape of Juwan's revenue model legible even though the numbers are
              missing. The company markets XFC traction batteries, next-generation storage devices, charging-network
              participation, and low-altitude battery systems. That mix strongly implies multiple hardware-led revenue
              streams rather than a single homogeneous SKU. The most plausible core mechanism is B2B selling into OEM,
              fleet, infrastructure, and strategic-partner programs, with revenue likely recognized against deliveries,
              system integration, or project milestones. This is useful because it tells us what kind of business we are
              dealing with: industrial hardware and systems, not a recurring software subscription business.


              What it does not tell us is whether the business is attractive economically. Public sources do not reveal
              realized ASPs, service attach rates, warranty reserves, gross margin by program, or how much of the
              charging story converts into direct revenue versus ecosystem influence. The official site is therefore
              enough to outline the monetization surfaces but not enough to underwrite them. In diligence terms, the
              company has a visible commercial surface and an invisible income statement.
