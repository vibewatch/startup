      - number: '4.4'
        title: Public underwriting gap is the main financial conclusion
        blocks:
          - type: paragraph
            body: >-
              The disclosure contrast is striking. GAC, as a public parent, maintains investor-relations overview,
              announcements, stock information, education materials, and presentation pages; BYD publishes audited
              annual results through HKEX. Juwan does not provide that level of standalone transparency. As a result,
              public traction signals—mass-production start, ecosystem expansion, partner announcements, and unicorn
              labels—must not be mistaken for financeable evidence. They prove the company is real and strategically
              relevant, not that its revenue quality, margin path, or runway have crossed an investable threshold.


              The financial verdict is therefore conservative. Juwan may be building a valuable strategic asset in a
              large market, but the present public record cannot support a strong view on revenue durability, gross
              margin, cash efficiency, or next-round timing. The exact diligence package needed is straightforward:
              current P&L, balance sheet, cash runway, order book, realized pricing, and customer concentration by
              revenue. Until those are produced, valuation marks should be treated as context rather than as substitutes
              for underwriting.
