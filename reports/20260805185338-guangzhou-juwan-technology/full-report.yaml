      - number: '8.3'
        title: 'Recommendation: track / research more unless price or proof improves'
        blocks:
          - type: paragraph
            body: >-
              The appropriate recommendation from current evidence is not buy; it is track or research more. This is not
              a rejection of the company. It is recognition that valuation discipline matters most when a company has
              real upside and incomplete proof at the same time. Juwan's product and market case are credible enough
              that a better-priced entry or a stronger diligence package could change the answer. Today, however, public
              evidence does not support paying aggressively at or above prior unicorn marks.


              The best framing is milestone-based. In a bull path, Juwan broadens non-GAC customers, proves compliance
              and scale-up quality, and converts its technical narrative into visible revenue. In a base path, it stays
              strategically relevant but still too opaque for full-price underwriting. In a bear path, competition,
              pricing pressure, or compliance delays make the last mark look stale. Another way to say this is that
              upside may be real, but it is still trapped behind unanswered diligence questions. An investor who pays
              full prior-mark pricing today is effectively underwriting management's future evidence package in advance.
              That may be acceptable for a strategic insider, but it is harder to justify for an outside financial
              investor who needs downside protection.


              There is also a portfolio-construction point. If an investor already has ample exposure to China battery
              leaders or auto OEM ecosystems, paying up for Juwan before the missing diligence closes may add correlated
              technology and policy risk without adding comparable disclosure quality. The case becomes more attractive
              if the investor can negotiate structure, downside protection, or milestone-linked pricing. Absent that,
              patience is not indecision; it is disciplined underwriting. That is why the chapter ends with high risk,
              medium confidence, and a valuation stance that demands either a discount or more evidence.
