      - number: '2.2'
        title: 'Sizing lenses: battery deployment, charging infrastructure, and adjacency'
        blocks:
          - type: paragraph
            body: >-
              Top-down market data show why Juwan attracted capital, but they also demonstrate why broad TAM numbers are
              dangerous. IEA reported 1.2 TWh of EV battery deployment in 2025, with China responsible for about 60% of
              global volume. The same IEA work said manufacturing capacity exceeded 4 TWh by the end of 2025, a reminder
              that supply growth is racing demand growth. On the charging side, IEA said China held more than 65% of
              global public charging points and grew from nearly 3.4 million to over 4.7 million public points in one
              year, accounting for more than 75% of global growth. Juwan's stated 250-city footprint and 10,000-station
              build-out ambition sit inside that giant domestic infrastructure wave.


              Adjacent markets are also real. CnEVPost reported 461.3 GWh of global ESS battery shipments in the first
              half of 2026 alone, and Juwan explicitly markets next-generation storage devices in addition to EV
              batteries. EHang and Guangzhou-based eVTOL reporting make low-altitude power systems more than a
              speculative optionality story. But none of these lenses by themselves reveal Juwan's SAM or SOM. The
              market can clearly support a unicorn-scale narrative; it does not yet provide a public bridge from macro
              scale to company-specific capture.
            claimRefs:
