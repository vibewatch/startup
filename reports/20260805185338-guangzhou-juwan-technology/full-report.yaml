      - number: '4.2'
        title: Capex, working capital, and pricing pressure look heavy
        blocks:
          - type: paragraph
            body: >-
              The business model appears financially demanding even before revenue is quantified. Battery manufacturing,
              validation, and charging-infrastructure build-out all require capital, inventory, engineering, and site
              economics. Juwan's own story of mass production, factories, and a broad charging rollout reinforces that
              this is not an asset-light business. Nature's work on urban ultra-fast charging shows why that matters:
              the economics of very high-power charging are entangled with grid constraints, tariff distortions, and
              system-level power-management costs. If Juwan owns or subsidizes meaningful parts of its charging
              ecosystem, cash payback could be slow; if it mostly partners, then station count is a weaker revenue proxy
              than the narrative implies.


              Competitive context worsens the unit-economics question. CATL and BYD remain the most visible large-scale
              players, which suggests that pricing power for a smaller supplier could be fragile. Public sources offer
              no CAC, payback, or renewal metrics and no clean view into working-capital lines, debt, or inventory
              turns. So the correct financial stance is not that unit economics are bad; it is that they are unknowable
              from public evidence and likely sensitive to capex intensity and price pressure.
