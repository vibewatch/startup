  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what should be included or excluded
        blocks:
          - type: paragraph
            body: >-
              The correct market boundary for Juwan is not the entire global lithium-ion battery universe. Juwan's own
              surface combines at least three linked layers: traction batteries for passenger and commercial vehicles,
              charging infrastructure and ecosystem participation needed to make XFC useful, and adjacent low-altitude /
              eVTOL battery systems. Those layers share chemistry and charging-speed logic, but they do not share the
              same buyers, margins, or sales cycles. A good diligence lens therefore separates battery demand from
              charger-network demand and treats eVTOL as an adjacency rather than as part of the core base case.


              What should be excluded? Consumer electronics battery spend is not directly relevant. Generic
              energy-transition investment totals also overstate Juwan's serviceable market because the company still
              needs a monetization path from alliance membership and charging-network rhetoric to battery or systems
              revenue. The practical substitute set is conventional lithium-ion packs with slower charging, increasingly
              capable incumbent fast-charge platforms from CATL, BYD, FAW Hongqi, and others, plus any OEM or fleet
              workflow that decides slower charging is acceptable if capex, safety, or degradation economics are better.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM017
              - CM023
              - CM024
              - CM025
