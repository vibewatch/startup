      - number: '5.2'
        title: Architecture and workflow are system-level, not component-level
        blocks:
          - type: paragraph
            body: >-
              The public record suggests Juwan's technical architecture spans more than cell formulation. Delivering an
              XFC outcome requires cell design, pack integration, thermal and electrical management, compatible charging
              hardware, and an operating context that can tolerate high-power replenishment. The customer workflow
              reinforces that view: Juwan must be qualified into an OEM or partner program, integrated into a vehicle or
              aviation platform, validated for safety and abuse, and only then translated into a real charging
              experience for an end user or operator.


              This system view also explains why product maturity is uneven. Vehicle batteries are the most mature layer
              because public deployment and factory milestones exist. eVTOL and solid-state are real enough to merit
              attention, but their evidence is still partner- and roadmap-heavy. Public recruiting surfaces also imply a
              multidisciplinary organization spanning R&D, production, sales, and service, which is what one would
