  topStrengths:
    - Juwan has real product proof, not a lab-stage story, with public evidence of XFC battery commercialization and manufacturing activity.
    - The company retains strategic relevance inside the GAC ecosystem and has visible deployment surfaces through AION and related vehicle programs.
    - The EHang partnership and commercial-vehicle references show optionality beyond one passenger-EV platform.
    - Public valuation anchors from 2022 and late 2024 support the view that sophisticated investors still ascribe unicorn-level option value to the asset.
  topRisks:
    - Revenue, gross margin, cash runway, and customer concentration remain undisclosed, so valuation underwriting is still narrative-heavy.
    - The late-2024 valuation anchor came from a connected strategic transfer, not a clearly arm's-length new financing round.
    - Customer proof is strongest around GAC/AION-linked narratives, leaving non-captive repeat demand insufficiently proven.
    - CATL, BYD, and other battery incumbents continue compressing the market through scale, price pressure, and competing fast-charge offerings.
    - Ultra-fast charging still depends on charging-network readiness, safety compliance, and infrastructure economics that are not fully proven in public evidence.
  unresolvedGaps:
    - Current revenue, gross margin, burn, cash runway, and plant-level operating KPIs.
    - Current cap table, preferences, dilution mechanics, and minority-investor protections after the 2024 strategic transfer.
    - Revenue-ranked customer list with repeat-order history and non-GAC concentration data.
    - Side-by-side safety, degradation, yield, and field-performance benchmarking versus CATL, BYD, and other fast-charge rivals.
    - Clear evidence distinguishing pilot programs, showcase deployments, and durable production supply agreements.
