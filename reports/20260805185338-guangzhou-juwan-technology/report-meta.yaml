companyProfile:
  summary: >-
    Guangzhou Juwan Technology is a Guangzhou-based private battery company spun out of the GAC ecosystem in
    2020 to commercialize extreme-fast-charging lithium-ion batteries and related charging systems. Public
    evidence is strongest on its XFC technology narrative, GAC/AION deployment surface, eVTOL partnership with
    EHang, and unicorn-level strategic valuation anchors from 2022 and late 2024. Public evidence is weakest
    on revenue quality, margins, cash runway, customer concentration, and minority-investor protections.
