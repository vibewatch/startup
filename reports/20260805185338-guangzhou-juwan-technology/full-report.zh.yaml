            body: >-
              很少有 2020 年成立的电池创业公司，能同时拿出官方产品路线图、已披露的 eVTOL 伙伴、一笔仍支撑近独角兽价值的后期战略股权转让，以及全国充电网络故事。Juwan
              的公开叙事不是空营销；确实有可尽调的产业触点。
