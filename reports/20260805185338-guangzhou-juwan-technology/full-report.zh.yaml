        title: 监管、法律与运营风险真实存在，且只被部分缓释
        blocks:
          - type: paragraph
            body: >-
              监管负担很明确。中国 2026 年标准要求更强的滥用耐受和安全性能；换电、固态系统等相邻标准制定则说明规则书仍在演进。法律风险上，Juwan 看起来有实质 IP
              活动，但周边法律环境让专利既是资产，也是诉讼暴露面。公开 Wenshu 数据库提供了法院核查路径，中国知识产权法院评论也强调技术争议仍活跃。这些都不能证明 Juwan
              目前正在诉讼中；它们意味着法律清洁度需要验证，不能默认成立。


              运营上，Juwan 已经越过原型阶段，进入工厂、产线和伙伴部署。这是正面信号，但也带来营销页面不会回答的失败模式：良率损失、调试延期、召回暴露、质保损失，以及负载下的现场表现。CNAS
              认可有助于展示正式测试姿态，但只是一部分缓释。公开记录仍未给出足以有把握衡量制造或质量风险的运营 KPI 组合。
