      - number: '2.2'
        title: 规模测算视角：电池装车、充电基础设施与相邻市场
        blocks:
          - type: paragraph
            body: >-
              自上而下的市场数据解释了 Juwan 为什么能吸引资本，也说明宽口径 TAM 数字为什么危险。IEA 报告称，2025 年 EV 电池部署量为 1.2 TWh，中国贡献约 60% 的全球量。同一项 IEA
              研究还称，到 2025 年底制造产能超过 4 TWh，提醒我们供给增长正在追赶甚至冲刺需求增长。充电侧，IEA 称中国拥有全球公共充电点的 65% 以上，公共充电点一年内从近 3.4 百万个增至超过 4.7
              百万个，贡献全球增量的 75% 以上。Juwan 所称 250 城足迹和 10,000 站建设野心，就嵌在这波巨大的国内基础设施浪潮里。


              相邻市场也真实存在。CnEVPost 报道称，仅 2026 年上半年全球 ESS 电池出货就达 461.3 GWh；Juwan 除 EV 电池外，也明确营销下一代储能设备。EHang 和广州 eVTOL
              报道让低空动力系统不只是投机性可选项。但这些视角本身都不能揭示 Juwan 的 SAM 或 SOM。市场显然足以支撑独角兽级叙事；它还没有给出从宏观规模到公司具体份额获取的公开桥梁。
