    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 推荐取决于产品证明、市场规模、风险和估值质量之间的相互作用。
    data:
      nodes:
        - id: a
          label: 真实产品与部署证明
        - id: b
          label: 大市场背景
        - id: c
          label: 战略估值锚
        - id: d
          label: 财务 / 治理不透明
        - id: e
          label: 竞争与基础设施压力
        - id: f
          label: 跟踪 / 继续研究
      edges:
        - from: a
          to: f
          label: 支撑跟踪
        - from: b
          to: f
          label: 支撑关注度
        - from: c
          to: f
          label: 支撑观察名单优先级
        - from: d
          to: f
          label: 阻止买入
        - from: e
          to: f
          label: 需要价格纪律
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV013
      - CV021
      - CV034
      - CV042
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 少数缺失变量主导了合理估值区间。
    data:
      items:
        - label: 非 GAC 客户证明
          value: 30
          unit: impact score
        - label: 收入 / 利润率可见度
          value: 28
          unit: impact score
        - label: 合规与爬坡质量
          value: 24
          unit: impact score
        - label: 竞争 / 价格压缩
          value: 22
          unit: impact score
        - label: 股权结构 / 优先权清晰度
          value: 18
          unit: impact score
    approximationNotes: 序数影响条，不是统计回归。它们排序的是哪些尽调结果最会撬动估值。
    claimRefs:
      - CV016
      - CV019
      - CV027
      - CV031
      - CV039
      - CV040
      - CV041
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据支持的是情景区间，不是精确点估计。
    data:
      items:
        - label: 悲观估值视角
          low: 3500
          mid: 4500
          high: 5500
          unit: RMB million
        - label: 基准估值视角
          low: 5500
          mid: 6500
          high: 7200
          unit: RMB million
        - label: 乐观估值视角
          low: 8000
          mid: 9000
          high: 10000
          unit: RMB million
        - label: 既有公开锚点
          low: 7072
          mid: 8000
          high: 8000
          unit: RMB million
    approximationNotes: 情景区间对证据高度敏感，不是模型输出。由于经济性仍不透明，基准情景维持在既有估值标记或以下。乐观情景需要更强的客户和财务证明。
    claimRefs:
      - CV008
      - CV009
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
      - CV037
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: IC 风格总结 Juwan 在当前公开证据下哪些维度得分高、哪些维度得分低。
    data:
      items:
        - label: 市场吸引力
          value: High
          note: 电池和充电市场仍然很大
        - label: 产品证明
          value: Medium-high
          note: 真实技术和部署已经存在
        - label: 客户持久性证明
          value: Low
          note: 留存和集中度不透明
        - label: 经济性可见度
          value: Low
          note: 缺少收入、利润率、现金和资金续航数据
        - label: 风险评级
          value: High
          note: 合规、竞争和融资不确定
        - label: 当前入场吸引力
          value: Medium-low
          note: 需要折价或更充分尽调
    claimRefs:
      - CV003
      - CV013
      - CV020
      - CV034
      - CV035
