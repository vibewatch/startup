      - number: '1.3'
        title: 管理层、支持方与资本信号
        blocks:
          - type: paragraph
            body: >-
              公开管理层披露比产品故事薄。EHang 在 2024 年合作公告中把 Pei Feng 标为 Greater Bay Technology 总裁；VentureRadar 则描述 Juwan 由 GAC
              Group、GAC Capital、GAC Research Institute 的石墨烯技术团队以及第三方战略投资者共同组建。因此，公司不像典型的双创始人风险创业公司，更像从 GAC
              体系战略孵化出的技术拆分体。这有助于打开产业入口，但也带来投资判断问题：董事会构成、投票控制权，以及少数投资者能否影响资本配置或客户集中度决策。


              最强的公开融资信号来自 2024 年末 GAC 交易。GAC 和 GAC Capital 同意以 RMB 1.33B 将 Juwan 18.82% 股权出售给母公司 GAIG，隐含股权价值约 RMB
              7.1B。Wiser Asia 早前报道称 Tencent 2022 年投资时估值约 RMB 8B。两个点位与独角兽状态方向一致，尽管不能证明 2026
              年存在一个有流动性的市场出清价格。它们确实说明，战略资本和国资关联资本仍给这项资产赋予实质价值。缺口在前瞻资本故事：公开来源仍未披露现金、债务、烧钱速度或交易后现金续航。
