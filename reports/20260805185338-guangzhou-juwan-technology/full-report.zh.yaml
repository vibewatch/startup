              这种系统视角也解释了产品成熟度为什么不均匀。车辆电池是最成熟的一层，因为已有公开部署和工厂里程碑。eVTOL 和固态足够真实，值得关注，但证据仍偏伙伴和路线图。公开招聘界面也暗示，公司组织跨越
              R&D、生产、销售和服务；如果一家企业交付的是电池加系统栈，而不是狭窄材料实验室，这正符合预期。
