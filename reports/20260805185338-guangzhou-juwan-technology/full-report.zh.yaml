  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与采用触点
        blocks:
          - type: paragraph
            body: >-
              Juwan 的客户基础应按客户任务分层，而不是按一个客户标识清单分层。乘用车 OEM 是最明显的电池买方；车队和重卡运营商关心 运营可用时间经济性；充电网络伙伴决定快充电池能否真正交付承诺中的便利；eVTOL
              伙伴代表一个新兴相邻触点。这意味着 Juwan 实际服务的是几个相互连接的客户系统，而不是一个统一账户类别。


              最强的市场逻辑出现在“省下时间有直接价值”的应用里。乘用 EV 受益于便利性；重卡、场站、港口和物流枢纽可以把快充变成线路生产力。eVTOL 故事在商业上更偏投机，但战略上重要，因为它把 Juwan
              定位成道路车辆之外的快速周转能源供应商。因此，客户地图宽且具战略吸引力；但每个细分都有不同采用证明标准，也更难衡量。换句话说，本章不仅要判断公司有没有客户，还要判断每类客户能否成熟为可复购、能贡献收入的客户群。
