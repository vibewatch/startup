        title: 产品定义、模块与成熟度层级
        blocks:
          - type: paragraph
            body: >-
              Juwan 应被理解为一套产品栈，而不是单一电池 SKU。核心表面是面向乘用车和商用车的 XFC 极速快充动力电池，背后有充电解决方案资产支撑，并被放进更大的下一代储能使命中。Baidu Baike
              和官方材料又加入第二层：Phoenix battery。它被定位为更高规格平台，主张 6 分钟完成 0-80% 充电和长续航。公开部署证据最强的是主流 XFC 线；Phoenix
              和固态努力更接近路线图或新兴平台状态。


              这很重要，因为尽调常把整个故事压缩成一个醒目数字：充电需要几分钟。这样会错过真实模块地图。Juwan
              同时在建设产品、工厂、验证资产和充电服务品牌。因此，正确的产品问题不只是“化学体系够不够快？”，还要问“哪些模块已经交付，哪些正在放量，哪些仍是战略选项？”
