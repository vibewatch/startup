      - number: '2.4'
        title: 约束、矛盾信号与仍未补上的规模测算缺口
        blocks:
          - type: paragraph
            body: >-
              奖励快充的同一个市场，也在让小玩家更难生存。中国 2026 年 7 月生效的新电池“不起火、不爆炸”标准抬高了测试和质量门槛。Nature
              关于城市超快充的研究指出，如果超快充增长快过电价机制和电网设计的调整，就会引发电网扭曲和系统稳定性风险。竞争层面，CATL 仍在中国电池装机市场占据主导份额，并持续发布或推动更快基准；其他中国品牌也开始报出 4
              分钟以内的充电窗口。这意味着 Juwan 的市场不只是大，而是军备竞赛式地大。


              最大矛盾在于，宏观指标支持一块可观机会存在，但公司层面的公开变现证据缺席。Juwan 可以合理地同时切入几个大市场，可每个市场都有不同买方和经济性。尽调只有把电池、充电器和生态参与同
              ASP、利用率和复购订单连起来，审慎的市场分析才能更进一步；在此之前，TAM 只能当作支撑性背景，不能证明 Juwan 已经拿到可防守的服务市场位置。
