    sections:
      - number: '8.1'
        title: 投资论点与反论点都要从证据敏感性出发
        blocks:
          - type: paragraph
            body: >-
              Juwan 的正面叙事并不难讲。公司不是还停在产品前的科学项目；它有清晰的 XFC 电池故事、制造端证据、具名合作与部署证据，也踩在中国电池和充电这个仍具战略意义的大市场上。宏观需求数据仍然支撑这一方向，2022
              年和 2024 年都出现过独角兽级估值锚，也说明成熟的战略参与方曾给这项资产赋予真实价值。从这个意义上，Juwan 值得留在投委会的活跃标的池里。


              反论点同样重要，而且对价格更敏感。公开证据仍然撑不起收入质量、利润率韧性或现金跑道。最新价格锚来自关联战略出售，不是一轮干净的新股权融资。底层市场又在同时集中和价格下行；如果小型供应商证明不了客户锁定或成本优势，这个组合很不友好。因此，估值争论不是“好公司还是坏公司”，而是“价格里已经塞进了多少不确定性？”
