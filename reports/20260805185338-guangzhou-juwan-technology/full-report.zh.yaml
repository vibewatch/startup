  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合：直接既有玩家、内部自研与替代方案
        blocks:
          - type: paragraph
            body: >-
              Juwan 的买方可以用几条不同路径解决同一个任务。最直接的路径，是向 CATL、BYD 领衔的中国大型既有巨头采购高性能电池。第二条路径，是 OEM 内部自研或严控体系内供应，Geely、FAW Hongqi
              等品牌让这种趋势越来越可见。第三条路径，是用补能架构而不只靠电芯化学来解决用户体验问题，例如换电或储能辅助充电。这意味着 Juwan 竞争的是系统问题，不只是电池规格表问题。


              这很重要，因为竞争基准由战略强项完全不同的公司设定。CATL 带来规模和制造可信度；BYD 叠加整车集成和充电网络铺设；Geely 把安全和生命周期放进电池卖点；SVOLT 用激进的产品组合宽度进攻；NIO
              则用换电改变用户体验。因此，Juwan 不能只对标一个同业 类别。它必须同时打赢既有巨头、替代方案和 OEM 内部选项。
