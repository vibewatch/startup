      - number: '4.4'
        title: 公开投资判断缺口是核心财务结论
        blocks:
          - type: paragraph
            body: >-
              披露反差很刺眼。GAC 作为上市母体，维护投资者关系概览、公告、股价信息、教育材料和演示页面；BYD 通过 HKEX 发布经审计年度业绩。Juwan
              没有提供这种级别的独立透明度。因此，公开进展信号——量产启动、生态扩展、伙伴公告和独角兽标签——不能被误认为可融资证据。它们证明公司真实存在且具战略重要性，但不能证明收入质量、利润率路径或
              现金续航已经跨过可投资门槛。


              因此，财务结论偏保守。Juwan 可能正在一个大市场里打造有价值的战略资产，但当前公开记录无法支撑对收入耐久性、毛利率、现金效率或下一轮时间的强判断。所需尽调包很直接：当前
              P&L、资产负债表、现金续航、订单簿、已实现定价，以及按收入划分的客户集中度。拿到这些之前，估值标记应被视为背景，而不是投资判断替代品。
