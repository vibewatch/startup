      - number: '2.3'
        title: 买方分层、需求驱动与采用路径
        blocks:
          - type: paragraph
            body: >-
              电池买方不是充电器使用者。核心动力电池市场里，买方是
              OEM、车队平台或工业车辆制造商，它们关心车辆运营可用时间、充电时间和总拥有成本。充电基础设施里，买方是网络运营商、场站业主、公用事业公司或生态伙伴，它们必须证明
              资本开支、电网接入和利用率站得住。低空出行里，买方链条可能包括飞行器 OEM 和受监管运营商，它们关心认证、周转时间和安全，而不只是航程。Juwan 的公开材料暗示三层都重要；这在战略上有野心，在商业上也更复杂。


              主要采用驱动很直观，也越来越有证据：EV 增长、降低充电不便的压力，以及奖励更快周转的车队经济性。IEA 和 BNEF 都把充电速度和基础设施充足性放在 EV 采用的核心位置。Juwan
              自己的生态故事——联盟、站点、多车型部署——说明它想卖的不是商品化电芯，而是一套更完整的运营答案。若能跑通，这很有价值；但它也拉长了买方地图，提高了执行要求。
