      - number: '4.3'
        title: 有估值信号，但流动性和现金续航仍是开放问题
        blocks:
          - type: paragraph
            body: >-
              最重要的公开融资事实常被误读。2024 年 12 月 HKEX 文件清楚显示，GAC 和 GAC Capital 以约 RMB 1.331B 将 Juwan 18.82% 股权出售给 GAIG。这确认市场仍给
              Juwan 赋予有意义的价值，也能与 Wiser Asia 早前 Tencent 支持的估值标记互相校验。但这并不自动意味着 Juwan 自身收到了 RMB 1.331B 新运营现金。这笔处置更像 GAC
              体系内部的股东层面再配置，AASTOCKS 和 Nasdaq 也把它描述为 GAC 资产出售事件。


              这个区别对资本充足性至关重要。战略老股交易可以确认价格，却不回答现金续航。公开来源仍未披露 Juwan 是否有足够现金，在不再融资的情况下扩大工厂、库存、测试和充电支持承诺。由于竞争集合包括资本极厚的
              既有巨头和系统级部署成本，资产负债表证据缺席是投资判断的实质阻断点。
