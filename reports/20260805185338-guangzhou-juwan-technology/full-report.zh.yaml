        title: 耐久性与集中度仍是客户侧核心未知数
        blocks:
          - type: paragraph
            body: >-
              主要问题不是找客户标识，而是找留存。留存的公开来源均未披露客户数、复购率、流失、NRR、GRR、续约条款或头部账户集中度。这在公开来源能证明的内容和投资者需要知道的内容之间，制造了巨大不对称。竞争市场里的电池供应商，不能只靠
              客户标识数量支撑投资判断；真正支撑的是复购订单、设计导入持续性，以及供应商进入量产认证后被替换的难度。


              当前公开证据显示，集中度风险仍有实质意义。最强证明继续集中在 GAC/AION 和 GAC 相邻叙事周围；其他客户可见，但记录深度不足。这让 Juwan 的商业故事有前景，也可能偏窄。向卡车、港口和 eVTOL
              扩展，未来可能降低这种风险；但在拿出按收入排序的客户数据前，它也可能主要停留在样板展示驱动。
