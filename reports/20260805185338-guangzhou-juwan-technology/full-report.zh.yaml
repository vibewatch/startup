  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：纳入什么，排除什么
        blocks:
          - type: paragraph
            body: >-
              Juwan 的正确市场边界不是整个全球锂离子电池市场。Juwan 自身至少覆盖三层相互连接的市场：乘用车和商用车动力电池；让 XFC 变得有用所需的充电基础设施与生态参与；以及相邻的低空 / eVTOL
              电池系统。几层共享化学体系和充电速度逻辑，但买方、利润率和销售周期并不相同。因此，好的尽调视角要把电池需求和充电网络需求拆开，并把 eVTOL 视为相邻机会，而不是核心基准情形的一部分。


              哪些应排除？消费电子电池支出没有直接关联。泛能源转型投资总额也会高估 Juwan
              的可服务市场，因为公司仍需把联盟成员身份和充电网络话术变成电池或系统收入的变现路径。实际替代集合包括充电较慢的传统锂离子电池包，CATL、BYD、FAW Hongqi
              等能力越来越强的既有快充平台，以及任何认为在资本开支、安全或衰减经济性更优时慢充也可以接受的 OEM 或车队流程。
