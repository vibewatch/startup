      - number: '4.2'
        title: 资本开支、营运资本与价格压力都显得很重
        blocks:
          - type: paragraph
            body: >-
              即便还没量化收入，这个商业模式看起来也很吃资金。电池制造、验证和充电基础设施建设都需要资本、库存、工程能力和场站经济性。Juwan
              自己关于量产、工厂和大范围充电铺设的故事，也强化了一个判断：这不是轻资产业务。Nature 关于城市超快充的研究说明了为什么这点重要：超高功率充电的经济性与电网约束、电价扭曲和系统级电力管理成本纠缠在一起。若
              Juwan 拥有或补贴充电生态中的重要部分，现金回收可能很慢；若它主要靠合作，站点数量就比叙事暗示的更难作为收入替代指标。


              竞争背景让单位经济问题更难。CATL 和 BYD 仍是最可见的大规模玩家，说明小供应商的定价权可能脆弱。公开来源没有
              CAC、回本或续约指标，也看不到营运资本科目、债务或库存周转的清晰图景。因此，正确的财务姿态不是断言单位经济很差，而是承认公开证据无法判断，并且它很可能对 资本开支强度和价格压力高度敏感。
