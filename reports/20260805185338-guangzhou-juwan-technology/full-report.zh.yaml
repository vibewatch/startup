  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 顶层风险集中在安全、资本、集中度与竞争
        blocks:
          - type: paragraph
            body: >-
              Juwan 最危险的地方不是某一条技术主张，而是几个高后果风险叠在一起。第一，中国 2026 年 7 月电池安全制度抬高了合规门槛，正好落在 Juwan
              想做差异化的品类上。第二，公开财务不透明，投资者无法判断公司有多少现金续航来吸收制造放量、验证和充电生态成本。第三，最强公开客户证明仍集中在 GAC/AION 和 GAC
              相邻叙事周围，使集中度风险保持高位。第四，BYD 和 CATL 正用大得多的规模和分销压缩同一个快充叙事。


              这些顶层风险之所以重要，是因为它们会互相强化。新的合规失败可能拖慢客户签约；客户签约变慢可能加重融资依赖；融资依赖又会削弱 Juwan
              在高速竞争中跟上的能力。因此，风险案例是系统性的，而不是孤立的：公司必须同时在安全、客户广度、融资和竞争上执行到位。
