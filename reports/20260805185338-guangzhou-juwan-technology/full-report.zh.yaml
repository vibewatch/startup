figures:
  - id: FO001
    title: Juwan 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 从 2020 年成立，到 2024 年股权交易，再到 2026 年更严监管背景的时间顺序。
    data:
      items:
        - label: 南沙成立
          date: 2020-09
          detail: Guangzhou Juwan Technology 作为 GAC 孵化的混合所有制电池公司成立。
        - label: 电池包工厂 / 量产说法
          date: '2021'
          detail: 官方里程碑记录称，南沙电池包工厂落地，XFC 应用进入量产。
        - label: Tencent 参与融资
          date: 2022-04
          detail: Wiser Asia 报道 Tencent 参投，估值约 RMB 8B。
        - label: Hurun 独角兽 + 联盟
          date: '2022'
          detail: 官网称 Juwan 进入 Hurun 独角兽榜单，并发起快充生态联盟。
        - label: Phoenix Battery 发布
          date: '2023'
          detail: Juwan 发布 6 分钟 Phoenix Battery，并刷新长续航 XFC 叙事。
        - label: 专业 XFC 工厂
          date: 2023-11
          detail: Just Auto 报道，广州 XFC 工厂投产，初始产能 4 GWh。
        - label: EHang eVTOL 合作
          date: 2024-04
          detail: 该合作把电池平台延伸到低空飞行器和充电系统。
        - label: 声称获得 CNAS 认可
          date: '2024'
          detail: 官网称测试中心获得 CNAS 认可，作为质量信号。
        - label: 出售 18.82% 股权
          date: '2024-12-30'
          detail: GAC 和 GAC Capital 以 RMB 1.33B 向 GAIG 出售 18.82% 股权。
        - label: 新电池安全规则
          date: 2026-07
          detail: 中国更严的不起火、不爆炸电池规则生效，抬高了快充供应商门槛。
    approximationNotes: 多个公司里程碑来自官网，而不是单独的存档新闻稿；可取得外部媒体和监管文件时， 用它们锚定估值与工厂事件。
    claimRefs:
