chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与部署足迹
        blocks:
          - type: paragraph
            body: >-
              Guangzhou Juwan Technology Co., Ltd. 成立于 2020 年 9 月，总部位于广州南沙区。公司把自己定位为 GAC Group
              首个内部孵化的混合所有制高科技企业，也是一家电池专门公司，使命是让 EV 充电像加油一样快。公开公司材料显示，业务重心是 XFC 超快充动力电池和下一代储能设备，而不是宽泛的 EV
              平台。实际叙事是一套电池与充电栈：电芯、电池包、充电接口和生态建设共同支撑同一个品牌承诺。


              官方网站声称部署足迹很广。乘用车侧包括 GAC AION、GAC Trumpchi 和 BAIC Arcfox；商用车侧包括 FAW Jiefang、Dongfeng 重卡、Shaanxi 重卡和 GAC
              Hino；低空扩展则借 EHang 合作来展开。这种广度有战略价值，因为它暗示公司不想只被看作 GAC
              单一车型的体系内供应商。但当前公开记录更擅长证明“出现在哪些名单上”，还不足以证明经济规模。留存来源没有披露收入、按 OEM 划分的出货量，或能清楚区分试点、量产项目和真实复购的客户组合。
