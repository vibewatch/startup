      - number: '8.3'
        title: 建议：跟踪 / 继续研究，除非价格或证据改善
        blocks:
          - type: paragraph
            body: >-
              基于当前证据，合适的建议不是买入，而是跟踪或继续研究。这并不是否定公司，而是承认：一家公司同时具备真实上行空间和证据缺口时，估值纪律最重要。Juwan
              的产品与市场逻辑足够可信，若进入价格更好，或尽调材料更扎实，结论可能改变。但今天，公开证据还不足以支持投资者在既有独角兽估值或更高水平上激进出价。


              最好的框架是按里程碑推进。牛市路径下，Juwan 拓宽非 GAC
              客户，证明合规和规模化质量，并把技术叙事转成可见收入。基准路径下，它保持战略相关性，但披露仍过于不透明，撑不起满价承销。熊市路径下，竞争、价格压力或合规延误会让上一轮估值显得过时。换句话说，上行空间可能真实存在，但仍被未回答的尽调问题卡住。今天按过往估值全价进入的投资者，实际上是在提前承销管理层未来能交出的证据包。战略内部人或许可以接受，外部财务投资者若需要下行保护，就更难说得通。


              组合构建上也有一个问题。如果投资者已经充分暴露于中国电池龙头或汽车 OEM 生态，在缺失尽调尚未补齐前为 Juwan
              付高价，可能只是在增加同向技术和政策风险，却拿不到相称的披露质量。如果投资者能谈到结构性条款、下行保护或里程碑挂钩定价，项目会更有吸引力。否则，等待不是犹豫，而是有纪律的承销。因此，本章以高风险、中等置信度和估值立场收束：要么拿到折价，要么拿到更多证据。
