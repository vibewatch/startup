      - number: '8.2'
        title: 融资背景支持继续跟踪，但不支持掉以轻心
        blocks:
          - type: paragraph
            body: >-
              公开估值背景给了 Juwan 可信度，但给不了价格确定性。2024 年 GAC/GAIG 交易隐含约 RMB 7.1 billion 股权价值，较早报道则指向 Tencent 参与的 2022 轮约 RMB 8
              billion 估值。Hurun 2026 年独角兽材料进一步说明，公司仍在独角兽讨论范围内。但这些估值都没有回答最关键的承销问题：公司能否靠商业证据，而不是战略背书，支撑投资者按这些水平新进入。


              二者必须分清，因为上市公司可比对象披露得多得多。以 BYD 为例，它发布审计结果，也处在可让投资者直接跟踪财务表现的申报体系中。Juwan
              没有这种披露。披露不对称要求更谨慎：缺少收入、股权结构和客户集中度数据时，过往战略估值应被当作需要挑战的上限，而不是自动接受的下限。
