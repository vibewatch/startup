      - number: '5.3'
        title: 信任、IP 与质量控制可见但不完整
        blocks:
          - type: paragraph
            body: >-
              最强的公开信任信号是 Juwan 的测试姿态。CNAS 是中国国家实验室认可机构，Baidu Baike 称 Juwan 测试中心在 2024 年 11 月获得 CNAS
              认可。这本身不能认证车辆实地可靠性，但说明公司已进入更正式的验证体系。IP 侧，Shanghai Metals Market 报道 Juwan 一项全固态专利瞄准降低固-固界面阻抗；PATENTSCOPE 和
              Google Patents 也提供了公司申请的公开检索界面。这些事实支持一个真实技术开发项目，而不是纯营销。


              但产品证明仍有边界。专利检索界面不等于商业防守力，关于论文和专利数量的二手说法也不是经审计的单位经济证据。2026
              年电池安全规则还会继续抬高门槛，迫使快充供应商证明滥用耐受、热失控扩散控制和验证深度。正确结论是，Juwan 有实质技术脚手架，但在故障率、可比协议下的循环寿命和放量质量上，公开证据仍偏薄。
