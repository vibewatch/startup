      - number: '7.3'
        title: 依赖、财务与人员风险可能间接打破投资命题
        blocks:
          - type: paragraph
            body: >-
              以电池公司标准看，Juwan 对外部协同的依赖异常高。OEM 设计导入、充电网络就绪度、客户信心和支持方支持必须同时对齐。EHang
              关系展示了这种模式的上行和风险：可信应用伙伴可以验证技术，但商业路径仍可能取决于 Juwan 控制之外的认证和伙伴节奏。重卡项目也类似，技术上有意思的试点或交付，未必能按投资者希望的速度变成经常性经济。


              同一套依赖逻辑也贯穿财务和执行。GAC 体系内的关联交易凸显的是治理问题，不只是估值。公开来源没有告诉我们，公司能否在不再融资的情况下支撑工厂、库存和生态支持。招聘界面显示 Juwan
              仍在工程和运营上搭团队，但招聘本身不能证明执行风险已被控制。合在一起看，这些不是小风险：技术可信的公司仍可能错过商业窗口，往往就是通过这些通道发生。
