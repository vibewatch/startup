  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入触点可见，但实际变现不可见
        blocks:
          - type: paragraph
            body: >-
              即使数字缺失，公开证据也让 Juwan 收入模式的大致形状可读。公司营销 XFC 动力电池、下一代储能设备、充电网络参与和低空电池系统。这种组合强烈暗示它有多条硬件主导收入流，而不是单一同质化
              SKU。最可能的核心机制，是向 OEM、车队、基础设施和战略伙伴项目做 B2B 销售，并按交付、系统集成或项目里程碑确认收入。这个判断有用，因为它告诉我们公司类型：工业硬件与系统，而不是经常性软件订阅业务。


              它没有告诉我们的，是业务经济性是否有吸引力。公开来源没有披露已实现
              ASP、服务绑定率、质保准备、按项目划分的毛利率，或充电故事中多少变成直接收入、多少只是生态影响力。因此，官网足以勾勒变现触点，却不足以支撑投资判断。用尽调语言说，公司有可见的商业表面，也有一张不可见的利润表。
