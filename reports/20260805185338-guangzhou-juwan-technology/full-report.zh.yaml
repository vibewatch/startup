      - number: '1.4'
        title: 里程碑、生态规模与进入 2026 年的不利背景
        blocks:
          - type: paragraph
            body: >-
              以一家 2020 年成立的公司来看，Juwan 公开里程碑节奏异常密集。官方年表称公司 2020 年成立，2021 年电池包工厂落地并完成首次量产部署，2022 年进入 Hurun
              独角兽榜并组建充电生态联盟，2023 年发布 Phoenix Battery 并建设南沙专业 XFC 电池工厂，2024 年拓展低空和商用车板块并获得 CNAS 认可测试能力。官网还称，公司参与一个 120
              多成员的快充联盟，充电足迹覆盖 250 多座城市，正在铺设超过 10,000 个站点。这些都是有意义的战略信号，因为只有车辆、电网基础设施和充电行为一起演进，XFC 电池才真正有用。


              不利背景同样关键。中国 2026 年电池安全标准显著抬高快充电池合规门槛，Nature 指出城市超快充会带来系统层面的电网压力，CATL 等龙头还在不断刷新高端充电基准。换句话说，Juwan
              不是在真空中竞争：它要在监管更严、巨头更快的市场里放大规模。因此，公司概览给出的基线需要保留层次：Juwan 有真实产业信号和产品速度，但公开记录仍未证明治理深度、财务韧性或对 GAC 生态的持久独立性。
