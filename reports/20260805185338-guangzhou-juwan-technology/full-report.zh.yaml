      - number: '1.2'
        title: 技术主张、验证触点与创新姿态
        blocks:
          - type: paragraph
            body: >-
              Juwan 的品牌围绕充电速度建立。官方材料称旗舰 XFC 电池最快可在 5.5 分钟内从 0% 充至 80%；2023 年推出的 Phoenix Battery 则被描述为可在 6 分钟内完成 0% 至 80%
              充电，并在 300V 至 1,000V 平台上实现最高 1,000 km 续航。Wiser Asia 和 Just Auto 的第三方报道大体支持一个判断：Juwan 较早切入量产快充项目，商业化卖点集中在 10
              分钟以内充电窗口。EHang 2024 年发布的信息把叙事延伸到航空相邻应用，Juwan 在其中更像电池与充电系统伙伴，而不只是电芯卖家。


              公开验证栈仍然好坏参半。积极面上，Juwan 指向 WRCA 认可、CNAS 认可的测试能力，以及可见的固态 / 复合固态电解质路线图。Shanghai Metals Market 2026 年报道称，CNIPA
              公布了 Juwan 一项全固态专利申请，目标是降低界面阻抗；Wiser Asia
              早前也提到其专利足迹不算庞大但真实存在。消极面上，多数性能主张仍来自公司或生态伙伴，而不是中立实验室基准。这并不推翻技术，但尽调标准需要把已经验证的就绪度和路线图愿景拆开看。
