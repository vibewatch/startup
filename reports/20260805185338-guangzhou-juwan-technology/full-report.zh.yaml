        title: 缓释因素存在，但投资命题仍需要清晰否决标准
        blocks:
          - type: paragraph
            body: >-
              面对 Juwan
              的风险画像，正确做法不是忽视上行空间。公司确实有一些真实的缓释因素：正式测试平台、战略支持方、具名合作伙伴、早期制造证据，以及一个市场仍然重视的技术方向。但评估这些因素时，要看它们真正降低了哪些残余风险。测试中心解决不了现金跑道；战略支持方不会自动解决少数股东治理；一个具名部署案例也解决不了客户集中。


              因此，否决条件很重要。如果 Juwan 不能拿出 2026 年安全监管制度下的合规进展，不能拓宽非 GAC 客户，或拿不出可信的现金跑道和规模化 KPI
              包，投资论点就应迅速下调。反过来，如果公司能交出这些证据，几类已知风险会同时收窄。因此，本章最后落到一个操作原则：要求证据直接切断几条传导链——合规到客户、客户到融资、融资到竞争滑坡。
