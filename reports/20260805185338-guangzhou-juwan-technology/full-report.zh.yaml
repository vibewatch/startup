        title: 能力竞赛：速度、安全与基础设施正在合流
        blocks:
          - type: paragraph
            body: >-
              对 Juwan 最不利的信号是，竞争对手正在压缩它曾经打响的同一个充电时长卖点。CATL 2026 年 Super Technology Day 展示了第三代 Shenxing，声称可在 3 分 44 秒内从
              10% 充至 80%。BYD 的 Blade Battery 2.0 和 FLASH Charging 套件声称约 5 分钟内从 10% 补至 70%，同时已有 4,000 多座已安装闪充站，年底目标为
              20,000 座。FAW Hongqi 也披露了 4 分钟以内级别的自研超快充电池。换句话说，极速充电速度不再是某一家公司独占的小众卖点。


              同时，竞争对手也在其他轴线上做差异化。Geely 借短刀架构强调安全和生命周期耐久；SVOLT 则把产品线扩到 PHEV 快充、半固态电芯、储能和 eVTOL 方向产品。NIO 说明，一些客户可能更偏好 3
              分钟换电体验，而不是参与任何充电竞赛。格局正在合流：买方越来越能从几条可信路径里选出相似的用户结果，纯速度护城河因此变弱，成本、验证和渠道入口的重要性上升。
