callouts:
- calloutType: strength
  title: Visible industrial signal for a young battery spinout
  body: Few 2020-founded battery startups can point to an official product roadmap, a named eVTOL partner, a late-stage strategic share transfer that still supports a near-unicorn value, and a nationwide charging-network story simultaneously. Juwan's public narrative is not empty marketing; there is real industrial surface area to diligence.
  claimRefs:
  - CO011
  - CO013
  - CO025
  - CO026
- calloutType: risk
  title: Public evidence is much stronger on technology theater than on underwriting data
  body: The company gives investors plenty of speed, range, and ecosystem language, but almost nothing on revenue, unit economics, board controls, customer concentration, or cash. That asymmetry is manageable in a company overview, but it is the core diligence problem that later chapters must keep pressing.
  claimRefs:
  - CO005
  - CO019
  - CO025
