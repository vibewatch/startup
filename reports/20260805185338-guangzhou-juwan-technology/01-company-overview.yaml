company:
  name: Guangzhou Juwan Technology Co., Ltd.
chapter:
  number: 1
  title: Company Overview
  summary: Guangzhou Juwan Technology is a 2020 GAC-incubated battery spinout from Nansha, Guangzhou that has built a visible Chinese XFC brand around 5.5-minute to 6-minute charging claims, commercial vehicle and eVTOL partnerships, and a 2024–2025 valuation path that still supports unicorn status. The strongest public positives are the official product roadmap, named deployment claims across passenger and commercial vehicles, the EHang partnership, and the late-2024 GAC secondary that implies roughly RMB 7.1 billion of equity value. The main caveats are governance opacity, no public revenue or headcount disclosure, and rising regulatory and incumbent-competition pressure in Chinese fast-charging batteries.
sections:
- id: identity-product-deployment
  title: Identity, product scope, and deployment footprint
  body: 'Guangzhou Juwan Technology Co., Ltd. was founded in September 2020 and is headquartered in Nansha District, Guangzhou. The company presents itself as GAC Group''s first internally incubated mixed-ownership high-tech enterprise and positions itself as a battery specialist whose mission is to make EV charging feel as fast as refueling. Public company materials describe a business focused on XFC ultra-fast charging power batteries and next-generation energy-storage devices rather than a broad EV platform. In practice, the public story is a battery-and-charging stack narrative: cells, packs, charging interfaces, and ecosystem build-out all sit inside the same brand promise.


    The official site claims a broad deployment footprint. Passenger-car references include GAC AION, GAC Trumpchi, and BAIC Arcfox; commercial-vehicle references include FAW Jiefang, Dongfeng heavy truck, Shaanxi heavy truck, and GAC Hino; and low-altitude expansion is framed through the EHang partnership. That breadth is strategically helpful because it implies the company is trying to avoid being judged only as a single-model GAC captive supplier. However, the current public record is much better at proving named surfaces than at proving economic scale. No retained source discloses revenue, unit shipments by OEM, or a customer mix that cleanly separates pilots, production programs, and actual repeat orders.'
  claimRefs:
  - CO001
  - CO002
  - CO003
