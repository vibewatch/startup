    - QE018
    - QE019
    relatedTableRefs:
    - TE003
  - type: conflicting-data
    severity: minor
    topic: patent-counts
    missingEvidence: Audited patent count and mapping from patents to shipped products.
    whyItMatters: Public patent counts from secondary sources can overstate economic relevance.
    diligencePath: Request patent schedule with jurisdictions, status, and product linkage.
