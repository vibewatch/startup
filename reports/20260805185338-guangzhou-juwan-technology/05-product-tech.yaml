  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: Field failure rates, warranty outcomes, degradation curves, and independent side-by-side benchmarks versus CATL/BYD/Geely/SVOLT under the same protocol.
    whyItMatters: Without normalized reliability and degradation data, performance claims remain difficult to underwrite.
    diligencePath: Request lab abuse tests, fleet durability data, warranty-cost history, and third-party benchmarking.
    relatedQuestionRefs:
    - QE024
    - QE025
    - QE029
    - QE030
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: yield-and-scale
    missingEvidence: Cell yield, scrap rates, pack throughput, and bottleneck metrics for the Nansha and Chongqing lines.
    whyItMatters: Manufacturing scale-up is central to the product thesis and yet its operational quality is opaque.
    diligencePath: Request factory KPI pack including yield, uptime, scrap, and qualification status by line.
    relatedQuestionRefs:
    - QE010
    - QE011
    - QE029
    relatedTableRefs:
    - TE001
    - TE005
  - type: private-evidence-only
    severity: material
    topic: developer-signal-limit
    missingEvidence: Open practitioner benchmarks or community adoption signals beyond recruiting pages.
    whyItMatters: For hardware-heavy companies, hiring is a weaker developer proxy than public integration or developer usage.
    diligencePath: Collect conference papers, engineer talks, public standards contributions, or named integrator testimonials.
