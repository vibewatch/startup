- id: distribution-and-switching
  title: Distribution power, switching costs, and trust favor scaled players
  body: 'Even if Juwan has competitive chemistry, distribution power still sits with scaled ecosystems. CATL and BYD already have stronger public proof of battery share and replenishment-network momentum than Juwan. NIO similarly shows how a proprietary power network can shape user behavior and brand lock-in. Roland Berger''s 2026 charging work reinforces that China is already one of the world''s most sophisticated charging markets, so new entrants are not competing against empty whitespace. They are competing against the deepest installed base and the best-financed rollout machines.


    Switching cost is real but nuanced. Battery suppliers become sticky once an OEM has validated a pack, vehicle architecture, and safety regime, yet Chinese automakers still experiment with internal programs and multiple supply routes. The 2026 no-fire/no-explosion standard raises the compliance burden further and likely benefits companies with greater test capital and field history. This means Juwan''s route to durable share probably depends on landing platform wins where charging speed matters enough to justify qualification effort and where incumbent relationships are not already fully locked.'
