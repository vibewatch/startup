chapter:
  number: 3
  title: Competitors
  summary: Juwan is not fighting for share in a vacuum. In 2026 the relevant competitive set includes CATL and BYD as benchmark incumbents, Geely/Hongqi as OEM-linked internal-build alternatives, SVOLT as a charger-fast challenger, and NIO-style battery swap as a substitute replenishment architecture. The core finding is that Juwan's public advantage is still narrative-led—extreme-fast charging plus ecosystem positioning—while rivals increasingly match the speed headline and surpass it on scale, distribution, and validation proof. That makes the company credible, but it also makes the moat fragile unless non-GAC customer lock-in and cost parity can be demonstrated.
sections:
- id: landscape
  title: 'Competitive set: direct incumbents, internal build, and substitutes'
  body: 'Juwan''s buyer can solve the same job through several different routes. The most obvious direct route is to source high-performance batteries from the large Chinese incumbents, led by CATL and BYD. A second route is OEM internal build or tightly controlled captive supply, which is increasingly visible through brands such as Geely and FAW Hongqi. A third route is to solve the user-experience problem with energy-replenishment architecture rather than only with cell chemistry—for example through battery swap or storage-assisted charging. That means Juwan is competing on a system problem, not only on a battery-spec sheet.


    This matters because the competitive benchmark is set by companies with very different strategic strengths. CATL brings scale and manufacturing credibility, BYD adds vehicle integration plus charging-network rollout, Geely frames safety and lifecycle as part of its battery pitch, SVOLT attacks with aggressive portfolio breadth, and NIO changes the user experience through swap. Juwan therefore cannot be benchmarked against a single peer class. It must win against incumbents, substitutes, and OEM internal options at the same time.'
