evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-table-disclosure
    missingEvidence: A full founder and executive roster matching the planned leadership-and-founder enumeration.
    whyItMatters: >-
      Public sources identify only the president plus sponsor and technical-origin entities, leaving succession and
      functional coverage partially opaque.
    diligencePath: Request full executive roster, founder biographies, and governance chart from management.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board composition, independent directors, and formal governance oversight disclosures.
    whyItMatters: >-
      The company is a mixed-ownership spinout with strategic shareholders, so board control and veto rights matter for
      underwriting alignment and downside protection.
    diligencePath: Request latest shareholder agreement, board roster, and reserved-matters schedule from management.
    relatedQuestionRefs:
      - QO010
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Revenue, ARR, unit shipment, gross margin, and realized pricing disclosures.
    whyItMatters: >-
      Without any public commercial-performance denominator, company-overview valuation facts cannot be tied to business
      output or margin quality.
    diligencePath: Request management accounts, audited financial statements, and customer-level shipment or revenue bridge.
    relatedQuestionRefs:
      - QO019
      - QO025
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue split between GAC-linked customers and external customers, plus repeat-order evidence.
    whyItMatters: >-
      The difference between broad logo deployment and economically diversified demand changes both risk rating and
      valuation support.
    diligencePath: Request top-10 customer revenue concentration, contract duration, and 2024-2026 shipment mix by OEM.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: A recent headcount disclosure or reliable third-party employment count.
    whyItMatters: >-
      Headcount is a basic scale marker for manufacturing readiness and burn intensity, but current public corroboration
      is weak.
    diligencePath: Request HR census or reconcile payroll/headcount with annual operating plan.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table-disclosure
    missingEvidence: A fuller month-by-month archive of pre-2020 incubation and 2025-2026 operational milestones.
    whyItMatters: >-
      The public milestone table is strong enough for overview use but still incomplete for a definitive operating
      chronology.
    diligencePath: Request archived board decks, launch timelines, and factory commissioning records to complete the chronology.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Cash balance, debt, burn, runway, and use-of-funds details after the 2024 stake transaction.
    whyItMatters: >-
      Capital adequacy is critical in battery manufacturing and infrastructure, especially as safety and charging
      standards tighten.
    diligencePath: Request latest balance sheet, debt schedule, capex plan, and forecast cash bridge.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: sam-sizing
    missingEvidence: >-
      A disclosed TAM/SAM/SOM model, pricing architecture, or per-unit economics bridge for Juwan's batteries and
      charging ecosystem.
    whyItMatters: >-
      Without a market-share bridge, headline market size does not translate into forecastable company revenue or
      valuation support.
    diligencePath: >-
      Request management market model showing target segments, ASPs, attach rates, and realistic penetration
      assumptions.
    relatedQuestionRefs:
      - QM018
      - QM019
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-ownership
    missingEvidence: Named procurement and budget-owner evidence for non-GAC OEMs, fleets, and charging-network customers.
    whyItMatters: >-
      Understanding who actually writes the check determines sales-cycle length and whether Juwan sells components,
      systems, or ecosystem participation.
    diligencePath: Request named pipeline by segment, budget-owner map, and channel / JV economics.
    relatedQuestionRefs:
      - QM014
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: tam-lens-divergence
    missingEvidence: >-
      One coherent, apples-to-apples TAM/SAM/SOM lens using consistent units rather than a mixture of TWh, charger
      counts, stations, and valuation heuristics.
    whyItMatters: Battery and charging markets are often mis-sized by mixing deployment, infrastructure, and revenue lenses.
    diligencePath: Normalize market work into one demand model for batteries and one for charging infrastructure before valuation.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: access-blocked
    severity: minor
    topic: detailed-iea-tables
    missingEvidence: Downloadable IEA tables for fine-grained country segmentation without archive friction.
    whyItMatters: Country-level segmentation would refine China-versus-export opportunity for Juwan.
    diligencePath: Pull the underlying dataset or subscription table set directly from IEA/BNEF during live diligence.
    relatedQuestionRefs:
      - QM004
      - QM007
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized OEM pricing, discounting, warranty terms, and contract duration for Juwan and the major incumbents.
    whyItMatters: >-
      Without pricing evidence, the public comparison must lean on performance and channel strength rather than
      margin-backed competitiveness.
    diligencePath: Request recent quotes, SOP contracts, or supplier scorecards for Juwan, CATL, and BYD programs.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: customer-switching
    missingEvidence: >-
      Platform-level sourcing policy, requalification burden, and multi-sourcing share for OEM customers considering
      Juwan.
    whyItMatters: >-
      Switching cost and lock-in depend on validation economics, warranty exposure, and dual-sourcing practice, none of
