  topStrengths:
    - Juwan 不是实验室故事，公开证据显示 XFC 电池已经商业化，也有生产活动支撑。
    - 公司在 GAC 生态内仍有战略相关性，并通过 AION 及相关车型项目拥有可见落地面。
    - EHang 合作和商用车案例说明，公司不只押注单一乘用 EV 平台，还有额外期权。
    - 2022 年和 2024 年末的公开估值锚点说明，成熟投资人仍愿意给这项资产独角兽级期权价值。
  topRisks:
    - 收入、毛利率、现金跑道和客户集中度仍未披露，估值承销仍主要靠叙事。
    - 2024 年末的估值锚点来自关联战略转让，并不是清晰的独立第三方新融资。
    - 客户证据最强的部分仍围绕 GAC/AION 叙事，非绑定客户的重复需求尚未充分证明。
    - CATL、BYD 等电池巨头仍靠规模、价格压力和竞品快充方案挤压市场。
    - 超快充仍依赖充电网络准备度、安全合规和基础设施经济性，而这些在公开证据里尚未完全跑通。
  unresolvedGaps:
    - 当前收入、毛利率、烧钱速度、现金跑道，以及工厂级运营 KPI。
    - 2024 年战略转让后的当前股权结构、优先权、稀释机制和少数股东保护。
    - 按收入排序的客户名单、重复订单历史，以及非 GAC 客户集中度数据。
    - 与 CATL、BYD 及其他快充对手并排比较的安全、衰减、良率和现场表现基准。
    - 能清楚区分试点项目、展示性落地和持久量产供货协议的证据。
