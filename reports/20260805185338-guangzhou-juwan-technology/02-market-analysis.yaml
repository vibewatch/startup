- id: constraints-and-contradictions
  title: Constraints, contradictory signals, and the still-open sizing gap
  body: 'The same market that rewards fast charging is also getting harder for smaller players. China''s new no-fire/no-explosion battery standard effective July 2026 raises the testing and quality bar. Nature''s work on urban ultra-fast charging points to grid distortions and system-stability risks if ultra-fast charging grows faster than tariff and grid design adapt. At the competitive layer, CATL still holds a dominant share of China''s battery-installation market and continues to publish or enable ever-faster benchmarks, while other Chinese brands are now quoting sub-four-minute charging windows as well. This means Juwan''s market is not merely large; it is arms-race large.


    The biggest contradiction is that macro indicators support the existence of a substantial opportunity, but public company-specific monetization evidence is absent. Juwan can plausibly address several large markets at once, yet each one has different buyers and economics. Until diligence can tie batteries, chargers, and ecosystem participation to ASPs, utilization, and repeat orders, a prudent market analysis should treat the TAM as supportive context—not as proof that Juwan has already earned a defendable serviceable market position.'
