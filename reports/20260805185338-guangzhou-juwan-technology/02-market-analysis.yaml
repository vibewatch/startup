callouts:
- calloutType: insight
  title: Large market does not mean easy market
  body: Almost every retained macro source is supportive on battery and charging growth, but the same sources also say China is where scale, standards, and incumbent intensity are highest. Juwan is playing in the deepest pool and against the strongest swimmers at the same time.
  claimRefs:
