  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-sizing
    missingEvidence: A disclosed TAM/SAM/SOM model, pricing architecture, or per-unit economics bridge for Juwan's batteries and charging ecosystem.
    whyItMatters: Without a market-share bridge, headline market size does not translate into forecastable company revenue or valuation support.
    diligencePath: Request management market model showing target segments, ASPs, attach rates, and realistic penetration assumptions.
    relatedQuestionRefs:
    - QM018
    - QM019
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-ownership
    missingEvidence: Named procurement and budget-owner evidence for non-GAC OEMs, fleets, and charging-network customers.
    whyItMatters: Understanding who actually writes the check determines sales-cycle length and whether Juwan sells components, systems, or ecosystem participation.
    diligencePath: Request named pipeline by segment, budget-owner map, and channel / JV economics.
    relatedQuestionRefs:
    - QM014
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: minor
    topic: tam-lens-divergence
    missingEvidence: One coherent, apples-to-apples TAM/SAM/SOM lens using consistent units rather than a mixture of TWh, charger counts, stations, and valuation heuristics.
    whyItMatters: Battery and charging markets are often mis-sized by mixing deployment, infrastructure, and revenue lenses.
    diligencePath: Normalize market work into one demand model for batteries and one for charging infrastructure before valuation.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: access-blocked
    severity: minor
    topic: detailed-iea-tables
    missingEvidence: Downloadable IEA tables for fine-grained country segmentation without archive friction.
    whyItMatters: Country-level segmentation would refine China-versus-export opportunity for Juwan.
    diligencePath: Pull the underlying dataset or subscription table set directly from IEA/BNEF during live diligence.
    relatedQuestionRefs:
    - QM004
    - QM007
