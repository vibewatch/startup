chapter:
  number: 2
  title: Market Analysis
  summary: 'Juwan operates in a market that is narrower than the global battery TAM headlines and broader than a pure EV-cell supplier: the relevant lens is Chinese and adjacent-Asian demand for fast-charge traction batteries plus the charging and power-management ecosystem needed to make them useful. Current 2025-2026 market data are supportive on the top line—IEA shows 1.2 TWh of EV battery deployment in 2025 and China with more than 4.7 million public charging points—but the same data also show a brutally competitive, incumbent-dominated field. The biggest market positive is that fast charging is becoming a real purchasing criterion across EVs, fleets, and low-altitude mobility; the biggest market negative is that Juwan''s SAM and monetization bridge remain undisclosed, while safety rules and incumbent benchmarks keep tightening.'
sections:
- id: market-boundary
  title: Market boundary and what should be included or excluded
  body: 'The correct market boundary for Juwan is not the entire global lithium-ion battery universe. Juwan''s own surface combines at least three linked layers: traction batteries for passenger and commercial vehicles, charging infrastructure and ecosystem participation needed to make XFC useful, and adjacent low-altitude / eVTOL battery systems. Those layers share chemistry and charging-speed logic, but they do not share the same buyers, margins, or sales cycles. A good diligence lens therefore separates battery demand from charger-network demand and treats eVTOL as an adjacency rather than as part of the core base case.


    What should be excluded? Consumer electronics battery spend is not directly relevant. Generic energy-transition investment totals also overstate Juwan''s serviceable market because the company still needs a monetization path from alliance membership and charging-network rhetoric to battery or systems revenue. The practical substitute set is conventional lithium-ion packs with slower charging, increasingly capable incumbent fast-charge platforms from CATL, BYD, FAW Hongqi, and others, plus any OEM or fleet workflow that decides slower charging is acceptable if capex, safety, or degradation economics are better.'
