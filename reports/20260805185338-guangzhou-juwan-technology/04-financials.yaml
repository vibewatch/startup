company:
  name: Guangzhou Juwan Technology Co., Ltd.
chapter:
  number: 4
  title: Financials
  summary: Juwan's public financial story is far weaker than its technology story. The record supports a plausible hardware-plus-infrastructure revenue model and confirms that strategic capital has ascribed unicorn-level value to the business, but it does not disclose revenue, margin, cash, debt, or runway. The key financial nuance is that the late-2024 RMB 1.331 billion transaction was a disposal by GAC and GAC Capital to GAIG, so it validates price but does not clearly represent fresh primary cash into Juwan. As a result, the right verdict is that Juwan may be strategically valuable, but it is not publicly underwritable on revenue quality or capital adequacy.
sections:
- id: revenue-model
  title: Revenue surfaces are visible, but realized monetization is not
  body: 'Public evidence makes the rough shape of Juwan''s revenue model legible even though the numbers are missing. The company markets XFC traction batteries, next-generation storage devices, charging-network participation, and low-altitude battery systems. That mix strongly implies multiple hardware-led revenue streams rather than a single homogeneous SKU. The most plausible core mechanism is B2B selling into OEM, fleet, infrastructure, and strategic-partner programs, with revenue likely recognized against deliveries, system integration, or project milestones. This is useful because it tells us what kind of business we are dealing with: industrial hardware and systems, not a recurring software subscription business.


    What it does not tell us is whether the business is attractive economically. Public sources do not reveal realized ASPs, service attach rates, warranty reserves, gross margin by program, or how much of the charging story converts into direct revenue versus ecosystem influence. The official site is therefore enough to outline the monetization surfaces but not enough to underwrite them. In diligence terms, the company has a visible commercial surface and an invisible income statement.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI031
  tableRefs:
  - TI001
  - TI002
  figureRefs:
