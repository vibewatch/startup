    - Cannot know whether XFC is profitable
    - Request product gross-margin bridge and warranty history
  - - Cash, burn, and runway
    - Cannot assess financing dependency
    - Request current balance sheet and 24-month operating plan
  - - Order book and repeat orders
    - Cannot distinguish pilots from durable demand
