  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: income-statement
    missingEvidence: Current revenue, gross margin, operating loss, EBITDA, and revenue mix by product line.
    whyItMatters: Without these inputs there is no defensible underwriting of revenue quality or margin path.
    diligencePath: Request latest monthly and trailing-twelve-month P&L plus segment split across batteries, chargers, storage, and eVTOL programs.
    relatedQuestionRefs:
    - QI004
    - QI007
    - QI031
    relatedTableRefs:
    - TI001
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: balance-sheet
    missingEvidence: Cash balance, debt, working-capital lines, inventory levels, capex commitments, and runway.
    whyItMatters: The business appears capital intensive, but public evidence cannot quantify whether growth is financeable.
    diligencePath: Request detailed balance sheet, borrowing schedule, inventory turns, and 24-month cash runway model.
    relatedQuestionRefs:
    - QI021
    - QI027
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized ASPs, warranty terms, service attach rates, and charger/station monetization model.
    whyItMatters: Station counts and product claims do not reveal monetization quality or cash payback.
    diligencePath: Request recent customer contracts and actual gross-profit waterfalls by program.
    relatedQuestionRefs:
    - QI006
    - QI020
    - QI028
    - QI030
    relatedTableRefs:
    - TI002
    - TI003
  - type: conflicting-data
    severity: minor
    topic: secondary-vs-primary-capital
    missingEvidence: Definitive management explanation of how much, if any, of the 2024 strategic transaction funded Juwan operations.
    whyItMatters: Valuation headlines can be mistaken for fresh financing when the transaction may mainly reallocate ownership.
    diligencePath: Reconcile cap table movement and cash proceeds at company level.
    relatedQuestionRefs:
    - QI010
    - QI011
    - QI012
    relatedTableRefs:
    - TI004
