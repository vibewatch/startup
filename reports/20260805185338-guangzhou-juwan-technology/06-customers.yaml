- id: named-proof
  title: Named customer proof exists, but its quality is uneven
  body: 'Publicly named customer proof is real, just not uniform. AION is the clearest passenger anchor: official GAC materials show a production EV with fast-charging capability, while Baidu Baike and other Juwan surfaces tie the deployment back to Juwan''s XFC batteries. EHang is the cleanest official non-road proof because the customer/partner itself announced the battery collaboration. Commercial vehicles provide a third anchor through the PRCWT delivery story, which names stakeholders around heavy trucks equipped with Juwan batteries and describes a concrete operational use case.


    After those anchors, proof quality falls off. Skyworth / Skywell and HYCAN appear in public deployment narratives, but the public record is less direct and more secondary-source driven than for AION or EHang. That does not mean the programs are false; it means they carry a lower underwriting weight. The named-customer set should therefore be treated as a partial public ledger of customer proof, not as a complete list of every production or pilot account.'
