callouts:
- calloutType: insight
  title: The best customer proofs come from different transport layers
  body: AION proves passenger relevance, EHang proves adjacency, and heavy-truck delivery proves a commercial uptime use case. That diversity is a positive even though proof quality is uneven. It also implies different sales motions, support demands, and concentration outcomes by segment, which makes customer diligence more complex than a simple logo count.
  claimRefs:
