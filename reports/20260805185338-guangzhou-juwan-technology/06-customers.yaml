- id: customer-verdict
  title: 'Customer verdict: credible adoption surfaces, incomplete underwriting proof'
  body: 'The customer chapter supports a constructive but cautious conclusion. Juwan can point to several named adoption surfaces across passenger EVs, commercial vehicles, charging ecosystems, and eVTOL. That breadth matters because it suggests the product is reaching different operating environments instead of remaining trapped in one demonstration lane. The company also has a plausible land-and-expand story from GAC-linked passenger platforms into heavy-duty and aviation-adjacent segments.


    But the public proof still stops short of what a full underwriting case requires. There is no revenue-ranked customer list, no contract-duration view, no retention dataset, and no clean separation between production deployments, pilots, and ecosystem memberships. Until those are provided, customer confidence should come from the existence of real named proofs—not from any assumption that Juwan has already solved durability or concentration risk.'
