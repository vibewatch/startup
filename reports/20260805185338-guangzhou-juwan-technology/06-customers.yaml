- id: durability
  title: Durability and concentration remain the central customer unknowns
  body: 'The main problem is not finding logos. It is finding retention. No retained public source discloses customer count, repeat-order rate, churn, NRR, GRR, renewal terms, or top-account concentration. This creates a major asymmetry between what public sources can prove and what investors need to know. A battery supplier in a competitive market is not underwritten by logo count alone; it is underwritten by repeat orders, design-in persistence, and the difficulty of displacing the supplier once qualified into production.


    Public evidence today suggests concentration risk is still meaningful. The strongest proof continues to cluster around GAC/AION and GAC-adjacent narratives, while other customers are visible but less deeply documented. That makes Juwan''s commercial story promising but potentially narrow. Expansion into trucks, ports, and eVTOL could reduce that risk over time, yet it could also remain mostly showcase-driven until revenue-ranked customer data are produced.'
