- id: regulatory-legal-operational
  title: Regulatory, legal, and operational risks are real and only partly mitigated
  body: 'On regulation, the burden is explicit. China''s 2026 standards require stronger abuse tolerance and safety performance, while adjacent standard-setting on battery swap and solid-state systems shows the rulebook is still evolving. On legal risk, Juwan appears to have meaningful IP activity, but the surrounding legal environment makes patents both an asset and a litigation surface. The public Wenshu database provides a route for court checks, and Chinese IP-court commentary underscores that technology disputes remain active. None of that proves Juwan is currently in litigation; it does mean that legal clearance should be verified rather than assumed.


    Operationally, Juwan has moved beyond a prototype stage into factories, production lines, and partner deployments. That is positive, but it also creates failure modes that marketing pages do not address: yield loss, commissioning delays, recall exposure, warranty losses, and field-performance under load. CNAS recognition helps show formal testing posture, yet it is only a partial mitigation. The public record still does not provide the operating KPI set needed to size manufacturing or quality risk with confidence.'
