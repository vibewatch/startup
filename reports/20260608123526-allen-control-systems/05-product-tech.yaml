  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Dependency
      - Risk
      - Public evidence
    rows:
      - - Passive optics and sensing
        - Detect and localize drones without emitting radar
        - Camera quality, field of view, power budget, weather tolerance
        - Missed detections or degraded coverage in cluttered conditions
        - Passive detection page; Bullfrog product pages
      - - Perception and classification
        - Distinguish drones from birds, friendlies, and background clutter
        - Model quality and training-data coverage
        - False positives, false negatives, or poor generalization to new threats
        - Training-data page; Army Recognition reporting on annotated-image corpus
      - - Target tracking and control
        - Keep the weapon on the target track and compute a firing solution
        - Control software, actuators, ballistic model, timing accuracy
        - Tracking instability or bad shot timing can waste ammo or create risk
        - Autonomous fire-control page; War Quants kill-chain analysis
      - - Effector and weapon integration
        - Turn legacy/common weapons into autonomous point-defense systems
        - Weapon-specific mounts, recoil handling, ammo logistics, safe arcs
        - Different SKUs may not be equally mature across weapon types
        - M240/M2/M230/M134 product pages
      - - Open interfaces and C2
        - Receive tracks, share target data, and sit inside layered defense
        - Stable integrations with ATAK, FAAD C2, Lattice, radars, and customer systems
        - Open-architecture claim can fail if ICDs or latency budgets are weak
        - Homepage and product pages; Army Recognition reporting
      - - Human release and operating controls
        - Preserve operator authority over lethal engagement
        - Clear HMI, shot recommendation logic, override, and deactivation procedures
        - Governance failure can become the main blocker even if the aim point is accurate
        - Product pages; Army Recognition; DoD Directive 3000.09
    notes: >-
      The architecture table mixes physical, software, and control-governance layers because Bullfrog’s product thesis
      depends on all of them working together.
