  evidenceGaps:
    - type: missing-source
      severity: material
      topic: performance-validation
      missingEvidence: Independent test results on detection range, false positives, engagement probability, and weather or low-light performance.
      whyItMatters: Bullfrog’s valuation and transition case depend on repeatable accuracy and reliability rather than marketing-level demo anecdotes.
      diligencePath: Request Army or customer test reports, confusion matrices, and after-action data from TREX, Project Convergence, or later operational events.
      relatedQuestionRefs:
        - QE018
        - QE023
    - type: private-evidence-only
      severity: material
      topic: sustainment
      missingEvidence: Field maintenance burden, spare-part needs, ammo consumption norms, and operator-support staffing requirements.
      whyItMatters: A low cost per kill does not prove low lifecycle cost if sustainment or training overhead is high.
      diligencePath: Ask for sustainment plans, MTBF targets, maintenance manuals, and support staffing assumptions from current customer deployments.
      relatedQuestionRefs:
        - QE010
        - QE025
    - type: missing-source
      severity: material
      topic: assurance-disclosure
      missingEvidence: Public or customer-shareable evidence of V&V, cybersecurity, anti-tamper controls, and any quality or data-handling certifications.
      whyItMatters: Autonomy-enabled lethal systems are often gated more by assurance evidence than by raw hit probability.
      diligencePath: Request system safety case, cyber architecture review, operator override documentation, and any CMMC, ISO, or AS9100 materials.
      relatedQuestionRefs:
        - QE019
        - QE020
        - QE021
      relatedTableRefs:
        - TE004
    - type: missing-source
      severity: minor
      topic: export-licensing
      missingEvidence: Bullfrog export classification, licensing status, and constraints on partner-force sales.
      whyItMatters: Export friction can delay international growth and affect which configurations can be sold abroad.
      diligencePath: Confirm ITAR or EAR status, license history, and any country-specific restrictions with counsel and trade-compliance staff.
      relatedQuestionRefs:
        - QE022
    - type: missing-source
      severity: material
      topic: interface-documentation
      missingEvidence: Interface control documents, latency budgets, and evidence for integrations beyond named C2 examples.
      whyItMatters: Open-architecture claims are only valuable if integration burden is actually manageable for the buyer.
      diligencePath: Request ICDs, integration timelines, and customer references covering ATAK, FAAD C2, Lattice, or radar handoff integrations.
      relatedQuestionRefs:
        - QE007
        - QE017
