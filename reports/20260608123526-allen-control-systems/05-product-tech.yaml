  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - ACS solution
      - Public benefit
      - Current limitation
    rows:
      - - Protect a fixed site from cheap drones
        - Use radar or observers, hand off to jammers or expensive interceptors
        - M240C or M2 Bullfrog with passive sensing
        - Low-SWaP kinetic point defense with no radar emission required
        - Public proof is still demo-heavy and rules-of-fire detail is sparse
      - - Protect a vehicle or convoy on the move
        - Manually aimed gun or layered escort package
        - Bullfrog family mounted on common vehicle platforms
        - Operators can engage from behind a screen instead of exposing gunners
        - Platform integration evidence is lighter than static-site marketing
      - - Protect a maritime asset or water approach
        - Use watchstanders plus layered kinetic or EW defenses
        - Bullfrog marketed for vessels and maritime critical assets
        - Extends point defense to boats and harbor-like settings
        - Public saltwater, recoil, and sustainment evidence is absent
      - - Add kinetic defeat into a layered C2 stack
        - Sensor track goes to a separate effector or manual weapon station
        - Open-architecture Bullfrog handoff to ATAK, FAAD C2, or Lattice
        - Lets Bullfrog slot into existing defense architectures instead of replacing them
        - No public API, ICD, or latency documentation
      - - Upgrade an existing remote weapon station
        - Replace the whole system or accept manual joystick control
        - Unbundle ACS fire control and reuse it on another weapon station
        - Preserves installed hardware while adding autonomy
        - No public proof yet of integrations outside Bullfrog
      - - Refresh drone-recognition models against new threats
        - Collect real imagery slowly and label it manually
        - Use ACS synthetic-data pipeline and CV support
        - Faster iteration for new drone classes, weather, and terrain conditions
        - Transfer performance from synthetic to live operations is not disclosed
    notes: >-
      Benefits reflect the strongest public workflow claims; limitations mark where the source set stops short of
      publishing operational doctrine, support SLAs, or interface artifacts.
