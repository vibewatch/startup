  - id: TE004
    title: Trust / quality / compliance table
    columns:
      - Control or issue
      - Public status
      - Scope
      - Why it matters
      - Gap
    rows:
      - - Operator command to fire
        - Publicly disclosed
        - Product pages and external reporting
        - Shows ACS is not publicly marketing a no-human-release kill chain
        - No public detail on override timing or abort logic
      - - Human-in/on-the-loop modes
        - Reported by secondary coverage
        - Engagement governance
        - Helps align Bullfrog with DoD expectations around human judgment
        - No primary-source concept of operations or test evidence posted
      - - V&V, safety, cybersecurity, auditable interfaces
        - Required by DoD policy, not disclosed by ACS
        - Autonomous weapon-system assurance
        - These are core gating items for military trust and approval
        - No public V&V package, cyber posture, or auditability artifact found
      - - Domestic C-UAS authorities
        - Government frameworks exist
        - Homeland or dual-use deployments
        - Authority and public-safety rules shape who can legally operate counter-UAS systems
        - ACS public surface does not explain domestic deployment authorities
      - - Export licensing
        - Generic U.S. licensing path exists
        - Allied and partner-force sales
        - Export approvals can slow international expansion or shape product configuration
        - ACS does not publish export classification or approvals
      - - Published certifications and quality markers
        - Not found in fetched ACS surface
        - Enterprise/process maturity
        - Certifications are a quick proxy for engineering and data-handling maturity
        - No CMMC, ISO, AS9100, or equivalent disclosure located
    notes: >-
      This table intentionally mixes visible controls with missing controls because the diligence issue is not only what
      ACS says exists, but what it does not yet substantiate publicly.
