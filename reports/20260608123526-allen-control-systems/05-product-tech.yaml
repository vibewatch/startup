tables:
  - id: TE001
    title: Bullfrog module / SKU matrix
    columns:
      - Module / SKU
      - Primary workflow
      - Public maturity
      - Key spec or capability
      - Differentiation
      - Main diligence gap
    rows:
      - - Bullfrog M240C
        - Individual-platform point defense for Group 1-3 UAS, FPVs, and swarms
        - Strongest public configuration
        - 7.62x51 mm, 800 m point-target range, 850 rpm, ~300 lbs, <1 MOA
        - Cheapest and clearest service-common weapon path
        - Need independent hit-rate, false-positive, and field-reliability data
      - - Bullfrog M2
        - Advanced defense for vehicles, vessels, formations, and fixed sites
        - Publicly marketed configuration
        - .50 cal / 12.7 mm, 1500 m point-target range, 600 rpm
        - Extends reach versus M240C while staying in common-weapons lane
        - Need proof of operational fielding beyond product page claims
      - - Bullfrog M230
        - Convoy and tactical-formation defense against larger drones
        - Roadmap / future-development posture
        - NATO 30x113 mm, 800-1500 m advertised range
        - Heavier effector for larger aerial targets
        - Homepage still labels it future development despite dedicated page
      - - Bullfrog M134
        - Convoy and close-in swarm defense with very high cyclic fire
        - Publicly marketed configuration
        - 7.62x51 mm, 2000-6000 rpm, 800 m point-target range
        - Highest-rate kinetic option for dense close-range raids
        - Need evidence on recoil, ammo burden, and sustained use
      - - Passive drone detection
        - Passive search and early warning before any shot decision
        - Shipping capability page, modular service surface
        - Battery-powered camera array with ACS or customer optics
        - No-radar detection can preserve concealment and embed into larger stacks
        - Public sensor range, weather performance, and false-positive data absent
      - - Autonomous fire-control kit
        - Gun laying, tracking, and shot computation for remote weapon stations
        - Shipping capability page, explicitly unbundlable
        - Proprietary control software accounts for torque and turret inertia
        - Can migrate beyond Bullfrog into other weapon stations
        - No public interface control documents or control-loop benchmarks
      - - Training-data generation
        - Model refresh and classifier development for aerial targets and clutter
        - Shipping capability page / services layer
        - Photorealistic synthetic scenes with ground-truth labels
        - Keeps perception stack current without depending only on live data collection
        - Need evidence that synthetic-to-real transfer works in field conditions
    notes: >-
      Rows combine Bullfrog weapon SKUs with separately marketed ACS capability modules because the public product
      surface presents a family-plus-platform story rather than a single closed appliance.
