companyProfile:
  summary: Allen Control Systems is a private U.S. defense-technology startup founded in 2022 to build autonomous precision weapon stations for counter-drone missions. The company’s Bullfrog product family combines AI, computer vision, passive sensing, and proprietary fire-control software to upgrade existing weapons for kinetic defeat of Group 1-3 drones, and public materials say ACS is already deployed with the U.S. Army and U.S. Navy while also holding SOF and allied contracts. Publicly disclosed capital totals $242 million across seed, Series A, and Series B, but revenue, backlog, margin, and cap-table terms remain undisclosed.
  foundedDate: '2022-01-01'
  founders:
    - name: Steven Simoni
      role: President & Co-founder
      background: Former U.S. Navy nuclear engineer; co-founded Bbot, which was acquired by DoorDash in 2022.
      claimRefs: [CO002, CO003, CO004, CO014]
    - name: Luke Allen
      role: CTO & Co-founder
      background: Former U.S. Navy nuclear engineer and instrumentation-and-control engineer for Navy reactors; leads ACS technology architecture.
      claimRefs: [CO002, CO003, CO014]
    - name: Mike Wior
      role: CEO & Co-founder
      background: Previously co-founded Omnivore, acquired by Olo in 2022; now leads ACS as CEO after the 2025 leadership handoff.
      claimRefs: [CO002, CO005, CO014, CO017]
  foundingLocation: Austin, Texas, USA
  headquarters: Austin, TX / Alexandria, VA / Huntsville, AL, USA
  productSummary: Bullfrog autonomous weapon stations in M240, M2, M230, and M134 configurations, plus passive detection, autonomous fire control, and training-data generation.
  customerFocus: U.S. Army, U.S. Navy, maritime Special Operations Forces, and allied military users needing low-cost kinetic counter-UAS defense.
  businessModel: Hardware sales and integration contracts for autonomous weapon stations, plus ancillary fire-control, passive-detection, training-data, and support services sold through defense procurement pathways and SBIR-linked programs.
  stage: Series B
  fundingStatus: $12M seed (Apr 2024), $30M Series A (Mar 2025), and $200M Series B (Jun 2026) at a $2.2B post-money valuation; $242M disclosed total.
