  body: |-
    Public materials clearly show the end-state leadership trio, but they do not explain the timing or rationale of the shift
    from Steve Simoni as CEO in early-2025 releases to Mike Wior as CEO by the March 2025 Series A and June 2026 Series B.
    For a private company at a $2.2B valuation, that governance opacity is a diligence issue, especially because board and
