- id: founders-leadership-governance
  title: Founders, leadership evolution, and governance signals
  body: |-
    ACS's founder-market fit is unusually direct. Simoni and Allen are former U.S. Navy nuclear engineers and former
    instrumentation-and-control engineers for Navy reactors, backgrounds the company repeatedly uses to explain why they are
    comfortable blending robotics, controls, machine learning, and hardware reliability into a battlefield system. Wior adds a
    commercial and operating complement from Omnivore and the earlier Bbot network. This combination helps explain why ACS can
    pitch itself as both an autonomy software company and a deployable defense-systems builder.

    The more material governance question is title continuity. The April 2024 seed announcement named Steven Simoni as CEO and
    Mike Wior as COO. Official releases in February and March 2025, including the Huntsville I2C announcement and Clay
    Armentrout hire, still called Simoni the CEO. Six days later, the March 26, 2025 Series A release named Mike Wior the CEO,
    and the June 2026 Series B release plus the current company page show the stable end-state: Wior as CEO, Simoni as
    President, and Allen as CTO. Public sources do not explain whether the shift was board-driven, planned in advance, or tied
    to scaling demands. Investors should therefore treat leadership concentration and governance opacity—not founder pedigree—
    as the key chapter-one people risk.
