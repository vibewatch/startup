- id: traction-scale-and-disclosure
  title: Government traction, field-validation signals, and disclosure limits
  body: |-
    ACS's strongest public traction signals are military rather than commercial. By June 2026 the company said Bullfrog was
    already deployed with the U.S. Army and U.S. Navy, had won the Army's xTechOverwatch competition, had a maritime SOF
    contract, and had added contracts in South Korea and the UAE plus a Romanian co-production memorandum. The Army
    Applications Lab contract and USAspending recipient profile also show that ACS is not operating only in demo mode; there is
    visible federal award activity and a path into integration work across Army vehicle platforms. Independent trade coverage of
    TREX 24-2, JCO demos, and later analyses reinforces that ACS has repeatedly put Bullfrog in front of government evaluators.

    But the disclosure profile remains thin on the numbers most relevant to underwriting. There is no public revenue, ARR,
    customer-count, or unit-deployment count in the reviewed set. Headcount is similarly opaque: Rally Ventures' profile still
    shows a small-company 11-50 range, which is informative as an external profile artifact but not reliable enough to treat as
    a current operating metric. The result is a company with unusually strong battlefield-adoption signals relative to its age,
    but still a private-undisclosed disclosure profile from a financial diligence perspective.
