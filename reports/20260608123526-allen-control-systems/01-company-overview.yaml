company:
  name: Allen Control Systems
chapter:
  number: 1
  title: Company Overview
  summary: |-
    Allen Control Systems (ACS) is a private Austin-based defense technology company founded in 2022 by Steven Simoni,
    Luke Allen, and Mike Wior to build autonomous precision weapon stations for counter-drone missions. Publicly disclosed
    financing totals $242 million across a $12 million seed (2024), $30 million Series A (2025), and $200 million Series B
    (June 2026 at a $2.2 billion post-money valuation), with Craft Ventures recurring across the seed and Series A and Smash
    Capital leading the Series B. ACS's flagship Bullfrog system applies AI, computer vision, and proprietary controls to
    existing weapons, and the company says it is already deployed with the U.S. Army and U.S. Navy while also holding SOF and
    allied contracts. The main unresolved issues for diligence are governance opacity, the exact timing and rationale of the
    Mike Wior/Steve Simoni leadership handoff, and the absence of public revenue, customer-count, and manufacturing-output
    disclosure.
sections:
- id: identity-product-footprint
  title: Identity, product scope, and footprint
  body: |-
    Allen Control Systems presents itself as a defense technology company building autonomous precision weapon stations for
    the United States and allied partners. The company says it was founded in 2022 by Steven Simoni, Luke Allen, and Mike
    Wior after Simoni and Allen sold restaurant-robotics startup Bbot to DoorDash and Wior sold Omnivore to Olo. The
    founding thesis is explicit: ACS was created not to build more drones but to reduce the cost-per-kill of hostile drones
    by making existing weapons dramatically more accurate. That mission has crystallized into Bullfrog, an AI-enabled,
    passive-sensing autonomous weapon station that ACS markets in M240, M2, M230, and M134 configurations, plus adjacent
    passive drone-detection, autonomous fire-control, and synthetic-training-data capabilities.

    Austin, Texas is the canonical corporate center across current official materials, reinforced by the company page, the
    Series A release, the Series B release, and the USAspending recipient profile. ACS also consistently lists an Alexandria,
    Virginia office, reflecting proximity to defense customers, and by 2025-2026 expanded visibly into Huntsville,
    Alabama through a university-affiliated innovation footprint and then a formal innovation lab. Public materials do not
    disclose revenue, headcount, or customer count, so later chapters should treat the company identity, product scope,
    and site footprint as established facts, while keeping scale metrics provisional unless independently refreshed.
