- id: milestones-policy-and-adverse-context
  title: Milestones, policy setting, and adverse context
  body: |-
    The canonical chronology for later chapters starts with the 2022 founding, then the April 2024 seed round that framed ACS
    as a counter-drone robotics startup born from Navy veterans and prior software exits. The next major inflections are the
    September 2024 TREX demonstration, the early-2025 footprint expansion into Fort Sill and Huntsville, the late-March 2025
    Series A and public CEO handoff to Mike Wior, the September-December 2025 stretch of SOF, allied, and Army vehicle
    integration contracts, and the February 2026 xTechOverwatch win. The June 2026 Series B and innovation-lab launch mark the
    shift from promising defense startup to aggressively scaled manufacturing story.

    The adverse overlay is not a product-failure event but a policy-and-ethics one. DoD Directive 3000.09 still requires
    appropriate human judgment over force in autonomous and semi-autonomous weapon systems, and ACS's trade-press coverage
    emphasizes human approval before firing. Even so, War Quants highlights trust as the limiting factor for AI machine-gun
    employment, while Human Rights Watch argues that U.S. policy is sliding toward fully autonomous killing. That means ACS's
    opportunity is being created by the same autonomy policy environment that will continue to subject it to scrutiny on control,
    accountability, and rules-of-engagement compliance.
