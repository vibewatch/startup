  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital structure
    missingEvidence: Current cap table, any secondary sales, and any debt or credit instruments layered alongside the equity rounds.
    whyItMatters: Without this information, investors cannot see dilution history, liquidation stack, or whether non-equity obligations complicate the funding story.
    diligencePath: Request the latest capitalization table, financing documents, and side letters from the Series B and prior rounds.
    relatedQuestionRefs:
    - QO010
    - QO025
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: governance opacity
    missingEvidence: Board roster, independent-director status, observer rights, and investor governance allocations.
    whyItMatters: The leadership handoff from Simoni to Wior is visible, but the authority behind that transition is not. Governance quality cannot be judged from public materials alone.
    diligencePath: Ask for board minutes or formal board roster, committee structure, and the governance schedule from the lead financing documents.
    relatedQuestionRefs:
    - QO013
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue and ARR
    missingEvidence: Current revenue, ARR, gross margin, and backlog disclosure from management or primary documents.
    whyItMatters: A $2.2B post-money valuation cannot be underwritten without at least a current revenue or bookings anchor.
    diligencePath: Request monthly bookings, revenue, gross-margin, and backlog schedules used in the Series B process.
    relatedQuestionRefs:
    - QO014
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: customer count and deployments
    missingEvidence: Absolute customer count, deployed-system count, and contract concentration by customer and program.
    whyItMatters: Named military users are strong proof points, but concentration risk and true installed-base depth remain unknown.
    diligencePath: Request contract roster, deployed-unit counts, pipeline by service or ally, and renewal cadence for each visible program.
    relatedQuestionRefs:
    - QO014
    relatedTableRefs:
    - TO001
    - TO004
  - type: missing-source
    severity: material
    topic: headcount and manufacturing capacity
    missingEvidence: Current headcount, factory square footage, output rates, and manufacturing bottleneck disclosure.
    whyItMatters: Series B proceeds are earmarked for scale, but public sources do not quantify the operating base from which ACS is scaling.
    diligencePath: Request current org chart, hiring plan, Austin/Huntsville manufacturing footprint details, and monthly production-capacity metrics.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO001
