      - - 保护行进中的车辆或车队
        - 人工瞄准枪械或分层护航方案
        - 安装在通用车辆平台上的 Bullfrog 系列
        - 操作员可隔着屏幕交战，不必暴露射手
        - 平台集成证据弱于固定场址营销
      - - 保护海上资产或水上通道
        - 使用值守人员并叠加分层动能或电子战防御
        - Bullfrog 面向舰艇和海上关键资产营销
        - 把点防御延伸到船艇和港口类场景
        - 盐水环境、后坐力和保障能力暂无公开证据
      - - 在分层 C2 栈中加入动能杀伤
        - 传感器航迹交给独立效应器或手动武器站
        - Bullfrog 以开放架构把目标交接给 ATAK、FAAD C2 或 Lattice
        - 让 Bullfrog 嵌入既有防御架构，而不是替换整套体系
        - 没有公开 API、ICD 或延迟文档
      - - 升级既有遥控武器站
        - 要么替换整套系统，要么接受手动摇杆控制
        - 拆出 ACS 火控能力，复用到另一套武器站
        - 保留已部署硬件，同时加入自主能力
        - Bullfrog 之外的集成尚无公开证明
      - - 围绕新威胁刷新无人机识别模型
        - 慢慢采集真实图像，再人工标注
        - 使用 ACS 合成数据流水线和 CV 支持
        - 针对新无人机类别、天气和地形条件更快迭代
        - 合成数据到实战的迁移表现未披露
