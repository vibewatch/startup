      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              只看已披露资本，ACS 已不再是脆弱的种子期公司。公司宣布了 $12 million 种子轮、$30 million Series A，以及以 $2.2 billion 投后估值完成的 $200 million
              Series B，已披露股权资本至少 $242 million。可公开计数的政府相关资金又提供了大约 $7.05 million 的底线，来源包括 USASpending 收款方总额、xTech DP2 SBIR
              奖项和 Army Applications Lab 基础合同；如果 AAL 期权上限全部行使，路径可到大约 $12.05 million。Series B 募资用途明确偏扩张：扩大制造、加速 Bullfrog
              部署、推进新产品线。再加上 Innovation Lab、FISTA 布局和 Austin 制造扩张，图景是一家公司在为生产就绪花钱，而不是保守省现金。


              这让资本充足性方向上偏正面，但还不能真正测算。公开材料没有现金余额、烧钱速度、现金跑道，也没有债务或项目融资计划，外部投资人无法把一轮 $200 million
              融资换算成多少个月运营余量。因此，下一次融资触发点只能推断，而不能从管理层指引中读取。最可能的触发点，是从演示和原型集成合同转化为可重复生产授标，以及经常性支持或软件收入。资本市场背景有利：Saronic 和
              Shield AI 都在 2026 年完成巨额融资，AeroVironment 等上市防务同业也处在投资人熟悉的披露制度内。但 ACS
              仍要求投资人在缺少通常用于锚定接受度的公开收入或毛利率数据时，接受一个高估值。
