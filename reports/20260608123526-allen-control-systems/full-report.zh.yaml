      - number: '2.5'
        title: 比又一页通用 TAM 更重要的尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最大的剩余缺口，不是反无人机是否增长，而是 ACS 能否把宽泛的 C-UAS
              需求转化为可重复、可扩张的自主武器站收入池。没有保留的公开来源拆出与自主武器站或专门用于无人机击毁的遥控武器站相关的支出。这意味着估值模型不应假设公司可以直接从 $11.6 billion，甚至 $3.2
              billion 的市场中拿份额。更有价值的尽调问题以项目为中心：哪些部队购买、买了多少套系统、走什么采购渠道、采用什么保障模式、平台集成负担有多重，以及每次部署背后有多少训练或交战规则开销。


              另外两个缺口也重要。第一，民用和关键基础设施权限在公开来源中仍不完整。本章可以证明威胁真实、政府预算在上升，但还不能证明私人机场、公用事业公司或港口何时能够独立购买并启用 Bullfrog
              这样的动能系统，而不是需要联邦操作者或获批伙伴介入。第二，产品层面的出口管制细节很薄：DDTC 和 BIS 解释了制度，但没有保留的公开来源披露 Bullfrog
              的准确分类、许可历史或逐国放行路径。这些缺口不会推翻市场逻辑；它们只是定义了下一步尽调，并防止本章假装 ACS 的 SAM 已经量化。
