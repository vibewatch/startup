chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围与地域布局
        blocks:
          - type: paragraph
            body: >-
              Allen Control Systems 将自己定位为一家国防科技公司，为美国及其盟友打造自主精确武器站。公司称，Steven Simoni、Luke Allen 和 Mike Wior 于 2022 年创立
              ACS；在此之前，Simoni 和 Allen 将餐饮机器人初创公司 Bbot 出售给 DoorDash，Wior 将 Omnivore 出售给 Olo。创立逻辑很明确：ACS
              不是要造更多无人机，而是要让现有武器大幅提升命中精度，从而压低敌方无人机的单次击杀成本。这个任务已经落到 Bullfrog 上：这是一套 AI 驱动、依靠被动感知的自主武器站，ACS 以 M240、M2、M230
              和 M134 配置销售，并延伸出被动无人机探测、自主火控和合成训练数据能力。


              Austin, Texas 是当前官方材料中一致指向的公司中心，公司页面、Series A 新闻稿、Series B 新闻稿和 USAspending 收款方档案都在强化这一点。ACS 也稳定列出
              Alexandria, Virginia 办公室，反映其靠近国防客户；到 2025-2026 年，公司又通过大学关联的创新据点、随后通过正式创新实验室，明显扩展到 Huntsville,
              Alabama。公开材料未披露收入、员工数或客户数，因此后续章节可以把公司身份、产品范围和运营足迹视为已确立事实，但规模指标仍应保持暂定，除非另有独立更新。
