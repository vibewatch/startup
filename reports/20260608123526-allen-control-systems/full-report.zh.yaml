      - number: '7.2'
        title: 客户集中度与采购风险
        blocks:
          - type: paragraph
            body: >-
              ACS 确有市场在意的证据：xTechOverwatch、海上 SOF 合同、盟友合同，以及公司声称陆军和海军已经部署。问题不是没有需求，而是需求集中。公开可见的联邦奖项历史仍指向 DoD
              是唯一授奖机构、陆军是唯一可见下属机构；公司的公开客户证据也压倒性地来自军方和盟友政府。这让收入叙事暴露在一小撮买方面前，而这些项目受拨款节奏、需求文件和自主系统规则演变牵动。


              反无人机预算的实际分配方式会放大这种集中。DHS 正在打开新的资金通道，但本土采购在大规模购买自主动能杀伤前，可能先偏向分层探测和处置项目。在 DoD 内部，ACS 也不是站在空赛道上。CRS
              材料显示，陆军同时资助拦截器、高能激光、微波和集成 IFPC 架构。换句话说，Bullfrog 必须在分层防御栈里赢到位置，而不只是证明无人机威胁正在变大。


              政府关系岗位的引入也强化了这一点。ACS
              聘请一名熟悉参议院拨款和军事委员会的资深华盛顿操盘手，因为下一阶段增长取决于捕获项目、把预算线转成收入，以及进入正式采办项目路径。如果试点和实验活动不能转为重复采购，$2.2B 估值就缺少公开收入支撑。
