  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Bullfrog 产品族、模块与操作员工作流
        blocks:
          - type: paragraph
            body: >-
              从客户工作流看，Bullfrog 是一组短程自主武器站，用于保护车辆、舰艇、编队和固定地点免受无人机和蜂群威胁。公开材料展示了四个武装 SKU——M240C、M2、M230 和
              M134——都围绕同一个核心承诺：被动感知、AI 辅助探测与跟踪、与现有 C2 开放架构集成，以及使用服役通用武器而不是专用拦截器。这个产品族图谱重要，因为 ACS
              卖的不只是炮塔。它还在营销低附带损害选项、被动感知模块、合成数据服务，甚至一个可从 Bullfrog 拆出并装入其他遥控武器站的火控套件。不过公开成熟度并不均衡。M240 级配置拥有最清晰的演示证据，而 M230
              页面与首页仍把这一路径称为未来开发的表述同时存在。因此，这条产品线看上去模块化、可扩展，但各个已列变体的成熟度并不一致。
