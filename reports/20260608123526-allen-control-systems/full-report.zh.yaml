        - $200M Series B，对应 $2.2B 投后估值
        - 直接标的公司与当前入场参考
        - 未公开收入或毛利率披露
      - - Shield AI
        - 最新私募融资轮
        - $1.5B Series G 轮后估值 $12.7B
        - 反映标志性 DoD 催化下，投资人愿为自主能力付出的价格
        - 航空器自主系统与融资结构都比 ACS 更宽泛
      - - Saronic
        - 最新私募融资轮加合同证明
        - $1.75B Series D 轮、估值 $9.25B，并有已披露 $392M 海军合同背景
        - 近期防务自主系统里最好的制造与采购可比公司
        - 海上自主系统不是直接的反无人机可比项
      - - Epirus
        - 合同证明与融资背景
        - 保留样本中没有已披露当前估值；有 $66.1M 原型和 $43.5M 陆军合同证据
        - 最接近的定向能反无人机硬件同行
        - 微波架构不同于 ACS 的动能拦截路径
      - - DroneShield
        - 公开市场纯标的运营证明
        - FY2025 收入 A$216.5M，同比增长 277%
        - 显示真实披露的 C-UAS 收入是什么量级
        - 上市公司身份和产品组合不同
      - - Anduril
        - 私营估值上限基准
        - 2026 年估值超过 $60B 的背景
        - 给多元化防务平台划出估值天花板
        - 业务过宽、太多元，不能直接迁移倍数
    notes: 本表覆盖本章保留使用的全部可比项。由于 ACS 没有披露可用于干净倍数分析的收入基础， 表中混合使用私募融资轮、公开收入证明和合同可见度。
