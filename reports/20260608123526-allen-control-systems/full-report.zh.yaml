        title: 留存、重复使用与扩张信号
        blocks:
          - type: paragraph
            body: >
              公开证据更能说明初始采用，远不能说明耐久度。ACS 不披露活跃客户数、合同期限、NRR、GRR、流失率或任何满意度指标，因此无法量化判断 Bullfrog
              客户是否会续约、复购，或横向扩展到多个项目。最强的正面信号是结构性的，不是统计性的：盟友合同把硬件交付与操作员培训、技术协助和保障打包，意味着首单之后可能形成服务层，加深账户粘性。Army
              Applications Lab
              的车辆集成计划创造了第二条清晰扩张回路，因为一套获批的软件与控制栈可能铺到多种作战平台。产品页还展示了多种武器变体和部署环境；一旦审批通过，单一客户内的钱包份额有机会扩大。但这些仍是扩张可能性，不是已验证的重复采购。除非管理层拿出复购历史、保障续约节奏以及硬件与服务收入构成，否则投资者应把留存和扩张视为合理但未证实。
