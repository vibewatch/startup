        - 验证分层部署中的探测距离、误报和交接质量
      - - 开放架构集成
        - 同样的开放性会降低切换成本，并支持多归属
        - 高
        - 易插入可加速首单，即便削弱长期锁定效应
        - 审查软件更新、再训练权和集成归属的合同条款
      - - 盟军出口进展
        - 主承包商在区域办公室、后方维修保障和持续保障上强于 ACS
        - 中
        - ACS 已在把合同与培训、技术援助和区域办公室建设绑定
        - 要求按每个出口市场披露支持人员、合作伙伴和备件计划明细
      - - 自主枪站品类独特性
        - 早期品类可能始终较小，买方也可能默认选择升级版存量系统
        - 中
        - 若能证明感知和控制模块可在 Bullfrog 之外复用，ACS 能加宽护城河
        - 检验管线是否包含非 Bullfrog 许可，还是只靠炮塔带动收入
