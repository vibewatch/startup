      - number: '3.2'
        title: 能力与部署对比
        blocks:
          - type: paragraph
            body: >-
              Bullfrog 的公开优势，是自主火控、被动探测、通用弹药以及在现有武器上的低 SWaP 部署。ACS 声称系统可运行在 M240、M2 和 M230 配置上，可与 ATAK、FAAD C2 和 Lattice
              集成，也能把火控层拆出来复用到其他武器站。这意味着最接近的替代品不是传感器供应商，而是物理机制不同的效应器。Epirus 和 RTX 用高功率微波攻击同一套无人机蜂群经济学，Leonardo DRS
              则销售更大的集成架构，加入雷达、30mm 火炮、火箭、Coyote 导弹、激光和 FAAD C2。Dedrone 和 DroneShield 在杀伤链上离 Bullfrog 更远：它们提供空域态势感知、C2
              和处置能力，但公开页面没有描述与 Bullfrog 对应的近距自主炮站。Shield AI
              更远；审阅页面讨论的是自主能力中间件，而不是反无人机硬件。由此形成的能力图景是：当买方希望在轻量级宿主平台上实现自主动能击毁时，ACS 最强；当任务扩展到蜂群、固定地点覆盖或多效应器集成时，替代方案会更有吸引力。
