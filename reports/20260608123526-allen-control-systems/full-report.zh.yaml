  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与出口管制风险
        blocks:
          - type: paragraph
            body: >-
              Allen Control Systems 卖的不是另一座炮塔，而是把自主武器站卖进一个已有明确设计、培训、审查和对外披露要求的政策领域。DoD Directive 3000.09
              要求自主武器系统在规模化前具备适当的人类判断、透明的操作员界面、培训和验证；而 ACS 自己的产品页称，Bullfrog
              会在操作员下令开火前自主探测、跟踪、识别并捕获目标。也就是说，只靠快速部署不够。任何负面测试事件、政策重新解读，或围绕目标区分能力提出更多证据要求，都可能拖慢采购，即使需求仍然紧迫。


              美国本土授权也是实打实的边界。CRS 表示，DoD 针对受保护设施和资产的反无人机权限仍是法定、限定范围且有期限的授权，除非国会延长部分条款，否则到 2026 年底到期。2026 年 2 月本土安全事实清单
              扩大了指挥官在围栏线外的灵活性，但并没有把反无人机行动变成全国通用授权。DOJ 和 DHS 材料也显示，本土使用分散在不同机构和法律框架中。ACS
              可以营销其对本土关键基础设施的适用性，但最直接可执行的客户群仍是军方和授权严格的政府用户。


              出口端有利有弊。ACS 已宣布对韩国和阿联酋销售，并在罗马尼亚推进本地联合生产，这有助于分散需求；但同一批交易也带来 ITAR、BIS
              许可、对外披露、最终用途、培训和保障执行风险。公开来源确认这些监管制度存在，却没有披露 Bullfrog 的准确分类或审批路径。这种不透明很重要，因为出口许可时间可能直接变成收入确认时间。
