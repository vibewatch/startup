      - number: '5.2'
        title: 被动感知、火控与训练数据架构
        blocks:
          - type: paragraph
            body: >-
              ACS 最强的技术差异化，是把被动探测、自主火控和训练数据生成放进同一个技术栈。被动探测页面描述了电池供电的相机阵列、ACS
              或客户提供的光学设备，以及可嵌入更大系统且不发射雷达能量的自有库。火控页面加入了硬骨头：自研硬件和软件在电机扭矩、炮塔惯性等真实约束下，求解非线性多输入、多输出优化问题。训练数据页面随后闭环，解释 ACS
              如何用目标与非目标物体、天气、地形和真实标签搭建照片级合成场景，从而在不等待高成本实采的情况下刷新卷积模型。这个架构值得注意，因为它让 Bullfrog
              更像一个自主感知与控制产品，而不只是枪架。公开材料还称火控模块可以从 Bullfrog 拆出，这支持了一个判断：ACS 围绕通用武器搭建的是可复用自主能力中间件，而不是单一固定设备。
