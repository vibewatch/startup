      - number: '4.5'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              财务结论在需求形成上强于在投资测算可行性上。ACS 拥有一套可信的国防硬件收入架构：Bullfrog
              系统销售打开入口，培训、保障、拆分火控、被动探测和训练数据服务则可能创造更高质量的后续收入。公司也已筹到足够的已披露股权，足以支持一次真正的制造扩张。这组条件足以说明 ACS
              不是科学项目，也不明显是在部署前夕缺资本。但它不足以证明公司已经拥有耐久的收入质量，或短期内有通向有吸引力毛利率的路径。


              阻塞项明确且重大。公开来源没有披露收入、ARR、毛利率、烧钱速度、现金、现金跑道、大多数已宣布项目的合同金额、已实现的 Bullfrog
              ASP、折扣，或系统级单位经济。这些缺口意味着投资人还无法区分偏原型的收入和规模化生产收入，也无法测试支持和软件是否真的以有吸引力的利润率附着。反向政策背景也重要：HRW 对放松自主武器保障的批评表明，ACS
              将在一个公共政策争议可能快速变化的类别中经营。因此，正确的尽调姿态，是把 ACS 视为一家客户兴趣明确、融资动能强的公司；但在管理层打开收入质量、毛利率结构和资本消耗的数据室之前，财务投资测算仍被阻塞。
