      - number: '4.2'
        title: 定价代理与单位经济驱动因素
        blocks:
          - type: paragraph
            body: >-
              ACS 不公布 Bullfrog 标价、折扣表或已实现合同价格，因此公开财务图景只能依赖定价代理。最强的公开代理，是公司反复声称 Bullfrog
              可使用现有服役通用武器和弹药，而不是稀缺拦截器，将单次击杀成本降至低至 $10。产品页还强调兼容常见 C2
              系统和熟悉的武器平台，这通过暗示已拥有这些武器的客户集成负担更低，进一步强化了可负担性叙事。Project Convergence 又提供两个采用代理：据称超过 40 名士兵在不到 30
              分钟内完成资格认证，系统从存放状态到就绪不到 2 分钟。


              这些代理方向上有用，但不完整。它们说明了一些关于单次交战可变成本、部署时间和训练摩擦的信息，却几乎没有回答决定毛利率的更高风险财务问题：炮塔、传感器栈和控制系统的物料清单；每个平台的安装成本；现场服务负担；备件；实战中的弹药消耗；以及任何附着软件或数据服务的成本。GTM
              效率也有同样缺口。公开材料没有披露 CAC、销售周期、投标胜率或回本情况。因此，正确的投资测算观点是：ACS 在战场上有可信的可负担性故事，但还没有面向投资人的公开单位经济故事。
