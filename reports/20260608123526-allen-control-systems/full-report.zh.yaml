      - number: '3.4'
        title: 护城河耐久度、切换成本与反向证据
        blocks:
          - type: paragraph
            body: >-
              ACS 的护城河可信，但有边界。公开证据中最耐久的元素，是其控制软件、被动感知积累，以及把自主精确能力安装到军队已列装武器上的能力。低 SWaP 动能防御比全栈防空架构更重要时，Bullfrog
              因此拿到一个楔形市场。帮助 ACS 进入分层系统的开放架构姿态，也会削弱切换成本：兼容 ATAK、FAAD C2 和 Lattice 意味着 Bullfrog
              能插入更宽的技术栈，但也意味着买方可以在不同传感器、控制层和效应器之间多宿主。反向证据在这里重要。War Quants 强调 AI
              机枪面临信任、目标识别、火线几何和友军误伤问题，这些都可能收窄可用交战规则。分销风险也真实：主承包商可以围绕同一任务打包传感器、导弹、雷达和车辆集成，中标后再用服务能力压过 ACS。总体看，ACS
              在近距自主动能击毁上有差异化的细分护城河，但在分层反无人机采购中没有赢家通吃护城河。
