      - number: '8.3'
        title: 牛市、基准与熊市情景区间
        blocks:
          - type: paragraph
            body: >-
              由于 ACS 不披露收入或毛利率，这里的情景模型刻意保持简单。它以最新融资估值为锚，再根据哪些证据必须显性化才能让估值继续复利来调整。牛市情景假设 ACS
              把早期陆军和盟友牵引转化为重复项目，展示制造吞吐能力，扩大可见合同规模，并证明低成本、子弹式 反无人机论点能在出口管制下走向国际市场。在这组假设下，当前估值可以增长到 $2B 高位区间或 $3B
              低位区间，而不需要 Anduril 式平台广度。


              基准情景让 ACS 大致停在当前轮附近。这是今天最站得住脚的公开证据姿态：类别需求仍强，ACS
              继续赢得演示和小合同，但公司仍没有披露足够经济性来支撑明显更高价格。熊市情景不是公司失败，而是估值重置。如果采购仍像试点，如果自主政策反弹拖慢部署，如果出口耗时长于预期，或如果更宽防务科技估值倍数压缩，公开记录会支持一个明显低于
              $2.2B 的标记。换句话说，区间更多由证据质量和商业化可见度驱动，而不是由大市场热度驱动。
