      - number: '8.2'
        title: 可比集、承销语境与为何公开证据折价仍在
        blocks:
          - type: paragraph
            body: >-
              对 ACS 做有纪律的估值，需要把私营防务科技融资轮和运营证据混在一起看，而不是在收入未披露时假装存在收入倍数。最干净的可比公司参照不是 Anduril，而是 2025–2026
              年反无人机和自主系统公司群：当一家公司能指向差异化任务集、公开合同或清晰系统优势时，投资者愿意付多少钱。Saronic、Shield AI、Epirus、DroneShield 和 Dedrone
              有用，因为它们各自代表不同证据栈：资本加制造、资本加项目催化、定向能硬件、公开纯业务收入，以及软件 / C2 集成。


              相对这组公司，ACS 在公开证据上可信但偏贵。公司绝对估值远低于 Anduril、Shield AI 和 Saronic，这让最新轮在火热防务市场中不至于显得荒谬。但 Saronic 的估值配有已披露的
              $392M 海军生产合同和 1,300 多名员工，Shield AI 的跳升配有标志性美国空军催化因素，Epirus 能指向更大规模陆军微波合同，DroneShield 已发布九位数收入。ACS
              有产品证据和真实客户拉力，但披露质量还没达到同行水平。因此，可比集支持的是“严肃看待”，不是干净的公允价值结论。
