  - id: TE001
    title: Bullfrog 模块 / SKU 矩阵
    columns:
      - 模块 / SKU
      - 主要工作流
      - 公开成熟度
      - 关键规格或能力
      - 差异化
      - 主要尽调缺口
    rows:
      - - Bullfrog M240C
        - 面向单个平台的点防御，针对 Group 1-3 UAS、FPV 和蜂群
        - 公开信息最强配置
        - 7.62x51 mm，800 m 点目标射程，850 rpm，~300 lbs，<1 MOA
        - 最便宜、路径最清晰的军种通用武器方案
        - 需要独立命中率、误报和外场可靠性数据
      - - Bullfrog M2
        - 面向车辆、舰艇、编队和固定场址的高级防御
        - 已公开营销的配置
        - .50 cal / 12.7 mm，1500 m 点目标射程，600 rpm
        - 在沿用通用武器路径的同时，比 M240C 打得更远
        - 需要证明产品页声称之外的实战部署
      - - Bullfrog M230
        - 车队和战术编队防御，针对更大型无人机
        - 路线图 / 未来开发状态
        - NATO 30x113 mm，宣传射程 800-1500 m
        - 面向更大型空中目标的更重效应器
        - 虽有专门页面，首页仍标注为未来开发
      - - Bullfrog M134
        - 车队和近距蜂群防御，循环射速极高
        - 已公开营销的配置
        - 7.62x51 mm，2000-6000 rpm，800 m 点目标射程
        - 面向密集近距突袭的最高射速动能选项
        - 需要后坐力、弹药负担和持续使用证据
      - - 被动无人机探测
        - 开火决策前的被动搜索和早期预警
        - 已上线能力页面，模块化服务界面
        - 电池供电摄像头阵列，可用 ACS 或客户光电设备
        - 无雷达探测可保持隐蔽，并嵌入更大的防御栈
        - 缺少公开传感器距离、天气表现和误报数据
      - - 自主火控套件
        - 面向遥控武器站的瞄准、跟踪和射击解算
