      - number: '7.3'
        title: 制造、竞争与执行风险
        blocks:
          - type: paragraph
            body: >-
              Series B 资金和扩大的 Austin 制造足迹给 ACS 更多规模化余地，但公开证据仍缺少投资者真正需要的运营指标：产能、积压订单、良率、已安装工装、服务人员数量和维修周期数据。这个缺口很关键，因为
              ACS 正在扩张一个产品族，里面有多种武器变体、不同射程、多平台集成、海外支持义务，并宣称兼容主要第三方 C2 系统。复杂度上升得比公开制造透明度更快。


              竞争压力进一步加重执行负担。Robotics Press 和 RNG 都描述了这样一个市场：胜出的供应商要么掌握 C2 层，要么能干净接入
              C2；主承包商和专业厂商提供的是分层方案，而不是单一用途点防御。Dedrone 和 DroneShield 可以在探测和 C2 层拿走预算。Raytheon 和 Leonardo DRS
              具备主承包商规模和多效应器组合。Epirus 营销的是微波经济性和醒目的饱和攻击表现。即使 Bullfrog 在近程动能防御上保持差异化，采购官仍可选择更宽的架构，让 ACS 只做子系统，甚至完全出局。


              国际扩张把门槛再抬高一层。韩国、阿联酋和罗马尼亚意味着的不只是制造需求，还包括培训、技术协助、保障、文档和潜在本地工业支持。这些义务写进新闻稿很容易，要用稳定质量工业化交付则难得多。
