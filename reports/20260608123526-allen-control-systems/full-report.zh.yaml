      - number: '8.4'
        title: 建议、反论点与为高价买入设置的尽调门槛
        blocks:
          - type: paragraph
            body: >-
              ACS 的正向论点很直接：公司切入一个真实军事痛点，产品看起来具备作战相关性，单次拦截成本低于导弹式防空，并且契合当前分层 反无人机架构的推动方向。反向论点 也同样直接：公开证据仍落后于价格。最新一轮假设 ACS
              能超越演示和孤立奖项，进入重复采购和制造规模；但公开记录没有显示收入质量、客户集中度或单位经济性。围绕自主武器采用的人权批评、不断演变的指挥官权限以及出口许可摩擦，如果拖慢采用，都会对估值倍数构成实际压力。


              上述组合给出跟踪建议、中等信心、高风险和估值偏拉伸的立场。ACS
              值得投资人密切跟踪，但按公开证据无法在当前估值下承销。若要从跟踪上调，公司需要更便宜的入场价格，或在收入、重复订单、毛利率、出口管线和股权结构条款上给出明显更好披露。一旦这些证据点出现，牛市情景才可信。若没有，当前轮最好理解为针对类别紧迫性支付的溢价风险投资期权，而不是已由披露经济性挣来的估值。
