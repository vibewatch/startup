        - 要求披露积压订单滚动表和项目转化漏斗
      - - 实际 ASP 和折扣
        - 类标价代理指标不足以检验定价权或利润率韧性
        - 要求按 SKU 和客户类别披露发票级 ASP
      - - 支持附加率和持续保障利润率
        - 经常性服务质量比亮眼的系统中标更重要
        - 要求按队列披露支持附加、续约率和服务毛利率
