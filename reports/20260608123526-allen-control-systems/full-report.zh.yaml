  - id: TV005
    title: 投资逻辑破裂与终止触发表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 未见合同放量
        - 到下一轮融资时，公开渠道仍看不到复购订单或更大项目证据
        - 叙事从已部署产品滑向长期试点
        - 下调为回避，或要求大幅更低价格
      - - 自主武器反弹或规则收紧
        - 政策变化显著限制自主动能打击使用
        - TAM 和实战效用假设走弱
        - 下调乐观和基准情景
      - - 出口与盟友管线停滞
        - 许可和审批拖慢，国际合同无法转化
        - 制造放量逻辑失去关键需求支柱
        - 估值重估向基准或悲观情景靠拢
      - - 板块倍数重置
        - 同行融资估值下修，或上市 C-UAS 倍数大幅压缩
        - 支撑高溢价入场的叙事消失
        - 将估值立场从偏高调向昂贵
    notes: 每个触发项都应能在更新时监测，并直接映射到估值逻辑，而不是泛泛的执行担忧。
    claimRefs:
      - CV022
      - CV023
      - CV025
      - CV035
      - CV046
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入与积压订单
        - 当前年化收入、积压订单和复购订单画像
        - 用于检验 Series B 定价是否有运营规模支撑
        - 向管理层尽调索取，并审查合同排期
      - - 毛利率与单次击杀成本经济性
        - 按部署类型拆分的单位经济性，以及制造毛利率桥接
        - 用于判断子弹经济性是否能放大为公司经济性
        - 财务尽调加生产流程走查
      - - 客户集中度
        - 具名客户组合、合同期限和续约集中度
        - 判断当前叙事是否由少数试点买家主导
        - 管线审查和客户访谈
      - - 股权结构表与条款
        - 优先股堆叠、清算权利，以及任何反稀释棘轮或优先级条款
        - 判断名义 $2.2B 标记对新投资人是否经济上干净
        - 法律尽调和融资文件
    notes: 这些问题聚焦会改变投资建议的证据，而不是其他章节已经覆盖的一般公司画像问题。
    claimRefs:
      - CV037
      - CV041
      - CV042
      - CV045
