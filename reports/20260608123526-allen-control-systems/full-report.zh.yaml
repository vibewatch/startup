  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 最新标记及 $2.2B 价格反映了什么
        blocks:
          - type: paragraph
            body: >-
              Allen Control Systems 最新可支撑估值锚点是 2026 年 6 月 5 日的 Series B：融资 $200M，投后估值 $2.2B，意味着投前约 $2.0B。相比 2024 年 4 月
              $12M 种子轮和 2025 年 3 月 $30M Series A，这是一次陡峭跳升。仅按已披露轮次计算，ACS 已累计融资约
              $242M。这个速度很重要，因为投资者承销的已不再是概念阶段机器人初创公司，而是一家公司能否从有前景的演示，走向规模化制造、重复军事部署和相邻产品扩张。


              公开证据支撑了这套故事的一部分。ACS 展示了真实产品进展：xTechOverwatch 认可、一个与 SBIR 相关的 $2M 奖项、Project Convergence
              中击杀蜂群，以及官方声称已在美国陆军、美国海军和盟友用户中部署。但同一公开记录仍没有披露收入、积压订单、毛利率、客户数或股权结构条款。USAspending
              显示有真实联邦活动，但可见义务数据只有几百万美元。因此，当前价格不像是对已披露经济性的估值，更像是一笔风险投资押注：低成本动能 反无人机系统能在大型既有厂商、定向能同行和软件优先 C2
              厂商锁住市场前，成长为规模化项目类别。
