      - number: '2.3'
        title: 规模测算视角：相互矛盾的公开 TAM，加上采购和资产保护需求
        blocks:
          - type: paragraph
            body: >-
              公开市场规模证据方向上有用，但内部并不一致。Fortune Business Insights 把 2025 年反无人机市场估为 $11.60 billion，The Business Research
              Company 估为 $3.21 billion，Market Research Future 估为大约 $2.01
              billion。差距太大，不能随便取平均，而且这些报告显然没有使用同一个市场边界。有些包含陆、空、海系统中的硬件、软件和服务；有些强调防务和基础设施保护；有些似乎捕捉的是比 ACS
              能直接触达的市场更宽的分层防御栈。正确结论不是哪一个数字正确，而是 ACS 所在市场增长很快，但公开定义并不稳定。


              对投资测算来说，邻近规模视角比拼一个合成 TAM 更有用。仅美国陆军就在 FY2027 为 IFPC Increment 2 申请 $1.6 billion，DHS 也披露了 $115 million
              的近期活动安保支出、一个 $1.5 billion 合同工具，以及与 FIFA 2026 相关的 $250 million 拨款。这些不是 Bullfrog 收入，但是真实预算池，并且直接绑定 ACS
              应对的威胁类别。因此，本章把全球市场报告作为划定边界的视角，把美国采购作为更扎实的需求视角，把受保护资产类别——基地、舰船、编队、变电站和固定地点——作为推演 SAM/SOM 最实用的桥。没有保留的公开来源为
              ACS 单独拆出干净的自主武器站 TAM，这个缺口应继续明确写出。
