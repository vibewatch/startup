        - 车辆、海上和固定点武器所有者
        - 重要邻近市场，因为 ACS 称其火控可以解耦销售
      - - 关键基础设施保护
        - 保护变电站、港口、船舶和固定点免受无人机威胁
        - 没有无人机任务的通用实体安防支出
        - 设施所有者、公共安全合作方，或视授权而定的联邦操作方
        - 威胁拉力大，但授权摩擦更高的次级市场
      - - 分层集成项目
        - 由传感器、C2、电子战、定向能和动能效应器组合而成的体系化系统
        - 从不接入作战工作流的单组件采购
        - 防务主承包商或集成商常组装并销售这些栈
        - 定义 ACS 必须集成、而非主导每一层的竞争语境
    notes: ACS 位于更宽反无人机市场之内，但销售的是更窄的自主武器站切入口。纳入和排除类别来自保留的市场定义、ACS 产品页和竞争对手定位。
