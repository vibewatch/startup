      - number: '4.3'
        title: 公开牵引与收入质量信号
        blocks:
          - type: paragraph
            body: >-
              牵引真实到足以让分析越过纯概念阶段，但仍主要是项目制，而不是年金式。ACS 称 Bullfrog 已部署在美国陆军和美国海军，Tectonic 报道 2025 年 3
              月完成首个官方客户发货，公司随后又叠加了多个采购式信号：赢得 xTechOverwatch，并获得 $2 million DP2 SBIR 奖项；拿到 Army Applications Lab
              集成合同；拿到海上 SOF 集成合同；并宣布韩国和 UAE 合同。这个顺序很像国防科技商业化阶梯：演示、奖项或原型资金、集成工作，然后进入实地部署。


              收入质量比牵引质量更难判断。部分公开美元数今天可以计数，但更大的合同在金额、期限、付款里程碑，以及究竟是原型、试点还是规模化生产授标上仍不透明。采购环境也很关键。DoD 自主能力政策和 CRS
              材料显示，自主武器系统在部署前需要测试、验证和人类判断控制；这正是会拉长国防销售周期、延后收入确认的流程。因此，ACS
              已经形成可信需求，但公开记录仍没有显示这些需求是否已变成可重复生产收入、经常性支持收入，还是只是一串按里程碑资助的试点。
