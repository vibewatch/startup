        - 要求按 SKU 披露 BOM、人工、运费、安装、现场服务和保修假设
      - - 现金余额和烧钱速度
        - 没有这些数据就无法建立偿付能力或现金跑道模型
        - 要求披露当前资产负债表和过去十二个月现金消耗桥
      - - 管理层计划下的现金跑道
        - 决定下一轮融资紧迫性和谈判筹码
        - 要求披露董事会批准的预算，以及基准、乐观、悲观现金跑道情景
      - - JIATF 401 / SOF / 韩国 / 阿联酋 / 罗马尼亚合同金额
        - 经济性不透明，挡住收入预测和客户集中度分析
        - 要求披露已签合同、付款里程碑、期权和范围文件
