      - number: '1.3'
        title: 融资历史、投资人财团与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              ACS 在两年多一点的时间里，从种子期国防初创公司变成后期风投支持的平台。按轮次看，公开披露的融资很清楚：2024 年 4 月 $12 million 种子轮，2025 年 3 月 $30 million
              Series A，2026 年 6 月以 $2.2 billion 投后估值完成 $200 million Series B。已披露总额为 $242 million。Craft Ventures
              是最清晰的重复机构投资人，领投种子轮和 Series A，并继续参与 Series B。Rally Ventures、Forum Ventures 以及后来的 Inspired Capital
              也多轮出现，Smash Capital 则在 Series B 阶段作为领投方进入。


              同样重要的是公开视野里的空白。已审阅来源没有披露持股比例、董事席位分配、清算优先权、老股交易，也没有披露叠加在股权结构表上的任何债务或授信安排。因此，利益相关方图谱在投资人财团层面可读，但在控制权层面不可读。尽调近期应索取当前股权结构表、创始人持股拆分、Smash
              领投 Series B 后的治理权利，以及早期投资人是否已经出售股份或转换成不同权利结构。
