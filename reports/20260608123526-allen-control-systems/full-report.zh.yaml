  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 影响
      - 精确尽调路径
    rows:
      - - 收入
        - 没有已确认收入，市场无法区分试点和规模化量产业务
        - 要求按项目、客户和收入确认类别披露月度、季度收入
      - - 年经常性收入（ARR）/ 经常性软件与支持收入
