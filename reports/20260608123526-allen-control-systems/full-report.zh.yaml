      - number: '1.5'
        title: 里程碑、政策环境与反向背景
        blocks:
          - type: paragraph
            body: >-
              后续章节的标准时间线从 2022 年创立开始，随后是 2024 年 4 月种子轮；这轮融资把 ACS 描述为一家由海军老兵和此前软件退出经历催生的反无人机机器人公司。接下来的关键拐点包括 2024 年 9 月
              TREX 演示、2025 年初进入 Fort Sill 和 Huntsville、2025 年 3 月下旬 Series A 以及 Mike Wior 公开接任 CEO、2025 年 9-12 月密集出现的
              SOF、盟友和陆军车辆集成合同，以及 2026 年 2 月赢得 xTechOverwatch。2026 年 6 月 Series B 和创新实验室启动，标志公司叙事从有前景的国防初创公司转向激进扩产故事。


              反向因素不是产品失败事件，而是政策与伦理问题。DoD Directive 3000.09 仍要求自主和半自主武器系统在使用武力时保留适当的人类判断，ACS 的行业媒体报道也强调开火前需要人类批准。即便如此，War
              Quants 仍把信任称为 AI 机枪部署的限制因素，Human Rights Watch 则认为美国政策正在滑向完全自主杀伤。也就是说，ACS
              的机会来自同一个自主武器政策环境；这个环境也会持续把公司置于控制、问责和交战规则合规的审查之下。
