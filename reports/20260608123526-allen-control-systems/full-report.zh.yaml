      - number: '3.3'
        title: 定价、合同模式与分销能力
        blocks:
          - type: paragraph
            body: >-
              整个样本的公开定价透明度都很弱。ACS 销售的是任务经济性叙事，称单次击杀成本低至 $10，但没有给出标价。已审阅语料中，Epirus、Dedrone、DroneShield、RTX、Leonardo DRS 和
              Shield AI 也一样：官方页面描述能力和部署模式，而不是商业价目表。少数公开数字是合同或资本信号。ACS 披露过 $2 million 的 xTech SBIR 奖项、$1.5 million 的 Army
              Applications Laboratory 集成合同以及最多 $4.5 million 的期权，审阅的 USAspending 收款方页面还显示约 $3.55
              million。这些数值有助于证明牵引，但不能揭示交付系统价格或全生命周期经济性。更大的战略问题是分销能力。Leonardo DRS 和 RTX 通过现有防务项目和平台关系销售。Anduril 和 Shield
              AI 的资本基础远大于 ACS。ACS 与陆军和盟友客户已有有意义的牵引，但公司仍必须搭建培训、现场支持和区域保障能力，而这些是既有企业已经拥有的东西。
