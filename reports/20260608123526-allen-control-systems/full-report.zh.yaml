      - number: '1.4'
        title: 政府牵引、实地验证信号与披露边界
        blocks:
          - type: paragraph
            body: >-
              ACS 最强的公开牵引信号来自军方，而不是商业客户。到 2026 年 6 月，公司称 Bullfrog 已部署在美国陆军和美国海军，赢得陆军 xTechOverwatch 竞赛，拿到海上 SOF
              合同，并新增韩国、UAE 合同以及罗马尼亚联合生产备忘录。Army Applications Lab 合同和 USAspending 收款方档案也表明，ACS
              并非只停留在演示模式；联邦授标活动可见，并且有路径进入陆军车辆平台的集成工作。TREX 24-2、JCO 演示以及后续分析的独立行业报道进一步说明，ACS 多次把 Bullfrog 放到政府评估者面前。


              但在投资测算最需要的数字上，披露仍然很薄。已审阅材料中没有公开收入、年经常性收入（ARR）、客户数或部署单元数。员工数同样不透明：Rally Ventures 档案仍显示 11-50
              人的小公司区间，作为外部档案痕迹有参考价值，但还不足以当作当前运营指标。结果是，ACS 相对成立时间展现出异常强的战场采用信号，但从财务尽调角度看，仍是一家披露口径偏私有、关键数据未公开的公司。
