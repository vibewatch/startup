      - - 使用通用弹药降低单次击杀成本
        - 在固定点位蜂群防御中，定向能或干扰方案凭一对多经济性取胜
        - 中
        - 在加固无人机或移动载体削弱纯 RF 或 HPM 替代方案时，ACS 最强
        - 按威胁类型、载体平台和电力可用性比较完整任务经济性
      - - 被动探测加低 SWaP 部署
