      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              核心增长驱动是战场经济学。ACS、WarQuants 和多个市场来源都描述了同一个世界：廉价无人机或蜂群会迫使防御方做荒唐的成本交换，尤其当反制手段依赖导弹或复杂拦截器时。Bullfrog
              的卖点——通用服役武器、低 SWaP、低单次击杀成本、兼容现有 C2——就是围绕纠正这个比例而搭建。第二个驱动因素是采购紧迫性。xTech、TREX、JCO 演示、IFPC 支出和 DHS
              活动安保资金都表明，买方愿意为能快速从演示走向部署的系统付费。定向能也在抬高门槛：如果 HPM 和激光厂商能承诺以几美分完成击杀或降低附带损害，买方会越来越要求分层架构，而不是单一功能方案。


              主要约束不是需求不足，而是部署摩擦。DoD
              自主能力政策要求人类判断、验证和测试。本土政策正在扩张，但真实使用仍取决于指挥官裁量、特定地点流程，以及对空域的法律权限。私营基础设施业主可能清楚看到威胁，却仍缺少独立干扰、欺骗或动能击毁无人机的权限。出口管制又加了一道门槛，因为盟友兴趣必须通过许可和保密等级流程。竞争压力同样真实：Dedrone
              和 DroneShield 占据感知 / C2 与分层软件端，Leonardo DRS 封装主承包商牵头的完整集成系统，Epirus 则用定向能打蜂群。ACS
              因此面对的是活市场，但它必须比大型既有企业更快嵌入分层架构并穿过治理流程。
