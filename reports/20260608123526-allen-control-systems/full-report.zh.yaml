        - 平台、软件和大型项目合同；资本规模通过融资报道披露
        - 自主与 C2 可打包进更广项目，不披露单系统经济性
        - 即便 Bullfrog 在战术上差异化，ACS 仍可能被项目层侧翼包抄
      - - 现状 / 内部自建
        - 常隐藏在既有车辆、基地防御或集成商预算内
        - 走升级路径，而不是新增独立科目
        - 买方可能先延展既有遥控武器站，再购买新的细分系统
        - ACS 必须证明，相比增量升级，它集成阻力更小、自主性能更好
  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    notes: 严重性反映对 ACS 公开竞争态势的可能影响，不是经概率调整后的财务模型。
