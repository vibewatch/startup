      - number: '5.4'
        title: 差异化、治理与尽调风险
        blocks:
          - type: paragraph
            body: >-
              相比同业，ACS 的差异化来自用通用机枪实现低 SWaP
              动能点防御，而不是来自主导大部分反无人机营销的传感器优先或定向能架构。当廉价无人机耗尽昂贵拦截器，或变得更难干扰时，这个定位有吸引力；但它也提出更尖锐的信任和治理问题，因为最终效应器是致命的。DoD
              Directive 3000.09 围绕人类判断、验证与确认、网络安全、可审计数据源和可理解的人机界面设定了清晰门槛。ACS 的公开姿态部分贴合这条门槛：公司称 Bullfrog
              只有收到操作员命令才会开火，外部报道也描述了 human-in-the-loop 或 human-on-the-loop 模式。缺失项和已有项一样重要。已获取材料没有公布认证披露、出口分类、正式 V&V
              资料、误报或友军误伤控制，也没有保障质量数据。War Quants 明确认为信任是 AI 机枪的最大限制因素，Human Rights Watch 则强调完全自主杀伤的更广泛问责风险。这并不推翻 Bullfrog
              的概念，但意味着在把系统视为已降风险之前，尽调必须更深入地审查使用规则、友方无人机识别、人工接管逻辑和保证证据。
