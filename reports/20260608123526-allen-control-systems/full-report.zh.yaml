  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与确认形态
        blocks:
          - type: paragraph
            body: >-
              ACS 的公开商业口径比单一 Bullfrog 炮塔 SKU 更宽，尽管管理层在多数公告里仍以武器站为主轴。官方能力页面展示了三个可变现层，可以与 Bullfrog 销售并列或嵌在其下：被动无人机探测、可从
              Bullfrog
              拆出并嵌入其他遥控武器站的自主火控栈，以及以管家式服务形式出售的合成训练数据生成。国际合同新闻稿又加入第四层，明确把操作员培训、技术协助和保障与系统交付打包。这一点重要，因为财务模型很可能是大额不均匀硬件收入，加上依赖附着率的服务或软件收入，而不是纯硬件业务。


              公开证据仍太薄，无法量化收入组合。ACS 没有披露各项能力多常单独销售、被动探测或训练数据是否已在 Bullfrog
              项目之外变现，也没有披露已宣布国际工作中支持服务与硬件各占多少。但方向已经足够清楚，可以作为投资测算的路径：硬件是矛头，支持、软件 /
              控制和数据服务才是通往更清晰经常性收入层的道路。收入确认可能混合采用系统出货或验收里程碑，以及培训、保障和集成工作的按时间确认；这比一份直接的经常性 SaaS 合同更复杂，收入质量也更难读。
