              部署证据强于文档表面。官方产品页称 Bullfrog 可接入 ATAK、FAAD C2 和 Lattice 等常见指挥控制栈；二手报道补充了基于 Linux
              的软件、双向目标航迹交换，以及自主和半自主两种操作模式。公开演示展示了 ACS
              希望买方信任的操作流：被动探测、分类、跟踪、计算射击方案、请求或保留人类释放权限，然后用服役通用武器交战。成熟度信号来自纯营销文案之外。Tectonic 把 Bullfrog
