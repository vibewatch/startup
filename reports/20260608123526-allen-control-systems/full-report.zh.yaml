            body: >
              最强的具名客户证据来自美国陆军，因为证据链同时覆盖陆军自有来源、公司公告和后续合同。美国海军也被列为已部署用户，但只出现在 ACS 自己的 Series B 公告里，因此证据质量明显低于陆军。海上 SOF
              合同是一个强参考客户，因为它意味着 ACS 被作战要求很高的用户群选中；但已披露范围仍是平台集成，不是舰队级部署。2025 年 11 月，ACS
              宣布与韩国武装部队和阿联酋武装部队签约，内容包括支持、操作员培训、技术协助和保障，盟友客户证据明显增强。这套表述更像真实客户证据，而不是奖项或实验室演示。即便如此，几乎每个具名条目仍有限制条件：公开成效稀薄、交付时间未披露，且只有陆军留下不止一个独立公开线索。因此，本章把陆军证据视为最强，盟友证据视为真实但范围窄，海军证据偏薄，SOF
