          detail: 主承包商和定向能厂商争夺同一预算池
        - id: conversion
          label: 项目转化风险
          detail: 试点和演示未必会变成重复采购线
        - id: support
          label: 支持负担
          detail: 制造、集成、培训和保障扩张
        - id: revenue
          label: 收入节奏风险
          detail: 交付和重复授标节奏可能后移
        - id: valuation
          label: 估值压缩
          detail: 如果收入转化滞后，增长叙事会变弱
      edges:
        - from: policy
          to: conversion
          label: 可能拖延部署审批
        - from: export
          to: revenue
          label: 可能推迟国际交付
        - from: army_budget
          to: conversion
          label: 集中预算科目风险
        - from: field_data
          to: conversion
          label: 削弱买方信心
        - from: competition
          to: conversion
          label: 将授标导向其他架构
        - from: support
          to: revenue
          label: 约束扩张和服务质量
        - from: conversion
          to: revenue
          label: 重复采购放慢
        - from: revenue
