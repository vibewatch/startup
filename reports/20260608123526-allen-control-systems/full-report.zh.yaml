  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与竞争者类别
        blocks:
          - type: paragraph
            body: >-
              ACS 并不在一个干净的单一产品市场里竞争。Bullfrog 定位为狭窄但差异化的自主动能武器站，而大多数采购替代方案落在邻近或替代层：Epirus Leonidas 和 RTX Phaser
              等定向能系统；Dedrone 和 DroneShield 等探测、C2 和干扰栈；Anduril 和 Shield AI 等自主能力和 C2 主承包商；以及 Leonardo DRS 等公司提供的车载集成
              C-UAS 架构。Robotics Press 的市场评论在这里有用，因为它把反无人机市场描述为分层市场，没有单一供应商同时统治探测和击毁。这个结构对 ACS
              很重要：公开材料中几乎没有浮现出一比一的自主炮塔同类公司，因此 Bullfrog
              的实际竞争主要是功能性的，而不是类别性的。买方可以通过升级遥控武器站维持现状，也可以购买包含传感器、软件和多种效应器的更宽分层系统。因此，当采购问题是为车辆、舰艇、编队或固定地点提供近距、低成本、动能防护时，ACS
              才最容易赢；当买方希望由一个主承包商掌控整个防空栈时，则不是 ACS 的最佳场景。
