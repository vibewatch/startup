  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: ACS 不只依赖自身硬件路线图，还依赖买方、监管方、C2 栈所有者和主承包商主导的架构。
    data:
      nodes:
        - id: acs
          label: Allen Control Systems
          detail: 自主式动能反无人机供应商
        - id: army
          label: 美国陆军 / DoD
          detail: 主要可见国内买方和预算所有者
        - id: allies
          label: 盟友武装力量
          detail: 韩国、UAE 和罗马尼亚路径
        - id: regulators
          label: DDTC / BIS / 对外披露审查方
          detail: 出口与转让审批
        - id: c2
          label: ATAK / FAAD C2 / Lattice 所有者
          detail: 架构与集成卡点
        - id: primes
          label: Raytheon / Leonardo / 其他主承包商
          detail: 将 C-UAS 打包进更大的防空体系
        - id: adjacent
          label: Dedrone / DroneShield / Epirus
          detail: 上游 C2、传感器和 DEW 替代方案
        - id: manufacturing
          label: Austin 制造 + 服务组织
          detail: 产能与保障执行
        - id: field_units
          label: 最终用户
          detail: 需要训练、信任和作战证据
      edges:
        - from: army
          to: acs
          label: 国内预算与采购
        - from: allies
          to: acs
          label: 国际需求
        - from: regulators
          to: allies
          label: 批准转让
        - from: c2
          to: acs
          label: 集成准入
        - from: primes
          to: army
          label: 争夺项目预算
        - from: adjacent
          to: army
          label: 争夺架构角色
        - from: manufacturing
          to: acs
          label: 建设与支持能力
        - from: acs
          to: field_units
          label: 训练与部署后表现
    claimRefs:
      - CR018
      - CR027
      - CR028
      - CR029
      - CR041
      - CR042
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 结论落在「观察」：品类和产品信号很强，但以当前价格看，巨大披露缺口抵消了这些优势。
    data:
      nodes:
        - id: market
          label: 市场需求
          detail: 防务和本土安全任务中的 C-UAS 需求都在上升。
          tone: positive
        - id: product
          label: 产品证明
          detail: ACS 有真实演示和授标证据，不只是概念页。
          tone: positive
        - id: price
          label: 价格
          detail: $2.2B 投后估值隐含的规模预期，远高于当前公开经济数据能支撑的水平。
          tone: warning
        - id: risk
          label: 风险
          detail: 自主性政策、出口和客户集中都可能压缩估值倍数。
          tone: warning
        - id: call
          label: 投资建议
          detail: 观察 / 中等信心 / 高风险 / 估值偏高
          tone: neutral
      edges:
        - from: market
          to: call
          label: 支持继续关注
        - from: product
          to: call
          label: 支撑严肃性
        - from: price
          to: call
          label: 阻止买入
        - from: risk
          to: call
          label: 迫使折价
    claimRefs:
      - CV017
      - CV011
      - CV013
      - CV041
      - CV043
      - CV044
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 当前估值最敏感的是经济转化证据，而不是更多演示新闻。
    data:
      items:
        - label: 未披露收入
          value: 20
        - label: 只有授标和演示
          value: 35
        - label: 可见重复订单
          value: 60
        - label: 实质性合同规模
          value: 80
        - label: 收入与利润率披露
          value: 100
    approximationNotes: 数值是方向性的估值支撑分数，不是倍数；它们说明披露和采购转化比新增叙事里程碑更重要。
    claimRefs:
      - CV013
      - CV014
      - CV030
      - CV033
      - CV035
      - CV037
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 以 2026 年 6 月 Series B 估值为中心的情景区间。
    data:
      items:
        - label: 乐观情景估值（USD B）
          low: 2.8
          mid: 3.2
          high: 3.6
          displayValue: $2.8B-$3.6B
          detail: 需要可见的重复项目、制造规模，以及部分出口转化。
          tone: positive
        - label: 基准情景估值（USD B）
          low: 1.6
          mid: 2
          high: 2.4
          displayValue: $1.6B-$2.4B
          detail: 假设需求保持，ACS 继续推进，但经济数据大多仍不公开。
          tone: neutral
        - label: 悲观情景估值（USD B）
          low: 0.8
          mid: 1
          high: 1.3
          displayValue: $0.8B-$1.3B
          detail: 假设采用仍停留在试点形态，板块估值倍数降温。
          tone: negative
        - label: 当前轮估值（USD B）
          low: 2.2
          mid: 2.2
          high: 2.2
          displayValue: $2.2B
          detail: 官方 Series B 投后估值。
          tone: neutral
    approximationNotes: 区间是基于可比融资、合同可见性和披露质量形成的克制估计，不是来自管理层预测。
    claimRefs:
      - CV003
      - CV038
      - CV039
      - CV040
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 截至 2026-06-08，对 ACS 的 IC 视角。
    data:
      items:
        - label: 市场机会
          value: 8 / 10
          status: verified
          note: 尽管 TAM 估计差异很大，反无人机需求是真实的。
          claimRefs:
            - CV017
            - CV019
        - label: 产品证明
          value: 7 / 10
          status: verified
          note: ACS 有演示、授标和早期部署信号。
          claimRefs:
            - CV009
            - CV010
            - CV011
            - CV015
        - label: 公开经济证明
          value: 3 / 10
