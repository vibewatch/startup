  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：更宽的 C-UAS，更窄的自主武器站楔形市场
        blocks:
          - type: paragraph
            body: >-
              Allen Control Systems
              首先应被定义为反无人机公司，其次才是遥控武器站公司。保留的行业来源给出的宽口径市场定义，覆盖在军事基地、机场、边境、港口、能源资产和公共活动中探测、跟踪、识别并压制无人机的系统。在这套技术栈里，ACS
              卖的不是独立雷达、干扰器或纯指挥控制屏。Bullfrog 是硬杀伤末端防御层：它把计算机视觉、AI 火控和现有武器配在一起，用来击毁 Group 1-3 UAS 的自主武器站。


              这个区别重要，因为大多数公开 C-UAS 总可用市场（TAM）数字描述的是更宽的系统之系统支出，并非 ACS 能直接吃下的市场。ACS 产品页强调兼容 ATAK、FAAD C2 和
              Lattice，说明公司设计思路是插入更大的防空技术栈，而不是替代它。遥控武器站邻近市场确实存在，尤其是 ACS
              称其火控栈可以拆出来用于其他武器站；但眼前的市场边界仍是为车辆、舰艇、编队和固定地点提供反无人机力量保护。实际的现状替代品包括干扰器、导弹、定向能系统、传统遥控武器站，以及用于点防御的人工操作机枪。
