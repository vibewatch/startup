      - number: '1.2'
        title: 创始人、领导层演进与治理信号
        blocks:
          - type: paragraph
            body: >-
              ACS 的创始人-市场匹配度异常直接。Simoni 和 Allen
              都曾任美国海军核工程师，也曾负责海军反应堆的仪表与控制；公司反复用这段背景解释，为什么团队敢把机器人、控制、机器学习和硬件可靠性揉进战场系统。Wior 则从 Omnivore 和早期 Bbot
              网络补上商业和运营侧能力。这个组合解释了 ACS 为什么能同时把自己讲成自主软件公司和可部署国防系统制造商。


              更实质的治理问题是头衔连续性。2024 年 4 月种子轮公告写明 Steven Simoni 是 CEO、Mike Wior 是 COO。2025 年 2 月和 3 月的官方发布，包括 Huntsville
              I2C 公告和聘用 Clay Armentrout 的消息，仍称 Simoni 为 CEO。6 天后，2025 年 3 月 26 日 Series A 新闻稿把 Mike Wior 列为 CEO；2026 年 6
              月 Series B 新闻稿和当前公司页面则显示稳定终局：Wior 任 CEO，Simoni 任总裁，Allen 任
              CTO。公开来源没有解释这次调整是董事会推动、预先计划，还是与扩张压力有关。因此，投资人应把领导层集中度和治理不透明，而不是创始人履历，视为第一章的核心人员风险。
