  - id: FE001
    title: Bullfrog 自主火控架构图
    type: stack
    layout: wide
    summary: Bullfrog 更适合被看作一套分层自主栈：被动光学器件把数据喂给感知模型，感知模型再驱动目标跟踪和控制逻辑，最后把建议交给 C2 与人工授权打击。
