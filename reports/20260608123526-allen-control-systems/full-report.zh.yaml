      - number: '7.4'
        title: 战场表现漂移与伦理风险
        blocks:
          - type: paragraph
            body: >-
              Bullfrog 最强公开证据仍来自实验和公司发布，而不是独立作战报道。这不等于产品失败；它意味着剩余最重要风险，是能否把受控演示转化成混乱、持续的野外使用。War Quants 认为 AI
              机枪使用取决于几何关系、火力界和作战条令。National Defense Magazine 提醒，乌克兰的许多空中接触目标其实是诱饵。Army Recognition
              引述分析师警告，没有单一能力能解决这个问题。合在一起看，这些来源暗示，即使演示结果亮眼，一旦目标集变化、杂波上升，或乘员在疲劳和受干扰通信下作业，表现也可能退化。


              ACS
              确有一个有意义的缓释点：最终开火仍由操作员下令。但这不是完整泄压阀，因为系统仍以自主探测、识别和捕获目标来营销。如果这些上游判断漂移，人类扣动扳机就会变成最后检查点，而不是完整独立的决策过程。分类错误、培训质量和问责仍卡在关键路径上。


              因此，伦理和声誉层应被视为与运营相关，而不是表面问题。Human Rights Watch 正明确警告完全自主杀伤和问责缺口。ACS
              在公开条令上或许永远不会跨过完全自主这条线，但已经足够接近这场争论；任何安全事件、政策反弹或媒体风波，都可能改变买方行为，尤其是在紧急战时采购之外。
