      - number: '2.2'
        title: 买方-用户-付款方图谱：陆军优先，但海军、SOCOM、盟友和关键基础设施同样重要
        blocks:
          - type: paragraph
            body: >-
              买方图谱由政府牵引，而不是由终端用户牵引。在陆军路径中，xTech、SBIR 管理方或项目办公室等采办或创新机构购买或资助评估；士兵和部队是操作者；陆军预算是付款方。xTechOverwatch
              流程很有说明力，因为它让公司从白皮书进入士兵评估，再进入 Direct-to-Phase-II
              原型资金，这与商业软件漏斗完全不同。海军和海上采用遵循同一结构，但作战用户从陆地编队转向舰船、海上部队或基地防御单元。


              SOCOM 似乎很重要，因为 ACS 公开提到过 SOCOM 相关合同，Tectonic
              也报道过海上特种作战集成路径，说明早期采用者重视可在船只、车辆和简陋地点快速部署的移动、平台无关系统。盟友军队是可信买方类别，因为 ACS 称 Bullfrog
              被美国和盟友军队选中，并且只面向美国及其伙伴销售。关键基础设施是次级但有意义的需求池：ACS 多次提到变电站和海事资产，而 DHS
              正在为本土使用场景搭建反无人机采购办公室。限制在于，民用运营方往往不能独立行使主动处置权限，因此基础设施销售可能会通过联邦集成商、公共安全伙伴或政府批准的响应模式落地，而不是直接由私营机构采购。
