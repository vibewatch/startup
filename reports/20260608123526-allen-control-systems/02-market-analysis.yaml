- id: sizing-lenses
  title: 'Sizing lenses: contradictory public TAMs plus procurement and asset-protection demand'
  body: |-
    Public market-sizing evidence is directionally useful but not internally consistent. Fortune Business Insights values counter-UAS at $11.60 billion in 2025, The Business Research Company values it at $3.21 billion, and Market Research Future values it at roughly $2.01 billion. The gap is too wide to average casually, and the reports clearly do not share the same market boundary. Some include hardware, software, and services across land, air, and naval systems; some emphasize defense and infrastructure protection; some appear to capture a broader layered-defense stack than ACS can reach directly. The right conclusion is not that one number is correct, but that ACS participates in a fast-growing market whose public definitions are unstable.

    For underwriting, adjacent sizing lenses are more informative than a synthetic TAM. The Army alone is requesting $1.6 billion for IFPC Increment 2 in FY2027, and DHS has disclosed $115 million of near-term event-security spend, a $1.5 billion contract vehicle, and $250 million of grants tied to FIFA 2026. These are not Bullfrog revenues, but they are real budget pools attached to the exact threat category that ACS addresses. The chapter therefore treats global market reports as boundary-setting lenses, U.S. procurement as a grounded demand lens, and protected-asset categories — bases, ships, formations, substations, and fixed sites — as the most practical bridge to SAM/SOM reasoning. No retained public source isolates a clean autonomous-weapon-station TAM for ACS specifically, and that gap should remain explicit.
