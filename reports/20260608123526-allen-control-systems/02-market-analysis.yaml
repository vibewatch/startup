- id: buyer-user-payer
  title: 'Buyer-user-payer map: Army first, but Navy, SOCOM, allies, and critical infrastructure matter'
  body: |-
    The buyer map is government-led rather than end-user-led. In the Army path, acquisition or innovation organizations such as xTech, SBIR managers, or program offices buy or sponsor evaluations; soldiers and units are the operators; and Army budgets are the payer. The xTechOverwatch process is instructive because it moves companies from white paper to soldier evaluation to direct-to-Phase-II prototype funding, which is a very different sales motion from a commercial software funnel. Navy and maritime adoption follows the same structure, but the operational user shifts toward ships, maritime units, or base-defense elements rather than land formations.

    SOCOM appears important because ACS has publicly referenced SOCOM-related contracts and Tectonic reported a maritime special-operations integration path, suggesting early adopters value mobile, platform-agnostic systems that can be deployed quickly on boats, vehicles, and austere sites. Allied militaries are a credible buyer class because ACS says Bullfrog is selected by U.S. and allied militaries and marketed only to the United States and its partners. Critical infrastructure is a secondary but meaningful demand pool: ACS repeatedly references substations and maritime assets, while DHS is building a counter-drone procurement office for homeland use cases. The caveat is that civilian operators often cannot independently exercise active mitigation authority, so infrastructure sales may route through federal integrators, public-safety partners, or government-approved response models instead of direct private procurement.
