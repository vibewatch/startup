- id: drivers-and-constraints
  title: Growth drivers and adoption constraints
  body: |-
    The core growth driver is battlefield economics. ACS, WarQuants, and multiple market sources all describe a world in which cheap drones or swarms can pressure defenders into absurd cost exchanges if the response requires missiles or complex interceptors. Bullfrog’s pitch — service-common weapons, low SWaP, low cost per kill, and compatibility with existing C2 — is built around correcting that ratio. A second driver is procurement urgency. xTech, TREX, JCO demonstrations, IFPC spending, and DHS event-security funding all show buyers paying for systems that can move from demo to deployment rapidly. Directed energy also raises the bar: if HPM and laser vendors can promise pennies per kill or low collateral damage, buyers will increasingly demand layered architectures rather than single-function solutions.

    The main constraints are not lack of demand but friction in fielding. DoD autonomy policy requires human judgment, verification, and testing. Homeland policy is expanding, yet real use still depends on commander discretion, site-specific procedures, and legal authority over airspace. Private infrastructure owners may see the threat clearly but still lack independent authority to jam, spoof, or kinetically defeat drones. Export controls add another gate because allied interest must pass licensing and classification processes. Competitive pressure is also real: Dedrone and DroneShield occupy the sensing/C2 and layered-software end of the stack, Leonardo DRS packages full prime-led integrated systems, and Epirus pushes directed energy for swarm defeat. ACS therefore has a live market, but it must win by fitting into layered architectures and navigating governance faster than larger incumbents do.
