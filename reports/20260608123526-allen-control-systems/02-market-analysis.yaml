- id: diligence-gaps
  title: Diligence gaps that matter more than another generic TAM slide
  body: |-
    The biggest remaining gap is not whether counter-UAS is growing; it is whether ACS can convert broad C-UAS demand into a repeatable, scalable autonomous-weapon-station revenue pool. No retained public source isolates the spend associated with autonomous weapon stations or remote weapon stations configured specifically for drone defeat. That means a valuation model should not assume the company can simply take share of an $11.6 billion or even $3.2 billion market. The more relevant diligence asks are program-centric: which units bought, how many systems, what procurement channel, what sustainment model, what platform integration burden, and what training or rules-of-engagement overhead sits behind each deployment.

    Two other gaps matter. First, civilian and critical-infrastructure authority remains incomplete in public sources. The chapter can show that the threat is real and that government budgets are rising, but it cannot yet prove when a private airport, utility, or port can independently buy and activate a kinetic system like Bullfrog versus needing federal operators or approved partners. Second, export-control detail is thin at the product level: DDTC and BIS explain the regimes, but no retained public source discloses Bullfrog’s exact classification, license history, or country-by-country clearance path. Those gaps do not invalidate the market thesis; they simply define the next diligence step and keep the chapter from pretending ACS’s SAM is already quantified.
