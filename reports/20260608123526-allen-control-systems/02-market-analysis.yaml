  evidenceGaps:
  - type: missing-source
    severity: material
    topic: autonomous-weapon-station-tam
    missingEvidence: A public source or primary program dataset that isolates autonomous weapon-station or remote weapon-station spending for counter-UAS hard-kill missions.
    whyItMatters: Without a niche TAM or SAM, valuation can drift toward generic counter-UAS TAM headlines that overstate what ACS can capture directly.
    diligencePath: Request program-level quantities, priced contract data, or prime-contractor budget splits for weapon-station hard-kill programs and comparable remote-weapon retrofits.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: public-market-estimates
    missingEvidence: A reconciled methodology showing why Fortune, TBRC, and MRFR disagree so sharply on current market size.
    whyItMatters: Investors need to know whether the difference is scope, geography, service inclusion, or simply weak vendor methodology before using any TAM in valuation work.
    diligencePath: Obtain paid methodology notes or ask management which public reports match its internal market boundary and why.
    relatedQuestionRefs:
    - QM004
    - QM005
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: civilian-active-mitigation-authority
    missingEvidence: A public site-type matrix showing when airports, utilities, ports, or venue operators may directly deploy or activate kinetic or non-kinetic C-UAS effectors.
    whyItMatters: Critical infrastructure looks like a real demand pool, but authority limits may force ACS to sell through federal operators or approved partners rather than directly to site owners.
    diligencePath: Compile agency guidance, state policy, and customer examples by site type to determine who can detect only, who can command response, and who can actively mitigate.
    relatedQuestionRefs:
    - QM017
    relatedTableRefs:
    - TM005
  - type: private-evidence-only
    severity: material
    topic: product-specific-export-classification
    missingEvidence: Bullfrog-specific export classification, prior license history, and country-level approval constraints.
    whyItMatters: Allied demand is visible, but revenue timing and reachable markets depend on product-specific licensing, not generic ITAR or BIS regime descriptions.
    diligencePath: Request DDTC/BIS classification memos, license approvals or denials, and internal target-country export roadmap from management or counsel.
    relatedQuestionRefs:
    - QM019
    relatedTableRefs:
    - TM005
