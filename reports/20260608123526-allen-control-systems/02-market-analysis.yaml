tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / boundary
  - Included spend or function
  - Excluded spend
  - Buyer / user / payer
  - Relevance to ACS
  rows:
  - - Broader counter-UAS stack
    - Detection, tracking, identification, C2, jamming, kinetic defeat, directed energy, integration, sustainment
    - General air defense not tied to drone threats; unrelated robotics or ISR software
    - Military and homeland agencies buy; operators use; program budgets pay
    - Sets the broad demand envelope but is wider than ACS can capture directly
  - - Autonomous weapon-station hard-kill layer
    - Autonomous fire control, weapon-station hardware, platform integration, software that closes the kill chain
    - Standalone sensors, passive monitoring, pure jammers, pure C2 dashboards
    - Military program offices and units are primary buyers and users
    - This is ACS’s immediate product category
  - - Remote weapon-station adjacency
    - Turret upgrade programs, autonomous fire-control retrofit, common-weapon integrations
    - Manned-only mounts with no autonomy upgrade path
    - Vehicle, maritime, and fixed-site weapon owners
    - Important adjacency because ACS says its fire control can be unbundled
  - - Critical-infrastructure protection
    - Protection of substations, ports, ships, and fixed sites against drone threats
    - General physical security spending with no drone mission
    - Facility owners, public-safety partners, or federal operators depending on authority
    - Secondary market with large threat pull but higher authority friction
  - - Layered integrated programs
    - Systems of systems combining sensors, C2, electronic warfare, directed energy, and kinetic effectors
    - Single-component purchases that never integrate into operational workflows
    - Defense primes or integrators often assemble and sell these stacks
    - Defines the competitive context in which ACS must integrate rather than dominate every layer
  notes: ACS sits inside the broader counter-UAS market but sells a narrower autonomous weapon-station wedge. Included and excluded categories are derived from retained market definitions, ACS product pages, and competitor positioning.
