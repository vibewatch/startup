evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital structure
    missingEvidence: Current cap table, any secondary sales, and any debt or credit instruments layered alongside the equity rounds.
    whyItMatters: >-
      Without this information, investors cannot see dilution history, liquidation stack, or whether non-equity
      obligations complicate the funding story.
    diligencePath: Request the latest capitalization table, financing documents, and side letters from the Series B and prior rounds.
    relatedQuestionRefs:
      - QO010
      - QO025
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: governance opacity
    missingEvidence: Board roster, independent-director status, observer rights, and investor governance allocations.
    whyItMatters: >-
      The leadership handoff from Simoni to Wior is visible, but the authority behind that transition is not. Governance
      quality cannot be judged from public materials alone.
    diligencePath: >-
      Ask for board minutes or formal board roster, committee structure, and the governance schedule from the lead
      financing documents.
    relatedQuestionRefs:
      - QO013
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue and ARR
    missingEvidence: Current revenue, ARR, gross margin, and backlog disclosure from management or primary documents.
    whyItMatters: A $2.2B post-money valuation cannot be underwritten without at least a current revenue or bookings anchor.
    diligencePath: Request monthly bookings, revenue, gross-margin, and backlog schedules used in the Series B process.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: customer count and deployments
    missingEvidence: Absolute customer count, deployed-system count, and contract concentration by customer and program.
    whyItMatters: Named military users are strong proof points, but concentration risk and true installed-base depth remain unknown.
    diligencePath: >-
      Request contract roster, deployed-unit counts, pipeline by service or ally, and renewal cadence for each visible
      program.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO001
      - TO004
  - type: missing-source
    severity: material
    topic: headcount and manufacturing capacity
    missingEvidence: Current headcount, factory square footage, output rates, and manufacturing bottleneck disclosure.
    whyItMatters: >-
      Series B proceeds are earmarked for scale, but public sources do not quantify the operating base from which ACS is
      scaling.
    diligencePath: >-
      Request current org chart, hiring plan, Austin/Huntsville manufacturing footprint details, and monthly
      production-capacity metrics.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: autonomous-weapon-station-tam
    missingEvidence: >-
      A public source or primary program dataset that isolates autonomous weapon-station or remote weapon-station
      spending for counter-UAS hard-kill missions.
    whyItMatters: >-
      Without a niche TAM or SAM, valuation can drift toward generic counter-UAS TAM headlines that overstate what ACS
      can capture directly.
    diligencePath: >-
      Request program-level quantities, priced contract data, or prime-contractor budget splits for weapon-station
      hard-kill programs and comparable remote-weapon retrofits.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: public-market-estimates
    missingEvidence: A reconciled methodology showing why Fortune, TBRC, and MRFR disagree so sharply on current market size.
    whyItMatters: >-
      Investors need to know whether the difference is scope, geography, service inclusion, or simply weak vendor
      methodology before using any TAM in valuation work.
    diligencePath: Obtain paid methodology notes or ask management which public reports match its internal market boundary and why.
    relatedQuestionRefs:
      - QM004
      - QM005
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: civilian-active-mitigation-authority
    missingEvidence: >-
      A public site-type matrix showing when airports, utilities, ports, or venue operators may directly deploy or
      activate kinetic or non-kinetic C-UAS effectors.
    whyItMatters: >-
      Critical infrastructure looks like a real demand pool, but authority limits may force ACS to sell through federal
      operators or approved partners rather than directly to site owners.
    diligencePath: >-
      Compile agency guidance, state policy, and customer examples by site type to determine who can detect only, who
      can command response, and who can actively mitigate.
    relatedQuestionRefs:
      - QM017
    relatedTableRefs:
      - TM005
  - type: private-evidence-only
    severity: material
    topic: product-specific-export-classification
    missingEvidence: Bullfrog-specific export classification, prior license history, and country-level approval constraints.
    whyItMatters: >-
      Allied demand is visible, but revenue timing and reachable markets depend on product-specific licensing, not
      generic ITAR or BIS regime descriptions.
    diligencePath: >-
      Request DDTC/BIS classification memos, license approvals or denials, and internal target-country export roadmap
      from management or counsel.
    relatedQuestionRefs:
      - QM019
    relatedTableRefs:
      - TM005
  - type: missing-source
    severity: material
    topic: bullfrog-independent-performance
    missingEvidence: >-
      Independent post-trial data on Bullfrog false positives, miss rate, ammunition expenditure per kill, and
      maintenance burden in field use.
    whyItMatters: >-
      Without independent operational data, ACS's public differentiation still relies heavily on company-led
      demonstrations and marketing claims.
    diligencePath: Request Army or allied after-action reports, third-party test data, or customer references from deployed units.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: counter-uas-unit-pricing
    missingEvidence: >-
      Delivered unit pricing, installation cost, and sustainment cost for Bullfrog and the substitute systems reviewed
      in this chapter.
    whyItMatters: >-
      Pricing opacity makes it hard to compare Bullfrog's total ownership economics with directed-energy systems,
      sensor-jammer stacks, or prime-integrated C-UAS packages.
    diligencePath: >-
      Ask management for quote history, contract line-item detail, or government budget exhibits that separate hardware,
      software, training, and sustainment.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: public-revenue-disclosure
    missingEvidence: Recognized revenue, ARR, shipped-unit counts, and backlog conversion by program.
    whyItMatters: Without revenue quality data, investors cannot separate prototype activity from scaled production demand.
    diligencePath: Request monthly revenue by customer/program, booked backlog roll-forward, and shipped installed-base data.
    relatedQuestionRefs:
      - QI006
      - QI014
      - QI015
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-inputs
    missingEvidence: Bill of materials, labor absorption, installation cost, support burden, ASP, and gross margin by SKU.
    whyItMatters: The public affordability story cannot be converted into a gross-margin or payback model without these inputs.
    diligencePath: Request SKU-level unit economics model, field-service cost assumptions, and pricing waterfall by contract type.
    relatedQuestionRefs:
      - QI006
      - QI007
      - QI011
      - QI013
      - QI024
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, debt schedule, and management runway cases.
    whyItMatters: Series B size alone does not reveal how long ACS can fund manufacturing expansion before needing more capital.
    diligencePath: Request current balance sheet, cash-burn bridge, debt or equipment-finance schedule, and board runway plan.
    relatedQuestionRefs:
      - QI019
      - QI020
      - QI024
    relatedTableRefs:
      - TI004
      - TI005
  - type: missing-source
    severity: material
    topic: undisclosed-contract-values
    missingEvidence: Signed contract values, options, milestones, and term lengths for JIATF 401, SOF, Korea/UAE, and Romania work.
    whyItMatters: Opaque program economics block revenue forecasting, customer concentration analysis, and collection modeling.
    diligencePath: Request redlined contract summaries or full contracts with payment milestones and scope definitions.
    relatedQuestionRefs:
      - QI010
      - QI017
      - QI024
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: material
    topic: financing-trigger
    missingEvidence: Board-approved milestone plan for when ACS would next raise capital and what KPIs must be hit first.
    whyItMatters: The difference between a discretionary growth round and a forced financing materially affects risk and valuation.
    diligencePath: >-
      Request management operating plan, financing scenarios, and KPI triggers tied to manufacturing and recurring
      revenue.
    relatedQuestionRefs:
      - QI020
    relatedTableRefs:
      - TI004
  - type: missing-source
    severity: material
    topic: performance-validation
    missingEvidence: >-
      Independent test results on detection range, false positives, engagement probability, and weather or low-light
      performance.
    whyItMatters: >-
      Bullfrog’s valuation and transition case depend on repeatable accuracy and reliability rather than marketing-level
      demo anecdotes.
    diligencePath: >-
      Request Army or customer test reports, confusion matrices, and after-action data from TREX, Project Convergence,
      or later operational events.
    relatedQuestionRefs:
      - QE018
      - QE023
  - type: private-evidence-only
    severity: material
    topic: sustainment
    missingEvidence: Field maintenance burden, spare-part needs, ammo consumption norms, and operator-support staffing requirements.
    whyItMatters: A low cost per kill does not prove low lifecycle cost if sustainment or training overhead is high.
    diligencePath: >-
      Ask for sustainment plans, MTBF targets, maintenance manuals, and support staffing assumptions from current
      customer deployments.
    relatedQuestionRefs:
      - QE010
      - QE025
  - type: missing-source
    severity: material
    topic: assurance-disclosure
    missingEvidence: >-
      Public or customer-shareable evidence of V&V, cybersecurity, anti-tamper controls, and any quality or
      data-handling certifications.
    whyItMatters: Autonomy-enabled lethal systems are often gated more by assurance evidence than by raw hit probability.
    diligencePath: >-
      Request system safety case, cyber architecture review, operator override documentation, and any CMMC, ISO, or
      AS9100 materials.
    relatedQuestionRefs:
      - QE019
      - QE020
      - QE021
    relatedTableRefs:
      - TE004
  - type: missing-source
    severity: minor
    topic: export-licensing
    missingEvidence: Bullfrog export classification, licensing status, and constraints on partner-force sales.
    whyItMatters: Export friction can delay international growth and affect which configurations can be sold abroad.
    diligencePath: >-
      Confirm ITAR or EAR status, license history, and any country-specific restrictions with counsel and
      trade-compliance staff.
    relatedQuestionRefs:
      - QE022
  - type: missing-source
    severity: material
