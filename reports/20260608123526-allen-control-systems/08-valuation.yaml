- id: scenario-ranges
  title: Bull, base, and bear scenario ranges
  body: 'Because ACS does not disclose revenue or gross margin, the scenario model here is intentionally simple. It anchors on the latest financing mark, then adjusts for what must become visible for that mark to compound. The bull case assumes ACS converts its early Army and allied traction into repeat programs, shows manufacturing throughput, expands visible contract scale, and proves that the low-cost bullet-based counter-UAS thesis can travel internationally despite export controls. Under that set of assumptions, the current mark can grow into the high-$2 billions or low-$3 billions without requiring Anduril-style platform breadth.


    The base case keeps ACS roughly around the current round. That is the most defensible public-evidence posture today: category demand remains strong, ACS continues to win demonstrations and small contracts, but the company still does not disclose enough economics to justify a much richer price. The bear case is not a company-failure scenario; it is a valuation-reset scenario. If procurement stays pilot-like, if autonomy-policy backlash slows deployment, if exports take longer than expected, or if broader defense-tech multiples compress, the public record would support a meaningfully lower mark than $2.2 billion. In other words, the range is driven more by evidence quality and commercialization visibility than by broad market excitement.'
