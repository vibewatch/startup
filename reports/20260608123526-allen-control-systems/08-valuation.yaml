    - $2.8B-$3.6B; upside above latest mark
    - Execution and export-control friction
    - Possible, but not publicly proven yet
  - - Base
    - Demand remains strong, ACS keeps winning demos and small programs, disclosure stays limited
    - $1.6B-$2.4B; roughly around current mark
    - Price outruns proof for longer
    - Most consistent with current evidence
  - - Bear
    - Programs remain pilot-like, autonomy controversy grows, defense multiples compress
    - $0.8B-$1.3B; down-round or flat-round risk
