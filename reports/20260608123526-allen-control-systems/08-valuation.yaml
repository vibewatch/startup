- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Revenue and backlog
    - Current annualized revenue, backlog, and repeat-order profile
    - Needed to test whether the Series B price is supported by operating scale
    - Management diligence request and contract schedule review
  - - Gross margin and cost-per-kill economics
    - Unit economics by deployment type and manufacturing margin bridge
    - Needed to know whether bullet economics scale into company economics
    - Finance diligence plus production walk-through
  - - Customer concentration
    - Named customer mix, contract duration, and renewal concentration
    - Determines whether a few pilot buyers dominate the current narrative
    - Pipeline review and reference calls
  - - Cap table and terms
    - Preference stack, liquidation rights, and any ratchet or seniority terms
    - Determines whether the headline $2.2B mark is economically clean for new investors
    - Legal diligence and financing documents
  notes: These asks focus on evidence that would move the recommendation, not on generic company-profile questions already covered elsewhere.
