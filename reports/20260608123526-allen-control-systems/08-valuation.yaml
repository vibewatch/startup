- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - No visible contract scaling
    - Still no publicly visible repeat-order or larger-program evidence by the next financing
    - Narrative shifts from deployed product to perpetual pilot
    - Downgrade to avoid or require a much lower price
  - - Autonomy backlash or rules tighten
    - Policy changes materially constrain autonomous kinetic employment
    - TAM and field-utility assumptions weaken
    - Cut bull and base cases
  - - Export and allied pipeline stall
    - International contracts fail to convert because licensing and approvals drag
    - Manufacturing scale thesis loses a key demand leg
    - Re-rate toward base or bear
  - - Sector multiple reset
    - Peer financings print down or public C-UAS multiples compress sharply
    - Narrative support for premium entry disappears
    - Move valuation stance from stretched toward expensive
  notes: Each trigger is designed to be monitorable in a refresh run and to map directly to the valuation thesis rather than to vague execution concern.
