  - - Shield AI
    - Latest private round
    - $12.7B post-money on $1.5B Series G
    - Shows what investors pay for autonomy with marquee DoD catalyst
    - Aircraft autonomy and financing structure are broader than ACS
  - - Saronic
    - Latest private round plus contract proof
    - $9.25B valuation with $1.75B Series D and disclosed $392M Navy contract context
    - Best recent manufacturing-and-procurement comp for defense autonomy
    - Maritime autonomy is not a direct counter-UAS comp
  - - Epirus
    - Contract proof and funding context
    - No disclosed current valuation in retained set; $66.1M prototype and $43.5M Army contract evidence
    - Closest directed-energy counter-drone hardware peer
    - Microwave architecture differs from ACS kinetic approach
  - - DroneShield
    - Public pure-play operating proof
    - A$216.5M FY2025 revenue with 277% YoY growth
    - Shows what real disclosed C-UAS revenue looks like
    - Public company and product mix are different
  - - Anduril
    - Upper-bound private benchmark
    - Over $60B valuation context in 2026
    - Frames ceiling for a diversified defense platform
    - Far too broad and diversified for direct multiple transfer
  notes: This table is exhaustive for the retained comps used in this chapter. It mixes private rounds, public revenue proof, and contract visibility because ACS does not disclose a revenue base that would support clean multiple work.
