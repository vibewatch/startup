  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Current annualized revenue, backlog, and repeat-order data for Bullfrog and adjacent products.
    whyItMatters: Without this, the $2.2 billion mark cannot be translated into any defensible revenue or bookings framework.
    diligencePath: Request management KPI pack and contract schedule by customer and program phase.
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin by system, field-support burden, and manufacturing throughput assumptions.
    whyItMatters: Low cost-per-kill for the customer does not automatically mean attractive economics for ACS.
    diligencePath: Review factory workflow, BOM assumptions, and field-service cost structure.
  - type: private-evidence-only
    severity: material
    topic: cap-table-terms
    missingEvidence: Preference stack, liquidation rights, and any ratchet or seniority terms from the Series B.
    whyItMatters: Headline post-money valuation can overstate economic value available to new investors if terms are stacked.
    diligencePath: Review financing documents with counsel and reconcile fully diluted ownership.
  - type: missing-source
    severity: material
    topic: export-pipeline
    missingEvidence: Concrete export-license status and the size of allied pipeline beyond broad official references.
    whyItMatters: International demand is part of the scaling story, but export approvals can delay revenue recognition and cash conversion.
    diligencePath: Request jurisdiction-by-jurisdiction pipeline, DDTC/BIS status, and expected approval timing.
