  - - Public economics are still opaque
    - Disclosure of revenue, backlog, margin, and customer concentration would materially improve the call
  - - Peer comps show investors will pay for scale when proof is stronger
    - A sector reset or down-round peer prints would push ACS from stretched toward expensive
