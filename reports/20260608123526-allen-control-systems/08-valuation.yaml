- id: comparable-frame
  title: Comparable set, underwriting context, and why the public-proof discount remains
  body: 'A disciplined valuation frame for ACS has to mix private defense-tech rounds with operating proof instead of pretending a revenue multiple exists when revenue is undisclosed. The cleanest peer read is not Anduril; it is the cluster of 2025-2026 counter-UAS and autonomy names that show what investors will pay when a company can point to a differentiated mission set, public contracts, or a clear systems advantage. Saronic, Shield AI, Epirus, DroneShield, and Dedrone are useful because each represents a different proof stack: capital-plus-manufacturing, capital-plus-program catalyst, directed-energy hardware, public pure-play revenue, and software/C2 integration.


    Relative to that set, ACS looks credible but expensive on public proof. The company is well below Anduril, Shield AI, and Saronic in absolute valuation, which prevents the latest round from looking absurd in a hot defense market. Yet Saronic pairs its valuation with a disclosed $392 million Navy production contract and 1,300-plus headcount, Shield AI pairs its jump with a marquee Air Force catalyst, Epirus can point to larger Army microwave contracts, and DroneShield already publishes nine-figure revenue. ACS has product evidence and real customer pull, but not peer-quality disclosure. That is why the comp set supports seriousness, not a clean fair-value call.'
