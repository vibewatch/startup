      - number: '5.4'
        title: Differentiation, governance, and diligence risks
        blocks:
          - type: paragraph
            body: >-
              Relative to peers, ACS is differentiated by low-SWaP kinetic point defense using common machine guns, not
              by the broader sensor-first or directed-energy architectures that dominate much of counter-UAS marketing.
              That positioning is attractive when cheap drones exhaust expensive interceptors or become harder to jam,
              but it also raises sharper trust and governance questions because the final effector is lethal. DoD
              Directive 3000.09 sets a clear bar around human judgment, verification and validation, cybersecurity,
              auditable data sources, and understandable human-machine interfaces. ACS’s public posture partially aligns
              with that bar: the company says Bullfrog only requires operator command to fire, and outside reporting
              describes human-in-the-loop or human-on- the-loop modes. What is missing is as important as what is
              present. The fetched surface does not publish certification disclosures, export classification, formal V&V
              artifacts, false-positive or fratricide controls, or sustainment-quality data. War Quants explicitly
              argues that trust is the biggest limiter for AI machine guns, and Human Rights Watch highlights the
              broader accountability risks of fully autonomous killing. That does not invalidate Bullfrog’s concept, but
              it means diligence must go deeper on rules of use, friendly-drone identification, override logic, and
              assurance evidence before treating the system as de-risked.
