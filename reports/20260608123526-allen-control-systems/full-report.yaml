      - number: '3.4'
        title: Moat durability, switching costs, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              ACS's moat is credible but bounded. The strongest durable elements in public evidence are its control
              software, passive sensing know-how, and the ability to bolt autonomous precision onto existing weapons
              that militaries already field. That gives Bullfrog a wedge where low-SWaP kinetic defense matters more
              than full-stack air-defense architecture. The same open-architecture posture that helps ACS enter layered
              systems also weakens switching costs: compatibility with ATAK, FAAD C2, and Lattice means Bullfrog can
              slot into broader stacks, but it also means buyers can multi-home across different sensors, control
              layers, and effectors. Adverse evidence matters here. War Quants highlights trust, target-identification,
              geometry-of-fire, and fratricide concerns for AI machine guns, all of which can narrow usable rules of
              engagement. Distribution risk is also real: primes can bundle sensors, missiles, radars, and vehicle
              integration around the same mission and then out-service ACS after award. On balance, ACS has a
              differentiated niche moat in close-in autonomous kinetic defeat, but not a winner-take-all moat across
              layered counter-UAS procurement.
