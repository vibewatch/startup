      - number: '3.3'
        title: Pricing, contract model, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Public pricing transparency is weak across the entire set. ACS markets a mission-economics narrative, with
              cost per kill as low as $10, but not a list price. The same is true for Epirus, Dedrone, DroneShield, RTX,
              Leonardo DRS, and Shield AI in the reviewed corpus: official pages describe capabilities and deployment
              models, not commercial rate cards. The few public numbers that do appear are contract or capital signals.
              ACS has a disclosed $2 million xTech SBIR award, a $1.5 million Army Applications Laboratory integration
              contract with up to $4.5 million of options, and about $3.55 million on the reviewed USAspending recipient
              page. Those values are helpful proof of traction, but they do not reveal delivered system pricing or
              lifecycle economics. The bigger strategic issue is distribution power. Leonardo DRS and RTX sell through
              existing defense programs and platform relationships. Anduril and Shield AI carry far larger capital bases
