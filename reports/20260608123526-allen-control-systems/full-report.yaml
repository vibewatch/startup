  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: |
      Defense customer journey from threat recognition to deployment and multi-platform expansion.
    data:
      nodes:
        - id: ju1
          label: Threat Recognition
          description: >
            Military unit, installation, or sponsor identifies a counter-drone gap for moving formations, maritime
            assets, or fixed infrastructure. DHS and DOJ materials also show a parallel homeland demand adjacency for
            events and critical infrastructure, but ACS has no named civilian customer yet.
        - id: ju2
          label: Evaluation and Demo
          description: >
            Army-facing events such as T-REX, Project Convergence, and xTechOverwatch provide the first serious proof
            surface. Buyers evaluate cost-per-kill, usability, mobility, and whether Bullfrog can integrate with
            existing C2 and weapons.
        - id: ju3
          label: Contracting Path
          description: >
            The purchase path can run through a government office directly, through an innovation / SBIR channel, or
            through a prime / integrator such as ManTech. The Army is the clearest example of this layered contracting
            path.
        - id: ju4
          label: Integration and Training
          description: >
            The customer integrates Bullfrog onto a platform or site and trains operators. ACS has publicly highlighted
            rapid operator qualification and platform-integration work across multiple Army vehicles.
        - id: ju5
          label: Deployment and Sustainment
          description: >
            Evidence of deployment exists for the U.S. Army, U.S. Navy, and allied militaries, but the public record
            rarely discloses unit counts. Allied contracts also reference technical assistance, operator training, and
            sustainment.
        - id: ju6
          label: Expansion Loop
          description: >
            Once a customer trusts the stack, expansion could happen across weapon variants, more platforms, more
            branches, or new geographies. The largest unproven branch of this journey is critical infrastructure, where
            ACS shows use-case fit but no named public customer.
    approximationNotes: >
      The stages are reconstructed from public demos, contract announcements, and product pages. No internal funnel
      conversion, time-to-close, or renewal timing data is public.
    claimRefs:
      - CU002
      - CU007
      - CU010
      - CU019
      - CU030
      - CU031
      - CU038
      - CU039
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: |
      Indexed path from market demand to repeat-order visibility for Bullfrog.
    data:
      items:
        - label: Program Demand / Threat Awareness
          value: 100
          note: >
            Indexed to 100. Counter-drone demand is broad across military formations, maritime assets, and fixed sites;
            ACS-specific market share is not disclosed.
        - label: Army / Customer Evaluation Surface
          value: 70
          note: |
            T-REX, Project Convergence, and xTechOverwatch show ACS repeatedly reaching serious evaluators.
        - label: Funded Development / Prototype Awards
          value: 40
          note: |
            xTech / SBIR and Army-linked contracts indicate funded movement beyond pure demos.
        - label: Named Contracts
          value: 25
          note: |
            Public named contracts include SOF maritime integration, South Korea, UAE, and AAL vehicle integration work.
        - label: Shipped Systems
          value: 15
          note: |
            Tectonic reported one first official customer shipment in March 2026.
        - label: Publicly Claimed Deployments
          value: 10
          note: |
            ACS says Bullfrog is already deployed with the U.S. Army and U.S. Navy, but without fleet size.
        - label: Repeat-Order Visibility
          value: 3
          note: |
            Indexed low because public sources do not disclose renewals, reorders, or cohort behavior.
    approximationNotes: >
      Values are indexed qualitative stages rather than actual counts. The chart visualizes how much proof survives into
      later deployment and renewal stages, not ACS conversion rates.
    claimRefs:
      - CU012
      - CU013
      - CU015
      - CU016
      - CU019
      - CU029
      - CU037
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: |
      Compares named customer evidence by deployment maturity, quantified outcome signal, and retention visibility.
    data:
      columns:
        - Buyer / user clarity
        - Deployment maturity
        - Quantified outcome signal
        - Retention visibility
        - Primary proof limitation
      rows:
        - label: U.S. Army
          values:
            - Strong
            - Medium to high
            - Medium — training speed and seven-kill PCC5 result are public
            - Low
            - No unit count, reorder history, or program-of-record disclosure
        - label: U.S. Navy
          values:
            - Weak
            - Medium
            - Low
            - Low
            - Single company-authored deployment statement
        - label: Maritime SOF
          values:
            - Medium
            - Medium
            - Low
            - Low
            - Integration contract scope is named, but delivery and outcome details are missing
        - label: South Korea / UAE
          values:
            - Medium
            - Medium
            - Low
            - Low
            - Contracts are named, but values, quantities, and delivery dates are undisclosed
        - label: Critical infrastructure adjacency
          values:
            - None
            - None
            - None
            - None
            - Use-case fit exists without a named ACS civilian customer
    approximationNotes: >
      The matrix scores proof quality, not customer value. It intentionally distinguishes real named proof from broader
      adjacency or marketing language.
    claimRefs:
