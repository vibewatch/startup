      - number: '3.2'
        title: Capability and deployment comparison
        blocks:
          - type: paragraph
            body: >-
              Bullfrog's public edge is the combination of autonomous fire control, passive detection, common
              ammunition, and low-SWaP deployment on existing weapons. ACS claims the system can run on M240, M2, and
              M230 configurations, integrate with ATAK, FAAD C2, and Lattice, and unbundle its fire-control layer for
              reuse on other stations. That makes the closest substitutes not sensor vendors but effectors with
              different physics. Epirus and RTX attack the same drone-swarm economics with high-power microwaves, and
              Leonardo DRS markets a larger integrated architecture that adds radars, 30mm guns, rockets, Coyote
              missiles, lasers, and FAAD C2. Dedrone and DroneShield sit further away from Bullfrog on the kill chain:
              they contribute airspace awareness, C2, and mitigation, but their public pages do not describe a close-in
              autonomous gun station that mirrors Bullfrog. Shield AI is further still; its reviewed page is about
              autonomy middleware, not counter-drone hardware. The resulting capability picture is that ACS is strongest
              where a buyer wants autonomous kinetic defeat on a lightweight host platform, while substitutes become
              more attractive as the mission expands toward swarms, fixed-site coverage, or multi-effector integration.
