  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitor classes
        blocks:
          - type: paragraph
            body: >-
              ACS does not compete inside a clean one-product market. Bullfrog is positioned as a narrow but distinctive
              autonomous kinetic weapon station, while most procurement alternatives fall into adjacent or substitute
              layers: directed-energy systems such as Epirus Leonidas and RTX Phaser; detection, C2, and jamming stacks
              such as Dedrone and DroneShield; autonomy and C2 primes such as Anduril and Shield AI; and incumbent
              vehicle-integrated C-UAS architectures from firms like Leonardo DRS. The Robotics Press market review is
              useful here because it frames counter-UAS as a layered market with no single vendor dominating both
              detection and defeat. That structure matters for ACS: public materials surfaced few like-for-like
              autonomous gun-turret peers, so Bullfrog's practical competition is mostly functional rather than
              categorical. Buyers can keep the status quo by upgrading remote weapon stations, or they can buy broader
              layered systems that include sensors, software, and multiple effectors. ACS therefore wins when the
              procurement problem is close-in, low-cost, kinetic protection for vehicles, vessels, formations, or fixed
              sites, not when the buyer wants one prime to own the entire air-defense stack.
