  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Latest mark and what the $2.2 billion price reflects
        blocks:
          - type: paragraph
            body: >-
              The latest supportable mark for Allen Control Systems is the 5 June 2026 Series B: $200 million raised at
              a $2.2 billion post-money valuation, implying roughly $2.0 billion pre-money. That is a sharp escalation
              from the $12 million seed in April 2024 and $30 million Series A in March 2025. On disclosed rounds alone,
              ACS has now raised about $242 million. The pace matters because investors are no longer underwriting a
              concept-stage robotics startup; they are underwriting a company that is supposed to move from promising
              demonstrations into scaled manufacturing, repeat military deployment, and adjacent product expansion.


              Public evidence supports part of that story. ACS has shown real product progress: xTechOverwatch
              recognition, a $2 million SBIR-linked award, Project Convergence swarm kills, and official claims of
              deployment with the U.S. Army, U.S. Navy, and allied users. But the same public record still does not
              disclose revenue, backlog, gross margin, customer count, or cap-table terms. USAspending shows real
              federal activity, yet only a few million dollars of publicly visible obligation data. So the current price
              does not read as a valuation of disclosed economics; it reads as a venture bet that low-cost kinetic
              counter-UAS systems can become a scaled program category before larger incumbents, directed-energy peers,
              and software-first C2 vendors lock up the market.
