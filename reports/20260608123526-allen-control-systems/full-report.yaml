  - id: FE001
    title: Bullfrog autonomous fire-control architecture map
    type: stack
    layout: wide
    summary: >-
      Bullfrog is best understood as a layered autonomy stack: passive optics feed perception models, which feed target
      tracking and control logic, which then hand recommendations into C2 and human-authorized engagement.
    data:
      layers:
        - label: Passive sensing layer
          detail: Battery-powered camera arrays and customer or ACS optics search the sky without radar emission.
        - label: Perception and training-data layer
          detail: >-
            Detection and classification models are refreshed with synthetic scenes, target libraries, and ground-truth
            labels.
        - label: Tracking and control layer
          detail: >-
            Proprietary fire-control software solves nonlinear aiming and shot-timing problems while accounting for
            torque and inertia.
        - label: Open-architecture integration layer
          detail: Bullfrog is marketed as interoperable with existing radars and C2 stacks such as ATAK, FAAD C2, and Lattice.
        - label: Effector and authorization layer
          detail: >-
            Service-common weapons or other remote weapon stations execute the shot only after the operator authorizes
            fire.
