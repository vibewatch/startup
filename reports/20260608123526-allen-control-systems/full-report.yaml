  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams and recognition shape
        blocks:
          - type: paragraph
            body: >-
              ACS' public commercial surface is broader than a single Bullfrog turret SKU, even though management still
              leads with the weapon station in most announcements. The official capabilities pages show three
              monetizable layers that can sit beside or underneath a Bullfrog sale: passive drone detection, an
              autonomous fire-control stack that can be unbundled from Bullfrog and embedded in other remote weapon
              stations, and synthetic training-data generation sold as a concierge service. The international contracts
              release adds a fourth layer by explicitly packaging operator training, technical assistance, and
              sustainment with system delivery. That matters because the financial model is probably a blend of lumpy
              hardware revenue and attach-rate-dependent service or software revenue rather than a pure hardware-only
              business.


              Public evidence is still too thin to quantify mix. ACS does not disclose how often capabilities are sold
              standalone, whether passive detection or training-data work is already monetized outside Bullfrog
              programs, or what share of announced international work is support versus hardware. But the shape is
              visible enough to underwrite a direction of travel: hardware is the spear point, while support,
              software/control, and data services are the path to a cleaner recurring layer. Recognition likely follows
              a mixed pattern of shipment or acceptance milestones for systems and time-based recognition for training,
              sustainment, and integration work, which is a more complex revenue-quality profile than a straightforward
              recurring SaaS contract.
            claimRefs:
              - CI033
