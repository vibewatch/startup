      - number: '4.5'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is better on demand formation than on underwriteability. ACS has a believable
              revenue architecture for defense hardware: Bullfrog system sales open the door, while training,
              sustainment, unbundled fire control, passive detection, and training-data services could create
              higher-quality follow-on revenue. The company has also raised enough disclosed equity to finance a genuine
              manufacturing push. That combination is enough to argue that ACS is not a science project and not
              obviously capital-starved on the eve of deployment. It is not enough to conclude that the business already
              has durable revenue quality or a near-term path to attractive gross margins.


              The blockers are explicit and material. Public sources do not disclose revenue, ARR, gross margin, burn,
              cash, runway, contract values for most announced programs, realized Bullfrog ASP, discounting, or
              system-level unit economics. Those omissions mean an investor cannot yet distinguish prototype-heavy
              revenue from scaled production revenue, or test whether support and software are actually attaching at
              attractive margins. The adverse policy backdrop also matters: HRW's criticism of loosened
              autonomous-weapons safeguards shows that ACS will operate in a category where public-policy controversy
              can change quickly. The right diligence posture is therefore to treat ACS as a company with clear customer
              interest and strong financing momentum, but with a still-blocked financial underwrite until management
              opens the data room on revenue quality, margin structure, and capital consumption.
