      - number: '1.3'
        title: Funding history, investor syndicate, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              ACS has moved from seed-stage defense startup to late-stage venture-backed platform in just over two
              years. Publicly

              disclosed capital formation is straightforward at the round level: $12 million seed in April 2024, $30
              million Series A in

              March 2025, and a $200 million Series B in June 2026 at a $2.2 billion post-money valuation. The disclosed
              total is $242

              million. Craft Ventures is the clearest recurring institutional backer, leading the seed and Series A and
              remaining in the

              Series B. Rally Ventures, Forum Ventures, and later Inspired Capital also recur across rounds, while Smash
              Capital enters as

              the lead investor at the Series B stage.


              What is not publicly visible is just as important. No reviewed source disclosed ownership percentages,
              board-seat

              allocations, liquidation preferences, secondary transactions, or any debt or credit facility layered into
              the cap table.

              The stakeholder picture is therefore legible at the syndicate level but not at the control-rights level.
              For diligence,

              the near-term asks are the current cap table, founder ownership split, Smash's governance rights after
              leading the Series

              B, and whether any earlier investors have already sold shares or converted into a different rights
              profile.
