  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: broader C-UAS, narrower autonomous weapon-station wedge'
        blocks:
          - type: paragraph
            body: >-
              Allen Control Systems should be framed first as a counter-UAS company and only second as a remote
              weapon-station company. The broad market definition in retained industry sources covers systems that
              detect, track, identify, and neutralize drones across military bases, airports, borders, ports, energy
              assets, and public events. Within that stack, ACS is not selling a standalone radar, jammer, or pure
              command-and-control screen. Bullfrog is the hard-kill terminal-defense layer: an autonomous weapon station
              that pairs computer vision, AI fire control, and existing weapons to defeat Group 1-3 UAS.


              That distinction matters because most published C-UAS TAM figures describe much broader system-of-systems
              spending than ACS can capture directly. ACS product pages emphasize compatibility with ATAK, FAAD C2, and
              Lattice, which implies the company is designed to plug into a larger air-defense stack rather than replace
              it. The remote weapon-station adjacency is real, especially because ACS says its fire-control stack can be
              unbundled for other weapon stations, but the immediate market boundary is still counter-drone force
              protection for vehicles, vessels, formations, and fixed sites. The practical status-quo substitutes are
              jammers, missiles, directed-energy systems, legacy remote weapon stations, and human-operated machine guns
              used for point defense.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM014
              - CM029
