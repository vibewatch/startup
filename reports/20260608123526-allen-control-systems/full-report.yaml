  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Bullfrog family, modules, and operator workflow
        blocks:
          - type: paragraph
            body: >-
              In customer workflow terms, Bullfrog is a short-range autonomous weapon-station family for point defense
              of vehicles, vessels, formations, and fixed sites against drones and swarms. The public surface shows four
              weaponized SKUs—M240C, M2, M230, and M134—wrapped around the same core promise: passive sensing,
              AI-assisted detection and tracking, open-architecture integration with existing C2, and use of
              service-common weapons rather than bespoke interceptors. That family map matters because ACS is not only
              selling a turret. It is also marketing lower-collateral options, a passive-sensing module, synthetic-data
              services, and even a fire-control kit that can be separated from Bullfrog and dropped into other remote
              weapon stations. Public maturity is uneven, though. M240-class configurations have the clearest demo
              evidence, while the M230 page coexists with homepage language that still labels that path as future
              development. The result is a product line that looks modular and extensible, but not equally mature across
              every listed variant.
