          claimRefs:
            - CV013
            - CV016
            - CV037
        - label: Comparable standing
          value: 5 / 10
          status: in-progress
          note: Valuation is credible inside the peer set, but public proof trails peers.
          claimRefs:
            - CV029
            - CV031
            - CV033
            - CV035
        - label: Risk profile
          value: 4 / 10
          status: in-progress
