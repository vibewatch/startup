      - number: '7.3'
        title: Manufacturing, Competition, and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Series B capital and an expanded Austin manufacturing footprint give ACS more room to scale, but the
              public evidence still lacks the operating metrics investors actually need: throughput, backlog, yield,
              installed tooling, service-headcount, and repair-cycle data. That omission matters because ACS is trying
              to scale a product family with multiple weapon variants, different ranges, multiple platform integrations,
              overseas support obligations, and claimed compatibility with major third-party C2 systems. Complexity is
              rising faster than public manufacturing transparency.


              Competitive pressure compounds the execution burden. Robotics Press and RNG both describe a market where
              winning vendors either own the C2 layer or integrate cleanly into it, while primes and specialized vendors
              field layered solutions rather than single-purpose point defenses. Dedrone and DroneShield can capture
              budget at the detection-and-C2 layer. Raytheon and Leonardo DRS bring prime-contractor scale and
              multi-effector portfolios. Epirus markets microwave economics and dramatic saturation performance. Even if
              Bullfrog remains differentiated for close-in kinetic defense, procurement officials can still choose a
              broader architecture in which ACS is a subsystem or is left out entirely.


              International expansion raises the bar further. Korea, UAE, and Romania imply not just manufacturing
              demand but training, technical assistance, sustainment, documentation, and potentially local industrial
              support. Those obligations are easy to underwrite in a press release and much harder to industrialize at
              consistent quality.
