  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Export-Control Risk
        blocks:
          - type: paragraph
            body: >-
              Allen Control Systems is not just selling another turret; it is selling an autonomous weapon station into
              a policy domain that already has explicit design, training, review, and foreign-disclosure requirements.
              DoD Directive 3000.09 requires appropriate levels of human judgment, transparent operator interfaces,
              training, and validation before autonomous weapon systems scale, while ACS's own product pages say
              Bullfrog autonomously detects, tracks, identifies, and acquires targets before an operator commands fire.
              That means speed-to-field alone is not enough. Any adverse test event, policy reinterpretation, or demand
              for more evidence on target discrimination could slow procurement even if demand remains urgent.


              Domestic authority is another real boundary. CRS says DoD's counter-UAS authority for covered facilities
              and assets remains statutory, scoped, and time-limited through the end of 2026 unless Congress extends
              portions of it. The February 2026 homeland fact sheet expands commander flexibility beyond the fence line,
              but it does not turn counter-drone operations into a general nationwide authorization. DOJ and DHS
              materials also show that homeland use is fragmented across agencies and legal frameworks. ACS can market
              domestic critical-infrastructure relevance, but the most immediately actionable customer base remains
              military and tightly authorized government users.


              The export side cuts both ways. ACS has already announced sales to Korea and the UAE plus Romanian local
              co-production, which helps diversify demand, but those same deals import ITAR, BIS licensing,
              foreign-disclosure, end-use, training, and sustainment execution risk. Public sources confirm the
              regulatory regimes, yet they do not reveal Bullfrog's exact classification or approval path. That opacity
              matters because export-license timing can become revenue timing.
            claimRefs:
