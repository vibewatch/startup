            body: >-
              ACS’s strongest technical differentiation is the combination of passive detection, autonomous fire
              control, and training-data generation in one stack. The passive-detection page describes battery-powered
              camera arrays, ACS- or customer-supplied optics, and in-house libraries that can be embedded in larger
              systems without emitting radar energy. The fire-control page adds the hard part: proprietary hardware and
              software that solve a nonlinear multi-input, multi-output optimization problem while respecting real
              constraints such as motor torque and turret inertia. The training-data page then closes the loop by
              explaining how ACS builds photorealistic synthetic scenes with target and non-target objects, weather,
              terrain, and ground-truth labels to refresh convolutional models without waiting for costly live
              collections. This architecture is notable because it makes Bullfrog more like an autonomous
              perception-and-control product than a mere gun mount. The public surface also says the fire-control module
              can be unbundled from Bullfrog, which supports the view that ACS is building reusable autonomy middleware
              around common weapons rather than a single fixed appliance.
