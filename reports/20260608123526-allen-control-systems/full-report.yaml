companyProfile:
  summary: >-
    Allen Control Systems is a private U.S. defense-technology startup founded in 2022 to build autonomous precision
    weapon stations for counter-drone missions. The company’s Bullfrog product family combines AI, computer vision,
    passive sensing, and proprietary fire-control software to upgrade existing weapons for kinetic defeat of Group 1-3
    drones, and public materials say ACS is already deployed with the U.S. Army and U.S. Navy while also holding SOF and
    allied contracts. Publicly disclosed capital totals $242 million across seed, Series A, and Series B, but revenue,
    backlog, margin, and cap-table terms remain undisclosed.
