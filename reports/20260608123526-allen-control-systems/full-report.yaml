      - number: '6.4'
        title: Retention, Repeat Usage, and Expansion Signals
        blocks:
          - type: paragraph
            body: >
              Public evidence is much better on initial adoption than on durability. ACS does not disclose active
              customer count, contract length, NRR, GRR, churn, or any satisfaction metric, so there is no quantitative
              way to assess whether Bullfrog customers renew, reorder, or expand across multiple programs. The strongest
              positive signal is structural rather than statistical: the allied contracts bundle hardware delivery with
              operator training, technical assistance, and sustainment, which implies a services layer that could deepen
              account stickiness after the first sale. The Army Applications Lab vehicle-integration plan creates a
              second clear expansion loop because one approved software-and-control stack could spread across several
              combat platforms. Product pages also show multiple weapon variants and deployment environments, which
              expands wallet share within a single account once approvals exist. But these are expansion possibilities,
              not verified repeat purchases. Investors should therefore treat retention and expansion as plausible but
              unproven until management provides reorder history, sustainment renewal cadence, and
