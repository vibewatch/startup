  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: Qualitative placement of ACS's principal risks by likelihood and impact based on public evidence as of June 2026.
    data:
      columns:
        - Medium Impact
        - High Impact
        - Critical Impact
      rows:
        - label: Low Likelihood
          values:
            - null
            - Homeland authority fragmentation
            - None
        - label: Medium Likelihood
          values:
            - Government-relations execution
            - Autonomy review drag; Export-license delays
            - Manufacturing opacity; Prime architecture lockout
        - label: High Likelihood
          values:
            - C2 integration proof gap
            - Army budget concentration; Demo-to-program conversion risk
            - Battlefield-performance drift; Ethics/reputation backlash
    approximationNotes: >-
      Placement is qualitative rather than probabilistic. Cells summarize residual exposure after considering the
      mitigations visible in public sources.
    claimRefs:
      - CR004
      - CR009
      - CR014
      - CR017
      - CR024
      - CR030
      - CR037
      - CR046
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: How policy, procurement, performance, and competition risks propagate into revenue timing and valuation.
    data:
      nodes:
        - id: policy
          label: Autonomy / authority gate
          detail: 3000.09 compliance plus domestic authority scope
        - id: export
          label: Export approval
          detail: ITAR / BIS / foreign-disclosure timing for allied deals
        - id: army_budget
          label: Army budget concentration
          detail: Visible domestic revenue remains Army-heavy
        - id: field_data
          label: Independent field data gap
          detail: Operational evidence remains limited versus demos
        - id: competition
          label: Layered-defense competition
          detail: Primes and directed-energy vendors compete for the same budget envelope
        - id: conversion
          label: Program conversion risk
          detail: Pilots and demos may not become repeat procurement lines
        - id: support
          label: Support burden
          detail: Manufacturing, integration, training, and sustainment scaling
        - id: revenue
          label: Revenue timing risk
          detail: Delivery and repeat-award timing can slip
        - id: valuation
          label: Valuation compression
          detail: Narrative weakens if revenue conversion lags
      edges:
        - from: policy
          to: conversion
          label: Can delay fielding approvals
        - from: export
          to: revenue
          label: Can defer international deliveries
        - from: army_budget
          to: conversion
          label: Concentrates line-item risk
        - from: field_data
          to: conversion
          label: Weakens buyer confidence
        - from: competition
          to: conversion
          label: Steers awards to other architectures
        - from: support
          to: revenue
          label: Constrains scaling and service quality
        - from: conversion
          to: revenue
          label: Slower repeat procurement
        - from: revenue
          to: valuation
          label: Undercuts growth narrative
    claimRefs:
      - CR008
      - CR014
      - CR017
      - CR023
      - CR037
      - CR044
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      ACS depends on buyers, regulators, C2 stack owners, and prime-led architectures, not only on its own hardware
      roadmap.
    data:
      nodes:
        - id: acs
          label: Allen Control Systems
          detail: Autonomous kinetic counter-drone vendor
        - id: army
          label: U.S. Army / DoD
          detail: Primary visible domestic buyer and budget owner
        - id: allies
          label: Allied armed forces
          detail: Korea, UAE, and Romania pathway
        - id: regulators
          label: DDTC / BIS / foreign-disclosure reviewers
          detail: Export and transfer approvals
        - id: c2
          label: ATAK / FAAD C2 / Lattice owners
          detail: Architecture and integration chokepoints
        - id: primes
          label: Raytheon / Leonardo / other primes
          detail: Bundle C-UAS into larger air-defense stacks
        - id: adjacent
          label: Dedrone / DroneShield / Epirus
          detail: Upstream C2, sensor, and DEW alternatives
        - id: manufacturing
          label: Austin manufacturing + service org
          detail: Throughput and sustainment execution
        - id: field_units
          label: End users
          detail: Need training, trust, and operational evidence
      edges:
        - from: army
          to: acs
          label: Domestic budget and procurement
        - from: allies
          to: acs
          label: International demand
        - from: regulators
          to: allies
          label: Approve transfers
        - from: c2
          to: acs
          label: Integration access
        - from: primes
          to: army
          label: Compete for program dollars
        - from: adjacent
          to: army
          label: Compete for architecture role
        - from: manufacturing
          to: acs
          label: Build and support capacity
        - from: acs
          to: field_units
          label: Training and deployed performance
    claimRefs:
      - CR018
      - CR027
      - CR028
      - CR029
      - CR041
      - CR042
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The call resolves to track because strong category and product signals are offset by a large disclosure gap at the
      current price.
    data:
      nodes:
        - id: market
          label: Market need
          detail: Counter-UAS demand is rising across defense and homeland missions.
          tone: positive
        - id: product
          label: Product proof
          detail: ACS has real demo and award evidence, not just a concept slide.
          tone: positive
        - id: price
          label: Price
          detail: $2.2B post-money implies scale expectations far above current public economics.
          tone: warning
        - id: risk
          label: Risks
          detail: Autonomy policy, exports, and concentration can all compress the multiple.
          tone: warning
        - id: call
          label: Recommendation
          detail: track / medium confidence / high risk / stretched
          tone: neutral
      edges:
        - from: market
          to: call
          label: Supports attention
        - from: product
          to: call
          label: Supports seriousness
        - from: price
          to: call
          label: Prevents buy
        - from: risk
          to: call
          label: Forces discount
    claimRefs:
      - CV017
      - CV011
      - CV013
      - CV041
      - CV043
      - CV044
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: The current mark is most sensitive to evidence of economic conversion, not to more demo headlines.
    data:
      items:
        - label: No revenue disclosure
          value: 20
        - label: Awards and demos only
          value: 35
        - label: Visible repeat orders
          value: 60
        - label: Material contract scale
          value: 80
        - label: Revenue and margin disclosure
          value: 100
    approximationNotes: >-
      Values are directional valuation-support scores rather than multiples; they illustrate that disclosure and
      procurement conversion matter more than incremental narrative milestones.
    claimRefs:
      - CV013
      - CV014
      - CV030
      - CV033
      - CV035
      - CV037
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Scenario-based ranges centered on the June 2026 Series B mark.
    data:
      items:
        - label: Bull case valuation (USD B)
          low: 2.8
          mid: 3.2
          high: 3.6
          displayValue: $2.8B-$3.6B
          detail: Requires visible repeat programs, manufacturing scale, and some export conversion.
          tone: positive
        - label: Base case valuation (USD B)
          low: 1.6
          mid: 2
          high: 2.4
          displayValue: $1.6B-$2.4B
          detail: Assumes demand holds and ACS keeps progressing, but economics remain mostly private.
          tone: neutral
        - label: Bear case valuation (USD B)
          low: 0.8
          mid: 1
          high: 1.3
          displayValue: $0.8B-$1.3B
          detail: Assumes pilot-like adoption persists and sector multiples cool.
          tone: negative
        - label: Current round mark (USD B)
          low: 2.2
          mid: 2.2
          high: 2.2
          displayValue: $2.2B
          detail: Official Series B post-money valuation.
          tone: neutral
    approximationNotes: >-
      Ranges are disciplined estimates derived from comparable financings, contract visibility, and disclosure quality
      rather than from management forecasts.
    claimRefs:
      - CV003
      - CV038
      - CV039
      - CV040
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style view of ACS as of 2026-06-08.
    data:
      items:
        - label: Market opportunity
          value: 8 / 10
