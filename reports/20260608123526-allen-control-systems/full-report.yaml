  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Factor
      - Direction
      - Timing
      - Evidence
      - Implication for ACS
      - Diligence ask
    rows:
      - - Drone-swarm cost asymmetry
        - Driver
        - Now
        - Cheap drones versus expensive missiles and interceptors
        - Favors low-cost kinetic solutions that use common weapons
        - Request customer data on engagement cost versus incumbent effectors
      - - Jamming-resistant or autonomous drones
        - Driver
        - Now
        - Seed-round and WarQuants sources say some drones continue missions when jammed
        - Supports hard-kill terminal-defense demand
        - Request test data versus fiber-optic, autonomous, and swarm targets
      - - Rapid demo-to-field procurement
        - Driver
        - 12-24 months
        - xTech, TREX, JCO, and DHS all reward visible field experimentation
        - Companies that can integrate fast win budget attention faster
        - Request conversion rates from demo to contract and unit fielding
      - - Human-judgment and test requirements
        - Constraint
        - Persistent
        - DoDD 3000.09 requires appropriate human judgment and rigorous testing
        - Slows software release tempo and broad autonomy claims
        - Request verification, V&V, safety, and operator-approval design package
      - - Civilian active-mitigation authority
        - Constraint
        - Persistent
        - DOJ, DHS, and Fortune imply authority remains fragmented outside military settings
        - Critical-infrastructure revenue may route through government partners, not direct private self-help
        - Request site-by-site authority matrix for airports, utilities, ports, and venues
      - - Export controls
        - Constraint
        - Persistent
        - DDTC administers ITAR and BIS manages export licensing
        - Allied demand is real but timing is gated by approvals and classification
        - Request product classification, license history, and target-country queue
      - - Layered competition
        - Mixed
        - Now to 36 months
        - Epirus, Dedrone, DroneShield, and Leonardo DRS attack adjacent layers or larger integrated programs
        - ACS must win as the hard-kill/autonomous layer inside a stack
        - Request clear partner / prime strategy and interface roadmap
    notes: >-
      The strongest drivers are economic and tactical, while the hardest constraints are governance and integration. The
      table intentionally distinguishes immediate demand from actual fielding pace.
