        - DoD policy chain and operators
        - DoDD 3000.09 requires human judgment, V&V, and realistic T&E
        - Defines how autonomous ACS can actually be in deployment
        - Request engagement-mode documentation and approval workflow
      - - Homeland / critical-infrastructure authority
        - Commanders, law enforcement, DHS, DOJ, and site operators
        - Policy is expanding, but site procedures and authority still matter
        - Determines whether critical infrastructure is direct revenue or channel revenue
        - Build a site-type authority matrix with real customer examples
      - - Export licensing
        - DDTC and BIS
        - ITAR and export-license regimes are explicit, but product-specific treatment is undisclosed
        - Can slow allied bookings or restrict feature sets
        - Request ECCN / USML classification and export roadmap
      - - Interoperability / stack fit
        - Military customers, primes, and integrators
        - ACS, Epirus, and Leonardo all emphasize FAAD C2 or common-C2 interoperability
        - The winning vendor may be the one that integrates most cleanly into layered defense
        - Request interface standards, partner list, and prime-contractor strategy
    notes: >-
