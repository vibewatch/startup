              Deployment evidence is stronger than the documentation surface. Official product pages say Bullfrog can
              plug into common command-and-control stacks including ATAK, FAAD C2, and Lattice; secondary reporting adds
              Linux-based software, bidirectional target-track exchange, and both autonomous and semi-autonomous
              operating modes. Public demos show the operating flow ACS wants buyers to trust: passively detect,
              classify, track, compute a shot, request or preserve human release authority, and engage with a
              service-common weapon. Maturity signals come from outside pure marketing copy. Tectonic described Bullfrog
              as a full kill-chain system and reported shipment to a first official customer. ACS’s Project Convergence
              release claimed seven in-range drone kills, sub-two-minute setup, and operator qualification of more than
              forty soldiers in under thirty minutes. The xTechOverwatch win and Direct-to-Phase-II path matter for the
              same reason: they suggest the Army is treating Bullfrog as more than a concept demo. Even so, the
