      - number: '6.2'
        title: Adoption Trajectory from Demo to Delivery
        blocks:
          - type: paragraph
            body: >
              The public adoption path runs from operational demonstrations into early customer delivery, not yet into
              transparent fleet-scale procurement. ACS first used T-REX and later Project Convergence to prove
              Bullfrog's usability, rapid setup, and drone-kill outcomes in Army-facing environments. xTechOverwatch
              then moved the company into a more formal Army demand signal, with ACS publicly tying the win to a $2
              million Direct to Phase II SBIR award and Army-owned materials describing direct work with Transformation
              in Contact formations. Tectonic added a key commercial milestone in March 2026 when it reported that ACS
              had shipped a Bullfrog to its first official customer. By June 2026, ACS said Bullfrog was already
              deployed with the U.S. Army and U.S. Navy. The AAL five-vehicle integration plan and later allied
              contracts suggest the company is moving from isolated demonstration success toward repeatable platform
              adoption, but the public record still lacks unit counts, order quantities, or conversion rates from demos
