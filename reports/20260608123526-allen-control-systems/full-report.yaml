      - number: '4.2'
        title: Pricing proxies and unit-economics drivers
        blocks:
          - type: paragraph
            body: >-
              ACS publishes no Bullfrog list price, discount schedule, or realized contract pricing, so the public
              financial picture has to rely on pricing proxies. The strongest published proxy is the repeated claim that
              Bullfrog can deliver cost-per-kill as low as $10 by using existing service-common weapons and ammunition
              rather than scarce interceptors. The product pages also emphasize compatibility with common C2 systems and
              familiar weapon platforms, which strengthens the affordability argument by implying lower integration
              burden for customers that already own those weapons. Project Convergence adds two additional adoption
              proxies: over 40 soldiers reportedly qualified in under 30 minutes, and the system moved from storage to
              readiness in under two minutes.


              Those proxies are directionally useful but incomplete. They say something about variable cost per
              engagement, setup time, and training friction, yet they say almost nothing about the higher-stakes
              financial questions that determine gross margin: the bill of materials for the turret, sensor stack, and
              control system; installation cost per platform; field-service burden; spare parts; ammunition consumption
              in live operations; and the cost of any attach software or data services. The same gap exists on GTM
              efficiency. There is no public CAC, sales-cycle duration, proposal win rate, or payback disclosure. So the
              right underwriting view is that ACS has a credible affordability story on the battlefield, but not yet a
              public unit-economics story for investors.
