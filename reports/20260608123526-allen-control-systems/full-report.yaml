          claimRefs:
            - CV022
            - CV023
            - CV025
            - CV046
        - label: Valuation discipline
          value: 4 / 10
          status: gap
          note: Current mark looks stretched until disclosure improves or the price resets.
          claimRefs:
            - CV041
            - CV044
            - CV045
    approximationNotes: Scores are analyst-assigned diligence scores rather than company-reported metrics.
    claimRefs:
