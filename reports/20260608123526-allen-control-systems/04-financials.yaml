company:
  name: Allen Control Systems
chapter:
  number: 4
  title: Financials
  summary: Allen Control Systems has disclosed at least $242 million of equity financing through a $12 million seed, a $30 million Series A, and a $200 million Series B at a $2.2 billion post-money valuation, plus a smaller but real layer of publicly countable government-linked awards. Public evidence supports a broader revenue surface than Bullfrog hardware alone — including integration, training, sustainment, unbundled fire control, passive detection, and training data — but the company does not disclose revenue, ARR, gross margin, burn, runway, unit ASP, or most contract values, so the financial underwrite remains blocked on private data.
sections:
- id: revenue-surface
  title: Revenue streams and recognition shape
  body: 'ACS'' public commercial surface is broader than a single Bullfrog turret SKU, even though management still leads with the weapon station in most announcements. The official capabilities pages show three monetizable layers that can sit beside or underneath a Bullfrog sale: passive drone detection, an autonomous fire-control stack that can be unbundled from Bullfrog and embedded in other remote weapon stations, and synthetic training-data generation sold as a concierge service. The international contracts release adds a fourth layer by explicitly packaging operator training, technical assistance, and sustainment with system delivery. That matters because the financial model is probably a blend of lumpy hardware revenue and attach-rate-dependent service or software revenue rather than a pure hardware-only business.


    Public evidence is still too thin to quantify mix. ACS does not disclose how often capabilities are sold standalone, whether passive detection or training-data work is already monetized outside Bullfrog programs, or what share of announced international work is support versus hardware. But the shape is visible enough to underwrite a direction of travel: hardware is the spear point, while support, software/control, and data services are the path to a cleaner recurring layer. Recognition likely follows a mixed pattern of shipment or acceptance milestones for systems and time-based recognition for training, sustainment, and integration work, which is a more complex revenue-quality profile than a straightforward recurring SaaS contract.'
