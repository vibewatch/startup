  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: public-revenue-disclosure
    missingEvidence: Recognized revenue, ARR, shipped-unit counts, and backlog conversion by program.
    whyItMatters: Without revenue quality data, investors cannot separate prototype activity from scaled production demand.
    diligencePath: Request monthly revenue by customer/program, booked backlog roll-forward, and shipped installed-base data.
    relatedQuestionRefs:
    - QI006
    - QI014
    - QI015
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-inputs
    missingEvidence: Bill of materials, labor absorption, installation cost, support burden, ASP, and gross margin by SKU.
    whyItMatters: The public affordability story cannot be converted into a gross-margin or payback model without these inputs.
    diligencePath: Request SKU-level unit economics model, field-service cost assumptions, and pricing waterfall by contract type.
    relatedQuestionRefs:
    - QI006
    - QI007
    - QI011
    - QI013
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, debt schedule, and management runway cases.
    whyItMatters: Series B size alone does not reveal how long ACS can fund manufacturing expansion before needing more capital.
    diligencePath: Request current balance sheet, cash-burn bridge, debt or equipment-finance schedule, and board runway plan.
    relatedQuestionRefs:
    - QI019
    - QI020
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: undisclosed-contract-values
    missingEvidence: Signed contract values, options, milestones, and term lengths for JIATF 401, SOF, Korea/UAE, and Romania work.
    whyItMatters: Opaque program economics block revenue forecasting, customer concentration analysis, and collection modeling.
    diligencePath: Request redlined contract summaries or full contracts with payment milestones and scope definitions.
    relatedQuestionRefs:
    - QI010
    - QI017
    - QI024
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: financing-trigger
    missingEvidence: Board-approved milestone plan for when ACS would next raise capital and what KPIs must be hit first.
    whyItMatters: The difference between a discretionary growth round and a forced financing materially affects risk and valuation.
    diligencePath: Request management operating plan, financing scenarios, and KPI triggers tied to manufacturing and recurring revenue.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
