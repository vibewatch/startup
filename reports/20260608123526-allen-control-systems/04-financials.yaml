  rows:
  - - Bullfrog hardware systems
    - Weapon-station sales tied to specific platforms or defense programs
    - System / platform integration
    - Multiple SKUs public; deployments and contracts announced; ASP undisclosed
    - Likely lumpy and milestone-based until production ramps
    - Request shipped units, backlog, acceptance milestones, and ASP by SKU
  - - Unbundled autonomous fire control
    - Control stack sold or licensed into third-party remote weapon stations
    - System integration or software/control package
    - Official page says unbundling is possible; no public standalone deal count
    - Potentially higher-margin than full hardware if real
    - Request standalone bookings, pricing model, and software gross margin
  - - Passive drone detection
    - Camera-based detection capability embedded in customer systems
    - Integration project or software-enabled capability
    - Official page markets ACS cameras or customer cameras; no disclosed customer count
    - Could diversify revenue beyond kinetic systems
    - Request paid deployments, pricing basis, and renewal terms
  - - Synthetic training data generation
    - Photorealistic labeled datasets and expert services for CV models
    - Dataset package / service engagement
    - Official page presents it as a sellable capability; no public revenue disclosure
    - Could behave like project revenue with recurring refreshes
    - Request signed contracts, dataset pricing, and attach rate to Bullfrog programs
  - - Training, technical assistance, and sustainment
    - Post-delivery services bundled with program awards
    - Training day, support term, sustainment package
    - International contract release explicitly includes these elements
    - Higher-quality than one-time hardware if attach is strong
    - Request support attach rates, service margins, and contract duration
  - - Prototype and integration engineering
    - Prize, SBIR, and platform-integration contracts fund prototype work
    - Award / integration contract
    - xTech and AAL contracts are public; broader program economics are not
    - Good non-dilutive bridge revenue but not proof of scaled product-market fit
    - Request prototype-to-production conversion data and follow-on revenue by program
  notes: Rows describe publicly visible monetization surfaces. ACS does not disclose actual revenue mix, booked revenue, or recognition policy by stream.
