- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Revenue
    - Without recognized revenue, the market cannot distinguish pilots from scaled production business
    - Request monthly and quarterly revenue by program, customer, and revenue-recognition bucket
  - - ARR / recurring software and support revenue
    - Needed to test whether the non-hardware layer is meaningful or merely optional marketing surface
    - Request software, sustainment, and training ARR with logo count and attach rate
  - - Gross margin by SKU
    - Core test of whether Bullfrog can scale economically at manufacturing volume
    - Request BOM, labor, freight, installation, field service, and warranty assumptions by SKU
  - - Cash balance and burn
    - No solvency or runway model is possible without them
    - Request current balance sheet plus trailing twelve month cash-burn bridge
  - - Runway under management plan
    - Determines urgency of the next raise and negotiation leverage
    - Request board-approved budget with base, upside, and downside runway cases
  - - Contract values for JIATF 401 / SOF / Korea / UAE / Romania
    - Opaque economics block revenue forecasting and customer concentration analysis
    - Request signed contracts, payment milestones, options, and scope documents
  - - Backlog, booked orders, and repeat-order rate
    - Needed to tell prototype demand from repeatable procurement demand
    - Request backlog roll-forward and program conversion funnel
  - - Realized ASP and discounting
    - List-like proxies are not enough to test pricing power or margin resilience
    - Request invoice-level ASP by SKU and customer class
  - - Support attach and sustainment margin
    - Recurring service quality matters more than headline system wins
    - Request support attach, renewal rates, and service gross margin by cohort
  - - Customer concentration and collection timing
    - A few defense programs could dominate near-term cash generation
    - Request top-customer exposure, milestone invoicing schedule, and DSO by program
  notes: These are the key blockers to underwriting ACS from public evidence alone. The chapter intentionally states that revenue, ARR, gross margin, burn, runway, and most contract values are not publicly disclosed.
