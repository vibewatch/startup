    - Not publicly disclosed
    - No reviewed source provides a bank balance
    - Cannot convert disclosed fundraising into real solvency analysis
    - Request current balance sheet and unrestricted cash schedule
  - - Monthly burn
    - Not publicly disclosed
    - No reviewed source provides operating burn
    - Runway cannot be sized from funding announcements alone
    - Request monthly cash burn bridge and hiring plan
  - - Runway months
    - Not publicly disclosed
    - No reviewed source provides runway guidance
    - Capital adequacy remains a judgment call rather than a model
    - Request management runway case under base / upside / downside scenarios
