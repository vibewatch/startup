company:
  name: Allen Control Systems
chapter:
  number: 6
  title: Customers
  summary: 'Allen Control Systems has real named customer proof, but it is concentrated in defense buyers and still light on steady-state deployment economics. Public evidence supports Army, Navy, SOF, and allied-military adoption, with the Army the strongest named account because ACS shows a path from demonstrations and xTechOverwatch to an Army Applications Lab integration award and company-stated deployment. Allied proof improved materially with the South Korea and UAE contracts, which include training, technical assistance, and sustainment. However, ACS does not publicly disclose customer count, renewals, NRR/GRR, or branch-level revenue concentration, and the visible federal award record remains Army-centric. Critical infrastructure is a plausible adjacent segment, but no named civilian customer is public.

    '
sections:
- id: customer-segmentation
  title: Customer Segmentation by Buyer, User, and Payer
  body: 'ACS''s public customer map is overwhelmingly government-defense led. The buyer is usually a government program, innovation, or procurement office; the user is the operator on a vehicle, vessel, formation, or fixed site; and the payer is a defense budget rather than a commercial enterprise. The Army is the clearest segment because public evidence spans Army-sponsored competitions, demonstrations, and a later vehicle-integration contract. The Navy appears as a deployed user in ACS''s June 2026 Series B release, but the company does not identify a Navy program office, hull, or unit. Special Operations is a distinct maritime sub-segment through the SOF contract announced with ManTech. Allied militaries are now a second paying segment via the Republic of Korea and UAE contracts, while Romania is better treated as pipeline evidence because the public artifact is an MOU for co-production. Product pages also position Bullfrog for power substations and fixed-site defense, but no named civilian
    critical-infrastructure customer is publicly disclosed.

    '
  claimRefs:
