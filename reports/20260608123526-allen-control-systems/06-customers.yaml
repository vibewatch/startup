- calloutType: insight
  title: The Army Is the Wedge Customer, but Public Spend Still Looks Early-Stage
  body: 'Army-owned events, xTechOverwatch, PCC5, the AAL integration plan, and the USAspending recipient profile all point to the Army as ACS''s clearest wedge customer. That is positive because it shows real pull from the most relevant buyer. It is also a concentration risk because the visible public award base still appears heavily Army-linked and prototype-heavy.

    '
