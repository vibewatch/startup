- id: retention-and-expansion
  title: Retention, Repeat Usage, and Expansion Signals
  body: 'Public evidence is much better on initial adoption than on durability. ACS does not disclose active customer count, contract length, NRR, GRR, churn, or any satisfaction metric, so there is no quantitative way to assess whether Bullfrog customers renew, reorder, or expand across multiple programs. The strongest positive signal is structural rather than statistical: the allied contracts bundle hardware delivery with operator training, technical assistance, and sustainment, which implies a services layer that could deepen account stickiness after the first sale. The Army Applications Lab vehicle-integration plan creates a second clear expansion loop because one approved software-and-control stack could spread across several combat platforms. Product pages also show multiple weapon variants and deployment environments, which expands wallet share within a single account once approvals exist. But these are expansion possibilities, not verified repeat purchases. Investors should therefore
    treat retention and expansion as plausible but unproven until management provides reorder history, sustainment renewal cadence, and hardware-versus-services revenue mix.

    '
  claimRefs:
  - CU018
  - CU021
  - CU028
  - CU029
  - CU030
  - CU031
  - CU032
  - CU033
  - CU042
  tableRefs:
  - TU004
- id: concentration-and-procurement-friction
  title: Concentration Risk, Procurement Friction, and Adverse Signals
  body: 'Customer concentration is the biggest public blind spot. USAspending''s recipient snapshot shows visible federal awards only from DOD and the Department of the Army, totaling about $3.55 million at the time of review. That almost certainly understates ACS''s total customer traction because it may not capture newer Navy and allied contracts, but it still suggests that the visible book of business is heavily Army-linked and early-stage. The procurement profile also remains lumpy: xTechOverwatch is a competition, PCC5 and T-REX are demonstrations, and the AAL award is an integration-readiness contract rather than a disclosed program of record. Critical infrastructure is a plausible adjacency because DOJ and DHS documents describe real domestic counter-drone demand and ACS product pages cite fixed-site defense, yet there is still no named civilian customer. Finally, Human Rights Watch''s March 2026 criticism of accelerated autonomous-weapons adoption is not a customer complaint about
    ACS specifically, but it is a credible adverse policy signal that could complicate broader procurement debates or slow adoption outside purely military channels.

    '
