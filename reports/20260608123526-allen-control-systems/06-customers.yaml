figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: 'Defense customer journey from threat recognition to deployment and multi-platform expansion.

    '
  data:
    nodes:
    - id: ju1
      label: Threat Recognition
      description: 'Military unit, installation, or sponsor identifies a counter-drone gap for moving formations, maritime assets, or fixed infrastructure. DHS and DOJ materials also show a parallel homeland demand adjacency for events and critical infrastructure, but ACS has no named civilian customer yet.

        '
    - id: ju2
      label: Evaluation and Demo
      description: 'Army-facing events such as T-REX, Project Convergence, and xTechOverwatch provide the first serious proof surface. Buyers evaluate cost-per-kill, usability, mobility, and whether Bullfrog can integrate with existing C2 and weapons.

        '
    - id: ju3
      label: Contracting Path
      description: 'The purchase path can run through a government office directly, through an innovation / SBIR channel, or through a prime / integrator such as ManTech. The Army is the clearest example of this layered contracting path.

        '
    - id: ju4
      label: Integration and Training
      description: 'The customer integrates Bullfrog onto a platform or site and trains operators. ACS has publicly highlighted rapid operator qualification and platform-integration work across multiple Army vehicles.

        '
    - id: ju5
      label: Deployment and Sustainment
      description: 'Evidence of deployment exists for the U.S. Army, U.S. Navy, and allied militaries, but the public record rarely discloses unit counts. Allied contracts also reference technical assistance, operator training, and sustainment.

        '
    - id: ju6
      label: Expansion Loop
      description: 'Once a customer trusts the stack, expansion could happen across weapon variants, more platforms, more branches, or new geographies. The largest unproven branch of this journey is critical infrastructure, where ACS shows use-case fit but no named public customer.

        '
  approximationNotes: 'The stages are reconstructed from public demos, contract announcements, and product pages. No internal funnel conversion, time-to-close, or renewal timing data is public.

