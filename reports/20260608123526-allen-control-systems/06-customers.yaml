callouts:
- calloutType: risk
  title: Customer Proof Is Real but Renewal Visibility Is Almost Zero
  body: 'ACS has progressed beyond zero-customer speculation: the public record supports Army, Navy, SOF, and allied-military adoption. But every durability metric investors typically want — active customer count, reorders, NRR, GRR, churn, and contract duration — remains undisclosed. That means the chapter can confirm customer existence more confidently than customer stickiness.

    '
  claimRefs:
