- id: adoption-trajectory
  title: Adoption Trajectory from Demo to Delivery
  body: 'The public adoption path runs from operational demonstrations into early customer delivery, not yet into transparent fleet-scale procurement. ACS first used T-REX and later Project Convergence to prove Bullfrog''s usability, rapid setup, and drone-kill outcomes in Army-facing environments. xTechOverwatch then moved the company into a more formal Army demand signal, with ACS publicly tying the win to a $2 million Direct to Phase II SBIR award and Army-owned materials describing direct work with Transformation in Contact formations. Tectonic added a key commercial milestone in March 2026 when it reported that ACS had shipped a Bullfrog to its first official customer. By June 2026, ACS said Bullfrog was already deployed with the U.S. Army and U.S. Navy. The AAL five-vehicle integration plan and later allied contracts suggest the company is moving from isolated demonstration success toward repeatable platform adoption, but the public record still lacks unit counts, order quantities,
    or conversion rates from demos to scaled procurement.

    '
  claimRefs:
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU019
  - CU037
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: named-customer-proof
  title: Named Customer Proof and Production Maturity
  body: 'The strongest named customer proof belongs to the U.S. Army because the proof stack spans Army-owned sources, company releases, and later contracting. The U.S. Navy is named as a deployed user, but only in ACS''s own Series B announcement, so the quality of proof is materially lower than for the Army. The maritime SOF contract is a strong reference account because it signals selection by an operationally demanding user set, but the disclosed scope is still platform integration rather than fleet-scale deployment. Allied proof improved materially in November 2025 when ACS announced contracts with the Republic of Korea Armed Forces and UAE Armed Forces, including support, operator training, technical assistance, and sustainment. That language reads as genuine customer proof rather than a prize or lab exercise. Even so, nearly every named row still has a caveat: public outcomes are thin, delivery schedules are undisclosed, and only the Army has more than one independent public breadcrumb.
    The chapter therefore treats Army proof as strongest, allied proof as real but narrow, Navy proof as thin, and SOF proof as high-quality but still early-stage.

    '
  claimRefs:
  - CU003
  - CU017
  - CU018
  - CU020
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
