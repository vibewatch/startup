  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-roster
    missingEvidence: A complete named customer roster with customer name, branch or country, deployment status, first delivery date, and installed-unit count.
    whyItMatters: The public roster is partial, which limits any attempt to calculate customer breadth, vertical concentration, or proof quality by account.
    diligencePath: Request a customer list or at least top-10 active accounts with deployment status and reference availability.
    relatedQuestionRefs:
    - QU001
    - QU008
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Customer-count history, GRR, NRR, churn, renewal dates, option exercises, and support-ticket or satisfaction metrics.
    whyItMatters: Without durability metrics, the chapter cannot distinguish a promising first-order pipeline from a sticky installed base.
    diligencePath: Ask management for cohort retention tables, reorder history, contract terms, and customer reference calls by segment.
    relatedQuestionRefs:
    - QU016
    - QU017
    - QU018
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Revenue split by branch, country, and top customer or program; hardware-versus-services mix; and backlog by customer.
    whyItMatters: The visible public book looks Army-centric, but investors cannot quantify top-customer risk or true diversification from public sources alone.
    diligencePath: Request top-10 customer concentration, backlog, and revenue mix by customer type in management diligence.
