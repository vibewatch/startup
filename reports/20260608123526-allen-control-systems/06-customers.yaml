  - - Allied militaries
    - 'Buyer: foreign armed-force procurement offices; User: operators and maintainers; Payer: sovereign defense budgets'
    - Counter-drone defense plus training, support, and sustainment
    - Two named contract customers plus Romania MOU nearby
