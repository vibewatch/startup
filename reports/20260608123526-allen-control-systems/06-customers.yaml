    - TU006
  - type: missing-source
    severity: material
    topic: critical-infrastructure
    missingEvidence: A named civilian, homeland-security, or critical-infrastructure customer reference for ACS, including scope and authority pathway.
    whyItMatters: Critical infrastructure is one of the clearest adjacent TAM narratives, but without named proof it should not be modeled as an active segment.
    diligencePath: Request named pilots, paid proofs of concept, or integrator agreements tied to fixed-site or public-safety deployments.
