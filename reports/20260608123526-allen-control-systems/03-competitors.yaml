    - Pricing is embedded inside larger vehicle and air-defense architectures
    - Incumbents can wrap C-UAS inside broader contracts that ACS cannot match
  - - Anduril / Shield AI
    - No public price
    - Platform, software, and large program contracting; capital scale disclosed via fund-raising reports
    - Autonomy and C2 can be bundled into broader programs without revealing per-system economics
    - ACS can be flanked from the program layer even when Bullfrog is tactically differentiated
  - - Status quo / internal build
    - Often hidden inside existing vehicle, base-defense, or integrator budgets
    - Upgrade path rather than new standalone line item
    - A buyer may try to extend existing remote weapon stations before buying a new niche system
    - ACS must prove lower integration friction and better autonomous performance than incremental upgrades
