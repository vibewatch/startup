  - - Autonomous fire-control software on common weapons
    - Primes or integrators replicate enough autonomy inside broader C-UAS stacks
    - High
    - ACS unbundles fire control and already advertises common C2 compatibility
    - Obtain independent hit-rate and integration benchmarks versus incumbent remote weapon station upgrades
  - - Low cost-per-kill using common ammunition
    - Directed energy or jammer solutions win on one-to-many economics in fixed-site swarm defense
    - Medium
    - ACS is strongest where hardened drones or mobile hosts weaken pure RF or HPM alternatives
    - Compare full mission economics by threat type, host platform, and power availability
  - - Passive detection plus low-SWaP deployment
    - Sensor specialists offer better airspace awareness or larger sensor suites
    - Medium
    - ACS can integrate external C2 and sensors rather than insist on a closed stack
    - Validate detection range, false positives, and handoff quality in layered deployments
  - - Open-architecture integration
    - The same openness lowers switching costs and enables multi-homing
    - High
    - Ease of insertion can accelerate first win even if it weakens long-term lock-in
    - Review contract terms for software updates, retraining rights, and integration ownership
  - - Allied export traction
    - Prime contractors out-support ACS on regional offices, depot support, and sustainment
    - Medium
    - ACS is already pairing contracts with training, technical assistance, and regional-office buildout
    - Request support-headcount, partner, and spares-plan detail for each export market
  - - Category uniqueness as autonomous gun station
    - Early category can remain small, or buyers may default to upgraded status-quo systems
    - Medium
    - ACS can widen moat by proving reuse of sensing and control modules beyond Bullfrog
    - Test whether pipeline includes non-Bullfrog licenses or only turret-driven revenue
