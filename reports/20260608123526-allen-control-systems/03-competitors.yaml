chapter:
  number: 3
  letter: P
  title: Competitors
  summary: 'ACS competes from a narrow but differentiated position: Bullfrog is a close-in autonomous kinetic weapon station, while most alternatives are substitutes or adjacent layers such as directed-energy systems, detection-and-jamming stacks, autonomy primes, and incumbent integrated C-UAS suites. The moat is real at low-SWaP autonomous gunnery and reusable fire control, but it is only moderately durable because larger primes can bundle sensors, C2, sustainment, and multiple effectors around the same mission.'
