  evidenceGaps:
  - type: access-blocked
    severity: material
    topic: export controls
    missingEvidence: Commodity jurisdiction, USML/ECCN classification, and specific license path for Bullfrog exports to Korea, UAE, and any Romanian co-production transfer.
    whyItMatters: Without the exact classification and licensing path, investors cannot estimate delivery timing, compliance cost, or the risk that approvals slip revenue recognition.
    diligencePath: Request DDTC/BIS counsel memo, export classification worksheet, and any filed or planned license applications tied to the announced allied contracts.
    relatedQuestionRefs:
    - QR015
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: manufacturing scale
    missingEvidence: Post-Series-B production throughput, backlog, yield, installed tooling, and field-service staffing metrics for Austin and any partner production lines.
    whyItMatters: Manufacturing scale is the gating mitigation for both customer concentration and valuation; without hard throughput data the production story is still narrative-driven.
    diligencePath: Request monthly production dashboard, backlog by customer, service-headcount plan, and manufacturing ramp assumptions used in the Series B model.
    relatedQuestionRefs:
    - QR017
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: operational field data
    missingEvidence: Independent after-action reporting, miss-rate data, false-positive data, and sustainment outcomes from Army or Navy field use beyond controlled demonstrations.
    whyItMatters: The biggest residual technical risk is whether Bullfrog's test-event performance survives operational clutter, decoys, weather, and varying crews.
    diligencePath: Request unit-level test reports, operational evaluation summaries, and any safety or incident logs from deployed Army and Navy users.
    relatedQuestionRefs:
    - QR021
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: c2 integration
    missingEvidence: Named fielded integrations, validated third-party interface documents, and sustainment responsibilities for ATAK, FAAD C2, Lattice, and allied C2 stacks.
    whyItMatters: If ACS only demonstrates compatibility in marketing decks, primes and C2 owners can still control the budget and integration chokepoints.
    diligencePath: Request interface-control documents, completed integration test plans, and customer references for each claimed C2 stack.
    relatedQuestionRefs:
    - QR024
    relatedTableRefs:
    - TR003
