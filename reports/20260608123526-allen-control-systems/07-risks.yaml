    statement: ACS markets Bullfrog as an autonomous weapon station that detects, tracks, identifies, and acquires targets autonomously while still requiring an operator command to fire.
    type: company-claimed
    topic: product autonomy
    sourceRefs:
    - SR013
    - SR014
    confidence: high
    freshness: current
    answersQuestionRefs:
