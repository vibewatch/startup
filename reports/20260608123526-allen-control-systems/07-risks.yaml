- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Autonomy-policy drag
    - Formal autonomy review or safety qualification slips
    - No credible review package or human-judgment evidence by the next major U.S. procurement milestone
    - Mark U.S. fielding conversion assumptions down and treat valuation as narrative-led
  - - Procurement concentration
    - Pilot-to-program conversion
    - No repeat funded line or no expansion beyond narrow experimentation / special-mission users by FY2027 budgeting
    - Assume slower domestic revenue ramp and higher future dilution risk
  - - Export-control friction
    - License or foreign-disclosure timing
    - Korea/UAE/Romania deals fail to progress into disclosed deliveries within expected sales windows
    - Reduce confidence in international diversification and working-capital timing
  - - Manufacturing opacity
    - Disclosure of throughput and support readiness
    - Management still cannot show backlog, output, repair cycle, and service staffing after the Series B ramp period
    - Treat scaling claims as unproven and haircut gross-margin assumptions
  - - Battlefield-performance drift
    - Independent field data quality
    - No independent operating data or rising evidence of misses, decoy problems, or false positives after deployment
    - Move the company from high-growth execution risk to thesis-break technical risk
  - - Competitive crowding
    - Architecture ownership in awards
    - Major budgets increasingly go to layered or directed-energy stacks where ACS is absent or demoted to a minor subsystem
    - Reframe the company as a niche component vendor rather than a category leader
  notes: These kill criteria are investor-facing and intentionally binary. They convert broad risk themes into measurable milestones that should change underwriting, not just monitoring rhetoric.
