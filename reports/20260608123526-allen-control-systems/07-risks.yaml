    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR001
  - id: CR002
    statement: The same directive requires training, transparent human-machine interfaces, verification and validation, and potentially senior-level review before broader fielding of autonomous weapon systems.
    type: third-party-reported
    topic: autonomy policy
    sourceRefs:
    - SR001
    - SR004
    confidence: medium
    freshness: current
    answersQuestionRefs:
