- id: customer-concentration-and-procurement-risk
  title: Customer Concentration and Procurement Risk
  body: 'ACS has real proof that the market cares: xTechOverwatch, a SOF maritime contract, allied contracts, and company claims of Army and Navy deployment. The problem is not zero demand; it is concentration. Publicly visible federal award history still points to DoD as the sole awarding agency and the Army as the sole visible sub-agency, while the company''s public customer proof is overwhelmingly military and allied-government driven. That leaves the revenue story exposed to a narrow set of buyers whose programs move on appropriations timing, requirements documents, and evolving rules for autonomous systems.


    That concentration is amplified by how counter-UAS budgets are actually allocated. DHS is opening new funding lanes, but homeland procurement can favor layered detection and mitigation programs before it buys autonomous kinetic defeat at scale. Inside DoD, ACS is not competing in an empty lane either. CRS materials show the Army funding interceptors, high-energy lasers, microwaves, and integrated IFPC architectures in parallel. In other words, Bullfrog must win a slot inside a layered defense stack, not merely prove that drones are a growing threat.


    The government-relations hire reinforces the point. ACS added a senior Washington operator with Senate appropriations and armed-services experience because the next phase of growth depends on capture, budget line conversion, and program-of-record pathways. If pilots and experimentation events do not convert into repeat procurement, the $2.2 billion valuation will have little public revenue support.'
