  - id: CR004
    statement: Because ACS is selling an autonomous weapon station into DoD channels, scaling fielding depends on satisfying autonomy-policy evidence burdens as much as on demonstrating speed or demand.
    type: inferred
    topic: autonomy policy
    sourceRefs:
