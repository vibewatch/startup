callouts:
  - calloutType: "insight"
    title: "The Self-Scheduling Penetration Gap as Market Catalyst"
    body: "The core opportunity in healthcare appointment software is characterized by a stark structural divergence: while 89% of patients prioritize online booking capabilities, 71% of medical practices report that under a quarter of their visits are booked digitally. This gap establishes long-term secular tailwinds for integrated marketplace and scheduling vendors."
    claimRefs:
      - "CM006"
      - "CM007"
  - calloutType: "risk"
    title: "Regulatory Ambiguity and Unreimbursed Provider Friction"
    body: "Pay-per-booking fee models face dual structural friction. Providers express frustration when charged booking fees for appointments that subsequently cancel or fail to appear, while state and federal healthcare statutes that pre-date digital marketplaces introduce ongoing compliance uncertainty around referral fee characterization."
    claimRefs:
      - "CM015"
      - "CM016"
