evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited GAAP income statements, annual revenue, gross margins, and net bookings volume for fiscal years 2024
      through 2026.
    whyItMatters: >-
      Prevents precise valuation modeling, unit economics verification, and revenue multiple benchmarking against public
      digital health peers.
    diligencePath: >-
      Request confidential financial disclosures, management accounting statements, and audited income statements under
      non-disclosure agreement during formal pre-IPO diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-governance-enumeration
    missingEvidence: >-
      Full board of directors roster, independent director seats, and complete secondary governance rights across
      late-stage equity holders.
    whyItMatters: >-
      Public records enumerate key executive officers and founders but do not disclose complete current board observer
      and committee assignments.
    diligencePath: Review corporate governance records, board minutes, and voting agreements in the virtual data room.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: cap-table-stakeholder-enumeration
    missingEvidence: Comprehensive cap table, secondary ownership percentages, and post-2021 convertible instrument terms.
    whyItMatters: >-
      Public filings and secondary databases capture major institutional equity financing rounds but omit granular
      cap-table ownership percentages and debt tranches.
    diligencePath: Request the certified capitalization table and shareholder ledger from company counsel during formal underwriting.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: pricing-schedules
    missingEvidence: Granular booking fee matrices by medical specialty, geographic market tier, and practice volume brackets.
    whyItMatters: >-
      Without public itemization of per-booking tariff schedules across specialties, unit economics and bottom-up SOM
      sizing rely on estimated blended averages.
    diligencePath: Request confidential provider fee schedules and historical practice invoicing data during management diligence.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-unit-economics
    missingEvidence: >-
      Granular provider acquisition costs, marketplace commission rates, and exact per-specialty booking fee schedules
      are not publicly published across regional US markets.
    whyItMatters: >-
      Prevents exact econometric comparison of net provider revenue realization across competing digital front door
      platforms.
    diligencePath: >-
      Review vendor RFP disclosures and interview practice managers across distinct metro areas regarding realized
      booking fees and waiver approval rates.
  - type: private-evidence-only
    severity: blocking
    topic: current-revenue-and-margin-disclosure
    missingEvidence: >-
      Audited financial statements for 2024–2026 disclosing GAAP annual revenue, cost of goods sold, gross margin
      percentages, and cash flow from operations.
    whyItMatters: >-
      Without audited top-line revenue and margin performance since 2020, institutional investors cannot evaluate gross
      profit quality, customer acquisition payback, or sustainable cash conversion.
    diligencePath: >-
      Require complete management accounts, audited historical financial statements, and bridge schedules under
      institutional confidentiality.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: provider-cohort-economics-and-churn
    missingEvidence: >-
      Granular provider cohort retention curves, gross dollar churn rates, and net fee yields per booking segmented by
      medical specialty and geographic region.
    whyItMatters: >-
      High reported no-show rates and billing disputes could mask provider attrition or uneven practice economics
      despite headline marketplace volume.
    diligencePath: Request practice cohort retention datasets and fee reconciliation logs during formal confirmatory due diligence.
    relatedQuestionRefs:
      - QI003
      - QI004
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: calendar-synchronization-latency
    missingEvidence: >-
      Technical documentation specifying real-time calendar polling latency, conflict resolution algorithms, and booking
      error rates across disparate EHR systems.
    whyItMatters: Directly affects provider operational reliability and double-booking risks across high-volume clinical practices.
    diligencePath: Request engineering architecture specifications and EHR interface telemetry logs under NDA.
    relatedQuestionRefs:
      - QE003
  - type: missing-source
    severity: minor
    topic: security-audit-certifications
    missingEvidence: >-
      Third-party SOC 2 Type II audit reports, ISO 27001 certifications, and formal HIPAA compliance evaluation
      assessments.
    whyItMatters: >-
      Crucial for institutional health systems and large enterprise hospital networks evaluating enterprise data
      governance.
    diligencePath: Request Zocdoc's latest SOC 2 Type II attestation package and vendor risk assessment documentation.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: enterprise-retention-metrics
    missingEvidence: >-
      Multi-year gross retention rate (GRR), net revenue retention (NRR), and annual practice churn percentages
      disaggregated by customer segment.
    whyItMatters: >-
      Evaluating customer durability and expansion quality requires audited retention cohorts rather than top-line
      aggregate provider signups.
    diligencePath: >-
      Request confidential historical customer cohort retention tables and health system contract renewal rates during
      formal sponsor data room access.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: provider economics
    missingEvidence: >-
      Audited clinician churn rates, renewal percentages, and cohort retention broken down by medical specialty under
      the per-booking pricing model.
    whyItMatters: >-
      Provider network durability is critical to marketplace liquidity, and high churn from fee friction could impair
      local specialty coverage.
    diligencePath: Request practice cohort retention curves and provider satisfaction metrics during commercial due diligence.
    relatedQuestionRefs:
      - QR010
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: operational risk
    missingEvidence: >-
      Empirical baseline no-show rates across Zocdoc appointment cohorts and net recovery rates from automated SMS/email
      reminders.
    whyItMatters: >-
      Elevated no-show rates erode practice margins and exacerbate complaints over fee recoupment on uncompleted
      appointments.
    diligencePath: Obtain marketplace-wide appointment completion data and practice refund logs.
    relatedQuestionRefs:
      - QR004
      - QR010
    relatedTableRefs:
      - TR002
