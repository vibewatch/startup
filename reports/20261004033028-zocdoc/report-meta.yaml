companyProfile:
  summary: >-
    Zocdoc is a New York City–founded healthcare appointment marketplace and practice-growth platform that connects
    patients to in-network providers through web, mobile, partner-directory, and enterprise scheduling channels. The
    company shifted from a flat subscription model to a per-booking model, reached EBITDA profitability in late 2019,
    and has since expanded into telehealth, intake automation, and AI-assisted phone scheduling while keeping most
    financial detail private.
