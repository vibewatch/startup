  topStrengths:
    - Large two-sided marketplace with meaningful patient and provider liquidity
    - Proven monetization turnaround with EBITDA profitability since late 2019
    - Broad scheduling, intake, telehealth, and AI-enabled distribution footprint
  topRisks:
    - Current revenue, margin, and booking-volume disclosure remain opaque
    - Provider fee friction and no-show economics can pressure retention
    - Secondary valuation remains well below historical peak marks
    - Regulatory and integration dependencies create operational fragility
  unresolvedGaps:
    - >-
      Current revenue, gross margin, EBITDA / free cash flow, and booking-volume disclosure are still private and block
      high-conviction underwriting.
    - The exact structure and seniority of the 2021 Francisco Partners financing remains unclear.
    - Provider churn, complaint cohorts, and booking concentration by specialty or geography are not publicly disclosed.
    - Security, privacy, and audit evidence remain limited in public sources.
    - >-
      It is still unclear whether Zo AI and partner-led distribution are material revenue contributors or mostly
      strategic optionality.
