callouts:
  - calloutType: insight
    title: Business Model Reinvention Enabled Survival and Structural Margin Expansion
    body: |
      Zocdoc's pivot between 2018 and 2019 from a flat $3,000 annual subscription to a variable per-new-patient booking fee represents one of the most significant marketplace turnarounds in digital health. The legacy model suffered from acute sales friction, as acquiring practices to replace churned providers forced an unsustainable sales headcount race that burned $43 million in 2015. By tying provider fees directly to delivered patient bookings and securing HHS OIG regulatory clearance to service Medicare beneficiaries, Zocdoc lowered onboarding barriers, expanded participating provider supply by 50% in early adopter states, and converted structural operating losses into positive EBITDA by late 2019.
    claimRefs:
      - CO007
      - CO008
