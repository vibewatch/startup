company:
  name: Zocdoc
chapter:
  number: 1
  title: Company Overview
  summary: Founded in New York City in 2007 by Oliver Kharraz, Nick Ganju, and Cyrus Massoumi, Zocdoc operates a prominent two-sided digital healthcare marketplace connecting patients seeking in-person or telemedicine care with doctors, dentists, and health systems. Following an executive transition in November 2015 and a pivotal shift from flat subscription pricing to variable booking fees between 2018 and 2019, the business attained positive EBITDA while scaling beyond 100 specialties and integrating voice AI scheduling tools.
sections:
  - id: corporate-identity-and-founding-history
    title: Corporate Identity, Origins, and Marketplace Architecture
    body: |
      Zocdoc was established in New York City in 2007 by Oliver Kharraz, Nick Ganju, and Cyrus Massoumi, who served as the company's initial chief executive officer. The company's origin was prompted by an acute healthcare navigation failure when Massoumi suffered a burst eardrum while traveling and encountered severe difficulty finding timely local physician appointments. Launching publicly at the TechCrunch40 conference in September 2007, the company initially focused on dental booking across Manhattan before scaling nationwide into medical and dental care across more than 100 clinical specialties.

      The core platform operates as an online appointment marketplace that enables patients to discover in-network physicians, inspect verified user reviews, verify insurance acceptance across more than 18,000 health plans, and execute digital scheduling without booking fees. For healthcare providers, Zocdoc functions as a demand-generation engine and scheduling layer integrated with practice calendars and electronic health record systems. Over its development, Zocdoc expanded into nationwide telemedicine in May 2020 and introduced its voice-based artificial intelligence assistant, Zo, in May 2025 to automate inbound telephone booking workflows.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
    tableRefs:
      - TO001
    figureRefs:
      - FO001
  - id: governance-leadership-and-litigation
    title: Governance Evolution, Leadership Transition, and Legal Resolution
    body: |
      Zocdoc experienced a decisive governance inflection in November 2015. Under its initial flat subscription model charging medical practices approximately $3,000 annually, the company generated $71 million in 2015 revenue but consumed $43 million in cash burn as sales representative turnover and provider churn destabilized marketplace economics. In response to stalled growth and organizational strain, the board of directors removed Cyrus Massoumi as CEO in November 2015 and appointed co-founder and former chief operating officer Oliver Kharraz, M.D., to lead the business.

      In 2020, Massoumi initiated litigation against Kharraz, Ganju, and chief financial officer Netta Samroengraja, alleging an improper scheme to seize corporate control. While the suit was initially dismissed in 2021 and reinstated on procedural appeal in 2022, the Supreme Court of the State of New York conclusively dismissed the case with prejudice on July 18, 2024. Under Kharraz's eleven-year tenure as chief executive, executive leadership expanded to include Samroengraja as CFO and key functional leaders across strategy, marketing, and communications, establishing executive continuity after the founder dispute.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO009
    tableRefs:
      - TO002
  - id: capitalization-valuation-and-scale-metrics
    title: Capitalization Trajectory, Valuation Signals, and Operational Scale
    body: |
      Zocdoc's capitalization spans early institutional backing from Khosla Ventures, Founders Fund, SV Angel, Jeff Bezos, and Marc Benioff, through mid-stage growth rounds led by Goldman Sachs, Atomico, and Baillie Gifford that elevated the company to an $1.8 billion post-money valuation by August 2015. After navigating its business model turnaround toward per-booking transaction monetization, Zocdoc secured growth funding from Francisco Partners in February 2021, reported by Forge as a $100 million Series D-2 round at a $2.62 billion post-money valuation and by TechCrunch as a $150 million growth financing round.

      Despite earlier unicorn valuations, secondary private market activity in 2026 reflects substantial valuation contraction. Institutional secondary indications tracked in early 2026 recorded a three-month moving average share price of $11.99, implying a secondary valuation discount of 67.26% relative to the 2021 primary mark and an 8.3x implied revenue multiple. While Zocdoc achieved EBITDA profitability in late 2019 and continues to operate profitably according to company reports, comprehensive income statement metrics, net margins, and total annual booking volumes remain undisclosed private operational metrics.
    claimRefs:
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
    tableRefs:
      - TO003
