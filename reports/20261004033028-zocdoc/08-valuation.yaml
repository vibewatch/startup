callouts:
  - calloutType: "recommendation"
    title: "Secondary Market Clearance Sets Underwriting Ceiling"
    body: >
      While insiders executed a May 2026 tender offer at an indicated $2.3 billion mark, institutional investors should anchor underwriting around observed secondary trading levels ($11.99 per share, ~$590M implied valuation). True upside realization depends on verifying whether the $150M Francisco Partners investment and 2024 debt facilities carry senior preference rights that dilute junior common equity holders.
    claimRefs:
      - "CV001"
      - "CV006"
      - "CV010"
      - "CV013"
  - calloutType: "risk"
    title: "Financial Opacity Precludes High-Conviction Buy Stance"
    body: >
      Zocdoc has maintained positive operational EBITDA since late 2019, yet management has withheld public disclosures regarding revenue magnitude, take-rate distribution, and cohort retention. Without audited verification of current booking volume trajectory and provider retention economics, assigning an aggressive growth multiple represents uncompensated underwriting risk.
    claimRefs:
      - "CV002"
      - "CV004"
      - "CV014"
      - "CV015"
