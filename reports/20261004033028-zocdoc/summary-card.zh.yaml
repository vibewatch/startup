    - 2021 年 Francisco Partners 融资的具体架构与受偿顺位仍不明确。
    - 医疗机构流失率、投诉队列以及按专科或地区的预约集中度均未公开披露。
    - 公开来源中关于安全、隐私及审计方面的证据仍然有限。
    - Zo AI 与合作伙伴分发渠道究竟贡献了实质性收入，还是更多充当战略期权，目前尚不明确。
