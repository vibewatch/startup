  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与变现机制
        blocks:
          - type: paragraph
            body: >-
              Zocdoc 商业变现架构的核心，是从固定月费 SaaS 名录模式彻底转向以新患者按次预约收费为重心的动态收费体系。早期平台向诊所收取固定月租，与实际就诊量无关。2016
              年，管理层为了扩大覆盖并加速网络扩张，启动向动态计费转型的探索，按平台促成的新患者预约向机构收费。由于医疗领域的按次收费极易触碰严格规制患者转介回扣的联邦《反回扣法案》（Anti-Kickback
              Statute），公司与专业医疗合规律师紧密配合，成功获得了美国卫生与公众服务部监察长办公室（HHS OIG）出具的两份支持性咨询意见（Advisory
              Opinions），确立了合规的按次收费框架。除单笔交易抽佣外，Zocdoc 还通过面向保险公司与大型医疗系统的企业级排期对接与分发实现变现，包括对接 Blue Shield of California
              以及市政排班合作项目。尽管官方挂牌价格始终保密，但据医疗机构反映，单笔交易费因专科、地域与患者类型差异很大，形成了由预约挂号量而非纯订阅软件授权驱动的混合平台变现模型。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
