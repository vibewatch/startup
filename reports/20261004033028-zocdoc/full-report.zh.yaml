              - CV007
              - CV008
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV007
      - number: '8.2'
        title: 融资历史、老股定价与入场纪律
        blocks:
          - type: paragraph
            body: >
              Zocdoc 的资本历史跨越了多轮截然不同的风投周期。2015 年 8 月，公司完成由 Baillie Gifford 与 Atomico 领投、Founders Fund 参投的 $152.57M Series
              D 轮融资，投后估值达到 $1.8 billion，正式跻身独角兽行列；该轮估值倍数高达 25.4x，对标的是约 $71 million 的过往年化收入。经历收入停滞以及创始人 CEO
              离任的管理层交接后，Zocdoc 稳住了单店模型，并于 2021 年 2 月获得 Francisco Partners 领投的 $150 million Series E
              成长期融资。近期老股交易简报数据显示，早期资方 Khosla Ventures 于 2026 年 5 月领投了一笔非公开发售要约（tender offer），对应股权估值达 $2.3
              billion，显示出长期内部人持续看好的投资意愿。


              然而，第三方公允老股交易数据呈现出的估值图景却截然相反。截至 2026 年 3 月 30 日的全面老股市场跟踪数据显示，在 $43.82 million 的成交量下，私募股份的三个月成交量加权移动平均价仅为每股
              $11.99。这一老股定价相较 $1.8 billion 的一级市场基准估值折让达 67.26%，折算后的有效市场企业价值约为 $590 million，隐含收入倍数为
              8.3x。对潜在机构投资者而言，审慎的入场纪律要求将 $2.3 billion 的要约估值仅视作缺乏流动性的内部信号；在拿到经审计的利润表与股权结构表上清晰的优先清算权顺位前，对新股权益份额的投资判断应严格锚定在
              $450M 至 $650M 的老股价格发现区间内。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
      - number: '8.3'
        title: 情景分析、可比倍数与尽调诉求
        blocks:
          - type: paragraph
            body: >
              针对 Zocdoc 的估值分歧，我们的投资研判框架构建了三种互不相同的运营情景，并参照上市数字医疗软件可比公司进行对标，如 GoodRx（IPO 时估值约 17x P/S）、Phreesia（IPO 时约 16x
              P/S）、Accolade（约 9x P/S）及 Teladoc。在基准情景下（赋予 50% 概率），Zocdoc 保持当前稳态运营节奏，实现 10% 至 15% 的收入增长，同时维持个位数正向 EBITDA
              利润率。按预测的 $150M 至 $165M 收入运行率及 8.0x 收入倍数计算，对应企业价值区间为 $1.20B 至
              $1.32B，既为深度折价买入的老股买方提供了温和的上行空间，相对一级市场资本而言也较为公允。


              在乐观情景下（25% 概率），Zocdoc 的 Care Access Network 变现提速，高毛利的诊所管理 SaaS 订阅及打通 Google Gemini 与 Yelp 的 AI
              问诊建档工作流实现规模化落地。在此假设下，公司年收入扩张 25%+，EBITDA 利润率达 20%，享有 12.0x 至 14.0x 的估值溢价（对应企业价值 $2.1B 至 $2.5B），并打开利润丰厚的公开
              IPO 窗口。在悲观情景下（25% 概率），搜索引擎去中介化、针对挂号抽成模型的监管审查以及机构端流失加剧，导致收入增长停滞与利润率受挤压。在压缩至 4.0x 至 5.0x 的估值倍数下（对应企业价值 $550M
              至 $650M），一级市场股东回报将被严重稀释，若 2024 年的高级债再融资条款行使清算优先权则尤甚。投资前高优先级的尽调必须查验 2024-2026
              年经审计财务报表，核验医疗机构留存队列，并彻底明确股权结构表上的清算优先顺位。
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV009
              - CV011
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV011
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 二级市场出清价格确立投资判断上限
            body: >
              内部人士虽在 2026 年 5 月以标示的 $2.3B 估值完成要约收购，但机构投资者做投资判断时，仍应以二级市场观察到的实际交易水平为锚（每股 $11.99，隐含估值约
              $590M）。上行空间能否真正兑现，取决于 Francisco Partners 的 $150M 投资与 2024 年债务工具是否带有优先清偿权，进而稀释后顺位的普通股持有人。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV010
              - CV013
          - type: callout
            title: 财务透明度不足难以支撑高确定性买入立场
            body: >
              Zocdoc 自 2019 年底以来虽保持经营性 EBITDA
              盈利，但管理层未公开披露营收规模、抽佣率分布与客群留存情况。若当前预约量走势与服务商留存模型未经审计核验，盲目给出激进增长倍数等于承担未获补偿的投资风险。
            calloutType: risk
            claimRefs:
              - CV002
              - CV004
              - CV014
              - CV015
