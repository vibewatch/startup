        title: Exhibits
        blocks:
          - type: callout
            title: 动态按次计费变现机制的战略两难
            body: >-
              Zocdoc 从固定 SaaS 订阅转向按次交易收费，打破了 2015
              年的收入天花板，助推公司跨过盈利门槛。然而，由于变现节点落在预约发起时刻而非临床诊疗完成之时，医疗机构单方面承担了患者爽约及医保未核准的风险，致使平台刷单规模与诊所净单店经济效益之间产生了持续张力。
