      - number: '1.3'
        title: 资本历程、估值信号与业务体量
        blocks:
          - type: paragraph
            body: >
              Zocdoc 的融资历程涵盖早期机构支持（Khosla Ventures、Founders Fund、SV Angel、Jeff Bezos 与 Marc Benioff），以及由 Goldman
              Sachs、Atomico 和 Baillie Gifford 领投的中期成长轮；到 2015 年 8 月，公司投后估值已冲上 $1.8 billion。在完成向按次计费交易模式的商业转型后，Zocdoc 于
              2021 年 2 月获得 Francisco Partners 的成长期资金；Forge 报道称该轮为 $100 million 的 Series D-2 轮、投后估值 $2.62
              billion，TechCrunch 则报道为 $150 million 的成长期融资轮。


              尽管此前头顶独角兽估值光环，2026 年非公开老股交易却显现出估值大幅缩水。2026 年初追踪到的机构老股交易意向显示，三个月移动平均成交价为每股 $11.99，相较 2021 年一级市场定价折价
              67.26%，对应隐含收入倍数为 8.3x。尽管 Zocdoc 在 2019 年底便实现了 EBITDA 盈利，且据公司通报至今保持盈利运转，但完整的利润表指标、净利率以及全年总预约单量等核心数据仍未公开。
            claimRefs:
