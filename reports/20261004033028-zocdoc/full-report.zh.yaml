companyProfile:
  summary: >-
    Zocdoc 成立于纽约，是一家就医预约交易平台兼诊所业务增长软件服务商。平台通过网页、移动端、合作方名录及企业级预约渠道，将患者与医保网络内医疗机构连接起来。公司此前由固定订阅制转向按次预约收费模式，于 2019 年底实现
