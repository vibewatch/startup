  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 立场 / 评级
      - 量化基准
      - 投资判断依据
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 自 2019 年起 EBITDA 转正
        - 运营盈利已得到证实，但顶线收入未经证实且优先股结构未清，暂不支持立即出资。
        - 出资前提：获取经审计的损益表、队列留存数据及完整的股权结构表披露。
      - - 置信度
        - 中
        - 老股交易 8.3x 对比新股 25.4x
        - 老股交易流动性充足（交易量 $43.8M）形成了市场出清价，尽管内部数据仍未公开。
        - 入场估值参考市场形成的老股定价，而非历史独角兽轮次估值。
      - - 风险评级
        - 中高
        - 老股折价 67.3%
        - 内部人要约收购（$2.3B）与老股市场交易（$11.99）之间估值波动巨大。
        - 假定老股定价代表当前真实出清价，据此评估下行保护空间。
      - - 估值立场
        - 合理
        - 新股 $1.2B - $1.8B 对比老股 $590M
        - 老股 ~8.3x 倍数反映了成熟盈利医疗科技双边平台的合理风险调整定价。
        - 在缺乏顶线收入加速增长的明确审计证据前，避免按新股估值买入。
    notes: 量化基准汇总了历史 Series D 新股轮次、Francisco Partners Series E 成长轮融资以及截至 2026 年 3 月的老股交易指标。
