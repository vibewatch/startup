chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位、成立缘起与双边交易架构
        blocks:
          - type: paragraph
            body: >
              2007 年，Oliver Kharraz、Nick Ganju 与首任首席执行官 Cyrus Massoumi 在纽约创立 Zocdoc。创立缘起是一次痛切的求医阻滞：Massoumi
              出行期间耳膜穿孔，在当地极难及时约到医生。公司于 2007 年 9 月在 TechCrunch40 大会上正式发布，起步先做曼哈顿的牙科预约，随后扩张至全美，覆盖超过 100 个临床专科的医疗与牙科业务。


              其核心平台属于在线预约交易市场：患者可寻找医保网络内医生、查看经核实的用户评价、核对覆盖超 18,000 种医保计划的报销资格，并直接在线挂号预约且免收预约费。对医疗机构而言，Zocdoc
              扮演获客获流引擎与排期调度层角色，与诊所日程表及电子健康档案（EHR）系统保持打通。在业务拓展上，Zocdoc 于 2020 年 5 月上线全美远程医疗，并于 2025 年 5 月推出名为 Zo
              的语音人工智能助手，实现呼入电话预约工作流的自动化。
            claimRefs:
