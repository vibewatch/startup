      - number: '1.2'
        title: 治理演进、管理层交接与诉讼终局
        blocks:
          - type: paragraph
            body: >
              2015 年 11 月，Zocdoc 迎来公司治理的关键转折点。在早期固定订阅模式下，公司向诊所收取每年约 $3,000 费用；2015 年公司录得收入 $71
              million，但因销售人员流动频繁、医疗机构退订加剧动摇了平台经济模型，当年消耗烧钱 $43 million。面对增长停滞与组织承压，董事会于 2015 年 11 月免去 Cyrus Massoumi 的
              CEO 职务，任命联合创始人兼前首席运营官 Oliver Kharraz 医学博士接掌业务。


              2020 年，Massoumi 对 Kharraz、Ganju 及首席财务官 Netta Samroengraja 提起诉讼，指控其串谋夺取公司控制权。虽然该起诉讼在 2021 年初遭驳回、2022
              年经程序上诉恢复审理，但纽约州最高法院最终于 2024 年 7 月 18 日作出终局裁决，驳回该案且不得重新起诉。在 Kharraz 执掌 CEO 的 11 年间，高管团队引入 Samroengraja 出任
              CFO，并补强战略、市场营销与传播等核心职能负责人，在创始人纠纷尘埃落定后维系了高管团队的持续稳定性。
            claimRefs:
