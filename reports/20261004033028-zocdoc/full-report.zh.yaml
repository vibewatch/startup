      - number: '3.2'
        title: 功能矩阵、对接深度与商业模式对比
        blocks:
          - type: paragraph
            body: >-
              医疗机构在采购排期方案时主要权衡五大维度：实时对接 EHR、自主预约转化率、自动化提醒工作流、医保资格核验以及总体拥有成本（TCO）[CP005]。Zocdoc 的核心竞争优势在于其能与超 175 个 EHR
              平台实现双向日程同步，支持在 Google 商家主页、保险门户及诊所官网实时展示可用号源 [CP005, CP006]。然而，其商业模式引发了诊所端的明显抵触：Zocdoc 对每位新就诊患者收取 $35 至
              $110 的动态交易费，并以每名医生每月 $250 提供可选的高级诊所管理工具 [CP004, CP005]。尽管 Zocdoc 宣传平均投资回报率达 8x
              [CP005]，但除非诊所前台熟练走完免责申请流程，否则遭遇患者取消或爽约时往往仍需照常付费 [CP005]。相比之下，Phreesia 和 NextGen
              等大型企业级软件将排期深度嵌入诊所管理合同中；而定制化软件虽需 $30,000 至 $250,000 的前期研发投入，却无需承担任何单笔预约抽成 [CP005, CP008]。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP008
