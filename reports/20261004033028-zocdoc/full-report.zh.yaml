        title: 患者寻医导诊与核心交易工作流
        blocks:
          - type: paragraph
            body: >-
              Zocdoc 核心产品通过 iOS、Android
              移动端及网页端，向患者提供数字化就医导诊与挂号预约体验。患者可按专科、症状、地理位置、就诊时段及医保网络发起搜索，并按医生距离、性别、经核实的用户评价以及现场面诊或远程医疗等就诊形式筛选结果。在面向消费者的流程中，患者可随时直接预约，24
              小时全天候实时选定可用号源即时锁定就诊，无需电话沟通；典型预约通常发生在实际就诊前的 24 至 72 小时内。除搜索与挂号确认外，Zocdoc
              还支持就诊前数字化建档，方便患者提前填写病历登记表并上传医保信息，辅以自动化就诊提醒与预防性体检通知，以最大限度减少中途流失并优化到店流程。
