              Zocdoc 盘踞在个人寻医预约受众与多元化商业医疗服务机构的交叉口。在需求端，散客患者通过免费的平台 App 和网页端寻找医保网络内医疗资源，不到 60
              秒即可完成挂号，并走完在线建档流程。在商业供给端，Zocdoc 将客户群体细分为独立私人诊所、区域专科诊所、大型多专科医疗集团以及企业级医疗系统。独立诊所与区域诊所主要将 Zocdoc
              用作即时获客和填补号源空缺的渠道，并逐渐从传统的固定订阅制转向小额年费加按次计费的混合收费架构。对于 Mount Sinai、Christus Health 和 UChicago Medicine
