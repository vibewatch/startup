      - CV004
      - CV006
      - CV007
      - CV008
      - CV009
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设经营表现
      - EV / Rev 倍数区间
      - 隐含估值区间
      - 概率信号
      - 下行 / 上行触发因素
    rows:
      - - 乐观情景
        - 年收入增速超过 25%；受 Care Access Network 与诊所 SaaS 采纳驱动，EBITDA 利润率扩大至 20%+。
        - 12.0x - 14.0x EV / 收入
        - $2.1B - $2.5B
        - 25%
        - 成功提交 S-1 招股书，确认自然预约占据主导地位，且大型医疗系统采纳加速。
      - - 基准情景
        - 常态化年收入增长 10% - 15%；维持个位数正向 EBITDA 利润率；平台医生供给流动性稳定。
        - 7.5x - 8.5x EV / 收入
        - $1.2B - $1.4B
        - 50%
        - 平台守住医生密度，但业务增长仅同步于大盘门诊量扩张，未能开辟新品类。
      - - 悲观情景
        - 收入停滞（增速 0% - 5%）；医生抵制收费导致局部流失；搜索获客成本挤压 EBITDA 降至盈亏平衡。
        - 4.0x - 5.0x EV / 收入
        - $550M - $650M
        - 25%
        - 搜索平台与医疗系统封闭门户绕开公司直接连接供需，或激进清算优先权条款被触发。
    notes: 情景模型以预估的 $150M-$165M 基准收入运行率为基础，套用标准化医疗科技双边平台收入倍数区间测算。
