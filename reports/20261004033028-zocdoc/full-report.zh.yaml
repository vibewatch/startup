      - CV006
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 核心支柱
      - 投资逻辑（多头驱动）
      - 反向逻辑（空头风险）
      - 何种情况会改变观点
    rows:
      - - 市场地位与护城河
        - 挖掘隐藏排班号源，建立起覆盖全国的壁垒：连接患者与 200+ 个专科、12,000+ 种医保计划。
        - Google、Yelp 及诊所自带 EHR 门户容易绕过平台，直接切走漏斗顶部的 C 端挂号搜索流量。
        - 核实自然直接到端（App）预约流量占比，以及对付费搜索获客的依赖程度。
      - - 商业模式与单体经济
        - 转向按次预约变动收费模式后，网络规模增长 50%，且自 2019 年底起持续保持 EBITDA 盈利。
        - 医生端对线索费不满，加上公开渠道缺少队列留存数据，造成持续的供给侧流失敞口。
        - 经审计披露显示医生净留存率稳定在 100% 以上，且医生获客成本持续下降。
      - - 资本结构与估值
        - Khosla Ventures 领投的 2026 年 5 月要约收购（投后估值 $2.3B）展现出一线内部人的强劲信心。
        - 老股以 67.3% 折价交易（股价 $11.99），而 Francisco Partners 提供的 $150M 资金工具带来了清算优先权压制。
        - 核查优先清偿条款，并获取顶线 ARR 加速扩张的审计证据。
      - - AI 战略布局
        - Care Access Network 接入 Gemini 及对话式 AI 引擎，构建起新型分布式挂号触点。
        - AI 患者就医引导工具仍属未商业化试验，对核心平台挂号量的直接贡献尚不明确。
        - 披露企业级合同金额，并公布 AI 辅助流程可衡量的挂号转化指标。
    notes: 综合核心业务驱动力、商业变现转型及技术机遇，对照运营与结构性风险进行审视。
    claimRefs:
