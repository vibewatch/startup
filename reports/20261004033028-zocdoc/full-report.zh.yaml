              分钟行政工时，帮助中小型诊所在汇集预约队列的同时，大幅减轻前台接听电话的负担。为了支持医院系统在企业级规模的顺利上线，Zocdoc 配备了专门的高级技术客户经理与企业客户成功经理，负责跟进复杂的 EHR
