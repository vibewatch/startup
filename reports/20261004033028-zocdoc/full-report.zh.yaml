      - number: '3.3'
        title: 迁移成本、多栖行为与战略脆弱性
        blocks:
          - type: paragraph
            body: >-
              消费者品牌认知度及与传统临床数据库的深度技术打通强化了 Zocdoc 的护城河，但其防御壁垒因专科、地域与医疗机构体量而大相径庭 [CP004, CP005]。独资诊所与独立处方医生表现出明显的多栖挂牌行为：在
              Psychology Today 等平台保留被动名录展示，同时按需开启 Zocdoc 或 Klarity 等垂直平台填补即时闲置号源
              [CP004]。厂商锁定效应主要取决于诊所对外部客流的依赖度，而非软件迁移成本；机构随时可以暂停平台挂牌，而不会丢失底层病历档案 [CP005]。此外，采用现代框架自建预约系统，成本从基础排期 MVP 的
              $30,000 到对接 EHR 的企业级方案的 $250,000 不等，对希望规避交易抽佣的大型医院网络构成了极具吸引力的长期替代方案 [CP008, CP009]。Zocdoc 正在推进的举措——包括与
              Blue Shield of California 合作嵌入保险端排期，以及推出 Zo AI 电话预约助手——旨在同质化侵蚀独立交易抽成模型之前构筑分发壁垒 [CP005, CP006, CP010]。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP008
              - CP009
              - CP010
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 按次计费模型下的机构留存悖论
            body: >-
              Zocdoc 从软件月度订阅转为按次预约计费，成功将医疗机构获客成本与首次就医匹配挂钩，却在患者取消预约场景下埋下了结构性矛盾。当患者取消或爽约而机构仍被收取每单 $35 至 $110
              时，除非前台极为勤勉地提交费用减免申请，否则实际感知到的 ROI 将急剧缩水 [CP004, CP005]。这种机制促使成熟医生仅将 Zocdoc 视作开业初期的冷启动加速器；一旦接诊量趋于饱和，便会转向
              Psychology Today 等低成本名录进行多栖挂牌，或把沉淀下来的稳定客群引流至自有渠道直接预约 [CP004, CP005]。
            calloutType: insight
            claimRefs:
              - CP004
              - CP005
          - type: callout
            title: 自建系统与原生 EHR 排期带来的同质化威胁
            body: >-
              随着排班应用的云端开发成本降至 $30,000 到 $70,000 的 MVP 区间，且原生 EHR 患者门户（如 Epic
              MyChart）持续完善自主挂号功能，大型医疗集团持续向第三方平台支付抽成过路费的意愿显著下降 [CP005, CP008, CP009]。Zocdoc 必须维持出色的 C 端转化效率与合作渠道分发能力（如接入
              Google 商家与 Blue Shield），以防被医疗系统自建的数字化入口彻底去中介化 [CP005, CP006, CP010]。
            calloutType: risk
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP009
