              尽管公司对外口径不断强调 2019 年以来持续实现 EBITDA 盈利与业务增长，但 2026 年初的私募老股交易给出的均价仅为 $11.99，相较 2021 年一级市场投后估值大幅折让
              67.26%。这一悬殊折价凸显出机构投资人对后期交易平台倍数回调与缺乏经审计公开财务报表的高度警惕。
