      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 商业模式重塑力挽狂澜并实现结构性利润率扩张
            body: >
              2018 年至 2019 年间，Zocdoc 从每年 $3,000
              的固定订阅费转向按新增就诊患者计费的动态提成模式，堪称数字医疗领域最重要的平台逆转案例之一。旧模式饱受获客阻力困扰：为了填补流失机构，公司不得不打销售人海战，导致 2015 年消耗烧钱 $43
              million。通过将机构端收费与实际履约的患者预约直接挂钩，并获得美国卫生与公众服务部监察长办公室（HHS OIG）针对服务 Medicare 受益人的合规批复，Zocdoc
              大幅降低了入驻门槛，在早期试点州将入驻医疗机构供给量拉升了 50%，并在 2019 年底前扭转结构性经营亏损，实现 EBITDA 转正。
            calloutType: insight
            claimRefs:
              - CO007
              - CO008
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类界定与覆盖开支
        blocks:
          - type: paragraph
            body: >-
              数字医疗导诊与就医预约软件的目标市场涵盖面向消费者的就医预约平台、对接电子健康档案（EHR）的自主排期引擎，以及患者自动化沟通工具。统计口径内的支出包括：医疗机构投向新患者获取的营销预算、按次计费的动态预约转介费、诊所管理附加订阅，以及大型支付方名录对接系统。住院患者院内行政排班套件、大型
              EHR
              授权许可、票据清算计费系统与通用跨行业营销平台则被排除在统计范围之外。历史上，就医导诊全凭静态医生名录、口碑推荐与前台电话沟通，造成极大的就医门槛与等待瓶颈。现代平台将这些线下繁琐流程转变为实时交易工作流，把经核实的可约号源库存直接对接到有医保的患者需求端。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模测算、分层结构与渗透动态
        blocks:
          - type: paragraph
            body: >-
              测算这一市场体量，必须将宽泛的医疗科技支出拆分为清晰的业务层级。尽管美国本土医疗体系支出占全球医疗总支出的估计
              40%，但可软件化与平台化的市场空间主要由独立诊所及门诊专科机构主导。患者在线搜索与自主预约是诊所运营的关键分水岭：行业研究表明，89%
              的患者认为在线预约非常重要；然而美国医疗集团管理协会（MGMA）调研显示，71% 的医疗集团反馈目前自主在线预约的患者比例不足
              25%。这一渗透率断层正是商业扩张的核心机遇。整个市场自上而下分为三个层级：门诊预约总单量（TAM）、打通 EHR 的数字化排期机构总规模（SAM），以及平台按次计费可变现预约规模（SOM）。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM008
      - number: '2.3'
        title: 买方客群分层、支付方协同与决策权限
        blocks:
          - type: paragraph
            body: >-
              医疗机构在三类客群及大型支付方渠道中的采购采纳逻辑截然不同。独资与独立私人诊所核心诉求是迅速获取患者客流并缓解前台人力负担，采购资金取自营销或运营预算，决策链条短、自主审批快。中型专科集团与牙科连锁机构侧重排班密度与复诊回访管理，决策需要诊所管理者与临床主管共同达成共识。大型医疗系统则要求深度双向对接
              EHR、满足企业级合规标准并支持自定义排班规则，由企业级 IT 与临床运营预算共同分摊。与此同时，Blue Shield of California
              等健康保险计划选择与就医平台合作维护精准的医保网络内医生名录，在规避名录信息滞后招致监管审查的同时，引导参保会员及时获得门诊救治。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 增长驱动力、渠道瓶颈与经济约束
        blocks:
          - type: paragraph
            body: >-
              推动平台预约采纳的动能主要来自三方面：诊所前台招工严重短缺、消费者对即时数字化挂号的高预期，以及远程医疗需求的持续攀升——尤其在心理健康领域，远程诊疗渗透率韧性十足。此外，数字化预约切实减轻了行政负担，释放了过去用于接听常规预约电话的大量前台工时。但业务推广仍面临严峻约束：若预约遭遇爽约或取消，按次收费模式会遭到医疗机构强烈抵制，直接拉低其投资回报率。与此同时，远早于互联网商业诞生的联邦与各州陈旧医疗法规给预约收费模式带来了持续的监管模糊性，迫使平台必须长期应对合规摩擦。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 自主预约渗透率缺口构成市场催化剂
            body: >-
              医疗预约软件的核心机会体现为鲜明的结构性背离：89% 的患者高度看重在线预约能力，却有 71%
              的医疗机构反馈通过线上挂号的就诊量不足四分之一。这一渗透率落差，为整合型交易市场与排期软件供应商构筑了长期的确定性增长红利。
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
          - type: callout
            title: 监管模糊性与未获补偿的机构端阻力
            body: >-
              按次计费模式面临双重结构性阻力。一方面，患者后续取消预约或直接爽约却仍被收取预约费，往往招致医疗机构强烈不满；另一方面，先于数字化平台出台的联邦及各州医疗法律，给转介费（referral
              fee）定性带来了悬而未决的合规不确定性。
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与结构性替代方案
        blocks:
          - type: paragraph
            body: >-
              患者排班与获客赛道划分为五种截然不同的运营模式：面向消费者的预约平台、被动展示型专业名录、虚拟专科集团与远程医疗平台、医保赋能服务网络，以及面向医疗机构与支付方的 B2B 转诊基础设施 [CP001,
              CP002]。Zocdoc 主打双边撮合市场，能够在 24 至 72 小时内交付高就诊意向的预约订单 [CP003, CP005]；但独立诊所与大型医疗系统也在不断评估低摩擦的替代方案
              [CP001]。Psychology Today 等固定收费名录以极低的月费（每月 $29.95）提供广泛的曝光，但把初筛、录入建档和排期沟通的包袱全甩给了诊所人员
              [CP004]。在国际市场及门诊专科领域，Doctolib 等头部厂商用 vertical clinical SaaS 与环境智能（ambient AI）实现了经常性收入的持续扩张（2024 年 ARR 达
              €348M），表现优于按次交易模型 [CP013]。在供给端，Talkiatry 和 Klarity Health
              等专注于远程精神科的虚拟医疗网络通过提供预筛客流、不可退订定金或全套临床系统，直接分流高价值专科医生供给 [CP004,
              CP007]。除采购第三方方案外，医疗机构还会权衡自建定制排班系统：虽然前期资本投入高且合规成本大，但能彻底免去被平台持续抽佣的交易过路费 [CP008]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP007
