            body: >-
              Zocdoc 的技术架构以具备自研专利的诊疗接诊聚合引擎为核心，专门用于抽取、归一化并对外暴露不同临床软件系统中的号源可用性。平台与超 150 个电子健康档案（EHR）与诊所管理系统（PMS）保持双向同步，并支持
