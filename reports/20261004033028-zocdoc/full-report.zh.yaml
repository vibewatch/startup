  - id: FI001
    title: 双边平台变现与价值实现流向图
    type: flow
    summary: 直观呈现患者挂号全流程：从患者发现、变动费用收取、诊所价值实现，到潜在利润漏损风险。
    data:
      nodes:
        - id: discovery
          label: 患者发现与预约
          detail: 经由平台或合作伙伴集成渠道完成挂号
        - id: verification
          label: 医保核验与就诊资格审核
          detail: 诊所前台审核医保覆盖范围及就诊资格
        - id: fee-accrual
          label: Zocdoc 费用确认
          detail: 向医疗机构收取按次预约的变动交易费
        - id: attendance
          label: 按约到诊就医
          detail: 患者完成就诊，或触发较高的爽约风险
        - id: billing-resolution
          label: 费用争议与对账审计
          detail: 诊所对虚假号源或爽约收费争议展开对账核实
        - id: realization
          label: 医疗机构收益实现
          detail: 诊所收到医保报销回款，或自行承担未收回的管理开销
      edges:
        - from: discovery
          to: verification
        - from: verification
          to: fee-accrual
        - from: fee-accrual
          to: attendance
        - from: attendance
          to: billing-resolution
        - from: billing-resolution
          to: realization
    approximationNotes: 流向图依据合同条款及诊所工作流研究，呈现了 Zocdoc 按次变动收费模式的运营与经济链路。
