            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR007
              - CR010
              - CR011
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 估值沉淀重压与资本结构断层
            body: 2026 年观测到的老股交易价格表明，其股权估值相较 2021 年一级融资基准低出约三分之二。若公开市场流动性持续挑剔，这一巨大的估值鸿沟将给后续资本重组与退出通道带来严峻阻力。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: 按次计费机制下的平台经济摩擦
            body: 虽然转向动态挂号费扩大了机构供给采纳，但高企的爽约率却让医生单方面承受了不成比例的下行风险。若缺少能打通建档与到诊履约的自动化闭环，专科诊所的机构留存率将面临长期的结构性承压。
            calloutType: insight
            claimRefs:
              - CR005
              - CR006
              - CR007
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              在 2026 年底对 Zocdoc 进行投资研判，需要在其作为全美头部就医预约平台的牢固地位，与其在营业收入、毛利率和客户留存上极度不透明的现状之间取得平衡。看多的投资逻辑聚焦于 Zocdoc
              在全美建立的流动性护城河，挖掘创始人 Oliver Kharraz 所称的“隐藏医疗供给”——即因取消与改签而释放出的 20% 至 30%
              诊室排班号源。在历经多年痛苦转型、摆脱难以为继的固定订阅制后，Zocdoc 于 2018 年和 2019 年转向按次预约收费的动态变现模式，使首批试点州的机构入驻率激增 50%。截至 2019 年底，公司实现了
              EBITDA 盈利，并将正向经营现金流维持至 2026 年；同时业务向大型医疗系统排期、多专科远程医疗，以及依托 Google Gemini 等平台的生成式 AI 导诊分发纵深推进。


              反向看空逻辑则直指严重的信息不对称与初露端倪的渠道脆弱性。尽管已运营近二十年、累计筹集超 $426 million 风险投资与成长期资本，Zocdoc
              却从未就挂号单量、抽成率、净收入留存率（NRR）或机构流失分层队列给出过任何持续披露。Francisco Partners 于 2021 年 2 月领投的 $150 million
              成长期投资采用了信贷与结构化方案，预示着潜在的高级优先清算权壁垒，在发生退出流动性事件时可能直接侵蚀普通股回报。此外，随着大型科技巨头推出原生就医排班工作流、数字化前端入口软件渐趋成熟，Zocdoc
              必须源源不断投入高昂的销售与营销费用，以防漏斗顶端的消费者流量被搜索引擎去中介化。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
