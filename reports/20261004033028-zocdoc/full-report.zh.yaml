figures:
  - id: FO001
    title: Zocdoc 企业演进与里程碑时间线（2007–2026）
    type: timeline
    summary: Zocdoc 发展历程全景：从 2007 年创立与 2015 年重组，到疫情期间远程医疗扩张，再到 2024–2026 年的法律诉讼与 AI 里程碑。
    data:
      items:
        - date: 2007-09
          label: 公司创立与 TechCrunch 亮相
          detail: Oliver Kharraz、Cyrus Massoumi 与 Nick Ganju 在 TechCrunch40 正式发布 Zocdoc，最初聚焦曼哈顿牙科预约。
        - date: 2008-08
          label: 早期机构资本入局
          detail: 获得 Khosla Ventures 领投的 Series A 风投，并引入 Jeff Bezos 与 Marc Benioff 的天使投资。
        - date: 2011-09
          label: Series C 轮成长融资
          detail: 以 $772M 投后估值从 Goldman Sachs 处融资 $75M，支持多城市平台扩张。
        - date: 2015-08
          label: 独角兽融资巅峰
          detail: 获得 Atomico、Baillie Gifford 与 Founders Fund 联合投资的 $152.6M Series D 轮融资，估值攀升至 $1.8B。
        - date: 2015-11
          label: 治理重组与 CEO 换届
          detail: 因 2015 年烧钱达 $43M，董事会罢免 CEO Cyrus Massoumi，并任命联合创始人 Oliver Kharraz 接任 CEO。
        - date: 2019-01
          label: 定价模式转型
          detail: 商业变现模式从每年向医生收取 $3,000 固定订阅费，转向按新患者预约量变动收费。
        - date: 2019-12
          label: EBITDA 首次转正盈利
          detail: 2019 年 9 月实现运营 EBITDA 转正，并在 2019 年 Q4 取得首个完整盈利季度。
        - date: 2020-05
          label: 远程医疗基础设施上线
          detail: 响应 COVID-19 疫情，上线视频问诊功能并推出符合 HIPAA 规范的免费视频服务。
        - date: 2021-02
          label: Francisco Partners 领投融资轮
          detail: 获得 Francisco Partners 领投的成长融资，新股投后估值达到 $2.62B。
        - date: 2024-07
          label: 创始人治理诉讼被终局驳回
          detail: 纽约州最高法院果断驳回被罢免创始人 Cyrus Massoumi 提起的公司治理诉讼，裁定终局驳回且不得重新起诉。
        - date: 2025-05
          label: 生成式 AI 语音智能体发布
          detail: 推出基于语音的 AI 助手 Zo，实现诊所电话排班自动化。
        - date: 2026-03
          label: 老股市场估值重置
          detail: 老股市场交易均价为每股 $11.99，相较 2021 年新股估值基准折价 67.26%。
    approximationNotes: 时间线汇总了经官方公告及司法记录核实的独立企业历史里程碑；在未公布具体日期的情况下，记录至月份维度。
    claimRefs:
