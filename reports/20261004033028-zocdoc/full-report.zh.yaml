  - id: FV001
    title: 投资建议推导逻辑
    type: flow
    summary: 决策链路始于规模体量与业务反转实证，经受财务不透明风险审视，最终得出“继续研究”的投资评估立场。
    data:
      nodes:
        - id: scale
          label: 业务规模与覆盖广度
          detail: 全美覆盖 20M+ 患者、200+ 细分专科与 12,000+ 款保险计划
        - id: turnaround
          label: 模式转型与经营反转
          detail: 转向按次预约收费模式，推动公司于 2019 年底实现 EBITDA 盈利
        - id: secondary
          label: 老股交易估值分歧
          detail: 老股成交价折价 67.3%（$11.99 / 隐含 EV ~$590M）
        - id: opacity
          label: 财务与股权结构不透明
          detail: 零经常性公开 P&L 披露；面临债务再融资与优先股清算悬顶风险
        - id: gate
          label: 投资评估门槛
          detail: 严格要求获取经审计财务披露、留存队列数据与优先股条款
        - id: stance
          label: 投资评估立场
          detail: 尚待一手财务尽调核查，暂定“继续研究”建议与估值“合理”立场
      edges:
        - from: scale
          to: turnaround
        - from: turnaround
          to: secondary
        - from: secondary
          to: opacity
        - from: opacity
          to: gate
        - from: gate
          to: stance
    approximationNotes: 流程梳理了定性决策层级，将运营成果、定价信号与尽调关卡有机串联。
