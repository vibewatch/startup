callouts:
  - calloutType: "insight"
    title: "The Provider Retention Paradox in Pay-Per-Booking Economics"
    body: "Zocdoc's transition from a monthly software subscription to a pay-per-booking model successfully aligned provider acquisition costs with initial patient discovery, but created structural tension around cancellation friction. When providers are charged $35 to $110 per booking even if a patient subsequently cancels or fails to show, perceived return on investment drops sharply unless front-desk staff diligently request waivers [CP004, CP005]. This dynamic incentivizes established clinicians to treat Zocdoc as an onboarding accelerator to fill early schedule gaps, multi-homing on low-cost directories like Psychology Today or shifting mature panels to direct in-house booking once capacity stabilizes [CP004, CP005]."
    claimRefs:
      - "CP004"
      - "CP005"
  - calloutType: "risk"
    title: "Commoditization Threat from In-House Builds and Native EHR Schedulers"
    body: "As cloud development costs for scheduling applications drop into the $30,000 to $70,000 range for minimum viable products and native EHR patient portals (such as Epic MyChart) expand self-scheduling features, large medical groups face declining incentives to pay recurring third-party marketplace tolls [CP005, CP008, CP009]. Zocdoc must maintain superior consumer conversion and partner-channel distribution (such as Google Business and Blue Shield integrations) to prevent disintermediation by health systems' internal digital front doors [CP005, CP006, CP010]."
    claimRefs:
      - "CP005"
      - "CP006"
      - "CP008"
      - "CP009"
      - "CP010"
