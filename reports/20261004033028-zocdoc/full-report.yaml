      - number: '6.2'
        title: Adoption Trajectory and Enterprise Workflows
        blocks:
          - type: paragraph
            body: >-
              Zocdoc's commercial adoption trajectory has evolved from a pure directory listing into an integrated
              digital front-office platform. While the marketplace expanded its provider roster past 80,000 clinicians
              and facilitated tens of millions of consumer interactions, the company broadened its product surface with
              Zocdoc Practice Solutions, offering digital intake, online scheduling widgets, and telehealth video
              services. During initial private beta testing, 35% of existing marketplace providers adopted at least one
              Practice Solutions module, and nearly 7,000 practices onboarded Intake tools to capture patient insurance
              cards, identification, and medical history prior to scheduled appointments. Early clinical deployments
              demonstrated administrative time savings averaging 15 minutes per patient, allowing small clinics to
              reduce front-desk telephone burdens while centralizing appointment queues. To support enterprise-scale
              rollouts across hospital systems, Zocdoc deploys dedicated Senior Technical Account Managers and
              Enterprise Customer Success Managers who oversee complex EHR data pipelines, calendar availability
              synchronization, and technical migration plans.
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
              - CU009
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
