      - number: '5.3'
        title: Architecture, EHR Integration Footprint, and Technical Limitations
        blocks:
          - type: paragraph
            body: >-
              The technical architecture of Zocdoc centers on an encounter aggregator engine backed by proprietary
              patents designed to ingest, normalize, and expose appointment schedule availability across disparate
              clinical software systems. The platform maintains bidirectional synchronization with more than 150
              electronic health record and practice management systems alongside 175 calendar integrations, allowing
              external directory listings to reflect real-time provider openings. Data infrastructure and platform
              analytics rely on modern cloud data warehousing environments spanning systems like Snowflake, BigQuery, or
              Redshift, orchestrated through dbt and workflow tools such as Airflow or Dagster to support governance and
              reporting. However, comparative operational benchmarks demonstrate that Zocdoc's automation boundaries
              terminate primarily at scheduling and demand generation, lacking native end-to-end clinical workflow
              automation such as real-time insurance eligibility checks, prior authorization lifecycle management, and
              in-depth medication interaction screening. Furthermore, competitive analyses indicate that
              marketplace-sourced appointments can experience elevated patient no-show rates compared to traditional
              walk-in patient cohorts, highlighting an operational friction point where demand generation diverges from
              clinical throughput.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE003
