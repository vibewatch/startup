  - id: FU001
    title: Zocdoc Customer Journey and Expansion Loop
    type: journey-map
    summary: >-
      Multi-stage journey map detailing customer interactions, touchpoints, and operational value realization from
      discovery to platform retention.
    data:
      items:
        - label: Provider Discovery & Integration
          stage: Provider Discovery & Integration
          actor: Clinical Practice Leadership
          goal: Evaluate new patient acquisition and online front-office scheduling automation
          touchpoints:
            - Zocdoc business portal and sales consultations
            - Practice Management Software calendar sync setup
          sentiment: positive
        - label: Patient Search & Discovery
          stage: Patient Search & Discovery
          actor: Prospective Healthcare Patients
          goal: Find verified in-network clinicians by specialty, geography, and insurance plan
          touchpoints:
            - Zocdoc mobile application and consumer search portal
            - Syndicated partner listings on Google and health directories
          sentiment: positive
        - label: Patient Intake & Booking Activation
          stage: Patient Intake & Booking Activation
          actor: Front-Desk Administrative Staff
          goal: Automate patient registration and fill empty calendar appointment slots
          touchpoints:
            - Real-time 24/7 web scheduling widget
            - Automated pre-visit digital intake and insurance check
          sentiment: neutral
        - label: Care Delivery & Encounter Resolution
          stage: Care Delivery & Encounter Resolution
          actor: Treating Clinicians & Patients
          goal: Deliver clinical visit on schedule while resolving administrative friction
          touchpoints:
            - In-person clinic check-in or HIPAA video room
            - Post-visit feedback and verified review submission
          sentiment: neutral
        - label: Front-Office Review & Retention Monitoring
          stage: Front-Office Review & Retention Monitoring
          actor: Practice Office Managers
          goal: Resolve patient billing or wait-time friction before escalation to public reviews
          touchpoints:
            - Zocdoc provider dashboard analytics and complaint resolution scripts
            - Automated rebooking reminders and patient panel recall workflows
          sentiment: neutral
        - label: Enterprise Expansion & Account Durability
          stage: Enterprise Expansion & Account Durability
          actor: Health System Operations & Success Managers
          goal: Scale scheduling syndication across multi-specialty departments and enterprise EHRs
          touchpoints:
            - Quarterly enterprise business reviews
            - Technical account management and directory integrations
          sentiment: positive
    approximationNotes: >-
      Journey stages synthesized from official customer workflow architectures, enterprise account management roles, and
      clinical operational case studies.
