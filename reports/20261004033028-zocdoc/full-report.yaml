              - CE012
              - CE013
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Boundaries of Marketplace Scheduling vs Clinical Automation
            body: >-
              Zocdoc's core technical strength lies in consumer aggregation and real-time scheduling synchronization
              across fragmented provider calendars. However, operational diligence reveals clear boundaries: unlike
              EHR-native operational AI platforms, Zocdoc does not execute deep clinical workflows such as real-time
              insurance eligibility checks, prior authorization management, or clinical medication reviews. Practices
              utilizing Zocdoc must maintain dedicated front-office workflows to verify benefits and mitigate higher
              average appointment no-show rates.
            calloutType: insight
            claimRefs:
              - CE008
              - CE013
              - CE014
              - CE015
          - type: callout
            title: Integration Fragility and EHR Ecosystem Dependencies
            body: >-
              Maintaining real-time bidirectional appointment synchronization across more than 150 different EHR and
              practice management systems presents continuous technical risk. Disparate API standards, legacy on-premise
              systems, and frequent EHR vendor version updates create ongoing maintenance overhead, where sync failures
              can directly translate into practice scheduling discrepancies or patient dissatisfaction.
            calloutType: risk
            claimRefs:
              - CE006
              - CE010
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Economics
        blocks:
          - type: paragraph
            body: >-
              Zocdoc functions at the intersection of a consumer search and scheduling audience and a diversified
              commercial healthcare provider base. On the demand side, individual patients use the free marketplace
              application and web portal to discover in-network care, schedule visits in under 60 seconds, and complete
              digital intake steps. On the commercial supply side, Zocdoc segments its client base into independent
              private practices, regional specialty clinics, large multi-specialty medical groups, and enterprise health
              systems. Independent practices and regional clinics leverage Zocdoc primarily for immediate patient
              acquisition and schedule filling, shifting away from legacy flat-rate subscription models toward a hybrid
              pricing structure that pairs a modest annual listing fee with variable per-booking transaction costs. For
              large medical groups and health systems—such as Mount Sinai, Christus Health, and UChicago Medicine—Zocdoc
              serves as an enterprise patient access layer, coordinating scheduling across hundreds of clinicians,
              syndicating real-time availability across third-party directories, and synchronizing with existing
              electronic health record (EHR) and practice management software (PMS) architectures.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU008
