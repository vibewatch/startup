  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Investment Thesis (Bull Driver)
      - Investment Anti-Thesis (Bear Risk)
      - What Would Change the View
    rows:
      - - Market Position & Moat
        - >-
          Defensible nationwide liquidity connecting patients to 200+ specialties and 12,000+ insurance plans by
          uncovering hidden schedule supply.
        - >-
          Vulnerability to Google, Yelp, and native practice EHR portals disintermediating top-of-funnel consumer
          appointment searches.
        - Verification of organic direct-to-app booking traffic share vs paid search acquisition reliance.
      - - Business Model & Economics
        - >-
          Transition to variable fee-per-booking model drove 50% network growth and sustained EBITDA profitability from
          late 2019 onward.
        - >-
          Provider dissatisfaction with lead fees and lack of public cohort retention data create recurring supplier
          churn exposure.
        - Audited disclosures showing steady provider net retention above 100% and declining provider acquisition costs.
      - - Capitalization & Valuation
        - >-
          May 2026 tender offer led by Khosla Ventures at $2.3B post-money valuation demonstrates strong tier-1 insider
          confidence.
        - >-
          Secondary shares trade at a 67.3% discount ($11.99 share price) while $150M Francisco Partners facility
          introduces liquidation overhang.
        - Inspection of senior preference terms and audited proof of accelerating top-line ARR expansion.
      - - Strategic AI Expansion
        - >-
          Care Access Network integrations across Gemini and conversational AI engines establish new distributed
          scheduling touchpoints.
        - >-
          AI patient guidance tools remain unmonetized experiments with uncertain direct contribution to core
          marketplace bookings.
        - Disclosed enterprise contract values and measurable booking conversion metrics from AI-assisted workflows.
    notes: >-
      Synthesizes core business drivers, commercial monetization shifts, and technological opportunities against
      operational and structural risks.
    claimRefs:
      - CV003
      - CV004
      - CV006
      - CV007
      - CV008
      - CV009
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumed Operating Performance
      - Revenue Multiple Range
      - Implied Valuation Range
      - Probability Signal
      - Downside / Upside Triggers
    rows:
      - - Bull Case
        - >-
          Annual revenue growth exceeds 25%; EBITDA margin expands to 20%+ driven by Care Access Network and practice
          SaaS adoption.
        - 12.0x - 14.0x EV / Rev
        - $2.1B - $2.5B
        - 25%
        - >-
          Successful S-1 IPO filing with confirmed organic booking dominance and accelerating enterprise health system
          adoption.
      - - Base Case
        - >-
          Steady-state annual revenue growth of 10% - 15%; sustained single-digit positive EBITDA margins; stable
          marketplace provider liquidity.
        - 7.5x - 8.5x EV / Rev
        - $1.2B - $1.4B
        - 50%
        - >-
          Marketplace retains provider density but growth mirrors broader outpatient volume expansion rather than
          category creation.
      - - Bear Case
        - >-
          Revenue stagnates (0% - 5% growth); provider fee pushback causes localized churn; search acquisition costs
          compress EBITDA to breakeven.
        - 4.0x - 5.0x EV / Rev
        - $550M - $650M
        - 25%
        - >-
          Disintermediation by search platforms, healthcare system closed portals, or aggressive liquidation preference
          activation.
    notes: >-
      Scenario models apply normalized healthtech marketplace revenue multiple bands against estimated baseline run-rate
      revenue of $150M-$165M.
