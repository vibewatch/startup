      - number: '7.3'
        title: Regulatory Compliance, Terms Disclaimers, and Autonomous AI Governance
        blocks:
          - type: paragraph
            body: >-
              Operating as an intermediary between patients and healthcare providers introduces stringent regulatory and
              legal responsibilities under state healthcare licensing laws, federal referral prohibitions, and data
              privacy mandates. Zocdoc formally disclaims all medical professional-patient relationships and medical
              advice in its terms of use, mandating binding individual arbitration and formal mass-arbitration stage
              gates for consumer disputes. Furthermore, the deployment of automated systems such as the Zo AI phone
              scheduling assistant and conversational triage surfaces technical risks of hallucination, misrouting, and
              scheduling errors. As healthcare systems increase scrutiny over algorithmic intake, Zocdoc faces
              operational dependencies on EHR calendar synchronization.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
