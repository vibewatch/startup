      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Overhang and Capital Structure Disconnect
            body: >-
              Secondary market trades observed in 2026 indicate an equity pricing level roughly two-thirds below 2021
              primary funding benchmarks. This valuation gap presents acute recapitalization and exit headwinds if
              public market liquidity remains selective.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: Marketplace Economic Friction Under Per-Booking Pricing
            body: >-
              While shifting to variable booking fees expanded provider adoption, elevated no-show rates create
              asymmetric downside for clinicians. Without operational automation closing intake and attendance, provider
              retention in specialized practices faces chronic pressure.
            calloutType: insight
            claimRefs:
              - CR005
