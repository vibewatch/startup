figures:
  - id: FO001
    title: Zocdoc Corporate Evolution and Milestone Timeline (2007-2026)
    type: timeline
    summary: >-
      Chronological trajectory of Zocdoc from its 2007 founding and 2015 restructuring through pandemic telehealth
      expansion and 2024-2026 legal and AI milestones.
    data:
      items:
        - date: 2007-09
          label: Company Founding & TechCrunch Launch
          detail: >-
            Oliver Kharraz, Cyrus Massoumi, and Nick Ganju launch Zocdoc for Manhattan dental appointments at
            TechCrunch40.
        - date: 2008-08
          label: Early Institutional Capitalization
          detail: >-
            Secures Series A venture funding from Khosla Ventures alongside angel investments from Jeff Bezos and Marc
            Benioff.
        - date: 2011-09
          label: Series C Growth Financing
          detail: Raises $75M from Goldman Sachs at a $772M post-money valuation to fund multi-city platform expansion.
        - date: 2015-08
          label: Unicorn Financing Peak
          detail: >-
            Reaches $1.8B valuation following $152.6M Series D investment from Atomico, Baillie Gifford, and Founders
            Fund.
        - date: 2015-11
          label: Governance Restructuring & CEO Transition
          detail: >-
            Board replaces CEO Cyrus Massoumi following $43M cash burn in 2015; appoints co-founder Oliver Kharraz as
            CEO.
        - date: 2019-01
          label: Pricing Model Transformation
          detail: >-
            Transitions monetization from flat $3,000 annual doctor subscription to variable fee per new patient
            booking.
        - date: 2019-12
          label: EBITDA Profitability Inception
          detail: Reaches positive operational EBITDA in September 2019 and posts first full profitable quarter in Q4 2019.
        - date: 2020-05
          label: Telehealth Infrastructure Launch
          detail: Rolls out video visit capabilities and free HIPAA-compliant video service in response to COVID-19 pandemic.
        - date: 2021-02
          label: Francisco Partners Financing Round
          detail: Secures growth funding led by Francisco Partners with primary post-money valuation reaching $2.62B.
        - date: 2024-07
          label: Founder Lawsuit Dismissed With Prejudice
          detail: NY Supreme Court decisively dismisses ousted founder Cyrus Massoumi's governance lawsuit with prejudice.
        - date: 2025-05
          label: Generative AI Voice Agent Launch
          detail: Releases Zo, a voice-based artificial intelligence assistant to automate clinic phone scheduling.
        - date: 2026-03
          label: Secondary Market Valuation Reset
          detail: >-
            Secondary market trades average $11.99 per share, reflecting a 67.26% discount against the 2021 primary
            mark.
    approximationNotes: >-
      Timeline represents discrete historical corporate milestones verified across primary announcements and judicial
      records; month-level dating is used where exact day was not published.
    claimRefs:
      - CO001
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
      - CO011
      - CO012
      - CO013
