              - CR004
              - CR009
              - CR010
      - number: '7.2'
        title: Operational Economics, No-Shows, and Provider Attrition
        blocks:
          - type: paragraph
            body: >-
              The core operational engine of Zocdoc relies on a variable fee per-booking pricing model ($35 to $110 per
              new patient booking depending on geography and medical specialty) rather than fixed monthly subscriptions.
              This fee structure creates operational vulnerability: independent operational reviews report that
              marketplace patients exhibit no-show rates 3 to 5 times higher than standard practice walk-ins, leading to
              provider complaints regarding phantom patient billing and unrecouped fees. Because independent clinicians
              must absorb acquisition costs regardless of whether a patient converts into ongoing clinical care,
              provider dissatisfaction remains elevated, driving marketplace churn and threatening provider network
              density across key metropolitan areas.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
