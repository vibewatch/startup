  - id: FI001
    title: Marketplace Monetization and Value Realization Flow
    type: flow
    summary: >-
      Visualizing the progression of patient discovery through variable fee capture, provider realization, and margin
      leakage risks.
    data:
      nodes:
        - id: discovery
          label: Patient Discovery & Booking
          detail: Patient books via marketplace or partner integration
        - id: verification
          label: Insurance & Eligibility Check
          detail: Practice front office verifies insurance coverage and eligibility
        - id: fee-accrual
          label: Zocdoc Fee Accrual
          detail: Variable per-booking transaction fee charged to provider
        - id: attendance
          label: Appointment Attendance
          detail: Patient completes visit or triggers elevated no-show risk
        - id: billing-resolution
          label: Fee Dispute & Audit
          detail: Provider audits phantom bookings or no-show billing dispute
        - id: realization
          label: Provider Economic Realization
          detail: Provider collects insurance reimbursement or absorbs uncollected overhead
      edges:
        - from: discovery
          to: verification
        - from: verification
          to: fee-accrual
        - from: fee-accrual
          to: attendance
        - from: attendance
          to: billing-resolution
        - from: billing-resolution
          to: realization
    approximationNotes: >-
      Flow illustrates the operational and economic sequence of Zocdoc's variable booking model based on contractual
      terms and provider workflow studies.
