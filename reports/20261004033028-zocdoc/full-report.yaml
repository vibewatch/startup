              - CU006
              - CU007
              - CU011
      - number: '6.3'
        title: Retention Dynamics, Service Friction, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Customer durability on Zocdoc is governed by provider return on investment, scheduling synchronization
              reliability, and patient service friction. In its earlier operating history, Zocdoc encountered
              significant provider attrition under a rigid flat monthly subscription model that charged uniform rates
              regardless of delivered booking volume, prompting a strategic multi-year pivot toward volume-aligned
              per-booking compensation. Operational durability requires continuous front-desk alignment: patient
              grievances in healthcare environments stem predominantly from service delays, scheduling misalignments,
              and billing ambiguity rather than clinical care disputes. When appointment slots fail to sync in real time
              or wait times expand, practice cancellations and negative public reviews directly threaten provider
              retention. Zocdoc's enterprise expansion mitigates single-customer concentration risk by distributing
              commercial revenue across tens of thousands of outpatient practices and diverse hospital systems, but
              introduces technical switching friction tied to complex PMS calendar integrations and front-office staff
              training.
            claimRefs:
              - CU003
              - CU004
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU005
              - CU006
              - CU007
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Shift from Flat Subscriptions to Transactional Alignment
            body: >-
              Zocdoc's historical transition away from a rigid $300 monthly subscription toward a fee-per-booking model
              resolved a fundamental provider unit-economics flaw. Under flat pricing, low-volume rural practices
              experienced steep customer churn while high-volume urban practices extracted disproportionate value.
              Realigning value capture with delivered bookings improved provider retention durability.
            calloutType: insight
            claimRefs:
              - CU003
              - CU004
          - type: callout
            title: Front-Desk Service Friction as an Operational Churn Driver
            body: >-
              Provider churn on appointment marketplaces is rarely caused by clinical dissatisfaction; rather,
              front-desk friction, extended waiting room delays, and surprise billing confusion account for the vast
              majority of patient complaints. When digital scheduling links malfunction or calendar availability falls
              out of sync, negative reviews and practice churn rapidly escalate.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Capital Structure, Liquidity, and Valuation Overhang
        blocks:
          - type: paragraph
            body: >-
              Zocdoc's capitalization structure reflects severe valuation compression and illiquidity following peak
              venture funding rounds. While the company achieved an $1.8 billion valuation in its August 2015 financing
              round and subsequent 2021 primary funding, secondary market activity in 2026 demonstrates steep discounts.
              Federal court receivership filings in 2025 and 2026 confirm that pre-IPO secondary share transactions have
              encountered very limited market activity, with brokers noting that ZocDoc shares traded at $28.22 in 2016
              and $15.00 in 2020 before reaching further depressed marks. Secondary market pricing in 2026 reflects an
              approximate 67% discount relative to 2021 peak valuations, creating substantial liquidation preference
              overhang and misalignment across shareholder classes.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
