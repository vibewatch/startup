chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Origins, and Marketplace Architecture
        blocks:
          - type: paragraph
            body: >
              Zocdoc was established in New York City in 2007 by Oliver Kharraz, Nick Ganju, and Cyrus Massoumi, who
              served as the company's initial chief executive officer. The company's origin was prompted by an acute
              healthcare navigation failure when Massoumi suffered a burst eardrum while traveling and encountered
              severe difficulty finding timely local physician appointments. Launching publicly at the TechCrunch40
              conference in September 2007, the company initially focused on dental booking across Manhattan before
              scaling nationwide into medical and dental care across more than 100 clinical specialties.


              The core platform operates as an online appointment marketplace that enables patients to discover
              in-network physicians, inspect verified user reviews, verify insurance acceptance across more than 18,000
              health plans, and execute digital scheduling without booking fees. For healthcare providers, Zocdoc
              functions as a demand-generation engine and scheduling layer integrated with practice calendars and
              electronic health record systems. Over its development, Zocdoc expanded into nationwide telemedicine in
              May 2020 and introduced its voice-based artificial intelligence assistant, Zo, in May 2025 to automate
              inbound telephone booking workflows.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
