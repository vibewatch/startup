    type: flow
    summary: >-
      Decision sequence from scale and turnaround proof through financial opacity to the final research-more
      underwriting stance.
    data:
      nodes:
        - id: scale
          label: Scale & Reach
          detail: 20M+ patients, 200+ specialties, and 12,000+ insurance plans nationwide
        - id: turnaround
          label: Turnaround & Model Shift
          detail: Migration to fee-per-booking model yielded EBITDA profitability in late 2019
