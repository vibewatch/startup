callouts:
  - calloutType: "insight"
    title: "The Shift from Flat Subscriptions to Transactional Alignment"
    body: "Zocdoc's historical transition away from a rigid $300 monthly subscription toward a fee-per-booking model resolved a fundamental provider unit-economics flaw. Under flat pricing, low-volume rural practices experienced steep customer churn while high-volume urban practices extracted disproportionate value. Realigning value capture with delivered bookings improved provider retention durability."
    claimRefs:
      - "CU003"
      - "CU004"
  - calloutType: "risk"
    title: "Front-Desk Service Friction as an Operational Churn Driver"
    body: "Provider churn on appointment marketplaces is rarely caused by clinical dissatisfaction; rather, front-desk friction, extended waiting room delays, and surprise billing confusion account for the vast majority of patient complaints. When digital scheduling links malfunction or calendar availability falls out of sync, negative reviews and practice churn rapidly escalate."
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU011"
