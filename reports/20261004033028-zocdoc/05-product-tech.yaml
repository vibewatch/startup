callouts:
  - calloutType: "insight"
    title: "The Boundaries of Marketplace Scheduling vs Clinical Automation"
    body: "Zocdoc's core technical strength lies in consumer aggregation and real-time scheduling synchronization across fragmented provider calendars. However, operational diligence reveals clear boundaries: unlike EHR-native operational AI platforms, Zocdoc does not execute deep clinical workflows such as real-time insurance eligibility checks, prior authorization management, or clinical medication reviews. Practices utilizing Zocdoc must maintain dedicated front-office workflows to verify benefits and mitigate higher average appointment no-show rates."
    claimRefs:
      - "CE008"
      - "CE013"
      - "CE014"
      - "CE015"
  - calloutType: "risk"
    title: "Integration Fragility and EHR Ecosystem Dependencies"
    body: "Maintaining real-time bidirectional appointment synchronization across more than 150 different EHR and practice management systems presents continuous technical risk. Disparate API standards, legacy on-premise systems, and frequent EHR vendor version updates create ongoing maintenance overhead, where sync failures can directly translate into practice scheduling discrepancies or patient dissatisfaction."
    claimRefs:
      - "CE006"
      - "CE010"
      - "CE013"
