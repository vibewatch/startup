callouts:
  - calloutType: "insight"
    title: "The Strategic Dilemma of Variable Per-Booking Monetization"
    body: "Zocdoc's pivot from flat SaaS subscriptions to per-booking transaction fees resolved its 2015 revenue plateau and supported its transition to operational profitability. However, because monetization occurs at the moment of booking rather than completed clinical care, providers bear the risk of no-shows and unverified insurance coverage, creating tension between marketplace booking volume and provider net unit economics."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI007"
  - calloutType: "risk"
    title: "Secondary Market Valuation Decoupling"
    body: "While company communications emphasize sustained EBITDA profitability and growth since 2019, private secondary transactions in early 2026 priced Zocdoc shares at an average of $11.99, reflecting a steep 67.26% discount from its 2021 primary post-money valuation. This substantial discount underscores institutional investor caution regarding late-stage marketplace multiples and lack of audited public financials."
    claimRefs:
      - "CI011"
      - "CI013"
      - "CI014"
