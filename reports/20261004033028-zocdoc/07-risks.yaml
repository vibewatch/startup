    title: "Valuation Overhang and Capital Structure Disconnect"
    body: "Secondary market trades observed in 2026 indicate an equity pricing level roughly two-thirds below 2021 primary funding benchmarks. This valuation gap presents acute recapitalization and exit headwinds if public market liquidity remains selective."
    claimRefs:
