- id: sizing-lenses-and-why-estimates-diverge
  title: Sizing lenses and why estimates diverge
  body: |-
    Public market-size estimates are directionally useful but methodologically messy. HowToHosting’s 2026 roundup places the website-builder market at roughly $2.6 billion and notes nearby third-party estimates ranging from about $2.0 billion to $4.9 billion depending on whether the publisher includes broader SaaS ecommerce and hybrid tools. Axis Intelligence places the AI website-builder subsegment between $3.57 billion and $6.3 billion in 2026 depending on source scope. Searchlab’s no-code/low-code statistics push the outer boundary much farther out, to roughly $65 billion in 2026.

    These figures are not interchangeable. The narrowest figures map best to hosted website-building software; the broader ones start to incorporate content infrastructure, AI tooling, app builders, and adjacent workflow software. Even the same label — “website builder market” — can mean markedly different product bundles depending on the publisher. That is why a clean underwriting model should preserve competing lenses rather than flattening them into one synthetic number.

    The right conclusion is not that TAM is unknowable; it is that Webflow’s market should be modeled as nested layers. The premium professional-web segment is smaller than the no-code outer boundary but larger than a hobbyist site-builder niche, and later investment conclusions should be anchored to that middle layer rather than to the most generous available estimate.
