  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: premium-professional-web-sam
    missingEvidence: A public 2026 estimate that isolates the premium professional-web platform segment rather than the full no-code, AI-builder, or generic builder market.
    whyItMatters: Without a clean middle-layer SAM, later valuation work risks overstating Webflow’s addressable market by borrowing a much broader category number.
    diligencePath: Build a bottom-up SAM from target buyer cohorts, average web-platform spend, and deal-size assumptions, or obtain a private market study from management or investors.
    relatedQuestionRefs:
    - QM020
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: builder-vs-custom-adoption
    missingEvidence: An apples-to-apples 2026 study showing what share of new business sites are built on hosted builders versus custom development by buyer segment.
    whyItMatters: The relative conversion from broad website need to premium-builder spend determines how much of the outer market actually becomes monetizable for Webflow.
    diligencePath: Request funnel data from industry analysts or use platform-side cohort data on site launches, segment mix, and upgrade behavior.
    relatedQuestionRefs:
    - QM009
    - QM025
    relatedTableRefs:
    - TM004
  - type: private-evidence-only
    severity: material
    topic: switching-costs-and-roi
    missingEvidence: Independent cohort data on migration cost, retention, and payback across enterprise web-platform decisions.
    whyItMatters: Official ROI claims and customer stories are useful, but investors still need independent evidence on how sticky premium-web platforms remain as features converge.
    diligencePath: Obtain customer retention cohorts, migration win/loss notes, and third-party ROI studies from Webflow or channel partners during commercial diligence.
    relatedQuestionRefs:
    - QM023
    - QM024
    relatedTableRefs:
    - TM003
    - TM004
