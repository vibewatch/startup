  - - Cloud delivery and hosted infrastructure
    - positive
    - current
    - Makes continuous rollout of AI, CMS, security, and collaboration features practical
    - Which buyers actually reward hosted convenience with higher ACV?
  - - AI-assisted website creation
    - positive
    - current
    - Accelerates first draft creation and raises buyer expectations for speed
    - Does AI increase willingness to pay for premium web stacks or commoditize the low end?
  - - Enterprise governance and software-sprawl control
    - positive
    - current
    - Favors platforms with RBAC, auditability, provisioning, and integrated operations
    - Can Webflow keep security and controls ahead of enterprise procurement demands?
  - - Developer scarcity and marketing-team autonomy
    - positive
    - current
    - Supports products that remove bottlenecks between content, design, and launch
    - How durable is this driver as AI code generation improves across tools?
  - - Feature convergence among premium builders
    - negative
    - current
    - AI, collaboration, and enterprise messaging are becoming table stakes
    - Which Webflow capabilities remain meaningfully differentiated versus Framer and Wix Studio?
  - - Market-boundary inflation
    - negative
    - ongoing
    - Overstated TAM claims can mask a much narrower true SAM
    - Use nested market lenses instead of a single expansive TAM headline
  - - Adjacent substitute pressure from commerce, app, and composable stacks
    - negative
    - ongoing
    - Some deals rationally route to Shopify, Bubble, or Contentful instead of Webflow
    - What share of Webflow pipeline is truly competitive versus structurally non-core?
  notes: The same trends that expand category adoption also intensify competition, so market growth alone is not enough to justify premium valuation assumptions.
