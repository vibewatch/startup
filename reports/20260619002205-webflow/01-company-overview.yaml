company:
  name: Webflow
chapter:
  number: 1
  title: Company Overview
  summary: Webflow is a 2012-founded private web experience platform whose public materials currently claim 3.5 million users, more than 300,000 organizations, and $335 million in total funding, with the 2022 Series C still anchoring the best-supported $4 billion valuation reference point. The 2026 record also shows meaningful enterprise depth and rapid AI/CMS expansion, but it pairs that momentum with an April outage, a May restructuring, and persistent gaps around exact ARR, post-layoff headcount, and board visibility.
sections:
- id: identity-and-platform
  title: Identity, mission, and current platform scope
  body: |-
    Webflow is no longer best described as a simple no-code site builder. Its homepage now calls the product the “agentic web platform for modern businesses,” while the about page keeps the older mission language about bringing development superpowers to everyone and making digital experiences come alive. Across the homepage, CMS page, AI page, and AI-governance page, the company’s current self-definition is consistent: Webflow wants to own the system where marketing teams build, manage, optimize, and increasingly automate digital experiences without handing every change back to engineering.

    That positioning matters because it clarifies both what Webflow sells and what it wants investors to believe about its category. The CMS page frames Webflow as a content engine for marketers and developers, the AI page layers copy generation, design modification, code generation, and optimization into the workflow, and the AI-governance page adds workspace-level controls and privacy language intended to make that AI story enterprise-safe. The company is therefore pitching a hosted operating layer for web experiences, not merely a visual editor.

    Public partner and launch coverage still supports the older founding narrative behind that thesis. TechCrunch’s 2013 launch piece showed Webflow emerging as a responsive-web design tool for agencies and designers, while the company’s later funding posts describe a longer journey from design tooling toward broader website and application ambitions. The clearest takeaway for later chapters is that Webflow’s identity has widened from visual web development into a broader web experience platform, and the company is now explicitly using AI and governance as proof that it belongs in a higher-value software category.
