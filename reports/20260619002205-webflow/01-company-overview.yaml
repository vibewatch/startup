  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-arr
    missingEvidence: A current management-level ARR, revenue, or gross-margin disclosure after the 2022 Series C benchmark.
    whyItMatters: A fresh economic output number is necessary to judge valuation durability and operating leverage in 2026 rather than anchoring on stale 2022 commentary.
    diligencePath: Request current annualized recurring revenue, recent growth rate, and margin bridge directly from management or investor materials.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: post-restructure-headcount
    missingEvidence: An exact post-May-2026 employee count with geography and function mix.
    whyItMatters: The about-page workforce marker may predate the restructuring, so current capacity and cost structure cannot be read cleanly from public materials.
    diligencePath: Obtain the current org chart, active employee count, and restructuring scope from management or HR diligence materials.
    relatedQuestionRefs:
    - QO015
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: A public or private board roster showing independent directors, investor seats, and committee structure.
    whyItMatters: Executive depth is visible, but investors still need to understand who oversees strategy, risk, and management after the CEO transition and 2026 restructuring.
    diligencePath: Request board materials, governance docs, and cap-table-linked control rights during management diligence.
    relatedQuestionRefs:
