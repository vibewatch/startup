  evidenceGaps:
  - type: missing-source
    severity: material
    topic: current-webflow-revenue
    missingEvidence: A current 2026 ARR or recognized-revenue disclosure from Webflow or another highly credible independent source.
    whyItMatters: Historical ARR markers and outcome stories do not establish current scale, growth, or the right denominator for valuation work.
    diligencePath: Request current ARR, recognized revenue, annual growth, and segment mix directly from management or audited board materials.
    relatedQuestionRefs:
    - QI007
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash balance, gross and net burn, runway months, debt, and covenant detail.
    whyItMatters: Without the balance-sheet and cash-flow stack, capital-adequacy conclusions remain qualitative and valuation risk cannot be stress-tested.
    diligencePath: Request latest balance sheet, treasury summary, debt schedule, and management runway model under base and downside scenarios.
    relatedQuestionRefs:
    - QI015
    - QI016
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: realized-pricing-and-retention
    missingEvidence: Realized pricing, module attachment, seat counts, discounting, retention, churn, and NRR by customer segment.
    whyItMatters: Public list prices and case studies are not enough to prove revenue quality, gross-margin durability, or efficient upmarket expansion.
    diligencePath: Request cohort dashboards and finance reports covering ASP, discount waterfall, GRR, NRR, churn, and sales efficiency.
    relatedQuestionRefs:
    - QI014
    - QI022
    - QI025
    relatedTableRefs:
    - TI001
    - TI005
