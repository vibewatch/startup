- id: TI002
  title: Pricing / monetization table
  columns:
  - Item
  - Public price or rule
  - What changed
  - Remaining unknowns
  - Implication
  rows:
  - - Basic site plan
    - $15/mo billed yearly
    - Raised from the pre-update annual Basic level; static page limits improved
    - Realized discounting, monthly mix, and seat attachment remain private
    - Keeps a low-end entry point while nudging price upward
  - - Premium site plan
    - $25/mo billed yearly, $39/mo monthly
    - Merged old CMS and Business tiers into one plan
    - Bandwidth add-ons and blended effective spend vary by usage
    - Simplifies the ladder but makes traffic economics more variable
  - - Business-plan migration example
    - $39 yearly Business -> $23 Premium base before add-ons
    - 100GB included bandwidth becomes 50GB base with more CMS items
    - Actual customer bill depends on traffic and add-on needs
    - Headline price cuts can still mask higher effective TCO
  - - Team plan
    - $2,500 monthly-equivalent annual contract
    - New visible bridge between self-serve and Enterprise
    - Adoption, discounting, and renewal behavior are undisclosed
    - Creates a clear ARPU step-up for growing organizations
  - - AI credits
    - Included across workspace plans, enforced from June 29, 2026
    - Credits became a standard part of the platform story
    - Long-run usage pricing and margins remain unclear
    - Adds a usage-sensitive layer to an otherwise subscription-led model
  - - Legacy Editor migration
    - Automatic migration begins May 4, 2026; EOL August 4, 2026
    - Collaboration model shifts toward seats and roles
    - Seat-level cost and workflow disruption vary by customer
    - Collaboration control is becoming more standardized and monetizable
  - - Site-plan timing
    - New purchases changed on May 13, 2026; existing sites shift on June 29 or November 16 depending on workspace
    - Migration timing differs by agency/freelancer versus other workspaces
    - Renewal timing and annual lock-in tactics vary account by account
    - Revenue timing and churn sensitivity likely vary by cohort
  notes: This table focuses on the 2026 pricing and packaging changes that most directly affect revenue mix and customer economics rather than reproducing every feature checkbox.
