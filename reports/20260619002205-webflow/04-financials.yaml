- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Why it matters
  - Best public substitute
  - Why substitute is insufficient
  - Exact diligence path
  rows:
  - - Current ARR / revenue
    - Blocks valuation and growth underwrite
    - 2022 ARR anchor plus case-study momentum
    - Historical ARR does not show present scale or growth rate
    - Request monthly ARR bridge, recognized revenue, and segment split
  - - Cash balance
    - Blocks runway analysis
    - Total funding disclosed and CFO hire signal
    - Funding raised does not reveal cash remaining after years of spend and M&A
    - Request latest balance sheet and treasury summary
  - - Burn and runway
    - Blocks financing-dependency judgment
    - No direct public disclosure
    - No way to convert product breadth into months of operating flexibility
    - Request trailing 12-month cash flow and management runway model
  - - Gross margin / COGS
    - Blocks revenue-quality and capital-intensity view
    - Hosted product surfaces imply cost drivers
    - Feature evidence does not show actual infrastructure or support burden
    - Request gross margin bridge and COGS by category
  - - Retention / NRR / churn
    - Blocks durability view
    - Case studies and customer-count signals
    - Outcome stories do not reveal whether expansion outweighs churn
    - Request GRR, NRR, churn, and cohort retention tables
  - - Realized pricing and discounting
    - Blocks true ASP and pricing-power analysis
    - Visible list prices and migration calculator
    - List prices exclude workspace, seats, and negotiated contract reality
    - Request discount waterfall, annual share, and module attach rates
  - - Sales efficiency / CAC / payback
    - Blocks capital-efficiency assessment
    - No public metric beyond qualitative traction
    - Team and Enterprise expansion could still be capital-intensive
    - Request CAC by channel, payback, sales cycle, and win-loss by segment
  notes: These are the main private metrics that still separate a persuasive public narrative from a real financial underwrite.
  enumerationScope:
