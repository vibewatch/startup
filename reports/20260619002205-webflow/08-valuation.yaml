tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Why
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - Current public evidence shows a high-quality platform but not enough fresh financial proof to underwrite the old private mark confidently.
    - Keep the company live in coverage, but require a management data room or updated pricing before treating entry as investable.
  - - Confidence
    - Medium
    - The financing anchor, public comps, and platform posture are clear; the current operating metrics are not.
    - Treat the call as evidence-sensitive rather than as a conviction expression about product quality.
  - - Risk rating
    - High
    - The main downside is not distress but multiple compression against a stale anchor if current revenue or retention quality disappoints.
    - Use explicit kill criteria and avoid making timing or pricing assumptions from the 2022 round alone.
  - - Valuation stance
    - Stretched
    - A $4 billion mark still looks rich against current public web-platform references until newer revenue and margin data are disclosed.
    - Demand proof that Webflow has grown into a premium multiple under 2026 conditions before moving from research-more to track or buy.
  - - What would improve the call
    - Fresh current metrics
    - Updated revenue, ARR mix, retention, gross margin, and cap-table terms could justify a much cleaner premium narrative.
    - A single disciplined diligence cycle could materially change the recommendation without any product change at all.
  notes: 'This table is intentionally price-sensitive: company quality is not enough by itself because the latest clear valuation anchor is historical and the newest operating proof is incomplete.'
