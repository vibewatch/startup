- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation logic
  - Implied value
  - Probability signal
  rows:
  - - Bull
    - Current revenue is already well above the old 2022 public anchor, enterprise mix has improved, and support/governance claims are backed by strong retention and margins.
    - 15x-18x revenue / ARR framing can support a premium private mark if quality and growth both remain strong.
    - $3.5B-$4.8B
    - Requires management data that public sources do not yet provide.
  - - Base
    - Webflow is clearly larger and better than a mature builder, but current metrics are good rather than exceptional and disclosure remains incomplete.
    - 10x-13x revenue framing fits a strong platform with some premium but not outlier certainty.
    - $2.0B-$3.2B
    - Most consistent with current public evidence and the need for more proof.
  - - Bear
    - Growth has slowed or enterprise quality is weaker than the product story implies, while software multiples remain disciplined.
    - 6x-9x revenue framing pushes Webflow closer to public web and software references than to 2022 private extremes.
    - $1.1B-$2.0B
    - Would become more plausible if the next financing or secondary data resets the premium narrative.
  notes: Scenario values are underwriting ranges rather than management forecasts; they are explicitly driven by revenue thresholds, comp bands, and the disclosure gap around current metrics.
