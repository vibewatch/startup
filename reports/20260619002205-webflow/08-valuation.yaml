  evidenceGaps:
  - type: stale
    severity: material
    topic: current-revenue-anchor
    missingEvidence: A current audited revenue or ARR figure after the 2022 near-$100M public milestone.
    whyItMatters: Without a fresh revenue base, investors cannot determine whether the old $4B mark has already been grown into or remains a peak-era badge.
    diligencePath: Request current management financials, a revenue bridge from 2022 to 2026, and the latest board-approved operating plan.
    relatedQuestionRefs:
    - QV003
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-secondary
    missingEvidence: Liquidation preferences, any secondary component, governance rights, and evidence of recent secondary pricing or new financings.
    whyItMatters: Headline post-money valuation can materially overstate what investors are really buying if preferences, secondaries, or governance protections are non-standard.
    diligencePath: Request financing documents or counsel summary plus any recent secondary-market or board-level pricing references.
    relatedQuestionRefs:
    - QV024
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: retention-and-churn
    missingEvidence: NRR, GRR, logo churn, cohort retention, and expansion behavior by customer segment.
    whyItMatters: Premium software multiples require confidence that revenue persists and compounds; without retention data, valuation quality is largely inferred.
    diligencePath: Request cohort tables by vintage, segment, and ACV band, along with a churn bridge and major-renewal notes.
    relatedQuestionRefs:
    - QV025
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: economics-quality
    missingEvidence: Current gross margin, hosting-cost burden, support-cost structure, and cash-conversion detail.
    whyItMatters: A great product can still deserve a lower multiple if infrastructure or service costs compromise software economics.
    diligencePath: Request current margin bridge, hosting-cost trend, services mix, and operating cash flow detail.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: arr-mix-and-acv
    missingEvidence: Revenue split across self-serve, Premium, Team, and Enterprise, including contract length and named large-account ACVs.
    whyItMatters: The bull case depends on higher-quality enterprise revenue rather than just bigger user counts or product breadth.
    diligencePath: Request plan-tier ARR mix, contract-duration distribution, and top-account economics.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: minor
    topic: recent-market-clearing-price
    missingEvidence: A newer official financing or broadly observable secondary clear that validates or resets the $4B anchor under 2026 market conditions.
    whyItMatters: Tracker pages can frame the market, but a new price-setting event would be more probative than indirect previews or historical rounds.
    diligencePath: Refresh private-market and financing research in the next update cycle and request any board-approved 409A or tender references.
    relatedQuestionRefs:
    - QV005
    - QV023
    relatedTableRefs:
    - TV004
    - TV006
