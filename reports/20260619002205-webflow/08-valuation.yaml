- id: scenario-underwriting-and-recommendation
  title: Scenario underwriting favors caution over admiration
  body: 'A disciplined valuation view starts with threshold math, not with storytelling. If a buyer wants the $4 billion mark to look reasonable on a 15x revenue multiple, Webflow would need roughly $267 million of annual revenue. At 10x, it would need about $400 million; at 7x, about $571 million. Those thresholds are not absurd for a strong software platform, but current public evidence does not show whether Webflow is anywhere near them. The newest retained direct revenue milestone remains the 2022 near-$100 million ARR disclosure. That gap is exactly why the recommendation cannot be more aggressive than the evidence allows.


    The bullish case is still coherent: Webflow could already have grown materially beyond its last public anchor while expanding enterprise mix, preserving strong support economics, and using AI features to increase customer value rather than just raise pricing. The base case is narrower: Webflow is a high-quality company whose current public evidence simply does not justify paying at the old private-market peak without more disclosure. The bear case is asymmetric because downside can emerge faster than upside if growth has moderated or if public software multiples compress again. That asymmetry is why the chapter lands on research-more, medium confidence, high risk, and a stretched valuation stance. The issue is not whether Webflow matters. It is whether the public record is good enough to pay as if the difficult proof points are already settled.'
