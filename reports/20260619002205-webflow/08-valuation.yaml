- id: remaining-diligence-and-thesis-breaks
  title: What still has to be proved before price can be underwritten
  body: 'The central valuation gap is not the absence of a customer brand or a funding headline. It is the absence of the operating metrics that tell investors whether the old headline should still be trusted. Public sources do not disclose current NRR, GRR, churn by cohort, gross margin, hosting-cost intensity, ARR mix by Premium versus Team versus Enterprise, or detailed terms around preferences, secondary sales, or governance rights. Even PM Insights, one of the few sources visibly tracking Webflow''s private market, exposes only a gated preview rather than a fully public set of cap-table and secondary data. This is exactly the kind of situation where a famous company can still be a hard underwriting problem.


    The practical implication is simple. A better recommendation does not require Webflow to become a different company; it requires management to disclose enough current evidence to show that the company has grown into its 2022 mark under today''s valuation regime. If updated revenue, retention, and margin data are strong, the stance can move from stretched toward fair quickly. If instead the next financing, private-secondary pricing, or customer-quality data disappoints, the 2022 premium will matter less as a badge of honor and more as a reference point for compression. The diligence path therefore runs through data, not debate.'
