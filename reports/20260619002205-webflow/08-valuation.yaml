- id: comparable-framing
  title: 'Comparable framing: public builders, private rounds, and design-software extremes'
  body: 'The comp set makes two things clear at once. First, Webflow does not need to be valued like a commodity website builder. Shopify still commands an order-of-magnitude richer public multiple than Wix or Squarespace because markets reward software platforms that combine scale, ecosystem depth, and durable monetization. Webflow''s enterprise claims, AI-native positioning, and broad product surface plausibly justify some premium to mature SMB-heavy peers. Second, current public evidence still puts the historical Webflow round far above the most straightforward public web-platform references. Wix screens below 1x trailing revenue on retained June 2026 figures, Squarespace''s 2024 take-private lands around 6.8x-7.1x 2023 revenue, and Shopify is around 11.4x trailing revenue.


    Private and strategic references explain how the 2022 Webflow mark happened, but they do not automatically validate it today. Figma''s announced Adobe deal implied around 50x ARR, yet Adobe also described >150% net dollar retention, ~90% gross margins, and >$400 million ARR—an entirely different quality bar. Contentful''s $3 billion Series F shows that headless or content platforms can attract large marks, but without public revenue detail it is only a framing reference, not a hard comp. The right conclusion is therefore not to average every number. It is to recognize that Webflow''s last public mark belongs in the upper tail of software valuation outcomes and needs current evidence—not just historical admiration—to stay there.'
