- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Current view
  - What would change the view
  rows:
  - - Premium platform thesis
    - Webflow looks more like an enterprise-minded website experience platform than a basic builder, so some premium to mature peers is warranted.
    - Updated revenue, retention, and margin proof that matches the platform story would strengthen this materially.
  - - Stale-anchor anti-thesis
    - The latest hard valuation anchor is still 2022, so investors are being asked to trust a premium mark without fresh audited operating evidence.
    - A current management metric pack or a new market-clearing financing event would weaken the anti-thesis.
  - - Enterprise-upside thesis
    - 300,000-brand scale, 24/7 support, governance features, and 99.99% enterprise SLAs support the idea that Webflow is moving upmarket.
    - Named large-account economics, ACV distribution, and renewal quality would make that upside more investable.
  - - Portability and control anti-thesis
    - Dynamic export limits and account-control dependence mean some buyers may still view Webflow as a controlled platform rather than a neutral infrastructure layer.
    - Evidence that enterprise buyers accept those limits because ROI and governance are strong would reduce this discount.
  - - Comp-set thesis
    - Private and strategic references like Figma and historical Webflow show that premium workflow software can justify rich multiples.
    - Those examples matter far less if Webflow cannot show similarly strong current economics.
  - - Disclosure anti-thesis
    - Without NRR, gross margin, ARR mix, and financing terms, the public case still rests more on inference than on proof.
    - A fuller diligence pack is the shortest path from admiration to underwriting.
  notes: Rows pair the current thesis with the exact disclosure or operating evidence that would move the view rather than treating conviction as static.
