- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric used
  - Multiple / valuation
  - Relevance to Webflow
  - Main limitation
  rows:
  - - Wix
    - Jun 18 2026 market cap vs FY2025 revenue
    - $1.78B market cap / $1.99B revenue = ~0.9x
    - Direct public website-builder reference with current financial disclosure.
    - Repurchase activity and mature profile make it a conservative reference for growth-stage premium software.
  - - Shopify
    - June 2026 market cap vs trailing-twelve-month revenue
    - $141.24B market cap / $12.37B revenue = ~11.4x
    - Shows what a scaled platform with durable software economics can command in public markets.
    - Commerce operating system, not a direct website-platform peer.
  - - Squarespace
    - 2024 go-private value vs 2023 revenue
    - $6.9B EV on $1.012B revenue = ~6.8x; completion at ~$7.2B = ~7.1x
    - Recent control transaction for a design-forward website platform.
    - Historical private-control transaction, not a live 2026 public multiple.
  - - Webflow 2022 Series C
    - Latest public Webflow valuation vs latest disclosed ARR
    - $4B valuation as ARR neared $100M = ~40x ARR
    - Best direct subject-company anchor for what investors previously paid.
    - Historical peak-era private round, not proof of current fair value.
  - - Contentful
    - 2021 Series F headline valuation
    - '>$3B valuation on a $175M round'
    - Useful upmarket content-platform reference for software appetite.
    - Retained public sources do not disclose a clean revenue base for multiple math.
  - - Figma / Adobe deal
    - 2022 announced transaction vs exit ARR
    - $20B value on >$400M ARR = ~50x ARR
    - Shows the upper extreme investors pay for elite design software with exceptional retention and margins.
    - Strategic design-platform reference with much stronger disclosed economics than Webflow's public record.
  notes: 'This enumeration is exhaustive for the six comparison families retained in this chapter: two live public comps, one recent control transaction, the subject company''s last public round, one private content-platform reference, and one strategic design-software reference.'
