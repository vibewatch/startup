      - number: '3.2'
        title: 设计驱动的直接同业与上探市场的现有玩家
        blocks:
          - type: paragraph
            body: >
              Framer 是 Webflow 最清晰的直接同业，因为它现在销售同一个宽承诺：由设计师和营销人员，而不是工程排队，运营快速、高质量的营销网站。它的起步价格低于 Webflow；企业页面现在宣传 SOC 2
              Type 2、ISO 27001、SSO、SCIM 和 99.99% uptime；自己的对比页面直接主张 Webflow
              结构更重、更难预测。这类竞品自写证据有偏见，但仍重要，因为它展示了一个可信挑战者如何在真实交易中攻击 Webflow。


              Wix Studio 是另一个重大直接威胁。它不只是模板建站器；当前产品表面突出自定义 CSS、代码工具、多站点管理、共享内容、SSO、协作和企业级基础设施。这让 Wix
              可以把专业网页功能与更大装机基础的分发触达结合。Squarespace 的重要性不同。独立评测仍把它在易用性和模板精致度上排在 Webflow 之上，因此它在高端 SMB 和创作者站点上仍相关；但相较
              Webflow、Framer 或 Wix Studio，公开证据在受治理企业网页工作流上更薄。
