  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与真实比较集合
        blocks:
          - type: paragraph
            body: >
              Webflow 并不真正处在一个扁平的「建站工具」桶里。它当前公开叙事是 agentic web marketing platform，组合了可视化开发、CMS、本地化、优化、分析，以及越来越 AI-native
              的搜索和云能力。这个框架把最接近的直接竞争推向那些同样承诺营销人员自主性、但不必重建整个前端栈的产品。Framer 和 Wix Studio 最符合这一描述。Framer
              用设计优先工作流和更低自助入口竞争；Wix Studio 则把专业级设计工具与更大 Wix 生态的装机基础和分发优势结合起来。


              当买家要完成的任务变化时，替代集合会迅速变宽。当易用性和精美模板比治理深度更重要时，Squarespace 仍相关。当网站本质上是商业运营层时，Shopify
              成为明显替代。当买家想要更开放或可组合架构时，Contentful 和 WordPress VIP 重要。Ghost 更窄，但在会员、newsletter 和出版工作流上仍相关。因此，Webflow
              的竞争风险是碎片化：公司防守的是 DIY 建站工具、开放企业栈和重商业平台之间一块有价值的中间地带，而不是单一同业集合。
