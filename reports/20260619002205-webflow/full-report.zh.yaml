      - number: '1.3'
        title: 融资历史、规模信号与当前版图
        blocks:
          - type: paragraph
            body: >-
              Webflow 的资本历史由公司自己的融资文章和第三方报道充分记录，完整度高于常见私营软件公司。公司披露 2019 年完成 $72 million Series A，2021 年按超过 $2.1 billion
              估值完成 $140 million Series B，2022 年 3 月由 YC Continuity 领投完成 $120 million Series C，并形成后来报道仍在使用、最有支撑的 $4
              billion 估值标记。官方 about 页面和 Forbes Series C 报道也都指向约 $335 million 的累计融资额，佐证力度明显好于许多私营软件公司事实组合。


              对私营公司来说，规模信号也强于平均水平，但时间口径混杂。当前 about 页面称 Webflow 拥有 25 个国家的 900 多名团队成员和 3.5 million 用户；安全页面称超过 300,000
              个组织使用该平台。更早但仍有用的融资报道补充了历史检查点：Series B 材料提到超过 2 million 用户、190 个国家的 100,000 名客户；Forbes 称 Series C 时公司有超过
              200,000 名客户和 400 名员工。这些信号方向一致，但不是等价指标，不应随意混合。


              最大未解指标问题是财务新鲜度。公开证据集更能确认融资、估值和客户广度，而不是当前 ARR 或重组后员工数。Forbes 称 Webflow 有望在 2022 年达到 $100 million
              ARR，但本轮审阅来源中，管理层没有给出同等硬度的 2026 年收入披露。因此，投资者应把公司视为资本充足、规模可见，但当前经济产出仍不透明。
