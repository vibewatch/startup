  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >
              Webflow 的公开变现表面远比简单宣传册网站订阅丰富，但仍明显以订阅为主，而不是以交易为主。定价页展示免费 Starter 层、$15 Basic 计划、$25 Premium 计划、需要年度合同的
              $2,500 Team 计划，以及自定义 Enterprise 层。这个结构重要，因为它显示 Webflow 正在把网页栈的持续运营变现：站点、CMS、治理、本地化、优化和协作。公司不像 Shopify
              那样依赖支付流水，也不只销售开发者工具。它销售的是企业如何搭建、发布和优化网站资产的经常性控制权。


              公开证据也显示，实际收入可能与标价方案明显不同。定价计算器明确排除工作区方案、席位，以及 Optimize、Analyze、Localization 等附加项。Team 和 Enterprise
              又通过打包治理、安全和 AI 导向功能，叠加了另一个变现层；这些功能并不存在于基础站点阶梯中。因此，收入架构足够清楚，可以描述；但还不足以推断真实混合
              ASP、实际折扣，或站点订阅、席位、企业合同和产品附加项之间的组合。
            claimRefs:
              - CI001
              - CI002
              - CI005
