  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类层次
        blocks:
          - type: paragraph
            body: >-
              本章最重要的市场判断不是数字，而是定义。Webflow 自己的企业版、CMS、AI 和 AEO 材料描述的是一套设计、治理、发布和优化数字体验的系统。它位于简单拖拽式建站工具之上，但仍低于最宽泛的低代码 /
              无代码和企业内容栈品类。官方竞品页面也强化了这种区分：Framer 把自己定义为面向专业网站的 AI 建站工具，Wix Studio 明确瞄准机构和企业，Bubble 定位 AI 应用构建器，Shopify
              以商业基础设施为先，Contentful 面向可扩展内容运营，WordPress.com 则销售覆盖多种站点类型的托管建站。


              这一来源组合说明，Webflow 的真实边界比整个无代码宇宙窄。Bubble 和 Shopify 在某些交易中是相邻替代品，但解决的是结构上不同的任务。Contentful
              可以在可组合企业端替代它，但前提是客户接受更模块化的栈。Squarespace 仍占据更简单的编辑和品牌站动作；Framer 和 Wix Studio 则是高端网页细分市场变得更拥挤的最直接信号。


              实务含义是，后续估值工作不应把所有低代码支出都视为与 Webflow 同等相关。高端专业网页品类真实存在，但必须由买家需求、工作流深度和治理要求来界定，而不是由能找到的最大 TAM 标题来界定。
