  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 视角
      - 当前观点
      - 什么会改变观点
    rows:
      - - 高端平台论点
        - Webflow 看起来更像面向企业的网站体验平台，而不是基础建站器，因此相对成熟同业应享有一定溢价。
        - 与平台故事相匹配的最新收入、留存和利润率证据，会显著强化这一点。
      - - 陈旧锚点反方论点
        - 最新硬估值锚点仍停在 2022 年，因此投资者被要求在缺少新近经审计经营证据的情况下相信溢价估值。
        - 当前管理层指标包，或一次按市场出清的新融资事件，会削弱这条反方论点。
      - - 企业上行论点
        - 300,000 个品牌规模、24/7 支持、治理功能和 99.99% 企业 SLA，支撑 Webflow 上探企业市场的判断。
        - 具名大客户经济性、ACV 分布和续约质量，会让这部分上行更可投资。
      - - 可迁移性与控制权反方论点
        - 动态导出限制和账号控制依赖，意味着一些买家仍可能把 Webflow 看成受控平台，而不是中立基础设施层。
        - 如果有证据显示企业买家因为 ROI 和治理足够强而接受这些限制，这一折价会降低。
      - - 可比集论点
        - Figma 和历史 Webflow 这类私人和战略参照显示，高端工作流软件可以支撑丰厚倍数。
        - 如果 Webflow 不能拿出同样强劲的当前经济性，这些案例的重要性会小得多。
      - - 披露反方论点
        - 缺少 NRR、毛利率、ARR 结构和融资条款时，公开案例仍更多靠推断，而不是靠证据。
        - 更完整的尽调材料，是从欣赏走向承销的最短路径。
    notes: 各行把当前论点与能够改变观点的具体披露或经营证据配对，而不是把信念当成静态结论。
