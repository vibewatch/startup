        - 继续覆盖公司，但在把入场视为可投资之前，要求管理层数据室或更新后的定价。
      - - 置信度
        - 中
        - 融资锚点、公开可比公司和平台姿态清晰；当前经营指标并不清晰。
        - 把这次判断视为取决于证据，而不是对产品质量表达强信念。
      - - 风险评级
        - 高
        - 主要下行不是困境，而是如果当前收入或留存质量不及预期，陈旧锚点会遭遇多重压缩。
        - 设定明确否决标准，不要仅凭 2022 年那轮融资来假设时点或价格。
      - - 估值立场
        - 偏高
        - 在更新的收入和利润率数据披露之前，$4B 估值相对当前公开 Web 平台参照仍显偏贵。
        - Webflow 需要证明自己已经在 2026 年环境下长进了溢价倍数，才值得从继续研究推进到跟踪或买入。
      - - 什么会改善判断
        - 新近当前指标
        - 更新后的收入、ARR 结构、留存、毛利率和股权结构条款，可能支撑一套干净得多的溢价叙事。
        - 即使产品完全不变，一轮纪律严明的尽调也可能实质改变建议。
    notes: 这张表刻意对价格敏感：公司质量本身还不够，因为最新清晰估值锚点来自历史，最新经营证据也不完整。
