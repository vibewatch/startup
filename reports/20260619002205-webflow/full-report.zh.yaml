      - number: '4.5'
        title: 公开可比公司与承销结论
        blocks:
          - type: paragraph
            body: >
              Shopify、Wix 和私有化前的 Squarespace 有用，并不是因为它们是完美可比公司，而是因为它们展示了规模化网页平台公司的公开披露长什么样。Shopify 的 2026
              年业绩提供收入增长、自由现金流率、GMV、MRR 表述，以及通向更深细节的申报路径。Wix 把超过 200 million 用户与数十亿美元收入和 SEC 报告结合起来。Squarespace
              最后一个公开收入基础提供了更直接可比的网站平台基准，尽管私有化后更新停止。Webflow 没有提供这种深度。它给出用户、融资、估值历史和案例研究结果，但没有当前 P&L、资产负债表或最关键的持久性指标。


              这种不对称塑造了结论。Webflow 的公开故事支持正面的定性判断：经常性托管变现、可见的上探市场扩张、有说服力的企业成果，以及围绕优化和 AI
              发现不断扩宽的产品表面。但仅靠公开证据，无法支撑高置信度估值承销。因此，正确的财务立场是有前景但披露不足。投资者在建立估值信心前，仍需要直接从管理层拿到实际定价、现金、烧钱、毛利率、留存和销售效率数据。
            claimRefs:
              - CI025
              - CI026
              - CI027
              - CI028
              - CI029
              - CI030
              - CI037
              - CI038
              - CI040
