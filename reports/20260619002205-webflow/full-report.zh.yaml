      - number: '1.5'
        title: 里程碑、负面事件与关键未解问题
        blocks:
          - type: paragraph
            body: >-
              里程碑记录足够扎实，后续章节不必靠猜测支撑。公司 2012 年创立，2013 年公开发布，2019、2021、2022 年完成大额机构轮融资，2023–2024 年补入更多资深运营高管，随后在 2026
              年推进下一代 CMS、AEO 和品牌感知 AI 收购。这条时间线解释了为什么 Webflow 现在把自己定位为 agentic web marketing platform，而不是可视化设计工具。


              但 2026 年记录并非全是利好。4 月宕机报告描述了一次 CMS 数据库集群故障，影响托管站点、表单、API、Dashboard 和 Designer，约 4%
              的直接受影响客户直到深夜才恢复。一个月后，Linda Tong 披露重组，并明确承认 AI
              工具和轻量建站工具能更快满足简单站点需求。外部裁员报道又增加了第二个警示：管理层没有发布确认后的裁员人数，因此观察者只能依赖外部估计，而不是清晰披露。


              这两件事让剩余尽调问题更尖锐。Webflow 仍未公开给出清晰董事会图谱、当前 ARR 数字或重组后精确员工数。因此，公司进入后续章节时，产品和客户证据很强，但运营与透明度缺口也真实存在，应压低任何轻松的「优质
              SaaS 复利机器」叙事。
