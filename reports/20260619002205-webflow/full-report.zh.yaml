        title: 产品范围、定价与模型风险敞口
        blocks:
          - type: paragraph
            body: >-
              2026 年定价重置减少了部分长期存在的包装混乱，但也暴露了模型风险。官方来源显示，CMS 和 Business 计划被合并为 Premium，客户会自动迁移；独立的 2026
              年代理商分析也一致认为，这对部分账户有利、对另一些账户不利。原 CMS 客户获得大幅提高的内容上限，但原 Business 客户如果不购买额外容量，可能遭遇真实的带宽缩水。新的 Team
              计划在战略上合理——它把本地化、治理、页面分支和面向 AI 的功能打包给已经超出自助阶段的客户——但每月 $2,500 也是一个显著价格台阶，会压窄市场中段。


              产品边界又叠加了一层商业风险。Webflow 显然仍最适合复杂营销和内容体验，而不是完整 Web app 或高度定制后端逻辑。官方导出指南显示，动态内容可移植性并不完整，因为 collections
              必须单独导出，表单在导出后停止工作。反向的合作伙伴和独立评论从买家角度强化了同一点：当工作流匹配 Webflow 的赛道时，它很有吸引力；但大型内容集、类应用需求、Git-native
              开发预期，或对成本敏感的流量增长，都可能重新打开自建还是购买的问题。因此，投资者应把定价简化理解为战略重置，而不是商业风险已经消失的证据。
