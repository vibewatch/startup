  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的核心风险及传导方式
        blocks:
          - type: paragraph
            body: >-
              Webflow 在 2026 年最尖锐的风险不是原始可用性或产品市场契合度，而是战略转向中的执行可信度。保留来源显示，公司一边同时加码企业治理、AI-native
              工具、平台宽度和更高价团队工作流，一边突然裁员；部分员工和生态观察者把裁员描述为破坏信任的事件。这种组合会提高一种概率：客户或合作伙伴不再只从功能角度理解正常的产品和定价变化，而是把它们放进治理框架里解读。


              第二组风险不是事件性风险，而是结构性风险。Webflow 的合同把终端用户通知、同意、隐私权利处理，以及许多站点级安全选择交给客户负责；其 DPA
              提供了真实保障，但也显示，审计访问、新分处理方异议窗口和证据深度，都比表层信任营销暗示的更受约束。最后一大风险组是商业化摩擦：Premium 和 Team 让包装更清晰，但带宽重置、AI credit
              货币化、动态内容可移植性限制，以及应用范围上限，在账户扩张时都可能变成续约或采购异议。换句话说，下行情景是叠加式的——治理冲击加合规负担，再加定价或范围摩擦——而不是单一灾难性技术缺陷。
