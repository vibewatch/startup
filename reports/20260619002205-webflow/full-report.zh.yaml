        - 合同 / 站点组合
        - 含治理、安全、支持和集成的定制定价
        - 有助于追加销售叙事，但实际成交不透明
        - 索取 ACV、续约率、折扣和服务负担
      - - 席位与协作
        - workspace 或席位变现
        - 按 workspace / 席位
        - 在站点计划迁移测算中被明确排除在定价计算器之外
        - 有可见度，但不足以建模混合支出
        - 索取每个付费账户的平均席位数和席位 ARPU
      - - 优化 / 分析 / 本地化
        - 附加型平台扩张
        - 功能或模块权益
        - Optimize、Analyze、Localization 和 AEO 叠加在核心计划之上
        - 对 ARPU 扩张重要，但附加情况不透明
        - 索取按细分市场划分的附加项采用率及续约影响
      - - AI 积分
        - 对用量敏感的变现层
        - 按 workspace 或计划给积分
        - 各计划现在都有积分，2026 年 6 月 29 日开始执行
        - 商业上有意思，但仍早期且难预测
        - 索取积分消耗、超额定价和 AI 毛利率假设
    notes: 这张表完整覆盖了截至 2026-06-19，在已抓取的定价、企业、产品和迁移材料中直接有证据支撑的变现表面。
