      - number: '3.3'
        title: 替代品、开放栈与待完成任务漂移
        blocks:
          - type: paragraph
            body: >
              最强替代品并不总是可视化建站工具。一旦网站与结账、支付、POS 和 B2B 商业流程不可分割，Shopify 就成为相关比较对象。一旦买家想要 headless
              或可组合运营模式，并要求更严格治理、更明确企业基础设施和更深栈灵活性，Contentful 就成为相关比较对象。当买家重视开放生态、年度合同支持、插件和 API 宽度，以及按流量扩展的企业运营，而不是
              Webflow 的一体化创作体验时，WordPress VIP 就重要。


              Ghost 距离更远，但仍重要，因为它解决了 Webflow 原生不拥有的一类出版者工作流：以会员、newsletter
              和编辑运营为重心。共同模式是，当营销速度、可视化控制和治理需要共存在一个托管平台内，Webflow 会赢；一旦买家的核心需求转向商业深度、开放栈控制、出版者变现，或更宽的工程控制型数字体验架构，Webflow
              就会失去讨论份额。
