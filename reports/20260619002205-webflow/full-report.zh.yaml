            body: >-
              Webflow 近期差异化推进发生在 CMS 层之上。Optimize 和 Analyze 试图把实验、分群、分析和转化工作流留在同一产品内，而不是把团队送去 Optimizely、VWO 或 GA
              式工具链。Optimize 的 AI 主导流量分配、基于规则的定向和 CRM 集成具备战略重要性，因为它们让 Webflow 更接近网站体验平台，而不是生产工具。Analyze
              的意义不同：它让非分析师用户无需重设置，就能访问页面级数据、点击图和目标跟踪。企业打包则用自定义角色、页面分支、审批和 pooled usage 包裹这些表面。主要尽调问题不是功能是否存在，而是买家能否相信
              Webflow 会提供持久的实验和测量深度，而不必最终重新引入专门点工具。
