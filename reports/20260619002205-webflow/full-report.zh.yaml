      - number: '8.2'
        title: 可比框架：上市建站平台、私募轮次与设计软件极端样本
        blocks:
          - type: paragraph
            body: >-
              可比样本同时说明两件事。第一，Webflow 不必按商品化网站构建器估值。Shopify 的公开倍数仍比 Wix 或 Squarespace
              高一个数量级，因为市场奖励能够结合规模、生态深度和持久货币化的软件平台。Webflow 的企业声明、AI-native 定位和宽产品表面，合理地支持它相对成熟、偏 SMB
              的同行获得一定溢价。第二，当前公开证据仍显示，Webflow 的历史轮次远高于最直接的公开 Web 平台参照。按保留的 2026 年 6 月数据，Wix 低于 1x trailing
              revenue；Squarespace 2024 年私有化交易约为 2023 年收入的 6.8x-7.1x；Shopify 约为 11.4x trailing revenue。


              私募和战略参照解释了 2022 年 Webflow 估值如何出现，但不能自动证明今天仍成立。Figma 宣布的 Adobe 交易隐含约 50x ARR，但 Adobe 也描述了 >150% net dollar
              retention、约 90% 毛利率和 >$400M ARR——这是完全不同的质量门槛。Contentful 的 $3B Series F 显示，headless
              或内容平台可以吸引高估值，但没有公开收入细节，它只能作为框架参照，不是硬可比。正确结论因此不是把所有数字取平均，而是承认：Webflow
              上一次公开估值处在软件估值结果的上尾，需要当前证据——不只是历史仰慕——才能留在那里。
