      - number: '2.2'
        title: 规模测算视角与估算分歧
        blocks:
          - type: paragraph
            body: >-
              公开市场规模估算有方向性参考价值，但方法上很杂。HowToHosting 的 2026 年汇总把建站工具市场放在约 $2.6 billion，并指出相邻第三方估算从约 $2.0 billion 到 $4.9
              billion 不等，取决于发布方是否纳入更宽的 SaaS 电商和混合工具。Axis Intelligence 把 AI 建站工具子板块在 2026 年放在 $3.57 billion 到 $6.3
              billion 之间，同样取决于来源范围。Searchlab 的无代码 / 低代码统计把外边界推得更远，约为 2026 年 $65 billion。


              这些数字不能互换。最窄口径最贴近托管式建站软件；更宽口径开始纳入内容基础设施、AI 工具、应用构建器和相邻工作流软件。即便同一个标签——「website builder
              market」——也可能因发布方不同而代表差异很大的产品组合。因此，清晰的承销模型应保留多套视角，而不是把它们压平成一个合成数字。


              正确结论不是 TAM 不可知，而是 Webflow 的市场应按嵌套层次建模。高端专业网页细分市场小于无代码外边界，但大于业余建站小众市场；后续投资结论应锚定这个中间层，而不是锚定最慷慨的可用估算。
