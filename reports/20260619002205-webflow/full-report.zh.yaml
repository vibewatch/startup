  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: standard
    summary: Webflow 的公开记录显示，公司从 2012 年成立、2013 年发布，到企业和 AI 扩张，走过了一条长期创始人主导的路径；但 2026 年也出现了可见的运营和市场压力。
    data:
      items:
        - date: '2012'
          label: 成立
          detail: Webflow 由 Vlad Magdalin、Sergie Magdalin 和 Bryant Chou 创立。
          tone: positive
        - date: 2013-08
          label: 公开发布
          detail: TechCrunch 报道其封闭测试发布，当时约 10,000 名用户已注册。
          tone: positive
        - date: 2019-08
          label: Series A
          detail: $72M Series A 开启第一阶段大型机构融资。
          tone: positive
        - date: 2021-01
          label: Series B
          detail: $140M 轮融资把估值推高到 $2.1B 以上，并为企业扩张提供资金。
          tone: positive
        - date: 2022-03
          label: Series C，估值 $4B
          detail: 由 YC Continuity 领投的 $120M Series C，固定了支撑最充分的估值参照点。
          tone: positive
        - date: '2023'
          label: Labs 与 CTO
          detail: Webflow Labs 发布，Allan Leinwand 加入担任 CTO。
          tone: positive
        - date: '2024'
          label: Intellimize + 首任 CFO
          detail: 收购优化公司并聘任首任 CFO，拓宽平台和运营范围。
          tone: positive
        - date: 2026-04
          label: CMS + AEO 周期
          detail: 下一代 CMS 和 AEO 发布，加深企业与 AI 搜索叙事。
          tone: positive
        - date: 2026-04
          label: 4 月宕机
          detail: CMS 集群故障影响托管网站、表单、API 和设计器。
          tone: warning
        - date: 2026-05
          label: 重组
          detail: 管理层称，AI 和轻量级建站器正在改变市场低端。
          tone: warning
    approximationNotes: 时间线刻意强调公开标注日期的里程碑，不推断未披露的内部董事会动作或非官方融资事件。
