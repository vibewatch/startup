              NRR、GRR、流失率、合同期限或头部客户集中度，因此只能从行为推断耐久性。最佳代理指标是首次采用后的重复扩张：更多地域版本、更多站点整合、更高实验量，或从微型站点转向核心网站资产。企业支持出现得也足够频繁，值得重视。Dropbox
