  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 平台
      - 可见入门价 / 合约模式
      - 公开信息清楚之处
      - 仍不透明之处
      - 含义
    rows:
      - - Webflow
        - 免费、$15 Basic、$25 Premium、$2,500 Team 年付、Enterprise 定制
        - 清晰的自助站点阶梯，外加可见的 Team 过渡层
        - Workspace 席位和附加项 TCO 仍需进一步深挖
        - PLG 入口不错，且上探市场变现路径清楚
      - - Framer
        - 免费、$10 Basic、$30 Pro、Enterprise 定制
        - 简单的站点阶梯，加付费编辑角色和附加项
        - 企业级兑现和完整扩张经济性仍属私有信息
        - 对 Webflow 最直接的低端价格挑战
      - - Wix / Wix Studio
        - 从免费到高端自助；企业版需联系销售
        - 大漏斗和企业交接都可见
        - 精确美元定价会随地区和页面渲染变化
        - 强分发，加上可信的企业动作
      - - Squarespace
        - 免费试用，加高端付费计划
        - 试用驱动获客和高端服务定位清晰可见
        - 复杂企业包装的直接证据较少
        - 适合高端 SMB 和创作者用例
      - - Shopify
        - $29 年付核心计划，到 Plus 定制
        - 计划阶梯清楚，并以交易经济性为导向
        - 企业级兑现和混合商户变现会有差异
        - 当网站本质是电商层时，是有用参照
      - - Contentful
        - 免费起步，加企业定制平台
        - Headless 平台、Studio、个性化和合规权益可见
        - 严肃部署的定价由报价驱动
        - 显示实施更重，但可组合性更强
      - - WordPress VIP
        - 年度合约，按月独立访客数定档
        - SLA、年度合约和无设置费都写得明确
        - 实际套餐价格仍由报价驱动
        - 开放式企业替代方案，但不利于 PLG
      - - Ghost
        - $18 / $29 / $199 / 定制
        - 会员和出版定价异常清楚
        - 更广义的企业网页运营功能不是产品重点
        - 当内容变现是核心时，是不错的小众替代品
    notes: 覆盖并不完整，因为每个竞争对手公开一致的定价程度并不相同，Bubble/Cargo 的证据也不够深入，不能在没有猜测的情况下纳入。
