            body: >-
              有纪律的估值观点从门槛数学开始，而不是从故事开始。如果买家希望 $4B 估值在 15x 收入倍数下显得合理，Webflow 需要约 $267M 年收入。按 10x，需要约 $400M；按 7x，需要约
              $571M。对一个强软件平台来说，这些门槛并不荒唐，但当前公开证据没有显示 Webflow 是否接近这些水平。最新的保留直接收入里程碑仍是 2022 年接近 $100M ARR
              的披露。这个缺口正是建议不能比证据允许的更激进的原因。


              牛市情景仍然自洽：Webflow 可能已经大幅超过上一次公开锚点，同时扩大企业客户占比、守住强支持经济性，并用 AI 功能提升客户价值，而不只是提高价格。基准情景更窄：Webflow
              是一家高质量公司，但当前公开证据不足以支持在缺少更多披露时按旧有私募市场峰值付价。熊市情景不对称，因为如果增长放缓，或公开软件倍数再次压缩，下行出现的速度会快于上行。这种不对称解释了本章为何落在继续研究、中等信心、高风险和估值偏紧的立场上。问题不在于
              Webflow 是否重要，而在于公开记录是否足够好，可以让投资者像困难证明点已经解决一样付价。
