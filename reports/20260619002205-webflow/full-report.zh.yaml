      - number: '4.4'
        title: 成本结构、资本充足性与私有指标缺口
        blocks:
          - type: paragraph
            body: >
              公开材料让 Webflow 的收入机制可读，但没有补全其经济模型。公司销售托管站点、本地化、优化、AI
              辅助工作流，以及治理较重的企业支持，因此服务交付不能被当作零边际成本软件。托管、带宽、可观测性、客户成功、实验工具和 AI credit 消耗都意味着真实服务成本。因此，平台更接近高毛利托管
              SaaS，而不是商业抽佣模型；但缺少毛利率披露，使这一判断仍是方向性的，而非已证明。


              资本充足性同样只在轮廓上可见。公司披露累计融资和较旧估值标记，首位 CFO
              招聘与收购活动也暗示运营成熟度。但公开材料仍没有给出当前现金、烧钱、runway、债务或契约细节。因此，当前最佳结论不是「资本受限」或「已完全去风险」，而是 Webflow
              有足够公开规模和产品宽度值得尽调，但资产负债表透明度还不足以在没有管理层材料的情况下完成严肃承销备忘录。
