      - number: '1.2'
        title: 创始人、领导层厚度与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人故事仍是 Webflow 最强的公司级证据之一。公开来源持续把 Vlad Magdalin、Sergie Magdalin 和 Bryant Chou 确认为创始三人组；TechCrunch 记录了
              2013 年发布，后续融资报道也把创立时间锚定在 2012 年。这种连续性重要，因为 Webflow
              从可视化响应式设计走向企业网页运营的长期产品弧线，仍更像是创始人意图驱动，而不是财务赞助方滚动并购或连续收购策略的结果。


              但到 2026 年，公司运营层面已经更管理化，而非完全以创始人为中心。about 页面现在列出 Linda Tong 为首席执行官，Vlad Magdalin 为首席创新官，并列出 Craig
              Mestel、Rachel Wolan、Allan Leinwand、Adrian Rosenkranz、Dave Steer、George Karamanos 和 Katie Chisam
              等更宽的管理梯队。独立报道和公司自发领导层文章也显示，2023–2024 年公司补上了更成熟的高管层，尤其在技术、产品和财务上。这对企业级执行和 IPO-ready 叙事是方向性利好。


              治理上的保留在于，公开记录仍比高管名单薄。检索到的 Webflow
              页面没有发布清晰董事会名单或独立董事图谱，合作伙伴页面也只能部分说明谁拥有正式董事会影响力。尽调上，这留下一个有意义的治理缺口：管理层厚度已经可见，但外部监督和重组后控制权动态还不够透明，不能视为已定局。
