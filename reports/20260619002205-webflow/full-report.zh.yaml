        - 管理层无法证明当前收入或 ARR 基数显著高于 2022 年公开锚点。
        - 打破 Webflow 已经长进旧有溢价估值这一核心论点。
        - 从继续研究转向回避，除非价格或条款大幅重置。
      - - 企业质量弱于暗示
        - 大客户留存、ACV 或续约质量无法支撑企业故事。
        - 削弱支付高于成熟 Web 平台可比区间价格的理由。
        - 重新定价，靠近公开建站器和内容平台参照。
      - - 公开软件倍数再次压缩
        - 可比软件区间从保留的 2026 年 6 月范围继续下移。
        - 即便 Webflow 运营执行到位，也会削低溢价私人估值上限。
        - 降低可接受入场价格，并扩大下行情景区间。
      - - 未来轮次重置私人估值
        - 新融资或有意义的二级交易在披露没有改善的情况下，以低于或仅接近当前锚点的价格出清。
        - 表明私人市场也怀疑旧 Series C 溢价。
        - 用新条款重建估值案例，而不是沿用 2022 年徽章。
      - - 可迁移性 / 治理异议变得持久
        - 买家在竞争交易中反复提到控制、导出或定价担忧。
        - 把产品强项故事变成平台折价故事。
        - 在流失和赢输数据改善前，把溢价倍数假设视为已经破裂。
    notes: 每个触发项都写成投资委员会可从尽调材料或后续公司报告中监控的形式，而不是依赖叙事情绪。
    claimRefs:
      - CV050
      - CV051
      - CV052
      - CV053
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 当前收入 / ARR
        - 自 2022 年公开披露以来的当前经审计收入运行率或 ARR 桥。
        - 没有它，投资者无法判断历史 $4B 估值是否已经被增长消化。
        - 要求当前管理层财务数据，以及从上一个公开锚点出发的收入桥。
      - - 留存质量
        - 按细分市场或套餐划分的 NRR、GRR、logo 流失和 cohort 留存。
        - 没有收入高效复利的证明，溢价软件倍数很难站住。
        - 要求按客户层级、ACV 区间和获客年份划分的 cohort 表。
      - - 经济性质量
        - 毛利率、托管成本负担、支持成本结构和现金转化。
        - 区分溢价软件资产与底层单位经济性较弱的优秀产品。
        - 要求当前财务模型输出，以及托管 / 支持成本明细。
      - - ARR 结构和 ACV
        - 自助服务、Premium、Team 和 Enterprise 的收入拆分，以及具名大客户 ACV。
        - 显示公司是否真的在成熟为更高质量的企业收入。
        - 要求套餐层级收入结构、头部客户包，以及扩张 / 收缩桥。
      - - 股权结构和交易条款
        - 优先权、二级占比、治理权，以及 2022 年以来任何新融资或二级出清。
        - 标题估值可能夸大新资金实际买到的东西。
        - 要求融资文件或律师摘要，并补充近期二级市场证据。
    notes: 每个问题都直接对应一个估值不确定性，而不是泛泛好奇；即便只厘清其中两三个，也可能实质改变建议。
    claimRefs:
      - CV013
      - CV036
      - CV047
      - CV054
      - CV055
      - CV056
      - CV057
      - CV058
