      - number: '2.5'
        title: 约束、竞品趋同与 Webflow 特定适配
        blocks:
          - type: paragraph
            body: >-
              最重要的市场风险是趋同。Framer、Wix Studio 和 Webflow 的官方页面现在都突出 AI、团队工作流，以及越来越偏企业的表述。CMSWire 和 Veza Digital 显示 Webflow
              在增加下一代 CMS、AEO、代码组件和协作功能，但这些动作也确认竞争前沿正在快速移动。换句话说，品类在变得更有价值的同时，也变得更拥挤。


              Axis Intelligence 是当前来源集中最明确的警示，因为它认为不存在通用 AI 建站工具，买家需要按输出所有权、部署模式、集成需求和锁定风险选择，而不是按夸大的自动化宣称选择。这个警示对
              Webflow 重要，因为它的甜蜜点是高端专业网页体验，不是所有建站、不是应用逻辑，也不是深度商业运营。Bubble、Shopify、Contentful 和 WordPress
              都定义了真实相邻细分市场；在这些市场里，Webflow 可以出现在候选名单中，但并不拥有核心用例。


              净评估因此是正面但有边界。Webflow 所在市场确有真实增长，也有理性的高端细分；但投资者应抵制这样一种论点：假设公司天然可以吃下完整无代码、AI
              建站或数字体验宇宙。市场足够大，值得关注；但制胜论点仍取决于适配，而不只是范围。
