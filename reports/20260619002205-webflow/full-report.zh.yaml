      - number: '7.2'
        title: 合同、隐私与监管责任分配风险
        blocks:
          - type: paragraph
            body: >-
              Webflow 的法律和隐私表面足够实质，能证明公司有真实的合规项目；但同一组来源也清楚显示，很大一部分运营负担落在客户身上。条款要求客户遵守适用的隐私和出口法律，配置自己的 Web
              安全控制，提供通知，收集同意，并回应终端用户权利请求。隐私政策和 DPA 则展示交易的另一半：Webflow 使用第三方处理方和分析工具，跨境转移数据，依赖 DPF 和 SCC
              转移工具，并提供有意义但有条件的删除、审计和分处理方机制。


              这很重要，因为企业尽调不会只因一页 trust page 就满足。DPA 给客户 15 天窗口反对新的分处理方，但如果 Webflow
              无法避开该供应商，实际救济就是终止合同。审计权也带有通知、成本和频率限制。同时，加州和欧盟监管来源提醒投资者，控制者义务、删除权、选择退出和转移治理仍是真实法律风险。因此，正确的风险结论不是 Webflow
              缺少法律基础设施，而是受监管买家在把合规视为已解决前，仍需详细尽调文档深度、可审计性、数据驻留和运营责任归属。
