      - number: '3.4'
        title: 分发、打包与切换成本压力
        blocks:
          - type: paragraph
            body: >
              打包方式讲出了竞争故事的重要部分。Webflow 仍足够透明，可以吸引 product-led 评估，但当前结构也清楚显示公司正在上探市场。站点层级从免费、$15 Basic、$25 Premium
              起步，随后跳到 $2,500 Team 计划和自定义 Enterprise。Framer 在低端压低 Webflow 价格，并呈现更简单的价格叙事。Wix 和 Squarespace
              保持更宽自助漏斗。Contentful 和 WordPress VIP 更早把买家带入报价式采购。这种分化重要，因为买家常把价格结构当作实施负担和组织适配的代理变量。


              分发和生态深度是另外两个压力点。Webflow 自己的页面和客户故事能有力证明 ROI 和营销人员自主性，但更大的现有玩家仍带来更高熟悉度、更宽伙伴网络，或更开放的技术姿态。独立评测也持续把 Webflow
              描述为强大但更难学，这会缩小愿意快速采用的团队池。商业含义是，Webflow 的赢率很可能取决于细分纪律：它应避免被拉进那些买家主要重视最低摩擦入口、最深商业能力或最大架构开放性的比较。
