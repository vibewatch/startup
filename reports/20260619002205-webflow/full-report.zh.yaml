  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 使用指标
      - 倍数 / 估值
      - 与 Webflow 的相关性
      - 主要限制
    rows:
      - - Wix
        - 2026 年 6 月 18 日市值与 FY2025 收入
        - $1.78B 市值 / $1.99B 收入 = ~0.9x
        - 直接的公开网站建站器参照，且有当前财务披露。
        - 回购活动和成熟公司画像，使其成为成长阶段溢价软件的保守参照。
      - - Shopify
        - 2026 年 6 月市值与过去十二个月收入
        - $141.24B 市值 / $12.37B 收入 = ~11.4x
        - 显示一个具备耐久软件经济性的规模化平台能在公开市场获得怎样的定价。
        - 它是商业操作系统，不是直接的网站平台同业。
      - - Squarespace
        - 2024 年私有化价值与 2023 年收入
        - $6.9B EV 对 $1.012B 收入 = ~6.8x；完成价约 $7.2B = ~7.1x
        - 面向设计的网站平台的近期控制权交易。
        - 历史私人控制权交易，不是 2026 年实时公开倍数。
      - - Webflow 2022 Series C
        - Webflow 最新公开估值与最新披露 ARR
        - $4B 估值，ARR 接近 $100M = ~40x ARR
        - 最直接的标的公司锚点，显示投资者过去支付过什么价格。
        - 私人市场高峰期的历史轮次，不是当前公允价值证明。
      - - Contentful
        - 2021 年 Series F 标题估值
        - '>$3B 估值，融资 $175M'
        - 可作为上探企业市场内容平台的软件偏好参照。
        - 保留的公开来源没有披露可用于倍数计算的干净收入基数。
      - - Figma / Adobe 交易
        - 2022 年宣布交易与退出 ARR
        - $20B 价值，对 >$400M ARR = ~50x ARR
        - 显示投资者会为具备卓越留存和利润率的顶级设计软件支付的上限极端值。
        - 战略设计平台参照，披露经济性远强于 Webflow 的公开记录。
    notes: 这份列举覆盖本章保留的六类比较对象：两个实时公开可比公司、一笔近期控制权交易、标的公司最后一轮公开融资、一个私人内容平台参照，以及一个战略设计软件参照。
