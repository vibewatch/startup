  - id: TP001
    title: 竞争对手画像表
    columns:
      - 平台
      - 类别
      - 规模 / 牵引信号
      - 目标细分市场
      - 差异化
      - 限制
    rows:
      - - Webflow
        - 焦点平台 / 受管控的网页体验层
        - 300,000+ 个品牌；3.5M 用户；900+ 名团队成员
        - 中端市场到企业级的营销、设计和网页团队
        - 集成构建、CMS、本地化、优化、AEO 和托管治理
        - 托管模式和更复杂的工作流，收窄了最容易切入的 SMB 用例
      - - Framer
        - 直接的设计驱动型同业
        - 私营、风投支持的竞争对手，自助入门价格更低
        - 设计驱动的营销团队和初创公司
        - 快速视觉工作流、较低入门价格、强设计中心 UX
        - 相比 Webflow 或 Wix，上探市场的广泛分发证据公开较少
      - - Wix Studio
        - 直接的既有同业
        - 背靠更大的 Wix 基盘和企业基础设施主张
        - 代理机构、开发者、营销人员和企业团队
        - 把专业网页工具、强分发和多站点管理合在一起
        - 更宽的品牌可能模糊 DIY 与专业市场定位
      - - Squarespace
        - 高端 SMB 既有玩家
        - 广为人知的设计驱动型建站工具，以试用带动包装
        - 创作者、服务型企业、SMB 品牌
        - 易用性、精致模板、高端一体化品牌表面
        - 相比 Webflow 上探市场，治理和优化深度不够明确
      - - Shopify
        - 电商替代品
        - 大型电商平台，兼具订阅和支付经济性
        - 商户、全渠道品牌、B2B/B2C 运营者
        - 结账、支付、POS、Markets 和电商运营
        - 如果网站任务主要是品牌发布，Shopify 就显得过重
      - - Contentful
        - 可组合 / Headless 替代品
        - 企业 DXP 式供应商，带 Studio 和个性化层
        - 重视 API、治理和可组合性的大型团队
        - 开放架构、治理、SSO、多区域交付、AI actions
        - 相比一体化视觉建站工具，需要更多技术所有权
      - - WordPress VIP
        - 开放式企业内容平台
        - 按流量扩容的年度合约产品，SLA 姿态强
        - 出版方和企业内容组织
        - 开放生态、插件、API、年度支持模式、强可迁移性叙事
        - 报价驱动的销售动作和定制开发需求，会抬高实施成本
      - - Ghost
        - 聚焦出版方的小众替代品
        - 托管出版平台，具备会员和 newsletter 经济性
        - 作者、出版方、媒体团队、会员驱动型运营者
        - 会员、newsletter、出版原生栈、自定义层级 99.9% SLA
        - 工作流比广义企业营销平台更窄
    notes: 覆盖并不完整，因为本轮中 Bubble 和 Cargo 的抓取结果过薄或受阻；表格聚焦证据最强的直接竞争对手和替代品。
