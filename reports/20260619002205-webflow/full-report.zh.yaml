          label: 突然的 AI 驱动重组
          detail: 裁员和运营模式调整削弱信任。
        - id: n2
          label: 客户 / 合作伙伴担忧
          detail: 代理商和买家质疑连续性与治理。
        - id: n3
          label: 定价和积分摩擦
          detail: 带宽重置和 AI 积分改变账户经济性。
        - id: n4
          label: 采购 / 续约阻力
          detail: 合规、可迁移性或 TCO 异议浮现。
        - id: n5
          label: 企业客户转化放缓
          detail: 高价值客户决策更慢，或转向替代方案。
        - id: n6
          label: 支持与实施负荷
          detail: 需要更多解释和例外处理。
        - id: n7
          label: 净扩张信心下降
          detail: 定价权和账户耐久性显得更弱。
        - id: n8
          label: 估值支撑走弱
          detail: 如果信任或经济性滑坡，溢价叙事会失去可信度。
      edges:
        - from: n1
          to: n2
          label: 信任冲击
        - from: n2
          to: n4
          label: 采购谨慎
        - from: n3
          to: n4
          label: TCO 异议
        - from: n4
          to: n5
          label: 成交放慢
        - from: n4
          to: n6
          label: 例外处理
        - from: n6
          to: n7
          label: 服务成本上升
        - from: n5
          to: n7
          label: 组合走弱
        - from: n7
          to: n8
          label: 溢价倍数压缩
        - from: n2
          to: n7
          label: 合作伙伴信任影响续约
    claimRefs:
      - CR023
      - CR024
      - CR025
      - CR026
      - CR035
      - CR036
      - CR039
      - CR042
      - CR043
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Webflow 依赖分层堆栈：基础设施、处理商、AI、分析和生态伙伴都会影响客户体验。
    data:
      nodes:
        - id: d1
          label: AWS
          detail: 主要托管与扩展层。
        - id: d2
          label: Cloudflare
          detail: CDN、边缘交付和 DDoS 防护。
        - id: d3
          label: 支付 / 商务供应商
          detail: Stripe 和相关商业工作流。
        - id: d4
          label: 数据 / 可观测性供应商
          detail: Datadog、Snowflake、Google、Twilio Segment 等数据 / AI 生态伙伴。
        - id: d5
          label: OpenAI + 内部 AI 堆栈
          detail: 支撑 AI 原生产品扩张。
        - id: d6
          label: 应用、API 和合作伙伴
          detail: Marketplace、OAuth、SDK 和认证合作伙伴。
        - id: d7
          label: Webflow 控制平面
          detail: 打包托管、CMS、工作流、支持和定价。
        - id: d8
          label: 客户
          detail: 体验整个堆栈的合成效果。
      edges:
        - from: d1
          to: d7
          label: 托管
        - from: d2
          to: d7
          label: 交付
        - from: d3
          to: d7
          label: 支付
        - from: d4
          to: d7
          label: 数据与分析
        - from: d5
          to: d7
          label: AI 功能
        - from: d6
          to: d7
          label: 生态可扩展性
        - from: d7
          to: d8
          label: 网站交付与治理
        - from: d2
          to: d8
          label: 边缘性能
        - from: d6
          to: d8
          label: 实施质量
    claimRefs:
      - CR014
      - CR015
      - CR030
      - CR031
      - CR032
      - CR033
      - CR046
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 建议来自一条简单链条：强历史验证和当前平台质量，被陈旧财务披露和仍然苛刻的门槛测算抵消。
    data:
      nodes:
        - id: a
          label: 历史融资验证
          detail: Webflow 确实在 ARR 接近 $100M 时融过一轮真实的 $4B 估值融资。
        - id: b
          label: 当前平台质量
          detail: 企业支持、治理和 300k 品牌规模支撑溢价叙事。
        - id: c
          label: 陈旧指标基准
          detail: 当前 ARR、利润率、留存和股权条款大多仍未公开。
        - id: d
          label: 门槛测算仍苛刻
          detail: 在今天正常化的可比公司倍数区间下，$4B 标记需要高得多的收入。
        - id: e
          label: 下行不对称
          detail: 如果旧估值标记还没有靠增长消化，压缩可能比证据到来更快。
        - id: f
          label: 建议
          detail: 继续研究：公司质量高，但仅凭公开证据看估值仍偏紧。
      edges:
        - from: a
          to: b
          label: 支撑溢价叙事
        - from: b
          to: c
          label: 但不能替代
        - from: c
          to: d
          label: 这会放大
        - from: d
          to: e
          label: 并造成
        - from: e
          to: f
          label: 因此
    claimRefs:
      - CV037
      - CV041
      - CV046
      - CV047
      - CV048
      - CV049
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 在正常化的 2026 年倍数区间下，Webflow 需要比上一个公开里程碑高得多的收入，才能让 $4B 标记显得常规而不是例外。
    data:
      items:
        - label: 7x 下所需收入
          value: 571
          unit: $M
        - label: 10x 下所需收入
          value: 400
          unit: $M
        - label: 12x 下所需收入
          value: 333
          unit: $M
        - label: 15x 下所需收入
          value: 267
          unit: $M
        - label: 20x 下所需收入
          value: 200
          unit: $M
        - label: 2022 年公开 ARR 锚点
          value: 100
          unit: $M
    approximationNotes: 条形表示在各倍数下支撑 $4B 股权价值所需的年收入；这是门槛测算，不是管理层预测。
    claimRefs:
      - CV036
      - CV039
      - CV040
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 情景区间显示，按当前公开证据，旧 $4B 标记比起基础情景中枢，更接近牛市情景。
    data:
      items:
        - label: 熊市情景
          low: 1.1
          value: 1.6
          high: 2
          unit: $B
          claimRef: CV045
        - label: 基础情景
          low: 2
          value: 2.6
          high: 3.2
          unit: $B
          claimRef: CV044
        - label: 牛市情景
          low: 3.5
          value: 4.1
          high: 4.8
          unit: $B
          claimRef: CV043
    approximationNotes: 区间是根据保留的可比公司参照和所需收入门槛推导出的承销区间，不是完整管理层模型。
    claimRefs:
      - CV043
      - CV044
      - CV045
      - CV048
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: Webflow 在产品雄心和历史验证上得分较高，但当前披露不足，难以支撑价格承销。
    data:
      items:
        - label: 历史融资验证
          value: 8/10
          detail: 2022 年融资、估值和接近 $100M ARR 的里程碑都有充分来源支撑。
          tone: positive
        - label: 当前平台质量
          value: 8/10
          detail: 企业支持、治理主张、AI 广度和 300k 品牌规模是可信的加分项。
          tone: positive
        - label: 当前指标新鲜度
          value: 3/10
          detail: 保留来源没有披露当前 ARR 或经审计的当前收入。
          tone: warning
        - label: 留存可见度
          value: 2/10
          detail: 未保留公开 NRR、GRR 或按 cohort 划分的流失数据。
          tone: warning
        - label: 经济性可见度
          value: 3/10
          detail: 毛利率、托管成本负担和现金转化质量仍未公开。
          tone: warning
        - label: 可比公司支撑
          value: 4/10
          detail: 溢价有可能成立，但旧 40x 锚点相较当前公开可比公司仍显例外。
          tone: warning
        - label: 下行不对称
          value: 4/10
          detail: 如果 $4B 标记还没有靠增长消化，压缩可能比证据改善更快。
          tone: warning
    approximationNotes: 分数是面向 IC 的判断指标，由保留证据综合得出；不是统计模型输出。
    claimRefs:
      - CV041
      - CV042
      - CV047
      - CV048
      - CV049
