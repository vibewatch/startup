      - number: '1.4'
        title: 平台扩张、企业级深度与产品变宽
        blocks:
          - type: paragraph
            body: >-
              公司的产品里程碑现在清楚指向企业营销栈，而不是独立建站工具。2024 年收购 Intellimize，让 Webflow 开始围绕网站体验平台讲个性化和优化；2026 年收购
              Vidoso，把这一逻辑延伸到具备品牌感知能力的 AI 资产生成；下一代 CMS 发布和 AEO 上线，则把基础设施、内容结构和 AI 可见性绑进同一个平台叙事。主线很清楚：Webflow
              想拥有的不只是发布，还包括优化和可发现性。


              企业级证据不只是口号。企业版页面宣称 332% ROI 研究，并突出权限、治理、本地化、实验和分析；安全页面详细列出 SOC 2、ISO
              27001/27017/27018、PCI-DSS、RBAC、SSO/SCIM、审计日志和预发控制。客户验证也不止 logo：Dropbox Sign 表示，切到 Webflow Enterprise
              后，发布周期从约一个月缩到一周，并减少了开发者瓶颈，这正是公司反复销售的工作流收益。


              合在一起，这些来源支撑了一个可信的上探市场故事。公司不是给静态编辑器贴 AI 标签，而是在 CMS 规模、治理、优化和企业协作周围扩宽平台。尽调问题不是 Webflow 是否在变宽，而是这个更宽的平台能否跑赢
              AI-native 建站对手，并在变化更快的品类里撑住溢价软件倍数。
