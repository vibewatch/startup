  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 核心假设
      - 估值逻辑
      - 隐含价值
      - 概率信号
    rows:
      - - 牛市
        - 当前收入已经显著高于 2022 年旧公开锚点，企业收入占比提升，支持和治理主张也有强留存和利润率背书。
        - 如果质量和增长都保持强劲，15x-18x 收入 / ARR 框架可以支撑溢价私人估值。
        - $3.5B-$4.8B
        - 需要管理层数据；公开来源尚未提供。
      - - 基准
        - Webflow 明显比成熟建站器更大也更好，但当前指标只是良好而非卓越，披露仍不完整。
        - 10x-13x 收入框架适合强平台，带有一定溢价，但还不足以给出异常确定性。
        - $2.0B-$3.2B
        - 最符合当前公开证据，也符合仍需更多证明的状态。
      - - 熊市
        - 增长放缓，或企业质量弱于产品故事所暗示，同时软件倍数仍然克制。
        - 6x-9x 收入框架会把 Webflow 推近公开 Web 和软件参照，而不是 2022 年私人市场极端值。
        - $1.1B-$2.0B
        - 如果下一轮融资或二级数据重置溢价叙事，这一情景会更可信。
    notes: 情景价值是承销区间，不是管理层预测；它们明确由收入门槛、可比区间，以及当前指标披露缺口驱动。
