        - 增长中；来源汇总多份研究观点
        - 托管建站工具市场，并参考相邻范围的第三方估算
        - 中
        - 发布方汇总多份报告，而不是发布一个经审计的市场模型
      - - HowToHosting 汇总区间低端估算
        - '2024'
        - 全球
        - $2.0B
        - ~7.0%（一项底层研究引用）
        - 更严格的托管建站工具定义
        - 低
        - 不能直接同更宽泛的 SaaS 电商或 AI 辅助工具相比
      - - HowToHosting 汇总区间高端估算
        - '2025'
        - 全球
        - $4.90B
        - 10.25%（一项底层研究引用）
        - 更宽的市场定义，纳入更多相邻工具
        - 低
        - 若直接作为 SAM，可能高估 Webflow 可触达支出
      - - Axis Intelligence AI 建站工具区间
        - '2026'
        - 全球
        - $3.57B-$6.3B
        - 20%-32%，取决于引用来源
        - AI 建站工具细分市场，汇总自机构研究公司
        - 中
        - 代表一个快速变化的子赛道，不是完整的专业网页市场
      - - Searchlab 无代码 / 低代码外沿边界
        - '2026'
        - 全球
        - $65B
        - 大增长外沿边界
        - 跨工作流和软件创建的广义无代码、低代码市场
        - 中
        - 远远过宽，不能直接作为 Webflow SAM
      - - Colorlib 建站工具份额视角
        - '2026'
        - 全球 / 网页装机基数
        - Webflow 占全部网站 0.9%；剔除 WordPress 与 Shopify 后，建站工具约占 10%
        - 份额视角，而非收入视角
        - 基于 W3Techs 式市场份额框架的装机基数份额
        - 低
        - 衡量网页存在感份额，不直接对应收入机会
    notes: 这些视角应被视为嵌套边界，而不是可互换的 TAM 数字；与 Webflow 相关的专业网页切片，落在狭义建站工具估算和更宽的无代码外沿边界之间。
