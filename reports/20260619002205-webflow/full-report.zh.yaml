  - id: TP004
    title: 护城河持久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 为什么可信
      - 尽调要问
    rows:
      - - 营销团队自主管理的一体化网页工作流
        - Framer 和 Wix Studio 正在向设计速度、信任与协作收敛
        - 高
        - 直接产品页和企业页显示，目标买家和功能措辞高度重叠
        - 按细分市场和交易规模，索取相对 Framer 与 Wix Studio 的赢单 / 输单数据
      - - 受治理的平台广度
        - Contentful 和 WordPress VIP 在开放性与可组合性叙事上更强
        - 高
        - 它们公开的定价和平台材料强调 API、自定义角色与企业可迁移性
        - 询问管理层，Webflow 在堆栈控制异议上输在哪里，以及原因
      - - 优化与 AI 层扩张
        - 新模块可能让品类竞争更快变宽，而不是更深地加固锁定
        - 中高
        - Webflow 现在把 AEO、Optimize、Localization、Cloud 与建站一起销售
        - 衡量这些模块的附加率和续约提升，而不只看功能发布
      - - 强案例研究 ROI 表层
        - 案例证明能帮销售，但不等于广泛市场份额
        - 中
        - Webflow 引用强结果，但独立评论仍把它描述为更专门、学习更难的工具
        - 询问 ROI 证明在对抗低摩擦既有方案时多常赢单
      - - 透明自助入口
        - 多层定价仍可能给较大团队制造采购摩擦
        - 中
        - 独立评论者和敌对竞品页面都指出定价复杂
        - 针对真实买家场景，建模完整站点、workspace 与附加项 TCO
      - - 托管速度与控制权的平衡
        - 工程团队想要更深系统控制时，维持内部自建仍会赢
        - 中
        - 企业级和可组合竞品明确拿碎片化或开发负担重的堆栈做反向销售
        - 量化 Webflow 在生产账户里实际拿掉了多少非核心工程工作
    notes: 这张表聚焦承销最关心的耐久性问题，而不是罗列每一个功能缺口。
