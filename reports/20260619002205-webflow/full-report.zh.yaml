            body: >-
              Webflow 的技术姿态越来越混合：面向营销人员可视化，面向开发者 API-first，面向相邻工作流 marketplace-led。开发者门户和 API
              文档展示的表面比许多建站工具公开暴露的更宽，包括站点管理、CMS、表单、自定义代码、分析、电商、评论、审计日志和 webhooks。公开 GitHub
              活动也强化了这一点：开发者层是活跃的，而不是休眠的，近期工作覆盖 JavaScript SDK、Python SDK、MCP server 和 OpenAPI
              specification。应用市场再加一层防御性：Webflow 可以把边缘功能外包给伙伴，同时守住主要编辑环境。这一架构相较开源 CMS 模型减少插件蔓延，但也让客户依赖 Webflow 自己的 API
              路线图、市场筛选和云基础设施，而不是宽泛自托管社区。
