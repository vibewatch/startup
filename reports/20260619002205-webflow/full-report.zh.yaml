      - number: '7.3'
        title: 可靠性、基础设施集中度与生态依赖
        blocks:
          - type: paragraph
            body: >-
              从运营看，Webflow 比许多传统网站构建器刻板印象更强。企业材料声称使用 AWS 托管、Cloudflare 分发、自动扩展、DDoS 防护、99.99% uptime SLA 和 24/7 支持；DPA
              提到 SOC 2 Type II 控制、渗透测试、依赖扫描和隐私培训。这些都是有意义的缓释因素，能让风险讨论保持扎实。但它们没有消除集中度或透明度风险。AWS 和 Cloudflare
              仍是关键依赖，公开信任表面仍部分卡在 trust-center 访问流程之后，公开事故报告更侧重发生和恢复，而不是高度受监管买家可能要求的深度事后复盘包。


              依赖栈也不止托管。Webflow 的分处理方登记册包括 OpenAI、Snowflake、Stripe、Google、Twilio Segment 和 Datadog；其开发者平台依赖 API、OAuth、SDK
              以及合作伙伴和社区构建的 marketplace apps。这种可扩展性有利于采用，但也意味着 Webflow
              的运营模式在分析、支付、AI、数据仓库和应用集成上继承了第三方与生态风险。环境平稳时，这套栈显得现代而灵活；压力环境下，供应商问题、政策变化或集成失败能触及客户信任或交付的节点会更多。
