      - number: '2.3'
        title: 买家、用户与付款方图谱
        blocks:
          - type: paragraph
            body: >-
              Webflow 周围的买家图谱比「做宣传册网站的小企业主」更宽，但也比完整无代码市场更窄。Webflow 自己的企业版和 CMS 页面直接面向需要治理、内容速度和优化能力的营销人员、开发者和网页团队。Framer
              面向专业网站团队，Wix Studio 面向机构和企业，Squarespace 仍偏设计驱动的网站，WordPress.com
              则为企业、专业人士、博客和商店销售代建式站点创建。这些差异重要，因为它们意味着不同买家、不同预算所有者和不同切换成本。


              在低端，创始人或业主经营者往往把买家、用户和付款方合并成一个人。在创业公司营销团队中，用户通常是设计师或营销人员，付款方则是创始人或职能负责人。在机构里，工作流买家通常是负责人或交付负责人，他们看重复用性和客户交接。在企业里，买家转向数字、网页、营销运营或受
              IT 治理的团队，他们重视权限、可审计性和集成，程度不低于建页速度。


              对 Webflow
              来说，最有价值的买家细分似乎是创业公司和中端市场营销团队、交付多个站点的机构，以及需要治理但不想背上重定制代码栈的企业网页团队。这意味着公司的商业甜蜜点不是所有网站需求，而是工作流深度足以支撑溢价平台的那部分需求。
