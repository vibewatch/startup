      - number: '4.3'
        title: 公开牵引力与商业信号
        blocks:
          - type: paragraph
            body: >
              Webflow 的公开牵引力证据有意义，但不均衡。官方页面披露 3.5 million 用户、超过 300,000 个品牌、25 个国家的 900 多名团队成员，以及多个量化企业成果。案例研究显示转化率提升
              40%、活跃用户增加 64%、10 天发布 32 个全球站点，以及 Orangetheory 每年节省 $6 million。这些信号有价值，因为它们显示产品被当作真实运营基础设施使用，而不只是设计师玩具。


              独立资本市场证据更旧，但仍相关。Forbes 报道称，Webflow 有望在 2022 年达到 $100 million ARR，拥有超过 200,000 名客户，并且企业收入在前一年从约 $1 million
              增至 $8 million。TechCrunch 后来在报道 Intellimize 收购时，再次确认 $4 billion 估值和超过 $330 million
              的融资额。承销限制在于，这些外部锚点都无法搭出当前 2026 年 ARR 桥。Webflow 的公开叙事在动能和品类扩张上很强，但在当前收入披露、收入质量和 cohort 持久性上很弱。
