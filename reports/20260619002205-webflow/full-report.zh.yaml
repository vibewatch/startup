      - number: '8.4'
        title: 价格可承保前还必须证明什么
        blocks:
          - type: paragraph
            body: >-
              核心估值缺口不是缺少客户品牌或融资标题，而是缺少能告诉投资者旧标题是否仍可信的运营指标。公开来源没有披露当前 NRR、GRR、按 cohort 的流失、毛利率、托管成本强度、Premium versus Team
              versus Enterprise 的 ARR 结构，或优先权、二级出售、治理权等条款细节。即使 PM Insights 是少数可见追踪 Webflow
              私募市场的来源之一，它也只暴露一个带门槛的预览，而不是完整公开的 cap table 和二级市场数据。这正是知名公司仍可能很难承保的典型情形。


              实际含义很简单。更好的建议不要求 Webflow 变成另一家公司；它要求管理层披露足够当前证据，证明公司已在今天的估值制度下消化 2022
              年估值。如果更新收入、留存和利润率数据强劲，立场可以很快从偏紧转向合理。反之，如果下一轮融资、私募二级定价或客户质量数据令人失望，2022 年溢价就会从荣誉徽章变成压缩参照点。尽调路径因此穿过数据，而不是辩论。
