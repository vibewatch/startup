chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与当前平台边界
        blocks:
          - type: paragraph
            body: >-
              Webflow 已经不适合再被简单称为无代码建站工具。它的首页现在把产品称为「面向现代企业的 agentic web platform」，about
              页面则保留了早期使命表述：把开发超能力带给每个人，让数字体验活起来。从首页、CMS 页面、AI 页面到 AI 治理页面，公司今天的自我定义很一致：Webflow
              想拥有这样一套系统，让营销团队搭建、管理、优化并越来越多地自动化数字体验，而不必把每次变更都交回工程团队。


              这一定位重要，因为它同时讲清楚 Webflow 卖什么，以及它希望投资者如何理解其品类。CMS 页面把 Webflow 描述成服务营销人员和开发者的内容引擎；AI
              页面把文案生成、设计修改、代码生成和优化叠进工作流；AI 治理页面再加上工作区级控制和隐私表述，让 AI 故事看起来能进企业。也就是说，公司卖的是托管式网页体验运营层，而不只是可视化编辑器。


              公开的合作伙伴与发布报道仍能支撑这一论点背后的早期创立叙事。TechCrunch 2013 年发布报道显示，Webflow
              起步于面向机构和设计师的响应式网页设计工具；公司后来的融资文章则描述了它从设计工具走向更宽网站和应用愿景的过程。对后续章节最关键的结论是：Webflow
              的身份已经从可视化网页开发扩展为更宽的网页体验平台，并且公司正明确用 AI 和治理来证明自己属于价值更高的软件品类。
