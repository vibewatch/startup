  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开融资锚点真实存在，但已经陈旧
        blocks:
          - type: paragraph
            body: >-
              Webflow 的估值故事始于一个非常强的历史锚点。Forbes、TechCrunch 和 SiliconANGLE 对 2022 年 3 月 Series C 的叙述彼此吻合：Webflow 以 $4B
              估值融资 $120M，当时 ARR 接近 $100M。Forbes 还报道其客户超过 200,000 个，企业收入大幅增长；TechCrunch 则明确把这一轮描述为大约 40x ARR
              的事件。这不是模糊传言，而是一个多来源一致的融资事件，披露足以解释当时投资者为何愿意支付溢价。


              2026 年的问题不是缺少质量信号，而是新鲜度不足。Webflow 当前官方页面展示了更广的产品、300,000 个品牌、24/7 企业支持、99.99% uptime SLA，以及面向 AI
              和云的平台扩展。第三方追踪器仍集中在大约 $4B 的私有市场估值和 $335M-$336M 的累计融资额附近。但这些来源都没有提供新的经审计收入基数、更新
              ARR、留存画像、毛利率，或足以证明公司已经消化旧有高溢价倍数的 term-sheet 细节。因此，投资者必须把公司质量和估值支撑拆开看；前者可见，后者仍大多留在私域。
