- id: substitutes-and-open-stacks
  title: Substitutes, open stacks, and job-to-be-done drift
  body: |
    The strongest substitutes are not always visual builders. Shopify becomes the relevant comparison once the website is inseparable from checkout, payments, POS, and B2B commerce flows. Contentful becomes the relevant comparison once the buyer wants a headless or composable operating model with stricter governance, more explicit enterprise infrastructure, and deeper stack flexibility. WordPress VIP matters when the buyer values an open ecosystem, annual-contract support, plugin and API breadth, and traffic-scaled enterprise operations over Webflow’s integrated authoring experience.

    Ghost sits further out, but still matters because it solves a publisher-style workflow that Webflow does not own natively: memberships, newsletters, and editorial operations as the center of gravity. The common pattern is that Webflow wins when marketer speed, visual control, and governance need to coexist inside one hosted platform. It loses share of the conversation whenever the buyer’s core need becomes commerce depth, open-stack control, publisher monetization, or a broader engineering-controlled digital experience architecture.
