- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Platform
  - Visible entry / contract model
  - What is publicly clear
  - What stays opaque
  - Implication
  rows:
  - - Webflow
    - Free, $15 Basic, $25 Premium, $2,500 Team annual, Enterprise custom
    - Clear self-serve site ladder plus visible Team bridge
    - Workspace-seat and add-on TCO still requires more digging
    - Good PLG entry, but clear upmarket monetization path
  - - Framer
    - Free, $10 Basic, $30 Pro, Enterprise custom
    - Simple site ladder plus paid editor roles and add-ons
    - Enterprise realization and full expansion economics stay private
    - Most direct low-end price challenge to Webflow
  - - Wix / Wix Studio
    - Free to premium self-serve; enterprise via contact
    - Large funnel and enterprise handoff both visible
    - Exact USD pricing varies by locale and rendering
    - Strong distribution plus a credible enterprise motion
  - - Squarespace
    - Free trial plus premium paid plans
    - Trial-led acquisition and premium-service positioning are visible
    - Less direct evidence of complex enterprise packaging
    - Attractive for premium SMB and creator use cases
  - - Shopify
    - $29 yearly core plan through Plus custom
    - Clear plan ladder and transaction-economics orientation
    - Enterprise realization and blended merchant monetization vary
    - Useful comparison when the website is really a commerce layer
  - - Contentful
    - Free start plus enterprise-custom platform
    - Headless platform, Studio, personalization, and compliance entitlements are visible
    - Pricing for serious deployments is quote-led
    - Signals heavier implementation but stronger composability
  - - WordPress VIP
    - Annual contracts sized by monthly unique visitors
    - SLAs, annual contracts, and no setup fees are explicit
    - Actual package prices stay quote-led
    - Open enterprise alternative, but not PLG-friendly
  - - Ghost
    - $18 / $29 / $199 / custom
    - Membership and publishing pricing is unusually clear
    - Broader enterprise web-ops functionality is not the point of the product
    - Good niche substitute when content monetization is central
  notes: Coverage is partial because publicly consistent pricing for every competitor is not equally exposed, and Bubble/Cargo were not evidenced deeply enough to include without guesswork.
