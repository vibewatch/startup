coverageNotes: >-
  Public evidence is strong on Webflow's founding, leadership transition, product expansion, customer proof,
  and the March 2022 Series C at a $4 billion valuation. It is materially weaker on current ARR, revenue
  growth, retention, gross margin, post-restructuring headcount, board composition, and private-market terms,
  so this report treats the 2022 financing as the last hard valuation anchor rather than as proof of current
  underwriting fitness.
