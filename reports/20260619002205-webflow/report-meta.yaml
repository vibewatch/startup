companyProfile:
  summary: >-
    Webflow is a 2012-founded software company building a hosted website experience platform that spans visual
    development, CMS, hosting, localization, optimization, analytics, AI-assisted workflows, and enterprise
    governance. The company now positions itself as an agentic web platform for modern businesses, serves more
    than 300,000 organizations by its public materials, and remains best known financially for its March 2022
    Series C at a $4 billion valuation.
  foundedDate: '2012-01-01'
  founders:
    - name: Vlad Magdalin
      role: Co-founder; Chief Innovation Officer
      background: Co-founded Webflow and remains the most visible product visionary in the current executive slate.
      claimRefs: [CO005, CO008]
    - name: Sergie Magdalin
      role: Co-founder
      background: Part of the original founding trio that built Webflow's early responsive web-design product.
      claimRefs: [CO005]
    - name: Bryant Chou
      role: Co-founder
      background: Part of the original founding trio that helped take Webflow from design tooling into a broader web platform.
      claimRefs: [CO005]
  foundingLocation: Mountain View, California, United States
  headquarters: San Francisco, California, United States
  productSummary: >-
    Webflow sells a hosted visual web development platform that combines design tools, CMS, hosting,
    localization, analytics, optimization, SEO/AEO, AI features, APIs, and enterprise security/governance into
    one workflow for building and operating websites.
  customerFocus: >-
    Core buyers are marketing, design, and web teams at SMB and enterprise organizations that want faster site
    publishing and governance without a traditional engineering handoff.
  businessModel: >-
    Subscription SaaS monetization tied to site plans, workspace/editor collaboration, enterprise packages,
    and adjacent modules such as optimization, localization, and analytics rather than payments volume.
  stage: Private growth-stage company
  fundingStatus: >-
    Raised a $120 million Series C in March 2022 at a $4 billion valuation after earlier $72 million Series A
    and $140 million Series B rounds; no later priced round is clearly disclosed in the retained public source set.
  disclosureProfile: private-undisclosed
  claimRefs: [CO004, CO005, CO007, CO008, CO013, CO016, CO023, CO024, CO026, CE001, CE003, CU001]
summary:
  headline: >-
    Webflow remains a category leader in no-code web publishing and enterprise web operations, but the best-known
    $4 billion valuation anchor is old and the 2026 public record still leaves too many financial proof points
    private to justify an aggressive entry call.
