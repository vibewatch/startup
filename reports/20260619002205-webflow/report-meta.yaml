  topStrengths:
    - Broad, credible product stack spanning CMS, hosting, localization, optimization, AI, and enterprise governance.
    - Strong current customer proof and public scale signals, including 300,000+ organizations and major enterprise references.
    - Clear historical financing support from Accel, CapitalG, and YC Continuity culminating in a $4B Series C anchor.
  topRisks:
    - The latest hard valuation anchor is still March 2022, while current ARR, retention, and margin data remain undisclosed.
    - AI-native builders, Webflow peers, and open/developer-heavy alternatives can pressure pricing and differentiation.
    - Hosting/control dependence, outage history, and workflow lock-in may complicate enterprise procurement or renewal quality.
    - Post-restructuring governance, board visibility, and precise headcount remain less transparent than the product story.
  unresolvedGaps:
    - Current ARR, recognized revenue, and revenue mix across self-serve, Team, and Enterprise plans.
    - Net revenue retention, churn, gross margin, hosting-cost intensity, and cash-generation quality.
    - Exact post-May-2026 headcount, organizational mix, and current board or governance structure.
    - Any newer financing, secondary pricing, or term-sheet details that would refresh the 2022 valuation anchor.
appendices: null
disclaimer: >-
  This report is based on public sources reviewed on 2026-06-19. Webflow remains a private company and does
  not publicly disclose many of the operating, retention, margin, cap-table, and governance details required
  for full underwriting. Recommendation and valuation conclusions are therefore scenario-based and should be
  refreshed if management provides current revenue, retention, margin, or financing data.
