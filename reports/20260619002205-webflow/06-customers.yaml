- id: TU006
  title: Expansion and concentration risk table
  columns:
  - Risk / friction
  - Public signal
  - Why it matters
  - Evidence
  - Diligence path
  rows:
  - - Marketing-site concentration
    - Most marquee proof revolves around rebrands, content estates, or demand-gen sites
    - Could limit expansion if budgets shift away from branded web properties
    - Customer-story mix and public proof bias
    - 'Map ARR by use case: brand sites, docs, commerce, apps, localization, optimization'
  - - Services-enabled deployments
    - Many wins cite account teams and agency partners
    - Renewal may depend partly on service quality, not just software value
    - Dropbox Sign, Walker & Dunlop, NCR, Greenhouse, Verifone
    - Separate product-only retention from partner-assisted retention
  - - Centralized hosting dependency
    - June 2026 incidents plus public complaints about status communication
    - Outages can hurt customer trust quickly because customers cannot self-host around them
    - Status page and UltimateWB article
    - Request incident log, credit payouts, and root-cause trends
  - - Pricing / complexity friction
    - G2 reviewers cite expensive multi-project pricing and advanced-setup complexity
    - Could slow SMB adoption or create churn pockets among agencies
    - G2 review excerpts
    - Review churn by cohort, project count, and plan type
  - - Limited renewal transparency
    - No public NRR, GRR, churn, contract length, or top-customer exposure
    - Makes durability underwriting hard despite strong launch case studies
    - Absence across fetched public sources
    - Obtain retention cohorts, renewal waterfall, and customer concentration schedule
