evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-arr
    missingEvidence: A current management-level ARR, revenue, or gross-margin disclosure after the 2022 Series C benchmark.
    whyItMatters: >-
      A fresh economic output number is necessary to judge valuation durability and operating leverage in 2026 rather
      than anchoring on stale 2022 commentary.
    diligencePath: >-
      Request current annualized recurring revenue, recent growth rate, and margin bridge directly from management or
      investor materials.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: post-restructure-headcount
    missingEvidence: An exact post-May-2026 employee count with geography and function mix.
    whyItMatters: >-
      The about-page workforce marker may predate the restructuring, so current capacity and cost structure cannot be
      read cleanly from public materials.
    diligencePath: >-
      Obtain the current org chart, active employee count, and restructuring scope from management or HR diligence
      materials.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: board-governance
    missingEvidence: A public or private board roster showing independent directors, investor seats, and committee structure.
    whyItMatters: >-
      Executive depth is visible, but investors still need to understand who oversees strategy, risk, and management
      after the CEO transition and 2026 restructuring.
    diligencePath: Request board materials, governance docs, and cap-table-linked control rights during management diligence.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table
    missingEvidence: A fuller dated chronology for internal org changes, exact 2026 layoff scope, and related board approvals.
    whyItMatters: >-
      The milestone table is complete enough to ship, but several governance and restructuring details remain only
      partially visible in public evidence.
    diligencePath: >-
      Request management chronology materials covering the 2024 leadership transition, 2026 restructuring scope, and any
      related board actions.
    relatedQuestionRefs:
      - QO017
      - QO021
    relatedTableRefs:
      - TO004
  - type: enumeration-incomplete
    severity: material
    topic: premium-professional-web-sam
    missingEvidence: >-
      A public 2026 estimate that isolates the premium professional-web platform segment rather than the full no-code,
      AI-builder, or generic builder market.
    whyItMatters: >-
      Without a clean middle-layer SAM, later valuation work risks overstating Webflow’s addressable market by borrowing
      a much broader category number.
    diligencePath: >-
      Build a bottom-up SAM from target buyer cohorts, average web-platform spend, and deal-size assumptions, or obtain
      a private market study from management or investors.
    relatedQuestionRefs:
      - QM020
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: builder-vs-custom-adoption
    missingEvidence: >-
      An apples-to-apples 2026 study showing what share of new business sites are built on hosted builders versus custom
      development by buyer segment.
    whyItMatters: >-
      The relative conversion from broad website need to premium-builder spend determines how much of the outer market
      actually becomes monetizable for Webflow.
    diligencePath: >-
      Request funnel data from industry analysts or use platform-side cohort data on site launches, segment mix, and
      upgrade behavior.
    relatedQuestionRefs:
      - QM009
      - QM025
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: switching-costs-and-roi
    missingEvidence: Independent cohort data on migration cost, retention, and payback across enterprise web-platform decisions.
    whyItMatters: >-
      Official ROI claims and customer stories are useful, but investors still need independent evidence on how sticky
      premium-web platforms remain as features converge.
    diligencePath: >-
      Obtain customer retention cohorts, migration win/loss notes, and third-party ROI studies from Webflow or channel
      partners during commercial diligence.
