      rows with the same confidence as the main competitors.
    whyItMatters: >-
      Without equivalent fetchable evidence, the substitute map is strongest on design-led, commerce, composable, and
      publisher rivals, but weaker on app-builder and creative-portfolio niches.
    diligencePath: >-
      Run manual browser capture or alternate fetch profiles for Bubble and Cargo, then add a second-pass competitor row
