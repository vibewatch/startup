- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Governance and trust erosion
    - Another abrupt workforce or policy shock tied to AI or pricing
    - Repeated surprise restructurings, partner backlash, or customer complaints on trust grounds
    - Increase governance discount and require tighter customer/partner retention evidence before underwriting upside
  - - Compliance allocation risk
    - Enterprise buyers still cannot clear privacy or audit diligence quickly
    - Trust-center pack is slow, incomplete, or materially narrower than public marketing implies
    - Pause regulated-customer upside assumptions and escalate legal/compliance diligence
  - - Pricing and monetization friction
    - Bandwidth add-ons or AI-credit charges trigger noticeable customer dissatisfaction
    - Elevated support tickets, downgrade activity, or partner warnings after June 29 2026
    - Reduce pricing-power assumptions and widen churn sensitivity
  - - Platform-boundary risk
    - Large or complex accounts increasingly require hybrid or non-Webflow architectures
    - More losses on app logic, massive data scale, or portability objections
    - Treat TAM and enterprise-expansion assumptions more conservatively
  - - Reliability concentration
    - Status incidents become more frequent or enterprise SLA evidence weakens
    - Multiple material incidents, poor RCA quality, or no SLA-credit transparency
    - Raise operational-risk premium and haircut enterprise durability assumptions
  - - Dependency stack fragility
    - Key vendors or integrations become a repeated source of customer pain
    - Vendor failure, integration churn, or security issue among major subprocessors
    - Shorten acceptable exception list and demand deeper third-party risk reporting
  notes: These triggers are intended for diligence and post-investment monitoring rather than for one-time narrative judgment; each can be observed from customer behavior, support data, or management reporting.
