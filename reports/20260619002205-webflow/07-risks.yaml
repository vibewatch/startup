  evidenceGaps:
  - type: access-blocked
    severity: material
    topic: trust-center-depth
    missingEvidence: The underlying security reports, certification packets, and detailed trust-center documents referenced by Webflow's help center.
    whyItMatters: Public marketing and DPA language are directionally positive, but enterprise underwriting still depends on the artifact depth and scope hidden behind the trust-center request flow.
    diligencePath: Request the trust-center index, latest certification artifacts, penetration-test summary, and enterprise security FAQ used in real sales cycles.
    relatedQuestionRefs:
    - QR009
    - QR027
    relatedTableRefs:
    - TR001
    - TR002
  - type: conflicting-data
    severity: material
    topic: current-headcount-and-oversight
    missingEvidence: Exact post-layoff headcount, board composition, and operating-model ownership after the May 2026 restructuring.
    whyItMatters: Execution risk is hard to underwrite when public sources disagree on scale and do not show who governs the pivot or where decision rights sit.
    diligencePath: Request an updated org chart, board roster, committee structure, and management memo explaining the post-layoff operating model.
    relatedQuestionRefs:
    - QR024
    relatedTableRefs:
    - TR004
  - type: stale
    severity: material
    topic: ai-credit-economics
    missingEvidence: Observed customer usage, add-on attach rates, and billing outcomes after AI-credit enforcement starts on June 29, 2026.
    whyItMatters: The monetization effect of AI credits is still prospective, so current pricing risk has to be inferred from structure and commentary rather than from realized behavior.
    diligencePath: Request post-launch billing dashboards, support-ticket volumes, and churn or downgrade data attributable to AI-credit changes.
    relatedQuestionRefs:
    - QR021
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: enterprise-reliability-and-support
    missingEvidence: SLA credit history, support-response metrics, incident RCA standards, and large-customer renewal or concentration data.
    whyItMatters: The enterprise narrative is central to risk compression, but public sources do not prove whether the claimed support and uptime posture is delivering durable commercial outcomes.
    diligencePath: Request enterprise SLA documents, support KPI dashboards, major-incident reviews, and renewal data for top cohorts.
    relatedQuestionRefs:
    - QR011
    - QR028
    - QR030
    relatedTableRefs:
    - TR002
    - TR005
  - type: missing-source
    severity: minor
    topic: formal-governance-communications
    missingEvidence: A clean official public post from Webflow explaining the 2026 layoffs, AI operating-model shift, and customer-governance implications in one place.
    whyItMatters: Current understanding of the pivot depends heavily on external coverage and secondary quotations rather than on a fully retained official explanation.
    diligencePath: Retain the underlying official restructuring post and any customer or partner communications in the next refresh cycle.
    relatedQuestionRefs:
    - QR022
    - QR023
    relatedTableRefs:
    - TR004
