  rows:
  - - Launch a campaign or landing page
    - Marketers and designers build in visual canvas, then publish without waiting on full developer sprint
    - Designer + CMS + branching
    - TEI cites 94% faster time-to-market; customer stories cite week-to-day compression
    - High-complexity templates still need component governance and QA
  - - Manage dynamic content library
    - Create collections, template pages, and structured content with reusable layouts
    - Next-gen CMS + headless APIs
