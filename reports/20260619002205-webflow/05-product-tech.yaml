    severity: material
    topic: aeo-maturity
    missingEvidence: Independent customer outcomes proving Webflow AEO drives durable traffic or conversion lift outside vendor-selected anecdotes.
    whyItMatters: AEO is strategically important to Webflow’s 2026 positioning, but current public evidence shows private-beta status and limited third-party validation.
    diligencePath: Ask for named beta customers, observed AI-referral metrics, and experiment methodology before underwriting AEO as a differentiated monetizable module.
