  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing architecture
        blocks:
          - type: paragraph
            body: >
              Webflow’s public monetization surface is much richer than a simple brochure-site subscription, but it is
              still clearly subscription-led rather than transaction-led. The pricing page exposes a free Starter tier,
              a $15 Basic plan, a $25 Premium plan, a $2,500 Team plan that requires an annual contract, and a custom
              Enterprise tier. That structure is important because it shows Webflow monetizing the ongoing operation of
              the web stack: sites, CMS, governance, localization, optimization, and collaboration. The company is not
              relying on payment volume the way Shopify does, and it is not selling only developer tooling. It is
              selling recurring control over how a business builds, ships, and optimizes its website estate.


              The public evidence also shows why realized revenue can differ materially from headline plan prices. The
              pricing calculator explicitly excludes workspace plans, seats, and add-ons such as Optimize, Analyze, and
              Localization. Team and Enterprise then add yet another monetization layer by bundling governance,
              security, and AI-oriented features that do not exist on the base site ladder. So the topline architecture
              is clear enough to describe, but not clear enough to infer true blended ASP, realized discounting, or the
              mix between site subscriptions, seats, enterprise contracts, and product add-ons.
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI006
              - CI007
