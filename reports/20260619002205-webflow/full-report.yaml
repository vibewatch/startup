      - number: '3.4'
        title: Distribution, packaging, and switching-cost pressure
        blocks:
          - type: paragraph
            body: >
              Packaging tells an important part of the competitive story. Webflow remains transparent enough to invite
              product-led evaluation, but its current structure also makes clear that the company is moving upmarket.
              The site-level ladder starts at free, $15 Basic, and $25 Premium, then jumps to a $2,500 Team plan and
              custom Enterprise. Framer undercuts Webflow’s low end and presents a simpler price narrative. Wix and
              Squarespace maintain broader self-serve funnels. Contentful and WordPress VIP move buyers into quote-led
              procurement much earlier. That divergence matters because buyers often use pricing structure as a proxy
              for implementation burden and organizational fit.


              Distribution and ecosystem depth are the other pressure points. Webflow’s own pages and customer stories
              make a strong case for ROI and marketer autonomy, but larger incumbents still bring more familiarity,
              broader partner networks, or a more open technical posture. Independent reviewers also continue to
              describe Webflow as powerful but harder to learn, which narrows the addressable pool of teams willing to
              adopt it quickly. The commercial implication is that Webflow’s win rate likely depends on segment
              discipline: it should avoid being pulled into comparisons where the buyer primarily values lowest-friction
              entry, deepest commerce, or maximum architectural openness.
