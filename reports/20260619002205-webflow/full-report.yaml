      - number: '7.3'
        title: Reliability, infrastructure concentration, and ecosystem dependence
        blocks:
          - type: paragraph
            body: >-
              Operationally, Webflow looks stronger than many legacy website-builder stereotypes imply. Enterprise
              materials claim AWS hosting, Cloudflare delivery, automatic scaling, DDoS protection, 99.99% uptime SLAs,
              and 24/7 support, while the DPA cites SOC 2 Type II controls, penetration testing, dependency scanning,
              and privacy training. Those are meaningful mitigants and they should keep the risk discussion grounded.
              But they do not remove concentration or transparency risk. AWS and Cloudflare remain critical
              dependencies, the public trust surface is still partly gated behind the trust-center access flow, and
              public incident reporting focuses on occurrence and resolution rather than on the sort of deep postmortem
              package a highly regulated buyer may request.


              The dependency stack is broader than hosting alone. Webflow's subprocessor register includes OpenAI,
              Snowflake, Stripe, Google, Twilio Segment, and Datadog, while its developer platform depends on APIs,
              OAuth, SDKs, and marketplace apps built by partners and the community. That extensibility is a strength
              for adoption, but it also means Webflow's operating model inherits third-party and ecosystem risk across
              analytics, payments, AI, data warehousing, and app integrations. In a benign environment the stack looks
              modern and flexible; in a stressed environment it creates more points where a vendor issue, policy change,
              or integration failure can hit customer trust or delivery.
