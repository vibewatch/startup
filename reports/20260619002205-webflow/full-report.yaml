      - number: '4.4'
        title: Cost structure, capital adequacy, and private-metric gaps
        blocks:
          - type: paragraph
            body: >
              The public materials make Webflow’s revenue mechanism legible, but they do not make its economics
              complete. Because the company is selling hosted sites, localization, optimization, AI-assisted workflows,
              and governance-heavy enterprise support, service delivery cannot be treated as zero-marginal-cost
              software. Hosting, bandwidth, observability, customer success, experimentation tooling, and AI-credit
              consumption all imply real cost of service. The platform is therefore closer to a high-gross-margin hosted
              SaaS business than to a commerce take-rate model, but the absence of gross-margin disclosure means that
              statement remains directional rather than proven.


              Capital adequacy is similarly visible only in outline. The company discloses total funding and older
              valuation markers, and the first-CFO hire plus acquisition activity suggest operational maturity. But
              public materials still do not provide current cash, burn, runway, debt, or covenant detail. That means the
              best present conclusion is not “capital constrained” or “fully de-risked.” It is that Webflow has enough
              public scale and product breadth to justify diligence, but not enough balance-sheet transparency to close
              a serious underwriting memo without management materials.
