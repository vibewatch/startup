      - number: '4.5'
        title: Public comparables and underwriting verdict
        blocks:
          - type: paragraph
            body: >
              Shopify, Wix, and pre-privatization Squarespace are useful not because they are perfect comp matches, but
              because they show what public disclosure looks like for web-platform businesses at scale. Shopify’s 2026
              results provide revenue growth, free-cash-flow margin, GMV, MRR language, and a filing path to deeper
              detail. Wix pairs more than 200 million users with multibillion-dollar revenue and SEC reporting.
              Squarespace’s last public revenue base provides a more directly comparable website-platform benchmark,
              even if post-take-private updates ended. Webflow offers none of that depth. It gives users, funding,
              valuation history, and case-study outcomes, but not the current P&L, balance sheet, or durability metrics
              that matter most.


              That asymmetry shapes the verdict. Webflow’s public story supports a positive qualitative read: recurring
              hosted monetization, visible upmarket expansion, compelling enterprise outcomes, and a widening product
              surface around optimization and AI discovery. It does not support a high-confidence valuation underwrite
              on public evidence alone. The correct financial stance is therefore promising but under-disclosed. Before
              underwriting valuation confidence, an investor still needs realized pricing, cash, burn, gross margin,
              retention, and sales-efficiency data directly from management.
            claimRefs:
