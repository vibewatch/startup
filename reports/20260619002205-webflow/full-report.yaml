      - number: '1.3'
        title: Funding history, scale signals, and current footprint
        blocks:
          - type: paragraph
            body: >-
              Webflow’s capital history is unusually well documented by its own funding posts and by third-party
              coverage. The company disclosed a $72 million Series A in 2019, a $140 million Series B in 2021 at a
              valuation north of $2.1 billion, and a $120 million Series C in March 2022 led by YC Continuity that set
              the best-supported $4 billion valuation marker still used in later coverage. The official about page and
              the Forbes Series C report both line up on roughly $335 million of total capital raised, which is
              materially better corroborated than many private-software company fact patterns.


              Scale signals are also stronger than average for a private company, but they remain mixed in vintage. The
              current about page says Webflow has 900-plus team members in 25 countries and 3.5 million users, while the
              security page says more than 300,000 organizations use the platform. Older but still useful funding
              coverage adds historical checkpoints: Series B materials cited more than 2 million users and 100,000
              customers across 190 countries, and Forbes said the company had more than 200,000 customers and 400
              employees at the time of Series C. These are directionally consistent, but they are not equivalent metrics
              and should not be blended casually.


              The main unresolved metric problem is financial freshness. The public evidence set confirms funding,
              valuation, and customer breadth better than it confirms current ARR or post-restructure headcount. Forbes
              said Webflow was on track to hit $100 million ARR in 2022, but management has not provided a comparably
              hard 2026 revenue disclosure in the sources reviewed for this run. Investors should therefore treat the
              company as well capitalized and visibly scaled, but still opaque on current economic output.
