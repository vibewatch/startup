            body: >-
              Webflow’s technology posture is increasingly hybrid: visual for marketers, API-first for developers, and
              marketplace-led for adjacent workflows. The developer portal and API documentation show a much broader
              surface than many website builders expose publicly, including site management, CMS, forms, custom code,
