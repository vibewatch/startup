  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The public financing anchor is real, but it is stale
        blocks:
          - type: paragraph
            body: >-
              Webflow's valuation story begins with a very strong historical anchor. Forbes, TechCrunch, and
              SiliconANGLE all line up on the March 2022 Series C: Webflow raised $120 million at a $4 billion valuation
              while approaching $100 million of ARR. Forbes also reported more than 200,000 customers and a sharp
              increase in enterprise revenue, while TechCrunch explicitly framed the round as a roughly 40x ARR event.
              That is not a fuzzy rumor; it is a coherent, multi-source financing event with enough disclosure to
              understand why investors paid a premium at the time.


              The problem in 2026 is not absence of quality signals. It is freshness. Current Webflow official pages
              show a broader product, 300,000 brands, 24/7 enterprise support, 99.99% uptime SLAs, and AI- and
              cloud-oriented platform expansion. Third-party trackers still cluster around a roughly $4 billion private
              mark and $335-$336 million of lifetime funding. But none of those sources provide a new audited revenue
              base, updated ARR, retention profile, gross margins, or term-sheet detail sufficient to prove that the old
              premium multiple has now been grown into. Investors therefore have to separate company quality from
              valuation support; the former is visible, the latter is still mostly private.
            claimRefs:
