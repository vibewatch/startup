  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Typical enterprise customer journey into Webflow based on public case-study patterns.
    data:
      items:
        - label: Legacy CMS frustration
          detail: >-
            Teams hit slow ticket queues, rigid templates, or costly agency dependence in WordPress, custom CMS, Craft
