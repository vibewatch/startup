  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and the real comparison set
        blocks:
          - type: paragraph
            body: >
              Webflow does not really compete in one flat “website builder” bucket. Its current public pitch is an
              agentic web marketing platform that combines visual development, CMS, localization, optimization,
              analytics, and increasingly AI-native search and cloud capabilities. That framing pushes the closest
              direct rivalry toward products that also promise marketer autonomy without rebuilding the whole frontend
              stack. Framer and Wix Studio fit that description best. Framer competes with a design-first workflow and
              cheaper self-serve entry, while Wix Studio combines pro-grade design tooling with the installed-base and
              distribution advantages of the much larger Wix ecosystem.


              The substitute set widens quickly when the buyer job changes. Squarespace remains relevant when ease of
              use and polished templates matter more than governance depth. Shopify becomes the obvious alternative when
              the website is mainly a commerce operating layer. Contentful and WordPress VIP matter when the buyer wants
              a more open or composable architecture. Ghost is narrower, but still relevant for membership and
              publishing workflows. The competitive risk for Webflow is therefore fragmentation: the company is
              defending a valuable middle ground between DIY builders, open enterprise stacks, and commerce-heavy
              platforms rather than one simple peer set.
