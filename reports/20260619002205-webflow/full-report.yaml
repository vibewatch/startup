chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and current platform scope
        blocks:
          - type: paragraph
            body: >-
              Webflow is no longer best described as a simple no-code site builder. Its homepage now calls the product
              the “agentic web platform for modern businesses,” while the about page keeps the older mission language
              about bringing development superpowers to everyone and making digital experiences come alive. Across the
              homepage, CMS page, AI page, and AI-governance page, the company’s current self-definition is consistent:
              Webflow wants to own the system where marketing teams build, manage, optimize, and increasingly automate
              digital experiences without handing every change back to engineering.


              That positioning matters because it clarifies both what Webflow sells and what it wants investors to
              believe about its category. The CMS page frames Webflow as a content engine for marketers and developers,
              the AI page layers copy generation, design modification, code generation, and optimization into the
              workflow, and the AI-governance page adds workspace-level controls and privacy language intended to make
              that AI story enterprise-safe. The company is therefore pitching a hosted operating layer for web
              experiences, not merely a visual editor.


              Public partner and launch coverage still supports the older founding narrative behind that thesis.
              TechCrunch’s 2013 launch piece showed Webflow emerging as a responsive-web design tool for agencies and
              designers, while the company’s later funding posts describe a longer journey from design tooling toward
              broader website and application ambitions. The clearest takeaway for later chapters is that Webflow’s
              identity has widened from visual web development into a broader web experience platform, and the company
              is now explicitly using AI and governance as proof that it belongs in a higher-value software category.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO006
