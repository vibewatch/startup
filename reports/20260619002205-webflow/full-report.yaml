        title: Platform scope and module map
        blocks:
          - type: paragraph
            body: >-
              Webflow’s current product story is deliberately broader than classic no-code page building. Across the
              platform and enterprise surfaces, the company packages design, CMS, localization, analytics, optimization,
              and governance as one managed web stack. That positioning matters because it determines who can buy the
              product: not just designers, but marketing, content, growth, security, and web-ops teams that want fewer
              handoffs and fewer external tools. The official module set is also unusually explicit. CMS, Localization,
              Optimize, Analyze, Apps, DevLink, code generation, and headless CMS APIs are all presented as first-class
              surfaces rather than buried add-ons. The result is a platform with credible breadth for brand sites,
              content-heavy experiences, multilingual estates, and experimentation-led growth teams, even if the
              company’s own marketing still overstates how mature every module is.
