        - label: Webflow pilot or shortlist
          detail: >-
            Customer tests Webflow through landing pages, a rebrand sprint, or an enterprise evaluation led by marketing
            and digital teams.
        - label: Migration or consolidation
          detail: >-
            Main site, microsites, or multi-brand estates move into one managed workspace with reusable components and
            CMS structure.
        - label: Localization / governance setup
          detail: >-
            Regional teams, page branching, permissions, and locale workflows are configured for safe distributed
            publishing.
        - label: Marketer-owned publishing
          detail: Content and growth teams take over routine launches without waiting on developer queues for every change.
        - label: Optimization and analytics expansion
          detail: Teams layer in Analyze, Optimize, and segmentation workflows to improve conversion and audience relevance.
        - label: Platform-wide expansion
          detail: >-
            Successful accounts add more pages, more sites, more locales, or broader digital estates once trust in the
            operating model is established.
