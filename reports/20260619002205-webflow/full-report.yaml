      - number: '3.5'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >
              Webflow’s moat is real, but it is narrower than a generic “website builder leader” story would imply. The
              strongest evidence for durability is the company’s repeated proof that marketing teams can ship faster
              without adding to the developer backlog, plus its move into adjacent layers like optimization,
              localization, AEO, and Cloud. Those additions make the product harder to displace with a simple template
              tool. They also help Webflow sell against heavier digital experience platforms, not just against Framer or
              Squarespace.


              The adverse evidence is that many rivals are converging toward similar language. Framer now markets
              enterprise-grade trust features. Wix Studio markets enterprise infrastructure and collaboration.
              Contentful and WordPress VIP still own stronger openness narratives. Independent reviewers continue to
              flag Webflow’s learning curve and pricing complexity. The deepest unanswered diligence question is
              therefore not whether Webflow has product quality; it is whether the new platform layers meaningfully
              improve competitive retention and win rates, or whether they simply move the battlefield into more crowded
              categories where incumbents already have greater scale, ecosystem power, or procurement comfort.
