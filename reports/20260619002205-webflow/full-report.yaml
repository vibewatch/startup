              - CV058
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A real company can still be a hard underwriting problem
            body: >-
              Webflow does not need to prove that it matters. It needs to prove that current financial quality still
              supports the old premium private mark under today's valuation regime.
            calloutType: strength
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV047
              - CV048
          - type: callout
            title: What would make $4B look fair instead of stretched
            body: >-
              A current revenue base comfortably above the 2022 public anchor, plus strong retention and gross margins,
              would move the mark from historical badge to underwritten reality.
            calloutType: assumption
            claimRefs:
              - CV039
              - CV040
              - CV042
              - CV043
          - type: callout
            title: The stale-anchor problem is the whole point
            body: >-
              Because the newest clear valuation anchor is historical, investors risk paying for a premium outcome
              before public evidence proves that Webflow has actually grown into it.
            calloutType: risk
