      - number: '7.2'
        title: Contractual, privacy, and regulatory allocation risk
        blocks:
          - type: paragraph
            body: >-
              Webflow's legal and privacy surface is substantive enough to prove that the company has a real compliance
              program, but the same source set makes clear that a large share of the operating burden sits with the
              customer. The terms require customers to comply with applicable privacy and export laws, configure their
              own web security controls, provide notices, gather consents, and answer end-user rights requests. The
              privacy policy and DPA then show the other half of the bargain: Webflow uses third-party processors and
              analytics, moves data across borders, relies on DPF and SCC transfer tools, and offers deletion, audit,
              and subprocessor mechanisms that are meaningful but conditional.


              That matters because enterprise diligence is not satisfied by a trust page alone. The DPA gives customers
              a 15-day window to object to new subprocessors, but if Webflow cannot avoid the vendor the practical
              remedy is termination. Audit rights also come with notice, cost, and frequency limits. Meanwhile,
              California and EU regulator sources remind investors that controller duties, deletion rights, opt-outs,
              and transfer governance remain real legal exposures. The correct risk conclusion is therefore not that
              Webflow lacks legal infrastructure, but that regulated buyers still need detailed diligence on
              documentation depth, auditability, residency, and operational ownership before treating compliance as
              solved.
