      - number: '3.2'
        title: Direct design-led peers and upmarket incumbents
        blocks:
          - type: paragraph
            body: >
              Framer is Webflow’s cleanest direct peer because it now sells the same broad promise: fast, high-quality
              marketing sites run by designers and marketers rather than by an engineering queue. Its pricing starts
              lower than Webflow’s, its enterprise page now advertises SOC 2 Type 2, ISO 27001, SSO, SCIM, and 99.99%
              uptime, and its own comparison page directly argues that Webflow is more structured and harder to
              forecast. That competitor-authored evidence is biased, but it still matters because it shows exactly how a
              credible challenger attacks Webflow in live deals.


              Wix Studio is the other major direct threat. It is not just a template builder; its current product
              surface emphasizes custom CSS, code tooling, multi-site management, shared content, SSO, collaboration,
              and enterprise-grade infrastructure. That lets Wix combine professional-web features with the distribution
              reach of a much larger installed base. Squarespace matters differently. Independent reviews still rank it
              above Webflow on ease of use and template polish, which keeps it relevant for premium SMB and creator
              sites, but the public evidence is thinner on governed enterprise-web workflows than for Webflow, Framer,
              or Wix Studio.
