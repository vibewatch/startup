  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The recommendation follows a simple chain: strong historical proof and current platform quality are offset by
      stale financial disclosure and threshold math that still looks demanding.
    data:
      nodes:
        - id: a
          label: Historical financing proof
          detail: Webflow did raise a real $4B round near $100M ARR.
        - id: b
          label: Current platform quality
          detail: Enterprise support, governance, and 300k-brand scale support a premium story.
        - id: c
          label: Stale metric base
          detail: Current ARR, margin, retention, and cap-table terms remain largely private.
        - id: d
          label: Threshold math still demanding
          detail: A $4B mark requires much higher revenue at today's normalized comp bands.
        - id: e
          label: Downside asymmetry
          detail: If the old mark has not been grown into, compression can happen faster than proof arrives.
        - id: f
          label: Recommendation
          detail: 'Research more: high-quality company, still stretched from public evidence alone.'
      edges:
        - from: a
          to: b
          label: supports premium narrative
        - from: b
          to: c
          label: but does not replace
        - from: c
          to: d
          label: which sharpens
        - from: d
          to: e
          label: and creates
        - from: e
          to: f
          label: therefore
    claimRefs:
      - CV037
      - CV041
      - CV046
      - CV047
      - CV048
      - CV049
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      At normalized 2026 multiple bands, Webflow would need substantially more revenue than its last public milestone to
      make a $4B mark look routine rather than exceptional.
    data:
      items:
        - label: Revenue needed at 7x
          value: 571
          unit: $M
        - label: Revenue needed at 10x
          value: 400
          unit: $M
        - label: Revenue needed at 12x
          value: 333
          unit: $M
        - label: Revenue needed at 15x
          value: 267
          unit: $M
        - label: Revenue needed at 20x
          value: 200
          unit: $M
        - label: 2022 public ARR anchor
          value: 100
          unit: $M
    approximationNotes: >-
      Bars express annual revenue required to justify a $4B equity value at each multiple; they are threshold math, not
      management forecasts.
    claimRefs:
      - CV036
      - CV039
      - CV040
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Scenario bands show that the old $4B mark sits closer to the bull case than to the center of the base case on
      current public evidence.
    data:
      items:
        - label: Bear case
          low: 1.1
          value: 1.6
          high: 2
          unit: $B
          claimRef: CV045
        - label: Base case
          low: 2
          value: 2.6
          high: 3.2
          unit: $B
          claimRef: CV044
        - label: Bull case
          low: 3.5
          value: 4.1
          high: 4.8
          unit: $B
          claimRef: CV043
    approximationNotes: >-
      Ranges are underwriting bands derived from retained comp references and required revenue thresholds, not from a
      full management model.
    claimRefs:
      - CV043
      - CV044
      - CV045
      - CV048
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: >-
      Webflow scores well on product ambition and historical proof, but poorly on current disclosure sufficiency for
      price underwriting.
    data:
      items:
        - label: Historical financing proof
          value: 8/10
          detail: The 2022 round, valuation, and near-$100M ARR milestone are well sourced.
          tone: positive
        - label: Current platform quality
          value: 8/10
          detail: Enterprise support, governance claims, AI breadth, and 300k-brand scale are credible positives.
          tone: positive
        - label: Current metric freshness
          value: 3/10
          detail: No retained source discloses current ARR or audited current revenue.
          tone: warning
        - label: Retention visibility
          value: 2/10
          detail: No public NRR, GRR, or churn-by-cohort data is retained.
          tone: warning
        - label: Economics visibility
          value: 3/10
          detail: Gross margin, hosting-cost burden, and cash-conversion quality remain private.
          tone: warning
        - label: Comp support
          value: 4/10
          detail: Premium is plausible, but the old 40x anchor still looks exceptional versus current public comps.
          tone: warning
        - label: Downside asymmetry
          value: 4/10
          detail: If the $4B mark has not been grown into, compression can happen faster than evidence improves.
          tone: warning
    approximationNotes: >-
      Scores are IC-oriented judgment indicators synthesized from retained evidence; they are not outputs from a
      statistical model.
    claimRefs:
      - CV041
      - CV042
      - CV047
      - CV048
      - CV049
