      - number: '2.3'
        title: Buyer, user, and payer map
        blocks:
          - type: paragraph
            body: >-
              The buyer map around Webflow is broader than “small business owner making a brochure site,” but it is also
              narrower than the full no-code market. Webflow’s own enterprise and CMS pages speak directly to marketers,
              developers, and web teams that need governance, content velocity, and optimization. Framer pitches
              professional-site teams, Wix Studio pitches agencies and enterprises, Squarespace still leans into
              design-led websites, and WordPress.com sells done-for-you site creation for businesses, professionals,
              blogs, and stores. Those differences matter because they imply different buyers, different budget owners,
              and different switching costs.


              At the low end, founders or owner-operators often collapse buyer, user, and payer into one person. In
              startup marketing teams, the user is often a designer or marketer while the payer is a founder or
              functional leader. In agencies, the workflow buyer is usually the principal or delivery lead who cares
              about repeatability and client handoff. In enterprise, the buyer shifts toward digital, web,
              marketing-ops, or IT-governed teams that value permissions, auditability, and integration as much as
              page-building speed.


              For Webflow specifically, the most valuable buyer segments appear to be startup and mid-market marketing
              teams, agencies delivering many sites, and enterprise web teams that need governance without a heavy
              custom-code stack. That means the company’s commercial sweet spot is not all website demand; it is the
              subset where workflow depth justifies a premium platform.
