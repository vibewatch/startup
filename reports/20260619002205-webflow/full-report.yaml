        - Lower acceptable entry price and widen downside range.
      - - Future round resets the private mark
        - >-
          A new financing or meaningful secondary clears below or only near the current anchor without better
          disclosure.
        - Signals that the private market also doubts the old Series C premium.
        - Rebuild the valuation case from the new terms rather than from the 2022 badge.
      - - Portability / governance objections become durable
        - Buyers repeatedly cite control, export, or pricing concerns in competitive deals.
        - Turns a product-strength story into a platform-discount story.
        - Treat premium-multiple assumptions as broken until churn and win-loss data improve.
    notes: >-
      Each trigger is stated in a way that an investment committee can monitor from diligence materials or later company
      reporting rather than from narrative sentiment alone.
    claimRefs:
      - CV050
      - CV051
      - CV052
      - CV053
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Current revenue / ARR
        - A current audited revenue run-rate or ARR bridge since the 2022 public disclosure.
        - Without this, investors cannot tell whether the historical $4B mark has already been grown into.
        - Request current management financials and a revenue bridge from the last public anchor.
      - - Retention quality
        - NRR, GRR, logo churn, and cohort retention by segment or plan.
        - Premium software multiples are hard to defend without proof that revenue compounds efficiently.
        - Request cohort tables by customer tier, ACV band, and vintage.
      - - Economics quality
        - Gross margin, hosting-cost burden, support-cost structure, and cash conversion.
        - Separates a premium software asset from a great product with weaker underlying unit economics.
        - Request current financial model outputs and hosting / support cost detail.
      - - ARR mix and ACV
        - Revenue split across self-serve, Premium, Team, and Enterprise, plus named large-account ACVs.
        - Shows whether the company is truly maturing into higher-quality enterprise revenue.
        - Request plan-tier revenue mix, top-account packet, and expansion / contraction bridge.
      - - Cap table and transaction terms
        - Preferences, secondary mix, governance rights, and any new financing or secondary clears since 2022.
        - Headline valuation can overstate what new money actually buys.
        - Request financing documents or counsel summary plus any recent secondary-market evidence.
    notes: >-
      Each ask maps directly to a valuation uncertainty rather than to generic curiosity; clearing even two or three of
      them could move the recommendation materially.
    claimRefs:
      - CV013
      - CV036
      - CV047
      - CV054
      - CV055
      - CV056
      - CV057
      - CV058
