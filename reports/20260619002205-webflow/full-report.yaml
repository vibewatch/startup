  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category layers
        blocks:
          - type: paragraph
            body: >-
              The most important market decision in this chapter is definitional, not numerical. Webflow’s own
              enterprise, CMS, AI, and AEO materials describe a system for designing, governing, publishing, and
              optimizing digital experiences. That sits in a layer above a simple drag-and-drop website builder, but
              still below the broadest low-code/no-code and enterprise content-stack categories. Official competitor
              pages reinforce that distinction: Framer frames itself as an AI website builder for professional sites,
              Wix Studio explicitly targets agencies and enterprises, Bubble positions itself as an AI app builder,
              Shopify leads with commerce infrastructure, Contentful speaks to scalable content operations, and
              WordPress.com sells managed site creation across many site types.


              That source set makes Webflow’s true boundary narrower than the full no-code universe. Bubble and Shopify
              are adjacent substitutes in certain deals, but they solve structurally different jobs. Contentful can
              substitute at the composable-enterprise end, but it assumes a more modular stack. Squarespace still
              occupies a simpler editorial and brand-site motion, while Framer and Wix Studio are the most direct
              signals that the premium-web slice is becoming more crowded.


              The practical implication is that any later valuation work should avoid treating all low-code spend as
              equally relevant to Webflow. The premium professional-web category is real, but it has to be defined by
              buyer need, workflow depth, and governance requirements rather than by the largest available TAM headline.
