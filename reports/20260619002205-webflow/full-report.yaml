      - number: '4.2'
        title: 2026 repricing and upmarket monetization shift
        blocks:
          - type: paragraph
            body: >
              The 2026 repricing cycle matters because it reveals how Webflow wants to move upmarket without abandoning
              self-serve discovery. The official pricing calculator confirms that the May 13, 2026 update merged the
              former CMS and Business site plans into a single Premium plan and changed migration timing based on
              workspace type. Independent agency analysis adds the operational detail that matters for underwriting:
              some lower-tier customers see modest increases and better limits, while high-traffic customers can face a
              higher effective bill once bandwidth add-ons are restored. The new Team plan is the clearest signal.
              Webflow has created a named tier for organizations that have outgrown self-serve but are not ready for a
              custom Enterprise contract.


              That matters financially because it widens the ARPU ladder. Team bundles localization, AEO agents,
              workflows, security headers, and multiple seats, while AI credits introduce a usage-sensitive layer on top
              of subscription revenue. The commercial upside is obvious: a mid-market bridge can improve expansion
              before Enterprise. The downside is forecasting complexity. As third-party reviews note, Webflow already
              had a reputation for plan complexity, and the 2026 updates add more moving parts even while simplifying
              part of the site-plan taxonomy.
