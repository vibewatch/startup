  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      The main downside path runs from governance or pricing shocks into partner sentiment, renewal friction, and weaker
      enterprise credibility.
    data:
      nodes:
        - id: n1
          label: Abrupt AI-driven restructuring
          detail: Layoffs and operating-model change weaken trust.
        - id: n2
          label: Customer / partner concern
          detail: Agencies and buyers question continuity and governance.
        - id: n3
          label: Pricing and credit friction
          detail: Bandwidth resets and AI credits change account economics.
        - id: n4
          label: Procurement / renewal resistance
          detail: Compliance, portability, or TCO objections surface.
        - id: n5
          label: Enterprise conversion slowdown
          detail: High-value accounts take longer or choose alternatives.
        - id: n6
          label: Support and implementation load
          detail: More explanation and exception handling are required.
        - id: n7
          label: Lower net expansion confidence
          detail: Pricing power and account durability look weaker.
        - id: n8
          label: Valuation support weakens
          detail: Premium narrative loses credibility if trust or economics slip.
