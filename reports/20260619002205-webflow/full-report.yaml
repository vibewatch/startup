  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked top risks and how they transmit
        blocks:
          - type: paragraph
            body: >-
              Webflow's most acute risk in 2026 is not raw availability or product-market fit; it is execution
              credibility during a strategic pivot. The retained source set shows a company simultaneously pushing
              deeper into enterprise governance, AI-native tooling, platform breadth, and higher-priced team workflows
              while also carrying out abrupt layoffs that some employees and ecosystem observers described as a
              trust-breaking event. That combination raises the chance that customers or partners interpret normal
              product and pricing changes through a governance lens rather than purely through a feature lens.


              The second cluster of risk is structural rather than episodic. Webflow's contracts make customers
              responsible for end-user notices, consents, privacy rights handling, and many site-level security choices;
              its DPA offers real safeguards, but also shows that audit access, new-subprocessor objection windows, and
              evidence depth are more constrained than a superficial trust-marketing read would suggest. The final major
              cluster is commercialization friction: Premium and Team clarify packaging, but bandwidth resets, AI-credit
              monetization, portability limits for dynamic content, and app-scope ceilings can all become renewal or
              procurement objections when accounts scale. In other words, the downside path is a stacked one—governance
              shock plus compliance burden plus pricing or scope friction—rather than a single catastrophic technical
              defect.
