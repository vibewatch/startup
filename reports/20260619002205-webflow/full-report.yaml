      - number: '1.5'
        title: Milestones, adverse events, and the key unresolved issues
        blocks:
          - type: paragraph
            body: >-
              The milestone record is strong enough to support later chapters without guesswork. The company was founded
              in 2012, launched publicly in 2013, raised large institutional rounds in 2019, 2021, and 2022, added more
              senior operators in 2023–2024, and then used 2026 to push next-gen CMS, AEO, and brand-aware AI
              acquisitions. That chronology helps explain why Webflow now frames itself as an agentic web marketing
              platform rather than as a visual design tool.


              But the 2026 record is not uniformly positive. The April outage report describes a CMS database-cluster
              failure that disrupted hosted sites, forms, APIs, the Dashboard, and the Designer, leaving roughly 4% of
              directly affected customers down until late evening. A month later, Linda Tong disclosed a restructuring
              and explicitly acknowledged that AI tools and lightweight builders were serving simple site needs faster.
              The external layoff coverage adds a second cautionary note: management did not publish a confirmed
              reduction figure, so observers are forced to rely on outside estimates instead of clean disclosure.


              Those two events sharpen the remaining diligence questions. Webflow still does not publicly give a clean
              board map, a current ARR figure, or a precise post-restructure headcount. The company therefore enters
              later chapters with strong product and customer proof, but also with real operational and transparency
              gaps that should temper any easy “quality SaaS compounder” narrative.
