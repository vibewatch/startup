  - id: TP001
    title: Competitor profile table
    columns:
      - Platform
      - Category
      - Scale / traction signal
      - Target segment
      - Differentiation
      - Limitation
    rows:
      - - Webflow
        - Focal platform / governed web experience layer
        - 300,000+ brands; 3.5M users; 900+ team members
        - Marketing, design, and web teams from mid-market to enterprise
        - Integrated build, CMS, localization, optimization, AEO, and hosted governance
        - Hosted model and higher-complexity workflows narrow the easiest SMB use cases
      - - Framer
        - Direct design-led peer
        - Private venture-backed rival with lower self-serve entry price
        - Design-led marketing teams and startups
        - Fast visual workflow, lower entry pricing, strong design-centric UX
        - Less public proof of broad upmarket distribution than Webflow or Wix
      - - Wix Studio
        - Direct incumbent peer
        - Backed by the wider Wix base and enterprise infrastructure claims
        - Agencies, developers, marketers, and enterprise teams
        - Combines pro-web tooling with major distribution and multi-site management
        - Broader brand can blur DIY and pro-market positioning
      - - Squarespace
        - Premium SMB incumbent
        - Widely recognized design-led builder with trial-led packaging
        - Creators, service businesses, SMB brands
        - Ease of use, polished templates, premium all-in-one brand surface
        - Less explicit governance and optimization depth than Webflow upmarket
      - - Shopify
        - Commerce substitute
        - Massive commerce platform with subscription plus payments economics
        - Merchants, omnichannel brands, B2B/B2C operators
        - Checkout, payments, POS, markets, and commerce operations
        - Overbuilt when the website job is mainly brand publishing
      - - Contentful
        - Composable / headless substitute
        - Enterprise DXP-style vendor with Studio and personalization layers
        - Large teams prioritizing APIs, governance, and composability
        - Open architecture, governance, SSO, multi-region delivery, AI actions
        - Requires more technical ownership than an integrated visual builder
      - - WordPress VIP
        - Open enterprise content platform
        - Traffic-scaled annual-contract product with strong SLA posture
        - Publishers and enterprise content organizations
        - Open ecosystem, plugins, APIs, annual support model, strong portability story
        - Quote-led motion and custom-development needs raise implementation overhead
      - - Ghost
        - Publisher-focused niche substitute
        - Managed publishing platform with memberships and newsletter economics
        - Writers, publishers, media teams, membership-led operators
        - Memberships, newsletters, publishing-native stack, 99.9% SLA on custom tier
        - Narrower workflow than a broad enterprise marketing platform
    notes: >-
      Coverage is partial rather than exhaustive because Bubble and Cargo fetches were too thin or blocked in this run;
      the table focuses on the strongest directly evidenced competitors and substitutes.
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the best-evidenced direct peers and substitutes for Webflow as of 2026-06-19, while weaker-fetched edge
        cases such as Bubble and Cargo are left to evidence gaps rather than guessed rows.
