  - id: TV005
    title: "BuildOps — Thesis-Break and Kill-Trigger Table"
    columns:
      - Trigger
      - Threshold
      - Transmission to Thesis
      - Action Implication
    rows:
      - - ARR growth deceleration
        - Net new ARR growth falls below 40% YoY at next financing or disclosure event
        - Bear case activated; premium multiple collapses; down-round risk elevated
        - Reassess investment thesis if next round priced at or below $1B post-money
      - - NRR below 100%
        - Net revenue retention disclosed below 100% in any cohort analysis
        - '"System of record" claim undermined; platform expansion thesis broken'
        - Exit or significant downgrade; re-underwrite at below-median private SaaS multiple
      - - Gross margin below 60%
        - GAAP gross margin disclosed below 60% for most recent fiscal year
        - Revenue quality insufficient for premium SaaS multiple; services-heavy mix confirmed
        - Re-underwrite at 4–5x blended ARR; remove from SaaS comparable set
      - - Down-round at next financing
        - Subsequent equity financing priced below $1B post-money valuation
        - Prior valuation mark officially broken; dilution accelerates for earlier investors
        - Assess liquidation preference impact; determine whether dilution changes return profile
      - - Management exodus
        - CEO or CTO departure without credible successor plan announced within 90 days
        - Execution continuity risk; Meritech board relationship and institutional knowledge disrupted
        - Place on watch; request immediate operating update from board contact; defer follow-on
    notes: >-
      Kill triggers are qualitative thresholds defined from current evidence and sector benchmarks. Actual
      materiality depends on timing, disclosed metrics, valuation, and market conditions at the time of
      trigger activation. Thresholds should be revised once audited financials are available.
    claimRefs:
      - CV030
      - CV037
      - CV024
      - CV028
      - CV043

  - id: TV006
    title: "BuildOps — Final Diligence Asks"
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Audited ARR and GAAP revenue
        - "ARR bridge, quarterly trend, revenue recognition methodology, software vs. services revenue split"
        - Cannot validate GetLatka estimate or underwrite 10x+ implied multiple without audited revenue baseline
        - Data room; external auditor; CFO interview
      - - Gross margin
        - "GAAP gross margin by revenue stream; software subscription GM separately from blended GM"
        - "Premium SaaS multiple (8x+) requires GM > 70%; below 60% materially re-anchors the applicable multiple"
        - Data room; finance team; CFO interview
      - - Net revenue retention (NRR)
        - "NRR across all customer cohorts and vintages; gross retention reported separately"
        - Most critical SaaS valuation driver per Acquiry 2026; validates or breaks platform expansion thesis
        - Board pack; finance team; investor update materials
      - - Burn rate and runway
        - Monthly cash consumption since Series C close; cash-on-hand as of last available month
        - Determines dilution risk from future rounds and time to next required capital event
        - CFO interview; data room; monthly financial statements
      - - Cap table and liquidation waterfall
        - "Full cap table; preference stack; anti-dilution provisions; option pool size and overhang"
        - Actual investor economics at various exit valuations; determines effective entry multiple at each scenario
        - Legal diligence; cap table summary from CFO; Series C term sheet review
      - - Customer concentration
        - "Top-10 customer ARR share; largest single-customer exposure as % of total ARR"
        - "Retention risk assessment; concentration above 15% per customer increases churn sensitivity materially"
        - Sales data; customer success team; cohort analysis report
    notes: >-
      Diligence asks are derived from identified evidence gaps in the public record. Each represents a blocking
      gap for underwriting the premium valuation at $1B entry. Priority order: audited ARR, then NRR and gross
      margin, then burn and cap table. All six items should be resolved in a formal data room before committing.
    claimRefs:
      - CV030
      - CV031
      - CV040

