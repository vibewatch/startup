  - id: diligence-asks-exit-readiness
    title: "Final Diligence Asks and Exit Readiness"
    body: >-
      Six categories of evidence are essential before committing capital at the $1B entry. Most critical: audited
      ARR and GAAP revenue with quarterly bridge and revenue recognition methodology — the GetLatka $97.4M estimate
      is directionally useful but not investment-grade. Second: GAAP gross margin broken out between software
      subscription and professional services — a blended margin below 65% re-anchors the applicable multiple
      toward 5–6x. Third: net revenue retention across all customer cohorts, the single most important SaaS
      valuation driver per Acquiry's 2026 analysis and the primary lever for premium multiple justification.
      Fourth: monthly cash burn and cash-on-hand post-Series C close, to assess dilution risk from future
      financing rounds. Fifth: cap table and liquidation waterfall covering preference stack, anti-dilution
      provisions, and option pool size — all currently undisclosed. Sixth: top-10 customer ARR concentration,
      to assess platform retention risk if anchor customers churn. On exit readiness: the active 2026 construction
      tech M&A market — with Autodesk, Trimble, and PE roll-ups acquiring vertical platforms — creates a credible
      strategic exit pathway at $500M–$1.5B depending on financial quality. An IPO path is unlikely given the
      hostile 2026 SaaS public market. The most realistic 3–5 year exit is a strategic acquisition or secondary
      buyout, both of which reward demonstrated NRR, gross margin, and path to profitability over raw growth rate.
    claimRefs:
      - CV030
      - CV033
      - CV025
    tableRefs:
      - TV006

