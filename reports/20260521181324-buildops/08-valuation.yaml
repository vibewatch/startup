      BuildOps' implied EV/revenue multiple of approximately 10.3x — computed at $1B post-money against GetLatka's
      unaudited $97.4M 2025 estimate — is 2–4x above ServiceTitan's ~5.0x and Procore's ~4.6x current public
      trading levels, and above the private SaaS equity-backed median of 5.3x ARR. NRR, gross margin, and burn
      rate are entirely undisclosed. The premium is not inherently unjustifiable for an 87.7% implied-growth
      company, but it cannot be validated without audited financials. The current evidence base does not support
      underwriting this level of premium at entry; investor should treat this as a conditional Hold until
      disclosure gaps are resolved.
    claimRefs:
      - CV011
      - CV030
      - CV037

  - calloutType: strength
    title: "Marquee Investor Syndicate Provides Institutional Credibility Signal"
    body: >-
      Meritech Capital Partners — whose portfolio includes Braze, Datadog, Facebook, Salesforce, Snowflake, and
      Tableau — led the $127M Series C. BOND Capital and SE Ventures (Schneider Electric) joined as new investors.
      Prior backers include Founders Fund, Bessemer Venture Partners, and B Capital. The quality of the syndicate
      is a strong signal that BuildOps has passed institutional-grade diligence at multiple stages and provides
      reputational anchor for the $1B valuation, though it does not substitute for disclosed NRR, gross margin,
      and burn in underwriting the entry.
    claimRefs:
      - CV002
      - CV003
      - CV026
      - CV040

  - calloutType: recommendation
    title: "Track: Monitor Execution and Require Financial Disclosure Before Committing"
    body: >-
      The recommendation is Track. BuildOps demonstrates compelling scale signals — unicorn status, marquee
      customer adoption, implied 87.7% ARR growth, and a premium investor syndicate — but the private-undisclosed
      financial profile prevents underwriting the ~10.3x implied EV/revenue multiple at entry. Priority actions:
      obtain audited ARR, gross margin, NRR, and burn rate through a formal data-room process; engage management
      on cap table and dilution profile; and reassess the bull/base/bear scenarios with disclosed metrics before
      committing capital at or near current entry.
    claimRefs:
      - CV001
      - CV030
      - CV041
      - CV042
      - CV043

  - calloutType: assumption
    title: "GetLatka Revenue Estimate Is Directionally Useful but Not Investment-Grade"
    body: >-
      The $97.4M 2025 revenue estimate from GetLatka is the most widely cited topline anchor for BuildOps, but
      it is a third-party estimate, not an audited figure. The same GetLatka profile contains an internal
      inconsistency — citing a $1B valuation as early as 2022 — that conflicts with the March 2025 Series C
      coverage and undermines confidence in the underlying data. The implied 87.7% YoY growth from the GetLatka
      2024 figure of $51.9M is directionally consistent with BuildOps' hiring activity but cannot be
      independently corroborated from public filings. All implied multiples and scenario analyses in this chapter
      are conditioned on this estimate and should be revised once audited revenue data is available.
    claimRefs:
      - CV009
      - CV031

