  - id: public-comp-analysis
    title: "Public Comparable Analysis and Implied Multiple"
    body: >-
      The most relevant public benchmarks for BuildOps are ServiceTitan (TTAN) and Procore (PCOR). ServiceTitan
      IPO'd in late 2025 and traded at approximately $61–62 per share as of May 2026, implying a market
      capitalization of ~$5.85–5.98B against trailing twelve-month revenue of approximately $961M — an EV/revenue
      multiple of about 5.0x. ServiceTitan reports net dollar retention consistently above 110% for more than ten
      consecutive quarters, a last-twelve-months EBITDA margin of 16%, and an FCF margin of 9%, and has completed
      11 acquisitions to date. Procore (PCOR) reported Q1 2026 revenue of $359.3M — 15.7% YoY growth — with 80%
      GAAP gross margin and non-GAAP free cash flow of $56M. At a ~$6.9B market cap against ~$1.5B full-year
      guidance, Procore implies roughly 4.6x EV/forward revenue. Both public comparables trade in the 4.6–5.0x
      range with full financial transparency. Against GetLatka's unaudited $97.4M 2025 estimate, BuildOps' $1B
      valuation implies approximately 10.3x — a 2–4x premium. SaaS Capital's 2025 survey of 1,500+ private B2B
      SaaS companies establishes the equity-backed median at 5.3x ARR and bootstrapped median at 4.8x. Windsor
      Drake's Q4 2025 vertical SaaS report shows end-to-end platforms with AI integration and 120%+ NRR can
      command 8.5–12.0x — a range BuildOps' implied multiple sits at the high end of only under the most optimistic
      revenue scenario ($120M ARR implies 8.3x). Many 2021-era unicorns that raised at 15–25x have since reset to
      4–8x in down rounds; BuildOps' March 2025 raise occurred after this correction but remains above the
      normalized range. Sensitivity analysis shows: at $80M ARR the multiple is 12.5x; at $120M it falls to 8.3x.
      At $226M total raised vs $97.4M estimated ARR, capital efficiency is approximately $0.43 ARR per dollar
      raised — moderate for vertical SaaS but not best-in-class.
