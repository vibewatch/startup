  - id: TV002
    title: "BuildOps — Investment Thesis and Anti-Thesis"
    columns:
      - Thesis Argument
      - Supporting Evidence
      - Anti-Thesis
      - What Would Change the View
    rows:
      - - Dominant commercial trades platform
        - "87.7% implied ARR growth; marquee customers including Service Logic and J.H. Kelly"
        - ServiceTitan has approximately 10x revenue scale and is expanding into commercial trades
        - BuildOps sustains >50% ARR growth and discloses NRR above 110%
      - - Marquee investor syndicate
        - "Meritech (Datadog, Salesforce); Founders Fund; Bessemer; $226M total raised"
        - Cap table and preference stack undisclosed; actual dilution risk unknown
        - Full financial disclosure at next financing or formal data-room diligence process
      - - AI integration roadmap
        - Series C proceeds directed at predictive analytics and AI-powered scheduling
        - Generic AI features may not sustain premium multiple; profitability deprioritized
        - AI demonstrably lowers churn or drives NRR above 115% with measurable customer ROI
      - - Strategic investor value via SE Ventures
        - "Schneider Electric CVC; global energy management and industrial automation reach"
        - No formal distribution or channel agreement publicly disclosed with Schneider Electric
        - Signed channel or resale agreement with Schneider Electric or SE Ventures portfolio announced
      - - Massive underpenetrated TAM
        - Commercial trades overwhelmingly underserved by modern cloud software
        - Procore and ServiceTitan both accelerating investment in specialty contractor segments
        - BuildOps sustains category leadership as larger incumbents increase trades-vertical investment
    notes: >-
      Thesis and anti-thesis arguments are based on publicly available evidence only. Key diligence items
      (NRR, gross margin, burn rate, cap table) are unresolved and would materially affect the thesis balance.
