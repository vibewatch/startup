  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: disclosure
      missingEvidence: "Audited ARR, GAAP revenue, net revenue retention (NRR), gross margin split by revenue stream, and monthly cash burn rate"
      whyItMatters: "These are the core inputs needed to underwrite any premium valuation in SaaS; without them, the 10.3x implied multiple cannot be validated or compared against public comps on an apples-to-apples basis"
      diligencePath: "Formal data room access; auditor report; board investor pack with quarterly ARR bridge and cohort NRR"
      relatedQuestionRefs:
        - QV011
        - QV024

    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: "Full cap table detailing preference stack, anti-dilution provisions, option pool size, and pro-rata rights for each investor class"
      whyItMatters: "Without the waterfall analysis, effective entry economics at various exit scenarios cannot be modeled; a heavily stacked preference may significantly reduce common equity value at the base case exit"
      diligencePath: "Legal diligence process; Series C term sheet review; CFO interview on cap table structure"
      relatedQuestionRefs:
        - QV025

    - type: missing-source
      severity: material
      topic: revenue
      missingEvidence: "Independent corroboration of the GetLatka $97.4M 2025 revenue estimate and 87.7% YoY growth figure from a primary source"
      whyItMatters: "The GetLatka profile contains an internal inconsistency; all implied multiples and scenario analyses depend on this unaudited estimate being directionally accurate"
