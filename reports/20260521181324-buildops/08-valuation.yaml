company:
  name: BuildOps
chapter:
  number: 8
  title: Valuation
  summary: >-
    BuildOps achieved unicorn status with its March 2025 $127M Series C led by Meritech Capital at a $1B post-money
    valuation, bringing total lifetime capital raised to approximately $226M. Against GetLatka's unaudited 2025 revenue
    estimate of $97.4M, the implied EV/revenue multiple is roughly 10.3x — a 2–4x premium above ServiceTitan's ~5.0x
    and Procore's ~4.6x public trading levels and the private SaaS equity-backed median of 5.3x ARR. The premium could
    be justified by BuildOps' implied 87.7% YoY growth trajectory, but cannot be cleanly validated until the company
    discloses NRR, gross margin, burn rate, and audited revenue — none of which are currently public. The recommendation
    is Track: compelling scale and traction evidence exists, but the disclosure profile prevents underwriting the premium
    at entry, and the hostile 2026 SaaS IPO environment limits near-term exit optionality. A bull case of $1.4–1.8B by
    end-2027 is plausible if growth and retention hold; a bear case of $400–600M applies if growth decelerates materially.

sections:
  - id: investment-thesis-context
    title: "Investment Thesis, Financing Context, and Recommendation"
    body: >-
      BuildOps closed its $127M Series C on March 21, 2025, achieving a $1B post-money valuation and entering unicorn
      status. The round was led by Meritech Capital Partners — whose portfolio includes Braze, Datadog, Facebook,
      Salesforce, Snowflake, and Tableau — with new participation from BOND Capital and SE Ventures, the corporate
      venture arm of Schneider Electric. Existing investors Fika Ventures, Next47, StepStone Group, and Titanium
      Ventures continued. Prior supporters include Founders Fund, Bessemer Venture Partners, B Capital, MetaProp,
      137 Ventures, and Liquid2. Total capital raised across all rounds stands at approximately $226M per Tracxn.
      Meritech partner Paul Madera joined the board alongside former Twitter CEO Dick Costolo, Fika founder TX Zhuo,
      former Boost Mobile CEO Stephen Stokols, and Next47 General Partner Matthew Cowan. Series C proceeds are directed
      at AI technology acceleration — predictive analytics, AI-powered scheduling, and real-time project tracking —
      rather than near-term profitability, which management has explicitly deprioritized in favor of R&D, headcount,
      market reach, and customer acquisition. Paul Madera described BuildOps as filling "an industry-wide need" in
      "a very large market that is wide open." The investment thesis rests on BuildOps becoming the definitive
      commercial trades platform across HVAC, electrical, plumbing, and multi-trade specialty contractors in a market
      historically underserved by software. The anti-thesis is that the implied entry multiple (~10.3x EV/revenue)
      is materially above public comp trading, quality-of-revenue metrics are entirely undisclosed, and the 2026
      SaaS exit environment limits near-term liquidity. The recommendation is Track: obtain audited financials,
      NRR, gross margin, and burn before committing capital.
