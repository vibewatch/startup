  - - Dynamics 365 Field Service
    - Horizontal FSM
    - Enterprise already standardized on Microsoft ERP/CRM
    - Public pricing and Microsoft platform backing
    - Contractor SKU, schedule-board tooling, Copilot and maintenance roadmap
    - Also configuration-led rather than contractor-native
  - - Spectrum / Trimble
    - ERP incumbent
    - Service-plus-construction contractor wanting field-to-office ERP depth
    - Trimble ARR $2.43B in Q1 2026
    - Unified service and construction ERP inside Trimble Construction One
    - Heavier enterprise footprint and potentially older UX expectations
  - - Jonas Construction
    - ERP incumbent
    - Mechanical or specialty contractor prioritizing integrated accounting
    - 14,000+ users
    - PMA, dispatch, work orders, accounting in one contractor ERP
    - Less evidence of modern AI or platform openness than newer cloud specialists
  - - FieldEdge
    - Substitute for smaller or mixed shops
    - QuickBooks-centric medium-to-large service business
    - Private; public pricing not listed
    - Live accounting sync and office-to-field workflow for home-service operators
    - Home-service bias and weaker evidence on complex commercial projects
