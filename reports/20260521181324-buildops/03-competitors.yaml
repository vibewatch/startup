  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: A current BuildOps pricing schedule or redlined customer quote that shows standard
      platform, implementation, and add-on economics.
    whyItMatters: Without direct pricing evidence, BuildOps can only be compared to public-price peers
      through review-site and competitor-roundup commentary, which weakens the packaging analysis.
    diligencePath: Request recent BuildOps proposals by customer size and module bundle, then compare
      implementation fees and annual minimums against Salesforce and Microsoft list-price anchors.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: win-rate
    missingEvidence: Observed win-loss data showing which segments BuildOps wins or loses against ServiceTitan,
      simPRO, and ServiceTrade.
    whyItMatters: The current chapter can infer likely win zones from product fit and reviews, but cannot
      quantify competitive conversion or replacement dynamics without deal-level evidence.
    diligencePath: Ask management for CRM-coded competitive outcomes by deal size, trade, and incumbent,
      and interview implementation consultants or channel partners who see the same deals.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: servicetitan-commercial-mix
    missingEvidence: A public or management-provided breakout of ServiceTitan commercial-only revenue,
      customer count, or module mix.
    whyItMatters: ServiceTitan may be either a direct peer or an adjacent mixed-shop incumbent depending
      on how much of its commercial business comes from true commercial contractors.
    diligencePath: Request customer mix by revenue, truck count, and residential versus commercial exposure
      from management or a former commercial sales leader; cross-check against case-study mix.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
