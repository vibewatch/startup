callouts:
- calloutType: strength
  title: Real differentiation exists at the commercial workflow layer
  body: BuildOps does appear differentiated where the buyer must coordinate commercial service dispatch,
    preventive maintenance, asset history, job costing, and project execution in one system. That is a
    narrower but more credible moat than generic “all-in-one FSM” positioning.
  claimRefs:
  - CP001
  - CP002
  - CP031
  - CP033
- calloutType: risk
  title: Incumbent scale and rollout friction can erase fit advantages
  body: The main competitive risk is not that BuildOps lacks product-market fit; it is that larger platforms
    can bundle adjacent workflows while BuildOps still asks buyers to accept heavier implementation, support,
    and reporting friction than lighter-weight alternatives.
  claimRefs:
  - CP032
  - CP034
  - CP038
  - CP044
