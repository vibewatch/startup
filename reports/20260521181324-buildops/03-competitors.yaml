company:
  name: BuildOps
chapter:
  number: 3
  title: Competitors
  summary: BuildOps competes most directly with ServiceTrade, simPRO, and ServiceTitan's commercial offering,
    while Procore, Jonas or Spectrum, Salesforce Field Service, and Microsoft Dynamics 365 Field Service
    function as adjacent substitutes for buyers prioritizing project execution, ERP depth, or existing
    platform estates. The company's strongest edge is commercial-workflow specificity—especially service-plus-project
    unification for commercial MEP contractors—but that moat is narrower than true network effects and
    can be pressured by incumbent bundle power, public price anchors, and BuildOps's own implementation
    and support friction. Public win-loss and module-economics evidence remains absent, so moat durability
    is directionally positive but not fully proven.
sections:
- id: landscape-boundary
  title: Landscape Boundary and Segment Map
  body: 'BuildOps does not compete inside a single undifferentiated “field service software” bucket. The
    evidence points to at least five distinct competitive classes: commercial MEP hybrid platforms that
    try to run service and projects together; compliance-heavy commercial service tools that shine on
    inspections and customer proof; residential or mixed-shop systems optimized for technician sales and
    home-service workflows; project-centric subcontractor and construction ERP suites; and horizontal
    enterprise FSM products that arrive through broader CRM or ERP estates. That segmentation matters
    because the buyer is not only choosing features; the buyer is also choosing an operating model. BuildOps
    is most directly exposed where a commercial contractor needs dispatch, PM contracts, asset history,
    job costing, and project coordination in one commercial-specific stack. The moment the account instead
    prioritizes portals, heavy inventory or ERP control, residential sales motion, or an existing enterprise
    platform footprint, the competitive set changes materially.'
  claimRefs:
  - CP001
  - CP002
  - CP024
  - CP028
  - CP029
  - CP030
  - CP031
  - CP045
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: direct-vertical-rivals
  title: 'Direct Vertical Rivals: ServiceTrade, simPRO, and ServiceTitan Commercial'
  body: Among publicly visible alternatives, ServiceTrade, simPRO, and ServiceTitan's commercial offering
    are the closest direct competitors. ServiceTrade is unusually strong in inspection evidence, digital
    proposals, and customer portals, which makes it dangerous in fire and life-safety, compliance-driven
    HVAC, and other recurring inspection workflows where proving deficiencies matters as much as dispatching
    work. simPRO competes hardest where contractors run inventory-heavy, multi-phase commercial jobs and
    care deeply about estimating, procurement, and job-costing precision. ServiceTitan is broader and
    wealthier than either of those peers, and its commercial pages show a serious attempt to win larger
    contractors with real-time costing, maintenance pull-through, and AI-assisted field execution. But
    the independent roundups still place ServiceTitan closer to large service enterprises and mixed or
    residential-origin workflows than to pure commercial MEP specialists. BuildOps therefore appears strongest
    when the buyer wants a commercial-native hybrid of service plus projects rather than a compliance
    niche, an ERP-heavy job-costing tool, or a sales-led residential operating system.
  claimRefs:
  - CP003
  - CP004
  - CP005
  - CP017
  - CP018
  - CP019
  - CP028
  - CP039
  tableRefs:
  - TP002
  figureRefs:
  - FP002
- id: adjacent-incumbents
  title: 'Adjacent Incumbents: Procore, Jonas, Spectrum, Salesforce, and Dynamics'
  body: 'The adjacent threat comes from platforms that are not perfect one-for-one substitutes for BuildOps,
    but can still win because they already own a neighboring control point. Procore brings subcontractor
    collaboration, cost control, and project execution plus an unlimited-user pricing model that works
    well in contractor ecosystems with many external collaborators. Jonas and Spectrum offer deeper ERP
    gravity: service management tied directly to accounting, payroll, materials, and field-to-office reporting.
    Salesforce and Microsoft attack from the opposite direction. Their field-service products are horizontal,
    but they arrive with public list prices, mature enterprise procurement paths, and AI roadmaps that
    can be bundled into a wider CRM or ERP relationship. In accounts already standardized on those stacks,
    BuildOps must overcome not only feature comparison but also procurement inertia, security review shortcuts,
    data-model reuse, and the buyer''s desire to reduce vendor count.'
  claimRefs:
  - CP007
  - CP008
  - CP009
  - CP010
  - CP011
  - CP012
  - CP013
  - CP014
  - CP021
  - CP022
