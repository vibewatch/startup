  - FP003
- id: moat-durability
  title: Moat Durability and Adverse Competitive Evidence
  body: 'BuildOps''s best moat is not a network-effect flywheel; it is a fit advantage around commercial-specialty
    workflows. That is a real edge, because commercial MEP operators do not behave like residential dispatch
    shops or generic project-only subcontractors. But the edge is narrower and more attackable than a
    true data or marketplace moat. ServiceTitan is already extending its commercial surface area. Microsoft
    is automating work-order and maintenance planning through roadmap investment. Trimble and Procore
    already own adjacent financial, project, and collaboration workflows at substantial scale. The adverse
    evidence is also internal, not just external: BuildOps reviewers point to operational friction during
    rollout and support, which can neutralize product-fit advantages in the lower mid-market. The unanswered
    diligence questions are therefore the ones that matter most for durability: observed win rates against
    direct peers, module attach and retention after go-live, and whether ServiceTitan''s commercial business
    is direct enough to BuildOps to compress pricing over time.'
