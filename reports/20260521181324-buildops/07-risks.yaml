  - id: leadership-execution-exit-risks
    title: "Leadership, Execution & Exit Risks"
    body: >
      CEO and Co-Founder Alok Chanani is the singular public face of BuildOps: he is the named speaker in all major funding announcements, the sole executive quoted in Reuters and TechCrunch coverage of the Series C, and the first year-one LA500 honoree representing the company. His military-to-Wharton-to-founder narrative is deeply embedded in BuildOps' investor pitch and brand identity. The company's leadership page on The Org lists seven individuals—a thin executive bench for a $1B company targeting enterprise commercial contractors. A departure by Chanani or Co-Founder Steve Chew (COO/CPO) would remove irreplaceable institutional knowledge about the company's founding customer relationships and product strategy, likely triggering investor concern and possible customer uncertainty.

      Execution risk is heightened by the dual-motion platform expansion: BuildOps simultaneously manages a service FSM business (the existing installed base of 1,500+ contractors) and a newly launched Projects module targeting construction project management—a category with deep-pocketed rivals (Procore, Autodesk, Oracle Primavera). Running two go-to-market motions with a young sales organization (Greg Gillis joined as CRO and Christian Anderson as SVP Revenue in 2024–2025) introduces resource allocation tension that could slow both products' adoption curves.

      Exit options are uncertain. The CEO has publicly acknowledged IPO as a possibility but noted no clear timeline. With ServiceTitan trading at approximately $61/share and a negative net margin of -16.64% post-IPO, the FSM public market comparables are mixed. If M&A becomes the preferred exit, potential acquirers—Procore, Autodesk, ERP players—would gain a commercial FSM asset but may face channel conflict with their existing customer bases. Strategic acquirers from the investment base (Schneider Electric via SE Ventures) introduce related-party complexity. Investors who participated at the $1B unicorn valuation bear meaningful step-up risk if the IPO or M&A exit materializes at a lower multiple.
