  - id: regulatory-legal-risks
    title: "Regulatory, Legal & Data Privacy Risks"
    body: >
      California's amended CCPA/CPRA regulations, approved by the Office of Administrative Law on September 23, 2025 and effective January 1, 2026, impose direct obligations on BuildOps as a Los Angeles–headquartered SaaS provider processing California residents' personal data. The CPPA's revised ADMT (Automated Decision-Making Technology) rules require businesses that use ADMT to make "significant decisions" affecting consumers to provide pre-use notices, uphold opt-out and access requests, and conduct formal risk assessments. BuildOps' AI-native features (OpsAI scheduling recommendations, Copilot dispatching, asset-name capture automation) likely constitute ADMT within the CPPA's definition—making compliance both immediate and ongoing. Cybersecurity audit requirements phase in through April 2030, with businesses required to complete first audits on a rolling schedule based on annual revenue.

      The regulatory exposure is amplified by BuildOps' AI-native positioning: as AI expands from simple scheduling automation to job-costing prediction and proactive alerts, the boundary between process support and "significant decision-making" narrows, potentially triggering stricter CPRA obligations. ServiceTitan's own 10-K risk-factor section specifically flags evolving AI and data privacy regulation as a material risk, an analogous exposure BuildOps faces with fewer compliance resources as a private company. Additional EU AI Act and NIS2 Directive risk applies if BuildOps pursues international expansion, as the EU framework imposes mandatory conformity assessments for certain high-risk AI use cases.

      No publicly disclosed litigation, regulatory enforcement action, or IP dispute against BuildOps has been identified as of May 21, 2026. This absence of a disclosed legal record is in part attributable to limited public disclosure as a private company; diligence should include direct IP clearance against ServiceTitan's 16 U.S. patents, review of any trade-secret claims from prior employees, and a data processing addendum review for major customers.
