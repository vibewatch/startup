callouts:
  - calloutType: risk
    title: "Kill Criterion: ServiceTitan Parity in Commercial Project Management"
    body: >
      BuildOps' primary differentiation rests on being purpose-built for commercial contractors versus ServiceTitan's residential-first heritage. If ServiceTitan achieves demonstrable parity in commercial project management depth—evidenced by independent feature benchmarks or measurable win-rate declines—the thesis foundation collapses. The risk is compounded by ServiceTitan's $961M revenue base and public-company capital allocation flexibility, which dwarfs BuildOps' ability to sustain a feature war.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR007

  - calloutType: risk
    title: "Material Risk: AI Regulatory Exposure Under CPRA (2026)"
    body: >
      The CPPA's January 2026 ADMT regulations impose immediate pre-use notice and opt-out obligations on BuildOps' AI workflows. As OpsAI expands from scheduling support to proactive financial alerting, the company's obligations under the CPRA's "significant decisions" test will intensify. Non-compliance penalties reach $7,988 per violation—manageable individually, but threatening at enterprise scale if systemic process gaps exist.
    claimRefs:
      - CR021
      - CR022
      - CR023
      - CR025

  - calloutType: assumption
    title: "Assumption: No Undisclosed Litigation or Regulatory Investigation"
    body: >
      This chapter's risk assessment assumes no ongoing, sealed, or non-disclosed litigation or regulatory investigation against BuildOps. As a private company, BuildOps has no obligation to publicly disclose pending litigation. Diligence must include a direct representation from management regarding pending claims and a third-party litigation search.
    claimRefs:
      - CR025

