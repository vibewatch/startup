  evidenceGaps:
    - id: EG001
      topic: security-certification
      missingEvidence: "Published SOC 2 Type II or equivalent third-party security audit report, accessible to prospective customers."
      whyItMatters: "Without a verified third-party security certification, enterprise commercial contractors cannot independently validate BuildOps's security posture before entrusting it with GPS, financial, and customer data. The absence is a material procurement blocker for regulated customers or those with vendor risk management requirements."
      severity: material
      diligencePath: "Request SOC 2 report directly from BuildOps in the sales or due diligence process; ask whether a Type I or Type II has been completed and under what scope; request evidence of penetration testing and vulnerability disclosure program."
      relatedQuestionRefs: [QE012]

    - id: EG002
      topic: opsai-model-transparency
      missingEvidence: "Documentation of OpsAI's underlying AI model provider, training data sources, fine-tuning methodology, and evaluation benchmarks."
      whyItMatters: "BuildOps claims OpsAI is 'trained on commercial contracting workflows' but provides no external validation. If the product is a prompt-engineered wrapper over a public LLM, the technical moat is thin and competitor parity is achievable quickly. The risk of model hallucination in mission-critical scheduling and invoicing outputs is unknown without benchmarks."
      severity: material
      diligencePath: "Request technical product documentation or a white paper from BuildOps detailing OpsAI's architecture; ask whether the model is proprietary fine-tuned or prompt-engineered on a public LLM; request evaluation metrics and model refresh cadence."
      relatedQuestionRefs: [QE017]

    - id: EG003
      topic: sla-and-uptime
      missingEvidence: "Published SLA terms, uptime history, incident response timeline, and root cause disclosure practices."
      whyItMatters: "Commercial contractors rely on BuildOps for real-time dispatching and invoicing of mission-critical service operations. Without a published SLA or uptime record, buyers cannot assess operational risk or negotiate contractual remedies for service disruptions."
      severity: material
      diligencePath: "Request SLA terms in vendor contracts; ask for historical uptime data (99.9%? 99.5%?); request incident history and root cause reports; confirm whether status.buildops.com publishes historical uptime metrics."
      relatedQuestionRefs: [QE013]

    - id: EG004
      topic: api-documentation-and-access
      missingEvidence: "Publicly accessible REST API reference documentation, authentication specification, rate limits, and integration sample code."
      whyItMatters: "Invite-only API access limits the ecosystem's self-healing integration capacity and slows the onboarding of implementation partners in the Certified Partner Program. Without a public API, integration partners and buyers cannot independently evaluate the integration surface before committing."
      severity: minor
      diligencePath: "Request API sandbox access from BuildOps; evaluate documentation quality, endpoint coverage, rate limits, and webhook reliability; assess whether the API supports the integration use cases needed for the buyer's ERP or custom workflow."
      relatedQuestionRefs: [QE018]

    - id: EG005
      topic: pricing-structure
      missingEvidence: "Confirmed per-user or per-module pricing structure from BuildOps directly."
      whyItMatters: "The $299/user/month ITQLick estimate is unverified; BuildOps does not publish pricing publicly. Without confirmed pricing, total cost of ownership (including implementation fees reported as 'tens of thousands') cannot be modeled."
      severity: minor
      diligencePath: "Request a pricing proposal from BuildOps; confirm per-user vs. per-module pricing structure; ask about implementation, onboarding, and training fees; request references on total first-year cost from existing customers."
      relatedQuestionRefs: [QE011]

