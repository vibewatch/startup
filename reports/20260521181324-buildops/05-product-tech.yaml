          label: Accounting / ERP Sync
          description: Invoice, labor, and material data pushed to QuickBooks, Sage Intacct, NetSuite, Vista, or Spectrum automatically
        - id: w7
          label: Payment & Reporting
          description: Customer pays; payment recorded; management sees real-time P&L, technician productivity, and job costing dashboards
