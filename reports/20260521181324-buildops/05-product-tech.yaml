  - id: mobile-and-field-experience
    title: Mobile and Field Experience
    body: |-
      BuildOps provides native mobile apps for iOS and Android, available through Apple App Store
      (id: 1402547789) and Google Play (com.buildops.mobile). The technician app enables field
      crews to access job details, capture photos and videos, complete custom digital forms, record
      digital signatures, and sync data back to the dispatch board in real time. Offline data
      collection is supported for surveying and equipment listing tasks, addressing connectivity
      gaps common in commercial construction environments.

      AI-assisted field note generation is embedded in the mobile app: the technician dictates or
      enters rough notes and OpsAI refines them for professional formatting and completeness. This
      capability is marketed as reducing invoice close-out time and improving first-time-right
      billing accuracy. The AI also supports asset scanning via camera, reducing manual data entry
      for equipment onboarding.

      Independent review platforms present a mixed picture on mobile experience. Capterra reviewers
      (149 verified reviews as of May 2026) rate work order management at 4.5/5 and scheduling at
      4.3/5, reflecting broad satisfaction with core service workflows. However, multiple reviewers
      describe the mobile interface as "click-heavy," requiring many navigation steps to close out
      a single service call. The FieldEx 2026 review (authored by a competitor) rated the mobile
      experience at 2.5/5, noting "overly complicated" menus and occasional offline-syncing issues.
      GetApp's 9-respondent accounting integration sub-score is 3.1/5, below the platform's overall
      4.4/5 average. These signals indicate that while the service management workflow is well
      regarded, the mobile UX and integration edge cases carry execution risk for contractors
      transitioning from simpler tools.
    claimRefs:
      - CE031
      - CE032
      - CE033
      - CE034
      - CE035
      - CE036
      - CE037

  - id: trust-security-and-compliance
    title: Trust, Security, and Compliance
    body: |-
      BuildOps published a Privacy Policy last updated August 15, 2025. The policy describes data
      collection including GPS location data, job records, customer contact information, and
      financial data. It states that "all information you provide to us is stored on third-party
      secure servers behind firewalls" but does not name the cloud provider or certify specific
      security controls. The policy explicitly prohibits sharing mobile messaging opt-in data with
      third parties or affiliates for marketing purposes, which is notable for a platform that
      handles technician and customer communication data.

      BuildOps operates a Trust Center at trust.buildops.com and a Security page at
      buildops.com/security/. Both pages returned near-zero substantive content in public-facing
      HTML during this review — both rely heavily on JavaScript rendering and expose minimal
      auditable information to an unauthenticated visitor. No SOC 2 Type I or Type II report,
      ISO 27001 certificate, or equivalent third-party security audit was confirmed from any
      publicly accessible source as of May 2026. The absence of public security certification
      is a material gap for enterprise commercial contractors who must vet their software
      supply chain and for multi-site contractors whose BuildOps instance holds sensitive
      GPS location, financial, and customer data.

      No SLA, uptime guarantee, or published incident response timeline was found in public
      product pages or terms of service. The status.buildops.com page exists but its public
      content was minimal. These gaps create opacity around operational reliability that
      prospective buyers should address in due diligence.
    claimRefs:
      - CE038
      - CE039
      - CE040
      - CE041
