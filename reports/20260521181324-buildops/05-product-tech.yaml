company:
  name: BuildOps

chapter:
  number: 5
  title: Product & Technology
  summary: >-
    BuildOps delivers a cloud-based SaaS platform purpose-built for commercial specialty
    contractors — HVAC, electrical, plumbing, mechanical, fire & life safety, and refrigeration —
    integrating field service, project management, CRM, quoting, invoicing, and AI in a single
    system. The platform spans a Service Management Suite covering dispatch, scheduling, work orders,
    and preventive maintenance; a Projects module launched May 7, 2026 adding RFIs, submittals,
    change orders, document control, and project financials; and CRM+ for sales pipeline management.
    OpsAI, launched in 2023 as "AI for the Trades," automates scheduling decisions, note refinement,
    invoice scanning, and real-time troubleshooting. Seven native accounting/ERP integrations
    (QuickBooks Desktop/Online, Sage Intacct, NetSuite, Viewpoint Vista, Viewpoint Spectrum, Miter)
    represent the broadest certified integration set in the commercial trade-contractor niche.
    The developer API at developer.buildops.com is invite-only, limiting open ecosystem expansion.
    No SOC 2 or ISO 27001 certification was confirmed from public sources as of May 2026; the Trust
    Center at trust.buildops.com returned near-zero public content. Implementation time averages
    4–6 months per third-party reviews, creating operational disruption risk for prospective buyers.
    Multiple reviewers cite the mobile app as "click-heavy," with accounting integration
    inconsistencies flagged on GetApp and Capterra. BuildOps's commercial-native heritage, single
    integrated platform, and deepening AI layer constitute genuine differentiation, but security
    transparency, API openness, and integration quality represent material diligence gaps.

sections:
  - id: product-line-and-modules
    title: Product Line and Modules
    body: |-
      BuildOps is organized around three platform suites: Service Management, Projects, and CRM+.
      The Service Management Suite is the core product and covers the full commercial field service
      workflow — dispatching, scheduling, work orders, preventive maintenance, asset tracking, service
      agreements, invoicing, payments, and reporting. The dispatch board uses drag-and-drop scheduling
      with real-time visibility into technician availability, skill sets, and job status. Preventive
      maintenance scheduling supports automated recurring job creation, bulk scheduling, and visit
      tracking by date and zip code. Service agreements link recurring visits to billing automatically.

      The Projects module launched on May 7, 2026, targeting specialty contractors who run multi-month
      construction jobs alongside service work. It covers RFIs, submittal management, change order
      management, document control, resource planning, project financials, and subcontract tracking.
      A "Lists" feature allows teams to build repeatable digital SOPs applicable across job types. The
      module connects field execution to project financials in real time and integrates with the same
      accounting/ERP systems as the service module. This addresses a gap that previously forced
      contractors to run a separate project management system alongside BuildOps for service.

      CRM+ provides sales pipeline management, proposal creation, and quoting capabilities natively
      inside the platform, enabling service departments to manage customer relationships and win new
      commercial contracts without exporting data to a standalone CRM. Fleet+ adds GPS tracking,
      timesheet management, and proactive maintenance alerts for contractor fleet vehicles. The
      customer portal allows commercial clients to track job progress, view history, and communicate
      directly with the contractor's team. Asset management tracks equipment by location, service
      history, warranty, and maintenance schedule. BuildOps reports that customers include over 1,500
      commercial specialty contractors across North America as of May 2026.

      BuildOps positions its breadth against competitors by emphasizing that it covers service and
      project management together in one system. The company-authored comparison with ServiceTrade
      claims BuildOps includes native project management (RFIs, change orders, submittals, document
      control) while ServiceTrade does not offer full commercial project management. BuildOps's
      Why-BuildOps page states that efficiency gains include faster invoice close-out, reduced
      technician downtime, and improved billing accuracy, citing the Certified Fire customer story
      as a reference for a 54% rise in monthly service billing and 250% increase in profit margins
      after deployment.
