  - id: FE004
    title: Product Maturity / Capability Map
    type: matrix
    layout: wide
    summary: >-
      Qualitative capability assessment across five platform dimensions and four maturity levels,
      based on public product pages, review platform data, and competitor comparisons. Highlights
      where BuildOps is strong, where it is still maturing, and where independent evidence is thin.
    approximationNotes: >-
      Maturity ratings are qualitative assessments derived from public evidence — product pages,
      independent review platform data, and competitor comparison pages. No internal engineering
      metrics or product usage data were available. 'Strong' means well-documented and corroborated
      by multiple independent review sources; 'Maturing' means available but with noted gaps or
      complaints; 'Emerging' means newly launched or limited independent evidence; 'Gap' means
      no public confirmation of capability.
    data:
      columns:
        - Service Workflow Depth
        - Project Management
        - AI Integration
        - Mobile UX Quality
        - Security / Trust Transparency
      rows:
        - label: BuildOps
          values:
            - "Strong — core FSM since 2020; 4.4/5 avg on GetApp (149 reviews)"
            - "Maturing — Projects GA May 2026; limited post-launch customer evidence"
            - "Maturing — OpsAI 2023; expanded April 2026; model architecture undisclosed"
            - "Mixed — AI-assisted notes positive; UX rated 'click-heavy' by multiple reviewers"
            - "Gap — Trust Center JS-only; no SOC 2 confirmed publicly"
        - label: ServiceTrade
          values:
            - "Strong — commercial service native; compliance-focused"
            - "Gap — no native PM (RFI/submittal) per BuildOps comparison page"
            - "Emerging — AI features not prominently marketed"
            - "Moderate — no major UX complaints found in public reviews"
            - "Gap — no public SOC 2 found in this review"
        - label: ServiceTitan (commercial)
          values:
            - "Strong — enterprise FSM; broader trade coverage"
            - "Partial — construction-lite features; not commercial-project native"
            - "Strong — Titan Intelligence launched 2024; more marketing visibility"
            - "Moderate — enterprise UX; complexity reported for smaller shops"
            - "Gap — no public SOC 2 found in this review"
        - label: Procore
          values:
            - "Partial — general contractor-focused; not specialty service native"
            - "Strong — leading construction PM for general contractors"
            - "Emerging — AI features announced; less embedded than BuildOps"
            - "Moderate — enterprise-grade; less field-service optimized"
            - "Strong — SOC 2 Type II published; ISO 27001 certified"
        - label: simPRO
          values:
            - "Strong — strong FSM for specialty trades"
            - "Partial — job management but not full CM project suite"
            - "Emerging — limited AI signals in public materials"
            - "Moderate — functional mobile app; no major UX issues flagged"
            - "Gap — no public SOC 2 found in this review"
        - label: Microsoft D365 Field Service
          values:
            - "Partial — horizontal FSM; less commercial-trade-specific"
            - "Partial — D365 PM module available but requires additional licensing"
            - "Strong — Copilot embedded; backed by Azure OpenAI"
            - "Moderate — enterprise UX; configuration-heavy"
            - "Strong — Azure security certifications; SOC 2, ISO 27001 available"
        - label: Salesforce Field Service
