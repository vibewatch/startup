            - 排班（预防性维护批量排班、上门记录）
            - 工单（现场执行、数字签核）
            - 项目模块（RFI、提交件、变更单、文档控制 — 2026 年 5 月 GA）
            - 资产管理（设备跟踪、预防性维护提醒）
            - 服务协议（经常性计费）
            - Fleet+（GPS 跟踪、工时表、维护提醒）
        - label: AI 与移动层
          detail: OpsAI 嵌入各类工作流；移动应用承载现场执行；偏远作业现场具备离线能力。
