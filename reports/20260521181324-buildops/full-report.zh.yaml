  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品线与模块
        blocks:
          - type: paragraph
            body: >-
              BuildOps 围绕三大平台套件组织：Service Management、Projects 和 CRM+。

              Service Management Suite
              是核心产品，覆盖商业现场服务的完整流程——派工、排班、工单、预防性维护、资产跟踪、服务协议、开票、支付和报表。派工看板支持拖拽式排班，并实时显示技师可用性、技能组合和工单状态。预防性维护排班支持自动创建周期性工单、批量排班，并按日期和邮编跟踪上门。服务协议会把周期性上门与计费自动关联。


              Projects 模块于 2026 年 5 月 7 日发布，面向同时承接数月施工项目和服务业务的专业承包商。它覆盖 RFI、送审件管理、变更单管理、文档控制、资源规划、项目财务和分包商跟踪。“Lists”
              功能允许团队建立可复用的数字 SOP，适用于不同工单类型。该模块把现场执行与项目财务实时打通，并接入与服务模块相同的会计 / ERP 系统。此前，承包商必须在 BuildOps
              之外并行运行一套项目管理系统来处理服务以外的项目，该模块补上了这个缺口。


              CRM+ 在平台内原生提供销售管道管理、方案制作和报价能力，让服务部门无需把数据导出到独立 CRM，也能管理客户关系并赢得新的商业合同。Fleet+ 为承包商车队车辆增加 GPS
              跟踪、工时表管理和主动维护提醒。客户门户允许商业客户跟踪工单进展、查看历史记录，并直接与承包商团队沟通。资产管理按地点、服务历史、保修和维护计划跟踪设备。BuildOps 报告称，截至 2026 年 5
              月，客户包括北美超过 1,500 家商业专业承包商。


              BuildOps 用产品广度对标竞争对手，强调自己把服务和项目管理放进同一个系统。BuildOps 撰写的 ServiceTrade 对比页称，BuildOps
              包含原生项目管理能力（RFI、变更单、送审件、文档控制），而 ServiceTrade 不提供完整的商业项目管理。BuildOps 的 Why-BuildOps
              页面称，效率提升包括更快完成发票结案、减少技师停工时间、提高计费准确性，并引用 Certified Fire 客户故事作为证据：部署后月度服务计费增长 54%，利润率提高 250%。
