  - id: TP004
    title: 护城河耐久度 / 竞争风险登记表
    columns:
      - 护城河或威胁
      - 受益方
      - 严重性
      - 重要性
      - 可能的赢单 / 输单影响
      - 尽调要求
    rows:
      - - 商业承包工作流专用性
        - BuildOps
        - 中高
        - 商业服务 + 项目一体化，比通用 FSM 定位更窄、更具体
        - 有助于拿下真正有派工和项目混合需求的商业 MEP 客户
        - 按工种、服务 + 项目复杂度衡量赢单率
      - - 巡检和门户专用能力
        - ServiceTrade
        - 中
        - 合规负担重的承包商，可能更看重完工证明和客户门户证据，而不是通用工作流广度
        - 在消防 / 生命安全和巡检主导客户中，BuildOps 可能输单
        - 量化 BuildOps 门户和缺陷报告采用率，并与 ServiceTrade 对比
      - - 库存和 ERP 深度
        - simPRO / Jonas / Spectrum 等系统
        - 中高
        - 较大承包商会更看重作业成本核算和后台管控，足以压过 UI 体验
        - 如果财务和库存负责人主导选型，BuildOps 可能输单
        - 索取 BuildOps 替换或输给 ERP 既有厂商的案例研究
      - - 套件和装机基础势能
        - Microsoft / Salesforce / Procore / Trimble
        - 高
        - 既有平台体系可降低采购摩擦，缩短信任建立周期
        - 若供应商整合压力高，即便更贴合工种，BuildOps 也可能输单
        - 询问管线中已有 Salesforce、Microsoft、Procore 或 Trimble 的占比
      - - 实施和支持负担
        - 既有厂商和轻量替代品
        - 高
        - 评论证据显示，BuildOps 上线和支持摩擦可能抵消产品优势
        - 中低端市场潜在客户可能选择更简单或更熟悉的替代方案
        - 跟踪上线周期、支持工单账龄和实施后的客户推荐人反馈
      - - 赢单 / 输单数据不透明
        - 无
        - 高
        - 公开证据无法揭示各细分市场的实际竞争转化结果
        - 投资人对护城河耐久度的信心仍受制约
        - 提供 CRM 标注的输单和替换数据，并列明对手
    notes: 严重性是基于产品证据、评论摩擦和既有厂商规模信号的定性判断。本登记表用于确定尽调优先级，而不是预测模型。
