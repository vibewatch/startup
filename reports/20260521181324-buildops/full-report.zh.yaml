      - number: '1.4'
        title: 规模、增长与里程碑
        blocks:
          - type: paragraph
            body: >-
              BuildOps 于 2020 商业化推出平台，2021 录得约 $2.5 million ARR，2022 增至约 $16.4 million（三位数增长）。收入在 2023 增至 $24.6
              million，2024 翻倍至 $51.9 million。到 mid-2025，ARR 达到 $97.4 million，同比增幅约 88%。这些数据来自 GetLatka（SaaS 收入数据聚合平台），与
              CEO Chanani 关于 2023 和 2024 翻倍的公开说法一致。公司未独立披露确切 ARR 或 GAAP 收入，上述数字是第三方聚合估计，不是经审计财务数据。


              截至 March 2025，客户数突破 1,000 家商业承包商；截至 May 2026，超过 1,500 家。具名客户包括 J.H. Kelly、Haynes Mechanical、Dynamic
              Systems Inc.、Baker Electric 和 Smart Care Climate Solutions（将四套独立遗留系统整合到 BuildOps 上）。March 2025 披露员工约 375
              人，同比增长 50%。第三方估计显示，截至 early 2026，当前员工数在 500 到 626 之间。公司尚未盈利，正大力投入产品、工程和市场拓展。地域扩张包括 Raleigh, NC
              工程中心、Toronto 运营团队，以及 Los Angeles 总部。BuildOps 表示计划将一部分 Series C 资金用于战略收购。
