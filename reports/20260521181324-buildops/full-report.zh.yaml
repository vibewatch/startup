        - 大型服务企业，或住宅-商业混合经营者
        - 上市公司报告节奏；确切商业业务占比未披露
        - 商业成本核算、维护拉动、AI 现场辅助
        - 独立来源仍认为它比 BuildOps 更偏住宅或大型服务
      - - Procore
        - 相邻项目平台
        - 重视协作和项目控制的专业承包商
        - 3M 个人用户；上市公司报告
        - 无限用户协作、项目执行、现金流控制
        - 经常性服务调度和项目管理工作流不是其公开重心
      - - Salesforce Field Service
        - 横向 FSM
        - 已标准化使用 Salesforce 的企业
        - 公开定价，上市公司背书
        - 调度员-技术员-承包商角色分层，以及 CRM 原生 AI
        - 需要按承包商场景配置，才能匹配技工工作流
      - - Dynamics 365 Field Service
        - 横向 FSM
        - 已标准化使用 Microsoft ERP/CRM 的企业
        - 公开定价，Microsoft 平台背书
        - 承包商 SKU、排班看板工具、Copilot 和维护路线图
        - 同样靠配置驱动，而非承包商原生
      - - Spectrum / Trimble
        - ERP 在位厂商
        - 需要现场到办公室 ERP 深度的服务 + 施工承包商
        - Trimble ARR 在 2026 年 Q1 为 $2.43B
        - Trimble Construction One 内的一体化服务与施工 ERP
        - 企业级足迹更重，UX 预期可能更旧
      - - Jonas Construction
        - ERP 在位厂商
        - 重视集成会计的机械或专业承包商
        - 14,000+ 用户
        - PMA、调度、工单、会计都在一个承包商 ERP 里
        - 现代 AI 或平台开放性的证据少于新一代云端专精厂商
      - - FieldEdge
        - 小型或混合业务承包商的替代品
        - 以 QuickBooks 为中心的中大型服务企业
        - 私营；未列公开定价
        - 面向家庭服务经营者的实时会计同步和办公室到现场工作流
        - 偏家庭服务；复杂商业项目证据较弱
