      - number: '1.3'
        title: 融资历史与投资方
        blocks:
          - type: paragraph
            body: >-
              BuildOps 自成立以来完成四轮机构融资。2019 初始种子轮募得约 $5.8 million，用于早期平台开发。May 2022，公司完成由 Next47（Siemens 全球创投部门）领投的 $43
              million Series A，Founders Fund、StepStone Group、Fika Ventures、Global Founders Capital、MetaProp VC 等参投，累计融资约
              $48.8 million。May 2023，由 Fika Ventures 和 01 Advisors 领投的 $50 million Series B 使累计融资超过 $100 million；Twitter
              前 CEO Dick Costolo 在这一阶段加入董事会。CEO Alok Chanani 在 Series C 公告中披露，公司随后还完成了一笔约 $36 million 的 Series B
              追加融资，仅面向现有投资方。


              March 21, 2025，BuildOps 完成由 Meritech Capital 领投的 $127 million Series C，投后估值 $1 billion，达成独角兽里程碑。新投资方 BOND
              Capital 和 Schneider Electric 旗下 SE Ventures 与既有投资方 Fika Ventures、Next47、StepStone Group、Titanium Ventures
              一同参投。早期投资方包括 01A（原 01 Advisors，由 Dick Costolo 和 Adam Bain 共同创办）、Founders Fund（Peter Thiel 旗下机构）、MetaProp、B
              Capital、137 Ventures 和 Liquid 2 Ventures（Joe Montana）。截至 Series C 交割，累计融资超过 $250 million。CEO Chanani 对
              TechCrunch 表示，$1 billion 的 Series C 估值比 Series B 的投后估值翻了一倍以上。BuildOps 未公开披露债务融资工具或老股交易；这些仍是开放尽调项。
