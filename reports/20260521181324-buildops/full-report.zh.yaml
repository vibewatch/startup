      - number: '6.5'
        title: 集中度风险与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              客户集中度是公开记录中最大的盲点。具名证据集偏向规模较大的商业运营商和企业式平台，这对 ACV 质量是利好，但如果少数平台账户代表 ARR 的大部分，就可能很危险。Smart Care 的投资组合推广和
              Service Logic 的公开支持都暗示有意义的企业关系，但没有来源披露头部客户集中度、按客户分层的
              ARR，或装机基础中有多少来自多实体推广、多少来自独立区域承包商。因此，任何单一客户流失事件的下行都无法从公开证据量化。


              还有两个缺口值得继续跟踪。第一，公开证据仍由 BuildOps 筛选后的案例研究主导，而不是独立续约或部署报告；许多故事清楚描述了生产使用，但很少披露合同期限、模块附加、推广阶段或实施后留存。第二，即使
              BuildOps 明显在推进认证伙伴和消防安全集成，伙伴广度仍不透明。因此，下一步尽调应很直接：索要前 10 大客户集中度、标准合同期限、续约队列、伙伴来源 ARR，以及最大具名账户的部署阶段视图。
            claimRefs:
              - CU006
