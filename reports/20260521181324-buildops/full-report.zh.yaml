      - number: '5.6'
        title: 差异化、路线图与技术风险
        blocks:
          - type: paragraph
            body: >-
              BuildOps 的核心差异化在于商业原生架构：公司 2018 年创立时就明确面向商业专业承包商，而不是从住宅或总承包商场景改造而来。这带来了竞争对手缺少的工作流深度——例如，ServiceTrade
              专注服务和合规，但缺乏原生项目管理；Procore 覆盖总承包商，但并非为专业工种服务运营量身打造。2026 年 Projects 模块上线，补掉了一个长期缺口：承包商此前必须在 BuildOps
              旁边并行运行项目管理系统。


              集成策略——七个认证 ERP / 会计集成加上 Certified Partner Program——建立了切换成本，也降低了中端市场承包商的集成债务。Partner Program 是相对新的补充（2026
              年宣布），其市场渗透率和质量尚无法独立验证。仅限邀请的 API 限制了第三方开发者生态形成，相比开放开发者门户的平台，可能拖慢 marketplace 扩张。


              OpsAI 层——“AI for the Trades”——是一项有意义的技术押注。2026 年 5 月，OpsAI 接入 Projects 文档控制，这是除排班和笔记润色自动化之外，最具体的产品内 AI
              证据。不过，AI 模型栈不透明：如果 BuildOps 只是通用 LLM 加提示词工程的包装，而不是用自有承包商数据微调的模型，竞争对手可能很快追上。新任 CTO Markovich 来自 Apollo.io 和
              Dropbox，具备基础设施规模化经验，但没有公开记录显示其在商业承包 AI 领域有深度积累。


              第三方评论提到 4–6 个月实施周期，以及会计集成不一致（Capterra 提到 QB 同步问题；GetApp 集成子评分为
              3.1/5），是来自一线的最具体技术风险信号。漫长实施窗口会放大运营中断风险，尤其是承包商在迁移期间还依赖排班和开票连续性。买家在承诺前，应独立验证集成稳定性，并向使用同一 ERP 的承包商索要客户参考。
            claimRefs:
