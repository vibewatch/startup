  - id: FU001
    title: 客户旅程地图
    type: journey-map
    layout: wide
    summary: >-
      公开资料显示，BuildOps
      客户旅程从承包商的痛点开始：系统割裂、劳动力紧张、账单延迟；随后与传统单点工具比选，再进入派工、开票、作业成本和服务流程部署，最后扩展到经常性工作、支付、伙伴主导实施和按角色培训。最大的摩擦点是实施质量、配置深度，以及办公室用户是否足够熟练、愿意每天信任系统。BuildOps
      从派工走向服务协议、支付和消防安全检查流程等垂直集成时，扩张证据最明显。
    approximationNotes: 各阶段根据公开客户故事、评论投诉和 BuildOps 赋能材料推断。官方未披露转化率或平均销售周期。
    data:
      nodes:
        - id: pain
          label: 痛点 / 触发
          detail: 系统割裂、账单延迟、用工短缺、合规负担或后台团队倦怠，推动承包商重新评估软件
        - id: evaluation
          label: 评估
          detail: 业主、总经理和项目负责人拿 BuildOps 与传统单点工具对比，重点看报价、排程和开票流程是否贴合
        - id: deployment
          label: 上线 / 部署
          detail: 团队落地派工、排程、作业跟踪、开票和会计集成；上线阶段支持质量很关键
        - id: daily-use
          label: 日常运营使用
          detail: 调度员、协调员、办公室经理和现场团队依赖排程、开票、服务协议和作业成本流程
        - id: expand
          label: 扩展 / 续约
