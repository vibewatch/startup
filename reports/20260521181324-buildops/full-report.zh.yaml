  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: >-
      公开证据勾出一个漏斗：广泛的承包商痛点拉出需求，其中一部分承包商成为具名客户或评论样本，更小一部分披露详细生产结果。漏斗足以证明采用，但在续约和分群转化披露上偏弱。换句话说，BuildOps
      显然有真实装机基础和可复制证明故事，但公开记录只露出了部署漏斗的最上层。
