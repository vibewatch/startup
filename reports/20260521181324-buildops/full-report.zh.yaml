            body: >-
              BuildOps 的公开收入模式看起来像报价驱动的垂直 SaaS，但只有部分技术栈能被直接看见。独立软件目录一致显示，BuildOps 不公布标价，而是把买方导向定制报价；Software Advice
              是最明确把该产品称为月度订阅方案的来源。官方产品页随后展示了围绕核心订阅的变现面：开票、报表、服务协议和 Payments+
              都围绕更快计费、经常性工作管理、客户盈利能力可见性和集成收款展开。最强的收入端数据点仍来自第三方，而不是公司申报：GetLatka 估计 2025 收入为 $97.4M，高于 2024 的 $51.9M，意味着约
              87.7% 增长。这个估计有方向性价值，但不足以单独作为承销基础，因为同一档案还包含一个内部矛盾说法：BuildOps 在 2022 达到 $1B 估值，这与 March 2025 Series C
              报道冲突。归纳来看，公开证据支持公司已有真实规模和连贯收入架构，但不支持经审计收入基数或已披露收入结构。
