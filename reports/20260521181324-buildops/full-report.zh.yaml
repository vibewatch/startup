      - number: '2.4'
        title: 增长驱动因素
        blocks:
          - type: paragraph
            body: >-
              几股结构性和周期性力量正在加速商业承包商软件采用，影响延续到 2026 及之后。联邦基础设施投资是最直接催化剂：Infrastructure Investment and Jobs Act（IIJA）、CHIPS
              Act 和 Inflation Reduction Act 合计向施工和 MEP 承包商需求注入大量资金。仅 IIJA 已支出约 $177.5B，仍有 $431.8B 可在 September 2026
              前动用。由 AI 计算需求和电气化驱动的数据中心建设跑赢更广泛商业市场，并要求 HVAC、电气、机械等工种进行复杂 MEP 协同。IRA 为节能 HVAC 系统提供每次安装最高 $2,000
              的税收抵免，推动商业升级需求。

              劳动力短缺是最持久的驱动因素。Associated General Contractors 报告称，有空缺岗位的公司中，83% 表示招聘难度与一年前相同或更高；Trimble 对 1,800
              家承包商的调查估计，2026 全行业招聘缺口约为 500,000 名工人。BuildOps 自己在 August 2025 对 606
              家承包商的调查发现，近一半承包商有超过五分之一岗位空缺。当劳动力成为硬约束时，能让每名技师在不增加人手的情况下处理更多派工、计费和行政工作的软件，就有清晰的 ROI 论证。

              工种领域的私募股权整合正在创造一类新的企业买方。整合专业承包商的 PE 平台需要一条共同技术主干，支撑财务报告、合规和跨地点派工。Service Logic 是美国最大的私营 HVAC 和机械服务网络，2024
              收入超过 $2B，100+ 个地点使用 BuildOps，说明企业级多地点采用模式已经出现。BuildOps Series C 公告把 PE 支持承包商的兴趣列为重要需求驱动。按 Current
              Capital，MEP 领域 M&A 活动到 early 2026 仍保持高位，私募股权平台是主导收购方类型。

              AI 采用动能真实存在，但不均衡：BuildOps 调查中，78% 商业承包商表示已在使用或测试 AI 工具——这个数字放在三年前会显得难以置信。ServiceTitan 2026 Commercial
              Specialty Contractor Industry Report 也确认，38% 承包商现在报告 AI 对业务产生可衡量影响，高于 2025 的 17%。
