      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              商业承包商软件采购至少涉及三类角色：买方（决策者）、用户（日常操作者）和付款方（经济所有者）。在小型和中端承包商（收入低于 $50M）中，这些角色往往合并到业主 /
              总裁身上：同一个人批准采购、使用或监督使用，并承担成本。在更大型组织里，尤其是 PE 支持的平台和全国性服务公司，角色会分离：IT 总监或 COO 推动供应商评估，派工员和项目经理是日常用户，CFO 或 PE
              运营团队控制预算。

              BuildOps 识别的关键买方板块包括：（1）大型多工种专业承包商（收入 >$50M），企业能力、API 架构和 PE
              报告集成是采购标准；（2）中端服务承包商（$5M–$50M），派工、开票和劳动生产率是核心价值驱动；（3）PE 支持的承包商平台，通过收购扩张，需要共享技术栈；（4）全国性 FM 服务公司，需要跨分散现场运营的
              SLA 合规报告。最小型独立承包商（收入 <$5M）是风险板块——数量多但 ACV 低，流失概率更高。

              承包商板块的预算所有权，小企业主要由业主驱动，技术投资通常被视为运营开销，而不是资本支出。更大型且有 PE 支持的公司，软件投资可被纳入投资组合提升计划的运营改善资本开支。采用触发点因板块显著不同：规模压力和
              PE 审计要求推动企业采用；劳动力短缺和发票周期提速推动中端市场采用；竞争性投标压力推动小承包商采用 AI 赋能估算工具。Meritech Capital
              的投资逻辑明确提到，BuildOps「高度可配置」的平台可按承包商工作流定制，是跨这些板块的关键差异点。
            claimRefs:
              - CM025
              - CM026
              - CM030
              - CM035
              - CM037
