  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与细分构成
        blocks:
          - type: paragraph
            body: >-
              BuildOps 明确卖给商业专业承包商，而不是横向 SMB 受众。公开可确认下限是截至 2025 年 3 月已有 1,000+ 家商业承包商客户；具名 logo 覆盖美国和加拿大的
              HVAC、管道、电气、制冷、消防与生命安全、低压以及多工种企业运营商。公开案例也显示客户规模跨度很大：Hubbard Mechanical 是 13 人本地门店，Jackson Mechanical 运营 63
              辆服务卡车，J.H. Kelly 是拥有 1,200+ 名员工的专业承包商。这个广度很重要，因为它说明 BuildOps 并不限于单一工种或单一承包商规模带。


              公开记录没有提供干净且经审计的 2026 年客户数、队列拆分，或买方 / 用户 / 付费方拆分。当前买方环境的最佳代理来自 BuildOps 的承包商调研：600
              多家承包商提到竞争、劳动力短缺和复杂度上升，正在迫使技术升级。这个背景支持一个判断：BuildOps
              赢得客户，是因为它解决了派工、计费、工单成本核算和合规负担较重的服务工作中的运营痛点；但这不能替代客户台账、收入规模分布或按细分市场披露的 ARR。
