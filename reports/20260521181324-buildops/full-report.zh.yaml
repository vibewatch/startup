      - number: '5.3'
        title: OpsAI 与 AI 能力
        blocks:
          - type: paragraph
            body: >-
              OpsAI 是 BuildOps 内嵌的人工智能层，最早于 2023 年以 “AI for the Trades” 品牌推出。BuildOps
              称它针对商业承包工作流训练，覆盖派工、服务计费和项目利润率；但底层模型架构、训练数据构成，以及是否使用第三方 AI 供应商，均未公开披露。2026 年 4 月产品更新——记录在 BuildOps
              月度产品网络研讨会落地页中——重点是 OpsAI 与文档控制的集成，包括在新 Projects 模块的 RFI 和送审件流程中标记停滞审批和缺失支撑材料。


              按公司披露，OpsAI 目前可自动处理的任务包括：润色现场技师笔记以减少报告错误；为多语言团队翻译文本；扫描发票和设备资产以抓取数据；向现场技师提供实时故障排查帮助；自动生成派工建议。平台还提供 AI
              辅助报价和自动排班。BuildOps 把 OpsAI 定位为嵌入所有工作流步骤，而不是一个独立 AI 附加件。


              BuildOps CEO Alok Chanani 在公司 C 轮融资时由 AIM Media House 发布的一篇文章中表示，“承包商值得拥有更好的软件”，并把 OpsAI
              定位为通过任务自动化和洞察提取，帮助承包商提高生产率、扩大业务、优化人力配置。新任 CPO Will Lehrmann（此前来自 Procore）和新任 CTO Dzmitry Markovich（此前来自
              Apollo.io 和 Dropbox）显示管理层要加深 AI 基础设施。不过，驱动 OpsAI 的具体 AI 模型、训练评估基准和数据治理实践尚未获得外部验证；对把 AI
              嵌入关键承包商工作流的采购方来说，这是一个实质缺口。
            claimRefs:
              - CE024
              - CE025
              - CE026
              - CE027
              - CE028
              - CE029
              - CE030
      - number: '5.4'
        title: 移动端与现场体验
        blocks:
          - type: paragraph
            body: >-
              BuildOps 提供 iOS 和 Android 原生移动应用，可在 Apple App Store（id: 1402547789）和 Google
              Play（com.buildops.mobile）获取。技师应用让现场团队访问工单详情、拍摄照片和视频、填写自定义数字表单、记录电子签名，并把数据实时同步回派工看板。平台支持测量和设备清单任务的离线数据采集，缓解商业施工环境常见的连接缺口。


              AI 辅助现场笔记生成已嵌入移动应用：技师口述或输入粗略笔记，OpsAI 会把它们润色成更专业、更完整的格式。该能力的营销口径是缩短发票结案时间、提高首次即准确的计费准确性。AI
              也支持用摄像头扫描资产，减少设备建档中的人工数据录入。


              独立评价平台呈现的移动端体验较为混合。Capterra 评论者（截至 2026 年 5 月共有 149 条已验证评论）给工单管理打出 4.5/5，给排班打出
              4.3/5，反映核心服务工作流获得广泛认可。不过，多位评论者称移动界面“点击负担重”，完成一次服务工单需要很多导航步骤。FieldEx 2026 年评测（由竞争对手撰写）给移动端体验打出
              2.5/5，指出菜单“过于复杂”，并偶发离线同步问题。GetApp 的 9 名受访者会计集成子评分为 3.1/5，低于平台整体 4.4/5 的平均分。这些信号表明，服务管理工作流口碑较好，但移动端 UX
              和集成边缘案例，会给从更简单工具迁移的承包商带来执行风险。
            claimRefs:
              - CE031
              - CE032
              - CE033
              - CE034
              - CE035
              - CE036
              - CE037
      - number: '5.5'
        title: 信任、安全与合规
        blocks:
          - type: paragraph
            body: >-
              BuildOps 发布的隐私政策最后更新时间为 2025 年 8 月 15 日。该政策描述了数据收集范围，包括 GPS
              位置数据、工单记录、客户联系信息和财务数据。政策称“您提供给我们的所有信息都存储在防火墙后的第三方安全服务器上”，但没有点名云供应商，也没有认证具体安全控制。政策明确禁止为了营销目的与第三方或关联方共享移动消息订阅数据；对一个处理技师和客户通信数据的平台而言，这一点值得注意。


              BuildOps 在 trust.buildops.com 运营 Trust Center，并在 buildops.com/security/ 设有安全页面。本次审阅期间，这两个页面面向公众的 HTML
              几乎没有实质内容——二者都高度依赖 JavaScript 渲染，未认证访问者能看到的可审计信息很少。截至 2026 年 5 月，未从任何可公开访问来源确认 SOC 2 Type I 或 Type II
              报告、ISO 27001 证书，或同等第三方安全审计。公开安全认证缺失，对必须审查软件供应链的企业级商业承包商，以及 BuildOps 实例中保存敏感 GPS 位置、财务和客户数据的多站点承包商来说，是实质缺口。


              在公开产品页面或服务条款中，未发现 SLA、正常运行时间保证，或公开的事故响应时间表。status.buildops.com 页面存在，但公开内容很少。这些缺口让运营可靠性变得不透明，潜在买家应在尽调中处理。
