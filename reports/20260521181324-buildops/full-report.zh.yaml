              AE、存量客户增购销售、实施经理、数据架构师和报价到收款运营。Raleigh 扩张公告又新增 291 个计划岗位，平均薪资超过 $100k，进一步说明 Series C
              资本正在转化为员工数和执行能力，而不是近期利润率收割。管理层在 Reuters 中明确承认这一取舍：盈利不是核心重点，公司仍在大力投入 R&D、产品、市场触达和客户获取。因此 $127M Series C
