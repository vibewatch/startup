      - number: '2.2'
        title: 市场规模测算：TAM、SAM 与相邻软件市场
        blocks:
          - type: paragraph
            body: >-
              BuildOps 位于分析师跟踪的三类软件市场交叉处：现场服务管理（FSM）、施工管理软件（CMS）和设施管理（FM）软件。没有任何分析师发布过北美仅限商业承包商 FSM 的离散 SAM
              估计；下列数字必须当作天花板估计，之后还要从中拆出相关子细分。

              全球 FSM 软件市场是最直接被引用的参照。Mordor Intelligence 估计 2025 市场规模为 $5.66B，到 2031 增至 $9.87B，CAGR 为 9.54%。Global Market
              Insights 发布的 2025 基准略低，为 $5.49B，但 CAGR 更激进，达 16%，到 2035 规模为 $23.61B。MarketsandMarkets 估计 2025 FSM 为
              $5.10B，到 2030 增至 $9.17B，CAGR 为 12.5%。The Business Research Company 将 2025 数字定为 $5.12B，并预测到 2030 以 14.4%
              CAGR 增至 $10.09B。2025 年 $5.1B 到 $5.7B、CAGR 9.5% 到 16% 的区间差异，反映的是方法论差别，而不是事实冲突；四家都使用自有估算框架。

              按 Mordor 口径，北美约占全球 FSM 收入 37.89%，对应 2025 北美 FSM 市场约 $2.1–$2.2B。但 FSM 作为品类还包括公用事业、电信、制造、医疗等垂直行业，它们与
              BuildOps 的商业承包商焦点没有重叠。施工和房地产应用垂直只占全球 FSM 收入的一小部分，意味着归属于美国商业承包商软件的部分显著小于 $2B。BuildOps 自己的融资材料称市场是「$300B+
              行业」，指的是美国商业承包总支出，而不是软件 TAM；因此它与分析师 FSM 估计直接比较，在方法论上不一致。

              相邻市场提供额外背景。全球施工管理软件市场在 2025 估值 $7.5B（Future Market Insights），商业建筑占部署量 57.8%；该市场包含 Procore、Autodesk
              等项目控制软件，与 BuildOps 的服务工作流模块只有部分竞争。全球设施管理软件市场由 Mordor Intelligence 估计 2025 为 $2.65B（商业板块占收入 35.80%），Grand
              View Research 则估计为 $3.79B，口径涵盖更广的 IWMS/CAFM 平台。全球管道、供暖和空调承包商市场在 2025 估计为 $1.66T（Research and
              Markets），但它衡量的是承包商收入，不是软件支出；仅美国商业 HVAC 板块年承包商收入估计为 $156B，其中商业工作约占 30%。按 Current Capital，北美 MEP 承包商板块 2026
              汇总收入超过 $698B。
