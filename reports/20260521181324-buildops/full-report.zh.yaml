      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              BuildOps 由三位合伙人于 2018 联合创立。Alok Chanani（CEO）是美国陆军退伍军人，曾以上尉身份在 Iraq 服役，并因出色战斗服役获得 Meritorious Service
              Medal。退役后，他在 Southern California 搭建商业地产和建筑业务（USA Commercial），亲眼看到承包商技术缺口，后来成为 BuildOps 的创业触发点。他拥有 The
              Wharton School MBA 和 Cornell University 经济学 BA，并入选 Los Angeles Business Journal 2026 LA500（该市 500
              位最具影响力高管）。Steve Chew（联合创始人、初任 COO）此前任职 Microsoft、Nextag 和 Fundly，为公司带来企业软件经验。Neeraj Mittal（创始 CTO）曾任
              ServiceTitan 工程总监；TechCrunch 确认，截至 March 2025，Mittal 已不在公司。考虑到其早期工程影响力，这是实质性的关键人风险。


              现任高管团队明显在补企业 SaaS 经验。John Laino 在 BuildOps 任职近两年后于 November 2024 晋升 COO，此前曾在
              ServiceTitan、ZipRecruiter、Salesforce 和 Accenture 任职。Greg Gillis 于 December 2025 加入担任 CRO，此前曾把 Coupa
              Software 从约 $300 million 收入扩到超过 $1 billion。Colin Piper 于 2025 出任公司首位 CMO，拥有 15 年建筑软件营销经验，包括 Autodesk AECO
              事业部高级岗位。Dzmitry Markovich 于 May 2026 被任命为 CTO，来自 Apollo.io（曾任工程高级副总裁）和 Dropbox（在 2018 IPO 期间任工程副总裁）；他自
              2023 起担任 BuildOps 顾问委员会成员。Will Lehrmann 担任首席产品官，此前长期在 Procore 任职。董事会席位包括 Paul Madera（Meritech Capital，随
              Series C 加入）、Dick Costolo（01 Advisors，随 Series B 加入）和 Matthew Cowan（Next47，随 Series A 加入）。
