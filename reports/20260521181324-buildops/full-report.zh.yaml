      - number: '7.4'
        title: 伙伴、财务与融资风险
        blocks:
          - type: paragraph
            body: >
              SE Ventures 是 Schneider Electric 旗下 €1 billion 规模的风险投资部门，参与了 BuildOps 的 $127M C 轮，同行投资方包括领投方 Meritech
              Capital Partners 和 BOND Capital。SE Ventures 公开披露，其投资组合中超过 60% 涉及与 Schneider Electric
              全球客户基础的商业合作。这形成双重依赖：BuildOps 可能受益于 Schneider Electric 工业客户网络的潜在渠道，但这一通道取决于 SE Ventures 与 Schneider
              Electric 企业优先事项之间持续的战略一致；而这些优先事项可能因领导层变动、Schneider 自身 M&A 或其投资组合中碳科技优先级重排而变化。

              财务风险轮廓不透明。BuildOps CEO Alok Chanani 在 2025 年 3 月 Reuters 采访中明确表示，“盈利目前不是业务的核心重点”，确认公司仍在净亏损。公司没有公开披露
              ARR、毛利率、烧钱速度或净收入留存。公司目标是收入同比增长 100%，这意味着需要消耗大量资本来扩张销售团队、研发和客户成功规模。更广泛的建筑行业正在收缩（Atradius 称 2026 年非住宅下降
              -2.2%），关税处于一代人以来高位，需求侧放缓可能在公司最依赖新 logo 增长时压缩增长。

              宏观风险具有行业特异性。AGC 的 2026 Hiring and Business Outlook 报告称，衰退担忧和关税驱动的材料成本通胀让承包商预期“转弱”。Deloitte 的 2026 E&C
              Outlook 记录，2025 年 8 月项目放弃量同比增加 88.2%。如果商业承包商减少员工或推迟软件投资，BuildOps 的 ARR 增长可能停滞，而成本无法按比例下降，从而加剧烧钱。如果资本市场收紧，或
              SaaS 倍数重估压缩未来融资或 IPO 的估值基础，潜在融资缺口就会显现。
