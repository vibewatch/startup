      - number: '2.6'
        title: 规模测算尽调缺口与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              最重要的尽调缺口，是没有任何独立发布的北美商业承包商专属 FSM 软件 SAM 估计。现有分析师数字覆盖的都是广义
              FSM（公用事业、电信、制造、医疗）或广义施工管理软件；没有分析师把专为商业承包商打造的子垂直单独拆出。全球 FSM 分析师区间（2025 为 $5.1B–$5.7B）与 CAGR
              区间（9.5%–16%）本身就很大——分歧来自方法论，较低 CAGR 反映公用事业 / 电信饱和拖累，较高估计反映 AI 注入后的扩张情景。两者都没有直接回答 BuildOps 的可服务机会。

              BuildOps 自己的「$300B+ 行业」表述把承包商总收入和软件 TAM 混在一起。即便按 $300B 的 1% 软件支出率计算，也意味着 $3B 软件市场——考虑到大多数小承包商在 FSM
              软件上的支出远低于收入 1%，这一假设可能偏乐观。承包商收入市场（全球 HVAC/管道 $1.66T；美国 MEP $698B）进一步说明收入基数巨大，但实际软件钱包份额仍很小，也没有公开基准。

              采用层也存在相互矛盾的信号：BuildOps 自己对 606 家承包商的调查显示，78% 已使用或测试 AI；RICS 对 2,200+ 名专业人士的全球调查则显示，45% 没有 AI
              实施。这些数字不一定冲突——BuildOps 调查捕捉的是会接触 BuildOps 内容的自选择承包商群体，RICS
              捕捉的是更广泛全球样本——但差距凸显了把任何单一采用指标映射到全市场渗透率的难度。投资者应把两个数据点都视为方向性，而不是人口普查式精确。

              还需要进一步尽调，专门测算 PE 支持的多地点承包商板块；这个群体可能贡献 BuildOps 企业 ACV 的不成比例份额，并且不同于分散的小承包商基数。Current Capital 的 MEP M&A
              报告（March 2026）提供了平台交易活动窗口，但未发布软件支出数据。
            claimRefs:
              - CM019
              - CM038
              - CM039
              - CM040
              - CM041
              - CM042
      - number: '2.7'
        title: 图表
        blocks:
          - type: callout
            title: 多重需求驱动叠加结构性顺风
            body: >-
              商业承包商市场同时享受联邦基础设施支出、数据中心建设、劳动力稀缺和 PE 整合等需求顺风，合力让软件替换周期比历史基线更有吸引力。BuildOps 尤其适合抓住 PE
              平台群体；在这一群体中，企业报告要求会强力拉动统一商业承包商操作系统。
            calloutType: strength
            claimRefs:
              - CM021
              - CM022
              - CM023
              - CM026
          - type: callout
            title: SAM 不透明：没有商业承包商专属规模测算
            body: >-
              缺少任何分析师发布的北美商业承包商 FSM SAM，使 BuildOps 估值仍由「$300B 行业」支撑；这个数字衡量的是承包商收入，不是软件钱包。投资者必须从第一性原理三角测算实际软件 SAM（承包商数量 ×
              平均 ACV × 目标渗透率），不同假设会得到 $0.3B 到 $1.5B 的估计，区间相差 5×，对估值影响重大。
            calloutType: risk
            claimRefs:
              - CM019
              - CM039
              - CM040
              - CM041
          - type: callout
            title: AI 数据质量障碍拖慢平台差异化兑现
            body: >-
              BuildOps 的 AI 差异化（预测性排班、AI 派工、投标智能）只有在承包商数据干净且结构化时才能兑现。只有 26% 承包商认为自身数据质量高，全球还有 45% 报告没有 AI 实施，这意味着向装机客户增售
              AI 功能的时间线比需求信号暗示的更长。它压制近期 NRR 扩张，并提高无法取得 AI ROI 客户的流失风险。
            calloutType: risk
