  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争边界与板块地图
        blocks:
          - type: paragraph
            body: >-
              BuildOps 并不在一个无差别的「现场服务软件」大桶里竞争。证据指向至少五类不同竞争者：试图同时跑服务和项目的商业 MEP
              混合平台；在检查和客户举证上表现突出的合规导向商业服务工具；针对技师销售和住宅服务工作流优化的住宅或混合门店系统；以项目为中心的分包商和施工 ERP 套件；以及通过更广 CRM 或 ERP 体系进入的横向企业
              FSM 产品。这个划分很重要，因为买方不只是在选功能，也是在选运营模型。商业承包商需要在一套商业专属栈中同时管理派工、预防性维护合同、资产历史、作业成本和项目协同，BuildOps
              在这种场景下暴露最直接。一旦客户转而优先考虑门户、重库存或 ERP 控制、住宅销售打法，或既有企业平台足迹，竞争集合就会发生实质变化。
