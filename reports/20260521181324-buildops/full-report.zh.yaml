      - number: '1.5'
        title: 风险与反向信号
        blocks:
          - type: paragraph
            body: >-
              来自独立来源的反向与风险信号有几类。产品层面，SoftwareFinder
              用户评价中有一条一星评论，称售后功能与销售演示承诺存在重大差异：「不要相信销售说辞。我们付钱后，他们突然告诉我们，之前承诺的一些功能其实做不了。」同一评论者称客服和技术支持「完全不存在」。Capterra 和
              SoftwareAdvice 的其他用户投诉还指向学习曲线陡、报表定制有限、采购订单流程繁琐，以及难以在多个客户之间复用物业记录——这些 UX 摩擦可能压制小型组织采用。


              管理层层面，联合创始人兼创始 CTO Neeraj Mittal 在 Series C 前离职，是实质性的关键人问题；他曾按 ServiceTitan 标准负责原始平台架构。公司在 May 2026 用外部招聘的
              CTO（Dzmitry Markovich）接替他，中间约两年没有常任 CTO。BuildOps 也尚未盈利，快速扩员带来执行风险。毛利率、NRR
              和流失率均未公开披露，无法完成完整财务尽调。ServiceTitan 是更成熟的平台，估值 $9.5 billion、ARR $551 million，它对 BuildOps 的商业承包商定位构成持久竞争风险。
