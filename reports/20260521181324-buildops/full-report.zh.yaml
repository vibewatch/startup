  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 战略与竞争风险
        blocks:
          - type: paragraph
            body: >
              BuildOps 所处的现场服务管理（FSM）市场资本充足、集中度越来越高；其主要对手 ServiceTitan 已是 NASDAQ 上市公司（ticker: TTAN），拥有约 $961M 年收入、3,414
              名员工和 16 项已授权美国专利。ServiceTitan 截至 2026 年 1 月 31 日财年的 10-K，在竞争风险披露中把 BuildOps 与 Salesforce、SAP、Workwave
              并列点名——这说明这家既有 FSM 龙头认为 BuildOps 是需要投入资本压制的实质威胁。ServiceTitan 持续推进的“商业业务野心”扩张，正面侵入 BuildOps 在商业
              HVAC、电气和机械承包商中的核心可服务市场，随着时间推移压缩 BuildOps 的差异化窗口。

              价格对等已经出现：BuildOps 约为 $299/用户/月，ServiceTitan 约为 $250/技师/月。ITQlick 的 2026 年分析按用户情绪和功能广度综合评分，给 ServiceTitan
              97/100，给 BuildOps 82/100。虽然 BuildOps 提供更多被评估功能（12 项 vs. 7 项），但 ServiceTitan
              更宽的集成生态——覆盖营销自动化、薪资集成（GreenSky、Mailchimp、Angi、Zapier）和高级 CRM——对寻找一站式平台的承包商构成持续的产品表面积优势。Procore、Autodesk 和
              Salesforce Field Service 进入相邻工作流，也威胁 BuildOps 在大型企业账户中的扩张空间。

              BuildOps 仍是私有公司，累计融资约 $250M，估值 $1B，因此市场整合风险被放大。如果 ServiceTitan 或另一家资本充足的既有厂商收购一个面向 SMB
              的竞争平台，并激进打包销售，BuildOps 的获客成本可能明显飙升。承包商 TAM 分散，由数千家收入低于 $50M
              的企业构成，这意味着没有单一客户会推翻投资逻辑，但也意味着没有锚定账户能提供可防守的留存确定性。
