        - 不同退出估值下的实际投资者经济性；决定各情景下的有效入场倍数
        - 法律尽调；CFO 提供股权结构表摘要；Series C 投资条款清单审阅
      - - 客户集中度
        - 前 10 大客户 ARR 占比；最大单一客户敞口占总 ARR 的百分比
        - 留存风险评估；单客户集中度超过 15% 会显著提高流失敏感性
        - 销售数据；客户成功团队；客户队列分析报告
    notes: 尽调清单来自公开记录中识别出的证据缺口。每一项都会卡住 $1B 入场溢价估值的承销。优先顺序：经审计 ARR，其次是 NRR 和毛利率，再到烧钱速度和股权结构表。出资前，应在正式数据室解决全部六项。
    claimRefs:
      - CV030
      - CV031
      - CV040
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: BuildOps 从 2018 年创立到 2026 年 5 月的关键节点，覆盖融资事件、产品发布、ARR 增长和领导层变化。
    data:
      items:
        - label: 成立
          date: '2018'
          detail: Alok Chanani、Steve Chew、Neeraj Mittal 在洛杉矶联合创立 BuildOps，服务商业专业承包商。
          tone: positive
        - label: 种子轮（约 $5.8M）
          date: '2019'
          detail: 首笔机构资本用于平台开发，目标客户为商业 HVAC、管道和电气承包商。
          tone: positive
        - label: 平台发布
          date: '2020'
          detail: 商业平台发布；开始产生收入。首年 ARR 超过七位数。
          tone: positive
        - label: Series A 轮 – $43M（Next47 领投）
          date: 2022-05
          detail: Next47、Founders Fund、StepStone、Fika、MetaProp 加入。ARR：$16.4M。连续三位数增长确立。
          tone: positive
        - label: Series B 轮 – $50M（Fika/01A 联合领投）
          date: 2023-05
          detail: Dick Costolo（01 Advisors）加入董事会。累计融资超过 $100M。ARR：$24.6M。IPO 路径开始明确。
          tone: positive
        - label: COO 任命 – John Laino
          date: 2024-11
          detail: John Laino 晋升 COO。ARR $51.9M。面向企业推进的 GTM 组织得到加强。
          tone: neutral
        - label: Series C 轮 – $127M，独角兽（$1B）
          date: 2025-03
          detail: Meritech 以 $1B 估值领投。BOND Capital 和 SE Ventures 加入。客户 1,000+。员工 375 人。
          tone: positive
        - label: Neeraj Mittal 离任确认
          date: 2025-03
          detail: TechCrunch Series C 文章确认创始 CTO 已不在公司。CTO 职位空缺。
          tone: adverse
        - label: ARR $97.4M；GTM 领导层补齐
          date: 2025-06 to 2025-12
          detail: ARR 近乎翻倍。Greg Gillis（CRO，Coupa 前员工）和 Colin Piper（CMO，Autodesk 前员工）加入。
          tone: positive
        - label: CTO 任命 – Dzmitry Markovich；1,500+ 客户
          date: 2026-05
          detail: Markovich（Apollo.io、Dropbox）获任 CTO，补上约 2 年空缺。北美客户数超过 1,500。
          tone: positive
    approximationNotes: 收入里程碑日期反映 GetLatka 数据采集日期，而非财政期间结束日。具体 ARR 数字为第三方估算，未经审计。
