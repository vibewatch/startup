      - number: '8.4'
        title: 反向分析、Down Round 风险与投资逻辑失效触发器
        blocks:
          - type: paragraph
            body: >-
              核心反向风险在于，BuildOps 约 10.3x 的隐含 EV/revenue 倍数高于上市可比公司区间，并处在垂直 SaaS 溢价带高端，却无法由外部验证。SaaS Capital 2025 年股权融资公司
              5.3x ARR 中位数适用于指标已披露的公司；NRR 低于 100% 或增长低于 30% 的公司吸引的倍数会明显更低。如果 BuildOps 未披露的 NRR 低于 100%，或毛利率低于
              60%——考虑到重实施、服务和人员投入姿态，这两者都有可能——合理倍数会重新锚定在 4–6x，意味着下一轮融资出现 down round。GetLatka 的 $97.4M
              收入估计存在实质不确定性：同一资料还出现内部不一致，把 BuildOps 的 $1B 估值提前到 2022 年，和 2025 年 3 月 C 轮报道冲突，削弱了数据质量。Acquiry 的 2026 SaaS
              估值框架把 NRR 定为最重要的单一倍数驱动因素——120% NRR 企业的倍数比 100% NRR 同行高 30–50%——而 BuildOps 的三个关键驱动因素（NRR、CAC
              回本周期、毛利率）均未验证。Crunchbase 的 2026 SaaS IPO 分析明确偏反向：截至 2026 年 5 月，没有风投支持的 SaaS 独角兽提交新 IPO，SaaS 股票受到 AI
              颠覆担忧压制，ServiceTitan 自身也较 IPO 高点下跌约 48%，尽管分析师共识为 Moderate Buy。这解释了为什么 IPO 不太可能成为近期退出，并提高了对战略 M&A
              的依赖。管理层明确降低盈利优先级，再加上 Raleigh 计划新增 291 个平均薪资 $100k+ 的岗位，意味着 C 轮资金将继续被高强度消耗。2021 年周期独角兽从 15–25x 重置到 4–8x
              down round 的先例仍然重要，即使 BuildOps 的 2025 年融资发生在最初修正周期之后。
            claimRefs:
              - CV024
              - CV025
              - CV029
              - CV030
              - CV031
              - CV032
