      - number: '8.3'
        title: 乐观、基准与悲观估值情景
        blocks:
          - type: paragraph
            body: >-
              三个情景框定 $1B C 轮入场的回报分布。乐观情景下，BuildOps 到 2026 年维持 80%+ ARR 增长，到 2027 年底达到 $200M+ ARR，NRR 高于 115%，GAAP 毛利率高于
              70%，并验证 AI 产品差异化是持久护城河。按 7–9x ARR，2027 年隐含估值为 $1.4–1.8B；在未来轮次稀释前，相对 $1B 入场对应 1.4–1.8x 毛回报。基准情景下，增长放缓至
              40–60% YoY，2027 年 ARR 达到 $130–160M，NRR 位于 100–110% 区间，毛利率 60–70%。按 6–7x ARR，基准情景把 BuildOps 估在
              $780M–$1.1B，持平到小幅为正，取决于执行和 M&A 市场条件。悲观情景在增长低于 40% YoY 且自然退出窗口前需要资本时触发；按 $100–120M ARR 上 4–5x，隐含价值为
              $400–600M，显著低于 $1B 入场并构成实质 down round。2026 年建筑科技 M&A 仍活跃，Autodesk、Trimble 和 PE
              机构都在积极收购垂直平台，使战略收购成为乐观和基准情景最现实的退出路径。2026 年 SaaS IPO 环境并不友好——Crunchbase 确认截至 2026 年 5 月没有风投支持的 SaaS 独角兽提交新
              IPO——因此 M&A 是主要的已实现流动性机制。所有情景估值都必然依赖估计，因为 BuildOps 的实际 ARR、NRR 和利润率轮廓仍未披露。
            claimRefs:
              - CV041
              - CV042
              - CV043
              - CV025
              - CV033
