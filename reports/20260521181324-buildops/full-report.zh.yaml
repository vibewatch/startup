      - number: '8.5'
        title: 最终尽调问题与退出准备度
        blocks:
          - type: paragraph
            body: >-
              以 $1B 入场投入资本前，必须拿到六类证据。最关键的是：经审计的 ARR 和 GAAP 收入，附季度桥接表和收入确认方法——GetLatka 的 $97.4M
              估计有方向性参考价值，但不是投资级证据。第二：按软件订阅和专业服务拆分的 GAAP 毛利率——混合毛利率低于 65% 会把适用倍数重新锚定到 5–6x。第三：所有客户队列的净收入留存，这是 Acquiry
              2026 年分析认定的最重要 SaaS 估值驱动因素，也是支撑溢价倍数的主要杠杆。第四：C
              轮交割后的月度烧钱速度和账上现金，用来评估未来融资轮次的稀释风险。第五：股权结构表和清算瀑布，覆盖优先股堆叠、反稀释条款和期权池规模——这些目前均未披露。第六：前 10 大客户 ARR
              集中度，用来评估锚定客户流失时的平台留存风险。关于退出准备度：2026 年建筑科技 M&A 市场活跃，Autodesk、Trimble 和 PE roll-ups
              都在收购垂直平台；这创造了一条可信的战略退出路径，估值区间视财务质量落在 $500M–$1.5B。鉴于 2026 年 SaaS 公开市场不友好，IPO 路径可能性不高。最现实的 3–5 年退出是战略收购或
              secondary buyout；两者奖励的是已经证明的 NRR、毛利率和盈利路径，而不是原始增长率。
            claimRefs:
              - CV030
              - CV033
              - CV025
          - type: table
            tableRef: TV006
            claimRefs:
              - CV030
              - CV031
              - CV040
      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 缺乏收入质量验证的高溢价入场
            body: >-
              BuildOps 隐含 EV/revenue 倍数约为 10.3x——按 $1B 投后估值对比 GetLatka 未经审计的 $97.4M 2025 年估计计算——比 ServiceTitan 约 5.0x 和
              Procore 约 4.6x 的当前公开交易水平高 2–4x，也高于私有 SaaS 股权融资公司 5.3x ARR 中位数。NRR、毛利率和烧钱速度完全未披露。对一家隐含增长率 87.7%
              的公司来说，这一溢价并非天然无法辩护，但没有经审计财务就无法验证。当前证据基础不支持在入场时承销这个溢价水平；投资人应将其视为有条件持有，直到披露缺口解决。
            calloutType: risk
            claimRefs:
              - CV011
              - CV030
              - CV037
          - type: callout
            title: 明星投资人辛迪加提供机构背书信号
            body: >-
              Meritech Capital Partners 领投了 $127M Series C；其投资组合包括 Braze、Datadog、Facebook、Salesforce、Snowflake 和
              Tableau。BOND Capital 与 SE Ventures（Schneider Electric）作为新投资方加入。既有投资方包括 Founders Fund、Bessemer Venture
              Partners 和 B Capital。这个投资人组合质量很高，强烈说明 BuildOps 已在多个阶段通过机构级尽调，也为 $1B 估值提供了声誉锚；但评估入场价时，投资人质量不能替代
              NRR、毛利率和烧钱速度的披露。
            calloutType: strength
            claimRefs:
              - CV002
              - CV003
              - CV026
              - CV040
          - type: callout
            title: 观察：在承诺出资前监控执行并要求披露财务数据
            body: >-
              建议为观察。BuildOps 展现了很强的规模信号——独角兽地位、标杆客户采用、隐含 87.7% ARR 增长，以及高质量投资人组合——但财务数据仍未披露，无法支撑入场时约 10.3x 的隐含
              EV/revenue 倍数。优先动作：通过正式数据室获取经审计 ARR、毛利率、NRR 和烧钱速度；与管理层确认股权结构表和稀释情况；在接近当前入场价投入资本前，基于披露指标重新评估乐观 / 基准 / 悲观情景。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV030
              - CV041
              - CV042
              - CV043
          - type: callout
            title: GetLatka 收入估算有方向参考，但达不到投资级
            body: >-
              GetLatka 给出的 2025 年收入估算 $97.4M，是 BuildOps 最常被引用的收入锚点，但它是第三方估算，不是经审计数字。同一份 GetLatka 资料页还存在内部矛盾——早在 2022
              年就引用 $1B 估值——这与 2025 年 3 月 Series C 报道冲突，削弱了对底层数据的信心。基于 GetLatka 2024 年 $51.9M 得出的隐含同比增长 87.7%，方向上与
              BuildOps 的招聘活动一致，但无法从公开文件独立交叉验证。本章所有隐含倍数和情景分析都以该估算为前提；一旦取得经审计收入数据，应重新修订。
            calloutType: assumption
            claimRefs:
              - CV009
              - CV031
