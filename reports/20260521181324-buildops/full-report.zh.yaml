  - id: FM001
    title: 商业承包商软件：TAM / SAM / cSAM 规模金字塔
    type: pyramid
    layout: standard
    summary: 从全球 FSM+CMS+FMS 软件大盘上限，到估算的北美商业承包商专属可服务市场，共三层；底层由作者推导，没有直接分析师来源。
    data:
      items:
        - label: 全球 FSM + CMS + FM 软件 TAM（2025 合并口径）
          value: 15.9
          unit: $B (2025 estimates combined)
          note: FSM $5.66B（Mordor）+ CMS $7.5B（FMI）+ FM $2.65B（Mordor）；市场口径彼此重叠，不应相加；此处仅作上限
        - label: 北美 FSM + CMS 软件 SAM（2025 估算）
          value: 5.1
          unit: $B (2025 est.)
          note: FSM ~$2.1B（Mordor 北美份额 37.89%）+ CMS ~$2.85B（北美估算 38%）；商业建筑占 CMS 57.8%；仅是粗略代理
        - label: 商业承包商专业 SaaS cSAM（美国 + 加拿大，估算）
          value: 1
          unit: $B (2025 estimated, high uncertainty)
          note: 推导：~$2.1B 北美 FSM × ~30% 建筑垂直份额 × ~70% 商业 / 住宅拆分；没有分析师直接发布该数字
    approximationNotes: >-
      金字塔各层都有重大估算不确定性。顶层（$15.9B）把三个重叠市场口径相加，不应视为可加总规模。中层（$5.1B）将 Mordor 37.89% 的北美份额套用于 FSM，并假设 CMS
      份额相近。底层（$1.0B）由作者使用垂直份额和商业 / 住宅拆分假设推导；实际数字可能在 $0.4B 到 $2.0B 之间，取决于假设。
