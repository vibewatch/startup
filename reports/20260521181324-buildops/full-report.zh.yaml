      - number: '6.3'
        title: 扩张触点与工作流嵌入
        blocks:
          - type: paragraph
            body: >-
              即使没有披露 NRR，BuildOps 的扩张逻辑也能从产品和伙伴材料中看出来。初始部署之后，平台可以继续深入到周期性服务协议、客户特定定价、盈利能力分析、支付、车队、检查工作流和伙伴辅助实施。Service
              Agreements 和 Payments+ 尤其重要，因为它们把 BuildOps 推近承包商的收入引擎：周期性维护排班、发票生成、ACH
              和银行卡收款，以及客户级利润率可见性。排班位于技师分配和工作量规划的中心，增加了日常工作流粘性；Inspect Point 合作则展示了在消防与生命安全垂直领域扩张的路径，检查可以直接流入报价、排班和发票。


              客户成功内容也显示，BuildOps 投资的不只是产品广度，还有赋能。Academy 按角色设计、自主节奏学习，并明确面向派工员、服务协调员、办公室经理和项目管理员；Certified Partner
              Program 则显示公司试图把实施能力扩展到内部团队之外。反面是依赖：随着扩张进入更多关键任务工作流和伙伴主导部署，尽调应确认客户成功到底多大程度依赖外部实施质量，以及核心订阅之外的模块附加率贡献了多少。
