              公开可比公司显示了缺失项。Procore 目前交易约 4.9x EV/revenue，GAAP 毛利率 80%、总留存率 95%，全年自由现金流利润率指引 19%；ServiceTitan FY2026
              结果显示收入 $961M、净美元留存率超过 110%、non-GAAP 经营利润率 9.8%，市值 / 收入倍数约
