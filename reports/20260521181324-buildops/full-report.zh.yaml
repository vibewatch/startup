      - number: '6.4'
        title: 留存与满意度信号
        blocks:
          - type: paragraph
            body: >-
              BuildOps 的公开满意度信号足以支撑“真实使用”判断，但不足以承销留存。Software Advice 在访问日期显示 177 条结果，整体评分 4.4，客户支持评分 4.5，性价比评分
              4.3。评论语言也反复把 BuildOps 与发票、支付处理、派工、工单跟踪和跨部门可见性的整合联系起来。这一模式与具名案例研究一致，后者强调减少权宜流程、更快报价、更干净的排班和更强的工单成本核算。


              但纳入反向证据后，留存图景变得混合。Software Finder
              有一条一星投诉，称购买后承诺功能并不可用，且支持“完全不存在”。其他评论者仍提到成本高、学习曲线明显、报表限制、采购订单流程笨重和定制缺口。关键是，在本章保留的任何来源中，BuildOps
              都没有按细分市场披露实际 NRR、总留存率（GRR）、续约率或 logo 流失率。务实结论是：BuildOps
              的满意度似乎足以支持其在复杂承包商工作流中的扩张，但留存韧性仍应被视为开放尽调项，而不是已被公开证明的事实。
