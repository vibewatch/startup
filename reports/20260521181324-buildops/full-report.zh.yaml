      - number: '5.2'
        title: 平台架构与集成
        blocks:
          - type: paragraph
            body: >-
              BuildOps 是多租户云端 SaaS 产品。其底层基础设施供应商和技术栈并未公开披露。公司在 status.buildops.com 运营状态页，并在 buildops.com/security/
              设有安全页面，但本次审阅期间，这两个页面面向公众的 HTML 都没有暴露实质细节。Sage Intacct
              市场列表把产品范围写为客户管理、报价、服务协议、开票、排班、派工、项目管理和技师移动端应用，印证了官方产品页描述的模块广度。


              BuildOps 原生集成七套会计和 ERP 系统：QuickBooks Desktop、QuickBooks Online、Sage Intacct、Oracle NetSuite、Viewpoint
              Vista、Viewpoint Spectrum 和 Miter（HR / payroll）。每个系统的专属集成页都确认了双向数据同步架构：BuildOps
              捕获的现场数据（发票、工单、采购订单、工时记录）会自动推送到会计系统，省掉人工重复录入。Slashdot 软件目录还把 Data Xchange 和 hh2 Cloud Services 列为 BuildOps
              的集成选项，用于建筑行业薪资和项目数据同步。在本次审阅的公开产品披露中，七个具名 ERP / 会计系统组成的认证会计集成，是商业专业承包商细分市场里最宽的一组。


              BuildOps 通过 developer.buildops.com 的开发者中心提供 REST API 和 webhooks。开发者门户存在，但需要通过客户成功经理或集成经理邀请；未发现可公开访问的 API
              参考文档。BuildOps Certified Partner Program 于 2025–2026 年推出，把客户与经过筛选的实施伙伴连接起来，也为集成伙伴在平台上构建打开通道。Inspect Point
              这家消防与生命安全检查平台与 BuildOps 合作，打通技师检查工作流在两个系统之间的交接；2026 年一场联合营销网络研讨会把该集成定位为面向消防保护承包商。
