  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、融资背景与建议
        blocks:
          - type: paragraph
            body: >-
              BuildOps 于 2025 年 3 月 21 日完成 $127M C 轮融资，达到 $1B 投后估值并进入独角兽行列。本轮由 Meritech Capital Partners 领投——其投资组合包括
              Braze、Datadog、Facebook、Salesforce、Snowflake 和 Tableau——BOND Capital 与 Schneider Electric 的企业风险投资部门 SE
              Ventures 新进参与。既有投资人 Fika Ventures、Next47、StepStone Group 和 Titanium Ventures 继续跟投。此前支持者包括 Founders
              Fund、Bessemer Venture Partners、B Capital、MetaProp、137 Ventures 和 Liquid2。Tracxn 显示，公司各轮累计融资约
              $226M。Meritech 合伙人 Paul Madera 加入董事会，成员还包括前 Twitter CEO Dick Costolo、Fika 创始人 TX Zhuo、前 Boost Mobile CEO
              Stephen Stokols，以及 Next47 General Partner Matthew Cowan。C 轮资金投向 AI 技术加速——预测分析、AI
              驱动排班和实时项目跟踪——而不是近期盈利；管理层明确把盈利置于 R&D、人员扩张、市场覆盖和获客之后。Paul Madera 称 BuildOps
              正在填补“一个全行业需求”，所在的是“一个非常庞大且完全开放的市场”。投资逻辑押注 BuildOps 成为
              HVAC、电气、管道和多工种专业承包商中的权威商业工种平台，而这个市场长期缺少软件服务。反向逻辑是，隐含入场倍数（约 10.3x
              EV/revenue）明显高于上市可比公司交易水平，收入质量指标完全未披露，2026 年 SaaS 退出环境限制近期流动性。建议为观察：投入资本前先拿到经审计财务、NRR、毛利率和烧钱速度。
