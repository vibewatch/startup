companyProfile:
  summary: >-
    BuildOps 是一家总部位于 Santa Monica, California 的 AI 原生 SaaS 公司，由 Alok Chanani (CEO)、Steve Chew 和 Neeraj Mittal 于 2018
    创立，服务 HVAC、管道、电气、机械、消防与生命安全、制冷等商业专业承包商。平台把现场服务派工、项目管理、CRM、开票、支付和嵌入式 AI 层（OpsAI）整合进一个系统。BuildOps 于 March 2025 以 $1B
    投后估值完成 $127M Series C，进入独角兽行列；到 May 2026，北美商业承包商客户超过 1,500 家。估计 ARR 从 2024 的 ~$51.9M 增至 2025 的 ~$97.4M，意味着 ~88%
    同比增长，但公司未公开披露财务数据。
