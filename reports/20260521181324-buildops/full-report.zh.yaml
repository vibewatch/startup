  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标 / 披露
      - 投资判断影响
      - 具体尽调路径
    rows:
      - - 经审计 ARR / GAAP 收入调节表
        - 当前收入锚点来自第三方，且至少有一处内部不一致
        - 获取董事会材料、经审计财务报表和月度 ARR 桥接表
      - - 收入结构：平台 vs 服务 vs 支付
        - 无法判断增长主要来自软件、服务还是交易
        - 提供过去八个季度按收入流拆分的收入结构
      - - 实际 ACV / 平均席位数 / 折扣
        - 无法把询价定价转换为真实合同经济性
        - 提供交易规模分布、折扣瀑布和席位数队列
      - - 按收入流拆分的毛利率
        - 无法评估软件质量或服务拖累
        - 提供软件、实施 / 服务和支付的毛利率拆分
      - - NRR / GRR / 流失
        - 无法判断续约耐久度、增购能力或队列质量
        - 按细分市场提供 NRR、GRR、logo 流失和队列留存
      - - CAC / 回本周期 / 销售产能
        - 无法检验高速增长是高效扩张，还是单纯资本密集
        - 提供 CAC、回本周期、配额达成率和爬坡产能
      - - 现金余额 / 月度烧钱 / 现金跑道
        - 无法判断 Series C 资金是否足以支撑到下一里程碑
        - 提供现金瀑布、烧钱趋势和管理层现金跑道情景
      - - 债务、租赁和契约敞口
        - 未知固定义务会扭曲真实现金跑道和企业价值
        - 提供债务明细表、租赁负债和契约包
      - - Payments+ 经济性
        - 无法判断嵌入式支付是否是有意义的收入或利润率驱动项
        - 提供支付量、抽成率、处理方成本和附加率
      - - 客户集中度 / 企业级账户依赖
        - 如果少数大型商业账户放缓或流失，无法评估下行风险
        - 提供头部客户集中度和按区间拆分的 ARR 集中度
    notes: 每行都列出一个具体障碍，以及补齐缺口所需的准确文件或数据集。这是本章后续尽调的主要清单。
