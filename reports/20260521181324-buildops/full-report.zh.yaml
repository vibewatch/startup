      - number: '2.5'
        title: 采用约束与切换成本
        blocks:
          - type: paragraph
            body: >-
              尽管需求信号强，几项采用约束仍压低商业承包商软件渗透速度。最结构性的因素是承包商基数分散：美国有超过 500,000 家施工承包企业，其中 80%+ 少于十名员工，企业 SaaS
              按席位计价的经济性把按人头计的大多数可触达市场排除在外。BuildOps 和竞争对手必须把销售精力集中到中端市场和企业层级，因为交易规模足以覆盖复杂垂直 SaaS 销售成本。

              遗留系统和集成复杂度带来显著切换摩擦。施工组织高达 90% 的 IT 预算用于维护过时系统（Eide Bailly 2025）；43%
              的施工公司表示，若能获得实时和历史数据，业务流程会改善，但仍推迟现代化。集成负担真实存在：商业承包商往往用一个系统跑薪资，另一个系统跑会计（Sage、QuickBooks、Vista），第三个系统跑项目控制；BuildOps
              的价值主张要求替换或深度集成这些既有系统，销售过程中技术风险和组织阻力都会上升。ServiceTitan 10-K
              将工种软件市场描述为碎片化，充斥着「面向工种工作流特定环节的点工具、面向通用功能的横向解决方案、遗留本地现场服务管理应用和狭窄捆绑方案」——这些都是 BuildOps 必须替换的既有位置。

              AI 信任和数据质量构成新的约束层。RICS Global AI in Construction 2025 报告基于 2,200+ 名全球受访者，发现 45% 施工组织没有使用 AI，只有 1% 已在项目间规模化
              AI。障碍包括缺乏熟练人员（46%）、系统集成挑战（37%）和数据质量差（30%）。在承包商中，按 Dodge Construction Network/CMiC 研究，只有 26%
              认为自身数据质量「高」，57% 公司提到数据准确性担忧。数据质量差会削弱排班、预测性维护、投标智能等 AI 功能，而这些正是 BuildOps 差异化核心；承包商如果还没有标准化数据工作流，就无法充分使用 AI
              价值主张。ServiceTitan MEP Conference 2025 上关于 AI 采用的场次发现，承包商把 AI 形容成「黑箱」，仍会人工复核输出——这种信任校准拖慢了 BuildOps
              定价模型依赖的工作流自动化采用。培训负担还会叠加：BuildOps/Kickstand 2025 调查发现，AI 采用的首要障碍不是成本或安全，而是培训；这与 65% 施工公司把数字技能缺口列为挑战相一致。

              商业办公施工疲弱是特定板块逆风。高利率和混合办公带来的空置率压制了商业办公新建和翻新活动，减少该垂直的可触达服务合同。服务办公业主的承包商服务呼叫量下降，软件支出意愿受限。工业、数据中心和医疗施工是补偿性增长板块，但
              BuildOps 必须证明自己能有效覆盖这些板块所需的复杂多工种项目工作流，才能拿到抵消增长。
