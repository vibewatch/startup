      - number: '7.5'
        title: 领导力、执行与退出风险
        blocks:
          - type: paragraph
            body: >
              CEO 兼联合创始人 Alok Chanani 是 BuildOps 唯一的公开门面：所有重大融资公告中，他都是具名发言人；Reuters 和 TechCrunch 关于 C
              轮的报道也只引用他一位高管；他还是代表公司的首届 LA500 入选者。其从军队到 Wharton 再到创始人的叙事，深嵌在 BuildOps 的投资人推介和品牌身份中。公司在 The Org
              上的领导层页面列出七个人；对一家估值 $1B、瞄准企业级商业承包商的公司来说，高管梯队偏薄。如果 Chanani 或联合创始人 Steve
              Chew（COO/CPO）离职，公司关于创始客户关系和产品策略的不可替代组织知识会被抽走，很可能引发投资人担忧和客户不确定性。

              双线平台扩张抬高了执行风险：BuildOps 同时管理一项服务 FSM 业务（现有 1,500+ 家承包商装机基础）和一个新推出、瞄准施工项目管理的 Projects 模块，而后者所在品类有
              Procore、Autodesk、Oracle Primavera 等资金深厚的对手。年轻销售组织（Greg Gillis 于 2024–2025 年加入担任 CRO，Christian Anderson 担任
              SVP Revenue）同时跑两套 go-to-market 动作，会引入资源分配张力，可能拖慢两个产品的采用曲线。

              退出选项并不确定。CEO 曾公开承认 IPO 是一种可能，但也表示没有清晰时间表。ServiceTitan 上市后交易价约为 $61/share，净利润率为 -16.64%，FSM
              公开市场可比公司的信号并不一致。如果 M&A 成为首选退出，潜在收购方——Procore、Autodesk、ERP 玩家——会获得一个商业 FSM
              资产，但也可能与现有客户基础发生渠道冲突。来自投资人阵营的战略收购方（Schneider Electric 通过 SE Ventures）会引入关联方复杂性。以 $1B 独角兽估值参投的投资人，如果 IPO 或
              M&A 退出以更低倍数发生，将承担实质估值台阶风险。
