      - number: '8.2'
        title: 上市可比公司分析与隐含倍数
        blocks:
          - type: paragraph
            body: >-
              BuildOps 最相关的上市基准是 ServiceTitan（TTAN）和 Procore（PCOR）。ServiceTitan 于 2025 年末 IPO，截至 2026 年 5 月交易价约为
              $61–62/share，对应市值约 $5.85–5.98B；过去十二个月收入约 $961M，企业价值 / 收入（EV/revenue）倍数约 5.0x。ServiceTitan
              报告净美元留存率已连续十多个季度保持在 110% 以上，过去十二个月 EBITDA 利润率为 16%，FCF 利润率为 9%，至今已完成 11 笔收购。Procore（PCOR）报告 2026 年 Q1 收入
              $359.3M，同比增长 15.7%，GAAP 毛利率 80%，non-GAAP 自由现金流 $56M。按约 $6.9B 市值对比约 $1.5B 全年指引，Procore 隐含约 4.6x EV/forward
              revenue。两家上市可比公司都在 4.6–5.0x 区间交易，且财务完全透明。对比 GetLatka 未经审计的 $97.4M 2025 年估计，BuildOps 的 $1B 估值隐含约 10.3x，溢价为
              2–4x。SaaS Capital 2025 年对 1,500+ 家私有 B2B SaaS 公司的调查显示，股权融资公司中位数为 5.3x ARR，自举公司中位数为 4.8x。Windsor Drake 的
              2025 年 Q4 垂直 SaaS 报告显示，具备 AI 集成和 120%+ NRR 的端到端平台可获得 8.5–12.0x；只有在最乐观收入情景下（$120M ARR 隐含 8.3x），BuildOps
              的隐含倍数才落在这一区间高端。许多 2021 年周期的独角兽曾以 15–25x 融资，之后在 down round 中重置到 4–8x；BuildOps 2025 年 3
              月融资发生在这轮修正之后，但仍高于正常化区间。敏感性分析显示：若 ARR 为 $80M，倍数为 12.5x；若 ARR 为 $120M，则降至 8.3x。累计融资 $226M 对比估计 ARR
              $97.4M，资本效率约为每融资 $1 产生 $0.43 ARR——对垂直 SaaS 来说中等，但不是 best-in-class。
