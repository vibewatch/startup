chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与产品
        blocks:
          - type: paragraph
            body: >-
              BuildOps 于 2018 在 Los Angeles, California 注册并上线，目前总部位于 Santa Monica（Los Angeles
              都会区）。公司为私营、未上市，自称从第一天起就是「AI 原生」——专为商业专业承包商打造，而不是把面向住宅场景的现场服务软件改造过来。核心平台把排班、派工、项目管理、开票、库存管理、CRM 和会计整合进一套云端
              SaaS。平台于 2020 商业化推出，之后扩展至 HVAC、管道、电气、机械、消防与生命安全、制冷等工种，服务从十几名员工到数千名员工不等的承包商。


              商业模式是按用户计价的订阅 SaaS，合同按年签。BuildOps 瞄准中大型商业承包商。它与 Procore（总承包商）和
              ServiceTitan（从住宅场景起步）等横向平台拉开距离：只做商业场景，并把现场服务和项目管理原生集成。嵌入式 AI 层 OpsAI 负责预测、推荐并自动化承包商工作流，从派工一直到最终开票。截至 May
              2026，公司在 Los Angeles（总部）、Raleigh, North Carolina 和 Toronto, Canada 设有办公室，扩张覆盖北美。
