      - number: '7.3'
        title: 监管、法律与数据隐私风险
        blocks:
          - type: paragraph
            body: >
              加州修订后的 CCPA/CPRA 规则于 2025 年 9 月 23 日获 Office of Administrative Law 批准，并于 2026 年 1 月 1 日生效，直接约束 BuildOps
              这家总部位于洛杉矶、处理加州居民个人数据的 SaaS 供应商。CPPA 修订后的 ADMT（Automated Decision-Making Technology）规则要求，使用 ADMT
              作出影响消费者的“重大决定”的企业，在使用前提供通知，满足退出和访问请求，并开展正式风险评估。BuildOps 的 AI 原生功能（OpsAI 排班建议、Copilot 派工、资产名称捕获自动化）很可能落入
              CPPA 对 ADMT 的定义，因此合规是即时且持续的义务。网络安全审计要求会分阶段实施到 2030 年 4 月，企业需按年收入在滚动时间表内完成首次审计。

              BuildOps 的 AI 原生定位放大了监管暴露：当 AI 从简单排班自动化扩展到工单成本预测和主动提醒，流程支持与“重大决策”之间的边界会收窄，可能触发更严格的 CPRA 义务。ServiceTitan
              自己的 10-K 风险因素章节也明确把不断演变的 AI 和数据隐私监管列为实质风险；BuildOps 作为私有公司，合规资源更少，面临类似暴露。如果 BuildOps 推进国际扩张，还会叠加 EU AI Act
              和 NIS2 Directive 风险，因为欧盟框架对某些高风险 AI 用例要求强制合格评定。

              截至 2026 年 5 月 21 日，未发现针对 BuildOps 的公开披露诉讼、监管执法行动或 IP 争议。没有披露的法律记录，部分原因在于私有公司公开披露有限；尽调应包括管理层就未决索赔作出的直接声明、针对
              ServiceTitan 16 项美国专利的直接 IP 清查、对前员工任何商业秘密索赔的审查，以及主要客户的数据处理附录审查。
