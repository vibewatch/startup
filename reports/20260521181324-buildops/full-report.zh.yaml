              BuildOps 的 ARR 从 2021 的 $2.5M 增至 mid-2025 第三方估计的 $97.4M，四年约 39x；同时在 Meritech Capital、BOND Capital、Founders
              Fund 等一线投资方支持下累计融资 $250M+，并以 $1 billion 估值跻身独角兽。收入在 2023 和 2024 连续翻倍，且 ARR
