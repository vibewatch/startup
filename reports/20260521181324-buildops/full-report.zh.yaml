  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代工具
        blocks:
          - type: paragraph
            body: >-
              BuildOps
              将目标市场定义为商业专业承包商——为商业建筑、工业设施和基础设施安装、服务并维护机械、电气和管道（MEP）系统的公司。纳入的支出包括经常性服务协议、定期预防性维护、紧急派工，以及面向商业客户的项目制施工，全部通过工种专属工作流（派工、工单、开票、采购订单、薪资）运转。核心市场不包括住宅工种承包商（单户住宅
              HVAC、管道、电气，这是 ServiceTitan 的主阵地）、横向施工（道路、桥梁），也不包括工作流围绕总包而非工种专属服务运转的总承包商。相邻板块包括消防 /
              生命安全检查与测试、制冷和冷链维护，以及面向业主侧的设施管理软件；BuildOps 已表示计划逐步覆盖这些方向。

              BuildOps 要替换的现状工具并不好打：大量承包商仍在用彼此割裂的电子表格（行业研究显示，近 90% 的施工电子表格含有错误）、纸笔派工板、Sage、Acumatica、Viewpoint
              等企业厂商的遗留本地 ERP 模块，以及松散集成的点解决方案组合（独立排班、开票、薪资工具，没有统一数据底座）。ServiceTitan 自身 10-K
              将更广义的工种市场描述为「仍处于早期发展阶段」，许多企业「仍依赖基础工作流组合」——这既说明 BuildOps 的机会，也说明采用阻力。美国商业承包商基数分散在约 500,000 家施工承包企业中，其中 80%
              以上少于 10 名员工；最小型经营者很难支撑按席位计价的企业 SaaS 经济性，因此 BuildOps 近期 SAM 集中在中端市场和更大型公司。
