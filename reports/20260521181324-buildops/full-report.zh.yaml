      - number: '3.5'
        title: 护城河耐久性与反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              BuildOps 最好的护城河不是网络效应飞轮，而是围绕商业专业工作流的适配优势。这是真实边际优势，因为商业 MEP
              运营者并不像住宅派工门店或通用项目型分包商那样运转。但这个优势比真正的数据或市场护城河更窄，也更容易被攻击。ServiceTitan 已经在扩展商业覆盖面。Microsoft
              正通过路线图投入自动化工单和维护规划。Trimble 和 Procore 已经大规模掌握相邻财务、项目和协作工作流。反向证据也来自内部，而不只是外部：BuildOps
              评论者指出上线和支持中的运营摩擦，这会在中低端市场抵消产品适配优势。因此，最重要的耐久性尽调问题是：对直接同行的观察赢率、上线后的模块附加和留存，以及 ServiceTitan 的商业业务是否足够直接地压到
              BuildOps，进而随时间压缩定价。
