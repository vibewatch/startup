  - id: FM003
    title: "Commercial Contractor Buyer–Segment Map"
    type: matrix
    layout: wide
    summary: >-
      Matrix mapping five commercial contractor buyer segments against four evaluation dimensions;
      each cell reflects the typical profile inferred from investor communications, case studies,
      and industry research.
    data:
      columns:
        - "Buyer Authority"
        - "Budget Control"
        - "Platform Readiness"
        - "AI Value Capture Timing"
      rows:
        - label: "Large multi-trade (>$50M rev)"
          values:
            - label: "Owner / CIO / COO — formalized procurement"
            - label: "CFO / PE board — capex-eligible"
            - label: "High — existing ERP; API integration required"
            - label: "Medium-term — data quality investment needed first"
        - label: "Mid-market service ($5M–$50M)"
          values:
            - label: "Owner — informal decision, often solo"
            - label: "Owner — operational expense"
            - label: "Medium — often on legacy tools or manual"
            - label: "Near-term — high ROI on scheduling and invoicing AI"
        - label: "PE-backed platform (aggregator)"
          values:
            - label: "PE operating team / IT director — formalized"
            - label: "PE firm — portfolio capex thesis"
            - label: "Variable — mixed legacy across acquisitions"
            - label: "Medium-term — data integration across entities first"
        - label: "National FM service firm"
          values:
            - label: "VP Ops / CIO — RFP process"
            - label: "CFO / procurement — contract-based"
            - label: "High — existing ops systems; SLA compliance need"
            - label: "Near-term — SLA analytics and preventive maintenance AI"
        - label: "Small independent (<$5M)"
          values:
            - label: "Owner — impulse / referral driven"
            - label: "Owner — cash flow sensitive"
            - label: "Low — often pen-and-paper or basic scheduling app"
            - label: "Long-term — training gap is primary barrier"
    notes: >-
      Cell assessments are inferred from BuildOps Series C investor commentary (Meritech Capital),
      ServiceTitan 10-K buyer profile descriptions, and BuildOps/Kickstand 2025 survey of 606 contractors.
      No BuildOps-published customer segmentation by revenue tier has been confirmed; actual ACV
      distribution by tier is not public.
    claimRefs: [CM025, CM026, CM035, CM037]

  - id: FM004
    title: "Commercial Contractor Software Adoption Funnel (US, Estimated)"
    type: funnel
    layout: standard
    summary: >-
      Estimated adoption funnel from total US commercial specialty contractor base through stages
      of software digitization, platform evaluation, and BuildOps-class incumbent use.
    data:
      items:
        - label: "Total US commercial specialty contractors (HVAC, plumbing, electrical, mechanical, fire)"
          value: 100
          description: "Estimated 500,000+ US construction contracting businesses; commercial specialty subset estimated ~100,000–200,000 firms (includes both residential-heavy and commercial-focused operators)"
        - label: "Digitally enabled: using any FSM or scheduling tool"
          value: 55
          description: "Estimated ~55% have adopted at least basic digital scheduling or dispatch (industry surveys suggest 45% with no AI/digital tools per RICS; rest use some form of digital)"
        - label: "Integrated platform user (CRM + FSM + invoicing in one system)"
          value: 20
          description: "ServiceTitan 2026 survey found only 20% of contractors operate on a single integrated platform; the other 80% run disconnected tools"
        - label: "Purpose-built commercial contractor SaaS (BuildOps-class)"
          value: 5
          description: "Estimated fraction using a purpose-built commercial-only platform vs. horizontal or residential-centric tools; no public penetration data available"
        - label: "BuildOps customers (company-stated 1,000+ as of March 2025)"
          value: 1
          description: "BuildOps reported 1,000+ commercial contractor customers as of the Series C announcement (March 2025); represents <1% of commercial specialty contractor base by count"
    approximationNotes: >-
      All funnel stages below the first are estimates based on industry survey data (RICS 2025,
      ServiceTitan 2026, BuildOps/Kickstand 2025) applied to an estimated commercial specialty
      contractor base of approximately 150,000 firms; values are normalized to 100 for the full base.
      The absolute number behind each percentage is uncertain; the funnel is directional only.
    claimRefs: [CM004, CM024, CM028, CM036]

