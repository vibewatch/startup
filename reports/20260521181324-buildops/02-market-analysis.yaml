figures:
  - id: FM001
    title: "Commercial Contractor Software: TAM / SAM / cSAM Sizing Pyramid"
    type: pyramid
    layout: standard
    summary: >-
      Three layers from broad global FSM+CMS+FMS software ceiling down to estimated North American
      commercial-contractor-specific serviceable addressable market; bottom layer is author-derived
      with no direct analyst source.
    data:
      items:
        - label: "Global FSM + CMS + FM Software TAM (2025 combined)"
          value: 15.9
          unit: "$B (2025 estimates combined)"
          note: "FSM $5.66B (Mordor) + CMS $7.5B (FMI) + FM $2.65B (Mordor); markets overlap in scope and should not be summed; shown as ceiling"
        - label: "North America FSM + CMS Software SAM (2025 est.)"
          value: 5.1
          unit: "$B (2025 est.)"
          note: "FSM ~$2.1B (37.89% NA share per Mordor) + CMS ~$2.85B (38% NA est.); commercial buildings 57.8% of CMS; crude proxy only"
        - label: "Commercial-Contractor Specialty SaaS cSAM (US+Canada, est.)"
          value: 1.0
          unit: "$B (2025 estimated, high uncertainty)"
          note: "Derived: ~$2.1B NA FSM × ~30% construction vertical share × ~70% commercial vs residential split; no analyst publishes this figure directly"
    approximationNotes: >-
      All pyramid layers carry material estimation uncertainty. The top layer ($15.9B) sums three
      overlapping market definitions and should not be read as an additive total. The middle layer
      ($5.1B) applies Mordor's 37.89% North America share to FSM and assumes a similar share for CMS.
      The bottom layer ($1.0B) is author-derived using vertical-share and commercial/residential split
      assumptions; the actual figure could plausibly range from $0.4B to $2.0B depending on assumptions.
    claimRefs: [CM007, CM012, CM015, CM016, CM042]

  - id: FM002
    title: "FSM and Adjacent Market Size Estimates (2025, USD Billion)"
    type: range
    layout: standard
