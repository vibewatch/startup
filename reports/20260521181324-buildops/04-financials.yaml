- id: cost-structure-and-capital-adequacy-proxies
  title: Cost Structure and Capital Adequacy Proxies
  body: 'Labor is the clearest public cost proxy. External workforce datasets place BuildOps between 499 and 685 employees across late 2025 to April 2026, with Revelio also showing 84 active job postings in 2025 and Unify showing sales as the largest department at 67 employees. Company and Built In pages reinforce a labor-heavy model: compensation includes salary, equity, and bonuses, while open roles span strategic AEs, install-base upsell sellers, implementation managers, data architects, and quote-to-cash operations. The Raleigh expansion announcement adds another 291 planned jobs at more than $100k average salary, reinforcing that Series C capital is being converted into headcount and execution capacity rather than near-term margin harvesting. Management made that trade-off explicit in Reuters: profitability is not a core focus, and the company is still investing heavily in R&D, product, market reach, and customer acquisition. The $127M Series C therefore looks like meaningful growth
    fuel, but public sources still do not disclose cash on hand, debt, burn, or runway, so capital adequacy can only be assessed directionally, not underwritten.'
