tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Core platform subscription
    - Quote-led software access sold through custom pricing
    - Seat / subscription
    - Public price not listed; Software Advice says monthly subscription-based plan
    - Medium
    - Provide ACV by cohort, contract duration, minimums, and renewal pricing
  - - Implementation / migration / onboarding
    - Rollout, data migration, integration, training, and customer enablement
    - One-time service
    - Implementation motion is visible in reviews and hiring, but services pricing is undisclosed
    - Low
    - Disclose services attach rate, gross margin, and average implementation timeline/cost
  - - Payments+
    - Integrated ACH / card collections tied to invoices
    - Payment transaction flow
    - Official module exists, but separate revenue contribution and take rate are not disclosed
    - Low
    - Provide payment volume, take rate, processor cost, and % of revenue
  - - Service agreements
    - Recurring-work management with locked pricing and profitability tracking for customers
    - Module / add-on
    - Official workflow exists; BuildOps packaging and attach economics are undisclosed
    - Low
    - Disclose module attach rate, pricing uplift, and seat expansion effect
  - - Reporting / financial visibility
    - Profitability, customer, and collections dashboards
    - Module / seat / package feature
    - Official page emphasizes margin and collections visibility; monetization specifics are undisclosed
    - Low
    - Disclose which analytics/financial modules are included vs upsold
  notes: Rows separate what is directly observable (modules and pricing opacity) from what remains private (realized contract value, services revenue, and take-rate economics).
