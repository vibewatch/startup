  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: revenue-quality
    missingEvidence: Audited ARR / GAAP revenue support and a clean valuation chronology that reconciles third-party profiles with the March 2025 Series C coverage.
    whyItMatters: The main public topline estimate is useful directionally but cannot anchor underwriting while it still carries an inconsistent valuation timeline.
    diligencePath: Request the latest audited statements, monthly ARR bridge, and investor deck used around the Series C and compare them against third-party aggregators.
    relatedQuestionRefs:
    - QI001
    - QI002
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: margin-retention
    missingEvidence: Gross margin by stream, NRR, GRR, logo churn, CAC, payback, and cohort retention.
    whyItMatters: These are the core inputs needed to judge revenue quality, payback, and whether the current valuation premium is deserved.
    diligencePath: Obtain board reporting or operating dashboards that break out margin, retention, churn, CAC, and payback by segment and cohort.
    relatedQuestionRefs:
    - QI017
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: burn-runway
    missingEvidence: Current cash balance, monthly net burn, runway under base and downside cases, debt schedule, and lease obligations.
    whyItMatters: The $127M Series C is substantial, but without the cash waterfall there is no defensible capital-adequacy view.
    diligencePath: Request the treasury / FP&A cash forecast, monthly burn bridge, debt and lease schedules, and covenant summary.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: payments-monetization
    missingEvidence: Payment volume, take rate, processor economics, attach rate, and share of total revenue from Payments+.
    whyItMatters: Embedded payments could materially improve revenue mix and margin, but public sources do not say whether it is economically meaningful.
    diligencePath: Obtain Payments+ KPI reporting, payment-volume cohorts, gross margin by payment flow, and processor contracts or economics summary.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI001
    - TI002
    - TI005
  - type: missing-source
    severity: material
    topic: pricing-realization
    missingEvidence: Realized ACV, discount waterfalls, average seats per account, implementation-services pricing, and renewal uplift / downgrade patterns.
    whyItMatters: Quote-led pricing without realized contract data makes it impossible to translate public product evidence into actual unit economics.
    diligencePath: Request price-book extracts, signed order forms by cohort, renewal schedules, and implementation statements of work.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI002
    - TI003
    - TI005
