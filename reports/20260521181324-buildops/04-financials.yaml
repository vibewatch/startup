- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public evidence
  - Current value / status
  - Why it matters
  - Diligence ask
  rows:
  - - Last disclosed equity raise
    - Reuters/Yahoo + CityBiz
    - $127M Series C in March 2025
    - Primary cushion for product, GTM, and hiring investment
    - Provide current cash remaining and bridge from raise to today
  - - Last disclosed valuation
    - Reuters/Yahoo + CityBiz
    - $1B post-money
    - Sets expectations for the next round and implied valuation floor
    - Provide cap table, preferences, and option-pool dilution
  - - Profitability stance
    - Reuters/Yahoo
    - Management says profitability is not a core focus
    - Signals intentional burn in exchange for growth
    - Provide approved burn plan and margin targets
  - - Use of proceeds
    - Reuters/Yahoo + CityBiz
    - R&D, product development, customer acquisition, predictive analytics, AI scheduling, project tracking
    - Shows spending priorities and capital deployment path
    - Provide actual spend split since Series C close
  - - Acquisition appetite
    - Reuters/Yahoo
    - Open to strategic acquisitions; bought PWSWARE / Perfectware Solutions in 2023
    - Raises possibility of inorganic capital use and integration cost
    - Provide acquisition pipeline, budget, and post-close integration spend
  - - Headcount base
    - Unify + Revelio + GetLatka
    - 499 to 685 employees (late 2025 to April 2026)
    - Largest likely cost bucket is payroll
    - Provide HRIS-backed headcount and payroll run rate
  - - Hiring expansion
    - Revelio + Spectrum
    - 84 active postings in 2025; 291 Raleigh jobs planned at >$100k average salary
    - Suggests continued opex expansion after Series C
    - Provide hiring cadence and loaded cost per hire
  - - Debt / financing obligations
    - Public source set
    - No debt, lease-covenant, or project-finance disclosure found
    - Balance-sheet risk cannot be assessed publicly
    - Provide debt schedule, lease liabilities, and covenants
  - - Burn / runway
    - Public source set
    - Not disclosed
    - Core capital-adequacy blocker
    - Provide monthly net burn, base-case runway, and downside runway
  notes: This table uses public financing, hiring, and management-commentary signals to infer capital posture. It cannot substitute for a cash waterfall or lender / board materials.
