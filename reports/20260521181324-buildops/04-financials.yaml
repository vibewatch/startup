chapter:
  number: 4
  title: Financials
  summary: 'BuildOps reads publicly as a fast-growing, quote-led vertical SaaS business with strong customer ROI evidence and a substantial March 2025 Series C cushion, but the company still withholds the core underwriting inputs that matter most: gross margin, retention, burn, runway, realized pricing, and revenue mix. If the widely cited $97.4M 2025 revenue estimate is directionally right, the last disclosed $1B private valuation implies a premium multiple versus current public comp trading.'
sections:
- id: revenue-model-and-disclosed-traction
  title: Revenue Model and Disclosed Traction
  body: 'BuildOps''s public revenue model looks like quote-led vertical SaaS, but only part of the stack is directly visible. Independent software directories consistently show that BuildOps does not publish list pricing and instead routes buyers to custom quotes, while Software Advice is the clearest source calling the product a monthly subscription-based plan. Official product pages then show the monetization surfaces around that core subscription: invoicing, reporting, service agreements, and Payments+ are all framed around faster billing, recurring-work management, customer profitability visibility, and integrated collections. The strongest topline datapoint is still third-party rather than company-filed: GetLatka estimates 2025 revenue at $97.4M after $51.9M in 2024, implying roughly 87.7% growth. That estimate is directionally useful but not clean enough to underwrite on its own, because the same profile contains an internally inconsistent statement that BuildOps reached a $1B valuation
    in 2022, which conflicts with March 2025 Series C coverage. Net: public evidence supports real scale and a coherent revenue architecture, but not an audited revenue base or disclosed revenue mix.'
  claimRefs:
