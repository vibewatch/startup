- id: valuation-context-and-underwriting-gaps
  title: Valuation Context and Underwriting Gaps
  body: 'Public comps show what is missing. Procore currently trades around 4.9x EV/revenue with 80% GAAP gross margin, 95% gross retention, and 19% full-year free-cash-flow-margin guidance, while ServiceTitan''s FY2026 results show $961M revenue, greater than 110% net dollar retention, 9.8% non-GAAP operating margin, and roughly a 6.1x market-cap-to-revenue multiple. Their filings also clarify why revenue-quality inputs matter: trades software can blend direct subscriptions, payment-processing or other usage revenue, and ratable revenue recognition that smooths topline visibility. Against those anchors, BuildOps''s last disclosed $1B valuation implies roughly 10.3x value-to-revenue if GetLatka''s $97.4M 2025 estimate is directionally right—a clear premium to current public comp trading. That premium may be justified if BuildOps really combines high growth with strong retention and healthy gross margins, but the public record still does not disclose burn, cash, gross margin, NRR, churn,
    realized ACV, discounting, or Payments+ economics. The chapter''s financial verdict is therefore positive on demand and commercial fit, but incomplete for underwriting.'
