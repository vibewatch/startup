- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric / disclosure
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Audited ARR / GAAP revenue reconciliation
    - Current topline anchor is third-party and contains at least one internal inconsistency
    - Obtain board pack, audited financial statements, and monthly ARR bridge
  - - 'Revenue mix: platform vs services vs payments'
    - Cannot tell whether growth is software-heavy, services-heavy, or transaction-heavy
    - Provide revenue mix by stream for the last eight quarters
  - - Realized ACV / average seats / discounting
    - Cannot translate quote-led pricing into actual contract economics
    - Provide deal-size distribution, discount waterfall, and seat-count cohorts
  - - Gross margin by stream
    - Cannot value software quality or services drag
    - Provide gross margin split for software, implementation/services, and payments
  - - NRR / GRR / churn
    - Cannot judge renewal durability, upsell power, or cohort quality
    - Provide NRR, GRR, logo churn, and cohort retention by segment
  - - CAC / payback / sales productivity
    - Cannot test whether fast growth is efficient or simply capital-intensive
    - Provide CAC, payback, quota attainment, and ramp productivity
  - - Cash balance / monthly burn / runway
    - Cannot determine whether Series C remains sufficient through next milestone
    - Provide cash waterfall, burn trend, and management runway scenarios
  - - Debt, lease, and covenant exposure
    - Unknown fixed obligations distort true runway and enterprise value
    - Provide debt schedule, lease liabilities, and covenant package
  - - Payments+ economics
    - Unknown whether embedded payments is a meaningful revenue or margin driver
    - Provide payment volume, take rate, processor costs, and attach rate
  - - Customer concentration / enterprise account dependence
    - Cannot assess downside if a few large commercial accounts slow or churn
    - Provide top-customer concentration and ARR concentration by bucket
  notes: Every row names a specific blocker and the exact document or dataset needed to close it. This is the chapter’s primary go-forward diligence checklist.
