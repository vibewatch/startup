companyProfile:
  summary: >-
    BuildOps is a Santa Monica, California-based AI-native SaaS company founded in
    2018 by Alok Chanani (CEO), Steve Chew, and Neeraj Mittal to serve commercial
    specialty contractors across HVAC, plumbing, electrical, mechanical, fire & life
    safety, and refrigeration trades. The platform integrates field service
    dispatching, project management, CRM, invoicing, payments, and an embedded AI
    layer (OpsAI) into a single system. BuildOps raised a $127M Series C in March
    2025 at a $1B post-money valuation — reaching unicorn status — and had surpassed
    1,500 commercial contractor customers across North America by May 2026. Estimated
    ARR grew from ~$51.9M in 2024 to ~$97.4M in 2025, implying ~88% year-over-year
    growth, though the company does not publicly disclose financials.
  foundedDate: "2018-01-01"
  founders:
    - name: Alok Chanani
      role: CEO & Co-Founder
      background: >-
        U.S. Army Captain (Iraq, Meritorious Service Medal); prior founder of USA
        Commercial (commercial real estate & construction, Southern California);
        MBA Wharton, BA Economics Cornell.
      claimRefs: [CO011, CO012, CO013, CO014]
    - name: Steve Chew
      role: Co-Founder (original COO)
      background: >-
        Prior roles at Microsoft, Nextag, and Fundly; enterprise software expertise.
      claimRefs: [CO011, CO015]
    - name: Neeraj Mittal
      role: Founding CTO (departed March 2025)
      background: >-
        Formerly Director of Engineering at ServiceTitan; departed as confirmed by
        TechCrunch at the time of the Series C close.
      claimRefs: [CO011]
  foundingLocation: "Los Angeles, California, USA"
  headquarters: "Santa Monica, California, USA"
  productSummary: >-
    Integrated SaaS suite covering field service management (dispatch, scheduling,
    work orders, preventive maintenance, asset tracking, service agreements,
    invoicing, payments), project management (RFIs, submittals, change orders,
    document control, project financials), CRM+, Fleet+, and OpsAI — an embedded
    AI/intelligence layer for workflow prediction and automation. The Projects module
    launched May 2026.
  customerFocus: >-
    Commercial specialty contractors (HVAC, plumbing, electrical, mechanical, fire
    & life safety, refrigeration) in the US and Canada; firm sizes from ~12 to
    1,200+ employees.
  businessModel: >-
    Annual SaaS contracts with per-user pricing; contact-vendor for custom quotes
    (estimated ~$299/user/month). Additional revenue from Payments+ (ACH/card
    processing) and implementation/migration services.
  stage: "Series C"
  fundingStatus: >-
    $127M Series C closed March 21, 2025, led by Meritech Capital at a $1B
    post-money valuation. Total capital raised ~$226M across four rounds.
    Investors include Meritech, Founders Fund, Bessemer, BOND Capital, SE Ventures
    (Schneider Electric), Next47, and Fika Ventures.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO011, CV001, CV008, CO044]

summary:
  headline: >-
    BuildOps is a high-growth commercial FSM unicorn with a defensible vertical
    niche, but the $1B valuation — ~10× estimated ARR with no disclosed NRR or
    gross margin — demands exceptional execution and demands caution at entry.
  overallScore: 6.5
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 1000
