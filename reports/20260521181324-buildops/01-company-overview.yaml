company:
  name: BuildOps

chapter:
  number: 1
  title: Company Overview
  summary: >-
    BuildOps is a Santa Monica, California-based AI-native SaaS platform founded in 2018 by
    Alok Chanani, Steve Chew, and Neeraj Mittal to serve commercial specialty contractors in
    HVAC, electrical, plumbing, mechanical, fire safety, and refrigeration trades. The company
    raised a $127 million Series C in March 2025 at a $1 billion post-money valuation, bringing
    total disclosed funding to over $250 million. ARR grew from $51.9 million in 2024 to $97.4
    million by mid-2025, with the customer base surpassing 1,500 commercial contractors across
    North America by May 2026; co-founder and founding CTO Neeraj Mittal's departure and
    aggressive headcount scaling introduce key-person and execution risk.

sections:
  - id: identity-and-product
    title: Identity and Product
    body: |-
      BuildOps was incorporated and launched in 2018 in Los Angeles, California, and operates
      from its headquarters in Santa Monica (Los Angeles metro). The company is privately held,
      non-public, and describes itself as "AI-native" from day one—built specifically for
      commercial specialty contractors rather than adapted from residential-focused field service
      software. Its core platform integrates scheduling, dispatching, project management, invoicing,
      inventory management, CRM, and accounting into a single cloud-based SaaS suite. The platform
      launched commercially in 2020 and has since expanded to cover HVAC, plumbing, electrical,
      mechanical, fire and life safety, and refrigeration trades, serving contractors ranging from
      a dozen employees to several thousand.

      The business model is subscription SaaS with per-user pricing structured as annual contracts.
      BuildOps targets medium-to-large commercial contractors, distinguishing itself from horizontal
      platforms like Procore (general contractors) and ServiceTitan (which began residential) by
      focusing exclusively on the commercial segment with natively integrated field service and
      project management. The embedded AI layer, branded OpsAI, is designed to predict, recommend,
      and automate contractor workflows—from dispatch to final invoice. As of May 2026, the company
      has offices in Los Angeles (HQ), Raleigh, North Carolina, and Toronto, Canada, reflecting its
      expansion across North America.
