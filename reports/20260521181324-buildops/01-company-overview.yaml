  - id: funding-history-and-investors
    title: Funding History and Investors
    body: |-
      BuildOps has raised capital in four distinct institutional rounds since inception. The initial
      seed round in 2019 brought in approximately $5.8 million to fund early platform development.
      In May 2022, the company closed a $43 million Series A led by Next47 (Siemens' global venture
      arm), with participation from Founders Fund, StepStone Group, Fika Ventures, Global Founders
      Capital, MetaProp VC, and others, bringing total raised to approximately $48.8 million. In May
      2023, a $50 million Series B led by Fika Ventures and 01 Advisors brought total raised past
      $100 million; former Twitter CEO Dick Costolo joined the board at this stage. A subsequent
      Series B top-off of approximately $36 million for existing investors only was also completed,
      as disclosed by CEO Alok Chanani in the Series C announcement.

      On March 21, 2025, BuildOps closed its $127 million Series C led by Meritech Capital at a
      $1 billion post-money valuation—the company's unicorn milestone. New investors BOND Capital
      and Schneider Electric's SE Ventures joined alongside existing backers Fika Ventures, Next47,
      StepStone Group, and Titanium Ventures. Early-stage investors include 01A (formerly 01
      Advisors, co-founded by Dick Costolo and Adam Bain), Founders Fund (Peter Thiel's firm),
      MetaProp, B Capital, 137 Ventures, and Liquid 2 Ventures (Joe Montana). Total capital raised
      exceeds $250 million as of the Series C close. The Series C valuation of $1 billion represents
      more than double the post-money valuation reached at the Series B, per CEO Chanani's
      statement to TechCrunch. BuildOps has no publicly disclosed debt facility or secondary
      transaction; these constitute open diligence items.
