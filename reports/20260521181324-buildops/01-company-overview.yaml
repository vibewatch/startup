callouts:
  - calloutType: strength
    title: Rapid ARR Growth with Strong Investor Validation
    body: >-
      BuildOps has grown ARR from $2.5M in 2021 to a third-party-estimated $97.4M by mid-2025—
      approximately 39x in four years—while securing $250M+ across a roster of tier-one investors
      including Meritech Capital, BOND Capital, and Founders Fund at a $1 billion unicorn valuation.
      Revenue doubling in 2023 and 2024 at increasing ARR scale signals durable product-market fit
      in a historically underserved vertical.
    claimRefs:
      - CO037
      - CO040
      - CO041
      - CO029
      - CO030

  - calloutType: risk
    title: Founding CTO Departure and Multi-Year Leadership Gap
    body: >-
      Co-founder and founding CTO Neeraj Mittal, who designed the original platform architecture
      leveraging his prior experience at ServiceTitan, is confirmed to have departed BuildOps by
      at least March 2025. The role remained vacant for approximately two years until Dzmitry
      Markovich was appointed in May 2026. This gap during a period of rapid product investment
      (OpsAI launch, API architecture expansion, Series C deployment) is a material execution risk
      and a key-person governance concern.
    claimRefs:
      - CO017
      - CO021
      - CO050

  - calloutType: risk
    title: Adverse User Reviews Signal Sales-Promise and UX Gaps
    body: >-
      Independent user reviews on SoftwareFinder include an unverified one-star account alleging
      that post-contract features differed materially from sales-demo promises, with the reviewer
      noting customer service was nonexistent. Multiple Capterra and SoftwareAdvice reviews
      identify steep learning curves, limited reporting, and cumbersome workflows as recurring
      friction points. While review platforms carry inherent bias risk, the pattern across multiple
      sites suggests real product and sales-process risks relevant to churn and NPS diligence.
    claimRefs:
      - CO048
      - CO049

