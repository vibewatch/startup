  - id: scale-growth-and-milestones
    title: Scale, Growth, and Milestones
    body: |-
      BuildOps launched its platform commercially in 2020, recording approximately $2.5 million in
      ARR in 2021 before tripling to roughly $16.4 million in 2022 (triple-digit growth). Revenue
      grew to $24.6 million in 2023 and doubled to $51.9 million in 2024. By mid-2025, ARR had
      reached $97.4 million—an approximately 88 percent year-over-year increase. These figures are
      sourced from GetLatka (a SaaS revenue data aggregator) and are consistent with CEO Chanani's
      public statements about doubling in 2023 and 2024. Hard ARR or GAAP revenue has not been
      independently disclosed by the company, and the figures represent aggregated third-party
      estimates rather than audited financials.

      The customer base crossed 1,000 commercial contractor accounts as of March 2025 and
      exceeded 1,500 as of May 2026. Named customers include J.H. Kelly, Haynes Mechanical,
      Dynamic Systems Inc., Baker Electric, and Smart Care Climate Solutions (which consolidated
      four separate legacy systems onto BuildOps). Headcount was reported at approximately 375
      in March 2025, up 50 percent year-over-year. Third-party estimates place current headcount
      between 500 and 626 as of early 2026. The company is not yet profitable, investing
      aggressively in product, engineering, and go-to-market. Geographic expansion includes a
      Raleigh, NC engineering hub and Toronto operations alongside the Los Angeles headquarters.
      BuildOps has stated plans for strategic acquisitions with a portion of the Series C proceeds.
