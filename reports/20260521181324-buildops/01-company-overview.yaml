  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: "Audited or company-disclosed gross margin, net revenue retention (NRR), customer churn rate, and GAAP revenue figures."
      whyItMatters: "Without unit economics, the quality and sustainability of BuildOps' rapid ARR growth cannot be assessed; NRR above 100% would validate land-and-expand, while high churn would undermine the valuation."
      diligencePath: "Request audited financial statements or management accounts through Series C investor data room; cross-check ARR against bookings and deferred revenue schedules."
      relatedQuestionRefs: [QO019]

    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: "Full board composition with board seat counts, observer rights, protective provisions, and liquidation preference stack across all rounds."
      whyItMatters: "Board governance structure and investor rights determine exit scenarios and management control; SE Ventures (Schneider Electric) strategic terms are particularly unclear."
      diligencePath: "Review investor rights agreements, voting agreements, and charter documents from company counsel via data room."
      relatedQuestionRefs: [QO026]
      relatedTableRefs: [TO003]

    - type: missing-source
      severity: minor
      topic: adverse
      missingEvidence: "Confirmed history or absence of litigation, regulatory complaints, or employment-related adverse events filed against BuildOps."
      whyItMatters: "No public lawsuits were found in search coverage through May 2026, but absence of search evidence is not equivalent to verified absence; PACER and state court records were not searched."
      diligencePath: "Run PACER litigation search and state court records; check California Department of Fair Employment and Housing (DFEH) complaints; review Better Business Bureau and state contractor board records."
      relatedQuestionRefs: [QO017]

    - type: missing-source
      severity: minor
      topic: headcount
      missingEvidence: "Verified total headcount as of May 2026; estimates range from 522 (Growjo) to 626 (builtin.com FAQ) with no company-disclosed figure post-March 2025."
      whyItMatters: "Headcount trend is a proxy for burn rate and hiring execution quality; significant variance between third-party estimates limits confidence in growth trajectory."
      diligencePath: "Request current headcount from company or check LinkedIn employee count; verify against payroll or recruiting data if available in data room."
      relatedQuestionRefs: [QO020]
