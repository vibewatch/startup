  - id: risks-and-adverse-signals
    title: Risks and Adverse Signals
    body: |-
      Several adverse and risk signals emerge from independent sources. At the product level, user
      reviews on SoftwareFinder include a one-star review alleging that post-sale features
      differed materially from what was promised during the sales demonstration: "Do not believe
      the sales pitch. After we paid, they suddenly told us that some of the features we were
      promised were not actually possible." The same reviewer stated customer service and
      technical support were "completely nonexistent." Additional user complaints on Capterra and
      SoftwareAdvice point to a steep learning curve, limited reporting customization, cumbersome
      purchase order workflows, and difficulties re-using property records across multiple
      customers—indicating UX friction that may constrain adoption among smaller organizations.

      At the leadership level, co-founder and founding CTO Neeraj Mittal's departure before the
      Series C is a material key-person concern, as he was responsible for the original platform
      architecture built at ServiceTitan standards. The company replaced him in May 2026 with
      an externally hired CTO (Dzmitry Markovich), a roughly two-year gap during which the
      engineering organization had no permanent CTO. BuildOps is also not yet profitable,
      carrying execution risk as it scales headcount rapidly. Gross margin, NRR, and churn
      are not publicly disclosed, preventing full financial diligence. Competition from
      ServiceTitan—a more established platform with $9.5 billion valuation and $551 million
      in ARR—represents a durable competitive risk to BuildOps' commercial contractor positioning.
    claimRefs:
      - CO048
      - CO049
