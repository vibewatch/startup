- id: SU003
  title: Expansion surfaces and workflow embedment
  body: |-
    BuildOps’s expansion logic is visible in product and partner materials even without disclosed NRR. After initial deployment, the platform can deepen into recurring service agreements, customer-specific pricing, profitability analytics, payments, fleet, inspection workflows, and partner-assisted implementation. Service Agreements and Payments+ are especially important because they move BuildOps closer to the contractor’s revenue engine: recurring maintenance schedules, invoice creation, ACH and card collection, and customer-level margin visibility. Scheduling adds daily workflow stickiness by sitting in the middle of technician allocation and workload planning, while the Inspect Point partnership shows a path to vertical expansion in fire and life safety where inspections can flow straight into quotes, schedules, and invoices.

    Customer-success content also shows BuildOps investing in enablement, not just product breadth. Academy is role-based, self-paced, and explicitly targeted at dispatchers, service coordinators, office managers, and project admins, while the Certified Partner program signals an effort to scale implementation capacity beyond the internal team. The flip side is dependence: as expansion moves into more mission-critical workflows and partner-led deployments, diligence should confirm how much customer success depends on external implementation quality and how much attach rate comes from modules beyond the core subscription.
