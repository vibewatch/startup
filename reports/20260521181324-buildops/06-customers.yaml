- id: SU002
  title: Named deployments and production proof
  body: |-
    The strongest part of BuildOps’s customer evidence is the quantity of named deployments that tie the product to live operational workflows instead of generic logo walls. Smart Care is the best enterprise-scale example: it said BuildOps replaced four prior systems, improved service-ticket efficiency, reduced days to resolve, and was being rolled out across the broader portfolio. J.H. Kelly adds another large-contractor signal, with a public executive quote tying BuildOps to quoting, customer communication, billing, cash-flow management, and double-digit growth. Below that enterprise tier, company-published case studies show production use inside fire protection, mechanical, plumbing, low-voltage, AV, and multi-trade service businesses.

    The evidence quality is uneven. Smart Care and J.H. Kelly each have third-party corroboration through news coverage, while Certified Fire, Jackson Mechanical, Hubbard Mechanical, Advanced Cable Systems, Layer One, Service 1st, and JBS Plumbing are primarily company-curated stories. Even so, those stories are operationally specific enough to indicate real production usage: they reference billable-time improvement, quote generation, dispatch, payroll, job costing, purchase orders, field workflows, and invoice speed. This is materially stronger than logo-only proof, but still short of an independently verified deployment ledger with renewal history.
