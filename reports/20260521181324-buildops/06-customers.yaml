- id: SU004
  title: Retention and satisfaction signals
  body: |-
    BuildOps’s public satisfaction signal is good enough to support “real usage,” but not good enough to underwrite retention. Software Advice showed 177 results with a 4.4 overall rating, 4.5 customer-support score, and 4.3 value-for-money score at access date. Review language also repeatedly credits BuildOps for consolidating invoicing, payment processing, dispatch, job tracking, and broader visibility across departments. That pattern is consistent with the named case studies, which emphasize fewer workarounds, faster quoting, cleaner scheduling, and stronger job costing.

    But the retention picture is mixed once adverse evidence is included. Software Finder contains a one-star complaint alleging that promised features were not available after purchase and that support was “completely nonexistent.” Other reviewers still mention high cost, a meaningful learning curve, reporting limitations, cumbersome purchase-order flows, and customization gaps. Critically, BuildOps does not publish actual NRR, GRR, renewal rate, or logo churn by segment in any source retained for this chapter. The practical conclusion is that BuildOps appears to have strong enough satisfaction to support expansion in complex contractor workflows, but retention durability must still be treated as an open diligence item rather than a proven public fact.
  claimRefs:
  - CU032
  - CU033
  - CU034
  - CU035
