figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: |-
    The public BuildOps customer journey begins with contractor pain around fragmented systems, labor strain, and delayed billing; moves through evaluation against legacy point tools; then shifts into deployment across dispatch, billing, job costing, and service workflows; and finally expands into recurring work, payments, partner-led implementation, and role-based training. The most important friction points are implementation quality, configuration depth, and whether office users become proficient enough to trust the system daily. Expansion is most visible when BuildOps moves beyond dispatch into service agreements, payments, and vertical integrations such as fire-safety inspection workflows.
  approximationNotes: Stages are inferred from public customer stories, review complaints, and BuildOps enablement materials. No official conversion rates or average sales-cycle lengths were disclosed.
  data:
    nodes:
    - id: pain
      label: Pain / Trigger
      detail: Fragmented systems, billing delays, labor shortages, compliance burden, or office burnout push contractors to re-evaluate software
    - id: evaluation
      label: Evaluation
      detail: Owners, GMs, and project leaders compare BuildOps with legacy point tools and look for workflow fit in quoting, scheduling, and billing
    - id: deployment
      label: Go-live / Deployment
      detail: Teams implement dispatch, scheduling, job tracking, billing, and accounting integrations; support quality matters heavily at this stage
    - id: daily-use
      label: Daily Operational Use
      detail: Dispatchers, coordinators, office managers, and field teams rely on scheduling, invoicing, service agreements, and job-costing workflows
    - id: expand
      label: Expansion / Renewal
      detail: Accounts deepen into service agreements, Payments+, partner-led integrations, and Academy-enabled onboarding for new users
  claimRefs:
  - CU005
  - CU038
  - CU039
  - CU040
  - CU046
  - CU047
- id: FU002
  title: Adoption / deployment funnel
  type: funnel
  layout: standard
  summary: |-
    Public evidence supports a funnel in which broad contractor pain creates demand, a subset of contractors become named or reviewed references, and an even smaller subset surface detailed production outcomes. The funnel is strong enough to prove adoption, but weak on disclosed renewal and cohort conversion. In other words, BuildOps clearly has a live installed base and repeatable proof stories, yet the public record only exposes the top layer of the deployment funnel.
  approximationNotes: Values mix actual public counts with directional proof-set tallies. The bottom stages are proof availability counts, not company-disclosed conversion rates.
