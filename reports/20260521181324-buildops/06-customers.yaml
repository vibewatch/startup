  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: An independently sourced list of named BuildOps production customers with rollout stage, modules live, seat count, and whether deployments are still expanding.
    whyItMatters: Public proof is strong enough to establish real usage, but most named evidence is still company-curated and does not distinguish fully deployed accounts from staged rollouts.
    diligencePath: Request a current referenceable-customer list with deployment status by account; ask for three references each from enterprise, mid-market, and fire-safety cohorts.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Actual NRR, GRR, logo churn, renewal rate, and standard contract duration by customer segment.
    whyItMatters: Review scores and case studies suggest real usage, but they do not prove renewal durability or the strength of expansion revenue.
    diligencePath: Request cohort retention data by trade, customer size, and module bundle for the last eight quarters.
    relatedQuestionRefs:
    - QU022
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 customer concentration, platform-account exposure, and ARR by customer-size bucket.
    whyItMatters: Named public proofs skew large commercial operators, which could mean attractive ACVs or hidden platform-account concentration.
    diligencePath: Request top-customer waterfall, concentration by legal entity and platform family, and churn sensitivity for any account above 2% of ARR.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: minor
    topic: implementation-dependency
    missingEvidence: Partner-sourced deployment mix, Academy completion rates, go-live duration by cohort, and customer-success staffing model.
    whyItMatters: Expansion logic is public, but the operational dependency between internal customer success, certified partners, and self-serve training remains opaque.
    diligencePath: Ask for internal vs partner-led implementation share, average days to go-live, Academy adoption by persona, and post-go-live support ticket load.
    relatedQuestionRefs:
    - QU019
    - QU020
    - QU024
