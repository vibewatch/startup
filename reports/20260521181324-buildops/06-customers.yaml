chapter:
  number: 6
  title: Customers
  summary: |-
    Public customer proof shows BuildOps deployed in production across commercial HVAC and mechanical, plumbing, electrical, fire and life safety, low-voltage, and multi-trade enterprise contractors, with a verified public customer floor of 1,000+ accounts by March 2025. The strongest expansion surfaces are recurring service agreements, payments, scheduling, fire-safety integrations, and role-based onboarding content, while named case studies provide real workflow evidence from Smart Care, J.H. Kelly, Certified Fire, Jackson Mechanical, Hubbard Mechanical, Advanced Cable Systems, Layer One, Service 1st, and JBS Plumbing. Retention quality remains inferred rather than disclosed: independent reviews are solid but mixed, and BuildOps does not publish NRR, churn, or customer-concentration data.
sections:
- id: SU001
  title: Customer base and segment mix
  body: |-
    BuildOps is clearly selling into commercial specialty contractors rather than a broad horizontal SMB audience. The strongest public floor is 1,000+ commercial contractor customers by March 2025, and the named logo set spans HVAC, plumbing, electrical, refrigeration, fire and life safety, low-voltage, and multi-trade enterprise operators across the U.S. and Canada. Public examples also show a wide size spread: Hubbard Mechanical is a 13-person local shop, Jackson Mechanical runs 63 service trucks, and J.H. Kelly is a 1,200+ employee specialty contractor. That breadth matters because it suggests BuildOps is not limited to a single trade or contractor size band.

    What the public record does not provide is a clean audited 2026 customer count, cohort split, or buyer-user-payer breakdown. The best proxy for current buyer conditions comes from BuildOps’ contractor survey work: more than 600 contractors cited competition, labor shortages, and growing complexity as forcing technology upgrades. That context supports the thesis that BuildOps is winning customers because it addresses operational pain in dispatch, billing, job costing, and compliance-heavy service work, but it does not substitute for a customer ledger, revenue-band mix, or ARR-by-segment disclosure.
