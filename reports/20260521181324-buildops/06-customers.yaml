- id: SU005
  title: Concentration risk and remaining diligence gaps
  body: |-
    Customer concentration is the biggest blind spot in the public record. The named proof set skews toward sizable commercial operators and enterprise-style platforms, which is encouraging for ACV quality but potentially dangerous if a small number of platform accounts represent a large share of ARR. Smart Care’s portfolio rollout and Service Logic’s public support both hint at meaningful enterprise relationships, yet no source discloses top-customer concentration, ARR by customer bucket, or how much of the installed base comes from multi-entity rollouts versus independent regional contractors. That means downside from any single churn event cannot be quantified from public evidence.

    There are two more gaps worth carrying forward. First, public proof is still dominated by BuildOps-curated case studies rather than independent renewal or deployment reporting; many stories clearly describe production use, but they rarely disclose contract length, module attach, rollout stage, or post-implementation retention. Second, partner breadth is not transparent even though BuildOps is clearly pushing certified partners and fire-safety integrations. The next diligence step should therefore be straightforward: request top-10 customer concentration, standard contract term, renewal cohorts, partner-sourced ARR, and a deployment-stage view for the largest named accounts.
  claimRefs:
  - CU006
  - CU008
  - CU011
  - CU041
  - CU042
  - CU049
  - CU050
