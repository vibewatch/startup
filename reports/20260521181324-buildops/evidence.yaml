evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited or company-disclosed gross margin, net revenue retention (NRR), customer churn rate, and GAAP revenue
      figures.
    whyItMatters: >-
      Without unit economics, the quality and sustainability of BuildOps' rapid ARR growth cannot be assessed; NRR above
