      - number: '8.3'
        title: Bull, Base, and Bear Valuation Scenarios
        blocks:
          - type: paragraph
            body: >-
              Three scenarios frame the return distribution from the $1B Series C entry. In the bull case, BuildOps
              sustains 80%+ ARR growth through 2026, reaches $200M+ ARR by end-2027 with NRR above 115% and GAAP gross
              margin above 70%, and validates AI product differentiation as a durable moat. At 7–9x ARR, the implied
              2027 valuation is $1.4–1.8B — a 1.4–1.8x gross return on $1B entry before dilution from future rounds. In
              the base case, growth decelerates to 40–60% YoY and ARR reaches $130–160M by 2027, with NRR in the
              100–110% range and gross margin of 60–70%. At 6–7x ARR, the base case values BuildOps at $780M–$1.1B —
              flat to modestly positive, contingent on execution and M&A market conditions. The bear case activates when
              growth falls below 40% YoY and capital is needed before a natural exit window; at 4–5x ARR on $100–120M,
              the implied value is $400–600M — a material down-round below $1B entry. Construction tech M&A remains
              elevated in 2026 with Autodesk, Trimble, and PE firms actively acquiring vertical platforms, making
              strategic acquisition the most realistic exit pathway for bull and base cases. The 2026 SaaS IPO
              environment is hostile — Crunchbase confirms no venture-backed SaaS unicorns filed new IPOs through May
              2026 — making M&A the primary realized liquidity mechanism. All scenario valuations are necessarily
              estimate-dependent because BuildOps' actual ARR, NRR, and margin profile remain undisclosed.
            claimRefs:
              - CV041
              - CV042
              - CV043
              - CV025
              - CV033
