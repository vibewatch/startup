      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and Adjacent Software Markets'
        blocks:
          - type: paragraph
            body: >-
              BuildOps sits at the intersection of three software market categories tracked by analysts: Field Service
              Management (FSM), Construction Management Software (CMS), and Facilities Management (FM) software. No
              single analyst has published a discrete SAM estimate for commercial-contractor-only FSM in North America;
              the figures below must be treated as ceiling estimates from which the relevant sub-segment must be
              derived.

              The global FSM software market is the most directly cited comparator. Mordor Intelligence estimated the
              market at $5.66B in 2025, growing to $9.87B by 2031 at a 9.54% CAGR. Global Market Insights published a
              somewhat lower 2025 baseline of $5.49B but a more aggressive 16% CAGR reaching $23.61B by 2035.
              MarketsandMarkets put 2025 FSM at $5.10B, growing to $9.17B by 2030 at 12.5% CAGR. The Business Research
              Company placed the 2025 figure at $5.12B and projected 14.4% CAGR to $10.09B by 2030. The spread — $5.1B
              to $5.7B in 2025 and CAGR from 9.5% to 16% — reflects methodological differences rather than factual
              disagreement; all four use their own proprietary estimation frameworks.

              North America represents approximately 37.89% of global FSM revenue per Mordor, implying a North American
              FSM market of roughly $2.1–$2.2B in 2025. However, FSM as a category includes utilities, telecom,
              manufacturing, and healthcare verticals that have no overlap with BuildOps' commercial contractor focus.
              The construction and real estate application vertical represents a minority of global FSM revenue, meaning
              the portion attributable to US commercial contractor software is materially smaller than $2B. BuildOps'
              own fundraising materials cite "a $300B+ industry" as the market, referring to total US commercial
              contracting spend — not software TAM — making direct comparison to analyst FSM estimates methodologically
              inconsistent.

              Adjacent markets provide additional context. The global Construction Management Software market was valued
              at $7.5B in 2025 (Future Market Insights), with commercial buildings commanding 57.8% of deployment; this
              market includes project controls software (Procore, Autodesk) that competes only partially with BuildOps'
              service workflow modules. The global Facility Management Software market was estimated at $2.65B in 2025
              by Mordor Intelligence (commercial segment 35.80% of revenue) and $3.79B by Grand View Research,
              reflecting broader IWMS/CAFM platform scope. The global plumbing, heating, and air-conditioning contractor
              market was estimated at $1.66T in 2025 (Research and Markets), but this measures contractor revenue, not
              software spend; the US commercial HVAC segment alone represents an estimated $156B in annual contractor
              revenue, of which commercial work comprises roughly 30%. The MEP contractor sector in North America
              exceeded $698B in aggregate 2026 revenue per Current Capital.
