  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Line and Modules
        blocks:
          - type: paragraph
            body: |-
              BuildOps is organized around three platform suites: Service Management, Projects, and CRM+.
              The Service Management Suite is the core product and covers the full commercial field service
              workflow — dispatching, scheduling, work orders, preventive maintenance, asset tracking, service
              agreements, invoicing, payments, and reporting. The dispatch board uses drag-and-drop scheduling
              with real-time visibility into technician availability, skill sets, and job status. Preventive
              maintenance scheduling supports automated recurring job creation, bulk scheduling, and visit
              tracking by date and zip code. Service agreements link recurring visits to billing automatically.

              The Projects module launched on May 7, 2026, targeting specialty contractors who run multi-month
              construction jobs alongside service work. It covers RFIs, submittal management, change order
              management, document control, resource planning, project financials, and subcontract tracking.
              A "Lists" feature allows teams to build repeatable digital SOPs applicable across job types. The
              module connects field execution to project financials in real time and integrates with the same
              accounting/ERP systems as the service module. This addresses a gap that previously forced
              contractors to run a separate project management system alongside BuildOps for service.

              CRM+ provides sales pipeline management, proposal creation, and quoting capabilities natively
              inside the platform, enabling service departments to manage customer relationships and win new
              commercial contracts without exporting data to a standalone CRM. Fleet+ adds GPS tracking,
              timesheet management, and proactive maintenance alerts for contractor fleet vehicles. The
              customer portal allows commercial clients to track job progress, view history, and communicate
              directly with the contractor's team. Asset management tracks equipment by location, service
              history, warranty, and maintenance schedule. BuildOps reports that customers include over 1,500
              commercial specialty contractors across North America as of May 2026.

              BuildOps positions its breadth against competitors by emphasizing that it covers service and
