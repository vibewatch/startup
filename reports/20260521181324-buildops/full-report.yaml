  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape Boundary and Segment Map
        blocks:
          - type: paragraph
            body: >-
              BuildOps does not compete inside a single undifferentiated “field service software” bucket. The evidence
              points to at least five distinct competitive classes: commercial MEP hybrid platforms that try to run
              service and projects together; compliance-heavy commercial service tools that shine on inspections and
              customer proof; residential or mixed-shop systems optimized for technician sales and home-service
              workflows; project-centric subcontractor and construction ERP suites; and horizontal enterprise FSM
              products that arrive through broader CRM or ERP estates. That segmentation matters because the buyer is
              not only choosing features; the buyer is also choosing an operating model. BuildOps is most directly
              exposed where a commercial contractor needs dispatch, PM contracts, asset history, job costing, and
              project coordination in one commercial-specific stack. The moment the account instead prioritizes portals,
              heavy inventory or ERP control, residential sales motion, or an existing enterprise platform footprint,
              the competitive set changes materially.
