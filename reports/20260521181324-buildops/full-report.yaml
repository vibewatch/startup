  - id: FE001
    title: BuildOps Product Architecture Map
    type: stack
    layout: wide
    summary: >-
      Four-layer product stack from the commercial contractor customer-facing experience down to infrastructure,
      illustrating the module breadth across AI, workflow, integration, and platform layers.
    data:
      layers:
        - label: Customer & Sales Layer
          detail: >-
            Modules facing commercial end-customers and the contractor's sales function — CRM+, customer portal,
            proposals, and quoting.
          items:
            - CRM+ (pipeline management, proposals, commercial quoting)
            - Customer Portal (job status, history, communication)
            - Estimates & Quotes (commercial bid creation)
        - label: Field Operations Layer
          detail: >-
            Core field service and project management workflow modules used by dispatchers, project managers, and
            technicians.
          items:
            - Dispatch Board (drag-and-drop, real-time tech status, GPS)
            - Scheduling (PM bulk scheduling, visit tracking)
            - Work Orders (field execution, digital sign-off)
            - Projects Module (RFIs, submittals, change orders, document control — GA May 2026)
            - Asset Management (equipment tracking, PM reminders)
            - Service Agreements (recurring billing)
            - Fleet+ (GPS tracking, timesheet, maintenance alerts)
        - label: AI & Mobile Layer
          detail: >-
            OpsAI embedded across workflows; mobile app delivering field execution; offline capability for remote job
            sites.
          items:
            - OpsAI (note refinement, invoice scanning, dispatch recommendation, troubleshooting — launched 2023)
            - Mobile App iOS / Android (offline surveying, photo/video, digital forms, signatures)
            - AI Document Control (flags stalled RFIs/submittals — launched April 2026)
        - label: Integration & Infrastructure Layer
          detail: >-
