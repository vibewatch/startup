  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Strategic & Competitive Risks
        blocks:
          - type: paragraph
            body: >
              BuildOps competes in a well-capitalized, increasingly concentrated field service management (FSM) market
              where its principal rival, ServiceTitan, is now a NASDAQ-listed public company (ticker: TTAN) with ~$961M
              in annual revenue, 3,414 employees, and 16 issued U.S. patents. ServiceTitan's 10-K for the fiscal year
              ended January 31, 2026 explicitly names BuildOps in its competitive risk disclosure alongside Salesforce,
              SAP, and Workwave—signaling that the incumbent FSM leader views BuildOps as a material threat requiring
              capital allocation to neutralize. ServiceTitan's ongoing "commercial ambitions" expansion directly
              encroaches on BuildOps' core addressable market of commercial HVAC, electrical, and mechanical
              contractors, narrowing BuildOps' differentiation window over time.

              Pricing parity is already achieved: BuildOps charges approximately $299/user/month versus ServiceTitan's
              ~$250/technician/month. ITQlick's 2026 analysis rates ServiceTitan at 97/100 versus BuildOps at 82/100 on
              a combined user sentiment and feature-breadth basis. While BuildOps offers more features (12 vs. 7
              evaluated), ServiceTitan's broader integration ecosystem—spanning marketing automation, payroll
              integrations (GreenSky, Mailchimp, Angi, Zapier), and advanced CRM—represents a sustained product surface
              advantage for contractors seeking a one-stop platform. The entry of Procore, Autodesk, and Salesforce
              Field Service into adjacent workflows also threatens the platform's expansion headroom in larger
              enterprise accounts.

              Market consolidation risk is amplified because BuildOps remains private with ~$250M in total funding at a
              $1B valuation. If ServiceTitan or another well-capitalized incumbent acquires a competing SMB-focused
              platform and bundles it aggressively, BuildOps' customer acquisition cost could spike materially. The
              fragmented contractor TAM—characterized by thousands of sub-$50M revenue businesses—means no single
              customer is a thesis-breaker, but it also means no anchor account provides defensible retention certainty.
            claimRefs:
