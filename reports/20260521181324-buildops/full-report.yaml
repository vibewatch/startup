      - number: '2.5'
        title: Adoption Constraints and Switching Costs
        blocks:
          - type: paragraph
            body: >-
              Despite robust demand signals, several adoption constraints temper the pace of commercial contractor
              software penetration. The fragmented contractor base is the most structural: with over 500,000 US
              construction contracting businesses of which 80%+ have fewer than ten employees, the economics of
              enterprise SaaS per-seat pricing exclude the majority of the addressable market by head count. BuildOps
              and competitors must concentrate sales effort on the mid-market and enterprise tier where deal size
              justifies the cost of a complex vertical SaaS sale.

              Legacy systems and integration complexity create significant switching friction. Up to 90% of IT budgets
              in construction organizations go to maintaining outdated systems (Eide Bailly 2025), and 43% of
              construction companies say business processes would improve with real-time and historical data access —
              yet they defer modernization. The integration burden is real: commercial contractors often run payroll in
              one system, accounting in another (Sage, QuickBooks, Vista), and project controls in a third; BuildOps'
              value proposition requires displacing or deeply integrating with these incumbents, raising both technical
              risk and organizational resistance during the sale. The ServiceTitan 10-K characterizes the trades
              software market as fragmented with "point-specific tools for specific elements of trade workflows,
              horizontal solutions for generic functionalities, legacy on-premise field service management applications
              and narrow bundled solutions" — all incumbent positions BuildOps must displace.

              AI trust and data quality present a newer constraint layer. The RICS Global AI in Construction 2025 report
              — based on 2,200+ global respondents — found that 45% of construction organizations report no AI use, and
              only 1% have scaled AI across projects. Barriers include lack of skilled personnel (46%), system
              integration challenges (37%), and poor data quality (30%). Among contractors, only 26% rated their data
              quality as "high" per a Dodge Construction Network/CMiC study, with data accuracy concerns cited by 57% of
              firms. Poor data quality undermines AI features (scheduling, predictive maintenance, bid intelligence)
              that are central to BuildOps' differentiation; contractors who haven't standardized their data workflows
              cannot fully utilize the AI value proposition. The ServiceTitan MEP Conference 2025 session on AI adoption
              found contractors characterizing AI as a "black box" whose outputs they still review manually — a trust
              calibration that slows the workflow automation adoption that BuildOps' pricing model depends on. Training
              burden compounds this: the BuildOps/Kickstand 2025 survey found the primary obstacle to AI adoption is not
              cost or security — it is training, a finding consistent with 65% of construction firms citing the digital
              skills gap as a challenge.

              Commercial office construction weakness is a segment-specific headwind. Elevated interest rates and
              hybrid-work vacancy rates have suppressed commercial office new-build and renovation activity, reducing
              addressable service contracts in that vertical. Contractors serving office landlords face lower service
              call volumes, limiting their software spend appetite. Industrial, data center, and healthcare construction
              are compensating growth segments, but BuildOps must demonstrate effective coverage of the complex
              multi-trade project workflows these segments require to capture the offset.
            claimRefs:
              - CM004
              - CM028
              - CM029
              - CM030
