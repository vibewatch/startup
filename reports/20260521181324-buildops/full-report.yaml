companyProfile:
  summary: >-
    BuildOps is a Santa Monica, California-based AI-native SaaS company founded in 2018 by Alok Chanani (CEO), Steve
    Chew, and Neeraj Mittal to serve commercial specialty contractors across HVAC, plumbing, electrical, mechanical,
    fire & life safety, and refrigeration trades. The platform integrates field service dispatching, project management,
    CRM, invoicing, payments, and an embedded AI layer (OpsAI) into a single system. BuildOps raised a $127M Series C in
    March 2025 at a $1B post-money valuation — reaching unicorn status — and had surpassed 1,500 commercial contractor
    customers across North America by May 2026. Estimated ARR grew from ~$51.9M in 2024 to ~$97.4M in 2025, implying
    ~88% year-over-year growth, though the company does not publicly disclose financials.
