  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      The public BuildOps customer journey begins with contractor pain around fragmented systems, labor strain, and
      delayed billing; moves through evaluation against legacy point tools; then shifts into deployment across dispatch,
      billing, job costing, and service workflows; and finally expands into recurring work, payments, partner-led
      implementation, and role-based training. The most important friction points are implementation quality,
      configuration depth, and whether office users become proficient enough to trust the system daily. Expansion is
      most visible when BuildOps moves beyond dispatch into service agreements, payments, and vertical integrations such
      as fire-safety inspection workflows.
    approximationNotes: >-
      Stages are inferred from public customer stories, review complaints, and BuildOps enablement materials. No
      official conversion rates or average sales-cycle lengths were disclosed.
    data:
      nodes:
        - id: pain
          label: Pain / Trigger
          detail: >-
            Fragmented systems, billing delays, labor shortages, compliance burden, or office burnout push contractors
            to re-evaluate software
        - id: evaluation
          label: Evaluation
          detail: >-
            Owners, GMs, and project leaders compare BuildOps with legacy point tools and look for workflow fit in
            quoting, scheduling, and billing
        - id: deployment
          label: Go-live / Deployment
          detail: >-
            Teams implement dispatch, scheduling, job tracking, billing, and accounting integrations; support quality
            matters heavily at this stage
        - id: daily-use
          label: Daily Operational Use
          detail: >-
            Dispatchers, coordinators, office managers, and field teams rely on scheduling, invoicing, service
            agreements, and job-costing workflows
        - id: expand
          label: Expansion / Renewal
          detail: >-
            Accounts deepen into service agreements, Payments+, partner-led integrations, and Academy-enabled onboarding
            for new users
