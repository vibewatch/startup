      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The commercial contractor software purchase involves at least three distinct roles: the buyer
              (decision-maker), the user (daily operator), and the payer (economic owner). In small and mid-market
              contractor firms (under $50M in revenue), these roles collapse into the owner/president who both
              authorizes the purchase, uses or oversees it, and bears its cost. At larger organizations — particularly
              PE-backed platforms and national service firms — these roles diverge: an IT director or COO drives vendor
              evaluation, dispatchers and project managers are the daily users, and the CFO or PE operating team
              controls the budget.

              The key buyer segments BuildOps has identified include: (1) large multi-trade specialty contractors (>$50M
              revenue) where enterprise capability, API architecture, and PE reporting integration are purchase
              criteria; (2) mid-market service contractors ($5M–$50M) where dispatch, invoicing, and labor productivity
              are the core value drivers; (3) PE-backed contractor platforms accumulating acquisitions that need a
              shared technology stack; and (4) national FM service companies needing SLA compliance reporting across
              dispersed field operations. The smallest independent contractors (<$5M revenue) are a risk segment — high
              in quantity but low in ACV, with higher churn likelihood.

              Budget ownership in the contractor segment is predominantly owner-driven for small businesses, where
              technology investment is typically viewed as operational overhead rather than capital expenditure. For
              larger firms with PE backing, software investments may qualify for operational improvement capex within
              portfolio thesis spending. Adoption triggers differ materially by segment: scale pressure and PE audit
              requirements drive enterprise adoption; labor shortages and invoice cycle acceleration drive mid-market
              adoption; competitive bidding pressure drives small contractor adoption of AI-powered estimating tools.
              The Meritech Capital investment thesis explicitly cited BuildOps' "highly configurable" platform enabling
              customization per contractor workflow as a key differentiator across these segments.
