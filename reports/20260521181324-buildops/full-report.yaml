      - number: '8.4'
        title: Adverse Analysis, Down-Round Risk, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The central adverse risk is that BuildOps' ~10.3x implied EV/revenue multiple is above the public comp
              range and at the high end of the vertical SaaS premium band — yet cannot be validated externally. SaaS
              Capital's 2025 equity-backed median of 5.3x ARR applies to companies with disclosed metrics; companies
              with NRR below 100% or growth below 30% attract materially less. If BuildOps' undisclosed NRR is below
              100%, or gross margin below 60% — both possible given heavy implementation, services, and headcount
              investment posture — the appropriate multiple re-anchors to 4–6x, implying a down-round at next financing.
              GetLatka's $97.4M revenue estimate carries material uncertainty: the same profile cites an internal
              inconsistency placing BuildOps' $1B valuation as early as 2022, conflicting with the March 2025 Series C
              coverage and undermining data quality. Acquiry's 2026 SaaS valuation framework identifies NRR as the
              single most important multiple driver — a 120% NRR business commands 30–50% higher multiples than a 100%
              NRR peer — and all three key drivers (NRR, CAC payback, gross margin) are unverified for BuildOps.
              Crunchbase's 2026 SaaS IPO analysis is explicitly adverse: no venture-backed SaaS unicorns filed new IPOs
              through May 2026, SaaS stocks face pressure from AI disruption concerns, and ServiceTitan itself has
              fallen ~48% from its IPO peak despite a Moderate Buy analyst consensus. This validates why IPO is unlikely
              as a near-term exit and increases reliance on strategic M&A. Management's stated deprioritization of
              profitability, combined with 291 planned Raleigh jobs at $100k+ average salary, implies continued elevated
              cash consumption from Series C proceeds. The 2021-era unicorn reset precedent — 15–25x to 4–8x down rounds
              — remains material even though BuildOps' 2025 raise occurred after the initial correction cycle.
            claimRefs:
              - CV024
              - CV025
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV037
          - type: table
