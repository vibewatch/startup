      - number: '2.4'
        title: Growth Drivers
        blocks:
          - type: paragraph
            body: >-
              Several structural and cyclical forces are accelerating commercial contractor software adoption through
              2026 and beyond. Federal infrastructure investment is the most immediate catalyst: the Infrastructure
              Investment and Jobs Act (IIJA), CHIPS Act, and Inflation Reduction Act have collectively injected massive
              capital into construction and MEP contractor demand. The IIJA alone has made approximately $177.5B in
              outlays with $431.8B still available through September 2026. Data center construction — driven by AI
              computing demand and electrification — is outperforming the broader commercial market and requires
              sophisticated MEP coordination across HVAC, electrical, and mechanical trades. The IRA provides up to
              $2,000 per installation in tax credits for energy-efficient HVAC systems, propelling commercial upgrade
              demand.

              The labor shortage is the most persistent driver. The Associated General Contractors reports that 83% of
              firms with open positions report the same or greater difficulty hiring versus a year ago, with the 2026
              hiring gap estimated at approximately 500,000 workers industry-wide per a Trimble survey of 1,800
              contractors. BuildOps' own survey of 606 contractors (August 2025) found that nearly half of all
              contractors have more than one in five positions unfilled. When labor is the binding constraint, software
              that enables each technician to handle more dispatch, billing, and administrative work without additional
              headcount has a clear ROI argument.

              Private equity consolidation in the trades is creating a new class of enterprise buyer. PE platforms that
              aggregate specialty contractors need a common technology spine for financial reporting, compliance, and
              cross-location dispatch. Service Logic — the largest privately held HVAC and mechanical services network
              in the US — exceeded $2B in revenue in 2024 with 100+ locations using BuildOps, illustrating the
              enterprise multi-location adoption pattern. The BuildOps Series C announcement noted interest from
              PE-backed contractors as a material demand driver. Industry M&A activity in the MEP space remained high
              through early 2026 per Current Capital, with private equity platforms as the dominant acquirer type.

              AI adoption momentum is real if uneven: 78% of commercial contractors in the BuildOps survey reported
              already using or testing AI tools — a figure that would have seemed implausible three years earlier. The
              ServiceTitan 2026 Commercial Specialty Contractor Industry Report confirmed that 38% of contractors now
              report measurable business impact from AI, up from 17% in 2025.
