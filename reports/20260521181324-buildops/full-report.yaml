  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              BuildOps defines its target market as commercial specialty contractors — firms that install, service, and
              maintain mechanical, electrical, and plumbing (MEP) systems in commercial buildings, industrial
              facilities, and infrastructure. The included spend covers recurring service agreements, scheduled
              preventive maintenance, emergency dispatch, and project-based construction work for commercial clients,
              all mediated through trade-specific workflows (dispatch, work orders, invoicing, purchase orders,
              payroll). Excluded from the core market are residential trade contractors (HVAC, plumbing, electrical for
              single-family homes, the primary domain of ServiceTitan), horizontal construction (roads, bridges), and
              general contractors whose workflow centers on general contracting rather than trade-specific service.
              Adjacent segments include fire/life safety inspection and testing, refrigeration and cold storage
              maintenance, and facilities management software for the building owner side — all of which BuildOps has
              stated intentions to address over time.

              The status-quo substitutes that BuildOps displaces are formidable: disconnected spreadsheets remain in use
              at a large fraction of the contractor base (nearly 90% of construction spreadsheets contain errors per
              industry research), pen-and-paper dispatch boards, legacy on-premise ERP modules from enterprise vendors
              such as Sage, Acumatica, or Viewpoint, and loosely integrated point-solution stacks (separate scheduling,
              invoicing, and payroll tools with no common data backbone). ServiceTitan's own 10-K characterizes the
              broader trades market as "in its early phases of development" with many businesses "still relying on a
              combination of rudimentary workflows" — a condition that describes both the opportunity and the adoption
              drag BuildOps faces. The US commercial contractor base is fragmented across approximately 500,000
              construction contracting businesses, of which over 80% have fewer than ten employees, making per-seat
              enterprise SaaS economics difficult for the smallest operators and concentrating BuildOps' near-term SAM
              in mid-market and larger firms.
