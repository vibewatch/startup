              - CV028
              - CV043
      - number: '8.5'
        title: Final Diligence Asks and Exit Readiness
        blocks:
          - type: paragraph
            body: >-
              Six categories of evidence are essential before committing capital at the $1B entry. Most critical:
              audited ARR and GAAP revenue with quarterly bridge and revenue recognition methodology — the GetLatka
              $97.4M estimate is directionally useful but not investment-grade. Second: GAAP gross margin broken out
              between software subscription and professional services — a blended margin below 65% re-anchors the
              applicable multiple toward 5–6x. Third: net revenue retention across all customer cohorts, the single most
              important SaaS valuation driver per Acquiry's 2026 analysis and the primary lever for premium multiple
              justification. Fourth: monthly cash burn and cash-on-hand post-Series C close, to assess dilution risk
              from future financing rounds. Fifth: cap table and liquidation waterfall covering preference stack,
              anti-dilution provisions, and option pool size — all currently undisclosed. Sixth: top-10 customer ARR
              concentration, to assess platform retention risk if anchor customers churn. On exit readiness: the active
              2026 construction tech M&A market — with Autodesk, Trimble, and PE roll-ups acquiring vertical platforms —
              creates a credible strategic exit pathway at $500M–$1.5B depending on financial quality. An IPO path is
              unlikely given the hostile 2026 SaaS public market. The most realistic 3–5 year exit is a strategic
              acquisition or secondary buyout, both of which reward demonstrated NRR, gross margin, and path to
              profitability over raw growth rate.
            claimRefs:
              - CV030
              - CV033
              - CV025
          - type: table
            tableRef: TV006
            claimRefs:
              - CV030
              - CV031
              - CV040
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Premium Entry Without Quality-of-Revenue Validation
            body: >-
              BuildOps' implied EV/revenue multiple of approximately 10.3x — computed at $1B post-money against
              GetLatka's unaudited $97.4M 2025 estimate — is 2–4x above ServiceTitan's ~5.0x and Procore's ~4.6x current
              public trading levels, and above the private SaaS equity-backed median of 5.3x ARR. NRR, gross margin, and
              burn rate are entirely undisclosed. The premium is not inherently unjustifiable for an 87.7%
              implied-growth company, but it cannot be validated without audited financials. The current evidence base
              does not support underwriting this level of premium at entry; investor should treat this as a conditional
              Hold until disclosure gaps are resolved.
            calloutType: risk
            claimRefs:
              - CV011
              - CV030
              - CV037
          - type: callout
            title: Marquee Investor Syndicate Provides Institutional Credibility Signal
            body: >-
              Meritech Capital Partners — whose portfolio includes Braze, Datadog, Facebook, Salesforce, Snowflake, and
              Tableau — led the $127M Series C. BOND Capital and SE Ventures (Schneider Electric) joined as new
              investors. Prior backers include Founders Fund, Bessemer Venture Partners, and B Capital. The quality of
              the syndicate is a strong signal that BuildOps has passed institutional-grade diligence at multiple stages
              and provides reputational anchor for the $1B valuation, though it does not substitute for disclosed NRR,
              gross margin, and burn in underwriting the entry.
            calloutType: strength
            claimRefs:
              - CV002
              - CV003
              - CV026
              - CV040
          - type: callout
            title: 'Track: Monitor Execution and Require Financial Disclosure Before Committing'
            body: >-
              The recommendation is Track. BuildOps demonstrates compelling scale signals — unicorn status, marquee
              customer adoption, implied 87.7% ARR growth, and a premium investor syndicate — but the
              private-undisclosed financial profile prevents underwriting the ~10.3x implied EV/revenue multiple at
              entry. Priority actions: obtain audited ARR, gross margin, NRR, and burn rate through a formal data-room
              process; engage management on cap table and dilution profile; and reassess the bull/base/bear scenarios
              with disclosed metrics before committing capital at or near current entry.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV030
              - CV041
              - CV042
              - CV043
          - type: callout
            title: GetLatka Revenue Estimate Is Directionally Useful but Not Investment-Grade
            body: >-
              The $97.4M 2025 revenue estimate from GetLatka is the most widely cited topline anchor for BuildOps, but
              it is a third-party estimate, not an audited figure. The same GetLatka profile contains an internal
              inconsistency — citing a $1B valuation as early as 2022 — that conflicts with the March 2025 Series C
              coverage and undermines confidence in the underlying data. The implied 87.7% YoY growth from the GetLatka
              2024 figure of $51.9M is directionally consistent with BuildOps' hiring activity but cannot be
              independently corroborated from public filings. All implied multiples and scenario analyses in this
              chapter are conditioned on this estimate and should be revised once audited revenue data is available.
            calloutType: assumption
            claimRefs:
              - CV009
              - CV031
