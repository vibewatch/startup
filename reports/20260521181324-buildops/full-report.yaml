      - number: '5.5'
        title: Trust, Security, and Compliance
        blocks:
          - type: paragraph
            body: |-
              BuildOps published a Privacy Policy last updated August 15, 2025. The policy describes data
              collection including GPS location data, job records, customer contact information, and
              financial data. It states that "all information you provide to us is stored on third-party
              secure servers behind firewalls" but does not name the cloud provider or certify specific
              security controls. The policy explicitly prohibits sharing mobile messaging opt-in data with
              third parties or affiliates for marketing purposes, which is notable for a platform that
              handles technician and customer communication data.

              BuildOps operates a Trust Center at trust.buildops.com and a Security page at
              buildops.com/security/. Both pages returned near-zero substantive content in public-facing
              HTML during this review — both rely heavily on JavaScript rendering and expose minimal
              auditable information to an unauthenticated visitor. No SOC 2 Type I or Type II report,
              ISO 27001 certificate, or equivalent third-party security audit was confirmed from any
              publicly accessible source as of May 2026. The absence of public security certification
              is a material gap for enterprise commercial contractors who must vet their software
              supply chain and for multi-site contractors whose BuildOps instance holds sensitive
              GPS location, financial, and customer data.

              No SLA, uptime guarantee, or published incident response timeline was found in public
              product pages or terms of service. The status.buildops.com page exists but its public
              content was minimal. These gaps create opacity around operational reliability that
              prospective buyers should address in due diligence.
