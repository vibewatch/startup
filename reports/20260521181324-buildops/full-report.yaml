      - Likely limitation versus BuildOps
    rows:
      - - BuildOps
        - Direct vertical
        - Commercial MEP contractor running service plus projects
        - Private; no public operating metrics in this chapter
        - Commercial-specific service-project unification and job financial visibility
        - Limited public pricing transparency; rollout and reporting friction appear material in reviews
      - - ServiceTrade
        - Direct vertical
        - Compliance-heavy commercial service contractor
        - 1,300+ customers
        - Inspection evidence, digital proposals, customer portal
        - Less obviously optimized for high-volume emergency routing or broader project workflows
      - - simPRO
        - Direct vertical
        - Inventory-heavy commercial or electrical contractor
        - 9,000 businesses; 250,000+ users
        - Granular job costing, estimating, inventory, multi-phase commercial depth
        - ERP-like learning curve and heavier adoption burden
      - - ServiceTitan commercial
        - Direct vertical / mixed
        - Large service enterprise or mixed residential-commercial operator
        - Public-company reporting cadence; exact commercial mix undisclosed
        - Commercial costing, maintenance pull-through, AI field assistance
        - Independent sources still frame it as more residential or large-service oriented than BuildOps
      - - Procore
        - Adjacent project platform
        - Specialty contractor prioritizing collaboration and project controls
        - 3M individual users; public-company reporting
        - Unlimited-user collaboration, project execution, cash-flow control
        - Recurring service dispatch and PM workflows are not its public center of gravity
      - - Salesforce Field Service
        - Horizontal FSM
        - Enterprise already standardized on Salesforce
        - Public pricing and public-company backing
        - Dispatcher-technician-contractor role segmentation and CRM-native AI
        - Requires contractor-specific configuration to match trade workflows
      - - Dynamics 365 Field Service
        - Horizontal FSM
        - Enterprise already standardized on Microsoft ERP/CRM
        - Public pricing and Microsoft platform backing
        - Contractor SKU, schedule-board tooling, Copilot and maintenance roadmap
        - Also configuration-led rather than contractor-native
      - - Spectrum / Trimble
        - ERP incumbent
        - Service-plus-construction contractor wanting field-to-office ERP depth
        - Trimble ARR $2.43B in Q1 2026
        - Unified service and construction ERP inside Trimble Construction One
        - Heavier enterprise footprint and potentially older UX expectations
