      - number: '2.6'
        title: Sizing Diligence Gaps and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >-
              The most material diligence gap is the absence of any independently published estimate for the North
              American commercial-contractor-specific FSM software SAM. All available analyst figures cover broad FSM
              (utilities, telecom, manufacturing, healthcare) or broad construction management software; no analyst has
              isolated the purpose-built commercial contractor sub-vertical. The analyst range for global FSM
              ($5.1B–$5.7B, 2025) vs. the CAGR range (9.5%–16%) is itself significant — the divergence is
              methodological, with lower CAGR estimates reflecting the utility/telecom saturation drag and higher
              estimates reflecting AI-infused expansion scenarios. Neither speaks directly to BuildOps' serviceable
              opportunity.

              BuildOps' own "$300B+ industry" framing conflates total contractor revenue with software TAM. Even a 1%
              software spend rate on $300B implies a $3B software market — a potentially optimistic assumption given
              that most small contractors spend far less than 1% of revenue on FSM software. The contractor revenue
              market ($1.66T global HVAC/plumbing; $698B US MEP) further illustrates that the revenue base is enormous
              but actual software wallet share remains a small fraction with no public benchmark.

              Contradictory signals also exist at the adoption layer: BuildOps' own survey reported 78% AI usage or
              testing among 606 contractors, while the RICS global survey of 2,200+ professionals found 45% with no AI
              implementation. These figures are not necessarily contradictory — the BuildOps survey captures a
              self-selected cohort of contractors who engage with BuildOps content, while RICS captures a broader global
              sample — but the gap underscores the difficulty of mapping any single adoption metric to market-wide
              penetration. Investors should treat both data points as directional rather than census-accurate.

              A further diligence path is needed to size the PE-backed multi-location contractor segment specifically,
              as this cohort may represent a disproportionate share of BuildOps' enterprise ACV while being distinct
              from the fragmented small-contractor base. Current Capital's MEP M&A report (March 2026) provides a window
              into platform transaction activity but does not publish software spend data.
            claimRefs:
              - CM019
              - CM038
              - CM039
              - CM040
              - CM041
              - CM042
