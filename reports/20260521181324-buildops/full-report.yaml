      - number: '5.2'
        title: Platform Architecture and Integrations
        blocks:
          - type: paragraph
            body: |-
              BuildOps is a multi-tenant cloud-based SaaS product. Its underlying infrastructure provider
              and technology stack are not publicly disclosed. The company operates a status page at
              status.buildops.com and a security page at buildops.com/security/, but neither page exposed
              substantive detail in public-facing HTML during this review. The Sage Intacct marketplace
              listing documents the product scope as covering customer management, quoting, service
              agreements, invoicing, scheduling, dispatching, project management, and a technician mobile
              app — corroborating the module breadth described in official product pages.

              BuildOps natively integrates with seven accounting and ERP systems: QuickBooks Desktop,
              QuickBooks Online, Sage Intacct, Oracle NetSuite, Viewpoint Vista, Viewpoint Spectrum, and
              Miter (HR/payroll). Dedicated integration pages for each confirm the two-way data sync
              architecture: field data captured in BuildOps (invoices, work orders, purchase orders, time
              entries) is pushed to the accounting system automatically, eliminating manual re-entry.
              The Slashdot software catalog also lists Data Xchange and hh2 Cloud Services as BuildOps
              integration options for construction payroll and project data synchronization. The breadth of
              certified accounting integrations — seven named ERP/accounting systems — is the widest in the
              commercial trade-contractor niche among public product disclosures reviewed.

              BuildOps offers REST API and webhooks via a developer center at developer.buildops.com.
              The developer portal exists but requires invitation through a customer success manager or
              integration manager; no publicly accessible API reference documentation was found. The
              BuildOps Certified Partner Program, launched in 2025–2026, connects customers with vetted
              implementation partners and opens a channel for integration partners to build on the platform.
              The Inspect Point fire & life safety inspection platform partners with BuildOps to enable
              technician inspection workflow handoff between systems; a co-marketing webinar in 2026
              documented the integration as targeting fire protection contractors.
