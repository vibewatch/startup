      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: |-
              BuildOps was co-founded in 2018 by three partners. Alok Chanani (CEO) is a U.S. Army
              veteran who served as a Captain in Iraq and received the Meritorious Service Medal for
              distinguished combat service. After the Army, he built commercial real estate and
              construction operations in Southern California (USA Commercial), giving him first-hand
              visibility into contractor technology gaps that inspired BuildOps. He holds an MBA from
              The Wharton School and a BA in Economics from Cornell University, and was named to the
              Los Angeles Business Journal 2026 LA500 list of the city's 500 most influential executives.
              Steve Chew (co-founder, original COO) previously held roles at Microsoft, Nextag, and
              Fundly and lent enterprise software expertise to the company. Neeraj Mittal (founding CTO)
              was formerly Director of Engineering at ServiceTitan; TechCrunch confirmed that Mittal is
              no longer with the company as of March 2025, creating a material key-person risk given his
              early engineering influence.

              The current executive team reflects a deliberate upgrade to enterprise SaaS experience. John
              Laino was promoted to COO in November 2024 after nearly two years at BuildOps, bringing prior
              tenures at ServiceTitan, ZipRecruiter, Salesforce, and Accenture. Greg Gillis joined as CRO
              in December 2025, having previously scaled Coupa Software from roughly $300 million to over
              $1 billion in revenue. Colin Piper joined as the company's first CMO in 2025, with 15 years
              of construction software marketing experience including senior roles at Autodesk's AECO
              division. Dzmitry Markovich was appointed CTO in May 2026, arriving from Apollo.io (where he
              was SVP Engineering) and Dropbox (VP Engineering through its 2018 IPO); he had served on the
              BuildOps advisory board since 2023. Will Lehrmann serves as Chief Product Officer, previously
              a long-tenured Procore executive. Board representation includes Paul Madera (Meritech Capital,
              joined with Series C), Dick Costolo (01 Advisors, joined with Series B), and Matthew Cowan
              (Next47, joined with Series A).
