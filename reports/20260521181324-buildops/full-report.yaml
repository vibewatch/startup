      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Kill Criterion: ServiceTitan Parity in Commercial Project Management'
            body: >
              BuildOps' primary differentiation rests on being purpose-built for commercial contractors versus
              ServiceTitan's residential-first heritage. If ServiceTitan achieves demonstrable parity in commercial
              project management depth—evidenced by independent feature benchmarks or measurable win-rate declines—the
              thesis foundation collapses. The risk is compounded by ServiceTitan's $961M revenue base and
              public-company capital allocation flexibility, which dwarfs BuildOps' ability to sustain a feature war.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
          - type: callout
            title: 'Material Risk: AI Regulatory Exposure Under CPRA (2026)'
            body: >
              The CPPA's January 2026 ADMT regulations impose immediate pre-use notice and opt-out obligations on
              BuildOps' AI workflows. As OpsAI expands from scheduling support to proactive financial alerting, the
              company's obligations under the CPRA's "significant decisions" test will intensify. Non-compliance
              penalties reach $7,988 per violation—manageable individually, but threatening at enterprise scale if
              systemic process gaps exist.
            calloutType: risk
            claimRefs:
              - CR021
              - CR022
              - CR023
              - CR025
          - type: callout
            title: 'Assumption: No Undisclosed Litigation or Regulatory Investigation'
            body: >
              This chapter's risk assessment assumes no ongoing, sealed, or non-disclosed litigation or regulatory
              investigation against BuildOps. As a private company, BuildOps has no obligation to publicly disclose
              pending litigation. Diligence must include a direct representation from management regarding pending
              claims and a third-party litigation search.
            calloutType: assumption
            claimRefs:
              - CR025
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Financing Context, and Recommendation
        blocks:
          - type: paragraph
            body: >-
              BuildOps closed its $127M Series C on March 21, 2025, achieving a $1B post-money valuation and entering
              unicorn status. The round was led by Meritech Capital Partners — whose portfolio includes Braze, Datadog,
              Facebook, Salesforce, Snowflake, and Tableau — with new participation from BOND Capital and SE Ventures,
              the corporate venture arm of Schneider Electric. Existing investors Fika Ventures, Next47, StepStone
              Group, and Titanium Ventures continued. Prior supporters include Founders Fund, Bessemer Venture Partners,
              B Capital, MetaProp, 137 Ventures, and Liquid2. Total capital raised across all rounds stands at
              approximately $226M per Tracxn. Meritech partner Paul Madera joined the board alongside former Twitter CEO
              Dick Costolo, Fika founder TX Zhuo, former Boost Mobile CEO Stephen Stokols, and Next47 General Partner
              Matthew Cowan. Series C proceeds are directed at AI technology acceleration — predictive analytics,
              AI-powered scheduling, and real-time project tracking — rather than near-term profitability, which
              management has explicitly deprioritized in favor of R&D, headcount, market reach, and customer
              acquisition. Paul Madera described BuildOps as filling "an industry-wide need" in "a very large market
              that is wide open." The investment thesis rests on BuildOps becoming the definitive commercial trades
              platform across HVAC, electrical, plumbing, and multi-trade specialty contractors in a market historically
              underserved by software. The anti-thesis is that the implied entry multiple (~10.3x EV/revenue) is
              materially above public comp trading, quality-of-revenue metrics are entirely undisclosed, and the 2026
              SaaS exit environment limits near-term liquidity. The recommendation is Track: obtain audited financials,
              NRR, gross margin, and burn before committing capital.
