      - number: '5.3'
        title: OpsAI and AI Capabilities
        blocks:
          - type: paragraph
            body: |-
              OpsAI is BuildOps's embedded artificial intelligence layer, first launched in 2023 under
              the brand "AI for the Trades." BuildOps describes it as trained on commercial contracting
              workflows, covering dispatch, service billing, and project margins — though the underlying
              model architecture, training data composition, and any third-party AI provider used are not
              publicly disclosed. The April 2026 product update — documented in BuildOps's monthly product
              webinar landing page — focused specifically on OpsAI integration with document control,
              including the ability to flag stalled approvals and missing backup in RFI and submittal
              workflows as part of the new Projects module.

              OpsAI currently performs the following automatable tasks per company disclosures: refining
              field technician notes to reduce reporting errors; translating text for multi-language
              workforces; scanning invoices and equipment assets for data capture; providing real-time
              troubleshooting assistance to field technicians; and automating dispatch recommendations.
              The platform also provides AI-assisted quoting and scheduling automation. OpsAI's
              capabilities are positioned as embedded across all workflow steps rather than as a
              standalone AI add-on.

              BuildOps CEO Alok Chanani, in an article published by AIM Media House at the time of the
              company's Series C, stated that "contractors deserve better software" and positioned OpsAI
              as enabling contractors to increase productivity, expand business, and optimize workforce
              through task automation and insight extraction. New CPO Will Lehrmann (previously from
              Procore) and new CTO Dzmitry Markovich (previously from Apollo.io and Dropbox) signal an
              executive push to deepen AI infrastructure. However, the specific AI models powering OpsAI,
              the training evaluation benchmarks, and data governance practices are not externally
              validated — a material gap for buyers making procurement decisions that embed AI into
              mission-critical contractor workflows.
            claimRefs:
