      - number: '7.4'
        title: Partner, Financial & Funding Risks
        blocks:
          - type: paragraph
            body: >
              SE Ventures, the €1 billion venture arm of Schneider Electric, participated in BuildOps' $127M Series C
              alongside lead investor Meritech Capital Partners and BOND Capital. SE Ventures publicly discloses that
              more than 60% of its portfolio investments involve a commercial partnership with Schneider Electric's
              global customer base. This creates a dual dependency: BuildOps benefits from potential channel access to
              Schneider Electric's industrial customer network, but that access is contingent on continued strategic
              alignment between SE Ventures and Schneider Electric's corporate priorities—which can shift with
              leadership changes, Schneider's own M&A, or carbon-tech re-prioritization within its portfolio mix.

              The financial risk profile is opaque. BuildOps' CEO Alok Chanani explicitly stated in a March 2025 Reuters
              interview that "profitability is not a core focus of the business right now," confirming ongoing net
              losses. No ARR, gross margin, burn rate, or net revenue retention figures have been disclosed publicly.
              The company targets 100% YoY revenue growth, implying meaningful capital consumption to fuel sales-force
              expansion, R&D, and customer success at scale. With the broader construction sector contracting (-2.2%
              non-residential in 2026 per Atradius) and tariffs at a generational high, demand-side slowdown could
              compress new-logo growth precisely when the company is most reliant on it.

              Macroeconomic risk is sector-specific. The AGC's 2026 Hiring and Business Outlook reports "dampened"
              contractor expectations driven by recession fears and tariff-driven materials cost inflation. Deloitte's
              2026 E&C Outlook documents an 88.2% YoY increase in project abandonment in August 2025. If commercial
              contractors reduce headcount or defer software investment, BuildOps' ARR growth could stall without
              proportional cost reduction, intensifying burn. A potential funding gap materializes if capital markets
              tighten or a re-rating of SaaS multiples compresses the valuation basis for future rounds or an IPO.
            claimRefs:
