    columns:
      - Moat or threat
      - Who benefits
      - Severity
      - Why it matters
      - Likely win-loss implication
      - Diligence ask
    rows:
      - - Commercial workflow specificity
        - BuildOps
        - Medium-High
        - Commercial service-plus-project unification is narrower and more specific than generic FSM positioning
        - Helps win true commercial MEP accounts with mixed dispatch and project needs
        - Measure win rates by trade and by service-plus-project complexity
      - - Inspection and portal specialization
        - ServiceTrade
        - Medium
        - >-
          Compliance-heavy contractors may value proof-of-work and customer portal evidence above generalized workflow
          breadth
        - BuildOps can lose in fire/life-safety and inspection-led accounts
        - Quantify BuildOps portal and deficiency-report adoption versus ServiceTrade
      - - Inventory and ERP depth
        - simPRO / Jonas / Spectrum
        - Medium-High
        - Job-costing and back-office control can outweigh UI elegance for larger contractors
        - BuildOps can lose where finance and inventory leaders drive vendor choice
        - Request replacement studies where BuildOps displaced or lost to ERP incumbents
      - - Bundle and installed-base power
        - Microsoft / Salesforce / Procore / Trimble
        - High
