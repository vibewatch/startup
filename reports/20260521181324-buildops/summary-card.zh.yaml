summary:
  headline: BuildOps 是高速增长的商用 FSM 独角兽，垂直场景有防守性；但 $1B 估值约等于估计 ARR 的 10×，且 NRR、毛利率都未披露，入场必须建立在极强执行假设上，需要谨慎。
