callouts:
  - calloutType: "risk"
    title: "The Scale Moat: Why Process IP Failed Against Asian Incumbents"
    body: "24M's strategic hypothesis was that eliminating cell casings and slurry drying would deliver up to 40% manufacturing cost reductions, enticing global OEMs into licensing contracts. In reality, Asian battery incumbents like CATL, BYD, and Panasonic achieved comparable cost reductions through sheer gigawatt-hour scale, raw material vertical integration, and aggressive pricing, completely neutralizing 24M's theoretical process advantages while avoiding partner redesign risks."
    claimRefs:
      - "CP003"
      - "CP010"
      - "CP014"
      - "CP016"
