company:
  name: 24M Technologies
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence does not support a current, underwritable price for 24M Technologies.
    A secondary registry reports a $1.3 billion June 2024 valuation and another database
    reports an $87 million September 2024 financing, but primary transaction terms,
    current financials, preference rights, and a present liquidity path are absent.
sections:
  - id: decision-and-entry-discipline
    title: Decision and entry discipline
    body: >-
      The appropriate decision is research-more rather than assigning a synthetic enterprise
      value or target return. The strongest price marker in the assigned evidence is a
      third-party registry entry of $1.3 billion in June 2024; that same entry does not disclose
      the round amount, investors, revenue multiple, or stage multiple. A later database preview
      reports an $87 million Series H in September 2024, but it does not expose the cap table or
      economic terms. Those records cannot establish a current entry price as of the run date.
      The no-go posture is therefore price-sensitive: it can change only after current corporate
      status, primary financing documents, fully diluted ownership, preferences, debt, and
      operating evidence are verified. Confidence is medium in withholding an investment call,
      but low in any precise valuation because the denominator and transaction rights are missing.
    claimRefs: [CV001, CV002, CV003, CV013, CV014]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-downside-signals
    title: Financing context and downside signals
    body: >-
      The financing record contains a material downside signal that a headline valuation cannot
      capture. A November 2024 agreement terminated FREYR license and services arrangements dating
      from 2020 and 2021. It also required a $3 million services payment while FREYR relinquished
      rights associated with 6,975,956 Series G preferred shares, which 24M could redeem for one
      dollar. The document does not disclose 24M's complete capitalization, so the transaction
      should not be generalized into a company-wide per-share value. It does show that partner,
      license, and preferred-equity rights can be reset on terms that materially differ from a
      stale headline mark. Any new investment must therefore be conditioned on the current charter,
      capitalization table, preference stack, partner economics, and all amendments since that
      agreement rather than on a registry valuation alone.
    claimRefs: [CV004, CV005, CV006, CV013, CV014]
    tableRefs: [TV002]
  - id: scenarios-and-comparable-evidence
    title: Scenarios and comparable evidence
    body: >-
      Commercial evidence provides optionality but not a comparable valuation bridge. A
      company-issued announcement said Kyocera planned to double annual production capacity from
      20,000 units by fiscal 2026, supported by a JPY 10 billion line investment and a targeted
      400 MWh annual capacity. Another company release said Eternalyte was immediately available
      and compatible with existing manufacturing processes. These are relevant milestone signals,
      yet they do not disclose 24M revenue, royalties, margins, cash generation, customer
      concentration, or audited deployment outcomes. The available valuation registry explicitly
      lacks EV/revenue and stage multiples, while the assigned source pool contains no transaction
      data for a genuinely comparable public company or acquisition. Bull, base, and bear cases
      must therefore remain conditional and non-numeric; attaching probabilities or ranges would
      create precision unsupported by the evidence.
    claimRefs: [CV007, CV008, CV009, CV013, CV015]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness and final diligence asks
    body: >-
      The evidence does not establish exit readiness. EquityZen describes a mechanism through
      which accredited investors may buy private-company interests and, if eligible, resell through
      an Express Deal, but the page supplies no 24M price, completed transaction, bid depth, or
      expected holding period. The EquityBee result is unusable as valuation evidence because its
      body discusses Reddit and generic placeholders rather than 24M. A World Economic Forum
      directory entry confirms only a broad company description, not economics. Before any price
      discussion, diligence should obtain current corporate standing, board-approved financing
      documents, an audited cap table, liquidation preferences, debt and liens, cash and runway,
      customer-level royalties, signed backlog, and evidence of secondary demand. A thesis break
      is failure to verify those records or evidence that partner terminations, preference
      overhang, or commercialization shortfalls eliminate a credible risk-adjusted return.
    claimRefs: [CV010, CV011, CV012, CV014, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Evidence-based view, Decision implication]
    rows:
      - [Recommendation, "Research more; do not underwrite at a stated price", "No investment decision until current primary records are verified"]
      - [Confidence and risk, "Medium confidence in the no-go posture; high information and rights risk", "Treat missing terms as a gating issue, not a discount estimate"]
      - [Valuation stance, "$1.3B is a June 2024 secondary registry mark, not a current verified transaction price", "Do not anchor negotiations or returns to the registry mark"]
    notes: "Views use only the assigned public source pool; no current primary financing terms, audited financials, or fully diluted capitalization were available."
    claimRefs: [CV001, CV002, CV003, CV013, CV014]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Argument, What would change the view]
    rows:
      - [Thesis, "Kyocera's announced production expansion is evidence of a commercial deployment path", "Customer-verified volumes, royalties, margins, and sustained utilization"]
      - [Thesis, "Eternalyte was presented as available for integration into existing manufacturing", "Independent qualification results and contracted revenue from adopters"]
      - [Anti-thesis, "FREYR terminated license and services agreements and relinquished preferred-equity rights", "Evidence that replacement partners and economics more than offset the terminated relationship"]
      - [Anti-thesis, "Current price, preference stack, and financial denominators are not public in the assigned evidence", "Primary round documents, audited financials, and a verified cap table"]
    notes: "The positive evidence is company-issued and describes plans or product claims; the adverse contractual terms are primary legal evidence but do not disclose the whole capitalization."
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009, CV013, CV015]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Case, Explicit assumptions, Valuation and return logic, Probability signal and downside trigger]
    rows:
      - [Bull, "Kyocera reaches the announced FY2026 expansion and new products convert into material, defensible licensing cash flows", "Re-underwrite from verified royalties and transaction terms; no public numeric range is supportable", "Low-support upside signal; breaks if deployments do not produce customer-verified economics"]
      - [Base, "Technical commercialization continues but financial contribution and current ownership rights remain undisclosed", "Research-more with no price; require a return model built from audited revenue, cash, dilution, and preferences", "Most evidence-consistent posture; breaks toward bull only after primary economic proof"]
      - [Bear, "Partner resets recur, commercialization underperforms, or preference and liquidity terms impair common-equity recovery", "Value cannot be bounded from the assigned public evidence and may be materially below the dated registry mark", "Credible downside signal; triggered by unverifiable corporate records or further partner-rights impairment"]
    notes: "Scenario labels are qualitative, not probability estimates; public evidence lacks current financial denominators, transaction rights, and a defensible comparable multiple."
    claimRefs: [CV004, CV006, CV007, CV008, CV009, CV013, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: "The investment decision remains gated because commercialization signals do not bridge to current economics or rights."
    data:
      nodes:
        - id: commercial-signal
          label: Commercial signal
          detail: "Kyocera expansion and product availability claims indicate potential adoption."
        - id: economic-proof
          label: Economic proof missing
          detail: "Revenue, royalties, margins, retention, and audited deployment outcomes are absent."
        - id: rights-reset
          label: Rights reset observed
          detail: "The FREYR termination changed license and preferred-equity rights."
        - id: price-anchor
          label: Price anchor is stale
          detail: "The $1.3B registry mark is dated June 2024 and lacks transaction detail."
        - id: exit-proof
          label: Exit proof missing
          detail: "A marketplace mechanism is described, but no 24M price or completed liquidity is shown."
        - id: recommendation
          label: Research more
          detail: "Withhold a price and investment call until primary records close the gaps."
    approximationNotes: "This is a qualitative decision chain; node order does not assign weights or probabilities."
    claimRefs: [CV006, CV007, CV009, CV011, CV013, CV016]
callouts:
  - calloutType: recommendation
    title: Price-sensitive decision
    body: >-
      Do not convert the June 2024 registry mark into a present enterprise value. Reopen the
      investment case only with verified current status, primary financing terms, a fully diluted
      cap table, preference and debt schedules, audited operating results, and customer economics.
    claimRefs: [CV001, CV013, CV014, CV016]
