evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: scale-metrics
    missingEvidence: >-
      Audited revenue or run-rate, cumulative funding, customer count, current headcount, cash balance, and
      financing-to-date schedules.
    whyItMatters: The dated financing and partner milestones cannot establish present scale, liquidity, or business-model economics.
    diligencePath: >-
      Obtain audited financial statements, the current capitalization table, bank statements, customer schedules, and an
      employee roster from management or a transaction data room.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: stale
    severity: blocking
    topic: current-status
    missingEvidence: A reliable source establishing 24M's legal and operating status as of the 2026-10-09 run date.
    whyItMatters: >-
      The latest assigned dated product announcement is from March 2025, so historical valuation and partnership facts
      cannot support a current-stage conclusion.
    diligencePath: >-
      Review current state corporate records, recent court or insolvency dockets, current management confirmation, and
      dated statements from material partners.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance-and-stakeholders
    missingEvidence: >-
      A complete current board roster, executive history, capitalization table, investor rights schedule, and full
      partner list.
    whyItMatters: >-
      The public leadership and stakeholder samples do not establish control, succession, ownership concentration, or
      the complete population of economically important relationships.
    diligencePath: >-
      Obtain board minutes, charter documents, financing agreements, investor-rights schedules, management histories,
      and the complete customer and partner register.
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: royalty-economics
    missingEvidence: >-
      Audited financial disclosure or licensee contract exhibits detailing exact recurring royalty rates, per-kWh
      licensing fees, and milestone payment schedules.
    whyItMatters: >-
      Without disclosed royalty economics, analysts cannot model 24M's true addressable revenue take-rate from announced
      licensee capacity (e.g., Kyocera's 400 MWh line).
    diligencePath: >-
      Review SEC filings of publicly traded licensing partners or request confidential licensing fee schedules during
      data room diligence.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Granular $/kWh contract pricing and royalty basis points across 24M licensing agreements compared to tier-one
      merchant cell supply agreements.
    whyItMatters: >-
      Without contractual royalty rates, evaluating whether 24M offered genuine cost savings versus declining commodity
      battery pricing is impossible.
    diligencePath: Review confidential licensing schedules and customer procurement audits under NDA.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: incumbent-comparative-benchmarks
    missingEvidence: >-
      Third-party independent head-to-head cycle life and thermal runaway test data comparing 24M ETOP packs against
      CATL Qilin or BYD Blade packs.
    whyItMatters: >-
      Company-claimed 40% CapEx reduction and 80% active volume lack independent validation against modern cell-to-pack
      benchmarks.
    diligencePath: Obtain independent national laboratory or OEM benchmark testing reports.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: licensing-royalty-terms
    missingEvidence: >-
      Exact royalty rate schedules, per-unit dollar or percentage fees, and upfront license payment amounts from partner
      agreements.
    whyItMatters: >-
      Without contractual royalty rates, financial underwriters cannot forecast ongoing cash flows, gross margins, or
      licensee lifetime value.
    diligencePath: >-
      Obtain executed master licensing agreements and royalty audit statements from corporate wind-down fiduciaries or
      Kyocera investor relations.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: safety-controls
    missingEvidence: >-
      Independent certification records, abuse-test reports, field-failure and recall data, quality-system audits, and
      privacy or security control documentation for the relevant products and manufacturing systems.
    whyItMatters: >-
      Company descriptions of safety mechanisms do not establish certified performance, production quality, or
      operational security.
    diligencePath: >-
      Obtain certification dossiers, third-party lab reports, customer quality audits, warranty and recall data, and
      current control-system security documentation from the asset or IP custodian.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: production-economics
    missingEvidence: >-
      Site-level yield, scrap, throughput, capex, labor, energy consumption, qualification time, and realized
      cost-per-kWh data.
    whyItMatters: >-
      Public process descriptions cannot establish whether the proposed manufacturing advantages survive commercial
      scale-up.
    diligencePath: >-
      Request partner line acceptance tests, monthly production records, costed process flows, and variance analyses for
      each commercial installation.
  - type: missing-source
    severity: material
    topic: technology-continuity
    missingEvidence: >-
      Current ownership, maintenance, support, license status, and roadmap for each product and patent family after the
      reported company wind-down.
    whyItMatters: >-
      A technically credible platform may still be unusable without continuing IP rights, equipment support, and process
      know-how.
    diligencePath: >-
      Review the liquidation asset schedule, patent assignments, surviving license contracts, equipment obligations,
      source documents, and named technical-support personnel.
  - type: private-evidence-only
    severity: material
    topic: OEM pilot identity
    missingEvidence: >-
      Disclosure of the exact corporate identity, vehicle program, and test results for the prominent automotive OEM
      evaluating 24M ETOP packs.
    whyItMatters: Automotive vehicle integration was essential to validate commercial viability beyond stationary residential ESS.
    diligencePath: Review automotive OEM joint development disclosures, supplier announcements, and patent co-filings.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: licensing economics
    missingEvidence: >-
      Disclosed royalty rate percentages, upfront technology transfer fees, and minimum annual volume guarantees across
      24M licensee contracts.
    whyItMatters: >-
      Determines unit-level margin profile and recurring revenue potential generated per gigawatt-hour of partner cell
      production.
    diligencePath: Examine SEC licensing exhibit filings from public partners or bankruptcy court asset liquidation schedules.
    relatedQuestionRefs:
      - QU006
    relatedTableRefs:
      - TU001
  - type: missing-source
    severity: material
    topic: valuation-support
    missingEvidence: >-
      Primary financing documents, audited current financials, and comparable transaction data sufficient to construct a
      valuation range.
    whyItMatters: >-
      Without verified economic denominators and rights, no defensible enterprise value, equity value, or target return
      can be calculated.
    diligencePath: >-
      Obtain board-approved financing documents, audited statements, cohort-level partner economics, and
      transaction-comparable data from management and lead investors.
    relatedQuestionRefs:
      - QV005
    relatedTableRefs:
      - TV003
  - type: private-evidence-only
    severity: material
    topic: exit-readiness
    missingEvidence: >-
      Current corporate standing, fully diluted capitalization, liquidation preferences, debt and liens, cash balance,
      runway, and a verified liquidity path.
    whyItMatters: >-
      These records determine whether an investable security exists, what ownership is purchased, and how proceeds would
      be distributed.
    diligencePath: >-
      Request current certificates of good standing, charter and amendments, cap table, preference waterfall, debt
      schedule, bank statements, board materials, and secondary transaction evidence.
    relatedQuestionRefs:
      - QV010
