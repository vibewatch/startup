companyProfile:
  summary: >-
    24M Technologies is a Cambridge-based MIT spinoff founded in 2010 that developed and licensed a
    battery-manufacturing platform centered on SemiSolid electrodes, ETOP pack architecture, Eternalyte electrolytes,
    and Impervio separators. The public record shows meaningful partner commercialization through Kyocera, but it also
    shows contract terminations, severe customer concentration, and 2026 liquidation evidence, so the company should be
    treated as a wound-down technology licensor rather than an active growth manufacturer.
