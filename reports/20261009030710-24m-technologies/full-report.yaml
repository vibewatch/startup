  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Category Definition
        blocks:
          - type: paragraph
            body: >-
              24M Technologies operates within the advanced lithium-ion battery sector, developing proprietary
              manufacturing processes and cell architectures that diverge substantially from conventional battery
              manufacturing. Founded in 2010 as an MIT spinoff in Cambridge, Massachusetts, the company commercializes
              its innovations primarily through intellectual property licensing and engineering partnerships rather than
              acting as a capital-intensive merchant cell manufacturer. Its technological boundary encompasses two
              primary platforms: the SemiSolid electrode and Unit Cell design, which eliminates traditional inactive
              materials to lower production costs, and newer component innovations including Eternalyte advanced
              electrolytes and Impervio battery separators. These technologies target three primary addressable markets:
              residential and stationary energy storage systems (ESS), automotive electric vehicles (EV), and
              specialized consumer or industrial electronics. However, the commercial market boundary for 24M is
              strictly defined by intellectual property monetization—including upfront license fees, joint development
              agreements, and volume-based royalty payments—excluding finished battery pack sales or direct commodity
              cell manufacturing spend.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Constrained Addressable Sizing and Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Evaluating 24M's addressable market requires distinguishing between multi-billion-dollar top-down energy
              storage projections and the reality of licensed production volumes. While global battery market estimates
              for electric vehicles and stationary storage exceed 150 billion dollars, 24M's serviceable addressable
              market is bounded by the fraction of cell manufacturers willing to license alternative manufacturing
              platforms. Commercial deployment evidence reveals severe partner concentration. Kyocera Corporation
              represents 24M's only operating commercial licensee, having deployed the SemiSolid process in its Enerezza
              residential storage systems with 20,000 units of annual capacity (approximately 200 MWh) at its Shiga Yasu
              facility. Although Kyocera committed 10 billion yen to expand capacity to 400 MWh by FY2026, it operated
              at roughly half capacity through early 2023. Meanwhile, expansion into Western gigafactories suffered a
              severe contraction when key partner FREYR Battery formally terminated its licensing agreement in November
              2024, paying a 3 million dollar settlement and extinguishing prospective multi-gigawatt European
              pipelines. Consequently, 24M's realized market capture is tied to licensee operational execution rather
              than headline battery demand.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
              - CM013
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
