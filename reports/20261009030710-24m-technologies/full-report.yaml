      coverage: sample
      basis: >-
        Evaluation of core technical and operational criteria across five battery architecture paradigms based on public
        disclosures and partner agreements.
    notes: >-
      24M technical claims reflect company disclosures in technical Q&As and press announcements; actual commercial
      deployment was curtailed by liquidation in 2026.
