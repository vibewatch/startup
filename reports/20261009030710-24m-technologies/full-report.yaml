              - CE013
              - CE015
              - CE016
      - number: '5.3'
        title: Maturity, dependencies, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Commercial maturity was uneven. A company-issued release said Kyocera commercialized SemiSolid technology
              in Enerezza in 2020 and reported a current annual capacity of 20,000 units, with a plan to reach 400 MWh
              and double unit capacity by FY2026. In contrast, the November 2024 FREYR agreement terminated two
              license-and-services agreements and required the licensee to cease access to and use of 24M intellectual
              property. That record shows that transferring the platform to a partner did not guarantee durable
              deployment. Public developer-surface probes found no API, documentation, SDK, status, or trust portal,
              which is unsurprising for a materials company but leaves no public operational interface for assessing
              support or change management. The supplied pool also lacks independent certification, abuse-testing,
              yield, uptime, field-failure, and quality system evidence.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial proof exists for the core platform
            body: >-
              Kyocera's Enerezza product is evidence of a partner taking SemiSolid technology into commercial
              production, although the disclosure is company-issued and does not validate every product in 24M's
              portfolio.
            calloutType: strength
            claimRefs:
              - CE015
              - CE016
          - type: callout
            title: License transfer was not automatically durable
            body: >-
              FREYR and 24M mutually terminated their license and services agreements in 2024, and FREYR relinquished
              further access to and use of 24M intellectual property, exposing partner-execution and technology-transfer
              risk.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation, Licensing Structure, and Buyer Profiles
        blocks:
          - type: paragraph
            body: >-
              24M Technologies did not operate merchant gigafactories to manufacture and distribute finished battery
              cells directly to enterprise fleets or consumer end-markets. Instead, the company structured its
              commercialization model entirely around technology licensing, joint development partnerships, and
              proprietary component supply agreements spanning its 24M SemiSolid electrode platform, 24M ETOP cell-less
              pack architecture, Impervio separator, and Eternalyte electrolyte formulations. Direct buyers and
              enterprise customers fell into three primary industrial categories: residential and stationary energy
              storage system (ESS) fabricators, multi-gigawatt merchant cell manufacturing licensees, and automotive
              original equipment manufacturers (OEMs). Under 24M's standard B2B commercial framework, licensing clients
              entered customized technology-access agreements designed to reduce customer capital intensity while
              delivering upfront access fees, joint engineering services revenue, and production-volume-linked
              royalties. However, end-user residential solar households and commercial grid operators transacted solely
              with downstream licensees such as Kyocera, leaving 24M completely insulated from consumer brand equity
              while exposing its top-line economics to the deployment timelines, factory construction velocity, and
              balance sheet durability of a narrow set of manufacturing counterparties.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption Trajectory, Named Customer Deployments, and Production Realities
        blocks:
          - type: paragraph
            body: >-
              Evaluating the empirical adoption trajectory of 24M's technology reveals an extreme divergence between
              residential ESS commercialization and automotive gigafactory implementation. In the stationary energy
              storage sector, Kyocera Corporation stood as 24M's sole validated commercial-scale licensee. Kyocera
              commercialized the SemiSolid unit-cell manufacturing process through its residential 'Enerezza' storage
              system beginning in 2020. By late 2024, Kyocera maintained an operational annual manufacturing capacity of
              20,000 units (approximately 200 MWh) at its Shiga Yasu plant in Japan, formalizing a JPY 10 billion
              capital expansion project to double production capacity to 400 MWh by FY2026. The technical validation of
              this deployment was recognized when Kyocera and 24M jointly received the 2024 Electrochemical Society of
              Japan Technology Award (Tanahashi Award). In the automotive vertical, adoption remained constrained to
              early-stage technology evaluation and pilot validation: while an unnamed prominent OEM accepted pilot
              shipments of the cell-less 24M ETOP platform in late 2023, and automotive discussion forums highlighted
              exploratory interest from new electric vehicle platforms like Scout Motors, no high-volume automotive
              manufacturer established commercial vehicle assembly lines powered by 24M cells before the company's
              dissolution.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
