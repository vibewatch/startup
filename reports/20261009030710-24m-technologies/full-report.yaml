              detail: Thick electrodes processed without conventional drying.
        - label: Electrolyte
          detail: Eternalyte targets transport, fast-charge, and cold-temperature behavior.
          items:
            - label: Eternalyte
              detail: Company-reported cell metrics require independent replication.
        - label: Separator
          detail: Impervio is positioned as a safety complement to Eternalyte.
          items:
            - label: Impervio
              detail: Public evidence in the pool is company-issued.
        - label: Cell manufacturing
          detail: The SemiSolid process reduces inactive materials and manufacturing steps.
          items:
            - label: Partner production line
              detail: Execution depends on process transfer and line controls.
        - label: Pack architecture
          detail: ETOP integrates sealed electrode pairs directly into a pack.
