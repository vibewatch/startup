              The official leadership page names Naoki Ota as President and CEO, Throop Wilder as Executive Chairman and
              co-founder, and Dr. Yet-Ming Chiang as Chief Scientist and co-founder. Their biographies concentrate
              battery manufacturing, entrepreneurship, and materials-science expertise at the top of the organization.
              Richard Chleboski is listed as CFO, adding capital-markets and clean-technology finance experience. This
