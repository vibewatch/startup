              - CE013
              - CE016
      - number: '5.2'
        title: Architecture and technical differentiation
        blocks:
          - type: paragraph
            body: >-
              The architecture starts with thick SemiSolid electrodes and a manufacturing flow that removes electrode
              drying and much inactive material. The company framed chemistry flexibility as a platform advantage:
              partners could change lithium-ion chemistries without rebuilding the whole production system. ETOP then
              eliminates conventional cell and module packaging in favor of sealed anode-cathode pairs integrated into
              the pack. Eternalyte and Impervio add electrolyte transport and separator-safety functions. These
              mechanisms are technically specific, but the strongest numerical outcomes in the supplied evidence come
              from 24M executives or releases, not independent qualification reports. The architecture should therefore
              be underwritten as a coherent design thesis with partial commercial proof, not as independently
              benchmarked superiority.
            claimRefs:
              - CE002
              - CE003
