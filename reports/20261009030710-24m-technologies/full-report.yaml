          summary: >-
            Industrial partners evaluate SemiSolid and ETOP intellectual property, negotiating access rights and equity
            participation.
          detail: Includes initial feasibility agreements with Kyocera, FREYR Battery, and Series H strategic investors.
          unit: Partnership Exploration
          status: Initial Milestone
        - label: 'Phase 2: Joint Development & Engineering Integration'
          summary: >-
            Partners collaborate with 24M engineering to adapt slurry chemistry and pack integration to target
            applications.
