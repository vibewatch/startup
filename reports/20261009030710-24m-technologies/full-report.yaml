  - id: TP002
    title: Feature and Capability Matrix Across Battery Architectures
    columns:
      - Buying / Diligence Criteria
      - 24M Technologies (SemiSolid / ETOP)
      - Solid-State Peers (QuantumScape)
      - Silicon Anode Peers (Enovix / Amprius)
      - Incumbent Gigafactories (Panasonic / CATL)
      - Upcycled ESS (Libattion)
    rows:
      - - Cell / Pack Energy Density
        - High pack density via ETOP (claims 70-80% active volume); cell density moderate
        - Ultra-high theoretical gravimetric density via lithium-metal anode-less design
        - Very high cell volumetric density (up to 450-500 Wh/kg in silicon nanowires)
        - Industry benchmark (260-300 Wh/kg NMC, 160-200 Wh/kg LFP) continuously improving
        - Low to moderate pack density constrained by degraded second-life automotive modules
      - - Manufacturing CapEx Requirement
        - Claimed up to 40% reduction via elimination of drying, solvent recovery, and modules
        - Very high; requires cleanroom ceramic processing and specialized sintering tooling
        - High; custom mechanical stacking and automated laser assembly lines
        - Extreme aggregate CapEx ($50-80M per GWh) offset by multi-gigawatt volume economies
        - Minimal; assembly and integration of decommissioned packs without cell synthesis
      - - Thermal Stability & Safety Mechanisms
        - Impervio dendrite-suppressing separator and thick electrode architecture
        - Non-flammable solid ceramic separator eliminating volatile liquid electrolyte
        - Mechanical constraint architectures mitigating silicon volumetric swelling
        - External liquid cooling plates, fire barriers, and BMS active thermal regulation
        - Standard pack-level enclosures and multi-tier battery management safety monitoring
      - - Fast-Charging Rate Capability
        - Eternalyte electrolyte claims 200 miles in under 4 minutes (~26 mS/cm conductivity)
        - Targeting 15-minute 10-80% charge without dendrite short-circuiting
        - Capable of high C-rate bursts but requires careful thermal management
        - Standard 15-30 minute fast charging commercially proven across global DC networks
        - Typically restricted to 0.5C - 1C charge rates for stationary storage preservation
      - - Low-Temperature Capacity Retention
        - Eternalyte claims >80% capacity retention at -20°C and 1C rate
        - Solid-state ion conductivity drops at sub-zero temperatures without heating
        - Standard electrolyte limitations apply at sub-zero temperatures
        - Loses 20-30% or more capacity at -20°C; requires active pack heating
        - Installed in climate-controlled stationary containers or utility enclosures
      - - Commercial Maturity & Scale
        - Wound down in 2026; limited commercial traction outside Kyocera 400 MWh line
        - Pre-revenue / pilot automotive prototype phase; multi-year qualification
        - Early commercial revenue in consumer electronics; automotive sampling
        - Mass commercial scale; hundreds of gigawatt-hours deployed globally
        - Commercial deployment in utility and commercial-industrial stationary storage
