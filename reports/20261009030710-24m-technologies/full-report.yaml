      - number: '1.1'
        title: Identity, Location, and Business Model
        blocks:
          - type: paragraph
            body: >-
              24M Technologies traces its founding to 2010 and identifies with MIT-origin battery research. Independent
              profiles and company-issued materials place the business in Cambridge, Massachusetts. The company
              describes itself as a battery-technology developer rather than presenting evidence of a single captive
              high-volume cell-manufacturing footprint: its public suite spans the SemiSolid and Unit Cell manufacturing
              platform, safety, cell-integration, separator, and electrolyte offerings. That framing points to a
              commercialization model built around technology deployment by battery manufacturers and partners. The
              assigned evidence supports the historical identity and product positioning, but not a current
              operating-stage label as of the 2026-10-09 run date.
