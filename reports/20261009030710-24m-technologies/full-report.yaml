          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU009
              - CU010
              - CU011
      - number: '6.3'
        title: Partner Concentration, Agreement Terminations, and Commercial Durability
        blocks:
          - type: paragraph
            body: >-
              The structural flaw of 24M's customer portfolio lay in extreme counterparty concentration coupled with
              protracted qualification cycles. While Kyocera provided verified production volume and ongoing royalties
              within the Japanese domestic market, 24M's growth thesis depended heavily on multi-gigawatt greenfield
              licensing agreements with venture-backed battery manufacturers. This vulnerability crystallized decisively
              on November 4, 2024, when FREYR Battery executed a comprehensive Mutual Termination Agreement with 24M
              Technologies. FREYR formally terminated all existing license and service agreements dating back to
              December 2020 and October 2021, immediately ceasing all technology access, relinquishing governance
              rights, forfeiting 6,975,956 shares of 24M Series G preferred stock to 24M for a nominal $1.00 redemption
              price, and paying a $3,000,000 settlement in immediately available funds for past services. The collapse
              of the FREYR partnership eliminated 24M's primary pipeline for gigawatt-scale European and North American
              expansion. When combined with partner capital constraints and broader market shifts during the 2025–2026
              battery sector downcycle, 24M's customer acquisition funnels stalled, leaving insufficient recurring
              licensing cash flow to sustain corporate operations.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Severe Commercial Asymmetry and Counterparty Attrition
            body: >-
              24M's licensing revenue was acutely concentrated in a single commercial partner, Kyocera Corporation. The
              loss of FREYR Battery in November 2024 via a mutual termination and equity forfeiture agreement erased the
              company's largest Western manufacturing pipeline, demonstrating that unproven production economics and
              multi-year factory buildouts create severe existential risks for IP-licensing business models.
            calloutType: risk
            claimRefs:
              - CU005
              - CU010
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Partner Termination and Legal Encumbrances
        blocks:
          - type: paragraph
            body: >-
              The commercial collapse of 24M Technologies was catalyzed by catastrophic contractual terminations across
              its core licensing base, demonstrating the fragility of an asset-light IP licensing model in
              capital-intensive heavy industries [CR001]. On November 4, 2024, 24M Technologies and FREYR Battery
              executed a formal Mutual Termination Agreement that completely severed their licensing and services
              relationship dating back to December 2020 and October 2021 [CR002]. Under this contract, FREYR surrendered
              all 6,975,956 shares of Series G Preferred Stock back to 24M for a nominal purchase price of $1.00,
              relinquished all governance and voting proxies, and paid a final $3,000,000 cash settlement for past
              services [CR003]. Crucially, FREYR was mandated to cease all use of 24M intellectual property, destroy any
              technical documentation in its possession, and abandon joint gigafactory deployment plans [CR004]. This
              abrupt termination stripped 24M of its primary Western European commercial scale-up vehicle, leaving its
              business model acutely exposed to partner execution risk [CR005].
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR008
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR010
              - CR014
      - number: '7.2'
        title: Operational Scalability and Technological Execution Hurdles
        blocks:
          - type: paragraph
            body: >-
              Operational scalability for 24M's SemiSolid electrode technology faced fundamental manufacturing physics
              trade-offs that restricted mass commercialization [CR006]. While coating ultra-thick slurry electrodes
              promised to eliminate NMP solvent recovery and reduce bill-of-materials costs by an estimated 20%, the
              thick electrode architecture inherently suffered from slower rate capabilities and ion-diffusion
              bottlenecks [CR007]. 24M repeatedly pivoted its product messaging—introducing Eternalyte liquid
              electrolytes to improve low-temperature conductivity and fast charging, and Impervio ceramic-coated
              separators to arrest vertical lithium dendrite growth [CR008]. However, these platform expansions required
              complex multi-layer integration with third-party battery manufacturers who lacked incentives to overhaul
              standardized roll-to-roll production lines [CR009]. Although Kyocera demonstrated commercial viability in
              Japan with its Enerezza residential storage systems, scaling to automotive multi-gigawatt volumes remained
              an unproven hurdle that consumed vast development capital [CR010].
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR009
              - CR011
              - CR015
      - number: '7.3'
        title: Financial Vulnerability, Partner Concentration, and Liquidation Triggers
        blocks:
          - type: paragraph
            body: >-
              24M's financial profile suffered from extreme dependency on strategic corporate equity infusions and an
              absence of recurring high-margin royalty streams [CR011]. Prior to its wind-down, the company relied on
              strategic funding rounds, including an $87 million Series H round in September 2024 led by Nuovo Plus
              alongside corporate backers Asahi Kasei and Dai Nippon Printing, supporting a private valuation mark of
              $1.3 billion [CR012]. Despite raising over $100 million in aggregate venture capital across its lifecycle,
              24M maintained a relatively compact headcount of 97 to 119 employees, reflecting an R&D licensing
              structure rather than an operating manufacturing enterprise [CR013]. When Volkswagen's 25% equity stake
              failed to translate into rapid gigafactory deployment and FREYR exited its license, 24M lacked cash flow
              diversification across independent commercial off-takers [CR014]. Caught in a broader battery industry
              downturn and facing soaring cash burn without milestone royalties, the company entered formal liquidation
              in 2026 [CR015].
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Thesis-Break Catalyst: The Dissolution of the FREYR Licensing Framework'
            body: >-
              The formal termination with FREYR Battery on November 4, 2024 proved that 24M's licensing business model
              could not withstand capital retrenchment among emerging gigafactory developers [CR002]. When FREYR
              returned 6.98 million Series G shares for $1.00 and abandoned 24M's SemiSolid technology, it severed the
              startup's most credible route to gigawatt-scale production [CR003]. This event established that
              proprietary manufacturing IP without captive production assets leaves technology licensors helpless when
              operating partners exit [CR004].
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR004
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The appropriate decision is research-more rather than assigning a synthetic enterprise value or target
              return. The strongest price marker in the assigned evidence is a third-party registry entry of $1.3
              billion in June 2024; that same entry does not disclose the round amount, investors, revenue multiple, or
              stage multiple. A later database preview reports an $87 million Series H in September 2024, but it does
              not expose the cap table or economic terms. Those records cannot establish a current entry price as of the
              run date. The no-go posture is therefore price-sensitive: it can change only after current corporate
              status, primary financing documents, fully diluted ownership, preferences, debt, and operating evidence
              are verified. Confidence is medium in withholding an investment call, but low in any precise valuation
              because the denominator and transaction rights are missing.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV011
              - CV013
              - CV016
      - number: '8.2'
        title: Financing context and downside signals
        blocks:
          - type: paragraph
            body: >-
              The financing record contains a material downside signal that a headline valuation cannot capture. A
              November 2024 agreement terminated FREYR license and services arrangements dating from 2020 and 2021. It
              also required a $3 million services payment while FREYR relinquished rights associated with 6,975,956
              Series G preferred shares, which 24M could redeem for one dollar. The document does not disclose 24M's
              complete capitalization, so the transaction should not be generalized into a company-wide per-share value.
              It does show that partner, license, and preferred-equity rights can be reset on terms that materially
              differ from a stale headline mark. Any new investment must therefore be conditioned on the current
              charter, capitalization table, preference stack, partner economics, and all amendments since that
              agreement rather than on a registry valuation alone.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV015
      - number: '8.3'
        title: Scenarios and comparable evidence
        blocks:
          - type: paragraph
            body: >-
              Commercial evidence provides optionality but not a comparable valuation bridge. A company-issued
              announcement said Kyocera planned to double annual production capacity from 20,000 units by fiscal 2026,
              supported by a JPY 10 billion line investment and a targeted 400 MWh annual capacity. Another company
              release said Eternalyte was immediately available and compatible with existing manufacturing processes.
              These are relevant milestone signals, yet they do not disclose 24M revenue, royalties, margins, cash
              generation, customer concentration, or audited deployment outcomes. The available valuation registry
              explicitly lacks EV/revenue and stage multiples, while the assigned source pool contains no transaction
              data for a genuinely comparable public company or acquisition. Bull, base, and bear cases must therefore
              remain conditional and non-numeric; attaching probabilities or ranges would create precision unsupported
              by the evidence.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The evidence does not establish exit readiness. EquityZen describes a mechanism through which accredited
              investors may buy private-company interests and, if eligible, resell through an Express Deal, but the page
              supplies no 24M price, completed transaction, bid depth, or expected holding period. The EquityBee result
              is unusable as valuation evidence because its body discusses Reddit and generic placeholders rather than
              24M. A World Economic Forum directory entry confirms only a broad company description, not economics.
              Before any price discussion, diligence should obtain current corporate standing, board-approved financing
              documents, an audited cap table, liquidation preferences, debt and liens, cash and runway, customer-level
              royalties, signed backlog, and evidence of secondary demand. A thesis break is failure to verify those
              records or evidence that partner terminations, preference overhang, or commercialization shortfalls
              eliminate a credible risk-adjusted return.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive decision
            body: >-
              Do not convert the June 2024 registry mark into a present enterprise value. Reopen the investment case
              only with verified current status, primary financing terms, a fully diluted cap table, preference and debt
              schedules, audited operating results, and customer economics.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV013
              - CV014
              - CV016
