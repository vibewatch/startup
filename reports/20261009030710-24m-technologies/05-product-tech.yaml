  evidenceGaps:
    - type: missing-source
      severity: material
      topic: safety-controls
      missingEvidence: >-
        Independent certification records, abuse-test reports, field-failure and
        recall data, quality-system audits, and privacy or security control
        documentation for the relevant products and manufacturing systems.
      whyItMatters: >-
        Company descriptions of safety mechanisms do not establish certified
        performance, production quality, or operational security.
      diligencePath: >-
        Obtain certification dossiers, third-party lab reports, customer quality
        audits, warranty and recall data, and current control-system security
        documentation from the asset or IP custodian.
      relatedQuestionRefs: [QE007]
    - type: private-evidence-only
      severity: material
      topic: production-economics
      missingEvidence: >-
        Site-level yield, scrap, throughput, capex, labor, energy consumption,
        qualification time, and realized cost-per-kWh data.
      whyItMatters: >-
        Public process descriptions cannot establish whether the proposed
        manufacturing advantages survive commercial scale-up.
      diligencePath: >-
        Request partner line acceptance tests, monthly production records, costed
        process flows, and variance analyses for each commercial installation.
    - type: missing-source
      severity: material
      topic: technology-continuity
      missingEvidence: >-
        Current ownership, maintenance, support, license status, and roadmap for
        each product and patent family after the reported company wind-down.
      whyItMatters: >-
        A technically credible platform may still be unusable without continuing
        IP rights, equipment support, and process know-how.
      diligencePath: >-
        Review the liquidation asset schedule, patent assignments, surviving
        license contracts, equipment obligations, source documents, and named
        technical-support personnel.
