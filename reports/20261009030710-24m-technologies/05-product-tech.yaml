company:
  name: 24M Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    24M assembled a battery-technology portfolio around its SemiSolid
    manufacturing platform, with ETOP, Eternalyte, Impervio, and partner-operated
    production as extensions of that core. Public evidence shows commercial use
    by Kyocera, but most performance and safety metrics remain company claims,
    while the terminated FREYR license demonstrates transfer and execution risk.
sections:
  - id: product-and-workflow
    title: Product portfolio and customer workflow
    body: >-
      24M's deliverable was primarily a licensable battery-manufacturing platform,
      materials, cell architecture, and production know-how rather than finished
      cells manufactured at scale by 24M itself. The SemiSolid process targeted
      cell makers seeking fewer manufacturing steps, while ETOP moved the design
      boundary from individual cells and modules toward sealed electrode pairs
      integrated into a pack. Eternalyte and Impervio addressed electrolyte and
      separator performance, respectively. This portfolio created several
      adoption paths, but it also required customers to qualify materials,
      redesign production or pack workflows, and execute scale-up. Kyocera's
      Enerezza launch is the clearest supplied evidence that the core platform
      moved beyond laboratory development into a commercial product; it does not
      independently validate every later product line or claimed performance
      metric.
    claimRefs: [CE001, CE002, CE005, CE008, CE010, CE015, CE016]
    tableRefs: [TE001, TE002]
  - id: architecture-and-differentiation
    title: Architecture and technical differentiation
    body: >-
      The architecture starts with thick SemiSolid electrodes and a manufacturing
      flow that removes electrode drying and much inactive material. The company
      framed chemistry flexibility as a platform advantage: partners could change
      lithium-ion chemistries without rebuilding the whole production system.
      ETOP then eliminates conventional cell and module packaging in favor of
      sealed anode-cathode pairs integrated into the pack. Eternalyte and Impervio
      add electrolyte transport and separator-safety functions. These mechanisms
      are technically specific, but the strongest numerical outcomes in the
      supplied evidence come from 24M executives or releases, not independent
      qualification reports. The architecture should therefore be underwritten as
      a coherent design thesis with partial commercial proof, not as independently
      benchmarked superiority.
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE009, CE010]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-dependencies-and-controls
    title: Maturity, dependencies, and technical risk
    body: >-
      Commercial maturity was uneven. A company-issued release said Kyocera
      commercialized SemiSolid technology in Enerezza in 2020 and reported a
      current annual capacity of 20,000 units, with a plan to reach 400 MWh and
      double unit capacity by FY2026. In contrast, the November 2024 FREYR
      agreement terminated two license-and-services agreements and required the
      licensee to cease access to and use of 24M intellectual property. That
      record shows that transferring the platform to a partner did not guarantee
      durable deployment. Public developer-surface probes found no API,
      documentation, SDK, status, or trust portal, which is unsurprising for a
      materials company but leaves no public operational interface for assessing
      support or change management. The supplied pool also lacks independent
      certification, abuse-testing, yield, uptime, field-failure, and quality
      system evidence.
    claimRefs: [CE011, CE012, CE013, CE014, CE015, CE016]
callouts:
  - calloutType: strength
    title: Commercial proof exists for the core platform
    body: >-
      Kyocera's Enerezza product is evidence of a partner taking SemiSolid
      technology into commercial production, although the disclosure is
      company-issued and does not validate every product in 24M's portfolio.
    claimRefs: [CE015, CE016]
  - calloutType: risk
    title: License transfer was not automatically durable
    body: >-
      FREYR and 24M mutually terminated their license and services agreements in
      2024, and FREYR relinquished further access to and use of 24M intellectual
      property, exposing partner-execution and technology-transfer risk.
    claimRefs: [CE013, CE014]
