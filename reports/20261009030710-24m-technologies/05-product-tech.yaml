  - id: TE002
    title: Workflow and use-case implications
    columns:
      - User job
      - Conventional workflow
      - 24M approach
      - Measurable public signal
      - Limitation
    rows:
      - ["Manufacture lithium-ion electrodes", "Coat, dry, solidify, and assemble conventional electrodes", "Process SemiSolid electrodes without the conventional drying step", "Company told MIT News that more than 80% of inactive material could be removed", "No independent yield, cost, or throughput denominator in the assigned evidence"]
      - ["Configure cell chemistry", "Qualify chemistry within a dedicated production design", "Use a chemistry-flexible platform on substantially unchanged production lines", "CEO described compatibility with multiple lithium-ion chemistries", "Changeover time, qualification burden, and realized line compatibility are undisclosed"]
      - ["Assemble an EV battery pack", "Package individual cells into modules and then a pack", "Integrate sealed anode-cathode pairs directly into the pack", "Company claimed more than 80% electrode packaging efficiency", "No independent pack validation, crash-test result, or production customer is supplied"]
      - ["Scale partner production", "License technology and build a partner-operated line", "Transfer platform, equipment, and know-how to the licensee", "Kyocera release cited 20,000 units of annual capacity and a 400 MWh FY2026 plan", "FREYR termination shows that a signed license can fail to become durable production"]
      - ["Improve cold-weather and fast-charge behavior", "Optimize conventional electrolyte and cell design", "Substitute Eternalyte into existing manufacturing processes", "Company reported about 26 mS/cm conductivity at 25 C and over 80% capacity at 1C and -20 C", "No independent protocol, sample size, cycle-life tradeoff, or production qualification is supplied"]
    notes: >-
      Metrics retain the company's stated test conditions; no conversion to
      customer economics or production performance is inferred.
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE009, CE013, CE016]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or process
      - Role
      - Critical dependency
      - Technical or operating risk
    rows:
      - [Electrode formulation, "Create thick SemiSolid electrodes", "Consistent slurry properties and compatible active materials", "Yield, homogeneity, and cycle-life evidence is not public in the assigned pool"]
      - [Electrode manufacturing, "Avoid conventional drying and reduce inactive material", "Partner equipment, process controls, and operator know-how", "Cost savings may not survive site-specific scale-up or scrap"]
      - [Electrolyte and separator, "Improve ion transport and manage dendrite-related internal-short risk", "Eternalyte and Impervio qualification with each chemistry", "Safety and performance claims lack independent certification evidence"]
      - [Pack integration, "Replace cell-module packaging with ETOP sealed electrode pairs", "Automaker pack design, sealing, wiring, thermal management, and service procedures", "Integration and safety qualification could offset packaging gains"]
      - [License transfer and support, "Enable partner-operated manufacturing", "Continuing IP rights, technical assistance, equipment support, and partner capital", "FREYR's terminated agreements demonstrate continuity and execution risk"]
    notes: >-
      This is an evidence-bounded operating model, not a disclosed bill of
      materials or validated production process.
    claimRefs: [CE002, CE003, CE004, CE005, CE010, CE013, CE014]
figures:
  - id: FE001
    title: Product architecture from materials to partner deployment
    type: stack
    summary: >-
      The portfolio spans material components, manufacturing, pack design, and a
      license-transfer layer, with distinct qualification risk at each step.
    data:
      layers:
        - label: Electrode materials
          detail: SemiSolid formulation is the platform foundation.
          items:
            - label: SemiSolid electrodes
              detail: Thick electrodes processed without conventional drying.
        - label: Electrolyte
          detail: Eternalyte targets transport, fast-charge, and cold-temperature behavior.
          items:
            - label: Eternalyte
              detail: Company-reported cell metrics require independent replication.
        - label: Separator
          detail: Impervio is positioned as a safety complement to Eternalyte.
          items:
            - label: Impervio
              detail: Public evidence in the pool is company-issued.
        - label: Cell manufacturing
          detail: The SemiSolid process reduces inactive materials and manufacturing steps.
          items:
            - label: Partner production line
              detail: Execution depends on process transfer and line controls.
        - label: Pack architecture
          detail: ETOP integrates sealed electrode pairs directly into a pack.
          items:
            - label: ETOP
              detail: Packaging-efficiency claims lack independent validation in the pool.
        - label: Commercial deployment
          detail: Licensees qualify, finance, operate, and support production.
          items:
            - label: Partner-operated manufacturing
              detail: Kyocera provides commercial proof while FREYR shows attrition risk.
    approximationNotes: >-
      Ordered layers reflect the disclosed product logic; they do not imply that
      all products were integrated in one production system.
    claimRefs: [CE001, CE006, CE007, CE008, CE009, CE011, CE013, CE015, CE016]
