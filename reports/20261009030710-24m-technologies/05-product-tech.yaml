      - [Production equipment and know-how, "Licensed manufacturing partner", "Public profiles identify equipment as part of the offering, but specifications are absent", "Packages process knowledge with the battery architecture", "Equipment ownership, support obligations, throughput, acceptance criteria, and post-wind-down continuity"]
    notes: >-
      Maturity and performance are limited to the supplied public sources as of
      2026-10-09; company-issued claims are not independent benchmarks.
