company:
  name: "24M Technologies"
chapter:
  number: 6
  title: "Customers"
  summary: "24M Technologies operated an asset-light intellectual property and process licensing business model where direct customers were battery manufacturers and automotive/industrial OEMs rather than retail end-users. Commercial customer adoption exhibited severe structural concentration: Kyocera Corporation represented the sole partner to achieve scaled commercial manufacturing with its Enerezza residential energy storage system, reaching 20,000 annual units (approximately 200 MWh) and targeting 400 MWh by FY2026 via a JPY 10 billion investment. In contrast, large-scale automotive and gigafactory licensing pipelines suffered catastrophic attrition, headlined by FREYR Battery's mutual termination agreement in November 2024 involving the complete forfeiture of 6,975,956 Series G preferred shares, a $3.0 million cash settlement, and cancellation of multi-gigawatt European deployment plans."
sections:
  - id: "customer-segmentation-and-commercial-structure"
    title: "Customer Base Segmentation, Licensing Structure, and Buyer Profiles"
    body: "24M Technologies did not operate merchant gigafactories to manufacture and distribute finished battery cells directly to enterprise fleets or consumer end-markets. Instead, the company structured its commercialization model entirely around technology licensing, joint development partnerships, and proprietary component supply agreements spanning its 24M SemiSolid electrode platform, 24M ETOP cell-less pack architecture, Impervio separator, and Eternalyte electrolyte formulations. Direct buyers and enterprise customers fell into three primary industrial categories: residential and stationary energy storage system (ESS) fabricators, multi-gigawatt merchant cell manufacturing licensees, and automotive original equipment manufacturers (OEMs). Under 24M's standard B2B commercial framework, licensing clients entered customized technology-access agreements designed to reduce customer capital intensity while delivering upfront access fees, joint engineering services revenue, and production-volume-linked royalties. However, end-user residential solar households and commercial grid operators transacted solely with downstream licensees such as Kyocera, leaving 24M completely insulated from consumer brand equity while exposing its top-line economics to the deployment timelines, factory construction velocity, and balance sheet durability of a narrow set of manufacturing counterparties."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-deployment-proof"
    title: "Adoption Trajectory, Named Customer Deployments, and Production Realities"
    body: "Evaluating the empirical adoption trajectory of 24M's technology reveals an extreme divergence between residential ESS commercialization and automotive gigafactory implementation. In the stationary energy storage sector, Kyocera Corporation stood as 24M's sole validated commercial-scale licensee. Kyocera commercialized the SemiSolid unit-cell manufacturing process through its residential 'Enerezza' storage system beginning in 2020. By late 2024, Kyocera maintained an operational annual manufacturing capacity of 20,000 units (approximately 200 MWh) at its Shiga Yasu plant in Japan, formalizing a JPY 10 billion capital expansion project to double production capacity to 400 MWh by FY2026. The technical validation of this deployment was recognized when Kyocera and 24M jointly received the 2024 Electrochemical Society of Japan Technology Award (Tanahashi Award). In the automotive vertical, adoption remained constrained to early-stage technology evaluation and pilot validation: while an unnamed prominent OEM accepted pilot shipments of the cell-less 24M ETOP platform in late 2023, and automotive discussion forums highlighted exploratory interest from new electric vehicle platforms like Scout Motors, no high-volume automotive manufacturer established commercial vehicle assembly lines powered by 24M cells before the company's dissolution."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU002"
      - "TU003"
    figureRefs:
      - "FU001"
  - id: "customer-concentration-and-contract-termination-risks"
    title: "Partner Concentration, Agreement Terminations, and Commercial Durability"
    body: "The structural flaw of 24M's customer portfolio lay in extreme counterparty concentration coupled with protracted qualification cycles. While Kyocera provided verified production volume and ongoing royalties within the Japanese domestic market, 24M's growth thesis depended heavily on multi-gigawatt greenfield licensing agreements with venture-backed battery manufacturers. This vulnerability crystallized decisively on November 4, 2024, when FREYR Battery executed a comprehensive Mutual Termination Agreement with 24M Technologies. FREYR formally terminated all existing license and service agreements dating back to December 2020 and October 2021, immediately ceasing all technology access, relinquishing governance rights, forfeiting 6,975,956 shares of 24M Series G preferred stock to 24M for a nominal $1.00 redemption price, and paying a $3,000,000 settlement in immediately available funds for past services. The collapse of the FREYR partnership eliminated 24M's primary pipeline for gigawatt-scale European and North American expansion. When combined with partner capital constraints and broader market shifts during the 2025–2026 battery sector downcycle, 24M's customer acquisition funnels stalled, leaving insufficient recurring licensing cash flow to sustain corporate operations."
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
callouts:
  - calloutType: "risk"
    title: "Severe Commercial Asymmetry and Counterparty Attrition"
    body: "24M's licensing revenue was acutely concentrated in a single commercial partner, Kyocera Corporation. The loss of FREYR Battery in November 2024 via a mutual termination and equity forfeiture agreement erased the company's largest Western manufacturing pipeline, demonstrating that unproven production economics and multi-year factory buildouts create severe existential risks for IP-licensing business models."
    claimRefs:
      - "CU005"
      - "CU010"
      - "CU011"
