          unit: "Pilot Shipments"
          status: "Pre-Commercial"
        - label: "Phase 4: Commercial-Scale Factory Commissioning"
          summary: "Capital-intensive deployment of dedicated manufacturing lines capable of multi-megawatt or gigawatt cell fabrication."
