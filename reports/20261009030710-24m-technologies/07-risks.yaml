callouts:
  - calloutType: "risk"
    title: "Thesis-Break Catalyst: The Dissolution of the FREYR Licensing Framework"
    body: "The formal termination with FREYR Battery on November 4, 2024 proved that 24M's licensing business model could not withstand capital retrenchment among emerging gigafactory developers [CR002]. When FREYR returned 6.98 million Series G shares for $1.00 and abandoned 24M's SemiSolid technology, it severed the startup's most credible route to gigawatt-scale production [CR003]. This event established that proprietary manufacturing IP without captive production assets leaves technology licensors helpless when operating partners exit [CR004]."
    claimRefs:
      - "CR002"
      - "CR003"
      - "CR004"
