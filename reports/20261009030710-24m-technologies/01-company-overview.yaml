company:
  name: "24M Technologies"
chapter:
  number: 1
  title: "Company Overview"
  summary: "24M Technologies is a Cambridge battery-technology company founded in 2010 whose public materials describe a broad product suite and whose partners have commercialized its SemiSolid process. The assigned evidence supports a September 2024 $87 million Series H, a third-party $1.3 billion June 2024 valuation entry, and a material November 2024 FREYR license termination, but it does not establish current operating status or present financial scale."
sections:
  - id: "identity-and-business-model"
    title: "Identity, Location, and Business Model"
    body: "24M Technologies traces its founding to 2010 and identifies with MIT-origin battery research. Independent profiles and company-issued materials place the business in Cambridge, Massachusetts. The company describes itself as a battery-technology developer rather than presenting evidence of a single captive high-volume cell-manufacturing footprint: its public suite spans the SemiSolid and Unit Cell manufacturing platform, safety, cell-integration, separator, and electrolyte offerings. That framing points to a commercialization model built around technology deployment by battery manufacturers and partners. The assigned evidence supports the historical identity and product positioning, but not a current operating-stage label as of the 2026-10-09 run date."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership and Governance Coverage"
    body: "The official leadership page names Naoki Ota as President and CEO, Throop Wilder as Executive Chairman and co-founder, and Dr. Yet-Ming Chiang as Chief Scientist and co-founder. Their biographies concentrate battery manufacturing, entrepreneurship, and materials-science expertise at the top of the organization. Richard Chleboski is listed as CFO, adding capital-markets and clean-technology finance experience. This is useful evidence of functional coverage, but it is company-issued and does not disclose board voting arrangements, succession planning, ownership percentages, or the durability of these appointments after the page was fetched. Governance and key-person dependence therefore remain diligence matters rather than verified risk conclusions."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"
    tableRefs:
      - "TO002"
  - id: "capital-and-strategic-stakeholders"
    title: "Capital Markers and Strategic Stakeholders"
    body: "Preqin reports that 24M raised $87 million in a September 2024 Series H led by Nuovo Plus, with Asahi Kasei Venture and Dai Nippon Printing also named. A separate registry places the company at a $1.3 billion valuation in June 2024; that is a dated third-party registry value, not a current valuation, a transaction price verified from primary documents, or evidence of cash available. Commercial evidence is similarly mixed. A company-issued release says Kyocera planned to double annual unit capacity by FY2026, while a filed agreement shows that FREYR and 24M terminated their earlier license and services agreements in November 2024 on economically material terms."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
  - id: "current-state-and-diligence-boundary"
    title: "Current-State Boundary and Open Diligence"
    body: "The latest dated product evidence in the assigned pool is 24M's March 2025 announcement that its expanded Eternalyte electrolyte family was immediately available. That announcement demonstrates a product-marketing milestone, not revenue, adoption, solvency, or continuing operations in October 2026. None of the assigned sources provides audited revenue, run-rate, total funding, customer count, headcount, current cash, current ownership, or a verified current company stage. The appropriate overview is therefore a dated historical snapshot with explicit nulls. Current status should be resolved through recent corporate records, management confirmation, financing documents, and partner attestations before any investment conclusion relies on the older valuation or partnership milestones."
    claimRefs:
      - "CO008"
      - "CO011"
      - "CO015"
