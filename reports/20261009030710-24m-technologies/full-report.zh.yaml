  - id: FM001
    title: 市场规模视角与产能金字塔
    type: pyramid
    summary: 受约束的市场规模分层，将自上而下的行业电池预测与 24M 许可方的当前及规划产量对比。
    approximationNotes: 宏观市场金额采用行业共识区间；许可方产能指标采用 Kyocera 和 FREYR 已核实的披露。
    data:
      items:
        - label: 全球电池储能与电动车电芯 TAM（$150B+）
          value: 150000
          unit: USD M
          tone: neutral
          detail: 电动车和电网储能电芯对应的全球可服务硬件总支出。
        - label: 下一代电解质与 SemiSolid SAM（$25B）
          value: 25000
          unit: USD M
          tone: neutral
          detail: 新型电解质和专用高安全电芯形态的可服务市场。
        - label: 技术许可与服务 SAM（$2B）
          value: 2000
          unit: USD M
          tone: neutral
          detail: 全球 IP 许可版税和工程开发服务费。
        - label: 许可方规划 FY2026 产能（400 MWh）
          value: 400
          unit: MWh
          tone: positive
          detail: Kyocera 规划的 Shiga Yasu 工厂扩张目标为 40,000 台住宅设备。
        - label: 许可方当前运行产能（100 MWh）
          value: 100
          unit: MWh
          tone: warning
          detail: Kyocera 估计实际运行量约为 200 MWh 铭牌产能的一半。
        - label: 已终止许可方产能管线（0 MWh）
          value: 0
          unit: MWh
          tone: negative
          detail: FREYR 合同取消并没收许可后，实际实现产量为零。
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
      - CM013
  - id: FP001
    title: 竞争定位：商业成熟度与架构新颖性
    type: quadrant
    summary: 按商业化规模和制造架构偏离传统的程度评估电池同行与现有厂商。
    data:
      xAxis: 架构与制造新颖性（传统卷对卷至新型电化学 / 浆料）
      yAxis: 商业规模与部署成熟度（收入前概念至多 GWh 量产）
      points:
        - label: 24M Technologies
          x: 7.5
          'y': 3
          detail: 新型 SemiSolid 浆料与 ETOP 架构；商业进展仅限于 Kyocera ESS，且将在 2026 年前后收缩
        - label: QuantumScape
          x: 9
          'y': 2.5
          detail: 革命性的固态陶瓷锂金属电芯；目前处于汽车 OEM 原型取样阶段
        - label: Enovix
          x: 8
          'y': 4.5
          detail: 专有 3D 硅负极架构；已向高端消费电子客户商业出货
        - label: Amprius Technologies
          x: 8.5
          'y': 4
          detail: 100% 活性硅纳米线电芯架构；在航空和国防细分领域商业销售
        - label: Panasonic Energy
          x: 2.5
          'y': 9.5
          detail: 全球现有一级汽车供应商；吉瓦级圆柱电芯量产
        - label: Sunwoda Electronic
          x: 2
          'y': 8.5
          detail: 中国大型锂离子电芯、消费电池包和电网储能系统制造商
        - label: Libattion
          x: 4
          'y': 4
          detail: 再利用电动车电池包的固定式储能；化学体系新颖性低，但已有商业运营部署
        - label: Crown Battery
          x: 1.5
          'y': 7
          detail: 传统工业动力和铅酸电池制造商，拥有成熟的全球分销网络
