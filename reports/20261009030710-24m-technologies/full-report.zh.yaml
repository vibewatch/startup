  - id: FI001
    title: 收入模型桥接——24M 技术许可与现金流转化
    type: flow
    summary: |
      系统流程模型追踪 24M Technologies 如何通过许可方工厂、工程服务合同和联邦研究资助，将知识产权转化为公司现金流。
    data:
      nodes:
        - id: ip_platform
          label: 24M SemiSolid 与 ETOP IP 平台
        - id: licensing_agreements
          label: 主技术许可合同
        - id: partner_factories
          label: 合作伙伴超级工厂 / 试点资本开支（Kyocera、Nuovo+）
        - id: cell_production
          label: 商业电池生产（MWh 产出）
        - id: recurring_royalties
          label: 与产量挂钩的版税（持续现金流）
        - id: upfront_fees
          label: 前期准入费与里程碑费用
        - id: joint_dev_services
          label: 联合工程开发服务
        - id: grant_funding
          label: 政府研究资助（DOE / OSTI）
        - id: corporate_revenue
          label: 24M 运营总流入（估计 $10M-$37.6M）
      edges:
        - from: ip_platform
          to: licensing_agreements
          label: 技术转让与专利准入
        - from: ip_platform
          to: joint_dev_services
          label: 定制配方与工程支持
        - from: ip_platform
          to: grant_funding
          label: 下一代化学体系研究提案
        - from: licensing_agreements
          to: partner_factories
          label: 许可方投入资本开支
        - from: licensing_agreements
          to: upfront_fees
          label: 签约准入付款
        - from: partner_factories
          to: cell_production
          label: 商业电芯制造
        - from: cell_production
          to: recurring_royalties
          label: 按生产 MWh 计提的产量版税
        - from: recurring_royalties
          to: corporate_revenue
          label: 主要经常性收入驱动因素
        - from: upfront_fees
          to: corporate_revenue
          label: 里程碑收入贡献
        - from: joint_dev_services
          to: corporate_revenue
          label: 服务收入（例如 $3M FREYR 和解款）
        - from: grant_funding
          to: corporate_revenue
          label: 非稀释性研发支持（$13.5M 资助）
    approximationNotes: |
      该流程体现 24M Technologies 的定性收入架构。各节点的具体金额分配属于机密或尚未核实。
