      - number: '2.3'
        title: 买方分层与商业流程
        blocks:
          - type: paragraph
            body: >-
              24M IP 的商业采用要经过工业买方的多阶段采购和技术认证。在住宅及商业储能中，主要买方是 Kyocera 等综合电子与清洁能源集团，预算负责人通常是制造或能源解决方案副总裁。汽车市场围绕 24M
              的潜在授权客户是 EV OEM 和 Tier 1 电芯供应商，关注 ETOP 等封装改进及快充电解液。这些客户在把第三方制造 IP
              纳入产线前，需要多年验证、严格滥用测试和大量资本投入。公用事业级储能开发商及绿地电池生产商历史上签署过数百万美元授权合同并交换股权，但近期合同终止说明，高执行摩擦和资本约束会促使授权客户放弃许可并交回股权。
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM011
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM011
      - number: '2.4'
        title: 增长驱动、结构性约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              24M 技术组合受更高安全性、更快充电和更低制造开销的行业需求推动。公司技术口径称，Eternalyte 可将 EV 从 15% 充至 80% 的电量状态，耗时不到四分钟，并在 -20 摄氏度保持超过 80%
              容量。Impervio 隔膜则针对内部枝晶短路，以压低热失控风险。但切换成本、资本密集度和 传统龙头 锁定严重限制采用。成熟电芯制造商的吉瓦级产线已针对传统浆料涂布优化，改造为 SemiSolid
              或新电解液化学体系的成本难以承受。24M 完全依赖伙伴资本，授权客户延误或陷入财务困境时尤其脆弱。关键尽调缺口是确切的特许权费率及每 MWh 的经常性收入；24M 和授权客户均未公开。
            claimRefs:
              - CM003
              - CM008
              - CM010
              - CM012
              - CM013
      - number: '2.5'
        title: 展品
        blocks:
          - type: callout
            title: 电池授权模式存在严重商业集中
            body: 24M 的商业进展高度集中在唯一运营授权客户 Kyocera；其他重大授权关系（如 FREYR Battery）已终止并完整放弃 IP 权利，使可服务市场暴露于极端伙伴执行风险。
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM008
          - type: callout
            title: 全球市场预测与授权商变现之间的落差
            body: 全球储能和 EV 电池 TAM 预测动辄数十亿美元，但 24M 的实际市场份额完全取决于资本密集型伙伴部署和授权抽成，而不是广泛硬件销售。
            calloutType: insight
            claimRefs:
