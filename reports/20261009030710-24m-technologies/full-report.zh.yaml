      - number: '3.3'
        title: 差异化持久性、护城河评估与伙伴切换动态
        blocks:
          - type: paragraph
            body: >-
              24M 试图围绕四项专有支柱建立护城河：取消溶剂回收和粘结剂干燥的 SemiSolid 厚电极工艺；声称活性材料体积超过 70% 至 80%、制造成本最多降低 40% 的 ETOP 电芯到电池包架构；抑制枝晶的
              Impervio 隔膜；以及可在四分钟内支持 200 英里续航充电、在 -20°C 保持超过 80% 容量的 Eternalyte 系列。纸面优势并未转化为 24M 的持久差异化。OEM
              从传统圆柱或方形卷对卷产线切换到 24M 方案，需要全新厂房布局、专用混料设备和未经证明的高速质检系统。关键授权伙伴 FREYR 于 2024 年 11 月因战略、资本和运营约束签署互终协议，放弃 6.98
              million 股 24M Series G 优先股并以 $1.00 价格交回，切断全部许可。授权客户可以退出而不承担灾难性运营惩罚，说明 24M 缺乏专有锁定；客户也能放弃 24M 的技术。与此同时，传统
              LFP 化学和自动化封装持续缩小成本与能量密度差距，使 24M 的独立 IP 在 2026 年收缩前已失去可行性。
