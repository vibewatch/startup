        - 消费电子与可穿戴设备，并扩展至 EV
        - 提供更高体积能量密度的 3D 硅负极架构
        - 专有生产设备与设备集成的高资本开支
      - - Amprius Technologies
        - 先进硅负极同类
        - '$55M+ 融资；上市公司（NYSE: AMPX）'
        - 航空、航天、国防与特殊应用
        - 100% 活性硅纳米线负极，电芯能量密度最高达 500 Wh/kg
        - 制造单位成本高，且大批量汽车生产能力有限
      - - Panasonic Energy
        - 传统 Tier-1 电芯龙头
        - '数十亿美元企业收入；上市公司（TYO: 6752 子公司）'
        - 全球 Tier-1 汽车 OEM（Tesla 等）
        - 吉瓦时级自动化制造规模，数十年汽车供应可靠性
        - 固定资本成本高，暴露于大宗商品价格，化学体系迭代保守
      - - Sunwoda Electronic
        - 电芯与电池包制造龙头
        - '上市公司（SZSE: 300207）；Tracxn 评分 71/100'
        - 消费电子、EV 出行与电网 ESS
        - 低成本、大批量的中国电芯与电池包制造基础设施
        - 地缘政治贸易限制，以及暴露于中国国内激烈价格战
      - - Libattion
        - 相邻储能替代方案
        - 20 名员工；私有（瑞士苏黎世）
        - 工业与公用事业固定式储能
        - 将二次生命 EV 电池模块升级利用于循环储能容器
        - 原料供应波动、退化电芯化学体系匹配困难，以及与汽车市场缺乏相关性
      - - Crown Battery Manufacturing
        - 工业龙头替代方案
        - 私有；成立于 1926 年（美国）
        - 工业牵引动力与固定式电源
        - 成熟分销网络、耐用铅酸电池与重型工业系统
        - 能量密度较低，且参与现代高压 EV 市场有限
      - - Ningbo Shanshan Co.
        - 零部件与材料龙头
        - '上市公司（SSE: 600884）；成立于 1992 年（中国）'
        - 全球电芯制造商
        - 以规模化方式合成天然与人造石墨负极材料
        - 原材料价格波动，且易受人造硅负极替代品冲击
      - - 24M Technologies
        - 核心实体（已收缩运营）
        - $500M 累计融资；$1.3B 峰值估值；H 轮
        - 住宅 ESS（Kyocera）与 EV 驱动（ETOP/Eternalyte）
        - SemiSolid 厚电极、ETOP 电芯到电池包、Impervio 隔膜、Eternalyte 电解液
        - 缺乏自有超级工厂规模、依赖许可伙伴，并于 2026 年清算
