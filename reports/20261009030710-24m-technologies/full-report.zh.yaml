  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 投资决策仍受限于门槛：商业化信号尚未与当前经济性或权利状况接上。
    data:
      nodes:
        - id: commercial-signal
          label: 商业化信号
          detail: 据 Kyocera 的扩张及产品可用性主张，产品可能获得采用。
        - id: economic-proof
          label: 缺少经济性证明
          detail: 收入、版税、利润率、留存率和经审计的部署结果均未披露。
        - id: rights-reset
          label: 观察到权利重置
          detail: FREYR 终止合作改变了许可权和优先股权利。
        - id: price-anchor
          label: 价格锚点已过时
          detail: 注册记录中的 $1.3B 估值标记日期为 2024 年 6 月，且缺少交易细节。
        - id: exit-proof
          label: 缺少退出证明
          detail: 报告描述了一种市场交易机制，但没有展示 24M 的价格或已完成的流动性交易。
        - id: recommendation
          label: 继续研究
          detail: 在一手记录补齐这些缺口前，不给出价格或投资判断。
    approximationNotes: 这是一条定性的决策链；节点顺序不代表权重或概率。
    claimRefs:
      - CV006
      - CV007
      - CV009
      - CV011
      - CV013
