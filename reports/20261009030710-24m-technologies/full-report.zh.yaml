      - number: '3.2'
        title: 竞争者画像：规模、技术架构与商业策略
        blocks:
          - type: paragraph
            body: >-
              同行分析显示，24M 与竞争者在资本规模、目标市场和商业模式上差异明显。QuantumScape 专注汽车乘用 EV 的固态锂金属电芯，获得超过 $1 billion 资本和 Volkswagen Group
              联合开发支持；Enovix 商业化高能量密度 3D 硅负极电芯，融资 $220 million，先攻高端消费电子，再拓展移动市场，且自建制造工厂而非授权蓝图。Panasonic Energy、Sunwoda
              Electronic 等 传统龙头 年产能达多 GWh，提供圆柱和方形电芯，并具备汽车可靠性和严格保修承保记录。Libattion 将废弃 EV 电池包改造成公用事业储能，以精简的 20
              人团队避开原料开采和洁净室制芯。相比之下，24M 在 Series H 期间有 84 至 97 名员工，累计融资 $500 million、峰值私募估值 $1.3 billion，试图同时覆盖 Kyocera
              固定式储能和 24M 的 ETOP、Eternalyte 汽车牵引电池。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP007
              - CP008
              - CP009
