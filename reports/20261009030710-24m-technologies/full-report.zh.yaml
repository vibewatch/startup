        blocks:
          - type: paragraph
            body: >-
              现有证据不能证明退出准备度。EquityZen 描述合格投资者购买私营公司权益并在符合条件时通过 Express Deal 转售的机制，但页面没有 24M
              价格、已完成交易、买盘深度或预期持有期。EquityBee 结果不可作为估值证据，因为正文讨论 Reddit 和通用占位符而非
              24M。世界经济论坛目录只确认宽泛公司介绍，不涉及经济性。讨论价格前，应取得当前公司存续状态、董事会批准的融资文件、经审计股权结构表、清算优先权、债务和留置权、现金与
              runway、客户级特许权收入、签署订单及二级需求证据。若无法验证这些记录，或伙伴终止、优先权悬垂及商业化不足消除了可信的风险调整回报，即构成论点破坏。
