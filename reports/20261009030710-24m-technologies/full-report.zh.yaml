      - number: '4.5'
        title: 财务尽调结论与投资判断局限
        blocks:
          - type: paragraph
            body: >-
              评估 24M Technologies
              显示，私募市场声称的估值与底层现金流生成之间存在无法弥合的差距。战略企业投资者基于专利和试产线演示投入数亿美元，但商业模式从未实现广泛多元化；授权费不足以在伙伴延迟或取消超级工厂部署时支撑长期电池化学研发。机构尽调缺少经审计财报、特许权会计明细和现金余额台账，构成阻断性障碍。公司
              2026 年清算并拍卖物业后，股权价值实际上已受损，回收仅受 IP 出售收益和清算瀑布限制。潜在投资者或技术收购方应只核查专利负担、剩余授权权利及终止协议引发的法律责任。
