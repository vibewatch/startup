        title: 展品
        blocks:
          - type: callout
            title: 规模护城河：流程知识产权为何败给亚洲 传统龙头
            body: >-
              24M 的战略假设是，取消电芯外壳和浆料干燥可将制造成本最多降低 40%，从而吸引全球 OEM 签署授权合同。现实是，CATL、BYD 和 Panasonic
              依靠吉瓦时规模、原料纵向整合和激进定价取得类似降本，抵消了 24M 的流程优势，同时避免伙伴重设计风险。
