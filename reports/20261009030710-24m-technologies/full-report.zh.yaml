        - 极高；要求被授权方重做制造产线和电池包架构
        - 易受被授权方执行延期影响；2026 年清算使特许权使用费管线归零
      - - 固态电池开发商（QuantumScape）
        - 与汽车 OEM 组建合资企业，并直接销售电芯组件
        - 高毛利汽车电芯合同，附带开发里程碑补贴
        - 很高；商业良率尚未验证，OEM 汽车测试周期长达多年
        - 实现正现金流前需要更长的现金消耗周期
      - - 硅负极专业厂商（Enovix）
        - 直接制造商品电芯，并参与客户电池设计
        - 按体积能量密度溢价为每颗电芯定高价
        - 消费电子领域中等；汽车动力电池包领域较高
        - 需要持续资本开支扩建自有工厂产能
      - - 既有电池巨头（Panasonic / CATL）
        - 面向全球车企进行大批量电芯和模组直供制造
        - 按大宗商品成本加成及长期销量指数定价（以 $/kWh 计）
        - 低；标准尺寸（圆柱 / 方形）可直接装入现有整车架构
        - 巨大的规模经济会严重压缩早期进入者的利润率
      - - 梯次利用储能集成商（Libattion）
        - 交钥匙固定式储能硬件与资产管理软件
        - 资本设备销售（系统成本 $/kWh）加经常性维护合同
        - 对寻求更低成本可持续储能替代方案的固定式储能买家而言较低
        - 受制于二手车电池供应，以及缺乏移动 EV 市场布局
