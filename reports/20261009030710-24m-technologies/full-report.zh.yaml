  - id: TP002
    title: 不同电池架构的特性与能力矩阵
    columns:
      - 采购 / 尽调标准
      - 24M Technologies（SemiSolid / ETOP）
      - 固态电池同类（QuantumScape）
      - 硅负极同类（Enovix / Amprius）
      - 现有超级工厂（Panasonic / CATL）
      - 升级利用型 ESS（Libattion）
    rows:
      - - 电芯 / 电池包能量密度
        - ETOP 带来高电池包密度（声称活性体积占比 70-80%）；电芯密度中等
        - 通过无负极锂金属设计实现极高理论质量能量密度
        - 电芯体积能量密度极高（硅纳米线最高达 450-500 Wh/kg）
        - 行业基准（NMC 为 260-300 Wh/kg，LFP 为 160-200 Wh/kg）持续提升
        - 退化的二次生命汽车模块限制了电池包密度，处于低至中等水平
      - - 制造资本开支要求
        - 声称通过取消干燥、溶剂回收与模块环节，最多可降低 40%
        - 极高；需要洁净室陶瓷加工与专用烧结设备
        - 高；定制机械堆叠与自动化激光装配线
        - 总资本开支极高（每 GWh $50-80M），但可由多吉瓦规模效应抵消
        - 极低；无需合成电芯，只需组装与集成退役电池包
      - - 热稳定性与安全机制
        - Impervio 抑制枝晶的隔膜与厚电极架构
        - 不可燃固态陶瓷隔膜，消除挥发性液态电解液
        - 缓解硅体积膨胀的机械约束架构
        - 外部液冷板、防火隔板与 BMS 主动热管理
        - 标准电池包级外壳与多层电池管理安全监控
      - - 快充倍率能力
        - Eternalyte 电解液声称可在 4 分钟内支持 200 英里续航（电导率约 26 mS/cm）
        - 目标是在 15 分钟内从 10% 充至 80%，且不发生枝晶短路
        - 能够短时实现高 C 倍率，但需要谨慎热管理
        - 标准 15-30 分钟快充已在全球直流网络中得到商业验证
        - 为保护固定式储能，充电倍率通常限制在 0.5C - 1C
      - - 低温容量保持率
        - Eternalyte 声称在 -20°C、1C 倍率下容量保持率超过 80%
        - 不加热时，固态电解质在零度以下离子电导率下降
        - 零度以下仍受标准电解质的局限影响
        - 在 -20°C 下容量损失 20%–30% 甚至更多；需要主动加热电池包
        - 安装于受控温的固定式集装箱或公用设施机柜
      - - 商业成熟度与规模
        - 2026 年停止运营；除 Kyocera 的 400 MWh 产线外，商业进展有限
        - 尚无收入 / 处于汽车试点原型阶段；需多年验证
        - 消费电子已有早期商业收入；汽车领域正在送样
        - 大规模商业化；全球已部署数百 GWh
        - 已在公用事业及工商业固定式储能中商业部署
    enumerationScope:
      coverage: sample
      basis: >-
        Evaluation of core technical and operational criteria across five battery architecture paradigms based on public
        disclosures and partner agreements.
    notes: 24M 的技术主张来自公司技术问答和新闻公告披露；实际商业部署因 2026 年清算而中止。
    claimRefs:
      - CP002
      - CP007
      - CP010
      - CP011
      - CP012
      - CP013
  - id: TP003
    title: 商业模式、定价结构与战略含义
    columns:
