  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局分类：同行、 传统龙头 与替代方案
        blocks:
          - type: paragraph
            body: >-
              24M Technologies 面对的竞争格局可分为五类：先进固态和硅电芯开发商、东亚 传统龙头 电芯制造商、专业电池组件供应商、二次利用储能整合商，以及汽车 OEM
              自研电芯项目。QuantumScape、Enovix 和 Amprius Technologies 分别获得 $1B+、$220M+ 和 $55M+ 融资，推进锂金属固态隔膜和 100%
              活性硅纳米线负极等架构。Panasonic Energy、CATL、BYD、Sunwoda Electronic 依靠空前制造规模、纵向供应链和多年良率优化主导汽车供应链。Ningbo Shanshan
              Co.、Crown Battery Manufacturing 提供成熟材料和工业储能供应；Libattion 以二次利用储能避开制芯风险。Volkswagen Group 的 PowerCo 等 OEM
              也在将内部架构与外部供应商比较，抬高第三方技术采用门槛。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
