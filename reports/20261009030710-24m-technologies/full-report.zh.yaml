      - number: '4.3'
        title: 成本结构、毛利率驱动因素与运营效率
        blocks:
          - type: paragraph
            body: >-
              24M 的 SemiSolid 平台的经济逻辑是帮助电池生产商降本：相比传统锂离子产线，资本开支和运营成本最多节省 40%。取消粘结剂添加、溶剂回收和长时间烘箱干燥后，24M 称非活性材料最多减少
              80%，设备占地也更小；但这些节省直接归制造授权客户所有，不代表 24M 自身毛利。24M 内部采用先进研发组织的成本结构，支持 84 至 153 名工程、材料科学、管理和 IP
              诉讼人员，开支集中于剑桥实验室试产和配方测试。由于 24M 从未披露公开财报，毛利率、获客成本、客户终身价值和销售周期均属于不可得的私有数据。
