  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与类别定义
        blocks:
          - type: paragraph
            body: >-
              24M Technologies 位于先进锂离子电池行业，开发与传统制造显著不同的专有制造流程和电芯架构。公司 2010 年在马萨诸塞州剑桥作为 MIT
              分拆企业成立，主要靠知识产权授权和工程合作伙伴商业化，而不是作为重资产电芯制造商。技术边界包括两大平台：SemiSolid 电极和 Unit Cell 设计，后者去掉传统非活性材料以降低成本；以及
              Eternalyte 高级电解液、Impervio 电池隔膜等新组件。这些技术面向住宅及固定式 ESS、汽车 EV、专业消费和工业电子三类可服务市场。但 24M
              的商业市场边界严格限于知识产权变现——预付授权费、联合开发协议和按产量计的特许权使用费——不包括成品电池包销售或直接商品电芯制造支出。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 受约束的可服务市场规模与估值视角
        blocks:
          - type: paragraph
            body: >-
              评估 24M 的可服务市场，必须区分数十亿美元级自上而下的储能预测与授权生产量的现实。全球 EV 和固定式储能市场估值超过 150 billion dollars，但 24M
              的可服务市场受限于愿意授权替代制造平台的电芯制造商比例。商业部署高度依赖伙伴：Kyocera Corporation 是唯一在运营的商业授权客户，在 Enerezza 住宅储能系统中部署 SemiSolid
              工艺，滋贺八日市工厂年产 20,000 台（约 200 MWh）。Kyocera 承诺投入 10 billion yen，到 FY2026 将产能扩至 400 MWh，但截至 2023
              年初产能利用率约一半。与此同时，FREYR Battery 于 2024 年 11 月正式终止授权，支付 3 million dollar 和解金并放弃潜在的欧洲多吉瓦管线，令 24M
              进军西方超级工厂的计划大幅收缩。因此，24M 的实际市场份额取决于授权客户的执行，而非电池需求的 表面规模 规模。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
              - CM013
              - CM015
