  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与知识产权授权模式
        blocks:
          - type: paragraph
            body: >-
              24M Technologies 作为 MIT 分拆企业成立，开发并商业化 SemiSolid
              锂离子制造平台，以无粘结剂浆料取代高溶剂电极干燥。公司不自建超级工厂，而是采用轻资产技术授权和联合开发模式，潜在现金流包括预付授权费、按产量计的特许权使用费、联合开发工程服务和政府补助。尽管 24M
              面向移动、消费电子和固定式电网储能推广平台，24M 的商业变现仍高度集中：只有日本授权商 Kyocera 的住宅储能制芯获得商业生产证据。外部市场情报估算 24M 收入为 $10 million 至 $37.6
              million，但这是行业统计建模而非经审计报表；确切费率、基础授权费和软件或订阅费仍严格保密。
