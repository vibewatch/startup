      - number: '8.3'
        title: 情景与可比证据
        blocks:
          - type: paragraph
            body: >-
              商业证据提供了期权价值，但无法搭出可比估值桥梁。公司公告称 Kyocera 计划到 fiscal 2026 将年产能从 20,000 台翻倍，靠 JPY 10 billion 产线投资达到 400
              MWh；另一公告称 Eternalyte 已可立即供应并兼容现有工艺。这些是里程碑信号，却不披露 24M 的收入、特许权费、利润率、现金生成、客户集中或经审计部署结果。估值登记明确缺少 EV/收入
              和阶段倍数，资料池也没有真正可比上市公司或收购交易数据。因此，乐观、基准和悲观情景必须保持有条件且非数字化；附加概率或区间会制造证据不支持的精确度。
