    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、地点与商业模式
        blocks:
          - type: paragraph
            body: >-
              24M Technologies 成立于 2010 年，起源于 MIT 电池研究。独立资料和公司材料均将其地点指向马萨诸塞州剑桥。公司把自己定位为电池技术开发商，而非拥有单一高产能自营电芯工厂；公开产品覆盖
              SemiSolid 与 Unit Cell 制造平台、安全、单体集成、隔膜和电解液。这个定位指向由电池制造商和伙伴部署技术的商业化模式。现有证据支持其历史身份和产品定位，但不能证明截至 2026-10-09
              仍处于某个当前运营阶段。
