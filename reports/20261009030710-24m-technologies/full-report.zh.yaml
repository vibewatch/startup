              6,975,956 股 Series G 优先股相关的权利，24M 可用一美元赎回这些股份。文件未披露 24M 的完整资本结构，不能将该交易泛化为全公司每股价值，但证明伙伴、授权及优先股权利可以按显著不同于旧
