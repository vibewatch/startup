              24M 高度依赖战略企业股权注资，却没有持续的高毛利特许权收入 [CR011]。收缩前，公司依赖 Nuovo Plus 领投的 2024 年 9 月 $87 million Series H 及 Asahi
              Kasei、Dai Nippon Printing 等企业支持，私募估值 $1.3 billion [CR012]。生命周期累计融资超过 $100 million，但仅有 97 至 119
              名员工，体现研发授权结构而非运营制造企业 [CR013]。Volkswagen 的 25% 股权未转化为快速超级工厂部署、FREYR 又退出后，24M 缺乏独立商业承购方的现金流多元化
              [CR014]。在行业下行和里程碑特许权缺失导致现金烧钱激增时，24M 于 2026 年进入正式清算 [CR015]。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: 展品
        blocks:
          - type: callout
            title: 论点破坏因素：FREYR 授权框架解体
            body: >-
              2024 年 11 月 4 日与 FREYR Battery 的正式终止证明 24M Technologies 的，24M 授权模式无法承受新兴超级工厂开发商的资本收缩 [CR002]。FREYR 以 $1.00
              交回 6.98 million 股 Series G 并放弃 SemiSolid 技术，切断了这家初创公司最可信的吉瓦级生产路径 [CR003]。事件表明，没有自有生产资产的专有制造
              IP，在运营伙伴退出时会让技术授权商束手无策 [CR004]。
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR004
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策与入场纪律
        blocks:
          - type: paragraph
            body: >-
              适当决策是继续研究，而不是编造企业价值或目标回报。指定证据中最强的价格标记是第三方登记的 2024 年 6 月 $1.3 billion；该记录不披露轮次金额、投资者、收入倍数或阶段倍数。后续数据库预览称
              2024 年 9 月有 $87 million Series H，但未公开股权结构表
              或经济条款。这些记录不能确定运行日期的当前入场价。因此，否决姿态对价格敏感：只有验证当前公司状态、一手融资文件、完全稀释持股、优先权、债务和运营证据后才会改变。对暂缓投资决定的信心为中等，对任何精确估值的信心为低，因为分母和交易权利缺失。
