      - number: '4.4'
        title: 资本充足度、融资历史与不利清算证据
        blocks:
          - type: paragraph
            body: >-
              自 2010 年成立以来，24M Technologies 在 14 轮融资中累计筹得超过 $500 million 股权资本。2024 年 9 月，24M 宣布由 Nuovo Plus 领投的 $87
              million Series H，Asahi Kasei、Dai Nippon Printing、Kyocera、Lucas TVS 和 Mitsui O.S.K. Lines 参与，投后估值 $1.3
              billion；截至 2025 年 6 月还获得能源部合计 $13.5 million 的非稀释研发资金。达到独角兽估值后不到 18 个月，24M 仍面临严重资本充足度约束。MIT Technology
              Review 于 2026 年 3 月报道称，24M Technologies
              正在关闭并通过物业拍卖清算实物资产。无法形成自我维持现金流，凸显先进清洁技术硬件的“死亡之谷”：汽车认证周期长、超级工厂建设多年，电动车行业宏观降温会在特许权收入覆盖运营烧钱前耗尽风险资本。
