      - CI007
      - CI009
      - CI011
  - id: FE001
    title: 从材料到合作伙伴部署的产品架构
    type: stack
    summary: 产品组合覆盖材料组件、制造、电池包设计和许可转移层；每一步都有不同的认证风险。
    data:
      layers:
        - label: 电极材料
          detail: SemiSolid 配方是平台基础。
          items:
            - label: SemiSolid 电极
              detail: 厚电极无需传统干燥即可加工。
        - label: 电解质
          detail: Eternalyte 针对传输、快充和低温性能。
          items:
            - label: Eternalyte
              detail: 公司披露的电芯指标需要独立复现。
        - label: 隔膜
          detail: Impervio 被定位为 Eternalyte 的安全补充。
          items:
            - label: Impervio
              detail: 来源池中的公开证据由公司发布。
        - label: 电芯制造
          detail: SemiSolid 工艺减少非活性材料和制造步骤。
          items:
            - label: 合作伙伴生产线
              detail: 落地取决于工艺转移和产线控制。
        - label: 电池包架构
          detail: ETOP 将密封电极对直接集成进电池包。
          items:
            - label: ETOP
              detail: 来源池中没有包装效率主张的独立验证。
        - label: 商业部署
          detail: 许可方负责认证、融资、运营并支持生产。
          items:
            - label: 合作伙伴运营的制造
              detail: Kyocera 提供商业化证明，而 FREYR 暴露出流失风险。
    approximationNotes: 分层顺序反映已披露的产品逻辑；不代表所有产品都集成在同一生产系统中。
    claimRefs:
      - CE001
      - CE006
      - CE007
      - CE008
      - CE009
      - CE011
      - CE013
      - CE015
      - CE016
  - id: FU001
    title: 24M Technologies 客户采用与商业化历程
    type: journey-map
    summary: 24M 客户关系从技术评估走向商业规模的多阶段进程，体现试点验证与规模化制造之间的严重脱节。
    approximationNotes: 阶段和合作伙伴进展综合自已核实的监管文件、公司公告和技术评估。
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU009
      - CU010
      - CU011
    data:
      items:
        - label: 阶段 1：技术许可与 IP 探索
          summary: >-
            Industrial partners evaluate SemiSolid and ETOP intellectual property, negotiating access rights and equity
            participation.
          detail: 包括与 Kyocera、FREYR Battery 及 Series H 战略投资者签署的初步可行性协议。
          unit: Partnership Exploration
          status: Initial Milestone
        - label: 阶段 2：联合开发与工程集成
          summary: >-
            Partners collaborate with 24M engineering to adapt slurry chemistry and pack integration to target
            applications.
          detail: Kyocera Shiga Yasu 产线开发及 FREYR 在 Mo i Rana 的试点工厂试验。
          unit: Engineering Validation
          status: Active Engineering
        - label: 阶段 3：原型交付与试点测试
          summary: Delivery of functional cells and ETOP prototype packs to prospective automotive and storage OEMs.
          detail: 向未具名的知名汽车 OEM 交付 ETOP 无电芯电池包，用于续航和安全测试。
          unit: Pilot Shipments
          status: Pre-Commercial
        - label: 阶段 4：商业规模工厂投产
          summary: >-
            Capital-intensive deployment of dedicated manufacturing lines capable of multi-megawatt or gigawatt cell
            fabrication.
          detail: 完全由 Kyocera 成功实现（20,000 units/year），而 FREYR 放弃了工厂建设。
          unit: Commercial Deployment
          status: Narrow Realization
        - label: 阶段 5：多吉瓦扩张与扩张循环
          summary: Diversified global roll-out across automotive EV platforms and utility-scale grid storage pipelines.
          detail: 未能落地；FREYR 终止合作、汽车行业趋于谨慎，加上 24M 公司收缩，使其被迫中止。
          unit: Scaled Operations
          status: Failed / Blocked
        - label: 流失节点：终止与资产清算
          summary: >-
            Mutual contract terminations, forfeiture of equity stakes, and inability to transition pilots to volume
            royalties.
          detail: 2024 年 11 月 FREYR 退出合同，并于 2026 年清算公司资产。
          unit: Contract Dissolution
          status: Severe Risk Outcome
