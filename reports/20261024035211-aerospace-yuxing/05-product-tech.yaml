  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: assurance
      missingEvidence: Independent evidence of cybersecurity controls, service-level reliability, redundancy, radiation qualification, and applicable licenses or approvals.
      whyItMatters: Mission-support and servicing products can create safety, operational, and liability exposure even when a component demonstration succeeds.
      diligencePath: Request the technical assurance pack, incident and SLA history, qualification reports, security controls, and service-specific licensing map.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
      topic: commercialization
      missingEvidence: Customer contracts, paid deployment counts, backlog, renewal terms, and service-line gross-margin or utilization data.
      whyItMatters: Demonstrated capability does not establish repeatable demand, pricing power, or cash-generating product maturity.
      diligencePath: Obtain a customer-by-customer deployment schedule, contract extracts, paid versus pilot status, and management accounts by product line.
      relatedQuestionRefs: [QE005, QE008]
    - type: access-blocked
      severity: minor
      topic: independent-validation
      missingEvidence: Full text and technical detail from the SpaceNews report beyond its accessible summary.
