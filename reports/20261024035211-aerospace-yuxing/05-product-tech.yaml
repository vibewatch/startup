company:
  name: Aerospace Yuxing
chapter:
  number: 5
  title: Product & Technology
  summary: Aerospace Yuxing is described as a space-infrastructure and operations provider, with public evidence spanning ground-station communications and an emerging in-orbit servicing capability. The strongest technical proof is a July 2026 X-band ground-station test and independently reported 2026 demonstrations of a flexible robotic arm; commercial reliability, product-level economics, and security controls remain insufficiently disclosed.
sections:
  - id: delivered-product
    title: Delivered product and operating surface
    body: >-
      Public descriptions place Aerospace Yuxing in the space-infrastructure and
      in-orbit-operations layer rather than in a single spacecraft product. A June
      2026 report carried by Sina Finance describes the company as combining
      commercial space TT&C technology development, communications-product
      manufacturing, and spacecraft in-orbit operations, with services including
      launch and satellite TT&C, payload-data reception, remote-sensing calibration,
      collision warning, debris cleanup, and digital space applications. The report
      attributes 684 cumulative paid satellite/rocket services through June 15 and
      92.8% coverage of the paid commercial-satellite TT&C market during 2025, but
      it does not disclose the counting methodology, denominator, contract value,
      or product-level revenue. Because Sina says the item was republished from a
      partner publication, these figures remain reported traction rather than
      independently audited operating data. The product therefore appears to be a
      portfolio of mission-support services and infrastructure, with exact SKU
      boundaries, utilization, and economics still requiring diligence.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001]
  - id: technical-architecture
    title: Ground, space, and control architecture
    body: >-
      The clearest demonstrated operating loop is a ground-to-space communications
      path. In July 2026 Aerospace Yuxing and Shanghai Jingji Communication
      completed an X-band 4.2 Gbps wireless data-transmission test using Aerospace
      Yuxing's Zhongwei 13-meter ground station; the report says the experiment
      achieved long-term continuous, error-free stable transmission and verified
      high-order-modulation and high-bit-rate reception capability. Separately,
      public reporting on the Yuxing-3 06/Xiyuan-0 mission describes a flexible
      continuum hollow robotic arm with rear-mounted cable transmission. The
      on-orbit demonstrations included programmed simulated refueling, remote
      operator control, visual-servo docking, and force-compliant manipulation.
      The reported design puts drive-control components inside the satellite body
      and pairs force sensing, camera feedback, onboard planning, and ground
      control. Interesting Engineering further reports that a global ground-station
      network supported up to 20 minutes of telemetry and control per pass with
      sub-second loop delay during the demonstration. These are demonstrations of
      component and control modes, not proof of routine commercial servicing,
      autonomous operation against an uncooperative target, or end-to-end customer
      deployment.
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE010, CE016]
    tableRefs: [TE002]
    figureRefs: [FE001]
  - id: maturity-risk-controls
    title: Maturity, differentiation, and technical risk
    body: >-
      The evidence supports two different maturity levels. The ground-station
      subsystem has a measured 4.2 Gbps test result, while the servicing branch
      has completed an in-orbit technology demonstration with four reported test
      modes. A public review of digital twins in space environments identifies
      real-time monitoring, fault prediction, remote operations, and lifecycle
      maintenance as potential benefits, but also identifies data-transmission
      delays, model accuracy, and user-interface design as implementation
      challenges; those are relevant engineering risks, not evidence that
      Aerospace Yuxing has deployed a digital-twin product. The flexible-arm
      reports also do not establish regulatory approvals, cybersecurity controls,
      incident history, radiation qualification, redundancy, or customer
      acceptance criteria. Sina reports that newly raised capital is intended for
      intelligent TT&C systems, mega-constellation ground communications,
      in-orbit safety and health management, and expansion of the global
      ground-station network, which identifies a direction of travel but not
      delivered roadmap milestones. The technical differentiation case is
      plausible and supported by demonstrations, but commercialization depends on
      converting test capability into repeatable, insured, and contractually
      supported operations.
    claimRefs: [CE011, CE012, CE013, CE014, CE015]
    tableRefs: [TE003]
