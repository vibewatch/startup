              - CE015
              - CE016
      - number: '5.3'
        title: Maturity, differentiation, and technical risk
        blocks:
          - type: paragraph
            body: >-
              The evidence supports two different maturity levels. The ground-station subsystem has a measured 4.2 Gbps
              test result, while the servicing branch has completed an in-orbit technology demonstration with four
              reported test modes. A public review of digital twins in space environments identifies real-time
              monitoring, fault prediction, remote operations, and lifecycle maintenance as potential benefits, but also
              identifies data-transmission delays, model accuracy, and user-interface design as implementation
              challenges; those are relevant engineering risks, not evidence that Aerospace Yuxing has deployed a
              digital-twin product. The flexible-arm reports also do not establish regulatory approvals, cybersecurity
              controls, incident history, radiation qualification, redundancy, or customer acceptance criteria. Sina
              reports that newly raised capital is intended for intelligent TT&C systems, mega-constellation ground
              communications, in-orbit safety and health management, and expansion of the global ground-station network,
              which identifies a direction of travel but not delivered roadmap milestones. The technical differentiation
              case is plausible and supported by demonstrations, but commercialization depends on converting test
              capability into repeatable, insured, and contractually supported operations.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE011
              - CE012
              - CE013
              - CE014
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Technical proof is stronger than product disclosure
            body: >-
              A measured 4.2 Gbps ground-station test and an on-orbit flexible-arm demonstration provide concrete
              technical evidence, but public materials do not yet connect those demonstrations to recurring customer
              contracts or operating KPIs.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE010
          - type: callout
            title: Commercial readiness remains unproven
            body: >-
              The assigned evidence does not establish reliability distributions, security controls, regulatory
              approvals, service-level commitments, or repeatable economics for the servicing branch.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and use-case segmentation
        blocks:
          - type: paragraph
            body: >-
              Aerospace Yuxing sells infrastructure into a business-to-business satellite ecosystem rather than a
              consumer market. Dealroom describes the client focus as B2B and identifies telemetry, tracking, and
              command services, data transmission and processing, constellation-management software, calibration, and
              one-stop in-orbit management as the commercial offer. The APIs.io profile describes a network of more than
              60 ground stations and a service catalog spanning launch and spacecraft TT&C, on-orbit operations,
              remote-sensing calibration, collision warning, debris mitigation, frequency coordination, licensing
              support, and engineering consulting. That combination implies several buyer groups: satellite operators
              purchasing recurring passes and operations, launch or spacecraft customers needing mission support, and
              remote-sensing operators needing data reception or calibration. It does not establish how much revenue
              comes from any segment, whether customers buy multiple modules, or whether international sites are
              operated directly or through partners.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
      - number: '6.2'
        title: Adoption trajectory and named customer proof
        blocks:
          - type: paragraph
            body: >-
              The strongest public adoption signal is operational footprint, not a disclosed customer cohort. APIs.io
              states that the company has served over 370 satellites and rockets, while Dealroom reports support for
              more than 400 satellites and rockets; the two figures are directionally consistent but differ in scope or
              timing, so they should not be combined into a growth rate. The public record also ties specific satellite
              missions to identifiable operators and use cases. The Beijing 3C page identifies 21AT as operator of four
              Earth-observation satellites launched together in May 2024. China Daily reports that Guodian Gaoke's
              Tianqi network reached 41 satellites after a January 2026 launch and describes uses in forestry,
              agriculture, tourism, power generation, and environmental protection. Global Times separately reports 41
              satellites in the Tianqi constellation and use across forestry, agriculture, emergency response, water
              resources, energy, marine monitoring, and smart-city management. These sources support ecosystem-level
              deployment context, but they do not prove that Aerospace Yuxing was the contracted service provider for
              each mission.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU010
              - CU011
              - CU012
      - number: '6.3'
        title: Retention, expansion, and concentration diligence
        blocks:
          - type: paragraph
            body: >-
              No assigned source discloses net revenue retention, gross retention, churn, renewal rates, contract
              length, backlog, customer concentration, or expansion revenue. Dealroom reports a cost-per-pass revenue
              model, which can align revenue with satellite activity, but the source does not provide pass volume,
              pricing, utilization, minimum commitments, or renewal behavior. The company’s broad ground-station
              footprint and integrated lifecycle offering could support cross-sell from launch support into operations,
              data processing, calibration, or safety services, yet that is an analytical possibility rather than
              observed expansion. The public customer evidence is also uneven: named operators and mission applications
              demonstrate an addressable workflow, while the sources do not identify signed contracts, production status
              for Aerospace Yuxing’s own services, customer outcomes, or service-level performance. The underwriting
              implication is that adoption is plausible and externally visible, but durability and concentration remain
              material diligence gaps.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Mission-linked demand is visible
            body: >-
              Named satellite operators, launch missions, and sector-specific applications provide stronger adoption
              evidence than an undifferentiated logo list, although the sources do not attribute every mission to
              Aerospace Yuxing.
            calloutType: strength
            claimRefs:
              - CU006
              - CU007
              - CU008
          - type: callout
            title: Retention and concentration are unverified
            body: >-
              The assigned evidence does not disclose customer-level revenue, renewal, churn, contract duration,
              backlog, or top-customer concentration, so recurring quality and downside exposure cannot be scored from
              public data.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and data exposure
        blocks:
          - type: paragraph
            body: >-
              China’s commercial-space opening is not equivalent to unrestricted private-market access. A legal analysis
              of the 2025 policy package says the Action Plan supports commercial participation while satellite
              communications remain subject to licensing, and it describes basic telecommunications licensing as
              requiring at least 51% state interest. The same analysis says further secondary rules are expected for
              launch, tracking, telemetry and control, in-orbit operations, transfers, de-orbit and re-entry. For
              Aerospace Yuxing, this creates a licensing and permissions risk around each service line and any overseas
              or cross-border operating model. Data obligations are also material: China’s Personal Information
              Protection Law applies to processing inside China and certain processing outside China involving people in
              China, while the Data Security Law requires lifecycle controls, risk monitoring, incident response, and
              possible security review for data processing that may affect national security. The public record does not
              establish Aerospace Yuxing’s licenses, data classifications, cross-border arrangements, or incident
              history, so residual exposure remains unquantified.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational, safety, and technology bottlenecks
        blocks:
          - type: paragraph
            body: >-
              The sector’s execution risk is shaped by launch cadence, reusable-rocket availability, orbital
              coordination, and the reliability of distributed space infrastructure. MERICS reports that Chinese
              constellations face limited launch capacity and structural and operational constraints, and describes the
              lack of a reusable rocket as a major bottleneck. Its account also says 2025 launches were insufficient to
              meet the ten-percent spectrum milestones it describes for Guowang and SpaceSail. Orbital Radar reports
              that Qianfan deployment paused after thruster or gyroscope failures before resuming after corrective
              measures, and notes that higher-orbit failures can persist for decades to centuries. These are sector
              observations rather than proof of an Aerospace Yuxing failure, but they define plausible reliability,
              schedule, safety, and cost transmission channels for a company providing launch TT&C, in-orbit operations,
              calibration, and related ground/software services. Public evidence does not disclose Aerospace Yuxing’s
              SLA, redundancy, incident, insurance, or service-level data.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Partner, geopolitical, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              China’s satellite-internet buildout is strategically dual-use and heavily state-linked. MERICS describes
              state-owned enterprises as the backbone of the sector, strong state influence even in ostensibly private
              funding, and private firms often working as subsystem providers rather than full constellation operators.
              It also reports substantial launch-cost disadvantages versus Falcon 9 and says private companies are being
              drawn in to address scale and cost bottlenecks. Other reporting describes China’s effort to reserve
              spectrum and build sovereign infrastructure, while official reporting highlights commercial firms’ role in
              mass production and state plans. This combination can create opportunity but also exposes suppliers and
              service providers to procurement concentration, policy reprioritization, export or cross-border
              restrictions, capital intensity, and counterparty dependence. No public source in the assigned pool
              discloses Aerospace Yuxing’s customer concentration, contract duration, backlog, margins, burn, working
              capital, insurance, or supplier concentration; those are material gaps rather than assumptions.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Monitoring indicators and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              The risk posture should be monitored through observable gates rather than broad confidence in sector
              growth. Near-term indicators include licensing or type-approval changes affecting TT&C and related
              services; published enforcement, outage, breach, safety, or launch-failure events; missed deployment or
              spectrum milestones; customer or partner concentration disclosures; and evidence that launch-cost or
              reusable-rocket bottlenecks are not improving. A thesis break would be a material loss or suspension of a
              required authorization, a repeated service or safety incident without documented remediation, a major
              counterparty or supplier failure without redundancy, or financial evidence that capital intensity and
              working-capital needs cannot be funded. Because the company-level public record is incomplete, investor
              diligence should require a service-by-service license map, incident and SLA log, customer and supplier
              concentration schedule, insurance coverage, management accounts, and cap-table and financing terms before
              treating residual risk as low.
            claimRefs:
              - CR002
              - CR005
              - CR008
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR009
              - CR012
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory access is a gating risk
            body: >-
              The public legal analysis describes a selective, state-linked opening rather than unrestricted private
              access; a service-by-service authorization map is required before residual exposure can be reduced.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: Sector growth does not remove execution risk
            body: >-
              State-backed demand and constellation plans coexist with launch-capacity, reusable-rocket,
              orbital-reliability, and funding bottlenecks.
            calloutType: risk
            claimRefs:
              - CR005
              - CR009
              - CR010
          - type: callout
            title: Diligence before underwriting
            body: >-
              Do not underwrite low residual risk until licensing, incident/SLA, customer and supplier concentration,
              insurance, management accounts, and financing terms are supplied.
            calloutType: recommendation
            claimRefs:
              - CR002
              - CR004
              - CR008
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case rests on a reported operating footprint rather than an untested concept. A January 2026
              article relaying company figures said Aerospace Yuxing completed 10 rocket launch-and-control missions and
              47 satellite flight-control missions in 2025. It separately reported an awkwardly translated cumulative
              denominator of 616 paid services "per rocket," more than 400 paid-service satellites in orbit, and 92.8%
              coverage of the annual commercial satellite launch-and-control paid-service market. A June 2026
              financial-news article described nearly 2 billion yuan across D, D+, and D++ financing and said the
              proceeds would fund measurement-and-control systems, constellation ground systems, and in-orbit safety and
              health management. These figures indicate capital access and activity, but they are not audited revenue,
              cash availability, or investor returns. Planet Labs offers only an adjacent public reference: October
              snapshots put its market capitalization near $4.87 billion and Yahoo Finance listed 14.48 times
              price-to-sales and 14.85 times enterprise value-to-revenue alongside a TTM net loss. KSAT's more than 280
              antennas across 26 locations show the scale of an established ground-network competitor, not a directly
              transferable valuation.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV011
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV008
              - CV009
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: Scenarios and entry discipline
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more reliable than a point estimate because the decisive company inputs are
              private. The bull case requires verified conversion of paid launch and satellite-control activity into
              recurring, collectible revenue, while China's constellation programs continue deploying and opening
              international service markets. Reuters reported a SpaceSail-Telebras memorandum tied to planned Brazilian
              service, a concrete demand signal but not evidence of Aerospace Yuxing revenue. The base case assumes
              continuing strategic relevance while capital intensity and private-company opacity constrain underwriting.
              The bear case combines a funding or multiple reset with slower constellation deployment, customer
              concentration, cross-border constraints, or failed commercialization of in-orbit servicing. Orbital Radar
              reported a prior Qianfan pause after spacecraft failures, while SatNews emphasized the gap between Chinese
              orbital filings and launch infrastructure; both are downside signals rather than quantified forecasts.
              Without a transaction valuation, normalized company revenue, margins, cash, and security terms, numeric
              valuation ranges and probability-weighted returns would be false precision. Entry should remain
              conditional on those records.
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV007
              - CV010
              - CV012
              - CV014
              - CV016
      - number: '8.3'
        title: Decision, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The present decision is track/research-more, not buy. This is price discipline rather than a negative
              judgment on strategic relevance: the evidence supports financing momentum, operating activity,
              constellation demand, and an emerging international market, but it does not support a defensible entry
              price or target return. A bull case would need audited revenue quality, margins, collections, customer
              retention, and repeatable in-orbit-servicing contracts. A bear case becomes more likely after a down
              round, material deployment delay, major customer loss, inability to fund network expansion, or preference
              terms that transfer most downside to common holders. Exit readiness also remains unverified: the assigned
              evidence does not establish ownership, governance, liquidity rights, IPO timing, or an executable buyer
              set. The immediate diligence path is the latest financing package, fully diluted capitalization,
              management accounts, customer and backlog cohorts, cash runway, incident history, and signed
              commercialization milestones. Until those are reconciled, adjacent public multiples should be treated as
              context, not a valuation formula.
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track until price and terms are verifiable
            body: >-
              Public evidence supports operating traction and financing access, but not a defensible entry valuation or
              return forecast. A buy call should wait for round price, cap-table rights, cash-flow, and
              customer-economics diligence.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV006
              - CV015
              - CV016
          - type: callout
            title: Financing headlines are not investor returns
            body: >-
              Reported financing amounts describe capital raised, not cash available after conditions, dilution,
              liquidation preferences, or operating burn.
            calloutType: risk
            claimRefs:
              - CV004
              - CV006
              - CV013
