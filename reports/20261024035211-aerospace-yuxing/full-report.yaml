  - id: FI001
    title: Evidence-backed revenue model bridge
    type: flow
    summary: >-
      The public operating model connects financed infrastructure and ground capacity to mission services, equipment
      delivery, and potential future in-orbit servicing, but does not disclose conversion into recognized revenue or
      gross profit.
    data:
      nodes:
