  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Demonstrated ground-station and in-orbit-servicing components sit within a broader, partly undisclosed
      mission-operations stack.
    data:
      layers:
        - label: Customer mission services
          detail: Publicly described mission-support and in-orbit operations surface.
          items:
            - name: TT&C and data services
              detail: Launch and satellite TT&C, payload-data reception, and calibration are publicly described service lines.
            - name: Safety and in-orbit operations
              detail: >-
                Collision warning, debris-related services, and in-orbit operations are described but not operationally
                quantified.
        - label: Ground and control infrastructure
          detail: Demonstrated ground-station and space-ground control components.
          items:
            - name: Zhongwei ground station
              detail: Aerospace Yuxing's 13-meter ground station supported the reported 4.2 Gbps X-band test.
            - name: Space-ground control
              detail: >-
                Reported robotic-arm tests used onboard planning, remote operator input, camera feedback, and force
                sensing.
        - label: In-orbit servicing payload
          detail: Demonstrated flexible-arm payload and servicing test modes.
          items:
            - name: Flexible continuum arm
              detail: The reported design uses a hollow flexible arm and rear-mounted cable transmission.
            - name: Servicing test modes
              detail: Reported modes included simulated refueling, visual-servo docking, and force-compliant manipulation.
        - label: Potential digital operations
          detail: Sector-relevant operating layer, not a verified company deployment.
          items:
            - name: Monitoring and predictive support
              detail: >-
                Digital-twin literature identifies these as sector applications, not as a verified Aerospace Yuxing
                deployment.
        - label: Integration and assurance
          detail: Customer interfaces, qualification, security, and operational assurance remain undisclosed.
          items:
            - name: Customer integration
              detail: Public sources do not specify APIs, interface standards, or implementation support.
            - name: Quality and security controls
              detail: >-
                Public sources do not establish certifications, redundancy, incident processes, or cybersecurity
                controls.
        - label: Commercial operations
          detail: Repeatability and contract performance are the key commercialization proof points.
          items:
            - name: Paid deployment
              detail: No assigned source discloses recurring service revenue or paid deployment denominators.
            - name: Service performance
              detail: No assigned source discloses customer SLA, uptime, failure-rate, or renewal metrics.
    approximationNotes: The stack is a qualitative operating map; layer order does not represent cost, maturity, or revenue contribution.
    claimRefs:
      - CE001
      - CE005
      - CE007
      - CE009
      - CE015
      - CE016
  - id: FU001
    title: Customer journey from mission need to expansion opportunity
    type: journey-map
    summary: >-
      Aerospace Yuxing’s public offering spans mission support, operations, data workflows, and adjacent safety or
      calibration services, but public evidence does not verify conversion between stages.
    data:
      nodes:
        - id: mission
          label: Mission or constellation need
          detail: Satellite operator, launch customer, or remote-sensing program requires ground-segment access.
          touchpoints:
            - TT&C
            - Launch support
            - Ground-station access
        - id: deploy
          label: Deploy and commission
          detail: Ground segment and mission interfaces are installed or made available across the network.
          touchpoints:
            - More than 60 ground stations
            - Protocol integration
            - Licensing support
        - id: operate
          label: Operate in orbit
          detail: Customer uses pass-based or managed services for telemetry, tracking, command, and on-orbit operations.
          touchpoints:
            - Cost per pass reported by Dealroom
            - On-orbit operations
            - Data reception
        - id: monetize
          label: Process and monetize data
          detail: Remote-sensing calibration, reception, processing, or IoT data workflows can extend the relationship.
          touchpoints:
            - Calibration
            - Data processing
            - Remote sensing
        - id: expand
          label: Expand or add safety services
          detail: >-
            Adjacent services could include collision warning, debris mitigation, frequency coordination, or additional
            sites.
          touchpoints:
            - Collision warning
            - Debris mitigation
            - Frequency coordination
        - id: verify
          label: Evidence checkpoint
          detail: >-
            Public sources do not disclose conversion, retention, contract length, or customer-level outcomes between
            stages.
          touchpoints:
            - Renewal data missing
            - Concentration data missing
            - SLA history missing
