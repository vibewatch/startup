      - - Base
        - >-
          The company keeps strategic ground and in-orbit operations relevance but remains capital intensive and
          privately opaque.
        - Track until a verified price and cash-flow path permit a risk-adjusted return calculation.
        - Medium; consistent with reported operations and missing financial disclosure.
        - Funding is needed to sustain growth without demonstrable unit economics.
      - - Bear
        - >-
          Deployment slows, financing reprices, customer concentration or regulation constrains growth, and servicing
          does not commercialize.
        - Capital loss or severe dilution is plausible; no probability-weighted loss estimate is supportable.
        - Medium; market and financing dependencies are visible, but private downside data is missing.
        - Down round, failed milestone, major customer loss, or inability to fund ground-network expansion.
    notes: >-
      Scenarios are qualitative because Aerospace Yuxing's valuation, revenue, margin, cash, cap table, and preference
      terms are not disclosed in the assigned evidence.
    claimRefs:
      - CV006
      - CV007
      - CV010
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
