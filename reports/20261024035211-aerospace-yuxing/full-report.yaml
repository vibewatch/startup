  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer logic
        blocks:
          - type: paragraph
            body: >-
              The relevant market is commercial and institutional space-infrastructure support between launch and
              routine satellite use: telemetry, tracking and control; ground-station access; payload-data reception;
              in-orbit safety and health management; calibration; and emerging in-orbit servicing. Bloomberg describes
              Aerospace Yuxing as making spacecraft electronic systems and developing mobile ground systems, telemetry
              and control software, satellite telemetry processing systems, spacecraft safety management, and
              remote-sensing satellite calibration services. The boundary therefore excludes satellite manufacturing,
              launch vehicles, and end-user broadband subscriptions, while including the ground and operations spend
              required to make those assets usable. Buyer roles are split: satellite operators and constellation
              companies are the operational buyers, spacecraft or payload teams are users, and government programs,
              prime contractors, or commercial operators may be the budget owners. AWS documents that customers
              configure contacts through an SDK or console and must onboard a satellite, illustrating a software/API-led
              procurement path; SSC's public offer combines engineering, operations, consultancy, and a global
              ground-station network, illustrating an outsourced-service alternative. The status quo remains
              operator-owned ground assets, one-off mission teams, or launch-provider support.
            claimRefs:
              - CM001
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and demand formation
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports several demand lenses rather than a defensible company-specific market total. The
              first lens is constellation-driven operations volume: Orbital Radar's 23 October 2026 tracking page
              reports 222 Guowang and 248 Qianfan satellites in orbit against planned totals of about 13,000 and 15,000,
              respectively, while noting that its figures are live tracked payload counts and operator targets are not
              the same measure. The second lens is ground-network capacity: AWS lists eleven public ground-station
              locations as of 16 June 2026 and offers dedicated antennas whose locations and capabilities are not
              publicly disclosed. The third lens is mission-support throughput: a June 2026 Sina Finance report says
              Aerospace Yuxing had provided paid service to 684 satellites and rockets by 15 June and claimed 92.8%
              coverage of China's commercial satellite TT&C paid-service market in 2025; those are company-related
              reported metrics, not an independently audited TAM. The fourth lens is international service breadth: SSC
              states that it makes 300+ satellite contacts per day, while Leaf Space describes a global
              ground-segment-as-a-service network and a Canada expansion. These lenses show why demand can grow, but
              they cannot be added into one market value because they mix satellites, contacts, stations, and service
              coverage.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
      - number: '2.3'
        title: Adoption drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption is pulled by constellation deployment, geographic coverage requirements, mission safety, and the
              need to operate satellites without building every ground asset internally. Orbital Radar describes Qianfan
              as commercially oriented and says trial-service agreements were signed in Brazil, Malaysia, Kazakhstan,
              and Turkey; it also reports a several-month 2025 deployment pause after some satellites experienced
              thruster or gyroscope failures before resuming in April 2026. That evidence supports demand for reliable
              operations while also showing that deployment schedules and technical incidents can interrupt the
              near-term service funnel. Higher-orbit systems create a further environmental and coordination constraint:
              Orbital Radar warns that failed satellites around 1,100 km can persist for decades to centuries,
              increasing debris and conjunction management questions. AWS shows that site approvals and satellite
              onboarding are part of the implementation path, while its dedicated-antenna capabilities are not publicly
              disclosed. Buyers therefore face regulatory and site-approval friction, integration and switching costs,
              reliability and trust requirements, and capital trade-offs between outsourced networks and owned
              infrastructure. Public evidence does not isolate Aerospace Yuxing's pricing, contract duration, margins,
              or customer concentration, so adoption potential should not be translated directly into valuation.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM011
              - CM014
              - CM016
      - number: '2.4'
        title: What remains unproven
        blocks:
          - type: paragraph
            body: >-
              The evidence base is stronger on activity indicators than on market economics. The available sources do
              not provide a common currency, geography, service taxonomy, or buyer-spend denominator that would support
              a company-specific TAM/SAM/SOM. The reported 684 paid satellite/rocket services and 92.8% 2025 coverage
              figure need definition, denominator, and independent corroboration; they may describe a narrow Chinese
              paid-service category rather than all global ground-segment spending. Likewise, planned constellation
              counts are not contracted service demand, and public competitor capacity descriptions are not comparable
              revenue pools. A diligence-grade sizing exercise should obtain Aerospace Yuxing's service-line revenue and
              gross margin, customer and contract cohorts, backlog, renewal/conversion rates, geographic licensing map,
              and price per satellite/contact or managed-service contract. Until those inputs are available, the market
              case is directionally positive but not numerically underwritten.
            claimRefs:
              - CM018
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Demand is real, but sizing is not yet investable
            body: >-
              Constellation deployment and outsourced ground-network capacity support a growing operations need, while
              mixed units, undisclosed pricing, and company-defined coverage metrics prevent a defensible market-value
              estimate.
            calloutType: insight
            claimRefs:
              - CM005
              - CM007
              - CM018
          - type: callout
            title: Deployment and orbital constraints can delay conversion
            body: >-
              Qianfan's reported hardware failures and pause, spectrum coordination, site approvals, and long-lived
              debris exposure create timing and reliability risks between constellation plans and paid operations
              demand.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and positioning
        blocks:
          - type: paragraph
            body: >-
              Aerospace Yuxing's closest alternatives span commercial ground-segment providers, public-cloud
              ground-station infrastructure, and integrated spacecraft-operations companies. The company's own public
              profile describes satellite TT&C, data reception, calibration, collision warning, and in-orbit management,
              while Baidu Baike reports a Chinese network with international stations and more than 60 multi-aperture
              ground-station sets. Leaf Space presents a contrasting Ground-Segment-as-a-Service model with expansion
              through partners and new geographies. AWS Ground Station competes through cloud-region integration and a
              published location/API model rather than a visibly equivalent full-lifecycle operations offering. SSC
              Space is a broader incumbent alternative: it combines global ground stations with spacecraft operations,
              engineering, launch, and science services. These are buyer alternatives, not independent benchmarks of
              Aerospace Yuxing's performance.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP010
              - CP011
      - number: '3.2'
        title: Buyer criteria, switching costs, and capability tradeoffs
        blocks:
          - type: paragraph
            body: >-
              A satellite operator selecting among these options is likely to weigh geographic contact availability,
              command-and-control authorization, latency and data-delivery workflow, integration with mission software,
              incident handling, and the ability to support a growing constellation. Aerospace Yuxing reports a domestic
              network, international stations, and a one-hour satellite-ground interaction target, but the cited public
              material does not provide an independently audited SLA, uptime series, realized price list, or customer
              concentration. AWS documents that antenna capacity can be inspected through APIs and that dedicated
              antennas can be custom-built, which can reduce infrastructure switching for cloud-native customers. SSC
              Space's 300-plus daily contacts and 24/7/365 operating promise illustrate the scale of an incumbent
              service proposition, while Leaf Space's partner-led expansion illustrates a multi-homing route for
              operators that want broader geographic reach. These differences suggest integration and authorization are
              meaningful switching costs, but the public record cannot quantify them.
            claimRefs:
              - CP007
              - CP008
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP007
              - CP008
              - CP012
              - CP014
      - number: '3.3'
        title: Moat durability and displacement risks
        blocks:
          - type: paragraph
            body: >-
              Aerospace Yuxing has several potential differentiators: early Chinese third-party TT&C licensing,
              accumulated mission experience, a domestic network, and an adjacent robotic-arm servicing program. A 2026
              People's Daily report describes the Yuxing-3 06 technology-verification satellite and three robotic-arm
              control modes, but this is technology validation rather than proof of recurring servicing revenue.
              Competitive pressure is also increasing as Chinese constellations scale and as global providers add
              stations, optical links, and partner networks. Orbital Radar reports 470 tracked Guowang and Qianfan
              satellites against plans for more than 28,000, while SatNews describes the strategic and delivery gap
              around China's spectrum filings; those figures are external market context, not evidence of Aerospace
              Yuxing demand. The investable moat therefore depends on renewals, uptime, utilization, pricing, approvals,
              and customer-specific integration that remain undisclosed.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
              - CP018
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP010
              - CP011
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP007
              - CP010
              - CP011
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The moat is not yet measurable from public competitor data
            body: >-
              Aerospace Yuxing's disclosed network and mission record are credible differentiation signals, but public
              evidence does not establish relative price, SLA performance, utilization, renewal, or customer
              concentration.
            calloutType: risk
            claimRefs:
              - CP004
              - CP006
              - CP012
              - CP018
          - type: callout
            title: Scale can expand the service opportunity and the threat set
            body: >-
              Planned Chinese constellations increase potential TT&C demand while also strengthening the bargaining
              power and internal-build options of large constellation operators.
            calloutType: insight
            claimRefs:
              - CP015
              - CP016
              - CP018
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and traction
        blocks:
          - type: paragraph
            body: >-
              Aerospace Yuxing appears to monetize several related services rather than a single software subscription.
              Public descriptions identify satellite and rocket TT&C, payload-data reception, remote-sensing
              calibration, collision warning, orbit control, constellation planning, and in-orbit operations. The 36Kr
              account says the company has provided paid service to more than 500 spacecraft or rockets, while the June
              2026 Sina account reports 684 paid spacecraft or rocket services as of June 15 and a 92.8% share of the
              commercial-satellite TT&C paid-service market in 2025. These are different dated, company-attributed or
              media-reported measures and should not be blended into one current customer or revenue figure. The same
              36Kr source describes ground-station and gateway equipment as both self-developed and supplied in batches,
              implying a product-plus-service mix. No retained source provides recognized revenue, ARR, contract
              duration, renewal, backlog, realized price, or gross margin by stream. The revenue-quality underwriting
              case therefore depends on separating recurring operational fees from equipment deliveries and project
              work.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
