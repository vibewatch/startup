  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered product and operating surface
        blocks:
          - type: paragraph
            body: >-
              Public descriptions place Aerospace Yuxing in the space-infrastructure and in-orbit-operations layer
              rather than in a single spacecraft product. A June 2026 report carried by Sina Finance describes the
              company as combining commercial space TT&C technology development, communications-product manufacturing,
              and spacecraft in-orbit operations, with services including launch and satellite TT&C, payload-data
              reception, remote-sensing calibration, collision warning, debris cleanup, and digital space applications.
              The report attributes 684 cumulative paid satellite/rocket services through June 15 and 92.8% coverage of
              the paid commercial-satellite TT&C market during 2025, but it does not disclose the counting methodology,
              denominator, contract value, or product-level revenue. Because Sina says the item was republished from a
              partner publication, these figures remain reported traction rather than independently audited operating
              data. The product therefore appears to be a portfolio of mission-support services and infrastructure, with
              exact SKU boundaries, utilization, and economics still requiring diligence.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE007
              - CE009
              - CE015
      - number: '5.2'
        title: Ground, space, and control architecture
        blocks:
          - type: paragraph
            body: >-
              The clearest demonstrated operating loop is a ground-to-space communications path. In July 2026 Aerospace
              Yuxing and Shanghai Jingji Communication completed an X-band 4.2 Gbps wireless data-transmission test
              using Aerospace Yuxing's Zhongwei 13-meter ground station; the report says the experiment achieved
              long-term continuous, error-free stable transmission and verified high-order-modulation and high-bit-rate
              reception capability. Separately, public reporting on the Yuxing-3 06/Xiyuan-0 mission describes a
              flexible continuum hollow robotic arm with rear-mounted cable transmission. The on-orbit demonstrations
              included programmed simulated refueling, remote operator control, visual-servo docking, and
              force-compliant manipulation. The reported design puts drive-control components inside the satellite body
              and pairs force sensing, camera feedback, onboard planning, and ground control. Interesting Engineering
              further reports that a global ground-station network supported up to 20 minutes of telemetry and control
              per pass with sub-second loop delay during the demonstration. These are demonstrations of component and
              control modes, not proof of routine commercial servicing, autonomous operation against an uncooperative
              target, or end-to-end customer deployment.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE016
          - type: table
            tableRef: TE002
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE010
              - CE016
          - type: figure
            figureRef: FE001
