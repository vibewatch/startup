      - number: '1.3'
        title: Milestones and evidence boundaries
        blocks:
          - type: paragraph
            body: >-
              The public record supports a progression from company formation to a larger integrated service platform.
              The June 2026 report says Aerospace Yuxing had cumulatively provided paid services to 684 satellites and
              launch vehicles by 15 June 2026, and that its 2025 coverage of the commercial-satellite paid TT&C service
              market was reported at 92.8%. It also describes full-process TT&C support for a June 15 Lijian-1 launch
              carrying eight satellites, and commercial TT&C support for one satellite on a June 9 Zhuque-2
              improved-type launch. The same source reports that the company's subsidiary Sanyuan Aerospace operated the
              Yuxing-3 06 satellite, whose flexible robotic-arm in-orbit tasks were completed in March 2026. These
              milestones indicate operating proof and adjacent in-orbit-service ambition, but the source is media
              coverage and does not disclose contract value, customer concentration, service margins, incident history,
              or repeat economics. Ecosystem sources show that global ground-segment competitors market broad networks
              and daily contacts, which makes network scale and reliability important diligence variables rather than
              established Aerospace Yuxing advantages.
