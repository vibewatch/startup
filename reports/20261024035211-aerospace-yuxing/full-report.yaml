      - number: '1.1'
        title: Identity and operating footprint
        blocks:
          - type: paragraph
            body: >-
              The strongest current company-specific evidence describes Aerospace Yuxing, also rendered in Chinese
              coverage as 航天驭星, as a business combining commercial-space TT&C technology development, aerospace
              communications-product manufacturing, and spacecraft in-orbit operations. The same report states that the
              company was established in October 2016 and had Zhao Lei as legal representative and controlling
              shareholder with a directly held 19.38% stake at the time of the June 2026 IPO-counselling filing with the
              Beijing regulator. Its reported offer spans launch TT&C, satellite TT&C, payload-data reception,
              remote-sensing calibration, collision warning, debris removal, digital-space applications, and education.
              This supports a multi-service infrastructure identity, but does not establish that every listed service is
              independently commercialized or material to revenue.
