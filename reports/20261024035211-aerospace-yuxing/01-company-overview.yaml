company:
  name: Aerospace Yuxing
chapter:
  number: 1
  title: Company Overview
  summary: Aerospace Yuxing is a commercial-space infrastructure and mission-operations provider whose public record shows a broad service portfolio, substantial reported service activity, and a June 2026 D-round financing announcement. The available refresh pool does not verify headquarters, audited accounts, a complete leadership roster, valuation, or operating economics, so the chapter treats those items as diligence gaps rather than facts.
sections:
  - id: identity-and-operating-footprint
    title: Identity and operating footprint
    body: >-
      The strongest current company-specific evidence describes Aerospace Yuxing, also rendered in
      Chinese coverage as 航天驭星, as a business combining commercial-space TT&C technology
      development, aerospace communications-product manufacturing, and spacecraft in-orbit
      operations. The same report states that the company was established in October 2016 and
      had Zhao Lei as legal representative and controlling shareholder with a directly held
      19.38% stake at the time of the June 2026 IPO-counselling filing with the Beijing regulator.
      Its reported offer spans launch TT&C, satellite TT&C, payload-data reception, remote-sensing
      calibration, collision warning, debris removal, digital-space applications, and education.
      This supports a multi-service infrastructure identity, but does not establish that every
      listed service is independently commercialized or material to revenue.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: financing-leadership-and-stakeholders
    title: Financing, leadership, and stakeholder visibility
    body: >-
      June 2026 coverage reported that Aerospace Yuxing completed D, D+ and D++ financing of
      nearly RMB 2 billion. The report named Sequoia China, Qianhai Ark, China Unicom
      Strategic Emerging Industries, Zijin Mining, PICC Investment, SAIC, Wuliangye, Puhua
      Capital, Xiaomiao Langcheng, Huaan Jiaye, Saina Capital and other institutional or
      industrial investors. These are reported financing participants, not a verified cap table,
      and the pool does not provide a valuation amount, liquidation preferences, debt schedule,
      revenue, burn, or cash balance. Public leadership evidence is similarly narrow: Zhao Lei's
      legal-representative, control, and direct-ownership disclosures are available, while a
      complete executive and board enumeration is not. The appropriate underwriting stance is
      therefore meaningful financing validation with material governance and financial
      disclosure work remaining.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO002, TO003]
  - id: milestones-and-evidence-boundaries
    title: Milestones and evidence boundaries
    body: >-
      The public record supports a progression from company formation to a larger integrated
      service platform. The June 2026 report says Aerospace Yuxing had cumulatively provided
      paid services to 684 satellites and launch vehicles by 15 June 2026, and that its 2025
      coverage of the commercial-satellite paid TT&C service market was reported at 92.8%.
      It also describes full-process TT&C support for a June 15 Lijian-1 launch carrying eight
      satellites, and commercial TT&C support for one satellite on a June 9 Zhuque-2
      improved-type launch. The same source reports that the company's subsidiary Sanyuan
      Aerospace operated the Yuxing-3 06 satellite, whose flexible robotic-arm in-orbit tasks
      were completed in March 2026. These milestones indicate operating proof and adjacent
      in-orbit-service ambition, but the source is media coverage and does not disclose
      contract value, customer concentration, service margins, incident history, or repeat
      economics. Ecosystem sources show that global ground-segment competitors market broad
      networks and daily contacts, which makes network scale and reliability important
      diligence variables rather than established Aerospace Yuxing advantages.
    claimRefs: [CO012, CO013, CO014, CO015, CO016, CO017]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Reported operating proof
    body: The June 2026 record combines 684 paid satellite/launch-vehicle services with named launch-support examples and a completed flexible-arm in-orbit operation, providing more concrete operating evidence than a company description alone.
    claimRefs: [CO012, CO013, CO014, CO015]
  - calloutType: risk
    title: Disclosure and control gap
    body: The available evidence does not establish valuation, audited financial performance, cap-table terms, board composition, customer concentration, or incident history; those omissions constrain confidence in a financing or peak-valuation judgment.
    claimRefs: [CO009, CO010, CO011, CO017]
