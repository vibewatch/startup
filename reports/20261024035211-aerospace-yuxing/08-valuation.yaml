    claimRefs: [CV001, CV004, CV006, CV008, CV009, CV015, CV016]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - [Commercial proof, "2025 activity was reported as 10 rocket missions and 47 satellite flight-control missions; the source separately used an unclear 616-paid-services denominator.", "Contract-level revenue, collections, renewal, and margin by service."]
      - [Capital access, "June 2026 reporting described nearly 2 billion yuan of D-series financing.", "Round documents, investor rights, use-of-proceeds tracking, and post-money valuation."]
      - [Market demand, "Guowang and Qianfan together are described as planning more than 28,000 satellites.", "Evidence that Aerospace Yuxing captures durable, profitable demand rather than only deployment volume."]
      - [Valuation opacity, "The assigned sources do not disclose Aerospace Yuxing's price, cap table, or preferences.", "Independent confirmation of ownership, dilution, liquidation preference, and cash runway."]
      - [Execution risk, "Qianfan deployment reportedly paused after some in-orbit thruster or gyroscope failures before resuming.", "Service-level, incident, and customer-retention evidence showing resilience through deployment issues."]
    notes: "Rows distinguish company-reported or media-reported evidence from the diligence evidence still required; they are not independent valuation conclusions."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV010, CV011, CV012, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Paid-service activity converts into recurring high-margin contracts; constellation demand persists; robotic servicing wins repeatable contracts.", "Potential re-rating, but no numeric range is supportable without revenue, margin, and round-price inputs.", "Low-to-medium; evidence is directional rather than financial.", "Round terms or accounts show weak conversion, high burn, or heavy preference overhang."]
      - [Base, "The company keeps strategic ground and in-orbit operations relevance but remains capital intensive and privately opaque.", "Track until a verified price and cash-flow path permit a risk-adjusted return calculation.", "Medium; consistent with reported operations and missing financial disclosure.", "Funding is needed to sustain growth without demonstrable unit economics."]
      - [Bear, "Deployment slows, financing reprices, customer concentration or regulation constrains growth, and servicing does not commercialize.", "Capital loss or severe dilution is plausible; no probability-weighted loss estimate is supportable.", "Medium; market and financing dependencies are visible, but private downside data is missing.", "Down round, failed milestone, major customer loss, or inability to fund ground-network expansion."]
    notes: "Scenarios are qualitative because Aerospace Yuxing's valuation, revenue, margin, cash, cap table, and preference terms are not disclosed in the assigned evidence."
    claimRefs: [CV006, CV007, CV010, CV012, CV013, CV014, CV015, CV016]
