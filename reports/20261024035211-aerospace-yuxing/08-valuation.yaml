company:
  name: Aerospace Yuxing
chapter:
  number: 8
  title: Valuation
  summary: Public evidence shows meaningful financing and operating traction, but it does not disclose the price, capitalization, preferences, or management accounts needed to underwrite a precise entry valuation. The defensible stance is track/research-more until those terms and economics are verified.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      The positive case rests on a reported operating footprint rather than an untested concept. A January 2026 article relaying company figures said Aerospace Yuxing completed 10 rocket launch-and-control missions and 47 satellite flight-control missions in 2025. It separately reported an awkwardly translated cumulative denominator of 616 paid services "per rocket," more than 400 paid-service satellites in orbit, and 92.8% coverage of the annual commercial satellite launch-and-control paid-service market. A June 2026 financial-news article described nearly 2 billion yuan across D, D+, and D++ financing and said the proceeds would fund measurement-and-control systems, constellation ground systems, and in-orbit safety and health management. These figures indicate capital access and activity, but they are not audited revenue, cash availability, or investor returns. Planet Labs offers only an adjacent public reference: October snapshots put its market capitalization near $4.87 billion and Yahoo Finance listed 14.48 times price-to-sales and 14.85 times enterprise value-to-revenue alongside a TTM net loss. KSAT's more than 280 antennas across 26 locations show the scale of an established ground-network competitor, not a directly transferable valuation.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV008, CV009, CV011, CV015]
    tableRefs: [TV001, TV002]
  - id: valuation-scenarios
    title: Scenarios and entry discipline
    body: >-
      A scenario framework is more reliable than a point estimate because the decisive company inputs are private. The bull case requires verified conversion of paid launch and satellite-control activity into recurring, collectible revenue, while China's constellation programs continue deploying and opening international service markets. Reuters reported a SpaceSail-Telebras memorandum tied to planned Brazilian service, a concrete demand signal but not evidence of Aerospace Yuxing revenue. The base case assumes continuing strategic relevance while capital intensity and private-company opacity constrain underwriting. The bear case combines a funding or multiple reset with slower constellation deployment, customer concentration, cross-border constraints, or failed commercialization of in-orbit servicing. Orbital Radar reported a prior Qianfan pause after spacecraft failures, while SatNews emphasized the gap between Chinese orbital filings and launch infrastructure; both are downside signals rather than quantified forecasts. Without a transaction valuation, normalized company revenue, margins, cash, and security terms, numeric valuation ranges and probability-weighted returns would be false precision. Entry should remain conditional on those records.
    claimRefs: [CV006, CV007, CV010, CV012, CV013, CV014, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: decision-and-diligence
    title: Decision, exit readiness, and diligence asks
    body: >-
      The present decision is track/research-more, not buy. This is price discipline rather than a negative judgment on strategic relevance: the evidence supports financing momentum, operating activity, constellation demand, and an emerging international market, but it does not support a defensible entry price or target return. A bull case would need audited revenue quality, margins, collections, customer retention, and repeatable in-orbit-servicing contracts. A bear case becomes more likely after a down round, material deployment delay, major customer loss, inability to fund network expansion, or preference terms that transfer most downside to common holders. Exit readiness also remains unverified: the assigned evidence does not establish ownership, governance, liquidity rights, IPO timing, or an executable buyer set. The immediate diligence path is the latest financing package, fully diluted capitalization, management accounts, customer and backlog cohorts, cash runway, incident history, and signed commercialization milestones. Until those are reconciled, adjacent public multiples should be treated as context, not a valuation formula.
    claimRefs: [CV004, CV006, CV007, CV010, CV012, CV013, CV014, CV015, CV016]
