company:
  name: Aerospace Yuxing
chapter:
  number: 6
  title: Customers
  summary: Public evidence supports a broad B2B customer base around satellite ground-segment and lifecycle services, but it does not disclose customer-level revenue, retention, contract duration, or concentration. Named deployments and end-user missions provide adoption signals, while the missing denominator and customer-contract evidence keep durability unproven.
sections:
  - id: customer-segments
    title: Buyer, user, and use-case segmentation
    body: >-
      Aerospace Yuxing sells infrastructure into a business-to-business satellite ecosystem rather than a consumer market. Dealroom describes the client focus as B2B and identifies telemetry, tracking, and command services, data transmission and processing, constellation-management software, calibration, and one-stop in-orbit management as the commercial offer. The APIs.io profile describes a network of more than 60 ground stations and a service catalog spanning launch and spacecraft TT&C, on-orbit operations, remote-sensing calibration, collision warning, debris mitigation, frequency coordination, licensing support, and engineering consulting. That combination implies several buyer groups: satellite operators purchasing recurring passes and operations, launch or spacecraft customers needing mission support, and remote-sensing operators needing data reception or calibration. It does not establish how much revenue comes from any segment, whether customers buy multiple modules, or whether international sites are operated directly or through partners.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption trajectory and named customer proof
    body: >-
      The strongest public adoption signal is operational footprint, not a disclosed customer cohort. APIs.io states that the company has served over 370 satellites and rockets, while Dealroom reports support for more than 400 satellites and rockets; the two figures are directionally consistent but differ in scope or timing, so they should not be combined into a growth rate. The public record also ties specific satellite missions to identifiable operators and use cases. The Beijing 3C page identifies 21AT as operator of four Earth-observation satellites launched together in May 2024. China Daily reports that Guodian Gaoke's Tianqi network reached 41 satellites after a January 2026 launch and describes uses in forestry, agriculture, tourism, power generation, and environmental protection. Global Times separately reports 41 satellites in the Tianqi constellation and use across forestry, agriculture, emergency response, water resources, energy, marine monitoring, and smart-city management. These sources support ecosystem-level deployment context, but they do not prove that Aerospace Yuxing was the contracted service provider for each mission.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU015]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-and-concentration
    title: Retention, expansion, and concentration diligence
    body: >-
      No assigned source discloses net revenue retention, gross retention, churn, renewal rates, contract length, backlog, customer concentration, or expansion revenue. Dealroom reports a cost-per-pass revenue model, which can align revenue with satellite activity, but the source does not provide pass volume, pricing, utilization, minimum commitments, or renewal behavior. The company’s broad ground-station footprint and integrated lifecycle offering could support cross-sell from launch support into operations, data processing, calibration, or safety services, yet that is an analytical possibility rather than observed expansion. The public customer evidence is also uneven: named operators and mission applications demonstrate an addressable workflow, while the sources do not identify signed contracts, production status for Aerospace Yuxing’s own services, customer outcomes, or service-level performance. The underwriting implication is that adoption is plausible and externally visible, but durability and concentration remain material diligence gaps.
    claimRefs: [CU010, CU011, CU012, CU013]
