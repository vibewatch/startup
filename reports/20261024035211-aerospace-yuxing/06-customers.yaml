  - id: TU003
    title: Named customer proof table
    columns: [Customer or operator, Segment, Deployment or use case, Production vs pilot, Outcome or scale, Limitation]
    rows:
      - [21AT (Twenty First Century Aerospace Technology Company Ltd), "Earth observation", "Beijing 3C-01 through 04 remote-sensing satellites", "Operational launch record; Aerospace Yuxing service not established", "Four satellites launched together on 2024-05-20", "No public Aerospace Yuxing contract or outcome"]
      - [Guodian Gaoke, "IoT satellite constellation", "Tianqi network collecting data for industrial and environmental sectors", "Operational constellation", "41 satellites after January 2026 launch", "Sources do not identify Aerospace Yuxing as provider"]
      - [PIESAT-1 constellation, "Commercial remote sensing", "Remote-sensing data services", "Operational launch and stated commercial service", "Satellites entered preset orbit in March 2023", "Source identifies constellation, not Aerospace Yuxing relationship"]
      - [Algerian Space Agency, "Government or national space program", "AlSat-3A remote-sensing satellite and ground systems, training, and support", "Contracted delivery reported by China Daily; Aerospace Yuxing not named", "First satellite under a two-satellite agreement", "Not attributable to Aerospace Yuxing"]
    notes: "Enumeration is partial: public sources identify ecosystem customers and missions but do not provide a complete Aerospace Yuxing customer list or enough evidence to classify its own deployments as production versus pilot."
    enumerationScope:
      coverage: partial
      basis: Publicly named satellite operators and missions found in the assigned 2026 refresh source pool; private contracts and unattributed ecosystem missions are excluded.
    claimRefs: [CU006, CU007, CU008, CU009]
figures:
  - id: FU001
    title: Customer journey from mission need to expansion opportunity
    type: journey-map
    summary: Aerospace Yuxing’s public offering spans mission support, operations, data workflows, and adjacent safety or calibration services, but public evidence does not verify conversion between stages.
    data:
      nodes:
        - id: mission
          label: Mission or constellation need
          detail: Satellite operator, launch customer, or remote-sensing program requires ground-segment access.
          touchpoints: ["TT&C", "Launch support", "Ground-station access"]
        - id: deploy
          label: Deploy and commission
          detail: Ground segment and mission interfaces are installed or made available across the network.
          touchpoints: ["More than 60 ground stations", "Protocol integration", "Licensing support"]
        - id: operate
          label: Operate in orbit
          detail: Customer uses pass-based or managed services for telemetry, tracking, command, and on-orbit operations.
          touchpoints: ["Cost per pass reported by Dealroom", "On-orbit operations", "Data reception"]
        - id: monetize
          label: Process and monetize data
          detail: Remote-sensing calibration, reception, processing, or IoT data workflows can extend the relationship.
          touchpoints: ["Calibration", "Data processing", "Remote sensing"]
        - id: expand
          label: Expand or add safety services
          detail: Adjacent services could include collision warning, debris mitigation, frequency coordination, or additional sites.
          touchpoints: ["Collision warning", "Debris mitigation", "Frequency coordination"]
        - id: verify
          label: Evidence checkpoint
          detail: Public sources do not disclose conversion, retention, contract length, or customer-level outcomes between stages.
          touchpoints: ["Renewal data missing", "Concentration data missing", "SLA history missing"]
    claimRefs: [CU001, CU002, CU003, CU010, CU011, CU012]
callouts:
  - calloutType: strength
    title: Mission-linked demand is visible
    body: Named satellite operators, launch missions, and sector-specific applications provide stronger adoption evidence than an undifferentiated logo list, although the sources do not attribute every mission to Aerospace Yuxing.
    claimRefs: [CU006, CU007, CU008]
  - calloutType: risk
    title: Retention and concentration are unverified
    body: The assigned evidence does not disclose customer-level revenue, renewal, churn, contract duration, backlog, or top-customer concentration, so recurring quality and downside exposure cannot be scored from public data.
    claimRefs: [CU010, CU011, CU012, CU013]
