company:
  name: Aerospace Yuxing
chapter:
  number: 3
  title: Competitors
  summary: Aerospace Yuxing competes in a ground-segment and mission-operations market where network footprint, regulatory permissions, operational reliability, and integration depth matter more than a single software feature. Public evidence shows credible Chinese scale and a developing in-orbit-servicing option, but it does not disclose comparable prices, contract economics, or service-level performance against international providers.
sections:
  - id: landscape
    title: Competitive landscape and positioning
    body: >-
      Aerospace Yuxing's closest alternatives span commercial ground-segment
      providers, public-cloud ground-station infrastructure, and integrated
      spacecraft-operations companies. The company's own public profile describes
      satellite TT&C, data reception, calibration, collision warning, and
      in-orbit management, while Baidu Baike reports a Chinese network with
      international stations and more than 60 multi-aperture ground-station
      sets. Leaf Space presents a contrasting Ground-Segment-as-a-Service model
      with expansion through partners and new geographies. AWS Ground Station
      competes through cloud-region integration and a published location/API
      model rather than a visibly equivalent full-lifecycle operations offering.
      SSC Space is a broader incumbent alternative: it combines global ground
      stations with spacecraft operations, engineering, launch, and science
      services. These are buyer alternatives, not independent benchmarks of
      Aerospace Yuxing's performance.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006]
    tableRefs: [TP001]
  - id: buying-criteria
    title: Buyer criteria, switching costs, and capability tradeoffs
    body: >-
      A satellite operator selecting among these options is likely to weigh
      geographic contact availability, command-and-control authorization,
      latency and data-delivery workflow, integration with mission software,
      incident handling, and the ability to support a growing constellation.
      Aerospace Yuxing reports a domestic network, international stations, and a
      one-hour satellite-ground interaction target, but the cited public
      material does not provide an independently audited SLA, uptime series,
      realized price list, or customer concentration. AWS documents that antenna
      capacity can be inspected through APIs and that dedicated antennas can be
      custom-built, which can reduce infrastructure switching for cloud-native
      customers. SSC Space's 300-plus daily contacts and 24/7/365 operating
      promise illustrate the scale of an incumbent service proposition, while
      Leaf Space's partner-led expansion illustrates a multi-homing route for
      operators that want broader geographic reach. These differences suggest
      integration and authorization are meaningful switching costs, but the
      public record cannot quantify them.
    claimRefs: [CP007, CP008, CP010, CP011, CP012]
    tableRefs: [TP002]
  - id: durability
    title: Moat durability and displacement risks
    body: >-
      Aerospace Yuxing has several potential differentiators: early Chinese
      third-party TT&C licensing, accumulated mission experience, a domestic
      network, and an adjacent robotic-arm servicing program. A 2026 People's
      Daily report describes the Yuxing-3 06 technology-verification satellite
      and three robotic-arm control modes, but this is technology validation
      rather than proof of recurring servicing revenue. Competitive pressure is
      also increasing as Chinese constellations scale and as global providers
      add stations, optical links, and partner networks. Orbital Radar reports
      470 tracked Guowang and Qianfan satellites against plans for more than
      28,000, while SatNews describes the strategic and delivery gap around
      China's spectrum filings; those figures are external market context, not
      evidence of Aerospace Yuxing demand. The investable moat therefore
      depends on renewals, uptime, utilization, pricing, approvals, and
      customer-specific integration that remain undisclosed.
    claimRefs: [CP013, CP014, CP015, CP016, CP018]
    tableRefs: [TP003]
    figureRefs: [FP001]
