      - [SSC Space, Integrated incumbent space-services provider, "300+ satellite contacts per day; 24/7/365 on-orbit support; 35+ years of engineering experience", "Ground stations plus spacecraft operations, engineering, launch, and science services", "Broader portfolio makes direct ground-service comparability incomplete"]
