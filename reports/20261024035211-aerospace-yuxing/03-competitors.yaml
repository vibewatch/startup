    notes: "Public company and provider disclosures are not standardized: scale metrics use each issuer's own denominator and period, and unknown cells are not estimates."
    claimRefs: [CP003, CP004, CP005, CP006, CP010, CP011]
  - id: TP002
    title: Feature and capability matrix
    columns: [Buying criterion, Aerospace Yuxing, AWS Ground Station, Leaf Space / SSC Space]
    rows:
      - [Domestic Chinese TT&C network and licensing, "Reported Chinese network, commercial TT&C stations, and a radio-station license", Unknown, Unknown]
      - [Global station reach, "Reported stations in South Africa, Kenya, and Argentina plus coverage claims", "Published locations across multiple continents; dedicated antenna locations undisclosed", "Leaf Space: global network expansion; SSC: global ground-station network"]
      - [Mission-operations and engineering, "Reports full-lifecycle operations and in-orbit fault warning/handling", "Ground-station infrastructure and APIs documented; broader operations scope not established here", "SSC explicitly offers spacecraft operations, engineering, and consultancy"]
      - [In-orbit servicing / robotic-arm path, "Yuxing-3 06 technology verification reported; commercial economics unknown", Unknown, Unknown]
    notes: "Cells marked Unknown mean that the assigned source pool did not establish the capability; they are not negative findings."
    claimRefs: [CP002, CP007, CP008, CP012, CP014]
  - id: TP003
    title: Pricing, packaging, and switching-cost comparison
    columns: [Alternative, Price or contract model, Included capability evidenced in pool, Competitive implication]
    rows:
      - [Aerospace Yuxing, Unknown, "TT&C, data reception, calibration, collision warning, and in-orbit management are described", "Bundling may reduce vendor count, but realized price and renewal terms are undisclosed"]
      - [AWS Ground Station, "Public page does not state price in assigned text", "Managed antennas, cloud delivery, APIs, digital twins, and optional dedicated antennas", "Cloud integration can lower deployment friction for AWS-native operators"]
      - [Leaf Space, "Public news page does not state price in assigned text", "Managed ground services and partner/network expansion", "Multi-site access may support geographic diversification; partner dependence is a diligence point"]
      - [SSC Space, "Public page does not state price in assigned text", "Ground stations, 300+ daily contacts, operations, engineering, launch, and science services", "Breadth and operating history may raise trust, but may be over-specified for a narrow buyer need"]
    notes: "No assigned source provides a comparable realized price, discount, contract-duration, SLA-credit, or switching-cost measure; pricing conclusions are therefore qualitative."
    claimRefs: [CP006, CP007, CP008, CP010, CP011, CP012]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: Public evidence places alternatives along network / operations breadth and disclosure of scale, while Aerospace Yuxing's exact relative position remains uncertain.
    data:
      xAxis:
        label: Operations breadth
        min: 0
        max: 10
      yAxis:
        label: Public scale disclosure
        min: 0
        max: 10
      points:
        - {label: Aerospace Yuxing, x: 7, y: 5, note: "Ordinal placement based on described TT&C, data, calibration, collision-warning, and in-orbit services; comparable disclosure is incomplete"}
        - {label: AWS Ground Station, x: 5, y: 8, note: "Ordinal placement based on detailed public location/API documentation; full mission-operations breadth is not established here"}
        - {label: Leaf Space, x: 5, y: 5, note: "Ordinal placement based on managed ground services and 2026 network-partnership disclosures"}
        - {label: SSC Space, x: 9, y: 8, note: "Ordinal placement based on disclosed ground, operations, engineering, launch, and science portfolio plus 300+ contacts/day"}
        - {label: Internal build or status quo, x: 3, y: 2, note: "Ordinal placement reflects limited public scale disclosure and the narrower externally purchased service scope"}
        - {label: China SatNet / Guowang, x: 6, y: 6, note: "Ordinal placement reflects the state-owned constellation operator and reported planned scale, not a directly comparable purchased service"}
    approximationNotes: "Coordinates are ordinal analyst scores from the assigned public descriptions, not market-share or performance measurements; do not read the plot as an audited ranking."
    claimRefs: [CP002, CP003, CP007, CP010, CP011]
callouts:
  - calloutType: risk
    title: The moat is not yet measurable from public competitor data
    body: "Aerospace Yuxing's disclosed network and mission record are credible differentiation signals, but public evidence does not establish relative price, SLA performance, utilization, renewal, or customer concentration."
    claimRefs: [CP004, CP006, CP012, CP018]
  - calloutType: insight
    title: Scale can expand the service opportunity and the threat set
    body: "Planned Chinese constellations increase potential TT&C demand while also strengthening the bargaining power and internal-build options of large constellation operators."
    claimRefs: [CP015, CP016, CP018]
