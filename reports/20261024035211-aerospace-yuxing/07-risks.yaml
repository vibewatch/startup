    columns: [Dependency, Counterparty or ecosystem role, Failure scenario, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - [State-linked infrastructure and procurement, "SOEs, state funds, and public-sector programs", "Policy or procurement reprioritization reduces access, timing, or economics.", high, unknown, high, "Obtain customer and funding concentration by counterparty and contract."]
      - [Launch providers and launch sites, Long March ecosystem and emerging private launch firms, "Missed slots, launch failure, or capacity shortage delays deployments and revenue.", critical, partial, high, "Obtain launch-provider split, reserved capacity, insurance, and contingency plan."]
      - [Spectrum and regulatory coordination, ITU filings and national regulators, "Coordination dispute or missed deployment milestone constrains service or increases delay.", high, partial, high, "Obtain spectrum rights, milestone calendar, and legal responsibility matrix."]
      - [Capital providers and working capital, State-linked and private funding ecosystem, "Funding cycle or working-capital shortfall delays hardware, staffing, or service delivery.", high, unknown, high, "Review management accounts, burn, runway, debt, guarantees, and financing terms."]
    notes: "Counterparty names describe ecosystem dependencies documented in the sources, not confirmed Aerospace Yuxing contracts. Concentration and mitigation fields require company diligence."
    claimRefs: [CR009, CR010, CR011, CR012]
