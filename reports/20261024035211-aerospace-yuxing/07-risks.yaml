callouts:
  - calloutType: risk
    title: Regulatory access is a gating risk
    body: >-
      The public legal analysis describes a selective, state-linked opening rather than unrestricted private access; a service-by-service authorization map is required before residual exposure can be reduced.
    claimRefs: [CR001, CR002]
  - calloutType: risk
    title: Sector growth does not remove execution risk
    body: >-
      State-backed demand and constellation plans coexist with launch-capacity, reusable-rocket, orbital-reliability, and funding bottlenecks.
    claimRefs: [CR005, CR009, CR010]
  - calloutType: recommendation
    title: Diligence before underwriting
    body: >-
      Do not underwrite low residual risk until licensing, incident/SLA, customer and supplier concentration, insurance, management accounts, and financing terms are supplied.
    claimRefs: [CR002, CR004, CR008, CR012]
