chapter:
  number: 7
  title: Risks
  summary: Aerospace Yuxing operates in a Chinese commercial-space environment that is opening selectively but remains prescriptive, state-linked, and capacity constrained. The strongest public risk evidence concerns licensing and data obligations, launch and constellation bottlenecks, geopolitical dependency, and the lack of company-level disclosure needed to size residual exposure.
sections:
  - id: regulatory-and-data
    title: Regulatory, legal, and data exposure
    body: >-
      China’s commercial-space opening is not equivalent to unrestricted private-market access. A legal analysis of the 2025 policy package says the Action Plan supports commercial participation while satellite communications remain subject to licensing, and it describes basic telecommunications licensing as requiring at least 51% state interest. The same analysis says further secondary rules are expected for launch, tracking, telemetry and control, in-orbit operations, transfers, de-orbit and re-entry. For Aerospace Yuxing, this creates a licensing and permissions risk around each service line and any overseas or cross-border operating model. Data obligations are also material: China’s Personal Information Protection Law applies to processing inside China and certain processing outside China involving people in China, while the Data Security Law requires lifecycle controls, risk monitoring, incident response, and possible security review for data processing that may affect national security. The public record does not establish Aerospace Yuxing’s licenses, data classifications, cross-border arrangements, or incident history, so residual exposure remains unquantified.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: operational-and-technology
    title: Operational, safety, and technology bottlenecks
    body: >-
      The sector’s execution risk is shaped by launch cadence, reusable-rocket availability, orbital coordination, and the reliability of distributed space infrastructure. MERICS reports that Chinese constellations face limited launch capacity and structural and operational constraints, and describes the lack of a reusable rocket as a major bottleneck. Its account also says 2025 launches were insufficient to meet the ten-percent spectrum milestones it describes for Guowang and SpaceSail. Orbital Radar reports that Qianfan deployment paused after thruster or gyroscope failures before resuming after corrective measures, and notes that higher-orbit failures can persist for decades to centuries. These are sector observations rather than proof of an Aerospace Yuxing failure, but they define plausible reliability, schedule, safety, and cost transmission channels for a company providing launch TT&C, in-orbit operations, calibration, and related ground/software services. Public evidence does not disclose Aerospace Yuxing’s SLA, redundancy, incident, insurance, or service-level data.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: dependency-and-financial-model
    title: Partner, geopolitical, and financial-model risk
    body: >-
      China’s satellite-internet buildout is strategically dual-use and heavily state-linked. MERICS describes state-owned enterprises as the backbone of the sector, strong state influence even in ostensibly private funding, and private firms often working as subsystem providers rather than full constellation operators. It also reports substantial launch-cost disadvantages versus Falcon 9 and says private companies are being drawn in to address scale and cost bottlenecks. Other reporting describes China’s effort to reserve spectrum and build sovereign infrastructure, while official reporting highlights commercial firms’ role in mass production and state plans. This combination can create opportunity but also exposes suppliers and service providers to procurement concentration, policy reprioritization, export or cross-border restrictions, capital intensity, and counterparty dependence. No public source in the assigned pool discloses Aerospace Yuxing’s customer concentration, contract duration, backlog, margins, burn, working capital, insurance, or supplier concentration; those are material gaps rather than assumptions.
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
  - id: monitoring-and-thesis-breaks
    title: Monitoring indicators and thesis-break criteria
    body: >-
      The risk posture should be monitored through observable gates rather than broad confidence in sector growth. Near-term indicators include licensing or type-approval changes affecting TT&C and related services; published enforcement, outage, breach, safety, or launch-failure events; missed deployment or spectrum milestones; customer or partner concentration disclosures; and evidence that launch-cost or reusable-rocket bottlenecks are not improving. A thesis break would be a material loss or suspension of a required authorization, a repeated service or safety incident without documented remediation, a major counterparty or supplier failure without redundancy, or financial evidence that capital intensity and working-capital needs cannot be funded. Because the company-level public record is incomplete, investor diligence should require a service-by-service license map, incident and SLA log, customer and supplier concentration schedule, insurance coverage, management accounts, and cap-table and financing terms before treating residual risk as low.
    claimRefs: [CR002, CR005, CR008, CR012]
    figureRefs: [FR001]
