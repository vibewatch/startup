    notes: "AWS and KSAT are independent category comparators, not evidence of Aerospace Yuxing pricing, costs, or margins."
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
  - id: TI003
    title: Unit-economics underwriting checklist
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue per pass or mission, null, Low, "Tests monetization of reported service activity", "Invoices and contract schedules"]
      - [Antenna or station utilization, null, Low, "Separates network scale from productive capacity", "Monthly utilization by site and band"]
      - [Customer concentration, null, Low, "Determines renewal and counterparty risk", "Top-10 revenue, backlog, and renewal table"]
      - [CAC and sales payback, null, Low, "Tests scalability of B2B selling", "GTM spend, wins, cycle, and cohort data"]
      - [Service gross margin, null, Low, "Tests whether growth funds operations", "Segment P&L and labor allocation"]
      - [Capex per station and payback, null, Low, "Tests capital intensity and financing dependence", "Build cost, maintenance, useful life, and cash payback"]
      - [Burn and runway, null, Low, "Tests need for another financing round", "Monthly cash flow, debt, and covenant schedule"]
      - [In-orbit servicing unit economics, null, Low, "Separates demonstration from scalable business", "Commercial pipeline, insurance, mission cost, and pricing"]
    notes: "Every unavailable metric is an explicit diligence request; no public source supports a precise unit-economics estimate."
    claimRefs: [CI004, CI009, CI010, CI014]
figures:
  - id: FI001
    title: Evidence-backed revenue model bridge
    type: flow
    summary: The public operating model connects financed infrastructure and ground capacity to mission services, equipment delivery, and potential future in-orbit servicing, but does not disclose conversion into recognized revenue or gross profit.
    data:
      nodes:
        - id: capital
          label: Institutional financing
          detail: Recent financing is reported, but cash available is not disclosed.
        - id: infrastructure
          label: Ground stations and subsystems
          detail: Global infrastructure and batch equipment delivery are described.
        - id: capacity
          label: TT&C and data capacity
          detail: Capacity supports telemetry, control, downlink, and processing.
        - id: services
          label: Paid mission services
          detail: Reported paid spacecraft/rocket service counts are activity proxies.
        - id: equipment
          label: Equipment sales
          detail: Station and subsystem supply is described; backlog and margin are unknown.
        - id: future
          label: In-orbit servicing
          detail: Robotic-arm and refueling tests validate technology, not recurring revenue.
      edges:
        - [capital, infrastructure]
        - [infrastructure, capacity]
        - [capacity, services]
        - [capacity, equipment]
        - [services, future]
    approximationNotes: "This is a qualitative mechanism map; no revenue, margin, conversion rate, or cumulative bridge is inferred."
    claimRefs: [CI003, CI005, CI009, CI014]
callouts:
  - calloutType: strength
    title: Financed expansion with multiple monetization surfaces
    body: Reported service activity, infrastructure supply, and repeated financing indicate commercial reach beyond a single unproven product.
    claimRefs: [CI001, CI003, CI011, CI012]
  - calloutType: risk
    title: Public metrics do not support underwriting
    body: Cash, burn, revenue recognition, margin, customer concentration, and realized pricing remain unavailable or inconsistent across public reports.
    claimRefs: [CI004, CI013, CI014]
