company:
  name: Aerospace Yuxing
chapter:
  number: 4
  title: Financials
  summary: Public evidence indicates a diversified space-ground-services and infrastructure model with substantial recent financing, but it does not disclose the management-account detail needed to underwrite revenue quality, margins, burn, or runway. The main financial conclusion is therefore capital-supported growth with material private-data and realization risk.
sections:
  - id: revenue-model
    title: Revenue model and traction
    body: >-
      Aerospace Yuxing appears to monetize several related services rather than a single
      software subscription. Public descriptions identify satellite and rocket TT&C,
      payload-data reception, remote-sensing calibration, collision warning, orbit control,
      constellation planning, and in-orbit operations. The 36Kr account says the company
      has provided paid service to more than 500 spacecraft or rockets, while the June
      2026 Sina account reports 684 paid spacecraft or rocket services as of June 15 and
      a 92.8% share of the commercial-satellite TT&C paid-service market in 2025. These
      are different dated, company-attributed or media-reported measures and should not
      be blended into one current customer or revenue figure. The same 36Kr source
      describes ground-station and gateway equipment as both self-developed and supplied
      in batches, implying a product-plus-service mix. No retained source provides
      recognized revenue, ARR, contract duration, renewal, backlog, realized price, or
      gross margin by stream. The revenue-quality underwriting case therefore depends on
      separating recurring operational fees from equipment deliveries and project work.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-unit-economics
    title: Pricing, cost structure, and unit economics
    body: >-
      The available evidence supports a usage-sensitive operating model but not a
      company-specific price book. AWS Ground Station, an independent infrastructure
      comparator, states that customers can schedule antenna time per minute and pay for
      time used, while AWS manages the station infrastructure; this is a benchmark for
      how ground capacity can be packaged, not evidence that Aerospace Yuxing uses the
      same tariff or margin structure. AWS also describes licensing timelines ranging
      from 45 days in Ireland to 9+ months in Australia, showing why geographic
      deployment can create working-capital and time-to-revenue friction. KSAT's public
      surface describes global ground-network and Earth-observation services and ongoing
      investment in optical communications and phased-array technologies, illustrating
      that network coverage and technology investment are recurring cost and
      differentiation variables in the category. Aerospace Yuxing's reported more than
      90% self-developed rate for key products may support cost control, but it is a
      company-attributed figure and does not establish gross margin. CAC, payback,
      utilization, antenna occupancy, service labor, maintenance, spectrum, overseas
      licensing, and capex remain unavailable.
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI002, TI003]
  - id: capital-adequacy
    title: Capital adequacy and underwriting blockers
    body: >-
      Financing evidence is substantial but internally inconsistent across retained
      sources, so it should be treated as a chronology signal rather than cash available.
      Multiples reports $453 million across six rounds and a $207 million Series D in
      June 2026, while 36Kr reports a 430 million yuan C+ round in 2025 and more than
      1 billion yuan cumulative financing; a June 2026 Sina report describes D, D+, and
      D++ financing of nearly 2 billion yuan and calls the company a hundred-billion-yuan
      unicorn. Sina Finance separately reports a June 5 listing-counseling filing and
      4,436.77万元 registered capital, with Zhao Lei directly holding 19.38%. These
      figures have different currencies, scopes, dates, and publication standards, and
      none supplies cash on hand, net burn, debt, runway, liquidation preferences, or
      use-of-funds accounting. The reported financing uses emphasize intelligent
      TT&C, large-constellation ground systems, safety/health management, and global
      station construction, all of which can require substantial upfront investment.
      Until management accounts and financing documents are reviewed, the company is
      better characterized as financed for expansion than proven financially self-
      sustaining.
    claimRefs: [CI011, CI012, CI013, CI014]
    callouts: [ ]
  - id: financial-verdict
    title: Financial verdict and diligence priorities
    body: >-
      The positive financial signal is a broadening monetization surface paired with
      repeated institutional financing and reported paid-service scale. The negative
      signal is disclosure asymmetry: public materials emphasize service counts,
      market position, technology investment, and financing headlines, while omitting
      the denominator and accounting basis needed to translate activity into revenue,
      contribution margin, or cash conversion. A credible underwriting model should
      request monthly revenue by TT&C, data reception, calibration, software, equipment,
      and in-orbit servicing; contract and backlog schedules; customer concentration;
      utilization and realized price per pass or mission; bill-of-materials and service
      labor; capex by station; overseas licensing costs; debt and guarantees; cash,
      burn, and runway; and the capitalization table. The June 2026 robotic-arm
      demonstration may create a future service line, but the retained evidence
      describes technology validation rather than commercial revenue. The current
      financial verdict is therefore growth-capable but not yet underwritable on public
      metrics alone.
    claimRefs: [CI003, CI005, CI009, CI010, CI014]
