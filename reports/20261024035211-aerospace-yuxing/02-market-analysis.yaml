    columns: [Segment, Buyer, User, Payer/budget owner, Workflow, Adoption trigger]
    rows:
      - [Commercial constellation operator, "Constellation company", "Flight and network operations", "Operations or network-capex budget", "Onboard satellites; schedule contacts; receive telemetry and payload data", "More spacecraft and wider geographic coverage"]
      - [Government or state-backed constellation, "Program authority or state operator", "Mission-control team", "Government program or SOE budget", "Coordinate TT&C, safety, spectrum and mission assurance", "Sovereignty, resilience and strategic coverage"]
      - [Earth-observation operator, "Payload or spacecraft owner", "Payload and data team", "Mission or data-services budget", "Receive data and calibrate remote-sensing payloads", "More imaging assets and need for consistent calibration"]
      - [Launch provider and rideshare mission, "Launch or mission integrator", "Launch and early-orbit team", "Launch-service or mission budget", "Provide launch and early-orbit TT&C coverage", "Higher launch cadence and multi-payload complexity"]
      - [Institutional science mission, "Agency, university or research organization", "Scientists and spacecraft engineers", "Grant or agency mission budget", "Operate mission through ground network and specialist engineering", "Limited internal staff or geographically distributed mission"]
      - [In-orbit servicing program, "Asset owner or government program", "Servicing and robotics team", "Special-project or infrastructure budget", "Safety, maintenance, life extension and debris operations", "Asset-protection need and technical validation"]
    notes: >-
      Buyer roles are inferred from the documented workflows and provider offerings; the
      sources do not disclose Aerospace Yuxing contract-level budget ownership by segment.
    claimRefs: [CM003, CM004, CM011, CM014, CM016]
