company:
  name: Aerospace Yuxing
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Aerospace Yuxing operates in a ground-segment and spacecraft-operations market whose
    addressable demand is expanding with Chinese and international LEO constellations, but
    public evidence does not support a single clean TAM, SAM, or SOM. The strongest conclusion
    is evidence of a growing mission-support need alongside material launch cadence, licensing,
    orbital-environment, and buyer-budget uncertainties.
sections:
  - id: market-boundary
    title: Market boundary and buyer logic
    body: >-
      The relevant market is commercial and institutional space-infrastructure support between
      launch and routine satellite use: telemetry, tracking and control; ground-station access;
      payload-data reception; in-orbit safety and health management; calibration; and emerging
      in-orbit servicing. Bloomberg describes Aerospace Yuxing as making spacecraft electronic
      systems and developing mobile ground systems, telemetry and control software, satellite
      telemetry processing systems, spacecraft safety management, and remote-sensing satellite
      calibration services. The boundary therefore excludes satellite manufacturing, launch
      vehicles, and end-user broadband subscriptions, while including the ground and operations
      spend required to make those assets usable. Buyer roles are split: satellite operators and
      constellation companies are the operational buyers, spacecraft or payload teams are users,
      and government programs, prime contractors, or commercial operators may be the budget
      owners. AWS documents that customers configure contacts through an SDK or console and
      must onboard a satellite, illustrating a software/API-led procurement path; SSC's public
      offer combines engineering, operations, consultancy, and a global ground-station network,
      illustrating an outsourced-service alternative. The status quo remains operator-owned
      ground assets, one-off mission teams, or launch-provider support.
    claimRefs: [CM001, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and demand formation
    body: >-
      Public evidence supports several demand lenses rather than a defensible company-specific
      market total. The first lens is constellation-driven operations volume: Orbital Radar's
      23 October 2026 tracking page reports 222 Guowang and 248 Qianfan satellites in orbit
      against planned totals of about 13,000 and 15,000, respectively, while noting that its
      figures are live tracked payload counts and operator targets are not the same measure.
      The second lens is ground-network capacity: AWS lists eleven public ground-station
      locations as of 16 June 2026 and offers dedicated antennas whose locations and
      capabilities are not publicly disclosed. The third lens is mission-support throughput:
      a June 2026 Sina Finance report says Aerospace Yuxing had provided paid service to 684
      satellites and rockets by 15 June and claimed 92.8% coverage of China's commercial
      satellite TT&C paid-service market in 2025; those are company-related reported metrics,
      not an independently audited TAM. The fourth lens is international service breadth:
      SSC states that it makes 300+ satellite contacts per day, while Leaf Space describes a
      global ground-segment-as-a-service network and a Canada expansion. These lenses show why
      demand can grow, but they cannot be added into one market value because they mix satellites,
      contacts, stations, and service coverage.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: adoption-constraints
    title: Adoption drivers and constraints
    body: >-
      Adoption is pulled by constellation deployment, geographic coverage requirements,
      mission safety, and the need to operate satellites without building every ground asset
      internally. Orbital Radar describes Qianfan as commercially oriented and says trial-service
      agreements were signed in Brazil, Malaysia, Kazakhstan, and Turkey; it also reports a
      several-month 2025 deployment pause after some satellites experienced thruster or
      gyroscope failures before resuming in April 2026. That evidence supports demand for
      reliable operations while also showing that deployment schedules and technical incidents
      can interrupt the near-term service funnel. Higher-orbit systems create a further
      environmental and coordination constraint: Orbital Radar warns that failed satellites
      around 1,100 km can persist for decades to centuries, increasing debris and conjunction
      management questions. AWS shows that site approvals and satellite onboarding are part of
      the implementation path, while its dedicated-antenna capabilities are not publicly
      disclosed. Buyers therefore face regulatory and site-approval friction, integration and
      switching costs, reliability and trust requirements, and capital trade-offs between
      outsourced networks and owned infrastructure. Public evidence does not isolate Aerospace
      Yuxing's pricing, contract duration, margins, or customer concentration, so adoption
      potential should not be translated directly into valuation.
    claimRefs: [CM011, CM012, CM013, CM014, CM015, CM016]
    tableRefs: [TM003]
  - id: sizing-gaps
    title: What remains unproven
    body: >-
      The evidence base is stronger on activity indicators than on market economics. The
      available sources do not provide a common currency, geography, service taxonomy, or
      buyer-spend denominator that would support a company-specific TAM/SAM/SOM. The reported
      684 paid satellite/rocket services and 92.8% 2025 coverage figure need definition,
      denominator, and independent corroboration; they may describe a narrow Chinese paid-service
      category rather than all global ground-segment spending. Likewise, planned constellation
      counts are not contracted service demand, and public competitor capacity descriptions are
      not comparable revenue pools. A diligence-grade sizing exercise should obtain Aerospace
      Yuxing's service-line revenue and gross margin, customer and contract cohorts, backlog,
      renewal/conversion rates, geographic licensing map, and price per satellite/contact or
      managed-service contract. Until those inputs are available, the market case is
      directionally positive but not numerically underwritten.
    claimRefs: [CM018]
    tableRefs: []
