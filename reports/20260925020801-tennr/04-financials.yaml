chapter:
  number: 4
  title: "Financials"
  summary: "Tennr has disclosed a hybrid platform-access and per-document revenue model, low-millions revenue in March 2024, and more than threefold revenue growth after its October 2024 Series B; an independent market-data page further reports eight-figure revenue by mid-2025. The $101 million Series C and $605 million valuation establish financing capacity, but pricing, gross margin, retention, burn, cash, debt, and runway remain unavailable for underwriting."
sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue Model and Pricing Evidence"
    body: "The clearest commercial disclosure dates to March 2024: Forbes reported that Tennr charged a basic platform-access fee plus an additional charge for each document processed. That creates a plausible hybrid model in which a recurring software base is supplemented by usage revenue as referral and document volume grows. Tennr's current site describes a broader patient-orchestration product spanning intake, payer criteria, authorizations, communications, and routing, but neither the official site nor the other assigned sources publishes price points, minimum commitments, contract duration, discount schedules, implementation charges, or whether Tennr Network is separately monetized. Those terms must therefore remain unmodeled rather than being inferred from the product surface."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI015"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "traction-and-go-to-market"
    title: "Public Traction and Go-to-Market Signals"
    body: "Public traction is directionally strong but is reported through company statements and third-party summaries rather than audited financials. Forbes reported more than 50 customers and revenue in the low millions in March 2024. MobiHealthNews later reported that Tennr had more than tripled revenue since its October 2024 Series B, while Multiples says management described the business as operating in the eight figures of revenue by June 2025 without disclosing the exact amount. In September 2026 Tennr announced a new chief revenue officer, sales-transformation leader, and customer-value executive, signaling investment in a more formal enterprise sales engine. HME News also quoted a customer on major workflow gains, but the evidence still does not disclose cohort retention, acquisition cost, or realized contract value."
    claimRefs:
    - "CI004"
    - "CI005"
    - "CI006"
    - "CI007"
    - "CI008"
    - "CI012"
  - id: "unit-economics-and-cost-structure"
    title: "Unit Economics and Cost Structure"
    body: "The evidence supports customer-value hypotheses, not a complete unit-economics model. Tennr says its platform handles millions of care pathways each month, and HME News separately carries a customer statement that Tennr eliminated hundreds of hours of manual work per day and accelerated patient-intake creation. These outcomes could support pricing power and expansion revenue, but the assigned evidence does not disclose gross margin, inference and hosting cost per document, implementation labor, support intensity, customer acquisition cost, payback, gross retention, or net revenue retention. The conversion from document volume to gross profit is therefore the central financial diligence gap."
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI012"
      - "CI013"
      - "CI015"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-verdict"
    title: "Capital Adequacy and Financial Verdict"
    body: "Tennr raised $101 million in June 2025 at a reported $605 million valuation, and its September 2026 release says cumulative capital raised is $162 million. This is a meaningful financing cushion, but it is not evidence of a specific runway because the evidence pool contains no cash balance, burn rate, debt schedule, or planned-spend bridge. Exact valuation multiples are also indeterminate: Multiples reports eight-figure revenue but withholds the precise denominator, while its public-company table shows materially different revenue and EBITDA profiles across healthcare and workflow software peers. The financial verdict is therefore positive on revenue momentum and customer-value signals, but unresolved on revenue quality, software-grade margin potential, sales efficiency, and the timing or necessity of another financing."
    claimRefs:
      - "CI007"
      - "CI009"
      - "CI010"
      - "CI013"
      - "CI014"
