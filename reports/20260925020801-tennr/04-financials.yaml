callouts:
  - calloutType: "strength"
    title: "Customer outcomes support a value-based sales narrative"
    body: "Tennr publishes multiple examples of faster processing, backlog reduction, and higher volume without matching headcount growth. These claims can support pricing power, but they require contract-level linkage to realized expansion revenue."
    claimRefs:
      - "CI004"
      - "CI012"
  - calloutType: "risk"
    title: "Capital raised is not runway"
    body: "The $162 million cumulative funding disclosure is material, but without cash, burn, debt, or a current operating plan it cannot support a specific runway estimate or eliminate next-round dependency."
    claimRefs:
      - "CI010"
      - "CI013"
