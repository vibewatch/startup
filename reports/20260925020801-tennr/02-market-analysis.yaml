callouts:
  - calloutType: "insight"
    title: "Fax Persistence Creates an Unconventional Moat"
    body: "While health tech investors often view fax dependence as an antiquated vulnerability, Tennr turns the 70-90% prevalence of fax-based communication into a high-barrier operational moat. By training proprietary vision-language models on millions of messy clinical documents, Tennr eliminates the need for provider workflow retraining or expensive EHR rip-outs."
    claimRefs:
      - "CM002"
      - "CM006"
      - "CM007"
  - calloutType: "risk"
    title: "EHR Incumbents and Interoperability Mandates Represent Long-Term Headwinds"
    body: "Although Tennr enjoys rapid early adoption, long-term market expansion faces dual headwinds: potential federal interoperability mandates that could eventually diminish fax volumes, and legacy EHR vendors (Epic, Cerner, athenahealth) embedding native document-classification features into standard provider licenses."
    claimRefs:
      - "CM011"
      - "CM012"
      - "CM013"
