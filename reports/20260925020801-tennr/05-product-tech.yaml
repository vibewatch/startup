sections:
  - id: "sec-core-workflow"
    title: "Core Workflow and Product Definition"
    body: "Tennr provides an agentic patient orchestration software platform designed to automate and accelerate complex care operations for outpatient medical specialties and health systems. In traditional clinical practice, specialist referrals create severe operational bottlenecks because medical practices receive thousands of unstructured paper faxes, scanned PDF records, and electronic inbox notifications that require manual triage, chart extraction, and insurance qualification. Tennr automates this inbound administrative workflow from initial document ingestion through appointment scheduling. By reading unstructured clinical documents, normalizing clinical information, and coordinating operational tasks across clinic staff, Tennr aims to ensure patients reach appropriate clinical care settings rapidly without administrative delays."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
    tableRefs:
      - "TE001"

  - id: "sec-workflow-usecases"
    title: "Care Coordination Workflows and Operational Impact"
    body: "The platform addresses high-friction operational stages across the patient access lifecycle: referral intake, demographic qualification, insurance eligibility verification, prior-authorization preparation, and referrer communication. Legacy clinic workflows rely heavily on administrative staff performing repetitive manual data entry across disparate electronic health record (EHR) systems and payer web portals. Tennr streamlines these touchpoints by automatically evaluating extracted chart data against codified payer medical necessity criteria and generating required authorization packets. Furthermore, the platform incorporates automated multi-language phone calling to engage patients and referring providers, collecting missing clinical documents and confirming appointment logistics. Prescribers receive continuous visibility into referral processing status, resolving the traditional care coordination information gap."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE006"
      - "CE007"
      - "CE008"
    tableRefs:
      - "TE002"

  - id: "sec-technical-architecture"
    title: "RaeLM Foundation and Stack Architecture"
    body: "At the core of Tennr's technological differentiation is RaeLM, a proprietary vision-language foundation model engineered specifically for healthcare documentation. Unlike generalized commercial frontier models, RaeLM is trained on tens of millions of anonymized medical records, allowing it to parse low-resolution digital faxes, complex multi-column clinical notes, and handwritten physician notes with high domain specificity. Tennr surrounds this vision-language model with high-throughput event-driven microservices implemented in Python and TypeScript to orchestrate asynchronous state machines and data transformation pipelines. This multi-layered software architecture enables real-time document processing at scale, handling incoming document volumes across diverse medical specialties while maintaining strict data governance controls."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE009"
      - "CE011"
    figureRefs:
      - "FE001"

  - id: "sec-integration-security"
    title: "EHR Integration Model, API Posture, and Compliance Controls"
    body: "Tennr operates without a public developer API, open specification, or developer portal, choosing instead to deliver integrations via proprietary EHR connectors, bilateral data pipelines, and assisted deployment services. This enterprise delivery model creates substantial switching costs and ensures tight workflow embedding, but it also introduces technical integration dependencies that require tailored configuration for each hospital or practice deployment. Security and regulatory compliance form a core operational requirement for healthcare data processing; Tennr implements HIPAA-compliant administrative safeguards and SOC 2 Type II controls to protect patient health information. Commercial access is structured through foundational platform fees paired with usage-based volume pricing per processed document."
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE014"
    tableRefs:
      - "TE003"

