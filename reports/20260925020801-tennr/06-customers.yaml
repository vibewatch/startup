  title: "Customers"
  summary: "Tennr demonstrates documented customer traction across ambulatory infusion, sleep medicine, and durable medical equipment (DME) providers, achieving 4x faster fax referral intake, up to 98% billing error reductions, and expanded daily patient capacity. However, verifiable evidence remains heavily concentrated in outpatient subspecialties with vendor-curated success stories, leaving large-scale health system retention, multi-year cohort durability, and annual churn metrics as primary diligence gaps."
sections:
  - id: "customer-segmentation-and-profile"
    title: "Customer Base Segmentation and Buyer Personas"
    body: "Tennr's commercial traction is predominantly centered on high-volume ambulatory healthcare subspecialties where inbound clinical document workflows remain bottlenecked by analog fax infrastructure and complex payer authorization hurdles. The primary buying personas within these organizations include practice administrators, clinical operations directors, and revenue cycle executives who face severe staffing constraints and escalating administrative overhead when processing unstructured referral documents. Key adopting segments include specialty ambulatory infusion centers that require rapid patient onboarding to preserve referring oncologist and rheumatologist relationships, sleep medicine and diagnostic clinics managing high referral backlogs, and durable medical equipment (DME) suppliers that must navigate strict medical necessity documentation rules. While Tennr markets its platform to enterprise health systems and hospital networks, verifiable production deployments in large inpatient institutions remain limited compared to independent specialty practices and outpatient provider networks."
    claimRefs:
      - "CU004"
      - "CU008"
      - "CU010"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-intake-metrics"
    title: "Adoption Trajectory and Intake Throughput Acceleration"
    body: "Operational adoption of Tennr is driven by measurable throughput velocity and error reduction across the patient referral-to-scheduling lifecycle. In manual baseline workflows, intake specialists frequently spend fifteen to twenty minutes parsing incoming multi-page faxes, cross-referencing insurance policies, and manually transcribing patient demographics into electronic health record (EHR) systems. Deployments of Tennr demonstrate a reduction in document processing cycle time to under five minutes per referral, effectively delivering a fourfold increase in operational intake velocity. In high-volume practice settings, automated document classification and policy-grade clinical extraction allow provider teams to absorb sharp referral volume surges, handling peak single-day intake volumes exceeding two hundred and sixty faxes without requiring overtime or temporary contract staffing. Furthermore, automated validation against payer criteria yields reported billing error reductions of up to ninety-eight percent, directly curtailing claim rejection rates."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU006"
    tableRefs:
      - "TU002"
  - id: "named-customer-deployments-and-case-studies"
    title: "Named Customer Case Studies and Production Outcomes"
    body: "Documented customer case studies provide tangible evidence of production adoption and measurable return on investment across several multi-site healthcare operations. At FloMed, a growing ambulatory infusion provider with locations in Florida and New Jersey, implementing Tennr reduced document intake processing time from twenty minutes to under five minutes, expanded daily intake capacity from seventy to over one hundred and thirty faxes, and allowed the organization to resize its central intake department from up to fifteen full-time staff down to three dedicated coordinators. Total Sleep Management similarly reported that accelerating patient intake response times contributed to a thirty percent quarter-to-date revenue increase by capturing time-sensitive referral orders before patient leakage occurred. Additional named deployments across King Drug and Complex Rehab and MGA Homecare confirm production utility in clearing chronic backlogs, although third-party validation remains largely confined to vendor-curated case studies and reference aggregation portals."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU007"
    tableRefs:
      - "TU003"
  - id: "customer-expansion-and-concentration-risk"
    title: "Retention Durability, Expansion Loops, and Customer Concentration"
    body: "Tennr's net expansion model relies on demonstrating rapid payback in an initial clinic location or department before expanding across regional clinic networks and multi-facility provider groups. By automating bidirectional communication with prescribing physicians and patients via automated telephone verification, Tennr creates visibility that locks in referrer loyalty and accelerates downstream scheduling. However, customer concentration and revenue durability present material diligence risks. Public customer proof is heavily weighted toward ambulatory specialties and DME providers, with little verifiable data regarding multi-year contract renewals, gross revenue retention (GRR), or net revenue retention (NRR). Furthermore, vendor marketplace profiles indicate that comprehensive reference histories and competitor comparative evaluations remain locked behind commercial tier upgrades, underscoring the necessity of obtaining audited retention schedules and independent client references during confirmatory diligence."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
    figureRefs:
      - "FU001"
