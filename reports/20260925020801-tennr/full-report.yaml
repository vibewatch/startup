        title: Financing Trajectory, Valuation, and Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              Tennr has completed four institutional financing rounds, accumulating $162 million in total equity funding
              through mid-2025. Following initial seed financing in 2023, the company closed an $18 million Series A
              round in March 2024 led by Andreessen Horowitz, with participation from Foundation Capital, The New Normal
              Fund, and prominent angel investors, bringing cumulative funding past $25 million. After a Series B round
              in late 2024, Tennr completed a landmark $101 million Series C financing round in June 2025 led by IVP,
              with participation from Andreessen Horowitz, Lightspeed Venture Partners, GV, ICONIQ, Foundation Capital,
              and Snowflake chairman Frank Slootman. The Series C syndicate provides deep institutional growth-stage
              governance and enterprise distribution networks. However, Tennr's exact post-money valuation and current
              annualized recurring revenue figures remain undisclosed private metrics, representing key diligence gaps
              that require confidential cap table disclosures to evaluate capital efficiency against competitors.
