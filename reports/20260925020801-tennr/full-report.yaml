chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Core Platform
        blocks:
          - type: paragraph
            body: >-
              Tennr Incorporated is a venture-backed enterprise healthcare technology company founded in 2021 and
              legally incorporated in Delaware on July 26, 2021. Headquartered in New York City, the company develops
              and operates an intelligent patient orchestration platform designed to eliminate severe administrative
              bottlenecks across referral-based healthcare. In the United States healthcare system, approximately
              one-third of specialty care referrals stall or vanish into administrative queues due to incompatible
              electronic health record systems, uncoordinated communication channels, and heavy reliance on messy manual
              faxes. Tennr addresses this systemic friction not by demanding provider behavior change or EMR
              replacements, but by ingesting unstructured documents across faxes, emails, and patient portals. At the
              core of the platform is RaeLM, a proprietary vision-language machine learning model specifically optimized
              to parse messy handwriting, check boxes, and complex clinical notes against intricate payer rules and
              medical necessity criteria. Tennr monetizes through a predictable enterprise commercial model combining a
              core platform access subscription fee with usage-based volume fees levied per processed medical document.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO008
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
