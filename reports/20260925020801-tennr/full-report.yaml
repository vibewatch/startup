              - CE008
      - number: '5.3'
        title: RaeLM Foundation and Stack Architecture
        blocks:
          - type: paragraph
            body: >-
              At the core of Tennr's technological differentiation is RaeLM, a proprietary vision-language foundation
              model engineered specifically for healthcare documentation. Unlike generalized commercial frontier models,
              RaeLM is trained on tens of millions of anonymized medical records, allowing it to parse low-resolution
              digital faxes, complex multi-column clinical notes, and handwritten physician notes with high domain
              specificity. Tennr surrounds this vision-language model with high-throughput event-driven microservices
              implemented in Python and TypeScript to orchestrate asynchronous state machines and data transformation
              pipelines. This multi-layered software architecture enables real-time document processing at scale,
              handling incoming document volumes across diverse medical specialties while maintaining strict data
              governance controls.
            claimRefs:
              - CE004
              - CE005
              - CE009
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE007
              - CE009
              - CE010
              - CE011
              - CE014
      - number: '5.4'
        title: EHR Integration Model, API Posture, and Compliance Controls
        blocks:
          - type: paragraph
            body: >-
              Tennr operates without a public developer API, open specification, or developer portal, choosing instead
              to deliver integrations via proprietary EHR connectors, bilateral data pipelines, and assisted deployment
              services. This enterprise delivery model creates substantial switching costs and ensures tight workflow
              embedding, but it also introduces technical integration dependencies that require tailored configuration
              for each hospital or practice deployment. Security and regulatory compliance form a core operational
              requirement for healthcare data processing; Tennr implements HIPAA-compliant administrative safeguards and
              SOC 2 Type II controls to protect patient health information. Commercial access is structured through
              foundational platform fees paired with usage-based volume pricing per processed document.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE009
              - CE010
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Closed API Surface and High Integration Friction
            body: >-
              Tennr does not publish a public API, developer specification, or self-serve sandbox, forcing all EHR
              connectivity through bespoke interfaces and professional services that elevate integration overhead.
            calloutType: risk
            claimRefs:
              - CE010
              - CE014
          - type: callout
            title: Domain-Specialized Model Moat with RaeLM
            body: >-
              Rather than relying on generic frontier LLMs, Tennr's proprietary RaeLM vision-language model trained on
              over 100 million medical documents provides specialized performance on low-resolution clinical faxes and
              handwritten doctor notes.
            calloutType: strength
            claimRefs:
              - CE004
              - CE005
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Personas
        blocks:
          - type: paragraph
            body: >-
              Tennr's commercial traction is predominantly centered on high-volume ambulatory healthcare subspecialties
              where inbound clinical document workflows remain bottlenecked by analog fax infrastructure and complex
              payer authorization hurdles. The primary buying personas within these organizations include practice
              administrators, clinical operations directors, and revenue cycle executives who face severe staffing
              constraints and escalating administrative overhead when processing unstructured referral documents. Key
              adopting segments include specialty ambulatory infusion centers that require rapid patient onboarding to
              preserve referring oncologist and rheumatologist relationships, sleep medicine and diagnostic clinics
              managing high referral backlogs, and durable medical equipment (DME) suppliers that must navigate strict
              medical necessity documentation rules. While Tennr markets its platform to enterprise health systems and
              hospital networks, verifiable production deployments in large inpatient institutions remain limited
              compared to independent specialty practices and outpatient provider networks.
            claimRefs:
              - CU004
              - CU008
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU006
              - CU008
              - CU010
      - number: '6.2'
        title: Adoption Trajectory and Intake Throughput Acceleration
        blocks:
          - type: paragraph
            body: >-
              Operational adoption of Tennr is driven by measurable throughput velocity and error reduction across the
              patient referral-to-scheduling lifecycle. In manual baseline workflows, intake specialists frequently
              spend fifteen to twenty minutes parsing incoming multi-page faxes, cross-referencing insurance policies,
              and manually transcribing patient demographics into electronic health record (EHR) systems. Deployments of
              Tennr demonstrate a reduction in document processing cycle time to under five minutes per referral,
              effectively delivering a fourfold increase in operational intake velocity. In high-volume practice
              settings, automated document classification and policy-grade clinical extraction allow provider teams to
              absorb sharp referral volume surges, handling peak single-day intake volumes exceeding two hundred and
              sixty faxes without requiring overtime or temporary contract staffing. Furthermore, automated validation
              against payer criteria yields reported billing error reductions of up to ninety-eight percent, directly
              curtailing claim rejection rates.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU006
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU006
              - CU010
      - number: '6.3'
        title: Named Customer Case Studies and Production Outcomes
        blocks:
          - type: paragraph
            body: >-
              Documented customer case studies provide tangible evidence of production adoption and measurable return on
              investment across several multi-site healthcare operations. At FloMed, a growing ambulatory infusion
              provider with locations in Florida and New Jersey, implementing Tennr reduced document intake processing
              time from twenty minutes to under five minutes, expanded daily intake capacity from seventy to over one
              hundred and thirty faxes, and allowed the organization to resize its central intake department from up to
              fifteen full-time staff down to three dedicated coordinators. Total Sleep Management similarly reported
              that accelerating patient intake response times contributed to a thirty percent quarter-to-date revenue
              increase by capturing time-sensitive referral orders before patient leakage occurred. Additional named
              deployments across King Drug and Complex Rehab and MGA Homecare confirm production utility in clearing
              chronic backlogs, although third-party validation remains largely confined to vendor-curated case studies
              and reference aggregation portals.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU007
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
