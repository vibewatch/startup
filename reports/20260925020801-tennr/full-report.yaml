            title: Documented 4x Throughput Acceleration in Specialty Intake
            body: >-
              Customer case studies highlight substantial operational leverage, including FloMed reducing document
              processing turnaround from 15-20 minutes to under 5 minutes while tripling daily intake capacity with
              fewer staff.
            calloutType: strength
