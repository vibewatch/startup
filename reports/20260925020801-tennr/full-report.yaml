              - CU004
              - CU005
              - CU006
              - CU014
      - number: '6.4'
        title: Retention Durability, Expansion Loops, and Customer Concentration
        blocks:
          - type: paragraph
            body: >-
              Tennr's net expansion model relies on demonstrating rapid payback in an initial clinic location or
              department before expanding across regional clinic networks and multi-facility provider groups. By
              automating bidirectional communication with prescribing physicians and patients via automated telephone
              verification, Tennr creates visibility that locks in referrer loyalty and accelerates downstream
              scheduling. However, customer concentration and revenue durability present material diligence risks.
              Public customer proof is heavily weighted toward ambulatory specialties and DME providers, with little
              verifiable data regarding multi-year contract renewals, gross revenue retention (GRR), or net revenue
              retention (NRR). Furthermore, vendor marketplace profiles indicate that comprehensive reference histories
              and competitor comparative evaluations remain locked behind commercial tier upgrades, underscoring the
              necessity of obtaining audited retention schedules and independent client references during confirmatory
              diligence.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU011
              - CU012
              - CU013
