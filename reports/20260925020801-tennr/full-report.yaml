  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Workflow and Product Definition
        blocks:
          - type: paragraph
            body: >-
              Tennr provides an agentic patient orchestration software platform designed to automate and accelerate
              complex care operations for outpatient medical specialties and health systems. In traditional clinical
              practice, specialist referrals create severe operational bottlenecks because medical practices receive
              thousands of unstructured paper faxes, scanned PDF records, and electronic inbox notifications that
              require manual triage, chart extraction, and insurance qualification. Tennr automates this inbound
              administrative workflow from initial document ingestion through appointment scheduling. By reading
              unstructured clinical documents, normalizing clinical information, and coordinating operational tasks
              across clinic staff, Tennr aims to ensure patients reach appropriate clinical care settings rapidly
              without administrative delays.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE006
              - CE007
      - number: '5.2'
        title: Care Coordination Workflows and Operational Impact
        blocks:
          - type: paragraph
            body: >-
              The platform addresses high-friction operational stages across the patient access lifecycle: referral
              intake, demographic qualification, insurance eligibility verification, prior-authorization preparation,
              and referrer communication. Legacy clinic workflows rely heavily on administrative staff performing
              repetitive manual data entry across disparate electronic health record (EHR) systems and payer web
              portals. Tennr streamlines these touchpoints by automatically evaluating extracted chart data against
              codified payer medical necessity criteria and generating required authorization packets. Furthermore, the
              platform incorporates automated multi-language phone calling to engage patients and referring providers,
              collecting missing clinical documents and confirming appointment logistics. Prescribers receive continuous
              visibility into referral processing status, resolving the traditional care coordination information gap.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
