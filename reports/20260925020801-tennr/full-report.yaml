  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              The market for patient referral automation sits at the critical intersection of healthcare provider
              intake, revenue cycle management, and clinical care coordination. In the United States healthcare system,
              over one-third of all patients are referred to medical specialists, diagnostic imaging centers, or therapy
              providers each year. However, approximately 50% of these specialty referrals fail to translate into
              completed appointments due to communication breakdowns, missing clinical documentation, and lost faxes.
              Rather than attempting to replace electronic health records or force referring clinicians to adopt new
              digital portals, Tennr defines its category boundary around pre-visit documentation ingestion and policy
              decisioning. Status-quo alternatives remain heavily reliant on legacy infrastructure: between 70% and 90%
              of healthcare organizations continue to exchange patient records via analog or digital fax machines.
              Incumbent health systems rely primarily on offshore call centers or manual intake teams who hand-type
              faxed medical records into practice management software, creating high labor expense and catastrophic
              patient drop-off.
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and SOM Breakdown'
        blocks:
          - type: paragraph
            body: >-
              Evaluating the market opportunity for healthcare front-office automation requires distinguishing macro
              administrative waste from software-capturable workflow spend. Total administrative and billing overhead in
              the United States healthcare economy exceeds $1.0T annually, yet software vendors address only a targeted
              fraction of this operational friction. The total addressable market (TAM) for outpatient front-office
              workflow automation and referral processing represents an estimated $10B to $15B annually, based on
              administrative staffing costs across more than 300,000 ambulatory provider sites. Tennr's serviceable
              addressable market (SAM) focuses on high-volume outpatient specialty practices—including durable medical
              equipment suppliers, sleep centers, gastroenterology clinics, and physical therapy networks—where inbound
              documentation complexity and prior authorization burdens are most acute, representing a $3B to $5B annual
              market. Within this boundary, the serviceable obtainable market (SOM) of tech-forward independent
              specialty groups and managed service organizations seeking immediate AI intake replacement is estimated at
              $600M to $1.0B. Tennr monetizes this footprint through modular platform subscription fees combined with
              volume-based usage pricing per processed document and referral step.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM014
      - number: '2.3'
        title: Buyer Segmentation, Workflow Ownership, and Economic Incentives
        blocks:
          - type: paragraph
            body: >-
              Procurement dynamics within healthcare provider organizations are shaped by distinct economic buyers and
              operational workflows. In independent specialty medical practices, the economic buyer is typically the
              practice managing partner, chief executive officer, or clinic operations director, who is directly
              incentivized to stem referral leakage to regional hospital competitors. In larger multi-site specialty
              networks and durable medical equipment distributors, budget ownership shifts toward the Chief Revenue
              Officer or Vice President of Revenue Cycle Management, whose primary objective is eliminating first-pass
              payer claim denials caused by incomplete prescription details. Across all customer segments, the primary
              daily users are front-office intake coordinators and scheduling clerks who previously spent hours manually
              transcribing 20-page fax packets. Customer return-on-investment is immediate and quantifiable: specialty
              groups deploying automated referral intake report lifting appointment conversion rates from 80% to 85% in
              their first month, converting previously abandoned inbound patient demand into high-margin procedural
              revenue while reducing administrative overhead.
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: Adoption Drivers, Structural Headwinds, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Market adoption of AI referral orchestration is accelerated by acute macroeconomic and labor pressures,
              but faces clear structural constraints. The primary catalyst is the persistent shortage of medical
              administrative personnel, which elevates staffing turnover and makes manual referral processing
              unsustainable for scaling specialty clinics. Concurrently, commercial and Medicare Advantage payers have
              increased the complexity of medical necessity criteria, necessitating automated policy-grade verification
              before patients are seen to prevent costly retrospective payment clawbacks. However, several material
              adoption constraints temper category velocity. Enterprise health systems maintain deep relationships with
              entrenched EHR incumbents such as Epic, Cerner, and athenahealth, which may eventually introduce native
              document triage capabilities. Furthermore, complex multi-specialty deployments require 3 to 5 months of
              workflow testing and EHR integration, limiting rapid viral expansion. Over the long horizon, federal
              interoperability initiatives aimed at phasing out fax communications could alter document exchange
              dynamics, requiring vendors to maintain flexible intake rails.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Fax Persistence Creates an Unconventional Moat
            body: >-
              While health tech investors often view fax dependence as an antiquated vulnerability, Tennr turns the
              70-90% prevalence of fax-based communication into a high-barrier operational moat. By training proprietary
              vision-language models on millions of messy clinical documents, Tennr eliminates the need for provider
              workflow retraining or expensive EHR rip-outs.
            calloutType: insight
            claimRefs:
              - CM002
              - CM006
              - CM007
          - type: callout
            title: EHR Incumbents and Interoperability Mandates Represent Long-Term Headwinds
            body: >-
              Although Tennr enjoys rapid early adoption, long-term market expansion faces dual headwinds: potential
              federal interoperability mandates that could eventually diminish fax volumes, and legacy EHR vendors
              (Epic, Cerner, athenahealth) embedding native document-classification features into standard provider
              licenses.
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Alternative Landscape and Status Quo Workflows
        blocks:
          - type: paragraph
            body: >-
              The competitive arena surrounding healthcare referral management and patient intake spans four primary
              alternative categories: status quo manual clerical labor, incumbent electronic health record (EHR)
              systems, point artificial intelligence fax parsers, and horizontal optical character recognition (OCR)
              providers. Across the United States healthcare system, clinical practices continue to transmit
              approximately 9 billion faxes annually, treating antiquated telecommunication as a reliable default for
              HIPAA-compliant data exchange. However, this heavy reliance on manual paper handling introduces systemic
              friction, as clerical coordinators struggle to extract unstructured clinical data, verify insurance
              coverage rules, and follow up on missing patient records. Industry estimates indicate that nearly
              one-third of specialist referrals fail to translate into attended clinical consults due to administrative
              delays and communication breakdowns. While incumbent EHR providers such as Epic and Oracle Health offer
              integrated scheduling queues, their workflows remain largely confined to single enterprise hospital
              networks and lack intelligent multi-channel ingestion capabilities. Consequently, independent specialty
              clinics, durable medical equipment suppliers, and ambulatory surgery centers frequently rely on internal
              administrative teams or brittle custom IT scripts, creating a substantial operational opening for
              purpose-built patient orchestration platforms.
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
      - number: '3.2'
        title: Competitor Profiles and Technical Architecture
        blocks:
          - type: paragraph
            body: >-
              Technical differentiation in patient referral automation hinges on the depth of clinical document
              understanding, legacy system integration, and proactive stakeholder coordination. Unlike horizontal
              document processing engines that execute basic optical character recognition or generic large language
              models that generate plausible text without deterministic policy enforcement, Tennr implements specialized
              RaeLM models. These proprietary vision-language architectures are systematically trained on multi-year
              longitudinal medical records and complex payer determination rules, allowing the platform to evaluate
              incoming unstructured documentation against specific insurance coverage criteria before care is scheduled.
              Furthermore, whereas venture-backed digital health point solutions typically require modern REST or FHIR
              APIs, Tennr integrates directly with on-premise network file storage and 1990s-era legacy EHR databases.
              This architectural capability allows provider organizations to automate fax-to-intake pipelines without
              overhauling underlying practice management software. Tennr supplements this document processing engine
              with automated inbound and outbound voice agents that proactively reach out to referring physicians and
              patients to collect missing signatures or clinical records, resolving administrative bottlenecks that
              pure-play software competitors leave to human clerical staff.
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP008
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP007
              - CP014
      - number: '3.3'
        title: Pricing Structures and Economic Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Economic models across the referral management landscape reflect fundamentally divergent cost structures
              and buyer alignment mechanisms. The entrenched status quo relies on dedicated clerical intake specialists
              whose fully burdened compensation ranges between $45,000 and $65,000 annually per coordinator. This manual
              approach represents an inflexible fixed operating expenditure that strains clinic margins during seasonal
              volume fluctuations and generates substantial hidden costs through data entry errors and subsequent claim
              denials. In contrast, enterprise EHR vendors bundle intake modules into multi-million-dollar health-system
              licensing agreements, embedding high switching costs that obscure the true cost of administrative
              inefficiency. Horizontal cloud OCR and intelligent document processing APIs offer inexpensive per-page
              utility pricing ranging from $0.01 to $0.05, but they require provider organizations to fund extensive
              internal engineering teams to build custom healthcare logic. Tennr addresses this economic gap through a
              hybrid commercial structure comprising a predictable platform access fee combined with variable
              volume-based pricing tied to processed documents. This monetization architecture directly aligns
              technology expenditure with clinic throughput expansion and revenue cycle acceleration.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Moat Durability, Switching Costs, and Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              Assessing long-term competitive durability requires evaluating customer switching costs, multi-homing
              incentives, and potential displacement risks from platform incumbents. Tennr establishes operational
              defensibility through deep workflow stickiness: once its platform maps a specialty provider's unique
              insurance criteria, integrates with legacy file systems, and automates patient intake pipelines, replacing
              the system imposes severe operational disruption. Furthermore, Tennr has introduced the Tennr Network
              coordination layer, connecting referring physicians, downstream specialty practices, and patients into a
              synchronized operational pipeline that provides real-time visibility into referral progression. This
              multi-party architecture introduces network-level defensibility that single-point intake tools cannot
              replicate. Nevertheless, material competitive risks persist. Major EHR incumbents could eventually enhance
              their native document processing capabilities with clinical-grade generative AI, exerting pricing pressure
              on standalone intake software. Additionally, well-funded healthtech startups could attempt to replicate
              specialized payer rule mappings. To protect its competitive moat, Tennr has capitalized on its $101
              million Series C financing round to aggressive scale enterprise distribution, recruiting seasoned
              go-to-market leaders such as Chief Revenue Officer John Capaldi to capture enterprise health-system
              relationships before incumbents close the capability gap.
            claimRefs:
              - CP007
              - CP009
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Deep Workflow and Legacy EHR Integration Moat
            body: >-
              Tennr establishes defensibility by integrating directly with antiquated on-premise storage and 1990s-era
              EHR architectures that modern cloud-only APIs fail to penetrate. By combining specialized RaeLM models
              with automated bi-directional phone calling, Tennr converts unstructured fax queues into actionable
              clinical workflows without demanding provider behavior change.
            calloutType: strength
            claimRefs:
              - CP003
              - CP004
              - CP008
          - type: callout
            title: Incumbent EHR Encroachment and Platform Commoditization
            body: >-
              The primary long-term threat stems from major EHR vendors like Epic embedding native generative AI
              document summarization directly into provider inboxes. While current EHR intake modules struggle with
              messy multi-page faxes and payer-specific medical necessity determinations, incumbent platform reach could
              erode standalone automation margins if health systems prioritize vendor consolidation.
            calloutType: risk
            claimRefs:
              - CP002
              - CP009
              - CP014
