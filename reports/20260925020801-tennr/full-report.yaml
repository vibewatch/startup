  - id: FU001
    title: Healthcare Provider Customer Journey and Expansion Loop
    type: journey-map
    summary: >-
      End-to-end customer journey from inbound referral ingestion through automated payer criteria matching, patient
      communication, and practice expansion.
    data:
      items:
        - label: 1. Referral Ingestion & Extraction
          stage: Intake
          description: Unstructured faxes, EHR orders, and portal records are digitized automatically using proprietary OCR models.
          detail: Eliminates 15-20 minute manual paperwork per document.
        - label: 2. Payer Policy Qualification
          stage: Verification
          description: Extracts clinical necessity data and evaluates real-time commercial and Medicare payer criteria.
          detail: Slashes billing errors by up to 98% and avoids first-pass denials.
        - label: 3. Prescriber & Patient Outreach
          stage: Coordination
          description: Coordinates missing records via automated calls and grants prescribers 24/7 referral tracking.
          detail: Eliminates telephone hold times and accelerates appointment scheduling.
        - label: 4. Care Pathway Scheduling
          stage: Scheduling
          description: Routes qualified patients directly into provider scheduling queues within minutes.
          detail: Achieves 4x faster patient conversion from initial referral.
        - label: 5. Capacity & Operational Leverage
          stage: Realization
          description: Intake teams manage up to 260 faxes daily without adding administrative headcount.
          detail: Frees staff to focus on direct patient care and complex exceptions.
        - label: 6. Multi-Site Expansion Loop
          stage: Expansion
          description: Demonstrated throughput gains encourage customers to roll out Tennr across additional clinic locations.
          detail: Expands practice revenue by capturing full referral volumes.
