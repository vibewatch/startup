              - CO007
              - CO012
              - CO015
      - number: '1.2'
        title: Founding Team, Governance, and Executive Talent
        blocks:
          - type: paragraph
            body: >-
              Tennr was founded by Stanford University engineering graduates Trey Holterman, Diego Baugh, and Tyler
              Johnson, who originally collaborated on advanced machine learning and language model research. Chief
              Executive Officer Trey Holterman was inspired to tackle referral failures after witnessing operational
              breakdowns in family practice medicine, while co-founder Diego Baugh experienced specialty referral delays
              firsthand as a patient facing emergency care. The founding triumvirate maintains primary functional
              ownership across executive management, intake platform engineering, and machine learning infrastructure.
              In September 2026, Tennr made major additions to its senior executive bench to scale commercialization,
              appointing enterprise software veteran John Capaldi as Chief Revenue Officer alongside VP of Sales
              Transformation Dean Sutherland and SVP of Customer Experience Matt Stephens. These executive hires follow
              the 2026 recruitment of former Cleveland Clinic and Google executive Dr. William H. Morris as Chief
              Medical Officer, establishing seasoned enterprise leadership to support an expanding workforce of 319
              employees.
