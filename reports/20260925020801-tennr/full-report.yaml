        - Gross margin falls below 65% due to excessive human-in-the-loop exception handling.
      - - Market Expansion
        - Expands from specialty clinic fax triage into enterprise-wide patient orchestration and scheduling.
        - Healthcare health systems resist third-party automation tools due to IT integration backlogs.
        - Annual net revenue retention dips below 105% across core clinic accounts.
      - - Pricing Power
        - Hybrid pricing structure captures recurring base subscription fees plus per-document volume upside.
        - Providers push for flat-fee enterprise licensing, limiting document processing transaction expansion.
        - Average revenue per account declines YoY across newly onboarded provider cohorts.
      - - Governance & Exit
        - Tier-1 venture sponsorship (IVP, a16z, Lightspeed) supports long-term runway toward public IPO.
        - Liquidation preference stack (1.7x on B-1) and illiquid ATS secondary market hinder common returns.
        - Down-round financing or structured recapitalization event occurs prior to public filing.
    notes: Compares structural bull drivers against primary downside catalysts and falsifiable thesis-break triggers.
