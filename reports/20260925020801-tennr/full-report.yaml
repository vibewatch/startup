      decisioning, communications, and EHR integration.
    data:
      layers:
        - label: Intake & Document Capture Layer
          detail: Ingests digital faxes, scanned PDF records, emails, and internal orders across healthcare provider channels.
        - label: RaeLM Vision-Language Processing Layer
