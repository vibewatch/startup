chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、使命与核心平台
        blocks:
          - type: paragraph
            body: >-
              Tennr Incorporated 是一家获风险投资支持的企业级医疗科技公司，创立于 2021 年，并于 2021 年 7 月 26
              日在特拉华州完成法定注册。公司总部位于纽约市，开发并运营一套智能患者流程编排平台，旨在消除转诊医疗链条上的严重行政瓶颈。在美国医疗体系中，由于电子病历系统互不兼容、沟通渠道脱节且极度依赖混乱的纸质传真，全美约三分之一的专科转诊在行政排队中停滞甚至遗失。Tennr
              化解这一系统性阻碍并未要求医疗机构改变工作习惯或更换 EMR，而是直接摄取传真、电子邮件及患者门户中的非结构化文档。该平台的核心是自研视觉语言模型
              RaeLM。该模型专门用于解析潦草手写体、勾选框和复杂临床病历，并对照繁杂的支付方规则及医疗必要性标准完成核验。商业模式上，Tennr
              采用可预测的企业级收费架构，将核心平台访问订阅费与按处理医疗文档量收取的用量费相结合。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO008
              - CO014
