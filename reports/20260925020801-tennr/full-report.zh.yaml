  - id: FE001
    title: Tennr 端到端统筹调度平台技术架构
    type: stack
    summary: 六层技术架构体系，涵盖文档接入、自研视觉语言模型推理、政策决策、通信交互及 EHR 集成。
    data:
      layers:
        - label: 接入与文档采集层
          detail: 跨医疗机构多渠道接入电子传真、扫描版 PDF 病历、电子邮件与内部医嘱。
        - label: RaeLM 视觉语言处理层
          detail: 基于医疗病历训练的自研视觉语言基础模型，用于从非结构化文档中提取结构化临床数据。
        - label: 医保政策与医疗必要性决策引擎
          detail: 对照已代码化的医保规则自动评估患者临床数据，核验预先授权要求。
        - label: 工作流编排与状态机
          detail: 基于 Python 和 TypeScript 构建的事件驱动型后端服务，管理复杂的异步患者就医全生命周期。
        - label: 全渠道患者与处方医生交互层
          detail: 自动化多语言智能语音呼叫引擎与处方医生实时透明门户，形成运营闭环。
        - label: EHR 集成与数据持久层
          detail: 双向 EHR 连接器，将患者准入资质、病历及授权状态实时同步至底层记录系统。
    claimRefs:
