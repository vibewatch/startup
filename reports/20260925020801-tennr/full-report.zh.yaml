  - id: FM001
    title: 市场规模测算视角：转诊自动化与前台录入
    type: pyramid
    summary: 层层剖析美国医疗行政支出浪费，测算 Tennr 可服务且可触达的转诊自动化市场机遇。
    data:
      items:
        - label: 宏观医疗行政管理开销
          value: $1.0T+
          detail: 全美所有付款方与医疗机构每年的行政、计费及医保浪费总支出
        - label: 美国医疗机构前台工作流 TAM
          value: $10B - $15B
          detail: 人工转诊协同、传真数据录入与就诊前文档采集的每年总支出
        - label: 专科转诊可服务市场（SAM）
          value: $3B - $5B
          detail: 承接大批量转入单据的门诊专科诊所、DME 分销商及医学影像中心
        - label: AI 自动化可获得服务市场（SOM）
          value: $600M - $1.0B
          detail: 正积极借助 AI 模型替代人工录入的创新型专科医疗集团与医疗系统目标市场
        - label: 紧迫急需切入的桥头堡专科领域
          value: $250M - $400M
          detail: 文书积压严重的细分领域：睡眠医学、DME、物理治疗与胃肠病学
        - label: Tennr 当前签约业务规模
          value: Eight-Figure ARR
          detail: 服务数百家医疗机构带来的年化收入，月文档处理量超 10M 份
    approximationNotes: 市场层级测算依据医疗行政成本基准、专科诊所数量以及公司公布的实际业务吞吐量。
