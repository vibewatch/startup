  - id: FU001
    title: 医疗机构客户旅程与业务拓展飞轮
    type: journey-map
    summary: 贯穿转入单据接收、医保规则自动匹配、患者沟通直至诊所业务拓展的全流程客户旅程。
    data:
      items:
        - label: 1. 转诊接入与信息提取
          stage: 接诊录入
          description: 借助自研 OCR 模型，自动将非结构化传真、EHR 医嘱与门户单据数字化。
          detail: 单份文档省去 15-20 分钟人工文书处理时间。
        - label: 2. 医保政策合规校验
          stage: 校验审核
          description: 提取医疗必要性数据，实时比对商业医保与联邦医疗保险（Medicare）规则条款。
          detail: 计费差错骤降高达 98%，避免初次提交遭拒。
        - label: 3. 处方医生与患者触达
          stage: 协同跟进
          description: 拨打自动电话补充缺失病历，并为开方医生开通 24/7 全天候转诊追踪功能。
          detail: 彻底免除电话排队等待，加快预约排班速度。
        - label: 4. 诊疗路径预约排班
          stage: 排班调度
          description: 数分钟内将符合资质的患者直接导入诊所预约排班队列。
          detail: 初次转诊至患者转化提速 4 倍。
        - label: 5. 产能释放与运营杠杆
          stage: 效益兑现
          description: 无需增加行政人员，录入团队每日可处理多达 260 份传真。
          detail: 解放员工精力，专注直接患者护理与复杂疑难特例。
        - label: 6. 多院区横向扩张循环
          stage: 业务扩张
          description: 实际验证的吞吐效率显著提升，推动客户在更多分院全面推广 Tennr。
          detail: 全面承接所有转诊量，推动诊所收入稳步增长。
