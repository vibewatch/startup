      - number: '1.3'
        title: 融资历程、估值与投资人财团
        blocks:
          - type: paragraph
            body: >-
              Tennr 已完成 4 轮机构融资，截至 2025 年中累计股权融资金额达 $162 million。继 2023 年完成初始种子轮融资后，公司于 2024 年 3 月敲定由 Andreessen
              Horowitz 领投的 $18 million A 轮融资，Foundation Capital、The New Normal Fund 及知名天使投资人跟投，推动累计融资突破 $25 million。在
              2024 年底完成 B 轮后，Tennr 于 2025 年 6 月完成里程碑式的 $101 million C 轮融资，由 IVP 领投，Andreessen Horowitz、Lightspeed
              Venture Partners、GV、ICONIQ、Foundation Capital 以及 Snowflake 董事长 Frank Slootman 参投。该 C
              轮财团为公司带来了深厚的机构成长期治理经验与企业分销网络。然而，Tennr 确切的投后估值与当前年经常性收入数据仍属未披露的私有指标，构成关键尽调缺口；若要评估其相比竞对的资本效率，必须获取机密股权结构表。
            claimRefs:
