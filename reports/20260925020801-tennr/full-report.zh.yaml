      - number: '1.4'
        title: 发展里程碑、运营规模与增长缺口
        blocks:
          - type: paragraph
            body: >-
              Tennr 的运营轨迹展现了从学术界机器学习研究迅速走向全美医疗实际落地的执行力。截至 2025 年，公司面向全美医疗客户的文档处理吞吐量已扩大至每月逾 10 million 份患者记录，并上线 Tennr
              Network 协同层，让转诊诊所、接诊专科医生与患者三方具备实时进度可见性。据 Tracxn 行业数据，截至 2026 年 8 月，公司人员规模已达到 319
              人，反映出工程研发、临床运营及大客户销售团队的快速招募。尽管势头强劲，Tennr 所处的市场竞争激烈，赛道内活跃着 408 家医疗自动化竞对，其中不乏资金雄厚的成熟企业如 LeanTaaS 和
              Anterior。能否持续保持运营差异化，取决于其能否从最初的文档录入延伸至端到端患者流程编排，并保持极高的首次保险授权准确率。
