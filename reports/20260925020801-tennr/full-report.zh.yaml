      - 分析逻辑
      - 决策含义
    rows:
      - - 投资建议
        - 深入研究 / 持续跟踪
        - 产品市场契合度极佳，但一级市场估值乘数过高，抵消了业务吸引力。
        - 待经审计的客群 ARR 披露前，暂缓参与一级股权投资。
      - - 置信度
        - 中
        - 核心产品效用得到充分验证，但非公开财务指标仍未披露。
        - 保持密切沟通，同时争取管理层提供确证性披露。
      - - 风险评级
        - 中高
        - 面临大客户销售周期阻力、客户集中度偏高及 B-1 轮清算优先权压制。
        - 设定至少 2.5x MOIC 的门槛收益率纳入投资判断，以补偿流动性缺失。
      - - 估值立场
        - 偏贵 / 承压
        - C 轮投后估值 $600.33M 的定价已透支完美执行预期（约 25x-30x EV/ARR）。
        - 要求下行价格保护，或争取至少 25% 的老股转让折扣。
    notes: 综合核心尽调维度、风险阈值与资本配置标准，提炼最终投资立场。
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV009
  - id: TV002
    title: 核心投资逻辑与反向论点对照
    columns:
      - 核心支柱
      - 多头逻辑论据
      - 空头反向论据
      - 可证伪的逻辑破局触发条件
    rows:
      - - 平台护城河
        - 自研模型处理混乱的多页传真及复杂医保政策条款时，表现明显优于通用 OCR。
        - EHR 厂商或主要头部云厂商将原生文档解析直接集成至标准接口中。
        - 因过度依赖人工介入异常处理，毛利率跌破 65%。
      - - 市场扩张
        - 从专科诊所传真分流延伸至全院级患者统筹与排班调度。
        - IT 集成积压严重，医疗卫生系统抵制引入第三方自动化工具。
        - 核心诊所客户的年度净收入留存率跌破 105%。
      - - 定价权
        - 混合定价结构兼收经常性基础订阅费与单份文档处理量带来的超额收益。
        - 医疗机构力推固定费用企业授权模式，限制了按文档处理量计费的业务扩张。
        - 新上线医疗机构客群的单账户平均收入同比下滑。
      - - 公司治理与退出
        - 一线顶级风投机构（IVP、a16z、Lightspeed）背书，支撑迈向公开 IPO 的长期资金储备。
        - 清算优先权与优先股堆叠（B-1 轮附带 1.7x 优先权）与 ATS 二级市场流动性匮乏，阻碍普通股回报。
        - 公开递表前发生降估值融资或结构性资本重组事件。
    notes: 对比结构性多头驱动因素与主要下行催化剂，列出可证伪的逻辑破局触发条件。
    claimRefs:
      - CV002
      - CV005
      - CV008
      - CV011
