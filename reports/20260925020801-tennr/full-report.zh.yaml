      - number: '3.3'
        title: 定价结构与经济权衡
        blocks:
          - type: paragraph
            body: >-
              转诊管理领域的各种商业模式折射出截然不同的成本构成与买方利益契合机制。根深蒂固的人工现状依赖专职录入文员，每位文员的全包年薪在 $45,000 至 $65,000
              之间。这种纯人工模式属于刚性固定的运营支出，在业务量季节性波动时会侵蚀诊所利润率，并因录入差错及随后的理赔主张遭拒带来巨大的隐性成本。相比之下，企业级 EHR
              厂商把录入模块打包进高达数百万美元的医疗系统授权合同中，筑起高昂切换成本的同时掩盖了行政低效的真实代价。通用云端 OCR 与智能文档处理 API 提供每页 $0.01 至 $0.05
              的低廉调用单价，但要求医疗机构自建庞大的内部研发团队来开发医疗专属逻辑。Tennr
              靠混合商业模式弥合了这一差距，将可预测的平台访问费与挂钩处理文档量的动态用量费相结合。这一变现架构把技术支出直接与诊所吞吐量扩张及收入周期提速挂钩。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: 护城河持久度、切换成本与被替代风险
        blocks:
          - type: paragraph
            body: >-
              评估长期的竞争持久力，需要衡量客户的切换成本、多供应商并用动机以及平台型巨头的潜在替代威胁。Tennr
              凭借深度工作流粘性筑牢运营壁垒：一旦平台摸清专科机构独特的医保标准、接通老旧文件系统并完成患者录入管线自动化，替换该系统将带来严重的业务中断。此外，Tennr 推出了 Tennr Network
              协同层，把转诊医生、下游专科门诊与患者串联进统一的协同管线，提供转诊进度的实时可见性。这种多方协作架构带来了单点录入工具无法复制的网络级防御能力。不过，实质性的竞争风险依然存在。主要 EHR
              老牌厂商最终可能利用临床级生成式 AI 强化自身原生的文档处理能力，给独立录入软件带来定价压力。此外，资金充裕的医疗科技初创公司也可能尝试复刻专科支付方规则库。为巩固竞争护城河，Tennr 借助其 $101
              million C 轮融资大举铺开企业分销网络，聘请首席营收官 John Capaldi 等经验丰富的商业化领导者，赶在巨头抹平技术代差前拿下大型医疗集团客户。
            claimRefs:
              - CP007
              - CP009
              - CP012
              - CP013
              - CP014
