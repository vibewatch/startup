        title: 客户群细分与买方画像
        blocks:
          - type: paragraph
            body: >-
              Tennr
              的商业化拓展主要集中在高业务量的门诊专科领域，这些领域的外部传入临床文档流普遍受阻于模拟传真设施和繁琐的支付方预审授权。此类机构的核心买方画像包括诊所行政主管、临床运营总监以及收入周期管理（RCM）高管，他们在处理非结构化转诊文档时普遍面临严重的人手短缺与不断攀升的行政成本。早期采纳的核心客群包括：亟需加快接诊速度以维系转诊肿瘤科与风湿科医生关系的专科门诊输液中心、面临大量转诊积压的睡眠医学与诊断诊所，以及必须应对严苛医疗必要性文档规范的耐用医疗设备（DME）供应商。尽管
