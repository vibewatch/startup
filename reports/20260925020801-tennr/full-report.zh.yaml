      - number: '6.2'
        title: 采纳轨迹与录入吞吐量提速
        blocks:
          - type: paragraph
            body: >-
              在传统人工基准工作流中，录入专员通常需要耗费十五至二十分钟来解析收到的多页传真、对照医保政策，并手动将患者基本信息录入电子病历（EHR）系统。Tennr
              的落地成效显示，每笔转诊的文档处理周期可压缩至五分钟以内，录入速度足足提升四倍。在高业务量的诊所环境中，自动化的文档分类与符合合规要求的临床信息提取，使医疗团队能够承受转诊量的剧烈激增，从容应对单日超过两百六十份传真的录入峰值，无需加班或额外雇佣临时合同工。此外，对照支付方标准展开的自动化核验，据报道使账单差错率降低高达百分之九十八，直接压降了理赔主张驳回率。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU006
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU006
              - CU010
      - number: '6.3'
        title: 标杆客户案例研究与落地成效
        blocks:
          - type: paragraph
            body: >-
              多份真实客户案例为跨院区医疗机构提供了扎实落地证据与量化投资回报。在业务覆盖佛罗里达州与新泽西州、正处扩张期的门诊输液服务商 FloMed，上线 Tennr
              后将文档录入处理耗时从二十分钟压减到五分钟内，日录入能力从七十份传真扩大到一百三十多份，并推动中央录入部门从多达十五名全职员工精简至三名专职协调员。Total Sleep Management
              同样报告称，加快患者录入响应速度为季度迄今带来百分之三十的营收增长，赶在患者流失前锁定了时效紧迫的转诊订单。此外，King Drug and Complex Rehab 与 MGA Homecare
              的知名落地项目也证实了系统在清缴长期积压上的实际效用；不过第三方实证多局限于供应商编撰的案例材料与客户推荐汇总门户。
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU007
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
