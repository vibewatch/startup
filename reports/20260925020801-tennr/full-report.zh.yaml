  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              患者转诊自动化市场地处医疗机构前端录入、收入周期管理（RCM）与临床诊疗协同的关键交汇点。在美国医疗体系中，每年有超三分之一患者需要转诊至专科门诊、医学影像中心或康复机构。然而，受沟通断层、临床资料缺失与传真遗失影响，此类专科转诊约
              50% 最终未能完成预约挂号。Tennr 并未试图替代既有电子病历，亦不强求转诊医生采用全新数字门户，而是将自身产品边界锁定在就诊前文档录入与规则决策环节。行业现状对传统基础设施依然高度依赖：70% 至 90%
              的医疗机构仍在使用模拟或数字传真机交换患者病历。现有大型医疗系统主要依赖离岸呼叫中心或人工录入团队，靠手工将传真病历打入诊所管理软件，既推高人力成本，又造成大量患者流失。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
      - number: '2.2'
        title: 市场规模测算：TAM、SAM 与 SOM 拆解
        blocks:
          - type: paragraph
            body: >-
              评估医疗前台办公自动化市场机遇，必须把宏观行政浪费与软件可捕获的工作流支出区分开来。全美医疗经济中每年的行政和账单支出总额超过 $1.0T，但软件供应商能解决的运营阻滞仅占其中一小部分。基于全美 300,000
              多个门诊机构的行政人员成本测算，门诊前台工作流自动化与转诊处理的总可用市场（TAM）估计每年达 $10B 至 $15B。Tennr
              的可服务市场（SAM）聚焦于高业务量的门诊专科机构——包括耐用医疗设备（DME）供应商、睡眠中心、消化科诊所和物理治疗网络，这些领域的外部传入文档极其繁杂且事前授权负担最为沉重，构成一个 $3B 至 $5B
              的年市场规模。在该范围内，渴望立即引入 AI 替代人工录入的技术领先型独立专科门诊集团及管理服务组织（MSO），其可获取市场（SOM）估计在 $600M 至 $1.0B。Tennr
              靠模块化平台订阅费搭配按文档处理量及转诊步骤计费的用量模式变现。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM014
      - number: '2.3'
        title: 买方画像细分、工作流权属与经济激励
        blocks:
          - type: paragraph
            body: >-
              医疗服务机构内部的采购决策受不同经济买方与具体操作流程左右。在独立专科门诊中，经济买方通常是执行合伙人、首席执行官或门诊运营总监，其核心诉求是阻止转诊病源向区域竞争对手医院流失。在大型跨院区专科网络与耐用医疗设备（DME）分销商中，预算审批权则转至首席营收官或收入周期管理（RCM）副总裁手中，主要目标是杜绝因处方信息残缺导致的首次支付方理赔主张遭拒。在各类客户群体中，日常主要使用者都是前台录入协调员与排班文员，他们以往每天要耗费数小时手工抄录长达
              20-page 的传真材料。客户投资回报清晰立竿见影：部署自动化转诊录入系统的专科诊所称在首月即可将预约转化率从 80% 提升至 85%，既把过去流失的患者需求转化为高毛利的诊疗收入，又压降了后台行政支出。
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: 普及驱动力、结构性阻力与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              宏观经济和劳动力市场吃紧加速了 AI 转诊编排技术的普及，但也面临着清晰的结构性阻碍。最核心的催化剂是医疗行政人员持续短缺，导致离职率高企，让不断扩张的专科诊所难以维系传统的人工转诊处理。与此同时，商业保险与
              Medicare Advantage
              支付方不断加码医疗必要性标准的审查复杂度，促使医疗机构在患者就诊前借助自动化手段完成合规核验，以防后续遭受代价昂贵的医保追索扣款。然而，若干实质性限制制约了赛道爆发速度。大型医疗系统与
              Epic、Cerner、athenahealth 等老牌 EHR 巨头绑定极深，这些巨头未来可能推出原生的文档分诊功能。此外，复杂的多专科机构部署往往需要 3 至 5
              个月的工作流测试与系统集成，难以实现病毒式快速扩张。长远来看，联邦政府旨在淘汰传真通信的互操作性政策可能重塑文档交换生态，迫使软件厂商必须保持灵活的录入接入能力。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM015
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 传真依赖未消反而构筑另类护城河
            body: >-
              医疗科技投资人常将行业对传真的依赖视为落后漏洞，Tennr 却将传真通信 70-90%
              的极高普及率转变为高壁垒的运营护城河。团队凭借在数以百万计复杂临床病历上训练的自研视觉语言模型，免去了医疗机构重新培训员工或斥巨资更换 EHR 的麻烦。
            calloutType: insight
            claimRefs:
              - CM002
              - CM006
              - CM007
          - type: callout
            title: EHR 老牌厂商与互操作性政策构成长期逆风
            body: >-
              尽管 Tennr 早期普及迅速，但长期市场扩张仍面临双重逆风：一是联邦互操作性政策可能逐步压降传真使用量；二是传统 EHR
              厂商（Epic、Cerner、athenahealth）可能将原生文档分类功能直接打包进标准的医疗机构授权中。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 替代品格局与现状工作流
        blocks:
          - type: paragraph
            body: >-
              医疗转诊管理与患者录入领域的竞争格局横跨四大主流替代阵营：现状人工文员、老牌电子病历（EHR）系统、单点 AI 传真解析工具以及通用光学字符识别（OCR）服务商。全美医疗机构每年仍在使用传统电信渠道发送约 9
              billion 份传真，将其作为符合 HIPAA
              规范的数据交换稳妥默认手段。然而，高度依赖纸质人工处理带来了系统性摩擦：录入文员难以高效提取非结构化临床数据、核对保险承保规则并追踪缺失的患者档案。行业测算表明，由于行政延误和沟通脱节，近三分之一的专科转诊未能最终促成面诊。尽管
              Epic 和 Oracle Health 等传统 EHR
              厂商提供一体化的排班队列，但其流程大多局限于单一大型医院集团内部，缺乏智能多渠道接入能力。因此，独立专科门诊、耐用医疗设备供应商及日间手术中心往往只能仰赖内部行政人员或脆弱的自建 IT
              脚本，这为专用的患者流程编排平台留出了巨大的切入空间。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
      - number: '3.2'
        title: 竞对画像与技术架构
        blocks:
          - type: paragraph
            body: >-
              患者转诊自动化领域的底层技术差异，关键在于临床文档理解深度、老旧系统集成能力以及多方主动协同水平。通用文档处理引擎通常仅执行基础
              OCR，通用大语言模型生成看似合理的文本却缺乏确定性规则执行能力；与之不同，Tennr 采用了专用的 RaeLM
              模型。这套自研视觉语言架构历经数年跨度的纵向医疗档案与繁复支付方裁决规则的系统训练，让平台得以在预约就诊前对照具体的医保报销标准审核外部传入的非结构化材料。此外，风投支持的数字医疗单点方案往往依赖现代化的
              REST 或 FHIR API，Tennr 却能直接连通本地网络文件存储与 1990 年代的老旧 EHR
              数据库。这一架构能力让医疗机构无需推倒重来更换底层门诊管理软件，即可直接跑通从传真到录入的自动化管线。在此文档处理引擎之上，Tennr
              还配备了自动化呼入与呼出语音智能体，主动联络转诊医生与患者补齐遗漏签名或病历，化解了纯软件竞对只能留给人工文员处理的行政梗阻。
