        title: 图表
        blocks:
          - type: callout
            title: 契合医疗行业现实：务实的传真破局策略
            body: 以往传统医疗科技公司总试图彻底淘汰传真却屡屡受挫，Tennr 则采取务实策略，借助专用机器学习模型（RaeLM）实现传真录入自动化，既无需医疗机构推倒重来更换 EMR，又推动了产品在机构间的快速落地。
