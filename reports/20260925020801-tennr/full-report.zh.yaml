      - number: '6.5'
        title: 图表
        blocks:
          - type: callout
            title: 专科录入吞吐量录得 4x 提速实证
            body: 客户案例突显出显著的运营杠杆：例如 FloMed 将文档处理周转时间从 15-20 分钟缩短至 5 分钟以内，同时以更精简的人员编制将日录入能力提升至三倍。
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
          - type: callout
            title: 专科集中度偏高与缺乏经审计留存数据
            body: 公开客户佐证严重向门诊输液及 DME 诊所倾斜，且多为厂商自行编撰的案例；客群留存率、多年期净留存率以及大型医疗系统客户的流失率，仍属尚未证实的尽调风险。
            calloutType: risk
            claimRefs:
              - CU007
              - CU008
