              - CO012
              - CO015
      - number: '1.2'
        title: 创始团队、治理结构与高管阵容
        blocks:
          - type: paragraph
            body: >-
              Tennr 由斯坦福大学工程系毕业生 Trey Holterman、Diego Baugh 和 Tyler Johnson 联合创立，三人最初曾一同从事前沿机器学习与语言模型研究。首席执行官 Trey
              Holterman 在亲眼目睹家庭全科诊所的运营崩溃后萌生了解决转诊失效的想法，而联合创始人 Diego Baugh
              曾在急诊救治中以患者身份亲历过专科转诊延误。这三位联合创始人分别掌管高管团队管理、录入平台工程和机器学习基础设施三大核心职能。2026 年 9 月，为加速商业化扩张，Tennr
              大幅扩充高管阵营，任命企业软件资深老将 John Capaldi 出任首席营收官，并引入销售转型副总裁 Dean Sutherland 以及客户体验高级副总裁 Matt Stephens。此前在 2026
              年，公司已聘请克利夫兰诊所（Cleveland Clinic）与谷歌前高管 Dr. William H. Morris 担任首席医疗官，由此搭建起成熟的企业级管理团队，支撑起 319 名员工的组织规模。
            claimRefs:
              - CO001
              - CO010
              - CO011
              - CO012
