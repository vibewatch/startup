figures:
  - id: FO001
    title: 公司发展里程碑时间线
    type: timeline
    summary: 记录 Tennr 从斯坦福机器学习研究起步，历经 C 轮融资并向企业级商业化扩张的发展历程。
    data:
      items:
        - label: 2021 年 7 月：注册成立与创立
          details: 斯坦福毕业生 Trey Holterman、Diego Baugh 和 Tyler Johnson 在特拉华州注册成立 Tennr Incorporated。
          date: 2021-07
        - label: 2023 年：种子轮融资
          details: 获得首轮机构种子资金，验证面向专科医疗机构的自动传真提取技术。
          date: 2023-03
        - label: 2024 年 3 月：$18M A 轮融资
          details: 完成 Andreessen Horowitz 领投、Foundation Capital 和 The New Normal Fund 参投的 $18M A 轮融资，累计融资金额超过 $25M。
          date: 2024-03
        - label: 2024 年 9 月：B 轮业务扩张
          details: 完成 B 轮融资，加速产品研发并加快医疗机构入驻。
          date: 2024-09
        - label: 2025 年 6 月：$101M C 轮融资
          details: 完成 $101M C 轮融资，由 IVP 领投，Andreessen Horowitz、Lightspeed、GV、ICONIQ 以及 Frank Slootman 参投。
          date: 2025-06
        - label: 2025 年 6 月：发布 Tennr Network
          details: 推出实时诊疗协同层，打通转诊医疗机构、接诊专科医生与患者三方协作。
          date: 2025-06
        - label: 2026 年 8 月：人员规模扩展至 319 人
          details: 技术与运营团队扩充至 319 名员工，月度文档处理量超过 10M 份。
          date: 2026-08
        - label: 2026 年 9 月：高管团队拓展 GTM 业务
          details: 任命 John Capaldi 为首席营收官，并引入销售副总裁，加速拓展大型医疗系统客户。
          date: 2026-09
    approximationNotes: 里程碑节点整理自 2021 年 7 月至 2026 年 9 月期间的企业新闻通稿、Tracxn 企业档案与高管任职公告。
