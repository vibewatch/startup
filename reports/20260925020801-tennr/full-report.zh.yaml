              - CU005
              - CU006
              - CU014
      - number: '6.4'
        title: 留存持久度、扩张循环与客户集中度
        blocks:
          - type: paragraph
            body: >-
              Tennr
              的净扩张模式建立在先向首个诊所门店或科室证明极快回本周期、再向区域诊所网络及跨机构医疗集团横向推开的基础之上。公司借助自动化电话核实推进与开方医生及患者的双向自动化沟通，由此建立起透明度，锁定转诊方的忠诚度并加快下游预约排班。然而，客户集中度与收入持久度带来了实质性的尽调风险。公开客户佐证严重偏向门诊专科与
              DME
              供应商，几乎缺乏关于多年期合同续约、总留存率（GRR）或净留存率（NRR）的可验证数据。此外，供应商软件交易平台上的资料显示，详尽的客户背调履历与竞对横向测评均被锁在付费升级门槛之后，凸显出在后续确认性尽调中获取经审计留存明细表与独立客户访谈的必要性。
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU011
              - CU012
              - CU013
              - CU014
