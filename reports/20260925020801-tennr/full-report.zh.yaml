              Tennr 直接接入现代纯云端 API 难以渗透的本地陈旧存储与 1990 年代 EHR 架构，以此建立防御壁垒。公司把专用 RaeLM
              模型与自动化双向电话外呼相结合，在无需医疗机构改变工作习惯的前提下，将杂乱的传真排队转化为可立即执行的临床工作流。
