    body: "Should Tennr's RaeLM model misclassify clinical necessity documentation resulting in widespread first-pass denial spikes or unaddressed compliance audits from major commercial payers, healthcare provider trust could rapidly erode. While human-in-the-loop workflows provide guardrails, maintaining high extraction precision across messy faxed records is mission-critical."
    claimRefs:
