chapter:
  number: 1
  title: "Company Overview"
  summary: "Tennr Incorporated is a New York-based healthcare technology company founded in 2021 by Stanford University engineering graduates to automate medical referral management and patient intake workflows. Powered by its proprietary RaeLM vision-language architecture, the company has raised $162 million in venture capital across four financing rounds, including a $101 million Series C led by IVP in June 2025. Processing over 10 million documents monthly as of 2025 and scaling to 319 employees by August 2026, Tennr is aggressively expanding its enterprise go-to-market organization amidst crowded healthcare workflow competition."
sections:
  - id: "identity-and-mission"
    title: "Identity, Mission, and Core Platform"
    body: "Tennr Incorporated is a venture-backed enterprise healthcare technology company founded in 2021 and legally incorporated in Delaware on July 26, 2021. Headquartered in New York City, the company develops and operates an intelligent patient orchestration platform designed to eliminate severe administrative bottlenecks across referral-based healthcare. In the United States healthcare system, approximately one-third of specialty care referrals stall or vanish into administrative queues due to incompatible electronic health record systems, uncoordinated communication channels, and heavy reliance on messy manual faxes. Tennr addresses this systemic friction not by demanding provider behavior change or EMR replacements, but by ingesting unstructured documents across faxes, emails, and patient portals. At the core of the platform is RaeLM, a proprietary vision-language machine learning model specifically optimized to parse messy handwriting, check boxes, and complex clinical notes against intricate payer rules and medical necessity criteria. Tennr monetizes through a predictable enterprise commercial model combining a core platform access subscription fee with usage-based volume fees levied per processed medical document."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO008"
      - "CO014"
    tableRefs:
      - "TO001"
  - id: "governance-and-leadership"
    title: "Founding Team, Governance, and Executive Talent"
    body: "Tennr was founded by Stanford University engineering graduates Trey Holterman, Diego Baugh, and Tyler Johnson, who originally collaborated on advanced machine learning and language model research. Chief Executive Officer Trey Holterman was inspired to tackle referral failures after witnessing operational breakdowns in family practice medicine, while co-founder Diego Baugh experienced specialty referral delays firsthand as a patient facing emergency care. The founding triumvirate maintains primary functional ownership across executive management, intake platform engineering, and machine learning infrastructure. In September 2026, Tennr made major additions to its senior executive bench to scale commercialization, appointing enterprise software veteran John Capaldi as Chief Revenue Officer alongside VP of Sales Transformation Dean Sutherland and SVP of Customer Experience Matt Stephens. These executive hires follow the 2026 recruitment of former Cleveland Clinic and Google executive Dr. William H. Morris as Chief Medical Officer, establishing seasoned enterprise leadership to support an expanding workforce of 319 employees."
    claimRefs:
      - "CO001"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-investors"
    title: "Financing Trajectory, Valuation, and Investor Syndicate"
    body: "Tennr has completed four institutional financing rounds, accumulating $162 million in total equity funding through mid-2025. Following initial seed financing in 2023, the company closed an $18 million Series A round in March 2024 led by Andreessen Horowitz, with participation from Foundation Capital, The New Normal Fund, and prominent angel investors, bringing cumulative funding past $25 million. After a Series B round in late 2024, Tennr completed a landmark $101 million Series C financing round in June 2025 led by IVP, with participation from Andreessen Horowitz, Lightspeed Venture Partners, GV, ICONIQ, Foundation Capital, and Snowflake chairman Frank Slootman. The Series C syndicate provides deep institutional growth-stage governance and enterprise distribution networks. However, Tennr's exact post-money valuation and current annualized recurring revenue figures remain undisclosed private metrics, representing key diligence gaps that require confidential cap table disclosures to evaluate capital efficiency against competitors."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO013"
      - "CO015"
    tableRefs:
      - "TO003"
  - id: "operational-scale-and-milestones"
    title: "Corporate Milestones, Operational Scale, and Growth Gaps"
    body: "Tennr's operational trajectory demonstrates rapid execution from academic machine learning research into national healthcare deployment. The company expanded document throughput to over 10 million patient records per month across provider customers nationwide by 2025, while launching the Tennr Network coordination layer to give referring practices, receiving specialists, and patients real-time status visibility. Organizational headcount reached 319 personnel by August 2026 according to Tracxn industry data, reflecting rapid recruitment across engineering, clinical operations, and enterprise sales. Despite this momentum, Tennr operates in a crowded market landscape comprising 408 active healthcare automation competitors, including heavily funded incumbents such as LeanTaaS and Anterior. Sustaining operational differentiation will depend on expanding beyond initial document intake into end-to-end patient orchestration and maintaining high first-pass insurance authorization accuracy."
    claimRefs:
      - "CO001"
      - "CO005"
      - "CO006"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO012"
      - "CO013"
