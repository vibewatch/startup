    - QM013
  - type: missing-source
    severity: material
    topic: RRMM eligible-patient denominator
    missingEvidence: Public estimate of the addressable post-BCMA or multi-line RRMM population intended for OriCAR-017.
    whyItMatters: This denominator governs the true SAM and launch economics for the myeloma program.
    diligencePath: Request line-of-therapy segmentation and BCMA-exposed patient-flow assumptions.
