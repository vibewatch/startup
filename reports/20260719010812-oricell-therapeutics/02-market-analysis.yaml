- id: growth-drivers-and-adoption-constraints
  title: Growth drivers exist, but biology and economics still cap adoption confidence
  body: 'The market case has real drivers. Ori-C101 now has a registrational path in China, the late-line HCC setting still lacks strong alternatives, and CARsgen’s 2026 approval shows that China can commercialize a solid-tumor CAR-T. OriCAR-017, meanwhile, benefits from a dynamic post-BCMA sequencing story and from the fact that both China and the U.S. are already in view. But the constraints are at least as important as the drivers. Frontiers’ HCC review and the 2026 Springer review both emphasize that solid tumors remain hard for CAR-T because of poor tumor infiltration, immunosuppressive microenvironments, antigen heterogeneity, and T-cell exhaustion. MedCity’s financing coverage captures the practical consequence: solid tumors remain one of cell therapy’s hardest frontiers. On the economics side, public evidence still omits price, reimbursement, and patient-denominator assumptions. The right underwriting stance is therefore that OriCell is addressing large and clinically important markets,
    but that the public market model remains evidence-constrained until management opens the denominator and pricing stack.'
