slug: oricell-therapeutics
runDate: '2026-07-19'
company:
  name: OriCell Therapeutics
chapter:
  number: 2
  title: Market Analysis
  summary: 'OriCell participates in two distinct but related markets: late-line advanced hepatocellular carcinoma cell therapy and relapsed/refractory multiple-myeloma CAR-T. Public evidence strongly supports disease burden and unmet need in both, but it does not support a clean top-down TAM because pricing, hospital economics, and eligible-patient denominators remain undisclosed. The most credible near-term market is China late-line HCC, where Ori-C101 now has confirmatory phase II clearance and standard-care ORRs remain low. OriCAR-017 may ultimately offer the broader global option value because it already has both China and U.S. development paths, but today it is still a late-line clinical wedge. Category context is improving—CARsgen’s 2026 approval proves a solid-tumor CAR-T can launch in China—yet the same development also raises the competitive bar for OriCell.'
contentRequirements:
- Market boundary, included/excluded spend, adjacencies, and status-quo substitutes.
- TAM/SAM/SOM or evidence-constrained sizing using multiple lenses, not one broad estimate.
- Buyer/user/payer segmentation with budget ownership and adoption path.
- Growth drivers and adoption constraints (regulation, switching cost, ROI, trust, capital intensity).
- Sizing/adoption diligence gaps and contradictory estimates preserved.
