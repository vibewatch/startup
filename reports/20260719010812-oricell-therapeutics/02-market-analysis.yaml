- id: hcc-burden-and-ori-c101-wedge
  title: HCC burden, unmet need, and the Ori-C101 China-first wedge
  body: 'The HCC opportunity is compelling because the disease burden is large and current late-line outcomes remain poor. OriCell’s product page cites more than 900,000 global liver-cancer cases and more than 830,000 deaths in 2020, while the 2026 IARC update still places liver cancer among the world’s most common and deadliest malignancies. The same company page emphasizes that standard systemic therapy in intermediate and advanced HCC mainly slows progression and usually produces objective response rates no higher than 15%. That framing is consistent with the 2026 ASCO Ori-C101 update, which explicitly compares the company’s data against historical late-line response rates in the single digits to low teens. But disease burden should not be confused with market size. Ori-C101 is currently being developed not for all HCC, but for a much narrower slice: GPC3-positive advanced disease after at least two prior lines, in a China-first registrational pathway cleared by the NMPA. Until the company
    discloses the eligible-patient denominator and future pricing assumptions, the best public conclusion is that HCC provides a large unmet-need backdrop and a plausible first launch wedge—not a completed TAM model.'
