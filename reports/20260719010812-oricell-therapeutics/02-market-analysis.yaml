callouts:
- calloutType: insight
  title: OriCell participates in two markets, but only one has a near-term registrational path
  body: Ori-C101 in advanced HCC is the asset with the clearest China-first commercialization logic because it now has confirmatory phase II clearance. OriCAR-017 may ultimately access a larger global myeloma market, but today it is still primarily a late-line development program.
  claimRefs:
  - CM018
  - CM019
  - CM034
  - CM035
- calloutType: risk
  title: Disease burden is not the same thing as addressable revenue
  body: Public incidence and mortality statistics make HCC and myeloma look large, but OriCell has not disclosed the eligible-patient denominator, pricing, or hospital-capacity assumptions needed to convert burden into revenue TAM. The market story is therefore compelling but not yet underwritten.
  claimRefs:
  - CM003
  - CM011
  - CM031
  - CM032
