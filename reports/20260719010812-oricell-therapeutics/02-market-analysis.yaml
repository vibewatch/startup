- id: rrmm-burden-and-oricar017-wedge
  title: RRMM burden and the OriCAR-017 post-BCMA niche
  body: 'The multiple-myeloma side of the opportunity is more crowded but also more legible. OriCell’s own product page says most treated MM patients eventually relapse and become refractory, which is the core reason the RRMM market persists despite repeated therapeutic innovation. Independent epidemiology supports that the underlying pool remains meaningful: the Global Cancer Observatory multiple-myeloma fact sheet reports nearly 200,000 incident cases globally, and the American Cancer Society estimates 36,000 new U.S. cases and 10,850 deaths in 2026 alone. OriCAR-017 is not trying to serve that entire burden. Trial registries and the POLARIS publication position the asset in a late-line population after multiple prior therapies, and OriCell highlights activity in some patients who had already relapsed after BCMA CAR-T. That matters strategically because GPRC5D is emerging not simply as another myeloma target, but as a follow-on or sequencing target in a market where BCMA exposure is rising.
    Compared with HCC, the RRMM commercial boundary may ultimately be broader and more global because OriCAR-017 already has both China and U.S. development surfaces; compared with HCC, however, it also faces a more crowded and faster-moving competitive landscape.'
