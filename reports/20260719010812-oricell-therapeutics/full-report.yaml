      - number: '7.5'
        title: Mitigations exist, but the kill criteria are straightforward
        blocks:
          - type: paragraph
            body: >-
              The company does have mitigating evidence. Regulatory progress, repeated conference visibility, a
              broadened patent trail, and successful 2026 financing all show that OriCell is not an unstructured science
              project. Those signals explain why the risk profile is investable rather than disqualifying. But the
              thesis-break triggers are still blunt. A serious safety signal in Ori-C101, an inability to reproduce
              efficacy in more formal settings, a failure to expand OriCAR-017 credibly into U.S.-visible development,
              or evidence of capital-market stress before the next value-creating milestone would each materially damage
              the case. Likewise, any credible IP dispute directly targeting the company’s lead constructs or a
              persistent failure to operationalize the rapid-CMC narrative would force a reassessment of moat and
              valuation. Risk mitigation here is therefore less about generic monitoring and more about watching a
              handful of high-information indicators. If those indicators move the wrong way,

              there is little room for narrative rescue because the company is still precommercial and milestone-funded.
            claimRefs:
              - CR033
