              Across both lead programs, OriCell’s competitive posture is best described as differentiated but still
              provisional. The company has enough evidence to matter: a live HCC wedge, a visible RRMM program, platform
              language around armoring and rapid CMC, and financing sufficient to remain in the conversation. The
              anti-thesis is just as concrete. In myeloma, approved BCMA CAR-Ts and a marketed GPRC5D therapy set a high
