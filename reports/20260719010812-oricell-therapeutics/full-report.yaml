  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Current monetization is financing-led, not product-led
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows OriCell as a clinical-stage biotech rather than as a revenue-generating commercial
              company. The company’s own press releases and third-party coverage frame the 2026 story around
              fundraising, platform development, global expansion, and pivotal clinical preparation—not around sales,
              reimbursement contracts, or recurring product income. That does not mean there is no eventual revenue
              model. It means the public revenue bridge is still future tense: clinical data supports regulatory
              progress, regulatory progress supports approval, approval supports pricing and reimbursement, and only
              then can treatment activity convert into recognized revenue. Until those steps occur, the cleanest public
              interpretation is that OriCell’s near-term cash inflows are financing proceeds and any non-disclosed
              partnership economics, not marketed therapy sales. Investors should be careful here because biotech
              narratives often feel commercially concrete long before they are financially

              concrete. OriCell’s financial quality today therefore depends more on how efficiently it turns capital
              into de-risking milestones than on any reported top-line performance.
