        - Require structure protection or step away
      - - Manufacturing fragility becomes visible
        - Poor release rates, long turnaround, or concentrated site dependence
        - Undermines the operational bridge from science to scale
        - Lower base-case band and extend diligence
      - - IPO/exit window closes before proof matures
        - No credible public or strategic path despite progress
        - Reduces monetization options and pricing leverage
        - Favor watchlist over active underwriting
    notes: Kill triggers are intentionally concrete because OriCell’s value is still milestone-concentrated.
    claimRefs:
      - CV033
      - CV037
      - CV039
      - CV043
      - CV044
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Cap table and preferences
        - Post-April 2026 ownership, share classes, liquidation preferences, anti-dilution
        - Determines whether fair enterprise value translates into investable equity value
        - Request financing documents and capitalization table
      - - Cash / burn / runway
        - Current cash balance, monthly burn, runway bridge to next milestone
        - Separates momentum from solvency risk
        - Request CFO or investor materials
      - - Manufacturing quality
        - Release rate, remanufacture rate, turnaround distribution, capacity assumptions
        - Shows whether clinical proof can scale operationally
        - Request CMC dashboard or diligence memo
      - - Site concentration
        - Active-site map, investigator dependence, and geographic mix
        - Tests whether adoption proof is diversified enough for scale
        - Map centers across BEACON, RIGEL, and future sites
      - - IP / FTO
        - Claim charts, licensed rights, overlap analysis around GPC3/GPRC5D/armoring
        - Valuation can outrun defensibility if FTO is weak
        - Obtain IP counsel memo and patent landscape review
      - - Exit readiness
        - IPO workstream status, banks, audit readiness, or strategic inbound interest
        - Tightens probability around exit timing and valuation realization
        - Review board materials or banker presentations
    notes: >-
      These are the smallest set of missing inputs that would most quickly convert OriCell from interesting to
      underwritable.
    claimRefs:
      - CV027
      - CV029
      - CV041
      - CV042
  - id: TV007
    title: Exit readiness and path table
    columns:
      - Path
      - What supports it today
      - What still must happen
      - Current read
    rows:
      - - Public listing / IPO
        - April 2026 round framed as pre-IPO; H1 2026 biotech IPO window improved
        - Need priced valuation support, stronger milestone package, and cleaner disclosure
        - Possible but not yet ready for high-confidence underwriting
      - - Strategic sale
        - Gracell shows strategic appetite for China-origin cell-therapy assets
        - Need differentiated proof strong enough to trigger buyer competition
        - Plausible medium-term if data stay strong
      - - Remain private and raise again
        - Known investor access and continued private capital availability
        - Need acceptable terms and runway into the next proof point
        - Most likely near-term path
      - - Standalone cash-flow independence
        - No public evidence today
        - Would require approvals, pricing, and commercial execution
        - Not a near-term valuation basis
    notes: >-
      Exit readiness is better than in 2025 because the market thawed, but realization still depends on proof and
      disclosure.
    claimRefs:
      - CV003
      - CV021
      - CV024
      - CV025
      - CV026
      - CV037
