    summary: >-
      The decision chain runs from milestone quality and market access through price opacity to a research-more
      recommendation.
    data:
      nodes:
        - id: proof
          label: Milestone proof
          description: Ori-C101 and OriCAR-017 provide real but still incomplete de-risking
        - id: capital
