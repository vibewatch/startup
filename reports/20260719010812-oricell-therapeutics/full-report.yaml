      - number: '3.2'
        title: In RRMM, OriCAR-017 is entering a mature late-line battlefield, not an open lane
        blocks:
          - type: paragraph
            body: >-
              The myeloma picture is much harsher. OriCAR-017 competes in a late-line setting already shaped by approved
              BCMA CAR-T products such as CARVYKTI and ABECMA, plus the GPRC5D bispecific TALVEY. That means OriCell is
              not asking investors to imagine a future market from first principles; it is entering a market with real
              clinical standards, real safety expectations, and real distribution incumbents. The opportunity remains
              meaningful because patients still relapse and sequencing after BCMA exposure remains a live commercial
              problem, which is exactly why GPRC5D matters. But OriCAR-017 will not win merely by existing. To displace
              or sit beside approved products, it must show durable activity in post-BCMA populations, acceptable
              toxicity, and a manufacturing or access advantage. This is why the multiple-myeloma program may carry
              broader global option value than Ori-C101 while simultaneously facing a lower margin for error. The
              competitors are better capitalized, commercially embedded, and

              already educating physicians and patients about late-line cell therapy.
            claimRefs:
