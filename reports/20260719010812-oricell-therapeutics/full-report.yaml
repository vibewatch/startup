            title: Legal comfort should not be inferred from absence of a visible lawsuit
            body: >-
              The public legal story today is dominated by patent-footprint visibility and unresolved FTO questions, not
              by a clean bill of health. Investors should treat legal silence as an area for diligence, not as proof of
              safety.
