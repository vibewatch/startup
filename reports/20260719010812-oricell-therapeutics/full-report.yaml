      - number: '2.4'
        title: Buyers, users, payers, and adoption path at the trial stage
        blocks:
          - type: paragraph
            body: >-
              At this stage, the real buyers are not payers but trial systems. For Ori-C101, the decisive users are
              specialist liver-cancer investigators, hepatobiliary oncology teams, and tertiary hospitals capable of
              complex autologous cell-therapy logistics. For OriCAR-017, the corresponding sites are advanced hematology
              and transplant-capable centers. In both cases, the immediate payer is essentially the sponsor-funded
              clinical-trial budget rather than a mature reimbursement channel. That distinction matters because it
              means hospital willingness to screen, manufacture, infuse, and follow patients is the current adoption
              bottleneck, not broad formulary inclusion. The NCI RIGEL page and the Chinese registries together show
              that OriCell is already building these specialist site networks, but they do not show a scaled commercial
              delivery footprint yet. The likely adoption sequence is therefore trial enrollment, safety and efficacy
              readouts, regulatory progress, launch into a narrow set of high-capability centers, and only later
              expansion into broader hospital and payer pathways. Any top-down revenue model that skips those
              infrastructure steps would be overstated.
            claimRefs:
