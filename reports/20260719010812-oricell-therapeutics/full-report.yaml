              of many winners should not be mistaken for lack of competition. Investors should therefore resist
              simplistic framing such as ‘first solid-tumor CAR-T winner takes all’ or ‘OriCAR-017 is the only post-BCMA
              path.’ A more defensible view is that OriCell can earn strategic value if it produces clean, durable data
              in niches where current options remain inadequate. Until that happens, competitive advantage is an
