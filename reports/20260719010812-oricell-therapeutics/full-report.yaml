  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current financing context proves momentum but not price
        blocks:
          - type: paragraph
            body: >-
              OriCell’s 2026 financing sequence is the only hard current valuation evidence in public view, and it is
              still incomplete. The company clearly demonstrated fundraising momentum with a US$70 million Series C1
              initial close in January and a cumulative pre-IPO financing above US$110 million in April. Independent
              coverage further tied the April raise to IPO preparation, which matters because it implies capital-markets
              ambition rather than simple balance-sheet repair. But the public documents stop well short of what an
              investor would need to underwrite a price. They do not disclose post-money valuation, share count,
              preference terms, or a cash-and-runway bridge. That omission is decisive. It means the correct input is
              not “OriCell is worth at least X because smart investors funded it,” but “OriCell has real financing
              access while its current equity price remains opaque.” For a valuation chapter, access to money is
              supportive evidence; it is not the same thing as disclosed price support.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV027
              - CV028
              - CV029
          - type: table
            tableRef: TV004
