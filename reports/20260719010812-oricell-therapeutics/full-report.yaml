              that includes antibody discovery, armored CAR design, and rapid CMC execution. That architecture matters
              because investors are being asked to evaluate not just whether one candidate works, but whether the
              company can repeatedly generate and manufacture differentiated cell-therapy programs. The public evidence
              supports that narrative directionally. It shows multiple platform names, multiple disclosed programs, and
              repeated conference or regulator-visible milestones. What it does not

