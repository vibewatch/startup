            body: >-
              The most concrete financial evidence in 2026 is the capital raise sequence itself. OriCell announced a $70
              million Series C1 initial close in January and a cumulative pre-IPO financing round above $110 million in
              April, with the company explicitly stating that proceeds would accelerate global clinical development,
              strengthen technology capabilities, and support capital-markets milestones. Independent coverage
              consistently portrays the April financing as a step toward IPO readiness rather than as the end of funding
              needs. That framing matters. In precommercial biotech, a large round usually reduces immediate solvency
              risk while leaving long-term dilution risk very much alive, especially when pivotal studies, U.S.
              expansion, and manufacturing scale-up are still ahead. The public gap is that OriCell never discloses cash
