              - CR033
      - number: '7.2'
        title: Operational risk is concentrated in autologous manufacturing and quality execution
        blocks:
          - type: paragraph
            body: >-
              Autologous cell therapy makes operations inseparable from product risk. OriCell’s public story depends on
              rapid CMC, specialist-site execution, and the ability to convert complicated cell-therapy workflows into
              repeatable clinical output. That means manufacturing failure, release delay, vein-to-vein slippage, or
              center inconsistency can damage both patients and valuation at the same time. The public gap is that
              OriCell does not disclose the industrial metrics that would let outside investors assess whether those
              risks are shrinking: batch-release rate, remanufacture frequency, turnaround distributions, scale
              capacity, and comparability controls are all absent. The result is a risk profile where the company may be
              operationally stronger than the public can see, but the public cannot verify it. Operationally, the most
              dangerous outcome is not a total collapse; it is a long period of partial underperformance where
              enrollment, manufacturing, and quality are each just good enough to

              continue but not good enough to support accelerated scale or persuasive economics. That kind of friction
              can quietly destroy financing leverage.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
