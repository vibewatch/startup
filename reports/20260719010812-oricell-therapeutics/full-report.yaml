      - number: '1.2'
        title: Founders, executives, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Leadership is concentrated around two disclosed founders with complementary profiles. Helen Yang is the
              public-facing business leader, listed as co-founder, chairperson, and CEO, while Peter He is the
              scientific co-founder and CSO with a tumor-immunology background. Around them, the company discloses a
              relatively mature executive bench for a private biotech: Rick Xu as CMO, Iris Huang as CFO and chief of
              staff, and Weidong Cui as CTO and GM for the U.S. unit. The biographies matter because they explain how
              OriCell is attempting to bridge science, manufacturing, and financing. Yang's prior experience includes
              leading a listed company through IPO; Huang came from investment banking at J.P. Morgan and Bank of
              America Merrill Lynch; Cui previously led the China tech transfer and launch work around Yescarta at Fosun
              Kite. The scientific advisory board listing, including Shaji Kumar and Kenneth Anderson, adds
              multiple-myeloma credibility. The dependence risk is still material: the narrative of company, science,
              and financing is tightly coupled to Yang and He, and the public record does not disclose independent
              board-control mechanics, voting rights, or succession planning. In practical diligence terms, OriCell
              looks founder-shaped but no longer founder-only.
