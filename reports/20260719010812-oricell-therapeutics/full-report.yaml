        title: Exhibits
        blocks:
          - type: callout
            title: OriCell participates in two markets, but only one has a near-term registrational path
            body: >-
              Ori-C101 in advanced HCC is the asset with the clearest China-first commercialization logic because it now
              has confirmatory phase II clearance. OriCAR-017 may ultimately access a larger global myeloma market, but
              today it is still primarily a late-line development program.
