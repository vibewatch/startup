              - CV041
              - CV042
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not underwrite a hidden unicorn
            body: >-
              OriCell may ultimately deserve a billion-dollar-plus outcome, but the public evidence does not justify
              treating that as a current fact without disclosed terms.
            calloutType: recommendation
            claimRefs:
              - CV028
              - CV034
              - CV040
          - type: callout
            title: 2026 materially improved the story
            body: >-
              The financing sequence plus Ori-C101 and OriCAR-017 milestones make OriCell much more credible than a
              generic early-stage platform.
            calloutType: strength
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV035
          - type: callout
            title: Structure risk matters as much as science risk
            body: >-
              Without the cap table, runway, and manufacturing-quality metrics, valuation can look stronger in narrative
              form than in actual investor outcomes.
            calloutType: risk
            claimRefs:
              - CV029
              - CV041
              - CV042
