      - number: '7.3'
        title: Legal and dependency risk are shaped more by IP uncertainty and counterparties than by visible lawsuits
        blocks:
          - type: paragraph
            body: >-
              The current public legal picture is notable for what it does and does not show. Public patent surfaces
              make it clear that OriCell has a growing IP footprint across targets and constructs, including GPRC5D,
              CLDN18.2/MSLN, MSLN, and bispecific antibody work. That supports the company’s claim to be more than a
              one-asset story. But public assignment pages do not resolve freedom to operate, enforceability, geographic
              coverage, or overlap with dense CAR-T and antibody IP fields. In other words, the visible legal risk is
              not a known lawsuit but the possibility that strategic value outruns defensibility. Dependency risk
              compounds this. OriCell relies on regulators, specialist investigators, CMC execution, and capital
              providers; no one dependency alone necessarily breaks the company, but a problem in any two at once could.
              This is why the legal and partner registers should be read together. The central diligence question is
              whether OriCell’s platform can remain both technically distinctive and

              legally usable as programs advance toward higher-value milestones.
            claimRefs:
              - CR017
              - CR018
