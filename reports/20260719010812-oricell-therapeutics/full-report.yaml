companyProfile:
  summary: |
    OriCell Therapeutics is a Shanghai-headquartered private cell-therapy company that says it was
    founded in 2015 and has raised over US$300M across five private financing rounds. The public
    story sharpened materially in 2026: OriCell disclosed a US$70M Series C1 initial close in
    January and a cumulative pre-IPO financing above US$110M in April, while Ori-C101 advanced to
    an NMPA-cleared confirmatory phase II path in advanced hepatocellular carcinoma. OriCell’s
    second visible lead program, OriCAR-017, targets GPRC5D in relapsed/refractory multiple
    myeloma and carries U.S. regulatory visibility through Fast Track and the RIGEL study. The
    company’s strategic appeal comes from trying to solve the unusually hard solid-tumor CAR-T
    problem while also maintaining a hematology option set. The public downside is disclosure:
    valuation, cap table, revenue, unit economics, and core manufacturing-quality metrics remain
    private.
