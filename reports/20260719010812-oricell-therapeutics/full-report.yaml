      - number: '6.4'
        title: Expansion depends on broader site penetration and future payer conversion
        blocks:
          - type: paragraph
            body: >-
              If OriCell succeeds, expansion will not look like seat expansion or upsell; it will look like new sites,
              broader investigator referral patterns, more eligible patients, additional geographies, and eventual
              conversion from sponsor-funded workflows into payer-recognized pathways. That makes concentration and
              procurement friction central future risks. In HCC, expansion means moving beyond a few flagship centers
              into a broader China specialist-center network after stronger registrational evidence. In RRMM, it means
              proving enough post-BCMA relevance and manufacturing reliability to justify incremental site adoption in
              China and the U.S. The public organizational-signal sources are mixed: conference activity and industry
              profiles imply active engagement, but job-board and company-profile evidence is weak and does not prove
              scaled commercial infrastructure. The customer verdict is therefore constructive but limited. OriCell has
              real specialist-site and investigator proof, yet it is still

              precommercial enough that customer durability and concentration should be treated as diligence questions,
              not as solved variables.
            claimRefs:
              - CU022
              - CU023
              - CU024
              - CU025
              - CU026
              - CU027
              - CU028
              - CU029
          - type: table
            tableRef: TU005
