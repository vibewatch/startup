      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: For OriCell, adoption proof is clinical before it is commercial
            body: >-
              The strongest current customer evidence is not revenue but repeat external engagement by investigators,
              publications, registries, and regulators.
            calloutType: insight
            claimRefs:
              - CU001
              - CU008
              - CU010
              - CU018
          - type: callout
            title: Customer concentration is probably high even if the exact numbers are not public
            body: >-
              Advanced autologous therapies usually depend on a handful of elite centers early on. Without a site map,
              OriCell’s concentration risk should be assumed material rather than dismissed.
            calloutType: risk
            claimRefs:
              - CU020
              - CU023
