      - number: '4.2'
        title: Pricing, sales efficiency, and unit economics remain mostly undisclosed
        blocks:
          - type: paragraph
            body: >-
              The public record provides almost no direct support for underwriting product-level economics. There is no
              public OriCell price list, no reimbursement architecture, no disclosed manufacturing cost per batch, no
              gross-margin profile, and no evidence of commercial sales efficiency because the company is not yet
              selling an approved product. The best public proxies come from the structure of autologous cell therapy
              itself and from marketed myeloma comparables: manufacturing is complex, site onboarding is specialized,
              and the commercial pathway requires physician education plus payer negotiation. Those facts matter, but
              they still do not yield OriCell-specific unit economics. Even the most important funnel
              variables—screening yield, apheresis success, batch failure, release timing, hospitalization cost, and
              reimbursement timing—remain private. Financially, that forces a disciplined conclusion. OriCell may
              eventually monetize through high-value specialty therapies, but the public evidence

              does not yet show what price, margin, or sales-cycle shape that monetization would take. The correct
              analytical posture is to leave those cells null rather than to backfill them with peer averages and false
              confidence.
