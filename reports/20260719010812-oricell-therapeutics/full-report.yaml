  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: two clinical wedges, not one generic cell-therapy TAM'
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to define OriCell’s market is not “cell therapy” in the abstract, but two specific
              clinical wedges that happen to sit on the same platform foundation. The first wedge is advanced
              hepatocellular carcinoma treated with a GPC3-targeted autologous CAR-T after standard systemic therapies
              have failed. The second is relapsed or refractory multiple myeloma treated with a GPRC5D-targeted CAR-T
              after multiple prior lines, including in some cases BCMA-directed therapy. This matters because a broad
              CAR-T market headline or all-oncology TAM hides the infrastructure and eligibility realities that
              determine whether OriCell can ever monetize its science. Today the company is not competing for all
              liver-cancer or myeloma spend; it is competing for specialist late-line patients treated at hospitals
              capable of running cell-therapy workflows. That boundary excludes most earlier-line disease, community
              settings without advanced cell-therapy capabilities, and non-cell modalities except as competitive
              substitutes. It also means the company’s most tangible near-term commercial path is narrower than its
              scientific ambition.
            claimRefs:
              - CM001
              - CM002
              - CM013
              - CM015
              - CM016
              - CM017
