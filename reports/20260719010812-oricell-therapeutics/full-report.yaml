              demonstrated financing access in 2026, attracted a recognizable investor syndicate, and articulated uses
              of proceeds that match what a serious clinical-stage cell-therapy company should be funding. On the
              negative side, the evidence that would allow real underwriting—cash balance, quarterly burn, unit
