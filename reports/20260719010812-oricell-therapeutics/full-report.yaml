      - number: '3.3'
        title: China peer set and distribution power matter as much as target biology
        blocks:
          - type: paragraph
            body: >-
              China’s cell-therapy ecosystem makes the competitive analysis more than a science fair. CARsgen,
              IASO/Innovent, and Gracell all show that Chinese-origin developers can build meaningful pipeline breadth,
              partner with major hospitals, and in some cases reach approval, acquisition, or public-market funding.
              Those examples matter because they define what ‘credible’ looks like to investigators and late-stage
              investors. OriCell’s April 2026 financing and conference visibility suggest that it has joined that
              credible set, but credibility is not the same as entrenched distribution. Approved or near-approved peers
              have stronger site familiarity, larger safety databases, and more negotiating power with future partners
              or public investors. For OriCell, distribution power today is still mostly relational: investigator
              networks, specialist-center access, conference mindshare, and capital-market readiness. That can support
              trial recruitment and fundraising, yet it remains weaker than a commercial

              organization or an approved-label franchise. In other words, OriCell’s competitive edge today is velocity
              and scientific focus, not installed-base advantage.
