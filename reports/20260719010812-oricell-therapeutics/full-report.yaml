        title: The cost structure is easiest to understand through category capital intensity
        blocks:
          - type: paragraph
            body: >-
              While OriCell does not publish its own burn profile, the category it operates in is visibly capital
              intensive. The company’s platform language emphasizes armored engineering, rapid CMC, multi-region
              clinical development, and next-generation modalities such as in vivo CAR-T; each of those workstreams
              consumes skilled labor, trial operations budget, manufacturing spend, and quality systems investment
              before any revenue is realized. Public-market peers reinforce the point. Legend remains a
              multi-billion-dollar commercial benchmark in cell therapy, while CARsgen’s public-market data and
              financial-report history show that China-origin CAR-T companies can sustain meaningful public valuations
              even before broad profitability. Those peers should not be treated as clean analogues for OriCell
              economics, but they do show what investors ultimately fund in this category: pipeline progress,
              manufacturing credibility, and enough balance-sheet access to survive long clinical timelines. For
              OriCell, the

              key financial implication is that capital adequacy matters more than near-term margin modeling. A company
              can have excellent science and still become financially fragile if clinical expansion and manufacturing
              readiness outpace available cash.
