      - number: '3.4'
        title: Switching costs are clinical and operational, but the moat is not locked yet
        blocks:
          - type: paragraph
            body: >-
              Because OriCell is still clinical-stage, the current switching costs are not classic enterprise lock-in.
              They are clinical and operational switching costs: which target a physician trusts after BCMA, which
              hospital can run the workflow, which sponsor can supply slots, and which dataset a regulator finds
              credible. That produces partial multi-homing rather than winner-take-all dynamics. Investigators can
              enroll patients across multiple products over time, and future partners can back more than one platform.
              OriCell’s moat argument therefore rests on differentiation within a fluid market: armored solid-tumor
              design, a China-first registrational HCC wedge, an active U.S. pathway for OriCAR-017, and enough
              manufacturing know-how to keep vein-to-vein execution credible. Yet every element of that moat is
              contestable. Competitors already own approved labels, broader balance sheets, or deeper channel
              relationships. Even in HCC, where the peer set is smaller, CARsgen’s long-running GPC3 work

              prevents OriCell from claiming target exclusivity. The competitive conclusion is positive but cautious:
              OriCell has a differentiated position, not a durable fortress.
