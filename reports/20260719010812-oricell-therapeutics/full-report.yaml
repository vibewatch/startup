      - number: '1.5'
        title: Patient proof, risk framing, and unresolved disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              OriCell publishes unusually direct patient-facing material for a private biotech, including named
              testimonials from two liver-cancer patients on the about page and a plain-language clinical page that
              explains trial benefits and risks. That helps the customer-proof surface for an otherwise pre-commercial
              business: patients, families, hospitals, and clinics are treated as current stakeholders even without
              traditional customers. The same clinical page is valuable because it does not pretend away risk; it
              explicitly warns participants about unexpected side effects, time burden, and the possibility that therapy
              may be less effective than standard treatment. Independent sources sharpen that caution. MedCity described
              solid tumors as one of cell therapy's hardest frontiers, and a 2026 review summarized persistent barriers
              such as tumor infiltration, antigen heterogeneity, and T-cell exhaustion. These are not abstract sector
              warnings—they are the core technical reasons OriCell's apparent milestone lead may still fail to convert
              into approval or durable commercial edge. Public-company-style underwriting is also impossible today
              because the company does not disclose valuation, cap-table structure, ownership concentration, liquidation
              preferences, revenue, ARR, or an exact employee count. An investor can credibly say the company looks
              real, funded, and clinically relevant; an investor cannot yet say the company is fully priced or fully
              governed from public evidence alone.
            claimRefs:
              - CO036
              - CO040
              - CO041
              - CO042
              - CO043
      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: OriCell has crossed from platform narrative into asset-specific evidence
            body: >-
              The June 2026 NMPA clearance for a confirmatory Ori-C101 phase II trial is the strongest public proof that
              the lead program has moved beyond exploratory science. Combined with peer-reviewed and conference-visible
              OriCAR-017 data, OriCell now has both a solid-tumor registrational path in China and a hematology asset
              with U.S. regulatory traction.
            calloutType: strength
            claimRefs:
              - CO032
              - CO033
              - CO034
          - type: callout
            title: Late-private maturity does not equal underwritable transparency
            body: >-
              Even after multiple rounds and pre-IPO messaging, OriCell still does not publicly disclose valuation,
              ownership concentration, liquidation preferences, revenue, ARR, or an exact headcount. A disciplined
              investor should treat the company as promising but still materially opaque until management opens those
              data.
            calloutType: risk
            claimRefs:
