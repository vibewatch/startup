  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and clinical risk remain the thesis-breaking core
        blocks:
          - type: paragraph
            body: >-
              The most severe risks around OriCell are still clinical and regulatory. Ori-C101’s confirmatory phase II
              clearance is a positive milestone, but it also raises the stakes: the company is moving from an
              early-signal narrative into a setting where efficacy durability, trial design, and safety consistency
              matter much more. OriCAR-017’s Fast Track and U.S. study visibility do something similar in myeloma. They
              reduce platform skepticism while increasing the cost of failure. The central clinical risk is that
              solid-tumor CAR-T remains one of oncology’s hardest categories because infiltration, antigen
              heterogeneity, and immunosuppressive microenvironments can erode efficacy after promising early responses.
              A second risk is that early investigator-driven proof may not scale cleanly into more formal multi-center
              settings. Regulatory visibility therefore mitigates feasibility risk but does not remove approval risk.
              For investors, the clear implication is that the next material data updates are

              not incremental optics; they are the main decision points that determine whether OriCell stays on a
              registrational path or reverts to a longer, more dilutive development cycle.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
