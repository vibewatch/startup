          description: 2026 fundraising shows access, not a disclosed current price
        - id: market
          label: Market window
          description: IPO window improved but remains selective toward later-stage stories
        - id: opacity
          label: Price opacity
          description: No public valuation, cap table, or runway bridge
        - id: synthesis
          label: Synthesis
          description: Promising company, under-disclosed investment entry point
        - id: call
          label: 'Recommendation: Research-more'
          description: Track actively and re-engage on terms or stronger proof
      edges:
