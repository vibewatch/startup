            title: Disease burden is not the same thing as addressable revenue
            body: >-
              Public incidence and mortality statistics make HCC and myeloma look large, but OriCell has not disclosed
              the eligible-patient denominator, pricing, or hospital-capacity assumptions needed to convert burden into
              revenue TAM. The market story is therefore compelling but not yet underwritten.
