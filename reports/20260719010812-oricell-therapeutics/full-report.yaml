      - number: '7.4'
        title: Financing, customer concentration, and execution leadership are still tightly coupled
        blocks:
          - type: paragraph
            body: >-
              OriCell’s financial and customer risks are linked because both are driven by milestone concentration. The
              company still lacks public cash, burn, and runway data, so future financing risk cannot be separated
              cleanly from trial outcomes. At the same time, its current customer proof depends heavily on a small
              number of specialist investigators, centers, and named studies rather than on a broad commercial
              footprint. That makes both capital access and adoption proof unusually concentrated in a few upcoming
              milestones. People risk sits inside the same structure. OriCell’s public identity is highly tied to a
              small number of founders and scientific leaders, and cross-border execution across China and U.S. pathways
              raises coordination demands. If leadership, site execution, and financing readiness stay aligned, the
              company can keep compressing risk. If they diverge, seemingly moderate issues—slow enrollment, delayed
              manufacturing scale-up, uneven communication with public-market investors—could

              compound quickly. For an investor, this is not background noise; it is a live transmission path from
              execution friction into dilution and strategic optionality loss.
            claimRefs:
              - CR025
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
