              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
              - CV042
      - number: '8.5'
        title: The remaining diligence path is short and consequential
        blocks:
          - type: paragraph
            body: >-
              The encouraging feature of the OriCell case is that the highest-value remaining questions are
              identifiable. An investor does not need a hundred more sources; it needs a handful of missing numbers and
              documents. The first is the post-April 2026 cap table and cash-runway bridge, because that determines
              whether future upside accrues to new money or is trapped beneath preference layers. The second is
              manufacturing quality evidence—release rate, turnaround time, remanufacture frequency, and site
              concentration—because a cell-therapy story can look clinically credible while still being operationally
              fragile. The third is explicit monitoring of thesis-break triggers. A safety signal, failed confirmatory
              execution, or distressed financing would rapidly compress fair value, while a disclosed priced round or a
              stronger-than-expected data package could justify a re-rating. That asymmetry is why the right near-term
              posture is not passivity. It is active tracking with explicit re-engagement conditions.
            claimRefs:
              - CV041
              - CV042
              - CV043
              - CV044
          - type: table
            tableRef: TV005
            claimRefs:
