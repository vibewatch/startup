chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              OriCell Therapeutics presents itself in 2026 as a China-based clinical-stage biotechnology company built
              around next-generation CAR-T and related cell-therapy platforms. The safest anchored founding fact is the
              company's own about page, which says OriCell was founded in 2015. That same official page frames the
              mission in unusually practical terms for a cell-therapy startup: not just scientific novelty, but
              effective and accessible immunotherapeutics intended to extend patients' lives. The contact page shows
              that the business has already been organized beyond a single Shanghai laboratory. OriCell publicly lists
              entities in Shanghai, Beijing, Roseland in New Jersey, and Hong Kong, which together imply a structure
              built for mainland clinical execution, U.S. development, and eventual cross-border capital-market or
              partnering activity. The homepage and product page show a two-wedge clinical identity: solid tumors led by
              Ori-C101 in hepatocellular carcinoma and hematologic malignancies led by OriCAR-017 in relapsed or
              refractory multiple myeloma. Even before judging commercial quality, the company-overview conclusion is
              that OriCell is no longer a seed-stage platform story; it is a late-private, multi-entity clinical company
              with enough organizational sprawl that investors should diligence governance, control, and cross-border
              execution explicitly.
