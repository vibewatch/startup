  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct HCC and solid-tumor peers are fewer, but the benchmark is already demanding
        blocks:
          - type: paragraph
            body: >-
              OriCell’s most direct public comparison in liver cancer is not a global approved product, but the small
              set of developers that have made GPC3 or adjacent solid-tumor CAR-T strategies legible in humans. CARsgen
              is the clearest China-based reference point because it publicly discloses a GPC3 hepatocellular-carcinoma
              program, completed an earlier China phase I study, and continues to invest across solid tumors and in vivo
              CAR-T. Eureka is a useful adjacency because it also highlights liver-cancer programs and a broader
              intracellular-targeting platform. The strategic implication is that OriCell does not need to prove that
              GPC3 is an investable antigen from scratch; it needs to prove that its armored engineering and clinical
              execution can outperform neighboring attempts in efficacy durability and operational feasibility. The
              competitive field is still thin relative to myeloma, but thin does not mean easy. Solid-tumor CAR-T
              remains biologically difficult, so any credible peer that stays

              funded and clinically active raises the bar for Ori-C101 rather than validating an empty white space.
            claimRefs:
