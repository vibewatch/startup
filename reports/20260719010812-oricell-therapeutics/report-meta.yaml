  productSummary: |
    OriCell is developing autologous CAR-T cell therapies and related platform capabilities. The
    lead visible asset is Ori-C101, a GPC3-targeted therapy for advanced hepatocellular carcinoma,
    and the second key asset is OriCAR-017, a GPRC5D-targeted therapy for relapsed/refractory
    multiple myeloma. The broader platform narrative includes armored cell-therapy design,
    manufacturing/CMC execution, and a pipeline that extends beyond a single program.
  customerFocus: Patients with advanced hepatocellular carcinoma and relapsed/refractory multiple myeloma, delivered through specialist oncology investigators and cell-therapy treatment centers.
  businessModel: Precommercial biotech funded by private equity rounds today, with future value expected from clinical de-risking, potential partnerships, strategic exits, or IPO financing ahead of eventual therapy commercialization.
  stage: Pre-IPO private clinical-stage biotech
