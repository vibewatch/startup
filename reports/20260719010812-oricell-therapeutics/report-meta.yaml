  topStrengths:
    - "Differentiated solid-tumor CAR-T wedge in Ori-C101, where public evidence now includes human efficacy signals and an NMPA-cleared confirmatory phase II path."
    - "Dual-program visibility: OriCell pairs the HCC story with OriCAR-017 in RRMM, creating a second regulatory and strategic option set."
    - "2026 financing momentum is meaningful; the January and April rounds show OriCell can still attract capital in a selective biotech market."
    - "Public-market and strategic precedents (CARsgen, Gracell) show that China-origin cell-therapy assets can achieve real capital-markets or M&A outcomes."
    - "Management disclosure publicly centers founders Helen Yang and Peter He, giving the company a visible leadership spine around business and science."
  topRisks:
    - "Public valuation remains undisclosed, so investors cannot determine whether the current entry price is attractive, fair, or already stretched."
    - "Solid-tumor CAR-T remains biologically and operationally hard; a single disappointment in Ori-C101 could compress the whole story."
    - "Core underwriting inputs remain private: cap table, cash, burn, runway, batch-release metrics, turnaround time, and site concentration."
    - "Future value realization still depends on capital-market conditions that have improved in 2026 but remain selective and later-stage biased."
    - "If new financing occurs on punitive terms, upside could be absorbed by preference structure rather than by new investors."
  unresolvedGaps:
    - "Current post-April 2026 valuation, share price, and full cap-table / liquidation-preference structure."
    - "Cash balance, monthly burn, and runway to the next value-creating clinical milestone."
    - "Manufacturing release rates, remanufacture frequency, turnaround distribution, and capacity assumptions."
    - "Active-site concentration and whether investigator/customer proof is broad enough to support scaled enrollment and eventual launch readiness."
    - "Freedom-to-operate and IP-overlap analysis around GPC3, GPRC5D, armored constructs, and future platform extensions."
