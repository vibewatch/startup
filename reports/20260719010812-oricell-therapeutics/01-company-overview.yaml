  - TO002
- id: capital-base-and-investor-syndicate
  title: Funding history, investor syndicate, and IPO posture
  body: 'The capital history is rich enough to establish OriCell as a serious late-private company, but not rich enough to fully underwrite valuation. The official investor page gives the cleanest chronological sequence: a 2019 pre-A round of RMB 80 million from Qiming Venture Partners, a 2020 Series A of about RMB 202 million led by Yijing Capital, a 2022 Series B of $120 million, a 2023 Series B1 of $45 million, and then 2026 financing activity. January 2026 brought a $70 million initial closing of Series C1; April 2026 brought a cumulative pre-IPO round in excess of $110 million. Because the April announcement explicitly says cumulative close, the conservative approach is not to add the January and April numbers mechanically unless management shows the final round accounting. That is why the official investor page''s summary phrase—over $300 million in five rounds—remains the safest public underwriting anchor, while a higher total is directionally plausible but not fully proven from retained
    sources alone. What is proven is the syndicate quality and intent. The 2026 round names Vivo Capital, Beijing Medical and Health Care Industry Investment Fund, Qiming, sovereign-wealth capital, and other specialist healthcare backers, while independent coverage explicitly frames the raise as a pre-IPO step. OriCell is therefore capitalized like a company preparing for a public-market attempt, even though the public record still withholds the price at which that attempt may occur.'
