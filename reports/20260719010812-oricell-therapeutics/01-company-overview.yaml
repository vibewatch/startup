company:
  name: OriCell Therapeutics
chapter:
  number: 1
  title: Company Overview
  summary: 'OriCell Therapeutics is a Shanghai-headquartered clinical-stage private cell-therapy company whose public story hardened materially in 2026. Official sources say the business was founded in 2015, operates across Shanghai, Beijing, New Jersey, and Hong Kong, and is led by co-founder CEO Helen Yang and co-founder CSO Peter He. The company disclosed a conservative lifetime financing base of more than $300 million and a cumulative 2026 pre-IPO close above $110 million, but it still withholds valuation, cap-table, revenue, and exact headcount data. What is publicly strongest is the program signal: Ori-C101 in hepatocellular carcinoma now has a confirmatory phase II path in China, while OriCAR-017 in relapsed/refractory multiple myeloma combines peer-reviewed phase 1 data with U.S. regulatory traction. What remains under-documented is the exact price, ownership structure, and operational scale behind that momentum.'
contentRequirements:
- Identity, headquarters, founding date, current stage, and one-line product/business model.
- Founders, leadership, board/governance, key-person dependence, and material leadership changes.
- Funding history, valuation, total raised, investors, secondaries, debt/credit when supportable.
- Cover metrics (valuation, raised, revenue/run-rate, customers, headcount, locations) with explicit gaps for unsupported numbers.
- Milestones across founding, financing, product, scale, regulatory, partnerships, and adverse events.
