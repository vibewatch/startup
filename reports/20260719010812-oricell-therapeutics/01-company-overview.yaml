callouts:
- calloutType: strength
  title: OriCell has crossed from platform narrative into asset-specific evidence
  body: The June 2026 NMPA clearance for a confirmatory Ori-C101 phase II trial is the strongest public proof that the lead program has moved beyond exploratory science. Combined with peer-reviewed and conference-visible OriCAR-017 data, OriCell now has both a solid-tumor registrational path in China and a hematology asset with U.S. regulatory traction.
  claimRefs:
  - CO032
  - CO033
  - CO034
- calloutType: risk
  title: Late-private maturity does not equal underwritable transparency
  body: Even after multiple rounds and pre-IPO messaging, OriCell still does not publicly disclose valuation, ownership concentration, liquidation preferences, revenue, ARR, or an exact headcount. A disciplined investor should treat the company as promising but still materially opaque until management opens those data.
  claimRefs:
  - CO023
  - CO036
  - CO043
