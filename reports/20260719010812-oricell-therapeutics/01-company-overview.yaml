  acceptedTypes:
  - kpi
  requirement: Summarize maturity, traction, risk, and investability when supportable.
evidenceStrategy:
- Official identity surfaces, company pages, investor pages, clinical pages, and press releases establish the canonical company facts.
- Independent financing and milestone coverage from trade media is used to corroborate the company narrative and expose what remains undisclosed.
- Clinical registries, publications, and ASCO-linked materials separate promotional language from actual trial-stage evidence.
- Adverse context is anchored in solid-tumor CAR-T challenge reviews and the company's own plain-language clinical-risk disclosures.
qualityBar:
- Separate official facts from inferences about total financing and operating scale.
- Use the company's own 2015 founding statement as the canonical date unless a corporate-registry packet proves otherwise.
- Do not pretend valuation, revenue, or exact headcount are known when the public record does not disclose them.
- 'Make the 2026 milestone chain explicit: financing, ASCO efficacy update, then NMPA phase II clearance.'
sections:
- id: identity-and-footprint
  title: Identity, founding, and operating footprint
  body: 'OriCell Therapeutics presents itself in 2026 as a China-based clinical-stage biotechnology company built around next-generation CAR-T and related cell-therapy platforms. The safest anchored founding fact is the company''s own about page, which says OriCell was founded in 2015. That same official page frames the mission in unusually practical terms for a cell-therapy startup: not just scientific novelty, but effective and accessible immunotherapeutics intended to extend patients'' lives. The contact page shows that the business has already been organized beyond a single Shanghai laboratory. OriCell publicly lists entities in Shanghai, Beijing, Roseland in New Jersey, and Hong Kong, which together imply a structure built for mainland clinical execution, U.S. development, and eventual cross-border capital-market or partnering activity. The homepage and product page show a two-wedge clinical identity: solid tumors led by Ori-C101 in hepatocellular carcinoma and hematologic malignancies
    led by OriCAR-017 in relapsed or refractory multiple myeloma. Even before judging commercial quality, the company-overview conclusion is that OriCell is no longer a seed-stage platform story; it is a late-private, multi-entity clinical company with enough organizational sprawl that investors should diligence governance, control, and cross-border execution explicitly.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO027
  - CO028
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: leadership-and-governance
  title: Founders, executives, and key-person dependence
  body: 'Leadership is concentrated around two disclosed founders with complementary profiles. Helen Yang is the public-facing business leader, listed as co-founder, chairperson, and CEO, while Peter He is the scientific co-founder and CSO with a tumor-immunology background. Around them, the company discloses a relatively mature executive bench for a private biotech: Rick Xu as CMO, Iris Huang as CFO and chief of staff, and Weidong Cui as CTO and GM for the U.S. unit. The biographies matter because they explain how OriCell is attempting to bridge science, manufacturing, and financing. Yang''s prior experience includes leading a listed company through IPO; Huang came from investment banking at J.P. Morgan and Bank of America Merrill Lynch; Cui previously led the China tech transfer and launch work around Yescarta at Fosun Kite. The scientific advisory board listing, including Shaji Kumar and Kenneth Anderson, adds multiple-myeloma credibility. The dependence risk is still material: the narrative
    of company, science, and financing is tightly coupled to Yang and He, and the public record does not disclose independent board-control mechanics, voting rights, or succession planning. In practical diligence terms, OriCell looks founder-shaped but no longer founder-only.'
  claimRefs:
  - CO006
  - CO007
  - CO008
  - CO009
