- id: clinical-assets-and-milestones
  title: Lead programs and milestone quality
  body: 'OriCell''s milestone quality is strongest where it stops describing ambition and starts naming trial-stage evidence. The lead solid-tumor program, Ori-C101, is a GPC3-targeted autologous CAR-T for advanced hepatocellular carcinoma. Company and ASCO-linked materials say the program completed early IIT and IND work, produced a 66.7% objective response rate at the recommended phase II dose in late-line HCC, and then received NMPA clearance in June 2026 for a confirmatory randomized phase II registration study. That combination—clinical signal plus a registration-path regulatory event—is rare enough in solid-tumor CAR-T to matter. The hematology asset, OriCAR-017, is less novel in market category but more advanced in published evidence quality: the POLARIS phase 1 study was published in The Lancet Haematology, and the company says the asset also holds U.S. orphan-drug, IND, and fast-track designations. Together these two assets show why investors continue funding the platform. OriCell
    is not just a technology story; it has one solid-tumor program with registrational intent in China and one multiple-myeloma asset with peer-reviewed first-in-human data and U.S. regulatory traction. That said, both remain pre-approval assets, so company value still transmits through clinical execution rather than recurring cash flow.'
