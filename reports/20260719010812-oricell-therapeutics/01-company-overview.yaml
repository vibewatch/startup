- id: patient-proof-and-public-gaps
  title: Patient proof, risk framing, and unresolved disclosure gaps
  body: 'OriCell publishes unusually direct patient-facing material for a private biotech, including named testimonials from two liver-cancer patients on the about page and a plain-language clinical page that explains trial benefits and risks. That helps the customer-proof surface for an otherwise pre-commercial business: patients, families, hospitals, and clinics are treated as current stakeholders even without traditional customers. The same clinical page is valuable because it does not pretend away risk; it explicitly warns participants about unexpected side effects, time burden, and the possibility that therapy may be less effective than standard treatment. Independent sources sharpen that caution. MedCity described solid tumors as one of cell therapy''s hardest frontiers, and a 2026 review summarized persistent barriers such as tumor infiltration, antigen heterogeneity, and T-cell exhaustion. These are not abstract sector warnings—they are the core technical reasons OriCell''s apparent
    milestone lead may still fail to convert into approval or durable commercial edge. Public-company-style underwriting is also impossible today because the company does not disclose valuation, cap-table structure, ownership concentration, liquidation preferences, revenue, ARR, or an exact employee count. An investor can credibly say the company looks real, funded, and clinically relevant; an investor cannot yet say the company is fully priced or fully governed from public evidence alone.'
  claimRefs:
  - CO036
  - CO040
  - CO041
  - CO042
  - CO043
