  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation disclosure
    missingEvidence: Current pre-money/post-money valuation, share price, and cap-table ownership after the 2026 cumulative pre-IPO close.
    whyItMatters: Without price and ownership data, investors cannot judge dilution, entry valuation, or governance concentration.
    diligencePath: Request the full 2026 financing deck, cap table, and term sheet summary from management.
    relatedQuestionRefs:
    - QO007
    - QO026
  - type: conflicting-data
    severity: material
    topic: 2026 financing aggregation
    missingEvidence: A management reconciliation showing whether the $70M Series C1 close is included in or separate from the >$110M cumulative pre-IPO close.
    whyItMatters: Double counting the 2026 round would overstate cash raised and distort financing history.
    diligencePath: Request a round-by-round cash-raise schedule and closing ledger for 2026.
    relatedQuestionRefs:
    - QO008
    - QO027
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: An official employee count and functional distribution by geography.
    whyItMatters: Execution capacity and burn-rate inference depend on whether the company has tens, low hundreds, or several hundred employees.
    diligencePath: Ask for HR headcount by legal entity and by function as of the latest month-end.
    relatedQuestionRefs:
    - QO019
  - type: missing-source
    severity: material
    topic: commercial disclosure
    missingEvidence: Any disclosed revenue, collaboration accounting, grant accounting, or ARR equivalent.
    whyItMatters: Financial underwriting cannot move beyond pure capital-history analysis without current operating metrics.
    diligencePath: Request audited or board-report financial statements and revenue recognition notes.
    relatedQuestionRefs:
    - QO020
  - type: private-evidence-only
    severity: material
    topic: governance and control
    missingEvidence: Board composition, board committees, protective provisions, and liquidation preference stack.
    whyItMatters: Control rights can materially affect exit, IPO timing, and downside recovery even when science is strong.
    diligencePath: Request the governance package, charter documents, and current investor-rights agreement.
    relatedQuestionRefs:
    - QO026
    - QO028
    relatedTableRefs:
    - TO002
    - TO003
