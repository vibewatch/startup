- id: pricing-unit-economics-and-gtm-gaps
  title: Pricing, sales efficiency, and unit economics remain mostly undisclosed
  body: |-
    The public record provides almost no direct support for underwriting product-level economics. There is no public OriCell price list, no reimbursement architecture, no disclosed manufacturing cost per batch, no gross-margin profile, and no evidence of commercial sales efficiency because the company is not yet selling an approved product. The best public proxies come from the structure of autologous cell therapy itself and from marketed myeloma comparables: manufacturing is complex, site onboarding is specialized, and the commercial pathway requires physician education plus payer negotiation. Those facts matter, but they still do not yield OriCell-specific unit economics. Even the most important funnel variables—screening yield, apheresis success, batch failure, release timing, hospitalization cost, and reimbursement timing—remain private. Financially, that forces a disciplined conclusion. OriCell may eventually monetize through high-value specialty therapies, but the public evidence
    does not yet show what price, margin, or sales-cycle shape that monetization would take. The correct analytical posture is to leave those cells null rather than to backfill them with peer averages and false confidence.
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  tableRefs:
  - TI002
  - TI003
  figureRefs:
  - FI002
- id: cost-structure-and-peer-capital-intensity
  title: The cost structure is easiest to understand through category capital intensity
  body: |-
    While OriCell does not publish its own burn profile, the category it operates in is visibly capital intensive. The company’s platform language emphasizes armored engineering, rapid CMC, multi-region clinical development, and next-generation modalities such as in vivo CAR-T; each of those workstreams consumes skilled labor, trial operations budget, manufacturing spend, and quality systems investment before any revenue is realized. Public-market peers reinforce the point. Legend remains a multi-billion-dollar commercial benchmark in cell therapy, while CARsgen’s public-market data and financial-report history show that China-origin CAR-T companies can sustain meaningful public valuations even before broad profitability. Those peers should not be treated as clean analogues for OriCell economics, but they do show what investors ultimately fund in this category: pipeline progress, manufacturing credibility, and enough balance-sheet access to survive long clinical timelines. For OriCell, the
    key financial implication is that capital adequacy matters more than near-term margin modeling. A company can have excellent science and still become financially fragile if clinical expansion and manufacturing readiness outpace available cash.
  claimRefs:
  - CI015
  - CI016
  - CI017
  - CI018
  - CI019
  - CI020
  - CI021
