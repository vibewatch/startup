company:
  name: OriCell Therapeutics
chapter:
  number: 4
  title: Financials
  summary: 'OriCell remains a precommercial clinical-stage biotech with no public evidence of product revenue, no disclosed pricing, and no public cash-balance or burn figures. The public financial story is therefore mostly a capital-story: a $70M Series C1 initial close in January 2026 followed by a cumulative pre-IPO financing round above $110M in April 2026, both framed as fuel for global clinical expansion and platform development. That funding clearly improves near-term solvency, but it does not resolve the central underwriting questions of runway, manufacturing cost, gross margin, or future dilution. Public peer anchors such as Legend and CARsgen show that investors ultimately value the category through a mix of clinical proof, financing access, and public-market credibility rather than through current earnings. The right financial verdict is not that OriCell is cheap or expensive, but that it remains financeable yet still financing-dependent.'
contentRequirements:
- Revenue streams, pricing model, revenue mix, and recognition issues where supportable.
- GTM motion and sales efficiency proxies (cycle, CAC/payback or proxy, channel economics).
- Cost structure, gross margin drivers, working capital, capex, and service-delivery costs.
- Public traction (revenue, ARR, GMV, units, locations, utilization, active users) versus private-metric gaps.
- Capital adequacy and financing dependency — cash on hand, burn, runway, planned use of funds, next-round trigger, and debt/project-finance obligations. Historical round-by-round chronology lives in Company Overview; refer to that chronology in prose, but do not copy Company Overview claim ids; if Financials needs a funding fact, mint a local Financials claim with its own sourceRefs.
- Financial verdict on revenue quality, margin path, capital intensity, and diligence blockers.
