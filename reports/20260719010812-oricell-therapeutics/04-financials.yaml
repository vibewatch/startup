    - Capital efficiency cannot be benchmarked
    - Request trailing 12-month burn bridge
  - - Program-level budget by Ori-C101, OriCAR-017, and platform work
    - Cannot test whether spend is concentrated or diluted
    - Request annual operating plan by program
  - - Manufacturing cost curve and batch success
    - Gross-margin path is unknowable
    - Request CMC cost assumptions and observed release data
  - - Any partnership revenue or milestone receipts
    - Future dilution may be overstated or understated
    - Request all non-equity cash inflows and contingent payments
  - - Security preferences, liquidation stack, and IPO intent
    - Entry economics and dilution risk remain undefined
    - Request term sheets and current financing plan
