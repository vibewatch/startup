evidenceStrategy:
- Use OriCell financing disclosures and independent coverage for the capital story; do not infer revenue from trial activity.
- Where private metrics are absent, use peer public-market anchors only to show category capital intensity, not to backsolve OriCell economics with false precision.
- 'Keep every undisclosed financial item explicit: cash on hand, burn, margin, manufacturing cost, reimbursement, and debt are public gaps, not solvable from marketing copy.'
- Include at least one adverse source showing that the latest round still does not disclose core underwriting inputs.
qualityBar:
- Do not restate the entire funding chronology; focus on what the 2026 capital raises imply for adequacy and dependence.
- Separate future product revenue possibilities from current financing inflows.
- Every null or unknown unit-economic field needs an exact diligence ask.
- Use peer public-market data only as context; do not pretend Legend or CARsgen economics equal OriCell economics.
sections:
- id: revenue-model-and-current-monetization
  title: Current monetization is financing-led, not product-led
  body: |-
    Public evidence shows OriCell as a clinical-stage biotech rather than as a revenue-generating commercial company. The company’s own press releases and third-party coverage frame the 2026 story around fundraising, platform development, global expansion, and pivotal clinical preparation—not around sales, reimbursement contracts, or recurring product income. That does not mean there is no eventual revenue model. It means the public revenue bridge is still future tense: clinical data supports regulatory progress, regulatory progress supports approval, approval supports pricing and reimbursement, and only then can treatment activity convert into recognized revenue. Until those steps occur, the cleanest public interpretation is that OriCell’s near-term cash inflows are financing proceeds and any non-disclosed partnership economics, not marketed therapy sales. Investors should be careful here because biotech narratives often feel commercially concrete long before they are financially
    concrete. OriCell’s financial quality today therefore depends more on how efficiently it turns capital into de-risking milestones than on any reported top-line performance.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  tableRefs:
  - TI001
  figureRefs:
