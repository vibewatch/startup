- id: capital-adequacy-and-financing-dependence
  title: The 2026 rounds improve adequacy, but financing dependence remains the core fact
  body: |-
    The most concrete financial evidence in 2026 is the capital raise sequence itself. OriCell announced a $70 million Series C1 initial close in January and a cumulative pre-IPO financing round above $110 million in April, with the company explicitly stating that proceeds would accelerate global clinical development, strengthen technology capabilities, and support capital-markets milestones. Independent coverage consistently portrays the April financing as a step toward IPO readiness rather than as the end of funding needs. That framing matters. In precommercial biotech, a large round usually reduces immediate solvency risk while leaving long-term dilution risk very much alive, especially when pivotal studies, U.S. expansion, and manufacturing scale-up are still ahead. The public gap is that OriCell never discloses cash on hand, monthly burn, or runway months. Without those numbers, investors can say the company is better funded than before, but they cannot responsibly claim that it is
    fully funded to approval. The next-round trigger is therefore likely milestone-dependent and market-window-dependent, not fully eliminated by the 2026 raise.
  claimRefs:
  - CI022
  - CI023
  - CI024
  - CI025
  - CI026
  - CI027
  - CI028
