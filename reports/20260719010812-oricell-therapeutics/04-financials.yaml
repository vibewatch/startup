  - - CARsgen (StockAnalysis)
    - ~HK$9.5B market cap and reported revenue line on July 17 2026 page
    - Shows that China-origin CAR-T companies can access public-market valuation frameworks before broad maturity
    - Third-party market data, not a full audited financial model
  - - CARsgen financial reports page
    - 2025 annual report and earlier reports publicly posted
    - Shows the reporting burden and investor expectations of a listed China-origin CAR-T peer
    - Does not provide OriCell-specific cost or runway data
  - - Legend / SEC filing portals
    - 20-F annual filing ecosystem exists for global cell-therapy peer
    - Shows that later-stage investors expect deep financial disclosure
    - Filing existence alone does not reveal OriCell economics
  - - BMS annual reports
    - Large-pharma annual-report infrastructure underpins approved cell-therapy commercialization
    - Highlights the scale gap between OriCell and established distributors
    - BMS is an incumbent partner/marketer, not a pure startup comp
  notes: Peer anchors contextualize category capital needs without pretending to solve OriCell’s private-model gap.
