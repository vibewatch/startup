company:
  name: OriCell Therapeutics
chapter:
  number: 5
  title: Product & Technology
  summary: OriCell’s product story is a platform-to-pipeline stack built around target discovery, CAR engineering for solid-tumor resilience, and rapid CMC execution. The company publicly frames OriAb as the discovery layer, OriCAR/OriArmoring as the construct-and-function layer, and OnGo rapid CMC as the manufacturing layer that translates concepts into clinic-ready autologous products. The two clearest delivered assets are Ori-C101 for GPC3-positive hepatocellular carcinoma and OriCAR-017 for relapsed/refractory multiple myeloma, with additional multi-specific and in vivo concepts extending the roadmap. Public technical proof is strongest where clinical data or regulatory milestones exist, and weakest where platform claims imply throughput, scalability, or safety advantages without full quantitative disclosure. The resulting product view is credible and differentiated, but still dependent on manufacturing execution, regulator acceptance, and a public patent/disclosure trail that is broader
    than one asset yet not fully legible from outside.
contentRequirements:
- Product/service definition in customer workflow terms.
- Module, SKU, asset, pipeline, facility, or product-line map.
- Architecture or operating model — software stack, hardware design, manufacturing, clinical mechanism, logistics, or service workflow.
- Deployment, integration, reliability, support, and roadmap.
- Differentiation — technology, IP, data, manufacturing know-how, supply access, brand, regulatory approvals, or operations.
- Trust, safety, security, privacy, compliance, and quality controls.
