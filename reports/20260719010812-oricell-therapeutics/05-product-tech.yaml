- id: customer-workflow-and-operating-model
  title: The operating workflow is an autologous cell-therapy loop with specialist-center dependencies
  body: |-
    In customer-workflow terms, OriCell’s technology is delivered through a specialized autologous cell-therapy pathway rather than through a simple drug-dispensing model. The workflow begins with specialist patient identification and trial eligibility, moves through cell collection and manufacturing, and ends with infusion plus post-treatment monitoring. That basic sequence is familiar across autologous CAR-T, but OriCell’s public differentiation claim is that its engineering and CMC layers improve what happens inside that sequence—target precision, resistance to hostile solid-tumor biology, and faster manufacturing readiness. The workflow is clearer for OriCAR-017 and Ori-C101 because both have public clinical or regulatory artifacts. It becomes more conceptual for multi-specific and in vivo programs, which remain earlier. Operationally, that means the product is inseparable from trial-site quality, manufacturing release discipline, and regulator-facing documentation. Any break in that
    chain can turn strong construct design into weak real-world delivery. The technology is therefore not only a receptor or antigen story; it is a workflow-execution story.
  claimRefs:
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  tableRefs:
  - TE002
  figureRefs:
