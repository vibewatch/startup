  title: The product is not just the receptor—it is the workflow plus CMC stack
  body: OriCell’s public differentiation claim depends as much on discovery and manufacturing execution as on antigen choice. That is why the technology should be underwritten as an operating system for autologous cell therapy, not as a single construct.
