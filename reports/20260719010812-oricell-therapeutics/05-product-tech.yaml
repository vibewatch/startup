evidenceStrategy:
- Use official OriCell pages and news items for the self-described platform stack, then pair them with clinical-trial, publication, and patent sources for technical grounding.
- Treat conference participation and practitioner-facing presentations as developer-signal proxies because OriCell has no public software repository or package ecosystem.
- Do not infer GMP scale, batch throughput, or manufacturing superiority beyond what the company and clinical disclosures actually support.
- Use public patent-assignment pages to test whether the technology narrative is broader than one lead asset.
qualityBar:
- Separate validated clinical/regulatory milestones from aspirational platform claims.
- Keep workflow figures specific to autologous cell therapy rather than generic drug development boxes.
- Every architecture or maturity claim should point to a concrete source or become an evidence gap.
- Surface missing quantitative quality metrics such as batch success, cycle time, and release analytics.
sections:
- id: platform-and-asset-map
  title: OriCell delivers a platform stack plus two clearly disclosed lead assets
  body: |-
    OriCell is not presenting itself as a one-product company. The official product and technology pages describe a layered product set in which discovery, engineering, and manufacturing infrastructure feed a pipeline of therapeutic assets. In practical terms, the delivered customer-facing products are still investigational therapies—most notably Ori-C101 in GPC3-positive hepatocellular carcinoma and OriCAR-017 in relapsed or refractory multiple myeloma. But those assets are framed as outputs of a broader system that includes antibody discovery, armored CAR design, and rapid CMC execution. That architecture matters because investors are being asked to evaluate not just whether one candidate works, but whether the company can repeatedly generate and manufacture differentiated cell-therapy programs. The public evidence supports that narrative directionally. It shows multiple platform names, multiple disclosed programs, and repeated conference or regulator-visible milestones. What it does not
    yet show in full is whether the platform converts into reproducible manufacturing speed, scalable quality, or superior commercial economics.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  tableRefs:
  - TE001
  figureRefs:
