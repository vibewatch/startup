summary:
  headline: >
    OriCell 是 2026 年更可信的中国源头临床阶段 CAR-T
    故事之一，融资势头真实，产品里程碑也有分量；但公开证据还不足以承销一个隐含独角兽估值，也不足以给出买入判断。正确姿态是继续研究：紧密跟踪公司，要求做到条款层面的尽调，并在披露价格的新一轮融资或更强证据点出现后重新介入。
