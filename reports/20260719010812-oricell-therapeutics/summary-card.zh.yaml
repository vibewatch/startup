  topStrengths:
    - Ori-C101 切入差异化实体瘤 CAR-T，公开证据已经包括人体疗效信号和 NMPA 放行的确证性 II 期路径。
    - 双管线能见度较高：OriCell 用 RRMM 中的 OriCAR-017 搭配 HCC 故事，拼出第二组监管和战略期权。
    - 2026 年融资势头有分量；1 月和 4 月两轮融资说明，在挑剔的生物科技市场里 OriCell 仍能吸引资本。
    - 公开市场和战略交易先例（CARsgen、Gracell）说明，中国源头细胞疗法资产可以跑出真实资本市场或 M&A 结果。
    - 管理层披露公开围绕创始人 Helen Yang 和 Peter He 展开，让公司在商业和科学两端都有可见的领导主线。
  topRisks:
    - 公开估值仍未披露，投资人无法判断当前入场价是有吸引力、合理，还是已经偏高。
    - 实体瘤 CAR-T 在生物学和运营上都难；Ori-C101 一次失望就可能压缩整个故事。
    - 核心承销输入仍是非公开信息：股权结构表、现金、烧钱、现金跑道、批次放行指标、周转时间和中心集中度。
    - 未来价值兑现仍要靠资本市场条件；2026 年环境已有改善，但资金仍挑项目，并偏向后期资产。
    - 如果新融资条款苛刻，上行空间可能被优先权结构吃掉，而不是留给新投资人。
  unresolvedGaps:
    - 2026 年 4 月后当前估值、股价，以及完整股权结构表 / 清算优先权结构。
    - 现金余额、月度烧钱，以及到下一个创造价值的临床里程碑前的现金跑道。
    - 生产放行率、重制频率、周转时间分布和产能假设。
    - 活跃中心集中度，以及研究者 / 客户证据是否足够广，能支撑规模化入组和最终上市准备。
    - 围绕 GPC3、GPRC5D、装甲化构建体和未来平台延展的实施自由度与 IP 重叠分析。
