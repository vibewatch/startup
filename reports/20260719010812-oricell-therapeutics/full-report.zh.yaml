      - number: '3.4'
        title: 切换成本来自临床和运营，但护城河还没有锁住
        blocks:
          - type: paragraph
            body: >-
              OriCell 仍处临床阶段，当前切换成本不是典型企业锁定效应。它们是临床和运营切换成本：BCMA
              之后医生信任哪个靶点，哪家医院能跑工作流，哪个申办方能供给名额，以及监管机构认可哪套数据。这会形成部分多归属，而不是赢者通吃。研究者可以随时间让患者入组多个产品，未来合作伙伴也可以押注不止一个平台。因此，OriCell
              的护城河论证建立在一个流动市场中的差异化上：装甲化实体瘤设计、中国优先的 HCC 注册切口、OriCAR-017
              的活跃美国路径，以及足以让从采血到回输执行可信的制造经验。但护城河的每个元素都可被挑战。竞争对手已经拥有获批标签、更宽的资产负债表或更深的渠道关系。即便在同行更少的 HCC，CARsgen 长期推进的 GPC3
              工作也让 OriCell 无法声称靶点独占。竞争结论正面但谨慎：OriCell 有差异化位置，不是一座持久堡垒。
