      - number: '2.2'
        title: HCC 负担、未满足需求与 Ori-C101 中国优先切口
        blocks:
          - type: paragraph
            body: >-
              HCC 机会有吸引力，因为疾病负担大，当前后线结局仍差。OriCell 产品页引用了 2020 年全球超过 900,000 例肝癌病例和超过 830,000 例死亡；2026 年 IARC
              更新仍把肝癌列为全球最常见、最致命的恶性肿瘤之一。同一个公司页面强调，中晚期 HCC 的标准全身治疗主要是减缓进展，客观缓解率通常不高于 15%。这一框架与 2026 年 ASCO Ori-C101
              更新一致，后者明确把公司数据与个位数到低十几个百分点的历史后线缓解率相比。但疾病负担不能和市场规模混为一谈。Ori-C101 当前开发目标不是所有 HCC，而是窄得多的一块：至少两线既往治疗后的 GPC3
              阳性晚期疾病，并走 NMPA 放行的中国优先注册路径。在公司披露合格患者分母和未来定价假设前，最稳妥的公开结论是：HCC 提供了巨大的未满足需求背景和一个可行的首发切口，而不是一个已经完成的 TAM 模型。
