      - number: '2.5'
        title: 增长驱动因素存在，但生物学和经济性仍压住采纳信心
        blocks:
          - type: paragraph
            body: >-
              市场逻辑确实有驱动因素。Ori-C101 现在在中国有注册路径，HCC 后线场景仍缺少强替代方案，CARsgen 的 2026 年获批也证明中国可以商业化实体瘤 CAR-T。与此同时，OriCAR-017
              受益于动态的 BCMA 后序贯故事，也受益于中国和美国都已经进入视野。但约束至少和驱动因素同样重要。Frontiers 的 HCC 综述和 2026 年 Springer 综述都强调，实体瘤对 CAR-T
              仍然困难，原因包括肿瘤浸润差、免疫抑制微环境、抗原异质性和 T 细胞耗竭。MedCity
              的融资报道抓住了现实后果：实体瘤仍是细胞治疗最难的前沿之一。经济性这侧，公开证据仍缺少价格、报销和患者分母假设。因此，正确的承保姿态是：OriCell
              面向的是巨大且临床重要的市场，但在管理层打开分母和定价栈前，公开市场模型仍受证据约束。
