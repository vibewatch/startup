      - number: '4.4'
        title: 2026 年融资改善了充足性，但融资依赖仍是核心事实
        blocks:
          - type: paragraph
            body: >-
              2026 年最具体的财务证据就是融资顺序本身。OriCell 1 月宣布 $70 million Series C1 首次交割，4 月宣布累计超过 $110 million 的 pre-IPO
              融资轮；公司明确表示，资金将用于加速全球临床开发、强化技术能力并支持资本市场里程碑。独立报道一贯把 4 月融资描绘为走向 IPO
              就绪的一步，而不是融资需求的终点。这个框架重要。在尚未商业化的生物科技公司里，大额融资通常会降低眼前偿付风险，但长期稀释风险仍然存在，尤其当关键研究、美国扩张和制造放大都还在前方。公开缺口在于，OriCell
              从未披露手头现金、月度烧钱速度或现金跑道月数。没有这些数字，投资者可以说公司比以前资金更充足，但不能负责任地声称它已经完整筹足到获批。下一轮触发因素因此很可能取决于里程碑和市场窗口，而不是被 2026
              年融资完全消除。
