  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 用序数热力图呈现 OriCell 当前风险最高的方向。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 实体瘤临床转化
          values:
            - 高
