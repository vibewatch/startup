      - number: '7.5'
        title: 缓释因素存在，但击穿条件很直接
        blocks:
          - type: paragraph
            body: >-
              公司确实有缓释证据。监管推进、反复会议露出、扩大的专利轨迹，以及 2026 年融资成功，都说明 OriCell
              不是一个无结构的科学项目。这些信号解释了为什么风险画像仍可投资，而不是直接排除。但击穿投资逻辑的触发点依然粗粝：Ori-C101 出现严重安全信号、无法在更正式场景复现疗效、OriCAR-017
              不能可信地扩展到美国可见的开发路径，或下一次创造价值的里程碑之前出现资本市场压力，都会实质性伤害投资理由。同样，任何直接针对公司主力构建体的可信 IP 争议，或快速 CMC
              叙事长期无法落地，都会迫使投资者重估护城河和估值。因此，这里的风险缓释不是泛泛监控，而是盯住少数高信息量指标。一旦这些指标走错方向，叙事挽救空间很小，因为公司仍处于商业化前，并由里程碑融资支撑。
