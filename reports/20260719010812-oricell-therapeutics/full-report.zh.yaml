      - number: '7.2'
        title: 运营风险集中在自体制造和质量执行
        blocks:
          - type: paragraph
            body: >-
              自体细胞疗法让运营风险和产品风险绑在一起。OriCell 的公开叙事靠快速 CMC、专科中心执行，以及把复杂细胞治疗流程转成可重复临床产出的能力支撑。因此，制造失败、放行延迟、vein-to-vein
              滑坡，或中心之间表现不一致，都可能同时伤害患者和估值。公开缺口在于，OriCell
              没有披露能让外部投资者判断风险是否在收缩的工业指标：批次放行率、重新制造频率、周转时间分布、规模产能和可比性控制全都缺位。结果就是，公司运营能力可能强于外界所见，但外界无法验证。运营上最危险的结果不是彻底崩盘，而是长期的局部表现不达标：入组、制造和质量都勉强够继续推进，却不足以支撑加速放大或有说服力的经济性。这类摩擦会悄悄摧毁融资杠杆。
