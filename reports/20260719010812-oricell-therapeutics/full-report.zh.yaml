            body: >-
              骨髓瘤图景要残酷得多。OriCAR-017 竞争的是一个后线场景，已经被 CARVYKTI、ABECMA 等获批 BCMA CAR-T 产品，以及 GPRC5D 双特异性药物 TALVEY 塑形。这意味着
              OriCell 不是在要求投资者凭空想象未来市场；它进入的是一个已有真实临床标准、真实安全性预期和真实渠道存量玩家的市场。机会仍然有意义，因为患者仍会复发，BCMA 暴露后的序贯治疗仍是活的商业问题，这也正是
              GPRC5D 重要的原因。但 OriCAR-017 不能仅凭存在就赢。要取代获批产品或与其并列，它必须在 BCMA 后人群中展示持久活性、可接受毒性，以及制造或可及性优势。这也是为什么多发性骨髓瘤项目可能比
              Ori-C101 带来更宽的全球选择权，同时又面对更小的容错空间。竞争对手资本更厚、已经嵌入商业体系，也已经在教育医生和患者理解后线细胞治疗。
