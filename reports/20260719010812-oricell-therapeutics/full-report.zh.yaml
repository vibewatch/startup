          description: 只有上市就绪证据更强之后才会出现
      edges:
        - from: present
          to: publish
          label: 支撑
        - from: publish
          to: reg
          label: 强化
        - from: reg
          to: sites
          label: 促成
        - from: sites
          to: payer
          label: 未来可能反哺
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU023
      - CU026
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: standard
    summary: 按项目或证据节点评估公开采用证据质量。
    data:
      columns:
