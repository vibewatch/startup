      - number: '1.2'
        title: 创始人、高管与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              领导层集中在两位已披露且画像互补的创始人身上。Helen Yang 是面向公众的商业负责人，列名为联合创始人、董事长兼 CEO；Peter He 是科学联合创始人兼
              CSO，背景在肿瘤免疫学。围绕二人，公司披露了一套对私营生物科技公司来说相对成熟的高管班底：Rick Xu 任 CMO，Iris Huang 任 CFO 兼幕僚长，Weidong Cui 任美国单元 CTO 兼
              GM。这些履历重要，因为它们解释了 OriCell 如何试图把科学、制造和融资连起来。Yang 过往曾带领上市公司完成 IPO；Huang 来自 J.P. Morgan 和 Bank of America
              Merrill Lynch 的投行业务；Cui 曾在 Fosun Kite 负责 Yescarta 在中国的技术转移和上市工作。科学顾问委员会名单中包括 Shaji Kumar 和 Kenneth
              Anderson，也增强了多发性骨髓瘤可信度。但依赖风险仍然实质存在：公司、科学和融资叙事都紧紧绑在 Yang 与 He 身上，公开记录没有披露独立董事会控制机制、投票权或继任计划。用尽调语言说，OriCell
              看起来是创始人塑形的公司，但已经不只是创始人单打独斗。
