      - number: '2.3'
        title: RRMM 负担与 OriCAR-017 的 BCMA 后利基
        blocks:
          - type: paragraph
            body: >-
              多发性骨髓瘤这侧机会更拥挤，但也更容易看清。OriCell 自己的产品页称，多数已治疗 MM 患者最终会复发并转为难治，这正是 RRMM
              市场在一轮轮疗法创新后仍然存在的核心原因。独立流行病学也支持底层患者池仍然可观：Global Cancer Observatory 多发性骨髓瘤事实表报告全球接近 200,000 例新发病例，American
              Cancer Society 估计仅 2026 年美国就有 36,000 例新发病例和 10,850 例死亡。OriCAR-017 并不试图服务全部疾病负担。试验登记和 POLARIS
              论文把该资产放在多线既往治疗后的后线人群中，OriCell 还强调部分已在 BCMA CAR-T 后复发的患者中观察到活性。这在战略上重要，因为 GPRC5D 正在变成的不只是另一个骨髓瘤靶点，而是在 BCMA
              暴露不断上升的市场中，一个后续或序贯靶点。与 HCC 相比，RRMM 的商业边界最终可能更宽、也更全球化，因为 OriCAR-017 已经同时具备中国和美国开发界面；但同样与 HCC
              相比，它面对的竞争格局也更拥挤、变化更快。
