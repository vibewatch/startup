      - number: '8.2'
        title: 可比背景和 2026 年市场窗口给出宽但有用的区间
        blocks:
          - type: paragraph
            body: >-
              最好的外部锚不是收入倍数，而是按阶段识别的参考类别。Legend 展示了已经活在公开市场里的细胞疗法公司的商业天花板；CARsgen 提供了更接近的中国起源披露和资本市场基准。Gracell 则补上战略 M&A
              先例：这个板块可以出现十亿美元级交易，但前提是资产组合和买方逻辑足够强。宏观条件同样重要。2026 年生物技术 IPO 窗口重新打开，H1
              发行显著改善，但多方资料都把市场描述为选择性开放，而不是无差别慷慨。二者合在一起，形成了很宽但并非无意义的区间。OriCell 明显高于普通种子阶段
              biotech，因为它有人体数据和监管牵引；但也仍明显低于已经放大的公开市场赢家，因为商业化、经济性和价格发现都缺席。市场窗口传递的信息偏建设性但有条件：比 2025 好，仍不会容忍披露不足的故事。
