  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 当前变现由融资驱动，不是产品驱动
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，OriCell 是一家临床阶段生物科技公司，而不是产生收入的商业化公司。公司自己的新闻稿和第三方报道把 2026
              年故事放在融资、平台开发、全球扩张和关键临床准备上，而不是销售、报销合同或经常性产品收入上。这不代表未来没有收入模型。它意味着公开收入桥仍是将来时：临床数据支撑监管进展，监管进展支撑获批，获批支撑定价和报销，随后治疗活动才能转化为确认收入。在这些步骤发生前，最干净的公开解读是，OriCell
              近期现金流入来自融资所得和任何未披露的合作经济利益，而不是已上市疗法销售。投资者需要小心，因为生物科技叙事常常在财务上变实之前很久，就让人感觉商业上已经具体。OriCell
              今天的财务质量因此更多取决于它把资本转化为去风险里程碑的效率，而不是任何已报告收入表现。
