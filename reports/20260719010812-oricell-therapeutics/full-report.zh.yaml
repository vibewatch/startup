      - number: '7.3'
        title: 法律和依赖风险更多由 IP 不确定性及交易对手塑造，而非可见诉讼
        blocks:
          - type: paragraph
            body: >-
              目前的公开法律图景，关键在于它显示了什么，也没有显示什么。公开专利表面说明 OriCell 在多个靶点和构建体上拓展 IP 足迹，包括 GPRC5D、CLDN18.2/MSLN、MSLN
              和双特异性抗体工作。这支撑了公司并非单一资产故事的说法。但公开转让页面无法解决自由实施、可执行性、地域覆盖，或与密集 CAR-T 和抗体 IP
              领域的重叠。换句话说，可见法律风险不是已知诉讼，而是战略价值可能跑得比可防御性更快。依赖风险会进一步放大。OriCell 依赖监管方、专科研究者、CMC
              执行和资本提供方；任何单一依赖未必会击穿公司，但任意两项同时出问题就可能击穿。因此，法律和合作伙伴清单应合在一起读。核心尽调问题是，随着项目推进到更高价值里程碑，OriCell
              的平台能否同时保持技术差异化和法律可用性。
