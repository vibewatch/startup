        - from: sites
          to: clinical
          label: 约束入组 / 执行
        - from: clinical
          to: finance
          label: 延后里程碑
        - from: adoption
          to: value
          label: 压缩商业逻辑
        - from: finance
          to: value
          label: 抬高稀释 / 压力
    claimRefs:
      - CR006
      - CR013
      - CR015
      - CR026
      - CR035
      - CR040
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 一旦失效会实质改变投资判断的关键对手方和系统。
    data:
      nodes:
        - id: nmpa
          label: NMPA
          description: 掌控 Ori-C101 在中国的推进
        - id: fda
          label: FDA
          description: 掌控美国可见的骨髓瘤路径
        - id: sites
          label: 专科中心
          description: 产出入组和执行证据
        - id: capital
          label: 资本提供方
          description: 资助持续烧钱和规模化
        - id: ip
          label: 专利 / 法律格局
          description: 塑造运营自由度和议价杠杆
        - id: cmc
          label: CMC 系统
          description: 制造试验材料
        - id: outcome
          label: 战略结果
          description: 审批、规模和估值
      edges:
        - from: nmpa
          to: outcome
          label: 允许中国推进
        - from: fda
          to: outcome
          label: 允许美国推进
        - from: sites
          to: outcome
          label: 提供证据
        - from: capital
          to: outcome
          label: 资助现金跑道
        - from: ip
          to: outcome
          label: 保护议价杠杆
        - from: cmc
          to: outcome
          label: 支撑交付
    claimRefs:
      - CR021
      - CR022
      - CR023
      - CR024
      - CR027
      - CR032
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 决策链从里程碑质量和市场准入出发，经过价格不透明，最终落到继续研究建议。
    data:
      nodes:
        - id: proof
          label: 里程碑证据
          description: Ori-C101 和 OriCAR-017 给出真实但仍不完整的降风险证据
        - id: capital
          label: 资本可得性
          description: 2026 融资显示公司仍能拿到资本，但没有披露当前价格
        - id: market
          label: 市场窗口
          description: IPO 窗口已有改善，但仍偏好后期阶段故事
        - id: opacity
          label: 价格不透明
          description: 未公开估值、股权结构表或现金跑道衔接
        - id: synthesis
          label: 综合判断
          description: 公司有前景，但投资入口披露不足
        - id: call
          label: 建议：继续研究
          description: 积极跟踪，并在条款出现或证据更强时重新接触
      edges:
        - from: proof
          to: synthesis
          label: 支撑上行
        - from: capital
          to: synthesis
          label: 支撑生存
        - from: market
          to: synthesis
          label: 支撑可选性
        - from: opacity
          to: synthesis
          label: 限制确信度
        - from: synthesis
          to: call
          label: 最终结果
    approximationNotes: 这条链是定性综合，不是数值模型。
    claimRefs:
      - CV027
      - CV028
      - CV035
      - CV038
      - CV039
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 示例性的企业价值敏感性显示，临床证据和融资质量会让投资判断产生多大摆动。
    data:
      items:
        - label: 困境条款 / 受挫
          value: 650
        - label: 披露不足的基准区间
          value: 1050
        - label: 证据增强 + 融资条款更干净
          value: 1350
        - label: 战略溢价结果
          value: 1700
    approximationNotes: 这些以百万美元计的数值仅为示意，由已留存可比样本和市场窗口证据综合得出；不是管理层指引。
    claimRefs:
      - CV020
      - CV031
      - CV032
      - CV033
  - id: FV003
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: OriCell 在科学可选性和融资动能上得分较好，但披露质量和当前投资测算清晰度偏弱。
    data:
      items:
        - label: 科学可选性
          value: 8
        - label: 临床证据成熟度
          value: 6
        - label: 资本可得性
          value: 7
        - label: 披露质量
          value: 3
        - label: 运营可见度
          value: 4
        - label: 退出准备度
          value: 5
        - label: 当前投资入口清晰度
          value: 3
    approximationNotes: 评分是作者基于公开证据综合得出的 0-10 序数尽调判断，不是公司披露的 KPI。
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
