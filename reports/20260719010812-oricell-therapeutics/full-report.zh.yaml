      - number: '5.3'
        title: 差异化来自靶点选择、装甲化和可见但不完整的 IP 线索
        blocks:
          - type: paragraph
            body: >-
              OriCell 的技术差异化主张主要有三块。第一，它借 OriAb 主张发现宽度，这是一个识别并优化肿瘤靶向结合分子的系统。第二，它借 OriCAR
              和装甲化语言主张功能差异化，目标是在恶劣肿瘤环境中提升活性。第三，它借快速 CMC 和制造经验主张运营差异化。公开里程碑支撑了这个故事的一部分：Ori-C101 有 II 期可见的 HCC 数据和确认性 II
              期放行；OriCAR-017 有 Fast Track 和美国研究能见度；公司也反复宣传多特异性和下一代概念。专利信号同样重要。公开专利权属页面显示，OriCell 关联的技术领域比单一 HCC
              资产更宽，支撑了平台资产组合的想法。不过，从外部看，IP 图景并不完整。公开权属页面本身不能解决自由实施权、权利要求宽度或可制造性问题。它们支撑可信度，但不能给出闭环结论。
