  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: OriCell 交付的是平台栈加两个披露清楚的领先资产
        blocks:
          - type: paragraph
            body: >-
              OriCell 并不是把自己包装成单产品公司。官方产品和技术页面描述的是一套分层产品组合：发现、工程和制造基础设施共同喂养治疗资产管线。落到客户可见的产品上，当前仍是研究性疗法，最典型的是用于 GPC3
              阳性肝细胞癌的 Ori-C101，以及用于复发或难治性多发性骨髓瘤的 OriCAR-017。但这些资产被放进一个更大的系统里，系统包括抗体发现、装甲化 CAR 设计和快速 CMC
              执行。这种架构重要，因为投资者被要求评估的不只是某一个候选药物能否奏效，还包括公司能否反复生成并制造差异化细胞治疗项目。公开证据在方向上支持这一叙事。它显示了多个平台名称、多个已披露项目，以及反复出现在会议或监管视野中的里程碑。但它还没有完整证明平台能否转化为可复现的制造速度、可规模化的质量，或更优的商业经济性。
