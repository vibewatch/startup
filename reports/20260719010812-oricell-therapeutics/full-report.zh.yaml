      - number: '8.4'
        title: 建议为继续研究，因为质量和价格支撑是两个问题
        blocks:
          - type: paragraph
            body: >-
              OriCell 可以是一家高质量公司，也仍然过不了当前承销测试。正向理由真实存在：差异化的实体瘤 CAR-T 抱负、可见的 RRMM 选项、可信的 2026
              年融资，以及足以维持公开市场和战略路径的里程碑势头。负向理由也同样真实：公开价格不透明、没有现金和现金跑道披露、股权结构表不透明、运营指标仍在私下，且板块仍更奖励后期证据而不是叙事。这些事实把建议从买入推向继续研究。问题不是
              OriCell
              没有前景，而是公开证据集还不足以让投资者有把握地把前景映射到现值。高风险评级也顺理成章，因为未来价值集中在少数里程碑里。同样，估值立场应保持未知。没有披露当前价格，就说股票或公司有吸引力或偏贵，等于假装知道市场并未真正揭示的东西。
            claimRefs:
