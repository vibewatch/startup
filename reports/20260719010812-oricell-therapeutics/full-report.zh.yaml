  productSummary: >
    OriCell 正在开发自体 CAR-T 细胞疗法及配套平台能力。当前最可见的领先资产是 Ori-C101，这是一款靶向 GPC3、用于晚期肝细胞癌的疗法；第二个关键资产是 OriCAR-017，这是一款靶向 GPRC5D、用于复发
    / 难治性多发性骨髓瘤的疗法。更大的平台叙事包括装甲化细胞治疗设计、制造 / CMC 执行，以及不止一个项目的管线。
  customerFocus: 晚期肝细胞癌和复发 / 难治性多发性骨髓瘤患者，主要由肿瘤专科研究者和细胞治疗中心触达。
  businessModel: 尚未商业化的生物科技公司，目前靠私募股权轮融资；未来价值预期来自临床去风险、潜在合作、战略退出或 IPO 融资，最终才进入疗法商业化。
