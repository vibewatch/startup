companyProfile:
  summary: >
    OriCell Therapeutics 是一家总部在上海的私营细胞治疗公司。公司称自己成立于 2015 年，已完成五轮私募融资，累计超过 US$300M。2026 年，公司的公开叙事明显变得更清晰：1 月披露 US$70M
    Series C1 首次交割，4 月披露累计超过 US$110M 的 pre-IPO 融资；同时，Ori-C101 在晚期肝细胞癌中推进至 NMPA 放行的确认性 II 期路径。OriCell 第二个可见核心项目
    OriCAR-017 靶向 GPRC5D，用于复发 / 难治性多发性骨髓瘤，并凭 Fast Track 和 RIGEL 研究获得美国监管能见度。公司的战略吸引力来自一件难事：试图解决异常棘手的实体瘤 CAR-T
    问题，同时保留血液肿瘤选择权。公开层面的短板是披露：估值、股权结构表、收入、单位经济和核心制造质量指标仍然不公开。
