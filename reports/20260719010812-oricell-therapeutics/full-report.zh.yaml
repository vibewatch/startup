      - number: '5.2'
        title: 运营工作流是自体细胞治疗闭环，依赖专科中心
        blocks:
          - type: paragraph
            body: >-
              从客户工作流看，OriCell 的技术不是简单发药模式，而是靠一条专门的自体细胞治疗路径交付。工作流从专科识别患者和确认试验资格开始，经过细胞采集和制造，最后到回输以及治疗后监测。这个基本顺序在自体 CAR-T
              中并不陌生，但 OriCell 的公开差异化主张是，它的工程和 CMC 层会改善这条顺序内部发生的事——靶点精确度、抵抗恶劣实体瘤生物学的能力，以及更快的制造准备。OriCAR-017 和 Ori-C101
              的工作流更清楚，因为二者都有公开临床或监管材料。多特异性和 in vivo
              项目仍更早期，工作流更概念化。运营上，这意味着产品离不开试验中心质量、制造放行纪律和面向监管的文件。链条中任何一处断裂，都可能把强构建设计变成弱现实交付。因此，技术不只是受体或抗原故事，也是工作流执行故事。
