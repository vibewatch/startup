      - number: '4.5'
        title: 财务结论：可融资、战略可信，但披露仍不足
        blocks:
          - type: paragraph
            body: >-
              公开财务结论有好有坏，但整体偏建设性。正面看，OriCell 在 2026
              年清楚证明了融资通道，吸引了可识别的投资者联盟，并说明了资金用途，且这些用途符合一家严肃临床阶段细胞治疗公司该投的方向。负面看，允许真正承保的证据——现金余额、季度烧钱速度、单位经济、定价、合作经济和债务义务——仍然缺席。这意味着公司还不能被评为拥有强收入质量或清晰利润率路径，因为没有收入可分析，也没有披露成本基底可对标。相反，投资者承保的是资本效率和未来选择权。现实含义是，OriCell
              更像一家里程碑融资的平台公司，而不是一个短期财务模型。任何建立在精确现金跑道或未来毛利率数学上的建议都会高估。克制的结论是，OriCell 可融资且战略可信，但对高置信度财务承保来说仍过于不透明。
