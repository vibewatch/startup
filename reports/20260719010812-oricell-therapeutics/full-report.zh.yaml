      - number: '1.5'
        title: 患者证据、风险框架与未解决披露缺口
        blocks:
          - type: paragraph
            body: >-
              作为私营生物科技公司，OriCell 发布了罕见直接的患者材料，包括 About
              页面上两位肝癌患者的具名证言，以及一个用通俗语言解释试验收益和风险的临床页面。这提升了一个尚未商业化企业的客户证据面：即使没有传统客户，患者、家属、医院和诊所也被当作当前利益相关方。同一个临床页面有价值，还因为它没有把风险粉饰掉；页面明确提醒参与者可能出现意外副作用、时间负担，以及疗法可能不如标准治疗有效。独立来源让这份谨慎更尖锐。MedCity
              把实体瘤称为细胞治疗最难的前沿之一；一篇 2026 年综述总结了肿瘤浸润、抗原异质性和 T 细胞耗竭等持续障碍。这些不是抽象的行业警告，而是 OriCell
              看似领先的里程碑仍可能无法转化为获批或持久商业边缘的核心技术原因。今天也无法做上市公司式承保，因为公司没有披露估值、股权结构表、所有权集中度、清算优先权、收入、年经常性收入（ARR）或精确员工数。投资者可以可信地说，公司真实、有融资、临床上有关联；但仅凭公开证据，还不能说公司已被充分定价或治理已充分透明。
