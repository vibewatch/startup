            body: >-
              中国细胞治疗生态让竞争分析不只是科学比拼。CARsgen、IASO/Innovent 和 Gracell
              都说明，中国源头开发者可以做出有意义的管线宽度，与大型医院合作，并在部分案例中走到获批、被收购或公开市场融资。这些例子重要，因为它们定义了研究者和后期投资者眼中的“可信”标准。OriCell 2026 年 4
              月融资和会议能见度表明，公司已经进入这个可信集合，但可信度不等于已经卡住渠道。已获批或接近获批的同行拥有更强的中心熟悉度、更大的安全性数据库，以及对未来合作伙伴或公开市场投资者更强的谈判力。对 OriCell
              来说，今天的渠道能力仍主要是关系型的：研究者网络、专科中心可及性、会议心智和资本市场准备度。这可以支持试验招募和融资，但仍弱于商业组织或已获批标签带来的特许权。换句话说，OriCell
