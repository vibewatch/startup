      - number: '1.3'
        title: 融资历史、投资者联盟与 IPO 姿态
        blocks:
          - type: paragraph
            body: >-
              OriCell 的资本历史足够证明它是一家严肃的后期私营公司，但还不足以完整承保估值。官方投资者页面给出最清楚的时间序列：2019 年由 Qiming Venture Partners 投资的 RMB 80
              million pre-A 轮；2020 年由 Yijing Capital 领投、约 RMB 202 million 的 Series A；2022 年 $120 million Series B；2023 年
              $45 million Series B1；随后是 2026 年的融资活动。2026 年 1 月，Series C1 首次交割 $70 million；2026 年 4 月，累计 pre-IPO 融资超过
              $110 million。由于 4 月公告明确写的是累计交割，保守做法是不把 1 月和 4 月数字机械相加，除非管理层展示最终轮次口径。因此，官方投资者页面的概括——五轮融资超过 $300
              million——仍是最安全的公开承保锚点；更高总额在方向上可行，但仅凭留存来源还不能完全证明。已经能证明的是投资者联盟质量和意图。2026 年融资名单包括 Vivo Capital、Beijing
              Medical and Health Care Industry Investment Fund、Qiming、主权财富资本和其他医疗健康专业投资者，独立报道也明确把本轮融资描述为 pre-IPO
              步骤。因此，OriCell 的资本结构像一家准备冲击公开市场的公司，尽管公开记录仍未给出那次尝试可能对应的价格。
