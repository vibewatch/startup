              从早期临床证据走向更正式的注册路径，并拿到 ASCO 口头报告席位，这意味着数据成熟度和研究者背书同时存在。RRMM 路径类似但更分散：POLARIS 发表、登记能见度、美国 RIGEL 研究界面和 FDA
              Fast
