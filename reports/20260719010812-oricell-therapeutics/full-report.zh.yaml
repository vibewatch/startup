  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：两条临床切口，不是一个泛化的细胞治疗 TAM
        blocks:
          - type: paragraph
            body: >-
              定义 OriCell 市场，最干净的方式不是抽象地说“细胞治疗”，而是看两条具体临床切口，它们只是恰好坐在同一个平台基础上。第一条切口是标准全身疗法失败后，用靶向 GPC3 的自体 CAR-T
              治疗晚期肝细胞癌。第二条是多线既往治疗后，用靶向 GPRC5D 的 CAR-T 治疗复发或难治性多发性骨髓瘤，部分病例还包括接受过 BCMA 靶向治疗的患者。这一点重要，因为宽泛的 CAR-T 市场标题或全肿瘤
              TAM 会掩盖基础设施和患者资格现实，而这些现实决定 OriCell
              能否真正把科学成果变现。今天，公司并不是在争夺全部肝癌或骨髓瘤支出；它争夺的是能运行细胞治疗工作流的医院里、接受后线治疗的专科患者。这条边界排除了大多数更早线疾病、缺少高级细胞治疗能力的社区场景，以及除竞争替代品以外的非细胞疗法。它也意味着，公司短期最有形的商业化路径比科学野心更窄。
