  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和临床风险仍是投资逻辑的生死线
        blocks:
          - type: paragraph
            body: >-
              OriCell 最严重的风险仍在临床和监管。Ori-C101 获批确证性 II 期是正面里程碑，但也把赌注抬高：公司正从早期信号叙事，进入疗效持久性、试验设计和安全性一致性更关键的阶段。OriCAR-017 的
              Fast Track 和美国研究可见度，在骨髓瘤上也起到类似作用。它们降低了市场对平台的怀疑，同时提高了失败成本。核心临床风险在于，实体瘤 CAR-T
              仍是肿瘤学里最难的品类之一；浸润、抗原异质性和免疫抑制微环境，都可能在早期反应看起来不错之后侵蚀疗效。第二个风险是，早期研究者发起的证据未必能干净地放大到更正式的多中心环境。监管可见度因此能降低可行性风险，却不能消除获批风险。对投资者来说，下一批重大数据更新不是增量观感，而是决定
              OriCell 留在注册路径上，还是回到更漫长、更稀释的开发周期里的主要决策点。
