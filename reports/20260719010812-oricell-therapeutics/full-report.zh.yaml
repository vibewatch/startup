  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前融资背景证明势头，但不证明价格
        blocks:
          - type: paragraph
            body: >-
              OriCell 的 2026 年融资序列，是公众视野里唯一硬性的当前估值证据，但仍不完整。公司 1 月完成 US$70 million Series C1 首关，4 月累计 Pre-IPO 融资超过 US$110
              million，清楚证明了募资势头。独立报道还把 4 月融资与 IPO
              准备联系起来，这一点重要，因为它暗示公司有资本市场野心，而不只是修补资产负债表。但公开文件离投资者承销价格所需的信息还差很远。它们没有披露投后估值、股数、优先权条款，也没有给出现金和现金跑道桥接。这个缺口具有决定性。正确输入不是「OriCell
              至少值 X，因为聪明钱投了」，而是「OriCell 确实有融资渠道，但当前股权价格仍不透明」。在估值章节里，拿得到钱是支持性证据；它不等于披露价格支撑。
            claimRefs:
              - CV001
              - CV002
              - CV003
