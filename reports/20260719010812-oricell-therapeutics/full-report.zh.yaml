      - number: '2.4'
        title: 试验阶段的买方、用户、支付方与采纳路径
        blocks:
          - type: paragraph
            body: >-
              当前阶段，真正的买方不是支付方，而是临床试验系统。对 Ori-C101 来说，决定性用户是肝癌专科研究者、肝胆肿瘤团队，以及能处理复杂自体细胞治疗物流的三级医院。对 OriCAR-017
              来说，对应中心是高级血液科和具备移植能力的机构。在两个项目中，眼前支付方本质上都是申办方出资的临床试验预算，而不是成熟报销渠道。这一区分很关键，因为它意味着医院愿不愿意筛查、制造、回输和随访患者，才是当前采纳瓶颈，而不是广泛纳入处方目录。NCI
              RIGEL 页面和中国登记信息合在一起显示，OriCell
              已经在搭建这些专科中心网络，但它们还没有证明公司已具备规模化商业交付版图。因此，最可能的采纳顺序是：试验入组，安全性和有效性读出，监管进展，先在少数高能力中心上市，再逐步扩展到更广泛的医院和支付路径。任何跳过这些基础设施步骤的自上而下收入模型都会高估。
