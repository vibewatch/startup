        - 示意性 EV 高于 US$1.25B，并可能进入 US$1B 高位区间
        - 需要新证据，而不只是当前势头
      - - 基准
        - 项目推进但没有决定性跃迁，市场仍然选择性出手
        - 示意性 EV 约 US$850M-US$1.25B，上行空间取决于结构
