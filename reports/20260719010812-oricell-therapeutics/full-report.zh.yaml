      - number: '8.5'
        title: 剩余尽调路径很短，但后果很重
        blocks:
          - type: paragraph
            body: >-
              OriCell 案例里令人鼓舞的一点，是最高价值的剩余问题已经可识别。投资者不需要再找一百个来源，而是需要少数缺失数字和文件。第一是 2026 年 4
              月之后的股权结构表和现金跑道桥接，因为它决定未来上行是归属新钱，还是被压在优先权层下面。第二是制造质量证据——放行率、周转时间、重新制造频率和中心集中度——因为细胞疗法故事在临床上可以看起来可信，运营上却仍很脆弱。第三是明确监控击穿投资逻辑的触发点。安全信号、确证性执行失败或困境融资，会迅速压缩公允价值；披露带价格轮次或强于预期的数据包，则可能支撑重估。正因为这种不对称，正确的近期姿态不是被动等待，而是带着明确再接触条件主动跟踪。
