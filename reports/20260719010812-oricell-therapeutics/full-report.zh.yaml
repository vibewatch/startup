      - number: '1.4'
        title: 领先项目与里程碑质量
        blocks:
          - type: paragraph
            body: >-
              OriCell 的里程碑质量在它停止描述野心、开始给出试验阶段证据时最强。领先的实体瘤项目 Ori-C101 是一款靶向 GPC3、用于晚期肝细胞癌的自体 CAR-T。公司和 ASCO
              相关材料称，该项目完成了早期 IIT 和 IND 工作，在 HCC 后线、推荐 II 期剂量下取得 66.7% 的客观缓解率，并于 2026 年 6 月获得 NMPA 放行，进入确认性随机 II
              期注册研究。临床信号叠加注册路径监管事件，这个组合在实体瘤 CAR-T 中稀缺到足以重要。血液肿瘤资产 OriCAR-017 在市场类别上没那么新，但已发表证据质量更高：POLARIS phase 1 研究发表于
              The Lancet Haematology，公司还称该资产拥有美国孤儿药、IND 和 Fast Track 资格。两个资产合在一起，解释了为什么投资者继续给平台供血。OriCell
              不只是技术故事；它有一个在中国带注册意图的实体瘤项目，也有一个具备同行评议人体首次数据和美国监管牵引的多发性骨髓瘤资产。话虽如此，二者仍未获批，公司价值仍靠临床执行传导，而不是靠经常性现金流。
