  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 当前客户其实是患者、研究者和专科中心
        blocks:
          - type: paragraph
            body: >-
              对临床阶段细胞治疗公司来说，“客户”最干净的定义，比商业化生物制药或 SaaS 公司更窄、更偏运营。OriCell
              当前用户是入组患者，以及选择筛查、采集、回输并监测他们的研究者。当前支付方主要是申办方出资的试验预算和支撑资本，而不是报销型保险方。当前采纳界面因此是专科中心网络。这很重要，因为很多常见客户指标——客户
              logo、席位数、续费率、企业扩张——还没有以有意义的形式出现。已经存在的是中心愿意运行工作流，研究者愿意公开展示数据。Ori-C101 拥有最清楚的当前客户证据，因为 HCC 项目有与 Zhongshan
              Hospital 和 ASCO 2026 绑定的具名研究者能见度。OriCAR-017 的证据集更宽，但离消费者更远，来自论文、登记信息和美国可见的 RIGEL
              路径。公开层面看，这些是早期但真实的采纳信号；它们只是还不是商业账户指标。
