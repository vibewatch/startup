  - id: TV005
    title: 投资逻辑破坏与止损触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - Ori-C101 安全性或疗效不及预期
        - 重大安全性信号、确证执行偏弱，或后期数据不可复现
        - 伤害核心实体瘤切入点，并压缩战略可选性
        - 转为回避 / 下调估值区间
      - - OriCAR-017 失去可见美国动能
        - 研究牵引延迟或监管姿态转弱
        - 降低跨境可选性和血液肿瘤后备价值
        - 大幅削减乐观情景权重
      - - 困境融资或严苛条款
        - 下行轮、沉重优先权，或披露现金跑道偏短
        - 把上行空间从新投资者手中转走，并抬高资不抵债风险
        - 要求结构保护，否则退出
      - - 生产脆弱性显现
        - 放行率差、周转时间长，或中心依赖集中
        - 削弱从科学到规模化的运营桥梁
        - 下调基准情景区间并延长尽调
      - - 证据成熟前 IPO / 退出窗口关闭
        - 尽管有进展，仍没有可信的公开上市或战略路径
        - 减少变现选择和定价杠杆
        - 优先放入观察清单，而不是主动承销
    notes: 止损触发项刻意设得具体，因为 OriCell 的价值仍集中在里程碑上。
