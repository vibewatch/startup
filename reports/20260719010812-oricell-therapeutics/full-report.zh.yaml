      - number: '7.4'
        title: 融资、客户集中度和执行领导力仍紧密耦合
        blocks:
          - type: paragraph
            body: >-
              OriCell
              的财务风险和客户风险相互挂钩，因为二者都由里程碑集中度驱动。公司仍缺少公开现金、烧钱速度和现金跑道数据，未来融资风险无法与试验结果干净切开。同时，当前客户证据严重依赖少数专科研究者、中心和点名研究，而不是广泛商业足迹。资本获取和采用证据因此都异常集中在未来几个里程碑上。人事风险也嵌在同一结构里。OriCell
              的公开身份高度绑定少数创始人和科学负责人，而中美路径的跨境执行又抬高了协调要求。如果领导层、中心执行和融资准备保持一致，公司还能继续压缩风险；如果三者分叉，看似温和的问题——入组缓慢、制造放大延迟、与公开市场投资者沟通不均——都可能快速叠加。对投资者来说，这不是背景噪音，而是一条从执行摩擦传导到稀释和战略选择权损失的实时通道。
