chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立与运营版图
        blocks:
          - type: paragraph
            body: >-
              2026 年，OriCell Therapeutics 对外呈现为一家立足中国的临床阶段生物科技公司，核心围绕下一代 CAR-T 和配套细胞治疗平台。最稳妥的成立时间锚点来自公司自己的 About
              页面：OriCell 成立于 2015 年。同一个官方页面把使命写得相当务实，不只追求科学新颖性，还强调开发有效、可及的免疫疗法，延长患者生命。联系页面显示，公司已经不再只是一个上海实验室。OriCell
              公开列出上海、北京、New Jersey 的 Roseland 和香港实体，合在一起指向一种为中国大陆临床执行、美国开发，以及未来跨境资本市场或合作活动搭建的结构。官网和产品页呈现两条临床切口：以肝细胞癌
              Ori-C101 为代表的实体瘤，以及以复发或难治性多发性骨髓瘤 OriCAR-017 为代表的血液肿瘤。即便暂不判断商业质量，公司概况层面的结论也很明确：OriCell
              已不再是种子阶段的平台故事，而是一家后期私营、多实体的临床公司；组织已经铺开到一定程度，投资者必须明确尽调治理、控制权和跨境执行。
