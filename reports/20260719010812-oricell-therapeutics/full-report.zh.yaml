              OriCell 的信任故事不是建立在公开质量认证或公开状态仪表盘上，而是建立在临床进展、研究者能见度和监管互动上。Ori-C101 获得 NMPA 确认性 II
              期放行，是最强的单一信任信号，因为它说明监管机构接受了项目包，可以进入更正式的注册场景。OriCAR-017 的 FDA Fast Track 和美国 RIGEL
              研究能见度，对骨髓瘤项目起到类似作用。ASCO、ASH、Morgan Stanley 和 Evercore
              等会议活动增加了临床从业者和资本市场能见度，这有帮助，但不等于产品可靠性指标。缺口在量化质量数据。公开来源没有披露批次放行率、制造周转分布、超规格频率或商业规模产能。因此，投资者有足够证据相信公司能在临床上推进项目，但还不足以认定制造系统已经是成熟、可重复的质量引擎。
