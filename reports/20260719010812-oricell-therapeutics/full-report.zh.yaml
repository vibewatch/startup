  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接 HCC 与实体瘤同行不多，但标杆已经很高
        blocks:
          - type: paragraph
            body: >-
              在肝癌中，OriCell 最直接的公开比较对象不是一个全球获批产品，而是少数已经让 GPC3 或相邻实体瘤 CAR-T 策略在人类数据中变得可读的开发者。CARsgen 是最清楚的中国参照物，因为它公开披露了一个
              GPC3 肝细胞癌项目，完成了更早的中国 I 期研究，并持续投入实体瘤和 in vivo CAR-T。Eureka 是有用的相邻参照，因为它同样突出肝癌项目和更宽的细胞内靶向平台。战略含义是，OriCell
              不需要从零证明 GPC3 是值得投资的抗原；它需要证明自己的装甲化工程和临床执行，能在疗效持久性和运营可行性上跑赢相邻尝试。与骨髓瘤相比，竞争场仍然稀薄，但稀薄不等于容易。实体瘤 CAR-T
              仍有生物学难度，所以任何保持融资并临床活跃的可信同行，都会抬高 Ori-C101 的门槛，而不是证明一个空白市场已经无人争夺。
