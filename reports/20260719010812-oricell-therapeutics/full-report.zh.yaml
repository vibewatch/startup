      - number: '8.3'
        title: 情景区间比点估值更重要
        blocks:
          - type: paragraph
            body: >-
              OriCell 没有公开的带价格标记，情景思维比虚假的精确更诚实。基准情景是，公司应落在一个宽泛的、低于 Legend 的区间里，中心更接近 Gracell/CARsgen
              区域：它不是陷入困境的科学项目，但也还不是公开市场支撑的数十亿美元商业化平台。这个基准区间假设当前势头延续，但没有决定性新证据。乐观情景需要的不只是热情，而是 Ori-C101 确证性执行、OriCAR-017
              持续获得美国可见度，以及融资或退出市场愿意奖励一个已降险的中国起源细胞疗法平台。悲观情景不需要全面失败；在披露很薄时，局部运营或融资滑坡就可能足够。退出逻辑也一样。证据增强，IPO
              或战略出售就有可能；证据停滞，公司就会被轮次条款绑架，而不是由内在现金流价值定价。因此，估值纪律必须用区间、触发条件和结构来表达，而不是单靠对科学的欣赏。
