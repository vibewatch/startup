      - CV037
      - CV039
      - CV043
      - CV044
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构表和优先权
        - 2026 年 4 月后的持股、股份类别、清算优先权、反稀释
        - 决定合理企业价值能否转化为可投资的股权价值
        - 索取融资文件和股权结构表
      - - 现金 / 烧钱速度 / 现金跑道
        - 当前现金余额、月度烧钱速度、通往下个里程碑的现金跑道桥
        - 区分势头和偿付风险
        - 索取 CFO 或投资人材料
      - - 生产质量
        - 放行率、重制率、周转时间分布、产能假设
        - 显示临床证据能否在运营上规模化
        - 索取 CMC 仪表盘或尽调备忘录
      - - 中心集中度
        - 活跃中心地图、研究者依赖和地域组合
        - 检验采用证据是否足够分散，支撑规模化
        - 梳理 BEACON、RIGEL 和未来中心
      - - IP / FTO
        - 权利要求图表、授权权利、围绕 GPC3/GPRC5D/武装化的重叠分析
        - 如果 FTO 偏弱，估值可能跑在防御性前面
        - 获取 IP 律师备忘录和专利格局审查
      - - 退出准备度
        - IPO 工作流状态、投行、审计准备度或战略买家主动兴趣
        - 让退出时间和估值兑现概率更可判断
        - 审查董事会材料或投行演示稿
    notes: 这是最小缺失输入集合，最快能把 OriCell 从“有意思”推进到“可承销”。
    claimRefs:
      - CV027
      - CV029
      - CV041
      - CV042
  - id: TV007
    title: 退出准备度和路径表
    columns:
      - 路径
      - 当前支撑
      - 仍需发生什么
      - 当前判断
    rows:
      - - 公开上市 / IPO
        - 2026 年 4 月融资被定位为 IPO 前；2026 年上半年生物科技 IPO 窗口改善
        - 需要有价格的估值支撑、更强的里程碑组合和更清晰披露
        - 有可能，但还不到高置信承销的程度
      - - 战略出售
        - Gracell 显示战略买家对中国背景细胞疗法资产有胃口
        - 需要足够强的差异化证据，激发买家竞争
        - 若数据保持强劲，中期可行
      - - 继续私有并再次融资
        - 已知投资人渠道和持续可用的私募资本
        - 需要可接受条款，并把现金跑道延伸到下个证据点
        - 短期最可能路径
      - - 独立现金流自给
        - 目前没有公开证据
        - 需要获批、定价和商业化执行
        - 不是短期估值基础
    notes: 退出准备度好于 2025 年，因为市场已经回暖；但兑现仍取决于证据和披露。
    claimRefs:
      - CV003
      - CV021
      - CV024
      - CV025
      - CV026
      - CV037
