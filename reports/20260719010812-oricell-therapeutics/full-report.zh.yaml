  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 核心技术和运营风险如何传导到融资、采用和估值。
    data:
      nodes:
        - id: clinical
          label: 临床转化风险
          description: 早期疗效可能无法在正式场景中延续
        - id: cmc
          label: CMC / 制造风险
          description: 放行或规模化失败会拖慢执行
        - id: sites
          label: 中心集中风险
          description: 少数关键中心承担证据压力
        - id: finance
          label: 融资风险
          description: 里程碑延迟会抬高稀释风险
        - id: adoption
          label: 采用 / 客户风险
          description: 证据偏弱会拖慢未来中心和支付方转化
        - id: value
          label: 估值压缩
          description: 护城河和上行假设被下调
      edges:
