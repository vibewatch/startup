company:
  name: OriCell Therapeutics
chapter:
  number: 7
  title: Risks
  summary: 'OriCell’s risk profile is dominated by clinical translation, manufacturing execution, and financing dependence rather than by mature-company issues such as churn or margin compression. The top risks are not subtle: solid-tumor CAR-T remains biologically hard, autologous cell-therapy operations can fail at manufacturing or site-execution bottlenecks, and the company still needs future capital-market access unless programs de-risk rapidly. Legal risk is not currently defined by visible public litigation, but by freedom-to-operate and IP-breadth uncertainty across multiple disclosed patent families. Regulatory milestones in China and the U.S. mitigate some of these concerns, yet they do not eliminate them; they simply move the company into a more consequential proving ground. The right risk view is therefore severity-ranked and milestone-linked: OriCell is investable only if upcoming proof points keep shrinking a small set of very large risks.'
contentRequirements:
- Severity-ranked risks with likelihood, impact, mitigation maturity, residual exposure, and investment implication.
- Regulatory/legal risk — licenses, approvals, litigation, enforcement, IP, privacy, environmental/safety.
- Operational risk — supply chain, manufacturing, logistics, reliability, outages, recalls, safety, facilities, labor.
- Partner/dependency risk — supplier, distributor, cloud/platform, capital provider, regulator, key customer concentration.
- Financial/model risk — burn, capital intensity, credit/loss exposure, fraud, working capital, margin compression.
- Mitigations, monitoring indicators, thesis-break triggers, and diligence asks.
