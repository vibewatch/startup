  claims:
  - id: CR001
    statement: Ori-C101’s confirmatory phase II clearance reduces feasibility risk but increases the damage if later data disappoint.
    type: inferred
    topic: regulatory risk
    sourceRefs:
    - SR001
    - SR002
    - SR011
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR001
    - QR003
  - id: CR002
    statement: OriCAR-017’s Fast Track and U.S. study visibility similarly raise strategic expectations without eliminating approval risk.
    type: inferred
    topic: regulatory risk
    sourceRefs:
    - SR003
    - SR007
    - SR009
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR002
    - QR004
  - id: CR003
    statement: The next HCC and RRMM data updates therefore function as major risk-compression or risk-expansion events rather than as routine news flow.
    type: inferred
    topic: regulatory risk
    sourceRefs:
    - SR001
    - SR003
    - SR014
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR001
    - QR002
  - id: CR004
    statement: Solid-tumor CAR-T remains a difficult technical category because hostile tumor microenvironments and durability problems continue to matter in HCC.
    type: third-party-reported
    topic: clinical risk
    sourceRefs:
    - SR012
    - SR013
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR005
  - id: CR005
    statement: That biology keeps Ori-C101’s clinical translation risk elevated even after strong early response signals.
    type: inferred
    topic: clinical risk
    sourceRefs:
    - SR002
    - SR011
    - SR012
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR005
    - QR006
  - id: CR006
    statement: A key risk is that early investigator-driven proof fails to replicate cleanly in broader or more formal studies.
    type: inferred
    topic: clinical risk
    sourceRefs:
    - SR001
    - SR011
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR006
  - id: CR007
    statement: Public sources do not disclose enough control-arm, batch, or site-performance detail to rule out execution-driven performance regression.
    type: inferred
    topic: clinical risk
    sourceRefs:
    - SR001
    - SR005
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR006
  - id: CR008
    statement: Regulatory progress mitigates skepticism about program seriousness but not the risk of later-stage failure.
    type: inferred
    topic: regulatory risk
    sourceRefs:
    - SR001
    - SR003
    - SR007
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR003
    - QR004
  - id: CR009
    statement: Autologous manufacturing and release discipline are core operational risks because the therapy cannot be separated from its CMC workflow.
    type: inferred
    topic: operational risk
    sourceRefs:
    - SR005
    - SR006
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR007
  - id: CR010
    statement: The public record does not disclose batch-release rate, manufacturing turnaround, remanufacture frequency, or scale capacity.
    type: inferred
    topic: operational risk
    sourceRefs:
    - SR005
    - SR006
    - SR014
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR008
  - id: CR011
    statement: That gap leaves outside investors unable to tell whether the rapid-CMC narrative is already an operating fact or mostly a strategic claim.
    type: inferred
    topic: operational risk
    sourceRefs:
    - SR006
    - SR014
    - SR028
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR008
    - QR009
  - id: CR012
    statement: The most dangerous operational outcome may be chronic underperformance—slow enrollment, partial delays, inconsistent release—rather than an obvious single failure.
    type: inferred
    topic: operational risk
    sourceRefs:
    - SR014
    - SR015
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR010
  - id: CR013
    statement: CMC or site friction can also contaminate clinical readouts by making proof look weaker or less scalable than the construct itself deserves.
    type: inferred
    topic: operational risk
    sourceRefs:
    - SR005
    - SR007
    - SR014
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR007
    - QR010
  - id: CR014
    statement: Public manufacturing risk is therefore both an operational and valuation problem.
    type: inferred
    topic: operational risk
    sourceRefs:
    - SR014
    - SR016
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR009
    - QR010
  - id: CR015
    statement: Because customer proof is concentrated in trial sites, operational slippage at a few centers could damage both adoption proof and financing leverage at once.
    type: inferred
    topic: dependency risk
    sourceRefs:
    - SR007
    - SR008
    - SR010
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR015
    - QR016
  - id: CR016
    statement: The visible patent estate shows OriCell is building claims around more than one target or construct family.
    type: third-party-reported
    topic: legal risk
    sourceRefs:
    - SR017
    - SR018
    - SR019
    - SR020
    - SR027
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR011
  - id: CR017
    statement: That breadth supports platform credibility but also increases the surface area for future freedom-to-operate disputes.
    type: inferred
    topic: legal risk
    sourceRefs:
    - SR017
    - SR019
    - SR020
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR011
    - QR012
  - id: CR018
    statement: Public patent pages do not reveal claim-chart overlap, licensed rights, or strategic encumbrances, so they cannot close legal diligence.
    type: inferred
    topic: legal risk
    sourceRefs:
    - SR017
    - SR018
    - SR019
    - SR020
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR012
  - id: CR019
    statement: No major public litigation involving OriCell was identified in the retained sources as of July 2026.
    type: inferred
    topic: legal risk
    sourceRefs:
    - SR021
    - SR022
    - SR023
    - SR024
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR013
    - QR026
  - id: CR020
    statement: Investors should treat that absence as a current observation, not as proof that IP risk is immaterial.
    type: inferred
    topic: legal risk
    sourceRefs:
    - SR021
    - SR022
    - SR023
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR013
    - QR026
  - id: CR021
    statement: The main counterparty dependencies are regulators, specialist centers, capital providers, manufacturing execution, and the legal/IP landscape.
    type: inferred
    topic: dependency risk
    sourceRefs:
    - SR001
    - SR007
    - SR014
    - SR027
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR015
  - id: CR022
    statement: Specialist-center dependency is high because current proof and future expansion both rely on a relatively small set of high-capability sites.
    type: inferred
    topic: dependency risk
    sourceRefs:
    - SR007
    - SR008
    - SR010
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR016
  - id: CR023
    statement: Capital-provider dependency remains high because OriCell still lacks public revenue, cash, burn, and runway metrics.
    type: inferred
    topic: financial risk
    sourceRefs:
    - SR014
    - SR015
    - SR016
    - SR029
    - SR030
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR017
    - QR018
  - id: CR024
    statement: A closed or hostile capital-market window before the next major milestone would materially weaken OriCell’s strategic flexibility.
    type: inferred
    topic: financial risk
    sourceRefs:
    - SR014
    - SR015
    - SR025
    - SR026
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR017
    - QR023
  - id: CR025
    statement: People risk matters because a small number of leaders carry scientific, strategic, and capital-markets credibility simultaneously.
    type: inferred
    topic: people risk
    sourceRefs:
    - SR025
    - SR026
    - SR028
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR019
  - id: CR026
    statement: Cross-border execution across China and U.S. pathways raises coordination risk even if both programs remain scientifically credible.
    type: inferred
    topic: people risk
    sourceRefs:
    - SR003
    - SR007
    - SR028
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR019
    - QR020
  - id: CR027
    statement: Public cash opacity magnifies model risk because it prevents investors from sizing runway against the upcoming milestone calendar.
    type: inferred
    topic: financial risk
    sourceRefs:
    - SR014
    - SR016
    - SR030
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR018
    - QR029
  - id: CR028
    statement: Capital-market visibility at Morgan Stanley and Evercore mitigates some execution risk by showing investor-readiness work, but it does not offset missing balance-sheet detail.
    type: inferred
    topic: people risk
    sourceRefs:
    - SR025
    - SR026
