- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - More specialist HCC centers after stronger data
    - Overreliance on a few flagship liver-cancer centers
    - Slow expansion and fragile recruitment
    - Request active-site map and top-center share of patients
  - - Broader RRMM site footprint in China and U.S.
    - Dependence on a small number of high-capability hematology sites
    - Limits external validity and scale
    - Request enrollment by country, center, and investigator
  - - Post-BCMA clinical relevance
    - Dependence on a narrow late-line sequencing niche
    - Commercial ceiling could remain small
    - Request subgroup volumes and referral patterns
  - - Payer conversion after approval
    - Procurement and reimbursement friction
    - Clinical proof may not translate into paid adoption
    - Request payer-advisory and launch-readiness plans
  notes: Early cell-therapy companies often look less diversified than they appear because a few sites carry most of the proof burden.
  claimRefs:
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
- id: TU006
  title: Customer-proof gaps table
  columns:
  - Gap
  - Why it matters
  - Exact diligence path
  rows:
  - - Active-site count by program
    - Without it, customer concentration cannot be quantified
    - Request current active-site roster and enrollment status
  - - Patients screened vs treated
    - Without it, adoption-funnel efficiency is unknowable
    - Request screen-failure and dropout rates
  - - Repeat center participation
    - Without it, investigator stickiness is only inferred
    - Request center-level repeat enrollment data
  - - Payer or hospital commercialization prep
    - Without it, future buyer conversion is speculative
    - Request pre-launch payer and hospital engagement work
  - - Patient follow-up durability metrics
    - Without it, retention-quality proxies remain weak
    - Request long-term follow-up completion rates and PROs
  notes: These are the minimum customer metrics required to move from trial-proof to adoption-underwriting.
