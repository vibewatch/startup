  requirement: Time-series retention only — columns are time buckets (e.g. month-1/3/6 or year-1/2) and cell values are retention percentages 0–100.
evidenceStrategy:
- Treat current customers as patients, investigators, and trial sites rather than as commercial accounts.
- Use conference presentations, trial registries, and named investigators as customer-proof because commercial deployment does not yet exist.
- Be explicit that retention and concentration are mostly future-state risks, not settled current metrics.
- Use job-board and practitioner-signal sources only as weak proxies for organizational reach, not as proof of demand.
qualityBar:
- Separate investigator adoption proof from commercial customer evidence.
- Do not convert clinical cohort size into recurring customer counts.
- Every missing retention or concentration metric should be left null with a diligence ask.
- Named proof rows should tie to actual sites, studies, or investigators rather than generic marketing copy.
sections:
- id: who-the-current-customers-really-are
  title: Current customers are really patients, investigators, and specialist sites
  body: |-
    For a clinical-stage cell-therapy company, the cleanest definition of ‘customer’ is narrower and more operational than it would be for a commercial biopharma or SaaS business. OriCell’s current users are enrolled patients and the investigators who choose to screen, collect, infuse, and monitor them. The current payers are mainly sponsor-funded trial budgets and supporting capital rather than reimbursing insurers. The current adoption surface is therefore the specialist-center network. This matters because many of the usual customer metrics—logos, seat counts, renewal rates, enterprise expansion—do not exist yet in a meaningful form. What does exist is site willingness to run the workflow and investigator willingness to present the data publicly. Ori-C101 has the clearest current customer proof because the HCC program has named-investigator visibility tied to Zhongshan Hospital and ASCO 2026. OriCAR-017 has a broader but less consumer-visible proof set via publication, registries, and
    the U.S.-visible RIGEL pathway. Publicly, these are early but real adoption signals; they are just not commercial account metrics yet.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-proof
  title: The adoption trajectory is measured by cohorts, presentations, and site expansion rather than bookings
  body: |-
    OriCell’s current adoption trajectory is best observed through progressive externalization of proof: early investigator-initiated data, formal publication, conference selection, regulatory progression, and expansion into broader trial settings. The HCC path illustrates this clearly. Ori-C101 moved from early clinical proof toward a more formal registrational pathway and earned an oral ASCO slot, which implies both data maturity and investigator sponsorship. The RRMM path is similar but dispersed: POLARIS publication, registry visibility, a U.S. RIGEL study surface, and FDA Fast Track. None of these are equivalent to commercial utilization, but together they show that external sites and regulators are engaging with the programs repeatedly rather than once. That repeat engagement is the closest current analogue to adoption durability. The caution is that the public record still does not show how many active sites exist, how fast they enroll, how many patients screen out, or how
    concentrated the network is across a few leading hospitals. So the adoption trajectory is real, but still under-specified.
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: named-proof-retention-and-concentration
  title: Named proof exists, but retention and concentration are mostly future-state questions
  body: |-
    The strongest named proof is not a list of paying hospitals; it is the set of named investigators, studies, and institutions that publicly validate the product experience. Zhongshan Hospital and Prof. Jian Zhou are important because they make the HCC program legible to outside investors as a real specialist-center effort rather than a purely internal company claim. POLARIS and RIGEL play a similar role in myeloma by showing that OriCAR-017 is not trapped inside one opaque local dataset. Even so, public retention evidence is thin. There are no disclosed commercial contracts, no NRR or GRR, no site renewal metrics, and no patient-satisfaction series. The nearest retention proxy is that programs continue to reappear in publications, registries, and conference settings, which suggests ongoing investigator engagement. Concentration risk is likely high simply because advanced autologous therapies usually depend on a small number of elite centers in the early years. But that remains an
    inference until OriCell discloses the active-site map and patient-flow distribution.
  claimRefs:
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  tableRefs:
  - TU003
  - TU004
  figureRefs:
  - FU003
- id: expansion-loops-and-customer-verdict
  title: Expansion depends on broader site penetration and future payer conversion
  body: |-
    If OriCell succeeds, expansion will not look like seat expansion or upsell; it will look like new sites, broader investigator referral patterns, more eligible patients, additional geographies, and eventual conversion from sponsor-funded workflows into payer-recognized pathways. That makes concentration and procurement friction central future risks. In HCC, expansion means moving beyond a few flagship centers into a broader China specialist-center network after stronger registrational evidence. In RRMM, it means proving enough post-BCMA relevance and manufacturing reliability to justify incremental site adoption in China and the U.S. The public organizational-signal sources are mixed: conference activity and industry profiles imply active engagement, but job-board and company-profile evidence is weak and does not prove scaled commercial infrastructure. The customer verdict is therefore constructive but limited. OriCell has real specialist-site and investigator proof, yet it is still
    precommercial enough that customer durability and concentration should be treated as diligence questions, not as solved variables.
  claimRefs:
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  tableRefs:
  - TU005
  - TU006
  figureRefs: []
