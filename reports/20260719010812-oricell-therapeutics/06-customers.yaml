schemaVersion: report-v2
artifact: customers
slug: oricell-therapeutics
runDate: '2026-07-19'
company:
  name: OriCell Therapeutics
chapter:
  number: 6
  title: Customers
  summary: OriCell does not yet have a public commercial customer base; its current adoption proof comes from enrolled patients, specialist investigators, and trial-capable hospitals willing to run autologous cell-therapy workflows. That is an important distinction because the strongest customer evidence today is clinical and investigator-driven rather than revenue-driven. The HCC program has the clearest named proof via Zhongshan Hospital–linked investigator visibility and ASCO 2026 presentation, while the RRMM program has publication and registry proof through POLARIS and the U.S.-visible RIGEL study. What is still missing are the classic commercial durability signals—renewals, NRR, account expansion, payer retention, and top-customer revenue concentration. As a result, OriCell’s customer chapter is really a site-and-patient adoption chapter with future payer and hospital concentration risk layered on top.
contentRequirements:
- Customer base segmentation by buyer/user/payer, geography, vertical, size, channel, use case, or revenue band.
- Adoption trajectory (active usage, repeat purchase, deployment, accounts, locations, utilization) where supportable.
- Named customer proof — production vs pilot, outcomes, reference quality, evidence freshness.
- Retention/durability — NRR, GRR, churn, renewal, contract length, cohorts, satisfaction, or gaps.
- Expansion and concentration — land-and-expand, top-customer risk, channel/partner dependence, procurement friction.
