- id: comparable-and-market-window
  title: Comparable context and the 2026 market window set a wide but useful band
  body: 'The best external anchors are not revenue multiples but stage-aware reference classes. Legend shows the upper commercial ceiling for a cell-therapy business that already lives inside public markets, while CARsgen offers a much closer China-origin disclosure and capital-markets benchmark. Gracell adds the strategic-M&A precedent: a billion-dollar transaction is possible in this part of the sector, but only when the asset set and buyer logic are strong enough. Macro conditions matter just as much. The 2026 biotech IPO window reopened and H1 issuance improved sharply, yet multiple sources describe the market as selective rather than indiscriminately generous. That combination produces a wide but not meaningless band. OriCell is clearly above a generic seed-stage biotech because it has real human data and regulatory traction, but it is still well below scaled public winners because commercialization, economics, and price discovery remain absent. The market-window message is constructive
    but conditional: better than 2025, still unforgiving to under-disclosed stories.'
