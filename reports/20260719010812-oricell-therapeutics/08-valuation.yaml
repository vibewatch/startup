  - type: private-evidence-only
    severity: material
    topic: cap table opacity
    missingEvidence: Post-April 2026 capitalization table, share count, preference stack, and anti-dilution terms.
    whyItMatters: Enterprise-value comparisons cannot be translated into investable equity value without knowing what sits ahead of new money.
    diligencePath: Request financing documents or a board-approved cap-table summary.
    relatedQuestionRefs:
    - QV002
    - QV028
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: capital adequacy
    missingEvidence: Current cash balance, monthly burn, and runway to the next major clinical milestone.
    whyItMatters: A private biotech can have impressive fundraising headlines and still be forced into a weak next round if burn and runway are misaligned.
    diligencePath: Request monthly cash bridge and 12-month operating plan.
