company:
  name: OriCell Therapeutics
chapter:
  number: 8
  title: Valuation
  summary: 'OriCell’s valuation case is better than a generic early-stage biotech story but still too under-disclosed to treat as a cleanly priced investment. The strongest current positives are visible: a US$70M Series C1 initial close in January 2026, a cumulative pre-IPO financing above US$110M in April, NMPA confirmatory phase II clearance for Ori-C101 in June, and continued U.S.-visible momentum for OriCAR-017. Those milestones justify serious investor attention. What they do not justify is a public claim that OriCell is demonstrably worth a disclosed US$1B+ today; no post-money valuation, share price, cap table, or runway bridge is public. The best stage-matched anchors are therefore comparables and precedents, not a hard company mark: CARsgen as a China-origin public peer, Gracell as a billion-dollar strategic-sale precedent, and Legend as the upper commercial ceiling. The 2026 biotech market is also mixed rather than euphoric—IPO issuance improved sharply, but multiple sources say
    capital remains selective and later-stage biased. The disciplined conclusion is research-more with high risk and unknown valuation stance: OriCell is credible enough to track closely, but not sufficiently priced or disclosed to underwrite aggressively without term-level diligence or a stronger proof point.'
sections:
- id: current-financing-context
  title: Current financing context proves momentum but not price
  body: OriCell’s 2026 financing sequence is the only hard current valuation evidence in public view, and it is still incomplete. The company clearly demonstrated fundraising momentum with a US$70 million Series C1 initial close in January and a cumulative pre-IPO financing above US$110 million in April. Independent coverage further tied the April raise to IPO preparation, which matters because it implies capital-markets ambition rather than simple balance-sheet repair. But the public documents stop well short of what an investor would need to underwrite a price. They do not disclose post-money valuation, share count, preference terms, or a cash-and-runway bridge. That omission is decisive. It means the correct input is not “OriCell is worth at least X because smart investors funded it,” but “OriCell has real financing access while its current equity price remains opaque.” For a valuation chapter, access to money is supportive evidence; it is not the same thing as disclosed price support.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
