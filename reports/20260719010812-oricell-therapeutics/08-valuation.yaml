- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Ori-C101 safety or efficacy disappointment
    - Material safety signal, weak confirmatory execution, or non-reproducible later-stage data
    - Damages the core solid-tumor wedge and compresses strategic optionality
    - Move to avoid / reset valuation band downward
  - - OriCAR-017 loses visible U.S. momentum
    - Delayed study traction or weaker regulatory posture
    - Reduces cross-border optionality and hematology fallback
    - Cut bull-case weight materially
  - - Distressed financing or punitive terms
    - Down round, heavy preferences, or short runway disclosure
    - Transfers upside away from new investors and raises insolvency risk
    - Require structure protection or step away
  - - Manufacturing fragility becomes visible
    - Poor release rates, long turnaround, or concentrated site dependence
    - Undermines the operational bridge from science to scale
    - Lower base-case band and extend diligence
  - - IPO/exit window closes before proof matures
    - No credible public or strategic path despite progress
    - Reduces monetization options and pricing leverage
    - Favor watchlist over active underwriting
  notes: Kill triggers are intentionally concrete because OriCell’s value is still milestone-concentrated.
