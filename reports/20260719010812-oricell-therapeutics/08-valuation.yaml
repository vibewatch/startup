- id: recommendation-and-thesis-balance
  title: Recommendation is research-more because quality and price support are different questions
  body: 'OriCell can be a high-quality company and still fail the current underwriting test. The positive case is real: differentiated solid-tumor CAR-T ambition, a visible RRMM option, credible 2026 financing, and milestone momentum strong enough to keep both public-market and strategic paths alive. The negative case is equally real: public price opacity, no cash/runway disclosure, no cap-table transparency, operational metrics that remain private, and a sector that still rewards later-stage proof over narrative. Those facts push the recommendation away from buy and toward research-more. The issue is not that OriCell lacks promise; it is that the public evidence set does not let an investor map promise to present value with confidence. A high risk rating follows naturally because future value is concentrated in a few milestones. Likewise, valuation stance should stay unknown. Without a disclosed current price, calling the stock or company attractive or stretched would pretend to know what
    the market has not actually revealed.'
