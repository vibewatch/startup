- id: scenario-bands-and-exit-paths
  title: Scenario bands matter more than a point estimate
  body: 'Because OriCell has no public price-bearing mark, scenario thinking is more honest than false precision. The base case is that the company belongs in a broad sub-Legend band centered near the Gracell/CARsgen zone: not a distressed science project, but not yet a publicly supported multi-billion commercial franchise. That base band assumes the current momentum continues without a decisive new proof point. The bull case requires more than enthusiasm. It needs confirmatory Ori-C101 execution, continued U.S. visibility for OriCAR-017, and a financing or exit market willing to reward a de-risked China-origin cell-therapy platform. The bear case does not require total failure; partial operational or financing slippage can be enough when disclosure is thin. Exit logic follows the same pattern. If proof strengthens, an IPO or strategic sale is plausible. If proof stalls, the company remains hostage to round terms rather than to intrinsic cash-flow value. This is why valuation discipline
    must be expressed as bands, triggers, and structure—not admiration for the science alone.'
