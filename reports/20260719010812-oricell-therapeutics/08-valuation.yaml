    - Upper public ceiling for a scaled cell-therapy franchise
    - Much more mature and disclosed than OriCell
  - - CARsgen
    - China-origin listed CAR-T peer
    - ~HK$9.5B market cap; listed disclosure history
    - Closer geographic and modality reference class
    - Still more disclosed and publicly priced than OriCell
  - - Gracell / AstraZeneca deal
    - Strategic M&A precedent
