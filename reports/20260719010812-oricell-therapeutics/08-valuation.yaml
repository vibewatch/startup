    - Large-cap approved oncology peer context
    - ~US$124B market cap
    - Illustrates the scale ceiling of approved global franchises
    - Not stage-matched
  - - Johnson & Johnson
    - Large-cap approved oncology peer context
    - ~US$609B market cap
    - Shows how much value sits in fully scaled healthcare incumbents
    - Not cell-therapy-specific or stage-matched
