- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation for comparison
  rows:
  - - OriCell
    - Focal peer
    - '>$110M pre-IPO round in 2026; multiple China and US programs'
    - Advanced HCC, RRMM, broader solid-tumor CAR-T
    - Armored GPC3 CAR-T, GPRC5D program, in vivo CAR-T ambition
    - Still clinical-stage; no approved product or public pricing
  - - CARsgen
    - Direct China peer
    - HK-listed cell-therapy company with annual-report history and broad pipeline
    - Solid tumors, RRMM, in vivo CAR-T
    - Deep China cell-therapy infrastructure; GPC3 and in vivo CAR-T disclosure
    - Pipeline breadth dilutes one-to-one comparability with OriCell
  - - Eureka Therapeutics
    - Adjacent direct peer
    - Multi-platform solid-tumor and hematologic pipeline
    - Liver cancer, myeloma, other solid tumors
    - ARTEMIS and E-ALPHA platforms; liver-cancer relevance
    - Less directly visible China registrational comparability for Ori-C101
  - - CARVYKTI / Legend + J&J
    - Incumbent substitute
    - Approved global BCMA CAR-T franchise
    - Late-line multiple myeloma
    - Commercial proof and physician mindshare
    - Different target; ex vivo benchmark rather than direct target match
  - - ABECMA / BMS + 2seventy
    - Incumbent substitute
    - Approved BCMA CAR-T franchise
    - Late-line multiple myeloma
    - Established clinical benchmark and treatment process
    - Same modality but older-positioned product and different target
  - - TALVEY / J&J
    - Adjacent substitute
    - Approved GPRC5D bispecific
    - Post-BCMA and late-line myeloma
    - Validates commercial value of GPRC5D biology
    - Not autologous CAR-T; different efficacy-to-access trade-offs
  - - Gracell
    - China-origin adjacent peer
    - AstraZeneca-backed/autonomous pipeline history
    - Myeloma and broader cell therapy
    - China-to-global pathway and hospital relationships
    - Not a like-for-like GPC3 HCC competitor
  notes: 'The closest asset-level peers differ by indication: CARsgen is the clearest public HCC/GPC3 comparator, while approved myeloma products are the true commercial benchmark for OriCAR-017.'
