figures:
  - id: FR001
    title: Residual-risk heatmap
    type: matrix
    summary: >-
      Qualitative residual-risk triage after considering only mitigations evidenced in the assigned
      public sources; unknown likelihood is kept distinct from low likelihood.
    data:
      columns:
        - id: likelihood
          label: Likelihood
          detail: Evidence-backed qualitative likelihood; unknown means public evidence is insufficient.
        - id: impact
          label: Impact
          detail: Potential investment impact if the risk materializes.
        - id: mitigation
          label: Mitigation maturity
          detail: Maturity visible in the assigned public evidence.
        - id: residual
          label: Residual severity
          detail: Exposure remaining after evidenced mitigations.
      rows:
        - label: Specification or formalization error
          note: Verification checks the encoded statement, not whether the original requirement was correct.
          values:
            - value: Medium
            - value: High
            - value: Partial
            - value: High
        - label: Security or data-control failure
          note: Public control and incident evidence is insufficient for a probability estimate.
          values:
            - value: Unknown
            - value: High
            - value: Unverified
            - value: High
        - label: Commercial adoption delay
          note: Institutional adoption and sales-cycle concerns are analyst-reported, not measured cohorts.
          values:
            - value: Medium
            - value: High
            - value: Unverified
            - value: High
        - label: Verification cost or scale constraint
          note: Internal request volume does not establish customer-workload economics or service levels.
          values:
            - value: Unknown
            - value: High
            - value: Partial
            - value: Medium-High
        - label: Capital and milestone mismatch
          note: Funding and valuation are reported, while burn, runway, revenue, and preferences remain undisclosed.
          values:
            - value: Medium
            - value: High
            - value: Unverified
            - value: High
        - label: Naming and attribution ambiguity
          note: Multiple unrelated 2026 sources use Axiom or AXIOM.
          values:
            - value: Medium
            - value: Medium
            - value: Unverified
            - value: Medium
    approximationNotes: >-
      Ordinal labels are analytical judgments, not probabilities; ratings are based only on the assigned
      public evidence and should be replaced with company diligence data.
    claimRefs: [CR003, CR006, CR007, CR008, CR011, CR013]
callouts:
  - calloutType: risk
    title: Thesis-break evidence
    body: >-
      Pause or reject investment if diligence reveals material false acceptance, unreproducible flagship
      results, unresolved training-data or proof-library rights, inadequate security controls, customer
      concentration without durable renewals, or workload economics incompatible with a credible runway.
    claimRefs: [CR003, CR006, CR010, CR011, CR015, CR016]
