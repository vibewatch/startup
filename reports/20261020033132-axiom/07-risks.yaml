chapter:
  number: 7
  title: Risks
  summary: >-
    Axiom's principal public-evidence risks are not that formal verification lacks value, but that
    correctness still depends on specification and human review, while enterprise security controls,
    commercial durability, operating economics, and dependency concentration remain undisclosed.
    The $200 million Series A at a reported $1.6 billion valuation raises the cost of slow adoption,
    and current namesake collisions make source attribution and brand diligence unusually important.
sections:
  - id: ranked-risk-posture
    title: Ranked residual-risk posture
    body: >-
      The highest residual exposure is specification risk: Lean can check whether formal steps compile,
      but it cannot by itself prove that the human problem, assumptions, or market and legal definitions
      were formalized correctly. An independent economist quoted by Fortune says new results still need
      human approval and verification, while another cautions that antitrust disputes often turn on
      market definition and interpretation rather than proof inside a model. Security-control disclosure
      and commercial durability rank next because the allocated public evidence contains product and
      press descriptions but no decision-grade control report, incident history, retention cohort, or
      concentration schedule. The heatmap therefore scores residual exposure, not observed incident
      frequency; unknown likelihoods remain unknown rather than being converted into false precision.
    claimRefs: [CR003, CR004, CR010, CR011, CR014, CR015]
    figureRefs: [FR001]
  - id: operational-quality-security
    title: Operational, quality, and security failure modes
    body: >-
      Axiom describes AXLE as a hosted Lean-verification service that has processed millions of requests
      inside Axiom, which is useful evidence of internal workload but not a disclosed availability,
      latency, security, or external-customer service-level record. Formal verification narrows one class
      of error after a statement is encoded; it does not remove the upstream risk of an incorrect
      specification or a downstream risk of using a valid theorem in the wrong business context. A
      separate academic AXIOM architecture illustrates the category tradeoff rather than Axiom Math's own
      performance: it deliberately abstains outside covered templates and reports ceilings in vision,
      word-problem, and intermediate-algebra coverage. Product diligence should therefore test
      end-to-end requirements capture, adversarial inputs, false acceptance, abstention, recovery,
      reproducibility, and cost under customer-like workloads.
    claimRefs: [CR001, CR003, CR004, CR005, CR006, CR011]
    tableRefs: [TR002]
  - id: commercial-financial-dependencies
    title: Commercial, financial, and dependency risks
    body: >-
      Fortune reports a 40-person company with customers in finance, cybersecurity, software, and
      hardware, but the available evidence does not provide named production deployments, contract
      duration, retention, revenue, gross margin, burn, or customer concentration. Sacra separately
      flags high computational requirements and conservative institutional adoption as risks, but those
      are analyst judgments rather than measured Axiom unit economics. The reported $200 million Series A
      at a $1.6 billion valuation supplies capital but does not establish cash available, runway, or
      revenue quality; it instead increases the milestone burden attached to the financing context.
      Dependence on Lean, a hosted verification layer, scarce formal-methods talent, and risk-sensitive
      enterprise buyers should be tested through architecture documents, vendor inventories, customer
      references, cohort data, and workload-level cost records.
    claimRefs: [CR002, CR006, CR007, CR008, CR009, CR010, CR012, CR015]
    tableRefs: [TR003]
  - id: legal-governance-kill-criteria
    title: Legal, governance, and thesis-break criteria
    body: >-
      Public evidence in the assigned set does not establish Axiom Math's privacy posture, security
      certifications, model and training-data rights, export-control analysis, regulated-industry
      approvals, litigation status, or incident history. That is an evidence gap, not proof that controls
      or incidents are absent. Attribution also needs care: the Axiom Foundation launched an unrelated
      rules-as-code project in July 2026, and an unrelated academic system is also named AXIOM. A trademark
      and entity review should separate those issuers before relying on search results. Investment review
      should pause if Axiom cannot provide independent proof of specification controls, external
      penetration testing, customer-level retention and concentration, workload economics, IP provenance,
      and a runway plan. The thesis should break on a material false-acceptance event, unresolved rights
      challenge, inability to reproduce flagship results, or evidence that production cost or customer
      adoption cannot support the financing-implied scale.
    claimRefs: [CR003, CR010, CR011, CR013, CR015, CR016]
    tableRefs: [TR001]
