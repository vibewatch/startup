    title: Recommendation logic
    type: flow
    summary: >-
      Technical credibility and financing capacity are offset by missing commercial and security terms, producing a
      price-sensitive research-more decision.
    data:
      nodes:
        - id: technical-proof
          label: Technical proof
          detail: Formal-verification product and reported prover milestones
        - id: capital
          label: Capital and sponsorship
          detail: $264M reported funding plus engaged institutional investors
        - id: commercial-gap
          label: Commercial evidence gap
          detail: No public ARR, margin, retention, customer-count, or pricing evidence
        - id: terms-gap
          label: Financing terms gap
          detail: Preferences, ownership, secondaries, and control rights are unavailable
        - id: risk
          label: High underwriting risk
          detail: Scaling cost and adoption duration remain unresolved
        - id: recommendation
          label: Research more
          detail: Stretched at the disclosed mark until evidence or price improves
      edges:
