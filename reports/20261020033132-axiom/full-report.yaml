        - label: Vertical high-assurance workflows
          value: Named applications
          detail: Finance, chips, aerospace, cryptography, and scientific computing are identified without measured spend.
        - label: Broad verified reasoning infrastructure
          value: Long-term option
          detail: Evidence supports ambition, not current revenue, penetration, or a numeric addressable market.
