              - CR009
              - CR010
              - CR012
              - CR015
      - number: '7.4'
        title: Legal, governance, and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              Public evidence in the assigned set does not establish Axiom Math's privacy posture, security
              certifications, model and training-data rights, export-control analysis, regulated-industry approvals,
              litigation status, or incident history. That is an evidence gap, not proof that controls or incidents are
              absent. Attribution also needs care: the Axiom Foundation launched an unrelated rules-as-code project in
              July 2026, and an unrelated academic system is also named AXIOM. A trademark and entity review should
              separate those issuers before relying on search results. Investment review should pause if Axiom cannot
              provide independent proof of specification controls, external penetration testing, customer-level
              retention and concentration, workload economics, IP provenance, and a runway plan. The thesis should break
              on a material false-acceptance event, unresolved rights challenge, inability to reproduce flagship
              results, or evidence that production cost or customer adoption cannot support the financing-implied scale.
            claimRefs:
              - CR003
              - CR010
