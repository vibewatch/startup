      - number: '4.3'
        title: Reported funding extends capacity, not visibility into runway
        blocks:
          - type: paragraph
            body: >-
              Multiple independent reports place the March 2026 Series A at $200 million and the associated valuation at
              about $1.6 billion; secondary profiles aggregate known funding at $264 million across two rounds. This is
              strong evidence of financing access, but it is not evidence of current cash. None of the retained
              materials provides a balance sheet, cash balance, monthly burn, debt schedule, project-finance obligation,
              or runway. The stated use of proceeds emphasizes team expansion, training infrastructure, and Verified AI
              development, which may accelerate product progress while also creating a high fixed-cost plan. The
              financial verdict is therefore two-sided: Axiom appears well financed relative to its young operating
              history, yet revenue quality, margin path, capital intensity, and the trigger for another round cannot be
              underwritten from public data. Investor diligence should reconcile bank cash and commitments rather than
              equating cumulative funding announcements with available liquidity.
