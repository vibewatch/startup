      - number: '6.4'
        title: Durability, expansion, and concentration cannot yet be underwritten
        blocks:
          - type: paragraph
            body: >-
              No retained source reports customer count, net or gross revenue retention, churn, contract length, renewal
              rate, customer-level revenue, or concentration. Sacra's described annual-license-plus-usage model suggests
              a plausible land-and-expand mechanism, while the API could support workflow-level adoption before broader
              enterprise deployment. That mechanism remains unverified, and Sacra separately flags conservative
              quantitative-finance adoption and potentially long sales cycles. The investable interpretation is
              therefore cautious: public proof supports a developer-to-enterprise expansion thesis, but not a durable
              commercial cohort. Diligence should reconcile product telemetry to contracts and invoices before assigning
              recurring-revenue or retention value.
