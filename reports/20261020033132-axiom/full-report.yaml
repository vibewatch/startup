  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is that Axiom is attacking an important reliability problem with a differentiated
              proof-first architecture: company materials describe formal foundations and AXLE, while investor materials
              identify quantitative finance, software verification, engineering, and scientific research as potential
              high-value applications. Third-party profiles also report a perfect 2025 Putnam result and subsequent
              machine-generated research activity, which supplies technical proof points rather than commercial proof.
              The anti-thesis is equally material. Investor descriptions are interested-party evidence, retained public
              materials do not establish production customers or repeatable economics, and an independent analyst flags
              both escalating proof-computation cost and conservative enterprise adoption. The technology can therefore
              be credible while the current financing price remains ahead of a demonstrated business model.
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Multiple retained third-party profiles report a March 2026 $200 million Series A at a $1.6 billion
              post-money valuation and $264 million of cumulative funding. Dividing the new capital by the reported
              post-money value produces a 12.5% primary-capital ratio, but that is not an ownership or dilution
              conclusion because option-pool changes, secondaries, preferences, and other round mechanics are not
              public. The same source set does not disclose EV/revenue for either financing and the fetched company
              pages do not provide ARR, retention, gross margin, customer count, or pricing. Entry discipline should
              therefore treat $1.6 billion as a financing mark, not a supported intrinsic-value estimate, and require a
              material evidence package before accepting that mark.
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV009
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: Scenario logic and comparable limitations
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports conditional cases, not precise probability-weighted valuation ranges. The bull
              case requires independently verifiable production deployments, attractive unit economics, and repeatable
              expansion beyond mathematical research; only then would a premium to the last financing mark be
              analytically supportable. The base case is continued technical progress without enough commercial
              disclosure, which keeps the last round as a reference point but not a value floor. The bear case is a
              slower adoption cycle or unfavorable proof-compute economics that forces a material reset. Historical
              software IPO multiples listed by one profile are not stage-, period-, or business-model-matched
              comparables, so they should not be used to manufacture a current multiple.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Decision, exit readiness, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The current call is research-more, with medium confidence, high risk, and a stretched valuation stance.
              Axiom has credible technical and talent signals, engaged institutional investors, and substantial capital,
              but the evidence needed to connect those strengths to a target return is private. The decision can improve
              after cohort-level contracts, renewal and expansion data, gross-margin and inference-cost detail, audited
              cash and burn, and complete financing terms are reviewed. Thesis-break triggers are failure to convert
              technical results into production contracts, worsening verification cost per useful proof, repeated
              security or correctness failures, or a financing reset before commercial validation. Exit readiness
              remains unquantifiable without revenue quality, ownership, preference, and likely-buyer evidence.
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive recommendation
            body: >-
              Research more rather than buy: require commercial cohorts, proof-compute economics, audited liquidity, and
              full preference and ownership terms, or a materially lower entry price.
            calloutType: recommendation
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV012
