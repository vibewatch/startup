              - CE006
              - CE007
          - type: callout
            title: Formal validity is not specification validity
            body: >-
              Public evidence does not quantify whether the formal statement faithfully captures the user's original
              intent, leaving auto-formalization as the central technical diligence question.
            calloutType: risk
            claimRefs:
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments are prospective, not yet commercially verified
        blocks:
          - type: paragraph
            body: >-
              The public buyer map spans research mathematicians, Lean developers, quantitative finance, scientific
              computing, software verification, cryptography, and chip design. Those segments are consistently described
              across industry profiles and reporting, while Axiom's own positioning extends verification from
              mathematics into software and other technical fields. However, these are target markets and application
              domains, not a disclosed roster of paying customers. The available evidence does not identify the buyer,
              user, and payer within an organization, nor does it disclose procurement status, contract value,
              geography, or revenue contribution by segment. Commercial segmentation should therefore be treated as a
              hypothesis to validate rather than an observed customer mix.
            claimRefs:
