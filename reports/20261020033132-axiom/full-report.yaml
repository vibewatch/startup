              The retained sources do not identify a named external production customer with a defined deployment,
              outcome, and current reference. The closest evidence consists of Axiom's own research workflow, unnamed
              Lean developers described as early adopters, and reported testing across prospective application domains.
              The official homepage and press surface emphasize publications and media coverage rather than customer
              case studies or testimonials. This is a material diligence gap because a verified proof artifact validates
              technical output, not willingness to pay, implementation effort, security acceptance, renewal behavior, or
              value realized in a customer's operating environment.
