        title: Exhibits
        blocks:
          - type: callout
            title: Pricing and switching-cost evidence is not yet investable
            body: >-
              Public sources describe a possible contract model but do not disclose Axiom list prices, realized terms,
              renewal behavior, customer migration effort, or proof-generation unit cost.
            calloutType: risk
