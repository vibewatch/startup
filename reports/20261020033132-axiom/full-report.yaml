              - CO009
              - CO010
      - number: '1.3'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Public profiles identify Carina Hong as founder and CEO and Shubho Sengupta as co-founder and CTO. Hong's
              mathematics background and Sengupta's reported AI and systems experience fit Axiom's combination of formal
              reasoning and model engineering. Ken Ono's recruitment as founding mathematician adds domain credibility
              and a bridge to research validation. The same evidence also points to concentration risk: the public story
              is unusually dependent on a small number of technical leaders and on Hong's mission framing. The retained
              materials do not disclose the board, voting rights, founder ownership, investor protective provisions,
              succession plan, or delegated operating leadership. Consequently, this chapter treats functional coverage
              as visible but governance quality and key-person mitigation as unverified.
            claimRefs:
