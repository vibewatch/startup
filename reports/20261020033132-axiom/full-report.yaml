  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: verified reasoning before broad AI'
        blocks:
          - type: paragraph
            body: >-
              The defensible market boundary starts with mathematical publications and theorem formalization, with
              scalable verification of AI-generated code as the clearest commercial adjacency. That boundary includes
              AI-assisted theorem proving, auto-formalization, proof transformation, and software-verification workflows
              whose required properties can be expressed as mathematical statements. It also includes selected
              industrial mathematics applications reported in quantitative finance, chip design, cryptography,
              scientific computing, and software assurance. It excludes broad generative AI, generic coding assistants,
              and education technology unless a buyer is specifically paying for machine-checkable reasoning. This
              narrower definition avoids treating every AI or software dollar as addressable merely because verification
              could eventually be useful.
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM011
      - number: '2.2'
        title: 'Sizing: demand signals exist, but a market value does not'
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not provide a credible market-size value, CAGR, installed base, unit price, or
              addressable workload count for Axiom's category. Investor support and industry commentary indicate urgency
              around correctness as AI writes more software, but funding raised is not customer demand, revenue, or cash
              available for commercialization. A bottoms-up model would require the number of target teams, annual
              verification spend, eligible workloads, deployment frequency, and Axiom's attainable share. None is
              public. The prudent result is a set of nested sizing lenses rather than a numeric TAM/SAM/SOM: formal-math
              workflows are the evidenced core, code verification is the principal adjacency, and broader industrial
              assurance remains an option whose timing and budget ownership have not been demonstrated.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM009
              - CM010
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM004
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Public descriptions point to several user groups but do not establish signed customers. Mathematicians and
              research institutions are natural users of theorem proving and formalization, while quantitative
              researchers, software-assurance teams, and engineering organizations are plausible commercial users. Sacra
              describes a B2B SaaS model based on annual engine licenses plus usage-based compute credits, but neither
              Axiom nor an identified customer confirms that packaging. For enterprise adoption, the likely buyer is a
              technical or risk owner, the user is a mathematician or engineer, and the payer is the organization
              holding the validation budget. The adoption path therefore runs from a bounded proof task to workflow
              integration and only then to production assurance.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM006
              - CM007
              - CM008
              - CM009
              - CM011
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest driver is the widening gap between code that appears correct and code that can be shown to
              satisfy explicit properties as AI-generated software expands. Axiom's reported formalization of the 246
              theorem and its reusable prime-gaps library demonstrate progress from isolated benchmark answers toward
              repeatable proof infrastructure. Constraints are equally material: formal verification has historically
              required scarce specialists; system correctness still depends on faithful specifications and a sound
              verification stack; and Sacra warns that computational requirements can rise sharply with problem
              complexity. Auto-formalization is therefore a central adoption bottleneck, not a secondary feature.
              Valuation support should depend on paid production use and repeatable integration economics, neither of
              which is disclosed in the assigned evidence.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM010
              - CM012
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM012
              - CM013
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: A broad replacement set, not a single peer group
        blocks:
          - type: paragraph
            body: >-
              Axiom's closest disclosed peer is Harmonic: Axios described both as members of the small group of startups
              building AI systems that solve mathematics in provably correct ways. The practical replacement set is
              wider. One retained industry profile also tracks Logical Intelligence and frontier-model labs such as
              OpenAI, Google DeepMind, Anthropic, and xAI, while Sacra identifies Microsoft Research, open-source Lean
              initiatives, and established mathematical software as competitive paths. Those alternatives do not offer
              identical products, but they can compete for the same research, reasoning, verification, or procurement
              budget. Internal development on open-source proof tooling is therefore a real make-versus-buy option, and
              Wolfram Alpha or MATLAB can remain the status quo where computation and libraries matter more than
              autonomous formal proof generation. Public scale evidence is uneven: Axios reported Harmonic's January
              2026 financing, while most other competitor-specific funding and customer metrics were absent from the
              assigned evidence.
