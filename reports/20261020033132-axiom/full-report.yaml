      - number: '1.4'
        title: Milestones and evidence quality
        blocks:
          - type: paragraph
            body: >-
              Axiom's public chronology is unusually dense for a company founded in 2025: financing, a perfect Putnam
              score, a reported resolution of a long-standing conjecture, an API launch, and continuing publications all
              appear within roughly eighteen months. These events demonstrate fundraising velocity and research output,
              but they do not establish product-market fit. The official press index is company-curated, while
              independent profiles often repeat company claims without disclosing underlying customer or financial
              evidence. Sacra also highlights computational scaling and potentially slow enterprise adoption as material
              constraints. No retained evidence identifies a production customer, quantified customer outcome,
              regulatory approval, material partnership, outage, lawsuit, or board-level change. The timeline should
              therefore be read as a chronology of public claims and events, not as proof of commercial maturity.
