  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual-risk posture
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is specification risk: Lean can check whether formal steps compile, but it
              cannot by itself prove that the human problem, assumptions, or market and legal definitions were
              formalized correctly. An independent economist quoted by Fortune says new results still need human
              approval and verification, while another cautions that antitrust disputes often turn on market definition
              and interpretation rather than proof inside a model. Security-control disclosure and commercial durability
              rank next because the allocated public evidence contains product and press descriptions but no
              decision-grade control report, incident history, retention cohort, or concentration schedule. The heatmap
              therefore scores residual exposure, not observed incident frequency; unknown likelihoods remain unknown
              rather than being converted into false precision.
            claimRefs:
              - CR003
              - CR004
              - CR010
              - CR011
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR008
              - CR011
              - CR013
      - number: '7.2'
        title: Operational, quality, and security failure modes
        blocks:
          - type: paragraph
            body: >-
              Axiom describes AXLE as a hosted Lean-verification service that has processed millions of requests inside
              Axiom, which is useful evidence of internal workload but not a disclosed availability, latency, security,
              or external-customer service-level record. Formal verification narrows one class of error after a
              statement is encoded; it does not remove the upstream risk of an incorrect specification or a downstream
              risk of using a valid theorem in the wrong business context. A separate academic AXIOM architecture
              illustrates the category tradeoff rather than Axiom Math's own performance: it deliberately abstains
              outside covered templates and reports ceilings in vision, word-problem, and intermediate-algebra coverage.
              Product diligence should therefore test end-to-end requirements capture, adversarial inputs, false
              acceptance, abstention, recovery, reproducibility, and cost under customer-like workloads.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR006
              - CR011
