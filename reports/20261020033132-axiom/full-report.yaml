  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Axiom presents a product family rather than a single end-user application. AXLE is the clearest
              infrastructure product: Axiom describes it as a hosted Lean service with proof-verification and
              declaration-extraction primitives, while independent profiles also describe API access for proof
              transformations. AxiomProver is the reasoning system that constructs and checks formal proofs, and
              Axplorer is an open-source generative tool for discovering constrained mathematical constructions. The
              practical workflow is therefore problem intake, formalization, conjecture or lemma generation, proof
              construction, machine checking, and readable output. What is public establishes product intent and named
              components, but not buyer-ready packaging, supported integrations, service tiers, or realized user
              outcomes.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
