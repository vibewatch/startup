      - number: '3.3'
        title: Distribution and proof economics may matter more than benchmark novelty
        blocks:
          - type: paragraph
            body: >-
              The retained evidence does not disclose Axiom list prices, realized contract values, or packaging. Sacra
              describes an intended annual-license-plus-usage-credit model, but that is a third-party report rather than
              a published Axiom price sheet. Commercial durability will therefore depend on whether verified outputs
              justify higher integration and compute costs. Microsoft can bundle adjacent capabilities into an existing
              enterprise channel, open-source Lean projects can commoditize baseline proving components, and incumbent
              mathematical software already has installed users and libraries. Axiom's funding capacity is substantial
              relative to an early market, with a retained headline reporting a $200 million raise, but funding is not
              distribution or customer proof. Sacra's warning that formal proof computation can become more demanding as
              problem complexity rises reinforces the need to diligence throughput and unit cost. The moat is best
              viewed as conditional: proprietary proof data and workflow integration can compound, but switching costs
              and lock-in are not demonstrated in the public evidence.
            claimRefs:
              - CP004
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
