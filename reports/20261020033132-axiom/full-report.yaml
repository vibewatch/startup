chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Axiom was founded in March 2025 and describes its mission as building a "verified discovery engine": an AI
              system that converts mathematical reasoning into machine-checkable formal proofs and uses verification as
              a training signal. Public profiles place the company in Palo Alto or the broader Palo Alto/San Francisco
              area, but the retained evidence does not establish a legal headquarters or incorporation jurisdiction. The
              product thesis is clearer than the commercial model. Axiom presents formal mathematics as the initial
              proving ground and code, cryptography, quantitative finance, and hardware verification as adjacent
              applications. This supports a one-line description of Axiom as a proof-first AI lab, while pricing,
              contract structure, and the boundary between research access, API usage, and enterprise software remain
              unverified.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO006
              - CO007
              - CO012
              - CO013
      - number: '1.2'
        title: Capital formation and public scale
        blocks:
          - type: paragraph
            body: >-
              The strongest public scale evidence concerns financing, not operations. Axiom's official fundraising page
              reports a $64 million seed at a $300 million valuation in October 2025 and a $200 million Series A at a
              $1.6 billion-plus post-money valuation in March 2026. Multiple third-party profiles repeat those round
              sizes and imply $264 million of cumulative funding, although funding raised should not be treated as cash
              remaining. Menlo Ventures is reported as the Series A lead, with Greycroft, Madrona, B Capital, and Toyota
              Ventures participating. By contrast, public staffing estimates cluster around roughly 20 to 30-plus people
              and are not consistent enough for a precise current headcount. No retained source supplies ARR, revenue,
              customer count, profitability, burn, or runway.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO012
              - CO013
