            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The disclosed architecture separates probabilistic generation from deterministic checking. Third-party
              descriptions consistently place natural-language-to-Lean formalization ahead of conjecture generation and
              proof search, with Lean acting as the acceptance gate before proofs are rendered for people or returned
              through an interface. This is technically meaningful because a generated step is not accepted merely
              because it is plausible; it must satisfy the formal checker. The differentiation is the closed
              generation-verification loop and the prospect of feeding verified proofs back into training. However, the
              public record does not specify model architecture, training corpus controls, proof-search compute, failure
              taxonomy, or how specification errors are detected before a formally valid but misframed theorem is
              accepted.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE006
              - CE008
              - CE012
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE014
      - number: '5.3'
        title: Maturity, differentiation, and roadmap
        blocks:
          - type: paragraph
            body: >-
              The strongest maturity signal is operational rather than commercial: Axiom says AXLE has served millions
              of requests inside the company, including model training and AxiomProver work, and an independent company
              profile repeats the millions-of-requests claim. The official site also shows an active publication stream
              through October 2026, while the press index records sustained external coverage during 2026. These signals
              support a functioning research and internal-infrastructure stack, not a conclusion that AXLE or
              AxiomProver meets enterprise production requirements. The roadmap broadens from formal mathematics toward
              verified software and technical reasoning, but public materials do not provide release commitments,
              customer acceptance criteria, or independent comparisons of throughput, accuracy, and integration cost.
            claimRefs:
              - CE002
              - CE009
              - CE010
              - CE011
      - number: '5.4'
        title: Dependencies, trust, and technical diligence
        blocks:
          - type: paragraph
            body: >-
              Lean is both the trust anchor and a major dependency: it can check whether a formal proof follows from its
              encoded premises, but the retained evidence does not show how Axiom validates that natural-language intent
              was formalized correctly. A separate 2026 technical paper does not evaluate Axiom, but it independently
              characterizes pre-formalization as the bottleneck for applying Lean-based provers to natural-language
              questions. The system also depends on scarce formal-methods talent, proof-search compute, curated verified
              data, and reliable hosted execution. Public official pages reviewed for this chapter do not disclose
              authentication design, tenant isolation, encryption, data retention, privacy terms, security
              certifications, uptime objectives, incident history, support commitments, or a public status surface.
              Those omissions do not prove weak controls; they make security and reliability underwritable from public
              evidence and require direct technical diligence before production use.
            claimRefs:
              - CE006
              - CE008
              - CE012
              - CE013
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Verification is a real architectural boundary
            body: >-
              The disclosed stack uses Lean checking as an acceptance gate rather than presenting generated mathematical
              text as self-validating.
            calloutType: strength
            claimRefs:
