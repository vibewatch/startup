      - number: '6.2'
        title: Technical usage is visible, but commercial adoption is not
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption evidence is product and practitioner activity. ZenML reports that developers can
              integrate Axiom's verification API and that early adopters combine its tools with Claude in Lean
              workflows. A separate company profile reports millions of AXLE requests, but supplies no measurement
              period, unique-user count, paid-account denominator, or customer attribution. Axiom's Fel-conjecture
              publication demonstrates an end-to-end verified workflow, yet the company explicitly presents it as an
              early internal test case. These signals establish technical utility and experimentation; they do not
              establish recurring paid deployment, repeat purchase, production utilization, or account expansion.
