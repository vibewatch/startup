              - CR011
      - number: '7.3'
        title: Commercial, financial, and dependency risks
        blocks:
          - type: paragraph
            body: >-
              Fortune reports a 40-person company with customers in finance, cybersecurity, software, and hardware, but
              the available evidence does not provide named production deployments, contract duration, retention,
              revenue, gross margin, burn, or customer concentration. Sacra separately flags high computational
              requirements and conservative institutional adoption as risks, but those are analyst judgments rather than
              measured Axiom unit economics. The reported $200 million Series A at a $1.6 billion valuation supplies
              capital but does not establish cash available, runway, or revenue quality; it instead increases the
              milestone burden attached to the financing context. Dependence on Lean, a hosted verification layer,
              scarce formal-methods talent, and risk-sensitive enterprise buyers should be tested through architecture
              documents, vendor inventories, customer references, cohort data, and workload-level cost records.
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR008
              - CR009
