            body: >-
              Pause or reject investment if diligence reveals material false acceptance, unreproducible flagship
              results, unresolved training-data or proof-library rights, inadequate security controls, customer
              concentration without durable renewals, or workload economics incompatible with a credible runway.
            calloutType: risk
