  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model remains a third-party characterization
        blocks:
          - type: paragraph
            body: >-
              Sacra characterizes Axiom as a B2B SaaS business aimed at quantitative finance, research institutions, and
              industrial mathematics, with an annual core-engine license plus usage-based compute credits. That is the
              clearest retained description of monetization, but it is analyst-authored rather than a first-party price
              sheet or executed contract. The official homepage and press page reviewed for this chapter do not disclose
              list prices, realized prices, contract duration, minimum commitments, discounts, revenue-recognition
              policy, or named paid deployments. Consequently, the economic bridge from a verification workload to
              recognized revenue is plausible but not underwritten. Annual licensing could improve predictability, while
              compute-based charging could align revenue with usage; neither proposition establishes current revenue
              mix, recurring quality, or gross profit. Financing is kept outside this revenue model because capital
              raised is not customer revenue.
            claimRefs:
