      - number: '4.2'
        title: Compute, scarce talent, and specification work dominate the cost questions
        blocks:
          - type: paragraph
            body: >-
              Public reporting says proceeds are intended to scale training infrastructure and the team of mathematics
              experts, pointing to compute and specialized labor as important cost centers. SiliconANGLE also frames
              affordability at scale as a next step rather than an achieved margin outcome. The adverse case is broader
              than inference cost: Dealroom quotes an external computer-science professor warning that software
              correctness cannot always be specified, unlike a mathematical answer. If customers require extensive
              specification, integration, and validation work before a proof workload can run, service-delivery costs
              and sales cycles may remain material even when automated verification is technically successful. No
              retained source quantifies gross margin, cost per proof, utilization, CAC, payback, retention, or customer
              concentration. Those omissions prevent a conclusion that usage growth produces attractive unit economics.
            claimRefs:
              - CI007
              - CI011
              - CI012
              - CI013
