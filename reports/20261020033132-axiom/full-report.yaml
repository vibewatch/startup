          target: capital
          label: strengthens execution case
        - source: capital
          target: commercial-gap
          label: does not close
        - source: commercial-gap
          target: terms-gap
          label: compounds
        - source: terms-gap
          target: risk
          label: raises downside uncertainty
        - source: risk
          target: recommendation
          label: determines
    approximationNotes: The flow is qualitative and does not imply probabilities, conversion rates, or a numerical valuation bridge.
    claimRefs:
