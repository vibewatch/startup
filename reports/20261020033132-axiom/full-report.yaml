              - CP012
      - number: '3.2'
        title: Verification is the clearest differentiation, with important scope limits
        blocks:
          - type: paragraph
            body: >-
              Axiom's strongest supported differentiation is an end-to-end formal-proof workflow rather than a generic
              claim of superior reasoning. Axios reports that AxiomProver translates a natural-language problem into
              Lean, develops a proof, and subjects every step to a separate checker. Axiom's engineering page adds a
              hosted Lean Engine with verification and declaration-extraction primitives, plus an open-source
              construction-search tool. This architecture creates a trust artifact that buyers can inspect, but it does
              not by itself establish enterprise security, regulatory compliance, integration cost, or superiority over
              Harmonic and other systems. The evidence of research output is meaningful but company-led: Axiom's site
              listed seven dated research publications or posts in September and October 2026, and Axios reported
              journal acceptance for proofs produced by the system with human-authored articles. Independent,
              like-for-like benchmarks of proof throughput, formalization error, and total cost are still missing.
            claimRefs:
