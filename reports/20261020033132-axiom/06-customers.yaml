  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: >-
        Named external customers with buyer, user, payer, production status, deployment
        scope, outcome, start date, and reference freshness.
      whyItMatters: >-
        Internal proofs and unnamed developer reports cannot establish procurement,
        production fit, willingness to pay, or realized customer value.
      diligencePath: >-
        Obtain a complete customer list and select at least three references across
        research, developer, and enterprise segments for independent calls.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: retention-and-concentration
      missingEvidence: >-
        Customer count, paid-account count, contracts, cohort usage, NRR, GRR, churn,
        renewal rate, contract length, ACV, expansion, and top-customer concentration.
      whyItMatters: >-
        Without contract and cohort evidence, technical usage cannot be converted into
        a durable recurring-revenue or concentration assessment.
      diligencePath: >-
        Reconcile CRM, billing, contracts, and product telemetry by customer for the
        latest eight quarters, including pilots, cancellations, renewals, and expansions.
    - type: missing-source
      severity: material
      topic: usage-volume
      missingEvidence: >-
        Primary AXLE telemetry defining request count, launch date, measurement cutoff,
        unique users, organizations, paid share, repeat usage, and production workloads.
      whyItMatters: >-
        An undenominated cumulative request total can reflect testing or automation and
        cannot establish customer growth, engagement quality, or retention.
      diligencePath: >-
        Review a read-only telemetry export and billing reconciliation, then reproduce
        monthly organization-level active-use and retention cohorts.
