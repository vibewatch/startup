        - API-assisted proof verification and repair alongside general-purpose models
        - "Unnamed early-adopter signal; no account, usage cohort, or paid-status disclosure"
      - - Quantitative finance and scientific computing
        - "Likely users: quantitative researchers; economic buyer and payer undisclosed"
        - Mathematically grounded reasoning and verification
        - "Target market and reported testing only; no named production deployment or outcome"
      - - Software, cryptography, and chip design
        - "Likely users: engineering and verification teams; payer undisclosed"
        - Validation of generated software and technically rigorous designs
        - "Application thesis only; security review, integration cost, procurement, and production status unknown"
    notes: >-
      Segments are synthesized from stated target markets and application domains as of
      2026-10-20; they are not presented as counts of customers or confirmed revenue segments.
    claimRefs: [CU008, CU009, CU010, CU013]
  - id: TU002
    title: Customer growth and adoption evidence
    columns:
      - Signal
      - Reported value or status
      - Date / period
      - Confidence and implication
      - Missing denominator
    rows:
      - - Fel conjecture workflow
        - "Lean/Mathlib proof artifact accepted by the checker"
        - "2026-02-05"
        - "Medium: validates an internal end-to-end workflow, not external adoption"
        - "No customer, contract, deployment, or repeat-use denominator"
      - - Verification API
        - "Available for developer integration"
        - "Period not disclosed"
        - "Medium: creates a composable adoption surface"
        - "No active developer, paid account, request-frequency, or retention series"
      - - Lean developer use
        - "Early adopters reportedly combine Claude with Axiom tools"
        - "Period not disclosed"
        - "Medium: indicates practitioner workflow fit"
        - "Users unnamed; no cohort size, paid status, or production designation"
      - - AXLE request volume
        - "Millions of requests since launch, reported by a company-profile publisher"
        - "Launch date and measurement cutoff not disclosed"
        - "Low: directional activity signal pending primary telemetry"
        - "No unique users, organizations, paid share, growth rate, or customer attribution"
    notes: >-
      Values retain each source's wording and limitations; request volume is not converted
      into customers, accounts, revenue, retention, or production deployments.
    claimRefs: [CU002, CU003, CU004, CU005, CU006, CU007]
  - id: TU003
    title: Named customer proof table
    columns:
      - Referenced user or deployment
      - Segment
      - Production vs. pilot
      - Public outcome
      - Limitation
    rows:
      - - "Axiom internal Fel-conjecture workflow"
        - Research mathematics
        - "Internal early test case; not an external customer deployment"
        - "Checker-accepted Lean/Mathlib proof artifact"
        - "Does not evidence procurement, payment, implementation, renewal, or customer ROI"
      - - "Unnamed early Lean adopters"
        - Lean developers
        - "Not disclosed"
        - "Reported use of Claude with Axiom tools as a standard Lean setup"
        - "No names, cohort size, paid status, usage period, or independently reported outcome"
      - - "Unnamed organizations in prospective application domains"
        - "Finance, aircraft and chip design, quantitative trading"
        - "Reported as testing; production status not disclosed"
        - "No quantified external outcome disclosed"
        - "No named customer, deployment scope, contract, or current reference"
    notes: >-
      This is a partial inventory of the closest public evidence found, not a customer
      list; the absence of named external production references is the central finding.
    enumerationScope:
      coverage: partial
      basis: >-
        Successful prefetched sources allocated to the customers chapter and reviewed
        through 2026-10-20; private references and contracts were unavailable.
    claimRefs: [CU002, CU003, CU004, CU009, CU014]
figures:
  - id: FU001
    title: Evidence-qualified customer adoption journey
    type: journey-map
    summary: >-
      Public proof weakens as the journey moves from technical discovery toward paid
      production, renewal, and expansion.
    data:
      items:
        - label: Discover
          detail: "Research publications and media coverage create awareness among technical users."
          touchpoints:
            - Publications
            - Press coverage
        - label: Evaluate
          detail: "A natural-language conjecture and definitions enter the formal reasoning workflow."
          touchpoints:
            - Research problem
            - API exploration
        - label: Verify
          detail: "Axiom Prover generates a Lean artifact that is accepted only after checker validation."
          touchpoints:
            - Axiom Prover
            - Lean/Mathlib checker
        - label: Integrate
          detail: "Reported early users combine Axiom tools with Claude in Lean development."
          touchpoints:
            - Verification API
            - Developer workflow
        - label: Deploy
          detail: "Named external production deployments, implementation scope, and security acceptance are not public."
          touchpoints:
            - Enterprise integration
            - Production approval
        - label: Renew and expand
          detail: "Retention, contract duration, usage expansion, revenue contribution, and concentration are undisclosed."
          touchpoints:
            - Renewal
            - Additional workloads
    approximationNotes: >-
      The sequence is an evidence-qualified adoption path, not a measured conversion
      funnel; no conversion rates, elapsed times, or cohort sizes are inferred.
    claimRefs: [CU001, CU004, CU011, CU012, CU015, CU016]
callouts:
  - calloutType: risk
    title: Technical validation is not customer validation
    body: >-
      A checker-accepted proof and API activity establish product capability and use,
      but without named external deployments, paid-account telemetry, renewals, or
      concentration data they do not establish commercial durability.
    claimRefs: [CU002, CU006, CU007, CU014, CU015, CU016]
