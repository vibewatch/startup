schemaVersion: "report-v2"
artifact: customers
slug: axiom
runDate: 2026-10-20
company:
  name: Axiom
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence shows credible technical adoption surfaces—an API, Lean tooling,
    reported early developer use, and a formally verified internal research case—but
    does not establish named external production customers, retention, contract
    durability, or concentration. Axiom's customer thesis therefore remains broader
    and better evidenced than its commercial customer proof.
sections:
  - id: customer-segments
    title: Customer segments are prospective, not yet commercially verified
    body: >-
      The public buyer map spans research mathematicians, Lean developers, quantitative
      finance, scientific computing, software verification, cryptography, and chip
      design. Those segments are consistently described across industry profiles and
      reporting, while Axiom's own positioning extends verification from mathematics
      into software and other technical fields. However, these are target markets and
      application domains, not a disclosed roster of paying customers. The available
      evidence does not identify the buyer, user, and payer within an organization,
      nor does it disclose procurement status, contract value, geography, or revenue
      contribution by segment. Commercial segmentation should therefore be treated as
      a hypothesis to validate rather than an observed customer mix.
    claimRefs: [CU008, CU009, CU010, CU013]
    tableRefs: [TU001]
  - id: adoption-signals
    title: Technical usage is visible, but commercial adoption is not
    body: >-
      The strongest adoption evidence is product and practitioner activity. ZenML
      reports that developers can integrate Axiom's verification API and that early
      adopters combine its tools with Claude in Lean workflows. A separate company
      profile reports millions of AXLE requests, but supplies no measurement period,
      unique-user count, paid-account denominator, or customer attribution. Axiom's
      Fel-conjecture publication demonstrates an end-to-end verified workflow, yet the
      company explicitly presents it as an early internal test case. These signals
      establish technical utility and experimentation; they do not establish recurring
      paid deployment, repeat purchase, production utilization, or account expansion.
    claimRefs: [CU002, CU003, CU004, CU005, CU006, CU007]
    tableRefs: [TU002]
  - id: named-customer-proof
    title: Named external customer proof remains absent
    body: >-
      The retained sources do not identify a named external production customer with a
      defined deployment, outcome, and current reference. The closest evidence consists
      of Axiom's own research workflow, unnamed Lean developers described as early
      adopters, and reported testing across prospective application domains. The
      official homepage and press surface emphasize publications and media coverage
      rather than customer case studies or testimonials. This is a material diligence
      gap because a verified proof artifact validates technical output, not willingness
      to pay, implementation effort, security acceptance, renewal behavior, or value
      realized in a customer's operating environment.
    claimRefs: [CU002, CU003, CU004, CU009, CU014]
    tableRefs: [TU003]
  - id: durability-and-expansion
    title: Durability, expansion, and concentration cannot yet be underwritten
    body: >-
      No retained source reports customer count, net or gross revenue retention, churn,
      contract length, renewal rate, customer-level revenue, or concentration. Sacra's
      described annual-license-plus-usage model suggests a plausible land-and-expand
      mechanism, while the API could support workflow-level adoption before broader
      enterprise deployment. That mechanism remains unverified, and Sacra separately
      flags conservative quantitative-finance adoption and potentially long sales
      cycles. The investable interpretation is therefore cautious: public proof supports
      a developer-to-enterprise expansion thesis, but not a durable commercial cohort.
      Diligence should reconcile product telemetry to contracts and invoices before
      assigning recurring-revenue or retention value.
    claimRefs: [CU004, CU011, CU012, CU015, CU016]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Publicly indicated customer segments
    columns:
