company:
  name: Axiom
chapter:
  number: 3
  title: Competitors
  summary: >-
    Axiom competes most directly with specialized formal-reasoning startups such as Harmonic,
    but its buyer alternatives also include frontier-model vendors, established mathematical
    software, open-source Lean tooling, and internal builds. Its machine-checkable proof workflow
    is differentiated in the retained evidence, while pricing, enterprise distribution, and
    independently benchmarked proof economics remain material gaps.
sections:
  - id: competitive-landscape
    title: A broad replacement set, not a single peer group
    body: >-
      Axiom's closest disclosed peer is Harmonic: Axios described both as members of the small
      group of startups building AI systems that solve mathematics in provably correct ways.
      The practical replacement set is wider. One retained industry profile also tracks Logical
      Intelligence and frontier-model labs such as OpenAI, Google DeepMind, Anthropic, and xAI,
      while Sacra identifies Microsoft Research, open-source Lean initiatives, and established
      mathematical software as competitive paths. Those alternatives do not offer identical
      products, but they can compete for the same research, reasoning, verification, or
      procurement budget. Internal development on open-source proof tooling is therefore a real
      make-versus-buy option, and Wolfram Alpha or MATLAB can remain the status quo where
      computation and libraries matter more than autonomous formal proof generation. Public scale
      evidence is uneven: Axios reported Harmonic's January 2026 financing, while most other
      competitor-specific funding and customer metrics were absent from the assigned evidence.
    claimRefs: [CP007, CP008, CP009, CP010, CP011, CP012]
    tableRefs: [TP001]
  - id: capability-and-trust
    title: Verification is the clearest differentiation, with important scope limits
    body: >-
      Axiom's strongest supported differentiation is an end-to-end formal-proof workflow rather
      than a generic claim of superior reasoning. Axios reports that AxiomProver translates a
      natural-language problem into Lean, develops a proof, and subjects every step to a separate
      checker. Axiom's engineering page adds a hosted Lean Engine with verification and
      declaration-extraction primitives, plus an open-source construction-search tool. This
      architecture creates a trust artifact that buyers can inspect, but it does not by itself
      establish enterprise security, regulatory compliance, integration cost, or superiority over
      Harmonic and other systems. The evidence of research output is meaningful but company-led:
      Axiom's site listed seven dated research publications or posts in September and October
      2026, and Axios reported journal acceptance for proofs produced by the system with
      human-authored articles. Independent, like-for-like benchmarks of proof throughput,
      formalization error, and total cost are still missing.
    claimRefs: [CP001, CP002, CP003, CP005, CP006, CP015]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: commercial-durability
    title: Distribution and proof economics may matter more than benchmark novelty
    body: >-
      The retained evidence does not disclose Axiom list prices, realized contract values, or
      packaging. Sacra describes an intended annual-license-plus-usage-credit model, but that is a
      third-party report rather than a published Axiom price sheet. Commercial durability will
      therefore depend on whether verified outputs justify higher integration and compute costs.
      Microsoft can bundle adjacent capabilities into an existing enterprise channel, open-source
      Lean projects can commoditize baseline proving components, and incumbent mathematical
      software already has installed users and libraries. Axiom's funding capacity is substantial
      relative to an early market, with a retained headline reporting a $200 million raise, but
      funding is not distribution or customer proof. Sacra's warning that formal proof computation
      can become more demanding as problem complexity rises reinforces the need to diligence
      throughput and unit cost. The moat is best viewed as conditional: proprietary proof data and
      workflow integration can compound, but switching costs and lock-in are not demonstrated in
      the public evidence.
    claimRefs: [CP004, CP010, CP011, CP012, CP013, CP014, CP016]
    tableRefs: [TP003]
