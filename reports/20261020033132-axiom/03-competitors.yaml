    title: Ordinal positioning by distribution leverage and formal-proof rigor
    type: quadrant
    summary: >-
      Axiom and Harmonic occupy the specialized formal-proof end of the map, while incumbents have
      greater inferred distribution leverage; positions are evidence-constrained ordinal judgments.
    data:
      points:
        - label: Axiom
          x: 3
          y: 5
          detail: "Strong formal-proof evidence; enterprise distribution not demonstrated."
        - label: Harmonic
          x: 3
          y: 5
          detail: "Direct provable-math peer; retained product and channel evidence is sparse."
        - label: Microsoft
          x: 5
          y: 3
          detail: "High inferred channel leverage through existing enterprise and academic relationships."
        - label: "OpenAI / Google DeepMind"
          x: 5
          y: 3
          detail: "Broad model distribution and math progress; like-for-like proof rigor is not established here."
        - label: "Wolfram / MATLAB"
          x: 5
          y: 2
          detail: "Established installed bases; retained evidence does not show autonomous formal proofs."
        - label: "Open-source / internal build"
          x: 2
          y: 4
          detail: "Potentially rigorous through Lean, but integration and production support remain internal burdens."
    approximationNotes: >-
      X is an analyst-assigned 1-5 ordinal score for distribution leverage; Y is an analyst-assigned
      1-5 ordinal score for formal-proof rigor visible in the retained evidence. Scores are not
      market shares, benchmark results, or measured distances, and unknown evidence constrains the
      placements.
    claimRefs: [CP014, CP016]
callouts:
