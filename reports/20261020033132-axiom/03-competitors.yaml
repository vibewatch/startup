      - ["Enterprise distribution leverage", "Not demonstrated in retained evidence", "Not demonstrated in retained evidence", "Large vendors have broader existing channels", "Established installed bases", "Depends on the adopting organization"]
    notes: >-
      "Supported" means the capability appears in the retained text, not that it was independently
