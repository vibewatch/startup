      - ["Wolfram Alpha / MATLAB", "Established software products; terms not retained", "Not available in assigned evidence", "Computational libraries rather than automated formal proof", "Existing licenses can delay replacement even without feature parity"]
      - ["Internal build", "Internal engineering and infrastructure spend", "Unknown", "Custom assembly around proof assistants and open tools", "Compare full loaded build cost and time-to-production against Axiom"]
    notes: >-
      No Axiom or competitor price sheet was available in the assigned pool; contract models are
      third-party descriptions and must not be read as realized revenue, ARR, or gross margin.
    claimRefs: [CP010, CP011, CP012, CP013]
figures:
