  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-model
      missingEvidence: Axiom and competitor price sheets, contract minimums, usage rates, realized discounts, and renewal terms.
      whyItMatters: Without comparable contract economics, differentiation cannot be translated into willingness to pay or defensible margin.
      diligencePath: Obtain current price books and anonymized executed contracts, then normalize price by proof task, compute use, and support level.
      relatedQuestionRefs: [QP004]
      relatedTableRefs: [TP003]
    - type: enumeration-incomplete
      severity: material
      topic: competitive-landscape
      missingEvidence: Primary product, funding, customer, and pricing evidence for each specialized formal-reasoning competitor.
      whyItMatters: The retained pool identifies competitor classes but cannot support an exhaustive or fully comparable landscape.
      diligencePath: Review official product documentation and financing records for Harmonic, Logical Intelligence, and other named specialists.
      relatedTableRefs: [TP001, TP002]
    - type: missing-source
      severity: material
      topic: independent-benchmark
      missingEvidence: Independent like-for-like measures of proof success, formalization accuracy, latency, compute cost, and human review effort.
      whyItMatters: Machine-checkable output does not establish throughput, economic advantage, or superiority over another verified system.
      diligencePath: Commission a blinded benchmark on shared Lean tasks with failure analysis and fully loaded compute and review costs.
    - type: missing-source
      severity: material
      topic: enterprise-trust
      missingEvidence: Security, compliance, deployment, data-governance, and regulatory documentation for Axiom and direct peers.
      whyItMatters: Proof correctness is only one component of enterprise trust and procurement readiness.
      diligencePath: Request security architecture, audit reports, data-retention terms, deployment options, and completed customer security reviews.
