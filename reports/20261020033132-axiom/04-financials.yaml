    notes: >-
      Stream descriptions distinguish Sacra's reported monetization plan from unavailable
      first-party pricing and from activities that are not established as revenue.
    claimRefs: [CI003, CI004, CI005, CI006]
  - id: TI002
    title: Pricing and monetization diligence
    columns:
      - Pricing component
      - List price
      - Realized price
      - Discount or contract unknown
      - Financial implication
    rows:
      - - Annual core-engine license
        - Not publicly disclosed
        - Not publicly disclosed
        - Term, seats, minimum commitment, and renewal uplift unavailable
        - Recurrence and ACV cannot be assessed
      - - Usage-based compute credits
        - Not publicly disclosed
        - Not publicly disclosed
        - Credit definition, overage rate, and volume tiers unavailable
        - Revenue-to-compute-cost spread cannot be assessed
      - - Integration and specification
        - Not publicly disclosed
        - Not publicly disclosed
        - Bundled versus separately billed work is unavailable
        - Services intensity and deployment margin cannot be assessed
      - - Support, verification warranty, or SLA
        - Not publicly disclosed
        - Not publicly disclosed
        - Liability allocation and service levels are unavailable
        - Risk pricing and support burden cannot be assessed
    notes: >-
      No retained first-party page provides a price sheet; every null requires contract-level
      diligence and must not be interpreted as zero.
    claimRefs: [CI003, CI004, CI005, CI013]
  - id: TI003
    title: Unit economics and capital adequacy scorecard
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Revenue or ARR
        - Not publicly disclosed
        - High confidence in the disclosure gap, not in a zero value
        - Establishes commercial scale and recurring quality
        - Provide monthly recognized revenue and ARR bridge by product
      - - Gross margin
        - Not publicly disclosed
        - High confidence in the disclosure gap
        - Tests whether compute and expert support scale economically
        - Provide gross-margin bridge including inference, verification, and support costs
      - - Compute cost per verified workload
        - Not publicly disclosed
        - Medium
        - Connects usage pricing to contribution margin
        - Provide cost per proof, query, or verified code unit by workload cohort
      - - CAC and payback
        - Not publicly disclosed
        - High confidence in the disclosure gap
        - Tests enterprise GTM efficiency and financing dependency
        - Provide fully loaded CAC, sales cycle, and gross-margin payback
      - - Retention and concentration
        - Not publicly disclosed
        - High confidence in the disclosure gap
        - Tests durability and single-customer exposure
        - Provide GRR, NRR, top-ten concentration, and cohort expansion
      - - Current cash and burn
        - Not publicly disclosed
        - High confidence in the disclosure gap
        - Funding raised does not determine liquidity or runway
        - Reconcile bank cash, monthly net burn, and committed infrastructure spend
      - - Debt and next-round trigger
        - Not publicly disclosed
        - Medium
        - Defines downside protection and future dilution risk
        - Provide debt covenants, obligations, runway floor, and financing milestones
    notes: >-
      Public values are disclosure gaps, not estimates; the reported funding rounds are not
      substituted for cash, revenue, profitability, or runway.
    claimRefs: [CI001, CI002, CI008, CI009, CI012, CI013, CI014, CI015]
