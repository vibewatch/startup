          detail: Revenue, direct costs, and gross margin are not publicly disclosed.
      edges:
        - from: customer-specification
          to: enterprise-contract
        - from: enterprise-contract
          to: verification-workload
        - from: verification-workload
          to: compute-delivery
        - from: verification-workload
          to: expert-support
        - from: compute-delivery
          to: gross-profit
        - from: expert-support
          to: gross-profit
    approximationNotes: >-
      This is a dependency map, not a quantified funnel or cumulative bridge; no conversion
      rate, revenue amount, or margin is inferred.
    claimRefs: [CI003, CI007, CI011, CI012]
