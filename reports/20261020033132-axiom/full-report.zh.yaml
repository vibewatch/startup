              - CP010
              - CP011
              - CP012
      - number: '3.2'
        title: 验证是最清晰的差异化，但范围有重要限制
        blocks:
          - type: paragraph
            body: >-
              Axiom 获证据支持的最强差异化，是端到端形式化证明工作流，而不是泛泛声称推理能力更强。Axios 报道，AxiomProver 将自然语言问题翻译成
              Lean，生成证明，并让每一步接受独立检查器检验。Axiom 工程页面还介绍了带验证和声明提取原语的托管 Lean
              Engine，以及开源的构造搜索工具。这种架构形成了买方可以检查的信任凭证，但本身不能证明企业安全、监管合规、集成成本，或优于 Harmonic 等系统。研究产出证据有意义，但由公司主导：Axiom 网站列出
              2026 年 9 月和 10 月的七篇带日期研究发表或文章；Axios 报道系统生成的证明与人类撰写的文章一起获期刊接收。证明吞吐量、形式化错误和总成本的独立同口径基准仍然缺失。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP010
              - CP011
              - CP012
              - CP015
