      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开描述指向多个用户群，但不能确认已签约客户。数学家和研究机构是定理证明与形式化的自然用户；量化研究员、软件保障团队和工程组织则可能是商业用户。Sacra 描述的 B2B SaaS
              模式包括年度引擎许可和按用量计费的算力额度，但 Axiom
              和任何已识别客户都未确认这一包装。企业采用时，买方可能是技术或风险负责人，用户是数学家或工程师，付款方是掌握验证预算的组织。因此，采用路径应从一个边界明确的证明任务开始，进入工作流集成，最后才到生产保障。
            claimRefs:
              - CM006
              - CM007
