  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式仍是第三方描述
        blocks:
          - type: paragraph
            body: >-
              Sacra 将 Axiom 描述为面向量化金融、研究机构和工业数学的 B2B SaaS
              企业，采用年度核心引擎许可加按用量计费的算力额度。这是现有最清晰的变现描述，但出自分析师，而非一手价目表或已执行合同。本章审阅的官方主页和新闻页没有披露目录价、实际价格、合同期限、最低承诺、折扣、收入确认政策或具名付费部署。因此，从验证工作负载到确认收入的经济桥梁虽合理，却尚不足以支持投资判断。年度许可可能提高可预测性，按算力收费可能使收入与用量匹配；但两者都不能证明当前收入结构、经常性质量或毛利。融资不纳入该收入模型，因为募集资本不是客户收入。
