  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 广泛的替代集合，而非单一同业组
        blocks:
          - type: paragraph
            body: >-
              Axiom 公开披露的最接近同业是 Harmonic：Axios 将两者都描述为少数能够以可证明正确的方式解决数学问题的 AI 初创公司。实际替代集合更广。一份现有行业资料还追踪 Logical
              Intelligence 以及 OpenAI、Google DeepMind、Anthropic 和 xAI 等前沿模型实验室；Sacra 则将 Microsoft Research、开源 Lean
              项目和成熟数学软件列为竞争路径。这些替代方案产品并不相同，却可能争夺相同的研究、推理、验证或采购预算。因此，内部开发开源证明工具是真实的自研还是采购选择；在计算和库比自主生成形式化证明更重要的场景，Wolfram
              Alpha 或 MATLAB 也可能继续充当现状。公开规模证据参差不齐：Axios 报道 Harmonic 于 2026 年 1 月融资，但分配到的证据大多没有其他竞争者的融资和客户指标。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP004
