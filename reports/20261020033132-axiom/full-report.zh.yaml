chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Axiom 于 2025 年 3 月成立，将使命描述为打造“可验证的发现引擎”：把数学推理转化为机器可检查的形式化证明，并把验证结果用作训练信号。公开资料将公司定位在 Palo Alto 或更广义的 Palo
              Alto / San Francisco 地区，但现有证据无法确认法定总部或注册地。产品论点比商业模式清晰。Axiom
              将形式化数学作为最初的试验场，并把代码、密码学、量化金融和硬件验证视为相邻应用。因此可以用一句话将 Axiom 概括为以证明为先的 AI 实验室；但定价、合同结构，以及研究访问、API
              使用和企业软件之间的边界仍未经验证。
            claimRefs:
              - CO001
              - CO002
              - CO003
