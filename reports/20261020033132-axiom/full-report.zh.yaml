  - id: FM001
    title: 市场扩张证据阶梯
    type: pyramid
    summary: 该层级按证据成熟度排序扩张路径，而非按市场规模排序。
    data:
      items:
        - label: 形式化证明基础
          value: Direct product evidence
          detail: Axiom 对外将形式化基础、证明验证和 AXLE 定位为当前底座。
        - label: 可复用的数学形式化
          value: Independent technical evidence
          detail: IEEE Spectrum 报道称，围绕 246 定理工作已形成可复用组件与素数间隔库。
        - label: 研究工作流采用
          value: Named buyer class
          detail: 文中提到研究机构与工业数学用户，但采用数量没有公开。
        - label: AI 代码验证
          value: Principal adjacency
          detail: 这个用例要求把代码属性表达成精确的数学陈述。
        - label: 垂直行业高保障工作流
          value: Named applications
          detail: 文中列出金融、芯片、航空航天、密码学和科学计算，但没有测算支出。
        - label: 广泛的已验证推理基础设施
          value: Long-term option
          detail: 证据支持其抱负，但不支持当前收入、渗透率或数值化可服务市场。
    approximationNotes: 没有任何层级被换算成货币价值；排序反映证据成熟度，以及它们与已证明核心的距离。
    claimRefs:
      - CM005
      - CM012
      - CM013
      - CM015
  - id: FP001
    title: 按分发杠杆与形式化证明严谨度的序数定位
    type: quadrant
    summary: Axiom 与 Harmonic 位于图谱中专业化形式化证明的一端，而既有企业推断出的分发杠杆更强；这些定位是受证据约束的序数判断。
    data:
      points:
        - label: Axiom
          x: 3
          'y': 5
          detail: 形式化证明证据强；企业分发尚未得到证明。
        - label: Harmonic
          x: 3
          'y': 5
          detail: 可证明数学领域的直接同业；留存的产品与渠道证据稀少。
        - label: Microsoft
          x: 5
          'y': 3
          detail: 既有企业与学术关系带来较强的推断渠道杠杆。
        - label: OpenAI / Google DeepMind
          x: 5
          'y': 3
          detail: 模型分发广泛且数学进展明显；本文未建立可比的证明严谨度。
        - label: Wolfram / MATLAB
          x: 5
          'y': 2
          detail: 已有成熟装机基础；留存证据未显示其能自主完成形式化证明。
        - label: 开源 / 内部构建
          x: 2
          'y': 4
          detail: 借助 Lean 可能具备严谨性，但集成与生产支持仍需内部承担。
    approximationNotes: X 是分析师赋予分发杠杆的 1-5 序数分数；Y 是分析师根据留存证据中可见的形式化证明严谨度赋予的 1-5 序数分数。分数不是市场份额、基准测试结果或测量距离，未知证据限制了定位。
    claimRefs:
      - CP014
      - CP016
  - id: FI001
    title: 从客户需求到毛利的经济依赖链
    type: flow
    summary: 公开证据识别出可能的变现与成本节点，但转化率和毛利水平仍不可得。
    data:
      nodes:
        - id: customer-specification
          label: 客户规格
          detail: 验证前必须先定义所需的正确性属性。
        - id: enterprise-contract
          label: 企业合同
          detail: 年度许可条款和实际成交价格均未公开。
        - id: verification-workload
          label: 验证工作量
          detail: Sacra 描述了用于推理和证明生成、按用量计费的计算额度。
        - id: compute-delivery
          label: 计算交付
          detail: 训练与验证基础设施消耗资本和运营资源。
        - id: expert-support
          label: 专家支持
          detail: 专业数学与集成劳动力可能仍是交付的一部分。
        - id: gross-profit
          label: 毛利
          detail: 收入、直接成本和毛利率均未公开披露。
      edges:
        - from: customer-specification
          to: enterprise-contract
        - from: enterprise-contract
          to: verification-workload
        - from: verification-workload
          to: compute-delivery
        - from: verification-workload
          to: expert-support
        - from: compute-delivery
          to: gross-profit
        - from: expert-support
          to: gross-profit
    approximationNotes: 这是依赖关系图，不是量化漏斗或累计桥接图；没有推算转化率、收入金额或利润率。
    claimRefs:
      - CI003
      - CI007
      - CI011
      - CI012
  - id: FE001
    title: 已披露的产品架构图
    type: stack
    summary: 将已披露工作流分成六层，把概率性解释、搜索与形式化验证及下游使用区分开来。
    data:
      layers:
        - label: 体验与接口
          modules:
            - 研究工作流
            - 程序化证明操作
        - label: 自动形式化
          modules:
            - 自然语言转 Lean
            - 陈述与目标编码
        - label: 猜想与分解
          modules:
            - 候选引理
            - 子目标规划
        - label: 证明搜索
          modules:
            - AxiomProver 推理
            - 候选证明构建
        - label: 验证运行时
          modules:
            - AXLE 托管引擎
            - Lean 证明检查
        - label: 输出与学习闭环
          modules:
            - 可读证明输出
            - 已验证数据反馈
    approximationNotes: 对已披露组件的概念性综合；层级顺序不代表测量延迟、所有权边界或完整性。
    claimRefs:
      - CE014
  - id: FU001
    title: 有证据限定的客户采用旅程
    type: journey-map
    summary: 从技术发现走向付费生产、续约和扩张时，公开证据逐步变弱。
    data:
      items:
        - label: 发现
          detail: 研究论文与媒体报道让技术用户知晓 Axiom。
          touchpoints:
            - 研究论文
            - 媒体报道
        - label: 评估
          detail: 自然语言猜想与定义进入形式化推理工作流。
          touchpoints:
            - 研究问题
            - API 探索
        - label: 验证
          detail: Axiom Prover 生成 Lean 工件，须经检查器验证后才能接受。
          touchpoints:
            - Axiom Prover
            - Lean/Mathlib 检查器
        - label: 集成
          detail: 据报道，早期用户在 Lean 开发中把 Axiom 工具与 Claude 配合使用。
          touchpoints:
            - 验证 API
            - 开发者工作流
        - label: 部署
          detail: 有明确名称的外部生产部署、实施范围和安全验收均未公开。
          touchpoints:
            - 企业集成
            - 生产审批
        - label: 续约与扩张
          detail: 留存、合同期限、使用量扩张、收入贡献和集中度均未披露。
          touchpoints:
            - 续约
            - 新增工作负载
    approximationNotes: 该顺序是有证据限定的采用路径，不是测量所得的转化漏斗；没有推算转化率、耗时或队列规模。
    claimRefs:
      - CU001
      - CU004
      - CU011
      - CU012
      - CU015
      - CU016
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 只考虑指定的公开来源中有证据支持的缓释措施后，对剩余风险进行定性分诊；将未知可能性与低可能性分开处理。
    data:
      columns:
        - id: likelihood
          label: 可能性
          detail: 有证据支持的定性可能性；未知表示公开证据不足。
        - id: impact
          label: 影响
          detail: 风险发生时可能造成的投资影响。
        - id: mitigation
          label: 缓释成熟度
          detail: 指定公开证据中可见的成熟度。
        - id: residual
          label: 剩余严重度
          detail: 已有证据支持的缓释措施落地后仍然存在的暴露。
      rows:
        - label: 规格或形式化错误
          note: 验证检查的是编码后的陈述，而不是原始要求是否正确。
          values:
            - value: Medium
            - value: High
            - value: Partial
            - value: High
        - label: 安全或数据控制失效
          note: 公开控制与事故证据不足以估算概率。
          values:
            - value: Unknown
            - value: High
            - value: Unverified
            - value: High
        - label: 商业采用延迟
          note: 机构采用与销售周期的担忧由分析师报告，并非实测队列数据。
          values:
            - value: Medium
            - value: High
            - value: Unverified
            - value: High
        - label: 验证成本或规模约束
          note: 内部请求量不能证明客户工作负载经济性或服务水平。
          values:
            - value: Unknown
            - value: High
            - value: Partial
            - value: Medium-High
        - label: 资本与里程碑错配
          note: 融资和估值有报道，但现金消耗、资金 runway、收入和优先权仍未披露。
          values:
            - value: Medium
            - value: High
            - value: Unverified
            - value: High
        - label: 命名与归因歧义
          note: 多个互不相关的 2026 年来源使用 Axiom 或 AXIOM。
          values:
            - value: Medium
            - value: Medium
            - value: Unverified
            - value: Medium
    approximationNotes: 序数标签是分析判断，不是概率；评级仅基于指定公开证据，应由公司尽调数据替代。
    claimRefs:
      - CR003
      - CR006
      - CR007
      - CR008
      - CR011
      - CR013
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 商业和安全条款缺失，抵消了技术可信度与融资能力，最终形成对价格敏感的继续研究决定。
    data:
      nodes:
        - id: technical-proof
          label: 技术证明
          detail: 形式化验证产品与已报道的证明器里程碑
        - id: capital
          label: 资本与支持
          detail: 据报道融资 $264M，机构投资者也持续参与
        - id: commercial-gap
          label: 商业证据缺口
          detail: 没有公开 ARR、利润率、留存、客户数或定价证据
        - id: terms-gap
          label: 融资条款缺口
          detail: 优先权、持股、老股转让和控制权均不可得
        - id: risk
          label: 投资判断风险高
          detail: 规模化成本与采用周期仍未解决
        - id: recommendation
          label: 继续研究
          detail: 在证据或价格改善前，按已披露估值衡量，价格仍然偏高
      edges:
        - source: technical-proof
          target: capital
          label: 强化执行逻辑
        - source: capital
          target: commercial-gap
          label: 未能弥合
        - source: commercial-gap
          target: terms-gap
          label: 叠加
        - source: terms-gap
          target: risk
          label: 提高下行不确定性
        - source: risk
          target: recommendation
          label: 决定
    approximationNotes: 该流程是定性的，不代表概率、转化率或数值化估值桥接。
    claimRefs:
