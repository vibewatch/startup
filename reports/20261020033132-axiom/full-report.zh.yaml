  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：先做可验证推理，再谈广义 AI
        blocks:
          - type: paragraph
            body: >-
              站得住脚的市场边界，应从数学发表和定理形式化开始；对 AI 生成代码做可规模化验证，是最清晰的商业相邻方向。边界包括 AI
              辅助定理证明、自动形式化、证明变换，以及其所需属性可以写成数学命题的软件验证流程；也包括量化金融、芯片设计、密码学、科学计算和软件保障中的部分工业数学应用。除非买方明确为机器可检查的推理付费，否则不包括广义生成式
              AI、通用代码助手和教育科技。更窄的定义避免仅因验证未来可能有用，就把每一笔 AI 或软件支出都视为可争取市场。
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM011
      - number: '2.2'
        title: 市场规模：有需求信号，但没有市场规模数值
        blocks:
          - type: paragraph
            body: >-
              分配到的证据没有提供 Axiom 所处品类可信的市场规模、CAGR、装机基数、单价或可服务工作负载数量。投资人支持和行业评论显示，随着 AI
              编写更多软件，正确性越来越紧迫；但融资额不是客户需求、收入，也不是可用于商业化的现金。自下而上的模型需要目标团队数量、年度验证支出、符合条件的工作负载、部署频率和 Axiom
              可获得的份额，这些均未公开。稳妥做法是采用嵌套的规模视角，而不是给出数值
              TAM/SAM/SOM：形式化数学工作流是有证据支持的核心，代码验证是主要相邻方向，更广泛的工业保障仍是一个尚未证明时间点和预算归属的选项。
            claimRefs:
