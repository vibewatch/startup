              - CM009
              - CM011
      - number: '2.4'
        title: 增长驱动、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              最强的驱动因素，是随着 AI 生成软件扩大，表面正确的代码与能够证明满足明确属性的代码之间差距越来越大。Axiom 据报完成了 246 定理的形式化，并建立可复用的 prime-gaps
              库，说明其正从孤立的基准答案走向可重复的证明基础设施。约束同样重要：形式化验证历来需要稀缺专家；系统正确性仍依赖忠实的规格说明和可靠的验证栈；Sacra
              还警告，问题复杂度上升会让算力需求急剧增加。因此，自动形式化是核心采用瓶颈，而非次要功能。估值支撑应建立在付费生产使用和可重复的集成经济性上，但分配到的证据均未披露这些内容。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM010
              - CM012
              - CM013
