      - - 外部资本与里程碑预期
        - A 轮投资人及未来资本提供方
        - 为研究、算力与商业化提供资金
        - 据报道完成 $200 million 轮融资；消耗、现金跑道与优先权未披露
        - 里程碑落后于融资隐含的规模，未来资本变得苛刻
        - 高
        - 董事会批准的运营计划、下行情景现金跑道、里程碑闸门与资本表审查
        - 高
    notes: 依赖集中度大多未披露；登记表把缺失的交易对手方和运营指标保留为缺口，而不是把已募资金视为可用现金。
    claimRefs:
      - CR001
      - CR002
      - CR007
      - CR008
      - CR009
      - CR010
      - CR012
      - CR015
  - id: TV001
    title: 建议摘要
    columns:
      - 决策字段
      - 当前判断
      - 证据依据
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 技术与融资证据强于商业披露
        - 暂不为新的进入交易做投资判断
      - - 置信度
        - 中
        - 融资估值标记得到交叉验证，但运营数据缺失
        - 该判断会随证据变化
      - - 风险评级
        - 高
        - 算力扩张与采用周期风险仍未解决
        - 要求下行保护与里程碑
      - - 估值立场
        - 偏高
        - $1.6B 是融资估值标记，但未披露收入倍数
        - 要求价格或证据改善
      - - 回报与退出
        - 公开信息不足以支撑
        - 收入质量、所有权条款与买方证据均不可得
        - 暂缓目标回报与持有期判断
    notes: 这些判断基于保留的 2026 年 10 月证据集；没有公开 ARR、利润率、留存、现金、消耗或资本表证据支持定价回报模型。
    claimRefs:
      - CV001
      - CV002
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
  - id: TV002
    title: 正论与反论
    columns:
      - 立场
      - 论点
      - 证据状态
      - 哪些信息会改变判断
    rows:
      - - 正论
        - 形式化验证直接解决对正确性敏感的工作负载
        - 公司与投资人支持
        - 独立的生产环境可靠性证据
      - - 正论
        - AXLE 与证明器开辟了超越研究论文的产品路径
        - 公司声称，且有第三方描述
        - 使用量、付费转化与集成数据
      - - 正论
        - 报道的技术里程碑表明其研究执行力非同寻常
        - 第三方报道
        - 复现结果与客户关联结果
      - - 正论
        - 专业投资人和董事会参与改善资本与招聘渠道
        - 合作方报道
        - 治理与保留事项审查
      - - 反论
        - 没有保留的来源披露可用的收入倍数或运营模型
        - 独立公司画像与官方页面审阅
        - 经审计的财务与队列数据包
      - - 反方论点
        - 证明成本与谨慎的买方采用节奏可能推迟商业化
        - 独立分析师风险评估
        - 已测算的成本曲线与签约部署
    notes: 投资人来源归为合作方证据，而非独立验证；技术里程碑不能替代客户、收入或利润率证明。
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行风险或触发条件
    rows:
      - - 乐观
        - 生产部署、重复扩张与有吸引力的证明计算经济性得到独立验证
        - $1.6B 融资估值上方的溢价变得有据可依；公开信息没有精确区间
        - 付费续约与持续改善的单位成本
        - 技术声誉无法转化为可重复的合同
      - - 基准
        - 研究产出延续，但商业指标仍属私有或处于早期
        - 融资估值仍只是参考，不是底价或内在价值
        - 发表物与试点增加，但没有队列披露
        - 资本消耗速度快于商业证明积累速度
      - - 悲观
        - 采用缓慢，验证成本随任务复杂度上升
        - 面临大幅折价或下轮融资风险；无法支持精确区间
        - 销售周期长、付费转化弱，或成本曲线不利
        - 在形成持久收入证据前融资估值重置
    notes: 这些是条件情景，不是数值预测，因为留存资料中没有公开收入、利润率、烧钱速度、现金跑道、持股、优先权和退出倍数等输入。
    claimRefs:
      - CV012
      - CV014
      - CV015
      - CV016
figures:
  - id: FO001
    title: 公开里程碑时间线
    type: timeline
    summary: 从成立到 2026 年 10 月公开报道的融资、研究、产品、发表物和媒体里程碑。
    data:
      items:
        - date: 2025-03
          label: 成立
          detail: 第三方公司画像将 Axiom 的成立时间定在 2025 年 3 月。
          tone: neutral
          claimRefs:
            - CO001
        - date: 2025-09
          label: 早期定理证明结果
          detail: 第三方公司画像称，9 月至 10 月期间出现两项 Erdős 问题成果，并招募了 Ken Ono。
          tone: positive
          claimRefs:
            - CO011
            - CO014
        - date: 2025-10
          label: $64M 种子轮
          detail: 官方与第三方来源称，$64M 种子轮对应 $300M 估值。
          tone: positive
          claimRefs:
            - CO006
        - date: 2025-12
          label: Putnam 满分
          detail: Axiom 与第三方公司画像称取得 12/12 满分。
          tone: positive
          claimRefs:
            - CO014
        - date: 2026-03
          label: $200M A 轮
          detail: 据报道，本轮融资对应 $1.6B+ 投后估值。
          tone: positive
          claimRefs:
