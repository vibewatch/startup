              - CV013
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 对价格敏感的建议
            body: 继续研究，不要买入：要求提供商业客户群、证明计算的经济性、经审计的流动性以及完整优先权和持股条款，或等待明显更低的入场价格。
            calloutType: recommendation
