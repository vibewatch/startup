              - CP016
      - number: '3.3'
        title: 分销与证明经济性可能比基准创新更重要
        blocks:
          - type: paragraph
            body: >-
              现有证据没有披露 Axiom 的目录价、实际合同金额或产品包装。Sacra 描述了拟议的年度许可加用量额度模式，但这是一份第三方报道，不是 Axiom
              发布的价目表。因此，商业持久性取决于验证结果是否足以覆盖更高的集成和算力成本。Microsoft 可以把相邻能力打包进现有企业渠道；开源 Lean
              项目可能使基础证明组件商品化；成熟数学软件已经拥有装机用户和库。相对于早期市场，Axiom 的融资能力很强，现有标题报道称其融资 $200 million，但融资不是分销，也不是客户证明。Sacra
              关于形式化证明计算会随问题复杂度上升而变得更昂贵的警告，进一步说明有必要核查吞吐量和单位成本。护城河应视为有条件的：专有证明数据和工作流集成可以积累，但公开证据没有证明切换成本或锁定效应。
            claimRefs:
              - CP004
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
