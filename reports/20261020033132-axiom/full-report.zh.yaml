              引述一位外部计算机科学教授警告，软件正确性不像数学答案那样总能被明确规定。若客户在证明工作负载运行前需要大量规格、集成和验证工作，即使自动验证技术上成功，交付成本和销售周期仍可能很高。现有来源没有量化毛利率、单个证明成本、利用率、CAC、回本期、留存或客户集中度。因此，无法据此得出用量增长会带来有吸引力的单位经济性。
