              公开证据支持有条件的情景，而不是精确的概率加权估值区间。乐观情景要求有独立可验证的生产部署、有吸引力的单位经济性，并且能从数学研究扩展出可重复的增长；只有这样，最后一轮融资定价之上才有分析依据。基准情景是技术继续进步，但商业披露不足；这让上一轮融资成为参考点，却不是价值底线。悲观情景是采用周期更慢或证明算力经济性不利，迫使估值大幅重置。一份资料列出的历史软件
              IPO 倍数在阶段、时期或商业模式上都不匹配，不能用来拼出当前倍数。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 决策、退出准备度与论点失效触发条件
        blocks:
          - type: paragraph
            body: >-
              当前结论是继续研究，信心中等、风险高、估值偏贵。Axiom
              具备可信的技术和人才信号、积极参与的机构投资人以及充足资本，但把这些优势连接到目标回报所需的证据仍属私有。审阅客户群合同、续约和扩张数据、毛利与推理成本细节、经审计现金和烧钱、完整融资条款后，结论才可能改善。若技术结果无法转化为生产合同、每个有效证明的验证成本恶化、反复出现安全或正确性故障，或商业验证前融资重置，论点就会失效。没有收入质量、持股、优先权和潜在买方证据，退出准备度仍无法量化。
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
