  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: commercial-disclosure
      missingEvidence: >-
        Customer-level contract values, paid deployment count, renewal and expansion cohorts,
        gross margin, proof-compute unit cost, cash, burn, and runway.
      whyItMatters: >-
        These inputs determine whether technical progress can support the reported financing mark
        and any target return.
      diligencePath: >-
        Review audited financials, monthly management accounts, signed contracts, cohort exports,
        infrastructure invoices, and customer reference calls in a secure data room.
      relatedQuestionRefs: [QV005]
      relatedTableRefs: [TV001, TV003]
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: >-
        Fully diluted capitalization, liquidation preferences, option-pool changes, secondaries,
        anti-dilution terms, board rights, protective provisions, and pro rata rights.
      whyItMatters: >-
        Headline post-money valuation and round proceeds do not reveal investor ownership,
        preference overhang, control, or common-share downside.
      diligencePath: >-
        Obtain the signed financing documents, capitalization table, option ledger, side letters,
        board minutes, and a counsel-prepared preference waterfall.
      relatedQuestionRefs: [QV005, QV009]
      relatedTableRefs: [TV001]
    - type: missing-source
      severity: material
      topic: exit-comparables
      missingEvidence: >-
        Stage- and business-model-matched transactions with contemporaneous revenue, growth,
        margin, retention, and valuation denominators.
      whyItMatters: >-
        Historical software IPO multiples are not a valid substitute for comparable private
        verified-reasoning businesses and cannot support a precise exit range.
      diligencePath: >-
        Commission a transaction-comparable study and reconcile it to management's operating plan,
        financing waterfall, likely strategic buyers, and realistic exit timing.
      relatedQuestionRefs: [QV005]
      relatedTableRefs: [TV003]
