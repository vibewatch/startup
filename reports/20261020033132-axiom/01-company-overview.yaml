schemaVersion: "report-v2"
artifact: company-overview
slug: axiom
runDate: 2026-10-20
company:
  name: Axiom
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Axiom is a young verified-reasoning company with a public record of rapid technical
    and financing milestones: it reports a March 2026 $200 million Series A at a
    $1.6 billion-plus post-money valuation after a $64 million seed. The public record
    is much weaker on legal headquarters, governance, customer traction, revenue, and
    current staffing, so those items remain diligence gaps rather than cover metrics.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Axiom was founded in March 2025 and describes its mission as building a
      "verified discovery engine": an AI system that converts mathematical reasoning
      into machine-checkable formal proofs and uses verification as a training signal.
      Public profiles place the company in Palo Alto or the broader Palo Alto/San
      Francisco area, but the retained evidence does not establish a legal headquarters
      or incorporation jurisdiction. The product thesis is clearer than the commercial
      model. Axiom presents formal mathematics as the initial proving ground and code,
      cryptography, quantitative finance, and hardware verification as adjacent
      applications. This supports a one-line description of Axiom as a proof-first AI
      lab, while pricing, contract structure, and the boundary between research access,
      API usage, and enterprise software remain unverified.
    claimRefs: [CO001, CO002, CO003]
    tableRefs: [TO001]
  - id: capital-and-public-scale
    title: Capital formation and public scale
    body: >-
      The strongest public scale evidence concerns financing, not operations. Axiom's
      official fundraising page reports a $64 million seed at a $300 million valuation
      in October 2025 and a $200 million Series A at a $1.6 billion-plus post-money
      valuation in March 2026. Multiple third-party profiles repeat those round sizes
      and imply $264 million of cumulative funding, although funding raised should not
      be treated as cash remaining. Menlo Ventures is reported as the Series A lead,
      with Greycroft, Madrona, B Capital, and Toyota Ventures participating. By
      contrast, public staffing estimates cluster around roughly 20 to 30-plus people
      and are not consistent enough for a precise current headcount. No retained source
      supplies ARR, revenue, customer count, profitability, burn, or runway.
    claimRefs: [CO004, CO005, CO006, CO007, CO008, CO012, CO013]
    tableRefs: [TO003]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Public profiles identify Carina Hong as founder and CEO and Shubho Sengupta as
      co-founder and CTO. Hong's mathematics background and Sengupta's reported AI and
      systems experience fit Axiom's combination of formal reasoning and model
      engineering. Ken Ono's recruitment as founding mathematician adds domain
      credibility and a bridge to research validation. The same evidence also points
      to concentration risk: the public story is unusually dependent on a small number
      of technical leaders and on Hong's mission framing. The retained materials do not
      disclose the board, voting rights, founder ownership, investor protective
      provisions, succession plan, or delegated operating leadership. Consequently,
      this chapter treats functional coverage as visible but governance quality and
      key-person mitigation as unverified.
    claimRefs: [CO009, CO010, CO011]
    tableRefs: [TO002]
  - id: milestones-and-evidence-quality
    title: Milestones and evidence quality
    body: >-
      Axiom's public chronology is unusually dense for a company founded in 2025:
      financing, a perfect Putnam score, a reported resolution of a long-standing
      conjecture, an API launch, and continuing publications all appear within roughly
      eighteen months. These events demonstrate fundraising velocity and research
      output, but they do not establish product-market fit. The official press index is
      company-curated, while independent profiles often repeat company claims without
      disclosing underlying customer or financial evidence. Sacra also highlights
      computational scaling and potentially slow enterprise adoption as material
      constraints. No retained evidence identifies a production customer, quantified
      customer outcome, regulatory approval, material partnership, outage, lawsuit, or
      board-level change. The timeline should therefore be read as a chronology of
      public claims and events, not as proof of commercial maturity.
    claimRefs: [CO014, CO015, CO016]
    figureRefs: [FO001]
