    title: Financing visibility exceeds operating visibility
    body: >-
      Axiom's round sizes and valuation are well publicized, but the retained evidence
      does not disclose ARR, customer count, gross margin, burn, runway, board rights,
      or a verified current headcount.
    claimRefs: [CO004, CO005, CO007, CO012, CO013]
