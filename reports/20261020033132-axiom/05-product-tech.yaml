figures:
  - id: FE001
    title: Disclosed product architecture map
    type: stack
    summary: A six-layer view of the disclosed workflow, separating probabilistic interpretation and search from formal verification and downstream use.
    data:
      layers:
        - label: Experience and interfaces
          modules: ["Research workflow", "Programmatic proof operations"]
        - label: Auto-formalization
          modules: ["Natural language to Lean", "Statement and goal encoding"]
        - label: Conjecture and decomposition
          modules: ["Candidate lemmas", "Subgoal planning"]
        - label: Proof search
          modules: ["AxiomProver reasoning", "Candidate proof construction"]
        - label: Verification runtime
          modules: ["AXLE hosted engine", "Lean proof checking"]
        - label: Output and learning loop
          modules: ["Readable proof output", "Verified-data feedback"]
    approximationNotes: "Conceptual synthesis of disclosed components; layer order does not imply measured latency, ownership boundaries, or completeness."
    claimRefs: [CE014]
callouts:
  - calloutType: strength
    title: Verification is a real architectural boundary
    body: The disclosed stack uses Lean checking as an acceptance gate rather than presenting generated mathematical text as self-validating.
    claimRefs: [CE005, CE006, CE007]
  - calloutType: risk
    title: Formal validity is not specification validity
    body: Public evidence does not quantify whether the formal statement faithfully captures the user's original intent, leaving auto-formalization as the central technical diligence question.
    claimRefs: [CE012]
