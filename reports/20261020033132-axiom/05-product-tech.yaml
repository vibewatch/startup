chapter:
  number: 5
  title: Product & Technology
  summary: Axiom's disclosed product stack centers on AxiomProver, the hosted AXLE Lean engine, and Axplorer, with formalization, proof search, kernel checking, and human-readable output forming the core workflow. Public evidence supports real internal usage and an active research pipeline, but production-grade deployment, security, reliability, integration, and independent performance evidence remain thin.
sections:
  - id: product-surface
    title: Product surface and customer workflow
    body: >-
      Axiom presents a product family rather than a single end-user application. AXLE is the clearest
      infrastructure product: Axiom describes it as a hosted Lean service with proof-verification and
      declaration-extraction primitives, while independent profiles also describe API access for proof
      transformations. AxiomProver is the reasoning system that constructs and checks formal proofs, and
      Axplorer is an open-source generative tool for discovering constrained mathematical constructions.
      The practical workflow is therefore problem intake, formalization, conjecture or lemma generation,
      proof construction, machine checking, and readable output. What is public establishes product intent
      and named components, but not buyer-ready packaging, supported integrations, service tiers, or
      realized user outcomes.
    claimRefs: [CE001, CE002, CE003, CE004, CE005]
    tableRefs: [TE001, TE002]
  - id: architecture
    title: Architecture and operating model
    body: >-
      The disclosed architecture separates probabilistic generation from deterministic checking. Third-party
      descriptions consistently place natural-language-to-Lean formalization ahead of conjecture generation
      and proof search, with Lean acting as the acceptance gate before proofs are rendered for people or
      returned through an interface. This is technically meaningful because a generated step is not accepted
      merely because it is plausible; it must satisfy the formal checker. The differentiation is the closed
      generation-verification loop and the prospect of feeding verified proofs back into training. However,
      the public record does not specify model architecture, training corpus controls, proof-search compute,
      failure taxonomy, or how specification errors are detected before a formally valid but misframed theorem
      is accepted.
    claimRefs: [CE005, CE006, CE007, CE008, CE014]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity
    title: Maturity, differentiation, and roadmap
    body: >-
      The strongest maturity signal is operational rather than commercial: Axiom says AXLE has served millions
      of requests inside the company, including model training and AxiomProver work, and an independent company
      profile repeats the millions-of-requests claim. The official site also shows an active publication stream
      through October 2026, while the press index records sustained external coverage during 2026. These signals
      support a functioning research and internal-infrastructure stack, not a conclusion that AXLE or
      AxiomProver meets enterprise production requirements. The roadmap broadens from formal mathematics toward
      verified software and technical reasoning, but public materials do not provide release commitments,
      customer acceptance criteria, or independent comparisons of throughput, accuracy, and integration cost.
    claimRefs: [CE002, CE009, CE010, CE011]
  - id: controls-and-dependencies
    title: Dependencies, trust, and technical diligence
    body: >-
      Lean is both the trust anchor and a major dependency: it can check whether a formal proof follows from
      its encoded premises, but the retained evidence does not show how Axiom validates that natural-language
      intent was formalized correctly. A separate 2026 technical paper does not evaluate Axiom, but it
      independently characterizes pre-formalization as the bottleneck for applying Lean-based provers to
      natural-language questions. The system also depends on scarce formal-methods talent, proof-search compute,
      curated verified data, and reliable hosted execution. Public official pages reviewed for this chapter do
      not disclose authentication design, tenant isolation, encryption, data retention, privacy terms, security
      certifications, uptime objectives, incident history, support commitments, or a public status surface.
      Those omissions do not prove weak controls; they make security and reliability underwritable from public
      evidence and require direct technical diligence before production use.
    claimRefs: [CE006, CE008, CE012, CE013, CE015]
