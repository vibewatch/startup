  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: controls
      missingEvidence: Production security architecture, privacy terms, certifications, tenant-isolation design, data retention, access controls, and incident-response records.
      whyItMatters: Hosted proof workloads may contain proprietary mathematics or code, and formal correctness does not address confidentiality, availability, or operational control quality.
      diligencePath: Request the security package, architecture review, penetration-test summary, privacy and retention policies, subprocessor list, and recent incident log.
      relatedQuestionRefs: [QE006]
      relatedTableRefs: [TE001, TE003]
    - type: private-evidence-only
      severity: material
      topic: technical-validation
      missingEvidence: Independent benchmark results and production telemetry for formalization accuracy, proof success rate, throughput, latency, compute cost, abstention, and specification errors.
      whyItMatters: Lean can validate a formal proof without proving that the formal statement matches the user's intended problem, and commercial viability depends on cost and reliability.
      diligencePath: Run a blinded benchmark on representative customer tasks, audit failed and misformalized cases, and inspect production latency, cost, and availability distributions.
      relatedQuestionRefs: [QE010]
      relatedTableRefs: [TE002, TE003]
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: A verified Axiom-operated public repository, package registry, SDK documentation, status page, or practitioner-community usage signal.
      whyItMatters: Public developer artifacts would help validate integration readiness, release cadence, issue handling, and adoption outside company-controlled demonstrations.
      diligencePath: Ask Axiom for canonical repositories, API documentation, SDK packages, changelog, status history, and external developer references.
      relatedQuestionRefs: [QE004, QE010]
