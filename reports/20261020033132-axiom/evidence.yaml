evidenceGaps:
  - type: missing-source
    severity: material
    topic: headquarters
    missingEvidence: Legal entity name, incorporation jurisdiction, and verified principal office.
    whyItMatters: Identity and jurisdiction determine contracting, tax, employment, and litigation diligence.
    diligencePath: Request formation documents, current good-standing certificates, and the principal-office lease.
    relatedQuestionRefs:
      - QO001
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Current ARR, revenue, customer count, retention, gross margin, burn, runway, and contract structure.
    whyItMatters: Financing and technical milestones cannot establish commercial traction or capital efficiency.
    diligencePath: >-
      Obtain monthly management accounts, bank statements, customer-level revenue cohorts, signed contracts, and the
      operating plan.
    relatedQuestionRefs:
      - QO004
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Full executive roster, board composition, delegated authorities, succession coverage, and leadership retention
      terms.
    whyItMatters: A small technical founding team creates key-person and governance concentration risk.
    diligencePath: Review the organization chart, board materials, employment agreements, equity grants, and succession plan.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: investors
    missingEvidence: >-
      Fully diluted cap table, investor ownership, preferences, board rights, debt, secondaries, and option-pool
      history.
    whyItMatters: Headline valuation and funding do not reveal control, liquidation economics, or future dilution.
    diligencePath: Obtain the cap table, charter, financing documents, side letters, debt schedule, and secondary-transfer ledger.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: commercial-proof
    missingEvidence: >-
      Named production customers, deployment scope, quantified outcomes, renewal evidence, and referenceable buyer
      testimony.
    whyItMatters: Research output and press coverage do not demonstrate repeatable product-market fit.
    diligencePath: >-
      Select customer references from the revenue ledger and validate implementation, security review, ROI, and renewal
      intent.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      No assigned source provides a category TAM, SAM, SOM, CAGR, customer count, workload denominator, or defensible
      unit-price basis.
    whyItMatters: >-
      Without denominators and pricing, market magnitude and attainable share cannot be separated from broad AI
      narratives.
    diligencePath: >-
      Obtain management's customer pipeline by segment, contracted pricing, eligible workload counts, compute
      consumption, and a reconciled bottoms-up market model.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-adoption
    missingEvidence: >-
      No named production customer, procurement record, signed contract, renewal cohort, or budget-owner interview is
      present in the assigned evidence.
    whyItMatters: Named applications do not establish willingness to pay, integration timing, or repeatable enterprise demand.
    diligencePath: >-
      Review redacted contracts and pipeline data, then interview reference customers across research, finance, and
      software-assurance segments.
    relatedQuestionRefs:
      - QM003
      - QM007
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: verification-economics
    missingEvidence: >-
      Proof throughput, specification effort, integration cost, compute cost, and false-acceptance or failure rates are
      not quantified for production workloads.
    whyItMatters: These measures determine ROI, gross-margin potential, and whether verification can move beyond specialist use.
    diligencePath: >-
      Run a paid pilot on representative customer code with pre-agreed throughput, correctness, labor, compute, and
      deployment-cost benchmarks.
    relatedQuestionRefs:
      - QM004
      - QM005
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-model
    missingEvidence: Axiom and competitor price sheets, contract minimums, usage rates, realized discounts, and renewal terms.
    whyItMatters: >-
      Without comparable contract economics, differentiation cannot be translated into willingness to pay or defensible
      margin.
    diligencePath: >-
      Obtain current price books and anonymized executed contracts, then normalize price by proof task, compute use, and
      support level.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: material
    topic: competitive-landscape
    missingEvidence: Primary product, funding, customer, and pricing evidence for each specialized formal-reasoning competitor.
    whyItMatters: The retained pool identifies competitor classes but cannot support an exhaustive or fully comparable landscape.
    diligencePath: >-
      Review official product documentation and financing records for Harmonic, Logical Intelligence, and other named
      specialists.
    relatedTableRefs:
      - TP001
      - TP002
  - type: missing-source
    severity: material
    topic: independent-benchmark
    missingEvidence: >-
      Independent like-for-like measures of proof success, formalization accuracy, latency, compute cost, and human
      review effort.
    whyItMatters: >-
      Machine-checkable output does not establish throughput, economic advantage, or superiority over another verified
      system.
    diligencePath: >-
      Commission a blinded benchmark on shared Lean tasks with failure analysis and fully loaded compute and review
      costs.
  - type: missing-source
    severity: material
    topic: enterprise-trust
    missingEvidence: Security, compliance, deployment, data-governance, and regulatory documentation for Axiom and direct peers.
    whyItMatters: Proof correctness is only one component of enterprise trust and procurement readiness.
    diligencePath: >-
      Request security architecture, audit reports, data-retention terms, deployment options, and completed customer
      security reviews.
  - type: private-evidence-only
    severity: material
    topic: unit-economics-gap
    missingEvidence: >-
      Revenue, ARR, gross margin, workload-level compute cost, service-delivery cost, CAC, payback, retention, and
      customer concentration.
    whyItMatters: >-
      These inputs determine whether technical usage becomes durable, capital-efficient gross profit rather than
      compute- and services-intensive activity.
    diligencePath: >-
      Obtain monthly management accounts, revenue recognition policies, customer cohorts, cloud invoices, support
      allocations, and a workload-level contribution-margin bridge.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, monthly net burn, committed infrastructure spend, debt, covenants, runway floor, and
      next-round trigger.
    whyItMatters: >-
      Funding raised is not cash available, so public round totals cannot establish runway or the probability and timing
      of further dilution.
    diligencePath: >-
      Reconcile bank statements to the general ledger and build a monthly base, upside, and downside cash forecast
      through the next financing milestone.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: gtm-evidence
    missingEvidence: >-
      Executed customer contracts, invoices, deployment dates, buyer references, sales cycle, paid-versus-pilot status,
      and support obligations.
    whyItMatters: Without contract evidence, neither the proposed license-plus-usage model nor revenue quality can be verified.
    diligencePath: >-
      Sample the customer ledger and contracts, then confirm paid production status and renewal intent directly with
      reference customers.
    relatedQuestionRefs:
      - QI002
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: controls
    missingEvidence: >-
      Production security architecture, privacy terms, certifications, tenant-isolation design, data retention, access
      controls, and incident-response records.
    whyItMatters: >-
      Hosted proof workloads may contain proprietary mathematics or code, and formal correctness does not address
      confidentiality, availability, or operational control quality.
    diligencePath: >-
      Request the security package, architecture review, penetration-test summary, privacy and retention policies,
      subprocessor list, and recent incident log.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: technical-validation
    missingEvidence: >-
      Independent benchmark results and production telemetry for formalization accuracy, proof success rate, throughput,
      latency, compute cost, abstention, and specification errors.
    whyItMatters: >-
      Lean can validate a formal proof without proving that the formal statement matches the user's intended problem,
      and commercial viability depends on cost and reliability.
    diligencePath: >-
      Run a blinded benchmark on representative customer tasks, audit failed and misformalized cases, and inspect
      production latency, cost, and availability distributions.
    relatedQuestionRefs:
