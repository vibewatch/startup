  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              KnowBe4 delivers a human-risk workflow rather than a single training catalog. Its current platform groups
              attack simulation and training, email and collaboration security, and agent security under three pillars,
              with AIDA and the Risk Score acting as common control layers. The customer workflow starts with importing
              or synchronizing users, assigning role- and risk-specific training, running phishing simulations, and
              measuring behavior through reporting and risk scores. It can then extend into incident response through
              PhishER Plus and into real-time interventions when a security event or risky action is detected. This
              breadth is commercially meaningful because it lets a security team connect awareness, detection, and
              remediation in one operating surface, but it also raises integration and administration demands that the
              public record does not quantify.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE007
              - CE009
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE008
              - CE010
              - CE014
      - number: '5.2'
        title: Operating architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              The observable architecture is a layered SaaS operating model. AIDA automates campaign creation and
              personalization, while the SmartRisk Engine is described as adapting training and testing to real-time
              user behavior. Content, simulations, risk scoring, reporting, and email-response functions are connected
              through integrations such as directory synchronization, APIs, SCORM content, Microsoft 365, and
              security-stack event feeds. Independent coverage describes a feedback loop in which technical alerts
              adjust a user risk profile and trigger contextual coaching, which is a more specific mechanism than
              generic claims about AI. The evidence still does not establish service-level objectives, tenant isolation,
              model-evaluation controls, data retention, or independent security certifications; those are underwriting
              gaps rather than assumptions to fill from marketing copy.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
