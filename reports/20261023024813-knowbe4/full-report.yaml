              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP014
      - number: '3.3'
        title: Packaging, switching cost, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not support a precise price ranking. Vendr independently describes per-user annual
              subscriptions whose outcomes vary with tier, user count, term, add-ons, and support, while usecure and
              Keepnet characterize packaging from a competitor perspective (SP003, SP007, SP013). Their own packaging
              claims are directional as well: usecure describes a per-user, per-month model with multiple modules
              included, while Keepnet describes modular packages, individual products, or pay-as-you-go purchasing.
              Brightside says its audit log and employee portal are standard on all plans but does not publish retained
              price evidence (SP010). Switching friction is more tangible than price advantage: directory
              synchronization, campaign history, reporting workflows, content assignments, integrations, and user risk
              baselines all create migration work. Yet that is workflow lock-in, not proof of pricing power. Buyers can
              multi-home during a bounded pilot, compare the same cohort, and migrate at renewal if behavior outcomes
              and administrative effort justify the change. Written quotes, entitlements, renewal terms, and migration
              estimates remain necessary to test that hypothesis.
            claimRefs:
              - CP007
              - CP008
              - CP010
              - CP013
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP013
              - CP016
      - number: '3.4'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Customer evidence supports utility but not an unassailable moat. TrustRadius reviewers praise content
              breadth, campaign customization, and usability, while its synthesis says 6% reported difficulty
              quantifying exact ROI and records concerns about simulation authenticity (SP009). A KnowBe4-sponsored
              study by Hobson & Company reports large time savings and a modeled three-year ROI for a 2,000-seat
              organization, but the relationship, assumptions, and interview-based method mean the result is not an
              independent category benchmark (SP004). Competitor pages consistently target content fatigue,
              administration, opaque packaging, non-email attack coverage, and behavior-level reporting; their
              commercial incentives lower evidentiary weight but reveal where challengers expect buyers to switch
              (SP002, SP003, SP007, SP008, SP010). The resulting moat judgment is conditional: KnowBe4's scale, product
              breadth, and accumulated workflows are defensible distribution assets, while baseline training content and
              email simulation can commoditize. Durability depends on demonstrating independently comparable risk
              reduction across channels without increasing buyer workload or total contract cost.
            claimRefs:
              - CP005
              - CP006
              - CP009
              - CP010
              - CP012
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth creates workflow-based switching friction
            body: >-
              KnowBe4's broad product surface, installed-base claim, content footprint, integrations, and accumulated
              campaign and reporting workflows can raise migration effort even without contractual lock-in.
            calloutType: strength
            claimRefs:
