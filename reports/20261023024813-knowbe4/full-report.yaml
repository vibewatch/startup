chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              KnowBe4 was founded in 2010 and built its initial position around cloud-delivered security-awareness
              training and simulated phishing. Its current proposition spans attack simulation and training, email and
              collaboration security, real-time coaching, and AI-agent security, with AIDA and a proprietary risk score
              presented as connective technology. The company describes this as digital-workforce security, while
              third-party coverage characterizes the strategic move as an evolution from compliance-oriented training
              toward human-risk management. The platform is sold as recurring software and services to organizations,
              but public evidence in this pool does not establish a current audited revenue figure, detailed segment
              economics, or a complete customer mix.
            claimRefs:
              - CO001
              - CO002
              - CO004
      - number: '1.2'
        title: Ownership, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              KnowBe4 ceased to be a public company when Vista Equity Partners completed its acquisition in February
              2023. The transaction source identifies founder Stu Sjouwerman as chairman and chief executive at closing,
              while current 2026 company messaging quotes Bryan Palma as chief executive. This indicates a material
              leadership transition since the take-private, although the assigned sources do not provide a complete
              board roster, ownership waterfall, or formal governance disclosures. The private structure increases the
              importance of diligence on sponsor control, management incentives, and key-person dependence rather than
              treating the historical public-company record as current.
