  - id: FM001
    title: Evidence-constrained market sizing pyramid
    summary: >-
      The market expands from a documented phishing problem to security-awareness workflows and adjacent human-risk
      controls, while monetary TAM, SAM, and SOM remain unverified.
    type: pyramid
    data:
      nodes:
        - id: problem
          label: Phishing and social-engineering problem
          value: Documented
          note: CISA and NIST guidance
        - id: sat
          label: Security-awareness and phishing simulation
          value: Core category
          note: Training, simulation, measurement, and reporting
        - id: hrm
          label: Human-risk management
          value: Expanding
          note: Coaching, behavioral signals, and interventions
        - id: adjacent
          label: Email, collaboration, and AI-agent controls
          value: Adjacent
          note: Not counted as standalone SAT market revenue
        - id: monetary
          label: TAM / SAM / SOM dollars
          value: Unavailable
          note: No comparable public denominator
        - id: boundary
          label: Evidence boundary
          value: Do not infer monetary market size
          note: Sizing gap remains open
