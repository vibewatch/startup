              - CE010
      - number: '5.3'
        title: Differentiation, trust, and implementation risk
        blocks:
          - type: paragraph
            body: >-
              KnowBe4's differentiation is a combination of accumulated phishing and training data, a large localized
              content library, behavioral scoring, and a widening response surface. Its own materials cite more than 15
              years of threat intelligence and user data, while external technical coverage describes behavioral
              baselines, role-aware personalization, and integration with existing security systems. User reviews
              corroborate ease of deployment, directory integration, recurring simulations, and reporting, but also
              identify stale or tier-gated content, clunky administration, limited score customization, and uncertainty
              about ROI. The result is a credible product wedge with real workflow utility, not proof of a defensible
              moat. Diligence should focus on independent outcome measurement, customer-level reliability, privacy and
              model governance, and the operational cost of adding email, collaboration, and AI-agent controls to an
              existing stack.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated human-risk workflow
            body: >-
              The platform connects training, simulation, scoring, coaching, and email-response workflows rather than
              leaving customers to stitch together separate awareness and response tools.
            calloutType: strength
            claimRefs:
              - CE001
              - CE004
              - CE006
          - type: callout
            title: Public proof is uneven
            body: >-
              Product breadth is well documented, but independent evidence on reliability, security controls, model
              governance, and realized risk reduction remains limited.
            calloutType: risk
            claimRefs:
              - CE010
              - CE013
              - CE014
          - type: callout
            title: Diligence priority
            body: >-
              Request tenant-level architecture and security documentation, independent outcome data, integration and
              uptime evidence, AI governance controls, and customer references that can separate training completion
              from durable behavior change.
            calloutType: recommendation
            claimRefs:
              - CE010
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying motion
        blocks:
          - type: paragraph
            body: >-
              KnowBe4 sells into organizations that need to measure and reduce workforce-related security risk, with the
              security, IT, compliance, and human-resources functions all appearing in the available evidence. The
              platform is positioned for large and distributed workforces, while channel partners add regional delivery
              and implementation support. Thasaamah describes a Qatar motion spanning enterprise and government
              organizations, multilingual workforces, Microsoft 365 environments, and local implementation. That is
              evidence of a concrete partner use case, not proof that the full installed base has the same profile. The
              customer record therefore supports a broad horizontal market and multiple buying centers, but does not
              disclose customer counts by segment, geography, size, or revenue band.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU008
      - number: '6.2'
        title: Adoption trajectory and measurable outcomes
        blocks:
          - type: paragraph
            body: >-
              Public materials indicate meaningful scale and ongoing product expansion, but the quality of adoption
              evidence varies. KnowBe4 and its channel materials cite more than 70,000 organizations, while HRTechEdge
              reports the company’s statement that AI-related ARR grew more than 35% year to date in 2026; neither
              source supplies a customer-level denominator or product-level revenue bridge. The ROI whitepaper reports
              interview-based time reductions and a modeled 3.5-month payback for a hypothetical 2,000-seat
              organization, which is useful for understanding the value proposition but is not audited cohort
              performance. A separate company-reported benchmark analyzed 42 million simulated tests across 14.8 million
              users at 64,000 organizations and reported lower simulated susceptibility after one year; this is not a
              measure of all real-world incidents.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU008
      - number: '6.3'
        title: Named customer proof and channel durability
        blocks:
          - type: paragraph
            body: >-
              The evidence includes named partners and customer-quoted operational experiences, but it does not
              establish a complete customer reference set or distinguish production deployments from pilots
              consistently. KnowBe4’s 2025 Americas Partner Program announcement names GuidePoint Security, SHI
              International, MicroAge, Tempest, Solo Network Brasil, Worksighted, and Thrive Networks in different award
              categories. The announcement is company-issued, so it demonstrates channel activity and the existence of
              named relationships rather than independent customer success. The ROI study contains customer interviews
              describing automated campaign administration, reporting, and suspicious-email triage. Grey Matter presents
              a KnowBe4 certified-partner relationship and a customer-facing platform description. These signals support
              a channel-enabled go-to-market model, while renewal rates, attach rates, partner concentration, and
              referenceability remain undisclosed.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Retention quality, user friction, and unresolved gaps
        blocks:
          - type: paragraph
            body: >-
              No assigned source discloses net revenue retention, gross retention, renewal rates, churn, contract
              length, or cohort behavior. That absence matters because broad organization counts and partner awards do
              not prove durable paid usage. Independent Trustpilot reviews provide a limited adverse signal: the page
              shows a 3.3 score from 45 reviews and includes complaints about false positives, training quality, and
              forced use, alongside positive support and usability experiences. The page itself cautions that reviewer
              opinions are not verified claims, so it should not be treated as a representative churn sample. The most
              decision-relevant next evidence is customer-level cohort data reconciled to active paid organizations,
              plus reference calls that test deployment quality, reporting accuracy, administrator workload, and renewal
              drivers.
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale with a widening adoption surface
            body: >-
              More than 70,000 organizations are cited by company and partner-facing materials, while the platform is
              expanding from training into email, collaboration, and AI-agent controls.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
          - type: callout
            title: Retention economics remain unverified
            body: >-
              The assigned evidence does not disclose NRR, GRR, churn, renewal, contract length, or cohort data, and a
              small independent review sample contains both strong support comments and material user complaints.
            calloutType: risk
            claimRefs:
              - CU013
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk priorities and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              KnowBe4 is exposed to a high-consequence trust gap: an independent report says a North Korean operative
              passed background checks, reference checks, and four video interviews before being hired, and the
              Department of Justice describes related schemes using stolen identities, fake identities, laptop farms,
              and remote access to employer devices. The incident report says the endpoint-detection software caught the
              activity and that the operative did not gain illegal access or compromise data, so the evidence supports a
              contained control failure rather than a confirmed breach. The practical thesis-break trigger is a repeat
              compromise that reaches customer or company data, or evidence that endpoint detection, identity
              verification, and device-location controls fail systematically. The FBI's mitigation guidance points to
              direct employment verification, in-person or stronger video checks, address validation before shipping
              equipment, and no system access before background checks are complete. These are monitorable controls, but
              public sources do not show KnowBe4's current implementation rate, residual incident frequency, or
              loss-cost exposure.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR007
              - CR009
              - CR010
              - CR012
              - CR014
      - number: '7.2'
        title: Regulatory, legal, and operational exposure
        blocks:
          - type: paragraph
            body: >-
              Regulatory exposure is not limited to a single license or approval. The DOJ describes North Korean
              remote-worker schemes as sanctions-evasion and data-theft risks affecting more than 100 U.S. companies,
              while the FBI warns that third-party IT staffing adds vulnerability because the hiring company is removed
              from the direct process. For KnowBe4, this creates a compliance, access-control, and vendor-governance
              burden across remote hiring, contractors, customer data, and international operations. Product expansion
              adds operational surface area: the company-issued 2026 announcement describes simultaneous growth in
              attack simulation and training, email and collaboration security, and AI-agent governance, including
              integrations with Microsoft Teams, Microsoft Copilot, and Anthropic Claude. The public announcement also
              reports an ISO/IEC 42001 certification and Italian ACN accreditation, which are positive mitigants but do
              not quantify implementation quality or eliminate failures. Diligence should test scope, renewal,
              exceptions, and audit findings rather than treating certifications as proof of zero risk.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR007
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.3'
        title: Dependency, model, and disclosure risks
        blocks:
          - type: paragraph
            body: >-
              The operating model depends on continuous customer behavior change, broad integrations, and claims that
              risk reduction is measurable. KnowBe4's own 2026 release reports 42 million simulated tests across 14.8
              million users at 64,000 organizations and a decline in simulated phishing susceptibility from 33.2% to
              4.2% after one year; the independent coverage explicitly cautions that these are simulated tests, not all
              real-world incidents. The ROI whitepaper is more explicit about uncertainty: its 257% three-year case is
              based on a 2,000-seat organization, customer interviews, and assumptions, and says actual ROI may vary.
              These limitations create model risk if simulated outcomes, early AI deployments, or customer-reported time
              savings are treated as realized loss avoidance. Public evidence also lacks audited revenue, cash flow,
              debt, customer concentration, retention, and incident-loss detail for this refresh. The investment
              implication is to require cohort-level retention, deployment outcomes, security incident history, and
              audited financials before underwriting downside protection.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-consequence kill criterion
            body: >-
              A repeat hiring or contractor-control failure that enables unauthorized access to KnowBe4 or customer data
              would invalidate the current containment-based risk assessment.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR005
          - type: callout
            title: Do not equate simulated improvement with realized loss avoidance
            body: >-
              Simulated phishing and customer-interview ROI evidence is decision-useful but does not establish realized
              incident reduction, audited economics, or cash generation.
            calloutType: assumption
            claimRefs:
              - CR011
              - CR012
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and valuation discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports research-more rather than buy or sell. KnowBe4's product breadth is expanding from
              security-awareness training into email security, real-time coaching and AI-agent governance, while a 2026
              report says AI-related ARR grew more than 35% year to date. That growth is not translated into absolute AI
              revenue or total-company revenue, and the report explicitly says the product breakdown was not disclosed.
              The $4.6B all-cash take-private, agreed at $24.90 per share and closed in 2023, is a useful transaction
              anchor, but it is not a current mark. DealMatrix's published benchmark is an illustrative 30 June 2025
              median of 3.7x EV/Sales and 19.8x EV/EBITDA across six regions; it also says the model updates quarterly.
              Applying either multiple to an unverified current denominator would create false precision. Entry should
              therefore require current audited revenue, EBITDA, free cash flow, net debt, cap-table preferences and
              sponsor-level ownership data.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV018
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV009
              - CV018
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is that a large installed base can support expansion from training into adjacent
              controls. The HRM+ announcement describes one platform combining awareness training, email security,
              anti-phishing, real-time coaching, AI defense agents and compliance training. Independent coverage
              describes behavior-linked coaching, integrations with existing security systems and risk scoring as the
              strategic direction. The anti-thesis is that broader functionality may not create differentiated
              behavioral-risk capabilities. Whalemate characterizes KnowBe4 as a broad security-awareness reference
              being repositioned toward HRM+, rather than an HRM-first platform built on deep behavioral scoring. That
              is adverse competitor evidence, not an independent benchmark, so it identifies a diligence question rather
              than proving inferiority. The investment case improves only if expansion converts into disclosed
              recurring-revenue growth, durable retention and measurable customer outcomes verified beyond commissioned
              studies.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Bull, base and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              Scenario ranges are decision thresholds, not a model-derived fair value. The bull case assumes AI and
              email-security expansion increases recurring revenue while current margins and retention remain strong; it
              requires product-level revenue, cohort retention and margin evidence. The base case gives credit for
              platform breadth and reported AI-related growth but keeps the historical transaction anchor as a reference
              only, because current financial statements are unavailable in this pool. The bear case assumes a mismatch
              between product expansion and monetization, weak differentiation, or multiple compression; competitor
              material questions whether KnowBe4 is truly HRM-first. Probability signals are qualitative because no
              current cap table, debt schedule or audited forecast is available. A price change or evidence update
              should move the call more than a spreadsheet point estimate.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: Exit readiness and decisive diligence
        blocks:
          - type: paragraph
            body: >-
              KnowBe4's prior exit demonstrates that a strategic or sponsor transaction has occurred, but it does not
              establish present exit readiness. The transaction announcement records debt and equity financing and
              support agreements covering 83% of voting power; current ownership, rollover economics, liquidation
              preferences and debt terms remain unverified. The platform's commercial narrative is investable only if
              management can show conversion from product launches to contracted ARR, renewal and expansion by cohort,
              gross margin, free-cash-flow conversion and customer concentration. The decisive diligence path is a
              current data room: audited financials, ARR bridge, cohort retention, bookings and pipeline, debt and
              preference documents, and an independent valuation or secondary mark. Thesis-break triggers are a material
              down-round, falling renewal or expansion, inability to substantiate AI-related ARR, or evidence that
              adjacent modules fail to improve net retention or defensible behavioral-risk differentiation.
            claimRefs:
              - CV016
              - CV018
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more
            body: >-
              The price case is not underwritable from the assigned public evidence because current financial
              denominators and capital-structure terms are missing.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV018
          - type: callout
            title: Do not treat the transaction anchor as current value
            body: >-
              The $4.6B take-private closed in February 2023; it is a historical transaction fact, not a current
              valuation mark.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
          - type: callout
            title: Scenario ranges require a data-room refresh
            body: >-
              Any multiple-based range must be rebuilt from current revenue, profitability, leverage and preference
              data.
            calloutType: assumption
            claimRefs:
              - CV004
              - CV018
