            title: Comparative proof remains the missing moat evidence
            body: >-
              Competitors have clear displacement narratives, but retained evidence does not compare price,
              administrator time, or behavior outcomes on the same population and period; a controlled pilot is
              necessary before treating feature breadth as superiority.
            calloutType: risk
            claimRefs:
