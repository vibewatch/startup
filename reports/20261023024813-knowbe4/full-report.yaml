  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and traction
        blocks:
          - type: paragraph
            body: >-
              KnowBe4 sells a subscription platform whose commercial unit is the licensed user seat. Vendr describes the
              model as per-user, per-year pricing with annual or multi-year contracts, multiple product tiers, add-ons,
              and support options. The 2026 momentum release says the company has more than 70,000 customers and that
              AI-related ARR grew more than 35% so far in 2026, but it does not disclose absolute AI revenue or the
              share of total ARR represented by that growth. The same release attributes expansion to AIDA, SAT
              Advanced, email and collaboration security, and international markets. These are company-reported
              indicators of recurring demand, not audited revenue or a segment mix. Historical public-company disclosure
              provides a useful but stale benchmark: preliminary Q4 2022 revenue was $89.928 million and ARR was
              $367.731 million, with 56,867 customers. Those figures should not be rolled forward into the 2026 case.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: figure
