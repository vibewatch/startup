              - CI003
              - CI006
              - CI013
              - CI014
      - number: '4.2'
        title: Pricing, packaging, and sales efficiency
        blocks:
          - type: paragraph
            body: >-
              Published and observed pricing supports a scalable software monetization mechanism but not a
              realized-price forecast. G2 displays a SAT Advanced 501-1000 seat, three-year price of $2.79 per seat per
              month, while its page also labels pricing as provided by KnowBe4; the displayed scope and term make this a
              list-price datapoint rather than recognized revenue. Vendr reports that price varies with seats, tier,
              term, add-ons, premium support, and negotiation, and says multi-year commitments commonly unlock 15%-30%
              lower per-user pricing than annual contracts. Vendr also reports renewal increases of 15%-30% when not
              actively negotiated. The evidence supports a sales motion based on volume and term expansion, but there is
              no public CAC, payback, sales-cycle, churn, NRR, or channel-margin disclosure. Customer ROI material is
              directional: a vendor-commissioned Hobson & Company case modeled a 2,000-seat organization and reported a
              3.5-month payback and 257% three-year ROI under stated assumptions. Those assumptions are not evidence of
              KnowBe4's realized gross margin or customer-level payback across the installed base.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
      - number: '4.3'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Historical disclosure indicates software-like gross margins but also shows that operating profitability
              cannot be inferred from gross margin alone. KnowBe4's preliminary Q4 2022 release reported GAAP gross
              margin of 85.4%, GAAP operating margin of negative 23.0%, net cash from operating activities of $19.483
              million, and free cash flow of $17.978 million; the release explicitly states that the figures were
              preliminary, unaudited, and based on estimates before closing the financial statements. The 2026 release
              says the company is investing in people, products, and global infrastructure, while HRTechEdge reports
              that it did not disclose absolute AI-related revenue or product-level contribution. Public sources in this
              pool do not provide current cash on hand, debt balances, refinancing terms, capex, working capital, burn,
              runway, or next-round triggers. The former public-company release also says the company agreed to be
              acquired by Vista in an all-cash transaction and expected to become private, making current financing
              transparency especially important.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Financial underwriting verdict and blockers
        blocks:
          - type: paragraph
            body: >-
              The financial case is strongest where recurring seat licensing, broad product packaging, historical gross
              margin, and reported customer scale are visible. It is weakest where an investor would need current cash
              conversion and cohort economics. KnowBe4's platform breadth may support expansion from awareness training
              into AI, email, collaboration, and compliance modules, but Whalemate characterizes the HRM+ positioning as
              KnowBe4's commercial umbrella and notes that the company is being rebranded toward HRM; that is market
              positioning, not proof of product mix or attach rates. Techzine reports that the platform uses behavioral
              metrics and integrations and quotes KnowBe4's emphasis on behavior change, yet the article does not supply
              contract-level economics. The principal underwriting conclusion is therefore a conditional recurring
              revenue thesis rather than a completed valuation: obtain current audited P&L and cash-flow statements,
              debt and refinancing documents, cohort retention by segment, realized price and discount waterfalls, CAC
              and payback, implementation costs, and the revenue and gross-margin split across training, email security,
              compliance, and AI offerings.
            claimRefs:
              - CI014
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Current underwriting data gap
            body: >-
              The assigned evidence supports a recurring seat model and historical software-like margins, but it does
              not disclose current cash, debt, burn, runway, CAC, retention, or realized product-level economics. A
              valuation conclusion should remain conditional until those private-company inputs are obtained.
            calloutType: risk
            claimRefs:
              - CI010
              - CI013
              - CI014
