      - number: '3.2'
        title: Capability and strategic positioning
        blocks:
          - type: paragraph
            body: >-
              KnowBe4's strongest visible position is breadth at installed-base scale. The company says it serves more
              than 70,000 customers and is expanding beyond core training into SAT Advanced, real-time coaching,
              simulated vishing, email and collaboration security, and AI-agent governance (SP006). TrustRadius
              separately shows a 9-of-10 score across 1,168 reviews and describes a suite spanning training, coaching,
              simulation, reporting, and automation (SP001). Challengers attack narrower seams: Hoxhunt stresses
              adaptive behavior and reporting, usecure bundles training, phishing, policy, and credential monitoring,
              Keepnet stresses multichannel testing and response, and Adaptive and Brightside stress voice, deepfake, or
              AI-persona simulation (SP002, SP003, SP007, SP008, SP010). Techzine independently reports the same
              category transition from compliance-led training toward behavior-based human risk management and real-time
              coaching (SP011). Because most named comparisons are competitor positions, the matrix records unsupported
              comparisons as unknown rather than converting marketing claims into benchmarks.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
