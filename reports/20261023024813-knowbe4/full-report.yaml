  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              KnowBe4 competes across several buyer jobs rather than against one uniform peer group. TrustRadius
              presents it as an awareness and compliance training product with simulated social engineering, real-time
              coaching, anti-phishing defenses, and AI-assisted risk management (SP001). Competitor guides repeatedly
