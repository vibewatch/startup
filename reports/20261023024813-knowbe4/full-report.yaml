      - CM005
      - CM008
      - CM009
  - id: FP001
    title: Competitive positioning by breadth and adaptive multichannel emphasis
    type: quadrant
    summary: >-
      Ordinal placement separates broad incumbent scope from adaptive or multichannel emphasis; it is an analyst
      synthesis of described positioning, not a performance rank.
    data:
      xAxis:
        label: Adaptive and multichannel emphasis (1=limited evidence, 5=central positioning)
        min: 1
        max: 5
      yAxis:
        label: Portfolio breadth and operating maturity (1=narrow/emerging, 5=broad/mature)
        min: 1
        max: 5
      points:
        - label: KnowBe4
          x: 3
          'y': 5
          detail: Broad incumbent expanding into vishing, collaboration security, and AI-agent governance
        - label: Proofpoint
          x: 2
          'y': 4
          detail: Broad email-security incumbent; retained non-email evidence is limited
        - label: Hoxhunt
          x: 4
          'y': 4
          detail: Adaptive behavior-change emphasis with enterprise review footprint
        - label: SoSafe
          x: 3
          'y': 3
          detail: Localization and gamification emphasis
        - label: usecure
          x: 3
          'y': 3
          detail: Integrated training, phishing, policy, and credential-monitoring positioning
        - label: Keepnet
          x: 5
          'y': 3
          detail: Multichannel simulation and response positioning
        - label: Adaptive Security
          x: 5
          'y': 2
          detail: AI-persona, voice, SMS, and deepfake positioning
        - label: Brightside AI
          x: 5
          'y': 2
          detail: Live adaptive voice and coordinated voice-plus-email positioning
