evidenceGaps:
  - type: missing-source
    severity: material
    topic: financial-disclosure
    missingEvidence: Current audited revenue, EBITDA, free cash flow, net debt, and valuation.
    whyItMatters: These measures determine whether recurring scale translates into equity value and debt capacity.
    diligencePath: Obtain current management accounts, audited statements, debt schedule, and sponsor valuation materials.
    relatedQuestionRefs:
      - QO002
      - QO007
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Complete board roster, ownership waterfall, management incentive plan, and succession arrangements.
    whyItMatters: Private ownership and leadership transition make control rights and key-person dependence central to risk.
    diligencePath: Request the cap table, governance documents, board materials, and executive employment agreements.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: customers
    missingEvidence: Cohort retention, renewal, expansion, churn, and customer concentration by segment.
    whyItMatters: A customer count and recurring-revenue percentage do not establish durability or net retention.
    diligencePath: Request monthly cohort tables, ARR bridge, renewal rates, and top-customer concentration.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO001
  - type: stale
    severity: minor
    topic: product-outcomes
    missingEvidence: Independent outcome evidence for newer AI, coaching, and collaboration products.
    whyItMatters: Launch cadence is visible, but product expansion may not yet translate into durable revenue or risk reduction.
    diligencePath: Obtain product-level ARR, attach rates, win/loss data, and independently measured customer outcomes.
    relatedQuestionRefs:
      - QO006
      - QO007
  - type: missing-source
    severity: blocking
    topic: market-sizing-gap
    missingEvidence: >-
      A current, independently scoped global market estimate for security-awareness and human-risk-management software
      with geography, denominator, and methodology.
    whyItMatters: Without a comparable denominator, TAM, SAM, SOM, market share, and valuation sensitivity cannot be tested.
    diligencePath: >-
      Obtain current analyst market data or triangulate disclosed vendor revenue and customer counts using one
      consistent category definition.
    relatedQuestionRefs:
      - QM004
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-segmentation
    missingEvidence: KnowBe4's segment-level budget ownership, renewal, churn, attach-rate, and CAC data by company size and geography.
    whyItMatters: >-
      The buyer map is operationally plausible but cannot establish which segments drive durable growth or willingness
      to pay.
    diligencePath: Request cohort, retention, pricing, and pipeline data split by SMB, mid-market, enterprise, channel, and region.
    relatedQuestionRefs:
      - QM005
      - QM006
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable written quotes and entitlement schedules for KnowBe4 and at least three alternatives at the same seat
      count, geography, scope, and term.
    whyItMatters: >-
      Competitor descriptions of quote and tier mechanics do not establish realized price, discounting, or total
      contract value.
    diligencePath: >-
      Obtain line-item quotes, implementation scopes, renewal caps, discount terms, and managed-service fees from
      shortlisted vendors.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Customer-level retention, win-loss, displacement, migration effort, and multi-homing evidence segmented by buyer
      size and incumbent stack.
    whyItMatters: Installed-base breadth may create workflow friction, but it does not quantify lock-in or distribution power.
    diligencePath: >-
      Review confidential renewal cohorts and lost-deal records, then interview customers that completed or abandoned a
      migration.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: comparison-gap
    missingEvidence: >-
      Independent side-by-side measurements of reporting rate, repeat failures, time-to-report, administrator hours, and
      total cost on one user cohort.
    whyItMatters: Vendor comparisons reveal positioning but cannot prove relative efficacy or moat durability.
    diligencePath: Run a controlled pilot with consistent users, scenarios, channels, duration, and predefined outcome measures.
    relatedQuestionRefs:
      - QP006
      - QP007
      - QP008
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current audited P&L, cash-flow statement, balance sheet, debt schedule, refinancing terms, cash balance, burn, and
      runway.
    whyItMatters: >-
      The company is private and the assigned sources do not establish whether current growth converts into cash or
      whether financing obligations constrain operations.
    diligencePath: >-
      Request the latest audited financial statements, lender and refinancing documents, covenant package, and a
      management cash forecast.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
