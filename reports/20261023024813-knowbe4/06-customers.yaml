  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-gap
      missingEvidence: Current NRR, GRR, churn, renewal, contract length, cohort retention, and expansion data by customer segment.
      whyItMatters: Broad customer counts and reported behavior metrics cannot establish durable paid revenue or the quality of the installed base.
      diligencePath: Request monthly recurring-revenue cohorts, renewal schedules, logo churn, contraction, expansion, and attach rates for the last 24 months.
      relatedQuestionRefs: [QU006]
    - type: enumeration-incomplete
      severity: material
      topic: TU003-named-proof
      missingEvidence: A referenceable customer list that identifies production deployments, pilots, use cases, outcomes, and dates.
      whyItMatters: Partner awards and marketing descriptions do not independently prove production adoption or customer success.
      diligencePath: Obtain permissioned reference calls and a deployment ledger segmented by product, geography, and customer size.
      relatedQuestionRefs: [QU003, QU008]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: concentration-gap
      missingEvidence: Top-customer and top-partner revenue concentration, channel-sourced bookings, and procurement cycle data.
      whyItMatters: Concentration or partner dependence could materially affect renewal durability and expansion economics.
      diligencePath: Request anonymized top-10 revenue shares, partner contribution, pipeline conversion, and largest-customer renewal status.
      relatedQuestionRefs: [QU009]
