figures:
  - id: FU001
    title: Customer journey from risk baseline to expansion
    type: journey-map
    summary: KnowBe4’s described customer motion moves from workforce assessment through continuous intervention, measurement, and broader security-surface adoption.
    data:
      nodes:
        - id: assess
          label: Assess workforce risk
          body: Identify workforce, email, compliance, and AI-agent risk priorities.
          touchpoints: [Security and IT discovery, Risk baseline]
        - id: deploy
          label: Deploy training and simulations
          body: Configure users, campaigns, policies, and integrations.
          touchpoints: [Phishing simulation, Compliance training]
        - id: intervene
          label: Personalize interventions
          body: Use risk-aware training, coaching, and reported-email workflows.
          touchpoints: [Real-time coaching, PhishER]
        - id: measure
          label: Measure behavior
          body: Track susceptibility, reporting, risk scores, and completion.
          touchpoints: [Executive reporting, Risk indicators]
        - id: expand
          label: Expand security surface
          body: Add email, collaboration, AI-agent, or regional partner capabilities.
          touchpoints: [Email security, AI-agent governance]
        - id: optimize
          label: Optimize program
          body: Refine campaigns and controls using observed program evidence.
          touchpoints: [Continuous improvement, Renewal diligence]
    claimRefs: [CU001, CU002, CU003, CU008]
