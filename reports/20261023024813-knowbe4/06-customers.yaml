chapter:
  number: 6
  title: Customers
  summary: KnowBe4 has broad customer reach and a growing channel-led adoption surface, but public evidence is stronger for product positioning and reported scale than for retention, renewal economics, or production outcomes. Independent review evidence is mixed, making implementation quality and measurement discipline important diligence variables.
sections:
  - id: customer-segments-and-buyers
    title: Customer segments and buying motion
    body: >-
      KnowBe4 sells into organizations that need to measure and reduce workforce-related security risk, with the security, IT, compliance, and human-resources functions all appearing in the available evidence. The platform is positioned for large and distributed workforces, while channel partners add regional delivery and implementation support. Thasaamah describes a Qatar motion spanning enterprise and government organizations, multilingual workforces, Microsoft 365 environments, and local implementation. That is evidence of a concrete partner use case, not proof that the full installed base has the same profile. The customer record therefore supports a broad horizontal market and multiple buying centers, but does not disclose customer counts by segment, geography, size, or revenue band.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-outcomes
    title: Adoption trajectory and measurable outcomes
    body: >-
      Public materials indicate meaningful scale and ongoing product expansion, but the quality of adoption evidence varies. KnowBe4 and its channel materials cite more than 70,000 organizations, while HRTechEdge reports the company’s statement that AI-related ARR grew more than 35% year to date in 2026; neither source supplies a customer-level denominator or product-level revenue bridge. The ROI whitepaper reports interview-based time reductions and a modeled 3.5-month payback for a hypothetical 2,000-seat organization, which is useful for understanding the value proposition but is not audited cohort performance. A separate company-reported benchmark analyzed 42 million simulated tests across 14.8 million users at 64,000 organizations and reported lower simulated susceptibility after one year; this is not a measure of all real-world incidents.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
  - id: named-proof-and-channel
    title: Named customer proof and channel durability
    body: >-
      The evidence includes named partners and customer-quoted operational experiences, but it does not establish a complete customer reference set or distinguish production deployments from pilots consistently. KnowBe4’s 2025 Americas Partner Program announcement names GuidePoint Security, SHI International, MicroAge, Tempest, Solo Network Brasil, Worksighted, and Thrive Networks in different award categories. The announcement is company-issued, so it demonstrates channel activity and the existence of named relationships rather than independent customer success. The ROI study contains customer interviews describing automated campaign administration, reporting, and suspicious-email triage. Grey Matter presents a KnowBe4 certified-partner relationship and a customer-facing platform description. These signals support a channel-enabled go-to-market model, while renewal rates, attach rates, partner concentration, and referenceability remain undisclosed.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
  - id: retention-friction-and-gaps
    title: Retention quality, user friction, and unresolved gaps
    body: >-
      No assigned source discloses net revenue retention, gross retention, renewal rates, churn, contract length, or cohort behavior. That absence matters because broad organization counts and partner awards do not prove durable paid usage. Independent Trustpilot reviews provide a limited adverse signal: the page shows a 3.3 score from 45 reviews and includes complaints about false positives, training quality, and forced use, alongside positive support and usability experiences. The page itself cautions that reviewer opinions are not verified claims, so it should not be treated as a representative churn sample. The most decision-relevant next evidence is customer-level cohort data reconciled to active paid organizations, plus reference calls that test deployment quality, reporting accuracy, administrator workload, and renewal drivers.
    claimRefs: [CU013, CU014, CU015, CU016]
    tableRefs: []
callouts:
  - calloutType: strength
    title: Scale with a widening adoption surface
    body: >-
      More than 70,000 organizations are cited by company and partner-facing materials, while the platform is expanding from training into email, collaboration, and AI-agent controls.
    claimRefs: [CU005, CU006]
  - calloutType: risk
    title: Retention economics remain unverified
    body: >-
      The assigned evidence does not disclose NRR, GRR, churn, renewal, contract length, or cohort data, and a small independent review sample contains both strong support comments and material user complaints.
    claimRefs: [CU013, CU016]
