company:
  name: KnowBe4
chapter:
  number: 8
  title: Valuation
  summary: KnowBe4 has credible platform expansion and customer-scale evidence, but public evidence does not establish current revenue, EBITDA, free cash flow, net debt, or a new financing mark. The historical $4.6B take-private and an illustrative 2025 sector multiple support disciplined price discovery, not a fresh buy conclusion.
sections:
  - id: recommendation
    title: Recommendation and valuation discipline
    body: >-
      The evidence supports research-more rather than buy or sell. KnowBe4's product
      breadth is expanding from security-awareness training into email security,
      real-time coaching and AI-agent governance, while a 2026 report says AI-related
      ARR grew more than 35% year to date. That growth is not translated into absolute
      AI revenue or total-company revenue, and the report explicitly says the product
      breakdown was not disclosed. The $4.6B all-cash take-private, agreed at $24.90
      per share and closed in 2023, is a useful transaction anchor, but it is not a
      current mark. DealMatrix's
      published benchmark is an illustrative 30 June 2025 median of 3.7x EV/Sales and
      19.8x EV/EBITDA across six regions; it also says the model updates quarterly.
      Applying either multiple to an unverified current denominator would create false
      precision. Entry should therefore require current audited revenue, EBITDA,
      free cash flow, net debt, cap-table preferences and sponsor-level ownership data.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-antithesis
    title: Thesis and anti-thesis
    body: >-
      The positive thesis is that a large installed base can support expansion from
      training into adjacent controls. The HRM+ announcement describes one platform
      combining awareness training, email security, anti-phishing, real-time coaching,
      AI defense agents and compliance training. Independent coverage describes
      behavior-linked coaching, integrations with existing security systems and
      risk scoring as the strategic direction. The anti-thesis is that broader
      functionality may not create differentiated behavioral-risk capabilities.
      Whalemate characterizes KnowBe4 as a broad security-awareness reference being
      repositioned toward HRM+, rather than an HRM-first platform built on deep
      behavioral scoring. That is adverse competitor evidence, not an independent
      benchmark, so it identifies a diligence question rather than proving
      inferiority. The investment case improves only if expansion converts into
      disclosed recurring-revenue growth, durable retention and measurable customer
      outcomes verified beyond commissioned studies.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV002]
  - id: scenarios
    title: Bull, base and bear scenarios
    body: >-
      Scenario ranges are decision thresholds, not a model-derived fair value. The
      bull case assumes AI and email-security expansion increases recurring revenue
      while current margins and retention remain strong; it requires product-level
      revenue, cohort retention and margin evidence. The base case gives credit for
      platform breadth and reported AI-related growth but keeps the historical
      transaction anchor as a reference only, because current financial statements
      are unavailable in this pool. The bear case assumes a mismatch between product
      expansion and monetization, weak differentiation, or multiple compression;
      competitor material questions whether KnowBe4 is truly HRM-first. Probability
      signals are qualitative because no current
      cap table, debt schedule or audited forecast is available. A price change or
      evidence update should move the call more than a spreadsheet point estimate.
    claimRefs: [CV011, CV012, CV013, CV015]
    tableRefs: [TV003]
  - id: diligence-and-exit
    title: Exit readiness and decisive diligence
    body: >-
      KnowBe4's prior exit demonstrates that a strategic or sponsor transaction has
      occurred, but it does not establish present exit readiness. The transaction
      announcement records debt and equity financing and support agreements covering
      83% of voting power; current ownership, rollover economics, liquidation
      preferences and debt terms remain unverified. The platform's commercial
      narrative is investable only if management can show conversion from product
      launches to contracted ARR, renewal and expansion by cohort, gross margin,
      free-cash-flow conversion and customer concentration. The decisive diligence
      path is a current data room: audited financials, ARR bridge, cohort retention,
      bookings and pipeline, debt and preference documents, and an independent
      valuation or secondary mark. Thesis-break triggers are a material down-round,
      falling renewal or expansion, inability to substantiate AI-related ARR, or
      evidence that adjacent modules fail to improve net retention or defensible
      behavioral-risk differentiation.
    claimRefs: [CV016, CV018]
    tableRefs: []
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Current evidence, Decision implication]
    rows:
      - [Recommendation, "Research-more", "Do not underwrite a buy without current audited denominators"]
      - [Confidence, "Medium-low", "Platform direction is evidenced; current financial valuation is not"]
      - [Risk rating, "High", "Disclosure, leverage, pricing and monetization uncertainty remain material"]
      - [Valuation stance, "Fair / unproven", "Historical transaction anchor is not a 2026 mark"]
      - [Entry discipline, "Require data-room evidence", "Validate ARR bridge, EBITDA, FCF, net debt and preferences"]
    notes: "Assessment is an analytical synthesis of cited evidence; current private-company financial denominators are not disclosed in the assigned pool."
    claimRefs: [CV001, CV003, CV004, CV018]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Platform expansion", "HRM+ combines training, email security, coaching, AI defense and compliance", "Product-level ARR and attach-rate data showing profitable expansion"]
      - ["AI growth", "AI-related ARR reportedly grew more than 35% in 2026", "Absolute ARR, cohort mix and independent corroboration"]
      - ["Customer value", "Commissioned ROI study reports 257% three-year ROI in a modeled 2,000-seat case", "Audited customer cohort outcomes and representative realized ROI"]
      - ["HRM differentiation", "Whalemate argues KnowBe4 is not necessarily an HRM-first deep behavioral-scoring platform", "Independent benchmark, win/loss data and renewal cohorts"]
      - ["Evidence quality", "The adverse positioning comparison is competitor-authored", "Independent customer and analyst evidence on behavioral-risk outcomes"]
    notes: "Company, commissioned-study and competitor assertions are labeled by issuer relationship; competitor comparisons are not independent benchmarks."
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
  - id: TV003
    title: Bull / base / bear scenario thresholds
    columns: [Scenario, Assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - ["Bull", "AI and email-security modules expand ARR; retention and margins remain strong", "A premium to the sector EV/Sales reference could be tested only after current revenue is verified", "Low-to-medium", "Expansion fails to translate into paid attach or retention"]
      - ["Base", "Core platform remains scaled; AI growth is real but financial disclosure stays limited", "Use historical $4.6B transaction only as a reference and require a market-checked current mark", "Medium", "Data room cannot reconcile ARR, EBITDA, FCF and net debt"]
      - ["Bear", "Weak differentiation or competition compresses growth and multiples", "Apply a discount to any stale transaction anchor; avoid precision without denominators", "Medium", "Down-round, falling renewals or unsupported AI revenue"]
      - ["Decision threshold", "Current audited financials and cap-table terms become available", "Re-underwrite on EV/Sales and EV/EBITDA with scenario-specific margins", "Required", "Any material preference, leverage or concentration surprise"]
    notes: "Scenario logic is qualitative because no current audited revenue, EBITDA, free cash flow, net debt or cap-table waterfall is present in the assigned evidence."
    claimRefs: [CV011, CV012, CV013, CV015]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Scale and product expansion are offset by missing current valuation denominators and execution risks, leading to research-more.
    data:
      nodes:
        - id: scale
          label: "Installed-base scale"
          detail: "More than 70,000 organizations reported in 2024-2026 materials"
        - id: expansion
          label: "Platform expansion"
          detail: "HRM+, email security, coaching and AI-agent controls"
        - id: proof
          label: "Partial proof"
          detail: "AI-related ARR growth reported, but absolute revenue undisclosed"
        - id: gap
          label: "Valuation gap"
          detail: "Current audited revenue, EBITDA, FCF, net debt and preferences unavailable"
        - id: risk
          label: "Execution / differentiation risk"
          detail: "Competitor-authored critique questions whether the platform is HRM-first"
        - id: call
          label: "Research-more"
          detail: "Require current data-room and market-checked price"
      edges:
        - [scale, expansion]
        - [expansion, proof]
        - [proof, gap]
        - [gap, call]
        - [risk, call]
    claimRefs: [CV001, CV006, CV009, CV018]
callouts:
  - calloutType: recommendation
    title: Research-more
    body: "The price case is not underwritable from the assigned public evidence because current financial denominators and capital-structure terms are missing."
    claimRefs: [CV003, CV004, CV018]
  - calloutType: risk
    title: Do not treat the transaction anchor as current value
    body: "The $4.6B take-private closed in February 2023; it is a historical transaction fact, not a current valuation mark."
    claimRefs: [CV001, CV002]
  - calloutType: assumption
    title: Scenario ranges require a data-room refresh
    body: "Any multiple-based range must be rebuilt from current revenue, profitability, leverage and preference data."
    claimRefs: [CV004, CV018]
