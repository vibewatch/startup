company:
  name: KnowBe4
chapter:
  number: 3
  title: Competitors
  summary: >-
    KnowBe4 combines incumbent scale, a broad awareness-and-simulation suite, and an
    established review footprint, while challengers concentrate on adaptive behavior,
    multichannel simulation, policy workflows, or email-security integration. The
    evidence base is heavily competitor-issued and lacks normalized pricing and
    head-to-head outcomes, so displacement risk is credible but not quantified.
sections:
  - id: landscape
    title: Landscape and buyer alternatives
    body: >-
      KnowBe4 competes across several buyer jobs rather than against one uniform peer
      group. TrustRadius presents it as an awareness and compliance training product
      with simulated social engineering, real-time coaching, anti-phishing defenses,
      and AI-assisted risk management (SP001). Competitor guides repeatedly name
      Proofpoint, Hoxhunt, SoSafe, Cofense PhishMe, Infosec IQ, MetaCompliance, and
      Microsoft Attack Simulation Training, while newer entrants such as Adaptive,
      Keepnet, usecure, and Brightside emphasize different combinations of AI-era
      simulations, lower administration, policy management, or behavioral measurement
      (SP002, SP003, SP007, SP008, SP010). Status-quo substitutes include existing
      Microsoft or email-security bundles, internal compliance content, and managed
      delivery. These lists establish the breadth of buyer choice, not market share:
      most comparison pages are written by vendors selling an alternative, and the
      retained sources do not disclose normalized win rates or competitor funding.
    claimRefs: [CP002, CP003, CP006, CP007, CP008, CP009, CP010]
    tableRefs: [TP001]
  - id: capability-positioning
    title: Capability and strategic positioning
    body: >-
      KnowBe4's strongest visible position is breadth at installed-base scale. The
      company says it serves more than 70,000 customers and is expanding beyond core
      training into SAT Advanced, real-time coaching, simulated vishing, email and
      collaboration security, and AI-agent governance (SP006). TrustRadius separately
      shows a 9-of-10 score across 1,168 reviews and describes a suite spanning
      training, coaching, simulation, reporting, and automation (SP001). Challengers
      attack narrower seams: Hoxhunt stresses adaptive behavior and reporting,
      usecure bundles training, phishing, policy, and credential monitoring, Keepnet
      stresses multichannel testing and response, and Adaptive and Brightside stress
      voice, deepfake, or AI-persona simulation (SP002, SP003, SP007, SP008, SP010).
      Techzine independently reports the same category transition from compliance-led
      training toward behavior-based human risk management and real-time coaching
      (SP011). Because most named comparisons are competitor positions, the matrix
      records unsupported comparisons as unknown rather than converting marketing
      claims into benchmarks.
    claimRefs: [CP001, CP002, CP004, CP006, CP007, CP008, CP009, CP010, CP011]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: economics-switching
    title: Packaging, switching cost, and distribution power
    body: >-
      Public evidence does not support a precise price ranking. Vendr independently
      describes per-user annual subscriptions whose outcomes vary with tier, user
      count, term, add-ons, and support, while usecure and Keepnet characterize
      packaging from a competitor perspective (SP003, SP007, SP013).
      Their own packaging claims are directional as well: usecure describes a
      per-user, per-month model with multiple modules included, while Keepnet describes
      modular packages, individual products, or pay-as-you-go purchasing. Brightside
      says its audit log and employee portal are standard on all plans but does not
      publish retained price evidence (SP010). Switching friction is more tangible
      than price advantage: directory synchronization, campaign history, reporting
      workflows, content assignments, integrations, and user risk baselines all create
      migration work. Yet that is workflow lock-in, not proof of pricing power.
      Buyers can multi-home during a bounded pilot, compare the same cohort, and
      migrate at renewal if behavior outcomes and administrative effort justify the
      change. Written quotes, entitlements, renewal terms, and migration estimates
      remain necessary to test that hypothesis.
    claimRefs: [CP007, CP008, CP010, CP013, CP015, CP016]
    tableRefs: [TP003]
  - id: moat-risk
    title: Moat durability and adverse evidence
    body: >-
      Customer evidence supports utility but not an unassailable moat. TrustRadius
      reviewers praise content breadth, campaign customization, and usability, while
      its synthesis says 6% reported difficulty quantifying exact ROI and records
      concerns about simulation authenticity (SP009). A KnowBe4-sponsored study by
      Hobson & Company reports large time savings and a modeled three-year ROI for a
      2,000-seat organization, but the relationship, assumptions, and interview-based
      method mean the result is not an independent category benchmark (SP004).
      Competitor pages consistently target content fatigue, administration, opaque
      packaging, non-email attack coverage, and behavior-level reporting; their
      commercial incentives lower evidentiary weight but reveal where challengers
      expect buyers to switch (SP002, SP003, SP007, SP008, SP010). The resulting moat
      judgment is conditional: KnowBe4's scale, product breadth, and accumulated
      workflows are defensible distribution assets, while baseline training content
      and email simulation can commoditize. Durability depends on demonstrating
      independently comparable risk reduction across channels without increasing
      buyer workload or total contract cost.
    claimRefs: [CP005, CP006, CP009, CP010, CP012, CP014, CP015, CP016]
