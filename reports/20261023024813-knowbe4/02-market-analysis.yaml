chapter:
  number: 2
  title: Market Analysis
  summary: KnowBe4 participates in a broad human-risk-management category whose buying case starts with phishing and security-awareness workflows and is expanding toward real-time coaching, collaboration security, and AI-agent governance. Public evidence supports a large and urgent problem, but not a defensible standalone TAM/SAM/SOM or a verified market share estimate.
sections:
  - id: market-boundary
    title: Market boundary and problem definition
    body: >-
      The relevant market is enterprise human-risk management and security-awareness
      software: recurring software and services that train employees, simulate social
      engineering, measure behavior, and provide remediation or reporting. The
      narrower included spend is security-awareness training, phishing simulation,
      compliance-learning administration, behavioral-risk measurement, and adjacent
      email or collaboration interventions sold into the same security budget. The
      broader adjacency includes email security, anti-phishing controls, identity
      protection, endpoint controls, and AI governance; these can substitute for
      some outcomes but should not be silently counted as SAT market revenue.
      Government guidance defines phishing as messages that trick users into opening
      harmful links, downloading malicious software, or submitting sensitive
      information, and explicitly notes that attacks also arrive through text,
      phone, social media, and physical mail. CISA likewise frames phishing
      defense for all organizations and software manufacturers. This supports a
      persistent problem boundary, not a claim that training alone prevents
      incidents. KnowBe4's own market positioning is broader than annual training:
      the company combines training, simulations, real-time coaching, email
      security, anti-phishing, and compliance training, while an independent
      market description characterizes the shift as a move from a compliance
      checkbox toward human-risk management.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and market growth signals
    body: >-
      A defensible public sizing triangulates category demand, customer economics,
      and observed product expansion rather than repeating one vendor TAM. The
      available evidence does not publish a clean global SAT or HRM market total
      with matching geography, year, and methodology, so the chapter preserves
      three lenses instead. First, the problem is cross-industry and multi-channel:
      NIST calls phishing one of the most common types of cyber crime and recommends
      employee education, reporting, filters, authentication, and email security
      technologies. Second, a KnowBe4-sponsored ROI study reports a modeled
      257% three-year ROI and 3.5-month payback for a 2,000-seat scenario, but
      those figures are a customer-economics case, not a market-size estimate.
      Third, a 2026 company announcement syndicated by an industry publication
      says KnowBe4's AI-related ARR grew more than 35% year to date, while also
      stating that absolute AI revenue and product contribution were not
      disclosed. That is a company-reported growth signal for an adjacent
      product wedge, not evidence of category growth or market share. The
      pyramid therefore shows evidence-constrained layers and leaves monetary
      TAM/SAM/SOM values unavailable.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyers, adoption path, and constraints
    body: >-
      The primary economic buyer is usually a CISO, security-awareness leader, IT
      security team, or compliance function; users are employees and administrators,
      while the payer is the security or IT budget owner. The adoption path is
      baseline assessment, targeted training and simulation, then recurring
      measurement and intervention. Public product descriptions support this
      workflow: administrators enroll users, assign training, run simulated
      phishing, and track results; the ROI study adds automated campaign setup,
      risk grouping, assessments, and reporting. Adoption drivers are the
      frequency and sophistication of social engineering, audit evidence
      requirements, and the need to connect behavior to technical controls.
      Constraints are equally material. Pricing is opaque in the available public
      evidence, some sources describe higher-tier feature gating, administrators
      may face setup or content-navigation overhead, and email-heavy programs can
      miss SMS, voice, social, or other channels. Competitor-issued comparison
      material also says buyers may seek alternatives when outcomes plateau or
      administrative effort climbs; that is directional market evidence, not an
      independent benchmark. The practical buying test is therefore measurable
      behavior change and manageable operating effort, not completion volume alone.
    claimRefs: [CM010, CM011, CM012, CM013, CM014, CM015, CM016]
    tableRefs: [TM003]
