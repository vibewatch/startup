callouts:
  - calloutType: insight
    title: Category expansion is visible, but monetization is not yet measurable
    body: KnowBe4's public positioning is moving from annual security-awareness training toward human-risk management, email and collaboration security, and AI-agent governance. The available evidence supports the direction of travel but not a comparable market-share or TAM claim.
    claimRefs: [CM004, CM008, CM009]
  - calloutType: risk
    title: Completion metrics are an inadequate market proxy
    body: The strongest buying evidence concerns behavior change, reporting, and risk reduction; public customer-economics evidence is sponsored and modeled, while competitor and public descriptions flag pricing opacity, admin effort, content fatigue, and channel limits.
    claimRefs: [CM006, CM012, CM013, CM014, CM015]
