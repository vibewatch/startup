callouts:
  - calloutType: strength
    title: Recurring scale with a broadening platform
    body: "KnowBe4 combines a reported customer base above 70,000 with Fitch's assessment that more than 99% of revenue is recurring, while extending from SAT into email, collaboration, and AI-agent security."
    claimRefs: [CO009, CO010, CO014]
  - calloutType: risk
    title: Leverage and private disclosure
    body: "The $1.46bn first-lien structure, Fitch's B rating, and limited current disclosure on valuation, cash flow, ownership, and cohort metrics make financing and governance diligence central."
    claimRefs: [CO011, CO012, CO013]
  - calloutType: insight
    title: Product expansion still needs proof
    body: "The 2026 launch cadence is clear, but the assigned evidence does not establish product-level revenue, retention, or independently measured outcomes for the newer AI and coaching modules."
    claimRefs: [CO010, CO017, CO018]
