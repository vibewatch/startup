artifact: company-overview
slug: knowbe4
runDate: 2026-10-23
company:
  name: KnowBe4
chapter:
  number: 1
  title: Company Overview
  summary: KnowBe4 is a private, Vista Equity Partners-owned cybersecurity company expanding from security-awareness training into a broader digital-workforce security platform. The evidence supports meaningful scale and recurring revenue, but private-company disclosure remains incomplete and leverage is material.
sections:
  - id: identity-and-business
    title: Identity and business model
    body: KnowBe4 was founded in 2010 and built its initial position around cloud-delivered security-awareness training and simulated phishing. Its current proposition spans attack simulation and training, email and collaboration security, real-time coaching, and AI-agent security, with AIDA and a proprietary risk score presented as connective technology. The company describes this as digital-workforce security, while third-party coverage characterizes the strategic move as an evolution from compliance-oriented training toward human-risk management. The platform is sold as recurring software and services to organizations, but public evidence in this pool does not establish a current audited revenue figure, detailed segment economics, or a complete customer mix.
    claimRefs: [CO001, CO002, CO004]
  - id: ownership-leadership
    title: Ownership, leadership, and governance
    body: KnowBe4 ceased to be a public company when Vista Equity Partners completed its acquisition in February 2023. The transaction source identifies founder Stu Sjouwerman as chairman and chief executive at closing, while current 2026 company messaging quotes Bryan Palma as chief executive. This indicates a material leadership transition since the take-private, although the assigned sources do not provide a complete board roster, ownership waterfall, or formal governance disclosures. The private structure increases the importance of diligence on sponsor control, management incentives, and key-person dependence rather than treating the historical public-company record as current.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002, TO003]
  - id: scale-funding-and-credit
    title: Scale, financing, and disclosure limits
    body: >-
      KnowBe4 reports an installed base of more than 70,000 customers and more than 35% growth in AI-related ARR so far in 2026, but it does not disclose the absolute AI-related revenue or its share of total ARR in the assigned current announcement. Fitch provides the strongest independent credit evidence: more than 99% of revenue is recurring, the company has more than 70,000 customers, and its first-lien debt was $1.46 billion with a $200 million revolver after refinancing. Fitch also rates the issuer B with a stable outlook and highlights elevated leverage, SMB exposure, and product concentration. These data points support scale and revenue visibility while leaving valuation, cash generation, and ownership economics as gaps.
    claimRefs: [CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO001]
  - id: milestones-and-diligence
    title: Milestones and diligence implications
    body: >-
      The milestone record shows a company moving from a 2023 sponsor-backed take-private to a 2024 acquisition-led broadening into cloud email security, a 2025 refinancing, and a sequence of 2026 launches aimed at real-time coaching, simulated vishing, collaboration security, and AI-agent governance. The strategic logic is coherent: extend a large training footprint into adjacent controls and use behavioral data to personalize interventions. The counterweight is execution and proof risk. Current sources do not independently verify product-level revenue contribution, customer retention by segment, or the claimed early risk-score outcomes, and Fitch expects limited deleveraging because sponsor ownership may prioritize returns or acquisitions.
    claimRefs: [CO014, CO016, CO017, CO018]
    figureRefs: [FO001]
