callouts:
  - calloutType: strength
    title: Integrated human-risk workflow
    body: The platform connects training, simulation, scoring, coaching, and email-response workflows rather than leaving customers to stitch together separate awareness and response tools.
    claimRefs: [CE001, CE004, CE006]
  - calloutType: risk
    title: Public proof is uneven
    body: Product breadth is well documented, but independent evidence on reliability, security controls, model governance, and realized risk reduction remains limited.
    claimRefs: [CE010, CE013, CE014]
  - calloutType: recommendation
    title: Diligence priority
    body: Request tenant-level architecture and security documentation, independent outcome data, integration and uptime evidence, AI governance controls, and customer references that can separate training completion from durable behavior change.
    claimRefs: [CE010, CE013, CE014]
