  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: security-governance
      missingEvidence: Independent documentation of tenant isolation, security testing, data retention, privacy controls, service-level objectives, and AI model governance.
      whyItMatters: The platform processes employee behavior and potentially sensitive email or AI-agent activity, so control quality and operating reliability are material to deployment risk.
      diligencePath: Request current SOC 2 or equivalent reports, penetration-test summaries, architecture and data-flow diagrams, subprocessors, retention schedules, incident history, and AI governance documentation under NDA.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: outcome-evidence
      missingEvidence: Customer-level, independently measured evidence linking KnowBe4 deployment to durable behavior change, lower incidents, retention, and total cost of ownership.
      whyItMatters: Completion rates, simulated-phishing metrics, and vendor-modeled ROI do not by themselves prove realized security or financial outcomes.
      diligencePath: Obtain anonymized cohorts with denominators, pre/post methodology, control groups where available, renewal and expansion data, and references from customers using the full platform.
      relatedQuestionRefs: [QE006]
    - type: access-blocked
      severity: minor
      topic: developer-signal
      missingEvidence: A public software-development surface or practitioner telemetry that can independently test release cadence, API stability, package adoption, or integration quality.
      whyItMatters: KnowBe4 is a SaaS platform with limited public developer artifacts, so product maturity cannot be triangulated through repositories or package registries.
      diligencePath: Request API documentation, changelogs, release notes, status history, integration certification materials, and anonymized support or incident metrics.
      relatedQuestionRefs: [QE008]
