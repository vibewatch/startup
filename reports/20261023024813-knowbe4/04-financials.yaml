      topic: historical-financials
      missingEvidence: "Current financial statements that replace the preliminary Q4 2022 margin and cash-flow snapshot."
      whyItMatters: "The historical figures are explicitly preliminary and pre-private-company transition, so they cannot represent 2026 economics."
