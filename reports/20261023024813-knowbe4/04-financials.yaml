      whyItMatters: "The company is private and the assigned sources do not establish whether current growth converts into cash or whether financing obligations constrain operations."
      diligencePath: "Request the latest audited financial statements, lender and refinancing documents, covenant package, and a management cash forecast."
      relatedQuestionRefs: [QI006, QI008]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: unit-economics
      missingEvidence: "CAC, sales cycle, payback, gross retention, net retention, churn, expansion, implementation cost, and channel economics by customer segment."
      whyItMatters: "Seat-based recurring revenue can still be inefficient or exposed to discounting and renewal pressure without cohort-level economics."
      diligencePath: "Request a cohort and funnel pack segmented by SMB, mid-market, enterprise, geography, product family, and acquisition channel."
      relatedQuestionRefs: [QI004, QI007, QI008]
      relatedTableRefs: [TI002, TI003]
