company:
  name: KnowBe4
chapter:
  number: 4
  title: Financials
  summary: KnowBe4 presents a seat-based recurring-revenue model with strong historical margins and current expansion into AI-related products, but public evidence does not disclose current revenue, cash, debt, burn, or realized unit economics. List pricing and customer ROI studies show monetization logic, while negotiated discounts, add-ons, renewal exposure, and company-sponsored evidence leave underwriting dependent on diligence access.
sections:
  - id: revenue-model
    title: Revenue model and traction
    body: >-
      KnowBe4 sells a subscription platform whose commercial unit is the licensed
      user seat. Vendr describes the model as per-user, per-year pricing with
      annual or multi-year contracts, multiple product tiers, add-ons, and
      support options. The 2026 momentum release says the company has more than
      70,000 customers and that AI-related ARR grew more than 35% so far in
      2026, but it does not disclose absolute AI revenue or the share of total
      ARR represented by that growth. The same release attributes expansion to
      AIDA, SAT Advanced, email and collaboration security, and international
      markets. These are company-reported indicators of recurring demand, not
      audited revenue or a segment mix. Historical public-company disclosure
      provides a useful but stale benchmark: preliminary Q4 2022 revenue was
      $89.928 million and ARR was $367.731 million, with 56,867 customers.
      Those figures should not be rolled forward into the 2026 case.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-commercial-efficiency
    title: Pricing, packaging, and sales efficiency
    body: >-
      Published and observed pricing supports a scalable software monetization
      mechanism but not a realized-price forecast. G2 displays a SAT Advanced
      501-1000 seat, three-year price of $2.79 per seat per month, while its
      page also labels pricing as provided by KnowBe4; the displayed scope and
      term make this a list-price datapoint rather than recognized revenue.
      Vendr reports that price varies with seats, tier, term, add-ons, premium
      support, and negotiation, and says multi-year commitments commonly unlock
      15%-30% lower per-user pricing than annual contracts. Vendr also reports
      renewal increases of 15%-30% when not actively negotiated. The evidence
      supports a sales motion based on volume and term expansion, but there is
      no public CAC, payback, sales-cycle, churn, NRR, or channel-margin
      disclosure. Customer ROI material is directional: a vendor-commissioned
      Hobson & Company case modeled a 2,000-seat organization and reported a
      3.5-month payback and 257% three-year ROI under stated assumptions.
      Those assumptions are not evidence of KnowBe4's realized gross margin or
      customer-level payback across the installed base.
    claimRefs: [CI005, CI006, CI007, CI008, CI009]
    tableRefs: [TI002]
  - id: cost-and-capital
    title: Cost structure and capital adequacy
    body: >-
      Historical disclosure indicates software-like gross margins but also shows
      that operating profitability cannot be inferred from gross margin alone.
      KnowBe4's preliminary Q4 2022 release reported GAAP gross margin of 85.4%,
      GAAP operating margin of negative 23.0%, net cash from operating activities
      of $19.483 million, and free cash flow of $17.978 million; the release
      explicitly states that the figures were preliminary, unaudited, and based
      on estimates before closing the financial statements. The 2026 release
      says the company is investing in people, products, and global
      infrastructure, while HRTechEdge reports that it did not disclose
      absolute AI-related revenue or product-level contribution. Public sources
      in this pool do not provide current cash on hand, debt balances,
      refinancing terms, capex, working capital, burn, runway, or next-round
      triggers. The former public-company release also says the company agreed
      to be acquired by Vista in an all-cash transaction and expected to become
      private, making current financing transparency especially important.
    claimRefs: [CI010, CI011, CI012, CI013]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Financial underwriting verdict and blockers
    body: >-
      The financial case is strongest where recurring seat licensing, broad
      product packaging, historical gross margin, and reported customer scale
      are visible. It is weakest where an investor would need current cash
      conversion and cohort economics. KnowBe4's platform breadth may support
      expansion from awareness training into AI, email, collaboration, and
      compliance modules, but Whalemate characterizes the HRM+ positioning as
      KnowBe4's commercial umbrella and notes that the company is being
      rebranded toward HRM; that is market positioning, not proof of product
      mix or attach rates. Techzine reports that the platform uses behavioral
      metrics and integrations and quotes KnowBe4's emphasis on behavior
      change, yet the article does not supply contract-level economics. The
      principal underwriting conclusion is therefore a conditional recurring
      revenue thesis rather than a completed valuation: obtain current audited
      P&L and cash-flow statements, debt and refinancing documents, cohort
      retention by segment, realized price and discount waterfalls, CAC and
      payback, implementation costs, and the revenue and gross-margin split
      across training, email security, compliance, and AI offerings.
    claimRefs: [CI014, CI015]
