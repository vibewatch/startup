      - [AI-related offerings, "AIDA, SAT Advanced, and related AI capabilities", "ARR growth more than 35% so far in 2026; absolute revenue undisclosed", "Current company-reported growth rate", "Obtain product-level ARR, gross margin, attach rate, and retention"]
      - [Email and collaboration security, "Inbound detection, outbound loss prevention, and incident response portfolio", "Described as a 2026 growth driver; no revenue split disclosed", "Company-reported qualitative traction", "Request bookings, ACV, implementation cost, and cross-sell data"]
      - [Customer base, "Organizations using the platform", "More than 70,000 customers in the October 2026 release", "Current company-reported scale", "Reconcile active customers with paid seats, net adds, churn, and concentration"]
    notes: "Historical financial metrics are preliminary and unaudited; current growth and customer figures are company-reported and do not establish recognized revenue, ARR quality, or cash generation."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Pricing evidence, Unit or contract basis, Public value/status, Confidence, Diligence ask]
    rows:
      - [G2 SAT Advanced display, "501-1000 seats, three-year term", "$2.79 per seat per month displayed", "Medium; list-price page", "Confirm tier inclusions, effective annual price, and realized discount"]
      - [Vendr model, "Per user per year; annual or multi-year", "Price varies by seats, tier, term, add-ons, and support", "Medium; anonymized transaction analysis", "Obtain quote waterfall and booked ACV by segment"]
      - [Multi-year discount, "Compared with annual contract", "Vendr reports 15%-30% lower per-user pricing commonly", "Medium; dataset-based estimate", "Test discount distribution and renewal behavior in signed contracts"]
      - [Renewal exposure, "Initial price versus renewal", "Vendr reports 15%-30% renewal increases when not actively negotiated", "Medium; dataset-based estimate", "Review renewal caps, uplift clauses, and gross dollar retention"]
    notes: "G2 is a displayed pricing datapoint and Vendr is an anonymized market analysis; neither establishes KnowBe4's realized blended price, revenue recognition, or margin."
    claimRefs: [CI005, CI006, CI007, CI008]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value or null, Confidence, Why it matters, Diligence ask]
    rows:
      - [GAAP gross margin, "85.4% in Q4 2022", "High for historical primary disclosure; preliminary", "Indicates software-like gross economics but not current margin", "Obtain current audited gross margin by product and hosting/support costs"]
      - [GAAP operating margin, "-23.0% in Q4 2022", "High for historical primary disclosure; preliminary", "Shows operating expenses materially affected reported profitability", "Obtain current EBITDA, operating expense bridge, and sponsor charges"]
      - [Free cash flow, "$17.978M in Q4 2022", "High for historical primary disclosure; preliminary", "Historical cash conversion signal, not current runway", "Obtain current cash-flow statement, cash balance, capex, and working capital"]
      - [CAC, null, "Unavailable in assigned sources", "Without CAC and payback, growth efficiency cannot be underwritten", "Request CAC by segment, sales cycle, payback, channel fees, and implementation burden"]
      - [Net revenue retention, null, "Unavailable in assigned sources", "Expansion and churn determine whether seat growth is durable", "Request NRR, GRR, churn, contraction, and cross-sell cohorts"]
      - ["Cash, debt, and runway", null, "Unavailable in assigned sources", "Private-company financing dependency and refinancing risk remain unresolved", "Request current cash, debt schedule, covenants, maturities, burn, and financing plan"]
    notes: "Null values mean the assigned public evidence did not disclose the metric; they are not zero. Historical 2022 figures were explicitly preliminary and unaudited."
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015]
