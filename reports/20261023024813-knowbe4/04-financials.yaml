callouts:
  - calloutType: risk
    title: Current underwriting data gap
    body: "The assigned evidence supports a recurring seat model and historical software-like margins, but it does not disclose current cash, debt, burn, runway, CAC, retention, or realized product-level economics. A valuation conclusion should remain conditional until those private-company inputs are obtained."
    claimRefs: [CI010, CI013, CI014, CI015]
