company:
  name: CMR Surgical
chapter:
  number: 7
  title: Risks
  summary: CMR Surgical's risk profile is dominated by narrow US indication breadth, a still-limited clinical evidence base, fierce competitive lock-in from Intuitive and other incumbents, and a capital structure that now includes secured venture debt. NICE access remains conditional on evidence generation, US commercialisation starts from a single-procedure clearance, and public financial transparency is limited despite repeated insider-backed financing. No recall or litigation was identified, but IP verification, covenant visibility, reimbursement certainty, and US execution capacity remain material diligence gaps.
sections:
- id: regulatory-clinical-risk
  title: Regulatory & Clinical Evidence Risk
  body: 'CMR Surgical''s most immediate risk is that its US regulatory footprint remains narrow even after finally obtaining FDA authorization. The original Versius Surgical System received de novo authorization in October 2024 only for cholecystectomy in adults aged 22 or older, and the December 2025 510(k) for Versius Plus kept the same single-procedure scope rather than broadening the platform into a multi-specialty US franchise. CMR did submit a gynecology 510(k) in April 2026, but that application was still pending at the report date, so the US launch still depends on one benign-soft-tissue use case. The de novo decision summary also explicitly states that long-term safety and effectiveness for use with or treatment of cancer has not been established, which materially limits oncology expansion and signals a regulator that is likely to demand indication-by-indication evidence packages. NICE is supportive but not definitive: HTG742 is an Early Value Assessment with conditional recommendation
    and a three-year evidence-generation requirement, not a permanent NHS endorsement. Clinical maturity is likewise still early. The 2022 Versius systematic review covered only 328 patients, while the 2025 colorectal review found nine mostly observational single-centre studies covering 561 procedures. No randomised superiority trial versus conventional laparoscopy was identified, and the comparative gap against da Vinci''s much larger evidence base remains substantial. A search of FDA MAUDE did not surface substantive public adverse-event reports, which is encouraging, but the absence of signals this early should be interpreted cautiously rather than as proof that long-run safety risk has been eliminated.'
