- id: commercial-competitive-risk
  title: Commercial Adoption & Competitive Risk
  body: 'Commercial scaling risk is high because CMR has to create demand, train surgeons, and justify economics at the same time. Robotic surgery adoption is not simply a device sale: hospitals need credentialed surgeons, proctored first cases, theatre workflow adaptation, and enough procedure volume across specialties to earn an acceptable return on the capital purchase. Public reporting places Versius system cost around £1 million to £1.5 million, while CMR itself argues that multi-specialty deployment is what makes utilisation attractive. That creates an obvious tension in the US, where the initial label is limited to cholecystectomy and payer reimbursement remains procedurally routed rather than robot-specific. On the training side, the NHS Shelford START programme shows the intensity of the credentialing burden: 50-plus trainees in the pilot year, multi-platform exposure, simulation, wet-lab work, and supervised clinical progression. That structure helps establish legitimacy, but it
    does not create lock-in for CMR because the same programme also covers da Vinci and Hugo. Competition is therefore the second half of the adoption problem. Intuitive has more than 8,000 systems placed and over 14 million procedures completed, while Versius had reached more than 45,000 patients by March 2026. Medtronic''s Hugo has entered the US clearance conversation, Johnson & Johnson continues to advance Ottava, and da Vinci 5 raises the performance benchmark CMR must answer. NICE''s conditional recommendation also covers multiple systems, so UK access cannot be framed as a unique CMR differentiator. The result is a structurally slower commercial velocity than headline patient numbers alone might suggest.'
  claimRefs:
