callouts:
- calloutType: risk
  title: Narrow US Indication Creates Procedural Revenue Concentration
  body: As of Q2 2026, Versius Plus is cleared by the FDA only for cholecystectomy. While the gynecology 510(k) was filed in April 2026, any denial or major deficiency letter would leave CMR with a single-procedure US revenue base well into 2027. Cholecystectomy is a meaningful procedure category, but CMR's broader utilisation thesis depends on multi-specialty deployment, which cannot happen in the US until additional indications are cleared.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR045
- calloutType: risk
  title: Repeated Insider-Only Fundraising at Flat Valuation Signals External Caution
  body: CMR Surgical has raised multiple financings since its $3B Series D in 2021, including $165M in 2023 from existing investors only and a $200M-plus 2025 round that combined equity with Trinity Capital venture debt. The 2025 round introduced asset-backed obligations reflected in Companies House charges 006-009, which increases refinancing sensitivity if US commercial milestones are missed. The lack of a public valuation step-up or broad new-investor syndicate is a meaningful signal of external caution.
  claimRefs:
  - CR029
  - CR030
  - CR031
  - CR032
  - CR033
- calloutType: insight
  title: No Recalls or Adverse Device Reports Found—But Evidence Base Is Early
  body: A search of FDA MAUDE and public records found no product recall, MHRA field safety notice, or enforcement action involving CMR Surgical or Versius. That is positive at this stage of commercialization. However, Versius Plus entered the US only in late 2025 and procedure volume remains modest relative to the millions of historical da Vinci procedures, so the absence of adverse events should be read as an early-stage observation rather than as proof that long-term safety risk has been fully retired.
  claimRefs:
  - CR011
  - CR018
  - CR040
  - CR044
