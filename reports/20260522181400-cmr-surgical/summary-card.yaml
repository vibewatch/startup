summary:
  headline: >-
    CMR Surgical is a compelling strategic asset — the only globally deployed non-ISRG soft-tissue surgical robot with
    both CE mark and FDA authorization — but a 2021 vintage $3B valuation, fully opaque financials, and unproven US
    commercial execution justify a Track recommendation at medium confidence with high risk.
