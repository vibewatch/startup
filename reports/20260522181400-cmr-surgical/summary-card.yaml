  topStrengths:
    - >-
      Only globally deployed non-ISRG soft-tissue robotic surgery platform with both CE mark and FDA authorization (De
      Novo 2024, Versius Plus 510(k) 2025), establishing genuine regulatory and commercial scarcity.
    - >-
      Accelerating procedure volume — 15,000+ in August 2023 to 45,000+ by March 2026 (~50% increase in 11 months from
      30k to 45k) — validates clinical adoption across 30+ countries and seven specialties.
    - >-
      Modular, independently-movable cart architecture and open surgeon console are genuine hardware differentiators
      versus fixed-platform competitors, enabling flexible OR deployment without a dedicated room.
    - >-
      Strong strategic M&A candidacy: second-largest soft-tissue installed base globally makes CMR an attractive
      acquisition target for large medtech strategics seeking a non-ISRG robotic platform.
    - >-
      Experienced US commercial leadership (Chris O'Hara, ex-Intuitive Surgical and Globus Medical) hired in early 2025
      specifically to build US market execution capability.
  topRisks:
    - >-
      US regulatory footprint remains narrow: both FDA authorizations cover only cholecystectomy, a single benign
      soft-tissue procedure; oncology use is explicitly excluded by the De Novo decision summary, limiting near-term US
      revenue potential.
    - >-
      Revenue, gross margin, EBITDA, and burn rate are fully undisclosed; complete financial opacity prevents
      independent assessment of unit economics, cash runway, or path to profitability.
    - >-
      Three CEO changes in approximately two years (Nerseth → Bose → Colella) represent material key-person and
      execution continuity risk, particularly during the critical US commercial launch phase.
    - >-
      The $3B valuation mark dates to the 2021 bull-market peak; neither the 2023 convertible note nor the 2025 equity
      round publicly reset equity upward, and a reported $4B asking price in sale discussions is aspirational, not
      confirmed.
    - >-
      Preference and debt overhang from ~$1.4B in cumulative capital at varied terms, including Trinity Capital secured
      debt with undisclosed covenants, could constrain strategic options or dilute common equity in a liquidity event.
  unresolvedGaps:
    - >-
      Revenue, EBITDA, gross margin, and burn rate are entirely undisclosed; data-room access is required for any
      financial underwriting.
    - >-
      Full cap-table structure, liquidation waterfall, and preference stack are unknown; critical for assessing
      common-equity value in a strategic sale or IPO.
    - >-
      Trinity Capital debt covenants, maturity, and any change-of-control provisions have not been publicly disclosed;
      these could materially constrain strategic optionality.
    - >-
      Complete founding team roster is not publicly available; Mark Slack is the only evidenced co-founder in retained
      sources.
    - >-
      US hospital pipeline, LOI count, and any binding NDA with a strategic acquirer are not disclosed; US commercial
      execution remains entirely unproven at the report date.
    - >-
      Gynecology 510(k) (submitted April 2026) outcome and timeline for additional US indications remain pending;
      multi-specialty US franchise is contingent on these approvals.
