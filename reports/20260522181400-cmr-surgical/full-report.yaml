  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Mechanism
        blocks:
          - type: paragraph
            body: >-
              CMR Surgical operates a capital-hardware-plus-recurring-revenue model characteristic of the
              surgical-robotics industry. Hospitals and ambulatory surgery centres (ASCs) acquire the Versius or Versius
              Plus system, generating an initial capital-equipment transaction; they then consume single-use instruments
              and consumables with each procedure, producing an ongoing recurring-revenue stream. Service and
              maintenance contracts represent a third revenue layer, and the newly launched digital ecosystem — Versius
              Connect (surgeon procedural logbook) and Versius Team (hospital analytics dashboard) — introduces a
              potential fourth layer tied to software and data. This four-stream architecture mirrors the Intuitive
              Surgical da Vinci model, which CMR explicitly positions itself as a more accessible alternative to; it is
              inferred from CMR's product documentation and industry analogues rather than from any official revenue-mix
              disclosure by CMR itself. The company has never published a segment breakdown or revenue-recognition
              policy.


              The only public pricing signal for the Versius system is Sifted's 2023 report that "its flagship product
              Versius, launched in 2019, costs hospitals between £1m–1.5m." This is a list-price reference for the
              original Versius, not Versius Plus, and does not represent realised transaction prices, which may vary by
              geography, healthcare system, volume commitment, or contract structure (sale, lease, or
              pay-per-procedure). No pricing page for Versius or Versius Plus appears on CMR's US website as of the
              runDate; instrument and consumable per-procedure pricing is entirely undisclosed; service contract terms
              and duration are not public; and no realised ASP data has been disclosed. Revenue-recognition treatment
              for multi-year bundled arrangements is unverifiable.


              The digital ecosystem (Versius Connect, Versius Team) was launched with Versius Plus and may carry a
              subscription or per-seat fee, but no pricing or commercialisation details have been released. CMR's CEO
              acknowledged a mission of "delivering sustainable growth and life-changing solutions to the global
              healthcare community" without quantifying revenue or financial targets. The CFO, André Nel, was credited
              publicly with structuring the 2025 financing but has not disclosed revenue figures.
