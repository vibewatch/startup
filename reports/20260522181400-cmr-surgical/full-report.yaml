        - Invalidates primary bull-case driver; confirms ISRG competitive moat is insurmountable at current price
        - Downgrade to Research-More; reassess entry at a materially lower mark
      - - Dilutive down-round at or below $3B
        - New equity financing at valuation below $3B confirmed by Companies House SH01 filing or press release
        - Confirms 2021 Series D investors are impaired; signals inadequate commercial progress to sustain existing mark
        - >-
          Immediate reassessment; likely Avoid unless new capital is provided with substantial warrants or reset
          valuation
      - - Trinity Capital debt covenant breach or acceleration
        - Public disclosure (Companies House MR-series filing) of debt charge enforcement or demand letter
        - Signals financial distress; constrains strategic sale options as buyer inherits debt overhang
        - Accelerate financial data-room request; seek independent confirmation of debt terms
      - - ISRG captures majority of new U.S. cholecystectomy robotic procedures
        - Published market data or ISRG earnings showing >70% share of de-novo U.S. robotic cholecystectomy
        - >-
          CMR's differentiation thesis weakened in its initial U.S. indication; U.S. addressable market materially
          constrained
        - Re-evaluate whether multi-indication pathway is credible on CMR's current runway
      - - 'Regulatory setback: FDA rejects gynecology 510(k)'
        - FDA issues not substantially equivalent (NSE) decision on CMR's gynecology 510(k) application
        - Bull case collapses; addressable U.S. market limited to cholecystectomy indefinitely unless new submission
        - Significant negative signal; revise valuation to bear-case range
      - - Acquisition falls through after public process
        - Confirmed FT/press reports that CMR's sale process ended with no transaction after 12+ months
        - Signals inability to achieve $4B+ strategic price; forces standalone path with uncertain capital requirements
        - Assess probability of standalone IPO or additional private round at revised lower mark
    notes: >-
