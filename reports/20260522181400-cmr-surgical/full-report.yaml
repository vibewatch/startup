            - Gynecology denial delays revenue
            - Cholecystectomy-only revenue through 2026
        - label: Clinical Evidence
          values:
            - Evidence is adequate for approval
            - Small-N studies limit payer adoption
            - Superiority versus laparoscopy remains unproven
        - label: Competitive
          values:
            - Market expands for all players
            - Medtronic and J&J gain share
            - Intuitive lock-in persists at key US accounts
        - label: Commercial Adoption
          values:
            - Training investment pays off quickly
            - Multi-specialty ROI barrier slows ramp
            - Reimbursement uncertainty blocks uptake
        - label: Capital / Financing
          values:
            - 2025 round proves adequate for three years
            - Flat valuation limits next-round options
            - Debt covenant pressure appears if milestones slip
        - label: Legal / IP / Operational
          values:
            - No issues materialise
            - IP moat is unverified and supplier risk persists
            - Leadership transition and site concentration heighten exposure
        - label: Execution (US Launch)
          values:
            - Smooth first-year execution
            - Training and service network bottlenecks emerge
            - Team gaps delay hospital partnerships
