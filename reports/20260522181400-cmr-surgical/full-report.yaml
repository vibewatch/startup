      - number: '6.4'
        title: Evidence Limitations, Retention, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              CMR Surgical's public disclosure on customer economics is sparse. No NRR, GRR, churn rate, contract
              renewal rate, or average contract value has been disclosed. The multi-specialty expansion rate (70%+ of
              hospitals using 2+ specialties) is the closest publicly available proxy for platform stickiness, but it
              measures breadth of use rather than durability of the commercial relationship. The Versius clinical
              registry captures ongoing procedure data, which implies continued engagement, but registry scope and
              participation rates are not characterised.

              Procedure milestones are self-reported without independent audit. The progression from 15,000 procedures
              (Sep 2023) to 45,000 patients (Mar 2026) — across roughly 30 months — implies approximately 1,000
              additional procedures per month in the later periods, which is consistent with a base of 140+ installed
              systems each averaging around 7 procedures per month. However, CMR does not disclose per-system
              utilisation, so this estimate is a rough triangulation only.

              Adverse evidence centres on two signals. First, CMR cut approximately 350 employees in late 2023 — a
              significant restructuring reported by Sifted and Reuters — that raises questions about commercial delivery
              capacity during the period of fastest procedure growth. Second, the CEO transition in late 2024 (Supratim
              Bose stepped down, replaced by Massimiliano Colella) occurred precisely at the FDA clearance milestone,
              introducing leadership continuity risk at the highest- stakes commercial moment. Neither event is
              confirmed to have materially impaired customer delivery, but both are unresolved risks to customer
              confidence in CMR's long-term servicing.

              Concentration risk is meaningful: the NHS constitutes CMR's most visible and documented customer base, and
              NHS procurement is subject to budget pressure, centralised purchasing authority, and policy shifts.
              Over-reliance on vocal NHS reference accounts could become a vulnerability if NHS spending on surgical
              robotics is constrained. The US market entry in 2026 with a single cholecystectomy indication is expected
              to diversify this concentration, but no US revenue contribution has been confirmed yet. CMR's dependence
              on company-issued press releases for international customer proof, and the absence of an independent
              named-customer registry, are structural disclosure limitations that prospective investors and partners
              should note.
