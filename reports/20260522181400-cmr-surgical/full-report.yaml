      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reimbursement Parity Caps the Economic Case for New Hospital Buyers
            body: >-
              CMS does not provide incremental reimbursement for robotic-assisted versus conventional laparoscopic
              procedures, and most commercial payers follow CMS's lead. This parity rule means U.S. hospitals cannot
              increase billing rates by adopting Versius — the economic case must rest entirely on efficiency gains, OR
              throughput, reduced LOS, and surgeon recruitment. For smaller hospitals and ASCs, this constraint is often
              decisive, and the Ipsos 2023 research identified it as the primary structural barrier dividing current
              robot-owners from non-owners. CMR must therefore lead with total cost of ownership and throughput
              economics rather than a revenue-premium argument, which constrains the speed at which smaller segments can
              be converted.
            calloutType: risk
            claimRefs:
              - CM020
              - CM025
          - type: callout
            title: Analyst Market-Size Divergence Is an Analytical Feature, Not a Bug
            body: >-
              The $3.9 B gap between GMInsights' and MarketsandMarkets' 2024 global surgical-robots estimates reflects
              genuine methodological differences — scope (soft-tissue vs. including orthopaedics), revenue recognition
              (equipment vs. procedures), and geographic coverage assumptions — not data errors. Investors and operators
              who average these figures or cite only the most favourable estimate introduce false precision. The correct
              analytical posture is to treat each estimate as a different lens, use bottom-up procedure-volume logic
              (e.g., U.S. cholecystectomy volume × CMR's target instrument price) for SOM modelling, and track quarterly
              Intuitive Surgical filings as the most reliable real-time signal of market direction.
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
              - CM031
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              The soft-tissue surgical robotics sector entered 2025-2026 as the most competitive period in its history.
              Intuitive Surgical continues to dominate with the da Vinci platform, but a wave of well-capitalised
              challengers—Medtronic, Johnson & Johnson, CMR Surgical, and Distalmotion—have each achieved meaningful
              regulatory or commercial milestones. MassDevice characterised the landscape as "the game is truly on"
              after Medtronic entered the US market in late 2025, projecting global robotic surgery revenues to exceed
              $22.2 billion by 2029.


              Competitors span four categories relevant to CMR. First, direct soft-tissue challengers that target the
              same general, urologic, gynecologic, and colorectal indications: Medtronic Hugo, J&J Ottava, and
              Distalmotion Dexter. Second, the incumbent: Intuitive's da Vinci family (Xi, X, SP, and the new da Vinci
              5). Third, adjacent niche systems that compete for hospital robotics capital budgets without overlapping
              indications directly: J&J Monarch (bronchoscopy), MMI Symani (microsurgery), Moon Surgical Maestro
              (collaborative laparoscopy assist), and Avatera (European soft-tissue). Fourth, the status-quo
              substitute—conventional laparoscopy—which represents the most pervasive alternative a hospital procurement
              team can choose instead of any robotic platform.


              Intuitive Surgical had approximately 11,106 da Vinci systems installed globally as of December 2025, up
              12% year-over-year, with procedure growth of approximately 18% in 2025. Its market capitalisation of
              approximately $174 billion dwarfs every named competitor combined. Against this backdrop, CMR's
              competitive challenge is less about out-gunning Medtronic or J&J in technical specifications, and more
              about carving a defensible niche among cost-sensitive mid-tier hospitals and surgical centres before
              Intuitive's second- generation da Vinci 5 further widens the clinical performance gap.
