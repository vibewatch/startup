      - number: '7.4'
        title: Legal, IP & Operational Risk
        blocks:
          - type: paragraph
            body: >-
              The legal and operational picture is mixed: there are no obvious red flags such as public recalls or
              litigation, but several important diligence questions remain open. Public patent searches conducted
              through Google Patents and WIPO Patentscope returned documents unrelated to CMR Surgical, so the company's
              defensive IP perimeter could not be independently verified from the public-search steps captured for this
              chapter. That does not prove a weak portfolio, but it does mean freedom-to-operate and moat claims still
              require direct management evidence. Legal exposure also exists at the product-use level. The FDA de novo
              label is narrow and includes explicit restrictions around prescription use, trained physician supervision,
              patient age, and non-oncology use; hospitals that drift into off-label or under-trained use create
              device-liability and documentation risk. Companies House charge records add another layer, because secured
              debt obligations can create contractual encumbrances on assets precisely when a first-year US launch needs
              flexibility. Operationally, the company appears concentrated in Cambridge, UK, and no public second-site
              manufacturing or business-continuity plan was identified. That matters because scaling the US in 2026
              requires not just sales hiring but field service, training throughput, post-market surveillance, and
              reliable instrument support. Leadership turnover adds to that complexity: CEO Supratim Bose stepped down
              in October 2024 during the FDA clearance window, Massimiliano Colella became the permanent chief
              executive, and CMR also strengthened legal leadership with a new chief legal and business affairs officer.
              Those are manageable developments, but together they underline that CMR is still building the legal,
              operational, and compliance machinery required for a durable US market entry.
            claimRefs:
