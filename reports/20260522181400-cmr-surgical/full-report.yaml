companyProfile:
  summary: >
    CMR Surgical is a Cambridge, UK-based private surgical robotics company incorporated in January 2014 as Cambridge
    Medical Robotics Limited (renamed CMR Surgical in 2018). The company develops and commercialises the Versius and
    Versius Plus modular soft-tissue robotic surgery platforms — cart-based, independently movable systems designed to
    make minimal access surgery universally accessible. Versius Plus adds vLimeLite NIR/ICG fluorescence imaging,
    enhanced energy instruments, and a cloud-connected digital ecosystem (Versius Connect surgeon logbook, Versius Team
    hospital analytics dashboard). By March 2026 more than 45,000 patients had been treated globally across 30+
    countries, making Versius the second most widely deployed soft-tissue surgical robot globally after Intuitive
    Surgical's da Vinci. CMR received FDA De Novo authorization in October 2024 for the original Versius and 510(k)
    clearance for Versius Plus in December 2025, both for cholecystectomy. A gynecology 510(k) was pending as of April
    2026. The company has raised approximately $1.4B in cumulative capital — including a $600M Series D in 2021
    (SoftBank Vision Fund 2, Ally Bridge Group), a £133M ($165M) convertible loan note in September 2023, and a $200M+
    equity-and-debt round in April 2025 with Trinity Capital as the new debt provider. Revenue, margins, and burn rate
    are entirely undisclosed.
