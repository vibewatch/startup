          - type: callout
            title: Repeated Insider-Only Fundraising at Flat Valuation Signals External Caution
            body: >-
              CMR Surgical has raised multiple financings since its $3B Series D in 2021, including $165M in 2023 from
              existing investors only and a $200M-plus 2025 round that combined equity with Trinity Capital venture
              debt. The 2025 round introduced asset-backed obligations reflected in Companies House charges 006-009,
              which increases refinancing sensitivity if US commercial milestones are missed. The lack of a public
              valuation step-up or broad new-investor syndicate is a meaningful signal of external caution.
