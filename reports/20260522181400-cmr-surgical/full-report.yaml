            title: Narrow US Indication Creates Procedural Revenue Concentration
            body: >-
              As of Q2 2026, Versius Plus is cleared by the FDA only for cholecystectomy. While the gynecology 510(k)
              was filed in April 2026, any denial or major deficiency letter would leave CMR with a single-procedure US
              revenue base well into 2027. Cholecystectomy is a meaningful procedure category, but CMR's broader
              utilisation thesis depends on multi-specialty deployment, which cannot happen in the US until additional
              indications are cleared.
