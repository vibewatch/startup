  - id: FI002
    title: Unit Economics Bridge — System and Instrument Contribution (Qualitative)
    type: flow
    layout: standard
    summary: >-
      Qualitative flow from system list price through undisclosed hardware COGS and instrument-revenue contribution to
      estimated lifetime value per installed system, with financing drag from Trinity Capital debt reducing net return
      on deployed capital.
    data:
      nodes:
        - id: system-asp
          label: System ASP (£1m–1.5m list, Sifted 2023)
          detail: >-
            Only public price point; applies to original Versius only. Versius Plus pricing unknown. Realised ASP may
            diverge from list due to geography and contract type.
          tone: neutral
        - id: hardware-cogs
          label: Hardware COGS (undisclosed)
          detail: >-
            Precision robotics manufacturing, BOM, robotic arms, vision hardware, and Ely facility overhead. No COGS or
            gross-margin data publicly disclosed.
          tone: negative
        - id: gross-margin-system
          label: System Gross Margin (unknown)
          detail: >-
            Intuitive Surgical's da Vinci system gross margin is approximately 65–70% at mature scale; CMR's is
            unverified and likely lower at current volumes.
          tone: negative
        - id: instrument-contribution
          label: Instrument Revenue Per Procedure (undisclosed)
          detail: >-
            Single-use instruments consumed at each surgery. Per-procedure pricing unknown; high-margin recurring stream
            typical of the medtech capital-equipment model.
          tone: positive
        - id: recurring-value
          label: Lifetime Revenue Per Installed System (estimated)
          detail: >-
            Highly sensitive to utilisation rate, instrument pricing, and service contract value. Cannot be quantified
            from public data. Procedure count growth (15k→30k→45k+) is a positive leading indicator.
          tone: neutral
        - id: financing-drag
          label: Capital Financing Drag (Trinity Debt, up to $68.75M)
          detail: >-
            Trinity Capital growth-capital facility carries interest obligations and potential covenants that reduce net
            capital available for operations and increase the minimum scale needed for cash-flow break-even.
          tone: negative
      edges:
        - from: system-asp
          to: hardware-cogs
          label: Less manufacturing cost
        - from: system-asp
          to: gross-margin-system
          label: System margin (residual; undisclosed)
        - from: instrument-contribution
          to: recurring-value
          label: Procedure-volume multiplier
        - from: gross-margin-system
          to: recurring-value
          label: Combined lifetime contribution
        - from: financing-drag
          to: recurring-value
          label: Reduces net return per deployed unit
    approximationNotes: >-
      All node values are either undisclosed or estimated from industry analogues. Intuitive Surgical da Vinci
      benchmarks are used as directional comparisons only; CMR's actual margins may differ materially due to lower
      volumes, higher field-service intensity, and a more nascent manufacturing scale. This figure is qualitative.
    claimRefs:
