            body: >-
              CMR does not publish NRR, GRR, churn rate, average contract length, or individual site renewal rates. The
              70%+ multi-specialty adoption rate and 60%+ procedural growth rate are the only observable proxies for
              customer durability, and both are self-reported by the company. Without independent verification of
              whether hospitals renew service agreements, continue purchasing instruments, or decommission systems,
              investors cannot distinguish genuine retention from first-cycle purchase inertia. The 350-employee
              restructuring in late 2023 and the CEO transition in late 2024 add uncertainty to the interpretation of
              these figures.
            calloutType: risk
            claimRefs:
              - CU034
              - CU035
              - CU036
              - CU038
              - CU039
          - type: callout
            title: Multi-Specialty Expansion Is the Key Commercial Moat Signal
            body: >-
              The most commercially important customer behaviour Versius has demonstrated is the 70%+ rate at which
              hospitals adopt a second specialty after initial deployment. This pattern reduces per- system capital cost
              amortisation for the hospital, raises CMR instrument revenue per installed unit, and deepens the surgeon
              training and workflow commitment that makes switching to a competitor more costly. If this rate holds as
              the US install base grows, it would provide a meaningful revenue ramp well ahead of net new hospital
              acquisitions. The first priority for diligence is verifying whether this rate reflects active
              multi-specialty procedures or merely idle system availability across departments.
            calloutType: insight
            claimRefs:
              - CU013
              - CU014
              - CU041
              - CU044
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory & Clinical Evidence Risk
        blocks:
          - type: paragraph
            body: >-
              CMR Surgical's most immediate risk is that its US regulatory footprint remains narrow even after finally
              obtaining FDA authorization. The original Versius Surgical System received de novo authorization in
              October 2024 only for cholecystectomy in adults aged 22 or older, and the December 2025 510(k) for Versius
              Plus kept the same single-procedure scope rather than broadening the platform into a multi-specialty US
              franchise. CMR did submit a gynecology 510(k) in April 2026, but that application was still pending at the
              report date, so the US launch still depends on one benign-soft-tissue use case. The de novo decision
              summary also explicitly states that long-term safety and effectiveness for use with or treatment of cancer
              has not been established, which materially limits oncology expansion and signals a regulator that is
              likely to demand indication-by-indication evidence packages. NICE is supportive but not definitive: HTG742
              is an Early Value Assessment with conditional recommendation and a three-year evidence-generation
              requirement, not a permanent NHS endorsement. Clinical maturity is likewise still early. The 2022 Versius
              systematic review covered only 328 patients, while the 2025 colorectal review found nine mostly
              observational single-centre studies covering 561 procedures. No randomised superiority trial versus
              conventional laparoscopy was identified, and the comparative gap against da Vinci's much larger evidence
              base remains substantial. A search of FDA MAUDE did not surface substantive public adverse-event reports,
              which is encouraging, but the absence of signals this early should be interpreted cautiously rather than
              as proof that long-run safety risk has been eliminated.
