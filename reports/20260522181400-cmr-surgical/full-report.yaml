      - number: '6.2'
        title: Adoption Trajectory and Deployment Breadth
        blocks:
          - type: paragraph
            body: >-
              Versius has progressed through a sequence of publicly reported procedure milestones: 15,000 cases
              (September 2023), 17,000 procedures in full-year 2023 (60%+ growth vs 2022), 20,000+ cases across seven
              specialties, 26,000+ globally at the time of FDA clearance (October 2024), 30,000+ cases in February 2025,
              and 45,000+ patients globally by March 2026. These milestones are self-reported by CMR via press releases
              and have not been independently audited, but they represent a consistent and accelerating trajectory over
              a roughly 30-month window.

              The installed system base closed 2023 more than 50% above the prior year level, with 140+ systems globally
              deployed by end-2023. CMR reports Versius is deployed in more than 30 countries spanning Europe, Asia, the
              Middle East, Africa, and Latin America, with new markets including Greece and Indonesia entered in 2023.
              The company describes Versius as the second most widely used soft-tissue surgical robotic platform
              globally, positioning it behind Intuitive Surgical's da Vinci. The US market, entered in 2026, is framed
              as the primary commercial growth lever.

              A particularly strong signal of repeat utilisation and expansion is the multi-specialty adoption rate:
              over 75% of hospitals were using Versius across two or more specialties at the 20,000-case milestone, and
              over 70% retained that behaviour at the 30,000-case milestone in February 2025. Procedure volume per
              installed system is not disclosed, so utilisation efficiency cannot be independently calculated. The
              Versius clinical registry — which captures procedure data across hospital sites — supports ongoing data
              sharing with surgeons, indicating a level of platform stickiness, but registry participation and follow-up
              rates are not publicly characterised.
