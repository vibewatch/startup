  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: System Architecture and Core Design
        blocks:
          - type: paragraph
            body: |
              The Versius Plus Surgical System is a software-controlled modular electromechanical
              robotically assisted surgical device (RASD) classified by the FDA under 21 CFR 878.4964
              (Class II, product code SCV). The system consists of a surgeon console, a visualization
              bedside unit, up to three independent instrument bedside units, a suite of surgical
              instruments, and sterile drapes. Each instrument bedside unit incorporates an 11-joint
              robot arm (J1–J11): joints J1–J8 position and orient the arm in the OR, while joints
              J9–J11 actuate the wristed end effector to translate surgeon hand-controller inputs
              into precise instrument movements. This architecture directly biomimics the human arm,
              providing the dexterity and range of motion that CMR claims enables flexible port
              placement consistent with surgeons' preferred laparoscopic technique.

              The surgeon console is positioned outside the sterile field and serves as the central
              power and data communications hub for all connected bedside units. Its adjustable height
              allows the surgeon to sit or stand during a procedure, and the open console design
              preserves line-of-sight communication with the scrub nurse and anesthesiologist — a
              feature CMR highlights as a key ergonomic differentiator. The head-up display (HUD)
              provides a live 3D HD endoscopic image plus instrumentation icons and system-state
              overlays. Console telemetry data is recorded and, when connected to a local network,
              uploaded automatically to the Versius Cloud for post-procedure diagnostics and
              post-market surveillance.

              The defining operational differentiator is the independent mobility of each bedside unit:
              each instrument and visualization unit mounts on its own wheeled surgical cart with a
              brake mechanism, allowing OR teams to configure the robot around the patient bed without
              a dedicated operating room or floor-mounted infrastructure. This contrasts with tethered,
              integrated-boom systems that require purpose-built OR suites. CMR claims Versius Plus can
              be seamlessly moved between departments and procedure types, enabling hospitals and
              ambulatory surgery centers to share a single robot across multiple ORs.
