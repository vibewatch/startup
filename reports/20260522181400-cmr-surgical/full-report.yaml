  - id: FR001
    title: 'CMR Surgical Risk Heatmap: Severity vs Likelihood'
    type: matrix
    layout: wide
    summary: >-
      Risk severity and likelihood are mapped across the principal risk categories; the right-most cells contain the
      dominant downside driver for each category.
    data:
      columns:
        - Low Likelihood
        - Medium Likelihood
        - High Likelihood
      rows:
