            body: >
              With only approximately 40% of eligible procedures performed using minimally invasive techniques in
              advanced healthcare systems, the dominant alternative to any robotic platform—including CMR's—is continued
              laparoscopy, not a rival robot. Every competitor in the sector faces this shared inertia; the first-order
              sales challenge is converting open/laparoscopic procedures to robotic, not winning share from other robot
