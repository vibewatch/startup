  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              CMR Surgical's last confirmed equity valuation of approximately $3 billion was set at its September 2021
              Series D financing of $600 million, co-led by SoftBank Vision Fund 2 and other existing investors. The
              2023 £133 million convertible loan note, drawn exclusively from existing backers, carried undisclosed
              conversion terms; Sifted reported the event as effectively flat relative to the 2021 mark, and no higher
              valuation was publicly confirmed. The April 2025 $200 million-plus financing round combined equity and
              debt: Trinity Capital committed $68.75 million as venture debt, and the residual equity was supported by
              all major existing investors — SoftBank, LightRock, and Ally-Bridge — again without disclosing a new
              equity mark. TechFundingNews cited a $3 billion valuation 'as of September 2023,' reinforcing that the
              last mark remained the 2021 figure rather than a 2023 step-up. Total lifetime capital raised is estimated
              at approximately $1.4 billion per TechFundingNews; Growjo cited $974.7 million, a figure likely reflecting
              stale or narrower scope, and the discrepancy underscores the opacity of CMR's cap-table history. Reported
              revenue — Growjo estimated $327 million annually — lacks any audited basis and is a modeled inference.
              Applying ISRG-comparable revenue multiples to CMR without verified financials would be methodologically
              unsound. The most credible public signal on current valuation comes from Financial Times reporting, cited
              by MD+DI and MassDevice, that CMR hired advisors and put itself up for sale at a target of up to $4
              billion in mid-2025 — a signal of aspirational strategic exit pricing, not a confirmed valuation mark. The
              valuation stance is therefore best described as the $3 billion last mark, with credible strategic-exit
              aspiration at $4 billion, and meaningful downside risk if the U.S. launch underperforms.
