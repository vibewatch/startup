          - type: callout
            title: No Recalls or Adverse Device Reports Found—But Evidence Base Is Early
            body: >-
              A search of FDA MAUDE and public records found no product recall, MHRA field safety notice, or enforcement
              action involving CMR Surgical or Versius. That is positive at this stage of commercialization. However,
              Versius Plus entered the US only in late 2025 and procedure volume remains modest relative to the millions
              of historical da Vinci procedures, so the absence of adverse events should be read as an early-stage
              observation rather than as proof that long-term safety risk has been fully retired.
