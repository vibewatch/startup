            title: Intuitive's da Vinci 5 Raises the Competitive Bar
            body: >
              The da Vinci 5's 10,000× compute increase, AI-driven surgical insights, force-feedback instruments, and
              real-time analytics launched in 2025 materially widen the feature gap that every challenger—including CMR
              Versius Plus—must now close. CMR's 2026 US launch arrives into an incumbent that has simultaneously
