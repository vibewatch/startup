  - id: FU001
    title: Versius Customer Journey Map — Segments, Adoption Surfaces, and Expansion Loops
    type: journey-map
    layout: wide
    summary: >-
      Customer segments, their entry path into Versius, and the multi-specialty expansion loop that drives platform
      stickiness.
    data:
      nodes:
        - id: awareness
          label: Surgeon / Hospital Awareness
          description: >-
            Conference exposure, peer referral, NICE/NHS endorsement, CMR direct sales. Customer segments: NHS Trust,
            International Private Hospital, US Hospital/ASC (2026+), Academic/Clinical Trial Site.
        - id: evaluation
          label: Clinical Evaluation & Site Visit
          description: >-
            Proctored cases, simulation training, CMR Academy, wet-lab demos. All segments undergo surgical evaluation;
            academic sites emphasise protocol review.
        - id: procurement
          label: Hospital Procurement Approval
          description: >-
            Trust board sign-off, NHS procurement framework, NICE guidance (UK); CFO / CMO approval (international). US
            ASC pathway requires FDA clearance (cleared Oct 2024).
        - id: single-specialty
          label: Initial Deployment — 1 Specialty
          description: >-
            Most common entry points: general surgery, gynecology, or urology. International and NHS segments both start
            single-specialty in most documented cases.
        - id: multi-specialty
          label: Expand to 2+ Specialties (>70% of hospitals)
          description: >-
            Modular design enables move between ORs; same system used by multiple surgical departments. Published
            milestones confirm >70% of Versius hospitals reach this stage.
        - id: training-network
          label: Training Programme Integration (START / Robotics Academies)
          description: >-
            Hospital becomes training centre; Versius embedded in surgical residency curriculum. MFT/Shelford Group
            START programme is the key UK example (2026).
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU013
