      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The structural growth case for soft-tissue RA-MIS rests on multiple reinforcing dynamics. Global MIS
              adoption is still expanding — roughly 15 % annual growth in robotic procedure volumes has been cited (PMC
              economic review) — driven by an ageing population with complex multi-morbidity, rising chronic-disease
              prevalence, and surgeon willingness to move high-volume general surgery procedures (cholecystectomy,
              hernia, hysterectomy) to robotic platforms. Surgeon ergonomics represent a structural demand driver:
              conventional laparoscopy causes repetitive-strain injury and fatigue in lengthy procedures, and robotic
              platforms that offer ergonomic consoles reduce physical burden and are positioned as tools for career
              longevity. Hospital capacity and throughput pressure — demonstrated acutely during COVID-19 and modelled
              by the USC Schaeffer Center — incentivises shorter stays and faster OR turnover, both of which MIS and
              RA-MIS can deliver. The NICE early value assessment (HTG742) conditionally recommending five soft-tissue
              robotic systems for the NHS, with a structured three-year evidence-generation programme, signals
              regulatory pathway maturity in a key international market.

              Constraints are substantial. Capital intensity remains the primary barrier: hospital capital committees
              must approve $1–2.5 M+ per system, competing against imaging, pharmacy, and facility investments. CMS
              reimbursement parity (no premium for robotic procedures) removes a financial incentive for U.S. hospitals
              to switch from laparoscopy or to add a second robot. Training burden is material — surgeons must complete
              credentialling programmes before using a new platform, and the entire OR team requires retraining,
              creating transition costs estimated to deter adoption at many facilities (Ipsos). Incumbent switching cost
              is acute: the da Vinci installed base is deeply embedded, surgeons are credentialled on it, service
              contracts are in place, and procedural volumes are optimised for it. New entrants face the challenge of
              displacing a proven system or convincing buyers to add a second robot. Clinical evidence gaps persist: a
              2023 systematic review across 14 thoracic and visceral procedures found conclusive evidence of RAS
              superiority impeded by inconsistent and insufficient data, weakening the premium-price argument for
              payers. NICE's conditional (rather than full) approval for soft-tissue robots reflects this evidence
              uncertainty. CMR's initial U.S. indication (cholecystectomy only) further limits addressable volume at
              launch.
