  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              The relevant market for Versius is robotic-assisted minimally invasive surgery (RA-MIS) on soft tissue — a
              subset of the broader surgical robotics market that includes laparoscopic-equivalent procedures in general
              surgery, gynaecology, urology, and thoracics, but explicitly excludes orthopaedic robotic systems (e.g.
              Stryker Mako, Zimmer Biomet ROSA) that address bone milling and joint replacement under entirely different
              clinical workflows, reimbursement codes, and capital committees. This boundary matters because most
              published analyst TAM figures aggregate soft-tissue and orthopaedic robotics — a design choice that
              inflates the serviceable headline number for CMR but obscures competitive dynamics where orthopaedics
              incumbents are not direct rivals.

              Within soft-tissue RA-MIS the revenue stack comprises three layers: (1) capital equipment (robotic systems
              sold or leased), typically $1–2.5 M per system; (2) instruments and accessories, the high-margin recurring
              revenue stream that accounts for 55–60 % of the total market by value; and (3) service contracts,
              training, and digital ecosystem fees. Procedure throughput is the economic engine — higher utilisation
              drives instrument pull-through and justifies the capital investment. The status-quo substitute for RA-MIS
              is conventional laparoscopy, which is mature, cost-effective, and well-understood by surgeons and payers;
              it sets the floor for the clinical-and-economic case CMR must make.

              Adjacent markets include: flexible robotic bronchoscopy (Auris/J&J Monarch platform, targeting lung
              diagnostics); orthopaedic robotics (Intuitive ION, Stryker Mako); and neurosurgical/spinal robotics. None
              of these directly compete with Versius in its cleared indications. Prostatectomy via the da Vinci system
              is already established NHS practice and is outside the scope of the NICE soft-tissue EVA guidance
              (HTG742), confirming a distinct regulatory and competitive sub-segment.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
