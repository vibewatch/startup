      - number: '2.2'
        title: Market Sizing Evidence
        blocks:
          - type: paragraph
            body: >-
              Published market-size estimates for surgical robotics diverge substantially and should be treated as
              directional indicators rather than precise inputs. MarketsandMarkets valued the global surgical robots
              market at $11.98 B in 2024, projecting $27.14 B by 2030 at a 14.7 % CAGR. GMInsights published a markedly
              lower 2024 figure of $8.1 B but a more aggressive growth forecast to $38.4 B by 2034 at 17.2 % CAGR.
              Fortune Business Insights reported the robotic surgical procedures market (measuring procedure revenue,
              not equipment alone) at $13.32 B in 2025. The three-way divergence — reflecting different scope
              definitions, methodology choices, and revenue recognition conventions — is an irreducible ambiguity in the
              published data; preserving it is more analytically honest than averaging.

              North America consistently commands 60–74 % of the global market across sources, making the U.S. market
              the single most consequential geography. Applying the lower bound (60 %) to the lower 2024 global estimate
              ($8.1 B) implies a U.S. surgical robots market of approximately $4.9 B; applying the upper bound (74 %) to
              the higher estimate ($11.98 B) yields roughly $8.9 B. These are TAM figures for the full market and
              overstate the addressable opportunity for a new soft-tissue entrant without orthopaedic indications.

              A narrower SAM lens — limited to soft-tissue RA-MIS capital, instruments, and services — is not directly
              published by any analyst in the retained source set. General surgery (including hernia, cholecystectomy,
              bariatric, colorectal) accounts for 28–32 % of the total surgical robots market by application
              (MarketsandMarkets), but that share is dominated by the established da Vinci installed base. SOM for CMR
              in the U.S. is not estimable from public data at launch and depends on procedure ramp rate, per-procedure
              instrument pricing, and installed system count — all private data. The sizing evidence available is
              therefore best characterised as a broad TAM orientation rather than a precision SAM/SOM model.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
