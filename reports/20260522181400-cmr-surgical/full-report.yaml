      - number: '5.3'
        title: Digital Ecosystem and Training Stack
        blocks:
          - type: paragraph
            body: |
              CMR Surgical positions Versius Plus as a "digitally driven" system rather than a
              purely hardware device. The digital ecosystem consists of two dedicated apps:
              Versius Connect, a surgeon-facing near-real-time procedural logbook enabling
              surgeons to review their case data and track proficiency metrics; and Versius Team,
              a hospital administration dashboard providing live tracking of usage, case volume,
              system efficiency, and robotics programme performance. Both apps draw from telemetry
              data that the surgeon console continuously logs and uploads to Versius Cloud whenever
              a local network connection is available. CMR claims this data layer enables continuous
              software-driven innovation, allowing the system to evolve without hardware replacement.
              The US Versius Plus ecosystem also incorporates the EIZO CuratOR OR display as a
              third-party component.

              The vLimeLite fluorescence visualization system integrates near-infrared (NIR) imaging
              using indocyanine green (ICG) dye, enabling real-time biliary anatomy visualization
              during cholecystectomy. CMR notes that ICG is a drug that must be independently
              sourced by the hospital, representing a supply chain dependency outside CMR's direct
              control. The regulatory approval status of ICG may vary by country.

              CMR's training stack for US market entry includes Versius Trainer, Versius eLearning,
              peer-to-peer connectivity, and virtual reality (VR) app modules. An independent
              single-blinded randomized controlled trial (ISCRTN 10064213) found that immersive
              VR (IVR) headset training was significantly more effective than e-learning for
              preparing robot-naïve individuals to set up the CMR Versius in the operating room:
              IVR participants achieved a median overall score of 53.5 vs. 84.5 for e-learning
              participants (lower is better; p<0.001), and IVR recipients performed tasks
              independently more frequently with less physical assistance required. Time to
              completion did not differ significantly. This independent validation supports the
              clinical value of CMR's VR training component, though the authors note that ongoing
              deliberate practice remains necessary for optimal performance.
            claimRefs:
              - CE014
