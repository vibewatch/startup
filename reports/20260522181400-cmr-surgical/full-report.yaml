  - id: FI001
    title: Revenue Model Bridge — How Customer Activity Converts to Revenue
    type: flow
    layout: wide
    summary: >-
      Four revenue streams flow from each hospital or ASC customer: capital equipment, instruments/consumables,
      service/maintenance, and digital ecosystem. Gross revenue and margin are undisclosed; stream mix is inferred from
      product evidence and industry analogues.
    data:
      nodes:
        - id: hospital
          label: Hospital / ASC Customer
          detail: >-
            Acquires Versius Plus; commits to capital transaction and ongoing consumable and service spend. 45,000+
            patients treated as of March 2026 across 30+ countries.
          tone: neutral
        - id: system-sale
          label: Capital Equipment Revenue
          detail: >-
            One-time or amortised system sale/lease. List price £1m–1.5m for original Versius (Sifted 2023); Versius
            Plus pricing undisclosed.
          tone: neutral
        - id: instruments
          label: Instruments & Consumables
          detail: >-
            Single-use instruments per procedure. Per-procedure pricing entirely undisclosed; likely high-margin
            recurring stream based on industry analogues.
          tone: positive
        - id: service
          label: Service & Maintenance
          detail: >-
            Ongoing field service, preventive maintenance, and application specialist support. Contract terms and
            pricing not public.
          tone: neutral
        - id: digital
          label: Digital Ecosystem
          detail: >-
            Versius Connect (surgeon logbook) and Versius Team (hospital analytics dashboard). Potential subscription or
            data-analytics revenue layer; commercialisation terms not disclosed.
          tone: neutral
        - id: gross-revenue
          label: Gross Revenue (Undisclosed)
          detail: >-
            Total of all four streams. No revenue, ARR, gross margin, or segment mix has been publicly disclosed by CMR
            Surgical at any point in its commercial history.
          tone: negative
      edges:
        - from: hospital
          to: system-sale
          label: System purchase / lease
        - from: hospital
          to: instruments
          label: Per-procedure consumables
        - from: hospital
          to: service
          label: Service contract
        - from: hospital
          to: digital
          label: App / data ecosystem
        - from: system-sale
          to: gross-revenue
          label: Capital component
        - from: instruments
          to: gross-revenue
          label: Recurring component
        - from: service
          to: gross-revenue
          label: Service component
        - from: digital
          to: gross-revenue
          label: Digital component
    approximationNotes: >-
      Revenue stream structure is inferred from CMR product documentation and Intuitive Surgical (da Vinci) industry
      analogue. No CMR revenue mix or recognition policy has been disclosed. The gross-revenue node represents an
      unquantified aggregate.
