  - id: FV001
    title: Recommendation Logic Chain
    type: flow
    layout: wide
    summary: >-
      Traces the logical path from CMR's market position, clinical proof, competitive moat, financial opacity, and
      valuation signals to the Track recommendation.
    data:
      nodes:
        - id: market
          label: Market tailwind
          detail: >-
            Surgical robotics $8–14B in 2024 growing at 14–17% CAGR; only ~40% of MIS globally uses robotics —
            significant headroom.
          tone: positive
        - id: proof
          label: Clinical proof and traction
          detail: >-
            45k+ procedures globally (March 2026); 30k in April 2025 to 45k in 11 months; second most adopted
            soft-tissue robot worldwide; FDA cleared.
          tone: positive
        - id: moat
          label: Strategic scarcity and moat
          detail: >-
            Only non-ISRG soft-tissue robot with both CE mark and FDA clearance; modular, portable design differentiated
            from da Vinci's fixed-console architecture.
          tone: positive
        - id: risk
          label: Execution and financial risk
          detail: >-
            Revenue undisclosed; U.S. launch on ISRG home turf with narrow initial indication; $1.4B+ capital deployed;
            Trinity debt covenants unknown.
          tone: negative
        - id: valuation
          label: Valuation context
          detail: >-
            $3B last equity mark (2021); no fresh step-up in 2023 or 2025 rounds; FT-reported $4B asking aspirational
            only; stance = Stretched.
          tone: warning
        - id: recommendation
          label: TRACK — Medium confidence, High risk
          detail: >-
            Proceed with diligence; validate U.S. pipeline, cap-table, and burn rate before committing capital. Strong
            strategic thesis with significant unresolved uncertainty.
          tone: neutral
      edges:
        - from: market
          to: recommendation
        - from: proof
          to: recommendation
        - from: moat
          to: recommendation
        - from: risk
          to: valuation
        - from: valuation
          to: recommendation
    approximationNotes: null
    claimRefs:
