              Medtronic and J&J hold pre-existing bundled contracts with most large IDNs, multi-product supply
              relationships, and global service organisations. CMR's inability to bundle Versius with a broader device
              portfolio means it enters every sales conversation on a stand-alone basis. This structural disadvantage
              will compound as Medtronic scales US Hugo deployment and J&J prepares Ottava.
