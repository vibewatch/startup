  - id: FV004
    title: Investment KPI Scorecard
    type: kpi
    layout: wide
    summary: >-
      IC-ready scoring of CMR Surgical across seven investment dimensions on a 1–10 scale, reflecting public evidence
      through May 2026.
    data:
      items:
        - label: Market Opportunity
          value: 9/10
          detail: >-
            Surgical robotics at $8–14B in 2024 growing at 14–17% CAGR; MIS underpenetration globally is a durable
            growth driver.
          tone: positive
        - label: Clinical and Regulatory Proof
          value: 7/10
          detail: >-
            45k+ procedures, FDA de novo clearance, CE mark; second most adopted soft-tissue robot globally. U.S. RCT
            data still limited.
          tone: positive
        - label: Competitive Moat
          value: 6/10
          detail: >-
            Unique modular architecture and only non-ISRG FDA soft-tissue robot; but ISRG's installed base, data, and
            clinical relationships create very high switching costs.
          tone: neutral
        - label: Financial Transparency
          value: 1/10
          detail: >-
            Revenue, gross margin, EBITDA, and burn rate are entirely undisclosed. Statutory FY2024 accounts filed April
            2025 but not yet reviewed.
          tone: negative
        - label: U.S. Execution Readiness
          value: 5/10
          detail: >-
            FDA cleared (cholecystectomy); Versius Plus 510(k) cleared Dec 2025; formal U.S. launch announced at SAGES
            March 2026. Adoption KPIs unavailable.
          tone: neutral
        - label: Valuation Discipline
          value: 3/10
          detail: >-
            $3B mark is from 2021 bull market; no step-up confirmed in 2023 or 2025; $4B ask aspirational. Strategic
            scarcity provides upside but current mark is stretched.
          tone: negative
        - label: Evidence Quality
          value: 5/10
          detail: >-
            Good procedure and regulatory traction evidence; poor financial fundamentals evidence; sale process
            reporting is second-hand. Gaps are material to conviction.
          tone: neutral
    approximationNotes: >-
      Scores are qualitative assessments by the analyst based on the weight and quality of public evidence; not a
      quantitative model output.
    claimRefs:
      - CV003
      - CV013
      - CV015
      - CV016
      - CV024
      - CV035
      - CV039
