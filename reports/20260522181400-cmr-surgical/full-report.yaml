  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base and Segment Profile
        blocks:
          - type: paragraph
            body: >-
              CMR Surgical sells Versius exclusively to hospitals, health systems, and (in the US) ambulatory surgery
              centres (ASCs). The direct user is the operating surgeon; the buyer and payer is the hospital or trust
              procurement function, or a private health operator. Revenue flows through capital sales of the Versius
              system combined with an ongoing usage or service fee for instruments and support, though CMR has not
              disclosed contract terms or pricing publicly.

              The UK National Health Service dominates CMR's publicly documented customer base. NHS trusts are subject
              to mandatory public communications, which is why hospital-issued pages — East and North Hertfordshire NHS
              Trust (Lister Hospital), Manchester University NHS Foundation Trust (MFT), Liverpool University Hospitals
              NHS Foundation Trust (Aintree), and Gloucestershire Hospitals NHS Foundation Trust — are the
              highest-quality named customer evidence. Academic and teaching hospitals within the NHS are particularly
              prominent because they participated in early trials and training programmes, amplifying the reference
              value of each site.

              Internationally, private and academic hospitals in Europe, Asia, Middle East, Africa, and Latin America
              make up a growing but less publicly named segment. Klinikum Chemnitz (Germany) is the most prominently
              named international site, having announced the first German Versius installation in February 2021. CMR's
              2026 US entry adds a third segment: American hospitals and ASCs, targeted with the FDA-cleared Versius
              Plus for cholecystectomy. The US segment is in its earliest commercial stage; no public US customer
              deployments were confirmed as of the May 2026 run date.

              CMR does not disclose a total customer count or a segmented hospital list, making it impossible to verify
              revenue concentration, churn, or relative segment weighting from public sources alone.
            claimRefs:
