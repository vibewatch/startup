  - id: switching-costs-distribution-substitutes
    title: Switching Costs, Distribution Power, and Status-Quo Substitutes
    body: >
      Intuitive's competitive moat rests heavily on switching costs that are structural rather
      than merely contractual. Hospitals that have built credentialing programmes, trained
      surgeons in da Vinci technique, staffed dedicated robotic OR teams, and integrated
      Intuitive's service contracts and data analytics into quality-reporting workflows face
      transition periods of 12-24 months and significant retraining investment when considering
      any alternative. The installed base of over 11,000 systems creates a self-reinforcing
      surgeon preference: fellows and residents train predominantly on da Vinci, establishing
      preferences that follow them across their careers.


      Medtronic and Johnson & Johnson command enterprise-level distribution leverage that CMR
      and Distalmotion cannot match. Both companies have pre-existing contracting relationships
      with most large integrated delivery networks (IDNs), bundled supply agreements that span
      sutures to energy devices, and service organisations operating at global scale. This means
      a hospital CFO evaluating Hugo or Ottava will often conduct a single negotiation across
      dozens of product lines, giving Medtronic and J&J pricing and access advantages structurally
      unavailable to stand-alone robotics companies.


      Conventional laparoscopy is the most pervasive status-quo substitute. For any procedure
      that Versius, Hugo, or Dexter targets, a laparoscopic alternative exists and has decades of
      clinical evidence, established reimbursement, trained surgeons, and negligible capital cost.
      Only approximately 40% of surgeries in advanced healthcare systems like the US currently
      employ minimally invasive techniques, meaning the primary "competitor" for every robotic
      system is the open surgery or laparoscopy incumbent—not another robot. A hospital that
      postpones a robotic decision, waiting for Hugo or Ottava to mature, loses nothing immediately
      while retaining the option to choose a more validated platform later.


      A "wait and see" or "wait for Medtronic/J&J" strategy is a fully rational alternative for
      many hospital procurement committees through 2026 and 2027. CMR must demonstrate enough
      clinical differentiation, economic benefit, or strategic urgency to overcome this inertia
      before Intuitive's da Vinci 5 further consolidates its position and before Medtronic begins
      scaling US commercial operations.
