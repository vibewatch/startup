callouts:
  - calloutType: risk
    title: Intuitive's da Vinci 5 Raises the Competitive Bar
    body: >
      The da Vinci 5's 10,000× compute increase, AI-driven surgical insights, force-feedback
      instruments, and real-time analytics launched in 2025 materially widen the feature gap
      that every challenger—including CMR Versius Plus—must now close. CMR's 2026 US launch
      arrives into an incumbent that has simultaneously strengthened its data moat and upgraded
      its clinical performance ceiling.
    claimRefs:
      - CP005
      - CP006

  - calloutType: insight
    title: The Status-Quo Substitute Is Laparoscopy, Not Another Robot
    body: >
      With only approximately 40% of eligible procedures performed using minimally invasive
      techniques in advanced healthcare systems, the dominant alternative to any robotic
      platform—including CMR's—is continued laparoscopy, not a rival robot. Every competitor
      in the sector faces this shared inertia; the first-order sales challenge is converting
      open/laparoscopic procedures to robotic, not winning share from other robot vendors.
    claimRefs:
      - CP031
      - CP032

  - calloutType: risk
    title: Enterprise Distribution Moat Favours Medtronic and J&J
    body: >
      Medtronic and J&J hold pre-existing bundled contracts with most large IDNs, multi-product
      supply relationships, and global service organisations. CMR's inability to bundle Versius
      with a broader device portfolio means it enters every sales conversation on a stand-alone
      basis. This structural disadvantage will compound as Medtronic scales US Hugo deployment
      and J&J prepares Ottava.
    claimRefs:
      - CP036
      - CP040

