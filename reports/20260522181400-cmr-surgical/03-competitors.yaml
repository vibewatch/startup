company:
  name: CMR Surgical

chapter:
  number: 3
  title: Competitors
  summary: >
    The global soft-tissue robotic surgery market has shifted from Intuitive Surgical's
    near-monopoly to a contested multi-platform landscape as of 2026. Intuitive's da Vinci
    retains overwhelming structural advantages—11,106 installed systems, an $180 billion
    market capitalisation, and a credentialing ecosystem that locks hospitals in for years.
    Medtronic's Hugo received US FDA clearance in December 2025, making it the first large
    medtech company with an FDA-cleared soft-tissue rival in the US in two decades; J&J's
    Ottava remains pre-clearance with a de novo submission planned for Q1 2026. CMR Versius
    Plus (510(k)-cleared, December 2025) is the best-funded independent challenger ($1B+
    raised, $3B valuation) but with a nascent US footprint and approximately 160 installed
    systems globally. Distalmotion Dexter ($150M Series G, three US clearances) is aggressively
    targeting ambulatory surgery centres. Adjacent systems (Monarch bronchoscopy, MMI Symani
    microsurgery, Moon Maestro) address distinct niches. Conventional laparoscopy remains the
    dominant inertial substitute. CMR's primary structural adversary is Intuitive's lock-in
    moat, not any single challenger.

sections:
  - id: competitive-landscape-overview
    title: Competitive Landscape Overview
    body: >
      The soft-tissue surgical robotics sector entered 2025-2026 as the most competitive period
      in its history. Intuitive Surgical continues to dominate with the da Vinci platform, but
      a wave of well-capitalised challengers—Medtronic, Johnson & Johnson, CMR Surgical, and
      Distalmotion—have each achieved meaningful regulatory or commercial milestones. MassDevice
      characterised the landscape as "the game is truly on" after Medtronic entered the US
      market in late 2025, projecting global robotic surgery revenues to exceed $22.2 billion
      by 2029.


      Competitors span four categories relevant to CMR. First, direct soft-tissue challengers
      that target the same general, urologic, gynecologic, and colorectal indications: Medtronic
      Hugo, J&J Ottava, and Distalmotion Dexter. Second, the incumbent: Intuitive's da Vinci
      family (Xi, X, SP, and the new da Vinci 5). Third, adjacent niche systems that compete
      for hospital robotics capital budgets without overlapping indications directly: J&J Monarch
      (bronchoscopy), MMI Symani (microsurgery), Moon Surgical Maestro (collaborative laparoscopy
      assist), and Avatera (European soft-tissue). Fourth, the status-quo substitute—conventional
      laparoscopy—which represents the most pervasive alternative a hospital procurement team
      can choose instead of any robotic platform.


      Intuitive Surgical had approximately 11,106 da Vinci systems installed globally as of
      December 2025, up 12% year-over-year, with procedure growth of approximately 18% in 2025.
      Its market capitalisation of approximately $174 billion dwarfs every named competitor
      combined. Against this backdrop, CMR's competitive challenge is less about out-gunning
      Medtronic or J&J in technical specifications, and more about carving a defensible niche
      among cost-sensitive mid-tier hospitals and surgical centres before Intuitive's second-
      generation da Vinci 5 further widens the clinical performance gap.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP038
      - CP039
    tableRefs:
      - TP001
    figureRefs:
      - FP001

  - id: incumbent-and-challengers
    title: Incumbent, Direct Challengers, and Adjacent Systems
    body: >
      Intuitive Surgical's da Vinci platform benefits from 25 years of clinical evidence,
      proprietary instrument consumables, a training and credentialing infrastructure spanning
      surgical academies globally, and a real-time surgical data ecosystem. The da Vinci 5,
      which began receiving CE mark in July 2025, incorporates approximately 10,000× more
      on-board computing than prior generations, enabling AI-driven features including real-time
      surgical insights software launched in September 2025 and force-feedback instruments.
      Intuitive projects 13–15% procedure growth in 2026. This next-generation moat expansion
      compounds the switching-cost barriers CMR and every other challenger must overcome.


      Medtronic Hugo received US FDA clearance in December 2025 for urologic procedures
      (prostatectomy, nephrectomy, cystectomy), completing the Expand URO trial—described as
      the largest ever multi-port robotic-assisted urological surgery study in the US. Hugo
      carries CE mark since 2021 and has doubled international procedure volume year-over-year.
      The system integrates Touch Surgery Enterprise cloud analytics. However, BTIG analysts who
      evaluated Hugo wrote that they did not think it was "different enough from existing
      options" to drive fast US adoption, underscoring a key risk for all soft-tissue challengers:
      clinical and workflow differentiation from Intuitive is hard to demonstrate convincingly.


      Johnson & Johnson's Ottava remains the most consequential pre-commercial entrant. J&J
      plans to submit a de novo application in Q1 2026; commercial launch timeline is undefined.
      Ottava integrates four robotic arms into a standard surgical table with a "twin motion"
      architecture allowing table and arms to reposition without interrupting procedures. J&J's
      MedTech scale, Ethicon instrumentation franchise, and existing OR relationships make it
      a serious long-term threat if commercialisation is executed. Notably J&J laid off
      employees in its robotics division in 2023, introducing execution uncertainty.


      CMR Versius Plus received 510(k) clearance in December 2025 (building on De Novo clearance
      for the original Versius in October 2024) and is targeting 2026 for US commercial expansion.
      As of March 2026 at SAGES, CMR announced 45,000 patients treated globally, positioning
      Versius as "the second most widely used robotic surgical platform globally." CMR's
      installed base grew 50% in 2023 to approximately 160 systems, with annual procedure volume
      rising 60% to approximately 17,000 cases. CMR has raised over $1 billion in total, most
      recently a $200M+ round in 2025 backed by SoftBank, LightRock, and Ally-Bridge.


      Distalmotion Dexter received FDA De Novo clearance for inguinal hernia repair in October
      2024, followed by 510(k) clearances for cholecystectomy and hysterectomy/gynecology in
      2025. The Swiss company raised $150M in Series G financing in November 2025, targeting
      ambulatory surgery centres (ASCs) where it believes incumbent robotics footprint is weakest.
      Dexter is an open-system design compatible with third-party imaging, energy, and vessel
      sealer devices. The first US sale was completed at Memorial Hermann Health System in
      Houston in February 2025. As of that milestone, approximately 1,500 European cases had
      been completed.


      Adjacent niche systems include J&J's Monarch robotic bronchoscopy platform, which received
      FDA clearance for its Quest AI software (with 260% more compute via NVIDIA) in March 2025;
      MMI Symani, purpose-built for microsurgery and supermicrosurgery with FDA authorisation and
      CE mark; Moon Surgical's Maestro, a collaborative laparoscopic assist system; and Avatera,
      a German soft-tissue robot with CE mark but limited scale. Asensus Surgical (Senhance) was
      acquired by KARL STORZ in 2025, removing it as an independent competitor. None of these
      adjacent systems compete directly in CMR's target general/gynecologic/urologic soft-tissue
      indications, but they compete for the same capital budgeting cycles.
