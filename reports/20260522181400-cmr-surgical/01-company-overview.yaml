- id: founders-leadership-governance
  title: Founders, leadership, governance, and key-person risk
  body: >-
    Mark Slack is co-founder and Chief Medical Officer of CMR Surgical — his co-founder
    status is confirmed by the company's own FDA De Novo press release and by his
    consistent presence in leadership since inception. He is the only named co-founder
    in the retained source set; the complete founding team roster is not publicly
    disclosed and represents an open diligence gap. Slack's role bridging clinical
    and regulatory authority gives him outsized influence on product development decisions.

    CMR has undergone notable CEO churn in the recent period. Per Vegard Nerseth previously
    held the CEO role before Supratim Bose. Bose joined in February 2023 as senior
    adviser and was elevated to CEO in March 2023; he resigned for personal reasons
    in October 2024, transitioning to vice chairman of the board, and returned to
    Singapore. Massimiliano Colella, who had joined as Chief Commercial Officer in
    December 2023, was named interim CEO in October 2024 and was formally appointed
    CEO on January 15, 2025, concurrent with a seat on the board. This is the company's
    third CEO in roughly two years, and the rapid succession represents a meaningful
    key-person risk indicator for later diligence chapters. Colella brings 30+ years
    of healthcare leadership experience including group CEO of Evercare Group and
    senior roles at Johnson & Johnson and Smith & Nephew.

    The current executive leadership team includes: Andre Nel (CFO), Chris Fryer (CTO),
    Susan Firbank (Chief People Officer), Lionel Gousset (GM Operations), Chris O'Hara
    (Commercial President and GM US, hired early 2025), Michelle Paknad (Chief Marketing
    Officer and President of Commercial International), Markus Bauman (Chief Corporate
    Strategy Officer and Chief Legal Officer), and Luke Hares (Chief Innovation Officer).
    O'Hara's hire was a deliberate step to build U.S. commercial capability; he previously
    served as SVP Sales and Marketing at Virtual Incision and held senior roles at
    Intuitive Surgical and Globus Medical. Companies House records show eight active
    directors as of the period including Colella, Bose (now vice chair), John Cassidy
    (appointed October 2022), Daniel Moore (appointed July 2024 — who serves as Non-Executive
    Chairman per TechFundingNews), Catherine Moukheibir (appointed January 2021),
    Irackli Mtibelishvili (appointed October 2022), Sakip-Umur Hursever (appointed
    May 2018), and Steven Plachtyna.
