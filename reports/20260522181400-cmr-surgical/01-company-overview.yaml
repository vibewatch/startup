- id: capital-base-investors-debt
  title: Capital base, investor map, and debt profile
  body: >-
    CMR Surgical is the best-funded surgical robotics startup in the world by total
    equity raised, according to Dealroom data reported by Sifted. Its cumulative capital
    exceeds $1 billion since founding in 2014, with TechFundingNews placing total
    funding at $1.4 billion as of the 2025 round. The financing history has three
    major milestones: (1) a $600 million Series D in September 2021 led by SoftBank
    Vision Fund 2 and Ally Bridge Group that valued CMR at approximately $3 billion
    — the largest-ever raise by a European robotics startup at the time; (2) a $165
    million (£133 million) convertible loan note completed on September 20, 2023,
    drawn from all major existing investors with no valuation uplift; and (3) a round
    of more than $200 million in early 2025 combining equity from existing investors
    with a new debt investment from Trinity Capital, the US asset manager, whose debt
    component totalled approximately $68 million per Sifted.

    The 2025 round was explicitly framed as funding for U.S. commercialization and
    further product development. All of CMR's major existing investors participated:
    SoftBank Vision Fund 2, Ally Bridge Group, Cambridge Innovation Capital, Escala
    Capital, LGT, Lightrock, RPMI Railpen, Tencent, and Watrium. Trinity Capital represents
    the first external debt provider in the company's financing stack. The debt facility
    is reflected at Companies House: two earlier charges from Barclays Bank (created
    May 2019) and Grovemere Property (created February 2022) were both satisfied in
    March 2025, and a new charge (088636570009) was registered on 13 May 2025 — the
    timing is consistent with a Trinity Capital security interest following the financing
    close.

    CMR's current valuation is formally unconfirmed since 2023; the last disclosed
    figure was the $3 billion set at the 2021 Series D, which Sifted confirmed was
    unchanged at the 2023 raise. The addition of over $200M in 2025 capital — including
    meaningful debt — has not been accompanied by a new equity round that would produce
    an independent valuation mark. Revenue and run-rate figures are not publicly disclosed.
    Non-executive chairman Daniel Moore described the 2025 round as "a strong vote
    of confidence in the future of surgical robotics and in CMR as a leader within
    this space."
