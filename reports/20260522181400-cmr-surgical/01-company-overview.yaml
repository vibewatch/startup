- id: scale-milestones-adverse
  title: Scale, regulatory milestones, and adverse events
  body: >-
    CMR Surgical's procedure count has grown rapidly: from approximately 1,000 procedures
    in 2021, to 10,000 in early 2023, to 15,000+ in September 2023, to 26,000+ in
    October 2024, to 30,000+ at the time of the early 2025 funding, to 36,000+ by
    February 2025, to 40,000+ outside the U.S. by December 2025, and to 45,000+ worldwide
    as of March 26, 2026. The company now calls Versius the second most utilized soft-tissue
    surgical robotic system in the world, after Intuitive Surgical's da Vinci. More
    than 70% of adopting hospitals use the system across two or more specialties.

    The key regulatory milestones are: CE Mark approval in Europe (early 2019); De
    Novo application filed (November 21, 2023, DEN230078); FDA De Novo marketing authorization
    granted (October 2024, creating a new Class II device category 21 CFR 878.4964,
    product code SCV, making Versius the first multi-port soft-tissue RASD to achieve
    De Novo status); FDA 510(k) for Versius Plus filed (July 7, 2025, K252111); and
    FDA 510(k) clearance granted for Versius Plus (December 16, 2025). A second 510(k)
    for benign gynecologic indications was submitted on April 29, 2026 and is currently
    pending review. CMR is also conducting a first-of-kind pediatric surgery trial
    and a transoral robotic surgery (TORS) trial. The company announced its U.S. commercial
    launch at the SAGES 2026 Annual Meeting in Tampa on March 26, 2026, targeting
    hospitals and ambulatory surgery centers (ASCs) in partnership-first model.

    The primary adverse event on record is the 2023 workforce reduction. Cambridge
    Independent reported that as many as 350 employees were made redundant — approximately
    one-third of the workforce. CMR confirmed the rebalancing without disclosing headcount
    numbers. LinkedIn data cited by Sifted showed the headcount fall from approximately
    861 to 762 between June and September 2023. The company framed the action as restructuring
    toward regional commercial markets. The current headcount as of the 2026 run date
    is not publicly disclosed and remains an open diligence gap.
