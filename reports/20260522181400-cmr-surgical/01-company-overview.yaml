company:
  name: CMR Surgical
chapter:
  number: 1
  title: Company Overview
  summary: CMR Surgical is a Cambridge, UK-based private surgical robotics company
    incorporated in 2014, developer of the Versius and Versius Plus modular soft-tissue
    robotic surgery platforms. The company has raised more than $1 billion in cumulative
    capital — including a $600M Series D in 2021, a $165M round in 2023, and a $200M+
    equity-and-debt round in early 2025 — holds a $3 billion valuation last set in
    2021, and entered the U.S. market in 2026 following FDA De Novo authorization
    in October 2024 and 510(k) clearance for Versius Plus in December 2025. With over
    45,000 procedures completed globally and a recent CEO transition, CMR sits at
    a decisive commercial inflection point.
sections:
- id: identity-product-stage
  title: Identity, product, and stage
  body: >-
    CMR Surgical Limited (Companies House number 08863657) was incorporated on 27
    January 2014 in Cambridge, England under its original name Cambridge Medical Robotics
    Limited. The company was renamed CMR Surgical Limited on 26 February 2018. Its
    registered office is at 1 Evolution Business Park, Milton Road, Cambridge, CB24
    9NG — a postcode it shares with the FDA De Novo submission address, confirming
    operational continuity at that location. CMR's principal SIC codes at Companies
    House are 32500 (manufacture of medical and dental instruments and supplies) and
    72190 (other R&D on natural sciences and engineering), reflecting its dual identity
    as a commercial manufacturer and ongoing technology developer.

    The company's mission is to make minimal access surgery (MAS) universally accessible.
    Its core commercial product is the Versius Surgical Robotic System — a compact,
    modular, multi-port, cart-based robotically assisted surgical device designed
    for soft-tissue minimally invasive surgery. Versius biomimics the human arm with
    fully wristed instruments, offers 3D HD vision, flexible port placement, and an
    open surgeon console designed to reduce fatigue and facilitate communication with
    the OR team. Each robotic arm is an independent unit that can be repositioned
    around the patient and moved between operating rooms without requiring a dedicated
    OR, which the company positions as a key differentiator versus fixed-platform
    systems.

    The second-generation Versius Plus adds vLimeLite fluorescence visualization (real-time
    ICG imaging), enhanced energy instruments, and a digital ecosystem comprising
    two dedicated apps: Versius Connect (near-real-time surgeon procedure logbook)
    and Versius Team (live hospital dashboard for usage and case volume). Both the
    original Versius system and Versius Plus are indicated in the United States for
    adults 22 years and older eligible for soft-tissue minimal access surgery for
    cholecystectomy. As of late 2026, CMR is a late-stage private company transitioning
    from international growth into U.S. market entry — the world's largest surgical
    robotics market.
