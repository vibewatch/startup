  - id: buyer-segmentation
    title: Buyer, User, and Payer Segmentation
    body: >-
      Robotic surgery adoption involves a multi-stakeholder decision chain that
      distinguishes sharply between those who use the system, those who buy it,
      and those who pay for the procedure. Surgeons are the primary clinical
      champions: they evaluate ergonomics, training burden, dexterity, and
      procedure-specific outcomes. Without surgical champion(s), no capital
      committee will approve a new system. However, surgeons do not control the
      purchasing budget — that authority rests with hospital C-suites, capital
      committees, and CFOs who weigh utilisation projections, per-procedure
      economics, and total cost of ownership against alternative capital
      deployments.

      OR directors and service-line heads (e.g. general surgery, gynaecology,
      urology) serve as integration and workflow gatekeepers; they manage
      scheduling, staffing, and OR turnover, all of which are disrupted during a
      new system onboarding. Procurement departments evaluate vendor terms, service
      contracts, and consumable pricing. The Ipsos 2023 research found that
      executive-level purchasers, finance staff, and administrators are the
      effective decision-makers for robot purchases, and that economics and
      reimbursement barriers drive the current divide between robot haves and
      have-nots.

      Ambulatory surgery centers (ASCs) are an emerging buyer segment: they
      represent untapped potential as per Ipsos, but face even tighter capital
      constraints and operate under different reimbursement structures than
      hospital outpatient departments. CMS currently does not provide incremental
      reimbursement for robot-assisted versus conventional procedures, meaning the
      economic justification must rely on efficiency and throughput gains rather
      than a premium billing rate. Patients are downstream beneficiaries — they
      demand minimally invasive options and shorter recovery times — but are not
      direct payers for capital equipment and have limited leverage in the purchase
      decision.
