    title: Market Sizing Lens — Soft-Tissue RA-MIS Pyramid
    type: pyramid
    layout: standard
    summary: >-
      TAM/SAM/SOM pyramid for Versius, showing how the broad surgical-robots TAM
      narrows through soft-tissue focus and U.S. geography to an entry-segment
      SAM and an unquantifiable first-year SOM.
    data:
      items:
        - label: "Broad Surgical Robots TAM (Global, 2024)"
          value: "$8–12 B"
          sublabel: "All surgical robotics: soft-tissue + orthopaedic + endoluminal; $8.1 B (GMInsights) to $11.98 B (MarketsandMarkets); conflicting analyst estimates"
        - label: "Soft-Tissue RA-MIS Focus (~60% of TAM est.)"
          value: "~$5–7 B"
          sublabel: "Excludes orthopaedic; includes general surgery (28–32 %), gynaecology, urology, thoracics; no direct analyst figure — author estimate"
        - label: "U.S. Addressable (North America ~60–74% share)"
          value: "~$3–5 B"
          sublabel: "U.S. dominant geography; North America 60–65 % (MnM) to 73.89 % (Fortune); range driven by source/scope differences"
