callouts:
  - calloutType: risk
    title: Reimbursement Parity Caps the Economic Case for New Hospital Buyers
    body: >-
      CMS does not provide incremental reimbursement for robotic-assisted versus
      conventional laparoscopic procedures, and most commercial payers follow
      CMS's lead. This parity rule means U.S. hospitals cannot increase billing
      rates by adopting Versius — the economic case must rest entirely on
      efficiency gains, OR throughput, reduced LOS, and surgeon recruitment. For
      smaller hospitals and ASCs, this constraint is often decisive, and the Ipsos
      2023 research identified it as the primary structural barrier dividing
      current robot-owners from non-owners. CMR must therefore lead with total
      cost of ownership and throughput economics rather than a revenue-premium
      argument, which constrains the speed at which smaller segments can be
      converted.
    claimRefs:
      - CM020
      - CM025

  - calloutType: insight
    title: Analyst Market-Size Divergence Is an Analytical Feature, Not a Bug
    body: >-
      The $3.9 B gap between GMInsights' and MarketsandMarkets' 2024 global
      surgical-robots estimates reflects genuine methodological differences —
      scope (soft-tissue vs. including orthopaedics), revenue recognition
      (equipment vs. procedures), and geographic coverage assumptions — not
      data errors. Investors and operators who average these figures or cite only
      the most favourable estimate introduce false precision. The correct
      analytical posture is to treat each estimate as a different lens, use
      bottom-up procedure-volume logic (e.g., U.S. cholecystectomy volume × CMR's
      target instrument price) for SOM modelling, and track quarterly Intuitive
      Surgical filings as the most reliable real-time signal of market direction.
    claimRefs:
      - CM008
      - CM009
      - CM031

