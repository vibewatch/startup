    title: Adoption Funnel — Versius Hospital Procurement and Deployment
    type: funnel
    layout: standard
    summary: >-
      A new robotic surgery platform requires navigating six sequential gates
      from initial awareness to sustained utilisation; each gate has a distinct
      decision-maker and failure mode that CMR's commercial model must address.
    data:
      items:
        - label: "Awareness & Clinical Champion Identification"
          value: 100
          sublabel: "Surgeon hears about Versius via KOL network, conference, or CMR direct outreach; no purchase intent yet"
        - label: "Formal Hospital Evaluation (Clinical + Financial)"
          value: 50
          sublabel: "Capital committee evaluates clinical evidence, utilisation projections, and commercial terms; Ipsos notes economics and reimbursement barriers drive drop-off here"
        - label: "Contract and Installation Decision"
          value: 28
          sublabel: "CFO approves capital or per-procedure contract; service and training terms agreed; longer in hospitals with existing da Vinci lock-in"
        - label: "OR Team Training and Credentialling"
