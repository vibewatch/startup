  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing-limitation
      missingEvidence: >-
        A published, soft-tissue-only RA-MIS SAM estimate that excludes orthopaedic
        robotics and segments the market by procedure category (cholecystectomy,
        hysterectomy, hernia, etc.) with U.S.-specific volume and per-procedure value.
      whyItMatters: >-
        Without a SAM figure, CMR investors cannot determine the total addressable
        revenue opportunity for Versius in its cleared indication or compare it to
        capital deployment; generic TAM figures overstate the opportunity.
      diligencePath: >-
        Commission a custom market model using U.S. procedure volume data (CMS/HCUP),
        average robot-assisted procedure rates from Intuitive annual filings, and a
        bottom-up per-procedure instrument ASP estimate.
      relatedQuestionRefs: [QM009, QM010]

    - type: missing-source
      severity: material
      topic: evidence-gaps
      missingEvidence: >-
        Independent peer-reviewed comparative study of Versius vs. da Vinci vs.
        laparoscopy clinical outcomes (complication rate, conversion to open, LOS,
        readmission) in CMR's cleared indication set (cholecystectomy).
      whyItMatters: >-
        NICE HTG742's conditional (rather than full) approval and the Ipsos finding
        that hospital purchasers cite lack of outcomes data as a barrier both signal
        that the absence of Versius-specific RCT evidence is a material commercial
        risk; payers and procurement committees will demand it for second-order
        adoption.
      diligencePath: >-
        Track CMR's evidence-generation plan under NICE HTG742; request from CMR
        any unpublished registry data on Versius outcomes by procedure type and
        site; search ClinicalTrials.gov for ongoing Versius RCTs.
      relatedQuestionRefs: [QM027]

    - type: conflicting-data
      severity: material
      topic: market-size
      missingEvidence: >-
        Reconciliation of the $3.9 B divergence between GMInsights ($8.1 B) and
        MarketsandMarkets ($11.98 B) for the 2024 global surgical robots market;
        specifically, whether the difference is driven by scope (inclusion of
        orthopaedics), revenue type (equipment vs. procedures), or geographic
        coverage.
      whyItMatters: >-
        The divergence makes it impossible to construct a precise TAM-to-SAM bridge
        without knowing which base figure is appropriate; using the wrong anchor
        could double or halve the implied addressable market for CMR.
      diligencePath: >-
        Request full methodology documentation from both analysts or cross-check
        against Intuitive Surgical's publicly disclosed procedure and system install
        data, which provides an independent anchor for the soft-tissue component.
      relatedQuestionRefs: [QM005, QM009]

    - type: missing-source
      severity: minor
      topic: buyer-segmentation
      missingEvidence: >-
        ASC-specific reimbursement data for robotic cholecystectomy under CMS
        outpatient prospective payment system (OPPS) and ambulatory payment
        classifications (APCs) compared to conventional laparoscopic cholecystectomy.
      whyItMatters: >-
        If ASCs are to be a meaningful second-wave buyer segment for CMR, the
        economic model must demonstrate viable procedure economics under ASC
        reimbursement rates, which differ from inpatient DRGs.
      diligencePath: >-
        Review CMS OPPS final rules for cholecystectomy APC assignments; consult
        ASC reimbursement specialists or request ASCA analysis of robotic procedure
        economics in ASC settings.
      relatedQuestionRefs: [QM012, QM016]

    - type: missing-source
      severity: minor
      topic: market-boundary
      missingEvidence: >-
        Published per-procedure cost comparison between conventional laparoscopic
        cholecystectomy and Versius-assisted cholecystectomy across comparable U.S.
        hospital settings, including instrument cost, OR time, and LOS data.
      whyItMatters: >-
        Without a head-to-head cost comparison for CMR's primary U.S. indication,
        the economic argument versus laparoscopy (the status-quo substitute) remains
        unsubstantiated, limiting the commercial case for hospital CFOs.
      diligencePath: >-
        Request Versius per-procedure instrument pricing and average OR time from CMR;
        obtain laparoscopic cholecystectomy reference costs from CMS claims data or
        HCUP database; commission independent economic modelling.
      relatedQuestionRefs: [QM002]

