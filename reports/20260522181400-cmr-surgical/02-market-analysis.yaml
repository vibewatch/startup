  - id: TM004
    title: Growth Drivers and Adoption Constraints
    columns:
      - Factor
      - Direction
      - Timing
      - Implication for CMR
      - Diligence Ask
    rows:
      - - MIS adoption expansion (volume shift from open surgery)
        - Driver
        - Ongoing; multi-year secular trend
        - Expands the pool of procedures suitable for RA-MIS; grows total market
        - What share of CMR target procedures currently use laparoscopy vs. open?
      - - Surgeon ergonomics demand
        - Driver
        - Immediate; career-longevity concern for mid-career surgeons
        - Differentiates Versius ergonomic console vs. laparoscopy fatigue
        - Independent ergonomics data comparing Versius vs. da Vinci console
      - - Hospital capacity and throughput pressure
        - Driver
        - Near-term; COVID-driven awareness, post-pandemic restructuring
        - Shorter-stay RA-MIS procedures free capacity; supports budget case
        - Hospital-level LOS and OR utilisation data pre/post Versius adoption
      - - ASC migration of outpatient procedures
        - Driver
        - Near-term; CMS outpatient migration policies accelerating
        - Opens ASC buyer segment; per-procedure model fits ASC economics
        - What ASC-specific reimbursement is available for cholecystectomy robotics?
      - - Competition increasing choice (multi-vendor market)
        - Driver
        - Medium-term; Medtronic Hugo, J&J Ottava entering
        - Breaks Intuitive monopoly narrative; creates opening for differentiation
        - Timeline and indication scope for Hugo/Ottava U.S. launches
      - - Digital training and data ecosystem (Versius Connect / Team)
        - Driver
        - Medium-term; differentiator as market matures
        - Data-driven usage analytics support hospital business case
        - Evidence of Versius Connect adoption rates and NPS among users
      - - Capital intensity of robotic systems
        - Constraint
        - Immediate; primary barrier for smaller hospitals and ASCs
        - Limits addressable buyer base; forces per-procedure pricing innovation
        - What is CMR's per-procedure and leasing pricing for U.S. launch?
      - - CMS reimbursement parity (no premium for robot vs. laparoscopy)
        - Constraint
        - Ongoing; policy risk if parity rules tighten further
        - Removes direct revenue incentive; forces efficiency-based ROI argument
        - Are any commercial payers in CMR target markets offering robotic premiums?
      - - Training and credentialling burden
        - Constraint
        - Immediate; affects first-year adoption rate and market share ramp
        - Each hospital requires OR team credentialling; delays time-to-revenue
        - What is the median time to first independent Versius case post-installation?
      - - Incumbent switching cost (da Vinci ecosystem lock-in)
        - Constraint
        - Ongoing; deep structural barrier in robotic-experienced hospitals
        - Drives CMR to target robot-naive hospitals and ASCs
        - What share of CMR U.S. target accounts currently have da Vinci installed?
      - - Clinical evidence gaps (RAS superiority not established for all indications)
        - Constraint
        - Medium-term; evidence generation takes 3–5 years
        - NICE conditional approval, payer scepticism, peer-review requirements
        - NICE HTG742 evidence-generation plan progress and interim data
      - - Narrow initial U.S. indication (cholecystectomy only)
        - Constraint
        - Immediate; limits market access at launch
        - Restricts SAM until 510(k) expansion approvals are secured
        - Timeline for next U.S. indication submission and expected clearance
    notes: >-
      Drivers and constraints compiled from Ipsos 2023, NICE HTG742, PMC economic review, USC Schaeffer
      Center white paper, and FACS 2026 bulletin. Timing classifications (immediate/near-term/medium-term)
      are author judgements relative to the 2026 runDate. "Diligence Ask" fields represent open
      questions requiring primary research or company-disclosed data.
    claimRefs:
      - CM022
      - CM023
      - CM024
      - CM025
      - CM026
      - CM027
      - CM028
      - CM029
      - CM030

figures:
