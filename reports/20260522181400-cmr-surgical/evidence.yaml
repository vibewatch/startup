    severity: blocking
    topic: revenue
    missingEvidence: CMR Surgical's annual revenue, revenue run-rate, gross margin, and cash burn are not publicly disclosed.
    whyItMatters: >-
      Revenue metrics are required for any financial underwriting, valuation analysis, or go-to-market traction
      assessment. Their absence prevents downstream chapters from grounding market penetration or unit economics.
    diligencePath: >-
      Request investor data room; review audited accounts filed at Companies House (last filed for period ending
      December 2024, due by September 2026); ask management for ARR, hardware placement revenue, and service/consumables
      mix.
