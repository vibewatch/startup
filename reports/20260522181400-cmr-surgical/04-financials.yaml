  title: Financials
  summary: >-
    CMR Surgical operates a capital-equipment-plus-recurring-revenue model inferred from
    product evidence and industry analogue — never formally disclosed. The company has raised
    more than $1 billion cumulatively across its 2021 Series D, 2023 convertible loan note,
    and the April 2025 $200M+ equity-and-debt round (including Trinity Capital's $68.75M
    growth-capital commitment). Companies House records confirm the 2025 refinancing satisfied
    two older charges while registering at least four new security interests. Procedure volumes
    — 45,000+ patients by March 2026 — confirm accelerating commercial adoption, but no
    revenue, ARR, gross margin, or burn-rate data has ever been publicly disclosed. The
    financial verdict centres on profound opacity, uninterrupted capital dependence across
    every operational phase, and hardware cost intensity that requires sustained high-volume
    utilisation before unit economics become favourable.
sections:
  - id: revenue-model-pricing
    title: Revenue Model and Pricing Mechanism
    body: >-
      CMR Surgical operates a capital-hardware-plus-recurring-revenue model characteristic
      of the surgical-robotics industry. Hospitals and ambulatory surgery centres (ASCs)
      acquire the Versius or Versius Plus system, generating an initial capital-equipment
      transaction; they then consume single-use instruments and consumables with each
      procedure, producing an ongoing recurring-revenue stream. Service and maintenance
      contracts represent a third revenue layer, and the newly launched digital ecosystem —
      Versius Connect (surgeon procedural logbook) and Versius Team (hospital analytics
      dashboard) — introduces a potential fourth layer tied to software and data. This
      four-stream architecture mirrors the Intuitive Surgical da Vinci model, which CMR
      explicitly positions itself as a more accessible alternative to; it is inferred from
      CMR's product documentation and industry analogues rather than from any official
      revenue-mix disclosure by CMR itself. The company has never published a segment
      breakdown or revenue-recognition policy.


      The only public pricing signal for the Versius system is Sifted's 2023 report that
      "its flagship product Versius, launched in 2019, costs hospitals between £1m–1.5m."
      This is a list-price reference for the original Versius, not Versius Plus, and does
      not represent realised transaction prices, which may vary by geography, healthcare
      system, volume commitment, or contract structure (sale, lease, or pay-per-procedure).
      No pricing page for Versius or Versius Plus appears on CMR's US website as of the
      runDate; instrument and consumable per-procedure pricing is entirely undisclosed;
      service contract terms and duration are not public; and no realised ASP data has
      been disclosed. Revenue-recognition treatment for multi-year bundled arrangements is
      unverifiable.


      The digital ecosystem (Versius Connect, Versius Team) was launched with Versius Plus
      and may carry a subscription or per-seat fee, but no pricing or commercialisation
      details have been released. CMR's CEO acknowledged a mission of "delivering sustainable
      growth and life-changing solutions to the global healthcare community" without
      quantifying revenue or financial targets. The CFO, André Nel, was credited publicly
      with structuring the 2025 financing but has not disclosed revenue figures.
