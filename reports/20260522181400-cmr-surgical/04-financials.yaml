  - id: cost-structure-unit-economics
    title: Cost Structure and Unit Economics
    body: >-
      CMR Surgical's cost structure is driven by five components characteristic of a
      hardware-intensive medical device company at commercial scale. First, hardware
      manufacturing: Versius Plus involves precision electromechanical subsystems, robotic
      arms, vision optics, surgeon console hardware, and single-use instruments. The
      company has invested in a dedicated manufacturing facility near Ely, Cambridgeshire,
      a material capital commitment at this stage. Second, research and development and
      software: CMR maintains dual SIC codes at Companies House (32500 — manufacture of
      medical and dental instruments; 72190 — other R&D on natural sciences and
      engineering), signalling an active combined manufacturing and R&D cost base.
      Ongoing clinical trials (paediatric surgery, transoral robotic surgery) and pending
      regulatory submissions for gynecological indications add further to this layer.
      Third, clinical training and field service: every system installation requires
      surgical-team onboarding, case proctoring by application specialists, and ongoing
      field support — geographically distributed and people-intensive costs that scale
      with the installed base. Fourth, regulatory and quality assurance: CMR has navigated
      multiple FDA pathways since 2023 (De Novo for Versius in October 2024; 510(k) for
      Versius Plus in December 2025; 510(k) for gynecology indications pending mid-2026),
      carrying cumulative regulatory and post-market surveillance costs. Fifth, global
      commercial infrastructure: 30+ country operations and the imminent US commercial
      launch require geographically distributed sales, marketing, and clinical teams.


      No gross margin, COGS, or operating cost data are publicly available. The 2023
      workforce reduction of up to approximately 350 roles — roughly one-third of total
      headcount per Cambridge Independent — indicates that CMR acknowledged a structural
      imbalance between its centralised cost base and regional revenue generation.
      Headcount fell from approximately 861 to 762 between June and September 2023
      (LinkedIn data reported by Sifted), with cuts concentrated in engineering,
      manufacturing, field service, and support functions, followed by a deliberate
      rebalancing toward customer-facing regional markets. A PMC systematic review of
      robotic-assisted surgery economics identifies equipment cost and length of stay as
      the primary cost drivers, with per-procedure incremental cost to hospitals ranging
      from approximately $1,000 to $5,000 above laparoscopic alternatives in academic
      studies — implying that high utilisation per installed unit is critical to economic
      viability for both CMR and its hospital customers.
