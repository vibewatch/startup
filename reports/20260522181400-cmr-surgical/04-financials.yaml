  - id: traction-opacity-verdict
    title: Public Traction, Financial Opacity, and Verdict
    body: >-
      CMR's publicly trackable commercial indicators are limited to procedure counts and
      implied installed-base proxies, but these confirm accelerating adoption. At the
      August 2023 raise, CMR reported 15,000+ procedures and 140+ installations (per
      FierceBiotech and Sifted). By the April 2025 close, the company reported 30,000+
      procedures across 30+ countries (per the official press release and multiple news
      sources). As of the March 2026 SAGES conference announcement, more than 45,000
      patients worldwide have been treated using the Versius platform. This trajectory
      implies approximately 15,000 incremental procedures every 12–18 months, consistent
      with an expanding installed base. More than 70% of hospitals that have adopted
      Versius employ it across two or more surgical specialties, suggesting meaningful
      utilisation depth beyond single-specialty pilots.


      However, none of these metrics directly discloses revenue or unit economics.
      Instrument and consumable prices per procedure, realised ASP for system placements,
      gross margin, EBITDA, net cash position, and monthly burn rate are all absent from
      the public record. Third-party databases including CompaniesHub and NorthData list
      no verified revenue figures for CMR Surgical. Any revenue estimates from database
      aggregators that have not been corroborated from primary sources should be treated
      as low-confidence. CMR is a private limited company not required to file public
      income statements under UK company law, and has not voluntarily disclosed operating
      metrics in any press release, investor presentation, or regulatory filing accessible
      to the public.


      AMA-published analysis of hospital robotic investment confirms that the capital
      intensity of surgical robotic systems creates implicit utilisation pressure on both
      hospitals and manufacturers — a dynamic that amplifies CMR's installed-base upside
      but also heightens the downside risk of slow ramp in capital-constrained markets.
      The pattern of continuous large financing rounds — 2021 ($600M), 2023 ($165M), 2025
      ($200M+) — without any disclosed profitability, combined with Trinity Capital's
      "growth capital" framing, is most consistent with a company that remains pre-
      revenue-positive in operating terms. The financial verdict centres on three
      constraints: profound opacity (no public P&L or operating metrics), continuing
      capital dependence (each commercial phase required a new round), and hardware cost
      intensity (manufacturing, field service, and regulatory compliance create a high
      minimum viable scale). Whether the 2025 financing provides sufficient runway to
      demonstrate US commercial profitability is unresolvable from public data.
