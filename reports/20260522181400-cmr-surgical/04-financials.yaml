  - id: capital-adequacy-financing
    title: Capital Adequacy and Financing Dependencies
    body: >-
      CMR's most recent financing closed 2 April 2025: a $200M+ round combining equity
      from existing investors (SoftBank Vision Fund 2, LightRock, Ally Bridge, and others)
      with up to $68.75M in growth capital from Trinity Capital Inc. (NASDAQ: TRIN). The
      equity portion is estimated at approximately $131M — the balance of the stated
      $200M+ above Trinity's disclosed $68.75M debt commitment. The stated use of proceeds
      is commercial expansion with a major focus on the US market launch, and continued
      product development including Versius Plus. Trinity Capital's press release describes
      the investment as "growth capital to enable CMR Surgical to continue to scale
      operations and accelerate commercial expansion" — language consistent with a company
      that has not yet reached operating-cash-flow self-sufficiency. Sifted (2025) reports
      that CMR has raised more than $1 billion since founding in 2014; TechFundingNews
      places the cumulative total at $1.4 billion, though this figure comes from a lower-
      reputation aggregator and should be treated as indicative. The $3 billion valuation
      set at the 2021 Series D has not been updated in subsequent rounds; the 2023 raise
      was a convertible loan note of £133M ($165M), conducted with existing investors
      only and at an undisclosed valuation. The 2025 round was similarly conducted at an
      undisclosed valuation.


      Companies House filing records confirm a material refinancing during Q1-Q2 2025. Two
      existing security interests were satisfied: the Barclays Bank PLC charge (0886 3657
      0003, created May 2019) was satisfied 4 March 2025, and the Grovemere Property
      Limited charge (0886 3657 0005, created February 2022) was satisfied 3 March 2025.
      Simultaneously, three new charges (0886 3657 0006, 0007, 0008) were registered
      24–28 March 2025, and a fourth new charge (0886 3657 0009) was registered 13 May
      2025, consistent with security arrangements for the Trinity Capital debt facility
      and related intercreditor documentation. Share capital allotments between September
      2024 and June 2025 increased the nominal share capital from GBP 634.86 to GBP
      683.46, reflecting multiple tranches during the fundraising process.


      Group accounts for the year ended 31 December 2024 were filed at Companies House on
      14 April 2025; accounts for 31 December 2023 were filed 20 May 2024. Next accounts
      for December 2025 are due by 30 September 2026. As a private limited company, CMR
      is not required to publish revenue or income statement data in its UK filings. No
      cash-on-hand, burn rate, or runway figure has been publicly disclosed.
