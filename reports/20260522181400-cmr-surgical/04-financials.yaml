callouts:
  - calloutType: risk
    title: Uninterrupted Financing Dependence With No Disclosed Profitability
    body: >-
      CMR has required a discrete large financing round at every commercial phase: ~$600M in
      2021 to launch Versius globally, ~$165M in 2023 to sustain the rollout through a capital-
      constrained environment (accompanied by a ~350-person layoff), and $200M+ in 2025 to
      fund the US market entry. No operating-cash-flow self-sufficiency has been disclosed or
      implied at any point. Trinity Capital's framing of its debt as "growth capital" reinforces
      the interpretation that the company remains pre-revenue-positive. Each successive round
      has been at a flat or undisclosed valuation, limiting the ability to judge whether
      commercial momentum is translating into equity value creation.
    claimRefs:
      - CI042
      - CI043
      - CI020
      - CI021

  - calloutType: insight
    title: Procedure-Volume Trajectory as Best Available Commercial Proxy
    body: >-
      In the absence of any revenue disclosure, the procedure-count trajectory — 15,000+ at
      August 2023, 30,000+ at April 2025, 45,000+ at March 2026 — is the strongest
      publicly available proxy for commercial momentum. Roughly doubling approximately every
      12–18 months and with more than 70% of adopters deploying Versius across two or more
      specialties, the installed base appears to be generating real recurring instrument and
      service revenue. However, without per-procedure instrument pricing, system ASP, or
      service-contract value, the revenue implied by this procedure volume cannot be
      quantified with useful precision.
    claimRefs:
      - CI033
      - CI034
      - CI035
      - CI036

  - calloutType: assumption
    title: Revenue Model Structure Inferred From Industry Analogue, Not Primary Disclosure
    body: >-
      The four-stream revenue model presented in this chapter (capital equipment, instruments/
      consumables, service/maintenance, digital ecosystem) is inferred from CMR's product
      documentation and the established Intuitive Surgical da Vinci model, which CMR positions
      itself as a successor to in the accessible-robotics segment. CMR has not published a
      revenue-recognition policy, segment disclosure, or pricing schedule for any product.
      Any financial modelling using this structure should clearly flag the inferred nature of
      the revenue architecture and treat all stream-level estimates as working hypotheses
      pending primary disclosure.
    claimRefs:
      - CI001
      - CI007

