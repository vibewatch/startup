  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-opacity
      missingEvidence: >-
        Any revenue, ARR, gross margin, EBITDA, or operating-loss figure for CMR Surgical
        covering any period of its commercial history.
      whyItMatters: >-
        Without any revenue or margin data, underwriting, valuation, and capital-adequacy
        judgments cannot be grounded in fundamental financial analysis. The chapter relies
        entirely on capital raised and procedure counts as proxies.
      diligencePath: >-
        Request management accounts or audited consolidated income statement under NDA.
        Review the filed December 2024 group accounts at Companies House (filed April 2025)
        for any income-statement summary. For a fair-market or investment analysis, require
        a CFO-attested revenue and margin package before proceeding.
      relatedQuestionRefs:
        - QI015
        - QI021
        - QI022

    - type: missing-source
      severity: material
      topic: pricing
      missingEvidence: >-
        Instrument and consumable per-procedure pricing and service-contract pricing for
        Versius and Versius Plus.
      whyItMatters: >-
        Without per-procedure consumable pricing, the recurring-revenue model cannot be
        sized, and lifetime value per installed unit cannot be estimated with confidence.
      diligencePath: >-
        Obtain instrument pricing list from a hospital procurement officer or via CMR sales
        collateral; request service-contract terms under NDA; benchmark against Intuitive
        Surgical da Vinci instrument pricing ($700–$3,500 per procedure kit, public data).
      relatedQuestionRefs:
        - QI006

    - type: private-evidence-only
      severity: material
      topic: burn-rate
      missingEvidence: >-
        Monthly or annual operating cash consumption (burn rate) and implied cash runway
        from the April 2025 financing.
      whyItMatters: >-
        Without a burn-rate estimate, the adequacy of the $200M+ April 2025 round cannot
        be assessed; it is unknown whether this financing is sufficient to reach commercial
        break-even or merely extends the pre-profitability runway by 12–24 months.
      diligencePath: >-
        Estimate from headcount (762 as of late 2023 × average loaded cost ~£80–100k) plus
        capex and regulatory spend; triangulate against fundraising cadence; request
        quarterly cash-flow statement under NDA.
      relatedQuestionRefs:
        - QI022

    - type: missing-source
      severity: material
      topic: charges
      missingEvidence: >-
        Detailed terms, covenants, interest rate, and maturity date for the Trinity Capital
        debt facility and the four new Companies House charges registered in 2025.
      whyItMatters: >-
        Restrictive covenants or high interest costs on the $68.75M Trinity Capital debt
        could materially affect CMR's financial flexibility and the effective cost of capital.
      diligencePath: >-
