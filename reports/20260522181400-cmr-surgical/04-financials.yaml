      Four revenue streams flow from each hospital or ASC customer: capital equipment,
      instruments/consumables, service/maintenance, and digital ecosystem. Gross revenue
      and margin are undisclosed; stream mix is inferred from product evidence and
      industry analogues.
    data:
      nodes:
        - id: hospital
          label: Hospital / ASC Customer
          detail: >-
            Acquires Versius Plus; commits to capital transaction and ongoing consumable
            and service spend. 45,000+ patients treated as of March 2026 across 30+ countries.
          tone: neutral
        - id: system-sale
          label: Capital Equipment Revenue
          detail: >-
            One-time or amortised system sale/lease. List price £1m–1.5m for original Versius
            (Sifted 2023); Versius Plus pricing undisclosed.
          tone: neutral
        - id: instruments
          label: Instruments & Consumables
          detail: >-
            Single-use instruments per procedure. Per-procedure pricing entirely undisclosed;
            likely high-margin recurring stream based on industry analogues.
          tone: positive
        - id: service
          label: Service & Maintenance
          detail: >-
            Ongoing field service, preventive maintenance, and application specialist support.
            Contract terms and pricing not public.
