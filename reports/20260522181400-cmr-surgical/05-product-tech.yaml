  - id: regulatory-clinical-evidence
    title: Regulatory Path and Clinical Evidence
    body: |
      CMR Surgical's US regulatory journey spans two authorization milestones and an
      active submission. The FDA granted De Novo marketing authorization (DEN230078) in
      October 2024 for the original Versius Surgical System — the first multi-port,
      soft tissue general surgical RASD to be authorized through the De Novo pathway,
      creating a new product classification (21 CFR 878.4964). The De Novo labeling
      explicitly states that long-term safety and effectiveness for use with or treatment
      of cancer has not been established — a material constraint for oncologic specialties.
      Versius Plus subsequently received FDA 510(k) clearance (K252111) on December 16,
      2025 for cholecystectomy, adding near-infrared vLimeLite imaging and updated
      software. Notably, the 510(k) was supported entirely by bench testing, preclinical
      porcine model studies, and human factors validation, with no human clinical trials
      submitted. As of the run date, a 510(k) premarket notification for benign gynecology
      procedures (total hysterectomy, oophorectomy, salpingectomy) was submitted on
      April 29, 2026 and is pending FDA review.

      Outside the US, clinical evidence across specialties is positive but early-stage.
      A preclinical cadaver and porcine study evaluated Versius for general and colorectal
      surgery, completing 35 of 38 procedures across 9 procedure types with no
      device-related intraoperative complications. A phase 2a IDEAL-D prospective study
      of 30 consecutive thoracic patients (April–December 2023) achieved 93.3% conversion-
      free completion; two conversions to thoracoscopy occurred, one attributable to a
      console alarm. An independent prospective urologic study (45 patients, May 2023–
      May 2024) found Versius feasible for radical prostatectomy, cystectomy, nephrectomy,
      and partial nephrectomy, with 8.9% conversion to laparoscopy and 28.9% postoperative
      complication rate (predominantly low-grade Clavien-Dindo). A King's College London
      team evaluated Versius for transoral robotic surgery (TORS) in 30 procedures
      (15 benign, 15 cancers) — all completed without major complications — but surgeons
      identified instrument bulk and the absence of a monopolar spatula as limiting factors.
      Milton Keynes University Hospital published a technical note describing optimized arm
      and port configuration for 150 colorectal resections. As of March 2026, Versius
      has been used in 45,000+ procedures globally across 30+ countries.
