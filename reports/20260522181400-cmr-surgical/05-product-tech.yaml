  - id: TE002
    title: Workflow / Use-Case Table
    columns:
      - User Job
      - Current Workflow
      - Versius Solution
      - Measurable Benefit (Evidence Level)
      - Limitation
    rows:
      - - Cholecystectomy (gallbladder removal)
        - Laparoscopic or open; dedicated OR for robotics
        - Versius Plus modular MAS robotic assistance; no dedicated OR needed
        - 510(k) cleared Dec 2025; FDA-authorized for US use (regulatory evidence)
        - Only cleared US indication; narrow near-term addressable volume
      - - Colorectal resection (right hemicolectomy, anterior resection)
        - Laparoscopic; arm-repositioning challenges; complex port setup
        - Bedside unit triad optimization; laparoscopic-compatible port placement
        - 150 resections at MKUH; technical note validates triad configuration (real-world)
        - Not US-cleared; learning curve for bedside unit and port positioning
      - - Thoracic surgery (lobectomy, thymectomy)
        - Open thoracotomy or VATS; no dedicated robotic option for most centres
        - Versius robotic-assisted thoracic; phase 2a IDEAL-D feasibility confirmed
        - "93.3% conversion-free; thymectomy 0 complications; median LOS 1 day (Phase 2a)"
        - Not US-cleared; 1 console alarm conversion; phase 2b/3 evidence pending
      - - Gynecology – benign (hysterectomy, oophorectomy)
        - Laparoscopic or open; limited robotic access in low-volume centres
        - 5mm-port compatible Versius Plus; 510(k) submission April 2026
        - Extensive global gynecology experience; 510(k) pending FDA review
        - Not yet US-cleared; regulatory timeline unconfirmed
      - - Urology – malignancies (RARP, RARC, RAPN)
        - Open or laparoscopic; robotic alternatives typically large systems
        - Multi-arm Versius for urologic oncology; portable to any OR
        - 45 patients feasibility study; RARP n=26; 8.9% lap conversion (observational)
        - Not US-cleared; 28.9% post-op complication rate; pending larger prospective data
      - - Transoral robotic surgery (TORS – throat/head-neck)
        - Open pharyngotomy; limited robotic options for oropharynx
        - 4-arm Versius (3 instruments + camera); IDEAL phase 2a evaluation at KCL
        - 30 procedures completed (15 benign, 15 cancers); all without open conversion
        - Not US-cleared; instrument bulk and absent monopolar spatula limit adoption
    notes: >
      Evidence levels are labelled per study design: 510(k)/De Novo = regulatory standard
      with bench/preclinical basis; Phase 2a = small prospective feasibility cohort;
      real-world = single-centre case series or technical note. US clearance status is
      current as of 2026-05-22. Benefits stated where backed by cited evidence only.
