callouts:
  - calloutType: strength
    title: Modularity and Portability as Structural Moat
    body: >
      Versius Plus's independently wheeled bedside units — each with its own cart and brake
      mechanism — eliminate the need for dedicated OR infrastructure and allow hospitals to
      deploy a single robot across multiple procedure rooms and care settings. This design is
      company-claimed and FDA-confirmed in the De Novo decision document, which explicitly
      notes the system "can be easily moved between departments." With 45,000+ procedures
      completed globally across 30+ countries, CMR has real-world validation of the portability
      model at scale, giving it a credible proof point that fixed-cart robotic competitors
      cannot replicate without a platform redesign.
    claimRefs:
      - CE003
      - CE007
      - CE028
      - CE029

  - calloutType: risk
    title: Narrow US Indication Constrains Near-Term Revenue
    body: >
      As of the run date, Versius Plus is US-authorized only for cholecystectomy — a
      procedure segment dominated by well-established laparoscopic techniques and low-acuity
      complexity. Gynecology 510(k) is pending, and urology, thoracic, and colorectal
      specialties require future submissions. The US 510(k) for cholecystectomy relied entirely
      on bench and preclinical data with no human clinical trial evidence. The FDA De Novo
      labeling explicitly states that long-term safety and effectiveness for cancer treatment
      has not been established. These regulatory constraints limit the breadth of clinical
      messaging available to CMR's US commercial team and slow procedure-volume ramp-up
      against competitors with broader indication portfolios.
    claimRefs:
      - CE001
      - CE035
      - CE036
      - CE040

  - calloutType: insight
    title: Digital Ecosystem Differentiates but Monetization Remains Opaque
    body: >
      CMR's Versius Connect and Versius Team apps represent a genuine strategic differentiator:
      they tie the robot to a continuous software-driven data relationship with surgeons and
      hospitals, creating potential for recurring revenue and switching costs beyond the
      hardware sale. The Versius Cloud telemetry infrastructure also supports post-market
      surveillance obligations. However, no public disclosure of pricing, bundling terms, or
      contract structures for the digital apps has been found. It is unknown whether these
      tools are included in system purchase/lease agreements, charged separately, or form
      the basis of a SaaS monetization layer — a critical input to the company's long-term
      margin profile that requires direct diligence with CMR.
    claimRefs:
      - CE014
      - CE015
      - CE038

