    rows:
      - - Surgeon Console
        - Central power and data hub; surgeon interface for arm control; HUD display
        - AC mains power; local network for telemetry upload to Versius Cloud
        - Single point of failure for system power and communications
      - - Instrument Bedside Units (×1–3)
        - Independently mobile arm cart; robot arm J1–J11; wristed end effector (J9–J11)
        - Bedside unit cable to surgeon console (power + data); OR positioning team
        - Cable-tethered; arm configuration expertise required per procedure
      - - Visualization Bedside Unit
        - 3D endoscopic camera; vLimeLite NIR/ICG imaging; output to HUD and EIZO display
        - Surgeon console; EIZO CuratOR external display; hospital ICG drug supply
        - ICG drug not supplied by CMR; EIZO hardware third-party dependency
      - - V-Wrist End Effector (J9–J11)
        - Translates hand-controller inputs into wristed instrument motion
        - Safety-critical microcontroller embedded software; kinematic calibration
        - Precision limits in confined anatomical spaces (e.g., tongue base in TORS)
      - - Safety-Critical Embedded Software
        - Controls full microcontroller network (motor control, kinematics, networking, UI)
        - C-language codebase; Python test suite; IEC 62304-aligned lifecycle process
        - Software defect in safety-critical path requires regulatory re-submission; console alarm event documented in thoracic study
      - - Versius Cloud
        - Receives telemetry data post-procedure; supports diagnostics and PMS
        - Local network at hospital site; cloud infrastructure (provider undisclosed)
        - Network dependency; data sovereignty and privacy obligations across 30+ countries
      - - vLimeLite (NIR Imaging Module)
        - Fluorescence visualization for biliary anatomy using ICG dye contrast
        - ICG drug (separately sourced); NIR-capable camera in visualization bedside unit
        - ICG regulatory approval variability by country; approval status in US confirmed in 510(k)
    notes: >
      Architecture derived from FDA De Novo decision document (DEN230078), Innolitics 510(k)
