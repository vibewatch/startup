  productSummary: >
    Versius Plus is a second-generation modular soft-tissue robotic surgery system comprising an
    ergonomic open surgeon console, a visualization bedside unit, and up to three independently
    movable instrument bedside units with fully wristed instruments and 3D HD vision.
    The system features vLimeLite fluorescence (ICG) imaging, flexible port placement, and a
    digital ecosystem (Versius Connect, Versius Team). Indicated in the US for cholecystectomy
    in adults ≥22 years; multi-specialty clearances are pending or in progress.
  customerFocus: >
    Hospitals, health systems, and ambulatory surgery centres seeking affordable and flexible robotic
    surgery capabilities. Surgeons are the primary users; hospital procurement teams and private health
    operators are the buyers. The UK NHS is the most publicly documented customer base; US hospital
    and ASC customers are targeted following 2025–2026 FDA clearances.
  businessModel: >
    Capital-equipment-plus-recurring-revenue model: initial system sale or placement generates hardware
    revenue; ongoing single-use instruments and consumables provide a per-procedure recurring revenue
    stream; service and maintenance contracts add a third layer; and the digital ecosystem (Versius
    Connect, Versius Team) introduces a potential software/data subscription layer. Pricing and
    revenue-recognition policies are entirely undisclosed.
  stage: "Growth (Series D+)"
  fundingStatus: >
