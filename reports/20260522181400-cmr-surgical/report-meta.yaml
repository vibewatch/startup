    providing up to $68.75M in growth capital debt. Prior: $165M convertible loan note (September 2023)
    and $600M Series D (September 2021, ~$3B valuation). Total capital estimated at ~$1.4B. All post-2021
    rounds conducted at undisclosed valuations.
