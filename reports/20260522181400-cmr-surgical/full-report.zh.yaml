  - id: TV002
    title: 投资逻辑 vs. 反向逻辑
    columns:
      - 支柱
      - 投资逻辑
      - 反向逻辑
      - 什么会改变判断
    rows:
      - - 市场
        - 手术机器人市场 2024 年规模 $8–14B，2034 年前 CAGR 14–17%；全球 MIS 渗透率仍极低
        - 市场增长集中在 ISRG 已覆盖术式；CMR 可触达市场受美国初始适应症狭窄限制
        - 多个美国适应症获批，并证明能跨术式类型打入医院
      - - 产品
        - FDA 许可的非 ISRG 软组织机器人中唯一一款；模块化、便携式设计，几乎适配任何手术室；45k+ 例手术验证安全性
        - ISRG da Vinci 5 的临床证据、装机基础和数据生态都深得多；CMR 人体工学优势在美国场景尚未验证
        - 发表美国 RCT 数据，证明相较开放 / 腹腔镜基准不劣或更优
      - - 客户
        - 11 个月内手术量从 30k+ 增至 45k+；70%+ 采用 Versius 的医院覆盖两个及以上专科；全球采用量第二的软组织机器人
        - 装机量估计约 160 台，对比 ISRG 的 9,000+ 台；美国客户背书尚不存在；NHS 收入模式不能直接搬到美国按服务收费体系
        - 上线后前 12 个月拿下 50+ 家美国医院合同，并披露美国手术数据
      - - 财务
        - SoftBank、LightRock 和 Ally-Bridge 继续支持；Trinity Capital 提供机构级债务；$200M+ 现金跑道支撑美国启动
        - 收入 / EBITDA 完全未披露；Trinity 风险债务附带契约；此前 $1.4B 资本投入意味着累计亏损很大
        - 财务数据室显示毛利率 >40%、可信的盈亏平衡路径，以及美国爬坡期烧钱可控
      - - 估值
        - FT 报道目标售价 $4B；战略机器人溢价有先例（Stryker / MAKO）；全球部署的非 ISRG 平台仅此一家
        - 2021 年后没有新的股权估值；$3B 定在牛市峰值环境；优先股堆叠和债务包袱会在下行情景下稀释普通股
        - 老股交易或新股融资在 $3B 以上完成，确认或超过 2021 年估值
    notes: 投资逻辑 / 反向逻辑配对基于截至 2026 年 5 月的公开证据；美国商业 KPI 仍是最主要的未解变量。
