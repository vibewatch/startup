  - id: TP003
    title: 定价 / 商业包装对比
    columns:
      - 系统
      - 报道的资本设备成本（USD）
      - 器械 / 耗材模式
      - 服务 / 维护模式
      - 已知定价信号
      - CMR 启示
    rows:
      - - da Vinci Xi / 5（Intuitive 系统）
        - 每套约 $1.5M–$2.5M+（广泛引用的估算；未官方披露）
        - 自有一次性器械；买方称每台手术成本 $700–$3,500+
        - 捆绑多年服务合同；通常估计为 $100K–$200K/年
        - Intuitive 不公布标价；系统经济性为专有信息；高端定位
        - 高端标杆；CMR 必须证明以更低总拥有成本达到相近疗效
      - - Hugo RAS（Medtronic）
        - 未公开披露；定位为比 da Vinci“更可负担”
        - 自有器械；可重复使用部件降低部分单例成本
        - Medtronic 企业服务合同；与既有 Medtronic 合作关系捆绑
        - BTIG 将成本列为潜在优势；具体定价未知
        - Medtronic 的企业客户杠杆可能在捆绑交易中压低 ASP，给 CMR 带来定价压力
      - - Ottava（J&J）
        - 未披露（商业化前）
        - Unknown
        - Unknown
        - 无公开定价信号；J&J 历来走高端定位
        - 未知；若 J&J 上市时靠跨产品补贴压价，将构成重大风险
      - - Versius Plus（CMR）
        - 未官方披露；定位低于 da Vinci；分析师估计 $1M+
        - 按手术消耗器械耗材；具体定价未公开
        - 服务合同模式；公开细节不足
        - CMR 宣传“更可及的价格门槛”；具体数字未披露
        - CMR 自身定价信号；在为美国扩张投入资金的同时，必须守住相对 Intuitive 的成本优势
      - - Dexter（Distalmotion）
        - 未公开披露；面向 ASC 定位（成本敏感客群）
        - 一次性器械（开放系统允许第三方能量 / 影像设备）
        - 服务模式未披露；开放系统可能降低供应商锁定成本
        - 面向 ASC 的定价策略；ASC 定位意味着资本门槛更低
        - 直接争夺 CMR 目标中的成本敏感医院；定价是竞争变量
      - - 腹腔镜（现状）
        - 增量资本接近零（器械每台手术约 $500–$2,000）
        - 可重复使用或低成本一次性器械；外科医生熟悉
        - 很低；标准手术室设备维护
        - 完全可知；所有机器人经济性讨论的主导参照
