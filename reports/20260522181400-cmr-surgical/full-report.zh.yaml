  productSummary: >
    Versius Plus 是第二代模块化软组织手术机器人系统，由符合人体工学的开放式外科医生控制台、床旁可视化单元，以及最多三个可独立移动的器械床旁单元构成，配备全腕式器械和 3D HD 视觉。系统具备 vLimeLite
    荧光（ICG）成像、灵活端口布局和数字生态（Versius Connect、Versius Team）。在美国适用于 ≥22 岁成人胆囊切除术中的软组织微创手术；多专科许可仍在审评或推进中。
  customerFocus: >
    寻找经济、灵活机器人手术能力的医院、医疗系统和日间手术中心。外科医生是主要使用者；医院采购团队和私营医疗运营商是买方。英国 NHS 是公开资料中记录最充分的客户群；2025–2026 年 FDA 许可后，公司瞄准美国医院和 ASC
    客户。
  businessModel: >
