      - number: '7.4'
        title: 法律、知识产权与运营风险
        blocks:
          - type: paragraph
            body: >-
              法律和运营图景喜忧参半：没有公开召回或诉讼等明显红旗，但几项重要尽调问题仍未解决。本章通过 Google Patents 和 WIPO Patentscope 进行的公开专利检索返回了与 CMR Surgical
              无关的文件，因此无法从已捕捉的公开检索步骤中独立核验公司的防御性知识产权边界。这不能证明专利组合薄弱，但意味着自由实施和护城河主张仍需要管理层直接提供证据。法律暴露也存在于产品使用层面。FDA De Novo
              标签范围狭窄，并明确限制处方使用、受训医生监督、患者年龄和非肿瘤使用；如果医院滑向超标签或培训不足使用，就会产生器械责任和文档风险。Companies House
              押记记录又增加一层约束，因为有担保债务义务可能在美国首年发布最需要灵活性时，对资产形成合同性负担。运营上，公司似乎集中在 Cambridge,
              UK，且没有识别到公开的第二制造场地或业务连续性计划。这个问题重要，因为 2026 年美国扩张需要的不只是销售招聘，还包括现场服务、培训吞吐量、上市后监测和可靠器械支持。领导层更替也增加复杂性：CEO
              Supratim Bose 在 October 2024 的 FDA 批准窗口内离任，Massimiliano Colella 成为永久首席执行官，CMR
              还通过新任首席法务与商务事务官加强法律领导力。这些变化可管理，但合在一起说明，CMR 仍在搭建进入美国市场并长期站稳所需的法律、运营和合规机器。
