      - number: '2.5'
        title: 展项
        blocks:
          - type: callout
            title: 报销同价压住新医院买家的经济论证
            body: >-
              CMS 不为机器人辅助相较传统腹腔镜术式提供增量报销，多数商业支付方跟随 CMS。这个同价规则意味着美国医院采用 Versius 不能提高账单费率——经济论证必须完全建立在效率提升、OR
              吞吐、住院时长（LOS）降低和外科医生招募上。对较小医院和 ASCs，这一约束往往是决定性的；Ipsos 2023 年研究也将其识别为区分现有机器人拥有者和非拥有者的首要结构性障碍。因此，CMR
              必须用总拥有成本和吞吐经济性打头，而非收入溢价论证；这会限制较小细分市场转化速度。
            calloutType: risk
            claimRefs:
              - CM020
              - CM025
          - type: callout
            title: 分析师市场规模分歧是分析特征，不是错误
            body: >-
              GMInsights 与 MarketsandMarkets 的 2024 年全球手术机器人估计相差 $3.9 B，背后是真实方法差异——范围（软组织 vs. 纳入骨科）、收入确认（设备 vs.
              手术）和地理覆盖假设——不是数据错误。投资者和运营者若取平均值或只引用最有利估计，会制造虚假精度。正确分析姿态是把每个估计当作不同镜头，用自下而上的手术量逻辑（例如美国胆囊切除量 × CMR 目标器械价格）建模
              SOM，并跟踪 Intuitive Surgical 季度文件，将其作为最可靠的实时市场方向信号。
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
