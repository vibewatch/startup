  - id: FV003
    title: 按情景划分的估值与退出回报区间
    type: range
    layout: standard
    summary: 展示悲观、基准和乐观情景下从低到高的退出估值区间，并以战略可比交易和累计融资信号为锚。
    data:
      items:
        - label: 悲观情景（美国失手，困境退出 / 战略兴趣有限）
          low: 1500
          base: 1750
          high: 2000
        - label: 基准情景（美国稳步爬坡，单一战略买家）
          low: 3000
          base: 3250
          high: 3500
        - label: 乐观情景（美国超预期，竞争性 M&A 竞价）
          low: 4500
          base: 5000
          high: 5500
    approximationNotes: 所有数值单位均为百万美元。区间为情景估计，来自战略可比分析、累计融资底部和 FT 报道要价信号。未使用收入倍数方法——CMR 收入未披露。
    claimRefs:
      - CV001
      - CV005
      - CV008
      - CV042
      - CV043
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: wide
    summary: 面向 IC 的评分卡，从七个投资维度按 1–10 分评估 CMR Surgical，反映截至 May 2026 的公开证据。
    data:
      items:
        - label: 市场机会
          value: 9/10
          detail: 2024 年手术机器人市场 $8–14B，CAGR 14–17%；全球 MIS 渗透不足，是持久增长驱动。
          tone: positive
        - label: 临床与监管验证
          value: 7/10
          detail: 45k+ 例手术、FDA de novo 批准、CE 标志；全球采用量第二大的软组织机器人。美国 RCT 数据仍有限。
          tone: positive
        - label: 竞争护城河
          value: 6/10
          detail: 独特模块化架构，也是唯一获 FDA 批准的非 ISRG 软组织机器人；但 ISRG 的装机基础、数据和临床关系造成极高切换成本。
          tone: neutral
        - label: 财务透明度
          value: 1/10
          detail: 收入、毛利率、EBITDA 和烧钱速度完全未披露。FY2024 法定账目已于 April 2025 提交，但尚未审阅。
          tone: negative
        - label: 美国执行准备度
          value: 5/10
          detail: FDA 已批准（胆囊切除术）；Versius Plus 510(k) 于 Dec 2025 获批；正式美国上市在 SAGES March 2026 宣布。采用 KPI 缺失。
          tone: neutral
        - label: 估值纪律
          value: 3/10
          detail: $3B 标记来自 2021 牛市；2023 或 2025 未确认上调；$4B 要价偏愿景。战略稀缺性带来上行，但当前标记偏高。
          tone: negative
        - label: 证据质量
          value: 5/10
          detail: 手术量和监管牵引证据较好；财务基本面证据很弱；出售进程报道为二手信息。缺口对信心影响重大。
          tone: neutral
    approximationNotes: 分数是分析师基于公开证据权重和质量给出的定性评估；不是定量模型输出。
    claimRefs:
      - CV003
      - CV013
      - CV015
      - CV016
      - CV024
      - CV035
      - CV039
