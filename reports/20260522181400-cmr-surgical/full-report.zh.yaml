      - number: '5.5'
        title: 展品
        blocks:
          - type: callout
            title: 模块化与可移动性构成结构性护城河
            body: >
              Versius Plus 的独立带轮床旁单元——每个单元都有自己的推车和制动机构——不再需要专用手术室基础设施，也允许医院把一台机器人部署到多个手术间和护理场景。这个设计由公司声称，并在 FDA De Novo
              决定文件中得到确认；文件明确指出系统「可以轻松在科室之间移动」。在全球 30+ 个国家完成 45,000+ 例手术后，CMR
              已经在真实世界、大规模验证了可移动模式，拿到了一个可信证明点；固定推车式机器人竞争对手若不重设平台，很难复制这一点。
            calloutType: strength
            claimRefs:
              - CE003
              - CE007
              - CE028
              - CE029
          - type: callout
            title: 美国适应证狭窄，限制近期收入
            body: >
              截至报告运行日，Versius Plus 在美国仅获准用于胆囊切除术——这个手术细分由成熟腹腔镜技术主导，复杂度和急性程度较低。妇科 510(k)
              仍在等待中，泌尿、胸外和结直肠专科都需要未来继续申报。胆囊切除术的美国 510(k) 完全依赖台架和临床前数据，没有人体临床试验证据。FDA De Novo
              标签明确写明，癌症治疗的长期安全性和有效性尚未确立。这些监管约束限制了 CMR 美国商业团队可使用的临床传播广度，也会拖慢其在适应证组合更宽的竞争对手面前提升手术量的速度。
            calloutType: risk
            claimRefs:
              - CE001
              - CE035
              - CE036
              - CE040
          - type: callout
            title: 数字生态形成差异化，但变现仍不透明
            body: >
              CMR 的 Versius Connect 和 Versius Team
              应用构成真正的战略差异点：它们把机器人和外科医生、医院之间的持续软件驱动数据关系绑在一起，带来硬件销售之外的经常性收入和切换成本潜力。Versius Cloud
              遥测基础设施也支撑上市后监测义务。但公开资料中没有找到数字应用的定价、打包条款或合同结构披露。尚不清楚这些工具是包含在系统购买/租赁协议中、单独收费，还是构成 SaaS
              变现层的基础——这是判断公司长期利润率画像的关键输入，需要直接向 CMR 尽调。
            calloutType: insight
            claimRefs:
              - CE014
              - CE015
              - CE038
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与分层画像
        blocks:
          - type: paragraph
            body: >-
              CMR Surgical 只向医院、医疗系统以及（在美国）门诊手术中心（ASCs）销售 Versius。直接使用者是执刀外科医生；买方和付款方是医院或 NHS 信托机构采购职能，或私营医疗运营方。收入来自
              Versius 系统的资本销售，并叠加器械和支持的持续使用费或服务费，但 CMR 没有公开披露合同条款或定价。

              英国 National Health Service 主导了 CMR 公开记录中的客户基础。NHS 信托机构受强制公开沟通要求约束，因此医院发布的页面——East and North Hertfordshire
              NHS Trust（Lister Hospital）、Manchester University NHS Foundation Trust（MFT）、Liverpool University Hospitals
              NHS Foundation Trust（Aintree）和 Gloucestershire Hospitals NHS Foundation Trust——是质量最高的点名客户证据。NHS
              内的学术和教学医院尤其突出，因为它们参与了早期试验和培训项目，放大了每个站点的参考价值。

              国际上，欧洲、亚洲、中东、非洲和拉丁美洲的私立和学术医院构成一个增长中、但公开点名更少的细分。Klinikum Chemnitz（Germany）是最突出的国际站点，曾在 February 2021 宣布德国首个
              Versius 装机。CMR 2026 年进入美国带来第三个细分：美国医院和 ASCs，目标产品是获 FDA 批准、用于胆囊切除术的 Versius Plus。美国细分仍处商业化最早期；截至 May 2026
              报告运行日，没有确认任何公开的美国客户部署。

              CMR 不披露客户总数或分层医院名单，因此仅靠公开来源无法核验收入集中度、流失率或相对分层权重。
