      - number: '2.2'
        title: 市场规模证据
        blocks:
          - type: paragraph
            body: >-
              公开的手术机器人市场规模估计差异很大，应视为方向性指标，而非精确输入。MarketsandMarkets 将 2024 年全球手术机器人市场估为 $11.98 B，预计 2030 年达 $27.14 B，CAGR
              14.7 %。GMInsights 发布的 2024 年数字明显更低，为 $8.1 B，但增长预测更激进：到 2034 年达 $38.4 B，CAGR 17.2 %。Fortune Business
              Insights 报告的机器人手术程序市场（衡量手术收入，而非单独设备）2025 年为 $13.32
              B。三者分歧源自不同范围定义、方法选择和收入确认约定，是公开数据中无法消除的模糊性；保留这种差异比取平均值更诚实。

              各来源中，北美稳定占全球市场 60–74 %，使美国成为最关键的单一地理市场。将下限（60 %）套用于较低的 2024 年全球估计（$8.1 B），可推得美国手术机器人市场约 $4.9 B；将上限（74
              %）套用于较高估计（$11.98 B），得到约 $8.9 B。这些是全市场 TAM 数字，会高估一个没有骨科适应症的新软组织进入者的可触达机会。

              更窄的 SAM 视角——仅限软组织 RA-MIS 资本设备、器械和服务——在保留来源集中没有任何分析师直接发布。按应用划分，普外（包括疝修补、胆囊切除、减重、结直肠）占手术机器人总市场的 28–32
              %（MarketsandMarkets），但该份额主要由已建立的 da Vinci 装机基础主导。CMR 在美国上市初期的 SOM
              无法用公开数据估算，取决于手术爬坡速度、单台手术器械定价和已安装系统数量——这些均为私有数据。因此，现有规模证据最好理解为宽口径 TAM 定位，而不是精确的 SAM/SOM 模型。
