          - type: callout
            title: 多专科扩展是关键商业护城河信号
            body: >-
              Versius 已展示的最重要商业客户行为，是医院在初始部署后采用第二个专科的比例达到 70%+。这种模式降低了医院的单系统资本成本摊销，提高了 CMR
              单台装机的器械收入，也加深了外科医生培训和工作流承诺，使切换到竞争对手的成本更高。若美国装机基础增长时这一比例仍能维持，它会在新增医院获客之前就带来有意义的收入爬坡。尽调的第一优先级，是核验这一比例反映的是活跃多专科手术，还是仅仅代表系统可在多个科室闲置可用。
