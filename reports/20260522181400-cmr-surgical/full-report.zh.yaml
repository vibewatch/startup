  - id: FM004
    title: 采用漏斗——Versius 医院采购与部署
    type: funnel
    layout: standard
    summary: 新机器人手术平台要从初始认知走到持续使用，必须依次穿过六道关口；每道关口都有不同决策者和失败模式，CMR 的商业模型必须逐一回应。
    data:
      items:
        - label: 认知建立与临床推动者识别
          value: 100
          sublabel: Surgeon hears about Versius via KOL network, conference, or CMR direct outreach; no purchase intent yet
        - label: 医院正式评估（临床 + 财务）
          value: 50
          sublabel: >-
            Capital committee evaluates clinical evidence, utilisation projections, and commercial terms; Ipsos notes
            economics and reimbursement barriers drive drop-off here
        - label: 签约与安装决策
          value: 28
          sublabel: >-
            CFO approves capital or per-procedure contract; service and training terms agreed; longer in hospitals with
            existing da Vinci lock-in
        - label: 手术室团队培训与资质认证
          value: 20
          sublabel: >-
            Surgeon and OR team complete credentialling programme before first independent case; time-to-revenue delay;
            training burden is a documented deterrent
        - label: 首批独立手术与早期使用
          value: 14
          sublabel: >-
            Surgeon completes initial supervised cases; first independent procedure performed; low volume expected in
            first 3–6 months
        - label: 持续高使用率（器械消耗拉动）
          value: 8
          sublabel: >-
            System reaches steady-state procedure volume; instrument revenue becomes the economic driver; feedback loop
            into expanded indications and new surgeon champions
    approximationNotes: 漏斗百分比是作者估计的示意性转化率，依据是 Ipsos 2023 年关于采购方障碍的实地研究。未找到公开可用的 CMR 专属漏斗转化数据。百分比代表示意性流失，不是 CMR 验证的赢单率。
