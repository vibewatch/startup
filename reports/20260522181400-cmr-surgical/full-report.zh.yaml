  - id: FU001
    title: Versius 客户旅程图——客群、切入点与扩张循环
    type: journey-map
    layout: wide
    summary: 客群、进入 Versius 的路径，以及推动平台粘性的多专科扩张循环。
    data:
      nodes:
        - id: awareness
          label: 外科医生 / 医院认知
          description: 通过会议曝光、同行转介、NICE/NHS 背书、CMR 直销进入视野。客户群包括：NHS Trust、国际私立医院、美国医院 / ASC（2026+）、学术 / 临床试验机构。
        - id: evaluation
          label: 临床评估与现场参访
          description: 带教手术、模拟训练、CMR Academy、湿实验室演示。所有客群都会做手术评估；学术机构更重视方案审查。
        - id: procurement
          label: 医院采购审批
          description: NHS Trust 董事会签字、NHS 采购框架、NICE 指南（英国）；CFO / CMO 审批（国际）。美国 ASC 路径需要 FDA 批准（Oct 2024 已获批）。
        - id: single-specialty
          label: 初始部署——1 个专科
          description: 最常见切入口是普外科、妇科或泌尿外科。已记录案例里，国际和 NHS 客群多数都从单一专科起步。
        - id: multi-specialty
          label: 扩展到 2+ 个专科（>70% 医院）
          description: 模块化设计让系统能在手术室之间移动；同一套系统可供多个外科科室使用。公开里程碑确认，>70% 的 Versius 医院走到这一阶段。
        - id: training-network
          label: 培训项目整合（START / 机器人学院）
          description: 医院成为培训中心；Versius 嵌入外科住院医师课程。MFT/Shelford Group START 项目是英国关键样本（2026）。
