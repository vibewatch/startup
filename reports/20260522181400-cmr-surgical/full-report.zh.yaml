      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              CMR 最近一轮融资在 2 April 2025 完成：一轮 $200M+ 融资，由现有投资者（SoftBank Vision Fund 2、LightRock、Ally Bridge 等）的股权资金，叠加
              Trinity Capital Inc.（NASDAQ: TRIN）至多 $68.75M 的成长资本。股权部分估计约为 $131M——即披露的 $200M+ 总额扣除 Trinity 披露的 $68.75M
              债务承诺后的余额。资金用途被描述为商业扩张，重点是美国市场发布，并继续推进包括 Versius Plus 在内的产品开发。Trinity Capital 的新闻稿称，这笔投资是「成长资本，用于使 CMR
              Surgical 继续扩大运营并加速商业扩张」——这种表述符合一家尚未达到经营现金流自给的公司。Sifted（2025）报道称，CMR 自 2014 年成立以来已融资超过 $1
              billion；TechFundingNews 将累计融资额列为 $1.4 billion，但该数字来自声誉较低的聚合网站，只能作为指示性信息。2021 Series D 确定的 $3 billion
              估值在后续轮次中没有更新；2023 年融资是一笔 £133M（$165M）可转换贷款票据，仅由现有投资者参与，估值未披露。2025 年融资同样未披露估值。


              Companies House 备案记录确认，CMR 在 Q1-Q2 2025 完成了一次实质性再融资。两项既有担保权益已经解除：Barclays Bank PLC 押记（0886 3657 0003，创建于
              May 2019）在 4 March 2025 解除，Grovemere Property Limited 押记（0886 3657 0005，创建于 February 2022）在 3 March 2025
              解除。与此同时，三项新押记（0886 3657 0006、0007、0008）在 24–28 March 2025 登记，第四项新押记（0886 3657 0009）在 13 May 2025 登记，和
              Trinity Capital 债务额度及相关债权人间文件的担保安排相符。September 2024 至 June 2025 之间的股本配发把名义股本从 GBP 634.86 提高到 GBP
              683.46，反映融资过程中存在多个批次。


              截至 31 December 2024 的集团账目已在 14 April 2025 向 Companies House 提交；截至 31 December 2023 的账目在 20 May 2024
              提交。December 2025 账目需在 30 September 2026 前提交。作为私人有限公司，CMR 无需在英国备案中披露收入或利润表数据。公司也没有公开披露在手现金、烧钱速度或现金跑道。
