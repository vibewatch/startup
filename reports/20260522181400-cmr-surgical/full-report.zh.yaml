      - number: '5.2'
        title: 监管路径与临床证据
        blocks:
          - type: paragraph
            body: >
              CMR Surgical 的美国监管路径横跨两个授权节点和一项进行中的申报。FDA 在 October 2024 向原版 Versius Surgical System 授予 De Novo
              上市授权（DEN230078）——这是第一款通过 De Novo 路径获批的多端口软组织普通外科 RASD，并由此建立了新的产品分类（21 CFR 878.4964）。De Novo
              标签明确写明，该系统用于癌症或癌症治疗的长期安全性和有效性尚未确立——这对肿瘤外科构成实质性约束。随后，Versius Plus 在 December 16, 2025 获得 FDA 510(k)
              许可（K252111），适用于胆囊切除术，并加入近红外 vLimeLite 影像和更新软件。值得注意的是，这次 510(k)
              完全由台架测试、临床前猪模型研究和人因验证支持，没有提交人体临床试验。截至报告运行日，面向良性妇科手术（全子宫切除、卵巢切除、输卵管切除）的 510(k) 上市前通知已在 April 29, 2026
              提交，仍在等待 FDA 审查。


              美国以外，各专科临床证据为正面但仍处早期。一项临床前尸体和猪模型研究评估 Versius 用于普通外科和结直肠手术，在 9 类手术中完成 35/38 例，未出现器械相关术中并发症。一项 2a 期 IDEAL-D
              前瞻性研究纳入 30 名连续胸外科患者（April–December 2023），实现 93.3% 未转术完成；两例转为胸腔镜，其中一例归因于控制台报警。一项独立前瞻性泌尿外科研究（45 名患者，May
              2023–May 2024）发现，Versius 可用于根治性前列腺切除、膀胱切除、肾切除和部分肾切除，转腹腔镜率为 8.9%，术后并发症率为 28.9%（以低级别 Clavien-Dindo
              为主）。King's College London 团队评估 Versius 用于经口机器人手术（TORS），共 30 例（15 例良性、15
              例癌症）——全部完成且无重大并发症——但外科医生指出，器械体积和缺少单极铲是限制因素。Milton Keynes University Hospital 发表技术说明，描述 150
              例结直肠切除中的优化机械臂和端口配置。截至 March 2026，Versius 已在全球 30+ 个国家用于 45,000+ 例手术。
