figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: CMR Surgical 从 2014 年创立到 2026 年美国商业化启动的里程碑，涵盖融资、治理、监管和不利事件。
    data:
      items:
        - date: '2014-01-27'
          label: 创立
          detail: 在英国 Cambridge 以 Cambridge Medical Robotics Limited 名义注册成立。
          tone: positive
        - date: '2018-02-26'
          label: 更名为 CMR Surgical
          detail: 由 Cambridge Medical Robotics Limited 更名为 CMR Surgical Limited。
          tone: neutral
        - date: '2019'
          label: Versius 获 CE Mark
          detail: 第一代 Versius 获得欧洲 CE Mark，可在欧洲和国际市场商业化。
          tone: positive
        - date: 2021-09
          label: $600M Series D 轮，估值 $3B
          detail: SoftBank Vision Fund 2 和 Ally Bridge Group 领投欧洲机器人领域有史以来最大一笔融资。
          tone: positive
        - date: 2023-Q1
          label: 裁员（约 350 个岗位）
          detail: CMR 最多裁撤约 350 名员工（约占员工总数三分之一），重心转向区域商业市场。
          tone: negative
        - date: '2023-09-20'
          label: $165M 后续轮融资
          detail: 现有投资者全部参与，提供 £133M 可转换贷款票据；估值维持 ~$3B。
          tone: neutral
        - date: '2023-11-21'
          label: 提交 FDA De Novo 申请
          detail: 提交 Versius Surgical System 的 DEN230078；为新的 FDA Class II 器械类别打开路径。
          tone: positive
        - date: '2024-10-10'
          label: CEO Bose 离任；Colella 任临时 CEO
          detail: Supratim Bose 因个人原因辞任；Massimiliano Colella 获任临时 CEO。
          tone: negative
        - date: 2024-10
          label: FDA De Novo 营销授权
          detail: Versius 获 21 CFR 878.4964（产品代码 SCV）授权 —— 首个通过 De Novo 路径获批的多端口软组织 RASD。
          tone: positive
        - date: '2025-01-15'
          label: Colella 正式任 CEO
          detail: Colella 正式获任 CEO，并加入 CMR 董事会。
          tone: positive
        - date: 2025-04
          label: $200M+ 融资轮
          detail: 现有投资者股权资金加上 Trinity Capital 约 $68M 债务，为美国启动提供资金。
          tone: positive
        - date: '2025-12-16'
          label: FDA 510(k) 许可 — Versius Plus
          detail: K252111 以实质等同（Substantially Equivalent）认定获批用于胆囊切除术；支持 Gen 2 系统在美国商业化铺开。
          tone: positive
        - date: '2026-03-26'
          label: 45,000+ 患者；SAGES 2026 美国发布
          detail: CMR 在 Tampa 宣布该里程碑；正式向美国外科医生推出 Versius Plus，并开始医院 / ASC 合作。
          tone: positive
        - date: '2026-04-29'
          label: 提交妇科 510(k)
          detail: Versius Plus 用于良性妇科手术的第二份 510(k) 已提交 FDA。
          tone: positive
    approximationNotes: 2023 年 Q1 裁员日期为近似值，依据 Cambridge Independent 报道。2021 年 Series D 日期根据新闻稿估算。
