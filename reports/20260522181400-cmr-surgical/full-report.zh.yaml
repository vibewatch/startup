      - number: '4.2'
        title: 成本结构与单位经济
        blocks:
          - type: paragraph
            body: >-
              CMR Surgical 的成本结构由五类要素推着，符合一家硬件密集型医疗器械公司进入商业化规模后的典型形态。第一是硬件制造：Versius Plus
              包含精密机电子系统、机械臂、视觉光学、外科医生控制台硬件和一次性器械。公司已在 Cambridgeshire 的 Ely 附近投入专用制造设施，现阶段这是一项实质性资本承诺。第二是研发和软件：CMR 在
              Companies House 同时登记两个 SIC 代码（32500 — 医疗和牙科器械制造；72190 —
              自然科学与工程其他研发），表明公司同时承担活跃的制造和研发成本。仍在推进的临床试验（儿科手术、经口机器人手术）以及等待中的妇科适应证监管申报，进一步抬高了这一层成本。第三是临床培训和现场服务：每套系统安装都需要手术团队上手、应用专家做病例督导，以及持续现场支持——这些成本分布在各地、依赖人力，并随装机基础扩大而增长。第四是监管和质量保证：CMR
              自 2023 年以来走过多条 FDA 路径（Versius 在 October 2024 走 De Novo；Versius Plus 在 December 2025 走 510(k)；妇科适应证 510(k)
              预计 mid-2026 待定），累积了监管和上市后监测成本。第五是全球商业化基础设施：30+ 个国家运营和即将到来的美国商业发布，需要分布在各地的销售、市场和临床团队。


              毛利率、COGS 或运营成本数据均未公开。2023 年最多约 350 个岗位的裁员——据 Cambridge Independent，约占总员工数三分之一——说明 CMR
              已承认集中式成本基础和区域收入生成之间存在结构性失衡。Sifted 报道的 LinkedIn 数据显示，员工数在 June 至 September 2023 从约 861 人降至 762
              人，裁减集中在工程、制造、现场服务和支持职能，之后公司有意向面向客户的区域市场重新配平。PMC
              一篇关于机器人辅助手术经济性的系统综述把设备成本和住院时长列为主要成本驱动项；学术研究中，医院每例手术相对腹腔镜替代方案增加的成本约为 $1,000 至 $5,000——这意味着无论对 CMR
              还是医院客户，单台装机必须保持高利用率，经济账才跑得通。
