      - number: '4.4'
        title: 公开牵引力、财务不透明与结论
        blocks:
          - type: paragraph
            body: >-
              CMR 可公开追踪的商业指标仅限手术量和隐含装机基础代理指标，但这些指标确认采用速度在加快。August 2023 融资时，CMR 报告 15,000+ 例手术和 140+ 套装机（据 FierceBiotech
              和 Sifted）。到 April 2025 融资完成时，公司报告已在 30+ 个国家完成 30,000+ 例手术（据官方新闻稿和多家新闻来源）。截至 March 2026 SAGES 会议公告，全球已有超过
              45,000 名患者使用 Versius 平台接受治疗。这条曲线意味着每 12–18 个月大约新增 15,000 例手术，和扩大的装机基础一致。超过 70% 采用 Versius
              的医院把它用于两个或更多外科专科，说明使用深度已经超出单专科试点。


              但这些指标都不直接披露收入或单位经济性。每例手术的器械和耗材价格、系统投放实际 ASP、毛利率、EBITDA、净现金头寸和月度烧钱速度，公开记录中均不存在。CompaniesHub、NorthData
              等第三方数据库没有列出 CMR Surgical 经核验的收入数字。任何未被一手来源佐证的数据库聚合收入估算都应视为低置信度。CMR
              是一家私人有限公司，按英国公司法无需提交公开利润表，也没有在任何可公开获取的新闻稿、投资者材料或监管文件中主动披露运营指标。


              AMA 发表的医院机器人投资分析确认，外科机器人系统的资本密集性会同时给医院和制造商施加隐性利用率压力——这会放大 CMR
              装机基础带来的上行空间，也会提高资金受限市场爬坡缓慢的下行风险。连续大额融资的模式——2021（$600M）、2023（$165M）、2025（$200M+）——叠加没有披露任何盈利能力，以及 Trinity
              Capital 对「成长资本」的定位，最符合一家经营口径上仍未实现收入转正的公司。财务结论围绕三重约束：深度不透明（没有公开 P&L
              或运营指标）、持续资本依赖（每个商业阶段都需要新一轮融资）和硬件成本强度（制造、现场服务和监管合规形成很高的最低可行规模）。2025 年融资是否足以支撑公司证明美国商业化盈利，公开数据无法判断。
