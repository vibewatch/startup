      - number: '8.4'
        title: 建议、退出准备度与尽调问题
        blocks:
          - type: paragraph
            body: >-
              基于所有可得证据，CMR Surgical 值得给予「观察」建议，置信度为中，风险评级为高。投资逻辑建立在可证明的战略稀缺性上：CMR 是全球唯一已部署、非 ISRG 的软组织手术机器人，同时拥有 CE 标志和
              FDA 授权；全球手术量也在加速，从 2025 年 4 月的 30,000 台到 2026 年 3 月的 45,000 台，约 11 个月增长 50%；业务覆盖 30
              多个国家，并拥有全球第二大软组织机器人装机基础。这些属性使其成为大型医疗科技和多元化医疗健康战略买家的有吸引力 M&A 标的。反过来，主导风险包括：在 Intuitive
              主场进行美国商业化，且初始胆囊切除适应症较窄； 收入、毛利率和烧钱速度完全不透明；超过 $1.4 billion 融资以不同条款堆叠后形成优先权和债务包袱；Trinity Capital
              风险债工具的未披露契约也可能限制战略选择。 估值立场为偏高：$3 billion 最后估值来自 2021 年牛市峰值，2025 年融资没有上调股权估值，报道中的 $4 billion
              要价是诉求，不是确认价格。退出准备度正在改善： FT 报道的出售流程表明管理层正在主动探索流动性选项；FDA 进展——2024 年 10 月胆囊切除 de novo 授权，以及 2025 年 12 月
              Versius Plus 510(k) 许可——为可信的美国故事提供了监管基础。 优先尽调动作包括：进入财务数据室（收入、EBITDA、烧钱速度、单位经济），摸清完整股权结构表和清算瀑布，验证美国医院管线和
              LOI 数量，审阅 Trinity Capital 债务条款与契约，并评估是否已与战略收购方签署任何有约束力的 NDA。
