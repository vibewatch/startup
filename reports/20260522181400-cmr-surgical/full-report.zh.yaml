      - number: '6.3'
        title: 点名客户证据与专科部署
        blocks:
          - type: paragraph
            body: >-
              Versius 的点名客户证据在英国 NHS 信托机构中最强；这些机构会在强制面向公众的网站上发布患者故事和临床新闻。East and North Hertfordshire NHS Trust 旗下
              Lister Hospital 发布了一名女性患者的证言，她因子宫内膜异位症使用 Versius 接受全子宫切除；她称手术「无痛」，并在两天后出院，而不是预期的三到五天。手术由妇产科顾问外科医生 Mr Rami
              Atalla 完成，确认这是实际临床生产使用，而不是演示。

              Manchester University NHS Foundation Trust（MFT）是一家 Shelford Group 医院，2026 年初加入 START（Shelford Surgical
              Training in Advanced Robotic Technology）项目，试点年度有 50 多名外科研修医生报名，使用 Versius 以及 da Vinci 和 Medtronic 的 Hugo
              平台。这确认了医院层面的主动机构承诺、对 Versius 的多平台接纳，以及对该系统的持续培训投入。

              Liverpool University Hospitals NHS Foundation Trust（LUHFT）通过 Aintree University Hospital 启动了英国首个 Versius
              头颈癌（TORS）2 期临床试验，计划纳入约 60 名癌症患者。Liverpool Head and Neck Centre 主任 Professor Terry Jones 认可该系统能够支持更多微创技术。三个
              NHS 信托机构——Southampton Children's Hospital、Guy's and St Thomas' NHS Foundation Trust 和 MFT——正在开展儿科 Versius
              试验，代表一个尚未进入生产使用的未来客户子细分。Gloucestershire Hospitals NHS Foundation Trust 在 2024 年成为全球首家安装 vLimeLite
              荧光影像升级的医院，确认现有 Versius 站点具备早期技术采用者行为。

              国际上，Klinikum Chemnitz（Germany）在 February 2021 成为德国首家安装 Versius 的医院，并将其部署在普通/脏器外科（Prof. Dr. Lutz
              Mirow）和胸外科（Dr. Sven Seifert）。在 March 2026 Tampa SAGES 会议上，University of Illinois Chicago 的 Dr. Francesco
              Bianco 将 Versius 真实世界经验规模列为美国外科医生评估的重要证据——但这只是被引用的背书，不是已确认的美国客户部署。

              这些点名客户覆盖的专科组合包括妇科、结直肠外科、普通外科、胸外科、TORS（试验）和儿科手术（试验），确认了 CMR 发布的七专科说法。限制在于，英国以外被点名的国际客户几乎全部来自 CMR
              发布的新闻稿，只有德国和英国站点有医院自行发布的独立确认。
