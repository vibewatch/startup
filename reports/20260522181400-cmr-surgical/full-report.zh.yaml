      - number: '1.2'
        title: 创始人、领导层、治理与关键人风险
        blocks:
          - type: paragraph
            body: >-
              Mark Slack 是 CMR Surgical 联合创始人兼首席医疗官——他的联合创始人身份由公司自己的 FDA De Novo
              新闻稿确认，且自创立以来一直留在领导层。保留来源集中，他是唯一具名联合创始人；完整创始团队名单未公开，是一个待补尽调缺口。Slack 连接临床和监管权威，在产品开发决策中影响力超出一般高管。

              CMR 近期经历了明显的 CEO 更迭。Per Vegard Nerseth 在 Supratim Bose 之前担任 CEO。Bose 于 2023 年 2 月以高级顾问身份加入，2023 年 3 月升任
              CEO；2024 年 10 月因个人原因辞任，转任董事会副主席，并返回新加坡。Massimiliano Colella 于 2023 年 12 月加入担任首席商务官，2024 年 10 月获任临时 CEO，并于
              2025 年 1 月 15 日正式任 CEO，同时进入董事会。这是公司约两年内第三任 CEO；快速接棒为后续尽调章节留下实质关键人风险信号。Colella 拥有 30+ 年医疗健康领导经验，包括曾任
              Evercare Group 集团 CEO，以及 Johnson & Johnson、Smith & Nephew 高管。

              现任高管团队包括：Andre Nel（CFO）、Chris Fryer（CTO）、Susan Firbank（首席人事官）、Lionel Gousset（运营总经理）、Chris
              O'Hara（商业总裁兼美国总经理，2025 年初加入）、Michelle Paknad（首席营销官兼国际商业总裁）、Markus Bauman（首席公司战略官兼首席法务官）和 Luke
              Hares（首席创新官）。聘用 O'Hara 是为有意搭建美国商业能力；他此前曾任 Virtual Incision 销售和营销 SVP，并在 Intuitive Surgical、Globus Medical
              担任高管。Companies House 记录显示，截至该期间有 8 名在任董事，包括 Colella、Bose（现任副主席）、John Cassidy（2022 年 10 月任命）、Daniel
              Moore（2024 年 7 月任命——TechFundingNews 称其担任非执行主席）、Catherine Moukheibir（2021 年 1 月任命）、Irackli
              Mtibelishvili（2022 年 10 月任命）、Sakip-Umur Hursever（2018 年 5 月任命）和 Steven Plachtyna。
