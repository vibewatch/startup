  - id: TM003
    title: 买方与用户分群图
    columns:
      - 利益相关方
      - 角色
      - 预算权限
      - 核心关切
      - 采用触发因素
    rows:
      - - 外科医生（临床推动者）
        - 系统主要使用者；手术决策者
        - 无直接资本开支权限；向资本委员会推荐
        - 人体工学、灵巧度、培训时间、临床结局
        - 同侪证据、带教培训、手术量支持
      - - 手术室主任 / 专科线负责人
        - 流程把关人；管理排班和手术室吞吐
        - 影响资本开支优先级；控制手术室时间分配
        - 手术室周转、人手扰动、设备占地
        - 已验证的手术室效率提升；系统占地小（Versius 模块化）
      - - 医院 CFO / 资本委员会
        - 最终批准资本开支；把关财务回报
        - 完整资本开支权限（每套系统决策 $1–2.5 M+）
        - ROI、使用率、器械收入抵扣、租赁 / 购买条款
        - 按手术收费模式；手术量承诺；竞争性报价
      - - 采购 / 供应链
        - 合同执行；耗材管理
        - 审批供应商合同和耗材定价
        - 总拥有成本、合同条款、冗余风险
        - 有竞争力的器械定价；服务合同清晰度
      - - 医院高管层（CEO/COO）
        - 战略定位；品牌与市场份额
        - 影响资本开支优先级和项目投入
        - 机器人项目差异化；外科医生招聘 / 留任
        - 外科医生需求、患者量预测、市场竞争
      - - ASC 运营方
        - 日间手术中心所有者 / 管理者
        - 拥有机构完整资本开支和运营权限
        - 资本效率、手术经济性、报销可及性
        - 按手术收费或租赁模式；ASC 中胆囊切除 / 疝修补手术量
      - - 患者
        - 下游受益者；影响需求信号
        - 间接（保险 / Medicare 支付方覆盖手术）
        - 恢复更快、切口更小、住院更短
        - 外科医生推荐；对机器人选项的认知
    notes: >-
      利益相关方角色依据 Ipsos 2023 医院管理者研究，以及 AMA Journal of Ethics 对机构投资机器人的评论整理。ASC 运营方细节来自 Ipsos 2023 将 ASCs
      识别为服务不足细分市场的结论。患者列代表需求信号，不代表直接资本采购。
    claimRefs:
      - CM015
      - CM016
      - CM017
      - CM018
      - CM019
  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 因素
      - 方向
      - 时间
      - 对 CMR 的影响
      - 尽调问题
    rows:
      - - 微创手术（MIS）采用扩大（手术量从开放手术转移）
        - 驱动
        - 持续；多年结构性趋势
        - 扩大适合 RA-MIS 的手术池；拉大总市场
        - CMR 目标手术中，目前腹腔镜和开放手术各占多少？
      - - 外科医生人体工学需求
        - 驱动
        - 即时；中生代外科医生担心职业寿命
        - Versius 人体工学控制台对准腹腔镜疲劳痛点，拉开差异
        - 比较 Versius 与 da Vinci 控制台的独立人体工学数据
      - - 医院容量与吞吐压力
        - 驱动
        - 近期；COVID 推高认知，疫情后重组
        - 住院更短的 RA-MIS 手术释放容量；支撑预算理由
        - 医院层面采用 Versius 前后的住院时长（LOS）和手术室使用率数据
      - - 门诊手术向 ASC 迁移
        - 驱动
        - 近期；CMS 门诊迁移政策正在加速
        - 打开 ASC 买方细分；按手术收费模式贴合 ASC 经济性
        - 胆囊切除机器人在 ASC 场景有哪些专属报销？
      - - 竞争增加选择（多供应商市场）
        - 驱动
        - 中期；Medtronic Hugo、J&J Ottava 进入
        - 打破 Intuitive 垄断叙事；给差异化留出窗口
        - Hugo/Ottava 美国上市时间表及适应证范围
      - - 数字培训与数据生态（Versius Connect / Team）
        - 驱动
        - 中期；市场成熟后成为差异化因素
        - 数据驱动的使用分析支撑医院商业论证
        - Versius Connect 用户采用率和 NPS 证据
      - - 机器人系统资本密集度
        - 约束
        - 即时；小型医院和 ASCs 的主要门槛
        - 限制可触达买方基数；迫使按手术收费创新
        - CMR 美国上市的按手术收费和租赁定价是多少？
      - - CMS 报销同价（机器人相对腹腔镜无溢价）
        - 约束
        - 持续；若同价规则继续收紧，会形成政策风险
        - 消除直接收入激励；倒逼以效率为核心的 ROI 论证
        - CMR 目标市场中，是否有商业支付方为机器人手术提供溢价？
      - - 培训与资质认证负担
        - 约束
        - 即时；影响首年采用率和市场份额爬坡
        - 每家医院都要为手术室团队做资质认证；推迟收入兑现
        - 安装后到首例独立 Versius 手术的中位时间是多少？
      - - 现有厂商切换成本（da Vinci 生态锁定）
        - 约束
        - 持续；在已有机器人经验的医院里是深层结构性障碍
        - 推动 CMR 转向未部署机器人的医院和 ASCs
        - CMR 美国目标账户中，目前有多少已安装 da Vinci？
      - - 临床证据缺口（RAS 在所有适应证上尚未证明优越性）
        - 约束
        - 中期；证据生成需要 3–5 年
        - NICE 有条件批准、支付方疑虑、同行评议要求
        - NICE HTG742 证据生成计划进展和中期数据
      - - 美国初始适应证狭窄（仅胆囊切除）
        - 约束
        - 即时；限制上市初期市场准入
        - 在 510(k) 扩展批准落地前限制 SAM
        - 下一个美国适应证递交时间表及预期获批时间
    notes: >-
      驱动与约束依据 Ipsos 2023、NICE HTG742、PMC 经济性综述、USC Schaeffer Center 白皮书和 FACS 2026 公告整理。时间分类（即时 / 近期 / 中期）是作者相对 2026
      runDate 作出的判断。“尽调问题”字段代表仍需一手研究或公司披露数据回答的开放问题。
    claimRefs:
      - CM022
      - CM023
      - CM024
      - CM025
      - CM026
      - CM027
