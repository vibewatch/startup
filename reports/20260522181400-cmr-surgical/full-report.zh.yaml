      - number: '6.2'
        title: 采用曲线与部署广度
        blocks:
          - type: paragraph
            body: >-
              Versius 已走过一系列公开报道的手术里程碑：15,000 例（September 2023）、2023 全年 17,000 例手术（较 2022 年增长 60%+）、跨七个专科 20,000+ 例、FDA
              批准时全球 26,000+ 例（October 2024）、February 2025 达到 30,000+ 例，以及到 March 2026 全球 45,000+ 名患者。这些里程碑由 CMR
              通过新闻稿自行报告，未经独立审计，但在大约 30 个月窗口内呈现出一致且加速的轨迹。

              2023 年底装机系统基数比上一年高出 50% 以上，全球部署 140+ 套系统。CMR 报告称，Versius 已部署到欧洲、亚洲、中东、非洲和拉丁美洲的 30 多个国家，2023 年进入的新市场包括
              Greece 和 Indonesia。公司把 Versius 描述为全球第二广泛使用的软组织外科机器人平台，排在 Intuitive Surgical 的 da Vinci 之后。2026
              年进入的美国市场被公司定义为主要商业增长杠杆。

              重复使用和扩展的一个特别强信号，是多专科采用率：在 20,000 例里程碑时，超过 75% 的医院已经把 Versius 用于两个或更多专科；到 February 2025 的 30,000 例里程碑时，超过
              70% 仍保持这种行为。单台装机手术量没有披露，因此无法独立计算利用效率。Versius 临床注册系统会跨医院站点捕捉手术数据，并支持与外科医生持续共享数据，显示出一定平台粘性，但注册参与率和随访率没有公开刻画。
