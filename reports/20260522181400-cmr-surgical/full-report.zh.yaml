      - number: '1.5'
        title: 展项
        blocks:
          - type: callout
            title: 纯手术机器人初创公司中独一档的国际监管履历
            body: >-
              CMR Surgical 是首个也是唯一一个经 De Novo 路径获得 FDA 上市授权的多端口软组织 RASD，并由此创建新的监管设备类别（21 CFR 878.4964，SCV）。随后 Versius
              Plus 的 510(k) 在提交后不到 6 个月完成，显示出监管执行能力。叠加 2019 年以来的 CE Mark 和 30+ 个国家采用，CMR 进入美国时拥有比多数同阶段竞争者更强的监管和临床证据基础。
            calloutType: strength
            claimRefs:
              - CO035
              - CO007
              - CO006
              - CO008
          - type: callout
            title: 两年三任 CEO 带来关键人和战略连续性风险
            body: >-
              Per Vegard Nerseth、Supratim Bose（2023 年 3 月–2024 年 10 月）以及现在的 Massimiliano Colella，在 CMR
              历史上最关键阶段形成了快速领导层轮换。Colella 虽已正式任命且具备强医疗健康履历，但约两年内三次 CEO 交接，提示董事会层面张力或管理适配问题。美国商业成功高度依赖 C-suite
              与医院系统关系的连续性——若领导层再受扰动，将成为实质尽调关切。
            calloutType: risk
            claimRefs:
              - CO020
              - CO021
              - CO022
              - CO044
          - type: callout
            title: 2023 年裁员与未披露财务限制了对运营健康的信心
            body: >-
              2023 年最多 350 人（约三分之一）的裁员由多方来源确认，同时管理层称公司正在向区域商业市场再平衡。但裁员后的员工数、收入运行率、毛利率或现金消耗均没有公开数据。2025 年引入 Trinity
              Capital 债务，在美国启动带来的现金压力之外增加了债务契约风险。收入披露是下游财务承销最关键的尽调缺口。
            calloutType: risk
            claimRefs:
              - CO025
              - CO026
              - CO016
              - CO017
          - type: callout
            title: Tencent 持股需要在美国市场语境下做专项地缘政治尽调
            body: >-
              Tencent 已确认是多轮投资者（2021 Series D、2023 跟投、2025 跟投）。公开报道中没有显示该持股对 CMR 的美国 FDA 许可造成监管挑战，但自 2021 年以来，CFIUS
              对医疗器械和医疗健康 AI 公司中中国关联投资者的姿态已显著收紧。尽调应确认是否存在任何 CFIUS 申报或缓解协议，尤其考虑到 CMR 的软件驱动数字生态，以及其计划从美国医院收集真实世界手术数据。
            calloutType: insight
            claimRefs:
              - CO014
              - CO015
              - CO016
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Versius 所在市场是软组织机器人辅助微创手术（RA-MIS）——大手术机器人市场的一个子集，覆盖普外、妇科、泌尿外科、胸外科中与腹腔镜相当的术式，但明确排除骨科机器人系统（如 Stryker
              Mako、Zimmer Biomet ROSA）。后者处理骨铣削和关节置换，临床流程、报销代码、资本委员会均完全不同。这个边界重要，因为多数公开分析师 TAM 数字把软组织和骨科机器人合并统计——这种设计会抬高
              CMR 可服务市场的标题数字，却掩盖骨科龙头并非直接对手的竞争事实。

              在软组织 RA-MIS 内，收入堆栈分三层：（1）资本设备（机器人系统销售或租赁），通常每套 $1–2.5 M；（2）器械和附件，高毛利经常性收入流，按价值占总市场 55–60
              %；（3）服务合同、培训和数字生态费用。手术吞吐量是经济引擎——利用率越高，器械带动越强，也越能支撑资本投入。RA-MIS 的现状替代方案是传统腹腔镜；它成熟、成本有效，外科医生和支付方都熟悉，为 CMR
              必须证明的临床与经济论证设定了底线。

              相邻市场包括：柔性机器人支气管镜（Auris/J&J Monarch 平台，面向肺部诊断）；骨科机器人（Intuitive ION、Stryker Mako）；以及神经外科 / 脊柱机器人。这些都不在
              Versius 已获批适应症中直接竞争。经 da Vinci 系统完成的前列腺切除术已经是 NHS 成熟实践，且不属于 NICE 软组织 EVA
              指南（HTG742）范围，进一步确认这是一个独立的监管和竞争子细分。
