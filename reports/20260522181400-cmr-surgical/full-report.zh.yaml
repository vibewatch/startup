      - number: '5.3'
        title: 数字生态与培训栈
        blocks:
          - type: paragraph
            body: >
              CMR Surgical 将 Versius Plus 定位为「数字驱动」系统，而不是单纯硬件设备。数字生态由两个专用应用构成：Versius Connect
              面向外科医生，是近实时手术日志，帮助医生回看病例数据并跟踪熟练度指标；Versius Team
              是医院管理看板，提供使用情况、病例量、系统效率和机器人项目表现的实时跟踪。两个应用都调用外科医生控制台持续记录的遥测数据；只要本地网络连接可用，数据就会上传到 Versius Cloud。CMR
              声称，这一数据层让系统可以持续靠软件创新演进，无需更换硬件。美国 Versius Plus 生态还把 EIZO CuratOR OR display 纳入为第三方组件。


              vLimeLite 荧光可视化系统整合近红外（NIR）成像，并使用吲哚菁绿（ICG）染料，在胆囊切除术中实时显示胆道解剖结构。CMR 指出，ICG 是一种药物，必须由医院独立采购，这形成了 CMR
              直接控制之外的供应链依赖。ICG 的监管批准状态可能因国家而异。


              CMR 面向美国市场进入的培训栈包括 Versius Trainer、Versius eLearning、点对点连接和虚拟现实（VR）应用模块。一项独立单盲随机对照试验（ISCRTN
              10064213）发现，在训练没有机器人经验的人在手术室搭建 CMR Versius 时，沉浸式 VR（IVR）头显训练显著优于 e-learning：IVR 参与者的总体中位得分为 53.5，而
              e-learning 参与者为 84.5（分数越低越好；p<0.001），且 IVR 受训者更常独立完成任务，需要的身体协助更少。完成时间没有显著差异。这项独立验证支持 CMR VR
              培训组件的临床价值，但作者也指出，要达到最佳表现，持续刻意练习仍然必要。
            claimRefs:
