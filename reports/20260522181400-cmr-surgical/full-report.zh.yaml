      - number: '3.3'
        title: 切换成本、分销能力与现状替代方案
        blocks:
          - type: paragraph
            body: >
              Intuitive 的竞争护城河很大程度上靠结构性而非单纯合同性切换成本支撑。医院一旦搭建 da Vinci 技术认证项目、培训外科医生、配置专用机器人 OR 团队，并把 Intuitive
              的服务合同和数据分析接入质量报告流程，考虑任何替代方案时都会面对 12-24 个月过渡期和大量再培训投入。超过 11,000 套装机基础形成自我强化的外科医生偏好：专科进修医生和住院医主要在 da Vinci
              上训练，这种偏好会贯穿其职业生涯。


              Medtronic 和 Johnson & Johnson 掌握企业级分销杠杆，CMR 和 Distalmotion
              无法匹配。两家公司与多数大型综合交付网络（IDNs）已有合同关系，拥有覆盖从缝线到能量设备的捆绑供应协议，以及全球规模服务组织。这意味着医院 CFO 评估 Hugo 或 Ottava
              时，往往会围绕数十条产品线进行一次性谈判，让 Medtronic 和 J&J 获得独立机器人公司结构上不具备的定价和准入优势。


              传统腹腔镜是最普遍的现状替代方案。Versius、Hugo 或 Dexter
              瞄准的任何术式，都存在腹腔镜替代，且已有数十年临床证据、成熟报销、受训外科医生和几乎可以忽略的资本成本。在美国等先进医疗系统中，目前只有约 40%
              手术采用微创技术，意味着每个机器人系统的主要“竞争者”是开放手术或腹腔镜在位方案，而不是另一台机器人。医院若推迟机器人决策，等待 Hugo 或 Ottava
              成熟，短期内没有损失，同时保留日后选择更经验证平台的选项。


              “观望”或“等 Medtronic/J&J”策略在 2026 和 2027 年对许多医院采购委员会都是完全理性的替代方案。CMR 必须证明足够的临床差异、经济收益或战略紧迫性，才可能在 Intuitive 的
              da Vinci 5 进一步巩固地位、Medtronic 开始扩大美国商业运营之前克服这种惯性。
