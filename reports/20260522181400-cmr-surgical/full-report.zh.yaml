      - number: '7.3'
        title: 资本结构与融资风险
        blocks:
          - type: paragraph
            body: >-
              CMR Surgical 的融资历史显示出韧性，但也指向一个仍需要大量外部支持才能打到美国规模的商业模式。公司 2021 Series D 以据称 $3 billion 估值融资 $600 million，随后
              2023 年仅从现有投资者追加 $165 million，没有估值上调。2025 年初又完成一轮 $200 million 以上融资，混合股权和风险债，使累计融资约达 $1.4
              billion。绝对数字很大，但构成更关键：一轮轮由内部投资者主导、且没有清晰估值抬升，说明既有支持者仍在托住公司，而外部投资者在更广泛商业证明出现前，可能不太愿意把故事重新定价到更高水平。债务部分进一步放大执行敏感性。Trinity
              Capital 承诺至多 $68.75 million，Companies House 记录显示 March 至 May 2025 出现一波集中的新担保押记，同时早期 Barclays 和 Grovemere
              押记被解除，很可能反映再融资。这意味着资本结构不再只是耐心股权资本；它现在包含有担保债务，以及如果里程碑滑坡可能出现的契约压力。与此同时，公开财务披露仍然稀薄。CMR
              没有按投资者在资本密集型美国铺开前会希望看到的细度披露收入、毛利率、烧钱速度或现金跑道。2023 年裁员约 350
              人、约占员工三分之一的报道，进一步说明管理层已经在融资压力下调整过一次组织规模。估值长期持平、债务负担、披露有限和发布投入叠加，就是核心融资风险。
