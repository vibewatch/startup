        - Versius Plus 提供模块化 MAS 机器人辅助；无需专用手术室
        - 510(k) 于 Dec 2025 获批；FDA 授权在美国使用（监管证据）
        - 美国唯一获批适应证；近期可触达量窄
      - - 结直肠切除（右半结肠切除、前切除）
        - 腹腔镜；机械臂复位有挑战；端口布置复杂
        - 床旁单元三角配置优化；兼容腹腔镜端口布局
        - MKUH 150 例切除；技术说明验证三角配置（真实世界）
        - 未获美国许可；床旁单元和端口定位存在学习曲线
      - - 胸外科手术（肺叶切除、胸腺切除）
        - 开放开胸或 VATS；多数中心缺少专用机器人选项
        - Versius 机器人辅助胸外科；IDEAL-D 2a 期可行性已确认
        - 93.3% 无中转；胸腺切除 0 并发症；中位 LOS 1 天（2a 期）
        - 未获美国许可；1 例因控制台报警中转；2b/3 期证据待补
      - - 良性妇科（子宫切除、卵巢切除）
        - 腹腔镜或开放手术；低量中心机器人可及性有限
        - 兼容 5mm 端口的 Versius Plus；April 2026 提交 510(k)
        - 全球妇科经验广；510(k) 正待 FDA 审查
        - 尚未获美国许可；监管时间表未确认
      - - 泌尿肿瘤（RARP、RARC、RAPN）
        - 开放或腹腔镜；替代机器人通常是大型系统
        - 多臂 Versius 用于泌尿肿瘤；可移动到任意手术室
        - 45 名患者可行性研究；RARP n=26；8.9% 转腹腔镜（观察性）
        - 未获美国许可；术后并发症率 28.9%；更大规模前瞻性数据待补
      - - 经口机器人手术（TORS——咽喉 / 头颈）
        - 开放咽切开术；口咽机器人选择有限
        - 4 臂 Versius（3 件器械 + 摄像头）；KCL 开展 IDEAL 2a 期评估
        - 完成 30 台手术（15 例良性、15 例癌症）；均未开放中转
        - 未获美国许可；器械体积和缺少单极铲限制采用
