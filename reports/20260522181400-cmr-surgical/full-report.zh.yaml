      - - 决策含义
        - 尽调
        - 争取数据室访问权；推进投资前，验证美国管线、股权结构和烧钱速度
    notes: 摘要综合了可获得的公开证据；收入、EBITDA 和股权结构均未披露，会实质影响置信度。
    claimRefs:
      - CV001
      - CV005
      - CV007
