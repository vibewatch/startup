          - type: callout
            title: 多轮仅内部融资且估值持平，释放外部谨慎信号
            body: >-
              CMR Surgical 自 2021 年 $3B Series D 以来已完成多轮融资，包括 2023 年仅由现有投资者参与的 $165M，以及 2025 年股权叠加 Trinity Capital 风险债的
              $200M 以上轮次。2025 年融资引入了 Companies House 押记 006-009
              所反映的资产支持义务，如果美国商业里程碑错过，将提高再融资敏感性。缺少公开估值上调或广泛新投资人财团，是外部谨慎的有意义信号。
            calloutType: risk
            claimRefs:
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
          - type: callout
            title: 未发现召回或器械不良报告——但证据基础仍早
            body: >-
              对 FDA MAUDE 和公开记录的检索没有发现涉及 CMR Surgical 或 Versius 的产品召回、MHRA 现场安全通知或执法行动。在商业化这一阶段，这是正面信号。但 Versius Plus 直到
              2025 年末才进入美国，手术量相较 da Vinci 数百万例历史手术仍然有限，因此没有不良事件应被解读为早期观察，而不是长期安全风险已被完全消除的证明。
            calloutType: insight
            claimRefs:
              - CR011
              - CR018
              - CR040
              - CR044
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与估值背景
        blocks:
          - type: paragraph
            body: >-
              CMR Surgical 最后一次确认的股权估值约 $3 billion，来自 2021 年 9 月 $600 million 的 Series D 融资，由 SoftBank Vision Fund 2
              和其他既有投资者共同领投。2023 年 £133 million 可转债票据完全由既有股东认购，转换条款未披露； Sifted 将该事件报道为相对 2021 年估值基本持平，公开信息也没有确认更高估值。2025
              年 4 月超过 $200 million 的融资轮混合了股权和债务： Trinity Capital 承诺提供 $68.75 million
              风险债，剩余股权部分由所有主要既有投资者支持——SoftBank、LightRock 和 Ally-Bridge——同样没有披露新的股权估值。 TechFundingNews 引用了「截至 2023 年 9
              月」$3 billion 估值，进一步说明最后估值仍是 2021 年数字，而不是 2023 年上调。TechFundingNews 估计累计融资约 $1.4 billion；Growjo 引用 $974.7
              million，这一数字可能口径更窄或已经过时，两者差异也凸显 CMR 股权结构历史不透明。据报道的收入——Growjo 估计年收入 $327
              million——没有任何经审计依据，只是模型推断。没有经过验证的财务数据，直接把 ISRG 可比收入倍数套到 CMR 身上，方法上站不住脚。当前估值最可信的公开信号来自 Financial Times
              报道，并由 MD+DI 和 MassDevice 引用：2025 年中，CMR 聘请顾问、寻求出售，目标价格最高 $4 billion。这个信号代表战略退出定价诉求，并非确认估值。
              因此，估值判断应表述为：最后确认估值为 $3 billion，可信的战略退出诉求为 $4 billion；如果美国商业化表现不及预期，下行风险显著。
