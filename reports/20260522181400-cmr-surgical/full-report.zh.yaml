  - id: FE002
    title: Versius Plus 操作流程：外科医生与手术室团队工作流
    type: flow
    layout: standard
    summary: |
      八阶段工作流从手术室设置走到术后数据复盘，展示模块化便携架构如何嵌入手术团队工作流。
    data:
      nodes:
        - id: setup
          label: 手术室准备
          detail: 将 Versius Plus 床旁单元推入任意手术室；无需专用手术室基础设施，即可围绕患者手术床配置。
        - id: positioning
          label: 床旁单元定位
          detail: 按具体术式三联方案定位可视化和器械单元（端口放置、机械臂配置、床旁单元摆位）。
        - id: port
          label: 端口放置
          detail: 外科医生使用偏好的腹腔镜端口位置；器械兼容 5mm 端口；布局灵活。
        - id: console
          label: 外科医生控制台启用
          detail: 外科医生在开放式控制台操作（坐 / 站）；3D HD HUD 启用；手部控制器接入；机械臂模式设为手术。
        - id: optional_nir
          label: vLimeLite NIR（可选）
          detail: 启用 ICG 荧光以显示胆道解剖结构；医院独立供应 ICG 染料。
        - id: procedure
          label: 手术操作
          detail: 外科医生通过 J9–J11 末端执行器控制腕式器械，完成抓取、切割、剥离、电外科和缝合。
        - id: telemetry
          label: 遥测数据采集
          detail: 控制台在整个手术过程中记录系统遥测数据；通过本地网络上传到 Versius Cloud。
        - id: data_review
          label: 术后数据复盘
          detail: 外科医生在 Versius Connect 日志中复盘病例；医院管理人员查看 Versius Team 效率仪表盘。
