        title: 展品
        blocks:
          - type: callout
            title: 点名 NHS 客户证据质量高且由医院独立发布
            body: >-
              四家英国 NHS 信托机构——Lister/East Herts、MFT、Liverpool/Aintree 和 Gloucestershire——已发布独立医院页面，确认 Versius
              用于生产环境或临床试验。NHS 信托机构受公开沟通要求约束，因此这些页面构成可信客户证据，而不只是 CMR 营销文案。患者结果引用、外科医生背书和机构培训承诺（START
              项目）组合在一起，形成了强于大多数私营外科机器人公司在这一阶段能够公开展示的参考基础。
            calloutType: strength
            claimRefs:
              - CU016
              - CU017
              - CU018
              - CU019
          - type: callout
            title: 关键留存和流失数据完全未披露
            body: >-
              CMR 不发布 NRR、GRR、流失率、平均合同期限或单个站点续约率。70%+ 多专科采用率和 60%+
              手术增长率是仅有可观察的客户持久性代理指标，且两者都由公司自行报告。若不能独立核验医院是否续约服务协议、继续购买器械或停用系统，投资者就无法区分真正留存和首轮购买惯性。2023 年末的 350 人重组和 2024
