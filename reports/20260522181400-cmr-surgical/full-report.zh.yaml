  - id: TP001
    title: 竞争对手概况表
    columns:
      - 竞争对手 / 系统
      - 类别
      - 规模 / 融资
      - 目标细分
      - 关键差异化
      - 商业化状态（截至 2026 年 5 月）
      - 相对 CMR 的主要限制
    rows:
      - - Intuitive Surgical / da Vinci Xi、X、SP、da Vinci 5 系统
        - 软组织在位者
        - 市值约 $174B；已安装系统 11,106 套（2025 年 12 月）
        - 多专科：泌尿、妇科、普外、胸外、结直肠
        - 产品组合最宽、装机基数最大、AI 数据护城河、认证生态
        - 美国及国际市场全面商业化；占主导的市场领导者
        - 结构性锁定、切换成本护城河、da Vinci 5 AI 功能拉大差距
      - - Medtronic / Hugo RAS
        - 直接软组织挑战者（大型医疗科技公司）
        - 市值约 $116B；全球服务基础设施
        - 泌尿、普外、妇科（路线图）
        - 模块化推车、开放控制台、Touch Surgery Enterprise 分析、企业级捆绑
        - 2025 年 12 月获 FDA 泌尿适应证批准；2021 年 CE 认证；国际市场已商业化
        - BTIG 分析师认为差异化仍不足；相对 Intuitive 的美国先发时间有限
      - - Johnson & Johnson / Ottava
        - 直接软组织挑战者（大型医疗科技公司）
        - 市值约 $579B（JNJ）；研发投入未披露
        - 多专科软组织（计划）
        - 与手术台集成的机械臂、twin motion、Ethicon 器械生态
        - 获批前；计划 2026 年 Q1 递交 de novo；尚无商业部署
        - 开发周期长、2023 年机器人业务裁员、上市日期未定
      - - CMR Surgical / Versius Plus
        - 直接软组织挑战者（独立公司）
        - 累计融资 $1B+；估值 $3B；已安装系统约 160 套（2023）
        - 普外、妇科、泌尿、结直肠；中端医院和 ASCs
        - 模块化便携机械臂、开放控制台、手术室占地小、成本竞争力
        - 2025 年 12 月获 510(k) 批准；2026 年美国商业化上市；国际覆盖 20+ 个市场
        - 美国装机基数相对 Intuitive 小；美国临床证据刚起步；近期更换 CEO
      - - Distalmotion / Dexter
        - 直接软组织挑战者（独立公司）
        - $150M Series G 轮（2025 年 11 月）；2022 年 CE 认证
        - 聚焦 ASC；胆囊、疝、妇科
        - 开放系统、兼容腹腔镜工具、适合 ASC 的占地
        - 2025 年 2 月完成美国首单；到 2025 年底获 3 项 FDA 批准
        - 阶段早于 CMR；装机基数很小；当前适应证狭窄
      - - J&J / Monarch（支气管镜）
        - 相邻细分（支气管镜）
        - J&J MedTech 规模；2019 年以 $3.4B 收购 Auris
        - 肺活检、支气管镜诊断
        - 机器人支气管镜、Quest AI（NVIDIA，算力提高 260%，2025 年 3 月）
        - 美国及国际市场已商业化；在肺科已建立装机基数
        - 相邻细分；与 CMR 腹部软组织适应证无重叠
      - - Moon Surgical / Maestro
        - 相邻协作式腹腔镜辅助
        - 融资未披露；早期商业化
        - 面向普外 / GI 外科医生的腹腔镜辅助
        - 协作机器人——增强而非替代腹腔镜配置
        - 美国早期商业化铺开；2025 年夏管理层扩充
        - 范围窄、资本有限、与 CMR 无正面适应证重叠
      - - MMI / Symani
        - 相邻细分（显微外科）
        - €110M Series C 轮；FDA 授权；CE 认证
        - 重建显微外科、淋巴水肿手术
        - 亚毫米精度，为显微外科和超显微外科过滤手颤
        - 美国和欧盟已商业化；在专科中心小众部署
        - 与 CMR 普外 / 妇科 / 泌尿适应证无重叠；市场小众
      - - Asensus / Senhance（KARL STORZ 子公司）
        - 直接软组织（老平台；现已被收购）
        - 2025 年被 KARL STORZ 收购；停止独立交易
        - 普外、妇科；学术 / 教学医院
        - 力反馈、眼动追踪摄像头、可重复使用器械、单例成本低
        - 已商业化，但重新定位为 KARL STORZ 产品；增长轨迹有限
        - 收购使其不再是独立融资挑战者；规模有限
      - - Avatera Medical
        - 直接软组织（欧洲小众）
        - 披露融资有限；德国公司
        - 欧洲软组织手术（泌尿、普外）
        - 德国工程能力，软组织机器人 CE 认证
        - 欧洲已商业化；规模和国际足迹有限
        - 规模很小、数据有限，对 CMR 不是实质性美国威胁
      - - 传统腹腔镜（现状）
        - 现状替代方案
        - 几乎零增量资本；全球已部署
        - 所有微创软组织适应证
        - 数十年临床证据、全球已培训外科医生、报销体系成熟
        - 全球全面商业化；微创手术（MIS）的默认标准治疗
        - 包括 CMR 在内，每个机器人平台的主要惯性竞争对手
    notes: >
      竞争对手概况来自截至 2026 年 5 月的公司官方来源、独立行业媒体和分析师摘要。规模 / 融资数字为近似值：Intuitive 和 Medtronic/J&J 是上市公司；CMR Surgical
      数字来自已披露新闻稿；Distalmotion 来自近期融资公告。本表有意省略定价数据；见定价 / 包装对比表。“商业化状态”反映监管授权和已知商业部署，不代表收入规模。
    enumerationScope:
      coverage: partial
      basis: >
        Covers the major soft-tissue robotic surgery and directly adjacent platform competitors as of May 2026, based on
        coverage in industry trade press, analyst summaries, and company official sources. Likely omits small
        prototype-stage entrants and regional OEM robots in developing markets.
