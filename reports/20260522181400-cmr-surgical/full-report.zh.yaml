  - id: TV003
    title: 可比估值表
    columns:
      - 可比对象
      - 类型
      - 关键指标
      - 倍数或估值
      - CMR 相关性
      - 局限
    rows:
      - - Intuitive Surgical (ISRG)
        - 上市公司，软组织机器人
        - 收入 $10.58B TTM；市值 $155.8B；经营利润率 30.9%
        - EV/Rev 约 14.3x；EV/EBITDA 约 38.3x（Q1 2026）
        - 直接产品类别可比；为成熟、盈利平台能达到的多年上限设参照
        - 25+ 年历史、9,000+ 装机量、$10B+ 收入；CMR 尚未披露收入且尚未盈利 —— 倍数不能直接套用
      - - Stryker Corporation (SYK)
        - 上市公司，多元化医疗科技和机器人
        - 收入 $25.3B TTM；市值 $120.2B；经营利润率 17.8%
        - EV/Rev 约 5.2x；EV/EBITDA 约 20.5x（Q1 2026）
        - 收购方语境：Stryker 是潜在战略买家，也是领先的机器人赋能医疗科技公司之一
        - Stryker 的 Mako 做骨科，不是软组织；EV/Rev 反映多元化组合，而非纯机器人溢价
      - - Stryker / MAKO Surgical 收购（2013）
        - 并购交易，机器人平台
        - 商业化规模前的骨科机器人平台；收购时收入有限
        - 交易确立了医疗科技 M&A 中机器人战略溢价的先例
        - 历史先例：说明战略买家会为差异化、已获监管许可且处于早期商业阶段的机器人平台支付显著溢价
        - 2013 年交易；骨科 vs. 软组织市场；此前牛市 M&A 环境；当前来源未确认确切条款
      - - DistalMotion / Moon Surgical（2023 年融资轮）
        - 私营，早期手术机器人
        - DistalMotion：$150M 融资（2023）；Moon Surgical：$55M 融资（2023）；两者均未获 FDA
        - 披露轮次规模隐含估值远低于 $1B
        - 方向性信号：即便在 FDA 前阶段，市场仍会给 ISRG 替代型手术机器人定价
        - 两家公司都远早于 CMR：FDA 前、规模化前、资本投入小得多；不能作为 $3B+ CMR 的有意义直接可比
      - - CMR 已投入资本重置成本
        - 融资额地板信号
        - 累计融资约 $1.4B（TechFundingNews 估计）；上次股权估值 $3B（2021）
        - $1.4B 资本地板；$3B 标记约为重置成本的 2.1x
        - 务实地板信号：买家若以低于约 $2B 收购，将使 2021 Series D 投资人受损 —— 这会约束任何谈判式战略退出的下行空间
        - 不是市场出清估值；清算优先权、债务优先级和分配瀑布将决定困境情景下的实际股权回收
    notes: 可比集反映截至 2026 年 5 月的公开证据；ISRG / SYK 倍数来自 Yahoo Finance Q1 2026；Mako 收购条款未从当前缓存来源确认 —— 仅作方向性引用。
    enumerationScope:
      coverage: partial
      basis: >-
        Public comparables, major medtech M&A robotics transactions, and private surgical-robotics rounds above $50M,
        2013-2026
