      - number: '1.3'
        title: 资本基础、投资者版图与债务状况
        blocks:
          - type: paragraph
            body: >-
              CMR Surgical 按 Sifted 引述的 Dealroom 数据，是全球累计股权融资最高的手术机器人初创公司。自 2014 年创立以来累计资本超过 $1 billion；TechFundingNews
              则在 2025 年融资后将总融资列为 $1.4 billion。融资史有三大节点：（1）2021 年 9 月由 SoftBank Vision Fund 2 和 Ally Bridge Group 领投的
              $600 million Series D，将 CMR 估值定在约 $3 billion——当时是欧洲机器人初创公司史上最大融资；（2）2023 年 9 月 20 日完成的 $165 million（£133
              million）可转换贷款票据，由所有主要现有投资者出资，未上调估值；（3）2025 年初超过 $200 million 的融资，结合现有投资者股权和美国资产管理公司 Trinity Capital
              的新债务投资；Sifted 称债务部分约 $68 million。

              2025 年融资被明确用于美国商业化和进一步产品开发。CMR 所有主要现有投资者均参与：SoftBank Vision Fund 2、Ally Bridge Group、Cambridge Innovation
              Capital、Escala Capital、LGT、Lightrock、RPMI Railpen、Tencent 和 Watrium。Trinity Capital 是公司融资堆栈中的首个外部债务方。债务工具在
              Companies House 有体现：Barclays Bank（2019 年 5 月设立）和 Grovemere Property（2022 年 2 月设立）的两项早期押记均于 2025 年 3
              月解除，新押记（088636570009）于 2025 年 5 月 13 日登记——时间点与融资完成后 Trinity Capital 担保权益相吻合。

              CMR 自 2023 年以来当前估值并未正式确认；最后披露数字是 2021 Series D 设定的 $3 billion，Sifted 确认 2023 年融资时未变化。2025 年新增超过 $200M
              资本——其中包含有意义的债务——但未伴随会产生独立估值标记的新股权轮。收入和运行率数字未公开。非执行主席 Daniel Moore 将 2025 年融资称为“对手术机器人未来、以及 CMR
              作为该领域领导者的地位投下强有力信任票”。
