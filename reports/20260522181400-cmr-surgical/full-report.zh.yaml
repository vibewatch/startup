      - number: '8.2'
        title: 可比公司与交易先例
        blocks:
          - type: paragraph
            body: >-
              从产品类别看，Intuitive Surgical（ISRG）是 CMR 最核心、也最有参考价值的上市可比公司，但套用其指标必须极其谨慎。ISRG 最近十二个月收入 $10.58 billion，企业价值约
              $151 billion，EV/Revenue 约 14.3x，EV/EBITDA 约 38.3x；这些指标背后是超过 25 年商业化运营、全球超过 9,000 台 da Vinci 系统装机、30%
              以上经营利润率和 23% 同比收入增长。CMR 尚未做到这些，也不能假设会做到。没有披露收入时，机械套用 ISRG 倍数只能得到无意义结果。 Stryker Corporation 可作为收购方姿态参考：公司以约
              5.2x EV/Revenue、20.5x EV/EBITDA 交易，收入 $25.3 billion；其 2013 年收购 MAKO Surgical 是医疗科技机器人平台 M&A 的标志性交易。MAKO
              被收购时尚未规模化，也未盈利；对一个已取得监管许可、但收入有限的平台型战略交易来说，MAKO 更像 CMR 的参照。 私营同业里，DistalMotion 2023 年融资 $150 million，Moon
              Surgical 同年融资 $55 million；两家公司融资规模都远小于 CMR，商业化阶段也更早，只能为手术机器人稀缺性溢价提供方向性信号。 从重置成本看，CMR 累计投入资本约 $1.4
              billion，构成务实底线：战略买家若以该数字或更低价格收购 CMR，意味着 2021 年以 $3 billion 估值参与的股权投资者需要承受损失； 除非财务压力逼迫交易，低于 $2 billion
              的退出结果很难获得投资者支持。
