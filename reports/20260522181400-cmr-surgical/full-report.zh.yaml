      - number: '4.5'
        title: 展品
        blocks:
          - type: callout
            title: 融资依赖从未中断，盈利能力从未披露
            body: >-
              CMR 在每个商业化阶段都需要一轮独立的大额融资：2021 年约 $600M 用于全球发布 Versius，2023 年约 $165M 用于在资本受限环境中维持铺开（同时裁员约 350 人），2025 年
              $200M+ 用于资助进入美国市场。公司从未披露或暗示已经实现经营现金流自给。Trinity Capital
              将其债务称为「成长资本」，进一步支持公司仍未收入转正的判断。连续每一轮融资都处于估值持平或估值未披露状态，限制了外部判断商业势能是否正在转化为股权价值创造的能力。
            calloutType: risk
            claimRefs:
              - CI042
              - CI043
              - CI020
              - CI021
          - type: callout
            title: 手术量曲线是当前最好的商业代理指标
            body: >-
              在没有任何收入披露的情况下，手术量曲线——August 2023 为 15,000+，April 2025 为 30,000+，March 2026 为
              45,000+——是公开可得的最强商业势能代理指标。手术量大约每 12–18 个月翻倍，且超过 70% 采用者把 Versius
              用于两个或更多专科，装机基础看起来确实在产生经常性的器械和服务收入。但如果没有每例器械定价、系统 ASP 或服务合同价值，这些手术量隐含的收入无法以有用精度量化。
            calloutType: insight
            claimRefs:
              - CI033
              - CI034
              - CI035
              - CI036
          - type: callout
            title: 收入模型结构来自行业类比，而非一手披露
            body: >-
              本章提出的四条收入流模型（资本设备、器械/耗材、服务/维护、数字生态）是根据 CMR 产品文档和 Intuitive Surgical da Vinci 的成熟模型推断得出；CMR
              将自己定位为可及型机器人细分中的后继者。CMR
              没有发布任何产品的收入确认政策、分部披露或价格表。任何使用该结构的财务建模，都应明确标注收入架构的推断性质，并把所有收入流层面的估计都视为等待一手披露验证的工作假设。
            calloutType: assumption
            claimRefs:
              - CI001
              - CI007
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 系统架构与核心设计
        blocks:
          - type: paragraph
            body: >
              Versius Plus Surgical System 是一套由软件控制的模块化机电式机器人辅助手术设备（RASD），FDA 按 21 CFR 878.4964 将其归为 Class II（产品代码
              SCV）。系统由外科医生控制台、一个可视化床旁单元、最多三个独立器械床旁单元、一组手术器械和无菌罩单组成。每个器械床旁单元都包含一条 11 关节机械臂（J1–J11）：J1–J8
              负责在手术室内定位并调整机械臂姿态，J9–J11 驱动带腕末端执行器，把外科医生手控器输入转化为精确器械动作。这一架构直接仿生人类手臂，提供灵巧性和运动范围；CMR
              声称，这让端口布置更灵活，也更贴合外科医生偏好的腹腔镜术式。


              外科医生控制台位于无菌区之外，是所有已连接床旁单元的中央电源和数据通信中枢。控制台高度可调，外科医生可坐可站；开放式控制台设计保留了与洗手护士和麻醉医生的视线沟通，CMR
              将其强调为关键人机工学差异点。平视显示器（HUD）提供实时 3D HD 内镜影像，并叠加器械图标和系统状态。控制台遥测数据会被记录；一旦接入本地网络，就会自动上传至 Versius
              Cloud，用于术后诊断和上市后监测。


              最核心的运营差异点，是每个床旁单元都能独立移动：每个器械和可视化单元都安装在自带制动机构的带轮手术推车上，手术室团队可以围绕病床配置机器人，不需要专用手术室或地面固定基础设施。这不同于需要专门手术套间的缆线连接、一体化吊臂系统。CMR
              声称，Versius Plus 可以在科室和手术类型之间顺畅移动，让医院和门诊手术中心在多个手术室之间共享一台机器人。
