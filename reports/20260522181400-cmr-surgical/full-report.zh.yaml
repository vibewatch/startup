      - CU036
  - id: FR001
    title: CMR Surgical 风险热力图：严重性 vs 可能性
    type: matrix
    layout: wide
    summary: 将主要风险类别映射到严重性和可能性；最右侧单元格给出每类风险的主导下行驱动。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 监管（美国适应症）
          values:
            - 批准延迟影响较小
            - 妇科被拒拖慢收入
            - 到 2026 仅靠胆囊切除术贡献收入
        - label: 临床证据
          values:
            - 证据足以支持获批
            - 小样本研究限制支付方采用
            - 相对腹腔镜的优越性仍未证实
        - label: 竞争
          values:
            - 市场扩张惠及所有玩家
            - Medtronic 和 J&J 抢占份额
            - Intuitive 在关键美国客户的锁定效应延续
        - label: 商业采用
          values:
            - 培训投入快速回本
            - 多专科 ROI 门槛拖慢爬坡
            - 报销不确定性阻碍采用
        - label: 资本 / 融资
          values:
            - 2025 轮融资足够支撑三年
            - 估值持平限制下一轮选择
            - 里程碑若延误，债务契约压力浮现
        - label: 法律 / IP / 运营
          values:
            - 未出现实质问题
            - IP 护城河未经验证，供应商风险延续
            - 领导层交接和站点集中度抬高风险敞口
        - label: 执行（美国上市）
          values:
            - 首年执行顺利
            - 培训和服务网络瓶颈出现
            - 团队缺口拖延医院合作
    approximationNotes: 可能性和严重性位置均为基于公开证据的专家判断；未获得内部管理层报告。
