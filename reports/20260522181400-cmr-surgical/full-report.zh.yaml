      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              软组织 RA-MIS 的结构性增长逻辑建立在多重相互强化的动态上。全球 MIS 采用仍在扩张——PMC 经济综述引用机器人手术量约 15 %
              的年增长——由人口老龄化和复杂多病共存、慢性病患病率上升，以及外科医生愿意把高量普外术式（胆囊切除、疝修补、子宫切除）迁移到机器人平台共同推动。外科医生人体工学是结构性需求驱动：传统腹腔镜在长时间手术中会造成重复性劳损和疲劳，而提供人体工学控制台的机器人平台可降低身体负担，厂家也把它作为延长职业寿命的工具。COVID-19
              期间暴露、USC Schaeffer Center 建模的医院容量和吞吐压力，推动更短住院和更快 OR 周转，MIS 与 RA-MIS 都能提供这些收益。NICE 早期价值评估（HTG742）有条件建议 NHS
              使用五种软组织机器人系统，并配套三年结构化证据生成计划，说明关键国际市场的监管路径正在成熟。

              约束同样重。资本强度仍是首要门槛：医院资本委员会必须批准每套 $1–2.5 M+，而这笔钱要与影像、药房和设施投资竞争。CMS
              报销同价（机器人术式没有溢价）拿掉了美国医院从腹腔镜切换或增加第二台机器人的财务激励。培训负担实质存在——外科医生使用新平台前必须完成认证项目，整个 OR 团队也要重新培训，形成转型成本；Ipsos
              估计这会阻碍许多机构采用。在位者切换成本很高：da Vinci
              装机基础深度嵌入，外科医生已获其认证，服务合同已经就位，术式量也围绕它优化。新进入者必须替换一个已验证系统，或说服买方增加第二台机器人。临床证据缺口仍在：2023 年一项覆盖 14
              类胸外和内脏术式的系统综述发现，数据不一致且不足，阻碍得出 RAS 优越性的结论，削弱了支付方接受溢价的论证。NICE 对软组织机器人的有条件（而非完全）批准也反映这种证据不确定。CMR
              初始美国适应症仅限胆囊切除术，进一步限制上市初期可触达手术量。
