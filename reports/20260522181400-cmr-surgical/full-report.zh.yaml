  - id: TV004
    title: 投资逻辑破裂与终止触发项
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 美国商业化表现不及预期
        - 上线后 12 个月美国医院合同少于 20 家或手术少于 500 例
        - 推翻主要乐观情景驱动；证明在当前价格下 ISRG 竞争护城河难以突破
        - 下调至继续研究；以显著更低估值重新评估入场
      - - 估值 $3B 或以下的稀释性下轮融资
        - Companies House SH01 文件或新闻稿确认新股融资估值低于 $3B
        - 确认 2021 Series D 投资人受损；显示商业进展不足以支撑现有估值
        - 立即重新评估；除非新资本附带大量认股权证或重置估值，否则大概率回避
      - - Trinity Capital 债务契约违约或加速到期
        - 债务押记执行或催款函通过 Companies House MR 系列文件公开披露
        - 释放财务困境信号；买家承接债务包袱，战略出售选项受限
        - 加快财务数据室请求；寻求债务条款的独立确认
      - - ISRG 拿下美国新增胆囊切除机器人手术多数份额
        - 已发布市场数据或 ISRG 财报显示，美国新增机器人胆囊切除术份额 >70%
        - CMR 在美国初始适应症上的差异化逻辑被削弱；美国可触达市场显著受限
        - 重新评估 CMR 现有现金跑道能否支撑多适应症路径
      - - 监管受挫：FDA 驳回妇科 510(k)
        - FDA 对 CMR 妇科 510(k) 申请作出非实质等同（NSE）决定
        - 乐观情景崩塌；除非重新提交，美国可触达市场将无限期局限于胆囊切除术
        - 重大负面信号；估值下修至悲观情景区间
      - - 公开出售流程后收购失败
        - FT / 媒体确认 CMR 出售流程在 12+ 个月后无交易结束
        - 释放无法实现 $4B+ 战略价格的信号；公司被迫走独立路径，资本需求不确定
        - 评估独立 IPO 或以更低修正估值再融私募轮的概率
    notes: 终止触发项基于公开证据和推断；并非所有触发项都能直接观察 —— 建议监测 Companies House 文件并持续跟踪媒体。
