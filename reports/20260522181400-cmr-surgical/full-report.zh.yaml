  - id: TV006
    title: 最终尽调要求
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入和单位经济
        - 披露收入运行率、毛利率、EBITDA 和单台系统经济性（资本销售 vs. 租赁 vs. 耗材拆分）
        - 验证任何收入倍数估值、评估相对剩余现金跑道的盈利路径，都需要这些数据
        - 管理层数据室；Companies House 年度账目（FY2024 应于 2026 年 9 月提交）
      - - 股权结构表和清算分配瀑布
        - 完整优先股堆叠、优先级排序、2023 年可转债转换条款，以及有效稀释后股数
        - 决定退出情景下普通股实现价值；优先股包袱会让 $3B 退出对后期投资人的价值低得多
        - 法务数据室；股东名册（Companies House）；投资人征询
      - - Trinity Capital 债务契约
        - 2025 年 3–4 月押记登记的完整条款（Companies House MR01 文件）；财务维持契约、加速触发项
        - 未披露契约可能限制战略出售，或要求退出时先偿债，从而降低净收益
        - Companies House 押记文件（MR01）；Trinity Capital IR；法律顾问审阅
      - - 美国医院管线和 LOI 数量
        - 截至 2026 年 Q2，处于 LOI、MOU 或积极谈判阶段的美国医院数量；手术爬坡计划；首例手术里程碑日期
        - 12 个月窗口内的主要价值驱动；决定乐观或基准情景是否可信
        - 管理层商业更新；会议展示（例如 SAGES、AAGL、SRS）
      - - 出售流程状态和顾问
        - M&A 顾问身份；是否已与任何战略买家签署有约束力的 NDA；FT 报道出售流程的当前状态
        - FT 报道尚未获 CMR 确认；如果流程仍在进行，入场条件和时间线对投资决定很关键
        - 管理层沟通；FT 后续报道；法律 / M&A 顾问网络
      - - FY2024 法定账目
        - 提交至 Companies House 的集团账目（AA 文件日期 2025 年 4 月 14 日）—— 内容需下载并审阅
        - 法定账目至少提供员工数趋势、合并资产负债表和审计师持续经营意见
        - Companies House 文件下载；Companies House 备案历史（AA 文件 2025 年 4 月 14 日）
    notes: 尽调要求按其对估值决定的重要性排序；第 1–3 项是任何投资承诺的阻断项。
