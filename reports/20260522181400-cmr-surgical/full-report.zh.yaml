      - number: '7.5'
        title: 展品
        blocks:
          - type: callout
            title: 美国适应证狭窄，造成手术收入集中
            body: >-
              截至 Q2 2026，Versius Plus 仅获 FDA 批准用于胆囊切除术。尽管妇科 510(k) 已在 April 2026 提交，任何否决或重大缺陷函都会让 CMR 的美国收入基础在 2027
              年很长一段时间里仍限于单一手术。胆囊切除术是有意义的手术类别，但 CMR 更广泛的利用率逻辑依赖多专科部署；在更多适应证获批前，这一点无法在美国发生。
            calloutType: risk
