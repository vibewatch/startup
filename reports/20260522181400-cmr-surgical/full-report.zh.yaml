  - id: TV005
    title: 乐观 / 基准 / 悲观情景分析
    columns:
      - 情景
      - 关键假设
      - 估值区间（USD）
      - 概率信号
      - 关键风险
    rows:
      - - 乐观
        - 美国爬坡超预期：18 个月内 50+ 家医院合同；妇科 510(k) 于 2026 年中获批；2027 年拿到第二个美国适应症；2+ 名战略买家竞价；到 2027 年末全球手术量超过 100k
        - $4.5B–$5.5B
        - 低–中（需要竞争性 M&A 动态和美国临床采用超预期）
        - 买家池可能有限；J&J / Medtronic 可能偏好自研机器人；ISRG 未必会买
      - - 基准
        - 2026 年末开始美国稳步采用；2026 年获妇科许可；到 2027 年全球手术约 80k；与单一战略买家谈判收购；$3B 标记保住并有小幅退出溢价
        - $3.0B–$3.5B
        - 中（与 FT 报道的出售兴趣、上次股权估值和当前手术量轨迹一致）
        - 出售流程拉长；单一买家压价；优先股堆叠压缩股权实现价值
      - - 悲观
        - 美国采用在前 12 个月明显不及预期；需要额外稀释性债务轮；战略兴趣限于拥有定价权的单一买家；全球手术量停滞在 50-60k；2026 年没有第二个美国适应症
        - $1.5B–$2.0B
        - 低–中（需要多重不利事件同时发生：美国失手、M&A 兴趣有限，以及负面财务事件）
        - 2021 Series D 投资人受损；英国政府避免外资出售的压力可能缩小买家池
    notes: 情景假设为定性判断；CMR 未披露收入，因此估值锚点不是收入倍数，而是战略可比、融资额地板和报道中的 $4B 目标要价。
