          label: 系统毛利率（未知）
          detail: Intuitive Surgical 的 da Vinci 系统毛利率在成熟规模下约为 65–70%；CMR 的毛利率未经验证，在当前销量下可能更低。
          tone: negative
        - id: instrument-contribution
          label: 每台手术器械收入（未披露）
          detail: 每台手术消耗一次性器械。按手术计费未知；医疗技术资本设备模式通常有高毛利经常性收入流。
          tone: positive
        - id: recurring-value
          label: 每台装机系统终身收入（估计）
          detail: 对使用率、器械定价和服务合同价值高度敏感。无法用公开数据量化。手术量增长（15k→30k→45k+）是正向领先指标。
          tone: neutral
        - id: financing-drag
          label: 资本融资拖累（Trinity 债务，最高 $68.75M）
          detail: Trinity Capital 成长资本授信带来利息义务和潜在契约约束，减少可用于运营的净资本，并抬高现金流盈亏平衡所需的最低规模。
          tone: negative
      edges:
        - from: system-asp
          to: hardware-cogs
          label: 扣除制造成本
        - from: system-asp
          to: gross-margin-system
          label: 系统毛利（剩余项；未披露）
        - from: instrument-contribution
          to: recurring-value
          label: 手术量乘数
        - from: gross-margin-system
          to: recurring-value
          label: 合计终身贡献
        - from: financing-drag
          to: recurring-value
          label: 压低每台部署系统净回报
    approximationNotes: 所有节点值要么未披露，要么来自行业类比估计。Intuitive Surgical da Vinci 基准只作为方向性比较；CMR 的实际利润率可能因销量更低、现场服务强度更高、制造规模更早期而显著不同。该图为定性图。
    claimRefs:
