  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与临床证据风险
        blocks:
          - type: paragraph
            body: >-
              CMR Surgical 最直接的风险，是即便终于获得 FDA 授权，美国监管版图仍然狭窄。原版 Versius Surgical System 在 October 2024 获得 De Novo 授权，但仅限
              22 岁及以上成人胆囊切除术；December 2025 Versius Plus 的 510(k) 仍维持同一单手术范围，而不是把平台拓宽为美国多专科业务。CMR 确实在 April 2026 提交了妇科
              510(k)，但截至报告日仍在等待，因此美国发布仍依赖一个良性软组织用例。De Novo
              决定摘要也明确写明，该系统用于癌症或癌症治疗的长期安全性和有效性尚未确立，这实质性限制了肿瘤扩张，也显示监管机构很可能要求逐适应证证据包。NICE 的态度支持但不是最终背书：HTG742 是 Early
              Value Assessment，给出有条件推荐，并要求三年证据生成，不是永久 NHS 背书。临床成熟度同样仍早。2022 年 Versius 系统综述只覆盖 328 名患者，2025 年结直肠综述则找到 9
              项多为观察性、单中心的研究，共 561 例手术。没有识别到对传统腹腔镜的随机优效性试验，和 da Vinci 更庞大证据基础之间的比较缺口仍然很大。FDA MAUDE
              检索没有发现实质性公开不良事件报告，这是正面信号；但在这么早的阶段，没有信号应谨慎解读，不能当作长期安全风险已被消除的证明。
