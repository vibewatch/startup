      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 战略稀缺性溢价
            body: >-
              CMR Surgical 在全球手术机器人领域占据极其稀缺的位置：它是唯一同时拥有 FDA 许可，并已在 30 多个国家证明商业化足迹的非 ISRG
              软组织手术机器人。这一组合——监管门槛已跨过、全球规模已跑出、临床验证正在推进——极难复制，也极耗资本。 任何希望进入美国软组织机器人市场、又不想从零搭建的战略收购方，很可能把 CMR
              视为近期唯一可获得资产，从而在出售流程中推高有意义的竞争溢价。
            calloutType: strength
            claimRefs:
              - CV015
              - CV016
              - CV031
              - CV039
              - CV041
          - type: callout
            title: 估值不透明与过时估值
            body: >-
              截至本次报告日期，CMR 最后一次确认的 $3 billion 股权估值已有四年多，且形成于风险投资市场高点。2023 年可转债和 2025 年 4 月债股混合融资都没有产生新的股权估值。 CMR
              的财务数据——收入、毛利率、烧钱速度——完全未披露，公开资料无法独立验证估值。Growjo 估算的 $327 million 年收入没有经审计依据。任何基于 $3 billion 估值或未经确认的 $4
              billion 要价作出的投资决定，都承担重大估值不确定性。
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV035
              - CV036
              - CV038
          - type: callout
            title: 出售流程信号：退出可选性与独立发展风险
            body: >-
              Financial Times 报道——由 MD+DI 和 MassDevice 引用——称 CMR 在获得 FDA 许可不到八个月、完成 $200M 融资两个月后聘请顾问，并以最高 $4 billion
              寻求出售，这是一个重要的双重信号。积极面是，管理层相信监管里程碑已让 CMR 成为可货币化的战略资产；风险面是，独立增长路径可能需要的资本超过当前 $200M
              注资可支撑的范围，董事会也可能更偏好战略退出，而不是摊薄性 IPO 或后续私募轮。CMR 未确认出售流程，也无法保证交易发生；但「融资、取得 FDA
              许可、随后寻求战略退出」这一模式，符合资本密集型医疗科技平台走向流动性事件的成熟路径。
            calloutType: insight
