      - number: '6.4'
        title: 证据限制、留存与集中度风险
        blocks:
          - type: paragraph
            body: >-
              CMR Surgical 对客户经济性的公开披露很少。NRR、GRR、流失率、合同续约率或平均合同价值均未披露。多专科扩展率（70%+ 医院使用 2+
              个专科）是公开可得、最接近平台粘性的代理指标，但它衡量的是使用广度，而非商业关系的持久性。Versius 临床注册系统捕捉持续手术数据，暗示客户仍在参与，但注册范围和参与率没有被刻画。

              手术里程碑均为自行报告，未经独立审计。从 15,000 例手术（Sep 2023）到 45,000 名患者（Mar 2026）——横跨约 30 个月——意味着后期大约每月新增 1,000 例手术；若以 140+
              套装机基数估算，相当于每台系统平均每月约 7 例手术。但 CMR 没有披露单系统利用率，因此这一估算只能视为粗略三角测算。

              反向证据集中在两个信号。第一，CMR 在 2023 年末裁员约 350 人——Sifted 和 Reuters 报道的一次重大重组——这让人质疑公司在手术量增长最快阶段的商业交付能力。第二，2024 年末的
              CEO 更替（Supratim Bose 离任，Massimiliano Colella 接任）恰好发生在 FDA
              批准节点，给最高风险的商业化时刻引入领导连续性风险。两件事都没有被证实对客户交付造成实质损害，但它们都是客户对 CMR 长期服务信心的未解风险。

              集中度风险显著：NHS 构成 CMR 最可见、记录最充分的客户基础，而 NHS 采购受预算压力、集中采购权和政策变化影响。若 NHS 外科机器人支出受限，过度依赖活跃发声的 NHS
              参考客户可能变成脆弱点。2026 年以单一胆囊切除术适应证进入美国市场，预计会分散这种集中度，但尚未确认任何美国收入贡献。CMR
              对公司新闻稿来证明国际客户的依赖，以及缺少独立点名客户注册表，都是潜在投资者和合作伙伴应注意的结构性披露限制。
