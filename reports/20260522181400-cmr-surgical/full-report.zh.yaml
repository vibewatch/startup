  - id: TM001
    title: 市场边界与定义
    columns:
      - 类别
      - 纳入支出
      - 排除支出
      - 主要买方 / 付款方
      - CMR 相关性
    rows:
      - - 软组织 RA-MIS 资本设备
        - 机器人系统购买 / 租赁（普外科、妇科、泌尿科、胸外科）
        - 骨科机器人（骨铣削、关节置换）
        - 医院资本委员会 / CFO
        - 核心——Versius 在这里直接竞争
      - - 器械与配件
        - 单台手术一次性器械、铺巾、套管针
        - 骨科植入物和切割导板
        - 医院运营预算 / 采购
        - 核心——CMR 的高毛利经常性收入
      - - 服务与培训合同
        - 年度服务、远程监测、数字数据订阅
        - 非机器人腹腔镜服务
        - 医院高管层 / 采购
        - 核心——Versius Connect / Versius Team 生态
      - - 柔性机器人支气管镜
        - 肺部诊断平台（Auris/J&J Monarch）
        - 不适用
        - 呼吸科 / 介入放射科
        - 相邻——不同适应症，不与 Versius 竞争
      - - 骨科机器人
        - Stryker Mako、Zimmer ROSA、Smith+Nephew CORI 等骨科机器人
        - 不适用
        - 骨科手术科室 / 资本委员会
        - 相邻——不同临床流程和买方；注意单独的 NICE 指南（HTG743）
      - - 现状替代方案（腹腔镜）
        - 传统腹腔镜设备；成熟、成本更低
        - 不适用
        - 外科医生 / 医院采购
        - 竞争基线——CMR 必须证明相对腹腔镜的净价值
      - - 前列腺切除术（da Vinci 已确立优势）
        - 现有 da Vinci 机器人前列腺切除项目
        - 不适用
        - 泌尿外科
        - 相邻——NHS 既有实践，位于 NICE HTG742 软组织范围之外
    notes: >-
      分类依据 NICE HTG742/HTG743 范围定义、Ipsos 2023 市场研究和 MarketsandMarkets 2025 细分口径整理。“排除支出”指 Versius
      获批适应证或直接竞争集合之外的项目。骨科单列，因为分析师常把骨科计入全球手术机器人 TAM。
