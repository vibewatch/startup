      - number: '7.2'
        title: 商业采用与竞争风险
        blocks:
          - type: paragraph
            body: >-
              商业扩张风险很高，因为 CMR
              必须同时创造需求、培训外科医生并证明经济性。机器人手术采用不只是卖一台设备：医院需要获得资质的外科医生、有人督导的首批病例、手术室流程适配，以及跨专科足够的手术量，才能让资本采购取得可接受回报。公开报道把
              Versius 系统成本放在约 £1 million 至 £1.5 million，而 CMR
              自己也认为，多专科部署才让利用率具备吸引力。这在美国形成明显张力：初始标签仅限胆囊切除术，付款方报销仍按手术路径走，而不是机器人专属报销。培训端，NHS Shelford START
              项目显示资质认证负担很重：试点年度 50 多名学员、多平台接触、模拟训练、湿实验室工作和受监督临床推进。这个结构有助于建立合法性，但不会为 CMR 创造锁定效应，因为同一项目也覆盖 da Vinci 和
              Hugo。因此，竞争是采用问题的另一半。Intuitive 已放置 8,000 多套系统，完成超过 14 million 例手术；Versius 到 March 2026 才达到 45,000
              多名患者。Medtronic 的 Hugo 已进入美国许可讨论，Johnson & Johnson 继续推进 Ottava，da Vinci 5 则提高了 CMR 必须回应的性能标杆。NICE
              的有条件推荐也覆盖多套系统，因此英国准入不能被包装成 CMR 独有差异点。结果是，结构性商业速度会慢于单看患者数字标题所暗示的水平。
