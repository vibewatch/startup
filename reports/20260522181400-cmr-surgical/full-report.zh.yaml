          values:
            - 30
            - 60
            - 70
    approximationNotes: >-
      CMR 未披露逐队列留存数据。第 1 行代表估计的 NHS/英国医院队列；第 2 行代表国际医院队列。第 1 年数值反映初始单专科爬坡（首年使用 2+ 个专科的比例）。第 2 年和第 3+
      年数值由已披露的汇总里程碑外推：>75%（20k 例里程碑，~2022）和 >70%（30k 例里程碑，Feb 2025）。本图仅作示意；不要用于定量建模。
    claimRefs:
      - CU013
