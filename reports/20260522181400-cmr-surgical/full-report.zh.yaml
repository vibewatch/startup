      - number: '8.3'
        title: 情景分析：乐观、基准与悲观
        blocks:
          - type: paragraph
            body: >-
              CMR 的估值区间可由三种情景框定，差异来自美国商业化爬坡速度、额外适应症获批、战略买家竞争强度和全球手术量走势。乐观情景假设美国商业化明显超过基准预期：18 个月内签下 50 家以上医院合同，妇科 510(k)
              在 2026 年中获批，2027 年取得第二个美国适应症，并且至少两家大型战略收购方在出售流程中竞争——对应 $4.5 billion 至 $5.5 billion 退出区间。关键驱动包括：CMR 是唯一非
              ISRG、已获 FDA 批准的软组织机器人，因此享有稀缺性溢价；报道中的出售流程也显示战略兴趣真实存在。基准情景假设美国采用从 2026 年底开始稳步但温和增长，全球手术量到 2027 年超过 80,000
              台，并以 $3.0–3.5 billion 区间完成谈判式战略收购——与最后股权估值一致，并在 2021 年水平上给予温和控制权和战略溢价。考虑到截至 2026 年 3 月已达到 45,000
              台以上手术里程碑，且 FDA 批准已经确认，该情景合理。悲观情景假设美国商业化启动后的前 12 个月明显不及预期： 医院采购周期拉长，ISRG 的 da Vinci 5
              抢走增量美国订单，公司需要进一步进行摊薄性融资（考虑契约风险，可能以债务为主），战略收购市场只剩一个拥有定价权的买家——退出区间降至 $1.5–2.0 billion，这将使 2021 年 Series D
              投资者遭受重大减值。概率权重带有主观性；现有证据，尤其是手术量在约 11 个月里从 30k 增至 45k、增长 50%，更偏向基准情景。但截至本次报告日期，美国执行仍是最重要的未决变量。
