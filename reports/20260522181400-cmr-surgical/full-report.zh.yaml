      - number: '3.5'
        title: 展项
        blocks:
          - type: callout
            title: Intuitive 的 da Vinci 5 抬高竞争门槛
            body: >
              da Vinci 5 的 10,000× 计算能力提升、AI 驱动手术洞察、力反馈器械和 2025 年上线的实时分析，大幅拉大了每个挑战者——包括 CMR Versius
              Plus——现在必须追赶的功能差距。CMR 2026 年美国启动面对的是一个同时强化数据护城河、升级临床性能天花板的在位者。
            calloutType: risk
            claimRefs:
              - CP005
              - CP006
          - type: callout
            title: 现状替代是腹腔镜，不是另一台机器人
            body: >
              在先进医疗系统中，符合条件的术式只有约 40% 使用微创技术；因此，任何机器人平台——包括 CMR——的主导替代方案都是继续使用腹腔镜，而不是竞品机器人。行业内每个竞争者都面对这种共同惯性；一阶销售挑战是把开放
              / 腹腔镜术式转成机器人术式，而不是从其他机器人供应商手中抢份额。
            calloutType: insight
            claimRefs:
              - CP031
              - CP032
          - type: callout
            title: 企业级分销护城河偏向 Medtronic 和 J&J
            body: >
              Medtronic 和 J&J 已与多数大型 IDNs 拥有捆绑合同、多产品供应关系和全球服务组织。CMR 无法把 Versius 与更广设备组合捆绑，意味着每次销售对话都以独立产品身份切入。随着
              Medtronic 扩大美国 Hugo 部署、J&J 准备 Ottava，这一结构性劣势会继续叠加。
            calloutType: risk
            claimRefs:
              - CP036
              - CP040
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价机制
        blocks:
          - type: paragraph
            body: >-
              CMR Surgical 采用手术机器人行业典型的资本硬件 + 经常性收入模式。医院和日间手术中心（ASCs）采购 Versius 或 Versius Plus
              系统，产生初始资本设备交易；随后每台手术消耗一次性器械和耗材，形成持续经常性收入流。服务和维护合同构成第三层收入；新推出的数字生态——Versius Connect（外科医生手术日志）和 Versius
              Team（医院分析看板）——引入可能与软件和数据挂钩的第四层。这套四流架构类似 Intuitive Surgical 的 da Vinci 模式，CMR 明确将自己定位为更易获得的替代；该判断来自 CMR
              产品资料和行业类比，而非 CMR 官方收入组合披露。公司从未发布分部拆分或收入确认政策。


              Versius 系统唯一公开定价信号来自 Sifted 2023 年报道：“其 2019 年发布的旗舰产品 Versius，医院采购成本在 £1m–1.5m 之间。”这是原版 Versius 的标价参考，不是
              Versius Plus，也不代表实际成交价；后者可能因地理、医疗体系、量承诺或合同结构（销售、租赁或按手术付费）而变化。截至 runDate，CMR 美国网站没有 Versius 或 Versius Plus
              定价页；每台手术器械和耗材价格完全未披露；服务合同条款和期限未公开；实际 ASP 数据也未披露。多年捆绑安排的收入确认处理无法验证。


              数字生态（Versius Connect、Versius Team）随 Versius Plus 推出，可能收取订阅或按席位费用，但公司未发布任何定价或商业化细节。CMR CEO
              提到的使命是“向全球医疗健康共同体交付可持续增长和改变生命的解决方案”，但没有量化收入或财务目标。CFO André Nel 曾因设计 2025 年融资结构获得公开署名，但未披露收入数字。
