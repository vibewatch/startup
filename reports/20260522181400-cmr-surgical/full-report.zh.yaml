  - id: FE001
    title: Versius Plus 系统架构：分层硬件与软件栈
    type: stack
    layout: standard
    summary: |
      五层架构从底层手术器械开始，向上经过床旁单元、外科医生控制台和数字生态，最终到达云端数据和上市后监测。
    data:
      layers:
        - label: 数字与云层
          modules:
            - Versius Cloud（遥测上传；上市后监测）
            - Versius Connect（外科医生近实时手术日志应用）
            - Versius Team（医院实时使用与效率仪表盘）
            - 术后诊断与 PMS 管线
        - label: 外科医生控制台
          modules:
            - 3D HD 平视显示器（HUD），带器械叠加层
            - 手部控制器（左 + 右；拇指摇杆、离合、电外科）
            - 可调高度开放式控制台（可坐可站）
            - 所有床旁单元的电源与数据通信枢纽
        - label: 可视化床旁单元
          modules:
            - 3D 内窥镜摄像头（2D/3D 可切换）
            - vLimeLite NIR/ICG 荧光成像模块
            - EIZO CuratOR 外部手术室显示器（美国生态）
        - label: 器械床旁单元（×1–3，独立）
          modules:
            - 11 关节机械臂（J1–J8 定位；J9–J11 末端执行器）
            - V-Wrist 腕式末端执行器
            - 带制动机构的独立轮式推车
            - 手臂模式：手术、顺应、睡眠、锁定
        - label: 器械与无菌接口
          modules:
            - 腕式电外科器械（钩、钳、剪）
            - 非电外科器械（持针器、钳、剥离器）
            - 兼容 5mm 端口的设计
            - 无菌铺巾（每个床旁单元）
