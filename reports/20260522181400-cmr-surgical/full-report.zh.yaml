      - number: '3.2'
        title: 现任龙头、直接挑战者与相邻系统
        blocks:
          - type: paragraph
            body: >
              Intuitive Surgical 的 da Vinci 平台拥有 25 年临床证据、专有器械耗材、覆盖全球外科学院的培训和认证基础设施，以及实时手术数据生态。da Vinci 5 于 2025 年 7
              月开始获得 CE Mark，板载计算能力较上一代约高 10,000×，支持 AI 驱动功能，包括 2025 年 9 月推出的实时手术洞察软件和力反馈器械。Intuitive 预计 2026 年手术量增长
              13–15%。这种下一代护城河扩张，叠加了 CMR 和所有其他挑战者必须跨越的切换成本障碍。


              Medtronic Hugo 于 2025 年 12 月获得美国 FDA 泌尿术式许可（前列腺切除、肾切除、膀胱切除），完成 Expand URO
              试验——外界称其为美国有史以来规模最大的多端口机器人辅助泌尿外科手术研究。Hugo 自 2021 年起拥有 CE Mark，国际手术量同比翻倍。系统集成 Touch Surgery Enterprise
              云分析。不过，评估 Hugo 的 BTIG 分析师写道，他们认为它与现有选项“差异不足”，难以推动美国快速采用；这凸显所有软组织挑战者的关键风险：相较 Intuitive，临床和流程差异很难有说服力地证明。


              Johnson & Johnson 的 Ottava 仍是最重要的商业化前进入者。J&J 计划在 2026 年 Q1 提交 De Novo 申请；商业发布节奏未定义。Ottava
              将四条机器人臂集成进标准手术台，采用“twin motion”架构，使手术台和机械臂无需中断手术即可重新定位。J&J 的 MedTech 规模、Ethicon 器械业务和既有 OR
              关系，使其一旦商业化执行到位，就会成为严肃长期威胁。值得注意的是，J&J 机器人部门 2023 年裁员，带来执行不确定性。


              CMR Versius Plus 于 2025 年 12 月获得 510(k) 许可（建立在原版 Versius 2024 年 10 月 De Novo 许可之上），并瞄准 2026 年美国商业扩张。截至
              2026 年 3 月 SAGES，CMR 宣布全球已治疗 45,000 名患者，将 Versius 定位为“全球使用第二广的机器人手术平台”。CMR 装机基础在 2023 年增长 50%，约达 160
              套，年手术量增长 60%，约 17,000 例。CMR 累计融资超过 $1 billion，最近一轮是 2025 年由 SoftBank、LightRock 和 Ally-Bridge 支持的 $200M+
              融资。


              Distalmotion Dexter 于 2024 年 10 月获得腹股沟疝修补 FDA De Novo 许可，随后在 2025 年获得胆囊切除和子宫切除 / 妇科 510(k) 许可。这家瑞士公司于 2025
              年 11 月完成 $150M Series G 融资，瞄准日间手术中心（ASCs），认为该场景中现任机器人覆盖最弱。Dexter 是开放系统设计，可兼容第三方影像、能量和血管封闭设备。美国首单于 2025 年 2
              月在 Houston 的 Memorial Hermann Health System 完成。截至该里程碑，欧洲已完成约 1,500 例病例。


              相邻小众系统包括 J&J 的 Monarch 机器人支气管镜平台，其 Quest AI 软件（借助 NVIDIA 获得 260% 更多计算）于 2025 年 3 月获 FDA 许可；MMI
              Symani，专为显微手术和超显微手术打造，拥有 FDA 授权和 CE Mark；Moon Surgical 的 Maestro，协作式腹腔镜辅助系统；以及 Avatera，一款拥有 CE Mark
              但规模有限的德国软组织机器人。Asensus Surgical（Senhance）于 2025 年被 KARL STORZ 收购，不再是独立竞争者。这些相邻系统都不在 CMR 目标普外 / 妇科 /
              泌尿软组织适应症中直接竞争，但它们争夺同一轮资本预算周期。
