      - number: '2.3'
        title: 购买方、使用者与支付方分层
        blocks:
          - type: paragraph
            body: >-
              机器人手术采用涉及多利益方决策链，使用者、购买者、支付者之间差异明显。外科医生是主要临床推动者：他们评估人体工学、培训负担、灵巧度和特定术式结果。没有外科推动者，资本委员会不会批准新系统。不过，外科医生并不掌握采购预算——权力在医院
              C-suite、资本委员会和 CFO 手中，他们会把利用率预测、单台手术经济性和总拥有成本，与其他资本用途相比较。

              OR 主管和服务线负责人（如普外、妇科、泌尿外科）是整合和流程守门人；他们管理排班、人员配置和手术室周转，而新系统上线会扰动所有这些环节。采购部门评估供应商条款、服务合同和耗材定价。Ipsos 2023
              年研究发现，高管级采购者、财务人员和管理人员才是机器人采购的实际决策者，经济性和报销障碍造成了当前拥有机器人与没有机器人的分化。

              日间手术中心（ASCs）是新兴买方分层：按 Ipsos 说法，这一群体代表未开发潜力，但资本约束更紧，且报销结构不同于医院门诊部门。CMS
              目前不为机器人辅助相较传统术式提供增量报销，意味着经济论证必须依靠效率和吞吐量提升，而不是更高账单费率。患者是下游受益者——他们需要微创选项和更短恢复时间——但不是资本设备的直接支付方，在采购决策中杠杆有限。
            claimRefs:
