  - id: FV001
    title: 推荐逻辑链
    type: flow
    layout: wide
    summary: 追踪从 CMR 的市场位置、临床验证、竞争护城河、财务不透明和估值信号，到观察建议的逻辑路径。
    data:
      nodes:
        - id: market
          label: 市场顺风
          detail: 2024 年手术机器人市场 $8–14B，CAGR 14–17%；全球 MIS 仅约 40% 使用机器人——增长空间显著。
          tone: positive
        - id: proof
          label: 临床验证与牵引力
          detail: 全球 45k+ 例手术（March 2026）；从 April 2025 的 30k 例到 11 个月后的 45k 例；全球采用量第二大的软组织机器人；FDA 已批准。
          tone: positive
        - id: moat
          label: 战略稀缺性与护城河
          detail: 唯一同时拥有 CE 标志和 FDA 批准的非 ISRG 软组织机器人；模块化、可移动设计，与 da Vinci 固定控制台架构形成差异。
          tone: positive
        - id: risk
          label: 执行与财务风险
          detail: 收入未披露；美国上市切入 ISRG 本土市场，初始适应症狭窄；已投入 $1.4B+ 资本；Trinity 债务契约未知。
          tone: negative
        - id: valuation
          label: 估值背景
          detail: 上一轮股权标记 $3B（2021）；2023 或 2025 轮未确认上调；FT 报道的 $4B 要价仅属愿景；估值立场 = 偏高。
          tone: warning
        - id: recommendation
          label: 观察——中等信心，高风险
          detail: 继续尽调；投入资本前验证美国管线、股权结构表和烧钱速度。战略逻辑强，但重大不确定性尚未解决。
          tone: neutral
      edges:
        - from: market
          to: recommendation
        - from: proof
          to: recommendation
        - from: moat
          to: recommendation
        - from: risk
          to: valuation
        - from: valuation
          to: recommendation
    approximationNotes: null
    claimRefs:
      - CV001
      - CV008
      - CV013
      - CV024
      - CV035
  - id: FV002
    title: 按参照点划分的估值敏感性
    type: bar
    layout: standard
    summary: 比较关键估值锚点：上一轮已确认股权标记、报道要价、累计融资底部、ISRG 隐含值（推测）和悲观退出。
    data:
      items:
        - label: 累计融资底部（~$1.4B 已融资）
          value: 1400
        - label: 悲观情景退出区间中点
          value: 1750
        - label: 上一轮已确认股权标记（2021 D 轮）
          value: 3000
        - label: FT 报道收购要价（最高）
          value: 4000
        - label: 乐观情景战略收购区间中点
          value: 5000
    approximationNotes: >-
      所有数值单位均为百万美元。累计融资底部来自 TechFundingNews（$1.4B）。上一轮股权标记来自 2021 D 轮（Sifted/TechFundingNews）。FT 报道要价来自
      MD+DI/MassDevice。乐观情景中点仅为情景估计；未使用收入倍数。
    claimRefs:
