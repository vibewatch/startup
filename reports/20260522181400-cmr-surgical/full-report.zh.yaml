      - number: '1.4'
        title: 规模、监管节点与不利事件
        blocks:
          - type: paragraph
            body: >-
              CMR Surgical 的手术量增长很快：从 2021 年约 1,000 例，到 2023 年初 10,000 例、2023 年 9 月 15,000+ 例、2024 年 10 月 26,000+ 例、2025
              年初融资时 30,000+ 例、2025 年 2 月 36,000+ 例、2025 年 12 月美国以外 40,000+ 例，再到 2026 年 3 月 26 日全球 45,000+ 例。公司现在称
              Versius 是继 Intuitive Surgical 的 da Vinci 之后，全球使用量第二高的软组织手术机器人系统。超过 70% 的采用医院在两个或更多专科使用该系统。

              关键监管节点包括：欧洲 CE Mark 批准（2019 年初）；提交 De Novo 申请（2023 年 11 月 21 日，DEN230078）；获得 FDA De Novo 上市授权（2024 年 10
              月，创建新的 Class II 设备类别 21 CFR 878.4964、产品代码 SCV，使 Versius 成为首个取得 De Novo 状态的多端口软组织 RASD）；提交 Versius Plus 的
              FDA 510(k)（2025 年 7 月 7 日，K252111）；Versius Plus 获得 FDA 510(k) 许可（2025 年 12 月 16 日）。第二项良性妇科适应症 510(k) 已于
              2026 年 4 月 29 日提交，目前仍待审评。CMR 还在开展首个同类儿童外科试验和经口机器人手术（TORS）试验。公司于 2026 年 3 月 26 日在 Tampa 举行的 SAGES 2026
              Annual Meeting 上宣布美国商业化启动，以伙伴优先模式瞄准医院和日间手术中心（ASCs）。

              记录中的主要不利事件是 2023 年裁员。Cambridge Independent 报道称，多达 350 名员工被裁——约占员工总数三分之一。CMR 确认进行了再平衡，但未披露人数。Sifted 引用的
              LinkedIn 数据显示，员工数在 2023 年 6 月至 9 月从约 861 降至 762。公司将该行动描述为面向区域商业市场的重组。截至 2026 年运行日期，当前员工数未公开，仍是未解尽调缺口。
