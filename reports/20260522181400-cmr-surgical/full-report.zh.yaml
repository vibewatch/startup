  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: 截至 2026 年中，CMR Surgical 的身份、产品、客户、资本和关键依赖如何连接。
    data:
      nodes:
        - id: cmr
          label: CMR Surgical
          detail: 英国私营手术机器人公司；2014 年创立；现任 CEO 拥有 30+ 年医疗健康领导经验。
          tone: neutral
        - id: product
          label: Versius / Versius Plus
          detail: 紧凑、模块化、多端口软组织手术机器人；CE 认证（2019）；FDA 许可（2024 / 2025）。
          tone: positive
        - id: customers
          label: 医院和 ASC 客户
          detail: 30+ 个国家；45,000+ 例手术；70%+ 采用者在 2+ 个专科使用 Versius。
          tone: positive
        - id: capital
          label: 资本结构（累计融资 >$1B）
          detail: SoftBank、Ally Bridge、CIC、LGT、Lightrock、Tencent、RPMI、Escala、Watrium（股权）；Trinity Capital（约 $68M 债务）。
          tone: positive
        - id: regulatory
          label: 监管授权
          detail: FDA De Novo（Oct 2024）+ 510(k) Versius Plus（Dec 2025）+ GYN 510(k) 待批；欧洲 CE Mark。
          tone: positive
