chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与阶段
        blocks:
          - type: paragraph
            body: >-
              CMR Surgical Limited（Companies House 编号 08863657）2014 年 1 月 27 日在英格兰 Cambridge 注册成立，原名 Cambridge Medical
              Robotics Limited。公司于 2018 年 2 月 26 日更名为 CMR Surgical Limited。注册办公室位于 1 Evolution Business Park, Milton
              Road, Cambridge, CB24 9NG——与 FDA De Novo 提交地址使用同一邮编，说明该地点的运营连续性。CMR 在 Companies House 的主要 SIC 代码为
              32500（医疗和牙科器械及用品制造）和 72190（自然科学与工程其他研发），呈现出商业制造商和持续技术开发者的双重身份。

              公司的使命是让微创手术（MAS）普遍可及。核心商业产品是 Versius Surgical Robotic System——一款紧凑、模块化、多端口、推车式机器人辅助手术设备，面向软组织微创手术。Versius
              仿生人类手臂，配备全腕式器械、3D HD 视觉、灵活端口布局，以及开放式外科医生控制台，旨在减轻疲劳并便利与手术室团队沟通。每条机器人臂都是独立单元，可围绕患者重新定位，也可在手术室之间移动，无需专用
              OR；公司将其定位为相较固定平台系统的关键差异点。

              第二代 Versius Plus 新增 vLimeLite 荧光可视化（实时 ICG 成像）、增强型能量器械，以及由两个专用应用组成的数字生态：Versius Connect（近实时外科医生手术日志）和
              Versius Team（医院使用量与病例量实时看板）。原版 Versius 和 Versius Plus 在美国的适应症均为符合胆囊切除术软组织微创手术条件且年满 22 岁的成人。截至 2026 年末，CMR
              是一家后期私营公司，正在从国际增长转向进入美国市场——全球最大的手术机器人市场。
