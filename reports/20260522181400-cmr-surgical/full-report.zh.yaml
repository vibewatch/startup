  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              软组织手术机器人赛道在 2025-2026 年进入历史上竞争最激烈阶段。Intuitive Surgical 继续凭 da Vinci 平台占据主导，但一批资本充足的挑战者——Medtronic、Johnson
              & Johnson、CMR Surgical 和 Distalmotion——各自取得了有意义的监管或商业里程碑。Medtronic 于 2025 年末进入美国市场后，MassDevice
              将格局描述为“比赛真正开始了”，并预计全球机器人手术收入到 2029 年将超过 $22.2 billion。


              围绕 CMR 的竞争者分四类。第一，直接软组织挑战者，瞄准同样的普外、泌尿、妇科和结直肠适应症：Medtronic Hugo、J&J Ottava 和 Distalmotion
              Dexter。第二，现任龙头：Intuitive 的 da Vinci 系列（Xi、X、SP 和新的 da Vinci 5）。第三，相邻小众系统，它们争夺医院机器人资本预算，但适应症不直接重叠：J&J
              Monarch（支气管镜）、MMI Symani（显微手术）、Moon Surgical Maestro（协作式腹腔镜辅助）和
              Avatera（欧洲软组织）。第四，现状替代方案——传统腹腔镜；这是医院采购团队可以选择的最普遍替代，而不是任何机器人平台。


              截至 2025 年 12 月，Intuitive Surgical 全球约安装 11,106 套 da Vinci 系统，同比增长 12%，2025 年手术量约增长 18%。其市值约 $174
              billion，超过所有具名竞争者之和。在这种背景下，CMR 的竞争挑战不主要是技术规格上打赢 Medtronic 或 J&J，而是在 Intuitive 第二代 da Vinci 5
              进一步拉开临床性能差距前，在成本敏感的中端医院和手术中心中切出可守住的利基。
