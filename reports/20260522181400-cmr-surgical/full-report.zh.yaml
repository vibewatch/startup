companyProfile:
  summary: >
    CMR Surgical 是一家位于英国 Cambridge 的私营手术机器人公司，2014 年 1 月以 Cambridge Medical Robotics Limited 注册成立，2018 年更名为 CMR
    Surgical。公司开发并商业化 Versius 和 Versius Plus 模块化软组织手术机器人平台——基于推车、可独立移动的系统，目标是让微创手术普遍可及。Versius Plus 新增 vLimeLite NIR/ICG
    荧光成像、增强型能量器械，以及云连接数字生态（Versius Connect 外科医生日志、Versius Team 医院分析看板）。截至 2026 年 3 月，全球 30+ 个国家已有超过 45,000 名患者接受治疗，使
    Versius 成为 Intuitive Surgical 的 da Vinci 之后全球部署第二广的软组织手术机器人。CMR 于 2024 年 10 月获得原版 Versius 的 FDA De Novo 授权，并于 2025 年
    12 月获得 Versius Plus 的 510(k) 许可，两者适应症均为胆囊切除术。截至 2026 年 4 月，妇科 510(k) 仍在审评中。公司累计融资约 $1.4B，包括 2021 年 $600M Series
    D（SoftBank Vision Fund 2、Ally Bridge Group）、2023 年 9 月 £133M（$165M）可转换贷款票据，以及 2025 年 4 月 $200M+ 股权加债务融资，新债权方为
    Trinity Capital。收入、利润率和烧钱速度均完全未披露。
