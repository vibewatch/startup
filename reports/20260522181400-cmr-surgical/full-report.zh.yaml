      - number: '3.4'
        title: 护城河持久性与反向竞争证据
        blocks:
          - type: paragraph
            body: >
              CMR 的主要护城河假设是模块化 / 可移动性（可部署于容纳不下 da Vinci 的小型 OR）、开放式控制台设计（降低外科医生再培训摩擦），以及相较 Intuitive
              的成本竞争力。这些护城河主张合理但脆弱。Intuitive 历来会用降价、强化服务合同和加速平台迭代回应竞争威胁。da Vinci 5 的发布大幅抬高了 CMR 必须追上的能力天花板。


              竞争群体中的反向证据显著。BTIG 分析师质疑 Medtronic Hugo 的差异化，说明单纯“模块化且更便宜”的定位，可能不足以让任何挑战者在美国快速采用。J&J 机器人部门 2023 年裁员、多年
              Ottava 开发周期，都提示执行风险。CMR 自身 2023 年裁掉 350 个岗位，临时 CEO 接棒也在关键美国启动阶段制造领导层不确定。Moon Surgical、Avatera
              等小型竞争者资本有限、适应症狭窄，若无法产生现金流，容易走向整合或退出。


              数据和 AI 护城河最难量化，但可能是最持久的威胁。Intuitive 拥有超过 10 million 例手术病例数据库（年增约 18%），可训练 AI
              辅导工具、并发症预测模型和技术基准；新平台至少十年内无法复制。CMR 和 Distalmotion 正在开始积累临床数据，但其装机基础约 160-300 套，而 Intuitive 为 11,100+ 套，AI
              训练优势在结构上不对称。


              融资约束是小型挑战者的系统性风险。CMR 已融资 $1B+ 但仍未盈利。Distalmotion 融资 $150M，但美国商业化仍处早期。Moon Surgical 和 Avatera
              是收入前或低收入业务。若资本市场长期低迷，或医院采用慢于预测，这些平台可能在达成商业规模前耗尽现金跑道，在竞争群体中引发整合或退出风险。
