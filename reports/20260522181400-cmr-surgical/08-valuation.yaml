    topic: Mako-acquisition
    missingEvidence: Publicly accessible documentation of the Stryker/MAKO Surgical 2013 acquisition terms including final
      transaction value, MAKO revenue at close, and deal rationale
    whyItMatters: The Mako transaction is the most directly analogous robotics-platform M&A precedent; confirmed terms would
      strengthen the strategic transaction comparable anchor
