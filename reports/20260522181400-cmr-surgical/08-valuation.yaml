  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-estimate
    missingEvidence: Audited or disclosed CMR Surgical revenue, gross margin, and EBITDA for FY2023, FY2024, and H1 2025
    whyItMatters: Without verified financials, no revenue-multiple valuation methodology is valid; scenario ranges are purely
      strategic and comparable-driven rather than fundamental
    diligencePath: Request management financial data room; review FY2024 statutory accounts filed April 2025 at Companies
      House; engage FCA-registered broker for LP access
    relatedQuestionRefs:
    - QV006
    - QV014
    - QV027
  - type: private-evidence-only
    severity: blocking
    topic: cap-table
    missingEvidence: Full preference stack, liquidation waterfall, seniority ordering, and conversion terms on 2023 convertible
      note
    whyItMatters: The preference structure determines how much of any exit price actually reaches common equity; opaque liquidation
      waterfall could drastically reduce investor returns even at $3-4B exit
    diligencePath: Request legal data room; review shareholder register at Companies House; engage company directly for cap-table
      summary
    relatedQuestionRefs:
    - QV007
    - QV020
  - type: private-evidence-only
    severity: material
    topic: debt-covenants
    missingEvidence: Full terms of Trinity Capital venture-debt facility, including financial maintenance covenants, acceleration
      triggers, and restrictions on strategic transactions
    whyItMatters: Undisclosed covenants could restrict CMR's ability to sell the company, require debt repayment at closing,
      or accelerate if financial thresholds are missed
    diligencePath: Review Companies House MR01 charge documents (filed March-May 2025); Trinity Capital IR disclosure; direct
      company engagement
    relatedQuestionRefs:
    - QV028
  - type: private-evidence-only
    severity: material
    topic: secondary-market
    missingEvidence: Secondary market trading data, NAV-based mutual fund marks, or institutional bid-ask spreads on CMR shares
      as a current valuation signal
    whyItMatters: Secondary market activity is the closest available proxy to a current market clearing price for private
      shares; its absence leaves the 2021 $3B as the sole equity mark
    diligencePath: PM Insights (currently paywalled), PitchBook (access-blocked), industry brokers such as Forge Global, Equity
      Zen, or Nasdaq Private Market
    relatedQuestionRefs:
    - QV011
