- id: recommendation-and-diligence
  title: Recommendation, Exit Readiness, and Diligence Asks
  body: 'Based on all available evidence, CMR Surgical warrants a Track recommendation at medium confidence with a high risk
    rating. The investment thesis rests on demonstrable strategic scarcity — CMR is the only globally deployed, non-ISRG soft-tissue
    surgical robot with both CE mark and FDA authorization — combined with an accelerating global procedure count (30,000
    in April 2025 to 45,000 by March 2026, a 50% increase in roughly 11 months), a multi-specialty footprint across 30-plus
    countries, and the second-highest soft-tissue robotic installed base globally. These attributes create a compelling M&A
    target for large strategic buyers in medtech and diversified healthcare. Against this, the dominant risks are: U.S. commercial
    execution on Intuitive''s home turf with a narrow initial cholecystectomy indication; full opacity on revenue, gross margin,
    and burn rate; the preference and debt overhang from $1.4 billion-plus in capital raised at varied terms; and undisclosed
    covenants on the Trinity Capital venture-debt facility that could restrict strategic options. The valuation stance is
    Stretched: the $3 billion last mark dates to the 2021 bull-market peak, the 2025 round did not mark equity up, and the
    reported $4 billion asking price is aspirational, not confirmed. Exit readiness is improving: the reported FT sale process
    indicates management is actively exploring liquidity options, and FDA traction — the de novo authorization in October
    2024 for cholecystectomy and the Versius Plus 510(k) clearance in December 2025 — provides the regulatory foundation for
    a credible U.S. story. Priority diligence actions include accessing the financial data room (revenue, EBITDA, burn, unit
    economics), understanding the full cap-table and liquidation waterfall, validating the U.S. hospital pipeline and LOI
    count, reviewing Trinity Capital debt terms and covenants, and assessing whether any binding NDA with a strategic acquirer
    is in place.'
