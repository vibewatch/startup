- id: scenario-analysis
  title: 'Scenario Analysis: Bull, Base, and Bear Cases'
  body: 'Three scenarios frame CMR''s valuation range, differentiated by assumptions about U.S. commercial ramp velocity,
    additional indication clearances, strategic buyer competition, and global procedure trajectory. The bull case posits that
    the U.S. launch materially exceeds baseline expectations: 50-plus hospital contracts signed within 18 months, gynecology
    510(k) approval arriving mid-2026, a second U.S. indication in 2027, and at least two large strategic acquirers competing
    in a sale process — generating an exit range of $4.5 to $5.5 billion. Key drivers include the scarcity premium on the
    only non-ISRG FDA-cleared soft-tissue robot and evidence from the reported sale process that strategic interest is real.
    The base case reflects steady but moderate U.S. adoption beginning in late 2026, global procedures exceeding 80,000 by
    2027, and a negotiated strategic acquisition in the $3.0–3.5 billion range — consistent with the last equity mark with
    a modest control and strategic premium over 2021 levels. This case is plausible given the 45,000-plus procedure milestone
    already reached by March 2026 and the confirmed FDA clearances. The bear case assumes U.S. uptake significantly disappoints
    in the first 12 months: hospital procurement cycles lengthen, competition from ISRG''s da Vinci 5 captures incremental
    U.S. wins, the company requires an additional dilutive capital raise (likely debt-heavy given covenant risk), and the
    strategic acquisition market is limited to a single buyer with pricing power — yielding an exit range of $1.5–2.0 billion,
    which would represent a material impairment for the 2021 Series D cohort. Probability weighting is subjective; available
    evidence — particularly the 50% growth in procedures from 30k to 45k in roughly 11 months — tilts toward base-case outcomes,
    but U.S. execution remains the most important unresolved variable as of the run date.'
