- id: TV006
  title: Final Diligence Asks
  columns:
  - Topic
  - Missing Evidence
  - Why It Matters
  - Owner / Diligence Path
  rows:
  - - Revenue and unit economics
    - Disclosed revenue run-rate, gross margin, EBITDA, and per-system economics (capital sale vs. rental vs. consumable split)
    - Required to validate any revenue-multiple valuation and assess path to profitability relative to remaining runway
    - Management data room; Companies House annual accounts (FY2024 due September 2026)
  - - Cap-table and liquidation waterfall
    - Full preference stack, seniority ordering, conversion terms on 2023 convertible note, and effective diluted share count
    - Determines common equity realization in exit scenarios; preference overhang can make $3B exit worth far less to late
      investors
    - Legal data room; shareholder register (Companies House); investor solicitation
  - - Trinity Capital debt covenants
    - Full terms of the March–April 2025 charge registrations (MR01 filings on Companies House); financial maintenance covenants,
      acceleration triggers
    - Undisclosed covenants could restrict strategic sale or require debt paydown at exit, reducing net proceeds
    - Companies House charge documents (MR01); Trinity Capital IR; legal counsel review
  - - U.S. hospital pipeline and LOI count
    - Number of U.S. hospitals at LOI, MOU, or active negotiation stage as of Q2 2026; procedure ramp plan; first procedure
      milestone date
    - The primary value driver in the 12-month window; determines whether bull or base case is credible
    - Management commercial update; conference presentations (e.g., SAGES, AAGL, SRS)
  - - Sale process status and advisors
    - Identity of M&A advisors; whether binding NDA is in place with any strategic buyer; current status of reported FT sale
      process
    - FT reporting is unconfirmed by CMR; if process is live, entry conditions and timeline are critical to investment decision
    - Management engagement; FT follow-up reporting; legal/M&A advisor network
  - - FY2024 statutory accounts
    - Group accounts filed at Companies House (AA filing dated 14 April 2025) — content requires download and review
    - Statutory accounts provide at minimum headcount trends, consolidated balance sheet, and auditor going-concern opinion
    - Companies House document download; Companies House filing history (AA filing 14 April 2025)
  notes: Diligence asks are ranked by materiality to the valuation decision; items 1–3 are blocking for any investment commitment.
