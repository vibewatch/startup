- id: TV005
  title: Bull / Base / Bear Scenario Analysis
  columns:
  - Scenario
  - Key Assumptions
  - Valuation Range (USD)
  - Probability Signal
  - Key Risk
  rows:
  - - Bull
    - 'U.S. ramp exceeds expectations: 50+ hospital contracts in 18 months; gynecology 510(k) approval mid-2026; second U.S.
      indication by 2027; competitive auction with 2+ strategic bidders; global procedures exceed 100k by late 2027'
    - $4.5B–$5.5B
    - Low–Medium (requires competitive M&A dynamic and outperforming U.S. clinical adoption)
    - Acquirer pool may be limited; J&J/Medtronic may prefer in-house robotics; ISRG might not be a buyer
  - - Base
    - Steady U.S. adoption beginning late 2026; gynecology clearance in 2026; global procedures ~80k by 2027; negotiated strategic
      acquisition with single strategic buyer; $3B mark preserved with modest exit premium
    - $3.0B–$3.5B
    - Medium (consistent with FT-reported sale interest, last equity mark, and current procedure trajectory)
    - Prolonged sale process; single buyer negotiates lower price; preference stack compresses equity realization
  - - Bear
    - U.S. adoption significantly disappoints in first 12 months; additional dilutive debt round required; strategic interest
      limited to single buyer with pricing power; global procedures stagnate at 50-60k; no second U.S. indication in 2026
    - $1.5B–$2.0B
    - 'Low–Medium (requires multiple adverse events coinciding: U.S. miss, limited M&A interest, and negative financial event)'
    - 2021 Series D investors impaired; UK government pressure to avoid foreign sale may reduce buyer pool
  notes: Scenario assumptions are qualitative; CMR revenue is undisclosed, so valuation anchors on strategic comparable, capital-raised
    floor, and reported $4B aspirational asking price rather than revenue multiples.
