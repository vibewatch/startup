- id: comparable-companies-and-transactions
  title: Comparable Companies and Transaction Precedents
  body: 'Intuitive Surgical (ISRG) is the dominant and most instructive public-company comparable for CMR in terms of product
    category, but its metrics must be applied with extreme caution. ISRG''s trailing-twelve-month revenue of $10.58 billion,
    enterprise value of approximately $151 billion, EV/Revenue multiple of roughly 14.3x, and EV/EBITDA of approximately 38.3x
    reflect 25-plus years of commercial operation, an installed base exceeding 9,000 da Vinci systems globally, an operating
    margin above 30%, and 23% year-over-year revenue growth — attributes CMR has not achieved and cannot be assumed to achieve.
    Applying ISRG''s multiples mechanically to CMR would yield meaningless results absent disclosed revenue. Stryker Corporation
    provides a useful acquirer-posture reference: trading at approximately 5.2x EV/Revenue and 20.5x EV/EBITDA on $25.3 billion
    in revenue, Stryker acquired MAKO Surgical in a landmark 2013 transaction that established the robotics-platform M&A precedent
    in medtech. MAKO was pre-scale and pre-profitability at the time of the acquisition, offering a more analogous reference
    for a strategic transaction involving a platform with demonstrated regulatory clearance but limited revenue. For private-company
    peers, DistalMotion raised $150 million in 2023 and Moon Surgical raised $55 million in the same year — both substantially
    smaller fund-raises and at earlier commercial stages than CMR, providing only directional signals about surgical robotics
    scarcity premiums. On a replacement-cost basis, CMR''s approximately $1.4 billion in total capital deployed sets a pragmatic
    floor: a strategic buyer acquiring CMR at or below this figure would require equity investors who participated at the
    $3 billion mark in 2021 to accept losses, making sub-$2 billion exit outcomes unlikely to gain investor support unless
    financial distress forced the issue.'
