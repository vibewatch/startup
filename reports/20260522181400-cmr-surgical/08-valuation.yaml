  - Limitation
  rows:
  - - Intuitive Surgical (ISRG)
    - Public company, soft-tissue robotics
    - Rev $10.58B TTM; Mkt cap $155.8B; Op margin 30.9%
    - EV/Rev ~14.3x; EV/EBITDA ~38.3x (Q1 2026)
    - Direct product-category comp; sets multi-year ceiling for what a scaled, profitable platform can achieve
    - 25+ yr history, 9,000+ installed base, $10B+ revenue; CMR is pre-revenue-disclosure and pre-profitability — multiples
      not directly applicable
  - - Stryker Corporation (SYK)
    - Public company, diversified medtech and robotics
    - Rev $25.3B TTM; Mkt cap $120.2B; Op margin 17.8%
    - EV/Rev ~5.2x; EV/EBITDA ~20.5x (Q1 2026)
    - 'Acquirer context: Stryker is a plausible strategic buyer and is one of the leading robotics-enabled medtech companies'
    - Stryker's Mako is orthopedic, not soft-tissue; EV/Rev reflects diversified portfolio not a pure-play robotics premium
  - - Stryker/MAKO Surgical acquisition (2013)
    - M&A transaction, robotics platform
    - Pre-commercial-scale orthopedic robotics platform; limited revenue at acquisition
    - Transaction established robotics strategic premium precedent in medtech M&A
    - 'Historical precedent: shows strategic buyers pay significant premiums for differentiated, regulatory-cleared robotics
      platforms at early commercial stages'
    - 2013 deal; orthopedic vs. soft-tissue market; prior bull-market M&A environment; exact terms not confirmed from current
      sources
  - - DistalMotion / Moon Surgical (2023 rounds)
    - Private, early-stage surgical robotics
    - 'DistalMotion: $150M raised (2023); Moon Surgical: $55M raised (2023); both pre-FDA'
    - Implied valuations well below $1B based on disclosed round sizes
    - 'Directional signal: market values surgical robotics alternatives to ISRG even at pre-FDA stages'
    - 'Both companies far earlier than CMR: pre-FDA, pre-scale, much smaller capital deployment; not meaningful direct comps
      for $3B+ CMR'
  - - CMR capital-deployed replacement cost
    - Capital-raised floor signal
    - Total capital raised ~$1.4B (TechFundingNews est.); last equity mark $3B (2021)
    - $1.4B capital floor; $3B mark represents ~2.1x cost-basis for replacement
    - 'Pragmatic floor signal: a buyer acquiring below ~$2B would impair 2021 Series D investors — constraining downside in
      any negotiated strategic exit'
    - Not a market-clearing valuation; liquidation preferences, debt seniority, and waterfall structure would determine actual
      equity recovery in distressed scenarios
  notes: Comparable set reflects public evidence as of May 2026; ISRG/SYK multiples from Yahoo Finance Q1 2026; Mako acquisition
    terms not confirmed from current cached sources — cited directionally only.
