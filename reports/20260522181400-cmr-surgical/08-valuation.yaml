- id: TV002
  title: Investment Thesis vs. Anti-Thesis
  columns:
  - Pillar
  - Investment Thesis
  - Anti-Thesis
  - What Would Change the View
  rows:
  - - Market
    - Surgical robotics market at $8–14B in 2024 growing at 14–17% CAGR through 2034; massive underpenetration of MIS globally
    - Market growth concentrated in ISRG-served procedures; CMR's addressable market limited by narrow initial U.S. indication
    - Multiple U.S. indication clearances and demonstrated hospital penetration across procedure types
  - - Product
    - Only non-ISRG soft-tissue robot with FDA clearance; modular, portable design compatible with virtually any OR; 45k+
      procedures validate safety
    - ISRG da Vinci 5 has vastly deeper clinical evidence, larger installed base, and richer data ecosystem; CMR ergonomic
      advantages unproven in U.S. context
    - Published U.S. RCT data showing non-inferiority or superiority versus open/laparoscopic benchmarks
  - - Customers
    - 30k+ to 45k+ procedures in 11 months; 70%+ of hospitals using Versius across two or more specialties; second most adopted
      soft-tissue robot globally
    - Installed base is ~160 estimated systems versus ISRG's 9,000+; U.S. customer references do not yet exist; NHS revenue
      model is not directly portable to U.S. fee-for-service
    - 50+ U.S. hospital contracts and disclosed U.S. procedure data in the first 12 months post-launch
  - - Financials
    - SoftBank, LightRock, and Ally-Bridge continued support; Trinity Capital institutional-grade debt; $200M+ runway for
      U.S. launch
    - Revenue/EBITDA entirely undisclosed; Trinity venture debt imposes covenants; prior $1.4B capital deployment implies
      large accumulated losses
    - Financial data room showing gross margin >40%, credible path to breakeven, and controlled burn at U.S. ramp
  - - Valuation
    - Aspirational $4B sale price reported by FT; precedent for strategic robotics premium (Stryker/MAKO); only non-ISRG globally
      deployed platform
    - No fresh equity mark since 2021; $3B set in peak bull market conditions; preference stack and debt overhang dilute common
      equity in downside scenarios
    - Secondary market transaction or new equity financing above $3B that confirms or exceeds the 2021 mark
  notes: Thesis/anti-thesis pairs are based on public evidence through May 2026; U.S. commercial KPIs remain the primary unresolved
    variable.
