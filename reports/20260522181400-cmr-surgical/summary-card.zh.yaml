summary:
  headline: >-
    CMR Surgical 是有吸引力的战略资产：它是唯一全球部署、非 ISRG、同时拥有 CE 标志和 FDA 授权的软组织手术机器人；但 2021 年形成的 $3B
    估值、完全不透明的财务、尚未验证的美国商业执行，只支持中等信心、高风险下继续观察。
