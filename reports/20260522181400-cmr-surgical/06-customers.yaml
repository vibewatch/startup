  - id: TU005
    title: Expansion Drivers and Concentration Risks
    columns:
      - Expansion Driver
      - Concentration / Downside Risk
      - Impact Assessment
      - Diligence Path
    rows:
      - - Multi-specialty land-and-expand (70%+ hospitals add 2nd+ specialty)
        - Revenue concentration in NHS UK as most visible customer base
        - Medium — NHS procurement under budget and policy pressure
        - Review UK vs non-UK procedure split; CFO interview on segment revenue
      - - US market entry via FDA-cleared Versius Plus (2026)
        - Single indication at US launch (cholecystectomy only)
        - High — limited US revenue until 510(k) indications approved (gyn filed)
        - Track FDA 510(k) for gynecology and additional indications
      - - Paediatric and TORS trial conversion to production
        - Trial-to-production conversion timeline unknown; instrument gaps flagged
        - Medium — expands TAM but dependent on trial outcomes and NHS funding
        - Monitor trial publications and NHS Technology Assessment decisions
      - - Middle East / Asia / Latin America hospital growth (named in CMR press)
        - No named hospital customers confirmed in these regions independently
        - Low-medium — growing install base but opaque customer identity
        - Request named distributor contracts and regional hospital list
      - - Academic/teaching hospital reference network (UK and Germany)
        - Over-reliance on vocal NHS reference accounts; competitor switches possible
        - Medium — reference fatigue risk; Intuitive and Medtronic offer similar
        - Independent customer interviews; ask for reference hospital list
      - - Capital sale + usage model (flexible)
        - No disclosed multi-year contract lock-in or renewal rate
        - Medium — no verified switching cost or contractual barrier to churn
        - Ask for contract term structure, cancellation provisions, renewal rate
    notes: "Expansion drivers and risks assessed from publicly available procedure milestones, named customer evidence, US market entry press, and academic study limitations. No contract-level data or customer-segment revenue breakdowns were available. Impact assessments are qualitative estimates by the analyst."
