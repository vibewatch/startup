  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-churn
      missingEvidence: "NRR, GRR, churn rate, contract renewal rate, and per-account revenue data from CMR's internal commercial records."
      whyItMatters: "Without retention data it is impossible to distinguish organic growth from churn-offset growth; the 60%+ procedural growth rate could mask material customer losses if the denominator of active hospitals is unknown."
      diligencePath: "Request commercial data room from CMR; benchmark against Intuitive Surgical's disclosed ~100%+ NRR; interview hospital procurement leads at 3–5 named NHS trusts."
      relatedQuestionRefs:
        - QU010

    - type: enumeration-incomplete
      severity: material
      topic: named-customer-list
      missingEvidence: "Complete named list of all Versius hospital customers with geography, deployment date, specialty coverage, and annual procedure volume."
      whyItMatters: "The partial enumeration (7 named sites) represents an unknown fraction of the 140+ installed base; geographic and segment concentration cannot be assessed without a fuller list."
      diligencePath: "Request named hospital reference list from CMR; check NHS procurement databases and European hospital tender records for Versius purchases; cross-reference CMR registry publications for named study sites."
      relatedQuestionRefs:
        - QU004
        - QU008
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: minor
      topic: utilisation-per-system
      missingEvidence: "Per-installed-system annual procedure volume (utilisation rate) disaggregated by geography and specialty."
      whyItMatters: "A utilisation rate below ~100 procedures per year per system would indicate underperformance vs capital cost, making the business model financially challenged at scale."
      diligencePath: "Triangulate from total procedures ÷ total systems; request from CMR; compare to da Vinci utilisation benchmarks (~200+ procedures/year/system in mature sites)."
      relatedQuestionRefs:
        - QU025

