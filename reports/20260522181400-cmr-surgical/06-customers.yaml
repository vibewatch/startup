  - id: named-customer-proof
    title: Named Customer Evidence and Specialty Deployment
    body: >-
      Named customer evidence for Versius is strongest among UK NHS trusts, which publish patient
      stories and clinical news on mandatory public-facing websites. East and North Hertfordshire NHS
      Trust's Lister Hospital published a patient testimonial from a woman who underwent a full
      hysterectomy using Versius for endometriosis; she reported the surgery as "pain-free" and was
      discharged in two rather than the expected three-to-five days. The procedure was performed by
      Consultant Gynaecology and Obstetrics Surgeon Mr Rami Atalla, confirming this as active clinical
      production use rather than a demonstration.

      Manchester University NHS Foundation Trust (MFT), a Shelford Group hospital, joined the START
      (Shelford Surgical Training in Advanced Robotic Technology) programme in early 2026, with over
      50 surgical trainees enrolled in the pilot year using Versius alongside da Vinci and Medtronic's
      Hugo platforms. This confirms active hospital-level institutional commitment, multi-platform
      acceptance of Versius, and sustained training investment in the system.

      Liverpool University Hospitals NHS Foundation Trust (LUHFT), operating via Aintree University
      Hospital, launched the UK's first Phase 2 clinical trial for Versius in head and neck
      cancer (TORS), planned for approximately 60 cancer patients. Professor Terry Jones, Director of
      Liverpool Head and Neck Centre, endorsed the system's capacity to enable more minimally invasive
      techniques. Three NHS trusts — Southampton Children's Hospital, Guy's and St Thomas' NHS
      Foundation Trust, and MFT — are running paediatric Versius trials, representing a future
      customer sub-segment not yet in production. Gloucestershire Hospitals NHS Foundation Trust became
      the first hospital globally to install the vLimeLite fluorescence imaging upgrade in 2024,
      confirming early technology-adopter behaviour at an existing Versius site.

      Internationally, Klinikum Chemnitz (Germany) became the first German hospital to install Versius
      in February 2021, deploying it in both general/visceral surgery (Prof. Dr. Lutz Mirow) and
      thoracic surgery (Dr. Sven Seifert). At the March 2026 SAGES conference in Tampa, Dr. Francesco
      Bianco of the University of Illinois Chicago cited the scale of real-world Versius experience as
      important evidence for US surgeon evaluation — though this is a cited endorsement, not a
      confirmed US customer deployment.

      Across these named customers the specialty mix includes gynecology, colorectal surgery, general
      surgery, thoracic surgery, TORS (trial), and paediatric surgery (trial), confirming the
      seven-specialty claim CMR publishes. The limitation is that named international customers outside
      the UK are almost entirely mediated through CMR-issued press releases, with independent
      hospital-published confirmation available only for German and UK sites.
