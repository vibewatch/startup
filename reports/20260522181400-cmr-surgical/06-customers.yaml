callouts:
  - calloutType: strength
    title: "Named NHS Customer Proof is High-Quality and Independently Published"
    body: >-
      Four UK NHS trusts — Lister/East Herts, MFT, Liverpool/Aintree, and Gloucestershire — have
      published independent hospital-issued pages confirming Versius use in production or clinical
      trials. NHS trusts are subject to public communications requirements, making these pages
      credible customer-proof that is not merely CMR marketing copy. The combination of patient
      outcome quotes, surgeon endorsements, and institutional training commitment (START programme)
      constitutes a stronger reference base than most private surgical robotics companies can publicly
      demonstrate at this stage.
    claimRefs:
      - CU016
      - CU017
      - CU018
      - CU019

  - calloutType: risk
    title: "Critical Retention and Churn Data Is Entirely Undisclosed"
    body: >-
      CMR does not publish NRR, GRR, churn rate, average contract length, or individual site renewal
      rates. The 70%+ multi-specialty adoption rate and 60%+ procedural growth rate are the only
      observable proxies for customer durability, and both are self-reported by the company. Without
      independent verification of whether hospitals renew service agreements, continue purchasing
      instruments, or decommission systems, investors cannot distinguish genuine retention from
      first-cycle purchase inertia. The 350-employee restructuring in late 2023 and the CEO transition
      in late 2024 add uncertainty to the interpretation of these figures.
    claimRefs:
      - CU034
      - CU035
      - CU036
      - CU038
      - CU039

  - calloutType: insight
    title: "Multi-Specialty Expansion Is the Key Commercial Moat Signal"
    body: >-
      The most commercially important customer behaviour Versius has demonstrated is the 70%+ rate at
      which hospitals adopt a second specialty after initial deployment. This pattern reduces per-
      system capital cost amortisation for the hospital, raises CMR instrument revenue per installed
      unit, and deepens the surgeon training and workflow commitment that makes switching to a
      competitor more costly. If this rate holds as the US install base grows, it would provide a
      meaningful revenue ramp well ahead of net new hospital acquisitions. The first priority for
      diligence is verifying whether this rate reflects active multi-specialty procedures or merely
      idle system availability across departments.
    claimRefs:
      - CU013
      - CU014
      - CU041
      - CU044

