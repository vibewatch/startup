      rendered order does not imply a technical sequence, system dependency
      or product hierarchy.
    data:
      items:
        - label: Client groups
          detail: Neo's official site and Moneycontrol describe an affluent and institutional audience.
          modules:
            - HNIs and UHNIs
            - Family offices
            - Institutions and corporates
        - label: Wealth and asset management
          detail: Moneycontrol reports these as parts of Neo's service range.
          modules:
            - Wealth management and advice
            - Asset management
        - label: Alternatives and private markets
          detail: Moneycontrol reports investment categories, without a complete current fund inventory.
          modules:
            - Private credit
            - Infrastructure and private equity
            - Alternative investments
        - label: Other reported services
          detail: Public reporting names additional service categories; specific workflows and terms are not documented.
          modules:
            - Fixed income and global investments
            - Insurance and estate planning
            - Loans Against Securities reported by BharatFast
        - label: Company-described technology
          detail: Neo's official page describes a proprietary platform; technical implementation is not disclosed.
          modules:
            - Proprietary technology platform claim
            - Architecture and integrations not documented
        - label: Technology investment intent
          detail: Moneycontrol reported in July 2026 that new capital was intended to strengthen technology and product capabilities.
          modules:
            - Investment intent reported
            - No delivered roadmap or measured outcome disclosed
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
