company:
  name: Neo Group
chapter:
  number: 5
  title: Product & Technology
  summary: Neo presents a broad wealth and investment-services portfolio and describes a proprietary technology platform, while current reporting says new capital will support technology and product capabilities. The assigned public evidence does not establish the platform's architecture, deployment, integrations, reliability, security controls, or measured customer outcomes.
sections:
  - id: product-scope
    title: Broad advisory and investment scope, with limited product-level proof
    body: >-
      Neo's public positioning targets HNIs and UHNIs as well as family offices,
      institutions and corporates, while Moneycontrol describes a service range
      spanning wealth management, alternatives, private credit, infrastructure,
      private equity, fixed income, global investments, insurance and estate
      planning (CE001, CE004). The company's own pages frame its proposition as
      knowledge-led and technology-powered and refer to a proprietary platform,
      but that is positioning rather than evidence of technical capability or
      client outcomes (CE002, CE005). The public offering therefore appears
      multi-product, but the retained sources do not provide a complete SKU or
      fund inventory, fee schedule, documented product lifecycle, or performance
      evidence. A BusinessToday PMS profile reports INR 6,027.20 crore of AUM
      while displaying zero schemes; without a page date, methodology or
      product-level records, neither field should be treated as a complete
      measure of Neo's current PMS range (CE007, CE008). The product matrix
      separates company positioning and reported service lines from verified
      maturity and diligence gaps.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE007
      - CE008
    tableRefs:
      - TE001
    figureRefs:
      - FE001
  - id: operating-model
    title: A human advisory proposition with technology investment, not a documented workflow
    body: >-
      Neo's public materials describe a wealth and asset-management proposition
      for affluent and institutional clients; Moneycontrol reports that the
      July 2026 funding would support technology and new product capabilities
      (CE001, CE003, CE004). This signals investment intent, not a completed
      roadmap, released product, or verified operating result. A Nexdigm
      industry article advocates hybrid models combining digital tools and
      human expertise, but that is a sector recommendation rather than evidence
      that Neo has implemented any particular workflow (CE011). The evidence
      also includes a company appointment announcement for wealth-management
      leadership and a YourTribe company profile whose interview-process panel
      mentions technical proficiency; neither establishes staffing for
      engineering, delivery practices, product adoption, or a customer journey
      (CE012, CE013). Across the reviewed company pages and current coverage,
      no company-specific client outcome or service-performance measure is
      disclosed (CE016). For underwriting, the meaningful distinction is
      between a broad stated service menu and proof of how clients onboard,
      receive advice, transact, get support, and realize measurable benefits.
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE011
      - CE012
      - CE013
      - CE016
    tableRefs:
      - TE002
  - id: technology-and-trust
    title: Architecture, controls and reliability remain diligence priorities
    body: >-
      The official pages use the phrase proprietary technology platform, and
      current news says Neo plans to invest in technology; the reviewed sources
      do not describe the software stack, hosting, data flows, APIs, integration
      partners, deployment model, service levels or reliability results
      (CE002, CE003, CE006). EY's August 2024 wealthtech report identifies data
      privacy and cybersecurity as regulatory concerns for technology-driven
      services, but it does not audit Neo or establish that the company has a
      particular control, certification or incident history (CE010). SEBI's
      SCORES page describes a grievance process for SEBI-regulated entities;
      it does not establish which Neo legal entities fall within that scope or
      whether complaints have been filed (CE014). No company-specific security
      controls, certifications, outage records or incident findings appear in
      the assigned fetched sources; that bounded evidence gap is not proof that
      incidents or controls are absent (CE015). A technical diligence review
      should request architecture and integration documentation, security and
      privacy control evidence, incident history, service metrics, and the
      entity-level regulatory and grievance map. The assigned pool also
      contains no public repository, release, API-community or practitioner
      signal that can substantiate engineering activity; the generic hiring
      profile is not such a proxy (CE013). This is a source-coverage gap, not
      proof that Neo has no developer-facing activity.
    claimRefs:
      - CE002
      - CE003
      - CE006
      - CE010
      - CE014
      - CE015
      - CE013
    tableRefs:
      - TE003
tables:
  - id: TE001
    title: Product module and asset map
    columns:
      - Module or asset
      - User or use case
      - Public evidence and maturity
      - Differentiation stated
      - Diligence gap
    rows:
      - - Wealth management and advice
        - HNIs, UHNIs, family offices, institutions and corporates
        - The company presents wealth management as a core service; no workflow or outcome metrics are disclosed.
        - Knowledge-led and bespoke positioning
        - Client onboarding, advice process, pricing, service levels and outcomes
      - - Asset management and PMS
        - Investors seeking managed investment products
        - A third-party PMS profile lists INR 6,027.20 crore AUM and zero schemes; its date and completeness are unclear.
        - Product breadth is asserted, but no complete inventory is evidenced.
        - Reconcile entity, date, scheme count, AUM definition and underlying product list
      - - Alternatives and private markets
        - Investors seeking alternatives, private credit, infrastructure or private equity
        - Moneycontrol reports these offerings; the assigned material does not establish individual fund status or lifecycle.
        - Access to multiple investment categories is reported.
        - Fund documents, eligibility, fee terms, performance and liquidity
      - - Lending against securities
        - HNIs, UHNIs and family offices seeking liquidity against investments
        - BharatFast reports that Arvesta offers Loans Against Securities against listed and unlisted securities.
        - A collateral-backed lending product is reported; terms are not public in the assigned evidence.
        - Confirm entity and regulatory status, collateral haircuts, eligibility, pricing and credit performance
      - - Proprietary technology platform
        - Wealth and investment-service delivery
        - The company describes a proprietary platform; technical design and production maturity are not documented.
        - Company-claimed technology enablement
        - Architecture, deployment, integrations, controls, adoption and reliability
    notes: >-
      Product categories combine company positioning and third-party reporting;
      they are not an exhaustive live catalogue. The PMS page's displayed AUM
      and zero-scheme count have no visible date or methodology in the fetched
      text and should be reconciled rather than treated as a verified current
      inventory.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE007
      - CE008
  - id: TE002
    title: Workflow and use-case evidence
    columns:
      - User job
      - Publicly documented company solution
      - Measurable benefit
      - Limitation or diligence ask
    rows:
      - - Obtain wealth advice across investment needs
        - Neo markets wealth-management and advisory services to affluent and institutional audiences.
        - Not disclosed in the assigned sources
        - Request customer journey, advice governance, fees and outcome measures
      - - Access alternatives and private-market products
        - Moneycontrol reports alternatives, private credit, infrastructure and private equity among the service lines.
        - Not disclosed in the assigned sources
        - Obtain current fund catalogue, eligibility, performance and liquidity terms
      - - Use technology-enabled investment services
        - The company claims a proprietary platform and reports say technology investment is planned.
        - No adoption, time-saving, quality or performance measure is provided.
        - Verify live capabilities, integrations, release status and client usage
      - - Escalate a securities-market grievance
        - SEBI describes SCORES for complaints against SEBI-regulated entities; Neo entity-level applicability is unverified.
        - No Neo-specific resolution data is provided.
        - Confirm covered legal entities, support channels and complaint outcomes
    notes: >-
      This table distinguishes a described service or general regulatory
      mechanism from verified workflow execution. No customer outcome or
      operational performance is inferred from product descriptions.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE011
      - CE014
      - CE016
  - id: TE003
    title: Technology and operating-architecture evidence map
    columns:
      - Layer or control area
      - Role in the customer proposition
      - What the assigned sources establish
      - Dependency or unresolved risk
    rows:
      - - Client and advisory interface
        - Connects affluent clients with wealth-management services
        - Target client groups and a wealth-management proposition are described.
        - No onboarding, access channel, service-level or advisor-workflow detail
      - - Investment products and portfolio services
        - Provides access to wealth, asset-management and alternative categories
        - Several categories are reported, but no full product or fund inventory is established.
        - Product status, suitability, pricing and performance remain unverified
      - - Platform, data and integrations
        - Potentially enables technology-supported service delivery
        - The company calls its platform proprietary; no stack, hosting, interface or data-flow evidence is present.
        - Integration, resilience, scalability and data-governance dependencies are unknown
      - - Security, privacy and client protection
        - Protects client information and supports compliant service
        - EY describes sector-level privacy and cybersecurity concerns; no Neo-specific control evidence is provided.
        - Request controls, certifications, incident records and entity-level regulatory mapping
    notes: >-
      This is an evidence map, not a reconstructed system architecture. Sector
      commentary identifies diligence topics but is not proof of Neo's
      implementation or control environment.
    claimRefs:
      - CE002
      - CE003
      - CE006
      - CE010
      - CE014
      - CE015
