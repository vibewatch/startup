schemaVersion: "report-v2"
artifact: company-overview
slug: neo-group
runDate: "2026-10-26"
company:
  name: Neo Group
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Neo Group is a wealth and asset-management platform whose public materials
    document institutional funding rounds and substantial reported client-asset
    scale. The assigned evidence conflicts on the 2026 TVS Capital round amount
    and does not establish revenue, ownership rights, or the substance and
    current status of an IFSCA warning item.
sections:
  - id: company-identity
    title: Identity and business model
    body: >-
      Neo presents itself as a wealth and asset-management platform serving
      affluent individuals and institutional or corporate clients. Moneycontrol
      describes offerings spanning advisory, alternatives, private credit,
      infrastructure, private equity, fixed income, global investments,
      insurance and estate planning; the company website separately presents
      wealth management, asset management, family offices, private clients,
      institutions and corporates. These descriptions establish a broad service
      perimeter, not the exact legal-entity structure, licensing perimeter or
      revenue contribution of each line. VCCircle describes Neo Wealth and
      Asset Management as Mumbai-based, but the assigned sources do not confirm
      a registered headquarters or a formal stage label. The profile therefore
      uses the company’s disclosed service language without treating marketing
      positioning as proof of scale or performance.
    claimRefs: [CO003, CO004]
  - id: leadership-and-capital
    title: Leadership and capital formation
    body: >-
      Nitin Jain is identified as Neo Group’s founder and current Chairman and
      Managing Director; the assigned sources do not establish a complete
      executive or board roster. A company-issued release names Hemant Daga as
      co-founder and CEO of Neo Asset Management, but independent evidence for
      that role is limited. The funding record spans Peak XV, MUFG Bank,
      Euclidean Capital and TVS Capital. For the 2026 TVS transaction,
      VCCircle and Neo’s own release report ₹500 crore while Timely Bharat
      says ₹550 crore; this amount remains unresolved. Neo’s release and
      VCCircle put the TVS transaction at a ₹10,000 crore pre-money valuation.
      Reported fundraises and a historical equity-base statement are not
      evidence of cash currently available, ownership percentages, or investor
      control rights.
    claimRefs: [CO001, CO002, CO005, CO006, CO007, CO010, CO011, CO012, CO013, CO016]
    tableRefs: [TO002, TO003]
  - id: scale-and-disclosure
    title: Scale metrics and disclosure limits
    body: >-
      Moneycontrol reports around ₹1.3 lakh crore in assets under advice and
      assets under management, over 850 employees, and operations in more than
      30 cities as of June 30, 2026; Timely Bharat gives similar asset and
      workforce figures. These are reported company-scale indicators, not
      audited financial statements or customer-count disclosures. VCCircle and
      a company-issued release describe ₹50,000 crore of “annualised recurring
      revenue assets under management” (ARR AUM). That label refers to an
      asset measure and cannot be treated as Neo’s revenue or ARR. The source
      pool contains no revenue, margin, cash-flow or current cash figure. An
      IFSCA item is titled as a warning to Neo Asset Management’s IFSC branch,
      but its fetched text contains only general Authority background; the
      warning’s findings, remediation and present status cannot be assessed
      from this evidence.
    claimRefs: [CO008, CO009, CO014, CO015]
    tableRefs: [TO001]
  - id: dated-milestones
    title: Dated milestones and unresolved chronology
    body: >-
      The dated record supports a 2021 founding, a Peak XV investment reported
      for October 2023, the ₹400 crore MUFG/Euclidean-led financing reported in
      2024, the 2026 TVS Capital transaction, and two 2026 operating and
      financing disclosures. Publication dates are identified as such where a
      source dates the article rather than the underlying transaction. The
      evidence is sufficient to show successive capital formation and reported
      asset growth, but not to reconstruct a complete corporate history. No
      additional dated product launch, leadership change, partnership or
      regulatory resolution should be inferred from the assigned pool; a
      verified chronology and transaction documents remain diligence items.
    claimRefs: [CO001, CO005, CO006, CO007, CO008, CO011, CO012, CO013, CO016]
    figureRefs: [FO001]
tables:
  - id: TO001
    title: Snapshot KPIs and evidence gaps
    columns: [Metric, Value or status, Period or date, Confidence, Gap / diligence ask]
    rows:
      - ["Business model", "Wealth and asset management; advisory and alternative-investment services", "Undated company page; accessed 2026-10-26", "Medium", "Map legal entities, licenses and revenue by service line"]
      - ["Registered headquarters", "Not confirmed; VCCircle describes the company as Mumbai-based", "Assigned reporting; date not provided", "Low", "Verify registered address and operating-entity structure"]
      - ["Founded", "2021", "2021", "High", "Verify incorporation date and operating-entity structure"]
      - ["Founder / group leadership", "Nitin Jain, founder; Chairman and Managing Director", "Reported in 2026 coverage", "Medium", "Obtain current board roster, ownership and succession plan"]
      - ["Client assets", "Around ₹1.3 lakh crore in assets under advice and assets under management", "As of 2026-06-30", "Medium", "Separate AUA from AUM; obtain concentration and client definitions"]
      - ["Employees", "More than 850", "As of 2026-06-30", "Medium", "Confirm employee versus contractor basis and functional allocation"]
      - ["Company revenue / ARR", null, "Not stated in assigned sources", "Low", "Obtain audited revenue, margins, cash flow and the company’s ARR definition"]
      - ["ARR AUM", "₹50,000 crore of annualised recurring-revenue assets under management", "Reported in 2026 coverage / release", "Medium", "Clarify definition and overlap; this is an asset measure, not company revenue or ARR"]
      - ["Peak XV financing", "Around ₹350 crore, led by existing investor Peak XV Partners", "Reported 2026-07-17", "Medium", "Confirm valuation, primary/secondary mix, dilution and transaction terms"]
      - ["TVS Capital financing", "₹500 crore (VCCircle and company release); ₹550 crore (Timely Bharat)", "2026; company release dated 2026-03-21", "Low / conflicting", "Confirm final amount, tranches and executed subscription proceeds"]
      - ["TVS transaction valuation", "₹10,000 crore pre-money", "2026; company release dated 2026-03-21", "High", "Verify fully diluted share count, post-money value and investor rights"]
      - ["Cumulative funding / cash available", null, "Not stated in assigned sources", "Low", "Reconcile cumulative proceeds, current cash and debt separately"]
      - ["Equity base", "₹1,000 crore, as a historical management statement", "Reported 2024-12-19", "Medium", "Historical equity base is not total funding or cash on hand; obtain current balance sheet"]
    notes: >-
      Figures retain the source metric names and stated periods; null means the
      assigned sources do not disclose the measure, not zero. Reported
      fundraising and equity base do not establish cash available. ARR AUM is
      an asset measure, not company revenue or ARR.
    claimRefs: [CO003, CO004, CO006, CO007, CO008, CO009, CO011, CO012, CO013, CO014, CO016]
  - id: TO002
    title: Leadership and founder table
    columns: [Person, Role, Functional coverage, Key-person dependence / diligence]
    rows:
      - ["Nitin Jain", "Founder; Chairman and Managing Director, Neo Group", "Group-level leadership and investor-facing role", "Public materials foreground Jain; quantify decision rights, ownership, succession and delegated authority"]
      - ["Hemant Daga", "Co-founder; CEO of Neo Asset Management, per company-issued release", "Asset-management leadership; independent evidence of role performance is limited", "Verify investment-committee depth, retention, reporting lines and succession"]
    notes: >-
      This is a partial public-source roster, not a complete management or
      board enumeration; company-issued role descriptions are not independent
      corroboration of performance.
    enumerationScope:
      coverage: partial
      basis: >-
        Public names are limited to leaders identified in the assigned source
        pool; no complete board or management roster was available.
    claimRefs: [CO001, CO002, CO010]
  - id: TO003
    title: Stakeholder or investor map
    columns: [Stakeholder, Reported role, Economic or control importance, Diligence ask]
    rows:
      - ["Nitin Jain / Neo management", "Founder and group Chairman and Managing Director", "Named executive leadership; ownership and board authority are not disclosed", "Request cap table, board composition, delegation matrix and succession plan"]
      - ["Peak XV Partners", "Led the reported ₹350 crore 2026 round; VCCircle also reports an October 2023 investment", "Repeated institutional investor; current ownership and rights are not stated", "Confirm current stake, board/veto rights and primary versus secondary proceeds"]
      - ["TVS Capital", "Investor in the 2026 transaction; public reports differ between ₹500 crore and ₹550 crore", "Material reported capital provider; company release states ₹10,000 crore pre-money valuation", "Reconcile executed round amount, dilution, governance rights and proceeds"]
      - ["MUFG Bank", "Led the reported ₹400 crore 2024 round with Euclidean Capital", "Strategic institutional investor; current holding and rights are undisclosed", "Confirm continuing ownership, board participation and commercial arrangements"]
      - ["Euclidean Capital", "Co-led the reported ₹400 crore 2024 round with MUFG Bank", "Institutional investor; current holding and rights are undisclosed", "Confirm current stake, governance rights and any follow-on participation"]
    notes: >-
      Reported investor participation is not a cap table. No assigned source
      establishes current shareholdings, voting rights, board seats, vetoes or
      secondary-sale proportions.
    enumerationScope:
      coverage: partial
      basis: >-
        This map covers named leaders and investors in allocated financing
        reports, not every shareholder, lender, director or economic beneficiary.
    claimRefs: [CO001, CO002, CO005, CO006, CO007, CO010, CO011, CO012, CO013]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Publicly dated founding, financing and scale disclosures show growth
      while leaving key transaction and operating details unresolved.
    data:
      items:
        - date: "2021"
          label: Neo founded
          details: VCCircle and other reports date the founding to 2021 and identify Nitin Jain as founder.
          tone: neutral
          claimRefs: [CO001]
        - date: "October 2023"
          label: Peak XV investment reported
          details: VCCircle reports ₹300 crore; The Economic Times separately reports around $35 million for an October investment, without specifying the year in its fetched text.
          tone: positive
          claimRefs: [CO005]
        - date: "2024-08 (reported 2024-08-12)"
          label: MUFG and Euclidean financing disclosed
          details: The Hindu BusinessLine reported a ₹400 crore round led by MUFG Bank and Euclidean Capital; this is the article date, not a verified transaction closing date.
          tone: positive
          claimRefs: [CO006]
        - date: "2024-12-19 (publication)"
          label: Historical equity-base statement reported
          details: Moneycontrol quoted Nitin Jain saying the financing took Neo's equity base to ₹1,000 crore; this is not cash available.
          tone: neutral
          claimRefs: [CO016]
        - date: "2026-03-21"
          label: TVS Capital financing announced
          details: Neo's release states ₹500 crore at ₹10,000 crore pre-money; VCCircle also says ₹500 crore, while Timely Bharat reports ₹550 crore.
          tone: warning
          claimRefs: [CO011, CO012, CO013]
        - date: "2026-06-30"
          label: Operating-scale snapshot
          details: Moneycontrol reports around ₹1.3 lakh crore in client assets and more than 850 employees as of this date.
          tone: positive
          claimRefs: [CO008, CO009]
        - date: "2026-07-17 (publication)"
          label: Peak XV-led financing reported
          details: Moneycontrol reports an around-₹350 crore round; valuation, dilution and transaction terms are not given in the article.
          tone: positive
          claimRefs: [CO007]
    claimRefs: [CO001, CO005, CO006, CO007, CO008, CO009, CO011, CO012, CO013, CO016]
