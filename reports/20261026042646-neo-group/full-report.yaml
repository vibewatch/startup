chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Neo presents itself as a wealth and asset-management platform serving affluent individuals and
              institutional or corporate clients. Moneycontrol describes offerings spanning advisory, alternatives,
              private credit, infrastructure, private equity, fixed income, global investments, insurance and estate
              planning; the company website separately presents wealth management, asset management, family offices,
              private clients, institutions and corporates. These descriptions establish a broad service perimeter, not
              the exact legal-entity structure, licensing perimeter or revenue contribution of each line. VCCircle
              describes Neo Wealth and Asset Management as Mumbai-based, but the assigned sources do not confirm a
              registered headquarters or a formal stage label. The profile therefore uses the company’s disclosed
              service language without treating marketing positioning as proof of scale or performance.
            claimRefs:
              - CO003
              - CO004
      - number: '1.2'
        title: Leadership and capital formation
        blocks:
          - type: paragraph
            body: >-
              Nitin Jain is identified as Neo Group’s founder and current Chairman and Managing Director; the assigned
              sources do not establish a complete executive or board roster. A company-issued release names Hemant Daga
              as co-founder and CEO of Neo Asset Management, but independent evidence for that role is limited. The
              funding record spans Peak XV, MUFG Bank, Euclidean Capital and TVS Capital. For the 2026 TVS transaction,
              VCCircle and Neo’s own release report ₹500 crore while Timely Bharat says ₹550 crore; this amount remains
              unresolved. Neo’s release and VCCircle put the TVS transaction at a ₹10,000 crore pre-money valuation.
              Reported fundraises and a historical equity-base statement are not evidence of cash currently available,
              ownership percentages, or investor control rights.
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO007
