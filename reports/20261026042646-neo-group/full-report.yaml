              - CR003
              - CR004
              - CR007
              - CR010
      - number: '7.2'
        title: Regulatory and legal perimeter
        blocks:
          - type: paragraph
            body: >-
              Neo Group is described in reporting as a wealth and asset manager with advisory and alternative-asset
              activities. SEBI's regulations index lists distinct frameworks for Investment Advisers, Portfolio
              Managers, and Alternative Investment Funds; that establishes the regulatory context, not which Neo entity
              holds a registration, which products require one, or the group's current compliance status. Tracxn
              associates three active legal entities with the group, but that third-party profile is not an
              authoritative group structure or license check. No source in the assigned evidence establishes a specific
              enforcement action or lawsuit, and this source gap is not evidence that none exists. Obtain an
              entity-by-entity product and registration map, then reconcile it to current regulator, court, complaint,
              and inspection records.
            claimRefs:
              - CR008
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR008
              - CR009
      - number: '7.3'
        title: Operating scale and resilience
        blocks:
          - type: paragraph
            body: >-
              Reported scale raises control questions but does not establish a failure: Moneycontrol says Neo managed
              about Rs 1.3 lakh crore across assets under advice and assets under management as of June 30, 2026,
              operated in more than 30 cities, and employed over 850 people; Economic Times separately describes about
              150 senior wealth advisers. These measures do not disclose the AUA/AUM split, client-asset custody,
              reconciliation controls, uptime, or adviser attrition. The assigned evidence provides no independently
              verified security, privacy, outage, service-quality, or continuity record. The incident picture is
              therefore unknown, not zero. Diligence should test asset and fee reconciliations, access controls,
              business continuity, client hand-offs, complaints, and adviser capacity by legal entity and product.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR014
          - type: table
