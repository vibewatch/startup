              - CI014
              - CI015
      - number: '4.2'
        title: Disclosed financial signals and financing
        blocks:
          - type: paragraph
            body: >-
              FBSCoach reports FY24 revenue of ₹177 crore, up 2.7x year on year, and a net loss of ₹13.7 crore that
              widened nearly fourfold; it is secondary reporting rather than an audited filing in this evidence set
              (CI005, CI006). Tracxn separately gives an annual-revenue range of ₹100–500 crore as at March 31, 2025, a
              broad band with a different period and no reconciliation to the FY24 figure (CI004). Moneycontrol reports
              a ₹350-crore Peak XV round and says a prior TVS Capital round was ₹550 crore, while StartupFeed described
              definitive agreements for the ₹350-crore round as pending close and the March TVS amount as ₹500 crore
              (CI009, CI010, CI011). The public record therefore does not support a reconciled funding total or current
              cash balance. Raised capital is not cash available, and an accounting loss is not cash burn.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
      - number: '4.3'
        title: Unit economics, capital adequacy, and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Moneycontrol reports roughly ₹1.3 lakh crore of client assets under advice and assets under management as
              of June 30, 2026; the combined AUA/AUM figure is not revenue and does not disclose the fee-bearing share,
              asset mix, or client concentration (CI003). Subsidiary-level PMS data are not a clean substitute: Business
              Today displays ₹6,027.20 crore of AUM, whereas IPOplatform's fetched page says ₹0 crore across zero
              clients while also presenting June 2026 scheme data (CI012, CI013). Those records are not reconciled and
              should not be added to group client assets. The assigned sources do not give Neo-specific CAC, sales
              cycle, payback, gross margin, operating cash flow, burn, debt maturities, capex, or working-capital needs
              (CI014, CI015). Underwriting needs audited FY24–FY26 statements, product-level revenue and direct costs,
              advisor compensation, customer cohorts, and a current cash/debt schedule before margin or runway claims
              can be tested.
            claimRefs:
              - CI003
              - CI012
              - CI013
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI014
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Asset scale is not earnings
            body: >-
              The reported AUA/AUM figure does not establish recognized revenue, fee-bearing assets, margins, or cash
              generation.
            calloutType: risk
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
          - type: callout
            title: Financing announcements do not establish liquidity
            body: >-
              Reported round amounts and pending-close language require reconciliation; neither cumulative fundraising
              nor announced use of proceeds is cash on hand.
            calloutType: insight
            claimRefs:
              - CI009
              - CI010
              - CI011
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Broad advisory and investment scope, with limited product-level proof
        blocks:
          - type: paragraph
            body: >-
              Neo's public positioning targets HNIs and UHNIs as well as family offices, institutions and corporates,
              while Moneycontrol describes a service range spanning wealth management, alternatives, private credit,
              infrastructure, private equity, fixed income, global investments, insurance and estate planning (CE001,
              CE004). The company's own pages frame its proposition as knowledge-led and technology-powered and refer to
              a proprietary platform, but that is positioning rather than evidence of technical capability or client
              outcomes (CE002, CE005). The public offering therefore appears multi-product, but the retained sources do
              not provide a complete SKU or fund inventory, fee schedule, documented product lifecycle, or performance
              evidence. A BusinessToday PMS profile reports INR 6,027.20 crore of AUM while displaying zero schemes;
              without a page date, methodology or product-level records, neither field should be treated as a complete
              measure of Neo's current PMS range (CE007, CE008). The product matrix separates company positioning and
              reported service lines from verified maturity and diligence gaps.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE007
              - CE008
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
              - CE007
              - CE008
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
      - number: '5.2'
        title: A human advisory proposition with technology investment, not a documented workflow
        blocks:
          - type: paragraph
            body: >-
              Neo's public materials describe a wealth and asset-management proposition for affluent and institutional
              clients; Moneycontrol reports that the July 2026 funding would support technology and new product
              capabilities (CE001, CE003, CE004). This signals investment intent, not a completed roadmap, released
              product, or verified operating result. A Nexdigm industry article advocates hybrid models combining
              digital tools and human expertise, but that is a sector recommendation rather than evidence that Neo has
              implemented any particular workflow (CE011). The evidence also includes a company appointment announcement
              for wealth-management leadership and a YourTribe company profile whose interview-process panel mentions
              technical proficiency; neither establishes staffing for engineering, delivery practices, product adoption,
              or a customer journey (CE012, CE013). Across the reviewed company pages and current coverage, no
              company-specific client outcome or service-performance measure is disclosed (CE016). For underwriting, the
              meaningful distinction is between a broad stated service menu and proof of how clients onboard, receive
              advice, transact, get support, and realize measurable benefits.
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE011
              - CE012
              - CE013
              - CE016
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE011
              - CE014
              - CE016
      - number: '5.3'
        title: Architecture, controls and reliability remain diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The official pages use the phrase proprietary technology platform, and current news says Neo plans to
              invest in technology; the reviewed sources do not describe the software stack, hosting, data flows, APIs,
              integration partners, deployment model, service levels or reliability results (CE002, CE003, CE006). EY's
              August 2024 wealthtech report identifies data privacy and cybersecurity as regulatory concerns for
              technology-driven services, but it does not audit Neo or establish that the company has a particular
              control, certification or incident history (CE010). SEBI's SCORES page describes a grievance process for
              SEBI-regulated entities; it does not establish which Neo legal entities fall within that scope or whether
              complaints have been filed (CE014). No company-specific security controls, certifications, outage records
              or incident findings appear in the assigned fetched sources; that bounded evidence gap is not proof that
              incidents or controls are absent (CE015). A technical diligence review should request architecture and
              integration documentation, security and privacy control evidence, incident history, service metrics, and
              the entity-level regulatory and grievance map. The assigned pool also contains no public repository,
              release, API-community or practitioner signal that can substantiate engineering activity; the generic
              hiring profile is not such a proxy (CE013). This is a source-coverage gap, not proof that Neo has no
              developer-facing activity.
            claimRefs:
              - CE002
              - CE003
              - CE006
              - CE010
              - CE014
              - CE015
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE006
              - CE010
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Target segments are clearer than the customer roster
        blocks:
          - type: paragraph
            body: >-
              Neo's official site names family offices, institutions, corporates, and ultra-high-net-worth individuals;
              July 2026 coverage additionally lists high-net-worth individuals. These are public target or
              client-segment labels, not evidence that each group has active, paying accounts. The assigned sources do
              not allocate assets, revenue, or account counts across these groups, nor distinguish the buyer, daily
              user, and payer. Tracxn describes wealth and asset management services for institutional and private
              entities. EY's August 2024 industry report identifies mass-affluent, younger, and women investors as
              broader potential segments, but does not show that Neo serves them.
            claimRefs:
              - CU001
              - CU002
              - CU014
              - CU008
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU014
      - number: '6.2'
        title: Aggregate assets and footprint are not customer adoption metrics
        blocks:
          - type: paragraph
            body: >-
              Yahoo Finance's July 2026 report, originally published by Private Banker International, and Moneycontrol
              both put total client assets at about Rs1.3tn on 30 June 2026, explicitly combining assets under advice
              and assets under management. That aggregate is neither pure AUM nor a customer count, and it supplies no
              customer denominator or revenue yield. The Hindu BusinessLine reported separate Wealth Management and
              Alternative Asset Management asset figures in August 2024; these are older snapshots, not a comparable
              growth series. StartupFeed reports operations in more than 30 cities, while July 2026 coverage reports
              over 850 employees; these indicate operating reach and staffing rather than client growth.
            claimRefs:
