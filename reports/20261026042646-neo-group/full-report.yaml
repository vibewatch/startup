            not an India market or service-revenue measure.
          claimRefs:
            - CM013
        - label: India household financial assets
          detail: EY expects US$6 trillion by 2028; broad household assets, not advisory fees.
          claimRefs:
            - CM004
        - label: India managed investments
          detail: EY estimates US$1.7 trillion in FY2022 and US$3.9 trillion by FY2027; source-defined asset pool.
          claimRefs:
            - CM004
        - label: Indian HNI/UHNI asset pool
          detail: >-
