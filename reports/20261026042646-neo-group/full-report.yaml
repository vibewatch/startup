  - id: FP001
    title: Evidence map of substitute archetypes
    type: matrix
    summary: >-
      Sector sources describe overlapping advice, digital, reporting and governance needs, but do not establish that
      every provider offers them.
    data:
      columns:
        - Advice and relationships
        - Digital access and data
        - Governance and operating support
      rows:
        - label: Private banks and full-service wealth platforms
          values:
            - Relationship-based services are part of the sector model
            - EY describes convergence toward scalable digital solutions
            - Provider-specific evidence is not established
        - label: Wealthtech platforms
          values:
            - UHNI clients may prefer a hybrid adviser model
            - Digital apps are described as widening access
            - Trust and regulatory posture vary by provider
        - label: Multi-family offices
          values:
            - Families seek strategic partners beyond product access
            - Consolidated reporting and a single source of truth are cited needs
            - Governance, succession and operating discipline are cited needs
        - label: Brokers and distributors
          values:
            - Customer-specific advice depth is unknown
            - Included in EY's competitive landscape; provider detail is not mapped
            - Provider-specific governance support is unknown
        - label: Internal or status-quo family-office arrangements
          values:
            - Decision models vary by family
            - Hubbis participants describe fragmented data and manual workflows
            - Maturity varies; institutional capability is not assured
        - label: Listed wealth managers (360 ONE and Nuvama)
          values:
            - NDTV Profit identifies both as listed wealth-management peers
            - EY describes incumbent acquisition of digital capabilities, including 360 ONE's ET Money move
            - The retained peer coverage does not compare governance controls
    approximationNotes: >-
      Qualitative synthesis of EY industry research and a Hubbis-hosted stakeholder discussion. Cells describe
      sector-level evidence, not assessed capabilities of every provider; unknowns are not negative findings.
    claimRefs:
      - CP009
      - CP012
      - CP013
      - CP015
