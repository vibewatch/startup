              - CR008
              - CR010
              - CR014
      - number: '7.4'
        title: Partner, talent, and client dependencies
        blocks:
          - type: paragraph
            body: >-
              The evidence identifies external capital providers and a sizable advisory workforce, but does not quantify
              dependence on any investor, adviser, customer, custodian, distributor, or technology platform. Aggregate
              client assets cannot substitute for client concentration, retention, or counterparty data. Capgemini's
              2025 global research reports distinct next-generation HNWI preferences and recommends digital tools and
              empowerment for relationship managers; that is industry context, not evidence of Neo-specific churn or a
              competitor benchmark. The investment risk is consequently conditional: growth may be exposed to funding
              terms, senior-talent continuity, or service dependencies that public reporting does not map. Request
              investor rights, top-client and counterparty concentrations, renewal and adviser-retention cohorts, and
              material vendor contracts before assigning a lower residual exposure.
            claimRefs:
              - CR004
              - CR007
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Transaction and price evidence
        blocks:
          - type: paragraph
            body: >-
              Neo's July 2026 Peak XV-led financing is reported as approximately Rs 350 crore ($36.3 million), but
              VCCircle says closing was still expected and StartupFeed says the round's valuation was not disclosed
              (CV001, CV007). Tracxn's profile instead lists a current valuation of $1.12 billion and a $1.1 billion
              post-money mark for the July Series C (CV006), although the page is stamped Published Time July 9, before
              the July 16 round it lists. That data-vendor mark is not reconciled to transaction terms or confirmed by
              the funding coverage, so it should not be treated as an issuer-confirmed price. The prior TVS Capital
              round is reported at a Rs 10,000 crore pre-money valuation, but its size is inconsistent: VIE Stories and
              Entrepreneur India report Rs 500 crore, while VCCircle describes Rs 550 crore (CV004, CV005). The
              disagreement, plus missing share-class, dilution, and preference details, prevents a clean price bridge
              between rounds.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
      - number: '8.2'
        title: Operating scale is not earnings
        blocks:
          - type: paragraph
            body: >-
              VCCircle reports about Rs 1.3 trillion in total client assets across advice and management portfolios as
              of June 30, 2026; Moneycontrol reports around Rs 1.3 lakh crore in assets under advice and assets under
              management on that date. VCCircle separately identifies Rs 50,000 crore of annualised recurring-
              revenue-generating assets (CV002, CV003). Neither asset figure is company revenue, ARR, profit, or cash
              generation; converting either into enterprise value without fee yield, product mix, retention, and margin
              data would create false precision. The market backdrop is constructive but not a company valuation input:
              Knight Frank's 2025 report, as covered by Livemint, counted 85,698 Indian HNWIs in 2024 and projected
              93,753 by 2028; Kotak's 2024 survey reports investment preferences for a sample of 150 Ultra-HNIs (CV009,
              CV010). Bernstein's sector growth view is similarly a market thesis, not a Neo-specific multiple.
              Public-peer commentary is useful for diligence questions, but competitor comparisons are not independent
              benchmarks for Neo's private valuation (CV011, CV012).
            claimRefs:
              - CV002
              - CV003
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV013
              - CV014
              - CV016
      - number: '8.3'
        title: Price-sensitive decision and scenarios
        blocks:
          - type: paragraph
            body: >-
              A conventional earnings or cash-flow valuation cannot be completed from the assigned sources reviewed: the
              transaction reports do not provide audited revenue, EBITDA, cash flow, customer retention, or a cap table,
              and Tracxn's data-vendor mark does not supply underlying calculations (CV013). Asset balances can indicate
              platform reach, but they do not establish fee income or the share of assets that generate recurring fees.
              The proposed investment stance is therefore research-more, with low valuation confidence and high
              underwriting risk; the public record does not support a target price, return multiple, or
              probability-weighted exit value (CV014, CV016). The upside case depends on verified recurring-fee
              conversion and durable advisor relationships; the downside case is that asset growth fails to translate
              into earnings or client retention. An exit window or advisor portability risk cannot be quantified from
              the available evidence (CV015, CV016).
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Research more before underwriting price
            body: >-
              Client-asset scale and investor participation are positive signals, but the disclosed record does not
              reconcile the current valuation mark or establish earnings, cash generation, or investor rights. Do not
              infer an entry price or expected return from AUM.
            calloutType: recommendation
            claimRefs:
