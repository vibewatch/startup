  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Capital and financial visibility
        blocks:
          - type: paragraph
            body: >-
              Financing coverage is not internally consistent: Economic Times and BW Disrupt report Rs 500 crore from
              TVS Capital and a Rs 10,000 crore valuation, while Moneycontrol describes the TVS investment as Rs 550
              crore. The July 2026 Peak XV-led round is reported at around Rs 350 crore, but StartupFeed says definitive
              agreements were pending closing and that valuation and investor allocations were undisclosed. Treat these
              as reported financings, not proof that funds cleared or are available, and do not infer runway from
              capital raised. The assigned evidence provides only historical FY23 revenue and accounting-loss figures;
              it does not establish current consolidated revenue, cash, burn, margin, debt, or liquidity. Obtain closing
              documents, a fully diluted cap table, audited group and entity statements, and a cash-flow and debt
              schedule before underwriting capital needs.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
