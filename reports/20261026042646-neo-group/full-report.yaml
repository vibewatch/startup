  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is advice and asset-management services for affluent Indian households, especially
              HNWI/UHNI families, alongside family-office, institutional, and corporate relationships that Neo says it
              serves. That boundary is narrower than total household wealth, financial assets, or fintech activity:
              those are capital pools or adjacent channels, not advisory-fee revenue. The public evidence does not
              identify fee pools, client-level assets eligible for Neo's products, or the share of a family's wealth
              actually advised by an external firm. Mass-affluent digital investing is an adjacent expansion segment in
              the EY discussion, not proof that Neo has captured it. EY's August 2024 report identifies traditional
              banks digitizing their wealth offerings and wealthtech firms as competitive models, but the assigned
              evidence does not quantify client substitution, self-management, or relative market shares. The market
              definition therefore separates target customers from the much broader pools often presented as TAM.
            claimRefs:
              - CM007
              - CM008
              - CM012
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM012
              - CM016
      - number: '2.2'
        title: Sizing evidence and limits
        blocks:
          - type: paragraph
            body: >-
              Several independent lenses indicate a substantial and expanding pool, but they measure different things.
              DD India, citing Knight Frank, reports 85,698 Indian HNWIs with assets above US$10 million in 2024, up 6%
              from 80,686 in 2023, and a 9.4% increase to 93,753 forecast for 2028. EY's August 2024 report cites
              separate HNI and UHNI population CAGR forecasts for 2021–26 and estimates household financial assets and
              managed investments on different horizons. Its traditional HNI/UHNI household asset-pool estimate also
              forecasts a rise to more than US$2 trillion within five years, with no base date specified in the cited
              passage. These are source-defined asset pools, not spend on advice, and cannot be added together or
              translated into Neo's obtainable revenue. Neo's company-issued 2026 coverage reports combined assets under
              advice and management, a company scale indicator rather than a market estimate or revenue measure. The
              exhibit orders broad-to-specific indicators only; units, denominators, and vintages differ, and the visual
              does not imply proportional size, nesting, or TAM/SAM/SOM conversion.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM011
              - CM012
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM011
              - CM013
      - number: '2.3'
        title: Buyers, drivers, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The premium buyer is not simply purchasing a product list: family principals and family offices may need
              portfolio construction, access to alternatives, succession, governance, and continuity across generations.
              EY describes digitalization and more tailored advice as ways to expand reach, and its August 2024 report
              described wealthtech regulation as evolving around consumer protection, data privacy, and cybersecurity.
              That dated observation is not a current regulatory check. Hubbis's 2026 family-wealth panel emphasizes
              listening, confidentiality, and alignment. Capgemini's 2026 report coverage also describes greater use of
              multiple wealth managers, including to broaden alternative-investment access, so category growth does not
              guarantee single-provider capture. Digital onboarding and broader product access can lower friction, but
              trust, service quality, suitability, and the budget owner remain critical. Public evidence does not show
              Neo's segment conversion, client acquisition cost, retention, fee realization, or customer-level budget
              authority. These gaps limit a defensible adoption curve and make an unqualified extrapolation from wealth
              growth to company revenue inappropriate.
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM010
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: A multi-archetype competitive set
        blocks:
          - type: paragraph
            body: >-
              Neo competes inside a blurred affluent-wealth arena, not only against a single private-wealth app. EY maps
              full-service platforms, private banks, boutiques, wealthtechs and brokers, and describes convergence
              around HNI and affluent clients; Hubbis' family-office discussion adds multi-family offices and
              private-bank operating support as alternatives. Within listed peers, Financial Express discusses 360 ONE
              and Nuvama, while NDTV Profit relays Citi Research coverage of 360 ONE, Nuvama and Prudent; Multiples
              names a much broader list that includes unlike and non-Indian financial businesses. These lists are
              discovery aids, not an exhaustive or independently validated peer set: category labels are expansive, and
              the sources do not demonstrate same-customer overlap for every named company.
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP014
      - number: '3.2'
        title: The plausible edge is integrated advice, not proven superiority
        blocks:
          - type: paragraph
            body: >-
              Neo says it serves HNIs and UHNIs, family offices, institutions and corporates across wealth and asset
              management, private markets, fixed income, global investments, insurance and estate planning. Two July
              2026 reports put its total client assets across assets under advice and assets under management at about
              Rs 1.3 lakh crore as of 30 June 2026; both describe company-reported figures rather than independent
              verification. The strongest differentiation hypothesis is a combination of relationship-led advice,
              alternatives and technology-enabled reporting. EY describes hybrid digital-plus-adviser demand among UHNI
              clients, while Hubbis participants emphasize governance, consolidated reporting and specialist
              coordination. The available evidence does not show Neo's feature parity, realized adoption, or whether
              these attributes improve client retention.
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP008
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP006
              - CP007
              - CP008
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP009
              - CP012
              - CP013
              - CP015
      - number: '3.3'
        title: Pricing and switching economics remain diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The assigned sources do not provide a comparable Neo fee schedule, client contract unit, discount policy,
              or realized price for direct peers. NDTV Profit relays Citi Research concerns about transactional revenue
              at 360 ONE, investment-banking and incidental-expense revenue at Nuvama, and pricing pressure across
              mutual-fund businesses; those are sector and public-company signals, not evidence of Neo's own realized
              pricing. Likewise, the sources describe the value of trusted advice and better reporting but disclose no
              Neo client tenure, churn, multi-homing, portability, renewal, or switching-cost data. That distinction
              matters: a broad service catalogue or reported asset base cannot by itself prove lock-in or a durable
              distribution advantage.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
      - number: '3.4'
        title: Incumbent response and convergence constrain moat claims
        blocks:
          - type: paragraph
            body: >-
              The competitive response is not limited to new digital entrants. EY describes wealthtech partnerships and
              a traditional wealth manager's acquisition of ET Money as examples of established firms buying access to
              digital capabilities and customers. It also identifies the need to balance personalized relationships with
              scalable digital delivery. This makes technology investment necessary but not automatically
              differentiating: incumbents can add platforms, and digital providers can extend reach. Hubbis' discussion
              adds an operating-model challenge for family-office providers, where data fragmentation, reporting and
              governance can be as important as investment products. Until comparable evidence on pricing, retention,
              service outcomes and regulatory posture is available, Neo's moat should be treated as a hypothesis rather
              than demonstrated displacement resistance.
            claimRefs:
              - CP006
              - CP008
              - CP013
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue engine and commercial evidence
        blocks:
          - type: paragraph
            body: >-
              Neo's official positioning is a knowledge-led, technology-powered wealth and asset-management platform for
              sophisticated HNI and UHNI clients, and Moneycontrol describes a broader service menu spanning wealth
              management, alternatives, private credit, infrastructure, private equity, fixed income, global
              investments, insurance, and estate planning (CI001, CI002). That establishes product breadth, not the mix
              of recognized revenue. FBSCoach says advisory fees and commissions on placed products are part of the
              model, while WorthScale lists advisory, AUM-based, and transaction fees as common wealthtech mechanisms;
              neither source provides a Neo fee schedule, realized take rate, discounting, or revenue-recognition policy
              (CI007, CI008). These are hypotheses to test against contracts and audited accounts, not verified unit
              economics. The figure separates the reported asset base from the unmeasured revenue and cash-conversion
              steps.
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI008
