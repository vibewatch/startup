            body: >-
              Moneycontrol reports around ₹1.3 lakh crore in assets under advice and assets under management, over 850
              employees, and operations in more than 30 cities as of June 30, 2026; Timely Bharat gives similar asset
              and workforce figures. These are reported company-scale indicators, not audited financial statements or
              customer-count disclosures. VCCircle and a company-issued release describe ₹50,000 crore of “annualised
