      - number: '6.3'
        title: Named use, retention, and concentration remain unverified
        blocks:
          - type: paragraph
            body: >-
              The assigned public material does not identify a customer deployment with production status and a measured
              outcome, or provide a client-account total. No NRR, GRR, churn, renewal, or cohort disclosure appears in
              the reviewed sources, so durable usage and expansion cannot be inferred from reported client assets.
              Citywire reports a wealth expert's concern that adviser moves and multi-banked clients can create overlap
              and internal competition; this is a potential relationship-ownership risk, not evidence of a failed Neo
              deployment. The same source set does not quantify top-client, adviser, or channel concentration. These
              limits leave both customer proof and the durability of the reported scale unresolved.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU011
      - number: '6.4'
        title: Underwrite customer economics only after cohort-level disclosure
        blocks:
          - type: paragraph
            body: >-
              The public record supports a premium-segment proposition and an aggregate asset base, but not the
              conversion from target segment to active mandate, recurring fee revenue, or retained relationship. In
              particular, assets under advice and assets under management should remain separate in diligence because
              their ownership and fee economics may differ; the sources do not provide the split. A decision-grade
              review would request customer and mandate counts by segment, a dated AUA/AUM bridge with definitions,
              production-versus-pilot references, anonymized retention cohorts, and top-client and adviser
              concentration. Until those are available, city coverage and headcount should be treated as capacity
              indicators rather than proof of customer acquisition or expansion.
            claimRefs:
              - CU003
              - CU010
              - CU011
              - CU012
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Aggregate asset scale cannot substitute for customer retention
            body: >-
              The June 2026 total combines assets under advice and assets under management, while the retained sources
              provide no customer count or cohort-retention measure.
            calloutType: risk
