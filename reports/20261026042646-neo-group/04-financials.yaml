schemaVersion: "report-v2"
artifact: financials
slug: neo-group
runDate: "2026-10-26"
company:
  name: Neo Group
chapter:
  number: 4
  title: Financials
  summary: >-
    Neo has a broad wealth and asset-management proposition and reported client
    assets of about ₹1.3 lakh crore, but public evidence does not establish the
    fee capture, profitability, or cash conversion behind that scale. Secondary
    revenue and loss figures and inconsistent financing and PMS data make
    underwriting dependent on audited accounts, segment economics, and current
    liquidity disclosures.
sections:
  - id: revenue-engine
    title: Revenue engine and commercial evidence
    body: >-
      Neo's official positioning is a knowledge-led, technology-powered wealth
      and asset-management platform for sophisticated HNI and UHNI clients, and
      Moneycontrol describes a broader service menu spanning wealth management,
      alternatives, private credit, infrastructure, private equity, fixed
      income, global investments, insurance, and estate planning (CI001, CI002).
      That establishes product breadth, not the mix of recognized revenue.
      FBSCoach says advisory fees and commissions on placed products are part of
      the model, while WorthScale lists advisory, AUM-based, and transaction
      fees as common wealthtech mechanisms; neither source provides a Neo fee
      schedule, realized take rate, discounting, or revenue-recognition policy
      (CI007, CI008). These are hypotheses to test against contracts and
      audited accounts, not verified unit economics. The figure separates the
      reported asset base from the unmeasured revenue and cash-conversion steps.
    claimRefs: [CI001, CI002, CI007, CI008]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: disclosed-financial-signals
    title: Disclosed financial signals and financing
    body: >-
      FBSCoach reports FY24 revenue of ₹177 crore, up 2.7x year on year, and a
      net loss of ₹13.7 crore that widened nearly fourfold; it is secondary
      reporting rather than an audited filing in this evidence set (CI005,
      CI006). Tracxn separately gives an annual-revenue range of ₹100–500 crore
      as at March 31, 2025, a broad band with a different period and no
      reconciliation to the FY24 figure (CI004). Moneycontrol reports a
      ₹350-crore Peak XV round and says a prior TVS Capital round was ₹550
      crore, while StartupFeed described definitive agreements for the
      ₹350-crore round as pending close and the March TVS amount as ₹500 crore
      (CI009, CI010, CI011). The public record therefore does not support a
      reconciled funding total or current cash balance. Raised capital is not
      cash available, and an accounting loss is not cash burn.
    claimRefs: [CI004, CI005, CI006, CI009, CI010, CI011]
    tableRefs: [TI002]
  - id: unit-economics-and-underwriting
    title: Unit economics, capital adequacy, and diligence blockers
    body: >-
      Moneycontrol reports roughly ₹1.3 lakh crore of client assets under
      advice and assets under management as of June 30, 2026; the combined
      AUA/AUM figure is not revenue and does not disclose the fee-bearing
      share, asset mix, or client concentration (CI003). Subsidiary-level PMS
      data are not a clean substitute: Business Today displays ₹6,027.20 crore
      of AUM, whereas IPOplatform's fetched page says ₹0 crore across zero
      clients while also presenting June 2026 scheme data (CI012, CI013).
      Those records are not reconciled and should not be added to group client
      assets. The assigned sources do not give Neo-specific CAC, sales cycle,
      payback, gross margin, operating cash flow, burn, debt maturities, capex,
      or working-capital needs (CI014, CI015). Underwriting needs audited
      FY24–FY26 statements, product-level revenue and direct costs, advisor
      compensation, customer cohorts, and a current cash/debt schedule before
      margin or runway claims can be tested.
    claimRefs: [CI003, CI012, CI013, CI014, CI015]
    tableRefs: [TI003]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns:
      - Stream or input
      - What the evidence says
      - Current value or status
      - Underwriting implication
    rows:
      - - Wealth and advisory
        - Officially positioned for HNI/UHNI clients; Moneycontrol lists wealth-management services.
        - Realized fees, discounts, commissions, and revenue recognition are not established.
        - Request fee schedules, contracts, revenue mix, and recognition policy.
      - - Asset management and alternatives
        - Moneycontrol lists alternatives, private credit, infrastructure, and private equity.
        - Product- and fund-level fee terms and revenue split are not disclosed in the retained evidence.
        - Request management/performance-fee terms, carry, third-party costs, and timing by product.
      - - FY24 revenue
        - FBSCoach reports ₹177 crore and 2.7x year-on-year growth.
        - Secondary figure; no audited filing or reconciliation is retained.
        - Reconcile to statutory accounts and define the revenue period and recognition basis.
      - - Revenue range
        - Tracxn reports ₹100–500 crore annual revenue as at March 31, 2025.
        - Broad third-party band; not a current run rate or precise FY25 result.
        - Obtain the underlying filing and reconcile entity and fiscal-year scope.
      - - FY24 net loss
        - FBSCoach reports ₹13.7 crore, nearly four times the prior-year loss.
        - Accounting loss only; cash burn and operating cash flow are unknown.
        - Request audited P&L, cash-flow statement, and reconciliation of non-cash items.
      - - Revenue mix and concentration
        - No retained source allocates revenue by advisory, AUM-based, transaction, or product fees.
        - Unavailable.
        - Request segment revenue, largest-client concentration, and recurring versus transaction-based share.
    notes: >-
      Secondary reports and one broad database band are not audited or
      period-aligned. Unknown values mean the assigned public evidence does not
      establish them; they are not zero.
    claimRefs: [CI001, CI002, CI004, CI005, CI006, CI007, CI008]
  - id: TI002
    title: Pricing, monetization, and reported financing
    columns:
      - Item
      - Reported evidence
      - Qualification
      - Diligence ask
    rows:
      - - Advisory fees and commissions
        - FBSCoach describes advisory fees and commissions on products placed with clients.
        - Secondary assertion; no Neo contract, schedule, or realized rate is retained.
        - Verify client-level fee basis, discounts, and recognition timing.
      - - AUM and transaction fees
        - WorthScale describes these as common wealthtech mechanisms.
        - Sector-level framing, not verified Neo pricing or revenue.
        - Obtain Neo's actual product and fund fee schedules.
      - - Peak XV financing
        - Moneycontrol reports ₹350 crore; StartupFeed says definitive agreements were signed and close was pending in its report.
        - Closing status, split among investors, and current proceeds are not verified here.
        - Confirm closing, instruments, fees, restrictions, and cash received.
      - - TVS Capital financing
        - Moneycontrol reports a prior ₹550-crore round; FBSCoach and StartupFeed describe ₹500 crore in March 2026.
        - The reported amount differs by ₹50 crore; round terms and basis are not reconciled.
        - Obtain definitive documents and reconcile gross proceeds and any tranches.
      - - Intended use of proceeds
        - Moneycontrol reports the company said funds would support technology and expansion.
        - A stated use is not evidence of cash remaining or actual deployment.
        - Reconcile planned versus actual use of proceeds and current liquidity.
      - - List versus realized pricing
        - No retained source provides list prices, discounting, take rates, or negotiated terms.
        - Unavailable; do not infer realized pricing from service descriptions.
        - Request representative contracts and billing/revenue schedules.
    notes: >-
      Sources report financing announcements, not a current cash balance. Round
      amounts and status are attributed to the named publishers; missing terms
      are not treated as zero or available cash.
    claimRefs: [CI007, CI008, CI009, CI010, CI011]
  - id: TI003
    title: Unit economics and capital adequacy
    columns:
      - Metric
      - Value or status
      - Confidence and limitation
      - Specific diligence request
    rows:
      - - Client assets
        - About ₹1.3 lakh crore AUA and AUM combined as of June 30, 2026, per Moneycontrol.
        - Medium-confidence reported company metric; not revenue, pure AUM, or a fee-bearing balance.
        - Split AUA from AUM, by product, client, and fee-bearing status.
      - - CAC, sales cycle, and payback
        - Not established in the assigned public sources.
        - No usable company-specific value; not zero.
        - Provide acquisition cost and payback cohorts by channel, advisor, and customer segment.
      - - Gross and contribution margin
        - Not established in the assigned public sources.
        - No audited segment margin or service-delivery cost bridge.
        - Provide gross margin and direct costs by advisory, asset management, and product line.
      - - Operating cash flow, burn, and runway
        - Not established; the reported accounting loss is not cash burn.
        - No current cash position, cash-flow series, or runway calculation.
        - Provide monthly cash flows, unrestricted cash, committed uses, and runway assumptions.
      - - Debt and financing obligations
        - No current debt balance, maturity schedule, or facility terms in the assigned evidence.
        - Absence in this source set is not proof that obligations do not exist.
        - Provide debt, guarantees, covenants, project-finance commitments, and maturities.
      - - Working capital and capex
        - Not established in the assigned public sources.
        - No balance-sheet or segment cost detail to assess capital intensity.
        - Provide working-capital movements, capex, advisor compensation, and technology spend.
    notes: >-
      Null or unavailable items are diligence gaps, not zero values. The reported
      AUA/AUM combines two asset measures and cannot be used as a revenue or
      margin denominator without a fee-bearing split.
    claimRefs: [CI003, CI014, CI015]
