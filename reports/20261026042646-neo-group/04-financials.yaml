        - from: asset-management
          to: assets
          label: platform-wide reported assets; attribution unavailable
        - from: assets
          to: revenue
          label: fee-bearing share and conversion not disclosed
        - from: revenue
          to: margin-cash
          label: cost and cash conversion not disclosed
    claimRefs: [CI001, CI002, CI003, CI014, CI015]
callouts:
  - calloutType: risk
    title: Asset scale is not earnings
    body: >-
      The reported AUA/AUM figure does not establish recognized revenue,
      fee-bearing assets, margins, or cash generation.
    claimRefs: [CI003, CI004, CI005, CI006]
  - calloutType: insight
    title: Financing announcements do not establish liquidity
    body: >-
      Reported round amounts and pending-close language require reconciliation;
      neither cumulative fundraising nor announced use of proceeds is cash on
      hand.
    claimRefs: [CI009, CI010, CI011]
