  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financial-disclosure
      missingEvidence: Audited FY2024-FY2026 revenue, fee yield, margins, cash flow, and recurring-fee contribution by business line.
      whyItMatters: Client assets and recurring-revenue-generating assets do not reveal recognized revenue, profitability, or cash available to equity holders.
      diligencePath: Obtain audited statements, management accounts, and a bridge from client assets to billed and collected fees.
      relatedQuestionRefs: [QV006]
    - type: conflicting-data
      severity: material
      topic: prior-round-terms
      missingEvidence: Executed TVS and Peak XV transaction documents, including the precise round sizes, price per share, pre/post-money basis, and investor rights.
      whyItMatters: Published reports disagree on the TVS cheque size and current valuation, preventing a reliable dilution or price bridge.
