artifact: valuation
slug: neo-group
runDate: 2026-10-26
company:
  name: Neo Group
chapter:
  number: 8
  title: Valuation
  summary: Public sources show meaningful client-asset scale and repeat investor support, but report materially different financing and valuation figures and disclose little about earnings or transaction terms. The evidence supports a research-more stance rather than a defensible target value or return forecast.
sections:
  - id: transaction-and-price-evidence
    title: Transaction and price evidence
    body: >-
      Neo's July 2026 Peak XV-led financing is reported as approximately Rs 350 crore
      ($36.3 million), but VCCircle says closing was still expected and StartupFeed
      says the round's valuation was not disclosed (CV001, CV007). Tracxn's profile
      instead lists a current valuation of $1.12 billion and a $1.1 billion post-money
      mark for the July Series C (CV006), although the page is stamped Published Time
      July 9, before the July 16 round it lists. That data-vendor mark is not reconciled to
      transaction terms or confirmed by the funding coverage, so it should not be
      treated as an issuer-confirmed price. The prior TVS Capital round is reported
      at a Rs 10,000 crore pre-money valuation, but its size is inconsistent: VIE
      Stories and Entrepreneur India report Rs 500 crore, while VCCircle describes
      Rs 550 crore (CV004, CV005). The disagreement, plus missing share-class,
      dilution, and preference details, prevents a clean price bridge between rounds.
    claimRefs: [CV001, CV004, CV005, CV006, CV007]
    tableRefs: [TV001]
  - id: operating-scale-and-comparability
    title: Operating scale is not earnings
    body: >-
      VCCircle reports about Rs 1.3 trillion in total client assets across advice
      and management portfolios as of June 30, 2026; Moneycontrol reports around
      Rs 1.3 lakh crore in assets under advice and assets under management on that
      date. VCCircle separately identifies Rs 50,000 crore of annualised recurring-
      revenue-generating assets (CV002, CV003). Neither asset figure is company
      revenue, ARR, profit, or cash generation; converting either into
      enterprise value without fee yield, product mix, retention, and margin data
      would create false precision. The market backdrop is constructive but not a
      company valuation input: Knight Frank's 2025 report, as covered by Livemint,
      counted 85,698 Indian HNWIs in 2024 and projected 93,753 by 2028; Kotak's
      2024 survey reports investment preferences for a sample of 150 Ultra-HNIs
      (CV009, CV010). Bernstein's sector growth view is similarly a market thesis,
      not a Neo-specific multiple. Public-peer commentary is useful for diligence
      questions, but competitor comparisons are not independent benchmarks for
      Neo's private valuation (CV011, CV012).
    claimRefs: [CV002, CV003, CV009, CV010, CV011, CV012]
    tableRefs: [TV002]
    figureRefs: [FV001]
  - id: price-sensitive-decision
    title: Price-sensitive decision and scenarios
    body: >-
      A conventional earnings or cash-flow valuation cannot be completed from the
      assigned sources reviewed: the transaction reports do not provide audited
      revenue, EBITDA, cash flow, customer retention, or a cap table, and Tracxn's
      data-vendor mark does not supply underlying calculations (CV013). Asset
      balances can indicate platform reach, but they do not establish fee income or
      the share of assets that generate recurring fees. The proposed investment
      stance is therefore research-more, with low valuation confidence and high
      underwriting risk; the public record does not support a target price, return
      multiple, or probability-weighted exit value (CV014, CV016). The upside case
      depends on verified recurring-fee conversion and durable advisor relationships;
      the downside case is that asset growth fails to translate into earnings or
      client retention. An exit window or advisor portability risk cannot be
      quantified from the available evidence (CV015, CV016).
    claimRefs: [CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
callouts:
  - calloutType: recommendation
    title: Research more before underwriting price
    body: >-
      Client-asset scale and investor participation are positive signals, but the
      disclosed record does not reconcile the current valuation mark or establish
      earnings, cash generation, or investor rights. Do not infer an entry price
      or expected return from AUM.
    claimRefs: [CV002, CV006, CV007, CV013, CV014]
  - calloutType: risk
    title: Financing terms and revenue quality remain unresolved
    body: >-
      The reported TVS cheque size differs across sources, and the latest round's
      issuer-confirmed valuation and share-class terms are not established in the
      reviewed coverage.
    claimRefs: [CV004, CV005, CV007]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision item, Current assessment, Evidence threshold to change view]
    rows:
      - [Recommendation, research-more, "Reconcile transaction price and verify audited operating economics"]
      - [Confidence, low, "Confirm the valuation mark and underlying financial statements"]
      - [Risk rating, high, "Resolve investor rights, dilution, and client/advisor retention"]
      -       [Valuation stance, unknown / not independently underwritten, "No supportable target value or return from the reviewed evidence"]
    notes: >-
      Analyst assessment based on the cited evidence through the run date;
      "unknown" reflects missing price support, not an estimate of fair value.
    claimRefs: [CV001, CV004, CV005, CV006, CV007, CV013, CV014]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Investment argument, Evidence and limitation, What would change the view]
    rows:
      - [Platform scale, "Rs 1.3 lakh crore client assets reported at June 30, 2026; assets are not revenue", "Audited fee revenue, fee yield, and asset mix"]
      - [Repeat investor support, "Peak XV-led Rs 350 crore transaction reported; latest valuation terms are not confirmed", "Executed round documents and fully diluted cap table"]
      - [Market opportunity, "Wealth growth and survey evidence indicate demand, not Neo-specific conversion or margins", "Cohort-level retention, net flows, and product profitability"]
      - [Advisor-led distribution, "A large advisor team is reported, while retention and relationship portability remain unquantified", "Advisor retention, client concentration, and succession data"]
    notes: >-
      Market and competitor observations are contextual only; they are not substitutes
      for Neo-specific financial data or independent valuation benchmarks.
    claimRefs: [CV001, CV002, CV009, CV010, CV011, CV012, CV015]
  - id: TV003
    title: Bull, base, and bear valuation scenarios
    columns: [Scenario, Assumptions and valuation logic, Valuation / return range, Probability signal and downside trigger]
    rows:
      - [Bull, "Recurring-fee assets convert to audited revenue and strong margins; advisor retention is demonstrated", "Not supportably quantifiable from disclosed inputs", "Conditional upside; weak fee conversion or advisor attrition invalidates the case"]
      - [Base, "Client assets remain substantial but fee yield, margins, and round price remain unverified", "No defensible range or target return", "Research-more is the evidence-led case; lack of audited earnings keeps confidence low"]
      - [Bear, "Asset growth does not produce durable earnings, or terms/dilution materially reduce investor value", "Downside cannot be quantified without entry price and security terms", "Downside risk is material; falling assets, weak retention, or adverse preferences would break the thesis"]
    notes: >-
      No numerical valuation ranges or probability percentages are supplied because
      published evidence does not establish revenue, margins, share count, security
      rights, or an exit basis. These are conditional scenarios, not forecasts.
    claimRefs: [CV004, CV005, CV006, CV007, CV013, CV014, CV015, CV016]
