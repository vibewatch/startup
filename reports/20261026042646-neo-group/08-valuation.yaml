      severity: material
      topic: exit-readiness
      missingEvidence: Exit timing, liquidity path, current investor marks, and expected proceeds to each security class.
      whyItMatters: Without a realizable exit basis and security waterfall, target returns and probability-weighted scenarios would be invented.
