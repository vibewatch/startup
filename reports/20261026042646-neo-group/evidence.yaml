evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: tvs-capital-round
    missingEvidence: >-
      Confirm whether the 2026 TVS Capital financing was ₹500 crore or ₹550 crore, including whether reports count
      different tranches or transaction components.
    whyItMatters: >-
      The amount changes the funding chronology and capital raised; neither reported figure establishes cash currently
      available.
    diligencePath: >-
      Obtain the executed subscription documents and a dated confirmation of gross proceeds, tranches, primary versus
      secondary shares, dilution and closing.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
      - TO003
  - type: access-blocked
    severity: material
    topic: regulatory
    missingEvidence: >-
      The body and underlying document for the IFSCA warning, including its findings, legal basis, remediation and any
      later status update.
    whyItMatters: >-
      A regulator warning may affect permissions, controls and reputation, but the assigned text is insufficient to
      characterize its substance or current effect.
    diligencePath: >-
      Obtain the original IFSCA notice or PDF and any response, remediation record or subsequent IFSCA communication;
      verify the precise regulated entity.
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: >-
      Audited FY24-FY26 revenue, fee income, margins, cash flow, current cash and debt, customer concentration,
      retention and renewal data.
    whyItMatters: >-
      AUM and ARR AUM do not reveal revenue realization, profitability, cash generation or client durability, all of
      which are necessary to assess the operating model.
    diligencePath: >-
      Request audited consolidated and entity-level financial statements, segment economics, cash/debt schedules, client
      cohorts and retention definitions.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current group structure, full board and leadership roster, cap table, investor rights, voting arrangements and
      succession coverage.
    whyItMatters: >-
      The public sources name selected executives and capital providers but do not establish control, board oversight or
      key-person dependence.
    diligencePath: >-
      Obtain the current organization chart, entity chart, fully diluted cap table, shareholder agreements, board
      materials and succession plan.
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: milestone-chronology
    missingEvidence: >-
      Additional independently dated product, partnership, leadership-change, scale and regulatory-resolution milestones
      beyond the seven items supported by the assigned source texts.
    whyItMatters: >-
      A sparse chronology limits assessment of execution sequence and whether reported scale followed durable product or
      governance milestones.
    diligencePath: >-
      Request a company milestone register with source documents and cross-check material entries against dated
      regulatory and investor records.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: company-identity
    missingEvidence: Verified registered headquarters, complete group/legal-entity map and a formally stated current company stage.
    whyItMatters: >-
      “Neo Group” covers multiple wealth and asset-management activities; entity and licensing boundaries affect
      diligence scope and regulatory exposure.
    diligencePath: >-
      Obtain current corporate registry extracts, an organization chart and official entity-by-entity product and
      license disclosures.
  - type: private-evidence-only
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      Public evidence in the assigned pool does not provide a fee-revenue market denominator, Neo-eligible asset base,
      segment penetration, fee realization, or Neo-specific SAM/SOM.
    whyItMatters: >-
      Asset pools and client-asset totals cannot be translated into addressable revenue or capture without eligibility,
      monetization, and share assumptions, limiting market-based valuation analysis.
    diligencePath: >-
      Request management's segment-level AUA/AUM, product eligibility, fee schedules and realized take rates,
      addressable client counts, wallet share, acquisition funnel, and retention data; reconcile these to audited
      revenue.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: enumeration-incomplete
    severity: material
    topic: buyer-budgets
    missingEvidence: >-
      The pool does not enumerate Indian family offices, institutional buyer counts, procurement budgets, or
      mass-affluent customer willingness to pay for Neo's specific services.
    whyItMatters: >-
      Without buyer counts, budget ownership, and willingness-to-pay evidence, market segmentation cannot be converted
      into an adoption or revenue forecast.
    diligencePath: >-
      Obtain segment-level pipeline and conversion data, public procurement references where applicable, price
      realization, and customer interviews separated by household, family-office, and institutional buyer.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM003
  - type: stale
    severity: material
    topic: regulatory-constraints
    missingEvidence: >-
      The assigned material contains an August 2024 description of evolving wealthtech regulation but no current 2026
      review of applicable rules, enforcement, or implementation.
    whyItMatters: >-
