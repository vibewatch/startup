      - Buyer / user / payer evidence
      - Stated use
      - Segment-level scale or economics
    rows:
      - - Ultra-high-net-worth individuals (UHNIs)
        - Client segment named; buyer and payer roles not separately specified
        - Bespoke wealth and investment solutions
        - No account, asset, or revenue split disclosed
      - - High-net-worth individuals (HNIs)
        - Client segment named in July 2026 coverage; buyer and payer roles not specified
        - Wealth advisory and investment solutions
        - No account, asset, or revenue split disclosed
      - - Family offices
        - Client segment named; decision-maker and payer not identified
        - Bespoke wealth solutions
        - No account, asset, or revenue split disclosed
      - - Institutions
        - Client segment named; institution type and contracting role not specified
        - Wealth and asset management services
        - No account, asset, or revenue split disclosed
      - - Corporates
        - Client segment named; user and payer roles not specified
        - Bespoke wealth and investment solutions
        - No account, asset, or revenue split disclosed
    notes: Segment labels reflect company positioning and media descriptions; no segment-level customer counts, assets, or revenue were disclosed in the retained sources.
    claimRefs:
      - CU001
      - CU002
      - CU014
  - id: TU002
    title: Public adoption and operating-scale indicators
    columns:
      - Metric
      - Reported value
      - Date / period
      - Source and confidence
      - What it does not establish
    rows:
      - - Total client assets, assets under advice plus assets under management
        - About Rs1.3tn
        - As of 30 June 2026
        - Yahoo Finance / Private Banker International and Moneycontrol; high
        - No AUA/AUM split, customer denominator, or revenue yield
      - - Wealth Management assets
        - Rs35,000 crore
        - Reported 12 August 2024; exact measurement date not stated
        - The Hindu BusinessLine; medium
        - Historical snapshot, not a comparable current series
      - - Alternative Asset Management assets
        - Over Rs6,000 crore
        - Reported 12 August 2024; exact measurement date not stated
        - The Hindu BusinessLine; medium
        - Historical snapshot; scope and overlap with other assets not stated
      - - Operating presence
        - More than 30 cities
        - July 2026 reporting
        - StartupFeed; medium
        - Footprint, not number of active customers or locations with production use
      - - Workforce / employees
        - Over 850
        - July 2026 reporting
        - Yahoo Finance / Private Banker International and Moneycontrol; high
        - Staffing scale, not customer count, productivity, or retention
      - - Customer or client account count
        - Not disclosed in retained July 2026 reports
        - July 2026 reports reviewed
        - Yahoo Finance / Private Banker International and Moneycontrol; medium
        - Absence in these reports does not establish that no internal count exists
    notes: Values retain each source's metric name, unit, and vintage; the 2024 business-line figures are not directly comparable with the 2026 combined AUA/AUM figure. “Not disclosed” means absent from the retained source text, not zero.
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU010
      - CU015
  - id: TU003
    title: Named customer proof table
    columns:
      - Proof category
      - Finding in retained sources
      - Diligence implication
    rows:
      - - Named customer deployment and use case
        - No customer was identified with a specific deployment
        - Request customer-approved references by segment
      - - Production versus pilot status
        - No named deployment status was stated
        - Verify live use, duration, and contracted scope
      - - Measured customer outcome
        - No named outcome or linked customer result was identified
        - Request attributable baseline and post-deployment evidence
    notes: This is a source-review inventory, not a census of Neo customers; no named customer evidence was found in the assigned prefetched materials.
    enumerationScope:
      coverage: partial
      basis: Review of the successful public URLs allocated to this chapter for the 2026-10-26 refresh; private disclosures and unallocated sources are outside scope.
    claimRefs:
      - CU011
