artifact: customers
slug: neo-group
runDate: 2026-10-26
company:
  name: Neo Group
chapter:
  number: 6
  title: Customers
  summary: Neo's official site lists UHNIs, family offices, institutions, and corporates; July 2026 coverage adds HNIs and reports about Rs1.3tn in combined assets under advice and management as of 30 June 2026. Available evidence supports aggregate assets and operating reach, but not customer counts, named deployments, segment economics, retention, or concentration.
sections:
  - id: customer-segments
    title: Target segments are clearer than the customer roster
    body: >-
      Neo's official site names family offices, institutions, corporates, and ultra-high-net-worth individuals; July 2026 coverage additionally lists high-net-worth individuals. These are public target or client-segment labels, not evidence that each group has active, paying accounts. The assigned sources do not allocate assets, revenue, or account counts across these groups, nor distinguish the buyer, daily user, and payer. Tracxn describes wealth and asset management services for institutional and private entities. EY's August 2024 industry report identifies mass-affluent, younger, and women investors as broader potential segments, but does not show that Neo serves them.
    claimRefs:
      - CU001
      - CU002
      - CU014
      - CU008
    tableRefs:
      - TU001
  - id: reported-scale
    title: Aggregate assets and footprint are not customer adoption metrics
    body: >-
      Yahoo Finance's July 2026 report, originally published by Private Banker International, and Moneycontrol both put total client assets at about Rs1.3tn on 30 June 2026, explicitly combining assets under advice and assets under management. That aggregate is neither pure AUM nor a customer count, and it supplies no customer denominator or revenue yield. The Hindu BusinessLine reported separate Wealth Management and Alternative Asset Management asset figures in August 2024; these are older snapshots, not a comparable growth series. StartupFeed reports operations in more than 30 cities, while July 2026 coverage reports over 850 employees; these indicate operating reach and staffing rather than client growth.
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU015
    tableRefs:
      - TU002
    figureRefs:
      - FU001
  - id: proof-and-durability
    title: Named use, retention, and concentration remain unverified
    body: >-
      The assigned public material does not identify a customer deployment with production status and a measured outcome, or provide a client-account total. No NRR, GRR, churn, renewal, or cohort disclosure appears in the reviewed sources, so durable usage and expansion cannot be inferred from reported client assets. Citywire reports a wealth expert's concern that adviser moves and multi-banked clients can create overlap and internal competition; this is a potential relationship-ownership risk, not evidence of a failed Neo deployment. The same source set does not quantify top-client, adviser, or channel concentration. These limits leave both customer proof and the durability of the reported scale unresolved.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
    tableRefs:
      - TU003
  - id: diligence-implications
    title: Underwrite customer economics only after cohort-level disclosure
    body: >-
      The public record supports a premium-segment proposition and an aggregate asset base, but not the conversion from target segment to active mandate, recurring fee revenue, or retained relationship. In particular, assets under advice and assets under management should remain separate in diligence because their ownership and fee economics may differ; the sources do not provide the split. A decision-grade review would request customer and mandate counts by segment, a dated AUA/AUM bridge with definitions, production-versus-pilot references, anonymized retention cohorts, and top-client and adviser concentration. Until those are available, city coverage and headcount should be treated as capacity indicators rather than proof of customer acquisition or expansion.
    claimRefs:
      - CU003
      - CU010
      - CU011
      - CU012
      - CU015
tables:
