  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: customer-segments
      missingEvidence: Customer and mandate counts by segment, with the buyer, user, and payer roles distinguished.
      whyItMatters: Without segment denominators, aggregate client assets cannot establish penetration, customer mix, or revenue concentration.
      diligencePath: Request a dated customer and mandate schedule by segment with role definitions and reconciliation to total assets.
      relatedQuestionRefs:
        - QU001
        - QU003
      relatedTableRefs:
        - TU001
        - TU002
    - type: missing-source
      severity: material
      topic: named-customer-proof
      missingEvidence: Named customer references documenting production versus pilot status, scope, duration, and measurable outcomes.
      whyItMatters: Segment labels and asset aggregates do not independently demonstrate active use, implementation quality, or customer value.
      diligencePath: Obtain customer-approved references and anonymized deployment records with baselines and outcome definitions.
      relatedQuestionRefs:
        - QU004
      relatedTableRefs:
        - TU003
    - type: private-evidence-only
      severity: material
      topic: customer-retention
      missingEvidence: Customer or mandate cohorts with NRR, GRR, churn, renewals, and relevant measurement periods.
      whyItMatters: Retention and repeat usage determine whether asset scale is durable and economically recurring.
      diligencePath: Request cohort schedules and metric definitions reconciled to audited financial and asset records.
      relatedQuestionRefs:
        - QU005
    - type: missing-source
      severity: material
      topic: customer-concentration
      missingEvidence: Top-customer, adviser, product, and channel concentration with customer-overlap and relationship-transfer controls.
      whyItMatters: The reported adviser-overlap concern cannot be sized without concentration and ownership data.
      diligencePath: Review anonymized top-10 customer and adviser concentration, portability terms, and account-level coverage controls.
      relatedQuestionRefs:
        - QU007
      relatedTableRefs:
        - TU003
    - type: stale
      severity: minor
      topic: wealth-management-assets
      missingEvidence: A current, dated breakdown of assets under advice and assets under management by business line and client segment.
      whyItMatters: The 2024 business-line snapshots cannot be compared directly with the 2026 combined figure.
      diligencePath: Request quarterly AUA/AUM schedules with consistent definitions and the source period for each reported figure.
      relatedQuestionRefs:
        - QU002
        - QU006
        - QU008
