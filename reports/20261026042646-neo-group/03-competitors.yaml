company:
  name: Neo Group
chapter:
  number: 3
  title: Competitors
  summary: >-
    Neo competes across a converging Indian wealth market that includes listed
    wealth managers, private banks, multi-family offices, brokers and digital
    wealth platforms. Public evidence supports a broad product-and-advice
    positioning hypothesis, but does not establish comparable pricing, retention,
    or a durable moat.
sections:
  - id: peer-landscape
    title: A multi-archetype competitive set
    body: >-
      Neo competes inside a blurred affluent-wealth arena, not only against a
      single private-wealth app. EY maps full-service platforms, private banks,
      boutiques, wealthtechs and brokers, and describes convergence around HNI
      and affluent clients; Hubbis' family-office discussion adds multi-family
      offices and private-bank operating support as alternatives. Within listed
      peers, Financial Express discusses 360 ONE and Nuvama, while NDTV Profit
      relays Citi Research coverage of 360 ONE, Nuvama and Prudent; Multiples
      names a much broader list that includes unlike and non-Indian financial
      businesses. These lists are
      discovery aids, not an exhaustive or independently validated peer set:
      category labels are expansive, and the sources do not demonstrate
      same-customer overlap for every named company.
    claimRefs: [CP001, CP002, CP005, CP006, CP012]
    tableRefs: [TP001]
  - id: evidence-of-differentiation
    title: The plausible edge is integrated advice, not proven superiority
    body: >-
      Neo says it serves HNIs and UHNIs, family offices, institutions and
      corporates across wealth and asset management, private markets, fixed
      income, global investments, insurance and estate planning. Two July 2026
      reports put its total client assets across assets under advice and assets
      under management at about Rs 1.3 lakh crore as of 30 June 2026; both
      describe company-reported figures rather than independent verification.
      The strongest differentiation hypothesis is a combination of
      relationship-led advice, alternatives and technology-enabled reporting.
      EY describes hybrid digital-plus-adviser demand among UHNI clients, while
      Hubbis participants emphasize governance, consolidated reporting and
      specialist coordination. The available evidence does not show Neo's
      feature parity, realized adoption, or whether these attributes improve
      client retention.
    claimRefs: [CP003, CP004, CP007, CP008, CP015]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: pricing-and-switching
    title: Pricing and switching economics remain diligence gaps
    body: >-
      The assigned sources do not provide a comparable Neo fee schedule, client
      contract unit, discount policy, or realized price for direct peers.
      NDTV Profit relays Citi Research concerns about transactional revenue at
      360 ONE, investment-banking and incidental-expense revenue at Nuvama, and
      pricing pressure across mutual-fund businesses; those are sector and
      public-company signals, not evidence of Neo's own realized pricing.
      Likewise, the sources describe the value of trusted advice and better
      reporting but disclose no Neo client tenure, churn, multi-homing,
      portability, renewal, or switching-cost data. That distinction matters:
      a broad service catalogue or reported asset base cannot by itself prove
      lock-in or a durable distribution advantage.
    claimRefs: [CP009, CP010, CP011, CP013]
    tableRefs: [TP003]
  - id: durability-and-response
    title: Incumbent response and convergence constrain moat claims
    body: >-
      The competitive response is not limited to new digital entrants. EY
      describes wealthtech partnerships and a traditional wealth manager's
      acquisition of ET Money as examples of established firms buying access
      to digital capabilities and customers. It also identifies the need to
      balance personalized relationships with scalable digital delivery.
      This makes technology investment necessary but not automatically
      differentiating: incumbents can add platforms, and digital providers can
      extend reach. Hubbis' discussion adds an operating-model challenge for
      family-office providers, where data fragmentation, reporting and
      governance can be as important as investment products. Until comparable
      evidence on pricing, retention, service outcomes and regulatory posture
      is available, Neo's moat should be treated as a hypothesis rather than
      demonstrated displacement resistance.
    claimRefs: [CP006, CP008, CP013, CP014, CP015]
