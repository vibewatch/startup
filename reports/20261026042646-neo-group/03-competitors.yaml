  evidenceGaps:
    - type: missing-source
      severity: material
      topic: pricing-evidence-gap
      missingEvidence: Current Neo and direct-peer fee schedules, contract units, discounts, and realized pricing on a comparable service basis.
      whyItMatters: Without fee and realization data, buyers' price trade-offs and the effect of fee compression on Neo's differentiation cannot be assessed.
      diligencePath: Request standard and negotiated fee schedules, anonymized client contracts, and realized fee yields from Neo and selected listed peers.
      relatedQuestionRefs: [QP004]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: switching-evidence-gap
      missingEvidence: Client retention, relationship-manager portability, multi-homing, renewal, and asset-movement evidence for Neo and close peers.
      whyItMatters: Service breadth and reported assets do not establish that clients stay, that relationships are non-portable, or that a competitor cannot displace the platform.
      diligencePath: Review cohort retention and asset-flow data, client tenure, adviser attrition, renewal terms, and reference calls with former and current clients.
      relatedQuestionRefs: [QP004, QP005]
      relatedTableRefs: [TP002]
    - type: enumeration-incomplete
      severity: minor
      topic: competitor-set
      missingEvidence: A verified India-specific roster of direct peers, adjacent providers, substitute arrangements and internal-build alternatives by client segment.
      whyItMatters: Third-party comparator lists use broad categories and do not establish which providers overlap with Neo in target customer, geography and service scope.
      diligencePath: Build a segment-by-segment competitor map from current provider disclosures, client references and adviser interviews.
      relatedQuestionRefs: [QP001, QP002]
      relatedTableRefs: [TP001]
