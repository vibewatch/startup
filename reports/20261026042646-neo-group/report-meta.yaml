companyProfile:
  summary: >-
    Neo Group presents itself as a wealth and asset-management platform serving private clients, family offices,
    institutions, and corporates through wealth-management and alternative-investment services. Public sources report
    substantial client assets and successive institutional financing, but the retained evidence does not resolve group
    economics, ownership, or the current financial position.
