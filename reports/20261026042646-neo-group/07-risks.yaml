company:
  name: Neo Group
chapter:
  number: 7
  title: Risks
  summary: >-
    The strongest evidenced risks are regulatory-perimeter uncertainty, opaque and
    inconsistently reported financing terms, and limited visibility into current
    financial and operating controls. Public reporting describes substantial asset
    and workforce scale, but does not establish current liquidity, compliance status,
    incident history, client concentration, or retention.
sections:
  - id: capital-and-financial-risk
    title: Capital and financial visibility
    body: >-
      Financing coverage is not internally consistent: Economic Times and BW Disrupt
      report Rs 500 crore from TVS Capital and a Rs 10,000 crore valuation, while
      Moneycontrol describes the TVS investment as Rs 550 crore. The July 2026
      Peak XV-led round is reported at around Rs 350 crore, but StartupFeed says
      definitive agreements were pending closing and that valuation and investor
      allocations were undisclosed. Treat these as reported financings, not proof
      that funds cleared or are available, and do not infer runway from capital
      raised. The assigned evidence provides only historical FY23 revenue and
      accounting-loss figures; it does not establish current consolidated revenue,
      cash, burn, margin, debt, or liquidity. Obtain closing documents, a fully
      diluted cap table, audited group and entity statements, and a cash-flow and
      debt schedule before underwriting capital needs.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR011
      - CR012
    tableRefs:
      - TR003
  - id: regulatory-and-legal-perimeter
    title: Regulatory and legal perimeter
    body: >-
      Neo Group is described in reporting as a wealth and asset manager with
      advisory and alternative-asset activities. SEBI's regulations index lists
      distinct frameworks for Investment Advisers, Portfolio Managers, and
      Alternative Investment Funds; that establishes the regulatory context, not
      which Neo entity holds a registration, which products require one, or the
      group's current compliance status. Tracxn associates three active legal
      entities with the group, but that third-party profile is not an authoritative
      group structure or license check. No source in the assigned evidence
      establishes a specific enforcement action or lawsuit, and this source gap is
      not evidence that none exists. Obtain an entity-by-entity product and
      registration map, then reconcile it to current regulator, court, complaint,
      and inspection records.
    claimRefs:
      - CR008
      - CR009
    tableRefs:
      - TR001
  - id: operating-resilience
    title: Operating scale and resilience
    body: >-
      Reported scale raises control questions but does not establish a failure:
      Moneycontrol says Neo managed about Rs 1.3 lakh crore across assets under
      advice and assets under management as of June 30, 2026, operated in more than
      30 cities, and employed over 850 people; Economic Times separately describes
      about 150 senior wealth advisers. These measures do not disclose the AUA/AUM
      split, client-asset custody, reconciliation controls, uptime, or adviser
      attrition. The assigned evidence provides no independently verified security,
      privacy, outage, service-quality, or continuity record. The incident picture
      is therefore unknown, not zero. Diligence should test asset and fee
      reconciliations, access controls, business continuity, client hand-offs,
      complaints, and adviser capacity by legal entity and product.
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR007
      - CR014
    tableRefs:
      - TR002
    figureRefs:
      - FR001
  - id: dependencies-and-client-durability
    title: Partner, talent, and client dependencies
    body: >-
      The evidence identifies external capital providers and a sizable advisory
      workforce, but does not quantify dependence on any investor, adviser,
      customer, custodian, distributor, or technology platform. Aggregate client
      assets cannot substitute for client concentration, retention, or counterparty
      data. Capgemini's 2025 global research reports distinct next-generation HNWI
      preferences and recommends digital tools and empowerment for relationship
      managers; that is industry context, not evidence of Neo-specific churn or a
      competitor benchmark. The investment risk is consequently conditional:
      growth may be exposed to funding terms, senior-talent continuity, or service
      dependencies that public reporting does not map. Request investor rights,
      top-client and counterparty concentrations, renewal and adviser-retention
      cohorts, and material vendor contracts before assigning a lower residual
      exposure.
    claimRefs:
      - CR004
      - CR007
      - CR013
      - CR014
