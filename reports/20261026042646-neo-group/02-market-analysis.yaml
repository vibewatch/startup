company:
  name: Neo Group
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Public evidence points to a growing Indian affluent-investor base and a large
    pool of managed assets, but it does not establish a comparable fee-revenue
    TAM or Neo-specific SAM/SOM. Neo targets HNWI/UHNI and institutional buyers;
    multihoming, trust, and the difference between assets and revenue constrain
    what headline asset-pool estimates imply for adoption or valuation.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The relevant market is advice and asset-management services for affluent
      Indian households, especially HNWI/UHNI families, alongside family-office,
      institutional, and corporate relationships that Neo says it serves. That
      boundary is narrower than total household wealth, financial assets, or
      fintech activity: those are capital pools or adjacent channels, not
      advisory-fee revenue. The public evidence does not identify fee pools,
      client-level assets eligible for Neo's products, or the share of a family's
      wealth actually advised by an external firm. Mass-affluent digital
      investing is an adjacent expansion segment in the EY discussion, not proof
      that Neo has captured it. EY's August 2024 report identifies traditional
      banks digitizing their wealth offerings and wealthtech firms as competitive
      models, but the assigned evidence does not quantify client substitution,
      self-management, or relative market shares. The market definition therefore
      separates target customers from the much broader pools often presented as
      TAM.
    claimRefs:
      - CM007
      - CM008
      - CM012
      - CM016
    tableRefs:
      - TM001
  - id: sizing-evidence
    title: Sizing evidence and limits
    body: >-
      Several independent lenses indicate a substantial and expanding pool, but
      they measure different things. DD India, citing Knight Frank, reports
      85,698 Indian HNWIs with assets above US$10 million in 2024, up 6% from
      80,686 in 2023, and a 9.4% increase to 93,753 forecast for 2028. EY's
      August 2024 report cites separate HNI and UHNI population CAGR forecasts
      for 2021–26 and estimates household financial assets and managed
      investments on different horizons. Its traditional HNI/UHNI household
      asset-pool estimate also forecasts a rise to more than US$2 trillion
      within five years, with no base date specified in the cited passage.
      These are source-defined asset pools, not spend on advice, and cannot be
      added together or translated into Neo's obtainable revenue. Neo's
      company-issued 2026 coverage reports combined assets under advice and
      management, a company scale indicator rather than a market estimate or
      revenue measure. The exhibit orders broad-to-specific indicators only;
      units, denominators, and vintages differ, and the visual does not imply
      proportional size, nesting, or TAM/SAM/SOM conversion.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM011
      - CM012
      - CM013
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyer-adoption
    title: Buyers, drivers, and adoption constraints
    body: >-
      The premium buyer is not simply purchasing a product list: family
      principals and family offices may need portfolio construction, access to
      alternatives, succession, governance, and continuity across generations.
      EY describes digitalization and more tailored advice as ways to expand
      reach, and its August 2024 report described wealthtech regulation as
      evolving around consumer protection, data privacy, and cybersecurity.
      That dated observation is not a current regulatory check. Hubbis's 2026
      family-wealth panel emphasizes listening, confidentiality, and alignment.
      Capgemini's 2026 report coverage also
      describes greater use of multiple wealth managers, including to broaden
      alternative-investment access, so category growth does not guarantee
      single-provider capture. Digital onboarding and broader product access
      can lower friction, but trust, service quality, suitability, and the
      budget owner remain critical. Public evidence does not show Neo's segment
      conversion, client acquisition cost, retention, fee realization, or
      customer-level budget authority. These gaps limit a defensible adoption
      curve and make an unqualified extrapolation from wealth growth to company
      revenue inappropriate.
    claimRefs:
      - CM006
      - CM008
      - CM009
      - CM010
      - CM014
      - CM015
    tableRefs:
      - TM003
tables:
  - id: TM001
    title: Market definition and substitutes
    columns:
      - Segment or category
      - Included scope evidenced
      - Excluded or unestablished
      - Buyer or payer
      - Relevance to Neo
    rows:
      - - HNWI/UHNI households
        - Bespoke wealth advice, investment management, and access to public or private assets
        - No public estimate of advice fees or eligible assets by segment
        - Wealth-owning individual, family principal, or household
        - Core target category named by Neo
      - - Family offices
        - Investment, governance, succession, and broader family-wealth needs
        - No count of addressable Indian family offices or external-adviser spend
        - Family office or family decision-maker; budget authority varies
        - Core relationship type named by Neo; needs extend beyond product distribution
      - - Affluent and mass-affluent investors
        - Digitally enabled investing and tailored services are described as an expanding adjacent segment
        - No evidence in this pool that Neo's addressable client base includes this full population
        - Individual investor or household; ticket size and budget are not specified
        - Potential adjacency, not a demonstrated Neo SAM
      - - Institutions and corporates
        - Neo states that it serves institutions and corporates
        - Procurement budgets, use cases, and serviceable account counts are not disclosed
        - Institutional or corporate decision-maker; not identified in sources
        - Named target category, with buyer and purchasing process still unclear
      - - Status quo and substitutes
        - Traditional banks digitizing wealth offerings and wealthtech firms
        - Client substitution, self-management, and relative market shares are not quantified
        - Household, family office, or institutional investor
        - Adjacent competitive models; the pool does not establish their relative scale
    notes: >-
      Scope is based on company positioning and third-party market commentary.
      Adjacent investor populations and substitute channels are not additive
      addressable spend; absent budget, fee, and eligibility data remain gaps.
    claimRefs:
      - CM007
      - CM008
      - CM009
      - CM010
      - CM012
      - CM016
  - id: TM002
    title: Market sizing lenses and comparability
    columns:
      - Publisher and evidence
      - Geography and metric
      - Period and value
      - Method or attribution
      - Limitation for Neo sizing
    rows:
      - - DD India reporting Knight Frank
        - India HNWIs with assets exceeding US$10 million
        - 85,698 in 2024; +6% year over year from 80,686 in 2023
        - Knight Frank Wealth Report 2025 as reported by DD India
        - Population count, not assets under advice, fee revenue, or all HNWI definitions
      - - DD India reporting Knight Frank
        - India HNWIs with assets exceeding US$10 million
        - 93,753 forecast by 2028, a 9.4% increase from the 2024 estimate
        - Knight Frank forecast reported in March 2025
        - Forecast, not an actual; no conversion into serviceable accounts or spend
      - - EY, Money in Motion
        - India HNI and UHNI populations
        - Forecast CAGRs of 12% for HNI and 7% for UHNI over 2021–26
        - EY cites Knight Frank Wealth Report 2022
        - Earlier forecast vintage; HNI/UHNI definitions and base counts are not reproduced here
      - - EY, Money in Motion
        - Global wealth
        - Approximately US$450 trillion; the cited passage gives no measurement year
        - EY's August 2024 report
        - Global capital pool, not an Indian wealth-management market or fee-revenue estimate
      - - EY, Money in Motion
        - India household financial assets
        - Expected to reach US$6 trillion by 2028
        - EY report estimate
        - Broad household asset pool, not private-wealth-management revenue
      - - EY, Money in Motion
        - India managed investments industry
        - US$1.7 trillion in FY2022 to US$3.9 trillion by FY2027; EY states approximately 57% and 74% of GDP, respectively
        - EY report estimate
        - Managed-investment assets are not adviser fees; definition and forecast assumptions are not fully specified in the cited passage
      - - EY, Money in Motion
        - Traditional Indian UHNI/HNI household asset pool
        - Exceeding US$1 trillion, forecast to nearly double within five years to more than US$2 trillion
        - EY report description; base date is unspecified in the cited passage
        - Forecast, not advice revenue; the cited passage does not reconcile this pool to other measures
      - - Neo Group company-issued coverage
        - Combined client assets under advice and assets under management
        - Approximately INR 1.30 lakh crore as of June 30, 2026
        - Company statement repeated in July 2026 coverage
        - Company scale, not revenue or total addressable market; AUA and AUM are combined
    notes: >-
      The figures retain each publisher's metric, denominator, geography, and
      period. Do not sum the asset pools, equate client assets with revenue or
      ARR, or treat a forecast or population count as market spend.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM011
      - CM012
      - CM013
  - id: TM003
    title: Buyer and adoption map
    columns:
      - Segment
      - Buyer or budget owner
      - User
      - Workflow or adoption trigger
      - Evidence and caveat
    rows:
      - - HNWI/UHNI
        - Individual wealth owner or family principal
        - Principal, family members, and advisers
        - Portfolio advice, diversification, alternatives, and succession planning
        - Named by Neo; public sources do not disclose budget, fee rate, or conversion
      - - Family offices
        - Family office leadership or family decision-maker
        - Investment team, principal, and next generation
        - Investment management plus governance, family education, and wealth transfer
        - Hubbis panel describes these needs qualitatively; prevalence is not enumerated
      - - Affluent and mass affluent
        - Individual investor or household
        - Investor using digital and adviser channels
        - Financialization, wider access, and more tailored advice
        - EY describes market growth and digital access; Neo-specific penetration is not shown
      - - Institutions and corporates
        - Institutional or corporate decision-maker; budget owner unknown
        - Investment or finance teams; specific users not documented
        - Wealth or asset-management solutions
        - Neo names these customer categories; procurement path and addressable account count remain unknown
    notes: >-
      Buyer roles and triggers are evidence-constrained. Rows distinguish
      company-stated target groups from third-party descriptions of broader
      market needs; they do not establish customer enumeration or spending.
    claimRefs:
      - CM007
      - CM008
      - CM009
      - CM010
