  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: market-sizing-gap
      missingEvidence: >-
        Public evidence in the assigned pool does not provide a fee-revenue
        market denominator, Neo-eligible asset base, segment penetration, fee
        realization, or Neo-specific SAM/SOM.
      whyItMatters: >-
        Asset pools and client-asset totals cannot be translated into addressable
        revenue or capture without eligibility, monetization, and share
        assumptions, limiting market-based valuation analysis.
      diligencePath: >-
        Request management's segment-level AUA/AUM, product eligibility, fee
        schedules and realized take rates, addressable client counts, wallet
        share, acquisition funnel, and retention data; reconcile these to
        audited revenue.
      relatedQuestionRefs:
        - QM007
      relatedTableRefs:
        - TM002
    - type: enumeration-incomplete
      severity: material
      topic: buyer-budgets
      missingEvidence: >-
        The pool does not enumerate Indian family offices, institutional buyer
        counts, procurement budgets, or mass-affluent customer willingness to
        pay for Neo's specific services.
      whyItMatters: >-
        Without buyer counts, budget ownership, and willingness-to-pay evidence,
        market segmentation cannot be converted into an adoption or revenue
        forecast.
      diligencePath: >-
        Obtain segment-level pipeline and conversion data, public procurement
        references where applicable, price realization, and customer interviews
        separated by household, family-office, and institutional buyer.
      relatedQuestionRefs:
        - QM003
      relatedTableRefs:
        - TM003
    - type: stale
      severity: material
      topic: regulatory-constraints
      missingEvidence: >-
        The assigned material contains an August 2024 description of evolving
        wealthtech regulation but no current 2026 review of applicable rules,
        enforcement, or implementation.
      whyItMatters: >-
        Current requirements for consumer protection, data privacy, and
        cybersecurity can affect product design, onboarding, costs, and buyer
        willingness to adopt digital wealth services.
      diligencePath: >-
        Verify current SEBI and other applicable regulator rules, circulars, and
        enforcement through October 2026; obtain Neo's compliance mapping and
        segment-specific implementation evidence.
      relatedQuestionRefs:
        - QM005
