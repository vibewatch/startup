chapter:
  number: 5
  title: "Product & Technology"
  summary: "Celonis delivers process mining and process intelligence software built on the Celonis Context Model and Process Intelligence Graph to extract, reconstruct, and optimize cross-system enterprise workflows. The platform couples an event-sequence data core with a StarRocks-powered low-latency query engine to execute multi-table join and aggregation graphs across multi-billion-row operational datasets, while exposing modular execution apps, workflow automations, and AI copilot services."
sections:
  - id: "product-definition-and-operating-model"
    title: "Product Definition and Workflow Operating Model"
    body: "Celonis operates as an enterprise Process Intelligence platform designed to eliminate operational friction and value leakage across core business processes such as Procure-to-Pay, Order-to-Cash, and Supply Chain execution. Rather than relying on static process documentation or manual consulting interviews, the platform connects directly to transactional source systems including SAP ERP, Oracle, Salesforce, and ServiceNow to extract operational logs and digital footprints. These events are mapped into object-centric and case-centric event logs that capture ordered sequences of business activities alongside timestamps and operational attributes.\n\nAt the foundation of this operating model sits the Celonis Context Model (CCM), which functions as a real-time, system-agnostic digital twin of enterprise operations. The Context Model synthesizes raw transactional data, domain business logic, and cross-application relationships to represent how business workflows actually execute in practice. This operational layer enables business analysts, process owners, and automated enterprise AI agents to pinpoint deviations, uncover root causes of bottlenecks, predict cycle-time slippage, and simulate what-if remediation scenarios across disparate application estates."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
    tableRefs:
      - "TE001"
  - id: "architecture-and-query-engine"
    title: "Architecture, Data Ingestion, and the StarRocks Query Engine"
    body: "The Celonis software architecture is structured into a multi-tier pipeline spanning the Data Core, the Processing and Analytics Core, and the Application Layer. Data ingestion supports both batch extraction and real-time streaming architectures. In enterprise production environments, data engineering pipelines leverage JDBC connectors for relational databases, dedicated extractors for ERP systems, change data capture (CDC) pipelines via PostgreSQL/Iceberg ecosystems, and Apache Kafka for low-latency streaming of transactional events into the Celonis cloud.\n\nA central technical challenge in process mining is query complexity and join density. User-facing interactions in Celonis are authored using Process Query Language (PQL), an array-aware domain-specific query language where users define required analytical columns and the system dynamically computes join paths across acyclical join graphs. In real-world enterprise deployments, individual PQL queries routinely traverse 10 to over 100 table joins simultaneously, and virtually all analytical queries incorporate heavy aggregations over billions of records. To meet strict enterprise dashboard performance targets of sub-2-second responsiveness without prohibitively expensive manual denormalization, Celonis adopted and customized StarRocks as its low-latency vectorized OLAP execution engine.\n\nThe engineering team extended StarRocks with a cost-based optimizer enhanced for process mining workloads, implementing custom cardinality estimators for array structures, column cardinality cost estimation, and skew-join handling. StarRocks utilizes collocated joins to co-partition tables sharing common business identifiers (such as purchase order numbers), eliminating cross-node data shuffling across distributed compute clusters. It also deploys array-first native functions (including array_filter, array_map, and array_agg) and sorted streaming aggregation to process ordered event sequences directly in memory without costly unnesting cycles."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "product-modules-and-workflow-use-cases"
    title: "Product Line Modules, Business Solutions, and Workflow Use Cases"
    body: "The Celonis application suite delivers specialized functional modules targeting horizontal operational domains and vertical enterprise use cases. Key functional modules include Accounts Payable (AP), Accounts Receivable (AR), Procurement, Order Management, and Inventory Management. Within Accounts Payable, Celonis tracks the end-to-end lifecycle of purchase requisitions, invoices, and payment disbursements, automatically detecting uncaptured early-payment discounts and duplicate payments prior to cash disbursement. In Order Management, the software identifies order holds, manual touchpoints, and delivery blocks that prolong lead times and depress customer satisfaction.\n\nBeyond diagnostic analytics dashboards, Celonis provides operational execution apps and automation capabilities. Users deploy process intelligence solution views, prebuilt process transformation templates, and action triggers that feed remediation tasks back into ERP workflows. Recent product releases introduce conversational AI capabilities, including the Celonis Assistant, which analyzes operational metrics to recommend relevant analysis modules, propose targeted process improvement use cases, and generate step-by-step implementation guidance for enterprise transformation teams."
    claimRefs:
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
    tableRefs:
      - "TE002"
  - id: "deployment-integration-and-technical-risks"
    title: "Deployment, Ecosystem Integration, and Technical Risks"
    body: "Celonis is deployed primarily as a multi-tenant and dedicated cloud SaaS platform hosted on hyperscaler infrastructure (AWS, Microsoft Azure, and Google Cloud Platform). Successful enterprise production rollouts demand significant technical integration and consulting resources. Enterprise Architect and Solution Engineering teams collaborate with systems integrators and ecosystem consulting partners to assess client IT landscape maturity, configure extraction pipelines from legacy on-premise systems, establish data governance boundaries, and tune data models for query efficiency.\n\nTechnical and operational risks center on integration maintenance, query latency degradation on extreme data volumes, and ERP vendor dependency. Extracting event logs from complex ERP environments requires continuous maintenance of custom data models, schema mappings, and table transformation logic. When client data models scale beyond 20 to 30 billion rows, P90 query latencies can stretch toward 20 seconds even under optimized StarRocks clustering, necessitating careful workload isolation via resource groups. Furthermore, because Celonis relies heavily on extracting transactional data from proprietary enterprise software like SAP and Oracle, changes in upstream API access policies, data export fees, or competitive positioning from ERP-native process mining tools present ongoing integration and channel risks."
    claimRefs:
      - "CE001"
      - "CE006"
      - "CE011"
      - "CE016"
