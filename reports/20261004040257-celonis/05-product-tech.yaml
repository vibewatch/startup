callouts:
  - calloutType: "insight"
    title: "Process Mining as an Extreme Join-Density Challenge"
    body: "Unlike traditional data warehousing where dimensional modeling pre-aggregates facts into denormalized star schemas, process mining query semantics in PQL dynamically compose queries that regularly join dozens to over 100 tables simultaneously. Celonis's custom integration of StarRocks with collocated joins, custom array cost estimators, and sorted streaming aggregation addresses this structural bottleneck, unlocking sub-2-second query response times across 20-billion-row operational datasets without incurring the massive maintenance and storage overhead of permanent denormalization."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
  - calloutType: "risk"
    title: "Technical Dependency on Upstream ERP Architectures"
    body: "Because the Celonis platform relies on reconstructing event logs from source transaction tables (principally SAP and Oracle ERP estates), its operational efficacy is directly tethered to the accessibility, schema stability, and licensing terms of host enterprise systems. Technical changes in host ERP database schemas, network egress limits, or restrictive vendor access policies represent an ongoing operational risk requiring sustained professional services engineering."
    claimRefs:
      - "CE001"
      - "CE006"
      - "CE011"
      - "CE016"
