company:
  name: "Celonis"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Celonis is a founder-led, late-stage private process-intelligence software company with dual Munich and New York headquarters, a $13 billion August 2022 valuation reference, and a broad enterprise-AI positioning. The principal overview risks are evidence quality rather than identity: total funding is reported at both $1.77 billion and $2.4 billion, current headcount measures differ, and the only retained revenue figure is a third-party 2023 estimate rather than disclosed ARR."
sections:
  - id: "identity-and-business-model"
    title: "Identity and business model"
    body: >-
      Celonis was founded in 2011 by Alexander Rinke, Bastian Nominacher, and
      Martin Klenk. An independent profile identifies the legal entity as
      Celonis SE and describes Munich as the corporate headquarters with a
      United States base in New York; another independent dataset likewise
      characterizes Munich and New York as dual headquarters. The company
      sells process-mining and process-intelligence software that extracts
      operational data from enterprise systems, adds business context, and
      represents workflows as a system-agnostic digital twin. Celonis now
      positions that context layer as infrastructure for analyzing,
      redesigning, and operating AI-assisted processes. The model is therefore
      enterprise software rather than a services-only business, although the
      allocated evidence does not disclose current pricing, contract mix, or
      recurring-revenue composition.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
    tableRefs:
      - "TO001"
  - id: "scale-and-capital"
    title: "Scale and capital"
    body: >-
      The official homepage says more than 1,400 companies use Celonis, while
      the careers site says the company has more than 3,000 employees across
      more than 20 offices. Those figures are issuer claims and should not be
      treated as independently verified customer or payroll counts.
      Third-party workforce datasets are directionally consistent with a large
      global organization but differ on the precise level: Tracxn reports
      4,405 employees and Crustdata reports 4,451 for August and September
      2026, respectively. Capital reporting is less reconcilable. Tracxn
      reports $1.77 billion over six rounds, while several independent profile
      sources report $2.4 billion. The $13 billion valuation is tied to the
      August 2022 financing and is not presented here as a current mark.
      GetLatka's $771 million figure is explicitly an estimated 2023 annual
      revenue measure, not disclosed ARR or cash available.
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO003"
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      Founder influence remains unusually visible. Independent profiles list
      Rinke and Nominacher as co-chief executives, Klenk as founder and chief
      technology officer, and Rinke and Nominacher as the two active board
      members. A broader leadership snapshot adds named executives for
      customer and ecosystem management, people and culture, and legal and
      trust functions, indicating functional coverage beyond the founding
      team. Even so, the allocated evidence does not include constitutional
      documents, voting rights, a complete board roster from a primary filing,
      succession plans, or ownership percentages. Crustdata's mapped
      organization also characterizes median leadership tenure as two years
      and moderate turnover. These limitations make founder concentration and
      executive continuity material diligence questions rather than proven
      governance failures.
    claimRefs:
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
    tableRefs:
      - "TO002"
  - id: "milestones-and-current-direction"
    title: "Milestones and current direction"
    body: >-
      The disclosed chronology shows a conventional venture-to-late-stage
      financing path: Series A in 2016, Series B in 2018, Series C in 2019,
      Series D in 2021, and an equity extension plus debt package in 2022.
      Product positioning has since shifted toward supplying operational
      context for enterprise AI while retaining process mining as the
      underlying category. In May 2026, third-party profiles report that
      Celonis launched the Context Model and agreed to acquire Ikigai Labs.
      That transaction is the newest concrete strategic milestone in the
      assigned evidence. No assigned source establishes a newer financing
      valuation, audited financial performance, a complete post-2022
      capitalization record, or a comprehensive adverse-event chronology, so
      none is inferred from silence.
    claimRefs:
      - "CO003"
      - "CO011"
      - "CO016"
    figureRefs:
      - "FO001"
