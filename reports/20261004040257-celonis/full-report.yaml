      - CV001
      - CV005
      - CV006
      - CV013
      - CV014
      - CV016
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Argument
      - Evidence-supported view
      - What would change the view
    rows:
      - - Product relevance
        - Celonis describes a cross-system process-intelligence layer for enterprise operations and AI.
        - Independent win-rate, usage, and renewal evidence would confirm or weaken the positioning.
      - - Commercial scale
        - Company materials report 1,400+ organizations and 3,000+ employees.
        - Audited recurring revenue, retention cohorts, and customer concentration would test economic scale.
      - - Capital access
        - The 2022 package combined preferred equity with a large revolving facility.
        - Facility draw history, covenants, net debt, and liquidity would show whether capacity became leverage.
      - - Price support
        - The last corroborated preferred-equity mark is nearly $13B from August 2022.
        - >-
          A recent arm's-length financing, secondary trade, or filing-supported valuation would establish a current
          anchor.
    notes: >-
      Company-issued adoption and product statements are not treated as independent validation; financing amounts
      preserve the distinction between equity and credit capacity.
