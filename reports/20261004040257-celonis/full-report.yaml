            title: Strategic Positioning as the Context Layer for Enterprise AI
            body: >-
              Celonis is positioning its customer base to adopt the Celonis Context Model, moving beyond historical
              process visualization into real-time operational grounding for autonomous AI agents, thereby expanding
              annual customer contract value into strategic enterprise AI budgets.
            calloutType: insight
            claimRefs:
