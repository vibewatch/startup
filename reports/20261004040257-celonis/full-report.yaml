  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Enterprise Spend Scope, and Category Subsumption
        blocks:
          - type: paragraph
            body: >
              Defining the addressable market for Celonis requires decoupling the core Process Mining and Process
              Intelligence software category from adjacent enterprise automation and IT infrastructure markets [CM001].
              At its foundation, Celonis operates as an analytical and orchestration intelligence layer that extracts,
              transforms, and analyzes event-log data generated by transactional core platforms such as SAP ERP, Oracle,
              and ServiceNow [CM001, CM002]. Included software spend covers event log extraction, object-centric process
              mining (OCPM), visual process discovery, conformance checking, automated root-cause diagnosis, and
              business rule simulation [CM002, CM008]. Spend on task-level desktop recording, basic business process
              modeling notation (BPMN) documentation, and standalone workflow diagramming is frequently subsumed or
              treated as adjacent tooling [CM002, CM004].


              Critically, the market boundary strictly excludes robotic process automation (RPA) runtime bots, core
              enterprise resource planning (ERP) database licenses, and bespoke operational execution engines that
              perform write-backs on legacy databases [CM001, CM003]. While Celonis has positioned its Execution
              Management System (EMS) and Process Intelligence Graph to orchestrate operational interventions,
              enterprise diligence reveals an inherent structural boundary: Celonis functions primarily as an
              observation and diagnostic intelligence engine rather than a transaction execution environment [CM003].
              When operational breakdowns are detected—such as invoice discrepancies or procurement
              bottlenecks—enterprises must either deploy human specialists, standalone RPA bots from vendors like
              Automation Anywhere or UiPath, or specialized autonomous execution agents like Noxus [CM003, CM004]. This
              fundamental boundary between process insight and operational action governs Celonis's market sizing and
              separates raw discovery software from the broader automation universe [CM003].
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM010
      - number: '2.2'
        title: Market Sizing Lenses, Growth Projections, and Estimation Friction
        blocks:
          - type: paragraph
            body: >
              Evaluating market size for Celonis demands disciplined multi-lens segmentation rather than accepting
              broad, unconstrained enterprise automation market projections [CM005, CM012]. Industry sizing generally
              evaluates process intelligence across three concentric boundaries: the Total Addressable Market (TAM) of
              enterprise IT optimization, business operations analytics, and workflow automation; the Serviceable
              Addressable Market (SAM) consisting of dedicated Process Mining and Process Intelligence software
              platforms; and the Serviceable Obtainable Market (SOM) constrained by Celonis's high ACV, cloud-first
              architecture, and large-enterprise focus [CM005, CM006].


              The broad TAM encompasses over $30B in global enterprise spend across business process analysis,
              automation software, and digital transformation tooling [CM005]. However, the direct SAM for dedicated
              process mining software represents a much more constrained slice, historically expanding at high
              double-digit rates from approximately $1B toward $3B to $5B as global 2000 enterprises ingest multi-system
              event logs [CM005, CM006]. Celonis's addressable SOM is further bounded by its operational prerequisites:
              the platform requires substantial event log data volumes, dedicated internal Centers of Excellence (CoEs),
              and heavy professional services investments [CM006, CM007]. Mid-market enterprises and companies with
              single-instance standard ERP stacks frequently find Celonis's data-volume consumption pricing prohibitive,
              turning instead to lightweight desktop alternatives or native ERP modules [CM006, CM007]. Consequently,
              Celonis's addressable opportunity is concentrated within roughly 5,000 to 10,000 global enterprise
              accounts with annual IT budgets capable of absorbing seven-figure annual software commitments [CM005,
              CM006, CM010].
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM010
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM010
              - CM012
      - number: '2.3'
        title: Buyer Personas, Payer Segmentation, and Budget Ownership
        blocks:
          - type: paragraph
            body: >
              Enterprise procurement of Celonis process intelligence software does not follow a uniform, monolithic
              buying pathway; instead, it involves fragmented organizational personas across enterprise IT, corporate
              finance, and global supply chain operations [CM007, CM008]. In major deployments, the primary economic
              buyer is typically the Chief Information Officer (CIO), Chief Technology Officer (CTO), or Chief
              Transformation Officer, who sponsors the strategic deployment of the Celonis Process Intelligence Platform
              to de-risk core IT modernizations, such as SAP S/4HANA migrations, and establish unified data models
              [CM007, CM008]. However, functional budget ownership frequently resides within business unit leadership,
              specifically Chief Procurement Officers (CPOs) managing global spend leakage, Chief Supply Chain Officers
              (CSCOs) mitigating working capital disruption, and Corporate Controllers optimizing accounts payable and
              working capital cycle times [CM007, CM009].


              The adoption path generally initiates with a high-impact, single-domain proof-of-concept focused on
              Order-to-Cash (O2C) or Procure-to-Pay (P2P), where Celonis can quickly quantify tangible cash leakage,
              touchless invoicing rates, or duplicate payment risks [CM008, CM009]. Once initial value is demonstrated,
              enterprise accounts typically establish a centralized Process Center of Excellence (CoE) staffed by
              dedicated data engineers, process analysts, and value architects who build and maintain data pipelines
              connecting core ERP instances to Celonis [CM007, CM008]. Recent product integrations, such as embedding
              Celonis Process Intelligence into Coupa's autonomous spend management marketplace, illustrate how buyer
              dynamics are evolving: functional procurement teams can now access Celonis context through specialized
              SaaS partner ecosystems rather than standalone IT implementations alone [CM009].
            claimRefs:
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
      - number: '2.4'
        title: Enterprise Growth Catalysts, Adoption Constraints, and Diligence Realities
        blocks:
          - type: paragraph
            body: >
              Celonis benefits from significant macro-level structural growth drivers across the enterprise software
              landscape, headed by the urgent corporate demand to operationalize Enterprise AI and autonomous agents
              [CM008, CM009]. Large language models and autonomous AI agents require deep operational context and
              accurate system-of-record event mapping to execute business workflows without hallucination or compliance
              failure; Celonis positions its Process Intelligence Graph as the necessary contextual ground truth for
              enterprise agents [CM008, CM009]. Simultaneously, ongoing core modernization pressures, such as multi-year
              SAP S/4HANA cloud migration programs, create massive demand for process discovery to separate
              differentiated custom code from technical debt [CM008, CM010].


              Conversely, adoption velocity is constrained by severe structural frictions documented in market reviews
              [CM006, CM007, CM011]. Celonis's licensing architecture, heavily anchored in data ingestion volumes rather
              than predictable flat seat counts, creates unpredictability in total cost of ownership (TCO) that alarms
              corporate procurement teams [CM006, CM007]. Furthermore, implementation complexity remains substantial:
              configuring custom data pipelines, extracting event logs from customized legacy systems, and tuning data
              transformation models often requires weeks to months of specialist consulting support [CM006, CM007]. Data
              security represents an additional critical bottleneck: because Celonis operates primarily as a
              multi-tenant cloud platform, highly regulated enterprises in defense, healthcare, and banking frequently
              struggle with compliance restrictions regarding the export of sensitive operational logs outside corporate
              firewalls [CM007]. Finally, unresolved diligence gaps regarding private ARR growth rates and exact
              customer retention metrics require investors to discount headline market TAM figures against verified
              operational conversion realities [CM011, CM012].
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Observation Versus Execution Boundary
            body: >
              Enterprise diligence highlights a critical conceptual boundary in process intelligence: Celonis excels at
              diagnosing process bottlenecks and non-conformance from event logs, but resolving those issues requires
              separate execution infrastructure. Platforms that move directly from diagnostic insight to automated case
              resolution define the next competitive frontier for enterprise operations.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
          - type: callout
            title: Mid-Market Exclusion and Pricing Vulnerability
            body: >
              Celonis's consumption model, which indexes licensing fees to data ingestion volume rather than per-seat
              metrics, creates significant total-cost-of-ownership friction. This licensing model effectively excludes
              mid-market organizations and exposes Celonis to displacement by agile alternatives offering flat-rate
              pricing or native ERP bundling.
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Market Landscape and Categorization of Competitors
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape surrounding Celonis spans four distinct tiers: direct process mining and process
              intelligence platforms, incumbent enterprise software conglomerates, robotic process automation (RPA)
              suites expanding into discovery, and status-quo manual consulting engagements. Celonis pioneered
              commercial process mining starting in 2011 and maintains category leadership with over 1,400 enterprise
              customers [CP001, CP002, CP005]. Analyst evaluations place Celonis in the top position for execution and
              completeness of vision in process mining [CP003, CP004]. However, the vendor faces direct competition from
              dedicated peers such as Apromore Enterprise Edition, ARIS by Software AG, and ABBYY Timeline [CP003,
              CP008]. Concurrently, enterprise software incumbents including SAP (with SAP Signavio and BusinessObjects)
              and IBM Process Mining (leveraging watsonx) seek to bundle process analysis into broader ERP and cloud
              subscriptions [CP003, CP006, CP008, CP009]. In response, Celonis maintains a dedicated competitive
              intelligence function tracking adjacent technological categories like process orchestration, enterprise
              architecture, and data analytics [CP007].
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
