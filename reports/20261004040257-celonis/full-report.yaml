    data:
      layers:
        - label: Application & Execution Layer
          detail: >-
            User-facing analytics dashboards, prebuilt functional execution apps (AP, AR, Procurement, Order
            Management), and Celonis Assistant AI recommendations.
          modules:
            - Accounts Payable App
            - Order Management App
            - Procurement Analytics
            - Celonis Studio
        - label: Operational Action & Automation Layer
          detail: >-
            Automated trigger execution and bidirectional workflow integration pushing remediation tasks back into ERP
            systems.
          modules:
            - Action Engine
            - Workflow Automation Triggers
            - Task Routing
        - label: Semantic Context Layer
          detail: >-
            Celonis Context Model (CCM) and Process Intelligence Graph maintaining dynamic, system-agnostic digital
            twins of end-to-end workflows.
          modules:
            - Process Intelligence Graph
            - Object-Centric Process Models
            - Digital Twin State Engine
        - label: Analytics & Query Execution Engine
          detail: >-
            StarRocks vectorized OLAP cluster executing Process Query Language (PQL) multi-table joins, array-first
            event log operations, and sorted aggregations.
          modules:
            - StarRocks Cost-Based Optimizer
            - PQL Query Planner
            - Array-First Native Functions
        - label: Data Transformation & Storage Lakehouse
          detail: >-
            Normalizes raw ERP data models into intermediate business objects and event logs using PostgreSQL CDC,
            Apache Iceberg, and Parquet storage.
          modules:
            - Apache Iceberg Lakehouse
            - PostgreSQL CDC Pipeline
            - Parquet Event Logs
        - label: Data Ingestion & Connectivity Core
          detail: >-
            Hybrid batch extraction and real-time streaming infrastructure connecting across enterprise source systems
            on AWS, Azure, and GCP.
          modules:
            - JDBC Database Connectors
            - SAP Table Extractors
            - Apache Kafka Event Streaming
