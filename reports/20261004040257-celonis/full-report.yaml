        blocks:
          - type: paragraph
            body: >-
              The disclosed chronology shows a conventional venture-to-late-stage financing path: Series A in 2016,
              Series B in 2018, Series C in 2019, Series D in 2021, and an equity extension plus debt package in 2022.
              Product positioning has since shifted toward supplying operational context for enterprise AI while
              retaining process mining as the underlying category. In May 2026, third-party profiles report that Celonis
              launched the Context Model and agreed to acquire Ikigai Labs. That transaction is the newest concrete
              strategic milestone in the assigned evidence. No assigned source establishes a newer financing valuation,
