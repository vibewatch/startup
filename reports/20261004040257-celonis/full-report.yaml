            figureRef: FV001
            claimRefs:
              - CV002
              - CV008
              - CV010
              - CV013
              - CV014
              - CV016
      - number: '8.2'
        title: Financing and price context
        blocks:
          - type: paragraph
            body: >-
              The strongest price anchor is historical. In August 2022 Celonis announced a $400 million Series D
              extension at a nearly $13 billion post-money valuation, alongside a revolving credit facility with a $500
              million line expandable to $600 million. The credit capacity is not equivalent to equity funding, cash on
              hand, or an amount actually drawn. Aggregate funding figures also use inconsistent conventions: Tracxn
              reports $1.77 billion across six rounds, while TechCrunch and GetLatka report $2.4 billion after the 2022
              package. The discrepancy should remain unresolved until the instruments and draw history are reconciled.
              Secondary access is restricted, and the assigned evidence supplies no issuer-specific transaction evidence
              that establishes a current market-clearing equity value.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV014
      - number: '8.3'
        title: Bull, base, and bear cases without false precision
        blocks:
          - type: paragraph
            body: >-
              A quantitative return model would require current audited revenue or ARR, growth, gross margin, retention,
              free cash flow, net debt, fully diluted ownership, and preference terms. None is established by the
              assigned public evidence. GetLatka's $771 million annual-revenue estimate for 2023 is useful only as a
              diligence lead, not as audited revenue or ARR. The bull case is a validated operating inflection plus a
              financing or listing that supports the old preferred mark; the base case is continued product relevance
              with no defensible public price; and the bear case is weaker metrics or financing terms that subordinate
              or dilute new common equity. No valuation range or scenario probability is assigned because doing so would
              manufacture precision from missing denominators.
            claimRefs:
              - CV005
              - CV007
              - CV010
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence gates, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              CNBC reported in 2021 that Celonis appointed a new chief financial officer ahead of an anticipated IPO,
              but that historical signal is not evidence of present listing readiness. A current decision requires an
              audited financial pack, cohort retention, customer concentration, net debt and facility utilization, the
              fully diluted cap table, liquidation preferences, and recent arm's-length secondary or primary pricing. It
              also requires directly comparable public-company or transaction data matched on recurring-revenue
              definition, growth, margin, and period. Thesis-break signals are audited growth or retention materially
              below the investment case, negative free-cash-flow durability that requires punitive financing, senior
              terms that impair common-equity returns, or continued inability to establish a current price. Until those
              checks clear, exit timing and target returns are gaps rather than forecastable outputs.
            claimRefs:
              - CV006
              - CV011
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline dominates the decision
            body: >-
              Celonis may be an attractive enterprise-software company, but the assigned evidence does not establish a
              current fair value or an investable security price. Track the company and require audited operating
              metrics, capitalization terms, and arm's-length price discovery before underwriting returns.
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV014
              - CV016
