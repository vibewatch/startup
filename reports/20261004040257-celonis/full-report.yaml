      - number: '6.2'
        title: Adoption Trajectory, Rollout Velocity, and Expansion Dynamics
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory of Celonis across enterprise accounts demonstrates steady expansion in total
              enterprise account count, growing from early marquee customer traction to more than 1,400 global
              enterprise organizations. Initial customer engagements typically originate as targeted, 8-to-14-week
              pilots scoped tightly around a single high-friction business process, such as accounts payable invoice
              duplicate detection or automated credit block removal in order management. Following demonstrable pilot
              success—frequently yielding initial cash flow or cycle-time improvements within 3 to 6 months—enterprises
              face a critical inflection point in scaling toward an enterprise-wide Center of Excellence (CoE).
              Organizations that institutionalize standard data pipelines and cross-functional process governance
              successfully scale process mining across supply chain planning, inventory management, and IT service
              management. Conversely, deployments that treat Celonis strictly as a diagnostic dashboard rather than an
              operational intervention engine experience stalled rollouts, prolonged implementation cycles extending to
              9 to 18 months, and organizational resistance when hidden cross-departmental inefficiencies and approval
              rework loops surface.
            claimRefs:
              - CU001
