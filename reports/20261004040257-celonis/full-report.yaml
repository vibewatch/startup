        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Founder influence remains unusually visible. Independent profiles list Rinke and Nominacher as co-chief
              executives, Klenk as founder and chief technology officer, and Rinke and Nominacher as the two active
              board members. A broader leadership snapshot adds named executives for customer and ecosystem management,
              people and culture, and legal and trust functions, indicating functional coverage beyond the founding
              team. Even so, the allocated evidence does not include constitutional documents, voting rights, a complete
              board roster from a primary filing, succession plans, or ownership percentages. Crustdata's mapped
              organization also characterizes median leadership tenure as two years and moderate turnover. These
              limitations make founder concentration and executive continuity material diligence questions rather than
              proven governance failures.
