  - id: TV001
    title: Recommendation summary
    columns:
      - Decision dimension
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Track / research more
        - Strategic and scale signals exist, but current audited operating inputs do not.
        - Do not underwrite a primary or secondary purchase from the 2022 mark alone.
      - - Confidence
        - Medium
        - The 2022 financing is corroborated; the present equity value is not.
        - Confidence can rise after audited metrics and current arm's-length pricing.
      - - Risk rating
        - High information risk
        - Debt utilization, preference terms, retention, margins, and cash generation are undisclosed here.
        - Require a full financial and capitalization diligence package.
      - - Valuation stance
        - Unanchored
        - Nearly $13B is a historical post-money mark from August 2022.
        - Treat it as context, not a current fair-value conclusion.
      - - Return / exit view
        - Not supportable from public evidence
        - No current audited base, entry security terms, or validated exit multiple is available.
        - Defer target return and exit timing until the missing denominators are supplied.
    notes: >-
      Evidence is limited to the assigned public sources; no audited operating pack, current transaction mark, or
      security terms were available.
