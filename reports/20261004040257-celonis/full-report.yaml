      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: High Total Cost of Ownership and Ecosystem Counterparty Exposure
            body: >-
              Independent procurement analysis highlights that Celonis entails material ongoing operational overhead
              beyond software licenses, driven by complex event-log extraction, specialized data engineering
              requirements, and significant Center of Excellence consulting costs. Furthermore, because Celonis operates
              primarily as an analytical layer over third-party enterprise suites like SAP and Oracle, long-term
              franchise defensibility depends heavily on uninterrupted partner API access and enterprise willingness to
              sustain premium custom software commitments.
            calloutType: risk
            claimRefs:
              - CR003
