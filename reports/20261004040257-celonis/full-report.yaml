      - number: '6.3'
        title: Named Customer Proof, Retention Durability, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              Celonis documents substantial, multi-industry customer proof across world-class industrial, aerospace,
              healthcare, and technology enterprises, including public case references such as ExxonMobil, 3M, Merck,
              Lockheed Martin, and Uber, with its 2026 Champions Squad attributing over $1.5 billion in cumulative
              realized business value across 24 leading accounts. Furthermore, major technology partners and digital
              leaders utilize modern composable architectures to accelerate digital workflows and scale marketing
              operations alongside enterprise process mining. Nevertheless, significant diligence vulnerabilities remain
              regarding long-term customer retention and expansion economics. Celonis does not publicly report audited
              Net Revenue Retention (NRR), Gross Revenue Retention (GRR), customer cohort survival curves, or annual
              logo churn figures. Third-party implementation field analyses and user sentiment indicate that high annual
              subscription costs, coupled with substantial ongoing data engineering maintenance, create renewal friction
              if organizations fail to actively automate process interventions. In the absence of audited retention
              metrics, investors cannot independently determine whether high reported annual revenue growth is driven by
              healthy expansion within mature cohorts or masked by aggressive new logo acquisition.
