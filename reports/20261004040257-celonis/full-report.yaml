  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Investment view: attractive company, unanchored entry price'
        blocks:
          - type: paragraph
            body: >-
              Celonis presents a credible strategic thesis but not a presently underwritable valuation. The company says
              more than 1,400 organizations use its platform, its careers site reports more than 3,000 employees, and
              its product materials describe a system-agnostic operational data layer intended to give enterprise AI
              business context. Those signals support relevance and organizational scale, but they do not establish
              revenue quality, retention, margins, or cash generation. The recommendation is therefore track / research
              more, with medium confidence, high information risk, and a valuation stance of unanchored rather than a
              buy call. Entry should wait for audited metrics and security-specific terms instead of treating company
              quality as proof that the 2022 price remains fair.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV013
              - CV015
              - CV016
