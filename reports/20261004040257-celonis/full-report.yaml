chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Celonis was founded in 2011 by Alexander Rinke, Bastian Nominacher, and Martin Klenk. An independent
              profile identifies the legal entity as Celonis SE and describes Munich as the corporate headquarters with
              a United States base in New York; another independent dataset likewise characterizes Munich and New York
              as dual headquarters. The company sells process-mining and process-intelligence software that extracts
              operational data from enterprise systems, adds business context, and represents workflows as a
              system-agnostic digital twin. Celonis now positions that context layer as infrastructure for analyzing,
              redesigning, and operating AI-assisted processes. The model is therefore enterprise software rather than a
              services-only business, although the allocated evidence does not disclose current pricing, contract mix,
              or recurring-revenue composition.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
