      - number: '7.3'
        title: Platform Counterparty Dependencies and Total Cost of Ownership
        blocks:
          - type: paragraph
            body: >-
              Celonis maintains critical structural dependencies on third-party enterprise platforms, most notably SAP,
              Oracle, Salesforce, and major public cloud providers. Because process mining operates as an analytical
              system of insight rather than the underlying transactional system of record, Celonis depends on open
              application programming interfaces, stable connector pipelines, and non-hostile ecosystem access from the
              very enterprise vendors whose software suites it inspects. On the commercial side, Celonis commands
              premium enterprise subscription commitments, typically structured as opaque custom contracts with entry
              packages starting at six figures ($150,000 to over $300,000 annually) and escalating sharply based on
              processing volume, connector breadth, and user counts. When paired with external systems integrator
              services and internal support engineering, high total cost of ownership creates budget vulnerability
              during macroeconomic contractions and enterprise software rationalization reviews.
            claimRefs:
              - CR006
              - CR007
