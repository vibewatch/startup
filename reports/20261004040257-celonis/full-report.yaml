  - id: TV003
    title: Bull, base, and bear scenario framework
    columns:
      - Scenario
      - Required assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Audited growth, retention, margins, and cash generation validate durable enterprise-software quality.
        - A current financing or listing supports an entry price that clears an underwritten target return.
        - No numeric probability assigned; signal is audited metrics plus arm's-length price discovery.
        - New financing validates materially weaker economics or imposes senior downside protection.
      - - Base
        - Product relevance and customer scale persist, but public financial disclosure remains incomplete.
        - No defensible valuation range; remain on the watchlist until price and denominators are available.
        - Current evidence best fits this case because operating scale is visible but price support is stale.
        - Extended opacity or an inability to reconcile the capital structure prevents underwriting.
      - - Bear
        - Growth, retention, margins, or cash conversion fall below the prospective investment case.
        - Common-equity value is impaired by dilution, debt, preferences, or a lower market-clearing mark.
        - Signal would be a down round, punitive terms, sustained negative cash flow, or delayed liquidity.
        - A financing need emerges before operating evidence can support the 2022 preferred mark.
    notes: >-
      No valuation ranges or probabilities are estimated because current audited metrics, fully diluted ownership, debt
      draw, and preference terms are unavailable.
    claimRefs:
      - CV005
      - CV007
      - CV011
      - CV012
      - CV013
      - CV014
