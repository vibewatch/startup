  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Compliance Risk Landscape
        blocks:
          - type: paragraph
            body: >-
              Enterprise process mining requires deep event-log ingestion across core enterprise systems of record,
              exposing Celonis to complex global data governance frameworks, cross-border privacy boundaries, and
              customer-mandated compliance controls. As enterprise clients extract granular transactional records from
              enterprise resource planning and customer relationship management databases, employee activity logs and
              vendor interactions cross corporate and jurisdictional perimeters. Furthermore, the commercial process
              intelligence market has expanded rapidly into an intensely competitive arena, with market trackers
              cataloging over 1,480 active category competitors, including dozens of funded vendors and strategic
              consolidation acquirers. Celonis's legal risk profile requires ongoing diligence into intellectual
              property defenses, trade secret protections, and compliance with emerging AI governance mandates such as
              the European Union AI Act. Maintaining comprehensive enterprise-grade access logging, least-privilege
              role-based security, and strict data isolation is essential to prevent compliance drift and mitigate
              customer data exposure liability.
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR013
      - number: '7.2'
        title: Operational, Engineering, and Implementation Overhead
        blocks:
          - type: paragraph
            body: >-
              Operational deployment friction represents a central execution risk in enterprise process intelligence
              implementations. Independent procurement and technical assessments highlight that implementing Celonis
              requires substantial data engineering bandwidth, extensive data cleansing, and specialized model
              architecture before actionable insights materialize. Organizations frequently encounter extended
              implementation runways spanning multiple months, during which data preparation bottlenecks and
              inconsistent source logs threaten project momentum and return on investment. Furthermore, once analytical
              findings are generated, organizations must enforce dedicated change management and operational governance
              to convert analytical process bottlenecks into sustained workflow adaptations. Without closed-loop
              operational workflows and dedicated Center of Excellence staffing, enterprise buyers risk treating process
              intelligence as passive retrospective reporting rather than an active operational steering mechanism.
            claimRefs:
              - CR003
