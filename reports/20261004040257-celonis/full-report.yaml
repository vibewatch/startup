      - number: '4.2'
        title: GTM Motion, Sales Efficiency Proxies, and Delivery Cost Structure
        blocks:
          - type: paragraph
            body: >
              The go-to-market motion at Celonis is predominantly direct enterprise sales supported by global system
              integrators, advisory networks, and specialized platform engineers. Customer acquisition in large-scale
              process intelligence typically exhibits lengthy sales cycles ranging from 6 to 12 months, driven by
              multi-stakeholder evaluations spanning enterprise architecture, data security, procurement, and
              line-of-business process owners. To drive deployment velocity and land-and-expand mechanics, the company
              maintains extensive enablement structures including the Celonis Academy, dedicated Solutions Architects,
              and customer value architects focused on proving realized business impact.


              From a cost-structure perspective, gross margin drivers reflect typical enterprise cloud software
              dynamics, offset by data ingestion intensity and high-touch technical delivery. While pure SaaS platforms
              often achieve 75% to 80%+ subscription gross margins, Celonis's need for continuous event-log ingestion,
              complex transformation pipelines, and persistent data synchronization with disparate enterprise backends
              introduces non-trivial cloud compute and hosting expenses. Furthermore, enterprise deployments frequently
              require substantial pre-sales proof-of-value engineering and post-sales partner implementation support,
              creating service-delivery drag that can depress blended margins if professional services are subsidized to
              secure competitive software wins.
            claimRefs:
              - CI003
              - CI005
              - CI006
              - CI007
              - CI013
      - number: '4.3'
        title: Capital Adequacy, Financing Structure, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >
              Celonis possesses a substantial cumulative funding base, having raised $1.77B in aggregate equity
              financing alongside a $600M credit and conventional debt facility secured in August 2022 from an
              international banking syndicate including Goldman Sachs, J.P. Morgan, Morgan Stanley, Citi, HSBC, and
              KeyBank. The company's capitalization history reached a headline $13B post-money valuation in its August
              2022 Series D extension led by the Qatar Investment Authority, which followed a $1B Series D round in June
              2021 co-led by Durable Capital Partners and T. Rowe Price Associates valuing the business at $11B.


              Despite these substantial aggregate financing proceeds, the business model carries significant diligence
              questions regarding ongoing cash burn, debt service, and operating profitability. While historical
              commentary during earlier funding rounds claimed operational profitability in the startup's early
              bootstrapped years, later rapid headcount expansion across more than 20 global offices and 3,000+
              employees, alongside significant enterprise marketing and AI engineering investments, has elevated
              operational fixed overhead. Furthermore, the presence of a $600M debt facility indicates material ongoing
              liquidity management and financing dependency. For prospective underwriters and late-stage investors, the
              complete absence of audited public disclosures regarding ARR, NRR, net operating margins, and cash burn
              profiles represents an insurmountable diligence gap that prevents definitive underwriting without access
              to private confidential data rooms.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
