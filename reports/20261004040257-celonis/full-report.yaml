      - number: '5.3'
        title: Product Line Modules, Business Solutions, and Workflow Use Cases
        blocks:
          - type: paragraph
            body: >-
              The Celonis application suite delivers specialized functional modules targeting horizontal operational
              domains and vertical enterprise use cases. Key functional modules include Accounts Payable (AP), Accounts
              Receivable (AR), Procurement, Order Management, and Inventory Management. Within Accounts Payable, Celonis
              tracks the end-to-end lifecycle of purchase requisitions, invoices, and payment disbursements,
              automatically detecting uncaptured early-payment discounts and duplicate payments prior to cash
              disbursement. In Order Management, the software identifies order holds, manual touchpoints, and delivery
              blocks that prolong lead times and depress customer satisfaction.


              Beyond diagnostic analytics dashboards, Celonis provides operational execution apps and automation
              capabilities. Users deploy process intelligence solution views, prebuilt process transformation templates,
              and action triggers that feed remediation tasks back into ERP workflows. Recent product releases introduce
              conversational AI capabilities, including the Celonis Assistant, which analyzes operational metrics to
              recommend relevant analysis modules, propose targeted process improvement use cases, and generate
              step-by-step implementation guidance for enterprise transformation teams.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE007
              - CE008
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Deployment, Ecosystem Integration, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              Celonis is deployed primarily as a multi-tenant and dedicated cloud SaaS platform hosted on hyperscaler
              infrastructure (AWS, Microsoft Azure, and Google Cloud Platform). Successful enterprise production
              rollouts demand significant technical integration and consulting resources. Enterprise Architect and
              Solution Engineering teams collaborate with systems integrators and ecosystem consulting partners to
              assess client IT landscape maturity, configure extraction pipelines from legacy on-premise systems,
              establish data governance boundaries, and tune data models for query efficiency.


              Technical and operational risks center on integration maintenance, query latency degradation on extreme
              data volumes, and ERP vendor dependency. Extracting event logs from complex ERP environments requires
              continuous maintenance of custom data models, schema mappings, and table transformation logic. When client
              data models scale beyond 20 to 30 billion rows, P90 query latencies can stretch toward 20 seconds even
              under optimized StarRocks clustering, necessitating careful workload isolation via resource groups.
              Furthermore, because Celonis relies heavily on extracting transactional data from proprietary enterprise
              software like SAP and Oracle, changes in upstream API access policies, data export fees, or competitive
              positioning from ERP-native process mining tools present ongoing integration and channel risks.
            claimRefs:
              - CE001
              - CE006
              - CE011
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Process Mining as an Extreme Join-Density Challenge
            body: >-
              Unlike traditional data warehousing where dimensional modeling pre-aggregates facts into denormalized star
              schemas, process mining query semantics in PQL dynamically compose queries that regularly join dozens to
              over 100 tables simultaneously. Celonis's custom integration of StarRocks with collocated joins, custom
              array cost estimators, and sorted streaming aggregation addresses this structural bottleneck, unlocking
              sub-2-second query response times across 20-billion-row operational datasets without incurring the massive
              maintenance and storage overhead of permanent denormalization.
            calloutType: insight
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
          - type: callout
            title: Technical Dependency on Upstream ERP Architectures
            body: >-
              Because the Celonis platform relies on reconstructing event logs from source transaction tables
              (principally SAP and Oracle ERP estates), its operational efficacy is directly tethered to the
              accessibility, schema stability, and licensing terms of host enterprise systems. Technical changes in host
              ERP database schemas, network egress limits, or restrictive vendor access policies represent an ongoing
              operational risk requiring sustained professional services engineering.
            calloutType: risk
            claimRefs:
              - CE001
              - CE006
              - CE011
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Enterprise Buyer Profile and Customer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Celonis concentrates its commercial go-to-market primarily on global Global 2000 multinational
              corporations, large financial institutions, industrial manufacturers, and healthcare enterprises operating
              heterogeneous, mission-critical transactional ERP systems including SAP, Oracle, and ServiceNow.
              Enterprise procurement is sponsored by senior functional leaders—predominantly Chief Financial Officers,
              Chief Operating Officers, and Chief Information Officers—who target working capital optimization,
              cash-flow cycle acceleration, and operational overhead reduction across high-volume transaction cycles
              like Order-to-Cash (O2C) and Procure-to-Pay (P2P). Because process intelligence requires establishing
              direct, high-throughput database extraction connectors into core enterprise transactional databases, the
              platform naturally filters toward accounts possessing substantial operational complexity and IT maturity
              capable of managing extensive data readiness and governance requirements. Consequently, Celonis exhibits
              pronounced deal-size concentration in large-scale six-figure to seven-figure annual enterprise
              subscription contracts, where deployment yields measurable balance sheet impact such as
              day-sales-outstanding compression and invoice rework elimination, but leaves smaller middle-market
              accounts comparatively underserved due to steep initial engineering integration overhead.
            claimRefs:
              - CU001
              - CU002
              - CU003
