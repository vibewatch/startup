              - CI010
              - CI011
              - CI014
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Private Disclosure Gap on Audited Core SaaS Metrics
            body: >-
              Celonis maintains a private reporting profile with no audited public disclosures of core financial
              performance metrics, including annual recurring revenue (ARR), net revenue retention (NRR), customer
              acquisition cost (CAC) payback, or cash burn rate. Third-party vendor estimates (such as GetLatka's $771M
              ARR estimate for 2023) remain uncorroborated by official filings and cannot serve as underwriting inputs.
            calloutType: risk
            claimRefs:
              - CI011
              - CI014
              - CI015
          - type: callout
            title: Substantial Financing Runway Offset by $600M Debt Facility
            body: >-
              The execution of a $600M conventional credit facility alongside its Series D equity financing provides
              significant non-dilutive liquidity for strategic acquisitions and enterprise expansion. However, carrying
              major institutional debt obligations requires rigorous evaluation of EBITDA generation and debt covenant
              compliance under macroeconomic or sales cycle stress.
            calloutType: insight
            claimRefs:
              - CI009
              - CI010
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Workflow Operating Model
        blocks:
          - type: paragraph
            body: >-
              Celonis operates as an enterprise Process Intelligence platform designed to eliminate operational friction
              and value leakage across core business processes such as Procure-to-Pay, Order-to-Cash, and Supply Chain
              execution. Rather than relying on static process documentation or manual consulting interviews, the
              platform connects directly to transactional source systems including SAP ERP, Oracle, Salesforce, and
              ServiceNow to extract operational logs and digital footprints. These events are mapped into object-centric
              and case-centric event logs that capture ordered sequences of business activities alongside timestamps and
              operational attributes.


              At the foundation of this operating model sits the Celonis Context Model (CCM), which functions as a
              real-time, system-agnostic digital twin of enterprise operations. The Context Model synthesizes raw
              transactional data, domain business logic, and cross-application relationships to represent how business
              workflows actually execute in practice. This operational layer enables business analysts, process owners,
              and automated enterprise AI agents to pinpoint deviations, uncover root causes of bottlenecks, predict
              cycle-time slippage, and simulate what-if remediation scenarios across disparate application estates.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE007
              - CE012
              - CE013
      - number: '5.2'
        title: Architecture, Data Ingestion, and the StarRocks Query Engine
        blocks:
          - type: paragraph
            body: >-
              The Celonis software architecture is structured into a multi-tier pipeline spanning the Data Core, the
              Processing and Analytics Core, and the Application Layer. Data ingestion supports both batch extraction
              and real-time streaming architectures. In enterprise production environments, data engineering pipelines
              leverage JDBC connectors for relational databases, dedicated extractors for ERP systems, change data
              capture (CDC) pipelines via PostgreSQL/Iceberg ecosystems, and Apache Kafka for low-latency streaming of
              transactional events into the Celonis cloud.


              A central technical challenge in process mining is query complexity and join density. User-facing
              interactions in Celonis are authored using Process Query Language (PQL), an array-aware domain-specific
              query language where users define required analytical columns and the system dynamically computes join
              paths across acyclical join graphs. In real-world enterprise deployments, individual PQL queries routinely
              traverse 10 to over 100 table joins simultaneously, and virtually all analytical queries incorporate heavy
              aggregations over billions of records. To meet strict enterprise dashboard performance targets of
              sub-2-second responsiveness without prohibitively expensive manual denormalization, Celonis adopted and
              customized StarRocks as its low-latency vectorized OLAP execution engine.


              The engineering team extended StarRocks with a cost-based optimizer enhanced for process mining workloads,
              implementing custom cardinality estimators for array structures, column cardinality cost estimation, and
              skew-join handling. StarRocks utilizes collocated joins to co-partition tables sharing common business
              identifiers (such as purchase order numbers), eliminating cross-node data shuffling across distributed
              compute clusters. It also deploys array-first native functions (including array_filter, array_map, and
              array_agg) and sorted streaming aggregation to process ordered event sequences directly in memory without
              costly unnesting cycles.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
