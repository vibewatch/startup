      - number: '1.2'
        title: Scale and capital
        blocks:
          - type: paragraph
            body: >-
              The official homepage says more than 1,400 companies use Celonis, while the careers site says the company
              has more than 3,000 employees across more than 20 offices. Those figures are issuer claims and should not
              be treated as independently verified customer or payroll counts. Third-party workforce datasets are
              directionally consistent with a large global organization but differ on the precise level: Tracxn reports
              4,405 employees and Crustdata reports 4,451 for August and September 2026, respectively. Capital reporting
              is less reconcilable. Tracxn reports $1.77 billion over six rounds, while several independent profile
              sources report $2.4 billion. The $13 billion valuation is tied to the August 2022 financing and is not
              presented here as a current mark. GetLatka's $771 million figure is explicitly an estimated 2023 annual
              revenue measure, not disclosed ARR or cash available.
