  - id: FE001
    title: Celonis 流程智能运营架构
    type: stack
    summary: 六层架构栈展示从企业系统和数据摄取，到 StarRocks 驱动的分析核心、上下文模型和执行应用的演进。
    data:
      layers:
        - label: 应用与执行层
          detail: 面向用户的分析仪表盘、预构建功能执行应用（AP、AR、采购、订单管理）以及 Celonis Assistant AI 建议。
          modules:
            - 应付账款应用
            - 订单管理应用
            - 采购分析
            - Celonis Studio
        - label: 运营行动与自动化层
          detail: 自动执行触发器，并实现双向工作流集成，将补救任务推回 ERP 系统。
          modules:
            - Action Engine
            - 工作流自动化触发器
            - 任务路由
        - label: 语义上下文层
          detail: Celonis Context Model（CCM）与 Process Intelligence Graph，维护端到端工作流的动态、与系统无关的数字孪生。
          modules:
            - Process Intelligence Graph
            - 以对象为中心的流程模型
            - 数字孪生状态引擎
        - label: 分析与查询执行引擎
          detail: StarRocks 向量化 OLAP 集群执行 Process Query Language（PQL）多表连接、数组优先的事件日志操作和排序聚合。
          modules:
            - StarRocks 基于成本的优化器
            - PQL 查询规划器
            - 数组优先原生函数
        - label: 数据转换与存储湖仓
          detail: 借助 PostgreSQL CDC、Apache Iceberg 和 Parquet 存储，将原始 ERP 数据模型标准化为中间业务对象和事件日志。
          modules:
            - Apache Iceberg 湖仓
            - PostgreSQL CDC 管道
            - Parquet 事件日志
        - label: 数据摄取与连接核心
          detail: 混合批量提取与实时流式基础设施，连接 AWS、Azure 和 GCP 上的企业源系统。
          modules:
            - JDBC 数据库连接器
            - SAP 表提取器
            - Apache Kafka 事件流
    approximationNotes: 这些架构层反映了工程案例研究披露的 Celonis 平台分层结构和 StarRocks 数据库架构。
    claimRefs:
      - CE002
      - CE006
      - CE007
      - CE008
      - CE014
      - CE016
  - id: FU001
    title: Celonis 企业客户采用与扩展旅程图
    type: journey-map
    summary: 从最初发现单流程试点，到建立全企业卓越中心并扩展 AI 上下文模型的分阶段采用路径。
    data:
      items:
        - label: 1. 初步发现与流程选择
          touchpoints:
            - 流程发现评估
            - 高管利益相关方对齐
            - ERP 连接器配置
          detail: 选定一个高交易量工作流，例如 AP 或 P2P。
        - label: 2. 数据准备与管道摄取
          touchpoints:
            - 提取交易时间戳
            - 清理案例 ID 和事件日志
            - 与 IT 负责人验证
          detail: 解决 ERP 主数据差异和事件表缺失问题。
        - label: 3. 流程建模与变体发现
          touchpoints:
            - 重建端到端执行路径
            - 找出返工和瓶颈
            - 生成基线 KPI 指标
          detail: 揭示隐藏的流程变体和审批环节延迟。
        - label: 4. 从洞察到行动的落地
          touchpoints:
            - 配置自动化干预
            - 明确运营责任
            - 设定具体 ROI 目标
          detail: 把仪表盘转成实际运营干预。
        - label: 5. 价值兑现与卓越中心
          touchpoints:
            - 衡量 DSO 和营运资金收益
            - 统一跨部门 KPI
            - 扩展到供应链和 OCPM
          detail: 正式建立 CoE，从初始部门扩展到整个企业。
        - label: 6. 自主代理与 AI 上下文扩展
          touchpoints:
            - 部署 Celonis Context Model
            - 集成企业 AI 代理
            - 编排多系统工作流
          detail: 将实时运营上下文嵌入生成式和预测式 AI。
    approximationNotes: 这些里程碑反映独立流程挖掘实施顾问总结的典型企业部署周期。
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
  - id: FR001
    title: 企业流程智能风险严重度热力图
    type: matrix
    summary: 按影响严重度和发生可能性评估运营、商业、生态和监管等关键风险。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 灾难性影响
          values:
            - label: 全球平台核心遭到攻破
              tone: warning
            - label: 旧 ERP 访问权限终止
              tone: critical
            - label: 生态反垄断禁令
              tone: critical
        - label: 关键影响
          values:
            - label: 大规模企业数据泄露
              tone: warning
            - label: 敌意式连接器弃用
              tone: critical
            - label: 严重数据准备失败
              tone: critical
        - label: 高影响
          values:
            - label: 云安全漏洞
              tone: warning
            - label: ERP 连接器冲突
              tone: critical
            - label: 数据工程额外负担
              tone: critical
        - label: 中等影响
          values:
            - label: 次级竞争压力
              tone: neutral
            - label: TCO 与扩张成本蠕升
              tone: warning
            - label: 静态仪表盘被弃用
              tone: warning
        - label: 中等偏低影响
          values:
            - label: 行动流落地延迟
              tone: neutral
            - label: CoE 人才流失
              tone: warning
            - label: 连接器价格上涨
              tone: warning
        - label: 低影响
          values:
            - label: 常规补丁导致的宕机
              tone: positive
            - label: 顾问型 CoE 人员更替
              tone: neutral
            - label: 轻微合规偏移
              tone: neutral
    notes: 该影响—可能性矩阵梳理了 Celonis 企业部署的主要失效模式。
    claimRefs:
      - CR003
      - CR004
      - CR006
      - CR007
      - CR010
      - CR013
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 现有证据支持战略性关注，但还不足以作出对价格敏感的投资决策。
    data:
      nodes:
        - id: scale
          label: 规模信号
          detail: 1,400+ 家机构和 3,000+ 名员工均为公司自报。
        - id: product
          label: 战略相关性
          detail: 跨系统流程上下文被定位为服务企业运营和 AI。
        - id: historical-mark
          label: 历史价格锚点
          detail: 在 August 2022 的股权扩展轮中，投后估值接近 $13B。
        - id: capital-structure
          label: 资本结构不确定性
          detail: 信贷使用、契约条款、稀释和优先权尚未确定。
        - id: operating-gap
          label: 运营数据缺口
          detail: 当前经审计的收入、留存率、利润率和现金流数据无法取得。
        - id: decision
          label: 继续跟踪 / 深入研究
          detail: 等待经审计的分母数据和当前公平交易价格发现。
      edges:
        - from: scale
          to: product
          label: 支持
        - from: product
          to: historical-mark
          label: 不足以验证
        - from: historical-mark
          to: capital-structure
          label: 需调整以反映
        - from: capital-structure
          to: operating-gap
          label: 叠加放大
        - from: operating-gap
          to: decision
          label: 驱动
    approximationNotes: 仅为定性决策链；节点顺序不代表概率、价值或转化率。
    claimRefs:
      - CV002
      - CV008
      - CV010
      - CV013
      - CV014
      - CV016
