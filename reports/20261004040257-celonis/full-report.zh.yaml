  - id: FM001
    title: 企业流程智能市场规模层级
    type: pyramid
    summary: 同心规模层展示从广义企业自动化支出，到 Celonis 可获得企业市场的漏斗。
    data:
      items:
        - label: 企业自动化 TAM ($30B - $45B)
          value: 40000
          description: 覆盖业务流程建模、RPA 和转型软件的广义企业支出。
        - label: 数字核心现代化 ($12B - $18B)
          value: 15000
          description: 降低复杂 ERP 升级、云迁移和技术债务削减风险的企业 IT 现代化项目。
        - label: 专用流程智能 SAM ($2.5B - $4.5B)
          value: 3500
          description: 面向纯事件日志流程挖掘和对象中心智能软件的可服务市场。
        - label: 全球 2000 强企业板块 ($1.8B - $2.8B)
          value: 2300
          description: 每年具备 IT 软件预算、可部署跨部门流程分析的大型企业组织。
        - label: Celonis 可获得 SOM ($1.0B - $1.8B)
          value: 1400
          description: 受数据量定价、云安全和专用 CoE 要求约束的现实近端市场。
        - label: 核心 O2C 与 P2P 覆盖面 ($600M - $900M)
          value: 750
          description: 订单到现金和采购到付款支出优化工作流中的高密度功能切入口。
    approximationNotes: 数值反映以 USD 百万计的估算市场区间标准化中点；TAM、SAM 和 SOM 是不同的分析视角。
