  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资判断：公司有吸引力，但入场价格缺乏锚点
        blocks:
          - type: paragraph
            body: >-
              Celonis 的战略逻辑可信，但当前估值还不足以支撑投资判断。公司称有超过 1,400 家机构使用其平台，招聘网站显示员工超过 3,000 人，产品材料则将其描述为一层与系统无关、旨在为企业 AI
              提供业务语境的运营数据层。这些信号说明其业务具备相关性且组织规模不小，但无法证明收入质量、留存、利润率或现金创造能力。因此建议跟踪并继续研究，信心中等、信息风险高；估值应视为缺乏锚点，而不是直接买入。应等到审计指标和安全条款明确后再入场，不能把公司质量当成
              2022 年价格仍然公允的证明。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV013
              - CV015
