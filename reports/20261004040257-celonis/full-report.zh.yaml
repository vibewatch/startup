      - number: '5.2'
        title: 架构、数据摄取与 StarRocks 查询引擎
        blocks:
          - type: paragraph
            body: >-
              Celonis 软件架构由多层管道组成，覆盖 Data Core、Processing and Analytics Core 和 Application
              Layer。数据摄取同时支持批量提取和实时流架构。在企业生产环境中，数据工程管道使用关系数据库的 JDBC 连接器、ERP 系统专用提取器、通过 PostgreSQL/Iceberg
              生态实现的变更数据捕获（CDC）管道，以及 Apache Kafka，将交易事件低延迟地流入 Celonis 云。

              流程挖掘的核心技术挑战是查询复杂度和连接密度。Celonis 的面向用户交互使用 Process Query
              Language（PQL）编写；这是一种支持数组的领域专用查询语言，用户定义所需分析列，系统则动态计算无环连接图中的连接路径。在真实企业部署中，单条 PQL 查询通常同时遍历 10 到超过 100
              个表，几乎所有分析查询都要对数十亿条记录执行重聚合。为了达到严格企业仪表盘低于 2 秒的响应目标，同时避免成本高昂的手工反规范化，Celonis 采用并定制 StarRocks 作为低延迟向量化 OLAP
              执行引擎。

              工程团队针对流程挖掘工作负载扩展了 StarRocks，加入成本基础优化器，并实现数组结构的定制基数估算器、列基数成本估计和倾斜连接处理。StarRocks
              使用共置连接，将共享业务标识符（例如采购订单号）的表共同分区，从而消除分布式计算集群中的跨节点数据搬移。它还部署以数组为先的原生函数（包括 array_filter、array_map 和
              array_agg）以及排序流式聚合，在内存中直接处理有序事件序列，避免高成本的展开循环。
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
