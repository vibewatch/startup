        blocks:
          - type: paragraph
            body: >
              Celonis 主要作为企业软件平台运营，通过软件订阅、期限许可以及面向消费量的数据和执行管理扩展实现变现。根据平台披露和行业市场分析，Celonis 通过摄取 SAP、Oracle、NetSuite 和
              Salesforce 等企业 ERP、CRM 及供应链系统中的运营事件日志，来变现其 Process Intelligence Platform 和 Process Intelligence Graph
              的访问权。历史上，该类别的企业软件交易通常要求多年期承诺；历史商业披露显示，财富 500 强企业的初始和扩展合同经常达到七位数年度合同价值。

              商业结构涵盖核心平台订阅、工作流与流程自动化附加项（包括 Action Flows 和 Celonis Process
              Management），以及面向应付账款、应收账款、采购和订单管理等高交易量领域的部门级执行应用。虽然官方定位强调交付可量化的业务
              ROI，但标价和单项指标费率仍不透明，并按客户部署定制。实际中，企业买方面临的合同打包通常包括平台基础费用、数据量或事件流处理能力，以及用户或应用席位分配。
