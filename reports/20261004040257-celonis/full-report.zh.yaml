  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与工作流运营模式
        blocks:
          - type: paragraph
            body: >-
              Celonis 是一个企业流程智能平台，旨在消除 Procure-to-Pay、Order-to-Cash 和供应链执行等核心业务流程中的运营摩擦与价值流失。平台不依赖静态流程文档或人工咨询访谈，而是直接连接
              SAP ERP、Oracle、Salesforce 和 ServiceNow 等交易源系统，提取运营日志和数字足迹。这些事件会被映射为面向对象和面向案件的事件日志，记录业务活动的有序序列、时间戳和运营属性。

              这一运营模式的基础是 Celonis Context Model（CCM），它充当企业运营实时、系统无关的数字孪生。Context Model
              将原始交易数据、领域业务逻辑和跨应用关系合并起来，呈现业务工作流在实际中如何运行。这一运营层让业务分析师、流程负责人和自动化企业 AI
              代理能够定位偏差、找出瓶颈根因、预测周期时间滑移，并在不同应用资产之间模拟假设性补救方案。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
