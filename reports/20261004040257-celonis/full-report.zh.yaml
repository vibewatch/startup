  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 企业买方画像与客户分层
        blocks:
          - type: paragraph
            body: >-
              Celonis 的商业市场进入主要聚焦全球 Global 2000 跨国公司、大型金融机构、工业制造商和医疗企业，这些组织运行着包括 SAP、Oracle 和 ServiceNow 在内的异构、关键任务型交易
              ERP 系统。企业采购由高级职能领导发起，主要是首席财务官、首席运营官和首席信息官；他们希望优化营运资本、加快现金流周转并降低 Order-to-Cash（O2C）和
              Procure-to-Pay（P2P）等高交易量周期的运营开销。由于流程智能需要在核心企业交易数据库中建立直接、高吞吐量的数据提取连接器，平台天然会筛选出运营复杂度和 IT
              成熟度较高、能够管理广泛数据准备与治理要求的客户。因此，Celonis
              的交易规模明显集中于六位数到七位数的年度企业订阅合同；部署可以产生压缩应收账款周转天数、消除发票返工等可量化的资产负债表影响，但较小的中端市场客户因初始工程集成开销高而相对服务不足。
