      - number: '3.3'
        title: 定价模式、总拥有成本与切换成本
        blocks:
          - type: paragraph
            body: >-
              定价和打包既是 Celonis 的变现优势，也是其主要竞争脆弱点。Celonis 采用高端企业 SaaS 订阅模式，不公开标价，企业合同通常要求六位数的年度软件承诺 [CP010, CP014,
              CP015]。除基础许可费外，数据摄取量附加费、连接器费用，以及对系统集成商或内部卓越中心的高度依赖，都会显著推高企业总拥有成本（TCO）[CP014,
              CP015]。评审者经常指出，高成本令中端市场买方或预算受限部门难以建立正向商业案例 [CP010, CP014]。此外，企业买方常常难以推动用户采用，并反馈平台过于复杂，主要面向专职 SME
              和数据科学家，而非一线运营经理 [CP009, CP014]。尽管存在这些采用障碍，一旦面向对象的数据模型、Action Flows 和定制 ERP 连接器嵌入客户运营，切换成本仍然很高，从而对 ABBYY
              Timeline 或开源工具等低成本替代方案形成防御性摩擦 [CP003, CP014]。
            claimRefs:
              - CP003
              - CP009
              - CP010
              - CP014
              - CP015
