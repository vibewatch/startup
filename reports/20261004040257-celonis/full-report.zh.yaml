      - number: '5.3'
        title: 产品线模块、业务解决方案与工作流用例
        blocks:
          - type: paragraph
            body: >-
              Celonis 应用套件提供面向横向运营领域和纵向企业用例的专门功能模块。主要功能模块包括应付账款（AP）、应收账款（AR）、采购、订单管理和库存管理。在应付账款场景中，Celonis
              跟踪采购申请、发票和付款发放的端到端生命周期，在现金支付前自动发现未捕获的提前付款折扣和重复付款。在订单管理中，软件识别订单冻结、人工触点和交付阻塞，这些因素会拉长交付周期并降低客户满意度。

              除诊断分析仪表盘外，Celonis 还提供运营执行应用和自动化能力。用户可以部署流程智能解决方案视图、预置流程转型模板以及将补救任务反馈到 ERP 工作流中的行动触发器。近期产品发布加入了对话式 AI 能力，包括
              Celonis Assistant；它分析运营指标，推荐相关分析模块，提出有针对性的流程改进用例，并为企业转型团队生成分步骤实施指导。
