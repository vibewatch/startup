      - number: '6.3'
        title: 具名客户证明、留存持久性与尽调风险
        blocks:
          - type: paragraph
            body: >-
              Celonis 记录了覆盖世界级工业、航空航天、医疗和科技企业的大量多行业客户证明，包括 ExxonMobil、3M、Merck、Lockheed Martin 和 Uber 等公开案例；其 2026
              Champions Squad 将 24 个领先客户累计实现的业务价值归因于超过 $1.5
              billion。此外，主要技术合作伙伴和数字化领导者利用现代可组合架构，与企业流程挖掘并行加速数字工作流并扩大营销运营。然而，长期客户留存和扩张经济性仍存在重大尽调脆弱点。Celonis
              没有公开报告经审计的净收入留存率（NRR）、总收入留存率（GRR）、客户队列存续曲线或年度 logo
              流失率。第三方实施现场分析和用户情绪表明，高额年度订阅成本加上持续的数据工程维护，会在组织未能积极自动化流程干预时造成续约摩擦。在缺少经审计留存指标的情况下，投资者无法独立判断已报告的高年度收入增长究竟来自成熟客户队列中的健康扩张，还是被激进的新客户获取掩盖。
            claimRefs:
              - CU002
              - CU009
              - CU010
