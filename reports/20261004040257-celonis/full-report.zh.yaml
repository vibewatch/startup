      - number: '5.4'
        title: 部署、生态集成与技术风险
        blocks:
          - type: paragraph
            body: >-
              Celonis 主要以多租户和专用云 SaaS 平台部署，运行在超大规模云基础设施（AWS、Microsoft Azure 和 Google Cloud
              Platform）上。成功的企业生产部署需要大量技术集成和咨询资源。企业架构和解决方案工程团队会与系统集成商及生态咨询伙伴合作，评估客户 IT
              环境成熟度，配置从旧有本地系统提取数据的管道，划定数据治理边界，并调优数据模型以提高查询效率。

              技术和运营风险主要集中在集成维护、极端数据量下查询延迟恶化以及 ERP 厂商依赖。从复杂 ERP 环境提取事件日志，需要持续维护定制数据模型、模式映射和表转换逻辑。当客户数据模型扩展到 20 到 30
              billion 行以上时，即使在优化后的 StarRocks 集群上，P90 查询延迟也可能接近 20 秒，因此必须通过资源组谨慎隔离工作负载。此外，Celonis 高度依赖从 SAP 和 Oracle
              等专有企业软件提取交易数据，因此上游 API 访问政策、数据导出费用或 ERP 原生流程挖掘工具竞争定位的变化，会持续带来集成和渠道风险。
            claimRefs:
              - CE001
              - CE006
              - CE011
              - CE016
      - number: '5.5'
        title: 展示项
        blocks:
          - type: callout
            title: 流程挖掘是极端连接密度挑战
            body: >-
              与通过维度建模将事实预聚合进反规范化星型模式的传统数据仓库不同，PQL 中的流程挖掘查询语义会动态组合查询，经常同时连接几十到超过 100 个表。Celonis 将 StarRocks
              与共置连接、定制数组成本估算器及排序流式聚合相结合，解决了这一结构性瓶颈，使 20-billion-row 运营数据集达到低于 2 秒的查询响应时间，同时避免永久反规范化带来的巨大维护和存储开销。
            calloutType: insight
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
          - type: callout
            title: 对上游 ERP 架构的技术依赖
            body: >-
              由于 Celonis 平台依靠从源交易表（主要是 SAP 和 Oracle ERP 环境）重建事件日志，其运营效果直接取决于宿主企业系统的可访问性、模式稳定性和许可条款。宿主 ERP
              数据库模式变化、网络出口限制或厂商严格的访问政策，都会构成持续的运营风险，需要长期的专业服务工程支持。
            calloutType: risk
            claimRefs:
              - CE001
