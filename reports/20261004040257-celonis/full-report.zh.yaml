      - number: '3.2'
        title: 差异化持久性与架构
        blocks:
          - type: paragraph
            body: >-
              Celonis 试图通过专有技术架构守住竞争护城河，具体包括 Celocore 数据栈、面向对象的流程挖掘（OCPM）和不依赖具体系统的 Process Intelligence Graph [CP004,
              CP010, CP011]。通过在 SAP S/4HANA、Oracle 和 Salesforce 等异构系统之间建立数字孪生，Celonis 希望提供位于交易记录之上的客观智能层 [CP004, CP010,
              CP012, CP013]。UiPath 等竞争者强调快速 RPA 机器人执行和任务自动化，而不是深度跨系统图建模；Software AG ARIS 则重点关注静态企业业务流程建模
