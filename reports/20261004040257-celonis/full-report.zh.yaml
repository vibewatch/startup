      - number: '7.3'
        title: 平台交易对手依赖与总拥有成本
        blocks:
          - type: paragraph
            body: >-
              Celonis 对第三方企业平台存在关键结构性依赖，最突出的是 SAP、Oracle、Salesforce 和主要公共云提供商。由于流程挖掘是洞察分析系统，而不是底层交易记录系统，Celonis
              依赖开放的应用程序接口、稳定的连接器管道，以及来自其所检查软件套件所属企业厂商的非敌对生态访问。商业上，Celonis 要求高端企业订阅承诺，通常采用不透明的定制合同，起始套餐为六位数（每年 $150,000
              至超过 $300,000），并随处理量、连接器覆盖范围和用户数急剧上升。加上外部系统集成商服务和内部支持工程，高总拥有成本会在宏观经济收缩和企业软件合理化评估期间造成预算脆弱性。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR011
              - CR012
