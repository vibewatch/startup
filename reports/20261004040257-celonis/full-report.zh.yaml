      - number: '8.2'
        title: 融资与价格背景
        blocks:
          - type: paragraph
            body: >-
              最强的价格锚点来自历史交易。2022 年 8 月，Celonis 宣布完成 4 亿美元 D 轮扩展融资，投后估值接近 130 亿美元；同时获得一项循环信贷额度，初始为 5 亿美元，可扩大至 6
              亿美元。信贷额度不等于股权融资、手头现金，也不等于实际已提款金额。各来源对累计融资额的口径也不一致：Tracxn 称六轮合计 17.7 亿美元，TechCrunch 和 GetLatka 则称 2022
              年融资后为 24 亿美元。在核对融资工具和提款历史前，这一差异应保持未决。二级交易渠道受限，现有证据也没有发行人特定的交易材料，无法确定当前能撮合成交的股权价值。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV014
      - number: '8.3'
        title: 不制造虚假精确度的乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              要建立量化回报模型，必须掌握当前经审计的收入或 ARR、增长、毛利率、留存、自由现金流、净债务、完全摊薄后的持股比例和优先权条款。现有公开证据无法确认其中任何一项。GetLatka 对 2023 年 7.71
              亿美元年收入的估算，只能作为尽调线索，不能当作经审计收入或
              ARR。乐观情景是经营拐点得到验证，同时融资或上市能够支撑旧的优先股定价；基准情景是产品继续具备相关性，但没有可辩护的公开价格；悲观情景则是指标走弱，或融资条款使新普通股处于次级地位、遭到稀释。由于分母缺失，给出估值区间或情景概率只会制造虚假的精确度，因此不作分配。
            claimRefs:
              - CV005
              - CV007
              - CV010
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: 退出准备度、尽调门槛与论点失效信号
        blocks:
          - type: paragraph
            body: >-
              CNBC 报道称，Celonis 在 2021 年任命了新 CFO，为预期中的 IPO
              做准备；但这一历史信号不能证明当前已具备上市条件。当前决策需要经审计的财务资料包、队列留存、客户集中度、净债务及信贷额度使用情况、完全摊薄后的股权结构表、清算优先权，以及近期公平交易的二级或一级定价。还需要在经常性收入定义、增长、利润率和期间上直接可比的上市公司或交易数据。论点失效信号包括：经审计的增长或留存显著低于投资假设、负自由现金流持续存在且必须依赖惩罚性融资、优先级条款损害普通股回报，或始终无法确定当前价格。在这些检查通过前，退出时点和目标回报都只是缺口，无法预测。
            claimRefs:
              - CV006
              - CV011
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 价格纪律主导决策
            body: Celonis 可能是一家有吸引力的企业软件公司，但现有证据无法确定当前公允价值或可投资证券价格。应持续跟踪，并在评估回报前要求经审计的经营指标、资本结构条款和公平交易价格发现。
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV014
              - CV016
