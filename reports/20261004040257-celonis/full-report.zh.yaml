        - 存在战略和规模信号，但当前没有经审计的运营数据。
        - 不要仅凭 2022 年估值买入一级或二级股份。
      - - 信心
        - 中
        - 2022 年融资已获交叉印证；当前股权价值尚未得到印证。
        - 获得经审计指标和当前公平交易价格后，信心可以提升。
      - - 风险评级
        - 信息风险高
        - 此处未披露债务使用、优先权条款、留存率、利润率和现金生成。
        - 要求提供完整的财务和资本结构尽调资料包。
      - - 估值立场
        - 缺乏锚点
        - 近 $13B 是 2022 年 8 月的历史投后估值。
        - 将其视为背景，而不是当前公允价值结论。
      - - 回报 / 退出观点
        - 公共证据不足以支持
        - 没有当前经审计基数、入场证券条款或经验证的退出倍数。
        - 在缺失分母补齐前，暂缓确定目标回报和退出时间。
    notes: 证据仅限于指定的公开来源；没有经审计的运营资料包、当前交易估值或证券条款可供查阅。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV013
      - CV014
      - CV016
  - id: TV002
    title: 论点与反论点
    columns:
      - 论点
      - 有证据支持的观点
      - 哪些信息会改变观点
    rows:
      - - 产品相关性
        - Celonis 将自身描述为面向企业运营和 AI 的跨系统流程智能层。
        - 独立的赢单率、使用率和续约证据将确认或削弱这一定位。
      - - 商业规模
        - 公司材料称有 1,400+ 家组织和 3,000+ 名员工。
        - 经审计的经常性收入、留存群组和客户集中度将检验经济规模。
      - - 资本获取
        - 2022 年融资方案将优先股与大额循环授信结合。
        - 授信提取历史、契约、净债务和流动性将显示授信能力是否变成杠杆。
      - - 价格支撑
        - 最近一次获交叉印证的优先股估值是 2022 年 8 月近 $13B。
        - 最近的公平交易融资、二级交易或有申报文件支持的估值，才能建立当前锚点。
    notes: 公司发布的采用率和产品陈述不视为独立验证；融资金额保留股权能力与信贷能力之间的区别。
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV009
      - CV010
      - CV013
      - CV014
      - CV015
  - id: TV003
    title: 乐观、基准与悲观情景框架
    columns:
      - 情景
      - 所需假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 经审计的增长、留存、利润率和现金生成验证持久的企业软件质量。
        - 当前融资或上市支持一个能达到投资判断目标回报的入场价格。
        - 不分配数值概率；信号是经审计指标加公平交易价格发现。
        - 新融资验证经济性明显更弱，或施加高级债权人下行保护。
      - - 基准
        - 产品相关性和客户规模延续，但公开财务披露仍不完整。
        - 没有可辩护的估值区间；在价格和分母可得前留在观察名单上。
        - 当前证据最符合该情景，因为运营规模可见，但价格支撑已过时。
        - 信息持续不透明，或无法核对资本结构，导致无法完成投资判断。
      - - 悲观
        - 增长、留存、利润率或现金转换低于预期投资情景。
        - 稀释、债务、优先权或更低的市场出清估值损害普通股价值。
        - 信号可能是降价轮、惩罚性条款、持续负现金流或流动性延迟。
        - 在运营证据足以支持 2022 年优先股估值前，公司出现融资需求。
    notes: 由于当前经审计指标、完全摊薄所有权、债务提取额和优先权条款均不可得，因此未估算估值区间或概率。
    claimRefs:
      - CV005
      - CV007
      - CV011
      - CV012
      - CV013
      - CV014
      - CV016
