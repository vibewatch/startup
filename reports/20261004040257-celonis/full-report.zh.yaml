      - number: '2.2'
        title: 市场规模视角、增长预测与估算摩擦
        blocks:
          - type: paragraph
            body: >
              评估 Celonis 的市场规模，需要纪律化的多视角分层，而不能直接接受宽泛、不受约束的企业自动化市场预测 [CM005, CM012]。行业规模研究通常从三个同心边界评估流程智能：企业 IT
              优化、业务运营分析和工作流自动化的总可寻址市场（TAM）；由专门流程挖掘和流程智能软件平台构成的可服务市场（SAM）；以及受 Celonis 高
              ACV、云优先架构和大型企业聚焦所约束的可获取市场（SOM）[CM005, CM006]。

              广义 TAM 覆盖全球企业在业务流程分析、自动化软件和数字化转型工具上的超过 $30B 支出 [CM005]。但专用流程挖掘软件的直接 SAM 更为有限：随着全球 2000
              强企业吸收多系统事件日志，其规模历史上以两位数高增长率从约 $1B 扩张至 $3B–$5B [CM005, CM006]。Celonis 的可服务 SOM
              还受到运营前提约束：平台需要大量事件日志数据、专门的内部卓越中心（CoE）以及高额专业服务投入 [CM006, CM007]。中型企业和采用单实例标准 ERP 堆栈的公司，往往认为 Celonis
              按数据量计费的模式过于昂贵，转而选择轻量级桌面替代品或原生 ERP 模块 [CM006, CM007]。因此，Celonis 的可服务机会集中在约 5,000 至 10,000 个全球企业客户，这些客户的年度
              IT 预算足以承担七位数的年度软件承诺 [CM005, CM006, CM010]。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM010
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM010
              - CM012
      - number: '2.3'
        title: 买方画像、付款方分层与预算归属
        blocks:
          - type: paragraph
            body: >
              企业采购 Celonis 流程智能软件并不遵循统一、单一的购买路径，而是涉及企业 IT、公司财务和全球供应链运营中的多个组织角色 [CM007,
              CM008]。在大型部署中，主要经济买方通常是首席信息官（CIO）、首席技术官（CTO）或首席转型官，他们推动部署 Celonis Process Intelligence Platform，以降低 SAP
              S/4HANA 迁移等核心 IT 现代化项目的风险，并建立统一数据模型 [CM007,
              CM008]。但职能预算通常掌握在业务部门领导手中，具体包括管理全球支出流失的首席采购官（CPO）、缓解营运资本扰动的首席供应链官（CSCO），以及优化应付账款和营运资本周转时间的公司控制官 [CM007,
              CM009]。

              采用路径通常从一个高影响、单一领域的概念验证开始，聚焦 Order-to-Cash（O2C）或 Procure-to-Pay（P2P），Celonis 可以在此快速量化现金流失、免人工发票处理率或重复付款风险
              [CM008, CM009]。初始价值得到证明后，企业客户通常会建立集中式流程卓越中心（CoE），由专职数据工程师、流程分析师和值架构师组成，负责构建和维护连接核心 ERP 实例与 Celonis 的数据管道
              [CM007, CM008]。近期产品集成，例如将 Celonis Process Intelligence 嵌入 Coupa 的自主支出管理市场，说明买方动态正在变化：职能采购团队如今可以通过专业 SaaS
              合作伙伴生态访问 Celonis 语境，不再只依赖独立 IT 实施 [CM009]。
            claimRefs:
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
      - number: '2.4'
        title: 企业增长催化剂、采用约束与尽调现实
        blocks:
          - type: paragraph
            body: >
              Celonis 受益于企业软件领域显著的宏观结构性增长驱动因素，其中首要因素是企业迫切需要将 Enterprise AI 和自主代理落地 [CM008, CM009]。大型语言模型和自主 AI
              代理需要深厚的运营语境以及准确的记录系统事件映射，才能在不产生幻觉或合规失败的情况下执行业务工作流；Celonis 将其 Process Intelligence Graph 定位为企业代理所需的上下文事实基础
              [CM008, CM009]。与此同时，持续的核心现代化压力，例如多年期 SAP S/4HANA 云迁移项目，也创造了大量流程发现需求，以区分差异化定制代码和技术债务 [CM008, CM010]。

              反过来，市场研究记录的严重结构性摩擦限制了采用速度 [CM006, CM007, CM011]。Celonis
              的许可架构主要按数据摄取量而非可预测的固定席位数计费，导致总拥有成本（TCO）难以预测，令企业采购团队警惕 [CM006,
              CM007]。此外，实施复杂度仍然很高：配置定制数据管道、从定制旧系统提取事件日志、调优数据转换模型，往往需要数周到数月的专业咨询支持 [CM006, CM007]。数据安全也是关键瓶颈：由于 Celonis
              主要作为多租户云平台运行，国防、医疗和银行等高度受监管企业经常难以满足将敏感运营日志导出公司防火墙之外的合规限制 [CM007]。最后，私有 ARR
              增长率和确切客户留存指标尚未解决的尽调缺口，要求投资者用已核实的运营转化现实来折价 headline TAM 数据 [CM011, CM012]。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 观察与执行之间的边界
            body: |
              企业尽调凸显了流程智能中的关键概念边界：Celonis 擅长从事件日志诊断流程瓶颈和不合规，但解决这些问题仍需要独立的执行基础设施。能够直接从诊断洞察走向自动化案件解决的平台，将定义企业运营的下一条竞争前沿。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
          - type: callout
            title: 排除中端市场与定价脆弱性
            body: |
              Celonis 按数据摄取量而非按席位指标计算许可费用，这种消费模式造成显著的总拥有成本摩擦。该许可模式实际上排除了中端市场组织，也使 Celonis 容易被提供统一定价或原生 ERP 捆绑的灵活替代方案取代。
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 市场格局与竞争者分类
        blocks:
          - type: paragraph
            body: >-
              围绕 Celonis 的竞争格局分为四个层级：直接流程挖掘和流程智能平台、现有企业软件集团、向流程发现扩张的机器人流程自动化（RPA）套件，以及维持现状的人工咨询服务。Celonis 自 2011
              年开始开创商业化流程挖掘，并凭借超过 1,400 家企业客户保持类别领导地位 [CP001, CP002, CP005]。分析师评估将 Celonis 置于流程挖掘执行能力和愿景完整度的首位 [CP003,
              CP004]。不过，该厂商也面临 Apromore Enterprise Edition、Software AG 的 ARIS 和 ABBYY Timeline 等专门同行的直接竞争 [CP003,
              CP008]。与此同时，包括 SAP（拥有 SAP Signavio 和 BusinessObjects）及 IBM Process Mining（利用 watsonx）在内的企业软件
              incumbents，试图将流程分析捆绑进更广泛的 ERP 和云订阅 [CP003, CP006, CP008, CP009]。对此，Celonis
              保持专门的竞争情报职能，跟踪流程编排、企业架构和数据分析等相邻技术类别 [CP007]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
