        title: GTM 动作、销售效率代理指标与交付成本结构
        blocks:
          - type: paragraph
            body: >
              Celonis 的市场进入主要依靠直接企业销售，并由全球系统集成商、顾问网络和专业平台工程师提供支持。大规模流程智能的客户获取通常具有较长销售周期，范围为 6 至 12
              个月，因为评估涉及企业架构、数据安全、采购和业务流程负责人等多个利益相关方。为提升部署速度并推动先落地后扩张，公司维护了广泛的赋能体系，包括 Celonis
              Academy、专职解决方案架构师和值架构师，后者专注于证明已经实现的业务影响。

              从成本结构看，Celonis 的毛利率驱动因素符合典型企业云软件的规律，但会被数据摄取强度和高接触技术交付抵消。纯 SaaS 平台往往能实现 75% 至 80%+ 的订阅毛利率，而 Celonis
              持续摄取事件日志、运行复杂转换管道并与不同企业后端保持数据同步，因此会产生不小的云计算和托管费用。此外，企业部署经常需要大量售前价值证明工程和售后合作伙伴实施支持；如果专业服务被补贴以赢得竞争性软件交易，服务交付拖累就可能压低综合利润率。
            claimRefs:
              - CI003
              - CI005
              - CI006
              - CI007
