      - number: '6.4'
        title: 展示项
        blocks:
          - type: callout
            title: 实施数据准备与治理采用障碍
            body: Celonis 客户部署最主要的失败点，是企业 ERP 系统中交易事件日志准备不足，以及组织对流程透明化的政治阻力。没有专门的卓越中心，部署就只能停留在可视化仪表盘上，无法产生可量化的营运资本 ROI。
            calloutType: risk
            claimRefs:
              - CU005
              - CU006
              - CU007
          - type: callout
            title: 定位为企业 AI 的语境层
            body: Celonis 正在推动客户采用 Celonis Context Model，从历史流程可视化走向自主 AI 代理的实时运营落地，由此将年度客户合同价值扩展到战略企业 AI 预算。
            calloutType: insight
            claimRefs:
              - CU003
              - CU008
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与合规风险格局
        blocks:
          - type: paragraph
            body: >-
              企业流程挖掘需要深入摄取核心记录系统中的事件日志，使 Celonis
              面临复杂的全球数据治理框架、跨境隐私边界和客户要求的合规控制。企业客户从企业资源规划和客户关系管理数据库提取细粒度交易记录时，员工活动日志和供应商互动会跨越公司及司法辖区边界。此外，商业流程智能市场快速扩张为高度竞争的领域，市场追踪机构统计出超过
              1,480 家活跃类别竞争者，其中包括数十家获得融资的厂商和战略整合收购方。Celonis 的法律风险画像需要持续尽调知识产权防御、商业秘密保护，以及遵守欧盟 AI 法案等新兴 AI
              治理要求。维持全面的企业级访问日志、最小权限的基于角色安全和严格数据隔离，对于防止合规漂移、降低客户数据暴露责任至关重要。
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
