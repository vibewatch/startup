              - CR002
              - CR010
              - CR013
      - number: '7.2'
        title: 运营、工程与实施开销
        blocks:
          - type: paragraph
            body: >-
              运营部署摩擦是企业流程智能实施中的核心执行风险。独立采购和技术评估显示，实施 Celonis
              需要大量数据工程带宽、广泛的数据清理和专门的模型架构，之后才能产生可执行洞察。组织经常遇到持续数月的延长实施周期；在此期间，数据准备瓶颈和不一致的源日志会威胁项目推进和投资回报。此外，一旦生成分析发现，组织必须实施专门的变更管理和运营治理，将分析得到的流程瓶颈转化为持续的工作流调整。没有闭环运营工作流和专门的卓越中心人员配置，企业买方就可能把流程智能当作被动的回顾式报告，而不是主动的运营调度机制。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR009
