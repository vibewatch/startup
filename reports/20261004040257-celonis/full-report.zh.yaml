      - number: '6.2'
        title: 采用轨迹、推广速度与扩张动态
        blocks:
          - type: paragraph
            body: >-
              Celonis 在企业客户中的采用轨迹显示出企业客户总数稳步增长，从早期标杆客户起步，发展到超过 1,400 家全球企业组织。初始客户合作通常从针对单一高摩擦业务流程的 8 至 14
              周试点开始，例如应付账款发票重复检测或订单管理中的自动信用冻结解除。试点成功得到证明后（通常在 3 至 6
              个月内带来初步现金流或周期时间改善），企业会面临扩展到全企业卓越中心（CoE）的关键拐点。将标准数据管道和跨职能流程治理制度化的组织，能够成功把流程挖掘扩展到供应链规划、库存管理和 IT
              服务管理。相反，如果部署只把 Celonis 当作诊断仪表盘，而非运营干预引擎，就会出现推广停滞、实施周期延长至 9 至 18 个月，以及在隐藏的跨部门低效和审批返工环节暴露后产生的组织抵触。
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU007
              - CU008
              - CU011
