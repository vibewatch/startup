        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Celonis 由 Alexander Rinke、Bastian Nominacher 和 Martin Klenk 于 2011 年创立。一份独立资料将其法律实体识别为 Celonis
              SE，并称慕尼黑是公司总部、纽约是其美国基地；另一份独立数据集同样将慕尼黑和纽约描述为双总部。公司销售流程挖掘和流程智能软件，从企业系统提取运营数据，补充业务语境，并将工作流呈现为不依赖具体系统的数字孪生。如今，Celonis
              将这一语境层定位为分析、重设计和运行 AI 辅助流程的基础设施。因此，其模式属于企业软件而非纯服务业务，但分配到的证据没有披露当前定价、合同组合或经常性收入构成。
