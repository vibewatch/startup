      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 高总拥有成本与生态交易对手暴露
            body: >-
              独立采购分析显示，Celonis 除软件许可费外，还会持续产生显著运营开销，主要来自复杂的事件日志提取、专业数据工程要求，以及高昂的卓越中心咨询成本。此外，Celonis 主要作为 SAP、Oracle
              等第三方企业套件之上的分析层运行，因此其长期特许经营护城河高度依赖合作伙伴 API 持续可用，以及企业是否愿意持续承担高价定制软件投入。
