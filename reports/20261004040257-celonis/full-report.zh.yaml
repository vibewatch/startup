  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、企业支出范围与类别涵盖
        blocks:
          - type: paragraph
            body: >
              要界定 Celonis 的可服务市场，必须将核心流程挖掘和流程智能软件类别与相邻的企业自动化及 IT 基础设施市场拆开 [CM001]。Celonis 的基础定位是分析与编排智能层：从 SAP
              ERP、Oracle 和 ServiceNow 等交易型核心平台提取、转换并分析事件日志数据 [CM001,
              CM002]。纳入的软件支出包括事件日志提取、面向对象的流程挖掘（OCPM）、可视化流程发现、合规性检查、自动根因诊断和业务规则模拟 [CM002,
              CM008]。任务级桌面录制、基础业务流程建模符号（BPMN）文档以及独立工作流绘图的支出，往往被涵盖在其他类别内或被视为相邻工具 [CM002, CM004]。

              关键在于，市场边界明确排除机器人流程自动化（RPA）运行机器人、核心企业资源规划（ERP）数据库许可，以及会向旧数据库写回数据的定制运营执行引擎 [CM001, CM003]。虽然 Celonis 将其
              Execution Management System（EMS）和 Process Intelligence Graph 定位为编排运营干预的工具，但企业尽调揭示了一个内在结构边界：Celonis
              主要是观察和诊断智能引擎，而不是交易执行环境 [CM003]。当发现运营故障，例如发票差异或采购瓶颈时，企业必须部署人工专家、Automation Anywhere 或 UiPath 等厂商的独立 RPA
              机器人，或 Noxus 等专用自主执行代理 [CM003, CM004]。流程洞察与运营行动之间的这一根本边界决定了 Celonis 的市场规模，也将原始发现软件与更广泛的自动化宇宙区分开来 [CM003]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: figure
