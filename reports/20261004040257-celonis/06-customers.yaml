figures:
  - id: "FU001"
    title: "Celonis Enterprise Customer Adoption and Expansion Journey Map"
    type: "journey-map"
    summary: "Sequential adoption phases from initial single-process pilot discovery to enterprise-wide Center of Excellence and AI Context Model expansion."
    data:
      items:
        - label: "1. Initial Discovery & Process Selection"
          touchpoints:
            - "Process discovery assessment"
            - "Executive stakeholder alignment"
            - "ERP connector setup"
          detail: "Target single high-volume workflow such as AP or P2P."
        - label: "2. Data Readiness & Pipeline Ingestion"
          touchpoints:
            - "Extract transaction timestamps"
            - "Clean case IDs and event logs"
            - "Validation with IT leads"
          detail: "Overcome ERP master data variance and missing event tables."
        - label: "3. Process Modeling & Variant Discovery"
          touchpoints:
            - "Reconstruct end-to-end execution path"
            - "Identify rework and bottlenecks"
            - "Generate baseline KPI metrics"
          detail: "Uncover hidden process variants and approval loop delays."
        - label: "4. Insight-to-Action Implementation"
          touchpoints:
            - "Configure automated interventions"
            - "Assign operational accountability"
            - "Define concrete ROI targets"
          detail: "Transition dashboards into active operational interventions."
        - label: "5. Value Realization & Center of Excellence"
          touchpoints:
            - "Measure DSO and working capital gains"
            - "Harmonize cross-department KPIs"
            - "Scale into supply chain and OCPM"
          detail: "Formalize CoE to expand from initial department across enterprise."
        - label: "6. Autonomous Agent & AI Context Expansion"
          touchpoints:
            - "Deploy Celonis Context Model"
            - "Integrate enterprise AI agents"
            - "Orchestrate multi-system workflows"
          detail: "Embed live operational context into generative and predictive AI."
    approximationNotes: "Milestones reflect typical enterprise deployment lifecycles identified by independent process mining implementation consultants."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"

callouts:
  - calloutType: "risk"
    title: "Implementation Data Readiness and Governance Adoption Barrier"
    body: "The primary point of failure in Celonis customer deployments is inadequate transactional event-log readiness across enterprise ERP systems and political resistance to process transparency. Without a dedicated Center of Excellence, deployments stall at visual dashboards without generating measurable working capital ROI."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
  - calloutType: "insight"
    title: "Strategic Positioning as the Context Layer for Enterprise AI"
    body: "Celonis is positioning its customer base to adopt the Celonis Context Model, moving beyond historical process visualization into real-time operational grounding for autonomous AI agents, thereby expanding annual customer contract value into strategic enterprise AI budgets."
    claimRefs:
      - "CU003"
      - "CU008"

