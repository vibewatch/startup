chapter:
  number: 6
  title: "Customers"
  summary: "Celonis maintains a marquee tier-one enterprise customer base exceeding 1,400 accounts across manufacturing, healthcare, aerospace, and energy, demonstrating multi-million-dollar annual commitments and documented ROI in core financial workflows. However, complex ERP data pipeline requirements, process ownership conflicts, and the absence of audited retention or net revenue retention disclosures leave late-stage expansion durability unverified."

sections:
  - id: "customer-segmentation-and-profile"
    title: "Enterprise Buyer Profile and Customer Segmentation"
    body: "Celonis concentrates its commercial go-to-market primarily on global Global 2000 multinational corporations, large financial institutions, industrial manufacturers, and healthcare enterprises operating heterogeneous, mission-critical transactional ERP systems including SAP, Oracle, and ServiceNow. Enterprise procurement is sponsored by senior functional leaders—predominantly Chief Financial Officers, Chief Operating Officers, and Chief Information Officers—who target working capital optimization, cash-flow cycle acceleration, and operational overhead reduction across high-volume transaction cycles like Order-to-Cash (O2C) and Procure-to-Pay (P2P). Because process intelligence requires establishing direct, high-throughput database extraction connectors into core enterprise transactional databases, the platform naturally filters toward accounts possessing substantial operational complexity and IT maturity capable of managing extensive data readiness and governance requirements. Consequently, Celonis exhibits pronounced deal-size concentration in large-scale six-figure to seven-figure annual enterprise subscription contracts, where deployment yields measurable balance sheet impact such as day-sales-outstanding compression and invoice rework elimination, but leaves smaller middle-market accounts comparatively underserved due to steep initial engineering integration overhead."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
    tableRefs:
      - "TU001"

  - id: "adoption-trajectory-and-deployment-scale"
    title: "Adoption Trajectory, Rollout Velocity, and Expansion Dynamics"
    body: "The adoption trajectory of Celonis across enterprise accounts demonstrates steady expansion in total enterprise account count, growing from early marquee customer traction to more than 1,400 global enterprise organizations. Initial customer engagements typically originate as targeted, 8-to-14-week pilots scoped tightly around a single high-friction business process, such as accounts payable invoice duplicate detection or automated credit block removal in order management. Following demonstrable pilot success—frequently yielding initial cash flow or cycle-time improvements within 3 to 6 months—enterprises face a critical inflection point in scaling toward an enterprise-wide Center of Excellence (CoE). Organizations that institutionalize standard data pipelines and cross-functional process governance successfully scale process mining across supply chain planning, inventory management, and IT service management. Conversely, deployments that treat Celonis strictly as a diagnostic dashboard rather than an operational intervention engine experience stalled rollouts, prolonged implementation cycles extending to 9 to 18 months, and organizational resistance when hidden cross-departmental inefficiencies and approval rework loops surface."
    claimRefs:
      - "CU001"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU011"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"

  - id: "named-customer-evidence-and-retention-risks"
    title: "Named Customer Proof, Retention Durability, and Diligence Risks"
    body: "Celonis documents substantial, multi-industry customer proof across world-class industrial, aerospace, healthcare, and technology enterprises, including public case references such as ExxonMobil, 3M, Merck, Lockheed Martin, and Uber, with its 2026 Champions Squad attributing over $1.5 billion in cumulative realized business value across 24 leading accounts. Furthermore, major technology partners and digital leaders utilize modern composable architectures to accelerate digital workflows and scale marketing operations alongside enterprise process mining. Nevertheless, significant diligence vulnerabilities remain regarding long-term customer retention and expansion economics. Celonis does not publicly report audited Net Revenue Retention (NRR), Gross Revenue Retention (GRR), customer cohort survival curves, or annual logo churn figures. Third-party implementation field analyses and user sentiment indicate that high annual subscription costs, coupled with substantial ongoing data engineering maintenance, create renewal friction if organizations fail to actively automate process interventions. In the absence of audited retention metrics, investors cannot independently determine whether high reported annual revenue growth is driven by healthy expansion within mature cohorts or masked by aggressive new logo acquisition."
    claimRefs:
      - "CU002"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
    tableRefs:
      - "TU003"

