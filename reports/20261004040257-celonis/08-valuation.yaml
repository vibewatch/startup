      - - "Capital access"
        - "The 2022 package combined preferred equity with a large revolving facility."
        - "Facility draw history, covenants, net debt, and liquidity would show whether capacity became leverage."
      - - "Price support"
        - "The last corroborated preferred-equity mark is nearly $13B from August 2022."
        - "A recent arm's-length financing, secondary trade, or filing-supported valuation would establish a current anchor."
    notes: "Company-issued adoption and product statements are not treated as independent validation; financing amounts preserve the distinction between equity and credit capacity."
    claimRefs:
