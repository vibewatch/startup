      severity: "material"
      topic: "underwriting-denominators"
      missingEvidence: "Audited revenue and ARR definitions, growth, gross margin, net retention, free cash flow, net debt, fully diluted ownership, and preference terms."
      whyItMatters: "These inputs are required to calculate enterprise value, dilution-adjusted ownership, downside protection, and target returns."
