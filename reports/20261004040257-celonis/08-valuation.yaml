      severity: "material"
      topic: "current-valuation"
      missingEvidence: "A recent arm's-length primary round, completed secondary trade, fund mark with share-class terms, or filing-supported current equity valuation."
      whyItMatters: "The nearly $13B reference is an August 2022 preferred-equity mark and cannot establish today's market-clearing value."
      diligencePath: "Request recent transaction evidence by share class and inspect holder filings and any current listing materials."
      relatedQuestionRefs:
        - "QV003"
