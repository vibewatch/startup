runDate: "2026-10-04"
company:
  name: "Celonis"
chapter:
  number: 8
  title: "Valuation"
  summary: "Celonis has credible scale and strategic relevance, but the latest supported preferred-equity valuation remains the nearly $13 billion mark set in August 2022. The assigned public evidence does not provide current audited operating metrics, a broadly observable secondary mark, or preference and debt-draw details, so the evidence supports tracking the company rather than underwriting an entry price."
sections:
  - id: "investment-view"
    title: "Investment view: attractive company, unanchored entry price"
    body: >-
      Celonis presents a credible strategic thesis but not a presently underwritable
      valuation. The company says more than 1,400 organizations use its platform, its
      careers site reports more than 3,000 employees, and its product materials describe
      a system-agnostic operational data layer intended to give enterprise AI business
      context. Those signals support relevance and organizational scale, but they do not
      establish revenue quality, retention, margins, or cash generation. The recommendation
      is therefore track / research more, with medium confidence, high information risk,
      and a valuation stance of unanchored rather than a buy call. Entry should wait for
      audited metrics and security-specific terms instead of treating company quality as
      proof that the 2022 price remains fair.
    claimRefs:
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV013"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV001"
      - "TV002"
    figureRefs:
      - "FV001"
  - id: "financing-and-price-context"
    title: "Financing and price context"
    body: >-
      The strongest price anchor is historical. In August 2022 Celonis announced a
      $400 million Series D extension at a nearly $13 billion post-money valuation,
      alongside a revolving credit facility with a $500 million line expandable to
      $600 million. The credit capacity is not equivalent to equity funding, cash on
      hand, or an amount actually drawn. Aggregate funding figures also use inconsistent
      conventions: Tracxn reports $1.77 billion across six rounds, while TechCrunch and
      GetLatka report $2.4 billion after the 2022 package. The discrepancy should remain
      unresolved until the instruments and draw history are reconciled. Secondary access
      is restricted, and the assigned evidence supplies no issuer-specific transaction
      evidence that establishes a current market-clearing equity value.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV014"
  - id: "scenario-discipline"
    title: "Bull, base, and bear cases without false precision"
    body: >-
      A quantitative return model would require current audited revenue or ARR, growth,
      gross margin, retention, free cash flow, net debt, fully diluted ownership, and
      preference terms. None is established by the assigned public evidence. GetLatka's
      $771 million annual-revenue estimate for 2023 is useful only as a diligence lead,
      not as audited revenue or ARR. The bull case is a validated operating inflection
      plus a financing or listing that supports the old preferred mark; the base case is
      continued product relevance with no defensible public price; and the bear case is
      weaker metrics or financing terms that subordinate or dilute new common equity.
      No valuation range or scenario probability is assigned because doing so would
      manufacture precision from missing denominators.
    claimRefs:
      - "CV005"
      - "CV007"
      - "CV010"
      - "CV012"
      - "CV013"
      - "CV014"
      - "CV016"
    tableRefs:
      - "TV003"
  - id: "exit-readiness-and-final-diligence"
    title: "Exit readiness, diligence gates, and thesis breaks"
    body: >-
      CNBC reported in 2021 that Celonis appointed a new chief financial officer ahead of
      an anticipated IPO, but that historical signal is not evidence of present listing
      readiness. A current decision requires an audited financial pack, cohort retention,
      customer concentration, net debt and facility utilization, the fully diluted cap
      table, liquidation preferences, and recent arm's-length secondary or primary pricing.
      It also requires directly comparable public-company or transaction data matched on
      recurring-revenue definition, growth, margin, and period. Thesis-break signals are
      audited growth or retention materially below the investment case, negative free-cash-flow
      durability that requires punitive financing, senior terms that impair common-equity
      returns, or continued inability to establish a current price. Until those checks
      clear, exit timing and target returns are gaps rather than forecastable outputs.
    claimRefs:
      - "CV006"
      - "CV011"
      - "CV013"
      - "CV014"
      - "CV016"
