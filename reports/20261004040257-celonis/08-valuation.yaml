    - type: "conflicting-data"
      severity: "material"
      topic: "aggregate-funding"
      missingEvidence: "A security-by-security financing ledger that reconciles funded equity, committed debt capacity, actual debt draws, and the differing $1.77B and $2.4B aggregates."
      whyItMatters: "Funding raised is not the same as cash available, and committed credit is not the same as drawn debt."
      diligencePath: "Obtain the capitalization ledger, financing documents, and facility draw schedule directly from Celonis and reconcile each instrument."
