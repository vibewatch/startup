evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A primary-source reconciliation of the $1.77B and $2.4B total-funding figures, including treatment of debt,
      secondaries, and any undisclosed round.
    whyItMatters: >-
      The difference changes dilution and capital-efficiency analysis, while neither total measures cash currently
      available.
    diligencePath: Obtain the company cap table, financing closing schedules, debt statements, and German corporate filings.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current ownership, voting rights, full board composition, founder succession plans, and dated executive
      appointment records.
    whyItMatters: Public role listings show founder concentration but cannot establish control rights or continuity protections.
    diligencePath: Request the shareholder register, articles, voting agreements, board minutes, and succession materials under NDA.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: A reconciled payroll headcount, active customer definition, and audited FY2023-FY2026 revenue and ARR bridge.
    whyItMatters: >-
      Profile counts use different collection methods, and the retained revenue estimate cannot establish recurring
      revenue or cash generation.
    diligencePath: Request payroll reports, customer cohort schedules, audited financial statements, and the ARR policy and bridge.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: >-
      A primary-source chronology of leadership changes, adverse events, financing amendments, and completed
      acquisitions after August 2022.
    whyItMatters: The retained timeline is a selected financing and strategy chronology, not a complete corporate event record.
    diligencePath: >-
      Review corporate filings, board materials, litigation dockets, and company announcements against a dated event
      register.
    relatedQuestionRefs:
      - QO006
      - QO007
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: market-sizing-diligence-gaps
    missingEvidence: >-
      Audited segmentation of Celonis's FY2024-FY2025 ARR by customer tier, net revenue retention (NRR), and ACV
      distribution across Global 2000 vs. mid-market accounts.
    whyItMatters: >-
      Without segmented ARR and retention data, sizing Celonis's obtainable SOM and calculating market saturation
      relative to competing automation suites remains reliant on secondary estimates.
    diligencePath: >-
      Review pre-IPO investor presentations, confidential information memoranda (CIM), or audited financial disclosures
      during IPO registration.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-win-rates
    missingEvidence: >-
      Audited competitive win-rate and displacement data comparing Celonis directly against SAP Signavio and IBM Process
      Mining.
    whyItMatters: >-
      Direct head-to-head win-loss ratios are critical to assessing whether incumbent ERP bundling is eroding Celonis's
      market share in enterprise renewals.
    diligencePath: >-
      Request blinded win/loss engagement debriefs and customer renewal churn rates by competing vendor during
      management diligence.
    relatedQuestionRefs:
      - QP001
      - QP008
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: minor
    topic: discount-structure
    missingEvidence: Formal discount schedule and connector surcharge rate cards for enterprise volume tiering.
    whyItMatters: >-
      Without public connector and processing capacity tiers, enterprise buyers face unpredictable multi-year budget
      expansion.
    diligencePath: >-
      Review redacted enterprise customer master service agreements (MSAs) and vendor order forms across recent
      procurement cycles.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited financial statements detailing GAAP revenue, ARR, gross margin breakdown, and free cash flow.
    whyItMatters: >-
      Without verified financial statements, underwriting forward enterprise valuation multiples and assessing operating
      leverage is impossible.
    diligencePath: Request audited income statement, balance sheet, and cash flow statement from the confidential company data room.
    relatedQuestionRefs:
      - QI007
  - type: private-evidence-only
    severity: material
    topic: debt-covenants
    missingEvidence: Terms, covenants, interest rate structure, and repayment schedule for the $600M syndicated credit facility.
    whyItMatters: >-
      Debt service obligations impact net cash burn and liquidity runway during prolonged sales cycles or market
      downturns.
    diligencePath: Obtain credit agreement documentation and debt schedule from company management.
    relatedQuestionRefs:
      - QI005
  - type: private-evidence-only
    severity: material
    topic: context-model
    missingEvidence: >-
      Disclosed benchmark metrics quantifying the semantic reconstruction error rate of the Celonis Context Model when
      reconciling divergent custom entity schemas across disparate ERP instances.
    whyItMatters: >-
      Verifying the fidelity of automated digital twin generation across highly customized enterprise ERP deployments is
      critical for assessing whether AI agents can act autonomously without human review.
    diligencePath: >-
      Request customer deployment validation logs and data model reconciliation audit reports from Celonis enterprise
      architecture teams.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention-and-expansion-metrics
    missingEvidence: >-
      Audited customer cohort expansion curves, Net Revenue Retention (NRR), Gross Retention Rate (GRR), and logo
      renewal rates.
    whyItMatters: >-
      Without audited retention and cohort expansion data, investors cannot verify whether revenue growth is sustained
      by healthy account expansion or masked by new customer acquisition.
    diligencePath: >-
      Request confidential historical cohort retention tables, NRR trends by customer size tier, and annual logo churn
      disclosures during late-stage sponsor diligence.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-deployment-sample
    missingEvidence: >-
      Comprehensive registry of all 1,400+ active enterprise customer deployments and specific ARR contribution per
      tier.
    whyItMatters: >-
      Public references sample top-tier enterprise accounts, leaving contract distribution and adoption depth across
      mid-tier accounts unverified.
    diligencePath: >-
      Review sanitized enterprise customer account registry and top-50 customer revenue concentration schedules under
      non-disclosure agreements.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Comprehensive public litigation docket filings, patent counter-assertions, and private antitrust settlement terms
      between Celonis and incumbent ERP vendors such as SAP.
    whyItMatters: >-
      Direct legal challenges and ecosystem connector licensing terms directly impact enterprise deployment rights and
      gross margins.
    diligencePath: >-
      Obtain docket filings from US federal court and European regulatory competition inquiries regarding ERP ecosystem
      data access.
    relatedQuestionRefs:
      - QR003
      - QR004
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: customer-renewal-and-churn
    missingEvidence: >-
      Audited gross revenue retention, net revenue retention, and customer renewal cohort churn rates across multi-year
      contracts.
    whyItMatters: >-
      Validates whether six-figure software commitments and high initial implementation services lead to durable
      long-term renewals.
    diligencePath: >-
      Request audited revenue retention schedules, cohort churn analysis, and customer reference interview transcripts
      during confidential sponsor diligence.
    relatedQuestionRefs:
      - QR002
      - QR008
    relatedTableRefs:
      - TR002
      - TR003
  - type: conflicting-data
    severity: material
    topic: aggregate-funding
    missingEvidence: >-
      A security-by-security financing ledger that reconciles funded equity, committed debt capacity, actual debt draws,
      and the differing $1.77B and $2.4B aggregates.
    whyItMatters: Funding raised is not the same as cash available, and committed credit is not the same as drawn debt.
    diligencePath: >-
      Obtain the capitalization ledger, financing documents, and facility draw schedule directly from Celonis and
      reconcile each instrument.
    relatedQuestionRefs:
      - QV002
  - type: stale
    severity: material
    topic: current-valuation
    missingEvidence: >-
      A recent arm's-length primary round, completed secondary trade, fund mark with share-class terms, or
      filing-supported current equity valuation.
    whyItMatters: >-
      The nearly $13B reference is an August 2022 preferred-equity mark and cannot establish today's market-clearing
      value.
    diligencePath: Request recent transaction evidence by share class and inspect holder filings and any current listing materials.
    relatedQuestionRefs:
      - QV003
  - type: private-evidence-only
    severity: material
    topic: underwriting-denominators
    missingEvidence: >-
      Audited revenue and ARR definitions, growth, gross margin, net retention, free cash flow, net debt, fully diluted
      ownership, and preference terms.
    whyItMatters: >-
      These inputs are required to calculate enterprise value, dilution-adjusted ownership, downside protection, and
      target returns.
    diligencePath: >-
      Review the latest audited financial statements, board reporting, cohort schedules, debt documents, and fully
      diluted capitalization table under NDA.
    relatedQuestionRefs:
      - QV004
      - QV005
      - QV007
      - QV009
      - QV010
  - type: missing-source
    severity: material
    topic: comparable-set
    missingEvidence: >-
      A period-matched set of public-company and transaction comparables with consistent recurring-revenue, growth,
      margin, and enterprise-value definitions.
    whyItMatters: >-
      Company financing marks alone do not provide a market benchmark, and unmatched multiples would create false
      precision.
    diligencePath: >-
      Build the comparable set from current filings and transaction documents after Celonis operating denominators are
      verified.
    relatedQuestionRefs:
      - QV008
