companyProfile:
  summary: >-
    Celonis is a late-stage private enterprise software company founded in 2011 by Alexander Rinke, Bastian Nominacher,
    and Martin Klenk. It sells process-mining and process-intelligence software that adds business context to enterprise
    system data and supports analysis, redesign, and AI-assisted execution. The company is headquartered in Munich,
    Germany and New York City, USA, serves more than 1,400 organizations, and remains founder-influenced with limited
    public financial disclosure.
