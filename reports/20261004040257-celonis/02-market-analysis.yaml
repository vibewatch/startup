callouts:
  - calloutType: insight
    title: The Observation Versus Execution Boundary
    body: |
      Enterprise diligence highlights a critical conceptual boundary in process intelligence: Celonis excels at diagnosing process bottlenecks and non-conformance from event logs, but resolving those issues requires separate execution infrastructure. Platforms that move directly from diagnostic insight to automated case resolution define the next competitive frontier for enterprise operations.
    claimRefs:
      - CM003
      - CM004
  - calloutType: risk
    title: Mid-Market Exclusion and Pricing Vulnerability
    body: |
      Celonis's consumption model, which indexes licensing fees to data ingestion volume rather than per-seat metrics, creates significant total-cost-of-ownership friction. This licensing model effectively excludes mid-market organizations and exposes Celonis to displacement by agile alternatives offering flat-rate pricing or native ERP bundling.
    claimRefs:
      - CM006
      - CM007
