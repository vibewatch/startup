  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: AI product outcomes
    missingEvidence: Module-level metrics showing chatbot accuracy, AI-assisted resolution, or uplift from AI automation.
    whyItMatters: AI is part of the future positioning but public proof is narrative-heavy.
    diligencePath: Request KPI dashboards or customer cohort outcomes for Answers and AI-assisted workflows.
    relatedQuestionRefs:
    - QE023
  - type: missing-source
    severity: material
    topic: Infrastructure ownership split
    missingEvidence: Clear breakdown of which delivery layers are directly controlled by Infobip versus partner or acquired assets.
    whyItMatters: Ownership splits affect uptime accountability, economics, and moat durability.
    diligencePath: Request architecture review and channel-by-channel ownership map from product leadership.
    relatedQuestionRefs:
    - QE024
  - type: missing-source
    severity: minor
    topic: Module uptime history
    missingEvidence: Public uptime, incident frequency, and SLA attainment by major product module.
    whyItMatters: Enterprise readiness is strong conceptually but weakly quantified publicly.
    diligencePath: Ask for status-page history, SLA reports, and module-specific incident summaries.
    relatedQuestionRefs:
    - QE025
acknowledgedWarnings:
- dimension: unverifiedSource
