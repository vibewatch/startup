callouts:
- calloutType: strength
  title: Breadth is credible in public evidence
  body: Infobip’s breadth is supported by product pages, documentation, SDKs, and customer stories rather than by vague brand marketing alone. That makes the omnichannel platform claim more credible than many private SaaS narratives.
  claimRefs:
  - CE001
  - CE004
  - CE005
  - CE013
- calloutType: strength
  title: Direct connectivity still looks like the core moat
  body: The most defensible differentiator remains direct telecom and carrier reach paired with global delivery execution. Higher-level software helps monetization, but the infrastructure layer still underwrites trust and economics.
  claimRefs:
  - CE009
  - CE019
  - CE031
- calloutType: risk
  title: AI story is ahead of public proof
  body: AI appears prominently in Infobip’s messaging and trend materials, but public evidence still says more about direction than about benchmarked product outcomes or margin uplift.
  claimRefs:
  - CE016
  - CE022
  - CE034
- calloutType: risk
  title: Rich-channel growth raises ecosystem dependence
  body: As RCS, Apple, and other managed channels matter more, Infobip becomes more exposed to third-party policy changes and feature timing outside its direct control.
  claimRefs:
  - CE010
  - CE029
  - CE030
