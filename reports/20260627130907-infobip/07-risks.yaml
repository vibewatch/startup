  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: Debt covenant visibility
    missingEvidence: Detailed covenant package, pricing, amortization, and downside liquidity buffers for the 2025 lending facility.
    whyItMatters: Leverage can amplify otherwise-manageable operational or market risks.
    diligencePath: Request lender presentation or financing summary with covenant headroom.
    relatedQuestionRefs:
    - QR023
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: Incident history
    missingEvidence: Module-level uptime history, security incidents, and major postmortems.
    whyItMatters: Operational resilience cannot be benchmarked from current public disclosures.
    diligencePath: Request status-page archive, customer SLA reporting, and security incident summary.
    relatedQuestionRefs:
    - QR024
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: Enforcement and litigation map
    missingEvidence: Jurisdiction-by-jurisdiction list of material complaints, enforcement actions, and litigation if any.
    whyItMatters: Needed to quantify residual legal exposure rather than only thematic risk.
    diligencePath: Run legal diligence across key operating jurisdictions and ask management for claims history.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: Residual risk pack
    missingEvidence: Integrated risk register used by management with owners, controls, incidents, and mitigations.
    whyItMatters: Public sources validate risk categories but not management-quality execution against them.
    diligencePath: Request risk committee materials and internal audit outputs.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR005
