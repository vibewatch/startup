    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity & Founding History
        blocks:
          - type: paragraph
            body: >-
              Infobip d.o.o. was founded on April 13, 2006, in Vodnjan, Croatia, by three Croatian entrepreneurs: Silvio
              Kutić (CEO), Roberto Kutić, and Izabel Jelenić (CTO). The company began as a small SMS messaging startup
              focused on providing mobile communication services and has grown into a global leader in cloud
              communications infrastructure. The founding team identified early opportunities in enterprise messaging
              services, building direct relationships with mobile network operators across Europe before expanding
              globally. Infobip became Croatia's first and only technology unicorn in 2020 when One Equity Partners
              invested $200 million at a valuation exceeding $1 billion. The company remains privately held with
              headquarters in Vodnjan, Croatia, maintaining major operational offices in London, New York, Singapore,
              Mumbai, and Kuala Lumpur. As of 2025, Infobip operates 75+ offices across 6 continents and employs
              approximately 4,000 people globally, representing significant growth from fewer than 100 employees a
              decade earlier. The company's legal structure is a Croatian limited liability company (društvo s
              ograničenom odgovornošću or d.o.o.), with registered headquarters in Vodnjan near Pula in the Istria
              region of Croatia.
