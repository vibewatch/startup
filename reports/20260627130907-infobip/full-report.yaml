        - Public CPaaS leader
        - Public market cap and revenue disclosed
        - Best scale benchmark
        - US mix and history differ from Infobip
      - - Sinch
        - Public global messaging platform
        - Annual report and investor materials disclosed
        - Closest global messaging peer
