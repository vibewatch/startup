      - What would change the view
    rows:
      - - Scaled global CPaaS leader with improving profitability
        - Evidence that growth is stalling or software mix is not improving
      - - Direct connectivity and global reach support strategic relevance
        - Proof that partner dependence is eroding pricing power faster than expected
      - - Public comps imply a defendable valuation corridor
        - A private round priced far above that corridor without better disclosure
      - - Profitability improves exit credibility
        - Negative surprise on debt terms or capital structure
      - - Breadth supports land-and-expand potential
        - Customer concentration or weak retention metrics discovered in diligence
    notes: The anti-thesis is mostly about price and transparency rather than about existential product weakness.
