      - number: '3.3'
        title: Capability & Pricing Comparison
        blocks:
          - type: paragraph
            body: >-
              CPaaS providers compete across channels (SMS, voice, video, email, WhatsApp, RCS), geographic reach,
              developer experience, enterprise features, and pricing. Twilio offers the broadest channel coverage and
              integration ecosystem but commands premium pricing (~$0.0079/SMS segment US). Infobip matches channel
              breadth while differentiating on direct carrier relationships (800+ globally) enabling better delivery
              rates and pricing flexibility. Sinch leads in SMS delivery optimization with strong AI-based routing. Bird
              emphasizes unified inbox and customer engagement workflows over raw API access. Pricing models vary:
              per-message/per-minute (Twilio, Infobip, Sinch), committed-use discounts (enterprise tiers), and bundled
              SaaS subscriptions (Bird, Infobip Moments/Conversations). Enterprise pricing is highly negotiable with
              volume tiers, minimum commits, and custom SLAs. Feature gaps: Infobip leads in RCS business messaging and
              WhatsApp Business API; Twilio leads in video (acquired Twilio Video) and customer data platform (Segment).
              Bandwidth differentiates on owned PSTN network providing lower voice costs. Developer experience varies:
              Twilio is gold standard for documentation/SDKs; Infobip has improved significantly but trails in US
              developer mindshare. Compliance and trust features (SOC 2, ISO 27001, HIPAA) are table stakes for
              enterprise deals.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
              - CP017
          - type: table
            tableRef: TP002
            claimRefs:
              - CP013
              - CP014
              - CP015
          - type: table
