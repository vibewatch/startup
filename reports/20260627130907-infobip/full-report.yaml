          - type: paragraph
            body: >-
              Operational risk rises with scale. Infobip’s global footprint, broad module set, and huge communications
              volume all increase the blast radius of service failures, security incidents, or weak process
              coordination. Public documentation supports a mature product surface, but it does not reveal postmortem
              discipline, uptime by module, or the internal control quality that lenders or large customers may see
              privately. Security risk is especially important because communications traffic is both operationally
              critical and privacy-sensitive; a significant incident would likely damage trust and invite regulatory
              attention at the same time. Integration risk from Peerless is also still relevant. The acquisition
              expanded product scope and US capability, but acquisitions can add complexity faster than processes absorb
              it. This chapter therefore treats operational risk as mitigated but not transparently measured in public
              data. The same is true for AI-assisted workflows, where automation can create additional quality and
              governance obligations even when the base messaging rails are stable.
            claimRefs:
              - CR011
              - CR014
              - CR015
              - CR016
              - CR018
              - CR022
              - CR029
              - CR038
          - type: table
            tableRef: TR002
