      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Leverage amplifies other mistakes
            body: >-
              The direct-lending package is positive for flexibility, but it also means execution mistakes can transmit
              into financing pressure faster than in a net-cash model.
            calloutType: risk
            claimRefs:
              - CR008
              - CR010
              - CR032
          - type: callout
            title: Partner dependence is the hidden variable
            body: >-
              Investors can easily see privacy and telecom regulation, but the less visible risk is how much control
              sits with carriers and rich-channel ecosystem owners.
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
              - CR026
          - type: callout
            title: Mitigation posture appears credible
            body: >-
              Certificates, public compliance materials, product maturity, and lender participation together indicate
              Infobip is not improvising risk management from scratch.
            calloutType: strength
            claimRefs:
              - CR004
              - CR019
              - CR034
          - type: callout
            title: Demand a risk pack before high-conviction underwriting
            body: >-
              The remaining blind spots—covenants, incident history, customer concentration, and enforcement record—are
              exactly the data points needed to move risk from medium-high uncertainty to medium confidence.
            calloutType: recommendation
            claimRefs:
