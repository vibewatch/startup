  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory & Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Infobip operates in one of the most regulation-dense parts of software infrastructure. A global
              communications platform has to navigate telecom sender rules, privacy law, identity requirements,
              anti-spam regimes, and country-by-country registration mechanics. That makes regulatory risk persistent
              even when no single enforcement event is visible. GDPR matters because communications and customer-data
              flows often intersect with identity, consent, and profiling. India matters because telecom registration
              and sender controls can immediately affect traffic delivery if mishandled. Public mitigation signals exist
              through certificates and policy posture, but those are not the same as zero enforcement exposure. The best
              investor stance is to assume compliance is a competency, but also to assume it remains expensive, dynamic,
              and capable of generating sharp downside if rules tighten or local execution slips. Legal complexity also
              compounds because customers themselves can create compliance exposure through how they configure
              campaigns, templates, consent collection, and storage practices.
            claimRefs:
