  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition & Boundaries
        blocks:
          - type: paragraph
            body: >-
              Communications Platform as a Service (CPaaS) encompasses cloud-based APIs and SDKs that enable enterprises
              to embed real-time communications—SMS, voice, video, email, and messaging apps—into their applications
              without building backend infrastructure. The market boundary includes API-delivered messaging (A2P SMS,
              RCS, WhatsApp Business), programmable voice, video conferencing APIs, email delivery APIs, and
              authentication services (OTP, 2FA). Adjacent markets include UCaaS (Unified Communications as a Service),
              CCaaS (Contact Center as a Service), and traditional telecom carrier services. Key exclusions from CPaaS
              TAM estimates typically include consumer messaging apps (WhatsApp personal, iMessage), carrier-to-carrier
              interconnect fees, and enterprise PBX/PSTN replacement spending. The status-quo substitute for CPaaS
              adoption is direct carrier contracts, legacy SMS aggregators, or in-house messaging infrastructure. CPaaS
              displaces these alternatives by offering developer-friendly APIs, multi-channel support, global reach, and
              usage-based pricing. The core value proposition is enabling enterprises to communicate with customers at
              scale across channels without managing telecom relationships or infrastructure. Regulatory considerations
              include GDPR (Europe), TCPA (US), TRAI DLT (India), and local sender ID regulations that affect
              cross-border messaging compliance.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM003
      - number: '2.2'
        title: TAM/SAM/SOM Analysis
        blocks:
          - type: paragraph
            body: >-
              CPaaS market sizing estimates vary substantially by methodology and inclusion criteria. Gartner's
              conservative estimate places the 2025 market at $14.88 billion with 15.7% CAGR projected through 2028,
              reaching $17.03B in 2026. Grand View Research is more bullish at $21.31 billion for 2025 with 28.7% CAGR
              to $86.26B by 2030. IDC projects the market growing from $14.3B (2022) to $29.7B (2026) at 15.8% CAGR.
              Juniper Research estimates $30.2B in 2025 growing to $48.1B by 2029. Metrigy provides a more conservative
              view at $14.9B in 2025 with only 2.7% CAGR through 2030, citing market "right-sizing" and pricing
              pressures. These discrepancies arise from different definitions of what constitutes CPaaS spending,
              geographic coverage, and channel inclusion. The total addressable market using the broadest definition
              (Grand View) exceeds $86B by 2030. Infobip's serviceable addressable market (SAM) focuses on enterprise
              omnichannel communications, particularly in regulated industries like banking, healthcare, and retail
              where compliance and reliability are paramount. The company's serviceable obtainable market (SOM) is
              constrained by Twilio's dominance in North America and strong regional competitors in specific markets.
              Infobip's $2.3B ARR represents approximately 11-16% global market share depending on which sizing estimate
              is used.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
