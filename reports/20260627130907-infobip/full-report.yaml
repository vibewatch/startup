              - CR023
              - CR036
              - CR037
              - CR038
      - number: '7.3'
        title: Partner Dependence & Financial Model Risk
        blocks:
          - type: paragraph
            body: >-
              Infobip’s product breadth sits on top of dependencies it cannot fully control: carriers, channel owners,
              partner ecosystems, and now a meaningful lender group. That is not unusual in CPaaS, but it shapes
              downside scenarios. Rich-channel growth can improve product value, yet it also increases exposure to
              policy changes by Google, Apple, and Meta. Direct lending improved capital flexibility in 2025, but
              leverage means strategy errors or margin compression now matter more. Public materials imply confidence
              from sophisticated lenders and improving profitability, which is positive. Still, covenant detail,
              liquidity buffers, and downside headroom remain undisclosed. That combination makes the business
              financeable but not fully de-risked. Investors should treat partner dependence and leverage as the two
              risks most likely to amplify other issues if market conditions or channel economics deteriorate. In short,
              even strong operating momentum does not fully neutralize the asymmetry created by outside control points
              and debt obligations.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR023
              - CR026
              - CR027
              - CR032
              - CR035
