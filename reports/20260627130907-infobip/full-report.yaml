      - number: '1.3'
        title: Funding History & Valuation
        blocks:
          - type: paragraph
            body: >-
              Infobip operated as a bootstrapped company for its first 14 years, achieving profitability and significant
              scale before taking external capital. In June 2020, the company raised $200 million in its first and only
              institutional equity round from One Equity Partners, a middle-market private equity firm. This investment
              valued Infobip at over $1 billion, making it Croatia's first technology unicorn. Following the equity
              round, Infobip secured a $500 million debt facility in 2021 from Ares Management and BlackRock to fund
              acquisitions and expansion. In July 2025, the company refinanced this debt with a $520 million senior
              secured direct lending facility from BlackRock and Blue Owl Capital, extending maturities and improving
              terms. Total capital raised exceeds $1.2 billion across equity and debt. Current private market valuation
              estimates range from $5 billion to $10 billion based on revenue multiples applied to the company's $2.3
              billion+ ARR. The company has not announced IPO plans as of June 2026, though Croatian media speculation
              has suggested potential listings on European or US exchanges. One Equity Partners remains the only known
              institutional equity investor, with founders and early employees holding the remaining equity stakes.
