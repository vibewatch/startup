      - number: '3.4'
        title: Moat Durability & Competitive Risks
        blocks:
          - type: paragraph
            body: >-
              Infobip's competitive moat centers on direct carrier relationships and global infrastructure rather than
              developer ecosystem. The company maintains relationships with 800+ mobile network operators across 190+
              countries, enabling superior delivery rates, faster number provisioning, and pricing negotiation leverage.
              This moat is durable but not impenetrable: Twilio and Sinch are expanding carrier relationships, and scale
              advantages erode as competitors reach similar volumes. Switching costs are moderate: API integration
              requires development effort (weeks to months), but multi-vendor strategies are common as enterprises
              typically work with 2-3 CPaaS providers for redundancy. Distribution power differs by region: Twilio
              dominates US developer mindshare through marketing and community; Infobip leads in enterprise direct sales
