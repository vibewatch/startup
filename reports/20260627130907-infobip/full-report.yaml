            claimRefs:
              - CR006
              - CR008
              - CR026
              - CR031
              - CR032
      - number: '7.4'
        title: Mitigations, Monitoring Indicators & Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The public evidence base is strong enough to say Infobip is not unmanaged risk. Certificates, lender
              participation, product maturity, and global support all indicate real mitigation capability. The problem
              is that the remaining unknowns sit exactly where investment committees care most: residual debt
              constraints, incident frequency, customer concentration, and enforcement history. That means monitoring
              matters as much as today’s static judgment. A thesis should deteriorate if regulatory friction rises
              materially, if ecosystem partners change economics in ways Infobip cannot offset, if integration
              complexity starts impairing product execution, or if debt reduces strategic flexibility during a weaker
              market window. Conversely, the risk rating could improve with transparent evidence on covenants,
              incidents, and diversified customer exposure. Until then, risk is manageable but still meaningfully
              dependent on information outsiders do not currently have. That is why the default investment posture
              should be to keep a monitoring framework active instead of treating the current risk picture as fully
              settled.
            claimRefs:
              - CR019
              - CR020
              - CR024
              - CR028
              - CR030
              - CR034
              - CR039
              - CR040
