      - number: '2.3'
        title: Buyer & User Segmentation
        blocks:
          - type: paragraph
            body: >-
              CPaaS buyers segment into three primary categories: large enterprises, mid-market companies, and
              developers/startups. Large enterprises (Fortune 500, major banks, telcos) require enterprise-grade SLAs,
              compliance certifications (SOC 2, ISO 27001, HIPAA), dedicated support, and complex routing capabilities.
              These buyers typically engage through enterprise sales with annual contracts and minimum commitments.
              Mid-market companies prioritize ease of integration, predictable pricing, and omnichannel capabilities
              without extensive customization. The buyer in enterprises is typically the CTO/CIO or VP of Engineering,
              while the user is the development team implementing communications features. The payer is often
              procurement or finance with IT budget ownership. Developers and startups access CPaaS through self-service
              sign-up with pay-as-you-go pricing, evaluating primarily on developer experience, documentation quality,
              and time-to-integration. Adoption triggers include digital transformation initiatives, legacy system
              replacement, regulatory compliance requirements (2FA mandates), customer experience improvements, and cost
              reduction versus direct carrier contracts. By vertical, financial services represents the largest CPaaS
              spending segment due to transaction notifications, fraud alerts, and authentication requirements.
              Healthcare, retail/e-commerce, logistics, and travel follow as key verticals with specific compliance and
              notification needs.
            claimRefs:
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Growth Drivers & Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Primary growth drivers include digital transformation acceleration, particularly post-pandemic shifts to
              digital customer engagement. Enterprises increasingly require omnichannel communications across SMS,
              WhatsApp, voice, and emerging channels like RCS and Apple Messages for Business. Regulatory mandates for
              two-factor authentication (2FA) drive OTP volume growth across banking, healthcare, and e-commerce. The
              rise of conversational commerce—where transactions occur within messaging apps— expands the use case
              beyond notifications to full customer journeys. API-first architecture trends favor CPaaS over legacy
              integration approaches. Key constraints include SMS margin compression as the channel commoditizes and
              carriers demand higher termination fees. OTT messaging cannibalization threatens SMS volumes as WhatsApp,
              iMessage, and RCS offer free alternatives for personal messaging. Regulatory fragmentation creates
              compliance complexity: India's DLT registration requirements, GDPR consent management, TCPA 10DLC
              registration in the US, and varying sender ID regulations globally. Switching costs are moderate—while API
              integration requires development effort, multi-vendor strategies are common. Capital intensity remains low
              for CPaaS consumers but high for providers who must maintain direct carrier relationships and global
              infrastructure. Trust and reliability concerns favor established vendors with proven uptime and delivery
              rates.
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM017
              - CM018
          - type: table
            tableRef: TM004
            claimRefs:
