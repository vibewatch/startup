  - id: TR005
    title: Mitigation and Kill Criteria Table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold or event
      - Action implication
    rows:
      - - Privacy enforcement
        - Formal investigation or major fine
        - Material enforcement in a core jurisdiction
        - Raise risk rating and revisit expansion assumptions
      - - Debt pressure
        - Tighter lender terms or new security package
        - Evidence of shrinking flexibility
        - Lower valuation multiple and confidence
      - - Channel dependence
        - Major Google, Apple, or Meta pricing or access shift
        - Economic impact on rich-channel volumes
        - Rework channel-growth assumptions
      - - Operational execution
        - Repeated outages or delayed integrations
        - Pattern rather than one-off event
        - Treat mitigation maturity as overstated
      - - Customer concentration opacity
        - Management unwilling to share exposure data
        - No transparency in diligence
        - Increase residual risk and reduce conviction
    notes: The thresholds are investment-oriented rather than accounting thresholds.
    claimRefs:
      - CR021
      - CR022
      - CR030
      - CR035
      - CR040
