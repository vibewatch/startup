      - number: '1.2'
        title: Leadership & Governance
        blocks:
          - type: paragraph
            body: >-
              Silvio Kutić has served as Chief Executive Officer since founding the company in 2006, providing
              consistent leadership through two decades of growth and strategic expansion. His long tenure as CEO has
              enabled sustained strategic direction and deep industry relationships with telecommunications carriers
              worldwide. In January 2026, the company announced significant leadership changes designed to strengthen
              governance and operational capabilities. Ivan Burazin, known for founding Croatian tech company
              Codeanywhere, was appointed as Managing Director to oversee day-to-day operations. More notably, Mate
              Rimac—founder and CEO of electric supercar manufacturer Rimac Automobili—was appointed Chairman of the
              Supervisory Board, bringing entrepreneurial experience and international profile to the oversight
              function. Izabel Jelenić continues as Chief Technology Officer, maintaining technical leadership since the
              company's founding. Roberto Kutić, co-founder, departed the company in 2025 after nearly two decades. The
              supervisory board structure reflects European corporate governance standards typical of Croatian limited
              liability companies (d.o.o.), with separation between executive management and supervisory oversight. The
              company has expanded its executive team significantly over the past five years, adding C-level executives
              for marketing, revenue, product, and regional operations.
