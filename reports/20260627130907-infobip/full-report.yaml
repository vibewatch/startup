  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Growth slows materially
        - Drops below low double digits without margin offset
        - Weakens premium-case narrative
        - Re-rate to track or research-more
      - - Margin deterioration
        - Profitability proves non-durable
        - Undermines quality-of-revenue story
        - Cut target multiple
      - - Debt flexibility worsens
        - Covenant or refinancing pressure appears
        - Raises downside asymmetry
        - Require larger discount
      - - Partner or regulatory shock
        - Major channel-policy or enforcement event
        - Hits both growth and trust
        - Reassess recommendation
      - - Aggressive pricing at entry
        - Round prices well above public-comp corridor
        - Turns a good company into poor entry economics
        - Pass or renegotiate
    notes: >-
      Triggers are investment committee oriented and assume the business itself can remain fundamentally solid while the
      entry price becomes unacceptable.
    claimRefs:
      - CV023
      - CV024
      - CV028
      - CV031
      - CV037
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Audited financials
        - Full income statement, cash flow, and margin bridge
        - Needed to validate comp-quality earnings
        - Management and auditor diligence
      - - Capital structure
        - Share count, preferences, liquidation stack
        - Needed for actual entry price and downside math
        - Legal and finance diligence
      - - Debt package
        - Covenants, amortization, headroom
        - Leverage changes risk asymmetry
        - Lender or treasury diligence
      - - Customer quality
        - Top-customer concentration and retention
        - Needed to test durability assumptions
        - GTM and finance diligence
      - - Software mix
        - Module attach rates and gross margins
        - Needed to justify premium vs infrastructure comps
        - Product and finance diligence
    notes: These asks are the minimum set needed to move from medium-confidence recommendation to higher-confidence pricing.
    claimRefs:
      - CV020
      - CV021
      - CV029
      - CV035
