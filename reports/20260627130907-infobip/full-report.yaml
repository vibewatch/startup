  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model & Streams
        blocks:
          - type: paragraph
            body: >-
              Infobip generates revenue through three primary streams: transactional messaging fees
              (per-message/per-minute pricing for SMS, voice, WhatsApp, email), SaaS subscriptions for platform products
              (Conversations contact center, Moments marketing automation, Answers chatbot builder), and telecom carrier
              revenue share arrangements. The transactional messaging business likely represents 70-80% of revenue based
              on industry comparables, with SaaS subscriptions growing as the company expands its product portfolio.
              Revenue recognition follows usage-based accounting for messaging (recognized on delivery) and subscription
              accounting for SaaS products (ratably over contract term). International revenue dominates given the
              company's Croatia headquarters and strong presence in Europe, MENA, APAC, and Latin America. The US market
              represents a smaller but growing portion as Infobip expands North American sales efforts. Enterprise
              contracts typically include minimum monthly commits with overage pricing, while SMB customers operate on
              pure pay-as-you-go terms. Average contract values for enterprise customers likely exceed $100K annually
              based on 70,000+ customers generating $2.3B ARR (~$33K average, skewed by enterprise concentration).
