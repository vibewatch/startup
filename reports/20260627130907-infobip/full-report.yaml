  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, Confidence & Investment View
        blocks:
          - type: paragraph
            body: >-
              Infobip’s valuation debate starts from an unusual combination for CPaaS: very large scale, improving
              profitability, and still-private disclosure standards. That creates a genuine opportunity but also a
              confidence ceiling. The company is not a concept-stage growth story; it is a scaled infrastructure
              platform already operating in a global market with public peers. That scale justifies serious
              underwriting. At the same time, investors still lack the priced-equity signal, capital-structure detail,
              and cohort-level financial quality metrics that would normally turn a good business into a high-confidence
              investment. The right stance is therefore conditional rather than binary. If entry pricing remains
              anchored to disciplined public-comp logic, the opportunity is attractive enough for a buy. If round
              pricing assumes a premium well beyond public peers without disclosure improvement, the judgment should
              become much more cautious. That conditionality is what differentiates a buy recommendation at the right
              price from a willingness to chase a prestige private round at any price.
            claimRefs:
              - CV001
              - CV004
              - CV010
              - CV023
              - CV030
              - CV036
              - CV040
          - type: table
            tableRef: TV001
            claimRefs:
