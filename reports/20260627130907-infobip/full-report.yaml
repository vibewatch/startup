        - Category relevance
        - Shows strategic value to large acquirers
        - Segment disclosure limited
      - - Infobip debt transaction
        - Private financing context
        - Confirms lender confidence
        - Useful signal on credit quality
        - Not a priced equity mark
    notes: >-
