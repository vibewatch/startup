      - number: '4.2'
        title: Pricing Model & Unit Economics
        blocks:
          - type: paragraph
            body: >-
              CPaaS pricing follows a gross margin arbitrage model: Infobip negotiates wholesale rates with carriers
              (typically $0.002-0.005/SMS) and sells to enterprises at retail rates ($0.006-0.015/SMS), capturing 30-60%
              gross margin on messaging. Voice pricing follows similar dynamics with per-minute rates. WhatsApp Business
              API pricing includes Meta's conversation-based fees plus Infobip's margin. The SaaS products
              (Conversations, Moments, Answers) likely command higher gross margins (70-80%) typical of software.
              Blended gross margins for Infobip are estimated at 40-55% based on Twilio's 50% gross margin benchmark and
              Infobip's stronger carrier relationships providing cost advantages. Customer acquisition cost (CAC) and
              payback periods are not disclosed, but enterprise sales cycles typically run 3-9 months for CPaaS with CAC
              payback of 12-24 months. Net revenue retention is likely strong (>100%) given messaging volume growth with
              existing customers, though not publicly disclosed. The company's 18-year bootstrapped history suggests
              disciplined unit economics—founders retained control through 2020 without external capital, implying
              sustainable cash generation from operations.
