              - CV030
      - number: '8.2'
        title: Comparable Set & Current Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Public comps are imperfect but still informative. Twilio offers the cleanest scale benchmark and
              public-market sentiment read-through. Sinch is strategically closer on global messaging breadth. Bandwidth
              provides a lower-multiple infrastructure reference point. Together they define a comp corridor rather than
              a single target. Infobip’s 2025 lending package signals institutional confidence, but debt is not the same
              as fresh equity pricing and does not by itself validate any private database estimate. The safest
              interpretation is that Infobip deserves a serious revenue-multiple framework, tempered by a
              private-company discount and comp-set limitations. Investors should resist database marks that imply a far
              richer multiple than public peers unless new equity evidence, materially faster growth, or much stronger
              disclosure emerges. Valuation must remain tied to actual underwriting inputs rather than to unicorn
              signaling. The implication is that valuation work should remain anchored to observed public trading
              behavior, not to category mythology.
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV014
              - CV015
              - CV026
              - CV033
          - type: table
            tableRef: TV004
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV008
              - CV026
              - CV033
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV011
              - CV014
              - CV015
      - number: '8.3'
        title: Bull / Base / Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis is more useful than point estimates because the key uncertainty is not whether Infobip
              is real, but how much investors should pay for a large but partially opaque private asset in a maturing
              category. The bull case requires sustained mid-teens revenue growth, continued profitability, and evidence
              that software and richer channels are increasing the quality of revenue. The base case assumes a healthy
              but not premium comp corridor and a continuing private-company discount. The bear case assumes category
              multiple pressure, leverage sensitivity, and no near-term disclosure improvement. Importantly, these
              scenarios should not be read as forecasts of business failure or success alone. They are pricing
              frameworks that weight both company execution and market mood. Because of that, the decision threshold
              depends heavily on round terms and on whether diligence can close the current capital-structure and
              customer-quality blind spots. That makes downside discipline at least as important as upside imagination.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV016
              - CV027
              - CV028
              - CV039
          - type: table
            tableRef: TV003
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV027
              - CV039
          - type: table
            tableRef: TV005
            claimRefs:
              - CV023
              - CV024
              - CV028
              - CV031
              - CV037
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV027
              - CV039
      - number: '8.4'
        title: Exit Readiness, Diligence Asks & Thesis Breakers
        blocks:
          - type: paragraph
            body: >-
              Infobip looks increasingly exit-credible but not yet exit-transparent. Profitability and scale support the
              idea that it could eventually approach public markets or large-scale secondary processes from a position
              of strength. Public evidence still stops short of confirming timing, structure, or precise valuation
              mechanics. For that reason, the most important investment work is still diligence, not modeling
              sophistication. Audited financials, capital structure, lender terms, customer concentration, and retention
              quality would all materially sharpen the recommended price. Until then, investors should monitor four
              thesis-break areas: slower growth, weaker margin conversion, partner or regulatory shocks, and any sign
              that leverage reduces strategic flexibility. If those triggers worsen without offsetting disclosure
              improvement, even a good business can become a poor investment at the wrong price. The right next step is
              therefore to convert this chapter from a public-data pricing frame into a diligence-backed entry
              framework. Pricing without that work would mostly be guesswork.
            claimRefs:
              - CV020
              - CV021
              - CV022
              - CV028
              - CV029
              - CV034
              - CV035
              - CV038
          - type: table
            tableRef: TV006
            claimRefs:
              - CV020
              - CV021
              - CV029
              - CV035
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: This is a real scaled asset, not a narrative-only private round
            body: >-
              Infobip’s revenue scale and improving profitability mean valuation can be anchored to public-market logic
              rather than only to story-driven venture pricing.
            calloutType: strength
            claimRefs:
              - CV001
              - CV003
              - CV004
          - type: callout
            title: Price discipline matters more than business quality
            body: >-
              A strong business can still be a weak investment if round pricing assumes a premium not supported by
              public comps or disclosure quality.
            calloutType: risk
            claimRefs:
              - CV010
              - CV023
              - CV024
          - type: callout
            title: Base case supports buy only with medium confidence
            body: >-
              The recommendation remains buy only when entry falls inside a disciplined comp corridor and when diligence
              closes capital-structure and concentration blind spots.
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV029
              - CV036
          - type: callout
            title: Opacity is the conviction cap
            body: >-
              The biggest constraint is not lack of commercial evidence but lack of direct public pricing, share-count,
              and covenant detail.
            calloutType: risk
            claimRefs:
              - CV020
              - CV021
              - CV035
