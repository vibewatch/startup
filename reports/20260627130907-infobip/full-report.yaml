  - id: TV003
    title: Bull / Base / Bear Scenario Table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - Mid-teens growth persists, profit scales, software mix improves
        - ~$5.0B valuation or attractive return if entry is near base
        - Rich-channel dependence and market multiple compression
        - Possible but needs more proof
      - - Base
        - Growth stays healthy, profit holds, disclosure improves modestly
        - ~$3.0B-$4.2B fair-value corridor
        - Disclosure discount persists
        - Most defensible on public data
      - - Bear
        - Category multiples compress and leverage matters more
        - ~$2.2B-$2.7B downside corridor
        - Margin pressure, partner shocks, weak transparency
        - Real if pricing is aggressive
    notes: Ranges are derived from revenue-multiple framing anchored to public peers and a private-company discount.
