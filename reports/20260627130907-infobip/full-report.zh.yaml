  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与收入流
        blocks:
          - type: paragraph
            body: >-
              Infobip 通过三类主要收入流变现：交易型消息费用（SMS、语音、WhatsApp、电子邮件按消息 / 分钟计费）、平台产品的 SaaS 订阅（Conversations 联络中心、Moments
              营销自动化、Answers 聊天机器人构建器），以及电信运营商收入分成安排。参照行业可比公司，交易型消息业务可能占收入的 70-80%；随着公司扩展产品组合，SaaS 订阅在增长。
              消息收入按用量确认（送达时确认），SaaS 产品按订阅会计处理（合同期内按比例确认）。鉴于公司总部在克罗地亚，并在欧洲、MENA、APAC 和拉美有强存在，国际收入占主导。 随着 Infobip
              加强北美销售，美国市场占比较小但在增长。企业合同通常包含最低月度承诺和超额定价，SMB 客户则采用纯按量付费。按 70,000+ 客户贡献 $2.3B ARR 估算，企业客户平均合同价值可能每年超过
              $100K（平均约 $33K，但受企业集中度影响而偏斜）。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
