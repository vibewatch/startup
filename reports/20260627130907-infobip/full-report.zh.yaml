        title: 主要竞争对手画像
        blocks:
          - type: paragraph
            body: >-
              Twilio Inc.（NYSE: TWLO）是最大的纯 CPaaS 提供商，2024 年收入 $4.4B，客户账户 300,000+，总部位于 San Francisco。Twilio 由 Jeff
              Lawson 于 2008 年创立，开创了 API 优先的通信模式，并于 2016 年上市。尽管规模庞大，Twilio 已累积重大亏损（累计 -$4B+），并在新 CEO Khozema Shipchandler
              领导下于 2023-2024 年重组。Twilio 的优势在开发者生态、广泛集成，以及收购 Segment 后获得的客户数据能力。Sinch AB （OM: SINCH）是瑞典 CPaaS 公司，2024 年收入
              SEK 27.1B（约 $2.7B USD），在欧洲 SMS 和语音领域强势。Sinch 通过 M&A 快速增长，包括 Inteliquent、Pathwire（Mailgun/Mailjet）和
              MessageMedia。Bird（原 MessageBird）总部位于 Amsterdam，报告 ARR 约 $900M，定位为全渠道客户互动平台。Bird 募资 $1B+ 并达到独角兽地位，但 2023
              年经历裁员。Vonage 于 2022 年被 Ericsson 以 $6.2B 收购，将 UCaaS 传统与 CPaaS 能力结合，服务企业语音和消息。Bandwidth Inc.（NASDAQ:
              BAND）聚焦美国语音基础设施，2024 年收入 $628M， 拥有 PSTN 网络资产并获得成本优势。Plivo（私营）和 Kaleyra（被 Tata 收购）分别服务中端市场和区域客户。
