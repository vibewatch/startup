              股权融资，意味着融资前已具备显著收入规模。2021 年 $500M 信贷额度（Goldman Sachs 牵头，后由 Ares/BlackRock 再融资）和 2025 年 $520M
              直接贷款确认了银行级信用画像。客户指标显示留存较强：70,000+ 客户贡献 $2.3B，尽管有 SMB 长尾，平均客户收入仍健康。 2006-2020
              年的自举阶段证明，公司无需依赖外部资本也能维持单位经济。作为私营公司，确切 EBITDA、净利润、毛利率和留存率仍未披露。
