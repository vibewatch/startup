  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              Communications Platform as a Service (CPaaS) 指基于云的 API 和
              SDK，让企业无需自建后端基础设施，就能把实时通信——SMS、语音、视频、电子邮件和消息应用——嵌入自己的应用。 市场边界包括通过 API 交付的消息（A2P SMS、RCS、WhatsApp
              Business）、可编程语音、视频会议 API、电子邮件交付 API 和认证服务（OTP、2FA）。 邻近市场包括 UCaaS（Unified Communications as a
              Service）、CCaaS（Contact Center as a Service）和传统电信运营商服务。CPaaS TAM 估算通常排除消费者消息应用（WhatsApp
              personal、iMessage）、运营商间互联费用，以及企业 PBX/PSTN 替换支出。企业采用 CPaaS 前的现状替代方案，是直接运营商合同、传统 SMS 聚合商或自建消息基础设施。CPaaS
              用开发者友好的 API、多渠道支持、全球覆盖和按量定价替代这些方案。核心价值主张是让企业无需管理电信关系或基础设施，就能跨渠道大规模触达客户。 监管考量包括 GDPR（欧洲）、TCPA（美国）、TRAI
              DLT（印度）以及影响跨境消息合规的本地发件人 ID 规定。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM003
      - number: '2.2'
        title: TAM/SAM/SOM 分析
        blocks:
          - type: paragraph
            body: >-
              CPaaS 市场规模估计因方法和纳入标准不同而差异很大。Gartner 的保守估算认为 2025 年市场为 $14.88B，预计到 2028 年 CAGR 为 15.7%，2026 年达到
              $17.03B。Grand View Research 更乐观，给出 2025 年 $21.31B，并预计到 2030 年以 28.7% CAGR 增至 $86.26B。IDC 预计市场从 2022 年
              $14.3B 增至 2026 年 $29.7B，CAGR 为 15.8%。Juniper Research 估计 2025 年为 $30.2B，到 2029 年增至 $48.1B。Metrigy 更保守，认为
              2025 年为 $14.9B，到 2030 年 CAGR 仅 2.7%，理由是市场“right-sizing”和定价压力。差异来自各机构对 CPaaS 支出定义、地域覆盖和渠道纳入的不同。按最宽定义（Grand
              View），总可寻址市场到 2030 年超过 $86B。Infobip 的服务可寻址市场（SAM）聚焦企业全渠道通信， 尤其是银行、医疗和零售等合规与可靠性至上的受监管行业。公司的服务可获得市场（SOM）受到
              Twilio 在北美的主导地位，以及特定市场强势区域竞争者的限制。按所采用的市场规模估算不同， Infobip 的 $2.3B ARR 约代表全球 11-16% 的市场份额。
