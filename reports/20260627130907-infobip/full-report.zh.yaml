              land-and-expand 潜力：一个从 SMS 或 WhatsApp 起步的账户，之后可以增加旅程、机器人、语音或联络中心软件。评测平台提供了一些外部信号，说明产品确实被真实客户使用，
              但这些数据集还不够深，不能支撑流失风险判断。因此，本章最大的分析缺口是没有披露 NRR、GRR、流失率或续约率。公开证据允许我们说，产品看起来已嵌入且具备商业相关性； 但不能量化相对其他规模化 CPaaS
              供应商，其客户基础有多粘。这是有利的定性信号，但不应被误认为能够证明 cohort 在预算削减或采购重招标中仍然强劲。
