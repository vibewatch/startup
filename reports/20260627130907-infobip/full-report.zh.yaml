      - number: '8.4'
        title: 退出就绪度、尽调要求与论点破坏因素
        blocks:
          - type: paragraph
            body: >-
              Infobip
              越来越具备可信退出条件，但还谈不上退出透明。盈利能力和规模支撑一种判断：公司最终可以以强势位置接近公开市场或大规模二级交易。公开证据仍不足以确认时点、结构或精确估值机制。因此，最重要的投资工作仍是尽调，而不是模型复杂度。经审计财务、资本结构、贷款方条款、客户集中度和留存质量，都会实质性校准建议价格。在那之前，投资者应监测四类论点破坏区域：增长放缓、利润率转化变弱、伙伴或监管冲击，以及任何显示杠杆削弱战略灵活性的迹象。若这些触发器恶化且没有披露改善来抵消，即使是好业务，也可能在错误价格下变成差投资。因此，正确的下一步是把本章从公开数据定价框架，转成有尽调支撑的进入框架。没有这项工作，定价大多只是猜测。
            claimRefs:
              - CV020
              - CV021
              - CV022
              - CV028
              - CV029
              - CV034
              - CV035
              - CV038
