        title: 公司身份与创立历史
        blocks:
          - type: paragraph
            body: >-
              Infobip d.o.o. 于 2006 年 4 月 13 日在克罗地亚 Vodnjan 创立，三位创始人是 Silvio Kutić（CEO）、Roberto Kutić 和 Izabel
              Jelenić（CTO）。公司最初是一家小型 SMS 消息初创公司，专注提供移动通信服务，后来成长为云通信基础设施的全球领先者。
              创始团队很早看到企业消息服务的机会，先在欧洲与移动网络运营商建立直连关系，再向全球扩张。2020 年，One Equity Partners 以超过 $1B 的估值投资 $200M 后，Infobip
              成为克罗地亚第一家、也是唯一一家科技独角兽。公司仍为私营，总部位于克罗地亚 Vodnjan，并在 London、New York、Singapore、Mumbai 和 Kuala Lumpur
              设有主要运营办公室。截至 2025 年，Infobip 在 6 大洲运营 75+ 个办公室，全球员工约 4,000 人，相比十年前不足 100 人大幅增长。公司的法律结构是克罗地亚有限责任公司 （društvo
              s ograničenom odgovornošću，即 d.o.o.），注册总部位于克罗地亚 Istria 地区、靠近 Pula 的 Vodnjan。
