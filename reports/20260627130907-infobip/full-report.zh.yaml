        title: 融资历史与估值
        blocks:
          - type: paragraph
            body: >-
              Infobip 前 14 年一直自举经营，在引入外部资本前已实现盈利并达到相当规模。2020 年 6 月，公司从中端市场私募股权机构 One Equity Partners 获得第一轮、也是唯一一轮机构股权融资
              $200M。该投资给予 Infobip 超过 $1B 的估值，使其成为克罗地亚第一家科技独角兽。 股权轮之后，Infobip 于 2021 年从 Ares Management 和 BlackRock 获得
              $500M 债务额度，用于并购和扩张。2025 年 7 月， 公司以 BlackRock 和 Blue Owl Capital 提供的 $520M
              高级担保直接贷款对该债务再融资，延长期限并改善条款。公司通过股权和债务合计募集资本超过 $1.2B。按公司 $2.3B+ ARR 套用收入倍数，当前私募市场估值估计在 $5B 至 $10B 之间。截至 2026
              年 6 月，公司尚未宣布 IPO 计划，尽管克罗地亚媒体曾猜测其可能在欧洲或美国交易所上市。One Equity Partners 仍是唯一已知机构股权投资方，创始人和早期员工持有其余股权。
