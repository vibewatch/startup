      - number: '2.5'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              CPaaS 市场在多个细分领域竞争激烈。Twilio 以 2025 年 $5.07B 收入和最大的集成生态主导北美开发者市场。Sinch（瑞典）2024 年收入 SEK 27.1B（约 $2.7B），在欧洲
              SMS 和语音领域强势。Bird（原 MessageBird）瞄准全渠道互动，估计 ARR 为 $900M。Vonage（被 Ericsson 以 $6.2B
              收购）服务企业语音和消息。Bandwidth（BAND）聚焦美国语音基础设施和 911 服务。较小的纯 CPaaS 玩家包括 Plivo、Kaleyra（被 Tata Communications
              收购）和区域专家。Infobip 的差异化来自全球 800+ 运营商直连、盈利能力（不同于 Twilio 过往亏损）以及北美以外的强势存在。市场集中度中等——前 5 名玩家可能控制全球支出的
              40-50%，其后是大量区域和专业供应商。整合仍在通过 M&A 推进：Ericsson-Vonage、Tata-Kaleyra，以及 Infobip 对 OpenMarket、Anam 和 Peerless
              Network 的收购。
