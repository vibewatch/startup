      - number: '2.3'
        title: 买方与用户分层
        blocks:
          - type: paragraph
            body: >-
              CPaaS 买方分为三类：大型企业、中端市场公司和开发者 / 初创公司。大型企业（Fortune 500、大型银行、电信公司）需要企业级 SLA、合规认证（SOC 2、ISO 27001、HIPAA）、
              专属支持和复杂路由能力。这类买方通常通过企业销售进入，签年度合同并设最低承诺。中端市场公司更看重易集成、价格可预测和全渠道能力，不需要大量定制。企业里的买方通常是 CTO/CIO
              或工程副总裁，用户是落地通信功能的开发团队，付款方往往是掌握 IT 预算的采购或财务。开发者和初创公司通过自助注册、按量付费使用 CPaaS，主要评估开发者体验、文档质量和集成时间。
              采用触发因素包括数字化转型、替换遗留系统、监管合规要求（2FA 强制）、客户体验改善，以及相对直接运营商合同的成本下降。按垂直行业看，金融服务因交易通知、欺诈提醒和认证需求，构成最大的 CPaaS 支出板块。
              医疗、零售 / 电商、物流和旅游也是关键垂直，分别有特定合规和通知需求。
            claimRefs:
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              核心增长驱动来自数字化转型加速，尤其是疫情后客户互动转向数字渠道。企业越来越需要覆盖 SMS、WhatsApp、语音以及 RCS、Apple Messages for Business
              等新兴渠道的全渠道通信。双因素认证（2FA）的监管要求推动银行、医疗和电商的 OTP 量增长。会话式商务兴起——交易在消息应用内完成——把用例从通知扩展到完整客户旅程。 API 优先的架构趋势让 CPaaS
              比传统集成方式更有利。主要约束包括 SMS 渠道商品化后利润率被压缩，运营商要求更高终止费。OTT 消息替代威胁 SMS 量，因为 WhatsApp、 iMessage 和 RCS
              为个人消息提供免费替代。监管碎片化制造合规复杂性：印度 DLT 注册要求、GDPR 同意管理、美国 TCPA 10DLC 注册，以及全球各地不同的发件人 ID 规定。 切换成本中等——API
              集成需要开发投入，但多供应商策略很常见。CPaaS 消费方资本强度低，但提供方资本强度高，需要维持运营商直连关系和全球基础设施。信任和可靠性顾虑让有稳定运行时间和送达率记录的成熟供应商受益。
