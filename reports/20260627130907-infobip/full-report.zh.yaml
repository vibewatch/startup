        title: 图表
        blocks:
          - type: callout
            title: 这是真实规模资产，不只是叙事型私募轮
            body: Infobip 的收入规模和盈利改善意味着，估值可以锚定公开市场逻辑，而不只靠故事驱动的风投定价。
            calloutType: strength
            claimRefs:
              - CV001
              - CV003
              - CV004
          - type: callout
            title: 价格纪律比业务质量更重要
            body: 如果轮次定价假设了上市可比公司或披露质量都支撑不了的溢价，强业务仍可能是弱投资。
            calloutType: risk
            claimRefs:
              - CV010
              - CV023
              - CV024
          - type: callout
            title: 基准情景只支持中等信心买入
            body: 只有进入价格落在有纪律的可比区间内，且尽调关闭资本结构和集中度盲点，建议才维持买入。
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV029
              - CV036
          - type: callout
            title: 不透明是确信度上限
            body: 最大约束不是缺少商业证据，而是缺少直接公开定价、股数和契约细节。
            calloutType: risk
            claimRefs:
              - CV020
              - CV021
              - CV035
