      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Silvio Kutić 自 2006 年创立公司以来一直担任首席执行官，在近二十年的增长和战略扩张中提供了稳定领导。他长期担任 CEO， 让公司得以保持战略方向，也沉淀了与全球电信运营商的深厚行业关系。2026
              年 1 月，公司宣布重大领导层调整，意在强化治理和运营能力。 Ivan Burazin 因创立克罗地亚科技公司 Codeanywhere 而知名，被任命为 Managing
              Director，负责日常运营。更值得注意的是，电动超跑制造商 Rimac Automobili 的创始人兼 CEO Mate Rimac 被任命为监事会主席，把创业经验和国际知名度带入监督职能。Izabel
              Jelenić 继续担任首席技术官，自公司创立以来维持技术领导。联合创始人 Roberto Kutić 在近二十年后于 2025 年离开公司。监事会结构体现了克罗地亚 d.o.o.
              常见的欧洲公司治理标准，即执行管理与监督职能分离。过去五年，公司显著扩充高管团队，新增负责营销、收入、产品和区域运营的 C 级高管。
