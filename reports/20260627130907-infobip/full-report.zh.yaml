      - number: '8.2'
        title: 可比公司集合与当前估值背景
        blocks:
          - type: paragraph
            body: >-
              上市可比公司不完美，但仍有信息量。Twilio 提供最干净的规模基准和公开市场情绪读数。按全球消息业务宽度看，Sinch 在战略上更接近。Bandwidth
              则给出低倍数基础设施参照点。三者合在一起，定义的是一个可比区间，而不是单一目标。Infobip 的 2025
              年贷款方案释放了机构信心，但债务不是新股权定价，本身也不能验证任何私人数据库估值。最稳妥的解读是，Infobip
              值得用严肃的收入倍数框架评估，同时要用私人公司折价和可比集合局限性压一压。除非出现新的股权证据、明显更快增长或强得多的披露，否则投资者应抵制那些暗示其倍数远高于上市同业的数据库标记。估值必须绑在真实承销输入上，而不是绑在独角兽信号上。也就是说，估值工作应锚定已观察到的公开市场交易行为，而不是品类神话。
            claimRefs:
              - CV002
