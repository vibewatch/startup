      - number: '8.3'
        title: 牛市 / 基准 / 熊市情景
        blocks:
          - type: paragraph
            body: >-
              情景分析比点估计更有用，因为关键不确定性不是 Infobip 是否真实，而是投资者应为一个处在成熟品类中、规模很大但部分不透明的私人资产支付多少。牛市情景需要收入持续实现 mid-teens
              增长、盈利能力延续，并有证据显示软件和更丰富渠道正在提升收入质量。基准情景假设可比区间健康但不享受溢价，私人公司折价继续存在。熊市情景假设品类倍数承压、杠杆敏感，且近期披露没有改善。重要的是，这些情景不应只被理解为业务成败预测。它们是定价框架，同时给公司执行和市场情绪赋权。因此，决策门槛高度取决于轮次条款，也取决于尽调能否关闭当前资本结构和客户质量盲点。下行纪律因此至少和上行想象力一样重要。
            claimRefs:
              - CV011
