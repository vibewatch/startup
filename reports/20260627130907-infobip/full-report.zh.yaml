        title: 全球运营与规模
        blocks:
          - type: paragraph
            body: >-
              Infobip 已建立真正全球化的运营足迹，直接覆盖 200+ 个国家和地区。公司在全球设有 75+ 个办公室，重点分布于欧洲（包括 London、Zagreb、Berlin 和 Madrid）、北美（New
              York、San Francisco）、亚太（Singapore、Mumbai、Jakarta、Kuala Lumpur）、中东（Dubai）和拉美（São Paulo、Mexico
              City）。广泛的地域存在让公司能为客户提供本地化支持，并在每个市场维持与电信运营商的直接关系。公司服务 70,000+ 企业客户，覆盖银行、电信、零售、物流和科技等行业的主要全球品牌。Infobip 在
              100+ 个国家保持运营商直连，这是相对依赖聚合商或批发安排的竞争对手的关键差异。 这种直连模式带来更高送达可靠性、更快消息吞吐和更好的成本经济性。截至 2025 年，公司员工规模已增至全球约 4,000
              人，并在克罗地亚、塞尔维亚、波兰和印度设有工程中心。 关键运营指标包括每年通过 SMS、WhatsApp、RCS 和其他渠道处理数十亿条消息。
