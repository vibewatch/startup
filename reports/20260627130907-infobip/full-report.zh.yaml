  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Infobip 所处的是软件基础设施里监管最密集的区域之一。全球通信平台必须处理电信发送方规则、隐私法、身份要求、反垃圾信息制度，以及各国不同的注册机制。即便没有看到单一执法事件，监管风险也会持续存在。GDPR
              重要，因为通信和客户数据流常常与身份、同意和画像交叉。印度重要，因为电信注册和发送方控制一旦处理不当，会立刻影响流量送达。证书和政策姿态释放了公开缓释信号，但这不等于没有执法敞口。投资者最稳妥的立场是：把合规视为
              Infobip 的能力，同时假设合规仍然昂贵、动态，并且在规则收紧或本地执行失误时可能带来尖锐下行。法律复杂度还会叠加，因为客户配置活动、模板、同意收集和存储实践的方式，本身也可能制造合规敞口。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR021
