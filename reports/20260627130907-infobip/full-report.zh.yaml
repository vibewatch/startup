  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、信心与投资观点
        blocks:
          - type: paragraph
            body: >-
              Infobip 的估值争论，起点是 CPaaS
              中少见的组合：规模很大、盈利改善，但披露标准仍停留在私人公司水平。这创造了真实机会，也给信心封了顶。公司不是概念阶段的增长故事；它已经是有规模的基础设施平台，在一个有上市可比公司的全球市场里运营。这样的规模值得认真承销。与此同时，投资者仍缺少定价股权信号、资本结构细节，以及
              cohort
              级财务质量指标；这些通常会把一家好公司变成高确信投资。因此，正确姿态应是有条件的，而不是二元判断。若进入价格仍锚定有纪律的上市可比逻辑，机会足够有吸引力，可以买入。若轮次定价在披露没有改善的情况下假设远高于上市同业的溢价，判断就应谨慎得多。正是这种条件性，把「合适价格下的买入建议」和「不惜价格追逐有名气的私募轮」区分开。
            claimRefs:
              - CV001
              - CV004
              - CV010
              - CV023
              - CV030
              - CV036
              - CV040
