      - number: '4.2'
        title: 定价模型与单位经济
        blocks:
          - type: paragraph
            body: >-
              CPaaS 定价遵循毛利套利模型：Infobip 与运营商谈判批发费率（通常 $0.002-0.005/SMS），再以零售费率（$0.006-0.015/SMS）卖给企业，在消息上获得 30-60%
              毛利率。语音定价也有类似的按分钟费率逻辑。WhatsApp Business API 定价包含 Meta 基于会话的费用加上 Infobip 的利润。SaaS 产品
              （Conversations、Moments、Answers）可能拥有软件典型的更高毛利率（70-80%）。参照 Twilio 50% 毛利率基准，以及 Infobip 更强运营商关系带来的成本优势，
              Infobip 混合毛利率估计为 40-55%。客户获取成本（CAC）和回本周期未披露，但 CPaaS 企业销售周期通常为 3-9 个月，CAC 回本 12-24 个月。由于现有客户消息量增长，
              净收入留存率可能较强（>100%），但未公开披露。公司 18 年自举历史显示单位经济纪律较强——创始人在 2020 年前未引入外部资本仍保持控制权，说明运营可以持续产生现金。
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
