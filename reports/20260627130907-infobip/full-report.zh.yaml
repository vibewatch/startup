            body: 作为私营公司，Infobip 披露的财务细节很少。准确毛利率、EBITDA、净利润和留存指标未公开，带来估值不确定性。
            calloutType: risk
            claimRefs:
              - CI009
              - CI017
          - type: callout
            title: SMS 利润率压力
            body: 运营商费用上涨和 OTT 蚕食，压低了 SMS 毛利率；SMS 占收入大头。利润率能否持续，取决于 SaaS 扩张和高端渠道增长。
            calloutType: risk
            claimRefs:
              - CI006
              - CI010
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与模块地图
        blocks:
          - type: paragraph
            body: >-
              Infobip 如今不再只把自己呈现为 SMS 网关。官方产品材料描述的是一套分层通信栈：SMS、语音、电子邮件、WhatsApp、RCS、聊天应用等核心 CPaaS 渠道；客户旅程编排工具；以及
              Conversations、Moments、Answers、People 等 SaaS 应用。战略上，这很重要，因为买方价值正在从低利润的消息传输，转向更高层的工作流所有权。
              平台看起来服务客户内部的多个用户：开发者集成 API，运营团队路由通知，营销人员跑活动，支持团队使用联络中心工具。这种宽度提高了既有账户内扩张潜力，也降低了对单一渠道的依赖。 与此同时，Infobip
              销售的模块越多，就越需要在异构产品之间维持一致 UX、发布质量和支持，而不是只维护单一 API 表面。公司也越来越会被按平台一致性评估：企业能否不拼接大量外部供应商， 就把渠道
              API、数据、机器人、营销活动和支持工作流接起来。定位中已经能看到这一套一致性叙事，但公开产品证据尚未充分量化各模块的 attach rate。
