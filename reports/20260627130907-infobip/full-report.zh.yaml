      - number: '4.3'
        title: 成本结构与利润率
        blocks:
          - type: paragraph
            body: >-
              Infobip 的成本结构分为收入成本（运营商费用、基础设施、交付成本）和运营费用（R&D、销售 / 营销、G&A）。运营商终止费是最大 COGS 组成，转嫁成本随地域和渠道变化。
              基础设施成本包括数据中心、API 平台和全球网络运营。公司在 60+ 个国家运营 75+ 个办公室，带来显著 G&A 开销，但也支撑本地合规和销售存在。3,700+ 员工的薪酬成本可能是最大运营费用。 R&D
              投资用于平台开发、新渠道（RCS、Apple Messages）和 AI/ML 能力。销售和营销同时支持企业直销和开发者自助渠道。SMS 毛利率受运营商费用上涨结构性挑战，但 SaaS
              和更高利润率渠道（WhatsApp、RCS）多元化会随时间改善收入组合。公司声明和融资活动证实其 EBITDA 盈利——BlackRock 和 Blue Owl 提供的 $520M 直接贷款需要可证明的现金流。
              净利率和营运资本动态未披露。CPaaS 的资本开支强度中等，主要是软件开发资本化和基础设施。
            claimRefs:
