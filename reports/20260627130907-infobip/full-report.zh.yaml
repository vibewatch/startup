  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              CPaaS 竞争格局横跨多个类别：直接 CPaaS 竞争对手（Twilio、Sinch、Bird）、已被大公司收购的 CPaaS 玩家（Vonage/Ericsson、Kaleyra/Tata）、
              基础设施型玩家（Bandwidth、Plivo），以及现状替代方案（直接运营商合同、Syniverse 等传统 SMS 聚合商）。Twilio 以 $4.4B 的 2024 年收入和最大的开发者生态占据主导，
              尽管盈利能力承压（累计亏损 -$4B）。Sinch 以 SEK 27.1B（约 $2.7B）收入持有强欧洲份额。Bird（原 MessageBird）瞄准全渠道互动， ARR 约
              $900M。区域专家（Africa's Talking、印度 Gupshup）控制本地市场。市场集中度中等，前 5 名玩家持有 40-50% 份额，其后是大量区域供应商。 邻近竞争对手包括向消息领域扩张的
              CCaaS 厂商（Five9、Genesys），以及提供直接企业消息、绕开传统 CPaaS 的 OTT 平台（Meta WhatsApp Business、Google RCS）。 整合仍在继续：Ericsson
              于 2022 年以 $6.2B 收购 Vonage，Tata 于 2024 年收购 Kaleyra，Infobip 自身也进行了包括 OpenMarket、Anam 和 Peerless Network
              在内的战略并购。
            claimRefs:
              - CP001
