        title: 资本充足性与融资
        blocks:
          - type: paragraph
            body: >-
              Infobip 的资本结构同时反映自举效率和成长期融资。公司从创立（2006 年）到 2020 年一直没有外部股权，完全由留存收益支持。2020 年股权轮（约 $30M、估值 $1B+，
              主要为老股转让）标志着首次外部资本。2021 年，$500M 信贷额度（Goldman Sachs 牵头财团）提供 M&A 和营运资本能力。该额度随后由 Ares Management 和 BlackRock
              参与再融资。2025 年 7 月，BlackRock 和 Blue Owl Capital 提供的 $520M 高级担保直接贷款，为地域扩张和并购提供额外增长资本。 股权与债务合计后，总募集资本接近
              $1B+。直接贷款结构意味着强现金流覆盖率，也显示银行对 EBITDA 可持续性的信心。鉴于盈利画像，现金 runway 实质上没有限制——不同于亏损竞争对手， Infobip
              不依赖融资维持运营。考虑规模（$2.3B ARR、估计估值 $10B+），公司存在 IPO 可选性，但尚未宣布公开申报。
