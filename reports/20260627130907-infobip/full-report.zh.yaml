      - number: '3.3'
        title: 能力与定价对比
        blocks:
          - type: paragraph
            body: >-
              CPaaS 提供商在渠道（SMS、语音、视频、电子邮件、WhatsApp、RCS）、地域覆盖、开发者体验、企业功能和定价上竞争。Twilio 提供最广渠道覆盖和集成生态， 但定价较高（美国约
              $0.0079/SMS segment）。Infobip 渠道宽度相当，同时凭全球 800+ 运营商直连形成差异，带来更好送达率和定价灵活性。Sinch 以强 AI 路由在 SMS 送达优化上领先。Bird
              更强调统一收件箱和客户互动工作流，而非原始 API 访问。定价模型各异：按消息 / 分钟计费（Twilio、Infobip、Sinch）、 承诺用量折扣（企业层级），以及打包 SaaS
              订阅（Bird、Infobip Moments/Conversations）。企业定价高度可谈，包含用量阶梯、最低承诺和定制 SLA。功能缺口方面： Infobip 在 RCS business
              messaging 和 WhatsApp Business API 上领先；Twilio 在视频（收购 Twilio Video）和客户数据平台（Segment）领先。 Bandwidth 以自有 PSTN
              网络实现更低语音成本。开发者体验差异明显：Twilio 是文档 / SDK 的黄金标准；Infobip 已显著改善，但在美国开发者心智中仍落后。合规和信任功能 （SOC 2、ISO
              27001、HIPAA）已是企业交易的入场券。
