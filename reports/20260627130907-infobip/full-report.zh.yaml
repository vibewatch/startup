            body: >-
              客户价值大概率来自两条相互咬合的动作：地域铺开和模块扩张。帮助采购拍板的因素——本地支持、合规信号、运营证明——也会随着时间推高账户扩张。但在机构投资者最关心的位置，公开透明度很薄。公司没有披露头部客户集中度，没有按
              cohort 拆收入，也无法把重型企业部署和更轻的交易型账户区分开。因此，外部观察者能验证客户覆盖广度，却看不清集中度风险。最合理的判断是，Infobip
