callouts:
  - calloutType: strength
    title: "Infobip Holds 11-16% Global CPaaS Market Share"
    body: >-
      With $2.3B ARR, Infobip ranks as the #3 global CPaaS provider by revenue, behind
      only Twilio and Sinch. This scale provides pricing leverage with carriers, supports
      R&D investment, and creates network effects through carrier integrations.
    claimRefs:
      - CM010
      - CM019
      - CM021

  - calloutType: strength
    title: "Diversified Geographic Presence Outside North America"
    body: >-
      While Twilio dominates US developer market, Infobip's strength in Europe, MENA,
      APAC, and Latin America provides growth optionality and reduces dependence on
      any single market. Direct carrier relationships in 190+ countries create moat.
    claimRefs:
      - CM022
      - CM023

  - calloutType: risk
    title: "SMS Margin Compression Threatens Core Revenue"
    body: >-
      SMS remains Infobip's largest channel but faces structural margin pressure as
      carriers demand higher termination fees and OTT alternatives (WhatsApp, RCS)
      commoditize messaging. This requires successful channel diversification.
    claimRefs:
      - CM017
      - CM018

  - calloutType: risk
    title: "Market Sizing Uncertainty Creates Valuation Risk"
    body: >-
      Analyst estimates for CPaaS TAM vary by 100% (from $14.9B to $30.2B in 2025),
      creating valuation uncertainty. Bulls use Grand View's $86B 2030 TAM; bears
      cite Metrigy's 2.7% CAGR suggesting market maturation.
    claimRefs:
      - CM004
      - CM005
      - CM008

