  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: Current private valuation
    missingEvidence: Most recent priced equity valuation, share count, and fully diluted capitalization table.
    whyItMatters: Point-estimate valuation cannot be high-confidence without actual round terms.
    diligencePath: Request cap table and most recent financing documents.
    relatedQuestionRefs:
    - QV023
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: blocking
    topic: Preference stack and dilution
    missingEvidence: Preferred terms, liquidation preferences, option pool size, and secondary overhang.
    whyItMatters: Private entry economics depend on more than enterprise value.
    diligencePath: Review legal financing documents and board approvals.
    relatedQuestionRefs:
    - QV024
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: Exit timing visibility
    missingEvidence: Management timeline and readiness assessment for IPO or strategic liquidity.
    whyItMatters: Exit path changes required holding period and return underwriting.
    diligencePath: Ask management for IPO-readiness workstreams and banker feedback.
    relatedQuestionRefs:
    - QV025
  - type: private-evidence-only
    severity: material
    topic: Core valuation confidence gap
    missingEvidence: Audited financials, debt headroom, customer concentration, and software gross-margin mix.
    whyItMatters: These are the missing variables that move recommendation from medium to high confidence.
    diligencePath: Run full finance, legal, and customer diligence before setting final price.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV006
