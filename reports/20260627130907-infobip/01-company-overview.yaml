callouts:
  - id: XO001
    calloutType: strength
    title: "Croatia's First Tech Unicorn"
    body: >-
      Infobip's 2020 unicorn valuation made it Croatia's first and only
      technology company to achieve this milestone, representing a landmark
      achievement for the Croatian and broader Central European tech ecosystem.
    claimRefs:
      - CO002

  - id: XO002
    calloutType: strength
    title: "Direct Carrier Integration Model"
    body: >-
      Infobip's strategy of building direct carrier connections in 100+ countries
      rather than relying on aggregators provides structural advantages in
      delivery reliability, pricing, and customer service responsiveness.
    claimRefs:
      - CO019

  - id: XO003
    calloutType: insight
    title: "January 2026 Leadership Transition"
    body: >-
      The appointment of external executives Ivan Burazin (Managing Director)
      and Mate Rimac (Chairman) signals professionalization of governance and
      possible preparation for future capital events or IPO.
    claimRefs:
      - CO007
      - CO008

  - id: XO004
    calloutType: risk
    title: "Co-Founder Departure"
    body: >-
      Roberto Kutić's departure in 2025 after 19 years reduces founder
      representation in leadership, though Silvio Kutić and Izabel Jelenić
      remain as CEO and CTO respectively.
    claimRefs:
      - CO009

