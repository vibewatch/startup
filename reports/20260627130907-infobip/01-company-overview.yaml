company:
  name: "Infobip"

chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Infobip is a Croatian-founded CPaaS company established in 2006 that became
    Croatia's first tech unicorn in 2020. The company provides omnichannel cloud
    communications infrastructure serving 70,000+ enterprises globally with $2.3B+ ARR.

sections:
  - id: corporate-identity
    title: "Corporate Identity & Founding History"
    body: >-
      Infobip d.o.o. was founded on April 13, 2006, in Vodnjan, Croatia, by three
      Croatian entrepreneurs: Silvio Kutić (CEO), Roberto Kutić, and Izabel Jelenić
      (CTO). The company began as a small SMS messaging startup focused on providing
      mobile communication services and has grown into a global leader in cloud
      communications infrastructure. The founding team identified early opportunities
      in enterprise messaging services, building direct relationships with mobile
      network operators across Europe before expanding globally. Infobip became
      Croatia's first and only technology unicorn in 2020 when One Equity Partners
      invested $200 million at a valuation exceeding $1 billion. The company remains
      privately held with headquarters in Vodnjan, Croatia, maintaining major operational
      offices in London, New York, Singapore, Mumbai, and Kuala Lumpur. As of 2025,
      Infobip operates 75+ offices across 6 continents and employs approximately 4,000
      people globally, representing significant growth from fewer than 100 employees
      a decade earlier. The company's legal structure is a Croatian limited liability
      company (društvo s ograničenom odgovornošću or d.o.o.), with registered headquarters
      in Vodnjan near Pula in the Istria region of Croatia.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
    tableRefs:
      - TO001
      - TO004
    figureRefs:
      - FO001

  - id: leadership-governance
    title: "Leadership & Governance"
    body: >-
      Silvio Kutić has served as Chief Executive Officer since founding the company
      in 2006, providing consistent leadership through two decades of growth and
      strategic expansion. His long tenure as CEO has enabled sustained strategic
      direction and deep industry relationships with telecommunications carriers
      worldwide. In January 2026, the company announced significant leadership changes
      designed to strengthen governance and operational capabilities. Ivan Burazin,
      known for founding Croatian tech company Codeanywhere, was appointed as Managing
      Director to oversee day-to-day operations. More notably, Mate Rimac—founder and
      CEO of electric supercar manufacturer Rimac Automobili—was appointed Chairman
      of the Supervisory Board, bringing entrepreneurial experience and international
      profile to the oversight function. Izabel Jelenić continues as Chief Technology
      Officer, maintaining technical leadership since the company's founding. Roberto
      Kutić, co-founder, departed the company in 2025 after nearly two decades. The
      supervisory board structure reflects European corporate governance standards
      typical of Croatian limited liability companies (d.o.o.), with separation between
      executive management and supervisory oversight. The company has expanded its
      executive team significantly over the past five years, adding C-level executives
      for marketing, revenue, product, and regional operations.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
    tableRefs:
      - TO002

  - id: funding-valuation
    title: "Funding History & Valuation"
    body: >-
      Infobip operated as a bootstrapped company for its first 14 years, achieving
      profitability and significant scale before taking external capital. In June 2020,
      the company raised $200 million in its first and only institutional equity round
      from One Equity Partners, a middle-market private equity firm. This investment
      valued Infobip at over $1 billion, making it Croatia's first technology unicorn.
      Following the equity round, Infobip secured a $500 million debt facility in 2021
      from Ares Management and BlackRock to fund acquisitions and expansion. In July 2025,
      the company refinanced this debt with a $520 million senior secured direct lending
      facility from BlackRock and Blue Owl Capital, extending maturities and improving
      terms. Total capital raised exceeds $1.2 billion across equity and debt. Current
      private market valuation estimates range from $5 billion to $10 billion based on
      revenue multiples applied to the company's $2.3 billion+ ARR. The company has not
      announced IPO plans as of June 2026, though Croatian media speculation has suggested
      potential listings on European or US exchanges. One Equity Partners remains the
      only known institutional equity investor, with founders and early employees holding
      the remaining equity stakes.
    claimRefs:
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
    tableRefs:
      - TO003
    figureRefs:
      - FO003

  - id: scale-operations
    title: "Global Operations & Scale"
    body: >-
      Infobip has built a truly global operational footprint with a direct presence
      spanning 200+ countries and territories. The company maintains 75+ offices
      worldwide, with significant concentrations in Europe (including London, Zagreb,
      Berlin, and Madrid), North America (New York, San Francisco), Asia-Pacific
      (Singapore, Mumbai, Jakarta, Kuala Lumpur), Middle East (Dubai), and Latin
      America (São Paulo, Mexico City). This extensive geographic presence enables
      the company to serve customers with localized support and maintain direct
      relationships with telecommunications carriers in each market. The company
      serves over 70,000 enterprise customers including major global brands across
      banking, telecommunications, retail, logistics, and technology sectors.
      Infobip maintains direct carrier connections in 100+ countries, a key
      differentiator from competitors who rely on aggregators or wholesale
      arrangements. This direct integration model provides higher delivery
      reliability, faster message throughput, and better cost economics. The
      company has achieved significant scale in workforce, growing to approximately
      4,000 employees globally as of 2025, with engineering centers in Croatia,
      Serbia, Poland, and India. Key operational metrics include processing billions
      of messages annually across SMS, WhatsApp, RCS, and other channels.
    claimRefs:
      - CO017
      - CO018
      - CO019
      - CO020
      - CO021
    figureRefs:
      - FO002

  - id: milestones
    title: "Key Milestones & Acquisitions"
    body: >-
      Infobip's growth trajectory includes several significant milestones and strategic
      acquisitions. The company reached €100 million in annual revenue by 2015, marking
      nearly a decade of organic growth. The 2020 One Equity Partners investment and
      unicorn status represented a transformational moment for both the company and
      the Croatian tech ecosystem. Infobip has pursued an active M&A strategy, completing
      at least three major acquisitions since 2020. In September 2020, Infobip acquired
      OpenMarket, a US-based enterprise messaging company, for approximately $300 million,
      significantly expanding its North American presence and enterprise customer base.
      In 2021, the company acquired Anam, an Irish messaging security specialist, to
      enhance platform capabilities around fraud prevention and message authentication.
      In 2022, Infobip completed the acquisition of Peerless Network, a US voice and
      messaging provider, for approximately $200 million, adding voice infrastructure
      and expanding carrier relationships. These acquisitions have contributed to
      revenue growth and geographic expansion, though integration challenges have been
      noted in industry reports. The company was recognized as a Leader in the Gartner
      Magic Quadrant for Communications Platform as a Service (CPaaS) in 2023, 2024, and
      2025, establishing it as a top-tier vendor in its category alongside Twilio, Vonage,
      and Sinch.
    claimRefs:
      - CO022
      - CO023
      - CO024
      - CO025
      - CO026
      - CO027
      - CO028

