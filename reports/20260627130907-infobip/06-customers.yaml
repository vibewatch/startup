callouts:
- calloutType: strength
  title: Commercial relevance is real
  body: The combination of global scale proxies, strong message throughput, and at least one credible flagship case study is enough to validate that Infobip is commercially real at enterprise scale.
  claimRefs:
  - CU004
  - CU008
  - CU010
- calloutType: strength
  title: Local support likely matters in wins
  body: Infobip’s office footprint and compliance-heavy positioning suggest it can compete where multinational deployment complexity matters as much as API ergonomics.
  claimRefs:
  - CU002
  - CU017
  - CU018
- calloutType: risk
  title: Retention remains a blind spot
  body: There is no disclosed NRR, GRR, churn, or renewal schedule, so outsiders cannot cleanly separate infrastructure stickiness from simple volume scale.
  claimRefs:
  - CU021
  - CU024
  - CU028
- calloutType: risk
  title: Logo quality exceeds outcome transparency
  body: Customer proof pages validate relevance, but they do not reveal much about contract depth, concentration, or long-term expansion economics.
  claimRefs:
  - CU013
  - CU022
  - CU035
