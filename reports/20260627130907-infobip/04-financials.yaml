callouts:
  - calloutType: strength
    title: "14 Years Bootstrapped to $2.3B ARR"
    body: >-
      Infobip's founders built the company from 2006-2020 without external capital, reaching
      unicorn status through profitable organic growth. This discipline indicates strong unit
      economics and cash generation—rare in CPaaS.
    claimRefs:
      - CI015
      - CI019

  - calloutType: strength
    title: "Banking-Grade Credit Profile"
    body: >-
      The $520M direct lending from BlackRock and Blue Owl implies institutional confidence
      in EBITDA sustainability and cash flow coverage. Direct lending typically requires
      demonstrable profitability metrics.
    claimRefs:
      - CI022
      - CI023

  - calloutType: risk
    title: "Limited Financial Transparency"
    body: >-
      As a private company, Infobip discloses minimal financial detail. Exact gross margin,
      EBITDA, net income, and retention metrics are not public, creating valuation uncertainty.
    claimRefs:
      - CI009
      - CI017

  - calloutType: risk
    title: "SMS Margin Pressure"
    body: >-
      Carrier fee increases and OTT cannibalization pressure gross margins on SMS, which
      represents the majority of revenue. Margin sustainability depends on SaaS expansion
      and premium channel growth.
    claimRefs:
      - CI006
      - CI010

