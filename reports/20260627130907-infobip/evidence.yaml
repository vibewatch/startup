evidenceGaps:
  - type: incomplete-enumeration
    severity: minor
    topic: leadership roster (TO002)
    missingEvidence: Complete executive team including VP and director-level executives who may be material to company operations.
    whyItMatters: Understanding full leadership depth helps assess bench strength and succession planning beyond C-suite executives.
    diligencePath: Request organizational chart from company or search LinkedIn for VP/Director-level Infobip executives.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap table
    missingEvidence: >-
      Detailed cap table showing equity ownership percentages for founders, One Equity Partners, and any employee option
      pools.
    whyItMatters: >-
      Understanding ownership structure is critical for assessing control, alignment of interests, and potential exit
      scenarios.
    diligencePath: >-
      Request cap table directly from company or search secondary market data providers for private company ownership
      estimates.
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: minor
    topic: valuation verification
    missingEvidence: >-
      Verified current private market valuation from recent transaction or 409A appraisal rather than revenue multiple
      estimates.
    whyItMatters: Current valuation affects investment entry point analysis and potential IPO pricing expectations.
    diligencePath: >-
      Review secondary market platforms (Forge, EquityZen) or request company-provided valuation data from recent
      financing.
  - type: missing-source
    severity: minor
    topic: co-founder departure
    missingEvidence: >-
      Official statement or detailed reporting on reasons for Roberto Kutić's departure in 2025 and any equity
      disposition terms.
    whyItMatters: Co-founder departures can signal internal conflicts or strategic disagreements that affect company trajectory.
    diligencePath: >-
      Search for company statements, interview coverage, or Croatian business press reporting on the departure
      circumstances.
    relatedQuestionRefs:
      - QO016
  - type: missing-source
    severity: minor
    topic: adverse events
    missingEvidence: >-
      Comprehensive search for lawsuits, regulatory actions, data breaches, or sanctions against Infobip or its
      executives.
    whyItMatters: >-
      Adverse events can indicate operational, legal, or reputational risks not captured in company-provided
      information.
    diligencePath: >-
      Search court records, regulatory databases, and news archives for Infobip-related litigation or enforcement
      actions.
    relatedQuestionRefs:
      - QO017
  - type: missing-source
    severity: minor
    topic: competitive benchmarking
    missingEvidence: >-
      Standardized comparison of Infobip employee count, revenue, and market share versus Twilio, Sinch, and
      MessageBird.
    whyItMatters: Competitive positioning affects market share potential and acquisition/partnership dynamics.
    diligencePath: Compile competitor data from public filings and analyst reports for side-by-side comparison table.
    relatedQuestionRefs:
      - QO019
  - type: stale
    severity: minor
    topic: board composition
    missingEvidence: >-
      Complete current supervisory board member list beyond Mate Rimac, including any One Equity Partners
      representatives.
    whyItMatters: Full board composition indicates governance oversight quality and investor representation.
    diligencePath: Review Croatian company registry filings or request board information from company investor relations.
    relatedQuestionRefs:
      - QO020
  - type: private-evidence-only
    severity: minor
    topic: secondary transactions
    missingEvidence: Records of any secondary market transactions for Infobip equity that would indicate current market pricing.
    whyItMatters: Secondary transactions provide real market valuation signals independent of company fundraising.
    diligencePath: Check secondary market platforms and broker networks for Infobip share transaction history.
    relatedQuestionRefs:
      - QO028
  - type: stale
    severity: minor
    topic: historical revenue
    missingEvidence: Year-by-year revenue figures from 2020-2024 to calculate precise compound annual growth rate.
    whyItMatters: Historical growth trajectory informs forward projections and valuation multiple justification.
    diligencePath: Search for annual report disclosures or media coverage of yearly revenue announcements.
    relatedQuestionRefs:
      - QO029
  - type: missing-source
    severity: minor
    topic: messaging volume
    missingEvidence: Specific annual messaging volume metrics (billions of messages) across SMS, WhatsApp, and other channels.
    whyItMatters: Volume metrics indicate platform scale and pricing leverage with carriers.
    diligencePath: Search company presentations, earnings materials, or industry reports for messaging volume disclosures.
    relatedQuestionRefs:
      - QO030
  - type: third-party-only
    severity: material
    topic: Market sizing methodology
    missingEvidence: Detailed breakdown of what each analyst firm includes/excludes in CPaaS TAM calculations
    whyItMatters: 100% variance in estimates ($14.9B to $30.2B) affects market share and valuation calculations
    diligencePath: Purchase full analyst reports from Gartner, IDC, Grand View for methodology sections
    relatedQuestionRefs:
      - QM002
  - type: unknown-context
    severity: immaterial
    topic: RCS pricing impact
    missingEvidence: Comparative pricing data for RCS vs SMS messaging across carriers
    whyItMatters: RCS margin profile unclear as channel scales
    diligencePath: Interview CPaaS providers on RCS economics; check carrier rate cards
    relatedQuestionRefs:
      - QM011
  - type: private-evidence-only
    severity: material
    topic: Infobip margin profile
    missingEvidence: Infobip gross margin, EBITDA margin, and margin trends not publicly disclosed
    whyItMatters: Profitability profile affects valuation multiple and competitive positioning
    diligencePath: Request audited financials from company; check UK Companies House filings
    relatedQuestionRefs:
      - QM018
  - type: private-evidence-only
    severity: material
    topic: Competitor profitability details
    missingEvidence: Exact EBITDA margins and profitability metrics for private CPaaS competitors (Bird, Plivo, Infobip)
    whyItMatters: Profitability profile affects competitive positioning and pricing sustainability
    diligencePath: Request audited financials; review UK/EU company filings; interview former employees
    relatedQuestionRefs:
