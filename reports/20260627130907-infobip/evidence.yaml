  - type: unknown-context
    severity: immaterial
    topic: Direct carrier deal terms
    missingEvidence: Specific terms of Infobip's 800+ carrier relationships vs competitors
    whyItMatters: Carrier relationship quality affects delivery rates and pricing leverage
