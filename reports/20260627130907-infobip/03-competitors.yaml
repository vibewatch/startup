callouts:
  - calloutType: strength
    title: "800+ Direct Carrier Relationships Create Delivery Moat"
    body: >-
      Infobip's network of 800+ direct operator relationships across 190+ countries provides
      delivery rate advantages, faster number provisioning, and pricing leverage that newer
      entrants cannot easily replicate. This infrastructure moat took 18 years to build.
    claimRefs:
      - CP018
      - CP019

  - calloutType: strength
    title: "Profitability Enables Pricing Flexibility"
    body: >-
      Unlike Twilio's cumulative $4B+ losses, Infobip's bootstrapped profitability allows
      aggressive pricing on competitive deals, sustained R&D investment, and M&A capacity
      without shareholder pressure for immediate returns.
    claimRefs:
      - CP008
      - CP023

  - calloutType: risk
    title: "Twilio Dominates US Developer Mindshare"
    body: >-
      Twilio's developer community, documentation quality, and SaaS integrations create
      significant lock-in in the US market. Infobip must overcome brand awareness gaps
      to win developer-led deals in North America.
    claimRefs:
      - CP006
      - CP020

  - calloutType: risk
    title: "OTT Platform Disintermediation Risk"
    body: >-
      Meta (WhatsApp Business direct), Google (RCS direct), and Apple could bypass CPaaS
      intermediaries by offering direct enterprise messaging APIs, threatening Infobip's
      value proposition on these high-growth channels.
    claimRefs:
      - CP021
      - CP022

