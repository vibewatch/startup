  rows:
  - - AMI
    - Company under review
    - Raised $1.03B; no public product metrics
    - Industrial, robotics, healthcare, automation, wearables
    - World models for sensor data, planning, safety guardrails
    - Pre-product in public sources; pricing and datasets undisclosed
  - - World Labs / Marble
    - Direct world-model peer
    - Official $1B new funding; prior $230M and Autodesk investment reported
    - Gaming, VFX, VR, design, robotics simulation adjacency
    - Generally available 3D world model with exports and editing
    - More creative/spatial-product oriented than AMI’s broad physical-control thesis
  - - Physical Intelligence
    - Direct robot-policy peer
    - CNBC $400M at $2.4B; 2026 talks for ~$1B at >$11B reported
    - Robot OEMs and general-purpose robot control
    - Iterating VLA / robot-policy stack and open-sourced π0
    - TechCrunch reports no commercialization timeline
  - - Skild AI
    - Direct robot-foundation peer
    - Official $300M Series A at $1.5B valuation
    - Industrial, household, hazardous, low-cost robots
    - General-purpose brain across manipulation, locomotion, navigation
    - Commercial deployment evidence less specific than funding/model claims
  - - Figure / Helix
    - Direct humanoid robot peer
    - Official >$1B Series C at $39B post-money
    - Humanoid homes and commercial operations
    - Embodied humanoid hardware plus Helix VLA claimed commercial-ready
    - Vertically integrated hardware path may not map to AMI licensing
  - - Covariant / RFM-1
    - Direct robot-foundation peer
    - Production warehouse customers and fleet data rather than recent funding in sources
    - Warehouse picking, kitting, depalletization, logistics
    - Commercial robot data and RFM-1 world-model reasoning for warehouses
    - Narrower logistics starting point than AMI’s cross-sector thesis
  - - Google DeepMind
    - Incumbent direct and research peer
    - Alphabet-scale resources; no standalone price disclosed
    - Research partners, robotics, embodied agents
    - Gemini Robotics private preview and Genie 2 world-model research
    - Access limited and product packaging undisclosed
  - - NVIDIA Cosmos
    - Enabling platform / likely entrant
    - Open platform with broad initial adopters
    - Robotics and AV developers
    - WFMs, tokenizers, guardrails, synthetic data, docs, compute stack
    - May enable rather than replace AMI, but commoditizes tooling
  - - Wayve
    - Embodied-AI European peer / vertical substitute
    - $1.05B Series C led by SoftBank
    - Automotive OEMs and fleet owners
    - Hardware-agnostic mapless embodied AI for driving
    - AV-focused rather than general industrial world models
  - - Tesla Optimus
    - Vertical substitute / internal-build signal
    - Q1 2026 deck shows Optimus lines and AI compute ramp
    - Tesla factories and future humanoid applications
    - Hardware, manufacturing, robot data, AI compute integration
    - Closed internal stack; not an immediate external model vendor
  notes: Profiles combine official and independent public evidence; undisclosed pricing, ARR, and private customer metrics
    are not inferred.
