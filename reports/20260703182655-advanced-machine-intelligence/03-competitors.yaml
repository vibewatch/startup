- id: TP005
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Scientific leadership and world-model thesis
    - Peers can hire similar talent and publish comparable robotics/world-model demos
    - High
    - Demand benchmark evidence and retention data for AMI research team
  - - $1.03B seed-scale capital
    - Capital is abundant across World Labs, Physical Intelligence, Figure, Wayve and infrastructure incumbents
    - High
    - Compare burn, compute allocation, and milestone-based financing discipline
  - - Strategic investor network
    - Investors do not equal customer distribution or data rights
    - Medium
    - Request signed commercial pilots, data-use rights, and co-development terms
  - - Nabla first-access partnership
    - Healthcare wedge is narrow and may not transfer to robotics or industrial automation
    - Medium
    - Verify deliverables, exclusivity, milestones, regulatory pathway, and paid economics
  - - World-model IP
    - Open Cosmos, LeRobot, and PI open weights can lower switching costs for internal build
    - High
    - Identify proprietary datasets, safety evals, or deployment tooling not replicable with open stack
  - - Physical-AI market pull
    - Humanoid and robot deployments remain early with autonomy, dexterity, battery and trust gates
    - High
    - Require stage-gated pilots in controlled environments before broad TAM credit
  - - Compute scale
    - GPU compute may commoditize and model-layer pricing power may erode
    - Medium
    - Underwrite gross margin only after seeing pricing, COGS, and differentiated outcomes
  - - European sovereignty positioning
    - World Labs, Wayve, DeepMind, and global incumbents also provide non-US or strategic alternatives
    - Medium
    - Test whether buyers select AMI for sovereignty, performance, or partner access
  notes: Risk register blends adverse analyst evidence with competitor-specific source proof; severities are ordinal diligence
    judgments.
