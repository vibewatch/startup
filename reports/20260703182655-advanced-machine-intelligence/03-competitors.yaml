  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: AMI list pricing, pilot pricing, API terms, enterprise licensing, and discount policy were not public.
    whyItMatters: Pricing determines whether AMI competes as a frontier lab, infrastructure vendor, or custom co-development
      partner.
    diligencePath: Request AMI customer proposals, term sheets, model-access tiers, and any Nabla commercial schedule.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: partner data rights
    missingEvidence: No public source disclosed whether AMI can train on Nabla, investor, industrial, robotics, or healthcare
      partner data.
    whyItMatters: Embodied data rights are the central moat against competitors with fleets, warehouses, vehicles, or open
      datasets.
    diligencePath: Review partnership agreements for data rights, retention, evaluation rights, and exclusivity boundaries.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
    - TP005
  - type: missing-source
    severity: material
    topic: benchmarks and safety proof
    missingEvidence: No public benchmark shows AMI beating World Labs, PI, Figure, Covariant, DeepMind, Cosmos, or internal-build
      baselines.
    whyItMatters: Without benchmark and safety proof, AMI’s differentiation is a thesis rather than an underwritable moat.
    diligencePath: Ask AMI for benchmark suite design, safety cases, pilot acceptance metrics, and third-party validation
      reports.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP005
  - type: conflicting-data
    severity: minor
    topic: competitor commercialization stage
    missingEvidence: Competitors use different readiness terms such as generally available, private preview, commercial-ready,
      and no commercialization timeline.
    whyItMatters: Comparability affects positioning scores and may overstate or understate AMI’s gap to peers.
    diligencePath: Normalize each competitor to a paid-customer, private-preview, pilot, open-source, or research-only taxonomy
      in management interviews.
    relatedQuestionRefs:
    - QP018
    - QP019
