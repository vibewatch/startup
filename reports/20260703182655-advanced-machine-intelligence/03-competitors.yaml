company:
  name: Advanced Machine Intelligence
chapter:
  number: 3
  title: Competitors
  summary: AMI faces direct pressure from world-model and robot-foundation peers that already show products, previews, deployments,
    or richer data loops. Its differentiation is credible as a thesis, but public evidence leaves pricing, partner data rights,
    benchmarks, and commercial readiness materially unproved.
sections:
- id: landscape-and-substitution-map
  title: Landscape and Substitution Map
  body: 'AMI competes in a crowded physical-AI stack rather than a single neatly bounded software category. The closest direct
    peers are world-model and spatial-intelligence labs such as World Labs and Google DeepMind Genie 2, plus robot-policy
    labs such as Physical Intelligence, Skild AI, Figure, and Covariant that are trying to turn multimodal perception into
    actions. Enabling platforms are just as important: NVIDIA Cosmos and Hugging Face LeRobot give developers model, dataset,
    simulation, and policy tooling that can reduce the need for a proprietary AMI layer. Vertical embodied-AI companies such
    as Wayve and Tesla are substitutes when buyers prefer full-stack autonomy or internal build over licensing a model vendor.
    The practical landscape is therefore direct competitors, enabling platforms, substitutes/internal build, status quo automation,
    and likely entrants with compute, data, or workflow control.'
  claimRefs:
  - CP001
  - CP002
  - CP041
  - CP045
  - CP047
  - CP048
  tableRefs:
  - TP001
  figureRefs:
  - FP003
- id: direct-peer-capability-comparison
  title: Direct Peer Capability Comparison
  body: The direct-peer comparison is unfavorable to AMI on public commercialization proof but favorable on ambition. AMI’s
    source-backed thesis is abstract world models for real sensor data and planning, yet it has not disclosed a shipped product,
    pricing page, benchmark, customer case study, or generally available API. World Labs has already shipped Marble as a paid
    and free 3D-world product; Physical Intelligence shows an iterating model line around π0 and later 2026 releases; Figure
    claims Helix is commercial-ready on embedded GPUs; Covariant has warehouse deployment data behind RFM-1; and Google DeepMind
    has private-preview Gemini Robotics plus research-grade Genie 2. The capability breadth is real across the sector, but
    unsupported matrix cells remain marked unknown because demos, previews, and investor claims do not prove production reliability
    for AMI.
