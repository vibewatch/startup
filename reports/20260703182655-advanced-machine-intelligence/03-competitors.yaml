  rows:
  - - AMI
    - Nabla first access; strategic investors include NVIDIA, Toyota, Samsung and others
    - No public partner data rights or benchmark dataset disclosed
    - Funding and leadership proof, but no product proof
    - Must convert investor/partner network into paid pilots and data access
  - - World Labs
    - Autodesk research/model collaboration and design-workflow surface
    - Generated 3D worlds and creative/design feedback loops
    - Generally available Marble product
    - AMI needs stronger industrial/robotic wedge to avoid being out-shipped
  - - Physical Intelligence
    - Backers include OpenAI/Bezos per CNBC; partner applications referenced on homepage
    - Cross-robot and dexterous task datasets
    - Model line active; no commercialization timeline reported
    - Technically close peer with higher robot-control specificity
  - - Figure
    - Humanoid hardware and BotQ manufacturing path
    - Human video and multimodal sensory data collection planned
    - Helix claimed commercial-ready and Series C to scale
    - Vertical data loop may compound faster than AMI research alone
  - - Covariant
    - Warehouse automation customers across countries and sectors
    - Tens of millions of trajectories from production robots
    - Commercial warehouse robots and RFM-1 demos
    - Production trajectory data is a moat AMI has not shown
  - - NVIDIA
    - Broad Cosmos initial adopters and compute/software ecosystem
    - Synthetic data, tokenizers, Omniverse, Blackwell/NGC/Hugging Face distribution
    - Open models and developer docs available
    - Could become default platform AMI must build on or compete against
