    - OEM/fleet path with SoftBank, NVIDIA, Microsoft support
    - Driving trials, fleet learning, simulation and validation platform
    - Funding aimed at production vehicle products
    - Strong European embodied-AI proof point outside generic AI
  - - Tesla
    - Internal factories, AI compute, vehicles, robot manufacturing
    - Proprietary vehicle/robot/factory data loops
    - Optimus production-line preparation in Q1 2026 deck
    - Internal build threat for large industrial buyers
