- id: commercialization-pricing-and-distribution
  title: Commercialization, Pricing, and Distribution
  body: 'Pricing is mostly undisclosed, so this chapter does not invent prices. Marble is the only reviewed direct world-model
    product with public subscription tiers. LeRobot is open tooling rather than a paid AMI-style vendor contract. AMI, Physical
    Intelligence, Skild AI, Figure Helix, Covariant RFM-1, Gemini Robotics, and most Cosmos enterprise terms are undisclosed
    or tied to partnership, preview, deployment, or platform access rather than public list pricing. Distribution differs
    more than pricing: World Labs has Autodesk as a strategic design-workflow channel, NVIDIA has a broad first-adopter ecosystem,
    Wayve has OEM and cloud relationships, Tesla has vertically integrated manufacturing, and AMI currently has a named healthcare
    first-access partner in Nabla but no comparable robotics or industrial channel disclosed.'
