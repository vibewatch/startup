- id: data-advantage-and-moat-durability
  title: Data Advantage and Moat Durability
  body: The most durable competitive advantages in physical AI are unlikely to be model architecture alone. They are access
    to embodied interaction data, simulation loops, customer workflows, evaluation infrastructure, and trusted deployment
    channels. Covariant’s warehouse fleet and trajectory claims, Figure’s humanoid data collection, Physical Intelligence’s
    cross-embodiment training, Wayve’s road trials and OEM pathway, Tesla’s AI compute and Optimus production preparation,
    NVIDIA’s platform control, and LeRobot’s open dataset/tooling ecosystem all pressure AMI. AMI’s capital, talent, and strategic
    backers are valuable, but the moat is not yet source-proved until the company shows proprietary partner data rights, safety
    benchmarks, paid pilots, or integration surfaces that buyers cannot replicate through internal build and open/enabling
    platforms.
  claimRefs:
  - CP008
  - CP026
  - CP029
  - CP030
