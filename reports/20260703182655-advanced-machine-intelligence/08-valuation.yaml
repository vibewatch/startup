    title: Recommendation summary table
    columns:
      - Decision item
      - Chapter stance
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Track / research-more; do not underwrite a buy at the reported seed price on public evidence alone
        - Founder and investor quality is strong, but product revenue, pricing, and customer proof are undisclosed
        - Proceed only to diligence or protected insider terms, not an unprotected markup
      - - Confidence
        - Medium-low
        - Financing facts and partner claims are public; economic and contractual facts are private
        - Recommendation can move quickly if AMI discloses product traction or terms
      - - Risk rating
        - High
        - Pre-product, compute-heavy, regulated, partner-concentrated, and competitively crowded
        - Require explicit kill criteria before allocating capital
      - - Valuation stance
        - Expensive / stretched
        - About $4.5B implied post-money before disclosed revenue or SKU
        - Price needs milestone protection or a lower effective entry
      - - Entry discipline
        - Milestone-based tranche or wait
        - Cap-table terms, preferences, and pro-rata rights are not public
        - Ask for terms before any price judgment becomes actionable
      - - Exit posture
        - Not exit-ready
        - IPO/M&A logic requires commercial proof not yet available
        - Frame as long-duration research optionality, not near-term liquidity
    notes: Stances are qualitative investment judgments derived from public evidence; no target price or return is asserted.
