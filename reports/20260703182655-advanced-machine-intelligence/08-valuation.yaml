      - FV003
  - id: comparables-and-market-context
    title: Comparables and Market Context
    body: >-
      The comparable set supports two simultaneous conclusions. First, frontier AI, embodied AI, and world-model
      companies can command multi-billion-dollar valuations well before mature profits: World Labs, Mistral, Physical
      Intelligence, Figure, Wayve, and Skild all show large capital appetite around adjacent themes. Second, AMI is less
      commercially evidenced than several of those references. Mistral has a strategic industrial investor and deployed
      model business; World Labs has Marble; Physical Intelligence and Figure show robotics demonstrations or product
      narratives; CoreWeave and NVIDIA are public-market or filing references with infrastructure economics. AMI’s
      valuation is therefore not absurd in an overheated frontier-AI market, but it is stretched relative to
      AMI-specific public proof.
    claimRefs:
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV022
      - CV023
