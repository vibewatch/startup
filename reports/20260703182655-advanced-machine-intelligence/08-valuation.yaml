  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Unprotected markup
        - Next financing priced above current implied post-money with no disclosed SKU, revenue, or named customer
        - Turns quality story into valuation risk
        - Do not participate without reset or protection
      - - No product proof
        - No AMI-specific benchmark, demo, API, pilot, or product spec before next financing window
        - World-model thesis remains unconverted research
        - Downgrade from track to avoid
      - - Nabla economics absent
        - No contract economics, data rights, regulatory owner, or usage metrics for first-access relationship
        - Partner proof stays marketing rather than commercialization
        - Require customer diligence before investing
      - - Compute plan opaque
        - No budget, supply agreement, model-efficiency path, or burn sensitivity
        - Runway and dilution risk cannot be underwritten
        - Condition any investment on operating plan
      - - Regulatory blocker
        - Healthcare use cases cannot map to FDA/EU obligations or safety validation
        - Limits most valuable early wedge
        - Shift to non-healthcare use-case proof or pause
      - - Platform commoditization
        - NVIDIA, DeepMind, or open platforms match world-model capabilities faster than AMI builds data moat
        - Compresses pricing power and exit optionality
        - Require proprietary data or vertical distribution proof
      - - Governance gap
        - Terms omit information rights, milestone reporting, or investor protections despite high valuation
        - Investor cannot monitor thesis breaks
        - Reject or renegotiate terms
    notes: Kill triggers are diligence thresholds; none assumes a public target price or guaranteed return.
    claimRefs:
