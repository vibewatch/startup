  - id: thesis-and-anti-thesis
    title: Investment Thesis and Anti-thesis
    body: >-
      The investable thesis is that world models become a new physical-AI frontier stack and AMI wins enough talent,
      compute, partner data, and safety credibility to define that layer. That view is not fanciful: AMI has strategic
      backers, World Labs and Physical Intelligence show investor appetite for adjacent world-model and
      robot-foundation-model bets, and NVIDIA and DeepMind have validated physical AI as a major technical direction.
      The anti-thesis is equally important. The same attention can turn world models into a fundraising label before
      buyers see durable product value. AMI’s first named partner, Nabla, is useful validation, but public evidence does
      not yet disclose contract economics, data rights, FDA pathway ownership, or customer conversion. The thesis is
      therefore credible but not yet underwritable at the reported price, especially while outside coverage frames the
      round as a premium on elite researchers before revenue.
    claimRefs:
      - CV007
      - CV010
      - CV011
      - CV012
      - CV013
      - CV020
      - CV021
      - CV034
      - CV042
      - CV045
      - CV050
      - CV051
    tableRefs:
      - TV002
    figureRefs:
      - FV004
  - id: scenario-and-entry-discipline
    title: Scenarios and Entry Discipline
    body: >-
      Because public evidence lacks AMI financials, scenario analysis should avoid invented exit values or target
      returns. The useful exercise is price defensibility under milestones. In the bull case, AMI publishes product
      benchmarks, Nabla produces regulated workflow proof, and partner data or compute creates a scarce platform that
      could make the current price reasonable. In the base case, AMI remains a high-quality lab whose valuation should
      be held flat until product and customer evidence arrive. In the bear case, compute cost, regulatory friction,
      valuation-cycle compression, or open/corporate platforms outpace AMI’s proof and force a flat or down round. Entry
      discipline should therefore be structural: tranches, pro-rata rights, governance reporting, and a lower effective
      entry are more defensible than an unprotected markup.
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV027
      - CV035
      - CV036
      - CV037
      - CV040
      - CV041
      - CV044
