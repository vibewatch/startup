  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence supporting it
      - What would change the view
      - Current weight
    rows:
      - - "Thesis: world models become a new frontier stack"
        - AMI, World Labs, NVIDIA, DeepMind, and robotics peers all point to physical-AI/world-model momentum
        - AMI releases AMI-specific benchmarks, product architecture, and partner deployments
        - Positive but unproven
      - - "Thesis: founder and investor quality can win talent/compute"
        - Yann LeCun, Alexandre LeBrun, and strategic investors create strong signaling
        - Confirmed senior hires, compute supply, and data partnerships
        - Positive
      - - "Thesis: healthcare partner gives a credible wedge"
        - Nabla first-access relationship creates a live domain for safety-critical learning
        - Signed economics, data-rights scope, and FDA-aligned validation plan
        - Positive but concentrated
      - - "Thesis: market can support a very large winner"
        - Embodied AI forecasts and peer financing show large capital appetite
        - Evidence that AMI captures software economics rather than only research prestige
        - Conditional
      - - "Anti-thesis: valuation precedes product proof"
        - Reported ~$4.5B post-money arrives before disclosed ARR, SKU, pricing, or customers
        - Public pilot results, revenue contract, or protected pricing terms
        - High weight
      - - "Anti-thesis: compute burns capital before moat is visible"
        - Epoch and Sequoia frame frontier AI as capital intensive with uncertain revenue gap
        - Budget discipline, model-efficiency proof, and supplier commitments
        - High weight
      - - "Anti-thesis: category can become hype label"
        - TechCrunch quoted AMI leadership warning world models may become a fundraising buzzword
        - Independent benchmarks that separate AMI from generic world-model claims
        - Medium-high
      - - "Anti-thesis: corporate/open platforms commoditize the layer"
        - NVIDIA Cosmos and DeepMind robotics reduce the scarcity of world-model tooling
        - Proprietary data rights, vertical workflow integration, and customer switching costs
        - Medium-high
    notes: >-
      The table weighs evidence quality, not expected returns; each row requires follow-up diligence before capital
      allocation.
