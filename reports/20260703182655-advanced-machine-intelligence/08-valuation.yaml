company:
  name: Advanced Machine Intelligence
chapter:
  number: 8
  title: Valuation
  summary: >-
    AMI’s $1.03B seed at a reported $3.5B pre-money valuation is credible as a founder-led frontier-AI signal but
    expensive for a pre-product, pre-revenue physical-AI lab. The recommendation is to track or research more rather
    than buy at the current headline price unless diligence produces protected terms, product proof, Nabla economics,
    and compute visibility.
sections:
  - id: current-price-and-recommendation
    title: Current Price and Recommendation
    body: >-
      AMI should be treated as an exceptional research-company financing at an exceptional price, not as a conventional
      seed-stage software investment. The public record supports the round size, investor quality, and $3.5 billion
      pre-money valuation, but it does not support revenue multiple math because AMI has not disclosed revenue, ARR,
      pricing, gross margin, or paying customers. That gap matters more than normal because the implied post-money price
      is already roughly $4.5 billion while commercialization may take years. The resulting stance is track or
      research-more: continue diligence, preserve optionality if terms are protected, but do not underwrite a buy at the
      current headline price using public evidence alone. The practical IC question is therefore not whether AMI is
      impressive, but whether private terms and milestones compensate for buying so early.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV006
      - CV008
      - CV033
      - CV038
      - CV039
      - CV047
