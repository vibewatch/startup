  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Financing / valuation signal
      - Relevance to AMI
      - Limitation
    rows:
      - - AMI
        - Seed round of $1.03B at $3.5B pre-money, implying roughly $4.5B post-money
        - Direct entry price for this valuation chapter
        - No public revenue, preferences, product, or customer economics
      - - World Labs
        - $1B 2026 funding; prior $230M at $1B; reported discussions around ~$5B and Marble product evidence
        - Closest world-model/spatial-AI private peer
        - >-
          Valuation report is less definitive than official funding; product is creative/3D, not AMI
          healthcare/industrial
      - - Physical Intelligence
        - $400M at $2.4B post in 2024; reported 2026 talks above $11B
        - Robot-foundation-model peer shows physical-AI premium when robotics demos exist
        - Later valuation is reported; business model and revenue remain private
      - - Mistral AI
        - €1.7B Series C at €11.7B post; ASML invested €1.3B for about 11% fully diluted
        - European frontier-AI lab with strategic industrial investor
        - Mistral has model/product distribution beyond AMI’s public state
      - - Figure AI
        - More than $1B committed Series C at $39B post-money
        - Shows extreme premium for embodied-AI/humanoid narratives
        - Humanoid hardware/manufacturing traction is not AMI’s current proof set
      - - Wayve
        - $1.05B Series C led by SoftBank for embodied AI automated driving
        - Demonstrates strategic capital for physical-world AI deployment
        - Automotive AV productization differs from AMI’s research-stage world models
      - - Skild AI
        - $300M Series A at $1.5B valuation
        - Robotics foundation-model early-stage valuation benchmark
        - Smaller round and more direct robotics positioning
      - - CoreWeave
        - S-1/A IPO range of $47-$55 per share for AI cloud infrastructure
        - Public-market route for AI infrastructure demand and compute scarcity
        - Revenue-bearing cloud infrastructure is not comparable to AMI pre-revenue research
      - - NVIDIA
        - Fiscal 2025 filing disclosed about $2.7T non-affiliate market value
        - Shows public market value captured by AI infrastructure suppliers
        - Supplier economics can benefit from startup spend even when model-lab returns lag
      - - AI mega-round market
        - SiliconAngle/PitchBook reported $267.2B Q1 2026 U.S. venture deal value with five deals at 73%
        - Sets macro context for AI capital concentration and xAI-scale funding appetite
        - Mega-rounds can inflate comps and are not proof of AMI-specific value
    notes: >-
      Enumeration is a sample of relevant frontier-AI, physical-AI, and infrastructure references reviewed for price
      context; it is not an exhaustive private-market comp set.
