  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance and cap table
    missingEvidence: Full cap table, investor ownership percentages, board seats, observer rights, voting controls, liquidation
      preferences, and any strategic commercial side letters.
    whyItMatters: The seed syndicate is large and strategic; control rights may determine strategic flexibility, future financing
      terms, and acquisition optionality.
    diligencePath: Request financing documents, board consents, investor-rights agreements, and management’s post-money capitalization
      model.
    relatedQuestionRefs:
    - QO010
    relatedTableRefs:
    - TO002
    - TO003
  - type: missing-source
    severity: material
    topic: cover metrics
    missingEvidence: Audited or management-certified revenue, ARR, burn, runway, customer count, signed contract value, and
      current employee count.
    whyItMatters: The company has a late-stage valuation but no public operating metrics, making valuation and runway analysis
      dependent on private materials.
    diligencePath: Ask AMI for board-approved KPI pack, budget, hiring plan, compute commitments, and partner/customer pipeline
      conversion by quarter.
    relatedQuestionRefs:
    - QO012
    - QO018
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: Nabla partnership terms
    missingEvidence: Executed AMI-Nabla agreements, data-use rights, pricing or cost-sharing, exclusivity terms, regulatory
      responsibilities, and milestone obligations.
    whyItMatters: Nabla is the first named partner and the clearest healthcare wedge, but public sources do not yet prove
      revenue, exclusivity value, or regulatory readiness.
    diligencePath: Review the partnership contract, data-processing addenda, pilot plan, validation protocol, and any FDA
      or clinical-safety counsel memos.
    relatedQuestionRefs:
    - QO013
    - QO025
    relatedTableRefs:
    - TO004
  - type: missing-source
    severity: material
    topic: technical validation
    missingEvidence: AMI-authored benchmark results, reproducible papers, open-source releases, safety evaluations, and partner
      pilot evidence for world models.
    whyItMatters: The investment thesis depends on world models outperforming LLM-centric systems in noisy, continuous, safety-critical
      workflows.
    diligencePath: Track AMI publications, code releases, third-party evaluations, and Nabla/industrial pilot readouts over
      the next two refresh cycles.
