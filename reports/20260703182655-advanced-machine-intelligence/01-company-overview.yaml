  - FO001
- id: milestones-adverse-checks-and-open-gaps
  title: Milestones, Adverse Checks, and Open Gaps
  body: 'The milestone record shows a compressed creation arc: legal setup in December 2025, Nabla’s partnership and LeBrun
    transition announcement in December, public profiling in January, establishment transfer to the current Paris address
    in February, and the $1.03B round in March 2026. No French-registry sanctions, litigation, or collective proceedings surfaced
    on Pappers, but the public operating record is still too short for that clean registry snapshot to carry much predictive
    weight. The more material adverse evidence is strategic rather than legal: Le Monde Informatique said AMI had no operational
    systems yet, Forbes highlighted the cost and regulatory burden of video/sensor world models, and broader AI-market commentary
    warns that early-stage valuations can detach from revenue. This does not negate AMI’s upside; it defines the next diligence
    path. The company must convert capital and talent into published research, partner pilots, safety evidence, and eventually
    a commercial model.'
