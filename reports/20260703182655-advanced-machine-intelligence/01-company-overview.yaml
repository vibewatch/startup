company:
  name: Advanced Machine Intelligence
chapter:
  number: 1
  title: Company Overview
  summary: Advanced Machine Intelligence is a newly formed Paris-based frontier AI lab pursuing world models for safety-critical
    real-world workflows. Public evidence strongly supports its identity, leadership bench, $1.03B seed round, strategic investors,
    and Nabla partnership, but the company remains pre-product and pre-revenue in public sources, making operating readiness
    and valuation the central diligence risks.
sections:
- id: identity-stage-and-product
  title: Identity, Stage, and Product Thesis
  body: 'AMI is best treated as a newly formed French frontier-AI lab rather than an operating software vendor with mature
    commercial metrics. The legal anchor is ADVANCED MACHINE INTELLIGENCE, a Paris SASU with SIREN 994675254, RCS Paris registration
    on 2025-12-15, and a current headquarters at 10 rue de Penthièvre, 75008 Paris. The public company surface is amilabs.xyz,
    whose mission statement says AMI is building world models that learn abstract representations of real-world sensor data
    and plan under safety guardrails. That identity aligns with the funding announcement: AMI is not selling a packaged product
    yet, but is using an unusually large seed round to pursue long-horizon research, compute, and talent. The core diligence
    framing is therefore stage mismatch. The capitalization is late-stage in size, while the company is still pre-product,
    pre-revenue, and dependent on converting a contrarian technical architecture into applications where reliability matters.'
  claimRefs:
