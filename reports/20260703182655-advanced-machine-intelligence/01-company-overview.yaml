- id: leadership-governance-and-key-person-risk
  title: Leadership, Governance, and Key-Person Risk
  body: 'The leadership bench is unusually credible for a company this young, but the public evidence also concentrates the
    story around a small number of individuals. AMI says Yann LeCun chairs the company, Alexandre LeBrun is CEO, Laurent Solly
    is COO, Saining Xie is chief science officer, Pascale Fung is chief research and innovation officer, and Michael Rabbat
    leads world models. That mix combines LeCun’s JEPA/world-model thesis, LeBrun’s prior company-building through Wit.ai
    and Nabla, and multiple Meta/FAIR-linked research and operating profiles. Governance certainty is thinner than talent
    certainty: sources vary between executive and non-executive chairman wording for LeCun, and no public board, voting-control,
    or investor-rights schedule has surfaced. Later chapters should therefore use this chapter’s role table as a named-leader
    map, not as proof of full governance depth. The highest diligence priority is whether the company can institutionalize
    decision-making beyond LeCun’s scientific authority and LeBrun’s operator role.'
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
  - CO039
  - CO040
  tableRefs:
  - TO002
- id: capitalization-investors-and-strategic-option-value
  title: Capitalization, Investors, and Strategic Option Value
  body: 'AMI’s $1.03B seed is the fact that makes the company investable and risky at the same time. Company, investor, and
    independent sources converge on about €890M/$1.03B raised at a $3.5B pre-money valuation, implying roughly $4.5B post-money
    before fees or any undisclosed structure. The round was co-led by Cathay Innovation, Greycroft, Hiro Capital, HV Capital,
    and Bezos Expeditions, while strategic and long-term backers include NVIDIA, Samsung, Temasek, Toyota Ventures, Sea, SBVA,
    and Alpha Intelligence Capital. That syndicate is more than capital: hardware, industrial, Asia, and healthcare adjacencies
    may become deployment paths if AMI proves the science. The adverse reading is that valuation now prices in a multi-year
    research breakthrough before AMI has revenue, audited accounts, or disclosed customers beyond Nabla. Sequoia’s AI-capex
    critique and Reuters-sourced comments on frothy AI valuations are not AMI-specific failures, but they are relevant guardrails
    for underwriting a billion-dollar seed round.'
  claimRefs:
  - CO016
  - CO017
  - CO018
  - CO019
  - CO020
  - CO021
