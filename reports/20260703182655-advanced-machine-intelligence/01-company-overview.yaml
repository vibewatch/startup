callouts:
- calloutType: strength
  title: A billion-dollar seed buys time for a non-consensus architecture
  body: AMI’s strongest asset is the combination of LeCun-led scientific credibility, LeBrun’s operator bridge, and enough
    capital to fund compute-heavy research without forcing a near-term product narrative. That is rare in European AI and
    explains why strategic backers joined before traction was visible.
  claimRefs:
  - CO010
  - CO012
  - CO016
  - CO018
  - CO019
  - CO021
- calloutType: risk
  title: Valuation is ahead of commercialization evidence
  body: The chapter’s adverse evidence is not a lawsuit or sanction; it is the mismatch between a roughly $4.5B implied post-money
    valuation and public evidence showing no product revenue, no operational systems, and no disclosed formal Nabla licensing
    economics.
  claimRefs:
  - CO017
  - CO022
  - CO023
  - CO025
  - CO032
  - CO034
- calloutType: insight
  title: Nabla validates the use-case direction but not yet the revenue model
  body: Nabla gives AMI a real safety-critical workflow to test against, especially in clinical documentation and agentic
    healthcare workflows, but retained evidence supports partner access rather than a signed commercial contract with pricing,
    minimums, or regulatory milestones.
  claimRefs:
  - CO024
  - CO025
  - CO026
  - CO027
