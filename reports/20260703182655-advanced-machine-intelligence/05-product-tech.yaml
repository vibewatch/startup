  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: product-release
    missingEvidence: AMI-specific product spec, API documentation, model card, release notes, pricing, support path,
      and customer-facing SLA.
    whyItMatters: Without a released surface, investors cannot underwrite adoption, implementation burden, gross
      margin, or competitive defensibility.
    diligencePath: Request management product roadmap, current demos, pilot contracts, API docs, model cards, and
      release criteria.
    relatedQuestionRefs:
    - QE002
    - QE022
    - QE023
    - QE030
  - type: private-evidence-only
    severity: material
    topic: partner-data-integration
    missingEvidence: Nabla and future partner data-rights schedules, event schemas, interfaces, deployment topology,
      audit logging, and acceptance tests.
    whyItMatters: World-model performance and compliance depend on workflow data and integration details that are
      currently private.
    diligencePath: Review executed partner agreements, DPIAs/DPAs, integration architecture, data maps, and pilot
      acceptance plans.
    relatedQuestionRefs:
    - QE004
    - QE014
    - QE027
  - type: missing-source
    severity: blocking
    topic: regulatory-validation
    missingEvidence: FDA strategy, device-function scope, validation protocol, PCCP or update-control plan, and
      evidence of clearance or certification.
    whyItMatters: Nabla’s FDA-certifiable language cannot be monetized as autonomous healthcare AI without a credible
      regulatory and clinical validation path.
    diligencePath: Obtain regulatory counsel memo, Q-submission history if any, clinical validation package, and
      human-oversight design.
    relatedQuestionRefs:
    - QE005
    - QE017
    - QE018
  - type: missing-source
    severity: material
    topic: trust-security-reliability
    missingEvidence: Security certifications, privacy architecture, uptime/incident history, red-team reports, model
      monitoring, and support SLAs.
    whyItMatters: Safety-critical customers will require operational trust evidence before placing AMI in a workflow
      that can affect patients, factories, or robots.
    diligencePath: Request SOC/ISO roadmap, security design review, incident process, reliability dashboards, and
      post-deployment monitoring plan.
    relatedQuestionRefs:
    - QE015
    - QE016
    - QE019
  - type: missing-source
    severity: material
    topic: deployment-benchmarks
    missingEvidence: AMI-specific benchmarks, pilot results, hardware/environment coverage, failure cases, and quantified
      reliability or success-rate metrics.
    whyItMatters: External V-JEPA and robotics evidence proves plausibility, not AMI product readiness or customer
      ROI.
    diligencePath: Run controlled technical diligence on AMI demos, partner pilots, ablations, red-team tests, and
      baseline comparisons.
    relatedQuestionRefs:
    - QE024
    - QE025
    - QE029
  - type: stale
    severity: minor
    topic: open-research-roadmap
    missingEvidence: AMI publication calendar, open-source scope, licensing choices, contributor model, and enterprise-support
      separation.
    whyItMatters: Open research can accelerate recruiting and adoption but may also weaken IP moat if commercial
      packaging is not distinct.
    diligencePath: Ask for planned papers, repositories, license strategy, governance process, and proprietary-vs-open
      boundary memo.
    relatedQuestionRefs:
    - QE011
    - QE020
    - QE021
