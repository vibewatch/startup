- id: TE004
  title: Trust / Quality / Compliance Table
  columns:
  - Control / certification area
  - Public status
  - Scope
  - Gap / diligence ask
  rows:
  - - FDA-certifiable healthcare AI
    - Roadmap language from Nabla, not clearance evidence
    - Potential clinical agentic AI functions
    - Obtain regulatory strategy, device scope, validation, and FDA correspondence.
  - - Predetermined Change Control Plan
    - External FDA guidance exists
    - AI-enabled device modifications
    - Map AMI model updates to planned modifications, methodology, and impact assessment.
  - - NIST AI risk management
    - External framework exists
    - Critical infrastructure and trustworthy AI practices
    - Produce risk register, controls, monitoring, and governance ownership.
  - - EU AI Act compliance
    - External regulation exists
    - High-risk AI, health, safety, and fundamental-rights protections
    - Classify use cases and document human oversight, data governance, and conformity path.
  - - Reliability / uptime / incident response
    - Not publicly disclosed by AMI
    - Product operations and support
    - Request SLA, status page, incident logs, and escalation model.
  - - Privacy and security controls
    - Not publicly disclosed by AMI
    - Clinical, industrial, wearable, and partner data
    - Request DPA, encryption, access control, audit logging, retention, and certifications.
  - - Human oversight and safety guardrails
    - Claimed principle; implementation not public
    - Autonomous planning before action
    - Require bounded autonomy, operator approval, validation gates, and rollback design.
