- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Real-world sensor and workflow data
    - Provide observations for representation learning and planning
    - Partner data rights, modality coverage, privacy approvals
    - No AMI data corpus, rights schedule, or modality list disclosed.
  - - Representation encoder
    - Convert noisy observations into semantic embeddings
    - Self-supervised learning and curated video/image/sensor data
    - Embedding quality may not transfer across healthcare, industrial, and robotics domains.
  - - JEPA predictor / energy model
    - Predict target representations and future states
    - H-JEPA / energy-based modeling research lineage
    - Architecture proof is literature-level until AMI releases implementation evidence.
  - - Action-conditioned planner
    - Evaluate candidate actions and choose safe next steps
    - Robot or process-action data, goals, model-predictive control loop
    - Planning may fail outside short horizons or controlled environments.
  - - Evaluation and benchmark harness
    - Measure physical reasoning, causality, and safety
    - Benchmarks, red teams, acceptance tests, human baselines
    - No AMI-specific benchmark or reliability metric is public.
  - - Partner application adapter
    - Embed model outputs into Nabla or industrial workflow
    - APIs, schemas, audit logs, support, security controls
    - No public API, deployment topology, or SLA.
  notes: Architecture table blends AMI claims with JEPA/V-JEPA research analogues; it does not assert a released
