- id: roadmap-open-posture-and-maturity
  title: Roadmap, Open-Source Posture, and Product Maturity
  body: 'The roadmap is long-horizon. AMI has raised seed-scale capital and says it will work with industry partners,
    product developers, academia, open publications, and open source. TechCrunch’s interview is the clearest commercial-timing
    guardrail: management framed AMI as fundamental research that could take years to become commercial applications.
    Nabla’s partnership supplies a credible healthcare wedge, but it remains first access rather than evidence of
    shipped AMI software. External evidence also tempers robotics assumptions: humanoid deployments face battery,
    manufacturing, safety, certification, and human-acceptance barriers, while Meta’s own V-JEPA 2 benchmarks still
    show gaps versus human physical reasoning. The maturity verdict is research-more: the thesis is technically
    coherent, but public proof is roadmap-level until AMI releases model artifacts, partner pilots, safety cases,
    and deployment metrics.'
  claimRefs:
  - CE009
