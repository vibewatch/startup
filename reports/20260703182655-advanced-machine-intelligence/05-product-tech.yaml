- id: module-map-and-architecture
  title: Module, Asset, and Architecture Map
  body: 'The module map should stay evidence-constrained. AMI has not announced product packages, so the asset map
    is a translation of public research claims into deployable layers: sensor ingestion, representation encoders,
    JEPA predictors, action-conditioned planning, evaluation/safety guardrails, and partner workflow adapters. LeCun’s
    architecture paper, the energy-based-model notes, I-JEPA, V-JEPA, and V-JEPA 2 support the technical lineage,
    but they are not AMI product benchmarks. Meta’s V-JEPA 2 is the most concrete public analogue because it connects
    video training, action-conditioned prediction, and model-predictive control for robot tasks. For AMI diligence,
    architecture proof requires showing which parts are proprietary, which are borrowed from open literature, which
    are open-sourced, and which are integrated into partner data systems.'
  claimRefs:
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
