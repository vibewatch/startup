chapter:
  number: 5
  title: Product & Technology
  summary: AMI’s current product evidence is a world-model research platform and partner-led roadmap, not a shipped
    SKU. The technical lineage around JEPA, energy-based models, V-JEPA, and V-JEPA 2 is credible, but AMI still
    needs public product specs, AMI-specific benchmarks, integration evidence, safety controls, privacy posture,
    and regulatory validation before safety-critical deployment can be underwritten.
sections:
- id: product-state-and-workflows
  title: Product State and Customer Workflows
  body: 'AMI’s product surface is best described as a research platform and partner-integration roadmap for world
    models, not a shipped SKU. The official site describes world models that predict in representation space and
    plan action sequences under safety guardrails, while the update page says AMI is building systems that understand
    the world, maintain persistent memory, reason, plan, and remain controllable and safe. That maps to customer
    workflows rather than a priceable product: a healthcare partner could use simulation and deterministic planning
    to extend clinical assistants; an industrial operator could feed sensor state into a model that predicts process
    consequences; a robotics team could use video-conditioned planning to choose safe actions; and safety-critical
    teams could require human-reviewed plans before execution. The key diligence boundary is strict: Nabla has first
    access, but public sources do not show a generally available AMI model, API, SLA, benchmark, or launch date.'
  claimRefs:
