- id: TE001
  title: Product Module / Asset Matrix
  columns:
  - Module / asset
  - Primary user
  - Public maturity
  - Differentiation claim
  - Diligence gap
  rows:
  - - World-model research platform
    - AMI researchers and strategic partners
    - Public thesis; no SKU
    - Representation-space prediction for real-world sensor data
    - Request internal roadmap, model cards, and release criteria.
  - - Sensor-data representation encoder
    - Robotics, industrial, wearable, healthcare teams
    - Research analogue visible in I-JEPA/V-JEPA literature
    - Non-generative semantic embeddings rather than pixel/token reconstruction
    - Show AMI-owned training data, modalities, and evaluation results.
  - - JEPA predictor / world model
    - Safety-critical workflow developers
    - Research lineage; AMI implementation undisclosed
    - Predicts abstract future states and consequences
    - Provide AMI benchmarks, failure modes, and model governance.
  - - Action-conditioned planner
    - Robotics and automation engineers
    - Meta V-JEPA 2 analogue; AMI product not disclosed
    - Model-predictive planning over candidate actions
    - Demonstrate AMI planner in partner environment with safety envelope.
  - - Safety and evaluation guardrails
    - Clinical, industrial, compliance owners
    - Claimed principle; controls not public
    - Constrain plans before execution in high-risk settings
    - Produce safety case, red-team results, monitoring, and incident process.
  - - Nabla healthcare adapter
    - Nabla product and clinical workflow teams
    - First-access partnership; no AMI SKU
    - Clinical workflow wedge with simulation/deterministic reasoning
    - Review data rights, product scope, validation plan, and economics.
  - - Open publications / code
    - Research community and developers
    - Intent stated; AMI-specific artifacts not yet found
    - Recruiting and ecosystem flywheel
    - Separate open research from enterprise support and proprietary moat.
  notes: Rows are module hypotheses constrained to public evidence; they are not announced AMI SKUs or released
    products.
