- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User job
  - Current workflow pain
  - AMI-relevant solution concept
  - Measurable benefit to prove
  - Current limitation
  rows:
  - - Healthcare clinician / operations team
    - LLM assistants help documentation but struggle with deterministic multimodal planning
    - World model simulates clinical workflow consequences before suggested action
    - Reduced cognitive load, fewer unsafe autonomous actions, validated task completion
    - Nabla first access only; no FDA-cleared AMI product shown.
  - - Industrial process-control operator
    - Rules and control loops may miss rare sensor-state combinations
    - Predict future process states and propose constrained action sequences
    - Lower downtime, fewer process excursions, safer interventions
    - No AMI industrial pilot, sensor interface, or reliability metric disclosed.
  - - Robotics engineer
    - Robot policies often require environment-specific data or extensive calibration
    - Video-conditioned world model plans against current and goal states
    - Generalization to new objects, lower data collection burden, safer manipulation
    - Evidence comes from Meta V-JEPA 2, not AMI deployment.
  - - Automation / logistics owner
    - Manual exception handling limits autonomy in changing physical environments
    - Abstract state representation filters unpredictable details and plans next actions
    - Exception-resolution rate and human intervention reduction
    - No customer deployment, support model, or integration architecture published.
  - - Wearables / personal-device builder
    - Continuous multimodal signals are noisy and context-dependent
    - Persistent memory and sensor-state model detects context and recommends next steps
    - False-alert reduction, latency, battery, privacy, and user trust
    - AMI names wearables but discloses no device, sensor stack, or privacy design.
  - - Safety-critical infrastructure team
    - Autonomy must be auditable and constrained before acting in high-risk environments
    - Human-in-loop planner with validated risk controls and monitoring
    - Validated safety case, incident rate, auditability, and operator acceptance
    - Regulatory and risk-management controls are not yet evidenced for AMI.
  notes: Benefits are diligence metrics to request, not reported AMI outcomes; current limitations preserve roadmap-level
    evidence.
