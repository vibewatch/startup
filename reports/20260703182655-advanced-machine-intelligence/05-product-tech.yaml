  - FE003
- id: deployment-trust-safety-and-compliance
  title: Deployment, Trust, Safety, Privacy, and Compliance Gaps
  body: 'The deployment path is partner-led and regulated-workflow-heavy. AMI’s public surface does not include
    API docs, customer onboarding, monitoring, support, data-processing terms, privacy controls, security certifications,
    or post-market evidence. For healthcare, Nabla’s FDA-certifiable language should be read as aspiration until
    a device scope, predicate or De Novo strategy, validation plan, and change-control plan are visible. FDA, NIST,
    and EU AI Act materials make the control burden concrete: risk management, auditability, validation, human oversight,
    modification control, and protection of health, safety, and rights are not optional in safety-critical use cases.
    The immediate deployment recommendation is constrained pilots with human-in-the-loop review, locked operating
    domains, clear incident processes, and evidence collection before autonomous action.'
  claimRefs:
  - CE029
  - CE030
  - CE031
  - CE032
  - CE033
