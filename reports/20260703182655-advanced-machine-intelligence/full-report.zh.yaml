              可比组同时支持两个结论。第一，前沿 AI、具身 AI 和世界模型公司可以在成熟利润出现前拿到数十亿美元估值：World Labs、Mistral、Physical
              Intelligence、Figure、Wayve 和 Skild 都显示，相邻主题有大量资本需求。第二，AMI 的商业证据弱于其中几个参照。Mistral 有战略产业投资人和已部署的模型业务；World
