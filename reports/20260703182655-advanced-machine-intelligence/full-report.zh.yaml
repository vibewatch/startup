      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              AMI 尚未打包成应用，买方地图因此很碎片化。制造和物流场景里，经济买方通常是负责产出、稼动率、安全和劳动生产率目标的运营、制造或自动化负责人；机器人工程师和系统集成商则是技术用户。机器人和 AV
              公司里，买方可能是机器人工程、仿真或自动驾驶平台组织，需要更好的数据整理、合成场景、模型评估和跨形态泛化。医疗相邻流程里，临床平台负责人和风险 /
              合规团队很重要，因为价值命题取决于可审计性和安全行动，不只是模型准确率。战略创新团队和企业风投部门可以资助早期试点，但除非试点转成运营、临床或工程预算，否则还不足以证明可重复的预算归属。
