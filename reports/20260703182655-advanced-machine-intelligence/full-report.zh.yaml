              Nabla 是第一个具体外部验证点，但应归为战略伙伴，而不是经常性收入证据。Nabla 宣布可优先或首批接入 AMI 正在形成的世界模型，并把合作放在临床流程上：LLM
              在幻觉、非确定性、连续信号和可审计行动上容易失手。STAT 补上一条有用边界：两家公司合作紧密，但尚未披露正式股权或授权协议关系。医疗之外，AMI
              和独立报道反复点名工业过程控制、自动化、可穿戴设备、机器人、自动驾驶、喷气发动机、发电厂和患者器官等目标领域。这些例子说明世界模型为何有价值，也说明验证会很难：最有价值的应用往往安全关键、受监管、数据密集。因此，商业化路径应先是伙伴驱动的实验，而不是立即推出
