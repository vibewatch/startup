  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              AMI 的市场规模应放在物理 AI 和具身 AI 栈里衡量：模型从传感器流学习，模拟后果，规划行动，并支持安全部署到真实世界系统。这个边界包括机器人基础模型、自动驾驶和机器人仿真、工业数字孪生 /
              模型层、医疗相邻的多模态流程智能，以及受监管部署所需的安全工具。它不包括通用聊天助手、横向企业 AI 助手、传统机器人硬件收入，也不包括完整自动驾驶车队经济，除非 AMI
              因模型层获得付费。现状替代方案也很实在：制造商可以继续使用 PLC / MES / SCADA 自动化、经典计算机视觉、系统集成商、任务专用机器人、内部数据科学团队，或供应商绑定的仿真栈。因此，本章把广义具身
              AI 市场数字当作上限背景，再收窄到 AMI 可能合理销售 API、模型、授权或联合开发权的软件 / 模型层机会。
