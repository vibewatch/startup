        - 正面但集中
      - - 投资逻辑：市场能支撑超大赢家
        - 具身 AI 预测和同行融资显示资本胃口很大
        - AMI 能捕获软件经济性，而不只是研究声望的证据
        - 有条件
      - - 反向逻辑：估值先于产品证明
        - 据报道约 $4.5B 投后估值出现在 ARR、SKU、定价或客户披露之前
        - 公开试点结果、收入合同或受保护定价条款
        - 高权重
      - - 反向逻辑：护城河可见前，算力先烧掉资本
        - Epoch 和 Sequoia 将前沿 AI 定义为资本密集，收入缺口仍不确定
        - 预算纪律、模型效率证明和供应商承诺
        - 高权重
      - - 反向逻辑：品类可能沦为炒作标签
        - TechCrunch 援引 AMI 领导层警告：世界模型可能变成融资热词
        - 独立基准把 AMI 和泛泛世界模型主张区分开
        - 中高
      - - 反向逻辑：公司平台和开放平台把这一层商品化
        - NVIDIA Cosmos 和 DeepMind 机器人研究降低世界模型工具的稀缺性
        - 专有数据权利、垂直工作流集成和客户切换成本
        - 中高
    notes: 表格衡量证据质量，而非预期回报；每一行在资本配置前都需要后续尽调。
