            - 控制和监控拿出证据前，阻止自主运行。
    approximationNotes: 定性矩阵；不推断 AMI 数字化基准或产品发布评分。
    claimRefs:
      - CE003
      - CE015
      - CE025
      - CE026
      - CE027
      - CE035
      - CE037
      - CE046
      - CE047
      - CE050
  - id: FU001
    title: 客户旅程图：从 AMI 研究到可能的付费部署
    type: journey-map
    layout: wide
    summary: 路径从 AMI 研究开始；只有在 AMI 赋能的工作流签约、部署、衡量并续约之后，才会变成客户验证。
    data:
      items:
        - label: 研究主线
          detail: 角色：AMI；证据：官方世界模型使命；验证状态：暂无
          value: 1
        - label: 战略访问权
          detail: 角色：Nabla；证据：宣布独家首批访问权；验证状态：合作伙伴验证，不是收入验证
          value: 2
        - label: 渠道测试
          detail: 角色：Nabla 和选定医疗系统；证据：Nabla 已安装工作流；验证状态：使用 AMI 功能前仅为间接证据
          value: 3
        - label: 试点
          detail: 角色：医疗系统买方；证据：需要范围明确的 AMI 赋能功能；验证状态：未公开披露
          value: 4
        - label: 生产部署
          detail: 角色：医疗系统运营方；证据：部署、使用率、安全和 ROI 指标；验证状态：AMI 暂无
          value: 5
        - label: 续约 / 扩展
          detail: 角色：经济买方；证据：续约、NRR、新增工作流；验证状态：AMI 暂无
          value: 6
    approximationNotes: 阶段是基于公开证据搭出的尽调模型；AMI 尚未披露直接试点或续约阶段。
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU012
      - CU013
      - CU031
  - id: FU002
    title: 采用漏斗：AMI 直接验证与 Nabla 渠道验证
    type: funnel
    layout: standard
    summary: 公开证据在合作伙伴访问权和 Nabla 部署环节较强，但到 AMI 直接收入和留存时降为零。
    data:
      items:
        - label: AMI 已点名目标市场
          detail: 有支持：官网点名医疗、工业、自动化、机器人
          value: 6
        - label: 已点名战略伙伴
          detail: 有支持：Nabla 首批访问合作
          value: 5
        - label: Nabla 客户部署
          detail: 间接支持：多个医疗系统案例研究
          value: 4
        - label: 已点名 AMI 赋能试点
          detail: 未披露：审阅的公开来源中没有
          value: 0
        - label: 已点名 AMI 生产客户
          detail: 未披露：审阅的公开来源中没有
          value: 0
        - label: AMI 续约 / 扩展指标
          detail: 未披露：审阅的公开来源中没有
          value: 0
    approximationNotes: 漏斗为定性判断，因为 AMI 未披露试点、生产或续约阶段的数量。
    claimRefs:
      - CU002
      - CU004
      - CU012
      - CU018
      - CU031
      - CU035
  - id: FU003
    title: 客户验证矩阵：按验证对象划分的证据质量
    type: matrix
    layout: wide
    summary: Nabla 客户在部署证据上得分较好；AMI 直接客户得分较低，因为公开记录止步于战略访问权。
    data:
      columns:
        - 已点名主体
        - 生产证据
        - 成果具体性
        - 留存可见度
        - AMI 直接相关性
      rows:
        - label: AMI 直接客户群
          values:
            - 未披露
            - None
            - None
            - None
            - 尽调相关性高，但缺少验证
        - label: Nabla 合作
          values:
            - Nabla
            - 仅战略访问权
            - 首批访问权和路线图
            - 未披露合同期限
            - 战略相关性高
        - label: Denver Health（经 Nabla）
          values:
            - Denver Health
            - 试点后广泛部署
            - 时间减少 40%；倦怠减少 30%
            - 仅短期跟进
            - 间接渠道验证
        - label: Carle Health（经 Nabla）
          values:
            - Carle Health
            - 通过 Epic 推出
            - 55% 节省一小时；89% 推荐
            - 有满意度，无续约
            - 间接渠道验证
        - label: McFarland（经 Nabla）
          values:
            - McFarland Clinic
            - 试点和采用
            - 每月 10,000 次就诊
            - 试点留存 80%
            - 间接渠道验证
        - label: UToledo（经 Nabla）
          values:
            - University of Toledo Health 医疗系统
            - 从评估到更广部署
            - 病历关闭快 29%；积压减少
            - 无续约条款
            - 间接渠道验证
        - label: Aultman（经 Nabla）
          values:
            - Aultman Health System
            - Oracle Cerner 部署
            - 每天节省 30-60 分钟
            - 无续约条款
            - 间接渠道验证
    approximationNotes: 各行评估公开证据可见度，而不是产品质量；AMI 相关性有意与 Nabla 部署质量分开。
    claimRefs:
      - CU012
      - CU015
      - CU019
      - CU020
      - CU021
      - CU024
      - CU027
      - CU029
      - CU030
      - CU031
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最高残余敞口出现在高可能性与估值、算力、监管、客户验证影响叠加处。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解成熟度
        - 残余严重性
      rows:
        - label: 产品前商业化
          values:
            - 高
            - 危急
            - 早期
            - 危急
        - label: 算力强度
          values:
            - 高
            - 高
            - 早期
            - 高
        - label: 医疗监管
          values:
            - 中高
            - 高
            - 部分
            - 高
        - label: 竞争
          values:
            - 高
            - 高
            - 部分
            - 中高
        - label: 关键人物依赖
          values:
            - 中高
            - 高
            - 部分
            - 中高
        - label: Nabla 集中度
          values:
            - 高
            - 中高
            - 部分
            - 中高
        - label: IP / 冲突边界
          values:
            - 中
            - 高
            - Unknown
            - 中高
        - label: 安全 / 隐私控制
          values:
            - 中
            - 高
            - Unknown
            - 高
    approximationNotes: 定性矩阵；未取得公司提供的风险概率。
