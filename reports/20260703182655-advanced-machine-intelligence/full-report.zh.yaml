      - number: '2.4'
        title: 增长驱动因素
        blocks:
          - type: paragraph
            body: >-
              最强市场驱动不是泛泛的 AI 热情，而是物理经济约束让更好的感知、仿真和行动模型变得有价值。工业机器人安装量已连续四年高于 500,000
              台，中国继续提前拉动物理自动化需求，物流和医疗机器人等专业服务机器人品类也在扩大。制造商报告智能制造在产出、生产率和产能上带来收益，同时把流程自动化、传感器、视觉系统、数据分析和 AI
              列为优先事项。基础模型进展是另一条驱动：NVIDIA Cosmos、Gemini Robotics、Genie 2、π0、Helix，以及 LeRobot
              等开放工具，都指向一个从手工编程机器人走向数据驱动策略、合成环境和多模态行动模型的市场。只要 AMI 能把研究产出转成企业级集成点，它的世界模型论点就踩在时间窗口上。
            claimRefs:
              - CM004
