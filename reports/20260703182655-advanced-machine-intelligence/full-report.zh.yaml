      - number: '7.2'
        title: 监管、法律和治理边界未解
        blocks:
          - type: paragraph
            body: >-
              法律风险比单一法规更宽。如果 AMI 技术成为临床流程组件，FDA AI-enabled-device 和 predetermined-change-control
              材料就会变得相关，因为模型行为、更新、验证证据和上市后监测都是核心尽调项。在欧洲，AI Act 把高风险部署变成提供方责任问题，而不只是研究问题。UK 前沿承诺和 NIST RMF
              又提供了实务上的安全测试和治理词汇。行业监管之外，IP 和冲突边界需要特别关注，因为公开记录把 LeCun 与 Meta、NYU 相连，把 LeBrun 与 Nabla、Meta/FAIR 相连，也把 AI
              训练生态与针对 Meta 的活跃版权诉讼相连。这些事实都不能证明 AMI 有不当行为；它们说明，投资人在接受公司治理姿态前，应要求提供转让、数据权利、发表审查、冲突豁免和伙伴排他性文件。
