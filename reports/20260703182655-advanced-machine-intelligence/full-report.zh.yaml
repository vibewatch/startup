  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - AMI 拿出差异化世界模型基准，Nabla 跑通受监管工作流证明，合作伙伴提供数据 / 算力
        - 如果 AMI 成为稀缺的物理 AI 平台，当前约 $4.5B 的投后估值可以自洽；回报仍取决于情景
        - World Labs、Mistral、Figure、Physical Intelligence 和 Wayve 表明，投资者愿意以数十亿美元估值押注前沿物理 AI
        - 下一轮融资前仍没有 AMI 专属产品或合作伙伴经济性
      - - 基准
        - AMI 仍是高质量研究实验室，投资人阵容强，但公开客户证据有限
        - 应以观望 / 跟踪为主；估值应按里程碑校准，而不是套收入倍数
        - TechCrunch 称商业化可能需要数年，AMI 目前暂无收入计划
        - 在没有产品或收入证明的情况下，下一轮定价高于当前隐含投后估值
      - - 悲观
        - 算力成本、监管摩擦、合作伙伴集中度或平台商品化压力超过证明进展
        - 即便团队质量强，当前价格也容易承受平轮 / 下轮压力或重度稀释
        - Sequoia 与 Reuters 的泡沫警示，加上 Epoch 的算力成本压力，都是反向信号
        - 开放平台或直接同行在 AMI 之前展现更强产品牵引
    notes: 由于公开证据不足以支撑虚构 AMI 收入预测或目标回报，情景采用定性里程碑逻辑。
    claimRefs:
      - CV002
      - CV008
      - CV024
      - CV025
      - CV027
      - CV035
      - CV036
      - CV037
      - CV044
      - CV045
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 融资 / 估值信号
      - AMI 参考意义
      - 局限
    rows:
      - - AMI
        - 种子轮 $1.03B，投前估值 $3.5B，隐含投后约 $4.5B
        - 本估值章节的直接入场价格
        - 没有公开收入、优先权、产品或客户经济性
      - - World Labs
        - 2026 年融资 $1B；此前以 $1B 估值融资 $230M；据报洽谈估值约 $5B，且有 Marble 产品证据
        - 最接近的世界模型 / 空间 AI 私营同行
        - 估值报道不如官方融资确定；产品偏创意 / 3D，不是 AMI 的医疗 / 工业方向
      - - Physical Intelligence
        - 2024 年以 $2.4B 投后估值融资 $400M；据报 2026 年洽谈估值超过 $11B
        - 机器人基础模型同行；当机器人演示存在时，物理 AI 溢价成立
        - 后续估值来自报道；商业模式和收入仍未公开
      - - Mistral AI
        - C 轮 €1.7B，投后估值 €11.7B；ASML 投资 €1.3B，取得完全稀释后约 11%
        - 欧洲前沿 AI 实验室，拥有战略工业投资者
        - Mistral 的模型 / 产品分发已超出 AMI 当前公开状态
      - - Figure AI
        - 超过 $1B 的 C 轮承诺投资，投后估值 $39B
        - 体现具身 AI / 人形机器人叙事的极端溢价
        - 人形硬件 / 制造牵引不是 AMI 当前证据集
      - - Wayve
        - $1.05B C 轮，由 SoftBank 领投，用于具身 AI 自动驾驶
        - 显示物理世界 AI 部署能吸引战略资本
        - 汽车 AV 产品化不同于 AMI 研究阶段的世界模型
      - - Skild AI
        - A 轮 $300M，估值 $1.5B
        - 机器人基础模型早期估值基准
        - 轮次更小，机器人定位更直接
      - - CoreWeave
        - S-1/A 披露 IPO 发行价区间为每股 $47-$55，面向 AI 云基础设施
        - AI 基础设施需求和算力稀缺的公开市场路径
        - 已有收入的云基础设施，不可与 AMI 这种收入前研究机构直接相比
      - - NVIDIA
        - 2025 财年文件披露非关联方持有市值约 $2.7T
        - 显示 AI 基础设施供应商捕获的公开市场价值
        - 即便模型实验室回报滞后，供应商经济性也能受益于创业公司支出
      - - AI 巨额融资市场
        - SiliconAngle/PitchBook 报道，2026 年 Q1 美国风投交易额为 $267.2B，其中 5 笔交易占 73%
        - 设定 AI 资本集中和 xAI 级融资胃口的宏观背景
        - 巨额融资会抬高可比估值，但不能证明 AMI 自身价值
    notes: 列举样本来自为价格背景审阅的前沿 AI、物理 AI 和基础设施参照，并非完整私募市场可比公司集。
