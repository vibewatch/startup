              Review，目前没人知道如何做出广泛有用的机器人，重大概念突破仍然必要。Sequoia 对 AI
              基础设施的批评增加第二层风险：如果算力变得像商品，而终端用户收入滞后于资本开支，没有流程锁定的模型供应商会承受价格压力。潜在进入者站位很强，因为 NVIDIA 控制物理 AI 基础设施，Google
              DeepMind 控制前沿机器人研究，Tesla 控制机器人硬件 / 制造和专有数据，Autodesk 等 CAD / 仿真既有厂商拥有流程界面。AMI
