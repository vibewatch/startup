  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 含义
      - 尽调追问
    rows:
      - - 工业机器人部署基础
        - 驱动因素
        - 当前至 2028 年
        - 已安装自动化设备为更好的模型创造数据和集成界面。
        - 核实 AMI 可以接入哪些机器人 / OEM 技术栈。
      - - 劳动力短缺与生产率压力
        - 驱动因素
        - 当前
        - 制造商和服务运营商需要自动化，但只有 ROI 可衡量的场景才会采用。
        - 按工作流量化客户回本门槛。
      - - 仿真与合成数据
        - 驱动因素
        - 当前
        - 世界模型可能降低数据整理、边缘案例生成和评估成本。
        - 获取 AMI 试点证据，对比真实数据与合成数据表现。
      - - 多模态基础模型进展
        - 驱动因素
        - 当前
        - VLA / 世界模型系统正从实验室验证走向合作伙伴预览和开放工具。
        - 用 Cosmos、Gemini Robotics、π0、Helix 和开源基线对标 AMI。
      - - 监管与安全治理
        - 约束因素
        - 当前并在增强
        - 安全关键部署需要风险管理、监控、透明度和变更控制。
        - 将 AMI 目标用途映射到 EU AI Act、FDA 和买方治理义务。
      - - 算力与数据强度
        - 约束因素
        - 当前
        - 训练和定制成本可能迫使 AMI 采用高定价或战略合作。
        - 索取算力预算、数据权利、模型效率和毛利率计划。
      - - 与现有自动化技术栈集成
        - 约束因素
        - 当前
        - 没有适配器和支持，买方不会为了研究模型拆掉可信 OT 系统。
        - 验证集成、正常运行时间 SLA、网络安全模型和系统集成商渠道。
      - - 基准测试与 ROI 证明尚不成熟
        - 约束因素
        - 短期
        - 通用演示不能证明在受监管或高差异运营中的价值。
        - 要求围绕具体任务做试点，并交代基线、安全、成本和部署指标。
    notes: 方向是作者基于引用证据作出的分类。时间判断取决于该因素已在公开来源中显现，还是仍有赖未来部署浪潮。
