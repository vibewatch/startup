      - 相关性
    rows:
      - - 机器人基础模型层
        - 世界模型、VLA 策略、合成数据、评估、微调、安全护栏
        - 机器人硬件、执行器、电池、安装服务
        - 机器人 CTO、自主系统负责人、机器人工程 VP
        - 如果 AMI 销售模型授权或联合开发，这是最接近的类别。
      - - 工业自动化智能
        - 传感器融合、异常预测、数字孪生推理、面向工厂和厂区的安全规划
        - PLC/MES/SCADA 许可收入和完整系统集成人力
        - COO、厂长、自动化总监
        - 预算很大，但必须证明集成和运行时间。
      - - 自动驾驶出行 / AV 工具链
        - 用于场景、仿真、评估和车队学习辅助的世界模型
        - 整车制造、网约车车队收入、保险、地图硬件
        - 自主系统平台负责人、OEM 软件买方
        - 相关性来自仿真和规划，而不是完整 AV TAM。
      - - 医疗邻近多模态工作流
        - 面向临床工作流上下文、监测、文档和未来具身照护支持的可审计模型
        - 医疗服务报销、医院硬件、无关临床 SaaS
        - 临床平台负责人、合规官、服务提供方运营
        - Nabla 展示了一条路径，但监管和责任会拖慢采用。
      - - 战略研究与创新
        - 付费试点、联合研究、战略授权、投资人支持的概念验证
        - 未披露且没有付费权利的内部 R&D
        - 企业风险投资、创新、AI 实验室领导层
        - 是有用的切入楔子，但不足以证明收入可重复。
      - - 通用 AI 软件 / copilots
        - 除非与物理感知、仿真或安全动作绑定，否则不纳入
