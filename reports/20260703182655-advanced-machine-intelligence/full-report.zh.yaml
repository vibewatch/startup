  - id: TV005
    title: 投资论点失效与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 无保护加价
        - 下一轮定价高于当前隐含投后估值，且未披露 SKU、收入或具名客户
        - 把质量故事变成估值风险
        - 没有重置或保护就不参与
      - - 无产品证明
        - 下一轮融资窗口前没有 AMI 专属基准、演示、API、试点或产品规格
        - 世界模型论点仍停留在未转化的研究
        - 从跟踪下调为回避
      - - 缺少 Nabla 经济性
        - 首个准入合作关系没有合同经济性、数据权利、监管责任方或使用指标
        - 合作伙伴证明停留在营销，而非商业化
        - 投资前要求客户尽调
      - - 算力计划不透明
        - 没有预算、供应协议、模型效率路径或烧钱敏感性
        - 无法承销资金续航和稀释风险
        - 任何投资都以运营计划为条件
      - - 监管阻滞
        - 医疗使用场景无法映射到 FDA/EU 义务或安全验证
        - 限制最有价值的早期切入口
        - 转向非医疗用例证明，或暂停
      - - 平台商品化
        - NVIDIA、DeepMind 或开放平台在 AMI 建立数据护城河前就追平世界模型能力
        - 压缩定价权和退出可选性
        - 要求专有数据或垂直分发证明
      - - 治理缺口
        - 在高估值下，条款仍缺少信息权、里程碑报告或投资人保护
        - 投资人无法监测投资论点何时失效
        - 拒绝或重新谈判条款
    notes: 否决触发因素是尽调阈值；没有任何一项假设公开目标价或保证回报。
    claimRefs:
      - CV031
      - CV032
      - CV035
      - CV036
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
      - CV047
      - CV048
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 轮次条款
        - 股权结构表、清算优先权、分批交割安排、期权池、按比例跟投权和信息权
        - 决定有效入场价格和下行保护
        - 索取融资文件和投资人附函
      - - 产品证明
        - AMI 专属演示、技术规格、基准和产品路线图
        - 把研究声誉转化为可承销的里程碑证据
        - 审阅基准包、路线图和独立评估
      - - Nabla 经济性
        - 合同价值、数据权利、责任分配、监管计划和试点里程碑
        - 唯一具名合作伙伴证明贴近医疗且集中
        - 访谈 Nabla 管理层并审查协议
      - - 算力计划
        - 预算、供应商承诺、训练运行、推理成本目标和模型效率
        - 算力强度会吃掉资金续航并迫使稀释
        - 审阅董事会预算、云 / GPU 合同和敏感性模型
      - - 人才与治理
        - 关键人物依赖、招聘计划、留任方案和董事会控制
        - 创始人主导的实验室一旦招聘或治理滑坡就会脆弱
        - 访谈领导层并审阅组织计划
      - - 监管准备度
        - FDA/EU AI Act 分类、安全论证、审计日志和质量管理计划
        - 安全关键用例商业化前需要合规证据
        - 开展监管律师审查和红队计划
      - - 竞争护城河
        - 数据权利、合作伙伴排他性、模型评估差异化和开源姿态
        - NVIDIA 和 DeepMind 能将通用世界模型工具商品化
        - 将 AMI 基准与 Cosmos、Gemini Robotics、World Labs 和 PI 对比
      - - 退出路径
        - 战略收购方地图、收入里程碑和 IPO 准备前置条件
        - 没有商业证明，退出可选性仍是推测
        - 把里程碑映射到潜在战略买家和公开市场可比对象
    notes: 尽调问题聚焦那些足以改变建议、置信度或估值立场的证据。
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
      - CV045
      - CV046
      - CV047
      - CV048
