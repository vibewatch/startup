      - number: '1.3'
        title: 资本结构、投资人与战略期权价值
        blocks:
          - type: paragraph
            body: >-
              AMI 的 $1.03B 种子轮，是公司可投也高风险的同一个事实。公司、投资人和独立来源都指向约 €890M / $1.03B 融资，投前估值 $3.5B；扣除费用或任何未披露结构前，隐含投后约
              $4.5B。本轮由 Cathay Innovation、Greycroft、Hiro Capital、HV Capital 和 Bezos Expeditions 共同领投，战略和长期支持方包括
              NVIDIA、Samsung、Temasek、Toyota Ventures、Sea、SBVA 和 Alpha Intelligence Capital。这个财团不只是钱：硬件、工业、亚洲和医疗相邻资源，在
              AMI 证明科学路径后可能转成部署通道。反向解读是，估值已经把多年研究突破提前计价，而 AMI 仍无收入、审计报表，也未披露 Nabla 之外的客户。Sequoia 对 AI 资本开支的批评、Reuters
              来源关于 AI 估值泡沫的评论，并不是 AMI 专属失败证据，但足以成为承销十亿美元种子轮的护栏。
