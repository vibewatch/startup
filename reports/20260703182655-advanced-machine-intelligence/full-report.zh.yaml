chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与产品论点
        blocks:
          - type: paragraph
            body: >-
              AMI 更应被视为一家新成立的法国前沿 AI 实验室，而不是已有成熟商业指标的软件运营商。法律锚点是 ADVANCED MACHINE INTELLIGENCE：这是一家巴黎 SASU，SIREN
              994675254，2025-12-15 完成 RCS Paris 注册，现总部位于 10 rue de Penthièvre, 75008 Paris。公司的公开入口是
              amilabs.xyz；其使命声明称，AMI 正在构建世界模型，用于学习真实世界传感器数据的抽象表征，并在安全护栏下规划。这个身份与融资公告一致：AMI
              还没有销售打包产品，而是用异常庞大的种子轮押注长周期研究、算力和人才。因此，核心尽调框架是阶段错配。资本规模像后期公司，业务仍处在产品前、收入前阶段，并依赖一套非共识技术架构落地到可靠性要求很高的应用。
