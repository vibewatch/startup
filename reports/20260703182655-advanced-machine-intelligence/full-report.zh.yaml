        title: 格局与替代地图
        blocks:
          - type: paragraph
            body: >-
              AMI 的竞争场景是拥挤的物理 AI 栈，而不是边界清晰的单一软件品类。最接近的直接同行包括 World Labs、Google DeepMind Genie 2 等世界模型和空间智能实验室，也包括
              Physical Intelligence、Skild AI、Figure、Covariant 等机器人策略实验室；它们都在尝试把多模态感知转成行动。赋能平台同样重要：NVIDIA Cosmos 和
              Hugging Face LeRobot 向开发者提供模型、数据集、仿真和策略工具，可能降低使用 AMI 专有层的必要性。当买方更偏好全栈自主能力或内部自建，而不是授权模型供应商时，Wayve 和 Tesla
              等垂直具身 AI 公司就是替代方案。因此，实际格局由直接竞争者、赋能平台、替代 / 内部自建、现状自动化，以及可能凭算力、数据或流程控制切入的新进入者构成。
