      - number: '2.2'
        title: 规模测算视角与口径调和
        blocks:
          - type: paragraph
            body: >-
              证据支持多个测算视角，而不是单一 TAM。MarketsandMarkets 估计具身 AI 2025 年市场为 $4.44B，2030 年为
              $23.06B，但它的产品边界包括机器人、外骨骼、自主系统和智能家电，远宽于 AMI 可能变现的层。IFR 的 2025 World Robotics 页面显示物理自动化需求按台数看很强——2024
              年工业机器人安装量 542,000 台，专业服务机器人销量接近 200,000 台——但这不是软件收入池。Deloitte 的智能制造调查显示买方已准备投入
              AI、数据、传感器和自动化，但也意味着采用会嵌在更大的转型项目里。调和后的市场判断是：物理系统大背景很大且在增长，具身 AI 市场估算中等规模，而软件 / 世界模型 SAM 要小得多，必须靠试点和定价证明。
