      - number: '5.3'
        title: 相对 LLM 与开放物理 AI 平台的差异化
        blocks:
          - type: paragraph
            body: >-
              AMI 最强的差异化主张是概念层面的：token 预测型 LLM 针对语言续写优化，而 JEPA
              式世界模型学习抽象状态表征，并预测世界可能如何演化，尤其是在候选动作之下。这在医疗和机器人里相关，因为幻觉、缺失因果性和弱物理扎根都可能不可接受。风险在于，架构本身不是护城河。Meta、NVIDIA、Hugging
              Face 和 DeepMind 已经在相邻的世界模型和机器人控制领域公开论文、代码、模型集合、仿真工具或私有预览。因此，AMI 需要专有伙伴数据权利、安全评估、集成界面和部署证据来证明差异化。没有这些，买方可能把
              AMI 视为开放平台、内部自建项目和既有机器人栈之间的一条研究路径而已。
