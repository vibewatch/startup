      - number: '7.5'
        title: 缓释措施必须落到可监测触发项
        blocks:
          - type: paragraph
            body: >-
              风险清单只有在缓释措施可衡量时才值得投资。第一道证据门槛是 AMI 专属产品产物：演示、基准测试或试点，且评估协议有记录、可复现。第二道是治理证据：IP
              转让、数据权利安排、利益冲突豁免、监管分类分析和安全控制。第三道是商业证据：Nabla 之外的具名设计合作伙伴、定价或试点经济性、客户 ROI
              和部署支持义务。最后一道是资本纪律：算力承诺、跑道、烧钱速度和融资预期，应当对应技术里程碑，而不是对应头条估值。单个门槛失败未必致命；但产品验证、治理和融资同时失守，就应推翻投资论点，因为这意味着本轮买到的是时间，而不是风险下降。今天的剩余风险仍然很高：公开记录里有很强的野心和融资，但
