              AMI 面向医疗的新兴技术。这些证据支撑收入模型假设，不支撑收入确认。未来可能的收入流包括企业模型授权、API
              访问、联合开发费用、垂直部署、医疗合作伙伴经济分成，以及可能的战略研究合同。没有合同、用量、定价、开票和续约数据，任何一项都不能当作已入账收入。尽调姿态因此必须明确：当前收入指标用 null，Nabla
