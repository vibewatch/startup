      - number: '1.2'
        title: 领导层、治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              以公司的年龄看，领导班底罕见地可信，但公开证据也把故事压缩在少数个人身上。AMI 称 Yann LeCun 担任董事长，Alexandre LeBrun 担任 CEO，Laurent Solly 担任
              COO，Saining Xie 是首席科学官，Pascale Fung 是首席研究与创新官，Michael Rabbat 负责世界模型。这套组合把 LeCun 的 JEPA / 世界模型论点、LeBrun 通过
              Wit.ai 和 Nabla 积累的公司建设经验，以及多位 Meta/FAIR 相关的研究和运营履历放在一起。人才确定性强于治理确定性：不同来源对 LeCun
              的表述在执行董事长与非执行董事长之间摇摆，公开资料中也没有出现董事会、投票控制或投资人权利安排。后续章节因此应把本章角色表当作具名领导者地图，而不是完整治理深度的证明。最高优先级尽调问题是：公司能否把决策机制制度化，不只依赖
              LeCun 的科学权威和 LeBrun 的运营角色。
