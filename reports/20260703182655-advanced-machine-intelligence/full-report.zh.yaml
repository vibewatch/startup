            body: >-
              可投资的论点是：世界模型成为新的物理 AI 前沿栈，AMI 赢下足够的人才、算力、合作伙伴数据和安全可信度，从而定义这一层。这个判断并不空想：AMI 有战略支持方，World Labs 和 Physical
              Intelligence 证明投资人愿意押注相邻的世界模型和机器人基础模型，NVIDIA 和 DeepMind 也把物理 AI
              验证为一条重要技术方向。反论点同样重要。同样的关注度可能在买方看到持久产品价值之前，把世界模型变成融资标签。AMI 首个具名合作伙伴 Nabla 提供了有用验证，但公开证据尚未披露合同经济性、数据权利、FDA
              路径归属或客户转化。因此，投资论点可信，但在所报道价格下还不足以承销，尤其外部报道仍把本轮描述为在收入出现前给顶尖研究员支付的溢价。
