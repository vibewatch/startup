      - number: '7.4'
        title: 合作伙伴、人员与竞争者依赖压窄执行路径
        blocks:
          - type: paragraph
            body: >-
              AMI 的集中风险分三层。第一，公开具名的早期垂直路径只有 Nabla；它有战略价值，但也让 AMI 依赖一个医疗合作伙伴、一组数据权利谈判，以及一条临床验证路径。第二，AMI 与关键人物绑定很深：LeCun
              提供研究可信度，LeBrun 搭起 Nabla 和运营之间的桥。公开叙事因此暴露在关键人可用性、继任和治理风险之下。第三，世界模型赛道已经不再空白。World Labs、Google DeepMind 和
              NVIDIA 都在发布相邻的空间、机器人和物理 AI 工作；在 AMI 拿出公开产品证据之前，既有平台就能先把算力、工具、分发和客户关系合在一起。缓释手段不是泛泛招聘，而是让外界看见足够深的梯队、Nabla
              之外的设计合作伙伴、有文件记录的合作条款，以及 AMI 能在某个具体工作流里打赢资本更充足平台的证据。
