      - number: '7.3'
        title: 运营风险集中在可靠性、算力和未披露控制上
        blocks:
          - type: paragraph
            body: >-
              AMI 的技术承诺也是它的运营负担。面向医疗、机器人或工业控制的世界模型，不能只生成看似合理的输出；它必须支撑测试、监控、可审计性、变更控制、兜底行为和事件响应。外部材料说明这会很贵：Epoch
              估计前沿训练成本升级，NVIDIA 描述物理 AI 工作负载需要 PB 级视频和大规模算力小时预算，Sequoia 警告基础设施支出必须由真实收入证明。安全和隐私叙事尚未公开。AMI
              未来或许能建立强控制，但留存来源没有披露临床数据治理、模型日志、红队测试结果、访问控制或泄露响应姿态。因此，运营质量是门控风险，而不是投后增强项；尤其是受监管客户会在生产自主性前索要证据。
