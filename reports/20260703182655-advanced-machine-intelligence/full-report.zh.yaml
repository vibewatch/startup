  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 算力、治理和产品验证一旦失手，风险会传导到客户采用、融资预期和估值。
    data:
      nodes:
        - id: compute
          label: 算力强度
          detail: 训练、数据整理的成本与产能。
        - id: quality
          label: 质量与安全证据
          detail: 基准测试、红队测试、监控和兜底行为。
        - id: regulatory
          label: 监管路径
          detail: FDA、EU AI Act、NIST、英国安全测试。
        - id: partner
          label: Nabla 依赖
          detail: 首个具名合作伙伴，也是切入医疗的楔子。
        - id: product
          label: AMI 产品验证
          detail: SKU、API、试点和基准尚未公开。
        - id: customers
          label: 客户采用
          detail: 具名试点和 ROI 证据。
        - id: financing
          label: 融资预期
          detail: 大额融资抬高下一轮验证门槛。
        - id: valuation
          label: 估值残余风险
          detail: 若验证跟不上，估值会绷得过紧。
      edges:
        - from: compute
          to: product
          label: 成本与产能关口
        - from: quality
          to: product
          label: 发布关口
        - from: regulatory
          to: customers
          label: 审批与信任关口
        - from: partner
          to: customers
          label: 渠道集中
        - from: product
          to: customers
          label: 可部署验证
        - from: customers
          to: financing
          label: 收入验证
        - from: financing
          to: valuation
          label: 估值上台阶压力
        - from: compute
          to: financing
          label: 资本需求
        - from: regulatory
          to: valuation
          label: 责任折价
    approximationNotes: DAG 是尽调监控使用的定性因果图。
    claimRefs:
      - CR017
      - CR018
      - CR020
      - CR033
      - CR034
      - CR036
      - CR038
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 客户验证出现前，AMI 依赖少数关键人物、合作伙伴、基础设施和治理对手方。
    data:
      nodes:
        - id: lecun
          label: Yann LeCun
          detail: 研究声誉与论点。
        - id: lebrun
          label: Alexandre LeBrun
          detail: CEO，也是 Nabla 与运营能力的桥梁。
        - id: nabla
          label: Nabla
          detail: 独家优先接入合作伙伴。
        - id: meta-nyu
          label: Meta / NYU 边界
          detail: 既往与当前所属关系。
        - id: compute
          label: 云 / GPU 技术栈
          detail: 训练与推理基础设施。
        - id: regulators
          label: 监管机构
          detail: FDA、EU AI Act 和安全框架。
        - id: competitors
          label: World Labs / DeepMind / NVIDIA
          detail: 世界模型 / 物理 AI 的替代路径。
        - id: ami-proof
          label: AMI 验证包
          detail: 有治理框架的试点、安全论证和客户 ROI。
      edges:
        - from: lecun
          to: ami-proof
          label: 研究可信度
        - from: lebrun
          to: ami-proof
          label: 运营桥梁
        - from: nabla
          to: ami-proof
          label: 优先接入数据与工作流
        - from: meta-nyu
          to: ami-proof
          label: IP / 冲突尽调
        - from: compute
          to: ami-proof
          label: 产能关口
        - from: regulators
          to: ami-proof
          label: 发布关口
        - from: competitors
          to: ami-proof
          label: 差异化压力
    approximationNotes: 依赖关系图仅反映公开证据；若能核验非公开合同，集中度可能降低。
    claimRefs:
      - CR009
      - CR024
      - CR025
      - CR026
      - CR031
      - CR035
      - CR039
      - CR042
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 决策链把前沿实验室的强成色和公开经济性的弱证据，落到「跟踪 / 继续研究」立场。
    data:
      nodes:
        - id: quality
          label: 创始人 / 投资人质量
          detail: LeCun 领衔的实验室，背后有战略投资方和大额种子资金。
        - id: market
          label: 大型前沿市场
          detail: 世界模型、具身 AI 和物理 AI 可比公司显示资本胃口。
        - id: proofgap
          label: 产品与收入缺口
          detail: AMI 的 ARR、定价、SKU、客户合同均未公开。
        - id: costrisk
          label: 算力与资本开支风险
          detail: 前沿 AI 的经济账在收入看清前，就要求大额投入。
        - id: regpartner
          label: 监管与合作伙伴集中度
          detail: Nabla 有价值，但医疗合规和经济性仍未解决。
        - id: valuation
          label: 当前价格偏贵
          detail: 对一家种子阶段实验室，隐含投后估值约 $4.5B。
        - id: decision
          label: 跟踪 / 继续研究
          detail: 只有条款受保护，或拿到里程碑证据，才继续推进。
      edges:
        - from: quality
          to: market
          label: 支撑上行
        - from: market
          to: valuation
          label: 设定前沿溢价空间
        - from: proofgap
          to: valuation
          label: 削弱价格支撑
        - from: costrisk
          to: valuation
          label: 抬高稀释风险
        - from: regpartner
          to: valuation
          label: 增加执行关口
        - from: valuation
          to: decision
          label: 约束交易纪律
    approximationNotes: 定性决策流；边的方向体现投资逻辑，而非因果证明。
    claimRefs:
      - CV033
      - CV034
      - CV038
      - CV039
      - CV047
      - CV049
      - CV050
      - CV051
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 估值判断最受产品验证、客户经济性、算力计划和融资条款影响。
    data:
      items:
        - label: AMI 产品 / 基准验证
          value: 9
          unit: sensitivity score
          detail: AMI 专属公开验证缺位，是最大的摆动因素。
        - label: Nabla 经济性与数据权利
          value: 8
          unit: sensitivity score
          detail: 优先接入合作伙伴能验证论点，也可能放大集中风险。
        - label: 算力预算与供应商条款
          value: 8
          unit: sensitivity score
          detail: 前沿训练成本可能倒逼稀释。
        - label: 轮次优先权 / 分批交割
          value: 8
          unit: sensitivity score
          detail: 有效价格可能明显偏离名义估值。
        - label: 世界模型同业动能
          value: 6
          unit: sensitivity score
          detail: World Labs、PI、Mistral、Figure 和 Wayve 支撑上行背景。
        - label: 监管路径
          value: 6
          unit: sensitivity score
          detail: 医疗和安全关键场景需要审批逻辑。
        - label: AI 估值周期
          value: 7
          unit: sensitivity score
          detail: Reuters 与 Sequoia 的警示加大下行不对称性。
    approximationNotes: 评分是 1-10 的定性敏感度，不是财务预测。
    claimRefs:
      - CV024
      - CV025
      - CV027
      - CV035
      - CV036
      - CV040
      - CV041
      - CV042
      - CV048
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据只能支撑入场估值防御性的情景区间，不能支撑虚构回报目标。
    data:
      items:
        - label: 悲观情景防御性
          low: 0.2
          mid: 0.4
          high: 0.6
          unit: qualitative index
          detail: 若算力、商业化或平台竞争跑在验证之前，存在平轮 / 下轮风险。
        - label: 基准情景防御性
          low: 0.4
          mid: 0.55
          high: 0.7
          unit: qualitative index
          detail: AMI 把研究转成产品和合作伙伴证据期间，继续跟踪。
        - label: 乐观情景防御性
          low: 0.7
          mid: 0.85
          high: 1
          unit: qualitative index
          detail: 如果 AMI 成为稀缺物理 AI 平台并拿出客户验证，当前价格可以站得住。
    approximationNotes: 指数表达当前估值在不同证据情景下的防御性，不是回报预测。
    claimRefs:
      - CV002
      - CV035
      - CV036
      - CV037
      - CV044
      - CV046
  - id: FV004
    title: 投资关键指标
    type: kpi
    layout: standard
    summary: AMI 的野心和资本可得性得分高，公开经济性验证和价格支撑得分低。
    data:
      items:
        - label: 市场野心
          score: 8
          note: 物理 / 世界模型 AI 有强同业和市场信号。
        - label: 团队 / 投资人信号
          score: 9
          note: 创始人与战略投资方成色异常强。
        - label: 产品就绪度
          score: 2
          note: AMI 的 SKU、API、基准测试、发布证据均未公开。
        - label: 客户验证
          score: 3
          note: Nabla 有价值，但合作伙伴经济性仍未披露。
        - label: 经济性可见度
          score: 1
          note: ARR、定价、毛利率和烧钱速度均未公开。
        - label: 风险强度
          score: 8
          note: 分数越高，来自算力、竞争和监管的风险越高。
        - label: 估值吸引力
          score: 2
          note: 按当前证据看，隐含投后估值约 $4.5B，偏贵。
    approximationNotes: 评分是定性的投委会就绪度指标；除上述风险强度外，分数越高越好。
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV028
      - CV031
      - CV032
      - CV033
      - CV034
      - CV039
      - CV049
