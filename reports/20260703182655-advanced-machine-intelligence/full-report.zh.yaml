  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前价格与建议
        blocks:
          - type: paragraph
            body: >-
              AMI 应被视为一笔定价极高的特殊研究型公司融资，而不是常规种子期软件投资。公开记录支持本轮规模、投资人质量和 $3.5 billion 投前估值，但不支持收入倍数测算，因为 AMI
              尚未披露收入、ARR、定价、毛利率或付费客户。这个缺口比通常更关键：隐含投后价格已经约为 $4.5
              billion，而商业化可能还要数年。因此立场应是跟踪或继续研究：若条款受到保护，可以继续尽调、保留选择权；但不要仅凭公开证据按当前报道价格承销买入。IC 真正要问的不是 AMI
              是否令人印象深刻，而是私下条款和里程碑能否补偿过早买入的风险。
