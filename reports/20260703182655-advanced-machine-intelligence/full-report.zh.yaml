  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: AMI 直接客户证据仍处商业化前
        blocks:
          - type: paragraph
            body: >-
              公开客户尽调应从一个负面发现开始：AMI 尚未披露付费客户基础、客户数量、产生 ARR 的试点、NRR 或合同条款。最强直接证据是 AMI 自己的定位——一家为可靠性关键领域构建世界模型的研究实验室——以及
              Nabla 的独家首批接入合作。这让 Nabla 具有战略重要性，但不会把 Nabla 的医疗系统客户转成 AMI 客户。AMI
              可能的买方是需要可靠预测、规划和仿真的企业或受监管运营方；在医疗切口里，经济买方很可能是 Nabla 或医疗系统渠道，而不是单个临床医生。因此，尽调姿态是商业化前：先拆分可能的买方、用户和付款方群体，再要求
              AMI 特定生产部署证据，才可承销可重复性。实际操作上，本章每个尽调展项都把客户证明按层级处理：AMI 官方定位在底部，其上是 Nabla 战略接入，Nabla 客户部署证明放在独立的渠道验证通道里，AMI
              直接生产证明仍为空。这个层级防止报告把伙伴势能误转成尚未赚到的客户指标。
