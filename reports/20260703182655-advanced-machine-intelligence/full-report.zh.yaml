            body: >-
              公开证据缺少 AMI 财务数据，情景分析不应编造退出价值或目标回报。真正有用的是看里程碑能否支撑价格。牛市情景里，AMI 发布产品基准，Nabla
              拿出受监管工作流验证，合作伙伴数据或算力形成稀缺平台，当前价格才可能合理。基准情景里，AMI 仍是一家高质量实验室；在产品和客户证据出现前，估值应保持不变。熊市情景里，算力成本、监管摩擦、估值周期压缩，或开放 /
              企业平台跑在 AMI 证据之前，迫使公司平轮或下轮融资。因此，进场纪律应是结构性的：分期、按比例跟投权、治理报告和更低的有效进入价格，比无保护加价更站得住。
