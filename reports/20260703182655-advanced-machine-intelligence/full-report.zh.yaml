  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 主导风险是产品前、高估值的研究押注
        blocks:
          - type: paragraph
            body: >-
              AMI
              的风险栈应自上而下读：估值和声誉先于产品证据到来，而最难的主张依赖世界模型系统，这些系统必须在受监管、安全关键领域足够可靠。公司拥有异常强的创始人可信度和很大的资产负债表期权，但这些优势也抬高门槛。严重风险不是孤立的：算力强度拖慢产品化，产品化延迟让客户证明稀缺，证明稀缺使
              $3.5 billion 投前估值更难辩护，融资门槛又会增加公司在治理、安全和医疗控制充分举证前启动产品的压力。反向来源在这里很重要。Forbes 追问世界模型能否越过炒作，Sequoia
              质疑基础设施支出背后的广义 AI 收入缺口，Epoch 显示前沿训练经济性可能只对资金最充足的实验室可承受。投资含义因此是 track 或
              research-more，而不是按已规模化公司承销：在把本轮规模视为验证之前，要求 AMI 特定基准、受治理试点和合同证据。
