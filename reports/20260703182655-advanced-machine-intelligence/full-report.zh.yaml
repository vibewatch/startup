      - number: '2.5'
        title: 商业化约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              市场有吸引力，但门槛很高。Bain 和 MIT Technology Review
              都提醒，类人和物理智能体采用仍处早期、分阶段推进，并受自主性、灵巧度、电力、安全和信任限制。受监管或安全关键流程还叠加一层要求：EU AI Act 义务、FDA 对自适应医疗软件的生命周期监管、NIST
              风险管理实践，以及前沿 AI 安全承诺，都会把买方推向验证、监测、治理和事件响应。算力强度同样重要，因为 Epoch 的训练成本研究和 Sequoia 的 $600B
              批评显示，前沿模型经济性可能跑在终端用户收入前面。因此，关键尽调问题首先是商业问题，不只是技术问题：AMI 到底销售什么价值单元、谁拥有预算、试点如何证明
              ROI、买方会接受哪些基准，以及能否在竞争对手或既有厂商商品化模型层之前拿出安全证据。
