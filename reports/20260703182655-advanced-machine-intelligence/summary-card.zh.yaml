  topStrengths:
    - Yann LeCun、Alexandre LeBrun 以及资深世界模型研究团队，给了公司创始人与研究履历背书。
    - 种子轮资本规模异常充足，财务和战略投资人组合质量很高。
    - 逆向的世界模型逻辑，契合医疗、机器人、工业自动化与可穿戴设备里的实体 AI 需求。
    - Nabla 提供了早期战略合作伙伴通道，并能优先接入新兴 AMI 技术。
  topRisks:
    - 没有公开证据显示公司已经交付产品、发布 AMI 专属 benchmark、拿下直接付费客户、形成 ARR 或签署商业合同。
    - 算力、数据整理与资本强度可能在收入证据出现前吃掉种子轮资金。
    - 围绕 LeCun、Meta/NYU、LeBrun 与 Nabla 的关键人、治理、IP 和关联方依赖仍未解决。
    - 医疗和其他安全关键目标领域带来重大的监管、可审计性与责任负担。
    - 对一个种子期、产品前实验室来说，估值偏贵；如果里程碑落后，估值可能压缩。
  unresolvedGaps:
    - 融资条款、清算优先权、分批提款、期权池处理、投资人权利与有效进入价格。
    - AMI 专属产品 benchmark、路线图里程碑、SKU/API 定义、部署接口与可靠性证据。
    - Nabla 经济性、数据权利、授权条款、最低承诺、排他性与转让定价安排。
    - 算力采购承诺、供应商集中度、月度烧钱速度、现金跑道，以及对 GPU 价格或容量冲击的敏感性。
    - 直接客户证据、已签试点或合同、客户数、ARR、收入质量与定价模型。
    - AMI、Meta、NYU、Nabla、开源承诺与监管领域安全控制之间的治理和 IP 边界。
