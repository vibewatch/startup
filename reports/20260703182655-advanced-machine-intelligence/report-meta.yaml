  topStrengths:
    - Founder and research pedigree around Yann LeCun, Alexandre LeBrun, and a senior world-model research bench.
    - Exceptional seed capitalization and high-quality financial and strategic investor syndicate.
    - Contrarian world-model thesis aligned with physical-AI demand in healthcare, robotics, industrial automation, and wearables.
    - Early strategic partner channel through Nabla with first access to emerging AMI technologies.
  topRisks:
    - No public evidence of a shipped product, AMI-specific benchmark, direct paying customer, ARR, or commercial contract.
    - Compute, data-curation, and capital intensity could consume the seed round before revenue proof emerges.
    - Key-person, governance, IP, and related-party dependence around LeCun, Meta/NYU, LeBrun, and Nabla remain unresolved.
    - Healthcare and other safety-critical target domains carry material regulatory, auditability, and liability burdens.
    - Valuation is expensive for a seed-stage, pre-product lab and could compress if milestones lag.
  unresolvedGaps:
    - Financing terms, liquidation preferences, tranches, option-pool treatment, investor rights, and effective entry price.
    - AMI-specific product benchmarks, roadmap milestones, SKU/API definition, deployment interface, and reliability evidence.
    - Nabla economics, data rights, licensing terms, minimum commitments, exclusivity, and transfer-pricing arrangements.
    - Compute procurement commitments, supplier concentration, monthly burn, runway, and sensitivity to GPU price or capacity shocks.
    - Direct customer evidence, signed pilots or contracts, customer count, ARR, revenue quality, and pricing model.
    - Governance and IP boundaries across AMI, Meta, NYU, Nabla, open-source commitments, and regulated-domain safety controls.
