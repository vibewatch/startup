companyProfile:
  summary: Advanced Machine Intelligence, publicly branded as AMI Labs, is a Paris-based frontier AI lab developing world models for safety-critical physical-world workflows across healthcare, industrial automation, robotics, wearables, and related domains. The public record supports a December 2025 French registration, a March 2026 public funding launch, a deep founding leadership bench around Yann LeCun and Alexandre LeBrun, and a first-access Nabla partnership; it does not yet evidence a shipped AMI product, revenue base, or paying customer roster.
  foundedDate: "2025-12-15"
  founders:
    - name: Yann LeCun
      role: Founder / chair
      background: AI researcher publicly tied to Meta AI and NYU, with AMI's public narrative anchored on his world-model thesis.
      claimRefs: [CO010, CO011, CR024]
    - name: Alexandre LeBrun
      role: CEO
      background: Former Nabla CEO and co-founder who moved into AMI while retaining Nabla chair and chief AI scientist roles.
      claimRefs: [CO012, CR025]
    - name: Laurent Solly
      role: COO
      background: Former Meta Europe operating leader adding scaled operating experience to the research-heavy bench.
      claimRefs: [CO010, CO013]
    - name: Saining Xie
      role: Chief Science Officer
      background: Research leader contributing visual representation learning expertise to the founding bench.
      claimRefs: [CO010, CO014]
    - name: Pascale Fung
      role: Chief Research & Innovation Officer
      background: Research leader contributing human-centered AI expertise to the founding bench.
      claimRefs: [CO010, CO014]
    - name: Michael Rabbat
      role: VP World Models
      background: Research leader contributing world-model expertise to the founding bench.
      claimRefs: [CO010, CO014]
  foundingLocation: Paris, France
  headquarters: 10 rue de Penthièvre, 75008 Paris, France
  productSummary: AMI has not disclosed a sellable SKU; it is developing world-model systems that learn real-world sensor representations, predict consequences, and support guarded planning for safety-critical workflows.
  customerFocus: Regulated and safety-critical operators in healthcare, industrial process control, automation, wearables, and robotics, with Nabla as the first named healthcare partner channel.
  businessModel: Not yet disclosed; public evidence points to possible future model licensing, API access, vertical partner deployments, co-development, and healthcare commercialization through partners.
  stage: Seed; pre-product and pre-revenue in public evidence
  fundingStatus: $1.03B seed announced on 2026-03-10 at a reported $3.5B pre-money valuation, implying roughly $4.53B post-money before unknown structure.
  disclosureProfile: private-undisclosed
  claimRefs: [CO002, CO003, CO004, CO005, CO010, CO016, CO017, CO022, CO024, CI009, CE003]
summary:
  headline: AMI is an exceptionally capitalized physical-AI lab with elite leadership, but public evidence supports research-more rather than buy because product, customer, economics, and governance proof trail its seed valuation.
