  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Round terms
        - Cap table, liquidation preference, tranche schedule, option pool, pro-rata and information rights
        - Determines effective entry price and downside protection
        - Request financing documents and investor side letters
      - - Product proof
        - AMI-specific demo, technical spec, benchmarks, and product roadmap
        - Converts research prestige into underwritable milestone evidence
        - Review benchmark packs, roadmap, and independent evaluations
      - - Nabla economics
        - Contract value, data rights, liability split, regulatory plan, and pilot milestones
        - Only named partner proof is healthcare-adjacent and concentrated
        - Interview Nabla leadership and inspect agreements
      - - Compute plan
        - Budget, supplier commitments, training runs, inference-cost targets, and model efficiency
        - Compute intensity can consume runway and force dilution
        - Review board budget, cloud/GPU contracts, and sensitivity model
      - - Talent and governance
        - Key-person dependence, hiring plan, retention packages, and board controls
        - Founder-led labs can be fragile if hiring or governance slips
        - Interview leadership and inspect org plan
      - - Regulatory readiness
        - FDA/EU AI Act classification, safety case, audit logs, and quality management plan
        - Safety-critical use cases need compliance evidence before commercialization
        - Run regulatory counsel review and red-team plan
      - - Competitive moat
        - Data rights, partner exclusivity, model-evaluation differentiation, and open-source posture
        - NVIDIA and DeepMind can commoditize generic world-model tooling
        - Compare AMI benchmarks against Cosmos, Gemini Robotics, World Labs, and PI
      - - Exit path
        - Strategic acquirer map, revenue milestones, and IPO readiness prerequisites
        - Exit optionality is speculative without commercial proof
        - Map milestones to likely strategic buyers and public-market comps
    notes: Diligence asks focus on evidence that could move recommendation, confidence, or valuation stance.
    claimRefs:
      - CV040
      - CV041
