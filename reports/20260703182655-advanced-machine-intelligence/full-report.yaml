      - number: '8.5'
        title: Diligence Asks, Exit Readiness, and Thesis-break Triggers
        blocks:
          - type: paragraph
            body: >-
              The final diligence agenda should focus on evidence that can change the recommendation rather than on
              generic company quality. The must-have requests are financing terms, product proof, Nabla economics,
              compute commitments, regulatory readiness, proprietary data rights, and governance visibility. Exit
              readiness is low today because a credible IPO or large strategic acquisition story needs product, revenue,
              regulatory, or infrastructure-scale evidence that is not public for AMI. The thesis breaks if AMI raises
              above the current implied post-money valuation without product or customer proof, if Nabla remains a
              marketing-only relationship, if compute burn is opaque, or if NVIDIA, DeepMind, World Labs, Physical
              Intelligence, or open-source systems commoditize the layer before AMI builds proprietary data and
