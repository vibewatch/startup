        title: Direct AMI customer evidence remains pre-commercial
        blocks:
          - type: paragraph
            body: >-
              Public customer diligence should start with a negative finding: AMI does not yet disclose a paying
              customer base, customer count, ARR-bearing pilots, NRR, or contract terms. The strongest direct evidence
              is AMI’s own positioning as a research lab building world models for reliability-critical domains, plus
              Nabla’s exclusive first-access partnership. That makes Nabla strategically important, but it does not
              convert Nabla’s health-system customers into AMI customers. The likely AMI buyer is an enterprise or
              regulated operator that needs reliable prediction, planning, and simulation; in the healthcare wedge, the
              economic buyer would likely be Nabla or a health-system channel rather than an individual clinician. The
              diligence posture is therefore pre-commercial: segment the possible buyer, user, and payer groups, then
              require proof of AMI-specific production deployments before underwriting repeatability. Practically, this
              means every diligence exhibit in this chapter treats customer proof as a hierarchy: AMI official
              positioning at the base, Nabla strategic access above it, Nabla customer deployment proof in a separate
              channel-validation lane, and AMI direct production proof as still empty. That hierarchy prevents the
              report from converting partner momentum into unearned customer metrics.
