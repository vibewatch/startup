      - number: '2.5'
        title: Commercialization Constraints and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The market is attractive but gated. Bain and MIT Technology Review both caution that humanoid and
              physical-agent adoption remains early, staged, and limited by autonomy, dexterity, power, safety, and
              trust. Regulated or safety-critical workflows add another layer: EU AI Act obligations, FDA lifecycle
              oversight for adaptive medical software, NIST risk-management practices, and frontier-AI safety
              commitments all push buyers toward validation, monitoring, governance, and incident response. Compute
              intensity also matters because Epoch’s training-cost work and Sequoia’s $600B critique show that frontier
              model economics can outrun end-user revenue. The key diligence questions are therefore commercial, not
              just technical: what unit of value AMI will sell, who owns budget, how pilots will prove ROI, which
              benchmarks will be accepted by buyers, and whether safety evidence can be produced before competitors or
              incumbents commoditize the model layer.
