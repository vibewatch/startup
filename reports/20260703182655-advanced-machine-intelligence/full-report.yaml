        - AMI remains a high-quality research lab with strong investors but limited public customer evidence
        - Hold/track logic dominates; valuation should be marked by milestones rather than revenue multiples
        - TechCrunch says commercialization may take years and AMI has no revenue plans for now
        - Next round priced above current implied post-money without product or revenue proof
      - - Bear
        - Compute costs, regulatory friction, partner concentration, or platform commoditization outpace proof
        - Current price becomes vulnerable to flat/down-round pressure or heavy dilution despite strong team quality
        - Sequoia and Reuters bubble warnings plus Epoch compute-cost pressure are adverse signals
        - Open platforms or direct peers show better product traction before AMI
    notes: >-
      Scenarios use qualitative milestone logic because public evidence does not support invented AMI revenue forecasts
      or target returns.
