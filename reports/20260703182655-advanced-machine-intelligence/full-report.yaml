            body: >-
              AMI’s cost structure is likely to be dominated by compute, elite research talent, data curation,
              simulation, safety validation, and partner integration. This is an inference from AMI’s frontier
              world-model ambition and external cost benchmarks, not a disclosed burn model. Epoch shows frontier
              training costs rising rapidly; NVIDIA says physical-AI systems can require petabytes of video data and
              tens of thousands of compute hours; CloudZero reports wide H100 buy/rent ranges; and FDA/NIST materials
              show that healthcare and critical-infrastructure workflows add risk-management and validation work.
              Blackwell-style efficiency can lower cost per unit of inference, but it does not solve margin until AMI
