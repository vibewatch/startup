  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current Price and Recommendation
        blocks:
          - type: paragraph
            body: >-
              AMI should be treated as an exceptional research-company financing at an exceptional price, not as a
              conventional seed-stage software investment. The public record supports the round size, investor quality,
              and $3.5 billion pre-money valuation, but it does not support revenue multiple math because AMI has not
              disclosed revenue, ARR, pricing, gross margin, or paying customers. That gap matters more than normal
              because the implied post-money price is already roughly $4.5 billion while commercialization may take
              years. The resulting stance is track or research-more: continue diligence, preserve optionality if terms
              are protected, but do not underwrite a buy at the current headline price using public evidence alone. The
              practical IC question is therefore not whether AMI is impressive, but whether private terms and milestones
              compensate for buying so early.
            claimRefs:
