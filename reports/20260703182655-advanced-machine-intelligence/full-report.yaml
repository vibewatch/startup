      - number: '1.3'
        title: Capitalization, Investors, and Strategic Option Value
        blocks:
          - type: paragraph
            body: >-
              AMI’s $1.03B seed is the fact that makes the company investable and risky at the same time. Company,
              investor, and independent sources converge on about €890M/$1.03B raised at a $3.5B pre-money valuation,
              implying roughly $4.5B post-money before fees or any undisclosed structure. The round was co-led by Cathay
              Innovation, Greycroft, Hiro Capital, HV Capital, and Bezos Expeditions, while strategic and long-term
              backers include NVIDIA, Samsung, Temasek, Toyota Ventures, Sea, SBVA, and Alpha Intelligence Capital. That
              syndicate is more than capital: hardware, industrial, Asia, and healthcare adjacencies may become
              deployment paths if AMI proves the science. The adverse reading is that valuation now prices in a
              multi-year research breakthrough before AMI has revenue, audited accounts, or disclosed customers beyond
              Nabla. Sequoia’s AI-capex critique and Reuters-sourced comments on frothy AI valuations are not
              AMI-specific failures, but they are relevant guardrails for underwriting a billion-dollar seed round.
