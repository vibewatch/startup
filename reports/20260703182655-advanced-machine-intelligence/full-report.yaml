  - id: FE002
    title: Customer Workflow / Operating Flow
    type: flow
    layout: wide
    summary: >-
      The product workflow is partner-led: observe state, predict consequences, constrain action, then integrate into a
      human-reviewed workflow.
    data:
      nodes:
        - id: observe
          label: Observe multimodal state
          detail: Clinical, industrial, robot, wearable, or safety-critical signals.
        - id: encode
          label: Encode representation
          detail: Abstract unpredictable raw details into useful state embeddings.
        - id: predict
          label: Predict consequences
          detail: World model imagines how state changes under candidate actions.
        - id: guard
          label: Apply safety guardrails
          detail: Constrain plans with policy, validation, and human oversight.
        - id: integrate
          label: Integrate partner workflow
          detail: Nabla or other partner surfaces present recommended next steps.
        - id: measure
          label: Measure and monitor
          detail: Collect reliability, safety, compliance, and ROI evidence.
      edges:
        - from: observe
          to: encode
          label: sensor/workflow input
        - from: encode
          to: predict
          label: state embedding
        - from: predict
          to: guard
          label: candidate actions
        - from: guard
          to: integrate
          label: approved plan
        - from: integrate
          to: measure
          label: deployment evidence
        - from: measure
          to: observe
          label: feedback loop
    approximationNotes: Flow describes the likely customer workflow from sources; AMI has not published integration documentation.
    claimRefs:
