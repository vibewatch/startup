      - number: '8.3'
        title: Scenarios and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              Because public evidence lacks AMI financials, scenario analysis should avoid invented exit values or
              target returns. The useful exercise is price defensibility under milestones. In the bull case, AMI
              publishes product benchmarks, Nabla produces regulated workflow proof, and partner data or compute creates
              a scarce platform that could make the current price reasonable. In the base case, AMI remains a
              high-quality lab whose valuation should be held flat until product and customer evidence arrive. In the
              bear case, compute cost, regulatory friction, valuation-cycle compression, or open/corporate platforms
              outpace AMI’s proof and force a flat or down round. Entry discipline should therefore be structural:
              tranches, pro-rata rights, governance reporting, and a lower effective entry are more defensible than an
              unprotected markup.
