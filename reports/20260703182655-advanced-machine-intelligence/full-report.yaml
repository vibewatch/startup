      - number: '3.5'
        title: Adverse Evidence, Commoditization Risk, and Likely Entrants
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence is material. Bain argues humanoid deployment remains early and structured, with
              autonomy, dexterity, battery, certification, workforce acceptance, and trust gating scale. LeCun himself
              told MIT Technology Review that nobody knows how to make broadly useful robots yet and that major
              conceptual breakthroughs are still needed. Sequoia’s AI-infrastructure critique adds a second risk: if
              compute becomes commodity-like and end-user revenue lags capex, model vendors without workflow lock-in can
              face price pressure. Likely entrants are well positioned because NVIDIA controls physical-AI
              infrastructure, Google DeepMind controls frontier robotics research, Tesla controls robot
              hardware/manufacturing and proprietary data, and CAD/simulation incumbents such as Autodesk own workflow
              surfaces. AMI’s diligence burden is to prove that its world models are not merely another expensive
              research path into a commoditizing stack.
