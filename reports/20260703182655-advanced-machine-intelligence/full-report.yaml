      - number: '7.4'
        title: Partner, people, and competitor dependencies narrow the execution path
        blocks:
          - type: paragraph
            body: >-
              AMI has concentration risk at three levels. First, the only named early vertical path is Nabla, which is
              strategically valuable but creates dependency on one healthcare partner, one set of data-rights
              negotiations, and one pathway to clinical proof. Second, AMI is heavily person-linked: LeCun supplies the
              research credibility and LeBrun supplies the Nabla/operator bridge. The public story is therefore
              vulnerable to key-person availability, succession, and governance concerns. Third, the world-model field
              is no longer empty. World Labs, Google DeepMind, and NVIDIA publish adjacent spatial, robotics, and
              physical-AI efforts, and incumbents can combine compute, tooling, distribution, and customer relationships
              before AMI has public product evidence. The mitigation is not generic hiring; it is visible bench depth,
              non-Nabla design partners, documented partner terms, and proof that AMI can win a specific workflow
              against better-capitalized platforms.
