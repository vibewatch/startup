      - number: '1.4'
        title: Partners, Use Cases, and Commercialization Path
        blocks:
          - type: paragraph
            body: >-
              Nabla is the first concrete external validation point, but it should be classified as a strategic partner
              rather than recurring-revenue evidence. Nabla announced privileged or first access to AMI’s emerging world
              models and framed the collaboration around clinical workflows where LLMs struggle with hallucination,
              non-determinism, continuous signals, and auditable action. STAT adds a useful boundary: the companies were
              working closely together, but no formal equity or licensing agreement relationship had yet been disclosed.
              Beyond healthcare, AMI and independent coverage repeatedly name industrial process control, automation,
              wearable devices, robotics, autonomous driving, jet engines, power plants, and patient organs as target
              domains. Those examples show why world models could matter, but also why validation will be hard: the most
              valuable applications are safety-critical, regulated, and data-intensive. The commercialization path is
              therefore partnership-led experimentation first, not an immediate SaaS rollout.
