  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              AMI should be sized against the physical-AI and embodied-AI stack: models that learn from sensor streams,
              simulate consequences, plan actions, and support safe deployment into real-world systems. That boundary
              includes robotics foundation models, autonomous-vehicle and robot simulation, industrial
              digital-twin/model layers, healthcare-adjacent multimodal workflow intelligence, and safety tooling needed
              for regulated deployment. It excludes generic chat assistants, horizontal enterprise copilots,
              conventional robot hardware revenue, and full autonomous-vehicle fleet economics unless AMI is paid for
              the model layer. Status-quo substitutes are meaningful: manufacturers can continue with PLC/MES/SCADA
              automation, classical computer vision, systems integrators, task-specific robots, internal data-science
              teams, or vendor-specific simulation stacks. The chapter therefore treats broad embodied-AI market numbers
              as upper-bound context, then narrows to software/model-layer opportunities where AMI could plausibly sell
              APIs, models, licensing, or co-development rights.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
