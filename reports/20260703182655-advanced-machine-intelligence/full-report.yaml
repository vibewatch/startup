  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Substitution Map
        blocks:
          - type: paragraph
            body: >-
              AMI competes in a crowded physical-AI stack rather than a single neatly bounded software category. The
              closest direct peers are world-model and spatial-intelligence labs such as World Labs and Google DeepMind
              Genie 2, plus robot-policy labs such as Physical Intelligence, Skild AI, Figure, and Covariant that are
              trying to turn multimodal perception into actions. Enabling platforms are just as important: NVIDIA Cosmos
              and Hugging Face LeRobot give developers model, dataset, simulation, and policy tooling that can reduce
              the need for a proprietary AMI layer. Vertical embodied-AI companies such as Wayve and Tesla are
              substitutes when buyers prefer full-stack autonomy or internal build over licensing a model vendor. The
              practical landscape is therefore direct competitors, enabling platforms, substitutes/internal build,
              status quo automation, and likely entrants with compute, data, or workflow control.
            claimRefs:
