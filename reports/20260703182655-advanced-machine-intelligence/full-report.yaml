  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The decision chain converts strong frontier-lab quality and weak public economics into a track/research-more
      stance.
    data:
      nodes:
        - id: quality
          label: Founder / investor quality
          detail: LeCun-led lab with strategic backers and large seed capital.
        - id: market
          label: Large frontier market
          detail: World-model, embodied-AI, and physical-AI comps show capital appetite.
        - id: proofgap
          label: Product and revenue gap
          detail: No public AMI ARR, pricing, SKU, or customer contract.
        - id: costrisk
          label: Compute and capex risk
          detail: Frontier-AI economics require large spend before revenue clarity.
        - id: regpartner
          label: Regulatory and partner concentration
          detail: Nabla is valuable but healthcare compliance and economics are unresolved.
        - id: valuation
          label: Expensive current price
          detail: About $4.5B implied post-money for a seed-stage lab.
        - id: decision
          label: Track / research-more
          detail: Proceed only with protected terms or milestone evidence.
      edges:
        - from: quality
          to: market
          label: supports upside
        - from: market
          to: valuation
          label: sets possible frontier premium
        - from: proofgap
          to: valuation
          label: weakens price support
        - from: costrisk
          to: valuation
          label: raises dilution risk
        - from: regpartner
          to: valuation
          label: adds execution gates
        - from: valuation
          to: decision
          label: drives discipline
    approximationNotes: Qualitative decision flow; edge direction reflects investment logic rather than causation proof.
    claimRefs:
