        title: Retention, expansion, and concentration are underwritten as gaps
        blocks:
          - type: paragraph
            body: >-
              There is useful evidence of Nabla adoption durability, such as McFarland’s pilot retention rate and
              health-system expansion stories, but AMI-specific retention is completely undisclosed. A buyer should not
              infer AMI renewal behavior from Nabla’s ambient-assistant metrics because AMI technology is still
              described as emerging world-model architecture. The early concentration picture is also unusually binary:
              Nabla is the only named first-access partner, so strategic validation and channel learning are
              concentrated in one relationship whose formal licensing economics are not yet public. Upside would come
              from Nabla moving beyond notes into coding, EHR commands, and agentic workflows, but the evidence package
              still needs AMI-specific pilots, deployment milestones, pricing, renewal terms, and expansion economics.
              For underwriting, this changes the diligence burden from “how sticky is the product?” to “what product,
              used by whom, under what agreement, and with what renewal clock?” Until those answers are available,
              retention tables should show null for AMI even when Nabla has useful satisfaction or pilot-retention
              indicators.
