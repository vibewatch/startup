      - number: '7.3'
        title: Operational risk concentrates in reliability, compute, and undisclosed controls
        blocks:
          - type: paragraph
            body: >-
              AMI’s technical promise is also its operational burden. A world model intended for healthcare, robotics,
              or industrial control must do more than generate plausible outputs; it must support testing, monitoring,
              auditability, change control, fallback behavior, and incident response. External materials show why this
              is expensive: Epoch estimates frontier training cost escalation, NVIDIA describes physical-AI workloads
              requiring petabytes of video and large compute-hour budgets, and Sequoia warns that infrastructure spend
              must be justified by real revenue. The security and privacy story is not yet public. AMI may ultimately
              build strong controls, but no retained source discloses clinical data governance, model logging, red-team
              results, access control, or breach-response posture. That makes operational quality a gating risk rather
              than a post-close enhancement item, especially because regulated customers will demand evidence before
              production autonomy.
