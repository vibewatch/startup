      - number: '1.2'
        title: Leadership, Governance, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >-
              The leadership bench is unusually credible for a company this young, but the public evidence also
              concentrates the story around a small number of individuals. AMI says Yann LeCun chairs the company,
              Alexandre LeBrun is CEO, Laurent Solly is COO, Saining Xie is chief science officer, Pascale Fung is chief
              research and innovation officer, and Michael Rabbat leads world models. That mix combines LeCun’s
              JEPA/world-model thesis, LeBrun’s prior company-building through Wit.ai and Nabla, and multiple
              Meta/FAIR-linked research and operating profiles. Governance certainty is thinner than talent certainty:
              sources vary between executive and non-executive chairman wording for LeCun, and no public board,
              voting-control, or investor-rights schedule has surfaced. Later chapters should therefore use this
              chapter’s role table as a named-leader map, not as proof of full governance depth. The highest diligence
              priority is whether the company can institutionalize decision-making beyond LeCun’s scientific authority
              and LeBrun’s operator role.
