      - number: '8.2'
        title: Investment Thesis and Anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is that world models become a new physical-AI frontier stack and AMI wins enough
              talent, compute, partner data, and safety credibility to define that layer. That view is not fanciful: AMI
              has strategic backers, World Labs and Physical Intelligence show investor appetite for adjacent
              world-model and robot-foundation-model bets, and NVIDIA and DeepMind have validated physical AI as a major
              technical direction. The anti-thesis is equally important. The same attention can turn world models into a
              fundraising label before buyers see durable product value. AMI’s first named partner, Nabla, is useful
              validation, but public evidence does not yet disclose contract economics, data rights, FDA pathway
              ownership, or customer conversion. The thesis is therefore credible but not yet underwritable at the
              reported price, especially while outside coverage frames the round as a premium on elite researchers
              before revenue.
            claimRefs:
