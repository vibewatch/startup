            body: >-
              AMI has not disclosed public revenue, ARR, customer count, list pricing, or a generally available product.
              The clearest facts are the mission, the $1.03B seed, and a partner-led commercialization path: AMI says it
              is building world models for safety-critical real-world domains, while Nabla says it has first access to
              emerging AMI technology for healthcare. That evidence supports revenue-model hypotheses, not revenue
              recognition. The plausible future streams are enterprise model licenses, API access, co-development fees,
              vertical deployments, healthcare partner economics, and possibly strategic research contracts. None can be
              treated as booked revenue without contracts, usage, pricing, invoicing, and renewal data. The diligence
              posture is therefore explicit: use null for current revenue metrics, classify Nabla as a partner signal,
