- id: sizing-lenses-and-reconciliation
  title: Sizing Lenses and Reconciliation
  body: 'The evidence supports multiple sizing lenses rather than a single TAM. MarketsandMarkets estimates embodied AI at
    $4.44B in 2025 and $23.06B in 2030, but its product boundary includes robots, exoskeletons, autonomous systems, and smart
    appliances, so it is much broader than AMI’s likely monetizable layer. IFR’s 2025 World Robotics page shows strong physical
    automation demand in units—542,000 industrial robot installations in 2024 and almost 200,000 professional service robots
    sold—but that is not a software revenue pool. Deloitte’s smart-manufacturing survey shows buyer readiness for AI, data,
    sensors, and automation, yet also implies that adoption is embedded inside larger transformation programs. The reconciled
    market view is therefore: a large and growing physical systems context, a mid-sized embodied-AI market estimate, and a
    much smaller software/world-model SAM that must be proved by pilots and pricing.'
