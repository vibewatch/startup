  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: Direct analyst or buyer evidence separating embodied-AI software/model-layer revenue from hardware, robot
      systems, and autonomous-vehicle platform spend.
    whyItMatters: Without this split, AMI’s underwritable SAM could be overstated by importing hardware-heavy TAM estimates.
    diligencePath: Interview market analysts and 8-10 prospective buyers to estimate software/model budget share by segment,
      then reconcile with AMI pricing.
    relatedQuestionRefs:
    - QM019
    - QM026
    relatedTableRefs:
    - TM002
    - TM005
  - type: private-evidence-only
    severity: material
    topic: commercialization
    missingEvidence: AMI pilot contracts, pricing, milestones, data rights, and conversion terms for Nabla or any industrial/robotics
      partners.
    whyItMatters: Strategic interest does not prove recurring revenue, gross margin, or budget ownership.
    diligencePath: Request customer pipeline, signed pilot statements of work, renewal triggers, and expansion rights; verify
      with counterparties.
    relatedQuestionRefs:
    - QM020
    - QM021
    relatedTableRefs:
    - TM003
    - TM005
  - type: missing-source
    severity: material
    topic: benchmarks
    missingEvidence: A buyer-accepted benchmark suite comparing AMI world models against Cosmos, Gemini Robotics, π0, Helix,
      LeRobot baselines, and status-quo automation.
    whyItMatters: Without comparable benchmarks, technical claims cannot be translated into ROI, reliability, or safety acceptance.
    diligencePath: Define task-specific benchmarks with industrial, robotics, mobility, and healthcare-adjacent pilots; require
      third-party evaluation where safety-critical.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM004
    - TM005
  - type: missing-source
    severity: material
    topic: regulatory-classification
    missingEvidence: Use-case-level legal analysis classifying AMI deployments under EU AI Act, FDA SaMD/SiMD pathways, customer
      safety standards, and frontier-model governance expectations.
    whyItMatters: Regulatory classification can alter deployment timing, validation cost, documentation burden, and liability
      allocation.
    diligencePath: Commission counsel and quality/regulatory experts to map initial target workflows to obligations and evidence
      requirements.
    relatedQuestionRefs:
    - QM015
    relatedTableRefs:
    - TM005
