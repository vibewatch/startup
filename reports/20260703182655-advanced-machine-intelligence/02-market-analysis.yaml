- id: buyer-user-payer-segmentation
  title: Buyer, User, and Payer Segmentation
  body: The buyer map is fragmented because AMI’s product is not yet a packaged application. In manufacturing and logistics,
    the economic buyer is typically an operations, manufacturing, or automation leader who owns throughput, uptime, safety,
    and labor-productivity targets; robotics engineers and system integrators become the technical users. In robotics and
    AV companies, the buyer may be the robotics engineering, simulation, or autonomy platform organization that needs better
    data curation, synthetic scenarios, model evaluation, and cross-embodiment generalization. In healthcare-adjacent workflows,
    clinical-platform leaders and risk/compliance teams matter because the value case turns on auditability and safe action,
    not merely model accuracy. Strategic innovation teams and corporate venture groups can fund early pilots, but they are
    not enough to prove repeatable budget ownership unless the pilot converts into operational, clinical, or engineering spend.
  claimRefs:
