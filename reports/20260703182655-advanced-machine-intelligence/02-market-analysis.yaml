- id: TM005
  title: Sizing and Adoption Diligence Gaps
  columns:
  - Gap
  - Why it matters
  - Current evidence
  - Risk to valuation
  - Next diligence step
  rows:
  - - AMI pricing unit is undisclosed
    - Cannot convert technical promise into ARR, gross margin, or market share.
    - Public materials describe mission and partnership, not packaging.
    - High
    - Request model-access, licensing, services, and co-development pricing assumptions.
  - - Narrow model-layer SAM is not directly published
    - Broad embodied-AI estimates include hardware and whole systems.
    - Derived 10%-30% SAM lens is an analytical assumption.
    - High
    - Interview analyst sources and buyers to estimate software/model share by workflow.
  - - Pilot-to-production conversion is unproven
    - Enterprise buyers need uptime, safety, integration, and ROI evidence.
    - Nabla is a strategic validation point, not disclosed revenue proof.
    - High
    - Review pilot contracts, milestones, success metrics, and expansion rights.
  - - Benchmark acceptance is immature
    - World-model and VLA papers show progress but not standard buyer-grade benchmarks.
    - Competitors publish demos, papers, or previews with different metrics.
    - Medium
    - Define benchmark suite across industrial, robotics, and healthcare-adjacent tasks.
  - - Regulatory classification by use case is unresolved
    - Healthcare, safety, and frontier AI obligations could alter time-to-market.
    - EU AI Act, FDA SaMD, NIST, and UK safety commitments impose governance expectations.
    - Medium
    - Obtain legal memo mapping target workflows to obligations and validation costs.
  notes: This table intentionally preserves material gaps rather than forcing a single TAM/SAM/SOM. Unknowns should remain
    open until AMI discloses pricing, pilots, and target verticals.
