- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Industrial robot deployment base
    - Driver
    - Current through 2028
    - Installed automation creates data and integration surfaces for better models.
    - Verify which robot/OEM stacks AMI can integrate with.
  - - Labor shortages and productivity pressure
    - Driver
    - Current
    - Manufacturers and service operators need automation, but only where ROI is measurable.
    - Quantify customer payback thresholds by workflow.
  - - Simulation and synthetic data
    - Driver
    - Current
    - World models may lower cost of data curation, edge-case generation, and evaluation.
    - Obtain AMI pilot evidence comparing real-data and synthetic-data performance.
  - - Multimodal foundation-model progress
    - Driver
    - Current
    - VLA/world-model systems are moving from lab proof toward partner previews and open tooling.
    - Benchmark AMI against Cosmos, Gemini Robotics, π0, Helix, and open-source baselines.
  - - Regulation and safety governance
    - Constraint
    - Current and increasing
    - Safety-critical deployments require risk management, monitoring, transparency, and change control.
    - Map AMI target uses against EU AI Act, FDA, and buyer governance obligations.
  - - Compute and data intensity
    - Constraint
    - Current
    - Training and customization costs may force high pricing or strategic partnerships.
    - Request compute budget, data rights, model efficiency, and gross-margin plan.
  - - Integration with existing automation stacks
    - Constraint
    - Current
    - Buyers will not rip out trusted OT systems for a research model without adapters and support.
    - Validate integrations, uptime SLAs, cybersecurity model, and system-integrator channel.
  - - Immature benchmarks and ROI proof
    - Constraint
    - Near-term
    - Generic demos do not prove value in regulated or high-variance operations.
    - Require task-specific pilots with baseline, safety, cost, and deployment metrics.
  notes: Directions are author classifications from cited evidence. Timing reflects whether the factor is already visible
    in public sources or still dependent on future deployment waves.
