- id: growth-drivers
  title: Growth Drivers
  body: 'The strongest market drivers are not generic AI enthusiasm; they are physical-economy constraints that make better
    perception, simulation, and action models valuable. Industrial robot installations have remained above 500,000 units for
    four consecutive years, China continues to pull automation demand forward, and professional service robot categories such
    as logistics and medical robots are expanding. Manufacturers report smart-manufacturing benefits in output, productivity,
    and capacity, while also prioritizing process automation, sensors, vision systems, data analytics, and AI. Foundation-model
    progress is another driver: NVIDIA Cosmos, Gemini Robotics, Genie 2, π0, Helix, and open tooling such as LeRobot all point
    to a market moving from hand-programmed robots toward data-driven policies, synthetic environments, and multimodal action
    models. Those technical shifts make AMI’s world-model thesis timely if it can turn research outputs into enterprise-grade
    integration points.'
