- id: TM001
  title: Market Definition Table
  columns:
  - Segment / category
  - Included spend for AMI thesis
  - Excluded spend
  - Primary buyer / payer
  - Relevance
  rows:
  - - Robotics foundation-model layer
    - World models, VLA policies, synthetic data, evaluation, fine-tuning, safety guardrails
    - Robot hardware, actuators, batteries, installation services
    - Robotics CTO, autonomy lead, robotics engineering VP
    - Closest category to AMI if it sells model licenses or co-development.
  - - Industrial automation intelligence
    - Sensor fusion, anomaly prediction, digital-twin reasoning, safe planning for factories and plants
    - PLC/MES/SCADA license revenue and full systems-integration labor
    - COO, plant manager, automation director
    - Large budgets exist, but integration and uptime proof are mandatory.
  - - Autonomous mobility / AV toolchain
    - World models for scenarios, simulation, evaluation, fleet-learning assistance
    - Vehicle manufacturing, ride-hailing fleet revenue, insurance, maps hardware
    - Autonomy platform leader, OEM software buyer
    - Relevant through simulation and planning, not full AV TAM.
  - - Healthcare-adjacent multimodal workflows
    - Auditable models for clinical workflow context, monitoring, documentation, and future embodied care support
    - Reimbursement for care delivery, hospital hardware, unrelated clinical SaaS
    - Clinical platform leader, compliance officer, provider operations
    - Nabla shows a path, but regulation and liability slow adoption.
  - - Strategic research and innovation
    - Paid pilots, joint research, strategic licensing, investor-backed proof-of-concepts
    - Undisclosed internal R&D without paid rights
    - Corporate venture, innovation, AI lab leadership
    - Useful entry wedge but weak evidence of repeatable revenue.
  - - Generic AI software / copilots
    - None unless tied to physical sensing, simulation, or safe action
    - Horizontal chatbots, office copilots, content generation, CRM copilots
    - CIO / business-app owner
    - Excluded from AMI market because buyer job and validation burden differ.
  notes: Boundary table separates AMI’s likely monetizable software/model layer from broader physical systems and generic
    AI software; excluded spend is not counted in the narrowed SAM.
