  - id: TI005
    title: Public Financial Gaps Table
    columns:
      - Gap
      - Impact on underwriting
      - Severity
      - Exact diligence path
    rows:
      - - ARR / recognized revenue
        - Cannot evaluate revenue quality, growth, retention, or valuation multiples
        - blocking
        - Request ARR, bookings, invoices, deferred revenue, and revenue-recognition policy.
      - - Pricing / realized contract terms
        - Cannot estimate ACV, discounting, gross margin, or customer willingness to pay
        - blocking
        - Request price book, signed contracts, pilot SOWs, and discount approvals.
      - - Cash, burn, and runway
        - Cannot judge capital adequacy or next financing dependency
        - blocking
        - Request cash ledger, monthly P&L, forecast, and board-approved budget.
      - - Compute commitments
        - Cannot assess cost floor, capex/opex mix, or downside burn case
        - material
        - Request cloud MSAs, GPU reservations, hardware capex, utilization, and credits.
      - - Nabla economics and data rights
        - Cannot convert partner signal into AMI revenue or moat evidence
        - blocking
        - Review agreement, exclusivity, data-rights, minimums, and revenue-share terms.
      - - Customer count / pipeline
        - Cannot separate market interest from repeatable demand
        - material
        - Request CRM pipeline, customer references, conversion funnel, and churn expectations.
      - - Safety / regulatory validation budget
        - Cannot price healthcare or critical-infrastructure launch requirements
        - material
        - Request regulatory map, quality system, validation test plan, and liability allocation.
      - - Headcount and compensation
        - Cannot separate R&D ambition from payroll burn
        - material
        - Request org chart, filled/headcount plan, compensation bands, and hiring commitments.
      - - Next-round milestone trigger
        - Cannot know whether the seed covers the next value-inflection point
        - blocking
        - Request financing plan tied to technical, safety, partner, and commercial milestones.
    notes: This table is the diligence workplan for replacing nulls with auditable private metrics.
