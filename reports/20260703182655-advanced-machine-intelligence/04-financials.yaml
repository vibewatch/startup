  - id: TI004
    title: Capital Adequacy Table
    columns:
      - Capital item
      - Public value / status
      - Confidence
      - Interpretation
      - Diligence ask
    rows:
      - - Latest round
        - USD 1.03B / about EUR 890M seed
        - high
        - Large enough to fund substantial research, compute, and hiring runway if burn is controlled
        - Verify gross vs net proceeds, closing mechanics, and cash received.
      - - Reported valuation
        - USD 3.5B pre-money; about USD 4.53B implied post-money before structure
        - medium
        - Valuation prices in future breakthroughs before public revenue metrics
        - Review cap table, liquidation preferences, option pool, and secondary components.
      - - Cash on hand
        - 'null'
        - low
        - Round size is known; current cash after spend is not
        - Request treasury report and post-close cash reconciliation.
      - - Monthly burn
        - 'null'
        - low
        - Compute and elite talent could make burn materially higher than normal seed-stage SaaS
        - Request monthly P&L, cash-flow statement, payroll, and cloud invoices.
      - - Runway months
        - 'null'
        - low
        - Cannot calculate without current cash and burn
        - Calculate after cash and burn are verified.
      - - Planned use of funds
        - long-term research, global hiring, reliable systems, compute-heavy development
        - medium
        - Use of funds is R&D weighted, not a near-term sales scale-up plan
        - Request board budget by workstream and milestone.
      - - Next-round trigger
        - 'null'
        - low
        - No public milestone plan links future financing to revenue or technical gates
        - Request milestone model and financing sensitivity plan.
      - - Debt / project-finance obligations
        - no public disclosure found
        - medium
        - No evidence of debt is not proof of no commitments
        - Request debt, cloud, GPU, lease, and data-center obligation schedule.
      - - Compute cost exposure
        - material but unquantified
        - medium
        - External sources show training, data, GPU, and TCO costs can be large
        - Request committed GPU/cloud spend and model-training roadmap.
    notes: Runway and burn remain null because estimating them from the seed amount would invent private data.
