  - id: TI006
    title: Cost Driver and Gross-Margin Bridge Table
    columns:
      - Cost driver
      - Evidence base
      - Likely P&L line
      - Margin implication
      - Diligence metric
    rows:
      - - Training compute
        - Epoch frontier-cost growth; AMI world-model ambition
        - R&D and potentially capitalized model development
        - Can consume seed capital before revenue if large training runs precede pilots
        - Cost per experiment, final-run budget, and training roadmap.
      - - Inference compute
        - NVIDIA efficiency claims; CloudZero H100 buy/rent ranges
        - COGS when customer usage begins
        - Could compress gross margin if pricing does not pass through GPU-hours
        - GPU-hour per workflow, utilization, reservation discounts, and pass-through terms.
      - - Sensor/video data and curation
        - NVIDIA Cosmos notes physical AI data/testing intensity
        - R&D, COGS, or partner data expense
        - Can create labor/data rights costs not visible in GPU-only estimates
        - Dataset volume, rights, labeling cost, simulation cost, and refresh cadence.
      - - Elite AI talent
        - Investor use-of-funds references global hiring
        - R&D and G&A
        - Raises fixed burn before revenue
        - Filled headcount, compensation mix, and hiring plan by quarter.
      - - Safety and validation
        - Nabla FDA-certifiable language; FDA/NIST risk-management context
        - R&D, quality, legal, and implementation services
        - May delay recognition and require expensive customer-specific validation
        - Validation budget, regulatory pathway, QMS staffing, and liability allocation.
      - - Partner integration and support
        - Nabla first-access path and corporate-partner timing
        - Services, customer success, and solution engineering
        - Early pilots may have lower margin until standardized product packaging emerges
        - Implementation hours, SOW margin, support SLA, and renewal conversion.
    notes: Cost drivers are qualitative because AMI has not disclosed workload telemetry, headcount, or contracts.
    claimRefs:
