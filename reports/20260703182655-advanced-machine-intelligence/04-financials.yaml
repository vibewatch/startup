artifact: financials
slug: advanced-machine-intelligence
runDate: '2026-07-03'
company:
  name: Advanced Machine Intelligence
chapter:
  number: 4
  title: Financials
  summary: >-
    AMI is best underwritten as a pre-revenue, pre-product frontier-AI research company with a very large seed round
    rather than as a commercial software vendor. Public evidence supports the $1.03B financing, strategic partner access
    through Nabla, and compute-heavy long-horizon R&D, but it does not disclose ARR, pricing, burn, runway, gross
    margin, or paying customers.
sections:
  - id: revenue-model-and-disclosure-gap
    title: Revenue Model and Disclosure Gap
    body: >-
      AMI has not disclosed public revenue, ARR, customer count, list pricing, or a generally available product. The
      clearest facts are the mission, the $1.03B seed, and a partner-led commercialization path: AMI says it is building
      world models for safety-critical real-world domains, while Nabla says it has first access to emerging AMI
      technology for healthcare. That evidence supports revenue-model hypotheses, not revenue recognition. The plausible
      future streams are enterprise model licenses, API access, co-development fees, vertical deployments, healthcare
      partner economics, and possibly strategic research contracts. None can be treated as booked revenue without
      contracts, usage, pricing, invoicing, and renewal data. The diligence posture is therefore explicit: use null for
      current revenue metrics, classify Nabla as a partner signal, and require a management financial package before
      underwriting repeatability.
    claimRefs:
      - CI001
      - CI006
      - CI007
      - CI008
      - CI009
      - CI014
      - CI015
      - CI039
      - CI046
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: gtm-and-sales-efficiency-proxies
    title: GTM and Sales-Efficiency Proxies
    body: >-
      The public go-to-market evidence is thin but directionally consistent. AMI and independent coverage point to
      research first, partner discussions over the next six to twelve months, and Nabla as first-access healthcare
      partner. That is not enough to calculate CAC, payback, quota productivity, sales cycle, pipeline conversion,
      channel margin, or customer concentration. The best proxy is qualitative: AMI is likely to start with strategic
      partners and regulated or industrial pilots where technical validation precedes line-of-business budget ownership.
      This can be valuable if it converts to high-value licenses, but it is also slow and services-heavy. Until AMI
      discloses signed pilot terms, conversion rates, and economic buyer ownership, sales efficiency should be marked
      unavailable rather than benchmarked against SaaS norms.
    claimRefs:
      - CI005
      - CI006
      - CI012
      - CI013
      - CI016
      - CI038
      - CI042
    tableRefs:
      - TI003
    figureRefs: []
  - id: cost-structure-and-margin-drivers
    title: Cost Structure and Gross-Margin Drivers
    body: >-
      AMI’s cost structure is likely to be dominated by compute, elite research talent, data curation, simulation,
      safety validation, and partner integration. This is an inference from AMI’s frontier world-model ambition and
      external cost benchmarks, not a disclosed burn model. Epoch shows frontier training costs rising rapidly; NVIDIA
      says physical-AI systems can require petabytes of video data and tens of thousands of compute hours; CloudZero
      reports wide H100 buy/rent ranges; and FDA/NIST materials show that healthcare and critical-infrastructure
      workflows add risk-management and validation work. Blackwell-style efficiency can lower cost per unit of
      inference, but it does not solve margin until AMI proves workload mix, utilization, pricing power, and contracted
      revenue. Gross margin should therefore remain null, with the cost-driver map used only as a diligence guide.
    claimRefs:
      - CI017
      - CI018
      - CI019
      - CI020
      - CI021
      - CI022
      - CI023
      - CI024
      - CI040
      - CI041
      - CI043
    tableRefs:
      - TI006
    figureRefs:
      - FI002
      - FI003
  - id: capital-adequacy-and-financing-dependency
    title: Capital Adequacy and Financing Dependency
    body: >-
      The large seed round buys time and strategic option value, but it does not by itself prove capital adequacy. The
      source-backed facts are the $1.03B round, the reported $3.5B pre-money valuation, and investor statements that the
      money supports long-term research, global hiring, and reliable intelligent-system development. The unsupported
      items are the ones needed for an actual runway view: cash received net of fees, cash already spent, monthly burn,
      committed compute, debt, GPU purchases, office footprint, headcount, and next-round milestones. Because public
      sources show a high-compute R&D plan and no current revenue metrics, AMI remains financing-dependent until partner
      pilots become contracted economics or the company shows it can fund the research roadmap within the seed proceeds.
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI025
      - CI026
      - CI031
      - CI032
      - CI036
      - CI037
      - CI045
      - CI047
      - CI048
    tableRefs:
      - TI004
    figureRefs: []
  - id: financial-verdict-and-diligence-blockers
    title: Financial Verdict and Diligence Blockers
    body: >-
      The financial verdict is research-more, not because AMI lacks capital, but because the financial statement needed
      for underwriting is mostly absent. The positive case is unusually strong seed financing, elite investors, and a
      partner-led healthcare wedge. The adverse case is just as concrete: Sequoia questions whether AI infrastructure
      spending is matched by end-user revenue, Le Monde Informatique says AMI lacks an operational system, and Silicon
      Republic flags a multibillion-dollar valuation for a company established this year. Those critiques matter because
      AMI’s prospective cost base is compute-heavy and validation-heavy. The blocking diligence path is specific: obtain
      contracts, price book, ARR/bookings, cash and burn, compute commitments, validation budget, data rights, and board
      milestones. Until then, every revenue and runway field should remain undisclosed rather than estimated.
    claimRefs:
      - CI027
      - CI028
      - CI029
      - CI030
      - CI044
      - CI049
      - CI050
    tableRefs:
      - TI005
    figureRefs: []
tables:
  - id: TI001
    title: Revenue Streams Table
    columns:
      - Potential stream
      - Mechanism
      - Unit / recognition issue
      - Current public value / status
      - Revenue quality
      - Diligence ask
    rows:
      - - World-model enterprise license
        - License AMI models or weights to industrial, robotics, healthcare, or automation partners
        - Annual or multi-year license; recognition depends on access, updates, and support obligations
        - Undisclosed; no public license contract surfaced
        - Hypothesis only
        - Request signed contracts, price book, term sheets, and recognition memo.
      - - API / usage-based access
        - Expose inference, simulation, planning, or evaluation endpoints to developers or partners
        - Usage, seats, tokens, environments, or compute-hours; COGS tied to inference and validation
        - No public AMI API or price list found
        - Hypothesis only
        - Inspect product roadmap, API telemetry, unit cost, uptime SLA, and planned pricing.
      - - Nabla / healthcare partner economics
        - First-access healthcare commercialization through Nabla’s clinical AI channel
        - Could be license, royalty, transfer price, or embedded partner revenue
        - Nabla access disclosed; economics undisclosed
        - Strategic proof, not revenue proof
        - Review Nabla agreement, data-rights schedule, minimums, and revenue-share terms.
      - - Vertical co-development / pilots
        - Paid pilots or co-development with industrial, robotics, autonomy, or healthcare partners
        - Milestone fees or services revenue; may be low margin if bespoke
        - Corporate discussions reported but no pilot economics disclosed
        - Possible bridge to revenue
        - Request pipeline, SOWs, invoices, pilot conversion history, and customer ROI evidence.
      - - Open publications / open source
        - Recruiting, ecosystem, benchmark, or adoption flywheel rather than direct monetization
        - Usually indirect; monetization requires hosted service, support, or enterprise rights
        - AMI mentions open publications and open source but no paid support product
        - Distribution option, not revenue
        - Separate open-research strategy from monetizable enterprise packaging.
    notes: Rows distinguish disclosed facts from hypotheses; null or undisclosed means no public value, not zero revenue.
    claimRefs:
      - CI001
      - CI006
      - CI007
      - CI014
      - CI015
      - CI035
      - CI042
      - CI046
  - id: TI002
    title: Pricing / Monetization Table
    columns:
      - Pricing item
      - Public value
      - Source-backed status
      - Why it matters
      - Diligence path
    rows:
      - - AMI list price
        - 'null'
        - No public pricing page, API tariff, or SKU found on official AMI pages
        - List pricing is required before estimating ACV, discounting, or gross margin
        - Request current and planned price book.
      - - Nabla license or revenue share
        - 'null'
        - First access is disclosed; fees, minimums, royalties, and transfer pricing are not
        - Only named partner signal cannot be converted to ARR without economics
        - Review executed AMI-Nabla agreements.
      - - API usage metric
        - 'null'
        - No public endpoint, token, simulation-hour, environment, or seat unit disclosed
        - Usage unit determines COGS pass-through and margin volatility
        - Obtain API design, unit-cost model, and price-testing evidence.
      - - Enterprise model license
        - 'null'
        - Revenue model is a hypothesis derived from partner/product language
        - License structure affects recognition, support burden, and renewal quality
        - Ask for template MSA, license scope, support SLA, and renewal assumptions.
      - - Pilot / co-development fee
        - 'null'
        - Corporate-partner discussions may start, but pilot fee evidence is absent
        - Services-like pilots can look like revenue while masking poor repeatability
        - Request pipeline, SOWs, delivery staffing, and conversion metrics.
      - - Outcome or workflow pricing
        - 'null'
        - Healthcare workflow value proposition exists; price formula not public
        - Outcome pricing would require clinical risk allocation and validation evidence
        - Review payer/provider economics and regulatory claims substantiation.
    notes: All pricing values are intentionally null because no source disclosed AMI list or realized pricing.
    claimRefs:
      - CI008
      - CI014
      - CI015
      - CI016
      - CI022
      - CI024
      - CI042
  - id: TI003
    title: Unit Economics Proxy Table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Revenue / ARR
        - 'null'
        - medium
        - No public revenue baseline exists for CAC payback, NRR, or margin math
        - Request ARR, bookings, recognized revenue, deferred revenue, and invoices.
      - - Paying customers
        - 'null'
        - medium
        - Nabla is a strategic partner signal, not disclosed paid customer count
        - Request customer list, signed contracts, and customer concentration schedule.
      - - CAC / payback
        - 'null'
        - low
        - No sales motion, pipeline conversion, quota capacity, or channel economics disclosed
        - Request CRM export and sales-efficiency dashboard.
      - - Gross margin
        - 'null'
        - low
        - Compute, validation, support, and pricing are all undisclosed
        - Build margin bridge from workload telemetry and contract pricing.
      - - Training compute COGS / R&D
        - undisclosed; external frontier costs rising
        - medium
        - Frontier training can dominate burn before revenue
        - Request training roadmap, experiment budget, and model-accounting policy.
      - - Inference compute COGS
        - undisclosed; GPU cloud/buy ranges observable externally
        - medium
        - Unit margin depends on utilization and cost pass-through
        - Request inference telemetry, GPU-hour cost, reservation terms, and utilization.
      - - Data curation / testing
        - undisclosed; physical AI requires extensive data and testing
        - medium
        - Sensor/video workflows can create labor and infrastructure cost beyond GPUs
        - Request dataset rights, labeling budget, simulation spend, and test plan.
      - - Safety / validation cost
        - undisclosed; FDA/NIST risk workstreams relevant
        - medium
        - Healthcare and critical infrastructure can delay revenue and raise service costs
        - Request validation budget, quality-management plan, and regulatory mapping.
      - - Debt / project finance
        - no public disclosure
        - medium
        - Committed obligations could shorten runway despite large seed proceeds
        - Request debt schedule, cloud commitments, and capex authorizations.
    notes: >-
      Proxy table deliberately keeps private metrics null and uses external cost context only to identify diligence
      drivers.
