callouts:
  - calloutType: risk
    title: Pre-revenue disclosure gap
    body: >-
      AMI’s public financial profile contains funding and valuation facts, but no ARR, pricing, customer count, burn,
      runway, or gross-margin evidence.
    claimRefs:
