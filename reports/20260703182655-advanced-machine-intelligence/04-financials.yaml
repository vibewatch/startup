figures:
  - id: FI001
    title: Revenue Model Bridge
    type: flow
    layout: wide
    summary: AMI’s current public path runs from research assets to partner validation before any disclosed revenue mechanism.
    data:
      nodes:
        - id: research
          label: World-model R&D
          detail: Seed-funded research into sensor-based representations and planning.
        - id: partner-access
          label: Partner access
          detail: Nabla receives first access; other industry partners are implied but undisclosed.
        - id: validation
          label: Safety / workflow validation
          detail: Healthcare and physical-world domains require evidence before production.
        - id: packaging
          label: Packaging choice
          detail: License, API, co-development, or embedded partner economics.
        - id: contracting
          label: Contracted economics
          detail: Price, minimums, revenue share, support, and recognition terms must be signed.
        - id: gross-profit
          label: Gross profit
          detail: Only after revenue exceeds compute, data, validation, and support cost.
      edges:
        - from: research
          to: partner-access
          label: technical proof
        - from: partner-access
          to: validation
          label: workflow evidence
        - from: validation
          to: packaging
          label: commercial design
        - from: packaging
          to: contracting
          label: price / terms
        - from: contracting
          to: gross-profit
          label: unit economics
    approximationNotes: Bridge is qualitative; no AMI revenue, price, or margin number is public.
    claimRefs:
      - CI015
      - CI035
      - CI039
      - CI042
      - CI049
  - id: FI002
    title: Unit Economics Bridge
    type: flow
    layout: wide
    summary: The future unit-economics equation runs through usage, GPU cost, data work, safety validation, and pricing power.
    data:
      nodes:
        - id: usage
          label: Customer usage
          detail: Workflow volume, simulations, or inference calls remain undisclosed.
        - id: model-workload
          label: Model workload
          detail: Training, fine-tuning, and inference intensity determine compute demand.
        - id: gpu-cost
          label: GPU / cloud cost
          detail: External GPU ranges bound the cost context, not AMI spend.
        - id: data-testing
          label: Data and testing
          detail: Physical AI needs curated real/synthetic data and evaluation loops.
        - id: validation
          label: Safety validation
          detail: FDA/NIST-relevant controls add cost and time in regulated workflows.
        - id: price
          label: Price and contract
          detail: Gross margin remains unknown until AMI discloses price and usage terms.
      edges:
        - from: usage
          to: model-workload
          label: demand
        - from: model-workload
          to: gpu-cost
          label: compute
        - from: model-workload
          to: data-testing
          label: training data
        - from: data-testing
          to: validation
          label: proof
        - from: gpu-cost
          to: price
          label: COGS pressure
        - from: validation
          to: price
          label: deployment burden
    approximationNotes: Qualitative bridge only; AMI has not disclosed workload mix, utilization, price, or gross margin.
    claimRefs:
      - CI017
      - CI019
      - CI020
      - CI021
      - CI023
      - CI040
      - CI041
