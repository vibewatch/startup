  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: burn-runway
      missingEvidence: >-
        Cash balance after the March 2026 seed, monthly net burn, committed compute spend, and board-approved operating
        plan.
      whyItMatters: Runway and financing dependency cannot be calculated from round size alone.
      diligencePath: Request AMI management accounts, board budget, bank statement / treasury report, and compute-contract schedule.
      relatedQuestionRefs:
        - QI014
        - QI015
      relatedTableRefs:
        - TI004
        - TI005
    - type: missing-source
      severity: blocking
      topic: partner-economics
      missingEvidence: >-
        Nabla agreement terms, revenue share, exclusivity scope, data rights, minimum commitments, and transfer-pricing
        mechanics.
      whyItMatters: Nabla is the only named partner signal, but it does not yet prove AMI revenue quality.
      diligencePath: Review executed AMI-Nabla agreements and interview both finance leads about commercialization economics.
      relatedQuestionRefs:
        - QI004
        - QI026
      relatedTableRefs:
        - TI001
        - TI002
        - TI005
    - type: missing-source
      severity: blocking
      topic: pricing-and-arr
      missingEvidence: >-
        Current and planned price book, contracted pilots, ARR / bookings, recognized revenue, customer count, pipeline,
        and sales-cycle data.
      whyItMatters: >-
        Without price and conversion evidence, revenue streams remain hypotheses rather than underwritable financial
        metrics.
      diligencePath: >-
        Request CRM export, signed contracts, invoices, deferred revenue schedule, pipeline by stage, and board KPI
        pack.
      relatedQuestionRefs:
        - QI001
        - QI003
        - QI008
        - QI020
      relatedTableRefs:
        - TI002
        - TI003
        - TI005
    - type: private-evidence-only
      severity: material
      topic: compute-commitments
      missingEvidence: >-
        GPU reservation contracts, cloud commitments, owned hardware capex, data-center obligations, and partner compute
        credits.
      whyItMatters: Compute may be the largest controllable cost driver and can determine gross margin and runway.
      diligencePath: >-
        Inspect cloud-provider MSAs, NVIDIA / hyperscaler commitments, capex schedules, utilization dashboards, and
        model-training roadmap.
      relatedQuestionRefs:
        - QI009
        - QI021
        - QI023
      relatedTableRefs:
        - TI003
        - TI006
    - type: missing-source
      severity: material
      topic: next-round-trigger
      missingEvidence: >-
        Management’s milestone plan for the next financing, including technical proof, partner pilots, safety
        validation, and commercial KPIs.
      whyItMatters: A large seed can still leave the company financing-dependent if compute-heavy milestones precede revenue.
      diligencePath: >-
        Request board-approved milestone plan, financing model, investor-rights schedule, and sensitivity case for
        delayed pilots.
      relatedQuestionRefs:
        - QI017
        - QI029
      relatedTableRefs:
        - TI004
        - TI005
