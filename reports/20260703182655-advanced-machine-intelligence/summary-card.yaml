  topStrengths:
    - Founder and research pedigree around Yann LeCun, Alexandre LeBrun, and a senior world-model research bench.
    - Exceptional seed capitalization and high-quality financial and strategic investor syndicate.
    - >-
      Contrarian world-model thesis aligned with physical-AI demand in healthcare, robotics, industrial automation, and
      wearables.
    - Early strategic partner channel through Nabla with first access to emerging AMI technologies.
  topRisks:
