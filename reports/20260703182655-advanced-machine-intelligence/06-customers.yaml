- id: nabla-channel-validation
  title: Nabla supplies named customer proof, but only as indirect channel validation
  body: 'Nabla is the only named strategic partner with privileged access to AMI technology, and it brings meaningful indirect proof: health systems
    have deployed Nabla’s ambient assistant in real clinical workflows, reported utilization, and expanded from pilots into broader rollouts.
    This evidence matters because AMI’s first credible healthcare path would likely travel through Nabla’s installed base and feedback loops.
    It must be kept in a separate diligence bucket, however. Denver Health, Carle, McFarland, Tia, CHLA, UToledo, and Aultman validate Nabla’s
    ability to sell, integrate, and support clinical AI; they do not prove AMI has shipped its own world model or earned AMI revenue. The named
    proof table therefore labels the AMI relationship separately from downstream Nabla customer outcomes. The strongest indirect signal is not
    a single logo; it is the repeated pattern across Nabla accounts: a defined workflow pain, a pilot or evaluation, EHR integration, clinician-level
    adoption, and a quantified documentation or burnout outcome. The missing bridge is a disclosed AMI-derived feature inside that pattern.'
