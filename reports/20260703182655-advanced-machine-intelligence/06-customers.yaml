  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: direct-customer-proof
    missingEvidence: Named AMI paying customers, pilots, design partners, or signed commercial contracts with deployment status and dates.
    whyItMatters: Without direct customer proof, the chapter cannot distinguish strategic interest from revenue-bearing adoption.
    diligencePath: Request management customer pipeline, signed contract schedule, pilot SOWs, and permissioned reference calls.
    relatedQuestionRefs:
    - QU001
    - QU003
    relatedTableRefs:
    - TU002
    - TU003
  - type: missing-source
    severity: material
    topic: contract uncertainty
    missingEvidence: AMI-Nabla commercial agreement, licensing terms, exclusivity scope, data rights, and revenue-share economics.
    whyItMatters: Nabla concentration could be valuable or limiting depending on economics and control rights.
    diligencePath: Review executed partnership agreement and interview both companies on governance, roadmap, and termination rights.
    relatedQuestionRefs:
    - QU015
    - QU027
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: retention gap
    missingEvidence: AMI NRR, GRR, churn, renewal rates, contract length, satisfaction, and pilot-to-production conversion.
    whyItMatters: Retention and durability cannot be inferred from partner announcements or Nabla case studies.
    diligencePath: Request cohort tables for any AMI pilots and renewal/expansion data as soon as deployments begin.
    relatedQuestionRefs:
    - QU025
    - QU029
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof
    missingEvidence: Complete list of AMI direct customers and AMI-enabled Nabla customer deployments, including production versus pilot status.
    whyItMatters: The public named-proof table is partial and contains indirect Nabla deployments that may not use AMI technology.
    diligencePath: Ask AMI and Nabla for a permissioned deployment inventory and mark which accounts use AMI-derived models.
    relatedQuestionRefs:
    - QU018
    - QU023
    relatedTableRefs:
    - TU003
  - type: conflicting-data
    severity: minor
    topic: Nabla installed base
    missingEvidence: A single dated Nabla customer-count definition reconciling 130-plus, over 150, and broader case-study-page counts.
    whyItMatters: Indirect channel scale is useful but should not be overstated or mixed with AMI direct customers.
    diligencePath: Ask Nabla to define active customer, health system, provider group, clinician, encounter, and paid-account metrics.
    relatedQuestionRefs:
    - QU017
    - QU018
    relatedTableRefs:
    - TU002
  - type: missing-source
    severity: material
    topic: production readiness
    missingEvidence: AMI-specific benchmark, safety validation, regulatory plan, and production deployment evidence for healthcare or another
      vertical.
    whyItMatters: Adverse sources focus on whether AMI can turn research into customer-trusted production systems.
    diligencePath: Request technical validation package, red-team results, regulatory roadmap, and a named design partner deployment plan.
    relatedQuestionRefs:
    - QU024
    - QU030
    - QU031
    - QU032
    relatedTableRefs:
    - TU006
