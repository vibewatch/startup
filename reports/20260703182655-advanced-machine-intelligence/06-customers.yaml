- id: procurement-friction-and-adverse-signal
  title: Procurement friction is likely high until AMI proves production readiness
  body: The adverse signal is not that AMI’s technical thesis is implausible; it is that customer proof will lag if the company remains in fundamental
    research while competitors and vertical AI vendors accumulate production data, trust, and procurement references. Healthcare buyers will ask
    for safety, auditability, privacy posture, EHR integration, regulatory path, measurable ROI, and support obligations before moving from strategic
    access to production. Sacra explicitly warns that AMI may be slow to prove a production advantage, Forbes asks whether world models can move
    beyond hype, and Sequoia’s broader AI spending critique reinforces that customers are scrutinizing ROI. Those sources make the customer chapter
    a diligence blocker until AMI names direct pilots or commercial customers. The procurement bar is especially high because AMI’s stated value
    proposition touches safety-critical decision support rather than low-risk back-office automation. A buyer can admire the research program
    and still defer adoption until liability allocation, monitoring, fallback behavior, and measurable workflow economics are documented in a
    named account.
