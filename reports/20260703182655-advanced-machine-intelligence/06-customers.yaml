- id: TU006
  title: Procurement friction and adverse-readiness map
  columns:
  - Friction point
  - Why it matters to buyers
  - Evidence
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Production readiness
    - Buyers need proof in real environments before relying on world models
    - TechCrunch says AMI starts with fundamental research and may take years
    - High
    - Require named pilots, success criteria, and deployment dates
  - - Regulatory and safety path
    - Healthcare agentic AI needs auditable and deterministic behavior
    - Nabla frames world models around FDA-certifiable agentic systems
    - High
    - Request regulatory strategy, validation protocol, and human-oversight controls
  - - EHR and workflow integration
    - Health systems buy tools that fit existing Epic/Cerner workflows
    - Nabla customer cases emphasize Epic and Oracle Cerner integration
    - High
    - Show AMI-enabled functionality in real EHR workflows
  - - ROI scrutiny
    - AI buyers and investors are scrutinizing revenue and return on AI spend
    - Sequoia highlights the broader AI spending-to-revenue question
    - Medium
    - Prove measurable labor, quality, or revenue-cycle impact
  - - Competitive shipping risk
    - Rivals that deploy gather failure data and customer trust faster
    - Sacra warns deploy-focused rivals may outlearn AMI
    - High
    - Prioritize one vertical production wedge over broad research narrative
  - - Hype / category dilution
    - World models can become a label before customer value is proven
    - Forbes asks whether AMI world models can move beyond hype
    - Medium
    - Publish AMI-specific benchmarks and referenceable deployments
  notes: This table intentionally includes adverse and skeptical sources to avoid treating partner announcements as customer proof.
