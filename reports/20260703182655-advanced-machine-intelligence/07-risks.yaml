- id: regulatory-legal-and-governance-risk
  title: Regulatory, legal, and governance boundaries are unresolved
  body: The legal risk is broader than a single statute. If AMI’s technology becomes a component in clinical workflows, the FDA AI-enabled-device and predetermined-change-control
    materials become relevant because model behavior, updates, validation evidence, and post-market monitoring are core diligence items. In Europe, the AI Act makes
    high-risk deployment a provider-responsibility problem, not merely a research issue. UK frontier commitments and the NIST RMF add a practical safety-testing and
    governance vocabulary. Separate from sector regulation, IP and conflict boundaries need special attention because the public record ties LeCun to Meta and NYU,
    LeBrun to Nabla and Meta/FAIR, and the AI training ecosystem to active copyright litigation against Meta. None of those facts proves wrongdoing by AMI; they do
    show why investors should request assignment, data-rights, publication-review, conflict-waiver, and partner-exclusivity documentation before accepting the company’s
    governance posture.
