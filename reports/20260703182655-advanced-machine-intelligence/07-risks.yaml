- id: TR006
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Pre-product commercialization
    - AMI-specific benchmark or pilot appears
    - No named pilot, benchmark, or product package by next financing process
    - Do not step up valuation
  - - Compute intensity
    - Compute budget mapped to milestones
    - No disclosed burn/runway/cloud commitments during diligence
    - Treat round size as time-buying, not de-risking
  - - Healthcare regulatory path
    - FDA/EU regulatory memo and PCCP-style plan
    - No classification, validation, post-market monitoring, or liability allocation
    - Block clinical-autonomy underwriting
  - - Nabla concentration
    - Signed partner terms reviewed
    - No economics, exclusivity duration, data rights, or termination rights
    - Discount channel proof heavily
  - - Customer proof gap
    - Direct customer or design-partner evidence
    - Only Nabla-related proof remains public
    - Keep recommendation at research-more/track
  - - IP / conflict boundaries
    - Assignment and waiver documents produced
    - No Meta/NYU/Nabla conflict and IP packet
    - Escalate to legal blocker
  - - Operational quality
    - Independent safety/evaluation report
    - No repeatable evaluation protocol or red-team results
    - Block production-risk thesis
  - - Security/privacy
    - Security and clinical-data control package
    - No logging, access control, privacy, or incident response plan
    - Block healthcare deployment thesis
  - - Competitor pressure
    - Differentiated benchmark versus World Labs/DeepMind/NVIDIA analogues
    - No benchmarked differentiation in target workflow
    - Assume moat compression
  - - Valuation expectations
    - Milestone-based financing plan
    - Next round depends mainly on founder prestige or category hype
    - Mark valuation stance expensive/stretched
  notes: Kill criteria are investor monitoring thresholds derived from current evidence gaps; they are not company-provided covenants.
