  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: customer-proof
    missingEvidence: AMI-specific pilots, paying customers, pricing, ARR, and renewal or deployment evidence.
    whyItMatters: Without direct proof, valuation and commercialization risk remain the top thesis blockers.
    diligencePath: Request customer pipeline, design-partner agreements, pilot evaluation reports, and board materials.
    relatedQuestionRefs:
    - QR004
    - QR018
    - QR019
  - type: private-evidence-only
    severity: material
    topic: nabla-terms
    missingEvidence: AMI-Nabla agreement economics, exclusivity duration, data rights, product obligations, and termination rights.
    whyItMatters: Nabla is the only named partner and can either de-risk or concentrate the first healthcare wedge.
    diligencePath: Review the executed partnership agreement and amendments under counsel privilege.
    relatedQuestionRefs:
    - QR008
    - QR021
    relatedTableRefs:
