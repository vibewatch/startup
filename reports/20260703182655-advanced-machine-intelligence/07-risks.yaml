company:
  name: Advanced Machine Intelligence
chapter:
  number: 7
  title: Risks
  summary: AMI’s risk profile is high because a $1.03 billion seed round and founder credibility precede public product, customer, regulatory, and compute proof.
    The most severe residual exposures are pre-product commercialization, compute intensity, healthcare/regulatory readiness, partner concentration in Nabla, key-person
    dependence, and valuation-driven financing expectations.
sections:
- id: severity-ranked-risk-view
  title: The dominant risk is a pre-product, high-valuation research bet
  body: 'AMI’s risk stack should be read top-down: valuation and reputation have arrived before product proof, while the hardest claims depend on world-model systems
    that must be reliable in regulated, safety-critical domains. The company has unusually strong founder credibility and a very large balance-sheet option, but those
    strengths also raise the hurdle. The severe risks are not isolated; compute intensity delays productization, delayed productization makes customer proof scarce,
    scarce proof makes the $3.5 billion pre-money valuation harder to defend, and the financing bar increases pressure to launch before governance, safety, and healthcare
    controls are fully evidenced. Adverse sources matter here. Forbes asks whether world models can move beyond hype, Sequoia questions the broader AI revenue gap
    behind infrastructure spending, and Epoch shows that frontier training economics can become prohibitive for all but the best-funded labs. The investment implication
    is therefore track or research-more, not underwrite-as-scaled: require AMI-specific benchmarks, governed pilots, and contract evidence before treating the round
    size as validation.'
  claimRefs:
