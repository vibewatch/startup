- id: mitigations-monitoring-and-kill-criteria
  title: Mitigation must be evidenced through monitorable triggers
  body: 'The risk register is investable only if mitigation becomes measurable. The first proof gate is an AMI-specific product artifact: a demo, benchmark, or pilot
    whose evaluation protocol is documented and repeatable. The second is governance evidence: IP assignment, data-rights schedules, conflict waivers, regulatory
    classification analysis, and security controls. The third is commercial evidence: named design partners beyond Nabla, pricing or pilot economics, customer ROI,
    and deployment support obligations. The final gate is capital discipline: compute commitments, runway, burn, and financing expectations should map to technical
    milestones rather than headline valuation. A failure on any one gate may be survivable; failure across product proof, governance, and financing should break the
    thesis because it would mean the round bought time but not risk reduction. Residual exposure remains high today because the public record contains strong ambition
    and financing but not enough AMI-specific control evidence.'
