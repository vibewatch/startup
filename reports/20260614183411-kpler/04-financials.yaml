  - id: cost-capital-adequacy
    title: Cost Structure and Capital Adequacy
    body: |
      Kpler's cost structure is dominated by three categories: (1) data collection and AIS infrastructure—including satellite and terrestrial AIS feeds and agreements with over 255,000 proprietary data sources—representing an operationally intensive but largely fixed cost base once at scale; (2) personnel costs across 600+ employees in offices in New York, Dubai, London, Paris, and Brussels; and (3) technology infrastructure for real-time processing of over one billion AIS signals per day and integration of multiple acquired data platforms. M&A integration expense is a significant transitory cost category as the company digests six-plus acquisitions.

      Gross margin is undisclosed. Comparable pure-play data and analytics SaaS businesses—S&P Global Commodity Insights, Argus Media, and ICE Data Services—operate at gross margins of 60–80%. Kpler's high data-collection and AIS infrastructure cost may compress margins below the upper end of this range, but the predominantly software-delivered subscription model and increasing API-layer revenue should support margins above 60% at scale.

      Capital adequacy is strong following the June 2026 Sixth Street investment. The company raised over $1 billion in minority growth equity, with management retaining majority control and Insight Partners rolling its existing stake. Prior to closing, two credit charges were registered at Kpler UK Holdco (charges 146491260002 and 146491260003, both created on 22 August 2025) and one at Kpler Ltd (charge 110423870002, same date), likely bridging the $241M Spire Maritime acquisition. The original 2023 credit facilities at both entities were satisfied in full in May 2026, signaling active balance-sheet management at or around the Sixth Street close. With $1B+ in fresh equity and no indication of near-term liquidity pressure, runway appears substantial unless acquisition pace accelerates further.
