  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: "Audited consolidated gross margin and gross profit for Kpler UK Holdco group (FY2023 and FY2024)."
      whyItMatters: "At a ~$4B implied valuation, a 10pp difference in gross margin changes enterprise value by hundreds of millions under DCF; the 60–80% estimate range is too wide for underwriting."
      diligencePath: "Request audited group accounts from Kpler and access the 54-page UK Companies House group filing for Kpler UK Holdco (CIN 14649126) for FY2024, filed September 26, 2025."
      relatedQuestionRefs:
        - QI013

    - type: private-evidence-only
      severity: blocking
      topic: burn-rate
      missingEvidence: "Kpler's monthly cash burn and cash balance as of June 2026 are not publicly disclosed."
      whyItMatters: "Without burn and runway data, the adequacy of the $1B+ equity injection cannot be assessed against the company's actual capital consumption rate."
      diligencePath: "Obtain quarterly management accounts including a cash flow statement for the period ending March 2026; request a post-close balance sheet from Sixth Street's data room."
      relatedQuestionRefs:
        - QI020

    - type: private-evidence-only
      severity: blocking
      topic: arr-2026
      missingEvidence: "No ARR or revenue disclosure has been made by Kpler for any period following January 2024. Third-party estimates for 2025 and 2026 diverge from $215M to $332M."
      whyItMatters: "Headline ARR drives the valuation multiple; if actual 2025 ARR is below €200M the Sixth Street deal multiple exceeds 20x and materially changes the risk-return equation."
      diligencePath: "Request confirmed ARR and MRR run-rate as of December 2025 and March 2026, with organic versus acquisition attribution and deferred revenue schedule."
      relatedQuestionRefs:
        - QI028
        - QI002

    - type: private-evidence-only
      severity: blocking
      topic: nrr
      missingEvidence: "Net revenue retention by customer cohort and by product line is not disclosed; no churn or expansion data is publicly available."
      whyItMatters: "NRR determines whether the business can sustain growth without continuous new logo acquisition. NRR below 100% at this valuation would indicate the business requires permanent capital infusion to maintain ARR."
      diligencePath: "Require cohort-level NRR analysis from Kpler's CRM; review deferred revenue roll-forward in audited accounts; seek auditor attestation of NRR figure."
      relatedQuestionRefs:
        - QI029

    - type: private-evidence-only
      severity: material
      topic: deal-structure
      missingEvidence: "The precise terms of the Sixth Street investment, including any preferred return, control provisions, anti-dilution rights, or co-investment with debt, are not disclosed."
      whyItMatters: "Discoperi's characterization of the deal as an acquisition conflicts with the official minority-investment framing; if the transaction involved leveraged financing or effective control, the risk profile differs substantially."
      diligencePath: "Obtain the Share Purchase Agreement or Investment Agreement from the data room; confirm from Companies House whether any new charges were registered post-June 2026."
      relatedQuestionRefs:
        - QI018

    - type: enumeration-incomplete
      severity: material
      topic: credit-facilities-size
      missingEvidence: "The aggregate size and terms of the August 2025 credit facilities (charges 146491260002, 146491260003 at Holdco and 110423870002 at Kpler Ltd) are not disclosed."
      whyItMatters: "Outstanding debt obligations reduce net equity value and affect capital adequacy analysis; if August 2025 facilities exceeded $200M, the effective equity available post-Sixth Street close is materially lower."
      diligencePath: "Retrieve the registered charge documents from UK Companies House (each referenced as 21–59 pages); request lender confirmations from Kpler's CFO."
      relatedTableRefs:
        - TI004

    - type: private-evidence-only
      severity: material
      topic: organic-arr-growth
      missingEvidence: "The proportion of Kpler's ARR growth attributable to organic subscription expansion versus acquired ARR from the six-plus M&A transactions is not disclosed."
      whyItMatters: "Acquisition-driven ARR inflation can mask weak organic growth, particularly for cohort analysis following the MarineTraffic (Feb 2023) and Spire Maritime (late 2024) acquisitions."
