summary:
  headline: >
    Kpler is a category-defining physical trade intelligence platform with a hard-to-replicate AIS data moat, confirmed
    rapid ARR growth, and 12,000+ enterprise customers—but the June 2026 Sixth Street entry at an implied 13–20x ARR
    multiple is stretched relative to public data-analytics peers, and zero disclosed unit economics (NRR, gross margin,
    churn) combined with the UK CMA antitrust review and a co-founder leadership transition prevent a buy call.
  overallScore: 6.8
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
