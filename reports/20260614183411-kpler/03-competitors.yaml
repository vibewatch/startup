  evidenceGaps:
    - type: access-blocked
      severity: material
      topic: regulatory-competitive-risk
      missingEvidence: "UK Competition and Markets Authority formal ruling on Kpler's MarineTraffic and FleetMon acquisitions, including any remedies, conditions, or access-obligation orders imposed on Kpler"
      whyItMatters: "An adverse CMA ruling requiring data licensing or divestiture would materially impair Kpler's AIS infrastructure moat and could compel Kpler to grant competitors access to its proprietary receiver network on regulated terms, fundamentally altering the competitive landscape."
      diligencePath: "Monitor CMA case register (https://www.gov.uk/cma-cases) and Kpler's public disclosures for ruling timeline; engage legal counsel on likely remediation scenarios if CMA proceeds to a Phase 2 investigation; model competitive impact under a divestiture scenario."
      relatedQuestionRefs:
        - QP024

    - type: private-evidence-only
      severity: minor
      topic: competitor-pricing
      missingEvidence: "Verified list pricing or executed contract terms for Vortexa, S&P Global Commodity Insights, Argus Media, and Windward — all operate on private SaaS-style contracts without public pricing disclosure"
      whyItMatters: "Without verified pricing, the competitive pricing comparison relies on market estimates and one published review, reducing the precision of relative pricing and positioning judgments for investors."
      diligencePath: "Request sample contracts or pricing sheets from Vortexa, Argus, and Windward in due diligence; interview former customers of each for realised pricing benchmarks; review Kpler's win-rate data by competitor to infer price competitiveness."

    - type: missing-source
      severity: minor
