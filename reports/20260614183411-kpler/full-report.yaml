      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: |
              Kpler was founded in 2014 by François Cazor and Jean Maynier, who built the company from
              "humble origins of two engineers in a kitchen" into a global enterprise with over 850 employees.
              Both founders have been central to Kpler's twelve-year growth trajectory and co-authored the
              statement announcing the June 2026 Sixth Street investment, reiterating the shared vision for
              the platform. François Cazor served as CEO at least through 2023, as evidenced by the February
              2023 MarineTraffic acquisition press release.

              The company has undergone material governance transitions in 2025 and 2026. UK Companies House
              filings reveal that both Cazor and Maynier were terminated as directors of Kpler UK Holdco
              Limited on 3 September 2025, and were subsequently terminated as directors of Kpler Ltd on 22
              April 2026. The same April 2026 filing saw Axelle Steurs and Anna Favarin appointed as new
              directors of Kpler Ltd. The Sixth Street announcement explicitly framed the transition as "From
              the foundations laid by François and Jean to the leadership of Mark Cunningham and today's
              management team," confirming that Mark Cunningham now leads operations. Cunningham's prior
              background and specific role title are not publicly disclosed in available sources.

              These governance changes coincide with the satisfaction of debt charges registered at both
              Kpler Ltd (charge 110423870001) and Kpler UK Holdco (charge 146491260001) in May 2026, indicating
              prior debt obligations were discharged ahead of the Sixth Street investment. While founders
              continue to participate as shareholders and public spokespersons, the structural decoupling from
              formal director roles at key UK entities represents a material key-person transition that requires
              diligence on management continuity, delegation of authority, and any lock-in provisions within
              the new investment documentation.
