            body: |
              Kpler's customer base spans six verticals: commodity trading, financial institutions,
              maritime operations, logistics and supply chain, marine insurance and risk, and government
              and regulatory. The commodity trading vertical — oil majors, independent traders, refiners,
              and dry bulk operators — represents the historical core, inherited from Kpler's 2014 LNG
              origins. The 2023 acquisitions of MarineTraffic and FleetMon broadened the addressable base
              to include maritime logistics operators, port authorities, shipping agencies, shipping
              insurers, and a large consumer and professional AIS user base.

              The buyer-user-payer triad follows typical enterprise B2B SaaS dynamics: a single enterprise
              account may span multiple business units (e.g., a commodity trading house with separate
              freight, arbitrage, and compliance desks), each a distinct user cohort. The official product
              architecture confirms distinct value propositions: commodity platform users access Cargo
              Analytics, Chartering, Arbitrage Analytics, Risk & Compliance, and Kpler AI, while maritime
              users access Ship Tracking, Container Intelligence, Inbox, Hub, MarineTraffic Insurance, and
              Data Services APIs. The Enterprise Plan is targeted at multi-team and multi-geography
              deployments with SSO, audit logging, and SLA support.

              Channel is predominantly direct enterprise sales supported by API and data-feed integrations
              with trading platforms and logistics systems. The MarineTraffic free consumer tier acts as a
              top-of-funnel awareness and conversion mechanism: 8.5 million registered users as of April
