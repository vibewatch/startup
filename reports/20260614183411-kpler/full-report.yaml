      - number: '8.4'
        title: Exit Readiness, Final Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Kpler's exit readiness is constrained by multiple factors. An IPO would require publicly disclosed
              financial statements — gross margin, NRR, CAC/LTV, EBITDA — that Kpler has never published. The unresolved
              UK CMA review creates material uncertainty that most institutional investors would require to be resolved
              before underwriting a public offering. Co-founder board exit introduces governance questions that buy-side
              analysts would probe intensively in an IPO roadshow. The most natural exit path for Sixth Street is a
              strategic acquisition by one of the four credible acquirers: S&P Global (logical fit, but would likely
              trigger CMA scrutiny), ICE Data Services, Bloomberg, or a large PE firm in a leveraged-buyout continuation
              structure. Any of these buyers would likely apply strategic premiums of 20–30% above standalone DCF,
              supporting returns in the base-to-bull range.

              Five final diligence asks stand out as conviction-critical. First, gross margin and unit economics: at an
              implied $250M ARR, a 60%+ gross margin would validate scalable profitability, while anything below 50%
              would call into question whether Kpler can generate the FCF needed to service further acquisitions and
              justify the multiple. Second, NRR: an NRR above 110% would confirm net expansion within the enterprise
              base and materially reduce the growth risk. Third, the CMA review outcome and timeline: any indication of
              imminent structural remedy would trigger immediate multiple compression. Fourth, the precise deal
              structure — how much of Sixth Street's $1B+ was primary capital to Kpler's balance sheet versus secondary
              acquisition of Five Arrows' stake — determines the actual dry powder available for product investment and
              acquisitions. Fifth, founder lock-up and incentive alignment: with both Cazor and Maynier exiting UK
              director roles, understanding their ongoing economic and strategic involvement is critical to operational
              continuity.

              The thesis-break triggers in the adjacent table define the specific thresholds at which the investment
              case reverses. The single most damaging trigger is CMA-ordered divestiture of MarineTraffic, which would
              unwind the primary source of Kpler's data moat and directly reduce the sustainable ARR multiple toward
              public-comp levels. The second most material trigger is an NRR disclosure below 100%, which would signal
              net churn in the enterprise base, fundamentally undermining the revenue-growth narrative.
