      - number: '5.2'
        title: Technology Architecture and Data Operations
        blocks:
          - type: paragraph
            body: >
              Kpler's technology stack operates across four architectural layers: data collection, data processing and
              integration, analytics and intelligence, and delivery. The collection layer is distinguished by its scale
              and multi-modal nature. The terrestrial AIS tier, inherited from MarineTraffic and FleetMon (acquired
              February 2023), runs on more than 13,000 proprietary ground-based receivers globally supplemented by
              6,600+ AIS receiving stations in the Vessel Integrations product set. The satellite AIS tier, acquired
              through the $241 million purchase of Spire Maritime in November 2024, adds a constellation of over 100
              nanosatellites that provide 15-minute global refresh rates in open-ocean areas beyond terrestrial coverage
              range. Roaming AIS rounds out the collection layer for regional blind spots. Vessel Integrations extends
              tracking further by ingesting VSAT and Inmarsat C satellite telemetry data, enabling coverage for fleet
              operators where AIS signal propagation is insufficient. Combined, the system processes over 1 billion AIS
              signals per day.


              The data processing layer normalizes incoming AIS messages, deduplicates signals from multiple receivers,
              validates quality, and applies cargo attribution algorithms that translate vessel movements into commodity
              flow estimates. This requires correlating AIS positions with port call records, vessel registries,
              historical cargo manifests, and customs data from multiple jurisdictions. Satellite imagery is layered in
              for onshore asset monitoring—crude oil storage tank fill levels and LNG terminal activity—where AIS-based
              inference is insufficient. The analytics layer constructs the intelligence products: time-series flow
              databases, supply/demand balances, market reports, and AI-derived forecasts.


              Kpler's engineering culture (inferred from its GitHub organisation, which includes public repositories for
              IoT AIS station firmware, engineering katas in Java/Scala/Python, a Terraform Auth0 provider, and
              pre-commit hook tooling) reflects a data-engineering-heavy environment consistent with Python/Scala
              streaming pipelines and cloud-based infrastructure. Careers postings confirm Python, Kafka, and cloud
              infrastructure (AWS/GCP) as core technology stack elements. The Kpler MCP integration confirms the
              company's commitment to API-first delivery: analysts can now embed Kpler intelligence directly in their
              LLM workflows. FleetMon, phased out in January 2024, was fully migrated into the MarineTraffic community
              platform with AIS station data preserved and operators redirected to the unified Kpler/MarineTraffic
              network.
