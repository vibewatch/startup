      - number: '8.3'
        title: 'Scenario Analysis: Bull, Base, and Bear'
        blocks:
          - type: paragraph
            body: >-
              The bull scenario requires Kpler to sustain 25–30%+ ARR growth over a four-to-five year hold period,
              reaching approximately $700M–$1.1B in ARR, and to exit via IPO or strategic acquisition at a 15–18x NTM
              ARR multiple. Under these assumptions, the implied exit enterprise value would be approximately $10B–$20B,
              delivering a 3–5x return on Sixth Street's capital at an implied 25–40% IRR. The thesis driver is Kpler
              positioning itself as the definitive global physical trade intelligence platform — analogous to Bloomberg
              Terminal in financial markets — commanding a structural premium that grows with regulatory adoption,
              defense market expansion, and energy-transition data. The key risk to the bull case is public market
              rerating of data analytics companies, as any sustained P/S compression from current levels would
              materially reduce IPO proceeds.

              The base scenario assumes 15–20% ARR growth (achievable through cross-selling across the dual-platform
              customer base), a five-year hold period reaching approximately $500–$620M in ARR, and an exit multiple of
              10–12x NTM ARR. This produces an exit EV of approximately $5B–$7.5B, with Sixth Street's minority stake
              (approximately 25%) yielding $1.25B–$1.875B on approximately $1B invested — a 1.25–1.875x return
              representing a 5–15% IRR over five years. This is marginal for a growth equity investment where LPs
              typically expect 2x+ over five to six years. Growth deceleration to 15% is plausible if: (a) macro
              commodity-cycle headwinds reduce trading house spend; (b) the CMA imposes data-sharing mandates; or (c)
              S&P Global's integrated commodity-plus-AIS offering accelerates competitive pressure.

              The bear scenario involves ARR growth decelerating to 10% per year (consistent with late-stage SaaS
              maturity), multiple compression to 7–8x (converging to public comp median), CMA structural remedies
              reducing data moat integrity, and potential for founder departure creating execution disruption. Under
              bear assumptions, Kpler reaches approximately $320–$400M ARR over five years, exits at $2.5B–$3.2B
              enterprise value, and Sixth Street's stake returns approximately $625M–$800M — a meaningful loss on
              capital. The bear case is not a tail risk: it becomes the base case if growth decelerates or regulatory
              intervention is adverse.
            claimRefs:
              - CV026
              - CV027
              - CV028
              - CV029
