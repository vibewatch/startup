            body: >
              Kpler's cost structure is dominated by three categories: (1) data collection and AIS
              infrastructure—including satellite and terrestrial AIS feeds and agreements with over 255,000 proprietary
              data sources—representing an operationally intensive but largely fixed cost base once at scale; (2)
              personnel costs across 600+ employees in offices in New York, Dubai, London, Paris, and Brussels; and (3)
              technology infrastructure for real-time processing of over one billion AIS signals per day and integration
              of multiple acquired data platforms. M&A integration expense is a significant transitory cost category as
              the company digests six-plus acquisitions.


              Gross margin is undisclosed. Comparable pure-play data and analytics SaaS businesses—S&P Global Commodity
              Insights, Argus Media, and ICE Data Services—operate at gross margins of 60–80%. Kpler's high
              data-collection and AIS infrastructure cost may compress margins below the upper end of this range, but
