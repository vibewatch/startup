      - number: '1.4'
        title: Scale, Milestones, and Acquisitions
        blocks:
          - type: paragraph
            body: |
              From a two-engineer startup in Brussels in 2014, Kpler has scaled to 850+ employees across 13
              offices spanning Europe, North America, the Middle East, Asia-Pacific, and emerging markets. The
              global footprint includes Belgium (HQ), France, Germany, Austria, Greece, Cyprus, Luxembourg,
              the United Kingdom, Canada (ExactEarth subsidiary), the UAE, the United States (Cambridge MA,
              Houston TX, and New York City), and Singapore. The company is registered through multiple legal
              entities including Kpler SAS (France), Kpler Ltd (UK, incorporated November 2017), Kpler UK
              Holdco Limited (UK, incorporated February 2023), Kpler Inc (US, Cambridge MA), and Kpler PTE
              Ltd (Singapore).

              Kpler's growth has been driven by both organic product expansion and an aggressive M&A strategy.
              Beginning with LNG cargo tracking in 2014, the platform added crude oil in 2017, then sequentially
              expanded to dry bulk, chemicals, freight, metals, minerals, grains, refining, containers, and
              pipelines. In 2021–2022, Kpler completed five acquisitions in 18 months including Spire and
              ChartDesk, funded by the $200M+ Five Arrows and Insight Partners round. The acquisition of
              MarineTraffic (closed 7 March 2023) and FleetMon (closed 13 March 2023) added AIS-based maritime
              intelligence with 13,000+ AIS receivers globally and 300,000+ vessel positions per day, bringing
              headcount above 500. The company's press page references an additional CITAC acquisition to expand
              African intelligence coverage, suggesting continued inorganic growth into 2025–2026. Kpler today
              monitors 430 million tonnes of LNG export shipments annually and processes over 2 million trades
              in its database, with MarineTraffic achieving 5-second average AIS message latency.
