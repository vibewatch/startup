  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold
      - Transmission to Thesis
      - Action Implication
    rows:
      - - CMA structural remedy
        - Forced divestiture of MarineTraffic or Spire Maritime
        - Data moat irreversibly impaired; Kpler becomes a software-only analytics platform
        - Exit at any achievable multiple; no recovery scenario preserves 16x ARR entry
      - - NRR disclosed below 100%
        - Net revenue retention below 100% in any investor-facing disclosure
        - Revenue growth narrative collapses; enterprise churn undermines ARR trajectory
        - Demand down-round protection; renegotiate governance rights
      - - ARR growth deceleration
        - Two consecutive quarters below 15% YoY ARR growth
        - Valuation collapses toward 8–10x public-comp range; IRR turns negative in base case
        - Reassess position; seek secondary liquidity; engage board on strategic alternatives
      - - Gross margin below 50%
        - Disclosed gross margin below 50% at any point
        - Unit economics insufficient for profitable scale; strategic-acquirer appetite reduced
        - Demand capital-efficiency improvement plan; reconsider follow-on investment
      - - CEO departure or governance disruption
        - Mark Cunningham exits or founders fully disengage from operational role
        - Execution risk spikes amid governance transition at a growth inflection point
        - Pause follow-on capital; demand governance improvement before next deployment
      - - Sector-wide P/S rerating
        - Data analytics P/S median falls below 5x on a sustained 6-month basis
        - IPO exit window closes; strategic-acquisition multiples reset lower
        - Accelerate IPO preparations or execute dividend recapitalization to return capital
      - - Strategic acquirer exits the market
        - SPGI, ICE, and Bloomberg all acquire competing platforms before Kpler IPO
        - Best strategic exit paths closed; secondary PE exit only at reduced multiple
        - Identify non-traditional buyers (commodity trading houses, sovereign wealth funds)
    notes: >-
      Triggers are ordered by estimated severity of thesis impairment, not by probability of occurrence. CMA outcome and
      NRR disclosure are the two highest-priority monitoring items given current evidence gaps. Action implications
      assume Sixth Street holds a minority stake with governance rights including information rights and board observer
      seats (standard for growth equity of this size; not formally confirmed).
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV036
      - CV037
      - CV042
      - CV044
      - CV045
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Gross margin
        - Not publicly disclosed; no filing requirement for private UK parent
        - Determines FCF scalability and the profitability trajectory needed to justify 16x ARR entry
        - Request from CFO in IC process; infer from headcount (~850 employees) and ARR trajectory
      - - Net revenue retention (NRR)
        - Not disclosed; ARR trajectory suggests >100% but unverified
        - Validates revenue quality, enterprise churn risk, and long-term growth sustainability
        - Customer interviews (10 enterprise clients); model from $100M→$200M+ ARR with known headcount
      - - CMA review status and timeline
        - Not public; described as informal review in press; no formal decision timeline published
        - Structural remedy could impair the AIS data moat and precipitate a thesis-break event
        - Legal counsel review; CMA public register monitoring; quarterly check-in
      - - Primary vs secondary capital split
        - Not formally disclosed; Sixth Street announced "over $1B investment"
        - Determines actual new capital on Kpler's balance sheet versus secondary buyout proceeds to Five Arrows
        - Companies House future filings (new charges or debentures); direct confirmation from management
      - - Founder lock-up and involvement post-deal
        - Not disclosed; co-founders resigned UK director roles April 2026
        - Operational continuity and founder motivation are material at this growth stage
        - Review investor agreement; interview Cazor and Maynier directly
      - - Sixth Street preference rights and governance
        - Standard growth equity terms not publicly disclosed
        - Affects common equity waterfall for management, employees, and any future investors
        - Request term sheet; secondary market data on Kpler equity instruments
      - - Customer revenue concentration
        - No top-10 customer breakdown disclosed
        - Single-customer risk could create a cliff in ARR if a major trading house churns
        - Customer interviews; infer from public case studies (Unilever, Renault, Lloyd's)
      - - Post-deal balance sheet and debt profile
        - 2025 credit facilities satisfied in May 2026; new balance sheet unknown
        - Debt overhang could affect acquisition capacity and restrict Kpler's growth strategy
        - Companies House future charge filings; request management financial update
    notes: >-
      Diligence items ranked by estimated conviction impact on the investment recommendation. Items 1 (gross margin) and
      2 (NRR) are blocking diligence asks — their resolution would most likely move the recommendation from TRACK to BUY
      or confirm a AVOID. Items 3 (CMA) and 4 (primary/secondary split) are material but may resolve through external
      monitoring rather than direct management access.
    claimRefs:
      - CV030
      - CV031
      - CV033
      - CV040
      - CV041
      - CV042
      - CV045
