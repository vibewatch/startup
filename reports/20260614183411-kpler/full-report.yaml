            title: Valuation Premium With Entirely Opaque Unit Economics
            body: >-
              At a 13–20× implied ARR multiple, the $4B valuation requires ≥40% organic ARR growth, >70% gross margin,
              and >100% NRR—none audited or publicly confirmed. The absence of consolidated financial disclosures is the
              single largest thesis-critical diligence gap. Any investor underwriting this multiple must treat
              confirmation of audited ARR, NRR by cohort, and organic growth rate as non-negotiable preconditions before
              committing capital.
