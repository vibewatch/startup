  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >
              Kpler's core business is the sale of proprietary trade intelligence data through B2B annual subscription
              contracts. The company operates two complementary platforms: the Kpler Commodities platform covering over
              40 commodity markets, and MarineTraffic providing maritime vessel-tracking and AIS data. Both generate
              subscription revenue based on data access, API usage, and seat count, with enterprise contracts negotiated
              directly through a field sales organization. No public pricing page exists; all commercial terms are
              customized for each account.


              Procurement benchmarking platform Vendr reports the median annual contract value for a Kpler subscription
              at $55,000 per year, with an observed range of $50,000 to $73,800 across buyer types. Enterprise deals
              with trading houses, oil majors, or government entities are materially larger, likely exceeding
              $200,000–$1 million annually, but these are not publicly disclosed. Kpler's newer product lines—Financial
              Flows (systematic CTA positioning data) and Arbitrage Analytics (refining margin and landed-value matrices
              updating every 30 minutes)—target distinct buyer segments, suggesting tiered or premium pricing layers
              beyond the base commodity intelligence subscription.


              The revenue model also incorporates professional services and custom analytics, though the precise revenue
              mix between recurring subscriptions and one-off deliverables is not disclosed. Subscription revenue would
              follow ratable recognition; custom analytics are likely recognized on delivery. Kpler's six-plus
              acquisitions since 2021 (ClipperData, JBC Energy, COR-e, MarineTraffic, FleetMon, ChartDesk, Spire
              Maritime) have added complementary subscription streams, and the MarineTraffic freemium base of over one
              million active users provides a potential upsell and data-enrichment moat that the company has begun to
              monetize through API tiers and premium maritime analytics.
