      - number: '1.3'
        title: Funding History and Investor Map
        blocks:
          - type: paragraph
            body: |
              Kpler has raised approximately $1.2 billion in disclosed capital since its 2014 founding.
              The most significant financing event is the June 3, 2026 announcement of a $1 billion+ minority
              strategic growth equity investment from Sixth Street, a global investment firm managing over $130
              billion in assets under management and committed capital. The transaction values Kpler at nearly
              $4 billion according to multiple independent sources, making it one of the most valuable privately
              held trade intelligence companies globally.

              Under the terms of the deal, management retains majority ownership of Kpler, a notable structure
              for a company at this scale and valuation. Existing investor Insight Partners, a global software
              investor with over $90 billion in regulatory assets under management, rolled a portion of its
              original investment and remains a shareholder. Five Arrows, the corporate private equity arm of
              Rothschild and Co managing €33 billion in assets, fully exited its position as part of the
              transaction. Evercore served as Kpler's sole financial advisor and Goodwin Procter LLP (led by
              Anu Balasubramanian) as legal advisor; Sixth Street was advised by Moelis and Milbank LLP; Insight
              Partners was advised by Willkie Farr and Gallagher LLP; Five Arrows was advised by Shoosmiths LLP.

              The prior institutional round comprised approximately $200 million raised in 2022 from Five Arrows
              and Insight Partners, which fueled a wave of five acquisitions in 18 months. Revenue run-rate,
              gross margin, and customer count all remain undisclosed — material gaps for a ~$4 billion implied
              valuation. Discoperi.com characterizes the deal as a "$1 billion buyout" — a description that
              contradicts the official characterization as a minority growth equity investment — warranting
              caution when interpreting secondary market deal databases.
