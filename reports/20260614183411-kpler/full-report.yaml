      - number: '7.3'
        title: Partner, Dependency, and Market-Structure Risks
        blocks:
          - type: paragraph
            body: |
              Kpler's AIS data infrastructure is now self-owned following the MarineTraffic, FleetMon,
              and Spire Maritime acquisitions, eliminating historical third-party AIS feed dependency.
              However, this consolidation creates a new risk category: Kpler's terrestrial AIS network
              depends on continued participation of 13,000+ receiver station operators globally—a
              community-driven network inherited from MarineTraffic. The FleetMon merge documentation
              demonstrates the complexity of migrating former partner stations to the unified Kpler AIS
              platform; disengagement by volunteer operators in critical coverage zones—straits, chokepoints,
              major ports—would create blind spots. The Jotun case study shows high-frequency Kpler AIS
              data driving $11.11M+ CO₂-savings decisions, underscoring the operational consequences of
              coverage degradation for high-value customers.

              Geopolitical risk is Kpler's most idiosyncratic demand-side threat. Kpler's
              sanctions-monitoring and shadow-fleet analytics products derive substantial value from the
              enforcement environment created by Western sanctions regimes. Any large-scale sanctions
              relief—a US/EU rapprochement with Russia, Iran, or Venezuela—would reduce the market premium
              for sanctions-evasion detection analytics. Kpler's 2026 shadow fleet analysis quantifies
              the exposure: Western-covered vessels represent approximately 43% of Russian oil exports; a
              removal of Western service restrictions would require growth of the shadow fleet by roughly
              476 additional vessels. This analysis is valuable precisely because the enforcement regime
              makes it relevant; policy relaxation would compress demand from compliance-oriented customers.
              The EU price-cap review is a live scenario as of June 2026.

              Key customer concentration is undisclosed but likely material. Kpler serves 10,000+
              organizations but does not disclose individual customer revenue concentration. Enterprise
              commodity trading houses, top oil majors, and government/defense agencies likely represent
              a disproportionate share of ARR given enterprise contract pricing of $200K–$1M+ versus the
              $55K median Vendr ACV. Cloud and technology infrastructure dependencies are also undisclosed:
              real-time processing of 1.3B+ daily AIS signals requires significant hyperscaler capacity
              whose provider identity and BCP architecture have not been publicly confirmed.
              The satisfaction of all credit facilities in May 2026 and Sixth Street's $130B+ AUM reduce
              near-term capital provider dependency risk materially.
