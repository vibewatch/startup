  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Customer Workflow Integration
        blocks:
          - type: paragraph
            body: >
              Kpler's commercial offering is organized into two primary intelligence suites—Commodities and
              Maritime—that converge at the customer workflow layer into a unified data terminal and API surface. The
              Commodities suite covers more than 40 commodity markets: energy (crude oil, LNG, refined products,
              European gas), dry bulk, metals, and agricultural goods. Its modules include Cargo Analytics (real-time
              import/export flows with vessel-level resolution), Freight Analytics (supply/demand analytics for
              chartering and freight rate discovery), Inventory Analytics (satellite-powered onshore storage
              monitoring), Refineries Intelligence (margin, utilization rate, and seaborne crude flow data), Arbitrage
              Analytics (landed-value matrices refreshed every 30 minutes), Risk & Compliance (vessel sanctions and
              shadow fleet screening), and Financial Flows (CTA positioning data for systematic traders). Each module is
              sold as part of annual B2B subscriptions tailored to the specific data needs of commodity traders,
              investment banks, oil majors, utilities, and government agencies.


              The Maritime suite, operated under the Kpler AIS brand since September 2025 (replacing the legacy
              MarineTraffic AIS brand), provides vessel-tracking and maritime intelligence to shipping operators,
              insurers, port authorities, and maritime research organizations. Products include real-time Ship Tracking,
              a Vessels REST API for programmatic access to positions and voyage data, bulk Data Services feeds,
              Historical AIS (10+ years of archived signal data), Data Quality tooling, and Vessel Integrations
              (Inmarsat C and VSAT telemetry combined with AIS for deep-ocean fleet tracking). The freemium
              MarineTraffic consumer platform—with over one million active users—forms an open-access layer that feeds
              brand awareness and potential upsell to commercial AIS tiers.


              In 2025–2026, Kpler added an AI suite comprising Kpler Copilot (a natural-language analytics assistant
              embedded in the Kpler terminal), Kpler MCP (an integration layer enabling analysts to query Kpler data
              from Claude, ChatGPT, and Gemini), and Kpler Agents (domain-specific AI models trained on proprietary
