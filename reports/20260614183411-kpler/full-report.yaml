      - number: '5.4'
        title: Trust, Compliance, Security, and Quality Controls
        blocks:
          - type: paragraph
            body: >
              Kpler has achieved certification against the two principal international frameworks for information
              security and operational assurance. ISO/IEC 27001:2022 covers its information security management system,
              confirming alignment with international best practices for data protection, incident management, and
              continuous monitoring. AICPA SOC 2 Type II confirms that the operational effectiveness of security
              controls has been independently verified over time, supplementing the Type I design-validation
              certification. Together, these certifications reduce third-party risk for enterprise customers subject to
              vendor security review requirements and procurement due-diligence processes.


              The privacy policy (kpler.com/company/privacy) governs EU and non-EU data processing, cookie consent, and
              data-subject access request (DSAR) procedures consistent with GDPR obligations. The code of conduct covers
              employee behaviour, supplier standards, anti-bribery and anti-corruption requirements, and conduct with
              external counterparties. Customer satisfaction scores for the maritime customer segment exceed 90%, per
              the Vessel Integrations product page. Kpler's data quality framework includes a dedicated Data Quality
              module within the Maritime suite, providing tools for AIS signal validation, vessel identity
              deduplication, and spoofed-AIS detection.


              The key unresolved trust risk is the public non-disclosure of specific AIS data-quality metrics
              (false-positive rate, spoof-detection methodology), API SLAs, and uptime statistics. Customers negotiating
              enterprise data agreements must assess these parameters through contractual representations rather than
              published benchmarks. The ongoing UK CMA review represents a regulatory risk that could impose
              data-sharing or pricing obligations that materially affect Kpler's operating model for its combined AIS
