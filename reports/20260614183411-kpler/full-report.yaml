      - number: '6.4'
        title: Retention, Expansion, and Concentration
        blocks:
          - type: paragraph
            body: |
              Kpler has not publicly disclosed NRR, GRR, annual churn, cohort retention, or average
              contract length as of June 2026. The only available proxy is a third-party growth strategy
              analysis that estimates NRR above 110%, which is directionally consistent with the
              land-and-expand pattern observed in the GEODIS case study (6× scope expansion) and the
              multi-module architecture that encourages cross-sell. The estimated cohort retention
              figures in this chapter are modelled from that NRR proxy and SaaS industry benchmarks;
              they are not Kpler-published data and must be treated as illustrative.

              The most concrete land-and-expand evidence is GEODIS: the deployment scaled from 175,000
              tracked containers at pilot stage to over 1 million per year in production, a 6× expansion
              of deployed scope within the same customer account. The MarineTraffic free-to-paid
              conversion funnel provides a second expansion mechanism: 8.5 million registered users
              convert into paying subscribers through tiered product access.

              Customer concentration is an open gap. Kpler has not disclosed the share of ARR
              attributable to its top-5 or top-10 accounts. With 12,000+ organisations as the
              denominator, diversification is plausible — but large commodity trading houses
              (Vitol, Trafigura, Glencore) and major financial institutions are likely to have
              disproportionate ACV due to multi-geography, multi-desk licensing. This remains
              unverifiable without Kpler's account-level revenue data.

              The UK Competition and Markets Authority's review of Kpler's AIS acquisitions introduces
              an adverse structural risk: if the CMA requires mandatory access pricing or divestiture,
              data customers who have embedded Kpler AIS data into their own workflows face supply-side
              cost and continuity risk. Independent AIS analysts have flagged the near-duopoly that Kpler
              and S&P Global now hold over large-scale AIS infrastructure as a concentration risk for
              the broader market.

              Cargo inference methodology is a second adverse signal: Kpler's cargo flow estimates
              are probabilistic, inferring commodity volumes from AIS vessel position signals. An
              independent fact-check found that these estimates can misclassify vessel intentions,
              particularly for vessels making atypical port calls or engaging in ship-to-ship transfers
              in sanctioned contexts. This creates both a data-quality risk for customers who rely on
              cargo flow intelligence and a reputational risk if high-stakes decisions are made on
              over-confident estimates.
