chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: |
              Kpler is a Brussels-headquartered global physical trade intelligence platform incorporated as
              Kpler Holding SA at Avenue des Celtes 20/8, 1040 Brussels, Belgium. Founded in 2014 by François
              Cazor and Jean Maynier, the company started as a two-person startup tracking LNG cargo movements
              and has grown over twelve years into an 850-employee organization operating across 13 offices and
              representing 69 nationalities, serving commodity traders, energy companies, maritime operators,
              and government and defense customers worldwide.

              At its core, Kpler aggregates data from more than 255,000 proprietary sources, over 1.3 billion
              AIS signals per day, and 245,000+ human contributors to create a unified intelligence layer for
              global physical trade. The company's stated mission is to be the definitive intelligence platform
              for global physical trade, driving real-time decisions. Revenue generation is driven by SaaS
              subscriptions to two primary platforms: the Kpler commodity analytics platform covering 40+
              commodities including LNG, crude oil, dry bulk, metals, grains, and chemicals; and the
              MarineTraffic maritime tracking platform covering 300,000+ vessels per day. Kpler also offers
              defense intelligence capabilities and AI-powered tools including the Kpler Copilot AI assistant,
              built on 15+ years of proprietary time-series data. The company claims to have been profitable
              from the start of operations and has remained primarily owned by its founders and team members.
              As of June 2026, Kpler is entering a new growth phase backed by Sixth Street capital targeting
              adjacent market expansion and accelerated product development.
