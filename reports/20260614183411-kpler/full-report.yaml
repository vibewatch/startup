  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Categorization
        blocks:
          - type: paragraph
            body: >
              Kpler competes in a layered market spanning cargo/vessel intelligence, commodity price assessment,
              maritime compliance AI, and lower-tier AIS tracking. Direct competitors are Vortexa (energy cargo
              intelligence) and ClipperData — now embedded in S&P Global Commodity Insights — platforms tracking similar
              vessel-level cargo flows for commodity traders. Incumbent competitors with broader market penetration
              include S&P Global Commodity Insights (heir to the Platts benchmark empire) and Argus Media, both serving
              the same commodity trader, bank, and energy company buyers as Kpler but through a top-down,
              price-assessment-led model rather than Kpler's bottom-up, physical-flow-led approach.

              Adjacent competitors occupy neighbouring problem spaces. Windward targets maritime compliance, sanctions,
              and behavioural-risk segments with a multi-source maritime AI platform that fuses AIS, electro-optical,
              SAR, and RF data — primarily serving financial institutions and government entities rather than commodity
              traders. VesselFinder occupies a lower-tier substitute position, offering commercial AIS vessel tracking
              for shipping professionals at costs well below Kpler's enterprise tiers, without any commodity
              intelligence superstructure.

              Status-quo competition comes from in-house tracking tools maintained by large commodity trading houses
              (Vitol, Trafigura, Glencore), which historically built proprietary vessel and flow monitoring systems.
              These internal builds represent an alternative Kpler must displace through cost-efficiency, data breadth,
              and analytical depth arguments. Likely future entrants are satellite AIS operators; if they vertically
              integrate by adding commodity analytics on top of their raw AIS infrastructure, they could pressure
              Kpler's data-layer pricing while lacking the commodity expertise layer that defines Kpler's full value
              proposition.
