              concern about the near-duopoly Kpler and S&P Global now hold over large-scale AIS infrastructure.
              Independent analysts warn that pricing power concentration — where the data collector, analytics platform,
              and compliance tool are all owned by one entity — removes upstream price tension. Reports of access
              disruptions during acquisition transitions add a supply chain reliability concern for analytics firms
              building on Kpler data. An adverse CMA ruling (divestiture, mandatory access pricing, or structural
