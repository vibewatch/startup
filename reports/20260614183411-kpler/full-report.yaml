            title: CMA Antitrust Review — Structural Tail Risk to AIS Monetization
            body: >-
              The UK CMA's review of Kpler's AIS market consolidation is the most structurally significant regulatory
              risk in this report. A divestiture order or mandated third-party access pricing for Kpler's AIS data would
              impair margins on its highest-quality proprietary data asset. Investors should monitor CMA Phase 2
              referral status and request Kpler's direct correspondence with the CMA as a precondition to finalizing any
              investment commitment.
