  - id: adoption-trajectory-and-scale
    title: Adoption Trajectory and Scale
    body: |
      Kpler's aggregate scale data points to rapid adoption across both of its primary platform
      families. The Rothschild Five Arrows portfolio page — a high-reputation partner source —
      cites "over 12,000 organisations worldwide" using Kpler as of 2026, corroborating the
      broader claims on Kpler's own product pages. Registered MarineTraffic users grew from 3.5
      million in April 2025 to 8.5 million in April 2026, a 143% increase in twelve months,
      according to CEO statements reported by Kalkine Media in April 2026. Over the same period
      Kpler added more than 11,000 net new paying maritime platform users. The Commodities
      platform user base grew 28% year-to-date as of April 2026.

      Product-level adoption metrics from official pages provide further texture. Container
      Intelligence covers 7,800+ container ships across 160+ shipping lines with an 87% ETA
      accuracy rate for forecasts made 7–10 days in advance. The Data Services API processes
      AIS data from 13,000+ receivers globally with historical replay to 2010. The Risk &
      Compliance module monitors 300,000+ vessels, covers 93% complete ownership records, and
      maintains 3+ years of sanctions history.

      ARR progression is directionally confirmed: Kpler's blog announced the $100 million ARR
      milestone as a historical data point, and CEO statements cited by Kalkine indicate a
      $300–400 million ARR target for FY2026. The implied growth rate — roughly 3–4× from the
      $100 million milestone — is consistent with the user-count acceleration data. No
      denominator (total addressable accounts, total API calls, or seat utilisation) is disclosed
      for normalisation.
