  - id: named-customer-proof
    title: Named Customer Proof
    body: |
      Kpler's case study library covers nine named production customers across five verticals.
      All are Kpler-authored and have not been independently validated, but they provide
      production-deployment confirmation, quoted customer representatives, and quantified
      operational outcomes.

      In logistics and supply chain, GEODIS — a global third-party logistics provider — uses
      Container Intelligence to track approximately 1 million containers per year, scaling from
      a 175,000-container pilot, representing a six-fold expansion in deployed scope. Unilever
      monitors 12,000 containers, 1,500 ships, and 190+ countries via AIS data, operating what
      it describes as a "virtual ocean control tower." Renault tracks over 100,000 container
      shipments annually and reduced emergency logistics costs by improving vessel arrival
      visibility. Green Farms Nut Co., an agricultural SME, saves 6–9 hours per week that was
      previously spent on manual vessel tracking.

      In maritime operations and shipping, Jotun — a marine coatings manufacturer — used Kpler
      AIS hull performance data to avoid 11.11 million tonnes of CO₂ in 2024. Banks & Lloyd,
      a shipping brokerage, reduced daily monitoring calls from 10 to 2 by automating vessel
      position alerts. Campbell Bulk reduced duplicate deal emails by 30–50% and saved 4–10
      hours per user per week using Inbox. JohnAsia, a shipping agency, manages 5,000+ emails
      per day through Inbox with a reported 25% productivity gain.

      In marine insurance, CFC Underwriting modernised its marine kidnap-and-ransom (K&R)
      insurance underwriting using live vessel intelligence from Kpler, enabling real-time risk
      scoring. Altares NL, a business-intelligence data provider, is named in a third-party
      customer case on altares.nl without specific outcome disclosure.

      No named customer has publicly confirmed a contract renewal or explicitly described
      multi-year tenure in the available sources.
