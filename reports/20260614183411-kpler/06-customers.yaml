  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-metrics
      missingEvidence: >-
        Kpler has not publicly disclosed NRR, GRR, annual logo churn, cohort retention, or
        average contract length for any customer segment or vintage year as of June 2026.
        The only available proxy is a third-party estimate of NRR above 110% from a single
        non-audited source.
      whyItMatters: >-
        Retention metrics are the single most important indicator of subscription revenue
        quality. Without confirmed NRR and GRR, the durability of Kpler's $300-400M ARR
        target cannot be independently assessed; the third-party estimate may overstate
        retention in a market where commodity cycle downturns or competitive switching are
        plausible.
      diligencePath: >-
        Request management-confirmed NRR, GRR, and annual logo churn from Kpler for the
        last three fiscal years, broken down by product family; request a cohort retention
        analysis by customer vintage year; cross-check against the CRM contract renewal
        pipeline and billing records.
      relatedQuestionRefs:
        - QU013
        - QU024
        - QU025
      relatedTableRefs:
        - TU004

    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        Kpler has not disclosed top-customer revenue concentration. The share of ARR from
        its top-5, top-10, or top-25 accounts is unknown. With large commodity trading houses
        (Vitol, Trafigura, Glencore, Gunvor) as likely clients, actual concentration may be
        significantly higher than the 12,000+ organisations denominator implies.
      whyItMatters: >-
        Material concentration (e.g., top-10 customers exceeding 40% of ARR) would represent
        a structural revenue risk if a major account renegotiates terms or exits the platform;
        this is especially relevant in commodity trading, where budget cycles and desk
        consolidation can cause rapid spend reductions.
      diligencePath: >-
        Request ARR breakdown by customer size tier (top-5, top-10, top-25, top-50 accounts);
        ask for HHI or equivalent concentration metric; interview 3-5 named reference customers
        to understand contract size and renewal behaviour.
      relatedQuestionRefs:
        - QU021
        - QU026
      relatedTableRefs:
        - TU005

    - type: private-evidence-only
      severity: material
      topic: contract-terms-procurement
      missingEvidence: >-
        No public information on typical Kpler enterprise contract length, standard subscription
        terms, ACV by segment, or average sales cycle duration has been identified. The
        Enterprise Plan page confirms SLA and SSO features but does not disclose pricing or
        contract terms.
      whyItMatters: >-
        Contract length and ACV are critical inputs for ARR predictability modelling and
        CAC payback period calculations. Without these, the revenue base cannot be stress-tested
        against downturn scenarios.
      diligencePath: >-
        Request standard enterprise contract template, average contract duration, and ACV
        breakdown by segment from Kpler; review a sample of executed customer contracts from
        the data room; interview the VP of Sales on typical enterprise sales cycle duration.
      relatedQuestionRefs:
        - QU013
        - QU024
      relatedTableRefs:
        - TU004

    - type: missing-source
      severity: minor
      topic: product-vertical-revenue-mix
      missingEvidence: >-
        No source confirms the revenue contribution or seat count by customer vertical or
        product module. The commodity vs. maritime revenue split, and the relative weight of
        insurance vs. logistics customers, are not publicly disclosed.
      whyItMatters: >-
        Vertical revenue mix affects the risk profile of the recurring revenue base: commodity
        trading revenue is cyclically sensitive; insurance and government revenue is typically
        more defensive. Without the mix, the revenue base cannot be appropriately risk-weighted.
      diligencePath: >-
        Request a revenue breakdown by product family (Commodities, Maritime, Insurance/Risk)
        for the most recent three fiscal years; ask for seat count or number of enterprise
        accounts by vertical.
      relatedQuestionRefs:
        - QU004
      relatedTableRefs:
        - TU001

    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof
      missingEvidence: >-
        Nine named customers have been identified from public case studies and partner pages.
        These represent a curated and almost certainly success-biased subset of Kpler's 12,000+
        enterprise organisations. Customers in government, defence, energy trading, and financial
        institutions are notably absent from the publicly available case study library.
      whyItMatters: >-
        A case study library biased toward logistics and shipping outcome metrics may not
        accurately represent the value proposition or renewal dynamics of Kpler's largest
        revenue-generating verticals (commodity trading, financial institutions). Reference
        customers in those verticals are essential for validating ACV, renewal rates, and
        cross-sell depth.
      diligencePath: >-
        Request a structured customer reference list from Kpler with at least one reference
        customer per major vertical; conduct direct interviews with 3-5 customer references
        in commodity trading and financial services to validate outcomes and renewal intent.
      relatedQuestionRefs:
        - QU002
      relatedTableRefs:
        - TU003
