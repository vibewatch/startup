callouts:
  - calloutType: strength
    title: Broad Enterprise Penetration with Documented Land-and-Expand Motion
    body: >-
      With 12,000+ enterprise organisations and 8.5 million registered users as of April 2026,
      Kpler has achieved scale that is unusual for a private B2B data company. The GEODIS
      deployment — scaling from 175,000 containers at pilot to over 1 million in production —
      demonstrates a concrete land-and-expand dynamic, consistent with the third-party NRR
      estimate above 110%. The MarineTraffic free-to-paid funnel provides a product-led growth
      engine that reduces sales cycle friction and seeds enterprise conversion from a large
      awareness pool. Taken together, the evidence supports a durable, expanding revenue base
      rather than a replacement-prone installed base.
    claimRefs:
      - CU001
      - CU005
      - CU006
      - CU012
      - CU031
      - CU033

  - calloutType: risk
    title: Retention and Concentration Data Completely Absent — Material Diligence Gap
    body: >-
      Kpler has not disclosed NRR, GRR, churn rate, cohort retention, average contract length,
      or customer concentration for any segment or time period as of June 2026. This is the
      single largest customer-chapter evidence gap: without these metrics, the durability
      of the subscription revenue base cannot be independently assessed. The third-party NRR
      estimate above 110% is directionally positive but rests on a single non-audited source.
      Customer concentration is structurally uncertain — 12,000+ organisations as a denominator
      is encouraging, but large commodity trading houses likely carry disproportionate ACV,
      creating potential concentration that is invisible from public sources.
    claimRefs:
      - CU030
      - CU031
      - CU034

  - calloutType: risk
    title: UK CMA Review and Cargo Inference Limits Create Adverse Customer Risk
    body: >-
      Two adverse signals constrain the bullish customer narrative. First, the UK Competition
      and Markets Authority opened a review of Kpler's AIS acquisitions, citing concern about
      independent AIS data supply: an adverse ruling requiring divestiture or mandatory access
      pricing would disrupt data customers who have embedded Kpler AIS into their own workflows.
      Second, Kpler's cargo flow intelligence relies on probabilistic inference from AIS signals,
      which can misclassify vessel intentions — a limitation confirmed by an independent
      fact-checking review. Customers relying on cargo flow data for high-stakes trading or
      compliance decisions carry model risk that is not fully disclosed in Kpler marketing
      materials.
    claimRefs:
      - CU035
      - CU036

