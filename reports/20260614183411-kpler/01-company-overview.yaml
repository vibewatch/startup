      severity: material
      topic: acquisitions-2025-2026
      missingEvidence: >-
        Kpler's press page references a CITAC acquisition expanding African intelligence coverage but
        no confirmed date, price, or integration status has been found in available sources for this
        or any other 2025–2026 deal.
