callouts:
  - calloutType: strength
    title: Profitable since inception with founder-led majority ownership
    body: >-
      Kpler claims profitability from the first day of operations — unusual for a high-growth data
      analytics platform at this scale. Management retaining majority ownership post-Sixth Street
      investment minimizes dilution risk and aligns operator incentives with long-term platform
      investment rather than an early exit narrative.
    claimRefs:
      - CO005
      - CO015

  - calloutType: risk
    title: Founder governance departure warrants leadership continuity diligence
    body: >-
      Both co-founders were terminated as formal directors from key UK entities in 2025 and 2026.
      While they remain shareholders and public spokespersons, the structural decoupling from formal
      governance roles raises key-person transition risk. Mark Cunningham's background, contractual
      commitment, and authority over product strategy require independent verification before
      underwriting the ~$4 billion valuation.
    claimRefs:
      - CO013
      - CO014
      - CO012

  - calloutType: insight
    title: "$4B valuation on undisclosed revenue demands data room diligence"
    body: >-
      The Sixth Street investment implies a ~$4 billion enterprise value; however, Kpler discloses no
      ARR, gross margin, net revenue retention, or customer count. The company is private with filing
      obligations primarily through UK Companies House, where group accounts are filed but revenue
      detail is limited. Full financial diligence requires direct data room access and review of audited
      consolidated accounts.
    claimRefs:
      - CO021
      - CO020

