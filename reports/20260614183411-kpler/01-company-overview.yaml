  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-arr
      missingEvidence: >-
        Kpler's annual recurring revenue, revenue run-rate, gross margin, net revenue retention rate,
        and EBITDA are not publicly disclosed. UK Companies House group accounts for Kpler UK Holdco
        (14649126) exist but revenue detail is limited and may lag significantly.
      whyItMatters: >-
        A ~$4 billion implied valuation cannot be assessed without revenue multiples. The absence of
        any disclosed financial metric is the single largest diligence blocker for this report.
      diligencePath: >-
        Request consolidated audited accounts (P&L and balance sheet) from the data room; review UK
        Companies House full accounts filed for Kpler UK Holdco (no. 14649126) for year ending
        Dec 2024.
      relatedQuestionRefs:
        - QO016

    - type: missing-source
      severity: material
      topic: customer-count
      missingEvidence: >-
        Kpler does not disclose customer count, active accounts, logo count, or concentration data.
        Website references "thousands of organisations worldwide" but no specific figure has been
        independently verified.
      whyItMatters: >-
        Customer concentration and churn dynamics are core inputs to revenue quality assessment;
        without this metric, NRR, logo retention, and cohort behaviour cannot be evaluated.
      diligencePath: >-
        Obtain customer list from data room; cross-reference with public case studies on kpler.com;
        run industry reference checks with traders at energy majors, commodity houses, and shipping
        firms.
      relatedQuestionRefs:
        - QO009

    - type: missing-source
      severity: material
      topic: leadership-mark-cunningham
      missingEvidence: >-
        Mark Cunningham's prior career history, exact title at Kpler, equity stake, vesting schedule,
        and notice period under any management agreement are not publicly disclosed.
      whyItMatters: >-
        As implied current CEO, Cunningham's background and commitment terms are central to assessing
        key-person risk, especially in the context of both founders' formal departure from director roles.
      diligencePath: >-
        Review LinkedIn profile; obtain executive employment agreements and vesting schedules from
        data room; conduct reference calls with co-investors or former employees.
      relatedQuestionRefs:
        - QO019
      relatedTableRefs:
        - TO002

    - type: missing-source
      severity: minor
      topic: data-collection-mechanism
      missingEvidence: >-
        Kpler's technical architecture for collecting, validating, and distributing AIS and commodity
        data is not publicly documented; the company references proprietary sources and human
        contributors but provides no technical white papers.
      whyItMatters: >-
        Data collection reliability, signal processing methodology, and proprietary source validation
        are key differentiators; without this detail, data quality moats cannot be independently verified.
      diligencePath: >-
        Review product technical documentation and any available white papers; request data methodology
        documentation from Kpler directly; cross-reference AIS coverage against competitor benchmarks.
      relatedQuestionRefs:
        - QO014

