        Ongoing M&A activity affects integration risk, consolidated headcount, debt capacity, and
        the strategic context for the Sixth Street capital deployment plan.
      diligencePath: >-
        Review Kpler press releases page exhaustively; cross-reference with deal databases; request
        full M&A history and integration status from Kpler management or data room.
