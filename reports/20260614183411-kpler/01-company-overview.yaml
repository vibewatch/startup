  - id: founders-leadership-governance
    title: Founders, Leadership, and Governance
    body: |
      Kpler was founded in 2014 by François Cazor and Jean Maynier, who built the company from
      "humble origins of two engineers in a kitchen" into a global enterprise with over 850 employees.
      Both founders have been central to Kpler's twelve-year growth trajectory and co-authored the
      statement announcing the June 2026 Sixth Street investment, reiterating the shared vision for
      the platform. François Cazor served as CEO at least through 2023, as evidenced by the February
      2023 MarineTraffic acquisition press release.

      The company has undergone material governance transitions in 2025 and 2026. UK Companies House
      filings reveal that both Cazor and Maynier were terminated as directors of Kpler UK Holdco
      Limited on 3 September 2025, and were subsequently terminated as directors of Kpler Ltd on 22
      April 2026. The same April 2026 filing saw Axelle Steurs and Anna Favarin appointed as new
      directors of Kpler Ltd. The Sixth Street announcement explicitly framed the transition as "From
      the foundations laid by François and Jean to the leadership of Mark Cunningham and today's
      management team," confirming that Mark Cunningham now leads operations. Cunningham's prior
      background and specific role title are not publicly disclosed in available sources.

      These governance changes coincide with the satisfaction of debt charges registered at both
      Kpler Ltd (charge 110423870001) and Kpler UK Holdco (charge 146491260001) in May 2026, indicating
      prior debt obligations were discharged ahead of the Sixth Street investment. While founders
      continue to participate as shareholders and public spokespersons, the structural decoupling from
      formal director roles at key UK entities represents a material key-person transition that requires
      diligence on management continuity, delegation of authority, and any lock-in provisions within
      the new investment documentation.
    claimRefs:
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
      - CO038
    tableRefs:
      - TO002
    figureRefs: []

  - id: funding-and-investors
    title: Funding History and Investor Map
    body: |
      Kpler has raised approximately $1.2 billion in disclosed capital since its 2014 founding.
      The most significant financing event is the June 3, 2026 announcement of a $1 billion+ minority
      strategic growth equity investment from Sixth Street, a global investment firm managing over $130
      billion in assets under management and committed capital. The transaction values Kpler at nearly
      $4 billion according to multiple independent sources, making it one of the most valuable privately
      held trade intelligence companies globally.

      Under the terms of the deal, management retains majority ownership of Kpler, a notable structure
      for a company at this scale and valuation. Existing investor Insight Partners, a global software
      investor with over $90 billion in regulatory assets under management, rolled a portion of its
      original investment and remains a shareholder. Five Arrows, the corporate private equity arm of
      Rothschild and Co managing €33 billion in assets, fully exited its position as part of the
      transaction. Evercore served as Kpler's sole financial advisor and Goodwin Procter LLP (led by
      Anu Balasubramanian) as legal advisor; Sixth Street was advised by Moelis and Milbank LLP; Insight
      Partners was advised by Willkie Farr and Gallagher LLP; Five Arrows was advised by Shoosmiths LLP.

      The prior institutional round comprised approximately $200 million raised in 2022 from Five Arrows
      and Insight Partners, which fueled a wave of five acquisitions in 18 months. Revenue run-rate,
      gross margin, and customer count all remain undisclosed — material gaps for a ~$4 billion implied
      valuation. Discoperi.com characterizes the deal as a "$1 billion buyout" — a description that
      contradicts the official characterization as a minority growth equity investment — warranting
      caution when interpreting secondary market deal databases.
