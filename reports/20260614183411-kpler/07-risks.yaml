  - id: operational-technical-security
    title: Operational, Technical, and Security Risks
    body: |
      Kpler's operational risk profile is dominated by data-quality challenges inherent in AIS
      infrastructure. AIS transponders were designed for maritime safety transparency, not
      authentication: signals are unencrypted and unauthenticated, making spoofing—broadcasting
      false position, identity, or voyage data—straightforward for vessels seeking to evade
      detection. Between January 2024 and July 2025, Kpler identified 261 vessels that spoofed
      AIS before being sanctioned, the single largest evasion behavior category. GNSS jamming
      near conflict zones and equipment failures create involuntary AIS gaps that complicate
      cargo-inference algorithms. The 2026 industry review by Commodity Trading Hub characterizes
      Kpler's cargo estimates as probabilistic, noting that false positives and gaps are inherent
      in multi-source AIS inference—particularly for dark fleets operating without transponders.

      Service availability risk is material given real-time processing of over 1.3 billion AIS
      signals per day. The Master Agreement acknowledges platform availability cannot be guaranteed
      and explicitly disclaims liability for service interruptions. Satellite AIS coverage depends
      on the health of Kpler's 100+ nanosatellite constellation (formerly Spire Maritime), subject
      to satellite failure, orbital congestion, and anti-satellite interference risk as geopolitical
      tensions in space intensify. Terrestrial AIS networks depend on 13,000+ receiver stations
      globally; station failures, geopolitical restrictions in conflict zones, or community
      contributor disengagement could create geographic blind spots.

      Cybersecurity risk is material but publicly unassessed. Kpler holds ISO/IEC 27001:2022 and
      AICPA SOC 2 Type II certifications, indicating institutionalized security controls. However,
      no cybersecurity incident disclosures are publicly available, and with 850+ employees across
      13 offices, multi-cloud infrastructure, and APIs used by 10,000+ organizations, Kpler
      represents a high-value target for nation-state and financial criminal actors seeking trade
      intelligence, vessel location data, or sanctions-monitoring analytics.

      The M&A integration backlog presents persistent operational risk. Kpler completed six-plus
      acquisitions since 2021—including the complex $241M Spire Maritime integration—across
      multiple technology stacks. The September 2025 unification of terrestrial, roaming, and
      satellite AIS under the "Kpler AIS" brand shows meaningful progress, but full platform
      consolidation timelines remain undisclosed. Overlapping codebases, data schemas, and billing
      systems create integration fragility that could surface as data quality inconsistencies or
      customer-facing API disruptions during peak market events.
