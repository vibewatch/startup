callouts:
  - calloutType: risk
    title: CMA Antitrust Review — Structural Tail Risk to AIS Monetization
    body: >-
      The UK CMA's review of Kpler's AIS market consolidation is the most structurally significant
      regulatory risk in this report. A divestiture order or mandated third-party access pricing
      for Kpler's AIS data would impair margins on its highest-quality proprietary data asset.
      Investors should monitor CMA Phase 2 referral status and request Kpler's direct
      correspondence with the CMA as a precondition to finalizing any investment commitment.
    claimRefs:
      - CR004
      - CR005
      - CR046

  - calloutType: risk
    title: Valuation Premium With Entirely Opaque Unit Economics
    body: >-
      At a 13–20× implied ARR multiple, the $4B valuation requires ≥40% organic ARR growth,
      >70% gross margin, and >100% NRR—none audited or publicly confirmed. The absence of
      consolidated financial disclosures is the single largest thesis-critical diligence gap.
      Any investor underwriting this multiple must treat confirmation of audited ARR, NRR by
      cohort, and organic growth rate as non-negotiable preconditions before committing capital.
    claimRefs:
      - CR034
      - CR047
      - CR048

  - calloutType: risk
    title: Co-Founder Leadership Transition — Execution Risk Crystallized
    body: >-
      Both founders stepped back from formal director roles (Kpler UK Holdco: September 2025;
      Kpler Ltd: April 2026). Mark Cunningham leads with limited public profile. This is a
      high-consequence governance event: the founders built the product vision, customer
      relationships, and company culture over 12 years. Retention of key technical and
      commercial staff in the 18 months post-Sixth Street investment is the single most
      important monitoring indicator for execution-risk management.
    claimRefs:
      - CR012
      - CR025
      - CR033

