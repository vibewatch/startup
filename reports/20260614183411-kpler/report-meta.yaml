companyProfile:
  summary: >
    Kpler is a Brussels-headquartered global physical trade intelligence platform founded in 2014
    by François Cazor and Jean Maynier, initially as a two-person LNG cargo tracking startup and
    now an 850-employee enterprise spanning 13 offices and 69 nationalities. The company operates
    two converging platforms—Kpler Commodities Analytics (40+ commodities: LNG, crude oil, dry
    bulk, metals, grains, chemicals, containers, pipelines) and Kpler AIS / MarineTraffic Maritime
    Intelligence (300,000+ vessels per day via 13,000+ AIS receivers and 100+ nanosatellites)—
    which together serve 12,000+ enterprise organisations including commodity trading houses,
    energy majors, financial institutions, maritime operators, logistics providers, and
    government/defense customers. Kpler confirmed $100 million ARR in January 2024; third-party
    sources estimate ARR exceeded €200 million (~$215 million) by early 2025. On June 3, 2026,
    Sixth Street invested over $1 billion in a minority growth equity transaction implying an
    enterprise value of approximately $4 billion, with management retaining majority ownership.
    Five Arrows fully exited; Insight Partners rolled a portion of its stake. Both co-founders
    stepped back from UK director roles in 2025–2026, with Mark Cunningham named as the current
    management team leader.
  foundedDate: "2014-01-01"
  founders:
    - name: "François Cazor"
      role: "Co-Founder; CEO (at least through 2023)"
      background: >
        Built Kpler from inception in 2014 as a two-person Brussels startup; served as CEO through
        at least February 2023; stepped back from UK director roles by April 2026.
      claimRefs: ["CO002", "CO011", "CO012"]
    - name: "Jean Maynier"
      role: "Co-Founder"
      background: >
        Co-built Kpler from 2014; active as co-founder and public spokesperson through June 2026;
        terminated as UK director in September 2025 and April 2026.
      claimRefs: ["CO002", "CO013", "CO014"]
  foundingLocation: "Brussels, Belgium"
  headquarters: "Brussels, Belgium"
  productSummary: >
    Kpler sells two converging B2B intelligence platforms: (1) Kpler Commodities—covering cargo
    analytics, freight analytics, inventory analytics, arbitrage analytics, chartering, refining,
    and financial flows across 40+ commodity markets via an annual subscription SaaS model; and
    (2) Kpler AIS / MarineTraffic Maritime Intelligence—ship tracking, container intelligence,
    port intelligence, compliance and risk screening, and maritime data API feeds for 300,000+
    vessels per day. Both platforms share a unified AIS data backbone of 13,000+ terrestrial
    receivers and 100+ nanosatellites acquired through the Spire Maritime acquisition ($241M,
    late 2024). AI-powered tools including Kpler Copilot (NLP analytics assistant) and Kpler MCP
    (model context protocol integration with Claude, ChatGPT, and Gemini) launched in 2025–2026.
  customerFocus: >
    Enterprise commodity trading houses, oil majors, refiners, investment banks and hedge funds,
    shipping companies and maritime operators, logistics and third-party logistics providers,
    utilities, marine insurers, government agencies, and defense intelligence customers across
    190+ countries.
  businessModel: >
    Annual B2B subscription contracts for platform access, API tiers, and data feeds; no public
    self-serve channel. Median contract value benchmarked at $55,000/year (Vendr), with large
    enterprise deals negotiated directly. Revenue mix includes platform subscriptions (dominant),
    API/data-feed access, and professional services. Bootstrapped 2014–2022 prior to first
    institutional investment; company claims profitability from inception.
  stage: "Late-stage private (growth equity)"
  fundingStatus: >
    June 3, 2026: $1 billion+ minority growth equity from Sixth Street at ~$4 billion implied
    valuation; management retains majority ownership. Insight Partners rolled a portion of its
    stake; Five Arrows fully exited. Prior round: ~$200 million from Five Arrows and Insight
    Partners (April 2022), which funded five acquisitions in 18 months. Spire Maritime acquired
    for $241 million in late 2024, partially debt-financed. Total estimated capital raised
    approximately $1.2 billion (Tracxn estimate; unconfirmed by Kpler).
