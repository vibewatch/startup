company:
  name: Kpler
chapter:
  number: 5
  title: Product & Technology
  summary: "Kpler operates two converging intelligence platforms — a Commodities Analytics suite covering 40+ markets and a Maritime Intelligence suite anchored by the world's largest AIS receiver network (13,000+ stations, 1B+ signals/day) — increasingly unified by an AI layer (Copilot, MCP, Agents) trained on 15 years of proprietary data. The platform's technical moat is the accumulated terrestrial and satellite AIS infrastructure assembled through acquisitions of MarineTraffic, FleetMon, and Spire Maritime, which is practically irreplicable. ISO/IEC 27001:2022 and SOC 2 Type I/II certifications confirm information-security maturity, while the UK CMA's review of the acquisitions and independent analyst warnings about pricing-power concentration represent the key product-level risk for data-dependent customers and competing data buyers."

sections:
  - id: product-portfolio-workflow
    title: Product Portfolio and Customer Workflow Integration
    body: |
      Kpler's commercial offering is organized into two primary intelligence suites—Commodities and Maritime—that converge at the customer workflow layer into a unified data terminal and API surface. The Commodities suite covers more than 40 commodity markets: energy (crude oil, LNG, refined products, European gas), dry bulk, metals, and agricultural goods. Its modules include Cargo Analytics (real-time import/export flows with vessel-level resolution), Freight Analytics (supply/demand analytics for chartering and freight rate discovery), Inventory Analytics (satellite-powered onshore storage monitoring), Refineries Intelligence (margin, utilization rate, and seaborne crude flow data), Arbitrage Analytics (landed-value matrices refreshed every 30 minutes), Risk & Compliance (vessel sanctions and shadow fleet screening), and Financial Flows (CTA positioning data for systematic traders). Each module is sold as part of annual B2B subscriptions tailored to the specific data needs of commodity traders, investment banks, oil majors, utilities, and government agencies.

      The Maritime suite, operated under the Kpler AIS brand since September 2025 (replacing the legacy MarineTraffic AIS brand), provides vessel-tracking and maritime intelligence to shipping operators, insurers, port authorities, and maritime research organizations. Products include real-time Ship Tracking, a Vessels REST API for programmatic access to positions and voyage data, bulk Data Services feeds, Historical AIS (10+ years of archived signal data), Data Quality tooling, and Vessel Integrations (Inmarsat C and VSAT telemetry combined with AIS for deep-ocean fleet tracking). The freemium MarineTraffic consumer platform—with over one million active users—forms an open-access layer that feeds brand awareness and potential upsell to commercial AIS tiers.

      In 2025–2026, Kpler added an AI suite comprising Kpler Copilot (a natural-language analytics assistant embedded in the Kpler terminal), Kpler MCP (an integration layer enabling analysts to query Kpler data from Claude, ChatGPT, and Gemini), and Kpler Agents (domain-specific AI models trained on proprietary commodity and maritime datasets). These AI tools are positioned to transition Kpler from a data-access platform to an autonomous-intelligence layer processing satellite feeds, customs data, AIS positions, and market signals simultaneously. As of June 2026, Kpler serves over 10,000 organizations globally across 190+ countries.
