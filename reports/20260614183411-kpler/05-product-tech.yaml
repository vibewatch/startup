  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: technology-architecture
      missingEvidence: "Kpler has not publicly disclosed API SLAs, uptime statistics, or rate-limit specifications for the Vessels API or Kpler Terminal, making it impossible to independently assess service reliability commitments."
      whyItMatters: "Enterprise data-contract negotiations require SLA benchmarks; absence of public SLA data pushes all risk assessment to contractual representations, creating information asymmetry for prospective customers."
      diligencePath: "Request SLA documentation, uptime history, and incident postmortem reports during enterprise procurement; review any SLA clauses in sample contracts from existing customers."
      relatedQuestionRefs:
        - QE019

    - type: private-evidence-only
      severity: material
      topic: AI-suite
      missingEvidence: "No public documentation on Kpler Copilot or Agent hallucination rates, model confidence intervals, or accuracy benchmarks against standard commodity flow datasets has been found."
      whyItMatters: "AI-generated commodity intelligence used in trading decisions carries model-accuracy risk; without accuracy benchmarks, buyers cannot assess the reliability of AI-driven insights versus raw data."
      diligencePath: "Request model accuracy documentation, backtesting results against historical commodity flow data, and incident reports for AI-generated errors from Kpler's data science team."

    - type: missing-source
      severity: material
      topic: competitive-moat
      missingEvidence: "Independent third-party head-to-head comparison of Kpler's commodity intelligence data coverage, latency, and accuracy against S&P Global Commodity Insights has not been located."
      whyItMatters: "Without a neutral comparison, differentiation claims are based solely on Kpler's self-reporting and anecdotal customer feedback; S&P Global's ORBCOMM satellite AIS acquisition may close the coverage gap."
      diligencePath: "Commission a third-party data quality study or locate independent analyst coverage of the Kpler vs. S&P Global head-to-head; review customer procurement evaluations if accessible."
      relatedQuestionRefs:
        - QE025

    - type: missing-source
      severity: minor
      topic: regulatory-risk
      missingEvidence: "The UK CMA review of Kpler's acquisitions has not produced a public decision or remedies order as of the June 2026 run date; the review's scope, timeline, and likely outcome are not publicly documented."
      whyItMatters: "A CMA decision requiring data-sharing, pricing constraints, or divestiture could materially alter Kpler's AIS data monetization model and pricing power."
      diligencePath: "Monitor CMA published case register (gov.uk/cma-cases) for the Kpler merger inquiry; obtain legal counsel's assessment of likely remedies based on CMA precedents in data-market consolidations."
      relatedQuestionRefs:
        - QE009

    - type: private-evidence-only
      severity: minor
      topic: data-quality
      missingEvidence: "Kpler's AIS Data Quality module description does not publicly disclose specific false-positive rates for spoofed-AIS detection, signal deduplication methodology, or uptime metrics for the live AIS feed."
      whyItMatters: "Data quality metrics are a key diligence input for customers using Kpler AIS for high-stakes applications such as sanctions compliance, insurance underwriting, and physical commodity trading."
      diligencePath: "Request a data quality white paper or audit report from Kpler's maritime data team; review any published benchmark comparisons in academic or industry publications."
