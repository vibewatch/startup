      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: TRACK —— 估值偏高，需披露数据后才能建立信心
            body: >-
              Kpler 是一家真正出色的 B2B 数据公司，拥有可防守的 AIS 数据护城河、亮眼的 ARR 增长和任务关键型订阅模式。但 2026 年 6 月 Sixth Street 进入时隐含约 16x
              ARR，相比公开数据分析同行偏高，包括最贴近的可比 MSCI（13.5x P/S）。在未披露毛利率和 NRR 的情况下，这一倍数无法独立验证。英国 CMA
              审查、联合创始人治理过渡和未披露交易结构，共同使评级维持在 TRACK。若出现下行重估事件（CMA 不利结果、NRR 低于 100%），熊市情景会变成基准情景。若出现正向催化（财务披露显示 65%+ 毛利率和
              115%+ NRR），建议可上调至 BUY。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV011
              - CV018
              - CV029
              - CV030
          - type: callout
            title: 造就护城河的 AIS 整合，也可能摧毁护城河
            body: >-
              Kpler 专有 AIS 数据基础设施，是其数据护城河的核心，也是溢价倍数的主要理由；这套基础设施由三笔正在接受英国 CMA 审查的收购拼成。worldwideais.org 2026 年分析明确指出，Kpler
              从 AIS 传感器到分析平台的垂直整合造成定价权集中，且「没有上游竞争者制造价格张力」。如果 CMA 将其认定为反竞争并下令结构性补救，数据护城河会被直接削弱。这个单一风险因素本身，就足以把估值完全推向熊市结果。
            calloutType: risk
