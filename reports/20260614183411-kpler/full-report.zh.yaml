  - id: TV005
    title: 推翻投资假设与退出触发器
    columns:
      - 触发器
      - 阈值
      - 对投资假设的传导
      - 行动含义
    rows:
      - - CMA 结构性补救
        - 被迫剥离 MarineTraffic 或 Spire Maritime
        - 数据护城河遭到不可逆削弱；Kpler 变成纯软件分析平台
        - 任何可实现倍数都应退出；没有恢复情景能守住 16x ARR 入场价
      - - 披露 NRR 低于 100%
        - 任何面向投资者的披露中，净收入留存低于 100%
        - 收入增长叙事坍塌；企业客户流失拖垮 ARR 轨迹
        - 要求下轮估值保护；重新谈判治理权
      - - ARR 增长减速
        - ARR 同比增速连续两个季度低于 15%
        - 估值向上市可比公司的 8–10x 区间坍塌；基准情景 IRR 转负
        - 重新评估持仓；寻求二级流动性；推动董事会讨论战略选项
      - - 毛利率低于 50%
        - 任一时点披露的毛利率低于 50%
        - 单位经济模型不足以支撑盈利扩张；战略买家兴趣下降
        - 要求资本效率改善计划；重新考虑跟投
      - - CEO 离任或治理扰动
        - Mark Cunningham 离任，或创始人完全退出运营角色
        - 增长拐点叠加治理过渡，执行风险骤升
        - 暂停跟投资金；下一次出资前要求改善治理
      - - 全行业 P/S 重估
        - 数据分析公司 P/S 中位数连续 6 个月低于 5x
        - IPO 退出窗口关闭；战略收购倍数下修
        - 加速 IPO 准备，或执行股息再资本化以返还资本
      - - 战略买家退出市场
        - SPGI、ICE 和 Bloomberg 在 Kpler IPO 前全部收购竞品平台
        - 最优战略退出路径关闭；只能以更低倍数卖给二级 PE
        - 寻找非传统买家（大宗商品贸易商、主权财富基金）
    notes: >-
      触发器按对投资假设的估计损害程度排序，而非发生概率。考虑到当前证据缺口，CMA 结果和 NRR 披露是优先级最高的两个监控项。行动含义假设 Sixth Street
      持有少数股权，并拥有包括信息权和董事会观察员席位在内的治理权（这一规模的成长股权投资通常如此；尚未正式确认）。
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV036
      - CV037
      - CV042
      - CV044
      - CV045
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 毛利率
        - 未公开披露；英国私有母公司无申报要求
        - 决定 FCF 的可扩展性，以及证明 16x ARR 入场价所需的盈利轨迹
        - 在 IC 流程中向 CFO 索取；结合员工数（约 850 人）和 ARR 轨迹推算
      - - 净收入留存（NRR）
        - 未披露；ARR 轨迹暗示 >100%，但未验证
        - 验证收入质量、企业客户流失风险和长期增长可持续性
        - 客户访谈（10 家企业客户）；用已知员工数建模 $100M→$200M+ ARR
      - - CMA 审查状态与时间表
        - 未公开；媒体称为非正式审查；未发布正式决策时间表
        - 结构性补救可能削弱 AIS 数据护城河，并触发推翻投资假设的事件
        - 法律顾问审查；监控 CMA 公开登记；季度跟进
      - - 一级 / 二级资本拆分
        - 未正式披露；Sixth Street 宣布「超过 $1B 投资」
        - 决定进入 Kpler 资产负债表的实际新增资本，还是支付给 Five Arrows 的二级收购款
        - Companies House 后续备案（新增担保或债券）；管理层直接确认
      - - 创始人锁定期与交易后参与度
        - 未披露；联合创始人于 2026 年 4 月辞任英国董事职务
        - 这一增长阶段，运营连续性和创始人动力都很关键
        - 审阅投资者协议；直接访谈 Cazor 和 Maynier
      - - Sixth Street 优先权与治理
        - 标准成长股权条款未公开披露
        - 影响管理层、员工和未来投资者的普通股分配瀑布
        - 索取条款清单；收集 Kpler 股权工具的二级市场数据
      - - 客户收入集中度
        - 未披露前 10 大客户拆分
        - 若大型贸易商流失，单一客户风险可能让 ARR 出现断崖
        - 客户访谈；从公开案例（Unilever、Renault、Lloyd's）推断
      - - 交易后资产负债表与债务结构
        - 2025 年信贷安排已于 2026 年 5 月清偿；新资产负债表未知
        - 债务包袱可能影响收购能力，并约束 Kpler 增长战略
        - Companies House 后续抵押备案；要求管理层更新财务信息
    notes: >-
      尽调事项按对投资建议置信度的估计影响排序。第 1 项（毛利率）和第 2 项（NRR）是阻断性尽调问题——解决后最可能把建议从「跟踪」推向 「买入」，或确认「回避」。第 3 项（CMA）和第 4 项（一级 /
      二级拆分）也很重要，但可能通过外部监控解决，而不是直接接触管理层。
    claimRefs:
      - CV030
      - CV031
      - CV033
      - CV040
      - CV041
      - CV042
      - CV045
figures:
  - id: FO001
    title: Kpler 里程碑时间线
    type: timeline
    layout: wide
    summary: 按时间顺序梳理 Kpler 的创立、大宗商品扩张、并购计划、治理变化，以及 2026 年 6 月 Sixth Street 投资。
    data:
      items:
        - label: Kpler 创立
          date: '2014'
          detail: Cazor 和 Maynier 在布鲁塞尔推出 LNG 船货追踪；第一天就盈利。
          tone: neutral
        - label: 原油扩张
          date: '2017'
          detail: 平台从 LNG 延伸到原油追踪；多商品模型成型。
          tone: neutral
        - label: ~$200M Series D 轮
          date: '2022'
          detail: Five Arrows 和 Insight Partners 投资；随后 18 个月内完成五起收购。
          tone: positive
        - label: 收购 MarineTraffic 与 FleetMon
          date: 2023-02
          detail: 加入海事 AIS 情报；员工数达到 500+，用户基数超过 1M。
          tone: positive
        - label: 英国控股公司成立
          date: 2023-02
          detail: Kpler UK Holdco Limited 在 Companies House 注册（编号 14649126）。
          tone: neutral
        - label: 创始人退出英国控股公司董事会
          date: 2025-09
          detail: Cazor 和 Maynier 不再担任 Kpler UK Holdco Limited 董事（2025 年 9 月 3 日）。
          tone: risk
        - label: 创始人退出 Kpler Ltd 董事会
          date: 2026-04
          detail: 两位创始人均不再担任 Kpler Ltd 董事；Steurs 和 Favarin 获任命。
          tone: risk
        - label: Sixth Street 投资 $1B+
          date: 2026-06
          detail: 少数股成长股权投资，隐含估值约 $4B；管理层保留多数股权。
          tone: positive
    approximationNotes: 2014 年创立和 2017 年原油扩张的具体月份为近似值；Companies House 注册和备案日期为精确日期。投资公告日期为 2026 年 6 月 3 日。
