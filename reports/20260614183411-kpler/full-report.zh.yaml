companyProfile:
  summary: >
    Kpler 是一家总部位于布鲁塞尔的全球实体贸易情报平台，François Cazor 与 Jean Maynier 于 2014 年创立。公司最初只有两人，做 LNG 货运跟踪，如今已扩展为 拥有 850 名员工、覆盖 13
    个办公室和 69 个国籍的企业。公司运营两条正在汇合的平台线—— Kpler Commodities Analytics（覆盖 40+ 大宗商品：LNG、原油、干散货、金属、谷物、 化学品、集装箱、管道）以及 Kpler AIS /
    MarineTraffic Maritime Intelligence（通过 13,000+ 个 AIS 接收器和 100+ 颗纳米卫星，每天覆盖 300,000+ 艘船）——合计服务 12,000+
    家企业组织，包括大宗商品贸易商、能源巨头、金融机构、海事运营商、物流服务商、 政府和国防客户。Kpler 于 2024 年 1 月确认 ARR 达 $100 million；第三方来源估算， 到 2025 年初 ARR 已超过
    €200 million（约 $215 million）。2026 年 6 月 3 日， Sixth Street 以少数股权成长资本交易向 Kpler 投资超过 $1 billion，隐含企业价值约 $4
    billion，管理层保留多数股权。Five Arrows 全部退出；Insight Partners 将部分持股滚入。 两位共同创始人于 2025–2026 年退出英国董事角色，Mark Cunningham
    被称为当前管理团队负责人。
