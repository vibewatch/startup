      - number: '6.2'
        title: 采用轨迹与规模
        blocks:
          - type: paragraph
            body: |
              Kpler 的总体规模数据指向其两大平台家族都在快速采用。Rothschild Five Arrows 投资组合页面——声誉较高的伙伴来源——称截至 2026 年，
              “全球超过 12,000 家组织”使用 Kpler，印证了 Kpler 自有产品页上的更广泛主张。CEO 发言经 Kalkine Media 于 2026 年 4 月报道：
              MarineTraffic 注册用户从 2025 年 4 月的 350 万增至 2026 年 4 月的 850 万，十二个月增长 143%。
              同期 Kpler 新增超过 11,000 名净新增付费海事平台用户。Commodities 平台用户基础截至 2026 年 4 月年初至今增长 28%。

              官方页面上的产品层级采用指标提供了更多质感。Container Intelligence 覆盖 7,800+ 艘集装箱船、160+ 条航线，
              对提前 7–10 天做出的预测达到 87% ETA 准确率。Data Services API 处理来自全球 13,000+ 个接收器的 AIS 数据，
              并提供回溯至 2010 年的历史回放。Risk & Compliance 模块监控 300,000+ 艘船舶，覆盖 93% 完整所有权记录，
              并维护 3 年以上制裁历史。

              ARR 进展得到方向性确认：Kpler 博客宣布 $100 million ARR 里程碑是一个历史数据点；Kalkine 引述的 CEO 发言显示，
              FY2026 ARR 目标为 $300–400 million。隐含增速——大约是 $100 million 里程碑的 3–4×——与用户数加速数据一致。
              公司没有披露用于标准化的分母（总可服务账户、总 API 调用或席位利用率）。
