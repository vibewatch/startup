      - number: '5.2'
        title: 技术架构与数据运营
        blocks:
          - type: paragraph
            body: >
              Kpler 的技术栈横跨四层架构：数据采集、数据处理与集成、分析与情报、交付。采集层的差异在于规模和多模态。 陆基 AIS 层继承自 MarineTraffic 和 FleetMon（2023 年 2
              月收购），依托全球 13,000 多个自有地面接收器， 并由 Vessel Integrations 产品集中的 6,600+ 个 AIS 接收站补充。卫星 AIS 层来自 2024 年 11 月以 $241
              million 收购 Spire Maritime，新增 100 多颗纳米卫星星座，可在陆基覆盖之外的远洋区域提供 15 分钟全球刷新率。Roaming AIS 补齐区域盲点。Vessel
              Integrations 通过接入 VSAT 和 Inmarsat C 卫星遥测数据进一步延展追踪，使 AIS 信号传播不足的船队运营商也能获得覆盖。合计来看，系统每天处理超过 10 亿条 AIS 信号。


              数据处理层对进入的 AIS 消息做标准化，对来自多个接收器的信号去重，验证质量，并应用货物归因算法， 把船舶移动转化为大宗商品流量估计。这需要把 AIS
              位置与港口停靠记录、船舶登记、历史货物舱单和多个司法辖区的海关数据关联。 在 AIS 推断不足的地方，系统叠加卫星图像，用于陆上资产监测——原油储罐液位和 LNG 终端活动。分析层则拼出情报产品：
              时间序列流量数据库、供需平衡、市场报告和 AI 派生预测。


              Kpler 的工程文化可从其 GitHub 组织推断：公开仓库包括 IoT AIS station firmware、Java/Scala/Python 工程 kata、Terraform Auth0
              provider 和 pre-commit hook 工具。这反映出一个重数据工程的环境， 与 Python/Scala 流式管道和云基础设施相匹配。招聘信息确认 Python、Kafka
              和云基础设施（AWS/GCP）是核心技术栈元素。 Kpler MCP 集成确认公司坚持 API-first 交付：分析师现在可以把 Kpler 情报直接嵌入 LLM 工作流。 FleetMon 于 2024 年
              1 月停止独立运营，并完整迁移到 MarineTraffic 社区平台，AIS station 数据得到保留， 操作方被导向统一的 Kpler/MarineTraffic 网络。
