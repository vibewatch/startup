  - id: FV002
    title: 估值对 ARR 估算和倍数的敏感性
    type: bar
    layout: standard
    summary: 隐含企业价值敏感性，展示 Kpler 的 $4B 入场价格如何对应不同 ARR 估算和收入倍数；上市可比公司倍数作为参考区间。
    data:
      items:
        - label: $200M ARR × 20x
          value: 4000
          group: Sixth Street Implied EV ($M)
        - label: $250M ARR × 16x
          value: 4000
          group: Sixth Street Implied EV ($M)
        - label: $332M ARR × 12x
          value: 3984
          group: Sixth Street Implied EV ($M)
        - label: MSCI 13.5x × $250M ARR 估值锚点
          value: 3375
          group: MSCI-Equivalent Valuation ($M)
        - label: 同业中位数 7.8x × $250M ARR
          value: 1950
          group: Public Peer Median Valuation ($M)
        - label: SPGI 7.9x × $250M ARR 估值锚点
          value: 1975
          group: Public Peer Median Valuation ($M)
        - label: 公允价值估算（基准）
          value: 2500
          group: Fair Value Estimate ($M)
    approximationNotes: >-
      ARR 估算使用 $200M（Baird Maritime 的 €200M+ 按 1.075 汇率折算）、$250M（分析师区间中点）和 $332M（Tracxn 估算）作为替代基准。倍数来自截至 2026 年 6
      月的上市可比公司分析。“公允价值估算（基准）”是指示性分析师估算，假设达到 MSCI 等同倍数质量溢价，并叠加 20% 私募市场流动性折价。
