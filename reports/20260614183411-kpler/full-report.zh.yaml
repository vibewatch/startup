      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: |
              François Cazor 与 Jean Maynier 于 2014 年创立 Kpler，把公司从「厨房里两个工程师」
              的朴素起点，做成拥有 850 多名员工的全球企业。两位创始人一直是 Kpler 十二年增长轨迹的核心，
              并共同署名发布 2026 年 6 月 Sixth Street 投资公告，重申平台的共同愿景。2023 年 2 月
              MarineTraffic 收购新闻稿显示，François Cazor 至少到 2023 年仍担任 CEO。

              2025 年和 2026 年，公司治理出现实质变化。英国 Companies House 文件显示，Cazor 与
              Maynier 于 2025 年 9 月 3 日被终止 Kpler UK Holdco Limited 董事职务，随后又于
              2026 年 4 月 22 日被终止 Kpler Ltd 董事职务。同一份 2026 年 4 月文件显示，Axelle
              Steurs 和 Anna Favarin 被任命为 Kpler Ltd 新董事。Sixth Street 公告明确把这次交接表述为
              「从 François 和 Jean 奠定的基础，到 Mark Cunningham 和当今管理团队的领导」，确认
              Mark Cunningham 目前主导运营。可得来源未公开 Cunningham 的此前背景和具体职务头衔。

              这些治理变化与 2026 年 5 月 Kpler Ltd（押记 110423870001）和 Kpler UK Holdco
              （押记 146491260001）两处债务押记获清偿同时发生，说明 Sixth Street 投资前，既有债务义务
              已经解除。创始人仍作为股东和公开发言人参与公司，但从关键英国实体正式董事角色中结构性脱钩，
              构成实质关键人交接风险。承销约 $4 billion 估值前，需要尽调管理层连续性、授权委托安排，
              以及新投资文件中的任何锁定条款。
