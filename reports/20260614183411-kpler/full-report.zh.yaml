        - Kpler UK Holdco 的 UK Companies House 集团账目（2024 年 12 月，54 页，2025 年 9 月提交）——未检索备案则无法公开访问
        - 向 Kpler 索取经审计合并账目；直接检索 CH 备案
      - - 分细分市场毛利率
        - 在 $4B 估值下，约 60-80% 的毛利率区间会让 DCF 企业价值相差 $500M–$1B+
        - 同业基准（S&P Commodity Insights、Argus）：60–80%
        - 要求提供含分部 COGS 拆分的管理账
      - - 净收入留存率（NRR）
        - NRR >100% 时估值倍数更能站住；NRR <100% 时，增长故事只靠新客户
        - 无可用代理；并购抬高表观 ARR，掩盖底层流失
        - Kpler CRM 中的 cohort 级订阅数据；审计师复核递延收入滚动表
      - - 客户数量和集中度
        - 单一客户集中，或 HHI 超过 20%，会在 $4B 估值下制造收入质量风险
        - CBInsights 列出客户，但没有数量或集中度数据
        - 获取完整客户名单及 ARR 贡献；识别前 10 大账户占比
      - - Spire Maritime 收入贡献
        - 2024 年末 $241M 收购；内生整合收入未从 ARR 总额中拆出
        - Baird Maritime 报道 2025 年集团 ARR 估计 >€200M（含 Spire）
        - 要求提供 Spire 独立 ARR 和收入协同模型
      - - 烧钱速度和现金余额
        - 决定下一次外部融资事件前的实际 runway 长度
        - 无公开数据；$1B 股权流入意味着近期 runway 充足
        - 获取季度管理账和现金流量表
    notes: >-
      所有缺口均被标记为「阻塞」或「重大」严重程度。UK Companies House 集团账目存在，但本次审阅期间无法取得公开数字文本，因此未在此复现。Baird Maritime 的 2025 年 ARR
      估计（>€200M）来自第三方，可能不同于公司内部 ARR 定义。
