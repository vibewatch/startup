      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: |
              Kpler 所在市场同时面对结构性顺风和实质约束：前者加快采用，后者限制 SAM 渗透速度。

              关键增长驱动：围绕俄罗斯、伊朗和委内瑞拉原油的制裁复杂度，是近期第一驱动。尽管西方制裁持续，
              俄罗斯到 2026 年仍维持约 3.5 mbd 海运原油出口，买家和风险经理需要识别受制裁船舶航线与折价动态，
              因而持续需要实时货运跟踪。中国 2025 年向陆上库存增加约 100 million 桶原油，使库存达到
              1.2 billion 桶（77 天消费量），拉动 Kpler 库存和储存分析需求，用以监测中国缓冲角色。
              IMO Carbon Intensity Indicator（CII）、EEXI 以及欧盟 FuelEU Maritime 法规，正迫使海事运营商
              跟踪船舶性能数据，扩大 Kpler 的合规市场。能源转型分析——覆盖 LNG、绿氨、生物燃料和碳信用流——
              正创造一类新买家；这些买家需要跟踪基础设施，服务过去不需要船舶级实时情报的商品流。

              关键采用约束：第一，货物推断不确定性是结构性的：Kpler 的概率模型用 AIS 信号、吃水变化、挂港和装船记录
              推断货物；大型原油和 LNG 货物确定性较高，多等级 parcel、船对船转运和内陆流动确定性较低。这限制了
              需要确定性法律证明或结算级证明的用例。第二，英国 CMA 已对 Kpler 的 AIS 收购（MarineTraffic、
              FleetMon、Spire Maritime）启动正式审查，评估其对海事数据市场的反竞争影响；不利裁决可能要求剥离或
              采取访问补救。第三，切换成本高，这会锁住 Kpler 既有客户，但也拖慢初始采用：已经集成 API、并让分析师
              适应 Kpler 工作流的买家，若要更换平台需要数月重新集成。第四，多商品、高 API 调用量的企业部署价格上升很快，
              给中腰部交易公司带来预算约束，并限制长尾 SAM 渗透。第五，据报道，一些基于 Kpler 数据 feed 搭建产品的
              分析公司在收购交接期遭遇服务中断，由此产生的供应商集中度风险担忧，可能拖慢需要数据供应链韧性的企业买家采用。
