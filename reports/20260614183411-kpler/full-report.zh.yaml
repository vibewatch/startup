  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >
              Kpler 的核心业务，是通过 B2B 年度订阅合同销售专有贸易情报数据。公司运营两个互补平台： Kpler Commodities 平台覆盖 40 多个大宗商品市场，MarineTraffic
              则提供海事船舶跟踪和 AIS 数据。 两个平台都基于数据访问、API 使用和席位数产生订阅收入，企业合同由现场销售团队直接谈判。 没有公开定价页；所有商业条款都按账户定制。


              采购基准平台 Vendr 报告，Kpler 订阅的年度合同价值中位数为每年 $55,000，不同买家类型的观察区间为 $50,000 至 $73,800。贸易商、石油巨头或政府实体的企业交易显著更大，可能超过每年
              $200,000–$1 million，但这些数据未公开披露。Kpler 较新的产品线——Financial Flows （系统性 CTA 持仓数据）和 Arbitrage Analytics（炼油利润率与
              landed-value 矩阵，每 30 分钟更新）—— 瞄准不同买家细分，说明基础大宗商品情报订阅之上可能存在分层或溢价定价。


              收入模式也包含专业服务和定制分析，但经常性订阅与一次性交付之间的精确收入结构未披露。订阅收入应按期确认； 定制分析可能在交付时确认。Kpler 自 2021 年以来完成六项以上收购（ClipperData、JBC
              Energy、COR-e、 MarineTraffic、FleetMon、ChartDesk、Spire Maritime），带来互补订阅流；MarineTraffic 超过 一百万活跃用户的 freemium
              基础，则提供潜在上售和数据增强护城河，公司已开始通过 API 层级和高级海事分析变现。
