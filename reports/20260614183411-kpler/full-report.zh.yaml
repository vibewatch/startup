  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与合规风险
        blocks:
          - type: paragraph
            body: |
              Kpler 最具结构性意义的监管敞口，是英国 Competition and Markets Authority（CMA）审查。审查由其 2023–2025 年收购潮触发——
              MarineTraffic、FleetMon 和 Spire Maritime——这轮并购在 24 个月内把全球 AIS 数据市场从多供应商生态压缩为与
              S&P Global/ORBCOMM 并列的近双寡头。WorldwideAIS.org（2026）确认 CMA 已启动审查，并指出数据采集基础设施与分析平台的垂直整合，
              可能影响定价动态并削弱创新激励。截至 2026 年 6 月，尚无正式补救措施公开宣布。剥离令或访问定价义务将实质削弱 Kpler
              的 AIS 数据变现模式，并构成投资人应密切监控的尾部风险。

              在 GDPR 下，Kpler 处理大量 EU 个人数据：平台用户身份、岗位、组织归属、IP 地址和行为使用指标。其公开隐私政策记录了基于合法利益和合同必要性的处理。
              GDPR Article 83 对严重违规的罚款可高达全球年营业额的 4%。Kpler 用于制裁监控的 Risk & Compliance 产品增加敏感性：
              客户处理的合规数据若出错，可能触发对客户的监管审查，并连带提高 Kpler 的声誉风险。本研究未发现针对 Kpler 的公开执法行动。

              Kpler 的合同框架积极限制责任。Master Agreement 将每个订单的总累计责任上限设为实际已付费用与 £10,000 二者孰高，
              排除所有间接和后果性损失，并明确允许 Kpler 修改或移除平台上的第三方数据且不承担责任。Terms of Use 声明数据按“as is”提供，
              并禁止未经事先书面同意在第三方诉讼中使用 Kpler 数据。这些保护降低法律敞口，但如果高风险决策——制裁清关、保险承保——依赖的数据最终被证明不准确，
              就会制造客户关系风险。CFC 案例研究显示，MarineTraffic/Kpler AIS 数据已用于海事绑架与赎金保险承保，这是一个高责任场景。

              OFAC 和英国 OFSI 维持活跃执法计划，目标包括通过海事渠道规避制裁，例如 AIS spoofing 和 dark STS transfers。Kpler
              作为数据提供方本身不直接面临制裁风险；但其合规分析若重大未能识别已知规避模式，或误报损害合规运营商，将产生显著声誉敞口。
              IMO 曾谴责在网上公开 AIS 数据可能损害海上安全与保安，显示 AIS 数据权利的监管解释正在演变。Modern Slavery Act
              合规通过年度公开声明处理，该声明承认供应链敞口较低但并非为零。Kpler 的 ABC Policy 禁止 facilitation payments，
              并对全球 850+ 名员工和第三方业务伙伴施加强制反腐控制。
