chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: |
              Kpler 是一家总部位于布鲁塞尔的全球实体贸易情报平台，法定主体为
              Kpler Holding SA，注册地址 Avenue des Celtes 20/8, 1040 Brussels, Belgium。
              François Cazor 与 Jean Maynier 于 2014 年创立公司，起初两个人跟踪 LNG
              货物流向，十二年后已成长为一家拥有 850 名员工、13 个办公室、69 个国籍的组织，
              服务全球大宗商品贸易商、能源公司、海事运营商、政府和国防客户。

              Kpler 的核心，是把 255,000+ 个专有来源、每天超过 1.3 billion 条 AIS 信号、
              245,000+ 名人类贡献者的数据聚合起来，拼成全球实体贸易的统一情报层。公司给出的使命，
              是成为全球实体贸易的权威情报平台，驱动实时决策。收入主要来自两大平台的 SaaS 订阅：
              Kpler 大宗商品分析平台覆盖 LNG、原油、干散货、金属、谷物、化学品等 40+ 类商品；
              MarineTraffic 海事跟踪平台每天覆盖 300,000+ 艘船。Kpler 还提供国防情报能力，以及
              Kpler Copilot AI 助手等 AI 工具，后者建立在 15+ 年专有时间序列数据之上。公司称
              自运营第一天起即盈利，并且股权一直主要由创始人和团队成员持有。截至 2026 年 6 月，
              Kpler 在 Sixth Street 资本支持下进入新增长阶段，目标是扩张相邻市场并加快产品开发。
