      - number: '1.4'
        title: 规模、里程碑与收购
        blocks:
          - type: paragraph
            body: |
              Kpler 2014 年从布鲁塞尔两个工程师的创业公司起步，如今已扩张到 13 个办公室、850+ 名员工，
              覆盖欧洲、北美、中东、亚太和新兴市场。全球版图包括比利时（总部）、法国、德国、奥地利、希腊、
              塞浦路斯、卢森堡、英国、加拿大（ExactEarth 子公司）、阿联酋、美国（Cambridge MA、
              Houston TX 和 New York City）以及新加坡。公司通过多个法律实体注册，包括 Kpler SAS（法国）、
              Kpler Ltd（英国，2017 年 11 月注册）、Kpler UK Holdco Limited（英国，2023 年 2 月注册）、
              Kpler Inc（美国，Cambridge MA）和 Kpler PTE Ltd（新加坡）。

              Kpler 的增长来自有机产品扩张，也来自激进 M&A。平台 2014 年从 LNG 货运跟踪起步，
              2017 年加入原油，随后依次扩展到干散货、化学品、运费、金属、矿产、谷物、炼化、集装箱和管道。
              2021–2022 年，Kpler 在 18 个月内完成五项收购，包括 Spire 和 ChartDesk，资金来自
              Five Arrows 与 Insight Partners 的 $200M+ 融资。MarineTraffic（2023 年 3 月 7 日完成）
              和 FleetMon（2023 年 3 月 13 日完成）的收购，加入基于 AIS 的海事情报能力，全球 13,000+
              个 AIS 接收器和每天 300,000+ 个船舶位置把员工数推到 500 以上。公司新闻页还提到收购
              CITAC 以扩展非洲情报覆盖，说明 2025–2026 年仍在继续外延增长。今天，Kpler 每年监测
              430 million 吨 LNG 出口货运，数据库处理超过 2 million 笔交易，MarineTraffic 的 AIS
              消息平均延迟达到 5 秒。
