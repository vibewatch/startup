  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: |
              Kpler 的客户基础横跨六个垂直：大宗商品交易、金融机构、海事运营、物流与供应链、海事保险与风险、政府和监管。
              大宗商品交易垂直——石油巨头、独立交易商、炼油商和干散货运营商——是历史核心，继承自 Kpler 2014 年 LNG 起步阶段。
              2023 年收购 MarineTraffic 和 FleetMon 后，可服务客户基础扩展到海事物流运营商、港口主管部门、船务代理、航运保险公司，
              以及庞大的消费者和专业 AIS 用户群。

              买方、用户、付款方三角关系遵循典型企业 B2B SaaS 逻辑：一个企业账户可能覆盖多个业务单元（例如一家大宗商品交易行拥有独立的货运、套利和合规 desks），
              每个业务单元都是不同用户 cohort。官方产品架构确认了不同价值主张：大宗商品平台用户访问 Cargo Analytics、Chartering、
              Arbitrage Analytics、Risk & Compliance 和 Kpler AI；海事用户访问 Ship Tracking、Container Intelligence、
              Inbox、Hub、MarineTraffic Insurance 和 Data Services APIs。Enterprise Plan 面向多团队、多地区部署，
              支持 SSO、审计日志和 SLA。

              渠道以直接企业销售为主，并由 API 和 data-feed 与交易平台、物流系统集成支撑。MarineTraffic 免费消费者层充当认知和转化漏斗顶部：
              截至 2026 年 4 月有 850 万注册用户，一年前为 350 万。企业分部没有按已披露 ACV 区间正式分层，
              但 Kpler 的独立产品评测把买方范围描述为：从入门层 SME 航运运营商，到高端跨国大宗商品交易 desks 和全球 3PLs。
