      - number: '3.3'
        title: 能力对比、定价与 GTM
        blocks:
          - type: paragraph
            body: >
              Kpler 的 insight-vs-providers 定位把自身方法论描述为证据驱动、自下而上——从实体货物观察出发，
              再构建市场观点——并与其所称的既有玩家自上而下、关系驱动路径形成对比，后者从分析师观点出发， 再寻找支撑数据。这一定位瞄准的是 S&P Global 的 Platts 传统和 Argus 的专家分析师模式：
              这些机构的价格评估建立在市场访谈和报告交易之上，而不是直接实体观察。

              不同细分中的功能覆盖差异很大。Kpler 是唯一把实时 AIS 跟踪、多商品货物流情报、租船工作流工具、 套利分析矩阵和合规筛查整合进单一模块化订阅的平台。S&P Global CI 和 Argus
              在商品广度上匹配 Kpler， 但缺少实时船舶跟踪和租船工作流集成。Windward 在合规情报上领先，但没有大宗商品分析层。 VesselFinder 能低成本提供跟踪，却没有情报上层结构。

              Kpler 的定价模式按商品和功能集模块化订阅，价格从约 $10,000 到每年低六位数，取决于模块选择、 API 调用量和用户数。这种模块化方法允许小型贸易商从聚焦范围起步再扩张——这套 GTM 策略让
              Kpler 区别于 S&P Global 和 Argus 常见的更捆绑、由关系把关的定价模式；后两者最低价格点更高， 并通过长期经纪和交易所关系分发。

              Kpler 的平台集成（成熟 API 和 Excel 插件）缩短前台工作流的 time-to-value。大宗商品交易枢纽评审指出， 标准模块可在数天内投入使用，而定制 API
              和企业数据湖集成通常需要数周。Kpler Vessels API 与 MarineTraffic 开发者生态创造了面向开发者的分发渠道，既有价格评估出版商无法以相当深度提供。
