      - number: '3.2'
        title: 竞争对手画像与战略方向
        blocks:
          - type: paragraph
            body: >
              Vortexa 是货运情报细分中最接近 Kpler 的直接同业，聚焦原油、成品油和 LNG 流向， 为能源交易商和金融机构提供近实时货物级可视化。2026 年大宗商品交易枢纽评审明确把 Vortexa 与
              ClipperData 列为 Kpler 的主要直接竞争对手，并指出 Kpler 以模块化和多商品覆盖形成差异化， Vortexa 则更偏能源。Vortexa 2026 年产品公告包括 Anywhere
              Freight Pricing Forecasts， 将平台延伸到运费市场分析。

              S&P Global Commodity Insights（原 Platts）按收入和市场渗透率是最大的既有玩家， 把 Platts 传统价格基准权威与其 Commodities at Sea
              平台上的货物流数据结合起来——该平台把船舶跟踪情报 直接接入基准定价。这是 Kpler 市场位置面临的最可信既有竞争回应，因为 S&P Global 可把大宗商品流向情报
              作为既有银行、交易商和能源公司基准关系的自然延伸来销售。

              Argus Media 是一家私营专业出版商，拥有 600+ 名大宗商品市场专家，发布 1,300+ 个专有金属价格， 以及广泛的能源、农业和化学品大宗商品评估。Argus
              与大宗商品市场参与者关系深厚且长期，但缺少实时船舶跟踪 和货物流能力——这正是 Kpler 实体流向方法论可以利用的差异化缺口。

              Windward 的 Maritime AI 平台把 AIS、暗船信号、光电图像、SAR 和 RF 数据融合成统一运营情报图。 它服务金融机构（Société Générale、Generali）、政府机构和
              UN 机构，行为分析重点是制裁筛查、 AIS 操纵检测和风险评分。虽然 Windward 也服务部分与 Kpler 相同的金融机构买家，但它瞄准的是不同工作流： 合规与风险，而不是大宗商品贸易情报。

              Kpler 的规模指标让它处于网络基础设施领先位置：10,000+ 个客户组织、13,000+ 个 AIS 接收器、 每天处理 1B+ 条 AIS 消息、通过 MarineTraffic 跟踪 300,000+
              艘船，并在 40 种大宗商品的租船平台中 监测 2M+ 笔交易。
