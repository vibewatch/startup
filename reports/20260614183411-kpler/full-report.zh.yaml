    summary: 风格化采用漏斗，以认知阶段为 100 建立指数。各阶段规模为示意值，基于免费用户基础、付费用户新增和企业计划框架建模；实际转化率未公开披露。
    approximationNotes: >-
      漏斗阶段值为示意值，以认知阶段为 100 建立指数；Kpler 实际转化率未披露。阶段比例根据 8.5M 注册用户与 12,000+ 家企业机构的比值估算（意味着注册用户池到完整企业客户的转化率低于 1%），并参考截至 2026
      年 4 月一年内新增的 11,000+ 名海事付费用户。这些数值不应作为经验证的转化基准。
    data:
      items:
        - label: 认知：MarineTraffic 免费层、会议、行业博客、推荐
          value: 100
        - label: 评估：演示、试用访问、免费层探索、SDR 接触
          value: 28
        - label: 试点：单模块付费订阅（Container Tracking、基础 Cargo Analytics）
          value: 10
        - label: 扩展：多模块、API 附加、团队级订阅
          value: 4
        - label: 企业：数据湖集成、SLA、SSO、多地域部署
          value: 1
    claimRefs:
      - CU005
      - CU006
      - CU024
      - CU026
      - CU032
