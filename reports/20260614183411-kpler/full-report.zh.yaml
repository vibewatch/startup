  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与客户工作流嵌入
        blocks:
          - type: paragraph
            body: >
              Kpler 的商业产品围绕两大情报套件组织：Commodities 和 Maritime。两者在客户工作流层汇合， 形成统一的数据终端和 API 表面。Commodities 套件覆盖 40
              多个大宗商品市场：能源（原油、LNG、 成品油、欧洲天然气）、干散货、金属和农产品。模块包括 Cargo Analytics（船舶级分辨率的实时进出口流）、 Freight
              Analytics（用于租船和运价发现的供需分析）、Inventory Analytics（卫星驱动的陆上库存监测）、 Refineries
              Intelligence（利润率、开工率和海运原油流数据）、Arbitrage Analytics（每 30 分钟刷新的到岸价值矩阵）、 Risk & Compliance（船舶制裁和影子船队筛查）以及
              Financial Flows（面向系统性交易员的 CTA 仓位数据）。 每个模块都作为年度 B2B 订阅的一部分销售，并按大宗商品交易商、投行、石油巨头、公用事业公司和政府机构的具体数据需求定制。


              Maritime 套件自 2025 年 9 月起以 Kpler AIS 品牌运营（取代旧的 MarineTraffic AIS 品牌），
              为航运运营商、保险公司、港口主管部门和海事研究机构提供船舶追踪与海事情报。产品包括实时 Ship Tracking、 用于以程序方式访问位置和航程数据的 Vessels REST API、批量 Data
              Services feeds、Historical AIS （10 年以上归档信号数据）、Data Quality 工具，以及 Vessel Integrations（Inmarsat C 和 VSAT 遥测与
              AIS 结合，用于远洋船队追踪）。拥有超过 100 万活跃用户的 freemium MarineTraffic 消费者平台，构成开放访问层， 既带来品牌认知，也可能向商业 AIS 层转化。


              2025–2026 年，Kpler 新增一套 AI 套件，包括 Kpler Copilot（嵌入 Kpler 终端的自然语言分析助手）、 Kpler MCP（让分析师可从 Claude、ChatGPT 和
              Gemini 查询 Kpler 数据的集成层）以及 Kpler Agents （在专有大宗商品和海事数据集上训练的领域专用 AI 模型）。这些 AI 工具把 Kpler 从数据访问平台推向自主情报层，
              同时处理卫星 feed、海关数据、AIS 位置和市场信号。截至 2026 年 6 月，Kpler 服务全球 190+ 个国家的 10,000 多家组织。
