      - number: '8.2'
        title: 融资背景、估值机制与可比公司组
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月的 Sixth Street 交易，是一笔少数股权战略成长投资。Five Arrows（Rothschild & Co 的另类资产部门，AUM €33B）全部退出；Insight
              Partners（AUM $90B+）则把原始持股中的一部分滚入新结构。2022 年 4 月，两家合计投入超过 $200M，取得合计持股；当时 Kpler 估值未披露，但显著低于本轮。到 2025 年 2
              月，Baird Maritime 的消息源基于 €200M+ ARR，把潜在交易 EV 放在 €3B+（$3.11B）。2026 年 6 月交易隐含约 $4B 估值，意味着 16 个月升值约 28–30%，与
              ARR 增速超过市场预期相符。

              Sixth Street 管理 AUM 超过 $130B，团队 750+ 人，其中约 300 名投资专业人士。Sixth Street Growth 专注于中后期科技公司的成长股权与定制资本方案。此前投资包括
              Spotify（2016 年可转债）、Airbnb（与 Silver Lake）、FC Barcelona（2022 年），以及多家数据和软件企业。此类交易模式与 Sixth Street
              的策略一致：在拐点向高质量数据业务投入灵活资本。

              截至 2026 年 6 月，公开市场可比公司的收入倍数跨度很大：SPGI 约 7.9x 过去收入（市值 $124B / TTM 收入 $15.73B），Verisk Analytics 为 7.8x（$24.1B
              / $3.10B），MSCI Inc. 约 13.5x（$43.6B / $3.24B），FactSet 为 3.7x（$8.79B / $2.40B），Morningstar 为 2.65x（$6.66B /
              $2.51B）。MSCI 是最贴近的参照：订阅收入、可防守的数据护城河、高 NRR、指数与分析平台。按 $250M ARR 计算，Kpler 隐含 16x ARR 倍数，比 MSCI 溢价
              19%；披露财务尚不足以独立支撑，但若其有更高有机增长率，也并非不合理。

              私募和并购可比交易提供了更多背景。2024 年，Argus Media 在其 CEO 取得控制权时估值 $4.6B（含债务），说明能源大宗商品数据赛道可以承受高溢价倍数。2024 年，BlackRock 以
              £2.55B（$3.17B）收购私募股权数据分析平台 Preqin，提供了金融分析并购可比。这些交易确认，在私募和并购市场中，高质量、订阅型的大宗商品 / 金融分析数据业务可以获得 15–20x ARR
              倍数，部分验证了 Kpler 的定价；不过，这些可比对象也都没有完整披露单位经济。

              成长股权投资相对流动性公开证券，通常会计入 15–25% 的私募市场非流动性折价。吊诡的是，Kpler 的交易倍数高于最佳公开可比 MSCI（13.5x
              P/S），而不是低于它；市场似乎在定价两件事之一：Kpler 增长显著高于 MSCI 10–11% 的年收入增速，或存在战略收购溢价。两者都说得通，但都属于前瞻性假设，并非基于证据的确定结论。
