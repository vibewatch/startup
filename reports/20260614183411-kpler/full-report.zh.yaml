      - number: '6.3'
        title: 具名客户证据
        blocks:
          - type: paragraph
            body: |
              Kpler 的案例研究库覆盖五个垂直的九家具名生产客户。所有案例均由 Kpler 撰写，未经过独立验证；
              但它们提供了生产部署确认、客户代表引语和量化运营结果。

              在物流与供应链领域，GEODIS——一家全球第三方物流供应商——使用 Container Intelligence 每年追踪约 100 万个集装箱，
              从 175,000 个集装箱的试点扩展而来，部署范围扩大六倍。Unilever 通过 AIS 数据监控 12,000 个集装箱、
              1,500 艘船和 190+ 个国家，运营其称为“虚拟海洋控制塔”的系统。Renault 每年追踪超过
              100,000 票集装箱运输，并通过提升船舶到港可见性降低紧急物流成本。农业 SME Green Farms Nut Co.
              每周节省此前用于手工船舶追踪的 6–9 小时。

              在海事运营与航运领域，船舶涂料制造商 Jotun 使用 Kpler AIS 船体性能数据，在 2024 年避免 1,111 万吨 CO₂ 排放。
              航运经纪商 Banks & Lloyd 通过自动化船舶位置提醒，把每日监控电话从 10 通降至 2 通。Campbell Bulk
              使用 Inbox 将重复交易邮件减少 30–50%，并为每名用户每周节省 4–10 小时。船务代理 JohnAsia
              通过 Inbox 每天管理 5,000+ 封邮件，据称生产率提升 25%。

              在海事保险领域，CFC Underwriting 使用 Kpler 实时船舶情报升级其海事绑架与赎金（K&R）保险承保，
              可实时进行风险评分。商业情报数据提供商 Altares NL 出现在 altares.nl 上的第三方案例中，但未披露具体结果。

              在可得来源中，没有具名客户公开确认续约，也没有明确描述多年合作期限。
