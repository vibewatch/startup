          - type: paragraph
            body: |
              截至 2026 年 6 月，Kpler 未公开披露 NRR、GRR、年度 churn、cohort 留存或平均合同期限。唯一可用代理指标是一份第三方增长策略分析，
              估计 NRR 高于 110%；这与 GEODIS 案例中观察到的 land-and-expand 模式（范围扩张 6×）以及鼓励交叉销售的多模块架构方向一致。
              本章估算的 cohort 留存数据由该 NRR 代理指标和 SaaS 行业基准建模而来；并非 Kpler 发布的数据，只能作为示意。

              最具体的 land-and-expand 证据是 GEODIS：部署从试点阶段追踪 175,000 个集装箱，扩展到生产环境每年超过 100 万个，
              同一客户账户内部署范围扩大 6×。MarineTraffic 免费转付费漏斗提供第二种扩张机制：850 万注册用户通过分层产品访问转化为付费订阅者。

              客户集中度仍是开放缺口。Kpler 未披露 top-5 或 top-10 账户贡献的 ARR 占比。以 12,000+ 家组织为分母，
              多元化是有可能的；但大型大宗商品交易行（Vitol、Trafigura、Glencore）和主要金融机构，因多地区、多 desk 授权，
              很可能贡献不成比例的 ACV。没有 Kpler 账户层级收入数据，这一点无法验证。

              英国 Competition and Markets Authority 对 Kpler AIS 收购的审查引入了不利的结构性风险：如果 CMA 要求强制访问定价或剥离，
              已把 Kpler AIS 数据嵌入自身工作流的数据客户，将面对供给侧成本和连续性风险。独立 AIS 分析师指出，Kpler 和
              S&P Global 如今对大规模 AIS 基础设施形成近双寡头，这是更广泛市场的集中度风险。

              货物推断方法是第二个不利信号：Kpler 的 cargo flow 估计是概率性的，从 AIS 船舶位置信号推断大宗商品数量。
              一项独立事实核查发现，这些估计可能误判船舶意图，尤其是船舶进行非典型港口停靠，或在受制裁情境下进行船对船转运时。
              对依赖 cargo flow 情报的客户而言，这既是数据质量风险；如果高风险决策建立在过度自信的估计上，也会成为声誉风险。
