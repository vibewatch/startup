      - number: '5.4'
        title: 信任、合规、安全与质量控制
        blocks:
          - type: paragraph
            body: >
              Kpler 已获得两项主要国际信息安全和运营保障框架认证。ISO/IEC 27001:2022 覆盖其信息安全管理体系， 确认其与数据保护、事件管理和持续监控的国际最佳实践对齐。AICPA SOC 2 Type
              II 确认安全控制的运营有效性已经过一段时间的独立验证， 对 Type I 设计验证认证形成补充。两项认证合在一起，降低了需接受供应商安全审查和采购尽调的企业客户所面临的第三方风险。


              隐私政策（kpler.com/company/privacy）管辖 EU 和非 EU 数据处理、cookie consent 以及符合 GDPR 义务的数据主体访问请求（DSAR）流程。
              行为准则覆盖员工行为、供应商标准、反贿赂和反腐要求，以及与外部交易对手的往来。Vessel Integrations 产品页显示， 海事客户分部的客户满意度分数超过 90%。Kpler 的数据质量框架在
              Maritime 套件内包含专门的 Data Quality 模块， 提供 AIS 信号验证、船舶身份去重和伪造 AIS 检测工具。


              仍未解决的关键可信风险，是公司未公开具体 AIS 数据质量指标（误报率、伪造检测方法）、API SLA 和 uptime 统计。 采购企业数据协议的客户，必须靠合同陈述来评估这些参数，而不是依赖公开基准。英国
              CMA 的持续审查代表监管风险： 其可能施加数据共享或定价义务，从而实质影响 Kpler 合并后 AIS 基础设施的运营模式。
