      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: CMA 反垄断审查——AIS 变现的结构性尾部风险
            body: >-
              英国 CMA 对 Kpler AIS 市场整合的审查，是本报告中最具结构性意义的监管风险。若要求剥离，或强制 Kpler AIS 数据第三方访问定价，将损害其最高质量专有数据资产的利润率。投资人应监控 CMA
              Phase 2 referral 状态，并把取得 Kpler 与 CMA 的直接沟通记录作为最终投资承诺的前置条件。
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR046
          - type: callout
            title: 估值溢价建立在完全不透明的单位经济之上
            body: >-
              在 13–20× 隐含 ARR 倍数下，$4B 估值要求 ≥40% 有机 ARR 增长、>70% 毛利率和 >100% NRR——但没有一项经过审计或公开确认。
              缺少合并财务披露，是单一最大且关系投资论点的尽调缺口。任何按这一倍数承销的投资人，都必须把确认经审计 ARR、 按 cohort 拆分的 NRR 和有机增长率，视为出资前不可谈判的前置条件。
            calloutType: risk
            claimRefs:
              - CR034
              - CR047
              - CR048
          - type: callout
            title: 联合创始人领导层交接——执行风险显性化
            body: >-
              两位创始人退出正式董事角色（Kpler UK Holdco：2025 年 9 月；Kpler Ltd：2026 年 4 月）。Mark Cunningham 掌舵，但公开画像有限。这是一个高后果治理事件：创始人用
              12 年建立了产品愿景、客户关系和公司文化。Sixth Street 投资后 18 个月内，关键技术和商业人员的留任情况，是管理执行风险最重要的监控指标。
            calloutType: risk
