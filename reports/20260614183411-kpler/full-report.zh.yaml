  - id: TE002
    title: 工作流 / 使用场景表
    columns:
      - 用户任务
      - 不用 Kpler 的工作流
      - Kpler 方案
      - 可衡量收益
      - 已知限制
    rows:
      - - 原油交易执行
        - 手工检查船位、给经纪人打电话、港口靠泊数据延迟
        - 实时 AIS + Cargo Analytics，具备船舶级分辨率和转向提醒
        - 据 Kpler AI 产品页，决策周期从小时缩短到分钟
        - 价格处于高端；对非海运大宗商品环节价值有限
      - - 贸易合规 / 制裁筛查
        - 用电子表格核查船舶，手工研究所有权
        - 自动化船舶制裁监控、管理风险评分、所有权情报
        - 减少合规人员工时；近实时更新船舶身份
        - 独立评估认为，影子船队数据完整性仍是缺口
      - - 运费 / 租船费率评估
        - 手工市场调查，依赖电话获取船舶经纪情报
        - AI 辅助供需分析；从 AIS 流向提取运价信号
        - 更快发现费率；相较经纪人降低信息不对称
        - 地缘政治黑天鹅期间预测准确性下降
      - - 海事 K&R 保险承保（CFC）
        - 基于静态航线假设逐航次报价
        - 实时船舶情报支撑年度保单，使其贴合真实交易模式
        - CFC 从一次性模式转向年度模式；定价更准确反映真实船舶活动
        - 仅适用于 AIS 跟踪船舶；关闭 AIS 的船舶仍是盲区
      - - 船体性能优化（Jotun）
        - 低频干船坞检查数据；生物污损监控有限
        - 高频 Kpler AIS 数据接入内部分析，用于验证涂层性能
        - Jotun 2024 年凭借改进的船体性能建议避免 11.11 million tonnes CO2 排放
        - 需要 Jotun 自建内部 AIS 分析集成；不是开箱即用方案
      - - 学术贸易流研究（IfW Kiel）
        - 历史 AIS 数据集访问有限；许可成本高
        - FleetMon/Kpler AIS 数据资助 Kiel Trade Indicator，覆盖 500 个港口、75 个国家
        - 近实时贸易流估计比官方统计提前约 20 天
        - 学术访问条款和成本结构未公开；依赖 Kpler 自行裁量
    notes: 收益来自 Kpler 案例研究和研究项目页面；反映公司报告或独立发布的结果，并非独立审计指标。CFC 和 Jotun 示例来自已发布案例研究；IfW Kiel 使用场景来自 Kiel Trade Indicator 研究项目页。
