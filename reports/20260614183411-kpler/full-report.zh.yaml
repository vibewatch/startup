  - id: FV001
    title: 推荐逻辑链
    type: flow
    layout: wide
    summary: 从市场地位、产品验证，经财务轨迹和风险，最终到 TRACK 建议的证据链，凸显估值和未披露财务数据的关键作用。
    data:
      nodes:
        - id: market-scale
          label: 市场地位：全球 AIS + 40+ 个商品市场
        - id: product-moat
          label: 产品护城河：13,000+ 个 AIS 接收器，自有数据栈
        - id: arr-trajectory
          label: 财务轨迹：$100M ARR（2024 年 1 月）→ €200M+（FY2025）
        - id: valuation-entry
          label: 入场估值：隐含约 $4B / 约 16x ARR — 高于最佳上市可比公司
        - id: risk-cma
          label: 监管风险：英国 CMA 审查 AIS 收购
        - id: risk-opacity
          label: 证据缺口：未披露毛利率、NRR 或单位经济
        - id: risk-governance
          label: 治理风险：联合创始人 2026 年 4 月退出董事会
        - id: recommendation
          label: TRACK — 跟踪；在更低倍数或披露后重新接触
      edges:
