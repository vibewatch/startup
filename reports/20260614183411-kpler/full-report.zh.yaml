      - number: '2.2'
        title: 市场规模——TAM、SAM 与 SOM 视角
        blocks:
          - type: paragraph
            body: |
              没有单一公开独立分析师报告单独切出 Kpler 具体市场边界的 TAM / SAM，因此本节从三个视角交叉估算：
              （a）海事情报和航运分析市场，S&P Global 将其描述为覆盖 765+ 个运价评估类别、触达所有大宗商品海运贸易；
              （b）独立市场观察者使用的更宽口径大宗商品数据分析市场；以及（c）基于估算买家群体和订阅经济性的
              自下而上容量视角。

              在保守口径下，海事情报 TAM 估算为每年 $5–8 billion，覆盖船舶跟踪、运价、港口情报和货物分析，
              但排除金融衍生品数据。按此定义，S&P Global Platts 和 Kpler 是两个主导玩家。若扩展到所有
              实体大宗商品数据分析——包括能源基本面（IEA / EIA）、干散货情报、金属贸易流和农业分析——
              独立观察者估算的中位 TAM 为 $8–14 billion。这与 Kpler 成为「全球实体贸易权威情报平台」
              的公开抱负一致。若再纳入供应链风险、合规筛查、卫星图像分析和贸易金融情报等相邻分析层，
              宽口径 TAM 可能达到 $12–20 billion。

              Kpler 的 Serviceable Addressable Market（SAM）估算为 $3.5–5.5 billion，来源包括：
              （a）全球 5,000–10,000 个活跃实体大宗商品交易台；（b）1,000–2,000 家拥有专门分析预算的
              能源巨头、NOC 和公用事业；（c）500–1,000 家设有大宗商品业务台的金融机构；（d）3,000–5,000
              家海事运营商和港务机构；以及（e）100–500 个政府 / 国防机构。按 $50K–$300K 平均年度合同价值，
              这一群体支撑 $3.5–5.5B SAM。Kpler 当前 SOM 渗透率估算为 SAM 的 5–10%——用 $200–400M
              ARR 估算（由约 $4B 估值和高毛利数据业务典型 4–6× ARR 倍数推导）对照 $3.5–5.5B SAM 得出。

              一个关键尽调缺口是：没有独立分析师报告专门测算 Kpler 的市场边界，而且最宽的公开 TAM
              （$12–20B）混入相邻市场，最窄口径（纯交易工具订阅 $1–2B）又排除了能源基本面和合规支出。
              因此应保留这些相互矛盾的估算区间，而不是压成单点数字。独立评审基于监管复杂度上升、能源转型分析需求、
              以及算法越来越依赖货物流向数据，估算市场 CAGR 为每年 7–12%。Kpler 来自 Insight Partners
              的 $1.2B 总融资，以及 2026 年 6 月 Sixth Street 以约 $4B 隐含估值投入 $1B+，
              反映投资人相信该可寻址市场有实质规模且仍在增长。
