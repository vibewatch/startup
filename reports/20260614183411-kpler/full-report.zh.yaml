      - number: '8.3'
        title: 情景分析：牛市、基准与熊市
        blocks:
          - type: paragraph
            body: >-
              牛市情景要求 Kpler 在四到五年的持有期内维持 25–30%+ ARR 增长，ARR 达到约 $700M–$1.1B，并通过 IPO 或战略收购以 15–18x NTM ARR
              倍数退出。在这些假设下，隐含退出企业价值约为 $10B–$20B，Sixth Street 资本可获得 3–5x 回报，对应约 25–40% IRR。投资逻辑的核心驱动是 Kpler
              把自己做成全球实物贸易情报的权威平台——类似金融市场里的 Bloomberg
              Terminal——并随着监管采用、国防市场扩张和能源转型数据需求，获得结构性溢价。牛市情景的关键风险，是公开市场对数据分析公司的重新定价；只要 P/S 倍数从当前水平持续压缩，IPO 募资所得就会被明显打低。

              基准情景假设 ARR 增长 15–20%（可通过双平台客户群交叉销售实现），持有五年后 ARR 达到约 $500–$620M，退出倍数为 10–12x NTM ARR。由此得到约 $5B–$7.5B 的退出
              EV；Sixth Street 的少数股权（约 25%）在约 $1B 投入上回收 $1.25B–$1.875B，即 1.25–1.875x 回报，对应五年 5–15%
              IRR。对成长股权投资而言，这只是勉强及格，LP 通常预期五到六年回报 2x+。若出现以下情况，增速降至 15% 是合理风险：（a）宏观大宗商品周期逆风削弱贸易商支出；（b）CMA 强制数据共享；或（c）S&P
              Global 的「大宗商品 + AIS」整合产品加速竞争压力。

              熊市情景中，ARR 增速降至每年 10%（符合后期 SaaS 成熟状态），倍数压缩至 7–8x（向公开可比中位数收敛），CMA
              结构性补救削弱数据护城河完整性，创始人离开还可能带来执行扰动。在熊市假设下，Kpler 五年 ARR 达到约 $320–$400M，以 $2.5B–$3.2B 企业价值退出；Sixth Street 的持股回收约
              $625M–$800M，资本出现实质亏损。熊市情景不是尾部风险：一旦增长放缓或监管干预不利，它就会变成基准情景。
