      - number: '7.2'
        title: 运营、技术与安全风险
        blocks:
          - type: paragraph
            body: |
              Kpler 的运营风险画像主要由 AIS 基础设施固有的数据质量挑战主导。AIS transponders 原本为海事安全透明度设计，
              不是为认证设计：信号不加密、未认证，因此对于试图逃避检测的船舶来说，spoofing——广播虚假的位置、身份或航程数据——并不困难。
              2024 年 1 月至 2025 年 7 月，Kpler 识别出 261 艘在被制裁前曾 spoof AIS 的船舶，这是单一最大的规避行为类别。
              冲突区域附近的 GNSS jamming 和设备故障会造成非自愿 AIS 缺口，使货物推断算法更复杂。Commodity Trading Hub
              2026 年行业评述把 Kpler 的货物估计描述为概率性估计，并指出误报和缺口是多源 AIS 推断的内在问题——尤其是没有开启 transponders
              的 dark fleets。

              鉴于每天实时处理超过 13 亿条 AIS 信号，服务可用性风险具有实质性。Master Agreement 承认无法保证平台可用性，
              并明确否认对服务中断承担责任。卫星 AIS 覆盖依赖 Kpler 的 100+ 颗纳米卫星星座（原 Spire Maritime）的健康状况，
              会受到卫星故障、轨道拥堵，以及太空地缘政治紧张升级下反卫星干扰风险的影响。陆基 AIS 网络依赖全球 13,000+
              个接收站；站点故障、冲突区域的地缘政治限制，或社区贡献者退出，都可能制造地理盲点。

              网络安全风险具有实质性，但公开层面尚未评估。Kpler 持有 ISO/IEC 27001:2022 和 AICPA SOC 2 Type II 认证，
              表明安全控制已制度化。不过，公开渠道没有网络安全事件披露；同时，Kpler 拥有 13 个办公室的 850+ 名员工、多云基础设施，
              以及被 10,000+ 家组织使用的 API，对寻求贸易情报、船舶位置数据或制裁监控分析的国家级行为体和金融犯罪者而言，是高价值目标。

              M&A 整合积压构成持续运营风险。Kpler 自 2021 年以来完成六起以上收购——包括复杂的 $241M Spire Maritime 整合——
              横跨多个技术栈。2025 年 9 月把陆基、roaming 和卫星 AIS 统一到“Kpler AIS”品牌下，显示出实质进展；
              但完整平台整合时间表仍未披露。重叠代码库、数据 schema 和计费系统会制造整合脆弱性，可能在市场高峰事件中表现为数据质量不一致或客户侧 API 中断。
