      - number: '1.3'
        title: 融资历史与投资人图谱
        blocks:
          - type: paragraph
            body: |
              自 2014 年创立以来，Kpler 已披露融资约 $1.2 billion。最重要的一笔是 2026 年 6 月 3 日
              宣布的 Sixth Street $1 billion+ 少数股权战略成长资本投资；Sixth Street 是一家全球投资公司，
              管理资产和承诺资本超过 $130 billion。多家独立来源称，该交易对 Kpler 的估值接近 $4 billion，
              使其成为全球估值最高的私营贸易情报公司之一。

              按交易条款，管理层保留 Kpler 多数股权；对于这一规模和估值的公司，这一结构值得注意。
              既有投资人 Insight Partners 是一家全球软件投资机构，监管口径管理资产超过 $90 billion；
              它将部分原始投资滚入并继续持股。Five Arrows 是 Rothschild and Co 旗下企业私募股权部门，
              管理资产 €33 billion，在本次交易中全部退出。Evercore 担任 Kpler 唯一财务顾问，
              Goodwin Procter LLP（由 Anu Balasubramanian 牵头）担任法律顾问；Sixth Street 由
              Moelis 和 Milbank LLP 提供顾问服务；Insight Partners 由 Willkie Farr and Gallagher LLP
              提供顾问服务；Five Arrows 由 Shoosmiths LLP 提供顾问服务。

              上一轮机构融资约 $200 million，2022 年由 Five Arrows 和 Insight Partners 投入，
              支撑 Kpler 在 18 个月内完成五项收购。收入 run-rate、毛利率和客户数均未披露——对于
              约 $4 billion 隐含估值来说，这是实质缺口。Discoperi.com 将该交易描述为「$1 billion buyout」，
              与官方少数股权成长资本投资的定性相矛盾；解读二级市场交易数据库时应保持谨慎。
