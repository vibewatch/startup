          - type: callout
            title: 市场集中风险——CMA 审查与访问中断
            body: >-
              英国 Competition and Markets Authority 已对 Kpler 的 AIS 收购展开审查，释放出监管担忧： Kpler 与 S&P Global 现在几乎双寡头控制大规模 AIS
              基础设施。独立分析师警告，数据采集者、分析平台、 合规工具都归属同一主体，会让上游价格张力消失。收购交接期出现的访问中断报告，也让依赖 Kpler 数据的 分析公司担心供应链可靠性。不利的 CMA
              裁决（剥离、强制访问定价或结构性补救）将实质改变 Kpler 的竞争经济性， 以及其 AIS 数据授权业务条款。
            calloutType: risk
