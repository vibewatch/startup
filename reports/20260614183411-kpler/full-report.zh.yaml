  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、范围与替代品
        blocks:
          - type: paragraph
            body: |
              Kpler 服务的市场，是实时海运大宗商品流向情报：把 AIS 定位数据、卫星图像、挂港记录、
              海关申报和商业装船数据采集、融合、分析，转化为可执行情报，回答实体商品在哪里移动、装卸多少、
              后续供需影响是什么。它与几个相关市场相邻，但并不相同。

              Kpler 服务市场包括大宗商品情报平台订阅支出，覆盖海运流向、船舶跟踪、货物推断、运费分析、
              库存监测、合规筛查和能源基本面。Kpler 覆盖 40+ 类商品，包括原油、LNG、LPG、成品油、
              干散货（铁矿石、煤炭、谷物、化肥）、金属、化学品和能源转型商品；在全球任意时点跟踪
              36,000+ 艘大宗商品船舶，并拥有超过 10 年的历史时间序列数据。

              不属于 Kpler 核心服务市场的包括：（a）Bloomberg Terminal、Refinitiv Eikon/LSEG 和
              ICE Data Services 服务的纸货和金融大宗商品衍生品市场，在那里 Kpler 是数据供应商，
              不是主要工具；（b）港口运营执行软件（Terminal Management Systems、TOS 平台）；
              （c）运费经纪执行平台（Baltic Exchange、Clarksons Shipping）；以及（d）陆上物流执行软件
              （SAP TM、Oracle Transportation Management）。IEA、EIA 和 JODI 发布的政府统计数据，
              是尚未为专用平台付费买家的主要现状替代品；这些来源滞后数天到数周，并缺少前台交易决策所需的
              船舶级颗粒度。

              Kpler 的相邻扩张面包括：（a）海事合规和制裁筛查，现由 Risk & Compliance 产品服务；
              （b）基于卫星的农业大宗商品监测；（c）供应链金融情报；以及（d）政府和国防贸易安全。
              能源转型相邻方向——跟踪 LNG、绿氢、氨、生物燃料和碳流——已经被独立的 Kpler Energy Transition
              产品线明确写入增长版图。Kpler 收购 MarineTraffic 和 Spire Maritime 后，「大宗商品情报」
              与「海事跟踪」之间的边界被有意模糊：AIS 基础设施所有权把上游数据层压进分析产品，
              让竞争对手更难以同等条款拿到相同原始输入。
