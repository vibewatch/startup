        - $43.6B 市值
        - 13.5x P/S 倍数
        - 最贴近的类比 — 订阅数据、可防守的指数护城河、高 NRR
        - 聚焦金融市场，而非大宗商品 / 海事；增长率较低（~11%）
      - - S&P Global（SPGI，上市可比）
