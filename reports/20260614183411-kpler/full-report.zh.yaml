  - id: FU004
    title: 按产品家族和使用年限估算客户标识留存 — Kpler（建模）
    type: cohort
    layout: standard
    summary: 按产品家族、跨三个使用年份建模估算客户标识留存。依据第三方对 NRR 高于 110% 的估算，以及类似订阅情报平台的企业 SaaS 基准。Kpler 未发布队列数据；所有数值都是示意，尽调中必须用实际流失记录验证。
