      - number: '2.3'
        title: 买家分层与采用路径
        blocks:
          - type: paragraph
            body: |
              Kpler 的买家群体覆盖五个主要细分，每类都有不同工作流、预算归属和采用触发点。实体大宗商品交易商——
              包括石油巨头和独立贸易商（Vitol、Glencore、Trafigura、Gunvor）——是最大细分。预算所有者通常是
              前台交易台负责人或市场情报负责人。用例是现货套利、货物改道和实体交付供应链可视化。采用触发点是：
              当同行已经拥有实时货物可视化能力，自己会处于竞争劣势。Kpler 的 Excel 插件和 watchlist 可在数天内部署；
              面向量化工作流的企业 API 集成则需要数周。年度合同价值从单模块席位 $50K，到多商品企业访问 $300K+。

              能源公司、国家石油公司（NOC）和大型公用事业用 Kpler 做供应链规划、炼厂优化和监管报告。预算通常落在
              供应或交易部门。金融机构——从事大宗商品贷款的银行、运行大宗商品策略的对冲基金、结构化产品业务台——
              用 Kpler 数据做价差模型、库存套利和实体交易信用风险；采用往往由具体模型需求驱动，例如中国原油库存跟踪
              或 LNG 套利价差预测。

              海事运营商（船东、管理公司、港务机构、海事经纪）使用 Kpler 的 MarineTraffic 平台做船舶排期、
              挂港分析和航线优化。预算通常归运营或商务团队；采用由缩短港口等待时间或优化航程经济性驱动。
              政府机构、海岸警卫队和国防部是规模较小但价值更高的细分，用 Kpler 做制裁合规、暗船队识别和地缘政治贸易情报。

              企业销售周期中，采购、IT 和业务单元利益相关者都会参与，大型组织平均成交周期被拉长到 3–12 个月。
              Kpler 的模块化产品架构允许买家先从单一商品模块开始再扩张，降低小型交易业务的采用门槛，并形成
              land-and-expand 动作，支撑净收入留存。所有细分的风险与合规团队越来越多用 Kpler 对船舶进行制裁清单筛查，
              并标记 AIS spoofing、暗船队航线等异常 AIS 行为。
