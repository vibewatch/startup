  - id: TP004
    title: 护城河耐久性与竞争风险台账
    notes: 严重性评级（高 / 中 / 低）是基于现有证据的定性判断；未获得量化概率或财务影响模型。UK CMA 审查状态反映截至 2026-06-14 的情况；截至报告运行日期尚未发布正式裁定。
    columns:
      - 护城河主张
      - 竞争威胁
      - 严重性
      - 缓释 / 尽调问题
    rows:
      - - 自有 AIS 接收器网络（13,000+ 个接收器；1B+ 条消息 / 日）
        - 随着卫星成本下降，卫星 AIS 数据商品化可能削弱地面 AIS 基础设施的稀缺价值
        - 中
        - 跟踪卫星 AIS 定价趋势；评估在关键港口和拥堵航道中，地面覆盖优势是否仍能维持，因为这些场景最看重卫星延迟
      - - 借 API 集成和历史货物数据形成的时间序列数据锁定
        - 竞争对手若提供数据迁移工具或 API 兼容层，可能逐步侵蚀切换成本壁垒
        - 低
        - 审计企业合同中的 API 依赖深度；评估客户协议里的历史数据可携带条款
      - - MarineTraffic 品牌拥有数百万海事专业用户（免费增值 / 企业追加销售渠道）
        - 如果海事专业人士转向免费或更低成本的 AIS 替代品（如 VesselFinder），品牌可能被稀释
        - 低
        - 跟踪 MarineTraffic 用户留存指标；评估免费转企业的转化率和竞争流量份额
      - - Kpler Insight 平台 60+ 名专家分析师（自下而上方法）
        - S&P Global CI 和 Argus Media 拥有更大的分析师团队、价格基准传承更深、客户关系更久
        - 中
        - 评估 Kpler Insight ARR 增长轨迹和分析师驱动的客户留存率，并与既有价格评估续约率对比
      - - 整合 AIS 追踪、货物流向、租船和套利分析的平台
        - S&P Global Commodities at Sea 通过结合 Platts 基准和船舶流向数据，直接攻击同一整合定位
        - 高
        - 跟踪 S&P Global CI 产品路线图和 Commodities at Sea 功能深度；评估 Kpler 的实时流向优势按季度是扩大还是收窄
      - - UK CMA 对 MarineTraffic 收购的监管审查
        - 不利裁定可能要求 Kpler 剥离 AIS 资产，或按受监管条款授权 AIS 数据，从而消除上游基础设施护城河
        - 高
        - 监控 CMA 案件登记册和 Kpler 公开披露的裁定时间线；任何投资交割前，应就剥离或访问补救情景聘请法律顾问
      - - 概率式货物估算（由 AIS、港口靠泊、吃水变化推断）
        - 如果竞争对手拥有更强的海关、提单或商业租船成交数据，可能提供确定性更高的流向数据，削弱 Kpler 在高风险用例中的准确性优势
        - 中
        - 审查 Kpler 的准确率提升路线图和海关数据合作；用独立用户评测对标 Kpler 与 Vortexa 的货物估算误差率
      - - 多供应商并用削弱定价权（买家会因不同需求同时订阅 Kpler 和既有厂商）
        - 在大型企业账户中，Kpler 被定位为 S&P Global CI 的补充而非替代，限制单账户收入和留存杠杆
        - 中
        - 确定 Kpler 在企业账户中的主关系与补充订阅比例；评估净新增预算与从既有厂商重新分配预算的动态
