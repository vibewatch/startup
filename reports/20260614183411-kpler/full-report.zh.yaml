            body: >-
              公开大宗商品情报 TAM 估算从 $1–2B（仅窄口径交易工具）到 $20B+（所有相邻数据层）不等， 定义差距达 10×。把尽调锚定在单一估算上会误读证据。Kpler 的真实 SAM 更适合用买家群体和 ACV
              （$3.5–5.5B）来框定，而不是用自上而下 TAM 分摊；SOM 应在 Kpler 披露 ARR 后重新推导。
