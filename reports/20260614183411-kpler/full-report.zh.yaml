      - number: '8.4'
        title: 退出准备度、最终尽调问题与推翻论点的触发条件
        blocks:
          - type: paragraph
            body: >-
              Kpler 的退出准备度受多重因素约束。IPO 需要公开披露财务报表——毛利率、NRR、CAC/LTV、EBITDA——而 Kpler 从未发布过这些数据。尚未解决的英国 CMA
              审查带来实质不确定性，多数机构投资者会要求在承销公开发行前先解决。联合创始人退出董事会，也会引发治理问题，买方分析师会在 IPO 路演中重点追问。对 Sixth Street
              来说，最自然的退出路径是被四类可信买家之一战略收购：S&P Global（逻辑契合，但很可能触发 CMA 审查）、ICE Data Services、Bloomberg，或大型 PE
              以杠杆收购延续结构接盘。这些买家中的任何一方，都可能在独立 DCF 之上给出 20–30% 战略溢价，从而支撑基准到牛市区间的回报。

              五个最终尽调问题最能决定投资信心。第一，毛利率和单位经济：在隐含 $250M ARR 下，60%+ 毛利率可验证可扩展盈利能力；若低于 50%，则需要质疑 Kpler 能否产生足够 FCF
              来支持后续收购并证明其倍数合理。第二，NRR：若 NRR 高于 110%，可确认企业客户内的净扩张，并显著降低增长风险。第三，CMA
              审查结果和时间表：任何即将实施结构性补救的迹象，都会立即触发倍数压缩。第四，精确交易结构——Sixth Street $1B+ 中有多少是进入 Kpler 资产负债表的一级资本，多少是收购 Five Arrows
              持股的二级交易——决定了可用于产品投资和收购的真实弹药。第五，创始人锁定和激励一致性：Cazor 与 Maynier 均退出英国董事职务后，必须弄清他们在经济利益和战略层面的持续参与，才能判断运营连续性。

              相邻表格中的推翻论点触发条件，定义了投资逻辑反转的具体阈值。破坏力最大的单一触发因素，是 CMA 下令剥离 MarineTraffic；这会拆掉 Kpler 数据护城河的主要来源，并直接把可持续 ARR
              倍数压回公开可比水平。第二个最重要触发因素，是披露 NRR 低于 100%；这意味着企业客户群出现净流失，从根本上破坏收入增长叙事。
