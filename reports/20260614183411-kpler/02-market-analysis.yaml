chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Kpler's served market is seaborne commodity flow intelligence — a $3.5–5.5B SAM within a
    $8–14B broader commodity data analytics TAM — driven by sanctions complexity, energy
    transition, and algorithmic adoption of cargo intelligence. Primary buyers are physical
    commodity traders, energy majors, financial institutions, maritime operators, and government
    agencies; all face high switching costs due to API and time-series integration. Kpler's 2023–2025
    AIS acquisitions (MarineTraffic, FleetMon, Spire Maritime) create a defensible data moat but
    also triggered a UK CMA review that represents a material regulatory risk to the market
    structure and to the terms on which downstream analytics providers access AIS infrastructure.

sections:
  - id: market-boundary
    title: Market Boundary, Scope, and Substitutes
    body: |
      Kpler's served market is real-time seaborne commodity flow intelligence: the collection,
      fusion, and analytics layer that translates AIS positioning data, satellite imagery, port
      call records, customs filings, and commercial loading data into actionable intelligence about
      where physical commodities are moving, how much is being loaded or discharged, and what
      supply/demand implications follow. This is distinct from — though adjacent to — several
      related markets.

      Included in Kpler's served market is subscription spend on commodity intelligence platforms
      covering seaborne flows, vessel tracking, cargo inference, freight analytics, inventories
      monitoring, compliance screening, and energy fundamentals. Kpler covers 40+ commodities
      spanning crude oil, LNG, LPG, refined products, dry bulk (iron ore, coal, grains, fertilisers),
      metals, chemicals, and energy transition commodities, tracking 36,000+ commodity vessels
      globally at any time with more than 10 years of historical time-series data.

      Excluded from Kpler's core served market are: (a) paper and financial commodity derivatives
      markets served by Bloomberg Terminal, Refinitiv Eikon/LSEG, and ICE Data Services, where Kpler
      is a data supplier rather than the principal tool; (b) port operations execution software
      (Terminal Management Systems, TOS platforms); (c) freight brokerage execution platforms
      (Baltic Exchange, Clarksons Shipping); and (d) land-based logistics execution software
      (SAP TM, Oracle Transportation Management). Government-published statistics from IEA, EIA,
      and JODI constitute the primary status-quo substitutes for buyers who do not yet pay for a
      dedicated platform; these sources are lagged by days to weeks and lack vessel-level granularity
      needed for front-office trading decisions.

      Adjacent expansion surfaces for Kpler include: (a) maritime compliance and sanctions screening,
      now served by its Risk & Compliance product; (b) satellite-based agricultural commodity
      monitoring; (c) supply chain finance intelligence; and (d) government and defense trade security.
      The energy transition adjacency — tracking LNG, green hydrogen, ammonia, biofuels, and carbon
      flows — is an explicit growth surface codified in a standalone Kpler Energy Transition product
      line. The scope boundary between "commodity intelligence" and "maritime tracking" is deliberately
      blurred by Kpler's acquisitions of MarineTraffic and Spire Maritime: AIS infrastructure
      ownership collapses the upstream data layer into the analytics product, making it harder for
      competitors to source the same raw input on equivalent terms.
