  - id: market-sizing
    title: Market Sizing — TAM, SAM, and SOM Lenses
    body: |
      No single published independent analyst report isolates the TAM/SAM for Kpler's specific
      market boundary, so this section triangulates from three lenses: (a) the maritime intelligence
      and shipping analytics market, which S&P Global characterises as spanning 765+ freight rate
      assessment categories touching all commodity sea trades; (b) the commodity data analytics
      market broader view used by independent market observers; and (c) a bottom-up capacity lens
      grounded in estimated buyer populations and subscription economics.

      The maritime intelligence TAM by a conservative lens is estimated at $5–8 billion annually,
      covering vessel tracking, freight rates, port intelligence, and cargo analytics but excluding
      financial derivatives data. S&P Global Platts and Kpler are the two dominant players in this
      definition. Broadening to all physical commodity data analytics — including energy fundamentals
      (IEA/EIA), dry bulk intelligence, metals trade flows, and agricultural analytics — the
      mid-range TAM is estimated at $8–14 billion by independent observers. This aligns with
      Kpler's stated ambition to be the "definitive intelligence platform for global physical trade."
      Including adjacent analytics layers such as supply chain risk, compliance screening, satellite
      imagery analytics, and trade finance intelligence, the broad TAM could reach $12–20 billion.

      Kpler's Serviceable Addressable Market (SAM) is estimated at $3.5–5.5 billion, derived from:
      (a) 5,000–10,000 active physical commodity trading desks globally; (b) 1,000–2,000 energy
      majors, NOCs, and utilities with dedicated analytics budgets; (c) 500–1,000 financial
      institutions with commodity desks; (d) 3,000–5,000 maritime operators and port authorities;
      and (e) 100–500 government/defense agencies. At average annual contract values of $50K–$300K,
      this population supports a $3.5–5.5B SAM. Kpler's current SOM penetration is estimated at
      5–10% of SAM — implied by a $200–400M ARR estimate (derived from a ~$4B valuation at a 4–6×
      ARR multiple typical of high-margin data businesses) against the $3.5–5.5B SAM.

      A critical diligence gap: no independent analyst report specifically sizes Kpler's market
      boundary, and the widest published TAMs ($12–20B) conflate adjacent markets while the narrowest
      ($1–2B for pure trading tool subscriptions) exclude energy fundamentals and compliance spend.
      These contradictory estimates are preserved as a range rather than resolved into a single figure.
      The market CAGR is estimated by independent reviewers at 7–12% annually based on regulatory
      complexity growth, energy transition analytics demand, and increasing algorithmic reliance on
      cargo flow data. Kpler's $1.2B total funding from Insight Partners and the June 2026 $1B+
      Sixth Street investment at ~$4B implied valuation reflect investor confidence in a material
      and growing addressable market.
