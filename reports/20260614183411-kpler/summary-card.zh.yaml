summary:
  headline: >
    Kpler 是定义品类的实物贸易情报平台，AIS 数据护城河难复制，ARR 快速增长已被证实，企业客户超过 12,000 家；但 2026 年 6 月 Sixth Street 入场对应 13–20x ARR
    的隐含倍数，相比上市数据分析同业偏贵。公司未披露 NRR、毛利率、 流失率等单位经济，叠加英国 CMA 反垄断审查和联合创始人交班，暂不能给出买入结论。
  overallScore: 6.8
  recommendation: track
