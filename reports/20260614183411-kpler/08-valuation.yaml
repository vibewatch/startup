  - id: financing-valuation-comparables
    title: Financing Context, Valuation Mechanics, and Comparable Set
    body: >-
      The June 2026 Sixth Street transaction is structured as a minority strategic growth equity investment. Five Arrows (the alternative assets arm of Rothschild & Co, €33B AUM) fully exited its position; Insight Partners ($90B+ AUM) rolled a portion of its original stake. The two had invested more than $200M combined for their combined holding in April 2022 in a deal that valued Kpler at an undisclosed, but substantially lower, figure. By February 2025, Baird Maritime's sources put a potential deal EV at €3B+ ($3.11B) based on €200M+ ARR. The June 2026 deal at an implied ~$4B represents approximately a 28–30% appreciation in 16 months, consistent with the ARR growth rate exceeding market expectations.

      Sixth Street manages over $130B in AUM and has 750+ team members including approximately 300 investment professionals. Its Sixth Street Growth arm focuses specifically on growth equity and bespoke capital solutions for mid- to late-stage technology companies. Prior investments include Spotify (2016 convertible), Airbnb (with Silver Lake), FC Barcelona (2022), and numerous data and software businesses. This deal pattern is consistent with Sixth Street's strategy of deploying flexible capital into high-quality data businesses at inflection points.

      Public market comparable revenue multiples as of June 2026 reveal a wide range: SPGI trades at approximately 7.9x trailing revenue ($124B market cap / $15.73B TTM revenue), Verisk Analytics at 7.8x ($24.1B / $3.10B), MSCI Inc. at approximately 13.5x ($43.6B / $3.24B), FactSet at 3.7x ($8.79B / $2.40B), and Morningstar at 2.65x ($6.66B / $2.51B). MSCI is the best-fit analog — subscription-based, defensible data moat, high NRR, index and analytics platform. At $250M ARR, Kpler's implied 16x ARR multiple is a 19% premium to MSCI, not yet justified by disclosed financials but plausible given a higher organic growth rate.

      Private and M&A comparables provide additional context. Argus Media was valued at $4.6B including debt in 2024 when its CEO gained control — suggesting the energy commodity data category supports premium multiples. BlackRock acquired Preqin, the private equity data analytics platform, for £2.55B ($3.17B) in 2024, providing a financial analytics M&A comp. These transactions confirm that high-quality, subscription-based data businesses in commodity/financial analytics attract 15–20x ARR multiples in private and M&A markets, partially validating the Kpler pricing, though none of these comps have fully disclosed unit economics either.

      A private-market illiquidity discount of 15–25% is typically applied to growth equity investments versus liquid public securities. Paradoxically, Kpler trades ABOVE the best public comp (MSCI at 13.5x P/S) rather than below it, suggesting the market is pricing in either materially higher growth than MSCI's 10–11% annual revenue growth, or a strategic acquisition premium. Both are plausible but constitute forward-looking assumptions rather than evidence-based certainties.
