callouts:
  - calloutType: recommendation
    title: TRACK — Stretched Valuation Requires Disclosure Before Conviction
    body: >-
      Kpler is a genuinely exceptional B2B data business with a defensible AIS data moat, remarkable
      ARR growth, and a mission-critical subscription model. However, the June 2026 Sixth Street entry
      at approximately 16x implied ARR is stretched relative to public data-analytics peers, including
      the best-fit comparable MSCI at 13.5x P/S. Without disclosed gross margin and NRR, the multiple
      cannot be independently validated. The UK CMA review, co-founder governance transition, and undisclosed
      deal structure collectively maintain this at TRACK. A downward re-rating event (CMA adverse outcome,
      NRR below 100%) would make the bear case the base case. A positive catalyst (financial disclosure
      showing 65%+ gross margin and 115%+ NRR) would move the recommendation to BUY.
    claimRefs:
      - CV001
      - CV011
      - CV018
      - CV029
      - CV030

  - calloutType: risk
    title: The AIS Consolidation That Created the Moat May Also Destroy It
    body: >-
      Kpler's proprietary AIS data infrastructure — the core of its data moat and the primary justification
      for its premium multiple — was assembled through three acquisitions that are under UK CMA review.
      The worldwideais.org 2026 analysis states explicitly that Kpler's vertical integration from AIS sensor
      to analytics platform creates pricing power concentration with "no upstream competitor to create price
      tension." If the CMA characterizes this as anti-competitive and orders structural remedies, the data
      moat would be directly impaired. This single risk factor is capable of shifting the valuation toward
      bear-case outcomes entirely on its own.
    claimRefs:
      - CV029
      - CV038
      - CV044

