  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: unit-economics
      missingEvidence: Kpler's gross margin, net revenue retention (NRR), and unit economics (CAC, LTV, payback period)
      whyItMatters: >-
        Without gross margin and NRR, the $4B implied valuation at 16x ARR cannot be independently
        validated. A gross margin below 50% would suggest structural profitability challenges at scale;
        NRR below 100% would undermine the ARR growth narrative entirely. These two metrics are the
        primary conviction blockers for moving from TRACK to BUY.
      diligencePath: >-
        Direct CFO access in IC process; request management accounts for FY2024 and interim FY2025;
        infer NRR from ARR trajectory divided by headcount growth; customer interviews.
      relatedQuestionRefs:
        - QV018

    - type: private-evidence-only
      severity: material
      topic: deal-structure
      missingEvidence: >-
        Exact breakdown of primary vs secondary capital in the $1B+ Sixth Street investment;
        preference rights, anti-dilution terms, and governance provisions negotiated with Sixth Street.
      whyItMatters: >-
        The effective post-money valuation cap and Sixth Street's structural protections determine
        how the exit proceeds will be distributed. If most of the $1B+ was secondary (buying out
        Five Arrows), the actual primary capital on Kpler's balance sheet for growth investment
        could be materially less than $1 billion.
      diligencePath: >-
        Review future Companies House charge filings; request term sheet or investor agreement
        summary from management; infer from future acquisition announcements vs organic investment pacing.
      relatedQuestionRefs:
        - QV021

