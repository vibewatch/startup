chapter:
  number: 7
  title: Risks
  summary: >
    Wellhub faces a cluster of material risks led by Brazilian antitrust enforcement, multi-jurisdictional health-data
    privacy regulation, BRL currency exposure, and $600M Urban Sports Club integration complexity. Brazil's CADE invalidated
    approximately 3,500 gym exclusivity contracts in March 2025 and fined Wellhub R$3 million in 2024 for TCC breach; a
    January 2026 settlement allows exclusivity with only ten named major gym networks while the rest of ~40,000 Brazilian
    partners operate non-exclusively. LGPD enforcement is escalating — ANPD's 2025-2026 agenda explicitly prioritizes health
    data, with fines up to 2% of Brazil revenue capped at R$50 million per violation. GDPR healthcare enforcement reached
    €32.3 million in 265 fines in 2025-2026. Currency risk is acute: BRL/USD peaked at 6.75 in December 2024 and remains
    volatile at ~5.02 in May 2026. CEO Cesar Carvalho's key-person dependency and the fitness sector's COVID-19 precedent
    (22% US gym closures, $29.2B revenue loss) constitute the primary thesis-break vectors.

sections:
  - id: regulatory-legal-risks
    title: Regulatory and Legal Risks
    body: >
      Wellhub's most material near-term risk is its ongoing antitrust dispute with Brazil's CADE (Conselho Administrativo de
      Defesa Econômica). In 2022, Wellhub signed a cease-and-desist agreement (TCC) limiting gym exclusivity contracts to
      20% of any given area. CADE found in March 2025 that Wellhub had violated this TCC by maintaining exclusive contracts
      with approximately 3,500 gyms, including contracts signed from 27 September 2022 onward. CADE issued an interim order
      invalidating all such contracts and prohibiting new exclusivity — this came after an R$3 million fine in 2024 for TCC
      breach. In January 2026, Wellhub signed a new TCC with CADE permitting exclusivity with only ten named major chains
      (Bluefit, BodyTech/Fórmula, Cia Athletica, Panobianco, PHD Sports, Pratique, Pure Pilates, Selfit, Contorno do Corpo,
      Engenharia do Corpo), while the remaining ~40,000 Brazilian partners must operate on a non-exclusive basis. A final
      CADE judgment remains pending, and further conditions could be imposed. Before the antitrust orders, NeoFeed reported
      Wellhub held approximately 80% of Brazil's gym-aggregator market by user volume — the structural moat that CADE has
      now partially dismantled.

      On the data privacy front, Wellhub processes sensitive health data — fitness records, biometric usage patterns, sleep
      logs, nutrition data, and mental-health session records — across 18 countries. Brazil's ANPD published its 2025-2026
      Regulatory Agenda on 11 December 2024, with 16 planned actions explicitly including health data, AI, biometric data,
      and personal-data aggregators as priority items. ANPD Resolutions No. 30 and No. 31 (December 2025) updated this agenda
      with age-verification, AI obligations, and revised sanction rules. LGPD fines can reach 2% of Brazilian gross revenue
      capped at R$50 million per violation; ANPD's total enforcement fines from 2023 to 2025 are estimated at approximately
      R$98 million across cases involving Meta, Clearview AI, and the healthcare sector. The EU's GDPR enforcement tracker
      (CMS Law, 2026) reports 265 healthcare fines totaling €32.3 million, with Italy, Spain, and Germany leading; the
      largest single case was €3.5 million for a ransomware attack exposing 79,404 individuals' health data due to absent
      multi-factor authentication. Wellhub's data controller structure (GPBR Participações Ltda. for Brazil, Gympass US LLC
      for EEA/UK) creates multi-jurisdictional exposure, and the Urban Sports Club acquisition adds additional European
      GDPR territories. Wellhub holds ISO 27001 and PCI-DSS certifications and publishes a SafeBase Trust Center, but no
      third-party audit report is publicly available and health-data processing at scale remains a prime enforcement target.
