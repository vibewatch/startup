  - id: people-execution-risks
    title: People, Execution, and IPO Risks
    body: >
      Wellhub's execution risk is concentrated at the CEO level. Cesar Carvalho, co-founder and CEO since 2012, has been
      the principal architect of every major strategic pivot: the 2019 US expansion, the 2022 shift from B2C to B2B, the
      2024 rebrand from Gympass to Wellhub, and the $600M Urban Sports Club acquisition. He is Wellhub's primary public
      spokesperson, investor-relations voice, and brand identity. No succession plan has been publicly disclosed, and
      second-tier leadership visibility is limited to CFO Bruno Annicq and a few functional heads. An unexpected Carvalho
      departure during the simultaneous Urban Sports Club integration and pre-IPO preparation would likely trigger an
      investor confidence shock, operational disruption, and potential valuation impact.

      IPO execution risk is elevated but unquantified. Carvalho has stated a future listing would likely be on a US
      exchange but has given no confirmed date or S-1 filing. Forge Global lists Wellhub's latest pre-IPO secondary
      market valuation at $3.29 billion (Series F-1, December 2024) with total funding of $699.8 million. SEC
      registration, Sarbanes-Oxley compliance, cross-border audit standardization across 18 countries, and the timing
      sensitivity of launching in volatile SaaS public markets are material execution hurdles. A down-round IPO in
      depressed tech multiples could impair employee option value and increase churn risk among senior talent.

      Talent risk is also material. Wellhub's 2,000+ employee workforce spans 18 countries under multiple labor regimes:
      Brazil's CLT, Germany's strong worker protections (relevant after the Urban Sports Club acquisition), and US at-will
      employment. The AI Coach beta launched in early 2026 signals an AI product push that will require competing against
      large US tech firms for AI/ML talent. Multi-country labor-law compliance — particularly CLT (Brazil) and Arbeitsrecht
      (Germany) — creates ongoing HR legal exposure. Despite these risks, Wellhub's 2026 Wellbeing at Work survey of
      5,000+ employees and executives across 9 countries found that 78% of CEOs view wellness as a strategic investment
      with 82% reporting positive ROI, suggesting employer budget resilience that limits demand-side churn even in a mild
      recession.
