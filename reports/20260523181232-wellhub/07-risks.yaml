callouts:
  - calloutType: risk
    title: "CADE Antitrust Is the Highest-Severity Near-Term Risk"
    body: >
      The March 2025 CADE interim order and the January 2026 new TCC represent a fundamental structural shift: Wellhub
      no longer holds exclusive contracts with ~97% of its Brazilian partner network, opening the door for TotalPass and
      GuruPass to gain simultaneous listings at gyms that previously had no choice but to use Wellhub. The competitive
      moat built over a decade is partially dismantled. A final CADE judgment imposing broader remedies would be a
      thesis-break event for the Brazil market thesis.
    claimRefs:
      - CR001
      - CR004
      - CR005
      - CR006

  - calloutType: risk
    title: "COVID-19 Precedent: 22% Gym Closures and $29.2B Revenue Loss Is the Kill-Criteria Benchmark"
    body: >
      The fitness industry's COVID-19 experience is the clearest precedent for Wellhub's pandemic exposure. A future
      pandemic forcing extended gym closures at scale would simultaneously eliminate Wellhub's core product, trigger
      mass employer churn, and strand partner payout obligations. The January 2026 CADE settlement shows Wellhub can
      survive a structural regulatory shock — but a forced closure of 40%+ of its physical partner network is a scenario
      the current platform cannot fully absorb, since digital revenue cannot replace gym-access value proposition
      at equivalent ARPU.
    claimRefs:
      - CR028
      - CR029
      - CR030
      - CR031

  - calloutType: recommendation
    title: "Prioritize Privacy Audit and CADE Monitoring Before Committing Capital"
    body: >
      Given the combination of escalating LGPD/GDPR health-data enforcement and the pending CADE final judgment, any
      investor considering a commitment should require: (1) an independent LGPD compliance audit with DPO credentials,
      (2) a confirmed GDPR data-protection impact assessment for the Urban Sports Club integration, and (3) a quarterly
      CADE proceeding update mechanism. These diligence items are non-negotiable given the R$50M LGPD fine ceiling and
      the possibility of CADE imposing structural remedies beyond the current TCC.
    claimRefs:
      - CR006
      - CR013
      - CR016
      - CR020

