  - id: partner-dependency-risks
    title: Partner, Dependency, and Network Risks
    body: >
      Wellhub operates a two-sided marketplace with approximately 100,000 wellness partners globally and 39,000 corporate
      employer clients. The January 2026 CADE settlement frees approximately 3,500 formerly exclusive Brazilian gyms to
      simultaneously partner with TotalPass, GuruPass, and other aggregators. Since Wellhub's per-check-in payout model
      makes check-in volume the primary revenue driver for partner payments, any migration of non-exclusive gyms to rival
      platforms would directly reduce utilization and Wellhub's partner-value proposition to employers. Wellhub reported
      1 billion check-ins globally in 2025 and partner payouts growing approximately 60% in Q4 2025 versus Q4 2024 —
      metrics that will face pressure as Brazilian gym exclusivity erodes.

      The $600 million Urban Sports Club acquisition (closed September 9, 2025, following German Bundeskartellamt and
      Spanish CNMC clearance) adds approximately 57,000 European wellness partners and expands Wellhub's footprint to
      18+ countries. However, USC is currently operating as a separate entity. Full platform consolidation — integrating
      Wellhub's tech stack, partner onboarding APIs, billing infrastructure, and mobile apps with USC's European systems
      — is a multi-year execution challenge across jurisdictions with differing data protection, labor, and commercial law
      requirements. USC co-founders retain leadership roles, providing local expertise, but cultural alignment between
      a US-led Wellhub and a European-rooted USC team remains an untested integration risk.

      Cloud infrastructure dependency is significant. Wellhub's platform processes check-in events at 100,000+ locations
      globally; a major cloud-provider outage or API failure would disrupt end-user access, partner attendance records,
      and per-check-in payment flows simultaneously. The company's trust center confirms the use of third-party cloud
      infrastructure but does not publicly disclose its primary provider, multi-cloud failover strategy, or recovery
      time objectives. Investor concentration — SoftBank Vision Fund and EQT Growth as major shareholders — creates
      governance risk if fund cycles force secondary sales or strategic changes ahead of a potential public listing.
