summary:
  headline: >-
    Wellhub is the global leader in employer-sponsored wellness benefits with $319M ARR and genuine platform scale, but
    its $4.2B secondary-market valuation implies a 13.2x EV/ARR multiple on undisclosed financials — stretched versus
    all public and private comps — warranting a Track stance until gross margin, NRR, and post-USC integration economics
    are confirmed.
