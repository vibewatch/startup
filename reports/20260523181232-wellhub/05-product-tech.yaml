callouts:
  - calloutType: strength
    title: World's Largest Corporate Wellness Network
    body: >-
      With 100,000+ partners across 18 countries, 50+ CMS integrations, and 1 billion cumulative
      check-ins by end of 2025, Wellhub has built a network moat that is extremely difficult for
      a point-solution competitor to replicate. The B2B2C flywheel—where >90% of users are net-new
      to visited facilities—creates aligned incentives across employers, employees, and operators.
    claimRefs:
      - CE003
      - CE035
      - CE036
      - CE037

  - calloutType: risk
    title: Health Data Sensitivity Without Public Certification
    body: >-
      The platform collects Health & Fitness and Financial data linked to user identity across
      therapy, nutrition, and fitness modules, yet Wellhub has not publicly confirmed SOC 2 Type II
      or HIPAA Business Associate Agreement status. This creates a diligence gap for US enterprise
      buyers in regulated industries and is a potential barrier to expansion into health-plan-integrated
      corporate wellness programs.
    claimRefs:
      - CE021
      - CE023
      - CE041

  - calloutType: risk
    title: Urban Sports Club Integration Execution Risk
    body: >-
      The $600 million USC acquisition added a significant European microservice estate that is
      currently operating independently with no disclosed integration timeline or architecture roadmap.
      Merging two large platform codebases—each with their own partner networks, booking integrations,
      and regional data residency requirements—represents the most consequential technical execution
      risk for Wellhub in 2026–2027.
    claimRefs:
      - CE031
      - CE032

