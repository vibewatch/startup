  - id: TE003
    title: Technology / Operating Architecture Table
    columns:
      - Layer / Component
      - Role
      - Key Dependency
      - Risk
    rows:
      - - Cloud Infrastructure (AWS)
        - Hosting for all application services; global reach across 18 markets
        - Amazon EKS, RDS, DynamoDB, S3, Lambda
        - Single cloud vendor; AWS outage or pricing change has fleet-wide impact
      - - Container Orchestration (Kubernetes / EKS)
        - Application lifecycle management; auto-scaling; rolling deployments
        - Helm charts; custom CRDs; Production Engineering team
        - Kubernetes cluster management complexity at 40,000-client scale
      - - Infrastructure as Code (Terraform)
        - AWS resource provisioning; repeatable environment setup
        - Gympass-maintained Terraform modules and custom Kubernetes Operators
        - Drift or misconfiguration risk; requires PE team review for production changes
      - - API Gateway / Integration Layer
        - Expose REST API and SFTP endpoints for HR systems; Booking/Access Control APIs for fitness partners
        - REST API at api.partners.gympass.com; SFTP exchange; SSO (docs in progress)
        - Dual-endpoint maintenance (gympass.com legacy domain); SSO documentation incomplete
      - - Mobile Application (iOS / Android)
        - Primary employee-facing surface; gym discovery, booking, check-in, AI Coach
        - iOS 15.1+ (136 MB); 8 languages; Apple Health integration; GymPass B.V. entity
        - User-reported login failures post employment change; billing notification glitches
      - - Secret / Identity Management
        - Secure credential storage and IAM role binding for microservices
        - HashiCorp Vault; AWS IAM with EKS IRSA (IAM Roles for Service Accounts)
        - Vault operational overhead; rotation processes not publicly documented
    notes: >-
      Architecture details sourced from Wellhub's engineering blog (2020 baseline) and GitHub org as of May 2026.
