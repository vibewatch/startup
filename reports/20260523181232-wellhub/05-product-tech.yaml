  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: compliance-gap
      missingEvidence: >-
        SOC 2 Type II audit report and HIPAA Business Associate Agreement or equivalent health
        data processing certification for the Wellhub platform.
      whyItMatters: >-
        Enterprise buyers in US regulated industries (healthcare sponsors, financial services)
        require SOC 2 and HIPAA evidence as a baseline vendor qualification; absence blocks
        deals or forces compensating controls.
      diligencePath: >-
        Request the SOC 2 Type II report and HIPAA BAA directly from Wellhub's Security Trust
        Center team during vendor procurement; ask for the date of the most recent audit.
      relatedQuestionRefs:
        - QE011
        - QE014

    - type: private-evidence-only
      severity: material
      topic: platform-integration
      missingEvidence: >-
        Urban Sports Club technology integration architecture, timeline, and data migration
        plan following the September 2025 acquisition.
      whyItMatters: >-
        The $600M USC acquisition created a second large microservice estate; failure to
        integrate cleanly could result in duplicated costs, divergent user experiences, and
        technical debt that delays product innovation.
      diligencePath: >-
        Request integration architecture documents, milestone timeline, and engineering
        headcount allocation from Wellhub management during due diligence.
      relatedQuestionRefs:
        - QE025

    - type: missing-source
      severity: material
      topic: AI-coach
      missingEvidence: >-
        Technical architecture of Wellhub AI Coach including underlying LLM, safety/accuracy
        benchmarks, model governance, and data training provenance.
      whyItMatters: >-
        AI coaching in a wellness context involves sensitive goal and health data; unvetted
        model quality could damage user trust, create liability, and face regulatory scrutiny
        under emerging AI governance frameworks.
      diligencePath: >-
        Request AI model card, safety testing protocols, and data governance documentation
        from Wellhub's product/engineering leadership; monitor public beta feedback for
        accuracy or safety incidents.
      relatedQuestionRefs:
        - QE017

    - type: missing-source
      severity: minor
      topic: differentiation
      missingEvidence: >-
        Independent comparative analysis of Wellhub's partner API breadth and integration
        depth versus ClassPass (Mindbody-eGYM), TotalPass, and Urban Sports Club pre-merger.
      whyItMatters: >-
        The defensibility of Wellhub's technology lead depends partly on whether competitors
        can replicate its 50+ CMS integration network; no independent audit exists.
      diligencePath: >-
        Commission or review third-party API capability benchmarking across major corporate
        wellness platforms, or analyze partner ecosystem announcements from competitors.
      relatedQuestionRefs:
        - QE023

