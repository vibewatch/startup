company:
  name: Wellhub
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Wellhub delivers a five-category B2B2C corporate wellness platform—fitness, mindfulness,
    therapy, nutrition, and sleep—atop a 100,000+ partner network spanning 18 countries.
    The product is engineered on AWS/EKS with a microservices architecture, exposes REST/SFTP/SSO
    integration paths for HR and fitness-partner systems, and launched an AI Coach in beta in
    January 2026. Key diligence gaps include the absence of public SOC 2 / HIPAA certifications,
    undisclosed Urban Sports Club platform integration timeline, and limited public documentation
    of the AI Coach's underlying model stack.

sections:
  - id: platform-overview
    title: Platform Overview and Wellness Modules
    body: >-
      Wellhub is a B2B2C corporate wellness SaaS platform that aggregates over 100,000 gyms,
      studios, and digital wellness providers into a single employer-subsidized subscription.
      Employees access the platform through a tiered subscription, with plans ranging from
      a Digital tier (digital apps only, $0/month employee co-pay) up to a Diamond tier
      ($344.99/month) that unlocks the broadest in-person access. Companies pay annually based
      on team size and can launch their Wellhub program in 30 days or less.

      The five product categories—fitness, mindfulness, therapy, nutrition, and sleep—are
      delivered through a combination of in-person partners (gyms, studios, swimming pools,
      tennis courts), virtual personal trainers (3,800+), and digital wellness apps (99+).
      As of January 2026, the network surpasses 100,000 total partners across 18 countries.
      Wellhub's Trainiac subsidiary contributes a dedicated virtual personal training module.

      The platform generates demonstrable engagement: 93% of employees surveyed in 2026 rated
      wellbeing as important as salary, enrollment rates run 3–5× higher than traditional
      employer wellness programs, and cumulative member check-ins reached 1 billion by end
      of 2025. The maturity of individual product categories varies significantly: gym-access
      and check-in workflows are fully productized, while AI coaching and therapy modules
      remain in early or beta stages with limited technical transparency.
