  - id: trust-privacy-compliance
    title: Trust, Privacy, and Compliance
    body: >-
      Wellhub's data controller for US users is Gympass US, LLC. The privacy policy
      covers the full range of data the app collects: Health & Fitness data linked to
      user identity, Financial Info, Location, Contact Info, Usage Data, and Identifiers.
      The iOS App Store disclosures confirm that Health & Fitness and Financial Info are
      linked to user identity—a material consideration for enterprises in regulated sectors.
      GDPR lawful bases are published for EU/UK users; Brazil's LGPD is addressed with
      separate data controller assignments for Brazilian users.

      Wellhub operates a Security Trust Center at security.wellhub.com that lists
      data-protection controls, media retention policies, third-party system authentication,
      and cybersecurity compliance scope verification. However, the company has not publicly
      disclosed SOC 2 Type II certification or HIPAA Business Associate Agreement status
      as of May 2026. Enterprise procurement teams in US regulated healthcare or financial
      services verticals should request current audit reports directly.

      User reviews on Trustpilot (4.1/5, 3,286 reviews) and the iOS App Store (4.3/5,
      8,100+ ratings) reveal recurring complaints about login failures when employment
      changes and duplicate billing charges—pointing to gaps between the employer-managed
      eligibility data pipeline and consumer-facing account management logic.
