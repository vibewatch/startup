      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: CADE Antitrust Is the Highest-Severity Near-Term Risk
            body: >
              The March 2025 CADE interim order and the January 2026 new TCC represent a fundamental structural shift:
              Wellhub no longer holds exclusive contracts with ~97% of its Brazilian partner network, opening the door
              for TotalPass and GuruPass to gain simultaneous listings at gyms that previously had no choice but to use
              Wellhub. The competitive moat built over a decade is partially dismantled. A final CADE judgment imposing
              broader remedies would be a thesis-break event for the Brazil market thesis.
            calloutType: risk
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
          - type: callout
            title: 'COVID-19 Precedent: 22% Gym Closures and $29.2B Revenue Loss Is the Kill-Criteria Benchmark'
            body: >
              The fitness industry's COVID-19 experience is the clearest precedent for Wellhub's pandemic exposure. A
              future pandemic forcing extended gym closures at scale would simultaneously eliminate Wellhub's core
              product, trigger mass employer churn, and strand partner payout obligations. The January 2026 CADE
              settlement shows Wellhub can survive a structural regulatory shock — but a forced closure of 40%+ of its
              physical partner network is a scenario the current platform cannot fully absorb, since digital revenue
              cannot replace gym-access value proposition at equivalent ARPU.
            calloutType: risk
            claimRefs:
              - CR028
              - CR029
              - CR030
              - CR031
          - type: callout
            title: Prioritize Privacy Audit and CADE Monitoring Before Committing Capital
            body: >
              Given the combination of escalating LGPD/GDPR health-data enforcement and the pending CADE final judgment,
              any investor considering a commitment should require: (1) an independent LGPD compliance audit with DPO
              credentials, (2) a confirmed GDPR data-protection impact assessment for the Urban Sports Club integration,
              and (3) a quarterly CADE proceeding update mechanism. These diligence items are non-negotiable given the
              R$50M LGPD fine ceiling and the possibility of CADE imposing structural remedies beyond the current TCC.
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR013
              - CR016
              - CR020
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              Wellhub presents as a high-conviction platform story wrapped in a high-uncertainty financial package. The
              bull thesis centers on four structural advantages: a global partner network of 100K+ wellness venues that
              is practically impossible to replicate cold; a B2B PEPM distribution model through 40K employer clients
              that generates predictable ARR and high switching costs; an M&A track record that includes the $600M
              acquisition of Urban Sports Club (Germany/Europe leader); and a Brazilian home market that—despite CADE
              scrutiny removing exclusivity protections—still represents the world's most densely penetrated corporate
              wellness market.

              The anti-thesis is less about the business model and more about valuation geometry. At $4.2B on $319M ARR,
              the implied 13.2x EV/ARR multiple sits nearly 4x above the Q1 2026 public SaaS median of 3.3x (PitchBook)
              and 2x above the EGYM/Playlist private-market comp. The secondary-market mark is illiquid and
              seller-heavy—upmarket.co reports $21M in ask volume versus only $1M in bid volume at roughly $9.08/share.
              CEO César Carvalho has explicitly stated no IPO dates or milestones, removing the natural re-rating
              catalyst. The result is a business whose fundamental quality is not in question but whose current entry
              price demands a premium that requires significant execution and favorable macro conditions to deliver
              returns.

              The thesis-antithesis framework does not resolve cleanly because the two sides address different risks:
              the bull case is about organic execution, and the bear case is about market repricing of multiples. Both
              can be simultaneously true, which is why the Track stance is appropriate: strong monitoring but not
              capital commitment until the valuation compresses naturally or disclosures close the information gap.
            claimRefs:
