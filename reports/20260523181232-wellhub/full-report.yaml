chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >
              Wellhub is a cloud-based, business-to-business (B2B) corporate wellness platform headquartered in New York
              City, with major operations in São Paulo, Brazil. Originally incorporated and operated as Gympass, the
              company underwent a formal rebrand to Wellhub on April 4, 2024, reflecting its strategic expansion beyond
              gym access into five wellness verticals: fitness, mindfulness, therapy, nutrition, and sleep. The rebrand
              was announced simultaneously with new product features and new network partners, and was explicitly linked
              by CEO Cesar Carvalho to preparations for an eventual IPO, though no concrete IPO date or exchange listing
              has been confirmed as of May 2026.

              The company's core business model is a two-sided marketplace with a B2B2C structure. Employers pay an
              annual platform fee to Wellhub (the SaaS-like component), which grants their employees the option to
              purchase monthly subscription plans at subsidized rates, unlocking access to a large curated network of
              gyms, studios, trainers, and digital wellness apps. Wellhub pays network partners on a per-check-in basis,
              creating direct revenue alignment with partner utilization. This model is differentiated from direct gym
              memberships and from employee-reimbursement programs by its aggregated, flexible, and measurable
              structure. As CFO Bruno Annicq has stated publicly, the combination of fixed employer fee and variable
              employee adoption creates a flywheel: higher employee enrollment drives stickier contracts and better net
              revenue retention.

              As of March 2026, Wellhub operates in 18 countries (including the US, Brazil, UK, Germany, France, Spain,
              Mexico, Argentina, Chile, Ireland, Italy, Portugal, and five newly added European countries from the Urban
              Sports Club acquisition) and serves approximately 40,000 corporate clients ranging from SMBs to Fortune
              500 companies. Notable enterprise clients include Aflac, Amazon, Accenture, Citizens Bank, Santander,
              TikTok, Unilever, and KPMG.
