        title: Roadmap, Differentiation, and Technical Risk
        blocks:
          - type: paragraph
            body: >-
              Wellhub's near-term product differentiation rests on three pillars: network scale (100,000+ partners, 18
              countries, 50+ booking-system integrations), engagement mechanics (AI Coach, Check-in Streaks, Challenges
              for segmented groups), and the B2B2C flywheel that delivers incremental gym revenue by routing corporate
              subscribers who are first-time customers (>90% of users are new to visited facilities). The Yoga design
              system and open-source infrastructure tooling (function-aws-importer, cdn-origin-controller) represent
              modest developer goodwill but are not differentiating IP.

              Key roadmap milestones confirmed for 2025–2026 include: International Check-ins (released November 2025,
              now covering 13 countries), Wellhub AI Coach beta (launched January 2026), segmented Challenges (September
              2025), multi-company eligibility management (January 2026), and faster plan activation for company-funded
              programs (2026). New partner additions in 2026 include Bodybar Pilates (US), YMCA expansions (Boston,
              Wyoming Valley, Birmingham), and Lojong mindfulness (US, CA, UK, IE, IT, DE, PT).

              The two primary technical risks are (1) USC platform integration complexity—two large microservice estates
              must eventually converge, with no public architecture roadmap—and (2) the health-data sensitivity of the
              platform, which collects linked Health & Fitness and Financial Info without public certification of HIPAA
              or SOC 2 safeguards. A secondary risk is partner onboarding bottleneck via email-only integration
              coordination, which may constrain network expansion velocity.
