  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: >
              Wellhub's most material near-term risk is its ongoing antitrust dispute with Brazil's CADE (Conselho
              Administrativo de Defesa Econômica). In 2022, Wellhub signed a cease-and-desist agreement (TCC) limiting
              gym exclusivity contracts to 20% of any given area. CADE found in March 2025 that Wellhub had violated
              this TCC by maintaining exclusive contracts with approximately 3,500 gyms, including contracts signed from
              27 September 2022 onward. CADE issued an interim order invalidating all such contracts and prohibiting new
              exclusivity — this came after an R$3 million fine in 2024 for TCC breach. In January 2026, Wellhub signed
              a new TCC with CADE permitting exclusivity with only ten named major chains (Bluefit, BodyTech/Fórmula,
              Cia Athletica, Panobianco, PHD Sports, Pratique, Pure Pilates, Selfit, Contorno do Corpo, Engenharia do
              Corpo), while the remaining ~40,000 Brazilian partners must operate on a non-exclusive basis. A final CADE
              judgment remains pending, and further conditions could be imposed. Before the antitrust orders, NeoFeed
              reported Wellhub held approximately 80% of Brazil's gym-aggregator market by user volume — the structural
              moat that CADE has now partially dismantled.

              On the data privacy front, Wellhub processes sensitive health data — fitness records, biometric usage
              patterns, sleep logs, nutrition data, and mental-health session records — across 18 countries. Brazil's
              ANPD published its 2025-2026 Regulatory Agenda on 11 December 2024, with 16 planned actions explicitly
              including health data, AI, biometric data, and personal-data aggregators as priority items. ANPD
              Resolutions No. 30 and No. 31 (December 2025) updated this agenda with age-verification, AI obligations,
              and revised sanction rules. LGPD fines can reach 2% of Brazilian gross revenue capped at R$50 million per
              violation; ANPD's total enforcement fines from 2023 to 2025 are estimated at approximately R$98 million
              across cases involving Meta, Clearview AI, and the healthcare sector. The EU's GDPR enforcement tracker
              (CMS Law, 2026) reports 265 healthcare fines totaling €32.3 million, with Italy, Spain, and Germany
              leading; the largest single case was €3.5 million for a ransomware attack exposing 79,404 individuals'
              health data due to absent multi-factor authentication. Wellhub's data controller structure (GPBR
              Participações Ltda. for Brazil, Gympass US LLC for EEA/UK) creates multi-jurisdictional exposure, and the
              Urban Sports Club acquisition adds additional European GDPR territories. Wellhub holds ISO 27001 and
              PCI-DSS certifications and publishes a SafeBase Trust Center, but no third-party audit report is publicly
              available and health-data processing at scale remains a prime enforcement target.
