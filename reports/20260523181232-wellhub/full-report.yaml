      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              Four structural growth drivers characterize the 2026 corporate wellness market. First, employer healthcare
              cost inflation: US family insurance premiums reached $25,572 per employee in 2024, a 7% year-on-year
              increase, creating direct financial incentive for preventive programs that can reduce downstream claims
              costs. Second, mental health normalization: post-pandemic awareness, EU-OSHA psychosocial risk mandates,
              and ACA EAP incentive frameworks have made mental health benefits a standard expectation in competitive
              employer benefit packages. Third, the macro productivity cost of untreated mental illness: the WHO
              estimates $1 trillion annually in lost global productivity from depression and anxiety, providing a
              C-suite justification for wellness investment independent of claims-cost framing. Fourth, the shift to
              digital delivery: off-site and virtual wellness programs are growing at 8.23% CAGR versus the
              still-dominant 55.43% on-site share, with outsourced vendor-managed programs growing at 6.89% CAGR —
              dynamics that directly favor Wellhub's platform model over legacy on-site competitors.

              The most critical structural constraint is chronically low participation. Only 20–30% of eligible
              employees globally engage with wellness programs regularly; Gartner data shows only one-quarter of
              employees with mental or emotional wellbeing access actually use it. A February 2026 MIT Sloan evidence
              review concluded that rigorous evidence for wellness programs improving health outcomes "remains
              surprisingly limited — and often contradicts widely cited claims," attributing this to selection bias
              (healthiest employees self-select), weak intervention targeting, and insufficient chronic disease
              management focus. This evidence base challenge weakens employer ROI confidence, particularly among
              data-literate enterprise buyers, and can stall purchasing decisions or compress renewal NRR.

              Regulatory dynamics are mixed. EU-OSHA psychosocial risk assessment mandates create regulatory entry
              points for wellness platform vendors across European markets. In Brazil, CADE's March 2025 prohibition of
              all Wellhub exclusivity contracts limits competitive moat in the company's founding and historically
