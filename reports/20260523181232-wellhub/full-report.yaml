      - number: '5.3'
        title: Partner Integration and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Wellhub exposes three integration paths for HR/client systems: REST API (real-time HTTPS), SFTP file
              exchange (batch), and SSO (Single Sign-On for employee authentication, documentation in progress). The
              REST API supports Eligibility management for Single Entity and Multi Entity clients; SFTP supports the
              broadest flow set including Payroll, Flexible Benefits, and Reporting. Each integration type maps to a
              distinct set of supported flows: Channel Partners, for instance, can access Eligibility and Flexible
              Benefits via API but cannot use the Payroll or Reports flows.

              On the fitness-partner side, Wellhub offers a Booking API for class scheduling, an Access Control API for
              mobile barcode check-in, and a public Postman collection for developer onboarding. Over 50 club management
              systems (including ClubReady and Glofox) are directly integrated, enabling contactless gym entry and
              automatic session confirmation that triggers partner payment. New partner onboarding uses email-based
              coordination through integrations.support@gympass.com—a process that could constrain speed at scale.

              The typical employee workflow begins with HR-system eligibility provisioning, proceeds to in-app plan
              selection and subscription payment, then uses the Wellhub mobile app to discover, book, and check into
              partner facilities. Booking for class-based venues is real-time; open-gym check-ins require the user to
              initiate a check-in within a 30–90 minute validity window. Partners receive payment once check-in is
              confirmed.
