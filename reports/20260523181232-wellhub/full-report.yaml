      - number: '1.5'
        title: Milestones and Corporate History
        blocks:
          - type: paragraph
            body: >
              Wellhub's eleven-year history traces from a Brazilian B2C gym-access app to one of the world's largest B2B
              corporate wellness networks. The founding pivot from direct-to-consumer to employer-sponsored was driven
              by an early enterprise client at PricewaterhouseCoopers Brazil, who asked to extend the benefit to 5,000+
              employees. International expansion followed organically from large clients requesting access in their
              other office countries—Spain via a Mexican banking client, and so on. COVID-19 in 2020 catalyzed an
              accelerated transition to digital wellness, broadening the platform beyond physical gym access.

              Key adverse milestones: In 2022, Brazil's antitrust authority CADE opened a formal investigation into
              Wellhub's exclusive gym contracts, resulting in a cease-and-desist agreement (TCC). In December 2024, CADE
              fined Wellhub R$3 million (~$600K USD) for violating the TCC by continuing exclusivity practices. In March
              2025, CADE invalidated all Wellhub exclusivity contracts signed since 2022 and prohibited any future
              exclusive arrangements with gyms, directly affecting approximately 3,500 gym partnerships in Brazil. This
              regulatory action represents the most significant legal adverse event to date and may constrain Wellhub's
              competitive moat in its home market. The company has denied wrongdoing and stated it will defend the
              rights of gyms to enter strategic partnerships.

              Major acquisitions include Trainiac (December 2021, terms undisclosed), online personal training in the
              US; Fitprime, Andjoy, and 7Card in Europe (dates not publicly confirmed); and Urban Sports Club (September
              2025, $600M), a leading European employee benefits platform serving five additional European countries.
              The Urban Sports Club deal is the largest acquisition on record and signals Wellhub's intent to
              consolidate the European corporate wellness market.
