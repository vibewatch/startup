  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Business Model
        blocks:
          - type: paragraph
            body: >
              Wellhub operates a B2B2C revenue model with two primary cash-flow mechanisms. The first is a recurring
              employer platform access fee, structured as a per-eligible-employee-per-month (PEPM) charge typically
              cited publicly at $2–$5 per eligible employee regardless of whether that employee opts into a plan. This
              component functions like a SaaS annual contract — predictable, recurring, tied to employer headcount
              rather than employee usage. The second mechanism is employee subscription revenue: employees who choose to
              activate their benefit pay a monthly plan fee ranging from $0 (Digital tier, digital-only access) to
              $344.99/month (Diamond tier, all-access premium). Wellhub collects these employee payments directly (or
              via payroll deduction), then pays wellness partners a per-check-in fee, creating a variable
              cost-of-revenue tied to utilization.


              The $319M ARR figure reported by Getlatka as of September 2025 is company-reported and unaudited. It is
              most likely gross revenue inclusive of both the employer PEPM and employee subscription receipts, before
              deducting partner payouts (which constitute the primary cost of revenue). Global partner payouts to
              fitness operators grew 107% year-over-year in 2025, with US payouts nearly doubling — signaling that
              utilization and subscription adoption are growing at a rate that likely outpaces flat ARR numbers. If ARR
              growth lagged payout growth, it would imply margin compression; if ARR grew proportionally, it would
              suggest stable spread economics.


              Three emerging revenue streams augment the core model. First, the R$100 million FIDC (Fundo de
              Investimento em Direitos Creditórios, or Receivables Investment Fund) launched in August 2025, which
              finances partner gym expansions using Wellhub's own check-in receivables as collateral. Wellhub earns fee
              income from this financial product without direct balance-sheet exposure — the fund is structured and
              managed by Galapagos Capital, with QI Tech handling custody and administration. Second, the Urban Sports
              Club acquisition (September 2025, $600M) adds a European employee-benefits revenue stream that may have
              different unit economics from the core Wellhub model. Third, the Anytime Fitness partnership (October
              2025) deepens the US network, potentially increasing check-in volume and partner payout flows without new
              direct revenue capture. Revenue recognition is not publicly described; multi-year employer contracts
              likely recognize ratably while employee subscriptions are recognized monthly.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
