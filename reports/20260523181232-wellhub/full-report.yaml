      - number: '2.2'
        title: Market Sizing — TAM, SAM, and SOM
        blocks:
          - type: paragraph
            body: >
              Six major research firms produce 2026 global corporate wellness TAM estimates ranging from $66.3 billion
              (Mordor Intelligence low end) to $94.6 billion (MarketsAndMarkets broadest scope), with a central-tendency
              cluster of $68–75 billion. Mordor Intelligence's $70.22 billion and Fortune Business Insights' $71.89
              billion bracket the consensus median. The MarketsAndMarkets $94.6 billion figure is the clear outlier,
              reflecting a broader definition that absorbs EAP spend typically bundled with health insurance and virtual
              care programs. A 6–9% CAGR consensus across all firms points to a $95–115 billion global market by
              2030–2031. IMARC Group estimates Europe at 39.5% of global revenue in 2025 — approximately on par with
              North America — making it the largest single region by some measures.

              Wellhub's serviceable addressable market (SAM) is bounded by its 18 operating countries and its digital,
              B2B, multi-vendor delivery model. North America (~$28–33B in 2026), Europe (~$20B+), and Latin America
              (~$4.5B in 2026) together account for approximately 80% of global corporate wellness spend and align with
              Wellhub's active footprint. The narrower digital employee wellbeing platform (SaaS) subsegment measured by
              Mordor Intelligence is $2.13 billion in 2026 with a 13.15% CAGR through 2031 — the most defensible
              like-for-like SAM proxy. A mid-range SAM estimate of $5–10 billion captures the B2B platform-mediated
              corporate wellness segment in Wellhub's geographies before including the broader gym-access and physical
              fitness spend that flows through its partner network.

              Wellhub's serviceable obtainable market (SOM) is anchored by its $319 million ARR as of September 2025. A
              mid-cycle SOM of $1–2 billion in annual platform revenue is achievable by capturing 2–5% of the combined
              North America, Europe, and LATAM corporate wellness spend, consistent with the organic growth trajectory
              and the Urban Sports Club European scale addition. The SOM is near-term constrained by 12–24 month
              enterprise contract cycles, CADE's exclusivity prohibition in Brazil limiting competitive moat in the home
              market, and the approximately 20% employer adoption rate for multi-vendor platforms versus single-gym or
              in-house programs. Contradictory estimates between analyst firms — driven purely by definitional scope
              differences — are preserved in Table TM002 to flag the sizing uncertainty for diligence purposes.
