      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track — Stretched Valuation with Compelling Upside Optionality
            body: >
              Wellhub earns a Track recommendation. The business has real scale, a defensible global partner network,
              and B2B contract stickiness. The 13.2x ARR multiple, however, is difficult to defend in the current SaaS
              re-rating environment without confirmed unit economics. Upgrade to Invest if Q3 2026 financials show gross
              margin >= 50%, NRR >= 100%, and ARR >= $380M; downgrade to Pass if CADE exclusivity removal accelerates
              Brazilian revenue decline or USC delivers <10% accretive ARR.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV020
              - CV034
          - type: callout
            title: Valuation Support Rests Entirely on Undisclosed Financials
            body: >
              Every scenario in this chapter depends on financial metrics Wellhub has never publicly disclosed: gross
              margin, net revenue retention, and cash burn rate. The secondary-market $4.2B mark (Dec 2024) carries no
              official press release confirmation; it derives solely from premium-access alternative investment
              trackers. Any primary-round financing would force public disclosure and could crystallize a materially
              different implied valuation.
            calloutType: risk
            claimRefs:
              - CV028
              - CV046
              - CV007
              - CV037
          - type: callout
            title: EGYM/Playlist at 9.4x Revenue Sets the Direct Comp Ceiling
            body: >
              The March 2026 EGYM acquisition of Playlist (formerly ClassPass) at $7.5B on $800M+ combined 2025 revenue
              creates the most relevant valuation anchor for Wellhub. At 9.4x EV/revenue, that transaction implies—if
              Wellhub's post-USC combined ARR reaches $400-450M—an EGYM-parity valuation of $3.7-4.2B, broadly
              consistent with the current secondary mark. Bull-case divergence above $5B requires Wellhub to
              demonstrably outgrow the EGYM/Playlist entity in both revenue and margin.
            calloutType: insight
            claimRefs:
