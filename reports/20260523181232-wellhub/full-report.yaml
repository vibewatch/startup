            title: 'Unconfirmed December 2024 Valuation: Evidence Gap'
            body: >
              The $4.2 billion valuation attributed to December 2024 rests solely on secondary market data from
              premieralts.com. No official Wellhub press release or credible news reporting of a formal December 2024
              funding round was found during this research. While the total funding figure ($867.5M vs. $605M across
              three known rounds) and the $600M Urban Sports Club acquisition in September 2025 are circumstantially
              consistent with additional capital raised, the specific valuation cannot be independently verified.
              Diligence should request a cap table snapshot and board-confirmed latest valuation figure.
            calloutType: risk
            claimRefs:
              - CO019
              - CO023
          - type: callout
            title: 'CADE Antitrust Action: Structural Constraint on Brazil Competitive Moat'
            body: >
              Wellhub's dominant position in the Brazilian corporate wellness market is built in part on exclusive
              partnerships with premium gyms, a practice that CADE has now prohibited. The March 2025 invalidation of
              all exclusivity contracts and the R$3M fine signal an escalating regulatory posture. Wellhub's
              competitors, particularly TotalPass, have gained structural access to previously locked-out gym networks.
              This materially weakens Wellhub's competitive differentiation in its largest market by scale and oldest
              geography.
            calloutType: risk
            claimRefs:
              - CO036
              - CO037
              - CO038
          - type: callout
            title: Urban Sports Club Acquisition Creates Clear European Market Leadership
            body: >
              The $600M Urban Sports Club acquisition in September 2025, the largest in Wellhub's history, significantly
              accelerated European market presence by adding five new countries and combining two platforms with
              complementary strengths: Wellhub's B2B enterprise capability and Urban Sports Club's European consumer
              brand and partner density. The co-founders reinvesting signals confidence in the combined entity. This
              positions Wellhub as the only truly global corporate wellness platform operating at enterprise scale.
            calloutType: strength
            claimRefs:
