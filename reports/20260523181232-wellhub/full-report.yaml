  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Wellhub competes across three overlapping competitive spaces distinguished by their primary buyer value
              proposition. The first tier — fitness-network aggregators — comprises platforms whose core value is
              multi-gym physical access delivered under an employer subsidy model: EGYM Wellpass (merged with
              Playlist/ClassPass/Mindbody in April 2026 at a $7.5 billion combined valuation), TotalPass (SmartFit
              Group's B2B arm), and ClassPass's corporate product. The second tier — comprehensive wellness platforms —
              includes Personify Health (formerly Virgin Pulse + HealthComp, serving 18 million members) and Vitality
              Group (7 million members, insurance-embedded), which offer broader plan navigation, biometric screenings,
              and benefits administration capabilities that extend beyond physical fitness access. The third tier —
              point-solution adjacents — includes mental health specialists (Spring Health, Lyra Health, Calm for
              Business), flexible benefits platforms (Forma's LSA/FSA/HRA), and benefits navigation tools (League) that
              compete for the same employer wellness budget without matching Wellhub's fitness network. Finally,
              incumbent substitutes — carrier-bundled EAPs (Aetna/CVS Health), direct gym memberships, FSA/HSA
              reimbursement programs, and on-site fitness centers — represent the status-quo alternatives that employers
              compare when evaluating whether to adopt a Wellhub-style platform at all. The risk of internal build
              (employer-owned apps) is low given network complexity, but large tech employers occasionally develop
              proprietary wellness programs. The most material entrant threats come from vertically integrated operators
              with distribution advantages: gym chains building corporate-facing B2B products, and insurance carriers
              expanding digital wellness capabilities.
