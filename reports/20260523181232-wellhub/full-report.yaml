      - number: '5.2'
        title: Architecture and Technology Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Wellhub's engineering organization operates a microservices architecture across 100% AWS-hosted
              infrastructure, using Amazon EKS (Elastic Kubernetes Service) as the container orchestration layer. Each
              product team follows a "you build it, you run it" philosophy, supported by a dedicated Production
              Engineering team that provides self-service platform capabilities including shared Helm charts, custom
              Kubernetes Operators, and CRDs for AWS resource management (S3, RDS, DynamoDB, Lambda). Infrastructure is
              defined and managed via Terraform; secret management uses HashiCorp Vault.

              The company's GitHub organization (github.com/Gympass) hosts 86 public repositories as of May 2026,
              reflecting an active polyglot codebase spanning JavaScript (including the open-source Yoga design system),
              Go (cdn-origin-controller, function-aws-importer), Java (trino-gateway), Python, and Ruby. The Yoga design
              system (243 GitHub stars, MIT license, last commit May 22, 2026) is the most visible open-source asset.
              The engineering blog on Medium documents self-service infrastructure patterns dating to 2020.

              Observability is handled through Kubernetes-native tooling and AWS-managed services. The platform uses
              horizontal pod autoscaling and blue/green or canary deployment patterns to manage the load generated by
              40,000+ corporate clients and 5M+ active subscribers. The Urban Sports Club acquisition (September 2025,
              $600 million) has added a parallel European platform codebase that currently operates independently;
              technology unification is ongoing with no public timeline disclosed.
