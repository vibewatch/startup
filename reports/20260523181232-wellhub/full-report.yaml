companyProfile:
  summary: >-
    Wellhub (formerly Gympass) is a New York–headquartered B2B corporate wellness platform founded in 2012 in São Paulo,
    Brazil by Cesar Carvalho, Vinícius Ferriani, and João Thayro. It operates a two-sided B2B2C marketplace: employers
    pay a per-employee-per-month platform fee granting their workforce subsidized access to a curated global network of
    gyms, studios, trainers, and digital wellness apps across fitness, mindfulness, therapy, nutrition, and sleep. After
    rebranding from Gympass to Wellhub in April 2024, the company has scaled to approximately 40,000 corporate clients,
    5M+ employee subscribers, and 100,000+ wellness partners in 18 countries. The September 2025 acquisition of Urban
    Sports Club for $600M extended its European footprint; an October 2025 Anytime Fitness partnership made it the
    largest employee wellness network in the US. ARR stands at $319M (Sep 2025, Getlatka). The last confirmed valuation
    is $4.2B (Dec 2024, secondary market). Gross margin, NRR, and burn rate remain undisclosed.
