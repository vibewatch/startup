            title: TAM Definition Drives a 2–3× Range — Use Narrow Scope for Wellhub
            body: >
              The $66–95 billion spread in 2026 corporate wellness TAM estimates is primarily a definitional
              disagreement, not a forecasting disagreement. The narrow definition (programs and platforms, ~$70B) is the
              defensible base case for Wellhub's addressable universe; the MarketsAndMarkets $94.6B figure absorbs
              carrier-bundled EAP spend and virtual care supplements that Wellhub's platform model cannot access.
              Investors should apply the $2.13B digital wellbeing platform figure as the tightest SaaS-comparable SAM,
              and triangulate upward using the broader B2B platform-mediated fitness and wellness spend in Wellhub's 18
              operating countries.
            calloutType: insight
            claimRefs:
