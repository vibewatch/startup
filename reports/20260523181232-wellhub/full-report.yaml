      - number: '3.4'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              Wellhub's competitive durability rests on four interconnected moat elements. First, two-sided network
              effects: 100,000+ wellness partners and 40,000+ corporate clients create a self-reinforcing loop in which
              network breadth attracts employers, employer volume attracts partners, and partner quality elevates
              employee utilization — a cycle that no regional player at equivalent global scale currently replicates.
              Second, HRIS/payroll integration switching costs: enterprise employers who have integrated Wellhub into
              Workday, SAP, or ADP benefit administration workflows face multi-quarter re-implementation projects, data
              migration, and employee re-onboarding to switch vendors. Third, the Urban Sports Club acquisition in
              September 2025 deepened European partner density in a geography where EGYM Wellpass had a structural
              advantage, partially offsetting the EGYM/Playlist merger threat. Fourth, long-term employer contracts with
              usage-based pricing create revenue inertia that limits opportunistic switches to lower-cost competitors.
              Against these moats, three material displacement risks exist. TotalPass's structural cost advantage via
              SmartFit's directly owned gym infrastructure allows it to undercut Wellhub on per-check-in rates in Brazil
              — and its 99% YoY user growth suggests this is already converting into client wins. The March 2025 CADE
              order stripped Wellhub of exclusivity contracts with approximately 3,500 Brazilian gym and studio
              partners, eliminating a key network access barrier in its largest market. EGYM Wellpass's $7.5 billion
              combined entity and $785 million new equity position it to sustain a multi-year investment cycle to close
              Wellhub's network breadth gap in North America. Multi-homing — employers layering a mental health EAP, a
              mindfulness app, and an LSA alongside Wellhub — further limits Wellhub's total wallet share per employer,
              compressing pricing power over time. The MIT Sloan 2026 review challenging wellness ROI evidence adds a
              proof-burden headwind that may pressure all platform vendors including Wellhub to demonstrate measurable
              outcomes more rigorously.
