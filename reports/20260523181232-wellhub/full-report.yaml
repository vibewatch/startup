  - id: FU001
    title: Wellhub Corporate Customer Journey Map
    type: journey-map
    layout: wide
    summary: >-
      Five-stage customer adoption journey from employer discovery through employee expansion, with segment-specific
      paths for enterprise and SMB buyers and key friction points at each stage.
    data:
      items:
        - id: stage-discovery
          label: Discovery
          actor: CHRO / HR Benefits Lead (enterprise); HR Manager or Owner (SMB)
          description: >-
            Employer discovers Wellhub via peer referral, industry press, benefits broker, or direct outreach from
            Wellhub sales. Enterprise buyers evaluate against ClassPass and incumbent EAP/wellness programs; SMBs often
            evaluate as a low-cost employee perk.
          channels:
            - Benefits broker referral
            - Industry media (HFA, HR Tech)
            - Direct outreach / SDR
        - id: stage-evaluation
          label: Evaluation
          actor: HR and Finance / Procurement
          description: >-
            Employer requests demo and pricing; benchmarks enrollment rates against traditional programs. Wellhub's 3–5x
            enrollment rate claim vs. single-gym memberships is key at this stage. Enterprise buyers may run a 3-month
            pilot in one office or region.
          channels:
            - Product demo
            - Reference customer calls (Aflac, Northwell, SoFi used as references)
            - Pilot deployment in selected location
        - id: stage-purchase
          label: Purchase and Deployment
          actor: HR / Finance (buyer); IT / Benefits Admin (deployer)
          description: >-
            Annual contract signed (employer PEPM fee plus employee subscription tier structure). Integration with HRIS
            for eligibility sync. Launch campaign with wellness champions, comms, and executive endorsement to maximize
            day-1 enrollment.
          channels:
            - HRIS / benefits admin portal
            - Wellhub HR dashboard
            - Internal comms (email, Slack, posters)
        - id: stage-adoption
          label: Employee Adoption
          actor: Employee (end user)
          description: >-
            Employees choose subscription tier and begin using gyms, apps, or digital services. Adoption builds over
            months — Aflac grew from 15% day-1 to 45% over 3 years. High-performing clients achieve 30–50% enrollment.
            Wellhub AI and personalized campaigns drive re-engagement.
          channels:
            - Wellhub app (iOS/Android)
            - Gym / studio check-in
            - Digital wellness apps (Headspace, MyFitnessPal)
        - id: stage-expansion
          label: Renewal and Expansion
          actor: HR / CFO (renewal); Employees (organic expansion via word-of-mouth)
          description: >-
            Employer renews annual contract; enrollment growth increases variable employee subscription revenue,
            improving ARPU per client over time (NRR expansion mechanism). Wellhub presents utilization dashboards and
            ROI data (€2.30 per €1 invested) to CFO to justify renewal. Account expansion may include additional
            geographies or Wellhub+ plan upgrades.
          channels:
            - CSM renewal discussion
            - HR analytics dashboard
            - CFO ROI report
    approximationNotes: >-
      Journey map is reconstructed from multiple case studies (Aflac, Northwell, SoFi), CFO media interviews, and press
      release language; it is not an official Wellhub process diagram. Stage timing and friction points are inferred
      from case study narratives and may not be representative of all client types.
    claimRefs:
      - CU010
      - CU025
      - CU040
