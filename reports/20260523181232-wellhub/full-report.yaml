      - number: '1.3'
        title: Funding History and Investor Composition
        blocks:
          - type: paragraph
            body: >
              Wellhub (as Gympass) raised its first major institutional capital in 2019 with a $300 million Series D led
              by SoftBank Vision Fund and SoftBank Latin America Fund, with existing investors General Atlantic,
              Atomico, and Valor Capital Group participating. At that time the company operated in 14 countries with
              nearly 47,000 gym and studio partners and over 2,000 corporate clients. The 2021 Series E raised $220
              million and was led by SoftBank, doubling the company's valuation to $2.2 billion; participants included
              General Atlantic, Moore Strategic Ventures, Kaszek Ventures, and Valor Capital Group.

              In August 2023, amid challenging global funding conditions, Wellhub closed an $85 million Series F at a
              $2.4 billion valuation, led by EQT Growth with participation from Neuberger Berman. Simultaneously,
              General Atlantic and Moore Strategic Ventures purchased secondary shares from earlier investors and
              employees, providing partial liquidity to early stakeholders without diluting the primary round. The
              Series F funding came in a record-growth year: Wellhub had nearly doubled its corporate client base to
              15,000 and surpassed two million employee subscribers.

              Secondary-market tracking data (premieralts.com) reports a later-stage VC round of $149 million closing in
              December 2024, with a post-money valuation of $4.2 billion and total funding raised of $867.5 million. No
              official company press release for this round was found during this research, representing a material
              evidence gap. However, total reported funding ($867.5M vs $605M across the prior three rounds) is
              consistent with a substantial additional raise, and the $4.2B figure is the best available post-May-2024
              valuation data point. Together with the Urban Sports Club $600M acquisition in September 2025, the capital
              deployment trajectory supports continued unicorn status through the run date.
