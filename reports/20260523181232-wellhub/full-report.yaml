      - number: '2.3'
        title: Buyer Segmentation and Adoption Path
        blocks:
          - type: paragraph
            body: >
              Corporate wellness platform procurement is structurally a B2B buying decision with a B2C utilization
              outcome. The primary buyer is the HR or Benefits function within an employer organization, acting
              simultaneously as payer, gatekeeper, and program designer. The end-user is the employee, who self-selects
              into wellness services within the employer-provided benefit; in most markets, employers cover 50–100% of
              the platform access fee while employees optionally pay a subsidized co-contribution for premium plan
              tiers.

              Three employer size bands structure the buyer landscape. Large enterprises (500+ employees) hold 53.21% of
              global corporate wellness market revenue as of 2025 and exhibit the highest willingness to pay for
              holistic, multi-vendor platforms integrated with HRIS systems. Mid-market employers (100–499 employees)
              are growing at 6.4% CAGR, attracted to SaaS economics that eliminate proprietary program investment. SMBs
              (under 100 employees) represent the fastest-growing digital segment at 16.44% CAGR but have the lowest
              current penetration — a stark adoption gap confirmed by US Department of Labor data showing 76% of workers
              at 500+ employee firms have access to wellness programs versus only 23% at firms with 50 or fewer workers.

              Adoption triggers differ by segment. Enterprise procurement is driven by healthcare cost control, talent
              retention benchmarking, ESG/DEI reporting requirements, and HR tech modernization including HRIS
              integration. Mid-market adoption is driven by benefits broker recommendations and peer-competitive
              benchmarking against larger employers. SMB entry is increasingly triggered by EU psychosocial risk
              assessment regulatory mandates, PEO aggregator marketplace bundles, and employee satisfaction concerns.
              Typical procurement cycles span 2–6 months for mid-market and 6–18 months for enterprise, with annual or
              multi-year contracts creating meaningful switching costs that benefit incumbent platforms including
              Wellhub post-deployment.
            claimRefs:
