  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >
              The corporate wellness market encompasses all employer-sponsored programs, services, and platforms
              designed to improve employee health, productivity, and well-being. Five core verticals define the market:
              physical fitness and gym access; mental health, stress management, and employee assistance programs
              (EAPs); nutrition and weight management; health risk assessments (HRAs) and biometric screenings; and
              smoking and substance cessation programs. Adjacent and fast-growing verticals increasingly absorbed into
              the market boundary include financial wellness, sleep programs, and digital coaching. Excluded from the
              corporate wellness market boundary are employer-paid group health insurance premiums (classified
              separately as group health benefits), individual consumer gym memberships not employer-subsidized, and
              clinical treatments billed through health insurance.

              Wellhub occupies the "corporate wellness platform" subsegment — a digitally delivered, multi-vendor
              marketplace aggregating gym access, mental health apps, nutrition services, and sleep programs into a
              single employer-contracted benefit. The status-quo substitutes that multi-vendor platforms displace
              include direct corporate gym memberships tied to a single facility operator, employer-owned on-site
              fitness centers, FSA/HSA-based individual reimbursement schemes, and point-solution EAPs sold through
              insurance carriers. Each substitute lacks the cross-vertical scope, network flexibility, and digital
              utilization measurability that aggregated platforms provide.

              Three regional markets are directly relevant to Wellhub's strategy: North America (approximately 37–40% of
              global corporate wellness spend, led by the United States), Europe (approximately 39.5% of global spend
              per IMARC Group 2025, led by Germany and the UK), and Latin America (approximately 6% of global spend, led
              by Brazil, Wellhub's founding market). Asia-Pacific is the fastest-growing regional market globally but is
              not a current Wellhub operating geography as of May 2026.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
