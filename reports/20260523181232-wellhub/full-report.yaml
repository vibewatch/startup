      - number: '8.4'
        title: Exit Readiness and Diligence Priorities
        blocks:
          - type: paragraph
            body: >
              Exit readiness for Wellhub is currently constrained by three factors: information opacity, integration
              complexity, and IPO timing flexibility. From an information standpoint, any serious acquirer or pre-IPO
              investor will require confirmed gross margin (estimated 50-65% for PEPM SaaS but unverified), net revenue
              retention (a direct proxy for employer stickiness), and post-USC cohorted ARR growth by geography. None of
              these are publicly available as of May 2026.

              Integration complexity is a known variable. The $600M USC acquisition is GP Bullhound-advised and involves
              a German-headquartered employee base, a separate partner network, and European employer client
              relationships. Wellhub's track record of integrating smaller acquisitions is positive but does not prove
              ability to absorb a deal of this scale cleanly. Accretion timelines are critical: if USC ARR is fully
              consolidated into Wellhub reporting by Q1 2027, the combined run-rate ARR figure will be substantially
              higher and more defensible.

              On IPO timing, CEO César Carvalho's explicit statement that IPO is "not a milestone" is consistent with a
              company that is profitable (or near it) and not capital-constrained. The secondary market trend—+41% share
              price appreciation Aug 2025 to May 2026—suggests informed participants are positioning for an eventual
              liquidity event. A 12-18 month window (H1 2027-H2 2028) appears most realistic if public market conditions
              recover from the current multiple compression cycle.

              Five diligence priorities should gate any investment decision: (1) gross margin confirmation >= 50%; (2)
              NRR confirmation >= 100% on same-employer cohorts; (3) post-USC combined ARR with a clear geographic
              breakdown; (4) CADE compliance roadmap and Brazilian exclusivity transition; and (5) the current cap table
              and liquidation preference stack to assess dilution impact on common stockholder returns at various exit
              prices.
            claimRefs:
