      - number: '8.2'
        title: Valuation Context and Comparable Analysis
        blocks:
          - type: paragraph
            body: >
              Wellhub operates at the intersection of three valuation frameworks: corporate wellness platforms, HR
              benefits technology, and B2B SaaS. Each framework yields materially different implied values, and the
              spread between them explains why the secondary-market mark is contested.

              The corporate wellness market is large—estimated at $68-73B globally in 2026 across multiple analyst
              sources—and growing at a CAGR of 5-7.4%, driven by post-pandemic employer focus on workforce mental and
              physical health ROI. This market backdrop justifies a meaningful premium over generic SaaS, but it does
              not by itself support 13x ARR; the EGYM/Playlist transaction at 9.4x EV/revenue remains the only
              comparable private-market deal with disclosed terms.

              Public HR benefits technology multiples (Workday at 8.2x, ADP at 6.5x, Paychex at 6.3x) reflect higher
              margin businesses with confirmed subscription economics. Peloton (1.26x EV/revenue) and Progyny (1.22x
              EV/revenue) are wellness-adjacent public companies but are materially smaller in geographic footprint and
              operate under different revenue models. Their low multiples reflect deteriorating growth or declining
              revenues, not valuation comps Wellhub aspires toward; they serve as floor anchors that illustrate what
              happens when wellness platforms lose growth momentum.

              The private market analog for non-AI, platform SaaS broadly transacting in 2025-2026 is 4-7x ARR (Acquiry
              transaction database; Windsor Drake SaaS comps). Wellhub's 13.2x is well above this range and rests on the
              argument that its global scale, cross-border B2B distribution, and 5M+ subscriber ecosystem earn a
              category-premium comparable to the EGYM/Playlist transaction. That argument is coherent but vulnerable to
              any re-rating if public SaaS multiples deteriorate further from the current 3.3x median.
