            body: >-
              Wellhub operates a B2B corporate wellness platform with approximately 40,000 corporate clients as of March
              2026, spanning enterprise multinationals, mid-market employers, and SMBs across 18 countries. The client
              roster skews heavily toward large enterprises: named clients publicly confirmed across third-party media
              include Unilever, Aflac, TikTok, Citizens Bank, Telefonica, Santander, Brookfield, FanDuel, SeatGeek,
              SoFi, and ZenDesk. Brazil remains the largest revenue market; the US is the second-largest and is
              projected to surpass Brazil as the primary market, driven by the October 2025 Anytime Fitness partnership
              (2,300+ US locations). Europe expanded sharply via the March 2025 Urban Sports Club acquisition, which
              added 12,000 European corporate clients. The SMB segment is acknowledged as underpenetrated relative to
              enterprise; larger clients absorb fixed HR administration overhead more efficiently, creating natural
              selection toward the enterprise tier. The dual-contribution B2B2C model — employer pays a platform fee,
              employee purchases a subsidized subscription — means both an HR buyer and an employee end-user must be
              satisfied, adding a retention complexity that is especially acute in SMBs with lower HR bandwidth.
              Wellhub's companies page cites a 178% boost in employee physical activity, 35% reduction in annual
              healthcare costs, and 43% improvement in retention as headline platform-level outcomes for adopting
