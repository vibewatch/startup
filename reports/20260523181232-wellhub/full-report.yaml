  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Overview and Wellness Modules
        blocks:
          - type: paragraph
            body: >-
              Wellhub is a B2B2C corporate wellness SaaS platform that aggregates over 100,000 gyms, studios, and
              digital wellness providers into a single employer-subsidized subscription. Employees access the platform
              through a tiered subscription, with plans ranging from a Digital tier (digital apps only, $0/month
              employee co-pay) up to a Diamond tier ($344.99/month) that unlocks the broadest in-person access.
              Companies pay annually based on team size and can launch their Wellhub program in 30 days or less.

              The five product categories—fitness, mindfulness, therapy, nutrition, and sleep—are delivered through a
              combination of in-person partners (gyms, studios, swimming pools, tennis courts), virtual personal
              trainers (3,800+), and digital wellness apps (99+). As of January 2026, the network surpasses 100,000
              total partners across 18 countries. Wellhub's Trainiac subsidiary contributes a dedicated virtual personal
              training module.

              The platform generates demonstrable engagement: 93% of employees surveyed in 2026 rated wellbeing as
