      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              Wellhub was co-founded in 2012 by three Brazilians: Cesar Carvalho, Vinícius Ferriani, and João Thayro.
              Carvalho, the most publicly prominent, dropped out of Harvard Business School to pursue the company and
              previously worked as a management consultant at McKinsey & Company. His personal experience of burnout and
              restricted access to wellness services while traveling for work became the founding motivation for
              Gympass. He relocated to the United States in 2019 when the company expanded its global headquarters to
              New York City.

              Carvalho remains CEO as of May 2026, making him the key-person dependency for Wellhub's strategy and
              stakeholder relationships. Bruno Annicq joined as CFO in 2020, bringing a B2B SaaS financial background;
              his public commentary underscores a focus on net revenue retention as the primary financial health metric.
              The broader executive team includes Carolee Gearhart (CRO), Ellen Hochberg (CLO), Livia Martini (CPO),
              Ryan Bonnici (CMO), and Victor Ribeiro (EVP Product Development). Board representation includes Lynne
              Oldham (Chief People Officer at Stash, independent board member) as a publicly cited governance voice;
              full board composition has not been disclosed publicly.

              The concentration of strategic and external narrative functions in the founder-CEO creates meaningful
              key-person dependency. No succession plan or co-CEO structure has been disclosed publicly. Leadership team
              tenure is not fully documented; the CFO (2020) and CMO (active 2024) are the two whose start dates are on
              record.
