          - type: callout
            title: Participation Rate Gap Is the Largest Structural Market Constraint
            body: >
              Only 20–30% of eligible employees globally engage with wellness programs regularly, and Gartner data shows
              only one quarter of employees with mental/emotional wellbeing access actually use it. A February 2026 MIT
              Sloan evidence review confirms that rigorous health outcome evidence "remains surprisingly limited and
              often contradicts widely cited claims." For Wellhub, low participation limits per-employer check-in
              volume, weakens the ROI story for contract renewal, and constrains upsell into premium tiers. Any market
              slowdown in wellness procurement would disproportionately affect premium multi-vertical platforms.
