      - number: '1.4'
        title: Scale, Metrics, and Business Traction
        blocks:
          - type: paragraph
            body: >
              Wellhub's growth trajectory from 2022 to early 2026 demonstrates strong business momentum. Starting from
              100 million cumulative check-ins in 2022, the platform reached 500 million in August 2024 and 1 billion by
              the end of 2025, a tenfold increase in approximately three years. This check-in growth reflects both
              client acquisition and per-client employee adoption deepening over time. The platform's engagement
              model—accessible, flexible, and subsidized—consistently delivers 3–5× higher participation rates compared
              to traditional wellness programs such as single-gym memberships or employer-owned fitness centers.

              As of March 2026, Wellhub reports approximately 40,000 corporate clients globally (up from 15,000 in
              August 2023), more than 5 million employee subscribers, and a network of over 100,000 wellness partners in
              18 countries. The US market has become the company's second-largest by revenue (after Brazil) and is on
              track to become the largest, per CEO Carvalho's 2026 public comments. In 2025, gross payouts to US fitness
              operators in Wellhub's network nearly doubled year-over-year; global partner payouts grew 107%. Wellhub's
              reported ARR was $319 million in September 2025, per Getlatka industry data. NRR is a key internal metric
              per CFO Annicq, though no specific NRR figure has been publicly disclosed.

              The company employs approximately 2,000 people as of March 2026. The October 2025 Anytime Fitness
              partnership (2,300+ US locations) made Wellhub the largest wellness network in the United States, with
              20,000+ US wellness access points across all 50 states. The September 2025 Urban Sports Club acquisition
              expanded the European footprint by five countries and added substantial partner inventory and subscriber
              base.
