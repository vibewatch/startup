      - number: '4.2'
        title: Pricing Architecture and Monetization
        blocks:
          - type: paragraph
            body: >
              Wellhub's pricing operates on two separate but linked layers: the employer side (B2B contract) and the
              employee side (consumer-facing plan tiers). On the employer side, publicly available plan documents from
              employer benefits portals confirm a PEPM access fee of $2–$5 per eligible employee per month, charged
              regardless of employee activation. This creates a guaranteed minimum revenue floor per employer contract
              that scales with the employer's total eligible headcount — not the number of employees who enroll. For a
              500-person company at the midpoint ($3.50 PEPM), the minimum employer contract value is $21,000/year. For
              a 5,000-person enterprise, it is $210,000/year. Custom enterprise pricing likely applies above certain
              headcount thresholds and for multi-country deals.


              On the employee side, ten documented tiers span the gap from free (Digital: digital apps and on-demand
              content only) to premium (Diamond: up to $344.99/month). Intermediate tiers include Starter
              ($11.99–$24.99), Basic ($32.99–$37.99), Bronze ($54.99–$64.99), Silver ($94.99–$109.99), Titanium
              ($134.99–$139.99), Gold ($189.99–$214.99), and Platinum ($259.99–$289.99). Employee-facing prices can be
              further subsidized by the employer — many employers cover the full cost of Starter or Bronze tiers. The
              average revenue per subscriber (ARPU) depends heavily on tier mix and employer subsidy levels, neither of
              which is publicly disclosed.


              Realized pricing almost certainly diverges from list pricing for large enterprise deals. Wellhub has not
              disclosed any volume discounts, contractual rate schedules, or realized pricing versus list pricing for
              enterprise contracts. The employer PEPM of $2–$5 is sourced from publicly distributed benefits
              administration flyers rather than from Wellhub's official enterprise pricing terms. Both the employer and
              employee layers together produce Wellhub's blended ARPU — which, at the $319M ARR level across
              approximately 40,000 corporate clients (March 2026), implies a rough average annual contract value per
              employer of approximately $7,975 (a rough estimate that assumes linear client growth through Sep 2025 and
              that all ARR derives from client contracts). Segmenting this by enterprise vs. SMB or by geography is not
              possible from public sources.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI002
            claimRefs: []
      - number: '4.3'
        title: Cost Structure, Margins, and Unit Economics
        blocks:
          - type: paragraph
            body: >
              Wellhub's cost structure is fundamentally shaped by its marketplace architecture. Unlike a pure SaaS
              company where gross margins typically exceed 70%, Wellhub's largest COGS item is partner check-in payouts
              — a variable cost that scales directly with employee utilization. When more employees check in to more
              gyms and studios, partner payouts grow, compressing gross margins if revenue per check-in does not
              increase proportionally. The 107% global payout growth in 2025 is the highest public proxy available for
              this variable cost base.


              No gross margin, EBITDA, or operating loss figure has been publicly disclosed. Industry-level benchmarks
              suggest that fitness marketplace models (aggregating network partners and charging a spread) typically
              achieve gross margins of 25–50%, with higher margins possible as the digital component (therapy apps,
              mindfulness platforms, nutrition content) requires no per-check-in payout and runs at near-zero variable
              cost. CFO Bruno Annicq's public framing emphasizes NRR as the key SaaS metric — suggesting the internal
              model targets expansion revenue from existing clients rather than CAC-driven new logo acquisition as the
              primary growth lever. However, no NRR figure has been publicly disclosed.


              Employer-side CAC is difficult to estimate without disclosure of S&M spend. With ~2,000 employees and a
              sales force that targets HR/benefits leaders at companies ranging from 50 to 50,000 employees, the
              enterprise sales cycle likely ranges from 1–3 months for SMBs to 6–18 months for large enterprises. CAC
              payback period is unknown; industry comps for B2B wellness platforms suggest 12–24 month payback periods.
              The US market is being called out by CEO Carvalho as the primary growth driver for 2026, suggesting
              increased S&M investment there that will increase short-term blended CAC.


              Working capital dynamics: the employer PEPM is likely invoiced annually in advance, creating favorable
              working capital for the employer side. Employee subscriptions are monthly. Partner payouts are disbursed
              based on check-in events, likely monthly in arrears. This structure means Wellhub receives cash before it
              owes partners, providing a positive working-capital cycle on the employer contract side. The FIDC fund
              (R$100M) uses future partner receivables as collateral — suggesting Wellhub has sufficient forward-looking
              check-in cash flows to support external financing for partners, though it also creates a contractual
              obligation to honor check-in receivables used as collateral.


              Fixed cost base: with approximately 2,000 employees globally, blended all-in employee cost (salaries,
              benefits, equity) likely runs $80–120M annually. Adding technology infrastructure, office costs, and G&A
              overhead, total fixed costs before S&M and R&D are estimated at $100–150M/year. Adding enterprise sales
              force and product R&D, total annual operating expense (ex-COGS) is estimated at $200–350M — consistent
              with a company burning cash and dependent on continued equity financing.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
              - CI017
              - CI018
          - type: table
            tableRef: TI003
            claimRefs: []
          - type: figure
            figureRef: FI002
            claimRefs:
              - CI007
              - CI012
      - number: '4.4'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >
              Wellhub's capital position is marked by a large acquisition event that materially altered the balance
              sheet in 2025. The $600M acquisition of Urban Sports Club (September 2025) consumed a substantial portion
              of any accumulated cash. The company's most recent confirmed primary-source equity raise was the $85M
              Series F at $2.4B valuation (August 2023). Secondary market tracking by premieralts.com reported a
              subsequent round of $149M in December 2024 at a $4.2B post-money valuation, with total funding of $867.5M
              — consistent with a capital event between the Series F close and the Urban Sports Club acquisition, though
              no official press release has been located. The Company Overview chronology details all confirmed and
              secondary-source rounds; this chapter mints its own claims for the capital adequacy assessment.


              If the $149M December 2024 round is confirmed, the pre-acquisition cash position was likely $85M + $149M
              plus any operating cash generation net of burn from August 2023 to December 2024 — approximately 16 months
              during which the company was growing rapidly. At an estimated monthly burn of $15–30M (driven primarily by
              payroll, S&M, infrastructure, and expansion costs), total burn over that period was $240–480M. Combined
              with prior cash from the Series F and earlier rounds, a rough pre-acquisition cash estimate of $200–500M
              appears directionally consistent. The $600M acquisition of Urban Sports Club may have been partially
              funded by the December 2024 raise plus debt instruments not publicly disclosed.


              Post-acquisition, no official cash position or burn rate has been disclosed. The absence of a
              post-acquisition financing announcement raises two scenarios: (1) Wellhub retained sufficient
              post-acquisition cash to fund 18–24 months of runway, making an IPO or new raise possible in 2026–2027; or
              (2) the acquisition was largely debt-financed, creating a financing obligation not visible in public
              equity raise data. CEO Carvalho has publicly stated the IPO will occur "when capital is needed or
              investors want to exit" — language consistent with a company that is not yet under imminent capital
              pressure, but is planning for the next liquidity event.


              The FIDC R$100M partner financing fund does not represent capital adequacy for Wellhub itself — it is an
              off-balance-sheet structure using partner receivables as collateral, managed by a third party (Galapagos
              Capital). However, it signals Wellhub's confidence in forward check-in cash flows sufficient to
              collateralize partner loans, indirectly corroborating engagement trajectory.
            claimRefs:
              - CI019
              - CI020
              - CI021
              - CI022
              - CI023
              - CI024
              - CI025
          - type: table
            tableRef: TI004
            claimRefs: []
          - type: figure
            figureRef: FI004
            claimRefs:
              - CI019
              - CI020
              - CI022
      - number: '4.5'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >
              Wellhub demonstrates strong top-line growth signals: $319M ARR (Sep 2025), 107% partner payout growth,
              40,000 corporate clients, 5M+ employee subscribers, and an implied ARR-to-valuation multiple of
              approximately 13× at the $4.2B valuation. The B2B SaaS-like revenue model (employer PEPM + annual
              contracts) generates predictable recurring cash and is fundamentally differentiated from a pure consumer
              fitness subscription. CFO Annicq's emphasis on NRR as the primary growth lever — rather than gross logo
              adds — suggests the internal model relies on expansion within existing accounts, a value-creation pattern
              characteristic of best-in-class enterprise SaaS platforms.


              Material adverse factors temper this picture. First, margin opacity: the absence of any disclosed gross
              margin or EBITDA means the $319M ARR could coexist with deeply negative unit economics if partner payouts
              consume a large share of revenue. The 107% payout growth substantially outpaces any plausible ARR growth
              rate from the $319M Sep 2025 run rate, suggesting payout-to-revenue leverage is intensifying. Second, the
              CADE exclusivity ruling (March 2025) invalidated ~3,500 exclusive gym partner contracts in Brazil —
              directly weakening the network defensibility and competitive pricing power in Wellhub's historically
              largest revenue market. The long-term impact on Brazil retention economics is a diligence ask. Third, the
              $600M acquisition creates integration risk and capital dependency: two separate operating platforms
              (Wellhub core + Urban Sports Club European platform) must be integrated while continuing to burn cash.
              Fourth, the IPO pathway — flagged by Carvalho as the next liquidity event — is not imminent and not funded
              by any disclosed equity commitment, creating investor-exit timing risk.


              Until audited financials, NRR, gross margin, and cash-flow disclosure are available under NDA, the revenue
              quality and path to profitability remain unverifiable. This represents a blocking-level evidence gap for
              any underwriting decision. The estimates in this chapter are directional and should not be used for
              valuation modeling without corroboration from management-provided financial data.
