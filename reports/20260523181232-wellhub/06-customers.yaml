      Aflac Year 1 (15%) and Year 3 (45%) are confirmed anchor points from the official
      Wellhub case study; Year 2 (30%) is linearly interpolated. Enterprise proxy uses
      CFO-stated 30–50% mature enrollment for high-performing clients as a Year 3 ceiling;
      intermediate years are estimated. Industry median is derived from Corporate Wellness
      Report 2025 survey finding that 67% of employees say their company offers wellness
      benefits but only 31% find them relevant — implying a broad utilization gap that
      suggests lower median adoption than Wellhub's best-in-class accounts. Wellhub does
      not publicly disclose per-cohort enrollment or retention rates; this figure uses
      proxy and interpolated data and should be treated as indicative only.
