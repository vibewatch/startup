  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: NRR
      missingEvidence: >-
        Wellhub NRR, GRR, and annual contract renewal rate by client tier (enterprise vs. SMB),
        with cohort vintage and geographic breakdown
      whyItMatters: >-
        NRR is the primary metric CFO Annicq uses to assess business health; without it, the
        durability of ~40,000 clients and the expansion-vs-new-logo composition of growth cannot
        be evaluated independently
      diligencePath: >-
        Request NRR, GRR, and renewal rate data under NDA from Wellhub CFO; benchmark against
        B2B SaaS comps (110%+ NRR target) and request 12-month rolling cohort
      relatedQuestionRefs:
        - QU013
        - QU018

    - type: private-evidence-only
      severity: blocking
      topic: geographic-concentration
      missingEvidence: >-
        Official revenue breakdown by geography (Brazil, US, Europe, other), by client tier,
        and by revenue stream (employer PEPM vs. employee subscription)
      whyItMatters: >-
        Brazil estimated at ~50% of ARR represents a material single-market risk; without
        disclosed figures, the impact of CADE antitrust rulings and FX exposure cannot be sized
      diligencePath: >-
        Request unaudited management accounts with geographic revenue breakdown; cross-check
        with Urban Sports Club pro forma
      relatedQuestionRefs:
        - QU023
        - QU017

    - type: enumeration-incomplete
      severity: material
      topic: named-customers
      missingEvidence: >-
        Production-confirmed, outcome-quantified case studies for a broader sample of the
        40,000 corporate client base, particularly for US enterprise clients beyond Aflac
        and Northwell Health
      whyItMatters: >-
        The two deepest US case studies (Aflac, Northwell) are both healthcare-adjacent
        industries; broader vertical coverage (tech, financial services, manufacturing)
        would reduce selection bias in the named-customer evidence set
      diligencePath: >-
        Request 3–5 additional reference clients spanning tech, financial services, and
        manufacturing verticals; seek NPS, renewal rates, and enrollment rate distribution
        across client tiers
      relatedQuestionRefs:
        - QU005
        - QU011
        - QU012
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: material
      topic: churn
      missingEvidence: >-
        Any documented case of corporate client churn, terminated enterprise contract, or
        downgrade to a lower tier — no such case appears in any public source reviewed
      whyItMatters: >-
        The absence of churn evidence does not prove zero churn; it reflects information
        asymmetry. Undisclosed churn in SMB or single-geography clients would materially
        affect valuation multiples
      diligencePath: >-
        Review Wellhub's customer success processes under NDA; request churned client list
        with reasons and ARR impact; survey ex-clients through LinkedIn or reference checks
      relatedQuestionRefs:
        - QU018
        - QU020

    - type: missing-source
      severity: material
      topic: segmentation
      missingEvidence: >-
        Enterprise vs. SMB revenue split, average contract value by tier, and median vs.
        top-quartile enrollment rate distribution across the full client book
      whyItMatters: >-
        Aggregate metrics (40K clients, 5M subscribers) mask the potential for SMB-driven
        churn drag if a large portion of the client book consists of small, low-engagement
        employers
      diligencePath: >-
        Request CRM data or management reporting showing client distribution by headcount
        band, enrollment rate, and ARR band; compare median to Aflac/Northwell benchmarks
      relatedQuestionRefs:
        - QU026
        - QU001

    - type: missing-source
      severity: minor
      topic: named-customers
      missingEvidence: >-
        Primary source confirmation for Google, AB InBev, and Siemens as Wellhub corporate
        clients — these names are not found in any primary source reviewed
      whyItMatters: >-
        If these enterprises were clients, they would materially strengthen the enterprise
        social proof case; without confirmation they cannot be cited
      diligencePath: >-
        Request Wellhub investor presentation or customer reference list for confirmation;
        cross-check with LinkedIn employee benefits or HR press releases from those companies
      relatedQuestionRefs:
        - QU014

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      All five tables include notes fields documenting data sources, estimation methodology,
      partial coverage rationale, and what null values mean; no pure factual snapshot table
      exists in this chapter — all contain at least one estimated or unverified cell.
