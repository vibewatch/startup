            - High — 58% registration, 22% enrollment, 21,000 check-ins documented
            - Confirmed production (multi-year deployment; latest status not updated)
            - Low — 2019–2020 data vintage; no recent renewal confirmation found
        - label: SoFi
          values:
            - Medium — case study via casestudies.com; 2021 data
            - High — 161% subscriber growth; ~30% active plan rate documented
