      Indicative employee enrollment trajectory using the Aflac case study as the primary
      anchor and an industry median proxy derived from the Wellhub 2025 Corporate Wellness
      Report survey. Columns represent years post-launch; values are estimated active
      enrollment rates (0–100%).
    data:
