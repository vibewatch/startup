chapter:
  number: 6
  title: Customers
  summary: >-
    Wellhub serves approximately 40,000 corporate clients and 5 million+ employee subscribers in 18
    countries as of March 2026, supported by a tenfold check-in expansion from 100 million (2022) to
    1 billion (2025). Named customer case studies for Aflac (45% employee enrollment), Northwell Health
    (85,000 employees), Heineken Brazil, and SoFi provide strong production-deployment proof; enterprise
    adoption is deep and differentiated. The primary diligence gaps are Wellhub's undisclosed NRR/GRR,
    Brazil geographic revenue concentration estimated at ~50% of ARR, and limited independent
    corroboration of the headline 40,000-client figure.

sections:
  - id: customer-segmentation
    title: Customer Base Segmentation
    body: >-
      Wellhub operates a B2B corporate wellness platform with approximately 40,000 corporate clients
      as of March 2026, spanning enterprise multinationals, mid-market employers, and SMBs across
      18 countries. The client roster skews heavily toward large enterprises: named clients publicly
      confirmed across third-party media include Unilever, Aflac, TikTok, Citizens Bank, Telefonica,
      Santander, Brookfield, FanDuel, SeatGeek, SoFi, and ZenDesk. Brazil remains the largest
      revenue market; the US is the second-largest and is projected to surpass Brazil as the
      primary market, driven by the October 2025 Anytime Fitness partnership (2,300+ US locations).
      Europe expanded sharply via the March 2025 Urban Sports Club acquisition, which added
      12,000 European corporate clients. The SMB segment is acknowledged as underpenetrated
      relative to enterprise; larger clients absorb fixed HR administration overhead more
      efficiently, creating natural selection toward the enterprise tier. The dual-contribution
      B2B2C model — employer pays a platform fee, employee purchases a subsidized subscription —
      means both an HR buyer and an employee end-user must be satisfied, adding a retention
      complexity that is especially acute in SMBs with lower HR bandwidth. Wellhub's companies
      page cites a 178% boost in employee physical activity, 35% reduction in annual healthcare
      costs, and 43% improvement in retention as headline platform-level outcomes for adopting
      employers, though these aggregate figures are company-reported and lack external auditing.
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: adoption-trajectory
    title: Adoption Trajectory and Growth Evidence
    body: >-
      Wellhub's strongest adoption signal is its check-in volume: the platform grew from
      100 million cumulative check-ins in 2022 to 1 billion in 2025, a tenfold increase in
      three years, corroborated by Wellhub's official press release and independently covered
      by Fitt Insider. Corporate client count grew from approximately 15,000 in August 2023
      to approximately 18,000 in August 2024, then doubled to approximately 40,000 by March 2026 —
      an acceleration partly driven by the Urban Sports Club acquisition (34,500 combined clients
      announced at deal close). Employee subscriber growth tracks client growth: from roughly
      2 million in August 2023 to over 5 million as of March 2026. Wellhub's reported enrollment
      rates of 3–5x higher than traditional corporate wellness approaches (employer-owned gyms,
      single-gym memberships, reimbursement programs) reflect the structural advantage of
      multi-modal, flexible, and subsidized access. Over 90% of Wellhub users visiting a gym are
      first-timers, indicating the platform expands the addressable fitness market rather than
      cannibalizing existing gym membership. Global partner payouts grew 107% in 2025 vs. 2024,
      with US payouts nearly doubling — a demand-side signal that check-in volume is translated
      into real economic activity with partner networks. The Braze engagement case documents
      that hyper-personalized campaigns drove 25% net-new subscriber revenue and a 3x increase
      in sign-up volume, confirming that product engagement investments compound acquisition.
    claimRefs:
      - CU003
      - CU004
      - CU021
      - CU022
      - CU023
      - CU024
      - CU025
    tableRefs:
      - TU002
    figureRefs:
      - FU002

  - id: named-customer-proof
    title: Named Customer Proof
    body: >-
      Wellhub's most robust named-customer evidence comes from its Aflac, Northwell Health,
      Heineken Brazil, and SoFi case studies. Aflac, a US-based insurance company, launched
      Wellhub in 2022 and achieved 15% employee enrollment on day one. By 2025, 45% of Aflac
      employees actively used the platform, spanning physical, mental, nutritional, and emotional
      wellness. Aflac's decision to redirect spending from GLP-1 medications (approximately
      $25 million annually for 1,000 employees) toward Wellhub reflects a strategic benefit
      shift supported at the executive level. Tricia Griggs, Aflac's Manager of Wellness and
      Safety, stated: "We wanted to be sure that platform could support us. And it did." Northwell
      Health, New York State's largest private employer with 85,000+ employees, publicly confirmed
      its Wellhub partnership in October 2023; Chief People Officer Maxine Carrington stated:
      "Wellhub is one of the best decisions we've made to give our team access to wellbeing
      options that are convenient, affordable and improve their overall quality of life." Northwell
      employees show 11% monthly growth in gym attendance and 8% in digital wellness app usage
      since launch. Heineken Brazil (13,000+ employees) partnered with Wellhub to support its
      HEINEKEN Cuida mental health program, achieving 58% registration rates and 22% enrollment
      with over 21,000 employee check-ins in the first deployment year. SoFi (2,500 employees)
      achieved 161% subscriber growth, with nearly 30% of members holding an active plan.
      Google, AB InBev, and Siemens are not confirmed as Wellhub customers in any primary source
      reviewed; their inclusion in any client claims would require primary verification.
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
      - CU018
      - CU019
      - CU020
