callouts:
  - calloutType: strength
    title: Named Customer Proof Is Deep and Multisector
    body: >-
      Aflac (insurance, 45% enrollment over 3 years), Northwell Health (healthcare, 85,000 employees,
      11% monthly gym growth), Heineken Brazil (FMCG, 22% enrollment), and SoFi (fintech, 161%
      subscriber growth) span four distinct industries with production-confirmed deployments and
      named executive endorsements. This breadth of named proof across verticals reduces single-
      sector dependency and supports the universality of the corporate wellness value proposition.
    claimRefs:
      - CU011
      - CU012
      - CU015
      - CU016
      - CU018
      - CU019

  - calloutType: risk
    title: NRR and Retention Metrics Are Entirely Undisclosed
    body: >-
      Wellhub's CFO Bruno Annicq publicly identifies NRR as the primary growth KPI, but no NRR,
      GRR, or contract renewal rate figure has been disclosed. Without these metrics, the durability
      of the ~40,000-client base and the persistence of the check-in and subscriber growth trajectory
      cannot be independently assessed. This is a blocking diligence gap for any investment decision.
    claimRefs:
      - CU029
      - CU030

  - calloutType: risk
    title: Brazil Revenue Concentration Is the Primary Geographic Risk
    body: >-
      Brazil is estimated to represent approximately 50% of Wellhub's ARR. A 2022 CADE antitrust
      ruling prohibited exclusive gym arrangements, directly affecting approximately 3,500 partner
      relationships in the largest market. Combined with FX risk and regulatory uncertainty, Brazil
      concentration is the most acute single-point risk to revenue stability. The US is growing
      rapidly and is projected to surpass Brazil as the largest market, which would moderate this
      risk over time — but the timeline is not confirmed.
    claimRefs:
      - CU035
      - CU036

  - calloutType: insight
    title: The B2B2C Enrollment Flywheel Creates Compounding Stickiness
    body: >-
      Wellhub's 3–5x enrollment rate advantage over traditional corporate wellness (employer-owned
      gyms, reimbursement programs) and the documented ramp from 15% day-1 to 45% at year 3
      (Aflac) demonstrate a compounding B2B2C flywheel. High employee engagement makes the
      benefit sticky for the employer buyer (who sees utilization data in the HR dashboard),
      drives higher variable employee subscription revenue, and creates social proof for
      contract renewal without incremental marketing spend.
    claimRefs:
      - CU022
      - CU029

