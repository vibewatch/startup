      - TU003
    figureRefs:
      - FU003

  - id: retention-and-durability
    title: Retention, Durability, and Satisfaction
    body: >-
      Wellhub's 2026 Return on Wellbeing report, based on a survey of 5,000+ employees and
      executives across 9 countries, finds that employees who regularly use employer-provided
      wellness benefits are 4.5x less likely to express quit intent within the next 12 months.
      Companies with comprehensive programs report 28% lower absenteeism and 19% fewer sick days.
      Every €1 invested generates €2.30 in returned value through reduced turnover and
      absenteeism — a quantified ROI claim that CFOs can bring to budget discussions, according
      to Wellhub. CFO Bruno Annicq identifies NRR as Wellhub's primary financial health KPI,
      emphasizing that the B2B2C flywheel creates compounding stickiness: some enterprise clients
      achieve 30–50% employee enrollment rates, making the benefit embedded in company culture.
      However, Wellhub has not publicly disclosed NRR, GRR, gross margin, or contract renewal
      rates; without these figures, the durability of the ~40,000-client base cannot be
      independently verified. FeaturedCustomers' market data awards Wellhub a 4.8/5 rating
      from 1,914 reference ratings (Summer 2025 Market Leader in Corporate Wellness Software),
      while Trustpilot rates the platform 4.1/5 ("Great") from hundreds of individual user
      reviews. Trustpilot and BBB complaints document recurring billing issues and account
      cancellation difficulties when employees transition between employers — a structural
      vulnerability of the employer-sponsored model — though employer-level churn data are
      not publicly available.
    claimRefs:
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
      - CU031
      - CU032
      - CU033
      - CU034
