      - TU004
    figureRefs:
      - FU004

  - id: expansion-and-concentration-risk
    title: Expansion Dynamics and Concentration Risk
    body: >-
      Wellhub's primary expansion lever within existing clients is the land-and-expand B2B2C
      dynamic: after signing an employer, employee enrollment grows organically over multiple
      years, increasing the variable subscription revenue attached to that contract without
      incremental sales cost. Aflac's trajectory from 15% enrollment at launch to 45% over
      three years illustrates the stickiness of a well-adopted program. The 2025 Corporate
      Wellness Report (600+ operators, 10 countries) finds 89% of operators report higher
      member retention for corporate-sourced members, validating the durability of the corporate
      channel for Wellhub's partner network. The main concentration risks are geographic
      (Brazil estimated at ~50% of ARR) and by segment (enterprise as primary revenue driver
      with SMB underpenetrated). CADE's 2022 antitrust ruling in Brazil — prohibiting exclusive
      arrangements with approximately 3,500 gym partners — creates ongoing regulatory risk in
      Wellhub's largest single market. Analyst commentary flags partner churn, pricing
      sensitivity, and the reliance on company-reported metrics as ongoing risks to
      durability. The Urban Sports Club and Anytime Fitness integrations represent both
      expansion opportunities and execution risks; Les Mills partnership (contributing ~20%
      of Les Mills annual subscriber growth since 2022) confirms partner network stickiness
      at scale. No top-client concentration figures (top-10 client % of ARR) are publicly
      disclosed, which is a blocking diligence gap for concentration risk assessment.
    claimRefs:
      - CU035
      - CU036
      - CU037
      - CU038
      - CU039
    tableRefs:
      - TU005

