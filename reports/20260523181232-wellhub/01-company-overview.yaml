  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: funding
      missingEvidence: "Official Wellhub press release or investor announcement confirming the December 2024 $149M funding round and $4.2B valuation"
      whyItMatters: "Without an official announcement, the $4.2B valuation and continued unicorn status post-May 2024 cannot be independently verified; secondary market data may lag or misreport private round terms"
      diligencePath: "Request confirmation from Wellhub IR or obtain cap table documentation showing December 2024 round closing terms, investor names, and post-money valuation"
      relatedQuestionRefs:
        - QO007
        - QO020
        - QO004

    - type: private-evidence-only
      severity: material
      topic: leadership
      missingEvidence: "Full board of directors composition, equity ownership structure, and voting rights of major investors"
      whyItMatters: "Board control and investor governance rights are critical for assessing IPO readiness, decision-making authority, and key-person risk concentration"
      diligencePath: "Obtain board composition from company directly or through a pre-IPO filing; cross-reference with investor agreements from series documentation"
      relatedQuestionRefs:
        - QO003
        - QO006
      relatedTableRefs:
        - TO002
        - TO003

    - type: private-evidence-only
      severity: material
      topic: revenue
      missingEvidence: "Independently audited revenue, gross margin, EBITDA, and net revenue retention figures"
      whyItMatters: "Wellhub's reported $319M ARR is company-reported via a third-party data tracker; no audited financials are public; the SaaS valuation thesis depends heavily on NRR and margin profile"
      diligencePath: "Request audited financial statements for FY2024-2025; obtain NRR and gross margin data from CFO directly"
      relatedQuestionRefs:
        - QO014

