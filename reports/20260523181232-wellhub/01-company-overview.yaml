      severity: minor
      topic: cade-regulatory
      missingEvidence: "CADE official decision document in English confirming the March 2025 contract invalidation and the specific scope of affected gym partnerships"
      whyItMatters: "The adverse regulatory action is sourced from Portuguese-language reporting; the precise legal terms, appeal status, and enforcement mechanism have not been confirmed from English primary sources"
