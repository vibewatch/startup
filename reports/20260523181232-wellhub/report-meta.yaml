companyProfile:
  summary: "Wellhub (formerly Gympass) is a New York–headquartered B2B corporate wellness platform founded in 2012 in São Paulo, Brazil by Cesar Carvalho, Vinícius Ferriani, and João Thayro. It operates a two-sided B2B2C marketplace: employers pay a per-employee-per-month platform fee granting their workforce subsidized access to a curated global network of gyms, studios, trainers, and digital wellness apps across fitness, mindfulness, therapy, nutrition, and sleep. After rebranding from Gympass to Wellhub in April 2024, the company has scaled to approximately 40,000 corporate clients, 5M+ employee subscribers, and 100,000+ wellness partners in 18 countries. The September 2025 acquisition of Urban Sports Club for $600M extended its European footprint; an October 2025 Anytime Fitness partnership made it the largest employee wellness network in the US. ARR stands at $319M (Sep 2025, Getlatka). The last confirmed valuation is $4.2B (Dec 2024, secondary market). Gross margin, NRR, and burn rate remain undisclosed."
  foundedDate: "2012-01-01"
  founders:
    - name: "Cesar Carvalho"
      role: "CEO and Co-Founder"
      background: "Dropped out of Harvard Business School MBA; previously at McKinsey & Company; relocated to New York in 2019 as the company expanded globally."
      claimRefs: [CO009, CO010, CO011]
    - name: "Vinícius Ferriani"
      role: "Co-Founder"
      background: "Brazilian entrepreneur; co-founded Gympass in São Paulo in 2012."
      claimRefs: [CO002]
    - name: "João Thayro"
      role: "Co-Founder"
      background: "Brazilian entrepreneur; co-founded Gympass in São Paulo in 2012."
      claimRefs: [CO002]
  foundingLocation: "São Paulo, Brazil"
  headquarters: "New York, NY, USA (global HQ); São Paulo, Brazil (operational hub)"
  productSummary: "Cloud-based corporate wellness marketplace offering employer-subsidized access to 100,000+ partner gyms, studios, trainers, mindfulness apps, therapy platforms, nutritionists, and sleep tools across five verticals (fitness, mindfulness, therapy, nutrition, sleep). Product includes employer admin portal, employee mobile app, AI Coach (beta, 2026), digital wellness partners, and in-person venue access via check-in."
  customerFocus: "Enterprise and mid-market employers seeking scalable, flexible, and measurable wellness benefits for distributed workforces; operating primarily in the US (second-largest revenue market, growing fastest), Brazil (largest revenue market), and Europe."
  businessModel: "B2B2C two-sided marketplace: employers pay a per-employee-per-month (PEPM) access fee ($2–$5/eligible employee/month); employees pay subsidized monthly subscription tiers ($0–$345/month). Wellhub pays partners on a per-check-in basis, creating variable cost of revenue tied to utilization."
  stage: "Late-stage private / unicorn (last confirmed valuation $4.2B, Dec 2024 secondary market)"
  fundingStatus: "Total raised ~$867.5M across Series D ($300M, 2019, SoftBank), Series E ($220M, 2021, SoftBank), Series F ($85M, Aug 2023, EQT Growth at $2.4B), and a reported $149M later-stage round (Dec 2024 at $4.2B, secondary market data only — no official press release). Key investors: SoftBank, General Atlantic, EQT Growth, Neuberger Berman, Atomico, Valor Capital Group."
