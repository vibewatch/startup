  rows:
  - - EGYM Wellpass / Playlist
    - Direct fitness aggregator
    - $7.5B combined valuation; $785M new equity (Apr 2026); $800M+ 2025 revenue
    - Enterprise employers; Europe-first, expanding globally
    - Smart gym hardware (EGYM); ClassPass consumer reach (88K venues); AI training plans
    - Smaller global partner network; US market building stage; no Latin America depth
  - - TotalPass (SmartFit Group)
    - Direct fitness aggregator
    - Citi NPV ~R$1.5B (~$300M); publicly traded parent SmartFit (SMFT3)
    - Mid/large Brazilian corporates; expanding to Mexico
    - SmartFit-owned gym infrastructure lowers unit costs; 34K+ Brazil locations; 99% YoY user growth
    - Limited to Brazil/LatAm; no digital wellness breadth; no global coverage
  - - Personify Health (Virgin Pulse + HealthComp)
    - Comprehensive wellness platform (HPaaS)
    - ~$3B valuation (Nov 2023 merger); PE-backed (New Mountain Capital, Blackstone, Marlin Equity)
    - Self-insured large employers; health plan carriers
    - Plan admin + wellbeing + benefits navigation in one platform; HRA/biometric screening; 18M members
    - No physical gym network; US-centric; lower employee engagement vs. fitness-first model
  - - Spring Health
    - Mental health point solution
    - $466M+ raised; $3.3B valuation (Jul 2024 Series E); $100M Series E
    - Mid/large US employers; mental health benefit buyers
    - Precision mental health matching; <1-day appointment scheduling; AI-driven care; 450+ employers, 10M lives
    - No gym/fitness access; US-focused; complementary more than substitutive
  - - Lyra Health
    - Mental health point solution
    - $915M+ raised; ~$5.9B valuation; $57M raised May 2026
    - Large enterprise; health plans; global expansion
    - Clinical care breadth; enterprise-grade outcome analytics; rising mental health leave mgmt
    - No gym/fitness access; premium pricing; clinical scope exceeds wellness use case
  - - Forma (fka Twic)
    - Flexible benefits platform (LSA/FSA/HRA/HSA)
    - $57.6M raised (Series B 2022); Ribbit Capital, Emergence Capital
    - Tech-forward mid/large US employers; distributed teams
    - LSA flexibility to spend on any wellness category; 87% utilization; 550K+ members
    - No physical network; reimbursement-based, not access-based; lower engagement stickiness
  - - League
    - Benefits navigation / health OS
    - ~$242–500M raised; $100M debt Jan 2025; ~$70–87.5M est. revenue
    - Large employers; health plans; carriers seeking digital engagement
    - AI-driven care navigation and care gap closure; HITRUST/HIPAA; proactive engagement
    - Not a wellness delivery platform; no gym network; partial overlap with Wellhub's buyer
  - - Vitality Group
    - Insurance-embedded wellness
    - ~$227.5M est. revenue; 600+ employees; subsidiary of Discovery
    - Insurance carriers and large employers seeking actuarially validated wellness
    - Shared-value insurance model; 7M+ members; 14 countries; 27% lower healthcare costs for engaged members
    - Requires insurance carrier partnership; not a standalone employee benefit platform
  - - ClassPass / Playlist (B2B)
    - Consumer fitness marketplace (B2B product)
    - Part of $7.5B Playlist/EGYM merged entity; $800M+ 2025 combined revenue
    - Employers offering flexible fitness credit benefits
    - 88K+ venues worldwide; consumer-facing brand; $2.3B incremental revenue facilitated
    - B2B product secondary to consumer focus; now bundled into Playlist/EGYM; no wellness depth
  - - Aetna/CVS Health (bundled EAP)
    - Incumbent carrier-bundled wellness substitute
    - ~$370B parent revenue; largest commercial health insurer in US
    - Self-insured and fully insured large US employers
    - Zero-marginal-cost wellness modules bundled with medical; CVS retail and clinic network
    - Generic wellness program; low employee engagement; not a multi-vendor fitness network
  notes: Scale/funding reflects latest publicly available figures as of May 2026. 'Citi NPV' for TotalPass is an analyst estimate.
    Valuation figures for privately held companies (Personify Health, Spring Health, Lyra Health) are from latest disclosed
    funding rounds.
