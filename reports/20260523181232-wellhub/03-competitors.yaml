  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing
    missingEvidence: Published enterprise contract pricing for EGYM Wellpass, Personify Health, Spring Health, Lyra Health,
      and League — all of which use custom negotiated pricing not disclosed publicly.
    whyItMatters: Without actual contract pricing it is impossible to precisely assess Wellhub's price competitiveness against
      its main rivals in head-to-head RFP situations.
    diligencePath: Request Wellhub's customer-facing sales proposals and historical win/loss RFP data showing pricing versus
      named competitors; obtain reference pricing from 3–5 large enterprises that evaluated Wellhub against EGYM Wellpass
      or Personify Health.
    relatedQuestionRefs:
    - QP003
    - QP009
  - type: private-evidence-only
    severity: material
    topic: wellhub-churn-switching-costs
    missingEvidence: Wellhub's gross enterprise logo churn rate, net revenue retention (NRR), and documented cases of accounts
      lost to TotalPass, EGYM Wellpass, or other named competitors.
    whyItMatters: The durability of HRIS switching costs as a moat depends on whether churn is actually low. TotalPass's accelerating
      client wins could indicate Wellhub account churn in Brazil that is not visible in aggregate metrics.
    diligencePath: Request annual NRR and gross logo churn data from Wellhub management, segmented by region; ask for Q1 2025
      and Q1 2026 Brazil-specific metrics post-CADE ruling.
    relatedQuestionRefs:
    - QP012
    - QP014
    - QP026
  - type: enumeration-incomplete
    severity: minor
    topic: regional-competitors-asia-europe
    missingEvidence: Comprehensive profiles of regional corporate fitness aggregators in Asia-Pacific (e.g., AIA Vitality
      in Singapore, Be Active in Australia) and emerging European players beyond Urban Sports Club / EGYM.
    whyItMatters: Wellhub's 18-country footprint overlaps with regional players not fully covered here; their scale and behavior
      in Wellhub's operating geographies could affect network partner retention.
    diligencePath: Commission regional competitive research in Wellhub's five largest non-Brazil markets; review Urban Sports
      Club competitor press coverage in Germany and the UK.
    relatedQuestionRefs:
    - QP001
    - QP002
