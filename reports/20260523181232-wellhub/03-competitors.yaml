chapter:
  number: 3
  title: Competitors
  summary: 'Wellhub faces a three-tier competitive field in 2026: fitness-network aggregators (EGYM Wellpass/Playlist at $7.5B,
    TotalPass with 4.1M Brazil users growing 99% YoY), comprehensive wellness platforms (Personify Health serving 18M members),
    and point solutions (Lyra Health at $5.9B, Spring Health at $3.3B, Forma). Wellhub''s two-sided network of 100,000+ partners
    and 40,000+ employers creates reinforcing network effects and HRIS switching costs that no single rival fully replicates;
    however, the March 2025 CADE exclusivity ban, EGYM Wellpass''s well-capitalized European expansion, and TotalPass''s accelerating
    LATAM client wins are material moat threats requiring close monitoring.'
sections:
- id: competitive-landscape-overview
  title: Competitive Landscape Overview
  body: 'Wellhub competes across three overlapping competitive spaces distinguished by their primary buyer value proposition.
    The first tier — fitness-network aggregators — comprises platforms whose core value is multi-gym physical access delivered
    under an employer subsidy model: EGYM Wellpass (merged with Playlist/ClassPass/Mindbody in April 2026 at a $7.5 billion
    combined valuation), TotalPass (SmartFit Group''s B2B arm), and ClassPass''s corporate product. The second tier — comprehensive
    wellness platforms — includes Personify Health (formerly Virgin Pulse + HealthComp, serving 18 million members) and Vitality
    Group (7 million members, insurance-embedded), which offer broader plan navigation, biometric screenings, and benefits
    administration capabilities that extend beyond physical fitness access. The third tier — point-solution adjacents — includes
    mental health specialists (Spring Health, Lyra Health, Calm for Business), flexible benefits platforms (Forma''s LSA/FSA/HRA),
    and benefits navigation tools (League) that compete for the same employer wellness budget without matching Wellhub''s
    fitness network. Finally, incumbent substitutes — carrier-bundled EAPs (Aetna/CVS Health), direct gym memberships, FSA/HSA
    reimbursement programs, and on-site fitness centers — represent the status-quo alternatives that employers compare when
    evaluating whether to adopt a Wellhub-style platform at all. The risk of internal build (employer-owned apps) is low given
    network complexity, but large tech employers occasionally develop proprietary wellness programs. The most material entrant
    threats come from vertically integrated operators with distribution advantages: gym chains building corporate-facing B2B
    products, and insurance carriers expanding digital wellness capabilities.'
