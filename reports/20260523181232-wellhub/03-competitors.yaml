- id: feature-capability-pricing
  title: Feature, Capability, and Pricing Comparison
  body: Wellhub's primary differentiators versus direct aggregator rivals are its partner network breadth (100,000+ vs. EGYM
    Wellpass's fitness-centric network and TotalPass's 34,000+ Brazil-focused locations), its multi-pillar wellness scope
    (fitness, mental health apps, nutrition, sleep, mindfulness), and its 18-country global coverage. Versus comprehensive
    wellness platforms like Personify Health, Wellhub lacks native plan administration, biometric screening, and clinical
    navigation, while Personify lacks gym network access. Against mental health point solutions (Spring Health, Lyra Health),
    Wellhub offers gym and digital wellness but not precision clinical matching, EAP telephonic counseling, or medication
    management. Forma and League compete for the same CFO/HR buyer but in benefit administration rather than wellness delivery
    — frequently complementary but occasionally substitutive when budget is constrained. On pricing, Wellhub's employee-facing
    subscriptions range from a no-cost Digital tier to Diamond ($344.99/month), with employer-paid administrative fees typically
    $2–$5 per eligible employee per month. EGYM Wellpass pricing is not publicly disclosed; Personify Health and League price
    via custom enterprise contract; Forma charges at the LSA account management level; Spring Health and Lyra Health use per-member-per-month
    clinical rates. The pricing dispersion makes direct comparison difficult, but Wellhub's tiered model is more transparent
    than most enterprise competitors and positions it between the high price points of clinical mental health platforms and
    the low price points of SMB engagement tools like Sprout At Work ($1–$3/PEPM).
