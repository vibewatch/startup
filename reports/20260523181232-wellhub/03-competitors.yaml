- id: TP004
  title: Moat Durability / Competitive Risk Register — Wellhub 2026
  columns:
  - Moat Claim
  - Competitive Threat
  - Severity
  - Evidence of Erosion / Durability
  - Mitigation / Diligence Ask
  rows:
  - - 'Two-sided network: 100K+ wellness partners attract employers; 40K+ employers attract partners'
    - EGYM Wellpass reaches 20K+ employers; Playlist adds 88K venues; combined entity could close gap
    - High
    - Wellhub still holds largest single-company global partner count; Urban Sports Club acquisition added European density
      in Sept 2025
    - Track EGYM Wellpass partner adds quarterly; monitor whether Playlist's B2C venues convert to B2B corporate access
  - - HRIS integration switching costs lock enterprise accounts into multi-year contracts
    - TotalPass accelerating HR integrations; competitive switching subsidies from rivals
    - Medium
    - No public evidence of mass enterprise churn; TotalPass wins are primarily net-new clients, not Wellhub churners in 2026
    - Request Wellhub NRR (net revenue retention) and gross logo churn rates as primary diligence ask
  - - Exclusivity contracts with premium gym partners (pre-CADE)
    - March 2025 CADE order invalidated ~3,500 exclusivity contracts in Brazil; TotalPass can now access same gyms
    - High (Brazil only)
    - Exclusivity was a meaningful Brazil competitive barrier — now eliminated; TotalPass's user base grew 99% YoY post-ruling
    - Assess whether Wellhub's Brazil revenue growth has decelerated post-CADE; verify partner re-contracting rates
  - - Multi-country global coverage (18 countries, Urban Sports Club acquisition)
    - EGYM Wellpass operates in 30+ countries post-merger; potential greenfield expansion by TotalPass to Mexico
    - Medium
    - Wellhub ahead in LatAm; behind EGYM in Europe breadth; Urban Sports Club acquisition partially closes Europe gap
    - Assess post-acquisition integration execution and partner count vs. EGYM Wellpass by country
  - - Employer relationship depth (avg 3–5x participation vs. traditional programs)
    - Point solutions and comprehensive platforms compete for same HR relationship and wellness budget
    - Medium
    - Wellhub's engagement rates are well-documented; multi-homing is common but reduces Wellhub's total wallet share per
      employer
    - Survey 5–10 Wellhub enterprise clients on vendor stack to quantify multi-homing prevalence and budget crowding
  - - Brazil market leadership (largest revenue market by CEO statement)
    - TotalPass 34% active-user market share; GoGood growing rapidly; CADE removed exclusivity protection
    - High
    - Wellhub maintains 7.9M active users (24% growth) vs. TotalPass 4.1M (99% growth); gap is narrowing rapidly
    - Request Q1 2026 Brazil revenue growth rate and new enterprise logo data; verify CADE compliance costs
  notes: Severity assessments are evidence-based qualitative judgments. 'High' denotes a risk with documented competitive
    erosion or structural change (CADE ruling, EGYM merger capital); 'Medium' denotes real but not yet quantified threats.
    Ratings should be revisited at next diligence cycle.
