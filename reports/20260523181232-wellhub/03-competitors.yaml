    - Reference price — transparent tiering is a sales asset but premium tiers may face employer subsidy fatigue
  - - EGYM Wellpass
    - B2B enterprise contract (custom)
    - Not publicly disclosed; estimated premium
    - Gym access, EGYM smart equipment, corporate wellness dashboard
    - No published pricing; inferred premium positioning post-merger
    - Well-capitalized competitor able to price aggressively to win enterprise accounts in Europe
  - - Personify Health
    - SaaS PEPM (per-member-per-month) platform fee
    - Not published; $3–$8 PEPM estimated by industry sources
    - 'HPaaS: wellbeing + plan admin + HRA + benefits nav; 18M member network'
    - Includes plan admin which Wellhub does not offer — different scope
    - Broader but more complex platform; buyers with plan-admin needs may prefer Personify Health
  - - TotalPass
    - B2B subscription per corporate user
    - R$119.90–R$199.90/mo (TP2/TP3 plans); ~$24–$40 USD equivalent
    - SmartFit and partner gym access; basic digital layer
    - Brazil/LatAm only; pricing driven by SmartFit gym infrastructure cost advantage
    - Lower price point in Brazil threatens Wellhub's LATAM pricing power
  - - Spring Health
    - PEPM clinical mental health subscription
    - Not published; estimated $2–$4 PEPM for clinical access
    - Precision mental health matching, EAP, medication mgmt, manager tools
    - Scope is clinical; not competing for gym access budget
    - Occupies a distinct budget line; mostly additive, occasionally substitutive
  - - Lyra Health
    - PEPM enterprise mental health
    - Not published; estimated $3–$5 PEPM or higher
    - Clinical care network, outcome analytics, manager programs
    - Premium pricing commensurate with clinical scope
    - High-value mental health buy; competes for HR wellness budget, not fitness budget specifically
  - - Forma
    - PEPM LSA/FSA/HRA administration fee
    - Not published; typically $2–$6 PEPM admin fee + fund amounts
    - LSA, FSA, HRA, HSA administration; Forma card; claims/reimbursement
    - Fund amounts are employer-defined separately; admin fee is the platform cost
    - Competes for wellness budget share; LSA model lets employees redirect funds away from gym platforms
  - - Sprout At Work (SMB baseline)
    - Per-employee-per-month engagement platform
    - $1–$3 PEPM
    - Micro-wellness activities, digital engagement, team challenges
    - SMB-focused; not direct enterprise substitute for Wellhub
    - Sets a price floor for engagement-only wellness in the SMB segment where Wellhub rarely competes
