- id: competitor-profiles
  title: Competitor Profiles and Strategic Direction
  body: 'EGYM Wellpass, formed through the April 2026 merger with Playlist (ClassPass, Mindbody, Booker), is Wellhub''s most
    direct peer in gym-network aggregation and the best-capitalized challenger globally. The merged entity is valued at $7.5
    billion, generated over $800 million in net revenue in 2025, serves 20,000+ employer clients across 30+ countries, and
    received $785 million in new equity from Affinity Partners, Vista Equity Partners, Temasek, and L Catterton. Its hardware
    integration through EGYM smart gym equipment and consumer reach through ClassPass''s 88,000+ venue network give it capabilities
    Wellhub lacks, though Wellhub retains a broader global partner network (100,000+) and deeper Latin American presence.
    Personify Health, backed by New Mountain Capital and Blackstone, operates as a Health Platform-as-a-Service (HPaaS) integrating
    wellbeing, health plan navigation, and benefits administration; it serves 7,500 clients and 18 million members but occupies
    a distinctly different product position—plan administration, not gym access. TotalPass, the SmartFit Group''s B2B arm,
    is Wellhub''s most acute LATAM threat: it grew 99% YoY to 4.1 million active users in Brazil in 2026, tripled its enterprise
    client base to 15,000 companies in 2024, and leverages SmartFit''s direct ownership of Latin America''s largest gym chain
    to achieve a structural cost advantage. In mental health, Spring Health ($466M raised, $3.3B valuation, 450+ employers,
    10M lives) and Lyra Health ($915M raised, $5.9B valuation, $57M raised in May 2026) occupy a fast-growing adjacent space
    where employer demand is intensifying, though their product scope—precision mental health matching and clinical care—does
    not directly substitute for gym network access. Forma ($57.6M raised, 550K+ members) and League (~$242–500M raised, $70–87.5M
    revenue) compete for the HR benefits budget through flexible spending and benefits navigation, respectively, rather than
    through physical wellness delivery.'
