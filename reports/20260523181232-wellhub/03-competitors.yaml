callouts:
- calloutType: risk
  title: EGYM Wellpass / Playlist Merger Is Wellhub's Most Capitalized Global Threat
  body: The April 2026 closing of the Playlist/EGYM merger created a $7.5 billion, $800M-revenue competitor with 20,000+ employer
    clients, 88,000+ ClassPass venues, and $785 million in new equity. EGYM Wellpass directly replicates Wellhub's gym-aggregation
    model in Europe and is investing to expand in North America. Wellhub's stronger LatAm position and broader partner network
    are material advantages, but the capital asymmetry warrants close monitoring of European client retention.
  claimRefs:
  - CP002
  - CP003
  - CP034
  - CP038
- calloutType: risk
  title: TotalPass LATAM Growth Rate Signals Narrowing Lead in Wellhub's Largest Market
  body: TotalPass grew active users 99% YoY to 4.1 million in Brazil in 2026, against Wellhub's 24% growth rate in the same
    market. Combined with the March 2025 CADE ruling removing Wellhub's exclusivity protection with approximately 3,500 Brazilian
    gym partners, the competitive gap in Wellhub's historically dominant LATAM market is visibly narrowing. TotalPass's structural
    cost advantage via SmartFit-owned gyms makes this a durable challenge, not a transient one.
  claimRefs:
  - CP031
  - CP032
  - CP036
  - CP042
- calloutType: insight
  title: Mental Health and Flexible Benefits Platforms Are Complementary Budget Competitors
  body: Spring Health, Lyra Health, Forma, and League do not directly replicate Wellhub's gym network, but they compete for
    the same HR/benefits budget at renewal. Multi-homing is common — large employers frequently deploy two to four wellness
    vendors — but budget constraints and vendor rationalization trends will push HR buyers to make prioritization decisions,
    making Wellhub's demonstrated employee engagement rates a key retention lever.
  claimRefs:
  - CP026
  - CP027
  - CP033
  - CP037
