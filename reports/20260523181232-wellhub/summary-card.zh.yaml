summary:
  headline: >-
    Wellhub 是雇主赞助健康福利的全球龙头，ARR 达 $319M，平台规模真实；但 $4.2B 二级市场估值意味着 13.2x EV/ARR，且财务未披露——相较所有公开和私有可比公司都偏高。只有确认毛利率、NRR 和 USC
    整合后的经济性，才适合从观察转向更积极判断。
