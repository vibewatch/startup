      - number: '5.5'
        title: 路线图、差异化与技术风险
        blocks:
          - type: paragraph
            body: >-
              Wellhub 近期产品差异化靠三根支柱：网络规模（100,000+ 个合作伙伴、18 个国家、50+ 个预订系统集成）、参与机制（AI Coach、Check-in Streaks、面向分组人群的
              Challenges），以及 B2B2C 飞轮——把首次到访的企业订阅者导入健身房，带来增量收入（>90% 用户是所访问场馆的新客）。Yoga 设计系统
              和开源基础设施工具（function-aws-importer、cdn-origin-controller）带来有限的开发者好感，但不是差异化 IP。

              2025–2026 已确认的关键路线图里程碑包括：International Check-ins（November 2025 发布，现覆盖 13 个国家）、Wellhub AI Coach
              beta（January 2026 上线）、分组 Challenges（September 2025）、多公司资格管理（January 2026），以及公司付费项目更快激活套餐（2026）。2026
              年新增合作伙伴包括 Bodybar Pilates（US）、YMCA 扩张（Boston、Wyoming Valley、Birmingham）和 Lojong
              mindfulness（US、CA、UK、IE、IT、DE、PT）。

              两个主要技术风险是：（1）USC 平台整合复杂度——两套大型微服务资产最终必须收敛，但没有公开架构路线图；（2）平台健康数据敏感性——平台收集与身份绑定的 Health & Fitness 和 Financial
              Info，却没有公开的 HIPAA 或 SOC 2 防护认证。次要风险是邮件式集成协调造成的合作伙伴接入瓶颈，可能限制网络扩张速度。
