  - id: FM001
    title: 市场规模金字塔 — Wellhub 的 TAM、SAM 和 SOM（2026）
    type: pyramid
    layout: standard
    summary: |
      TAM 到 SOM 的漏斗：从 ~$70B 全球企业健康福利市场（共识中位数），下钻到 Wellhub 的地理和平台交付 SAM，再到以 $319M Sept 2025 ARR 轨迹锚定的 ~$1–2B 近期 SOM。
    data:
      items:
        - label: TAM：全球企业健康福利市场
          value: ~$70B (2026 consensus)
          detail: 全球所有雇主赞助的健康福利计划、平台和服务；六家分析机构的中枢估算（区间 $66–82B）
        - label: SAM Tier 1：Wellhub 的 18 个国家地区
          value: ~$50B (2026 est.)
          detail: 北美（~$28–33B）+ 欧洲（~$20B+）+ 拉美（~$4.5B）；Wellhub 的三个活跃运营区域
        - label: SAM Tier 2：数字 / 平台中介的 B2B 健康福利
          value: $2–10B (2026)
          detail: 数字 SaaS 健康福利平台市场窄口径 $2.13B（Mordor）；更宽的 B2B 平台赋能健康福利市场估算 $5–10B，包含健身网络收入
        - label: SOM：Wellhub 现实 2026–2028
          value: ~$1–2B
          detail: 获取合并 SAM 区域的 2–5%；以 Sept 2025 的 $319M ARR 为锚，并由 Urban Sports Club 和 Anytime Fitness 持续扩张支撑
    approximationNotes: >
      SAM Tier 1 按比例把分析师地区拆分应用到全球共识估算。SAM Tier 2 区间低端采用 Mordor 的窄口径纯 SaaS 数字（$2.13B），高端采用包含健身网络流量的更宽平台中介估算。SOM 是从当前 ARR
      轨迹自下而上推导，并非来自任何已发布分析师数字。
    claimRefs:
      - CM007
      - CM012
      - CM014
      - CM015
      - CM016
