            title: 估值支撑完全取决于未披露财务指标
            body: >
              本章所有情景都依赖 Wellhub 从未公开披露的财务指标：毛利率、净收入留存率和现金消耗率。二级市场 $4.2B 标记（Dec
              2024）没有官方新闻稿确认；它完全来自付费另类投资追踪数据。任何一级融资都会迫使公司公开披露，并可能固化出显著不同的隐含估值。
            calloutType: risk
