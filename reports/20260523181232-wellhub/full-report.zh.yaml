      - number: '5.4'
        title: 信任、隐私与合规
        blocks:
          - type: paragraph
            body: >-
              Wellhub 美国用户的数据控制者是 Gympass US, LLC。隐私政策覆盖应用收集的完整数据范围：与用户身份绑定的 Health & Fitness 数据、Financial
              Info、Location、Contact Info、Usage Data 和 Identifiers。iOS App Store 披露确认，Health & Fitness 与 Financial Info
              会关联到用户身份——对受监管行业的企业客户，这是重要考量。面向 EU / UK 用户，公司公布了 GDPR lawful bases；面向巴西用户，LGPD 下的数据控制者另行指定。

              Wellhub 在 security.wellhub.com 运营 Security Trust Center，列出数据保护控制、媒体留存政策、第三方系统认证和网络安全合规范围验证。不过，截至 May
              2026，公司尚未公开披露 SOC 2 Type II 认证或 HIPAA Business Associate Agreement 状态。美国受监管医疗或金融服务垂直行业的企业采购团队，应直接索取最新审计报告。

              Trustpilot（4.1/5，3,286 条评论）和 iOS App Store（4.3/5，8,100+
              个评分）的用户评价显示，员工身份变化时登录失败和重复扣费是反复出现的投诉——这指向雇主管理的资格数据管道与面向消费者的账户管理逻辑之间存在缝隙。
