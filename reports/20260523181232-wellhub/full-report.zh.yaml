      - number: '3.3'
        title: 功能、能力与定价对比
        blocks:
          - type: paragraph
            body: >-
              相对直接聚合器对手，Wellhub 的主要差异化在于合作伙伴网络广度（100,000+，高于 EGYM Wellpass 的健身中心化网络和 TotalPass 的 34,000+ 个 Brazil
              聚焦网点）、多支柱健康福利范围（健身、心理健康应用、营养、睡眠、正念），以及 18 国全球覆盖。相对 Personify Health 等综合健康福利平台，Wellhub
              缺少原生计划管理、生物识别筛查和临床导航；而 Personify 缺少健身房网络访问。面对心理健康点状方案（Spring Health、Lyra Health），Wellhub
              提供健身房和数字健康福利，但不提供精准临床匹配、EAP 电话咨询或用药管理。Forma 和 League 争夺同一 CFO/HR
              买方，但做的是福利管理而非健康福利交付——预算宽松时常互补，预算受限时偶尔替代。定价方面，Wellhub 面向员工的订阅从免费的 Digital 层级到
              Diamond（$344.99/month）不等，雇主支付的管理费通常为每名符合资格员工每月 $2–$5。EGYM Wellpass 定价未公开披露；Personify Health 和 League
              采用定制企业合同；Forma 在 LSA 账户管理层收费；Spring Health 和 Lyra Health 使用按会员每月计费的临床价格。价格分散使直接对比困难，但 Wellhub
              的分层模式比多数企业竞争者更透明，定位在临床心理健康平台的高价位与 Sprout At Work（$1–$3/PEPM）等 SMB 参与工具的低价位之间。
