        - HPaaS：健康 + 计划管理 + HRA + 福利导航；18M 会员网络
        - 包含 Wellhub 不提供的计划管理 — 范围不同
        - 平台更宽但更复杂；有计划管理需求的买方可能偏好 Personify Health
