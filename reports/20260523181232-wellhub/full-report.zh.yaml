      - number: '5.2'
        title: 架构与技术基础设施
        blocks:
          - type: paragraph
            body: >-
              Wellhub 工程组织在 100% AWS 托管基础设施上运行微服务架构，用 Amazon EKS（Elastic Kubernetes
              Service）作为容器编排层。每个产品团队遵循「谁构建，谁运行」原则，由专门的 Production Engineering 团队支撑；该团队提供自助式平台能力，包括共享 Helm charts、自定义
              Kubernetes Operators，以及用于 AWS 资源管理（S3、RDS、DynamoDB、Lambda）的 CRDs。基础设施通过 Terraform 定义和管理；密钥管理使用 HashiCorp
              Vault。

              截至 May 2026，公司 GitHub 组织（github.com/Gympass）托管 86 个公开代码库，显示其代码栈活跃且多语言，覆盖 JavaScript（包括开源 Yoga
              设计系统）、Go（cdn-origin-controller、function-aws-importer）、Java（trino-gateway）、Python 和 Ruby。Yoga 设计系统（243
              GitHub stars、MIT license、最后提交 May 22, 2026）是最可见的开源资产。Medium 上的工程博客记录了可追溯至 2020 的自助基础设施模式。

              可观测性靠 Kubernetes 原生工具和 AWS 托管服务处理。平台使用 horizontal pod autoscaling 以及 blue/green 或 canary 部署模式，承接 40,000+
              家企业客户和 5M+ 活跃订阅者带来的负载。Urban Sports Club 收购（September 2025，$600
              million）加入了一套并行的欧洲平台代码库，目前仍独立运行；技术统一正在推进，但没有公开时间表。
