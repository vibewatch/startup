      - number: '8.2'
        title: 估值背景与可比分析
        blocks:
          - type: paragraph
            body: >
              Wellhub 的估值同时落在三套框架里：企业健康平台、HR 福利科技和 B2B SaaS。三套框架给出的隐含价值差异很大，也解释了为什么二级市场标记存在争议。

              企业健康市场足够大——多家分析机构估计 2026 年全球规模为 $68-73B——并以 5-7.4% CAGR 增长；疫情后，雇主更重视员工身心健康 ROI。这一市场背景支撑其相对通用 SaaS
              有显著溢价，但单靠这一点还撑不起 13x ARR；EGYM/Playlist 以 9.4x EV/revenue 的交易，仍是唯一披露条款的可比私募市场交易。

              公开市场 HR 福利科技公司的倍数（Workday 8.2x、ADP 6.5x、Paychex 6.3x）反映的是利润率更高、订阅经济性已确认的业务。Peloton（1.26x EV/revenue）和
              Progyny（1.22x EV/revenue）虽与健康服务相邻，但地理覆盖明显更小，收入模型也不同。它们的低倍数来自增长恶化或收入下滑，不是 Wellhub
              想对标的估值样本；它们更像底部锚点，说明健康服务平台一旦失去增长动能会发生什么。

              2025-2026 年，非 AI 平台 SaaS 在私募市场的广泛交易区间是 4-7x ARR（Acquiry 交易数据库；Windsor Drake SaaS 可比公司）。Wellhub 的 13.2x
              明显高于这一区间，支撑逻辑是其全球规模、跨境 B2B 分发和 5M+ 订阅用户生态应拿到品类溢价，可与 EGYM/Playlist 交易相比。这个逻辑自洽，但如果公开 SaaS 倍数从当前 3.3x
              中位数继续下探，任何再定价都会打到它。
