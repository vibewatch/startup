        - 尚无公开证据显示企业大规模流失；2026 年 TotalPass 赢得的客户主要是净新增，而非 Wellhub 流失客户
        - 要求 Wellhub 提供 NRR（净收入留存）和雇主客户总流失率，作为首要尽调问题
      - - 与高端健身房合作伙伴的排他合同（CADE 前）
        - March 2025 CADE 命令宣告巴西约 3,500 份排他合同无效；TotalPass 现在可接入同一批健身房
        - 高（仅巴西）
        - 排他性曾是巴西有意义的竞争壁垒 — 现已消除；裁决后 TotalPass 用户基数同比增长 99%
        - 评估 CADE 后 Wellhub 巴西收入增长是否放缓；核实合作伙伴续约率
      - - 多国全球覆盖（18 个国家，Urban Sports Club 收购）
        - EGYM Wellpass 并购后在 30+ 个国家运营；TotalPass 可能向墨西哥绿地扩张
        - 中
        - Wellhub 在 LatAm 领先；欧洲广度落后于 EGYM；Urban Sports Club 收购部分缩小欧洲差距
        - 按国家评估收购后整合执行和合作伙伴数量，并与 EGYM Wellpass 对比
      - - 雇主关系深度（参与率为传统项目平均 3–5x）
        - 单点方案和综合平台争夺同一 HR 关系与健康预算
        - 中
        - Wellhub 的参与率证据充分；多供应商并用很常见，但会降低 Wellhub 在每个雇主的钱包份额
        - 访谈 5–10 家 Wellhub 企业客户，梳理供应商组合，量化多供应商并用普及度和预算挤压
      - - 巴西市场领导地位（CEO 称其为最大收入市场）
        - TotalPass 活跃用户市场份额 34%；GoGood 快速增长；CADE 移除排他保护
        - 高
        - Wellhub 保持 7.9M 活跃用户（增长 24%），TotalPass 为 4.1M（增长 99%）；差距正在快速缩小
        - 要求提供 Q1 2026 巴西收入增长率和新企业客户数据；核实 CADE 合规成本
    notes: 严重性评估基于证据的定性判断。「高」表示风险已有竞争侵蚀或结构性变化（CADE 裁决、EGYM 并购资本）的记录； 「中」表示威胁真实存在但尚未量化。评级应在下一轮尽调周期重新审视。
