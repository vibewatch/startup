      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >
              Wellhub 由三位 Brazil 人 Cesar Carvalho、Vinícius Ferriani 和 João Thayro 于 2012 年共同创立。Carvalho
              是最常出现在公开场合的创始人；他为创业从 Harvard Business School 退学，此前在 McKinsey & Company 做管理咨询。差旅期间的倦怠感，以及难以持续使用健康服务的个人经历，成为
              Gympass 的创立动因。2019 年公司将全球总部扩至 New York City 时，他迁往美国。

              截至 May 2026，Carvalho 仍任 CEO，因此 Wellhub 的战略和利益相关方关系都存在关键人物依赖。Bruno Annicq 于 2020 年加入担任 CFO，带来 B2B SaaS
              财务背景；他的公开发言强调净留存率（NRR）是核心财务健康指标。更广泛的高管团队包括 Carolee Gearhart（CRO）、Ellen Hochberg（CLO）、Livia
              Martini（CPO）、Ryan Bonnici（CMO）和 Victor Ribeiro（EVP Product Development）。董事会层面，Lynne Oldham（Stash
              首席人事官、独立董事）是公开被引用的治理声音；完整董事会构成未公开披露。

              创始人 CEO 集中了战略和外部叙事职能，带来实质关键人物依赖。公司未公开披露继任计划或联席 CEO 架构。管理团队任期记录不完整；目前可查到任职起点的只有 CFO（2020）和 CMO（2024
              年仍在任）两人。
