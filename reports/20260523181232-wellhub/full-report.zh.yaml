      - number: '1.6'
        title: 附录
        blocks:
          - type: callout
            title: 未经确认的 December 2024 估值：证据缺口
            body: >
              归属 December 2024 的 $4.2 billion 估值，仅依赖 premieralts.com 的老股市场数据。本次研究未找到 Wellhub 官方新闻稿，也未找到可信新闻报道确认 December
              2024 正式融资轮。累计融资金额（$867.5M，而三轮已知融资合计 $605M）以及 September 2025 的 $600M Urban Sports Club
              收购，都从侧面支持公司可能补充过资本，但具体估值无法独立核验。尽调应要求公司提供股权结构表快照，以及经董事会确认的最新估值数字。
            calloutType: risk
            claimRefs:
              - CO019
              - CO023
          - type: callout
            title: CADE 反垄断行动：Brazil 竞争护城河的结构性约束
            body: >
              Wellhub 在 Brazil 企业健康福利市场的主导地位，部分建立在与高端健身房的独家合作上；CADE 现在已禁止该做法。March 2025 宣告所有独家合同无效，并处以 R$3M
              罚款，显示监管态度正在升级。Wellhub 的竞争对手，尤其是 TotalPass，已经结构性获得此前被锁定的健身房网络访问权。这实质削弱了 Wellhub 在最大规模、最早进入市场中的竞争差异化。
            calloutType: risk
            claimRefs:
              - CO036
              - CO037
              - CO038
          - type: callout
            title: Urban Sports Club 收购确立欧洲市场领导地位
            body: >
              September 2025 以 $600M 收购 Urban Sports Club，是 Wellhub 历史上最大交易。该交易新增五个国家，并把两个优势互补的平台合在一起：Wellhub 的 B2B
              企业能力，以及 Urban Sports Club 的欧洲消费者品牌和合作伙伴密度，从而显著加速欧洲市场存在感。联合创始人再投资，释放出对合并后实体的信心。这使 Wellhub
              成为唯一真正以企业规模运营的全球企业健康福利平台。
            calloutType: strength
            claimRefs:
              - CO032
              - CO033
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              企业健康福利市场涵盖雇主赞助的所有计划、服务和平台，目标是改善员工健康、生产率和福祉。市场由五个核心垂类构成：体能训练和健身房访问；心理健康、压力管理和员工援助计划（EAPs）；营养和体重管理；健康风险评估（HRAs）和生物识别筛查；戒烟和物质戒断计划。金融健康、睡眠计划和数字教练等相邻且快速增长的垂类，正越来越多被纳入市场边界。企业健康福利市场边界不包括雇主支付的团体健康保险保费（单独归为团体健康福利）、未获雇主补贴的个人消费者健身房会员，以及通过健康保险计费的临床治疗。

              Wellhub
              处在“企业健康福利平台”子赛道——以数字化方式交付的多供应商市场，把健身房访问、心理健康应用、营养服务和睡眠计划聚合成一项由雇主签约的福利。多供应商平台替代的现状方案包括：绑定单一场馆运营商的企业健身房直签会员、雇主自有现场健身中心、基于
              FSA/HSA 的个人报销方案，以及通过保险公司销售的点状 EAP。每一种替代方案都缺少聚合平台提供的跨垂类覆盖、网络灵活性和数字使用量可衡量性。

              与 Wellhub 战略直接相关的区域市场有三个：North America（约占全球企业健康福利支出的 37–40%，由美国领先）、欧洲（据 IMARC Group 2025，约占全球支出的
              39.5%，由德国和英国领先）和 Latin America（约占全球支出的 6%，由 Brazil 这一 Wellhub 创始市场领先）。Asia-Pacific 是全球增速最快的区域市场，但截至 May
              2026 并非 Wellhub 当前运营地区。
