  - id: TM001
    title: 企业健康市场边界——纳入与排除支出
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 主要买方 / 付款方
      - 与 Wellhub 的相关性
    rows:
      - - 身体健身与健身房权益
        - 雇主补贴的健身房会员、多健身房通行网络、健身 app、工作室课程、个人训练
        - 非雇主补贴的个人消费者健身房会员、直接面向消费者的健身 app 订阅
        - HR/Benefits 部门（雇主）+ 可选员工自付
        - 核心产品：Wellhub 最大收入垂直；100K+ 健身合作伙伴
      - - 心理健康与压力管理
        - EAP、虚拟治疗平台、正念 app、韧性训练、数字咨询、压力管理工作坊
        - 临床精神科住院治疗、向保险计费的精神类药物
        - HR/Benefits 部门；历史上常与 EAP 保险承运商捆绑
        - 相邻垂直：Wellhub 心理健康与正念合作伙伴品类
      - - 营养与体重管理
        - 营养教练 app、营养师咨询、饮食追踪订阅、企业营养项目
        - 未标记为健康福利的食品杂货补贴、向保险计费的 GLP-1 肥胖药物
        - HR/Benefits 部门
        - 相邻垂直：Wellhub 营养合作伙伴品类
      - - 健康风险评估与生物识别筛查
        - 年度 HRA 调查、生物识别筛查、预防性健康实验室、慢病风险评分、可穿戴数据项目
        - 向保险计费的诊断实验室费用、医生开具的临床诊断
        - HR/Benefits 部门与保险承运商协同
        - 边缘相关：不是 Wellhub 网络品类，但支撑雇主 ROI 叙事
      - - 睡眠项目
        - 睡眠教练 app、可穿戴睡眠分析订阅、睡眠卫生教育、聚焦睡眠的数字健康服务
        - 临床睡眠障碍治疗，如 CPAP 处方和多导睡眠图
        - HR/Benefits 部门
        - 相邻垂直：Wellhub 睡眠合作伙伴品类
      - - 财务健康
        - 财务教练 app、预算工具、EAP 财务咨询、学生贷款援助项目
        - 401(k) 计划管理、薪资预支、股权薪酬
        - HR/Benefits 部门
        - 范围外：截至 2026，未纳入 Wellhub 当前平台供给
      - - 戒烟与物质戒断
        - 戒断 app、NRT 贴片或口香糖报销、电话教练、虚拟戒断咨询
        - 临床成瘾治疗项目、向保险计费的处方戒断药物
        - HR/Benefits 部门
        - 边缘相关：出现在部分健康服务平台合作伙伴目录中，但不是 Wellhub 核心垂直
    notes: >
      细分定义沿用 MarketsAndMarkets 和 Mordor Intelligence 分类法。Wellhub 覆盖健身、心理健康、营养和睡眠垂直；截至 May
      2026，财务健康不在其可服务范围内。不同分析机构对市场边界定义不同，并直接驱动 TAM 估计中 $66–95B 的区间。
    claimRefs:
