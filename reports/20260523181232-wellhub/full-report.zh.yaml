  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - CADE 反垄断——终局裁决进一步补救
        - 监控 CADE 程序日程和季度非排他合作伙伴留存指标
        - 终局裁决施加超出 Jan 2026 TCC 的补救（例如结构性分拆、收入分享）；或非排他合作伙伴在 12 个月内流失 >15%
        - 投资逻辑破裂：巴西竞争护城河被永久消除；按无排他情景重新承销单位经济模型
      - - LGPD / ANPD 或 GDPR——正式执法调查
        - 跟踪提及 Wellhub 的 ANPD 执法通知和 EU DPA（ICO、CNIL、BfDI）调查公告
        - ANPD 或 EU DPA 就 Wellhub 健康数据处理或 USC 收购后传输启动正式调查
        - 尽调阻断项：推进前取得隐私审计、DPO 响应计划和赔偿框架
      - - BRL 贬值——持续回到 Dec 2024 峰值附近
        - 按月监控 BRL/USD；跟踪巴西 2026 选举风险溢价和 Selic 利率路径
        - BRL/USD >6.5 持续 >2 个月（回到 Dec 2024 历史高位水平）
        - 重大关切：要求披露 FX 对冲、巴西收入占比情景分析和 USD 计价合同比例
      - - 疫情 / 封锁——线下健身房网络中断
        - 监控 WHO 紧急状态声明；巴西、美国、德国、英国政府公共卫生命令
        - 巴西或美国全国性健身房关闭命令持续 >60 天
        - 投资逻辑破裂：重估平台模型；评估数字健康收入能否独立支撑
      - - CEO 离任或失能
        - 监控公开公告、董事会构成变化和 LinkedIn/IR 信号
        - Cesar Carvalho 宣布离任、长期休假或被替换
        - 治理关切：任何进一步资本承诺前触发接班计划尽调；评估下一梯队领导层可信度
    notes: |
      击穿标准是投资论点失效的阈值，不是确定会发生的结果。触发项需要投资人持续跟踪尽调，不能被动观察。阈值按本章所述各项风险对投资论点的重大性设定。
