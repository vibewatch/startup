      - number: '4.3'
        title: 成本结构、利润率与单位经济模型
        blocks:
          - type: paragraph
            body: >
              Wellhub 的成本结构根本上由其市场平台架构决定。纯 SaaS 公司毛利率通常高于 70%，但 Wellhub 最大的 COGS
              项是合作伙伴签到付款——这是一项可变成本，随员工使用量同步放大。员工去更多健身房和工作室签到，合作伙伴付款就会上升；如果每次签到收入没有同比例增加，毛利率会被压缩。2025 年全球付款增长
              107%，是目前公开可见、最能代理这项可变成本底盘的指标。


              公司没有公开披露毛利率、EBITDA 或经营亏损。行业基准显示，健身市场平台模式（聚合网络伙伴并赚取价差）的毛利率通常在
              25–50%；数字组件（治疗应用、正念平台、营养内容）不需要逐次签到付款，变量成本接近于零，因此可能带来更高毛利率。CFO Bruno Annicq 公开强调 NRR 是关键 SaaS
              指标，说明内部模型更依赖现有客户扩张收入，而不是靠 CAC 拉动的新客户获取作为主要增长杠杆。不过，公司没有公开披露 NRR。


              雇主侧 CAC 很难在缺少 S&M 支出披露时估算。Wellhub 约有 ~2,000 名员工，销售团队面向员工数从 50 到 50,000 不等的公司 HR / 福利负责人；企业销售周期可能从 SMB 的
              1–3 个月，到大型企业的 6–18 个月不等。CAC 回收期未知；B2B 健康平台 的行业可比公司显示，回收期约为 12–24 个月。CEO Carvalho 将美国市场点名为 2026
              的主要增长驱动，意味着当地 S&M 投入会增加，并推高短期综合 CAC。


              营运资本动态：雇主 PEPM 可能按年预付开票，雇主侧营运资本较有利。员工订阅按月计费。合作伙伴付款按签到事件结算，可能按月后付。这种结构意味着 Wellhub
              先收现金、后欠合作伙伴款项，在雇主合同侧形成正向营运资本循环。FIDC 基金（R$100M）以未来合作伙伴应收款作抵押——说明 Wellhub
              有足够的前瞻签到现金流为合作伙伴外部融资提供支持，但同时也形成一项合同义务：必须兑付已被用作抵押的签到应收款。


              固定成本底盘：全球约 2,000 名员工，综合全口径人力成本（薪酬、福利、股权）可能每年为 $80–120M。再加上技术基础设施、办公室成本和 G&A 开销，S&M 和 R&D 之前的总固定成本估计为
              $100–150M/year。加入企业销售团队和产品 R&D 后，年度总运营费用（ex-COGS）估计为 $200–350M——与一家仍在烧钱、并依赖持续股权融资的公司相符。
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
