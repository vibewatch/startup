        - 询问 Wellhub：是否有针对其平台模式本身的随机或准实验结果研究？
      - - CADE 排他性禁令（巴西，March 2025）：~3,500 个健身房合作关系受影响；未来排他性被禁止
        - 采用约束
        - 已生效；法律上诉待决
        - 限制 Wellhub 创始且历史最大市场的竞争护城河；竞争对手现在可招募此前被锁定的巴西健身房合作伙伴
        - 跟踪 CADE 上诉结果；询问 March 2025 以来有多少巴西健身房合作伙伴退出，或在竞争平台双重上线
