      - - EGYM Wellpass
        - B2B 企业合同（定制）
        - 未公开披露；估计为高端定价
        - 健身房准入、EGYM 智能设备、企业健康仪表盘
        - 无公开定价；并购后定位推断为高端
        - 资金充足的竞争者，能够激进定价，在欧洲争夺企业客户
      - - Personify Health
