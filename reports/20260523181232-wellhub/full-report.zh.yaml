        - 未披露；估计 $3–$5 PEPM 或更高
        - 临床护理网络、结果分析、管理者项目
        - 高端定价与临床范围相称
        - 高价值心理健康采购；争夺 HR 健康预算，而非专门争夺健身预算
      - - Forma
        - PEPM LSA/FSA/HRA 管理费
        - 未披露；通常为 $2–$6 PEPM 管理费 + 资金金额
        - LSA、FSA、HRA、HSA 管理；Forma card；理赔 / 报销
        - 资金金额由雇主另行定义；管理费才是平台成本
        - 争夺健康预算份额；LSA 模式允许员工把资金从健身房平台转走
