        - 增长驱动
        - 持续；结构性宏观驱动
        - 为 C-suite 提供不依赖保险理赔框架的健康福利投资理由；适用于 Wellhub 的每个运营地区
        - 询问 Wellhub 如何在 CFO 级企业销售对话中使用 WHO/生产力数据
      - - 从现场交付转向异地 / 数字化交付（异地交付 CAGR 8.23%；外包项目 CAGR 6.89%）
        - 增长驱动
        - COVID-19 以来持续；速度在加快
        - 现场健身既有玩家面临数字化替代；Wellhub 以 app 和合作伙伴网络为核心，结构上更能承接这轮迁移
        - 询问 Wellhub 2022–2026 年移动 app check-in 与实体场馆 check-in 比例的变化趋势
      - - SME 数字健康福利细分 2026–2031 年 CAGR 16.44%
        - 增长驱动
        - 2026–2031 周期
        - SME 扩张是 Wellhub 最大相邻增长机会；需要更低 ACV 定价和自助开通能力
        - 询问 Wellhub：SME 与企业客户合约价值对比，以及最近报告期 SME 客户数增长率
      - - 外包 / 供应商管理的健康福利项目相对内部项目 CAGR 6.89%
        - 增长驱动
        - 2026–2031 周期
        - 市场结构向外部平台供应商迁移；雇主管理项目被挤压，Wellhub 的 TAM 直接扩大
        - 询问 Wellhub 如何转化目前自营健身房补贴或仅有 EAP 项目的雇主
      - - 参与率长期偏低（全球平均 20–30%；Gartner 称心理健康访问用户仅 25% 会参与）
        - 采用约束
        - 结构性 / 持续
        - 限制雇主 ROI 兑现；压低每名雇主的 check-in 量；若参与率停滞，会削弱续约和增购逻辑
        - 询问 Wellhub 有记录的单雇主员工参与率，以及是否高于或匹配 20–30% 行业基准
      - - MIT Sloan 2026 年 2 月证据综述：健康福利项目健康结果证据“出人意料地有限，且常与广泛引用的主张相矛盾”
        - 采用约束
        - 活跃；2026 发布
