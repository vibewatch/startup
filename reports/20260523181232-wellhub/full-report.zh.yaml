  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台概览与健康模块
        blocks:
          - type: paragraph
            body: >-
              Wellhub 是一个 B2B2C 企业健康 SaaS 平台，把 100,000+ 家健身房、工作室和数字健康服务商聚合进一个由雇主补贴的订阅。员工通过分层订阅进入平台，套餐从 Digital
              tier（仅数字应用，员工共同支付 $0/month）到 Diamond tier（$344.99/month）不等，后者解锁最广的线下访问。企业按团队规模年付，并可在 30 天或更短时间内启动 Wellhub
              项目。

              五个产品类别——健身、正念、治疗、营养、睡眠——由线下合作伙伴（健身房、工作室、游泳池、网球场）、虚拟私人教练（3,800+）和数字健康应用（99+）共同交付。截至 January 2026，该网络在 18
              个国家覆盖超过 100,000 个合作伙伴。Wellhub 子公司 Trainiac 提供专门的虚拟私人训练模块。

              平台已经产生可验证参与度：2026 调查中 93% 员工认为身心健康与薪酬同等重要，注册率比传统雇主健康项目高 3–5×，累计会员签到到 2025 年底达到 1
              billion。各产品类别成熟度差异很大：健身房访问和签到工作流已经完全产品化，AI 教练和治疗模块仍处早期或 beta 阶段，技术透明度有限。
