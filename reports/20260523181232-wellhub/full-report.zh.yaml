  - id: FU001
    title: Wellhub 企业客户旅程地图
    type: journey-map
    layout: wide
    summary: 五阶段客户采用旅程，从雇主发现到员工扩张；分别呈现企业和 SMB 买方路径，以及各阶段关键摩擦点。
    data:
      items:
        - id: stage-discovery
          label: 发现
          actor: CHRO / HR 福利负责人（企业）；HR 经理或业主（SMB）
          description: 雇主通过同行推荐、行业媒体、福利经纪人或 Wellhub 销售直触发现 Wellhub。企业买方会对照 ClassPass 以及现有 EAP / 健康福利项目评估；SMB 通常把它作为低成本员工福利评估。
          channels:
            - 福利经纪人推荐
            - 行业媒体（HFA、HR Tech）
            - 直接触达 / SDR
        - id: stage-evaluation
          label: 评估
          actor: HR 与财务 / 采购
          description: 雇主申请演示和报价；用注册率对标传统项目。Wellhub 声称相较单一健身房会员注册率高 3–5x，是本阶段关键卖点。企业买方可能在一个办公室或地区跑 3 个月试点。
          channels:
            - 产品演示
            - 参考客户电话（Aflac、Northwell、SoFi 用作背书）
            - 选定地点试点部署
        - id: stage-purchase
          label: 采购与部署
          actor: HR / 财务（买方）；IT / 福利管理员（部署方）
          description: 签署年度合同（雇主 PEPM 费用加员工订阅层级结构）。与 HRIS 集成以同步资格。用健康大使、沟通和高管背书启动推广，最大化首日注册。
          channels:
            - HRIS / 福利管理门户
            - Wellhub HR 仪表盘
            - 内部沟通（电子邮件、Slack、海报）
        - id: stage-adoption
          label: 员工采用
          actor: 员工（最终用户）
          description: >-
            员工选择订阅层级，并开始使用健身房、App 或数字服务。采用率在数月内爬升——Aflac 从首日的 15% 增至 3 年后的 45%。高表现客户可达到 30–50% 注册率。Wellhub AI
            和个性化活动推动再互动。
          channels:
            - Wellhub App 渠道（iOS/Android）
            - 健身房 / 工作室签到
            - 数字健康 App（Headspace、MyFitnessPal）
        - id: stage-expansion
          label: 续约与扩张
          actor: HR / CFO（续约）；员工（通过口碑自然扩张）
          description: >-
            雇主续签年度合同；注册增长提高可变员工订阅收入，长期拉升每客户 ARPU（NRR 扩张机制）。Wellhub 向 CFO 展示使用率 仪表盘和 ROI 数据（每投入 €1 回报
            €2.30），支撑续约。账户扩张可能包括新增地区或升级到 Wellhub+ 计划。
          channels:
            - CSM 续约讨论
            - HR 分析仪表盘
            - CFO ROI 报告
    approximationNotes: 旅程地图根据多个案例研究（Aflac、Northwell、SoFi）、CFO 媒体访谈和新闻稿表述重建；它不是 Wellhub 官方流程图。阶段时长和摩擦点根据案例叙述推断，可能不能代表所有客户类型。
    claimRefs:
      - CU010
      - CU025
      - CU040
  - id: FU002
    title: Wellhub 企业采用漏斗
    type: funnel
    layout: standard
    summary: 雇主到活跃员工漏斗展示从潜在企业客户到活跃员工订阅者的顺序转化，并根据公开报告的基准估算各阶段转化率。
    data:
      items:
        - label: Wellhub 客户公司的员工数（估算）
          value: 10000000
          note: 按 ~40,000 客户 × 平均 ~250 名员工估算；Wellhub 未披露总合格员工数
        - label: 拥有 Wellhub 账户访问权限的员工（估算）
          value: 7500000
          note: 按典型注册沟通覆盖 ~75% 合格员工数估算；Wellhub 未披露合格与已注册漏斗拆分
        - label: 已激活员工订阅者
          value: 5000000
          note: Wellhub 报告口径，截至 March 2026；意味着估计可覆盖员工总池的激活率约为 50%
        - label: 月活跃用户（估计）
          value: 2700000
          note: 衍生代理：1 billion 次年度签到（2025）意味着约 ~83M 次签到事件 / 月；去重活跃用户（不是签到事件）的保守估计约为 2.7M
        - label: 高参与用户 — 每月 4+ 次签到（估计）
          value: 1000000
          note: 基于典型健身参与度幂律分布，对高参与队列做粗略估计；Wellhub 未披露参与频次分段
    approximationNotes: 漏斗阶段数值有一部分为估计；只有活跃企业客户数（40,000）和订阅用户数（5M+）为直接披露。可覆盖员工人数和活跃参与率为衍生估计，不确定性显著。潜在客户到客户的转化率未披露。
    claimRefs:
      - CU004
      - CU025
      - CU039
  - id: FU003
    title: 具名客户验证质量矩阵
    type: matrix
    layout: wide
    summary: 评估五个具名客户案例的证据质量、结果具体度、生产部署成熟度和留存可见度，并纳入一项来自终端用户评价平台的反向信号。
    data:
      columns:
        - 证据质量
        - 结果具体度
        - 生产部署成熟度
        - 留存可见度
      rows:
        - label: Aflac
          values:
            - 高 — Wellhub 官方案例研究，含具名高管引述
            - 高 — 披露具体入组率（15% day-1；到 2025 为 45%）和定性结果
            - 已确认生产部署（2022–2025；多年推出）
            - 部分可见 — 入组趋势可见；NRR 和续约未披露
        - label: Northwell Health
          values:
            - 高 — 官方案例研究，含 CPO 引述；可独立引用
            - 高 — 记录了健身房月增长 11%、App 增长 8%；85,000 名员工规模有文档支撑
            - 已确认生产部署（Oct 2023 公告；持续中）
            - 部分可见 — 使用率增长可见；合同续约条款未公开
        - label: Heineken Brazil
          values:
            - 中 — 通过 casestudies.com 的案例研究（独立聚合平台）；2019–2020 数据
            - 高 — 记录了 58% 注册率、22% 入组率、21,000 次签到
            - 已确认生产部署（多年部署；最新状态未更新）
            - 低 — 数据样本停留在 2019–2020；未找到近期续约确认
        - label: SoFi
          values:
            - 中 — 通过 casestudies.com 的案例研究；2021 数据
            - 高 — 记录了 161% 订阅用户增长；~30% 活跃计划率
            - 已确认生产部署（Jan–Oct 2021 部署数据）
            - 低 — 数据样本停留在 2021；无近期更新；此后 SoFi 员工增至 7,000+
        - label: 个人用户评价平台（Trustpilot/BBB）
          values:
            - 中 — 个人员工用户；不是雇主买方视角
            - 低 — 反向信号只是轶事证据（账单争议、账户冻结）
            - 持续中 — 反映当前在线服务体验
            - 反向 — 雇主退出时出现账单 / 取消投诉，显示结构性摩擦
    approximationNotes: 评级为作者判断，基于来源独立性、结果具体度和数据新鲜度。并非 Wellhub 官方评估。Heineken 和 SoFi 数据已有数年，可能不反映当前部署状态或续约结果。
    claimRefs:
      - CU011
      - CU033
      - CU019
      - CU031
  - id: FU004
    title: 员工入组留存队列（指示性）
    type: cohort
    layout: standard
    summary: >-
      以 Aflac 案例研究为主要锚点，并使用源自 Wellhub 2025 Corporate Wellness Report
      调查的行业中位数代理，展示指示性的员工入组轨迹。列表示上线后年份；数值为估计活跃入组率（0–100%）。
    data:
      columns:
        - 上线月
        - 第 1 年
        - 第 2 年
        - 第 3 年
      rows:
        - label: Aflac（2022 队列；已确认数据）
          values:
            - 15
            - 30
            - 38
            - 45
        - label: Wellhub 企业代理（由 CFO 入组率区间推断）
          values:
            - 10
            - 22
            - 30
            - 38
        - label: 行业中位数（企业健康福利调查代理）
          values:
            - 8
            - 14
            - 18
            - 22
    approximationNotes: >-
      Aflac 第 1 年（15%）和第 3 年（45%）是官方 Wellhub 案例研究确认的锚点；第 2 年（30%）为线性插值。企业代理使用 CFO 所称高绩效客户成熟期 30–50% 入组率作为第 3
      年上限；中间年份为估计。行业中位数来自 Corporate Wellness Report 2025 调查：67% 员工表示公司提供健康福利，但只有 31% 认为相关——这意味着存在广泛使用缺口，也指向低于 Wellhub
      头部账户的中位采用率。Wellhub 未公开披露按队列划分的入组率或留存率；本图使用代理和插值数据，仅应作指示性参考。
    claimRefs:
      - CU026
      - CU028
      - CU030
      - CU003
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 将 Wellhub 风险按发生可能性（行）和影响（列）映射；最高严重度风险集中在 CADE 执法和健康数据泄露。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 重大影响
      rows:
        - label: 高可能性
          values:
            - App 质量 / 过时场馆列表
            - BRL 贬值；雇主流失（衰退）
            - LGPD/ANPD 执法；USC 整合延迟
            - CADE 反垄断进一步补救措施
        - label: 中等可能性
          values:
            - ''
            - US DOL 用工身份重分类；IPO 时点风险
            - GDPR 健康数据罚款；CEO 关键人离任
            - 疫情导致健身房关闭扰动；健康数据泄露
        - label: 低可能性
          values:
            - ''
            - ''
            - 云平台宕机；USC 文化错配
            - ''
    approximationNotes: 发生可能性和严重度是基于监管文件、行业先例和专家分析的定性评估。并非精算估计。
    claimRefs:
