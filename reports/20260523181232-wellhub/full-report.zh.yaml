        - 医疗成本控制、ESG/DEI 报告、人才留存、HR 技术整合
      - - 中型企业（100–499 名员工）
        - HR 经理或 HR 总监
        - 全体员工
        - 雇主通常支付 100%；较小的共付结构正在出现
        - 福利经纪人推荐、同业对标、2–6 个月周期；合规审查更轻
        - HR 经理 / CEO / CFO
        - 与更大企业对标福利竞争力、吸引和留住人才、员工满意度得分
      - - SMB（< 100 名员工）
        - 所有者、CEO 或 PEO 管理员
        - 全体员工
        - 通常由雇主全额出资；部分存在员工分摊
        - PEO 聚合平台市场、直接自助注册，1–3 个月
        - 所有者 / 创始人
        - 合规要求（EU 心理社会风险强制要求）、PEO 套餐纳入、员工留存压力
      - - 公共部门
        - 政府 HR / 福利管理部门
        - 公务员及符合资格的家属
        - 政府雇主出资；可能通过工会协议集体谈判确定
        - 公共采购流程、工会谈判、12–24+ 个月；合规要求广
        - 政府 HR 负责人 / 财政部
        - 公共卫生要求、工会合同续签、职业健康合规要求
      - - 医疗健康与生命科学
        - HR/福利总监与职业健康负责人
        - 临床与非临床员工
        - 雇主出资；该行业按员工数衡量付费意愿较高
        - 职业健康集成、符合 HIPAA 的数据要求、6–12 个月
        - HR/福利总监与职业健康
        - 行业职业倦怠和流失风险高、贴近 HIPAA 的数据文化、认证驱动的健康福利要求
    notes: >
      采购周期估计基于 Mordor Intelligence 和 Howden Group 报告中的行业基准。付费结构惯例反映美国、欧洲和巴西市场常态；各国共付法规不同。细分收入占比来自 Mordor Intelligence
      2025 数据（大型企业 = 市场 53.21%）。
