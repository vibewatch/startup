      - number: '1.5'
        title: 里程碑与公司历史
        blocks:
          - type: paragraph
            body: >
              Wellhub 的 11 年历史，从 Brazil B2C 健身房访问应用，演进为全球最大的 B2B 企业健康福利网络之一。公司从直接面向消费者转向雇主赞助，源于早期企业客户
              PricewaterhouseCoopers Brazil：客户希望将福利扩展给 5,000+ 名员工。国际扩张随后由大客户在其他办公国家的使用需求自然拉动——例如一家 Mexico 银行客户推动 Spain
              落地。2020 年 COVID-19 催化公司加速转向数字健康福利，平台也从线下健身房访问拓宽。

              关键负面里程碑包括：2022 年，Brazil 反垄断机构 CADE 对 Wellhub 的独家健身房合同启动正式调查，并形成停止侵权协议（TCC）。December 2024，CADE 因 Wellhub
              继续独家做法、违反 TCC，对其处以 R$3 million（约 $600K USD）罚款。March 2025，CADE 宣告自 2022 年以来签署的所有 Wellhub
              独家合同无效，并禁止未来与健身房达成任何独家安排，直接影响 Brazil 约 3,500 家健身房合作伙伴。该监管行动是截至目前最重大的法律负面事件，可能限制 Wellhub
              在本土市场的竞争护城河。公司否认不当行为，并表示将维护健身房签署战略合作的权利。

              主要收购包括 Trainiac（December 2021，条款未披露），即美国在线私人训练业务；欧洲的 Fitprime、Andjoy 和 7Card（日期未公开确认）；以及 Urban Sports
              Club（September 2025，$600M），后者是服务另外五个欧洲国家的领先员工福利平台。Urban Sports Club 交易是有记录以来最大收购，也释放出 Wellhub
              整合欧洲企业健康福利市场的意图。
