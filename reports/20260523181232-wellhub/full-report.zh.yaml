chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              Wellhub 是一家云端 B2B 企业健康福利平台，总部位于 New York City，主要运营基地在 São Paulo, Brazil。公司最初以 Gympass 名义注册和运营，April 4,
              2024 正式更名为 Wellhub，战略重心从健身房访问延伸到五个健康福利垂类：健身、正念、治疗、营养和睡眠。更名与新产品功能、新网络合作伙伴同步发布；CEO Cesar Carvalho 明确将其与未来
              IPO 准备相连，但截至 May 2026，公司尚未确认具体 IPO 日期或上市交易所。

              公司的核心商业模式是 B2B2C 结构的双边市场。雇主向 Wellhub 支付年度平台费（类似 SaaS
              的部分），员工因此可按补贴价格购买月度订阅计划，使用经筛选的大型健身房、工作室、教练和数字健康应用网络。Wellhub 按每次 check-in
              向网络合作伙伴付费，收入与合作伙伴使用量直接挂钩。与直接健身房会员或员工报销计划相比，这一模式靠聚合、灵活和可衡量来区分。CFO Bruno Annicq
              公开表示，固定雇主费用叠加可变员工采用率形成飞轮：员工注册越多，合同越黏，净留存率（NRR）越好。

              截至 March 2026，Wellhub 在 18 个国家运营（包括美国、Brazil、英国、德国、法国、西班牙、Mexico、Argentina、Chile、Ireland、Italy、Portugal，以及
              Urban Sports Club 收购带来的五个新增欧洲国家），服务约 40,000 家企业客户，客户从 SMB 到 Fortune 500 不等。知名企业客户包括
              Aflac、Amazon、Accenture、Citizens Bank、Santander、TikTok、Unilever 和 KPMG。
