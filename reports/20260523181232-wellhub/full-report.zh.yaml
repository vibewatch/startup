      - number: '8.3'
        title: 情景分析与退出路径
        blocks:
          - type: paragraph
            body: >
              三种情景框定概率加权估值区间。基准情景（$3-4.5B）假设 Wellhub 成功整合 Urban Sports Club，到 2026 年底合并 ARR 达到 $420-450M，雇主客户增长维持
              10-15%，并在 2028-2029 以 8-10x ARR 经战略收购或 IPO 退出。这一情景与 EGYM 平价倍数和当前二级市场定价一致。它不需要私募市场倍数重估，只需要执行到位。

              牛市情景（$5-7B）建立在三点上：美国市场到 2027 成为 Wellhub 最大市场；合并 ARR 达到 $550-600M，AI Coach 的 ARPU 溢价推动利润率扩张；IPO 以 10-12x 远期
              ARR 定价，吃到与 EGYM/Playlist 并列的品类领导叙事。牛市情景成立，但需要整合零失误、美国增长远超当前轨迹，并且宏观环境能容忍盈利成长型公司拿高溢价倍数。

              熊市情景（$2-3B）对应另一条路径：USC 整合吃掉 18-24 个月管理层带宽，却未带来增厚 ARR；CADE 取消排他后，巴西市场向本土竞争者打开，收入下滑加速；SaaSpocalypse 带来的 SaaS
              倍数压缩（PitchBook Q1 2026：中位数同比从 4.9x 降至 3.3x）延续。在这些条件下，低于 $4.2B 定价的一级融资有可能出现，以 pre-IPO
              二级市场卖盘价格入场的持有人会面临按市值计价亏损。

              退出路径分析强化了基准情景框架。按 CEO 表态，IPO 明确并非近在眼前。最可执行的退出路径是战略收购——Wellhub 可能成为全球 HR
              平台（SAP、Workday、ADP）的补强式并购标的，买方借此获得现成的多国健康服务网络；也可能被押注企业健康整合的 PE 整合式收购平台收购。按基准情景定价，战略买家的逻辑在 $3.5-4.5B
              区间说得通；若按牛市定价，只有能释放协同成本节约的大型平台买家才算得过账。
