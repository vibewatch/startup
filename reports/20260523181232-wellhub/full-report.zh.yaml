      - number: '6.2'
        title: 采用轨迹与增长证据
        blocks:
          - type: paragraph
            body: >-
              Wellhub 最强的采用信号是签到量：平台累计签到从 2022 的 100 million 增至 2025 的 1 billion，三年增长十倍，既有 Wellhub 官方新闻稿佐证，也被 Fitt
              Insider 独立报道。企业客户数从 August 2023 的约 15,000 增至 August 2024 的约 18,000，随后到 March 2026 翻倍至约 40,000——加速部分来自
              Urban Sports Club 收购（交易关闭时宣布合并客户数 34,500）。员工订阅者增长跟随客户增长：从 August 2023 的约 2 million，增至 March 2026 的超过 5
              million。Wellhub 披露的注册率比传统企业健康方式（雇主自有健身房、单一健身房会员、报销项目）高 3–5x，体现了多模式、灵活、补贴式访问的结构优势。超过 90% 的 Wellhub
              用户首次访问所去健身房，说明平台扩大了可触达健身市场，而不是蚕食既有健身房会员。2025 年全球合作伙伴付款较 2024 增长
              107%，美国付款近乎翻倍——这是需求侧信号，说明签到量被转化为合作伙伴网络中的真实经济活动。Braze 参与度案例记录，超个性化活动 带来 25% 净新增订阅收入，并使注册量提升
              3x，确认产品参与度投入会复合拉动获客。
