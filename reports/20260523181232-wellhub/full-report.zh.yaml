      - number: '1.4'
        title: 规模、指标与商业牵引
        blocks:
          - type: paragraph
            body: >
              Wellhub 从 2022 年到 early 2026 的增长轨迹显示出强劲业务动能。平台从 2022 年累计 100 million 次 check-in 起步，August 2024 达到 500
              million，2025 年底达到 1 billion，约三年增长 10 倍。check-in
              增长同时反映客户获取和单客户员工采用加深。平台的参与模式——可获得、灵活、补贴——相较单一健身房会员或雇主自有健身中心等传统健康福利计划，持续带来 3–5× 更高参与率。

              截至 March 2026，Wellhub 披露全球约 40,000 家企业客户（高于 August 2023 的 15,000 家）、超过 5 million 名员工订阅用户，以及覆盖 18 个国家、超过
              100,000 家的健康福利合作伙伴网络。按收入计，美国市场已成为公司第二大市场（仅次于 Brazil），并据 CEO Carvalho 在 2026 年公开评论，有望成为最大市场。2025 年，Wellhub
              网络向美国健身运营商支付的总额同比几乎翻倍；全球合作伙伴付款增长 107%。据 Getlatka 行业数据，Wellhub 在 September 2025 披露的 ARR 为 $319 million。CFO
              Annicq 称 NRR 是关键内部指标，但公司未公开具体 NRR 数字。

              截至 March 2026，公司员工约 2,000 人。October 2025 与 Anytime Fitness 的合作（2,300+ 个美国网点）使 Wellhub 成为美国最大的健康福利网络，在全美 50
              个州拥有 20,000+ 个健康福利访问点。September 2025 收购 Urban Sports Club 后，公司在欧洲新增五个国家，并补入大量合作伙伴库存和订阅用户基础。
