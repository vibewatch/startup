  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Wellhub 的竞争分布在三个重叠空间，区分标准是各自给买方的核心价值主张。第一层是健身网络聚合器——核心价值是在雇主补贴模式下提供多健身房线下访问，包括 EGYM Wellpass（April 2026 与
              Playlist/ClassPass/Mindbody 合并，合并估值 $7.5 billion）、TotalPass（SmartFit Group 的 B2B 部门）和 ClassPass
              的企业产品。第二层是综合健康福利平台，包括 Personify Health（原 Virgin Pulse + HealthComp，服务 18 million 会员）和 Vitality Group（7
              million 会员，嵌入保险），它们提供更广的计划导航、生物识别筛查和福利管理能力，范围超出体能训练访问。第三层是相邻点状方案，包括心理健康专门服务商（Spring Health、Lyra
              Health、Calm for Business）、灵活福利平台（Forma 的 LSA/FSA/HRA）和福利导航工具（League）；它们争夺同一雇主健康福利预算，但不匹配 Wellhub
              的健身网络。最后，存量替代方案——保险公司捆绑 EAP（Aetna/CVS Health）、直接健身房会员、FSA/HSA 报销项目和现场健身中心——代表雇主在评估是否采用 Wellhub
              式平台时比较的现状选项。内部自建（雇主自有应用）的风险较低，因为网络复杂度高；但大型科技雇主偶尔会开发自有健康福利项目。最实质的新进入威胁来自具备分发优势的垂直整合运营商：搭建企业端 B2B
              产品的健身房连锁，以及扩展数字健康福利能力的保险公司。
            claimRefs:
              - CP001
              - CP002
              - CP022
              - CP028
              - CP038
      - number: '3.2'
        title: 竞争对手画像与战略方向
        blocks:
          - type: paragraph
            body: >-
              EGYM Wellpass 由 April 2026 与 Playlist（ClassPass、Mindbody、Booker）合并形成，是 Wellhub
              在健身网络聚合上的最直接同业，也是全球资本最充足的挑战者。合并实体估值 $7.5 billion，2025 年净收入超过 $800 million，服务 30+ 个国家的 20,000+ 家雇主客户，并从
              Affinity Partners、Vista Equity Partners、Temasek 和 L Catterton 获得 $785 million 新股权融资。EGYM 智能健身设备带来的硬件整合，以及
              ClassPass 88,000+ 场馆网络带来的消费者触达，使其具备 Wellhub 欠缺的能力；不过 Wellhub 仍保有更广全球合作伙伴网络（100,000+）和更深的 Latin America
              存在。Personify Health 由 New Mountain Capital 和 Blackstone 支持，定位为 Health
              Platform-as-a-Service（HPaaS），整合福祉、健康计划导航和福利管理；它服务 7,500 家客户和 18 million
              名会员，但产品位置明显不同——做计划管理，不做健身房访问。TotalPass 是 SmartFit Group 的 B2B 部门，也是 Wellhub 在 LATAM 最尖锐的威胁：2026 年其 Brazil
              活跃用户同比增长 99% 至 4.1 million，2024 年企业客户基数增长 3 倍至 15,000 家，并借助 SmartFit 对 Latin America
              最大健身房连锁的直接所有权获得结构性成本优势。心理健康领域，Spring Health（融资 $466M，估值 $3.3B，450+ 家雇主，10M 覆盖人群）和 Lyra Health（融资 $915M，估值
              $5.9B，May 2026 融资 $57M）处在快速增长的相邻空间，雇主需求正在加强；但它们的产品范围——精准心理健康匹配和临床护理——并不直接替代健身房网络访问。Forma（融资 $57.6M，550K+
              会员）和 League（融资约 $242–500M，收入 $70–87.5M）则分别通过灵活支出和福利导航争夺 HR 福利预算，而非靠线下健康福利交付。
