      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              2026 年企业健康福利市场有四个结构性增长驱动。第一，雇主医疗成本通胀：美国家庭保险保费在 2024 年达到每名员工 $25,572，同比增长
              7%，预防性项目若能降低后续理赔成本，就具备直接财务激励。第二，心理健康正常化：疫情后的认知提升、EU-OSHA 心理社会风险要求，以及 ACA EAP
              激励框架，已让心理健康福利成为有竞争力雇主福利包中的标准预期。第三，未经治疗的心理疾病带来的宏观生产率成本：WHO 估计抑郁和焦虑每年造成全球 $1 trillion
              生产率损失，为健康福利投资提供了不依赖理赔成本叙事的 C-suite 理由。第四，交付转向数字化：场外和虚拟健康福利项目以 8.23% CAGR 增长，相比之下现场项目虽仍占
              55.43%，但增速较低；外包供应商管理项目以 6.89% CAGR 增长——这些动态直接利好 Wellhub 的平台模式，而非传统现场竞争者。

              最关键的结构性约束是长期偏低的参与率。全球只有 20–30% 的符合资格员工会定期参与健康福利项目；Gartner 数据显示，拥有心理或情绪福祉访问权的员工中，只有四分之一实际使用。February 2026 的
              MIT Sloan
              证据综述认为，严谨证据对健康福利项目改善健康结果的支持“仍然出人意料地有限，并且经常与广泛引用的主张相矛盾”；原因包括选择偏差（最健康的员工自我选择加入）、干预目标不精准，以及慢性病管理聚焦不足。证据基础挑战削弱了雇主对
              ROI 的信心，尤其影响重视数据的企业买方，并可能拖慢采购决策或压缩续约 NRR。

              监管动态好坏参半。EU-OSHA 心理社会风险评估要求，为欧洲市场的健康福利平台供应商创造监管入口。在 Brazil，CADE 于 March 2025 禁止 Wellhub
              所有独家合同，限制其创始且历史上最大市场的竞争护城河。在美国，ACA 合规框架提供有利激励结构，但 EEOC 对可穿戴设备激励的指引，以及 HIPAA 对健康数据的约束，增加了平台设计复杂度。EU 的隐私和
              GDPR 担忧进一步限制平台层面的健康数据个性化，约束供应商正在建设的 AI 和分析差异化。
