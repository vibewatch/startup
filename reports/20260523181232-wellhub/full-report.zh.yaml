      - number: '2.2'
        title: 市场规模：TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              六家主要研究机构给出的 2026 年全球企业健康福利 TAM 估计区间，从 $66.3 billion（Mordor Intelligence 低端）到 $94.6
              billion（MarketsAndMarkets 最宽口径）不等，集中趋势落在 $68–75 billion。Mordor Intelligence 的 $70.22 billion 与 Fortune
              Business Insights 的 $71.89 billion 夹住共识中位数。MarketsAndMarkets 的 $94.6 billion 明显是离群值，原因是定义更宽，把通常与健康保险捆绑的
              EAP 支出和虚拟护理项目也纳入。所有机构给出的 6–9% CAGR 共识，指向 2030–2031 年 $95–115 billion 的全球市场。IMARC Group 估计欧洲在 2025 年占全球收入
              39.5%——大致与 North America 持平——按某些口径是最大单一区域。

              Wellhub 的可服务市场（SAM）受 18 个运营国家，以及数字化、B2B、多供应商交付模式约束。North America（2026 年约 $28–33B）、欧洲（约 $20B+）和 Latin
              America（2026 年约 $4.5B）合计约占全球企业健康福利支出的 80%，与 Wellhub 当前版图匹配。Mordor Intelligence 测算的更窄数字员工福祉平台（SaaS）子赛道，在
              2026 年为 $2.13 billion，并到 2031 年保持 13.15% CAGR；这是最可防守的同口径 SAM 代理。中位 SAM 估计 $5–10 billion，覆盖 Wellhub 所在地区由
              B2B 平台撮合的企业健康福利市场，尚未计入经其合作伙伴网络流转的更广义健身房访问和体能训练支出。

              Wellhub 的可获取市场（SOM）以 September 2025 的 $319 million ARR 为锚。中周期 $1–2 billion 年平台收入可以通过拿下 North America、欧洲和
              LATAM 企业健康福利合计支出的 2–5% 实现；这一水平与有机增长轨迹，以及 Urban Sports Club 带来的欧洲规模增量相符。短期 SOM 受三项因素约束：企业合同周期 12–24 个月；CADE
              在 Brazil 禁止独家合作，限制公司本土市场护城河；多供应商平台雇主采用率约 20%，低于单一健身房或自建项目。分析机构之间的相互矛盾估计，纯粹由定义口径差异驱动；表 TM002
              保留这些差异，用于提示尽调中的规模不确定性。
