      - number: '8.4'
        title: 退出准备度与尽调优先级
        blocks:
          - type: paragraph
            body: >
              Wellhub 当前的退出准备度受三件事约束：信息不透明、整合复杂度和 IPO 时间弹性。信息层面，任何严肃收购方或 pre-IPO 投资人都会要求确认毛利率（PEPM SaaS 估计为
              50-65%，但未经核验）、净收入留存率（直接衡量雇主粘性），以及 USC 后按地理区域分同期群的 ARR 增长。截至 May 2026，这些指标均未公开。

              整合复杂度是已知变量。$600M 的 USC 收购由 GP Bullhound 担任顾问，涉及总部在德国的员工团队、独立合作伙伴网络，以及欧洲雇主客户关系。Wellhub
              整合较小收购的记录不错，但不能证明它能干净吸收这个规模的交易。增厚时间表很关键：如果 USC ARR 到 Q1 2027 已完全并入 Wellhub 报表，合并 run-rate ARR
              会明显更高，也更站得住脚。

              IPO 时间上，CEO César Carvalho 明确表示 IPO「not a milestone」，这符合一家已盈利（或接近盈利）且不缺资本的公司状态。二级市场趋势——Aug 2025 到 May 2026
              股价上涨 +41%——说明消息更充分的参与者正在为最终流动性事件提前站位。若公开市场从当前倍数压缩周期中恢复，12-18 个月窗口（H1 2027-H2 2028）看起来最现实。

              五项尽调优先级应成为任何投资决策的硬门槛：(1) 确认毛利率 >= 50%；(2) 确认同一雇主同期群的 NRR >= 100%；(3) USC 后合并 ARR，并给出清晰地理拆分；(4) CADE
              合规路线图和巴西排他性过渡；(5) 当前股权结构表和清算优先权堆栈，用于评估不同退出价格下普通股股东回报的稀释影响。
