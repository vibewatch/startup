          approximationNote: Estimated at 45-55% of employee subscription revenue; wide uncertainty range
        - label: 毛利估算（中性情景）
          value: 174
          approximationNote: Resulting gross margin ~55% of net; extremely uncertain; no disclosed actuals
        - label: 扣除：运营费用（估算）
          value: -280
          approximationNote: Estimated S&M + R&D + G&A; ~2K employees plus tech and expansion costs
        - label: 估算 EBITDA（中性情景）
          value: -106
          approximationNote: Deeply negative operating cash flow estimated; company has not disclosed
    sourceRefs:
