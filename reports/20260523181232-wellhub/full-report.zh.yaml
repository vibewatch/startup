  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              Wellhub 最重要的近期风险，是其与 Brazil 的 CADE（Conselho Administrativo de Defesa Econômica）仍在进行的反垄断争议。2022 年，Wellhub
              签署一份停止并终止协议（TCC），将任一区域内的健身房排他合同限制在 20%。CADE 在 March 2025 认定 Wellhub 违反该 TCC，继续维持与约 3,500 家健身房的排他合同，其中包括自
              27 September 2022 起签署的合同。CADE 发布临时命令，宣布所有此类合同无效，并禁止新增排他安排——此前 Wellhub 已在 2024 因违反 TCC 被罚 R$3
              million。January 2026，Wellhub 与 CADE 签署新 TCC，只允许与十家具名大型连锁保持排他（Bluefit、BodyTech/Fórmula、Cia
              Athletica、Panobianco、PHD Sports、Pratique、Pure Pilates、Selfit、Contorno do Corpo、Engenharia do Corpo），其余
              ~40,000 个巴西合作伙伴必须以非排他方式运营。CADE 最终裁决仍未落地，且可能附加更多条件。反垄断命令之前，NeoFeed 报道称，按用户量计 Wellhub 约占 Brazil 健身房聚合市场的
              80%——这道结构性护城河现在已被 CADE 部分拆解。

              数据隐私方面，Wellhub 在 18 个国家处理敏感健康数据——健身记录、生物特征使用模式、睡眠日志、营养数据和心理健康会话记录。Brazil 的 ANPD 于 11 December 2024 发布
              2025-2026 Regulatory Agenda，16 项计划行动明确把健康数据、AI、生物特征数据和个人数据聚合方列为优先事项。ANPD Resolutions No. 30 and No.
              31（December 2025）以年龄验证、AI 义务和修订后的处罚规则更新了该议程。LGPD 罚款最高可达巴西总收入的 2%，每次违规封顶 R$50 million；2023 至 2025 期间，ANPD
              在涉及 Meta、Clearview AI 和医疗行业的案件中，执法罚款总额估计约 R$98 million。EU 的 GDPR enforcement tracker（CMS Law, 2026）记录 265
              起医疗罚款，总计 €32.3 million，Italy、Spain 和 Germany 居前；最大单案为 €3.5 million，原因是一场勒索软件攻击在缺少多因素认证的情况下暴露了 79,404
              名个人的健康数据。Wellhub 的数据控制者结构（Brazil 为 GPBR Participações Ltda.，EEA/UK 为 Gympass US LLC）带来多司法辖区暴露，Urban Sports
              Club 收购又增加了欧洲 GDPR 版图。Wellhub 持有 ISO 27001 和 PCI-DSS 认证，并发布 SafeBase Trust
              Center，但没有公开可得的第三方审计报告，规模化健康数据处理仍是执法重点目标。
