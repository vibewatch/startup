      - number: '3.4'
        title: 护城河耐久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Wellhub 的竞争耐久性建立在四个互相连接的护城河要素上。第一，双边网络效应：100,000+ 家健康福利合作伙伴和 40,000+
              家企业客户形成自强化循环，网络广度吸引雇主，雇主体量吸引合作伙伴，合作伙伴质量提升员工使用量——目前没有同等全球规模的区域玩家能复制这一循环。第二，HRIS/薪资集成切换成本：已将 Wellhub 接入
              Workday、SAP 或 ADP 福利管理流程的企业雇主，若更换供应商，将面对跨季度重新实施、数据迁移和员工重新 onboarding。第三，September 2025 收购 Urban Sports
              Club，加深了欧洲合作伙伴密度；在 EGYM Wellpass 原本具备结构优势的地区，这部分抵消了 EGYM/Playlist
              合并威胁。第四，长期雇主合同叠加基于使用量的定价，形成收入惯性，限制客户机会主义转向低成本竞争者。 与这些护城河相对，存在三项实质替代风险。TotalPass 通过 SmartFit
              直接拥有的健身房基础设施获得结构性成本优势，可在 Brazil 以更低每次 check-in 费率压制 Wellhub；其用户同比增长 99%，说明这种优势已转化为客户赢单。March 2025 的 CADE
              命令剥离了 Wellhub 与约 3,500 家 Brazil 健身房和工作室合作伙伴的独家合同，消除了其最大市场的一道关键网络访问壁垒。EGYM Wellpass 的 $7.5 billion 合并实体和
              $785 million 新股权，使其有能力维持多年投资周期，缩小 Wellhub 在 North America 的网络广度差距。多归属——雇主在 Wellhub 之外叠加心理健康 EAP、正念应用和
              LSA——进一步限制 Wellhub 在单雇主福利钱包中的份额，并随时间压缩定价权。MIT Sloan 2026 年综述挑战健康福利 ROI 证据，也给包括 Wellhub
              在内的所有平台供应商增加证明负担，可能迫使它们更严格展示可衡量结果。
