        title: 附录
        blocks:
          - type: callout
            title: TAM 定义带来 2–3× 区间——Wellhub 应采用窄口径
            body: >
              2026 年企业健康福利 TAM 估计在 $66–95 billion 之间，主要是定义分歧，而非预测分歧。窄定义（项目和平台，约 $70B）是 Wellhub
              可服务宇宙最可防守的基准情景；MarketsAndMarkets 的 $94.6B 口径纳入了保险公司捆绑的 EAP 支出和虚拟护理补充项，而 Wellhub 的平台模式无法触达。投资人应把 $2.13B
              数字员工福祉平台指标作为最紧的 SaaS 可比 SAM，再用 Wellhub 18 个运营国家中更广义、由 B2B 平台撮合的健身与健康福利支出向上三角校验。
