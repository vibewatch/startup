            body: >-
              截至 March 2026，Wellhub 运营一个 B2B 企业健康平台，约有 40,000 家企业客户，覆盖 18 个国家的跨国大型企业、中端市场雇主和
              SMB。客户名单明显偏向大型企业：第三方媒体公开确认的具名客户包括 Unilever、Aflac、TikTok、Citizens
              Bank、Telefonica、Santander、Brookfield、FanDuel、SeatGeek、SoFi 和 ZenDesk。Brazil 仍是最大收入市场；US 位居第二，并在 October
              2025 Anytime Fitness 合作（2,300+ US locations）驱动下，预计将超过 Brazil 成为第一大市场。Europe 借 March 2025 Urban Sports Club
              收购大幅扩张，新增 12,000 家欧洲企业客户。相较企业客户，SMB 渗透不足已被公司承认；大客户更能摊薄固定 HR 管理成本，天然把选择推向企业层。双贡献 B2B2C
              模型——雇主支付平台费，员工购买补贴订阅——意味着 HR 买方和员工终端用户都必须满意，留存复杂度因此上升；在 HR 带宽更低的 SMB 中，这一问题尤其尖锐。Wellhub
              公司页面列出采用雇主的头部平台成效：员工身体活动提升 178%、年度医疗成本下降 35%、留存提升 43%；但这些汇总数字由公司报告，缺少外部审计。
