  - id: TI001
    title: 收入来源表
    description: Wellhub revenue streams by mechanism, unit economics, and evidence quality.
    columns:
      - 收入来源
      - 机制
      - 单位
      - 当前值状态
      - 证据质量
      - 尽调问题
    rows:
      - - 雇主平台准入费（PEPM）
        - 按每名符合条件员工每月收取固定经常性费用；年度合同
        - $2–$5 PEPM × 符合条件员工数 × 12 个月
        - 截至 Mar 2026 约 40,000 家客户；最低 ACV 估计 $21K–$210K，取决于员工数
        - 中 — PEPM 区间由雇主福利宣传页确认；实际定价会变化
        - 确认标价与实际 PEPM；要求提供批量折扣表，以及企业客户与 SMB 拆分
      - - 员工订阅收入
        - 员工自行选择月度层级；Wellhub 直接收款
        - $0（Digital）到 $344.99/month（Diamond）/ 订阅者
        - 截至 Mar 2026 订阅者 5M+；层级组合未披露
        - 中 — 标价由官方定价页和雇主福利文件确认；ARPU 未知
        - 要求提供订阅者层级组合、平均 ARPU，以及各层级雇主补贴转化率
      - - 合作伙伴签到价差（净利润率）
        - Wellhub 收取员工订阅费，并按签到向合作伙伴付款；价差就是净利润率
        - 可变；取决于使用率和与各合作伙伴谈定的签到费
        - 2025 年合作伙伴付款同比 +107%；价差利润率未披露
        - 低 — 支付给合作伙伴的签到费未披露；价差经济性无法公开验证
        - 要求提供前 10 类合作伙伴的单次签到费表，以及全网络平均签到费
      - - 金融服务收入（FIDC）
        - 来自 R$100M 巴西健身房合作伙伴应收账款融资基金的费用收入
        - 基金管理 / 发起费（占组合百分比）；由 Galapagos Capital 管理
        - R$100M（~$20M USD）基金于 Aug 2025 推出；费用收入规模未披露
        - 低 — 基金存在已确认，但 Wellhub 费用收入未公开报道
        - 确认费用结构；判断这是增厚收益的收入，还是盈亏平衡的合作伙伴留存工具
      - - Urban Sports Club 欧洲收入（收购后）
        - 覆盖另外 5 个欧洲市场的独立 B2B 员工健康合同
        - 类似 PEPM + 员工层级结构；定价未单独披露
        - Sep 2025 完成 $600M 收购；收入未从 Wellhub 核心业务中拆分
        - 低 — Urban Sports Club 收购后无单独财务披露
        - 要求将收购前 Urban Sports Club 收入、ARR 和毛利率纳入 NDA 包
    sourceRefs:
      - SI001
      - SI002
      - SI003
      - SI004
      - SI011
    notes: >
      所有收入数字均为公司披露，或根据公开代理数据估算。尚无经审计收入拆分发布。$319M ARR（Sep 2025） 是唯一外部报道的总收入数字，由公司通过 Getlatka 披露；未经审计，收入确认方法也未确认。PEPM
      和层级价格来自公开分发的雇主福利文件， 不是 Wellhub 对企业合同的官方定价条款。
