      - number: '1.3'
        title: 融资历史与投资方构成
        blocks:
          - type: paragraph
            body: >
              Wellhub（当时名为 Gympass）在 2019 年完成首轮主要机构融资：$300 million Series D，由 SoftBank Vision Fund 和 SoftBank Latin
              America Fund 领投，老股东 General Atlantic、Atomico 和 Valor Capital Group 参投。当时公司在 14 个国家运营，拥有近 47,000
              家健身房和工作室合作伙伴、超过 2,000 家企业客户。2021 年 Series E 融资 $220 million，由 SoftBank 领投，估值翻倍至 $2.2 billion；参投方包括 General
              Atlantic、Moore Strategic Ventures、Kaszek Ventures 和 Valor Capital Group。

              August 2023，全球融资环境承压，Wellhub 仍以 $2.4 billion 估值完成 $85 million Series F，由 EQT Growth 领投，Neuberger Berman
              参投。同期，General Atlantic 和 Moore Strategic Ventures 从早期投资人与员工手中购买老股，在不稀释主轮融资的情况下，为早期利益相关方提供部分流动性。Series F
              发生在公司创纪录增长的一年：Wellhub 企业客户几乎翻倍至 15,000 家，员工订阅用户突破 2 million。

              老股市场跟踪数据（premieralts.com）显示，公司在 December 2024 完成一轮 $149 million 后期 VC 融资，投后估值 $4.2 billion，累计融资 $867.5
              million。本次研究未找到公司对该轮融资的官方新闻稿，构成重要证据缺口。不过，累计融资金额（$867.5M，而此前三轮合计 $605M）与一笔可观新增融资相符；$4.2B 也是 May 2024
              之后可获得的最佳估值数据点。再结合 September 2025 以 $600M 收购 Urban Sports Club，公司资本投放轨迹支持其截至报告日仍维持独角兽地位。
