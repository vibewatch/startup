      - number: '6.4'
        title: 留存、耐久性与满意度
        blocks:
          - type: paragraph
            body: >-
              Wellhub 的 2026 Return on Wellbeing report 基于 9 个国家 5,000+ 名员工和高管调查，发现经常使用雇主提供健康福利的员工，在未来 12 个月表达离职意向的可能性低
              4.5x。拥有综合项目的公司报告缺勤率降低 28%，病假减少 19%。据 Wellhub，每投入 €1，可通过减少流失和缺勤带来 €2.30 的回报价值——这是 CFO 可带入预算讨论的量化 ROI 叙事。CFO
              Bruno Annicq 将 NRR 定义为 Wellhub 主要财务健康 KPI，强调 B2B2C 飞轮创造复合粘性：部分企业客户实现 30–50% 员工注册率，使该福利嵌入公司文化。不过，Wellhub
              没有公开披露 NRR、GRR、毛利率或合同续约率；缺少这些数字，~40,000 家客户基础的耐久性无法独立验证。FeaturedCustomers 市场数据基于 1,914 个参考评分给 Wellhub
              4.8/5 评级（Summer 2025 Market Leader in Corporate Wellness Software），Trustpilot 则基于数百条个人用户评论将平台评为
              4.1/5（「很好」）。Trustpilot 和 BBB 投诉记录了员工更换雇主时反复出现的计费问题和账户取消困难——这是雇主赞助模式的结构性脆弱点——但雇主层面的流失数据未公开。
