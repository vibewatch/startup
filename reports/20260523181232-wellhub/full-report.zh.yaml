          - type: callout
            title: EGYM/Playlist 以 9.4x 收入设定直接可比上限
            body: >
              EGYM 于 March 2026 以 $7.5B 收购 Playlist（原 ClassPass），对应合并 2025 收入 $800M+，为 Wellhub 提供最相关的估值锚点。按 9.4x
              EV/revenue 计算，如果 Wellhub 的 USC 后合并 ARR 达到 $400-450M，则 EGYM 平价估值为 $3.7-4.2B，与当前二级市场标记大体一致。若牛市情景要突破
              $5B，Wellhub 必须在收入和利润率上都可证明地跑赢 EGYM/Playlist 实体。
