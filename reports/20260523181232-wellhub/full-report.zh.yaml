  - id: FI001
    title: 收入模型桥
    description: |
      Wellhub 如何把企业客户活动转化为收入和毛利。该瀑布图展示雇主 PEPM 层（可预测基础）、员工订阅贡献（由采用率驱动），再扣除估算的合作伙伴签到付款（可变 COGS），得到估算毛利。所有数字均为估算；实际数据未披露。
    type: waterfall
    data:
      items:
        - label: 雇主 PEPM 接入费（估算）
          value: 150
          approximationNote: 'Estimated: 40K clients × avg 350 eligible employees × $3/PEPM × 12 months; rounded'
        - label: 员工订阅收入（估算）
          value: 169
          approximationNote: 'Estimated residual: $319M total ARR less $150M employer PEPM component'
        - label: 扣除：合作伙伴签到付款（估算 COGS）
