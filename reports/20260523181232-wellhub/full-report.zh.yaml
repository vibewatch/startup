companyProfile:
  summary: >-
    Wellhub（原 Gympass）是一家总部位于 New York 的 B2B 企业健康福利平台，2012 年由 Cesar Carvalho、Vinícius Ferriani、João Thayro 在 São Paulo,
    Brazil 创立。公司运营一个双边 B2B2C 市场：雇主按每名员工每月支付平台费，员工获得补贴后，可使用经筛选的全球健身房、工作室、教练和数字健康应用网络，覆盖健身、正念、治疗、营养和睡眠。April 2024，Gympass
    更名为 Wellhub；此后公司扩张至约 40,000 家企业客户、5M+ 名员工订阅用户、18 个国家的 100,000+ 家健康福利合作伙伴。September 2025 以 $600M 收购 Urban Sports Club
    后，公司扩大了欧洲版图；October 2025 与 Anytime Fitness 达成合作后，成为美国最大的员工健康福利网络。ARR 为 $319M（Sep 2025，Getlatka）。最近一次确认估值为 $4.2B（Dec
    2024，老股市场）。毛利率、NRR、烧钱速度仍未披露。
