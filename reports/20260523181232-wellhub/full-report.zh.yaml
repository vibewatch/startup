      - number: '4.2'
        title: 定价架构与变现
        blocks:
          - type: paragraph
            body: >
              Wellhub 定价分为两个独立但相连的层面：雇主侧（B2B 合同）和员工侧（面向消费者的计划层级）。雇主侧，公开可得的雇主福利门户计划文件确认，PEPM 访问费为每名符合资格员工每月
              $2–$5，不论员工是否激活均收取。这为每份雇主合同创造了有保障的最低收入底线，并随雇主全部符合资格员工数扩张——不是随报名员工数扩张。按中点 $3.50 PEPM 计算，一家 500 人公司最低雇主合同价值为
              $21,000/year；一家 5,000 人企业为 $210,000/year。超过特定人数门槛以及多国交易，可能适用定制企业定价。


              员工侧，有记录的十个层级从免费（Digital：仅数字应用和点播内容）到高端（Diamond：最高 $344.99/month）覆盖价格带。中间层级包括
              Starter（$11.99–$24.99）、Basic（$32.99–$37.99）、Bronze（$54.99–$64.99）、Silver（$94.99–$109.99）、Titanium（$134.99–$139.99）、Gold（$189.99–$214.99）和
              Platinum（$259.99–$289.99）。员工面向价格还可进一步由雇主补贴——许多雇主会承担 Starter 或 Bronze
              层级的全部成本。每订阅用户平均收入（ARPU）高度依赖层级组合和雇主补贴水平，两者均未公开披露。


              大型企业交易的实际定价几乎肯定偏离标价。Wellhub 未披露企业合同的任何数量折扣、合同费率表，或实际定价相对标价的差异。雇主 PEPM $2–$5 来自公开分发的福利管理宣传单，而非 Wellhub
              官方企业定价条款。雇主和员工两层合在一起，形成 Wellhub 的混合 ARPU；在约 40,000 家企业客户（March 2026）和 $319M ARR 水平下，粗略推算每名雇主平均年度合同价值约
              $7,975（该粗略估计假设客户数到 Sep 2025 线性增长，且所有 ARR 均来自客户合同）。公开来源无法按企业 vs. SMB 或地理区域拆分。
