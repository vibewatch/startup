      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >
              Wellhub 的资本状况被一笔大型收购重新塑形，这笔交易在 2025 实质改变了资产负债表。以 $600M 收购 Urban Sports Club（September
              2025）会消耗相当一部分累积现金。公司最近一次已确认、来自一手来源的股权融资，是 $85M Series F，估值 $2.4B（August 2023）。二级市场跟踪方 premieralts.com
              报告称，公司在 December 2024 又完成一轮 $149M 融资，投后估值 $4.2B，总融资额 $867.5M——这与 Series F 关闭至 Urban Sports Club
              收购之间发生资本事件相一致，但尚未找到官方新闻稿。Company Overview 时间线列出了所有已确认及二级来源轮次；本章为资本充足性评估单独形成判断。


              如果 December 2024 的 $149M 轮次得到确认，收购前现金位置可能是 $85M + $149M，再加上 August 2023 至 December 2024
              期间经营现金生成、扣除烧钱后的净额——约 16 个月，且公司处于高速增长。按估计月烧钱 $15–30M（主要来自薪酬、S&M、基础设施和扩张成本）计算，该期间总烧钱为 $240–480M。结合 Series F
              及更早轮次的存量现金，收购前现金粗估为 $200–500M 在方向上合理。$600M 的 Urban Sports Club 收购可能部分由 December 2024 融资以及未公开披露的债务工具支持。


              收购后，公司没有披露官方现金头寸或烧钱率。缺少收购后融资公告，留下两种情境：（1）Wellhub 收购后保留了足够现金，可支撑 18–24 个月现金跑道，因此 2026–2027 可能 IPO
              或新一轮融资；或（2）收购主要由债务融资支持，形成了公开股权融资数据中看不到的融资义务。CEO Carvalho 曾公开称，IPO
              会在「需要资本或投资人想退出时」发生——这种表述与一家尚未面临迫近资本压力、但在为下一次流动性事件做准备的公司相符。


              FIDC R$100M 合作伙伴融资基金并不代表 Wellhub 自身资本充足——这是一个以合作伙伴应收款为抵押、由第三方（Galapagos Capital）管理的表外结构。不过，该基金说明 Wellhub
              相信未来签到现金流足以抵押合作伙伴贷款，也间接印证了参与度轨迹。
