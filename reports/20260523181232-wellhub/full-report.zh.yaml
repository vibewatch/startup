  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与商业模式
        blocks:
          - type: paragraph
            body: >
              Wellhub 运营 B2B2C 收入模式，有两个主要现金流机制。第一是经常性雇主平台访问费，通常按每名符合资格员工每月（PEPM）收费，公开材料常引用 $2–$5，不论员工是否开通计划都收取。该部分类似
              SaaS 年度合同——可预测、经常性，绑定雇主总人数，而非员工使用量。第二是员工订阅收入：选择激活福利的员工支付月度计划费，范围从 $0（Digital 层级，仅数字访问）到
              $344.99/month（Diamond 层级，全访问高端计划）。Wellhub 直接收取员工付款（或通过薪资扣款），再按每次 check-in 向健康福利合作伙伴付费，从而形成与使用量挂钩的可变收入成本。


              Getlatka 披露的 September 2025 $319M ARR 是公司报告且未经审计。它最可能是包含雇主 PEPM 和员工订阅收入的总收入，尚未扣除合作伙伴付款（后者构成主要收入成本）。2025
              年，向健身运营商支付的全球合作伙伴付款同比增长 107%，美国付款几乎翻倍——这表明使用量和订阅采用的增速可能超过静态 ARR 数字。若 ARR 增长滞后于付款增长，意味着利润率压缩；若 ARR
              同步增长，则指向稳定的价差经济。


              三条新兴收入流补充核心模式。第一，August 2025 推出的 R$100 million FIDC（Fundo de Investimento em Direitos Creditórios，即
              Receivables Investment Fund），使用 Wellhub 自有 check-in 应收账款作抵押，为合作健身房扩张提供融资。Wellhub
              从这一金融产品获得费用收入，而无直接资产负债表敞口——基金由 Galapagos Capital 设计并管理，QI Tech 负责托管和行政管理。第二，Urban Sports Club 收购（September
              2025，$600M）增加一条欧洲员工福利收入流，其单位经济可能不同于 Wellhub 核心模式。第三，Anytime Fitness 合作（October
              2025）加深美国网络，可能在不新增直接收入捕获的情况下，提高 check-in 量和合作伙伴付款流。收入确认方式未公开描述；多年雇主合同可能按期确认，员工订阅则按月确认。
            claimRefs:
              - CI001
