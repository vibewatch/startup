    rows:
      - - 大型企业（500+ 名员工）
        - HR 副总裁 / 总监，或总回报 / 福利负责人
        - 全体员工及符合资格的家属
        - 雇主支付 100% 平台访问费；高级层级可由员工自愿共付
        - 正式 RFP、多供应商评估、HRIS 集成、法务与安全审查；6–18 个月
