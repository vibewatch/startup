        - 按员工每月计费的参与平台
        - $1–$3 PEPM
        - 微型健康活动、数字参与、团队挑战
        - 聚焦 SMB；不是 Wellhub 的直接企业级替代品
        - 为 SMB 细分的纯参与型健康设定价格底线，Wellhub 很少在该细分竞争
