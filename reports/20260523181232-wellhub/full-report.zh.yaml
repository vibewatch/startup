      - number: '7.3'
        title: 合作伙伴、依赖与网络风险
        blocks:
          - type: paragraph
            body: >
              Wellhub 运营一个双边市场，全球约有 100,000 个健康合作伙伴和 39,000 家企业雇主客户。January 2026 CADE 和解协议释放了约 3,500 家曾经排他的巴西健身房，使它们可同时与
              TotalPass、GuruPass 和其他聚合平台合作。Wellhub 按签到付款的模型使签到量成为合作伙伴付款的主要收入驱动；任何非排他健身房迁移到竞争平台，都会直接降低使用量，并削弱 Wellhub
              面向雇主的合作伙伴价值主张。Wellhub 报告 2025 全球签到 1 billion 次，合作伙伴付款 Q4 2025 较 Q4 2024 约增长 60%——随着巴西健身房排他性削弱，这些指标会承压。

              $600 million 的 Urban Sports Club 收购（September 9, 2025 关闭，已获 German Bundeskartellamt 和 Spanish CNMC 批准）加入约
              57,000 个欧洲健康合作伙伴，并把 Wellhub 覆盖扩至 18+ 个国家。不过，USC 目前仍作为独立实体运营。完整平台整合——将 Wellhub 技术栈、合作伙伴接入 APIs、计费基础设施和移动
              app 与 USC 欧洲系统打通——是一项跨多年执行挑战，还横跨数据保护、劳动和商法要求不同的多个司法辖区。USC 联合创始人保留领导岗位，提供本地专业知识，但美国主导的 Wellhub 与根植欧洲的 USC
              团队之间文化能否对齐，仍是未经检验的整合风险。

              云基础设施依赖显著。Wellhub 平台在全球 100,000+ 个地点处理签到事件；一旦主要云服务商宕机或 API
              失败，终端用户访问、合作伙伴出勤记录和按签到付款流会同时中断。公司信任中心确认使用第三方云基础设施，但没有公开披露主要供应商、多云故障切换策略或恢复时间目标。投资人集中度——SoftBank Vision
              Fund 和 EQT Growth 是主要股东——也带来治理风险：如果基金周期迫使潜在上市前发生二级出售或战略变化，治理会受压。
