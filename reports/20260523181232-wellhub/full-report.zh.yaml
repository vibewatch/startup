      - number: '6.5'
        title: 扩张动态与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Wellhub 在现有客户内的主要扩张杠杆，是先落地再扩张的 B2B2C 动态：签下雇主后，员工注册在多年内自然增长，不增加销售成本，却提高该合同下的可变订阅收入。Aflac 从上线时 15% 注册率提升到三年后
              45%，说明一个被充分采用的项目具备粘性。2025 Corporate Wellness Report（600+ 运营方、10 个国家）发现，89% 运营方报告企业来源会员留存更高，验证企业渠道对 Wellhub
              合作伙伴网络的耐久性。主要集中度风险来自地域（Brazil 估计约占 ARR 的 ~50%）和客群（企业客户是主要收入驱动，SMB 渗透不足）。CADE 在 Brazil 的 2022 反垄断裁决禁止与约
              3,500 家健身房合作伙伴签排他安排，使 Wellhub 最大单一市场面临持续监管风险。分析师评论指出，合作伙伴流失、价格敏感度以及依赖公司报告指标，都是持续的耐久性风险。Urban Sports Club 和
              Anytime Fitness 集成既是扩张机会，也是执行风险；Les Mills 合作（自 2022 起贡献 Les Mills 年订阅者增长的
