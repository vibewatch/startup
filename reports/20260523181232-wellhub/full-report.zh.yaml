      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: Track — 估值偏紧，但上行可选性有吸引力
            body: >
              Wellhub 的建议为 Track。公司有真实规模、可防守的全球合作伙伴网络和 B2B 合同粘性。但在当前 SaaS 重新定价环境里，若没有确认的单位经济性，13.2x ARR 倍数很难站住脚。若 Q3
              2026 财务数据显示毛利率 >= 50%、NRR >= 100%、ARR >= $380M，则上调至 Invest；若 CADE 取消排他性加速巴西收入下滑，或 USC 带来的增厚 ARR <10%，则下调至
              Pass。
            calloutType: recommendation
            claimRefs:
