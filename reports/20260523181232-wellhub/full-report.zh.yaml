            body: >-
              Wellhub 最扎实的具名客户证据来自 Aflac、Northwell Health、Heineken Brazil 和 SoFi 案例研究。美国保险公司 Aflac 在 2022 上线
              Wellhub，首日员工注册率达到 15%。到 2025，45% 的 Aflac 员工活跃使用平台，覆盖身体、心理、营养和情绪健康。Aflac 决定把 GLP-1 药物支出（1,000 名员工每年约 $25
              million）转向 Wellhub，反映出一个由高管层支持的福利战略迁移。Aflac Wellness and Safety 经理 Tricia Griggs
              表示：「我们想确认这个平台能支持我们。它做到了。」Northwell Health 是 New York State 最大私营雇主，拥有 85,000+ 名员工；其在 October 2023 公开确认
              Wellhub 合作。Chief People Officer Maxine Carrington 表示：「Wellhub
              是我们为团队提供便利、可负担、并能改善整体生活质量的身心健康选择时，做过的最佳决定之一。」自上线以来，Northwell 员工健身房出勤按月增长 11%，数字健康 app 使用增长 8%。Heineken
              Brazil（13,000+ 名员工）与 Wellhub 合作支持 HEINEKEN Cuida 心理健康项目，首个部署年度注册率达到 58%、入组率 22%，员工签到超过 21,000 次。SoFi（2,500
              名员工）订阅者增长 161%，近 30% 会员持有活跃套餐。本次审阅的任何一手来源都未确认 Google、AB InBev 和 Siemens 是 Wellhub 客户；若把它们纳入任何客户声明，需要一手验证。
