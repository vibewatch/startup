      - number: '5.3'
        title: 合作伙伴集成与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Wellhub 为 HR / 客户系统开放三条集成路径：REST API（实时 HTTPS）、SFTP 文件交换（批处理）和 SSO（用于员工认证的 Single Sign-On，文档仍在完善）。REST API
              支持 Single Entity 和 Multi Entity 客户的 Eligibility 管理；SFTP 支持最广的流程集合，包括 Payroll、Flexible Benefits 和
              Reporting。每类集成对应一组不同的可用流程：例如 Channel Partners 可通过 API 访问 Eligibility 和 Flexible Benefits，但不能使用 Payroll 或
              Reports 流程。

              在健身合作伙伴侧，Wellhub 提供用于课程排期的 Booking API、用于移动条码签到的 Access Control API，以及用于开发者接入的公开 Postman collection。超过 50
              个俱乐部管理系统（包括 ClubReady 和 Glofox）已直接集成，可支持无接触入馆和自动确认课程，进而触发合作伙伴付款。新合作伙伴接入通过 integrations.support@gympass.com
              邮件协调——规模扩大时，这一流程可能卡住速度。

              典型员工工作流从 HR 系统资格配置开始，随后在应用内选择套餐并支付订阅，再用 Wellhub 移动应用发现、预订并签到合作伙伴场馆。课程型场馆的预订是实时的；开放式健身房签到要求用户在 30–90
              分钟有效窗口内主动发起签到。签到确认后，合作伙伴获得付款。
