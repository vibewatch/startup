      - CI013
  - id: FI002
    title: 单位经济模型桥
    description: |
      Wellhub 的 B2B2C 模型如何把雇主员工数转化为单位经济模型——从雇主合同、员工采用到每订阅者利润率。所有节点显示定性区间；由于单位经济数据未披露，数值均为估算。
    type: flow
    layout: standard
    summary: |
      雇主员工数触发 PEPM 接入费收入，且不受采用率影响。员工自选决定订阅 ARPU。合作伙伴签到付款是可变 COGS。剩余价差加雇主费用贡献毛利率。NRR 推动现有账户的多年 LTV。
    data:
      nodes:
        - id: employer-headcount
          label: 雇主合格员工数
          role: Revenue base for PEPM
          detail: ~40,000 客户 × 平均合格员工数 = PEPM 收入底线；估算全球 14M 合格员工
        - id: pepm-fee
          label: PEPM 接入费
          role: Guaranteed minimum ARR component
          detail: $2–$5/合格员工/月；不受激活影响的固定费用；估算年化规模为 $100–200M
        - id: employee-activation
          label: 员工激活率
          role: Subscriber conversion from eligible pool
          detail: 估算 14M 合格员工中有 5M 订阅者 = ~36% 激活率；实际水平随雇主补贴大幅波动
        - id: subscription-arpu
          label: 订阅 ARPU
          role: Revenue per activated employee
          detail: 区间：$0（Digital）至 $344.99/month（Diamond）；混合 ARPU 未披露；估算 $5–$25/month
        - id: partner-payout
          label: 合作伙伴签到付款
          role: Variable COGS; largest cost driver
          detail: 向 100K+ 网络合作伙伴支付的单次签到费用；2025 同比增长 107%；单次签到费率未披露
        - id: gross-margin
          label: 毛利率
          role: Spread after partner payouts
          detail: PEPM 费用（接近 100% 毛利率）+ 订阅价差（25–50% 毛利率）；混合估算 40–60%
        - id: nrr-expansion
          label: 净收入留存（NRR）
          role: Multi-year LTV driver
          detail: 未披露；CFO 称 NRR 是首要增长 KPI；一流 SaaS NRR 为 120–130%
      edges:
        - from: employer-headcount
          to: pepm-fee
          label: $2–$5 PEPM × 合格人数
        - from: employer-headcount
          to: employee-activation
          label: 雇主补贴 / 强制
        - from: employee-activation
          to: subscription-arpu
          label: 员工自选层级
        - from: subscription-arpu
          to: partner-payout
          label: 签到活动驱动付款
        - from: subscription-arpu
          to: gross-margin
          label: 扣除付款后
        - from: pepm-fee
          to: gross-margin
          label: 接近 100% 透传
        - from: gross-margin
          to: nrr-expansion
          label: 账户内扩张
    sourceRefs:
      - SI003
      - SI004
      - SI005
      - SI009
    claimRefs:
      - CI007
      - CI012
