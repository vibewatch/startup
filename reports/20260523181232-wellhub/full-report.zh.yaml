    approximationNotes: >
      低 / 基准 / 高值由作者根据已发布分析师点估算构造分组，用来说明定义差异；它们不是回归得出的置信区间。每一行代表一个独立定义口径层级，不是围绕某个真实值的概率分布。Wellhub
