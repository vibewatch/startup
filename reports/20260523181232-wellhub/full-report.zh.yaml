      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >
              企业健康福利平台采购在结构上是 B2B 购买决策，却产生 B2C 使用结果。主要买方是雇主组织内的 HR
              或福利职能，同时扮演付款方、守门人和项目设计者。最终用户是员工，在雇主提供的福利内自主选择健康服务；在多数市场，雇主承担 50–100% 的平台访问费，员工可选择为高端计划层级支付补贴后的共同出资。

              雇主规模分为三档。大型企业（500+ 名员工）在 2025 年占全球企业健康福利市场收入的 53.21%，也最愿意为接入 HRIS 系统的整体型、多供应商平台付费。中型雇主（100–499 名员工）以 6.4%
              CAGR 增长，吸引力来自 SaaS 经济性：无需自建专有项目。SMB（100 名以下员工）是增长最快的数字化细分，CAGR 达 16.44%，但当前渗透率最低；美国 Department of Labor
              数据确认了明显采用缺口：500+ 员工企业中 76% 的员工可使用健康福利计划，而 50 人及以下企业仅 23%。

              不同细分的采用触发因素不同。企业采购由医疗成本控制、人才留存对标、ESG/DEI 披露要求，以及包括 HRIS 集成在内的 HR
              技术现代化推动。中型企业采用则由福利经纪推荐，以及对标更大雇主的同业竞争压力推动。SMB 进入越来越多由 EU 心理社会风险评估监管要求、PEO
              聚合器市场套装，以及员工满意度担忧触发。典型采购周期方面，中型市场为 2–6 个月，企业为 6–18 个月；年度或多年合同形成有意义的切换成本，使 Wellhub 等已部署平台受益。
