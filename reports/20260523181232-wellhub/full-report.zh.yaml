figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Wellhub 从 2012 创立到 March 2026 的关键里程碑，包括融资事件、产品转向、监管行动和规模成就。
    data:
      items:
        - label: 以 Gympass 创立
          date: 2012-01
          detail: Cesar Carvalho、Vinícius Ferriani、João Thayro 在巴西 São Paulo 联合创立，最初是 B2C 健身房日票服务
          tone: positive
        - label: B2B 转向与拉美扩张
          date: 2016-01
          detail: PricewaterhouseCoopers Brazil 客户提出需求后，转向雇主赞助模式；扩张至拉美并进入欧洲
          tone: positive
        - label: 总部迁至 New York；美国启动
          date: 2018-01
          detail: 总部从 São Paulo 迁至 New York City；开始进入美国主要都市圈
          tone: positive
        - label: Series D 轮 — SoftBank 投资 $300M
          date: 2019-06
          detail: $300M 由 SoftBank Vision Fund 领投；14 个国家、约 47,000 家健身房合作伙伴、2,000+ 企业客户
          tone: positive
        - label: COVID-19 数字化转向
          date: 2020-06
          detail: 封控期间，为维持参与度，迅速扩展到数字健康福利、心理健康 app 和虚拟训练
          tone: neutral
        - label: Series E 轮 — $220M；$2.2B 独角兽估值
          date: 2021-06
          detail: $220M Series E 轮由 SoftBank 领投；估值翻倍至 $2.2B；全球合作伙伴 50,000+
          tone: positive
        - label: 收购 Trainiac
          date: 2021-12
          detail: 收购 Seattle 在线私人训练初创公司 Trainiac；条款未披露
          tone: positive
        - label: CADE TCC 和解（巴西）
          date: 2022-12
          detail: 与巴西 CADE 签署停止令，健身房排他合同限制在区域网络 ≤20%
          tone: negative
        - label: Series F 轮 — $85M，估值 $2.4B
          date: 2023-08
          detail: $85M Series F 轮由 EQT Growth 领投；创纪录年份：15,000 客户、2M+ 订阅者
          tone: positive
        - label: 更名为 Wellhub；释放 IPO 信号
          date: 2024-04
          detail: Gympass 正式更名为 Wellhub；5 个健康福利品类；CEO 释放 IPO 准备信号但未给时间表
          tone: positive
        - label: CADE 因违反 TCC 罚款 R$3M
          date: 2024-12
          detail: CADE 因持续排他违规对 Wellhub 罚款 R$3M（~$600K USD）；调查重启
          tone: negative
        - label: 后期轮 — $149M，估值 $4.2B（未确认）
          date: 2024-12
          detail: 二级市场数据指向一轮 $149M 融资、估值 $4.2B；未找到官方新闻稿
          tone: neutral
        - label: CADE 宣告排他合同无效
          date: 2025-03
          detail: 自 2022 以来所有 Wellhub 健身房排他合同被宣告无效（约 3,500 家健身房）；未来禁止排他
          tone: negative
        - label: 以 $600M 收购 Urban Sports Club
          date: 2025-09
