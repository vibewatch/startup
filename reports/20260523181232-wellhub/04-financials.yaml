figures:
  - id: FI001
    title: Revenue model bridge
    description: >
      How Wellhub converts corporate client activity into revenue and gross profit. The waterfall
      shows the employer PEPM layer (predictable base), employee subscription contribution (adoption-driven),
      less estimated partner check-in payouts (variable COGS), yielding estimated gross profit.
      All figures are estimates; actuals are undisclosed.
    type: waterfall
    data:
      items:
        - {label: "Employer PEPM access fees (est.)", value: 150, approximationNote: "Estimated: 40K clients × avg 350 eligible employees × $3/PEPM × 12 months; rounded"}
        - {label: "Employee subscription revenue (est.)", value: 169, approximationNote: "Estimated residual: $319M total ARR less $150M employer PEPM component"}
        - {label: "Less: Partner check-in payouts (est. COGS)", value: -145, approximationNote: "Estimated at 45-55% of employee subscription revenue; wide uncertainty range"}
        - {label: "Gross profit estimate (mid-case)", value: 174, approximationNote: "Resulting gross margin ~55% of net; extremely uncertain; no disclosed actuals"}
        - {label: "Less: Operating expenses (est.)", value: -280, approximationNote: "Estimated S&M + R&D + G&A; ~2K employees plus tech and expansion costs"}
        - {label: "Estimated EBITDA (mid-case)", value: -106, approximationNote: "Deeply negative operating cash flow estimated; company has not disclosed"}
    sourceRefs:
      - SI004
      - SI005
    claimRefs:
      - CI012
      - CI013

  - id: FI002
    title: Unit economics bridge
    description: >
      How Wellhub's B2B2C model converts employer headcount into unit economics — from employer contract
      through employee adoption to the per-subscriber margin. All nodes show qualitative ranges;
      numeric values are estimates due to undisclosed unit economics.
    type: flow
    layout: standard
    summary: >
      Employer headcount triggers PEPM access fee revenue independent of adoption. Employee self-selection
      determines subscription ARPU. Partner check-in payout is the variable COGS. Remaining spread plus
      employer fee contributes to gross margin. NRR drives multi-year LTV from existing accounts.
    data:
      nodes:
        - id: "employer-headcount"
          label: "Employer Eligible Headcount"
          role: "Revenue base for PEPM"
          detail: "~40,000 clients × avg eligible employees = PEPM revenue floor; est. 14M eligible employees globally"
        - id: "pepm-fee"
          label: "PEPM Access Fee"
          role: "Guaranteed minimum ARR component"
          detail: "$2–$5/eligible employee/month; fixed regardless of activation; estimated $100–200M annual run rate"
        - id: "employee-activation"
          label: "Employee Activation Rate"
          role: "Subscriber conversion from eligible pool"
          detail: "5M subscribers from est. 14M eligible = ~36% activation; actual varies widely by employer subsidy"
        - id: "subscription-arpu"
          label: "Subscription ARPU"
          role: "Revenue per activated employee"
          detail: "Range: $0 (Digital) to $344.99/month (Diamond); blended ARPU undisclosed; est. $5–$25/month"
        - id: "partner-payout"
          label: "Partner Check-in Payout"
          role: "Variable COGS; largest cost driver"
          detail: "Per-check-in fee paid to 100K+ network partners; grew 107% YoY in 2025; per-check-in rate undisclosed"
        - id: "gross-margin"
          label: "Gross Margin"
          role: "Spread after partner payouts"
          detail: "PEPM fee (near 100% gross margin) + subscription spread (25–50% gross margin); blended est. 40–60%"
        - id: "nrr-expansion"
          label: "Net Revenue Retention (NRR)"
          role: "Multi-year LTV driver"
          detail: "Not disclosed; CFO states NRR is the primary growth KPI; best-in-class SaaS NRR is 120–130%"
      edges:
        - from: "employer-headcount"
          to: "pepm-fee"
          label: "$2–$5 PEPM × eligible count"
        - from: "employer-headcount"
          to: "employee-activation"
          label: "employer subsidizes/mandates"
        - from: "employee-activation"
          to: "subscription-arpu"
          label: "employee self-selects tier"
        - from: "subscription-arpu"
          to: "partner-payout"
          label: "check-in activity drives payouts"
        - from: "subscription-arpu"
          to: "gross-margin"
          label: "net of payout"
        - from: "pepm-fee"
          to: "gross-margin"
          label: "near 100% pass-through"
        - from: "gross-margin"
          to: "nrr-expansion"
          label: "expansion within accounts"
    sourceRefs:
      - SI003
      - SI004
      - SI005
      - SI009
    claimRefs:
      - CI007
      - CI012

  - id: FI003
    title: Financial estimate range
    description: >
      Revenue, margin, burn, runway, and valuation-input ranges for Wellhub — sourced from public disclosures
      where available and estimated with explicit approximation notes where not. All ranges are wide due to
      private-company opacity.
    type: range
    data:
      items:
        - {label: "FY2025 estimated revenue ($M)", low: 350, mid: 420, high: 550, approximationNote: "Low: Sep 2025 ARR $319M annualized flat; Mid: Sep 2025 ARR + modest H2 growth; High: includes partial Urban Sports Club integration revenue"}
        - {label: "Estimated gross margin (%)", low: 25, mid: 40, high: 55, approximationNote: "Low: heavy check-in utilization dilutes margins; Mid: industry benchmark for wellness marketplace; High: digital vertical (therapy/mindfulness) runs at near-SaaS margins"}
        - {label: "Estimated annual operating loss (absolute, $M)", low: 60, mid: 150, high: 320, approximationNote: "Low: approaching break-even at higher margin / lower burn scenario; High: aggressive S&M + Urban Sports Club integration costs; no public disclosure. Shown as absolute values; actual EBITDA is negative."}
        - {label: "Estimated monthly burn ($M)", low: 15, mid: 22, high: 30, approximationNote: "Derived from ~2,000 employees at $80–120K all-in plus operating overhead; no public disclosure"}
        - {label: "Estimated runway from May 2026 (months)", low: 6, mid: 15, high: 30, approximationNote: "Highly uncertain; depends on post-acquisition cash retained and whether acquisition was debt-financed"}
        - {label: "Revenue multiple at $4.2B valuation (×)", low: 7.6, mid: 10.0, high: 12.0, approximationNote: "At FY2025 revenue range $350–$550M; $4.2B valuation is secondary market estimate, not confirmed"}
    sourceRefs:
