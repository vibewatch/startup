  - id: unit-economics-and-cost-structure
    title: Cost Structure, Margins, and Unit Economics
    body: >
      Wellhub's cost structure is fundamentally shaped by its marketplace architecture. Unlike a pure SaaS company
      where gross margins typically exceed 70%, Wellhub's largest COGS item is partner check-in payouts —
      a variable cost that scales directly with employee utilization. When more employees check in to more gyms and
      studios, partner payouts grow, compressing gross margins if revenue per check-in does not increase
      proportionally. The 107% global payout growth in 2025 is the highest public proxy available for this variable
      cost base.


      No gross margin, EBITDA, or operating loss figure has been publicly disclosed. Industry-level benchmarks
      suggest that fitness marketplace models (aggregating network partners and charging a spread) typically achieve
      gross margins of 25–50%, with higher margins possible as the digital component (therapy apps, mindfulness
      platforms, nutrition content) requires no per-check-in payout and runs at near-zero variable cost. CFO Bruno
      Annicq's public framing emphasizes NRR as the key SaaS metric — suggesting the internal model targets
      expansion revenue from existing clients rather than CAC-driven new logo acquisition as the primary growth
      lever. However, no NRR figure has been publicly disclosed.


      Employer-side CAC is difficult to estimate without disclosure of S&M spend. With ~2,000 employees and a sales
      force that targets HR/benefits leaders at companies ranging from 50 to 50,000 employees, the enterprise sales
      cycle likely ranges from 1–3 months for SMBs to 6–18 months for large enterprises. CAC payback period is
      unknown; industry comps for B2B wellness platforms suggest 12–24 month payback periods. The US market is
      being called out by CEO Carvalho as the primary growth driver for 2026, suggesting increased S&M investment
      there that will increase short-term blended CAC.


      Working capital dynamics: the employer PEPM is likely invoiced annually in advance, creating favorable working
      capital for the employer side. Employee subscriptions are monthly. Partner payouts are disbursed based on
      check-in events, likely monthly in arrears. This structure means Wellhub receives cash before it owes
      partners, providing a positive working-capital cycle on the employer contract side. The FIDC fund (R$100M)
      uses future partner receivables as collateral — suggesting Wellhub has sufficient forward-looking check-in
      cash flows to support external financing for partners, though it also creates a contractual obligation to
      honor check-in receivables used as collateral.


      Fixed cost base: with approximately 2,000 employees globally, blended all-in employee cost (salaries, benefits,
      equity) likely runs $80–120M annually. Adding technology infrastructure, office costs, and G&A overhead, total
      fixed costs before S&M and R&D are estimated at $100–150M/year. Adding enterprise sales force and product R&D,
      total annual operating expense (ex-COGS) is estimated at $200–350M — consistent with a company burning cash
      and dependent on continued equity financing.
