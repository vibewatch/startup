  - id: financial-verdict-and-gaps
    title: Financial Verdict and Diligence Blockers
    body: >
      Wellhub demonstrates strong top-line growth signals: $319M ARR (Sep 2025), 107% partner payout growth,
      40,000 corporate clients, 5M+ employee subscribers, and an implied ARR-to-valuation multiple of approximately
      13× at the $4.2B valuation. The B2B SaaS-like revenue model (employer PEPM + annual contracts) generates
      predictable recurring cash and is fundamentally differentiated from a pure consumer fitness subscription.
      CFO Annicq's emphasis on NRR as the primary growth lever — rather than gross logo adds — suggests the
      internal model relies on expansion within existing accounts, a value-creation pattern characteristic of
      best-in-class enterprise SaaS platforms.


      Material adverse factors temper this picture. First, margin opacity: the absence of any disclosed gross
      margin or EBITDA means the $319M ARR could coexist with deeply negative unit economics if partner payouts
      consume a large share of revenue. The 107% payout growth substantially outpaces any plausible ARR growth
      rate from the $319M Sep 2025 run rate, suggesting payout-to-revenue leverage is intensifying. Second, the
      CADE exclusivity ruling (March 2025) invalidated ~3,500 exclusive gym partner contracts in Brazil — directly
      weakening the network defensibility and competitive pricing power in Wellhub's historically largest revenue
      market. The long-term impact on Brazil retention economics is a diligence ask. Third, the $600M acquisition
      creates integration risk and capital dependency: two separate operating platforms (Wellhub core + Urban
      Sports Club European platform) must be integrated while continuing to burn cash. Fourth, the IPO pathway
      — flagged by Carvalho as the next liquidity event — is not imminent and not funded by any disclosed equity
      commitment, creating investor-exit timing risk.


      Until audited financials, NRR, gross margin, and cash-flow disclosure are available under NDA, the revenue
      quality and path to profitability remain unverifiable. This represents a blocking-level evidence gap for
      any underwriting decision. The estimates in this chapter are directional and should not be used for
      valuation modeling without corroboration from management-provided financial data.
    claimRefs:
      - CI026
      - CI027
      - CI028
      - CI029
      - CI030
