        - "Blocking — determines whether the model is economically viable at scale"
        - "Industry benchmark (25–50% for marketplace models); no Wellhub-specific data"
        - "Request income statement with COGS line showing partner check-in payouts separately"
      - - "Net Revenue Retention (NRR)"
