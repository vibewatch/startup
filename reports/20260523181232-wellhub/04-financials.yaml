        - "Material — determines capital adequacy and path to profitability timeline"
        - "None — no EBITDA has been disclosed; loss-making status is assumed but unconfirmed"
        - "Request quarterly EBITDA bridge and free cash flow statement for last 8 quarters"
      - - "Cash on hand and burn rate"
        - "Blocking — post-acquisition capital position is unknown; determines near-term financing risk"
        - "None — no cash balance or burn figure has been disclosed post-Series F"
        - "Request monthly bank statements or auditor-certified cash balance as of latest available date"
      - - "Urban Sports Club pre-acquisition revenue and margin"
        - "Material — $600M acquisition is unanchored without target financials"
        - "None — Urban Sports Club is private with no disclosed financials"
        - "Request Urban Sports Club standalone P&L for last 3 fiscal years as part of acquisition diligence package"
      - - "Brazil revenue trend post-CADE ruling (2025)"
        - "Material — CADE invalidated ~3,500 exclusive contracts in Brazil in Mar 2025; impact on Brazil revenue unknown"
        - "Indirect: TotalPass user growth 99% vs. Wellhub 24% in Brazil (2026) signals share shift"
