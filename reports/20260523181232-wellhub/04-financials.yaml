  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: gross-margin-ebitda
      missingEvidence: >
        Audited or unaudited gross margin, EBITDA, and free cash flow statements for Wellhub for FY2024 and FY2025.
        The company has not disclosed any of these figures publicly.
      whyItMatters: >
        Without gross margin, the $319M ARR is uninterpretable for underwriting purposes — a 25% gross margin implies
        very different economics from a 60% gross margin. The entire unit economics analysis rests on this unknown.
      diligencePath: >
        Request audited or management-prepared P&L for FY2024 and FY2025 under NDA; require Big Four or equivalent
        audit sign-off before closing any investment decision.
      relatedQuestionRefs: [QI006, QI007, QI009]
      relatedTableRefs: [TI003, TI005]

    - type: private-evidence-only
      severity: blocking
      topic: cash-burn-runway
      missingEvidence: >
        Cash on hand as of latest available date (ideally Q1 2026), monthly burn rate for the last 12 months,
        and acquisition financing structure (equity vs. debt vs. hybrid) for the $600M Urban Sports Club acquisition.
      whyItMatters: >
        The acquisition consumed a large portion of historical equity raises; without knowing the acquisition
        financing mechanism, the post-acquisition runway is unknowable and could be as short as 6 months or as long
        as 30+ months.
      diligencePath: >
        Request: (1) certified bank balance as of March 2026, (2) monthly cash flow for 12 months ending March 2026,
        (3) acquisition debt schedule / bridge loan documentation, and (4) any off-balance-sheet financing obligations.
      relatedQuestionRefs: [QI014, QI015, QI016, QI026]
      relatedTableRefs: [TI004, TI005]

    - type: private-evidence-only
      severity: blocking
      topic: nrr-churn
      missingEvidence: >
        Net revenue retention (NRR) by cohort year and geography; gross employer logo churn rate; Brazil-specific
        NRR since the CADE exclusivity ruling (March 2025).
      whyItMatters: >
        CFO Annicq calls NRR the primary growth KPI; without the actual figure, it is impossible to verify whether
        the 40,000-client headline represents a compounding asset or a treadmill that requires continuous new logo
        acquisition to offset churn.
      diligencePath: >
        Require trailing-12-month NRR and gross logo churn segmented by enterprise (500+ employees), SMB (<500
        employees), US, Brazil, and Europe; request Brazil cohort data specifically for the 12 months post CADE ruling.
      relatedQuestionRefs: [QI008, QI012, QI020]
      relatedTableRefs: [TI003, TI005]

    - type: private-evidence-only
      severity: material
      topic: urban-sports-club-financials
      missingEvidence: >
        Urban Sports Club standalone revenue, gross margin, EBITDA, and client/subscriber count for FY2023 and FY2024
        prior to acquisition; post-acquisition integration financial model.
      whyItMatters: >
        The $600M acquisition price is unanchored without target financials; a low-margin or loss-making Urban Sports
        Club would compound Wellhub's financial pressure, while a profitable European platform would improve blended economics.
      diligencePath: >
        Request Urban Sports Club audited financials for FY2023 and FY2024 as part of acquisition diligence package;
        request integration financial model with synergy assumptions.
      relatedQuestionRefs: [QI024, QI015]
      relatedTableRefs: [TI004, TI005]

    - type: private-evidence-only
      severity: material
      topic: brazil-revenue-post-cade
      missingEvidence: >
        Brazil-specific ARR, client count, NRR, and partner count for Q1–Q4 2025 and Q1 2026, following the March 2025
        CADE ruling that invalidated ~3,500 exclusive gym contracts.
      whyItMatters: >
        Brazil is historically Wellhub's largest single-country revenue market; the CADE ruling materially weakened
        its competitive exclusivity moat. TotalPass's 99% user growth in the same market suggests share erosion is
        accelerating, which could pressure Brazil ARR and overall NRR.
      diligencePath: >
        Request quarterly Brazil ARR and client metrics for 2025; ask for Wellhub's assessment of post-CADE partner
        re-contracting rates and any pricing concessions made to retain exclusive relationships.
      relatedQuestionRefs: [QI020, QI019]
      relatedTableRefs: [TI003, TI005]

