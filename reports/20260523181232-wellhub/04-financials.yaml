  - id: pricing-and-monetization
    title: Pricing Architecture and Monetization
    body: >
      Wellhub's pricing operates on two separate but linked layers: the employer side (B2B contract) and the
      employee side (consumer-facing plan tiers). On the employer side, publicly available plan documents from
      employer benefits portals confirm a PEPM access fee of $2–$5 per eligible employee per month, charged
      regardless of employee activation. This creates a guaranteed minimum revenue floor per employer contract that
      scales with the employer's total eligible headcount — not the number of employees who enroll. For a 500-person
      company at the midpoint ($3.50 PEPM), the minimum employer contract value is $21,000/year. For a 5,000-person
      enterprise, it is $210,000/year. Custom enterprise pricing likely applies above certain headcount thresholds
      and for multi-country deals.


      On the employee side, ten documented tiers span the gap from free (Digital: digital apps and on-demand
      content only) to premium (Diamond: up to $344.99/month). Intermediate tiers include Starter ($11.99–$24.99),
      Basic ($32.99–$37.99), Bronze ($54.99–$64.99), Silver ($94.99–$109.99), Titanium ($134.99–$139.99), Gold
      ($189.99–$214.99), and Platinum ($259.99–$289.99). Employee-facing prices can be further subsidized by the
      employer — many employers cover the full cost of Starter or Bronze tiers. The average revenue per subscriber
      (ARPU) depends heavily on tier mix and employer subsidy levels, neither of which is publicly disclosed.


      Realized pricing almost certainly diverges from list pricing for large enterprise deals. Wellhub has not
      disclosed any volume discounts, contractual rate schedules, or realized pricing versus list pricing for
      enterprise contracts. The employer PEPM of $2–$5 is sourced from publicly distributed benefits administration
      flyers rather than from Wellhub's official enterprise pricing terms. Both the employer and employee layers
      together produce Wellhub's blended ARPU — which, at the $319M ARR level across approximately 40,000 corporate
      clients (March 2026), implies a rough average annual contract value per employer of approximately $7,975
      (a rough estimate that assumes linear client growth through Sep 2025 and that all ARR derives from client
      contracts). Segmenting this by enterprise vs. SMB or by geography is not possible from public sources.
    claimRefs:
      - CI007
      - CI008
      - CI009
      - CI010
