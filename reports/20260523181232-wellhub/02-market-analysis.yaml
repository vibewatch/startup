chapter:
  number: 2
  title: Market Analysis
  summary: >
    The global corporate wellness market is estimated at $66–82 billion in 2026 across six analyst sources,
    growing at 6–9% CAGR toward $95–115 billion by 2030–2031, driven by employer healthcare cost inflation,
    mental health normalization, and post-pandemic digital benefit adoption. Wellhub's serviceable addressable
    market spans North America (~$28–33B), Europe (~$20B+), and Latin America (~$4.5B) — territories that
    collectively account for the majority of global spend. The digital employee wellbeing platform subsegment
    where Wellhub most directly competes is $2.13 billion in 2026, growing at 13% CAGR. Key structural
    headwinds include chronically low program participation rates (20–30%), a February 2026 MIT Sloan evidence
    review contradicting widely-cited ROI claims, Brazil's CADE antitrust exclusivity prohibition, and
    privacy/data constraints limiting health personalization.

sections:
  - id: market-boundary-and-definition
    title: Market Boundary and Definition
    body: >
      The corporate wellness market encompasses all employer-sponsored programs, services, and platforms designed
      to improve employee health, productivity, and well-being. Five core verticals define the market: physical
      fitness and gym access; mental health, stress management, and employee assistance programs (EAPs); nutrition
      and weight management; health risk assessments (HRAs) and biometric screenings; and smoking and substance
      cessation programs. Adjacent and fast-growing verticals increasingly absorbed into the market boundary include
      financial wellness, sleep programs, and digital coaching. Excluded from the corporate wellness market boundary
      are employer-paid group health insurance premiums (classified separately as group health benefits), individual
      consumer gym memberships not employer-subsidized, and clinical treatments billed through health insurance.

      Wellhub occupies the "corporate wellness platform" subsegment — a digitally delivered, multi-vendor marketplace
      aggregating gym access, mental health apps, nutrition services, and sleep programs into a single employer-contracted
      benefit. The status-quo substitutes that multi-vendor platforms displace include direct corporate gym memberships
      tied to a single facility operator, employer-owned on-site fitness centers, FSA/HSA-based individual reimbursement
      schemes, and point-solution EAPs sold through insurance carriers. Each substitute lacks the cross-vertical scope,
      network flexibility, and digital utilization measurability that aggregated platforms provide.

      Three regional markets are directly relevant to Wellhub's strategy: North America (approximately 37–40% of global
      corporate wellness spend, led by the United States), Europe (approximately 39.5% of global spend per IMARC Group
      2025, led by Germany and the UK), and Latin America (approximately 6% of global spend, led by Brazil, Wellhub's
      founding market). Asia-Pacific is the fastest-growing regional market globally but is not a current Wellhub
      operating geography as of May 2026.
