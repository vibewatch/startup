callouts:
  - calloutType: insight
    title: TAM Definition Drives a 2–3× Range — Use Narrow Scope for Wellhub
    body: >
      The $66–95 billion spread in 2026 corporate wellness TAM estimates is primarily a definitional disagreement,
      not a forecasting disagreement. The narrow definition (programs and platforms, ~$70B) is the defensible base
      case for Wellhub's addressable universe; the MarketsAndMarkets $94.6B figure absorbs carrier-bundled EAP spend
      and virtual care supplements that Wellhub's platform model cannot access. Investors should apply the $2.13B
      digital wellbeing platform figure as the tightest SaaS-comparable SAM, and triangulate upward using the broader
      B2B platform-mediated fitness and wellness spend in Wellhub's 18 operating countries.
    claimRefs:
      - CM007
      - CM011
      - CM015

  - calloutType: risk
    title: Participation Rate Gap Is the Largest Structural Market Constraint
    body: >
      Only 20–30% of eligible employees globally engage with wellness programs regularly, and Gartner data shows
      only one quarter of employees with mental/emotional wellbeing access actually use it. A February 2026 MIT
      Sloan evidence review confirms that rigorous health outcome evidence "remains surprisingly limited and often
      contradicts widely cited claims." For Wellhub, low participation limits per-employer check-in volume, weakens
      the ROI story for contract renewal, and constrains upsell into premium tiers. Any market slowdown in wellness
      procurement would disproportionately affect premium multi-vertical platforms.
    claimRefs:
      - CM035
      - CM036
      - CM037

