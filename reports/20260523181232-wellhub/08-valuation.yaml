- id: TV005
  title: Thesis-Break and Watch Triggers
  description: 'Specific observable events or disclosures that would require upgrading, downgrading, or exiting a position
    in Wellhub relative to the current Track recommendation.

    '
  type: standard
  notes: 'Thresholds are analytical and judgment-based. They represent illustrative tripwires, not precise contractual triggers.
    Monitoring cadence: quarterly on ARR and NRR; event-driven on regulatory, M&A, and leadership items.

    '
  columns:
  - Trigger Category
  - Event / Threshold
  - Signal Direction
  - Recommended Action
  rows:
  - - Unit economics disclosure
    - Gross margin confirmed >= 50% AND NRR >= 100% in same employer cohort
    - Bullish
    - Upgrade to Consider Invest; remove unit economics gap flag
  - - ARR growth deceleration
    - Post-USC combined ARR <$380M reported for FY2026, implying <20% YoY growth
    - Bearish
    - Downgrade to Pass; integration failure scenario gains probability
  - - Down round / primary financing
    - New primary round priced <$4.0B post-money
    - Bearish
    - Immediate pass; multiple compression confirmed by board + lead investors
  - - IPO filing or registration
    - Wellhub files S-1 or equivalent with GAAP financials disclosed
    - Neutral-to-Bullish
    - Re-rate on confirmed margin and NRR; re-run valuation model with public comps
  - - CADE regulatory escalation
    - CADE imposes Brazil revenue-sharing mandate or client migration requirement
    - Bearish
    - Model 15-25% Brazil ARR haircut; reduce base-case valuation by $300-500M
  - - Leadership departure
    - CEO César Carvalho or CFO departs without planned succession
    - Bearish
    - Elevated risk flag; pause investment discussion pending successor assessment
