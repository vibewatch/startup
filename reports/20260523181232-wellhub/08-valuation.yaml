  description: 'Prioritized list of information requests that would most materially resolve uncertainty in the Wellhub valuation
    and recommendation.

    '
  type: standard
  notes: 'This is an indicative rather than exhaustive list. Priority is ordered from most impactful to valuation certainty
    (1) to secondary supporting context (6). Items 1-3 are gating conditions for upgrading the recommendation.

