- id: scenario-analysis
  title: Scenario Analysis and Exit Pathways
  body: 'Three scenarios frame the probability-weighted valuation envelope. The base case ($3-4.5B) assumes Wellhub successfully
    integrates Urban Sports Club to reach $420-450M combined ARR by end of 2026, sustains employer client growth at 10-15%,
    and exits via strategic acquisition or IPO at 8-10x ARR in 2028-2029. This scenario is consistent with EGYM-parity multiples
    and with current secondary-market pricing. It does not require any re-rating of private market multiples; it requires
    execution.

    The bull case ($5-7B) rests on the US market becoming Wellhub''s largest by 2027, combined ARR reaching $550-600M with
    AI Coach ARPU premium driving margin expansion, and an IPO at 10-12x forward ARR capturing the category leadership narrative
    alongside EGYM/Playlist. The bull case is plausible but requires flawless integration, US acceleration well beyond the
    current trajectory, and a macro environment that tolerates premium multiples for profitable growth-stage companies.

    The bear case ($2-3B) follows a scenario in which USC integration consumes 18-24 months of management bandwidth and fails
    to deliver accretive ARR, Brazilian revenue declines accelerate as CADE exclusivity removal opens the market to domestic
    competitors, and SaaS multiple compression from the SaaSpocalypse (PitchBook Q1 2026: median down from 4.9x to 3.3x YoY)
    continues. Under these conditions, a primary round at sub-$4.2B pricing is plausible, and pre-IPO secondary ask holders
    would face mark-to-market losses.

    Exit pathway analysis reinforces the base-case framework. An IPO is explicitly not imminent per CEO statements. The most
    actionable exit is a strategic acquisition—Wellhub could be an attractive bolt-on for a global HR platform (SAP, Workday,
    ADP) seeking a pre-built multi-country wellness network, or a PE roll-up targeting the corporate wellness consolidation
    play. At base-case pricing, the strategic acquirer logic works at $3.5-4.5B; at bull-case pricing, only a major platform
    buyer with synergistic cost savings can close the math.

    '
