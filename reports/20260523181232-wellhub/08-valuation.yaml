  letter: V
  title: Valuation
  summary: 'Wellhub''s last confirmed valuation is $4.2B (Dec 2024, secondary market), implying ~13.2x EV/ARR on $319M ARR
    (Sep 2025). Recommendation: Track (confidence: medium; risk: high; valuation stance: stretched). Wellhub''s $4.2B secondary-market
    valuation implies a ~13x EV/ARR multiple on $319M ARR (Sep 2025), far above the 1.2-1.3x range of comparable public companies
    and well above the 4-7x median for private non-AI SaaS. Against the most relevant private peer—the EGYM/Playlist combined
    entity at ~9.4x revenue—Wellhub still trades at a meaningful premium. The platform''s global scale (100K+ partners, 40K
    employer clients, 18 countries) and capital efficiency (4.84x ARR/capital) are genuine strengths, but the valuation rests
    entirely on undisclosed financials: gross margin, NRR, and burn rate have not been confirmed. The USC acquisition ($600M,
    Sep 2025) meaningfully expands European scale but introduces integration execution risk. In the base case ($3-4.5B), the
    current mark is achievable; in a stress scenario with multiple compression and integration drag ($2-3B), a down round
    is plausible. Track until gross margin >50%, NRR >100%, and post-USC ARR are confirmed.

    '
