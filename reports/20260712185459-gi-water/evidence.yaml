evidenceGaps:
  - type: missing-source
    severity: material
    topic: legal-name
    missingEvidence: Exact GI Water as a Service legal entity name, incorporation date, and Saudi registration details.
    whyItMatters: >-
      Those fields are needed to underwrite contracting entity risk, ownership structure, and refresh accuracy across
      future filings.
    diligencePath: Request Saudi commercial registration, articles of association, and a current cap table from management.
    relatedQuestionRefs:
      - QO007
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, customer count, headcount, and current run-rate metrics for GI WaaS.
    whyItMatters: >-
      Without basic operating metrics, the unicorn headline cannot be reconciled to scale, margin quality, or execution
      efficiency.
    diligencePath: Request FY2024-FY2026 management accounts, customer deployment count, and current headcount by function.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: round-terms
    missingEvidence: Exact Series A check size, security type, liquidation preference, and governance rights.
    whyItMatters: >-
      These terms materially affect whether the post-money valuation is a clean price signal or a structured financing
      artifact.
    diligencePath: Request the signed term sheet or closing memorandum for the February 2025 Series A round.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: access-blocked
    severity: minor
    topic: database-cross-check
    missingEvidence: Third-party database confirmation from Crunchbase and other gated profiles.
