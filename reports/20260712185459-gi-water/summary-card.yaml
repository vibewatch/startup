  topStrengths:
    - Saudi water scarcity and policy support create a real budget pool for decentralized wastewater reuse solutions.
    - >-
      Public project references across Riyadh, Jeddah, Diriyah, Hajj-related use cases, Bahrain, and France export plans
      provide more operating proof than a pure concept company.
