    {
      "id": "final-diligence-and-kill-triggers",
      "title": "The next decision should hinge on documents and milestones, not on broader market enthusiasm",
      "body": "The most important next step is not another market-size debate. It is document collection. Investors need audited financials, concentration data, customer terms, permit and compliance evidence, and the actual round documents behind the unicorn label. Those materials would directly answer the questions that public sources cannot resolve. Until then, exit readiness should be considered limited and the price should be treated as provisional. The main thesis-break trigger is straightforward: if flagship proof does not translate into repeatable revenue, diversified accounts, and financeable growth, the equity case weakens quickly. Conversely, if the company can open the books, show healthy site economics, and support follow-on rounds from a position of strength, the current headline price becomes easier to revisit. Today, though, valuation should follow evidence rather than aspiration. Without that discipline, investors risk paying for optionality as if it were already operating performance. The next diligence package should decide price, not momentum or narrative.",
