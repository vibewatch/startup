            - 低 Capex 客户方案
        - label: 部署资产
          detail: 用不同实体设备形态匹配场地约束和合同期限。
          items:
            - 便携式处理站
            - 移动式单元
            - 产能升级
            - 新一代处理站
        - label: 核心工艺
          detail: 处理层以非生物 G-NANO 工艺为核心，装在紧凑式或集装箱化设备里。
