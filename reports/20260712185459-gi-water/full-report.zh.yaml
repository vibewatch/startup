              成立，如果本地制造改善交付经济性，公司就可能建立具备战略价值的经常性基础设施服务收入。下行逻辑也清楚。Capex 和 营运资本需求可能保持高位，融资需求可能比简单项目成功叙事暗示的时间更长，GI
              瞄准的市场采购也可能持续缓慢。由于公开 记录没有经审计财务，本章无法判定争议，只能缩小争议。正确结论是，GI 的收入模式可信，且战略上对齐真实问题，但盈利质量、 利润率路径和 runway
