  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、足迹，以及 GI WaaS 到底是什么
        blocks:
          - type: paragraph
            body: >-
              解读 GI Water as a Service，先要把它看成围绕德国母公司技术平台落地的沙特运营公司，而不是 只有愿景网站的泛气候科技初创公司。本轮抓取到的公开记录在最关键的身份点上相互吻合：多篇独立 文章称
              GI WaaS 在沙特运营，并与 GI Aqua Tech 相连；母公司网站则把企业存在锚定在德国，同时 展示一个面向沙特项目销售的污水处理平台。商业主张也异常一致，尤其考虑到它的公开画像还很年轻。
              官方和媒体来源反复描述一种按立方米计费的分布式处理模式，卖点是回用、低气味和较低客户前期 资本开支。这很关键，因为它把 GI WaaS 更接近由基础设施支撑的服务，而不是一次性设备销售。也
              解释了为什么公司的公开故事强调运营场地、模块化部署和项目经济性，而不是纯授权叙事。即便只看 概览，GI Water as a Service 更像围绕 G-NANO 和沙特本地执行搭起来的项目型运营模式，不像一个
              概念。
