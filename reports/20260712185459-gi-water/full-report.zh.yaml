      - number: '2.3'
        title: 最可信买方是有回用价值和管网摩擦的场地级污水业主
        blocks:
          - type: paragraph
            body: >-
              买方图谱比自上而下规模测算更具体。公开 GI 相关项目指向本地片区、工业区、酒店、屠宰场、混凝土厂 和区域合作伙伴，这些场景里，现场处理解决的是眼前运营问题。由此可以分出三类。第一，家禽、石油相关、
              食品或建筑相关场地等工业买方，可能关注处置成本、水回用、正常运行时间和合规。第二，酒店和片区开发 买方关注气味、占地和与高端环境的融合。第三，Hajj 屠宰场处理等季节性或事件驱动负荷，可能特别看重
              快速部署和可迁移性。三类场景中，预算所有者都可能更接近场地或项目发起方，而不是全国公用事业规划者。 这有助于解释为什么 GI WaaS 的避免 capex 话术重要：服务模式减少了客户自有处理基础设施需求，当污水
              是场地问题而非全国管网问题时，也更容易论证。
