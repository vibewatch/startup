  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 相关市场是稀缺政策下的污水回用，不是全部水务支出
        blocks:
          - type: paragraph
            body: >-
              GI WaaS 并不争夺沙特水务行业的每一美元。相关市场切口更窄：分布式污水处理和回用，前提是场地有 显著污水负荷、合规压力、水回用价值，并且存在管网缺口或有理由避开集中式基础设施。沙特政策让
              这个切口具备战略重要性。National Water Strategy 材料和 UNDP 报道把水定义为稀缺战略资产， 推动私营参与和治理改革，并明确把污水处理和回用纳入改革组合。也就是说，公司运行在一条已重视
              韧性、循环利用和高性价比服务交付的政策走廊内。但市场边界仍然重要。集中式海水淡化和大型 SWPC 式公用事业基础设施是相邻背景，不是与现场服务模式相同的经济市场。GI WaaS 的赢面在于
              污水必须靠近源头处理、且回用或处置经济性足以支撑外包处理；它不是每一项集中式公用事业资本 开支计划的替代品。
