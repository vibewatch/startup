companyProfile:
  summary: >
    GI Water as a Service 是一家位于 Riyadh 的私营水科技运营商，公开定位是德国 GI Aqua Tech 在沙特的
    子公司或关联方。公开来源一致描述其模式：用分布式污水处理和回用方案，按立方米付费销售，并支持其在 工业、酒店、片区、季节性以及出口相关场景中已有项目活动。可见运营证据足以把它当成一个基础设施服务
    平台认真看待，但相对独角兽估值，公开披露仍然稀疏。
