  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 模式是结果导向的基础设施服务，不是轻量软件
        blocks:
          - type: paragraph
            body: >-
              公开证据在一点上异常一致：GI Water as a Service 销售的是按使用量计费的污水处理服务，而不是要求客户自己
              拥有并运营全套基础设施。按立方米付费的框架出现在官方和独立来源中，价值主张也反复围绕避免大额前期 capex，
              同时获得现场处理和回用能力。这带来两点财务含义。第一，收入可能取决于处理量、利用率、正常运行时间和合同期限， 而不是席位增长或低接触软件扩张。第二，这个模式很可能把服务经济性与部署、O&M
              和场地特定工程投入混在一起。 水回用 ROI 真实时，这会有吸引力；但实现后的经济性也会随工业、酒店、片区和季节性负荷而变。这家公司应按基础 设施服务逻辑评判，而不是套 SaaS
              捷径。因此，利用率、维护纪律、应收款回收和项目组合，可能比头条用户数更重要。
