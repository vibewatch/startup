  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 只有 GI 能用许可、标准和执法准备证明合规，监管才是护城河
        blocks:
          - type: paragraph
            body: >-
              最重要的风险在于，GI 运营于水务行业中正式监管的一部分，而不是轻监管创新 sandbox。沙特水法、处理后污水规则、水介质法规、SWA 许可职能和
              更宽的环境法框架都指向同一方向：处理、回用、排放和对环境有影响的活动，需要许可、标准合规、监测，并可能面临处罚或赔偿。这并非天然负面； 它可以保护可信运营商。但它确实抬高了门槛。公开记录支持一个结论：GI
              的成功不仅取决于处理性能，也取决于可复制的合规执行。风险并不抽象， 因为公司的公开定位依赖高可见度部署、面向政府的用例和靠近工业或居民用户的场地级处理。这套组合会放大任何许可遗漏或监测争议的后果。缺少项目级
              许可文件或检查结果时，本章可以评估规则，但无法完全验证公司自身合规成熟度。
