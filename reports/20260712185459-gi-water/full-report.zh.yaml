      - number: '2.2'
        title: 全球和区域市场口径很大，但 GI WaaS 可服务市场小得多
        blocks:
          - type: paragraph
            body: >-
              大市场背景毫无疑问很大。Fortune 把全球水和污水处理市场估为 2023 年 US$323.32 billion，并 预计 2032 年达到 US$617.81 billion；Meticulous
              预计中东和非洲市场到 2032 年达到 US$44.5 billion。这些数字有助于说明投资人关注和结构性增长，尤其因为它们同时覆盖市政和工业 应用。但它们不适合作为 GI WaaS 的直接
              TAM。公开沙特特定污水统计更有信息量。Desalination and Water Treatment 论文显示，处理后污水基数有意义、回用量绝对值已很大，处理能力增长需求也支撑
              持续新增解决方案需求。结论清楚：沙特大到足以重要，但 GI WaaS 的可服务市场应从污水场地经济性和 买方行为定义，而不是从通用水科技自上而下报告倒推。这也是本章把市场规模判断视为证据受限、而非
              精确估算的原因。
