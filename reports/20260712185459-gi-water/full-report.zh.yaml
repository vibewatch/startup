        title: GI 的客户故事跨多个垂直，但仍锚定少数公开引用
        blocks:
          - type: paragraph
            body: >-
              公开记录没有展示数十个具名客户的广泛名单。它展示的是一个多垂直模式。GI 似乎瞄准工业运营方、片区或市政污水问题、酒店场地、高负荷
              季节性设施和早期国际合作伙伴。这很重要，因为公司的客户逻辑并不窄窄绑定某个行业，而是绑定这样的场景：买方需要现场处理、回用或快速 部署，又不想承担传统污水基础设施的延迟和 capex
              负担。买方、用户、付款方关系也比典型软件业务更复杂。市政机构、工业场地或酒店业主 可能签约服务，但运营受益方可能包括居民、工厂操作员、酒店客人和下游回用应用。因此，本章把 GI
              视为一个多细分基础设施服务卖方：有真实 采用信号，但尚未披露足够客户广度，外部人无法画出完整装机基础。它也没有回答这些引用是边缘案例，还是可复制销售动作的开端。
