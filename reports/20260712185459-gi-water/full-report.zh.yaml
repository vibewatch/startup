        title: 管理层信号可见，但治理披露仍很薄
        blocks:
          - type: paragraph
            body: >-
              管理层可见度窄，但不是没有。Sherif Desouky 是唯一反复出现在独立和准官方来源中的高管： EnterpriseAM 引用他谈项目管线和工厂计划，Arab News 引用他谈出口和制造扩张，IDWS
              将他同时 列为 GI Aqua Tech 总裁和 GP Green Power Holding 执行主席。重复出现有帮助，因为它把公司的
              公开主张系到一名可问责的运营者，而不是匿名公司文案。与此同时，本轮抓取证据没有给出 GI Water as a Service 自身清晰的创始人名单、公开董事会构成或详细治理结构。连本轮尝试做的最佳第三方
              数据库交叉核验 Crunchbase 也无法访问。因此正确读法是混合：领导层证据足以说明公司并非无脸 组织，但治理证据不足以有信心验证董事会质量、股东权利或决策结构。对于已按独角兽水平定价的
              公司，这个缺口是实质问题，不是外观瑕疵。
