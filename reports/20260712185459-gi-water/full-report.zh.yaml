    rows:
      - - 沙特废水回用需求大，政策支持明确
        - 披露收入和续约情况后，判断会进一步增强
      - - 多种用例已有实名验证
        - 独立客户背书和队列数据会进一步增强判断
      - - 醒目的估值数字能吸引战略方关注
        - 如果下一轮融资偏防御或高度稀释，判断会转弱
      - - 经济性和集中度不透明，影响重大
        - 有经审计报表和集中度披露后可改善
      - - 采购和资本强度可能拖慢扩张
        - 若管线快速转化且站点利润率健康，判断会改善
    notes: 用来框定战略前景与承销缺口之间的核心争论。
