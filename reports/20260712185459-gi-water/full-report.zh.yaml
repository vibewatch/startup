      - number: '8.4'
        title: 下一步决策应取决于文件和里程碑，而不是更广泛的市场热情
        blocks:
          - type: paragraph
            body: >-
              最重要的下一步不是再争论市场规模，而是收集文件。投资人需要经审计财务、客户集中度数据、客户条款、许可与合规证据，以及支撑独角兽标签的实际轮融资文件。这些材料能直接回答公开来源无法解决的问题。在此之前，应认为退出准备度有限，价格也只是暂定。核心破局触发点很直接：如果旗舰案例无法转化为可复制收入、多元客户和可融资增长，股权故事会迅速变弱。反过来，如果公司能打开账本，证明健康的单站经济，并以强势姿态支撑后续融资，当前头条价格就更容易重新讨论。但今天，估值应跟着证据走，而不是跟着愿景走。没有这条纪律，投资人就可能把可选性按已经兑现的经营表现来买单。下一份尽调材料包应决定价格，而不是动量或叙事。
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV036
              - CV039
              - CV040
