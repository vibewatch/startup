              US$1.03B 的估值不能自证合理。恰恰相反，头条价格越高，举证责任越重。现阶段最合适的建议是
              research-more，不是因为公司缺少潜力，而是投资人仍要验证：这门生意是在长成可复制的基础设施服务平台，还是只是一个早期叙事很抓人、融资价格很贵的故事。投资人应把这个建议当成尽调闸门，而不是催促快速推进的温和背书。此处价格纪律比热情更重要，尤其是在披露仍落后于头条轮融资所隐含野心的情况下。
