      - number: '8.3'
        title: 情景分析只能做成基于里程碑的区间，不能当成干净的倍数练习
        blocks:
          - type: paragraph
            body: >-
              公开可比公司有帮助，但作用有限。Xylem、Veolia、SUEZ 展示了成熟水务公司的规模和披露该是什么样子。Fluence
              和其他分布式玩家在运营逻辑上更接近，但在本轮分析里仍不能作为一对一的估值锚。因此，基于里程碑的方法比套用收入倍数更诚实。根据公开证据，可以围绕 GI
              能否证明可复制的单站经济、出口转化和融资纪律，勾勒出合理的悲观、基准、乐观区间。但这些区间只是启发式判断，不能替代真实财务报告。这里使用情景的正确方式，不是声称精确，而是展示相对于仍然缺失的证据，今天的价格已经多大程度押注了乐观结果。下行保护因此高度依赖入场纪律，也意味着仓位应保守。
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV017
              - CV018
              - CV025
              - CV026
              - CV027
              - CV028
