              明确销售分布式污水处理和模块化系统，是运营 逻辑上最接近的公开可比对象。Organica 靠紧凑性和空间效率竞争，但叙事完全不同，偏生物和植物设施。GI 的 公开边缘因此不是单靠回用标签，而是按立方米定价、非生物
