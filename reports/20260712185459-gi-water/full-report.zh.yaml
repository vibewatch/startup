            body: >-
              看多一侧的逻辑是连贯的。GI
              瞄准废水回用这个真实问题，似乎也与沙特政策方向一致，公开案例覆盖工业、城区、季节性场景、酒店以及近似出口的项目。仅凭这些，公司原则上已经具备可投资性。反向论点同样成立：公开证据仍没有展示经审计财务、续约行为、客户集中度或干净的单位经济；同时还指向采购周期慢、后续融资需求和受监管的运营环境。换句话说，公司可能长进当前估值，但公开记录尚未证明它已经配得上这个估值。投资人被要求跨过一道很宽的鸿沟：一端是战略上说得通，另一端是估值上要精确。今天大部分风险就卡在这道鸿沟里。因此，可比公司算术不能替代缺失的公司文件或管理层披露。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
              - CV015
              - CV016
              - CV017
