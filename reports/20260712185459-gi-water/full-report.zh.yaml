  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: 从资产层到产出和合规层，公开信息可推断的 GI 产品栈。
    data:
      layers:
        - label: 商业封装层
          detail: 商业层把模块化资产变成服务合同和按吞吐量计费。
          items:
