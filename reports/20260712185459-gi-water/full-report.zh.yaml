  - id: TV005
    title: 论点破裂与否决触发表
    columns:
      - 触发因素
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 后续融资偏弱
        - 在明确运营里程碑前发生新一轮融资
        - 同时削弱估值支撑和增长可信度
        - 重新承销，或避免沿用此前价格
      - - 披露无进展
        - 经审计财务或集中度数据仍不可得
        - 估值仍处于无法评估区间
        - 不认可当前价格
      - - 旗舰验证无法复制
        - 参考站点没有带来可重复账户
        - 乐观论点明显转弱
        - 转为回避，或大幅压低价格
      - - 合规或许可问题
        - 出现重大站点问题
        - 损害信任并拖慢销售
        - 问题解决前暂停尽调
      - - 客户集中度极端
        - 少数站点主导收入
        - 提高波动性和续约风险
        - 要求大幅估值折价
    notes: 否决触发因素把叙事风险转成可监控的尽调事件。
