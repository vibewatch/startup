  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 管线转化，站点经济性披露，巴林 / 法国扩张，融资在强势基础上推进
        - 当前估值更站得住脚，规模化后仍可能有上行
        - 执行仍难，但证据缺口收窄
        - 需要披露和转化里程碑
      - - 基准
        - 需求真实，公司选择性扩张，披露缓慢改善
        - 估值支撑仍然参差，上行取决于入场价格是否克制
        - 集中度和融资风险仍在
        - 最符合当前公开证据
      - - 悲观
        - 采购放慢，融资拉长，旗舰验证无法泛化
        - 当前独角兽价格被证明过于乐观
        - 稀释、集中度和利润率不确定性占主导
        - 里程碑延误或下一轮走弱时触发
    notes: 情景逻辑以里程碑为基础，因为收入和利润率数据未公开。
