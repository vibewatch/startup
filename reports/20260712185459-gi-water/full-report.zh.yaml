  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 同业范围横跨直接模块化对手、区域基础设施既有企业和全球水务巨头
        blocks:
          - type: paragraph
            body: >-
              GI Water as a Service 没有一个完美公开可比公司。现实竞争集必须拆成三桶。第一类是 Fluence、 Organica 等模式相邻专家，也强调模块化、分布式处理或紧凑型污水设施。第二类是
              Metito 等区域水务 基础设施既有企业；它们在沙特重要，因为已经在王国执行大型污水处理资产、合作和 PPP 式项目。第三类是 Veolia、SUEZ、Xylem
              等全球全栈巨头，拥有庞大装机基础、更宽产品组合和深得多的财务能力。这种框架 很关键，因为 GI 并不是想替代水循环每一个环节。它的竞争场更窄：边缘场景、场地级回用、快速部署和 capex
              敏感客户。但窄不等于容易，也不等于实践中天然可防守。即使在这个切口内，市场也挤满了能把 回用、O&M、流程专业能力或融资打包进更宽客户关系的公司。
