            body: >-
              GI 的公开产品表面压倒性地偏实体和运营，而不是数字化或抽象能力。公司展示便携式处理厂、移动处理厂、产能升级单元和更大的 新一代处理厂，再把 Water as a Service
              叠在上面作为商业交付模式。这很关键，因为核心问题不是 GI 有没有单台机器，而是它 是否有一套灵活资产包，可以跨不同污水条件、场地规模和合同结构部署。最强证据指向肯定答案。GI 反复描述场地部署、在客户场地
              处理、按体量收费，以及根据项目取回设备或持续运营。这种框架让公司更像模块化基础设施运营商，而不是标准化硬件盒子的卖方。
              也解释了为什么产品组合和运营模式必须放在一起读，不能拆成两个主题。它还意味着产品组织必须同时协调工程、运营、物流和合规， 并持续保持一致。
