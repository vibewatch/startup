    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and what GI WaaS actually is
        blocks:
          - type: paragraph
            body: >-
              GI Water as a Service should be read first as a Saudi operating company wrapped around a German parent
              technology platform, not as a generic climate-tech startup with an aspirational website. The fetched
              public record is consistent on the core identity points that matter most: multiple independent articles
              describe GI WaaS as Saudi-based and tied to GI Aqua Tech, while the parent site anchors its corporate
              presence in Germany and presents a wastewater-treatment platform marketed across Saudi projects. The
              commercial proposition is also unusually consistent for such a young public profile. Official and press
              sources repeatedly describe a decentralized treatment model sold on a pay-per-cubic-meter basis, with
              reuse, low odor, and lower customer upfront capex as the pitch. That matters because it places GI WaaS
              closer to infrastructure-enabled services than to one-off equipment sales. It also explains why the
              company’s public story emphasizes operating sites, modular deployment, and project economics rather than a
              pure licensing narrative. Even at the overview stage, the company looks less like a concept and more like
              a project-backed operating model built around G-NANO and local execution in Saudi Arabia.
