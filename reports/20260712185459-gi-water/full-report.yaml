  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Weak follow-on financing
        - New round occurs before clear operating milestones
        - Undercuts both valuation support and growth credibility
        - Re-underwrite or avoid at prior price
      - - No disclosure progress
        - Audited financials or concentration data remain unavailable
        - Keeps valuation in cannot-assess territory
        - Do not endorse current price
      - - Flagship proof fails to replicate
        - Reference sites do not lead to repeatable accounts
        - Bull thesis weakens materially
        - Shift to avoid or much lower price
      - - Compliance or permit problem
        - Material site issue emerges
        - Damages trust and slows sales
        - Pause diligence until resolved
      - - Customer concentration proves extreme
        - A few sites dominate revenue
        - Raises volatility and renewal risk
        - Demand large valuation discount
    notes: Kill triggers translate narrative risk into monitorable diligence events.
    claimRefs:
      - CV032
      - CV033
      - CV039
      - CV040
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Financial statements
        - Audited P&L, balance sheet, cash flow
        - Core valuation and dilution input
        - Management / auditors
      - - Round documents
        - Series A term sheet, cap table, rights
        - Normalizes post-money headline
        - Counsel / CFO
      - - Customer durability
        - Renewals, concentration, active sites
        - Distinguishes platform from project business
        - Sales ops / CFO
      - - Permits and compliance
        - Permit files, inspections, sampling
        - Confirms operability of flagship sites
        - EHS / legal
      - - Unit economics
        - Site-level margin and utilization data
        - Determines whether bull case is real
        - Finance / operations
    notes: These are the minimum asks before a serious investment committee price discussion.
    claimRefs:
      - CV031
      - CV034
      - CV036
