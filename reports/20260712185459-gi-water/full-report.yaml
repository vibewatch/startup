  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: The relevant market is wastewater reuse under scarcity policy, not all water spending
        blocks:
          - type: paragraph
            body: >-
              GI WaaS does not compete for every dollar in the Saudi water sector. The relevant market wedge is
              narrower: decentralized wastewater treatment and reuse where a site has meaningful wastewater loads,
              compliance pressure, water-reuse value, and either a network gap or a reason to avoid centralized
              infrastructure. Saudi policy makes that wedge strategically important. National Water Strategy materials
              and UNDP coverage frame water as a scarce strategic asset, push for private participation and governance
              reform, and explicitly include wastewater treatment and reuse in the reform stack. That means the company
              is operating inside a policy corridor that already values resilience, circular use, and cost-effective
              service delivery. But the market boundary still matters. Centralized desalination and large SWPC-style
              utility infrastructure are adjacent context, not the same economic market as an on-site service model. GI
              WaaS wins where wastewater has to be treated close to source and reuse or disposal economics justify
              outsourced treatment; it is not a substitute for every centralized utility capex program.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM029
