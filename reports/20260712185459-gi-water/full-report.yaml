  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The company is promising, but the public record is not strong enough to endorse the current unicorn price
        blocks:
          - type: paragraph
            body: >-
              GI Water as a Service is not hard to like strategically. Water reuse matters, Saudi Arabia has structural
              demand, and the company has accumulated enough visible project proof to avoid being dismissed as purely
              conceptual. But liking the strategic story is not the same as underwriting the equity at a specific price.
              The public record remains too thin on revenue, cash generation, customer durability, and round structure.
              That means the current US$1.03 billion valuation cannot be treated as self-validating. If anything, the
              burden of proof rises as the headline price rises. At this stage the best recommendation is research-more,
              not because the company lacks promise, but because investors still need to verify whether the business is
              becoming a repeatable infrastructure-service platform or merely a compelling early narrative with
              expensive financing around it. Investors should treat the recommendation as a diligence gate rather than
              as a soft endorsement to move quickly. Price discipline matters more than enthusiasm here, especially when
              disclosure still lags the ambition embedded in the headline round.
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV020
