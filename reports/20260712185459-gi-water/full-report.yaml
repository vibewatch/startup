      - number: '2.2'
        title: Global and regional market lenses are large, but the GI WaaS serviceable market is much smaller
        blocks:
          - type: paragraph
            body: >-
              The broad market backdrop is unquestionably large. Fortune puts the global water and wastewater treatment
              market at US$323.32 billion in 2023 and projects US$617.81 billion by 2032, while Meticulous projects the
              Middle East and Africa market to reach US$44.5 billion by 2032. Those figures are useful for showing
              investor attention and structural growth, especially because they include both municipal and industrial
              applications. They are less useful as direct GI WaaS TAMs. Public Saudi-specific wastewater statistics are
              more informative. The Desalination and Water Treatment paper shows a meaningful treated-wastewater base,
              reuse volumes that are already large in absolute terms, and treatment-capacity growth needs that support
              ongoing demand for additional solutions. The implication is clear: Saudi Arabia is big enough to matter,
              but the serviceable market for GI WaaS should be defined from wastewater site economics and buyer
              behavior, not from a generic water-tech top-down report. That is why this chapter treats market sizing as
              evidence-constrained rather than precise.
