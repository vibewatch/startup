      - number: '4.4'
        title: >-
          The supportable verdict is research-more, with the key debate centered on capital intensity versus
          project-level ROI
        blocks:
          - type: paragraph
            body: >-
              There is a coherent upside case in the public evidence. If GI’s customers truly avoid major network or
              disposal costs, if the reported energy and reuse benefits are real in production, and if local
              manufacturing improves delivery economics, then the company could build recurring infrastructure-service
              revenue with attractive strategic value. There is also a clear downside case. Capex and working-capital
              demands may stay high, financing could remain necessary for longer than expected, and procurement could
              remain slow in exactly the markets GI is targeting. Because the public record gives no audited financials,
              the chapter cannot settle that debate. It can only narrow it. The right conclusion is that GI’s revenue
              model is plausible and strategically aligned with a real problem, but still too opaque for a clean
              underwrite on quality of earnings, margin path, or runway. Any investment case still hinges on audited
              statements, project-margin bridges, and capital-allocation discipline, plus clearer disclosure on customer
              concentration and contract tenor.
