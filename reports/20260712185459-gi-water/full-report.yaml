        title: Leadership signal is visible, but governance disclosure remains thin
        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is narrow but not absent. Sherif Desouky is the one executive who repeatedly appears
              across independent and quasi-official sources: EnterpriseAM quotes him on project pipeline and factory
              plans, Arab News quotes him on exports and manufacturing scale-up, and IDWS identifies him as both
              President of GI Aqua Tech and Executive Chairman of GP Green Power Holding. That level of repetition is
              helpful because it ties the company’s public claims to a single accountable operator rather than to
              anonymous corporate copy. At the same time, the fetched evidence does not yield a clean founder roster, a
              public board composition, or a detailed governance structure for GI Water as a Service itself. Even the
              best third-party database cross-check attempted in this run, Crunchbase, was blocked. So the right read is
              mixed: there is enough leadership evidence to say the company is not faceless, but not enough governance
              evidence to underwrite board quality, shareholder rights, or decision-making structure with confidence.
              For a company already priced at unicorn levels, that gap is material rather than cosmetic.
