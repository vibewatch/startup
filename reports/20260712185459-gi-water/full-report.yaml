      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The current headline valuation outruns the public data room
            body: >-
              The company may deserve serious attention, but the public evidence still does not provide the audited
              revenue, margin, concentration, or round-term detail needed to endorse a US$1.03B price.
            calloutType: risk
            claimRefs:
              - CV001
