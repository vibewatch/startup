          - type: callout
            title: This is a milestone-valuation story, not a multiple-valuation story
            body: >-
              Until GI opens the books and proves repeatable site economics, the most honest approach is to underwrite
              milestones and downside triggers rather than pretend the comp set can deliver precision.
            calloutType: insight
