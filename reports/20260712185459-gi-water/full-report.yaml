        title: GI’s customer story is multi-vertical, but still anchored in a small set of public references
        blocks:
          - type: paragraph
            body: >-
              The public record does not show a broad roster of dozens of named customers. What it does show is a
              multi-vertical pattern. GI appears to target industrial operators, district or municipal wastewater
              problems, hospitality sites, high-load seasonal facilities, and early international partners. That matters
              because the company’s customer logic is not narrowly tied to one industry. It is tied to situations where
              buyers need on-site treatment, reuse, or rapid deployment without the delay and capex burden of
              conventional wastewater infrastructure. The buyer-user-payer relationship is also more complex than in
              typical software businesses. A municipality, industrial site, or hospitality owner may contract the
              service, but the operational beneficiaries can include residents, plant operators, hotel guests, and
              downstream reuse applications. This chapter therefore treats GI as a multi-segment infrastructure-service
              seller with real adoption signals, but not yet with the kind of disclosed customer breadth that would let
              an outsider map the full installed base. It also leaves unanswered whether these references are edge cases
              or the start of a repeatable sales motion.
