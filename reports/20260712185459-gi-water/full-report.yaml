  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The peer set spans direct modular peers, regional infrastructure incumbents, and global water majors
        blocks:
          - type: paragraph
            body: >-
              There is no single perfect public comparable for GI Water as a Service. The realistic competitor set has
              to be split into three buckets. First are model-adjacent specialists such as Fluence and Organica, which
              also emphasize modularity, distributed treatment, or compact wastewater facilities. Second are regional
              water-infrastructure incumbents such as Metito that matter in Saudi Arabia because they already execute
              large sewage-treatment assets, partnerships, and PPP-style projects in the Kingdom. Third are global
              full-stack majors such as Veolia, SUEZ, and Xylem, which bring enormous installed bases, broader product
              portfolios, and much deeper financial capacity. That framing matters because GI is not trying to replace
              every part of the water cycle. Its competitive arena is narrower: edge cases, site-level reuse, rapid
              deployment, and capex-sensitive customers. But narrow does not mean easy or automatically defensible in
              practice. Even inside that wedge, the market is crowded by companies that can bundle reuse, O&M, process
              expertise, or financing into wider customer relationships.
            claimRefs:
              - CP001
              - CP018
