      - number: '3.4'
        title: The moat is real only if GI scales its niche before larger players compress it
        blocks:
          - type: paragraph
            body: >-
              The best competitor-chapter bull case is that GI has found a commercially useful wedge: decentralized,
              compact, on-site treatment for buyers who care about reuse value, odor, footprint, and capex avoidance in
              Saudi Arabia. The best bear case is that none of those themes are uncopyable. Larger players already
              market reuse and O&M, Fluence already markets decentralized systems, Organica already markets compact
              plants, and regional incumbents already know how to win Saudi infrastructure budgets. That means moat
              durability depends less on invention and more on speed: can GI convert local proof into repeatable
              cross-border distribution, channel access, and customer trust before larger peers bundle similar economics
              into broader offerings? Public evidence cannot answer that fully because there is no transparent Saudi
              win-loss history or normalized price data. But it does support a sober conclusion: GI’s position is
              differentiated enough to matter, yet not protected enough to ignore incumbent response.
