              with the entire universe of water-reuse technology. Fast deployment, relocatability, small footprint, and
              localization are the clearest public advantages. The company also has roadmap ambition: exports, a Saudi
              manufacturing hub, additional wastewater categories such as oil-related streams, and institutional
