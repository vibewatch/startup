        - Current valuation becomes more defensible and upside can still exist through scale
        - Execution still hard but evidence gap narrows
        - Requires disclosure and conversion milestones
      - - Base
        - Demand is real, company scales selectively, disclosure improves slowly
        - Valuation support remains mixed and upside depends on disciplined entry price
