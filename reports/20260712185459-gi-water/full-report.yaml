      - number: '2.3'
        title: The most credible buyers are site-level wastewater owners with reuse value and network friction
        blocks:
          - type: paragraph
            body: >-
              The buyer map is more concrete than the top-down sizing. Public GI-linked projects point to domestic
              districts, industrial zones, hotels, slaughterhouses, concrete plants, and regional partners—segments
              where on-site treatment solves an immediate operating problem. That creates three useful distinctions.
              First, industrial buyers such as poultry, petroleum-adjacent, food, or construction-linked sites are
              likely to care about disposal cost, water reuse, uptime, and compliance. Second, hospitality and
              district-development buyers care about odor, footprint, and integration into premium environments. Third,
              seasonal or event-driven loads such as Hajj slaughterhouse treatment may especially value rapid deployment
              and relocatability. In all three cases, the budget owner is likely closer to the site or project sponsor
              than to a national utility planner. That helps explain why GI WaaS’s capex-avoidance pitch matters: the
              service model reduces the need for customer-owned treatment infrastructure and can be easier to justify
              when wastewater is a site problem rather than a national-network problem.
