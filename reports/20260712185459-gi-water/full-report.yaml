      - number: '1.3'
        title: The funding headline is real, but the round terms are still opaque
        blocks:
          - type: paragraph
            body: >-
              The broad funding story is credible. The company’s own announcement, regional startup coverage, and
              independent business reporting all converge on the same headline: GI Water as a Service crossed the US$1
              billion mark after a February 2025 Series A involving Saudi investors tied to Zamil and Al Qunaibet.
              EnterpriseAM provides the strongest numerical color by reporting an approximately US$1.03 billion
              valuation and an eight-figure cash investment for a 5.8% stake, while other outlets stick to
              over-US$1-billion wording. That is enough to support unicorn status, but not enough to fully normalize the
              price. Public sources still do not disclose the exact check size, the security structure, preference
              terms, or governance rights attached to the round. The stakeholder picture is stronger than the financing
              detail. Beyond financial investors, the company has visible ties to Saudi water institutions, including an
              SWA-announced innovation agreement and official messaging around ecosystem support. Those ties may be
              commercially valuable in a sector where procurement, regulation, and pilot access all matter. They do not,
              however, replace the need for a full financing memo if an investor wants to understand whether the
              valuation is economically clean.
