      - number: '2.4'
        title: Demand drivers are strong, but procurement and economics can still slow adoption
        blocks:
          - type: paragraph
            body: >-
              The market drivers line up well for GI WaaS: scarcity, regulation, Vision 2030 reforms, industrial growth,
              and the policy push for innovation and reuse all support more treatment activity. MEWA’s own innovation
              work adds a useful nuance by treating wastewater treatment and reuse as a priority technology domain
              rather than a peripheral sustainability theme. Still, adoption is not frictionless. Meticulous highlights
              high installation, maintenance, and operating costs across the regional sector, while AGBI argues that
              water-tech startups in the Gulf remain unusually dependent on government-linked funding and slow
              procurement cycles. That tension matters because it separates strategic relevance from commercial
              velocity. GI WaaS may be selling into a structurally attractive market, but one where buyer conversion can
              still be bureaucratic, long-cycle, and project specific. The honest conclusion is that public evidence
              supports the direction of demand far more strongly than it supports a precise near-term revenue TAM or a
              fast, repeatable sales cycle.
