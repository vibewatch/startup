              - CR028
          - type: callout
            title: Demand tailwinds do not eliminate execution risk
            body: >-
              Saudi policy support, visible projects, and international interest are real positives, but they mainly
              raise the stakes on execution. They do not by themselves prove durable, low-risk scaling.
            calloutType: insight
