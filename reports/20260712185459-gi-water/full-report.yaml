              - CV040
      - number: '8.2'
        title: >-
          The thesis is driven by strategic demand and proof points; the anti-thesis is driven by opacity and execution
          burden
        blocks:
          - type: paragraph
            body: >-
              The bullish side of the case is coherent. GI targets a real problem in wastewater reuse, appears aligned
              with Saudi policy, and has public references that span industrial, district, seasonal, hospitality, and
              export-adjacent settings. That is enough to make the company investable in principle. The anti-thesis is
              just as coherent. Public evidence still does not show audited financials, renewal behavior, customer
              concentration, or clean unit economics. It also points to slow procurement, further rounds, and a
              regulated operating environment. In other words, the company could grow into its valuation, but the public
              record has not yet shown that it already deserves it. Investors are being asked to bridge a large gap
              between strategic plausibility and valuation precision, and that gap is where most of the risk sits today.
              It is also why comparable-company math cannot substitute for missing company documents or management
              disclosures.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
