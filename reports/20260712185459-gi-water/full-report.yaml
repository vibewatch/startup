      - number: '3.2'
        title: Reuse and wastewater treatment are not unique, but GI’s small-footprint service logic is more unusual
        blocks:
          - type: paragraph
            body: >-
              The public competitor material makes one point immediately clear: water reuse and wastewater treatment are
              already core incumbent categories. Veolia, SUEZ, and Xylem all market reuse or recycle-and-reuse
              capabilities, and SUEZ directly frames treated wastewater recycling as part of its broader water-resource
              offering. That means GI cannot claim category uniqueness simply because it treats wastewater or enables
              reuse. The more credible differentiation is at the delivery-model layer. Incumbents win on breadth, but
              that breadth can obscure whether they offer the same small-footprint deployment logic GI is trying to
              monetize in Saudi Arabia. Fluence explicitly markets decentralized wastewater treatment and modular
              systems, making it the closest public analogue on operating logic. Organica competes on compactness and
              space efficiency, but through a very different biological, botanical-facility narrative. GI’s public edge
              is therefore the combination of pay-per-cubic-meter pricing, non-biological G-NANO claims, rapid
              deployment, and Saudi case references rather than the reuse label alone.
