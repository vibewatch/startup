      - number: '5.3'
        title: Deployment depends on permits, standards, and environmental controls as much as on treatment science
        blocks:
          - type: paragraph
            body: >-
              Wastewater technology in Saudi Arabia is not a purely commercial exercise. It sits inside a regulatory
              regime that governs permits, discharge standards, reuse standards, sludge and environmental handling, and
              broader service-provider licensing. That matters for GI because its value proposition depends on putting
              units close to where wastewater is generated, often in sensitive industrial, municipal, or neighborhood
              contexts. The regulatory sources used here make clear that treated wastewater use, environmental
              discharge, and related activities require technical compliance and formal oversight. MEWA’s sandbox intake
              also shows that innovations are expected to arrive with technical specs, support files, and trial plans
              rather than with marketing copy alone. In other words, GI’s trust surface is mostly about wastewater
              quality, environmental safety, and operational controls—not about consumer-style privacy dashboards or
              SaaS security badges. It must earn credibility through permits, sampling, operating discipline, and field
              performance.
