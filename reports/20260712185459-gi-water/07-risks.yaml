    {
      "id": "operational-and-execution-risk",
      "title": "Real deployments prove capability, but they also amplify execution, quality, and reputational exposure",
      "body": "GI’s public references do reduce one risk: this is not a purely conceptual company. Hajj, Riyadh Industrial City, Jeddah, and export planning all show real-world activity. Yet those same references intensify operating risk. A short-window seasonal site such as Hajj is unforgiving. Neighborhood or hospitality sites create low tolerance for odor, noise, quality issues, or visible failure. Export and localization add installation, workforce, and support complexity. The roadmap toward oil-related and high-salinity wastewater introduces further technical stretch beyond the current proof set. Public sources do not reveal a mature control architecture, incident management framework, or deep bench of operational leadership, so the biggest execution question is whether GI can scale without outgrowing its own controls. The more impressive the flagship story, the higher the cost if a flagship underperforms. It also means one bad operating month could travel faster than several good quarters in public markets worldwide.",
