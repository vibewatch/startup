    {
      "id": "mitigation-and-verdict",
      "title": "Policy alignment mitigates some risk, but evidence asymmetry keeps residual exposure medium-high",
      "body": "There is a real mitigation story. Saudi policy supports reuse, localization, and innovation. GI already has visible reference sites, sector relationships, and a narrative that fits national water goals. Those are not trivial advantages. But they do not remove the main residual exposures. The company still needs to demonstrate that compliance systems are as strong as the marketing story, that customer and geographic concentration are manageable, that follow-on financing can be secured without distortion, and that operational controls can scale with manufacturing and exports. In other words, the most dangerous risk is not lack of demand. It is failing to translate visible demand into compliant, repeatable, financeable, and trusted execution. On public evidence alone, the risk profile should be treated as medium-high residual exposure rather than as a simple growth opportunity with minor implementation noise during rapid scaling.",
      "claimRefs": [
        "CR033",
        "CR034",
        "CR035",
        "CR040"
      ],
      "tableRefs": [
        "TR005"
      ],
      "figureRefs": []
    }
