  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "GI Water as a Service faces medium-high residual risk because it is scaling a young, capital-intensive, regulated wastewater business across visible flagship sites and new geographies. The strongest risk evidence is regulatory, environmental, commercial-timing, and transparency related—not lack of sector demand. Policy alignment helps, but it does not remove the need for permit proof, operating controls, concentration data, and disciplined financing."
  },
  "sections": [
    {
      "id": "regulatory-and-legal-risk",
      "title": "Regulation is a moat only if GI can prove compliance through permits, standards, and enforcement readiness",
      "body": "The most important risk to understand is that GI operates in a formally regulated part of the water sector, not in a lightly governed innovation sandbox. Saudi water law, treated-wastewater rules, aqueous-media regulations, SWA licensing functions, and the broader environmental-law framework all point in the same direction: treatment, reuse, discharge, and environmentally impactful activity require permits, standards compliance, monitoring, and potential exposure to penalties or compensation. That is not inherently negative; it can protect credible operators. But it does raise the bar. The public record supports the conclusion that GI’s success depends not only on treatment performance, but on repeatable compliance execution. The risk is not abstract because the company’s public positioning relies on high-visibility deployments, government-facing use cases, and site-level treatment close to industrial or residential users. That combination raises the consequences of any permitting lapse or monitoring dispute. Without project-level permit files or inspection outcomes, the chapter can evaluate the rules, but not fully verify the company’s own compliance maturity.",
