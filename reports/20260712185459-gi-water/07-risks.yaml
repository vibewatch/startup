    {
      "id": "commercial-partner-and-model-risk",
      "title": "Slow procurement, financing dependence, and concentration could be more dangerous than pure technology risk",
      "body": "The commercial and model risks are unusually intertwined here. GI appears to sell into a water market where institutional channels, PPP structures, principal buyers, and government-linked procurement matter heavily. That makes patience and relationship management part of the business model, not just part of the sales process. AGBI’s financing and procurement critique therefore lands directly on the company’s growth model. EnterpriseAM’s indication that additional financing rounds are expected reinforces the point: GI may need capital for longer than a simple project-success narrative implies. At the same time, the company’s public proof remains Saudi-heavy and concentrated in a handful of showcase deployments. Bahrain and France help diversify the story, but not enough to erase single-market and possible customer-concentration risk. The hardest underwriting question is whether public traction reflects a repeatable commercial engine or a still-fragile set of high-visibility wins. That uncertainty should keep diligence focused on conversion speed, concentration data, and contract discipline constantly.",
      "claimRefs": [
        "CR020",
        "CR021",
