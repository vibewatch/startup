  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "GI Water as a Service sits inside a large and policy-supported water-treatment opportunity, but its real addressable market is a much narrower wastewater-reuse wedge defined by site-level economics, regulation, and network gaps. Public market reports support a large global and regional backdrop, while Saudi-specific sources show a meaningful treated-wastewater base, continuing capacity needs, and explicit Vision 2030 support for private participation and reuse. The main market risk is not lack of need; it is the difficulty of translating strategic importance into fast, repeatable customer conversion for a decentralized service model."
  },
  "sections": [
    {
      "id": "market-boundary-and-policy",
      "title": "The relevant market is wastewater reuse under scarcity policy, not all water spending",
      "body": "GI WaaS does not compete for every dollar in the Saudi water sector. The relevant market wedge is narrower: decentralized wastewater treatment and reuse where a site has meaningful wastewater loads, compliance pressure, water-reuse value, and either a network gap or a reason to avoid centralized infrastructure. Saudi policy makes that wedge strategically important. National Water Strategy materials and UNDP coverage frame water as a scarce strategic asset, push for private participation and governance reform, and explicitly include wastewater treatment and reuse in the reform stack. That means the company is operating inside a policy corridor that already values resilience, circular use, and cost-effective service delivery. But the market boundary still matters. Centralized desalination and large SWPC-style utility infrastructure are adjacent context, not the same economic market as an on-site service model. GI WaaS wins where wastewater has to be treated close to source and reuse or disposal economics justify outsourced treatment; it is not a substitute for every centralized utility capex program.",
