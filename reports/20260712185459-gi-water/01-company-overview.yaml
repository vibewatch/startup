        "TO003"
      ]
    },
    {
      "id": "milestones-and-open-gaps",
      "title": "Operational milestones are stronger than corporate disclosure",
      "body": "The clearest positive in the overview chapter is that public operating proof predates the unicorn headline. The projects portfolio lists Riyadh, NEOM, Hajj slaughterhouse, Diriyah hotel, and Jeddah district wastewater references, while EnterpriseAM and Arab News add pipeline, factory, and export context. Bahrain expansion and France export plans suggest the company is trying to move from Saudi proof points into regional and international revenue paths. That sequence lowers the risk that the company achieved a financial milestone before it had any field evidence at all. The counterweight is disclosure depth. Public sources do not give a clean legal-entity history, audited revenue, customer count, headcount, or full cap-table mechanics. In other words, GI WaaS has enough public milestones to support a real company-overview chapter, but not enough public disclosure to treat the overview as a substitute for diligence on economics, governance, or investor rights. That should shape how later chapters are read: the company appears commercially serious, but still fundamentally private and disclosure-light.",
