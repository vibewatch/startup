    {
      "id": "durability-and-missing-metrics",
      "title": "The biggest customer diligence gap is durability, not existence",
      "body": "Public evidence is good enough to conclude that GI has customers or at least customer deployments. It is not good enough to conclude how sticky, renewable, or expandable those relationships are. No fetched source provides customer counts, active-site counts, NRR, GRR, churn, renewal terms, contract length, or a clean view of how much recurring revenue sits behind the public anecdotes. That gap matters because infrastructure-service businesses can look strong on a handful of visible projects while still struggling to standardize economics or renewals. The same issue applies to the forward pipeline. EnterpriseAM’s references to Souda, Diriyah, SIRC, and Agri-Serve suggest real commercial motion, but they do not tell outsiders which opportunities are contracted, in pilot, or merely in discussion. The right reading is that adoption is visible, yet durability remains largely private. That is the core reason this chapter stops at research-more rather than making a stronger quality-of-customers claim.",
