    {
      "id": "expansion-and-concentration",
      "title": "Saudi-centric proof is a strength today and a concentration risk at the same time",
      "body": "Saudi Arabia is clearly GI’s core proving ground. That is a strength because the Kingdom’s water policy, reuse priorities, and infrastructure agenda create real customer need across industrial, municipal, district, and hospitality contexts. But it is also a concentration risk. AGBI’s reporting on slow government-linked funding and procurement matters here, as do the WEX and InfraPPP descriptions of SWPC’s principal-buyer and PPP-oriented market structure. In this market, expansion often requires patient institutional selling rather than fast self-serve adoption. Bahrain may help diversify the footprint, and France adds a useful export signal, yet neither changes the underlying reality that GI’s public customer evidence is still Saudi-heavy. The upside case is multi-vertical referenceability. The downside case is that those references could still mask concentration, elongated sales cycles, or project-style revenue rather than durable account expansion.",
