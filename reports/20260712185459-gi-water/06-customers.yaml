    {
      "id": "named-proof-quality",
      "title": "Named proofs exist across Saudi industrial, municipal, and hospitality use cases, with Bahrain and France as expansion edges",
      "body": "The strongest named proof points are clustered in Saudi Arabia. The Hajj slaughterhouse deployment demonstrates a difficult seasonal, peak-load use case with concrete operating parameters. The Riyadh Industrial City site shows an industrial installation with a specific capacity and reuse claim. The Jeddah Al-Mousa district reference adds a public-interest, neighborhood-scale deployment that reportedly serves 8,000 residents and can be relocated. Media sources also point to a Samhan hotel deployment in Diriyah, which matters strategically because hospitality wastewater is operationally messy and space constrained, even if the proof surface is thinner than for the larger Saudi references. Outside Saudi Arabia, the France export and Tahliya Bahrain partnership are important, but they should not be overstated. France is buyer proof, not yet long-duration operating proof in the fetched set. Bahrain is partnership proof, not yet a fully evidenced production reference with customer outcomes. So the named-proof picture is real, but uneven in quality.",
