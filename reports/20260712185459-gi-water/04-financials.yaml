    {
      "id": "public-metric-gaps-and-comp-benchmarks",
      "title": "Operational proof exists, but issuer-grade financial disclosure does not",
      "body": "The chapter’s biggest limitation is not absence of company activity; it is absence of company financial disclosure. Public project references, export plans, and localization claims all support the view that GI is commercially active. What they do not provide is audited revenue, gross margin, current customer count, burn, or runway. That matters more once listed comparables enter the frame. Xylem’s 10-K and the public finance materials from Veolia and SUEZ show what mature water-company disclosure looks like: large-scale revenue, formal filings, and enough detail for real underwriting. GI has not provided an equivalent package publicly. That disclosure gap does not mean the economics are bad; it means outsiders cannot verify them. It also means any implied valuation-to-revenue narrative remains mostly speculative until management provides direct financial evidence. Market-data sources can confirm that wastewater and reuse are investable categories, but they cannot substitute for GI’s own statements.",
      "claimRefs": [
