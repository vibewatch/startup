  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "GI Water as a Service appears to monetize wastewater treatment as a throughput-based infrastructure service whose upside comes from customer capex avoidance and reuse ROI rather than from software-like leverage. Public evidence supports the existence of a major 2025 financing event, a factory and export ambition, and a likely capital-intensive growth path, but it does not disclose audited revenue, margin, cash, or runway. The supportable financial verdict is therefore research-more: the model is plausible, but the economics remain too opaque for a clean underwriting call."
  },
  "sections": [
    {
      "id": "revenue-model-and-pricing",
      "title": "The model is outcome-led infrastructure service, not lightweight software",
      "body": "Public evidence is unusually consistent on one point: GI Water as a Service sells wastewater treatment as a usage-based service rather than asking customers to own and operate the full infrastructure stack themselves. The pay-per-cubic-meter framing appears across official and independent sources, and the value proposition repeatedly centers on avoiding large upfront capex while still getting on-site treatment and reuse capability. That has two financial implications. First, revenue likely depends on throughput, utilization, uptime, and contract duration, not on seat growth or low-touch software expansion. Second, the model probably mixes service economics with deployment, O&M, and site-specific engineering effort. That can be attractive when water-reuse ROI is real, but it also means realized economics will vary across industrial, hospitality, district, and seasonal workloads. This is a business that should be judged against infrastructure-service logic, not against SaaS shortcuts. That also means utilization, maintenance discipline, receivables collection, and project mix are likely to matter more than headline user counts.",
      "claimRefs": [
        "CI001",
        "CI002",
        "CI003",
        "CI004",
        "CI026",
        "CI027"
      ],
      "tableRefs": [
