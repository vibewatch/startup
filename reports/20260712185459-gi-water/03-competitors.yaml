    {
      "id": "incumbent-power-vs-local-niche",
      "title": "Scale, trust, and financing favor incumbents, while local niche proof favors GI",
      "body": "Incumbents still have the heavier hand on scale. SUEZ’s wastewater footprint, Xylem’s US$9 billion revenue base and 22,000 employees, and Veolia’s broad industrial offering all indicate a level of customer trust, balance-sheet support, and execution depth that GI does not yet match publicly. Metito matters for a different reason: it shows that Saudi wastewater budgets can be absorbed by regionally entrenched infrastructure players long before a startup gets a look. Those strengths matter most in long-cycle projects, large municipal budgets, and buyers who prioritize installed-base confidence. GI’s answer is not to out-scale those firms today. Its answer is local niche proof: Hajj slaughterhouse treatment, district-gap solutions, hotel and industrial references, localization claims, and a service model that can reduce upfront customer capex. That combination can matter in the early commercial stage, particularly where buyers need a fast-turn, site-level answer rather than a giant PPP.",
