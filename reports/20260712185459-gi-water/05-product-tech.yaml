  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "GI Water as a Service presents a modular wastewater-treatment portfolio built around portable and mobile assets, non-biological G-NANO treatment, and a pay-per-use WaaS wrapper. Public sources show real deployments in Saudi Arabia and at least one municipal pilot abroad, plus export and localization ambitions. But engineering proof remains company-mediated: the product looks credible and policy-aligned, yet still needs independent validation on performance, certification scope, and roadmap readiness."
  },
  "sections": [
    {
      "id": "product-surface",
      "title": "GI sells a flexible physical-treatment portfolio with WaaS as the commercial wrapper",
      "body": "GI’s public product surface is overwhelmingly physical and operational rather than digital or abstract. The company shows portable plants, mobile plants, capacity-upgrade units, and larger new-generation plants, then layers Water as a Service on top as the commercial delivery model. That matters because the core question is not whether GI has a single machine. It is whether it has a flexible kit of assets that can be deployed across different wastewater conditions, site sizes, and contract structures. The strongest evidence says yes. GI repeatedly describes site deployment, treatment on the customer premises, pay-per-volume charging, and retrieval or ongoing operation depending on the job. That framing makes the company look more like a modular infrastructure operator than a seller of standardized hardware boxes. It also explains why the product portfolio and the operating model have to be read together rather than as separate topics. It further implies a product organization that must coordinate engineering, operations, logistics, and compliance at the same time consistently.",
      "claimRefs": [
        "CE001",
        "CE002",
        "CE005",
        "CE006",
        "CE027"
      ],
      "tableRefs": [
