      ]
    },
    {
      "id": "technology-and-maturity",
      "title": "The public architecture is coherent, but most performance proof still comes from GI-controlled surfaces",
      "body": "On the technical layer, GI’s narrative is specific enough to be taken seriously but not yet independent enough to be taken at face value without diligence. G-NANO is described as a non-biological nanotechnology treatment approach built around highly reactive materials, compact treatment units, and circular outputs such as reusable water and managed sludge. Public projects reinforce that this is not just a lab story. The Hajj slaughterhouse, Riyadh Industrial STP, and Duzce pilot each describe real installations with clear capacity or operating details. Those references help establish maturity. But they do not fully solve verification. The most striking cycle-time, energy, footprint, and sludge claims are still company-mediated, even when echoed by media. So the product chapter can describe a plausible architecture and real deployment maturity, while still flagging engineering proof as incomplete.",
      "claimRefs": [
