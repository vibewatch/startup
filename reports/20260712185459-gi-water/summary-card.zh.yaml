  topStrengths:
    - 沙特缺水和政策支持为分布式污水回用方案创造了真实预算池。
    - Riyadh、Jeddah、Diriyah、Hajj 相关场景、Bahrain 以及法国出口计划等公开项目参考，比纯概念公司提供了更多运营证明。
    - 按立方米付费的 Water-as-a-Service 模式，能贴合客户降低前期资本开支、获得回用结果的需求。
    - 与 GI Aqua Tech 母平台的关联，以及 Sherif Desouky 的可见运营领导力，提升了战略连贯性。
  topRisks:
    - 经审计收入、利润率、留存、客户集中度、员工数和股权结构权利均未公开披露。
    - 公司仍很年轻，执行、监管和采购条件看起来高度集中在沙特。
    - 基础设施服务模式在经常性经济性被验证前，可能吃掉大量资本开支、许可成本和营运资金。
    - US$1.03B 标题估值接近公开乐观情景可支撑区间的上沿，容错空间很小。
