  topStrengths:
    - Saudi water scarcity and policy support create a real budget pool for decentralized wastewater reuse solutions.
    - Public project references across Riyadh, Jeddah, Diriyah, Hajj-related use cases, Bahrain, and France export plans provide more operating proof than a pure concept company.
    - The pay-per-cubic-meter Water-as-a-Service model can align well with customers seeking lower upfront capex and reuse outcomes.
    - Parent-platform linkage to GI Aqua Tech and visible operating leadership from Sherif Desouky improve strategic coherence.
  topRisks:
    - Audited revenue, margins, retention, concentration, headcount, and cap-table rights are not publicly disclosed.
    - The business is still young and appears heavily concentrated in Saudi execution, regulation, and procurement conditions.
    - Infrastructure-service models can absorb substantial capex, permitting, and working-capital risk before recurring economics are proven.
    - The US$1.03B headline sits near the top of what the public bull case can justify, leaving little room for disappointment.
  unresolvedGaps:
    - Exact legal-entity name, incorporation date, and ownership structure for GI Water as a Service.
    - Audited FY2024-FY2025 financials, management accounts, and cash-flow or margin data.
    - Customer concentration, renewal behavior, contract duration, and pricing detail by project type.
    - Series A legal terms, primary versus secondary mix, preference stack, and governance rights.
    - Independent evidence on current employee count, organizational depth, and board oversight.
disclaimer: >
  This report is a public-information diligence artifact prepared as of
