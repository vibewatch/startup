companyProfile:
  summary: >
    GI Water as a Service is a Riyadh-based private water-technology operator
    positioned as a Saudi subsidiary or affiliate of Germany-based GI Aqua
    Tech. Public sources consistently describe a decentralized wastewater
    treatment and reuse model sold on a pay-per-cubic-meter basis and support
    project activity across industrial, hospitality, district, seasonal, and
    export-adjacent use cases. The company has enough visible operating proof
    to be taken seriously as an infrastructure-service platform, but public
    disclosure remains sparse relative to its unicorn valuation.
  headquarters: Riyadh, Saudi Arabia
  productSummary: >
    Decentralized wastewater treatment and water-reuse systems built around the
    G-NANO platform, combining modular deployment, rapid treatment, reuse
    orientation, and low-upfront-capex service delivery.
  customerFocus: >
    Saudi municipalities, industrial facilities, hospitality and district
    developments, seasonal or event-driven wastewater sites, and government- or
    utility-linked water projects.
  businessModel: >
    Water-as-a-Service model monetized through pay-per-use or
    pay-per-cubic-meter treatment contracts rather than traditional
    customer-owned plant sales alone.
  stage: Series A / private-unicorn phase
  fundingStatus: >
    Public sources support a February 2025 Series A that pushed GI Water as a
    Service above the US$1 billion valuation threshold, with Saudi investors
    tied to Al Zamil and Al Qunaibet/Qunaibit, but exact check size and legal
    terms remain undisclosed beyond eight-figure language and a reported 5.8%
    equity clue.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO012, CO016, CO032]
summary:
  headline: >
    GI Water as a Service appears strategically credible and commercially worth
    following, but public evidence is still too thin on economics, governance,
    and round structure to endorse the current unicorn valuation with comfort.
  overallScore: 5.8
  recommendation: research-more
