coverageNotes: >
  Public evidence is strong enough to confirm GI Water as a Service's Saudi
  operating identity, its link to Germany-based parent GI Aqua Tech, the
  February 2025 Series A unicorn milestone, and multiple wastewater-treatment
  project references across Saudi Arabia with early Bahrain and France
  expansion signals. It remains materially incomplete on exact legal-entity
  name, founded date, audited revenue, customer concentration, renewal
  behavior, round documents, and cap-table rights. Because public web identity
  still appears to run through the parent GI Aqua Tech site rather than a
  standalone GI WaaS domain, valuation and recommendation judgments should be
  treated as directional pending direct diligence.
