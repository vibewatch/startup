company:
  name: "GoodLeap"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "GoodLeap operates a three-sided clean energy financing and software platform connecting contractors, homeowners, and capital providers through instant point-of-sale underwriting. Its technological footprint spans contractor sales software (GoodLeap Pros and Origin), consumer monitoring and IoT telemetry integration (GoodLeap Home), virtual power plant aggregation (GoodGrid), and institutional securitization pipes, while facing serious compliance risks regarding contractor handoffs and dealer fee transparency."
sections:
  - id: "section-pos-workflow"
    title: "Point-of-Sale Workflow & Contractor Software Suite"
    body: "GoodLeap's core operational engine is built around the contractor's point of sale, providing field sales professionals with mobile and web tools that eliminate administrative friction during residential consultations. Through the GoodLeap Pros mobile application and the Origin desktop portal, sales representatives can input basic homeowner demographic and property details to initiate automated underwriting. Rather than subjecting prospective borrowers to protracted credit applications, the platform performs real-time soft credit inquiries that return multiple personalized loan or lease proposals within seconds. Once a customer selects a financing structure, GoodLeap generates digital loan agreements supporting e-signatures directly on the sales representative's mobile device, allowing the contractor to secure project financing at the kitchen table. The company has extended this workflow with DeDe, an embedded conversational AI agent providing real-time assistance on project status, and GoodLeap Payments, a merchant processing suite supporting tap-to-pay, eChecks, and mobile card transactions with automated accounting reconciliation."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE004"
      - "CE009"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE001"
  - id: "section-architecture-telemetry"
    title: "Platform Architecture, IoT Telemetry & GoodGrid VPP"
    body: "Architecturally, GoodLeap functions as a digital switchboard connecting three distinct stakeholder networks: home improvement contractors requiring instant financing conversion, residential property owners seeking affordable monthly payments, and institutional capital providers purchasing standardized consumer credit assets. Behind the mobile client surfaces sits a cloud-based underwriting and decisioning engine that interfaces with credit bureaus and automated valuation models to standardize risk profiles. On the consumer side, the GoodLeap Home mobile app integrates directly with inverter and battery telemetry systems from major equipment manufacturers including Tesla, SolarEdge, Enphase, and QCells, allowing homeowners to monitor clean energy production and household power consumption. GoodLeap has leveraged this connected asset footprint through GoodGrid, a virtual power plant (VPP) initiative launched in 2024 that aggregates residential battery storage and smart thermostats. GoodGrid dispatches stored clean energy into regional electricity grids during peak demand windows, delivering over 50 megawatts of flexible capacity in California and Connecticut while targeting 1.5 gigawatts of managed capacity across a five-year horizon through utility partnerships with providers such as Reliant Energy."
    claimRefs:
      - "CE003"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE014"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "section-product-catalog-amortization"
    title: "Multi-Asset Catalog, Lease/PPA Pivot & Loan Structuring"
    body: "While initially recognized as a residential solar lender, GoodLeap has expanded its product catalog to finance a comprehensive range of sustainable home infrastructure, including high-efficiency HVAC units, heat pumps, roofing, windows, doors, water heaters, and smart home EV charging hardware up to $55,000. Historically, residential solar loans represented the dominant origination volume, often featuring an 18-month teaser amortization period designed to align with homeowner federal Investment Tax Credit (ITC) filings. Under this mechanism, monthly payments escalate significantly after month 18 unless the homeowner applies their tax refund toward principal reduction. In response to rising interest rates and the accelerated expiration of the 30% residential solar tax credit at year-end 2025, GoodLeap aggressively expanded into third-party-owned solar leases and power purchase agreements (PPAs), as well as dedicated HVAC leasing programs. Under these lease models, GoodLeap retains equipment ownership, provides ongoing maintenance coverage, and bills customers via fixed predictable annual escalators with buyout options after five years. Additionally, GoodLeap introduced the GoodLeap Home Visa Signature Card backed by home equity lines of credit, offering prime homeowners up to $150,000 in spending power with 6% cash back on qualifying home efficiency projects."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE009"
      - "CE012"
  - id: "section-compliance-controls"
    title: "Trust, Contractor Handoff & Point-of-Sale Compliance Vulnerabilities"
    body: "GoodLeap's rapid origination growth through third-party contractor networks introduces severe operational and legal vulnerabilities at the contractor handoff boundary. Because independent sales representatives conduct the kitchen-table presentation, aggressive sales tactics and inaccurate utility savings projections have sparked extensive customer disputes and regulatory scrutiny. State attorneys general, including the Minnesota Attorney General, alongside consumer class action litigators in federal courts, allege that GoodLeap and partner lenders violated consumer protection and truth-in-lending laws by failing to transparently disclose inflated dealer fees rolled into loan principal and presenting deceptive interest rates. Plaintiffs report that low headline interest rates were subsidized by substantial hidden contractor fees, creating substantial discrepancies between cash purchase prices and total financed balances. Although GoodLeap mandates contractor screening, independent project completion sign-offs, and digital document delivery through the GoodLeap Home application, the company's reliance on decentralized contractor sales forces creates persistent compliance risk, highlighting the technical and procedural challenge of verifying borrower consent and fee disclosures at the point of sale."
    claimRefs:
      - "CE002"
      - "CE013"
    tableRefs:
      - "TE002"
