company:
  name: "GoodLeap"
chapter:
  number: 3
  title: "Competitors"
  summary: "GoodLeap dominates point-of-sale sustainable home financing with over 6,800 active contractors and $68 billion in cumulative facilitation, but faces intense competitive tension across traditional solar point-of-sale peers (Mosaic, Sunlight Financial, Dividend), home-improvement SaaS platforms (Hearth, Wisetack), and balance-sheet lenders. The company's reliance on 15% to 30% contractor dealer fees to buy down interest rates has created acute legal and reputational exposure, highlighted by the active Minnesota Attorney General lawsuit and federal multi-district litigation over deceptive disclosures."
sections:
  - id: "competitive-landscape"
    title: "Competitive Landscape & Market Structure"
    body: |
      The point-of-sale financing landscape for sustainable home upgrades divides into three structural models: dealer-fee buy-down originators, software subscription and merchant-fee platforms, and balance-sheet depository lenders. GoodLeap has historically led the dealer-fee category, capturing approximately 30% of nationwide residential solar loans by offering promotional low-APR financing to homeowners while charging contractors an origination discount fee of 15% to 30%. This dealer fee is capitalized directly into the borrower's financed principal, allowing contractors to close high-ticket systems on low advertised monthly payments.

      Direct competitors operating identical or closely related dealer-fee models include Solar Mosaic, Sunlight Financial, and Dividend Solar Finance (a subsidiary of Fifth Third Bank). These specialized originators compete intensely for contractor distribution agreements, software integrations, and institutional capital access via credit unions and securitization conduits. Unlike integrated solar providers such as Sunrun or Sunnova that prioritize vertically integrated leases and direct sales forces, GoodLeap and its pure-play dealer-fee peers rely entirely on independent contractor networks to drive origination volume.

      Simultaneously, GoodLeap faces indirect substitution and adjacency pressure from home-improvement fintechs such as Hearth and Wisetack. Hearth operates a software subscription model charging contractors monthly fees with no principal markups, while Wisetack charges standard merchant transaction fees for service-sized tickets. Furthermore, traditional consumer banking alternatives—such as home equity lines of credit (HELOCs), clean energy credit unions (e.g., PenFed), and PACE financing—offer unencumbered, zero-dealer-fee financing, creating persistent disintermediation risks as consumer awareness of dealer fee inflation increases.
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP003"
      - "CP004"
      - "CP005"
    tableRefs:
      - "TP001"
    figureRefs:
      - "FP001"

  - id: "competitor-profiles-models"
    title: "Competitor Profiles & Structural Models"
    body: |
      Comparative examination of leading residential upgrade lenders illustrates the strategic tradeoffs governing the sector. Solar Mosaic has long served as GoodLeap's closest direct peer in pure-play residential solar lending, deploying dealer-fee structures across national solar installer networks. However, like GoodLeap, Mosaic has faced scrutiny over dealer fee markups and tightening secondary credit liquidity. Dividend Solar Finance, backed by the balance sheet of Fifth Third Bank, offers solar and home energy financing with bank-grade capital stability but operates under stricter underwriting guidelines that can constrain contractor sales velocity.

      Sunlight Financial illustrates the severe vulnerability of asset-light point-of-sale originators to capital market volatility, having navigated bankruptcy reorganization following interest rate spikes and warehouse capital freezes. In contrast to these solar-centric lenders, GreenSky (acquired by institutional investors after Goldman Sachs' divestiture) established the dealer-fee paradigm in broader home improvement verticals including HVAC, windows, and roofing. GreenSky's established position in HVAC and remodeling poses a direct barrier to GoodLeap's strategic diversification outside of solar.

      Outside the dealer-fee ecosystem, Hearth has captured significant contractor share by unbundling financing from predatory fee structures. By charging contractors a flat monthly software subscription, Hearth connects consumers to personal loan marketplaces where project quotes reflect genuine cash prices without 15% to 30% loan inflation. Wisetack addresses smaller, service-sized tickets through per-transaction merchant fees, dominating on-demand repairs. GoodLeap's competitive defense against these platforms relies on its integrated Origin and GoodLeap Pros workflow software, paired with institutional warehouse scale.
    claimRefs:
      - "CP006"
      - "CP007"
      - "CP008"
      - "CP009"
      - "CP010"
    tableRefs:
      - "TP002"

  - id: "differentiation-durability-adverse"
    title: "Differentiation Durability & Adverse Exposure"
    body: |
      GoodLeap's differentiation has historically rested on contractor workflow software lock-in, rapid point-of-sale credit decisioning through its Origin platform, and deep institutional capital access. The company has facilitated over $68 billion in lifetime originations and works with more than 6,800 active contractors across roofing, HVAC, siding, windows, and solar. To protect contractor relationships and combat solar loan volatility, GoodLeap expanded into third-party owned (TPO) leases and power purchase agreements (PPAs), securing over $1.5 billion in dedicated equity and debt commitments from Tactical Infrastructure Partners and ATLAS SP Partners, alongside multiple securitizations such as the $140.2M TIP Solar ABS 2025-2.

      However, GoodLeap's competitive moat faces systemic regulatory and litigation threats that strike at the foundation of its dealer-fee economics. In March 2024, the Minnesota Attorney General sued GoodLeap alongside Mosaic, Sunlight Financial, and Dividend, alleging deceptive trade practices and unlawful concealment of 15% to 30% dealer fees on over $200 million in solar projects. The litigation, which remains active and unresolved through 2026, alleges that lenders artificially inflated cash project costs by approximately $35 million without transparent disclosure.

      This state-level enforcement is compounded by widespread federal civil class actions and multi-district litigation alleging deceptive lending, hidden fees, and Truth in Lending Act (TILA) violations across California, Florida, and Texas. With class certification proceedings active in 2026, GoodLeap faces potential financial liabilities, mandatory fee disclosure reforms, and borrower restitution demands. If regulatory enforcement mandates transparent cash versus financed pricing at point of sale, contractor conversion rates could fall sharply, eliminating GoodLeap's historical pricing advantage over transparent personal loans and traditional HELOCs.
    claimRefs:
      - "CP011"
      - "CP012"
      - "CP013"
      - "CP014"
      - "CP015"
      - "CP016"
    tableRefs:
      - "TP003"

