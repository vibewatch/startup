          label: "Homeowner Upgrade Consultation"
          description: "Contractor presents solar or home upgrade proposal via mobile/web POS."
        - id: "step-2"
          label: "Point-of-Sale Loan Origination"
          description: "Instant credit decisioning across loan terms up to 25 years and amounts to $55K-$100K."
        - id: "step-3"
