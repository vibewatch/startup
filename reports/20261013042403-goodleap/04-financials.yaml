callouts:
  - calloutType: "risk"
    title: "Securitization Capital Dependency and Truth in Lending Litigation Exposure"
    claimRefs:
      - "CI010"
      - "CI011"
    body: |
      GoodLeap's financing throughput relies on uninterrupted ABS investor demand and warehouse credit lines. Mounting regulatory and class action scrutiny under the Truth in Lending Act regarding hidden contractor dealer fees creates unquantified contingent liabilities and threatens potential mandatory restructuring of dealer pricing models.
  - calloutType: "insight"
    title: "Capital Velocity Without Transparent Private Unit Economics"
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI012"
    body: |
      While GoodLeap demonstrates undeniable origination scale with over $38 billion in facilitated financing and 26 completed securitizations, the company maintains private financial opacity. Neither net take rates nor current cash burn trajectories are publicly disclosed, requiring investors to underwrite capital velocity rather than verifiable corporate earnings.
