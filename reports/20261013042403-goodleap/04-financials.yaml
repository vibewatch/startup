    type: "flow"
    summary: "Six-stage workflow tracing homeowner project origination through POS credit decisioning, dealer fee monetization, warehouse funding, and ABS term securitization."
    approximationNotes: "Flow sequence illustrates structural capital velocity and monetization points; exact dealer fee margins and secondary servicing spreads are unreleased private metrics."
