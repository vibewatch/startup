          description: "Pools packaged into asset-backed trusts sponsored by institutional bookrunners."
        - id: "step-6"
          label: "Platform Servicing & Secondary Revenue"
          description: "Ongoing servicing fees, payment processing revenue, and home card monetization."
      edges:
