chapter:
  number: 7
  title: "Risks"
  summary: "GoodLeap faces compounding legal, regulatory, and credit risks driven by undisclosed 15% to 35% dealer fee markups, adverse TILA rulings in federal MDL 3128, Minnesota AG consumer fraud litigation, and systemic contractor insolvency under the FTC Holder Rule."
sections:
  - id: "regulatory-litigation-exposure"
    title: "Regulatory and Consumer Finance Litigation Exposure"
    body: "GoodLeap's point-of-sale financing model faces severe judicial and regulatory challenges centered on loan transparency and fee disclosure. In March 2024, Minnesota Attorney General Keith Ellison filed a major consumer protection lawsuit alleging that GoodLeap and affiliated lenders extracted over $35 million in undisclosed dealer fees across more than 5,000 Minnesota solar loans, packing an average markup of 19.32% or $7,552 into borrower principal balances while contractually prohibiting solar contractors from disclosing the markup. In federal court, multidistrict litigation consolidated under MDL No. 3128 advanced significantly in August 2025 when U.S. District Judge Katherine Menendez denied GoodLeap's motion to dismiss Truth in Lending Act (TILA) claims, holding that concealed solar platform fees passed through in contract prices can legally constitute undisclosed finance charges. With class certification proceedings active in 2026 and concurrent regulatory scrutiny from the CFPB and attorneys general in California, Florida, and Texas, GoodLeap faces material balance sheet exposure to statutory rescission, mandatory fee refunds, and permanent operational injunctions."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR011"
    tableRefs:
      - "TR001"
  - id: "dealer-fees-and-contractor-agency"
    title: "Dealer Fee Markups, Payment Cliffs, and Contractor Liability"
    body: "The core consumer controversy surrounding GoodLeap loans involves the interaction between buy-down dealer fees, aggressive point-of-sale sales practices, and structural payment escalation. To offer promotional headline APRs as low as 1.99% or 2.99%, GoodLeap assesses contractors upfront financing fees ranging from 15% to 35%, which sales representatives routinely roll into the gross financed system price without itemized TILA disclosure. Homeowners subsequently confront an 18-month re-amortization structure: monthly payments are initially underwritten assuming borrowers make a voluntary 30% principal paydown using federal solar tax credits. When fixed-income retirees or lower-income homeowners lack sufficient federal tax liability to monetize the non-refundable credit, monthly payments jump permanently by 30% to 50% at Month 19. Compounding these structural frictions, widespread contractor bankruptcies—such as the collapse of Pink Energy—have left thousands of consumers servicing loans for non-functional or abandoned systems. Under the FTC Holder Rule (16 C.F.R. § 433.2) and landmark arbitration precedent affirmed in Georgia, GoodLeap has been held legally liable as an active principal for installer misrepresentations, forcing loan cancellations and affirmative restitution. Furthermore, GoodLeap's practice of recording UCC-1 fixture liens creates persistent title clouds that delay or derail residential real estate sales when lien releases are mishandled."
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR013"
    tableRefs:
      - "TR002"
  - id: "capital-markets-and-funding-dependencies"
    title: "Capital Markets Dependencies and Counterparty Concentration"
    body: "GoodLeap functions as a balance-sheet-light originator that depends entirely on institutional debt capital, warehouse lines, and secondary market securitization to fund its loan volumes. The platform has originated over $30 billion in financing for more than 1.4 million homeowners, but this scale requires uninterrupted access to asset-backed securitization (ABS) markets. Through late 2025, GoodLeap completed 24 securitizations totaling billions of dollars backed by corporate underwriting partners including Goldman Sachs, Bank of America, and CIBC. In October 2024, GoodLeap structured a $1.5 billion strategic funding partnership with Tactical Infrastructure Partners and ATLAS SP Partners to finance residential solar and energy storage systems. However, this model creates acute vulnerability to macroeconomic interest rate shifts and ABS spread widening: rising benchmark rates compress origination spreads, while deteriorating solar loan credit curves and rising legal headline risk could trigger warehouse covenant breaches or rating agency downgrades. To mitigate concentration in solar loans, GoodLeap is attempting to diversify into HVAC leasing, home efficiency financing, and a home-equity-backed Visa card issued with Cross River Bank, but solar loans remain the primary engine of platform throughput."
    claimRefs:
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR012"
    tableRefs:
      - "TR003"
  - id: "risk-matrix-and-thesis-break-triggers"
    title: "Risk Synthesis, Monitoring Indicators, and Thesis-Break Triggers"
    body: "A comprehensive assessment of GoodLeap's risk profile reveals that regulatory liability and channel vulnerability represent immediate threats to the company's operating thesis and historical $12 billion private valuation mark. GoodLeap's private valuation was set in October 2021 during an era of near-zero interest rates and uninhibited residential solar growth; it has not been marked down publicly despite substantial comparable multiple compression and higher capital costs across clean energy fintech. Crucial monitoring indicators include federal class certification rulings in MDL 3128, multi-state attorney general settlement demands, ABS senior note credit spreads, and contractor portal retention rates across its 18,000-sales-rep network. Specific thesis-break triggers that would invalidate an investment thesis include: (1) class certification in MDL 3128 holding GoodLeap liable for statutory TILA damages across historical origination vintages; (2) formal consent orders by the CFPB or multi-state AG coalitions mandating restitution of dealer fee markups and prohibiting buy-down pricing structures; (3) warehouse credit facility freeze or rating downgrades on GoodLeap ABS issuances; and (4) mass defection of tier-one regional HVAC and solar installation networks to competing point-of-sale platforms."
    claimRefs:
      - "CR001"
      - "CR004"
      - "CR005"
      - "CR009"
      - "CR014"
    figureRefs:
      - "FR001"
