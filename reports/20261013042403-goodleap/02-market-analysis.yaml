callouts:
  - calloutType: "risk"
    title: "Post-ITC Market Reorientation and TPO Transition"
    body: "The expiration of the federal 30% residential solar tax credit on December 31, 2025 under H.R. 1 fundamentally reshapes residential solar demand. With customer-owned solar loans losing direct tax incentives, originators must pivot toward third-party owned (TPO) leases, PPAs, and non-solar home efficiency loans (HVAC, heat pumps, roofing) to sustain origination volume."
    claimRefs:
      - "CM004"
      - "CM011"
      - "CM012"
  - calloutType: "insight"
    title: "Contractor Platform Entrenchment vs. Legal Scrutiny"
    body: "GoodLeap's distribution moat rests on 18,000+ sales professionals using its Origin and GoodLeap Pros software. However, nationwide litigation alleging deceptive dealer fee disclosure threatens this contractor-led acquisition engine by increasing regulatory overhead and potential scrutiny from the CFPB and state attorneys general."
    claimRefs:
      - "CM008"
      - "CM014"
      - "CM015"
