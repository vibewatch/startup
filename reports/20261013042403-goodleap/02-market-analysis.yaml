chapter:
  number: 2
  title: "Market Analysis"
  summary: "GoodLeap anchors its market footprint as the leading point-of-sale financing platform for U.S. residential solar, holding approximately 30% of residential solar loans nationwide and over $32 billion in cumulative facilitated loans across 1.2 million homeowners. The company faces a profound structural inflection as the federal 30% residential solar tax credit expired on December 31, 2025 under H.R. 1, driving a decisive market shift from homeowner-owned loans toward third-party ownership (TPO leases and PPAs), virtual power plant (VPP) battery aggregation, and broader home efficiency upgrades including HVAC, roofing, and heat pumps."
sections:
  - id: "market-boundary-and-scope"
    title: "Market Boundary, Scope, and Status-Quo Substitutes"
    body: |
      Defining the addressable market boundary for GoodLeap requires separating point-of-sale (POS) clean energy financing from general consumer lending and traditional retail home equity. GoodLeap's core market encompasses point-of-sale origination, loan servicing, lease and power purchase agreement (PPA) origination, and virtual power plant aggregation for residential clean energy assets across all 50 states. Included spend comprises residential rooftop photovoltaic (PV) solar installations, battery energy storage systems (BESS), heat pumps, high-efficiency HVAC equipment, roofing replacements, and smart electrical panels. Excluded from this boundary are utility-scale solar generation, commercial and industrial (C&I) solar, non-energy luxury home renovations, and primary residential first mortgages.

      Within this defined boundary, the primary status-quo substitutes are traditional unsecured personal loans from regional banks, home equity lines of credit (HELOCs), and cash purchases by homeowners. Unlike direct bank loans, GoodLeap embeds its financing workflow directly into contractor sales tools used by over 18,000 sales professionals, enabling instant credit decisions at the kitchen table. However, as interest rates fluctuate and capital markets evolve, these status-quo substitutes present differing friction points. Direct cash purchases eliminate financing dealer fees, while utility-provided on-bill financing and community solar programs emerge as adjacent alternative pathways for homeowners seeking clean energy without long-term debt commitments.
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM004"
    tableRefs:
      - "TM001"
  - id: "tam-sam-som-sizing"
    title: "Addressable Market Sizing and Constrained Sizing Lenses"
    body: |
      Evaluating GoodLeap's addressable market necessitates multiple constrained sizing lenses rather than a single speculative top-down figure. At the broadest level, the total addressable market (TAM) spans the entire U.S. residential home improvement and modernization sector, estimated at upwards of $450 billion annually, with residential clean energy and efficiency upgrades accounting for approximately $50 billion to $70 billion. The serviceable addressable market (SAM) narrows to single-family owner-occupied homes with suitable roof geometry, credit scores of 650 or higher, and adequate utility electric rate differentials to deliver positive economic savings, representing approximately $25 billion to $35 billion in annual capital expenditure.

      GoodLeap's serviceable obtainable market (SOM) is constrained by contractor partner penetration, asset-backed securitization (ABS) liquidity, state licensing, and installer solvency. Historically, GoodLeap has captured an estimated $4 billion to $6 billion in annual origination volume, backed by cumulative platform facilitation of over $32 billion in loans across more than 1.2 million homeowners. Independent analyst teardowns indicate GoodLeap finances approximately 30% of all residential solar loans in the United States, with earlier peak estimates reaching up to 41% during the low-interest-rate expansion. However, the market size is fundamentally realigning as capital-market warehouse capacity and dealer fee economics determine installer platform selection.
    claimRefs:
      - "CM001"
      - "CM005"
      - "CM006"
      - "CM007"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyer-and-contractor-segmentation"
    title: "Buyer, Contractor, and Capital Partner Segmentation"
    body: |
      GoodLeap's commercial model operates as a multi-sided ecosystem connecting homeowners (borrowers/lessees), trade contractors (originators), and institutional capital partners (ABS investors and credit facilities). The primary consumer buyer is a single-family homeowner seeking to reduce monthly utility expenditures or replace failing mechanical systems such as HVAC and roofing. These homeowners evaluate purchases on monthly cash flow impact rather than total contract price, creating vulnerability when dealer fees inflate principal balances.

      The contractor constitutes the critical distribution channel and effective purchasing gatekeeper. Over 18,000 sales professionals utilize GoodLeap's Origin and GoodLeap Pros platforms to generate instant quotes and credit decisions. Contractor loyalty depends on approval speed, platform reliability, dealer fee transparency, and prompt milestone disbursement. Simultaneously, institutional capital partners—including warehouse lenders like Goldman Sachs and strategic asset partners like Tactical Infrastructure Partners and ATLAS SP Partners—serve as the underlying liquidity providers, purchasing originations and funding securitization trusts such as the $523 million GoodLeap Home Improvement Solutions Trust 2025-3.
    claimRefs:
      - "CM003"
      - "CM008"
      - "CM009"
      - "CM010"
    tableRefs:
      - "TM003"
  - id: "growth-drivers-and-adoption-constraints"
    title: "Growth Drivers, Regulatory Shifts, and Adoption Constraints"
    body: |
      The adoption environment for residential sustainable home solutions is governed by acute macro drivers and countervailing regulatory and legal constraints. The most disruptive market catalyst occurred in July 2025 when Congress enacted H.R. 1, also known as the One Big Beautiful Bill (OBBB). This legislation accelerated the expiration of the federal 30% residential solar Investment Tax Credit (ITC) / Residential Clean Energy Credit to December 31, 2025, terminating the tax credit that had previously been scheduled to run through 2032. This statutory cliff abruptly altered consumer financing economics, removing the 30% tax credit subsidy for customer-owned solar loans placed in service after 2025 and driving rapid adoption of third-party ownership leases and PPAs where commercial incentives still apply.

      Countervailing growth drivers include rising retail utility electricity rates, extreme weather driving demand for backup battery storage, and virtual power plant (VPP) incentives through programs like GoodGrid and utility partnerships. Conversely, adoption faces severe headwinds from consumer-finance legal scrutiny and interest rate volatility. GoodLeap is named in active class action litigation across multiple U.S. District Courts and state attorney general actions (notably Minnesota), alleging deceptive lending practices, undisclosed dealer fees, and Truth in Lending Act violations regarding solar loans totaling over $12 billion in originations. These regulatory and legal pressures impose tighter compliance overhead, contract revisions, and potential financial settlement liabilities.
    claimRefs:
      - "CM011"
      - "CM012"
      - "CM013"
      - "CM014"
      - "CM015"
