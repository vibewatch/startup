company:
  name: "GoodLeap"
chapter:
  number: 1
  title: "Company Overview"
  summary: "GoodLeap is a private residential-finance and software company that evolved from Paramount Equity Mortgage into a broader sustainable-home platform. Its last visible equity mark remains the $12 billion October 2021 valuation, while current revenue, profitability, ownership, and even headcount remain insufficiently disclosed or internally inconsistent in the assigned public evidence."
sections:
  - id: "identity-and-business-model"
    title: "Identity and business model"
    body: >-
      GoodLeap traces its operating history to Paramount Equity Mortgage, founded in 2003 by
      Hayes Barnard, Jason Walker, and Matt Dawson. The assigned independent profiles identify
      Roseville, California as headquarters and GoodLeap, LLC as the legal entity, while the
      company remains privately held. The company now presents itself as a financing and
      software platform for sustainable home improvements rather than as a solar-only lender.
      Its official pages cover solar, batteries, HVAC, roofing, windows, other efficiency
      upgrades, contractor workflow software, payment tools, and homeowner financing. The June
      2021 change from Loanpal to GoodLeap marked that broader positioning. This is a
      multi-sided model: homeowners seek project financing, contractors use point-of-sale and
      operating tools, and institutional capital participates through loan purchases and
      securitizations. The available evidence supports the product perimeter, but it does not
      disclose current revenue by product or the economics retained by GoodLeap after assets
      are distributed.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
    figureRefs: []
  - id: "founders-leadership-and-governance"
    title: "Founders, leadership, and governance"
    body: >-
      Founder continuity remains visible: Hayes Barnard is identified as founder, chairman,
      and chief executive officer, while Jason Walker and Matt Dawson are named as co-founders.
      John Shrewsberry is identified as chief financial officer by both an independent profile
      and the Wikipedia source. These public records establish a recognizable operating bench,
      but they do not establish the complete board, voting control, succession arrangements, or
      current ownership percentages. That distinction matters because a founder-led private
      company can combine strategic continuity with concentrated key-person and governance
      risk. The evidence also contains inconsistent titles for Daniel Lotano across public
      profiles, so this chapter does not force a definitive current role. The leadership table
      is therefore a bounded enumeration of people whose roles are consistently supportable,
      not a claim that the full executive team or governing body has been captured. Confirming
      board seats, reserved matters, founder voting power, and executive succession requires
      private-company records.
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO002"
    figureRefs: []
  - id: "capital-scale-and-stakeholders"
    title: "Capital, scale, and stakeholders"
    body: >-
      GoodLeap raised two reported $800 million equity rounds in 2021: a January financing
      involving New Enterprise Associates, WestCap, Brookfield, and Riverstone, followed by an
      October round led by MSD Partners with BDT Capital and Davidson Kempner participation.
      The latter established a $12 billion post-money valuation. The August 2026 independent
      profile still presents that 2021 transaction as the latest visible valuation, so it is a
      historical mark rather than evidence of current fair value or cash availability.
      Separate profile metrics report more than $32 billion of loans facilitated and more than
      1.2 million homeowners served, but those cumulative measures are neither revenue nor
      recurring revenue. A 2022 company release illustrates the capital-distribution model:
      its thirteenth securitization was backed by $467 million of residential solar loans made
      to approximately 11,000 homeowners. Equity sponsors, credit counterparties, contractors,
      and homeowners are consequently all economically important, while the current cap table
      and preference stack remain unavailable.
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO014"
    tableRefs:
      - "TO003"
    figureRefs: []
  - id: "milestones-uncertainty-and-adverse-signals"
    title: "Milestones, uncertainty, and adverse signals"
    body: >-
      The milestone record shows a long operating history, a deliberate expansion beyond
      residential solar, and repeated access to institutional capital. It also shows why scale
      metrics must be read carefully. The assigned 2026 profile contains employee estimates
      ranging from 638 to 1,497, too wide to support a single current headcount. EnergySage
      displays a 3.1 rating and states that GoodLeap has not been screened or verified for its
      network; that is an adverse platform signal, not a comprehensive measure of borrower
      satisfaction. The Wikipedia source also reports a Minnesota Attorney General suit filed
      in March 2024 against GoodLeap and three other lenders, alleging deceptive lending and
      trade-practice violations. Because the assigned pool does not include the underlying
      complaint or a current docket, the allegations are retained as an adverse historical
      event rather than treated as an adjudicated finding or a statement of current case
      status. Current audited financials, litigation posture, and governance records remain
      priority diligence items.
    claimRefs:
      - "CO013"
      - "CO015"
      - "CO016"
    tableRefs: []
    figureRefs:
      - "FO001"
