figures:
  - id: "FO001"
    title: "Company milestone timeline"
    type: "timeline"
    summary: "The company progressed from mortgage origination to a broader sustainable-home platform while retaining a stale 2021 valuation anchor and accumulating consumer-finance scrutiny."
    data:
      items:
        - label: "2003"
          detail: "Paramount Equity Mortgage is founded by Hayes Barnard, Jason Walker, and Matt Dawson."
          tone: "neutral"
        - label: "December 2017"
          detail: "The predecessor business begins originating residential solar loans and later operates as Loanpal."
          tone: "positive"
        - label: "January 2021"
          detail: "Loanpal raises a reported $800 million from an investor group including NEA, WestCap, Brookfield, and Riverstone."
          tone: "positive"
        - label: "June 2021"
          detail: "Loanpal rebrands as GoodLeap to reflect expansion beyond solar into broader sustainable-home improvements."
          tone: "positive"
        - label: "October 2021"
          detail: "GoodLeap raises another $800 million at a reported $12 billion post-money valuation."
          tone: "positive"
        - label: "May 2022"
          detail: "GoodLeap announces its thirteenth securitization, backed by $467 million of residential solar loans."
          tone: "neutral"
        - label: "December 2023"
          detail: "John Shrewsberry is identified as chief financial officer."
          tone: "neutral"
        - label: "March 2024"
          detail: "The Minnesota Attorney General files suit against GoodLeap and three other lenders; allegations are not treated here as adjudicated findings."
          tone: "risk"
        - label: "August 2024"
          detail: "GoodLeap launches the GoodGrid virtual power plant initiative in California."
          tone: "positive"
        - label: "2026 evidence snapshot"
          detail: "The assigned profile still points to the 2021 valuation and shows materially divergent headcount estimates."
          tone: "risk"
    approximationNotes: "Dates are limited to the granularity stated in retained sources; the 2026 item is an evidence snapshot, not a corporate event date."
    claimRefs:
