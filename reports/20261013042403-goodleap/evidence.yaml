      and credit unions amidst higher interest rates.
    diligencePath: >-
      Cross-reference state UCC filing databases, Wood Mackenzie U.S. Solar Leaderboards, and ABS presale disclosure
      reports.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
