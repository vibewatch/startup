evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Current audited revenue by product, recurring revenue, gross margin, profitability, cash balance, burn, debt, and
      preference-stack data.
    whyItMatters: >-
      Cumulative loans and funding raised cannot establish operating economics, liquidity, or the value available to a
      new equity investor.
    diligencePath: >-
      Request audited financial statements, monthly management accounts, cash and debt schedules, and the fully diluted
      cap table under NDA.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance-and-ownership
    missingEvidence: >-
      Complete executive and board roster, founder voting rights, board seats, current ownership, liquidation
      preferences, and succession plans.
    whyItMatters: The public roster cannot establish decision rights, governance protections, dilution, or key-person mitigation.
    diligencePath: >-
      Obtain the current cap table, charter, bylaws, investor-rights agreements, board minutes, and executive succession
      plan.
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A company-confirmed employee count with a stated inclusion basis and measurement date.
    whyItMatters: The 638-to-1,497 spread is too large for a reliable operating-scale or cost-base inference.
    diligencePath: Reconcile payroll, HRIS, contractor, and location records to a single dated full-time-equivalent definition.
    relatedQuestionRefs:
      - QO005
      - QO010
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: regulatory-litigation
    missingEvidence: >-
      The underlying Minnesota complaint, current docket status, company response, and any reserve or settlement
      information.
    whyItMatters: A secondary summary of allegations cannot establish merits, current exposure, or operational remediation.
    diligencePath: Review the official complaint and docket, then obtain counsel's matter schedule and loss-reserve assessment.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: revenue-run-rate-by-product
    missingEvidence: >-
      Audited financial disclosure breaking down 2025-2026 annual revenue across residential solar loans, home
      improvement installment loans, lease/PPA asset management fees, and GoodGrid VPP software revenues.
    whyItMatters: >-
      Essential to quantify whether rapid expansion into HVAC and roofing loans offsets slowing rooftop solar loan
      demand following the December 2025 expiration of the federal 30% solar tax credit.
    diligencePath: >-
      Review audited private financial statements, warehouse facility compliance certificates, and secondary ABS
      investor offering circulars.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
