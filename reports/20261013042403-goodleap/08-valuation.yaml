        - "Margin compression from higher funding costs; slowing installer network growth"
        - "55% (Moderate)"
      - - "Bear Case"
        - "Class certification granted; dealer fee bans or restitution ordered; ABS spreads widen sharply"
        - "$1.5B - $2.5B (3-5x ARR); severe down-round, structural cram-down, or distress"
        - "Loss of key warehouse lending partners; installer network churn; regulatory penalties"
        - "30% (Elevated)"
    notes: "Forward-looking scenario analysis based on estimated $500M ARR baseline, prevailing clean-tech multiples, and potential litigation outcomes."
