      - number: '4.4'
        title: Capital Adequacy, Warehouse Facilities, and Securitization Dependency
        blocks:
          - type: paragraph
            body: >
              GoodLeap's business model depends on continuous liquidity from warehouse credit facilities, forward flow
              purchase commitments, and term asset-backed securitizations (ABS) to fund originations without consuming
              equity capital. Supported by Tier-1 institutional bookrunners including Bank of America, Goldman Sachs,
              CIBC, and Citigroup, the platform has completed 26 securitizations since launching its structured finance
              program. In October 2026, the company closed GoodLeap Home Improvement Solutions Trust 2026-2, an ABS
              transaction backed by $434 million in originated loan principal that secured investment-grade credit
              ratings from KBRA and Fitch Ratings. The platform's lifetime capitalization combines $800 million in
              growth equity raised in October 2021 at a $12 billion valuation with multi-billion-dollar strategic
              funding commitments from institutional asset managers. While these facilities demonstrate robust ongoing
              capital markets access, the company remains highly sensitive to secondary securitization spreads, advance
              rates, and institutional appetite for ESG-labeled consumer credit assets.
            claimRefs:
              - CI008
              - CI009
              - CI012
              - CI014
      - number: '4.5'
        title: Consumer Protection Litigation Exposure and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >
              The primary financial vulnerability confronting GoodLeap is mounting legal and regulatory scrutiny over
              point-of-sale solar loan disclosures and contractor dealer fees. The State of Minnesota filed a federal
              civil enforcement action against GoodLeap, solar financing peers, and banking partners alleging violations
              of the Truth in Lending Act regarding deceptively structured home financing. Concurrently, consumer
              plaintiffs in coordinated class actions allege that GoodLeap obscured substantial dealer fees—often
              inflating system installation costs by 20% to 30%—while failing to present clear total repayment
              obligations to borrowers. These actions threaten potential restitution liabilities, statutory damages, and
              operational disruption if dealer fee disclosure structures require mandatory revision. Consequently, while
              GoodLeap demonstrates superior platform scale and established capital markets execution, the combination
              of opaque private margins and unquantified litigation reserves precludes an unconditional underwriting
              endorsement at this juncture.
            claimRefs:
              - CI007
              - CI010
              - CI011
              - CI012
      - number: '4.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Securitization Capital Dependency and Truth in Lending Litigation Exposure
            body: >
              GoodLeap's financing throughput relies on uninterrupted ABS investor demand and warehouse credit lines.
              Mounting regulatory and class action scrutiny under the Truth in Lending Act regarding hidden contractor
              dealer fees creates unquantified contingent liabilities and threatens potential mandatory restructuring of
              dealer pricing models.
            calloutType: risk
            claimRefs:
              - CI010
              - CI011
          - type: callout
            title: Capital Velocity Without Transparent Private Unit Economics
            body: >
              While GoodLeap demonstrates undeniable origination scale with over $38 billion in facilitated financing
              and 26 completed securitizations, the company maintains private financial opacity. Neither net take rates
              nor current cash burn trajectories are publicly disclosed, requiring investors to underwrite capital
              velocity rather than verifiable corporate earnings.
            calloutType: insight
            claimRefs:
              - CI007
              - CI008
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Point-of-Sale Workflow & Contractor Software Suite
        blocks:
          - type: paragraph
            body: >-
              GoodLeap's core operational engine is built around the contractor's point of sale, providing field sales
              professionals with mobile and web tools that eliminate administrative friction during residential
              consultations. Through the GoodLeap Pros mobile application and the Origin desktop portal, sales
              representatives can input basic homeowner demographic and property details to initiate automated
              underwriting. Rather than subjecting prospective borrowers to protracted credit applications, the platform
              performs real-time soft credit inquiries that return multiple personalized loan or lease proposals within
              seconds. Once a customer selects a financing structure, GoodLeap generates digital loan agreements
              supporting e-signatures directly on the sales representative's mobile device, allowing the contractor to
              secure project financing at the kitchen table. The company has extended this workflow with DeDe, an
              embedded conversational AI agent providing real-time assistance on project status, and GoodLeap Payments,
              a merchant processing suite supporting tap-to-pay, eChecks, and mobile card transactions with automated
              accounting reconciliation.
            claimRefs:
