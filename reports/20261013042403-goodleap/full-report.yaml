            body: >-
              The operational separation between independent contractor sales pitches and GoodLeap's financing
              underwriting exposes the platform to significant regulatory scrutiny, where undisclosed dealer markups and
              aggressive sales representations have catalyzed multi-state consumer protection litigation.
            calloutType: risk
