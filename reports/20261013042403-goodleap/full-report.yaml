  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >
              Defining the addressable market boundary for GoodLeap requires separating point-of-sale (POS) clean energy
              financing from general consumer lending and traditional retail home equity. GoodLeap's core market
              encompasses point-of-sale origination, loan servicing, lease and power purchase agreement (PPA)
              origination, and virtual power plant aggregation for residential clean energy assets across all 50 states.
              Included spend comprises residential rooftop photovoltaic (PV) solar installations, battery energy storage
              systems (BESS), heat pumps, high-efficiency HVAC equipment, roofing replacements, and smart electrical
              panels. Excluded from this boundary are utility-scale solar generation, commercial and industrial (C&I)
              solar, non-energy luxury home renovations, and primary residential first mortgages.


              Within this defined boundary, the primary status-quo substitutes are traditional unsecured personal loans
              from regional banks, home equity lines of credit (HELOCs), and cash purchases by homeowners. Unlike direct
              bank loans, GoodLeap embeds its financing workflow directly into contractor sales tools used by over
              18,000 sales professionals, enabling instant credit decisions at the kitchen table. However, as interest
              rates fluctuate and capital markets evolve, these status-quo substitutes present differing friction
              points. Direct cash purchases eliminate financing dealer fees, while utility-provided on-bill financing
              and community solar programs emerge as adjacent alternative pathways for homeowners seeking clean energy
              without long-term debt commitments.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
      - number: '2.2'
        title: Addressable Market Sizing and Constrained Sizing Lenses
        blocks:
          - type: paragraph
            body: >
              Evaluating GoodLeap's addressable market necessitates multiple constrained sizing lenses rather than a
              single speculative top-down figure. At the broadest level, the total addressable market (TAM) spans the
              entire U.S. residential home improvement and modernization sector, estimated at upwards of $450 billion
              annually, with residential clean energy and efficiency upgrades accounting for approximately $50 billion
              to $70 billion. The serviceable addressable market (SAM) narrows to single-family owner-occupied homes
              with suitable roof geometry, credit scores of 650 or higher, and adequate utility electric rate
              differentials to deliver positive economic savings, representing approximately $25 billion to $35 billion
              in annual capital expenditure.


              GoodLeap's serviceable obtainable market (SOM) is constrained by contractor partner penetration,
              asset-backed securitization (ABS) liquidity, state licensing, and installer solvency. Historically,
              GoodLeap has captured an estimated $4 billion to $6 billion in annual origination volume, backed by
              cumulative platform facilitation of over $32 billion in loans across more than 1.2 million homeowners.
              Independent analyst teardowns indicate GoodLeap finances approximately 30% of all residential solar loans
              in the United States, with earlier peak estimates reaching up to 41% during the low-interest-rate
              expansion. However, the market size is fundamentally realigning as capital-market warehouse capacity and
              dealer fee economics determine installer platform selection.
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
