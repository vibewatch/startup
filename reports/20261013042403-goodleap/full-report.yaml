            title: Stale Peak-Cycle Valuation Mark
            body: >-
              GoodLeap's $12 billion post-money valuation from October 2021 has not been re-marked in five years,
              creating substantial downside risk in a higher-rate regime where clean-tech multiples have contracted by
              50% to 70%.
