            body: >-
              Judge Menendez's August 2025 ruling establishes that concealed dealer markups can constitute statutory
              TILA finance charges, exposing GoodLeap to systemic damage claims and loan rescission across thousands of
              contracts.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
          - type: callout
            title: Contractor Agency and FTC Holder Vulnerability
            body: >-
              GoodLeap cannot insulate its loan portfolio from contractor fraud or bankruptcy; Georgia arbitration
              precedents confirm that deep operational oversight makes lenders legally accountable for installer
              defaults.
            calloutType: insight
            claimRefs:
              - CR005
              - CR007
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Recommendation Framework
        blocks:
          - type: paragraph
            body: >-
              GoodLeap presents the profile of an entrenched residential clean-energy point-of-sale financing incumbent
              navigating structural industry headwinds. While the company established category dominance by facilitating
              over $32 billion in cumulative sustainable home upgrade loans for more than 1.2 million homeowners, its
              capital structure remains anchored to an unadjusted $12 billion private valuation set during the October
              2021 liquidity peak. In the intervening years, macroeconomic interest rate increases, residential solar
              market contraction, and heightened regulatory and legal scrutiny across consumer finance have compressed
              comparable fintech and clean-tech multiples by more than half. Public disclosures offer no updated 409A
              marks, audited balance sheets, or secondary pricing evidence to justify the historical valuation.
              Consequently, the disciplined investment stance is track with medium confidence and a high risk rating,
              pending audited operating disclosures and litigation clarity.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
