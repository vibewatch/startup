      - number: '8.2'
        title: Core Thesis Versus Anti-Thesis Drivers
        blocks:
          - type: paragraph
            body: >-
              Underwriting GoodLeap requires balancing undeniable network scale against acute credit and legal
              exposures. The bull thesis emphasizes GoodLeap's nationwide footprint of over 18,000 contractor sales
              professionals, proprietary point-of-sale software, and continued institutional capital markets access,
              evidenced by late-2025 securitizations totaling over $323 million in solar lease and power purchase
              agreement assets. The company is actively pursuing product diversification through its GoodLeap Home Card
              HELOC offering up to $150,000 in home-equity spending power, GoodGrid virtual power plant battery
              aggregation, and contractor payment tools. Conversely, the anti-thesis highlights active 2026 multistate
              consumer class actions alleging Truth in Lending Act violations and deceptive concealment of installer
              dealer fees rolled into loan principals. If plaintiffs achieve class certification or force regulatory
              remediation, GoodLeap faces material cash restitution liabilities and severe origination margin
              compression.
            claimRefs:
              - CV002
              - CV006
              - CV008
              - CV009
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
      - number: '8.3'
        title: Valuation Overhang and Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              Evaluating GoodLeap's implied equity value highlights a stark divergence between private headline marks
              and fundamental market realities. GoodLeap's $12 billion valuation from its $800 million round in October
              2021 translates to approximately 24x estimated 2024 annual recurring revenue of $500 million, compared to
              historical 2020 revenues of $361 million. In current market conditions, publicly traded clean-energy
              financing and consumer point-of-sale platforms trade between 6x and 12x revenue or forward earnings
              multiples. Our scenario analysis indicates that a base-case normalization values GoodLeap between $4.0
              billion and $6.0 billion, reflecting steady debt warehouse execution, moderate non-solar growth, and
              litigation settlement reserves. A bear case driven by class-action damages, dealer fee restructuring, and
              widening asset-backed securitization credit spreads points to an equity valuation of $1.5 billion to $2.5
              billion, representing significant downside from historical marks.
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV010
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV008
              - CV010
      - number: '8.4'
        title: Decision Logic and Pre-Investment Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The analytical decision chain moves systematically from operational scale to structural risk barriers,
              confirming that direct equity participation at historical marks is unsupportable. GoodLeap's sustained
              securitization cadence with partners like Tactical Infrastructure and ATLAS SP demonstrates functional
              warehouse liquidity, and ongoing operational recruitment reflects active project lifecycle management.
              However, entering into an equity investment without primary access to confidential cap table liquidation
              preferences, loss curve data across 2022-2024 loan vintages, and formal litigation reserve accounting
              exposes investors to severe downside cram-down risks. Diligence priorities before reconsidering an entry
              position require audited GAAP financial statements segmented by loan versus lease originations, copies of
              all warehouse credit agreements and advance-rate covenants, and a full analysis of potential class
              certification exposure across California, Florida, and Texas courts.
            claimRefs:
              - CV001
