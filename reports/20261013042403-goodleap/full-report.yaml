            body: >-
              The reliance on dealer origination fees—frequently bundled into contractor quotes—creates persistent
              regulatory and legal friction. Borrower litigation alleging undisclosed financing charges and inflated
              purchase prices highlights an ongoing compliance risk that could impair installer acquisition and
              origination pace.
