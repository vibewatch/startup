      - number: '6.3'
        title: Institutional Deployments and Counterparty Evidence
        blocks:
          - type: paragraph
            body: >-
              Sustaining origination scale requires robust institutional capital partnerships capable of absorbing loan
              production and providing forward liquidity. In response to rising interest rates and shifting market
              demand toward third-party ownership structures, GoodLeap forged an institutional partnership with Tactical
              Infrastructure Partners and ATLAS SP Partners to originate and fund more than $1.5 billion in residential
              solar leases and power purchase agreements. This initiative culminated in the closing of the $183.3
              million TIP Solar ABS 2025 securitization, securing permanent financing backed exclusively by residential
              solar lease and PPA cash flows. Beyond financial counterparties, GoodLeap maintains commercial integration
              with thousands of regional installation businesses and partners with utility initiatives such as Reliant
              in Texas, leveraging its GoodGrid software to enroll battery-owning homeowners into virtual power plant
              programs.
