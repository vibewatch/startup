      - number: '5.3'
        title: Multi-Asset Catalog, Lease/PPA Pivot & Loan Structuring
        blocks:
          - type: paragraph
            body: >-
              While initially recognized as a residential solar lender, GoodLeap has expanded its product catalog to
              finance a comprehensive range of sustainable home infrastructure, including high-efficiency HVAC units,
              heat pumps, roofing, windows, doors, water heaters, and smart home EV charging hardware up to $55,000.
              Historically, residential solar loans represented the dominant origination volume, often featuring an
              18-month teaser amortization period designed to align with homeowner federal Investment Tax Credit (ITC)
              filings. Under this mechanism, monthly payments escalate significantly after month 18 unless the homeowner
              applies their tax refund toward principal reduction. In response to rising interest rates and the
              accelerated expiration of the 30% residential solar tax credit at year-end 2025, GoodLeap aggressively
              expanded into third-party-owned solar leases and power purchase agreements (PPAs), as well as dedicated
              HVAC leasing programs. Under these lease models, GoodLeap retains equipment ownership, provides ongoing
              maintenance coverage, and bills customers via fixed predictable annual escalators with buyout options
              after five years. Additionally, GoodLeap introduced the GoodLeap Home Visa Signature Card backed by home
              equity lines of credit, offering prime homeowners up to $150,000 in spending power with 6% cash back on
              qualifying home efficiency projects.
            claimRefs:
              - CE004
              - CE005
              - CE009
              - CE012
      - number: '5.4'
        title: Trust, Contractor Handoff & Point-of-Sale Compliance Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              GoodLeap's rapid origination growth through third-party contractor networks introduces severe operational
              and legal vulnerabilities at the contractor handoff boundary. Because independent sales representatives
              conduct the kitchen-table presentation, aggressive sales tactics and inaccurate utility savings
              projections have sparked extensive customer disputes and regulatory scrutiny. State attorneys general,
              including the Minnesota Attorney General, alongside consumer class action litigators in federal courts,
              allege that GoodLeap and partner lenders violated consumer protection and truth-in-lending laws by failing
              to transparently disclose inflated dealer fees rolled into loan principal and presenting deceptive
              interest rates. Plaintiffs report that low headline interest rates were subsidized by substantial hidden
              contractor fees, creating substantial discrepancies between cash purchase prices and total financed
              balances. Although GoodLeap mandates contractor screening, independent project completion sign-offs, and
              digital document delivery through the GoodLeap Home application, the company's reliance on decentralized
              contractor sales forces creates persistent compliance risk, highlighting the technical and procedural
              challenge of verifying borrower consent and fee disclosures at the point of sale.
            claimRefs:
              - CE002
              - CE013
