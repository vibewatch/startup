      - number: '3.2'
        title: Competitor Profiles & Structural Models
        blocks:
          - type: paragraph
            body: >
              Comparative examination of leading residential upgrade lenders illustrates the strategic tradeoffs
              governing the sector. Solar Mosaic has long served as GoodLeap's closest direct peer in pure-play
              residential solar lending, deploying dealer-fee structures across national solar installer networks.
              However, like GoodLeap, Mosaic has faced scrutiny over dealer fee markups and tightening secondary credit
              liquidity. Dividend Solar Finance, backed by the balance sheet of Fifth Third Bank, offers solar and home
              energy financing with bank-grade capital stability but operates under stricter underwriting guidelines
              that can constrain contractor sales velocity.


              Sunlight Financial illustrates the severe vulnerability of asset-light point-of-sale originators to
              capital market volatility, having navigated bankruptcy reorganization following interest rate spikes and
              warehouse capital freezes. In contrast to these solar-centric lenders, GreenSky (acquired by institutional
              investors after Goldman Sachs' divestiture) established the dealer-fee paradigm in broader home
              improvement verticals including HVAC, windows, and roofing. GreenSky's established position in HVAC and
              remodeling poses a direct barrier to GoodLeap's strategic diversification outside of solar.


              Outside the dealer-fee ecosystem, Hearth has captured significant contractor share by unbundling financing
              from predatory fee structures. By charging contractors a flat monthly software subscription, Hearth
              connects consumers to personal loan marketplaces where project quotes reflect genuine cash prices without
              15% to 30% loan inflation. Wisetack addresses smaller, service-sized tickets through per-transaction
              merchant fees, dominating on-demand repairs. GoodLeap's competitive defense against these platforms relies
              on its integrated Origin and GoodLeap Pros workflow software, paired with institutional warehouse scale.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP006
