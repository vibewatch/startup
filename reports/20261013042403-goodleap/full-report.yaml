              - CP012
      - number: '3.3'
        title: Differentiation Durability & Adverse Exposure
        blocks:
          - type: paragraph
            body: >
              GoodLeap's differentiation has historically rested on contractor workflow software lock-in, rapid
              point-of-sale credit decisioning through its Origin platform, and deep institutional capital access. The
              company has facilitated over $68 billion in lifetime originations and works with more than 6,800 active
              contractors across roofing, HVAC, siding, windows, and solar. To protect contractor relationships and
              combat solar loan volatility, GoodLeap expanded into third-party owned (TPO) leases and power purchase
              agreements (PPAs), securing over $1.5 billion in dedicated equity and debt commitments from Tactical
              Infrastructure Partners and ATLAS SP Partners, alongside multiple securitizations such as the $140.2M TIP
              Solar ABS 2025-2.


              However, GoodLeap's competitive moat faces systemic regulatory and litigation threats that strike at the
              foundation of its dealer-fee economics. In March 2024, the Minnesota Attorney General sued GoodLeap
              alongside Mosaic, Sunlight Financial, and Dividend, alleging deceptive trade practices and unlawful
              concealment of 15% to 30% dealer fees on over $200 million in solar projects. The litigation, which
              remains active and unresolved through 2026, alleges that lenders artificially inflated cash project costs
              by approximately $35 million without transparent disclosure.


              This state-level enforcement is compounded by widespread federal civil class actions and multi-district
              litigation alleging deceptive lending, hidden fees, and Truth in Lending Act (TILA) violations across
              California, Florida, and Texas. With class certification proceedings active in 2026, GoodLeap faces
              potential financial liabilities, mandatory fee disclosure reforms, and borrower restitution demands. If
              regulatory enforcement mandates transparent cash versus financed pricing at point of sale, contractor
              conversion rates could fall sharply, eliminating GoodLeap's historical pricing advantage over transparent
              personal loans and traditional HELOCs.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Dealer-Fee Regulatory Crackdown Threatens POS Conversion Engine
            body: >-
              GoodLeap and its core solar peers (Mosaic, Sunlight, Dividend) rely on 15% to 30% dealer fees to present
              low interest rates to consumers. The ongoing Minnesota AG lawsuit and federal class actions strike
              directly at this origination engine. If mandatory disclosure or restitution orders eliminate the ability
              to mask project markups, GoodLeap's closing conversion advantage over transparent personal loans and
              traditional HELOCs will compress significantly.
            calloutType: risk
            claimRefs:
              - CP002
              - CP004
              - CP013
              - CP014
              - CP015
          - type: callout
            title: Strategic Hedge into Third-Party Owned (TPO) Leases & PPAs
            body: >-
              In response to solar loan contraction and high interest rates, GoodLeap has executed a major pivot into
              third-party owned leases and PPAs. Supported by a $1.5 billion partnership with Tactical Infrastructure
              Partners and ATLAS SP Partners, along with multiple rated asset securitizations, GoodLeap is buffering its
              balance-sheet-light origination model against dealer-fee headwinds.
            calloutType: insight
            claimRefs:
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Pricing Model, and Monetization Mechanisms
        blocks:
          - type: paragraph
            body: >
              GoodLeap monetizes point-of-sale sustainable home improvement originations primarily through financing
              fees, origination premiums, and securitization structuring spreads rather than balance sheet interest
              accumulation. The platform's product architecture encompasses traditional residential solar installation
              loans, energy-efficient home improvement financing spanning HVAC, heat pumps, roofing, and windows,
              residential solar leases and power purchase agreements, and home equity lines of credit delivered via the
              GoodLeap Home Visa Signature Card. On consumer-facing surfaces, GoodLeap quotes fixed interest rates with
              loan repayment durations ranging from 5 to 15 years for general home improvements and 7 to 25 years for
              residential solar systems, supported by promotional features such as a 0.50% Autopay interest rate
              discount and maximum unsecured project loan limits up to $55,000. However, official list rates and
              contractor promotional terms do not disclose realized origination take rates, net dealer fee schedules
              withheld from contractor disbursements, or secondary market pricing spreads, leaving core revenue
              mechanics opaque for underwriting.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI013
