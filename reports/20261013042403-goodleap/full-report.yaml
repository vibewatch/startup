        title: Platform Durability, Churn Risks, and Legal Scrutiny
        blocks:
          - type: paragraph
            body: >-
              Despite expansive top-line customer volume, GoodLeap faces meaningful platform durability and customer
              experience headwinds. On consumer review platforms such as EnergySage, the company holds a 3.1 out of 5
              supplier rating, with negative reviews reflecting borrower confusion over contractor communication,
              financing fee structures, and post-installation service handoffs. More critically, GoodLeap is entangled
              in consumer finance litigation alleging that partnered contractors buried dealer fees and obscured true
              borrowing costs when presenting monthly payment terms to homeowners. Platform durability also encounters
              operational friction during residential property transfers: selling or refinancing a home encumbered by a
              GoodLeap solar loan requires formal buyer credit assumption or full loan payoff. Furthermore, GoodLeap
              does not report cohort retention curves, repeat borrower rates, or installer concentration, presenting an
              unresolved diligence gap.
