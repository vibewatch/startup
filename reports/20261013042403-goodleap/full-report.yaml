            title: Frictionless Point-of-Sale Origination Engine
            body: >-
              GoodLeap's soft-credit instant approval workflow through GoodLeap Pros creates an effective operational
              moat in contractor distribution, enabling 18,000+ sales professionals to close complex clean-energy
