      - number: '4.2'
        title: Channel Economics, GTM Motion, and Platform Conversion
        blocks:
          - type: paragraph
            body: >
              GoodLeap's go-to-market motion relies on embedded point-of-sale software integrations distributed across
              thousands of independent solar installers, HVAC contractors, and home improvement sales professionals
              nationwide. Rather than maintaining an expensive direct-to-consumer salesforce, the company provides
              mobile and desktop applications such as Origin, GoodLeap Pros, and AI tools like DeDe to empower
              contractors to quote, underwrite, and close project financing at the kitchen table in seconds. This B2B2C
              distribution engine creates significant customer acquisition operating leverage while insulating GoodLeap
              from direct retail customer acquisition costs. Channel economics are characterized by rapid credit
              adjudication targeting prime-credit homeowners, with securitization pools demonstrating a weighted average
              borrower FICO score of 741. Capital velocity is maintained through immediate digital loan execution,
              converting contractor pipeline proposals into funded originations that are aggregated for institutional
              warehouse takeout and subsequent capital markets distribution.
            claimRefs:
              - CI001
              - CI004
              - CI005
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
