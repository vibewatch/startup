  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Platform Ecosystem
        blocks:
          - type: paragraph
            body: >-
              GoodLeap operates a two-sided financial technology ecosystem addressing both consumer borrowers and
              commercial home improvement contractors. On the borrower side, the company finances residential clean
              energy upgrades, including photovoltaic solar panels, home battery storage systems, and energy-efficient
              HVAC and roofing installations. While residential solar represents GoodLeap's historical core, the
              platform has expanded into broader home efficiency projects, offering unsecured installment financing with
              terms between 5 and 15 years and maximum borrowing limits of up to $55,000. Crucially, the end-consumer is
              rarely acquired directly; instead, GoodLeap functions through an extensive B2B2C distribution channel.
              Contractors, installers, and home efficiency sales professionals serve as the functional users of
              GoodLeap's proprietary point-of-sale applications, embedding credit applications into residential sales
              conversations to accelerate project closing velocity.
