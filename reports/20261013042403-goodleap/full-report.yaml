      - number: '4.3'
        title: Cost Structure, Gross Margin Drivers, and Unit Economics
        blocks:
          - type: paragraph
            body: >
              The platform operates with an asset-light fintech cost profile relative to balance sheet lenders,
              directing operating expenses into proprietary software engineering, contractor partner support, compliance
              operations, and structured finance execution. Credit rating evaluations from Kroll Bond Rating Agency
              highlighted that GoodLeap maintained positive corporate profitability without outstanding corporate funded
              debt while generating excess cash flows during its scaling years. The historical revenue benchmark of $361
              million reported for fiscal year 2020 reflects high transaction velocity across low-loss prime borrower
              cohorts. However, post-2021 financial disclosures remain closely held, with audited gross margins,
              corporate EBITDA, net credit spread capture, and customer service delivery expenses inaccessible in public
              filings. Without visibility into dealer fee margin splits and secondary asset sale yields, underwriting
              cannot verify whether macroeconomic interest rate volatility and compressed solar demand have pressured
              unit economics.
            claimRefs:
              - CI003
              - CI004
              - CI007
              - CI012
          - type: table
            tableRef: TI003
