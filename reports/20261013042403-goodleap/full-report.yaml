      - number: '2.3'
        title: Buyer, Contractor, and Capital Partner Segmentation
        blocks:
          - type: paragraph
            body: >
              GoodLeap's commercial model operates as a multi-sided ecosystem connecting homeowners (borrowers/lessees),
              trade contractors (originators), and institutional capital partners (ABS investors and credit facilities).
              The primary consumer buyer is a single-family homeowner seeking to reduce monthly utility expenditures or
              replace failing mechanical systems such as HVAC and roofing. These homeowners evaluate purchases on
              monthly cash flow impact rather than total contract price, creating vulnerability when dealer fees inflate
              principal balances.


              The contractor constitutes the critical distribution channel and effective purchasing gatekeeper. Over
              18,000 sales professionals utilize GoodLeap's Origin and GoodLeap Pros platforms to generate instant
              quotes and credit decisions. Contractor loyalty depends on approval speed, platform reliability, dealer
              fee transparency, and prompt milestone disbursement. Simultaneously, institutional capital
              partners—including warehouse lenders like Goldman Sachs and strategic asset partners like Tactical
              Infrastructure Partners and ATLAS SP Partners—serve as the underlying liquidity providers, purchasing
              originations and funding securitization trusts such as the $523 million GoodLeap Home Improvement
              Solutions Trust 2025-3.
            claimRefs:
              - CM003
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: Growth Drivers, Regulatory Shifts, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              The adoption environment for residential sustainable home solutions is governed by acute macro drivers and
              countervailing regulatory and legal constraints. The most disruptive market catalyst occurred in July 2025
              when Congress enacted H.R. 1, also known as the One Big Beautiful Bill (OBBB). This legislation
              accelerated the expiration of the federal 30% residential solar Investment Tax Credit (ITC) / Residential
              Clean Energy Credit to December 31, 2025, terminating the tax credit that had previously been scheduled to
              run through 2032. This statutory cliff abruptly altered consumer financing economics, removing the 30% tax
              credit subsidy for customer-owned solar loans placed in service after 2025 and driving rapid adoption of
              third-party ownership leases and PPAs where commercial incentives still apply.


              Countervailing growth drivers include rising retail utility electricity rates, extreme weather driving
              demand for backup battery storage, and virtual power plant (VPP) incentives through programs like GoodGrid
              and utility partnerships. Conversely, adoption faces severe headwinds from consumer-finance legal scrutiny
              and interest rate volatility. GoodLeap is named in active class action litigation across multiple U.S.
              District Courts and state attorney general actions (notably Minnesota), alleging deceptive lending
              practices, undisclosed dealer fees, and Truth in Lending Act violations regarding solar loans totaling
              over $12 billion in originations. These regulatory and legal pressures impose tighter compliance overhead,
              contract revisions, and potential financial settlement liabilities.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Post-ITC Market Reorientation and TPO Transition
            body: >-
              The expiration of the federal 30% residential solar tax credit on December 31, 2025 under H.R. 1
              fundamentally reshapes residential solar demand. With customer-owned solar loans losing direct tax
              incentives, originators must pivot toward third-party owned (TPO) leases, PPAs, and non-solar home
              efficiency loans (HVAC, heat pumps, roofing) to sustain origination volume.
            calloutType: risk
            claimRefs:
              - CM004
              - CM011
              - CM012
          - type: callout
            title: Contractor Platform Entrenchment vs. Legal Scrutiny
            body: >-
              GoodLeap's distribution moat rests on 18,000+ sales professionals using its Origin and GoodLeap Pros
              software. However, nationwide litigation alleging deceptive dealer fee disclosure threatens this
              contractor-led acquisition engine by increasing regulatory overhead and potential scrutiny from the CFPB
              and state attorneys general.
            calloutType: insight
            claimRefs:
              - CM008
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape & Market Structure
        blocks:
          - type: paragraph
            body: >
              The point-of-sale financing landscape for sustainable home upgrades divides into three structural models:
              dealer-fee buy-down originators, software subscription and merchant-fee platforms, and balance-sheet
              depository lenders. GoodLeap has historically led the dealer-fee category, capturing approximately 30% of
              nationwide residential solar loans by offering promotional low-APR financing to homeowners while charging
              contractors an origination discount fee of 15% to 30%. This dealer fee is capitalized directly into the
              borrower's financed principal, allowing contractors to close high-ticket systems on low advertised monthly
              payments.


              Direct competitors operating identical or closely related dealer-fee models include Solar Mosaic, Sunlight
              Financial, and Dividend Solar Finance (a subsidiary of Fifth Third Bank). These specialized originators
              compete intensely for contractor distribution agreements, software integrations, and institutional capital
              access via credit unions and securitization conduits. Unlike integrated solar providers such as Sunrun or
              Sunnova that prioritize vertically integrated leases and direct sales forces, GoodLeap and its pure-play
              dealer-fee peers rely entirely on independent contractor networks to drive origination volume.


              Simultaneously, GoodLeap faces indirect substitution and adjacency pressure from home-improvement fintechs
              such as Hearth and Wisetack. Hearth operates a software subscription model charging contractors monthly
              fees with no principal markups, while Wisetack charges standard merchant transaction fees for
              service-sized tickets. Furthermore, traditional consumer banking alternatives—such as home equity lines of
              credit (HELOCs), clean energy credit unions (e.g., PenFed), and PACE financing—offer unencumbered,
              zero-dealer-fee financing, creating persistent disintermediation risks as consumer awareness of dealer fee
              inflation increases.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
