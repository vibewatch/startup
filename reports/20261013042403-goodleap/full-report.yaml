      - number: '5.2'
        title: Platform Architecture, IoT Telemetry & GoodGrid VPP
        blocks:
          - type: paragraph
            body: >-
              Architecturally, GoodLeap functions as a digital switchboard connecting three distinct stakeholder
              networks: home improvement contractors requiring instant financing conversion, residential property owners
              seeking affordable monthly payments, and institutional capital providers purchasing standardized consumer
              credit assets. Behind the mobile client surfaces sits a cloud-based underwriting and decisioning engine
              that interfaces with credit bureaus and automated valuation models to standardize risk profiles. On the
              consumer side, the GoodLeap Home mobile app integrates directly with inverter and battery telemetry
              systems from major equipment manufacturers including Tesla, SolarEdge, Enphase, and QCells, allowing
              homeowners to monitor clean energy production and household power consumption. GoodLeap has leveraged this
              connected asset footprint through GoodGrid, a virtual power plant (VPP) initiative launched in 2024 that
              aggregates residential battery storage and smart thermostats. GoodGrid dispatches stored clean energy into
              regional electricity grids during peak demand windows, delivering over 50 megawatts of flexible capacity
              in California and Connecticut while targeting 1.5 gigawatts of managed capacity across a five-year horizon
              through utility partnerships with providers such as Reliant Energy.
