      - number: '6.2'
        title: Homeowner Adoption Trajectory and Origination Scale
        blocks:
          - type: paragraph
            body: >-
              GoodLeap has demonstrated substantial origination velocity since pivoting toward sustainable home
              improvement finance in 2018. According to platform disclosures and industry estimates, GoodLeap has funded
              more than $30 billion to $32 billion in cumulative clean energy loans, serving over 1.2 million homeowners
              nationwide across all 50 states. This distribution footprint establishes GoodLeap as a leading
              point-of-sale financing provider in residential solar. Standard solar loan offerings feature repayment
              maturities ranging from 7 to 25 years with annual percentage rates typically structured between 5% and 9%.
              A foundational mechanism of these loans is the integration of dealer fees and promotional initial
              payments: contracts assume that the homeowner will remit their 30% federal investment tax credit to
              re-amortize the loan balance within 18 months, after which monthly obligations escalate if the principal
              is not reduced.
            claimRefs:
