    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              GoodLeap traces its operating history to Paramount Equity Mortgage, founded in 2003 by Hayes Barnard,
              Jason Walker, and Matt Dawson. The assigned independent profiles identify Roseville, California as
              headquarters and GoodLeap, LLC as the legal entity, while the company remains privately held. The company
              now presents itself as a financing and software platform for sustainable home improvements rather than as
              a solar-only lender. Its official pages cover solar, batteries, HVAC, roofing, windows, other efficiency
              upgrades, contractor workflow software, payment tools, and homeowner financing. The June 2021 change from
              Loanpal to GoodLeap marked that broader positioning. This is a multi-sided model: homeowners seek project
              financing, contractors use point-of-sale and operating tools, and institutional capital participates
              through loan purchases and securitizations. The available evidence supports the product perimeter, but it
              does not disclose current revenue by product or the economics retained by GoodLeap after assets are
              distributed.
