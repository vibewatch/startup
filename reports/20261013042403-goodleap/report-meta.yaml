  topStrengths:
    - Large embedded distribution network across contractors and home-improvement partners.
    - Broadening product set beyond solar into home-efficiency, leases / PPAs, and payments.
    - Continued access to institutional capital markets and securitization execution.
  topRisks:
    - Consumer-finance litigation and regulatory scrutiny over dealer fees and TILA disclosures.
    - Opaque post-2021 financial disclosure and an apparently stale private valuation mark.
    - Dependence on warehouse / ABS funding and sensitivity to credit and spread conditions.
