companyProfile:
  summary: >-
    GoodLeap is a Roseville, California-based private financing and software platform that evolved from Paramount Equity
    Mortgage / Loanpal into a broader sustainable-home point-of-sale platform. It supports solar, battery storage, HVAC,
    roofing, windows, home-efficiency upgrades, contractor workflow software, and payment tools, while distributing
    loans through installers and other home-improvement partners. Public evidence still leaves current economics,
    ownership, cap table, and exact headcount opaque.
