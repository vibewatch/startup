        title: 展示项
        blocks:
          - type: callout
            title: 证券化资本依赖与《诚实借贷法》诉讼暴露
            body: |
              GoodLeap 的融资吞吐依赖 ABS 投资者持续需求和仓储信贷额度。围绕隐藏承包商经销商费的《诚实借贷法》监管与集体诉讼审查不断加剧，造成未量化的或有负债，并可能迫使经销商定价模式重构。
            calloutType: risk
            claimRefs:
              - CI010
