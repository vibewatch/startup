      - number: '4.2'
        title: 渠道经济性、GTM 动作与平台转化
        blocks:
          - type: paragraph
            body: >
              GoodLeap 的市场进入依靠嵌入式销售点软件集成，分布于全国数千家独立太阳能安装商、HVAC 承包商和家装销售人员。公司没有维持昂贵的直销团队，而是提供 Origin、GoodLeap Pros
              等移动和桌面应用，以及 DeDe 等 AI 工具，让承包商在客户家中几秒内报价、承保并完成项目融资。这套 B2B2C 分销引擎带来显著的获客运营杠杆，也让 GoodLeap
              不必承担直接零售获客成本。渠道经济性体现为面向优质信用房主的快速授信；证券化池显示借款人 FICO 加权平均分为
              741。资本周转速度则靠即时数字化放款维持：承包商管线中的方案转为已融资发放，再汇总后交由机构仓储接手并进入资本市场分销。
