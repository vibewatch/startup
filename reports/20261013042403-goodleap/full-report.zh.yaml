        title: 资本、规模与利益相关方
        blocks:
          - type: paragraph
            body: >-
              GoodLeap 在 2021 年完成两轮据报道各为 $800 million 的股权融资：1 月融资涉及 New Enterprise Associates、WestCap、Brookfield 和
              Riverstone，10 月融资由 MSD Partners 领投，BDT Capital 和 Davidson Kempner 参与。后者确立了 $12 billion 的投后估值。2026 年 8
              月的独立简介仍把这笔 2021 年交易列为最近可见估值，因此它只是历史估值标记，不代表当前公允价值或现金可用性。不同简介显示其已促成贷款超过 $32 billion、服务房主超过 1.2
              million，但这些累计指标既不是收入，也不是经常性收入。公司 2022 年的一份公告展示了资本分配模式：第 13 笔证券化由向约 11,000 名房主发放的 $467 million
