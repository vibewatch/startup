  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 分析链条依次从运营规模与资本市场准入，经过诉讼与估值悬置，推导出跟踪建议。
    data:
      nodes:
        - label: 规模与市场领先地位
          detail: 促成的贷款总额超过 $32B，服务 1.2M+ 房主，是美国排名第一的太阳能 POS 放贷方
        - label: 资本市场延续性
          detail: 2025 年末近期完成的证券化交易（$183.3M 和 $140.2M TIP ABS）证明其仍能进入债务市场
        - label: 产品多元化推进
          detail: 推出 GoodLeap Home Card HELOC（最高 $150K）并开展 HVAC 租赁，以降低对太阳能业务的集中度
        - label: 监管与诉讼逆风
          detail: 2026 年正在进行的多州集体诉讼，质疑未披露的经销商费用与 TILA 披露
        - label: 估值与信息缺口
          detail: 2021 年 10 月的 $12B 估值已过时，意味着约为预估 $500M ARR 的 24 倍；公司未披露经审计财务报表
        - label: 建议：跟踪
          detail: 要求公司提供经审计的分部指标并解决诉讼后，再考虑入场；在此之前维持观察立场
      edges:
        - from: Scale & Market Leadership
          to: Capital Markets Continuity
        - from: Capital Markets Continuity
          to: Product Diversification Push
        - from: Product Diversification Push
          to: Regulatory & Litigation Headwinds
        - from: Regulatory & Litigation Headwinds
          to: Valuation & Information Gap
        - from: Valuation & Information Gap
          to: 'Recommendation: Track'
