      - number: '4.3'
        title: 成本结构、毛利率驱动因素与单位经济性
        blocks:
          - type: paragraph
            body: >
              相比资产负债表型贷款机构，该平台采用轻资产金融科技成本结构，运营支出主要用于自有软件工程、承包商伙伴支持、合规运营和结构化融资执行。Kroll Bond Rating Agency
              的信用评级评估指出，GoodLeap 在没有未偿还公司融资债务的情况下保持公司层面的正盈利，并在扩张期产生超额现金流。2020 财年的历史收入基准为 $361
              million，反映了低损失优质借款人群体中的高交易速度。然而，2021 年之后的财务披露仍被严密持有；经审计毛利率、公司
              EBITDA、净信用利差捕获和客户服务交付费用均无法从公开文件取得。在看不清经销商费利润分成和二级资产出售收益的情况下，承保无法验证宏观利率波动和太阳能需求收缩是否挤压了单位经济性。
