      - number: '2.3'
        title: 买方、承包商与资本伙伴分层
        blocks:
          - type: paragraph
            body: >
              GoodLeap 的商业模式是一个连接房主（借款人 / 承租人）、行业承包商（发起方）和机构资本伙伴（ABS 投资者及信贷额度）的多边生态。主要消费者买方是单户房主，希望减少每月公用事业支出，或更换失效的
              HVAC、屋顶等机械系统。这些房主根据每月现金流影响而非合同总价评估购买，因此当经销商费推高本金时，风险会增加。

              承包商是关键分销渠道，也是实际采购把关者。超过 18,000 名销售人员使用 GoodLeap 的 Origin 和 GoodLeap Pros
              平台生成即时报价和授信决定。承包商忠诚度取决于审批速度、平台可靠性、经销商费透明度和里程碑款项的及时拨付。同时，机构资本伙伴——包括 Goldman Sachs 等仓储贷款方，以及 Tactical
              Infrastructure Partners 和 ATLAS SP Partners 等战略资产伙伴——提供底层流动性，购买贷款发放并为 GoodLeap Home Improvement Solutions
              Trust 2025-3 等证券化信托提供资金；后者规模为 $523 million。
            claimRefs:
