              Shrewsberry
              列为首席财务官。这些公开记录足以勾勒出一支可识别的运营班底，但不足以确认完整董事会、投票控制权、继任安排或当前持股比例。这一区分很重要：创始人主导的私人公司可以兼具战略连续性，以及集中式关键人物和治理风险。公开简介对
              Daniel Lotano
              的职务记载不一致，因此本章不强行确认其当前职位。领导层表只是列出职务有稳定证据支持的一组人员，并不声称已覆盖完整的高管团队或治理机构。确认董事席位、保留事项、创始人投票权和高管继任安排，仍需私人公司记录。
