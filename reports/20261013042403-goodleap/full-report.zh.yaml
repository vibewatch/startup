    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              GoodLeap 的经营历史可追溯至 2003 年由 Hayes Barnard、Jason Walker 和 Matt Dawson 创立的 Paramount Equity
              Mortgage。受委托的独立简介将总部认定为加州 Roseville，并将 GoodLeap, LLC
              列为法律实体；公司仍为私人持有。如今，公司将自身定位为可持续家居改善的融资与软件平台，而不再只是太阳能贷款机构。其官方页面覆盖太阳能、电池、HVAC、屋顶、窗户、其他能效升级、承包商工作流软件、支付工具和房主融资。2021
              年 6 月从 Loanpal 更名为
              GoodLeap，标志着这一更广定位。这个模式连接多方：房主寻求项目融资，承包商使用销售点和运营工具，机构资本则通过购买贷款和证券化参与其中。现有证据支持其产品边界，但没有披露按产品划分的当前收入，也没有披露资产分销后
              GoodLeap 留存的经济收益。
