      - number: '7.3'
        title: 资本市场依赖与交易对手集中度
        blocks:
          - type: paragraph
            body: >-
              GoodLeap 是一家轻资产放贷发起方，完全依赖机构债务资本、仓储授信额度和二级市场证券化来支撑贷款规模。平台已为超过 140 万名房主发放逾 $30B
              融资，但要维持这一规模，就必须持续进入资产支持证券（ABS）市场。截至 2025 年底，GoodLeap 已完成 24 笔证券化交易，总额达数十亿美元，企业承销合作方包括 Goldman Sachs、Bank
              of America 和 CIBC。2024 年 10 月，GoodLeap 与 Tactical Infrastructure Partners 及 ATLAS SP Partners 筹组了 $1.5B
              战略融资合作，为住宅太阳能和储能系统提供资金。不过，这一模式对宏观利率变化和 ABS
              利差扩大极为敏感：基准利率上升会压缩发起利差，而太阳能贷款信用曲线恶化、法律负面舆情升温，可能触发仓储授信契约违约或评级下调。为降低太阳能贷款集中度，GoodLeap 正尝试拓展 HVAC
              租赁、家庭能效融资，以及与 Cross River Bank 联合发行的房屋净值支持 Visa 卡，但太阳能贷款仍是平台业务周转的主要引擎。
