      - number: '5.4'
        title: 信任、承包商交接与销售点合规脆弱性
        blocks:
          - type: paragraph
            body: >-
              GoodLeap
              通过第三方承包商网络快速扩大贷款发放，在承包商交接边界引入了严重的运营和法律脆弱性。独立销售代表负责在客户家中展示方案，因此激进销售策略和不准确的公用事业节省预测引发大量客户纠纷和监管审查。包括明尼苏达州总检察长在内的州检察官，以及联邦法院的消费者集体诉讼律师，指控
              GoodLeap
              和合作贷款机构违反消费者保护及诚实借贷法律：它们没有透明披露计入贷款本金的经销商费加价，还展示欺骗性利率。原告称，低宣传利率由大额隐性承包商费用补贴，导致现金购买价和融资总额之间出现重大差异。尽管
