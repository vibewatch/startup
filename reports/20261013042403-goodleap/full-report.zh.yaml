        title: 监管与消费者金融诉讼暴露
        blocks:
          - type: paragraph
            body: >-
              GoodLeap 的销售点融资模式正面临严重的司法和监管挑战，核心在于贷款透明度和费用披露。2024 年 3 月，明尼苏达州总检察长 Keith Ellison
              提起重大消费者保护诉讼，据诉讼方指称，GoodLeap 及关联贷款机构在超过 5,000 笔明尼苏达太阳能贷款中收取超过 $35 million 的未披露经销商费，把平均 19.32% 或 $7,552
              的加价塞入借款人本金，并在合同上禁止太阳能承包商披露该加价。在联邦法院，合并为 MDL No. 3128 的多地区诉讼于 2025 年 8 月取得重大进展：美国地区法官 Katherine Menendez 驳回
              GoodLeap 申请驳回《诚实借贷法》（TILA）诉求的动议，认定隐藏的太阳能平台费通过合同价格转嫁后，在法律上可能构成未披露金融费用。2026 年集体认证程序仍在推进，且 CFPB
              以及加州、佛罗里达州和得州总检察长同步审查，GoodLeap 的资产负债表可能暴露于法定撤销、强制退费和永久运营禁令。
