      - number: '2.4'
        title: 增长驱动、监管变化与采用约束
        blocks:
          - type: paragraph
            body: >
              住宅可持续家居方案的采用环境，受强劲宏观驱动因素以及相反方向的监管和法律约束共同塑造。最具颠覆性的市场催化剂出现在 2025 年 7 月：国会通过 H.R. 1，即 One Big Beautiful
              Bill（OBBB）。该法案将联邦 30% 住宅太阳能投资税收抵免（ITC）/住宅清洁能源抵免的到期日提前至 2025 年 12 月 31 日，终止了原定延续至 2032
              年的税收抵免。这一法定断崖突然改变消费者融资经济性：2025 年之后投入使用的客户自有太阳能贷款失去 30% 税收抵免补贴，第三方所有制租赁和 PPA 则因商业激励仍适用而迅速增长。

              反向增长驱动因素包括零售公用事业电价上涨、极端天气推动备用电池储能需求，以及 GoodGrid
              和公用事业合作项目带来的虚拟电厂（VPP）激励。相反，消费者金融法律审查和利率波动给采用带来严重阻力。GoodLeap 被列入多个美国联邦地区法院和州总检察长诉讼中的在审集体诉讼，被指控在总额超过 $12
              billion 的太阳能贷款发放中存在欺骗性贷款做法、未披露经销商费和违反《诚实借贷法》。这些监管和法律压力会带来更高合规成本、合同修订和潜在财务和解负债。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: ITC 到期后的市场重定向与 TPO 转型
            body: >-
              H.R. 1 规定联邦 30% 住宅太阳能税收抵免于 2025 年 12 月 31 日到期，根本改变了住宅太阳能需求。客户自有太阳能贷款失去直接税收激励后，发起方必须转向第三方所有制（TPO）租赁、PPA
              及非太阳能家居能效贷款（HVAC、热泵、屋顶），才能维持贷款发放量。
            calloutType: risk
            claimRefs:
              - CM004
              - CM011
              - CM012
          - type: callout
            title: 承包商平台黏性与法律审查
            body: >-
              GoodLeap 的分销壁垒建立在 18,000 多名销售人员使用 Origin 和 GoodLeap Pros 软件之上。然而，指控经销商费披露具有欺骗性的全国性诉讼，可能通过增加监管成本和
              CFPB、州总检察长的潜在审查，威胁这一由承包商主导的获客引擎。
            calloutType: insight
            claimRefs:
              - CM008
              - CM014
              - CM015
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与市场结构
        blocks:
          - type: paragraph
            body: >
              可持续家居升级的销售点融资市场分为三种结构模式：经销商费买断型发起方、软件订阅和商户费平台，以及资产负债表型存款贷款机构。GoodLeap 历来主导经销商费类别，通过向房主提供促销低 APR
              融资，同时向承包商收取 15% 至 30% 的发放折扣费，获取全国住宅太阳能贷款约 30% 的份额。该经销商费直接计入借款人融资本金，使承包商能够用较低的广告月供成交高客单价系统。

              采用相同或相近经销商费模式的直接竞争对手包括 Solar Mosaic、Sunlight Financial 和 Dividend Solar Finance（Fifth Third Bank
              子公司）。这些专业发起方围绕承包商分销协议、软件集成，以及通过信用合作社和证券化通道获得机构资本，展开激烈竞争。与优先发展垂直整合租赁和直营销售团队的 Sunrun、Sunnova
              等综合太阳能供应商不同，GoodLeap 及其纯经销商费同行完全依靠独立承包商网络拉动发放量。

              与此同时，GoodLeap 还面临 Hearth、Wisetack 等家装金融科技公司的间接替代和相邻压力。Hearth 采用软件订阅模式，向承包商收取月费但不加价本金；Wisetack
              则对服务型小额订单收取标准商户交易费。此外，HELOC、清洁能源信用合作社（如 PenFed）和 PACE
              融资等传统消费者银行替代方案，提供无产权负担、零经销商费融资。随着消费者越来越意识到经销商费会抬高价格，持续脱媒风险上升。
