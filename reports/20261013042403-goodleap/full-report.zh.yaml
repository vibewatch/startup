  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源、定价模式与变现机制
        blocks:
          - type: paragraph
            body: >
              GoodLeap 主要通过融资费、发放溢价和证券化结构安排利差，为销售点可持续家装贷款发放变现，而不是靠资产负债表累积利息。平台产品架构包括传统住宅太阳能安装贷款、覆盖
              HVAC、热泵、屋顶和窗户的节能家装融资、住宅太阳能租赁和购电协议，以及通过 GoodLeap Home Visa Signature Card
              提供的房屋净值信用额度。面向消费者的页面给出固定利率：一般家装贷款期限为 5 至 15 年，住宅太阳能系统为 7 至 25 年；促销功能包括 0.50% Autopay 利率折扣，以及最高 $55,000
              的无抵押项目贷款额度。然而，官方挂牌利率和承包商促销条款没有披露实际发放费率、从承包商拨款中扣留的净经销商费安排，或二级市场定价利差，因此承保所需的核心收入机制仍不透明。
