              从架构上看，GoodLeap
              像一个数字交换台，连接三张不同的利益相关方网络：需要即时融资转化的家装承包商、寻求可负担月供的住宅业主，以及购买标准化消费者信贷资产的机构资本提供者。移动客户端背后是一套云端承保和决策引擎，连接征信机构与自动估值模型，以标准化风险画像。在消费者侧，GoodLeap
