      - number: '8.4'
        title: 决策逻辑与投前尽调要求
        blocks:
          - type: paragraph
            body: >-
              这条分析决策链从经营规模逐步走向结构性风险屏障，结论是：按历史估值直接参与股权投资缺乏依据。GoodLeap 与 Tactical Infrastructure、ATLAS SP
              等伙伴持续进行证券化，说明仓储流动性仍能运转；持续招聘运营人员，也反映出公司仍在主动管理项目全生命周期。然而，若投资者无法优先取得机密股权结构表的清算优先权、2022–2024
              年各批次贷款的损失曲线数据，以及正式的诉讼准备金会计记录，就会暴露在严重的下行 cram-down 风险中。重新考虑入场前，尽调重点应包括：按贷款与租赁发起业务拆分的经审计 GAAP
              财务报表；全部仓储授信协议及预付款率契约副本；以及对加州、佛罗里达州和得州法院潜在集体诉讼认证风险的完整分析。
