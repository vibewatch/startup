      - number: '4.4'
        title: 资本充足性、仓储额度与证券化依赖
        blocks:
          - type: paragraph
            body: >
              GoodLeap 的商业模式依靠仓储信贷额度、远期贷款购买承诺和定期资产支持证券化（ABS）的持续流动性，在不消耗股权资本的情况下为贷款发放提供资金。在 Bank of America、Goldman
              Sachs、CIBC 和 Citigroup 等一级机构簿记行支持下，平台自启动结构化融资项目以来已完成 26 笔证券化。2026 年 10 月，公司完成 GoodLeap Home Improvement
              Solutions Trust 2026-2，这笔 ABS 交易由 $434 million 已发放贷款本金支持，并获得 KBRA 和 Fitch Ratings 的投资级信用评级。平台终身资本化由 2021 年
              10 月以 $12 billion 估值募集的 $800 million
              成长股权，以及机构资产管理者数十亿美元的战略融资承诺组成。尽管这些安排证明其持续进入资本市场的能力较强，公司仍高度敏感于二级证券化利差、预付款率和机构对 ESG 标记消费者信贷资产的需求。
            claimRefs:
              - CI008
              - CI009
              - CI012
              - CI014
      - number: '4.5'
        title: 消费者保护诉讼暴露与承保判断
        blocks:
          - type: paragraph
            body: >
              GoodLeap 面临的主要财务脆弱点，是围绕销售点太阳能贷款披露和承包商经销商费不断加剧的法律与监管审查。明尼苏达州对
              GoodLeap、太阳能融资同行和银行伙伴提起联邦民事执法行动，指控其通过欺骗性结构安排家居融资，违反《诚实借贷法》。与此同时，协调集体诉讼中的消费者原告称，GoodLeap
              隐瞒了大额经销商费——通常把系统安装成本抬高 20% 至 30%——却没有向借款人清楚展示总偿还义务。如果经销商费披露结构必须强制修改，这些行动可能带来赔偿负债、法定损害赔偿和运营中断。因此，尽管
              GoodLeap 展示出领先的平台规模和成熟的资本市场执行能力，私人利润率不透明与未量化的诉讼准备金相叠加，使其目前无法获得无条件的投资承保认可。
            claimRefs:
              - CI007
              - CI010
              - CI011
              - CI012
