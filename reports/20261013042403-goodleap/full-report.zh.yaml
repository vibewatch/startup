              对 GoodLeap 风险状况的综合评估显示，监管责任和渠道脆弱性正直接威胁公司的经营逻辑及历史 $12B 私募估值。GoodLeap 的私募估值于 2021 年 10
              月、接近零利率且住宅太阳能高速增长的时期确定；尽管清洁能源金融科技领域可比公司的估值倍数大幅收缩、资本成本上升，该估值仍未被公开下调。关键监测指标包括 MDL 3128
              的联邦集体诉讼认证裁定、多州总检察长的和解要求、ABS 优先级票据信用利差，以及其 18,000 名销售代表网络的承包商门户留存率。可能令投资论点失效的具体触发器包括：（1）MDL 3128
              完成集体诉讼认证，并认定 GoodLeap 须为历史各批次发起贷款承担 TILA 法定损害赔偿；（2）CFPB 或多州总检察长联盟发布正式同意令，要求退还经销商费用加价并禁止买断定价结构；（3）仓储授信冻结，或
