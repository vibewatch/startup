  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、范围与现状替代方案
        blocks:
          - type: paragraph
            body: >
              界定 GoodLeap 的可服务市场，首先要把销售点（POS）清洁能源融资，与一般消费者贷款和传统零售房屋净值融资分开。GoodLeap 的核心市场包括覆盖全美 50
              个州住宅清洁能源资产的销售点发放、贷款服务、租赁和购电协议（PPA）发放，以及虚拟电厂聚合。纳入的支出包括住宅屋顶光伏（PV）太阳能安装、电池储能系统（BESS）、热泵、高能效 HVAC
              设备、屋顶更换和智能电气面板。市场边界排除公用事业规模太阳能发电、商业和工业（C&I）太阳能、非能源类豪华家装，以及住宅首套按揭。

              在这个边界内，主要现状替代方案是地区银行的传统无抵押个人贷款、房屋净值信用额度（HELOC）和房主现金购买。不同于直接银行贷款，GoodLeap 把融资工作流直接嵌入超过 18,000
              名销售人员使用的承包商销售工具，使其能在客户家中即时做出授信决定。但随着利率波动、资本市场变化，这些现状替代方案各有不同摩擦点。现金购买可以免除融资经销商费；公用事业账单融资和社区太阳能项目，则为希望获得清洁能源但不承担长期债务的房主提供相邻路径。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
      - number: '2.2'
        title: 可服务市场规模与受约束的测算视角
        blocks:
          - type: paragraph
            body: >
              评估 GoodLeap 的可服务市场，需要多个受约束的测算视角，而不是一个投机性的自上而下数字。最宽口径下，总可服务市场（TAM）覆盖整个美国住宅家装和现代化改造行业，预计每年超过 $450
              billion；其中住宅清洁能源和能效升级约占 $50 billion 至 $70 billion。可服务市场（SAM）进一步缩小到屋顶形状合适、信用分不低于
              650、且公用事业电价差足以带来正向经济节省的独栋自住住宅，对应每年约 $25 billion 至 $35 billion 的资本支出。

              GoodLeap 的可获取市场（SOM）受承包商伙伴渗透率、资产支持证券化（ABS）流动性、州级牌照和安装商偿付能力限制。历史上，GoodLeap 每年获得的贷款发放量估计为 $4 billion 至 $6
              billion；平台累计促成贷款超过 $32 billion，覆盖超过 1.2 million 名房主。独立分析师拆解显示，GoodLeap 为美国全部住宅太阳能贷款的约 30%
              提供融资；低利率扩张期的早期峰值估计最高达到 41%。不过，随着资本市场仓储额度和经销商费经济性决定安装商选用哪个平台，市场规模正在根本重排。
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
