      - number: '7.2'
        title: 经销商费加价、还款断崖与承包商责任
        blocks:
          - type: paragraph
            body: >-
              GoodLeap 贷款引发的核心消费者争议，来自买断型经销商费、激进销售点销售做法和结构性还款上涨的相互作用。为提供低至 1.99% 或 2.99% 的促销宣传 APR，GoodLeap 向承包商预收 15% 至
              35% 的融资费；销售代表通常把这笔费用直接计入系统融资总价，却不按 TILA 要求逐项披露。房主随后会面对 18 个月重新摊销结构：初始月供按借款人自愿使用联邦太阳能税收抵免偿还 30%
              本金来承保。当固定收入退休人士或低收入房主没有足够联邦应纳税额，无法兑现不可退税抵免时，第 19 个月月供将永久上涨 30% 至 50%。承包商普遍破产进一步放大这些结构性摩擦，例如 Pink Energy
              倒闭后，数千名消费者仍在为无法运行或已被弃置的系统还贷。依据 FTC Holder Rule（16 C.F.R. § 433.2）及佐治亚州确认的里程碑式仲裁先例，GoodLeap
              已被认定应作为积极参与方，为安装商失实陈述承担法律责任，导致贷款取消并需主动赔偿。此外，GoodLeap 登记 UCC-1
              固定资产留置权的做法，会制造持续的产权瑕疵；当留置权解除处理不当时，住宅房地产交易可能延迟或失败。
