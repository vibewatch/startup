      - number: '3.3'
        title: 差异化持续性与负面暴露
        blocks:
          - type: paragraph
            body: >
              GoodLeap 的差异化历来建立在承包商工作流软件锁定、通过 Origin 平台快速完成销售点授信，以及深厚的机构资本渠道上。公司累计促成贷款超过 $68
              billion，并与屋顶、HVAC、壁板、窗户和太阳能领域超过 6,800 家活跃承包商合作。为维护承包商关系、应对太阳能贷款波动，GoodLeap 扩展至第三方所有制（TPO）租赁和购电协议（PPA），从
              Tactical Infrastructure Partners 和 ATLAS SP Partners 获得超过 $1.5 billion 的专项股权和债务承诺，并完成包括 $140.2M TIP Solar
              ABS 2025-2 在内的多笔证券化。

              然而，GoodLeap 的竞争壁垒面临系统性监管和诉讼威胁，直击其经销商费经济模式的根基。2024 年 3 月，明尼苏达州总检察长起诉 GoodLeap、Mosaic、Sunlight Financial 和
              Dividend，指控其在超过 $200 million 的太阳能项目中实施欺骗性贸易行为，非法隐瞒 15% 至 30% 的经销商费。诉讼截至 2026
              年仍在审理且未解决，并指控贷款机构未透明披露，约将现金项目成本人为抬高 $35 million。

              州级执法又叠加了遍及加州、佛罗里达州和得州的联邦民事集体诉讼及多地区诉讼；这些案件指控欺骗性贷款、隐藏费用和违反《诚实借贷法》（TILA）。随着 2026 年集体认证程序仍在进行，GoodLeap
              面临潜在财务负债、强制经销商费披露改革和借款人赔偿要求。如果监管执法要求销售点透明展示现金价与融资价，承包商转化率可能大幅下降，从而消除 GoodLeap 相对于透明个人贷款和传统 HELOC 的历史定价优势。
