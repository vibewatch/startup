      - number: '3.2'
        title: 竞争对手简介与结构模型
        blocks:
          - type: paragraph
            body: >
              对领先住宅升级贷款机构的比较，揭示了行业背后的战略取舍。Solar Mosaic 长期以来一直是 GoodLeap 在纯住宅太阳能贷款领域最接近的直接同行，在全国太阳能安装商网络中采用经销商费结构。但与
              GoodLeap 一样，Mosaic 也因经销商费加价和二级信贷流动性收紧而受到审查。由 Fifth Third Bank 资产负债表支持的 Dividend Solar
              Finance，提供太阳能和家居能源融资，资本稳定性达到银行级别；但其更严格的承保标准可能限制承包商销售速度。

              Sunlight Financial 展示了轻资产销售点发起方面对资本市场波动时的严重脆弱性：它在利率飙升、仓储资本冻结后经历了破产重组。与这些以太阳能为中心的贷款机构相比，GreenSky（Goldman
              Sachs 撤资后被机构投资者收购）把经销商费模式带到了更广泛的家装垂直领域，包括 HVAC、窗户和屋顶。GreenSky 在 HVAC 和改造领域的既有地位，直接阻碍 GoodLeap
              向太阳能以外进行战略多元化。

              在经销商费生态之外，Hearth 通过把融资与掠夺性费用结构拆开，获取了相当大的承包商份额。Hearth 向承包商收取固定软件月费，再把消费者连接到个人贷款市场，让项目报价反映真实现金价格，不含 15% 至
              30% 的贷款加价。Wisetack 通过按交易收取商户费，服务更小的服务型订单，并主导即时维修。GoodLeap 对这些平台的竞争防守，依靠集成的 Origin 和 GoodLeap Pros
              工作流软件，以及机构仓储规模。
            claimRefs:
