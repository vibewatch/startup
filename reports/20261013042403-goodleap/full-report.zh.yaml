    title: 公司里程碑时间线
    type: timeline
    summary: 公司从按揭贷款发放发展为更广泛的可持续家居平台，但仍沿用过时的 2021 年估值锚点，并持续受到消费金融审查。
    data:
      items:
        - label: '2003'
          detail: Paramount Equity Mortgage 由 Hayes Barnard、Jason Walker 和 Matt Dawson 创立。
          tone: neutral
        - label: 2017 年 12 月
          detail: 前身业务开始发放住宅太阳能贷款，随后以 Loanpal 运营。
          tone: positive
        - label: 2021 年 1 月
          detail: 据报道，Loanpal 从包括 NEA、WestCap、Brookfield 和 Riverstone 在内的投资者集团筹集 $800 million。
          tone: positive
        - label: 2021 年 6 月
          detail: Loanpal 更名为 GoodLeap，体现其从太阳能扩展至更广泛的可持续家居改造。
          tone: positive
        - label: 2021 年 10 月
          detail: 据报道，GoodLeap 以 $12 billion 投后估值再次筹集 $800 million。
          tone: positive
        - label: 2022 年 5 月
          detail: GoodLeap 宣布完成第 13 笔证券化，底层为 $467 million 住宅太阳能贷款。
          tone: neutral
        - label: 2023 年 12 月
          detail: John Shrewsberry 被列为首席财务官。
          tone: neutral
        - label: 2024 年 3 月
          detail: 明尼苏达州总检察长起诉 GoodLeap 及另外三家贷款机构；本报告不将这些指控视为已裁决事实。
          tone: risk
        - label: 2024 年 8 月
          detail: GoodLeap 在加州启动 GoodGrid 虚拟电厂项目。
          tone: positive
        - label: 2026 证据快照
          detail: 指定档案仍指向 2021 年估值，且显示出差异显著的员工人数估计。
          tone: risk
    approximationNotes: 日期仅精确到留存来源所述粒度；2026 年条目是证据快照，而非公司事件日期。
