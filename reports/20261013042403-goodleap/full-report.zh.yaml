          detail: IoT 遥测接入、虚拟电厂聚合与电网服务调度
          modules:
            - 多 OEM 逆变器遥测网关（Tesla、SolarEdge、Enphase、QCells）
            - 虚拟电厂调度编排器（已投入运营 50MW+）
            - 公用事业需求响应集成（OpenADR）
            - 房主能源洞察与账单抵扣引擎
        - label: 贷款与资产服务核心
          detail: 组合会计、账单管理、重新摊销与卡片管理
          modules:
            - 多资产服务系统（贷款、租赁、PPA）
            - ACH 自动扣款与访客支付网关
            - 18 个月重新摊销与税收抵免调整引擎
            - GoodLeap Home Card 循环信贷通道（Cross River Bank）
        - label: 资本市场与证券化网关
          detail: 机构投资者联合、远期购买路由与 ABS 发行
          modules:
            - 远期购买分配引擎
            - ABS 证券化数据管道（已完成 26+ 笔交易）
            - 仓储融资机制合规监控器
            - 机构投资组合业绩门户
    approximationNotes: 平台架构综合 GoodLeap 的技术披露、投资者演示材料与 Sacra 的技术拆解。
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE007
      - CE009
      - CE011
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 覆盖客户全生命周期：从安装商的 POS 资格评估，到贷款服务、太阳能税收抵免还款及电池扩容。
    data:
      items:
        - label: 承包商获客与评估
          actor: 承包商与房主
          detail: 安装商评估住宅太阳能与能效需求，并在客户家中介绍 GoodLeap 融资方案。
          touchpoints:
            - GoodLeap Pro 移动应用
        - label: POS 申请
          actor: 房主
          detail: 房主完成数字化信贷申请，并自动即时获得授信审批。
          touchpoints:
            - 数字 POS 门户
        - label: 安装与放款
          actor: 承包商与 GoodLeap
          detail: 承包商完成设备部署；GoodLeap 按里程碑向安装商拨付资金。
          touchpoints:
            - 安装商工作流看板
        - label: 入驻与服务
          actor: 房主
          detail: 借款人通过 GoodLeap Home 移动应用设置 ACH 自动还款并监控贷款余额。
          touchpoints:
            - GoodLeap Home 应用
        - label: 太阳能 ITC 重新摊销
          actor: 房主
          detail: 借款人在初始促销期内用 30% 联邦税收抵免偿还部分贷款余额。
          touchpoints:
            - GoodLeap 支付门户
        - label: 扩容与住宅能效
          actor: 房主与承包商
          detail: 现有借款人探索最高 $55,000 的二次融资，用于电池储能、热泵或屋顶工程。
          touchpoints:
            - GoodLeap Home Solutions 市场
        - label: 房产转让 / 结清
          actor: 房主与买方
          detail: 房屋出售时，借款人要么全额结清贷款，要么由买方正式完成信贷承接。
          touchpoints:
            - 客户服务与产权服务
    approximationNotes: 生命周期阶段综合 GoodLeap 借款人 FAQ 文档与承包商平台工作流指南。
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU007
      - CU008
