      - number: '5.3'
        title: 多资产目录、租赁 / PPA 转向与贷款结构
        blocks:
          - type: paragraph
            body: >-
              GoodLeap 最初被视为住宅太阳能贷款机构，后来扩展产品目录，为一整套可持续家居基础设施融资，包括高能效 HVAC、热泵、屋顶、窗户、门、热水器和智能家居 EV 充电硬件，最高额度
              $55,000。历史上，住宅太阳能贷款占发放量主导，通常设置 18 个月的诱导期摊销，以配合房主申报联邦投资税收抵免（ITC）。在这一机制下，除非房主将退税用于减少本金，否则第 18
              个月后月供会显著上升。面对利率上涨和 30% 住宅太阳能税收抵免在 2025 年底加速到期，GoodLeap 大力扩展第三方所有制太阳能租赁和购电协议（PPA），并推出专门的 HVAC
              租赁项目。在这些租赁模式下，GoodLeap 保留设备所有权，提供持续维护保障，并以固定、可预测的年度递增方式向客户收费，五年后可选择买断。此外，GoodLeap 推出由房屋净值信用额度支持的 GoodLeap
              Home Visa Signature Card，为优质房主提供最高 $150,000 的消费额度；符合条件的家居能效项目可获得 6% 现金返还。
