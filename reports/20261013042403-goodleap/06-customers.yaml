figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: End-to-end customer lifecycle from installer point-of-sale qualification through loan servicing, solar tax credit paydown, and battery expansion.
    data:
      items:
        - label: Contractor Lead & Assessment
          actor: Contractor & Homeowner
          detail: Installer evaluates residential solar and efficiency needs, introducing GoodLeap financing at the kitchen table.
          touchpoints:
            - GoodLeap Pro mobile app
        - label: Point-of-Sale Application
          actor: Homeowner
          detail: Homeowner completes digital credit application with automated instant underwriting approval.
          touchpoints:
            - Digital POS Portal
        - label: Installation & Funding
          actor: Contractor & GoodLeap
          detail: Contractor completes equipment deployment; GoodLeap releases milestone funds to installer.
          touchpoints:
            - Installer Workflow Dashboard
        - label: Onboarding & Servicing
          actor: Homeowner
          detail: Borrower accesses GoodLeap Home mobile app to configure ACH auto-pay and monitor loan balance.
          touchpoints:
            - GoodLeap Home App
        - label: Solar ITC Re-Amortization
          actor: Homeowner
          detail: Borrower applies 30% federal tax credit to pay down loan balance within initial promotional period.
          touchpoints:
            - GoodLeap Payment Portal
        - label: Expansion & Home Efficiency
          actor: Homeowner & Contractor
          detail: Existing borrower explores secondary financing up to $55,000 for battery storage, heat pumps, or roofing.
          touchpoints:
            - GoodLeap Home Solutions Marketplace
        - label: Property Transfer / Payoff
          actor: Homeowner & Buyer
          detail: During home sale, borrower either executes full payoff or buyer completes formal credit assumption.
          touchpoints:
            - Customer Care & Title Services
    approximationNotes: Lifecycle stages synthesised from GoodLeap borrower FAQ documentation and contractor platform workflow guides.
