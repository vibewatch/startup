callouts:
  - calloutType: insight
    title: Point-of-Sale Distribution Moat
    body: GoodLeap's primary commercial strength is its deeply embedded software network spanning thousands of installation contractors. By enabling real-time credit decisioning directly inside contractor quoting tools, GoodLeap captures borrower deal flow before traditional retail lenders can compete.
    claimRefs:
      - CU001
      - CU006
  - calloutType: risk
    title: Dealer Fee Transparency and Litigation Vulnerability
    body: The reliance on dealer origination fees—frequently bundled into contractor quotes—creates persistent regulatory and legal friction. Borrower litigation alleging undisclosed financing charges and inflated purchase prices highlights an ongoing compliance risk that could impair installer acquisition and origination pace.
    claimRefs:
      - CU004
      - CU010
