company:
  name: GoodLeap
chapter:
  number: 6
  title: Customers
  summary: GoodLeap has scaled a point-of-sale financing platform serving over 1.2 million homeowners and originating more than $30 billion in loans through a nationwide network of clean energy contractors. The company is diversifying into third-party owned solar leases and home efficiency upgrades up to $55,000, but faces material consumer finance litigation over dealer fee disclosures and maintains zero public cohort retention disclosures.
sections:
  - id: customer-segmentation-and-ecosystem
    title: Customer Segmentation and Platform Ecosystem
    body: GoodLeap operates a two-sided financial technology ecosystem addressing both consumer borrowers and commercial home improvement contractors. On the borrower side, the company finances residential clean energy upgrades, including photovoltaic solar panels, home battery storage systems, and energy-efficient HVAC and roofing installations. While residential solar represents GoodLeap's historical core, the platform has expanded into broader home efficiency projects, offering unsecured installment financing with terms between 5 and 15 years and maximum borrowing limits of up to $55,000. Crucially, the end-consumer is rarely acquired directly; instead, GoodLeap functions through an extensive B2B2C distribution channel. Contractors, installers, and home efficiency sales professionals serve as the functional users of GoodLeap's proprietary point-of-sale applications, embedding credit applications into residential sales conversations to accelerate project closing velocity.
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU006
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-trajectory-and-scale
    title: Homeowner Adoption Trajectory and Origination Scale
    body: 'GoodLeap has demonstrated substantial origination velocity since pivoting toward sustainable home improvement finance in 2018. According to platform disclosures and industry estimates, GoodLeap has funded more than $30 billion to $32 billion in cumulative clean energy loans, serving over 1.2 million homeowners nationwide across all 50 states. This distribution footprint establishes GoodLeap as a leading point-of-sale financing provider in residential solar. Standard solar loan offerings feature repayment maturities ranging from 7 to 25 years with annual percentage rates typically structured between 5% and 9%. A foundational mechanism of these loans is the integration of dealer fees and promotional initial payments: contracts assume that the homeowner will remit their 30% federal investment tax credit to re-amortize the loan balance within 18 months, after which monthly obligations escalate if the principal is not reduced.'
    claimRefs:
      - CU002
      - CU004
      - CU013
    tableRefs:
      - TU002
    figureRefs: []
  - id: commercial-partners-and-counterparties
    title: Institutional Deployments and Counterparty Evidence
    body: Sustaining origination scale requires robust institutional capital partnerships capable of absorbing loan production and providing forward liquidity. In response to rising interest rates and shifting market demand toward third-party ownership structures, GoodLeap forged an institutional partnership with Tactical Infrastructure Partners and ATLAS SP Partners to originate and fund more than $1.5 billion in residential solar leases and power purchase agreements. This initiative culminated in the closing of the $183.3 million TIP Solar ABS 2025 securitization, securing permanent financing backed exclusively by residential solar lease and PPA cash flows. Beyond financial counterparties, GoodLeap maintains commercial integration with thousands of regional installation businesses and partners with utility initiatives such as Reliant in Texas, leveraging its GoodGrid software to enroll battery-owning homeowners into virtual power plant programs.
    claimRefs:
      - CU006
      - CU011
      - CU012
    tableRefs:
      - TU003
    figureRefs: []
  - id: retention-durability-and-adverse-scrutiny
    title: Platform Durability, Churn Risks, and Legal Scrutiny
    body: 'Despite expansive top-line customer volume, GoodLeap faces meaningful platform durability and customer experience headwinds. On consumer review platforms such as EnergySage, the company holds a 3.1 out of 5 supplier rating, with negative reviews reflecting borrower confusion over contractor communication, financing fee structures, and post-installation service handoffs. More critically, GoodLeap is entangled in consumer finance litigation alleging that partnered contractors buried dealer fees and obscured true borrowing costs when presenting monthly payment terms to homeowners. Platform durability also encounters operational friction during residential property transfers: selling or refinancing a home encumbered by a GoodLeap solar loan requires formal buyer credit assumption or full loan payoff. Furthermore, GoodLeap does not report cohort retention curves, repeat borrower rates, or installer concentration, presenting an unresolved diligence gap.'
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU010
      - CU014
    tableRefs: []
    figureRefs: []
