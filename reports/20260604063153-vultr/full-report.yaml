        blocks:
          - type: paragraph
            body: >-
              Vultr’s public product surface is broader than a simple GPU-rental story. In workflow terms, the company
              starts with raw infrastructure primitives such as Cloud GPU, Block Storage, bare metal, networking, and
              x86 compute, then layers on managed control-plane services like VKE, Clusters, Container Registry, Cloud
              Inference, and Serverless Inference. The important diligence point is that these modules are not presented
              as disconnected SKUs. The current story ties specific AMD and NVIDIA GPU families to orchestration,
              storage, and API-driven deployment paths, while also preserving older general-cloud surfaces such as
              Marketplace publishing, load balancing, and customizable bare-metal installs. That makes Vultr easier to
              describe as a composable cloud platform for AI builders and platform engineers than as a single inference
              product. The packaging is still not perfectly transparent at the commercial-SKU level, but the publicly
              visible module map is concrete enough to support a real product-breadth thesis.
