chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Vultr is best understood as an independent cloud infrastructure provider that grew for a decade without
              outside equity, then used the AI-compute cycle to institutionalize its capital base. The company was
              founded in 2014 by David Aninowsky, who remains executive chairman, while J.J. Kardwell serves as CEO as
              of the run date. Official financing announcements in both December 2024 and June 2025 were datelined West
              Palm Beach, Florida, giving a stronger headquarters signal than the noisy third-party database layer.
              Public materials consistently frame Vultr as a full-stack cloud platform rather than a narrow VPS utility:
              cloud compute, bare metal, storage, Kubernetes, and GPU infrastructure appear across official pages, while
              Business Insider described the company as serving both public cloud buyers and organizations that need
              private or sovereign-cloud style deployments. The footprint story is important because it underpins nearly
              every later chapter. Financing releases referenced 32 regions in late 2024, while the current regions and
              GPU pages list 33 cloud data center regions across six continents. That change suggests continuing
              geographic expansion after the first financing event and supports management’s claim that the business
              competes on local availability, compliance posture, and global reach rather than only on commodity
              pricing.
