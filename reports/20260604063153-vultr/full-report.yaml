  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Trust, legal, and sovereign-compliance risk
        blocks:
          - type: paragraph
            body: >-
              Vultr's sharpest public risk is still a trust problem, not an infrastructure failure. The 2024
              terms-of-service backlash showed how fast legal boilerplate can become a reputational event for a cloud
              provider whose current pitch leans on privacy, sovereignty, and compliance-sensitive workloads. IT Brew,
              CRN, and The Register all documented the episode, and the fact pattern matters because management is now
              trying to sell governments, enterprises, and regulated buyers on trust, transparency, and control. That
              commercial move widens the downside of any future policy-language misstep. The sovereign-cloud layer
              raises the bar further. Independent coverage and Vultr's own public-sector, Omdia, and AI Act materials
              all point to a narrative built around local control, data residency, and policy alignment. But the
              European Commission's 2026 cloud-sovereignty framework shows that these buyers increasingly score
              providers across legal, jurisdictional, data-and-AI, operational, supply-chain, and security criteria. In
              other words, Vultr is no longer just promising cheap cloud capacity; it is promising institutional trust
              under complex procurement rules. That creates real upside if the company executes, but it also makes legal
              wording, compliance posture, and proof quality first-order investment risks.
            claimRefs:
