      - number: '2.4'
        title: Growth drivers, adoption constraints, and why the upside is conditional
        blocks:
          - type: paragraph
            body: >-
              The demand side is real. Gartner’s inference-heavy AI-optimized IaaS forecast, IDC’s AI-infrastructure
              spending trajectory, and survey evidence from Google Cloud, NVIDIA, KPMG, and Dell all point to a market
              moving from pilot to production. Cost pressure versus hyperscalers is another real driver: neocloud and
              independent-cloud research repeatedly describes lower-cost or more flexible GPU supply as a reason buyers
              look beyond the big three. Regional and sovereignty needs also create openings, particularly for regulated
              industries and public-sector workloads. But the upside is conditional because the constraint set is
              equally real. GPU supply, networking gear, power equipment, and talent remain bottlenecks. Consolidation
              risk is rising as providers need capital access, fresh fleets, and enterprise go-to-market capability just
              to stay alive through multiyear contracts. Hyperscalers can also overwhelm smaller rivals with capex and
              breadth, as shown by AWS’s expanding GPU footprint and the broad accelerator menus on AWS, Azure, and
              Google Cloud. Finally, software-stack switching costs matter: CUDA remains the dominant developer
              environment, while ROCm is improving as an open alternative but still asks customers and vendors to make
              deliberate tooling and migration choices. For Vultr, the market is attractive where cost, portability, and
              regional control matter more than catalog breadth; it is less attractive where buyers default to
              hyperscaler convenience or where supply-side economics compress the independent-cloud margin pool.
