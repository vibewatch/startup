      - number: '3.4'
        title: Moat durability and adverse pressure
        blocks:
          - type: paragraph
            body: >-
              Vultr’s moat is better described as a bundle than as a single hard-to-copy asset. The bundle includes
              broad region density for an independent cloud, explicit infrastructure pricing, GPU packaging that feels
              closer to mainstream cloud procurement than to bespoke hardware sales, and a developer-first surface that
              still reaches regulated or sovereignty-sensitive workloads. The problem is that each component can be
              attacked from a different angle. DigitalOcean can keep moving upmarket while retaining far better public
              disclosure. Akamai Cloud/Linode can combine cloud services with enterprise channels and edge distribution.
              Hetzner can continue to pressure price expectations at the lower end. Hyperscalers can always respond with
              breadth, capex, and bundle power. The supply side is equally important: TrendForce’s estimate that NVIDIA
              still controls roughly 70% of the AI chip market, plus JLL and IDC evidence on data-center and
              AI-infrastructure growth, implies the market remains capacity constrained and capital intensive.
              Sovereign-cloud demand is a genuine opportunity, but procurement frameworks and trust criteria can favor
              larger or better-known vendors as easily as they help independents. The result is a real but compressible
              moat: Vultr can win on fit and packaging, yet it cannot assume those advantages remain proprietary if
              peers keep expanding regions, channels, or GPU access.
