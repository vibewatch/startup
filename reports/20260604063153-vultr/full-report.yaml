      - number: '7.4'
        title: Financial-model and execution risk
        blocks:
          - type: paragraph
            body: >-
              The financial risk is less about current distress than about the number of variables that now have to go
              right at once. Vultr can credibly say it found institutional capital and is leaning into sovereign cloud
              plus advanced GPUs, but those moves make the business more sensitive to utilization, pricing discipline,
              support quality, and procurement execution. Creative Strategies adds a more specific warning for this
              business model: GPU depreciation cycles are shortening, older clusters can be repriced downward as newer
              generations arrive, utilization can fall faster, and shorter customer commitments can strain multi-year
              capex assumptions. That is directly relevant when Vultr is layering debt and lease-style expansion
              economics onto a market where Network World describes active price competition among neoclouds and where
              hyperscalers keep the advantage in broader enterprise tooling and compliance depth. Public sources also do
              not provide the covenant package, debt pricing mechanics, top-customer concentration, utilization cohorts,
              board oversight detail, or support-staffing depth that would let an investor fully underwrite this
              transition. This is why governance and disclosure opacity matter more now than they did when Vultr was
              simply a long-running bootstrapped alternative cloud. The company is asking the market to believe it can
              simultaneously scale regulated-workload selling, maintain trust after a prior policy controversy, absorb
              debt, and monetize fast-moving GPU roadmaps without disclosing the customer or asset-level data that would
              prove hardware payback durability.
