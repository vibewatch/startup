  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Vultr’s public product story layers vendor hardware, cloud primitives, orchestration, inference, and automation
      into one composable platform.
    approximationNotes: >-
      This stack is synthesized from product pages, technical guides, and partner artifacts rather than copied from an
      official one-page diagram.
    data:
      layers:
        - id: hardware
          label: Hardware vendor layer
          detail: >-
            AMD Instinct and NVIDIA accelerator families anchor the GPU menu, while x86 compute and bare metal provide
            the non-GPU substrate.
        - id: primitives
          label: Cloud primitives layer
          detail: >-
            Cloud GPU, Cloud Compute, Block Storage, load balancing, networking, and bare metal expose the base
            infrastructure building blocks.
        - id: orchestration
          label: Orchestration and control plane
          detail: >-
            VKE, self-service Clusters, Cluster API, Slurm options, and Marketplace publishing organize workloads above
            the primitives.
        - id: inference
          label: Inference and AI services layer
          detail: >-
            Cloud Inference, Serverless Inference, AMD Inference Microservices, and agentic-AI blueprints move the
            platform toward higher-level AI consumption.
        - id: ops
          label: Operations and trust layer
          detail: >-
            IAM organizations, vGPU licensing procedures, load-balancer health checks, private-cluster positioning, and
            Kubernetes conformance support production operations.
        - id: automation
          label: Developer interface layer
          detail: >-
            Terraform, provider repo, CLI, Go SDK, console, and API give teams multiple ways to provision and automate
            the same platform.
    claimRefs:
      - CE002
      - CE012
      - CE024
      - CE030
      - CE034
      - CE046
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      Public docs imply a workflow that moves from infrastructure provisioning to orchestration, model deployment, API
      exposure, and ongoing automation.
    approximationNotes: >-
      The flow abstracts across several buyer types and is intended to capture the common deployment path rather than a
      single mandatory sequence.
    data:
      nodes:
        - id: provision
          label: Provision GPU, CPU, or bare-metal capacity
          detail: Choose Cloud GPU, Cloud Compute, or bare metal and attach storage or networking primitives as needed.
        - id: orchestrate
          label: Choose orchestration path
          detail: Run on VKE, Vultr Clusters, Slurm, Cluster API, or direct instances depending on workload complexity.
        - id: prepare
          label: Prepare images, drivers, and registries
          detail: >-
            Use GPU-enabled images, container registry, custom ISO, or driver and vGPU procedures to ready the
            environment.
        - id: deploy
          label: Deploy models or applications
          detail: Ship self-managed inference stacks, HPC jobs, cloud-native apps, or managed inference endpoints.
        - id: expose
          label: Expose APIs or application traffic
          detail: Use Serverless Inference, OpenAI-compatible APIs, load balancing, and regional placement to reach users.
        - id: automate
          label: Automate and iterate
          detail: Terraform, the CLI, SDKs, and docs support ongoing provisioning, upgrades, and reproducible workflows.
        - id: operate
          label: Operate and govern in production
          detail: IAM, metrics, health checks, scheduler visibility, and review feedback shape ongoing reliability and trust.
      edges:
        - from: provision
          to: orchestrate
          label: select operating model
        - from: orchestrate
          to: prepare
          label: configure runtime
        - from: prepare
          to: deploy
          label: install workloads
        - from: deploy
          to: expose
          label: publish service
        - from: expose
          to: automate
          label: codify deployment
        - from: automate
          to: operate
          label: monitor and govern
    claimRefs:
      - CE001
      - CE006
      - CE007
      - CE023
      - CE024
      - CE046
