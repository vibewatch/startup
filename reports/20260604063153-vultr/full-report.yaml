      - number: '3.3'
        title: Distribution, switching, and buyer fit
        blocks:
          - type: paragraph
            body: >-
              The retained evidence suggests buyer fit now depends as much on distribution and procurement context as on
              raw infrastructure features. DigitalOcean remains the most transparent benchmark for startups, solo
              developers, and SMB SaaS teams because it couples simple product packaging with public financial
              disclosure. Hetzner attracts buyers who want low-cost infrastructure without paying for much
              managed-service overhead. Vultr is strongest where global reach, transparent infrastructure packaging, and
              flexibility matter more than having a large enterprise parent. Akamai Cloud/Linode is the most interesting
              strategic peer because Akamai ownership changes the distribution equation: the cloud platform can be
              paired with a much larger edge, security, and enterprise-sales footprint. That does not automatically make
              it a better product for every developer, but it does change who can win regulated, latency-sensitive, or
              enterprise bundle-driven workloads. Switching costs among the independent providers are real but not
              absolute. Shared use of Kubernetes, APIs, object storage compatibility, and standard network primitives
              reduces lock-in for infrastructure-first workloads, which is why multi-homing and workload-by-workload
              migration remain plausible status-quo alternatives. The most durable buyer segmentation signal is
              therefore not one universal winner, but differentiated fit by budget size, procurement complexity, and
              trust requirements.
            claimRefs:
