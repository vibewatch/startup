  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      How real capital access and AI momentum combine with hidden economics and leverage to produce a research-more
      recommendation.
    data:
      nodes:
        - id: n1
          label: Capital access
          detail: The 2024 equity round and 2025 debt package show real investor and lender interest.
          tone: positive
        - id: n2
          label: AI and sovereign demand
          detail: Visible GPU monetization plus sovereign-cloud positioning create a premium narrative.
          tone: positive
        - id: n3
          label: Comparable band
          detail: Public peers span mature-cloud discipline through AI-rerated optimism.
          tone: neutral
        - id: n4
          label: Hidden economics
          detail: Current revenue, margin, utilization, and terms remain private.
          tone: warning
        - id: n5
          label: Decision
          detail: >-
