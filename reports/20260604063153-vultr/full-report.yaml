              organizations, roles, groups, and granular permissions, and the VKE materials tie CNCF certification to a
              more portable Kubernetes experience. Operational docs also go deeper than typical marketing pages: load
              balancers expose health checks, SSL modes, firewall rules, and metrics; vGPU guides describe DKMS, driver
