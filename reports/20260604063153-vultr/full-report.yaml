      - number: '5.2'
        title: Architecture and deployment model
        blocks:
          - type: paragraph
            body: >-
              The strongest technical through-line is that Vultr documents several ways to consume the same underlying
              infrastructure. At the bottom sits vendor hardware and conventional cloud capacity: AMD and NVIDIA
              accelerators, x86 compute, block storage, and bare metal. Above that sits an orchestration layer built
              from VKE, self-service Clusters, and Cluster API automation, plus specialized paths for Slurm-based HPC or
              dstack-managed distributed training. Then the stack forks into two consumption patterns. Teams that want
              control can deploy Kubernetes-based or VM-based model-serving stacks themselves, including AMD Inference
              Microservices and custom driver management for NVIDIA vGPU environments. Teams that want abstraction can
              use Cloud Inference or Serverless Inference with OpenAI-compatible APIs and tool-calling patterns.
              Terraform, the official provider, the CLI, and the Go SDK round out the control plane. This is a coherent
              operating model, but it still leaves buyers with meaningful implementation work once they leave the most
              managed surfaces.
