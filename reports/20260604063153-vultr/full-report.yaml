  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and comparison set
        blocks:
          - type: paragraph
            body: >-
              Vultr does not compete against every cloud provider in the same way. The cleanest packaging peers in the
              retained evidence are DigitalOcean, Akamai Cloud/Linode, and Hetzner: all sell self-serve infrastructure,
              all emphasize developers or infrastructure teams, and all can be compared on core compute, storage,
              networking, and increasingly AI infrastructure. Hyperscalers still matter, but more as substitute
              benchmarks than as closest packaging matches. Synergy and Statista both show a market that is
              simultaneously huge and concentrated, which means Vultr competes inside a fast-growing category whose
              economics are still strongly shaped by much larger incumbents. Within the independent-cloud set, the
              evidence also separates peer roles. DigitalOcean is the clearest public benchmark because it discloses
              customers, revenue, and AI ARR. Akamai Cloud/Linode brings enterprise and edge distribution leverage that
              Vultr does not obviously match. Hetzner remains the value-oriented budget alternative. Vultr therefore
              sits in a middle position: broader and more globally distributed than the cheapest hosts, simpler and more
              price-legible than hyperscalers, but without DigitalOcean’s disclosure layer or Akamai’s channel power.
