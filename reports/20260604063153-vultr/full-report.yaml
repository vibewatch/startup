  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and the addressable wedge
        blocks:
          - type: paragraph
            body: >-
              Vultr should not be underwritten against the entire public-cloud universe simply because it sells compute.
              Gartner’s $723.4 billion 2025 public-cloud forecast and Synergy’s $390 billion trailing
              cloud-infrastructure run rate are useful outer shells, but they include broad managed services,
              general-purpose enterprise cloud budgets, and hyperscaler ecosystems that are not close substitutes for
              every Vultr deal. The better boundary starts with independent cloud infrastructure: rented compute, GPU,
              storage, and networking capacity for buyers that want a simpler or cheaper alternative to hyperscalers.
              From there, the wedge narrows again toward GPU cloud and sovereignty-sensitive workloads, because Vultr’s
              own and independent materials emphasize 33 regions, cost discipline, composability, and local deployment.
              That makes sovereign or local cloud an embedded feature of the wedge, not a separate market. The practical
              comparison set is therefore AWS, Azure, Google Cloud, and status-quo internal build or multi-vendor
              stacks, but only for workloads where regional placement, transparent economics, and open-stack integration
              matter enough to justify leaving the big-three default.
