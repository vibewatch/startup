      - number: '7.5'
        title: Mitigations, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The mitigation case is real but still incomplete. Vultr has some public trust infrastructure: a status
              page, security-and-compliance messaging, a bug bounty program, and better account-governance features than
              a minimal self-serve host. It also has independent evidence that lenders and regulated-workload narratives
              are being taken seriously enough to matter. But the public record still leaves the investor leaning on
              management-authored assurances for too many key questions. That is why the right way to carry this chapter
              forward is through monitorable triggers. Repeat trust controversies should be treated as thesis breaks
              because they would directly contradict the company's sovereignty and compliance positioning. Repeated
              deterioration in structured review surfaces or incident transparency should be treated as early warnings,
              not dismissed as noise. The same is true for future GPU-capacity slippage and for sovereign/public-sector
              messaging that fails to convert into independently evidenced compliance or procurement traction. A further
              trigger now matters: if hyperscaler catch-up, neocloud price compression, or rapid GPU obsolescence force
              Vultr to reprice capacity faster than hardware payback, the story moves from growth optionality to
              balance-sheet execution. Weak disclosure around concentration and utilization should therefore be handled
              as a diligence blocker, not as a harmless private-company inconvenience.
