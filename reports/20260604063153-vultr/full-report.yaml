  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Public evidence suggests Vultr often lands through operator-led infrastructure evaluation, wins on availability or
      economics, and expands into regulated or multi-region production use.
    approximationNotes: The journey abstracts across public references and does not imply a universal sequence or conversion rate.
    data:
      items:
        - label: Evaluate providers
          actor: CTO / platform lead
          touchpoints:
            - Better Stack comparison
            - Hacker News discussion
            - Website Planet review
          painpoint: Need strong hardware value without hyperscaler complexity or budget shock.
          opportunity: Price-performance and region breadth get Vultr into the shortlist.
        - label: Automate provisioning
          actor: DevOps / MLOps / infra engineer
          touchpoints:
            - Terraform provider
            - CLI
            - Cluster API guide
            - Docs
          painpoint: Teams need APIs and IaC that fit existing workflows.
          opportunity: Vultr reduces friction with Terraform, CLI, and Kubernetes automation.
        - label: Land initial production workload
          actor: Application or data owner
          touchpoints:
            - Captions
            - Athos
            - Music.AI
            - VoIP.ms
            - Nokia
          painpoint: Need reliable GPU, networking, or regional capacity for a concrete workload.
          opportunity: Named references show production-style use in AI, media, telecom, and healthcare.
        - label: Expand by geography or use case
          actor: Operations or platform team
          touchpoints:
            - 33 regions
            - Edgegap
            - Caton
            - BBT.live
            - public-sector page
          painpoint: Latency, sovereignty, and compliance requirements increase as workloads spread.
          opportunity: Region choice and sovereign positioning support multi-market deployment.
        - label: Procure at enterprise scale
          actor: Enterprise sponsor / procurement
          touchpoints:
            - Verizon AI Connect
            - SUSE alliance
            - public-sector references
          painpoint: Large buyers need evidence on trust, compliance, and service maturity.
          opportunity: Upmarket partnerships create access, but adverse trust signals still need diligence.
