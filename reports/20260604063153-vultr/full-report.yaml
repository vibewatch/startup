      - number: '7.2'
        title: Operational reliability, customer trust, and support-quality risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is visible mostly through proxy surfaces. Vultr does maintain a public status page, which
              is directionally positive because it gives customers a visible transparency layer, but it does not provide
              enough retained evidence to underwrite long-run outage frequency, SLA attainment, or root-cause
              discipline. Review platforms are therefore important complements. Trustpilot and Sitejabber surface harsh
              complaints on billing, onboarding, and support, while TrustRadius and Gartner provide more
              enterprise-weighted, structured review surfaces. Those sources should not be read as a precise
              incident-rate dataset, yet they do point to a meaningful pattern: support quality and trust operations
              matter more for Vultr than for a generic self-serve infrastructure vendor because the company is
              simultaneously courting public-sector and sovereignty-sensitive buyers. The mitigation record is real but
              mostly company-authored. Vultr can point to security-and-compliance messaging, a bug bounty program, and
              multi-user administration controls with two-factor authentication and scoped logins. Those are useful
              signals, but they are not the same as a rich public incident archive, independent control testing, or
              disclosed support-service metrics.
