      - number: '1.4'
        title: Product scope, scale signals, and disclosure boundaries
        blocks:
          - type: paragraph
            body: >-
              Public product surfaces indicate that Vultr now sells far more than basic virtual servers. The GPU page
              highlights AMD and NVIDIA accelerated infrastructure, self-service clusters, Slurm and Kubernetes
              scheduling, GPU-accelerated Kubernetes, and serverless inference. Separate announcements show the company
              making AMD Instinct MI300X broadly available, building a Chicago AMD supercompute cluster with Broadcom
              and Juniper, and leaning into sovereign or local-residency use cases. The developer surface also looks
              real: the GitHub organization shows current activity in Terraform, CLI, SDK, IAM, and Kubernetes-related
              repositories through May and June 2026. These are important signs that Vultr is investing in
              enterprise-grade tooling and integration, not just raw capacity. Still, the disclosure layer is
              incomplete. Official materials do not publish ARR, revenue, gross margin, or a hard employee count, even
              though outside coverage reports hundreds of thousands of customers and broad country reach. That means
              scale can be inferred from financing access, infrastructure breadth, and developer activity, but not fully
              underwritten from audited operating metrics. For diligence, Vultr’s public evidence is strong on platform
              breadth and strategic ambition, moderate on customer reach, and weak on financial transparency.
