      - number: '4.3'
        title: Capital Adequacy, Debt Dependence, and Expansion Risk
        blocks:
          - type: paragraph
            body: >-
              Financially, the sharpest change in Vultr's profile is the speed with which a long-bootstrapped company
              moved into external capital. The December 2024 transaction put a $3.5 billion valuation on Vultr and
              independent coverage pegged the equity check at about $333 million. Six months later, Vultr added a $329
              million package made up of a $255 million syndicated credit facility and $74 million of lease financing.
              Capacity Media and ABF Journal identify major banks in the syndicate, and ABF says the facility includes a
              $35 million uncommitted accordion. The company framed both financings as fuel for AI infrastructure and
              global expansion, while contemporaneous AMD-related announcements point to new GPU clusters and inference
              capacity as the likely sink for that capital. The unresolved issue is not whether Vultr found financing;
              it clearly did. The unresolved issue is the attachment of that financing to future cash generation. Public
              sources do not disclose debt pricing, covenants, collateral, funded-at-close amounts, utilization
              assumptions, maintenance-versus-growth capex, cash on hand, or runway. That combination makes the 2025
              facility economically meaningful but only partially underwritable from public information.
