    positioning emphasizes globally distributed infrastructure, open and composable GPU cloud, sovereign or
    compliance-sensitive deployment options, and developer-friendly control planes.
  customerFocus: >-
    Developers, AI-native builders, digital-native companies, enterprises, governments, and compliance-driven
    organizations that want cloud infrastructure without defaulting to the full hyperscaler stack.
  businessModel: >-
