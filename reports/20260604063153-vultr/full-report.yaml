      - number: '8.3'
        title: Scenario range, dilution overhang, and exit readiness
        blocks:
          - type: paragraph
            body: >-
              Because current revenue is undisclosed, the scenario work has to be explicit about what is evidence and
              what is assumption. The evidence anchors are the $3.5 billion equity mark, the $329 million 2025 debt
              package, the historical $125 million ARR milestone, visible AI-product monetization, and the public comp
              band. The bull case assumes Vultr converts sovereign-cloud and enterprise AI demand into roughly $550
              million to $650 million of 2028 revenue while sustaining premium multiples because utilization is strong
              and vendor-backed capacity keeps attracting higher-value workloads. The base case assumes more moderate
              scaling toward roughly $400 million to $500 million of revenue and a still-respectable multiple that
              leaves the current mark only barely workable. The bear case assumes weaker utilization, more ordinary
              cloud multiples, and enough leverage sensitivity to create down-round or covenant-stress risk. Debt is
              important in all three paths. The 2025 package reduced immediate dilution by replacing an equity raise,
              but it also means future equity value is now more sensitive to payback periods, collateral terms, and
              lender flexibility. Public evidence also points away from near-term IPO readiness. Vultr looks more like a
              later financing or strategic-transaction candidate than a company ready for public-market scrutiny today.
            claimRefs:
              - CV003
