      - number: '8.2'
        title: Thesis, anti-thesis, and comparable-set logic
        blocks:
          - type: paragraph
            body: >-
              The positive case for Vultr is not hard to articulate. Public sources show real AI-infrastructure
              ambition, not just hosting nostalgia. GPUs.io surfaces a real monetization layer with visible hourly
              pricing across multiple GPU families, while AMD-related announcements and the Chicago architecture launch
              show vendor-backed effort to build differentiated AI capacity. Business Insider's sovereign-cloud
              reporting adds another premium vector: Vultr is trying to sell local-control, compliance-sensitive
              infrastructure rather than just cheap compute. The anti-thesis is just as clear. Investors still cannot
              see current ARR, gross margin, utilization, or investor-friendly terms, so they may be paying AI-scarcity
              pricing without audited proof that the economics deserve it. The comparable set supports that mixed read.
              Mature infrastructure names like Akamai and OVHcloud sit at much lower revenue multiples, while AI-rerated
              names like CoreWeave and especially Nebius trade on future capacity and growth expectations. DigitalOcean
              is the most useful middle case: it combines real cloud revenue disclosure with an AI-driven rerating.
              Vultr's mark can therefore be rationalized, but only if the hidden denominator is much stronger than the
              weakest public proxies suggest.
