  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Revenue thresholds needed to support a $3.5 billion valuation under selected public comp multiples.
    data:
      items:
        - label: Needed at ~20.1x
          value: 175
          detail: Revenue required if Vultr deserves a DigitalOcean-like rerated cloud multiple.
          tone: positive
        - label: Needed at ~9.7x
          value: 361
          detail: Revenue required if Vultr deserves a CoreWeave-like AI infrastructure multiple.
          tone: warning
        - label: Needed at ~5.5x
          value: 632
          detail: Revenue required if the market applies a mature Akamai-like multiple.
          tone: negative
        - label: Historical ARR floor
          value: 125
          detail: The strongest company-published revenue anchor is still the March 2022 $125M ARR milestone.
          tone: warning
    approximationNotes: >-
      Thresholds are simple valuation divided by observed public-comp multiples; they do not adjust for net debt, cash,
      or preference terms.
    claimRefs:
      - CV009
      - CV027
      - CV028
      - CV029
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Public-evidence scenario ranges cluster around the low-to-mid $3 billion range, leaving limited upside versus
      downside at the 2024 mark.
    data:
      items:
        - label: Bear case
          low: 1500
          mid: 1950
          high: 2400
          displayValue: $1.5B-$2.4B
          detail: Ordinary cloud multiples, weaker utilization, and leverage sensitivity create down-round risk.
          tone: negative
        - label: Base case
          low: 2800
          mid: 3550
          high: 4300
          displayValue: $2.8B-$4.3B
          detail: Healthy but not exceptional revenue growth leaves the current mark only barely workable.
          tone: warning
        - label: Bull case
          low: 5000
          mid: 6100
          high: 7200
          displayValue: $5.0B-$7.2B
          detail: AI and sovereign demand convert cleanly, utilization is strong, and premium multiples hold.
          tone: positive
    approximationNotes: >-
      These are scenario-based valuation ranges for discipline, not management guidance or a discounted-cash-flow
      output.
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV035
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Vultr scores well on market momentum and capital access, but weakly on evidence quality and clean valuation
      support.
    data:
      items:
        - label: Market demand
          score: 8
          detail: AI and sovereign-cloud demand narratives are real and recently financed.
          tone: positive
        - label: Product proof
          score: 7
          detail: Visible GPU pricing and partner launches support a credible AI-infrastructure story.
          tone: positive
        - label: Capital access
          score: 9
          detail: >-
            Recent equity and debt both validate institutional interest at an unusually high level for a private
            independent cloud company.
          tone: positive
        - label: Evidence quality
          score: 3
          detail: Current revenue, margin, utilization, and terms remain under-disclosed.
          tone: negative
        - label: Valuation support
          score: 4
          detail: Public comps can rationalize the mark only under stronger hidden economics.
          tone: warning
        - label: Balance-sheet risk
          score: 4
          detail: Debt reduced dilution but added leverage and covenant sensitivity.
          tone: warning
        - label: Exit readiness
          score: 4
          detail: Public-company disclosure quality is still too thin for clean IPO readiness.
          tone: warning
    approximationNotes: >-
      Scores are ordinal analyst judgments on a 0-10 scale derived from the cited public evidence rather than
      company-reported KPIs.
