            body: >-
              Durability is the weakest part of Vultr’s public customer evidence. There is no public NRR, GRR, churn,
              renewal, or contract-duration disclosure in the fetched set, so the chapter has to rely on proxies. Some
              of those proxies are real. Hacker News discussion includes users reporting five-to-nine-year
              relationships, rare downtime, BSD and custom-ISO flexibility, and fair pricing. Vultr’s documentation
              footprint, Terraform provider, Cluster API guide, CLI, and even OpenClaw AI-agent tutorial show a company
              investing in operator-friendly adoption surfaces that can create stickiness once infrastructure is
              automated into workflows. But those positives sit beside visible quality risks. Trustpilot’s archived
              March 2026 page rates Vultr at 1.9 out of 5 from 531 reviews, and review text references billing disputes,
              terminated accounts, and refund frustration. Website Planet is similarly mixed: it praises performance and
              usability yet also cites outages, slow support, strict refund policy, and abrupt account actions. The net
              read is not that Vultr lacks customers; it is that public customer quality is polarized. Engineering-led
              and price-sensitive users often sound satisfied, while support, billing, and trust issues remain the most
              credible public adverse themes.
