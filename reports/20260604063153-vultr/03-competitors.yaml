  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: competitor-coverage
    missingEvidence: The retained pack covers the most credible packaging peers and substitutes, but it does not support exhaustive treatment of every regional neocloud, sovereign cloud, or incumbent sub-brand that could appear in a full market map.
    whyItMatters: Competitive conclusions can drift if a missing entrant has materially better GPU access, regulatory posture, or pricing than the peers summarized here.
    diligencePath: Extend the competitor pack with direct official surfaces for additional neoclouds or sovereign-cloud providers before treating the landscape as exhaustive.
    relatedQuestionRefs:
    - QP001
    - QP002
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing-normalization
    missingEvidence: Public list prices do not disclose negotiated discounts, committed-use terms, support tiers, or realized egress economics across the peer set.
    whyItMatters: A buyer can appear cheaper in list pricing while losing on actual workload economics once discounts, data transfer, and support are included.
    diligencePath: Request anonymized customer quotes or management win-loss pricing sheets for one starter compute basket and one GPU basket across peers.
    relatedQuestionRefs:
    - QP008
    - QP024
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: capability-gaps
    missingEvidence: The retained pack does not provide clean apples-to-apples evidence for certifications, SLAs, IAM depth, observability, managed databases, or compliance posture across every peer.
    whyItMatters: Those gaps can dominate enterprise, regulated, or public-sector buying even when core infrastructure primitives look similar.
    diligencePath: Pull direct security, compliance, SLA, and product-catalog pages for each peer and rebuild the capability matrix with explicit unknown markers only where evidence truly remains absent.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP002
  - type: private-evidence-only
    severity: material
    topic: channel-and-supply-access
    missingEvidence: Public materials do not disclose supplier reservation terms, enterprise channel leverage, reseller economics, or bundle attach rates across the peer set.
    whyItMatters: Distribution and supply access may decide the next wave of wins more than product breadth does, especially for GPU-heavy and regulated workloads.
    diligencePath: Ask management for supplier relationships, reservation structures, public-sector channel partners, and representative win-loss accounts against Akamai, DigitalOcean, and hyperscalers.
    relatedQuestionRefs:
    - QP017
    - QP019
    - QP026
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: independent-benchmark-coverage
    missingEvidence: Only a small number of retained independent comparison or benchmark sources make direct claims about performance, region count, or buyer fit across the peer set.
    whyItMatters: A thin independent benchmark layer increases the risk that the chapter overweights vendor-authored product pages when comparing operational performance.
    diligencePath: Add more benchmark and third-party operational sources that test comparable workloads or document actual migration outcomes between providers.
    relatedQuestionRefs:
    - QP021
