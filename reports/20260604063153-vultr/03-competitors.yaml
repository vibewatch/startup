  rows:
  - - Vultr
    - Direct peer / independent cloud
    - 33 regions plus published load-balancer, storage, and GPU list pricing; private disclosure layer
    - Developers, SMB infrastructure teams, AI workloads, sovereignty-sensitive buyers
    - Global reach for an independent cloud and explicit infrastructure packaging
    - No retained public revenue or customer-scale disclosure comparable to DigitalOcean
  - - DigitalOcean
    - Direct peer / public benchmark
    - 650k+ users, 20 data centers, 5 global regions, $258M Q1 2026 revenue, $170M AI customer ARR
    - Startups, developers, SMB SaaS, growing AI builders
    - Cleanest public benchmark for simple cloud packaging and disclosure
    - Public footprint looks smaller than Vultr on regions and less edge-distributed than Akamai
  - - Akamai Cloud/Linode
    - Direct peer / enterprise-distributed
    - 25+ core regions, 4,400+ points of presence, Akamai ownership since 2022
    - Developers, enterprise infrastructure teams, latency-sensitive AI and edge workloads
    - Enterprise channel access and edge distribution beyond a stand-alone cloud vendor
    - Starter-price comparison is less legible than DigitalOcean or comparison-led Hetzner views
  - - Hetzner
    - Direct peer / budget alternative
    - Fair-price positioning, GPU line, 24/7 support, Singapore cloud presence since 2024
    - Price-sensitive developers, EU-heavy workloads, self-managed teams
    - Best-value reputation and simple infrastructure economics
    - Retained evidence shows thinner managed-service breadth and weaker public scale disclosure
  - - Hyperscalers
    - Incumbent substitute
    - Control the dominant share of cloud-infrastructure spending inside a market heading above $500B in 2026
    - Large enterprises, regulated buyers, scale AI, bundle-driven procurement
    - Breadth, capex, and integrated services
    - Higher complexity and less like-for-like packaging with independent clouds
  - - Internal build / multi-homing
    - Status-quo substitute
    - Persists where buyers already hold contracts, hardware, or compliance workflows
    - Regulated enterprises, sovereign buyers, existing platform teams
    - Control, procurement continuity, and workload-level optimization
    - Slower deployment and higher operational burden than managed public-cloud alternatives
