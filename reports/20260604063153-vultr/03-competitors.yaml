- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - evidence
  - implication / diligence ask
  rows:
  - - Region density for an independent cloud
    - DigitalOcean, Akamai Cloud/Linode, or Hetzner continue regional expansion
    - high
    - Vultr discloses 33 regions, but Akamai already claims 25+ core regions and a far larger edge footprint
    - Ask management how much revenue truly depends on region count versus pricing, latency, or compliance fit
  - - Transparent infrastructure pricing
    - Peers or incumbents compress entry pricing or bundle around Vultr’s list-price advantage
    - high
    - DigitalOcean has the cleanest SMB list pricing and Hetzner anchors low-price expectations in comparisons
    - Request win-loss data by workload and buyer size to see whether transparency or absolute price matters more
  - - GPU / AI packaging
    - Supply concentration or hyperscaler self-prioritization narrows access to differentiated capacity
    - critical
    - TrendForce estimates NVIDIA around 70% share of the AI chip market and IDC shows AI infrastructure demand is still surging
    - Diligence needs supplier relationships, reservation terms, and utilization data rather than public list prices alone
  - - Developer-friendly portability
    - Feature convergence reduces switching cost and turns the market into price-performance competition
    - medium
    - Compute, storage, Kubernetes, and load balancing are already visible across Vultr, DigitalOcean, and Linode
    - 'Check migration friction in practice: managed databases, IAM, observability, and support process may matter more than primitives'
  - - Enterprise and channel reach
    - Akamai and hyperscalers out-distribute Vultr in enterprise-led or edge-led deals
    - high
    - Akamai ownership gives Linode a larger sales and platform context than a stand-alone independent cloud
    - Ask which enterprise or public-sector wins required partners, resale, or bundled security capabilities
  - - Sovereignty narrative
    - Procurement criteria or trust frameworks favor larger or better-known vendors
    - high
    - Gartner sees $80B sovereign cloud IaaS spending in 2026 and the European Commission framework uses 48 criteria
    - Clarify which compliance artifacts, audits, or operating models let Vultr convert sovereignty messaging into actual contracts
  - - Status-quo substitute pressure
    - Internal build and multi-homing remain rational for regulated or large-spend buyers
    - medium
    - Flexera spending data shows wide separation between SMB and enterprise cloud budgets, implying very different buyer economics
    - Ask management how often Vultr displaces existing vendors versus adding a new workload beside them
  notes: Severity reflects likely impact on differentiation durability, not probability alone. Risks are framed from retained evidence and are not exhaustive.
  enumerationScope:
    coverage: partial
    basis: 'Covers the most evidenced moat claims and response vectors visible in the retained competitors pack: region density, price transparency, GPU packaging, portability, enterprise distribution, sovereignty, and status-quo inertia.'
