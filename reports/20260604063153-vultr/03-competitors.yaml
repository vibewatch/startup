- id: TP003
  title: Pricing / packaging comparison
  columns:
  - provider
  - compute entry signal
  - storage signal
  - GPU / AI signal
  - contract / egress / support notes
  - implication
  rows:
  - - Vultr
    - Comparison-led entry pricing around the low end of the peer set; exact starter basket still varies by product
    - Object storage performance tier at $50/month plus $0.050/GB additional storage
    - 36-month prepaid A100 from $1.29/GPU/hr and HGX A100 from $1.49/GPU/hr
    - Load balancers start at $10/subscription; published prices are list rates, not realized discounts
    - Strong visibility on infrastructure list pricing, especially for AI-oriented packaging
  - - DigitalOcean
    - Droplets start at $4/month
    - Spaces starts at $5/month and is S3-compatible
    - AI products and inference surfaces are visible, though retained pack emphasizes revenue and packaging more than one normalized GPU SKU
    - Managed Kubernetes starts at $12/month; VPCs are free and inter-data-center egress overage is $0.01/GiB
    - Cleanest official pricing benchmark for developer and SMB buyers
  - - Akamai Cloud/Linode
    - Pricing pages publish regional and resource-specific pricing but not one simple peer basket
    - Object storage is S3-compatible and scaled for high throughput
    - Low predictable GPU pricing and GPU nodes for LKE are explicit, but starter comparisons require interpretation
    - Credits and usage-based elements exist; pricing breadth is real but less crisp for comparison tables
    - Broad packaging depth with harder apples-to-apples normalization
  - - Hetzner
    - Third-party comparisons place starter pricing around €4-5/month or roughly $3.79 on some plans
    - Official pages confirm S3-compatible storage
    - GPU-line and dedicated GPU pages are explicit, but retained pack is thinner on normalized cloud GPU packaging
    - Official pages emphasize fair prices and 24/7 support rather than a broad managed-services menu
    - Value leader for self-managed buyers, but direct comparability is lowest on managed-service packaging
  - - Hyperscalers / status quo
    - Pricing is large-scale and bundle-driven rather than clean entry-level list packaging
    - Storage and network pricing often depend on broader architecture and commitment choices
    - Broadest AI catalog, but independent-cloud comparison becomes structurally inexact
    - Enterprise contracts, egress complexity, and procurement commitments dominate economics
    - Most powerful substitute set, but not the cleanest packaging peer group
  notes: This table mixes monthly, hourly, prepaid, and usage-based list prices. It is intentionally a packaging comparison, not a realized-cost benchmark.
