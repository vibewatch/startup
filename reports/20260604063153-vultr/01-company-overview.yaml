- id: adverse-signals
  title: Adverse signals and what later chapters should treat as ground truth
  body: 'The cleanest adverse signal in the public record is not an outage or disclosed breach, but a trust controversy. In 2024, Reddit criticism of Vultr’s terms of service argued that the company had granted itself perpetual commercial rights over customer content. IT Brew, CRN, and The Register all reported on the backlash, while Vultr executives responded that the language was never intended to cover private customer workloads, that the company did not use customer data to train AI, and that the contested clause was removed after the outcry. This episode matters because it shows how quickly legal boilerplate can become a reputational issue for an infrastructure provider selling sovereignty, compliance, and privacy. Trustpilot’s poor March 2026 snapshot is a second weak-but-relevant warning sign: even if review sites over-index on unhappy users, the pattern indicates friction in onboarding, support, or risk controls. The ground truth later chapters should reuse is therefore straightforward.
    Vultr is a 2014-founded, West Palm Beach-based independent cloud infrastructure company led by David Aninowsky and J.J. Kardwell; it scaled to 33 regions by mid-2026; it took first outside equity at a $3.5 billion valuation in December 2024; it added $329 million of debt in June 2025; and it still leaves financial, governance, and customer-concentration questions unresolved.'
