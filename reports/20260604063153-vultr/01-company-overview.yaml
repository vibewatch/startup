company:
  name: Vultr
chapter:
  number: 1
  title: Company Overview
  summary: Vultr is a 2014-founded independent cloud infrastructure company led by founder and executive chairman David Aninowsky and CEO J.J. Kardwell. After operating as a self-funded business for more than a decade, it completed its first outside equity financing in December 2024 at a $3.5 billion valuation, with independent reporting pegging the round at $333 million, and then added $329 million of credit financing in June 2025. Public materials show the company scaling from 32 cloud data center regions in late 2024 to 33 by mid-2026 while expanding its GPU cloud, sovereign-cloud positioning, and developer tooling. The core diligence tension is that Vultr now looks institutionally capitalized and strategically ambitious, but still discloses very little on revenue, margin, headcount, customer concentration, or formal governance structure.
sections:
- id: identity-footprint
  title: Identity, headquarters, and operating footprint
  body: 'Vultr is best understood as an independent cloud infrastructure provider that grew for a decade without outside equity, then used the AI-compute cycle to institutionalize its capital base. The company was founded in 2014 by David Aninowsky, who remains executive chairman, while J.J. Kardwell serves as CEO as of the run date. Official financing announcements in both December 2024 and June 2025 were datelined West Palm Beach, Florida, giving a stronger headquarters signal than the noisy third-party database layer. Public materials consistently frame Vultr as a full-stack cloud platform rather than a narrow VPS utility: cloud compute, bare metal, storage, Kubernetes, and GPU infrastructure appear across official pages, while Business Insider described the company as serving both public cloud buyers and organizations that need private or sovereign-cloud style deployments. The footprint story is important because it underpins nearly every later chapter. Financing releases referenced
    32 regions in late 2024, while the current regions and GPU pages list 33 cloud data center regions across six continents. That change suggests continuing geographic expansion after the first financing event and supports management’s claim that the business competes on local availability, compliance posture, and global reach rather than only on commodity pricing.'
