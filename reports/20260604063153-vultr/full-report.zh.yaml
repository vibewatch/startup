  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 证据
      - 什么会改变判断
    rows:
      - - 投资逻辑：Vultr 获得了真实资本市场验证
        - $3.5B 股权融资和之后 $329M 银行牵头债务包，比多数私人基础设施同行公开披露的融资信号更强。
        - 如果下一轮融资低于 2024 年估值，或债务包之后需要修订，逻辑会走弱。
      - - 投资逻辑：AI 基础设施不只是叙事
        - 公开可见的 GPU 定价、MI300X 和 Chicago 架构公告，以及 AMD 背书信息，支撑一条真实的 AI 工作负载变现路径。
        - 如果按 GPU 系列披露 cohort 利用率、回本周期和毛利率，逻辑会更强。
      - - 投资逻辑：主权云定位可以支撑溢价需求
        - 独立报道显示，Vultr 正尝试向敏感 AI 买家销售本地控制和境内基础设施。
        - 如果披露主权或公共部门赢单，并给出更硬的采购证据，逻辑会更强。
      - - 反向逻辑：公开分母支撑偏弱
        - 当前公开收入锚点要么过时，要么权威性低，投资者无法用当前经济性核验估值。
        - 如果管理层披露当前 ARR 和毛利率桥接，情况会很快改善。
      - - 反向逻辑：债务把风险转向杠杆
        - 2025 年融资组合降低了稀释，但增加了契约、抵押物和资产回本风险。
        - 如果信贷协议显示余量充足，且硬件回本周期很短，压力会缓解。
      - - 反向逻辑：AI 可比公司按可选性交易时容易误导
        - CoreWeave，尤其 Nebius，显示 AI 标的可被重估到多高，但这些公开公司也披露了比 Vultr 更多的当前运营数据。
        - 如果 Vultr 能证明可比增长和利用率，而不只是主题暴露相近，情况会改善。
    notes: 多头逻辑在于真实平台动能；反向逻辑主要在于经济性和融资条款缺失，而不是没有需求。
