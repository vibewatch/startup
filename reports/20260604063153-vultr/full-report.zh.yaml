    rows:
      - - Vultr
        - 直接同业 / 独立云
        - 33 个区域，加上公开的负载均衡、存储和 GPU 标价；另有私有披露层
        - 开发者、SMB 基础设施团队、AI 工作负载、对主权敏感的买方
        - 作为独立云具备全球覆盖，并明确打包基础设施
        - 缺少与 DigitalOcean 可比的公开收入或客户规模披露
      - - DigitalOcean
        - 直接同业 / 公开基准
        - 650k+ 用户、20 个数据中心、5 个全球区域、2026 年 Q1 收入 $258M、AI 客户 ARR $170M
        - 初创公司、开发者、SMB SaaS、成长中的 AI 开发者
        - 简单云打包和披露的最清晰公开基准
        - 公开版图在区域数上小于 Vultr，边缘分布也不如 Akamai
      - - Akamai Cloud/Linode
        - 直接同业 / 企业级分布式
        - 25+ 个核心区域、4,400+ 个 PoP，2022 年起由 Akamai 持有
        - 开发者、企业基础设施团队、延迟敏感 AI 和边缘工作负载
        - 企业渠道触达和边缘分发能力，超过独立云厂商
        - 起步价格对比不如 DigitalOcean 或以对比取胜的 Hetzner 视角清晰
      - - Hetzner
        - 直接同业 / 低价替代方
        - 公平价格定位、GPU 产品线、24/7 支持，2024 年起在新加坡有云业务
        - 价格敏感开发者、欧洲占比高的工作负载、自管理团队
        - 性价比口碑和简单的基础设施经济性
        - 留存证据显示托管服务广度更薄，公开规模披露更弱
      - - 超大规模云厂商
        - 既有替代方
        - 在 2026 年将超过 $500B 的云基础设施市场中控制主导份额
        - 大型企业、受监管买方、规模化 AI、打包驱动采购
        - 广度、资本开支和集成服务
        - 复杂度更高，与独立云不容易逐项对齐打包
      - - 自建 / 多宿主
        - 现状替代方案
        - 买方已有合同、硬件或合规工作流时，这一选项会持续存在
        - 受监管企业、主权买方、既有平台团队
        - 控制权、采购连续性和工作负载级优化
        - 部署比托管公有云替代方案更慢，运营负担更高
    notes: 覆盖范围刻意不完整：它聚焦留存竞争对手材料中可见、最可信的打包同业、既有替代方和现状替代方案，而不是每一家区域 GPU 或 VPS 供应商。
