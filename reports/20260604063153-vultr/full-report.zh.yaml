      - number: '8.2'
        title: 投资逻辑、反向逻辑与可比公司组逻辑
        blocks:
          - type: paragraph
            body: >-
              Vultr 的正向逻辑并不难讲清。公开来源显示，公司是真有 AI 基础设施野心，而不只是留恋托管业务。GPUs.io 呈现了真实变现层，多条 GPU 产品线都有可见的小时计价；AMD 相关公告和 Chicago
              架构发布，则显示供应商背书下打造差异化 AI 容量的努力。Business Insider 关于主权云的报道又增加了一个溢价向量：Vultr
              试图销售本地控制、合规敏感型基础设施，而不只是便宜算力。反向逻辑同样清晰。投资人仍看不到当前 ARR、毛利率、利用率或对投资人友好的条款，因此可能在没有审计证据证明经济性值得的情况下，为 AI
              稀缺性付价。可比公司组支持这种混合判断。Akamai、OVHcloud 等成熟基础设施公司处在低得多的收入倍数上，而 CoreWeave、尤其是 Nebius 这类被 AI
              重估的公司，则按未来容量和增长预期交易。DigitalOcean 是最有用的中间案例：它既有真实云收入披露，也经历了 AI 驱动的重估。因此，Vultr
              的估值标记可以被合理化，但前提是隐藏分母远强于最弱公开代理信号所暗示的水平。
