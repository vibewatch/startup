  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 影响
      - 尽调问题
    rows:
      - - AI 优化 IaaS 中，推理超过训练
        - 驱动因素
        - 当前至中期
        - 利好能够跨区域低成本跑持续在线生产级推理的供应商
        - 向管理层询问推理与训练 GPU 预订的构成。
      - - 生产级 AI 采用和工作流自动化
        - 驱动因素
        - 当前
        - 买方范围从前沿 AI 实验室扩到主流企业和运营团队
        - 询问客户群按初创公司、企业和受监管工作负载的拆分。
      - - 区域覆盖、边缘和数据驻留
        - 驱动因素
        - 当前
        - 提高多区域独立云对低延迟或受监管工作负载的价值
        - 询问哪些区域和产品带来主权或本地驻留需求。
      - - 相对超大规模云厂商的成本压力
        - 驱动因素
        - 当前
        - 买方既要 GPU，又不想被超大规模云完全锁定或被出站流量成本卡住，因此会出现切入口
        - 询问实际每 GPU 小时价格与具名超大规模云替代方案的对比。
      - - GPU 供应、电力和网络瓶颈
        - 约束
        - 当前
        - 即便终端客户需求强劲，也可能压住已预订需求
        - 询问供应合同、预留容量和有电力支撑的扩张计划。
      - - 新云厂商整合和折旧风险
        - 约束
        - 当前至中期
        - 可能压缩独立供应商格局，并抬高客户集中或融资风险
        - 询问合同期限、设备更新节奏和资本可得性。
      - - CUDA 锁定与 ROCm 迁移负担
        - 约束
        - 当前
        - 买方切换更难，也限制多供应商 GPU 策略落地速度
        - 询问工作负载在 NVIDIA 与 AMD 栈上的占比，以及有哪些迁移工具。
      - - 超大规模云厂商的广度与合规实力
        - 约束
        - 当前
        - 大厂可以把 GPU 与更广的云服务和监管材料打包
        - 询问哪些工作负载持续选择 Vultr 而不是 AWS、Azure 或 Google Cloud，以及原因。
    notes: 这张表把每个驱动因素或约束连接到采用时点和采购逻辑，而不是把市场增长当成抽象叙事。
