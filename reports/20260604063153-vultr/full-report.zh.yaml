  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与可切入楔形
        blocks:
          - type: paragraph
            body: >-
              Vultr 卖计算，但不能因此按整个公共云宇宙来做投资判断。Gartner 对 2025 年公共云 $723.4 billion 的预测，以及 Synergy 对过去 12 个月云基础设施 $390
              billion 的运行率估算，都是有用的外层边界；但其中包含大量托管服务、通用企业云预算和超大规模云生态，并不是每一笔 Vultr
              交易的近似替代品。更好的边界从独立云基础设施开始：面向那些想要比超大规模云更简单或更便宜选择的买家，出租计算、GPU、存储和网络容量。再往内，楔形又收窄到 GPU 云和主权敏感工作负载，因为 Vultr
              自身材料和独立材料都强调 33 个区域、成本纪律、可组合性和本地部署。也就是说，主权或本地云是这个楔形内置特征，不是另一个独立市场。因此，实际可比对象包括 AWS、Azure、Google
              Cloud，以及现状下的内部自建或多供应商栈；但只限于那些区域放置、透明经济性和开放栈集成重要到足以让客户离开三大默认选项的工作负载。
