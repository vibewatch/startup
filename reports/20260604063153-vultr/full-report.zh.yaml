      - number: '3.2'
        title: 能力与价格对比
        blocks:
          - type: paragraph
            body: >-
              同业之间的功能收敛已经很高，对 Vultr 既是好事也是坏事。好处是，许多常见工作负载已经不必依赖超大规模云：官方页面显示 Vultr、DigitalOcean 和 Akamai Cloud / Linode
              都提供计算、对象存储、Kubernetes 和负载均衡，Hetzner 则用低成本覆盖更基础的云加 GPU 栈。坏处是，收敛降低了切换成本。S3 兼容对象存储、标准 Kubernetes
              接口等商品化组件，让许多工作负载的迁移更像运营问题，而不是架构问题。因此，更尖锐的战场不是供应商有没有基础设施原语，而是它如何包装、能部署到多全球化、定价对开发者和 SMB
              买家有多清楚。保留的官方证据中，DigitalOcean 对小买家给出的价格信号最干净，包括 $4 Droplets、$5 Spaces 和 $12 托管 Kubernetes。Vultr
              则用公开清楚的负载均衡、对象存储和长期 GPU 标价来回应。Akamai Cloud / Linode 展示了宽广的基础设施和 AI 能力，但价格表面更难规整成一个统一入门篮子。Hetzner
              仍在第三方比较中赢得最明确的预算定位，不过托管服务证据更薄。
