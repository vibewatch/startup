          detail: 为 GB300 和 B200 路线图产品供货
          type: supplier
        - id: d3
          label: 银行财团
          detail: 信贷和租赁融资交易对手方
          type: financier
        - id: d4
          label: EU 与主权云框架
          detail: 受监管工作负载的采购和合规标准
          type: regulator
        - id: d5
          label: 合作伙伴软件栈
          detail: Rancher 式公共部门部署打包
          type: partner
        - id: d6
          label: Vultr 运营
          detail: 核心云、支持、安全和 GTM 执行
          type: company
        - id: d7
          label: AI 与公共部门销售管线
          detail: 客户增长取决于信任和容量交付
          type: customer
      edges:
