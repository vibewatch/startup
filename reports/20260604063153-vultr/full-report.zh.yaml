              工作负载需求中有多少是经常性生产流量、多少是阶段性实验。客户数量叙事也没有完全对齐：审阅集合包含 80 million 台云服务器启动、CRN 引用的 1.5 million
              客户数等规模代理，但具名参考质量远薄于这些数字暗示的水平。因此，最审慎的尽调态度应当平衡。Vultr
              有真实采用、真实生产参考和真实上行动能；但如果没有数据室和客户访谈，公开披露还不足以支撑对留存经济性或集中度风险的投资判断。
