  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景、分母风险与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Vultr 进入估值工作时，公开层面有两个异常强的融资锚点，也有一个异常重要的缺失分母。强锚点容易说明。公司在 2024 年 12 月完成首轮外部股权融资，估值 $3.5B；独立报道将融资规模放在约
              $333M，随后又在 2025 年 6 月新增 $329M 信贷加租赁方案。这些事实重要，因为它们表明股权投资人和贷款人都愿意承保 Vultr 的 AI
              基础设施扩张。缺失的分母是当前收入。公司发布过的最强收入锚点是历史性的：Vultr 母公司 Constant 在 2022 年 3 月称其 ARR 已超过
              $125M。当前第三方估计分散到更适合作为警示，而不是三角校验。Latka 显示 $13.6M，Growjo 和 CompWorth 显示 $37.2M，Owler 给出 $100M 到 $500M
              区间。因此，入场纪律必须从公开可比公司阈值倒推：大约 $175M 的当前收入可以按类似 DigitalOcean 的倍数支撑该估值标记，但若采用成熟云厂商倍数，就需要大得多的规模。
