              最强的技术主线是，Vultr 记录了消费同一底层基础设施的多种方式。底部是供应商硬件和常规云容量：AMD 与 NVIDIA 加速器、x86 计算、块存储和裸金属。其上是由 VKE、自助式 Clusters 和
              Cluster API 自动化组成的编排层，还包括面向 Slurm 型 HPC 或 dstack 管理的分布式训练的专门路径。之后，技术栈分叉成两种消费模式。需要控制权的团队可以自己部署基于 Kubernetes
