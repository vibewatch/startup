      - number: '1.3'
        title: 融资历史、资本结构与投资人叙事
        blocks:
          - type: paragraph
            body: >-
              Vultr 的资本故事不是连续依赖风投，而是延迟机构化。多方来源一致显示，公司自筹资金超过十年，直到 2024 年 12 月才接受首轮外部股权融资。对一家私营公司来说，核心事实异常强：估值 $3.5
              billion，LuminArx Capital Management 与 AMD Ventures 共同领投，独立报道的轮次规模为 $333 million。该轮融资实质性改变了公司姿态，因为不到 6
              个月后，公司又拿到由蓝筹银行牵头的 $329 million 信贷包。2025 年 6 月融资包括 $255 million 银团授信和 $74 million 租赁融资，由 J.P. Morgan、Bank
              of America 和 Wells Fargo 牵头，Citi、Goldman Sachs 和 KeyBank 参与。合在一起，这些事件说明两点。第一，贷款方相信 Vultr
              有足够运营纪律和资产可见性，可以承接基础设施债务，而不只是股权资金。第二，公司正在进入资本更密集的阶段，AI
              基础设施扩张的重要性已经不亚于类软件效率。管理层明确把债务融资与服务企业、政府和合规驱动型客户挂钩，进一步强化了一个信息：Vultr 想成为超大规模云厂商之外具备机构级质量的独立替代品，而不是小众托管服务商。
