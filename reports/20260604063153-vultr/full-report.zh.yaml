      - number: '2.2'
        title: 规模测算视角、矛盾与真正能推断出的东西
        blocks:
          - type: paragraph
            body: >-
              规模证据足以划出量级区间，但不足以假装 Vultr 有一个干净的 TAM、SAM 和 SOM。最外层边界是公共云服务和公共 IaaS，Gartner 的 2025 年数字分别为 $723.4 billion 和
              $211.9 billion。Synergy 的云基础设施口径更窄，也更贴近租用计算，但仍主要反映由超大规模云厂商控制的支出。AI 基础设施和 AI 优化 IaaS 构成第二个视角：IDC 称 2025 年 AI
              基础设施支出达到 $318 billion，Gartner 则预计 AI 优化 IaaS 将在 2026 年达到 $37.5 billion，其中推理已占多数。之后，市场再次收窄到
              GPUaaS，但公开估算分歧很大。Fortune、Grand View、MarketsandMarkets 和 Mordor
              并不是因为有人犯了简单算术错误才不一致；它们衡量的是围绕公共云、私有或混合部署、边缘容量和相邻 AI 基础设施服务的不同外壳。这种离散反而有分析价值。它说明 Vultr
              参与的是一个有意义的市场，但正确的投资判断应当给楔形设边界，而不是直接套用一个巨型云 TAM。没有公开来源能把 Vultr 的已预订 GPU 小时、主权工作负载组合或区域收入隔离到足够细，从而把这个楔形转成精确的
              SAM 或 SOM。
