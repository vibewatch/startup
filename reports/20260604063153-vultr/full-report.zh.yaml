      - number: '1.4'
        title: 产品范围、规模信号与披露边界
        blocks:
          - type: paragraph
            body: >-
              公开产品表面显示，Vultr 现在销售的远不止基础虚拟服务器。GPU 页面突出 AMD 和 NVIDIA 加速基础设施、自助式集群、Slurm 与 Kubernetes 调度、GPU 加速
              Kubernetes，以及无服务器推理。其他公告显示，公司已在广泛提供 AMD Instinct MI300X，与 Broadcom 和 Juniper 在 Chicago 建设 AMD
              超算集群，并加码主权或本地驻留用例。开发者表面也是真实的：GitHub 组织在 Terraform、CLI、SDK、IAM 和 Kubernetes 仓库中，直到 2026 年 5 月和 6
              月仍有活动。这些信号重要，因为 Vultr 不只是堆原始容量，也在投入企业级工具和集成。不过，披露层仍不完整。官方材料没有公布
              ARR、收入、毛利率或硬性的员工数，尽管外部报道提到数十万客户和较广国家覆盖。因此，规模可以从融资渠道、基础设施宽度和开发者活动中推断，却无法用经审计的运营指标完全支撑。就尽调而言，Vultr
              的公开证据在平台宽度和战略野心上很强，在客户触达上中等，在财务透明度上较弱。
