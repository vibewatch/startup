  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 估值逻辑
      - 指示性价值区间
      - 概率信号
      - 相对 $3.5B 估值的回报
    rows:
      - - 乐观
        - 2028 年收入达到约 $550M-$650M；AI 利用率高；主权和企业需求转化；债务偿付仍有充足余地。
        - 采用约 9x-11x 收入，更接近高溢价 AI 基础设施可比公司，而不是成熟云公司。
        - $5.0B-$7.2B
        - ~25%：需要增长和清晰的单位经济性同时兑现。
        - ~1.4x-2.1x
      - - 基准
        - 2028 年收入达到约 $400M-$500M；核心云叠加 AI 增长表现不错但不突出；债务可控，且没有不利条款意外出现。
        - 采用约 7x-8.5x 收入，介于 AI 重估和成熟云估值纪律之间。
        - $2.8B-$4.3B
        - ~50%：最符合当前公开证据。
        - ~0.8x-1.2x
      - - 悲观
        - 2028 年收入仅达到约 $300M-$400M；利用率、集中度或定价不及预期；杠杆敏感性上升。
        - 采用约 5x-6x 收入，更接近成熟基础设施和承压私募市场的估值纪律。
        - $1.5B-$2.4B
        - ~25%：如果未披露的经济性普通，或债务条款比乐观派假设更紧，这一情景就可能成立。
        - ~0.4x-0.7x
      - - 概率加权
        - 三种情景按中点加权后的输出。
        - 情景组合，而不是单一精确目标。
        - ~$3.4B-$3.8B
        - 中心情景
        - ~1.0x
    notes: 区间是指示性的企业价值口径输出，以公开可比公司倍数区间和明确收入假设为锚，不是管理层指引，也不是 DCF。
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV035
  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public cloud and AI-infrastructure references with retained market-cap and
        revenue evidence; it is not an exhaustive peer set and does not adjust every row to enterprise value.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Vultr（标的）
        - 私募估值相对已披露和代理收入锚点
        - $3.5B 估值；按 2022 ARR 下限约 28x；按 Owler 区间约 7x-35x；按低端追踪器约 94x-257x
        - 显示当前估值对未披露分母有多敏感。
        - 当前收入未公开披露，因此隐含倍数区间异常宽，且部分依据权威性较低。
      - - DigitalOcean
        - 2026 年 6 月市值 / FY2025 收入
        - $18.12B 市值 / $901M 收入 = ~20.1x
        - 对独立云平台而言，这是最好的公开中性可比对象：AI 重估强，且有真实收入披露。
        - 市值不是企业价值，且 DigitalOcean 是上市公司、规模更大、透明度更高。
      - - Akamai
        - 2026 年 6 月市值 / FY2025 收入
        - $23.31B 市值 / $4.208B 收入 = ~5.5x
        - 有云基础设施收入披露，可作为成熟云估值纪律的有用锚点。
        - Akamai 远比 Vultr 多元化，也更成熟。
      - - CoreWeave
        - 2026 年 6 月市值 / 往绩收入
        - $60.52B 市值 / $6.23B 往绩收入 = ~9.7x
        - 资本强度和增长维度上，最好的纯 AI 基础设施上市参考。
        - 公开市场流动性、规模和披露水平都远高于 Vultr。
      - - Nebius
        - 2026 年 6 月市值 / 往绩收入
        - $63.90B 市值 / $877.9M 往绩收入 = ~72.8x
        - 显示市场可以多激进地定价 AI 产能期权和未来工厂建设。
        - 倍数极端，可能包含期权价值、现金和未来产能，不能与今天的 Vultr 直接相比。
      - - OVHcloud
        - 2026 年 6 月市值 / FY2025 收入锚点
        - $2.89B 市值对应 €1.0846B 收入；实际是低个位数的成熟云估值锚点
        - 对一家有规模、且明确披露收入和 EBITDA 的欧洲云服务商而言，这是有用的下行估值纪律。
        - 汇率换算和业务组合差异会限制与 Vultr 对比的精度。
    notes: 目标不是找到完美可比公司，而是划定 Vultr 估值中有多少能由普通云经济性解释，又有多少来自 AI 基础设施乐观预期。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
  - id: TV005
    title: 投资逻辑破裂与否决触发表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 当前收入太低
        - 管理层数据表明当前收入明显低于约 $175M，且没有异常优秀的利润率质量。
        - 即便采用 AI 重估后的上市公司倍数，也无法支撑 $3.5B 估值。
        - 不按 2024 年价格承销。
      - - 债务包比乐观派假设更紧
        - 信贷或租赁文件显示限制性契约、抵押品余量不足，或硬件回本差。
        - 杠杆从过桥资本变成放大股权风险的工具。
        - 用更低倍数重切估值，并要求更强的下行保护。
      - - 下一轮融资重设估值
        - 任何有定价的股权轮次以等于或低于 2024 年 12 月估值完成。
        - 稀缺性溢价叙事未能转化为价值增值。
        - 将其视为估值重置，而不是暂时的观感问题。
      - - GPU 利用率或毛利率不及预期
        - 利用率偏弱，或 AI 工作负载毛利率明显低于预期。
        - AI 基础设施溢价失去经济支撑。
        - 下调乐观情景概率，并把公司推向回避。
      - - 主权 / 企业管线未能转化
        - 公共部门或主权需求仍偏营销，没有真实合同证据。
        - 一个较清晰的溢价叙事会大体变成愿景。
        - 降低估值溢价，只聚焦核心云经济性。
    notes: 这些是围绕价格的破局条件，不是泛泛的经营风险。每一项都会直接改变当前估值对新投资人的价值。
    claimRefs:
      - CV041
      - CV044
      - CV045
      - CV046
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前 ARR 与收入桥
        - 当前 ARR、开票收入、确认收入，以及 2025-2026 年按工作负载家族拆分的增长。
        - 估值问题主要是分母风险。
        - CFO 材料包、董事会材料，以及审计师准备的桥表。
      - - 毛利率与利用率
        - 按 GPU 队列、核心云、主权 / 公共部门工作负载拆分的毛利率，以及硬件利用率和回收周期。
        - 只有利用率和回收周期能支撑持久利润率，AI 基础设施溢价才站得住。
        - FP&A 复核加基础设施运营看板。
      - - 债务与租赁文件
        - 完整信贷协议、租赁明细、契约定义、抵押品包、定价网格和修订阈值。
        - 杠杆能帮助股权价值，也可能摧毁股权价值，取决于细则。
        - 资金部、贷款方律师和融资资料室。
      - - 股权结构表与优先权
        - 最新股权结构表、股份类别、清算优先权、反稀释条款，以及 2024 年轮次中任何内部老股交易历史。
        - 如果下行保护激进，醒目的投后估值可能有误导性。
        - 首席律师和财务运营。
      - - 客户质量与集中度
        - 头部客户占比、NRR、GRR、公共部门管线转化，以及主权云合同证据。
        - 收入质量决定 AI 和主权叙事是否配得上溢价倍数。
        - 收入运营分析和客户访谈。
      - - 退出准备度
        - 经审计财务节奏、治理包、IPO 控制准备度，以及任何战略买方地图。
        - 如果缺少可信退出路径，完整私募估值对新资金而言仍可能是糟糕入口。
        - CEO、董事会材料和投行尽调。
    notes: 每一项要求都直接对应一个可能改变推荐结论的变量，而不是对公司的泛泛好奇。
    claimRefs:
      - CV031
      - CV036
      - CV037
      - CV047
