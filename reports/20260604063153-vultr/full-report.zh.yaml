  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、价格表面与变现不透明
        blocks:
          - type: paragraph
            body: >-
              Vultr 的公开证据最能说明产品如何销售，而不是每条收入流贡献多少。官方计费文档把客户导向集中定价页，并披露若干具体计量型附加项，例如快照每 GB-month $0.05、超额带宽每 GB $0.01，均以
              USD 计费。第三方定价表面补充了更多可见入口：TrustRadius 称价格从 $2.50 起，共 9 个套餐选项；G2 列出 Cloud Compute 每月 $2.50、Optimized Cloud
              Compute $28、Bare Metal $120、Cloud GPU 从 $90 起；GPUs.io 报告约 20 种 GPU 配置，跨度大约为每 GPU-hour $0.48 到
              $1.56。合在一起，这些来源支撑的是一种混合变现模型：低摩擦自助入门 SKU，用存储和带宽拉动计量扩张，再用 GPU
              或裸金属承接更重的企业工作负载支出。仍然缺失的是从标价到已预订收入之间的落地层。公开记录没有披露企业折扣、转售商经济性、国际税务漏损、合约期限，或预订中按用量计费与承诺支出的占比。因此，收入桥可以从机制上描述，但还不能从经济性上支撑投资判断。
