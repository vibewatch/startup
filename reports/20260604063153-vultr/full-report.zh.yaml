  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 公开文档暗示一条工作流：先配置基础设施，再编排、部署模型、暴露 API，并持续自动化。
    approximationNotes: 该流程抽象了几类买家，意在捕捉常见部署路径，而非单一强制顺序。
    data:
      nodes:
        - id: provision
          label: 配置 GPU、CPU 或裸金属容量
          detail: 选择 Cloud GPU、Cloud Compute 或裸金属，并按需挂载存储或网络基础能力。
        - id: orchestrate
          label: 选择编排路径
          detail: 根据工作负载复杂度，在 VKE、Vultr Clusters、Slurm、Cluster API 或直接实例上运行。
        - id: prepare
          label: 准备镜像、驱动和注册表
          detail: 使用支持 GPU 的镜像、容器注册表、自定义 ISO，或驱动和 vGPU 流程来备好环境。
        - id: deploy
          label: 部署模型或应用
          detail: 上线自管推理栈、HPC 任务、云原生应用或托管推理端点。
        - id: expose
          label: 暴露 API 或应用流量
          detail: 借助 Serverless Inference、OpenAI 兼容 API、负载均衡和区域部署触达用户。
        - id: automate
          label: 自动化并迭代
          detail: Terraform、CLI、SDK 和文档支持持续配置、升级和可复现工作流。
        - id: operate
          label: 生产环境运营与治理
          detail: IAM、指标、健康检查、调度器可见性和评审反馈塑造持续可靠性与信任。
      edges:
        - from: provision
          to: orchestrate
