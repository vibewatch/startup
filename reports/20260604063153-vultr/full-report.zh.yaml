            body: >-
              耐久性是 Vultr 公开客户证据中最弱的一块。抓取集合中没有公开 NRR、GRR、流失、续约或合约期限披露，因此本章只能依赖代理指标。其中一些代理是真实的。Hacker News 讨论中，有用户报告与
              Vultr 保持 5 到 9 年关系、少有停机、BSD 和自定义 ISO 灵活性，以及公平定价。Vultr 的文档足迹、Terraform provider、Cluster API 指南、CLI，甚至
              OpenClaw AI-agent 教程，都显示公司在投入对运维友好的采用表面；一旦基础设施自动化进入工作流，这些表面可以制造粘性。但这些正面信号旁边，也有可见质量风险。Trustpilot 2026 年 3
              月归档页显示，Vultr 在 531 条评价中得分 1.9 / 5，评论文本提到账单争议、账号终止和退款不满。Website Planet
              同样好坏参半：它称赞性能和易用性，也提到宕机、支持慢、退款政策严格和账号突然处理。净判断不是 Vultr
              没有客户，而是公开客户质量两极分化。工程导向和价格敏感用户往往听起来满意，而支持、账单和信任问题仍是最可信的公开反向主题。
