companyProfile:
  summary: >-
    Vultr 是一家私有云基础设施公司，David Aninowsky 于 2014 年创立。公司大约十年都靠自有资金运营，提供云计算、存储、网络、裸金属和 Kubernetes 服务，直到 2024 年 12
    月才拿到首轮外部股权融资。如今，Vultr 把自己定位成超大规模云厂商之外的独立选择，主攻 GPU 云、主权或本地化敏感部署，以及面向开发者的基础设施。公开材料显示，截至 2026 年中，公司拥有 33 个云数据中心区域，AMD 和
    NVIDIA GPU 产品线较宽，Terraform、CLI、SDK、IAM 等开发者工具持续活跃，并在强化企业和公共部门叙事。最关键的尽调张力在于，Vultr
    已拿到真实的资本市场验证，也能看到产品宽度，但仍没有披露投资人通常用于支撑 $3.5 billion 估值的运营指标。
