  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Vultr 的受监管工作负载和 AI 扩张依赖一条链：芯片供应商、贷款人、主权框架和合作伙伴交付软件都在其中。
    data:
      nodes:
        - id: d1
          label: AMD
          detail: MI355X 路线图及相关 GPU 产品的供应商
          type: supplier
        - id: d2
