      - number: '4.2'
        title: 公开牵引力代理、单位经济性与利润率路径
        blocks:
          - type: paragraph
            body: >-
              牵引力记录方向上积极，但数字并不稳定。Vultr 自己在 2022 年的博客称，母公司 Constant 已超过 $125 million ARR、1.5 million 用户和 50 million
              次云部署。不过，当前收入并未公开。第三方追踪器的范围从 Latka 的 $13.6 million 估算，到 Growjo 和 CompWorth 的 $37.2 million，再到 Owler 极宽的
              $100 million 到 $500 million 区间。分散度太大，应视为不确定性证据，而不是三角验证。管理层在宣布 2025 年 6 月债务融资时也称 Vultr 已盈利，但没有定义这指的是 GAAP
              利润、调整后 EBITDA，还是自由现金流。同业披露说明了这一区分为何重要：DigitalOcean 和 OVHcloud 都报告超过 40% 的 EBITDA 利润率，而 Akamai 和 OVHcloud
              仍有明显资本强度；CoreWeave 的 SEC 备案新闻稿也显示，GPU 重资产模式同样可能累积大量债务。就 Vultr
              本身而言，毛利率、折旧政策、利用率、CAC、回本周期、NRR、欺诈损失和客户集中度都未披露。因此，合理结论不是单位经济性薄弱，而是本章只能勾勒其可能驱动因素，不能确认。
