        title: 分层组合与采用表面
        blocks:
          - type: paragraph
            body: >-
              Vultr 的公开客户图景是真实的，但更适合理解为一组由工作负载牵引的楔形，而不是一份清晰披露的客户账本。最强可见分层包括 AI 和 ML
              构建者、媒体与游戏平台、电信和通信运营商、公共部门或主权敏感工作负载，以及规模更小的医疗和生命科学群体。这个组合重要，因为它解释了 Vultr 为什么会出现在市场中：客户反复提到的是 GPU
              可用性、可预测的性价比、区域选择和更简单的运维工具，而不是宽泛托管服务目录。媒体、电信和医疗页面都把采用与本地性和合规联系在一起，不只是原始计算；Cloud GPU 表面则强调 33
              个区域、自助式集群、Slurm 或 Kubernetes 调度，以及 API 控制。结果是一个比 SaaS 更基础设施原生的客户画像。买家看起来包括
              CTO、平台团队、网络工程师，以及需要让计算靠近数据或用户的受监管行业 IT 负责人。不可见的是管理层按收入档、地域或客户规模披露的组合，因此分层表是证明地图，不是 ARR 地图。
