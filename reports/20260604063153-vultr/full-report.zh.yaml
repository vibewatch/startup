  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 真实资本获取能力和 AI 动能，与未披露经济性和杠杆叠加，如何推导出继续研究建议。
    data:
      nodes:
        - id: n1
          label: 资本获取
          detail: 2024 年股权轮和 2025 年债务包显示，投资人和贷款方兴趣真实存在。
          tone: positive
        - id: n2
          label: AI 与主权云需求
          detail: 可见的 GPU 变现，加上主权云定位，撑起溢价叙事。
          tone: positive
        - id: n3
          label: 可比公司区间
          detail: 上市同行横跨成熟云纪律到 AI 重估乐观预期。
          tone: neutral
        - id: n4
          label: 未披露经济性
          detail: 当前收入、利润率、利用率和条款仍未公开。
          tone: warning
        - id: n5
          label: 决策
          detail: 在公开证据层面只能继续研究：只有尽调补上分母和条款缺口，才值得继续跟进。
          tone: neutral
      edges:
        - to: n5
          from: n1
        - to: n5
          from: n2
        - to: n5
          from: n3
        - to: n5
          from: n4
    approximationNotes: 该图概括决策逻辑，不是带加权系数的因果模型。
    claimRefs:
      - CV026
      - CV028
      - CV038
      - CV039
      - CV042
      - CV043
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在选定上市可比倍数下，支撑 $3.5 billion 估值所需的收入门槛。
    data:
      items:
        - label: 约 20.1x 时所需收入
          value: 175
          detail: 如果 Vultr 配得上 DigitalOcean 式重估云倍数，需要达到的收入。
          tone: positive
        - label: 约 9.7x 时所需收入
          value: 361
          detail: 如果 Vultr 配得上 CoreWeave 式 AI 基础设施倍数，需要达到的收入。
          tone: warning
        - label: 约 5.5x 时所需收入
          value: 632
          detail: 如果市场套用成熟的 Akamai 式倍数，需要达到的收入。
          tone: negative
        - label: 历史 ARR 下限
          value: 125
          detail: 公司公开披露过的最强收入锚点，仍是 2022 年 3 月 $125M ARR 里程碑。
          tone: warning
    approximationNotes: 门槛只是用估值除以可观察的上市可比公司倍数；未调整净债务、现金或优先条款。
    claimRefs:
      - CV009
      - CV027
      - CV028
      - CV029
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开证据下的情景区间集中在 $3 billion 低至中段，相比 2024 年估值标记，上行有限、下行更明显。
    data:
      items:
        - label: 悲观情景
          low: 1500
          mid: 1950
          high: 2400
          displayValue: $1.5B-$2.4B
          detail: 普通云倍数、利用率偏弱、杠杆敏感性叠加，带来降轮风险。
          tone: negative
        - label: 基准情景
          low: 2800
          mid: 3550
          high: 4300
          displayValue: $2.8B-$4.3B
          detail: 收入增长健康但不惊艳，当前估值标记只是勉强站得住。
          tone: warning
        - label: 乐观情景
          low: 5000
          mid: 6100
          high: 7200
          displayValue: $5.0B-$7.2B
          detail: AI 和主权云需求顺利转化，利用率强劲，溢价倍数守得住。
          tone: positive
    approximationNotes: 这些是用于保持纪律的情景估值区间，不是管理层指引，也不是贴现现金流模型输出。
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV035
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Vultr 在市场动能和资本获取上得分较好，但证据质量和清晰估值支撑偏弱。
    data:
      items:
        - label: 市场需求
          score: 8
          detail: AI 和主权云需求叙事真实存在，而且最近拿到了融资背书。
          tone: positive
        - label: 产品验证
          score: 7
          detail: 可见的 GPU 定价和合作伙伴发布，支撑可信的 AI 基础设施故事。
          tone: positive
        - label: 资本获取
          score: 9
          detail: 近期股权和债务融资都验证了机构兴趣；在私营独立云公司里，这个兴趣水平异乎寻常地高。
          tone: positive
        - label: 证据质量
          score: 3
          detail: 当前收入、利润率、利用率和条款披露仍不足。
          tone: negative
        - label: 估值支撑
          score: 4
          detail: 只有未披露经济性更强，上市可比公司才足以解释当前估值标记。
          tone: warning
        - label: 资产负债表风险
          score: 4
          detail: 债务减少了稀释，但也增加了杠杆和债务契约敏感性。
          tone: warning
        - label: 退出准备度
          score: 4
          detail: 上市公司级披露质量仍太薄，难以干净地满足 IPO 准备度。
          tone: warning
    approximationNotes: 评分是分析师基于所引公开证据给出的 0-10 序数判断，不是公司披露的 KPI。
    claimRefs:
      - CV036
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
