      - number: '8.4'
        title: 建议、投资逻辑击穿触发点与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              基于公开证据的建议是继续研究，不是因为 Vultr 没有真实业务，而是因为估值问题仍由隐藏变量主导。本章可以支撑一个真实的乐观情景：公司有机构融资、可见的 GPU 变现、差异化主权云叙事，以及在 AI
              基础设施中重要的供应商关系。本章也能支撑一个真实的审慎情景：公开收入锚点陈旧或权威性不足，2025 年债务方案增加杠杆敏感性，2024
              年优先股堆叠仍未公开。这种组合导向中等置信度、高风险评级和偏高估值立场。正确的下一步不是否定 Vultr，也不是条件反射式接受该估值标记，而是要求一份简短、投资人级别的尽调包，快速解决分母和条款问题。当前 ARR
              与按工作负载拆分的毛利率、GPU 利用率与回本、完整信贷和租赁文件、股权结构表与优先股堆叠、头部客户集中度，都应排在任何通用产品演示之前。如果这些要求顺利过关，Vultr 仍可能是一笔可行的 AI
              基础设施投资；如果不能，投资逻辑应迅速击穿，而不是只靠叙事延续。
