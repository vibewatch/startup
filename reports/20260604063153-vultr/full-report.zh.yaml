      - - 云 GPU / AI 基础设施服务
        - 用于训练、微调、推理和 HPC 式 AI 工作负载的按需或预留加速计算
        - 本地 GPU 采购，以及从未离开买方资产负债表的纯硬件资本开支
        - ML 平台团队、AI 初创公司、企业 IT、研究机构
        - Vultr 的关键增长楔子
      - - 主权或本地驻留云
        - 工作负载位置、本地运营和司法管辖控制会影响供应商选择的云部署
        - 不带基础设施销售的纯政策咨询或合规软件
        - 政府、受监管企业、公共部门数字团队
        - Vultr 区域战略上的重要叠加层
      - - 超大规模云替代方案和现状
        - 买方本可以放在 AWS、Azure、Google Cloud，或留在拼接式多供应商栈里的工作负载
        - 无关的企业软件类别和通用生产力支出
        - CIO、CTO、平台、采购、业务发起人
        - 定义替代品和切换压力
      - - 排除的外层
