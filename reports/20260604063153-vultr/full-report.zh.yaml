chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与运营版图
        blocks:
          - type: paragraph
            body: >-
              理解 Vultr，最合适的框架是：一家独立云基础设施提供商先在没有外部股权的情况下增长十年，再借 AI 算力周期把资本基础机构化。公司由 David Aninowsky 于 2014
              年创立，他目前仍任执行董事长；截至本报告日期，J.J. Kardwell 担任 CEO。2024 年 12 月和 2025 年 6 月的官方融资公告都以 Florida 州 West Palm Beach
              为发布地，发布地信号强过嘈杂的第三方数据库，更能指向总部位置。公开材料也一直把 Vultr 描述成全栈云平台，而不是狭义 VPS 工具：官方页面覆盖云计算、裸金属、存储、Kubernetes 和 GPU
              基础设施；Business Insider 则称公司服务公共云买家，也服务需要私有或主权云式部署的组织。版图叙事很重要，因为后续几乎所有章节都靠它支撑。2024 年末融资新闻稿提到 32 个区域，而当前区域页和
              GPU 页面列出横跨六大洲的 33 个云数据中心区域。区域数变化说明首轮融资之后，公司仍在继续地域扩张，也支撑了管理层的说法：Vultr 的竞争点不只是商品化价格，还包括本地可用性、合规姿态和全球覆盖。
