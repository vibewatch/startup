      - number: '4.3'
        title: 资本充足性、债务依赖与扩张风险
        blocks:
          - type: paragraph
            body: >-
              财务上，Vultr 画像最剧烈的变化，是一家长期自筹资金的公司迅速进入外部资本市场。2024 年 12 月交易给 Vultr 定出 $3.5 billion 估值，独立报道将股权融资金额定在约 $333
              million。6 个月后，Vultr 又增加一个 $329 million 融资包，由 $255 million 银团授信和 $74 million 租赁融资构成。Capacity Media 和 ABF
              Journal 点名了银团中的大型银行，ABF 称该授信还包含 $35 million 未承诺增额条款。公司把两次融资都描述为 AI 基础设施和全球扩张燃料，而同期 AMD 公告则指向新的 GPU
              集群和推理容量，这很可能就是资本投向。未解决的问题不是 Vultr
              是否拿到了融资；它显然拿到了。真正未解决的是这些融资如何绑定未来现金生成。公开来源没有披露债务价格、契约、抵押品、首笔提款金额、利用率假设、维护性与增长性资本开支、在手现金或现金跑道。这个组合让 2025
              年授信具有经济意义，但仅靠公开信息只能部分支撑投资判断。
