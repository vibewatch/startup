  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 供应商
      - 计算入门信号
      - 存储信号
      - GPU / AI 信号
      - 合同 / 出站流量 / 支持说明
      - 含义
    rows:
      - - Vultr
        - 以对比为主的入门价格处在同业低位附近；准确的起步组合仍因产品而异
        - 对象存储性能层 $50/month，额外存储 $0.050/GB
        - 36 个月预付 A100 $1.29/GPU/hr 起，HGX A100 $1.49/GPU/hr 起
        - 负载均衡器 $10/subscription 起；公开价格是标价，不是实际折扣价
        - 基础设施标价透明度强，AI 导向打包尤其明显
      - - DigitalOcean
        - Droplets $4/month 起
        - Spaces $5/month 起，兼容 S3
        - AI 产品和推理入口可见，但留存材料更强调收入和打包，而不是一个标准化 GPU SKU
        - 托管 Kubernetes $12/month 起；VPC 免费，跨数据中心出站流量超额部分为 $0.01/GiB
        - 开发者和 SMB 买方最清晰的官方价格基准
      - - Akamai Cloud/Linode
        - 价格页面公布区域和资源维度价格，但没有一个简单同业组合
        - 对象存储兼容 S3，并按高吞吐扩展
        - 低且可预测的 GPU 价格和 LKE GPU 节点表述明确，但起步对比需要解读
        - 有抵扣和按用量计费元素；定价广度真实存在，但放进对比表时不够清晰
        - 打包深度广，但更难做同口径归一化
      - - Hetzner
        - 第三方对比把起步价放在约 €4-5/month，部分方案约 $3.79
        - 官方页面确认 S3 兼容存储
        - GPU 产品线和专用 GPU 页面明确，但留存材料对标准化云 GPU 打包的证据更薄
        - 官方页面强调公平价格和 24/7 支持，而不是广泛托管服务菜单
        - 对自管理买方是价值领导者，但在托管服务打包上直接可比性最低
      - - 超大规模云厂商 / 现状
        - 定价由大规模和打包驱动，不是清晰入门标价打包
        - 存储和网络价格常取决于更大的架构和承诺选择
        - AI 目录最广，但与独立云的对比在结构上不精确
        - 企业合同、出站流量复杂度和采购承诺主导经济性
        - 最强替代方案集合，但不是最清晰的打包同业组
    notes: 这张表混合月费、小时费、预付和按用量计费标价。它刻意比较打包方式，不是实际成本基准。
    enumerationScope:
      coverage: partial
      basis: >-
        Uses the public list-pricing and comparison surfaces retained in the pack for the most relevant peer set. It
        does not estimate negotiated discounts, committed-use pricing, support tiers, or full egress economics across
        every provider.
