  - id: TP004
    title: 护城河耐久度 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 证据
      - 影响 / 尽调问题
    rows:
      - - 独立云的区域密度
        - DigitalOcean、Akamai Cloud/Linode 或 Hetzner 继续区域扩张
        - 高
        - Vultr 披露 33 个区域，但 Akamai 已声称拥有 25+ 个核心区域和大得多的边缘版图
        - 向管理层询问收入中有多少真正依赖区域数量，而不是价格、延迟或合规匹配
      - - 透明基础设施定价
        - 同业或既有厂商压低入门价格，或围绕 Vultr 的标价优势打包
        - 高
        - DigitalOcean 的 SMB 标价最清晰，Hetzner 在对比中锚定低价预期
        - 要求按工作负载和买方规模提供赢单 / 输单数据，看透明度还是绝对价格更重要
      - - GPU / AI 打包
        - 供应集中或超大规模云优先自用，让差异化容量更难拿到
        - 严重
        - TrendForce 估计 NVIDIA 约占 AI 芯片市场 70%，IDC 显示 AI 基础设施需求仍在激增
        - 尽调需要供应商关系、预留条款和利用率数据，不能只看公开标价
      - - 开发者友好的可迁移性
        - 功能趋同降低切换成本，把市场推向性价比竞争
        - 中
        - Vultr、DigitalOcean 和 Linode 都已能看到计算、存储、Kubernetes 和负载均衡
        - 核查实际迁移摩擦：托管数据库、IAM、可观测性和支持流程可能比基础组件更重要
      - - 企业与渠道触达
        - 在企业主导或边缘主导交易中，Akamai 和超大规模云厂商的分发能力强于 Vultr
        - 高
        - Akamai 持有让 Linode 拥有比独立云更大的销售和平台语境
        - 询问哪些企业或公共部门赢单需要合作伙伴、转售或打包安全能力
      - - 主权叙事
        - 采购标准或信任框架偏向更大或更知名供应商
        - 高
        - Gartner 预计 2026 年主权云 IaaS 支出为 $80B，欧盟委员会框架使用 48 项标准
        - 澄清哪些合规材料、审计或运营模式能让 Vultr 把主权叙事转成实际合同
      - - 现状替代方案压力
        - 对受监管或高支出买方，自建和多宿主仍然合理
        - 中
        - Flexera 支出数据显示 SMB 与企业云预算差距很大，意味着买方经济性完全不同
        - 向管理层询问 Vultr 有多常替换既有供应商，而不是在旁边增加一个新工作负载
    notes: 严重性反映差异化耐久度的可能影响，而不只是概率。风险基于留存证据提出，并不穷尽。
    enumerationScope:
