      - number: '4.4'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              Vultr 的收入质量在结构上看起来说得通，但投资判断所需质量仍不完整。正面部分已经足够清楚：客户能看到入门价格，产品目录支持多种变现表面，存在计量型超额收费，AI
              基础设施需求看起来真实，股权投资人和银行贷款方也刚刚为增长提供资金。谨慎点同样清楚：公司没有公布当前 ARR、分产品收入组合、按工作负载划分的毛利率、折旧表、烧钱速度、现金跑道、集中度，或 2025
              年债务包的法律条款。即使公开收入估算存在，也相互矛盾到不能作为事实锚点。因此，本章只能给出有边界的结论。如果利用率强、债务结构保守，Vultr
              可能有健康的利润率路径；但第三方追踪器中流传的低端收入情景，会实质改变杠杆容忍度、契约余量和估值支撑。投资判断之前，尽调应索取当前 ARR
              和按产品家族划分的已开票收入、盈利能力桥、硬件折旧表、利用率与采购假设、完整信贷协议、客户集中度和留存指标。在此之前，正确态度是认可模型质量，但对财务精度保持谨慎。
