      - number: '2.4'
        title: 增长驱动、采用约束与上行为什么有条件
        blocks:
          - type: paragraph
            body: >-
              需求侧是真实的。Gartner 对推理占主导的 AI 优化 IaaS 预测、IDC 的 AI 基础设施支出轨迹，以及来自 Google Cloud、NVIDIA、KPMG 和 Dell
              的调研证据，都指向一个从试点走向生产的市场。相对超大规模云厂商的成本压力也是真实驱动：neocloud 和独立云研究反复提到，更低成本或更灵活的 GPU
              供给，是买家看向三巨头之外的理由。区域和主权需求同样打开窗口，尤其是受监管行业和公共部门工作负载。但上行空间有条件，因为约束同样真实。GPU
              供给、网络设备、电力设备和人才仍是瓶颈。整合风险在上升，供应商需要资本渠道、新机群和企业级销售能力，才有可能撑过多年期合约。超大规模云厂商也能用资本开支和产品宽度压倒较小对手，AWS 不断扩张的 GPU
              版图，以及 AWS、Azure、Google Cloud 丰富的加速器菜单都说明了这一点。最后，软件栈切换成本也重要：CUDA 仍是主导开发者环境；ROCm
              作为开放替代品在改善，但仍要求客户和供应商主动做工具与迁移选择。对 Vultr
              而言，当成本、可移植性和区域控制比目录宽度更重要时，市场很有吸引力；当买家默认选择超大规模云的便利，或供给侧经济性挤压独立云利润池时，吸引力就会下降。
