      - number: '1.5'
        title: 反向信号，以及后续章节应视为底层事实的内容
        blocks:
          - type: paragraph
            body: >-
              公开记录中最清晰的反向信号不是宕机或披露的安全事件，而是一场信任争议。2024 年，Reddit 上对 Vultr 服务条款的批评认为，公司授予自己对客户内容的永久商业权利。IT Brew、CRN 和 The
              Register 都报道了这场反弹；Vultr 高管回应称，该条款从未意在覆盖客户的私有工作负载，公司也没有用客户数据训练
              AI，并且争议条款已在舆论爆发后删除。事件的重要性在于，基础设施提供商一边销售主权、合规和隐私，一边可能因为法律模板文字迅速陷入声誉问题。Trustpilot 2026 年 3
              月的低分截面是第二个较弱但值得纳入的警讯：即使评论网站会高估不满用户，评论模式仍指向入门、支持或风控摩擦。后续章节应复用的底层事实很直接。Vultr 是一家 2014 年创立、总部位于 West Palm
              Beach 的独立云基础设施公司，由 David Aninowsky 和 J.J. Kardwell 领导；到 2026 年中扩展到 33 个区域；2024 年 12 月以 $3.5 billion
              估值拿到首轮外部股权；2025 年 6 月增加 $329 million 债务；财务、治理和客户集中度问题仍未解决。
