  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Vultr 的公开产品叙事把供应商硬件、云基础能力、编排、推理和自动化叠成一个可组合平台。
    approximationNotes: 该技术栈根据产品页、技术指南和合作伙伴材料综合而成，并非照搬官方单页图。
    data:
      layers:
        - id: hardware
          label: 硬件供应商层
          detail: AMD Instinct 和 NVIDIA 加速器系列支撑 GPU 菜单，x86 计算与裸金属提供 非 GPU 底座。
        - id: primitives
          label: 云基础能力层
          detail: Cloud GPU、Cloud Compute、Block Storage、负载均衡、网络和裸金属提供基础设施底层模块。
        - id: orchestration
          label: 编排与控制平面
          detail: VKE、自助式 Clusters、Cluster API、Slurm 选项和 Marketplace 发布把工作负载组织在 基础能力之上。
        - id: inference
          label: 推理与 AI 服务层
          detail: Cloud Inference、Serverless Inference、AMD Inference Microservices 和智能体 AI 蓝图把 平台推向更高层级的 AI 使用场景。
        - id: ops
          label: 运营与信任层
          detail: IAM 组织、vGPU 授权流程、负载均衡健康检查、私有集群定位和 Kubernetes 一致性支撑生产运营。
        - id: automation
          label: 开发者接口层
          detail: Terraform、provider 仓库、CLI、Go SDK、控制台和 API 让团队用多种方式配置并自动化 同一个平台。
