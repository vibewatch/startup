      - number: '8.3'
        title: 情景区间、稀释压力与退出准备度
        blocks:
          - type: paragraph
            body: >-
              由于当前收入未披露，情景工作必须明确区分证据与假设。证据锚点包括 $3.5B 股权估值标记、2025 年 $329M 债务方案、历史 $125M ARR 里程碑、可见 AI
              产品变现，以及公开可比公司区间。乐观情景假设 Vultr 将主权云和企业 AI 需求转化为大约 $550M 到 $650M 的 2028
              年收入，同时因利用率强、供应商背书容量持续吸引更高价值工作负载而维持溢价倍数。基准情景假设公司以更温和速度扩至约 $400M 到 $500M
              收入，并保持仍然体面的倍数，使当前估值标记勉强说得过去。悲观情景假设利用率较弱、云业务倍数回归普通水平，且杠杆敏感性足以引发估值下调融资或债务契约压力风险。三条路径里，债务都很重要。2025
              年方案用债务替代股权融资，降低了即时稀释；但未来股权价值也因此对回本周期、抵押条款和贷款人灵活度更敏感。公开证据也不支持近期 IPO 准备就绪。今天的 Vultr
              更像后续融资或战略交易候选，而不是已经能接受公开市场审视的公司。
