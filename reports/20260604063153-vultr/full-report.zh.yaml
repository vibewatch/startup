      - number: '7.3'
        title: 供应商、资本提供方与合作伙伴依赖风险
        blocks:
          - type: paragraph
            body: >-
              Vultr 的 AI 基础设施逻辑同样依赖交易对手，而不只是内部执行。债务故事是一层依赖：CNBC 和 ABF Journal
              显示，公司现在已有真实贷款人关系和更机构化的资本结构，构成支撑，但也意味着未来扩张不再只绑定自举增长纪律，还绑定信贷可得性和硬件回本。第二层是 GPU 供应。Vultr 的 GB300、B200 和 MI355X
              材料具有商业价值，但也暴露出路线图与 AMD 和 NVIDIA 的发布时间、分配以及供应商表现叙事紧密相连。GB300
              预购信息尤其重要，因为它明确讲的是未来可用性，而不是已经落地的容量。第三层是生态交付。Vultr 的公共部门 Rancher
              用例显示，一些受监管部署需要合作伙伴软件和解决方案打包，而不只是几排算力机架。第四层是市场结构。Creative Strategies 认为，超大规模云厂商追上 GPU
              供应和平台深度后，新云基础设施缺口正在收窄；Network World 则引用 Uptime 数据称，即便现有云厂商继续握有安全、合规、工具和合同优势，新云厂商目前仍主要靠价格取胜。AMD 多元化有所帮助，但
              Orchestrator 2026 年 CUDA 与 ROCm 对比仍把 CUDA 描述为事实上的 AI/ML 标准，把 ROCm
              描述为正在改进、而非完全等价。因此，依赖图谱比芯片本身更宽：它包括供应商、贷款人、监管机构、解决方案伙伴，以及越来越由资本更厚的现有云厂商和规模化新云同行设定的定价伞。
