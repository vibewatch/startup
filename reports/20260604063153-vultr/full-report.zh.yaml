          label: 配置运行时
        - from: prepare
          to: deploy
          label: 安装工作负载
        - from: deploy
          to: expose
          label: 发布服务
        - from: expose
          to: automate
          label: 将部署代码化
        - from: automate
          to: operate
          label: 监控并治理
