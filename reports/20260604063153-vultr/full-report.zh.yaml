          opportunity: Named references show production-style use in AI, media, telecom, and healthcare.
        - label: 按地域或用例扩展
          actor: 运营或平台团队
          touchpoints:
            - 33 个区域
            - Edgegap
            - Caton
            - BBT.live
            - 公共部门页面
          painpoint: Latency, sovereignty, and compliance requirements increase as workloads spread.
          opportunity: Region choice and sovereign positioning support multi-market deployment.
        - label: 企业级采购
          actor: 企业发起人 / 采购
          touchpoints:
            - Verizon AI Connect
            - SUSE 联盟
            - 公共部门参考
          painpoint: Large buyers need evidence on trust, compliance, and service maturity.
          opportunity: Upmarket partnerships create access, but adverse trust signals still need diligence.
    claimRefs:
      - CU005
      - CU014
      - CU025
      - CU028
      - CU031
      - CU039
      - CU044
      - CU045
  - id: FU002
    title: 采用 / 部署流程
    type: flow
    layout: wide
    summary: 可见的公开动作从开发者或平台评估开始，进入自动化配置、工作负载验证，最后走向更广的企业或主权定位。
    approximationNotes: 流程阶段反映证据密度，不是实测转化率。
    data:
      nodes:
        - id: discover
          label: 性能或成本发现
          detail: 潜在客户通过基准测试、社区推荐或行业营销接触 Vultr。
        - id: tooling
          label: 工具与自动化匹配
          detail: Terraform、CLI、文档和 Cluster API 降低运营和开发团队的摩擦。
        - id: workload
          label: 首个生产工作负载
          detail: AI、媒体、电信或游戏团队落地看重可用性、区域或可预测成本的工作负载。
        - id: multiregion
          label: 多区域或多云扩展
          detail: 客户增加地域、边缘位置或与合作伙伴联动的部署。
        - id: enterprise
          label: 企业 / 主权采购
          detail: Verizon、公共部门和 SUSE 相关证据显示其走向更大受监管账户的路径。
      edges:
        - from: discover
          to: tooling
          label: 技术评估
        - from: tooling
          to: workload
          label: 自动化并部署
        - from: workload
          to: multiregion
          label: 增加区域 / 工作负载
        - from: multiregion
          to: enterprise
          label: 采购正式化
    claimRefs:
      - CU025
      - CU028
      - CU029
      - CU030
      - CU031
      - CU041
      - CU044
      - CU051
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: Vultr 最强的公开证据同时具备具名账户、清晰部署场景，以及至少一个客户选择平台的具体理由； 独立佐证较少。
    data:
      columns:
        - 结果具体性
        - 生产成熟度
        - 留存可见性
        - 独立佐证
      rows:
        - label: Athos
          values:
            - 低-中 — 只有定性背书
            - 中 — 具体 GPU 和 Dell 部署背景
            - 低 — 没有合同或续约信号
            - 低 — 只有官方引语
        - label: Captions
          values:
            - 中 — 有清晰选择理由，无 ROI 数字
            - 高 — 产品功能和 GPU 需求明确
            - 低 — 没有续约披露
            - 低 — 只有官方垂直页面
        - label: Music.AI
          values:
            - 中 — 45M+ 用户背景和 H100 训练摘要
            - 高 — AI 工作负载描述清晰
            - 低 — 没有合同期限或支出
            - 低 — 只有官方页面
        - label: VoIP.ms
          values:
            - 高 — 年账单节省约 30%
            - 高 — 供应商整合到 Vultr
            - 低 — 没有续约期限
            - 低 — 只有官方页面
        - label: Nokia
          values:
            - 中 — 没有 ROI 数字，但有详细研讨会使用场景
            - 中-高 — 裸金属和实验室技术栈明确
            - 低 — 研讨会使用不是续约指标
            - 低 — 只有官方页面
        - label: Verizon
          values:
            - 中 — 战略扩张理由
            - 高 — 具名企业边缘 AI 合作
            - 低 — 没有收入或部署量数据
            - 高 — Verizon 和 DCD 佐证
    claimRefs:
      - CU005
      - CU007
      - CU011
      - CU013
      - CU019
      - CU020
      - CU041
      - CU042
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 残余严重性最高的地方，是信任、合规和先进容量承诺相互叠加，而非任何孤立类别。
    approximationNotes: 位置反映可见缓释后的残余风险，不是纯理论下行。标签综合保留下来的公开记录， 并非公司提供的评分卡。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 严重影响
          values:
            - 单一来源诉讼或监管突袭
            - 主权或公共部门证据缺口；贷款人撤退
            - 数据权利争议反复；先进 GPU 容量落空
        - label: 高影响
          values:
            - 合作伙伴软件执行失误
            - 状态或可靠性信心缺口；治理不透明
            - 支持和计费摩擦；信任信号恶化
        - label: 中等影响
          values:
            - Omdia 促销或白皮书过度延展
            - 账户治理复杂度
            - 评测或投诉渠道带来的营销噪音
    claimRefs:
      - CR034
      - CR036
      - CR038
      - CR039
      - CR040
      - CR041
      - CR042
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主要风险路径从信任、合规和容量冲击出发，传导到客户、利润率、融资灵活性，最终落到估值。
    data:
      nodes:
        - id: n1
          label: 信任争议
          detail: 政策措辞或隐私反弹
          type: risk
        - id: n2
          label: 支持摩擦
          detail: 计费、上手或服务投诉
          type: risk
        - id: n3
          label: 主权证据缺口
          detail: 合规承诺跑在证据前面
          type: risk
        - id: n4
          label: GPU 容量落空
          detail: 路线图供给或分配滑坡
          type: risk
        - id: n5
          label: 企业客户犹豫
          detail: 受监管或对信任敏感的买家放慢节奏
          type: impact
        - id: n6
          label: 收入不及预期
          detail: 转化延迟或扩张放缓
          type: impact
        - id: n7
          label: 利润率压力
          detail: 利用率更低、支持成本更高
          type: impact
        - id: n8
          label: 融资压力
          detail: 对贷款人信心的依赖加重
          type: impact
        - id: n9
          label: 估值受损
          detail: 风险调整后上行空间的信心下降
          type: impact
      edges:
        - from: n1
          to: n5
        - from: n2
          to: n5
        - from: n3
          to: n5
        - from: n4
          to: n6
        - from: n5
