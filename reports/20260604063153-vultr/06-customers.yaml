- id: TU006
  title: Review and reference-surface comparison table
  columns:
  - Source surface
  - Signal
  - What it proves
  - Adverse note
  - Reliability limit
  rows:
  - - Trustpilot
    - 1.9 / 5 from 531 reviews
    - Large adverse-review footprint exists
    - Billing, refund, and termination complaints are visible
    - Skews toward unhappy users and is not enterprise-segmented
  - - Website Planet
    - Positive on speed and ease, negative on support and outages
    - Mixed third-party product narrative
    - Strict no-return policy and abrupt-account anecdotes recur
    - Blends editorial testing with unverified user reviews
  - - Hacker News
    - Several multi-year users report good value and low downtime
