company:
  name: Vultr
chapter:
  number: 6
  title: Customers
  summary: Vultr’s public customer evidence is real but uneven. Official sources show production-style use in AI and ML, healthcare, media and gaming, telecom, and sovereign or public-sector-adjacent workloads, with named references including Athos, Captions, Music.AI, Edgegap, Caton, Nokia, VoIP.ms, VirtualShield, and a strategically important Verizon relationship that is independently corroborated. Customers repeatedly cite GPU availability, region coverage, price-performance, and operator-friendly API or IaC tooling, but retention economics and customer concentration remain undisclosed, while Trustpilot, Website Planet, and the 2024 TOS controversy show visible support, billing, and trust risks.
sections:
- id: segment-mix-and-adoption-surface
  title: Segment mix and adoption surface
  body: 'Vultr’s public customer picture is real, but it is better understood as a set of workload-led wedges than as a clean disclosed customer ledger. The strongest visible segments are AI and ML builders, media and gaming platforms, telecom and communications operators, public-sector or sovereignty-sensitive workloads, and a smaller healthcare and life-sciences cohort. This mix matters because it explains why Vultr shows up in the market at all: customers repeatedly cite GPU availability, predictable price-performance, region choice, and simpler operator tooling rather than a broad managed-services catalog. The media, telecom, and healthcare pages all tie adoption to locality and compliance as much as raw compute, while the Cloud GPU surface emphasizes 33 regions, self-service clustering, Slurm or Kubernetes scheduling, and API control. The result is a customer profile that looks more infrastructure-native than SaaS-like. Buyers appear to be CTOs, platform teams, network engineers, and
    regulated-sector IT leaders who need compute close to data or users. What is not visible is a management-disclosed mix by revenue band, geography, or customer size, so the segmentation table is a proof map rather than an ARR map.'
