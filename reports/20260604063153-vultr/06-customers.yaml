- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Likely buyer / user
  - Representative public proof
  - Primary adoption reasons
  - Evidence strength
  - Key gap
  rows:
  - - AI / ML startups and model builders
    - CTO, ML platform, MLOps, research teams
    - Athos, Music.AI, Captions, OpenClaw tutorial, Cloud GPU page
    - GPU availability, global regions, serverless inference, price-performance
    - Strong for workload fit; medium for account economics
    - No disclosed ARR share or production-spend mix by AI cohort
  - - Healthcare and life sciences
    - Clinical AI, research IT, data science, compliance leaders
    - Athos quote, AKASA reference, healthcare page
    - Data residency, HIPAA-oriented positioning, AI compute for diagnostics and drug discovery
    - Moderate; named references exist but KPI depth is thin
    - Few quantified public outcomes and no healthcare revenue split
  - - Media, content, and gaming
    - CTO, infra, rendering, broadcast, game backend teams
    - Captions, Music.AI, Edgegap, Caton, Axlebolt
    - Consistent GPU supply, low latency, global availability, multicloud flexibility
    - Strong; several named references with concrete use cases
    - Mostly company-curated proof, not independent reference calls
  - - Telecommunications and communications platforms
    - Network engineering, product, platform, workshop and operations teams
    - Nokia, VoIP.ms, BBT.live, Veriswitch, Caton, 3CX
    - Predictable pricing, API-driven deployment, sovereign-capable regions, low-cost egress
    - Strong on use-case breadth
    - No public contract size, renewal, or top-carrier concentration data
  - - Public sector and sovereign-adjacent workloads
    - Agency IT, defense research, secure platform teams, sovereign cloud buyers
    - Verizon AI Connect, VirtualShield, Clarifai, Synetic.ai, RGS
    - Compliance, sovereignty, predictable economics, edge and AI readiness
    - Moderate; real names but partner-heavy and still curated
    - Needs independent customer references and production-scale economics
  - - Developers, self-serve operators, and SMB infrastructure users
    - DevOps, founders, self-hosters, independent developers
    - Hacker News thread, docs, CLI, Terraform provider, Website Planet
    - Straightforward provisioning, custom ISO support, automation, good raw performance
    - Moderate; community and docs are visible
    - Hard to separate hobbyist usage from commercial retention quality
  notes: Segment weights are analytical rather than disclosed. Public proof is much better at identifying workload categories than at revealing customer mix by revenue, seat count, or geography.
