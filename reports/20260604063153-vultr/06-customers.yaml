- id: concentration-risk-and-open-asks
  title: Concentration risk and open diligence asks
  body: 'Vultr’s public customer story is strongest when framed as adoption proof and weakest when framed as economic proof. The positive side is clear enough. Verizon, telecom references, public-sector pages, and SUSE-related material all point to an upmarket motion into enterprise inference, sovereign cloud, and mission-sensitive workloads. That suggests Vultr is more than a long tail of hobbyist VPS instances. Yet the public record still does not reveal top-customer concentration, partner-sourced revenue mix, customer segmentation by revenue band, or how much of the AI workload demand is recurring production traffic versus episodic experimentation. Customer-count rhetoric is also not fully reconciled: the reviewed set includes scale proxies such as 80 million cloud servers launched and a CRN-cited 1.5 million customer figure, but named reference quality is much thinner than either number suggests. The most prudent diligence stance is therefore balanced. Vultr has real adoption, real production
    references, and real upmarket momentum; it does not yet provide enough public disclosure to underwrite retention economics or concentration risk without a data room and customer calls.'
