- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Dimension
  - Public evidence
  - Implication
  - Current read
  - Diligence path
  rows:
  - - Enterprise expansion vector
    - Verizon AI Connect plus public-sector, telecom, and SUSE-related infrastructure partnerships
    - Vultr is moving beyond self-serve VPS into enterprise inference and sovereign workloads
    - Positive strategic signal
    - Ask for enterprise ARR mix and spend concentration among inference-heavy accounts
  - - Land-and-expand through tooling
    - Cloud GPU, Terraform, CLI, Cluster API, and docs support self-serve to production progression
    - Developer entry can expand into managed or multi-region infrastructure footprints
    - Positive but indirect
    - Request cohort attach rates from compute into databases, networking, Kubernetes, or inference
  - - Geographic and locality edge
    - 33 regions plus repeated customer references to being close to users or data
    - Regional coverage is a core wedge for gaming, media, telecom, and regulated workloads
    - Positive differentiator
    - Request active-account distribution by region and the percent of workloads using multiple regions
  - - Support, billing, and trust risk
    - Trustpilot, Website Planet, and 2024 TOS coverage create visible procurement friction
    - Customer quality can be undermined by account actions, refund disputes, or trust controversies
    - Material adverse signal
    - Review support SLAs, suspended-account policy, refund exceptions, and win-loss notes tied to trust concerns
  - - Reference quality
    - Many of the best references are company-curated and only one major enterprise proof point is independently corroborated
    - Named logos do not automatically prove deep production scale or renewals
    - Material caveat
    - Request live customer calls in each priority vertical and proof of production tenure
  - - Concentration economics
    - No public top-customer, top-partner, or ARR-band disclosure found
    - Economic concentration remains unknown despite visible adoption breadth
    - Material unknown
    - Request top-10 ARR concentration, largest account history, and partner-sourced ARR mix
  notes: Public evidence supports real usage and some upmarket traction, but not the economic durability or concentration profile investors need for underwriting.
