- id: TU004
  title: Retention / repeat usage / satisfaction table
  columns:
  - Signal
  - 2026 reading
  - What it suggests
  - Main caveat
  - Diligence ask
  rows:
  - - Hacker News developer thread
    - Multi-year users cite 5 to 9 years of mostly issue-free use plus custom ISO and BSD support
    - There is at least some long-tenure self-serve or SMB stickiness
    - Anecdotal and self-selected community evidence
    - Request retention by customer segment, not just aggregate anecdotes
  - - Trustpilot snapshot
    - 1.9 / 5 Poor from 531 reviews
    - Public satisfaction is polarizing and likely weakest around support or billing
    - Review sites over-index toward unhappy users
    - Review account-verification, refunds, suspensions, and billing dispute rates
  - - Trustpilot complaint themes
    - Billing disputes, terminated accounts, and refund complaints are visible in the archived text
    - Customer trust and payments friction are real adverse themes
    - Does not show how frequent these problems are across the installed base
    - Request complaint volume, chargeback rate, and refund policy exceptions
  - - Website Planet editorial review
    - Strong performance read, but outage, support, and no-return-policy concerns
    - Service quality is mixed rather than uniformly poor
    - Review article blends editorial testing with user reviews
    - Request support SLA attainment and incident-response metrics
  - - Docs, Terraform, CLI, Cluster API
    - Broad current operator tooling footprint
    - Workflow automation can create switching costs once deployed
    - Tooling breadth is not the same as economic retention
    - Request API-active account counts and multi-product attach by cohort
  - - Retention disclosure
    - No public NRR, GRR, churn, or renewal cohorts found
    - Durability remains a data-room question
    - Absence of evidence is not proof of weak retention
    - Request cohort retention, contract duration, and gross-dollar churn by segment
  notes: The table deliberately separates positive operator stickiness proxies from adverse review surfaces. None of the public proxies replace disclosed renewal economics.
