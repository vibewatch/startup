    - Community anecdotes are not representative of the whole base
  - - Verizon + DCD
    - Named enterprise AI Connect relationship
    - Best independent corroboration of upmarket enterprise relevance
    - No deployment-volume or revenue disclosure
    - Partner evidence is stronger than customer-economics evidence
  - - Official customer and sector pages
    - Many named references and clear use cases
    - Vultr can show production-style workloads across verticals
    - Most proof is company-curated
    - Reference quality is uneven and often lacks KPI or tenure detail
  notes: This table separates breadth of public proof from proof quality. Vultr has many visible references, but they vary materially in independence and economic depth.
