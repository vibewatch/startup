  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-economics
    missingEvidence: Net revenue retention, gross revenue retention, renewal rates, contract duration, and churn by customer segment.
    whyItMatters: Public references show adoption and some production proof, but they do not underwrite the durability of customer revenue.
    diligencePath: Request cohort retention tables, renewal calendars, contract term distribution, and churn bridges for developer, enterprise, and GPU-heavy accounts.
    relatedQuestionRefs:
    - QU013
    - QU014
    - QU026
    relatedTableRefs:
    - TU004
    - TU005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 customer ARR share, largest customer spend, partner-sourced ARR mix, and revenue by vertical or geography.
    whyItMatters: Vultr looks more upmarket than a pure self-serve host, but public sources do not show whether a few GPU or sovereign accounts dominate economics.
    diligencePath: Request customer concentration schedules, top-account historical spend, and partner influence on sourced or serviced ARR.
    relatedQuestionRefs:
    - QU025
    - QU026
    relatedTableRefs:
    - TU005
  - type: conflicting-data
    severity: material
    topic: customer-count-scale
    missingEvidence: A reconciled definition of customers, active accounts, and workloads, plus a dated time series.
    whyItMatters: The public record offers scale proxies and one large customer-count claim, but investors need a precise denominator before using headline totals in valuation or quality judgments.
    diligencePath: Ask management for definitions of active customer, active account, and enterprise customer plus the latest point-in-time counts and historical trend.
    relatedQuestionRefs:
    - QU012
    - QU026
    relatedTableRefs:
    - TU002
  - type: access-blocked
    severity: minor
    topic: case-study-accessibility
    missingEvidence: Live, directly accessible versions of some named Vultr case-study URLs and fuller KPI detail for healthcare and gaming references.
    whyItMatters: The fetched run could verify multiple named references through archived or solution-page content, but some dedicated case-study pages were bot-blocked or unavailable.
    diligencePath: Ask the company for a curated customer-reference pack or live customer-story links with dates and named contacts.
    relatedQuestionRefs:
    - QU004
    - QU020
    - QU026
    relatedTableRefs:
    - TU003
