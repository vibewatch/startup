- id: traction-proxies-and-unit-economics
  title: Public Traction Proxies, Unit Economics, and Margin Path
  body: 'The traction record is directionally positive but numerically unstable. Vultr''s own 2022 blog said parent company Constant had surpassed $125 million of ARR, 1.5 million users, and 50 million cloud deployments. Current revenue, however, is not public. Third-party trackers range from Latka''s $13.6 million estimate to Growjo and CompWorth at $37.2 million and Owler''s extremely broad $100 million-to-$500 million band. That dispersion is wide enough that it should be treated as evidence of uncertainty rather than as triangulation. Management also said Vultr was profitable when it announced the June 2025 debt raise, but it did not define whether that meant GAAP earnings, adjusted EBITDA, or free cash flow. Peer disclosures show why that distinction matters: DigitalOcean and OVHcloud both report EBITDA margins above 40%, while Akamai and OVHcloud still carry meaningful capital intensity and CoreWeave''s SEC-filed release shows how GPU-heavy models can also accumulate large debt balances.
    For Vultr specifically, gross margin, depreciation policy, utilization, CAC, payback, NRR, fraud loss, and customer concentration all remain undisclosed. So the reasonable conclusion is not that unit economics are weak, but that the chapter can only frame their likely drivers, not confirm them.'
