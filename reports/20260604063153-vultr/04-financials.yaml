  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financing structure
    missingEvidence: Exact primary-versus-secondary split for the 2024 equity round, plus funded-at-close amounts and full legal terms for the 2025 credit and lease package.
    whyItMatters: These details determine how much fresh capital actually entered the business and what repayment or covenant burden the 2025 package adds.
    diligencePath: Request the 2024 round deck, cap-table summary, lender presentation, and executed credit and lease agreements.
    relatedQuestionRefs:
    - QI001
    - QI004
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: current revenue run-rate
    missingEvidence: Current ARR, trailing revenue, gross profit, monthly burn, and base-case runway as of the 2025 financing.
    whyItMatters: Without current scale and cash-generation data, leverage tolerance and next-round timing cannot be underwritten.
    diligencePath: Request a monthly management reporting pack covering ARR, recognized revenue, gross profit, operating cash flow, and runway scenario planning.
    relatedQuestionRefs:
    - QI005
    - QI024
  - type: private-evidence-only
    severity: material
    topic: gross margin and utilization
    missingEvidence: Product-level gross margin, hardware useful life, fleet utilization, and maintenance-versus-growth capex split.
    whyItMatters: Those variables determine whether AI infrastructure expansion is compounding free cash flow or simply increasing financed asset intensity.
    diligencePath: Request board or finance-team materials showing depreciation schedules, hardware utilization, and capex budgeting by asset class.
    relatedQuestionRefs:
    - QI009
  - type: conflicting-data
    severity: material
    topic: revenue estimate dispersion
    missingEvidence: A single management-approved revenue and ARR figure that reconciles the conflicting third-party trackers.
    whyItMatters: The current public range is wide enough to change leverage, valuation support, and underwriting conclusions.
    diligencePath: Request the latest board-approved ARR, revenue, and growth KPI pack and reconcile it against any external data vendors management monitors.
    relatedQuestionRefs:
    - QI005
    - QI026
  - type: enumeration-incomplete
    severity: minor
    topic: pricing / monetization table
    missingEvidence: Discount waterfalls, reseller economics, enterprise commit structures, and geographic tax leakage that sit between list price and realized pricing.
    whyItMatters: List pricing alone can overstate yield and understate revenue leakage on larger or international accounts.
    diligencePath: Request sample enterprise order forms, the standard discount policy, and invoicing mix by geography and payment method.
    relatedQuestionRefs:
    - QI007
    - QI008
    - QI018
    relatedTableRefs:
    - TI002
  - type: enumeration-incomplete
    severity: material
    topic: public financial gaps table
    missingEvidence: A complete diligence request list covering customer concentration, retention, fraud, working capital, procurement commitments, and facility-level lender reporting.
    whyItMatters: The current register captures the most material blockers, but a full underwriting workplan will expand once private financials are opened.
    diligencePath: Convert this chapter into a formal diligence tracker and extend it after reviewing the first finance data-room drop.
    relatedQuestionRefs:
    - QI014
    - QI015
    - QI016
    - QI019
    - QI020
    - QI025
    relatedTableRefs:
    - TI005
