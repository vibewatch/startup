- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing private metric
  - Why it matters
  - Current public state
  - Exact diligence path
  rows:
  - - Current ARR and billed revenue by product family
    - Needed to size leverage, valuation support, and mix quality
    - No current company disclosure; third-party estimates conflict
    - Request monthly recurring revenue, trailing revenue, and product-family bridge
  - - Gross margin by compute / GPU / storage
    - Determines whether hardware expansion is accretive
    - Not publicly disclosed
    - Request gross-margin walk by workload and region
  - - Profitability bridge (GAAP, EBITDA, FCF)
    - Clarifies what management meant by profitable
    - Only a qualitative profitability claim is public
    - Request audited or board-level profitability bridge
  - - Monthly burn and runway
    - Needed to assess next-round timing and debt tolerance
    - Not publicly disclosed
    - Request cash balance, monthly burn, and base/upside/downside runway
  - - Full debt agreement terms
    - Interest, covenants, collateral, and draw mechanics change risk materially
    - Only principal package sizing is public
    - Request credit agreement, lease schedules, and lender presentation
  - - Utilization and depreciation assumptions
    - Hardware payback depends on both
    - No public disclosure found
    - Request fleet utilization, depreciation policy, and refresh assumptions
  - - Customer concentration and retention
    - Revenue quality depends on concentration and NRR
    - No public NRR or concentration disclosure
    - Request top-10 customer mix, logo retention, and NRR by segment
  - - Discounting, reseller economics, and tax leakage
    - List price is not realized price
    - Public list prices exist but negotiated economics do not
    - Request standard discount waterfall and geographic invoicing mix
