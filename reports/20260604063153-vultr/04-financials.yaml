- id: underwriting-view-and-diligence-blockers
  title: Financial Verdict and Diligence Blockers
  body: 'Vultr''s revenue quality looks structurally plausible, but its underwriting quality is still incomplete. The positive side is clear enough: customers can discover entry pricing, the product catalog supports multiple monetization surfaces, metered overages exist, AI infrastructure demand appears real, and both equity and bank lenders have recently funded growth. The caution is equally clear: the company has not published current ARR, product revenue mix, gross margin by workload, depreciation schedules, burn, runway, concentration, or the legal terms attached to the 2025 debt package. Even the public revenue estimates that do exist are contradictory enough to be unusable as factual anchors. That leaves the chapter with a bounded conclusion. Vultr may have a healthy margin path if utilization is strong and debt is conservatively structured, but the low-end revenue scenarios circulating in third-party trackers would materially change leverage tolerance, covenant headroom, and valuation
    support. Before underwriting, diligence should request current ARR and billed revenue by product family, profitability bridges, hardware depreciation schedules, utilization and procurement assumptions, the full credit agreement, customer concentration, and retention metrics. Until then, the right stance is constructive on model quality but cautious on financial precision.'
