company:
  name: Vultr
chapter:
  number: 4
  title: Financials
  summary: 'Vultr''s financial picture is defined more by disclosed financing and pricing surfaces than by published operating metrics. The public record supports three high-confidence facts: Vultr anchored its first outside equity round at a $3.5 billion valuation in December 2024, added a $329 million credit-plus-lease package in June 2025, and publicly claims profitability while still withholding current revenue, margin, burn, and covenant detail. List pricing for compute, GPU, bare metal, snapshots, and bandwidth is visible enough to describe the revenue model, but realized pricing, product-level gross margin, utilization, and runway remain private, leaving underwriting dependent on direct diligence.'
sections:
- id: pricing-and-monetization
  title: Revenue Model, Pricing Surface, and Monetization Opacity
  body: 'Vultr''s public evidence is strongest on how products are sold, not on how much revenue each stream produces. Official billing docs point customers to a centralized pricing page and disclose specific metered add-ons such as $0.05 per GB-month for snapshots and $0.01 per GB for bandwidth overage, both billed in USD. Third-party pricing surfaces add more visible entry points: TrustRadius says pricing starts at $2.50 across nine plan options; G2 lists Cloud Compute at $2.50 per month, Optimized Cloud Compute at $28, Bare Metal at $120, and Cloud GPU from $90; GPUs.io reports about twenty GPU configurations spanning roughly $0.48 to $1.56 per GPU-hour. Together, those sources support a hybrid monetization model: low-friction self-serve entry SKUs, metered usage expansion through storage and bandwidth, and richer GPU or bare-metal spend for heavier enterprise workloads. What is still missing is the realized layer between list price and booked revenue. The public record does not disclose
    enterprise discounts, reseller economics, international tax leakage, contract duration, or what share of bookings comes from usage-based versus committed spend. That means the revenue bridge can be described mechanically, but not yet underwritten economically.'
  claimRefs:
  - CI006
  - CI007
  - CI008
  - CI009
  - CI010
