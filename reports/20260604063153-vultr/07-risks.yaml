- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable indicator
  - Threshold / event
  - Investment implication
  rows:
  - - Trust or policy-language failure
    - Independent adverse coverage or customer backlash around data rights, privacy, or policy changes
    - A new controversy that forces Vultr to reverse policy language or publicly clarify customer-data usage again
    - Treat as a thesis break because it would directly contradict the sovereignty and trust narrative
  - - Support and reputation deterioration
    - Structured review surfaces and open complaint channels
    - Noticeable worsening in Gartner, TrustRadius, or broad review sentiment without evidence of remediation
    - Escalate diligence on churn, support costs, and enterprise conversion risk before adding exposure
  - - Operational transparency gap
    - Status communications and incident handling
    - Pattern of significant incidents without credible root-cause communication or corrective-action evidence
    - Downgrade confidence in reliability underwriting and demand private incident data
  - - Sovereign / public-sector proof gap
    - Named compliance wins, procurement references, or audit evidence
    - Narrative keeps expanding but independently evidenced wins do not follow within the next selling cycle
    - Treat as a thesis break for the regulated-workload growth leg
  - - GPU capacity slippage
    - Roadmap announcements versus live availability and customer proof
    - Advanced GPU launches remain preorder-led or delayed long enough to stall customer delivery
    - Re-underwrite growth, capex payback, and lender dependence immediately
  - - Financing stress
    - Credit availability, covenant flexibility, or implied leverage tolerance
    - Signs that future expansion requires materially worse financing terms or operational underperformance reduces flexibility
    - Shift the rating toward financial-model risk even if demand indicators remain strong
  - - Competitive price compression / obsolescence squeeze
    - Public GPU price benchmarks, new silicon launches, and management utilization disclosure
    - Hyperscaler catch-up or neocloud price wars force downward repricing before existing fleets have earned back financing assumptions
    - Re-underwrite depreciation, margin, and debt headroom before relying on AI-capacity upside
  notes: Triggers are designed to be monitorable from public disclosures plus standard management diligence. Yellow flags should trigger deeper underwriting; thesis breaks should halt the existing investment case until re-scored.
