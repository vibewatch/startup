tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Risk / issue
  - Jurisdiction / surface
  - Current public status
  - Likelihood
  - Severity
  - Mitigation maturity
  - Residual exposure
  - Diligence path
  rows:
  - - Customer-data rights or policy-language controversy
    - Terms, privacy, and trust positioning across enterprise and public-sector accounts
    - Historically surfaced in 2024 and reputationally relevant in 2026
    - Medium
    - Critical
    - Moderate — management revised the clause after backlash and now leans on trust messaging
    - High — a repeat incident would directly undermine sovereignty and privacy positioning
    - Request current legal review process, change-management controls for policies, and board visibility into trust incidents
  - - Sovereign-cloud procurement or compliance shortfall
    - Government, public-sector, and regulated-workload selling
    - Narrative is strong, but independent proof is limited versus the breadth of the promise set
    - Medium
    - High
    - Low-Moderate — company has public-sector and sovereignty materials, but most are self-authored
    - High — procurement failure would slow higher-value growth and damage category credibility
    - Request named wins, audit scope, certification matrix, and any sovereign or government procurement references
  - - EU AI Act and cross-border policy complexity
    - Europe and global AI deployments touching regulated data or regulated use cases
    - Visible in Vultr marketing and whitepapers, but implementation burden remains hard to verify externally
    - Medium
    - High
    - Moderate — company is clearly engaging with the topic
    - Medium-High — customers may demand more evidence than marketing materials provide
    - Request legal interpretation, product guardrails, data-governance controls, and customer-assurance playbooks for EU AI Act exposure
  - - Privacy and consumer-law expectations for trust-sensitive workloads
    - Privacy notice, data-locality claims, and regulated-workload sales motions
    - Public pages signal attention to privacy and compliance, but independent control proof is thin
    - Medium
    - High
    - Moderate — compliance and security pages exist
    - Medium-High — policy ambiguity or control gaps would have outsized reputational cost
    - Request current privacy policy, DPA terms, subprocessor list, and evidence of external assurance beyond marketing claims
  notes: Rows are ranked by residual exposure after known public mitigations, not by raw theoretical harm. The table emphasizes the risks most likely to change investment underwriting.
