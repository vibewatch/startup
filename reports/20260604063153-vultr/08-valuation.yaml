- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - 'THESIS: Vultr has real capital-market validation'
    - A $3.5B equity round and a later $329M bank-led debt package are stronger financing signals than most private infrastructure peers disclose publicly.
    - This would weaken if the next financing arrives below the 2024 mark or if the debt package later needs amendment.
  - - 'THESIS: AI infrastructure is more than narrative'
    - Visible GPU pricing, MI300X and Chicago architecture announcements, and AMD-backed messaging support a real AI workload monetization path.
    - It would strengthen with cohort utilization, payback, and gross-margin disclosure by GPU family.
  - - 'THESIS: Sovereign-cloud positioning can justify premium demand'
    - Independent reporting shows Vultr trying to sell local-control and in-country infrastructure to sensitive AI buyers.
    - It would strengthen with disclosed sovereign or public-sector wins and harder procurement evidence.
  - - 'ANTI-THESIS: Public denominator support is weak'
    - Current public revenue anchors are either stale or low-authority, so investors cannot verify the mark against current economics.
    - This would improve quickly if management opens a current ARR and gross-margin bridge.
  - - 'ANTI-THESIS: Debt shifts risk into leverage'
    - The 2025 package reduced dilution but added covenant, collateral, and asset-payback risk.
    - This would ease if the credit agreement shows generous headroom and hardware recovery periods are short.
  - - 'ANTI-THESIS: AI comps can mislead when they trade on optionality'
    - CoreWeave and especially Nebius show how far AI names can rerate, but those public names also disclose more current operating data than Vultr does.
    - This would improve if Vultr can prove comparable growth and utilization rather than just comparable theme exposure.
  notes: The bull case is about real platform momentum; the anti-thesis is mostly about missing economics and financing terms, not about lack of demand.
